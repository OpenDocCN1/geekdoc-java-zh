- "# JAVA Internet 编程秘籍\n\n\n\n![](img/cover09342.jpeg)\n\n\n## 第四部分：Java 与网络\n\n\n\
  \n\n## 图 1.2.\n\n```java\nfinal class foo {\n    ...\n}\n```\n\n### Key extends\n\
  \n继承关系是通过 `extends` 关键字实现的。任何类最多扩展（换句话说，继承自）另一个类。因此，该语言不支持显式的多继承。然而，接口的使用允许你实现某些属性继承。\n\
  \nJava 中的所有对象都继承自一个通用的父类。如果类规格说明中没有指定父类，则默认新创建的类将成为 `Object` 类的子类。要显式指定父类，请使用 `extends`\
  \ 关键字。如果我们上面定义了 `foo` 类，我们可以通过以下方式创建它的子类 `bar`：\n\n```java\nclass bar extends foo\
  \ {\n    ...\n}\n```\n\n子类继承其父类的所有的方法和变量。你可以在子类中使用不同值的对应标识符来覆盖或隐藏这些某些变量和方法。为了访问被遮蔽的标识符，你可以使用特殊变量\
  \ `super`，它指向类层次结构中距离给定类最近的父类。假设类 `foo` 中有一个名为 `test` 的方法，而在子类 `bar` 中通过创建一个同名方法遮蔽了该方法。要访问在\
  \ `foo` 中定义的原始 `test` 方法，必须采用以下条目：\n\n```java\nclass bar extends foo {\n    void\
  \ test() {\n        super.test(); // 调用在父类-foo 中定义的 test 方法 (foo.test)\n       \
  \ ...\n    }\n}\n```\n\n\n\n\n`<name parent class> implements <name interface> {...}`\n\
  \n在此声明中，除了 `class` 关键字和正在定义的类名之外，所有内容都是可选的。如果该类是某个接口的实现，它必须完成在该接口中定义的某些代码方法。该规则的唯一例外是当定义的类本身是\
  \ `abstract`（抽象的）；在这种情况下，接口方法的具体实现可以传递给给定类的子类。\n\n假设在 `US` 有名为 `shapeInterface`\
  \ 的接口，它包含两个方法 - `draw` 和 `erase`。\n\n那么我们可以定义一个名为 `shapes` 的 `Class` 来实现这个接口：\n\n\
  ```java\nclass shapes implements shapeInterface { \n    void draw() {...} \n   \
  \ void erase() {...} \n}\n```\n\n如果你想创建一个同时实现多个接口的类，那么这些接口的名字必须列在 `implements` 关键字之后，并用逗号隔开。在这种情况下，生成的类必须实现每个接口的所有方法。假设我们有两个接口\
  \ `shapeInterface` 和 `moveableInterface`。在这种情况下，我们可以定义一个 `dragDrop` 的 `Class`，同时实现这两个接口：\n\
  \n```java\nclass dragDrop implements shapeInterface, moveableInterface {\n    ...\n\
  }\n```\n\n关于接口更有意义的讨论你可以在第 3 章“Java 面向对象”。接口的声明语法在本章后面的“接口（Interfaces）”部分给出。\n\n\
  ## 修饰符变量\n\n通过在类中定义变量，你可以利用一些修饰符。这些修饰符的存在改变了变量的属性，例如来自其他类的可用性、变量在多线程条件下的行为，以及变量是否为静态或最终。变量声明可以指示以下修饰符：`public`、`private`、`protected`、`static`、`final`、`transient`\
  \ 和 `volatile`。\n\n变量从程序其他部分的访问性受修饰符 `public`、`protected`、`private` 的影响。用 `public`\
  \ 关键字声明的变量在其所在的包以及任何其他包中都是可用的。在所有修饰符中，`public` 对变量可用性的限制最小。\n\n在类 `C` 中用 `protected`\
  \ 修饰符声明的变量对该包内的所有类以及所有类 `C` 的子类都是可用的。换句话说，不在该包中且不是类变量的定义类 `C` 子类的类不可访问。\n\n如果类 `C`\
  \ 中的变量被声明为 `protected`，这意味着它只能被类 `C` 的子类访问。在同一个包的其他类中，该变量是不可用的。因此，如果你需要将变量的作用范围限制为类本身及其子类，请使用\
  \ `private` 和 `protected` 的组合。\n\n最后，最限制变量可用性的修饰符是 `private`。`private` 修饰符使变量在给定类之外变得不可见。即使是给定类的子类也无法访问声明为\
  \ `private` 的变量。\n\n这里有一个例子，使用了所有四种修饰符访问：\n\n```java\nclass circle {\n    public\
  \ String classname; \n    protected int x,y;\n    protected float radius; \n   \
  \ private int graphicsID;\n}\n```\n\n如果用 `static` 关键字声明变量，这意味着该变量对于该类的所有实现来说都是通用的。此类变量的空间在编译时分配，因此你不需要实例化类即可访问该变量。例如，在\
  \ `java.lang` 包的 `Math` 类中，就有 `PI` 常量变量。无需该对象的任何实现，我们可以立即访问该变量：\n\n```java\nSystem.out.println(\"\
  PI = \" + Math.PI);\n```\n\n修饰符 `final`：它指的是常量，意味着赋予变量的值可能被更改。\n\n该变量的声明必须包含初始化\
  \ - 赋值初始值，在程序其他地方任何更改变量值的尝试都将在编译时导致错误信息。`final` 修饰符通常用于定义常量。不过，不可变常量通常具有 `public`\
  \ 和 `static` 修饰符。因此，在类 `foo` 中，你可以按照以下方式定义常量 `Answer`：\n\n```java\nclass foo {\n\
  \    public static final int Answer = 42;\n}\n```\n\n最后，修饰符 `transient` 和 `volatile`\
  \ 与 Java 语言有关，涉及到程序背后的多线程执行。这些修饰符的主要目的是让编译器更容易优化多线程代码。用 `transient` 关键字声明的变量不能被持久化状态的对象拥有。`transient`\
  \ 词将用于在未来的版本中实现某些功能。\n\n声明为 `volatile` 的变量是已知可以异步变化的。用此关键字声明的变量将在所有人使用并重新启动后在内存中的位置被重新加载。`transient`\
  \ 和 `volatile` 关键字保留供未来使用，尽管它们现在就可以程序中使用。（关于从 `volatile` 关键字声明的变量，你将在第 11 章学习。）\n\
  \n## 方法修饰符\n\n在声明方法时，可以使用表 13 列出的修饰符。`public`、`protected` 和 `private` 的作用与声明变量时相同，用于限制对方法的访问。\n\
  \n表 13. 方法修饰符\n| 修饰符 |  |\n| :--- | :--- |\n| public | |\n| protected | |\n| private\
  \ | |\n| static | |\n| abstract | |\n| final | |\n| native | |\n| synchronized |\
  \ |\n\n`static` 修饰符允许你在所属的类未被实现的情况下使该方法可用。声明为 `static` 的方法也使用 `final` 修饰符 - 换句话说，重写静态方法是不可能的。在\
  \ `static` 方法内部，你只能访问给定类的也是静态的成员。\n\n## Applet\n\n第五章\n\n工作中的 Applet\n\n鼠标事件：产生、生成的键盘事件\n\
  \n事件处理器：其内部到底发生了什么？\n\nApplet 的完成阶段：资源访问\n\n参数访问：用户交互\n\n动画流：接口 runnable\n\n流的简单方法：消除闪烁\n\
  \n到目前，你应该理解自顶向下编程和面向对象编程的区别，并对 Java 语言的语法和语义有理解。好了，现在是时候开始编程了。\n\n\n\n\n在接下来的章节中，将介绍编写\
  \ applet 的基础知识。让我们先从如何扩展 `Applet` 类开始，并描述一些重要的变通方法，以实现你所需的 applet 行为。我们将向你展示如何使用\
  \ `Applet` 类的方法从网络获取图像和声音。你将学习如何从 HTML 代码中获取参数，以便你的 applet 能够在无需重新编译的情况下出不同的行为。我们将解释如何让\
  \ applet 响应鼠标和键盘输入。最后，我们将展示如何使用线程使 applet 产生动画，以及如何消除 applet 中令人烦恼的闪烁。\n\n## 什么是\
  \ applet？\n\nApplet 将复杂图形窗口的元素与易用性和网络能力结合在一起。从本质上说，它是一个微型图形用户界面，类似于微软 Windows 或\
  \ X11，它保证了开发者无论使用何种类型的计算机或其管理器，都具有基本相同的功能。\n\nApplet 对于编写互联网应用程序非常有用，因为它们可以嵌入 HTML\
  \ 文档中，并在允许使用 Java 语言的 Web 浏览器中执行，例如 Netscape Navigator 2.0。要创建你自己的 applet，你需要扩展\
  \ `Applet` 类并在 Web 页面中引用新类。让我们考虑一下 \"Hello world\" applet，就像我们在第 2 章《Java 编程基础》中过的\
  \ applet 一样。\n\n示例 5-1a. Applet Hello world\"。\n\n```java\nimport java.applet.*;\n\
  import java.awt.*;\n\npublic class helloworldapplet extends applet {\n    public\
  \ void init() {\n        resize(250,250);\n    }\n\n    public void paint(Graphics\
  \ g) {\n        g.drawString(\"Hello world!\",25,25);\n    }\n}\n```\n\n\"Hello\
  \ World\" applet 扩展了 `Applet` 类，这意味着 `Applet` 类可用的所有方法和变量对我们该类的扩展也可用。例如，取其中的两个方法——`init`\
  \ 和 `paint`——我们可以对它们的默认行为进行更改，以便它们执行我们需要的功能。考虑包含 \"Hello World\" applet 的 Web 页面\
  \ HTML 代码。\n\n示例 5-1b. Web page Hello world\"。\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Hello\
  \ World Apple</TITLE>\n</HEAD>\n<BODY>\n<APPLET CODE=\"HelloWorldApplet.class\"\
  \ WIDTH=250 HEIGHT=250>\n</APPLET>\n</BODY>\n</HTML>\n```\n\n![](img/image09207.jpeg)\n\
  \n建议：`<APPLET>` 标签在本文编写时尚未包含现有标准中。HTML 联盟 W3 (W3C) 是开发[万维网。](http://WWW/) 标准的权威小组。这种语法目前仅由\
  \ Netscape Navigator 2.0 浏览器和能够解释 Java 的 Sun applet 查看器使用。因此，那里可能存在一个与其它类似的、上存在的非标准标签，不属于标准的\
  \ HTML 标记标签，是 netscape 使用的 -tags\n\n![](img/image09208.jpeg)<CENTER> 和 `<BLINK>`。W3C\
  \ 目前建议插入到 Web 页面中的应用程序使用 `<INSERT>` 标签；你可以在此处找到此主题的最新新闻：[`flwww.w3.orglpub/WWW/TR/WD-insert.html.`](http://flwww.w3.orglpub/WWW/TR/WD-insert.html)\n\
  \n`<APPLET>` 标签内部的参数 `CODE` 定义了编译后的 applet 类的完整 URL——在这里假设此 HTML 页面与 hello world\
  \ 类在同一目录下。注意，通过属性 `WIDTH` 和 `HEIGHT` 必须告诉浏览器此 applet 有多大，以便浏览器能够正确格式化页面。在 Netscape\
  \ Navigator 2.0 下，你可以将这些属性设置为 100%，这将强制浏览器为 applet 提供它所需的多少空间。\n\nJava 中的 applet\
  \ 在风格上与其他语言的程序不同。Java 代码在很大程度上是事件驱动的，类似于 Web 上的超文本，而不是传统编程中常见的线性流。运行时环境——Web 浏览器——充当代码与其执行计算机之间的接口。这种通信在图\
  \ 5-2 中所示。\n\n![](img/image09209.gif)\n\n#### 图 5.2。\n\n运行时环境理解 `paint` 和 `mouseMove`\
  \ 等 applet 方法，并在需要时触发它们——例如，当需要重绘屏幕或反映鼠标移动时。默认情况下，当调用这些方法时，applet 什么都不做——如果程序员想让\
  \ applet 响应相关变化，他必须自己重写这些方法。\n\n## applet 的执行阶段\n\n当兼容 Java 的 Web 浏览器加载 `Applet`\
  \ 类时，它首先为 applet 和全局变量分配内存。然后执行 `init` 方法。（通常，程序员使用 `init` 方法初始化全局变量，从网络获取资源并安装用户界面。）随后，浏览器调用\
  \ `start` 方法。如果包含 applet 的浏览器部分可见，则调用 `paint` 方法。当用户离开页面时，浏览器调用 `stop` 方法。接下来的代码段说明明了其工作原理。示例\
  \ 5-2. applet。\n\n```java\nimport java.applet.*;\nimport java.awt.*;\n\npublic class\
  \ Count extends applet {\n    int InitCount=0;\n    int StartCount=0;\n    int StopCount=0;\n\
  \    int PaintCount=0;\n\n    public void init() {\n        resize(250,75);\n  \
  \  }\n\n    public void start() {\n        StartCount++;\n    }\n\n    public void\
  \ stop() {\n        StopCount++;\n    }\n\n    public void paint(Graphics g) {\n\
  \        PaintCount++;\n        String Output = \"Inits:\"+InitCount+\" Starts:\"\
  +StartCount+\" Stops:\"+StopCount+\" Paints:\"+PaintCount;\n        g.drawString(Output,25,25);\n\
  \    }\n}\n```\n\napplet 首次启动后的输出如图 5-3 所示。applet 初始化了一次，启动了一次，从未停止，至少绘制了一次。\n\n\
  ![](img/image0210.gif)\n\n#### 图 5.3。\n\n如果你去另一个页面再回来（不退出浏览器），你会发现 applet 仅初始化了一次，但运行了两次，停止了一次，重绘了两次。这反映在图\
  \ 5-4 中。\n\n![](img/image0211.gif)\n\n#### 图 5.4。\n\n![](img/image0212.jpeg)\n\n\
  ![](img/image0213.jpeg)建议：在 Netscape Navigator 2.0 中点击刷新按钮将强制当前页面上的 applet 保持并重新启动。\n\
  \n如果你通过移动另一个窗口到 applet 窗口上方来遮挡 applet，然后将其移动到最上方使其激活，你会发现 applet 没有重新启动也没有停止，但窗口被重绘了。在表\
  \ 5-1 给出了 applet 类的一些重要方法。\n\n表 5-1. applet 类的主要方法\n\n| 方法 | 描述 |\n| :--- | :---\
  \ |\n| `init()` | 首次加载 applet 时调用。 |\n| `start()` | 当包含 applet 的 Web 页面变为激活状态时调用。\
  \ |\n| `stop()` | 当包含 applet 的 Web 页面不再激活时调用。 |\n| `destroy()` | 显式销 applet 时调用。\
  \ |\n| `paint(Graphics g)` | 当 applet 需要重绘图形窗口时调用。 |\n\n\n\n\nJava 语言提供了一种更简单且更强大的方式。\n\
  \nHTML - 文档描述语言；Java 是一种很好的编程语言。你的 Java applet 可以使用 `Images` 作为图形象形或游戏街机风格的 `sprites`。下面的\
  \ Java applet 从网络接收接收图像和声音文件并显示它们。\n\n示例 5-3. Web applet。\n\n```java\nimport java.applet.*;\n\
  import java.awt.*;\nimport java.net.*;\n\npublic class webapplet extends applet\
  \ {\n    private Image myImage;\n    private AudioClip mySound;\n    private URL\
  \ ImageURL;\n    private URL SoundURL;\n\n    public void init() {\n        resize(250,250);\n\
  \        try {\n            // 将 URL 绑定到资源\n            ImageURL = new URL(\"http://www.vmedia.com/vvc/onlcomp/java/chapter5/images/sample.gif\"\
  );\n            SoundURL = new URL(\"http://www.vmedia.com/vvc/onlcomp/java/chapter5/sounds/sample.au\"\
  );\n        }\n        // 确保 URL 是正确的 catch (MalformedURLException e) {}\n     \
  \   // 加载图像\n        myImage = getImage(ImageURL);\n        // 加载声音\n        mySound\
  \ = getAudioClip(SoundURL);\n    }\n\n    public void start() {\n        // 播放声音\n\
  \        mySound.loop();\n    }\n\n    public void stop() {\n        // 停止声音\n \
  \       mySound.stop();\n    }\n\n    public void paint(Graphics g) {\n        //\
  \ 绘制图像\n        g.drawImage(myImage,0,0,this);\n    }\n}\n```\n\n这段代码段包含了三个你可能不熟悉的类引用：`java.awt.Image`、`java.applet.AudioClip`\
  \ 和 `java.net.URL`。这些类就像 Java API 中的大多数类一样，其功能或多程度上与其名称所含义的一致。\n\n### Image 类\n\n\
  `Image` 类定义了一个简单的二维图形图像。`Graphics` 类（由 `paint` 方法使用）可以使用 `drawImage` 方法绘制图像，如下例所示：\n\
  \n```java\nImage myImage;\nmyImage = createImage(50, fifty);\ng.drawImage(myImage,\
  \ 0, 0, this);\n```\n\n`createImage` 方法定义在 `java.awt.Component` 类上，它是 `Applet` 类的父类。该方法接受两个\
  \ `int` 类型的参数，并根据给定尺寸为图像创建一个新空间。\n\n方法 `drawImage` 四个参数：图像、图像在窗口中的坐标位置以及 `ImageObserver`\
  \ 类。我们将在第 9 章“图形与图像”中详细描述此类，现在只需在使用 `drawImage` 时直接将你的 applet 替换为质量参数 `ImageObserver`\
  \ 即可。\n\n![](img/image09214.jpeg)\n\n建议：如果你有必要将 applet 作为参数传递，可以使用关键字\n\n![](img/image09215.jpeg)\
  \ 这种，这在第 4 章“语法与语义”中提到过。\n\n`applet` 类使用 `getImage(URL)` 方法从网络接收 `Images`。该方法完成自帮助接口\
  \ `AppletContext`（见上文侧边栏“Interface AppletContext”）。\n\n因此，Java applet 可以导入 浏览器支持的任何图形格式的图像。最常用的格式是\
  \ GIF 和 JPEG。图像加载通常需要一段时间，但我们可以在 applet 中继续并输出 `Images`，尽管实际上 `Images` 不会立即出现，而是持续一段时间后出现。如果你对图像有更多控制，可以使用\
  \ `media tracker` 类，我们将在第 9 章讨论它。\n\n### AudioClip 类\n\n`java.applet.AudioClip`\
  \ 类是音频数据的高级表示。该类定义了三个方法：`play`、`loop` 和 `stop`。`applet` 类定义了 `getAudioClip` 方法，它根据给定的\
  \ `URL` 返回声音文件。与 `getImage` 方法一样，`getAudioClip` 方法实际上是由 applet 上执行的；因此，applet 能够使用浏览器支持的任何声音格式。例如，下面的代码：\n\
  \n```java\nAudioClip mySound;\nmySound.play();\n```\n\n播放此 `AudioClip` 代表的声音。`Applet`\
  \ 类定义了一个方法 `play(URL)`，当给定声音文件的 `URL` 时，播放该文件。如果音频文件丢失或格式不受支持，则什么都不会发生。`AudioClip`\
  \ 类和 `Image` 一样，在请求声音时即可使用，但实际上加载和播放声音可能需要一些时间。遗憾的是，可用于在使用之前加载图像的 `MediaTracker`\
  \ 类尚未支持 `AudioClip`。\n\n### URL 类\n\n`URL` 类，或统一资源定位符（“统一资源”）—— Web 的完整地址。Java 语言有一个专门的类来处理\
  \ URL。它的实例是一个包含内容的对象：\n\n```java\nURL myObject;\nmyObject = new URL(\"http://www.vmedia.com/vvc/onlcomp/java/chapter5/images/sample.gif\"\
  );\n```\n\n（注：原文中 URL 存在一些显示异常，让我们重新格式化逻辑：\n\n`URL` 类，或统一资源定位符（“统一资源”）—— Web 的完整地址。Java\
  \ 语言有一个专门的类来处理 URL。它的实例是一个包含内容的对象：\n\n```java\nURL myObject;\ntry {\n    myObject\
  \ = new URL(\"http://www.vmedia.com/vvc/onlcomp/java/chapter5/images/sample.gif\"\
  );\n}\ncatch (MalformedURLException e) {\n    // 此处执行代码\n}\n```\n\n\n\n你可能注意到我们在示例\
  \ applet 中插入了一些数据，但具体来说是 `URL` 图像和声音文件。如果你是一名专业的程序员或计算机科学教授，你可能已经注意到了并露出了苦脸——对于既定标准来说，这种编程方式是不可接受的。每你想更改此\
  \ applet 使用的图像或声音文件时，都需要修改代码并重新编译该类。幸运的是，`Java` 有一种方法可以在运行时向 applet 传递参数，这些参数可以用于定义各种图形或声音文件。\n\
  \n## 访问参数\n\n优秀高级语言的一个特性是能够从命令行中获取参数。程序员利用此根据用户输入来改变程序的行为，从而减少对复杂用户界面的需求。但 `Java`\
  \ applet 并不是从命令行运行的，因为它们（以及它们的参数“命令行”）是嵌套在内部 HTML 代码中的。\n\n考虑下面的网页。\n\n示例 5-4a.\
  \ 来自参数的网页。\n\n```html\n<HTML>\n<HEAD>\n<TITLE>Good web Apple</TITLE>\n</HEAD>\n\
  <BODY>\n<APPLET CODE=\"GoodWebApplet.class\" WIDTH=250 HEIGHT=250>\n<PARAM NAME=\"\
  IMAGE\" VALUE=\"http://www.vmedia.com/vvc/onlcomp/java/chapter5/images/sample.gif\"\
  >\n<PARAM NAME=\"SOUND\" VALUE=\"http://www.vmedia.com/vvc/onlcomp/java/chapter5/sounds/sample.au\"\
  >\n</APPLET>\n</BODY>\n</HTML>\n```\n\n在这一段代码中，我们嵌套了一个名为 `IMAGE` 值为 `\"/images/sample.gif\"\
  ` 的变量。applet 可以使用 `getParameter` 访问 `IMAGE` 变量，该方法接收质量参数中的 `name` 变量并返回包含变量值的行。`SOUND`\
  \ 参数也是如此。所有选项都以字符串的形式呈现。\n\n![](img/image09216.jpeg)\n\n在第 6 章“应用层编程”中，你会了解到如何将字符串类型变量转换为其他类型。如果你需要数字类型的参数，这将会非常有用。\n\
  \n![](img/image09217.jpeg)\n\n利用这些新的功能机会，我们可以重写用于 Web applet 的 `init` 方法，使其独立于数据。\n\
  \n示例 5-4b. 改进后的 Web applet。\n\n```java\npublic void init() {\n    String ImageParam;\n\
  \    String SoundParam;\n    resize(250,250);\n    // 值从 HTML 文件中获取\n    ImageParam\
  \ = getParameter(\"IMAGE\");\n    SoundParam = getParameter(\"SOUND\");\n    try\
  \ {\n        // 使用参数获取 URL\n        ImageURL = new URL(ImageParam);\n        SoundURL\
  \ = new URL(SoundParam);\n    } catch (MalformedURLException e) {}\n    myImage\
  \ = getImage(ImageURL);\n    mySound = getAudioClip(SoundURL);\n}\n```\n\n通过允许图像和声音文件的位置由网页作者而非程序员来决定，我们让\
  \ applet 变得有用得多。作者要更改 applet 使用的图像或声音，只需更改任何参数的 `VALUE` 标签即可。当你有一个显示频繁变化数据的 applet，或者你想让网页作者轻松更改\
  \ applet 的默认行为时，你必须使用相应的参数。\n\n尽管这些选项非常有用，但它们允许 applet 只以一种狭窄的方式与用户交互——通过选择在程序启动前编写的行。但是当用户移动鼠标或按下某些键时，如何动态改变\
  \ applet 的行为呢？复杂的应用程序需要这种反应，而 `Java` 语言中的事件处理有助于完成这一任务。\n\n# 用户交互\n\n为了与用户进行实时交互并跟踪\
  \ Java 运行时外壳的变化，applet 使用了事件的概念。事件是响应某些用户操作（移动鼠标或在键盘上按下按键）而产生的信息。事件也可以响应环境的变化而产生——例如，当窗口\
  \ applet 遮挡了其他窗口时。运行时外壳监视发生的事件，并通过称为 `handler` 开发（事件处理器）的特殊方法传递事件信息。\n\n`Applet`\
  \ 类预定义了许多常用的事件处理器。默认情况下，这些处理器什么都不做——若要使用它们，你需要用你自己的代码替换相应的方法，例如：\n\n```java\npublic\
  \ boolean mouseMove(Event evt, int x, int y) {\n    // 如果移动了鼠标，则执行此处的代码\n    return\
  \ true; // 代码\n}\n```\n\n\n\n\n当按下鼠标按钮时会调用此方法。如果按下一次按钮，小程序将处理单击事件；如果按下两次按钮，小程序将处理双击事件。\n\
  \n## 事件、生成键盘\n\n`keyUp` 和 `keyDown` 方法的工作方式与鼠标事件处理程序相同，不同在于它们传递的是按键标识符，而不是坐标（事件开发）。\n\
  \n按键 ID 是一个整数，对应于被按下的键。普通打字键的值对应于其 ASCII 码。此外，Java 还支持表 5-3 所示的许多特殊键。这些特殊键实际上被定义为\
  \ `event` 类的静态整数变量（常量）。第 6 章“应用程序接口”将向你展示如何在行内转换这些数字，如果你想显示来自键盘的输入。\n\n下一段代码检查光标按键移动的管理：\n\
  \n```java\nPublic boolean keyDown(Event evt, lnt key) { \n  switch(key) {\n    case\
  \ Event.UP:\n    case Event.DOWN:\n    case Event.LEFT:\n    case Event.RIGHT:\n\
  \    default:\n  }\n  return true;\n}\n```\n\n当按下按键时会调用 `keyDown` 方法。switch 语句在四个方向键和其他所有按键之间切换，并为被考虑的键执行相应的代码块。\n\
  \n## 事件处理程序：本身到底发生了什么？\n\n当事件发生时实际上发生了什么？`AppletContext` 注意到事件发生在小程序内部这一事实（参见本章上方侧边栏“AppletContext\
  \ 接口”）。`AppletContext` 创建 `Event` 类的的新实例，分配适当的参数值，以便小程序知道发生了哪个事件，并将一个新事件发送给 `handleEvent`\
  \ 方法。`Event` 类包含了标识事件所需的所有信息；描述事件的变量列在表 5-4 中。\n\n表 5-4. 事件变量\n\n| 变量 | 描述 |\n|\
  \ :--- | :--- |\n| `public Object target` | 发生小程序事件的组件；通常是小程序本身。 |\n| `public long\
  \ when` | 事件发生的时间是一个长型整数，包含自 GMT 1970 年 1 月 1 日午夜以来的毫秒数。Java 有 `java.lang.System.currentTimeMillis()`\
  \ 方法可以返回此含义的值。 |\n| `public int id` | 事件类型（参见表 5-6）。 |\n| `public int x` | 事件的 X\
  \ 坐标。 |\n| `public int y` | 事件的 Y 坐标。 |\n| `public int key` | 按键标识符（特殊键请参见表 5-3）。\
  \ |\n| `public int modifiers` | 状态键叠加掩码。 |\n| `public Object arg` | 可选参数。它不用于鼠标和键盘事件，但在使用\
  \ Java API 提供的图形时经常使用（参见第 9 章“图形与图像”）。 |\n\n`handleEvent` 方法检查事件类型并调用相应的处理程序，向其传递与原因相关的参数（此过程的图如图\
  \ 5-5 所示）。\n\n![](img/image09218.gif)\n\n#### 图 5.5。\n\n例如，当移动鼠标时，会发生 `MOUSE_MOVE`\
  \ 事件，该事件被传递给 `handleEvent` 方法。后者调用与此事件对应的 `mouseMove` 方法，并传递鼠标位置。事实上，不需要将事件位置作为单独参数传递，因为这些信息为了编程方便已直接编码在事件中。\n\
  \n如果你想处理许多不同的事件而不必替换每个特定方法，可以替换 `handleEvent` 方法。如果你想以不同的方式处理序列事件，这可能也有用。这样做之后不要忘记除非你显式地在新的\
  \ `handleEvent` 方法中调用它们，否则预定义的事件处理程序不会被调用。以下示例调用了通用的鼠标事件处理程序，但所有其他事件将按时间执行：\n\n\
  ```java\npublic boolean handleEvent(Event evt) { \n  switch (evt.id) {\n    case\
  \ Event.MOUSE_MOISE_DOWN:\n    case Event.MOUSE_MOUSE_UP:\n    case Event.MOUSE_MOUSE_MOVE:\n\
  \    case Event.MOUSE_MOUSE_DRAG:\n    case Event.MOUSE_MOUSE_ENTER:\n    case Event.MOUSE_MOUSE_EXIT:\n\
  \  }\n}\n```\n\n你可以在程序中生成事件。要做到这一点，你只需要创建一个 `Event` 类的新实例并在你的小程序中声明它（事件构造函数列在表 5-5\
  \ 中）。生成事件可能对于编写系统宏很有用，例如记录鼠标移动。你可以通过编写绘制动作来安排绘制，用户可以将此绘图复制到另一个位置。以下代码将强制你的小程序认为鼠标移动到了新位置：\n\
  \n```java\nevent FakeEvt;\nlong time = System.currentTimeMillis(); \nFakeEvt = new\
  \ event(this, time, MOUSE_MOVE, new_x, new_y, 0, 0, null);\n```\n\n表 5-5. 构造函数\n\
  \n| 构造函数 | 描述 |\n| :--- | :--- |\n| `Event(Object, long, int, int, int, int, int,\
  \ Object)` | `Event(Object, long, int, int, int, int, int, Object)` |\n| `Event(Object,\
  \ long, int)` | `Event(Object, long, int)` |\n| `Event(Object, int)` | `Event(Object,\
  \ int)` |\n| `Event(long, int)` | `Event(long, int)` |\n| `Event(int)` | `Event(int)`\
  \ |\n| `Event(Object)` | `Event(Object)` |\n| `Event()` | `Event()` |\n\n## 帮助流的动画\n\
  \n线程与其他类不同，因为它们在接收控制权并开始行动后，在启动它们的方法的环境中独立执行。在在这方面，它们类似于多处理器操作系统（如 UNIX）中的进程。当调用普通方法时，程序会等待其执行完毕。但当调用线程方法时（通常在线程运行时），调用线程的方法在线程方法执行期间继续执行。图\
  \ 5-6 显示了单个线程的执行情况。两个流。\n\n\n\n\n你可以在 Java 程序中使用线程（streams），并定义扩展类 `thread`。这一过程在第\
  \ 11 章“多线程”中进行了详细描述。但现在让我们解释如何允许 applet 使用线程。这种技术在某些情况下非常有用，例如当 applet 显示移动图像时，你又希望\
  \ applet 在动画播放期间执行其他有用的操作。\n\n### 接口 `runnable`\n\n正如第 3 章“Java 面向对象”中所讨论，Java 语言没有考虑多重继承。applet\
  \ 无法直接扩展 `Applet` 类或 `thread` 类。你可以通过 `runnable` 接口定义一个在线程内部运行的方法。该接口与 `Thread`\
  \ 类一样，属于 `java.lang` 包。可以选择如下这种方式：\n\n```java\nclass ThreadedApplet extends applet\
  \ implements runnable {\n\n}\n```\n\n接口 `runnable` 告诉编译器该 `Class` 有一个 `run` 方法，该方法必须在线程内执行。要执行的方法由\
  \ applet 中直接创建的 `Thread` 类实例控制。我们将看到如何在实践中使用它：\n\n```java\nclass ThreadedApplet\
  \ extends applet implements runnable {\n    private Thread engine = null;\n\n  \
  \  // 我们的流\n    public void init() {\n        engine = new thread(this);\n     \
  \   // 此流现在控制我们的方法\n    }\n\n    public void start() {\n        englne.start();\n\
  \        // 方法开始执行\n    }\n\n    public void stop() {\n        if (engine!=null\
  \ && engine.isAlive()) {\n            // 如果必要，\n            engine.stop();\n   \
  \         // 停止执行方法\n        }\n    }\n\n    public void run() {\n        while\
  \ (engine.isAlive()) {\n            // 代码位于此处，执行，直到 applet 停止\n            stop\n\
  \        }\n    }\n}\n```\n\n当 applet 初始化时，它会创建一个附加到 applet 上的新流。当 applet 启动时，线程的工作开始，它会在\
  \ `run` 方法中循环执行其代码，直到 applet 停止。\n\n### 用于从线程操作的简单方法\n\n`Thread` 类定义了许多管理线程的方法。我们将在第\
  \ 11 章“多线程”中详细讨论它们。在表 5-7 中简要描述了需要记住的最重要方法。\n\n表 5-7. `Thread` 类通用方法\n\n| 方法 | 描述\
  \ |\n| :--- | :--- |\n| `isAlive()` | 返回 `Boolean` 变量，指示当前流是否存。 |\n| `sleep(long)`\
  \ | 请求线程睡眠指定的毫秒数。如果接收到另一个线程的中断信号，此方法将抛出 `InterruptedException`。（关于中断，请参见第 11 章“多线程”。）\
  \ |\n| `start()` | 开始执行流。 |\n| `stop()` | 停止执行流。 |\n| `suspend()` | 临时挂流。 |\n| `resume()`\
  \ | 恢复后继续执行流。 |\n\n通过使用线程，我们可以扩展光标显示 applet（示例 5-5），如图 5-7 所示，以显示跟随光标的移动图像。我们将修改\
  \ applet 以允许用户对其进行某些控制：按下鼠标按钮停止并再次启动动画。\n\n![](img/image09220.gif)\n\n#### 图 5.7。\n\
  \n示例 5-6a. 显示光标的动画 applet。\n\n```java\nimport java.applet.*;\nimport java.awt.*;\n\
  import java.net.*;\n\n// 此类有一个在流内部执行的方法，\n// 并通过在此 applet 中创建的线程实例进行控制\npublic class\
  \ AnimatedCursorApplet extends applet implements runnable {\n\n    private int mouse_x,\
  \ mouse_y;\n    // 角色图像数组\n    private Image CursorImages[];\n    // 当前图像索引\n  \
  \  private int CursorIndex = 0;\n    // 流管理实现方法\n    private Thread anim = null;\n\
  \    // 动画未挂起\n    private boolean paused = false;\n\n    public void init() {\n\
  \        resize(250,250);\n        // 将流绑定到 applet\n        anim = new thread(this);\
  \ \n        mouse_x = 125;\n        mouse_y = 125;\n        // 为了开始接受五张图像\n    \
  \    CursorImages = new Image[5];\n        int i;\n        String CursorParam; \n\
  \        URL CursorURL;\n        // 填充图像数组\n        for (i=0; i<5; i++) {\n    \
  \        CursorParam = getParameter(\"CURSORFILE\"+i);\n            try {\n    \
  \            CursorURL = new URL(CursorParam);\n                CursorImages[i]\
  \ = getImage(CursorURL);\n            } catch (MalformedURLException e) {\n    \
  \            // 如果 URL 错误，创建空帧\n            }\n        }\n    }\n    // ... (其余逻辑后续所示)\n\
  }\n```\n\n### 消除闪烁\n\n除非你运行在速度惊人的图形工作站上，否则当启动此 applet 时，你肯定会看到几次恼人的闪烁，这是 applet\
  \ 试图比技术上可能更快的速度重绘屏幕的结果。解决此问题的经典方案是双倍缓冲。该过程的流程图如图 5-8 所示。\n\n![](img/image0921.gif)\n\
  \n#### 图 5.8。\n\n当运行时外壳需要重绘图形窗口时——例如当窗口被遮挡或 applet 请求重新显示并重绘窗口时——applet 的修改方法会被调用，并将\
  \ `Graphics` 对象传递给它的图形窗口。在默认情况下，方法的修改只是传递 `Graphics` 对象的 `paint` 方法。\n\n\n\n\nApplet\
  \ 可以定义一个虚拟屏幕进行绘图，而不是直接在图形窗口外壳上执行绘制。Applet 绘制的图像可以使用 `getCraphics` 方法传输到实际窗口中。该方法返回与图像关联的\
  \ `Graphics` 对象。Applet 将以尽可能快的速度在其上绘图。Applet 的修改方法将图像显示在 `Graphics` 对象上，而不是允许 applet\
  \ 直接显示在屏幕上。结果是，闪烁现象将会消失。\n\n在绘制执行时的外壳 `Graphics` 对象与绘制虚拟图像的 `Graphics` 对象之间存在一个显著区别。窗口窗口在运行时会被清除，并且在每次修改时必须完全重新绘制。如果虚拟图像没有被显式着色，它将保留已经绘制的内容。如果你想使用此类图像显示移动图形，必须在每次修改它时都重新绘制图形周围的背景，否则你的图片在移动时会留下足迹。\n\
  \n现在我们可以使用虚拟屏幕图像为 applet 显示光标添加双缓冲。\n\n示例 5-6a. 无闪烁的动画 applet 显示光标。\n\n```java\n\
  import java.awt.*;\nimport java.applet.*;\nimport java.net.*;\n\npublic class AnimatedCursorApplet\
  \ extends applet implements runnable {\n\n    private int mouse_x, mouse_y;\n  \
  \  private Image CursorImages[];\n    private int CursorIndex = 0;\n    private\
  \ Thread anim = null;\n    private boolean paused = false;\n    private Image OffscreenImage;\n\
  \n    // our virtual screen\n    private Graphics OffscreenGraphics;\n\n    // our\
  \ interface to him\n    public void init() {\n        resize(250,250);\n       \
  \ OffscreenImage = createImage(250,250);\n        // new image\n        OffscreenGraphics\
  \ = OffscreenImage.getGraphics();\n        // tie our interface to image\n     \
  \   anim = new Thread(this);\n        mouse_x = 125;\n        mouse_y = 125;\n \
  \       CursorImages = new Image[10];\n        int i;\n        String CursorParam;\n\
  \        URL CursorURL;\n        for (i=0; i<5; i++) {\n            CursorParam\
  \ = getParameter(\"CURSORFILE\"+i);\n            try {\n                CursorURL\
  \ = new URL(CursorParam);\n                CursorImages[i] = getImage(CursorURL);\n\
  \            } catch (MalformedURLException e) {\n                CursorImages[i]\
  \ = createImage(0,0);\n            }\n        }\n    }\n\n    public void start()\
  \ {\n        anim.start();\n    }\n\n    public void stop() {\n        if (anim!=null\
  \ && anim.isAlive()) {\n            anim.stop();\n        }\n    }\n\n    public\
  \ synchronized void update(Graphics g) {\n        paint(OffscreenGraphics);\n  \
  \      // say applet paint over our image\n        g.drawImage(OffscreenImage,0,0,this);\n\
  \        // paint over real graphic window\n    }\n\n    public void paint(Graphics\
  \ g) {\n        int px, py;\n        Image Cursor = CursorImages[CursorIndex];\n\
  \        g.setColor(Color.white);\n        g.fillRect(0,0,249,249);\n        //\
  \ draw over the old image\n        g.setColor(Color.black);\n        g.drawRect(0,0,249,249);\n\
  \        // let's deduce frame\n        px = mouse_x - Cursor.getWidth(this)/2;\n\
  \        py = mouse_y - Cursor.getHeight(this)/2;\n        g.drawImage(Cursor,px,py,this);\n\
  \    }\n\n    public boolean mouseMove(Event evt, int x, int y) {\n        mouse_x\
  \ = x;\n        mouse_y = y;\n        return true;\n    }\n\n    public boolean\
  \ mouseDown(Event evt, int x, int y) {\n        if (paused) {\n            anim.resume();\n\
  \            paused = false;\n        } else {\n            anim.suspend();\n  \
  \          paused = true;\n        }\n        return true;\n    }\n\n    public\
  \ void run() {\n        while (anim!=null) {\n            try {\n              \
  \  anim.sleep(50);\n            } catch (InterruptedException e) {}\n          \
  \  CursorIndex = CursorIndex + 1;\n            if (CursorIndex==5) {\n         \
  \       CursorIndex = 0;\n            }\n            repaint();\n        }\n   \
  \ }\n}\n```\n\n# 接下来做什么\n\n读完这一章后，你可以在 Java applet 中编写多媒体程序。现在你可以从网络接收图像和声音数据，还可以从\
  \ HTML 代码获取执行期间参数，你可以处理用户界面开发并使用流恢复你的 applet。所有这些对于创建包含多媒体的 applet 都是必要的，但对于编写可以使用文本和其他输入设备与用户进行高级交互的\
  \ applet 来说还不够够。\n\n到目前，你应该已经喜欢使用 Java 语言了。接下来的章节将讨论 API 提供的丰富的 Java 类层次。这些类和接口增加了有用的功能。\n\
  \n## 第 6 章\n\n(Images/image0922.jpeg)\n\n## API\n\n（为了简洁省略了文本，保持结构：API 是 Java 开发工具包自带的一套巨大的工具。在其中你将找到字符串处理、网络、数学能力以及“主力军”——用于处理哈希表的程序。）\n\
  \n\n\n该 API 非常易于使用，因此在学习那些绝对必要的部分时你不应该遇到任何重大问题。如果你真的沉浸在 API 的探索中，你将能够在不编写代码的情况下完成许多基本操作，并深入理解如何使用\
  \ Java 这种面向对象的语言特性。\n\n首先，我们必须理清 API 的结构。然后我们考虑 Java 语法，这样你就可以充分利用具体的类和接口。\n\n##\
  \ API 结构\n\nAPI - 包含了几十个现成的类、接口和异常。\n\n在 API 内部，这些类、接口和异常被分为八个包：`java.applet`、`java.awt`、`java.awt.image`、`java.awt.peer`、`java.io`、`java.lang`、`java.net`\
  \ 和 `java.util`。表 6-1 简要了每个包的作用。\n\n表 6-1 API 包\n\n### 包描述\n\n`java.applet` 包含运行\
  \ applet 的类和接口（见第 5 章，“Applet 的工作”）。\n\n`java.awt` 允许创建用户图形界面。\n\n`java.awt.peer`\
  \ 完全由接口组成，允许系统与 Java 窗口交互。易于移植到其他平台（但对普通程序员来说没有意义）。\n\n`java.awt.image` 设计用于创建和处理图像（见第\
  \ 9 章，“图形与图像”）。\n\n`java.io` 处理输入和输出程序（见第 11 章，“多线程”）。\n\n`java.lang` 包含核心元素 `java.language`，如\
  \ `Object`、`String`、`Exception` 和线程（thread）。\n\n`java.net` 处理与网络的交互（见第 11 章“多线程”和第\
  \ 12 章“跨越 Applet 模型范围的编程”）。\n\n`java.util` 包含若干辅助类，通常用于结构化数据。\n\n请记住，包是相关的类和接口的集合，它们允许访问用\
  \ `protected` 修饰符定义的方法和变量。在许多情况下，成员被包含在其中一个包中，这是由于设计上的考虑，并且与 `protected` 关键字的使用有关。在其他情况下，某个成员可能属于某个包，是因为在它的目的上它与该包的其他成员最接近。使用\
  \ API 时，我们可以将不同的包视为功能性的机会。不要被 `java.awt.image` 和 `java.awt.peer` 误骗——它们的成员与 `java.awt`\
  \ 包的成员没有特殊的语法关系。Java 的创建者为 API 选择这些名称，是为了显示这两个包的成员具有相似的功能性机会。\n\n在日常编程中，包结构对你的重要体现在两个方面。首先，你需要使用\
  \ `import` 操作符来应用 API 中的类。但其次，你必须至少大致熟悉包的内容，因为如图 6-1 所示，交互式的 Java 开发工具包文 文也是按包划分的。每个类、接口和异常都有自己的\
  \ Web 页面，详细描述了所有可用的公共方法和变量。\n\n![](img/image09223.gif)\n\n### 练习 6.1\n\n一旦你完成了这一章，请深入研究在线\
  \ JDK 文档。由于你确定在编译 Java 程序时会遇到错误，你将发现在线文档是无价的。这本书的生命将在我们的在线伴侣页面继续，在那里你可以找到 Sun Microsystems\
  \ 提供的最新交互式文档。\n\n## 使用 API\n\n使用 API 的第一步是使用 `import` 语句访问包。完成这一步后，你的学习过程将分为两个部分。首先，你将学习如何在\
  \ Java 编程中使用代码块。此外，随着你使用 API 的经验越来越丰富，你将自己编写 Java 代码块，用 Java 语言开发你自己的工作风格。\n\nAPI\
  \ 是熟悉 Java 语言细节的绝佳方法。你可以从已存在的东西学习。你可能不会总是同意 API 项目创建者的观点，但你将达到体验 Java 编程快乐的。开始开发自己的类、接口和包时，你可以将\
  \ API 作为你项目的链接。\n\n### 导入包\n\n在第 2 章我们已经开始导入包，并在第 3 章详细描述了语法。为了记住这一点，足够写：\n\n```java\n\
  import <package_name>.*;\n```\n\n这对于导入包并不是必须的，但它让你的代码更易于阅读。正如你在第 5 章记得的，当我们没有导入\
  \ `java.applet` 包时，我们必须以这种方式声明类：\n\n```java\nclass MyApplet extends java.applet.applet\
  \ {}\n```\n\n但对于我们经常使用的类，每次都详细写出类的全名是不方便的。\n\n![](img/image09224.jpeg)\n\n考虑在示例类上最佳使用\
  \ `import` 操作符：\n\n1. 确定包含你想要使用的类的包。这很简单：因为我们的类全名是 `java.util.Date`，因此它包含在 `java.util`\
  \ 包中。否则，我们将查阅交互式文档查找。\n2. 使用 `import` 语句导入类。如果我们只使用 `Date`，可以这样做：\n```java\nimport\
  \ java.util.Date;\n```\n通常会从一个包中使用几个类。在这种情况下，最好使用模板来导入所有类：\n```java\nimport java.util.*;\n\
  ```\n3. 我们现在准备好使用我们的类来引用当前日期。使用 `import` 语句非常简单。要避免只导入包而不导入类的陷阱。你可能会通过以下导入语句掉入陷阱：\n\
  \n```java\nimport java.util;\n```\n这个操作实际上没有导入任何类。通过添加名称，我们声明变量：\n\n```java\nDate\
  \ d;\n```\n或者在没有 `java.util.*` 语句的情况下：\n```java\njava.util.Date d;\n```\n无论是否有 `java.util.*`\
  \ 语句，最后的代码都是正确的。然而，这种形式的代码很笨拙，容易出错。\n\n### 静态方法对比动态方法\n\n正如你在第 2 章记得的，Java 方法可以是静态的也可以是动态的。动态方法更通用——它们与类的实例化概念有关。另一方面，静态方法是直接与类关联的方法。如果在声明中存在\
  \ `static` 修饰符，则它是静态的。图 6-2 显示了 `java.util.Date` 类中名为 `parse` 的静态方法。注意 `static`\
  \ 关键字的存在。\n\n![](img/image0225.gif)\n\n### 练习 6.2\n\n使用静态方法类型 `parse`，我们不需要创建类实例。相反，我们这种方式引用类：\n\
  \n```java\npublic long demoStatlc(String S) { return date.parse(S);}\n```\n\nAPI\
  \ 中的许多方法都是静态的，因为即使它们是动态的，也会产生完全的结果。因此，当我们只需要方法时，我们必须再次创建变量，而该方法只需接收输入并产生输出，对对象的其余部分保持无关。\n\
  \n但这种便利性经常给 Java 新手带来错误，因为他们尝试动态地访问静态方法。因此，将每个类认为由两个独立的部分组成是有用的——一个动态的，另一个静态的。动态部分包含了变量和方法，它们是类实例的一部分——那些没有用\
  \ `static` 修饰符定义的方法。在我们 date 类中，这些就是我们 `parse` 方法之外的所有方法。\n\n\n\n另一方面，静态变量和方法只是属于某个类的工具方法，因为该类是你在逻辑上寻找它们的地方。例如，让我们考虑\
  \ `Date` 类中的 `parse` 方法。该方法接收一个格式化日期的字符串，并返回自格林威治标准时间 1970 年 1 月 1 日午夜以来经过的秒数。\n\
  \n如果你需要此类功能机会，并且为了寻找它们而开始浏览在线 API 文档，你可能会查看 `Date` 类。通过查看 `Date` 类方法的描述，你会发现这样的方法已经存在了，你不需要自己编写它。\n\
  \n你只需要看到存在什么样的方法，并确定它是否是静态的。如果是这个静态方法，你将会知道：\n\n*   你不应该为了使用此方法而分配对象对象。\n*   你不能从对象调用静态方法，受处理过程的限制。\n\
  *   必须通过语法 `<类名>.<方法名>` 来调用方法。\n\n### 其他访问修饰符概述\n\n在参考在线文档查看给定方法是否为静态时，你可能会遇到其他访问修饰符的提示。这些修饰符都定义在第\
  \ 3 章“Java 面向对象”中。在这里我们将对它们进行概述，考虑它们对我们使用 API 的影响。\n\n*   `protected` 修饰符。表示该方法或变量仅对此包中的其他类可见。由于我们创建的类不会被包含在任何\
  \ API 包中，因此此修饰符对我们没有施加任何限制。我们将在第 11 章“多线程”中介绍在设计中对 `protected` 关键字的使用，以及自定义包的实现。\n\
  *   `final` 修饰符。意味着一个方法（或整个类）不能被子类。当我们使用作为 API 的类时，这个关键字对我们来说并不重要。然而，如果我们想创建自己的子类类\
  \ API，我们应该检查它是否没有被 `final` 帮助修饰符定义。\n*   `abstract` 修饰符。如果整个类都用 `abstract` 修饰符定义，那么我们只能实现它的子类。如果类成员中只有一个成员被用\
  \ `abstract` 修饰符定义，那么我们只能访问替换了该特定方法的子类成员（参见第 3 章“Java 面向对象”）。当你看到 `abstract` 修饰符时，不要忘记事情并非初眼看起来的那样。你可能应该考虑文档中包含的\
  \ API 树，并探索 API 提供的子类。在图 6-3 显示的抽象类树 `java.awt.Component` 中，理解此类的子类是学习 Java AWT\
  \ 的大部分我们将在接下来的两个中充分探索它们。\n\n![](img/image09226.gif)\n\n#### 图 6.3\n\n*   `synchronized`\
  \ 和 `native` 修饰符。对于 API 用户没有实际价值。为了对它们有一个大致的概念，让我们假设 `synchronized` 修饰符意味着特定的方法或变量只能在某些时刻访问，这对于多线程程序非常重要（见第\
  \ 11 章）。但现在我们没有必要担心这个修饰符。\n*   `native` 修饰符指定该方法实际上是在动态链接库（DLL）中执行的，该库不是用 Java 编写的。假设代码中插入的所有非\
  \ `native` 修饰的方法都是用 Java 编写的。\n\n但现在，如果我们想要使用的方法是用 `native` 修饰符定义的，我们不需要特别留心。（更多细节我们将在第\
  \ 12 章“框架模型 applet 后台编程”中考虑此类方法。）\n\n### 异常与 API\n\n当你学习交互式 Java 文档时，可能会注意到某些方法和构造函数会抛出异常。在第\
  \ 5 章“Applet 的工作”中，我们面临一个抛出异常的构造函数，它是 `java.net` 包中 `URL` 类的构造函数。在图 6-4 中，`URL`\
  \ 类网页显示了哪个接收行的构造函数导致了异常 `MalformedURLException`。\n\n![](img/image09227.gif)\n\n\
  #### 图 6.4\n\n为了有效使用 API，你应该了解可能调用方法或构造函数的异常。编写处理异常的自己的例程将在第 10 章“程序结构”中介绍。现在我们将为你介绍处理抛出异常的现有\
  \ API 方法和构造函数的配方。主策略如图 6-5 中的流程图所示。\n\n![](img/image09228.gif)\n\n#### 图 6.5\n\n\
  第一步是显而易见的——我们首先在在线文档中找出我们的方法是否引起异常。如果方法或构造函数的声明中存在关键字 `throw`，我们就执行第二步来理解是哪种异常。此最简单的方法是点击异常名称（在我们例中，是\
  \ `MalformedURLException`）。因为异常是类，它们有自己的网页。\n\n当我们到达网页时，确定它是什么异常，即检查它是哪个类的子类。如果它是\
  \ `RuntimeException` 或 `Error` 的后代，我们就不需要使用处理块。然后我们必须决定是否捕获此异常。\n\n如果你在程序执行期间需要捕获异常，在抛出异常的方法文本中将插入一个处理块。它包含了所有依赖于方法正常执行的内容。此外，我们必须确保我们确实在处理该异常。尽管下一个\
  \ applet 将正确编译并工作：\n\n```java\nimport java.applet.*;\n\nclass badApplet extends\
  \ applet {\n    Image img;\n    // 描述变量\n    public void init() {\n        URL imgURL;\n\
  \        // 坏主意！必须在处理块中。\n        try {\n            imgURL = new URL(getParam(\"\
  image\"));\n        } catch (MalformedURLException e) {\n            // Bad 主意！发生异常时我们什么都不做。\n\
  \        }\n        // Bad 主意！我们在处理块外使用了 imgURL。\n        img = getImage(imgURL);\n\
  \    }\n    // 其他方法\n}\n```\n\n考虑一下如果 \"image\" 参数不是有效的 URL 会发生什么。我们的块验证甚至不会告诉用户出了问题！更糟糕的是，当我们尝试寻找图像时程序将会失败。上面的代码片段是不愿意尝试处理程序异常的结果。由于异常处理对于初学者\
  \ Java 程序员来说往往是不可理解的，他可以将其视为不必要的复杂，只做绝对必要的的事。然而，正如我们在第 10 章“程序结构”中看到的，异常处理对于编写可靠的\
  \ Java 程序至关重要。我们不会在此深入讨论，但当你开始使用 API 时，尽量不要养成不当处理异常的习惯。如果你正在编写处理块，请遵循以下建议：\n\n*\
  \   如果方法作者认为应该抛出异常，那么这可能已经是处理该异常的充分理由。\n*   确保所有依赖于特定方法或设计者调用异常的代码都包含在处理块中。保证这一点的最简单方法是在块内部声明任何分配给特定方法或设计者的变量。\n\
  \n\n\n\n- 始终使用你的异常处理块来智能地响应导致异常的情况。在我们糟糕的 applet 示例中，我们必须向用户解释“image”参数是无效的。在关键情况下，你可以在块处理中完成性能\
  \ applet 操作。\n\n## `java.lang.Object` 类\n\n`java.lang.Object` 类是一个基础的 Java 类。你还记得在第\
  \ 3 章“Java 中的面向对象”中提到的所有的类都源自同一个类吗？而这就是那个类！关于 `Object` 类，书中最重要的注释之一是，它位于层级结构的顶端。然而，它不仅仅是一个抽象概念——该类包含了几个方法，并且可以像其他类一样被处理。由于所有类都继承自\
  \ `Object` 类，因此它的方法出现在每一个其他类中。大部分（如果不是所有）表 6-2 中给出的基本方法通常在子类中被重写。\n\n### 表 6-2.\
  \ `Object` 类的基本方法\n\n| 方法 | 说明 | 异常 |\n| :--- | :--- | :--- |\n| `boolean equals(Object\
  \ o)` | 如果给定对象等效，则返回 true。 | 无 |\n| `String toString()` | 根据给定对象的信息返回字符串。 | 无 |\n\
  | `Object clone()` | 克隆给定对象。 | `CloneNotSupportedException` |\n| `void finalize()`\
  \ | 当给定对象不再被需要时被调用。 | `Throwable` |\n\n尽管 `Object` 类中还有其他方法，但这里列是最重要的。前两个方法被 API\
  \ 中的任何类重写。`clone` 方法是让我们创建对象新副本的秘诀。这个方法带我们回到了第 4 章关于赋值运算符的讨论。让我们回想一下示例：\n\n```java\n\
  public void sampleMethod(someClass anObject) { someClass anotherObject=anObject;\
  \ }\n```\n\n在这里，`anotherObject` 和 `anObject` 实际上是同一个对象且属于同一个类——赋值操作并没有创建一个新副本。如果\
  \ `clone` 方法没有改变，我们可以使用它来执行样本拷贝：\n\n```java\nSomeClass aCopy=anObject.clone();\n\
  ```\n\n在这里我们假设 `someClass` 的作者已经决定了他想要如何克隆 `someClass` 实例。然而，为类定义一种克隆自身的方法并不总是一个好主意（见第\
  \ 10 章）。作者的特定类可以决定是否克隆这些类的实例，并且 API 中的许多类是不可克隆的。当类或其某个父类实现了 `clone` 接口并显式重写了该方法时，可以使用此方法。\n\
  \n但关于 `Object` 类中的其他方法又如何呢？它们将在本章节的框架之后进行研究。表 6-3 描述了它们的作用以及之后在哪里进行讨论。\n\n### 表\
  \ 6-3. `Object` 类的其他方法\n\n| 方法 | 描述位置 |\n| :--- | :--- |\n| `wait, notify, notifyAll`\
  \ | 允许对象通过 Java 流进行通信。第 11 章，“多线程”。 |\n| `hashCode` | 允许对象联合 `java.util.Hashtable`\
  \ 使用。 |\n| `getClass` | 用于在执行期间获取有关此对象的信息。第 10 章，“结构化程序”。 |\n\n## 处理字符串\n\n第 10\
  \ 章，“结构化程序”。\n\n如你所知，字符串仅仅是字符序列。几乎所有的编程语言无如何都支持字符串，Java 也不例外。`String` 类的文档 Web 页面如图\
  \ 6-6 所示，位于 `java.lang` 包中，用于表示字符串。该类提供了许多功能，如转换为数值类型、子字符串搜索和替换、访问特定字符和空白字符。你可能会比\
  \ API 中的任何其他类更多地使用 `String` 类，并且应该非常熟悉其中包含的方法。在本节中，我们将探索 `String` 类。我们还将考虑 API 中的其他帮助你操作字符串的类。\n\
  \n![](img/image09229.gif)\n\n## 创建字符串\n\n图 6.6。字符串可以通过两种方式创建：\n\n- 使用七种设计者类之一的 `String`\
  \ 类；\n- 使用赋值操作符（`=`）。\n\n在此之前，为了创建字符串，我们使用了赋值操作符。`String S=\"My string\";` 是创建字符串最简单的方法。`+`\
  \ 运算符也可以用于字符串的简单拼接，如示例 6-1 所示。\n\n**示例 6-1a. 从简单类型形成字符串。**\n\n```java\nString S2=\"\
  other string\";\nString S3=S+S2+\"and a primitive type:\" int i=4;\nS3=S3+i\n```\n\
  \n`S3` 现在将拥有值 \"My string, another string and a primitive type: 4\"。`+` 运算符对所有基本类型有效。然而，赋值运算符\
  \ `=` 并不如此。接下来的代码片段由于上述两个运算符将无法编译：\n\n```java\nint i=4;\nString SI=i;\n// 无法编译！String\
  \ S2=4;\n// 无法编译！\n```\n\n这种限制很人恼，但可以很容易绕过，尽管方式并不优雅。有必要创建一个空字符串，并通过 `+` 运算符向其添加必要的含义。\n\
  \n**示例 6-1b. 将基本类型的值直接赋值给字符串。**\n\n```java\nint i=4;\nString S1=\"\"+i;\nString\
  \ S2=\"+4;\n```\n\n赋值运算符仅适用于字符串常量（即包含引号内的文本）和其他字符串。`+` 运算符适用于字符串常量、其他字符串以及所有基本类型。此外，字符串可以通过表\
  \ 6-4 中描述的构造函数创建。\n\n### 表 6-4. 字符串构造函数\n\n| 构造函数 | 创建的对象 |\n| :--- | :--- |\n|\
  \ `String()` | 空字符串。 |\n| `String(String S)` | `S` 的新副本。 |\n| `String(char charArray[])`\
  \ | 基于数组 `charArray` 的字符串。 |\n| `String(char charArray[], int offset, int len)`\
  \ | 从偏移 `offset` 开始长度为 `len` 的子数组字符串。 |\n| `String(byte byteArray[], int hibyte)`\
  \ | 基于数组 `byteArray` 的字符串，其中 `hibyte` 描述 Unicode 符号。 |\n| `String(byte byteArray[],\
  \ int hibyte, int offset, int len)` | 从偏移 `offset` 开始长度为 `len` 的子数组字符串。 |\n\n虽然赋值运算符与基本类型不兼容，但这真的是\
  \ Java 中创建字符串时唯一不直观的地方。一旦我们过了字符串比较的特性，你就可以从容使用字符串了。\n\n## 字符串比较\n\n现在，学会创建字符串后，我们应该学习比较它们。`String`\
  \ 类中有两个比较方法——`equals` 和 `compareTo`。`equals` 方法替换了 `Object` 类中的 `equals` 方法，并在字符串匹配时返回\
  \ true，而 `compareTo` 方法在等效字符串上返回 0。\n\n**示例 6-2a. 通过 compareTo 和 equals 方法比较字符串。**\n\
  \n```java\nif (S1.compareTo(S2)!=0)\nSystem.out.println(\"S1 等于字符串 S2\"); if (S1.equals(S2))\n\
  System.out.println(\"S1 等于字符串 S2\");\n```\n\n如果 `S1` 字典序小于 `S2`，则 `compareTo` 方法返回的值为\
  \ -1；如果 `S1` 字典序大于 `S2` 则返回 1。正如下面的示例所示，“字典序”比较本质上意味着字母顺序比较。区别在于这种顺序扩展到了数字和其他非字母字符，因此\
  \ \"a113\" 在字典序上确实大于 \"a112\"。排序由 Unicode 值决定。\n\n\n\n\n词法排序源于 Unicode 字符的整数值。`compareTo`\
  \ 方法根据其整数值对字符串的每个字符进行逐一比较。当它发现差异时，将如上文所述返回 `1` 或 `-1`。对于数字和字母，这种流式处理在直觉上是清晰且易于记忆的（节\
  \ 6-7）。\n\n![](img/image09230.gif)\n\n### Rice. 6.7.\n\n更复杂的是使用“非英语”字母表以及特殊字符（如\
  \ `%`、`!` 或 `*`）时的字符串比较。学习数字数值相似符号的最简单方法（在 Rice 6-7 中未显示）是将 `char` 类型转换为 `int` 类型并类型转换出其含义：\n\
  \n```java\npublic void strangeCharacter(char Strange) { \n    int val = (int) Strange;\n\
  \    System.out.println(\"One strange character!\");  \n    System.out.println(\"\
  The char \" + Strange + \" = \" + val);  \n}\n```\n\n除了我们只考虑过的两种比较方法外，还有六种方法以不同的方式比较两个字符串。它们都列在表\
  \ 6-5 中，按难度递增排序。\n\n#### 表 6-5. 方法比较行\n\n| 方法 | 返回 true 的情况 |\n| :--- | :--- |\n\
  | `equalsIgnoreCase(String S)` | `String` 等于 `S`，不区分大小写。 |\n| `beginsWith(String\
  \ S)` | `String` 以 `S` 开头。 |\n| `beginsWith(String S, int len)` | 字符串以 `S` 的前 `len`\
  \ 个字符开头。 |\n| `endsWith(String S)` | 行以 `S` 结尾。 |\n| `regionMatches(int toffset,\
  \ String S, int offset, int len)` | 行中从位置 `toffset` 开始的子字符串与从 `offset` 开始长度为 `len`\
  \ 的子字符串匹配。 |\n| `regionMatches(boolean ignoreCase, int toffset, String S, int offset,\
  \ int len)` | 与上方法相同，当 `ignoreCase == true` 时忽略大小写。 |\n\n大多数字符串比较方法都是直观的，但 `regionMatches`\
  \ 方法需要一些解释。它们允许你比较 `S1` 和 `S2` 中的任何子字符串。第一个参数指定了模式字符串中你想开始比较的位置。第二个参数是另一个字符串，其位置由第三个参数指定，你希望在该行从该位置开始比较。最后一个参数是比较区域的长度。`regionMatches`\
  \ 方法的使用在 Rice 6-8 中进行了所示。\n\n![](img/image09231.gif)\n\n### Rice. 6.8.\n\n当我们开始解析字符串时，你会发现这两种比较方法非常有帮助。它们的整数值可以作为参数传递。例如，它们可以用于模拟\
  \ `endsWith` 和 `startsWith` 方法。下面给出的代码片段始终返回 `true`。\n\n示例 6-3a. 通过辅助方法 `regionMatches`\
  \ 模拟方法 `startsWith`。\n\n```java\nint lengthB = B.length();\nif (A.startsWith(B)\
  \ == A.regionMatches(0, B, 0, lengthB))\n    // 始终为 true\n```\n\n然而，在辅助方法 `regionMatches`\
  \ 中完成等效方法 `endsWith` 后，说明如何获取正确的参数更好。\n\n示例 6-3b. 通过辅助方法 `regionMatches` 模拟方法 `endsWith`。\n\
  \n```java\nint lengthB = B.length();\nint startA = A.length() - B.length();\nif\
  \ (A.endsWith(B) == A.regionMatches(startA, B, 0, lengthB))\n```\n\n# 处理子字符串\n\n\
  ## 操作子字符串\n\n我们只看到 `String` 类允许比较子字符串。还存在许多提取子字符串的方法。让我们从处理子字符串的简单方法开始：\n\n```java\n\
  public String substring(int start)\npublic String substring(int start, int len)\n\
  ```\n\n上面显示的第一个方法返回一个新行，它从字符数组中的第一个位置开始，包含该位置之后的所有字符。第二个方法仅返回 `start` 之后的 `len`\
  \ 个字符。字符串的第一个字符位于位置零。考虑一些示例：\n\n```java\nString S = \"0123456789\";\nString S1 =\
  \ S.substring(0); \nString S2 = S;\n// 字符串 S1, S2 是等价的。\nString S4 = S.substring(4);\n\
  // S4 的含义是 \"456789\"\nS5 = S.substring(4, 3);\n// S5 的含义是 \"456\"\n```\n\n处理子字符串的方法之所以不方便，是因为它们总是需要传递参数。当你可以使用\
  \ `indexOf` 方法时情况也是如此。`indexOf` 方法允许你检查 `String` 类中的单个字符或字符串，并返回索引数组。\n\n#### 表\
  \ 6-6. Indexof 方法\n\n| 方法 | 返回含义 |\n| :--- | :--- |\n| `indexOf(char a)` | `a` 第一次出现的索引。\
  \ |\n| `indexOf(char a, int start)` | 从 `start` 开始的 `a` 的索引。 |\n| `indexOf(String\
  \ S)` | `S` 第一次出现的索引。 |\n| `indexOf(String S, int start)` | 从 `start` 开始的 `S` 的索引。\
  \ |\n\n## 修改行\n\n在整个章节中，字符串不会被改变。请注意，一旦创建，字符串实例就无法修改。因此我们赋值一个新副本。\n\n```java\nString\
  \ S = \"some string\";\nS = S.substring(0, 4);\n```\n\n除了 `substring` 方法外，我们还有四种其他可以使用的方法。它们在表\
  \ 6-7 中。\n\n#### 表 6-7. 修改方法\n\n| 方法 | 返回含义 |\n| :--- | :--- |\n| `concat(String\
  \ S2)` | 将 `S2` 连接到当前字符串。 |\n| `replace(char a, char b)` | 字符 `b` 替换 `a`。 |\n| `toLowerCase()`\
  \ | 返回不包含大写字的字符串。 |\n| `toUpperCase()` | 返回不包含小写的字符串。 |\n| `trim()` | 返回去除前后空格的字符串。\
  \ |\n\n# 解析行\n\n现在我们有了所有的字符串工具。我们可以比较，并使用 `indexOf` 查找子字符串。但假设一行中多次出现同一个子字符串。例如，一个数学表达式可能会多次出现\
  \ `+` 符号。计算机科学家将此类字符串称为分隔符。分隔符之间的单元被称为令牌（tokens）。\n\n我们说过可以编写代码根据特定分隔符解析令牌。但这是一项辛苦的工作。幸运的是，`java.util`\
  \ 包包含一个 `StringTokenizer` 类，它可以根据给定的分隔符分割给定的字符串。在 Rice 6-9 中展示了 `StringTokenizer`\
  \ 的交互式文档。\n\n![](img/image09232.gif)\n\n### Rice. 6.9.\n\n使用 `StringTokenizer` 类解析行。\n\
  \n```java\npublic int getSum(String S) {\n    int runningSum = 0;\n    StringTokenizer\
  \ tok = new StringTokenizer(S, \"+\");\n    while (tok.hasMoreTokens()) {\n    \
  \    String thisToken = tok.getNextToken();\n        runningSum = Add(thisToken);\n\
  \    }\n    return runningSum;\n}\n```\n\n\n\n\n```java\nprivate int Add(String\
  \ S) {\n    // 在知道如何执行它之前，\n    // 我们应该了解基本类型转换\n}\n```\n\n如你所见，使用 `indexOf` 和 `regionMatches`\
  \ 方法来实现相同的功能会困难得多。如果我们只需要对字符串进行一次，可以保留对 `indexOf` 和 `regionMatches` 方法的使用。表 6-8\
  \ 描述了构造函数，图 6-9 显示了为了有效使用该工具需要掌握的主要方法：`StringTokenizer`。\n\n### 表 6-8. StringTokenizer\
  \ 类的构造函数\n\n### 构造函数描述\n\n`StringTokenizer(String S, String delim)` 根据 `delim` 分割\
  \ `S`。\n\n`StringTokenizer(String S, String delim, boolean returnDetims)`\n与上述相同，但如果\
  \ `delims == true`，分隔符将作为标记（tokens）返回。\n\n`StringTokenizer(String S)` 根据空格（`\"\\\
  t\\n\\r\"`）分割 `line`。\n\n### 表 6-9. StringTokenizer 类的方法\n\n## 方法描述\n\n`String nextToken()`\
  \ 返回下一个标记。\n\n`String nextToken(String newDelim)`\n在切换分隔符为 `newDelim` 后，返回下一个标记。\n\
  \n`boolean hasMoreTokens()` 如果还有未返回的标记，则返回 `true`。\n\n`int countTokens()` 返回 `line`\
  \ 中的标记数量。\n\n## 其他数据类型中的行转换\n\n程序员经常需要在字符串和基本数据类型（如整数）之间进行转换。要将基本数据类型转换为字符串，可以使用\
  \ `valueOf` 方法。每种基本数据类型都有特定的 `valueOf` 方法，它们的工作方式都相似。让我们展示 `int`、`float`、`double`、`boolean`\
  \ 和 `char` 的类型值转换。\n\n示例 6-5a. 行中的基本类型数据转换。\n\n```java\nint someInt=1;\nString StringInt=String.valueOf(someInt);\n\
  float someFloat=9.99f;\nString StringAsFloat=String.valueOf(someFloat);\n// StringAsFloat\
  \ 的含义是 9.99\n// 注意结尾的 f，\n// 以将其与 double 类型区分开。\ndouble someDouble=99999999.9;\n\
  String StringAsDouble=String.valueOf(someDouble);\n// StringAsDouble 是 \"99999999.9\"\
  \nboolean someBoolean=true;\nString StringAsBoolean=String.valueOf(someBoolean);\n\
  // StringAsBoolean 是 true\nchar someChar='a';\nString StringAsChar=String.valueOf(someChar);\n\
  // StringAsChar 的含义是 \"a\"\n```\n\n这些方法与我们之前使用的空字符串和 `+` 运算符将基本类型值赋值给字符串的变没有没有。你可能会发现这些方法可以让你的代码更易读。但如何将字符串转换为基本类型呢？正如你所预期的，为此在\
  \ API 中有特殊的静态方法——但它们不在 `String` 类中。它们包含在基本类型的包装类中，我们稍后会讨论。例如，考虑数值型基本类型的转换，排除 `short`\
  \ 和 `byte`。\n\n示例 6-5b. 行到基本类型的转换。\n\n```java\nString intString=\"10\";\nString\
  \ floatString=\"10.1f\";\nString longString=\"999999999\";\nString doubleString=\"\
  999999999.9\";\ntry {\n    int i=Integer.parseInt(intString);\n    float f=Float.valueOf(floatString).floatValue();\n\
  \    long l=Long.parseLong(longString);\n    double d=Double.valueOf(doubleString).longValue();\n\
  } catch (NumberFormatException e) {\n    System.out.println(\"尝试了无效转换\");\n}\n```\n\
  \n在这里我们不需要担心字符串是否无效，因为是我们自己为它们赋值的。但在许多情况下（例如，当你从用户那里接收数据时），你需要为行格式不正确的情况做好准备。`NumberFormatException`\
  \ 是运行时异常，所以你不需要拦截它。但如果你不这样做，在未来的某一天，你的程序就会崩溃。\n\n上面的示例没有涵盖字符串到 `short` 和 `byte`\
  \ 的转换。记住，所有数值数据类型都可以强制转换为 `short` 和 `byte` 类型，如下代码段所示。\n\n示例 6-6a. byte 和 short\
  \ 类型值的行转换。\n\n```java\nString S=\"0\";\ntry {\n    byte b=(byte)Integer.parseInt(S);\n\
  \    // 将 int 值截断为 byte；\n    // 可能会丢失信息。\n    short s=(short)Integer.parseInt(S);\n\
  \    // 将 int 值截断为 short；\n    // 可能会丢失信息。\n} catch (NumberFormatException e) {\n\
  \    // 来自不可接受的 S，\n    // 你可以再次抛出异常。\n}\n```\n\n![](img/image09233.jpeg)\n\n建议：在上面的代码段中，要将字符串转换为\
  \ `byte` 和 `short`，请使用 `Integer.parseInt()` 然后对结果进行强制转换。\n\n\n\n\n容器允许你放入任意数量的对象，并为放置和搜索对象提供了非常实用的功能。`Hashtable`\
  \ 类允许你创建键值对并通过键访问对象。`Vector` 类在需要创建许多许多同类的副本时非常有用，但无法预先知道这些副本的数量时。`Stack` 类允许你根据后入先出的原则跟踪一组对象。“面世”。\n\
  \n![](img/image09235.jpeg)\n\n让我们从最简单的数据容器 `Vector` 类开始吧。不要让它的名字误导了你——这个类并不是专门为复杂的科学或图形化程序预留的。`Vector`\
  \ 类本质上是一个可扩展的数组。在课堂中理解了这一点后，你会发现它有许多用途。你是否曾经需要一个某种类型的数据数组，但又不知道它的具体值（大小）？`Vector`\
  \ 类解决了这个问题。与数组不同，你可以根据需要向 vector 中添加任意数量的元素。在向 vector 添加完元素后，你可以创建一个正确大小的数组并将所有元素复制到其中。表\
  \ 6-10 给出了完成此类工作所需的主要方法。\n\n表 6-10. `Vector` 类基本方法\n\n## 方法描述\n\n`void addElement(Object\
  \ o)` 添加一个对象。\n\n`void insertElementAt(Object oh, int i)` 在位置 i 插入对象 o。元素不会被销毁，大小增加\
  \ 1。\n\n`void copyInto(Object someArray[])` 将 vector 中的所有元素复制到数组 `someArray` 中。\n\
  \n`int length()` 返回 vector 中的元素数量。\n\n让我们来看看这个数据结构的实际运行情况。还记得第 4 节中“语法与语义”的卡通 applet\
  \ 吗？我们曾使用 `Applet` 类的 `getParam` 方法从 html 页面获取图像 URL。我们随意设置了 5 张图片。另一方面，我们可以统计图片的数量，然后创建一个该大小的数组。通过创建一个\
  \ vector，我们可以将遇到的每张图片都添加到 HTML 页面上对应的参数中。现在，我们可以编写可以加载任意数量图片的 applet 动画片了。\n\n示例\
  \ 6-8. 从任意数量图片生成的 applet 动画片。\n\n```java\npublic class AnimatedApplet extends applet\
  \ {\n  private Image imgs[];\n\n  public void init() {\n    if (getImages()0) {\n\
  \n    }\n  }\n\n  public int getImages() {\n    int index=0;\n    vector imageVec=new\
  \ Vector();\n    while (getParameter(\"image\"+indx)!=null) {\n      String S=getParameter(\"\
  image\"+indx);\n      try {\n        URL U=new URL(getDocumentBase(),S);\n     \
  \   Imageim=getImage(U);\n        imageVec.addElement(im);\n      } catch {\n  \
  \      showStatus(S+\"is not a valid URL -. skipping\");\n      } \n      indx=indx+1;\n\
  \    }\n    imageVec.copyInto(imgs);\n    return index;\n  }\n}\n```\n\n现在我们有一种方便的方法来保存任意数量的图片，而且我们把它们全部放入一个数组中。如果你愿意，也可以让它们留在\
  \ vector 中。由于使用 `insertElementAt` 方法可以访问存储在其中的任何图片，我们的 vector 也可以像数组一样工作。这种方法在我们预期稍后会有额外到达时是必要的。但如果我们不预期有新元素，通常使用\
  \ `copyInto` 方法是最好的。定义程序如何处理数组比处理 vector 要容易得多。在内存使用方面，应用数组更高效且直接。因此，通常在第一次调用时就很好地考虑数组的大小。\n\
  \n存储无限数量的对象是 `Vector` 类最强大的用途，但它也可以用于其他目的。表 6-11 描述了允许你对所有 vector 进行精确复制、查找特定元素、通过索引引用元素以及删除所有元素的方法。注意无法删除部分\
  \ vector 元素——delete 方法的工作原理是“全有或全无”。\n\nboolean\n\n表 6-11. `vector` 类附加方法\n\n##\
  \ 方法描述\n\n`boolean contains(Object o)` 如果对象位于 vector 中，则对每个元素执行 `o.equals(eachlObject)`。\n\
  \n`int indexOf(Object o)` 返回对象的位置，如果它不在 vector 中则返回 -1。使用的 `equals` 方法与上述所示。\n\n\
  `int indexOf(Object oh, int i)` 与之前的方法 `indexOf` 相同，但从位置 i 开始搜索。\n\n`int lastIndexOf(Object\
  \ o)` 行为类似于 `int indexOf(Object o)`，但从最后一个元素开始搜索。\n\n`int removeAllElements()` 删除\
  \ vector 中的所有元素。\n\n`boolean isEmpty()` 如果 vector 为空，则返回 true。\n\n由于 `Vector` 类没有预定义的大小，你可能在想它有多有效。由于它是一个动态结构，我们不能期望它像数组一样高效——随着它的增长，它会不断需要更多空间。默认情况下会预留空间。你可以在\
  \ vector 创建后使用 `ensureCapacity` 或 `setSize` 方法控制 vector 的大小。如果你需要在不改变大小的情况下确保空间可用，可以使用\
  \ `ensureCapacity`。如果你的 vector 大于设置的大小，`setSize` 方法是危险的。因此最好使用 `ensureCapacity`。\n\
  \n#### 方法\n\n构造函数\n\n表 6-12. `Vector` 类效率\n\n#### 描述\n\n`Vector(int size)` 创建一个包含\
  \ size 个对象的 vector。\n\n`Vector(int size, int inc)` 创建一个包含 size 个对象的 vector，并建立增量\
  \ inc。\n\n`ensureCapacity(int size)` 如果容量小于 size，则提供足够的位置。\n\n`setSize(int size)`\
  \ 设置大小，可能会移除最后的元素。\n\n与 vector 最适合存储无限数量的对象一样，哈希表被用于存储无限数量的元素对。如图 6-10 所示，哈希表包含两列。一列包含键，另一列包含元素。每个键都与且仅与一个元素相关。如果你尝试向表中添加已存在的键-元素对，相应的元素将被替换。通过将元素对放入哈希表，你可以使用相关的键来访问它们。换句话说，你可以向哈希表传递某个对象，如果该对象是键之一，将返回与该键相关的元素。这些基本操作可以通过表\
  \ 6-13 给出的方法完成。表 6-13. `Hashtable` 主要方法\n\n## 方法描述\n\n`Object put(Object key, Object\
  \ o)` 将键-元素对放入哈希表。如果键已在元素表中，则返回与之关联的元素。\n\n`Object get(Object key)` 返回与键相关的元素。\n\
  \n`boolean containsKey(Object key)` 如果键位于表中，则返回 true。\n\n`Object remove(Object key)`\
  \ 从表中删除键-元素对。\n\n\n\n\n\n现在我们来构建图 6-10 所示的哈希表。首先我们将编写一段不进行任何检查的简单代码，然后让它对错误更具健壮性。由于键是简单的数字，我们应该使用包装后的原始类型。注意此示例中的类型转换。完成工作后，如果我们知道名字，就可以找到人的年龄。\n\
  \n### 示例 6-9a. 使用哈希表工作。\n\n```java\nclass AgeManager {\n    private Hashtable H=new\
  \ hashtable();\n    // other variables\n\n    void updateAge(String person, int\
  \ age) {\n        // name 不能为空! Integer intWrap=new Integer(age);\n        H.put((String)person,(Integer)intWrap);\
  \  return intWrap.intValue();\n    }\n\n    int getAge(String person) {\n      \
  \  // person 必须存在于表中! Integer intWrap=(Integer)H.get((String)person);\n        return\
  \ intWrap.intValue();\n    }\n}\n```\n\n`Hashtable` 类的基本方法允许你从哈希表中获取所需的数字。当我们把名称传递给\
  \ `ageManager` 对象时，它将返回年龄。另一方面，我们必须创建 `Integer` 类对象，因为哈希表不知道如何处理原始数据类型。现在我们已经知道如何从哈希表中存取变量了，可以使我们的方法更具维护性。\n\
  \n### 示例 6-9b. 更稳定的 getAge。\n\n```java\nint getAge(String person) {\n    // 返回：\n\
  \    // 如果人在表中，则返回人的年龄；\n    // 如果人不在表中，则返回 -one；\n    // 如果 person==null，则返回 -2。\n\
  \    if (person==null)\n        return -2;\n    if (!H.containsKey(person)) return\
  \ -one;\n    Integer intWrap=(Integer)H.get((String)person);  return intWrap.intValue();\n\
  }\n```\n\n现在我们应该保护 `put` 方法免受错误影响，并为程序提供发生发生的信息。由于 `put` 方法返回一个对象，我们可以返回旧值。通过这种方式，我们可以确定是在添加新的年龄-姓名对，还是替换了哈希表中的某个人的年龄。\n\
  \n### 示例 6-9c. 修改后的 updateAge。\n\n```java\nint updateAge(String person, int age)\
  \ {\n    // 返回：\n    // 如果更改了，则返回年龄；\n    // 如果未更改，则返回 -one；\n    // 如果 person==null，返回\
  \ -2。\n    if(person==null)\n        return -2;\n    Integer intWrap=new Integer(age);\n\
  \    if (H.containsKey((String)person)) { \n        intWrap=(Integer)H.put((String)person,\
  \ (Integer)intWrap);\n        return intWrap.intValue();\n    } else {\n       \
  \ H.put((String)person,(Integer)intWrap);\n        return -one;\n    }\n}\n```\n\
  \n如上所述，在哈希表的相应操作中，类型转换是必要的；现在让我们看看为什么这样做是有益的。适当的类型转换允许我们将不同类型的对象放入同一个哈希表中。当我们查找它们时，可以解决我们想要接收的对象的类型。让我们在示例\
  \ 6-10 中展示这一点，使用一个非常小的哈希表（这里 `Vector` 类是 `stack` 的超类）。\n\n### 示例 6-10. 类型转换与哈希表。\n\
  \n```java\nVector Vec=giveAsAVector(); Stack St=giveAsAStack();\n// St 是 Vector\
  \ 类的子类 h.put(\"vec\", (Vector)Vec);\nH.put(\"stack\",(Stack)St);\nStack st1=(Stack)H.get((String)\"\
  vec\");  Stack st2=(Stack)H.get((String)\"stack\");\n\n// 我们从哈希表中得到了两个不同的栈，尽管我们只放进了一个：Hashtable\
  \ H=new Hashtable();\nh.put((String)\"stack\", (Stack)st1);\nh.put((String)\"stack\"\
  , (Stack)st2);\n```\n\n我们同样对键值进行相同的操作，这在 get 方法中转换。\n\n所以，我们已经演示了哈希表的基本功能。`Hashtable`\
  \ 类中定义的其余方法如表 6-14 所示。凭借从我们的讨论以及表 6-13 和 6-14 中中学到的信息，你已经可以结合 API 类广泛使用哈希表了。但为了与你自己创建的类一起使用它们，你需要理解\
  \ `hashCode` 方法以及它在哈希表中是如何工作的（将在第 10 章中描述）。\n\n#### 表 6-14. Hashtable 类的其他方法\n\n\
