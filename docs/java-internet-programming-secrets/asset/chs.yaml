  \n\n\n\n在本章中，我们熟悉了构建用户界面的更复杂的技术。通过应用本章讨论的技术以及第 7 章的基础元素，你将能够创建具有丰富、多样界面的应用程序（applets）。`Java`\
  \ 中构建接口的核心是 `container`（容器）和 `manager`（管理器）适配的概念。我们在书的教程部分也将使用这些工具，届时我们将开发几个设计为\
  \ applet 的全功能程序。\n\n在下一章中，将考虑 `Java` 类，允许在 applet 中处理图形信息和输出 `Images`（图像）。\n\n#\
  \ 第九章\n\n![](img/image0926.jpeg)\n\n## 图形与图像\n\n## 使用 `Graphics` 类绘图\n绘制轮廓对象\n绘制填充对象\n\
  文本与绘图\n\n### `Image` 类的使用\n\n导入图像\n使用 `MediaTracker` 类\n创建图像\n\n异步图像的接口\n图像处理\n\n\
  在最后两个章节中，你已经学习了如何创建一个强大且具有吸引力的用户界面。本章将教你如何显示和管理图形，这可能会增加你的 Java applet 和程序的流行程度。\n\
  \n`Graphics` 类是 `java.awt` 层次结构的一部分，为我们提供了许多方法用于在 2D 绘图区域输出几何形状和放置文本（该区域与可见的 `Component`\
  \ 或 `Image` 对象相关）。该包的功能类似于微软画画等简单的图形编辑器。`java.awt.image` 包不同于 `java.awt` 包和 `java.awt.Image`\
  \ 类（尽管与两者都密切相关），它允许在字节级别与图像进行交互，通过程序员指定的算法创建图像。此外，该包还为处理已有的图像提供了强大的工具设施。\n\n![](img/image09266.jpeg)\n\
