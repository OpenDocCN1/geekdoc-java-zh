  \ HTTPget` 对象允许我们通过 `Results` 方法获取 `idx` 文件。反复调用 `httpget` 以获取不同的 `idx` 文件，直到所有文件都接收完毕。\n\
  \n然后，使用 `StringTokenizer` 按照字符 `newline`（`\\n`）将接收到的 `idx` 文件拆分成若干部分，因为在结构化 `idx`\
  \ 文件时，我们将数据放置在了不同的行中。现在，`idx` 文件可以包含四种元素之一：菜单或子菜单（这样我们就必须获取另一个 `idx-file`）、或者 `gif-file`\
  \ 的名称、描述文件的名称或标识符。我们知道这些元素的顺序，因此必须寻找末尾的 `\"/\"` 来定义菜单或子菜单。如果是菜单或子菜单，我们使用目录的 `path`\
  \ 调用 `ParseIndex`（该路径就是当前标记），并添加从 `idx` 文件下一行获取的标签，用 `\"Menu:\"` 标记将它们分隔。我们将所有这些内容添加到字符串变量\
  \ `tree` 中，并传递给 `StoreWindow`，随后它将分析这个预格式化的列表以形成用户界面。递归调用 `ParseIndex` 使用相同的 `ParseIndex`\
  \ 方法但带有不同的参数来解析这些菜单。这种递归的使用避免了我们从引入控制点开始需要执行嵌套循环。\n\n如果标记不是目录（即不是菜单），那么它代表一个产品。我们添加标记（即标识元素）到\
  \ `tree` 中——`\"GIF:\"`、`\"TXT:\"` 和 `\"NAME:\"`。我们将为每个产品添加这三个部分，标签将允许我们调试 `idx-files`\
  \ 或列表 `Tree` 构建过程中出现的问题。我们在每个 `idx` 文件内部循环，直到其处理完成，但在递归处理菜单和子菜单时，我们会进行多次分支。生成的变量字符串\
  \ `Tree` 看起来可能很混乱，但我们在 `StoreWindow` 上使用了类似的递归方法来形成用户界面，这种方法对于处理我们在此创建的非线性表单树形配置非常方便。\n\
