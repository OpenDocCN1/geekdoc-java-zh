  \n来自其他服务器或其他协议的交互：国际象棋客户端\n\n契约属性\n\n开发与执行\n\n来自异步服务器的交互：创建棋盘\n\n来自 CIS 的棋盘连接\n\n\
  编写 Applet：可能的改进\n\n窗口登录\n\n列出当前玩家\n\n# 你从本章中学习了什么\n\n在这里，我们为国际象棋服务器创建一个 Java 语言的图形客户端，详细考虑了以下问题：\n\
  \n*   套接字编程；\n*   异步广播数据；\n*   多线程；\n*   创建综合自定义界面。\n\n# 契约\n\n想象有一家新成立的互联网公司决定为互联网社区创建免费的高质量娱乐内容，以吸引用户进入他们的服务器，并委托我们执行这项工作。我们认为一个国际象棋程序非常适合这项任务，让人们相互对弈。我们将使用内部界面国际象棋服务器（国际象棋互联网服务器，CIS），因为它可以执行诸如建立连接、选择玩家、记录计分、检查走法正确性等功能。但服务器的能力在某种程度上受到限制，因为它的界面是符号性的。在屏幕上，即服务器提供的图\
  \ 18-1 所示的文本棋盘。\n\n![](img/image09332.gif)\n\n### 图 18.1.\n\nCIS 根据 GNU 公用许可证条款免费分发；可以在\
  \ `ftp://chess.onenet.net/pub/chess/Unix` 找到。\n\n有几个用于与国际象棋服务器工作的图形外壳，但它们并不是为每个平台编写的，而且必须预先安装在客户端电脑上。我们决定开发一个\
  \ Java Applet，作为与服务器工作的图形外壳。通过以 Applet 形式编写图形外壳（用户界面），我们同时解决了两个问题：首先，客户端可以在任何安装了\
  \ Java 的计算机上运行，其次，用户在安装方面不会遇到问题。Netscape Navigator 及相关程序中引入的 Applet 安全限制并没有影响到我们，这是因为服务器和客户端可以安装在同一台电脑上。\n\
  \n# 属性\n\n为 CIS 添加图形前端的最重要功能是允许你使用鼠标的图形棋盘。我们还需要一个内部文本字符串，用户可以在其中向 CIS 发送不是由我们客户端生成的命令。CIS\
  \ 支持限时限制的国际象棋比赛，因此我们将在棋盘上添加一个动态时钟，计算活动玩家的秒数。玩家允许与当前在服务器上的其他玩家通信，因此为了方便通信，我们将添加另一个文本框。有时在通信的混乱中，比赛的输入请求会丢失——我们将强制客户端跟踪这些请求并在单独的窗口中显示给用户。作为点睛之笔，我们将添加一个动态更新的服务器玩家列表，显示接收到的当前比赛请求。从这个列表中，用户将可以选择一个潜在的对手。\n\
  \n# 开发与执行\n\n让我们大致按时间顺序描述开发过程。从最基础的任务开始，我们将开发解决方案，然后将在生成的骨架上构建肉，成为一个功能的 CIS 客户端。之后，我们将开发\
  \ Applet 的一些扩展并为读者提供一系列练习。\n\n核心任务包括：为 CIS 开发 Applet 图形外部界面。为了构建具有适当复杂性的 Applet，我们必须将任务分解为几个部分，即：\n\
  \n*   服务器的开发程序\n*   通用棋盘的创建\n*   连接 CIS 的类\n\n客户端作为用户之间的连接\n\n## 来自异步服务器的交互\n\n\
  第 13 章，你学会了如何使用套接字建立 Applet 与服务器之间的连接。然而，我们还没有触及异步连接。简单的服务器，例如，同步数据流——它总是等待命令输入才传输数据。有些服务器是异步的——它们可以在任何方便的时间发送数据。得益于此，我们可以确保无论\
  \ Applet 多么忙，来自网络的数据都能被接收。数据接收器以 String 形式从 InputStream 读取数据，并在 EOL 或 EOF 处分割字符串。让我们描述此接口：\n\
  \n```java\npackage ventana.io\npublic interface Listener {\n    void receiveInput(InputStreamHandler\
  \ i, Object o);\n}\n```\n\n该方法允许数据接收器——InputStreamHandler 类——通过 receiveInput 方法将读取的\
  \ String 值传递给另一个对象。Listener 能够接受任何对象，但在本例中我们只通过它传输 String 值。除了我们返回 InputStreamHandler\
  \ 的引用外，当我们需要同时使用多个线程时，它大有 Utility：\n\n```java\npackage ventana.io\nimport java.io.*;\n\
  \npublic class InputStreamHandler implements runnable {\n    private Thread engine;\n\
  \    private DataInputStream in;\n    private Listener client;\n\n    public InputStreamHandler(InputStream\
  \ in, Listener client) {\n        this.in = new DataInputStream(in);\n        this.client\
  \ = client;\n        engine = new thread(this);\n        engine.start();\n    }\n\
  \n    public void close() {\n        if (in != null) {\n            try {\n    \
  \            in.close();\n            } catch (IOException e) {\n            }\n\
  \        }\n        engine.stop();\n    }\n\n    public void run() {\n        if\
  \ (in == null) {\n            return;\n        }\n        String s;\n        try\
  \ {\n            s = in.readLine();\n        } catch (IOException e) {\n       \
  \     return;\n        }\n\n        while (s != null && engine.isAlive()) {\n  \
  \          client.receiveInput(this, s);\n            try {\n                s =\
  \ in.readLine();\n            } catch (IOException e) {\n                s = null;\n\
  \            }\n        }\n    }\n}\n```\n\n## 创建棋盘\n\n\n\n\n构成棋盘的代码与与服务器交互的代码无关。因此，我们创建的棋盘同样可以很好地用于下棋，例如下国际跳棋。我们的棋盘非常简单——它由\
  \ 8x8 的正方格组成，包含若干张图像，并对鼠标移动和点击做出响应。\n\n我们的棋盘是 `Canvas` 类的扩展，而 `Canvas` 又是抽象类 `Component`\
  \ 的一种某种程度上可行的实现。我们决定不为棋盘使用 `Container` 类，原因有两个。首先，`Images` 类型的棋子不属于 `Component`\
  \ 类，因此不能直接添加到 `Container` 对象中。其次，如果 `Container` 对象包含大量的 `Component` 对象，则针对 Microsoft\
  \ Windows 的 Java API 现代实现将无法正常工作。\n\n`ChessBoard` 类负责绘制棋盘和生成走法。\n\n表 18-1 列出了 `ChessBoard`\
  \ 类的通用方法。\n\n表 18-1. `ChessBoard` 类的通用方法\n\n## 方法描述\n\n`setImage(Image, String)`：设置包含给定字符串和给定图像的方格，并重绘该方格。该行必须提交您自己的棋位标记字段，例如\
  \ \"A1\"。\n\n`endGame()`：结束棋类游戏。`setGenerateMoves(boolean)`：指示是否允许用户走子。\n\n`setOrientation`：棋盘的方向——白方在上（true）或白方在上（false）。`boolean\
  \ getOrientation()`：返回当前棋盘的方向。\n\n`ChessBoard` 类包含一个二维数组 `images`。该数组用于处理和吃掉棋子的字段。\n\
  \n`ChessBoard` 允许通过 `setImage` 方法访问字段数组。`setImage` 方法没有直接定义数组索引，而是允许您在带有棋盘表示法的行中指定要更改哪个字段。从棋位标记到数组索引的转换通过内部手段完成，这允许根据棋盘的方向（白方向下或白方向上）以不同的方式实现。例如，如果用户玩白方，则\
  \ \"A1\" 字段应该在左下角，但如果他玩黑方，则应该在右上角。\n\n当用户点击棋盘时，它会被高亮并在上面出现一个红色圆圈，表示被选中。如果用户再次点击此框，则取消选中且圆圈消失。如果用户在第一个字段仍被选中的情况下点击另一个字段，则会生成一个走法并传递给父类\
  \ `ChessBoard`，之后第一个字段将取消选中。这种行为可以通过 `setGenerateMoves` 方法禁用——以防止用户违规走子。\n\n以下是用于我们类\
