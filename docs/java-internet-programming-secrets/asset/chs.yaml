  \n返回对象 `Rectangle` 的矩形限制。\n\n根据前四个整数复制矩形。沿 X 轴和 Y 轴移动的由最后两个整数给出。\n\n`dispose()`\
  \ 使此 `Graphics` 对象不再可用。\n\n### `Image` 类的使用\n\n虽然 `Graphics` 类的方法足以创建简单的图形图像（如条形图或图标菜单），但它们不允许你通过直接操作特定像素来执行复杂的图形操作。要做到这一点，你应该使用\
  \ `Image` 类。`Image` 对象有用之处在于它们提供了一个方便且一致的接口，用于处理从已知图形标准文件中导入的图像。在本节中，我们将讨论图像实际上是如何工作的，以及图像的异步工作，然后是数据无法立即获取的图像。\n\
  \n`image` 类属于 `java.awt` 包，提供了几个方法，帮助请求图像的信息，例如其宽度或高度。这些方法列在表 9-4 中。\n\n表 9-4 `Image`\
  \ 类的方法\n\n### 方法说明\n\n`Graphics getGraphics()` 返回一个与图像连接的图形对象。\n\n`int getHeight(ImageObserver)`\
  \ 如果已知，返回图像的高度。如果高度未知（可能是因为图像尚未接收），此方法返回 -1，并在高度已知时向给定的 `ImageObserver`报告。\n\n`int\
  \ getWidth(ImageObserver)` 如果已知，返回图像的宽度。如果宽度未知，此方法返回 -1，并在宽度已知时向给定的 `ImageObserver`\
  \ 。\n\n`Object getProperty(String, imageobserver)` 请求由 `String` 参数指定的属性值。例如，使用名称“comments”来保存包含图像文本描述的注释。如果该图像未定义所请求的属性，则此方法将返回一个\
  \ `UndefinedProperty` 对象。如果请求的属性可用但尚未存在（例如图像尚未接收），此方法将返回一个空指针，并在属性可用时向给定的 `ImageObserver`\
  \ 报告。\n\n`ImageProducer getSource()` 返回产生这些图像像素的 `ImageProducer`。\n\n`Flush()` 清除当前图像使用的所有资源，包括所有保存的像素数据。如果再次使用此图像，必须重新创建或加载。\n\
  \n`ImageObserver` 和 `Producer` 使用表 1.9-4 中提到的接口进行通信，并被 Java API 用于允许程序员处理数据尚未完全可用的图像。我们将在本章稍后的“异步图像接口”中讨论这些接口。记住，`Component`\
  \ 类实现了 `ImageObserver` 接口，因此当你需要传递 `ImageObserver` 作为参数时，可以传递指向运行中的 `Component`\
  \ 的链接。\n\n\n\n\n`MediaTracker` 类是 `java.awt` 层次结构的一部分，提供了一种执行和管理这一过程的优秀方法。`MediaTracker`\
  \ 的核心思想是：当图像被创建时，它会被添加到 `MediaTracker` 跟踪的对象列表中。为每个中间对象分配了某种意义上的优先级，程序员可能可以在任何时间挂起操作，直到所有给定优先级的对象都准备好显示为止。`MediaTracker`\
  \ 类目前仅支持图像，但 Sun 公司计划在可预见的未来将其扩展到播放音频片段，并可能包括视频片段。`MediaTracker` 类提供的最有用方法列在表 9-5\
  \ 中。\n\n### 表 9-5. `MediaTracker` 类最常用的方法\n\n## 方法描述\n\n| 方法 | 描述 |\n| :--- | :---\
  \ |\n| `MediaTracker(Component)` | 创建新的媒体跟踪器，它将成为给定组件的中间者。 |\n| `addImage(Image,\
  \ int)` | 将具有特定优先级的图像添加到代理中。 |\n| `addImage(Image, int, int, int)` | 将具有优先级的图像添加到中间件中，该优先级由第一个整数决定。图像的\
  \ own 和高度被赋予以下值。 |\n| `boolean checkAll()` | 检查所有可跟踪中间件是否已完成加载。如果数据尚未开始加载，此方法不会启动加载。\
  \ |\n| `boolean checkAIl(boolean)` | 检查所有可跟踪中间件是否已完成加载。如果对象尚未加载且布尔参数为 true，则此方法将启动它们的加载。\
  \ |\n| `waitForAII()` | 等待所有可跟踪的中间件完成。`waitForAIl(long )` 直到所有被跟踪的中间件完成或经过某些毫秒后。\
  \ |\n| `waitForlD(int)` | 等待所有指定优先级的代理人完成。 |\n| `waitForlD(int, long)` | 等待所有指定优先级的中间件完成或经过某些毫秒后。\
  \ |\n\n下面是一个简单的代码段段，它通过 URL 请求图像并使用 `MediaTracker` 获取它。请注意，在用 `MediaTracker` 的 `waitForAll`\
  \ 方法时，我们必须处理 `InterruptedException` —— 我们正在挂起当前的性能流，并且应该直接或间接地检查异常：\n\n```java\n\
  MediaTracker tracker;\n\ntracker = new MedlaTracker(this); Image i;\n\ni = getImage(imageURL);\
  \ tracker.addImage(i, one); try {\n\n    tracker.waitForAll();\n\n} catch (InterruptedException\
  \ e) {}\n```\n\n## 创建图像\n\n我们现在可以从网络下载图像并确保它们被及时送达。如果我们想创建自己的图像呢？一旦 `Image` 类被用\
