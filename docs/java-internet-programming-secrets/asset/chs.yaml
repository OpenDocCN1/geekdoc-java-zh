  \ 12 号样式发送一条更新消息，形成一个包含多个由空格分隔字段的行：\n\n`<12> rnbqkbnr ppppppppp ---- ----- ----\
  \ ---- PPPPPPP RNBQKBNR W -one one one one one one 0 one donald donald 2 0 0 39\
