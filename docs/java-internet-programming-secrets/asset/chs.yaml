  合约计划工作\n\n创建图像结构布局结构图像\n\n实现\n\n机会配置\n\n屏幕输出的基本类 创建器\n\n创建 ActionArea\n\n可能的改进\n\
  \n# 你从这一章中学到了什么\n\n在这里我们将创建一个高层交互式动画 applet。创建动画和交互性本身是一个简单的任务，但我们希望编写一个让 Web 设计师在不会\
  \ Java 编程的情况下也能轻松使用的 applet。首先考虑一下，我们需要哪些知识：\n\n* 使用 `URL` 类访问文件配置。\n* 使用 `class`\
  \ 类动态加载远程类。\n* 用于扩展机会配置的创建接口。\n* 从帮助媒体跟踪器跟踪图像。\n* 应用双双缓冲以消除屏幕闪烁。\n* 分发鼠标事件。\n\n\
  # 合约\n\n想象一下，一家在线广告代理公司通过帮助 applet 使其网页多样化。特别是它对 Java 语言提供的交互式动画感兴趣，你被要求创建一个 applet，能够根据一系列图片创建动画并与用户交互。例如，用户应该能够点击或将鼠标移动到图片的某些部分以加载新页面或更改动画。同时，由于代理员工无法自己编程，因此需要一个高层级的\
  \ applet，在其中设置更改组成动画的图片的能力，并模拟 applet 对用户操作的反应。\n\n因此，我们的 applet 面向两类观众——查看 applet\
  \ 的 Web 用户，以及将其用于他们目标的 Web 设计师。\n\n然而，在深入编程之前，让我们看看如何利用我们已知的知识来实现所需目标。之后，让我们构建并实现高层\
  \ applet。\n\n# 属性\n\n我们知道我们的 applet 将有两个观众——来自广告公司的 Web 用户和 Web 设计师。让我们思考 applet\
  \ 应该具备哪些属性来满足第一类受众的需求。\n\napplet 的目的是在广告消息发送给 Web 用户时让网页变得活跃。我们的 applet 是消息载体，因此我们需要确保\
  \ applet 作为这样一个工具能够正常工作。我们遇到的第一个困难是 applet 必须通过网络下载并运行。因为他只是网页的一个元素，人们可能不想等到它出现在你面前。如果下载花费时间过长，用户可能在甚至不知道\
  \ applet 存在之前就离开了页面。这个问题对于像我们这样的 applet 来说尤为突出，因为它必须加载很多图片，而在互联网上传输图片需要时间。这就是为什么必须让\
  \ applet 立即启动，甚至在如何加载图像之前。\n\n此外，我们需要确保图像的动画是平滑的。这通过第 5 章“工作中的 Applet”中描述的双缓冲帮助技术来实现。\n\
  \n关于如何实现快速加载、平滑动画和易用界面的问题涉及到 applet 作为消息传输工具的功能技术方面。现在我们需要考虑如何让 Web 设计师显示消息变得更简单。我们无法影响\
  \ Web 设计师对 applet 图形的选择，但我们可以采取这种方法，让图像在 applet 中更容易构建。\n\n`PARAM`\n`APPLET`\n`URL`\n\
  \n# 计划工作\n\n好了，我们已经讨论了与未来的 applet 相关的问题，让我们思考解决方案。从外部和内部两个角度审视我们的 applet。外部 applet——是用户看到的部分，而内部——是\
  \ Web 设计师用来构建 applet 的部分。外部是逻辑起点点，因为只有在创建东西时，才会考虑它的形成。\n\n## 创建图像结构\n\n我们已经知道如何处理图像的主要元素，知道如何让图片动画以及与鼠标交互。基本上，我们所做的一切都由这两个元素组成。当我们移动鼠标或点击图片时，我们会查看为给定图像描述的区域，如果鼠标在其中一个内部，则执行相应的的操作。\n\
  \n\n\n\n下一个任务将是在定义的区域内，对移动或点击鼠标设置设置正确的响应。一种解决方案是在 `mouseMove` 和 `mouseDown` 方法中创建一系列\
  \ `if-then-else` 语句。我们可以在配置 applet 时，将来自 `regions` 的每一个项目以及相关的 `action` 加载到 `hash\
  \ table` 中，并在每个 `mouse` 动作时查看该表。我们假设仅使用 `Polygon` 类进行区域描述，并将它们都放在一个名为 `areasTable`\
  \ 的哈希表中。然后，`mouseDown` 方法可以如下所示管理点击 `mice` 区域：\n\n```java\npublic boolean mouseDown(Event\
  \ evt, int x, int y) { \n    Enumeration e=areasTable.keys();\n    while (e.hasMoreElements())\
  \ {\n        Polygon p=e.getNextElement();\n        if (p.inside(x,y)) {\n     \
  \       String S=(String)areasTable((Polygon(p));\n            if (S.equals(\"sound\
  \ action\")) {\n                // 发布声音\n            }\n            if (s.equals(\"\
  link action\")) {\n                // 连接到页面\n            }\n            if (s.equals(\"\
  redirect action\")) {\n                // 改变动画\n            }\n            // ...以及\
  \ T 等，适用于所有类型的区域\n        }\n    }\n    return true;\n}\n```\n\n在我们的示例中，存在几个可以避免的性能问题。然而，通过提高程序的效率，我们可以缩小它的范围。如果我们使用表查找方法，那么每当出现一种新类型的动作时，都必须修改程序。与其如此，我们可以为热点（hotspots）创建一个基类。这样，我们的\
  \ applet 只需要告诉热点它应该做什么，`mouseDown` 方法也将变得简单得多。由于我们不再需要哈希表，我们将 `actionAreas` 存储在一个名为向量\
  \ `aAreas` 中：\n\n```java\npublic boolean mouseDown(Event evt, int x, int y) { \n\
  \    Enumeration e=aAreas.elements();\n    while (e.hasMoreElements()) {\n     \
  \   actionArea A=e.NextElement();\n        if (A.inside(x,y)) {\n            A.doAction();\n\
  \        }\n    }\n}\n```\n\n现在，我们不需要在每次创建活动区域时都重写 applet。此外，`mouseDown` 方法也清晰得多。但如果我们想创建两个同步动画或为\
  \ applet 增加额外功能呢？问题在于我们将所有函数都直接放在了内部 applet 方法中。\n\n更好的做法是创建一个 `component`，然后可以将其放置在\
  \ applet 中。由于 `Applet` 类是 `Container` 类的子类，它将自动将其事件分发给它包含的组件。事实上，在 `component` 内部执行工作将有助于交互式动画与任何\
  \ applet 的交换。这与使用 `Scrollbar` 或 `Component` 类的其他子类是一样的。但我们在哪里创建子类呢？直接子类 `Component`\
  \ 类是可能的，但最好让我们子类 `Canvas`。`Canvas` 类将使布局图片变得更容易，如果我们希望图形能够移动，这一点很重要。让我们这个 `Canvas`\
  \ 类的子类命名为 `actionImageCanvas`。\n\n所以，我们需要几个类。我们确实有一个 `Applet` 类的子类，但从现在起它将起非常很小的作用——它只包含\
  \ `actionImageCanvas`。此外，我们还有 `actionArea` 类的子类。值得将 `actionArea` 子类直接放在 `actionImageCanvas`\
  \ 中吗？为了做到这一点，你必须直接将 `Images` 传输到绘图表面，但如果我们某天想在客户端侧对图像进行创建或更改，这可能会变得不方便。\n\n相反，让我们创建一个\
  \ `actionImage` 类，它将显示自己并跟踪 `actionArea`。结果是，我们将为前端创建一个层次结构，如图 16-1 所示。注意，这种层次结构不是继承意义上的层次结构，而是在\
  \ `Togo` 即我们结构化显示方面。这种层次结构投资更快。\n\n![](img/image09320.gif)\n\n### 图 16.1.\n\n现在让我们看看动画是如何构建到我们的方案中的。动画的概念与其他任何动画相同，只是我们不仅是在显示图片，还必须激活特定的\
  \ `actionImage` 对象。这里唯一的问题在于规模，即我们的层次结构必须运行并支持什么样的工作流。我们可以安全地排除 `Applet` applet\
  \ 子类的考虑——`actionImageCanvas` 的整个重点是将项目与 applet 分离。从 `actionImageCanvas` 启动线程，如果我们以后想在同一个工作区内运行多个动画，将会产生复杂性。因此，剩下的就是指导\
  \ `actionImage` 类表的启动。图 16-1 显示了分配给我们系统各个类的哪些函数。\n\n**表 16-1. 功能类**\n\n| 类 | 功能子类类\
  \ |\n| :--- | :--- |\n| applet | 广播开发类 `actionImageCanvas`。 |\n| actionImageCanvas\
  \ | 为 `actionImage` 类创建绘图表面。检查多个动画的范围和冲突。发送事件 `actionImage` 类。 |\n| actionImage\
  \ | 启动动画。交换。发送事件 `actionArea`。 |\n| actionArea | 执行。 |\n\n### 布局图片\n\n### 动态配置\n\
  \n重点包括规模，读取行，这让网页设计师在配置文件中读取，并使用它来创建我们基类的子类。我们希望以这种方式实现最高级别的配置机会。如果我们随后创建了子类 `ActionImageCanvas`\
  \ 并为其添加了新功能，我希望网页设计师只需要通过学习几个需要在配置中设置的新参数就能利用这些功能。同时，我们需要尽可能防止网页设计师接触程序的内部复杂性。毕竟，这很大程度上是我们程序员的职责。\n\
  \n\n\n\n如上所述，我们的系统将使用一种非常简单的编程语言来工作。首先，让我们考虑系统对这种语言提出的要求。我们需要能够确定 Web 设计师需要哪种类，但不要忘记，仅仅实例化一个类并不能让它变得可用运行。我们还需要一种方法向\
  \ `instance`  添加额外信息。例如，我们的 `actionArea` 类需要知道它们在图像中的位置。此外，`actionArea` 类的每个子类必须包含关于其自身\
  \ `action` 的信息。例如，`linkArea` 类应该知道从哪个 `page` 建立连接。因此，我们的语言必须能够向对象传递任意数量的配置信息。\n\n\
  此外，我们必须确保正在将信息传递给正确的对象。一个动画帧可能包含多个 `linkArea` 类，我们需要确保配置信息不会将一帧的 `linkArea` 类与另一帧的\
  \ `linkArea` 类相混淆。因此，我们必须能够区分配置信息，以便它们命中正确的位置。\n\n同时，这种语言应该是简洁的。我们知道 Web 设计师熟悉 HTML，并且紧跟其不断涌现的扩展。因此，可以基于类似\
  \ html 的这种难度来创建语言，或者在质量模型中使用 HTML。\n\n让我们尝试创建一个类似于 HTML 的配置语言。我们想描述具有两个图片的交互式动画。第一张图片将包含两个\
  \ `ShowDocArea` 类，但第二张将包含 `ShowDocArea` 和 `soundArea`：\n\n```xml\n<ActionImage=ActionImage>\
  \ image=someImage.gif next=1\n\n<ShowDocArea=ShowDocArea> [doc=http://www.vmedia.com](http://www.vmedia.com/)\
  \ area=0.0;10.0;10.10;0.10\n</ShowDocArea>\n\n<ShowDocArea=ShowDocArea> [doc=http://www.vmedia.com/java](http://www.vmedia.com/java)\
  \ area=10.10;10.20;20.20;20.10\n</ShowDocArea>\n\n</ActionImage>\n\n<ActionImage=ActionImage>\
  \ image=someOtherImage.gif next=0\n\n<ShowDocArea=ShowDocArea> [doc=http://www.vmedia.com/java](http://www.vmedia.com/java)\
  \ area=0.0;10.0;10.10;0.10\n</ShowDocArea>\n\n<SoundArea=SoundArea> sound=someSound.au\
  \ area=10.10;10.20;20.20;20.10\n</SoondArea>\n\n</ActionImage>\n```\n\n通过借用 HTML\
  \ 语言的风格，我们可以创建一个满足我们要求的任何具有 Web 页面制作经验的人都能理解的简单语言。仍然有几个问题需要解决。首先，你无法在一个 `ActionImageCanvas`\
  \ 内部执行多个动画。这个问题可以通过在更高层级添加 `Animation` 标签来解决：\n\n```xml\n<ActionImageAnimation=ActionImageAnimation>\n\
  tags ActionImageAnimation...\n</ActionImageAnimation>\n\n<ActionImageAnimation=ActionImageAnimation>\n\
  tags ActionImageAnimation...\n</ActionImageAnimation>\n```\n\n现在我们知道文本包含的标签指的是不同的动画。为了确定工作空间的大小并允许对\
  \ `ActionImageCanvas` 进行子类化以添加额外功能，你可以应用相同的策略。这允许在帧中默认设置某些描述类型，并在工作区域的标签中使用它们。最后，语言将在实现类的配置中定型。\n\
  \n目前，我们可以相当自由地描述这种语言，如下所示。不要忘记动画下方层级的每个标签可能出现若干次：\n\n```xml\n<ActionImageCanvas=subclass\
  \ name> options=values\n<ActionImageAnimation=subclass name> options=values\n<ActionImage=subclass\
  \ name> options=values\n<ActionArea=name subclass>\n</ActionArea>\n</ActionImage>\n\
  </ActionImageAnimation>\n</ActionImageCanvas>\n```\n\n为 Web 设计师构建语言后，我们应该解决 `Configure`\
  \ 类在启动 applet 时如何运行。在这种情况下，我们需要接口。我们可以使用一个名为 `Configurable` 的接口。我们的 `Configure`\
  \ 类将能够传递引起的方法，在 `configurable` 接口中特定的，这在界面上是如何显示的。16-2。\n\n![](img/image09321.gif)\n\
  \n# 实现\n\n#### Rice. 16.2.\n\n完成设计后，我们可以开始编写程序了。从哪里开始？可以写 applet，实现所需的动画，然后修改我们的项目。但如果你考虑为了让我们的系统工作必须有多少不同的系统相互交互，发现最好的方法是从单独编写每个模块开始。这意味着在程序真正运行之前需要更多时间，但当它开始工作时，我们会发现自己更接近交付目标。\n\
  \n### 配置机会\n\n首先，我们需要 `Configurable` 接口来安装系统。必须将我们层次结构中的模块连接到更高级别的模块。众，当模块连接时，它需要传递配置信息。如果能让模块知道配置何时完成就好了。模块就可以检查它是否有足够的信息来开始运行。结果我们为接口\
  \ `configurable` 提供了三个方法：\n\n```java\nInterface Configurable {\n    public void\
  \ attachObject(Object o) throws Exception;\n    public boolean setParent(Configurable\
  \ parent);\n    public void configureObject(String params, String value);\n}\n```\n\
  \n注意 `attachObject` 方法对应对象；这意味着 `Configure` 实现了该类，然后将其传递给连接的对象。我们赋予了最后两个方法抛出异常的能力，但正如第\
  \ 10 章讨论的，不给这些异常描述性的名称是一个坏主意。所以让我们请求随 `configurable` 接口的异常。顶级异常可以命名为 `ConfigurableException`，以便我们知道在哪里产生的。现在我们看看最近两个方法是否正常：\n\
  \n![](img/image9322.gif)\n\n#### Rice. 16.3.\n\n现在我们可以完成 `Configurable` 接口的编程，以此完成项目的第一个真实程序。由于它是特定的，将其放入\
  \ `ventana.util` 包中：\n\n```java\npackage ventana.util;\npublic interface Configurable\
  \ {\n    public void attachObject(Object o) throws configurationAttachmentException;\n\
  \    public void setParent(Object o);\n    public void configureObject(String params,\
  \ String value) throws ConfigurationInvalidParameterException, ConfigurationInvalidValueException;\n\
  \    public void completeConfiguration() throws ConfigurationFailedException;\n\
  }\n```\n\n下一步是创建一个基类 `Configure`。我们之后可能需要它，所以写一个对应 `Configurable` 接口的通用类，并将其放在 `ventana.util`。为了保持该类的通用，将在特殊类\
  \ `ConfigFileParser` 中分析我们的语言：\n\n```java\npackage ventana.util;\nimport java.util.*;\n\
  public class Configure {\n    private ConfFileParser parser;\n    private Stack\
  \ Configurables;\n    private Configurable original;\n\n    public Configure(ConfigFileParser\
  \ cfp, Configurable startObject) {\n        parser = cfp;\n        parser.setConfigure(this);\n\
  \        Configurables = new Stack();\n        Configurables.push(startObject);\n\
  \    }\n\n    public boolean startConfiguration() {\n        return parser.start();\n\
  \    }\n\n    protected Configurable currentConfigurable() {\n        return (Configurable)Configurables.peek();\n\
  \    }\n}\n```\n\n\n\n\n# 以下方法会被 analyzer 调用\n\n```java\npublic void attach(String\
  \ classname) throws NotConfigurableException, ConfigurationAttachmentException,\
  \ ClassNotFoundException, instantiationException, IllegalAccessException {\n   \
  \ // analyzer 找出在哪里发生了失败\n    Class thisClass = Class.forName(className);\n    //\
  \ 检查该类是否真的实现了 Configurable 接口\n    Interface[] interfaces = thisClass.getInterfaces();\n\
  \    boolean isConfigurable = false;\n    for (int i = 0; i < interfaces.length;\
  \ i++) {\n        if (interfaces[i].equals(Class.forName(\"ventana.util.Configurable\"\
  ))) {\n            isConfigurable = true;\n        }\n    }\n    if (!isConfigurable)\
  \ {\n        throw (new NotConfigurableException(className));\n    }\n    Object\
  \ instance = thisClass.newInstance();\n    currentConfigurable().attachObject(instance);\n\
  \    Configurables.push((Configurable)instance);\n}\n\npublic void passToCurrent(String\
  \ parameter, String value) throws ConfigurationInvalidParameterException, ConfigurationInvalidValueException\
  \ {\n    currentConfigurable().configureObject(parameter, value);\n}\n\n// 也许可以直接从\
  \ analyzer 调用，但这样整个数字将\n// 持久化整体的——更好的做法是让 analyzer 不要访问堆栈。\npublic void configureCurrent()\
  \ throws ConfigurationFailedException {\n    currentConfigurable().completeConfiguration();\n\
  \    if (!Configurables.empty()) {\n        configurables.pop();\n    } else {\n\
  \        throw (new ConfigurationFailedException(\"empty stack\"));\n    }\n}\n\
