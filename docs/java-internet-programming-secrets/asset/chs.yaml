  得益于我们选择的 applet 结构，我们可以将其扩展到各个领域。最简单的方法是添加新的 `ActionArea`，你也可以可以在 `ActionImageAnimation`\
  \ 类中创建子类，并添加新功能，例如更改图像或在工作区域支持背景图像。在不额外工作的情况下，我们可以在一个 applet 中获得多个工作区域副本并在工作区域内包含多个动画。\n\
  \n## 第 17 章\n\n来自 CGI 的交互：Java 商店\n\nHTTP 请求\n\n商品住宿信息 FIFO 类\n\n获取图像和描述 用户操作处理\n\
  \n读取配置数据和初始化整合一切\n\n将用户的选择传递给 Web 服务器 处理 CGI 程序所采用的数据\n\n可能的改进\n\n# 你从这些章节中中学到了什么\n\
  \n在本章中，我们将创建一个“Java 商店”applet，这是一个“购物车”程序，允许允许虚拟商店的游客查看并选择产品。以下是我们将讨论的问题：\n\n* \
  \  使用 `HTTP` 接收\n*   来自 `CGI` 的连接\n*   设计\n*   创建\n\n\n\n\nJava Applet 将允许用户通过菜单管理商店。菜单中的每一项将代表商店的新部门。嵌套菜单将允许状态将商店划分为子部门。例如，在“编程”部门下，可以“Java\
  \ 书籍”、“C++书籍”和“Visual Basic 书籍”等子部门。Java 商店将有一个“购物篮”。除了包含当前选择用户的列表外，此程序还允许用户从获取列表中删除产品。\n\
  \nJava 商店还将包含参考菜单，用户可以向商店主发送带有提的信件，或接收详细的订单信息。Java 商店由两个主面板组成：左面板包含当前商店部门的产品图像，右面板显示在左面板中选中的商品详细描述。\n\
  \n选择产品后，用户可以点击“结账（Check out of Store）”按钮，该获取将被添加到列表中，并通过 CGI 场景发送到 Web 服务器。这些信息可以封装为与现有基于\
  \ HTML 表单的交互数据相同的格式。这将允许我们调用同一个 CGI 程序。\n\nJava 商店的内部设备比上述外部界面更复杂。菜单是动态组织的——它们是根据永久位于\
  \ Web 服务器上的文件生成的。这允许您无需任何编程即可设置 Java 商店。商店人员可以通过修改文本文件来更换提供的产品、描述和部门结构。Java 商店读取这些文件并根据其指令形成用户界面。\n\
  \n# 设计\n\n首先，我们粗略勾勒用户界面。外部界面必须仔细设计得紧凑且直观。我们决定使用帮助菜单和允许用户在商店部门之间移动的菜单。屏幕将显示一个包含当前商店部门产品图像的大面板、一个可以显示产品描述的面板，以及一个已选产品列表的面板（即购物车）。图\
  \ 17-1 显示了我们希望获得的概览视图和布局元素。\n\n![](img/image09324.gif)\n\n## 图 17.1\n\n我们在 Web 服务器和\
  \ Java Applet 之间使用直接通信。如您所知，Java Applet 可以在 HTTP Web 服务器端口之外打开连接。然而，我们还希望覆盖需要通过防火墙访问\
  \ Web 资源的用户。我们使用内置的 HTTP Web 浏览器，确保任何访问我们 Java 商店 Web 页面的人，也可以访问 Java 商店生成的信息（例如产品图像和描述）。此外，我们必须使用标准的\
  \ HTTP 连接来调用交互商店当前使用的现有 CGI 程序。此任务可以通过 Java API 的两个类——`URL` 和 `URLConnection` 来解决。\n\
  \n我们直接向 Web 服务器发送请求以查找 Java 商店中形成的所有数据。\n\n我们用于生成用户界面的数据文件必须组织良好以便商店人员方便地更改。菜单的主点将包含在\
  \ `Store.idx` 文件中。该文件包含目录名称及相应的菜单。在我们的程序中，该文件如下：\n\n```\nInternet/\nBooks on Internet\n\
  Windows/\nBooks on Windows\nProgramming/\nBooks on programming\n```\n\n目录是商店的部门。目录内部将有一个`.idx`\
  \ 文件，包含图像和描述文件的名称，以及用户选择此项时添加到购物车的唯一名称。如果名称以 \"/\" 结尾，则表示子菜单和相应的商店子部门。部门在物理上仍以目录表示；每个部门都包含自己的\
  \ `idx` 文件。这就是“Internet”部门的典型 `idx` 文件样式：\n\n```\nwebserver.gif webserver.txt\n\
  Book about web server\nJava.gif Java.txt\nProgramming on the Java for Internet\n\
  ```\n\n使用这种目录结构，我们建立了一个易于遵循的严格组织。要进行精确更改，您只需确定应从哪个部门添加或删除哪个产品，进入相应的目录并更改其中的 `idx`\
  \ 文件。批量更改将更耗时，但我们接受这种折协，因为小更改发生的频率比删除所有商店部门高。所有的 `idx` 文件在主 `Store` 类中搜索，而从 `store`\
  \ 类发现的数据组成的用户界面将在 `StoreWindow` 类中生成。\n\n我们通过两个主要类实现 Java 商店。第一个类简单地称为 `Store`（商店）。该模块选择形成用户界面的数据。它还调用\
  \ `StoreWindow` 类。`StoreWindow` 是找到数据用户界面后显示的屏幕。`StoreWindow` 包含购物车、产品图像、商店菜单和产品描述。它还会调用其他方法。\n\
  \n## 图 17.2\n\nJava 商店的内部设备比上述外部界面更复杂。菜单是动态组织的——它们是根据永久位于 Web 服务器上的文件生成的。这允许您无需任何编程即可设置\
  \ Java 商店。商店人员可以通过修改文本文件来更换提供的产品、描述和部门结构。Java 商店读取这些文件并根据其指令形成用户界面。\n\n![](img/image09325.gif)\n\
  \n## 图 17.3\n\n\n\n让我们从辅助类开始我们的实现类。当我们讨论高层的 `StoreWindow` 类时，你会发现这些类很容易适配于联合工作。\n\
  \n在开始编写 `StoreWindow` 类之前，我们将生成并测试每个辅助类。在每个模块的严谨验证上花费的额外时间将使我们能够快速且无意外地将组件组合在一起。在所示的\
  \ `rice.17-4` Java 商店中，买家看到的将如下：\n\n![](img/image09327.gif)\n\n## HTTP 请求\n\n首先，我们需要接收商店安装数据的模块，以便我们形成产品面板和菜单。让我们使用\
  \ `HTTP` 请求来获取安装的 `.idx` 文件。我们将有两个通用类——一个用于发送 `GET` 请求，另一个用于与 Web 服务器上的 CGI 程序进行交互，即\
  \ `POST` 请求。`HTTPpost` 类将在下文中讨论。我们将会介绍 `HTTPget` 类的一个变体，以展示如何使用网络套接字与 Web 服务器进行通信。这两个类的完整源代码可以在随书附带的\
  \ CD-ROM（适用于 `Windows 95/NT` 和 Macintosh 用户）以及在线伴随网页（适用于 `UNIX` 用户）上找到。\n\n在 Java\
  \ API 工具包中，执行 `URL` 创建及连接工作的类有：`URL`、`URLConnection` 和 `URLEncoder`。在第 14 章“使用 URL\
  \ 网络”中，对这些类进行了更详细的讨论。让我们看看 Java 商店中 `HTTPpost` 类：\n\n```java\nimport java.net.*;\n\
  import java.io.*;\npublic class httppost {\n    String CGIresults=\"\";\n\n    public\
  \ HTTPpost(String URLline, String PostData) {\n        String inputLine;\n     \
  \   String PostDataEncoded = \"result=\" + URLEncoder.encode(PostData);\n```\n\n\
  我们设置 `HTTPpost` 选择两个参数——首先是字符串参数 `URLline`，它包含了我们想要在 Web 服务器上执行的 CGI 程序名称以及该程序的完整\
  \ URL。`PostData` 参数包含了我们要发送给 CGI 的数据。我们需要确保所有这些数据都以适当的格式发送到 Web 服务器，因此我们使用了标准的 `x-www-form-urlencoded`\
  \ 配合 `URLEncoder.encoder` 方法。我们将此值分配给字符串 `\"result\"`。CGI 将看到此数据为 `\"result=(PostData)\"\
  `，这意味着位于 `PostData` 中的 `\"result\"` 的值。在创建 CGI 程序时记住这一点很重要，因为我们将这对值提取出来进行处理。在下面的代码段中展示了连接到\
  \ Web 服务器：\n\n```java\ntry {\n    URL url = new URL(urlline);\n    URLConnection\
  \ connections = url.openConnection();\n    PrintStream outStream = new PrintStream(connection.getOutputStream());\n\
  \    DataInputStream instream;\n```\n\n首先，我们使用参数 `urlline` 从 `url` 创建一个新实例。然后，我们使用\
  \ `url.connection` 方法返回的对象创建一个新的 `URLConnection` 实例。这为我们形成输入和输出流提供了基础。我们使用 `URLConnection`\
  \ 作为实际连接的通道，为 CGI 程序的 `PostData` 输出创建一个 `PrintStream`。同样地，在下面我们从 `URLConnection`\
  \ 实例创建一个 `inStream`，以便我们从 Web 服务器或 CGI 程序接收数据：\n\n```java\noutStream.println(PostDataEncoded);\n\
  outStream.close();\n\ninStream = new DataInputStream(connection.getInputStream());\n\
  while (null != (inputLine = inStream.readLine())) {\n    CGIresults = CGIresults\
  \ + inputLine + \"\\n\";\n}\n\ninStream.close();\n} catch (MalformedURLException\
  \ me) {\n    System.err.println(\"MalformedURLException: \" + me);\n} catch (IOException\
  \ ioe) {\n    System.err.println(\"IOException: \" + ioe);\n}\n```\n\n我们现在已经准备好进入业务阶段。首先，我们将参数\
  \ `post data` 发送到 Web 服务器，它会传输其 CGI 程序。然后我们开始从 CGI 接收数据，直到缓冲区为空。这些数据存储在全局变量 `CGIresults`\
  \ 中。我们应该捕获在创建新 `URL` 以及由 `URL.openConnection` 方法引起的所有异常。下面是我们调用的返回结果 `httppost`\
  \ 的方法：\n\n```java\npublic String results() {\n    return CGIresults;\n}\n```\n\n\
  `results` 方法简单地返回 CGI 的输出。它用于确保 CGI 程序接收了我们发送的数据并对其进行了正确处理。我们还可以使用此方法在我们的 applet\
  \ 中向用户显示消息。此外，我们可以从 CGI 程序传回 URL，然后调用 `showDocument` 来强制 Web 浏览器显示页面。它可以用于发送包含“感谢您的购买”页面的\
  \ URL，或者一个告知错误的页面，或是任何类似的内容。\n\n![](img/image09328.jpeg)\n\n### 建议\n`HTTPget` 类不接受\
  \ `POST` 参数；相反，它需要 `QUERY LINE` 参数。它从 Web 服务器获取数据。我们想使用它来接收 HTML。由于 HTML 文件是纯文本，所以我们不需要担心标签。理论上，我们可以接收二进制数据，但这需要更改输入以读取字节。\n\
  \n![](img/image0329.jpeg)\n\n\n\n\n\n```java\nreturn RECIEVEdata;\n\n}\n\n}\n```\n\
  \n## 商品安置信息\n\n`ProductImage` 类不仅存储了产品图像，还存储了标签和描述。该类扩展了 `Canvas` 类。因此，我们可以为其赋予含义，并让对象本身包含特定产品的数据。我们在\
  \ `ImagePanel` 类中使用它，是因为我们要向其中添加产品图像。通过创建指向特定 `ProductImage` 的链接，然后通过该链接引用描述和标签，就可以直接访问描述和标签。这种机制在\
  \ `StoreWindow` 类中实现，这样我们就不需要通过 `ImagePanel` 类来获取数据了。此外，我们还添加了 `height` 和 `width`\
  \ 共享变量，允许 `ImagePanel` 为所有添加到特定 `ImagePanel` 的 `ProductImage` 正确地设置尺寸。让我们考虑一下 `ProductImage`\
  \ 类：\n\n```java\nimport java.awt.*;\n\npublic class ProductImage extends Canvas\
  \ {\n    private Image piece;\n\n    public String label;\n    public int height;\n\
  \    public int width;\n\n    public String description;\n    public void setLabel(String\
  \ s) {\n        label = s;\n    }\n\n    public void setImage(Image i) {\n     \
  \   if (piece != i) {\n            piece = i;\n            height = piece.getHeight(this);\n\
  \            width = piece.getWidth(this);\n        }\n    }\n}\n```\n\n我们没有私有 `label`、`width`、`height`\
  \ 和 `description`，但我们私有部分 `Image`。`setLabel` 和 `setImage` 方法通过各自的对象参数被调用，实例 `ProductImage`\
  \ 将它们存储起来以供以后使用。描述通过直接引用 `ProductImage` 实例中的 `Description` 变量来设置。该对象基于 `Canvas`\
  \ 类，因此我们可以直接将其添加到显示产品图像的面板中：\n\n```java\npublic void paint(Graphics g) {\n    Rectangle\
  \ r = bounds();\n    g.setColor(getBackground());\n    g.fillRect(0,0,r.width,r.height);\n\
  \    if (piece!=null) {\n        g.drawImage(piece,0,0,this);\n    }\n}\n```\n\n\
  现在我们通过 `setImage` 方法将图像传输到 `ProductImage` 拷贝中，以便将其添加到显示商品图像的面板上\n\n## FIFO 类\n\n\
  `FIFO` 类是 API 中可用 `Vector` 类的扩展。`Vector` 是 `java.util` 包中的一个可扩展数组类。我们添加了一些方法来匹配\
  \ `FIFO` 数据结构。`FIFO` 用于用户界面的形成，这使得跟踪该界面的数据变得容易得多。我们可以按照特殊顺序将对象放入 `FIFO` 中，并使用相应的\
  \ `push` 和 `pop` 方法按相同的顺序将它们取出。我们还有一个 `isEmpty` 方法，用于检查列表是否为空：\n\n```java\nimport\
  \ java.util.Vector;\nimport java.util.*;\n\npublic class FIFO extends vector {\n\
  \    public String pop() {\n        String s=\"\";\n        // 获取第一个元素\n       \
  \ try {\n            s= (String)firstElement();\n        } catch (NoSuchElementException\
  \ e) {\n            System.out.println(\"FIFO EMPTY!!!!!\");\n            s=\"\"\
  ;\n        }\n        // 并删除第一个元素\n        try {\n            removeElement(s);\n\
  \        } catch(ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"\
  FIFO EMPTY!!!\");\n        }\n        return s;\n    }\n\n    // 在列表顶部添加元素\n   \
  \ public void push(String s) {\n        addElement(s);\n    }\n\n    // 检查列表是否为空\n\
  \    public boolean empty() {\n        return isEmpty();\n    }\n}\n```\n\n`Vector`\
  \ 类中可用的方法为我们完成了实际工作。它们生成了我们需要捕捉的异常。我们为存储在 vector 中的元素定义了 `String` 变量，但通过一些微调，我们可以强制\
  \ `FIFO` 接受任何对象。我们选择了 `object` 类型 `String`，因为我们的小程序中的 `FIFO` 只与字符串配合。\n\n## 收据图像与描述\n\
  \n`ImagePanel` 类实际上调用了 `getImage` 方法和 `HTTPget` 方法来获取相关面板上每个商品的数据。每个部门都有自己的 `ImagePanel`\
  \ 实例。我们对部门进行操作，以便于更改并显示不同的面板。这在 `StoreWindow` 类中所示。我们有一个主循环，它会不断重复，直到包含当前商店部门数据的\
  \ `FIFO` 列表被完全处理：\n\n```java\nimport java.awt.*;\nimport java.net.*;\nimport java.util.*;\n\
  import java.io.*;\nimport ProductImage;\nimport FIFO\nimport httpget;\n\npublic\
  \ class ImagePanel extends Panel {\n    private ProductImage ImageCanvas;\n    private\
  \ URL ImageURL;\n\n    protected Toolkit tools;\n\n    public int width;\n    public\
  \ int height;\n\n    private MediaTracker tracker;\n    private Image i;\n    public\
  \ String label;\n    private httpget DescText;\n```\n\n注意，在此类中我们调用了 `MediaTracker`。它保证图像在执行\
  \ `ProductImage.setImage` 之前已经接收。如果带有尚未接收的图片执行执行会导致 `NullpointerException`。`Toolkit`\
  \ 是必要的，这样就可以调用 `getImage`。\n\n\n\n\n现在我们已经从 Web 服务器获取了所需产品的所有数据，让我们把它们放在合适的位置吧。我们使用\
  \ `ProductImage` 类的实例来包含这些数据；在上面的代码段中，这被反复赋值给 `ImageCanvas` 的值。我们设置图像 ID，使用 `setImage`\
  \ 方法查找上述图像，使用 `setLabel` 方法直接从课堂 `ProductImage` 类中的 `help` 变量 `Description` 安装标签和描述（全部通过\
  \ `ImageCanvas` 实现）。标签或名称是三元组中的最后一个成员，我们从 `FileList` FIFO 队列中针对特定项目推入它。我们使用 `height`\
  \ 和 `product image width` 在将其添加到 `ImagePanel` 之前调整 `ImageCanvas` 的大小。最后，我们设置 `ImagePanel`\
  \ 的完整大小，以便在 `StoreWindow` 类中使用。`ImagePanel` 实例代表不同部门的商店，已作为组组件直接添加到框架 `StoreWindow`\
  \ 中。\n\n---。\n\n## 用户处理操作\n\n`Basket` 类是我们的“购物车”实现。除了用户选择购买的产品列表外，你还可以从购物车中移除物品。`Basket`\
  \ 由四个主要元素组成：一个列表和三个按钮。它扩展了面板，使其可以直接添加到 `StoreWindow` 框架中。我们处理直接与此类内部列表工作的函数（“移除”和“清除所有”按钮项），并将“结账”按钮的点击事件传递到商店父类\
  \ `StoreWindow`：\n\n```java\nimport java.awt.*;\n\npublic class Basket extends panel\
  \ {\n    private List ItemList;\n    private Button Remove;\n    private button\
  \ clear;\n    public button checkout;\n\n    public Basket(String name) {\n    \
  \    label Basket Label = new Label(Name, Label.CENTER);\n        GridBagConstraints\
  \ Con = new GridBagConstraints();\n        GridBagLayout gridBag = new GridBagLayout();\n\
  \        ItemList = new List(5, false);\n\n        Remove = new Button(\"Remove\"\
  );\n        Clear = new Button(\"Clear all items\");\n        checkout = new Button(\"\
  Check out of store\");\n        setLayout(gridBag);\n\n        setFont(new Font(\"\
  Helvetica\", Font.PLAIN, 12));\n        setBackground(color.blue);\n\n        Con\
  \ anchor = GridBagConstraints.CENTER;\n        Con.fill = GridBagConstraints.NONE;\n\
  \        Con weighty  = 1.0;\n\n        con.weightx=0.0;\n\n        con.gridwidth\
  \ = GridBagConstraints.REMAINDER;\n        gridBag.setConstraints(BasketLabel, Con);\n\
  \        add(BasketLabel);\n\n        Con.fill = GridBagConstraints.BOTH;\n    \
  \    con.gridheight=3;\n        Con.gridwidth=GridBagConstraints.RELATIVE;\n   \
  \     Con weighty  = 1.0;\n\n        con.weightx=3.0;\n        gridBag.setConstraints(ItemList,\
  \ Con);\n        add(ItemList);\n\n        Con.weightx=1.0;\n        Con weighty\
  \  = 0.0;\n        con.gridheight=1;\n\n        Con.gridwidth=GridBagConstraints.REMAINDER;\n\
  \        Con.fill = GridBagConstraints.HORIZONTAL;\n        gridBag.setConstraints(Remove,\
  \ Con);\n        add(Remove);\n\n        gridBag.setConstraints(Clear, Con);\n \
  \       add(clear);\n        Con.fill = GridBagConstraints.BOTH;\n        gridBag.setConstraints(Checkout,\
  \ Con);\n        add(checkout);\n    }\n}\n```\n\n在这里我们实现了三个按钮和一个列表，但除了“结账”按钮外，对所有项都进行了私有处理（或使用\
