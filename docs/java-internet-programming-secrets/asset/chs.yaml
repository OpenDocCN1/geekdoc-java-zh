  \ 数据的 `FIFO` 列表，该列表必须根据这些配置数据形成。父菜单和上一个标记对于子菜单是必需的。通常，我们在 `ParseTree` 方法中遵循此路径：处理当前表格并获取下一个表格（它是上一个表格的标签），然后用树的剩余部分调用\
