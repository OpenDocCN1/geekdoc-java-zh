  \n# 第 19 章\n\n![](img/image09336.jpeg)\n\n如何编写你自己的服务器：会议调度器\n\n- 合约内容\n- 属性规划器\n\
  - 用户管理\n- 如何安装你自己的服务器\n- 项目\n- 网络接口模块 服务器\n- 安全速度与内存问题项目服务器\n- 客户\n- 针对特定项目的模块 用户界面模块大纲图\n\
  - 实现\n- 概述程序\n- 模块网络接口\n- 针对特定项目的模块 模块自定义接口\n- 可能的改进\n\n# 你将从本章中学学到什么\n\n在这里，我们使用\
  \ Java 创建了一个会议调度器（Meeting scheduler）。我们将详细考虑以下主题：\n\n* 项目服务器。\n* 特殊情况的处理。\n* 面向对象的项目。\n\
  * 文件的读取操作。\n\n熟悉本手册最简单的方法是使用程序小组件浏览器，并运行附带书籍的光盘中的 `examples/ch19/ui.html`。这需要 `net`\
  \ 输出有输出。如果你无法访问网络，则需要安装本地服务器。具体操作方法在本章的章节中详细描述，如“用户管理”和“如何安装你自己的服务器”。\n\n# 合约内容\n\
  \n想象有一家小公司要求我们创建一个系统，为他们的员工安排会议。这些人大多数在为其他公司工作，但一旦这家公司获得稳定的收入，他们就不介意全职加入这家公司。他们都住在同一个地区，除了一个员工搬到了另一个国家。通过规划器的帮助，将为每位员工创建自己的日程，并缓解与海外员工的连接问题。该程序可以用任何语言编写，但必须运行在各种技术之上，因为小组成员很可能会秘密使用他们目前工作公司的设备。该系统的大多数用户将在不兼容的网络中工作，因此他们无法利用现有的商业规划器。\n\
  \n使用 Internet 和 Java 语言可以简化任务。这样，我们只需要编写一个可以在不同平台上运行的程序。Internet 将让客户端以非常低廉的价格访问国际通信。公司邀请我们立即开始工作——他们希望两周后收到演示版本。\n\
  \n# 属性规划器\n\n会议规划器的主要任务是帮助人们组织时间。此外，它将通过计算小组所有成员工作的时间段，简化普通会议的安排。该程序是流行的调度软件的小实现，类似于\
  \ MeetingMaker 或 LotusNotes 附带的调度器。区别在于，我们的会议规划器将在 Internet 上运行。大多数规划器只运行在局域网（LAN）上，如\
  \ Novell。使用 Internet 将允许位于不同州界两侧的人员以同样简单的方式使用该程序，就像本地组用户操作那样的。\n\n调度器的主要功能是它具有添加和取消预约的能力。因此，必须用\
  \ Java 语言创建一个服务器应用程序和一个客户端应用程序。本指南将主要涵盖在 Java 上创建服务器的问题。\n\n## 用户管理\n\n在深入研究服务器设计之前，你可能想先看看它是如何工作的。要尝试该程序，你首先需要访问服务器调度器。默认情况下，程序通过\
  \ Online Companion 页面访问服务器。通过选择 File 菜单中的 login 段落，你将登录系统。\n\n与该程序工作非常简单。启动程序并在屏幕上登录后，会出现你当天的日程。你可以查看它，跳转到其他日期，或者用其他日日的日程替换此日程。Add\
  \ 按钮将允许你向日程表中添加额外项目。\n\n规划器的主要功能——规划他人的会议。以下给出了我们提议公司的员工列表。第一条目在 Bart 的名下，但你可以使用\
  \ Select User 命令选择不同的用户名：\n\n* Bart\n* Liza\n* Maggie\n* Homer\n* Marge\n* a piece\
  \ of chalk\n* Krrusty\n\n如果你使用添加功能，你将报名参加此会议。如果你想开启其他人的，只需输入他们的名字。列表在括号中，且必须仅包含总列表中的名称。我们希望你在为他们的虚拟员工规划不同的疯狂会议时获得乐趣！\n\
  \n# 如何安装你自己的服务器\n\n设置自己的服务器并不困难，但有几点需要考虑。服务器程序是一个独立的应用程序。你需要将磁盘光盘上的程序重写到硬盘上。要安装服务器，需要：\n\
  \n1. 创建目录（在示例中我们将其称为 \"server\"）。\n2. 从磁盘光盘将 `examples/ch19` 中的文件复制到目录中。\n3. 确保卷中的所有\
  \ `.dat` 和 `.idx` 文件可用。\n4. 运行服务器，输入命令 `java server`。\n\n之后，屏幕上应该出现一条消息，说明服务器正在等待连接（waiting\
  \ for connection）。如果没有，可能是 sockets.server 出了问题。此服务器使用端口 `1666`。你应该配置你的系统以允许程序使用此端口。有关如何做的说明可以在你系统的参考\
  \ TCP/IP 服务章节中找到。\n\n# 项目\n\n大多数网络应用程序可以分为三个主要模块：接口、网络接口和特定特定模块。这种组织方式允许你复用此应用程序。在未来，新项目可能只使用单独的部分——例如网络接口——而不需要使用或理解剩余模块。随着时间的推移，你将开发出一组对象，从这些对象中，所有后续项目将更容易实现。\n\
  \n为了让这些对象作为一个整体工作，它们之间必须有良好的连接。用户界面程序尤其要与 UI 交互，并传递所有其他相关程序组件的操作。假设在点击标记为 login\
  \ 的按钮。\n\nUI 应该检测到按钮被按下，然后将操作传递给网络模块。\n\n## 模块网络接口\n\n与编写自己的协议相比，在 Internet 上通信是小菜一桩。使用\
  \ TCP/IP 时，我们不需要担心数据损坏或数据包超出范围等复杂的通信问题。当然，这不像剥橘子那么简单，但至少你开发了良好的项目，几乎可以忘记这些内部问题。\n\
  \n\n\n\n在最底层，两台计算机之间的通信是 0 和 1 的序列——这种情况对工作调度器几乎没有帮助。通过将此位流结构化为已知的数据类型，我们可以极大地方便你创建调度器和解析数据的工作。Java\
  \ 有一个专门的类用于这项工作。正如你记得的，在第 13 节“使用套接字和流处理网络”中，我们讨论了流 `DataInput` 和 `dataoutput`。现在这些流将变得非常有用。它们允许你在流中传输\
  \ Java 数据类型。服务器可以将 `integer` 放入流中，而客户端可以轻松地读取这个数字——无需任何转换或其他麻烦。唯一需要对某些数据结构达成共识。\n\
  \n我们为消息选择了一个非常简单的模型。每条消息将包含一个描述消息类型的字节，随后是一个变变长度的消息体。每种类型的消息将匹配相应的例程，能够进行数据分析。这种方案将简化创建多个消息的任务，而且会极大地简化这种解析工作。如果你曾经必须将位流转换为真实数据，你就能体会到它的便利了。\n\
  \n这种方法最大限度地减少了网络流量。我们发送的字节越少，就越好。\n\n如果你最关心数据传输速度，那么这种协议可能不适合你。但如果你最关心编码速度和易于维护，那么你就赢了。我们的方法在发送大型数据文件时可能不会有效，但对于我们的目标来说非常合适。\n\
  \n网络模型就绪后，我们可以开始设计客户端和服务器。通常情况下，它们将包含额外的方法。当一侧发生消息时，另一方必须能够进行分析。我们可以让一切变得完美，并为每条消息创建一个限定文件来识别每个数据元素，并调用解析每条消息的子程序。这是一个好方法，但也有更简单的方法：为每条消息只写一个创建方法和一个解析方法。然而，如果同步性破坏，将会出现问题。生产者上传到线上的所有东西都必须被消费者接收。\n\
  \n关于在网络上进行数据传输的问题，我们有一些关于服务器的特殊注释。在下一节中，我们将详细讨论 Internet  way 的创建。\n\n## 服务器\n如果我现在要求你写一个简单的服务器，你可能会采用\
  \ Perl 语言方案，使用 `CGI`（通用网关接口），这是很长一段时间内此类请求的标准响应。如果我接着要求你让服务器足够快，你可能会用 C 语言写程序，同样使用\
  \ `CGI` 接口。\n\n`CGI` 是一种用于执行 Web 动态功能的协议。`CGI` 接收一些输入，处理它们并创建 `MIME`（多媒体互联网邮件）扩展）。这是一个强大的工具，但它也有自己的局限性。`CGI`\
  \ 基于与网络浏览器的对话。网络浏览器理解 MIME 文档并显示它们，但到此结束。但如果你想获取数据，以某种方式处理它们然后显示出来呢？\n\n如果你用 Java\
  \ 语言编写服务器，你将获得额外的机会，而在 Java 上启动客户端将把这些机会扩展到几乎无限。客户端可以处理入入数据并以方便的方式呈现。在这种情况下，不仅从服务器减轻了部分负载，而且为客户端提供了更多机会，结果数据表示的形式得到了改进。例如，用户将能够更改字体，系统能够根据显示器尺寸自定义显示数据。\n\
  \n使用 Java 编写服务器取决于个人喜好，有优点也有缺点。一如既常，为了选择最合适的语言，你应该评估你想要得到什么。让我们看看在使用 Java 编写服务器时必须考虑的问题。\n\
  \n## 安全\n编写服务器程序涉及一些责任，因为服务器可能是你互联网装甲中最薄弱的一环。编写得糟糕的服务器程序可能会导致机器崩溃，或者更糟，数据丢失。关于互联网黑客的信息，特别是关于如何找到漏洞渗透服务器程序的信息，是公开的。编写服务器是为了传播信息或解决问题；要确保这些信息不是私私的，并且该任务不是破坏性的。\n\
  \n将 Java 作为编写服务器的语言在信息安全方面几乎是理想的，因为在创建 Java 时，考虑了信息的机密性。放置错误的指针不会导致你的系统开放并易受未经授权的人的攻击。重要的是，Java\
  \ 应用程序的限制比 applet 少。特别是，它可以访问磁盘，所以你应该正确地询问，服务器被允许访问哪些内容。存在一条经验法则：\n\n- 仅允许服务器访问它需要的文件。\n\
  \n确保互联网信息的安全是一个如此重要的课题，以至于可以就此写一整本书。事实上，已经出版了几本这样的书。对于对互联网安全问题感兴趣的人，推荐阅读 O'Reilly\
  \ & Associates 出版的《Internet Firewall》。书《Web-server》（Ventana）在这一主题上也有很好的章节；此外，此类问题也涵盖在处理一般问题的出版物中。在用\
  \ Java 编写的程序中，漏洞出现的概率比 C 程序少，可能也比使用 Perl 脚本更少，但没有一种语言可以给出完全的保证。\n\n## 问：速度与内存\n\
  在 Java 上运行程序的执行速度通常与 Perl 语言方案相当。Perl 处理文本的能力更好，但在大多数操作上并不逊于 Java。即时编译 (JIT) 模块即将推出，用于将\
  \ Java 字节码程序转换为机器码；这些模块将使你的 Java 程序运行得更快。然而，速度不应是选择项目编程语言的决定性因素；只有在程序执行时间具有根本重要意义的情况下，它才成为决定因素。\n\
  ```\n\n\n服务器本身的设计非常简单。当套接连接建立时，会创建一个新的流来处理请求。该流使用一个名为 `schedule` 对象来响应客户端的请求。到此为止，我们已经拥有这一切。这一切都足够清晰且易于编程。关于该算法实现的具体问题，我们将在“实现：网络接口模块”章节中进行讨论。\n\
  \n## 客户端\n\n能够使用 `Java` 语言来编写客户端，这无疑是极大的幸运。编写大量 CGI 程序以及必须在不同程序之间传输数据的痛苦已成为过去。在过去，Web\
  \ 开发者在使用 CGI 时，经常会遇到各种困难。即使服务器端本身是一个 CGI 程序，使用 `Java` 作为客户端也是很有用的。在第 17 节“与 CGI\
  \ 交互：`Java` 商店”中，展示了如何使用 `Java` 与 CGI 程序进行通信。\n\n客户端本身是一个简单的流，用于处理来自网络的数据。它充当传入数据包的分发器。客户端解码数据包并调用相应的程序来处理该数据包。此外，它表现得像一个流，因此就不需要编写另一个程序来在网络上传输数据。\n\
  \n来自服务器的消息像任何其他事件一样被处理。当我们向服务器请求任何内容时，它会将数据发送到网络模块。当数据包被解码后，你可以像处理用户事件一样对其进行操作。因此，网络变成了一个传递消息的简单手段。这种解决方案对于基于概念开发的图形用户界面非常有用。\n\
  \n在理清与网络相关的问题后，我们现在可以转向低层子程序。这些层次构成了我们程序的核心。之后，我们将创建一个自定义接口，在此基础上我们的项目将大告完成。\n\n\
  ## 针对特定项目的模块\n\n调度器的骨干是一个包含所有已安排约会的数据结构。客户端和服务器都必须访问这些信息。该结构的实现在不同端可以有所不同，但接口必须是统一的。在这里，最好充分利用\
  \ `Java` 接口机制。\n\n我们创建了一个名为 `schedule` 的接口。`schedule` 的概念意味着一个包含该人员计划会议数据的对象，以及修改这些数据的子程序。接口允许我们定义将包含在所有实现\
  \ `schedule` 的对象中的方法。我们将决定如何向每个子程序传递什么内容。我们稍后会直接处理多个程序的编程工作，但在当前阶段，项目计划器已经准备就绪。\n\
  \n使用接口允许我们更改 `schedule` 的实现方式，这对于我们的应用程序非常重要。在服务器端，我们将调度存储在磁盘上，并保持其持久化。在客户端端，我们将调度存储在运行内存中，原因有两个：首先，`Java`\
  \ 不允许用户访问本地文件；其次，我们希望访问调度的速度快。将调度保持在内存中对客户端来说很方便，但想象一下如果服务器机器在内存中存储每个员工的调度将会发生什么！活动服务器可以同时为数千人服务，如此数量的调度将迅速溢出内存。图\
  \ 19-2 显示了 `schedule` 类的层次结构。\n\n![](img/image09337.gif)\n\n### 图 19.2\n\n这个层次结构非常简单，但它有一些特性。请注意，客户端和服务器都实现了\
  \ `schedule` 接口（实现由虚线表示）。而我，它们使用了不同的内部数据结构来保存数据。\n\n随后，我们可以创建另一种类型的调度——例如分布式调度，其中团队的每个成员的\
  \ `schedule` 都定位于他们自己的机器上。另一方面，通过我们的磁盘存储系统，我们将在服务器上存储每个调度。每种方法都有其利弊。\n\n无论 `schedule`\
  \ 如何实现，我们都可以直接将其插入到程序中——一切都能正常工作！接口是一种强大且优雅的开放系统开发方式。当标准设计好后，任何人都可以创建自己的实现。表 19-1\
