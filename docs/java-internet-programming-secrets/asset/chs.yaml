  \ `ImageObserver` 的工作方式与之前的方法相同。 |\n\n为你自己的项目创建图像最简单的方法包括：创建一个新的空 `Image` 对象，并使用\
  \ `Image` 类的 `getGraphics` 方法直接使用 `Graphics` 类的 `paint` 方法绘制图像（列在表 9-1 和 9-2 中）。如我们上面所述，这仍然没有赋予我们在像素级上处理图像的能力。要在像素级上工作，我们至少对几个为处理异步图像而开发的接口有基本的了解。\n\
  \n## 异步图像接口\n\n`java.awt.Image` 类提供了三个接口 —— `ImageProducer`、`ImageConsumer` 和 `ImageObserver`\
  \ —— 它们为程序员在实时动画期间创建和处理图像数据提供了一个一致的环境。`Component` 类提供的 `createImage` 方法之一基于 `ImageProducer`\
  \ 并向其传递图像的初始图形数据。`ImageObserver` 监控该过程，并在新数据可用时从 `ImageProducer` 接收更新。\n\nJava API\
  \ 提供了这些接口的一些实现。我们将简要描述这些接口，然后讨论它们的具体实现。程序员永远不需要实现这些接口，但理解它们如何有效运行是非常重要的。\n\n###\
  \ 接口 ImageProducer\n\n`ImageProducer` 接口必须由能够产生图像数据的类实现。`ImageProducer` 可以作为 `Component`\
  \ 类 `createImage` 方法的参数。该接口负责为图像对象提供数据。`ImageProducer` 接口包含了五个方法，列在表 9-7。\n\n###\
  \ 表 9-7. `ImageProducer` 接口方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `addConsumer(ImageConsumer)`\
  \ | 将给定的 `ImageConsumer` 添加到接收数据的消费者列表中。 |\n| `boolean isConsumer(ImageConsumer)`\
  \ | 返回布尔值，显示给定的 `ImageConsumer` 是否注册从此 `ImageObserver` 接收数据。 |\n| `removeConsumer(ImageConsumer)`\
  \ | 从接收数据的消费者列表中移除给定的 `ImageConsumer`。 |\n| `requestTopDownLeftRightResend(ImageConsumer)`\
  \ | 请求按照上下左右重新发送图像。 |\n| `start production(lmageConsumer)` | 注册感兴趣接收数据的 `ImageConsumer`\
  \ 并开始输出图像。 |\n\n### 接口 ImageConsumer\n\n`ImageConsumer` 接口设计用于配合 `ImageProducer`\
  \ 接口使用。该接口必须由感兴趣从 `ImageProducer` 接收像素的类实现。\n\n我们不需要考虑创建 `ImageConsumer` —— 其功能已经内置在\
  \ Java API 中。使用 `ImageConsumer` 接口所需的方法列在表 9-8 中。这些方法大部分用于在图像数据可用时调用 `ImageProducer`。\n\
  \n### 表 9-8. `ImageConsumer` 接口方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `imageComplete(int)`\
  \ | `ImageProducer` 在图像就绪或加载过程中发生错误时调用此方法。整数参数表示图像的状态。可能的图像状态列在表 9-10 中。 |\n| `SetColorModel(colormodel)`\
  \ | 设置图像的 `ColorModel` 类。 |\n| `SetDimensions(int, int)` | 设置宽度和图像高度。 |\n\n\n\n\n\
  \n`setHints(int)` 设置来自 `lmageObserver` 的任何可用消息。这些消息可以开启，例如像素接收的顺序。\n\n整数参数包含所有所需消息的按位或运算结果。可能的消息列在表\
  \ 9-9 中。\n\n`SetProperties(hashtable)`\n\n`SetPixels(int, int, int, int, ColorModel,\
  \ byte[], int, int)`\n\n`SetPixels(int, int, int, int, ColorMode, int[], int, int)`\n\
  \n设置与图像相关的属性。有时图像数据中会包含注释或描述。使用方法键进行定义，位于哈希表中是否存在任何内容。\n\n设置前四个整数指定的矩形内的像素。`ColorModel`\
  \ 指定图像使用的 `ColorModel`。`byte` 数组包含实际的像素数据，最后两个整数包含索引的初始值和每行的像素数（视图大小）。矩形内位置为 `(X,\
  \ Y)` 的像素在数组中的地址由以下公式给出：`Y * string_length + X (+ 如果不是零，则加上起始索引)`。\n\n与上一个方法相同，但使用整数数组而不是\
  \ `byte` 数组。\n\n图像在创建过程中可以处于定义的状态之一。此外，`ImageProducer` 可以向注册的 `ImageConsumer`（提示）发送关于其生成的像素的消息。`setHints`\
  \ 和 `imageComplete` 方法将这些状态和消息作为整数传递给 `ImageConsumer` 接口。在 `ImageConsumer` 中，可能的的消息和状态值定义为静态整数。它们列在表\
  \ 9-9 和 9-10 中。如果 `ImageProducer` 需要发送多个此类消息和图像状态，它将返回相应状态的按位或结果（更多细节请参见侧栏“位操作”）。\n\
  \n表 9-9. 来自 `ImageProducer` 的消息\n\n#### 消息含义\n\n`RANDOMPIXELORDER`: 像素将无特定顺序传输。\n\
  \n`TOPDOWNLEFIRIGHT`: 像素将按从上到下从左到右顺序传输。\n\n`COMPLETESCANLINES`: 像素将按完整的光栅行（水平线）传输。\n\
  \n`SINGLEPASS`: 像素将一次性传输，每个像素仅安装一次。对于某些图像，尤其是 `JPEG` 格式，像素在多个通道后面传输，其中每个后续的像素都会澄清上一个。\n\
  \n`SINGLEFRAME`: 图像仅包含一帧图形数据，且它已经是完整的，`ImageProducer` 将不会再更改图像。\n\n表 9-10. 关于 `lmageProducer`\
  \ 能力的消息\n\n#### 状态含义\n\n`IMAGEERROR`: 在记录 `Images` 数据时发生错误。\n\n`SINGLEFRAMEDONE`:\
  \ 一帧图形数据已完成，但后续帧尚未就绪。\n\n`STATICIMAGEDONE`: 图像已就绪，`ImageProducer` 不再为此图像发送更多数据。\n\
  \n`IMAGEABORTED`: 图像被人为中断。\n\n### 接口 `ImageObserver`\n\n对于那些不感兴趣获取与图像相关的所有像素，但需要创建过程本身进度信息的类，Sun\
  \ 提供了 `ImageObserver` 接口。该接口由一个 `imageUpdate` 方法和在接口中定义为静态整数的大量变量组成。这些状态变量在用途和实现上与\
  \ `ImageConsumer` 类的状态变量和消息非常相似。接口 `ImageObserver` 方法及其变量列在表 9-11 中。\n\n#### 方法与\n\
  \n表 9-11. 接口 `ImageObserver` 方法和变量\n\n#### 描述\n\n变量\n\n`boolean imageUpdate(image,\
  \ int, int, int, int, int)`\n\n当之前请求的 `ImageObserver` 信息可用时，`ImageProducer` 会触发此方法。`Image`\
  \ 参数返回请求中图像的链接，第一个整数参数包含所有使用状态的按位或。\n\n最后四个整数通常解释为矩形限制，但可能是为了取消附近的状态。\n\n`WIDTH`:\
  \ 表示 `Images` 已知的宽度，并且可以从限制矩形中推断。\n\n`HEIGHT`: 表示图像的高度已知，并且从限制矩形中推断。\n\n`PROPERTIES`:\
  \ `Images` 已知的属性，并且可以通过 `Image` 类的 `getProperty` 方法接收。\n\n`SOMEBITS`: 大部分 `pixels`（但不是全部）现在可用。\n\
  \n保证矩形限制已填充。\n\n`FRAMEBITS`: 多帧 `Images` 的完整帧现在可用。\n\n忽略矩形限制。\n\n`ALLBITS`: 图像是完整的，且忽略矩形限制。\n\
  \n`ERROR`: 创建 `Images` 期间发生错误。\n\n`ABORT`: 图像创建在完成前被中止。如果此时没有出现错误消息，对任何 `Images`\
  \ 数据的后续调用将完成其创建。\n\n与此处描述的其他接口一样，大多数程序员永远不需要实现 `ImageObserver`。`java.awt.Component`\
  \ 类实现了 `ImageObserver` 接口，允许它及其所有子类使用并显示异步 `Images`。当有新像素可输出所需分辨率的图像副本时，`Component`\
  \ 会请求重绘。\n\n## 图像操作\n\n除了处理异步图像的接口外，`java.awt.image` 包提供了它们的几种方便的实现。这些实现允许对图像进行低级操作：使用\
  \ `PixelGrabber` 类从图像获取像素，使用 `MemoryImageSource` 从像素数组创建图像，使用 `ImageFilter` 过滤现有图像。本节描述的所有类都是\
  \ `java.awt.image` 包的一部分。\n\n### 捕获像素\n\n`PixelGrabber` 类是 `ImageConsumer` 接口的实现，用于从图像或\
  \ `ImageProducer` 获取像素和颜色数据。你可以获取给定图像的所有像素，或仅获取图像的矩形部分。`PixelGrabber` 构造函数和其他独特方法见表\
  \ 9-12。\n\n表 9-12. `Pixel Grabber` 构造函数和方法\n\n#### 构造函数 / 方法\n\n`PixelGrabber(Image,\
  \ int, int, int, int, int[], int, int)`\n\n`Pixel Grabber(lmageProducer, int, int,\
  \ int, int, int[], int, int)`\n\n#### 描述\n\n创建一个新的 `PixelGrabber`，从指定的 `Images`\
  \ 返回像素。前四个整数参数表示想要接收像素的限制区域形。像素值将复制到整数数组参数中；此数组的大小必须等于测量值，即宽度元素数乘以高度数。最后两个整数指示像素在数组中的初始索引以及每行的像素数（即为所选区域的宽度）。\n\
  \n```\ngrabPixels() 请求 Image 或 ImageProducer 传输像素。此方法会阻塞直到接收数据。如果在数据到达之前被调用，将抛出\
  \ InterruptedException 异常。\n```\n\n\n\n\n\n`grabPixels(long)` 请求 `Image` 或 `ImageProducer`\
  \ 传递像素。此方法会阻塞，直到接收到数据或超过了参数指定的毫秒数。如果此方法在数据到达或指定时间通过之前被调用，它将抛出异常 `InterruptedException`。\n\
  \n`int status()` 返回图像的状态，该状态是 `ImageObserver` 所有变量状态的位或结果。\n\n接下来的代码片段说明了类 `Pixel\
  \ Grabber` 的用法：\n\n```java\nPixel Grabber grabber;\nint width = myImage.getWidth(this);\n\
  int height = myImage.getHeight(this);\nint ary[] = new ary[width*height];\n\ngrabber\
  \ = new PixelGrabber(mylmage, 0, 0, width, height, ary, 0, width);\ntry {\n    grabber.grabPixels();\n\
  } catch (InterruptedException e) {}\nint status = grabber.status();\n\nif ((status\
  \ & ImageObserver.ABORT) || (status & ImageObserver.ERROR)) {\n    // 选择像素图像时发生了错误\n\
  } else {\n    for (int i=0; i<ary.length; i++) {\n        // 对数组中的像素进行任何操作\n   \
  \ }\n}\n```\n\n在此代码中，我们使用 `PixelGrabber` 查询图像中的所有像素。请求完成后，我们检查像素状态；如果传输被中断或发生了某些错误，我们将处理相应的情况。否则，我们可以从传递给\
  \ `PixelGrabber` 的 `array` 中读取像素。\n\n### 颜色模型\n\n接收到像素数组后，我们必须对其进行处理。每个像素在数组中都表示为单个整数。有必要从这个整数中提取绘制绘制或其他方式解释像素所需的所有数据。图像中每个像素的位置可以从数组中的位置推断出来，我们使用\
  \ `ColorModel` 类直接解释整个整数的颜色。\n\n几乎任何颜色都可以表示为红、蓝、绿色调的唯一组合。还有基于其他颜色集合的组合，但它们专门用于计算机图形。几乎所有颜色显示器都通过红、蓝、绿三点的组合获取每个像素。`ColorModel`\
  \ 类不仅允许我们解析像素数组中的整数并将每个整数拆分为红、蓝、绿分量，还能确定透明度。组件透明度控制像素的输出：如果像素是透明的，则背景颜色将转换为像素的显示颜色。图\
  \ 9-2 显示了部分透明图像到不透明图像的叠加。\n\n![](img/image09271.gif)\n\n#### Rice. 9.2.\n\n`ColorModel`\
  \ 类用 `abstract` 修饰符定义，尽管 Java API 中提供了它的两个扩展类，并在本节稍后部分进行了描述。表 9-13 列出了 `ColorModel`\
  \ 类的方法。注意，`getRGBdefault()` 方法使用 `static` 修饰符声明，因此其使用方式可能是根据非抽象的默认 `RGB` 颜色模型返回链接的时间实现。\n\
  \n表 9-13. colormodel 类方法\n\n## 方法描述\n\n`colormodel(int)` 创建一个支持指定位数颜色的颜色模型。位数直接控制该模型中可用唯一颜色的数量。每个像素\
  \ 8 位提供 256 种不同的颜色。\n\n`int getAlpha(int)` 返回特定整数参数像素的组件透明度。\n\n`int getBlue(int)`\
  \ 返回特定整数参数像素的蓝色分量。\n\n`int getGreen(int)` 返回整数参数指定的像素的绿色分量。\n\n`int getRed(int)`\
  \ 返回整数参数指定的像素的红色分量。\n\n`int getPixelSize()` 返回像素的位数。\n\n`int getRGB(int)` 返回指定的默认颜色模型\
  \ `RGB` 中由参数指定的像素值。\n\n`static colormodel getRGBdefault()` 返回由 `java.awt.image`\
  \ 包使用的默认 RGB `ColorModel`。该方案为每个主色度和透明度分量分配了 8 位，这提供了 256 级红、蓝、绿颜色和透明度的渐变，总计共有 16777216\
  \ 种颜色（不计算透明度色调）。\n\n编码红、蓝、绿和透明度有两种基本方法，每种方法都是 32 位整数中的若干位整数。在第一种方法，像素的整数值被视为 `array`\
  \ 索引，红、蓝、绿颜色和透明度从内部调色板表中获取。你不需要在表中排序颜色；符合性由模型创建者设置。`IndexColorModel` 继承自主 `ColorModel`\
  \ 类，这样你就可以使用自己的调色板创建一个新的 `ColorModel` 类。当你构建模型时，你会创建颜色组件的数组。当程序员向模型请求颜色时，它会使用 `array`\
  \ 索引。\n\n第二种方法：`DirectColorModel` 是 `ColorModel` 类的扩展。例如，我们可以使用 6 位红色、6 位蓝色、8 位绿色。根据该方案，我们将有\
  \ 67108864 种可能的颜色。\n\n![](img/image9272.gif)\n\n#### Rice. 9.3.\n\n现在 `PixelGrabber`\
  \ 返回的整数像素值数组有了意义。`PixelGrabber` 使用的 `ColorModel` 是默认模型 `RGB`，可以使用表 9-13 列出的方法从像素中提取颜色信息。我们可以向早期示例中的循环中添加以下代码，分析数组中的特定颜色：\n\
  \n```java\ncolormodel cm = ColorModel.getRGBdefault();\nint pixel;\nfor (int i=0;\
  \ i<ary.length; i++) {\n    pixel = ary[i];\n    cm.getRed(pixel);\n    cm.getBlue(pixel);\n\
  \    cm.getGreen(pixel);\n    cm.getAlpha(pixel);\n}\n```\n\n我们展示了如何将图像转换为数组，以及如何使用\
  \ `ColorModel` 类将这些数组中的值转换为颜色分量。反向转换（将数组转换为图像）使用 `MemoryImageSource` 类也同样简单。\n\n\
  ### 将数组转换为图像\n\n`MemoryImageSource` 类提供了一种将整数数组转换为 `Image` 类像素的方法。`MemoryImageSource`\
  \ 类实现了 `ImageProducer` 接口，可以作为 `Component` 类 `createImage` 方法的参数使用。表 9-14 给出了 `MemoryImageSource`\
  \ 类的构造函数。\n\n表 9-14. MemorylmageSource 类构造函数\n\n`MemoryImageSource(int, ColorModel,\
  \ byte[], int, int)`\n\n`MemoryImageSource(int, int, ColorModel, byte[], int, int,\
  \ hash table)`\n\n`MemoryImageSource(int, int, ColorModel, int[], int, int)`\n\n\
  \n\n\n创建一个新的 `ImageProducer`，它通过参数传递的字节数组中的像素值构建图像。前两个整数表示所需的图像宽度和高度，但 `parameter`\
  \ `colormodel` 设置了在解释数组时必须使用的像素值与颜色分量之间的 `ratio`（比例）。最后两个整数表示数组中的起始位置以及数组中每行像素占据的字节数（实际上是图像的\
  \ `width` 宽度）。\n\n工作方式与之前的构造函数相同。参数 `Hashtable` 建立了图像属性。\n\n从给定的整数数组创建新的 `ImageProducer`。\n\
  \n`MemorylmageSource(int, int, ColorModel, int[], int, int, hash table)`\n\n`memorylmageSource(int,\
  \ int, int[], int, int)`\n\n`memorylmageSource(int, int, ColorModel, int[], int,\
  \ int, hash table)`\n\n从给定的整数数组创建新的 `ImageProducer`。\n\n使用默认颜色模型 `RGB` 从给定的整数数组创建新的\
  \ `ImageProducer`。\n\n使用默认颜色模型 `RGB` 从给定的整数数组创建新的 `ImageProducer`。\n\n这个类能更好地说明示例。下面我们给出一个完整的\
  \ applet，它从整数数组生成并输出图像。我们将为每个像素创建红色分量，根据每个像素的 `x` 和 `y` 坐标相应地添加缩放的正弦；同样，我们将为每个像素创建蓝色分量，但已经加上了\
  \ `X` 和 `Y` 坐标的余弦。每个像素的最终值通过位或 操作将具有 100% 值透明度的颜色的红色和蓝色分量组合，并移动分量直到它们与默认 RGB 颜色方案中的相应位置对齐。米饭上显示的准备图片的截图。9-4。\n\
  \n![](img/image09273.gif)\n\n#### 米饭。9.4。\n\n示例 9-2. 类 MemoryImageSource 的用法。\n\n\
  ```java\nimport java.awt.*; import java.awt.image.*; import java.applet.*;\n\npublic\
  \ class ShadeApplet extends applet { Image myImage;\n\n    public void init() {\n\
  \        resize(250,250);\n        int ary[] = new int[250*250];  for (int i=0;\
  \ i<250; i++) {\n            for (int j=0; j<250; j++) {\n                double\
  \ x = (16*Math.PI*j/250); double y = (16*Math.PI*i/250);\n                double\
  \ p = (Math.sin(x)+Math.sin(y)+2)/4;  int redvalue = (int)Math.round(p*255);  double\
  \ q = (Math.cos(x)+Math.cos(y)+2)/4;  int bluevalue = (int)Math.round(q*255);  ary[i*250+j]\
  \ = (255<<24)|((redvalue)<<16)|(bluevalue);\n            }\n        }\n\n      \
  \  MemoryImageSource mis;\n        mis = new MemoryImageSource(250,250,ary,0,250);\
  \  myImage = createImage(mis);\n    }\n\n    public void paint(Graphics g) { g.drawImage(myImage,0,0,this);\
  \ }\n}\n```\n\n### 图像过滤\n\n现在我们可以直接在位位上创建图像，而无需使用 `Graphics` 类提供的图形原语。我们甚至可以管理从网络加载的图像；通过\
  \ Pixel Grabber，我们可以从数组中接收像素值。我们可以使用 `MemoryImageSource` 类反转该过程。Java API 提供了两个专门为这些任务设计的类\
  \ `-FilteredImageSource` 和 `ImageFilter`。\n\n`FilteredImageSource` 类实现了 `ImageProducer`\
  \ 接口。它接受 `ImageProducer` 和 `ImageFilter` 作为构造参数。通过创建图像，它从构造函数中定义的 `ImageProducer`\
  \ 接收像素数据，然后按照 `ImageFilter` 规定的一致方式更改这些数据，并通过 `ImageConsumer` 发回修改后的数据。`ImageFilter`\
  \ 类实现了 `ImageConsumer` 接口。它不改变像素数据。Java API 提供了两个简单的扩展，允许插入颜色滤镜或为新图像裁剪某些区域。\n\n\
  `RGBImageFilter` 类默认不执行任何颜色过滤，但会根据指定的默认 RGB 颜色模型转换像素值和图像所使用的 `ColorModel`。为了对其进行颜色过滤，我们需要扩展该类的\
  \ `filterRGB` 方法以完成必要的过滤。考虑一个示例，即移除图像中所有的红色。\n\n示例 9-3. 过滤移除红色。\n\n```java\nimport\
  \ java.awt.image.*;\n\npublic class NoRedFilter extends RGBImageFilter {\n    public\
  \ int filterRGB(int x, int y, int rgb) {\n        int alpha = (rgb & 0xff000000)>>24;\
  \  int red = (rgb & 0x00ff0000)>>16;  int green = (rgb & 0x0000ff00)>>8;  int blue\
  \ = (rgb & 0x000000ff);\n        return ((alpha<<24)|(green<<8)|(blue));\n    }\n\
  }\n```\n\n首先，我们通过指定给定数组默认 RGB 颜色方案中的像素颜色来拆解整数 `rgb` 变量，然后将透明度、绿色和蓝色分量加回 RGB 值，完全忽略红色值。请注意，由于我们传递了\
  \ `x` 和 `y` 坐标，我们可以根据位置更改滤镜颜色，但对于我们的简单滤镜来说，这是没用的。`RGBColorFilter` 类——一种实手的滤镜，你可以根据自己的需要进行开发，因为在需要时它会执行到给定的默认模型颜色\
  \ `RGB` 的转换。\n\n`CropImageFilter` 类用法非常简单；你不需要扩展它来裁剪图像。相反，你只需要在构建滤镜时定义想要裁剪的区域。构造函数需要四个整数作为参数，以定义矩形。这里有一个短示例，裁剪左上角的注入：\n\
  \n```java\nFilteredlmageSource fis;\nCroplmageFilter filter;\nfilter =new CropmageFilter(0,0,10,10);\n\
  fis = new FilterlmageSource(mylmage.getSource(),filter);  Image myNewage = createImage(fis);\n\
  ```\n\n\n\n现有的 Java 应用程序接口（API）工具提供了编写几乎任意复杂性应用程序的能力。当然，为了在需要时使用 API，必须编写相应的程序。在这里衡量的是，随着此类程序的增加，程序员越来越希望使用他们早些为其他目的编写过的新开发片段。既然如此，为什么不使用包（packages）呢？\n\
  \n面向对象的语言（包括 Java）的主要优势之一在于能够描述某个特定的过程、一个对象或模型之间的关系——换句话说，就是一组函数——而且在以类的形式发布后，只需编写一次。\n\
  \n此外，该类可以在不作任何更改的情况下在其他程序中使用。这样就让自己从不断返回旧代码的问题中解脱出来。在任何新项目中，你都可以轻松地插入之前编写好的对象或接口。\n\
  \n如果在设计类时考虑了可能的重复使用，随着时间的推移，程序员会积累整个类库。毕竟，这样一个库对项目产生的作用与标准接口式编程相同，甚至更多。\n\n# 创建兼容的类\n\
  \n在第 6 章中，我们展示了 `Object` 类有几个在其他类中经常重写的方法。`Object` 类的一些方法在每个派生类中都必须重写，并且在你自己的类中也必须重写。对于其他方法，决定是否重写它们对于项目来说是一个具有策略意义的问题。让我们来看几个方法，并决定在特定情况下是否有必要重写它们。此外，我们还将考虑在方法未重写时执行的操作序列。让我们从始终需要重写的方法开始。\n\
  \n## 方法 `boolean equals(Object o)`\n\n如果你要比较同一类的两个对象，则必须重新定义此方法。如果没有重写，该类的对象只有在一种情况下是相等的（方法返回\
  \ `true`）——即所比较的对象实际上是同一个对象。至于如何重新定义这个方法，主要取决于类中的变量。考虑 `exampleClass` 类。假设它的构造函数和其他方法以某种方式改变了变量的值：\n\
  \n```java\nclass exampleClass(\n    private String s;\n    private int i;\n    private\
  \ int j;\n\n    // 构造函数\n    // 方法\n}\n```\n\n对于这样的类，比较两个变量值的方法非常合适。它可以转换为复合布尔表达式，但我们倾向于分别比较两个变量：\n\
  \n```java\nequals(Object obj) {\n    if (obj == null) return false;\n    if (!obj\
  \ instanceof exampleClass) return false;\n\n    exampleClass ex = (exampleClass)obj;\n\
  \    if (!ex.i != i) return false;\n    if (!ex.j != j) return false;\n    return\
  \ true;\n}\n```\n\n我们做的第一件事是检查传递给方法的是空指针而不是对象本身。第二个操作符检查用于比较的对象的类型（`exampleClass`）。如果传递的对象的类型与描述方法的对象的类型不匹配，该操作符将返回\
  \ `false`。现在我们知道了如何比较类型相同的对象，我们将对象 `obj` 强制转换为类型 `exampleClass`。接下来的三行代码通过操作符比较两个对象的变量之值。如果至少有一个变量与另一个不相等，方法将返回\
  \ `false`。看看由于我们是在其所属的类定义框架内操作，我们可以访问到哪些内部变量。\n\n在这个示例中，为了使对象相等，必须所有变量都相等。否则，则不需要满足这些条件。在编写比较两个对象的方法时，要问自己的第一个问题是：“该类的两个对象必须具备什么属性才能被认为是相等？”\n\
  \n## 方法 `String toString()`\n\n设计 `toString` 方法很容易——它应该返回一个表示对象当前状态的字符串（`String`\
  \ 类型）。它的主要目的是使用 `System.out.println` 方法进行程序调试。下面的示例描述了 `myBox` 类（矩形），其 `toString`\
  \ 方法返回它的高度和宽度。\n\n```java\nclass myBox {\n    int width = 0;\n    int height = 0;\n\
  \n    // 构造函数，方法\n    String toString() {\n        return \"width = -\" + width\
  \ + \", height = -\" + height;\n    }\n}\n```\n\n## 方法 `int hashCode()`\n\n这个方法与上述两个方法一样，必须始终被重写。如果不这样做，该类将无法与第\
  \ 6 章讨论的 `java.util.hashtable` 类配合使用。为了学习如何构建方法以及理解为什么要重新定义它，让我们考虑更复杂的哈希表。\n\n搜索速度是哈希表的主要优势之一。哈希表从不遍历所有内容。要在由\
  \ `N` 个键值对组成的表中查找一个元素，总共需要执行 `N` 次比较操作。如果 `N` 足够大，哈希表只需执行一次比较。\n\n哈希表如何决定将键/值对放入哪个桶（bucket）中？这使用了特殊的算法——哈希函数（hash\
  \ function）。它的任务是让“键-值”分布在尽可能多的桶中，从而进一步简化，减少单个桶中键的数量。\n\n这就是 `hashCode` 方法发挥作用的地方。作为\
  \ `java.util.hashtable` 中哈希函数的参数，它传递的是整数。\n\n```java\nint hashCode() {\n    return\
  \ one;\n}\n```\n\n\n\n然而，理想情况在实践中很难实现。我们只能建议不要耗费许多个不眠之夜去开发一个完全满足所有标准的完美 `hashCode`\
  \ 方法——通常通常来说，这是不可能的。因为 `hashCode` 返回的是一个 `integer`，它的可能值只有 `4294967296` 种。而在所有 `String`\
  \ 类型的变量中存在 `9223372936854775897` 种可能值，而总长度仅为两个字符的 `long` 行寥寥这么多。现在，既然我们知道要为 `String`\
  \ 类型获得最佳哈希值是不可能的，让我们看看 `String` 类型的开发者实现了什么。他们的主要目的是提供一种如何获取更唯一值的方法：\n\n```java\n\
  // method hashCode class java.lang.hashCode public int hashCode() {\n    int h =\
  \ 0;\n    int off = offset; char val[] = value; int len = count;\n    if (len <\
  \ 16) {\n        for (int i = len; i > 0; i--) {\n            h = (h * 37) + val[off++];\n\
  \        }\n    } else {\n        // take only some symbols\n        int skip =\
  \ len / 8;\n        for (int i = len; i > 0; i -= skip, off += skip) {\n       \
  \     h = (h * 39) + val[off];\n        }\n    }\n    return h;\n}\n```\n\n![](img/image09275.jpeg)\n\
  \n**建议**：`String` 类的源代码与其他 API 类一样，都在 JDK 中。有时，通过查看那里来熟悉 Java 开发者的观点或其他出于其他原因是很有趣且实用的。\n\
  \n![](img/image09276.jpeg)\n\n### 方法对象 `clone()`\n\n你可能在第 2 章中记得，赋值运算符 `=` 并不会创建对象的副本。相反，如果它的操作数之一是实例变量，那么一个或两个变量将指向同一个对象。假设我们有一个由类表示的链表，该类包含一个整数和一个数据对象\
  \ `list`。`setNext` 方法允许根据给定的米饭创建数据结构，见 10-1。\n\n![](img/image09277.gif)\n\n####\
  \ Rice. 10.1.\n\n注意这些我们在 `object` 类中重写的方法，正如我们上面提到的：\n\n```java\npublic class node\
  \ {\n    private Object Data = null;\n    private Node Next = null;\n    private\
  \ int num;\n\n    public void setData(Object obj) { Data = obj; }\n    public void\
  \ setNum(int someNum) { num = someNum; }\n    public void setNext(Node node) { Next\
  \ = node; }\n    public Object getData() { return data; }\n    public node getNextNode()\
  \ { return Next; }\n\n    public boolean equals(Object obj) {\n        if (!(obj\
  \ instanceof node)) return false;\n        node N = (node) obj;\n        return\
  \ ((N.num == num) && Data.equals(N.Data));\n    }\n\n    public int hashCode() {\n\
  \        return Data.hashCode() * num;\n    }\n\n    public String toString() {\n\
  \        String S = \"Data = \";\n        S = S + Data.toString();\n        S =\
  \ S + \", num = \" + num;\n        return S;\n    }\n}\n```\n\n如果我们执行以下操作：\n\n```java\n\
  node A = new node();\nnode B = A;\nInteger I = new Integer(32);\nb.setNum(16);\n\
  b.setData(32);\n```\n\n我们并没有得到两个不同的 `linkedListNode` 实例，而是总共只有一个，引用变量 `A` 和 `B`\
  \ 都指向它。这意味着：\n\n`System.out.println(A);`\n\n将给出结果 \"data=32, num=16\"。（正如你记得的，`System.out.println`\
  \ 方法在接收到 `Object` 类型参数后会调用 `toString` 方法并以行的形式显示结果。）如果我们真的需要实例的副本怎么办？这就是类的 `clone`\
  \ 方法派上用场的地方。`object` 会复制实例，包括所有变量的当前状态。我们可以构造一个可以克隆的子类 `Node`：\n\n```java\npublic\
  \ class cloneableNode extends node implements cloneable {\n    public Object clone()\
  \ {\n        try {\n            return superclone();\n        } catch (CloneNotSupportedException\
  \ e) {\n            // 这不会发生，因为\n            // 我们已经将类声明为“implements Cloneable”\n\
  \            throw new InternalError();\n        }\n    }\n}\n```\n\n我们在这里所做的都会调用\
  \ `object` 类的 `clone` 方法。由于会产生 `CloneNotSupportedException`，我们被迫处理它：\n\n```java\n\
  cloneableNode A = new cloneableNode();\n```\n\n\n\n```\ncurList = curList.clone();\n\
  ```\n\n那么你就不需要担心 `curList` 上一个实例所占用的内存了——垃圾回收器独立地识别未使用内存区域的出现，并处理你需要的一切。\n\n这样，我们就不需要担心在系统中释放内存并编写相应的\
  \ `finalize` 方法。相反，当程序处理文件系统或网络资源时，它可能会派上用场。在此之前，我们没有考虑文件或网络工作（无论如何 applet 都无法处理文件）。所以现在我们可以提供一个\
  \ `finalize` 方法的良好示例。如果你无法抑制地想看到 `finalize` 的运行，可以查看 `java.io` 包下 `FileInputStream.java`\
  \ 的源代码。原文中所有的 Java 类都是 JDK 的一部分。\n\n## 重用组件的创建\n\n所以，我们已经学习了 `Object` 类的方法以及关于如何重写\
  \ `override()` 的主题。现在是时候转向更通用的面向对象编程概念，并讨论一下可以重复使用的组件了。\n\n创建此类组件（我们称它们为“通用”组件）与其说是一种艺术，不如说是一种可以学习的技术。在开始编写代码之前，必须仔细研究它要解决的问题。在\
  \ Java 中，有很多东西有助于通用组件的创建，但语言本身对帮助你更有效地编写代码毫无帮助。良好的编程基调始于实际创建程序之前。每一段程序或方法都必须在整个项目的语境中经过细致的评估。\n\
  \n通用性概念意味着，在编写程序时，要考虑到它在未来的使用前景。你的目标是创建一个易于构建的结构化通用代码封装，但首先需要解决具体要封装什么以及如何做最合适。\n\
  \n许多程序员掉入了复杂的语法对象和广义面向对象的陷阱。重要的是记住，面向对象提供了比其他方法更直观的解决问题方式，然而，遗憾的是，计算机在直觉解决问题方面并没有我们人类那么擅长。曾几何时，程序是用汇编语言编写的。我们用那种语言编写多线程用户界面吗？当然可以！但汇编语言本身没有可以让我们轻松描述项目项目固有问题的机制。\n\
  \n这些考虑也适用于过程化编程语言。在过程化语言中，你有工具可以描述通用的动作序列，但程序中的非通用部分。只要程序执行数学计算，它的效果就良好，但一旦你尝试解决现实规模的问题，它就失效了。考虑航空运输管理问题。\n\
  \n简而言之，它的表述如下：我们不希望飞机相互碰撞。时间、起飞、降落以及机场空间占用都是可访问的。\n\n问题由以下组件组成：飞机、它们的路线、停车位、跑道（runways）、空中交通塔和机库。在面向对象的语言中，问题可以表示为一组对象的集合，而在过程化语言中，我们仅限于描述可能的动作。\n\
  \n当然，上述问题也可以用过程化语言解决，但在这种情况下，所有的注意力将集中在上面。在面向对象的语言中，我们消除了对其细微差的研究，将所有注意力放在问题的实际解决上。编写有效程序的关键不是你写了什么，而是你写的什么。在开始编写代码之前，你是否正确地思考了问题？这种转变是已经研究过特定语言所有特征的资深程序员的特点。所以，让我们熟悉如何考虑程序使其变得更高效。\n\
  \n### 问题的背后是什么？\n\n这个问题看起来相当显而易见；但令人惊讶的是，这个问题经常没有回答。答案通常取决于编程语言：我如何用这种特定的语言来描述我的解决方案？当然，最后问题会被描述，但你的初步想法应该只是解决它的练习。有必要思考问题如何在语言的最高层面上契合。例如，当涉及到\
  \ Java 程序到不同计算机平台的可移植性时，必须找出它们是否都有运行它的手段。在开发阶段，应该避免不必要的细节，问题的描述即使对非专业人士也应该是清晰的。\n\
  \n### 问题的组成部分以及它们之间如何相互作用？\n\n这是将问题分解为组件并克服它的关键阶段。问题是以抽象术语思考的，但不限于特定的语言对象。最好画一张小图或图画，让你能够直观化问题，类似于图\
  \ 10.3 所示的。\n\n![image0927.gif](img/image0927.gif)\n\n#### 图 10.3.\n\n任务——示意性地勾勒包含解决问题的元素、对象的方法。（等等，让我们根据提供的文本重新检查文本结构）。\n\
  \n实际上，查看文本：\n“任务——示意性地勾勒包含解决问题的元素、对象的方法。让我们重复早期思考对象和方法的阶段。只需列出属性列表，如表 10-1 所示即可。”\n\
  \n**表 10-1. 航空运输系统元素的属性**\n\n*   `Aircraft`（飞机）：具有特定的位置和 `trajectory`（轨迹）。应该在某些路线上。\n\
  *   `It`（它）：具有到达和离开时间。\n*   `Route`（路线）：可能与其他路线交叉。其容量受天气条件影响。\n*   `Hangar`（机库）：具有给定容量和\
  \ `coordinates`（坐标）。可能是已填充或未填充。\n*   `Runway`（跑道）：具有给定长度。可能是被占用或空闲。跑道的使用取决于天气条件。\n\
  *   `A place for parking`（停车位）\n*   `Tower`（塔）\n*   `It`（它）：具有给定容量和 `coordinates`。受天气条件影响。\n\
  *   `Required for tracking`（需要跟踪）：在机场环境中。\n\n（注：提供的文本似乎有很多混乱，我保留了原始文本但应用了格式规则。）\n\
  \n***我将提供一个不包含内部注释的干净版本***\n\n\n\n针对上一个问题，我们将自定义接口和子系统网络从项目的其余部分分离了出来。现在是时候查看其他组件，并思考如何让它们变得通用了。例如，机库与停车场非常相似，而飞机本质上是运输设施的一种。在考虑一个程序实现自定义接口、网络和存储需要什么时，你得考虑这些组件是否在某些其他项目中也有应用。\n\
  \n微妙之处在于，将那些将变得通用的、适用于复用的组件隔离出来。然后，在继续编写类和接口时，你真正获得了了可以大胆放入库中的通用代码。对于我们正在考虑的这个例子，我们构建了一个抽象类\
  \ `transport means`，而飞机则作为子类来实现它。\n\n### 如何在面向对象的 Java 中调整原始文本？\n\n上述方法是开始编写通用组件的一种方法。在每个阶段都传递这一点至关重要。记住，在开始编写实际程序之前，要牢牢地思考哪些是必要的。现在我们准备好了，让我们开始吧。每个大型组件都必须被拆分为更小的组成部分——即若干类和接口。\n\
  \n在接下来的几页中，我们将考虑 Java 的属性，这些属性允许我们用编程语言来描述一个现实问题。我们将展示在什么情况下使用接口比子类更高效，以及如何正确地使用各种方法修饰符。完全理解所有这些属性将允许你自己创建自己的\
  \ Java 通用组件库。\n\n在追踪下一个类或接口的图表时，记住这一点。\n\n### 工作代码中的项目转换\n\n现在到了从图表转向编写实际程序的时刻了。正如我们在第\
  \ 2 章中讨论的，包（package）是一个存放类、接口和异常的容器。要指示一个对象引用特定的包，需要使用 `package` 关键字配合分配的包名：\n\n\
  ```java\npackage somePackage;\npublic class someClass {\n    // 类定义\n}\n```\n\n\
  如果原始代码放置在层次结构目录的某处，则使用这些质量分隔符名称来指向这些目录：\n\n```java\npackage myPackages.someOtherPackage;\n\
  public class someOtherClass {\n    // 类定义\n}\n```\n\n在任何情况下，包名必须严格匹配我们在第 2 章中讨论过的\
  \ `CLASSPATH` 环境变量给出的目录名。包名中的点分隔 `CLASSPATH` 变量中的目录子目录。它们是做什么用的？原因之一是语法的。Java 编译器需要一种方法来找到程序的源码，但你不想让所有程序都在同一个卷和同一个目录下。\n\
  \n另一个最重要的原因是 `protected` 修饰符的存在。到目前为止，我们还没有太频繁地使用它。相反，我们对所有只能从对象访问的方法和变量使用了 `private`\
  \ 修饰符，并对所有其他组件使用了 `public` 修饰符。`protected` 修饰符也会使组件变为公共的，但仅限于它所属的包内。\n\n我们为什么需要它呢？有时你希望某个特定方法只对某些对象可用，而不是对所有人。让我们考虑上面关于空中通信管理的例子。我们的飞机需要一个方法来寻找一个空闲的\
  \ `Runway`（跑道）进行着陆，但信息只能来自控制室。属于飞机类的 `setRunway` 方法声明了 `protected` 修饰符，并放置在描述空中交通控制室的同一个包中。这个包不能包含某些类，例如“airstrip”（跑道场）类。想象一下，如果这个类根据自己的意愿，突然调用\
  \ `setRunway` 方法并决定在繁忙的跑道上着陆会发生什么！\n\n你可以说：“所有这些类都没有自己的生命。毕竟，它们是由我编写的，还有谁比我更知道‘跑道’类不应该允许对‘飞机’类的\
  \ `setRunway` 方法进行调用？”是的，在简单项目中，你所说的是正确的。但当涉及到大项目时，某些模块确实在某种意义上开始拥有它们自己的生命。每当完成主要的项目实现后，任何人都可能来尝试做一些与系统设计基本原则完全背道而道的事。与此同时，系统是否有良好的文档一点并不重要。在这种情况下，最好的文档就是简单地禁止编译器访问未提供此类调用的类方法。”\n\
  \n`protected` 修饰符即使在只有你一个人工作的相对较小的项目中也有意义。程序员往往在时间推移后忘记程序的规模，以及程序是如何设计的，而且当在几个月后回头看自己的文本时，你实际上就变成了那个“另一个”程序员。\n\
  \n`final` 修饰符也用于防止继承或方法重写。`final` 修饰符即使在只有你一个人工作的相对较小的项目中也有意义。它防止……改变，以及他人。让我们考虑下一个例子：\n\
  \n```java\nclass runway {\n    private final int physicalLocation;\n    private\
  \ final int physicalLength;\n    private final int physicalWidth;\n\n    runway(int\
  \ i, int j, int k) {\n        physicalLocation = i;\n        physicalLength = j;\n\
  \        physicalWidth = k;\n    }\n\n    public final int getPhysicalLocation()\
  \ {\n        return physicalLocation;\n    }\n\n    public final int getPhysicalLength()\
  \ {\n        return physicalLength;\n    }\n\n    public final int getPhysicalWidth()\
  \ {\n        return physicalWidth;\n    }\n}\n```\n\n### 转换类型对象\n\n复用类的一种方法是将其子类化。只需要添加父类中缺失的几个方法，就可以让类准备就绪。缺失的类方法已经在父类中描述过了。在设计大型系统时，你需要考虑\
  \ Java 关于对象类型转换的好处。\n\n```java\nabstract class vehicle {\n}\n```\n\n\n\n\n```java\n\
  String vehicleType();\nVector getLocation();\nVector getTrajectory();\nPath getPath();\n\
  \nfloat currentFuelAmount();\n\n// returns meaning from 0 before one\n```\n\n方法\
  \ `getPath` 返回一个抽象的对象路径：\n\n```java\nabstract class Path {\n    String pathType();\n\
  \    Vector startingPoint();\n    Vector endingPoint();\n    int Length();\n}\n\
  ```\n\n到目前为止我们编写的所有内容仅代表了学术兴趣。当然，你的同事会欣赏面向对象的编程风格，但还需要一些实际实用的东西。一旦我们为不同类型的车辆（`Vehicle`）及其路线（`Path`）创建抽象类的子类，优势就会变得显而易见。此外，这些子类的实例可以使用父类\
  \ \"vehicle\" 中描述的泛型方法进行控制。接口以及以此方式创建的子类也是如此。\n\n# 关于可维护性的代码检查\n\n程序必须提供防止各种错误的手段，遗憾的是，这些错误有时会在执行过程中发生。用户并不总是输入正确的数据，程序也不总是能从系统获取正常运行所需的所有资源。在更古老的编程语言中，错误保护是以许多且难以阅读的\
  \ `if-then-else` 块的形式实现的。Java 语言使用了异常（特殊情况）处理机制——它非常有帮助，能够有效地防止程序发生错误情况，但它并不是解决所有问题的万灵妙药。\n\
  \n你们所有人都必须自己找出程序中可能导致错误的地方，并编写适当的代码来处理它们。另一方面，处理异常使得原始文本更加简单、直观且易于维护。\n\n![](img/image09280.jpeg)\n\
  \n**建议** Java 中的异常处理机制等于 C++，但它在此基础上增加了 `finally` 块，该块会在任何 `catch` 块之后运行。\n\n![](img/image09281.jpeg)\n\
  \n我们不得不反复使用异常处理机制。应用程序编程接口 (API) 中的许多方法和构造函数都会产生异常。如果此方法内部发生错误，则会抛出异常。`catch` 块决定了如何处理这个“意外”。由于我们已经必须处理异常，让我们直接开始学习如何高效地处理它们吧。当你学会了如何编写抛出异常的方法和构造函数时，你也将学会如何自己编写它们。我们将通过编写自己的子类-异常来结束这次之旅，这些异常允许尽可能根据特定项目需求来处理错误情况。\n\
  \n## 异常拦截\n\n你首次在第 5 章在网络启动过程中遇到异常处理。你可能记得，如果无法转换为格式为 `URL` 的可变参数类型 `String`，`URL`\
  \ 构造函数将抛出一个异常。让我们看看这里可以做什么：\n\n```java\npublic class someApplet extends applet {\n\
  \    Image I;\n\n    // 其他描述\n\n    public void init() {\n        String imageName\
  \ = getParam(\"image\");\n        try {\n            URL imageURL = new URL(imageName);\n\
  \            // 可能会产生异常 MalformedURLException\n            I = getImage(imageURL);\n\
  \            // 初始化 applet 其他部分\n        } catch (MalformedURLException e) {\n \
  \           String err = e.getMessage();\n            showStatus(\"Couldn't get\
  \ - \" + imageName + \": \" + e.getMessage());\n            stop();\n        }\n\
  \    // 其他方法\n}\n```\n\n这是一个演示异常使用的简单示例。`try` 块定义了当一切正常时我们打算做的事项，而 `catch` 块则是当\
  \ `try` 块中出现 `MalformedURLException` 异常时需要执行的事。\n\n异常处理是正确处理任何方法或程序构造函数的规则的重要部分。但什么是正确的异常处理？我们示例的语法非常简单，无法为这个问题提供完整的答案。我们应该熟悉异常处理的全部可能性。也就是说，需要考虑以下问题：\n\
  \n*   异常是 Java 语言中完整的类。如果是这样，它们就有方法，调用这些方法你可以获取有关事件系统中发生情况的详细信息。\n*   某些异常必须显式处理，而另一些则不需要。前者被称为“运行时异常（`RuntimeException`）”，必须进行处理。\n\
  *   多个 `catch` 块可以与一个 `try` 块配合。这意味着在单个 `try` 块中可以抛出多个不同的异常。每个这样的异常可能都有对应的 `catch`\
  \ 块。\n*   `try` 和 `catch` 块可以配合 `finally` 块。\n\n在学习异常处理技术的复杂之处时，我们将继续完善我们的简单示例。学习结束，你将清晰理解如何根据接收到的\
  \ HTML 页面信息正确访问资源。此外，你将学习如何使用设计用于提高效率的方法和工具来生成异常。\n\n### 质量对象中的异常\n\n我们的 `catch`\
  \ 块包含了以下语句：`showStatus(e.getMessage())`。\n\n这假设 `e` 是一个对象，其成员之一 `getMessage()` 返回一个\
  \ `String` 值。当然，这些假设都是正确的。可以捕获的异常是 `Throwable` 类的子类。因为 `Throwable` 总是任何被抛出对象的父类，为了分析情况，你可以使用用修饰符定义的任何方法。这些方法列在表中。\n\
  \n## 方法描述\n\n`String getMessage()` 返回详细信息。如果是 `Throwable` 对象，它会在屏幕上输出。\n\n`void\
  \ printStackTrace()` 打印堆栈跟踪的内容。栈的内容是在抛出异常时中断的所有方法。`Throwable fillInStackTrace()`\
  \ 填充堆栈跟踪内容。在处理再次生成的异常时有用。`String toString()` 返回描述。\n\n`Throwable` 类的方法可以被 `Exception`\
  \ 的子类重写，并且当然，还可以向它们添加额外方法。异常 API 文档在相关的网页上进行了描述。示例页面见下文。\n\n\n\n\n\n`URL U = new\
  \ URL(\"http://www.vmedia.com/?.?\"); Image I= getImage(U);`\n\n```java\n//编译不会通过\
  \ - 没有 try-catch 块！\n```\n\n与简单的错误错误（`Error`）不同，异常时填充（运行时异常，`Runtime Exception`）不需要显式地处理。如果我们被要求这样做，程序的源代码将变成一片无法逾越的丛林。例如，如果我们应该捕获\
  \ `OutOfMemoryError`（“内存不足”）这种类型的异常，那么在每个生成任何新对象的语句之后都必须这样做！同样，对于在尝试访问某个对象尚未实现的非静态成员时所抛出的\
  \ `NullPointerException`（“空指针”），也是如此的。下面的代码片段演示了产生此类异常的方法之一：\n\n```java\nString\
  \ S;\nS.toLowerCase();\n// 将产生 NullPointerException 异常\n```\n\n如果我们被迫处理 `NullpointerException`\
  \ 异常，那么每次访问任何对象时都必须这样做。这与强制处理 `OutOfMemoryError` 一样痛苦不分。\n\n运行时异常与错误之间的主要区别在于它们在系统中所代表的失败类型。错误是你的程序可能无法帮助的情况。例如，程序几乎无法处理“内存溢出”错误。因此，在处理错误时，程序的意义不大。在这些情况下，能做的最好的事情就是正确地完成应用程序操作。\n\
  \n运行时异常是操作过程中的失败情况，你完全可以自己应对。它们与错误不同，有时甚至需要进行处理。还记得在第 6 章中我们必须将 `String` 值转换为 `int`\
  \ 值吗？在那种情况下，我们可以按照如下方式安排 `try catch` 块：\n\n```java\nString S=\"20\"; try {\n   \
  \ int i = Integer.parseInt(S);\n} catch (NumberFormatException e) {\n    System.out.println(\"\
  无法转换 - + + S);\n}\n```\n\n我们并不被要求处理运行时的 `NumberFormatException`。但如果字符串值 `S` 是用户输入的输入，那么处理它就是绝对必要的。如果用户犯了错误导致产生的异常没有被处理，程序在不怀疑任何问题的情况下将继续工作，这将导致它在某些时间紧急停止。\n\
  \n### 一个设计中的多个 catch 块\n\n因此，异常处理系统迫使我们对应用程序可能的意外保持小心。遗憾的是，在示例 10-1 中，我们并没有真正演示\
  \ Java 异常处理如何比简单的 `if`-`else` 结构更好。它每个 `try` 块只有一个 `catch` 块。实际上，与 `try` 块关联的 `catch`\
  \ 块可以根据需要任意添加。这意味着 `try` 块中的语句在程序正常进行时执行。\n\n对于研究你代码的程序员来说，理解他们想要在做什么并不困难。任何程序员都会欣赏将运行正常情况的代码与发生错误时执行的代码分开的能力。\n\
  \n让我们来看一个演示优势的示例。我们以前只在 applet 中上传单个图形文件。现在让任务复杂化：假设 Web 设计师想要上传多个文件，并指定每个文件在屏幕上显示的时间——通常创建一个动画。如果某个指定的文件在\
  \ applet 执行时不可用，它将用一张特殊图片替换，告知设计师服务器上该文件，同时 HTML 页面上的特殊图标将指示页面作者没有相应的图像。如果未指定显示时间，则使用默认时间。我们的动画任务决定了以下应用：\n\
  \n```java\nclass anumApplet extends applet { Image imgs[];\n    Integer pauses[];\n\
  \    // 其他描述\n    public void init() {\n        Vector imgVec = new Vector(); Vector\
  \ pauseVec = new Vector();\n        Image deadImage = createDeadImage(); Integer\
  \ defaultPause = new integer(100); int indx = one;\n        String imgName = getParam(\"\
  image\"+indx); while (imgName != null) {\n            try {\n                URL\
  \ imgURL = new URL (getDocumentBase, imgname);\n                // 这里可能会出现 MalformedURLException\
  \ imgVec.add(getImage(imgURL));\n                String pauseParam = getParam (\"\
  pause\" + indx); Integer thisPause(pauseParam);\n                // 这里可能会出现 NumberFormatException\
  \ pauseVec.add(thisPause);\n            } catch (MalformedURLException e) {\n  \
  \              showStatus(e.getMessage()); System.out.println(e.getMessage()); imgVec.add(deadImage);\n\
  \            } catch (NumberFormatException e) {\n                pauseVec.add(defaultPause);\n\
  \            } finally {indx = indx + one;}\n        }\n        imgs = new Image[imgVec.size()];\
  \ imgVec.copyInto(imgs); pauseVec.copyInto(pauses);\n    }\n}\n```\n\n在 `indx =\
  \ indx + one;` 之前的 `finally` 块。`imgs = new Image[imgVec.size()]; imgVec.copyInto(imgs);\
  \ pauseVec.copyInto(pauses);`（等等，我应该重新检查文本逻辑文本逻辑）。\n\n\n\n如果我们抛出一个与错误或执行时异常（timing\
  \ exceptions）无关的异常，它必须在方法的适当部分中进行声明。我们很快就会看到，一个方法可以抛出多个异常。为了显示方法生成了异常，我们使用关键字 `throw`。如果方法产生的异常其无法自行处理怎么办？它可以拦截该异常并将其进一步发送给调用它的方法。`throw`\
  \ 语句之后必须紧跟一个 `Throwable` 类的类的实例。当然，我们可以使用任何可用的构造函数。\n\n现在我们将开始开始开发这个类，在此期间，我们将对“如何处理异常”这一主题有一个深刻的教训。第\
  \ 4 章展示了数值基本类型之间总是可以相互转换。即使我们将 `int` 转换为 `byte` 并超出了 `byte` 类型可能取值范围的限制，转换也不会导致错误——我们只是得到了一个没有意义的结果。但如果我们想知道转换过程中是否发生了错误呢？实现这一点的最佳方法是创建一个特殊的类\
  \ `Convert`，其内容是设计用于测试此类情况的方法。如果类型转换导致信息丢失，方法将生成一个异常。对于每种类型的转换，我们都会开发一个对应的方法，一旦类型转换导致信息丢失，该方法就会抛出异常。这里是这些方法之一：\n\
  \n```java\npublic static byte toByte(int I) throws Exception {\n    String mesg\
  \ = \"toByte: \";\n    if (I > 127) {\n        mesg = mesg + I + \" - is less than\
  \ byte range\";\n        throw new Exception(mesg);\n    }\n    if (I > 128) {\n\
  \        mesg = mesg + I + \" - is less than byte range\";\n        throw new Exception(mesg);\n\
  \    }\n    return (byte)I;\n}\n```\n\n从一方面来说，我们的方法是处理如何处理异常的良好示例。如果我们无法生成异常，我们就没有方法来报告超出允许范围的整数值是多少。\n\
  \n然而，我们最简单的示例绝对不适用于实际使用。如果发生了任何问题，我们的程序需要知道原因。否则，未来可能研究你代码的人将无法理解程序中发生了什么种错误。此外，正如你记得的，每种类型的异常都必须有单一的\
  \ catch 语句。这意味着使用你方法的人可能无法区分一个异常实例和另一个方法的产生的异常实例。\n\n这是一个语义问题，因为意义很少。我们必须编写自己的 `Exception`\
  \ 子类并为它们提供有意义的名称。由于转换器类中的每个方法都必须生成自己的异常，我们开发了异常层次结构，如图 10-6 所示。\n\n![](img/image09287.gif)\n\
  \n#### 图 10.6。\n\n编写一个遵循此层次结构的程序非常简单。所有需要做的事情——就是为包含在 `MagnitudeLoss` 和 `PrecisionLoss`\
  \ 层次结构部分中的不同异常类型添加构造函数。记住，与任何类一样，每个异常都必须放在单独的文件中：\n\n示例 10-1a。转换转换的异常。\n\n```java\n\
  public class ConvertException extends Exception {\n    public ConvertException(String\
  \ S) {\n        super(\"Couldn't convert: \"+S);\n    }\n}\n\npublic class StringFormatException\
  \ extends ConvertException {\n    public StringFormatException(String S) {\n   \
  \     super(\"Bad String Format: \"+S);\n    }\n}\n\npublic class MagnitudeLossException\
  \ extends ConvertException {\n    public MagnitudeLossException(String S) {\n  \
  \      super(\"magnitude loss: - \"+S);\n    }\n    // 注意：原文在此处有两个构造函数定义，存在语法错误\n\
  \    public MagnitudeLossException(double d) {\n        this(\"\"+d);\n    }\n}\n\
  \npublic class LongMagnitudeLossException extends MagnitudeLossException {\n   \
  \ public LongMagnitudeLossException(long l) {\n        super(\"long \"+l);\n   \
  \ }\n}\n\npublic class IntMagnitudeLossException extends MagnitudeLossException\
  \ {\n    public IntMagnitudeLossException(int i) {\n        super(\"int \"+i);\n\
  \    }\n}\n\npublic class ShortMagnitudeLossException extends MagnitudeLossException\
  \ {\n    public ShortMagnitudeLossException(short s) {\n        super(\"short -\
  \ \"+s);\n    }\n}\n\npublic class PrecisionLossException extends ConvertException\
  \ {\n    public PrecisionLossException(String S) {\n        super(\"Precision loss:\
  \ \"+S);\n    }\n}\n\npublic class DoublePrecisionLossException extends PrecisionLossException\
  \ {\n    public DoublePrecisionLossException(double d) {\n        super(\"double:\
  \ - \"+d);\n    }\n}\n\npublic class FloatPrecisionLossException extends PrecisionLossException\
  \ {\n    public FloatPrecisionLossException(float f) {\n        super(\"float: -\
  \ \"+f);\n    }\n}\n```\n\n创建异常层次结构与创建普通层次结构完全不同。`Throwable` 的子类工作很少——子类最重要的是它们的名称。通过观察\
  \ `catch` 语句，你必须理解生成了什么情况。`Throwable` 类的例子是 `Exception` 类。\n\n现在，构建了异常后，我们可以继续开发\
  \ `Convert`。转换 `byte`，但一个方法使用了 `toByte(String)`。\n\n示例 10-1b. Convert 类。\n\n```java\n\
  public class Convert {\n    public static byte toByte(short s) throws MagnitudeLossException\
  \ {\n        byte b = (byte)s;\n        if (b == s) return b;\n        else throw\
  \ new MagnitudeLossException(s);\n    }\n\n    public static byte toByte(int i)\
  \ throws MagnitudeLossException {\n        byte b = (byte)i;\n        if (b == i)\
  \ return b;\n        else throw new MagnitudeLossException(i);\n    }\n\n    public\
  \ static byte toByte(long l) throws MagnitudeLossException {\n        byte b = (byte)l;\n\
  \        if (b == l) return b;\n        else throw new LongMagnitudeLossException(l);\n\
  \    }\n\n    public static byte toByte(String S) throws StringFormatException,\
  \ StringToByteException {\n        try {\n            double d = toDouble(S);\n\
  \            byte b = (byte)d;\n            if (b == d) return b;\n            else\
  \ throw new StringToByteException(d);\n        } catch (StringFormatException e)\
  \ {\n            throw e;\n        }\n    }\n\n    public static byte toByte(float\
  \ f) throws MagnitudeLossException, FloatPrecisionException {\n        if (f > 127\
  \ || f < -128)\n            throw new MagnitudeLossException(f);\n        byte b\
  \ = (byte)f;\n        if (b == f) return b;\n        else throw new FloatPrecisionException(f);\n\
  \    }\n\n    public static byte toByte(double d) throws MagnitudeLossException,\
  \ DoublePrecisionLossException {\n        if (d > 127 || d < -128)\n           \
  \ throw new MagnitudeLossException(d);\n        byte b = (byte)d;\n        if (b\
  \ == d) return b;\n        else throw new DoublePrecisionLossException(d);\n   \
  \ }\n}\n\n//*** toDouble\n\npublic static double toDouble(String S) throws StringFormatException\
  \ {\n    S = S.trim();\n    try {\n        double d = Double.valueOf(S).doubleValue();\n\
  \        return d;\n    } catch (NumberFormatException e) {\n        throw new StringFormatException(S);\n\
  \    }\n}\n```\n\n\n\n由于 Java 是一种动态语言，我们可以动态获取有关对象的信息。为了实现这一点，请使用 `Class` 类 - `java.lang.Class`（图\
  \ 10-7）。需要这个类是为了让我们发现我们正在处理的是什么种的对象，以及应用了哪些接口和许多特性。\n\n![](img/image09288.gif)\n\
  \n#### 图 10.7.\n\n当我们确切知道系统中会出现什么种类型的实例时，它在小型系统中很少被使用。在大型且复杂的系统中，我们可以使用这个类来理解我们正在处理哪一个实例。表\
  \ 10-3 列出了 `Class` 类中定义的方法。通过返回一个 `Class` 对象，它们唯一地描述了一个特定的 `Class` 或 Java 接口。\n\n\
  ### 表 10-3. `class` 类的方法\n\n#### 方法、用途及生成的异常\n\n- `static Class forName(String classname)`：给定一个\
  \ `className`，该方法返回一个 `Class` 实例，具有该类的特征。抛出的异常：`ClassNotFoundException`。\n\n- `String\
  \ getName()`：返回与此实例关联的类名。不产生异常。\n\n- `String toString()`：见上文。如果是接口，则添加接口；如果是 `Class`，则返回\
  \ `Class`。不产生异常。\n\n- `boolean isInterface()`：如果对象是一个接口，则返回 `true`。不产生异常。\n\n- `Class[]\
  \ getInterfaces()`：返回与对应类拥有的接口对应的 `Class` 实例；如果该类没有任何接口，则返回零长度数组。不产生异常。\n\n- `class\
  \ getSuperclass()`：返回实例类的父类。不产生异常。\n\n- `Object newInstance()`：创建对应类的新实例。产生异常：`InstantiationException`、`IllegalAccessException`。\n\
  \n- `ClassLoader getLoader()`：返回加载器类。不产生异常。\n\n使用 `newInstance` 方法，在需要时“动态”创建类实例。\n\
  \n创建实例的后续如下（假设 S-name 是存在的子类路径）：\n\n```java\ntry {\n    Path p = Class.forName(S).newInstance();\n\
  } catch (InstantiationException e) {\n    System.out.println(S + \" is not a valid\
  \ subclass of \" + Path);\n} catch (IllegalAccessException e) {\n    System.out.println(S\
  \ + \" is not allowed to be accessed\");\n} catch (ClassNotFoundException e) {\n\
  \    System.out.println(S + \" wasn't found\");\n}\n```\n\n# 接下来是什么？\n\n我们对程序设计原则进行了简要介绍，并尝试展示\
  \ Java 语言在编写重用代码和面向对象方面的机会。为了让 Java 编程更加强大，我们展示了提高代码稳定性的方法。下一章将介绍构建多线程应用程序的方法。\n\
  \n## 第十一章\n\n## 多线程\n\n使用 `Thread` 类创建线程、使用 `Runnable` 接口创建线程、流程控制、线程调度、线程分组、线程同步、变量\
  \ `volatile`。\n\n我们已经简要地讨论过 Java 语言中线程的使用。Java 以非常优雅的方式处理线程：它是第一个在语言规范中包含流的流行语言。Java\
  \ 作为一种强大的网络语言，应该能够执行多线程操作。线程的引入使得 Java 成为一种开发互联网程序的独特语言。\n\n为什么线程如此有用？假设你正正在创建一个电子表格程序，并希望在后台处理用户输入的结果。在普通的单线程程序中，为了获得这个结果，你将不得不使用一些足够混乱的技巧\
  \ - 例如循环，它检查键盘输入，如果没有输入，则执行一些计算。这种解决方案并不优雅，但它是可行的。\n\n但当在项目开发后期，有人要求为打印程序提供后台模式，另一个人又要求自动保存时，你的决定就会变得越来越不清晰。现在，你必须越来越多地处理这些在按键输入之间需要执行的额外例行操作。你的键盘输入循环迅速变得混乱且杂乱，而这一切都是因为你只有一个执行线程。\n\
  \n当然，可以使用别人提供的支持多个并发执行线程的库。这是行得通的，但非是最优的。每当工作项目发生变化时，你可能都会遇到层出不穷的多线程支持库并学习新的 API。Java\
  \ 开发者理解了这一点，并在语言规范中执行了支持流。\n\n通过使用 Java 标准流，我们可以解决电子程序中的问题。表格将变得简单得多。每个新任务都作为一个独立的线程执行。我们不再需要仔细研究每一个新功能。语言对线程的支持以及内置垃圾回收器的创建都提供了很大帮助。\n\
  \n本章重点关注 Java 如何实现线程以及使用大量流的程序问题。如果你还很少接触过多线程，本章（除了结尾之外）可能会改变你对编程的认知。\n\n## Thread\
  \ 类的创建流\n\n在 Java 中创建一个新线程是最简单的操作。你需要做的只是扩展 `java.lang.Thread` 并替换 `run` 方法。该类的每个实例都将作为一个独立的线程执行。\n\
  \n## 简单流\n\n示例 11-1。简单流。\n\n```java\nclass outputThread extends Thread {\n    outputThread(String\
  \ name) {\n        super(name);\n    }\n\n    public void run() {\n        for(int\
  \ i=0; i < 3; i++) {\n            System.out.println(getName());\n            Thread.yield();\n\
  \        }\n    }\n}\n\nclass runThreads {\n    public static void main(String[]\
  \ argv[]) {\n        outputThread t1 = new outputThread(\"Thread 1\");\n       \
  \ outputThread t2 = new outputThread(\"Thread 2\");\n        t1.start();\n     \
  \   t2.start();\n    }\n}\n```\n\n代码在输出上生成以下内容：\n\n```\nThread 1 Thread 2\nThread\
  \ 1 Thread 2\nThread 1 Thread 2\n```\n\n注意，在这个程序中我们通过帮助 `outputThread` 类创建了两个流。我们随后在每个线程上调用\
  \ `start` 方法。该方法创建一个新线程并调用我们替换的 `run` 方法。你已经创建了一个多线程程序！而且这一点也不可怕或困难 - 事实上，你在书中已经使用了流。\n\
  \n记得我们网页上的 applet 吗？我们扩展了 `java.applet.Applet`。确实，这只有一个线程。但页面上的每个 applet 都是由一个或多个流组成的；除了我自己，Java\
  \ 都会创建一些流。你已经熟悉了释放未使用内存的垃圾回收线程。如何查看流是 Java 开发不可或缺的一部分。\n\n![](img/image9289.jpeg)\n\
  \n# runnable 类的创建流\n\n\n\n\n\n\n如果我们不想扩展上面示例中的 `Thread` 类怎么办？也许我们已经有了一个 `eat` 类，并且对它的功能机会非常满意，我们只是想让它作为一个独立的线程运行。答案很简单：使用\
  \ `runnable` 接口。我们在第 3 章“Java 中的面向对象编程”中讨论过 Java 接口。接口为可执行的类定义一组标准功能提供了一种很好的方法。`Runnable`\
  \ 接口实现了一个方法 `run`，它与 `work` 类中的 `thread` 非常相似。\n\n假设我们有一个想要转换为流的 `outputClass`。我们需要做的所有事情就是：实现\
  \ `runnable` 接口，并创建共享方法 `run`。\n\n示例 11-2. `runnable` 接口的用法。\n\n```java\nclass outputClass\
  \ implements runnable {\n  String name;\n\n  outputClass(String s) {\n    name =\
  \ s;\n  }\n\n  public void run() {\n    for(int i=0; i < 3; i++) {\n      System.out.println(name);\n\
  \      Thread.yield();\n    }\n  }\n}\n\nclass runThreads {\n  public static void\
  \ main(String argv[]) {\n    outputClass out1 = new outputClass(\"Thread 1\");\n\
  \    outputClass out2 = new outputClass(\"Thread 2\");\n    Thread t1 = new Thread(out1);\n\
  \    Thread t2 = new Thread(out2);\n    t1.start();\n    t2.start();\n  }\n}\n```\n\
  \n这个示例在功能上等同于示例 11-1，但实现方式不同。在这里我们创建了两个 `outputClass` 类实例。这些可以是任何类，但它们必须实现 `Runnable`\
  \ 接口。然后我们创建两个新线程并将它们传递给创建的 `outputClass` 副本。之后，执行流像往常一样启动。\n\n这两个示例的区别在于对 `Thread`\
  \ 类构造函数的调用。在第一个示例中，我们调用了 `Thread(String)` 构造函数，而在第二个示例中调用了 `Thread(Runnable)`。我们也可以调用\
  \ `Thread(Runnable, String)` 构造函数。`Thread` 类有以下构造函数：\n\n* `Thread()`\n* `Thread(string)`\n\
  * `Thread(Runnable)`\n* `Thread(string, runnable)`\n* `Thread(thread group, string)`\n\
  * `Thread(thread group, runnable)`\n* `Thread(ThreadGroup, runnable, string)`\n\n\
  我们稍后会讨论线程组。现在，让我们探索如何管理流。\n\n创建线程只是故事的一部分；更重要的是学习在它们生成后如何管理它们。\n\n# 控制流\n\n到目前为止，我们执行的是能够自动终止的线程。它们完成任务并结束。那么当\
  \ Java 程序完成其工作时，如何停止线程呢？这是一个重要的问题，我们需要一些通用知识来回答。\n\n让我们回到那个只有一个线程的程序。我们有一个主循环，其中运行着一些代码。当程序应该结束运行时，我们退出循环并结束程序。在\
  \ Java 中，我们得到相同的结果，但有一点不同：程序在所有流完成工作之前不会结束。所以，如果我们有一个永远不会完成的流，那么我们的程序也将永远不会结束。\n\
  \n每个线程可以处于四种状态之一：创建、执行、等待或完成。新创建的线程尚未运行——它正在等待启动。之后，线程可以通过 `start` 方法启动，或者当它被转移到完成状态时被停止。处于这种状态的线程已经完成了执行，也就是说这是它们所处的最后一个状态。一旦线程到达此状态，就可以重新启动。当\
  \ Java 虚拟机中的所有线程到达完成状态时，程序将结束工作。\n\n所有当前运行的线程都处于执行状态。CPU 在线程之间共享时间（Java 具体如何分配 CPU\
  \ 时间，我们将在下文中讨论）。\n\n在此状态下，每个线程都是可执行的，但在处理器系统的任何时候，实际上只能运行一个程序。\n\n如果流的执行被中断，它们将进入等待状态。流可以通过多种方式被中断。它可能是因为等待某些系统资源或根据请求挂起。从这种状态开始，线程可以通过\
  \ `stop` 方法返回执行状态或转移到已执行状态。在表 11-1 给出的方法管理线程的执行。\n\n### 表 11-1. 管理流的方法\n\n| 方法 |\
  \ 说明 | 初始状态 | 新状态 |\n| :--- | :--- | :--- | :--- |\n| `start()` | 启动执行线程 | 创建 |\
  \ 执行 |\n| `stop()` | | 执行 | 完成 |\n| `sleep(long)` | | 执行 | 等待 |\n| `sleep(int)`\
  \ | | 执行 | 等待 |\n| `suspend()` | | 等待 | 执行 |\n| `resume()` | | 等待 | 执行 |\n| `yield()`\
  \ | | 执行 | 等待 |\n\n你正越来越接近使用线程：你已经可以创建并管理它们了。你需要了解状态。如果你需要知道哪个线程正在运行，请使用 `isAlive`：结果为\
  \ `true` 表示什么。\n\n\n\n\n当我们创建这段代码时，我们实际上期望每个具有相同优先级的线程都能运行一段时间，然后将控制权让另一个线程。正如这个在\
  \ Windows 95 机器上运行的程序示例输出所示，我们得到了如预期的结果：\n\n```\nThread one\nThread 2\nThread 3\n\
  Thread one\nThread 2\nThread 3\nThread one\nThread 2\nThread 3\n```\n\n但让我们看看在 Sun\
  \ 工作站上运行相同的代码会得到什么：\n\n```\nThread I\nThread I\nThread I Thread 2\nThread 2\nThread\
  \ 2\nThread 3\nThread 3\nThread 3\n```\n\n结果完全不同！平台无关性去哪儿了？欢迎来到多线程的幽暗世界。并不是所有机器都是平等的，操作系统的影响会改变执行顺序。这种差异在于被称为“时间切片”的概念。\n\
  \nJava 规范中并没有描述相同优先级的线程是如何执行的。这些线程似乎应该共享处理器，但情况并非总是如此。它们的执行顺序是由基本的操作系统和硬件手段决定的。显然，在单处理器系统上，我们不能期望超过一个线程同时执行。操作系统通过调度器为线程提供服务，调度器定义了执行顺序。\n\
  \n让我们仔细观察在 Sun 机器上运行程序时发生了什么。第一个线程运行完毕，然后是线程 2，最后是线程 3。但如果第一个线程永远不结束，线程 2 和 3 将永远不会执行。当然，这导致了一些问题。高优先级线程将一直运行，而较低优先级的线程取决于操作系统可能无法运行。如果我们需要某种顺序，甚至仅仅是线程的顺序执行，我们就必须做一些工作。\n\
  \n`yield` 方法为时间切片问题提供了一个简单的变通方法。如果使用了 `yield` 方法，线程将主动让出处理器，从而让其他线程也有获得处理器时间的机会。控制权的主动转移在长周期中尤为重要。让我们使用\
  \ `yield` 方法重写之前的程序。\n\n### 示例 11-4. 方法 yield。\n\n```java\nclass outputThread extends\
  \ Thread {\n    outputThread(String name) {\n        super(name);\n    }\n\n   \
  \ public void run() {\n        for (int i = 0; i < 3; i++) {\n            System.out.println(getName());\n\
  \            Thread.yield();\n        }\n    }\n}\n\nclass runThreads {\n    public\
  \ static void main(String[] argv[]) {\n        outputThread t1 = new outputThread(\"\
  Thread 1\");\n        outputThread t2 = new outputThread(\"Thread 2\");\n      \
  \  outputThread t3 = new outputThread(\"Thread 3\");\n        t1.start();\n    \
  \    t2.start();\n        t3.start();\n    }\n}\n```\n\n这个选项只需要一个更改。我们在主线程循环中添加了\
  \ `yield` 命令。虽然这给了我们想要的结果，但这个解决方案有几个缺点。`yield` 方法消耗系统资源。在单线程情况下，使用 `yield` 是浪费时间。不要忘记，某些系统已经为我们提供了时间划分。另一个缺点是我们必须显式地让出控制权——但是如何发现、何时以及多频率这样做呢？\n\
  \n既然有些系统执行时间切片而另一些没有，我们可以开发一个简单的测试来确定系统的能力。以下代码判断系统是否提供了时间切片。\n\n### 示例 11-5a. 测试流\
  \ testThread。\n\n```java\nclass testThread extends Thread {\n    protected int val\
  \ = 0;\n    public void run() {\n        while (true) {\n            val++;\n  \
  \      }\n    }\n\n    public int getVal() {\n        return val;\n    }\n}\n```\n\
  \n第一个类只是一个测试线程。它只是在增加某个变量。在时间切片系统中，所有当前线程必须具有相等的值。没有时间切片的系统可能会导致单个线程接收到比其他线程多得的时间。以下代码定义并执行是否为时间切片系统。\n\
  \n### 示例 11-5b. 时间切片可用性定义。\n\n```java\nclass isFair extends Thread {\n    boolean\
  \ fair = false;\n    boolean determined = false;\n\n    public boolean isFair()\
  \ {\n        if (determined) return fair;\n        start();\n        while (!determined)\
  \ {\n            // 等待值被确定\n            try {\n                sleep(1500);\n  \
  \          } catch (InterruptedException e) {\n            }\n        }\n      \
  \  return fair;\n    }\n\n    public void run() {\n        testThread t1 = new testThread();\n\
  \        testThread t2 = new testThread();\n        setPriority(MAX_PRIORITY);\n\
  \        t1.start();\n        t2.start();\n        try {\n            sleep(500);\n\
  \        } catch (InterruptedException e) {\n        }\n        t1.stop();\n   \
  \     t2.stop();\n        if (t1.getVal() > 2 * t2.getVal()) {\n            fair\
  \ = false;\n        } else {\n        }\n        }\n        fair = true;\n     \
  \   determined = true;\n    }\n}\n```\n\n`isFair` 类是这个示例的核心。它有一个 `isFair()` 方法，可以判断系统是否有切片。如果一个线程获得的时间是另一个的两倍，`fair\
  \ = false`。\n\n### 示例 11-5c. 测试公平性。\n\n```java\nclass isFair {\n    public static\
  \ void main(String[] argv[]) {\n        isFair tThread = new isFair();\n       \
  \ if (tThread.isFair()) {\n            System.out.println(\"System has slicing\"\
  );\n        } else {\n            System.out.println(\"System does not\");\n   \
  \     }\n    }\n}\n```\n\n\n\n\n从效率的角度来看，在代码中放置 `yield` 语句会更好。两种方法都不是理想的解决方案，但线程共享\
  \ CPU 时间需要某些机制。不要认为仅仅因为你的系统支持时间切片，其他系统也是如此——它们确实是支持的。`Java` 是可移植性最好的语言之一，但如果你忽视调度问题，你可能会降低它的可移植性。\n\
  \n你可能会问为什么 `Java` 开发者要这样做。最好的答案是他们本该这么做。规划最好留给操作系统。如果 `Java` 承担线程调度的任务，将是浪费且低效的。大多数现代处理器在硬件层面都支持多任务处理。无论程序代码有多优秀，都无法与硬件实现相比。在\
  \ Solaris 系统下，Sun 为优先级流提供了完全支持，有一天 `Java` 将能够利用这种基础 `OS` 的这种优势。\n\n## 线程分组 (Grouping\
  \ flows)\n\n管理多个线程不会引起任何实际问题，但设想你需要跟踪成百上千线程。遍历每个线程将非常繁琐。在编写互联网服务器时可能会遇到这种情况——某些程序处理成千上万个并发会话。假设你必须产生某些监控系统，你需要结束所有会话。你有两个选择：创建一个检查每个线程的循环并显式停止流，或者使用线程组。\n\
  \n线程是分级分组的。每个组可以包含无限数量的流。你可以访问每个线程并在整个线程组执行挂起（suspend）和停止（stop）操作。让我们创建多个线程组：\n\n\
  ```java\nThreadGroup parent = new ThreadGroup(\"parent\");\nThreadGroup child =\
  \ new ThreadGroup(parent, \"child\");\n```\n\n这段代码片段展示了创建组的两种方法。\n\n第一种方法创建一个带有名称的\
  \ `ThreadGroup`。第二种方法创建一个带有父组和某些名称的 `ThreadGroup`。`parent` 组选择了流，并对其下达命令。\n\n一旦我们创建了\
  \ `ThreadGroup` 对象，就可以将线程添加到它们中。记得处理 `ThreadGroup` 的构造函数吗？我们可以使用它们将线程添加到组中。事实上，这是我们可以使用的唯一机制——线程组在创建后是更改的。\n\
  \n```java\nThread t1 = new Thread(parent);\nThread t2 = new Thread(child, \"t2\"\
  );\n```\n\n现在我们已经在不同组中拥有了一些线程，对它们能做什么？与线程组配合的最有用方法是 `suspend`、`resume` 和 `stop`。`ThreadGroup`\
  \ 中的每个线程都会被调用相应的方法。`ThreadGroup` 对后代同样有效。使用这些方法，我们可以轻松地对大量流执行操作。\n\n线程组还有其他功能，主要由\
  \ `Java` 虚拟机使用，并处理线程间的保护。基本上 `Java` 虚拟机应该防止我们的线程被其自身的线程所干扰。在 `ThreadGroup` 中派生的流无法管理父组中的线程。你可能并不需要这种行为。目前关于此点的文档较少，因此最好查看原文。这通常由\
  \ `Java` 虚拟机实现，以保护其流免受用户流的影响。\n\n最后一部分将完成多线程问题。到目前为止，我们的流完全没有影响系统中的其他流。我们本应该担心相对的时间使用，但线程之间没有共享数据。这通常是计算机科学课程中学习的学术材料。我们可以为你提供简要概述，但本书的性质不允许详细探讨这一主题。我们建议你进行一些独立研究。查阅关于并发处理请求的书，或者关于操作系统的书籍。你可能感兴趣的话题包括同步、信号量、死锁和竞态条件（terms\
  \ racing）。\n\n## 同步流 (Synchronization flows)\n\n让我们想象一下你有一个计算机科学博士学位。你花费了多年学习编程的复杂性。你可能研究过交互式查询处理或并行编程学科。你接受过多任务训练，并花大量时间学习与此类问题相关的最新算法。\n\
  \n现在让我们回到现实。也许你拥有编程博士学位，或者你是并行编程领域的专家。如果是，你可以跳过本节。如果不是，我们将教你基础知识，并可能回答你的大部分问题。\n\
  \n在程序中运行许多线程会导致一些问题。如果流互不干扰，就不会产生问题，但情况并非总是如此。多线程有时需要一个线程与另一个线程通信，通常通过 `public resource`。这正是困难开始的地方。\n\
  \n### 监视器 (Monitors)：保护公共变量\n\n我们使用一个简单的例子来说说明在与多个线程工作时可能会遇到的一些问题。想象一个有多个不同方向的火车站，但某个方向只有一个用于装卸的通道。在主线某处，火车必须进入进入装卸区域的轨道以接近车站。假设我们有两个通往车站的分支，它们最终合并为一条。\n\
  \n```java\nclass display {\n    int switch1Loc = 15;\n    int switch2Loc = 10;\n\
  \    int begin1, begin2;\n    int end1, end2;\n\n    public void showLoc(String\
  \ train, int seq, int len) {\n        if (train.compareTo(\"train1\") == 0) {\n\
  \            begin1 = seq;\n            end1 = seq + len - one;\n            if\
  \ (seq > switch1Loc) {\n                System.out.println(\"train1 near \" + seq);\n\
  \            } else if (seq + len > switch2Loc) {\n                System.out.println(\"\
  train1 @ \" + begin1);\n            }\n        }\n        if (train.compareTo(\"\
  train2\") == 0) {\n            begin2 = seq;\n            end2 = seq + len - one;\n\
  \            if (seq > switch1Loc) {\n                System.out.println(\"train2\
  \ near \" + seq);\n            } else if (seq + len > switch2Loc) {\n          \
  \      System.out.println(\"train2 @ \" + begin2);\n            }\n        }\n \
  \       if ((begin1 <= switch1Loc && end1 >= switch2Loc) && (begin2 <= switch1Loc\
  \ && end2 >= switch2Loc) && (begin1 <= end2) && (begin1 >= begin2)) {\n        \
  \    System.out.println(\"CRASH @ \" + seq);\n            System.exit(-1);\n   \
  \     }\n    }\n}\n```\n*(注：由于原文代码片段缺失且包含占位符，上述代码块已根据描述的逻辑进行了重构，并保留了文中提到的变量名。)*\n\
  \n\n\n\n`Display` 类用于显示我们列车的移动情况。如果两列列车处于同一位置和同一轨道上，它会发现碰撞。这种检查他只在列车位于车站时进行。为了方便起见，我们开启了\
  \ `display` 类的代码。\n\n#### 示例 11-7b. 代码模拟了站台。\n\n```java\nclass testTrains1 {\n \
  \   public static void main(String argv[]) {\n        display display = new display();\n\
  \        train1 t1 = new train1(\"train1\",display);\n        train1 t2 = new train1(\"\
  train2\",display); \n        t1.start();\n        t2.start();\n    }\n}\n```\n\n\
  `test` 代码非常简单，它创建了两个新列车并启动了它们的移动。这里是我们第一次尝试的输出：\n\n```\ntrain1 near switch @ 14\
  \  train2 near switch @ 14  train1 near switch @ 13  train2 near switch @ 13  train1\
  \ near switch @ 12  train2 near switch @ 12  train1 near switch @ 11  train2 near\
  \ switch @ 11  train1 @ 10\ntrain2 @ 10\nCRASH @ 10 own\n```\n\n报纸标题在尖叫着事故，程序员因无能被解雇。律师威胁要起诉。公司必须立即修复程序。\n\
  \n也许有人会记得在他以前学过的那门操作系统课程中，教授提到过监视器（monitors）。监视器简单来说跟踪跟踪变量的线程。在我们的情况下，使用了一个道器变量。在任何时刻，只有一列列车可以处于道器位置。当另一列列车通过危险区域时，我们需要降低车速。\n\
  \nJava 提供了一种保护程序中变量的机制。问题归结为两个线程试图同时执行某些操作。我们需要一个线程等待另一个完成。该操作可能包含几条命令。这些命令被称为临界区（critical\
  \ section）。临界区域——这部分代码必须被保护，以防止系统崩溃。在我们的列车案例中，临界区位于 `step` 方法中。不允许列车在轨道已被占用的时间进入轨道。\n\
  \n我们可以创建一个 `trainSwitch` 类来保护我们的道器。它将包含两个方法——`lock`（阻塞）和 `unlock`（解锁）。进入危险道路时，列车必须调用\
  \ `lock`。一旦列车离开轨道，它就会调用 `unlock`。所有其他列车在进入此路之前都必须等待，直到它被解锁。\n\n在 Java 中，临界代码部分用\
  \ `synchronized` 关键字标记。任何代码块都可以标记为 `synchronized`，但方法通常是这样标记的。在方法的某些部分上标记 `synchronized`\
  \ 实际上是一个糟糕的编程示例。\n\n程序员需要意识到可能导致多线程问题的区域；如果你不将方法标记为 `synchronized`，人们将需要一些代码来确定发生了什么。由于这个原因，我们只在方法级别上使用\
  \ `synchronized` 关键字。\n\n那么，将方法标记为 `synchronized` 的意义是什么？每个类关联一个监视器。当调用 `synchronized`\
  \ 方法时，它会检查监视器。如果 `Class` 已经被阻塞，调用程序将等待。这意味着在时间某一点，只有一个线程将处于临界块中。让我们看看它是如何实现的。\n\n\
  #### 示例 11-7c. `trainSwitch` 类。\n\n```java\nclass trainSwitch extends Thread {\n\
  \    protected boolean inUse=false;\n    public synchronized void lock() {\n   \
  \     while (inUse) {\n            try wait();\n            catch (InterruptedException\
  \ e);\n        }\n        inUse = true;\n    }\n\n    public synchronized void unlock()\
  \ { \n        inUse = false;\n        notify();\n    }\n}\n```\n\n`trainSwitch`\
  \ 类有两个同步方法，`lock` 和 `unlock`，它们保护该类的 `inUse` 变量。我们想要确保在任何给定时刻只有一个线程在使用道器。道器的状态设置在一个布尔变量中。当列车使用道器时，`inUse`\
  \ 被设置为 true。任何其他想使用道道的列车都必须等待直到布尔变量被重置为 false。\n\n在示例 11-7b 中使用了两个新方法 `wait` 和 `notify`。它们为了两个目标。\n\
  \n它们的第一个任务是解决一个棘手的情况。如果在上面的示例中缺少 `wait` 语句会发生什么？阻塞程序将处于循环中并占用 `class` 的监视器。然后没有人能成功调用\
  \ `unlock` 方法，而该方法也需要监视器。\n\n使用 `wait` 和 `notify` 方法是为了解决这个问题。`wait` 方法让流等待某些事件。同时，监视器被释放。这允许你执行其他需要类监视器的程序。当控制从\
  \ `wait` 方法返回时，监视器也会恢复。`wait` 和 `notify` 方法不是 `Thread` 类的一部分。事实上，它们包含在 `java` 中。\n\
  \n#### 示例 11-7d. 修正后的模型。\n\n```java\nclass train2 extends Thread {\n    int seq=15;\n\
  \    int switchLoc=10;\n    int switch2Loc=5;\n    int trainLen=3;\n    Display\
  \ display;\n    trainSwitch ts;\n\n    train2(String name, Display display, trainSwitch\
  \ ts) {\n        super(name);\n        this.display = display;\n        this.ts\
  \ = ts;\n    }\n\n    public void step() {\n        if (seq == switchLoc + one)\
  \ {\n            // occupied way\n            System.out.println(\"Locking switch:\
  \ \" + ts.getName());\n            ts.lock();\n        } else if (seq + trainLen\
  \ == switch2Loc) {\n            // freed way\n            System.out.println(\"\
  Unlocking switch: \" + ts.getName());\n            ts.unlock();\n        }\n   \
  \     seq--;\n    }\n\n    public void run() {\n        while (seq > 0) {\n    \
  \        step();\n            display.show(getName(),seq);\n            yield();\n\
  \        }\n        System.out.println(getName() + \" safe\");\n    }\n}\n```\n\n\
  在最后一个代码段中，我们修改了 `step` 方法以使用我们自己的 `trainSwitch`。当我们落在道器时，请求阻塞。获得锁后，我们可以进入道路。当列车的结尾离开道路时，我们可以解锁道器。这些操作确保在某一点只有一列车在路上。以下是修正后程序的输出。注意，两列列车通过道器时没有发生事故：\n\
  \n```\ntrain1 near switch @ 14  train2 near switch @ 14  train1 near switch @ 13\
  \  train2 near switch @ 13  train1 near switch @ 12  train2 near switch @ 12  train1\
  \ near switch @ 11  train2 near switch @ 11  train1 @ 10\nLocking Switch: train1\
  \ @ 10\nLocking Switch: train2 @ nine\ntrain1 @ 8\ntrain1 @ 7\nUnlocking Switch:\
  \ train1@6\ntrain2 @ 10\ntrain1 @ five\ntrain2 @ nine\ntrain1 @ 4\ntrain2 @ 8\n\
  train1 @ 3\ntrain2 @ 7\nUnlocking Switch: train2 @ 6\ntrain2 6 five\ntrain2 6 4\n\
  train2@3 train1 safe train2 safe\n```\n\n到目前你应该理解了监视器的基本概念。在接下来的章节中我们将考虑另一种类型的问题。\n\
  \n### 信号量：保护其他公共资源\n\n在之前的示例中，我们使用监视器来保护变量。让我们在考虑任何通用资源之前扩展这个概念。我们想要保护任何被多个线程共享的资源系统。公共资源的一个例子是文件。两个线程同时写入同一个文件会产生垃圾；一个线程正在读取文件而另一个线程正在写入文件的情况也太危险了。我们需要某种方式来保护我们文件的完整性。\n\
  \n\n\n为了保护文件，你可以应用类似于我们在上一个示例中保护铁道道器的概念。这种保护被称为 `exceptional`（互斥）阻塞。在某一时刻，可能只有一个流可以进行读取或修改操作。当我们处理文件时，尤其是信息库文件数据时，通常的读取次数多于写入次数。我们可以利用这一事实来优化代码。\n\
  \n假设我们有一个员工数据库。它包含地址和电话号码等信息。这些值有时会改变，但更多时候是被读取的。我们需要保护数据不被失真，但又希望程序尽可能高效。我们不再只使用互斥锁，而是使用读锁和写锁。我们可以拥有任意数量的读者，但当有人想向文件写入某些内容时，他们必须获取互斥锁。这个概念被称为信号量（`semaphore`）。\n\
  \n创建这个 `semaphore` 需要什么？我们希望允许流自由读取文件，但假设当某个线程想要更改信息时，它应该成为唯一与基础数据流工作的线程。\n\n###\
  \ 信号量状态\n\n我们的信号量有四种状态。在第一种状态——空状态下，没有线程读取或写入信息。我们可以接受读取和写入请求，并且它们可以立即被处理。第二种状态是读取状态。在这里，有若干线程正在从数据库读取。我们统计读者的数量，如果该数量变为零，我们就返回空状态。写入请求必须等待。我们只能从空状态进入写入状态。所有读取线程都必须完成，且不能有其他流向文件写入。任何关于读取或记录的请求都应该等待此流完成。任何能够执行的流必须等待处于写入状态的线程终止后退出这些状态。当写入请求完成后，我们返回空状态。当发送了通知消息后，等待的线程就可以被处理。下面是提供此\
  \ `semaphore` 的代码。\n\n#### 示例 11-8a. Semaphore\n\n```java\nclass Semaphore {\n \
  \   final static int EMPTY = 0;\n    final static int READING = one;\n    final\
  \ static int WRITING = 2;\n    protected int state=EMPTY;\n    protected int readCnt=0;\n\
  \n    public synchronized void readLock() {\n        if (state == EMPTY) {\n   \
  \         state = READING;\n        } else if (state == READING) {\n        } else\
  \ if (state == WRITING) {\n            while(state == writing) {\n             \
  \   try wait();\n                catch (InterruptedException e);\n            }\n\
  \            state = READING;\n        }\n        readCnt++;\n        return;\n\
  \    }\n\n    public synchronized void writeLock() {\n        if (state == EMPTY)\
  \ {\n            state = WRITING;\n        } else {\n            while(state !=\
  \ EMPTY) {\n                try wait();\n                catch (InterruptedException\
  \ e);\n            }\n        }\n    }\n\n    public synchronized void readUnlock()\
  \ {\n        readCnt--;\n        if (readCnt == 0) {\n            state = EMPTY;\n\
  \            notify();\n        }\n    }\n\n    public synchronized void writeUnlock()\
  \ {\n        state = EMPTY;\n        notify();\n    }\n}\n```\n\n`Semaphore` 类实现了我们刚刚描述的\
  \ `semaphore`。它使用了用 `synchronized` 关键字声明的方法，以及 `wait` 和 `notify` 方法。这个类可以用来保护公共资源。我们现在可以使用这个类来保护我们对文件的访问。让我们用几个读取和写入流来测试我们的信号量。\n\
  \n#### 示例 11-8b. Test semaphore\n\n```java\nclass process extends Thread {\n   \
  \ String op;\n    Semaphore sem;\n\n    process(String name, String op, Semaphore\
  \ sem) {\n        super(name);\n        this.op = op;\n        this.sem = sem;\n\
  \        start();\n    }\n\n    public void run() {\n        if (op.compareTo(\"\
  read\") == 0) {\n            System.out.println(\"Trying to get readLock: \" + getName());\n\
  \        }\n        sem.readLock();\n        System.out.println(\"Read op: \" +\
  \ getName());\n        try sleep((int)Math.random() * fifty);\n        catch(InterruptedException\
  \ e);\n        System.out.println(\"Unlocking readLock: \" + getName());\n     \
  \   sem.readUnlock();\n        } else if (op.compareTo(\"write\") == 0) {\n    \
  \        System.out.println(\"Trying to get writeLock: \" + sem.writeLock());\n\
  \            System.out.println(\"Write op: \" + getName());\n            try sleep((int)Math.random()\
  \ * fifty);\n            catch(InterruptedException e);\n            System.out.println(\"\
  Unlocking writeLock: \" + sem.writeUnlock());\n        }\n    }\n}\n\nclass testSem\
  \ {\n    public static void main(String argv[]) {\n        Semaphore lock = new\
  \ Semaphore();\n        new process(\"1\", read, lock);\n        new process(\"\
  2\", read, lock);\n        new process(\"3\", \"write\", lock);\n        new process(\"\
  4\", read, lock);\n    }\n}\n```\n\n`testSem` 类启动了四个想要读取或写入的线程。以下是输出：\n\n```\nTrying\
  \ to get readLock: 1\nRead op: 1\nTrying to get readLock: 2\nRead op: 2\nTrying\
  \ to get writeLock: 3\nTrying to get readLock: 4\nRead op: 4\nUnlocking readLock:\
  \ 1\nUnlocking readLock: 2\nUnlocking readLock: 4\nWrite op: 3\nUnlocking writeLock:\
  \ 3\n```\n\n在示例 11-8 中，我们有三个读取线程和一个写入线程。注意数据库可以被多个读者同时访问，但当有人向文件写入时，他们必须获取互斥访问。我们的示例展示了实现\
  \ `semaphore` 的有效方法。\n\n如果你对信号量感兴趣或需要执行文件锁，可能需要进一步学习。信号量是复杂的主题。大多数程序员不需要与它们打交道。但你可以将这些问题与多流问题进行比较。\n\
  \n### 防止死锁\n\n现在你可以同步多个线程的工作并确保保护公共资源。你开始尝试多个流——突然系统挂起了。没有响应。你重新执行代码，它运行良好。两周后，挂起再次发生。你成了死锁问题的受。\n\
  \n死锁是一个容易解释但难以避免的概念。想象你在行道上走。有人挡路，你向左侧避。为了避开你，迎面而来的行人向右侧避。你们再次面对面。现在你向右侧避，他向左侧避……如此循环。这种情况被称为死锁。\n\
  \n这种尴尬的情况对于反方向走的人来说足够简单——假设你正向左边走，迎面而来的行人也向左边走，你们错过了。如果我们能把人类大脑放入计算机来阻塞计算机这种情况，我们就有出路了。遗憾的是，尖端技术还没有达到这一水平。\n\
  \n但这如何影响 Java 编程呢？将行道上的人替换为流。假设我们有两个保护资源文件 1 和文件 2。假设为了完成任务线程需要这两个资源。第一个线程获取了文件\
  \ 1。在同一时刻第二个流捕获了文件 2。第一个流现在尝试夺取文件 2，但未\n\n\n\n也许他的接收挂起了它的性能并开始等待。第二个流也尝试获取 `file1`\
  \ 并开始等待。因此，我们有两个线程在等待它们永远无法获得的资源。由于没有线程可以同时获取完成工作所需的两个文件，它们将无限地等下去。这是一个经典的死锁局面。\n\
  \n我们可以通过两种方式来处理死锁。如你所知，“防病胜于治疗”。我们必须尽一切努力避免这种情况的发生。我们需要设计我们的流，以便我们知道它们是如何获取竞争性资源的。让我们设计每个线程首先访问\
  \ `file1`。第一个线程将获取该文件，而第二个线程将等待。然后，第一个线程可以获取 `file2`，执行必要的操作并释放这两个资源。在这种情况下，决策变得简单了。\n\
  \n但要避免某些死锁要困难得多。有时情况如此困难，面对死锁，还有什么更好的办法处理它，并通过各种方式尝试发现它呢？我们可以启动一个监控其他线程的流；如果它认为任务没有进展，它将尝试识别问题。解决问题通常会强制一个或多个线程释放受保护的资源。新释放的资源可能允许其他线程完成操作并释放资源，这可能会解除程序的阻塞。\n\
  \n如果这一切看起来很复杂，那仅仅是因为它真的很困难。如果你打算在多个资源上进行实验，请准备好读一些教科书。让我提供一个建议：避免阻塞多个资源的需求。这就是问题开始的地方。每个线程所需的资源数量越多，问题就越困难。\n\
  \n## 变量 volatile\n\n本章的最后一个主题是 `volatile` 变量修饰符，大多数程序员将不会面对它。让我们阅读 Java 的官方语言定义，然后尝试理解它的含义：“用\
  \ `volatile` 修饰符声明的变量已知会发生异步变化。警告编译器在使用此类变量时需要更加小心。”要理解此处语境下副词“彻底”（thoroughly）的使用，你应该对\
  \ Java 虚拟机有良好的理解。它基本上意味着变量将为每个链接被重新定义。Java 奇异地为多个流缓存变量，而修饰符通知 Java 停止这样做。\n\n什么是\
  \ `volatile` 变量？假设你有一个变量在内存中是真实的，但实际上它的含义会发生变化。原生生物示例——关于线路上是否存在载波的调制解调器信号。当你连接时会发出该信号。由于这个变量是由外部源更改的，它被视为\
  \ `volatile`。此值在两次操作之间可能会变化，这在某些情况下可能会导致错误，因此我们希望编译器在每次调用 `volatile` 变量时重新加载该值。\n\
  \n如果你不使用原生（`native`）方法，并且不访问硬件寄存器或其他变化的数据，那么对你来说，可能永远不需要将变量定义为 `volatile`。Java 代码无法直接访问内存块，因此对\
  \ `volatile` 变量的特殊需求将非常罕见。\n\n# 接下来？\n\n你现在应该对 Java 中的多线程非常熟悉了。我们讨论了在 Java 编程时出现的一些最困难的问题。在下一章中，我们将讨论如何创建\
  \ Java 程序来克服 applet 的某些限制性。虽然我们开发的程序不像 applet 那样可移植，但你可以访问文件系统并集成到你的程序语言 C 代码中。\n\
  \n在这种情况下，我们会有出路。遗憾的是，目前的技术水平尚未达到这一水平。\n\n## 第 12 章\n\n![](img/image09293.jpeg)\n\
  \n框架模型后的 applet 程序\n\n从 applet 到独立应用程序 Java 图形化应用程序基础 访问文件系统\n\n依赖机器的方法\n\n需要时依赖机器的库\
  \ 解释依赖机器的方法 训练 C 库\n\n## 从 applet 到独立应用程序\n\n现在已经知道了构建 Java 包所需的，，可以使用不需要 Web 浏览器即可运行的应用程序。我们已经在第\
  \ 7 章中为 applet 开发了图形用户界面（GUI）。现在让我们看看如何在独立的 Java 程序中创建相同的 GUI，以及如何在这些新程序中使用它们。\n\
  \n\n\n\n让我们的独立应用程序像我们在第 8 章中创建的 applet 一样友好且直观，这并不困难。我们需要的只是在 `main` 方法中或其中一个方法中直接创建\
  \ frame 并调用它们即可。\n\n下面简化的程序使用了第 8 章中开发的 `frame2`。但 `Frame2` 并不位于 applet 中，而是我们独立应用程序\
  \ `sampleStand` 的一部分：\n\n```java\nimport java.awt.*; \nimport Frame2;\nclass stand\
  \ Alone {\n    public static void main(String S[]) {\n        Frame2 f2 = new Frame2();\n\
  \        f2.show();\n    }\n}\n```\n\n在第 7 章和第 8 章中，我们学习了抽象窗口工具包 (`AWT`）。你对 `AWT`\
  \ 的了解已经足够编写一个独立的图形应用程序了。通过在 `Applet` 类中创建子类，我们可以从互联网获取图形和声音数据。遗憾的是，如果不自己实现 `main`\
  \ 方法，就无法为我们的独立应用程序获取并播放声音片段。我们可以使用 `toolkit` 类从互联网获取图形数据。\n\n`Toolkit` 类是一个抽象类，它通常充当\
  \ `AWT` 与本地窗口系统之间的桥梁。该类中使用的方法可能对我们用，因为它们只在将 `AWT` 与特定平台链接时有效。然而，对重要的是该类定义了一个 `getImage`\
  \ 方法，它的工作方式与我们已经习惯的方法完全相同。要从我们的独立应用程序获取图像，可以在任何子类 frame 中使用以下程序（这里 `U` 代表 `URL`）：\n\
  \n```java\nToolkit T = getToolkit(); \nImage I = T.getImage(U);\n```\n\n现在，除了播放声音片段外，我们可以在独立应用程序中做\
  \ applet 能够做的一切事情。由于我们的 Java 应用程序不是不可靠的 applet，我们还可以引用本地文件系统。例如，你可以使用下载的 `getImage`\
  \ 方法，通过传递描述文件路径的字符串 (`String`) 来直接从文件系统传输图形数据：\n\n```java\nString S = myImage.gif;\n\
  Toolkit T = getToolkit();\nImage Internet = T.getImage(S);\n```\n\n与之前的 `getToolkit`\
  \ 方法示例一样，我们必须在组件子类中执行此操作。我们的 `getImage` 方法会在当前目录本地文件系统中查找文件 `myImage.gif`。\n\n`java.awt`\
  \ 包中的 `FileDialog` 类实例化了一个允许用户浏览文件系统的对话框。该类对 applet 是关闭的；因为完全没有必要访问其被上传的宿主机的文件系统。但由于我们的独立应用程序足够可靠，可以安装在宿主机上，我们现在可以使用\
  \ `FileDialog` 类进行编程。它的方法和构造函数在表 12-1 中。\n\n### 表 12-1. FileDialog 类\n\n| 项目 | 描述\
