  \n`getText()` 返回文本注释。\n\n`paramString()` 返回字符串参数注释。\n\n`setAlignment(int)` 设置注释的模式对齐。\n\
  \n`setText(String)` 设置文本注释。\n\n# 接下来做什么？\n\n在本章中，我们已经介绍了适用于 applet 的用户界面主要组件。在下一章中，我们将利用所学知识，开始探索更复杂的组件，并讨论一些通用的用户界面设计和布局。\n\
  \n## 第 8 章\n\n![](img/image09249.jpeg)\n\n关于用户界面\n\nApplet 外观 编程容器\n\n面板 窗口 菜单\n\
  \n字体\n\n度量字体管理器适配\n\nFlowLayout BorderLayout GridLayout CardLayout GridBagLayout\n\
  \n选择器适配\n\n确定当前位置的大小示例\n\n使用框架的设计：FlowLayout\n\n对话框 applet：BorderLayout\n\n来自面板的\
  \ applet：BorderLayout\n\n相同大小的项目：GridLayout 动态组件变化：CardLayout 确切位置：GridBagLayout\
  \ 附加菜单：CardLayout\n\n开发界面程序是一项负责且非常困难的任务。Java 开发工具包包含的工具旨在组织程序的界面，将帮助你成功地解决这个问题。这些工具允许你自由地在屏幕上放置元素，而无需指定它们的精确坐标和大小。这种方法的好处不仅在于开发者不需要浪费宝贵的时间去计算像素数量类似的低级参数，而且这样编写的界面在不同平台上看起来大体相同。当然，在细节上，程序在不同平台上的外观会有所不同，因为这些小细节高度取决于操作系统，甚至更取决于图形外壳（例如，open\
  \ win、Windows 95 或 Macintosh）。\n\n创建自定义界面最有价值的 JDK 工具之一是一组用于界面元素视觉组织的布局管理器。适配管理器是任何\
  \ applet 必不可少的；即使在第 7 章中与你熟悉了界面主要元素的简单 applet 中，默认也使用了布局管理器。\n\n在本章中，我们将讨论所有现有的布局管理器以及屏幕元素容器，包括面板（panels）、对话框（dialogs）和框架（frames）。在这里，你还将学习如何在你的\
  \ applet 中嵌入菜单，获取系统可用字体列表，并为单个界面元素安装字体。本章中的示例还使用了用于将一种货币转换为另一种货币的 applet（我们在第 7\
  \ 章中处理过它），但在这里我们将为它添加许多新功能，并通过使用更复杂的界面组件以及对其放置和布局来显著改进其外观。\n\n# 编写外部类型 applet\n\n\
  在程序中开始设置 applet 外观之前，建议先画出它的屏幕界面（或至少在脑海中想象这样一个草图）。这将使编写代码变得容易得多，并告诉你最方便将组件添加到代码中的顺序。此外，这样的草图将允许你理解哪些组件组最适合使用面板——一种包含其他界面组件的特殊容器——进行组合。\n\
  \n你的 applet 可能会使用窗口，该窗口无法从浏览器窗口连接：\n\n- 出于目的，你可以使用包含你的 applet 某些界面元素的框架或对话框。创建多个窗口还将让你在界面中更好地显示\
  \ applet 的逻辑结构，将其界面划分为块，每个块如果不再需要，用户可以将其移除或最小化。例如，在将在第 18 章中开发的客户端服务器教育程序中，用户列表不需要永久显示在屏幕上，因此将其放在显示在屏幕上的单独框架中。\n\
  \n熟悉列表后，用户将能够通过简单地关闭窗口来收起它。\n\n屏幕元素的选择适配是一项需要权衡方法的负责任务，特别是对于相当复杂的 applet 而言。如果你的\
  \ applet 为用户提供了许多选项和控件，并显示了许多异构信息，至少应该比较几种适配方案，尝试选择一个能让 applet 运行尽可能舒适和直观的方案。例如，提供版本信息、目的和作者的\
  \ applet，最好是使用“帮助”菜单项，因为任何有经验的用户都会恰好在那里搜索这些信息。\n\n在设计界面时，你应该尝试把自己置于对计算机和互联网知识最少的典型用户的立地。例如，一个想要查看帮助系统的典型用户会在窗口左上角搜索相应的菜单，这就是为什么明明的做法是恰好将其放在那里。必须遵循的界面构建传统，，不会以任何方式限制你作为设计者的创作自由。尽管对用户友好应该放在第一位（只要你预计会有你以外的人使用你的\
  \ applet），但它不会阻碍你在 applet 设计中投入某些原创性。\n\n# 容器\n\n为了组合相关的控件，Java API 提供了三种类型的容器：面板（panels）、对话框（dialogs）和框架（frames）。所有容器都是\
  \ Component 类的子类，并用作包含其他界面元素的复合对象。在复杂界面的情况下，容器还允许相对于彼此以不同的方式排列元素组。例如，一组带有关联按钮的复选框或开关可以组合在一起，并相对于另一个界面元素以某种方式放置——例如编辑字段。\n\
  \n## 面板\n\n\n\n\nPanel（面板）是 Java 中常用的容器类型。因此，在上述包含一组复选框和一个按钮的示例中，使用 `panel` 是最方便的。`panel`\
  \ 是一个直接属于 `Container` 类的对象。`Panel` 可以被放在另一个容器（例如 `frame`）内部，也可以直接放在 Web 浏览器窗口中。当你的界面包含大量元素时，将具有相同含义的元素组合在帮助面板（help\
  \ panels）中是有意义的。\n\n面板还可以有它自己的布局管理器，且该布局管理器独立于包含此 `panel` 的容器的布局管理器。例如，假设我们使用简单的\
  \ `FlowLayout` 布局管理器来创建一个包含各种尺寸组件的 `frame`。现在，你需要在这个 `frame` 中放入一组五个相同大小的按钮。这可以通过将这些按钮排列在\
  \ `panel` 中并在其中应用 `GridLayout` 布局管理器（该布局器专门用于布局具有相同尺寸元素）来快速、方便地完成，然后将完成的 `panel`\
  \ 放置在 `frame` 中。\n\n# Window（窗口）\n\n`Window` 和 `panels` 一样，都是通用的类容器。但与 `panels`\
  \ 不同的是，Java 中的 `window` 实际上是一个窗口——一个操作系统对象，独立于窗口浏览器 Web 或查看器 applet 存在。\n\n`Window`\
  \ 类从不被直接使用，只有三个子类被使用：`Frame`、`Dialog` 和 `FileDialog`。这些子类中的每一个都包含了原始类窗口的所有功能，并为其添加了几个特定属性。例如，`Frame`\
  \ 类实现了一个菜单容器，允许你为创建的 `frames` 添加一个菜单栏。正如预期的那样，所有窗口都具有最小化、最大化和销毁的标准按钮，以及控制菜单（control\
  \ menu）。此外，所有窗口都有面板标题，你应该在创建窗口实例时填充该内容。\n\n## Frames（帧）\n\n`frame` 是一个可以在不与任何 Web\
  \ 浏览器窗口连接的情况下存在的对象。使用 `Frame` 类，你可以实现一个独立 applet 的界面。`frame` 创建后，它会呈现一个空窗口，你应该在其中根据需要添加界面组件。\n\
  \n`Frames` 可以包含任何用户界面元素。是的，在我们章将处理的货币转换 applet 示例中，所有的用户界面都被封装在帧。`Frames` 也可以为单个界面组件创建（例如，点击\
  \ Web 浏览器窗口中的按钮打开的用户列表，我们将在第 18 章看到这种帧的使用）。通过创建 `frame`，你还可以为展开、最大化和销毁窗口的点击事件提供处理程序，这些按钮会自动添加到创建窗口的标题栏上。除了这些，`frames`\
  \ 是 `MenuContainer` 类的实现类，允许在窗口菜单栏中添加。`Menu` 和 `MenuContainer` 类将在本章稍后进行讨论。\n\n\
  ## Dialogue window（对话窗口）\n\n`Dialogs` 主要用于向用户请求一次性信息，或在屏幕上输出小部分信息。所有的 `Dialogue`\
  \ 窗口与 `frames` 类似，但有两个重要的区别：第一，它们不是 `MenuContainer` 的实现类；第二，它们可以具有模态（modality）——这意味着你可以构造一个对话框，防止用户访问其他窗口（包括\
  \ Web 浏览器窗口），直到用户在该对话框中执行了所需的操作（例如，按下 `button`）。\n\n在创建 `dialogue` 窗口时，通过调用构造函数的特殊参数来指定其模态。因此，对话框让你选择是允许用户继续工作（而不将注意力转回对话窗口），还是根据其对窗口内消息的特殊反应做出要求。\n\
  \n`Dialogue` 窗口适合邀请用户执行某些操作并确认用户已阅读程序消息。`Dialogue` 窗口与 `frames` 不同，它们不会自动实现菜单栏。因为\
  \ `dialogue` 窗口通常比 `frames` 小，它们便于与用户进行快速对话。\n\n在处理对话框工作时，记住一个规则非常重要：每个对话框必须以一个\
  \ `frame` 为父级。这意味着对话框不能直接从主 applet 窗口或 Web 浏览器窗口打开。要创建 `dialog box`，你必须先创建一个 `frame`，即使它的唯一目的是充当对话框的父级。只有当你的\
  \ applet 已经在使用 `frames` 时，你才能跳过这个准备阶段。创建一个作为对话框父级的空 `frame` 的示例，你可以在本章的“Dialog applet:\
  \ `BorderLayout`”部分找到。\n\n## File dialogues（文件对话框）\n\n文件对话框不能在 applet 中使用，因为它仅用于直接在程序查看\
  \ applet 或解释器命令行 `java` 中运行的程序。此对象用于通过流类传递加载或保存的文件描述符。有关文件对话框的更多信息，请参见第 12 章，“Programming\
  \ behind applet model framework”。\n\n# Menu（菜单）\n\n菜单长期以来一直是现代程序的标准接口元素。在 Java 中，`menu`\
  \ 特别方便于与布局管理器之一——`CardLayout` 结合使用，它允许你实现一个动态界面（参见“添加菜单：CardLayout”）。Java 中的菜单会产生事件，程序员为这些事件创建处理程序——这样处理菜单就不应是困难的。`MenuBar`\
  \ 和 `Menu` 类允许你构建舒适的菜单并将其集成到 applet 中。\n\n你创建的所有 `frames` 自动实现 `MenuContainer` 类。也许是因为\
  \ `frame` 具有交互性。正这为什么 `frame` 是唯一自动实现 `MenuContainer` 类的容器，尽管理论上菜单可以被添加到任何容器中。\n\
  \n### Addendum menu in applet（在 applet 中添加菜单）\n\n单独的下拉菜单被添加到面板菜单——一个 `menubar` 类对象中，随后将该对象添加到相应的\
  \ `frame` 中。首先，我们需要创建一个 `MenuBar` 实例。之后，我们创建 `Menu` 类的实例并向它们添加命令。\n\n```\n(Images/09250.jpeg)\n\
  ```\n\n### Panel menu（面板菜单）\n\n首先，创建一个名为 `Bar` 的 `MenuBar` 类新对象：`MenuBar Bar = new\
  \ MenuBar();`\n\n使用以下方法将菜单添加到的菜单中：`bar.add(m);`\n\n参数 `m` 代表一个 `Menu` 类对象。添加到面板菜单的菜单按照程序中指定方法的调用顺序排列。若要从菜单栏中移除菜单，使用\
  \ `remove` 方法。另一种可能性是将其中一个菜单的状态设置为“帮助菜单”，其执行方式如下：\n\n`setHelpMenu(m);`\n\n`setHelpMenu`\
  \ 方法通过将 `m` 菜单移动到面板右侧（与其他菜单隔离开）将其转换为帮助菜单。请注意，在调用 `setHelpMenu` 之前，你必须先将菜单添加到面板。此外，不要忘记\
  \ `setHelpMenu` 方法是 `MenuContainer` 类的一部分，其实现是 `Frame` 对象。如果你想在帧代码之外调用此方法，你需要编写类似的代码：\n\
  \n```\n(Images/09251.jpeg)\nframeNameInstantiation.setHelpMenu(m)\n```\n\n\n\n最后，US\
  \ 仍然使用实例菜单栏的框架。这是通过 `setMenuBar` 方法实现的，它与 `setHelpMenu` 一样，属于 `Frame` 类：`setMenuBar(Bar)`。\n\
  \n此操作符允许将指定的面板菜单添加到当前框架中。规则是，此方法的调用放置在创建菜单代码的最末尾：首先创建一个 `MenuBar` 类的实例，然后创建 `Menu`\
  \ 容器，接着将命令添加到已创建的菜单，只有在完成所有这些操作后，将创建的菜单添加到面板菜单中。\n\n### 菜单创建命令\n\n在创建菜单时，你必须为每个下拉菜单实现\
  \ `Menu` 类，并为菜单中的每个命令实现 `MenuItem` 类。新菜单的声明格式如下：`Menu m = new Menu(\"Operation\"\
  );`\n\n在这里我们创建了一个标题为 `Operation` 的新菜单，并将其保存在变量 `m` 中。\n\n由于对象的标题就足够访问对象（例如，菜单的标题或命令文本），我们可以将创建新命令并添加到菜单的步骤合并：\n\
  \n```m\nm.add(new MenuItem(\"Adjust Ratio\"));\n```\n\n该语句创建了一个文本为 \"Adjust Ratio\"\
  \ 的新菜单命令，并立即将其添加到菜单 `m`。另一个有趣的功能是声明“可拆卸”（tear-off）菜单。这意味着该菜单在松开鼠标按钮后仍保持打开状态。使用以下构造函数创建下拉菜单：\n\
  \n```\nnew Menu(\"Operation\", true);\n```\n\n按照从上到下的方向向菜单添加项。你还可以使用 `addSeparator`\
  \ 方法在菜单启用水平分隔线，该方法会在分隔菜单的当前位置插入分隔符。此外，得益于 `Menu` 类是 `MenuItem` 类的总扩展类这一事实，你可以创建嵌套菜单。\n\
  \n只需创建一个 `Menu` 的新实例，并像你之前添加项的那样将其添加到另一个菜单中即可。我们将在 Java 课程商店中使用嵌套菜单（参见第 17 节）；嵌套菜单的外部视图如图\
  \ 8-1 所示。\n\n![](img/image0925.gif)\n\n图 8.1。\n\n### 菜单事件处理\n\n当用户选择菜单中的任一个命令时，它会产生相应的事件。程序对该事件以及任何其他事件的反应，是通过安装相应的处理器来确保的。因此，在本章的“添加菜单：CardLayout”小节的示例程序中，我们将进行如下检查：\n\
  \n```\nif ((evt.id == Event.ACTION_EVENT) && (evt.target==m))\n```\n\n该语句检查捕获的事件是否为动作事件（action\
  \ event），以及目标（target）是否为名为 `m` 的开发对象 `Menu`。之后，我们可以通过查看事件参数来确定选择了哪个命令：`(String)evt.arg`\n\
  \n现在，此参数可以与包含给定菜单中所有命令文本的队列进行比较，以找出用户选择了这些命令中的哪一个。\n\n# 字体\n\n在本章的许多示例中，你和我都必须为输出信息设置字体。因此，是时候了解一下这方面的可能性了。AWT\
  \ 提供了这些功能。使用的主要方法——`setFont` 方法——属于 `Component` 类而不是 `Font` 类。得益于此，我们不仅可以为每个组件单独更改字体，还可以让相关组件组从通用父对象继承字体参数。`new\
  \ font` 构造函数如下：\n\n```\nnew Font(String name, int style, int size);\n```\n\n在这里，`name`\
  \ 是字体名称，`size` 是其以磅（points）为单位的大小，而参数 `style` 可以取以下值之一：`PLAIN`、`BOLD` 或 `ITALIC`。创建此类字体实例是必要的，以便你可以将此字体安装其中一个组件。创建的字体副本可以重复使用。但在排序字体之前，你需要确保它在用户平台上可用且\
  \ Web 浏览器可以使用（参见侧边栏“获取字体列表”）。有了字体列表后，小程序将能够决定在给定平台上使用哪些字体。\n\n# 字体度量\n\n对于每个字体，小程序都可以获取特定的度量信息（metrics），特别是任何符号的宽度和高度。了解字体度量，可以为其他组件和容器本身选择尺寸，确保文本标签相对于其他元素的正确定位。例如，`FontMetrics`\
  \ 类方法 `stringWidth` 用于回答这个问题：“使用指定字体指定的质量参数行将占据多少水平空间？”：\n\n```java\nFont MyFont\
  \ = new Font(\"Helvetica\", Font.PLAIN, 12);\nFontMetrics MyFontMetrics = new FontMetrics(\
  \ MyFont );\nint pixelSizeOfString = MyFontMetrics.stringWidth(\"Hello\");\n```\n\
  \n此示例查询了字符串 \"Hello\" 在字体 `MyFont`（定义为 Helvetica 粗体 12 磅）中占据多少空间。执行这些语句后，变量 `pixelSizeOfString`\
  \ 将包含将此行输出到屏幕所需的像素数。\n\n# 布局管理器\n\n最简单的布局管理器是 `FlowLayout` 和 `GridLayout`，更复杂的是\
  \ `BorderLayout`、`CardLayout` 和 `GridBagLayout`。默认情况下，小程序窗口和所有创建的面板使用 `FlowLayout`\
  \ 管理器，而框架和对话框使用 `FlowLayout` 管理器 `BorderLayout`。\n\n以下是这些布局管理器的描述，以及它们在章后半部分工作示例中使用的概述。\n\
  \n![](img/image09253.jpeg)。\n\n## FlowLayout\n\n\n\n\n你已经熟悉最简单的布局管理器 - `FlowLayout`\
  \ 的活动结果。该管理器在货币转换小程序中作为默认管理器工作。该管理器的工作原理非常非常简单，可以归纳为：每个新添加的组件都放置在当前水平行中，如果该行仍有空间；否则，组件将向下移动并开始下一行水平行。因此，除了最后一行外，每一行都包含了当前容器宽度下能容纳的多个组件。每行的内容都居中，然后向容器的左、右边缘对齐。如果你先使用\
  \ `<APPLET>` 标签的 `HEIGHT` 和 `WIDTH` 属性计算出程序在 HTML 页面上分配区域的大小，这种算法可以让你获得相当专业的视觉效果。例如，如果你知道按钮的精确尺寸，可以设置小程序的宽度，使得按钮能够垂直排列。然而，通常尝试使用此管理器来实现美观的布局需要花费太多精力，这从长远来看是不划不入的，因为容器的任何缩放调整都会破坏精心构建的结构（例如，我们示例中的一列按钮可能会变成几行按钮）。\n\
  \n## BorderLayout\n\n我们将在本章提供的示例小程序中熟悉这种布局管理器。该管理器在添加新组件时需要指定一个可选参数，该参数可以取以下值之一：`South`\
  \ (\"South\")、`North` (\"North\")、`West` (\"West\")、`East` (\"East\") 和 `Center`\
  \ (\"Center\")。前四个参数导致 `BorderLayout` 管理器将添加的组件引用容器的相关边缘——底部、顶部、左侧或右侧。`Center` 参数允许你指定该组件占据容器剩余区域。因此，使用\
  \ `Center` 参数添加的元素将改变其尺寸，填充不占用其他组件的空间。\n\n`BorderLayout` 管理器是最常用的，因为它非常实用且易于使用，并提供了放置屏幕元素的方法，这对于大多数情况都是足够的。`BorderLayout`\
  \ 能够考虑到组件的大小差异，并尝试尽可能地利用容器空间 - 即浏览器窗口、框架或对话框窗口。\n\n## GridLayout\n\n`GridLayout`\
  \ 管理器对于排列图形元素特别有用，并允许轻松地实现组件的、均匀放置。该管理器创建一个由相同大小的正方形组成的网格，每个网格包含一个组件。我们将在第 18 章的课程中使用此管理器来构建一个棋盘。棋盘上用此管理器创建的每个棋格都包含一个画布（`Canvas`），而画布又可以包含一张棋子。使用此管理器时，新组件按照从左到右、从上到下的方向添加。\n\
  \n## CardLayout\n\n这种布局管理器允许你在程序运行期间直接更改屏幕上显示的组件集。`CardLayout` 管理器在处理面板工作时特别方便。\n\
  \n`CardLayout` 管理器允许你动态控制添加到容器的组件的显示。组件必须与类中定义的特殊方法关联 - `next`、`previous` 和 `show`\
  \ 方法。程序员可以启动任意数量的组件，然后通过调用这些方法，将它们按顺序一个接一个或按随机顺序输出到屏幕上。在本章的“动态更改组件：CardLayout”部分中，我们将使用\
  \ `CardLayout` 管理器在两个包含小程序货币金额计算组件的面板之间切换。其中一个面板将包含一个显示当前转换率的字段以及一个允许你更改该值的滚动条，而在另一个面板中是货币金额的输入和输出字段。这些面板将同时显示，但轮换。\n\
  \n## GridBagLayout\n\n最复杂的布局管理器是 `GridBagLayout`。它使用了最先进的算法来响应容器缩放，并允许你实现一个复杂的界面，其中容器包含许多不同尺寸的组件，其中某些组件相对于其他组件应该处于同一个位置，且具有完全相同的体积。当你使用此管理器时，必须使用\
  \ `setConstraints` 方法为每个组件指定位置参数。方便的方法是为每个组件创建一个 `gridBagConstraints` 类的实例，这将允许独立于其他组件地更改该组件的位置。`gridBagConstraints`\
  \ 实例将由设置了 `GridBagLayout` 布局管理器的容器使用，尽管在本章稍后的小程序示例中（参见“精确放置：GridBagLayout”部分），我们将为不同的组件使用同一个\
  \ `gridBagConstraints` 实例。这里是使用此管理器时可以设置的放置限制列表：\n\n- `gridx`, `gridy`：允许你创建一个单元格来放置组件，并指定其坐标，位于容器左上角的单元格将具有坐标\
  \ `gridx=0`, `gridy=0`。通过使用 `GridBagConstraints.RELATIVE` 值（这是默认含义），你可以指定新组件的放置不是相对于容器的左上角，而是相对于直接添加到容器的组件\
  \ - 紧邻相邻的右侧（针对 `gridx`）或下方（针对 `gridy`）。\n\n- `gridwidth`, `gridheight`：这些选项允许你为该组件保留的区域设置行（`gridwidth`）或列（`gridheight`）的单元格数量。默认值为\
  \ 1。`GridBagConstraints.REMAINDER` 值指定添加的组件必须是行（`gridwidth`）或列（`gridheight`）最后一个。`GridBagConstraints.RELATIVE`\
  \ 值表示此组件必须放置在其行（`gridwidth`）或列（`gridheight`）最后一个之后。\n\n- `fill`：当组件尺寸小于分配空间时使用此值，允许你指定组件是否缩放以及如何缩放。此参数可以取值\
  \ `GridBagConstraints.NONE`（默认）、`GridBagConstraints.HORIZONTAL`（意味着尽可能沿水平方向拉伸组件，但不改变其高度）、`GridBagConstraints.VERTICAL`（尽可能垂直地拉伸组件，但不改变其宽度）和\
  \ `GridBagConstraints.BOTH`（尽可能垂直和水平地拉伸组件）。\n\n- `ipadx`, `ipady`：这些选项允许你设置内边距，即在最小组件尺寸上的数量。这意味着组件的宽度不能小于其最小自然宽度加上\
  \ `ipadx*2` 像素（乘以二是因为内边距被添加到组件的两侧）。同样，组件的高度不能小于其最小自然高度加上 `ipady*2` 像素。\n\n- `insets`：此参数指示组件的外部缩进，即组件与为其分配区域边界之间的最小距离。\n\
  \n- `anchor`：此选项用于组件小于其分配区域时，并允许指定在这些区域内的放置方式。允许的值如下：\n\n\n\n\n`GridBagLayout.CENTER\
  \ (中心)`、`GridBagLayout.NORTH (北)`、`GridBagLayout.NORTHEAST (东北)`、`GridBagLayout.EAST\
  \ (东)`、`GridBagLayout.SOUTHEAST (东南)`、`GridBagLayout.SOUTH (南)`、`GridBagLayout.SOUTHWEST\
  \ (西南)`、`GridBagLayout.WEST (西)`、`GridBagLayout.NORTHWEST (西北)`\n*   `weightx`、`weighty`：这两个参数用于指定空间分布的性质，对于容器尺寸变化时组件的行为至关重要。如果某行中没有组件的\
  \ `weightx` 值不同（或者某列中组件的 `weighty` 值不同），则该行（或列）的所有组件将彼此靠近并在内部居中。换句话说，这些参数的零值会导致布局管理器将所有空白推向容器的边缘。\n\
  \n# 布局管理器选择\n\n现在你需要为应用程序选择最适合的布局管理器。表 8-1 总结了所考虑布局器的应用建议。一个通用的建议是：在实践中尝试应用不同的布局管理器以检查它们对你情况的适用性。\n\
  \n### 8-1 布局管理器选择\n\n| 你的需求 | 应该使用 | 建议 |\n| :--- | :--- | :--- |\n| 快速放置所有组件，不关注组合\
  \ | `FlowLayout` |\n| 良好地排列所有组件 | `BorderLayout` |\n| 具有相同尺寸组件 | `GridLayout` |\n\
  | 放置某些具有相同尺寸组件 | `GridBagLayout` |\n| 根据需要显示屏幕组件 | `CardLayout` |\n| 某些组件是持久的，某些需要调整\
  \ | |\n| 尽可能控制组件的位置，并对容器尺寸的变化有良好的反应 | |\n\n在单独面板中使用 `GridLayout`，将具有相同的组件聚集在一起，并将其他组件移到面板之外。\n\
  \n在 `Panel` 中使用 `CardLayout`，用于根据需要输出组件，超出面板限制。\n\n请记住，在单独面板中完全可以安装与相邻面板以及所属整个容器管理器不同的布局管理器。例如，如果在大型面板中使用\
  \ `GridBagLayout`，那么对于嵌套其中的较小面板，可以选择 `CardLayout`。\n\n创建新容器时，它会被分配一个默认布局管理器。\n\n\
  要更改给定容器的当前布局管理器，请使用表达式：\n\n```java\nsetLayout(new BorderLayout());\n```\n\n如果你有多个面板，在设置布局管理器时，需要指定它在哪个面板运行：\n\
  \n```java\ninput_panel.setLayout(new BorderLayout());\n```\n\n将组件添加到设置为非标准布局管理器的容器中，与普通情况相比只有一个区别，即你可能需要向\
  \ `add` 方法传递某些位置参数：\n\n```java\nLeftPanel.add(\"North\", ratioField);\n```\n\n在使用\
  \ `GridBagLayout` 管理器时，参数是通过一个名为 `gridBagConstraints` 的特殊类传递的，你可以为每个组件设置某些位置参数的值。通常，组件是在同一水平行内逐一个添加的，而该行内有空位；下一个添加的组件将开始新行。这一规则在\
  \ `BorderLayout` 中也某种程度上遵守——当你添加多个具有相同位置参数的组件（例如，“South”）时，它们将按照相同的法则放置在它们的“Z 部分”。\n\
  \n# 获取当前位置的尺寸\n\n在开发并调试好元素界面后，你可以找出这种方式放置组件的窗口尺寸是多少。要获取此信息，可以使用以下返回容器尺寸的任一个方法：\n\
  \n*   `preferredLayoutSize`：`public abstract Dimension preferredLayoutSize(Container\
  \ parent)`。该方法根据父容器中的其他组件，计算指定面板的自然宽度和高度。\n*   `minimumLayoutSize`：`public abstract\
  \ Dimension minimumLayoutSize(Container parent)`。该方法根据父容器中的其他组件，计算指定面板的最小宽度和高度。\n\
  \n# 示例\n\n现在我们已经熟悉了创建更复杂的自定义界面时使用的几个 API 类。现在我们考虑代码示例，这些示例使用了上面讨论的类以及处理它们的方法。我们的大多数示例将是开发一个货币转换\
  \ applet，我们在上一章中已经开始工作了。因此，你将对体量以及可能有多么有趣和多样有一个直观的认识。即使是简单的 applet，界面也可能是多样的。\n\n\
  ## 使用框架的设计：FlowLayout\n\n让我们尝试使用框架构建金额计算 applet 界面。事实证明使用这种新界面可以实现相同的功能，只需引入非常小的更改。主要的变化是整个\
  \ applet 现在位于一个独立的框架中，而不是浏览器窗口。在这个示例中，我们将使用 `FlowLayout`，因为对我们来说，现在是快速获取结果，而不需要花费大量精力精确指定组件的位置。\n\
  \n\n\n因为在这种情况下，我们正在向标准帧类添加新内容，所以我们使用了 `extends` 关键字。你可能并不完全理解为什么这是必要的。假设我们已经定义了类\
  \ `Frame1`。但请记住，我们启动的每个 applet 都是通过声明 `\"AppletName extends Applet\"` 的。在这种情况下，我们在这里创建了一个专门的设计器。因此，我们得到了自己的组件——在本文中是一个帧——它可以被反复重复使用，并在此基础上创建其他类。\n\
  \n示例的其余部分与上一章的最后一个示例几乎相同。`setLayout` 方法设置在创建的帧使用的布局管理器。`setFont` 方法设置帧中显示文本的字体。同样，你可以为输入的任何组件设置字体。在我们创建了\
  \ `Frame1` 类之后，我们将在 applet 中创建的所有组件都将属于 `Frame1`，而不是 Web 浏览器的 applet 区域。通过将帧的设置为\
  \ 300x250 像素，我们调用了 `pack` 方法，它会尝试在部署管理器限制的范围内将组件尽可能地放置在容器中。最后，我们调用 `show` 方法将帧输出到屏幕上。\n\
  \n示例 8-1c. applet，使用帧。\n\n```java\npublic void convert() {\n    float currency1,\
  \ currency2;\n    String InputString = field1.getText(); field1.setText(\"\");\n\
  \    currency1 = Float.valueOf(InputString).floatValue(); currency2 = conversion_ratio\
  \ * currency1;\n    String OutputString = \"$\" + InputString + \" = \" + \"#\"\
  \ + Float.toString(currency2) + \"\\n\";\n    field2.appendText(OutputString);\n\
  } // the end convert\n\npublic boolean handleEvent(Event evt) {\n    if (evt.target\
  \ == ratioScrollBar) {\n        int in;\n        in = ratioScrollBar.getValue();\
  \ conversion_ratio = in/100f;\n        ratioField.setText(Float.toString(conversion_ratio));\n\
  \    }\n    if (evt.target == field1) {\n        char c=(char)evt.key; if (c ==\
  \ '\\n') {\n            convert();\n        }\n    }\n    return false;\n}\n} //\
  \ the end applet\n```\n\n此示例中的 `convert` 方法与我们在上一章中处理过的示例 applet 中的同名方法没有区别。`handleEvent`\
  \ 方法也是如此，特别有趣的是，考虑到现在此方法处理了与帧的操作。这是因为所创建的帧是一个扩展，而负责事件处理程序的代码直接添加到了帧的属性中。在此，只有属于\
  \ `Frame` 类的 `handleEvent` 方法被重写了，而其他类中同名的方法（例如在基础课堂 applet `Window1` 中）的 `handleEvent`\
  \ 方法保持完好无。\n\n到为止，你应该已经清楚了如何构建一个创建你自己的窗口的 applet。如上所述，applet 接口的一个重要部分是使用许多不同界面元素的面板。面板与布局管理器的配合有助于\
  \ applet 界面的视觉化组织。你将在本章的后部分看到使用面板的示例，但现在让我们熟悉一种功能与帧最接近的元素——交互式窗口。\n\n## 对话框 applet：BorderLayout\n\
  \n在图 8-3 所示的 applet 中，享受一个按钮的最简单交互式窗口。\n\n这个示例将帮助我们从量上了解，帮助对话框如何吸引用户的注意力并使其对问题或消息做出响应。在这个示例中，我们将制作另一个版本的货币转换\
  \ applet，因为对话框通常用于一次性请求，而不是交互式工作。在这里我们将使用 `BorderLayout` 管理器，它将允许我们在窗口的适当位置放置界面组件：文本说明应该在顶部，用户指令在中间，“继续”按钮在底部。\n\
  \n![](img/image09255.gif)\n\n#### 图 8.3。\n\n示例 8-2a. 来自交互式窗口的 Applet。\n\n```java\n\
  import java.awt.*;\nimport java.applet.applet;\n\npublic class Show_Dialog extends\
  \ applet {\n    frame f;\n    Intro_Dialog Hello_Dialog;\n    public void init()\
  \ {\n        f = new Frame(); f.resize(50,50);\n        f.pack();\n        hello_dialog\
  \ = new Intro_Dialog(f); add(new Button(\"Show Me!\"));\n    }\n    public boolean\
  \ action(Event evn, Object obj) {\n        if (obj == \"Show Me!\") {\n        \
  \    Hello_Dialog.show(); return true;\n        }\n        return false;\n    }\n\
  } // the end applet Show_Dialog\n```\n\n为什么在 `Show_Dialog` 类中？当点击 \"Show Me!\" 按钮时，调用了\
  \ `Hello_Dialog.show()`。`Intro_Dialog` 是 `Dialog` 的子类，它有自己的 `handleEvent` 方法来处理点击事件。\n\
  \n![](img/image0256.gif)\n\n以下代码创建 `Intro_Dialog` 的实例并将 `frame` 传递给它的构造函数。这是因为 `Dialog`\
  \ 必须有一个帧作为它的父级。\n\n![](img/image0257.gif)\n\n在初始化对话框时，可能有多个参数。\n\n由于我们使用了属于 `Intro_Dialog`\
  \ 类的 `Intro_Dialog` 构造函数，这些参数必须传递给高级类 `Show_Dialog`。`setLayout` 语句实际上可以省略，因为 `BorderLayout`\
  \ 管理器已经是帧和对话框的默认管理器。我们在示例中开启此字符串是为了提醒，除非指定额外的参数位置，否则 `add(newComponent)` 方法将不起作用，例如\
  \ `add(\"center\", newComponent)`。\n\n示例 8-2b. 使用帧的交互式窗口 Applet。\n\n```java\nclass\
  \ Intro_Dialog extends Dialog {\n    Intro_Dialog(Frame parent) {\n        super(parent,\
  \ \"Hello\", true);\n        setLayout(new BorderLayout());\n        setFont(new\
  \ Font(\"Helvetica\", Font.PLAIN, 12)); setBackground(Color.gray);\n        add(\"\
  North\", new Label(\"Hello!\", Label.CENTER));\n        add(\"center\", new Label(\"\
  Click Continue to close this Dialog\", Label.CENTER));\n        add(\"South\", new\
  \ Button(\"Continue\")); resize(250,250);\n    }\n\n    public boolean handleEvent(Event\
  \ evt) {\n        if (evt.id == Event.ACTION_EVENT) {\n        }\n        return\
  \ false;\n        if (\"Continue\".equals(evt.arg)) {\n            dispose(); return\
  \ true;\n        }\n    }\n}\n```\n\n\n\n\n面板（Panel）是 AWT 中是最简单的容器。面板非常适合将标签、按钮以及其他界面元素进行分组，这些元素通常运行在浏览器窗口的\
  \ applet 中。然而，你也可以在创建了自己的帧或对话框的 applet 中使用面板。在这个示例中，我们还将使用 `BorderLayout` 管理器来布局面板组件。\n\
  \n在这一节中，让我们熟悉面板的使用。但我们不会完整地编写整个 applet 的代码，而是仅关注与面板相关的部分。\n\n首先，我们将创建两个面板，其中一个包含滚动条和用于重新计算系数的文本字段，而在另一个面板中——包含两个用于数值输入和输出的文本字段。第一个面板命名为\
  \ `LeftPanel`，第二个命名为 `RightPanel`。一旦面板添加到 applet 中，四个界面元素都将变为可用（图 8-4）。\n\n![](img/image09258.gif)\n\
  \n### 图 8.4。\n\n示例 8-3a. 使用面板的 applet。\n\n```java\nimport java.awt.*;\n\nimport\
  \ java.applet.applet;\n\npublic class Panel1 extends applet { public void init()\
  \ {\n\nnew Frame1();\n\n}\n\n} // the end Panel1\n\nclass Panel_n_Frame extends\
  \ Panel_n_Frame { float conversion_ratio = 1.5f; TextField field1 = new TextField(20);\
  \ text area field2 = new TextArea(4,20);\n\nTextField ratioField = new TextField(5);\n\
  \nscroll bar ratioScrollBar = new scrollbar ( scrollbar.VERTICAL, 150, 25, fifty,\n\
  \n250 );\n\npublic Panel_n_Frame() {\n\npanel right panel = new Panel(); Panel LeftPanel\
  \ = new Panel(); setLayout(new BorderLayout());\n\nsetFont(new Font(\"Helvetica\"\
  , Font.PLAIN, 16)); setBackground(color.gray);\n\nfield1.setEditable(true); field2.setEditable(false);\
  \ LeftPanel.setLayout(new BorderLayout()); LeftPanel.add(\"Center\", ratioField);\
  \ LeftPanel.add(\"North\", ratioScrollBar); RightPanel.setLayout(new BorderLayout());\
  \ RightPanel.add(\"North\", field1); RightPanel.add(\"South\", field2); ratioField.setText(\"\
  1.50\"); resize(field1.preferredSize()); resize(field2.preferredSize()); resize(300,250);\n\
  \nadd(\"East\", RightPanel); add(\"West\", LeftPanel); pack();\n\nshow();\n\n} //\
  \ the end init\n```\n\n在这里，作为变化，我们使用了一个垂直滚动条。通过创建面板 `RightPanel` 和 `LeftPanel`，我们向它们添加了界面组件。注意，`setLayout`\
  \ 和 `setFont` 方法属于 `Panel_n_Frame` 类，而不是 `RightPanel` 和 `LeftPanel`。如果 applet 界面是在浏览器窗口中而不是独立窗口中，我们将修改用于程序窗口的大部分属性，这些属性都是为\
  \ applet 的工作分配的。\n\n每个面板都可以有自己的布局管理器。如你所知，`BorderLayout` 管理器需要选项中的之一：North、South、East、West\
  \ 或 Center。`Center` 参数除了居中外，还有一个副作用——使用此选项指定的组件将尽可能地伸伸，填满容器的所有剩余空间。因此，如果你为 `ratioScrollbar`\
  \ 指定 `Center` 参数而不是 `West`，结果将非常搞笑——滚动条的大小会增大，并占据左侧面板上的所有剩余空间。另一方面，可以使用此参数添加编辑框或画布，因为这些元素的性质允许在不失真的情况下自由缩放。在向面板添加所有必要元素后，我们必须在\
  \ applet 中添加面板——这些面板组件将自动添加。\n\n示例 8-3b. 使用面板的 applet。\n\n```java\npublic void convert()\
  \ {\n\nfloat currency1, currency2;\n\nString InputString = field1.getText(); field1.setText(\"\
  \");\n\ncurrency1 = Float.valueOf(InputString).floatValue(); currency2 = conversion_ratio\
  \ * currency1;\n\nString OutputString = \"$\" + InputString + \" = \" + \"#\" +\
  \ Float.toString(currency2) + \"\\n\";\n\nfield2.appendText(OutputString);\n\n}\
  \ // the end convert\n\npublic boolean handleEvent(Event evt) { if (evt.target ==\
  \ ratioScrollBar)\n\n{\n\nint in;\n\nin = ratioScrollBar.getValue(); conversion_ratio\
  \ = in/100f;\n\nratioField.setText(Float.toString(conversion_ratio));\n\n}\n\nif\
  \ (evt.target == field1)\n\n{\n\nchar c=(char)evt.key; if (c == '\\n')\n\n{\n\n\
  convert();\n\n}\n}\n\nif (evt.id == Event.WINDOW_DESTROY) { dispose();\n\nreturn\
  \ true;\n\n}\n\nreturn false;\n\n}\n\n} // the end applet\n```\n\n等一下，`WINDOW_DESTROY`\
  \ 是什么意思？点在于我们必须处理当用户点击系统关闭窗口按钮（或者，如果是同一个帧）时触发的事件。在第一个示例中，当我们获取了 applet 并点击窗口关闭按钮时，什么都没有发生，因为程序在这种情况下没有提供任何操作。\n\
  \n## 相同尺寸元素：GridLayout\n\n`GridLayout` 管理器对于使用网格的 applet 特别有用。该管理器创建一个相同大小的正方形网格，每个网格包含一个组件。如示例\
  \ 8-4 所示。\n\n示例 8-4. 使用管理器的 applet。\n\n```java\nimport java.awt.*;\n\nimport java.applet.applet;\n\
  \npublic class Grid_1 extends Applet { float conversion_ratio = 1.5f; TextField\
  \ field1 = new TextField(5); text area field2 = new TextArea(4,20);\n\nTextField\
  \ ratioField = new TextField(5);\n\nscroll bar ratioScrollBar = new scrollbar (scrollbar.HORIZONTAL,\
  \ 150, 25, fifty,\n\n250 );\n\npublic void init() {\n\nsetLayout(new GridLayout(3,3));\n\
  \nsetFont(new Font(\"Helvetica\", Font.PLAIN, 12));\n\nsetBackground(color.gray);\
  \ ratioField.setEditable(false); field1.setEditable(true); field2.setEditable(false);\
  \ ratioField.setText(\"1.50\"); field1.resize(field1.preferredSize()); field2.resize(field2.preferredSize());\
  \ ratioField.resize(15,25);\n\nratioScrollBar.resize(ratioScrollBar.minimumSize());\
  \ add(ratioField);\n\nadd(ratioScrollBar); add(field1); add(field2);\n\n} // the\
  \ end init\n```\n\napplet 的外部视图如图 8.5 所示。注意条带和其他界面组件在放入矩形单元格后是如何改变其比例的。\n\n![](img/image0259.gif)\n\
  \n### 图 8.5。\n\n在这个示例中，实现的网格大小为高两格、宽两格，因为整个示例仅包含四个控件。图 8-5 清晰地显示了布局管理器如何处理单元格尺寸大于其内部放置尺寸的情况。\n\
  \n![](img/image09260.jpeg)\n\n![](img/image09261.jpeg)\n\n\n\n`CardLayout` 管理器允许你动态替换显示在屏幕上的组件，这对于包含一组嵌套组件的面板来说特别方便。示例\
  \ 8-5 阐述此类接口的实现。在这个示例中，所有与转换系数变化相关的控制控件都收集在一个面板中（图 8-6），而输入和输出重新计算值的字段编辑框则在另一个面板中（图\
  \ 8-7）。\n\n这些面板之间的切换通过从 applet 顶部下拉列表的两个位置中选择一个来实现。\n\n![](img/image0926.gif)\n\n\
  ### 图 8.6.\n\n示例 8-5a. 使用 `CardLayout` 管理器的 applet。\n\n```java\nimport java.awt.*;\n\
  import java.applet.applet;\n\npublic class LayoutCard extends Applet {\n    float\
  \ conversion_ratio = 1.5f;\n    TextField field1 = new TextField(20);\n    TextArea\
  \ field2 = new TextArea(4,20);\n    TextField ratioField = new TextField(5);\n \
  \   Scrollbar ratioScrollBar = new Scrollbar(Scrollbar.HORIZONTAL, 150, 25, fifty,\
  \ 250);\n    Panel cards_panel;\n\n    public void init() {\n        setLayout(new\
  \ BorderLayout());\n        setFont(new Font(\"Helvetica\", Font.PLAIN, 12));\n\
  \        setBackground(Color.gray);\n        field1.setEditable(true);\n       \
  \ field2.setEditable(false);\n        ratioField.setText(\"1.50\");\n        field1.resize(field1.preferredSize());\n\
  \        field2.resize(field2.preferredSize());\n        ratioField.resize(ratioField.preferredSize());\n\
  \        ratioScrollBar.resize(ratioScrollBar.minimumSize());\n\n        // 将作为\
  \ CardLayout 管理器容器的面板，有必要声明为全局，因为发生在此面板面板中的事件会改变显示的界面部分，因此不能限制在嵌套面板中。\n        //\
  \ 上述代码中的 `setLayout(new BorderLayout())` 设置了窗口 applet 的布局管理器：\n        Panel options_panel\
  \ = new Panel();\n        Choice options = new Choice();\n        options.addItem(\"\
  Adjust Ratio\");\n        options.addItem(\"Calculate\");\n        options_panel.add(options);\n\
  \        add(\"North\", options_panel);\n\n        cards_panel = new Panel();\n\
  \        cards_panel.setLayout(new CardLayout());\n\n        Panel ratio_panel =\
  \ new Panel();\n        Panel calculate_panel = new Panel();\n        ratio_panel.add(ratioField);\n\
  \        ratio_panel.add(ratioScrollBar);\n        calculate_panel.add(field1);\n\
  \        calculate_panel.add(field2);\n        cards_panel.add(\"Adjust Ratio\"\
  , ratio_panel);\n        cards_panel.add(\"Calculate\", calculate_panel);\n\n  \
  \      add(\"center\", cards_panel);\n        show();\n    } // init 结束\n```\n\n\
  这段代码向名为 `options_panel` 的面板（`Choice`）添加了一个下拉列表。该下拉列表包含两个项目：“Adjust Ratio”（调整比例）和“Calculate”（计算）。然后，包含下拉列表的\
  \ `options_panel` 被添加到窗口 applet 的顶部。接下来定义了管理器将工作的面板：`CardLayout`。按照惯，创建了面板的新实例并为其分配了一个管理器。在放置\
  \ `CardLayout` 后，又创建了两个面板，这两个面板将使用 `CardLayout` 管理器在屏幕上切换。这两个面板被添加到 `cards_panel`\
  \ 面板中。其中一个面板包含一个显示转换系数的字段和一个用于其变化的滚动条，另一个包含两个用于输入原始值和输出重新计算结果的编辑字段。在将这两个面板添加到面板\
  \ `cards_panel` 时，为它们分配了标签（labels）——文本行“Adjust Ratio”和“Calculate”。\n\n在将面板 `cards_panel`\
  \ 添加到窗口 applet 后，它包含了两个面板——`cards_panel` 和 `options_panel`。嵌套面板添加到 `cards_panel`\
  \ 的顺序决定了它们在调用 `next` 或 `previous` 方法时在屏幕上的输出顺序。\n\n除 `Togo` 之外，可以从 `Class CardLayout`\
  \ 的帮助方法 `show` 从可用面板中撤回任何一个——正是我们在下面的事件处理器动作中并在并实现了这个方法。\n\n示例 8-5b. 使用 `CardLayout`\
  \ 管理器的 applet。\n\n```java\npublic void convert() {\n    float currency1, currency2;\n\
  \    String InputString = field1.getText();\n    field1.setText(\"\");\n    currency1\
  \ = Float.valueOf(InputString).floatValue();\n    currency2 = conversion_ratio *\
  \ currency1;\n    String OutputString = \"$\" + InputString + \" = \" + \"#\" +\
  \ Float.toString(currency2) + \"\\n\";\n    field2.appendText(OutputString);\n}\
  \ // convert 结束\n\npublic synchronized boolean handleEvent(Event evt) {\n    if\
  \ (evt.target == ratioScrollBar) {\n        int in;\n        in = ratioScrollBar.getValue();\n\
  \        conversion_ratio = in/100f;\n        ratioField.setText(Float.toString(conversion_ratio));\n\
  \    }\n    if (evt.target == field1) {\n        char c = (char)evt.key;\n     \
  \   if (c == '\\n') {\n            convert();\n            return true;\n      \
  \  } else {\n            return false;\n        }\n    }\n    return super.handleEvent(evt);\n\
  }\n```\n\n在声明方法 `handleEvent` 时必须使用 `synchronized` 关键字。\n\n这是因为同一个 applet 使用了动作事件处理器，并要求提供，这两个处理器事件不会被同时调用。\n\
  \n\n\n\n```java\nsetFont(new Font(\"Helvetica\", Font.PLAIN, 12)); setBackground(color.gray);\
  \ ratioField.setEditable(false); field1.setEditable(true); field2.setEditable(false);\
  \ ratioField.setText(\"1.50\"); field1.resize(field1.preferredSize()); field2.resize(field2.preferredSize());\
  \ ratioField.resize(ratioField.preferredSize());\n\nratioScrollBar.resize(ratioScrollBar.preferredSize());\
  \ Con.weightx=1.0;\n\nCon.weighty=1.0;\n\ncon.anchor = GridBagConstraints.CENTER;\
  \ Con.fill = GridBagConstraints.NONE; Con.gridwidth=GridBagConstraints.RELATIVE;\
  \ gridbag.setConstraints(ratioField, Con); add(ratioField);\n\ncon.gridwidth = GridBagConstraints.REMAINDER;\n\
  ```\n\n首先，创建布局管理器 `GridBagLayout` 和类 `gridBagConstraints` 的新实例。`GridBag` 被用作布局管理器，它是\
  \ `GridBagLayout` 的实例。如果你不更改 `gridBagConstraints` 类中包含的 `weightx` 和 `weighty` 值（它们的默认值为零），那么所有组件都将向中心聚集，而在这种情况下，我们完全不需要这样做。参数默认值\
  \ `fill` 等于 `both`，这意味着 `Components` 将在两个坐标上拉伸。在这里，滚动条是不必要的，字段 `ratioField` 和字段\
  \ `input` 不需要拉伸，因此将它们的 `fill` 参数设为 `NONE`。相反，输出值的字段应该尽可能地拉伸，因此它的 `fill` 参数被设置为 `former`（即\
  \ `BOTH`）。对于参数 `anchor`，使用了 `center`，得益于此，所有组件都放置在分配给它们的区域中心。因为在添加时，`ratioField`\
  \ 字段必须位于其行最后一个元素之后，因此对于该组件，`gridwidth` 参数设置为 `RELATIVE`。对于应该是行末最后一个元素的滚动条 `ratioScroolBar`，`gridwidth`\
  \ 参数的值被设置为 `REMAINDER`。\n\n在这个示例中，同一个 `gridBagConstraints` 实例被多次使用，因此在重用之前，即使是那些我们对默认值满意的限制器，也显式地分配所需的值。相反，其他参数在所有情况下都有相同的值，在重复使用\
  \ `gridBagConstraints` 实例之前，你不需要做任何事情。如果我们为每个组件创建一个 `gridBagConstraints` 实例，那么所有这些实例都必须将相同的参数设置为相同的值。因此，更经济的方法是创建一个该类的实例，并将其用于所有组件：\n\
  \n```java\ngridbag.setConstraints(ratioScrollBar, Con); add(ratioScrollBar); Con.gridwidth=GridBagConstraints.REMAINDER;\
  \ gridbag.setConstraints(field1, Con); add(field1); Con.gridy=GridBagConstraints.RELATIVE;\
  \ Con.fill = GridBagConstraints.BOTH; Con.gridwidth=GridBagConstraints.REMAINDER;\
  \ Con.gridheight=GridBagConstraints.REMAINDER; gridbag.setConstraints(field2,Con);\
  \ add(field2);\n```\n\n```java\n} // init 方法结束\n```\n\n显示结果的字段应该占据分配给它的所有空间，因此它的\
  \ `fill` 值设置为 `BOTH`，并且变量 `gridwidth` 和 `gridheight` 被赋值为 `REMAINDER`。接下来的两行设置了字段\
  \ `field2` 的输入限制并将该字段添加到 applet 中。代码其余部分与之前的示例相同。现在，你可以实验限制器的值，熟悉 `GridBagLayout`\
  \ 方法的功能，并改进我们 applet 的界面。\n\n## 附录菜单：CardLayout\n\n让我们回到使用 `CardLayout` 作为布局管理器的示例，并将下拉列表替换为菜单（图\
  \ 8-9）。与之前一样，此 applet 的控件收集在两个面板中，在 applet 窗口中交替显示。处理完这个简单的示例后，你可以进一步对菜单进行实验。\n\n\
