  负责国际象棋真实游戏的类使用 `setImage` 来将棋子插入字段中。`setImage` 方法接收一个图像——可能是该形状的图像——以及一个指示在哪个字段放置图像的字符串。如果新图像与字段中的图像不同，则该字段将更新并重绘。要移除图像，可以简单地设置为\
  \ `null`。\n\n`paintSquare` 方法负责绘制单个字段。通过给定的数组索引，它分别将字段涂成浅色或深色，如果该字段上有棋子，则绘制该棋子的图像。布尔参数指示是否绘制圆圈（表示字段）：\n\
