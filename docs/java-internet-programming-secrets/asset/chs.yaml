  \n这一切都非常简单。界面的简洁是构建的程序和 Java 语言共同的结晶。Java 不允许在 applet 上放置菜单，因此我们必须创建一个独立的帧（frame）来容纳菜单。这种方法逐渐会让你的\
  \ applet 看起来像整个应用程序，尽管这通常并不坏。因此，我们的项目更接近一个真实的应用程序，而不是网页的扩展——例如，动画器或公告板。\n\n在主菜单中，用户通常会打开计划（`Schedule`）。结果将出现一个看起来像普通日记的东西。它没有华丽的装饰或你喜爱的风景照片。这只是一个功能性界面，从中可以切换到之前或之后一天并添加新的计划点。\n\
  \n不过，如果客户希望计划看起来更智能一些，我们可以在那里添加漂亮的图片。我们的日记如图 19-3 所示。\n\n![](img/image09340.gif)\n\
  \n### 图 19.3。\n\n其余的窗口很小，每个只包含一个功能。我们在这里没有介绍它们；你可以通过滚动应用程序自行查看。要记住，所有窗口都是独立的帧，这是一把双刃剑——它提供了更大的操作自由度，但需要更多的工作。在项目实现过程中，我们会把注意力放在一些细节上，这些细节在处理帧工作时是非常重要的。\n\
  \n## 大整体\n\n当所有组件组合在一起时，我们得到的是比各个部分更丰富的整体。每个模块都在自己的专业领域内工作，并为其他专业人员提供工作。开发出的模块可以在其他项目中使用。因此，我们可以关注项目的特性，而较少地处理网络通信或数据结构创建等通用任务，这是使用面向对象方法的最大优势之一。在项目开发上花费的时间在创建后续项目时将获得完全的回。图\
  \ 19-4 高亮了模块之间的链接。\n\n![](img/image09341.gif)\n\n### 图 19.4。\n\n设计好系统后，我们可以开始编写程序。在工作的这个阶段，可能需要修改项目（大多数时候不需要，但有时会发生）。因为现在你更好地学会了预测可能出现的困难，并获得了使用\
  \ Java 和面向对象项目的经验，你将犯更少的错误，你的整个项目也会变得更整洁。当任何人看到你的项目并说：“是的，这真是一个东西！”时，那种感觉异常愉快。\n\
  \n# 实现\n\n创建一个坚实的项目后，是时候坐下来决定如何实现每个对象，使用哪些数据结构和算法了。你也可以创建一个展示程序主要元素的演示，尽管它的效果不如最终产品有效。使用面向对象的技术允许我们创建几个实现版本，然后从中选择一个最适合给定项目的一个。\n\
  \n一种常见的方法是编写程序时很少关注执行速度和内存，然后回来进行改进。\n\n## 程序概述\n\n本手册包含。为了让项目工作更轻松，它被分成了几个目录。每个目录包含它自己的。\n\
  \n## 网络接口\n\n本指南中的主要链接是服务器的设计和实现。\n\n事实上，服务器执行一个非常简单的循环。它监听一个端口，接受连接，然后启动一个线程来处理请求。这是一个应用程序而不是\
  \ applet，这就是为什么 Java 中有一个 `main` 方法。让我们来看主循环的程序：\n\n```java\npublic class server\
  \ {\n    public static void main(String args[]) throws IOException {\n        ServerSocket\
  \ session = new ServerSocket(1666,100);\n        handleRequests handler;\n\n   \
  \     Hashtable users = new hashtable();\n        locks schedLocks = new locks();\n\
  \n        System.out.println(\"Waiting for connections\");\n        while(true)\
  \ {\n            Socket socket = null;\n            try {\n                socket\
  \ = session.accept();\n            }\n            catch (SocketException e) {\n\
  \                // 通常是超时，重试\n            }\n            if (socket == null) {\n\
  \                continue;\n            }\n\n            System.out.println(\"Connection\
  \ made\");\n            // 为通信创建一个单独线程\n            handler = new handleRequests(socket,users,\
  \ schedLocks);\n            // 非重入系统的设置\n            handler.setPriority(handler.getPriority()\
  \ + one);\n            handler.start();\n        }\n    }\n}\n```\n\n服务器使用名为 `ServerSocket`\
  \ 的类。该类通过 `accept` 方法监听端口并建立连接。我们选择了端口 `1666` 并要求的等待时间为 `100` 毫秒。注意 `accept` 方法中的\
  \ `try` 块。如果在规定时间内没有建立连接，则会抛出 `SocketException`。在我们情况下，我们将继续执行步骤，直到连接建立为止。\n\n\n\
  \n一旦建立连接，我们将创建一个新线程来处理请求。我们创建了一个 `handleRequest` 类来服务连接。由于它是 `Thread` 类的扩展，其主程序包含在\
  \ `run` 方法中。该方法的工作方式类似于 `dispatcher`。当 `package`（包）到达时，第一个字节用于定义 `package` 类型。然后调用适当的方法对数据包进行解析。就是这些了——除了分析和查询处理，你就大功完成了。`handleRequest`\
  \ 类将对客户端请求执行所有操作：\n\n```java\nclass handleRequests extends Thread {\n    DataInputStream\
  \ in = null;\n    DataOutputStream out = null;\n    Socket socket = null;\n\n  \
  \  String user=null;\n    Hashtable users;\n    locks schedLocks;\n\n    handleRequests(Sockets,\
  \ Hashtable users, locks schedLocks) throws IOException {\n        socket = s;\n\
  \        in = new DataInputStream(new BufferedInputStream(socket.getInputStream()));\n\
  \        out = new DataOutputStream(new BufferedOutputStream(socket.getOutputStream()));\n\
  \        this.users = users;\n        this.schedLocks = schedLocks;\n    }\n}\n\
  ```\n\n在此类的构造函数中，给定了 `socket`、哈希表以及一个锁对象类。\n\n让我们检查每个组件并看看它们在服务器中扮演什么角色。当连接建立时，系统在用户和服务器之间创建一个\
  \ socket。这个 socket 代表一个双向通道，你可以用它与服务器通信。无论用户位于何处，是在相邻的车还是 Sveta 的其他部分——没关系——连接的工作都是相同的。socket\
  \ 创建了两个流：输入流和输出流。首先，让我们为输入和输出流创建缓冲区并过滤数据。\n\n不要忘记为了实现我们的目标，你可以放置各种过滤器，在这种情况下是缓冲区过滤器和数据过滤器。缓冲区过滤器用于高效访问流。到达通道的字符被临时存储在\
  \ `buffer` 中。这使得更高效地读写大型数据集成为可能。缓冲区流允许你随着通信速度的增加而增加传输的数据。我们可以写一个 64 字节的数据包，但它将以每单位时间一个字节的速度写入。`write`\
  \ 命令将能够写入这些数据并继续运行，而不需要等待整个流写入。这将使数据传输更加紧凑，并允许程序运行更顺畅。\n\n数据过滤器用于为了跨流发送简单类型，这将提供直接写入整数和字符串等数据项而无需解析它们的能力。使用数据过滤器将使我们的读取和记录更加方便。\n\
  \n构造函数的第二个参数是一个自定义哈希表，用于跟踪所有登录到我们服务器的用户。此信息被用于通知所有用户日程的更改。在这里应用了一种并不十分有效的算法，它会通知所有用户日程的任何变化。如果只通知每个用户其个人日程中的变化会更好，但这将产生跟踪个人日程的问题，并需要额外的额外的消息来记录每个用户何时打开或关闭日程。对于给定的目标，我们利用更简单的实现就足够了。\n\
  \n最后一个参数是 `schedLocks` 对象。此对象用于锁定文件。你不能允许两个用户同时修改文件。为了避免这种情况，程序在在使用文件之前锁定它，在工作完成后解锁。虽然这保护了文件，但使用写阻塞会更好。死锁和数据损坏问题将在第\
  \ 11 章“多线程”中讨论。\n\n创建流后，我们调用 `start` 方法。此后系统会触发流的 `run` 方法。\n\n我们 `handleRequest`\
  \ 类的 `run` 方法非常简单且有效，类似于 `dispatcher`。不同之处在于它处理可能发生的任何异常。以下代码片段演示了我们帖的分析器：\n\n```java\n\
  public void run() {\n    byte b;\n    boolean cont=true;\n    try {\n        loginRequest();\n\
  \        while(cont) {\n            b = in.readByte();\n            switch(b) {\n\
  \                case packetTypes.login: login Parse(); break;\n               \
  \ case packetTypes.logoff: cont=false; break;\n                case packetTypes.reqSchedule:\
  \ reqSchedule(); break;\n                case packetTypes.addMeeting: addMeeting();\
  \ break;\n                default: System.out.println(\"Unknown type\");\n     \
  \       }\n        }\n        out.close();\n        in.close(); \n        socket.close();\n\
  \    } catch (IOException ignore) {\n        System.out.println(\"IO exception,\
  \ thread stopped\"); \n        stop();\n    } catch (Exception e) {\n        System.out.println(\"\
  Unknown error, thread stopped\"); \n        e.printStackTrace();\n        stop();\n\
  \    } finally {\n        users.remove(user); \n        schedLocks.unlock(user);\n\
  \    }\n}\n```\n\n让我们看看这个块中的异常处理。总假设是我们可以允许某些连接中断，但我们希望服务器继续工作。问题是不允许一个线程破坏其他线程。\n\
  \n服务器的主部分是 `requests`。与此同时，这是这些。让我们看看这个块中的异常处理。\n\n```java\npublic void loginRequest()\
