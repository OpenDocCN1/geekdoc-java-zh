  \n## 使用 `Graphics` 类绘图\n\n`Graphics` 类允许帮助标准图形原语在二维画布上绘制。请注意，你不能自己创建 `Graphics`\
  \ 对象，因为唯一的构造函数被定义为私有修饰符。通常，`Graphics` 对象会与你正在操作的 `Component` 类绑定并传递给你，例如使用 `Component`\
  \ 类的 `paint` 方法时，或者通过 `Component` 类的方法 `getGraphics` 显式获取。\n\n`Image` 类也执行 `getGraphics`\
  \ 方法，该方法返回从 `Image` 连接的对象的图形链接。这种技术在第 5 章“工作中的 Applet”中简单讨论过。\n\n## 绘制轮廓对象\n\n由于\
  \ `Graphics` 类中有许多方法，我们将它们分为三组并交替讨论。第一部分包含所有与绘制轮廓相关的方法。（空白）使用默认颜色绘制图形。这些方法列在表 9-1\
  \ 中。\n\n表 9-1. 用于绘制轮廓形状的 `Graphics` 类方法\n\n## 方法描述\n\n| 方法 | 描述 |\n| :--- | :---\
  \ |\n| `drawLine(int, int, int, int)` | |\n| `drawRect(int, int, int, int)` | 从前两个整数（X\
  \ 和 Y 坐标）给出的位置画线到后两个整数指示的位置。显示矩形。前两个整数表示矩形的左上角，最后两个整数表示宽度和高度。 |\n| `draw3DRect(int,\
  \ int, int, boolean)` | 输出发光的三维矩形。设置前四个整数（与 `drawRect` 方法相同），`boolean` 参数指定矩形是否应凸于背景。\
  \ |\n| `drawRoundRect(int, int, int, int, int)` | 显示内接在由前四个整数指定的普通矩形内的圆角矩形。最后两个整数指定角部弧的宽度和高度。弧的宽度和高度定义了沿\
  \ x 轴或 y 轴的弧直径。值越大，曲线越平滑。 |\n| `drawOval(int, int, int, int)` | 输出一个内接在四个整数定义的矩形内的椭圆。\
  \ |\n| `drawArc(int, int, int, int, int, int)` | 显示内接在由前四个整数整数确定的矩形内的弧。最后两个整数指定起始角度和结束角度，以度为单位。角度从图形区域的右侧中心计算。正值表示旋转方向为逆时针，负值表示顺时针。\
  \ |\n| `drawPolygon(int [], int[], int)` | 显示多边形。整数数组包含多边形组成点的 X 和 Y 坐标，但整数数组表示点的总数。\
