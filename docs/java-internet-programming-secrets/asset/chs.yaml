  \        show();\n    }\n\n    public void convert() {\n        float currency1,\
  \ currency2;\n        String InputString = field1.getText();\n        field1.setText(\"\
  \");\n        currency1 = Float.valueOf(InputString).floatValue();\n        currency2\
  \ = conversion_ratio * currency1;\n        String OutputString = \"$\" + InputString\
  \ + \" = #\" + Float.toString(currency2) + \"\\n\";\n        field2.appendText(OutputString);\n\
  \    }\n\n    public boolean keyDown(Event evt, int key) {\n        // 按键处理实现\n\
  \        return true;\n    }\n}\n```\n\n\n\n\n\n```java\n// 处理按键的开发程序\n\n{\n  char\
  \ c=(char)key;\n\n  // 将按键转换为字符类型以进行比较\n  if (c == '\\n') {\n    // 如果按下的是回车键，启动\
  \ convert()\n    convert();\n    return true;\n  } else {\n    return false;\n \
  \ }\n} // KeyDown() 结束\n} // applet currencyConverter1 结束\n```\n\n在例例中，我们使用 `keyDown`\
  \ 事件处理器来捕获按键释放事件。在下方的“复选框（Checkboxes）”部分，我们也将使用回车键 `Enter` 来启动重新计算程序，但随后我们将使用 `handleEvent`\
  \ 方法。该方法是一个通用的事件处理器，你可以用它来拦截程序已经有其他处理器的事件，从而选择你想要提供响应处理的事件。（在示例中，通过使用标志位，你将看到如何使用此处理器来拦截按下\
  \ `Enter` 键和用鼠标点击复选框。）因此，拦截事件有多种方法，在很多情况下，它们在功能和速度上是完全互换的。在那些需要拦截许多不同事件的 applet\
  \ 中，可以使用像 `handleEvent` 或 `action` 这样的通用事件处理器。此类处理器允许你将所有的事件处理代码集中在一个地方，这对于 applet\
  \ 代码的可读性和运行速度通常是有利的。广播管理片段，作为处理特定开发内容的响应者，更多地通过操作符切换来执行。\n\n此外，通过 `handleEvent`\
  \ 方法的帮助，你可以处理整个事件序列，并考虑事件在 applet 内部的空间坐标。让我们在一个带有标志位的示例中使用它，在该示例中，处理器在拦截事件后检查鼠标光标的坐标，以确定点击发生的位置——是在\
  \ `flag` 上还是其他地方。许多其他处理事件的示例你可以在第 8 章“更多关于用户界面”以及书的其他章节中找到，特别是那些正在开发教育类 applet 的章节。\n\
  \n# 文本字段编辑\n\n字段编辑文本区域（text area）可能用于 applet 中的取款，以及输入和编辑文本。这种类型的编辑字段由多行文本组成，并带有滚动条。相比之下，`TextField`\
  \ 类型的编辑字段只有一行，且没有滚动条。`TextField` 和 `TextArea` 都是 `TextComponent` 类的子类，除了上述区别外，它们在所有方面都是相似的。在上述示例\
  \ applet 中使用的 `TextField` 类型字段如下：\n\n```java\nTextField field1 = new TextField(20);\n\
  field1.setEditable(true);\n```\n\n第一行创建了一个宽度为二十个字符的 `TextField` 类型字段。第二行为该字段分配了一个允许编辑其中文本的属性。如果将第二行的\
  \ `true` 替换为 `false`，用户将无法编辑字段中的文本。\n\n然后我们创建一个宽度为 20 个字符、高度为 4 行的文本区域类型字段：\n```java\n\
  text area field2 = new TextArea(4,20);\n```\n\n为了给这个编辑字段启用滚动条，程序中不需要提供任何设置，因为任何\
  \ `textArea` 类对象在创建时会自动接收此界面元素。\n\n程序在字段编辑中输出文本可以通过两种方法之一：\n```java\nfield1.setText(\"\
  \");\nfield2.appendText(OutputString);\n```\n\n`setText` 方法允许设置字段的内容（在本例中，一对双引号允许你清空编辑字段）。`appendText`\
  \ 方法允许将文本字符串附加到编辑字段内容的末尾。但如果编辑字段是多行的，`appendText()` 函数不会开始新行；要跳转到新行，你必须手动在可编辑的内容中粘贴换行符。\n\
  \n现在我们应该考虑创建的编辑框的大小。事实是，虽然每个字段都有其原始的“自然”尺寸，但 applet 的运行可能会导致实际尺寸不同。为了显式要求编辑字段占据其自然尺寸，我们将使用\
  \ `resize` 方法，并通过帮助方法 `preferredSize` 获取编辑字段的自然维度：\n\n```java\nfield1.resize(field1.preferredSize());\n\
  field2.resize(field2.preferredSize());\n```\n\n现在，当 `TextField` 和文本区域对象被创建并初始化后，我们需要将它们添加到\
  \ applet 的界面中。这使用了 `add` 方法。最后，为了将这种方式添加的所有界面组件显示在屏幕上，使用了 `show` 方法。在这里我们需要写看到创建的\
  \ `field1` 对象和 `field2`：\n\n```java\nadd(field1);\nadd(field2);\nshow();\n```\n\n\
  还有许多其他方法可以用于处理字段编辑。表 7-1 列出了两个类中都可用的方法——无论是在 `TextField` 中还是文本区域中——所有这些方法都继承自 `TextComponent`。\n\
