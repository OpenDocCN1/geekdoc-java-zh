  \ | 复制哈希表。 |\n| `boolean contains(Object o)` | 如果 `o` 是哈希表中的元素，则返回 true。 |\n| `boolean\
  \ isEmpty()` | 如果哈希表为空，则返回 true。 |\n| `int size()` | 返回大小。 |\n\n## 栈 (Stacks)\n\n\
  如果你查看任何程序的内部，你会发现一个栈。栈最用于跟踪。\n\n### 表 6-15. Stack 方法\n\n| 方法 | 说明 |\n| :--- | :---\
  \ |\n| `Object push(Object o)` | 将 o 放入栈中。 |\n| `Object pop()` | 从栈中弹出元素。 |\n| `Object\
  \ peek()` | 返回顶端元素但不移除它。 |\n| `boolean isEmpty()` | 如果栈为空，则返回 true。 |\n| `int search(Object\
  \ o)` | 如果 o 在栈中，则返回距离。 |\n\n## 接口 API (Interfaces API)\n\n正如第 3 章“Java 面向对象”中所述，Java\
  \ 接口允许在不创建实例的情况下使用一组类方法。接口声明方法，某些类实现它们。接口在 API 中起着决定性的结构作用，`java.util` 中有两个接口——`Enumeration`\
  \ 和 `Observer` 非常有用。学习了接口的结构作用以及这两个接口的应用后，你可以通过浏览其他包并开发自己的接口以最完整的格式使用它们。\n\n```java\n\
  public class applet extends panel {\n    // 基本类 applet\n    private appletstub stub;\n\
  \n    public final void setStub(AppletStub stub) {\n        this.sttub=(AppletStub)stub;\n\
  \    }\n    // applet 的剩余部分\n}\n```\n\n\n\n\n`java.applet` 和 `java.awt.peer` 中的所有接口都遵循与执行环境无关的类无关\
  \ API 这一目标。尽管这些接口非常重要，但当我们仅使用 API 时，它们并没有实际用处。例如，如果我们不编写运行 applet 的外壳，我们就永远不会遇到\
  \ `appletstub`。当我们在第 10 章“结构化程序”中开始开发自己的包时，我们可能会记住这种技术。但现在，尽量不要在这两个包的接口上感到困。\n\n\
  ## 接口枚举 (Interface Enumeration)\n\n在 `java.util.enumeration` 中，`interface Enumeration`\
  \ 接口在我们的程序中直接很有用。当像 `Vector` 或 `Hashtable` 这样的 API 类返回 `Enumeration` 时，通常你得到的是一个对象列表。然后你可以通过对每个对象执行\
  \ `desired operation` 来处理此列表。这种解决方案的妙之处在于，无论这些对象的来源如何，你都可以使用 `Enumeration` 接口的方法来处理你的列表。\n\
  \n假设我们需要对向量、键或意味着哈希表执行相同的操作。我们可以将哈希表的所有键或所有值放入向量中，然后遍历其所有元素，但在许多情况下，使用 `Enumeration`\
  \ 接口反而更方便。\n\n示例 6-11a。接口 `Enumeration`。\n\n```java\npublic void printEnumeratlon(Enumeration\
  \ e) { \n    while (e.hasMoreElements()) {\n        System.out.println(e.nextEIement.toString);\n\
  \    }\n}\n```\n\n要从哈希表或向量使用 `printEnumeration`，你应该应用表 6-16 中给出的方法之一。\n\n表 6-16.\
  \ 返回元素 Enumeration\n\n| 类 | 方法 | 返回值 |\n| :--- | :--- | :--- |\n| `Vector` | `elements()`\
  \ | 所有向量元素的枚举。 |\n| `Hashtable` | `keys()` | 哈希表所有键的枚举。 |\n| `Hashtable` | `elements()`\
  \ | 哈希表所有元素的枚举。 |\n\n在练习中使用 `printEnumeration` 方法，只需从以下操作符中任选一（对于哈希表 `H` 和向量 `V`）：\n\
  \n示例 6-11b. 使用 `Enumeration` 接口。\n\n```java\nHashtable H=giveMeHashtable();\nVector\
  \ V=giveMeVector();\nprintEnumeration( V.elements()); \nprintEnumeration( H.keys()\
  \ );  \nprintEnumeration( H.elements());\n```\n\n在我们简单的 `printEnumeration` 示例中，我们使用了所有的\
  \ `Enumeration` 接口方法。因此我们不能过度依赖 `Enumeration` 接口。尽管它提供了处理哈希表和向量的方便方法，但我们只能遍历列表一次。\n\
