  \ 类型 `String`，包含 `parameters` `fields`。\n\n`preferredSize(int, int)` 根据指定的 `quantity`\
  \ 行 `lines` 和行字符 `characters` 返回 `natural` 尺寸 `fields`。\n\n`preferredSize()` 返回给定\
  \ `fields` 的 `natural` 尺寸。\n\n`replaceText(String, int, int)`\n\n# 按钮 (Buttons)\n\
  \n将指定数字符号之间的文本替换为指定的文本。\n\n之前的版本货币转换 applet 通常通过按下 `Enter` 键来执行转换。现在，让我们通过添加一个按钮来修改该\
  \ applet，用户可以在输入原始值后通过该按钮重新计算。这里是创建一个标题为 `Convert:` 的按钮的方法：\n\n```java\nbutton ConvertButton\
  \ = new Button(\"convert\");\n```\n\n这就是在下方示例 7-2 中创建按钮的方式。在这个版本中，我们不再提供拦截 `Enter`\
  \ 键的功能，因为现在计算仅通过点击 `button` 触发。此版本 applet 的外观如图图 7-2 所示。\n\n![](img/image0924.gif)\n\
  \n#### 图 7.2.\n\n示例 7-2a. 包含按钮的金额金额重新计算 applet。\n\n```java\nimport java.awt.*;\n\
  import java.applet.applet;\n\npublic class currencyConverter2 extends java.applet.applet\
  \ { float conversion_ratio = UKratio;\n\nTextField field1 = new TextField(20); text\
  \ area field2 = new TextArea(4,20);\n\nbutton ConvertButton = new Button(\"convert\"\
  ); public void init() {\n\nfield1.setEditable(true);  field2.setEditable(false);\
  \  field1.resize(field1.preferredSize());  field2.resize(field2.preferredSize());\
  \  add(field1);\n\nadd(field2);  add(ConvertButton);\n\nshow();  // 在屏幕上输出创建的元素\n\
  \n}  // init 方法结束\n```（等一下，让我重新格式化代码）\n\n这段代码片段提供了创建标记为 \"convert\" 按钮的功能，按下时，输入的值将被重新计算并显示在相应的字段中。`init`\
  \ 方法用于创建 applet。在 `field1` 中，用户可以输入自己的值，而 `field2` 用于输出并受保护不可编辑。屏幕元素界面通过 `add` 方法添加到\
  \ applet 中。任何要显示的元素必须添加到某个容器中（在本例中，默认容器是 applet 窗口）。`resize` 方法使文本编辑框根据它们的大小（在本例中为二十个字符）排列，并考虑到窗口宽度。\n\
  \n实际重新计算由下一个函数执行。\n\n示例 7-2b. 计算。\n\n```java\npublic void convert() {\n\nfloat currency1,\
  \ currency2;\n\nString InputString = field1.getText();  currency1 = Float.valueOf(InputString).floatValue();\
  \  currency2 = conversion_ratio * currency1;  String OutputString = Float.toString(currency2);\
  \  field2.setText(OutputString);\n\n}  // convert() 结束\n```\n\n在这里创建了一个字符串变量，其中记录了来自字段\
  \ `field1` 的 `meaning`。然后将 `inputString` 变量转换为 `float`，并将转换结果赋值给 `currency1` 变量。将此值乘以\
  \ `conversion_ratio`，将结果赋值给 `currency2` 变量，然后在转换为 `String` 后，将结果字符串写入 `outputString`\
  \ 变量。最后，将得到的值引入字段 `field2`。执行此重新计算的方法在下方的事件处理程序修复 `convert` 按钮被按下时被调用。\n\n示例 7-2c.\
  \ 拦截按钮按下。\n\n```java\npublic boolean action(Event evt, Object obj)\n\n{\n\nif (\"\
  Convert\".equals(obj))\n\n{\n\nconvert(); return true;\n\n}\n\nelse { return false;\
  \ }\n\n}  // action() 结束\n\n}  // applet currencyConverter 结束\n```\n\n此事件监听方法用于设置对点击\
  \ `convert` 按钮的响应。这一点，我们必须重写名为 `action` 的事件处理器。在事件处理器内部，会将对象的标识与字符串 \"Convert\"\
  （即我们按钮上的标记）进行比较。事实上，这里可以不通过比较，因为在我们的示例中只有一个我们需要做出反应的事件事件。然而，以后当我们需要向 applet 添加其他按钮以及处理鼠标事件时，我们将使用这种机制来识别发生的事件。表\
  \ 7-5 列出了按钮类的方法。\n\n表 7-5. 按钮类方法\n\n## 方法描述\n\n`getLabel()` 返回按钮上的标签。`paramString()`\
  \ 返回按钮选项的字符串。`setLabel(String)` 设置按钮上的标记。\n\n现在，我们需要创建一个 HTML 页面，在其中嵌入我们的重新计算 applet。创建一个空白页面并将下面的代码放入其中。然后将\
  \ HTML 文件保存到与 applet `currencyConverter2.class` 相同的目录下。然后可以使用以下代码将 HTML 页面加载到 Netscape：\n\
  \n```html\n<applet code=\"currencyConverter2.class\" height=200 width=200></applet>\n\
  ```\n\n# 开关 (Switches)\n\n为了吸引全世界的客户，我们的旅行社必须提供许多不同货币汇率重新计算金额的能力。让我们创建几个单选按钮（复选框），以便用户可以选择转换为美元的金额。就像\
  \ HTML 管理机构一样，通过：\n\n```java\nbutton ConvertButton = new Button(\"convert\");\n\
  ```\n\n此行创建了一个名为 \"UK Pound\" 的新开关，其默认值为 false。要创建一个指示其所属组及其状态的开关，请使用以下构造函数：\n\n\
  ```java\ncheckbox UKCheck = new Checkbox(\"UK Pound\", CurrencyGroup, false);\n\
  ```\n\n这创建了一个标记为 \"UK Pound\" 的单选按钮，属于 `CurrencyGroup` 组并默认为 false。将开关汇集的组是类组的实例。这里在之前的示例中使用了：\n\
  \n```java\nCheckboxGroup CurrencyGroup = new CheckboxGroup();\n```\n\n让我们先创建另一个。\n\
  \n现在编写检查，允许发现从两个开关——英镑或法郎——中哪一个被选定：\n\n```java\nif (UKCheck == CurrencyGroup.getCurrent())\n\
  \n{  System.out.println(\"UK Pound is checked\");  }  else\n\nSystem.out.println(\"\
  Franc is checked\")\n```\n\n现在我们只需要重新货币转换 applet，以便根据所选的单选按钮使用不同的转换因子。此版本 applet\
  \ 的文本显示在示例 7-3 中。在这里我们将再次使用拦截 `enter` 键，因此此版本中缺少 `Convert` 按钮。而在第一个版本中，按下 `Enter`\
  \ 会启动重新计算（更多细节请参阅上面的“键盘输入”部分）。使用开关的 applet 视图如图 7-3 所示。\n\n![](img/image0245.gif)\n\
