  \"+column+row);\n    }\n}\n```\n\n## 编写 applet\n\n我们创建了一个独立的窗口，包含一个通用游戏面板和玩家所需的信息。现在我们可以开始编写自己的\
  \ applet 了。我们将从小开始，根据需要添加更多功能。applet 的首次实现必须能够连接到服务器并为玩家提供一个窗口，允许从列表中选择伙伴。一旦接收到包含\
  \ `<12>` 的行，applet 必须将其传递给 `ChessFrame` 类，并在需要时构造后者。此外，applet 向服务器发送游戏结束的信号并将此信息传输到\
  \ `ChessFrame`。这里是原始的 applet `ChessClient`：\n\n```java\nimport ChessFrame; \nimport\
  \ PackerLayout;\nimport java.applet.*;\nimport java.awt.*;\nimport java.net.*;\n\
  import java.util.*;\nimport java.io.*;\nimport ventana.io.*;\n\npublic class ChessClient\
  \ extends Applet implements Listener {\n    private string user;\n    private label\
  \ title;\n    private TextArea output;\n    private TextField input;\n    private\
  \ Hashtable games;\n    private Hashtable pieceImages;\n    private Socket ChessSocket;\n\
  \    private inputstream ChessInput;\n    private OutputStream ChessOutput;\n  \
  \  private InputStreamHandler ChessInputHandler;\n    private MediaTracker tracker;\n\
  \    private Font fixed;\n    private Font pretty;\n```\n\n在 `init` 过程中初始化 applet\
  \ 时要的第一件事是为整个 applet 设置两种字体，`pretty` 和 `fixed`。\n\n\n\n当程序启动时，applet 会通过 socket\
  \ 与服务器建立连接。对于一个 `InputStream` 对象，会创建一个相应的 `InputStreamHandler`。正如你记得的，这个类从输入流中读取行并使用\
  \ `receiveInput` 方法将它们传递出去。最后，生成一个哈希表用于存储 `ChessFrame` 对象。大多数用户倾向于一次只玩或看一局游戏，因此哈希表初始化为存储一个元素的元素的空间：\n\
  \n```java\npublic void start() {\n  try {\n    String ChessHost = hetParameter(\"\
  HOST\");\n    if (ChessHost==null) {\n      ChessHost = getCodeBase().getHost();\n\
  \    }\n    ChessSocket = new Socket(ChessHost, 5000);\n    ChessInput = ChessSocket.getInputStream();\n\
  \    ChessOutput = ChessSocket.getOutputStream();\n    ChessInputHandler = new InputStreamHandler(ChessInput,\
  \ this);\n  } catch (Exception e) {\n    handleException(e);\n  }\n  games = new\
  \ Hashtable(1);\n}\n```\n\n任务完成后，applet 会关闭 `InputStreamHandler`、网络流和 socket，并清理输入窗口和显示信息：\n\
  \n```java\npublic void stop() {\n  try {\n    ChessInputHandler.close();\n    ChessOutput.close();\n\
  \    ChessInput.close();\n    ChessSocket.close();\n  } catch (IOException e) {\n\
  \    handleException(e);\n  }\n  output.setText(\"\");\n  input.setText(\"\");\n\
  }\n\npublic void handleException(Exception e) {\n  e.printStackTrace();\n}\n```\n\
  \n`writeOutput` 方法用于向服务器发送数据。该方法是唯一专门用于数据传输的方法，这带给了我们两个优势：首先，我们不需要在程序中每个需要输出数据的地方重复相同的语句；其次，由于方法中使用了\
  \ `synchronized` 关键字，我们保证了程序的多个线程不会同时开始传输。在早期变量 `user` 尚未被赋值，但一旦第一次调用 `writeOutput`，它就会被赋值。这是因为服务器上处理的首条命令是用户名：\n\
  \n```java\nprotected synchronized void writeOutput(String s) {\n  if (user==null)\
  \ {\n    user = trim();\n  }\n  byte b[] = new byte[s.length()];\n  s.getBytes(0,\
  \ s.length(), b, 0);\n  try {\n    ChessOutput.write(b);\n  } catch (IOException\
  \ e) {\n    handleException(e);\n  }\n}\n```\n\n每当接收到完整的输入字符串时，`InputStreamHandler`\
  \ 对象就会调用 `receiveInput` 方法。如果接收到的字符串为空或仅包含服务器提示，则会被完全忽略。如果接收到的字符串以字符 `<12>` 开头，我们知道这是一个更新游戏状态的信号——将调用\
  \ `parseBoard` 方法。如果该行看起来是游戏结束的信号，则会对其编号进行分析。如果编号 `game` 在我们的哈希表中，将调用 `ChessFrame`\
  \ 对象的 `endGame` 方法，并从哈希表中移除相应的游戏。如果字符串不匹配上述任何事件，则被视为标准的服务器命令，并在窗口中提取提取信息：\n\n```java\n\
  public void receiveInput(InputStreamHandler ish, Object o) {\n  String s = (String)o;\n\
  \  if (s.trim().equals(\"\") || s.trim().equals(\"fics%\")) {\n    return;\n  }\n\
  \  if (s.trim().startsWith(\"<12>\")) {\n    parseBoard(s.trim());\n  } else if\
  \ (s.trim().startsWith(\"{Game\")) {\n    StringTokenizer st = new StringTokenizer(s);\n\
  \    String token = st.nextToken();\n    //{Game String number = st.nextToken();\
  \ //number\n    ChessFrame frame = (ChessFrame)games.get(number);\n    if (frame!=null)\
  \ {\n      token = st.nextToken(); //(player1 token = st.nextToken(); //vs. token\
  \ = st.nextToken(); //player2)\n      token = st.nextToken(); //loser\n      frame.endGame(token);\n\
  \      games.remove(number);\n    }\n  } else {\n    output.appendText(s+\"\\n\"\
  );\n  }\n}\n```\n\n`receiveInput` 方法是唯一能发现游戏更新消息的方法。该行的第 16 字段是游戏编号。如果游戏不在我们的表中，我们会创建一个\
  \ `ChessFrame` 对象并将其编号插入表中。最后我们调用刷新窗口的方法 `updateGame`：\n\n```java\nprotected void\
  \ parseBoard(String s) {\n  StringTokenizer st = new StringTokenizer(s);\n  String\
  \ token = st.nextToken();\n  if (! token.equals(\"<12>\")) {\n    output.appendText(\"\
  oops...  \"+ token);\n    return;\n  }\n  for (int i=0; i<<16; i++) {\n    token\
  \ = st.nextToken();\n  }\n  ChessFrame frame = (ChessFrame)games.get(token);\n \
  \ if (frame==null) {\n    frame = new ChessFrame(this, user, fixed);\n    games.put(token,\
  \ frame);\n  }\n  frame.updateGame(s);\n}\n```\n\n所有与玩家移动相关的开发进展都在这里处理。如果位置事件是一个\
  \ `ChessFrame` 对象，则该事件必须是玩家回合生成的棋盘，也就是说，它必须重定向到玩家。如果目标事件是输入框，则玩家生成了棋盘：\n\n```java\n\
  public boolean action(Event evt, Object arg) {\n  if (evt.target instanceof ChessFrame)\
  \ {\n    writeOutput((String)arg+\"\\n\");\n    return true;\n  } else if (evt.target==input)\
  \ {\n    writeOutput((String)arg+\"\\n\");\n    input.setText(\"\");\n    return\
  \ true;\n  } else {\n    return false;\n  }\n\n```\n\n该国际象棋客户端显示了名称以及输入命令的字段。图 18-2\
  \ 重现了国际象棋 applet 的图像。\n\nImages/image0933\n\n# 可能的改进\n\n我们的国际象棋 applet 已经发布给公众，并且看起来良好。关于如何改进的建议如下：首先，登录程序没有屏蔽输入的密码；其次，有些玩家发现难以跟踪多人，因此需要一个独立的窗口。我们决定改进\
  \ applet，发布下一个版本。\n\n## 登录窗口\n\n决定将登录窗口设计为一个独立的窗口。当用户连接到服务器时，applet 会监控登录窗口。一旦登录窗口形成，登录程序就会开始。登录框由两个文本输入框（一个用于用户名，一个密码）和一个启动程序的按钮组成。作为登录窗口，可以使用标准的对话框，因为它具有模态属性。这意味着程序不会对与对话框无关的事件做出反应。遗憾的是，在编写时，Netscape\
  \ Navigator 2.0 在 Solaris 上的实现有些缺陷，所以我们没有使用它。以下是 `userlogin` 类的源码：\n\n```java\n\
  import java.awt.*;\nimport java.util.*;\n\npublic class UserLogin extends frame\
