  \n## 更改 `Graphics` 类\n\n许多方法允许你修改 `Graphics` 类的功能。你可以更改默认颜色和字体，还可以复制和限制屏幕区域。这些方法列在表\
  \ 9-3 中。\n\n表 9-3 `Graphics` 类的其他方法\n\n### 方法说明\n\n`Graphics create()` 创建一个新的图形对象，它是当前对象的拷贝。\n\
  \n`Graphics create(int, int, int, int)` 创建一个由四个整数定义的矩形边界内的新 `Graphics` 对象。对对象所所的任何更改将反映在给定的矩形区域。\n\
