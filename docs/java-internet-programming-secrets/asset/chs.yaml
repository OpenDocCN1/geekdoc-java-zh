  \ pos 字节处。 |\n| `public void write(int b)` 将 int b 写入文件，首先将其转换为字节。 |\n| `public\
  \ void write(byte[] b)` 写入字节数组。 |\n\n# 机器依赖型方法\n\n\n\n\n\n首先，有必要澄清为什么你不能直接使用集成库\
  \ `C`。我们无法将某些库 `C` 集成到 applet 中并将此 applet 发到互联网，使其从客户端的库中获取所需的所有内容。如果存在这种可能性，我们早就会在这书中告诉大家了！\n\
  \n`C` 库必须位于程序实际执行的位置。事实上，我们将 `C` 程序的文本放在 Java 类中，然后通过 Java 类调用 `C` 函数。这些函数构成了动态库（`DLL`），并通过依赖于机器或特定的的原生（native）方法可用。\n\
  \n## 当需要机器依赖的库时\n\n在编写个人应用程序时，使用 `DLL` 是理想的。因为 `C` 是一门极其流行的语言，通常发现你正准备要做的事情已经用 `C`\
  \ 库实现了。得益于此，你不需要在 Java 中重写一切——只需引用 `DLL` 即可。\n\nApplet 程序员也可以使用 `DLL`，但程度比编写独立应用程序时要低。由于\
  \ `C` 语言不是平台无关的，`DLLs` 无法通过互联网传输；否则它们早晚会运行在无法满足其要求的平台。。此外，在使用 `DLL` 时存在与 applet\
  \ 安全相关的问题，因为在 `C` 创建时，分布式计算机尚未提供安全信息。\n\n然而，某些支持 Java 的 Web 浏览器允许 applet 使用之前在客户端安装的任何库。这对于编写\
  \ applet 的程序员意味着什么？如果你在组织的内网中操作，你可以确保客户端安装了简单的 `C` 库，并确保它不包含病毒且不会被滥用。这样你就可以让 applet\
  \ 执行一些你不允许所有 applet 执行的操作（例如访问文件系统）。\n\n如果压缩软件是你喜欢的玩具，你可以分发包含 `DLL` 的 CD，或者编写一个程序从互联网下载该软件。在检查\
  \ `DLL` 病毒后，可以将其安装，以便支持 Java 的 Web 浏览器找到它。你的库将不受底层 applet 模型的限制，同时从与支持 Java 的 Web\
  \ 浏览器的连接中受益。例如，你可以使用 `DLL` 将你的表格程序直接与汇率服务器相关的 applet 链接。或者由于图形是通过你的 `DLL` 创建并访问的，你可以让网络游戏运行更快。这样你就可以将\
  \ Java 网络属性纯粹用于通信，而不是用于下载沉重的资源。\n\n因此，`DLLs` 对于开发 Netscape 非常有用。在继续构建 `DLL` 的所有技巧之前，我们需要理解为什么\
  \ `DLLs` 对 Java 运行时外壳很重要。Java 是一种平台无关的语言，但它仍然需要与操作系统建立某种连接。这种连接由连接到 API 的 `DLLs`\
  \ 提供。`DLLs` 在决定 Java 程序的某些在给定环境中允许的操作起着重要作用。因为 `DLLs` 不是平台无关的，它们在将 Java 整体移植到新平台时起着关键作用。在本章后面，当我们研究创建\
  \ Java 包的问题时，我们将看到构建 API 如何更容易将其移植到不同的执行外壳。\n\n## 解释机器依赖方法\n\nJava 是一种平台无关的语言，但用\
  \ Java 编写的程序在执行期间实际上在与运行的平台交互。纯 Java 程序可以在许多不同的平台上绘制图形，尽管所有平台的图形完全不同。对于所有的低级 I/O（包括键盘和鼠标输入、图形和声音输出以及网络操作），Java\
  \ 程序必须对操作系统进行特定平台的调用。这些调用是通过动态库（`DLL`）实现的，它们是运行时外壳的一部分。\n\nJava 语言通过 `native` 关键字完全隔离了其特定平台的调用。如果你使用\
  \ `native` 关键字，这意味着与方法对应的函数是用另一种语言编写的，为了调用此方法，`DLL` 必须加载到执行系统中。目前唯一可能用来编写 `DLL`\
  \ 的另一种语言是 `C`。由于 `C++` 完全包含了 `C`，技术上也许可以使用 `C++` 编写 `DLL` 语言 `C++`。但遗憾的是，为了将你的 `C++`\
  \ 程序胶合到 Java 程序中，你仍然必须使用 `C`。当我们实际上构建 `DLL` 时，这些问题就会变得显而易见。\n\n在许多方面，原生（native）方法与其他方法非常相似。奇怪的是，这种相似性包括了将\
  \ Java 对象作为参数、返回 Java 对象以及抛出异常的能力。然而，它们有两个非常明显的区别。首先，原生方法没有体，而且编译器禁止它拥有体：\n\n```java\n\
  public native String getUserName();\n```\n\n原生方法的功能从操作系统加载的某一个特定 `DLL` 中获取，这是第二个区别。当包含原生方法的类被实现时，必须加载\
  \ `DLL`。现在我们定义了自己的类-包装器类，它加载一个名为 `Profile` 的 `DLL`。该类的目的是允许 applet 读取客户端的文件，其中包含用户的信息。我们创建了用\
  \ Java 编写的两个异常类 `NoProfileException` 和 `ProfileWriteAllowedException`。\n\n示例 12-1.\
  \ `Profile` 类。\n\n```java\nimport java.awt.Color;\n\nclass Profile {\n    private\
  \ int cfilepointer=0;\n\n    public Profile() throws UnsatisfiedError, NoProfileException\
  \ {\n        try {\n            System.loadLibrary(\"profile\");\n        } catch\
  \ (UnsatisfiedLinkError e) {\n            throw e;\n        }\n        cfilepointer\
  \ = openProfile();\n        if (cfilepointer == 0) {\n            throw new NoProfileException();\n\
  \        }\n    }\n\n    private native int openProfile();\n\n    public native\
  \ void setPublicKey(byte[] pubKey[]);\n\n    public native String getAttrib(String\
  \ key);\n\n    public native Color getFavoriteColor();\n\n    public synchronized\
  \ native void setAttrib(String key, String value) throws ProfileWriteAllowedException;\n\
  }\n```\n\n\n\n\n\n通常也适用于包含 Java 方法的类，尽管存在一些细微差别。它们主要与确保库已加载有关。在我们的示例中，这一点尤为重要。如果我们编写了一个包含我们类的\
  \ applet，并且它到达了一个没有该 DLL 的客户端，我们希望我们的 applet 能够恢复。为了这一点，我们在 `constructor`（构造函数）中上传\
  \ applet，并强制它抛出一个 `UnsatisfiedLinkError`。\n\n下载库也会给 `static` 方法带来问题。在任何其他情况下，我们所有的方法都应该定义为静态的。但如果我们将所有方法设为静态，构造函数将不会被调用，库也不会被加载。可以通过在静态块中加载库来解决：\n\
  \n```java\nclass LocalProfile {\n    // 变量\n    static {\n        try {\n      \
  \      System.loadLibrary(profile);\n        } catch (UnsatisfiedLinkError e) {\n\
  \            // 错误处理\n        }\n    }\n    // 静态方法\n}\n```\n\n然而，将库加载到静态块中会使得发生\
  \ `UnsatisfiedLinkError` 后的恢复变得困难。在很多情况下这并不重要。但如果你的 applet 或应用程序的目的是高速图形传输，并且你为此使用了你自己的程序，那么如果你无法下载库，你很可能无法停留在表面。在这种情况下，礼貌地离开也许是既定状况的最好办法。\n\
  \n## C 语言训练库\n\n在定义了我们自己的封装类使用的方法后，我们可以开始编译 Java 程序了。由于库已加载到执行系统中，编译器不需要了解该库的大部分内容。当然，在如何使用\
  \ dll 之前，我们应该编写并编译它，以便它可以被下载。\n\n然而，在进入这些内容之前，需要说明一点：从 Java 程序创建与 dll 相关的接口非常像在玩“转转盘”游戏。如果你是那种觉得\
  \ C 预处理器既困惑又美妙的人，这一节将满足你对 `/java/include/**.h` 文件秘密的知识的渴求。否则，你只需要将这一部分视为一个配方。主要组件是\
  \ `javah` 程序。`javah` 是创建一个特殊文件的工具，这些文件定义了我们的 Java 原生方法和数据类型。在 Java 执行魔术操作之前，我们需要编译一个包含我们方法的类——这是我们的第一步。对于编译，我们像平常处理\
  \ `Class` 一样使用 `javac`。\n\n我们的第二步将使用 `javah` 为我们的类创建头文件。对于类 `LocaProfile`，命令请求看起来如下：\n\
  \n```bash\njavah LocalProfile\n```\n\n`javah` 查看 `LocalProfile.class` 文件，并为原生方法以及\
  \ `LocalProfile` 类中的其他元素生成 C 定义。它们被放置在扩展名为 `.h` 的文件中；在本例中为 `LocalProfile.h`。这就是我们在阶段创建的内容，在我们编写\
  \ DLL 时需要的。现在我们有了头文件，需要创建一个扩展名为 `.c` 的文件，将其包含在我们的库中。这个文件是连接 DLL 到 Java 程序的运行时系统。让我们用以下命令创建此文件：\n\
  \n```bash\njavah -stubs LocalProfile\n```\n\n此命令创建了一个名为 `LocalProfile.c` 的文件，根据你的编程方法，这个文件可能看起来丑陋或优雅。无论如何，我们永远不会再看到这个文件了。与\
  \ `LocalProfile.h` 不同，它不包含我们后续需要的信息。\n\n这结束了我们“转转盘”游戏的第一部分；现在我们可以真正开始编写 DLL 了。以下是在开始\
  \ C 程序之前我们必须阅读的魔术咒语概述：\n\n*   使用 `javac compile file .java` 编译包含自有方法的类。\n*   使用\
  \ `javah` 创建一个 `.h` 文件，定义你自己的封装类。\n*   使用 `javah -stubs` 创建一个 `.c` 文件，用于构建链接的可执行系统。\n\
  \n在进一步移动之前，让我们再多研究一下 `javah`。首先，可以给它传递多个参数。如果你写了多个类来加载同一个 DLL，请编译它们，然后在 `javah`\
  \ 和 `javah -stubs` 之后列出它们。此外，添加一些带有你需要的选项的命令行可能是有用的。表 12-8 中描述的任何选项组合都应该放在 Java\
  \ 类名之前。\n\n### 表 12-8. `javah` 选项\n\n| 选项 | 说明 |\n| :--- | :--- |\n| `-o outputfile`\
  \ | 将输出数据放入 `outputfile` 而不是默认文件。 |\n| `-d directory` | 将文件保存在 `directory` 中，而不是当前目录。\
  \ |\n| `-td temp directory` | |\n| `-classpath classpath` | 将临时文件存储在 `tempdirectory`\
  \ 而不是特定的默认 `/temp`。在目录 `classpath` 中查找 API 扩展的 `.class` 文件，但不在 `/usr/local/java`\
  \ 或环境变量 `CLASSPATH`（如果已设置）。 |\n| `-verbose` | 指定 Java 在屏幕上打印详细操作信息。 |\n\n我们现在准备好实际创建我们的动态链接库了。但在开始编写它的函数之前，我们需要定义一些格式。首先，我们需要为我们的\
  \ `.c` 文件命名。我们不能将其命名为 `LocalProfile.c`，因为 `javah -stubs` 已经创建了同名文件。名称是任意的，但为了避免混淆，我们将文件命名为\
  \ `profile.c`。下一步是制作我们的预处理器定义，如下所示：\n\n```c\n#include <StubPreamble.h>\n#include\
  \ <java.h>\n#include \"LocalProfile.h\"\n```\n\n这些头文件将 C 结构转换为 Java 类型。`java.h`\
  \ 头文件为提供了处理 Java 的特殊函数。然后我们必须包含 DLL 所需要的 C 头文件。这些文件的范围从库到平台。这里是我们的 profile 需要的文件：\n\
  \n```c\n#include <sys/types.h>\n#include <sys/param.h>\n#include <stdio.h>\n#include\
  \ <fcntl.h>\n#include <errno.h>\n```\n\n接下来是完成的步骤列表：\n\n1. 编写并编译 `Class`。\n2. 在编译类上运行\
  \ `javah`。\n3. 在编译类上运行 `javah -stubs`。\n4. 在 `c` 中运行自有方法，将在下一节考虑。\n\n## 在 C 中实现自有方法\n\
  \n现在格式工作已经完成，我们可以开始编写函数了。自有方法的工作方式与其他方法相同，困难在于如何强制 C 函数像我们封装类中的内部方法一样工作。关于如何实现此的许多秘密可以通过查看\
  \ `LocalProfile.h` 文件找到。\n\n示例 12-2 文件 `Profile.h`\n\n```c\n/* 不要编辑此文件 - 它是机器生成的\
  \ */\n#include <native.h>\n\n/* 类 LocalProfile 的头文件 */\n#ifndef _Included_LocalProfile\n\
  #define _Included_LocalProfile\ntypedef struct ClassLocalProfile {\n    long cfilepointer;\n\
  } ClassLocalProfile; HandleTo(LocalProfile);\n\nexternal long LocalProfile_openProfile(struct\
  \ HLocalProfile*);\n\nexternal void LocalProfile_setPublicKey(struct HLocalProfile*,HArrayOfByte*);\
  \ struct java_lang_string;\n\nexternal struct java_lang_string *LocalProfile_getAttrib(struct\
  \ HLocalProfile*,struct java_lang_string*); external struct java_awt_Color *LocalProfile_getFavoriteColor(struct\
  \ HLocalProfile*); external struct java_awt_String *LocalProfile_setAttrib(struct\
  \ HLocalProfile*,struct java_lang_string*,struct java_lang_string*);\n#endif\n```\n\
  \n\n\n\n\n第一个结构（`struct`）是 C 中对 Java 类的表示。正如你记得的，自定义方法的行为与其他方法相似，因此可以访问包含它们的类的私有成员。`ClassLocalProfile`\
  \ 结构使得这成为可能。注意，该结构除了包含等效 Java 原生方法的参数外，还被传递给我们的所有函数。这确保了数据被妥善地隐藏，同时允许我们的 C 函数成为该类的真实元素。\n\
  \n结构体之后是我们自定义方法的 C 函数定义。简单来说，编写一个 DLL 意味着定义这些函数。但为了实现这一点，你需要克服 Java 和 C 之间的差异：\n\
  \n* `Java` 类型应转换为 `C` 中正确的类型。\n* 我们应该具备从 `DLL` 访问类的其他元素的能力。\n* 我们需要从 `Java` 到 `C`\
  \ 数组的翻译机制。\n* 我们应该能够从 `DLL` 创建 `Java` 对象，并访问现有 `Java` 对象中的方法、公共元素和变量。\n* 我们有必要从\
  \ `DLL` 提取异常。\n\n在我们的示例中，这些都实现了。让我们从最简单的函数开始，逐渐过渡到 C 端实现最困难的部分。我们的自定义方法中，带有 `private`\
  \ 修饰符的 `validProfile` 和 `openProfile` 是容易实现的，因为它们只需要知道如何将 Java 基本类型翻译为 C 类型。表 12-9\
  \ 显示了如何进行这种翻译：\n\n**表 12-9. Java 原始类型到 C 类型的翻译**\n\n| Java 原始类型 | C 等效类型 |\n| :---\
  \ | :--- |\n| boolean | long |\n| character | `unicode` |\n| byte | `char` |\n|\
  \ short | short |\n| int | long |\n| long | `int64_t` |\n| float | float |\n| double\
  \ | double |\n\n理解了如何将原始类型从 Java 翻译到 C 后，我们可以对 `LocalProfile_openProfile` 进行一些工作。该方法简单地打开变量\
  \ `APPLETPROFILE` 描述的文件：\n\n```c\nlong LocalProfile_openProfile(struct HLocalProfile\
  \ *this) {\n    char profileName[1024];\n    strcpy(profileName, getenv(APPLETPROFILE));\n\
  \    return (long)fopen(profileName, \"r\");\n}\n```\n\n正如你记得的，这个带有 `private` 修饰符定义的方法用于给\
  \ `CFilePointer` 变量赋值。由于其他自定义方法需要此文件，因此将其作为对象的一部分是有意义的。当需要访问它时，我们将通过 `struct HLocalProfile`\
  \ 指针来实现，该指针在执行任何原生方法时传递。在编译你自定义的包装类生成的 `struct` 时，它的名称以 \"H\" 开头并以类名结尾。\n\n别担心，我们不需要在访问自定义包装器实例元素之前使用这个结构。对于这一点，实现\
  \ `_dynamic_method` 函数就足够了。它可以同时用于你自定义包装器的实例，也用于其他副本（稍后我们将进行讨论）。现在我们需要对原生包装实例的数据成员有更多的访问权限。为了访问\
  \ `localprofile` 中的 `CFilePointer` 变量，让我们使用下面给出的外部宏。\n\n**示例 12-3. 自定义方法的简单实现。**\n\
  \n```c\nlong LocalProfile_getAttrib(struct HLocalProfile *this, HJava_lang_String\
  \ *key) {\n    FILE *profile = (FILE *)unhand(this)->CFilePointer;\n    /* 函数的其余部分\
  \ */\n}\n```\n\n为了真正实现其余函数，我们应该能够在 C 中访问来自 Java 的数组和行。这将在下一节中解释。\n\n### C 中的 Java\
  \ 数组和行 \n\n在我们的库中，我们经常需要数组和字符串，`java/include/*.h` 文件包含了处理它们的必要工具。让我们从字符串和 `LocalProfile_getAttrib`\
  \ 函数开始。该函数将我们的配置文件视为一个哈希表。它会寻找形式为 `key=value` 的字符串，其中 `key` 是传递给我们的字符串。如果函数无法找到该键，它将返回\
  \ `null`。否则，它将返回紧跟 `=` 符号之后并在遇到第一个空格之前结束的字符串。\n\n为了做到这一点，之前需要请求描述我们 Java 字符串的符号数组。如果我们找到了目标值，它将需要从\
  \ `Hjava_lang_String` 结构中的符号数组翻译出来，运行时包装器会将其转换为 `String` 类型的值。执行此操作的函数描述在表 12-10\
  \ 中，还有其他可用的函数。\n\n**表 12-10. 用于处理行的 Java 函数**\n\n| 函数描述 | 描述 |\n| :--- | :--- |\n\
  | `void javaString2CString(Hjava_lang_String *jstring, char *buf, int size)` | 将\
  \ Java 字符串转换为 C 数组 `buf`。 |\n| `char *makeCString(Hjava_lang_String *jstring)` |\
  \ 返回 C 数组形式的 Java 字符串表示。 |\n| `int javaStringLength(Hjava_lang_String *jstring)`\
  \ | 返回字符串长度。 |\n\n现在我们可以像下面的示例所示使用 `LocalProfile_getAttrib`。\n\n**示例 12-4. 在 C 中使用字符串。**\n\
  \n```c\nlong LocalProfile_getAttrib(struct HLocalProfile *this, HJava_lang_String\
  \ *key) {\n    char Ckey[1024];\n    char value[1024];\n    HJava_lang_String *value;\n\
  \    FILE *profile = (FILE *)unhand(this)->CFilePointer;\n    int keyLength = javaStringLength(key);\n\
  \    javaString2CString(key, Ckey, keyLength);\n    strcat(Ckey, \"=%s\");\n   \
  \ rewind(profile);\n    if (fscanf(profile, Ckey, value) != EOF) {\n        return\
  \ makeJavaString(value, strlen(value));\n    } else {\n        return NULL;\n  \
  \  }\n}\n```\n\n在示例 12-4 中，我们克服了 Java 和 C 字符串之间的差异。现在来看使 Java 和 C 数组兼容的特性。虽然 C 数组元素有序集合，但\
  \ Java 数组是特殊类型的有序集合。我们不能只创建一个 C 数组并期望 Java 程序知道如何处理它。我们应该在库中确定我们尝试描述的 Java 数组类型。在表\
  \ 12-11 中提供了简单类型的信息。关于对象的将在我们在确定如何创建它们时给出。第二列表示数组类型的预定义结构。像一样，为了访问数据部分数组，可以使用外部宏。第三列包含描述这种类型的常量。为了正确分配空间，常量将传递给宏\
  \ `ArrayAlloc`。\n\n**表 12-11. C 中的 Java 数组**\n\n| Java 数组 | C 表示 | 标记类型 |\n| :---\
  \ | :--- | :--- |\n| boolean[] | `HArrayOfInt *` | `T_BOOLEAN` |\n| byte[] | `HArrayOfByte\
  \ *` | `T_BYTE` |\n| char[] | `HArrayOfChar *` | `T_CHAR` |\n| short[] | `HArrayOfShort\
  \ *` | `T_SHORT` |\n| int[] | `HArrayOfInt *` | `T_INT` |\n| long[] | `HArrayOfLong\
  \ *` | `T_LONG` |\n| float[] | `HArrayOfFloat *` | `T_FLOAT` |\n| double[] | `HArrayOfDouble\
  \ *` | `T_DOUBLE` |\n| Object | `HArrayOfObject *` | `T_CLASS` |\n\n\n\n\n当我们想要创建一个\
  \ Java 数组时，我们使用 `ArrayAlloc` 函数，它依赖于两个参数。第一个参数指定数组类型，描述见我们的第二列。第二个参数指定数组所需的尺寸。然后我们再次应用\
  \ `Togo` 外部宏，以真正应用于部分数据数组。下一章程序创建了一个十字节的数组，并为其分配了从 0 到 9 的值。你如何记住，Java 的 `byte`\
  \ 在 `C` 中是一个字符，因此我们可以替换下面代码段中的 `byte` 符号：\n\n```c\nHArrayOfByte *bytes=ArrayAlloc(T_BYTE,10);\n\
  for (int i=0;i;i++) {\n    unhand(bytes)->data[i]=(char)i;\n}\n```\n\n现在我们可以开始编写\
  \ `LocalProfile_getPubKey()` 函数了。让我们使用环境变量 `APPLETPUBKEY` 来查找文件所在，并使用库函数 `stat`\
  \ 获取大小。如果找不到文件，该函数将返回 `null`。\n\n示例 12-5。C 上的 Java 数组。\n\n```c\nHArrayOfByte *LocalProfile_getPubKey(struct\
  \ HLocalProfile *this) {\n    int i;\n    FILE *pubKeyFile=NULL;\n    char pubKeyFileName[1024];\n\
  \    char *buf=NULL;\n    HArrayOfByte *pubKey=NULL;\n    int counter=0;\n\n   \
  \ strcpy(pubKeyFileName,getenv(\"APPLETPUBKEY\"));\n    pubKeyFile=fopen(pubKeyFileName,\"\
  r\");\n\n    if (pubKeyFile==NULL) return NULL;\n    pubKey=(HArrayOfByte *)ArrayAlloc(T_BYTE,256);\n\
  \n    buf=unhand(pubKey)-body;\n\n    while (!feof(pubKeyFile) && counter) {\n \
  \       buf[counter] = (char)fgetc(pubKeyFile);\n        counter++;\n    }\n   \
  \ return pubKey;}\n```\n\n---\n\n## Java 对象的创建与处理\n\n在了解了体积表示以及如何处理简单类型之后，我们现在可以开始在库内部创建\
  \ Java 对象。这是编写 DLL 最混乱的部分，因为这是 Java 和 C 之间差异最显著的地方。可以分别使用表 12-12 和 12-13 中给出的结构和函数解决问题。\n\
  \n### 表 12-12.Java 辅助结构\n\n#### 结构描述\n\n- `ExecEnv`: 执行外壳。`NULL` 指定当前外壳，这通常是你需要的。\n\
  - `ClassClass`: 结构数据，包含关于 Java 类的信息。\n- `Signature`: 字符串 `c`，描述构造函数/方法具有什么类型的参数。\n\
  \n### 表 12-13.Java 辅助函数\n\n#### 函数描述\n\n- `hobject *execute_java_constructor(ExecEnv\
  \ *E, char *className,ClassClass *cb, char * signature`\n- `ClassClass *FindClass(ExecEnv,\
  \ char *className,bool_t resolve)`\n- `long execute_java_static_method(ExecEnv *E,\
  \ ClassClass *cb,char *methodName, char signature,...)`\n- `long execute_java_dynamic_method(ExecEnv\
  \ *E, HObject *obj,char *methodName,char signature)`\n\n根据 `signature` 给定的参数创建 `className`\
  \ 的实例。\n返回 Java 类 `className` 的表示 `C`。\n实现由 `cb` 描述的 Java 类静态方法 `methodName`。\n\
  实现 Java 对象 `obj` 的动态方法。\n\n由此可见，在 Java 中非常简单的操作在 `C` 中需要大量工作。从表 12-13 可以看出，构造函数、静态方法和动态方法需要调用不同的函数。\n\
  \n当然，Java 语言也迫使我们区分函数类型。但在 Java 中，这样做要优雅得多，而且运行时外壳在创建之前对 Java 定义 `class` 的视图，这是程序员检查正确性的另一种方式。当我们处理\
  \ DLL 时，必须处理 `FindClass` 和函数 `execute_java_constructor`。\n\n为了确保我们的参数被正确传递，我们必须执行一些隐性操作。由于方法可以被重载，你需要显式声明我们需要传递的一组参数。此外，有必要描述参数类型和返回值以构建相应的\
  \ C 表示。这里各处的签名（`signature`）派上了用场。我们的辅助函数根据 `signature` 决定了期望什么样的质量参数以及必须返回什么。\n\n\
  `Signature` 包含了表 12-13 中的某些键，还包含了包含参数的外部和内部括号。\n\n### 表 12-14.Java 签名键\n\n#### Java\
  \ 键类型\n\n- `Z`: 布尔值\n- `B`: byte\n- `C`: char\n- `F`: float\n- `S`: short\n- `V`:\
  \ void\n- `[]`: 任意类型的数组\n- `L*`: 任何 Java 对象，* 替换为类名\n\n签名语法如下：`(参数键)`\n例如，一个没有任何参数的方法返回\
  \ `V`。表 12-15 中是一些示例。\n\n### 表 12-15.签名示例\n\n#### 构造函数/方法\n\n- `hashtable()`: `Z`\n\
  - `Integer(String)`: `Ljava/lang/String;`\n- `Integer(int)`: `I`\n- `boolean beginsWith(String)`:\
  \ `Ljava/lang/String;`\n- `boolean beginsWith(int)`: `I`\n- `long beginsWith(String)`:\
  \ `Ljava/lang/String;`\n- `long beginsWith(int)`: `I`\n- `long compareTo(String)`:\
  \ `Ljava/lang/String;`\n- `long compareTo(int)`: `I`\n- `long reverse(String)`:\
  \ `Ljava/lang/String;`\n- `long reverse(int)`: `I`\n- `Class reverse(String)`: `Ljava/lang/String;`\n\
  - `Class reverse(int)`: `I`\n- `Object reverse(String)`: `Ljava/lang/String;`\n\
  - `Object reverse(int)`: `I`\n*(注：原文后续存在大量重复模式，此处已根据核心内容处理)*\n\n\n\n```c\nlong sample_strToInt(Hsample\
  \ *this, java_lang_string *S) { ClassClass *cb;\nchar sig[]=\"(Ljava/lang/String;)I\"\
  ; cb=FindClass((ExecEnv *)NULL,\"java/lang/String\",TRUE); return (long)\nexecute_java_static_method((ExecEnv\
  \ *) NULL, \"parseInt\",sig,S);}\n```\n\n现在我们可以回到正在构建的库文件 DLL，并实现我们自己的 `favoriteColor`\
  \ 方法。该方法返回一个 `Color` 对象，这意味着我们必须在 `LocalProfile_favoriteColor` 中创建它。我们将要使用的构造函数看起来如下：\n\
  \n```c\nColor(int red, int green, int blue)\n```\n\n示例 12-6。在 C 中构建 Java 对象。\n\n\
  ```c\nstruct Hjava_awt_Color * LocalProfile_favoriteColor(HLocalProfile *this) {\n\
  Hjava_lang_String *RedColorParam; Hjava_lang_String *BlueColorParam; java_lang_string\
  \ *GreenColorParam; long red; long green; long blue; char sig[]=\"(III)LHjava_awt_Color\"\
  ;\nchar intSig[]=\"(LHjava_lang_String)I\"; ClassClass *colorcb;\nClassClass *Integercb;\n\
  Colorcb=FindClass((ExecEnv *)NULL,\"java/lang/Color\",TRUE); Integercb=FindClass((ExecEnv\
  \ *)NULL,\"java/Integer\",TRUE); RedColorParam=LocalProfile_getAttrib(this,makeJavaString(\"\
  red\",3)); BlueColorParam=LocalProfile_getAttrib(this,makeJavaString(\"blue\",4));\
  \ GreenColorParam=LocalProfile_getAttrib(this,makeJavaString(\"green\",5)); red=(long)\
  \ execute_java_static_method((ExecEnv *) NULL, Integercb, \"parseInt\", intSig,\
  \ RedColorParam); blue=(long) execute_java_static_method((ExecEnv *) NULL, Integercb,\
  \ \"parseInt\", intSig, BlueColorParam); green=(long) execute_java_static_method((ExecEnv\
  \ *) NULL, Integercb, \"parseInt\", intSig, GreenColorParam); return (struct Hjava_awt_Color*)\
  \ execute_java_constructor((ExecEnv *) NULL, color, color cb, sig, red, green, blue);\n\
  }\n```\n\n上述，我们构建了一个对象并立即返回它。如果需要，我们可以调用动态方法对象，适配其结构 `java_lang_Color`，然后传递其方法 `execute_java_dynamic_method`。\n\
  \n### 导出异常\n\n我们已经讨论了几乎所有允许你自己的方法表现与其他方法方式相同的内容。通过理解如何抛出异常，你可以将原生方法无限地集成到 Java 程序中。\n\
  \n为了从 DLL 抛出异常，我们将使用 `SignalError` 函数。它包含以下参数：\n\n```c\nvoid SignalError(ExecEnv\
  \ *e, char *ExceptionName, char *description);\n```\n\n现在我们可以编写 `LocalProfile` 类的最后一个函数\
  \ `setAttrib`。该方法应该从配置文件读取“write”（写入）属性并检查是否允许写入。如果条目被禁用，该方法将抛出异常。\n\n示例 12-7。从\
  \ DLL 导出异常。\n\n```c\nvoid LocalProfile_setAttrib(struct HLocalProfile *this, Hjava_lang_String*key,\
  \ Hjava_lang_String*value Hjava_lang_String *writeAllowed; writeAllowed=LocalProfile_getAttrib(this,\
  \ makeJavaString(\"write\",5));\nif (strcmp(\"yes\",makeCString(writeAllowed))!=0)\
  \ { SignalError(0, \"profileWriteUnAllowedException\", NULL); } else {writeToProfile(this,key,value);}\n\
  }\n```\n\n### 编译和使用 DLL\n\n我们已经为自己的方法编写了所有程序；现在是时候编译它们了。\n\n首先，让我们看看在 Windows 95/NT\
  \ 中如何操作。编译 DLL 你你需要 Visual C++ 2.0 或更高版本。只需进入 DOS 提示符并输入以下：\n\n```bash\nC: cl LocalProfile.c\
  \ profile.c -feprofile.dll -MD -LD javai.lib\n```\n\n然后将 `profile.dll` 的位置添加到环境变量\
  \ `LIB` 中。\n\nSolaris 用户应该输入以下（如果 Java 位于 `/usr/local/java`）：\n\n```bash\ncc -G\
  \ -I/usr/local/java/include -I/usr/local/java/include/solaris LocalProfile.c profile.c\
  \ -o libprofile.so\n```\n\n![](img/image09298.jpeg)\n\n建议：第三个参数必须根据各种 UNIX 对象进行调整。关于如何操作的详细说明，你可以在你的\
  \ JDK 文书中找到。\n\n![](img/image09299.jpeg)\n\n当 DLL 编译完成后，你就可以在程序中使用 `LocalProfile`\
  \ 类了。\n\n（注：原文中存在大量重复和错误段落，翻译已按要求整合核心逻辑。）\n\n\n\n\n```java\n} catch (IOException\
  \ e) {\n    // mistake I/O in time connections\n}\n```\n\n## 表 13-1. `Socket` 类构造函数\n\
  \n### 构造函数描述\n\n| 构造函数 |  |\n| :--- | :--- |\n| `Socket(String, int)` | 连接的主机名和端口。\
  \ |\n| `Socket(String, int, boolean)` | 主机名、端口和布尔指针 socket:：用于数据流 (true) 或数据报 (false)。\
  \ |\n| `Socket(InetAddress, int)` | 用于连接的 Internet 地址和端口。 |\n| `Socket(InetAddress,\
  \ int, boolean)` | Internet 地址、端口和布尔 socket 指针：用于数据流 (true) 或数据报 (false)。 |\n\n\
  在创建 socket 时，你可以指定要连接到哪个主机：可以使用包含主机名 hosta 的 `String` 类型变量，也可以使用特殊类 `java.net.InetAddress`。\n\
  \n这两种方法之间有什么区别？为了完全理解这一点，你需要一些关于 TCP/IP 的知识。\n\n网络上每个使用 TCP/IP 协议通信的主机（包括互联网）都被分配了一个唯一的数字标识，称为\
  \ IP 地址。IP 地址由四个字节组成，通常情况下看起来像是一个由点分隔的八进制数——例如 `127.0.0.1`。虽然 IP 地址对于计算机之间的通信非常方便，但对人们来说记忆并定期使用它们非常困难。为了缓解网络资源，互联网使用了\
  \ DNS（域名系统）。用户指定主机名，其计算机会查询本地 DNS 服务器，由其确定 IP 地址。`Socket` 类允许你指定字符串形式的主机名，或者 `InetAddress`\
  \ 形式的 IP 地址。\n\n![](img/image09302.jpeg)\n\n**建议**：给定的 socket 的 `InetAddress` 可以通过\
  \ `Socket` 类中定义的 `getInetAddress()` 方法来确定。如果你想在同一台机器上打开新连接，使用 `InetAddress` 而不是主机名可能会快一点，从而避免额外的\
  \ DNS 解析。\n\n![](img/image09303.jpeg)\n\n你可能会惊讶为什么 `java.net` 包使用 `InetAddress`\
  \ 类，而不是一个包含 IP 地址的 4 位字节数组。事实是，`InetAddress` 类额外提供了对 IP 地址操作的方法；例如，`getHostName`\
  \ 方法在 `InetAddress` 类上执行反向 DNS 解析并返回主机名。`InetAddress` 不包含常用的构造函数，但它提供了两个静态函数：`getByName`\
  \ 和 `getAllByName`，它们接收主机名 hosta 并返回与该主机相关的所有 `InetAddress`。\n\n表 13-12 列出了 `Socket`\
  \ 类的方法。`getInputStream()` 和 `getOutputStream()` 方法特别重要，因为它们被用于实际上与远程主机进行通信。所有的流都执行数据传输；在示例\
  \ 13-1 中，我们使用它们在网络上的主机之间传输数据。\n\n## 表 13-2. `Socket` 类方法\n\n| 方法 | 描述 |\n| :---\
  \ | :--- |\n| `close()` | 关闭 socket。 |\n| `InetAddress getInetAddress()` | 返回 socket\
  \ 上的 Internet 地址。 |\n| `int getLocalPort()` | 返回 socket 连接的本地端口。 |\n| `InputStream\
  \ getInputStream()` | 返回与给定 socket 相关的输入流。 |\n| `OutputStream getOutputStream()`\
  \ | 返回与给定 socket 相关的输出流。 |\n| `void setSocketFactory(SocketImplFactory)` | 为给定系统设置实现工厂。\
  \ |\n\n![](img/image09304.jpeg)\n\n**建议**：如果你的操作系统不是 UNIX 且你从本地硬盘或 CD-ROM 下载了临时\
  \ applet，示例 13-1 将无法工作（与其他示例相同），除非纯属巧合。要查找正在进行中的此 applet，请访问：`http://www.vmedia.com/vvc/onlcomp/java/chapter13/example/TimeApplet.htm`\n\
  \n![](img/image09305.jpeg)\n\n以下示例运行了一个简单的客户端。客户端连接到加载 applet 的所在主机上的时间服务器。时间服务器等待连接，报告当前时间并关闭连接。我们的客户端需要做的只是打开通信并读取数据。\n\
  \n### 示例 13-1. 临时客户端。\n\n```java\nimport java.applet.*;\nimport java.awt.*;\nimport\
  \ java.net.*;\nimport java.io.*;\n\npublic class TimeApplet extends applet {\n \
  \   private Exception error;\n    private String output;\n\n    // 在下方的示例中，让我们尝试从远程主机建立端口\
  \ 13 的连接，该端口是时间服务器。\n    // 如果连接建立，我们将尝试连接输入并关闭链接：\n    public void start() {\n\
  \        Socket TimeSocket;\n        InputStream TimeInput;\n        try {\n   \
  \         TimeSocket = new Socket(getCodeBase().getHost(), 13, true);\n        \
  \    TimeInput = TimeSocket.getInputStream();\n        } catch (Exception e) {\n\
  \            error = e;\n            return;\n        }\n        output = readString(TimeInput);\n\
  \        try {\n            TimeInput.close();\n            TimeSocket.close();\n\
  \        } catch (IOException e) {}\n    }\n\n    // 我们现在准备好从时间服务器读取输出了。\n    //\
  \ 为包含这些数据的字节数组分配初始值，并仅从输入单元中读取信息。\n    // 当流被填充时，读取 InputStream 方法将返回 -1（在远程主机上的\
  \ socket 关闭后）。\n    // 为了简单起见，我们假设输入数据少于 50 字节，尽管之后我们会向你展示从服务器接收未知数量数据的最佳方法。\n \
  \   private String readString(InputStream in) {\n        byte[] ary = new byte[50];\n\
  \        byte buf;\n        int count = 0;\n        try {\n            buf = (byte)in.read();\n\
  \            while (buf != -1) {\n                ary[count] = buf;\n          \
  \      count++;\n                buf = (byte)in.read();\n            }\n       \
  \ } catch (IOException e) {\n            error = e;\n            return null;\n\
  \        }\n        return new String(ary, 0).trim();\n    }\n\n    // 如果所有传递都通过，paint\
  \ 方法将发布服务器时间数据：\n    public void paint(Graphics g) {\n        g.setColor(Color.white);\n\
  \        g.fillRect(0, 0, 499, 249);\n        g.setColor(Color.black);\n       \
  \ g.drawRect(0, 0, 499, 249);\n        if (error != null) {\n            g.drawString(error.toString(),\
  \ 25, 25);\n            g.drawString(error.getMessage(), 25, 25);\n        } else\
  \ {\n            g.drawString(output, 25, 25);\n        }\n    }\n}\n```\n\n# 不链接的数据报\n\
  \nTCP/IP 协议也支持非绑定数据报的交付以及使用 UDP（用户数据报包，\"用户数据报包”）的返回。UDP 数据报就像 TCP socket 一样，它们允许你使用\
  \ TCP/IP 协议与远程主机进行通信。与 TCP socket 实现逻辑连接不同，UDP 数据报不建立逻辑连接。如果 TCP socket 可以比作电话通话，那么\
  \ UDP 数据报就可以比作电报。UDP 数据报的交付是无法保证的，即使这种数据报被送达，也没有保证它是正确送达的。\n\n由于不可靠 UDP 大多数程序员在编写网络应用程序时\n\
  \n\n\n\n倾向于使用 TCP 套接字。然而，如果你想为现有的 UDP 服务器（如 NFS 版本 2）编写 Java 客户端，可能会决定使用数据报。此外，数据报的服务头部\
  \ `header`（开销）占用的空间比 TCP 套接字更少，因为在发送或接收数据报时，不需要握手或流量控制机制。另外，UDP 数据报可以用于向客户端定期发送更新信息的\
  \ Java 服务器上。如果服务器不是为每个客户端建立 TCP 连接，而是直接发送 UDP 数据报，那么它的工作量会更少，相应的运行速度也会更快。\n\nJava\
  \ 中有两个与 UDP 数据报相关的类：`DatagramPacket` 和数据报套接字（datagram socket）。\n\n`DatagramPacket`\
  \ 类用于发送或接收 UDP 数据报。`DatagramPacket` 的构造函数和方法见表 13-3。\n\n### 表 13-3. `DatagramPacket`\
  \ 类的构造函数和方法\n\n#### 构造函数和方法描述\n\n`DatagramPacket(byte[], int, InetAddress, int)`\
  \ 创建用于发送数据报的数据包。`byte` 内容数组被发送到由第二个整数和 `InetAddress` 指定的远程主机端口。第一个整数设置发送的字节总数。\n\
  \n`InetAddress.getAddress()` 返回数据包的网地址。`int getPort()` 返回数据包端口。\n\n`byte[] getData()`\
  \ 返回数据包。`int getLength()` 返回数据包长度。\n\n当你构造 `DatagramPacket` 类时，你需要一个 `DatagramSocket`\
  \ 来发送和接收数据报。这些套接字绑定到你计算机上的特定端口，就像 TCP 套接字一样。在 UNIX 上，小于 1024 的端口号预留给 root 用户。`DatagramSocket`\
  \ 类的构造函数和方法见表 13-4。\n\n### 表 13-4. `datagram socket` 类的构造函数和方法\n\n#### 构造函数和方法\n\
  \n| 描述 |\n| :--- | :--- |\n| `DatagramSocket()` | 在未指定的空闲端口上创建一个 UDP 套接字。 |\n| `DatagramSocket(int)`\
  \ | 创建到指定端口的 UDP 套接字。 |\n| `receive(DatagramPacket)` | 等待接收数据报并将数据拷贝到特殊的 datagrampacket\
  \ 中。 |\n| `send(datagramPacket)` | 发送 datagrampacket。 |\n| `getLocalPort()` | 返回套接字绑定的本地端口号。\
  \ |\n| `close( )` | 关闭套接字。 |\n\n我们将使用这些类来实现 UDP 客户端。与 UDP 回显服务器连接，该服务器在大多数 UNIX\
  \ 机器上位于端口 7。echo 回显服务器接收收到的每个 UDP 数据报并将其副本作为另一个 UDP 数据报返回到第一个数据报发送的地方。这里是我们的 echo\
  \ 客户端文本程序。\n\n示例 13-2. Applet 数据报（datagrams）。\n\n```java\nimport java.applet.*;\n\
  import java.awt.*;\nimport java.net.*;\n\npublic class DatagramApplet extends applet\
  \ {\n    private InetAddress addr;\n    private String message;\n    private text\
  \ area output;\n    public void init() {\n        try {\n            String me =\
  \ detCodeBase().getHost();\n            addr = InetAddress.getByName(me);\n    \
  \    } catch (Exception e) {\n            handleException(e);\n        }\n     \
  \   message = \"abcde\";\n        output = new TextArea(5,60);\n        output.setEditable(false);\n\
  \        add(output);\n        show();\n    }\n\n    public void start() {\n   \
  \     byte b[] = new byte[message.length()];\n        message.getBytes(0,message.length(),b,0);\n\
  \        try {\n            datagram socket ds = new datagram socket();\n      \
  \      DatagramPacket outPacket;\n            outPacket = new DatagramPacket(b,b.length,addr,7);\n\
  \            b = new byte[message.length()];\n            DatagramPacket inPacket;\n\
  \            inPacket = new DatagramPacket(b,b.length);\n            ds.send(outPacket);\n\
  \            output.appendText(\"Sent: \"+message+\"\\n\");\n            ds.receive(inPacket);\n\
  \            b = inPacket.getData();\n            output.appendText(\"Rec'd: \"\
  + new String(b,0)+\"\\n\");\n            ds.close();\n        } catch (Exception\
  \ e) {\n            handleException(e);\n        }\n    }\n\n    public void stop()\
  \ {\n        output.setText(\"\");\n    }\n\n    public void handleException(Exception\
  \ e) {\n        System.out.println(e.toString());\n        e.printStackTrace();\n\
  \    }\n}\n```\n\n虽然数据报有时很有用，但由于它们缺乏服务头部，无法取代像 TCP 套接字那样支持可靠连接的网络机制。然而，正如我们之前看到的，Java\
  \ 中执行的套接字与流（streams）密切相关。要学习如何有效地使用套接字，你需要学习如何使用流。\n\n# 流 (streams)\n\nJava 管理输入和输出数据程序的\
  \ API 使用流（flows）。流实际上是一种将数据从程序传输到某些外部设备（例如文件或网络）的方法。在这一端你放入某些东西，它就会从另一端出来。主要类包括位于\
  \ `java.io` 中的 `InputStream` 和 `OutputStream`。在本节中，我们还将查看极大简化数据的高级类型。\n\n## Images/0936.gif\n\
  \n## 输入流 (Input streams)\n\n#### 13.\n\n从远程设备传递输入时会遇到一些困难。网络通信速度变化很大，通常在传递数据时，`InputStream`\
  \ 定义了一个方法返回在不阻塞的情况下可以读取的字节数。这意味着如果你尝试读取不可用的数据，线程将等待直到部分流到达。如果到达数据流末，`read` 方法返回\
  \ -1。当发生错误时，所有方法都会抛出 `IOException`。\n\n### 表 13-5. `InputStream` 类方法\n\n## 方法描述\n\
  \n| 描述 |\n| :--- |\n| `int available()` | 返回不阻塞情况下可以读取的字节数。 |\n| `int read()` |\
  \ 从流返回下一个字节。 |\n| `int read(byte[])` | 填充字节数组的所有空间并返回实际读取的数据量。 |\n| `int read(byte[],int,int)`\
  \ | 填充字节数组的所有空间。第一个整数指定读取的起始偏移，第二个整数指定必须读取的最大字节数。 |\n| `long skip(long n)` | 跳过\
  \ n 个字节输入并返回实际跳过的数量。 |\n| `close( )` | 关闭流。 |\n| `int mark(int)` | 标记流当前的位置。整数参数表示在此标记之前可以读取的最小字节数。\
  \ |\n| `reset()` | 将流返回到标记的位置。 |\n| `boolean markSupported()` | 显示流是否支持标记和重置方法。\
  \ |\n\n## 输出流 (Weekend streams)\n\n向流写入数据比接收输入简单得多。`OutputStream` 类包含了三个记录方法、`flush`\
  \ 方法（将缓冲区中的所有输出数据写入流）以及一个关闭流的 close 方法。写入方法会锁定直到数据被记录。这些方法见表 13-6。\n\n### 表 13-6.\
  \ `OutputStream` 类方法\n\n## 方法描述\n\n| 描述 |\n| :--- |\n| `close( )` | 关闭流。 |\n| `flush()`\
  \ | 释放缓冲区中的所有数据。 |\n| `int write(int)` | 在流中写入一个字节。 |\n| `write(byte[])` | 在流中写入数组字节。\
  \ |\n| `write(byte[],int,int)` | 在流中记录子数组。第一个整数指定偏移量，第二个整数指定子数组的长度。 |\n\n\n\n\n\n\
  通过使用 `OutputStream` 类，我们可以连接到需要输入数据的服务器。例如，这可以是一个运行在大多数 UNIX 计算机上的 Finger 服务器。连接建立后，客户端报告用户名，服务器返回关于该用户的信息。这里是简单的\
  \ Finger 客户端 程序的文本。\n\n示例 13-3. Finger 客户端 applet。\n\n```java\nimport java.applet.*;\n\
  import java.awt.*;\nimport java.net.*;\nimport java.io.*;\n```\n\n我们将不再使用 `drawString`，而是使用\
  \ `TextArea` 字段，因为 Finger 服务器通常会返回多行输出信息。为了简单起见，我们将我们请求信息的用户名作为参数传递给 Web 页面。由于这里使用了标准输出流，因此在发送之前，我们必须将字符串转换为字节数组，尽管在本章稍后的部分我们将讨论\
  \ `OutputStream` 类的子类，它们可以直接写入 `String` 类型的变量。字节 `EOL` 用于设置 Finger 服务器语法分析输出的行尾：\n\
  \n```java\npublic class FingerApplet extends applet {\n    private TextArea output;\n\
  \    private byte user[];\n    private byte EOL;\n\n    public void init() {\n \
  \       String userStr;\n        userStr = getParameter(\"USER\") + \"\\n\";\n \
  \       user = new byte[userStr.length()];\n        userStr.getBytes(0, userStr.length(),\
  \ user, 0);\n        output = new TextArea(10, 80);\n        output.setEditable(false);\n\
  \        add(output);\n        show();\n\n        String eolStr = new String(\"\\\
  n\");\n        byte eolAry[] = new byte[1];\n        eolStr.getBytes(0, 1, eolAry,\
  \ 0);\n        EOL = eolAry[0];\n    }\n}\n```\n\n下面的程序部分与位于端口 79 的 `TimeClientApplet`\
  \ - Finger 服务器几乎完全相同，并且需要 `OutputStream` 类以及 `InputStream` 类。连接建立后，被搜索的用户名将字节数组的形式发送。这里是另一个方法\
  \ `readText`，它将 `InputStream` 的内容复制到 `TextArea`：\n\n```java\npublic void start()\
  \ {\n    Socket FingerSocket;\n    InputStream FingerInput;\n    OutputStream FingerOutput;\n\
  \    try {\n        FingerSocket = new Socket(getCodeBase().getHost(), 79);\n  \
  \      FingerInput = FingerSocket.getInputStream();\n        FingerOutput = FingerSocket.getOutputStream();\n\
  \        FingerOutput.write(user);\n    } catch (Exception e) {\n        output.appendText(e.toString()\
  \ + \"\\n\");\n        output.appendText(e.getMessage() + \"\\n\");\n        return;\n\
  \    }\n    readText(FingerInput, output);\n}\n```\n\n我们现在准备好接收来自 Finger 服务器的数据了。为了存储每行数据，让我们使用一个字节数组。当遇到\
  \ EOL 字符或数组长度溢出（由 `TextArea` 字段中的列数指定）时，将字节数组复制到 `TextArea` 并创建一个新的空字节数组。这是处理未知数量数据的一种更复杂的方法，而第一个示例中的方法只是简单地询问上边界并创建了一个单个数组：\n\
  \n```java\nprivate void readText(InputStream in, TextArea text) {\n    int bufsize\
  \ = text.getColumns();\n    byte ary[] = new byte[bufsize];\n    byte buf;\n   \
  \ int count = 0;\n    try {\n        buf = (byte) in.read();\n        while (buf\
  \ != -1) {\n            ary[count] = buf;\n            count++;\n            if\
  \ (buf == EOL || count == bufsize) {\n                String aryStr;\n         \
  \       aryStr = new String(ary, 0);\n                text.appendText(aryStr);\n\
  \                ary = new byte[80];\n                count = 0;\n            }\n\
  \            buf = (byte) in.read();\n        }\n    } catch (IOException e) {\n\
  \        text.appendText(e.toString() + \"\\n\");\n        text.appendText(e.getMessage()\
  \ + \"\\n\");\n        return;\n    }\n    text.appendText(new String(ary, 0));\n\
  }\n```\n\n当 applet 结束时，`TextArea` 字段将被清空以供后续应用程序：\n\n```java\npublic void stop()\
  \ {\n    output.setText(\"\");\n}\n```\n\n## 多样化的流\n\n`java.io` 包提供的不仅仅是 `InputStream`\
  \ 和 `OutputStream`。这两个类在 API 中都包含多个子类，允许程序员在更高的层次上与线程交互，从而更容易解析和发送数据。表 13-7 简要介绍了这些子类。除非另有说明，每个输入流都有对应的输出流。\n\
  \n表 13-7. `InputStream` 类的子类\n\n| 子类 | 描述 |\n| :--- | :--- |\n| `FilteredInputStream`\
  \ | 过滤输入流字节。 |\n| `BufferedInputStream` | 从缓冲区读取输入流字节。使用缓冲区可能会加速流访问，因为字节是分块写入的。此类是\
  \ `FilteredInputStream` 的子类。 |\n| `FileInputStream` | 允许来自文件的流。 |\n| `PipedInputStream`\
  \ | 与 `PipedOutputStream` 结合时，解决程序化流之间的单向定向数据传输。 |\n| `DataInputStream` | 输入流字节。此类是\
  \ `FilteredInputStream` 的子类。 |\n| `PushbackInputStream` | 用于回退流。 |\n| `SequenceInputStream`\
  \ | 允许组合多个流。 |\n| `ByteArrayInputStream` | 允许从数组读取。 |\n| `PrintStream` | 允许以文本形式打印。\
  \ |\n\n## 数据流\n\n在各种流中，最重要的两个是 `DataInputStream` 和 `DataOutputStream`，它们构建在普通的 `InputStream`\
  \ 之上。这些流允许你直接从流中获取 Java 原始类型变量（如 int），而无需关心字节数组。使用 `DataInputStream` 我们可以简化 `readString`\
  \ 方法。\n\n示例 13-4. 使用 `DataInputStream` 的 applet。\n\n```java\nprivate String readString(InputStream\
  \ in) {\n    DataInputStream dataIn;\n    dataIn = new DataInputStream(in);\n  \
  \  try {\n        return dataIn.readLine();\n    } catch (IOException e) {\n   \
  \     error = e;\n        return null;\n    }\n}\n```\n\n表 13-8 列出了 `DataInputStream`\
  \ 新的方法。所有这些方法在发生错误时都会抛出 `IOException`。`readFully` 方法在填充字节数组之前遇到 EOF 会发出 `java.io.EOFException`。这些方法与原始\
  \ `InputStream` 的 `read(byte[])` 和 `read(byte[],int,int)` 方法的区别在于，它们会阻塞直到所有数据可用或遇到\
  \ EOF。同样，`skipBytes` 方法会阻塞直到跳过所有请求字节。\n\n表 13-8. `DataInputStream` 类的方法\n\n| 方法\
  \ | 描述 |\n| :--- | :--- |\n| `readBoolean()` | 读取布尔变量。 |\n| `readByte()` | 读取一个字节（8\
  \ 位）。 |\n| `readUnsignedByte()` | 读取一个无符号字节（8 位）。 |\n| `readShort()` | 读取一个短型整数（16\
  \ 位）。 |\n| `readUnsignedShort()` | 读取一个无符号短整数（16 位）。 |\n| `readChar()` | 读取字符（16\
  \ 位）。 |\n| `readInt()` | 读取整数（32 位）。 |\n| `readLong()` | 读取长型整数（64 位）。 |\n| `readFloat()`\
  \ | 从浮点数读取数字（32 位）。 |\n| `readDouble()` | 从双精度浮点数读取数字（64 位）。 |\n\n\n\n\n`readLine()`\
  \ 读取带有 `\\r`、`\\n`、`\\r\\n` 或 `EOF` 异常的一。`readUTF()` 以 `UTF` 格式读取行。\n\n`readFully(byte[])`\
  \ 将字节读入特殊的字节数组；阻塞直到数组填满。\n\n`readFully(byte[],int,int)` 将字节读入特殊数组 `bytes` 中；在填充子数组之前阻塞。\n\
  \n`skipBytes(int n)` 跳过 `n` 个字节；阻塞，直到未跳过所有字节。\n\n![](img/image09307.jpeg)\n\n**建议**：在使用\
  \ `readByte` 及其配对的 `writeByte` 时，不需要将字节转换为网络字节，反之亦然。字节的写入和读取顺序与它们在 Java 虚拟机中的顺序完全一致。\n\
  \n![](img/image09308.jpeg)\n\n`DataOutputStream` 输出流的工作方式与数据输入流相同，只是方向相反。\n\n你可以直接将变量（字符串除外）写入流中，而无需预先将其转换为字节数组。表\
  \ 13-9 列出了 `DataOutputStream` 类添加的新方法。\n\n表 13-9. `DataOutputStream` 类方法\n\n## 方法描述\n\
  \n`writeBoolean(boolean)` 写入布尔变量。`writeByte(int)` 写入一个字节（8 位）。`writeChar(int)` 写入一个字符（16\
  \ 位）。`writeShort(short)` 写入短整数（16 位）。`writeInt(int)` 写入一个整数（32 位）。`writeLong(long)`\
  \ 写入一个长整型（64 位）。\n\n`writeFloat(float)` 写入一个浮点数（32 位）。`writeDouble(double)` 写入一个双精度浮点数（64\
  \ 位）。`writeBytes(String)` 以字节形式写入字符串。\n\n`writeChars(String)` 以符号形式写入字符串。`writeUTF(String)`\
  \ 以 `UTF` 格式写入字符串。\n\n请注意，`DataInputStream` 方法不会解析传入的文本来检测类似于 Java 简单类型的字符，`DataOutputStream`\
  \ 方法也不会写入通过它们的变量的文本表示。这些方法按照变量在 Java 虚拟机内存中的表示直接向流读写变量。\n\n例如，当你调用 `readInt` 时，它从流中读取\
  \ 32 位，然后返回与这些 32 位对应的整数。它不会解析文本数据字符串来寻找像整数的内容。同样，如果你向 `DataOutputStream` 的 `writeInt`\
  \ 方法传递一个值不等于 10 的整数，它不会向流写入数字 \"10\"。它会写入一个 32 位的序列，该序列在被解释为整数时将产生值 10。如果你想解析文本语法来识别数字，你可以考虑处理字符串中的文本数据并利用\
  \ `StringTokenizer`，或者利用 `StreamTokenizer` 类，我们将在下一节讨论）。\n\n## 解析文本流数据\n\n`StreamTokenizer`\
  \ 类与 `DataInputStream` 类类似，构建在普通的输入流之上。`StreamTokenizer` 与 `InputStream` 类型的其他扩展的区别在于，它不是\
  \ `InputStream` 类的直接子类——如果你使用 `StreamTokenizer` 类，将无法对它使用普通的 `InputStream` 方法。但\
  \ `StreamTokenizer` 允许你从文本数据流中读取一些简单的 Java 数据类型，即字符串和双精度浮点数。这种属性对于服务器连接、以文本形式传输数据（例如\
  \ MUD）非常有用。\n\n`StreamTokenizer` 类将输入流分成若干部分，称为标记（`tokens`）。\n\n该类区分五种标记：单词、数字、`EOL`\
  \ 符号、`EOF` 符号和普通符号。例如，流包含以下数据：\n\nYou are user nine of one hundred:\n\n`StreamTokenizer`\
  \ 将从该流返回七个标记。\"you\"、are\"、user\" 和 \"of\" 被视为字符串\"9\" 和 \"100\" 被视为数字，而 \":\" 将作为普通字符返回。\n\
  \n`StreamTokenizer` 类的工作方法是 `nextToken` 方法。它从流中读取下一个标记，并返回一个指示找到的标记类型的整数。如果标记分别是单词、数字、EOL\
  \ 或 EOF，对应的整数将为 `TT_WORD`、`TT_NUMBER`、`TT_EOL` 或 `TT_EOF`。这些 `TT_*` 变量在 `StreamTokenizer`\
  \ 类中定义为静态整数。如果标记是普通字符，该方法返回该符号的值。\n\n\n\n\n`String toString()` 返回行格式格式的当前令牌。\n\n\
  `StreamTokenizer` 类非常强大且灵活。但不要被它广泛的应用范围所吓到。默认配置与大多数线程 `inputstream`（输入流）都能良好工作。使用\
  \ `StreamTokenizer`，你可以教导时间客户端 applet 在将输入数据写入变量时对它们进行解析。记住时间服务器返回的字符串格式如下：\n\n\
  ```\nSun Jan 21 19:15:01 1996\n```\n\n我们可以让 `StreamTokenizer` 将此信息拆分为两行：一个包含 `day`（天）和\
  \ `month`（月）的行，以及另一个包含包含数字、小时、分钟、秒和年份的五个双精度值的行。由于我们在新程序中使用了 `Vector` 类，我们需要在程序开头添加\
  \ `\"import.java.util.*\"`。这里有改进后的方法 `start` 和一个新方法 `readTokens`。\n\n### 示例 13-5.\
  \ 从服务器解析时间数据。\n\n```java\npublic void start() {\n    Socket TimeSocket;  StreamTokenizer\
  \ st;  try {\n    time socket  =  new Socket(getCodeBase().getHost(),13,true); \
  \ st  =  new StreamTokenizer(TimeSocket.getInputStream());\n    } catch (Exception\
  \ e) {\n    error=e;  return;\n    }\n}\n```\n\n我们想要忽略时间服务器输出中的列，因此在解析时，我们将它们声明为空格。为了简化分析，我们编写了\
  \ `readTokens` 方法，该方法接收一个 `StringTokenizer` 类和一个包含 `String` 和 `Double` 值的 vector，尝试从流中选择这些类型的值。令牌在流中出现的顺序必须与它们在\
  \ vector 中出现的顺序相同，且仅由空格分隔。否则将发生异常。现在我们为来自 `topics` 的 vector 分配初始值，它包含了两行和五个 Double\
  \ 值：\n\n```java\nst.whitespaceChars(':',':');  Vector tokens = new Vector(7);  tokens.addElement(new\
  \ String());  tokens.addElement(new String());  tokens.addElement(new Double(0));\
  \  tokens.addElement(new Double(0));  tokens.addElement(new Double(0));  tokens.addElement(new\
  \ Double(0));  tokens.addElement(new Double(0));  try {\n    readTokens(st, tokens);\n\
  } catch (Exception e) {\n    error=e;  return;\n}\noutput = \"The data is  \"+tokens.elementAt(0)+\"\
  , \";\noutput =  output +  tokens.elementAt(1)+\"  \"+tokens.elementAt(2);  output\
  \ =  output + \",  \"+tokens.elementAt(6);\ntry {\n    TimeSocket.close();\n} catch\
  \ (Exception e) {}\n```\n\n下面我们提供了一个读取令牌的新方法。它通过从流中读取令牌并设置 vector 中相应的元素来逐个传递元素。如果从流中读取的令牌类型与\
  \ `vector` 中定义的 `Object` 元素类型不匹配，或者 `vector` 包含了我们无法识别的 `Object` 类型，将抛出以下异常：\n\n\
  ```java\nprivate void readTokens(StreamTokenizer st, Vector v) throws Exception\
  \ {\n    int token;\n    int i = 0;\n    Enumeration en = v.elements();  while (en.hasMoreElements())\
  \ {\n        // 此类型对象，我们需要的\n        Object o = en.nextElement();\n        // 从流中获取下一个令牌\n\
  \        token = st.nextToken();\n        // 如果输出类型是 String\n        if (o instanceof\
  \ string) {\n            // 如果令牌不是一个单词\n            if (token!=st.TT_WORD) {\n \
  \               Exception e;\n                e = new Exception(\"Unexpected token\
  \ type:  \"+ token); throw e;\n                // 全部正常，填充 vector\n            }\
  \ else {\n                v.setElementAt(st.sval,i);\n            }\n          \
  \  // 如果类型是 Double 类型\n        } else if (o instanceof double) {\n            //\
  \ 如果令牌不是数字\n            if (token!=st.TT_NUMBER) {\n                Exception e;\n\
  \                e = new Exception(\"Unexpected token type:  \"+ token); throw e;\n\
  \                // 全部正常，填充 vector\n            } else {\n                Double\
  \ d = new Double(st.nval);  v.setElementAt(d,i);\n            }\n        }\n   \
  \     // 如果类型是无效类型\n        else {\n        } i++;\n    }\n    Exception e;\n  \
  \  String type = o.getClass().getName();\n    e = new Exception(\"Cannot parse for\
  \  \"+ type); throw e;\n}\n```\n\n### 交互 InterApplet c 通道\n\nJava API 实现了不同流（线程）之间的数据流连接。这一属性可以用于在不创建僵化且复杂的方法系统的情况下，赋予线程通信的能力。你可以创建一对管道数据流，`PipedInputStream`\
