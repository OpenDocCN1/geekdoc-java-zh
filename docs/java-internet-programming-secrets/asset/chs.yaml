  \ `ParseTree` 方法正确完成的。\n\n正如我们所说，`ParseTree` 方法是递归工作的。当我们遇到新菜单时调用它。这允许我们在不使用嵌套循环的情况下处理嵌套菜单。我们带有以下参数调用\
