  \n`addMeeting`` 方法可以分为三个部分：1) 解析与验证，2) 实际添加到数据库，以及 3) 通知。每当发生错误时，都会发送一个 `addNAK`\
  \ 数据包。客户端必须告诉用户错误是什么。然后他们可以调整输入数据并再次发送包。\n\n## 针对给定项目的特定模块\n\n客户端和服务器都以最符合它们共同利益的方式使用\
  \ `schedule` 接口。客户端运行某些数据保护——例如，数据存储在磁盘上。这意味着我们应该在网络上请求日程信息。\n\n### 客户端日程\n\n`ClientSchedule`\
  \ 使用哈希表实现，允许快速且紧凑的数据保存。\n\n```java\npublic class clientSchedule implements schedule\
  \ {\n    Hashtable memoryStore = new hashtable();\n}\n```\n\n\n\n\n`clientSchedule`\
  \ 类实现了 `schedule` 接口。该类为我们之前描述的接口提供了程序。使用接口的便利之处在于大量的应用，如果你不喜欢给定的实现，可以编写自己的。你甚至可以提取程序中的某些片段来使用，并替换那些你不喜欢的部分：\n\
  \n```java\npublic void add(scheduleStruct newSchedule) throws DuplicateException,\
  \ IOException {\n    if (memoryStore.put(newSchedule.start, newSchedule) != null)\
  \ {\n        throw new DuplicateException();\n    }\n}\n```\n\n`add` 方法用于添加新的预约。关于这个程序，我们有两个重要的说明。一个关于如何将新项放入哈希表中。我们必须拥有数据和键（在这种情况下，它是会议的开始日期），并且它们都是对象。哈希表在每个键上只存储一个对象。因此，如果我们尝试同时记录两个预约，将会得到错误。这种系统可以工作，前提是大多数人不会同时参加两个会议。\n\
  \n第二个重要的说明关于抛出异常的方法。记住，我们必须描述方法操作过程中可能发生的所有异常。显然，`add` 方法只能抛出一种异常 - `DuplicateException`。`IOException`\
  \ 是哈希表的 `put` 方法抛出的。由于我们在这里不处理错误，我们将它们传递给调用方法。在处理位于内存中的数据结构时，不太可能遇到 `IOException`，但这个问题同样不小。如果发生这种情况，让程序员解决这个任务。\n\
  \n抛出 `DuplicateException` 而不是返回错误代码。在这种情况下，这并不非常重要，但稍后我们将使用返回值来获取必要信息。然后我们希望保持返回值不变。返回值执行了两个任务：它返回一个数字，并在发生严重错误时返回\
  \ -1。异常允许你轻松地解决这个问题，如下面的代码段所示：\n\n```java\npublic void del(scheduleStruct del) throws\
  \ NotFoundException {\n    if (memoryStore.remove(del.start) == null) throw new\
  \ NotFoundException();\n}\n\npublic scheduleStruct find(Date date) throws NotFoundException\
  \ {\n    scheduleStruct ss;\n    ss = (scheduleStruct) memoryStore.get(date);\n\
  \    if (ss == null) {\n        throw new NotFoundException();\n    }\n}\n```\n\n\
  `delete` 和 `find` 方法非常简单，几乎是不言自明的。对于返回的错误信息，再次使用了异常。两个哈希表方法（`get` 和 `remove`）都返回请求信息的引用值。如果未找到键值，则返回零。在这种情况下将生成未找到的异常。\n\
  \n最后一个方法 - `findRange`。在这里让我们使用编号，这将有助于我们返回数据值。`findRange` 方法接收一个时间范围并返回该期间内的所有预约。由于哈希表不包含关于时间间隔的数据，你必须进行顺序搜索。但哈希表实现了\
  \ `numbering` 接口。这允许顺序查看哈希表。\n\n我们将查看两次表。在第一次查看时，我们将确定将返回的会议数量，在第二次查看时，填充结果数组。我们被迫这样做，是因为数组的至少一个维度的大小在创建时必须确定。注意，我们调用了两次哈希方法的元素。每次查看编号后，它都会被销毁。每次新的调用都需要重新创建编号。以下是\
  \ `findRange` 方法的程序：\n\n```java\npublic scheduleStruct[] findRange(Date start, Date\
  \ end) throws IOException {\n    Enumeration list = memoryStore.elements();\n  \
  \  scheduleStruct ss;\n    int cnt = 0;\n    // 认为元素数量\n    while (list.hasMoreElements())\
  \ {\n        ss = (scheduleStruct) list.nextElement();\n        if (start.getTime()\
  \ <= ss.start.getTime() && end.getTime() >= ss.end.getTime()) {\n            cnt++;\n\
  \        }\n    }\n    if (cnt < one) return null;\n    scheduleStruct result[]\
  \ = new scheduleStruct[cnt];\n    // 再次销毁编号\n    list = memoryStore.elements();\n\
  \    // 创建结果数组\n    cnt = 0;\n    while (list.hasMoreElements()) {\n        ss =\
  \ (scheduleStruct) list.nextElement();\n        if (start.getTime() <= ss.start.getTime()\
  \ && end.getTime() >= ss.end.getTime()) {\n            result[cnt++] = ss;\n   \
  \     }\n    }\n    return result;\n}\n```\n\n以上就是适用于 `clientSchedule` 的所有内容。利用哈希表，我们将大部分工作交给了一个已经创建并调试过的类。这种对已完成工作的重复利用让我们更快地编写程序并且错误更少。\n\
  \n### 服务器调度\n\n调度服务器要复杂一些，因为我们将处理存储在磁盘上的数据结构。为了处理规模巨大的数据库，服务器实现应该尽可能高效。我们将数据存储在线性文件中，但为了执行更快的搜索，将使用索引文件。如果对工作索引文件感兴趣，查看\
  \ `schedule/IndexFile.java`。它的程序简单但太长，无法包含在这里。这里是 `serverSchedule` 的程序：\n\n```java\n\
  public class serverSchedule implements schedule {\n    IndexFile index;\n    RandomAccessFile\
  \ dataFile;\n\n    public serverSchedule(String user) throws IOException {\n   \
  \     this.user = user;\n        index = new IndexFile(user + \".idx\", \"rw\",\
  \ Size, Size);\n        dataFile = new RandomAccessFile(user + \".dat\", \"rw\"\
  );\n    }\n}\n```\n\n该类的构造函数包含一个标识用户的字符串。此行用于创建索引文件和数据文件名。注意此程序会返回 `IOException`。如果服务器没有写入文件的权限，就会发生这种情况\
  \ -你应该在程序中找到这个错误。对于数据存储，我们使用 `RandomAccessFile`。文件以读写模式（访问代码为 \"rw\"）根据用户名和 .dat\
  \ 扩展名命名。是的，对于名为 maggie 的用户，数据文件将命名为 maggie.dat。接下来的部分在调度中添加预约：\n\n```java\npublic\
  \ void add(scheduleStruct newSchedule) throws DuplicateException, IOException {\n\
  \    String key;\n    String data;\n    long conv;\n    long pos;\n\n    dataFile.seek(dataFile.length());\n\
  \    pos = dataFile.getFilePointer();\n\n    dataFile.writeLong(newSchedule.start.getTime());\n\
  \    dataFile.writeLong(newSchedule.end.getTime());\n    dataFile.writeBytes(newSchedule.desc\
  \ + \"\\n\");\n    dataFile.writeBytes(newSchedule.descURL + \"\\n\");\n    dataFile.writeBytes(newSchedule.minutesURL\
  \ + \"\\n\");\n    dataFile.writeBytes(newSchedule.attending + \"\\n\");\n\n   \
  \ conv = new Long(newSchedule.start.getTime());\n    key = conv.toString();\n  \
  \  key = StringUtil.padStringLeft(key, ' ', Size);\n    conv = new long(pos);\n\
  \    data = conv.toString();\n    data = StringUtil.padStringLeft(data, ' ', Size);\n\
  \    index.addRecord(key, data);\n}\n```\n\n`add` 方法必须将元素添加到数据文件并添加到索引文件中。\n\n\n\
  \n\n# RandomAccessFile 与数据操作\n\n`RandomAccessFile` 位于 `DataOutput` 和 `DataInput`\
  \ 过滤器之上，因此我们可以直接读写 Java 类型。如果能直接写入对象就太好了，但遗憾的是，并没有提供这种可能性。另一个重要的点是：我们使用了 `writeBytes`\
  \ 方法。它以 8 位字节的形式写入数据。如果我们使用 `writeChars` 方法，那么每个字符将占用 16 位。`writeUTF` 方法将将写入 16\
  \ 位的 Unicode 字符。如果你打算使用 `readLine` 方法，则需要使用 `writeBytes`。目前不存在对应的可以读取 `writeChars`\
  \ 输出的读取方法。\n\n另请注意，每行之后都有一个 `\"\\n\"`。在接下来的内容，我们将使用 `readLine` 方法——它将回车符识别为行结束符号。这允许设置变长度的字符串，从而节省空间并使得无需手动解析字符串。\n\
  \n`index` 文件包含两个元素：`values` `key` 和 `values` `data`。这两个元素具有固定长度。索引元素是开始日期，我们将其保留为\
  \ `long` 类型的值。为了方便读取索引文件，它以字符串形式存储。数据存储在数据文件的偏移位置处，并以字符串格式存储。如果我们想减小索引文件的大小，可以将这些值存储为\
  \ `long` 词，而不是字符串：\n\n```java\npublic void del(scheduleStruct del)\nthrows not found\
  \ exception, IOException {\n    Long conv;\n    String key;\n    String data;\n\
  \    long pos;\n    conv = new Long(del.start.getTime());\n    key = conv.toString();\n\
  \    key = StringUtil.padStringLeft(key, ' ', Size);\n    data = index.findRecord(key);\n\
  \    conv = new Long(data.trim());\n    pos = conv.longValue();\n    // 现在可以删除 pos\
  \ 处的数据，\n    // 但我们不会这样做\n    index.delRecord(key);\n}\n```\n\n`delete` 方法只破坏索引文件中的一个元素。如果我们破坏\
  \ `data` 文件中的元素，文件中会出现空洞。为了消除它，我们必须将文件中所有的 `data` 移动到开头，并替换 `index` 文件中的所有相关元素。这种操作在压缩程序中很常见，但很少执行。磁盘空间足够廉价，我们可以负担程序运行得快一点，并只定期对数据库进行操作。下面的代码段展示了如何对存储在磁盘上的\
  \ `schedule` 执行 `find` 方法：\n\n```java\npublic scheduleStruct find(Date date)\nthrows\
  \ not found exception, IOException {\n    scheduleStruct result;\n    long pos;\n\
  \    Long conv;\n    String key;\n    String data;\n    conv = new Long(date.getTime());\n\
  \    key = conv.toString();\n    key = StringUtil.padStringLeft(key, ' ', Size);\n\
  \    data = index.findRecord(key);\n    conv = new Long(data.trim());\n    pos =\
  \ conv.longValue();\n    return findPos(pos);\n}\n\npublic scheduleStruct findPos(long\
  \ pos) throws IOException {\n    scheduleStruct result = new scheduleStruct();\n\
  \    dataFile.seek(pos);\n    result.start = new Date(dataFile.readLong());\n  \
  \  result.end = new Date(dataFile.readLong());\n    result.desc = new String(dataFile.readLine());\n\
  \    result.descURL = new String(dataFile.readLine());\n    result.minutesURL =\
  \ new String(dataFile.readLine());\n    result.attending = new String(dataFile.readLine());\n\
  \    return result;\n}\n```\n\n此方法由两个子程序组成。第一个由 `schedule` 接口定义，它遍历 `index` 文件并在\
  \ `data` 文件中找到所需元素的位置。第二个子程序——`findPos`——用于从 `data` 文件中恢复数据。这里应用了 `readLine` 方法。我们查找相关位置并从\
  \ `data` 文件中读取每个字段。\n\n\n\n\n第一个是 `WINDOW_DESTROY`。当用户在窗口管理器中选择销毁函数 `(destroy)`\
  \ 时就会发生。系统的实际机制取决于特定版本的窗口管理器，但它通常允许用户销毁窗口。当这种情况发生时，剩下的就是我们优雅地退出了。调用该方法是为了清除帧 `release`\
  \ 内存，这会 `free` 所有使用的系统资源，并从曾经需要此机制退出应用程序的系统中出来。\n\n另一个重要的事件与菜单相关的 `ACTION_EVENT`。为了弄清楚此事件发生在哪个\
  \ `MenuItem` 上，让我们使用 `instanceof` 运算符。由于我们只有一个菜单，所以很显然该事件就发生在那里。要找到按钮菜单的名称，我们可以查看\
  \ `evt.arg`。然后我们让该按钮调用 `subroutine` 来执行工作。\n\n在处理帧的开发工作时，请记住，它们不会产生链式事件。\n\n每个帧都是一个独立的对象，没有真正的父节点。如果你认为\
  \ `Unhandled` 事件将传递给新窗口（例如，applet），那么你就错了。你必须在本地处理开发，或者以显式形式将事件传递给 applet：\n\n```java\n\
