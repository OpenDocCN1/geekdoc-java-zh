  \n# 列表\n\n列表框（List box）是一组垂直排列的元素，用户可以从中选择一个或多个元素（高亮）。在上一个例子中，用户使用开关选择了所需货币的汇率因子，但如果涉及许多不同的货币，开关可能不是此目的的最合适选择。在列表中组合选项要简单得多。与单选按钮组相比，列表提供的选项选择更加方便且均匀。在\
  \ Applet 示例中，列表用于选择用户想要转换成美元的货币。AWT 中包含的 `List` 构造函数创建一个可滚动的列表框，你可以对其设置可见元素的数量（即其高度）。对于可滚动列表，你还可以允许同时选择多个元素。构造函数可能如下所示：`List\
  \ CurrencyList = new List(3, false);`。\n\n此表达式创建一个名为 `CurrencyList` 的新列表，同时显示的元素数量等于三个，且你一次只能选择一个元素。如果不是\
  \ `false` 而是 `true`，则意味着列表中可以同时选择多个元素。向列表中添加元素需要更多几次操作。我们 Applet 的新版本使用列表来选择示例 7-4\
  \ 中所示货币之一，并计算货币金额。\n\n### 示例 7-4. Applet\n```java\nimport java.awt.*;\nimport java.applet.*;\n\
  \npublic class currency4 extends java.applet.applet {\n  final float UKratio = 1.50f;\n\
  \  final float FRANCratio = 6.00f;\n  float conversion_ratio = UKratio;\n  TextField\
  \ field1 = new TextField(20);\n  TextArea field2 = new TextArea(4, 20);\n  List\
  \ CurrencyList = new List(2, false);\n\n  public void init() {\n    field1.setEditable(true);\n\
  \    field2.setEditable(false);\n    CurrencyList.addItem(\"UK Pound\");\n    CurrencyList.addItem(\"\
  French Franc\");\n    CurrencyList.select(0);\n    add(field1);\n    add(field2);\n\
  \    add(CurrencyList);\n    field1.resize(field1.preferredSize());\n    field2.resize(field2.preferredSize());\n\
  \    show();\n  } // the end init\n```\n这段代码段创建了一个高为两个元素的新列表，仅允许选择其中一个。创建列表后，我们必须向其填充元素。这与上一个例子不同，在那个例子中我们将单选按钮添加到组中。新元素是直接在\
  \ `List` 类实例中添加的——之前我们是单独创建开关然后将它们组合成组。在这里，我们只需要创建一个 `List` 类的实例，之后就可以添加任意数量的元素。然后我们使用\
  \ `select(0)` 方法将光标设置为列表中的第一个元素。之后，整个列表被通过 applet 方法 `add` 添加了。\n\n### 示例 7-4b.\
  \ Applet 中添加列表\n```java\npublic void convert() {\n  // function convert() not has\
  \ changed\n  float currency1, currency2;\n  String InputString = field1.getText();\n\
  \  field1.setText(\"\");\n  currency1 = Float.valueOf(InputString).floatValue();\n\
  \  currency2 = conversion_ratio * currency1;\n  String OutputString = \"$\" + InputString\
  \ + \" = \" + \"#\" + Float.toString(currency2) + \"\\n\";\n  field2.appendText(OutputString);\n\
  } // the end convert\n\npublic boolean handleEvent(Event evt) {\n  // interception\
  \ developments choice one from elements list\n  if (evt.target == CurrencyGroupList)\
  \ {\n    if (\"UK Pound\" == CurrencyGroupList.getSelectedItem()) {\n      conversion_ratio\
  \ = UKratio;\n    }\n    if (\"French Franc\" == (CurrencyGroupList.getSelectedItem()))\
  \ {\n      conversion_ratio = FRANCratio;\n    }\n  }\n  if (evt.target == field1)\
  \ {\n    char c = (char)evt.key;\n    if (c == '\\n') {\n      convert();\n    \
  \  return true;\n    } else {\n      return false;\n    }\n  }\n  return false;\n\
  }\n} // the end applet\n```\n\n表 7-8 给出了 `List` 类的一些方法的描述。\n\n### 表 7-8. List 类常用方法\n\
  ## 方法描述\n- `addItem(String)`: 将指定的字符串作为新元素添加到列表末尾。\n- `addItem(String, int)`: 在指定索引之后将指定的字符串作为新元素。\n\
  - `allowsMultipleSelections()`: 如果列表允许同时选择多个元素，则返回 `true`。\n- `clear()`: 通过删除所有元素来清除列表。\n\
  - `countItems()`: 返回列表中元素的数量。\n- `delItem(int)`: 删除指定的列表元素。\n- `delItems(int, int)`:\
  \ 删除指定范围内的元素。\n- `deselect(int)`: 取消对指定元素的选择。\n- `getItem(int)`: 获取指定索引的文本元素。\n\
  - `getRows()`: 返回列表中同时可见元素的数量（其高度）。\n- `getSelectedIndex()`: 返回被选中元素的索引，如果没有选中的元素则返回\
  \ `-1`。\n- `getSelectedIndexes()`: 如果列表允许同时选择多个元素，则返回被选中元素的索引。\n- `getSelectedItem()`:\
  \ 返回被选中元素的文本字符串，如果没有选中的元素则返回 `null`。\n- `getSelectedItems()`: 如果列表允许同时选择多个元素，则返回被选中元素的文本行。\n\
  - `getVisibleIndex()`: 返回上次调用 `makeVisible` 方法时变为可见元素的索引。\n\n\n\n\n\n`isSelected(int)`\
  \ 如果选择了指定索引的元素，返回 `true`；反之返回 `false`。\n\n`makeVisible(int)` 滚动列表，使指定索引的元素可见。\n\n\
  `minimumSize(int)` 返回由指定数量同时可见元素的列表将占据的最小尺寸。\n\n`minimumSize()` 返回列表的最小尺寸。\n\n`paramString()`\
  \ 返回字符串参数列表。\n\n`preferredSize(int)` 返回由指定数量同时可见元素的列表的自然尺寸。\n\n`preferredSize()`\
  \ 返回给定列表的自然尺寸。\n\n`replaceItem(String, int)` 替换指定索引的文本元素。\n\n`select(int)` 选中指定索引的元素。\n\
  \n`setMultipleSelections(boolean)` 允许或禁止同时选择多个元素。\n\n# # 下拉列表\n\n我们已经知道如何通过开关和列表对多种可能性的选择进行编程。另一种可以减小\
  \ applet 控件尺寸的方法是下拉列表（Choice）。这种接口组件与 `list` 类似，包含一组元素；此外，它还可以处于打开或关闭状态，在关闭状态下，列表中仅显示选中的元素（见图\
  \ 7-5）。就像我们在上一个版本的 applet 中处理列表那样样，我们需要创建一个 `Choice` 类实例并向其中填充元素。\n\n![](img/image0924.gif)\n\
  \n## 示例 7.5\n\n下拉列表的创建方式与你熟悉的普通列表完全相同。基于上一个版本的 applet，你只需要将所有的 `CurrencyGroupList`\
  \ ID 替换为 `CurrencyGroupChoice` ID 即可。创建新下拉列表的代码片段见示例 7-5。\n\n示例 7-5。在 applet 中添加下拉列表。\n\
  ```java\nChoice CurrencyGroupChoice = new Choice();\nCurrencyGroupList.addItem(\"\
  UK Pound\");\nCurrencyGroupList.addItem(\"French Franc\");\n```\n\n应将示例 7-5 中的文本插入到\
  \ applet 中，替换 `CurrencyGroupList` 的声明。该声明位于上版本的早期代码中，那里使用了普通列表（参见示例 7-4）。表 7-9 列出了\
  \ `Choice` 类的一些方法。\n\n表 7-9。`Choice` 类的实用方法\n\n## 方法描述\n\n`addItem(String)` 向下拉列表添加新元素。\n\
  \n`countItems()` 返回下拉列表中的元素数量。\n\n`getItem(int)` 返回指定索引元素的字符串表示。\n\n`getSelectedIndex()`\
  \ 返回所选元素的索引位置。\n\n`getSelectedItem()` 返回所选元素的字符串表示。\n\n`paramString()` 返回下拉列表的字符串参数。\n\
  \n`select(int)` 将选择切换到指定索引的元素。\n\n`select(String)` 将选择切换到对应指定字符串的元素。\n\n# 滚动条\n\n\
  滚动条会自动添加到编辑字段中，但你也可以单独使用它们。例如，在我们的货币汇转换 applet 中，你可以添加一个滚动条，用户可以通过它更改重新计算系数（见图 7-6）。这里是创建滚动条的构造函数：\n\
  \n![](img/image0924.gif)\n\n## 示例 7.6\n\n```java\nScrollbar ratioScrollBar = new\
  \ Scrollbar(Scrollbar.HORIZONTAL, 150, 25, fifty, 250);\n```\n\n这里创建了一个水平滚动条，其初始位置设置为\
  \ 150。滚动条在屏幕上的长度为 25，滑块对应最左位置的最小值为 50，最大值为 250（这些数值，以及当前位置引擎，可能仅以整数形式呈现）。\n\n让我们在我们的货币转换\
  \ applet 中添加这样一个滚动条。你还记得，到为止我们使用了 1.5 的转换因子，但现在我们允许用户更改此值：当滑块向左移动时，值减少 0.1；向右移动时，增加\
  \ 0.1。在相邻的编辑字段中，我们将显示正在设置的值，以便用户看到自己的操作结果。\n\n示例 7-6a。通过滚动条重新计算金钱金额的 applet。\n\n\
  ```java\nimport java.awt.*;\nimport java.applet.applet;\n\npublic class currencyConverter5\
