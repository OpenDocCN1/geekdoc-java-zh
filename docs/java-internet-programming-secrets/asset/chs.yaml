  \ | 接收过滤器名称文件。 |\n\n使用 `FileDialog` 类非常简单，它的唯一工作是为用户提供一个标准的对话框，用于在特定平台上查看文件，如如图\
  \ 12-1 所示。当此任务完成后，应用 `getFile` 方法获取文件名，并使用 `getDirectory` 方法获取文件路径。实际上，文件对话框并不直接接触文件系统；它只提供用户选择的内容。\n\
  \n#### 图 12.1.\n\n对话框的外观和操作可以通过几种方式进行更改。当我们构建文件对话框时，必须为它设置一些标题。此外，我们还可以决定在对话框中是否需要一个“保存”按钮或一个“打开”按钮；为此，你需要在\
  \ `FileDialog(Frame parent, String title, int mode)` 构造函数中设置相应的模式。注意，这些更改是装饰性的，因为实际上\
  \ `FileDialog` 类并不尝试更改文件。显然，一种用户友好性差得多的解决方案是在 FileDialog.LOAD 中设置所需的模式，然后重写文件。由于这是默认的实现方式，如果我们真的想创建带有用户所更改的文件或目录，我们必须显式地在\
  \ `FileDialog.SAVE` 中设置所需的模式。将模式设置为 `FileDialog.SAVE` 将避免用户需要重写文件的麻烦。如果用户选择了一个已存在的文件，对话框将在其上创建一个警告对话框。\n\
  \n```java\npublic String fileToWrite(Frame parent, String title) {\n    FileDialog\
  \ fD = new FileDialog(parent, title, FileDialog.SAVE);\n    if (!parent.isVisible())\
  \ {\n        parent.show();\n    }\n    fD.show();\n    String path = fD.getDirectory()\
  \ + fD.getFile();\n    return path;\n}\n\npublic String fileToOpen(Frame parent,\
  \ String title) {\n    FileDialog fD = new FileDialog(parent, title, FileDialog.LOAD);\n\
  \    if (!parent.isVisible()) {\n        parent.show();\n    }\n    fD.show();\n\
  \    String path = fD.getDirectory() + fD.getFile();\n    return path;\n}\n```\n\
  \n注意检查父帧是否可见：与所有的对话框一样，在我们尝试显示之前，父帧必须是激活状态。由于 `FileDialog` 是一个模态对话框，在它出现在屏幕上之后，执行将停止，并在用户选择后恢复。\n\
  \n除了设置模式外，我们还可以在对话框出现在屏幕上之前通过设置 `FilenameFilter` 来改变对话框的行为。通过在某些类中实现接口，然后通过 `setFilenameFilter`\
  \ 将该类传递给 `FileDialog`，我们可以限制 `FileDialog` 展示给用户的文件。通常 `FilenameFilter` 用于过滤，只提供某些类型的文件（例如\
  \ html 文件），或者只在某些日期之后提供文件。要实现 `FilenameFilter`，我们只需要重写如下所示的方法：\n\n```java\nclass\
  \ FilenameFilterWrapper implements FilenameFilter {\n    // 变量，构造函数\n    public\
  \ boolean accept(File dir, String name) {\n        // 决定接受或拒绝\n    }\n}\n```\n\n\
  ## 访问文件系统\n\n正如我们刚刚看到的，文件对话框可以用于允许用户浏览文件系统。但那并不能帮助我们获取用户所选择文件的实际访问。为了做到这一点，必须利用\
  \ `java.io` 包中的两个类：`file` 和 `RandomAccessFile`。\n\n\n\n\n\n请注意，这些类的名称并不完全反映了它们的本质。`File`\
  \ 类是一个抽象，意味着既代表文件也代表目录。该类用于文件管理任务，例如检查给定文件是否存在、删除文件、创建新目录以及在目录结构中向上或向下导航。另一方面，`RandomAccessFile`\
  \ 类用于实际读写文件。你可以将 `File` 类想象为海军，而将 `RandomAccessFile` 类想象为陆战队——前者是运输工具，而后者则在运输上执行具体工作。\n\
  \n## `File` 类\n\n让我们从 `File` 类及其非常重要的静态变量开始。在解决文件系统的非常简单变体（如各种文件分隔符和文件路径）时，静态变量非常有用。该类的方法和构造函数被认为与附加到宿主机文件系统规范的\
  \ `String` 类型变量保持一致，因此在创建文件名时使用这些变量非常重要。表 12-2 给出了文件分隔符、文件路径以及针对 `UNIX` 和 `Windows\
