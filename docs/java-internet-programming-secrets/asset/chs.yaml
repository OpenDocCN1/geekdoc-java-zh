  \ 按钮开关 列表 下拉列表 滚动条说明。\n\n在本章中，我们开始学习语言的一种特殊组件，称为“高级窗口工具包”（“构建窗口界面的工具包”，AWT）。我们将从屏幕用户界面（图形用户界面，GUI）的主要元素开始，这些元素定义在\
