  \n现在是时候链接主运行时系统了。第一步是创建异常层次结构。正如你在第 10 章中所记得的那样，我们简单地重写构造函数并传递异常消息，解释发生了什么。我们在这里不会讨论异常的程序文本——你可以在光盘或在线伴侣页面上找到该程序。在处理异常后，下一步是创建分析器。然后我们实现\
  \ `ActionArea` 子类。\n\n## 创建分析器\n\n在我们开始处理 applet 之前，我们需要创建一个解析器。正如我们在编写 `Configuration`\
  \ 类时讨论过的，分析器的任务是检查配置文件的正确性并将信息传递给 `Configuration` 对象。此外，解析器必须解释 `Configuration`\
  \ 对象可能抛出的异常，并创建易懂的消息。\n\n得益于这种结构，我们的语言分析器只需要遍历一次文档。\n\n这里主要要求是将标签翻译成可以传递给对象的变量。除了这些，还需要几个例程，以提供比异常消息更友好的消息。使消息易懂的最佳方法是遵循行号。正如我们之前所说的，我们仍然需要注释和空行：\n\
