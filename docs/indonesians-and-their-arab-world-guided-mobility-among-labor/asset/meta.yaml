  - 苦难的表征
- - '###'
  - 与 Chan 的观察相似，Gunungembun 对成功的感激叙事通常伴随着对苦难的表征。能够向家汇回大量资金的移民女性会仔细地强调她们海外的生活有多艰辛，付出了多少。此外，她们描绘了残酷且残暴的阿拉伯人形象，并强调自己的道德优越性。通过对阿拉伯文化进行“他者化”，移民女性唤起了一种忍受苦难和优越道德的形象。这种对自身成功的辩护至关重要，因为当时关于移民的流言认为，他们的财务成功似乎并不正当，例如
    Pak Estiono 的案例所示。
