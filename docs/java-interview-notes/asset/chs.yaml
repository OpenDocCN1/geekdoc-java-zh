  \ `java.util.concurrent` 包的迭代器是快速安全迭代器。\n\n## 错误与异常 (ERROR AND EXCEPTION)\n\n###\
  \ 异常 (EXCEPTION)\n\nJava 中的异常层次结构：\n\n![Image](img/image00217.jpeg)\n\n- `Exception`\
  \ 是中断程序执行流的**异常情况**。\n- 所有异常都继承自 `Throwable`。\n- 如果你想创建一个检查异常（checked exception），则要子类\
  \ `Exception` 类；如果你想创建一个未检查异常（unchecked exception），则要子类 `RuntimeException`。\n- 虽然理论上你也可以子类\
  \ `Throwable` 类来创建检查异常，但不建议这样做，因为 `Throwable` 是 Java 中所有异常和错误的父类。\n\n## 问题\n\n-\
  \ 什么是 `Exception`？\n- 解释 Java 中的根层异常超类？\n- 你应该子类哪个超类来创建检查异常？\n- 你应该子类哪个超类来创建未检查异常？\n\
  \n## 检查异常 vs 未检查异常 vs 错误\n\n### 检查异常 (Checked Exception)\n\n- 检查异常在编译时进行检查。\n- 检查异常扩展\
  \ `Throwable` 或其子类，`TimeException` 和 `Error` 类除外。\n- 检查异常在程序上是可以恢复的。\n- 你可以通过 `try/catch`\
  \ 块或在方法声明中使用 `throws` 子句来处理检查异常。\n- 静态初始化器不能抛出检查异常。\n\n```java\npublic static void\
  \ main(String args[]) {\n    FileInputStream fis = null;\n    try {\n        fis\
  \ = new FileInputStream(\"details.txt\");\n    } catch (FileNotFoundException fnfe)\
  \ {\n        System.out.println(\"Missing File :\" + fnfe);\n    }\n}\n```\n\n###\
  \ 未检查异常 (Unchecked Exception)\n\n- 未检查异常在运行时检查。\n- 未检查异常扩展 `RuntimeException` 类。\n\
  - 无法合理要求你从这些异常中恢复。\n- 使用良好的编程技术可以避免未检查异常。\n- 抛出未检查异常有助于发现许多缺陷。\n\n```java\npublic\
  \ int getAccountBalance(String customerName) {\n    int balance = 0;\n    if (customerName\
  \ == null)\n        throw new IllegalArgumentException(\"Null argument\");\n   \
  \ // logic to return calculate balance \n    return balance;\n}\n```\n\n### 错误 (Error)\n\
  \n- `Error` 类用于定义**不可恢复的致命致命异常**，应用程序不应该捕获这些异常。\n- 程序员对这些异常无能为。\n- 即使你捕获了 `OutOfMemoryError`，你仍然会再次得到，因为垃圾回收器可能无法释放内存概率很高。\n\
  - 仅在预期失败且有非常合理的恢复方法的情况下使用 `checked` 异常；对于任何其他情况，请使用 `unchecked` 。\n\n## 问题\n\n-\
