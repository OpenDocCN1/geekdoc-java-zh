  \ 会创建线程吗？\n* `Thread` 类和 `Runnable` 接口都有 run 方法，有什么区别？\n\n# Runnable vs Callable\
  \ 接口\n\n### `Runnable` 接口\n```java\n@FunctionalInterface \npublic interface Runnable\
  \ { \n    public abstract void run();\n}\n```\n\n### `Callable` 接口\n```java\n@FunctionalInterface\
  \ \npublic interface Callable<V> { \n    V call() throws Exception;\n}\n```\n\n\
  * `Runnable` 不能返回结果，也不能抛出检查异常（checked exception）。\n* `Callable` 需要实现 `call()` 方法，而\
  \ `Runnable` 需要实现 `run()` 方法。\n* `Callable` 可以与 `ExecutorService` 方法配合使用，但 `Runnable`\
  \ 不行。\n\n## 问题\n* `Callable` 和 `Runnable` 接口有什么区别？\n* 使用 `Runnable` 相比 `Callable`\
