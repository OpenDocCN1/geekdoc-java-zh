  \ 和 suspend 方法？\n\n# 实现 Runnable vs 扩展 Thread\n\n### 实现 `Runnable` 接口实例化线程\n```java\n\
  public class RunnableDerived implements Runnable { \n    public void run() {\n \
  \   }\n}\n```\n\n### 扩展 `Thread` 类创建线程\n```java\npublic class ThreadDerived extends\
  \ Thread { \n    public void run() {\n    }\n}\n```\n\n* `Runnable` 的 `run()` 方法不会创建新线程，而是在创建它的同一个线程中作为普通方法执行，而\
  \ `Thread` 的 `start()` 方法创建一个新线程。\n* `Runnable` 是在线程上执行任务的优选方式，除非你专门扩展 `Thread`\
  \ 类（这在大多数情况下是不可能的）。\n* 通过实现 `Runnable`，你为专门的类提供了额外的运行能力。\n* 此外，通过将任务分离为 `Runnable`，你可以使用不同的手段执行任务。\n\
  \n## 问题\n* 创建线程的不同方式有哪些？\n* 实现 `Runnable` 接口与扩展 `Thread` 类有什么区别？\n* 什么时候应该扩展 `Thread`\
