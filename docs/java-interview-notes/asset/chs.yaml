- "# Java 面试笔记\n\n\n\n![](img/cover.jpeg)\n\n\n\n\n\n- 匿名内部类总是作为表达式的一部分使用 `new` 操作。\n\
  - 创建匿名类时，`new` 操作后面跟着现有的接口或类名。\n- 匿名类要么实现接口，要么继承现有类。\n\n## 匿名内部类的创建\n```java\n//\
  \ 外部类\npublic class CityNames { \n    private List<String> cityNames = new ArrayList<>();\
  \ \n    public Iterator<String> nameIterator(){ \n        // 匿名内部类 \n        Iterator<String>\
  \ nameIterator = new Iterator<String> () { \n            @Override \n          \
  \  public boolean hasNext() { \n                return false;\n            } \n\
  \            @Override \n            public String next() { \n                return\
  \ null;\n            }\n        }; \n        // 返回局部内部类的实例。 \n        return nameIterator;\n\
  }\n}\n}\n```\n\n# 注意\n- **不要返回内部类对象，因为这会导致内存泄漏，因为它持有对外部外部类的引用。**\n- **当你希望防止在其他地方使用该类时，使用匿名类。**\n\
  - **必须避免匿名类和内部类的序列化，因为不同的 JRE 实现可能会导致兼容性问题。**\n\n## 问题\n- 什么是匿名内部类？\n- 匿名内部类和局部内部类有什么区别？\n\
  - 为什么你不应该从方法返回内部类对象？\n- 如果你想防止别人在外部使用你的类，你会定义哪种内部类？\n- 为什么应该避免匿名类和内部类的序列化？\n\n##\
  \ 函数式编程 (FUNCTIONAL PROGRAMMING)\n\n### 函数式接口\n`Functional Interface` 是只有一个抽象方法的接口；但可以有任意数量的默认方法。\n\
  \n```java\n@FunctionalInterface \npublic interface Greator<T> {\n    T greater(T\
  \ arg1, T arg2);\n}\n```\n\n注解 `@FunctionalInterface` 在接口不是有效的函数式接口时产生编译器警告。\n\n\
  ### 函数式接口 Greater (Function Interface Greater)\n```java\n@FunctionalInterface \n\
  public interface Greator<T> {\n    T greater(T arg1, T arg2);\n}\n```\n\n\n\n\n\n\
  `Account` 类定义如下，用作函数接口 `Greater` 的参数使用。\n\n```java\npublic class Account {\n  private\
  \ int balance;\n\n  public Account(int balance) {\n    this.balance = balance;\n\
  \  }\n\n  public int getBalance() {\n    return balance;\n  }\n\n  @Override \n\
  \  public String toString() {\n    return \"Account{\" +\n    \"balance=\" + balance\
  \ +\n    '}';\n  }\n}\n```\n\n### Lambda Expression\n下面的代码演示了如何使用 `Lambda expression`\
  \ 来查找余额更大的账户。同样，相同的函数接口 `Greater` 也可以用于其他类似的业务对象。\n\n```java\npublic static void\
  \ main(String [] args){\n  Greator<Account> accountComparer =\n  (Account acc1,\
  \ Account acc2) ->\n  acc1.getBalance() > acc2.getBalance() ?\n  acc1 :\n  acc2;\n\
  \  Account account1 =\n  new Account(6);\n  Account account2 =\n  new Account(4);\n\
  \  System.out.println(\n  \" Account with greater balance: \" + accountComparer.greater(account2,\
  \ account1));\n}\n```\n\nJava 还为最常见的场景提供了一组预定义的函数接口。\n\n## Questions\n* 什么是函数接口（Functional\
  \ Interface）？\n* 使用函数接口有什么好处？\n\n### Lambda Expression\n`Lambda expressions` 为创建[匿名类]提供了一种方便的方法。`Lambda\
  \ expressions` 以更紧凑的方式实现了[`函数接口]`。当你想要将某些功能作为参数传递给另一个方法，并推迟该功能的执行直到恰当的时机时，`Lambda\
  \ Expressions` 非常有用。\n\nLambda 表达式可以仅仅是一个带有方法体和可选参数类型的语句块，但没有方法名或返回类型。它可以作为方法参数传递，并存储在变量中。\n\
  \n```java\n// lambda expressions\n() -> 123 (x,y) -> x + y\n(Double x, Double y)\
  \ -> x*y\n```\n\n## Questions\n* 什么是 Lambda Expression？\n* Lambda Expression 和匿名类之间有什么关系？\n\
  * 你可以将 Lambda Expression 作为方法参数传递吗？\n* 使用 Lambda Expression 时，功能延迟执行意味着什么？\n* 使用\
  \ Lambda Expression 有什么好处？\n* Lambda Expression 和函数接口之间有什么关系？\n\n### Pure Functions\n\
  纯函数（Pure Functions）是指结果仅取决于传递给它的参数的函数，不受应用程序中任何状态变化的影响，也不会改变应用程序的状态。纯函数对于相同的参数始终返回相同的结果。\n\
  \n```java\npublic int increaseByFive(int original){\n  int toAdd = 5;\n  return\
  \ original + toAdd;\n}\n```\n\n## Questions\n* 什么是纯函数（Pure Function）？\n* 纯函数在函数式编程中的作用是什么？\n\
  * 如何保证纯函数对于相同的参数总是相同的结果？\n\n### Fluent Interface\n`Fluent interface`（流式接口）用于将命令传递给后续调用，无需创建中间对象，并通过方法链实现。当链式方法返回\
  \ `void` 时，`fluent interface` 链结束。`Fluent interface` 通过减少不必要的对象创建数量提高了可读性。\n\n在下面的代码中，`Fluent\
  \ Interface` 被用于添加新的员工（Employee）。\n\n```java\nemployee.create()\n  .atSite(\"London\"\
  )\n  .inDepartment(\"IT\")\n  .atPosition(\"Engineer\");\n```\n\n流式接口主要用于构建查询、创建一系列对象或按层次顺序构建节点的场景。\n\
  \n## Questions\n* 什么是流式接口（Fluent Interface）？\n* 定义和使用流式接口有什么好处？\n* 描述流式接口的一些用法？\n\
  \n### Generics\n`Generics`（泛型）是一种机制，允许同一类型（类或接口）或方法操作不同类型的对象，同时提供编译时的类型安全。`Generics`\
  \ 的引入是为了强制类型安全，特别是对于集合类。\n\n* 一旦在泛型中定义了参数类型，对象将仅与定义的类型协同工作。\n* 在 `generics` 中，`形式类型参数`（下例中的\
  \ `E`）用类型（类或接口）指定：\n```java\n// Generic List 类型\n// E 是类型参数\npublic interface List<E>\
  \ { \n  void add(E x); \n  Iterator<E> iterator();\n}\n```\n* 在 `generics` 中，当声明类型变量或创建类型类型对象时，会指定`参数化类型`（本例中\
  \ `Integer`）：\n```java\n// 声明了 List 类型变量\n// 使用 Integer 参数类型\nList<Integer> integerList\
  \ = new ArrayList<Integer>();\n```\n\n## Notes\n* 泛型中有一个通用的参数命名约定。`E` 代表元素（element），`T`\
  \ 代表类型（type），`K` 代表键（key），`V` 代表值（values）。\n* 泛型是编译支持。所有类型参数在编译期间都会删除，这个过程被称为擦除。\n\
  * 由于强类型检查，泛型避免了许多 `ClassCastException` 实例发生。\n\n#### Generic Class Example\n* 以下\
  \ `NodeId` 泛型类的定义可以用于任何类型的对象。\n```java\n// 带有类型参数的 NodeId 泛型类\npublic class NodeId<T>\
  \ { \n  private final T Id; \n  public NodeId(T id) { \n    this.Id = id;\n  } \n\
  \  public T getId() { \n    return Id;\n  }\n}\n```\n* 常用的`父类型 – 子类型`SuperType –\
  \ SubType）规则不适用于泛型。在本例中，尽管 `Integer` 派生自 `Object`，但带有 `Integer` 参数的 `NodeId` 仍然不能赋值给带有\
  \ `Object` 参数的 `NodeId`：\n```java\n// 参数类型 Object\nNodeId<Object> objectId = new\
  \ NodeId();\n\n// 参数类型 Integer\nNodeId<Integer> integerId = new NodeId(1);\n```\n\
  \n## Questions\n* 什么是泛型（Generics）？\n* 泛型为集合提供了哪些好处？\n* “泛型是编译支持”这句话是什么意思？泛型不是运行时的吗？\n\
  \n### Type Wildcards\n泛型中的通配符以 `?` 的形式表示。例如，接收 `List<?>` 作为参数的方法可以接受任何类型的 List。\n\
  \n```java\npublic void addVehicles(List<?> vehicles) { //... } \n\n// 只能添加 Truck\
  \ 车辆\npublic void addVehicles(List<? extends Truck> vehicles) { \n  //... \n}\n\
  ```\n\n## Notes\n* 不要返回返回值中使用通配符，因为知道方法的返回值更安全。\n\n### Upper Bound\n为了实施限制，可以在类型参数上设置上界（Upper\
  \ Bound）。上界限制方法接受扩展自指定数据的未知类型参数，如示例中的 `Number`。\n\n```java\n// 上界通配符\npublic void\
  \ addIds(List<? extends Number> T){}\n```\n\n### Lower Bound\n为了实施限制，可以在类型参数上设置下界（Lower\
  \ Bound）。下界限制方法接受指定数据的父类的未知类型参数，如下例中的 `Float`。\n\n```java\n// 下界通配符\npublic void\
  \ addIds(List<? super Float> T){}\n```\n\n### Type Inference\n类型推断（Type Inference）是编译器通过方法调用和声明来推断类型参数的能力。\n\
  \n在泛型中，称为`钻石运算符`的 `<>` 有助于类型推断。\n\n```java\n// 使用钻石操作符的类型推断\nList<Integer> integerList\
  \ = new ArrayList<>();\n```\n\n## Questions\n* 泛型中的类型通配符（Type Wildcards）是什么？\n*\
  \ 解释上界通配符？\n* 解释下界通配符？\n* 泛型中如何使用不同的类型通配符？\n* 泛型中的自动类型推断是什么？泛型中的钻石运算符是什么？\n\n###\
  \ Generic Method\n泛型方法定义自己的类型参数。\n\n```java\n// 泛型方法\npublic <T> void addId(T id){}\n\
  ```\n\n\n\n\n- 如果我们从上述方法中移除 `<T>`，会导致编译错误，因为它代表了泛型方法中类型参数的声明。\n- 拥有泛型方法的类型（类或接口）不需要是泛型类型。\n\
  - 在调用泛型方法时，我们不需要显式指定类型参数。\n\n### 注意事项\n- 优先使用泛型（Generics）和参数化类/方法来强制编译时类型安全。\n-\
  \ 使用边界类型参数（Bounded Type parameter）来增加方法参数的灵活性，同时它也有助于限制可以使用的类型。\n\n## 问题\n- 解释什么是泛型方法？\n\
  - 你可以在非泛型类型中添加泛型方法吗？\n- 将边界类型定义为方法参数的处是什么？\n- 泛型是如何强制执行编译类型安全的？\n\n# Java 泛型 vs\
  \ Java 数组 (Java Generics vs Java Array)\n\n## Java Generics (Java Generics)\n\n\
  考虑以下层级结构：\n\n![Image](img/image00215.jpeg)\n\n由于 `Car` 和 `Bike` 均派自 `Vehicle`，是否可以将\
  \ `List<Car>` 或 `List<Bike>` 赋值给 `List<Vehicle>` 变量？\n\n实际上不能，`List<Car>` 或 `List<Bike>`\
  \ 不能替换为 `List<Vehicle>`，因为你不能在一个包含汽车的列表中放入一辆自行车。所以，即使 `Bike` 是一个 `Vehicle`，它也并不是一个\
  \ `Car`。\n\n```java\nList<Bike> bikes = new ArrayList<Bike>();\n// 假设这是允许的\nList<Vehicle>\
  \ vehicles = bikes; \nvehicles.add(new Car());\n\n//  Error - Bike 和 Vehicle 被认为是不兼容的类型。\n\
  Bike bike = vehicles.get(0); \n```\n\nJava 编译器会在编译时对这些不兼容的类型进行检查。更多信息请参考 类型擦除。\n\
  \n## Java Array (Java Array)\n\n然而，与泛型不同，`Car` 数组可以赋值给 `Vehicle` 数组：\n\n```java\n\
  Car[] cars = new Car[3]; \nVehicle [] vehicles = cars;\n```\n\n对于数组，尽管编译器允许上述代码编译，但当你运行这段代码时，会得到\
  \ `ArrayStoreException`。\n\n```java\n// 这将导致 ArrayStoreException\nvehicles[0] =\
  \ new Bike();\n```\n\n所以，即使编译器没有捕获此问题，运行时类型系统捕获了它。数组是可实例化类型（reifable types），这意味着运行时感知感知其类型。\n\
  \n## 问题\n- 什么是可实例化类型（reifable types）？\n- 为什么不能将子类型的泛型集合对象赋值给父类型的泛型集合对象？\n- 为什么允许将子类型的数组对象赋值给父类型的数组对象？Java\
  \ 数组比泛型更具多态性吗？\n\n# Type Erasure (类型擦除)\n\n对于 Java 泛型类型，由于被称为 `type erasure` 的过程，Java\
  \ 编译器会丢弃类型信息，这些信息在运行时是不可用的。由于类型信息在运行时不可用，Java 编译器会格外小心在编译阶段就阻止你，防止任何堆污染。\n\n泛型类型也属于非可实例化类型（`non-reifiable`），这意味着它的类型信息在编译期间被移除了。\n\
  \n## 问题\n- 什么是非可实例化类型？\n- 什么是类型擦除？\n- 如果没有类型擦除会发生什么？\n\n# Co-variance (协变)\n\n`Covariance`（协变）是一种概念，你可以从带有上限类型通配符定义的泛型中读取项，但不能向集合中写入任何内容。\n\
  \n考虑以下带有上限类型通配符的声明：\n\n```java\nList<? extends Vehicle> vehicles = new ArrayList<Bike>();\
  \ \n```\n\n你允许从 `vehicles` 泛型集合中读取，因为列表中存在的任何内容都是 `Vehicle` 的子类，并且可以向上转换为 `Vehicle`。\n\
  \n```java\nVehicle vehicle = vehicles.get(0);\n```\n\n然而，你不允许向协变结构中放入任何内容。\n\n```java\n\
  // 这是编译错误\nvehicles.add(new Bike());\n```\n\n这是不允许的，因为 Java 无法保证泛型结构中对象的实际类型。它可以是任何扩展\
  \ `Vehicle` 的类型，但编译器无法确定。所以你可以读取，但不能写入。\n\n## 问题\n- 解释什么是协变？\n- 为什么不能向带有上限类型通配符定义的泛型中添加子类元素？\n\
  \n# Contra-variance (逆变)\n\n`Contra-variance`（逆变）是一种概念，你可以向带有下界类型通配符定义的泛型中写入项，但不能从集合中读取任何内容。\n\
  \n考虑以下带有下界类型通配符的声明：\n\n```java\nList<? super Car> cars = new ArrayList<Vehicle>();\n\
  ```\n\n在这种情况下，尽管 ArrayList 是 `Vehicle` 类型，你也可以通过逆变向其中添加 `Car`；因为 `Car` 派生自 `Vehicle`。\n\
  \n```java\ncars.add(new Car());\n```\n\n然而，你不能假设你会从这个逆变结构中获得一个 `Car` 对象。\n\n```java\n\
  // 这是编译错误\nCar vehicle = cars.get(0);\n```\n\n## 问题\n- 解释什么是逆变？\n- 为什么不能从带有下界类型通配符定义的泛型中读取元素？\n\
  \n# Co-variance vs Contra-variance (协变 vs 逆变)\n\n- 当你只打算从集合中读取泛型值时，使用 `covariance`（协变）；\n\
  - 当你只打算向集合中添加泛型值时，使用 `contra-variance`（逆变）；\n- 当你打算同时对集合进行读取和写入时，使用特定的泛型类型。\n\n\
  ## 问题\n- 你什么时候应该使用协变？\n- 你什么时候应该使用逆变？\n\n# COLLECTIONS (集合)\n\n## Collections (集合)\n\
  \n集合是创建任何生产级 Java 应用程序的基础构建块。面试官对理解与集合正确用法相关的不同方面感兴趣。\n\n问题通常用于检查面试者是否理解集合的正确用法以及是否了解可选的替代方案。\n\
  \n以下是关于集合的问题涉及：\n- Java 中的集合类型。\n- 不同集合类型的特性。\n- 同步集合。\n- 并发集合。\n- 集合元素的排序。\n- 从集合读取的速度。\n\
  - 写入集合的速度。\n- 集合元素的唯一性。\n- 集合间的操作。\n- 只读集合。\n- 集合遍历。\n\n## Collection Fundamentals\
  \ (集合基础)\n\n集合是一个将多个元素组合的容器。这是一个简单的集合示例：\n\n```java\n// 创建城市列表\nList<String> cities\
  \ = new ArrayList<>(); \n// 添加城市名称\ncities.add(\"London\"); \ncities.add(\"Edinburgh\"\
  ); \ncities.add(\"Manchester\");\n```\n\n### 注意事项\n- 集合处理引用类型。\n- 所有的集合接口实现都是泛型的（Generic）。\n\
  - 所有的集合类型都可以增长或缩小，与数组不同。\n- Java 提供了许多根据其用法操作集合的方法，因此在添加之前，始终检查已有的方法。\n\n## Collection\
  \ Framework (集合框架)\n\n集合框架由以下组件定义：\n\n- *Interfaces*（接口）：是为每个特定用法和集合类型定义的抽象类型。\n\
  - *Implementation*（实现）：是用于创建表示不同类型集合对象的具体实现类。\n- *Algorithms*（算法）：应用于这些集合，以执行各种计算并操作集合中的元素。\n\
  \n*Collection Framework*（集合框架）通过提供数据结构和对其操作的算法来减少编程工作量。\n\n## 问题\n- 解释集合？\n- 集合和泛型有什么关系？\n\
  - 你可以在基本类型上使用集合吗？\n- 你如何可以在基本类型使用集合？\n- 解释集合和数组的区别？\n- 集合框架的好处是什么？\n- 集合框架的不同组件有哪些？\n\
  \n\n\n\n\n接口通过其定义的方法签名来定义其行为。使用集合时，你应该始终针对集合接口编写代码，而不是类实现，这样代码就不会依赖于特定的实现。这可以防止底层实现类可能发生的变化的影响。\n\
  \n以下是定义集合及其行为最重要的接口。下方的每个子节点都继承自其父节点。\n\n- `Collection`\n    - `Queue`\n       \
  \ - `BlockingQueue`\n        - `TransferQueue`\n        - `BlockingDeque`\n    \
  \    - `Deque`\n- `BlockingDeque`\n    - `List`\n    - `Set`\n    - `SortedSet`\n\
  \    - `NavigableSet`\n- `Map`\n    - `SortedMap`\n\n## 问题\n- 为什么你应该针对集合接口编写代码而不是具体的实现？\n\
  \n## 集合类型\n- `Set` - `Set` 包含唯一元素。\n- `List` - `List` 是一个有序集合。\n- `Queue` - `Queue`\
  \ 以先进先出 (FIFO) 的方式在处理前持有元素。\n- `Deque` - `Deque` 以先进先出 (FIFO) 和后进先出 (LIFO) 两种方式在处理前持有元素。\n\
  - `Map` - `Map` 包含键到对应值的映射。\n\n## 问题\n- 有哪些不同的集合类型？\n- 定义 `Set` 集合类型？\n- 定义 `List`\
  \ 集合类型？\n- 定义 `Queue` 集合类型？\n- 定义 `Deque` 集合类型？\n- 定义 `Map` 集合类型？\n- `Queue` 和 `Deque`\
  \ 之间的区别是什么？\n\n## Set\n\n### Basic Set\n```java\n// 创建一个 set\nSet<String> set =\
  \ new HashSet<>();\n```\n- `Set` 是唯一元素的集合。\n- `Set` 中的元素是无序存储。\n- `Set` 中只能添加一个\
  \ `null` 元素。（等待，原文说只能有一个 `null`）\n- 重复元素会被忽略。\n- 当不需要排序时，`Set` 最快且内存占用较小。\n\n###\
  \ Linked Hashset\n```java\n// 创建一个 linkedHashSet\nSet<String> linkedHashSet = new\
  \ LinkedHashSet<>();\n```\n- `LinkedHashSet` 保持 `Set` 元素与其插入时的相同顺序。\n- 如果在 `LinkedHashSet`\
  \ 中重新插入一个元素，插入顺序不会受影响。\n- `LinkedHashSet` 中的 `Iterator` 按照这些元素添加到集合的相同顺序返回元素。\n\n\
  ### Sorted Set\n- `SortedSet` 强制对元素进行排序，要么通过实现 `Comparable` 接口按自然顺序排序，要么使用 `Comparator`\
  \ 对象进行自定义排序。\n- `TreeSet` 是 `SortedSet` 接口的一个实现类。\n```java\n// 创建按城市名称排序的集合\nSortedSet<String>\
  \ cityNames = new TreeSet<>();\n```\n- 使用 `Comparator` 对象执行自定义排序。\n```java\nSortedSet<City>\
  \ sortedCitiesByName = new TreeSet<>(Comparator.comparing(City::getName));\n```\n\
  - 如果元素实现了 `Comparable` 接口，则使用 `compareTo()` 方法按自然顺序排序。\n\n### Navigable Set\n- `NavigableSet`\
  \ 继承自 `SortedSet` 并定义了额外方法。\n- `NavigableSet` 可以按升序和降序两种顺序进行遍历。\n- `TreeSet` 是 `NavigableSet`\
  \ 接口的实现类之一。\n\n## 问题\n- 你可以在 `Set` 中添加重复元素吗？\n- 当不需要排序时，你应该使用哪种集合类型？为什么？\n- 你可以向\
  \ `Set` 添加 `null` 元素吗？\n- 你应该使用哪个 `Set` 类来维护插入顺序？\n- 如果在 `Set` 中再次插入相同的元素，排序会发生什么？它会保持原始位置还是插入到末尾？\n\
  - 你应该使用哪个 `Set` 类来确保元素的顺序？\n- 当你需要双向方向遍历时，你应该使用哪个 `Set` 类？\n\n## LIST\n- `List`\
  \ 是对象的对象的有序集合。\n- `List` 可以有重复元素。\n- `List` 可以有多个 `null` 元素。\n- 在 `List` 中，元素可以添加到任何位置。\n\
  - 使用 `ListIterator`，列表可以正向和反向两个方向进行迭代。\n```java\n// 创建一个城市列表\nList<String> cities\
  \ = new ArrayList<>();\n```\n\n### ArrayList\n- `ArrayList` 基于数组。\n- 如果你频繁访问元素，它的性能更好。\n\
  - 在 `ArrayList` 中添加和删除较慢。如果在任何位置（末尾除）添加元素，需要移动元素。如果添加的元素超过了容量，则会将整个数组复制到新分配的地方。\n\
  \n### Linked List\n- `LinkedList` 基于列表。\n- `LinkedList` 访问元素较慢，且只允许顺序访问。\n- 在 `LinkedList`\
  \ 中添加和删除元素更快。\n- `LinkedList` 比 `ArrayList` 消耗更多内存，因为它保留了指向相邻元素的指针。\n\n### List\
  \ Iterator\n- `ListIterator` 在两个方向上迭代列表。\n```java\n// 全量列表迭代器\nListIterator<String>\
  \ fullIterator = cityList.listIterator();\n// 部分列表迭代器，从索引 3 开始\nListIterator<String>\
  \ partialIterator = cityList.listIterator(3);\n```\n\n## Notes\n- `ArrayList` 的随机访问性能更好，因为它为元素维护了基于索引的系统，而\
  \ `LinkedList` 的开销更大，因为它需要遍历所有元素。\n\n## 问题\n- 你可以向 `List` 添加重复元素吗？\n- 你可以向列表添加 `null`\
