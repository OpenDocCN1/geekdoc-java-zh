  \n# Map\n\n* `Map` 包含键值映射。\n\n* 通常 `Map` 允许一个 `null` 作为键以及多个 `null` 作为值，但具体限制取决于\
  \ `Map` 实现类的定义。\n\n## Implementation\n\n### HashMap\n\n* `HashMap` 基于哈希表（hash table）。\n\
  \n* `HashMap` 不保证 map 中元素的顺序。\n\n* `HashMap` 的哈希函数为 `get` 和 `put` 操作提供常数时间性能。\n\n\
  * `HashMap` 允许一个 `null` 键和多个 `null` 值。\n\n```java\n// 使用 HashMap 创建一个 map Map<String,\
  \ String> hashMap = new HashMap<>();\n```\n\n### LinkedHashMap\n\n* `LinkedHashMap`\
  \ 是 `Map` 接口的基于哈希表和链表的实现。\n\n* `LinkedHashMap` 使用双向链表存储条目。\n* 如果需要保持插入顺序，请使用 `LinkedHashMap`\
  \ 代替 `HashSet`。\n* `HashMap` 的性能略优于 `LinkedHashMap`，因为 `LinkedHashMap` 还需要维护链表。\n\
  * 它确保按照插入顺序对条目进行迭代。\n\n```java\n// LinkedHashMap LinkedHashMap lhm = new LinkedHashMap();\n\
  ```\n\n### WeakHashMap\n\n* `WeakHashMap` 仅对其键存储弱引用（weak references）。\n* `WeakHashMap`\
  \ 同时支持 `null` 键和 `null` 值。\n* 当没有引用指向键时，它们将成为垃圾回收的候选。\n\n```java\n// WeakHasMap\
  \ Map map = new WeakHashMap();\n```\n\n### Sorted Map\n\n* `SortedMap` 对其键提供完全排序。\n\
  * 根据自然排序（`Comparable`）或自定义排序（`Comparator`）对 map 条目进行键排序。\n* `SortedMap` 接口继承自 `Map`。\n\
  \n```java\n// 排序 map SortedMap<String,String> sm = new TreeMap<>();\n```\n\n###\
  \ Navigable Map\n\n* `NavigableMap` 扩展了 `SortedMap` 接口。\n* `TreeMap` 类是 `NavigableMap`\
  \ 的实现。\n* `NavigableMap` 可以以升序和降序方式访问。\n* 它支持双向导航并获取键的最接近匹配项。\n\n```java\n// 创建一个\
  \ Navigable Map NavigableMap<String,String> nm = new TreeMap<>();\n```\n\n### Concurrent\
  \ Map\n\n* `ConcurrentHashMap` 是 `ConcurrentMap` 接口的具体实现。\n* `ConcurrentMap` 通过将\
  \ map 划分为多个桶（buckets）并单独锁定每个桶 get 细粒度同步机制。\n* `ConcurrentHashMap` 在从 map 读取时不会锁定\
  \ map。\n\n```java\n// 创建一个 Concurrent Map ConcurrentMap<String,String> cm = new\
  \ ConcurrentHashMap<>();\n```\n\n## Notes\n\n* `Map` 的键和 `Set` 的项不能更改状态，因此这些必须是不可变对象。\n\
  * 为了避免实现 `hashCode()` 和 `equals()`，优先使用 JDK 提供的不可变类作为 `Map` 的键。\n* 永远不要向调用者暴露集合字段，而是提供方法来操作这些字段。\n\
  * `HashMap` 在 map 中插入、定位和删除元素方面提供了更好的性能。\n* 如果你需要按排序顺序遍历键，`TreeMap` 更好。\n\n## Questions\n\
