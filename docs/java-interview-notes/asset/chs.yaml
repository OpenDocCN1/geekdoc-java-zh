  \n### 单元测试\n\n## 为什么要进行单元测试？\n\n最重要的两个原因\n* 只有通过亲身实践才能理解真正的益处。\n* 单元测试能帮助你晚上睡得安稳。\n\
  \n其他重要原因\n* 单元测试对代码更改的成功/失败提供快速且持续的反馈。\n* 单元测试增加了进行重大更改的信心，而不必担心破坏现有功能。\n* 单元测试帮助你理解代码内部实现和设计。\n\
  * 单元测试还可以作为各种编码场景的文档。\n* 单元测试通过减少对不同场景的多次手动验证周期，在长期内节省时间。\n\n## 问题\n* 单元测试有什么益处？\n\
  * 单元测试如何在长期内节省时间？\n* 你如何利用单元测试来记录编码场景？\n\n## 单元测试 vs 集成测试 vs 回归测试 vs 验证测试\n\n###\
  \ 单元测试\n`Unit testing` 在编写代码时持续进行，以便对所作的最最小的可测试更改获得即时反馈。最小的可测试单元可以跨越方法或类，但必须排除外部依赖，如文件\
  \ I/O、数据库、网络访问等。\n\n### 集成测试\n`Integration testing` 用于在某个场景或功能的所有更改已完全实现后，测试端到端的集成情况。\n\
  \n### 回归测试\n`Regression testing` 是在整个软件上执行的一系列测试，以发现功能性和非功能性区域的缺陷。回归测试通常在增强、软件更新等之后进行。\n\
  \n### 验证测试\n`Validation testing` 通常在更新或部署软件后执行，以验证更改是否按照需求完成。\n\n## 问题\n* 什么是单元测试？\n\
  * 什么是集成测试？\n* 什么是回归测试？\n* 集成测试和回归测试之间有什么区别？\n* 什么是验证测试？\n\n## 测试私有成员\n\n可以使用 `reflection,`（反射）测试私有成员，但建议在需要测试某些遗留代码且不允许更改私有方法的可见性时，`only`这样做。\n\
  \n### 用法\n以下代码演示了如何使用反射访问 `Account` 类的私有字段。\n\n```java\npublic class Account {\n\
  \    private float rate = 10.5f;\n}\n\n@Test\npublic void testConcatenate() throws\
  \ IllegalAccessException, NoSuchFieldException {\n    Account account = new Account();\n\
  \    Class<? extends Account> refClass = account.getClass();\n    Field field =\
  \ refClass.getDeclaredField(\"rate\");\n    field.setAccessible(true);\n    assertEquals(10.5f,\
  \ field.get(account));\n}\n```\n\n如所述，不建议使用反射访问私有字段；您有以下替代方案来测试私有方法中的代码：\n* 通过公共方法测试私有方法。\n\
  * 如果可能，更改字段的访问修饰符。\n* 修改类设计。\n\n## 问题\n* 测试私有成员的不同方法有哪些？\n* 你可以使用反射测试私有成员吗？\n* 为什么你不应该使用反射测试私有成员？\n\
  * 测试私有成员的替代方法有哪些？\n\n## Mock（打桩）\n\n单元测试的主要职责是验证类代码中的条件逻辑，这些逻辑应该运行得极快以便提供即时反馈。为了实现即时反馈，类必须没有外部依赖；这在面向对象的软件开发中是不实际的，因为你需要与外部对象通信以执行文件\
  \ IO、管理数据库访问、与 Web 服务通信等。因此，`mocking`的基本思想是`将这些外部依赖替换为 mock 对象（模拟对象）`以隔离被测试对象。\n\
  \n### Mocking 的益处\n* Mock 对象帮助你隔离并仅测试类中的条件逻辑，而不测试其依赖项。\n* 在 mock 对象中，你可以实现测试所需的部分功能，而无需实现完整的依赖对象。\n\
  * 你不需要担心理解依赖的内部实现，这有助于加快开发速度。\n\n## 问题\n* 什么是 mock 对象？\n* 使用 mock 对象有什么益处？\n* 为什么\
  \ mock 对象有助于加速测试？\n* Mocking 如何帮助实现更快的开发周期？\n* 你应该用哪些类型的依赖项来替换 mock 对象？\n\n# JAVA\n\
  \n## 工具\n\n### Git\n`Git` 是一个源码级管理系统。它是一个`分布式版本控制系统 (DVCS),`，便于多个开发人员和团队并行工作。Git\
  \ 的重点是在维护数据完整性的同时提供速度。\n\n`Git` 还提供了在网络不可用时离线执行几乎所有操作的能力。当网络可用时，所有更改都可以推送到服务器。\n\
  \n让我们讨论几个常用的术语：\n* `Repository`（仓库） - 包含所有项目文件的目录。\n* `Clone`（克隆） - 创建本地仓库的工作副本。\n\
  * `Branch`（分支） - 用于封装新功能的开发或修复 bug。\n* `HEAD` - 指向最后提交。\n* `Commit`（提交）将更改提交到 HEAD\
  \ 而不是远程仓库。\n* `Pull`（拉取）从远程仓库获取更改到本地仓库。\n* `Push`（推送）将本地仓库的更改提交到远程仓库。\n\nGit 工作流结构\n\
  ![Image](img/image00223.jpeg)\n\n## 问题\n* 什么是分布式版本控制系统？\n* 为什么要使用版本控制系统？\n* 你使用版本控制系统执行哪些典型活动？\n\
  * 解释你遵循的分支策略？\n\n### Maven\n`Maven` 是一个软件项目管理框架，负责项目构建、测试、部署、报告等。Maven 基于约定而非复杂的配置；也就是说，如果项目按照预定义的约定布局（如下所示），它将能够找到执行不同构建操作的资源。\n\
  \n![Image](img/image0224.jpeg)\n\nMaven 由 `pom.xml`（也称为项目对象模型）文件管理，该文件便于定义各种任务（或\
  \ goals），并设有专门区域来指定各种项目依赖，由 Maven 进行解析。\n\n## 问题\n* 为什么需要框架来解析依赖，你可以手动下载文件并添加引用？\n\
  * Maven 支持哪些功能？\n* 为什么说 Maven 是基于约定的？\n* Maven 中的 goals 是什么？\n\n### Ant\n`Ant` 是一个强大的基于\
  \ XML 的脚本工具，用于自动化构建过程。自动化构建基础设施是持续集成周期中非常重要的元素。\n\n`Ant` 提供对代码编译、测试和打包等支持，这些可以被定义为一系列任务。与\
  \ Maven 不同，Ant 是配置驱动而非约定驱动。类似于 Maven 中的 `goals`，你可以在 Ants 中定义 `Targets`（目标），它们是一系列任务。Ant\
  \ 依赖 `build.xml` 文件（也可以指定不同的名称）来执行定义的目标。\n\n## 问题\n* Ant 工具用于什么？\n* Ant 支持哪些功能？\n\
  * Ant 和 Maven 之间有什么区别？\n* Ant 中的 Targets 是什么？\n\n## Jenkins\n持续集成\n\n\n\n\n\n##\
  \ 持续集成\n\n持续集成（Continuous Integration）是一项实践，指在同一代码仓库上并行工作的开发者频繁地合并他们的更改。每次提交都会触发一系列自动化活动，旨在验证提交的更改。代码提交后的典型自动化活动包括：\n\
  \n- 从仓库中获取更改。\n- 执行自动化构建。\n- 执行不同的测试，如单元测试、集成测试、验证测试等。\n- 部署更改。\n- 发布结果。\n\n## Jenkins\n\
  \nJenkins 是一个用于执行持续集的开源 Web 端工具。Jenkins 提供了配置选项，用于配置和执行上述所有活动。提供的配置选项包括：配置 JDK、安全、构建脚本；与\
  \ Git、Ants、Maven、Gradle 等集成；部署等。\n\n作业（Jobs）的执行可以与某些事件关联，也可以基于基于时间的调度。\n\n## 问题\n\
