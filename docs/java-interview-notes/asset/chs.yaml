  - 它将任务划分为子任务并并行执行。\n- `fork()` 方法从任务中派生一个新的子任务。\n```java\n// 派生子任务\nsubTask.fork();\n\
  ```\n- `join()` 方法让任务等待其他任务完成。\n```java\n// 等待子任务完成\nsubTask.join();\n```\n\n###\
