  * 如果要保持插入顺序，你会使用哪一个：`LinkedHashMap` 还是 `HashSet`？为什么？\n* 什么是 `WeakHashMap`？\n* 当你想维护键的顺序时，你会使用哪种\
  \ Map 类？\n* 你使用哪种 Map 类来以升序和降序访问？\n* 哪种 Map 实现针对线程安全进行了优化？\n* `ConcurrentHashMap`\
  \ 如何实现扩展性并同时保持良好的性能？\n* 为什么用于 Map 的键和用于 Set 的值应该是不可变类型？\n* 向调用者暴露内部集合对象有什么坏处？\n\
  * 如果你想按排序顺序遍历集合，哪种集合最好？\n\n# Algorithms\n\n* `Sorting` - 用于按升序或降序对集合排序。你可以使用自然顺序（如果\
  \ `key` 类实现了 `Comparable` 接口），或者需要传递 `Comparator` 对象进行自定义排序。\n* `Searching` - `BinarySearch`\
  \ 算法用于搜索键。\n* `Shuffling` - 它按随机顺序重新排列列表中的元素，通常用于游戏。\n* `Data Manipulation` - 提供\
  \ `reverse`、`copy`、`swap`、`fill` 和 `addAll` 算法对集合元素执行通常的数据处理。\n* `Extreme Value`\
  \ - 提供 `min` 和 `max` 算法用于查找指定集合中的最大值。\n\n## Questions\n\n* 集合框架支持哪些不同的算法？\n* 使用哪种搜索算法搜索键？\n\
  * 如何使用洗牌（shuffling）算法？\n\n## Comparable vs Comparator\n\n* 实现 `Comparable` 接口按自然顺序排序集合元素，`Comparator`\
  \ 对象用于执行自定义排序。\n* 如果元素实现了 `Comparable`，则使用 `compareTo()` 方法进行排序。\n* `Comparator`\
  \ 对象用于执行自定义排序。\n\n```java\n// Comparable 接口实现\n@Override public int compareTo(Employee\
  \ employee) {\n    // 比较逻辑\n}\n```\n\n```java\n// 使用 Comparator\nSortedSet<City>\
  \ sortedCities = new TreeSet<>(Comparator.comparing(City::getName));\n```\n\n* `Comparator`\
  \ 通常用于在你无法完全控制该类时。\n\n## Questions\n\n* `Comparable` 接口和 `Comparator` 类有什么区别？\n\
  * 你何时实现 `Comparable` 接口来排序集合？\n* 你何时使用 `Comparator` 类来排序集合？\n\n# hashCode() and\
  \ equals()\n\n* `HashTable`、`HashMap` 和 `HashSet` 使用 `hashCode()` 和 `equals()` 方法来计算和比较作为键的对象。\n\
  * Java 中的所有类都继承自 `java.Object` 基类方案，除非它们重写了 `hashCode()` 方法。\n* 任何重写了 `hashCode()`\
  \ 方法的类也应该重写 `equals()` 方法。\n\n## Implementation of hashCode() and equals()\n\n```java\n\
  final public class Employee {\n    final private int id;\n    final private String\
  \ name;\n    final private String department;\n\n    @Override public boolean equals(Object\
  \ o) {\n        if (this == o) return true;\n        if (o == null || getClass()\
  \ != o.getClass()) return false;\n        Employee employee = (Employee) o;\n  \
  \      if (id != employee.id) return false;\n        if (name != null ? !name.equals(employee.name)\
  \ : employee.name != null) return false;\n        return !(department != null ?\
  \ !department.equals(employee.department) : employee.department != null);\n    }\n\
  \n    @Override public int hashCode() {\n        int result = id;\n        result\
  \ = 31 * result + (name != null ? name.hashCode() : 0);\n        result = 31 * result\
  \ + (department != null ? department.hashCode() : 0);\n        return result;\n\
  \    }\n}\n```\n\n## Rules of hashCode and equals\n\n* 对象一旦创建，在其生命周期内必须始终报告相同的哈希码。\n\
  * 相同类的相等对象必须返回相同的哈希码。\n\n\n\n\n\n# 注意\n\n两个不相等的对象可能具有相同的哈希值（hash-code）。\n\n## `hashCode()`\
  \ 和 `equals()` 的用法\n\n* `hashCode()` 和 `equals()` 方法用于将项隔离开不同的桶（buckets）中，以提高查找效率。如果两个\
  \ `Items` 具有相同的哈希值，那么它们将将被存储在**同一个桶**中，并通过链表连接。\n* 如果两个对象的哈希值不同，则不会调用 `equals()`\
  \ 方法；否则，会调用 `equals()` 方法来比较它们是否相等。\n\n下图构性地从概念上展示了对象在哈希桶中的存储情况。\n\n![Image](img/image00216.jpeg)\n\
  \n## 问题\n\n* Java 中哪些使用了 `hashCode` 和 `equals` 方法的不同集合类型？为什么这些集合类型需要使用 `hashCode`\
  \ 和 `equals` 方法？\n* 当你重写 `hashCode()` 方法时，为什么要也重写 `equals()` 方法？\n* 既然 `java.lang.Object`\
  \ 类中已经存在 `hashCode()` 方法，为什么你还需要重写它？\n* 为什么对象在整个生命周期内每次都要返回相同的哈希值？\n* 对象在每次程序运行时都必须返回相同的哈希值吗？\n\
  * 两个相等的对象是否必须返回相同的哈希值？\n* 两个对象即使不相等，是否仍可能具有相同的哈希值？\n* 计算哈希值的目的是什么？\n* `equals` 方法的作用是什么？\n\
  * 如果两个对象具有相同的哈希值，它们是如何存储在哈希桶中的？\n* 如果两个对象的哈希值不同，你还需要 `equals` 方法吗？\n* 如果两个对象具有相同的哈希值，`equals`\
  \ 方法是如何使用的？\n\n## HashTable vs HashMap\n\n`HashTable` 和 `HashMap` 是用于存储**键值对（key-value\
  \ pair）**的数据结构。它们维护一个桶数组，每个元素根据键对象的哈希值添加到相应的桶中。\n\n它们之间的主要区别在于 `HashMap` 是**非同步的**（non-synchronized）。这使得\
  \ `HashMap` 更适用于单线程应用程序，因为由于缺少锁定开销，非同步的 `Objects` 性能优于同步的对象。在多线程应用中应该使用 `HashTable`。\n\
  \n可以使用以下方法将 HashMap 转换为同步集合：\n\n`Collections.synchronizedMap(idToNameMao);`\n\n\
  ## 问题\n\n* `HashTable` 和 `HashMap` 的目的是什么？\n* `HashTable` 和 `HashMap` 之间有什么区别？\n\
  * `HashTable` 和 `HashMap 是如何存储对象的？\n* 为什么 `HashMap` 更适合单线程应用程序？\n* 为什么 `HashMap`\
  \ 的性能比 `HashTable` 好？\n* 如何在多线程环境中使用 `HashMap`？\n\n## 同步集合与并发集合\n\n`synchronized`（同步）和\
  \ `concurrent`（并发）集合类提供了线程安全性，但它们之间的主要区别在于可扩展性和性能。\n\n### 集合同步（Collection Synchronization）\n\
  \n* `集合同步`通过允许一次**仅**单个线程访问集合来实现。\n* 它通过将所有公共方法标记为 `synchronized` 来实现。\n* 任何调用多个方法的复合操作，都需要在客户端通过锁定该操作来处理。\n\
  * 同步集合的示例包括 `HashTable`、`HashSet` 和同步后的 `HashMap`。\n\n### 集合并发（Collection Concurrency）\n\
  \n* `集合并发`通过允许多个线程同时访问集合来实现。\n* `ConcurrentHashMap` 通过根据哈希值将集合划分为多个桶，并使用不同的锁来保护每个哈希桶，从而对集合实现了非常细粒度的锁定。\n\
  * 它的性能显著更好，因为它允许多个并发写入者同时访问集合，而无需锁定整个集合。\n* 并发集合的示例包括 `ConcurrentHashMap`、`CopyOnWriteArrayList`\
  \ 和 `CopyOnWriteHashSet`。\n\n对于大型集合，应倾向于使用 `ConcurrentHashMap` 等并发集合而不是 `HashTable`，因为由于锁定开销较小，并发集合的性能会更好。\n\
  \n注意，在存在操作间依赖的**多线程场景**中，你仍然需要为并发集合上的这些复合操作提供同步访问，如下所示：\n\n```java\nObject synchObject\
  \ = new Object();\n\nConcurrentHashMap<String, Account> map = new ConcurrentHashMap<>();\n\
  \npublic void updateAccount(String userId){\n synchronized (synchObject) {\n Account\
  \ userAccount = map.get(userId);\n if (userAccount != null) {\n //// 某些操作 }\n }\n\
  }\n```\n\n## 问题\n\n* 同步和并发集合的目的是什么？\n* 什么是集合同步？\n* 什么是集合并发？\n* 你如何实现集合同步？\n* 在需要调用多个方法完成操作的复合操作情况下，如何确保对集合的同步访问？\n\
  * 你如何实现集合并发？\n* `ConcurrentHashMap` 如何为多个线程提供并发访问？\n* 尽管允许从多个线程同时写入，为什么 `ConcurrentHashMap`\
  \ 的性能仍然更好？\n* 在 `ConcurrentHashMap` 和 `HashTable` 之间你更倾向于哪一个？为什么？\n\n## 遍历集合\n\n\
  Java 中有几种方法可以遍历 `collection`（集合）。以下是最常见的方法。\n\n### Iterable.forEach\n\n`forEach`\
  \ 方法在实现了 `Iterable` 接口的集合中可用。`forEach` 方法接受一个 `Consumer` 类型的参数。\n\n```java\nList<Account>\
  \ accounts = Arrays.asList(new Account(123), new Account(456));\naccounts.forEach(acc\
  \ -> *print(acc));\n```\n\n### for-each 循环\n\n* `for-each` 循环可以用于遍历 `map.entrySet()`\
  \ 以获取键值。\n\n```java\nfor (Map.Entry<String, Account> accountEntry : map.entrySet())\
  \ {\n *print(\"UserId - \" + accountEntry.getKey() + \", Account - \" + accountEntry.getValue());\n\
  }\n```\n\n* `for-each` 循环可以用于遍历 `map.keySet()` 获取键。\n* `for-each` 循环可以用于遍历 `map.values()`\
  \ 获取值。\n* 在运行 `for-each` 循环期间，不能修改集合。\n* `for-each` 循环只能向前导航。\n\n### Iterator（迭代器）\n\
  \n* `Iterator` 具有向**后**和**向前**移动的能力。\n* 使用 `Iterator` 可以在迭代期间删除项，这在在使用 `for-each`\
  \ 循环时是不行的。\n* `for-each` 内部也使用了 `Iterator`。\n\n```java\nIterator<Map.Entry<String,\
  \ Account>> accountIterator = map.entrySet().iterator();\n\nwhile (accountIterator.hasNext()){\n\
  \ Map.Entry<String, Account> accountEntry = accountIterator.next();\n *print(\"\
  UserId - \" + accountEntry.getKey() + \", Account - \" + accountEntry.getValue());\n\
  }\n```\n\n### 注意事项\n\n* 应优先使用 `for-each` 循环代替 `for` 循环，因为 `for` 循环是错误的根源，特别是与索引计算相关的错误。\n\
  * `Iterator` 被认为更安全，因为它在集合发生变化时会抛出异常。\n\n## 数据无关访问（Data Independent Access）\n\n\
  代码的编写方式使得客户端代码**不应**感知存储集合的内部结构。这使得可以在不破坏客户端代码的情况下进行内部更改。因此，为了方便对集合进行“数据无关访问”，必须暴露集合以便可以使用\
  \ `Iterator` 遍历集合的所有元素。\n\n## 问题\n\n* 遍历集合的不同方法？\n* 在使用 `for-each` 循环时，可以修改集合结构吗？\n\
