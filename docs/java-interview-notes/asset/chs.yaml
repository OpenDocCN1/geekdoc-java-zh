  * 哪个接口返回结果：Runnable 还是 Callable？\n\n# 守护线程 (Daemon Thread)\n`daemon thread`（守护线程）是一种允许\
  \ `JVM` 在程序结束时立即退出的线程，即使它仍在运行。也不会给予 `finally` 块执行的机会。守护线程以极低的优先级执行。\n\n线程继承父线程的守护状态，这意味着由主线程创建的线程都是非守护线程。\n\
  \n通常守护线程用于支持应用程序的后台任务或服务。垃圾回收在守护线程上进行。\n\n你可以这样创建守护线程：\n```java\nThread thread =\
  \ new Thread();\nthread.setDaemon(true);\n```\n\n非守护线程被称为用户线程。用户线程阻止 JVM 关闭。\n\n\
  当没有用户线程时，进程终止。Java 主线程始终是用户线程。\n\n## 问题\n* 什么是守护线程？\n* 什么是用户线程？什么是主线程？\n* 如果守护线程仍在运行，程序会退出吗？\n\
  * 如果用户线程仍在运行，程序会退出吗？\n* 当 JVM 停止所有运行的守护线程时，守护线程上的 finally 块会有执行的机会吗？\n* 创建新线程时，它是作为用户线程还是守护线程创建的？\n\
  * 没有用户线程但守护线程仍在运行时会发生什么？\n* Java 主线程是用户线程还是守护线程？\n* 什么类型的工作应该使用守护线程？\n\n# 竞态条件与不可变对象\n\
  *Race condition*（竞态条件）发生在多个线程并发访问共享数据并对其修改时。由于无法预测这些线程读取和写入顺序，可能会导致不可预测的数据值。\n\n\
  当一个对象在构造后没有改变状态的可能性时，它被认为是 *immutable*（不可变的）。如果一个对象是 *immutable* 的，它就可以在多个线程之间共享，而无需担心\
  \ *race condition*。\n\n## 如何使一个对象变为不可变\n\n\n\n\n\n* 将类声明为 `final`。\n* 仅允许构造函数创建对象。不要提供字段的\
  \ `setter`。\n* 将所有字段标记为 `private`。\n\n## Questions\n\n* 不变对象是如何帮助防止竞态条件的？\n* 为什么竞态条件可能会产生不可预测的结果？\n\
  * 为什么不可变对象在多线程环境中被认为是安全的？\n* 为什么应该将不可变类声明为 `final`？\n* 为什么构造函数应该是创建不可变对象的唯一方式？如果提供了\
  \ setters 会发生什么？\n\n## 线程池\n\n`Thread Pool`（线程池）是指定数量的工作线程的集合，它们独立于 `Runnable` 和\
  \ `Callable` 任务存在。\n\n固定线程池减少了线程创建的开销。当请求激增超过其处理能力时，它可以帮助应用程序进行`degrade gracefully`（优雅降级），防止应用程序进入挂起状态或崩溃。\n\
  \n线程池还通过解耦任务的创建与执行，实现了松耦合的设计。\n\n使用 `Executors` 类可以轻松创建固定线程池，你可以使用 `newFixedThreadPool()`\
  \ 厂方法创建 `ExecutorService` 来执行任务。\n\n## Questions\n\n* 什么是线程池？\n* 线程池如何减少线程创建的开销？\n\
  * 线程池如何帮助防止应用程序挂起或崩溃？\n* 什么是固定线程池？它是如何创建的？\n* 线程池如何实现松耦合的设计？\n\n# 同步 (SYNCHRONIZATION)\n\
  \n### 并发 vs 并行 vs 异步\n\n`Parallel processing`（并行处理）是在多个核心上同时执行同一个任务。\n\n`Concurrent\
  \ processing`（并发处理）是同时执行多个任务；可以在多个核心上执行，也可以通过处理器上的抢占式时间共享线程执行。\n\n`Asynchronous\
  \ processing`（异步处理）是进程独立执行，无需等待中间操作的返回值。\n\n## Questions\n\n* 解释并发处理？\n* 解释并行处理？\n\
  * 解释异步处理？\n* 解释并发与并行处理之间的区别？\n* 并行处理需要多个线程吗？\n* 什么时候应用程序是并发而非行的？\n    * 当应用程序同时处理多个操作，而不将这些操作进一步划分为更小的任务时。\n\
  * 什么时候应用程序是并行而非并发的？\n    * 当应用程序处理一个操作，并将该操作划分为更小的任务并并行处理时。\n* 什么时候应用程序既不是并发 true\
  \ 并行的？\n    * 当应用程序只处理一个操作，且不将其操作划分为更小的任务时。\n* 什么时候应用程序既是并发又是并行的？\n    * 当应用程序同时处理多个操作，并将这些操作进一步划分为更小的任务并并行处理时。\n\
  \n## 线程同步 (Thread Synchronization)\n\n`Race condition`（竞态条件）发生在多个线程并发访问共享数据并对其修改时。由于无法预测这些线程读取和写入数据的顺序，可能会导致不可预测的数据值。\n\
  \n`Critical Section`（临界区）`i` 是一个代码块，如果被一个以上的线程并发访问，可能会对结果产生不良影响。\n\n`Thread Synchronization`（线程同步）是控制对`critical\
  \ section`的访问，以防止程序中产生不良影响。\n\n同步创建了内存屏障，称为 `happen-before`（发生于），它确保线程对临界区内本地对象所的所有更改，对于随后获取相同本地对象的任何其他线程都是可见。\n\
  \n## Questions\n\n* 解释多线程中的竞态条件？\n* 什么是临界区？\n* 什么是线程同步？\n* 什么是内存屏障？\n* 线程同步中 happen-before\
  \ 的概念是什么？\n\n### 同步方法 vs 同步块 (Synchronized Method vs Synchronized Block)\n\n`synchronized`\
  \ 关键字用于标记代码中的临界区。\n\n互斥同步通过使用 `synchronized` 关键字锁定临界区来实现。\n\n这可以通过以下两种方式完成。\n\n\
  #### 将方法标记为临界区\n\n```java\npublic class DatabaseWrapper {\n  Object reference =\
  \ new Object();\n\n  // 方法标记为临界区 \n  public synchronized void writeX() { // 代码写在此处\
  \ }\n\n  // 方法标记为临界区 \n  public static synchronized void writeY() { // 代码写在此处 }\n\
  }\n```\n\n#### 将代码块标记为临界区\n\n```java\npublic void writeToDatabase() {\n  // 多个线程可以到达这里\n\
  \n  // 代码块标记为临界区 \n  synchronized (this) {\n    // 只有一个线程可以\n    // 在这里执行这里\n  }\n\
  \  // 多个线程可以执行这里\n}\n```\n\n## 注意事项 (Notes)\n\n* 将锁定范围缩小到仅限 `critical section`。这将提高整体性能并最大限地减少遇到竞态条件的概率。\n\
  * 优先使用 `synchronized` 块而不是 `synchronized` 方法，因为块锁只锁定本地对象，而不是整个类对象。\n* 在 `synchronized`\
  \ 内部，永远不要调用由客户端代码提供的方法或为继承设计的方法。\n\n## Questions\n\n* `synchronized` 关键字是如何使用的？\n\
  * 同步方法和同步块之间有什么区别？\n* 为什么优先选择同步块而不是同步方法？\n* 同步方法会锁定整个对象吗？\n* 如果你在 `synchronized`\
  \ 块或方法内部调用由客户端代码（client code）提供的方法，你可能会遇到什么问题？\n\n## 条件同步 (Conditional Synchronization)\n\
  \n条件 `synchronization`（同步）是通过使用条件变量连同 `wait()` 和 `notify()` 或 `notifyAll()` 方法来实现的。\n\
  \n```java\n// 条件同步\npublic void operation() throws InterruptedException {\n  synchronized(reference)\
  \ {\n    if (condition1) {\n      // 等待通知 \n      reference.wait();\n    }\n   \
  \ if (condition2) {\n      // 通知所有线程 \n      reference.notifyAll();\n    }\n  }\n\
  }\n```\n\n1. 有两种方法可以通知等待线程。\n    * `notify()` - 仅通知一个线程。\n    * `notifyAll()` -\
  \ 通知所有等待状态的线程。\n2. `wait()` 有一个重载版本可以传递超时时间，`wait(long timeout)`。\n3. 在 `notify()`\
  \ 和 `notifyAll()` 方法之间，优先使用 `notifyAll()`因为它通知所有等待线程。\n4. `notify()` 唤醒单个线程，如果多个线程在等待，线程的选择是随机的。\n\
  \n## Questions\n\n* 什么是条件同步？\n* `wait()` 用的目的是什么？\n* `notify` 和 `notifyAll` 方法的区别是什么？\n\
  * 当你调用 `notify` 且有多个线程等待时，哪一个会被通知？\n* 在 `notify` 和 `notifyAll` 之间，你倾向于哪一个？为什么？\n\
  \n## Volatile\n\n在多线程应用程序中，每个线程都会从主内存维护一个变量的 CPU 缓存副本。因此，线程对其 CPU 缓存中变量的任何更改对其他线程都是不可见的。\n\
  \n标记为 `volatile` 的字段直接从主内存存储和读取。由于 `volatile` 字段存储在主内存中，所有线程对 `volatile` 字段值的最新副本都是可见，无论哪个线程修改了它。\n\
  \n考虑类 `Ledger`，它有一个成员 `currentIndex` 来跟踪条目的数量。在多线程环境中，每个线程都会独立地增加 `currentIndex`\
  \ 值。\n\n```java\npublic class Ledger {\n  public int currentIndex = 0;\n}\n```\n\
  \n如果我们将 `currentIndex` 标记为 `Volatile`，那么每个线程将从主内存中使用其值，而不会创建副本。\n\n```java\npublic\
  \ class Ledger {\n  public volatile int currentIndex = 0;\n}\n```\n\n![Image](img/image00218.jpeg)\n\
  \n## Questions\n\n* 什么是 volatile 字段？\n* 解释 volatile 字段解决的问题？\n\n\n\n\n\n# volatile\
  \ 字段存储在何处？\n\n## static volatile 与 synchronized（同步）\n\n### static 变量\n`static` 变量用于类对象语文中，无论创建了多少个类对象，静态变量只存在一份拷贝。\n\
  \n但如果有多个线程访问同一个变量，每个线程都会在自己的 CPU 缓存中创建该变量的副本，一个线程所做出的更改对其他线程是不可见的。\n\n### volatile\
  \ 变量\n`volatile` 变量用于线程语文中，无论有多少个线程或对象访问它，都只存在一个变量，且每个人始终能获取最新更新的值。`Volatile` 强制所有读写操作直接在主内存中进行，而不是在\
  \ CPU 缓存中进行。\n\n### synchronized\n`static` 和 `volatile` 都是字段修饰符，处理与变量相关的内存可见性问题；而\
  \ `synchronized` 则用于通过监视器（monitor）控制对代码中`临界区域`的访问，从而防止对代码段的并发访问。\n\n## 问题\n* 什么是静态变量？\n\
  * 类的所有对象共享静态变量。但在多线程环境中，为什么一个对象对静态变量的修改对另一个线程上的对象是不可见的？\n* 如果静态和 volatile 变量在对象间是共享的，那么\
  \ volatile 变量解决的问题是什么？\n* volatile 和静态变量与 synchronized 有何不同，因为即使 synchronized 监视器也保护了内存对象？\n\
  \n## ThreadLocal 存储（线程本地存储）\n每个线程都有一个名为`thread local storage`的专用内存，可以存储与线程当前操作相关的数据。通常\
  \ `ThreadLocal` 变量被实现为`private static fields`，并用于存储事务标识符、用户标识符等信息。\n\n### ThreadLocal\
  \ 声明\n```java\nThreadLocal<String> threadLocal = new ThreadLocal<String>();\n```\n\
  \n### 设置线程本地值\n```java\nthreadLocal.set(\"Account id value\");\n```\n\n### 获取线程本地值\n\
  ```java\nString accountId = threadLocal.get();\n```\n\n* 由于 `ThreadLocal` 对象被包含在线程内部，你不需要担心对该对象进行同步访问。\n\
  * `ThreadLocal` 对象的生命周期与其创建的线程绑定，除非有其他变量引用了同一个对象。\n* 为了防止泄漏，使用 `remove()` 方法移除 `ThreadLocal`\
  \ 对象是一个良好实践。\n```java\nthreadLocal.remove();\n```\n\n## 问题\n* 什么是线程本地存储？\n* 你应该在\
  \ ThreadLocal 存储中存储什么类型的信息？\n* 为什么你不需要对存储在 ThreadLocal 存储中的对象进行同步访问？\n* 为什么要在 ThreadLocal\
  \ 存储上调用 remove 方法？\n\n## wait() vs sleep()\n\n### wait()\n使用 `wait()` 进行条件同步。\n\
  ```java\npublic void manageWaitFor(int timeInMs) throws InterruptedException {\n\
  \    synchronized (reference) {\n        if (condition1) {\n            // 等待通知\n\
  \            reference.wait(timeInMs);\n        }\n    }\n}\n```\n\n### sleep()\n\
  线程进入指定间隔的时间。\n```java\npublic void manageSleepFor(int timeInMs) throws InterruptedException\
  \ {\n    // 暂停 timeInMs 毫秒\n    Thread.sleep(timeInMs);\n    // 打印消息\n    print(\"\
  Slept for :\" + timeInMs + \"ms.\");\n}\n```\n\n* `wait` 是在对象的监视器上调用的；而 `sleep`\
  \ 是在线程上调用的。\n* 等待的对象可以被通知；而休眠的线程不能。\n* 休眠的线程不能释放锁；而等待的对象可以。\n* 要唤醒一个休眠的线程，你需要它的引用，而等待的对象则不需要。\n\
  \n## 问题\n* wait 和 sleep 之间有什么区别？\n* 为什么可以通知等待的对象唤醒，但不能唤醒休眠的线程？\n* 唤醒休眠线程需要直接句柄；你需要直接访问等待的对象吗？为什么？\n\
  * 信号对象退出等待状态的机制是什么？\n\n## Joining Threads（连接线程）\n当线程之间存在依赖关系时，通常会连接线程。目标线程的`join()`\
  \ 方法用于挂起当前线程。在这种情况下，在它依赖的目标线程完成执行之前，当前线程无法继续。\n\n```java\n// 主线程连接线程 \npublic void\
  \ main(String[] args) {\n    Thread thread1 = new Thread(ThreadMethodRef::threadMethod);\n\
  \    thread1.start();\n    // 当前线程等待\n    // 直到 thread1 完成\n    // 执行\n    thread1.join();\n\
  }\n```\n\n## 问题\n* 线程 join 方法的目的是什么？\n* 为什么你需要连接两个线程？\n\n## Atomic Classes（原子类）\n\
  `Atomic classes` 提供了对原始类型执行原子操作的能力，使得在方法调用完成之前只允许一个线程更改该值。像 `AtomicInteger` 和 `AtomicLong`\
  \ 这样的原子类封装了相应的原始类型。引用类型也有一个对应的类，即 `AtomicReference`。\n\n不需要对原子类对象提供`synchronized`\
  \ 访问。`AtomicInteger` 的方法 `incrementAndGet()` 通常用于替代`前置和后置递增运算符`（++ 和 --）。\n\n##\
  \ 问题\n* 什么是原子类？\n* 为什么你不需要对原子类对象进行同步访问？\n* 为什么前置和后置递增运算符不是线程安全的？\n    * 前置和后置操作底层是多次操作：读取、递增和写入。这三者没有一起同步执行，因此在之间发生的任何线程切换都会导致非预期的结果。\n\
  * 原子变量和 volatile 变量有什么区别？\n    * 原子变量提供了发生于（happen-before）读取的。\n\n## Lock（锁）\n*\
  \ `Lock` 是多线程环境下控制共享资源访问的机制。\n* `ReentrantLock` 类实现了`lock` 接口。\n* 锁可以在不同的代码块中获取和释放。\n\
  * `Lock` 接口具有用于验证资源可用性的方法 `tryLock()`\n* 作为良好实践，获取的锁必须在`finally` 块中释放。\n\n```java\n\
  // 安全类\npublic class SafeAccount {\n    // 创建锁\n    private Lock lockObject = new\
  \ ReentrantLock();\n\n    public void addMoney() {\n        // 获取锁\n        lockObject.lock();\n\
  \        try {\n            // 在此处添加金额\n        } finally {\n            // 释放锁\n\
  \            lockObject.unlock();\n        }\n    }\n}\n```\n\n## 问题\n* 解释多线程环境下的锁机制？\n\
  * 你需要在同一个代码块中获取并释放锁？\n* 为什么你应该用 tryLock() 而不是 lock()?\n\n## ReadLock（读写锁）\n* `ReadWriteLock`\
  \ 管理一对关联锁，一个用于写入，另一个用于读取操作。\n* 只有一个线程可以获取写锁，但多个线程可以拥有读锁。\n* `ReadWriterLock` 接口由\
  \ `ReentrantReadWriteLock` 实现。\n\n```java\n// ReentrantReadWriteLock \nReentrantReadWriteLock\
  \ rwl = new ReentrantReadWriteLock();\n// 读锁\nLock rl = rwl.readLock();\n// 写锁\n\
  Lock wl = rwl.writeLock();\n```\n\n## 问题\n* 使用 ReadWriteLock 的好处是什么？\n* 在什么你会倾向于使用\
  \ ReadWriteLock 而不是其他锁机制？\n\n## Synchronisers（同步器）\n同步器同步多个线程以保护`临界区域`。 \n\n***Sync***\n\
  \n***Point Threads***\n\n | ------------\n\n | ----------------\n\n |  ----------\n\
  \n同步器类型\n* Barriers\n* Semaphore\n* Phasers\n* Exchangers\n* Latch\n\n## 问题\n* 同步器的目的是什么？\n\
  * Java 中提供了哪些类型的同步器？\n\n## Barriers（屏障）\n* 在`Barriers` 中，一组线程等待彼此到达屏障点后才会继续执行。\n\
  * `CyclicBarrier` 是 `Barrier` 同步器的具体实现。 \n\n\n\n\n\n## CyclicBarrier\n\n```java\n\
  // 有五个线程的 barrier\nCyclicBarrier barrier = new CyclicBarrier(5);\n}\n```\n\n* `Barrier`\
  \ 之所以被称为循环，是因为在对其调用 `reset()` 方法后可以重复使用。\n* 可以将操作传递给 `CyclicBarrier`，当所有线程到达屏障点时执行。\n\
  \n```java\n// 带有要执行操作的 barrier\n// 在屏障点执行。\nCyclicBarrier barrier = new CyclicBarrier(5,\
  \ () -> {\n    // 屏障点操作代码。\n});\n```\n\n* 如果任何线程提前终止，则在屏障点等待的所有线程也将退出。\n* 当你将一个操作分为在单独线程上的多个任务，并在等待所有任务完成后再继续时，通常会使用\
  \ Barrier。\n\n## 问题\n* 解释一下 Barrier 同步器器吗？\n* 你可以再次使用同一个 Barrier 对象吗？如何实现？\n* 如果其中一个线程死亡，其他在\
  \ Barrier 处等待的线程会发生什么？\n* 你会在什么样的工作中使用 Barrier？\n\n## Semaphore\n\n* `Semaphore`\
  \ 维护了指定数量的许可以访问 `Critical Section`（临界区）。\n\n```java\n// 创建带有四个许可的 Semaphore\n//\
  \ 用于四个线程\nSemaphore semaphore = new Semaphore(4);\n```\n\n* 要获取许可，使用 `acquire()`\
  \ 方法。每次调用 `acquire()` 方法都会阻塞，直到许可可用。\n* 要释放许可，使用 `release()` 方法。\n* 许可可以由获取它的之外的其他线程释放。\n\
  * 如果调用 `release()` 的次数多于 `acquire()`，则对于每个这样的额外释放调用，都会增加一个额外的许可。\n* 如果你想获取互斥锁，请用一个许可初始化\
  \ `Semaphore`。\n* Semaphore 通常用于允许对昂贵资源进行受限访问。\n\n## 问题\n* 解释一下 Semaphore 同步器吗？\n\
  * 如果你调用 `release()` 的次数超过 `acquire()`，会发生什么？\n* 当你调用 `acquire` 但许可不可用时会发生什么？\n*\
  \ 如何使用 Semaphore 获取互斥锁？\n* 你在哪里使用 Semaphore？\n\n## Phaser\n\n* 与其他 barrier 不同，注册到\
  \ `Phaser` 上的参与者数量可以随时间动态变化。\n\n```java\n// 有四个注册参与者的 Phaser\nPhaser phaser = new\
  \ Phaser(4);\n```\n\n* `phaser` 也可以再次重复使用。\n* 使用 `register()` 方法注册一个参与者。\n* 当给定阶段的最后一个参与者到达时，可以执行一个可选操作，然后\
  \ `Phaser` 推进到下一个阶段。\n* 使用 `arriveAndAwaitAdvance()` 方法在进入下一个阶段之前等待所有参与者到达。\n* `Phasers`\
  \ 监控已注册、已到达和未到达的参与者的计数。即使是不是注册参与者的调用者也可以监控一个 Phaser 上的这些计数。\n* 参与者可以使用 `arriveAndDeregister()`\
  \ 方法取消注册，从而不再移动到下一个阶段。\n\n## 问题\n* 解释一下 Phaser 同步器吗？\n* 注册到 Phaser 的参与者数量可以随时间动态变化吗？\n\
  * 你可以再次使用同一个 Phaser 对象吗？\n* 你可以使用某些外部对象通过 Phaser 监控注册参与者的计数吗？\n* 就可以注册的参与者数量而言，Semaphore\
  \ 和 Phaser 有什么区别？\n\n## Exchanger\n\n* `Exchanger` 让两个线程在同步点等待对方交换元素。\n\n```java\n\
  // 交换字符串数组\nExchanger<ArrayList<String>> exchanger = new Exchanger<ArrayList<String>>();\n\
  ```\n\n* Exchangers 使用 `exchange()` 方法交换信息。\n\n```java\n// 交换数据的 exchanger\nobjectToExchange\
  \ = exchanger.exchange(objectToExchange);\n```\n\n* 在 `exchange()` 上，`consumer`\
  \ 清空要交换的对象，并等待 `producer` 再次用完整的对象交换。\n\n## 问题\n* 解释一下 Exchanger 同步器吗？\n* Exchanger\
  \ 对象需要多少线程？\n* Exchanger 同步器的主要目的是什么？\n* Exchanger 同步器是每次都使用同一个对象进行交换，还是可以使用不同的对象？\n\
  \n## Latch\n\n* `Latch` 让一组线程等待直到一组操作完成。\n* `Latch` 不能被重复使用。\n* `CountDownLatch`\
  \ 类提供了 `Latch` 的实现。\n* 所有调用 `await()` 方法的线程都会等待，直到 `countDown()` 被调用的次数等于设置的计数器次数。\n\
  \n```java\n// 创建一个带有五个计数器的计数锁\nCountDownLatch cdl = new CountDownLatch(5);\n// 在线程任务完成后对\
  \ latch 计数减\ncdl.countDown();\n// 等待计数减信号\ncdl.await();\n```\n\n## 问题\n* 解释一下 Latch\
  \ 同步器吗？\n* 你可以再次使用同一个 Latch 对象吗；像 Barrier 和 Phaser 那样？\n* 向 Latch 发送任务完成的机制是什么？\n\
  \n# Executor Framework\n\nExecutor 框架提供了在线程上执行一组相关任务的基础设施。\n它负责管理以下内容：\n* 创建和销毁线程。\n\
  * 为任务维持最优数量。\n* 任务的并行和顺序执行。\n* 任务提交与任务执行的隔离。\n* 控制任务执行相关的策略。\n\n```java\n// Executor\
  \ 接口定义\npublic interface Executor { void execute (Runnable command); }\n```\n\n\
  ## 问题\n* 解释一下 Executor 框架？\n* Executor 框架有哪些各种功能？\n\n## Executor Service\n\n* `ExecutorService`\
  \ 继承自 `Executor` 接口，提供了以下额外方法。\n    * `shutdown()` - 在提交任务后关闭执行器。\n    * `shutdownNow()`\
  \ - 中断当前任务并丢弃等待的任务。\n    * `submit()` - 将任务提交给 `Executor`。\n    * `awaitTermination()`\
  \ - 等待现有任务终止。\n* `ExecutorService` 提供 `Future` 对象来跟踪执行任务的进度。\n* 提交到 `Executor` 的所有任务都会队列，由线程池线程执行。\n\
  \n```java\n// 创建带有五个线程的 Executor\nExecutorService exec = Executors.newFixedThreadPool(5);\n\
  ```\n\n* 要创建单线程线程池，使用 `newSingleThreadExecutor()` 方法。\n\n## 处理结果\n\n* `Runnable`\
  \ 接口的 `run()` 方法不能返回结果或抛出异常。\n* 可以返回结果的任务是 `Callable` 接口的实例。\n\n```java\n// 任务可以通过\
  \ Callable 返回结果\npublic interface Callable<V> { V call() throws Exception; }\n```\n\
  \n* `submit()` 返回 `Future` 对象有助于跟踪任务。\n\n```java\n// ExecutorService 示例\npublic\
  \ class ExecService {\n    public static void main(String[] args) throws ExecutionException,\
  \ InterruptedException {\n        // 创建带有五个线程的执行\n        ExecutorService exec =\
  \ Executors.newFixedThreadPool(5);\n        // 将可调用任务提交给执行器\n        Future<String>\
  \ task = exec.submit(new Callable<String>() {\n            @Override public String\
  \ call() throws Exception {\n                //某些逻辑\n                return null;\n\
  \            }\n        });\n        // 等待结果\n        String result = task.get();\n\
  \        // 关闭执行器\n        exec.shutdown();\n    }\n}\n```\n\n* 如果任务执行期间发生任何异常，调用\
  \ `ExecutorService` 上的 `get()` 方法将抛出 `ExecutionException` 实例。\n\n## 调度任务\n\n* `ScheduledExecutorService`\
  \ 可用于调度未来运行的任务。\n* 调度任务的方法：\n    * `schedule(task, delayTime, TimeUnit.SECONDS)`\n\
  \    * `scheduleAtFixedRate(task, delayTime, repeatPeriod, TimeUnit.SECONDS)`\n\
  \    * `scheduleWithFixedDelay(task, delayTime, fixedDelay, TimeUnit.SECONDS)`\n\
  \n## ExecutorCompletionService\n\n* `ExecutorCompletionService` 使用 `Executor` 来执行任务。\n\
  * `Executor` 的 `CompletionService` 可用于从多个任务中获取结果。\n\n\n\n\n\n`ExecutorCompletionService`\
  \ 为 `CompletionService` 具体实现。\n\n```java\n// 创建一个五个线程的执行器\nExecutorService es =\
  \ Executors.newFixedThreadPool(5);\n\n// ExecutorCompletionService 返回一个对象\nExecutorCompletionService<Result>\
  \ cs = new ExecutorCompletionService<>(es);\n\n// 将任务提交给 ExecutorCompletionService\n\
  cs.submit(longTask);\n\n// 获取任务结果\nFuture<Result> completedTask = cs.take();\n```\n\
  \n### 注意事项\n\n- 始终为线程关联基于上下文的名称，这对调试非常有帮助。\n- 根据你的用用例，通过调用 `shutdown()` 或 `shutdownNow()`\
  \ 优雅地退出。\n- 为 `ExecutorService` 配置线程池，使得池中配置的线程数量不显著大于系统可用的处理器数量。\n- 你应该查询主机以找到处理器数量，以便配置线程池。\n\
  ```java\nRuntime.getRuntime().availableProcessors();\n```\n\n## 问题\n\n- 解释什么是 `ExecutorService`？\n\
