  \n## Queue\n- `Queue` 是在处理前持有元素的集合。\n- `Queue` 有两个端：头和尾。\n- `Queue` 以先进先出 (FIFO)\
  \ 的方式工作。\n\n### Types of Queues\n- `Deque` - 允许从两端操作的队列。\n- `BlockingQueue` - 在满时阻塞添加，在空时阻塞移除。\n\
  - `Transfer Queue` - 在线程之间传输数据的特殊*阻塞队列*。\n- `BlockingDeque` - `Deque` 和 `BlockingQueue`\
  \ 的结合。\n- `Priority queue` - 按优先级移除元素。\n- `Delay queue` - 在关联的延迟后允许移除。\n\n### Basic\
  \ Queue\n- `Queue` 有一个入口点（尾）和一个出口点（头）。\n- 如果入口和出口点相同，则它是后进先出 (LIFO) `queue`。\n```java\n\
  // 简单队列\nQueue<String> queue = new LinkedList<>();\n```\n\n### Priority Queue\n\
  - 在 `PriorityQueue` 中，优先级与元素相关。\n- 下一个移除优先级最高的元素。\n- `PriorityQueue` 不允许 `null`\
  \ 元素。\n- 队列元素实现 `Comparable` 接口或使用 `Comparator` 对象计算优先级。\n```java\n// City 实现 Comparable\
  \ 接口\nQueue<City> pq = new PriorityQueue<>();\n```\n\n### Deque\n- `Deque` 允许从两端插入和移除。\n\
  - `Deque` 不提供对元素的索引访问。\n- `Deque` 继承 `Queue` 接口。\n```java\n// 创建一个 Deque\nDeque<String>\
  \ deque = new LinkedList<>();\n```\n\n### Blocking Queue\n- `BlockingQueue` 接口继承自\
  \ `Queue`。\n- `BlockingQueue` 设计为线程安全的。\n- `BlockingQueue` 设计用于生产者消费者队列。\n\n###\
  \ Transfer Queue\n- `TransferQueue` 扩展 `BlockingQueue`。\n- 它可能是有界的，`生产者` 可能等待空间可用和/或\
  \ `消费者` 可能等待元素可用。\n```java\n// 传输队列\nTransferQueue<String> ltq = new LinkedTransferQueue<String>();\n\
  \n## 问题\n- `Queue` 的目的是什么？\n- `Deque` 和 `Queue` 有什么不同？\n- 什么是优先级队列？\n- 从优先级队列中移除元素的标准是什么？\n\
