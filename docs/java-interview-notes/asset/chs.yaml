  \ \n\n## 快速失败 (Fail Fast)\n\n`Iterator` 方法被认为是 `fail-fast`（快速失败），因为在获取集合的迭代器后，`Iterator`\
  \ 会防止集合发生任何结构性修改。这确保了任何失败都能被快速报告，而不是让应用程序在稍后进入损坏的状态。在这种情况下，会抛出 `ConcurrentModificationException`。\n\
