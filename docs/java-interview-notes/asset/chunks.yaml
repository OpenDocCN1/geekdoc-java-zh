    \ ability to perform almost all the operations offline, when network is not available.\
    \ All the changes can be pushed to the server on network's availability.\n\nLet's\
    \ discuss few terms that are frequently used:\n* `Repository` - is directory that\
    \ contains all the project files.\n* `Clone` - it creates a working copy of local\
    \ repository.\n* `Branch` - is created to encapsulate the development of new features\
    \ or to fix bugs.\n* `HEAD` - points to the last commit.\n* `Commit` - commits\
    \ changes to HEAD and not to remote repository.\n* `Pull` - Gets the changes from\
    \ the remote repository to the local repository.\n* `Push` - Commits the local\
    \ repository changes to the remote repository.\n\nGit Workflow Structure\n![Image](OEBPS/Images/image00223.jpeg)\n\
    \n### Questions\n* What is distributed version control systems?\n* Why do you\
    \ use version control system?\n* What are the typical activities you perform with\
    \ version control system?\n* Explain the branching strategy you follow?\n\n###\
    \ Maven\n`Maven` is software project management framework that manages project\
    \ build, dependency resolution, testing, deployment, reporting, etc. Maven is\
    \ based on conventions rather than elaborate configurations; that is, if the project\
    \ is laid out as per the prescribed conventions, as depicted in the image below,\
    \ then it will be able to find the resources to perform different build operations.\n\
    \n![Image](OEBPS/Images/image0224.jpeg)\n\nMaven is managed by `pom.xml` (also\
    \ known as Project Object Model) file, which facilitates defining various tasks\
