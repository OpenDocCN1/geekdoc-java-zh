  trans: "\n\n```java\npublic String getName() {\n    return name;\n}\n\npublic String\
    \ getDepartment() {\n    return department;\n}\n```\n\n# 问题\n\n- 什么是不可变对象？\n-\
    \ 定义不可变对象的规则有哪些？\n- 不可变对象的优缺点是什么？\n- 如何创建不可变对象？\n- 使用不可变对象的不同场景有哪些？\n- `final`\
    \ 和不可变对象之间有什么区别？\n- 声明 `final` 变量如何帮助优化？\n- 你能列出一些不可变性的问题吗？\n    - 定义带有大量参数的构造函数比较困难。\n\
    \    - 因为强制不可变性是由开发者来实现的，即使只添加一个 setter 方法也会破坏它。\n\n# 克隆\n\n`cloning`（克隆）是创建对象拷贝的过程。仅仅将现有对象的引用赋值给对象会导致两个引用指向同一个对象。克隆有两种类型：`shallow`（浅拷贝）和\
    \ `deep`（深拷贝）。\n\n## 浅拷贝\n\n`shallow cloning` 仅仅复制属性的值。对于原始类型成员，会创建精确的拷贝；对于引用类型成员，原始和新创建的都指向堆中的同一个对象。\n\
    \n## 深拷贝\n\n`deep cloning` 递归地将每个成员的内容拷贝到新对象中。深拷贝总是创建一个原始对象的独立拷贝。要创建深拷贝，通常应该编写一个名为\
    \ `constructor`（构造函数）的专用方法。\n\n### 问题\n\n- 什么是克隆？\n- 什么是浅拷贝？\n- 解释浅拷贝的缺点？\n- 什么是深拷贝？\n\
    - 什么是 `constructor`？\n- 什么情况下你会倾向于使用深拷贝而不是浅拷贝，反之亦然？\n\n# 数据类型\n\n`NaN`（非数字）是因为算术运算（如除以零、与无穷操作等）产生的未定义结果。两个\
    \ `NaN` 是不等的。NaN 有两种类型：\n\n- `Quiet NaN`（静默 NaN）：当产生 quiet `NaN` 时，除非检查结果，否则没有指示。\n\
    - `Signalling NaN`（信号 NaN）：当产生 signalling `NaN` 时，它会信号无效操作。\n\n### \n\n- 什么是 `NaN`\
    \ 或非数字？\n- 什么是 `Quiet NaN`？\n- 什么是 `Signalling NaN`？\n- 两个 `NaN` 相等吗？\n\n# EnumSet\n\
    \n`EnumSet` 是一种用于枚举类型的特殊化集合实现。`EnumSet` 在内部以非常紧凑且高效的方式以位向量的形式表示。`EnumSet` 提供了优化的实现来执行位标志操作，应该用来替代执行\
    \ int 标志操作。以下代码演示了 `EnumSet` 的用法。\n\n```java\nprivate enum Vehicle {\n    CAR,\n\
    \    JEEP,\n    MOTORCYCLE,\n    SCOOTER\n};\n\npublic static void main(String\
    \ [] args){\n    EnumSet<Vehicle> TWOWHEELERS = EnumSet.of(Vehicle.MOTORCYCLE,\
    \ SCOOTER);\n    if(TWOWHEELERS.contains(Vehicle.MOTORCYCLE)){\n    }\n}\n```\n\
    \n### 问题\n\n- 什么是 `EnumSet`？\n- 为什么你应该倾向于使用 `EnumSet` 来执行位标志操作？\n\n# 类型比较\n\n\
    `Primitive types`（原始类型）只能使用相等运算符（`==` 和 `!=`）进行比较；而 `Reference Types`（引用类型）可以使用相等运算符和\
    \ `equals()` 方法比较，取决于我们想要比较什么。\n\n## 相等运算符\n\n对于引用类型，相等运算符 `==` 和 `!=` 用于比较内存中两个对象的地址，而不是它们的实际内容。\n\
    \n## .equals() 方法\n\n当你想要比较两个对象的内容时，必须使用 `equals()` 方法。Java 中的 `java.lang.Object`\
    \ 类定义了 `equals()` 方法，该方法必须被子类重写以便方便对象之间的内容比较。如果类没有重写 `equals()` 方法，则会调用 `java.lang.Object`\
    \ 类的 `equals()` 方法，它使用相等运算符来比较引用。\n\n### 问题\n\n- Java 中比较类型的不同方式有哪些？\n- 对于引用类型，相等运算符比较什么？\n\
    - `equals` 方法比较什么？\n- 什么情况下你会倾向于使用 `equals` 方法而不是相等运算符？\n- 如果类没有重写 `equals` 方法会发生什么？\n\
    \n# 浮点数比较\n\n两个浮点数不应该使用相等运算符 `==` 进行比较；因为同一个数字（例如 0.33）在两个浮点变量中的存储值可能并不精确是 0.33，而是\
    \ 0.3300000007 和 0.32999999767。因此要比较两个浮点数值，应将两个值的绝对差与一个 `range`（范围）进行比较。\n\n```java\n\
    if(Math.abs(floatValue1 - floatValue2) < EPSILON){ //\n }\n```\n\n在上面的示例中，`EPSILON`\
    \ 是比较两个浮点数的范围。`EPSILON` 的值是非常小的数字（如 0.000001），取决于所需的精度。\n\n### 问题\n\n- 为什么你不应该使用相等运算符来比较浮点数值？\n\
    - 比较两个浮点数的优选方法是什么？\n- 定义用于比较两个浮点数的范围值的标准应该是什么？\n\n# 字符串比较\n\n`String` 类对象使用相等运算符\
    \ `==` 来测试引用相等性，使用 `equals()` 方法来测试内容相等性。你应该始终使用 `equals()` 方法来比较来自不同来源的两个 `String`\
    \ 变量的相等性，尽管常量字符串（Interned Strings）也可以使用相等运算符比较。\n\n### 问题\n\n- 为什么要使用 `equals`\
    \ 方法比较 `String` 对象？\n- 使用相等运算符比较两个 `String` 对象的陷阱是什么？\n- 什么是常量字符串？如何比较两个常量字符串？\n\
    \n# 枚举比较\n\n`Enum` 既不能实例化也不能被拷贝。因此枚举只有一个实例，即定义枚举时定义的那个。由于只有一个实例，你可以使用相等运算符（`==`）和\
    \ `equals()` 方法进行比较。但优选相等运算符，因为它不会抛出 `NullPointerException` 并可以通过编译时检查。\n\n###\
    \ 问题\n\n- 比较枚举的不同方式有哪些？\n- 解释为什么你可以使用相等运算符和 `equals` 方法比较枚举？\n- 比较枚举值的优选方法是什么？\n\
    \n# 枚举与静态字段\n\n使用 `enum` 替代 `public static int` 的优点如下：\n\n- 枚举受编译时检查，而 `int` 值不是。\n\
    - `int` 值需要针对预期范围进行验证；而枚举不需要。\n- 位标志操作被内置在 enumSet 中。\n\n下面的代码演示了 `enum` 和 `public\
    \ static` 字段的用法。对于 `public static int`，你可以将任何 `int` 值传递给 `AddVehicle()` 方法。\n\n\
    ### enum\n\n```java\nprivate enum Vehicle {\n    CAR,\n    JEEP,\n    MOTORCYCLE,\n\
    \    SCOOTER\n};\n\npublic void AddVehicle(Vehicle vehicle) {\n}\n```\n\n### public\
    \ static field\n\n```java\npublic static int CAR = 0; \npublic static int JEEP\
    \ = 1; \npublic static int MOTORCYCLE = 2; \npublic static int SCOOTER = 3;\n\n\
    public void AddVehicle(int vehicle) {\n}\n```\n\n### 问题\n\n- 使用 `enum` 替代 `public\
    \ static int` 的优点有哪些？\n- 与枚举参数相比，为什么你对 `int` 参数需要额外的验证？\n- 为什么你应该倾向于使用 `enum`\
    \ 替代 `public static`？\n\n# 包装类\n\n每个 `Primitive data type` 一个对应的类，该类将原始数据类型封装成该类的对象。包装类提供了许多实用方法来操作原始数据值。由于包装类允许原始类型转换为引用类型，这些类型也可以与集合一起。\n\
    \n# 自动装箱与自动拆箱\n\n"
- fmt: "\n`Auto boxing` is an automatic conversion of primitive type to an object,\
    \ which involves dynamic memory allocation and initialization of corresponding\
    \ Wrapper class object. `Auto unboxing` is automatic conversion of a Wrapper class\
    \ to primitive type.\n\nIn the code below, value `23.456f` is `auto boxed` to\
    \ an object `Float(23.456f)` and the value returned from `addTax()` is `auto unboxed`\
    \ to `float`.\n\n```java\npublic static void main(String [] args){\n    float\
    \ beforeTax = 23.456f;\n    float afterTax = addTax(beforeTax);\n}\n\npublic static\
    \ Float addTax(Float amount){\n    return amount * 1.2f;\n}\n```\n\n### Questions\n\
    * What is auto boxing and auto unboxing?\n* What are the advantages of auto boxing?\n\
    \n## BigInteger and BigDecimal\n\n`BigInteger` and `BigDecimal` are used to handle\
    \ values which are larger than `Long.MAX_VALUE` and `Double.MAX_VALUE`. Such large\
    \ values are passed as String values to the constructor of `BigInteger` and `BigDecimal`.\
    \ `BigDecimal` supports utility methods to specify the required rounding and the\
    \ scale to be applied.\n\n```java\nBigInteger bInt = new BigInteger(\"9876543210987654321098765\"\
    );\n```\n\nBoth `BigInteger` and `BigDecimal` objects are immutable, so any operation\
    \ on it creates a new object. `BigInteger` is mainly useful in cryptographic and\
    \ security applications.\n\n### Questions\n* What are `BigInteger` and `BigDecimal`\
    \ types?\n* How are the values of `BigInteger` and `BigDecimal` internally stored?\n\
    * What are the usages of `BigInteger`?\n\n## STRINGS\n\n### String Immutability\n\
    \nThe `String` object is `immutable`, which means once constructed, the object\
    \ which `String` reference refers to, can never change. Though you can assign\
    \ same reference to another `String` object.\n\nConsider the following example:\n\
    ```java\nString greeting = \"Happy\"; greeting = greeting + \" Birthday\";\n```\n\
    \nThe code above creates three different `String` objects, \"Happy\", \"Birthday\"\
    \ and \"Happy Birthday\".\n\n![Image](OEBPS/Images/image00212.jpeg)\n\n* Though\
    \ you cannot change the value of the `String` object but you can change the reference\
    \ variable that is referring to the object. In the above example, the `String`\
    \ reference `greeting` starts referring the String object \"Happy Birthday\".\n\
    * Note that any operation performed on `String` results into creation of new `String`.\n\
    * `String` class is marked `final`, so it's not possible to override immutable\
    \ behaviour of the `String` class.\n\n#### Advantages\n* As no synchronization\
    \ is needed for `String` objects, it's safe to share a `String` object between\
    \ threads.\n* `String` once created does not change. To take advantage of this\
    \ fact for memory optimization, Java environment caches `String` literals into\
    \ a special area in memory known as a [String Pool](#part0058.xhtml). If a String\
    \ literal already exists in the pool, then the same string literal is shared.\n\
    * Immutable `String` values safeguard against any change in value during execution.\n\
    * As `hash-code` of `String` object does not change, it is possible to cache `hash-code`\
    \ and not calculate every time it's required.\n\n#### Disadvantages\n* `String`\
    \ class cannot be extended to provide additional features.\n* If lots of `String`\
    \ literals are created, either new objects or because of any string operation,\
    \ it will put load on `Garbage Collector`.\n\n#### Questions\n* Why String objects\
    \ are called immutable?\n* How is String object created in memory?\n* What are\
    \ the advantages and disadvantages of String Immutability?\n* Why are String objects\
    \ considered thread safe?\n* What are the advantages of declaring the String class\
    \ `final`?\n* What memory optimization is performed by the Java environment for\
    \ Strings?\n* Why you don't have to calculate hash-code of the String object every\
    \ time it's used?\n\n## String Literal vs Object\n\n### String Literal\n`String\
    \ literal` is a Java language concept where the `String` class is optimized to\
    \ cache all the `Strings` created within `\"double quotes\"`, into a special area\
    \ known as `String Pool`.\n\n```java\nString cityName = \"London\";\n```\n\n###\
    \ String Object\n`String object` is created using `new()` operator, like any other\
    \ object of reference type, into the heap.\n\n```java\nString cityName = new String(\"\
    London\");\n```\n\n### Questions\n* What is String literal?\n* What are the differences\
    \ between String Literal and String Object?\n* How are the String Literals stored?\n\
    \n### String Interning\n`String interning` is a concept of storing only single\
    \ copy of each distinct immutable `String` value.\n* When you define any new `String\
    \ literal`, it is `interned`. Same `String` constant in the pool is referred for\
    \ any repeating String literal.\n* `String pool` literals are defined not only\
    \ at the compile time, but also during runtime. You can explicitly call a method\
    \ `intern()` on the `String` object to add it to the `String Pool`, if not already\
    \ present.\n* Placing extremely large amount of text in the memory pool can lead\
    \ to `memory leak` and/or `performance issue`.\n\n*Note: Instead of using String\
    \ object, prefer using string literal so that the compiler can optimize it.*\n\
    \n### Questions\n* What is String interning?\n* How can you intern a String Object?\n\
    * What happens when you store a new String literal value that is already present\
    \ in the string pool?\n* What are the drawbacks of creating large number of String\
    \ literals?\n* Which one is preferred: String Object or String Literal?\n\n##\
    \ String Pool Memory Management\n`String pool` is a special area in memory managed\
    \ by Java compiler for String optimization. If there is already a String literal\
    \ present in the pool, compiler refers the new literal to existing object instead\
    \ of creating new literal because String is immutable.\n\nIn this example below,\
    \ both String objects are different and are stored into [Heap](#part142.xhtml).\n\
    \n```java\nString cityNameObj = new String(\"London\");\nString capitalObj = new\
    \ String(\"London\");\n```\n![Image](OEBPS/Images/image00213.jpeg)\n\nWhereas\
    \ in this example below, both String literal refer to the same object in memory.\n\
    \n```java\nString cityName = \"London\";\nString capital = \"London\";\n```\n\
    ![Image](OEBPS/Images/image00214.jpeg)\n\n### Questions\n* Explain String Pool\
    \ Memory Management?\n* How are String Literals stored in memory?\n* How is String\
    \ Pool optimized?\n* How are String Objects stored in memory?\n* Why can't Java\
    \ use mechanism similar to String Pool, to store objects of other data types?\n\
    \n## Immutability - Security Issue\nIt's the responsibility of the [`Garbage Collector](#part145.xhtml)\
    \ to clear string objects from the memory; though you can also [use reflection](#part0060.xhtml)\
    \ to do so, but that's not recommended.\n\nSince Strings are kept in `String Pool`\
    \ for re-usability, chances are that the strings will remain in memory for long\
    \ duration. As String is immutable and its value cannot be changed, a memory dump\
    \ or accidental logging of such String can reveal sensitive content like password\
    \ or account number, stored into it.\n\nSo instead, it's advisable to use char\
    \ array (`char[]`) to store such sensitive information, which can be explicitly\
    \ overwritten by an overriding content, thus reducing the window of opportunity\
    \ for an attack.\n\n### Questions\n* How are String literals cleared from the\
    \ String Pool?\n* Can you use reflection to clear a String object?\n* What are\
    \ the security issues associated with the immutable Strings?\n* Why you shouldn't\
    \ use String to store sensitive information like password, access key, etc.?\n\
    * Why using char array is advisable to store password, instead of String?\n\n\
    ## Circumvent String Immutability\nImmutability feature in String can be bypassed\
    \ using *reflection*, though using [reflection](#part0137.xhtml) to do so is NOT\
    \ recommended, because it's a security violation and is considered as an attack.\
    \ The following code demonstrates how reflection can be used to circumvent string\
    \ immutability:\n\n```java\nString accountNo = \"ABC123\";\n```\n"
