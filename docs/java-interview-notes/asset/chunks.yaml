    - `StringBuffer` methods are `synchronized`, so its thread safe whereas `StringBuilder`\
    \ is not.\n- Performance of `StringBuilder` is significantly better than `StringBuffer`,\
    \ as `StringBuilder` does not has any synchronization overheads.\n\n**Note**:\
    \ If you need to share String objects between threads then use `StringBuffer`,\
