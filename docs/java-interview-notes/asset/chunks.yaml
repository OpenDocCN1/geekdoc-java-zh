  trans: "\n\n* 将类声明为 `final`。\n* 仅允许构造函数创建对象。不要提供字段的 `setter`。\n* 将所有字段标记为 `private`。\n\
    \n## Questions\n\n* 不变对象是如何帮助防止竞态条件的？\n* 为什么竞态条件可能会产生不可预测的结果？\n* 为什么不可变对象在多线程环境中被认为是安全的？\n\
    * 为什么应该将不可变类声明为 `final`？\n* 为什么构造函数应该是创建不可变对象的唯一方式？如果提供了 setters 会发生什么？\n\n##\
    \ 线程池\n\n`Thread Pool`（线程池）是指定数量的工作线程的集合，它们独立于 `Runnable` 和 `Callable` 任务存在。\n\
    \n固定线程池减少了线程创建的开销。当请求激增超过其处理能力时，它可以帮助应用程序进行`degrade gracefully`（优雅降级），防止应用程序进入挂起状态或崩溃。\n\
    \n线程池还通过解耦任务的创建与执行，实现了松耦合的设计。\n\n使用 `Executors` 类可以轻松创建固定线程池，你可以使用 `newFixedThreadPool()`\
    \ 厂方法创建 `ExecutorService` 来执行任务。\n\n## Questions\n\n* 什么是线程池？\n* 线程池如何减少线程创建的开销？\n\
    * 线程池如何帮助防止应用程序挂起或崩溃？\n* 什么是固定线程池？它是如何创建的？\n* 线程池如何实现松耦合的设计？\n\n## 同步 (SYNCHRONIZATION)\n\
    \n### 并发 vs 并行 vs 异步\n\n`Parallel processing`（并行处理）是在多个核心上同时执行同一个任务。\n\n`Concurrent\
    \ processing`（并发处理）是同时执行多个任务；可以在多个核心上执行，也可以通过处理器上的抢占式时间共享线程执行。\n\n`Asynchronous\
    \ processing`（异步处理）是进程独立执行，无需等待中间操作的返回值。\n\n## Questions\n\n* 解释并发处理？\n* 解释并行处理？\n\
    * 解释异步处理？\n* 解释并发与并行处理之间的区别？\n* 并行处理需要多个线程吗？\n* 什么时候应用程序是并发而非行的？\n    * 当应用程序同时处理多个操作，而不将这些操作进一步划分为更小的任务时。\n\
    * 什么时候应用程序是并行而非并发的？\n    * 当应用程序处理一个操作，并将该操作划分为更小的任务并并行处理时。\n* 什么时候应用程序既不是并发 true\
    \ 并行的？\n    * 当应用程序只处理一个操作，且不将其操作划分为更小的任务时。\n* 什么时候应用程序既是并发又是并行的？\n    * 当应用程序同时处理多个操作，并将这些操作进一步划分为更小的任务并并行处理时。\n\
    \n## 线程同步 (Thread Synchronization)\n\n`Race condition`（竞态条件）发生在多个线程并发访问共享数据并对其修改时。由于无法预测这些线程读取和写入数据的顺序，可能会导致不可预测的数据值。\n\
    \n`Critical Section`（临界区）`i` 是一个代码块，如果被一个以上的线程并发访问，可能会对结果产生不良影响。\n\n`Thread Synchronization`（线程同步）是控制对`critical\
    \ section`的访问，以防止程序中产生不良影响。\n\n同步创建了内存屏障，称为 `happen-before`（发生于），它确保线程对临界区内本地对象所的所有更改，对于随后获取相同本地对象的任何其他线程都是可见。\n\
    \n## Questions\n\n* 解释多线程中的竞态条件？\n* 什么是临界区？\n* 什么是线程同步？\n* 什么是内存屏障？\n* 线程同步中 happen-before\
    \ 的概念是什么？\n\n### 同步方法 vs 同步块 (Synchronized Method vs Synchronized Block)\n\n`synchronized`\
    \ 关键字用于标记代码中的临界区。\n\n互斥同步通过使用 `synchronized` 关键字锁定临界区来实现。\n\n这可以通过以下两种方式完成。\n\n\
    #### 将方法标记为临界区\n\n```java\npublic class DatabaseWrapper {\n  Object reference\
    \ = new Object();\n\n  // 方法标记为临界区 \n  public synchronized void writeX() { //\
    \ 代码写在此处 }\n\n  // 方法标记为临界区 \n  public static synchronized void writeY() { //\
    \ 代码写在此处 }\n}\n```\n\n#### 将代码块标记为临界区\n\n```java\npublic void writeToDatabase()\
    \ {\n  // 多个线程可以到达这里\n\n  // 代码块标记为临界区 \n  synchronized (this) {\n    // 只有一个线程可以\n\
    \    // 在这里执行这里\n  }\n  // 多个线程可以执行这里\n}\n```\n\n## 注意事项 (Notes)\n\n* 将锁定范围缩小到仅限\
    \ `critical section`。这将提高整体性能并最大限地减少遇到竞态条件的概率。\n* 优先使用 `synchronized` 块而不是 `synchronized`\
    \ 方法，因为块锁只锁定本地对象，而不是整个类对象。\n* 在 `synchronized` 内部，永远不要调用由客户端代码提供的方法或为继承设计的方法。\n\
    \n## Questions\n\n* `synchronized` 关键字是如何使用的？\n* 同步方法和同步块之间有什么区别？\n* 为什么优先选择同步块而不是同步方法？\n\
    * 同步方法会锁定整个对象吗？\n* 如果你在 `synchronized` 块或方法内部调用由客户端代码（client code）提供的方法，你可能会遇到什么问题？\n\
    \n## 条件同步 (Conditional Synchronization)\n\n条件 `synchronization`（同步）是通过使用条件变量连同\
    \ `wait()` 和 `notify()` 或 `notifyAll()` 方法来实现的。\n\n```java\n// 条件同步\npublic void\
    \ operation() throws InterruptedException {\n  synchronized(reference) {\n   \
    \ if (condition1) {\n      // 等待通知 \n      reference.wait();\n    }\n    if (condition2)\
    \ {\n      // 通知所有线程 \n      reference.notifyAll();\n    }\n  }\n}\n```\n\n1.\
    \ 有两种方法可以通知等待线程。\n    * `notify()` - 仅通知一个线程。\n    * `notifyAll()` - 通知所有等待状态的线程。\n\
    2. `wait()` 有一个重载版本可以传递超时时间，`wait(long timeout)`。\n3. 在 `notify()` 和 `notifyAll()`\
    \ 方法之间，优先使用 `notifyAll()`因为它通知所有等待线程。\n4. `notify()` 唤醒单个线程，如果多个线程在等待，线程的选择是随机的。\n\
    \n## Questions\n\n* 什么是条件同步？\n* `wait()` 用的目的是什么？\n* `notify` 和 `notifyAll` 方法的区别是什么？\n\
    * 当你调用 `notify` 且有多个线程等待时，哪一个会被通知？\n* 在 `notify` 和 `notifyAll` 之间，你倾向于哪一个？为什么？\n\
    \n## Volatile\n\n在多线程应用程序中，每个线程都会从主内存维护一个变量的 CPU 缓存副本。因此，线程对其 CPU 缓存中变量的任何更改对其他线程都是不可见的。\n\
    \n标记为 `volatile` 的字段直接从主内存存储和读取。由于 `volatile` 字段存储在主内存中，所有线程对 `volatile` 字段值的最新副本都是可见，无论哪个线程修改了它。\n\
    \n考虑类 `Ledger`，它有一个成员 `currentIndex` 来跟踪条目的数量。在多线程环境中，每个线程都会独立地增加 `currentIndex`\
    \ 值。\n\n```java\npublic class Ledger {\n  public int currentIndex = 0;\n}\n```\n\
    \n如果我们将 `currentIndex` 标记为 `Volatile`，那么每个线程将从主内存中使用其值，而不会创建副本。\n\n```java\npublic\
    \ class Ledger {\n  public volatile int currentIndex = 0;\n}\n```\n\n![Image](img/image00218.jpeg)\n\
    \n## Questions\n\n* 什么是 volatile 字段？\n* 解释 volatile 字段解决的问题？\n\n"
- fmt: "\n# Where does the volatile field gets stored?\n\n## static vs volatile vs\
    \ synchronised\n\n### static Variable\n`static` variables are used in context\
    \ of class objects where only one copy of static variable exists irrespective\
    \ of how many objects of the class are created. \n\nBut if there are multiple\
    \ threads accessing the same variable, each thread will make a copy of that variable\
    \ in its CPU cache and change made by a thread will not be visible to other threads.\n\
    \n### volatile Variable\n`volatile` variables are used in context of threads,\
    \ where only one variable exists irrespective of how many threads or objects accessing\
    \ it and everyone always get the most recently updated value. `Volatile` forces\
    \ all the reads and writes to happen directly in the main memory and not in CPU\
    \ caches.\n\n### synchronized\nBoth `static` and `volatile` are field modifier\
    \ dealing with memory visibility related to variables; whereas, `synchronized`\
    \ deals with controlling access to a `critical section` in code using a monitor,\
    \ thus preventing concurrent access to a section of code.\n\n### Questions\n*\
    \ What are static variables?\n* All the objects of a class share static variables.\
    \ But in a multi-threaded environment; why a change made by one object to the\
    \ static variable is not visible to the objects on another thread?\n* If both\
    \ static and volatile variables are shared across objects, then what's the problem\
    \ a volatile variable solves?\n* How are volatile and static variables different\
    \ from synchronized, as even the synchronized monitor guards the memory object?\n\
    \n## ThreadLocal Storage\nEach thread has a private memory called `thread local\
    \ storage`, which can be used to store thread's current operation related data.\
    \ Usually the `ThreadLocal` variables are implemented as `private static fields`\
    \ and are used to store information like Transaction Identifier, User Identifiers,\
    \ etc.\n\n### ThreadLocal declaration\n```java\nThreadLocal<String> threadLocal\
    \ = new ThreadLocal<String>();\n```\n\n### Setting thread local value\n```java\n\
    threadLocal.set(\"Account id value\");\n```\n\n### Getting thread local value\n\
    ```java\nString accountId = threadLocal.get();\n```\n\n* As `ThreadLocal` objects\
    \ are contained within a thread, you don't have to worry about synchronizing access\
    \ to that object.\n* Life of `ThreadLocal` objects is tied to the thread it's\
    \ created for, unless there are other variables referencing the same object.\n\
    * To prevent leak, it's a good practice to remove `ThreadLocal` object using `remove()`\
    \ method.\n```java\nthreadLocal.remove();\n```\n\n### Questions\n* What is thread\
    \ local storage?\n* What is the kind of information should you store in Thread\
    \ Local Storage?\n* Why you don't need to synchronize access to the objects that\
    \ are stored in ThreadLocal Storage? \n* Why should you call remove method on\
    \ Thread Local Storage?\n\n## wait() vs sleep()\n\n### wait()\nConditional Synchronization\
    \ with `wait()`.\n```java\npublic void manageWaitFor(int timeInMs) throws InterruptedException\
    \ {\n    synchronized (reference) {\n        if (condition1) {\n            //\
    \ wait for notification\n            reference.wait(timeInMs);\n        }\n  \
    \  }\n}\n```\n\n### sleep()\nThread sleeping for specified interval.\n```java\n\
    public void manageSleepFor(int timeInMs) throws InterruptedException {\n    //Pause\
    \ for timeInMs milliseconds\n    Thread.sleep(timeInMs);\n    //Print a message\n\
    \    print(\"Slept for :\" + timeInMs + \"ms.\");\n}\n```\n\n* `wait` is called\
    \ on the object's monitor; whereas, `sleep` is called on `thread`.\n* Waiting\
    \ object can be notified; whereas, sleeping thread cannot.\n* Sleeping thread\
    \ cannot release a lock; whereas, waiting object can.\n* To wake a sleeping thread\
    \ you need reference of it, which is not needed for a waiting object.\n\n### Questions\n\
    * What is the difference between wait and sleep?\n* Why it's possible to notify\
    \ waiting object to wake but not the sleeping?\n* You need direct handle to wake\
    \ a sleeping thread; do you need direct access to a waiting object too? Why?\n\
    * What is the mechanism to signal an object to come out of wait?\n\n## Joining\
    \ Threads\nThreads are usually joined when there is a dependency between the threads.\
    \ The `join()` method of the target thread is used to suspend the current thread.\
    \ In such situations current thread cannot proceed, until the target thread on\
    \ which it depends, has finished execution.\n\n```java\n// main thread joined\
    \ with the thread \npublic void main(String[] args) {\n    Thread thread1 = new\
    \ Thread(ThreadMethodRef::threadMethod);\n    thread1.start();\n    // current\
    \ thread waits \n    // until thread1 completes\n    // execution \n    thread1.join();\n\
    }\n```\n\n### Questions\n* What is the purpose of thread's join method?\n* Why\
    \ do you need to join two threads?\n\n## Atomic Classes\n`Atomic classes` provides\
    \ ability to perform atomic operations on primitive types, such that only one\
    \ thread is allowed to change the value until the method call completes. Atomic\
    \ classes like `AtomicInteger` and `AtomicLong` wraps the corresponding primitive\
    \ types. There is one present for reference type too, `AtomicReference`.\n\nThere\
    \ is no need to provide `synchronized` access to Atomic Class objects. Method\
    \ `incrementAndGet()` is `AtomicInteger` is often used in place of `pre and post\
    \ increment operators`.\n\n### Questions\n* What are atomic classes?\n* Why you\
    \ don't require synchronizing access to an object of atomic class?\n* Why pre\
    \ and post increment operator are not thread safe?\n    * Pre and post operation\
    \ are multiple operations under the hood; read, increment and write. All the three\
    \ are not synchronized together, so any thread context switch that happens in\
    \ between, will result into undesired result.\n* What is the difference between\
    \ Atomic and Volatile variables?\n    * Atomic variables provide happen-before\
    \ reads.\n\n## Lock\n* `Locking` is a mechanism to control access to shared resources\
    \ in multi-threaded environment.\n* `ReentrantLock` class implements `lock interface`.\n\
    * A lock can be acquired and released in different blocks of code.\n* `Lock` interface\
    \ has method `tryLock()` to verify resource availability.\n* As a good practice,\
    \ acquired lock must be released in the `finally` block.\n\n```java\n// Thread\
    \ safe class\npublic class SafeAccount {\n    // Create lock object \n    private\
    \ Lock lockObject = new ReentrantLock();\n\n    public void addMoney() {\n   \
    \     // Acquire the lock\n        lockObject.lock();\n        try {\n       \
    \     // add some money here\n        } finally {\n            // Release the\
    \ lock\n            lockObject.unlock();\n        }\n    }\n}\n```\n\n### Questions\n\
    * Explain locking mechanism in multi-threaded environment?\n* Do you need to acquire\
    \ and release lock in same block of code?\n* Why should you prefer tryLock() instead\
    \ of lock()?\n\n## ReadWriteLock\n* `ReadWriteLock` maintains pair of associated\
    \ locks, one for writing and the other for read-only operations.\n* Only one thread\
    \ can acquire write lock, but multiple threads can have read lock.\n* `ReadWriterLock`\
    \ interface is implemented by `ReentrantReadWriteLock`.\n\n```java\n// ReentrantReadWriteLock\
    \ lock\nReentrantReadWriteLock rwl = new ReentrantReadWriteLock();\n// read lock\
    \ \nLock rl = rwl.readLock();\n// write lock \nLock wl = rwl.writeLock();\n```\n\
    \n### Questions\n* What are the benefits of using ReadWriteLock?\n* In which scenario\
    \ would you prefer ReadWriteLock to any other locking mechanism?\n\n## Synchronisers\n\
    Synchronizers synchronizes multiple threads to protect a `Critical Section`. \n\
    \n***Sync***\n\n***Point Threads***\n\n | ------------\n\n | ----------------\n\
    \n |  ----------\n\nSynchronizer Types\n* Barriers\n* Semaphore\n* Phasers\n*\
    \ Exchangers\n* Latch\n\n### Questions\n* What is the purpose of synchronizers?\n\
    * What are the different types of synchronizers available in Java?\n\n## Barriers\n\
    * In `Barriers`, set of threads waits for each other to arrive at barrier point\
    \ before moving ahead.\n* `CyclicBarrier` is concrete implementation of the `Barrier`\
    \ synchroniser. \n"
