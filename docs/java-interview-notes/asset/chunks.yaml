    \nA *daemon thread* is a thread, which allows  *JVM*  to exit as soon as program\
    \ finishes, even though it is still running. As soon as JVM halts, all the daemon\
    \ threads exists without unwinding stack or giving chance to *finally*  block\
    \ to execute. Daemon thread executes on very low priority.\n\nThreads inherit\
    \ the daemon status of parent thread, which means that any thread that is created\
    \ by the main thread will be a non-daemon thread.\n\nGenerally the daemon threads\
    \ are used to support background tasks or services for the application. Garbage\
    \ Collection happens on Daemon thread.\n\nYou can create a daemon thread like\
    \ following:\n\nThread thread = new Thread();\n\nthread.setDaemon(true);\n\nAll\
    \ non-daemon threads are called user threads. User threads stop the JVM from closing.\n\
    \nThe process terminates when there are no more user threads. The Java main thread\
    \ is always a user thread.\n\nQuestions\n\n*   What is Daemon thread?\n\n*   What\
    \ is user thread? What is main thread?\n\n*   Can a program exit if Daemon thread\
    \ is still running?\n\n*   Can a program exit if user thread is still running?\n\
    \n*   When JVM halts exiting all running Daemon thread, does the finally block\
    \ on a Daemon thread still gets a chance to execute?\n\n*   When a new thread\
    \ is created; is it created as a user thread or a Daemon thread?\n\n*   What happens\
    \ when no user thread is running but a Daemon thread is still running?\n\n*  \
    \ What is Java main thread: a user thread or a Daemon thread?\n\n*   When you\
    \ create a new thread on the main thread, what's the type of thread created: daemon\
    \ or user?\n\n*   For what type of jobs should you use Daemon thread?\n\nRace\
    \ Condition and Immutable Object\n\n*Race condition* occurs when multiple threads\
    \ concurrently access a shared data to modify it. As it is not possible to predict\
    \ the order of data read and write by these threads, it may lead to unpredictable\
    \ data value. \n\nAn object is considered *immutable* when there is no possibility\
    \ of its state change after its construction. If an object is *immutable*, it\
    \ can be shared across multiple threads without worrying about *race condition*. \n\
    \nTo make an object Immutable"
