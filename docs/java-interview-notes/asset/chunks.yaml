    \ condition.   *\n\n*   *Prefer* *synchronized* *block over* *synchronized* *method,\
    \ as block locks only on a local object as opposed to entire class object.   *\n\
    \n*   *Inside* *synchronized**, never call a method provided by the client code\
    \ or the one that is designed for inheritance. *\n\nQuestions\n\n*   How is synchronized\
    \ keyword used?\n\n*   What is the difference between synchronized method and\
    \ synchronized block?\n\n*   Why synchronized block is preferred to synchronized\
    \ method?\n\n*   Does synchronized method locks the entire object?\n\n*   What\
    \ problem you may encounter if you call a method provided by the client, from\
    \ inside the synchronized block or method?\n\nConditional Synchronization\n\n\
    Conditional *synchronization* is achieved using conditional variable along with\
    \ *wait()* and *notify()* or *notifyAll()*  methods.\n\n*// conditional synchronization*\
    \ public void operation()\n\n throws InterruptedException {\n\n **synchronized**(reference)\
    \ {\n\n if (condition1) {\n\n *// wait for notification* reference.**wait()**;\n\
    \n }\n\n if (condition2) {\n\n *// Notify all waiting threads* reference.**notifyAll()**;\n\
    \n }\n\n }\n\n}\n\n1.  There are two methods to signal waiting thread(s).\n\n\
    \    *   *notify() -* signals only one random thread.\n\n    *   *notifyAll()*\
    \ - signals all threads in wait state.\n\n2.  *wait()* has an overload to pass\
    \ timeout duration too, *wait(long timeOut)*.\n\n3.  *Between **notify()** and **notifyAll()*\
    \ method*, prefer using **notifyAll()** as it notifies all the waiting threads.*\n\
    \n4.  *notify()* wakes a single thread, and if multiple threads are waiting to\
    \ be notified, then the choice of thread is arbitrary.\n\nQuestions\n\n*   What\
    \ is conditional synchronization?\n\n*   What is the propose of the wait call?\n\
    \n*   What is the difference between notify and notifyAll method?\n\n*   When\
    \ you call notify, with multiple threads waiting for the notification, which one\
    \ will be notified?  \n\n*   Between notify and notifyAll, which one would you\
    \ prefer? Why?\n\nVolatile\n\nIn a *multi-threaded* application, every thread\
    \ maintains a copy of variable from main memory to its CPU cache. So any change\
    \ made by a thread to the variable in its CPU cache will not be visible to other\
    \ threads.\n\nA field marked *volatile*  is stored and read directly from the\
    \ main memory. As *volatile*  field is stored in the main memory, all the threads\
    \ have visibility to most updated copy of the *volatile* field's value, irrespective\
    \ of which thread modified it.\n\nConsider a class  *Ledger,*  which has a member\
    \ currentIndex  to keep track of number of entries made. In a multi-threaded environment,\
    \ each thread will increment currentIndex  value independently. \n\npublic class\
    \ Ledger { public int currentIndex  = 0;\n\n}\n\nIf we mark currentIndex  as \
    \ *Volatile*, then each thread will use its value from the *main memory* and will\
    \ not create a copy of it.\n\npublic class Ledger { public volatile int currentIndex\
    \  = 0;\n\n}\n\n![Image](OEBPS/Images/image00218.jpeg)\n\nQuestions\n\n*   What\
    \ is volatile field?\n\n*   Explain the problem that volatile field solves?"
