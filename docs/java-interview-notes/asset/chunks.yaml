    \ the tests?\n\n*   How does mocking helps to achieve faster development cycle?\n\
    \n*   What are the types of dependencies that you should replace mock objects\
    \ with?\n\n**JAVA **\n\n**TOOLS**\n\nGit \n\n*Git* is source code management systems.\
    \ Its *distributed version control system (DVCS),* which facilitates multiple\
    \ developers and teams to work in parallel. Git's primary emphasis is on providing\
    \ speed while maintaining data integrity.\n\n*Git* also provides ability to perform\
    \ almost all the operations offline, when network is not available. All the changes\
    \ can be pushed to the server on network's availability.\n\nLet's discuss few\
    \ terms that are frequently used:\n\n*Repository* - is directory that contains\
    \ all the project files.\n\n*Clone* - it creates a working copy of local repository.\n\
    \n*Branch* - is created to encapsulate the development of new features or to fix\
    \ bugs.  \n\n*HEAD* - points to the last commit.\n\n*Commit* - commits changes\
    \ to HEAD and not to remote repository.\n\n*Pull* - Gets the changes from the\
    \ remote repository to the local repository.\n\n*Push* - Commits the local repository\
    \ changes to the remote repository.\n\n*   Git Workflow Structure\n\n![Image](OEBPS/Images/image00223.jpeg)\n\
    \nQuestions\n\n*   What is distributed version control systems?\n\n*   Why do\
    \ you use version control system?\n\n*   What are the typical activities you perform\
    \ with version control system?\n\n*   Explain the branching strategy you follow?\n\
    \nMaven\n\n*Maven* is software project management framework that manages project\
    \ build, dependency resolution, testing, deployment, reporting, etc. Maven is\
    \ based on conventions rather than elaborate configurations; that is, if the project\
    \ is laid out as per the prescribed conventions, as depicted in the image below,\
    \ then it will be able to find the resources to perform different build operations.\n\
    \n![Image](OEBPS/Images/image00224.jpeg)\n\nMaven is managed by *pom.xml* (also\
    \ known as Project Object Model) file, which facilitates defining various tasks\
    \ (or goals) and also has a dedicated section to specify various project dependencies,\
    \ which are resolved by Maven.\n\nQuestions\n\n*   Why do you need framework for\
    \ dependency resolution, you can manually download the files and add reference?\n\
    \n*   What all things does Maven support?\n\n*   Why Maven is said to be convention\
    \ based?\n\n*   What is the meaning of goals in Maven?\n\nAnt\n\n*Ant* is powerful\
    \ XML based scripting tool for automating the build process. An automated build\
    \ infrastructure is very important element in the [Continuous Integration](#part0157.xhtml)\
    \ cycle.\n\n*Ant* provides support for things like code compilation, testing and\
    \ packaging, which can be defined as a series of task. Unlike Maven, Ant is driven\
    \ by configuration and not convention. Similar to *goals* in Maven, you can define\
    \ *Targets* in Ants, which are series of tasks. Ant depends on file *build.xml*\
    \ (you can specify different name too) to execute the targets defined.\n\nQuestions\n\
    \n*   What is Ant tool used for?\n\n*   What all things does Ant support?\n\n\
    *   What are differences between Ant and Maven?\n\n*   What is the meaning of\
    \ Targets in Ant?\n\nJenkins\n\nContinuous Integration"
