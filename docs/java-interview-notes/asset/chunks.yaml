  trans: "\n\n- 在使用 `Iterator` 迭代时可以修改集合的结构吗？\n- 在使用 `Iterator` 迭代时可以修改集合元素的值吗？\n\
    - 在 for-each 循环和 for 循环之间，你更倾向于哪一个？为什么？\n- 为什么认为 `Iterators` 具有更高的线程安全性？\n- 解释向集合提供\
    \ `Data Independent Access`（数据独立访问）的概念？\n- 你如何设计你的类，以便为类内部使用的集合提供数据独立访问？ \n\n\
    ## 快速失败 (Fail Fast)\n\n`Iterator` 方法被认为是 `fail-fast`（快速失败），因为在获取集合的迭代器后，`Iterator`\
    \ 会防止集合发生任何结构性修改。这确保了任何失败都能被快速报告，而不是让应用程序在稍后进入损坏的状态。在这种情况下，会抛出 `ConcurrentModificationException`。\n\
    \n来自 `java.util` 的迭代器是快速失败的。\n\n### 问题\n\n- 在集合迭代的语文中，fail-fast 术语的意思是什么？\n- 快速失败迭代器有什么好处？\n\
    - 什么是快速安全（fail safe）迭代器？\n    - 快速安全迭代器在集合被修改时不会抛出任何 `Exception`，因为它在原始集合的副本上工作。来自\
    \ `java.util.concurrent` 包的迭代器是快速安全迭代器。\n\n## 错误与异常 (ERROR AND EXCEPTION)\n\n\
    ### 异常 (EXCEPTION)\n\nJava 中的异常层次结构：\n\n![Image](img/image00217.jpeg)\n\n- `Exception`\
    \ 是中断程序执行流的**异常情况**。\n- 所有异常都继承自 `Throwable`。\n- 如果你想创建一个检查异常（checked exception），则要子类\
    \ `Exception` 类；如果你想创建一个未检查异常（unchecked exception），则要子类 `RuntimeException`。\n\
    - 虽然理论上你也可以子类 `Throwable` 类来创建检查异常，但不建议这样做，因为 `Throwable` 是 Java 中所有异常和错误的父类。\n\
    \n### 问题\n\n- 什么是 `Exception`？\n- 解释 Java 中的根层异常超类？\n- 你应该子类哪个超类来创建检查异常？\n- 你应该子类哪个超类来创建未检查异常？\n\
    \n## 检查异常 vs 未检查异常 vs 错误\n\n### 检查异常 (Checked Exception)\n\n- 检查异常在编译时进行检查。\n\
    - 检查异常扩展 `Throwable` 或其子类，`TimeException` 和 `Error` 类除外。\n- 检查异常在程序上是可以恢复的。\n\
    - 你可以通过 `try/catch` 块或在方法声明中使用 `throws` 子句来处理检查异常。\n- 静态初始化器不能抛出检查异常。\n\n```java\n\
    public static void main(String args[]) {\n    FileInputStream fis = null;\n  \
    \  try {\n        fis = new FileInputStream(\"details.txt\");\n    } catch (FileNotFoundException\
    \ fnfe) {\n        System.out.println(\"Missing File :\" + fnfe);\n    }\n}\n\
    ```\n\n### 未检查异常 (Unchecked Exception)\n\n- 未检查异常在运行时检查。\n- 未检查异常扩展 `RuntimeException`\
    \ 类。\n- 无法合理要求你从这些异常中恢复。\n- 使用良好的编程技术可以避免未检查异常。\n- 抛出未检查异常有助于发现许多缺陷。\n\n```java\n\
    public int getAccountBalance(String customerName) {\n    int balance = 0;\n  \
    \  if (customerName == null)\n        throw new IllegalArgumentException(\"Null\
    \ argument\");\n    // logic to return calculate balance \n    return balance;\n\
    }\n```\n\n### 错误 (Error)\n\n- `Error` 类用于定义**不可恢复的致命致命异常**，应用程序不应该捕获这些异常。\n- 程序员对这些异常无能为。\n\
    - 即使你捕获了 `OutOfMemoryError`，你仍然会再次得到，因为垃圾回收器可能无法释放内存概率很高。\n- 仅在预期失败且有非常合理的恢复方法的情况下使用\
    \ `checked` 异常；对于任何其他情况，请使用 `unchecked` 。\n\n### 问题\n\n- 什么是检查异常？\n- 什么是未检查异常？\n\
    - Java 中的 `Error` 类定义了哪些类型的异常？\n- 你如何处理检查异常？\n- 如果异常未被处理会发生什么？\n- 处理检查异常的不同方法有哪些？\n\
    - 你可以使用哪些异常类在 `catch` 块中同时处理检查和未检查异常？\n- 你如何在检查异常和未检查异常之间做选择？\n- 你能从未检查异常中恢复吗？\n\
    - 你如何避免未检查异常？\n- 可以在静态块中抛出检查异常吗？为什么？\n    - 你不能抛出，因为没有特定的地方来捕获它，而且它只调用一次。你必须使用\
    \ `try/catch` 来处理检查异常。\n- 处理 `Error` 时你应该做什么？\n\n## 异常处理最佳实践\n\n尽管异常处理主要由上下文驱动，但异常处理策略必须保持一致性是非常重要的。以下是几个异常处理的最佳实践：\n\
    \n1. 永远不要抑制异常 - 因为这可能导致你的程序处于不安全且不状态。\n2. 不要进行过度的异常处理 - 特尤其是当你不知道如何完全从中恢复时。\n\
    3. 永远不要吞掉异常 - 因为它可能导致应用程序进入不一致的状态，甚至糟糕的是不记录原因。\n4. 不要捕获并继续执行程序 - 带有某些默认行为。今天定义的默认行为在未来可能不再有效。\n\
    5. 不要向用户显示通用的错误信息 - 而是清理异常处理以报告用户友好的消息并提供关于下一步的建议。\n6. 不要在一个单一的 `try` catch 块中放入多个异常场景\
    \ - 因为将无法确定异常的原因。\n7. 不要在单一的 `catch` 块中捕获多个异常 - 因为将无法确定异常的原因。\n8. 不要不封装异常 - 这可能会掩盖真实的源头。\n\
    9. 不要暴露敏感信息 - 而是对可能暴露信息的异常进行清洗。\n10. 始终记录异常 - 除非有充分的理由不这样做。\n11. 不要捕获 `Throwable`\
    \ - 因为将无法确定异常的原因。\n12. 不要使用异常来控制执行流 - 尽可能使用布尔值验证条件。\n13. 程序化处理不同场景 而不是将所有逻辑放在\
    \ `try` 块中。\n14. 显式命名线程 - 在多线程应用程序中，这极大有助于调试。\n15. 永远不要抛出通用异常 - 因为将无法确定异常的原因。\n\
    \n### 问题\n\n- 描述一些异常处理的最佳实践？\n- 抑制异常的危害是什么？\n- 向用户显示通用错误信息的问题是什么？\n- 吞掉异常的缺点是什么？\n\
    - 在单一 `catch` 块中处理多个异常的缺陷是什么？\n- 如果异常从包含敏感信息的源抛出，你会怎么办？在这种情况下你会记录什么？向用户显示什么消息？\n\
    - 将所有异常封装到通用异常类中的缺陷是什么？\n\n### try-with-resource\n\n`try-with-resource` 是 Java\
    \ 语言结构，它使得能够自动关闭 `try` 语句包含的资源。\n\n"
- fmt: "\n```java\ntry (FileInputStream fis = new FileInputStream(\"details.txt\"\
    )) {\n    // code to read data\n}\n```\n\n* The resource used with `try-with-resource`\
    \ must inherit `AutoCloseable` Interface.\n* You can specify multiple resources\
    \ within a try block.\n\n## Questions\n* Which java construct can you use to close\
    \ the system resources automatically?\n* To use a class object within try-with-resource\
    \ construct, which Interface should the class inherit from?\n\n# THREADING\n\n\
    ### Threading Terms\n* `Thread` is a smallest piece of executable code within\
    \ a process. \n* `Program` is set of ordered operations.\n* `Process` is an instance\
    \ of a program.\n* `Context Switch` is expensive process of storing and restoring\
    \ the state of thread.\n* `Parallel processing` is simultaneous execution of same\
    \ task on multiple cores.\n* `Multithreading` is the ability of a CPU to execute\
    \ multiple processes or threads concurrently.\n* `Deadlock` occurs when two threads\
    \ are waiting for each other to release lock.\n\n### Basic Concepts\n* All Java\
    \ programs begin with `main()` method on a user thread.\n* Program terminates\
    \ when there is no user thread left to execute.\n* `Thread` maintains a private\
    \ stack and series of instructions to execute.\n* `Thread` has a private memory\
    \ called thread local storage, which can be used to store thread's current operation\
    \ related data, in a multi-threaded environment.\n* `JVM` allows process of have\
    \ multiple threads.\n* Each thread has a priority.\n\n## Questions\n* What is\
    \ a thread?\n* What is a program?\n* What is a process?\n* What is the difference\
    \ between a thread and a process?\n* What is the difference between a program\
    \ and a process?\n* Explain context switching of thread?\n* What is parallel processing?\n\
    * What is multi-threading?\n* How parallel processing and multi-threading related?\n\
    * What is deadlock?\n* What is a user thread?\n* What is thread local storage?\
    \ What are the things would you store with thread local storage?\n* Do threads\
    \ share stack memory?\n\n## Thread Lifecycle\nFollowing are various stages of\
    \ thread states .\n\n* **New**: Thread is created but not started.\n* **Runnable**:\
    \ Thread is running.\n* **Blocked**: Thread waiting to enter critical section.\
    \ \n* **Waiting**: Thread is waiting by calling `wait()` or `join()`.\n* **Time-waiting**:\
    \ Thread waiting by calling `wait()` or `join()` with specified timeout.\n* **Terminated**:\
    \ Thread has completed its task and exited.\n\n### Notes\nYou can get the state\
    \ of thread using `getState()` method on the thread.\n\n## Questions\n* Describe\
    \ different stages of thread lifecycle?\n* What is difference between blocked\
    \ state and waiting state?\n* How can you find thread's state?\n* How thread sleep()\
    \ method is different from thread wait() method? \n\n## Thread Termination\nThe\
    \ thread should be stopped calling `interrupt()` method. Calling thread interrupt\
    \ even breaks out of `Thread.sleep()`.\n\nThe operation executing on thread should\
    \ recurrently call `isInterrupted()` method to check if thread is requested to\
    \ be stopped, where you can safely terminate the current operation and perform\
    \ any required cleanup.\n\n```java\nif (Thread.currentThread().isInterrupted())\
    \ {\n    // cleanup and stop execution\n}\n```\n\n### Notes\n* `stop()`, `suspend()`\
    \ and `resume()` methods are deprecated, as using these may lead to the program\
    \ to an inconsistent state.\n\n## Questions\n* What define a good strategy to\
    \ terminate a thread?\n* What is thread interrupt? How thread's interrupt method\
    \ is different from thread's stop method?\n* What happens if a thread is sleeping\
    \ and you call interrupt on the thread?\n* Does calling interrupt stops the thread\
    \ immediately?\n* Why you shouldn't call thread's stop and suspend methods?\n\n\
    # Implementing Runnable vs Extending Thread\n\n### Thread instantiated implementing\
    \ `Runnable` Interface\n```java\npublic class RunnableDerived implements Runnable\
    \ { \n    public void run() {\n    }\n}\n```\n\n### Thread created extending `Thread`\
    \ class\n```java\npublic class ThreadDerived extends Thread { \n    public void\
    \ run() {\n    }\n}\n```\n\n* `Runnable`'s `run()` method does not create a new\
    \ thread but executes as a normal method in the same thread it's created on, whereas\
    \ `Thread's `start()` methods creates a new thread. \n* `Runnable` is preferred\
    \ way to execute a task on a thread, unless you are specializing `Thread` class,\
    \ which is unlikely in the most of the case. \n* By Implementing `Runnable`, you\
    \ are providing a specialized class an additional ability to run too. \n* Also\
    \ by separating the task as `Runnable`, you can execute the task using different\
    \ means.\n\n## Questions\n* What are the different ways to create a thread?\n\
    * How implementing Runnable interface is different from extending Thread class?\n\
    * When should you extend Thread class?\n* When should you inherit Runnable Interface?\n\
    * Between Runnable and Thread, which one is the preferred way?\n* Does implementing\
    \ Runnable creates a thread?\n* Both Thread class and Runnable Interface have\
    \ run methods, what is the difference?\n\n# Runnable vs Callable Interface\n\n\
    ### `Runnable` Interface\n```java\n@FunctionalInterface \npublic interface Runnable\
    \ { \n    public abstract void run();\n}\n```\n\n### `Callable` Interface\n```java\n\
    @FunctionalInterface \npublic interface Callable<V> { \n    V call() throws Exception;\n\
    }\n```\n\n* `Runnable` cannot return result and cannot throw a checked exception.\n\
    * A `Callable` needs to implement `call()` method while a `Runnable` needs to\
    \ implement `run()` method.\n* A `Callable` can be used with `ExecutorService`\
    \ methods but a `Runnable` cannot be.\n\n## Questions\n* What is the difference\
    \ between Callable and Runnable interface?\n* What is the benefit of using Runnable\
    \ over Callable?\n* Can you throw checked exception from Runnable interface?\n\
    * Why Runnable and Callable interfaces are called Functional Interface?\n* Which\
    \ of the Interface returns result: Runnable or Callable?\n\n# Daemon Thread\n\
    A `daemon thread` is a thread, which allows `JVM` to exit as soon as program finishes,\
    \ even though it is still running. As soon as JVM halts, all the daemon threads\
    \ exists without unwinding stack or giving chance to `finally` block to execute.\
    \ Daemon thread executes on very low priority.\n\nThreads inherit daemon status\
    \ of parent thread, which means that any thread that is created by main thread\
    \ will be a non-daemon thread.\n\nGenerally the daemon threads are used to support\
    \ background tasks or services for the application. Garbage Collection happens\
    \ on Daemon thread.\n\nYou can create a daemon thread like following\n```java\n\
    Thread thread = new Thread();\nthread.setDaemon(true);\n```\n\nAll non-daemon\
    \ threads are called user threads. User threads stop the JVM from closing.\n\n\
    The process terminates when there are no user threads. The Java main thread is\
    \ always a user thread.\n\n## Questions\n* What is Daemon thread?\n* What is user\
    \ thread? What is main thread?\n* Can a program exit if Daemon thread is still\
    \ running?\n* Can a program exit if user thread is still running?\n* When JVM\
    \ halts exiting all running Daemon thread, does the finally block on a Daemon\
    \ thread gets a chance to execute?\n* When a new thread is created; is it created\
    \ as a user thread or a Daemon thread?\n* What happens when no user thread is\
    \ running but a Daemon thread is still running?\n* What is Java main thread: a\
    \ user thread or a Daemon thread?\n* For what type of jobs should you use Daemon\
    \ thread?\n\n# Race Condition and Immutable Object\n*Race condition* occurs when\
    \ multiple threads concurrently access a shared data to modify it. As it is not\
    \ possible to predict the order of data read and write by these threads, it may\
    \ lead to unpredictable data value. \n\nAn object is considered *immutable* when\
    \ there is no possibility of its state change after its construction. If an object\
    \ is *immutable*, it can be shared across multiple threads without worrying about\
    \ *race condition*. \n\n## To make an object Immutable\n"
