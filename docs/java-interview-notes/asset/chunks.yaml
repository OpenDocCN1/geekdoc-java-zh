  trans: "\n\n- `varargs` 和对象数组在方法内部都被被处理为数组。\n- 虽然 `varargs` 并不非常流行，但在任何需要处理不确定数量参数的地方都可以使用。\n\
    \n### 问题\n- 什么是 `varargs`？\n- `varargs` 和对象数组之间有什么区别？\n- 你是否可以调用一个仅定义 `varargs`\
    \ 作为唯一参数的、带有零参数的方法？\n- 你是否可以重载一个接收 `int` 数组的方法，使其接收 `int` `varargs`？\n- 使用 `varargs`\
    \ 的不同场景有哪些？\n\n### 默认接口方法 (Default Interface Method)\n- `Default interface methods`\
    \ 直接被添加到 `Interface` 中以扩展其功能。\n- 可以添加 `Default interface method` 来增强一个甚至不在你控制之下的\
    \ `Interface`。\n- 它不会破坏所添加的接口的任何现有实现。\n- 实现类可以重写接口中定义的默认方法。\n- `Default method`\
    \ 也称为 `Defender` 或 `Virtual` 扩展方法。\n\n在代码示例 `default Interface method` 中，`getAdditionSymbol()`\
    \ 被添加到现有的接口 `Calculator` 中。\n\n```java\npublic interface Calculator {\n    public\
    \ <T> T add(T num1, T num2);\n    default public String getAdditionSymbol(){\n\
    \        return \"+\";\n    }\n}\n```\n\n### 默认方法的局限性\n- 如果类继承了多个具有相同签名默认方法的接口，则实现类必须为该默认方法提供实现以解决歧义。\n\
    - 如果继承层次结构中的任何类拥有具有相同签名的方法，则默认方法将失效。\n\n### 默认方法 vs 抽象方法 (Default method vs Abstract\
    \ method)\n以下是几个细微区别：\n- 抽象方法允许定义构造函数。\n- 抽象方法可以关联状态。\n\n### 使用默认方法 - 抽象类与接口\n\
    随着 `default methods` 的引入，现在即使是 `Interfaces` 也可以扩展以添加更多功能，而不会破坏继承该接口的类。\n\n###\
    \ 问题\n- 什么是默认接口方法？\n- 默认接口方法的处是什么？\n- 你是否可以添加默认接口方法来增强一个你不直接控制的接口？\n- 你是否可以重写默认接口方法以提供不同的实现？\n\
    - 当一个类继承两个接口且两者都定义了相同签名的默认方法时会发生什么？\n- 在接口中定义默认方法与在抽象类中定义相同的方法有什么区别？\n\n### 静态接口方法\
    \ (Static Interface Method)\n- `Static Interface methods` 直接被添加到接口中以扩展其功能。\n-\
    \ `Static Interface methods` 通常用于实现实用程序函数，如：验证、排序等。\n- 当你想在继承接口的类中强制执行行为时，也会使用\
    \ `Static interface methods`。\n- 实现类不能重写其继承的接口中定义的静态方法。\n- `Static Interface method`\
    \ 甚至可以被用来增强一个你不控制的接口。\n- 与默认接口方法类似，即使是静态接口方法破坏接口的任何现有实现。\n\n在代码示例中，`static Interface\
    \ method` `getUtcZonedDateTime()` 被添加到现有的接口 `DBWrapper` 中。\n\n```java\npublic\
    \ interface DBWrapper {\n    static ZonedDateTime getUTCZonedDateTime(Instant\
    \ date ){\n        ZoneId zoneId = TimeZone.getTimeZone(\"UTC\").toZoneId();\n\
    \        ZonedDateTime zonedDateTime = ZonedDateTime.ofInstant(date, zoneId);\n\
    \        return zonedDateTime;\n    }\n}\n```\n\n### 问题\n- 什么是静态接口方法？\n- 你可以在哪里使用静态接口方法？\n\
    - 你可以重写静态接口方法吗？\n- 静态接口方法和默认接口方法之间的区别是什么？\n- 你是否可以添加静态接口方法来增强一个你不直接控制的接口？\n- 如果一个类继承两个接口且两者都定义了相同签名的静态接口方法，会发生什么？\n\
    \n### 注解 (Annotations)\n`annotation` 将元数据关联到不同的程序元素上。注解可能针对编译器，也可能针对运行时处理。\n`Annotation`\
    \ 元数据可以用于文档说明、生成样板代码、执行编译器验证、运行时处理等。`Annotations` 对它们所注解的代码段不会产生任何直接影响。\n\n我们可以将\
    \ `annotations` 应用到字段、变量、方法、参数、类、接口、枚举、包、注解本身等。\n\n#### 用法\n用户定义的注解直接放置在被注解的项之前。\n\
    \n```java\n@Length(max=10, min=5)\npublic class ParkingSlot {\n    // 代码写在此处*\n\
    }\n```\n\n#### 一些内置注解\n- `@Deprecated` - 表示方法已过时。\n- `@Override` - 表示父类方法被重写。\n\
    - `@SupressWarnings` - 用于抑制警告。\n\n### 问题\n- 什么是注解？\n- 你可以在哪里使用注解？\n- 你可以在哪些 Java\
    \ 实体上应用注解？\n\n### 偏好 (Preferences)\n在 Java 中，`Preferences` 类用于以`hierarchical`形式存储用户和系统偏好。`Preferences`\
    \ 类抽象了存储过程。它以特定于操作系统的方式存储偏好：Mac 上的偏好文件或 Windows 系统上的注册表。虽然 `preferences` 中的键是\
    \ `Strings`，但值可以是任何基本类型。\n\n应用程序通常使用 `Preferences` 类来存储和检索用户、系统偏好以及配置数据。\n\n###\
    \ 问题\n- `Preferences` 类的用途是什么？\n- `Preferences` 可以存储什么类型的信息？\n- 在使用 `Preferences`\
    \ 类时，你需要处理操作系统要求的内部格式吗？\n\n### 值传递还是 引用传递 (Pass by value or Pass by Reference)\n\
    在 Java 中 - 方法参数（基本类型或对象引用）`总是按值传递的`，而对象仅通过引用访问。传递对象到方法时，传递的是引用的拷贝而不是对象本身。对对象的任何更改都会改变对象的内容，而不是引用的值。\n\
    \n### 问题\n- 值传递和引用传递的区别是什么？\n- Java 中的引用类型参数是按引用还是按值传递？\n- 如果按值传递引用的拷贝，方法如何访问该引用所指向的对象？\n\
    - 如果按值传递引用的拷贝，你可以修改引用的值吗？\n\n### 命名规范 驼峰 vs 帕斯卡 (Naming Convention Camel Case\
    \ vs Pascal Case)\n`Camel Case` 编写复合单词的做法，使得每个单词的首字母都大写，例如 `BorderLength`;它也被称为\
    \ `Pascal Case` 或 `Upper Camel Case`。但在编程领域，驼峰命名通常以小字母开头，例如 `borderLength`;它也被称为\
    \ `Lower Camel Case`。在讨论中，我们将 `BorderLength` 视为 `Pascal Case`，将 `borderLength`\
    \ 视为 `Camel Case`。\n\n### 命名规范\n`Naming convention` 是一套规范接口、类、方法、变量和其他实体标识符命名的规则。命名规范的选择和实现往往是一个争议点。\n\
    \n标准的命名规范可以提高代码的可读性，有助于代码审查和对代码的整体理解。\n\n### 接口\n- 名称应该是 `Pascal Case`。\n- 如果定义的是行为，名称应该是`形容词`，否则应该是`名词`。\n\
    \n```java\npublic interface Runnable\n```\n\n### 类\n- 名称应该是 `Pascal Case`。\n-\
    \ 名字应该是一个`名词`，因为 `class` 代表某个现实世界的对象。\n\n```java\npublic class ArrayList\n```\n\
    \n### 方法\n- 命名应该是 `Camel Case`。\n\n```java\npublic boolean isEmpty()\n```\n\n\
    变量\n\n"
- fmt: "\n## Naming Conventions\n\n- Name should be `Camel Case`.\n\n```java\nprivate\
    \ long serialVersion = 1234L;\n```\n\n### Constants\n- Name should be all `uppercase`\
    \ letters. Compound words should be separated by underscores.\n\n```java\nprivate\
    \ int DEFAULT_CAPACITY = 10;\n```\n\n### Enum\n- Enum set name should be all `uppercase`\
    \ letters.\n\n```java\npublic enum Duration { SECOND, MINUTE, HOUR }\n```\n\n\
    ### Acronyms\n- Even though acronyms are generally represented by all Upper Case\
    \ letters, but in Java only the first letter of acronyms should be upper case\
    \ and rest lower case.\n\n```java\npublic void parseXml(){}\n```\n\n### Questions\n\
    - What is naming convention?\n- Why do you need naming convention?\n- What is\
    \ the difference between Camel Case and Pascal Case?\n- What is the difference\
    \ between Upper Camel Case and Lower Camel Case?\n- Explain naming convention\
    \ for interface, class, method, variable, constant, enum and acronyms?\n\n## OBJECT\
    \ ORIORIENTED PROGRAMMING\n\n### Polymorphism\n`Polymorphism` is an ability of\
    \ a class instance to take different forms based on the instance its acting upon.\n\
    \n`Polymorphism` is primarily achieved by `subclassing` or by `implementing an\
    \ interface`. The derived classes can have its own unique implementation for certain\
    \ feature and yet share some of the functionality through inheritance.\n\nBehaviour\
    \ of object depends specifically on its position in the class hierarchy.\n\nConsider\
    \ you have a `Furniture` class, which has `addLegs()` method; and a `Chair` and\
    \ a `Table` class, both extend `Furniture` class and have their own implementation\
    \ of `addLegs()` method. In this situation, the implementation of `addLegs()`\
    \ method that gets called is determined by the runtime, depending whether you\
    \ have a `Chair` or a `Table` instance. \n\n```java\npublic abstract class Furniture\
    \ {\n  public abstract void addLegs();\n  public void print(String message){\n\
    \    System.out.println(message);\n  }\n}\n\nclass Chair extends Furniture {\n\
    \  @Override public void addLegs() {\n    print(\"Chair Legs Added\");\n  }\n\
    }\n\nclass Table extends Furniture{\n  @Override public void addLegs() {\n   \
    \ print(\"Table Legs Added\");\n  }\n}\n\nFurniture furniture = new Chair(); //\
    \ This prints \"Chair Legs Added\"\nfurniture.addLegs(); \nfurniture = new Table();\
    \ // This prints \"Table Legs Added\"\nfurniture.addLegs();\n```\n\n### Benefits\
    \ of polymorphism\nThe real power and benefit of polymorphism can be achieved\
    \ when you can code to an `abstract base class` or an `interface`. Based on the\
    \ context, `polymorphism` enables the selection of most appropriate class implementation.\
    \ Not only in production code, it also paves way to have an alternate implementation\
    \ for `testing`.\n\n### Questions\n- What is Polymorphism?\n- What are different\
    \ ways to achieve polymorphism?\n- How is inheritance useful to achieve polymorphism?\n\
    - What are the benefits of polymorphism?\n- How is polymorphism concept useful\
    \ for unit testing?\n\n### Parametric polymorphism\nIn Java, `Generics` facilitates\
    \ implementation for `Parametric polymorphism`, which enables using the same code\
    \ implementation with the values of different types, without compromising on compile\
    \ time type safety check.\n\nIn the example below, we added an `upper bound` to\
    \ type parameter `T` such that it implements an interface that guarantees `getWheelsCount()`\
    \ method in the type `T`.\n\n```java\ninterface Vehicle {\n  int getWheelsCount();\n\
    }\n\nclass Car<T extends Vehicle> {\n  private T vehicle;\n  public Car(T vehicle)\
    \ {\n    this.vehicle = vehicle;\n  }\n  public int getWheelsCount() {\n    return\
    \ vehicle.getWheelsCount();\n  }\n}\n```\n\nIt takes `parameter` of type `T` and\
    \ returns count of wheels, without worrying about what type `T` actually is.\n\
    \n### Questions\n- What is Parametric Polymorphism?\n- How Generics is used to\
    \ achieve Parametric Polymorphism?\n- How are Type Wildcards used to achieve Parametric\
    \ Polymorphism?\n- Can you achieve Parametric Polymorphism without Generics?\n\
    \n### Subtype polymorphism\nIn `Subtype polymorphism`, also known as `inclusion\
    \ polymorphism`, the parameter definition of a function supports any argument\
    \ of a type or its subtype. \n\nIn the code below, the method `printWheelsCount()`\
    \ takes `Vehicle` as parameter and prints count of wheels in the `Vehicle`. The\
    \ `main` method shows `subtype polymorphic` calls, passing objects of `Car` and\
    \ `Bike` as arguments to the `printWheelsCount()` method. Every place where it\
    \ expects a type as parameter, it also accepts `subclass` of that type as parameter.\n\
    \n```java\nabstract class Vehicle{\n  public abstract int getWheelsCount();\n\
    }\n\nclass Car extends Vehicle{\n  @Override public int getWheelsCount() {\n \
    \   return 4;\n  }\n}\n\nclass Bike extends Vehicle{\n  @Override public int getWheelsCount()\
    \ {\n    return 2;\n  }\n}\n\npublic void printWheelsCount(Vehicle vehicle) {\n\
    \  print(vehicle.getWheelsCount());\n}\n\npublic void main(String[] args) {\n\
    \  printWheelsCount(new Car());\n  printWheelsCount(new Bike());\n}\n```\n\n###\
    \ Questions\n- What is Subtype Polymorphism?\n- What is Inclusion Polymorphism?\n\
    - What is the difference between Parametric Polymorphism and SubType Polymorphism?\n\
    - Can you achieve SubType polymorphism using Generics?\n\n## Overriding\n- Method\
    \ `overriding` is redefining the base class method to behave in a different manner\
    \ than its implementation in the base class.\n- Method `overriding` is an example\
    \ of `dynamic` or `runtime` polymorphism. \n- In `dynamic polymorphism`, runtime\
    \ takes the decision to call an implementation.\n\n### Rules for method overriding\n\
    - Method arguments and its order must be same in the overriding method.\n- Overriding\
    \ method can have same return type or subtype of base class return type.\n- Access\
    \ modifier of overridden method cannot be more restrictive than its definition\
    \ in base class.\n- Constructor, `static` and `final` method cannot be overridden.\n\
    - Overridden method cannot throw `checked exception` if its definition in base\
    \ class doesn't, though overridden method can throw `unchecked exception`.\n\n\
    ### Questions\n- What is method overriding?\n- What is dynamic polymorphism?\n\
    - Why can't you override static methods defined in super class or interface?\n\
    - Can you override a final method defined in super class?\n- Can you override\
    \ a public method in super class and mark it protected?\n- Why can't you override\
    \ constructor of super class?\n- Can an overriding method throw checked exception;\
    \ when the overridden method in the super class does not? Why?\n- What are the\
    \ benefits of method overriding?\n\n### @Override\n`@Override` annotation is way\
    \ to explicitly declare the intention of `overriding` the method implementation\
    \ in the base class. Java performs compile time checking for all such methods.\
    \ It provides an easy way to mistake proof against writing wrong method signature,\
    \ when you want to override from base class.\n\nIf a derived class defines a method\
    \ having the same signature as a method in the base class, the method in the derived\
    \ class hides the one in the base class. By prefixing a subclass's method header\
    \ with the `@Override` annotation, you can detect if an inadvertent attempt is\
    \ made to `overload` instead of `overriding` a method.\n\n### Questions\n- What\
    \ is the purpose of @Override annotation?\n- What happens if you define a method\
    \ with the same signature as defined in the super class and not use @Override\
    \ annotation?\n- What are the benefits of @Override annotation?\n\n### Overloading\n\
    - Method `overloading` is defining more than one method with the same name, but\
    \ with different parameters. \n- Method `overloading` is an example of `static`\
    \ or `compile-time` `polymorphism`.\n- In `static polymorphism`, it's while writing\
    \ the code, decision is made to call a specific implementation.\n\n### Rules for\
    \ method overloading\n- Method can be overloaded by defining method with the same\
    \ name as an existing one, having:\n    - Different number of argument list.\n\
    \    - Different datatype of arguments.\n    - Different order of arguments.\n"
