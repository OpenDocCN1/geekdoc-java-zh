  trans: "\n\n接口通过其定义的方法签名来定义其行为。使用集合时，你应该始终针对集合接口编写代码，而不是类实现，这样代码就不会依赖于特定的实现。这可以防止底层实现类可能发生的变化的影响。\n\
    \n以下是定义集合及其行为最重要的接口。下方的每个子节点都继承自其父节点。\n\n- `Collection`\n    - `Queue`\n     \
    \   - `BlockingQueue`\n        - `TransferQueue`\n        - `BlockingDeque`\n\
    \        - `Deque`\n- `BlockingDeque`\n    - `List`\n    - `Set`\n    - `SortedSet`\n\
    \    - `NavigableSet`\n- `Map`\n    - `SortedMap`\n\n## 问题\n- 为什么你应该针对集合接口编写代码而不是具体的实现？\n\
    \n## 集合类型\n- `Set` - `Set` 包含唯一元素。\n- `List` - `List` 是一个有序集合。\n- `Queue` - `Queue`\
    \ 以先进先出 (FIFO) 的方式在处理前持有元素。\n- `Deque` - `Deque` 以先进先出 (FIFO) 和后进先出 (LIFO) 两种方式在处理前持有元素。\n\
    - `Map` - `Map` 包含键到对应值的映射。\n\n## 问题\n- 有哪些不同的集合类型？\n- 定义 `Set` 集合类型？\n- 定义 `List`\
    \ 集合类型？\n- 定义 `Queue` 集合类型？\n- 定义 `Deque` 集合类型？\n- 定义 `Map` 集合类型？\n- `Queue` 和\
    \ `Deque` 之间的区别是什么？\n\n## Set\n\n### Basic Set\n```java\n// 创建一个 set\nSet<String>\
    \ set = new HashSet<>();\n```\n- `Set` 是唯一元素的集合。\n- `Set` 中的元素是无序存储。\n- `Set`\
    \ 中只能添加一个 `null` 元素。（等待，原文说只能有一个 `null`）\n- 重复元素会被忽略。\n- 当不需要排序时，`Set` 最快且内存占用较小。\n\
    \n### Linked Hashset\n```java\n// 创建一个 linkedHashSet\nSet<String> linkedHashSet\
    \ = new LinkedHashSet<>();\n```\n- `LinkedHashSet` 保持 `Set` 元素与其插入时的相同顺序。\n- 如果在\
    \ `LinkedHashSet` 中重新插入一个元素，插入顺序不会受影响。\n- `LinkedHashSet` 中的 `Iterator` 按照这些元素添加到集合的相同顺序返回元素。\n\
    \n### Sorted Set\n- `SortedSet` 强制对元素进行排序，要么通过实现 `Comparable` 接口按自然顺序排序，要么使用 `Comparator`\
    \ 对象进行自定义排序。\n- `TreeSet` 是 `SortedSet` 接口的一个实现类。\n```java\n// 创建按城市名称排序的集合\n\
    SortedSet<String> cityNames = new TreeSet<>();\n```\n- 使用 `Comparator` 对象执行自定义排序。\n\
    ```java\nSortedSet<City> sortedCitiesByName = new TreeSet<>(Comparator.comparing(City::getName));\n\
    ```\n- 如果元素实现了 `Comparable` 接口，则使用 `compareTo()` 方法按自然顺序排序。\n\n### Navigable Set\n\
    - `NavigableSet` 继承自 `SortedSet` 并定义了额外方法。\n- `NavigableSet` 可以按升序和降序两种顺序进行遍历。\n\
    - `TreeSet` 是 `NavigableSet` 接口的实现类之一。\n\n## 问题\n- 你可以在 `Set` 中添加重复元素吗？\n- 当不需要排序时，你应该使用哪种集合类型？为什么？\n\
    - 你可以向 `Set` 添加 `null` 元素吗？\n- 你应该使用哪个 `Set` 类来维护插入顺序？\n- 如果在 `Set` 中再次插入相同的元素，排序会发生什么？它会保持原始位置还是插入到末尾？\n\
    - 你应该使用哪个 `Set` 类来确保元素的顺序？\n- 当你需要双向方向遍历时，你应该使用哪个 `Set` 类？\n\n## LIST\n- `List`\
    \ 是对象的对象的有序集合。\n- `List` 可以有重复元素。\n- `List` 可以有多个 `null` 元素。\n- 在 `List` 中，元素可以添加到任何位置。\n\
    - 使用 `ListIterator`，列表可以正向和反向两个方向进行迭代。\n```java\n// 创建一个城市列表\nList<String> cities\
    \ = new ArrayList<>();\n```\n\n### ArrayList\n- `ArrayList` 基于数组。\n- 如果你频繁访问元素，它的性能更好。\n\
    - 在 `ArrayList` 中添加和删除较慢。如果在任何位置（末尾除）添加元素，需要移动元素。如果添加的元素超过了容量，则会将整个数组复制到新分配的地方。\n\
    \n### Linked List\n- `LinkedList` 基于列表。\n- `LinkedList` 访问元素较慢，且只允许顺序访问。\n- 在\
    \ `LinkedList` 中添加和删除元素更快。\n- `LinkedList` 比 `ArrayList` 消耗更多内存，因为它保留了指向相邻元素的指针。\n\
    \n### List Iterator\n- `ListIterator` 在两个方向上迭代列表。\n```java\n// 全量列表迭代器\nListIterator<String>\
    \ fullIterator = cityList.listIterator();\n// 部分列表迭代器，从索引 3 开始\nListIterator<String>\
    \ partialIterator = cityList.listIterator(3);\n```\n\n### Notes\n- `ArrayList`\
    \ 的随机访问性能更好，因为它为元素维护了基于索引的系统，而 `LinkedList` 的开销更大，因为它需要遍历所有元素。\n\n## 问题\n- 你可以向\
    \ `List` 添加重复元素吗？\n- 你可以向列表添加 `null` 元素吗？\n- 在什么情况下你会使用 `ArrayList`：频繁添加/更新还是频繁读取？\n\
    - 在什么情况下你会使用 `LinkedList`：频繁添加还是频繁读取？\n- `ArrayList` 和 `LinkedList` 之间，哪一个消耗更多内存？\n\
    - `ArrayList` 和 `LinkedList` 之间，哪一个适合随机访问？\n\n## Queue\n- `Queue` 是在处理前持有元素的集合。\n\
    - `Queue` 有两个端：头和尾。\n- `Queue` 以先进先出 (FIFO) 的方式工作。\n\n### Types of Queues\n- `Deque`\
    \ - 允许从两端操作的队列。\n- `BlockingQueue` - 在满时阻塞添加，在空时阻塞移除。\n- `Transfer Queue` - 在线程之间传输数据的特殊*阻塞队列*。\n\
    - `BlockingDeque` - `Deque` 和 `BlockingQueue` 的结合。\n- `Priority queue` - 按优先级移除元素。\n\
    - `Delay queue` - 在关联的延迟后允许移除。\n\n### Basic Queue\n- `Queue` 有一个入口点（尾）和一个出口点（头）。\n\
    - 如果入口和出口点相同，则它是后进先出 (LIFO) `queue`。\n```java\n// 简单队列\nQueue<String> queue =\
    \ new LinkedList<>();\n```\n\n### Priority Queue\n- 在 `PriorityQueue` 中，优先级与元素相关。\n\
    - 下一个移除优先级最高的元素。\n- `PriorityQueue` 不允许 `null` 元素。\n- 队列元素实现 `Comparable` 接口或使用\
    \ `Comparator` 对象计算优先级。\n```java\n// City 实现 Comparable 接口\nQueue<City> pq = new\
    \ PriorityQueue<>();\n```\n\n### Deque\n- `Deque` 允许从两端插入和移除。\n- `Deque` 不提供对元素的索引访问。\n\
    - `Deque` 继承 `Queue` 接口。\n```java\n// 创建一个 Deque\nDeque<String> deque = new LinkedList<>();\n\
    ```\n\n### Blocking Queue\n- `BlockingQueue` 接口继承自 `Queue`。\n- `BlockingQueue`\
    \ 设计为线程安全的。\n- `BlockingQueue` 设计用于生产者消费者队列。\n\n### Transfer Queue\n- `TransferQueue`\
    \ 扩展 `BlockingQueue`。\n- 它可能是有界的，`生产者` 可能等待空间可用和/或 `消费者` 可能等待元素可用。\n```java\n\
    // 传输队列\nTransferQueue<String> ltq = new LinkedTransferQueue<String>();\n\n##\
    \ 问题\n- `Queue` 的目的是什么？\n- `Deque` 和 `Queue` 有什么不同？\n- 什么是优先级队列？\n- 从优先级队列中移除元素的标准是什么？\n\
    - 什么是延迟队列？\n- 哪种队列是线程安全的队列？\n- 哪种队列实现了生产者消费者模式？\n\n"
- fmt: "\n* Explain difference between `Blocking Queue` and `Transfer Queue`?\n\n\
    * Which Queue is capacity bounded to allows only the specified number of elements\
    \ in `Queue`? What happens if you try to put more than its capacity?\n\n# Map\n\
    \n* `Map` contain key-value mapping.\n\n* Usually `Map` allow one `null` as its\
    \ key and multiple `null` as values, but its left to the `Map`'s implementation\
    \ class to define restrictions.\n\n## Implementation\n\n### HashMap\n\n* `HashMap`\
    \ is based on hash table.\n\n* `HashMap` does not guarantee order of the elements\
    \ in map.\n\n* `HashMap`'s hash function provides constant-time performance for\
    \ `get` and `put` operations.\n\n* `HashMap` allows one `null` for the key and\
    \ multiple `null` for the value.\n\n```java\n// Create a map using HashMap Map<String,\
    \ String> hashMap = new HashMap<>();\n```\n\n### LinkedHashMap\n\n* `LinkedHashMap`\
    \ is hash table and linked list implementation of `Map` interface.\n\n* `LinkedHashMap`\
    \ stores entry using doubly linked list.\n* Use `LinkedHashMap` instead of `HashSet`\
    \ if insertion order is to be maintained.\n* Performance of `HashMap` is slightly\
    \ better than `LinkedHashMap` as `LinkedHashMap` has to maintain linked list too.\n\
    * It ensures iteration over entries in its insertion order.\n\n```java\n// LinkedHashMap\
    \ LinkedHashMap lhm = new LinkedHashMap();\n```\n\n### WeakHashMap\n\n* `WeakHashMap`\
    \ stores only weak references to its keys.\n* `WeakHashMap` supports both `null`\
    \ key and `null` value.\n* When there is no reference to keys, they become candidate\
    \ for garbage collection.\n\n```java\n// WeakHasMap Map map = new WeakHashMap();\n\
    ```\n\n### Sorted Map\n\n* `SortedMap` provides complete ordering on its keys.\n\
    * Sorts map entries on keys based either on natural sort order (`Comparable`)\
    \ or custom sort order (`Comparator`).\n* `SortedMap` interface inherits from\
    \ `Map`.\n\n```java\n// sorted map SortedMap<String,String> sm = new TreeMap<>();\n\
    ```\n\n### Navigable Map\n\n* `NavigableMap` extends the `SortedMap` interface.\n\
    * `TreeMap` class is implementation of `NavigableMap`.\n* `NavigableMap` can be\
    \ accessed in both, ascending and descending order.\n* It supports navigation\
    \ in both direction and getting closest match for the key.\n\n```java\n// Create\
    \ a Navigable Map NavigableMap<String,String> nm = new TreeMap<>();\n```\n\n###\
    \ Concurrent Map\n\n* `ConcurrentHashMap` is concrete implementation of `ConcurrentMap`\
    \ interface.\n* `ConcurrentMap` uses fine-grained synchronization mechanism by\
    \ partitioning the map into multiple buckets and locking each bucket separately.\n\
    * `ConcurrentHashMap` does not lock the map while reading from it.\n\n```java\n\
    // Create a Concurrent Map ConcurrentMap<String,String> cm = new ConcurrentHashMap<>();\n\
    ```\n\n## Notes\n\n* The `Map` keys and `Set` items must not change state, so\
    \ these must be immutable objects.\n* To avoid implementation of `hashCode()`\
    \ and `equals()`, prefer using immutable classes provided by JDK as key in `Map`.\n\
    * Never expose collection fields to the caller, instead provide methods to operate\
    \ on those.\n* `HashMap` offers better performance for inserting, locating and\
    \ deleting elements in a map.\n* `TreeMap` is better if you need to traverse the\
    \ keys in a sorted order.\n\n# Questions\n\n* How Map is different from other\
    \ collections?\n* Can you add a null value as key to a Map?\n* Can you guarantee\
    \ ordering of elements in `HashMap`?\n* How `HashMap` is able to provide constant-time\
    \ performance for `get` and `put` operations?\n* What is the difference between\
    \ `HashMap` and `LinkedHashMap`?\n* If insertion order is to be maintained, which\
    \ one would you use: `LinkedHashMap` or `HashSet`? Why?\n* What are `WeakHashMap`?\n\
    * When you want to maintain ordering of key, which Map class would you use?\n\
    * Which Map class would you use to access it in both ascending and descending\
    \ order?\n* Which Map implement is optimized for thread safety?\n* How does `ConcurrentHashMap`\
    \ implements scalability, still maintaining a good performance?\n* Why the key\
    \ used for Map and the value used for Set should be of immutable type?\n* What\
    \ are the disadvantages of exposing internal collection object to the caller?\n\
    * Which collection is best if you want to traverse the collection in sorted order?\n\
    \n# Algorithms\n\n* `Sorting` - is used to sort collection in ascending or descending\
    \ order. You can either use the natural order, if the `key` class has implemented\
    \ `Comparable` interface, or need to pass the `Comparator` object for custom sorting.\n\
    * `Searching` - `BinarySearch` algorithm is used to search keys.\n* `Shuffling`\
    \ - it re-orders the elements in the list in random order, generally used in games.\n\
    * `Data Manipulation` - `reverse`, `copy`, `swap`, `fill` and `addAll` algorithms\
    \ are provided to perform usual data manipulation on collection elements.\n* `Extreme\
    \ Value` - `min` and `max` algorithms are provided to find the minimum and maximum\
    \ values in the specified collection.\n\n## Questions\n\n* What are the different\
    \ algorithms supported by the collection framework?\n* Which search algorithm\
    \ is used to search keys?\n* How is the shuffling algorithm used?\n\n## Comparable\
    \ vs Comparator\n\n* `Comparable` interface is implemented to sort the collection\
    \ elements in natural order and `Comparator` object is used to perform custom\
    \ sort.\n* If an element implements `Comparable`, then `compareTo()` method is\
    \ used for order.\n* `Comparator` object is used to perform custom sorting.\n\n\
    ```java\n// Comparable interface implementation\n@Override public int compareTo(Employee\
    \ employee) {\n    // comparison logic\n}\n```\n\n```java\n// Using Comparator\
    \ object\nSortedSet<City> sortedCitiesByName = new TreeSet<>(Comparator.comparing(City::getName));\n\
    ```\n\n* `Comparator` generally used when you do not have complete control over\
    \ the class.\n\n## Questions\n\n* What is the difference between `Comparable`\
    \ Interface and `Comparator` Class?\n* When would you implement `Comparable` Interface\
    \ to sort a collection?\n* When do you use `Comparator` Class to sort a collection?\n\
    \n# hashCode() and equals()\n\n* `HashTable`, `HashMap` and `HashSet` uses `hashCode()`\
    \ and `equals()` methods to calculate and compare objects that are used as key.\n\
    * All classes in Java inherit the base hash scheme from `java.lang.Object` base\
    \ class, unless they override the `hashCode()` method.\n* Any class that overrides\
    \ `hashCode()` method is supposed to override `equals()` method too.\n\n## Implementation\
    \ of hashCode() and equals()\n\n```java\nfinal public class Employee {\n    final\
    \ private int id;\n    final private String name;\n    final private String department;\n\
    \n    @Override public boolean equals(Object o) {\n        if (this == o) return\
    \ true;\n        if (o == null || getClass() != o.getClass()) return false;\n\
    \        Employee employee = (Employee) o;\n        if (id != employee.id) return\
    \ false;\n        if (name != null ? !name.equals(employee.name) : employee.name\
    \ != null) return false;\n        return !(department != null ? !department.equals(employee.department)\
    \ : employee.department != null);\n    }\n\n    @Override public int hashCode()\
    \ {\n        int result = id;\n        result = 31 * result + (name != null ?\
    \ name.hashCode() : 0);\n        result = 31 * result + (department != null ?\
    \ department.hashCode() : 0);\n        return result;\n    }\n}\n```\n\n## Rules\
    \ of hashCode and equals\n\n* Once an object is created, it must always report\
    \ the same hash-code during its lifetime.\n* Two equal objects of same class must\
    \ return the same hash-code.\n"
