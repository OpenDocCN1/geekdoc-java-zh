  trans: "\n\n# CyclicBarrier\n\n```java\n// 有五个线程的 barrier\nCyclicBarrier barrier\
    \ = new CyclicBarrier(5);\n}\n```\n\n* `Barrier` 之所以被称为循环，是因为在对其调用 `reset()` 方法后可以重复使用。\n\
    * 可以将操作传递给 `CyclicBarrier`，当所有线程到达屏障点时执行。\n\n```java\n// 带有要执行操作的 barrier\n//\
    \ 在屏障点执行。\nCyclicBarrier barrier = new CyclicBarrier(5, () -> {\n    // 屏障点操作代码。\n\
    });\n```\n\n* 如果任何线程提前终止，则在屏障点等待的所有线程也将退出。\n* 当你将一个操作分为在单独线程上的多个任务，并在等待所有任务完成后再继续时，通常会使用\
    \ Barrier。\n\n### 问题\n* 解释一下 Barrier 同步器器吗？\n* 你可以再次使用同一个 Barrier 对象吗？如何实现？\n\
    * 如果其中一个线程死亡，其他在 Barrier 处等待的线程会发生什么？\n* 你会在什么样的工作中使用 Barrier？\n\n# Semaphore\n\
    \n* `Semaphore` 维护了指定数量的许可以访问 `Critical Section`（临界区）。\n\n```java\n// 创建带有四个许可的\
    \ Semaphore\n// 用于四个线程\nSemaphore semaphore = new Semaphore(4);\n```\n\n* 要获取许可，使用\
    \ `acquire()` 方法。每次调用 `acquire()` 方法都会阻塞，直到许可可用。\n* 要释放许可，使用 `release()` 方法。\n\
    * 许可可以由获取它的之外的其他线程释放。\n* 如果调用 `release()` 的次数多于 `acquire()`，则对于每个这样的额外释放调用，都会增加一个额外的许可。\n\
    * 如果你想获取互斥锁，请用一个许可初始化 `Semaphore`。\n* Semaphore 通常用于允许对昂贵资源进行受限访问。\n\n### 问题\n\
    * 解释一下 Semaphore 同步器吗？\n* 如果你调用 `release()` 的次数超过 `acquire()`，会发生什么？\n* 当你调用 `acquire`\
    \ 但许可不可用时会发生什么？\n* 如何使用 Semaphore 获取互斥锁？\n* 你在哪里使用 Semaphore？\n\n# Phaser\n\n\
    * 与其他 barrier 不同，注册到 `Phaser` 上的参与者数量可以随时间动态变化。\n\n```java\n// 有四个注册参与者的 Phaser\n\
    Phaser phaser = new Phaser(4);\n```\n\n* `phaser` 也可以再次重复使用。\n* 使用 `register()`\
    \ 方法注册一个参与者。\n* 当给定阶段的最后一个参与者到达时，可以执行一个可选操作，然后 `Phaser` 推进到下一个阶段。\n* 使用 `arriveAndAwaitAdvance()`\
    \ 方法在进入下一个阶段之前等待所有参与者到达。\n* `Phasers` 监控已注册、已到达和未到达的参与者的计数。即使是不是注册参与者的调用者也可以监控一个\
    \ Phaser 上的这些计数。\n* 参与者可以使用 `arriveAndDeregister()` 方法取消注册，从而不再移动到下一个阶段。\n\n###\
    \ 问题\n* 解释一下 Phaser 同步器吗？\n* 注册到 Phaser 的参与者数量可以随时间动态变化吗？\n* 你可以再次使用同一个 Phaser\
    \ 对象吗？\n* 你可以使用某些外部对象通过 Phaser 监控注册参与者的计数吗？\n* 就可以注册的参与者数量而言，Semaphore 和 Phaser\
    \ 有什么区别？\n\n# Exchanger\n\n* `Exchanger` 让两个线程在同步点等待对方交换元素。\n\n```java\n// 交换字符串数组\n\
    Exchanger<ArrayList<String>> exchanger = new Exchanger<ArrayList<String>>();\n\
    ```\n\n* Exchangers 使用 `exchange()` 方法交换信息。\n\n```java\n// 交换数据的 exchanger\nobjectToExchange\
    \ = exchanger.exchange(objectToExchange);\n```\n\n* 在 `exchange()` 上，`consumer`\
    \ 清空要交换的对象，并等待 `producer` 再次用完整的对象交换。\n\n### 问题\n* 解释一下 Exchanger 同步器吗？\n* Exchanger\
    \ 对象需要多少线程？\n* Exchanger 同步器的主要目的是什么？\n* Exchanger 同步器是每次都使用同一个对象进行交换，还是可以使用不同的对象？\n\
    \n# Latch\n\n* `Latch` 让一组线程等待直到一组操作完成。\n* `Latch` 不能被重复使用。\n* `CountDownLatch`\
    \ 类提供了 `Latch` 的实现。\n* 所有调用 `await()` 方法的线程都会等待，直到 `countDown()` 被调用的次数等于设置的计数器次数。\n\
    \n```java\n// 创建一个带有五个计数器的计数锁\nCountDownLatch cdl = new CountDownLatch(5);\n//\
    \ 在线程任务完成后对 latch 计数减\ncdl.countDown();\n// 等待计数减信号\ncdl.await();\n```\n\n###\
    \ 问题\n* 解释一下 Latch 同步器吗？\n* 你可以再次使用同一个 Latch 对象吗；像 Barrier 和 Phaser 那样？\n* 向 Latch\
    \ 发送任务完成的机制是什么？\n\n# Executor Framework\n\nExecutor 框架提供了在线程上执行一组相关任务的基础设施。\n\
    它负责管理以下内容：\n* 创建和销毁线程。\n* 为任务维持最优数量。\n* 任务的并行和顺序执行。\n* 任务提交与任务执行的隔离。\n* 控制任务执行相关的策略。\n\
    \n```java\n// Executor 接口定义\npublic interface Executor { void execute (Runnable\
    \ command); }\n```\n\n### 问题\n* 解释一下 Executor 框架？\n* Executor 框架有哪些各种功能？\n\n#\
    \ Executor Service\n\n* `ExecutorService` 继承自 `Executor` 接口，提供了以下额外方法。\n    *\
    \ `shutdown()` - 在提交任务后关闭执行器。\n    * `shutdownNow()` - 中断当前任务并丢弃等待的任务。\n    *\
    \ `submit()` - 将任务提交给 `Executor`。\n    * `awaitTermination()` - 等待现有任务终止。\n* `ExecutorService`\
    \ 提供 `Future` 对象来跟踪执行任务的进度。\n* 提交到 `Executor` 的所有任务都会队列，由线程池线程执行。\n\n```java\n\
    // 创建带有五个线程的 Executor\nExecutorService exec = Executors.newFixedThreadPool(5);\n\
    ```\n\n* 要创建单线程线程池，使用 `newSingleThreadExecutor()` 方法。\n\n# 处理结果\n\n* `Runnable`\
    \ 接口的 `run()` 方法不能返回结果或抛出异常。\n* 可以返回结果的任务是 `Callable` 接口的实例。\n\n```java\n// 任务可以通过\
    \ Callable 返回结果\npublic interface Callable<V> { V call() throws Exception; }\n\
    ```\n\n* `submit()` 返回 `Future` 对象有助于跟踪任务。\n\n```java\n// ExecutorService 示例\n\
    public class ExecService {\n    public static void main(String[] args) throws\
    \ ExecutionException, InterruptedException {\n        // 创建带有五个线程的执行\n       \
    \ ExecutorService exec = Executors.newFixedThreadPool(5);\n        // 将可调用任务提交给执行器\n\
    \        Future<String> task = exec.submit(new Callable<String>() {\n        \
    \    @Override public String call() throws Exception {\n                //某些逻辑\n\
    \                return null;\n            }\n        });\n        // 等待结果\n \
    \       String result = task.get();\n        // 关闭执行器\n        exec.shutdown();\n\
    \    }\n}\n```\n\n* 如果任务执行期间发生任何异常，调用 `ExecutorService` 上的 `get()` 方法将抛出 `ExecutionException`\
    \ 实例。\n\n# 调度任务\n\n* `ScheduledExecutorService` 可用于调度未来运行的任务。\n* 调度任务的方法：\n  \
    \  * `schedule(task, delayTime, TimeUnit.SECONDS)`\n    * `scheduleAtFixedRate(task,\
    \ delayTime, repeatPeriod, TimeUnit.SECONDS)`\n    * `scheduleWithFixedDelay(task,\
    \ delayTime, fixedDelay, TimeUnit.SECONDS)`\n\n# ExecutorCompletionService\n\n\
    * `ExecutorCompletionService` 使用 `Executor` 来执行任务。\n* `Executor` 的 `CompletionService`\
    \ 可用于从多个任务中获取结果。\n\n"
- fmt: "\n`ExecutorCompletionService` provides concrete implementation for `CompletionService`.\n\
    \n```java\n// Create executor with five threads\nExecutorService es = Executors.newFixedThreadPool(5);\n\
    \n// ExecutorCompletionService returns an object\nExecutorCompletionService<Result>\
    \ cs = new ExecutorCompletionService<>(es);\n\n// submit task to ExecutorCompletionService\n\
    cs.submit(longTask);\n\n// get the result of task\nFuture<Result> completedTask\
    \ = cs.take();\n```\n\n### Notes\n\n- Always associate context-based names to\
    \ the threads, it immensely helps in debugging.\n- Always exit gracefully, by\
    \ calling either `shutdown()` or `shutdownNow()` based on your use case.\n- Configure\
    \ thread pool for the `ExecutorService` such that the number of threads configured\
    \ in the pool are not significantly greater than the number of processors available\
    \ in the system.\n- You should query the host to find the number of processor\
    \ to configure thread pool.\n```java\nRuntime.getRuntime().availableProcessors();\n\
    ```\n\n### Questions\n\n- Explain `ExecutorService`?\n- How can you track progress\
    \ and status of executing task?\n- Does Executor service use dedicated threads\
    \ to execute queued tasks?\n- Can you use `Runnable` object with the `ExecutorService`?\
    \ Why?\n- How do you find if an exception is thrown in the `ExecutorService`?\n\
    - Can you schedule a task to run in future with the `ExecutorService`?\n- With\
    \ `ExecutorService`, how can you get results from multiple tasks?\n- What is the\
    \ difference between `submit()` and `execute()` methods of `ExecutorService`?\n\
    \    - If you use `submit()`, you can get any exception thrown by calling `get()`\
    \ method on `Future`; whereas, if you use `execute()`, exception will go to `UncaughtExceptionHandler`.\n\
    - How can you exit gracefully from `ExecutorService`?\n- What should be the criteria\
    \ for configuring thread pool size? How can you set that?\n\n### Fork-Join\n\n\
    - Fork-Join framework takes advantage of multi-processors and multi-cores systems.\
    \ \n- It divides the tasks into sub-tasks to execute in parallel.\n- `fork()`\
    \ method spawns a new sub-task from the task.\n```java\n// spawn subtask\nsubTask.fork();\n\
    ```\n- `join()` method lets the task wait for other task to complete.\n```java\n\
    // wait for subtask to complete\nsubTask.join();\n```\n\n### Important classes\
    \ in Fork-Join\n\n- `ForkJoinPool` - thread pool class is used to execute subtasks.\n\
    - `ForkJoinTask` - manages subtask using `fork()` and `join()` methods.\n- `RecursiveTask`\
    \ - task that yields result.\n- `RecursiveAction` - task that does not yield result.\n\
    - Both, `RecursiveTask` and `RecursiveAction` provides abstract `compute()` method\
    \ to be implemented by the class, whose object represents the `ForkJoin` task.\n\
    \n### Questions\n\n- Explain Fork-Join framework in Java?\n- How Fork-Join framework\
    \ helps to optimize task execution?\n- What is the difference between `RecursiveTask`\
    \ and `RecursiveAction`?\n\n## REFLECTION\n\n### Reflection\n\n`Reflection` is\
    \ used to examine the code runtime and possibly modify the runtime behaviour of\
    \ an application.\n\n#### Purpose of reflection\n\n`Reflection` must be used only\
    \ for special purpose problem solving and only when information is not publicly\
    \ available. Class members are marked private for reasons. Few of the popular\
    \ usage of reflection in day to day development includes following:\n\n- Reflection\
    \ facilitates modular software development by investigating code and libraries\
    \ at runtime, to plugin classes and components. \n- Annotations are read using\
    \ reflection. `JUnit` uses reflection to discover methods to setup and test.\n\
    - Debuggers uses reflection to read private members of the class.\n- IDEs use\
    \ reflection to enumerate class members and probe code.\n- Object relational mappers\
    \ use reflection to create objects from data.\n- Dependency Injection framework\
    \ like `Spring` uses reflection to resolve dependencies.\n\n#### Usage\n\nThe\
    \ code below demonstrates use of reflection to access `private field` of class\
    \ `Account`.\n\n```java\npublic class Account { \n    private float rate = 10.5f;\n\
    }\n\npublic static void main(String [] args) throws IllegalAccessException {\n\
    \    Account account = new Account();\n    Class<? extends Account> refClass =\
    \ account.getClass();\n    // get all the field\n    Field [] fields = refClass.getDeclaredFields();\n\
    \    for(Field field : fields){\n        // no more private \n        field.setAccessible(true);\n\
    \        System.out.print(field.get(account));\n    }\n}\n```\n\n### Questions\n\
    \n- What is reflection?\n- What are the different scenarios where reflection can\
    \ be used?\n- How does debuggers use reflection?\n- How does reflection helps\
    \ in creating modular software architecture?\n- Can you access private members\
    \ using reflection?\n- Give some examples, where reflection is used by libraries,\
    \ tools and frameworks?\n\n### Drawbacks of reflection\n\n`Reflection` must be\
    \ used only when something is not publicly available and there is a very compelling\
    \ reason; otherwise you must review your design. \n\n#### Drawbacks\n\n- Reflection\
    \ does not have compile time checking, any change in member's name will break\
    \ the code.\n- Reflection violates encapsulation as it reveals the internal data\
    \ structures.\n- Reflection violates abstraction as it reveals the internal implementation\
    \ and provides an ability to bypass validations applied to the members.\n- Reflection\
    \ is slow, as it has additional overhead at runtime to resolve the members.\n\n\
    ### Questions\n\n- When should you use reflection?\n- How does reflection violate\
    \ encapsulation?\n- How does reflection violate abstraction?\n- Why reflection\
    \ is slow?\n- Why reflection code break?\n\n## DATA EXCHANGE\n\n### JSON\n\n`JavaScript\
    \ Object Notation`, or `JSON` has become extremely popular for the interchange\
    \ in the last few years. Now it's not just an alternative to XML but a successor\
    \ to it. With the evolution of Big Data and Internet of Things, along JSON's ability\
    \ to be easily parsed to JavaScript object, it has become preferred format for\
    \ the web. Following are the few primary factors behind this.\n\n- It's interoperable,\
    \ as it's restricted to primitive data types only.\n- It's lightweight and less\
    \ verbose than XML.\n- It's very easy to serialize and transmit structured data\
    \ over network.\n- Almost all modern languages support it.\n- JavaScript parser\
    \ in all the web browsers supports it.\n\n#### JSON Structures\n\nJSON structures\
    \ can be categorized as JSON Object and JSON array.\n\n##### JSON Object\n\nJSON\
    \ object is simply a name-value pair separated by a comma. Name is always a string.\n\
    \n![Image](OEBPS/Images/image0019.jpeg)\n\n##### JSON Array\n\nJSON Array is an\
    \ ordered collection of values. Value can be a string, a number, an object or\
    \ an array itself.\n\n![Image](OEBPS/Images/image0020.jpeg)\n\n### Questions\n\
    \n- What is JSON?\n- What are significant differences between JSON and XML?\n\
    - Why JSON has become preferred format for integration with the web?\n- Explain\
    \ the difference between JSON Object and JSON Array?\n\n## MEMORY MANAGEMENT\n\
    \n### Stack vs Heap\n\n- `Stack` is memory associated with each system thread\
    \ when it's created; whereas, heap is shared by all the threads in an application.\
    \ \n- For each function the thread visits, a block of memory is allotted on the\
    \ top of stack - for local variables and bookkeeping data, which gets freed when\
    \ that function returns, in a LIFO order. In contrast, the allocation of memory\
    \ in Heap is relatively random with no enforced pattern, and variables on heap\
    \ are destroyed manually. \n- When the thread exists, stack associated with the\
    \ thread is reclaimed. When the application process exists, heap memory is reclaimed.\n\
    - Allocating and freeing stack memory is simpler and quicker, it's as simple as\
    \ adjusting pointers. Allocating and freeing memory is comparatively complex in\
    \ Heap, as there is no fixed pattern of memory allocation.\n"
