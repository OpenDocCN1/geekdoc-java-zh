  trans: "\n\n- 如果我们从上述方法中移除 `<T>`，会导致编译错误，因为它代表了泛型方法中类型参数的声明。\n- 拥有泛型方法的类型（类或接口）不需要是泛型类型。\n\
    - 在调用泛型方法时，我们不需要显式指定类型参数。\n\n### 注意事项\n- 优先使用泛型（Generics）和参数化类/方法来强制编译时类型安全。\n\
    - 使用边界类型参数（Bounded Type parameter）来增加方法参数的灵活性，同时它也有助于限制可以使用的类型。\n\n### 问题\n- 解释什么是泛型方法？\n\
    - 你可以在非泛型类型中添加泛型方法吗？\n- 将边界类型定义为方法参数的处是什么？\n- 泛型是如何强制执行编译类型安全的？\n\n# Java 泛型 vs\
    \ Java 数组 (Java Generics vs Java Array)\n\n## Java Generics (Java Generics)\n\n\
    考虑以下层级结构：\n\n![Image](img/image00215.jpeg)\n\n由于 `Car` 和 `Bike` 均派自 `Vehicle`，是否可以将\
    \ `List<Car>` 或 `List<Bike>` 赋值给 `List<Vehicle>` 变量？\n\n实际上不能，`List<Car>` 或 `List<Bike>`\
    \ 不能替换为 `List<Vehicle>`，因为你不能在一个包含汽车的列表中放入一辆自行车。所以，即使 `Bike` 是一个 `Vehicle`，它也并不是一个\
    \ `Car`。\n\n```java\nList<Bike> bikes = new ArrayList<Bike>();\n// 假设这是允许的\nList<Vehicle>\
    \ vehicles = bikes; \nvehicles.add(new Car());\n\n//  Error - Bike 和 Vehicle 被认为是不兼容的类型。\n\
    Bike bike = vehicles.get(0); \n```\n\nJava 编译器会在编译时对这些不兼容的类型进行检查。更多信息请参考 类型擦除。\n\
    \n## Java Array (Java Array)\n\n然而，与泛型不同，`Car` 数组可以赋值给 `Vehicle` 数组：\n\n```java\n\
    Car[] cars = new Car[3]; \nVehicle [] vehicles = cars;\n```\n\n对于数组，尽管编译器允许上述代码编译，但当你运行这段代码时，会得到\
    \ `ArrayStoreException`。\n\n```java\n// 这将导致 ArrayStoreException\nvehicles[0]\
    \ = new Bike();\n```\n\n所以，即使编译器没有捕获此问题，运行时类型系统捕获了它。数组是可实例化类型（reifable types），这意味着运行时感知感知其类型。\n\
    \n### 问题\n- 什么是可实例化类型（reifable types）？\n- 为什么不能将子类型的泛型集合对象赋值给父类型的泛型集合对象？\n- 为什么允许将子类型的数组对象赋值给父类型的数组对象？Java\
    \ 数组比泛型更具多态性吗？\n\n# Type Erasure (类型擦除)\n\n对于 Java 泛型类型，由于被称为 `type erasure` 的过程，Java\
    \ 编译器会丢弃类型信息，这些信息在运行时是不可用的。由于类型信息在运行时不可用，Java 编译器会格外小心在编译阶段就阻止你，防止任何堆污染。\n\n泛型类型也属于非可实例化类型（`non-reifiable`），这意味着它的类型信息在编译期间被移除了。\n\
    \n### 问题\n- 什么是非可实例化类型？\n- 什么是类型擦除？\n- 如果没有类型擦除会发生什么？\n\n# Co-variance (协变)\n\n\
    `Covariance`（协变）是一种概念，你可以从带有上限类型通配符定义的泛型中读取项，但不能向集合中写入任何内容。\n\n考虑以下带有上限类型通配符的声明：\n\
    \n```java\nList<? extends Vehicle> vehicles = new ArrayList<Bike>(); \n```\n\n\
    你允许从 `vehicles` 泛型集合中读取，因为列表中存在的任何内容都是 `Vehicle` 的子类，并且可以向上转换为 `Vehicle`。\n\n\
    ```java\nVehicle vehicle = vehicles.get(0);\n```\n\n然而，你不允许向协变结构中放入任何内容。\n\n```java\n\
    // 这是编译错误\nvehicles.add(new Bike());\n```\n\n这是不允许的，因为 Java 无法保证泛型结构中对象的实际类型。它可以是任何扩展\
    \ `Vehicle` 的类型，但编译器无法确定。所以你可以读取，但不能写入。\n\n### 问题\n- 解释什么是协变？\n- 为什么不能向带有上限类型通配符定义的泛型中添加子类元素？\n\
    \n# Contra-variance (逆变)\n\n`Contra-variance`（逆变）是一种概念，你可以向带有下界类型通配符定义的泛型中写入项，但不能从集合中读取任何内容。\n\
    \n考虑以下带有下界类型通配符的声明：\n\n```java\nList<? super Car> cars = new ArrayList<Vehicle>();\n\
    ```\n\n在这种情况下，尽管 ArrayList 是 `Vehicle` 类型，你也可以通过逆变向其中添加 `Car`；因为 `Car` 派生自 `Vehicle`。\n\
    \n```java\ncars.add(new Car());\n```\n\n然而，你不能假设你会从这个逆变结构中获得一个 `Car` 对象。\n\n```java\n\
    // 这是编译错误\nCar vehicle = cars.get(0);\n```\n\n### 问题\n- 解释什么是逆变？\n- 为什么不能从带有下界类型通配符定义的泛型中读取元素？\n\
    \n# Co-variance vs Contra-variance (协变 vs 逆变)\n\n- 当你只打算从集合中读取泛型值时，使用 `covariance`（协变）；\n\
    - 当你只打算向集合中添加泛型值时，使用 `contra-variance`（逆变）；\n- 当你打算同时对集合进行读取和写入时，使用特定的泛型类型。\n\n\
    ### 问题\n- 你什么时候应该使用协变？\n- 你什么时候应该使用逆变？\n\n# COLLECTIONS (集合)\n\n## Collections\
    \ (集合)\n\n集合是创建任何生产级 Java 应用程序的基础构建块。面试官对理解与集合正确用法相关的不同方面感兴趣。\n\n问题通常用于检查面试者是否理解集合的正确用法以及是否了解可选的替代方案。\n\
    \n以下是关于集合的问题涉及：\n- Java 中的集合类型。\n- 不同集合类型的特性。\n- 同步集合。\n- 并发集合。\n- 集合元素的排序。\n\
    - 从集合读取的速度。\n- 写入集合的速度。\n- 集合元素的唯一性。\n- 集合间的操作。\n- 只读集合。\n- 集合遍历。\n\n## Collection\
    \ Fundamentals (集合基础)\n\n集合是一个将多个元素组合的容器。这是一个简单的集合示例：\n\n```java\n// 创建城市列表\n\
    List<String> cities = new ArrayList<>(); \n// 添加城市名称\ncities.add(\"London\");\
    \ \ncities.add(\"Edinburgh\"); \ncities.add(\"Manchester\");\n```\n\n### 注意事项\n\
    - 集合处理引用类型。\n- 所有的集合接口实现都是泛型的（Generic）。\n- 所有的集合类型都可以增长或缩小，与数组不同。\n- Java 提供了许多根据其用法操作集合的方法，因此在添加之前，始终检查已有的方法。\n\
    \n## Collection Framework (集合框架)\n\n集合框架由以下组件定义：\n\n- *Interfaces*（接口）：是为每个特定用法和集合类型定义的抽象类型。\n\
    - *Implementation*（实现）：是用于创建表示不同类型集合对象的具体实现类。\n- *Algorithms*（算法）：应用于这些集合，以执行各种计算并操作集合中的元素。\n\
    \n*Collection Framework*（集合框架）通过提供数据结构和对其操作的算法来减少编程工作量。\n\n### 问题\n- 解释集合？\n-\
    \ 集合和泛型有什么关系？\n- 你可以在基本类型上使用集合吗？\n- 你如何可以在基本类型使用集合？\n- 解释集合和数组的区别？\n- 集合框架的好处是什么？\n\
    - 集合框架的不同组件有哪些？\n\n"
- fmt: "\nAn interface defines its behaviour in the form of signature of methods it\
    \ defines. To use a collection, you should always write code against collection\
    \ interfaces and not class implementations, so that the code is not tied to a\
    \ specific implementation. This protects from possible changes in underlying implementation\
    \ class.\n\nFollowing are the most important interfaces that define collections\
    \ and their behaviour. Each child node below is inherited from its parent node.\n\
    \n- `Collection`\n    - `Queue`\n        - `BlockingQueue`\n        - `TransferQueue`\n\
    \        - `BlockingDeque`\n        - `Deque`\n- `BlockingDeque`\n    - `List`\n\
    \    - `Set`\n    - `SortedSet`\n    - `NavigableSet`\n- `Map`\n    - `SortedMap`\n\
    \n## Questions\n- Why should you write code against the collection interface and\
    \ not concrete implementation?\n\n## Collection Types\n- `Set` - `Set` contains\
    \ unique elements.\n- `List` - `List` is an ordered collection.\n- `Queue` - `Queue`\
    \ holds elements before processing in FIFO manner.\n- `Deque` - `Deque` holds\
    \ elements before processing in both, FIFO and LIFO manner.\n- `Map` - `Map` contains\
    \ mapping of keys to corresponding values.\n\n## Questions\n- What are the different\
    \ collection types?\n- Define `Set` collection Type?\n- Define `List` collection\
    \ Type?\n- Define `Queue` collection Type?\n- Define `Deque` collection Type?\n\
    - Define `Map` collection Type?\n- What is the difference between `Queue` and\
    \ `Deque`?\n\n## Set\n\n### Basic Set\n```java\n// Create a set\nSet<String> set\
    \ = new HashSet<>();\n```\n- `Set` is collection of unique elements.\n- Elements\
    \ in the `Set` are stored un-ordered.\n- Only one `null` element can be added\
    \ to a `Set`. (Wait, original text says only one `null`)\n- Duplicate elements\
    \ are ignored.\n- When ordering is not needed, `Set` is fastest and has smaller\
    \ memory footprint.\n\n### Linked Hashset\n```java\n// Create a linkedHashSet\n\
    Set<String> linkedHashSet = new LinkedHashSet<>();\n```\n- `LinkedHashSet` keeps\
    \ the `Set` elements in the same order in which they were inserted.\n- Insertion\
    \ order is not affected in `LinkedHashSet` if an element is re-inserted.\n- `Iterator`\
    \ in `LinkedHashSet` returns elements in the same order in which these were added\
    \ to the collection.\n\n### Sorted Set\n- `SortedSet` imposes ordering of elements\
    \ to be either sorted in a natural order by implementing `Comparable` interface\
    \ or custom sorted using `Comparator` object.\n- `TreeSet` is an implementation\
    \ class for the `SortedSet` interface.\n```java\n// Create a sorted set of city\
    \ names\nSortedSet<String> cityNames = new TreeSet<>();\n```\n- Use `Comparator`\
    \ object to perform custom sorting.\n```java\nSortedSet<City> sortedCitiesByName\
    \ = new TreeSet<>(Comparator.comparing(City::getName));\n```\n- If an element\
    \ implements `Comparable` interface, then `compareTo()` method is used to sort\
    \ in the natural order.\n\n### Navigable Set\n- `NavigableSet` inherits from the\
    \ `SortedSet` and defines additional methods.\n- `NavigableSet` can be traversed\
    \ in both, ascending and descending order.\n- `TreeSet` is one of the implementation\
    \ classes for `NavigableSet` interface.\n\n## Questions\n- Can you add duplicate\
    \ elements in a `Set`?\n- Which collection type should you use when ordering is\
    \ not a requirement? Why?\n- Can you add a `null` element to a `Set`?\n- Which\
    \ `Set` class should you use to maintain order of insertion?\n- What happens to\
    \ ordering, if same element is inserted again in a `Set`? Will it maintain its\
    \ original position or inserted at the end?\n- Which `Set` class should you use\
    \ to ensure ordering of the elements?\n- Which `Set` class should you use when\
    \ you need to traverse in both the directions?\n\n## LIST\n- `List` is an ordered\
    \ collection of objects.\n- `List` can have duplicate.\n- `List` can have multiple\
    \ `null` elements.\n- In `List`, an element can be added at any position.\n- Using\
    \ `ListIterator`, a list can be iterated in both, forward and backward direction.\n\
    ```java\n// Create a list of cities\nList<String> cities = new ArrayList<>();\n\
    ```\n\n### ArrayList\n- `ArrayList` is based on array.\n- It performs better if\
    \ you access elements frequently.\n- Add and remove is slower in the `ArrayList`.\
    \ If an element is added anywhere, but the end, requires shifting of element.\
    \ If elements are added beyond its capacity then the complete array is copied\
    \ to newly allocated place.\n\n### Linked List\n- `LinkedList` is based on list.\n\
    - `LinkedList` is slower in accessing elements and only sequential access allowed.\n\
    - Adding and removing elements from `LinkedList` is faster.\n- `LinkedList` consumes\
    \ more memory than `ArrayList` as it keeps pointers to its neighbouring elements.\n\
    \n### List Iterator\n- `ListIterator` iterates list in both the directions.\n\
    ```java\n// full list iterator\nListIterator<String> fullIterator = cityList.listIterator();\n\
    // partial list iterator, starts at index 3\nListIterator<String> partialIterator\
    \ = cityList.listIterator(3);\n```\n\n### Notes\n- Random access is better in\
    \ `ArrayList` as it maintains index based system for its elements whereas `LinkedList`\
    \ has more overhead as it requires traversal through all its elements.\n\n## Questions\n\
    - Can you add duplicate elements to a `List`?\n- Can you add `null` element to\
    \ a list?\n- In which scenarios would you use `ArrayList`: frequent add/update\
    \ or frequent reading?\n- In which scenarios would you use `LinkedList`: frequent\
    \ add/update or frequent reading?\n- Between `ArrayList` and `LinkedList`, which\
    \ one consumes more memory?\n- Between `ArrayList` and `LinkedList`, which one\
    \ would you prefer for random access?\n\n## Queue\n- `Queue` is a collection to\
    \ hold elements prior to processing.\n- `Queue` has two ends, a tail and a head.\n\
    - `Queue` works in FIFO manner, first in first out.\n\n### Types of Queues\n-\
    \ `Deque` - simple queue which allows insertion at tail and removal from head,\
    \ in both ends.\n- `BlockingQueue` - blocks the thread to add when full and also\
    \ blocks the thread to remove when empty.\n- `Transfer Queue` - special *blocking\
    \ queue* where data transfer happens between two threads.\n- `BlockingDeque` -\
    \ combination of `Deque` and `blocking queue`.\n- `Priority queue` - element with\
    \ highest priority is removed.\n- `Delay queue` - element is allowed to be removed\
    \ after delay associated with it has elapsed.\n\n### Basic Queue\n- `Queue` has\
    \ one entry point (tail) and one exit point (head).\n- If entry and exit point\
    \ is same, its LIFO (last in first out) `queue`.\n```java\n// simple queue\nQueue<String>\
    \ queue = new LinkedList<>();\n```\n\n### Priority Queue\n- In `PriorityQueue`,\
    \ a priority is associated with the elements in the queue.\n- Element with highest\
    \ priority is removed next.\n- `PriorityQueue` does not allow `null` element.\n\
    - Element of queue either implement `Comparable` interface or use `Comparator`\
    \ object to calculate priority.\n```java\n// City class implements Comparable\
    \ interface\nQueue<City> pq = new PriorityQueue<>();\n```\n\n### Deque\n- `Deque`\
    \ allows insertion and removal from both ends.\n- `Deque` does not provide indexed\
    \ access to elements.\n- `Deque` extends `Queue` interface.\n```java\n// Create\
    \ a Deque\nDeque<String> deque = new LinkedList<>();\n```\n\n### Blocking Queue\n\
    - `BlockingQueue` interface inherits from `Queue`.\n- `BlockingQueue` is designed\
    \ to be thread safe.\n- `BlockingQueue` is designed to be used as producer-consumer\
    \ queues.\n\n### Transfer Queue\n- `TransferQueue` extends `BlockingQueue`.\n\
    - It may be capacity bounded, where `Producer` may wait for space availability\
    \ and/or `Consumer` may wait for items to become available.\n```java\n// Transfer\
    \ Queue\nTransferQueue<String> ltq = new LinkedTransferQueue<String>();\n\n##\
    \ Questions\n- What is the purpose of `Queue`?\n- How's `Deque` different from\
    \ `Queue`?\n- What is priority queue?\n- What is the criterian to remove element\
    \ from priority queue?\n- What is a Delay Queue?\n- What is a Blocking Queue?\n\
    - Which Queue is a thread safe queue?\n- Which Queue implements Producer-Consumer\
    \ pattern?\n"
