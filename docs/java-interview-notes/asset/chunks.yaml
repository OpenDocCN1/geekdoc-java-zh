    \ class has no external dependencies; which is not practical in object oriented\
    \ software development, where you need to communicate with the external objects\
    \ to perform File IO, manage database access, communicate with web service, etc.\
    \ So the basic idea of `mocking` is to `replace these external dependencies with\
    \ mock objects` to isolate the object under test.\n\n### Benefits of mocking\n\
    * Mock object helps you to isolate and test only the conditional logic in the\
    \ class without testing its dependencies.\n* In mock object, you can implement\
    \ partial functionality required for the test without implementing the complete\
    \ dependency object.\n* You don't need to worry about understanding the internals\
    \ of dependency, which helps in faster development time.\n\n### Questions\n* What\
