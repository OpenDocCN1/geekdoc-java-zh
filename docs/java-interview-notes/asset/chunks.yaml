    \ to come out of wait?\n\nJoining Threads\n\nThreads are usually joined when there\
    \ is a dependency between the threads. The *join()* method of the target thread\
    \ is used to suspend the current thread. In such situations current thread cannot\
    \ proceed, until the target thread on which it depends, has finished execution.\n\
    \n*// main thread joined with the thread* public void main(String[] args) {\n\n\
    \ Thread thread1 = new Thread(\n\n ThreadMethodRef::\n\n *threadMethod*);\n\n\
    \ thread1.start();\n\n *// current thread waits *\n\n *// until thread1 completes*\n\
    \n *// execution* thread1.**join()**;\n\n}\n\nQuestions\n\n*   What is the purpose\
    \ of thread's join method?\n\n*   Why do you need to join two threads?\n\nAtomic\
    \ Classes\n\n*Atomic classes* provides ability to perform atomic operations on\
    \ primitive types, such that only one thread is allowed to change the value until\
    \ the method call completes. Atomic classes like *AtomicInteger* and *AtomicLong*\
    \ wraps the corresponding primitive types. There is one present for reference\
    \ type too, *AtomicReference*.\n\nThere is no need to provide *synchronized* access\
    \ to Atomic Class objects. Method *incrementAndGet()* is AtomicInteger is often\
    \ used in place of *pre and post increment operators*.\n\nQuestions\n\n*   What\
    \ are atomic classes?\n\n*   Why you don't require synchronizing access to an\
    \ object of atomic class?\n\n*   Why pre and post increment operator are not thread\
    \ safe?\n\n    *   *Pre and post operation are multiple operations under the hood;\
    \ read, increment and write. All the three are not synchronized together, so any\
    \ thread context switch that happens in between, will result into undesired result.*\n\
    \n*   What is the difference between Atomic and Volatile variables?\n\n    * \
    \  *Atomic variables provide atomic access even for the compound operation like\
    \ pre and post increment operation, which is not possible if variable is declared\
    \ as Volatile. Volatile just guarantees happen-before reads.*\n\nLock\n\n*   *Locking*\
    \ is a mechanism to control access to the shared resources in a multi-threaded\
    \ environment.\n\n*   *ReentrantLock* class implements *lock interface*.\n\n*\
    \   A lock can be acquired and released in different blocks of code.\n\n*   *Lock*\
    \ interface has method *tryLock()* to verify resource availability.\n\n*   As\
    \ a good practice, acquired lock must be released in the *finally* block . \n\n\
    *// Thread safe class*\n\npublic class SafeAccount {\n\n *// Create lock object*\
    \ private Lock lockObject =\n\n new ReentrantLock();\n\n public void addMoney()\
    \ {\n\n *// Acquire the lock* lockObject.**lock()**;\n\n try {\n\n *// add some\
    \ money logic here* } finally {\n\n *// Release the lock* lockObject.**unlock()**;\n\
    \n }\n\n }\n\n}\n\nQuestions\n\n*   Explain locking mechanism in a multi-threaded\
    \ environment?\n\n*   Do you need to acquire and release lock in same block of\
    \ code?\n\n*   Why should you prefer using tryLock() instead of lock()?\n\nReadWriteLock\n\
    \n*   *ReadWriteLock* maintains pair of associated locks, one for writing and\
    \ the other for read-only operations.\n\n*   Only one thread can acquire write\
    \ lock, but multiple threads can have read lock.\n\n*   *ReadWriterLock* interface\
    \ is implemented by *ReentrantReadWriteLock*.\n\n*// ReentrantReadWriteLock lock*\
    \ ReentrantReadWriteLock rwl =\n\n new **ReentrantReadWriteLock**();\n\n*// read\
    \ lock* Lock rl = rwl.**readLock()**;\n\n*// write lock* Lock wl = rwl.**writeLock()**;\n\
    \nQuestions\n\n*   What are the benefits of using ReadWriteLock?\n\n*   In which\
    \ scenario would you prefer ReadWriteLock to any other locking mechanism?\n\n\
    Synchronisers\n\nSynchronizers synchronizes multiple threads to protect a *Critical\
    \ Section*. \n\n***Sync***\n\n***Point Threads***      \n\n | ------------\n\n\
    \ | ----------------\n\n |  ----------\n\nSynchronizer Types\n\n*   Barriers\n\
    \n*   Semaphore\n\n*   Phasers\n\n*   Exchangers\n\n*   Latch\n\nQuestions\n\n\
    *   What is the purpose of synchronizers?\n\n*   What are the different types\
    \ of synchronizers available in Java?\n\nBarriers\n\n*   In *Barriers*, set of\
    \ threads waits for each other to arrive at barrier point before moving ahead.\n\
    \n*   *CyclicBarrier* is concrete implementation of the *Barrier* synchroniser. "
