    \ can dynamically change over time. \n\n*// Phaser with four registered parties*\
    \ Phaser phaser = new **Phaser**(4);\n\n*   A *phaser* can also be reused again.\n\
    \n*   Use *register()* method to register a party.\n\n*   When the final party\
    \ for a given phase arrives, an optional action can be performed and then the\
    \  *Phaser*  advances to the next phase. \n\n*   Use *arriveAndAwaitAdvance()*\
    \ method to wait for all parties to arrive before proceeding to the next phase.\n\
    \n*   *Phasers* monitors count of registered, arrived and un-arrived parties.\
    \ Even a caller who is not a registered party can monitor these counts on a Phaser.\n\
    \n*   A party can be de-registered using *arriveAndDeregister()* method, from\
    \ moving to the next phase. \n\nQuestions\n\n*   Explain Phasor synchronizer?\n\
    \n*   Can the number of parties registered with Phasor dynamically change over\
    \ time?\n\n*   Can you reuse the same Phaser object again?\n\n*   Can you monitor\
    \ count of registered parties with Phasor using some external object?\n\n*   What\
    \ is the difference between Semaphore and Phaser, with respect to number of parties\
    \ that can register with it?\n\nExchanger\n\n*   *Exchanger* lets two threads\
    \ wait for each other at a Synchronization point to swap elements.\n\n*/**/ Exchanging\
    \ array of strings**Exchanger<ArrayList<String>>**exchanger* *=* new *Exchanger**<ArrayList<String>>();*\n\
    \n*   Exchangers use *exchange()* method to exchange information.\n\n*// exchanger\
    \ exchanging data* objectToExchange = \n\n exchanger.\n\n **exchange**(objectToExchange);\n\
    \n*   On *exchange()*, the *consumer* empties the object to be exchanged and waits\
    \ for the *producer* to exchange it with full object again.\n\nQuestions\n\n*\
    \   Explain Exchanger synchronizer?\n\n*   How many thread are required with the\
    \ Exchanger object?\n\n*   What is the primary purpose of Exchanger synchronizer?\n\
    \n*   Does Exchanger synchronizer uses the same object to exchange every time\
    \ or a different object can be exchanged?\n\nLatch\n\n*   *Latch* makes the group\
    \ of threads wait till a set of operations is finished.\n\n*   *Latch* cannot\
    \ be reused.\n\n*   *CountDownLatch* class provides implementation for *Latch*.\n\
    \n*   All threads wait calling *await()* method till *countDown()* is called as\
    \ many times latch counter is set.\n\n*// Create a countdown latch with *\n\n\
    *// five counter* CountDownLatch cdl =\n\n new CountDownLatch(5);\n\n*// Count\
    \ down on the latch after *\n\n*// completion of thread job* cdl.**countDown**();\n\
    \n*// awaiting for count down signals* cdl.**await**();\n\nQuestions\n\n*   Explain\
    \ Latch synchronizer?\n\n*   Can you reuse the same Latch object again; like Barrier\
    \ and Phaser?\n\n*   What is the mechanism of signalling a job completion to Latch?\n\
    \nExecutor Framework\n\nExecutor framework provides an infrastructure to execute\
    \ set of related tasks on thread. \n\nIt takes care to manage the following.\n\
    \n*   Creating and destroying threads.\n\n*   Maintaining optimal number of threads\
    \ for a task.\n\n*   Parallel and sequential execution of tasks.\n\n*   Segregating\
    \ task submission and task execution.\n\n*   Policies related to controlling task\
    \ execution.\n\n*// Executor interface definition* public interface **Executor**\
    \ { void execute (Runnable command);\n\n}\n\nQuestions\n\n*   Explain Executor\
    \ framework?\n\n*   What are the various capabilities of Executor framework?\n\
    \nExecutor Service\n\n*   *ExecutorService* inherits from *Executor* interface\
    \ providing following additional methods.\n\n    *   *shutdown()* - shuts down\
    \ the executor after submitting the tasks.\n\n    *   *shutdownNow()* - interrupts\
    \ the current task and discards the pending tasks.\n\n    *   *submit()* - adds\
    \ tasks to the *Executor*.\n\n    *   *awaitTermination()* - waits for existing\
    \ tasks to terminate.\n\n*   *ExecutorService* provides *Future* object to track\
    \ the progress and the status of the executing task.\n\n*   All the tasks submitted\
    \ to the *Executor* are queued, which are executed by the thread pool threads.\n\
    \n*// Executor created with five threads in its thread pool* ExecutorService exec\
    \ =\n\n Executors.\n\n ***newFixedThreadPool*(****5****)**;\n\n*   To create a\
    \ thread pool with single thread, use *newSingleThreadExecutor()* method.\n\n\
    Handling Results\n\n*   *run()* method of the *Runnable* interface cannot return\
    \ result or throw exception.\n\n*   Tasks, which can return result, are instance\
    \ of *Callable* interface.\n\n*//tasks can return results derived from Callable\
    \ using call method* public interface **Callable**<V> { V call() throws Exception;\n\
    \n}\n\n*   *submit()* returns *Future* object which helps to track task.\n\n*//\
    \ ExecutorService example* public class ExecService {\n\n public static void main(String[]\
    \ args)\n\n throws ExecutionException,\n\n InterruptedException {\n\n *// Create\
    \ executor with five threads*\n\n *// in its thread pool.* ExecutorService exec\
    \ =\n\n Executors.*newFixedThreadPool*(5);\n\n *// Submit the callable task to\
    \ executor\n\n       * **Future****<String>** **task** **=** **exec****.submit(**\n\
    \n new Callable<String>() {\n\n @Override public String call()\n\n throws Exception\
    \ {\n\n *//some logic* return null;\n\n }\n\n });\n\n *// waits for result* String\
    \ result =\n\n **task****.get();**\n\n *// Shutdown executor* exec.shutdown();\n\
    \n }\n\n}\n\n*   If there is any exception during the task execution, calling\
    \ *get()* method on the *ExecutorService*  will  throw an instance of *ExecutionException. *\n\
    \nScheduling Task\n\n*   *ScheduledExecutorService* can be used to schedule a\
    \ task to run in future.\n\n*   Methods to schedule task.\n\n•  **schedule**(\n\
    \n task,\n\n delayTime,\n\n TimeUnit.*SECONDS*)\n\n•  **scheduleAtFixedRate**(\n\
    \n task,\n\n delayTime,\n\n repeatPeriod,\n\n TimeUnit.*SECONDS*)\n\n•  **scheduleWithFixedDelay**(\n\
    \n task,\n\n delayTime,\n\n fixedDelay,\n\n TimeUnit.*SECONDS*);\n\nExecutorCompletionService\n\
    \n*   *ExecutorCompletionService* uses *Executor* to execute the task.\n\n*  \
    \ *CompletionService* of *Executor* can be used to get results from multiple tasks. "
