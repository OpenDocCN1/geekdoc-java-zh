    Object Serialization


    Converting the content of an in-memory object into bytes to either persist it
    or to transfer, is called *object serialization*. These bytes can be converted
    back to object by de-serializing it.


    In Java, an object is serializable if its class implements *java.io.Serializable*
    or its sub-interface *java.io.Externalizable*. Members marked as *transient* are
    not serialized. *ObjectInputStream* and *ObjectOutputStream* are stream classes
    specifically used to read and write objects.


    Questions


    *   What is serialization and de-serialization?


    *   Which interface needs to be implemented by the type that wants to support
    serialization?


    *   How can you prevent a member from serialization?


    *   Which classes in Java are used to serialize and de-serialize objects?


    Garbage Collection


    *Garbage Collection*  in Java is the process to identify and remove the un-referenced
    objects from the memory and also move the remaining objects together to release
    contiguous block of memory. When Garbage collection happens, all the running threads
    in the application are suspended during the collection cycle. Garbage Collector
    run on a Daemon thread.


    Moving all the surviving objects together *reduces memory fragmentation*, which
    improves the speed of memory allocation.


    During Garbage Collection cycle, objects are moved to different areas in memory,
    known as  *generations*, based on their survival age.


    *System*  class exposes method *gc(),*  which can be used to request *Garbage
    Collection*. When you call  *System.gc()*, JVM does not guarantee to execute garbage
    collection immediately, but may perform when it can. You can also use *Runtime.getRuntime().gc()*
    to request Garbage Collection.


    Questions


    *   What is Garbage Collection?


    *   Explain Garbage Collection cycle?


    *   Why Garbage Collection is considered expensive process?


    *   Why after Garbage Collection cycle, usually the performance of the application
    improves?


    *   How does Garbage Collection prevents OutOfMemoryException?


    *   Which type of thread is used for Garbage Collection: Daemon or user thread?


    *   What is memory fragmentation?


    *   Why does application seems to slow down when Garbage Collection happens?


    *   Can you explicitly request a Garbage Collection?


    *   Which method can you call to request Garbage Collection?


    *   Does Garbage Collection always happen when requested?


    Memory Management


    JVM memory is divided into two major categories, *stack memory* and *heap memory.*


    Stack Memory


    *Stack memory*  is associated with each system thread and used during execution
    of the thread. *Stack*  contains local objects and the reference variables defined
    in the method; although the referenced objects are stored in heap. Once the execution
    leaves the method, all the local variables declared within the method are removed
    from the stack. 


    Heap Memory


    *Heap Memory*  is divided into various regions called generations:


    *   *New Generation* - It''s divided into Eden and Survivor space. Most of the
    new objects are created in Eden memory space.


    *   *Old Generation*


    *   *Metaspace*


    ![Image](OEBPS/Images/image00222.jpeg)


    When new generation is filled, it triggers garbage collection. Objects that survive
    this GC cycle in  *Eden*  are moved to the  *Survivor*  space. Similarly after
    few cycles of GC, the surviving objects keeps moving to  *old generation*. 


    *Metaspace*  is used by JVM to *keep permanent objects,* mostly the metadata information
    of the classes. New generations are more frequently garbage collected than the
    old generations. 


    *   *New Gen*  and *Old Gen*  are part of heap whereas  *Metaspace*  is part of
    *Native memory*. 


    *   *Metaspace*  can expand at runtime, as it''s part of native memory.


    When Garbage collection happens, all the application threads are frozen until
    GC completes its operation. Garbage collection is typically slow in old generation;
    so if lots of Garbage Collection happens in old generation, it may lead to timeout
    error in the application.


    Questions


    *   How is Heap memory divided?


    *   Explain different generations of heap memory? How objects are moved across
    generations?


    *   How is garbage collection cycle triggered?


    *   What are Eden and Survivor spaces in New Generation memory?


    *   When does the objects in Eden moves to Survivor space?


    *   What is Metaspace?


    *   What type of objects are stored in Metaspace?


    *   Why Metaspace has virtually unlimited space?


    *   In which generation does the Garbage Collection cycle runs slowest? Why?


    *   Which generation is more frequently garbage collected?


    Weak vs Soft vs Phantom Reference


    If an object in memory has a reference then the garbage collector will not collect
    it. This principle is not true for Weak and Soft references.


    Weak Reference


    *Weak reference*  is a reference that eagerly gets collected by the garbage collector.
    Weak references are good for *caching,* which can be reloaded when required.


    Soft Reference


    *Soft reference* is slightly stronger than the *Weak Reference,* as these are
    collected by garbage collector only when there is a *memory constraint*. Soft
    references are generally used for caching *re-creatable* resources like file handles,
    etc.


    Phantom Reference


    *Phantom reference* is the weakest reference in Java. It is referenced after an
    object has been finalized, but the memory is yet to be claimed by the Garbage
    collector. It is primarily used for technical purpose to track memory usage. 


    Questions


    *   What is weak reference?


    *   What is soft reference?


    *   What is Phantom Reference?


    *   What are the reference types that gets collected by the Garbage Collector,
    even when the objects of their types are still in use?'
