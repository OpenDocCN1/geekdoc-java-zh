  trans: "\n\n* 重载方法的返回类型可以不同。\n* 不能定义名称相同且参数完全相同的方法，即使它们仅区别于返回类型。\n* `Overloading`\
    \ 方法不需要抛出与与其被重载方法相同的异常。\n\n## 运算符重载\n\n`Operator overloading`（运算符重载）增强语言相关运算符定义的能力。例如，你可以使用\
    \ `+` 运算符来加两个整数，也可以用于拼接两个字符串。\n\n### Questions\n\n* 解释什么是方法重载？\n* 什么是静态多态？\n*\
    \ 静态多态和动态多态的区别是什么？\n* 你可以重写一个方法，使得所有参数相同，仅返回类型不同吗？\n* 什么是运算符重载？\n* 方法重载有什么用处？\n\
    * 重写（overriding）和重载（overloading）有什么区别？\n\n## 抽象\n\n`Abstraction`（抽象）有助于将关注从具体实现的内部细节转移到类型及其行为。`Abstraction`\
    \ 的核心在于隐藏数据、其内部表示和实现的细节。\n\n另一个相关的面向对象概念是 `encapsulation`（封装），它可以用于抽象类的复杂性和内部实现。\n\
    \n`Abstraction` 还有助于提高软件的可维护性和安全性，并提供在不破坏任何客户端的情况下更改实现的能力。\n\n### Questions\n\n\
    * 什么是抽象？\n* 抽象和封装有什么区别？\n* 抽象有什么用处？\n* 你可以在没有封装的情况下实现抽象吗？\n\n## 继承\n\n`Inheritance`（继承）是一种面向对象的设计概念，涉及重用现有的类定义（称为\
    \ `super class` 超类），并通过继承该类来定义更特殊的类（称为 `sub class` 子类）。它侧重于在 `sub class` 和其 `super\
    \ class` 之间建立 `IS-A`（是一个）的关系。继承也被用于实现多态的技术，当派生类型实现了基类型中定义的方法时。\n\n### 继承规则\n\n\
    * 根据创建特定类的需求，可以存在多级的 `inheritance`（继承）。\n* Java 只允许单类 `inheritance`，因为多重继承会带来相应的复杂性；请参菱问题（Diamond\
    \ Problem）。\n* 声明为 `final` 的类不能被扩展。\n* 声明为 `final` 的类方法不能被 `overridden`（重写）。\n\
    * 基类的构造函数和私有成员不会被继承。\n* 使用 `super()` 可以调用基类的构造函数。\n* 基类的重写方法应该使用 `super` 关键字调用，否则你将导致递归地调用子类中的重写方法。\n\
    \n### Questions\n\n* 解释继承？\n* 继承的目的是什么？\n* 决定两个类之间继承关系的标准是什么？\n* 继承在多态中起着怎样的重要作用？\n\
    * 你可以继承 final 类吗？\n* 如果你不使用 super 关键字来调用被重写的成员，会发生什么？\n* 为什么你不能继承在超类中定义的静态成员？\n\
    * 如果 Java 中支持多重继承，你可能会面临哪些挑战？\n\n## 组合\n\n`Composition`（组合）是一种面向对象的设计概念，与继承紧密相关，因为它也涉及重用类；但它侧重于在类之间建立\
    \ `HAS-A`（有一个）的关系。因此，与处理类功能扩展的 `Inheritance` 不同，`composition` 通过组合类来重用类。`Composition`\
    \ 通过将另一个类的引用存储为成员来实现。\n\n### 继承 vs 组合\n\n`inheritance`（继承）的问题在于它破坏了 `encapsulation`（封装），因为派生类与基类的实现紧密耦合。当一个类的设计时没有考虑未来的继承范围，且你对基类没有控制权时，问题就会变得复杂。由于基类的变化可能会导致派生类的破坏。\n\
    \n因此，只有在基类定义和派生类定义之间存在完美的 `IS-A` 关系时，必须使用 `inheritance`；在有任何疑问的情况下，优先选择 `composition`\
    \ 而不是 `inheritance`。\n\n### Questions\n\n* 解释组合？\n* 继承和组合的区别是什么？\n* 决定两个类之间组合关系的标准是什么？\n\
    * 解释几个可以通过组合避免的继承带来的问题？\n* 在什么情况下，你会倾向于使用组合而不是继承，反之亦然？\n\n## 基础设计概念\n\n## 依赖注入\
    \ vs 控制反转\n\n`Dependency Injection`（依赖注入）和 `Inversion of Control`（控制反转）通过松耦合依赖项来促进模块化软件开发。模块化组件也更具可维护性且易于测试。\n\
    \n### 控制反转\n\n`Inversion of Control`（控制反转）提供了一种设计范式，依赖项不是由需要这些依赖的显式创建的，而是这些对象是由外部源创建并提供的。\n\
    \n### 依赖注入\n\n`Dependency Injection`（依赖注入）是 `IoC` 的一种形式，通过构造函数、setter 或服务定位器在运行时提供对象依赖。`Annotations`（注解）和\
    \ `Interfaces`（接口）用于识别依赖源。\n\n* 依赖注入的模式：\n    * 通过构造函数\n    * 通过 setter\n    *\
    \ 通过方法参数\n* 注入依赖项是依赖注入框架的责任。\n\n下图描绘了依赖注入的概念。\n\n![Image](img/image00209.jpeg)\n\
    \n下面的代码演示了作为构造函数参数的依赖注入。\n\n```java\npublic class Account {\n    UserService userService;\n\
    \    AccountService accountService;\n\n    public Account(UserService userService,\
    \ AccountService accountService) {\n        this.userService = userService;\n\
    \        this.accountService = accountService;\n    }\n}\n```\n\n不仅在生产系统中，`DI`\
    \ 和 `IoC` 通过提供模拟（mock）依赖项的能力为单元测试提供了巨大的帮助。`Spring framework` 是 DI 容器的一个例子。\n\n\
    ### Note\n\n确保依赖对象在被请求之前初始化是有关重要的。\n\n### Questions\n\n* 什么是控制反转？\n* 什么是依赖注入？\n\
    * 控制反转和依赖注入的区别是什么？\n* 实现依赖注入的不同方式有哪些？\n* 识别依赖源的不同方式有哪些？\n* 谁负责注入依赖对象？\n* 依赖注入如何用于单元测试？\n\
    * 依赖注入如何用于模块化软件开发？\n\n## 服务定位器\n\n`Service locator`（服务定位器）是一个封装了解析请求逻辑的对象。`Service\
    \ locator` 还提供了注册接口，这允许你在不修改依赖这些服务的对象的替换具体实现。\n\n图中 `Account` 类使用 `ServiceLocator`\
    \ 来解析它依赖的 `Account Service` 和 `User Service`。\n\n![Image](img/image00210.jpeg)\n\
    \n```java\npublic class Account {\n    UserService userService;\n    AccountService\
    \ accountService;\n\n    public Account() {\n        this.userService = ServiceLocator.getService(UserService.class);\n\
    \        this.accountService = ServiceLocator.getService(AccountService.class);\n\
    \    }\n}\n```\n\n### 服务定位器的好处\n\n* 类不需要管理任何服务依赖及其生命周期。\n* 可以在隔离状态下测试类，而无需其依赖的*真实*服务可用。\n\
    * 实现了运行时资源*优化*；因为服务可以在运行时注册和注销。\n\n### Questions\n\n* 解释服务定位器设计模式？\n\n"
- fmt: "\n* What are the benefits of using Service Locator?\n* What is the difference\
    \ between Service Locator and Dependency Injection pattern?\n* When would you\
    \ prefer Service Locator over Dependency Injection and vice versa?\n* How does\
    \ Service Locator helps in testing?\n\n## Diamond Problem\n\nJava doesn't allows\
    \ extending multiple classes because of the ambiguity that could arise when more\
    \ than one super class has method with the same signature, and compiler can't\
    \ decide which super class method to use.\n\nConsider the inheritance hierarchy\
    \ depicted in the figure below. If the method `calculate()` defined in the `Base`\
    \ class is overridden by both, `DerivedLeft` and `DerivedRight`, then it creates\
    \ ambiguity regarding which version of `calculate()` does the `Confused` class\
    \ inherits.\n\n![Image](OEBPS/Images/image0021.jpeg)\n\nIn the code below there\
    \ is an ambiguity regarding which version of `calculate()` should be called. This\
    \ is known as `Diamond Problem` in Java.\n\n```java\npublic static void main (String\
    \ [] args){\n\n Base base = new Confused();\n\n base.calculate();\n\n}\n```\n\n\
    ### Diamond Problem with Default Interface Method\n\nWith the introduction of\
    \ `Default Interface methods`, if `Base`, `DerivedLeft` and `DerivedRight` are\
    \ Interfaces, and there exists `calculate()` as default interface method is all\
    \ three, it will cause the `Diamond Problem`.\n\nIn such scenario the `Confused`\
    \ class has to explicitly re-implement the `calculate()` method; otherwise, the\
    \ ambiguity will be rejected by the compiler.\n\n### Questions\n\n* Explain Diamond\
    \ Problem in Java?\n* Why Java does not provide multiple inheritances?\n* Using\
    \ default interface methods, class can still inherit two interfaces with same\
    \ signature method; would this not cause Diamond Problem? How can you solve it?\n\
    \n## Programming to interface\n\n`Programming to interface` forms basis for modular\
    \ software development by facilitating decoupling between software components.\
    \ High level of decoupling improves maintainability, extensibility and testability\
    \ of software components. Modular software design also helps to improve speed\
    \ to market, as it facilitates parallel software development between multiple\
    \ teams working with the same code base.\n\nIt's the `Programming to Interface`\
    \ design paradigm that forms the foundation for `Inversion of Control`, which\
    \ manages dependency relationships in any large software application.\n\nLet's\
    \ take a very simple example. Suppose we have a method to `sort` a collection,\
    \ which is defined with Interface `Map` as its parameter. This means, that the\
    \ `sort()` method is not tied to any specific type of `Map` implementation and\
    \ you can pass any concrete implementation of the `Map` interface.\n\n```java\n\
    public static void main (String [] args){\n\n sort(new HashMap<>());\n\n sort(new\
    \ TreeMap<>());\n\n sort(new ConcurrentSkipListMap<>());\n\n sort(new TreeMap<>());\n\
    \n}\n\npublic static void sort(Map map){\n\n// perform sort\n }\n```\n\n### Benefits\
    \ of programming to interface\n\n* Based on the context, you can select the most\
    \ appropriate behaviour, runtime.\n* For testing, you can pass mock objects or\
    \ stubs implementation.\n* The interface/API definitions or the contract does\
    \ not change frequently.\n* `Programming to Interface` also facilitates parallel\
    \ development between teams, as developers from different ream can continue writing\
    \ code against interfaces before doing integration.\n\n### Questions\n\n* What\
    \ is the concept of `programming to interface`?\n* What are the benefits of `programming\
    \ to interface`?\n* How does `programming to interface` facilitate decoupling\
    \ between software components?\n* How `dependency injection` and `programming\
    \ to interface` are inter-related? Can you achieve `dependency injection` without\
    \ supporting `programming to interface`?\n* What are the benefits of modular software?\n\
    * How does programming to interface helps in unit testing?\n\n## Abstract Class\
    \ vs Interface\n\n### Abstract Class\n\n`Abstract class` `cannot` be instantiated\
    \ but can be extended. You should extend abstract class when you want to enforce\
    \ a common design and implementation among derived classes.\n\n### Interface\n\
    \n`Interface` is set of related methods, which defines its behaviour and its contract\
    \ with the outside world. Use interface when you want to define common behaviour\
    \ among unrelated classes. Interfaces can also be used without methods and are\
    \ known as `marker interface;` such interfaces are used to categorize the classes.\
    \ Example of marker interface is `java.io.Serializable`, which does not define\
    \ any method but must be implemented by the classes that support serialization.\n\
    \n### Difference between Abstract Class and Interface\n\n* Abstract class can\
    \ be updated to add more capabilities to the class whereas Interface can be added\
    \ to implement new behaviour to the class. Though with introduction of `default\
    \ interface methods`, even Interfaces can be extended to have more capabilities.\n\
    * Interface can be multiple inherited; whereas, abstract class cannot.\n* Interfaces\
    \ can be applied to unrelated classes; whereas, related classes extend Abstract\
    \ class.\n* Abstract class methods can have any type of access modifier; whereas,\
    \ Interface has all public members.\n* Abstract class can have state associated,\
    \ which is not possible with Interface.\n* Abstract class can be extended without\
    \ breaking the class that extends it; whereas, any change in interface, except\
    \ made for default and static methods, will break the existing implementation.\n\
    \n### Questions\n\n* If an abstract class cannot be instantiated, why would you\
    \ define a constructor for an Abstract class?\n    * `Constructor can be used\
    \ to perform the required field initialization and also to enforce class constraints.`\n\
    * Define Abstract class? What role an Abstract class plays in class design?\n\
    * Define Interface? What role an Interface plays in class design?\n* When would\
    \ you prefer using Abstract class over Interface and vice-versa?\n* Explain various\
    \ differences between Abstract Class and Interface?\n* What are marker interfaces?\
    \ How are marker interfaces used?\n* Can you declare an interface method static?\n\
    * With the introduction of default methods; how Abstract class is still different\
    \ from Interface?\n\n## Internationalization and Localization\n\n### Internationalization\n\
    \nInternationalization of software is the process to ensure that software is not\
    \ tied to only one language or locale. Its shortened name is `i18n`.\n\n### Localization\n\
    \nLocalization of software is the process to ensure that software has all the\
    \ resources to support a specific language or locale. Its shortened name is `l10n`.\n\
    \n### Note\n\nInternationalization facilitates localization.\n\n### Questions\n\
    \n* What is Internationalization?\n* What is localization?\n* What is the difference\
    \ between localization and internationalization?\n* Can you achieve localization\
    \ without building support for Internationalization?\n\n## Immutable Objects\n\
    \nAn object is considered `immutable` when there is no possibility of its state\
    \ change after its construction.\n\n### Advantages\n\n* Easier to design and implement,\
    \ as you don't have to manage state change.\n* Immutable objects are inherently\
    \ thread safe because they cannot be modified after creation. So there is no need\
    \ to synchronize access to it.\n* Immutable object has reduced `Garbage Collection`\
    \ overhead.\n\n### Disadvantages\n\n* A separate object needs to be defined for\
    \ each distinct value, as you cannot reuse an Immutable object.\n\n### Rule for\
    \ defining Immutable Objects\n\n* Declare the class `final`.\n* Allow only constructor\
    \ to create object. Don't provide field `setter`.\n* Mark all the fields `private`.\n\
    \n### Example of an immutable class, Employee.\n\n```java\nfinal public class\
    \ Employee {\n\n final private int id;\n\n final private String name;\n\n final\
    \ private String department;\n\n public Employee(int id,\n\n String name,\n\n\
    \ String department) {\n\n this.id = id;\n\n this.name = name;\n\n this.department\
    \ = department;\n\n }\n\n public int getId() {\n\n return id;\n\n }\n```\n"
