    \ an ability to move in both *backward* and *forward* directions.\n\n*   You can\
    \ remove entries during an iteration when using an *Iterator*, which is not possible\
    \ when you use *for-each* loop.\n\n*   *for-each*  also uses *Iterator*  internally.\n\
    \nIterator<Map.Entry<String, Account>> accountIterator =\n\n map.entrySet().iterator();\n\
    \nwhile (accountIterator.hasNext()){\n\n Map.Entry<String, Account> accountEntry\
    \ =\n\n accountIterator.next();\n\n *print*(\"UserId - \" + accountEntry.getKey()\
    \ + \", \" +\n\n \"Account - \" + accountEntry.getValue());\n\n}\n\nNotes\n\n\
    *   *For-each **loop should be preferred over* *for* *loop, as* *for* *loops are\
    \ source of errors, specifically related to index calculations.*\n\n*   *Iterator*\
    \ *is considered to be more thread safe because it throws exception if the collection\
    \ changes while iterating.*\n\nData Independent Access\n\nThe code should be written\
    \ in such a way that client code should *not* be aware of the internal structure\
    \ used to store the collection. This enables making internal changes without breaking\
    \ any client code. So to facilitate *data independent access* to the collection,\
    \ it must be exposed such that an *Iterator* can be used to iterate through all\
    \ the elements of the collection.\n\nQuestions\n\n*   Explain different ways to\
    \ iterate over collection?\n\n*   Can you modify collection *structure* while\
    \ iterating using for-each loop?\n\n*   Can you modify a collection *element*\
    \ value while iterating using for-each loop?\n\n*   What are the limitations with\
    \ for-each loop, with respect to navigation direction?\n\n*   What is difference\
    \ between for-each loop and Iterator, with respect to navigation direction?"
