  trans: "\n\n# volatile 字段存储在何处？\n\n## static volatile 与 synchronized（同步）\n\n###\
    \ static 变量\n`static` 变量用于类对象语文中，无论创建了多少个类对象，静态变量只存在一份拷贝。\n\n但如果有多个线程访问同一个变量，每个线程都会在自己的\
    \ CPU 缓存中创建该变量的副本，一个线程所做出的更改对其他线程是不可见的。\n\n### volatile 变量\n`volatile` 变量用于线程语文中，无论有多少个线程或对象访问它，都只存在一个变量，且每个人始终能获取最新更新的值。`Volatile`\
    \ 强制所有读写操作直接在主内存中进行，而不是在 CPU 缓存中进行。\n\n### synchronized\n`static` 和 `volatile`\
    \ 都是字段修饰符，处理与变量相关的内存可见性问题；而 `synchronized` 则用于通过监视器（monitor）控制对代码中`临界区域`的访问，从而防止对代码段的并发访问。\n\
    \n### 问题\n* 什么是静态变量？\n* 类的所有对象共享静态变量。但在多线程环境中，为什么一个对象对静态变量的修改对另一个线程上的对象是不可见的？\n\
    * 如果静态和 volatile 变量在对象间是共享的，那么 volatile 变量解决的问题是什么？\n* volatile 和静态变量与 synchronized\
    \ 有何不同，因为即使 synchronized 监视器也保护了内存对象？\n\n## ThreadLocal 存储（线程本地存储）\n每个线程都有一个名为`thread\
    \ local storage`的专用内存，可以存储与线程当前操作相关的数据。通常 `ThreadLocal` 变量被实现为`private static\
    \ fields`，并用于存储事务标识符、用户标识符等信息。\n\n### ThreadLocal 声明\n```java\nThreadLocal<String>\
    \ threadLocal = new ThreadLocal<String>();\n```\n\n### 设置线程本地值\n```java\nthreadLocal.set(\"\
    Account id value\");\n```\n\n### 获取线程本地值\n```java\nString accountId = threadLocal.get();\n\
    ```\n\n* 由于 `ThreadLocal` 对象被包含在线程内部，你不需要担心对该对象进行同步访问。\n* `ThreadLocal` 对象的生命周期与其创建的线程绑定，除非有其他变量引用了同一个对象。\n\
    * 为了防止泄漏，使用 `remove()` 方法移除 `ThreadLocal` 对象是一个良好实践。\n```java\nthreadLocal.remove();\n\
    ```\n\n### 问题\n* 什么是线程本地存储？\n* 你应该在 ThreadLocal 存储中存储什么类型的信息？\n* 为什么你不需要对存储在 ThreadLocal\
    \ 存储中的对象进行同步访问？\n* 为什么要在 ThreadLocal 存储上调用 remove 方法？\n\n## wait() vs sleep()\n\
    \n### wait()\n使用 `wait()` 进行条件同步。\n```java\npublic void manageWaitFor(int timeInMs)\
    \ throws InterruptedException {\n    synchronized (reference) {\n        if (condition1)\
    \ {\n            // 等待通知\n            reference.wait(timeInMs);\n        }\n \
    \   }\n}\n```\n\n### sleep()\n线程进入指定间隔的时间。\n```java\npublic void manageSleepFor(int\
    \ timeInMs) throws InterruptedException {\n    // 暂停 timeInMs 毫秒\n    Thread.sleep(timeInMs);\n\
    \    // 打印消息\n    print(\"Slept for :\" + timeInMs + \"ms.\");\n}\n```\n\n* `wait`\
    \ 是在对象的监视器上调用的；而 `sleep` 是在线程上调用的。\n* 等待的对象可以被通知；而休眠的线程不能。\n* 休眠的线程不能释放锁；而等待的对象可以。\n\
    * 要唤醒一个休眠的线程，你需要它的引用，而等待的对象则不需要。\n\n### 问题\n* wait 和 sleep 之间有什么区别？\n* 为什么可以通知等待的对象唤醒，但不能唤醒休眠的线程？\n\
    * 唤醒休眠线程需要直接句柄；你需要直接访问等待的对象吗？为什么？\n* 信号对象退出等待状态的机制是什么？\n\n## Joining Threads（连接线程）\n\
    当线程之间存在依赖关系时，通常会连接线程。目标线程的`join()` 方法用于挂起当前线程。在这种情况下，在它依赖的目标线程完成执行之前，当前线程无法继续。\n\
    \n```java\n// 主线程连接线程 \npublic void main(String[] args) {\n    Thread thread1\
    \ = new Thread(ThreadMethodRef::threadMethod);\n    thread1.start();\n    // 当前线程等待\n\
    \    // 直到 thread1 完成\n    // 执行\n    thread1.join();\n}\n```\n\n### 问题\n* 线程\
    \ join 方法的目的是什么？\n* 为什么你需要连接两个线程？\n\n## Atomic Classes（原子类）\n`Atomic classes`\
    \ 提供了对原始类型执行原子操作的能力，使得在方法调用完成之前只允许一个线程更改该值。像 `AtomicInteger` 和 `AtomicLong` 这样的原子类封装了相应的原始类型。引用类型也有一个对应的类，即\
    \ `AtomicReference`。\n\n不需要对原子类对象提供`synchronized` 访问。`AtomicInteger` 的方法 `incrementAndGet()`\
    \ 通常用于替代`前置和后置递增运算符`（++ 和 --）。\n\n### 问题\n* 什么是原子类？\n* 为什么你不需要对原子类对象进行同步访问？\n\
    * 为什么前置和后置递增运算符不是线程安全的？\n    * 前置和后置操作底层是多次操作：读取、递增和写入。这三者没有一起同步执行，因此在之间发生的任何线程切换都会导致非预期的结果。\n\
    * 原子变量和 volatile 变量有什么区别？\n    * 原子变量提供了发生于（happen-before）读取的。\n\n## Lock（锁）\n\
    * `Lock` 是多线程环境下控制共享资源访问的机制。\n* `ReentrantLock` 类实现了`lock` 接口。\n* 锁可以在不同的代码块中获取和释放。\n\
    * `Lock` 接口具有用于验证资源可用性的方法 `tryLock()`\n* 作为良好实践，获取的锁必须在`finally` 块中释放。\n\n```java\n\
    // 安全类\npublic class SafeAccount {\n    // 创建锁\n    private Lock lockObject =\
    \ new ReentrantLock();\n\n    public void addMoney() {\n        // 获取锁\n     \
    \   lockObject.lock();\n        try {\n            // 在此处添加金额\n        } finally\
    \ {\n            // 释放锁\n            lockObject.unlock();\n        }\n    }\n\
    }\n```\n\n### 问题\n* 解释多线程环境下的锁机制？\n* 你需要在同一个代码块中获取并释放锁？\n* 为什么你应该用 tryLock() 而不是\
    \ lock()?\n\n## ReadLock（读写锁）\n* `ReadWriteLock` 管理一对关联锁，一个用于写入，另一个用于读取操作。\n*\
    \ 只有一个线程可以获取写锁，但多个线程可以拥有读锁。\n* `ReadWriterLock` 接口由 `ReentrantReadWriteLock` 实现。\n\
    \n```java\n// ReentrantReadWriteLock \nReentrantReadWriteLock rwl = new ReentrantReadWriteLock();\n\
    // 读锁\nLock rl = rwl.readLock();\n// 写锁\nLock wl = rwl.writeLock();\n```\n\n###\
    \ 问题\n* 使用 ReadWriteLock 的好处是什么？\n* 在什么你会倾向于使用 ReadWriteLock 而不是其他锁机制？\n\n## Synchronisers（同步器）\n\
    同步器同步多个线程以保护`临界区域`。 \n\n***Sync***\n\n***Point Threads***\n\n | ------------\n\
    \n | ----------------\n\n |  ----------\n\n同步器类型\n* Barriers\n* Semaphore\n* Phasers\n\
    * Exchangers\n* Latch\n\n### 问题\n* 同步器的目的是什么？\n* Java 中提供了哪些类型的同步器？\n\n## Barriers（屏障）\n\
    * 在`Barriers` 中，一组线程等待彼此到达屏障点后才会继续执行。\n* `CyclicBarrier` 是 `Barrier` 同步器的具体实现。\
    \ \n\n"
- fmt: "\n# CyclicBarrier\n\n```java\n// barrier with five threads\nCyclicBarrier\
    \ barrier = new CyclicBarrier(5);\n}\n```\n\n* A `Barrier` is called cycle because\
    \ it can be reused after calling `reset()` on it.\n* Action can be passed to the\
    \ `CyclicBarrier`, to execute when all the threads reach barrier point.\n\n```java\n\
    // barrier with an action to run\n// at the barrier point.\nCyclicBarrier barrier\
    \ = new CyclicBarrier(5, () -> {\n    // barrier point action code.\n});\n```\n\
    \n* If any of the thread is terminated prematurely then all the other threads\
    \ waiting at the barrier point will also exit.\n* Barriers are generally used\
    \ when you divide an operation into multiple tasks on separate threads, and wait\
    \ for all the tasks to complete before moving ahead. \n\n### Questions\n* Explain\
    \ Barrier synchronizer?\n* Can you reuse the same Barrier object again? How?\n\
    * What happen if one of thread dies, for which other threads were waiting at the\
    \ Barrier?\n* For what kind of work would you use Barrier?\n\n# Semaphore\n\n\
    * `Semaphore` maintains a specified number of permits to access a `Critical Section`.\n\
    \n```java\n// Semaphore created with four permit\n// for four threads\nSemaphore\
    \ semaphore = new Semaphore(4);\n```\n\n* To gain permit, use `acquire()` method.\
    \ Each call to `acquire()` method is blocked until permit becomes available.\n\
    * To release permit, use `release()` method.\n* Permit can be released by a different\
    \ thread, other than the one that acquired it.\n* If `release()` is called more\
    \ number of times than `acquire()`, then for each such additional release, an\
    \ additional permit will be added. \n* If you wish to acquire mutually exclusive\
    \ lock, initialize the `Semaphore` with only one permit.\n* Semaphore are generally\
    \ used to allow limited access to an expensive resource. \n\n### Questions\n*\
    \ Explain Semaphore synchronizer?\n* What happens if you call `release()` more\
    \ number of time than `acquire()`?\n* What happens when you call `acquire`, but\
    \ permit is not available?\n* How can you acquire mutually exclusive lock using\
    \ Semaphore?\n* Where do you use Semaphore?\n\n# Phaser\n\n* Unlike other barriers,\
    \ the number of parties registered with the `Phaser` can dynamically change over\
    \ time. \n\n```java\n// Phaser with four registered parties\nPhaser phaser = new\
    \ Phaser(4);\n```\n\n* A `phaser` can also be reused again.\n* Use `register()`\
    \ method to register a party.\n* When the final party for a given phase arrives,\
    \ an optional action can be performed and then the `Phaser` advances to the next\
    \ phase. \n* Use `arriveAndAwaitAdvance()` method to wait for all parties to arrive\
    \ before proceeding to the next phase.\n* `Phasers` monitors count of registered,\
    \ arrived and un-arrived parties. Even a caller who is not a registered party\
    \ can monitor these counts on a Phaser.\n* A party can be de-registered using\
    \ `arriveAndDeregister()` method, from moving to the next phase. \n\n### Questions\n\
    * Explain Phasor synchronizer?\n* Can the number of parties registered with Phasor\
    \ dynamically change over time?\n* Can you reuse the same Phaser object again?\n\
    * Can you monitor count of registered parties with Phasor using some external\
    \ object?\n* What is the difference between Semaphore and Phaser, with respect\
    \ to number of parties that can register with it?\n\n# Exchanger\n\n* `Exchanger`\
    \ lets two threads wait for each other at a Synchronization point to swap elements.\n\
    \n```java\n// Exchanging array of strings\nExchanger<ArrayList<String>> exchanger\
    \ = new Exchanger<ArrayList<String>>();\n```\n\n* Exchangers use `exchange()`\
    \ method to exchange information.\n\n```java\n// exchanger exchanging data\nobjectToExchange\
    \ = exchanger.exchange(objectToExchange);\n```\n\n* On `exchange()`, the `consumer`\
    \ empties the object to be exchanged and waits for the `producer` to exchange\
    \ it with full object again.\n\n### Questions\n* Explain Exchanger synchronizer?\n\
    * How many thread are required with the Exchanger object?\n* What is the primary\
    \ purpose of Exchanger synchronizer?\n* Does Exchanger synchronizer uses the same\
    \ object to exchange every time or a different object can be exchanged?\n\n# Latch\n\
    \n* `Latch` makes the group of threads wait till a set of operations is finished.\n\
    * `Latch` cannot be reused.\n* `CountDownLatch` class provides implementation\
    \ for `Latch`.\n* All threads wait calling `await()` method till `countDown()`\
    \ is called as many times latch counter is set.\n\n```java\n// Create a countdown\
    \ latch with\n// five counter\nCountDownLatch cdl = new CountDownLatch(5);\n//\
    \ Count down on the latch after\n// completion of thread job\ncdl.countDown();\n\
    // awaiting for count down signals\ncdl.await();\n```\n\n### Questions\n* Explain\
    \ Latch synchronizer?\n* Can you reuse the same Latch object again; like Barrier\
    \ and Phaser?\n* What is the mechanism of signalling a job completion to Latch?\n\
    \n# Executor Framework\n\nExecutor framework provides an infrastructure to execute\
    \ set of related tasks on thread. \nIt takes care to manage the following:\n*\
    \ Creating and destroying threads.\n* Maintaining optimal number of threads for\
    \ a task.\n* Parallel and sequential execution of tasks.\n* Segregating task submission\
    \ and task execution.\n* Policies related to controlling task execution.\n\n```java\n\
    // Executor interface definition\npublic interface Executor { void execute (Runnable\
    \ command); }\n```\n\n### Questions\n* Explain Executor framework?\n* What are\
    \ the various capabilities of Executor framework?\n\n# Executor Service\n\n* `ExecutorService`\
    \ inherits from `Executor` interface providing following additional methods.\n\
    \    * `shutdown()` - shuts down the executor after submitting the tasks.\n  \
    \  * `shutdownNow()` - interrupts the current task and discards the pending tasks.\n\
    \    * `submit()` - adds tasks to the `Executor`.\n    * `awaitTermination()`\
    \ - waits for existing tasks to terminate.\n* `ExecutorService` provides `Future`\
    \ object to track the progress and status of the executing task.\n* All the tasks\
    \ submitted to `Executor` are queued, which are executed by the thread pool threads.\n\
    \n```java\n// Executor created with five threads\n// its thread pool\nExecutorService\
    \ exec = Executors.newFixedThreadPool(5);\n```\n\n* To create a thread pool with\
    \ single thread, use `newSingleThreadExecutor()` method.\n\n# Handling Results\n\
    \n* `run()` method of the `Runnable` interface cannot return result or throw exception.\n\
    * Tasks, which can return result, are instance of `Callable` interface.\n\n```java\n\
    //tasks can return results from Callable using call method\npublic interface Callable<V>\
    \ { V call() throws Exception; }\n```\n\n* `submit()` returns `Future` object\
    \ which helps to track task.\n\n```java\n// ExecutorService example\npublic class\
    \ ExecService {\n    public static void main(String[] args) throws ExecutionException,\
    \ InterruptedException {\n        // Create executor with five threads\n     \
    \   ExecutorService exec = Executors.newFixedThreadPool(5);\n        // Submit\
    \ the callable task to executor\n        Future<String> task = exec.submit(new\
    \ Callable<String>() {\n            @Override public String call() throws Exception\
    \ {\n                //some logic\n                return null;\n            }\n\
    \        });\n        // waits for result\n        String result = task.get();\n\
    \        // Shutdown executor\n        exec.shutdown();\n    }\n}\n```\n\n* If\
    \ there is any exception during the task execution, calling `get()` method on\
    \ the `ExecutorService` will throw an instance of `ExecutionException`. \n\n#\
    \ Scheduling Task\n\n* `ScheduledExecutorService` can be used to schedule a task\
    \ to run in future.\n* Methods to schedule task:\n    * `schedule(task, delayTime,\
    \ TimeUnit.SECONDS)`\n    * `scheduleAtFixedRate(task, delayTime, repeatPeriod,\
    \ TimeUnit.SECONDS)`\n    * `scheduleWithFixedDelay(task, delayTime, fixedDelay,\
    \ TimeUnit.SECONDS)`\n\n# ExecutorCompletionService\n\n* `ExecutorCompletionService`\
    \ uses `Executor` to execute the task.\n* `CompletionService` of `Executor` can\
    \ be used to get results from multiple tasks. \n"
