    # 引言


    引言


    *Java 面试笔记* 涵盖了 Java 技术轮面试中经常讨论的话题，并提供了每个主题的面试题。


    要在面试中保持自信，对软件设计和语言概念的彻底理解非常重要，因为在面试中同一个问题可能会以许多不同的方式提问。


    你理解问题以及分享观点的方法对于面试的成功起着至关重要的作用。


    只有当你花费大量时间编写代码、阅读技术主题并与同行讨论这些时，才能获得面对此类面试的信心。没有其他的捷径。


    我希望这本书不仅能帮助你准备下一次面试，还能帮助你完成日常的软件开发任务。


    祝好！！！


    # JAVA


    ## Java 基础知识


    ### Java 程序剖结构


    以下代码片段展示了简单 Java 程序的结构。


    ![Image](img/image00207.jpeg)


    - `package` - 代表将相似类型分组到命名空间。它还可以防止命名冲突并提供访问保护。

    - `import` - 导入包，以便在代码中使用未限定名使用类。

    - `class` - 代表具有属性和方法的类型模板。

    - `field` - 代表用于存储值的成员。


