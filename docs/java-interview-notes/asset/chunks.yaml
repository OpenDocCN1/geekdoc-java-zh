  trans: "\n\n* 解释 `Blocking Queue` 和 `Transfer Queue` 的区别？\n\n* 哪种 `Queue` 是容量限制的，允许\
    \ `Queue` 中只有指定数量的元素？如果尝试放入超过其容量的元素会发生？\n\n# Map\n\n* `Map` 包含键值映射。\n\n* 通常 `Map`\
    \ 允许一个 `null` 作为键以及多个 `null` 作为值，但具体限制取决于 `Map` 实现类的定义。\n\n## Implementation\n\
    \n### HashMap\n\n* `HashMap` 基于哈希表（hash table）。\n\n* `HashMap` 不保证 map 中元素的顺序。\n\
    \n* `HashMap` 的哈希函数为 `get` 和 `put` 操作提供常数时间性能。\n\n* `HashMap` 允许一个 `null` 键和多个\
    \ `null` 值。\n\n```java\n// 使用 HashMap 创建一个 map Map<String, String> hashMap = new\
    \ HashMap<>();\n```\n\n### LinkedHashMap\n\n* `LinkedHashMap` 是 `Map` 接口的基于哈希表和链表的实现。\n\
    \n* `LinkedHashMap` 使用双向链表存储条目。\n* 如果需要保持插入顺序，请使用 `LinkedHashMap` 代替 `HashSet`。\n\
    * `HashMap` 的性能略优于 `LinkedHashMap`，因为 `LinkedHashMap` 还需要维护链表。\n* 它确保按照插入顺序对条目进行迭代。\n\
    \n```java\n// LinkedHashMap LinkedHashMap lhm = new LinkedHashMap();\n```\n\n\
    ### WeakHashMap\n\n* `WeakHashMap` 仅对其键存储弱引用（weak references）。\n* `WeakHashMap`\
    \ 同时支持 `null` 键和 `null` 值。\n* 当没有引用指向键时，它们将成为垃圾回收的候选。\n\n```java\n// WeakHasMap\
    \ Map map = new WeakHashMap();\n```\n\n### Sorted Map\n\n* `SortedMap` 对其键提供完全排序。\n\
    * 根据自然排序（`Comparable`）或自定义排序（`Comparator`）对 map 条目进行键排序。\n* `SortedMap` 接口继承自\
    \ `Map`。\n\n```java\n// 排序 map SortedMap<String,String> sm = new TreeMap<>();\n\
    ```\n\n### Navigable Map\n\n* `NavigableMap` 扩展了 `SortedMap` 接口。\n* `TreeMap`\
    \ 类是 `NavigableMap` 的实现。\n* `NavigableMap` 可以以升序和降序方式访问。\n* 它支持双向导航并获取键的最接近匹配项。\n\
    \n```java\n// 创建一个 Navigable Map NavigableMap<String,String> nm = new TreeMap<>();\n\
    ```\n\n### Concurrent Map\n\n* `ConcurrentHashMap` 是 `ConcurrentMap` 接口的具体实现。\n\
    * `ConcurrentMap` 通过将 map 划分为多个桶（buckets）并单独锁定每个桶 get 细粒度同步机制。\n* `ConcurrentHashMap`\
    \ 在从 map 读取时不会锁定 map。\n\n```java\n// 创建一个 Concurrent Map ConcurrentMap<String,String>\
    \ cm = new ConcurrentHashMap<>();\n```\n\n## Notes\n\n* `Map` 的键和 `Set` 的项不能更改状态，因此这些必须是不可变对象。\n\
    * 为了避免实现 `hashCode()` 和 `equals()`，优先使用 JDK 提供的不可变类作为 `Map` 的键。\n* 永远不要向调用者暴露集合字段，而是提供方法来操作这些字段。\n\
    * `HashMap` 在 map 中插入、定位和删除元素方面提供了更好的性能。\n* 如果你需要按排序顺序遍历键，`TreeMap` 更好。\n\n# Questions\n\
    \n* Map 与其他集合有什么区别？\n* 你可以向 Map 中添加 `null` 值作为键吗？\n* 你能保证 `HashMap` 中元素的顺序吗？\n\
    * `HashMap` 如何能够为 `get` 和 `put` 操作提供常数时间性能？\n* `HashMap` 和 `LinkedHashMap` 的区别是什么？\n\
    * 如果要保持插入顺序，你会使用哪一个：`LinkedHashMap` 还是 `HashSet`？为什么？\n* 什么是 `WeakHashMap`？\n\
    * 当你想维护键的顺序时，你会使用哪种 Map 类？\n* 你使用哪种 Map 类来以升序和降序访问？\n* 哪种 Map 实现针对线程安全进行了优化？\n\
    * `ConcurrentHashMap` 如何实现扩展性并同时保持良好的性能？\n* 为什么用于 Map 的键和用于 Set 的值应该是不可变类型？\n\
    * 向调用者暴露内部集合对象有什么坏处？\n* 如果你想按排序顺序遍历集合，哪种集合最好？\n\n# Algorithms\n\n* `Sorting` -\
    \ 用于按升序或降序对集合排序。你可以使用自然顺序（如果 `key` 类实现了 `Comparable` 接口），或者需要传递 `Comparator` 对象进行自定义排序。\n\
    * `Searching` - `BinarySearch` 算法用于搜索键。\n* `Shuffling` - 它按随机顺序重新排列列表中的元素，通常用于游戏。\n\
    * `Data Manipulation` - 提供 `reverse`、`copy`、`swap`、`fill` 和 `addAll` 算法对集合元素执行通常的数据处理。\n\
    * `Extreme Value` - 提供 `min` 和 `max` 算法用于查找指定集合中的最大值。\n\n## Questions\n\n* 集合框架支持哪些不同的算法？\n\
    * 使用哪种搜索算法搜索键？\n* 如何使用洗牌（shuffling）算法？\n\n## Comparable vs Comparator\n\n* 实现\
    \ `Comparable` 接口按自然顺序排序集合元素，`Comparator` 对象用于执行自定义排序。\n* 如果元素实现了 `Comparable`，则使用\
    \ `compareTo()` 方法进行排序。\n* `Comparator` 对象用于执行自定义排序。\n\n```java\n// Comparable\
    \ 接口实现\n@Override public int compareTo(Employee employee) {\n    // 比较逻辑\n}\n\
    ```\n\n```java\n// 使用 Comparator\nSortedSet<City> sortedCities = new TreeSet<>(Comparator.comparing(City::getName));\n\
    ```\n\n* `Comparator` 通常用于在你无法完全控制该类时。\n\n## Questions\n\n* `Comparable` 接口和 `Comparator`\
    \ 类有什么区别？\n* 你何时实现 `Comparable` 接口来排序集合？\n* 你何时使用 `Comparator` 类来排序集合？\n\n# hashCode()\
    \ and equals()\n\n* `HashTable`、`HashMap` 和 `HashSet` 使用 `hashCode()` 和 `equals()`\
    \ 方法来计算和比较作为键的对象。\n* Java 中的所有类都继承自 `java.Object` 基类方案，除非它们重写了 `hashCode()` 方法。\n\
    * 任何重写了 `hashCode()` 方法的类也应该重写 `equals()` 方法。\n\n## Implementation of hashCode()\
    \ and equals()\n\n```java\nfinal public class Employee {\n    final private int\
    \ id;\n    final private String name;\n    final private String department;\n\n\
    \    @Override public boolean equals(Object o) {\n        if (this == o) return\
    \ true;\n        if (o == null || getClass() != o.getClass()) return false;\n\
    \        Employee employee = (Employee) o;\n        if (id != employee.id) return\
    \ false;\n        if (name != null ? !name.equals(employee.name) : employee.name\
    \ != null) return false;\n        return !(department != null ? !department.equals(employee.department)\
    \ : employee.department != null);\n    }\n\n    @Override public int hashCode()\
    \ {\n        int result = id;\n        result = 31 * result + (name != null ?\
    \ name.hashCode() : 0);\n        result = 31 * result + (department != null ?\
    \ department.hashCode() : 0);\n        return result;\n    }\n}\n```\n\n## Rules\
    \ of hashCode and equals\n\n* 对象一旦创建，在其生命周期内必须始终报告相同的哈希码。\n* 相同类的相等对象必须返回相同的哈希码。\n\
    \n"
- fmt: "\n# Note\n\nTwo objects, which are not equal, can still have same hash-code.\n\
    \n## How `hashCode()` and `equals()` are used\n\n* `hashCode()` and `equals()`\
    \ methods are used to segregate items into separate buckets for lookup efficiency.\
    \ If two `Items` have the same hash-code then both of these will be stored in\
    \ the `same bucket`, connected by a linked list.\n* If hash-code of two objects\
    \ is different then `equals()` method is not called; otherwise, `equals()` method\
    \ is called to compare the equality.\n\nThe figure below conceptually demonstrates\
    \ the storage of objects in hash bucket.\n\n![Image](OEBPS/Images/image00216.jpeg)\n\
    \n## Questions\n\n* What are the different collections types in Java that use\
    \ `hashCode` and `equals` methods? Why do these collections type use `hashCode`\
    \ and `equals` method?\n* When you override `hashCode()` method, why should you\
    \ also override `equals()` method?\n* Why do you need to override `hashCode()`\
    \ method, when `hashCode()` method is already present in the `java.lang.Object`\
    \ class?\n* Why should an object return the same hash-code value every time during\
    \ its lifetime?\n* Is it necessary that an object returns the same hash-code every\
    \ time program runs?\n* Is it necessary that two equal object return the same\
    \ hash-code?\n* Can two objects, even when they are not equal, still have the\
    \ same hash-code?\n* What is the purpose of calculating hash-code?\n* What is\
    \ the purpose of `equals` method?\n* If two objects have the same hash code, how\
    \ are these stored in hash buckets?\n* If two objects have different hash code,\
    \ do you still need `equals` method?\n* If two objects have the same hash code,\
    \ then how `equals` method is used?\n\n## HashTable vs HashMap\n\n`HashTable`\
    \ and `HashMap` are data structures used to keep `key-value pair`. These maintain\
    \ an array of buckets and each element is added to a bucket based on the hashcode\
    \ of the key object.\n\nThe major difference between these is that the `HashMap`\
    \ is `non-synchronized`. This makes `HashMap` better for single-threaded applications,\
    \ as unsynchronized `Objects` perform better than synchronized ones due to lack\
    \ of locking overheads. In a multi-threaded application `HashTable` should be\
    \ used.\n\nA HashMap can also be converted to synchronised collection using following\
    \ method:\n\n`Collections.synchronizedMap(idToNameMao);`\n\n## Questions\n\n*\
    \ What is the purpose of `HashTable` and `HashMap`?\n* What is the difference\
    \ between `HashTable` and `HashMap`?\n* How does `HashTable` and `HashMap` store\
    \ objects?\n* Why `HashMap` is better for single threaded application?\n* Why\
    \ performance of `HashMap` is better than `HashTable`?\n* How can you use `HashMap`\
    \ in a multi-threaded environment?\n\n## Synchronized vs Concurrent Collections\n\
    \nBoth `synchronized` and `concurrent` collection classes provide thread safety,\
    \ but primary difference between these is in terms of scalability and performance.\n\
    \n### Collection Synchronization\n\n* `Collection synchronization` is achieved\
    \ by allowing access to the collection `only` from a single thread, at a time.\n\
    * It is achieved by making all the public method `synchronized`.\n* Any composite\
    \ operation that invokes multiple methods, needs to be handled with locking the\
    \ operation at client side.\n* Examples of synchronized collections are `HashTable`,\
    \ `HashSet` and synchronised `HashMap`.\n\n### Collection Concurrency\n\n* `Collection\
    \ concurrency` is achieved by allowing simultaneous access to collection from\
    \ multiple threads.\n* `ConcurrentHashMap` implements very fine grained locking\
    \ on collection by partitioning the collection into multiple buckets based on\
    \ hash-code and using different locks to guard each hash bucket.\n* The performance\
    \ is significantly better because it allows multiple concurrent writers to the\
    \ collection at a time, without locking the entire collection.\n* Examples of\
    \ concurrent collection are `ConcurrentHashMap`, `CopyOnWriteArrayList` and `CopyOnWriteHashSet`.\n\
    \nFor large collections prefer using concurrent collection like `ConcurrentHashMap`\
    \ instead of `HashTable`, as performance of `Concurrent` collection will be better\
    \ due to less locking overhead.\n\nNote that in `multi-threaded scenarios`, where\
    \ there are inter-operation dependencies, you still need to provide synchronized\
    \ access to these composite operations on concurrent collections, as depicted\
    \ below:\n\n```java\nObject synchObject = new Object();\n\nConcurrentHashMap<String,\
    \ Account> map = new ConcurrentHashMap<>();\n\npublic void updateAccount(String\
    \ userId){\n synchronized (synchObject) {\n Account userAccount = map.get(userId);\n\
    \ if (userAccount != null) {\n //// some operation }\n }\n}\n```\n\n## Questions\n\
    \n* What is the purpose of Synchronized and Concurrent collections?\n* What is\
    \ collection synchronization?\n* What is collection concurrency?\n* How do you\
    \ achieve collection synchronization?\n* In case of composite operation, which\
    \ needs to invoke multiple methods to complete the operation, how can you ensure\
    \ synchronized access to a collection?\n* How do you achieve collection concurrency?\n\
    * How does `ConcurrentHashMap` provides concurrent access to multiple threads?\n\
    * Why performance of `ConcurrentHashMap` is better despite the fact that it allows\
    \ simultaneous writes from multiple threads?\n* Which one would you prefer between\
    \ `ConcurrentHashMap` and `HashTable`? Why?\n\n## Iterating Over Collections\n\
    \nThere are several ways to iterate over a `collection` in Java. Following are\
    \ the most common methods.\n\n### Iterable.forEach\n\n`forEach` method is available\
    \ with the collections that implements `Iterable` interface. `forEach` method\
    \ takes a parameter of type `Consumer`.\n\n```java\nList<Account> accounts = Arrays.asList(new\
    \ Account(123), new Account(456));\naccounts.forEach(acc -> *print(acc));\n```\n\
    \n### for-each looping\n\n* `for-each` loop can be used to loop `map.entrySet()`\
    \ to get key and value both.\n\n```java\nfor (Map.Entry<String, Account> accountEntry\
    \ : map.entrySet()) {\n *print(\"UserId - \" + accountEntry.getKey() + \", Account\
    \ - \" + accountEntry.getValue());\n}\n```\n\n* `for-each` loop can be used to\
    \ loop `map.keySet()` to get keys.\n* `for-each` loop can be used to loop `map.values()`\
    \ to get values.\n* While running a `for-each` loop, collection cannot be modified.\n\
    * `for-each` loop can only be used to navigate forward.\n\n### Iterator\n\n* `Iterator`\
    \ has an ability to move in both `backward` and `forward` directions.\n* You can\
    \ remove entries during an iteration when using an `Iterator`, which is not possible\
    \ when you `for-each` loop.\n* `for-each` also uses `Iterator` internally.\n\n\
    ```java\nIterator<Map.Entry<String, Account>> accountIterator = map.entrySet().iterator();\n\
    \nwhile (accountIterator.hasNext()){\n Map.Entry<String, Account> accountEntry\
    \ = accountIterator.next();\n *print(\"UserId - \" + accountEntry.getKey() + \"\
    , Account - \" + accountEntry.getValue());\n}\n```\n\n### Notes\n\n* `For-each\
    \ loop should be preferred over `for` loop, as `for` loops are source of errors,\
    \ specifically related to index calculations.`\n* `Iterator` is considered to\
    \ be more thread safe because it throws exception if the collection changes while\
    \ iterating.`\n\n## Data Independent Access\n\nThe code should be written in such\
    \ a way that client code should `not` be aware of the internal structure used\
    \ to store the collection. This enables making internal changes without breaking\
    \ any client code. So to facilitate `data independent access` to the collection,\
    \ it must be exposed such that an `Iterator` can be used to iterate through all\
    \ the elements of the collection.\n\n## Questions\n\n* Explain different ways\
    \ to iterate over collection?\n* Can you modify collection `structure` while iterating\
    \ using `for-each` loop?\n* Can you modify a collection `element` value while\
    \ iterating using `for-each` loop?\n* What are the limitations with `for-each`\
    \ loop, with respect to navigation direction?\n* What is difference between `for-each`\
    \ loop and `Iterator`, with respect to navigation direction?\n"
