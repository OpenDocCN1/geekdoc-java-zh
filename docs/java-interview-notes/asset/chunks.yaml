  trans: "\n\n`Auto boxing`（自动装箱）是将基本类型到对象的自动转换，这涉及动态内存分配和相应包装类对象的初始化。`Auto unboxing`（自动拆箱）是将包装类到基本类型的自动转换。\n\
    \n在下面的代码中，值 `23.456f` 被 `auto boxed` 为对象 `Float(23.456f)`，而从 `addTax()` 返回的值被\
    \ `auto unboxed` 为 `float`。\n\n```java\npublic static void main(String [] args){\n\
    \    float beforeTax = 23.456f;\n    float afterTax = addTax(beforeTax);\n}\n\n\
    public static Float addTax(Float amount){\n    return amount * 1.2f;\n}\n```\n\
    \n### Questions\n* 什么是自动装箱和自动拆箱？\n* 自动装箱的优点是什么？\n\n## BigInteger 和 BigDecimal\n\
    \n`BigInteger` 和 `BigDecimal` 用于处理大于 `Long.MAX_VALUE` 和 `Double.MAX_VALUE` 的值。这些大值以\
    \ String 值的形式传递给 `BigInteger` 和 `BigDecimal` 的构造函数。`BigDecimal` 支持工具方法来指定所需的舍入方式和要应用的精度。\n\
    \n```java\nBigInteger bInt = new BigInteger(\"9876543210987654321098765\");\n\
    ```\n\n`BigInteger` 和 `BigDecimal` 对象都是不可变的，因此对它们进行的任何操作都会创建一个新对象。`BigInteger`\
    \ 主要用于加密和安全性应用。\n\n### Questions\n* `BigInteger` 和 `BigDecimal` 是什么类型？\n* `BigInteger`\
    \ 和 `BigDecimal` 的值内部是如何存储的？\n* `BigInteger` 的用途是什么？\n\n## STRINGS\n\n### String\
    \ 的不可变性\n\n`String` 对象是`immutable`（不可变的），这意味着一旦构造，`String` 引用所指向的对象就永远无法改变。尽管你可以将相同的引用分配另一个\
    \ `String` 对象。\n\n考虑以下示例：\n```java\nString greeting = \"Happy\"; greeting = greeting\
    \ + \" Birthday\";\n```\n\n上面的代码创建了三个不同的 `String` 对象：\"Happy\"、Birthday\" 和 \"\
    Happy Birthday\"。\n\n![Image](img/image00212.jpeg)\n\n* 虽然你不能更改 `String` 对象的值，但你可以更改指向该对象的引用变量。在上面的示例中，`String`\
    \ 引用 `greeting` 开始指向 String 对象 \"Happy Birthday\"。\n* 注意，对 `String` 执行的任何操作都会导致创建新的\
    \ `String` 对象。\n* `String` 类被标记为 `final`，因此无法重写 `String` 类的不可变行为。\n\n#### Advantages\n\
    * 由于对 `String` 对象不需要同步，因此在线程之间共享 `String` 对象是安全的。\n* `String` 一旦创建就不会改变。为了利用这一事实进行内存优化，Java\
    \ 环境将 `String` 字面量缓存到内存中的一个特殊区域，称为 String Pool（字符串常量池）。如果池中已存在该 String 字符串字面量，则共享相同的字符串字面量。\n\
    * 不可变的 `String` 值可以防止执行期间发生任何值的更改。\n* 由于 `String` 对象的 `hash-code` 不改变，因此可以缓存 `hash-code`\
    \ 而不需要在每次需要时都重新计算。\n\n#### Disadvantages\n* `String` 类无法扩展以提供额外功能。\n* 如果创建大量的\
    \ `String` 字面量，或者由于任何字符串操作，都会给 `Garbage Collector（垃圾回收器）`带来负载。\n\n#### Questions\n\
    * 为什么 String 对象被认为是不可变的？\n* String 对象在内存中是如何创建的？\n* String 不可变性的优缺点是什么？\n* 为什么\
    \ String 对象被认为是线程安全的？\n* 声明 `String` 类为 `final` 的优点是什么？\n* Java 环境对 Strings 执行了哪些内存优化？\n\
    * 为什么你不需要每次使用 String 对象时都计算 hash-code？\n\n## 字符串字面量 vs 对象\n\n### 字符串字面量 (String\
    \ Literal)\n`String literal`（字符串字面量）是 Java 语言中的概念，`String` 类经过优化，将所有在`\"双引号\"\
    `中创建的 `Strings` 缓存到一个名为 `String Pool（字符串常量池）`的特殊区域。\n\n```java\nString cityName\
    \ = \"London\";\n```\n\n### String 对象 (String Object)\n`String object` 使用 `new()`\
    \ 操作符创建，像任何其他引用类型对象一样创建在堆中。\n\n```java\nString cityName = new String(\"London\"\
    );\n```\n\n### Questions\n* 什么是字符串字面量？\n* 字符串字面量和 String 对象之间的区别是什么？\n* 字符串字面量是如何存储的？\n\
    \n### 字符串池化 (String Interning)\n`String interning`（字符串池化）是一个存储每个不同不可变 `String`\
    \ 值唯一副本的概念。\n* 当你定义任何新的 `String literal` 时，它会被 `interned`（池化）。池中相同的 `String` 常量会被任何重复的\
    \ String 字面量引用。\n* `String pool` 中的字面量不仅在编译时定义，而且在运行时定义。你可以显式地对 String 对象调用 `intern()`\
    \ 方法将其添加到 String Pool 中（如果它尚未存在）。\n* 在内存池中放置大量的文本可能会导致 `memory leak（内存泄漏）` 和/或\
    \ `performance issue（性能问题）`。\n\n*注意：优先使用字符串字面量而不是 String 对象，以便编译器可以对其进行优化。*\n\n\
    ### Questions\n* 什么是字符串池化？\n* 你如何对 String 对象进行池化？\n* 当你存储一个已经在字符串池中存在的新 String\
    \ 字面量值时会发生什么？\n* 创建大量 String 字面量的缺点是什么？\n* 哪种更好：String 对象还是字面量？\n\n## 字符串池内存管理\n\
    `String pool`（字符串池）是 Java 编译器用于 String 优化的内存中的特殊区域。如果池中已存在 String 字面量，编译器将引用现有对象而不是创建字面量，因为\
    \ String 是不可变的。\n\n在下面的示例中，两个 String 对象是不同的并存储在 Heap（堆）。\n\n```java\nString cityNameObj\
    \ = new String(\"London\");\nString capitalObj = new String(\"London\");\n```\n\
    ![Image](img/image00213.jpeg)\n\n而在下面的示例中，两个 String 字面量引用内存中的同一个对象。\n\n```java\n\
    String cityName = \"London\";\nString capital = \"London\";\n```\n![Image](img/image0214.jpeg)\n\
    \n### Questions\n* 解释字符串池内存管理？\n* 字符串字面量是如何存储在内存中的？\n* 字符串池是如何优化的？\n* String 对象是如何存储在内存中的？\n\
    * 为什么 Java 不能使用类似于 String 池的机制来存储其他类型对象？\n\n## 不可变 - 安全问题\n从内存中清除 String 对象是`Garbage\
    \ Collector（垃圾回收器）` 的职责；虽然你也可以使用 reflection（反射）这样做，但不建议这样做。\n\n由于 String 为了重用保留在\
    \ `String Pool` 中，它们可能会持续很长时间。由于 String 是不可变的且值无法更改，内存转储或意外记录此类 String 可能会暴露存储其中的敏感内容。\n\
    \n因此，建议使用字符数组 (`char[]`) 来存储此类敏感信息，可以显式覆盖内容，从而减少攻击机会。\n\n### Questions\n* 如何从字符串池清除字符串字面量？\n\
    * 你可以使用反射清除 String 对象吗？\n* 与不可变 String 相关的安全问题有哪些？\n* 为什么不要使用 String 存储密码、访问密钥等敏感信息？\n\
    * 为什么建议使用字符数组存储密码而不是 String？\n\n"
