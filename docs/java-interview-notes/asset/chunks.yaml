    # Introduction


    Introduction


    *Java Interview Notes* cover topics that are frequently discussed during Java
    technical round, along with interview questions for each topic.


    To be confident in an interview, thorough understanding of software design and
    language concepts is very important, because during an interview same question
    can be asked in many different ways.


    Your approach towards understanding the questions and sharing your thoughts plays
    an extremely important role in an interview success.


    Confidence to face such interview can only be achieved when you spend really good
    amount of time coding, reading technical topics and discussing this with peers.
    There is no other shortcut available.


    I hope this book helps to prepare you not only for your next interview, but also
    for your day-to-day software development task.


    All the best!!!


    # JAVA


    ## Java Fundamentals


    ### Java Program Anatomy


    The following code snippet depicts the anatomy of simple Java program.


    ![Image](OEBPS/Images/image00207.jpeg)


    - `package` - Represents logical grouping of similar types into namespaces. It
    also prevents naming collision and provides access protection.

    - `import` - Imports the package, so that classes can be used in the code by their
    unqualified names.

    - `class` - Represents a type template having properties and methods.

    - `field` - Represents a member used for holding values.

