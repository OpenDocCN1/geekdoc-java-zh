  trans: "\n\n# 注意\n\n两个不相等的对象可能具有相同的哈希值（hash-code）。\n\n## `hashCode()` 和 `equals()`\
    \ 的用法\n\n* `hashCode()` 和 `equals()` 方法用于将项隔离开不同的桶（buckets）中，以提高查找效率。如果两个 `Items`\
    \ 具有相同的哈希值，那么它们将将被存储在**同一个桶**中，并通过链表连接。\n* 如果两个对象的哈希值不同，则不会调用 `equals()` 方法；否则，会调用\
    \ `equals()` 方法来比较它们是否相等。\n\n下图构性地从概念上展示了对象在哈希桶中的存储情况。\n\n![Image](img/image00216.jpeg)\n\
    \n## 问题\n\n* Java 中哪些使用了 `hashCode` 和 `equals` 方法的不同集合类型？为什么这些集合类型需要使用 `hashCode`\
    \ 和 `equals` 方法？\n* 当你重写 `hashCode()` 方法时，为什么要也重写 `equals()` 方法？\n* 既然 `java.lang.Object`\
    \ 类中已经存在 `hashCode()` 方法，为什么你还需要重写它？\n* 为什么对象在整个生命周期内每次都要返回相同的哈希值？\n* 对象在每次程序运行时都必须返回相同的哈希值吗？\n\
    * 两个相等的对象是否必须返回相同的哈希值？\n* 两个对象即使不相等，是否仍可能具有相同的哈希值？\n* 计算哈希值的目的是什么？\n* `equals`\
    \ 方法的作用是什么？\n* 如果两个对象具有相同的哈希值，它们是如何存储在哈希桶中的？\n* 如果两个对象的哈希值不同，你还需要 `equals` 方法吗？\n\
    * 如果两个对象具有相同的哈希值，`equals` 方法是如何使用的？\n\n## HashTable vs HashMap\n\n`HashTable`\
    \ 和 `HashMap` 是用于存储**键值对（key-value pair）**的数据结构。它们维护一个桶数组，每个元素根据键对象的哈希值添加到相应的桶中。\n\
    \n它们之间的主要区别在于 `HashMap` 是**非同步的**（non-synchronized）。这使得 `HashMap` 更适用于单线程应用程序，因为由于缺少锁定开销，非同步的\
    \ `Objects` 性能优于同步的对象。在多线程应用中应该使用 `HashTable`。\n\n可以使用以下方法将 HashMap 转换为同步集合：\n\
    \n`Collections.synchronizedMap(idToNameMao);`\n\n## 问题\n\n* `HashTable` 和 `HashMap`\
    \ 的目的是什么？\n* `HashTable` 和 `HashMap` 之间有什么区别？\n* `HashTable` 和 `HashMap 是如何存储对象的？\n\
    * 为什么 `HashMap` 更适合单线程应用程序？\n* 为什么 `HashMap` 的性能比 `HashTable` 好？\n* 如何在多线程环境中使用\
    \ `HashMap`？\n\n## 同步集合与并发集合\n\n`synchronized`（同步）和 `concurrent`（并发）集合类提供了线程安全性，但它们之间的主要区别在于可扩展性和性能。\n\
    \n### 集合同步（Collection Synchronization）\n\n* `集合同步`通过允许一次**仅**单个线程访问集合来实现。\n* 它通过将所有公共方法标记为\
    \ `synchronized` 来实现。\n* 任何调用多个方法的复合操作，都需要在客户端通过锁定该操作来处理。\n* 同步集合的示例包括 `HashTable`、`HashSet`\
    \ 和同步后的 `HashMap`。\n\n### 集合并发（Collection Concurrency）\n\n* `集合并发`通过允许多个线程同时访问集合来实现。\n\
    * `ConcurrentHashMap` 通过根据哈希值将集合划分为多个桶，并使用不同的锁来保护每个哈希桶，从而对集合实现了非常细粒度的锁定。\n* 它的性能显著更好，因为它允许多个并发写入者同时访问集合，而无需锁定整个集合。\n\
    * 并发集合的示例包括 `ConcurrentHashMap`、`CopyOnWriteArrayList` 和 `CopyOnWriteHashSet`。\n\
    \n对于大型集合，应倾向于使用 `ConcurrentHashMap` 等并发集合而不是 `HashTable`，因为由于锁定开销较小，并发集合的性能会更好。\n\
    \n注意，在存在操作间依赖的**多线程场景**中，你仍然需要为并发集合上的这些复合操作提供同步访问，如下所示：\n\n```java\nObject synchObject\
    \ = new Object();\n\nConcurrentHashMap<String, Account> map = new ConcurrentHashMap<>();\n\
    \npublic void updateAccount(String userId){\n synchronized (synchObject) {\n Account\
    \ userAccount = map.get(userId);\n if (userAccount != null) {\n //// 某些操作 }\n\
    \ }\n}\n```\n\n## 问题\n\n* 同步和并发集合的目的是什么？\n* 什么是集合同步？\n* 什么是集合并发？\n* 你如何实现集合同步？\n\
    * 在需要调用多个方法完成操作的复合操作情况下，如何确保对集合的同步访问？\n* 你如何实现集合并发？\n* `ConcurrentHashMap` 如何为多个线程提供并发访问？\n\
    * 尽管允许从多个线程同时写入，为什么 `ConcurrentHashMap` 的性能仍然更好？\n* 在 `ConcurrentHashMap` 和 `HashTable`\
    \ 之间你更倾向于哪一个？为什么？\n\n## 遍历集合\n\nJava 中有几种方法可以遍历 `collection`（集合）。以下是最常见的方法。\n\n\
    ### Iterable.forEach\n\n`forEach` 方法在实现了 `Iterable` 接口的集合中可用。`forEach` 方法接受一个\
    \ `Consumer` 类型的参数。\n\n```java\nList<Account> accounts = Arrays.asList(new Account(123),\
    \ new Account(456));\naccounts.forEach(acc -> *print(acc));\n```\n\n### for-each\
    \ 循环\n\n* `for-each` 循环可以用于遍历 `map.entrySet()` 以获取键值。\n\n```java\nfor (Map.Entry<String,\
    \ Account> accountEntry : map.entrySet()) {\n *print(\"UserId - \" + accountEntry.getKey()\
    \ + \", Account - \" + accountEntry.getValue());\n}\n```\n\n* `for-each` 循环可以用于遍历\
    \ `map.keySet()` 获取键。\n* `for-each` 循环可以用于遍历 `map.values()` 获取值。\n* 在运行 `for-each`\
    \ 循环期间，不能修改集合。\n* `for-each` 循环只能向前导航。\n\n### Iterator（迭代器）\n\n* `Iterator` 具有向**后**和**向前**移动的能力。\n\
    * 使用 `Iterator` 可以在迭代期间删除项，这在在使用 `for-each` 循环时是不行的。\n* `for-each` 内部也使用了 `Iterator`。\n\
    \n```java\nIterator<Map.Entry<String, Account>> accountIterator = map.entrySet().iterator();\n\
    \nwhile (accountIterator.hasNext()){\n Map.Entry<String, Account> accountEntry\
    \ = accountIterator.next();\n *print(\"UserId - \" + accountEntry.getKey() + \"\
    , Account - \" + accountEntry.getValue());\n}\n```\n\n### 注意事项\n\n* 应优先使用 `for-each`\
    \ 循环代替 `for` 循环，因为 `for` 循环是错误的根源，特别是与索引计算相关的错误。\n* `Iterator` 被认为更安全，因为它在集合发生变化时会抛出异常。\n\
    \n## 数据无关访问（Data Independent Access）\n\n代码的编写方式使得客户端代码**不应**感知存储集合的内部结构。这使得可以在不破坏客户端代码的情况下进行内部更改。因此，为了方便对集合进行“数据无关访问”，必须暴露集合以便可以使用\
    \ `Iterator` 遍历集合的所有元素。\n\n## 问题\n\n* 遍历集合的不同方法？\n* 在使用 `for-each` 循环时，可以修改集合结构吗？\n\
    * 在使用 `for-each` 循环时，可以修改元素的值吗？\n* `for-each` 循环在导航方向上有什么局限性？\n* `for-each` 循环和\
    \ `Iterator` 在导航方向上有什么区别？\n\n"
- fmt: "\n- Can you modify collection structure while iterating using an `Iterator`?\n\
    - Can you modify a collection element value while iterating using an `Iterator`?\n\
    - Between for-each loop and for loop, which one would you prefer? Why?\n- Why\
    \ `Iterators` are considered more thread safe?\n- Explain the concept of providing\
    \ `Data Independent Access` to collection?\n- How can you design your class to\
    \ provide Data Independent Access to the collections that are internally used\
    \ in your class? \n\n## Fail Fast\n\n`Iterator` methods are considered `fail-fast`\
    \ because `Iterator` guards against any structural modification made to the collection,\
    \ after an iterator is retrieved for the collection. This ensures that any failure\
    \ is reported quickly, rather than the application landing into a corrupt state\
    \ some time later. In such scenario, `ConcurrentModificationException` is thrown.\
    \ \n\nIterators from `java.util` are fail fast.\n\n### Questions\n\n- What is\
    \ the meaning of term fail-fast in context of collection iteration?\n- What is\
    \ the benefit of a fail-fast iterator?\n- What are fail safe iterator?\n    -\
    \ Fail safe iterator doesn't throw any `Exception` when collection is modified,\
    \ because fail safe iterator works on a clone of original collection. Iterators\
    \ from `java.util.concurrent` package are fail safe iterators.\n\n## ERROR AND\
    \ EXCEPTION\n\n### EXCEPTION\n\nException class hierarchy in java:\n\n![Image](OEBPS/Images/image00217.jpeg)\n\
    \n- `Exception` is an `abnormal situation` that interrupts the flow of program\
    \ execution. \n- All exceptions inherit from `Throwable`. \n- You subclass `Exception`\
    \ class if you want to create a `checked` exception or `RuntimeException` if you\
    \ want to create `unchecked` exception. \n- Though you can theoretically subclass\
    \ `Throwable` class too to create `checked` exception, but that's not recommended,\
    \ as `Throwable` is superclass for all exceptions and errors in Java.\n\n### Questions\n\
    \n- What is an `Exception`?\n- Explain root level exception super classes in Java?\
    \ \n- Which super class should you sub class to create checked exception?\n- Which\
    \ super class should you sub class to create unchecked exception?\n\n## Checked\
    \ vs Unchecked vs Error\n\n### Checked Exception\n\n- `Checked exceptions` are\
    \ checked at compile time.\n- Checked exceptions extend `Throwable` or its sub-classes,\
    \ except `TimeException` and `Error` classes.\n- Checked exceptions are programmatically\
    \ recoverable.\n- You can handle checked exception either by using `try/catch`\
    \ block or by using `throws` clause in the method declaration.\n- Static initializers\
    \ cannot throw checked exceptions. \n\n```java\npublic static void main(String\
    \ args[]) {\n    FileInputStream fis = null;\n    try {\n        fis = new FileInputStream(\"\
    details.txt\");\n    } catch (FileNotFoundException fnfe) {\n        System.out.println(\"\
    Missing File :\" + fnfe);\n    }\n}\n```\n\n### Unchecked Exception\n\n- `Unchecked\
    \ exceptions` are checked at runtime.\n- Unchecked exceptions extend `RuntimeException`\
    \ class.\n- You cannot be reasonably expected to recover from these exceptions.\n\
    - Unchecked exceptions can be avoided using good programming techniques.\n- Throwing\
    \ unchecked exception helps to uncover lots of defects.\n\n```java\npublic int\
    \ getAccountBalance(String customerName) {\n    int balance = 0;\n    if (customerName\
    \ == null)\n        throw new IllegalArgumentException(\"Null argument\");\n \
    \   // logic to return calculate balance \n    return balance;\n}\n```\n\n###\
    \ Error\n\n- `Error` classes are used to define `irrecoverable and fatal exceptions`,\
    \ which applications are not supposed to catch.\n- Programmers cannot do anything\
    \ with these exceptions.\n- Even if you catch `OutOfMemoryError`, you will get\
    \ it again because there is high probability that the Garbage Collector may not\
    \ be able to free memory.\n- Use `checked` exception only for the scenario where\
    \ failure is expected and there is a very reasonable way to recover from it; for\
    \ anything else use `unchecked` exception. \n\n### Questions\n\n- What are checked\
    \ exceptions?\n- What are unchecked exceptions?\n- What types of exceptions does\
    \ the `Error` class in Java defines?\n- How can you handle checked exceptions?\n\
    - What happens if an exception is un-handled?\n- What are the different ways to\
    \ handle checked exceptions?\n- Which exception classes can you use in the `catch`\
    \ block to handle both checked and unchecked exceptions?\n- How do you make choice\
    \ between checked and unchecked exceptions?\n- Can you recover from unchecked\
    \ exception?\n- How can you avoid unchecked exception?\n- Can you throw checked\
    \ exceptions from static block? Why?\n    - You cannot throw because there is\
    \ no specific place to catch it and it's called only once. You have to use `try/catch`\
    \ to handle checked exception.\n- What should you do to handle an `Error`?\n\n\
    ## Exception Handling Best Practices\n\nEven though exception handling is primarily\
    \ driven by context, but it's very important that there must be a consistency\
    \ in the exception handling strategy. Following are few exception handling best\
    \ practices:\n\n1. Never suppress an exception - as it can lead your program to\
    \ unsafe and unstable state. \n2. Don't perform excessive exception handling -\
    \ specifically when you do not know how to completely recover from it.\n3. Never\
    \ swallow an exception - as it may lead the application into an inconsistent state,\
    \ and even worst, without recording reason for it.\n4. Don't catch and continue\
    \ program execution - with some default behaviour. Default behaviour defined today\
    \ may not be valid in future.\n5. Don't show generic error message to user - instead\
    \ clean the exception handling to report user-friendly message with suggestion\
    \ about the next step.\n6. Don't put more than one exception scenarios in single\
    \ `try` catch - as it will be impossible to ascertain reason for the exception.\n\
    7. Don't catch multiple exceptions in single `catch` block - as it will be impossible\
    \ to ascertain reason for the exception.\n8. Don't unnecessarily wrap the exception\
    \ - which may mask the true source. \n9. Don't reveal sensitive information -\
    \ instead sanitize exceptions generated specifically from the sources that may\
    \ reveal information.\n10. Always log exception - unless there is compelling reason\
    \ not to do.\n11. Don't catch `Throwable` - as it will be impossible to ascertain\
    \ reason for the exception.\n12. Don't use exception to control the flow of execution\
    \ - instead use boolean to validate a condition where possible.\n13. Handle different\
    \ scenarios programmatically - instead of putting all logic in `try` block.\n\
    14. Explicitly name the threads - in a multithreaded application, it significantly\
    \ eases the debugging.\n15. Never throw a generic exception - as it will be impossible\
    \ to ascertain reason for the exception.\n\n### Questions\n\n- Describe some exception\
    \ handling best practices?\n- What are the pitfalls of suppressing an exception?\n\
    - What is the problem with showing a generic error message?\n- What is the downside\
    \ of swallowing an exception?\n- What are the pitfalls of handling multiple exceptions\
    \ in a single `catch` block?\n- What would you do if an exception is thrown from\
    \ a source that contains sensitive information? What would you log in such case\
    \ and what message would you show to the user?\n- What is the pitfall of wrapping\
    \ all the exceptions into a Generic exception class?\n\n### try-with-resource\n\
    \n`try-with-resource` is Java language construct, which makes it easier to automatically\
    \ close the resources enclosed within the `try` statement. \n"
