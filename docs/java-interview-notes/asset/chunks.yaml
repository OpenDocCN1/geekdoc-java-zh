    \ EnumSet.of(Vehicle.MOTORCYCLE, SCOOTER);\n    if(TWOWHEELERS.contains(Vehicle.MOTORCYCLE)){\n\
    \    }\n}\n```\n\n### Questions\n\n- What is `EnumSet`?\n- Why should you prefer\
    \ `EnumSet` for performing bit flag operations?\n\n# Comparing Types\n\n`Primitive\
    \ types` can be compared only using equality operators (`==` and `!=`); whereas\
    \ `Reference Types` can be compared using both equality operator and `equals()`\
    \ method, depending upon what we want to compare.\n\n## Equality Operators\n\n\
    For reference types, equality operators `==` and `!=` are used to compare the\
    \ addresses of two objects in memory and not their actual content.\n\n## .equals()\
    \ Method\n\nWhen you want to compare the content of two objects, `equals()` method\
    \ must be used. `java.lang.Object` class in Java defines `equals()` method, which\
    \ must be overridden by subclasses to facilitate content comparison between its\
    \ objects. If `equals()` method is not overridden by a class, then `equals()`\
    \ method of the `java.lang.Object` class is called, which uses equality operator\
    \ to compare references.\n\n### Questions\n\n- What are the different ways to\
