    \ in Java inherit the base hash scheme from *java.lang.Object* base class, unless\
    \ they override the *hashCode()* method.\n\n*   Any class that overrides *hashCode()*\
    \ method is supposed to override *equals()* method too.\n\nImplementation of hashCode()\
    \ and equals()\n\nfinal public class Employee {\n\n final private int id;\n\n\
    \ final private String name;\n\n final private String department;\n\n @Override\
    \ public boolean equals(Object o) {\n\n if (this == o) return true;\n\n if (o\
    \ == null || getClass() !=\n\n o.getClass())\n\n return false;\n\n Employee employee\
    \ = (Employee) o;\n\n if (id != employee.id) return false;\n\n if (name != null\
    \ ?\n\n !name.equals(employee.name) :\n\n employee.name != null)\n\n return false;\n\
    \n return !(department != null ?\n\n !department.equals(employee.department) :\n\
    \n employee.department != null);\n\n }\n\n @Override public int hashCode() {\n\
    \n int result = id;\n\n result = 31 * result +\n\n (name != null ?\n\n name.hashCode()\
    \ :\n\n 0);\n\n result = 31 * result +\n\n (department != null ?\n\n department.hashCode()\
    \ :\n\n 0);\n\n return result;\n\n }\n\n}\n\nRules of hashCode and equals\n\n\
    *   Once an object is created, it must always report the same hash-code during\
    \ its lifetime.\n\n*   Two equal objects of same class must return the same hash-code."
