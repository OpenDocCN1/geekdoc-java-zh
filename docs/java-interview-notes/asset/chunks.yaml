  trans: "\n\n```java\nField field = String.class.getDeclaredField(\"value\");\n\n\
    field.setAccessible(true);\n\nchar[] value = (char[])field.get(accountNo); \n\n\
    // Overwrite the content\n\nvalue[0] = 'X';\n\nvalue[1] = 'Y';\n\nvalue[2] = 'Z';\n\
    \n// Prints \"XYZ123\"\nSystem.out.println(accountNo);\n```\n\n### 问题\n- 你是否可以重写\
    \ String 类来修改它的不可变性？\n- 技术上是否可能绕过字符串的不可变性？\n- 是否推荐使用反射来绕过字符串的不可变性？为什么？\n\n## StringBuilder\
    \ vs StringBuffer\n\n### 相同点\n- `StringBuilder` 和 `StringBuffer` 对象都是可变的，因此它们都允许\
    \ String 值的改变。\n- 这两个类的对象都创建并存储在堆中。\n- 这两个类都提供了相似的方法。\n\n### 不同点\n- `StringBuffer`\
    \ 的方法是同步的（`synchronized`），因此它是线程安全的，而 `StringBuilder` 则。\n- `StringBuilder` 的性能明显优于\
    \ `StringBuffer`，因为 `StringBuilder` 没有同步开销。\n\n**注意：如果你需要在多个线程之间共享 String 对象，请使用\
    \ `StringBuffer`，否则使用 `StringBuilder`。**\n\n### 问题\n- `StringBuffer` 和 `StringBuilder`\
    \ 之间有什么相同点和不同？\n- 在什么情况下你会倾向于使用 `StringBuffer` 而不是 `StringBuilder`？\n- 在单线程应用中，你倾向于\
    \ `StringBuffer` 还是 `StringBuilder`？\n\n## Unicode\n`Unicode` 是国际标准字符编码系统，代表了世界上大多数的语言。在\
    \ `Unicode` 之前，存在多种流行的编码系统：`ASCII`、`KOI8`、`ISO 8859` 等，每个编码系统都有自己的代码值和字符集，长度不同。为了解决这个问题，创建了一个统一的标准，即\
    \ `Unicode`。`Unicode` 为每个字符提供了与平台和语言无关的数字。\n\n### 问题\n- 什么是 Unicode 字符？\n- 使用\
    \ Unicode 字符有什么优势？\n- 旧编码系统存在什么问题？\n\n## 内部类 (INNER CLASSES)\n\n### 内部类\n- `Inner\
    \ Class`（内部类）——是另一个类内部的类。\n- `Outer Class`（外部类）——是包含内部类的包围类。\n\n### 注意\n- 编译器为每个内部类生成单独的类字节文件。\n\
    \n### 内部类的优点\n- 使用内部类实现回调函数非常简单。\n- 内部类可以访问其包围类的私有成员，而即使是继承类也无法访问这些。\n- 内部类有助于实现闭包（`closures`）；闭包使得周围的作用域和包围实例可访问。\n\
    - **外部类为内部类提供了额外的命名空间。**\n\n### 问题\n- 什么是内部类？\n- 什么是外部类？\n- 定义内部类有什么优势？\n- 什么是闭包？如何使用内部类创建闭包？\n\
    - 什么是回调函数？如何使用内部类创建回调函数？\n- 内部类可以访问包围外部类的私有成员吗？\n- 外部类带来了什么好处？\n\n### 静态成员嵌套类\n\
    - `Static nested class`（静态嵌套类）像其他成员一样，在类内部被声明为 `static`。\n- `Static nested class`\
    \ 是独立的，与外部类无关。它通常嵌套在一起是为了与外部类放在一起。\n- 它可以被声明为 `public`、`private`、`protected` 或包级可见。\n\
    \n#### 静态嵌套类的声明\n```java\n// 外部类\npublic class Building { \n    // 静态成员内部类\n \
    \   public static class Block{\n    }\n}\n```\n\n#### 创建静态嵌套类的对象\n```java\n//\
    \ 静态成员内部类的实例\nBuilding.Block block = new Building.Block();\n```\n\n### 问题\n- 什么是静态嵌套类？\n\
    - 如果嵌套类或独立的静态类是相同的，那么将内部类定义为 `static` 有什么好处？\n\n### 局部内部类\n- `Local inner class`（局部内部类）在方法块内部被声明和使用。\n\
    - 它不能被声明为 `public`、`private`、`protected` 或包级可见。\n\n#### 创建局部内部类\n```java\n// 外部类\n\
    public class CityNames { \n    private List<String> cityNames = new ArrayList<>();\
    \ \n    public Iterator<String> nameIterator(){ \n        // 局部内部类 \n        class\
    \ NameIterator implements Iterator<String> { \n            @Override \n      \
    \      public boolean hasNext() { \n                return false;\n          \
    \  } \n            @Override \n            public String next() { \n         \
    \       return null;\n            }\n        } \n        // 返回局部内部类的实例。 \n   \
    \     return new NameIterator();\n}\n}\n}\n```\n\n### 注意\n- 如果要在外部使用该内部类，局部内部类必须实现一个公共接口或继承一个公共类并重写方法以重新定义某些特性。\n\
    \n### 问题\n- 内部类和局部内部类有什么区别？\n- 为什么不能对局部内部类使用访问修饰符？\n- 解释定义局部内部类的规则？\n- 局部内部类解决了什么问题？\n\
    \n### 非静态嵌套类\n- `Non-static nested class`（非静态嵌套类）像其他成员一样在类内部被声明。\n- 可以被声明为 `public`、`private`、`protected`\
    \ 或包级可见。\n- 非静态嵌套类实际上是闭包，因为它们可以访问包围实例。\n- 创建非静态内部类的对象需要外部类的对象。\n\n#### 非静态嵌套类的声明\n\
    ```java\n// 外部类\npublic class Building { \n    // 非静态成员内部类 \n    public class\
    \ Block{\n    }\n}\n```\n\n#### 创建非静态嵌套类的对象\n```java\n// 外部类的实例\nBuilding building\
    \ = new Building(); \n// 非静态成员内部类\nBuilding.Block block = new Block();\n```\n\n\
    ### 问题\n- 什么是非静态嵌套类？\n- 为什么非静态嵌套类可以作为闭包使用？\n- 可以在没有定义外部类的情况下创建内部类吗？\n\n### 匿名内部类\
    \ (Anonymous Class)\n- 匿名内部类没有名字。\n- 匿名内部类同时被定义和创建。\n- 匿名内部类总是作为表达式的一部分使用 `new`\
    \ 操作。\n- 创建匿名类时，`new` 操作后面跟着现有的接口或类名。\n- 匿名类要么实现接口，要么继承现有类。\n\n#### 匿名内部类的创建\n\
    ```java\n// 外部类\npublic class CityNames { \n    private List<String> cityNames\
    \ = new ArrayList<>(); \n    public Iterator<String> nameIterator(){ \n      \
    \  // 匿名内部类 \n        Iterator<String> nameIterator = new Iterator<String> ()\
    \ { \n            @Override \n            public boolean hasNext() { \n      \
    \          return false;\n            } \n            @Override \n           \
    \ public String next() { \n                return null;\n            }\n     \
    \   }; \n        // 返回局部内部类的实例。 \n        return nameIterator;\n}\n}\n}\n```\n\
    \n### 注意\n- **不要返回内部类对象，因为这会导致内存泄漏，因为它持有对外部外部类的引用。**\n- **当你希望防止在其他地方使用该类时，使用匿名类。**\n\
    - **必须避免匿名类和内部类的序列化，因为不同的 JRE 实现可能会导致兼容性问题。**\n\n### 问题\n- 什么是匿名内部类？\n- 匿名内部类和局部内部类有什么区别？\n\
    - 为什么你不应该从方法返回内部类对象？\n- 如果你想防止别人在外部使用你的类，你会定义哪种内部类？\n- 为什么应该避免匿名类和内部类的序列化？\n\n\
    ## 函数式编程 (FUNCTIONAL PROGRAMMING)\n\n### 函数式接口\n`Functional Interface` 是只有一个抽象方法的接口；但可以有任意数量的默认方法。\n\
    \n```java\n@FunctionalInterface \npublic interface Greator<T> {\n    T greater(T\
    \ arg1, T arg2);\n}\n```\n\n注解 `@FunctionalInterface` 在接口不是有效的函数式接口时产生编译器警告。\n\
    \n### 函数式接口 Greater (Function Interface Greater)\n```java\n@FunctionalInterface\
    \ \npublic interface Greator<T> {\n    T greater(T arg1, T arg2);\n}\n```\n\n"
- fmt: "\n`Account` class, defined below, used as an argument to the functional interface\
    \ `Greater`.\n\n```java\npublic class Account {\n  private int balance;\n\n  public\
    \ Account(int balance) {\n    this.balance = balance;\n  }\n\n  public int getBalance()\
    \ {\n    return balance;\n  }\n\n  @Override \n  public String toString() {\n\
    \    return \"Account{\" +\n    \"balance=\" + balance +\n    '}';\n  }\n}\n```\n\
    \n### Lambda Expression\nCode below demonstrates the usage of `Lambda expression`\
    \ to find the account with the greater balance. Similarly same functional interface,\
    \ `Greater`, can be used to compare other similar business objects too.\n\n```java\n\
    public static void main(String [] args){\n  Greator<Account> accountComparer =\n\
    \  (Account acc1, Account acc2) ->\n  acc1.getBalance() > acc2.getBalance() ?\n\
    \  acc1 :\n  acc2;\n  Account account1 =\n  new Account(6);\n  Account account2\
    \ =\n  new Account(4);\n  System.out.println(\n  \" Account with greater balance:\
    \ \" + accountComparer.greater(account2, account1));\n}\n```\n\nJava also provides\
    \ set of predefined functional interfaces for most common scenarios.\n\n#### Questions\n\
    * What is Function Interface?\n* What are the benefits of using Functional Interface?\n\
    \n### Lambda Expression\n`Lambda expressions` provide a convenient way to create\
    \ [anonymous class]. `Lambda expressions` implements [`Functional Interface`]\
    \ more compactly. `Lambda Expressions` are primarily useful when you want to pass\
    \ some functionality as argument to another method and defer the execution of\
    \ such functionality until an appropriate time.\n\nLambda expression can be just\
    \ a block of statement with method body and optional parameter types, but without\
    \ method name or return type. It can be passed as a method argument and can be\
    \ stored in a variable.\n\n```java\n// lambda expressions\n() -> 123 (x,y) ->\
    \ x + y\n(Double x, Double y) -> x*y\n```\n\n#### Questions\n* What is Lambda\
    \ Expression?\n* How is Lambda Expression and Anonymous class related?\n* Can\
    \ you pass Lambda Expression as method parameter?\n* What is the meaning of deferred\
    \ execution of functionality, using a Lambda Expression?\n* What are the benefits\
    \ of using Lambda Expression?\n* How's Lambda Expression and Functional Interface\
    \ related?\n\n### Pure Functions\nPure functions are function whose results depend\
    \ only on the arguments passed to it and is neither affected by any state change\
    \ in the application nor it changes the state of the application. Pure functions\
    \ always return the same result for the same arguments.\n\n```java\npublic int\
    \ increaseByFive(int original){\n  int toAdd = 5;\n  return original + toAdd;\n\
    }\n```\n\n#### Questions\n* What is a Pure Function?\n* What is the use of Pure\
    \ Function in Functional Programming?\n* How is it guaranteed that the Pure Function\
    \ will always return the same results for the same arguments?\n\n### Fluent Interface\n\
    `Fluent interface` is used to transmit commands to subsequent calls, without a\
    \ need to create intermediate objects and is implemented by method chaining. The\
    \ `fluent interface` chain is terminated when a chained method returns `void`.\
    \ `Fluent interface` improves readability by reducing the number of unnecessary\
    \ objects created otherwise.\n\nIn the code below, `Fluent Interface` is used\
    \ to add a new Employee.\n\n```java\nemployee.create()\n  .atSite(\"London\")\n\
    \  .inDepartment(\"IT\")\n  .atPosition(\"Engineer\");\n```\n\nFluent interfaces\
    \ are primarily used in scenarios where you build queries, create series of objects\
    \ or build nodes in hierarchal order.\n\n#### Questions\n* What is Fluent Interface?\n\
    * What are the benefits of defining and using Fluent Interface?\n* Describe some\
    \ usage of Fluent Interface?\n\n### Generics\n`Generics` is a mechanism that allows\
    \ same code in a type (class or interface) or a method to operate on objects of\
    \ different types, while providing compile-time type safety. `Generics` are introduced\
    \ to enforce type safety especially for the collection classes.\n\n* Once a type\
    \ of the parameter is defined in generics, the object will work with the defined\
    \ type only.\n* In `generics`, the `formal type parameter` (`E` in the case below)\
    \ is specified with the type (class or interface) \n```java\n// Generic List type\n\
    // E is type parameter\npublic interface List<E> { \n  void add(E x); \n  Iterator<E>\
    \ iterator();\n}\n```\n* In `generics`, the `parameterized type` (`Integer` in\
    \ this case) is specified when variable of type is declared or object of type\
    \ is created.\n```java\n// variable of List type declared\n// With Integer parameter\
    \ type\nList<Integer> integerList = new ArrayList<Integer>();\n```\n\n#### Notes\n\
    * There is parameter naming convention that is generally used in `Generics`. `E`\
    \ for element, `T` for type, `K` for key and `V` for values.\n* Generic type is\
    \ a compiler support. All the type parameters are removed during the compilation\
    \ and this process is called [erasure].\n* Due to strong type checking, generics\
    \ avoid many `ClassCastException` instances.\n\n#### Generic Class Example\n*\
    \ The following `NodeId` generic class definition can be used with the object\
    \ of any type.\n```java\n// NodeId generic class with type parameter\npublic class\
    \ NodeId<T> { \n  private final T Id; \n  public NodeId(T id) { \n    this.Id\
    \ = id;\n  } \n  public T getId() { \n    return Id;\n  }\n}\n```\n* Usual `SuperType\
    \ – SubType` rules do not apply to generics. In this example, even though `Integer`\
    \ is derived from `Object`, still `NodeId` with type parameter `Integer` cannot\
    \ be assigned to `NodeId` with type parameter `Object`.\n```java\n// Parameter\
    \ Type - Object\nNodeId<Object> objectId = new NodeId<>(new Object());\n\n// Parameter\
    \ Type - Integer\nNodeId<Integer> integerId = new NodeId<>(1);\n```\n\n#### Questions\n\
    * What is Generics?\n* What are the various benefits that Generics provide to\
    \ the collection framework?\n* What is the meaning of the statement \"Generics\
    \ is compiler support\"? Are Generics not runtime?\n\n### Type Wildcards\nWildcard\
    \ in generics is represented in form of \"?\". For example, method which takes\
    \ `List<?>` as parameter will accept any type of List.\n\n```java\npublic void\
    \ addVehicles(List<?> vehicles) { //... } \n\n// Only vehicles of type Truck can\
    \ be added\npublic void addVehicles(List<? extends Truck> vehicles) { \n  //...\
    \ \n}\n```\n\n#### Notes\n* Do not return wildcard in a return type as its always\
    \ safer to know what is returned from a method.\n\n### Upper Bound\nTo impose\
    \ restriction, upper bound can be set on the type parameters. Upper bound restricts\
    \ a method to accept unknown type arguments extended only from specified data\
    \ type, like `Number` on example.\n\n```java\n// Upper bound of type wildcard\n\
    public void addIds(List<? extends Number> T){}\n```\n\n### Lower Bound\nTo impose\
    \ restriction, lower bound can be set on the type parameters. Lower Bound restricts\
    \ a method to accept unknown type argument, which is super type of specified data\
    \ type only, like `Float` in the example below.\n\n```java\n// Lower bound of\
    \ type wildcard\npublic void addIds(List<? super Float> T){}\n```\n\n### Type\
    \ Inference\nType inference is compiler's ability to look at method invocation\
    \ and declaration to infer the type arguments.\n\nIn `Generics`, operator called\
    \ `Diamond operator`, `<>` facilitates type inference.\n\n```java\n// Type inference\
    \ using Diamond operator\nList<Integer> integerList = new ArrayList<>();\n```\n\
    \n#### Questions\n* What are Type Wildcards in Generics?\n* Explain Upper Bound\
    \ type wildcard?\n* Explain Lower Bound type wildcard?\n* How are the different\
    \ type wildcards used in generics?\n* What is automatic type inference in Generics?\
    \ What is the diamond operator in Generics?\n\n### Generic Method\nGeneric methods\
    \ define their own type parameters.\n\n```java\n// generic method\npublic <T>\
    \ void addId(T id){}\n```\n"
