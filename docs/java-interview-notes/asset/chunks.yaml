  trans: "\n\n## 命名规范\n\n- 名称应使用 `Camel Case`（驼峰命名）。\n\n```java\nprivate long serialVersion\
    \ = 1234L;\n```\n\n### 常量\n- 名称应全大写 `uppercase`。复合词之间应用下划线分隔。\n\n```java\nprivate\
    \ int DEFAULT_CAPACITY = 10;\n```\n\n### 枚举\n- 枚举集的名称应全大写 `uppercase`。\n\n```java\n\
    public enum Duration { SECOND, MINUTE, HOUR }\n```\n\n### 缩写\n- 尽管缩写通常用全大写字母表示，但在\
    \ Java 中只有缩写的首字母应该大写，其余部分小写。\n\n```java\npublic void parseXml(){}\n```\n\n###\
    \ 问题\n- 什么是命名规范？\n- 为什么需要命名规范？\n- 驼峰命名法（Camel Case）和帕斯卡命名法（Pascal Case）有什么区别？\n\
    - 大写驼峰命名法（Upper Camel Case）和小写驼峰命名法（Lower Camel Case）有什么区别？\n- 请解释接口、类、方法、变量、常量、枚举和缩写的命名规范？\n\
    \n## 面向对象编程\n\n### 多态\n`Polymorphism` 是类实例根据其所作用的实例采取不同形式的能力。\n\n`Polymorphism`\
    \ 主要通过`subclassing`（子类化）或`实现接口`来实现。派生类可以对某些特性具有自己的独特实现，同时通过继承共享某些功能。\n\n对象的行为取决于它在类层次结构中的具体位置。\n\
    \n假设你有一个 `Furniture` 类，它包含一个 `addLegs()` 方法；以及 `Chair` 和 `Table` 类，它们都扩展了 `Furniture`\
    \ 类并对 `addLegs()` 方法有自己的实现。在这种情况下，调用的 `addLegs()` 方法的实现由运行时决定，取决于你拥有的是 `Chair`\
    \ 还是 `Table` 实例。\n\n```java\npublic abstract class Furniture {\n  public abstract\
    \ void addLegs();\n  public void print(String message){\n    System.out.println(message);\n\
    \  }\n}\n\nclass Chair extends Furniture {\n  @Override public void addLegs()\
    \ {\n    print(\"Chair Legs Added\");\n  }\n}\n\nclass Table extends Furniture{\n\
    \  @Override public void addLegs() {\n    print(\"Table Legs Added\");\n  }\n\
    }\n\nFurniture furniture = new Chair(); // 这打印 \"Chair Legs Added\"\nfurniture.addLegs();\
    \ \nfurniture = new Table(); // 这打印 \"Table Legs Added\"\nfurniture.addLegs();\n\
    ```\n\n### 多态的优势\n当你针对`abstract base class`或`interface` 编写代码时，就可以实现多态真正的力量和优势。根据上下文，`polymorphism`\
    \ 允许选择最合适的类实现。不仅在生产代码中如此，它也为`testing`（测试）提供替代实现铺平了道路。\n\n### 问题\n- 什么是多态？\n- 实现多态的不同方法有哪些？\n\
    - 继承如何有助于实现多态？\n- 多态有哪些优势？\n- 多态概念对单元测试有什么用？\n\n### 参数多态\n在 Java 中，`Generics`（泛型）促进了`Parametric\
    \ polymorphism`（参数多态）的实现，它允许使用不同类型的值使用相同的代码实现，而不损害编译时的类型安全检查。\n\n在下面的示例中，我们为类型参数\
    \ `T` 添加了`upper bound`（上界），使得它实现了一个接口，该接口保证了类型 `T` 中存在 `getWheelsCount()` 方法。\n\
    \n```java\ninterface Vehicle {\n  int getWheelsCount();\n}\n\nclass Car<T extends\
    \ Vehicle> {\n  private T vehicle;\n  public Car(T vehicle) {\n    this.vehicle\
    \ = vehicle;\n  }\n  public int getWheelsCount() {\n    return vehicle.getWheelsCount();\n\
    \  }\n}\n```\n\n它接收类型为 `T` 的参数并返回轮子数量，无需担心 `T` 实际上是什么类型。\n\n### 问题\n- 什么是参数多态？\n\
    - 如何使用泛型来实现参数多态？\n- 如何使用类型通配符（Type Wildcards）来实现参数多态？\n- 没有泛型可以实现参数多态吗？\n\n###\
    \ 子类型多态\n在`Subtype polymorphism`（子类型多态）中（也称为包含多态），函数的参数定义支持任何类型或其子类型的参数。\n\n在下面的代码中，`printWheelsCount()`\
    \ 方法接收 `Vehicle` 作为参数并打印 `Vehicle` 中的轮子数量。`main` 方法展示了`subtype polymorphic`（子类型多态）调用，将\
    \ `Car` 和 `Bike` 对象作为参数传递给 `printWheelsCount()` 方法。在每个期望类型作为参数的地方，它也接受该类型的`subclass`（子类）作为参数。\n\
    \n```java\nabstract class Vehicle{\n  public abstract int getWheelsCount();\n\
    }\n\nclass Car extends Vehicle{\n  @Override public int getWheelsCount() {\n \
    \   return 4;\n  }\n}\n\nclass Bike extends Vehicle{\n  @Override public int getWheelsCount()\
    \ {\n    return 2;\n  }\n}\n\npublic void printWheelsCount(Vehicle vehicle) {\n\
    \  print(vehicle.getWheelsCount());\n}\n\npublic void main(String[] args) {\n\
    \  printWheelsCount(new Car());\n  printWheelsCount(new Bike());\n}\n```\n\n###\
    \ 问题\n- 什么是子类型多态？\n- 什么是包含多态？\n- 参数多态和子类型多态之间有什么区别？\n- 使用泛型实现子类型多态吗？\n\n### 重写\n\
    - 方法 `overriding`（重写）是重新定义基类方法，使其行为与其在基类中的实现不同。\n- 方法 `overriding` 是动态多态的示例。\n\
    - 在动态多态中，运行时决定调用实现。\n\n### 重写的规则\n- 重写方法的参数必须相同。\n- 重写方法可以具有相同的返回类型或基类返回类型的子类型。\n\
    - 重写方法的访问修饰符不能比基类更严格。\n- 构造函数、`static` 方法和 `final` 方法不能被重写。\n- 如果基类方法没有抛出检查异常，重写方法可以。\n\
    \n### 问题\n- 什么是重写？\n- 什么是动态多态？\n- 为什么不能重写基类或接口中的静态方法？\n- 可以重写基类中的 final 方法吗？\n\
    - 可以重写基类中的 public 方法并标记为 protected 吗？\n- 为什么不能重写基类的构造函数？\n- 如果基类方法没有抛出检查异常，重写方法可以？\n\
    - 重写的优势有哪些？\n\n### @Override\n`@Override` 注解是显式声明要重写基类方法实现的方法。Java 对所有此类方法进行编译时检查。它为在想要重写基类时编写错误的方法签名提供了一种简单的方法。\n\
    \n如果派生类定义了一个与基类方法签名相同的方法，派生类的方法将隐藏基类的方法。通过在子类方法头部前加上 `@Override` 注解，可以检测到是否无意中尝试重载（overload）而不是重写方法。\n\
    \n### 问题\n- @Override 注解的目的是什么？\n- 如果定义了与父类签名相同的方法但不使用 @Override 注解会发生什么？\n- @Override\
    \ 注解的优势有哪些？\n\n### 重载\n- 方法 `overloading`（重载）是定义多个同名但参数不同的方法。\n- 方法 `overloading`\
    \ 是`static`（静态）或编译多态的示例。\n- 在静态多态中，是在编写代码时决定调用特定的实现。\n\n### 方法重载规则\n- 可以通过定义与现有方法相同但具有以下不同的方法来重载方法：\n\
    \    - 参数列表的数量。\n    - 参数的参数类型。\n    - 不同的参数顺序。\n\n"
- fmt: "\n* Return type of the overloaded method can be different.\n* Method with\
    \ the same name and exactly the same parameters cannot be defined, when they differ\
    \ only by return type.\n* `Overloading` method is not required to throw same exception\
    \ as the method its overloading.\n\n## Operator Overloading\n\n`Operator overloading`\
    \ is an ability to enhance the definition of language dependent operators. For\
    \ example, you can use `+` operator to add two integers and also to concat two\
    \ strings.\n\n### Questions\n\n* Explain method overloading?\n* What is static\
    \ polymorphism?\n* What is the difference between static and dynamic polymorphism?\n\
    * Can you override a method such that all the parameters are same with the difference\
    \ only in the return type?\n* What is operator overloading?\n* What are the benefits\
    \ of method overloading?\n* What is the difference between overriding and overloading?\n\
    \n## Abstraction\n\n`Abstraction` helps to move the focus from the internal details\
    \ of the concrete implementation to the type and its behaviour. `Abstraction`\
    \ is all about hiding details about the data, its internal representation and\
    \ implementation. \n\nThe other related object oriented concept is `encapsulation`,\
    \ which could be used to abstract the complexities and the internal implementation\
    \ of a class.\n\n`Abstraction` also helps making the software maintainable, secure\
    \ and provides an ability to change implementation without breaking any client.\n\
    \n### Questions\n\n* What is abstraction?\n* How abstraction is different from\
    \ encapsulation?\n* What are the benefits of abstraction?\n* Can you achieve abstraction\
    \ without encapsulation?\n\n## Inheritance\n\n`Inheritance` is an object oriented\
    \ design concept that deals with reusing an existing class definition (known as\
    \ `super class`) and defining more special categories of class (know as `sub class`)\
    \ by inheriting that class. It focuses on establishing `IS-A` relationship between\
    \ `sub class` and its `super class`. Inheritance is also used as technique to\
    \ implement polymorphism when a derived type implements method defined in the\
    \ base type. \n\n### Rules for Inheritance\n\n* There can be a multiple level\
    \ of `inheritance`, based on the requirements to create specific categories.\n\
    * Only single class `inheritance` is allowed in Java, as multiple `inheritance`\
    \ comes with its share of complexity; see Diamond Problem. \n* Class declared\
    \ `final` cannot be extended.\n* Class method declared `final` cannot be `overridden`.\n\
    * Constructor and private members of the base class are not inherited.\n* The\
    \ constructor of base class can be called using `super()`. \n* The base class's\
    \ overridden method should be called using `super` keyword, otherwise you will\
    \ end up calling the overriding method in the sub class recursively.\n\n### Questions\n\
    \n* Explain inheritance?\n* What is the purpose of inheritance?\n* What should\
    \ be the criteria to decide inheritance relation between two classes?\n* How inheritance\
    \ plays an important role in polymorphism?\n* Can you inherit final class?\n*\
    \ What happens if you don't use super keyword to call an overridden member?\n\
    * Why can't you inherit static members defined in the super class?\n* What are\
    \ the challenges you can face if multiple inheritance is possible in Java?\n\n\
    ## Composition\n\n`Composition` is an object oriented design concept that is closely\
    \ related to inheritance, as it also deals with reusing classes; but it focuses\
    \ on establishing `HAS-A` relationship between classes. So unlike `Inheritance`,\
    \ which deals with extending features of a class, `composition` reuses a class\
    \ by composing it. `Composition` is achieved by storing reference of another class\
    \ as a member.\n\n### Inheritance vs Composition\n\nProblem with `inheritance`\
    \ is that it breaks `encapsulation` as the derived class becomes tightly coupled\
    \ to the implementation of the base class. The problem becomes complex when a\
    \ class is not designed keeping future inheritance scope and you have no control\
    \ over the base class. There is possibility of breaking a derived class because\
    \ of changes in the base class.\n\nSo, `inheritance` must be used only when there\
    \ is perfect `IS-A` relationship between the base and the derived class definitions;\
    \ and in case of any confusion prefer `composition` over `inheritance`.\n\n###\
    \ Questions\n\n* Explain composition?\n* What is the difference between inheritance\
    \ and composition?\n* What should be the criteria to decide composition relation\
    \ between two classes?\n* Explain few problems with inheritance that can be avoided\
    \ by using composition?\n* When would you prefer composition over inheritance\
    \ and vice versa?\n\n## FUNDAMENTAL DESIGN CONCEPTS\n\n## Dependency Injection\
    \ vs Inversion of Control\n\n`Dependency Injection` and `Inversion of Control`\
    \ promotes modular software development by loosely coupling the dependencies.\
    \ Modular components are also more maintainable and testable.\n\n### Inversion\
    \ of Control\n\n`Inversion of Control` provides a design paradigm where dependencies\
    \ are not explicitly created by the objects that requires these; but such objects\
    \ are created and provided by the external source.\n\n### Dependency Injection\n\
    \n`Dependency Injection` is a form of `IoC` that deals with providing object dependencies\
    \ at runtime; through constructors, setters or service locators. `Annotations`\
    \ and `Interfaces` are used to identify the dependency sources. \n\n* Mode of\
    \ dependency injection:\n    * Through constructor\n    * Through setter\n   \
    \ * Through method parameter\n* It's the responsibility of dependency injection\
    \ framework to inject the dependencies.\n\nThe figure below depicts Dependency\
    \ Injection concept.\n\n![Image](OEBPS/Images/image00209.jpeg)\n\nThe code below\
    \ demonstrates dependency injection as constructor parameter. \n\n```java\npublic\
    \ class Account {\n    UserService userService;\n    AccountService accountService;\n\
    \n    public Account(UserService userService, AccountService accountService) {\n\
    \        this.userService = userService;\n        this.accountService = accountService;\n\
    \    }\n}\n```\n\nNot only in production systems, `DI` and `IoC` provides immense\
    \ help in unit testing, by providing an ability to mock dependencies. `Spring\
    \ framework` is an example of DI container.\n\n### Note\n\nIt is important to\
    \ ensure that dependency objects are initialized before they are requested.\n\n\
    ### Questions\n\n* What is Inversion of Control?\n* What is Dependency Injection?\n\
    * What is the difference between Inversion of Control and Dependency Injection?\n\
    * What are the different ways to implement Dependency Injection?\n* What the different\
    \ ways to identify dependency sources?\n* Who has the responsibility to inject\
    \ dependent objects?\n* How Dependency injection can be used in unit testing?\
    \ \n* How Dependency Injection can be used for modular software development?\n\
    \n## Service Locator\n\n`Service locator` is an object that encapsulates the logic\
    \ to resolve the service requested for. `Service locator` also provides interface\
    \ to register services with it, which allows you to replace the concrete implementation\
    \ without modifying the objects that depends on these services.\n\nIn the figure\
    \ below `Account` class uses `ServiceLocator` to resolve the `Account Service`\
    \ and `User Service` it depends on.\n\n![Image](OEBPS/Images/image00210.jpeg)\n\
    \n```java\npublic class Account {\n    UserService userService;\n    AccountService\
    \ accountService;\n\n    public Account() {\n        this.userService = ServiceLocator.getService(UserService.class);\n\
    \        this.accountService = ServiceLocator.getService(AccountService.class);\n\
    \    }\n}\n```\n\n### Benefits of Service Locator\n\n* Class does not have to\
    \ manage any service dependency and its life cycle.\n* Testing class in isolation\
    \ is possible, without the availability of *real* services it depends on. \n*\
    \ Enables runtime resource *optimization*; as services can be registered and unregistered\
    \ runtime.\n\n### Questions\n\n* Explain Service Locator design pattern?\n"
