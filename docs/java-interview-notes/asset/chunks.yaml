    * 栈内存仅对所有线程可见，因此内存访问是直接的。堆内存在应用程序的多个线程间共享；与其他线程的同步会产生性能影响。


    * 当栈内存耗尽时，JVM 会抛出 `StackOverFlowError`；而当堆空间耗尽时，JVM 会抛出 `OutOfMemoryError`。


    # 栈和堆中的内存分配


    在此示例中，描述了调用方法 `createPoint` 时栈和堆内存的分配情况。


    * 变量 `num1` 和 `num2`存储在栈中。

    * 引用变量 `point`存储在栈中。

    * `Point` 类对象存储在堆中。


    ![Image](img/image00221.jpeg)


    ## Questions


    * 什么是栈？

    * 什么是堆？

    * 在栈的生命周期内，内存是如何分配和释放置的？

    * 栈内存何时被释放？

    * 堆内存何时被释放？

    * 为什么栈内存的分配比堆快？

    * 为什么需要对堆内存应用同步而不是对栈内存？

    * 当栈内存耗尽时，你会得到什么异常？

    * 当堆内存耗尽时，你会得到什么异常？

    * 你需要显式地释放栈上的对象吗？


    # 堆碎片


    `Heap fragmentation` 发生在 Java 应用在一段时间内分配和释放大小不一的内存块，这导致在使用的内存块之间分布着许多小的空闲内存块。这可能会导致一种情况：尽管所有小空闲块的总大小大于大内存块所需的内存，但没有空间来分配大内存块。


    `Heap fragmentation` 会导致长的 `Garbage Collection` 周期，因为 JVM 被强制对堆进行压缩。`通过增加堆大小等避免分配大内存块，可以控制`
    `heap fragmentation`。


    ## Questions


    * 什么是堆碎片？

    * 为什么会发生堆碎片？

    * 谁负责减少堆碎片？

    * 你如何控制堆碎片？

    * 当堆碎片程度非常高时会发生什么？

    * 为什么堆碎片会降低应用程序速度？


    # 对象序列化


    将内存中对象的内容转换为字节流以便持久化或传输，被称为 `object serialization`。这些字节可以通过反序列化重新转换回对象。


    在 Java 中，如果一个对象的类实现了 `java.io.Serializable` 或其子接口 `java.io.Externalizable`，则该对象是序列化的。标记为
    `transient` 的成员不会被序列化。`ObjectInputStream` 和 `ObjectOutputStream` 是专门用于读写对象的流类。


    ## Questions


    * 什么是序列化和反序列化？

    * 想要支持序列化的类型需要实现哪个接口？

    * 你如何防止成员被序列化？

    * Java 中哪些类被用于序列化和反序列化对象？


    # 垃圾回收


    Java 中的 `Garbage Collection` 是从内存中识别并移除未引用的对象，并将剩余对象移动在一起以释放连续内存块的过程。当垃圾回收发生时，应用程序中所有运行的线程在回收周期内会被暂停。垃圾回收器运行在守护线程（Daemon
    thread）上。


    将所有存活对象移动在一起 `reduces memory fragmentation`，这提高了内存分配的速度。


    在垃圾回收周期内，对象根据其生存年龄移动到内存中的不同区域，称为 `generations`。


    `System` 类暴露了方法 `gc()`，可以请求 `Garbage Collection`。当你调用 `System.gc()` 时，JVM 不保证立即执行垃圾回收，但可以在可能时执行。你也可以使用
    `Runtime.getRuntime().gc()` 来请求垃圾回收。


    ## Questions


    * 什么是垃圾回收？

    * 解释垃圾回收周期？

    * 为什么垃圾回收被认为是一个昂贵的过程？

    * 为什么垃圾回收周期之后，应用程序的性能通常会提高？

    * 垃圾回收如何防止 `OutOfMemoryException`？

    * 垃圾回收使用什么线程：守护线程还是用户线程？

    * 什么是内存碎片？

    * 为什么当垃圾回收发生时应用程序似乎变慢了？

    * 你可以显式请求垃圾回收吗？

    * 你可以调用哪个方法请求垃圾回收？

    * 垃圾回收总会在请求时发生吗？


    # 内存管理


    JVM 内存分为两大类：`stack memory` 和 `heap memory`。


    ## 栈内存


    `Stack memory` 与每个系统线程相关，并在线程执行期间使用。`Stack` 包含方法定义的局部对象和引用变量；尽管所引用的对象存储在堆中。一旦执行离开方法，方法内声明的所有局部变量都会从栈中移除。


    ## 堆内存


    `Heap Memory` 分为称为代（generation）的不同区域：


    * `New Generation` - 它被分为 Eden 和 Survivor 空间。大多数新对象在 Eden 内存空间中创建。

    * `Old Generation`

    * `Metaspace`


    ![Image](img/image00222.jpeg)


    当新生代满时，会触发垃圾回收。在 `Eden` 中存活此 GC 周期的对象移动到 `Survivor` 空间。同样，经过几次 GC 周期后，存活的对象继续移动到
    `old generation`。


    `Metaspace` 被 JVM 用于 `keep permanent objects,` 主要是类的元数据信息。新生代的垃圾回收比老年代更频繁。


    * `New Gen` 和 `Old Gen` 是堆的一部分，而 `Metaspace` 是 `Native memory` 的部分。

    * `Metaspace` 可以在运行时扩展，因为它是本地内存。


    当垃圾回收发生时，所有应用程序线程都会冻结直到 GC 完成。老年代的垃圾回收通常很慢；因此如果老年代发生大量垃圾回收，可能会导致超时。


    ## Questions


    * 堆内存是如何划分的？

    * 解释堆的不同代？对象如何在代代之间移动？

    * 垃圾回收周期是如何触发的？

    * 新一代内存中的 Eden 和 Survivor 空间是什么？

    * Eden 中的对象何时移动到 Survivor 空间？

    * 什么是 Metaspace？

    * Metaspace 中存储什么类型的对象？

    * 为什么 Metaspace 具有虚拟无限的空间？

    * 哪个代的垃圾回收运行最慢？为什么？

    * 哪个代的垃圾回收更频繁？


    # 弱引用 vs 软引用 vs 幻引用


    如果内存中的对象有引用，垃圾回收就不会收集它。这一原理对于弱引用和软引用并不适用。


    ## 弱引用


    `Weak reference` 是一种会被垃圾回收器积极收集的引用。弱引用适用于缓存，在需要时可以重新加载。


    ## 软引用


    `Soft reference` 比 `Weak Reference` 稍强，因为只有在存在 `memory constraint` 时会被垃圾回收器收集。软引用通常用于缓存
    `re-creatable` 资源，如文件句等。


    ## 幻引用


    `Phantom reference` 是 Java 中最弱的引用。它在对象被终化（finalize）后被引用，但内存尚未被垃圾回收器认领。它主要用于跟踪内存使用的技术目的。


    ## Questions


    * 什么是弱引用？

    * 什么是软引用？

    * 什么是幻引用？

    * 哪些引用类型即使其类型对象仍在在使用时也会被垃圾回收器收集？


