  trans: "\n\n* `Method` - 代表类的操作/行为。\n* `Modifier` - 指定类及其成员的访问控制级别。\n* `Parameter`\
    \ - 指定方法定义中声明的变量。\n* `Argument` - 指定传递给方法参数的数据。\n\n## 问题\n* 什么是包（package）？\n*\
    \ 为什么需要导入包？\n* 为什么需要指定访问修饰？\n* 什么是 `static import`（静态导入）？\n    * `static import`\
    \ 允许在不需要通过类名限定的情况下访问静态成员。\n* 参数（argument）和形式（parameter）之间的区别是什么？\n\n## 在 JVM 中编译和执行\
    \ Java 代码\n\nJava 编译和执行步骤\n\n![Image](img/image0020.jpeg)\n\n1. Java 编译器将 Java\
    \ 源代码（`.java` 文件）编译成名为 `bytecode`（`.class` 文件）的二进制格式。Java 字节码是平台无关的指令集，包含了指令（`opcode`）和参数信息。\n\
    2. `Bytecode`（字节码）由特定于`操作系统`的`Java 虚拟机 (JVM)` 翻译成特定平台的机器码。\n3. JVM 中的`Class loader`（类加载器）将类的二进制表示加载到内存中。\n\
    4. JVM 中的`Execution engine`（执行引擎）执行字节码并生成特定于`操作系统`的机器指令。这些机器指令由中央处理器 (`CPU`）直接执行。\n\
    \n## 问题\n* 说明 Java 代码编译和执行的过程？\n* 什么是字节码？\n* 字节码和源代码有什么区别？\n* 什么是机器码？\n* 字节码和机器码有什么区别？\n\
    * 什么是 JVM？它对于不同的操作系统是相同还是不同的？\n* JVM 的主要组件有哪些？\n* 类加载器在 JVM 中的作用是什么？\n* 执行引擎在\
    \ JVM 中的作用是什么？\n* 什么是机器指令？\n\n## 数据类型\n\n### 基本类型 (Primitive Types)\n* 基本类型包括\
    \ `byte`、`boolean`、`char`、`short`、`int`、`float`、`long` 和 `double`。\n* 基本类型始终有一个值；如果没有赋值，将有一个默认值。\n\
    * `long` 值带有后缀 `L`（或 `l`）以区别于 `int`。\n* `float` 值带有后缀 `F`（或 `f`）以区别于 `double`。同样，`double`\
    \ 带有后缀 `D`（或 `d`）。\n* `char` 是无符号的，代表 `Unicode` 值。\n* 当将基本类型赋值给另一个变量时，会创建一个副本。\n\
    \n### 引用类型 (Reference Types)\n* 所有非基本类型都是引用类型。\n* 引用类型通常也被称为 `objects`（对象）。引用类型也指向内存中的对象。\n\
    * 引用类型的对象在未赋值时，默认值为 `null`。\n* 对象拥有 `variables`（变量）和 `methods`（方法），它们定义了对象的状态和行为。\n\
    * 当一个引用赋值给另一个引用时，两者都指向同一个对象。\n\n## 问题\n* 什么是基本数据类型？\n* 如果基本数据类型的变量没有赋值，它包含什么？\n\
    * 为什么我们要给 `long` 加上 `L`，给 `Float` 加上 `F`，给 `double` 加上 `D`？\n* 将基本数据类型变量赋值给另一个相同类型的变量时发生了什么？\n\
    * 什么是引用数据类型？\n* 将引用数据类型变量赋值给另一个相同引用类型的变量时发生了什么？\n* 基本数据类型和引用数据类型有什么区别？\n* 引用类型中变量和方法的目的是什么？\n\
    * 如果引用数据类型的变量没有赋值，它包含什么？\n\n## Object 类\n每个 Java 类都直接或间接地继承自 `java.lang.Object`\
    \ 类，这意味着 `Object` 类的变量可以引用任何类的对象。\n\n由于继承，所有以下 `java.lang.Object` 类方法中只要不是 `final`\
    \ 或 `private` 的方法，都可以用类特定的代码进行 `overriding`（重写）。\n\n* `hashCode()` - 返回对象的哈希码值。\n\
    * `equals()` - 使用标识符运算符 (`==`) 比较两个对象的相等相等性。\n* `clone()` - 创建对象的副本。`Overriding`（重写）类应该继承\
    \ `Cloneable` 接口并实现 `clone()` 方法以定义拷贝的含义。\n* `toString()` - 返回对象的字符串表示。\n* `finalize()`\
    \ - 由垃圾器调用以清理资源。`java.lang.Object` 对 `finalize()` 的实现无任何操作。\n\n## 问题\n* 所有 Java\
    \ 类的基类是什么？\n* `java.lang.Object` 类中有哪些方法可以在派生类中进行重写？\n* 如果你的类没有重写 `java.lang.Object`\
    \ 类的 `equals` 方法会怎样？\n    * `java.lang.Object` 类中的 `equals()` 方法比较的是对象引用是否相同，而不是内容。要比较内容，你需要重写\
    \ `equals()` 方法。\n* `clone()` 方法的什么？\n* 为什么重写类应该定义拷贝的含义？\n* 如果重写类没有重写 `clone()`\
    \ 会怎样？\n    * 如果对象包含引用，对被引用对象进行的任何更改也将出现在副本对象中。\n\n## 访问修饰符 (Access Modifiers)\n\
    访问修饰符决定了可见性规则，其他类是否可以访问变量或调用方法。在类级别，你可以使用 public 修饰符。对于类成员，可以使用以下访问修饰符之一：\n* `private`\
    \ - 外部类无法访问该成员。\n* `protected` - 只有子类可以访问该成员。\n* `public` - 应用程序中的所有类都 {访问。\n\
    * 无修饰符 (no modifier) - 包内的所有类都可以访问该成员。\n\n重写方法的访问修饰符应与被覆盖的方法相同或更宽松。`static` 和\
    \ `final` 关键字经常与访问修饰符一起使用。\n\n## 问题\n* 访问修饰符的作用是什么？\n* 类及其成员的访问修饰符列表有什么区别？\n*\
    \ `private`、`protected` 和 `public` 修饰符的作用范围是什么？\n* 当没有指定访问修饰符时发生了什么？\n* 如果子类位于不同的包，它还能看到父类的受保护成员吗？\n\
    * 为什么派生类的成员访问修饰符应该比基类宽松？\n    * 根据继承概念，你应该能够用父类引用使用子类对象。如果子类成员使用了更严格的访问修饰符，这将是不可能的。\n\
    * 决定类访问修饰符的标准是什么？\n    * 你应该使用最严格的访问修饰符以确保安全并防止滥用。\n\n## static\n\n### static\
    \ 类\n只有嵌套（nested/inner）类可以定义为 `static`，而外部类不能。\n\n### static 变量和方法\n当 `static`\
    \ 关键字与 `variables` 和 `methods` 一起使用时，表示这些成员属于 `class`，且这些成员被类的所有对象共享。静态成员没有副本，仅存储在内存中的单一位置。这些成员应该使用类名进行访问。\n\
    \n静态方法无法访问实例方法或属性，因为静态成员属于类而不是类实例。\n\n## 问题\n* 什么是静态类？\n* 任何类都可以声明为静态类吗？\n* 什么是静态方法？\n\
    * 什么是静态变量？\n* 静态类成员属于谁？这与非静态成员有什么区别？\n\n"
- fmt: "\n* How should you access class members that are static?\n* Does static method\
    \ has access to an instance member? Why?\n\n## final\n\n### final Class\nA `final`\
    \ class cannot be extended, which makes the class secure and efficient.\n\n###\
    \ final Method\nA `final` method cannot be overridden, which prevents any possibility\
    \ of introducing any unexpected behaviour to the class.\n\n### final Variable\n\
    A `final` variable reference cannot be changed, but the content of the [mutable\
    \ object](#part0041.xhtml), that the `final` variable is referencing, can be changed.\n\
    \n* `blank final` variable - variable which is not initialized at the point of\
    \ declaration.\n\n#### Notes\n* `blank final` variable needs to be initialized\
    \ in the constructor of the class.\n* `final` variables are like `immutable` variables,\
    \ so computations related to final variables can be cached for optimization.\n\
    \n#### Questions\n* Explain `final` class?\n* What are the benefits of declaring\
    \ a class `final`?\n* Explain `final` method?\n* What are the benefits of declaring\
    \ a method `final`?\n* Explain `final` variable?\n* What are the benefits of declaring\
    \ a variable `final`?\n* When you declare a variable `final`, can you change the\
    \ content of the object it's referencing?\n* When you declare a variable `final`,\
    \ can you change it to reference another object?\n* What is `blank final` variable?\n\
    * How does declaring a variable as `final` helps with optimization?\n\n## static\
    \ Initialization Block\n\n* `static initialization` block is generally used to\
    \ ensure that all the required class resources (like drivers, connection strings,\
    \ etc.) are available before any object of the class is used.\n* `static block`\
    \ does not have access to the instance members.\n* `static block` is called only\
    \ once for a class.\n* A class can define any number of `static blocks`, which\
    \ gets called in order of their definition in the class.\n* You can *only* throw\
    \ `unchecked` exception from a `static block`.\n\nIn this code example `static\
    \ initialization block` creates connection string only once for the class.\n\n\
    ```java\nprivate static String connectionString;\n\nstatic {\n  connectionString\
    \ = getConnectionSting();\n}\n```\n\n#### Questions\n* What is `static initialization\
    \ block`?\n* What is the primary purpose of the `static initialization block`?\
    \ What of things should you do in the `static block`?\n* Can you access instance\
    \ members from `static initialization block`? Why?\n* Does `static initialization\
    \ block` gets called every time when an instance of the class is created?\n* How\
    \ many `static blocks` can be defined in a class?\n* When multiple `static blocks`\
    \ are defined, what is the criterion for their order of execution?\n* Can you\
    \ throw exception from `static initialization block`? What type?\n\n## finally\n\
    \nThe primary purpose of a `finally` block is to ensure that the application is\
    \ brought back to a consistent state, after the operations performed in the `try`\
    \ block. Within the `finally` block, usually resources like `streams` and `database\
    \ connections` can be closed to prevent leaks.\n\n```java\nInputStream is = null;\n\
    \ntry{\n  is = new FileInputStream(\"input.txt\");\n}\nfinally {\n  if (is !=\
    \ null) {\n    is.close();\n  }\n}\n```\n\n### finally block execution\nCompiler\
    \ does all in its power to execute the `finally` block, except in the following\
    \ conditions:\n* If `System.exit()` is called.\n* If current thread is interrupted.\n\
    * If `JVM` crashes.\n\n### Return from finally\nYou must never return from within\
    \ the `finally` block. If there is a `return` statement present in the `finally`\
    \ block, it will immediately return, ignoring any other return present in the\
    \ function.\n\n#### Questions\n* How do you guarantee that a block of code is\
    \ always executed?\n* What kind of things should you do in a `finally` block?\n\
    * What kind of things should you do in a `catch` block?\n* Does `finally` block\
    \ always execute? What are the conditions when the finally block does not execute?\n\
    * Should you ever return from the finally block? Why?\n\n## finalize()\n\nWhen\
    \ the [Garbage Collector](#part0145.xhtml) determines that there in no reference\
    \ to an object exist, it calls `finalize()` on that object; just before removing\
    \ that object from memory.\n\n`finalize()` will not be called if an object does\
    \ not become eligible for garbage collection, or if `JVM` stops before garbage\
    \ collector gets chance to run.\n\n`finalize()` could be overridden to release\
    \ the resources like: file handles, database connections, etc.; but you must not\
    \ rely on `finalize()` method to do so, and release such resources explicitly.\n\
    \nThere is no guarantee that `finalize()` will be called by the `JVM`, and you\
    \ should treat `finalize()` method only as a backup mechanism for releasing resources.\
    \ Where possible, use [try-with-resource](#part0104.xhtml) construct to automatically\
    \ release the resources.\n\nIf an uncaught exception is thrown by the `finalize()`\
    \ method, the exception is ignored before terminating the finalization.\n\n####\
    \ Questions\n* What is `finalize` method in Java?\n* When does the `finalize`\
    \ method gets called?\n* Who calls the `finalize` method?\n* What kind of things\
    \ can be done in the `finalize` method?\n* Should you explicitly call `finalize`\
    \ method to release resources? Why?\n* What are some alternate mechanisms that\
    \ can be used to release system resources?\n* What happens if an unhanded exception\
    \ is thrown from the `finalize` method?\n\n## Widening vs Narrowing Conversions\n\
    \n### Widening Conversions\n`Widening conversions` deals with assigning an object\
    \ of `sub class` (derived class) to an object of `super class` (base class). In\
    \ the example below, `Car` is derived from `Vehicle`.\n\n```java\nCar car = new\
    \ Car();\nVehicle vehicle = car;\n```\n\n### Narrowing Conversions\n`Narrowing\
    \ conversions` deals with assigning an object of `super class` (base class) to\
    \ an object of `sub class` (derived class). An explicit cast is required. In the\
    \ example below, `Bike` is derived from `Vehicle`.\n\n```java\nVehicle vehicle\
    \ = new Vehicle();\nBike bike = (Bike)vehicle;\n```\n\n#### Questions\n* What\
    \ is widening conversion?\n* What is narrowing conversion?\n* Is there any possibility\
    \ of loss of data in narrowing conversion?\n\n## getters and setters\n\nThe following\
    \ code demonstrates the usage of `getter` and `setter`.\n\n```java\npublic class\
    \ Person {\n  private String name;\n\n  public String getName() {\n    return\
    \ StringUtils.capitalize(name);\n  }\n\n  public void setName(String name) {\n\
    \    if(name.isEmpty()){\n      System.out.println(\"Name string is empty\");\n\
    \    }\n    this.name = name;\n  }\n}\n```\n\n### Benefits of using getter and\
    \ setter\n* Validations can be performed in the setter or can be added later when\
    \ required.\n* Value can have alternative representation, based on internal (storage)\
    \ or external (caller's) requirement.\n* Hides the internal data structure used\
    \ to store the value.\n* Internal fields can be changed, without requiring changing\
    \ user of the code.\n* Encapsulates the internal complexity in retrieving or calculating\
    \ the value.\n* Provides ability to specify different access modifiers for getter\
    \ and setter.\n* Provides ability to add debugging information.\n* Can be passed\
    \ around as Lambda expressions.\n* Many libraries like mocking, serialization,\
    \ etc. expects getters/setters for operating on the objects.\n\n#### Questions\n\
    * Why do you need getters and setters when you can directly expose the class field?\n\
    * Explain few benefits of using getters and setters?\n\n## varargs vs object array\n\
    \n`varargs` parameters allows zero or more arguments to be passed to the method;\
    \ whereas, an `object array` parameter cannot be called with zero arguments.\n\
    \n### varargs\n```java\npublic static int getCumulativeValue(int... values){\n\
    \  int sum = 0;\n  for(int value : values){\n    sum += value;\n  }\n  return\
    \ sum;\n}\n```\n\n### object array\n```java\npublic static int getCumulativeValues(int[]\
    \ values){\n  int sum = 0;\n  for(int value : values){\n    sum += value;\n  }\n\
    \  return sum;\n}\n```\n\n* `varargs` can only be the last parameter in the method;\
    \ whereas, an object array can be defined in any order.\n"
