    \    T greater(T arg1, T arg2);\n}\n```\n\nAnnotation `@FunctionalInterface` generates\
    \ compiler warning when the interface is not a valid functional interface.\n\n\
    ### Function Interface Greater\n```java\n@FunctionalInterface \npublic interface\
    \ Greator<T> {\n    T greater(T arg1, T arg2);\n}\n```\n"
