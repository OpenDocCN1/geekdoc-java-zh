- fmt: "\n* `Method` - Represents an operation/behaviour of the class.\n* `Modifier`\
    \ - Specifies access control level of a class and its members.\n* `Parameter`\
    \ - Specifies the variable declared in the method definition.\n* `Argument` -\
    \ Specifies the data passed to the method parameters.\n\n## Questions\n* What\
    \ is package?\n* Why do you need to import packages?\n* Why do you need to specify\
    \ access modifiers?\n* What is `static import`?\n    * `static import` enables\
    \ access to static members of a class without need to qualify it by the class\
    \ name.\n* What is the difference between argument and parameter?\n\n## Compiling\
    \ and Executing Java Code in JVM\n\nJava program compilation and execution steps\n\
    \n![Image](OEBPS/Images/image0020.jpeg)\n\n1. Java Compiler compiles the Java\
    \ source code (`.java` file) into a binary format known as `bytecode` (`.class`\
    \ file). Java bytecode is platform independent instruction set, which contains\
    \ instructions (`opcode`) and parameter information.\n2. `Bytecode` is translated\
    \ by the `Operating System` specific `Java Virtual Machine (JVM)` into the platform\
    \ specific machine code.\n3. `Class loader` in JVM loads the binary representation\
    \ of the classes into memory.\n4. `Execution engine` in JVM executes the byte\
    \ code and generates `Operating System` specific machine instructions. These machine\
    \ instructions are executed directly by the central processing unit (`CPU`).\n\
    \n## Questions\n* Explain the process of Java code compilation and execution?\n\
    * What is bytecode?\n* What is the difference between bytecode and source code?\n\
    * What is machine code?\n* What is the difference between bytecode and machine\
    \ code?\n* What is JVM? Is it same or different for different Operating Systems?\n\
    * What are the major components of JVM?\n* What is the role of class loader in\
    \ JVM?\n* What is the role of Execution Engine in JVM?\n* What are machine instructions?\n\
    \n## Data Types\n\n### Primitive Types\n* Primitive types are `byte`, `boolean`,\
    \ `char`, `short`, `int`, `float`, `long` and `double`.\n* Primitive types always\
    \ have a value; if not assigned, will have a default value.\n* A `long` value\
    \ is suffixed with `L` (or `l`) to differentiate it from `int`.\n* A `float` value\
    \ is suffixed with `F` (or `f`) to differentiate it from `double`. Similarly `double`\
    \ is suffixed with `D` (or `d`)\n* A `char` is unsigned and represent an `Unicode`\
    \ values.\n* When a primitive type is assigned to another variable, a copy is\
    \ created.\n\n### Reference Types\n* All non-primitive types are reference types.\n\
    * Reference types are also usually known as `objects`. A reference type also refers\
    \ to an object in memory.\n* Objects of reference type will have `null` as default\
    \ value, when it's unassigned.\n* Objects have `variables` and `methods`, which\
    \ define its state and the behaviour.\n* When a reference is assigned to another\
    \ reference, both points to the same object.\n\n## Questions\n* What are primitive\
    \ data types?\n* If a variable of primitive data type is not assigned, what does\
    \ it contain?\n* Why do we suffix `L` with `long`, `F` with `Float` and `D` with\
    \ `double`?\n* What happens when you assign a variable of primitive data type\
    \ to another variable of same type?\n* What are reference data types?\n* What\
    \ happens when you assign a variable of reference data type to another variable\
    \ of same reference type?\n* What are the differences between primitive data types\
    \ and reference data types?\n* What are the purposes of variables and methods\
    \ in a reference type?\n* If a variable of reference data type is not assigned,\
    \ what does it contain?\n\n## Object class\nEvery Java class is inherited, directly\
    \ or indirectly, from `java.lang.Object` class, which also means that a variable\
    \ of `Object` class can reference object of any class.\n\nDue to inheritance,\
    \ all the following `java.lang.Object` class methods, which are not `final` or\
    \ `private`, are available for `overriding` with class specific code.\n\n* `hashCode()`\
    \ - returns hash-code value for the object.\n* `equals()` - compares two objects\
    \ for equality using identity (`==`) operator.\n* `clone()` - creates copy of\
    \ object. `Overriding` class should inherit `Cloneable` interface and implement\
    \ `clone()` method to define the meaning of copy.\n* `toString()` - returns string\
    \ representation of the object.\n* `finalize()` - called by the Garbage Collector\
    \ to clean up the resources. `java.lang.Object`'s implementation of `finalize()`\
    \ does nothing.\n\n## Questions\n* What is the base class for all Java classes?\n\
    * What are the different methods of `java.lang.Object` class, which are available\
    \ for overriding in the derived class.\n* What happens if your class does not\
    \ override `equals` method from the `java.lang.Object` class?\n    * The `equals()`\
    \ method in `java.lang.Object` class compares whether object references are same,\
    \ and not the content. To compare content, you need to override `equals()` method.\n\
    * What is the purpose of `clone()` method?\n* Why should the overriding class\
    \ define the meaning of copy?\n* What happens if overriding class does not override\
    \ clone()?\n    * In case if object contains references, any change made to referenced\
    \ object will be visible in cloned object too.\n\n## Access Modifiers\nAccess\
    \ modifiers determine the visibility rules whether other classes can access a\
    \ variable or invoke a method. At class level, you can use either public modifier.\
    \ For class members, you can use one of the following access modifiers:\n* `private`\
    \ - External classes cannot access the member.\n* `protected` - Only sub-classes\
    \ can access the member.\n* `public` - All classes in the application can access\
    \ the member.\n* `no modifier` - All classes within the package can access this\
    \ member.\n\nThe access modifier in the overriding methods should be same or less\
    \ restrictive than the overridden method. `static` and `final` keywords are frequently\
    \ used along with access modifiers.\n\n## Questions\n* What is the purpose of\
    \ access modifier?\n* Is there any difference between the list of access modifiers\
    \ available for a class and for its members?\n* What is the scope of `private`,\
    \ `protected` and `public` modifiers?\n* What happens when no access modifier\
    \ is specified with the class?\n* If sub-class exists in a different package,\
    \ does it still has visibility to the protected members of the super-class?\n\
    * Why should the member access modifier in the derived class be less restrictive\
    \ than the base?\n    * As per inheritance concept, you should be able to use\
    \ sub class object with super class reference. This will not be possible if sub\
    \ class member is declared with more restrictive access modifier.\n* What should\
    \ be the criteria to decide an access modifier for a class?\n    * You should\
    \ use the most restrictive access modifier to ensure security and to prevent any\
    \ misuse.\n\n## static\n\n### static class\nOnly `nested`/`inner` classes can\
    \ be defined as `static` and not the outer class.\n\n### static variable and method\n\
    When `static` keyword is used with the `variables` and the `methods`, it signifies\
    \ that these members belongs to the `class` and these members are shared by all\
    \ the objects of the class. Static members does not have a copy and are stored\
    \ only at a single location is memory. These members should be accessed using\
    \ class name.\n\nStatic method does not have access to instance methods or properties,\
    \ because static members belong to the class and not the class instances.\n\n\
    ## Questions\n* What are static classes?\n* Can any class be declared as static\
    \ class?\n* What are static methods?\n* What are static variables?\n* Who owns\
    \ the class members that are static? How is that different for non-static members?\n"
