    - Are two `NaNs` equal?\n\n# EnumSet\n\n`EnumSet` is specialized set implementation\
    \ to be used with enum type. `EnumSet` is represented internally as bit vectors\
    \ in a very compact and efficient manner. `EnumSet` provides optimized implementation\
    \ to perform bit flag operations and should be used in place of performing int\
    \ flag operations. The following code demonstrates usage of `EnumSet`.\n\n```java\n\
