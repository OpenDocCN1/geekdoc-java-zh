  trans: "\n\n`Account` 类定义如下，用作函数接口 `Greater` 的参数使用。\n\n```java\npublic class Account\
    \ {\n  private int balance;\n\n  public Account(int balance) {\n    this.balance\
    \ = balance;\n  }\n\n  public int getBalance() {\n    return balance;\n  }\n\n\
    \  @Override \n  public String toString() {\n    return \"Account{\" +\n    \"\
    balance=\" + balance +\n    '}';\n  }\n}\n```\n\n### Lambda Expression\n下面的代码演示了如何使用\
    \ `Lambda expression` 来查找余额更大的账户。同样，相同的函数接口 `Greater` 也可以用于其他类似的业务对象。\n\n```java\n\
    public static void main(String [] args){\n  Greator<Account> accountComparer =\n\
    \  (Account acc1, Account acc2) ->\n  acc1.getBalance() > acc2.getBalance() ?\n\
    \  acc1 :\n  acc2;\n  Account account1 =\n  new Account(6);\n  Account account2\
    \ =\n  new Account(4);\n  System.out.println(\n  \" Account with greater balance:\
    \ \" + accountComparer.greater(account2, account1));\n}\n```\n\nJava 还为最常见的场景提供了一组预定义的函数接口。\n\
    \n#### Questions\n* 什么是函数接口（Functional Interface）？\n* 使用函数接口有什么好处？\n\n### Lambda\
    \ Expression\n`Lambda expressions` 为创建[匿名类]提供了一种方便的方法。`Lambda expressions` 以更紧凑的方式实现了[`函数接口]`。当你想要将某些功能作为参数传递给另一个方法，并推迟该功能的执行直到恰当的时机时，`Lambda\
    \ Expressions` 非常有用。\n\nLambda 表达式可以仅仅是一个带有方法体和可选参数类型的语句块，但没有方法名或返回类型。它可以作为方法参数传递，并存储在变量中。\n\
    \n```java\n// lambda expressions\n() -> 123 (x,y) -> x + y\n(Double x, Double\
    \ y) -> x*y\n```\n\n#### Questions\n* 什么是 Lambda Expression？\n* Lambda Expression\
    \ 和匿名类之间有什么关系？\n* 你可以将 Lambda Expression 作为方法参数传递吗？\n* 使用 Lambda Expression 时，功能延迟执行意味着什么？\n\
    * 使用 Lambda Expression 有什么好处？\n* Lambda Expression 和函数接口之间有什么关系？\n\n### Pure Functions\n\
    纯函数（Pure Functions）是指结果仅取决于传递给它的参数的函数，不受应用程序中任何状态变化的影响，也不会改变应用程序的状态。纯函数对于相同的参数始终返回相同的结果。\n\
    \n```java\npublic int increaseByFive(int original){\n  int toAdd = 5;\n  return\
    \ original + toAdd;\n}\n```\n\n#### Questions\n* 什么是纯函数（Pure Function）？\n* 纯函数在函数式编程中的作用是什么？\n\
    * 如何保证纯函数对于相同的参数总是相同的结果？\n\n### Fluent Interface\n`Fluent interface`（流式接口）用于将命令传递给后续调用，无需创建中间对象，并通过方法链实现。当链式方法返回\
    \ `void` 时，`fluent interface` 链结束。`Fluent interface` 通过减少不必要的对象创建数量提高了可读性。\n\n\
    在下面的代码中，`Fluent Interface` 被用于添加新的员工（Employee）。\n\n```java\nemployee.create()\n\
    \  .atSite(\"London\")\n  .inDepartment(\"IT\")\n  .atPosition(\"Engineer\");\n\
    ```\n\n流式接口主要用于构建查询、创建一系列对象或按层次顺序构建节点的场景。\n\n#### Questions\n* 什么是流式接口（Fluent\
    \ Interface）？\n* 定义和使用流式接口有什么好处？\n* 描述流式接口的一些用法？\n\n### Generics\n`Generics`（泛型）是一种机制，允许同一类型（类或接口）或方法操作不同类型的对象，同时提供编译时的类型安全。`Generics`\
    \ 的引入是为了强制类型安全，特别是对于集合类。\n\n* 一旦在泛型中定义了参数类型，对象将仅与定义的类型协同工作。\n* 在 `generics` 中，`形式类型参数`（下例中的\
    \ `E`）用类型（类或接口）指定：\n```java\n// Generic List 类型\n// E 是类型参数\npublic interface\
    \ List<E> { \n  void add(E x); \n  Iterator<E> iterator();\n}\n```\n* 在 `generics`\
    \ 中，当声明类型变量或创建类型类型对象时，会指定`参数化类型`（本例中 `Integer`）：\n```java\n// 声明了 List 类型变量\n\
    // 使用 Integer 参数类型\nList<Integer> integerList = new ArrayList<Integer>();\n```\n\
    \n#### Notes\n* 泛型中有一个通用的参数命名约定。`E` 代表元素（element），`T` 代表类型（type），`K` 代表键（key），`V`\
    \ 代表值（values）。\n* 泛型是编译支持。所有类型参数在编译期间都会删除，这个过程被称为擦除。\n* 由于强类型检查，泛型避免了许多 `ClassCastException`\
    \ 实例发生。\n\n#### Generic Class Example\n* 以下 `NodeId` 泛型类的定义可以用于任何类型的对象。\n```java\n\
    // 带有类型参数的 NodeId 泛型类\npublic class NodeId<T> { \n  private final T Id; \n  public\
    \ NodeId(T id) { \n    this.Id = id;\n  } \n  public T getId() { \n    return\
    \ Id;\n  }\n}\n```\n* 常用的`父类型 – 子类型`SuperType – SubType）规则不适用于泛型。在本例中，尽管 `Integer`\
    \ 派生自 `Object`，但带有 `Integer` 参数的 `NodeId` 仍然不能赋值给带有 `Object` 参数的 `NodeId`：\n```java\n\
    // 参数类型 Object\nNodeId<Object> objectId = new NodeId();\n\n// 参数类型 Integer\nNodeId<Integer>\
    \ integerId = new NodeId(1);\n```\n\n#### Questions\n* 什么是泛型（Generics）？\n* 泛型为集合提供了哪些好处？\n\
    * “泛型是编译支持”这句话是什么意思？泛型不是运行时的吗？\n\n### Type Wildcards\n泛型中的通配符以 `?` 的形式表示。例如，接收\
    \ `List<?>` 作为参数的方法可以接受任何类型的 List。\n\n```java\npublic void addVehicles(List<?>\
    \ vehicles) { //... } \n\n// 只能添加 Truck 车辆\npublic void addVehicles(List<? extends\
    \ Truck> vehicles) { \n  //... \n}\n```\n\n#### Notes\n* 不要返回返回值中使用通配符，因为知道方法的返回值更安全。\n\
    \n### Upper Bound\n为了实施限制，可以在类型参数上设置上界（Upper Bound）。上界限制方法接受扩展自指定数据的未知类型参数，如示例中的\
    \ `Number`。\n\n```java\n// 上界通配符\npublic void addIds(List<? extends Number> T){}\n\
    ```\n\n### Lower Bound\n为了实施限制，可以在类型参数上设置下界（Lower Bound）。下界限制方法接受指定数据的父类的未知类型参数，如下例中的\
    \ `Float`。\n\n```java\n// 下界通配符\npublic void addIds(List<? super Float> T){}\n\
    ```\n\n### Type Inference\n类型推断（Type Inference）是编译器通过方法调用和声明来推断类型参数的能力。\n\n在泛型中，称为`钻石运算符`的\
    \ `<>` 有助于类型推断。\n\n```java\n// 使用钻石操作符的类型推断\nList<Integer> integerList = new ArrayList<>();\n\
    ```\n\n#### Questions\n* 泛型中的类型通配符（Type Wildcards）是什么？\n* 解释上界通配符？\n* 解释下界通配符？\n\
    * 泛型中如何使用不同的类型通配符？\n* 泛型中的自动类型推断是什么？泛型中的钻石运算符是什么？\n\n### Generic Method\n泛型方法定义自己的类型参数。\n\
    \n```java\n// 泛型方法\npublic <T> void addId(T id){}\n```\n"
- fmt: "\n- If we remove the `<T>` from above method, we will get compilation error\
    \ as it represents the declaration of the type parameter in a generic method.\n\
    - The type (class or interface) that has generic method, does not have to be of\
    \ genetic type.\n- While calling the generic method, we do not need to explicitly\
    \ indicate the type parameter.\n\n### Notes\n- Prefer using `Generics` and parameterized\
    \ classes/methods to enforce compile time type safety.\n- Use Bounded Type parameter\
    \ to increase flexibility of method arguments, at the same time it also helps\
    \ to restrict the types that can be used.\n\n### Questions\n- Explain Generics\
    \ method?\n- Can you add a Generic method to a non-Generic type?\n- What are the\
    \ benefits of defining bounded type as method parameters?\n- How's compile type\
    \ safety enforced by `Generics`?\n\n# Java Generics vs Java Array\n\n## Java Generics\n\
    \nConsider the following hierarchy, \n\n![Image](OEBPS/Images/image00215.jpeg)\n\
    \nAs both `Car` and `Bike` are derived from `Vehicle`, is it possible to assign\
    \ `List<Car>` or `List<Bike>` to variable of `List<Vehicle>` ?\n\nActually not,\
    \ `List<Car>` or `List<Bike>` can not be replaced with `List<Vehicle>`, because\
    \ you cannot put a `Bike` in the same list that has cars. So even though `Bike`\
    \ is a `Vehicle`, it's not is a `Car`.\n\n```java\nList<Bike> bikes = new ArrayList<Bike>();\n\
    // suppose this is allowed\nList<Vehicle> vehicles = bikes; \nvehicles.add(new\
    \ Car());\n\n// Error - Bike and Vehicle are considered incompatible types.\n\
    Bike bike = vehicles.get(0); \n```\n\nJava compiler does this checking compile\
    \ time, for the incompatible types. For more on this refer [Type Erasure](#part0079.xhtml).\n\
    \n## Java Array\n\nHowever, unlike `Generics`, array of `Car` can be assigned\
    \ to array of `Vehicle`:\n\n```java\nCar[] cars = new Car[3]; \nVehicle [] vehicles\
    \ = cars;\n```\n\nFor Array, even though the compiler allows the above code to\
    \ compile but when you run this code, you will get `ArrayStoreException`.\n\n\
    ```java\n// this will result in ArrayStoreException\nvehicles[0] = new Bike();\n\
    ```\n\nSo even though the compiler did not catch this issue, runtime type system\
    \ caught it. Array are reifable types, which means that run time is aware of its\
    \ type.\n\n### Questions\n- What are reifable types?\n- Why can't you assign a\
    \ Generic collection object of sub type to a Generic collection object of super\
    \ type?\n- Why it's allowed to assign an array object of sub type to an array\
    \ object of super type? Are Java array more polymorphic than `Generics`?\n\n#\
    \ Type Erasure\n\nFor Java generic types, due to a process known as `type erasure`,\
    \ Java compiler discards the type information and it is not available at runtime.\
    \ As the type information is not available runtime, java compiler takes an extra\
    \ care to stop you at compile time itself, preventing any heap pollution. \n\n\
    Generics type are also of `non-reifiable` types, which means its type information\
    \ is removed during the compile time. \n\n### Questions\n- What are non-reififable\
    \ types?\n- What is type erasure?\n- What would happen if type erasure is not\
    \ there?\n\n# Co-variance\n\n`Covariance` is a concept where you can read items\
    \ from a generics defined with upper bound type wildcard, but you cannot write\
    \ anything into the collection. \n\nConsider the following declarations with upper\
    \ bound type wildcard:\n\n```java\nList<? extends Vehicle> vehicles = new ArrayList<Bike>();\
    \ \n```\n\nYou are allowed to read from `vehicles` generic collection, because\
    \ whatever is present in the list is sub-class of `Vehicle` and can be up-casted\
    \ to a `Vehicle`.\n\n```java\nVehicle vehicle = vehicles.get(0);\n```\n\nHowever,\
    \ you are not allowed to put anything into a covariant structure.\n\n```java\n\
    // This is compile error\nvehicles.add(new Bike());\n```\n\nThis would not be\
    \ allowed, because Java cannot guarantee what is the actual type of the object\
    \ in the generic structure. It can be anything that extends `Vehicle`, but the\
    \ compiler cannot be sure. So you can read, but not write.\n\n### Questions\n\
    - Explain co-variance?\n- Why can't you add an element of subtype to a generic\
    \ defined with upper bound type wildcard?\n\n# Contra-variance\n\n`Contra-variance`\
    \ is a concept where you can write items to a generic defined with lower bound\
    \ type wildcard, but you cannot read anything from the collection. \n\nConsider\
    \ the following declarations with lower bound type wildcard:\n\n```java\nList<?\
    \ super Car> cars = new ArrayList<Vehicle>();\n```\n\nIn this case, even though\
    \ the ArrayList is of type `Vehicle`, you can add `Car` into it through contra-variance;\
    \ because `Car` is derived from `Vehicle`. \n\n```java\ncars.add(new Car());\n\
    ```\n\nHowever, you cannot assume that you will get a `Car` object from this contra-variant\
    \ structure. \n\n```java\n// This is compile error\nCar vehicle = cars.get(0);\n\
    ```\n\n### Questions\n- Explain contra-variance?\n- Why can't you read element\
    \ from a Generic defined with lower bound type wildcard?\n\n# Co-variance vs Contra-variance\n\
    \n- Use `covariance` when you only intend to read generic values from the collection,\n\
    - Use `contra-variance` when you only intend to add generic values into the collection,\
    \ and\n- Use the specific generic type when you intend to do both, read from and\
    \ write to the collection.\n\n### Questions\n- When should you use co-variance?\n\
    - When should you use contra-variance?\n\n# COLLECTIONS\n\n## Collections\n\n\
    Collections are data structures that are basic building blocks to create any production\
    \ level software application in Java. Interviewers are interested in understanding\
    \ different design aspects related to correct usage of collections. Each collection\
    \ implementation is written and optimized for specific type of requirement, and\
    \ interview questions are to gauge interviewee's understanding of such aspects.\
    \ \n\nQuestions are often asked to check whether the interviewee understands correct\
    \ usage of collection classes and is aware of alternative solutions available.\n\
    \nFollowing are few aspects on which questions on collections are asked:\n- Collection\
    \ types in Java.\n- Unique features of different collection types.\n- Synchronized\
    \ collection.\n- Concurrent collection.\n- Ordering of elements in a collection.\n\
    - Speed of reading from collection.\n- Speed of writing to collection.\n- Uniqueness\
    \ of elements in a collection.\n- Ease of inter-collection operation.\n- Read-only\
    \ collections.\n- Collection navigation.\n\n## Collection Fundamentals\n\nCollection\
    \ is a container that groups multiple elements together. Following is a simple\
    \ example of a collection.\n\n```java\n// Create a container list of cities\n\
    List<String> cities = new ArrayList<>(); \n// add names of cities\ncities.add(\"\
    London\"); \ncities.add(\"Edinburgh\"); \ncities.add(\"Manchester\");\n```\n\n\
    ### Notes\n- Collections work with reference types.\n- All collection interface\
    \ implementation are `Generic`.\n- All collection types can grow or shrink in\
    \ size, unlike arrays.\n- Java provides lots of methods to manipulate collections\
    \ based on its usage, so before you add one, always check the existing methods.\n\
    \n## Collection Framework\n\nCollection framework is defined by the following\
    \ components.\n\n- *Interfaces* - are the abstract types defined for each specific\
    \ type of usage and collection type.\n- *Implementation* - are concrete implementation\
    \ classes to create object to represent different type of collections.\n- *Algorithms*\
    \ - are applied to these collections to perform various computation and to manipulate\
    \ the elements in the collection.\n\n*Collection Framework* helps you to reduce\
    \ programming efforts, by providing data structures and *algorithms* to operate\
    \ on them.\n\n### Questions\n- Explain collections?\n- How collections and Generics\
    \ related?\n- Can you use collections with the primitive types?\n- How can you\
    \ use collection with the primitive types?\n- Explain difference between collections\
    \ and arrays?\n- What is the benefit of collection framework?\n- What are the\
    \ different components of collection framework?\n"
