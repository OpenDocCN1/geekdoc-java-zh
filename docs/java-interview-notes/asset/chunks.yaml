  trans: "\n\n```java\ntry (FileInputStream fis = new FileInputStream(\"details.txt\"\
    )) {\n    // code to read data\n}\n```\n\n* 与 `try-with-resource` 使用的资源必须继承 `AutoCloseable`\
    \ 接口。\n* 你可以在 try 块中指定多个资源。\n\n## 问题\n* 你可以使用哪种 Java 构造来自动关闭系统资源？\n* 在 try-with-resource\
    \ 构造中使用类对象时，该类应该继承自哪个接口？\n\n# 多线程 (THREADING)\n\n### 线程术语\n* `Thread` 是进程中最小的可执行代码单元。\n\
    * `Program`（程序）是一组有序的操作。\n* `Process`（进程）是程序的实例。\n* `Context Switch`（上下文切换）是存储和恢复线程状态的昂贵过程。\n\
    * `Parallel processing`（并行处理）是在多个核心上同时执行同一任务。\n* `Multithreading`（多线程）是 CPU 同时执行多个进程或线程的能力。\n\
    * `Deadlock`（死锁）发生在两个线程等待对方释放锁时。\n\n### 基本概念\n* 所有 Java 程序都从用户线程上的 `main()` 方法开始。\n\
    * 当没有没有用户线程可以执行时，程序终止。\n* `Thread` 维护一个私有栈和一系列待执行的指令。\n* `Thread` 有一个名为线程本地存储（thread\
    \ local storage）的私有内存，在多线程环境中可存储线程当前操作相关的数据。\n* `JVM` 允许进程拥有多个线程。\n* 每个线程都有一个优先级。\n\
    \n## 问题\n* 什么是线程？\n* 什么是程序？\n* 什么是进程？\n* 线程和进程之间有什么区别？\n* 程序和进程之间有什么区别？\n* 解释线程的上下文切换？\n\
    * 什么是并行处理？\n* 什么是多线程？\n* 并行处理和多线程有什么联系？\n* 什么是死锁？\n* 什么是用户线程？\n* 什么是线程本地存储？你会用线程本地存储存储哪些内容？\n\
    * 线程共享栈内存吗？\n\n## 线程生命周期\n以下是线程状态的不同阶段。\n\n* **New**（新建）：线程已创建但尚未启动。\n* **Runnable**（可运行）：线程正在运行。\n\
    * **Blocked**（阻塞）：线程正在等待进入临界区。\n* **Waiting**（等待）：线程通过调用 `wait()` 或 `join()` 进行等待。\n\
    * **Time-waiting**（计时等待）：线程通过调用指定超时时间的 `wait()` 或 `join()` 进行等待。\n* **Terminated**（已终止）：线程已完成任务并退出。\n\
    \n### 注意事项\n你可以使用线程上的 `getState()` 方法获取线程状态。\n\n## 问题\n* 描述线程生命周期的不同阶段？\n* 阻塞状态（blocked）和等待状态（waiting）有什么区别？\n\
    * 如何找到线程的状态？\n* 线程的 sleep() 方法与线程的 wait() 方法有什么区别？\n\n## 线程终止\n线程应该通过调用 `interrupt()`\
    \ 方法来停止。调用线程中断甚至可以跳出 `Thread.sleep()`。\n\n在线程上执行的操作应循环定期调用 `isInterrupted()` 方法来检查线程是否被请求停止，此时你可以安全地终止当前操作并执行任何必要的清理工作。\n\
    \n```java\nif (Thread.currentThread().isInterrupted()) {\n    // 清理并停止执行\n}\n\
    ```\n\n### 注意事项\n* `stop()`、`suspend()` 和 `resume()` 方法已被废弃，因为使用这些方法可能会导致程序处于不一致状态。\n\
    \n## 问题\n* 什么定义了终止线程的好策略？\n* 什么是线程中断（interrupt）？线程的 interrupt 方法与线程的 stop 方法有什么区别？\n\
    * 如果线程正在睡眠，你对该线程调用 interrupt 会发生什么？\n* 调用 interrupt 会立即停止线程吗？\n* 为什么你不应该调用线程的\
    \ stop 和 suspend 方法？\n\n# 实现 Runnable vs 扩展 Thread\n\n### 实现 `Runnable` 接口实例化线程\n\
    ```java\npublic class RunnableDerived implements Runnable { \n    public void\
    \ run() {\n    }\n}\n```\n\n### 扩展 `Thread` 类创建线程\n```java\npublic class ThreadDerived\
    \ extends Thread { \n    public void run() {\n    }\n}\n```\n\n* `Runnable` 的\
    \ `run()` 方法不会创建新线程，而是在创建它的同一个线程中作为普通方法执行，而 `Thread` 的 `start()` 方法创建一个新线程。\n\
    * `Runnable` 是在线程上执行任务的优选方式，除非你专门扩展 `Thread` 类（这在大多数情况下是不可能的）。\n* 通过实现 `Runnable`，你为专门的类提供了额外的运行能力。\n\
    * 此外，通过将任务分离为 `Runnable`，你可以使用不同的手段执行任务。\n\n## 问题\n* 创建线程的不同方式有哪些？\n* 实现 `Runnable`\
    \ 接口与扩展 `Thread` 类有什么区别？\n* 什么时候应该扩展 `Thread` 类？\n* 什么时候应该实现 `Runnable` 接口？\n\
    * 在 `Runnable` 和 `Thread` 之间，哪一种是优选方式？\n* 实现 `Runnable` 会创建线程吗？\n* `Thread` 类和\
    \ `Runnable` 接口都有 run 方法，有什么区别？\n\n# Runnable vs Callable 接口\n\n### `Runnable`\
    \ 接口\n```java\n@FunctionalInterface \npublic interface Runnable { \n    public\
    \ abstract void run();\n}\n```\n\n### `Callable` 接口\n```java\n@FunctionalInterface\
    \ \npublic interface Callable<V> { \n    V call() throws Exception;\n}\n```\n\n\
    * `Runnable` 不能返回结果，也不能抛出检查异常（checked exception）。\n* `Callable` 需要实现 `call()`\
    \ 方法，而 `Runnable` 需要实现 `run()` 方法。\n* `Callable` 可以与 `ExecutorService` 方法配合使用，但\
    \ `Runnable` 不行。\n\n## 问题\n* `Callable` 和 `Runnable` 接口有什么区别？\n* 使用 `Runnable`\
    \ 相比 `Callable` 有什么好处？\n* `Runnable` 接口可以抛出检查异常吗？\n* 为什么 `Runnable` 和 `Callable`\
    \ 接口被称为函数式接口？\n* 哪个接口返回结果：Runnable 还是 Callable？\n\n# 守护线程 (Daemon Thread)\n`daemon\
    \ thread`（守护线程）是一种允许 `JVM` 在程序结束时立即退出的线程，即使它仍在运行。也不会给予 `finally` 块执行的机会。守护线程以极低的优先级执行。\n\
    \n线程继承父线程的守护状态，这意味着由主线程创建的线程都是非守护线程。\n\n通常守护线程用于支持应用程序的后台任务或服务。垃圾回收在守护线程上进行。\n\
    \n你可以这样创建守护线程：\n```java\nThread thread = new Thread();\nthread.setDaemon(true);\n\
    ```\n\n非守护线程被称为用户线程。用户线程阻止 JVM 关闭。\n\n当没有用户线程时，进程终止。Java 主线程始终是用户线程。\n\n## 问题\n\
    * 什么是守护线程？\n* 什么是用户线程？什么是主线程？\n* 如果守护线程仍在运行，程序会退出吗？\n* 如果用户线程仍在运行，程序会退出吗？\n* 当\
    \ JVM 停止所有运行的守护线程时，守护线程上的 finally 块会有执行的机会吗？\n* 创建新线程时，它是作为用户线程还是守护线程创建的？\n* 没有用户线程但守护线程仍在运行时会发生什么？\n\
    * Java 主线程是用户线程还是守护线程？\n* 什么类型的工作应该使用守护线程？\n\n# 竞态条件与不可变对象\n*Race condition*（竞态条件）发生在多个线程并发访问共享数据并对其修改时。由于无法预测这些线程读取和写入顺序，可能会导致不可预测的数据值。\n\
    \n当一个对象在构造后没有改变状态的可能性时，它被认为是 *immutable*（不可变的）。如果一个对象是 *immutable* 的，它就可以在多个线程之间共享，而无需担心\
    \ *race condition*。\n\n## 如何使一个对象变为不可变\n\n"
- fmt: "\n* Declare the class `final`.\n* Allow only constructor to create object.\
    \ Don't provide field `setter`.\n* Mark all the field `private`.\n\n## Questions\n\
    \n* How immutable objects help preventing race condition?\n* Why race condition\
    \ may produce unpredictable results?\n* Why immutable objects are considered safe\
    \ in multi threaded environment?\n* Why should you declare immutable class as\
    \ `final`?\n* Why constructor should be the only way to create immutable object?\
    \ What happens if setters are provided?\n\n## Thread Pool\n\n`Thread Pool` is\
    \ a collection of specified number of worker threads, which exists separately\
    \ from the `Runnable` and `Callable` tasks.\n\nA fixed thread Pool reduces the\
    \ overhead of thread creation. It helps the application to `degrade gracefully`\
    \ when there is a surge of requests beyond its capacity to process, by preventing\
    \ application from going into a hang state or from crashing.\n\nThread Pool also\
    \ enables a loosely coupled design by decoupling the creation and execution of\
    \ tasks.\n\nCreating a fixed thread pool is easy with `Executors` class where\
    \ you can use `newFixedThreadPool()` factory method to create `ExecutorService`\
    \ to execute tasks.\n\n## Questions\n\n* What is thread pool?\n* How a thread\
    \ pool reduces the overhead of thread creation?\n* How a thread pool helps to\
    \ prevent application from hanging or crashing?\n* What is fixed thread pool and\
    \ how is it created?\n* How does thread pool enables loosely coupled design?\n\
    \n## SYNCHRONIZATION\n\n### Concurrent vs Parallel vs Asynchronous\n\n`Parallel\
    \ processing` is simultaneous execution of same task on multiple cores.\n\n`Concurrent\
    \ processing` is simultaneous execution of multiple tasks; either on multiple\
    \ cores or by pre-emptively time-shared thread on the processor.\n\n`Asynchronous\
    \ processing` is independent execution of a process, without waiting for a return\
    \ value from intermediate operations.\n\n## Questions\n\n* Explain concurrent\
    \ processing?\n* Explain parallel processing?\n* Explain asynchronous processing?\n\
    * Explain the difference between concurrent and parallel processing?\n* Does parallel\
    \ processing require multiple threads?\n* When an application is concurrent but\
    \ not parallel?\n    * When application processes multiple operations simultaneously\
    \ without dividing these operations further into smaller tasks.\n* When an application\
    \ is parallel but not concurrent?\n    * When application processes one operation\
    \ dividing the operation into smaller tasks that are processed in parallel.\n\
    * When an application is neither concurrent not parallel?\n    * When application\
    \ processes only one operation without dividing the operation into smaller tasks.\n\
    * When an application is both concurrent and parallel?\n    * When application\
    \ processes multiple operations simultaneously and also dividing these operations\
    \ further into smaller tasks that are processed in parallel.\n\n## Thread Synchronization\n\
    \n`Race condition` occurs when multiple threads concurrently access a shared data\
    \ to modify it. As it is not possible to predict the order of data read and write\
    \ by these threads, it may lead to unpredictable data value.\n\n`Critical Section`\
    \ `i` is the block of code that if accessed concurrently, by more than one thread,\
    \ may have undesirable effects on the outcome.\n\n`Thread Synchronization` is\
    \ controlling the access to `critical section` to prevent undesirable effects\
    \ in the program.\n\nSynchronization creates memory barrier, known as `happen-before`,\
    \ which ensures that all the changes made by a thread to the local objects in\
    \ the critical section, are available to any other thread that acquires the same\
    \ local objects subsequently.\n\n## Questions\n\n* Explain race condition in multi-threading?\n\
    * What is critical section?\n* What is thread synchronization?\n* What is a memory\
    \ barrier?\n* What is the concept of happen-before in thread synchronization?\n\
    \n### Synchronized Method vs Synchronized Block\n\n`synchronized` keyword is used\
    \ to mark critical section in the code.\n\nMutual exclusion synchronization is\
    \ achieved by locking the critical section using `synchronized` keyword.\n\nThis\
    \ can be done in following two ways.\n\n#### Marking method as critical section\n\
    \n```java\npublic class DatabaseWrapper {\n  Object reference = new Object();\n\
    \n  // Method marked as critical section \n  public synchronized void writeX()\
    \ { // code goes here }\n\n  // Method marked as critical section \n  public static\
    \ synchronized void writeY() { // code goes here }\n}\n```\n\n#### Marking block\
    \ of code as critical section\n\n```java\npublic void writeToDatabase() {\n  //\
    \ multiple threads can reach here\n\n  // Code marked as critical section \n \
    \ synchronized (this) {\n    // only one thread can\n    // execute here at a\
    \ time\n  }\n  // multiple threads can execute here\n}\n```\n\n## Notes\n\n* Minimize\
    \ the scope of locking to just `critical section`. This will improve overall performance\
    \ and minimize chances for encountering a race condition.\n* Prefer `synchronized`\
    \ block over `synchronized` method, as block locks only on a local object as opposed\
    \ to entire class object.\n* Inside `synchronized`, never call a method provided\
    \ by the client code or the one that is designed for inheritance.\n\n## Questions\n\
    \n* How is synchronized keyword used?\n* What is the difference between synchronized\
    \ method and synchronized block?\n* Why synchronized block is preferred to synchronized\
    \ method?\n* Does synchronized method locks the entire object?\n* What problem\
    \ you may encounter if you call a method provided by the client, from inside the\
    \ synchronized block or method?\n\n## Conditional Synchronization\n\nConditional\
    \ `synchronization` is achieved using conditional variable along with `wait()`\
    \ and `notify()` or `notifyAll()` methods.\n\n```java\n// conditional synchronization\n\
    public void operation() throws InterruptedException {\n  synchronized(reference)\
    \ {\n    if (condition1) {\n      // wait for notification \n      reference.wait();\n\
    \    }\n    if (condition2) {\n      // Notify all threads \n      reference.notifyAll();\n\
    \    }\n  }\n}\n```\n\n1. There are two methods to signal waiting thread(s).\n\
    \    * `notify()` - signals only one thread.\n    * `notifyAll()` - signals all\
    \ threads in wait state.\n2. `wait()` has an overload to pass timeout too, `wait(long\
    \ timeOut)`.\n3. Between `notify()` and `notifyAll()` method, prefer using `notifyAll()`\
    \ as it notifies all waiting threads.\n4. `notify()` wakes a single thread, and\
    \ if multiple threads are waiting then the choice of thread is arbitrary.\n\n\
    ## Questions\n\n* What is conditional synchronization?\n* What is the propose\
    \ of the wait call?\n* What is the difference between notify and notifyAll method?\n\
    * When you call notify, with multiple threads waiting, which one will be notified?\n\
    * Between notify and notifyAll, which one would you prefer? Why?\n\n## Volatile\n\
    \nIn a `multi-threaded` application, every thread maintains a copy of variable\
    \ from main memory to its CPU cache. So any change made by a thread to the variable\
    \ in its CPU cache will not be visible to other threads.\n\nA field marked `volatile`\
    \ is stored and read directly from the main memory. As `volatile` field is stored\
    \ in the main memory, all the threads have visibility to most updated copy of\
    \ the `volatile` field's value, irrespective of which thread modified it.\n\n\
    Consider a class `Ledger`, which has a member `currentIndex` to keep track of\
    \ number of entries made. In a multi-threaded environment, each thread will increment\
    \ `currentIndex` value independently.\n\n```java\npublic class Ledger {\n  public\
    \ int currentIndex = 0;\n}\n```\n\nIf we mark `currentIndex` as `Volatile`, then\
    \ each thread will use its value from the `main memory` and will not create a\
    \ copy of it.\n\n```java\npublic class Ledger {\n  public volatile int currentIndex\
    \ = 0;\n}\n```\n\n![Image](OEBPS/Images/image00218.jpeg)\n\n## Questions\n\n*\
    \ What is volatile field?\n* Explain the problem that volatile field solves?\n"
