  trans: "\n\n* 你应该如何访问静态类成员？\n* 静态方法是否有权访问实例成员？为什么？\n\n## final\n\n### final 类\n\
    `final` 类不能被继承，这使得该类更加安全且高效。\n\n### final 方法\n`final` 方法不能被重写，这防止了在类类中引入任何意外行为的可能性。\n\
    \n### final 变量\n`final` 变量引用不能更改，但 `final` 变量所引用的可变对象的内容是可以更改的。\n\n* `blank final`\
    \ 变量 - 在声明时未初始化的变量。\n\n#### 注意事项\n* `blank final` 变量需要在类的构造函数中初始化。\n* `final`\
    \ 变量类似于 `immutable` 不变变量，因此与 final 变量相关的计算可以缓存以进行优化。\n\n#### 问题\n* 解释 `final`\
    \ 类？\n* 声明一个类为 `final` 有什么好处？\n* 解释 `final` 方法？\n* 将方法声明为 `final` 有什么好处？\n* 解释\
    \ `final` 变量？\n* 将变量声明为 `final` 有什么好处？\n* 当你声明变量为 `final` 时，你可以更改它引用的内容吗？\n* 当你声明变量为\
    \ `final` 时，你可以将其指向另一个对象吗？\n* 什么是 `blank final` 变量？\n* 将变量声明为 `final` 如何有助于优化？\n\
    \n## static 初始化块\n\n* `static initialization`块通常用于在使用类的任何对象之前，确保所需的资源（如驱动程序、连接字符串等）已可用。\n\
    * `static`块无法访问实例成员。\n* `static`块每个类只被调用一次。\n* 类可以定义任意数量的`static`块，它们会按照定义的顺序被调用。\n\
    * 你*只能*在`static`块中抛出`unchecked` 异常。\n\n在以下代码示例中，`static initialization`块为类只创建一个连接字符串。\n\
    \n```java\nprivate static String connectionString;\n\nstatic {\n  connectionString\
    \ = getConnection();\n}\n```\n\n#### 问题\n* 什么是`static initialization`块？\n* `static\
    \ initialization`块的主要目的是什么？在`static`块中你应该做什么？\n* 你可以从`static initialization`块访问实例成员吗？\n\
    * 当创建类的实例时，`static initialization`块会被调用一次吗？\n* 类中可以定义多少个`static`块？\n* 当定义了多个`static`块时，它们的执行顺序的标准是什么？\n\
    * 你可以从`static initialization`块抛出异常吗？什么类型？\n\n## finally\n\n`finally`块的主要目的是确保在执行完`try`块的操作后，应用程序恢复到状态。在`finally`块中，通常可以关闭如流和数据库连接之类的资源以防止内存泄漏。\n\
    \n```java\nInputStream is = null;\n\ntry{\n  is = new FileInputStream(\"input.txt\"\
    );\n}\nfinally {\n  if (is != null) {\n    is.close();\n  }\n}\n```\n\n### finally\
    \ 块执行\n编译器在以下情况下都不会执行`finally`块：\n* 调用了 `System.exit()`。\n* 当前线程被中断。\n* `JVM`\
    \ 崩溃。\n\n### 从 finally 返回\n绝对不要从`finally`块内部返回。如果`finally`块中存在`return`语句，它将立即返回，忽略函数中的任何其他`return`。\n\
    \n#### 问题\n* 如何保证代码块总是执行？\n* 在`finally`块中你应该做什么？\n* 在`catch`块中你应该做什么？\n* `finally`块不执行的条件是什么？\n\
    * 你应该从`finally`块返回吗？为什么？\n\n## finalize()\n\n当 Garbage Collector 确定没有该对象的引用时，它会调用该对象的`finalize()`；如果对象不符合垃圾收集条件，或者垃圾回收器在此之前停止，则不会调用。\n\
    \n`finalize()`可以被重写以释放文件句柄、数据库连接等资源；但你不能依赖`finalize()`方法，应该显式地释放此类资源。\n\n无法保证`JVM`会调用`finalize()`，你应该将`finalize()`方法仅作为释放资源的备份机制。可能的情况下，使用\
    \ try-with-resource 结构来释放资源。\n\n如果`finalize()`方法抛出未捕获的异常，该异常在结束之前会被忽略。\n\n####\
    \ 问题\n* Java 中的`finalize`方法是什么？\n* `finalize`方法何时被调用？\n* 谁调用了`finalize`方法？\n*\
    \ 在`finalize`方法中可以做哪些工作？\n* 你应该显式调用`finalize`方法来释放资源吗？为什么？\n* 哪些替代机制可以释放系统资源？\n\
    * 从`finalize`方法抛出未处理的异常会发生什么？\n\n## 宽转换与窄转换\n\n### 宽转换\n`Widening conversions`将`sub\
    \ class`（子类）赋值给`super class`（父类）。在下面的示例中，`Car`继承自`Vehicle`。\n\n```java\nCar car\
    \ = new Car();\nVehicle vehicle = car;\n```\n\n### 窄转换\n`Narrowing conversions`将`super\
    \ class`（父类）赋值给`sub class`（子类）。需要强制转换。在下面的示例中，`Bike`继承自`Vehicle`。\n\n```java\n\
    Vehicle vehicle = new Vehicle();\nBike bike = (Bike)vehicle;\n```\n\n#### 问题\n\
    * 什么是宽转换？\n* 什么是窄转换？\n* 窄转换是否存在数据丢失的可能性？\n\n## getters and setters\n\n下面的代码演示了`getter`和`setter`的用法。\n\
    \n```java\npublic class Person {\n  private String name;\n\n  public String getName()\
    \ {\n    return StringUtils.capitalize(name);\n  }\n\n  public void setName(String\
    \ name) {\n    if(name.isEmpty()){\n      System.out.println(\"Name string is\
    \ empty\");\n    }\n    this.name = name;\n  }\n}\n```\n\n### 使用 getter 和 setter\
    \ 的好处\n* 可以在 setter 中执行验证，或在以后需要时添加。\n* 根据内部（存储）或外部（调用者）的需求，值可以有替代表示。\n* 隐藏用于存储值的内部数据结构。\n\
    * 可以更改内部字段，而无需更改代码的使用。\n* 封装了获取或计算值的内部复杂性。\n* 为 getter 和 setter 指定不同访问修饰符的能力。\n\
    * 添加调试信息的能力。\n* 可以作为 Lambda 表达式的形式传递。\n* 许多库（如 mock、序列化等）期望通过 getter/setter 来操作对象。\n\
    \n#### 问题\n* 当可以直接暴露类字段时，为什么你需要 getter 和 setter？\n* 解释使用 getter 和 setter 的一些好处？\n\
    \n## varargs vs object array\n\n`varargs`参数允许向方法传递零或多个参数；而`object array`参数不能用零个参数调用。\n\
    \n### varargs\n```java\npublic static int getCumulativeValue(int... values){\n\
    \  int sum = 0;\n  for(int value : values){\n    sum += value;\n  }\n  return\
    \ sum;\n}\n```\n\n### object array\n```java\npublic static int getCumulativeValues(int[]\
    \ values){\n  int sum = 0;\n  for(int value : values){\n    sum += value;\n  }\n\
    \  return sum;\n}\n```\n\n* `varargs`只能是方法的最后一个参数；而对象数组可以按任意顺序定义。\n\n"
- fmt: "\n- Both `varargs` and object array are handled as array within a method.\n\
    - Though `varargs` are not very popular, but it can be used in any place where\
    \ you have to deal with indeterminate number of arguments.\n\n### Questions\n\
    - What is `varargs`?\n- What are the differences between `varargs` and object\
    \ array?\n- Can you call a method with zero arguments, which is defined with a\
    \ `varargs` as its only parameter?\n- Can you overload a method that takes an\
    \ int array, to take an int varargs?\n- What are the different scenarios where\
    \ you can use `varargs`?\n\n### Default Interface Method\n- `Default interface\
    \ methods` are directly added to an `Interface` to extend its capabilities.\n\
    - `Default interface method` can be added to enhance an `Interface` that is not\
    \ even under your control.\n- It does not break any existing implementation of\
    \ the interface it is added to.\n- Implementing class can override the default\
    \ methods defined in the interface.\n- `Default method` is also known as `Defender`\
    \ or `Virtual` extension method.\n\nIn this code example `default Interface method`,\
    \ `getAdditionSymbol()`, is added to an existing interface `Calculator`.\n\n```java\n\
    public interface Calculator {\n    public <T> T add(T num1, T num2);\n    default\
    \ public String getAdditionSymbol(){\n        return \"+\";\n    }\n}\n```\n\n\
    ### Limitations with Default method\n- If the class inherits multiple interfaces\
    \ having default methods with same signature, then the implementing class has\
    \ to provide implementation for that default method to resolve ambiguity.\n- If\
    \ any class in the inheritance hierarchy has a method with the same signature,\
    \ then default methods become irrelevant.\n\n### Default method vs Abstract method\n\
    Following are couple of minor differences:\n- Abstract methods allows defining\
    \ constructor.\n- Abstract methods can have a state associated.\n\n### With Default\
    \ method - Abstract class vs Interface\nWith the introduction of `default methods`,\
    \ now even the `Interfaces` can be extended to add more capabilities, without\
    \ breaking the classes that inherit from the Interface.\n\n### Questions\n- What\
    \ are default interface methods?\n- What are the benefits of default interface\
    \ methods?\n- Can you add default interface methods to enhance an interface that\
    \ is not directly under your control?\n- Can you override the default interface\
    \ methods to provide different implementation?\n- What happens when a class inherits\
    \ two interfaces and both define a default method with the same signature?\n-\
    \ How defining a default method in an interface is different from defining the\
    \ same method in an abstract class?\n\n### Static Interface Method\n- `Static\
    \ Interface methods` are directly added to an interface to extend its capabilities.\n\
    - `Static Interface methods` are generally used to implement utility functions\
    \ like: validations, sorting, etc.\n- `Static interface methods` are also used\
    \ when you want to enforce specific behaviour in the classes inheriting the Interface.\n\
    - Implementing class cannot override the static methods defined in the interface\
    \ it is inheriting.\n- `Static Interface method` can even be added to enhance\
    \ an interface which is not under your control.\n- Similar to default Interface\
    \ method, even the static interface method does not break any existing implementation\
    \ of the interface.\n\nIn this code example, `static Interface method`, `getUtcZonedDateTime()`,\
    \ is added to an existing interface `DBWrapper`.\n\n```java\npublic interface\
    \ DBWrapper {\n    static ZonedDateTime getUTCZonedDateTime(Instant date ){\n\
    \        ZoneId zoneId = TimeZone.getTimeZone(\"UTC\").toZoneId();\n        ZonedDateTime\
    \ zonedDateTime = ZonedDateTime.ofInstant(date, zoneId);\n        return zonedDateTime;\n\
    \    }\n}\n```\n\n### Questions\n- What are static interface methods?\n- Where\
    \ can you use static interface methods?\n- Can you override static interface methods?\n\
    - What is the difference between static and default interface methods?\n- Can\
    \ you add static interface method to enhance an interface, which is not directly\
    \ under your control?\n- What happens if a class inherits two interfaces and both\
    \ define a static interface method with the same signature?\n\n### Annotations\n\
    An `annotation` associates metadata to different program elements. Annotations\
    \ may be directed at the compiler or at runtime processing.\n`Annotation` metadata\
    \ can be used for documentation, generating boilerplate code, performing compiler\
    \ validation, runtime processing, etc. `Annotations` do not have any direct effect\
    \ on the code piece they annotate.\n\nWe can apply `annotations` to a field, variable,\
    \ method, parameter, class, interface, enum, package, annotation itself, etc.\n\
    \n#### Usage\nUser defined annotations are directly placed before the item to\
    \ be annotated.\n\n```java\n@Length(max=10, min=5)\npublic class ParkingSlot {\n\
    \    // Code goes here*\n}\n```\n\n#### Few built-in annotations\n- `@Deprecated`\
    \ - signifies that method is obsoleted.\n- `@Override` - signifies that a superclass\
    \ method is overridden.\n- `@SupressWarnings` - used to suppress warnings.\n\n\
    #### Questions\n- What are annotations?\n- Where can you use annotations?\n- What\
    \ are the different Java entities where you can apply annotations?\n\n### Preferences\n\
    In Java, the `Preferences` class is used for storing user and system preferences\
    \ in `hierarchical` form. `Preferences` class abstracts out the process of storage.\
    \ It stores the preferences in a way that is specific to the Operating System:\
    \ preferences file on Mac, or the registry on Windows systems. Though the keys\
    \ in `preferences` are `Strings` but value can belong to any primitive type.\n\
    \nApplications generally use `Preferences` class to store and retrieve user and\
    \ system preferences and configuration data.\n\n### Questions\n- What is the use\
    \ of `Preferences` class?\n- What are the types of information that can be stored\
    \ with Preferences?\n- While using Preferences class, do you have to handle the\
    \ internal format required by the Operating System?\n\n### Pass by value or Pass\
    \ by Reference\nIn Java - method arguments, primitive or object reference, are\
    \ `always by value` and access to an object is allowed only through a reference.\
    \ While passing an object to a method, it's the copy of the reference that is\
    \ passed and not the object. Any changes done to the object reference, changes\
    \ the object content and not the value of reference.\n\n### Questions\n- What\
    \ is the difference between pass by value and pass by reference?\n- How are reference\
    \ type arguments passed in Java; by reference or by value?\n- If a copy of reference\
    \ is passed by value, how can the method get access to the object that the reference\
    \ is pointing to?\n- If a copy of reference is passed by value, can you change\
    \ the value of reference?\n\n### Naming Convention Camel Case vs Pascal Case\n\
    `Camel Case` is practice of writing composite words such that the first letter\
    \ in each word is capitalized, like `BorderLength`; it is also known as `Pascal\
    \ Case` or `Upper Camel Case`. But in programming world, Camel case generally\
    \ starts with the lower case letter, like `borderLength;` it is also known as\
    \ `Lower Camel Case`. For this discussion, let's consider the format `BorderLength`\
    \ as `Pascal Case` and the format `borderLength` as `Camel Case`.\n\n### Naming\
    \ Convention\n`Naming convention` is a set of rules that govern the naming for\
    \ the identifiers representing interface, class, method, variables, and other\
    \ entities. Choice and implementation of naming conventions often becomes matter\
    \ of debate.\n\nStandard naming convention improves the code readability, which\
    \ helps in review and overall understanding of the code.\n\n### Interface\n- Name\
    \ should be `Pascal Case`.\n- Name should be an `adjective` if it defines behaviour,\
    \ otherwise `noun`.\n\n```java\npublic interface Runnable\n```\n\n### Class\n\
    - Name should be `Pascal Case`.\n- Name should be a `noun,` as a `class` represents\
    \ some real world object.\n\n```java\npublic class ArrayList\n```\n\n### Method\n\
    - Name should be `Camel Case`.\n\n```java\npublic boolean isEmpty()\n```\n\nVariable\n"
