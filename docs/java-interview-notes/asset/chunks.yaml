    \n14.  Explicitly name the threads - in a multithreaded application, it significantly\
    \ eases the debugging.\n\n15.  Never throw a generic exception - as it will be\
    \ impossible to ascertain reason for the exception.\n\nQuestions\n\n*   Describe\
    \ some exception handling best practices?\n\n*   What are the pitfalls of suppressing\
    \ an exception?\n\n*   What is the problem with showing a generic error message?\n\
    \n*   What is the downside of swallowing an exception?\n\n*   What are the pitfalls\
    \ of handling multiple exceptions in a single catch block?\n\n*   What would you\
    \ do if an exception is thrown from a source that contains sensitive information?\
    \ What would you log in such case and what message would you show to the user?\n\
    \n*   What is the pitfall of wrapping all the exceptions into a Generic exception\
    \ class?\n\n*   Why you shouldn't use exceptions to control the flow of program\
    \ execution?\n\n*   Should you log all the exceptions? Why?\n\n*   Why you shouldn't\
    \ use Throwable or some other root level class to catch exceptions?\n\n*   What\
    \ should be the criteria to select the code block that should be enclosed into\
    \ a try block?\n\n*   If a nested call is made, which passes through multiple\
    \ methods, would you implement try-catch in each method? Why?\n\ntry-with-resource\n\
    \n*try-with-resource* is Java language construct, which makes it easier to automatically\
    \ close the resources enclosed within the *t**ry*  statement. "
