    \ than the number of processors available in the system.*\n\n*   *You should query\
    \ the host to find the number of processor to configure thread pool.*\n\n*Runtime.getRuntime().*\
    \ ***availableProcessors****();*\n\nQuestions\n\n*   Explain ExecutorService?\n\
    \n*   How can you track progress and status of executing task?\n\n*   Does Executor\
    \ service use dedicated threads to execute queued tasks?\n\n*   Can you use Runnable\
    \ object with the ExecutorService? Why?\n\n*   How do you find if an exception\
    \ is thrown in the ExecutorService?\n\n*   Can you schedule a task to run in future\
    \ with the ExecutorService?\n\n*   With ExecutorService, how can you get results\
    \ from multiple tasks?\n\n*   What is the difference between submit() and execute()\
    \ methods of ExecutorService?\n\n    *   *If you use submit(), you can get any\
    \ exception thrown by calling get() method on Future; whereas, if you use execute(),\
    \ exception will go to* *UncaughtExceptionHandler**. *\n\n*   How can you exit\
    \ gracefully from ExecutorService?\n\n*   What should be the criteria for configuring\
    \ thread pool size? How can you set that?\n\nFork-Join\n\n*   *Fork-Join* framework\
    \ takes advantage of multi-processors and multi-cores systems.\n\n*   It divides\
    \ the tasks into sub-tasks to execute in parallel.\n\n*   *fork()* method spawns\
    \ a new sub-task from the task.\n\n*// spawn subtask* subTask.**fork()**;\n\n\
    *   *join()* method lets the task wait for other task to complete.\n\n*// wait\
    \ for subtask to complete* subTask.**join()**;\n\n*   Important classes in Fork-Join\n\
    \n    *   *ForkJoinPool* - thread pool class is used to execute subtasks.\n\n\
    \    *   *ForkJoinTask* - manages subtask using *fork()* and *join()* methods.\n\
    \n    *   *RecursiveTask* - task that yields result.\n\n    *   *RecursiveAction*\
    \ - task that does not yield result.\n\n*   Both, *RecursiveTask* and *RecursiveAction*\
    \ provides abstract *compute()* method to be implemented by the class, whose object\
    \ represents the *ForkJoin* task.\n\nQuestions\n\n*   Explain Fork-Join framework\
    \ in Java?\n\n*   How Fork-Join framework helps to optimize task execution?\n\n\
    *   What is the difference between RecursiveTask and RecursiveAction?\n\n**REFLECTION**\n\
    \nReflection\n\n*Reflection*  is used to examine the code runtime and possibly\
    \ modify the runtime behaviour of an application.\n\nPurpose of reflection\n\n\
    *Reflection*  must be used only for special purpose problem solving and only when\
    \ information is not publicly available. Class members are marked private for\
    \ reasons. Few of the popular usage of reflection in day to day development includes\
    \ following:\n\n*   Reflection facilitates modular software development by investigating\
    \ code and libraries at runtime, to plugin classes and components. \n\n*   Annotations\
    \ are read using reflection.  *JUnit*  uses reflection to discover methods to\
    \ setup and test.\n\n*   Debuggers uses reflection to read private members of\
    \ the class.\n\n*   IDEs use reflection to enumerate class members and probe code.\n\
    \n*   Object relational mappers use reflection to create objects from data.\n\n\
    *   Dependency Injection framework like  *Spring*  uses reflection to resolve\
    \ dependencies.\n\nUsage\n\nThe code below demonstrates use of reflection to access\
    \ *private field* of class *Account*.\n\npublic class Account { private float\
    \ rate = 10.5f;\n\n}\n\npublic static void main(String [] args)\n\n throws IllegalAccessException\
    \ {\n\n Account account = new Account();\n\n Class<? extends Account> refClass\
    \ =\n\n account.getClass();\n\n *// get all the field* Field [] fields =\n\n refClass.getDeclaredFields();\n\
    \n for(Field field : fields){\n\n *// no more private* field.setAccessible(true);\n\
    \n *print*(field.get(account));\n\n }\n\nQuestions\n\n*   What is reflection?\n\
    \n*   What are the different scenarios where reflection can be used?\n\n*   How\
    \ does debuggers use reflection?\n\n*   How does reflection helps in creating\
    \ modular software architecture?\n\n*   Can you access private members using reflection?\n\
    \n*   Give some examples, where reflection is used by libraries, tools and frameworks?\n\
    \nDrawbacks of reflection\n\n*Reflection* must be used only when something is\
    \ not publicly available and there is a very compelling reason; otherwise you\
    \ must review your design.  \n\nDrawbacks\n\n*   *Reflection* does not have compile\
    \ time checking, any change in member's name will break the code.\n\n*   *Reflection*\
    \ violates encapsulation as it reveals the internal data structures.\n\n*   *Reflection*\
    \ violates abstraction as it reveals the internal implementation and provides\
    \ an ability to bypass validations applied to the members.\n\n*   *Reflection*\
    \ is slow, as it has additional overhead at runtime to resolve the members.\n\n\
    Questions\n\n*   When should you use reflection?\n\n*   How does reflection violates\
    \ encapsulation?\n\n*   How does reflection violates abstraction?\n\n*   Why reflection\
    \ is considered slow?\n\n*   Why reflection code is considered fragile and can\
    \ break?\n\n**DATA**\n\n**INTERCHANGE**\n\nJSON\n\n*JavaScript Object Notation*,\
    \ or *JSON* has become extremely popular for the data interchange in the last\
    \ few years. Now it's not just an alternative to XML but is a successor to it.\
    \ With the evolution of Big Data and Internet of Things, along with JSON's ability\
    \ to be easily parsed to JavaScript object, it has become preferred data format\
    \ for integration with the web. Following are the few primary factors behind this.\n\
    \n*   It's interoperable, as it's restricted to primitive data types only.\n\n\
    *   It's lightweight and less verbose than XML.\n\n*   It's very easy to serialize\
    \ and transmit structured data over network.\n\n*   Almost all modern languages\
    \ support it.\n\n*   JavaScript parser in all the popular web browsers supports\
    \ it.\n\nJSON Structures\n\nJSON structures can be categorized as JSON Object\
    \ and JSON array. \n\nJSON Object\n\nJSON object is simply a name-value pair separated\
    \ by a comma. Name is always a string. \n\n![Image](OEBPS/Images/image00219.jpeg)\n\
    \nJSON Array\n\nJSON Array is an ordered collection of values. Value can be a\
    \ string, a number, an object or an array itself. \n\n![Image](OEBPS/Images/image00220.jpeg)\n\
    \nQuestions\n\n*   What is JSON?\n\n*   What is the main reason for JSON's popularity?\n\
    \n*   What are significant differences between JSON and XML data formats?\n\n\
    *   Why JSON has become preferred format for data interchange?\n\n*   Explain\
    \ the difference between JSON Object and JSON Array?\n\n**MEMORY**\n\n**MANAGEMENT**\n\
    \nStack vs Heap\n\n*   *Stack* is memory associated with each system thread when\
    \ it's created; whereas, heap is shared by all the threads in an application. \n\
    \n*   For each function the thread visits, a block of memory is allotted on the\
    \ top of stack - for local variables and bookkeeping data, which gets freed when\
    \ that function returns, in a LIFO order. In contrast, the allocation of memory\
    \ in Heap is relatively random with no enforced pattern, and variables on heap\
    \ are destroyed manually. \n\n*   When the thread exists, stack associated with\
    \ the thread is reclaimed. When the application process exists, heap memory is\
    \ reclaimed.\n\n*   Allocating and freeing stack memory is simpler and quicker,\
    \ it's as simple as adjusting pointers. Allocating and freeing memory is comparatively\
    \ complex in Heap, as there is no fixed pattern of memory allocation."
