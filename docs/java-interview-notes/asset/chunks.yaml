  trans: "\n\n* 使用服务定位器（Service Locator）有什么好处？\n* 服务定位器和依赖注入（Dependency Injection）模式之间的区别是什么？\n\
    * 在什么情况下你会优选择服务定位器而不是依赖注入，反之亦然？\n* 服务定位器如何帮助测试？\n\n## 钻石问题 (Diamond Problem)\n\
    \nJava 不允许继承多个类，因为当多个父类具有相同签名的方法时，会产生歧义，编译器无法决定使用哪个父类的方法。\n\n考虑下图所示的继承层次结构。如果\
    \ `Base` 类中定义的 `calculate()` 方法被 `DerivedLeft` 和 `DerivedRight` 同时重写，那么 `Confused`\
    \ 类继承哪个版本的 `calculate()` 就会产生歧义。\n\n![Image](img/image0021.jpeg)\n\n在下面的代码中，关于应该调用哪个版本的\
    \ `calculate()` 存在歧义。这在 Java 中被称为“钻石问题”。\n\n```java\npublic static void main (String\
    \ [] args){\n\n Base base = new Confused();\n\n base.calculate();\n\n}\n```\n\n\
    ### 默认接口方法的钻石问题\n\n随着`默认接口方法`（Default Interface methods）的引入，如果 `Base`、`DerivedLeft`\
    \ 和 `DerivedRight` 都是接口，并且三者都存在作为默认接口方法的 `calculate()`，这将导致“钻石问题”。\n\n在这种情况下，`Confused`\
    \ 类必须显式地重新实现 `calculate()` 方法；否则编译器将拒绝该歧义。\n\n### 问题\n\n* 解释 Java 中的钻石问题？\n* 为什么\
    \ Java 不提供多继承？\n* 使用默认接口方法，类仍然可以继承两个具有相同签名方法的接口；这不会导致钻石问题吗？你如何解决它？\n\n## 面向接口编程\
    \ (Programming to interface)\n\n`面向接口编程`通过促进软件组件之间的解耦，形成了模块化软件开发的基础。高水平的解耦可以提高软件组件的可维护性、扩展性和可测试性。模块化软件设计也有助于加速上市，因为它促进了多个使用同一代码库的团队之间进行并行软件开发。\n\
    \n正是`面向接口编程`的设计范式构成了`反转控制`（Inversion of Control）的基础，它管理着任何大型软件应用程序中的依赖关系。\n\n\
    让我们来看一个非常简单的例子。假设我们有一个对集合进行`sort`的方法，它以接口 `Map` 作为参数定义。这意味着 `sort()` 方法没有绑定到任何特定的\
    \ `Map` 实现，你可以传递 `Map` 接口的任何具体实现。\n\n```java\npublic static void main (String\
    \ [] args){\n\n sort(new HashMap<>());\n\n sort(new TreeMap<>());\n\n sort(new\
    \ ConcurrentSkipListMap<>());\n\n sort(new TreeMap<>());\n\n}\n\npublic static\
    \ void sort(Map map){\n\n// perform sort\n }\n```\n\n### 面向接口编程的好处\n\n* 根据上下文，你可以在运行时选择最合适的行为。\n\
    * 对于测试，你可以传递 mock 对象（模拟对象）或 存根对象（stubs）实现。\n* 接口/API 定义或契约（contract）不会频繁更改。\n\
    * `面向接口编程`还促进了团队之间的并行开发，因为不同团队的开发人员在进行集成之前，可以继续针对接口编写代码。\n\n### 问题\n\n* `面向接口编程`的概念是什么？\n\
    * `面向接口编程`有什么好处？\n* `面向接口编程`如何促进软件组件之间的解耦？\n* `依赖注入`和`面向接口编程`之间是如何相互相关的？可以在不支持面向接口编程的情况下实现`依赖注入`吗？\n\
    * 模块化软件有什么好处？\n* 面向接口编程如何帮助单元测试？\n\n## 抽象类与接口 (Abstract Class vs Interface)\n\n\
    ### 抽象类\n\n`抽象类``不能`被实例化，但可以被扩展。当你希望在派生类之间强制执行通用设计和实现时，应该扩展抽象类。\n\n### 接口\n\n\
    `接口`是一组相关的方法，定义了它的行为以及与外部世界的契约。当你希望在无关的类之间定义通用行为时，使用接口。接口也可以没有方法方法，被称为`标记接口`（marker\
    \ interface）；此类接口用于对类进行分类。标记接口的示例是 `java.io.Serializable`，它没有定义任何方法，但必须由支持序列化的类来实现。\n\
    \n### 抽象类和接口的区别\n\n* 抽象类可以被更新以为类添加更多功能，而接口可以被添加以为类实现新行为。尽管随着`默认接口方法`的引入，即使接口也可以被扩展以具有更多功能。\n\
    * 接口可以多重继承；而抽象类不能。\n* 接口可以应用于不相关的类；而相关的类则扩展抽象类。\n* 抽象类方法可以有任何类型的访问修饰符；而接口拥有所有公有成员。\n\
    * 抽象类可以关联状态，这在接口中是不可能的。\n* 抽象类可以被扩展而不会破坏扩展它的类；而接口的任何更改（为默认和静态方法做的除外）都会破坏现有实现。\n\
    \n### 问题\n\n* 如果抽象类不能被实例化，为什么还要为抽象类定义构造函数呢？\n    * `构造函数可以用于执行所需的字段初始化并强制执行类约束。`\n\
    * 定义抽象类？抽象类在类设计中扮演什么角色？\n* 定义接口？接口在类设计中扮演什么角色？\n* 在什么情况下你会倾向于使用抽象类而不是接口，反之亦然？\n\
    * 解释抽象类和接口之间的各种区别？\n* 什么是标记接口？标记接口是如何使用的？\n* 你可以将接口方法声明为静态吗？\n* 随着默认方法的引入，抽象类与接口何何不同？\n\
    \n## 国际化与本地化 (Internationalization and Localization)\n\n### 国际化\n\n软件的国际化是确保软件不局限于一种语言或区域的过程。其缩写为\
