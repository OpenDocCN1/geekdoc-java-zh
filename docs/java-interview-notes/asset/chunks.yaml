    \n## INNER CLASSES\n\n### Inner Classes\n- `Inner Class` – is a class within another\
    \ class. \n- `Outer Class` – is an enclosing class, which contains inner class.\n\
    \n### Note\n- Compiler generates separate class file for each inner class.\n\n\
    ### Advantages of inner class\n- Its easy to implement callbacks using inner class.\
    \ \n- Inner class has access to the private members of its enclosing class, which\
    \ even the inherited class does not have.\n- Inner class helps implementing `closures`;\
    \ closures makes the surrounding scope and the enclosing instance accessible.\n\
    - Outer class provide additional namespace to the inner class.**\n\n### Questions\n\
    - What is inner class?\n- What is outer class?\n- What are the advantages of defining\
    \ an inner class?\n- What are closures? How inner class can be used to create\
    \ closures?\n- What are callbacks? How inner class can be used to create callbacks?\n\
    - Can inner class access private members of the enclosing outer class?\n- What\
    \ benefit does the outer class brings?\n\n### Static Member Nested Class\n- `Static\
    \ nested class` is declared as static inside a class like any other member.\n\
    - `Static nested class` is independent and has nothing to do with the outer class.\
    \ It is generally nested to keep together with the outer class.\n- It can be declared\
    \ public, private, protected or at package level.\n\n#### Declaration of static\
    \ nested class\n```java\n// outer class\npublic class Building { \n    // static\
    \ member inner class\n    public static class Block{\n    }\n}\n```\n\n#### Creating\
    \ object of static nested class\n```java\n// instance of static member inner class\n\
    Building.Block block = new Building.Block();\n```\n\n### Questions\n- What is\
    \ static nested class?\n- If both nested or independent static classes are same,\
    \ then what's the benefit of defining an inner class as static? \n\n### Local\
    \ Inner Class\n- `Local inner class` is declared and used inside the method block.\n\
    - It cannot be declared public, private, protected or at package level.\n\n####\
    \ Creation of local inner class\n```java\n// outer class\npublic class CityNames\
    \ { \n    private List<String> cityNames = new ArrayList<>(); \n    public Iterator<String>\
    \ nameIterator(){ \n        // local inner class \n        class NameIterator\
    \ implements Iterator<String> { \n            @Override \n            public boolean\
    \ hasNext() { \n                return false;\n            } \n            @Override\
    \ \n            public String next() { \n                return null;\n      \
    \      }\n        } \n        // return instance of local inner class. \n    \
    \    return new NameIterator();\n}\n}\n}\n```\n\n### Note\n- To use the inner\
    \ class outside, the local inner class must implement a public interface or Inherit\
    \ a public class and override methods to redefine some aspect.\n\n### Questions\n\
    - What is the difference between an inner class and a local inner class?\n- Why\
    \ can't you use access modifier with the local inner class?\n- Explain the rules\
    \ for defining local inner class?\n- What problem a local inner class solves?\n\
    \n### Non-Static Nested Class\n- `Non-static nested class` is declared inside\
    \ a class like any other member.\n- It can be declared public, private, protected\
    \ or at package level.\n- Non-static nested classes are actually closures, as\
    \ they have access to the enclosing instance.\n- Object of outer class is required\
    \ to create an object of non-static inner class.\n\n#### Declaration of non-static\
    \ nested class\n```java\n// outer class\npublic class Building { \n    // non-static\
    \ member inner class \n    public class Block{\n    }\n}\n```\n\n#### Creating\
    \ object of non-static nested class\n```java\n// instance of outer class\nBuilding\
    \ building = new Building(); \n// instance of non-static member inner class\n\
    Building.Block block = building.new Block();\n```\n\n### Questions\n- What is\
    \ non-static nested class?\n- Why a non-static nested class can be used as closures?\n\
    - Can you create instance of non-static inner class without defining an outer\
    \ class?\n\n### Anonymous Inner Class\n- `Anonymous inner class` does not have\
    \ a name.\n- The `anonymous inner class` is defined and its object is created\
    \ at the same time.\n- `Anonymous inner class` is always created using `new` operator\
    \ as part of an expression.\n- To create Anonymous class, `new` operator is followed\
    \ by an existing interface or class name.\n- The anonymous class either implements\
    \ the interface or inherits from an existing class.\n\n#### Creation of anonymous\
    \ inner class\n```java\n// outer class\npublic class CityNames { \n    private\
    \ List<String> cityNames = new ArrayList<>(); \n    public Iterator<String> nameIterator(){\
    \ \n        // Anonymous inner class \n        Iterator<String> nameIterator =\
    \ new Iterator<String> () { \n            @Override \n            public boolean\
    \ hasNext() { \n                return false;\n            } \n            @Override\
    \ \n            public String next() { \n                return null;\n      \
    \      }\n        }; \n        // return instance of local inner class. \n   \
    \     return nameIterator();\n}\n}\n}\n```\n\n### Notes\n- `Do not return an object\
    \ of inner classes as it could lead to memory leaks, because it has reference\
    \ to the outer enclosing class.`\n- `Use anonymous class when you want to prevent\
    \ anyone from using the class anywhere else.`\n- `Serialization of Anonymous and\
    \ Inner class must be avoided, as there could be compatibility issues during de-serialization,\
    \ due to different JRE implementation.`\n\n### Questions\n- What is anonymous\
    \ inner class?\n- How anonymous inner class is different from local inner class?\n\
    - Why you shouldn't return an object of inner from a method?\n- If you want to\
    \ prevent anyone from using your class outside, which type of inner class would\
    \ you define?\n- Why should you avoid serialization of anonymous and inner class?\n\
    \n## FUNCTIONAL PROGRAMMING\n\n### Functional Interface\n`Functional Interface`\
    \ is an interface with only one abstract method; but can have any number of default\
