    \ Data（用户数据）并添加 `TASK_LEVEL = true`\n\n### 5.2.2 Workpoint 组件\n\n我们将介绍 Workpoint\
    \ 设计器的基本组件。\n\n#### 活动节点 (Activity Node)\n\n活动代表业务流程中的一个步骤。根据活动完成的方式，有 3 种类型的活动。节点的显示方式也不同。\n\
    \n| 节点 | 类型 | 说明 |\n| :--- | :--- | :--- |\n| ![](img/image_rsrc8V6.jpg) | 由人工自动\
