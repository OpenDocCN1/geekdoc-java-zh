  trans: "\n\n邮件通知策略和邮件模板都取决于任务完成情况或事件结果（批准、拒绝或失败）。你不能在任何随心的时间发送邮件。例如，你可能有一个很长的流程步骤：\n\
    \n- 步骤 1：HR 人员更新用户的办公室。\n- 步骤 2：发送邮件提醒经理进行审批。\n- 步骤 3：发送修复工单，然后向 HR 人员发送邮件告知工单号。\n\
    - 步骤 4：向设施系统发送 Web 服务请求以申请访问权限。Web 服务响应成功后向 HR 人员发送邮件。如果请求失败，则向 IT 管理员发送邮件。\n\
    - 步骤 5：等待到预期的入职日期，发送邮件确认用户和 HR 人员。\n\n对于长流程，你必须分析何时需要通知邮件解决方案。本书提供了一个通过 Java API\
    \ 发送邮件的技巧。\n\n## 3. Service API\n\n- 可以随时发送邮件。\n- 支持动态内容。你可以使用任何流行的框架，如 `velocity`。\n\
    - 请注意，CA IdentityMinder 文档未提到这种方法。请自担风险使用。\n\n## 6.5.2 代码示例：邮件模板\n\n此示例展示了如何实现邮件模板。理解邮件模板对于下一个主题通知规则\
    \ API（Notification Rule API）是必要的。我们的示例代码将在管理员执行管理任务：“更新位置和分机号”成功后发送邮件。\n\n###\
    \ 代码\n\n1. 找到文件 `Update Location and Ext Number.tmpl`。\n2. 将文件拷贝到文件夹 `<server>\\\
    IdentityMinder.ear\\custom\\emailTemplates\\default\\completed`。\n\n### 配置：管理控制台\
    \ (Management Console)\n\n1. 在管理控制台中，点击 `Environments`。\n2. 点击环境名称。\n3. 点击 `Advanced\
    \ Settings`。\n4. 点击 `Email`。\n5. 勾选框框 `Tasks e-mail enabled`。\n\n| ![](img/image_rsrc8Y3.jpg)\
    \ |\n| 图 6-20 显示任务邮件启用配置 |\n\n6. 向下滚动直到看到“当以下任务完成或在工作流期间发送邮件”（Send e-mail when\
    \ the following tasks are completed or during workflow）\n    - 在 Admin Task Name（管理任务名称）中，从下拉菜单选择\
    \ `Equal` 并输入值：`Update Location and Ext Number`\n    - `Update Location and Ext\
    \ Number` 将出现在搜索结果中。选中该任务的复选框并点击添加按钮。\n    - 你应该任务列表中看到任务 `Update Location and\
    \ Ext Number`。\n\n| ![](img/image_rsrc8Y4.jpg) |\n| 图 6-21 显示为邮件模板添加任务 |\n\n7.\
    \ 点击保存按钮。\n8. 点击 `Restart Environment`（重启环境）按钮。\n\n### 工作原理\n\n执行管理任务：`Update\
    \ Location and Ext Number`。\n\n1. 以管理员身份登录 Identity Manager 用户控制台。\n2. 选择标签页 `Book\
    \ Example`，并选择菜单 `Update Location and Ext Number`。\n3. 搜索一个用户，屏幕将显示城市下拉菜单。\n4.\
    \ 修改城市属性并点击提交。\n\n### 收到邮件\n\n在管理员提交后，用户应该收到内容如下的邮件：\n\n| ![](img/image_rsrc8Y5.jpg)\
    \ |\n| 图 6-22 显示邮件内容 |\n\n打开文件 `Update Location and Ext Number.tmpl`，你将看到邮件内容的代码。它们有特殊的变量，如\
    \ `_to` 或 `_taskContextInformation`。`_to` 表示邮件收件者。我们将在通知规则 API 中涵盖更多细节。`_taskContextInformation`\
    \ 是任务上下文。更多详情请参见管理指南。\n\n```\n<% _to = _util.getNotifiers(\"USER\", \"\"); _cc\
    \ = \"\"; _bcc = \"\" ; _subject = \"Update Location and Ext Number\";%>User:<%var\
    \ imsEventContexts = _taskContextInformation.getExposedEventContexts(); if(imsEventContexts\
    \ != null) { var eventContext = imsEventContexts.get(0); template.add(eventContext.getPrimaryObjectName());\
    \ }>%has been updated location and ext number successfully.\n```\n\n如果你没有收到邮件或屏幕显示错误，请检查日志文件。SMTP\
    \ 可能不正确。\n\n如果你没有收到邮件，但管理员收到了邮件且主题为“Update Location and Ext Number Completed”，这意味着\
    \ CA IdentityMinder 使用默认模板：`defaultTask.tmpl` 发送邮件。请检查文件夹名称 `default/completed`，管理任务应与我们的模板名称完全匹配。某些修改可能需要重启服务器或环境。\n\
    \n## 6.5.3 代码示例：通过 Service API 发送邮件通知\n\n此示例展示了如何通过 CA IdentityMinder 服务发送邮件。我们将使用业务逻辑任务处理程序发送邮件。请禁用上一个示例中的邮件模板。\n\
    \n### 代码\n\n1. 编译我们的 Java 代码：`com.book.idm.etc.SendEmail`。\n2. 将类（包括包文件夹 `com.book.idm.etc`）拷贝到文件夹\
    \ `<server>\\IdentityMinder.ear\\custom`。\n\n### 配置：Identity Manager 用户控制台\n\n\
    1. 以管理员身份登录 Identity Manager 用户控制台。\n2. 选择标签页 `Roles and Tasks`，并选择菜单 `modify\
    \ admin task`。\n3. 搜索管理任务：`Update Location and Ext Number`。\n4. 点击按钮 `Business\
    \ Logic Task Handlers`（业务逻辑任务处理程序）。\n5. 点击添加并输入如下值：\n\n| 字段名称 (Field Name) | 值\
    \ (Value) | 说明 (Description) |\n| :--- | :--- | :--- |\n| Name (名称) | `SendEmail`\
    \ | 业务逻辑任务处理程序的名称 |\n| Class (类) | `com.book.idm.etc.SendEmail` | Java 类名 |\n\n\
    6. 点击确定并提交任务。\n\n### 工作原理\n\n执行管理任务：`Update Location and Ext Number`。\n\n1. 以管理员身份登录\
    \ Identity Manager 用户控制台。\n2. 选择标签页 `Book Example`，并选择菜单 `Update Location and\
    \ Ext Number`。\n3. 搜索一个用户，屏幕将显示城市下拉菜单。\n4. 修改城市属性并点击提交。\n\n### Service API\n\n\
    代码非常直观。你可以通过 `sendMail()` 方法发送邮件。\n\n```\nInternalServiceAccessor.getEmailService().sendMail(from,cc,encoding,contentType,subject,body);\n\
    ```\n\n可以在配置中通过 `getAdminID()` 获取管理员邮件。\n\n```\nString adminEmail = InternalServiceAccessor.getEmailService().getAdminID();\n\
    ```\n\n可以通过 `ProviderAccessor` 获取邮件收件者。因为：\n```\nUser user = ctx.getUserProvider().findUser(ctx.getUser().UniqueName(),\
    \ null);\nString to = user.getAttribute(\"mail\");\n```\n\n## 6.6 通知规则 API (Notification\
    \ Rule API)\n\n此 API 仅配合邮件模板使用。它决定了谁接收邮件。\n\n### 6.6.1 编程\n\n你必须创建一个扩展 `NotificationRuleAdapter`\
    \ 的 Java 类并重写 `evaluate()` 方法。\n\n```\nVector evaluate(NotificationRuleContext\
    \ ctx, Hashtable templateParams)\n```\n\n-第一个参数 `ctx` 与其他 API 相似。\n- 第二个参数 `templateParams`\
    \ 保留了邮件模板中指定的自定义数据值对。\n\n### 6.6.2 代码示例\n\n此示例需要之前的示例：邮件模板。需要在任务完成时启用邮件模板。我们的需求是在管理员执行管理任务\
    \ `Update Location and Ext Number` 时，向用户发送邮件并抄送经理。如果他们没有经理，可以跳过抄送。\n\n### 代码\n\
    \n1. 编译我们的 Java 代码：`com.book.idm.etc.ManagerNotificationRule`。\n2. 将类（包括包文件夹 `com.book.idm.etc`）拷贝到文件夹\
    \ `<server>\\IdentityMinder.ear\\custom`。\n3. 修改邮件模板文件夹中的 `Update Location and\
    \ Ext Number.tmpl`。为 `_cc` 添加通知规则名称。\n\n```\n_cc = _util.getNotifiers(\"ManagerNotificationRule\"\
    ,\"param1=A,param2=B\");\n```\n\n### 配置：管理控制台\n\n1. 在管理控制台中，点击 `Environments`。\n\
    2. 点击环境名称。\n3. 点击 `Advanced Settings`。\n4. 点击 `Notification Rules`。\n\n| 字段名称\
    \ (Field Name) | 值 (Value) | 说明 (Description) |\n| :--- | :--- | :--- |\n| Name\
    \ (名称) | `ManagerNotificationRule` | 通知规则的名称 |\n| Class (类) | `com.book.idm.etc.ManagerNotificationRule`\
    \ | Java 类名 |\n\n5. 点击保存并重启环境。\n\n### 工作原理\n\n执行管理任务：`Update Location and Ext\
    \ Number`。\n\n如果你想在任务完成后发送邮件，请在 `after()` 方法的监听器中发送邮件。\n\n"
- fmt: "\n1. Log into the `Identity Manager User Console` as `administrator`.\n2.\
    \ Select tab: `Book Example`, and select menu `Update Location and Ext Number`.\n\
    3. Search a user, the screen will show city drop down.\n4. Modify city attribute,\
    \ and click `submit`.\n\n## Email Recipient\n\nWe user `ProviderAccessor` and\
    \ look up manager of user and then you get attribute `“mail”` and add email address\
    \ into vector and return.\n\n```java\nString emailManager = manager.getAttribute(\"\
    mail\");\nif (emailManager != null || emailManager.trim().length() != 0) {\n \
    \   emails.add(emailManager);\n}\n```\n\n## Template parameters\n\nIn email template,\
    \ we add notification rule.\n\n```java\n_cc = _util.getNotifiers(\"ManagerNotificationRule\"\
    ,\"param1=A,param2=B\");\n```\n\n`\"param1=A,param2=B\"` is template parameter.\
    \ We can get these values from parameters `templateParams`.\n\n```java\npublic\
    \ Vector evaluate(NotificationRuleContext ctx,Hashtable templateParams){\n   \
    \ Enumeration keys = templateParams.keys();\n    while (keys.hasMoreElements())\
    \ {\n        Object key = keys.nextElement();\n        System.out.println(\"parameter:\
    \ \" + key +=\"=\"+ templateParams.get(key));\n    }\n}\n```\n\n### 6.6.3 Use\
    \ Case\n\nWe implement use case example in the official document (Programming\
    \ Guide for Java › Notification Rule API › API Overview > Use Case Examples).\n\
    \n#### Notify a single user\n\nWhen user data is being modified, retrieve the\
    \ user’s name and cc the user with the status of the request.\n\nForm notification\
    \ rule code, you can get user name from context and add suffix as email. You have\
    \ to call notification rule in `_cc` of email template.\n\n```java\nString userName\
    \ = ctx.getSubject().getFriendlyName();\nString email = userName+\"@somedomain.com\"\
    ;\nemails.add(email);\n```\n\n#### Notify a group\n\nWhen a user is being created\
    \ and added to a group, retrieve the group name (from the context information\
    \ passed into the notification rule) and cc the group about the new group member.\n\
    \nWe write the email template under event: `AddToGroupEvent`, so primary object\
    \ is group. We get group name and add group name as context information in email\
    \ template and pass to notification rule.\n\n```java\nString groupName = _eventContextInformation.getPrimaryObjectName();\n\
    _cc = _util.getNotifiers(\"NotificationRule\",\"group=\"+groupName);\n```\n\n\
    ### 6.6.3 Notification Rule and Email Template Limitation and Service API\n\n\
    There are some issues about email template and notification rules:\n\n- The Notification\
    \ Rule works with email template only, and Notification Rule is not necessary\
    \ for Service API.\n- The goal of notification rule is who email recipients are.\
    \ While we can use service API (`InternalServiceAccessor.getEmailProviderService()`),\
    \ we can access recipients: `to`, `cc` and `bcc`. We can use context to search\
    \ email attribute.\n- The email template support dynamic content but you need\
    \ to learn new JSP tag lib.\n- If you use email template, you may have to learn\
    \ new tag lib, for example `_taskContextInformation`. If you choose service API,\
    \ you can use simple java code or the popular template java framework likes Apache\
    \ Velocity generate email content.\n- The email template works under conditions\
    \ of task or event, fail, complete, etc.\n- While as service API can be called\
    \ any time in code.\n\n## 6.7 Task Execution Web Service (TEWS)\n\nMany people\
    \ confuse about Task Execution Web Service. The task execution web service or\
    \ TEWS make admin task as web services producer. It is not consumer. The TEWS\
    \ is a web service interface that allows third-party client applications to submit\
    \ remote tasks to CA IdentityMinder.\n\n![](image_rsrc8Y6.jpg)\n*Figure 6-23 shows\
    \ how TEWS works*\n\n### 6.7.1 Code Example\n\nWe develop java client to consume\
    \ TEWS. We want to execute our admin task: `Update Location and Ext Number` by\
    \ java web services.\n\nPlease disable all previous code: Policy Xpress, workflow,\
    \ validation and email notification.\n\n#### Configuration: Management Console\n\
    \n1. In the Management console, click `Environments`.\n2. Click the name of the\
    \ environment where the web services used.\n3. Click `Advanced Settings`.\n4.\
    \ Click `Web Services`.\n5. Put value as below\n\n| Field Name | Value | Description\
    \ |\n| :--- | :--- | :--- |\n| Enable Execution | Check | Check to enable the\
    \ Task Execution Web Service (TEWS) for the environment. |\n| Enable WSDL Generation\
    \ | Check | Check to enable WSDL generation for the environment. |\n| Enable admin_id\
    \ | Check | TEWS uses the admin ID found in the SOAP message sent to the web service\
    \ to authenticate the request.If this option is not selected, the ID of the user\
    \ who generated the request is used to authenticate the request. |\n| SiteMinder\
    \ Authentication | none | For authentication, in our example we use none. |\n\n\
    ![](image_rsrc8Y7.jpg)\n*Figure 6-24 shows management console*\n\n#### Configuration:\
    \ Identity Manager User Console\n\n1. Log into the `User Console`.\n2. Select\
    \ the `Roles and Tasks` tab. Select `Admin Tasks`. Select `Modify Admin Task`.\n\
    3. Search and select the admin task: `Update Location and Ext Number`.\n4. Select\
    \ `Enable Web Services`.\n5. Click `Submit` to save your changes.\n\n![](image_rsrc8Y8.jpg)\n\
    *Figure 6-25 shows admin task configuration*\n\n#### Code\n\n1. Generate java\
    \ from WSDL by `Axis` API. We use command `WSDL2Java` to generate java code. Please\
    \ check all path of jars file.\n\n```bash\njava -cp lib/axis.jar;lib/log4j-1.2.jar;lib/commons-logging-1.0.jar;lib/commons-discovery-0.2.jar;lib/jaxrpc-1.5.jar;.\
    \ org.apache.axis.wsdl.WSDL2Java -wrapArrays=true http://<host>:8080/idm/TEWS?wsdl\n\
    ```\n2. Copy the generated code to eclipse.\n3. Open java code in eclipse: `TEClient`\n\
    4. Check the required parameters:\n    - `userId` is user you want to modify.\n\
    \    - `adminDN` is name who execute this task. We will go more detail later.\n\
    \    - `City` and `extNumber` are the values we want to modify.\n\n```java\nString\
    \ userId = \"allmi01\";\nString adminDN = \"uid=superuser,ou=users,ou=na,dc=host,dc=com\"\
    ;\nString city = \"New York\";\nString extNumber = \"1234\";\n```\n\n#### How\
    \ it works\n\n1. Execute our java code from eclipse: `TEClient`\n2. Login in to\
    \ user store directory and check city attribute.\n\nThe code starts from java\
    \ class has same name as tag of admin task: `BasicUpdateLocAndExtNumber`. The\
    \ code admin task has 2 tabs: search tab and profile tab.\n\n```java\nBasicUpdateLocAndExtNumber\
    \ task = new BasicUpdateLocAndExtNumber();\n...\ntask.setBasicUpdateLocAndExtNumberSearch(search);\n\
    ...\ntask.setBasicUpdateLocAndExtNumberUserProfileTab(profileTab);\n```\n\n3.\
    \ For search tab, we search using filter by user id.\n\n```java\nBasicUpdateLocAndExtNumberSearchFilter[]\
    \ filters = new BasicUpdateLocAndExtNumberSearchFilter[1];\nBasicUpdateLocAndExtNumberSearchFilter\
    \ filter = new BasicUpdateLocAndExtNumberSearchFilter();\nfilter.setIndex(new\
    \ BigInteger(\"0\"));\nfilter.setField(\"%USER_ID%\");\nfilter.setOp(OperatorType.EQUALS);\n\
    filter.setValue(userId);\nfilters[0] = filter;\nsearch.setFilter(filters);\n```\n\
    \n4. We set the city and `extNumber` attributes in profile tab object.\n\n```java\n\
    BasicUpdateLocAndExtNumberUserProfileTab profileTab = new BasicUpdateLocAndExtNumberUserProfileTab();\n\
    profileTab.setL(city);\nprofileTab.set_BAR_ExtNumber_BAR_(extNumber);\n```\n\n\
    In our code, we have additional 2 files: `LogHandler.java` and `client-config.wsdd`.\
    \ These files are helper for Axis client logger. You can see soap message between\
    \ server and client. You can use this xml as request in SOAP UI or any web services\
    \ tool.\n\nSOAP Request\n"
