    ## Authentication and Authorization


    In management console: web services properties, because we check option `enable
    admin_id` (allow impersonation), we can pass any administrator DN as who execute
    admin task.


    ```

    ctx.setAdmin_id(adminDN);

    ```


    If you uncheck option `enable admin_id` (allow impersonation), you need to do
    authentication. You have to select `SiteMinder Authentication`, you have to modify
    code for authentication.


    ```java

    Tews6SoapBindingStub stub = (Tews6SoapBindingStub) _port;stub.setUsername("SuperAdmin");stub.setPassword("test");stub.setMaintainSession(true);stub._setProperty("Cookie","SMCHALLENGE=YES");

    ```


    For Authorization, you may need configuration in `web.xml`. Please see the official
    document `Programming Guide for Java > Task Execution Web Service > Authorization`.


    ## Public Task


    When you define admin task, there is one check box: `public task`. The public
    task means the task available to users who have not logged in to CA IdentityMinder.
    The default public tasks are forgotten password and self-registration. The public
    task can use in requirement for the third party want to query or get data from
    CA IdentityMinder without authentication.


    ![](image_rsrc8Y9.jpg)


    Figure 6-26 shows public task check box in admin task configuration


    The client coding for the public task TEWS need to change 3 places are `search`,
    `port type` and `context`. If you modify check box `public task`, it needs to
    regenerate java code from WSDL.


    For `search`, you can’t use search filter. You have to use search subject because
    public task design for self-modification.


    ```java

    BookBasicUpdateLocAndExtNoSearchSubject[] subjects = newBookBasicUpdateLocAndExtNoSearchSubject[1];BookBasicUpdateLocAndExtNoSearchSubject
    subject = newBookBasicUpdateLocAndExtNoSearchSubject();subject.setUID("uid=allmi,ou=users,ou=northamerica,dc=server,dc=com");subject.setIndex(new
    BigInteger("0"));subjects[0] = subject;search.setSubject(subjects);task.setBookBasicUpdateLocAndExtNoSearch(search);

    ```


    The port type and context have to be change public task.


    ```java

    Tews6PublicPortType portType = locator.getTews6PublicPort();

    //Tews6PortType portType = locator.getTews6Port();

    PublicTaskContext ctx = new PublicTaskContext();

    //TaskContext ctx = new TaskContext();//ctx.setAdmin_id(adminDN);

    ```


    ## 6.8 Additional Concept


    ### Access user defined properties


    Business logic task handler, logical attribute, event listener, etc. have the
    user defined properties.


    ![](image_rsrc8YA.jpg)


    Figure 6-27 shows user defined properties


    We can access these properties by overriding method `init(java.util.Hashtable
    imeProperties)` of interface `com.netegrity.imapi.LifeCycle`. You can keep these
    value in class variable and use in other methods.


    ```java

    @Override

    public void init(Hashtable imeProperties) throws Exception {

    System.out.println(imeProperties.get("param1"));

    }

    ```


    ### Access to Managed Objects


    The `EventContext`, `LogicalAttributeContext`, `NotificationRuleContext`, `ParticipantResolverContext`,
    and etc, extends `ProviderAccessor`. They can perform search or modify managed
    object same as `BLTHContext` or `Workflow` context.


    ### logErrorMessage


    The context extends `Logger`. The `Logger` class provides 4 logging methods. It
    will log a message to the application server log.


    - `logDebugMessage(java.lang.String message, boolean addDetail)`

    - `logErrorMessage(java.lang.String message, boolean addDetail)`

    - `logInfoMessage(java.lang.String message, boolean addDetail)`

    - `logWarningMessage(java.lang.String message, boolean addDetail)`


    If `addDetail` is true, it will print more details about admin DN, task name or
    adapter name. Please see java doc for more details.


    ## 6.9 Conclusion


    This chapter, we are complete cover all APIs more over business logic task handler
    and workflow API. We can conclude all APIs as below table:


    | API name and purpose | Phase* | Types | Note or Limitation |

    | :--- | :--- | :--- | :--- |

    | Participant Resolver : determines the participants in a workflow activity |
    A | - | Using within workflow only |

    | Event Listener: listens for an event. It performs custom business logic | A
    | Listener (configure in management console) | Listens a specific event; Listens
    a group of events; Event Listener can generate event; flow belong to event |

    | Logical Attribute: converting between logical attribute (shows on screen) and
    physical attribute (keeps in data store) | S | Logical Attribute | Do not confuse
    between: Logical Attribute can share with any screen; Screen-Defined Attributes
    |

    | Validation Rule: validate value that user types on screen meet the right format.
    | S | Task-level validation; Directory-level validation | Task-level scope only
    the defined screen; directory-level applies to all screens |

    | Email Notification: sending email | S or A | Notification Policies (policy Xpress);
    Email templates; Service API | Notification Policies has limit for email recipient
    and content; Service API are programming |

    | Notification Rule: determines the users receive an email. | S or A | | Works
    with email only |

    | Task Execution Web Services: is web services producer. It allows third-party
    client applications to submit remote tasks | - | Depending on configuration: Is
    it enable admin_id?; Is it public task? | Need configure for authentication and
    authorization; Phase: A or S |


    I suggest getting book volume II shows many advanced examples. The mainly API
    are business logic task handler and work flow.


    # Appendix A: Import Workflow


    Please download code from book’s web site. Please use the CODE: 120140924


    Import workflow


    - Start IdentityMinder Server

    - Run WorkPoint Designer

    - Select file > import

    - Select file `IdmCodeWorkflow.zip`

    - Choose select all


    ![](image_rsrc8YB.jpg)


    Figure A-1 shows import screen


    - When screen ask are you importing to empty database, select “No”. Click next.

    - When screen show This Import will, select “Treat all objects as new objects”.
    Click next.

    - Screen ask “If a duplicate Name or Reference is encountered”, select Rename
    he imported Name or Reference to be unique. Click Next

    - Dialog will show list of our import code, click finish

    - Select Open process, and verify. You should see process with reference name
    start with “BookEx.”


