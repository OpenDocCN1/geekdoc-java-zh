    \ changedValue, StringRef errorMsg) throws AttributeValidationException\n```\n\
    \nFor directory-level validation, you have to extend `AttributeValidator` and\
    \ override method `validate()`. It is almost same as task-validation but there\
    \ are some details. You will see in examples.\n\n```java\npublic boolean validate(Object\
    \ attrValue, StringRef changedValue, StringRef errorMsg) throws AttributeValidationException\n\
    ```\n\n#### 6.4.2 Code Example: Task-level validation\n\nThis example require\
    \ attribute `Employee Number`, please check your user store. Our requirement uses\
    \ `employeeNumber` attribute. The validate rule is\n\n* Employee number must be\
    \ number only.\n* Maximum is 4 Digits.\n* If user types 1-3 digits, the format\
    \ fill in 0 as prefix. For example: 2, the right format will be 0002\n\n![](image_rsrc8XX.jpg)\n\
    \nFigure 6-14 shows user’s screen for updating employee number\n\n##### Code\n\
