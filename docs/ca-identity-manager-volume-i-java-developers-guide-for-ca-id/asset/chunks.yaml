    \ use the CODE: 120140924\n\nImport workflow\n\n*   Start IdentityMinder Server\n\
    \n*   Run WorkPoint Designer\n\n*   Select file > import\n\n*   Select file “IdmCodeWorkflow.zip”\n\
    \n*   Choose select all\n\n| ![](image_rsrc8YB.jpg) |\n\n| Figure A-1 shows import\
    \ screen |\n\n*   When screen ask are you importing to empty database, select\
    \ “No”. Click next.\n\n*   When screen show This Import will, select “Treat all\
    \ objects as new objects”. Click next.\n\n*   Screen ask “If a duplicate Name\
    \ or Reference is encountered”, select Rename he imported Name or Reference to\
    \ be unique. Click Next\n\n*   Dialog will show list of our import code, click\
    \ finish\n\n*   Select Open process, and verify. You should see process with reference\
    \ name start with “BookEx.”\n\n| ![](image_rsrc8YC.jpg) |"
