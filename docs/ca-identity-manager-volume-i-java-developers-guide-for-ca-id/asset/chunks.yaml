    | Figure 5-24 shows the values in tab general |


    4.  Following the rule 1, the flow must start with a “Start” node and end with
    a “Stop” node. Drag node from menu to canvas.


    | ![](image_rsrc8VG.jpg) |


    | Figure 5-25 shows node “Start” and “Stop” |


    5.  Following the rule 2, the flow must have Approve or Reject state before the
