  trans: "\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?><soapenv:Envelope\
    \ xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\"\
    \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"><soapenv:Body><TaskContext\
    \ xmlns=\"http://tews6/wsdl\"><admin_id>uid=superuser,ou=users,ou=na,dc=host,dc=com</admin_id></TaskContext><BookBasicUpdateLocAndExtNo\
    \ xmlns=\"http://tews6/wsdl\"><BookBasicUpdateLocAndExtNoSearch><Filter index=\"\
    0\"><Field>%USER_ID%</Field><Op>EQUALS</Op><Value>allmi01</Value></Filter></BookBasicUpdateLocAndExtNoSearch><BookBasicUpdateLocAndExtNoUserProfileTab><l>New\
    \ York</l><_BAR_ExtNumber_BAR_>1234</_BAR_ExtNumber_BAR_></BookBasicUpdateLocAndExtNoUserProfileTab></BookBasicUpdateLocAndExtNo></soapenv:Body></soapenv:Envelope>\n\
    ```\n\nSOAP 响应\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?><soapenv:Envelope\
    \ xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\" xmlns=\"http://tews6/wsdl\"\
    \ xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns:SOAP-ENC=\"http://schemas.xmlsoap.org/soap/encoding/\"\
    \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"\
    http://schemas.xmlsoap.org/soap/envelope/ http://schemas.xmlsoap.org/soap/envelope/\"\
    \ ><soapenv:Body><ImsStatus version=\"6.0\" ><transactionId>cb40e808-a5029bf5-aeacf1a7-1401ca</transactionId></ImsStatus></soapenv:Body></soapenv:Envelope>\n\
    ```\n\n## 身份验证与授权\n\n在控制台中：Web 服务属性中，由于我们检查了选项 `enable admin_id`（允许身份冒充），我们可以传递任何管理员\
    \ DN 作为执行管理员任务的用户。\n\n```\nctx.setAdmin_id(adminDN);\n```\n\n如果您取消勾选 `enable admin_id`\
    \ 选项（允许身份冒充），则需要进行身份验证。您必须选择 `SiteMinder Authentication`，并且修改代码以进行身份验证。\n\n```java\n\
    Tews6SoapBindingStub stub = (Tews6SoapBindingStub) _port;stub.setUsername(\"SuperAdmin\"\
    );stub.setPassword(\"test\");stub.setMaintainSession(true);stub._setProperty(\"\
    Cookie\",\"SMCHALLENGE=YES\");\n```\n\n对于授权，您可能需要在 `web.xml` 中进行配置。请参考官方文档 `Java\
    \ Programming Guide > Task Execution Web Service > Authorization`。\n\n 公 公任务\n\
    \n当您定义管理员任务时，有一个复选框：`public task`。公共任务意味着任务适用于未登录 CA IdentityMinder 的用户。默认的公共任务是忘记密码和自注册。公共任务可以用于第三方在无需身份验证的情况下从\
    \ CA IdentityMinder 查询或获取数据的需求。\n\n![](img/image_rsrc8Y9.jpg)\n\n图 6-26 显示管理员任务配置中的公共任务复选框\n\
    \n公共任务 TEWS 的客户端代码需要更改 3 个地方：`search`、`port type` 和 `context`。如果您修改了复选框 `public\
    \ task`，则需要从 WSDL 重新生成 Java 代码。\n\n对于 `search`，您不能使用搜索过滤器。您必须使用搜索主题，因为公共任务设计用于自修改。\n\
    \n```java\nBookBasicUpdateLocAndExtNoSearchSubject[] subjects = newBookBasicUpdateLocAndExtNoSearchSubject[1];BookBasicUpdateLocAndExtNoSearchSubject\
    \ subject = newBookBasicUpdateLocAndExtNoSearchSubject();subject.setUID(\"uid=allmi,ou=users,ou=northamerica,dc=server,dc=com\"\
    );subject.setIndex(new BigInteger(\"0\"));subjects[0] = subject;search.setSubject(subjects);task.setBookBasicUpdateLocAndExtNoSearch(search);\n\
    ```\n\n端口类型和上下文必须更改为公共任务。\n\n```java\nTews6PublicPortType portType = locator.getTews6PublicPort();\n\
    //Tews6PortType portType = locator.getTews6Port();\nPublicTaskContext ctx = new\
    \ PublicTaskContext();\n//TaskContext ctx = new TaskContext();//ctx.setAdmin_id(adminDN);\n\
    ```\n\n## 6.8 附加概念\n\n### 用户自定义属性\n\n业务逻辑任务处理器、逻辑属性、事件监听器等都有用户自定义属性。\n\n![](img/image_rsrc8YA.jpg)\n\
    \n图 6-27 显示用户自定义属性\n\n我们可以通过重写接口 `com.netegrity.imapi.LifeCycle` 的方法 `init(java.util.Hashtable\
    \ imeProperties)` 来访问这些属性。您可以将这些值保留在类变量并在其他方法中使用。\n\n```java\n@Override\npublic\
    \ void init(Hashtable imeProperties) throws Exception {\nSystem.out.println(imeProperties.get(\"\
    param1\"));\n}\n```\n\n### 访问托管对象\n\n`EventContext`、`LogicalAttributeContext`、`NotificationRuleContext`、`ParticipantResolverContext`\
    \ 等扩展了 `ProviderAccessor`。它们可以像 `BLTHContext` 或 `Workflow` 上下一样执行搜索或修改托管对象。\n\n\
    ### logErrorMessage\n\n上下文扩展了 `Logger`。`Logger` 类提供了 4 个日志方法。它向应用程序服务器记录消息。\n\n\
    - `logDebugMessage(java.String message, boolean addDetail)`\n- `logErrorMessage(java.String\
    \ message, boolean addDetail)`\n- `logInfoMessage(java.String message, boolean\
    \ addDetail)`\n- `logWarningMessage(message, boolean addDetail)`\n\n如果 `addDetail`\
    \ 为 true，它将打印有关管理员 DN、任务名称的详细信息。请参见 Java 文档。\n\n## 6.9 总结\n\n在本章中我们涵盖了业务逻辑任务处理器和工作流的所有\
    \ API。API 如下所示：\n\n| API 名称和目的 | 阶段 | 类型 | 注意事项或限制 |\n| :--- | :--- | :--- | :---\
    \ |\n| 确定工作流活动中的参与者 | A | | 仅用于工作流 |\n| 监听事件。执行自定义业务逻辑 | A | 在控制台中配置 | 监听特定事件；监听一组事件；事件监听器可以生成事件；流属于事件\
    \ |\n| 在逻辑属性（显示在屏幕上）和物理属性（存储在数据存储中）之间转换 | S | 逻辑属性 | 逻辑属性可以与任何屏幕共享；屏幕定义属性 |\n\
    | 验证规则：验证用户在屏幕上输入的值符合正确的格式 | S | 任务级验证；目录级验证 | 任务级仅限定义的屏幕；目录级适用于所有屏幕 |\n| 电子邮件通知：发送电子邮件\
    \ | S 或 A | 通知策略（Xpress 策略）；邮件模板；Service API | 通知策略对邮件接收者和内容有限制；Service API 需要编程\
    \ |\n| 通知规则：决定用户接收电子邮件 | S 或 A | | 配合电子邮件使用 |\n| 任务执行 Web 服务：Web 服务生产者。允许第三方客户端应用程序提交远程任务\
    \ | - | 取决于配置：是否启用了 admin_id？是否是公共任务？ | 需要配置身份验证和授权；阶段：A 或 S |\n\n建议获取第二卷，其中包含许多高级示例。\n\
    \n# 附录 A：导入工作\n\n请从书籍网站下载代码。请使用代码：120140924\n\n导入工作\n\n- 启动 IdentityMinder 服务器\n\
    - 运行 WorkPoint Designer\n- 选择文件 > 导入\n- 选择文件 `IdmCodeWorkflow.zip`\n- 选择全选\n\n\
    ![](img/image_rsrc8YB.jpg)\n\n图 A-1 显示导入屏幕\n\n- 当屏幕询问是否导入到空数据库时，选择“否”。点击下一步。\n\
    - 当屏幕显示此导入将时，选择“将所有对象视为新对象”。点击下一步。\n- 屏幕询问“如果遇到重复名称或引用”，重命名导入的名称或引用以唯一。点击下一步。\n\
    - 对话框将我们的导入代码列表，点击完成\n- 选择打开进程并验证。你应该看到以“BookEx.”开头的流程。\n\n![](img/image_rsrc8YC.jpg)\n"
- fmt: "\n| Figure A-2 shows all processes |\n\n# Appendix B: Hot Deployment\n\nCA\
    \ IdentityMinder does not support hot deployment. When you update code in folder\
    \ `<IdentityMinder>/custom`, application server will not load your class. There\
    \ are a few ways to fix:\n\n### Restart Server or Redeploy IdentityMinder.ear\n\
    \nYou have to restart or redeploy after you update code. This solution takes time\
    \ and not suitable for development process.\n\n### OSGi\n\nThe new version of\
    \ application server supports `OSGi` specification. `OSGi` enable class load dynamically\
    \ at runtime. Please check your application server document.\n\n### Rename Code\n\
    \nI prefer this way. It is pretty simple and does not take time. CA IdentityMinder\
    \ requires 2 things: configuration and code. For example, my code is `MyCode.java`.\n\
    \n*   **BLTH**\n    *   **Code**: I rename code to `MyCode1.java`, compile and\
    \ copy to folder “custom”.\n    *   **Configuration**: update java class name\
    \ in admin task’s `BLTH`.\n*   **Workflow**\n    *   **Code**: I rename code to\
    \ `MyCode1.java`, compile and copy to folder “custom”.\n    *   **Configuration**:\
    \ update agent script in node.\n\nYou can do the same in Listener and other APIs.\n\
    \n# CODE : DGUJK101\n"
