    \ |\n\n| ![](img/image_rsrc8VK.jpg) |\n| 图 5-28 显示了带有脚本“Notify Reject”的 agents\
    \ 选项卡 |\n\n完成此步骤后，我们的画布应该显示如下。\n| ![](img/image_rsrc8VM.jpg) |\n| 图 5-29 显示了画布\
