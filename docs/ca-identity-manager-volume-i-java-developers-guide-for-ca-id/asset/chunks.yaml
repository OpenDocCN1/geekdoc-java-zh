  trans: "\n\n3. 选择管理员任务：“Update Location and Ext Number”（更新位置和分机）。\n4. 搜索并选择某些用户。\n\
    5. 修改城市属性（必须修改城市值）并在分机号中输入值“xxxxxx”。提交管理员任务。\n\n| ![](img/image_rsrc8U6.jpg) |\n\
    图 4-16 显示我们任务的值 |\n\n### 使用 ProviderAccessor\n\n使用 `providerAccessor` 意味着 `ProviderAccessor`\
    \ 的任何方法都是 `BLTHContext` 的父类。例如：`getUserProvider()`、`getGroupProvider()` 等。方法名将以单词\
    \ `provider` 结尾。每个托管对象类型（如 `User`、`Group` 和 `Organization`）都与一个提供对象关联，您可以使用该对象访问托管对象的数据。\n\
    \n```java\nUser user = blthContext.getUserProvider().findUser(blthContext.getTSContext(),\
    \ userid, null);\n```\n\n`BLTHContext` 有一个父接口：`ProviderAccessor`。当我们调用 `getUserProvider()`\
    \ 时，它返回 `UserProvider`。`UserProvider` 拥有方法 `findUser()`。\n\n```java\nfindUser(TSContext\
    \ context, java.lang.String name, AttributeRightsCollection attributes)\n```\n\
    \n该方法需要 3 个参数：\n\n* `context`: 当前任务会话的上下文。我们的代码使用了 `BLTHContext`。\n* `name`: 要检索的用户名称。该名称可以是唯一名称或友好名称。我们的代码使用了用户的唯一名称。\n\
    \n```java\n//从任务中获取唯一名称\nString userid = blthContext.getUser().getUniqueName();\n\
    ```\n\n* `attributes`: 一个 `AttributeRight` 对象的集合，每个对象包含一个属性名称和一个权限请求。我们的代码传递了\
    \ `null` 值。\n\n我们从 `ProviderAccessor` 获取用户对象。我们可以修改电话号码属性。属性名称与用户存储中物理属性的名称相同。\n\
    \n```java\nuser.setAttribute(\"telephoneNumber\", \"212-222-2222x1234\");\nuser.modifyObject();\n\
    ```\n\n我们通过 `ProviderAccessor` 修改托管对象，这实际上是在改变对象的本地（内存中）表示。要将更改持久化到数据存储器，我们需要调用\
    \ `modifyObject()`。更改将直接应用于数据存储器。此时不会生成 Identity Manager 事件，也不会执行工作流审批、审计或安全检查。\n\
    \n### 在用户存储中检查结果\n\n我们做了两件事：更改了城市属性，我们的 Java 代码使用 `AccessProvider` 修改了电话号码。使用\
    \ LDAP 客户端连接到用户存储，我们将看到电话号码值已经更改。\n\n| ![](img/image_rsrc8U7.jpg) |\n图 4-17 显示电话号码属性已更改\
    \ |\n\n### 在查看提交的任务屏幕中检查结果\n\n选择菜单：view submitted task（查看已提交的任务），在标签页下：`system`。选择我们的任务，你将看到内部的事件。\n\
    \n| ![](img/image_rsrc8U8.jpg) |\n图 4-18 显示所有事件 |\n\n点击 `Modify User` 事件查看属性更改：\n\
    \n* 城市属性来自修改用户存储中值的屏幕界面。\n* 电话号码，我们使用 `ProviderAccessor` 修改的。因此，在 `Modify User`\
    \ 事件中属性发生了变化，但我们看不到来自 `ProviderAccessor` 的值，只能看到来自屏幕的值。\n\n| ![](img/image_rsrc8U9.jpg)\
    \ |\n图 4-19 显示提交后的属性更改 |\n\n### 修改的顺序\n\n现在我们有两个需要配置的属性：城市和电话号码：\n\n* 城市值来自屏幕。\n\
    * 电话号码值来自 `ProviderAccessor`。\n    * 在屏幕上，我们输入了值“xxxxxx”。\n    * 最终结果是“212-222-2222x1234”。\n\
    \n如果你的环境配置了配置和 Active Directory 账户，你将看到端点中的电话属性为“212-222-2222x1234”。\n\n| ![](img/image_rsrc8UA.jpg)\
    \ |\n图 4-20 电话号码已配置到端点 |\n\n我们可以逐步解释如下：\n\n* 步骤 1：当用户提交管理员任务时，执行 `handleSubmission()`\
    \ 方法。当调用 `modifyObject()` 方法时，电话号码将被提交。\n* 步骤 2：生成了 `Modify user` 事件。当 `modify\
    \ user` 事件完成后，CA IdentityMinder 将提交城市值。\n* 步骤 3：`Synchronize User` 事件，与此无关。它将触发\
    \ `Policy Set`（策略集）。\n* 步骤 4：`Synchronize User Attribute with Account` 将属性从配置目录同步并到端点。\n\
    \n| ![](img/image_rsrc8UB.jpg) |\n图 4-21 显示配置步骤 |\n\n### 4.4.4 BLTHContext 和 ProviderAccessor\n\
    \n这个示例是一种为了更好地理解 `BLTHContext` 和 `ProviderAccessor` 而进行的实验。我们将尝试同时使用这两个 API 更新城市和电话属性。让我们看看发生了什么。\n\
    \n#### 代码\n\n1. 编译我们的 Java 代码：`com.book.idm.blth.ModifyUserByBoth`。\n2. 将类（包括包文件夹\
    \ `com.book.idm.blth`）复制到文件夹 `\\IdentityMinder.ear\\custom`。\n\n#### 配置\n\n1.\
    \ 以管理员身份登录 Identity Manager User Console。\n2. 选择标签页 `Roles`（角色）和 `Tasks），并选择菜单\
    \ `modify admin task`。\n3. 搜索并选择我们的管理员任务名称：`Update Location and Ext Number`。\n\
    4. 点击 `Business Logic Task Handlers` 按钮，然后点击“铅笔”图标。\n5. 如下所示修改值。\n\n| 字段名称 | 值\
    \ |  |\n| :--- | :--- | :--- |\n| Java Class | `com.book.idm.blth.ModifyUserByBoth`\
    \ | 我们的 Java 类 |\n\n按照以下步骤执行我们的代码：\n1. 以管理员身份登录 Identity Manager User Console。\n\
    2. 选择标签页 `Roles` 和 `Tasks`并选择菜单 `modify admin task`。\n3. 搜索并选择我们的管理员任务名称：`Update\
    \ Location and Ext Number`。\n4. 点击 `Business Logic Task Handlers` 按钮，然后点击“铅笔”图标。\n\
    5. 如下所示修改值。\n\n```java\npublic void handleSubmission(BLTHContext blthContext)\
    \ throws Exception {\n// 使用 BLTHContext\nUser user1 = blthContext.getUser();\n\
    user1.setAttribute(\"l\", \"New City\");\n//user1.setAttribute(\"telephoneNumber\"\
    , \"111111\");\n// 使用 ProviderAccessor\nString userid = user1.getUniqueName();\n\
    User user2 = blthContext.getUserProvider().findUser(blthContext.getTSContext(),\
    \ userid, null);\nuser2.setAttribute(\"l\", \"New Town\");\nuser2.setAttribute(\"\
    telephoneNumber\", \"2222222\");\nuser2.modifyObject();\n}\n```\n\n| ![](img/image_rsrc8UC.jpg)\
    \ |\n图 4-22 显示错误 |\n\n| ![](img/image_rsrc8UD.jpg) |\n图 4-23 显示所有属性 |\n\n| ![](img/image_rsrc8UE.jpg)\
    \ |\n图 4-24 我们将城市值更改为 Toronto |\n\n| ![](img/image_rsrc8UF.jpg) |\n图 4-25 显示最终结果\
    \ |\n\n"
- fmt: "\n*   Step 3: `ProviderAccessor` commit city attribute value as “New Town”.\
    \ Now city attribute has been already change to be “New Town”\n*   Step 4: When\
    \ modify User event complete, `CA IdentityMinder` commit the city attribute value\
    \ from task that has been modify by `BLTHContext`.\n\nStep 1 – 3 are occurred\
    \ in synchronous phase. Step 2 and 3 are occurred by business logic task handler.\
    \ The step 4 is asynchronous phase.\n\n| ![](image_rsrc8UG.jpg) |\n| Figure 4-26\
    \ shows sequence of modification |\n\n### 4.4.5 Business Logic Task Handler and\
    \ screen.\n\nThis example, we will do programming to get data from admin task’s\
    \ screen. This example shows:\n\n*   How to get current extension telephone number\
    \ and display on screen.\n*   Validate user input. The extension telephone number\
    \ must be present and be number only.\n*   Shows how to send error message back\
    \ to user.\n*   Using session attribute to share the extension telephone number\
    \ between methods.\n\n### Code\n\n1. Compile our java code: `com.book.idm.blth.ModifyUserAndScreen`\n\
    2. Copy class (include package folder `com.book.idm.blth` ) to folder `\\IdentityMinder.ear\\\
    custom`.\n\n### Configuration\n\n1. Log into the Identity Manager User Console\
    \ as administrator.\n2. Select tab `Roles` and `Tasks`, and select menu `modify\
    \ admin task`.\n3. Search and select our admin task name: `Update Location and\
    \ Ext Number`\n4. Click button `Business Logic Task Handlers`, then icon `pencil`.\n\
    5. Modify value as below.\n\n| Field Name | Value | Description |\n| :--- | :---\
    \ | :--- |\n| Java Class | `com.book.idm.blth.ModifyUserAndScreen` | Our java\
    \ class that we put in custom folder |\n\n### How it works\n\nWe can execute our\
    \ code by admin task following these steps:\n\n1. Log into the Identity Manager\
    \ User Console as administrator.\n2. Select tab: `Book Example` and select menu:\
    \ `Basic`.\n3. Select Admin Task: `Update Location and Ext Number`.\n4. Then search\
    \ and select some users.\n\n#### handleSetSubject(): display the current telephone\
    \ number on screen\n\nThe method `handleSetSubject()` is called, when screen initial\
    \ display. So we implement to set the show extension number inside this method.\n\
    \n| ![](image_rsrc8UH.jpg) |\n| Figure 4-27 the current value of extension number\
    \ has been show on screen |\n\nSetting extension number, we have to do 2 things:\n\
    \n*   Get current telephone number\n*   Set the value of screen logical attribute:\
    \ `|ExtNumber|`\n\nGetting the current telephone number is not new, we use the\
    \ `ProviderAccessor` get the value.\n\n```java\nString userid = blthContext.getUser().getUniqueName();\n\
    User user = blthContext.getUserProvider().findUser(blthContext.getTSContext(),\
    \ userid, null);\nString telephoneNumber = (String)user.getAttribute(\"telephoneNumber\"\
    );\n```\n\nPlease imagine the screen of admin task. When we define the admin task:\n\
    \n*   Inside of admin task, we have tabs.\n*   In our admin task has one profile\
    \ tab.\n*   Inside of tab, we have a screen.\n*   Inside of screen, we have fields.\n\
    \n| ![](image_rsrc8UJ.jpg) |\n| Figure 4-28 shows tab screen in admin task configuration\
    \ |\n\nInside of admin task, we have tabs. We call method `getTaskTabHandlers()`\
    \ return all tabs of this admin task.\n\n```java\nVector<TabHandler> tabs = blthContext.getTaskTabHandlers();\n\
    for (TabHandler tab : tabs) {\n```\n\nIn our admin task has one profile tab, so\
    \ we have to check type of `ProfileTabHandler`. If you have many profile tabs,\
    \ you need condition to check screen’s tag name. We check screen’s tag name `BookBasicUpdateLocationAndExtNo`.\
    \ (In our example has only one tab, you can skip this condition)\n\n```java\n\
    // Check tab type\nif (tab instanceof ProfileTabHandler) {\n    ProfileTabHandler\
    \ profileTab = (ProfileTabHandler) tab;\n    String screenName = profileTab.getScreenHandler().getScreen().getTag();\n\
    \    if(screenName.equals(\"BookBasicUpdateLocationAndExtNo\")){\n}\n```\n\nWe\
    \ can set the value on screen by using method `updateRawData()`.\n\n```java\n\
    HashMap<String, String> data = new HashMap<String, String>();\ndata.put(\"|ExtNumber|\"\
    , telephoneNumber.substring(telephoneNumber.indexOf(\"x\") + 1));\n...\nprofileTab.updateRawData(data);\n\
    ```\n\nInside of screen, we have fields. We create new `HashMap` object. We put\
    \ key and value pair, key’s name `|ExtNumber|` came from the screen definition\
    \ in admin task. If you want to set city attribute, you can use attribute name\
    \ same as user store. The city’s attribute uses “l” as key.\n\n#### handleValidation\
    \ (): validate user input\n\nAfter user submit the admin task, if extension number\
    \ is blank or put some characters, the error will be deply.\n\n| ![](image_rsrc8UK.jpg)\
    \ |\n| Figure 4-29 shows error messages |\n\nWe have to override method `handleValidation()`.\
    \ We can get any fields from screen by method `getRawData()`. If you are not sure\
    \ about fields’ name, you can print by method `getRawData()`. It is a HashMap\
    \ object that key represent by field’s name.\n\n```java\nString extNumber = (String)\
    \ profileTab.getRawData().get(\"|ExtNumber|\");\n```\n\nYou can get values from\
    \ screen and perform the logic as below.\n\n```java\nString extNumber = (String)\
    \ profileTab.getRawData().get(\"|ExtNumber|\");\nif (extNumber == null) {\n} else\
    \ {\n    try {\n        int number = new Integer(extNumber);\n    } catch (NumberFormatException\
    \ ne) {\n    }\n}\n```\n\n#### Shows the error message\n\nWe show error by throwing\
    \ `IMSException` object. You can put message on screen by method `addUserMessage()`.\n\
    \n```java\nIMSException imsEx = new IMSException();\nimsEx.addUserMessage(\"Telephone\
    \ number can't be empty\");\nthrow imsEx;\n```\n\n#### Session attributes: pass\
    \ the value between methods\n\nWe have already validated telephone number and\
    \ we can pass the value to method `handleSubmission()` by session. BLTHContext`\
    \ provide session attribute for sharing data between method and other IdentityMinder\
    \ APIs.\n\n```java\npublic void handleValidation(BLTHContext blthContext) throws\
    \ Exception {\n    // Setting value to session\n    blthContext.setSessionAttribute(\"\
    extNumber\", number);\n}\npublic void handleSubmission(BLTHContext blthContext)\
    \ throws Exception {\n    // Getting value from session\n    int extNumber = (Integer)\
    \ blthContext.getSessionAttribute(\"extNumber\");\n}\n```\n\n### 4.5 Use cases\
    \ examples\n\nThe official CA IdentityMinder document gave use cases examples\
    \ but not provide detail of programming. This section will give you some idea\
    \ of those examples.\n\nPlease see full description from Programming Guides ›\
    \ Programming Guide for Java › Business Logic Handler API › Business Logic Handler\
    \ API Overview › Use Case Examples.\n\nCheck whether a group membership limit\
    \ is reached\n\nWhen an administrator attempts to add a member to a group by submitting\
    \ a Modify Group task for execution, access the Group managed object to determine\
    \ the number of current members. If the group has the maximum number of members,\
    \ throw an exception.\n\nThe modify group task, we can use `blthContext.getGroup()`.\
    \ We call method `getMembers()` return all members inside group. We can check\
    \ size.\n\n```java\nVector users = blthContext.getGroup().getMembers(ObjectType.USER,\
    \ null);\nSystem.out.println(\"user size : \"++users.size());\n```\n\nPlease note,\
    \ the `Group` class has method `getUsers()` and `getMembers()`:\n\n*   Method\
    \ `getUsers()` return only user object\n*   Method `getMembers()` can return any\
    \ object depending parameters: `ObjectType`. Please see java document: `ObjectType`\
    \ for details.\n\nVerify the job title of a new administrator\n\nWhen a user submits\
    \ a Create Administrator task for execution, access a third-party database to\
    \ determine the job title of the administrator being created. If this particular\
    \ person does not have the job title Supervisor (the only job title authorized\
    \ to be an administrator), throw an exception.\n\nWe can write java code access\
    \ the database in `handleSubmission()`. You pass administrator id as argument\
    \ and get job title.\n\n```java\n// Get administrator who is executing the task\n\
    User admin = blthContext.getAdministrator();\n//Call the third party to get title\n\
    String jobTitle = callDB(admin.getFriendlyName());\n```\n"
