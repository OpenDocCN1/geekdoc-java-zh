- fmt: "\n# View Submitted Task\n\nView Submitted Task is very important for developer\
    \ to understand CA IdentityMinder behavior. After admin task was submitted, you\
    \ can go check status in View Submitted Task. Select tab `System`, select menu\
    \ `View Submit Task` and select `Search`.\n\n| ![](image_rsrc8SZ.jpg) |\n| Figure\
    \ 2-61 shows View Submitted Tasks screen |\n\nFind your summited task, it should\
    \ be the latest one. And click icon `![](image_rsrc8T0.jpg)` to see detail inside.\n\
    \n| ![](image_rsrc8T1.jpg) |\n| Figure 2-62 shows our submitted task. |\n\nThere\
    \ are 2 interesting thing inside submitted task details:\n\n*   `Task History`\
    \ tells how many Identity Policy Set or `Policy Xpress` are matched.\n*   `Included\
    \ Event` tells how many events are generated.\n\n| ![](image_rsrc8T2.jpg) |\n\
    | Figure 2-63 shows Task History and Included Events |\n\nThere are 7 events were\
    \ generated in sequence order:\n\n1. **Event No 1: Modify user**\n   This event\
    \ `Modify user` was generated because we modify user’s attribute: `city`. It was\
    \ generated after we submitted task (that primary object is `User` and action\
    \ `Modify`). Select icon `pencil` to see more detail. It will show new value and\
    \ old value after submit task.\n\n| ![](image_rsrc8T3.jpg) |\n| Figure 2-64 shows\
    \ Event No 1: Modify user was generated because we modify city attribute. |\n\n\
    After this event finish, `city` attributes in `User Store` will be changed.\n\n\
    | ![](image_rsrc8T4.jpg) |\n| Figure 2-65 after Event No 1: Modify user finished,\
    \ city attribute was changed. |\n\n2. **Event No 2: Synchronize user**\n   This\
    \ event was generated because when we select drop down `User Synchronization:\
    \ On` task completion in admin task. When this event generate, it will trigger\
    \ our Policy Set: `Set Office Address`.\n\n| ![](image_rsrc8T5.jpg) |\n| Figure\
    \ 2-66 shows event No.2 was generated by option User Synchronization. |\n\n3.\
    \ **Event No 3: Modify user**\n   This event was generated by `Policy Xpress`.\
    \ `Policy Xpress` set value of `Business Phone`. After this event finished, the\
    \ `telephone number` attribute value in `User Store` has been changed.\n\n| ![](image_rsrc8T6.jpg)\
    \ |\n| Figure 2-67 shows event No.3 was generated by policy Xpress to modify telephone\
    \ number. |\n\n4. **Event No 4: Modify user**\n   This event was generated by\
    \ `Identity Policy Set`. `Identity Policy` set attribute `country`. After this\
    \ event finished, the `country` attribute value in `User Store` has been changed.\n\
    \n| ![](image_rsrc8T7.jpg) |\n| Figure 2-68 shows event No.4 was generated by\
    \ Identity Policy Set modify attribute country. |\n\n5. **Event No 5: Synchronized\
    \ provisioning role and add accounts for user.**\n   This event was generated\
    \ because User has provisioning role and select option `User Synchronization`.\
    \ This event is used for create account in `Endpoint`. If you have already had\
    \ account in `Endpoint`, this event does nothing. You can see detail in `TASK\
    \ SESSION` accounts create: 0 update: 0 re-create:0 and failure: 0.\n\n| ![](image_rsrc8T8.jpg)\
    \ |\n| Figure 2-69 shows event No.5 details. |\n\n6. **Event No 6: Synchronize\
    \ User**\n   This event was generated by `Policy Xpress` after modify user event.\
    \ We know because the value in `Attribute Changed` is value from `Policy Xpress`.\n\
    \n| ![](image_rsrc8T9.jpg) |\n| Figure 2.70 shows event No.6 details. |\n\n7.\
    \ **Event No. 7 Synchronize user attributes with accounts Event Details**\n  \
    \ This event was generated because we select option in admin task screen `Account\
    \ Synchronization: On Task Complete`. This event will update the global users’\
    \ and accounts’ attributes.\n\n| ![](image_rsrc8TA.jpg) |\n| Figure 2-71 shows\
    \ event No.7 details. |\n\nAfter all events are complete, go check user’s attribute\
    \ in CA IdentityMinder `User Store`, `Provisioning Directory` and `Endpoint` (`Active\
    \ Directory`).\n\n| ![](image_rsrc8TB.jpg) |\n| Figure 2-72 shows attributes of\
    \ user, global user and account |\n\nWhen admin task submitted, you have to know:\n\
    *   How many events will be generated?\n*   Which component generate event?\n\
    *   What expected outcome of event?\n\n| ![](image_rsrc8TC.jpg) |\n| Figure 2-73\
    \ shows all events from our example. |\n\n### Limitation\n\nOur admin task has\
    \ some limitations:\n*   It cannot show the current value of extension number.\n\
    *   There no validation for extension number.\n*   If we change only extension\
    \ number and do not change city value, the CA IdentityMinder assumes there are\
    \ nothing changes in this task.\n\nWe can fix these limitations easily by programming.\n\
    \n| ![](image_rsrc8TD.jpg) |\n| Figure 2.-74 shows message when we update only\
    \ extension number, not city attribute |\n\n## 2.6 Conclusion\n\nIn this chapter\
    \ we create admin task and use administrator’s tool to implement requirement.\
    \ We learn:\n*   How to create admin task\n*   How provisioning works\n*   How\
    \ `Identity Policy Set` and `Policy Xpress` works\n*   Understand submitted task\
    \ and events\n\nThe next chapter, we will learn programming concept.\n\n# Chapter\
    \ 3 Programming Concepts and Configuring IDE\n\nIn this chapter, we will learn:\n\
    *   Concept of Synchronous and Asynchronous phase\n*   Overview of 9 APIs.\n*\
    \   Configuring IDE.\n\n## 3.1 CA IdentityMinder APIs Overview\n\nThere are 2\
    \ types of CA IdentityMinder programming:\n*   `Java Programming`: performs the\
    \ logics and integration.\n*   `Connector Programming`: for custom connector connect\
    \ endpoint.\n\nWe separate book for connector in another book. We will focus on\
    \ the java programming first. This chapter introduces functional and purpose of\
    \ each APIs.\n\n### Synchronous vs. Asynchronous Phase\n\nBefore we start any\
    \ API concepts, you need to understand `Synchronous` vs. `Asynchronous` Phase.\
    \ Admin task execution has the following two phases:\n*   `Synchronous Phase`\
    \ is processing during the task is submitted and response to user on screen. The\
    \ task has not yet been broken down into its component events.\n*   `Asynchronous\
    \ Phase` is process after response display on screen to user. The task has been\
    \ broken down into its component events. It may take time up to an hour or a month.\n\
    \n| ![](image_rsrc8TE.jpg) |\n| Figure 3-1 shows Synchronous and Asynchronous\
    \ phase |\n\n### 3.1.1 Business Logic Task Handler API (BLTH)\n\nBusiness Logic\
    \ Task Handler or `BLTH API` can perform logic at admin task level. `BLTH` run\
    \ in synchronous phase, it can execute before admin task render and after admin\
    \ task is submitted (but before any events).\n\n| ![](image_rsrc8TF.jpg) |\n|\
    \ Figure 3-2 shows Business Task Handler API works before and after admin task.\
    \ |\n\nThis API is very useful, we will use frequency. We can access user store\
    \ from `BLTH`.\n\nExamples of BLTH:\n*   Administrator executes the admin task;\
    \ `BLTH` can initial some values on screen.\n*   Administrator submits the admin\
    \ task; `BLTH` validates the fields on screen.\n*   Administrator submits the\
    \ admin task; `BLTH` performs the logic or modify user’s attributes in user store.\n\
    \n### 3.1.2 Workflow API\n\nThe `Workflow API` is very important in the real world\
    \ requirements. The `workflow` can work at admin task level or event level.\n\n\
    | ![](image_rsrc8TG.jpg) |\n| Figure 3-3 shows workflow can specific at admin\
    \ task level or event level |\n\nThe `workflow` is required when:\n*   Your requirement\
    \ needs approval\n*   Business logic requires a long processing time. We can use\
    \ `workflow` implement business logic in event level. It will run in asynchronous\
    \ phase. Compare to `BLTH` runs in synchronous phase, it does not fit for long\
    \ processing time.\n\nThis book, we will learn how to create custom workflow by\
    \ software `WorkPoint`.\n\nExamples of workflow:\n*   If users’ office is New\
    \ York, this task requires 2 approvers. If users’ office is London, this task\
    \ requires one additional approver.\n*   The requirement requires enable an account\
    \ on hiring date.\n\n### 3.1.3 Participant Resolver API\n\nThis API is used as\
    \ part of workflow. `Participant Resolver API` answers to the question; who is\
    \ approver. We can implement conditions for looking approver.\n\nExample:\n* \
    \  We want manager of manager is approver.\n\n| ![](image_rsrc8TH.jpg) |\n| Figure\
    \ 3-4 shows the workflow has approver that require Participant Resolver API |\n\
    \n### 3.1.4 Event Listener API\n"
  raw: '​View Submitted Task is very important for developer to understand CA IdentityMinder
    behavior. After admin task was submitted, you can go check status in View Submitted
    Task. Select tab “System”, select menu “View Submit Task” and select “Search”


    | ![](image_rsrc8SZ.jpg) |


    | Figure 2-61 shows View Submitted Tasks screen |


    ​Find your summited task, it should be the latest one. And click icon “![](image_rsrc8T0.jpg)”
    to see detail inside.


    | ![](image_rsrc8T1.jpg) |


    | Figure 2-62 shows our submitted task. |


    ​There are 2 interesting thing inside submitted task details.


    *   Task History tells how many Identity Policy Set or Policy Xpress are matched.


    *   Included Event tells how many events are generated


    | ![](image_rsrc8T2.jpg) |


    | Figure 2-63 shows Task History and Included Events |


    ​There are 7 events were generated in sequence order:


    1.  Event No 1: Modify user


    This event Modify user was generated because we modify user’s attribute: city.
    It was generated after we submitted task (that primary object is “User” and action
    “Modify”). Select icon “pencil” to see more detail. It will show new value and
    old value after submit task.


    | ![](image_rsrc8T3.jpg) |


    | Figure 2-64 shows Event No 1: Modify user was generated because we modify city
    attribute. |


    After this event finish, city attributes in User Store will be changed.


    | ![](image_rsrc8T4.jpg) |


    | Figure 2-65 after Event No 1: Modify user finished, city attribute was changed.
    |


    2.  Event No 2 : Synchronize user


    This event was generated because when we select drop down User Synchronization:
    On task completion in admin task. When this event generate, it will trigger our
    Policy Set: Set Office Address.


    | ![](image_rsrc8T5.jpg) |


    | Figure 2-66 shows event No.2 was generated by option User Synchronization. |


    3.  Event No 3: Modify user


    This event was generated by Policy Xpress. Policy Xpress set value of Business
    Phone. After this event finished, the telephone number attribute value in User
    Store has been changed.


    | ![](image_rsrc8T6.jpg) |


    | Figure 2-67 shows event No.3 was generated by policy Xpress to modify telephone
    number. |


    4.  Event No 4: Modify user


    This event was generated by Identity Policy Set. Identity Policy set attribute
    country. After this event finished, the country attribute value in User Store
    has been changed.


    | ![](image_rsrc8T7.jpg) |


    | Figure 2-68 shows event No.4 was generated by Identity Policy Set modify attribute
    country. |


    5.  Event No 5: Synchronized provisioning role and add accounts for user.


    This event was generated because User has provisioning role and select option
    User Synchronization.


    This event is used for create account in Endpoint. If you have already had account
    in Endpoint, this event does nothing. You can see detail in TASK SESSION accounts
    create: 0 update: 0 re-create:0 and failure: 0.


    | ![](image_rsrc8T8.jpg) |


    | Figure 2-69 shows event No.5 details. |


    6.  Event No 6: Synchronize User


    This event was generated by Policy Xpress after modify user event. We know because
    the value in “Attribute Changed” is value from Policy Xpress.


    | ![](image_rsrc8T9.jpg) |


    | Figure 2.70 shows event No.6 details. |


    7.  Event No. 7 Synchronize user attributes with accounts Event Details


    This event was generated because we select option in admin task screen Account
    Synchronization: On Task Complete. This event will update the global users’ and
    accounts’ attributes.


    | ![](image_rsrc8TA.jpg) |


    | Figure 2-71 shows event No.7 details. |


    ​After all events are complete, go check user’s attribute in CA IdentityMinder
    User Store, Provisioning Directory and Endpoint (Active Directory).


    | ![](image_rsrc8TB.jpg) |


    | Figure 2-72 shows attributes of user, global user and account |


    ​When admin task submitted, you have to know:


    *   How many events will be generated?


    *   Which component generate event?


    *   What expected outcome of event?


    | ![](image_rsrc8TC.jpg) |


    | Figure 2-73 shows all events from our example. |


    Limitation


    ​Our admin task has some limitations:


    *   It cannot show the current value of extension number.


    *   There no validation for extension number


    *   If we change only extension number and do not change city value, the CA IdentityMinder
    assumes there are nothing changes in this task.


    We can fix these limitations easily by programming.


    | ![](image_rsrc8TD.jpg) |


    | Figure 2.-74 shows message when we update only extension number, not city attribute
    |


    ## 2.6 Conclusion


    ​This chapter we create admin task and use administrator’s tool to implement requirement.
    We learn:


    *   How to create admin task


    *   How provisioning works


    *   How Identity Policy Set and Policy Xpress works


    *   Understand submitted task and events


    ​The next chapter, we will learn programming concept.


    # Chapter 3 Programming Concepts and Configuring IDE


    ​This chapter, we will learn:


    *   Concept of Synchronous and Asynchronous phase


    *   Overview of 9 APIs.


    *   Configuring IDE.


    ## 3.1 CA IdentityMinder APIs Overview


    There are 2 types of CA IdentityMinder programming:


    *   Java Programming: performs the logics and integration.


    *   Connector Programming: for custom connector connect endpoint


    ​We separate book for connector in another book. We will focus on the java programming
    first. This chapter introduces functional and purpose of each APIs.


    ​Synchronous vs. Asynchronous Phase


    ​Before we start any API concepts, you need to understand Synchronous vs. Asynchronous
    Phase. Admin task execution has the following two phases:


    *   Synchronous Phase is processing during the task is submitted and response
    to user on screen. The task has not yet been broken down into its component events.


    *   Asynchronous Phase is process after response display on screen to user. The
    task has been broken down into its component events. It may take time up to an
    hour or a month.


    | ![](image_rsrc8TE.jpg) |


    | Figure 3-1 shows Synchronous and Asynchronous phase |


    ### 3.1.1 Business Logic Task Handler API (BLTH)


    Business Logic Task Handler or BLTH API can perform logic at admin task level.
    The BLTH run in synchronous phase, it can execute before admin task render and
    execute after admin task is submitted. (but before any events create)


    | ![](image_rsrc8TF.jpg) |


    | Figure 3-2 shows Business Logic Task Handler API works before and after admin
    task. |


    This API is very useful, we will use frequency. We can access user store from
    BLTH.


    ​Examples of BLTH:


    *   Administrator executes the admin task; BLTH can initial some values on screen.


    *   Administrator submits the admin task; BLTH validates the fields on screen.


    *   Administrator submits the admin task; BLTH performs the logic or modify user’s
    attributes in user store.


    ### 3.1.2 Workflow API


    The workflow API is very important in the real world requirements. The workflow
    can work at admin task level or event level.


    | ![](image_rsrc8TG.jpg) |


    | Figure 3-3 shows workflow can specific at admin task level or event level |


    ​The workflow is required when:


    *   Your requirement needs approval


    *   Business logic requires a long processing time. We can use workflow implement
    business logic in event level. It will run in asynchronous phase. Compare to BLTH
    runs in synchronous phase, it does not fit for long processing time.


    This book, we will learn how to create custom workflow by software WorkPoint.


    ​Examples of workflow:


    *   If users’ office is New York, this task requires 2 approvers. If users’ office
    is London, this task requires one additional approver.


    *   The requirement requires enable an account on hiring date.


    ### 3.1.3 Participant Resolver API


    ​This API is used as part of workflow. Participant Resolver API answers to the
    question; who is approver. We can implement conditions for looking approver.


    ​Example:


    *   We want manager of manager is approver.


    | ![](image_rsrc8TH.jpg) |


    | Figure 3-4 shows the workflow has approver that require Participant Resolver
    API |


