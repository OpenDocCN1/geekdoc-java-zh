    \n| ![](img/image_rsrc8SM.jpg) |\n\n| 图 2-50 显示了 `Identity Policy Set` 的工作。 |\n\
    \n`Identity Policy Set` 有一些局限性，因为条件基于用户的属性或角色成员。接下来，我们将创建 `Policy Xpress` 来提供更多功能。\n\
    \n## 2.4.2 Policy Xpress\n\n`Policy Xpress` 允许你在 `CA IdentityMinder` 中创建复杂的业务逻辑（策略），而无需开发自定义代码。`Policy\
    \ Xpress` 比 `Identity Policy Set` 更灵活。它可以访问逻辑属性并捕获事件。在本节中，我们将创建 `Policy Xpress`\
    \ 来解决需求。当用户输入扩展分号时，我们将更新电话号码格式为 `<phone number>x<extension number>`。\n\n选择“Policies”（策略）标签页和子菜单“Create\
    \ Policy Xpress Policy”（创建 Policy Xpress 策略）。选择“Create a new object of type Policy\
    \ Xpress”（创建一个类型为 Policy Xpress 的新对象）。\n\n| ![](img/image_rsrc8SN.jpg) |\n\n|\
    \ 图 2-51 显示了创建 Policy Xpress Policy 的菜单 |\n\n### Profile（配置）标签页\n\n按照下表设置 `Policy\
    \ Xpress` 的值：\n\n| 字段名称 (Field Name) | 值 (Value) | 说明 (Description) |\n| :---\
    \ | :--- | :--- |\n| Name | Set Telephone Number | 策略名称 |\n| Policy Type | Submitted\
    \ Task | 定义触发策略的监听器。当任务提交时，我们的 `Policy Xpress` 将执行。 |\n| Category | Book Example\
    \ | 类别名称 |\n| Priority | 0 | 数字越小，优先级越高 |\n| Enable | Check | 此策略在 `CA IdentityMinder`\
    \ 中处于激活 |\n| Run Once | Do not Check | 指定策略是否仅运行一次。对于我们的策略，不勾选，并在每次符合标准时运行。 |\n\
