  trans: "\n\n## 2. 搜索我们的管理员任务名称：`Update Location and Ext Number`。\n\n- 请禁用上一个示例中的业务逻辑任务处理器、policy\
    \ Xpress 或工作流。\n\n## 3. 选择标签事件并点击 `ModifyUserEvent`。\n\n## 4. 选择非基于策略的工作流：`singleStepApproval`\n\
    \n- 针对主审批人（Primary Approver）：\n    - `Approval Task` 下拉菜单，选择 `Approve Modify User`\n\
    \    - `Participant Resolver` 下拉菜单，选择 `Custom:MgrOfMgrParticipantResolver`\n-\
    \ 针对默认审批人（Default Approver）：\n    - `Approval task` 下拉菜单，选择 `Approve Modify User`\n\
    \    - `Participant Resolver` 下拉菜单，选择您的管理员。\n\n| ![](img/image_rsrc8XH.jpg) |\n\
    | 图 6-2 显示了工作流配置 |\n\n### 工作原理\n\n你必须准备 3 个用户：`user A`、`user B` 和 `user C`。登录用户数据存储并检查属性\
    \ `managerID`：\n\n- `User A` 的 `managerID = user B`\n- `User B` 的 `managerID =\
    \ user C`\n- `User C` 的 `managerID = \"\"`\n\n以 `administrator` 身份登录 Identity\
    \ Manager 用户控制，选择标签：`Book Example`\n\n### 案例 1：修改用户 A，参与者是经理的经理（Manager of Manager）\n\
    \n4. 选择 `Admin Task`：“Update Location and Ext Number”，然后搜索并选择 `user A`。修改城市属性并提交管理员任务。\n\
    5. 以 `user C` 身份登录，你应该看到审批请求。\n\n### 案例 2：修改用户 B，参与者是经理（Manager）\n\n1. 再次选择 `Admin\
    \ Task`：“Update Location and Ext Number”并选择 `user B`。修改城市属性并提交管理员任务。\n2. 以 `user\
    \ C` 身份登录，你应该看到审批请求。\n\n### 案例 3：修改用户 C，没有经理\n\n1. 再次选择 `Admin Task`：“Update Location\
    \ and Ext Number”并选择 `user C`。修改城市属性并提交管理员任务。\n2. 以 `administrator` 身份登录，你应该看到审批请求。\n\
    \n### 查找经理的经理\n\n我们使用 `ProviderAccess` 查找经理。获取用户后，查找属性 `managerID`，并通过 `managerID`\
    \ 搜索经理，直到找到经理的经理。\n\n```java\nString userId = ctx.getSubject().getFriendlyName();\n\
    User user = ctx.getUserProvider().findUser(userId, null);\nString managerID =\
    \ user.getAttribute(\"managerID\");\nUser managerUser = ctx.getUserProvider().findUser(managerID,\
    \ null);\nString mgrOfMgrID = managerUser.getAttribute(\"managerID\");\nUser mgrOfMgrUser\
    \ = ctx.getUserProvider().findUser(mgrOfMgrID, null);\nresolver.add(mgrOfMgrUser);\n\
    ```\n\n### 添加参与者\n\n代码非常简单。我们创建一个 vector 对象并将作为参与者的 `User` 对象添加到该对象中。\n\n```java\n\
    Vector resolver = new Vector();\nresolver.add(mgrOfMgrUser);\n```\n\n### 没有经理的经理\n\
    \n如果用户没有经理的经理，我们将返回经理\n\n```java\nif(mgrOfMgrID == null || mgrOfMgrID.trim().length()==0){\n\
    \    System.out.println(userId+\" has only manager \"+managerID);\n    resolvers.add(managerUser);\n\
    \    return resolvers;\n}\n```\n\n如果没有审批人，则直接返回空 vector。\n\n### 6.1.3 用例示例\n\n\
    官方文档（Programming Guide for Java > Workflow API > Participant Resolver API > Participant\
    \ Resolver Overview > Use Case Example）中提供了一个用例示例。\n\n#### 将组的管理员分配为参与者\n\n每当用户被添加到\
    \ `HR` 组时，都需要进行工作流审批。自定义参与者解析器会将该组的管理员分配为工作流活动中的参与者。当用户被添加到 `HR` 时，事件 `AddToGroupEvent`\
    \ 将进入工作流控制，在指定的参与者批准该活动之前，活动无法成功完成。\n\n此工作流运行特定事件层级的 `AddToGroupEvent`。我们可以编写条件：如果组名等于“HR”，则返回审批人；如果组名不等于“HR”，则返回空\
    \ vector。\n\n```java\npublic Vector resolve(ParticipantResolverContext ctx, Hashtable\
    \ userData, String approvalNodeName) throws Exception {\n    Vector resolver =\
    \ new Vector();\n    AddToGroupEvent event = (AddToGroupEvent)ctx.getEvent();\n\
    \    String groupName = event.getGroup().getFriendlyName();\n    if(groupName.equals(\"\
    HR\")){\n        resolver = event.getGroup().getAdmins(null);\n    }\n    return\
    \ resolver;\n}\n```\n\n我们从 `event` 获取组。我们可以通过方法 `getAdmins()` 获取此组的管理员。请查看 java\
    \ 文档获取更多详情。\n\n## 6.2 事件监听器 API (Event Listener API)\n\n当 `CA IdentityMinder`\
    \ 执行管理员任务时，它会将任务分解为各个组件事件。每个事件代表任务执行期间要执行的特定操作，例如 `CreateUserEvent` 表示添加新用户。\n\
    \n事件监听器监听特定事件或一组事件。当事件发生时，事件监听器执行适用于该事件和当前事件状态的自定义业务逻辑。\n\n### 6.2.1 编程\n\n对于事件监听器\
    \ API，你必须创建一个扩展 `EventListenerAdapter` 的 Java 类并根据需要覆盖方法。\n\n- `int before(EventContext\
    \ evtCtx)`：在预审批（Pre-approval）状态执行自定义业务逻辑。\n- `int approved(EventContext evtCtx)`：在已批准（Approved）状态执行自定义业务逻辑。\n\
    - `int rejected(EventContext evtCtx)`：在已拒绝（Rejected）状态执行自定义业务逻辑。\n- `int after(EventContext\
    \ evtCtx)`：在执行后（Post）状态执行自定义业务逻辑。\n- `int failed(EventContext evtCtx)`：在失败（Failed）状态执行自定义业务逻辑。\n\
    \n方法返回 `BREAK` 或 `CONTINUE`。`BREAK` 表示没有更多监听器，`CONTINUE` 表示处理下一个监听器。\n\n### 6.2.2\
    \ 代码示例：事件监听器\n\n示例显示了监听器的生命周期。它使用标准输出。\n\n#### 代码\n\n1. 编译 Java 代码：`com.book.etc.LifeCycleEventListener`\n\
    2. 将类（包含包 `com.book.etc`）复制到 `\\IdentityMinder.ear\\custom`\n\n#### 配置\n\n1. 在控制台中，点击\
    \ `Environments`（环境）。\n2. 点击使用事件监听器的环境名称。\n3. 点击 `Advanced Settings`（高级设置）。\n\
    4. 点击 `Listenersers`。\n5. 点击新建按钮并输入如下值：\n\n| 字段名称 | 值 | 描述 |\n| :--- | :--- |\
    \ :--- |\n| Name | `LifeCycleEventListener` | 监听器名称 |\n| Class | `com.book.etc.LifeCycleEventListener`\
    \ | 我们的 Java 类 |\n| Listener Level | `ModifyUserEvent` | 类监听的事件 |\n\n| ![](img/image_rsrc8XJ.jpg)\
    \ |\n| 图 6-3 显示了事件监听器配置 |\n\n6. 重启环境 (Restart Environment)\n\n"
