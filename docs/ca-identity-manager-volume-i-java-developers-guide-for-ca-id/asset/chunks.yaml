  trans: "\n\n* 业务逻辑任务处理器 API 在同步阶段执行\n    * 这意味着用户必须等待直到逻辑执行完成。\n* 业务逻辑任务处理器 API\
    \ 必须在任何事件创建之前完成。\n* 业务逻辑任务处理器 API 适用于：\n    * 验证和格式化任务屏幕字段。\n    * 强制执行需要立即响应（同步）的自定义业务逻辑。\n\
    \n## 4.1 编程与配置概念\n\n业务逻辑任务处理器 API 可以通过 Java 或服务端 JavaScript 脚本实现。本书仅使用 Java 语言。对于服务端\
    \ JavaScript 脚本，您可以参阅详尽的官方文档。我们将使用 `java` 作为所有 API 的统一语言，并且也可以从 `java` 工具类库中获益。\n\
    \n### 4.1.1 编程\n\n要实现业务逻辑任务处理器 API，我们只需要创建一个 `java` 类并扩展 `BLTHAdapter` 类，然后重写方法。每个方法都是在管理任务生命周期期间执行的回调方法。您可以根据需求实现某些或全部方法：\n\
    \n* `handleStart()`：在任务开始时执行。\n* `handleSetSubject()`：在从搜索结果中选择主体（例如选择用户）后执行。它设置屏幕上的初始值。\n\
    * `handleValidation()`：在用户提交任务后执行。用于验证。\n* `handleSubmission()`：在 `handleValidation()`\
    \ 之后执行。用于执行逻辑。\n\n#### 开发步骤\n\n1. 编写扩展 `BLTHAdapter` 的 `java` 代码。\n2. 编译并确保没有错误，且使用的\
    \ `JDK` 版本与服务器版本相同。\n3. 将类文件（包括包文件夹）拷贝到文件夹 `\\IdentityMinder.ear\\custom`。\n\n\
    ### 4.1.2 配置\n\n业务逻辑任务处理器可以通过两种范围进行配置：\n\n* 全局业务逻辑任务处理器：此级别意味着它适用于所有管理任务。每当调用任何管理任务时，我们的\
    \ `java` 代码都会执行。\n* 任务特定业务逻辑任务处理器：此 `java` 代码将在配置的特定管理任务中执行。此范围在书中频繁使用。\n\n####\
    \ 全局业务逻辑任务处理器\n\n它们在管理控制台中通过通过选择 `Home > Environments > <your server> > Advanced\
    \ Settings > Business Logic Task Handlers` 进行配置。\n\n![](img/image_rsrc8TR.jpg)\n\
    | 图 4-1 显示了全局业务逻辑任务处理器的界面 |\n\n您可以点击 `New` 按钮来配置业务逻辑任务处理器。配置屏幕上的每个字段与任务特定业务逻辑任务处理器相同。\n\
    \n#### 任务特定业务逻辑任务处理器\n\n此级别适用于特定的管理任务。步骤如下：\n\n1. 以管理员身份登录 Identity Manager 用户控制台。\n\
    2. 搜索管理任务名称。\n3. 点击 `Business Logic Task Handlers` 按钮，然后点击 `Add` 按钮指定 `java` 类名。\n\
    \n![](img/image_rsrc8TS.jpg)\n| 图 4-2 显示了任务特定的 `Business Logic Task Handlers`\
    \ 按钮 |\n\n## 4.2 任务会话\n\n任务会话是执行中任务的实例。在任务执行期间，业务逻辑任务处理器可以访问当前任务会话中的信息。任务会话信息可以通过\
    \ `BLTHContext` 获取。接口提供了检索当前任务会话中托管对象运行实例的方法，例如：\n\n* 方法 `getUser()`：检索参与当前任务的\
    \ `User` 对象。\n    * 请注意，如果管理任务具有主对象 `User`（例如 `modify user`），则 `getUser()` 将有效。如果您的管理任务是\
    \ `modify endpoint`，则调用 `getUser()` 没有意义的。\n* 获取任何关系对象（如角色和组）。\n\n`BLTHContext`\
    \ 继承自许多父接口：\n\n* `TaskInfo`：关于当前任务的信息；例如 `getSubject()` 返回主对象。\n* `IMContext`：提供关于用于在\
    \ API 之间共享会话的方法。该接口还提供了 `getAuxDataRoot()` 方法访问辅助数据树的根。\n* `ProviderAccessor`：提供直接访问数据存储中任何托管对象的权限。我们将在下一节讨论托管对象。\n\
    \n## 4.3 访问托管对象\n\n托管对象是指数据存储中的对象，例如 `user` 或 `account`。业务逻辑任务处理器可以通过以下两种方式访问托管对象：\n\
    \n#### 通过 ProviderAccessor\n\n`ProviderAccessor` 是 `BLTHContext` 的父类：\n\n* 可以访问任何托管对象。\n\
    * 可以访问托管对象中的任何属性。\n* 当调用 `modifyObject()` 时，对托管对象的任何更改都会立即持久化到数据存储中。\n    * 不生成事件，也不执行工作流审批、审计或安全检查。\n\
    \n#### 通过 Context\n\n本章中的 Context 指 `BLTHContext`，但其他章节指 `WorkflowContext`、`EventContext`\
    \ 等。\n\n* 限制访问任务会话，包括任务主体（主对象）和主体的关系。\n    * 例如管理任务：`Modify User`。上下文只能访问作为此任务托管对象的\
    \ `User` 对象。\n* 限制访问属性：\n    * 例如，如果管理任务只定义了 `user` 对象的 `city` 属性，您无法访问 `user`\
    \ 对象的 `country` 属性。\n* 更改将在事件完成后提交。\n    * 例如，如果您使用 `BLTHContext` 修改 `city` 属性，但用户修改事件失败或工作流（事件内部）被拒绝，则\
    \ `city` 属性将不会提交。\n    * CA IdentityMinder 为任务生成事件，并可以执行工作流审批、审计和安全检查。\n\n![](img/image_rsrc8TT.jpg)\n\
    | 图 4-3 显示了访问托管对象的 2 种方式。 |\n\n下表比较了 `BLTHContext` 和 `ProviderAccessor` 之间的差异。\n\
    \n| 主题 | ProviderAccessor | BLTHContext |\n| :--- | :--- | :--- |\n| 访问对象 | 可以访问任何托管对象。\
    \ | 仅访问与任务会话相关的对象。 |\n| 访问属性 | 可以访问任何属性。 | 根据您定义管理任务的时间限制访问。 |\n| 修改值 | 当调用 `modifyObject()`\
    \ 时，修改后的值会立即提交到数据存储中。 | 在事件完成之前值不会提交。 |\n| 事件 | 不生成额外的事件。 | 与任务相关的事件有关。 |\n\n\
    我们将在下一节和章节中通过示例介绍托管对象的更多细节。\n\n## 4.4 代码示例\n\n在 CA IdentityMinder 编程中，我们使用名为 `IdmCode`\
    \ 的 java 项目。我们复用了上一章中的管理任务。我们将仅使用业务逻辑任务处理器 API 执行管理任务，因此我们需要禁用上一章中的 Identity Policy\
    \ Set 和 policy Xpress。\n\n![](img/image_rsrc8TU.jpg)\n| 图 4-4 显示通过取消勾选启用框来禁用 Identity\
    \ Policy Set 和 Policy Xpress |\n\n### 4.4.1 基础编程：BLTHAdapter 和生命周期\n\n此示例逐步演示了业务逻辑任务处理器的基础编程。CA\
    \ IdentityMinder 编程始终需要两个部分：编码和配置。此示例仅展示业务逻辑任务处理器 API 的生命周期。我们将打印到日志文件中。\n\n####\
    \ 代码\n\n1. 运行 eclipse 并选择 java 类：\n    * 包：`com.book.idm.blth`\n    * 类：`BasicLifeCycle`\n\
    \    * 扩展 `BLTHAdapter`\n\n下面的列表显示了我们的代码\n\n"
- fmt: "\n```java\npackage com.book.idm.blth;\nimport com.netegrity.imapi.BLTHAdapter;\n\
    import com.netegrity.imapi.BLTHContext;\npublic class BasicLifeCycle extends BLTHAdapter{\n\
    \    @Override\n    public void handleStart(BLTHContext blthContext) throws Exception\
    \ {\n        System.out.println(\"UpdateLocationExtNumber:handleStart\");\n  \
    \  }\n    @Override\n    public void handleSetSubject(BLTHContext blthContext)\
    \ throws Exception {\n        System.out.println(\"UpdateLocationExtNumber:handleSetSubject\"\
    );\n    }\n    @Override\n    public void handleValidation(BLTHContext blthContext)\
    \ throws Exception {\n        System.out.println(\"UpdateLocationExtNumber:handleValidation\"\
    );\n    }\n    @Override\n    public void handleSubmission(BLTHContext blthContext)\
    \ throws Exception {\n        System.out.println(\"UpdateLocationExtNumber:handleSubmission\"\
    );\n    }\n}\n```\n\n2. Compile and copy class (include package folder `com.book.idm.blth`)\
    \ to folder `\\IdentityMinder.ear\\custom`.\n\n### Configuration\n\nThere are\
    \ 2 type of configuration: global business logic task handlers and task-specific\
    \ business logic task handlers. We choose task-specific business logic task handlers\
    \ for all our examples.\n\n1. Search our admin task name: Update Location and\
    \ Ext Number.\n2. To click button `Business Logic Task Handlers`, then click `Add`\
    \ button to specific java class name.\n3. Put value as below:\n\n| Field Name\
    \ | Value | Description |\n| :--- | :--- | :--- |\n| Name | `BLTHExample` | Name\
    \ of business logic task handler |\n| Java Class | `com.book.idm.blth.BasicLifeCycle`\
    \ | Our java class name that we put in custom folder |\n\n![](image_rsrc8TV.jpg)\
    \  \nFigure 4-5 shows screen Business Logic Task Handler Details.\n\n4. Click\
    \ ok and submit this admin task.\n\n### How it works\n\nWe can execute our code\
    \ by admin task following these steps:\n\n1. Log into the Identity Manager User\
    \ Console as administrator.\n2. Select tab: `Book Example` and select menu: `Basic`.\n\
    3. Select Admin Task: `Update Location and Ext Number`.\n\n![](image_rsrc8TW.jpg)\
    \  \nFigure 4-6 shows select admin task.\n\nThe Log file shows:\n\n```\nINFO [STDOUT]UpdateLocationExtNumber:handleStart\n\
    ```\n\n4. Then search and select some users. When admin Task was displayed, Log\
    \ file will show:\n\n```\nINFO  [STDOUT]  UpdateLocationExtNumber:handleSetSubject\n\
    ```\n\n![](image_rsrc8TX.jpg)  \nFigure 4-7 shows admin task screen display\n\n\
    5. Modify city’s attribute (you have to modify city value) and submit admin task,\
    \ log will display:\n\n```\nINFO [STDOUT] UpdateLocationExtNumber:handleValidation\n\
    INFO [STDOUT] UpdateLocationExtNumber:handleSubmission\n```\n\nYou will see the\
    \ business logic task handlers’ life cycle, when each method of `BLTHAdapter`\
    \ executes.\n\n### 4.4.2 Modify user’s attributes by BLTHContext\n\nThis example\
    \ will demo how to use `BLTHContext`:\n\n* Modify city attribute to be “New City”.\n\
    * Get information about the current task from parent interface: `TaskInfo`.\n\n\
    ### Code\n\n1. Compile our java code: `com.book.idm.blth.ModifyUserByBLTHContext`.\n\
    2. Copy class (include package folder `com.book.idm.blth`) to folder `\\IdentityMinder.ear\\\
    custom`.\n\n### Configuration\n\n1. Log into the Identity Manager User Console\
    \ as administrator.\n2. Select tab `Roles and Tasks`, and select menu `modify\
    \ admin task`.\n3. Search and select our admin task name: `Update Location and\
    \ Ext Number`.\n4. Click button `Business Logic Task Handlers`, then icon `pencil`.\n\
    \n![](image_rsrc8TY.jpg)  \nFigure 4-8 shows icon “pencil” to modify java class.\n\
    \n5. Modify value as below:\n\n| Field Name | Value | Description |\n| :--- |\
    \ :--- | :--- |\n| Java Class | `com.book.idm.blth.ModifyUserByBLTHContext` |\
