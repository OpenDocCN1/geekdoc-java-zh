    \n请参阅 Programming Guides › Programming Guide for Java › Business Logic Handler\
    \ API › Business Logic API Overview › Use Case Examples。\n\n检查组成员限制是否达到\n\n当管理员通过提交修改组任务尝试向组添加成员时，访问组管理对象以确定当前成员的数量。如果组达到了最大人数，则抛出异常。\n\
