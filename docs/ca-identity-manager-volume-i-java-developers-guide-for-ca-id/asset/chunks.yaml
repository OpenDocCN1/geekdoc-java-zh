  trans: "\n\n`WorkflowCallbackHelper.generateWorkflowContext` 需要 `2` 参数：`ims-id`\
    \ 和 `ime-id`。这些 ID 在任务创建时生成。你可以搜索该任务（流程实例），在画布上点击右键，并查看任务的用户数据（user data）标签页。我们的代码通过\
    \ `queryByID()` 方法获取当前任务，然后通过 `getUserData()` 方法获取 `ims-id` 和 `ime-id`。\n\n顺便提一下，代码获取\
    \ `WorkflowContext` 的模式，你只需复制并复用即可。\n\n| ![](img/image_rsrc8WU.jpg) |\n\n图 5-66\
    \ 显示了用户数据标签页中的 `ims-id` 和 `ime-id`。\n\n下一行显示了如何从流程上下获取 `User` 对象。我们创建了工具方法 `getUser()`\
    \ 来返回用户对象。\n\n```\nuser = WorkpointHelper.getUser(workflowContext);\n```\n\n我们使用方法\
    \ `getSubject()` 返回管理员任务的主对象。我们的管理员任务以 `User` 为主对象。如果你尝试在主对象不是用户的管理员任务中调用此方法，你将会得到错误。\n\
    \n```java\npublic static User getUser(WorkflowContext workflowContext) throws\
    \ Exception{\n    ManagedObject managedObject = workflowContext.getSubject();\n\
    \    if(managedObject instanceof User){\n        return (User)managedObject;\n\
    \    }else{\n        throw new IllegalArgumentException(\"Managed Object is not\
    \ User\");\n    }\n}\n```\n\n`WorkflowContext` 扩展了 `IMContext`、`IMPersistentContext`、`ProviderAccessor`、`ServiceProvider`\
    \ 和 `TaskInfo`。更多细节请参考官方 Java 文档。它与 `BLTHContext` 相似，不同在于 `WorkflowContext` 扩展了\
    \ `EventContext`。\n\n请注意流程有两个 `2` 级：管理员任务级别事件级别。如果你的流程运行在管理员任务级别，并尝试调用父类 `EventContext`\
    \ 的任何方法，将得到意外的结果。\n\n我们有另一个方法 `getUser(EventContext context)`。你必须确保你的流程运行在用户事件。下面的代码显示了如何从事件获取用户对象。\n\
    \n```java\nIMEvent evt= workflowContext.getEvent();\nUser user = ((UserEvent)evt).getUser();\n\
    ```\n\n我们在 `WorkpointHelper.java` 中的方法 `getUser()` 可以在你的项目中复用。我们对流程编程有额外的说明。\n\
    \n**注意 1：`WorkflowContext` 正确调用来自父类（`EventContext`）的方法。**\n\n* 如果流程运行在管理员任务级别，不要调用来自父类\
    \ `EventContext` 的方法。\n* 确保执行了正确的类型转换。例如：\n    * 流程关联到事件 `ModifyUserEvent`，你可以通过\
    \ `UserEvent` 转换对象（`ModifyUserEvent` 是 `UserEvent` 的子类）\n\n```java\nUser user\
    \ = ((UserEvent)evt).getUser();\n```\n* 流程关联到事件 `AddToGroupEvent`，你可以通过 `GroupEvent`\
    \ 转换（`AddToGroupEvent` 是 `GroupEvent` 的子类）\n```java\nGroup group = ((GroupEvent)evt).getGroup();\n\
    ```\n\n这与 `BLTHContext` 相同，在使用方法 `getSubject()` 时，请检查管理员任务的主对象是什么。\n\n代码的下一行打印值。它演示了如何访问新值和旧值。\n\
    \n```java\nSystem.out.println(\"City : New Value =\"+user.getAttribute(\"l\"));\n\
    System.out.println(\"City : Old Value =\"+user.getLastCommittedAttribute(\"l\"\
    ));\n```\n\n下一行代码显示了如何在用户数据标签页中设置值。在用户数据标签页中，我们添加键值对（city=none）。这段代码将值修改为新用户的城市属性。\n\
    \n```java\n// 将新值放入用户数据\nthisactivityInstData.setUserData(\"city\",user.getAttribute(\"\
    l\").toLowerCase());\n```\n\n`Transition` 使用用户数据中的城市来决定路径。如果发生异常（默认值为“none”），它将进入“City\
    \ != New York”路径。因此，你应该意识到流程内部的异常。\n\n| ![](img/image_rsrc8WV.jpg) |\n\n图 5-67\
    \ 显示了用户数据与跳转（transition）之间的关系 \n\n### Transition（跳转）\n\n`Transition` 是节点之间的连接。你可以通过点击条件标签页中的铅笔图标来编辑跳转中的条件。\n\
    \n| ![](img/image_rsrc8WW.jpg) |\n\n图 5-68 显示了编辑条件的铅笔图标 \n\n在我们的示例中，我们使用了条件向导。在条件标签页中，有许多创建条件的方法。你也可以进行编程（但不推荐）。\n\
    \n提交后无法编辑条件，但你可以更改语句类型或删除此脚本并创建一个新的。（某些情况下，由于存在某些引用，你无法删除，如果你不想删除引用，我建议更改名称）\n\
    \n| ![](img/image_rsrc8WX.jpg) |\n\n图 5-69 显示了跳转中语句类型的列表 \n\n#### 带有 Java 代码的跳转条件\n\
    \n你可以在跳转中使用 Java 代码；你需要向符号表中设置最终结果为 TRUE 或 FALSE。`Transition` 将引用 `SymbolTable`\
    \ 中“Result1”的值来决定路径。例如，跳转“City == New York”，我们可以编写如下代码：\n\n```java\nboolean result\
    \ = false;\nif(city.equalsIgnoreCase(\"new york\")){\n    result = true;\n} \n\
    symbolTable.add(\"Result1\").setValue(0,result);\n```\n\n关于 `SymbolTable` 类的更多细节，请参阅\
    \ Workpoint 帮助文档。\n\n我们需要从节点“Check City Value”的用户数据中获取城市值。`transition` 是“源节点”和“目标节点”之间的连接。\n\
    \n| ![](img/image_rsrc8WY.jpg) |\n\n图 5-70 显示了跳转的源和目标 \n\n有 `2` 种从源节点的用户数据中访问城市值的方法。\n\
    \n**第一种方法：传递参数。** 你必须放入 `SourceActivity.city`。`SourceActivity` 是源节点，`UD` 是用户数据\n\
    \n| ![](img/image_rsrc8WZ.jpg) |\n\n图 5-71 显示了参数中的 `SourceActivity.UD`\n\n```java\n\
    public void isCityEqualYork(String city, SymbolTable symbolTable, JobData thisJobData,\
    \ JobTranData jobTransData){\n// 根据城市在符号表中设置 Result1\n    System.out.println(\"\
    Get city by SourceActivity :\"+city);\n}\n```\n\n**第二种方法，通过源节点查找。** 这种方法需要两个参数：`JobData`\
    \ 和 `JobTranData`。\n\n| ![](img/image_rsrcX0.jpg) |\n\n图 5-72 显示了参数中的 `JobData`\
    \ 和 `JobTranData`\n\n`ThisJobData` 是流程实例。`ThisTransitionData` 是该跳转的实例。下面的代码显示了如何从源节点访问用户数据。\n\
    \n```java\nID sourceNodeID = jobTransData.getSourceNodeID();\nActivityInstData\
    \ sourceActivity = thisJobData.getActivityByNodeID(sourceNodeID);\nString cityUD\
    \ = sourceActivity.getUserData(\"city\").getVariableValue();\nSystem.out.println(\"\
    Get city by sourceNodeID :\"+cityUD);\n```\n\n**注意 2：保持跳转条件简单**\n\n建议是保持跳转条件简单。你应该使用条件向导。避免在跳转中使用复杂的逻辑。例如，有两个跳转：“City\
    \ == New York”和“City != New York”。如果你在“City == New York”跳转中进行编程，你需要在另一个跳转中也进行编程。这意味着你要做两次。\n\
    \n建议在源节点中进行逻辑处理或计算，并在用户数据中保留原始结果。`transition` 只使用结果来决定路径。这样更容易维护。\n\n### Delay（延迟）\n\
    \n延迟的概念非常直观：你希望该节点持续多久。你只需在 `SymbolTable` 的 `result1` 中放入格式为“yyyy-MM-dd HH:mm:ss”的日期时间值。\n\
    \n```java\npublic void delay10Minutes(SymbolTable symbolTable){\n    Date current\
    \ = new Date();\n    Calendar calendar = Calendar.getInstance();\n    calendar.setTime(current);\n\
    \    calendar.set(Calendar.MINUTE, calendar.get(Calendar.MINUTE)+10);\n    SimpleDateFormat\
    \ simpleDateFormat = new SimpleDateFormat(\"yyyy-MM-dd HH:mm:ss\");\n    String\
    \ executeTime = simpleDateFormat.format(calendar.getTime());\n    SymbolData r1\
    \ = symbolTable.add(\"Result1\");\n    r1.addValue(executeTime);\n}\n```\n\n`Delay`\
    \ 节点通过评估日期标签页中的配置支持延迟时间。更多细节请参见 Workpoint 文档。\n\n### Node 节点\n\n我们有一个规则：在完成流程之前必须进行通过或拒绝。在我们的示例中，我们只需要一条路径。所以我们只需要通过状态，但我们将其命名为“Commit”。\n\
    \n"
- fmt: "\n# Error workflow\n\nSometimes, you do programming on workflow and you got\
    \ some errors. You should cancel your task or event. We should not leave unfinished\
    \ flow in system. You can cancel in `View Submitted task`.\n\n| ![](image_rsrc8X1.jpg)\
    \ |\n| Figure 5-73 shows buttons cancel event in view submitted task screen |\n\
    \n## 5.3.3 Category\n\n`Category` is group of object. We can use `Category` to\
    \ filter object. It is very useful to manage our workflow. In this example, you\
    \ will learn:\n\n* How to create category and add object to category.\n* Using\
    \ library and searching object\n* Export workflow.\n\n### Create Category\n\n\
    1. Click on menu `Library` > `Category`.\n\n| ![](image_rsrc8X2.jpg) |\n| Figure\
    \ 5-74 shows menu category in library menu |\n\n2. Click `new` button and put\
    \ name `“BookExample”`.\n\n| ![](image_rsrc8X3.jpg) |\n| Figure 5-75 shows new\
    \ button. |\n\n### Add objects to category\n\nSelect our process and script and\
    \ add category.\n\n* Process\n* Does the right click on canvas\n* Select `properties`\
    \ and select tab: `category`\n* Select `“BookExample”` and click add button\n\
    * `Node` (Activity, Automated, Server Automated, Delay, Transition), you do not\
    \ need to do, it will follow process’s category.\n* Script inside `Node` or transition\n\
    * Edit `script`\n* Select tab `category`\n* Select `“BookExample”` and click add\
    \ button\n\n| ![](image_rsrc8X4.jpg) |\n| Figure 5-76 shows category of script\
    \ |\n\n### Filter by category\n\nAfter we add category, we can do filter in condition\
    \ of transition or agents of node.\n\n| ![](image_rsrc8X5.jpg) |\n| Figure 5-77\
    \ shows category button for filter |\n\n### Export workflow\n\nWe can export workflow\
    \ and import to UAT or production.\n\n* Select menu `File` > `Export`\n* Put file\
    \ name, and click `next`\n* You can use `category` to filter.\n* We usually export\
    \ object we did: `Category`, `Process` and `Script`\n\n| ![](image_rsrc8X6.jpg)\
    \ |\n| Figure 5-78 shows menu export and export screen filter by category |\n\n\
    Please see `appendix A`, we have detail about import workflow.\n\n## 5.4 WorkPoint\
    \ Programming\n\nNow you learned some Workpoint examples. This section has additional\
    \ concepts after you learn some example code.\n\n### 5.4.1 Activity, Server Automated\
    \ and Automated\n\nThere are 3 type of node: `Activity![](image_rsrc8X7.jpg)`,\
    \ `Server Automated![](image_rsrc8V8.jpg)` and `Automated![](image_rsrc8V7.jpg)`.\
    \ We have 3 types of activity, automated and server automated. There are checked\
    \ boxes in `general` tab. The picture below shows relationship between checkbox\
    \ and node type .\n\n| ![](image_rsrc8X8.jpg) |\n| Figure 5-79 below shows relationship\
    \ between checkbox and node type |\n\n### 5.4.2 Script for Server Automated and\
    \ Automated\n\n`Script` for `Server Automated![](image_rsrc8V8.jpg)` and `Automated![](image_rsrc8V7.jpg)`\
    \ are different. If you use node `Automate` implement business logic, you have\
    \ to do additional code to complete activity by code. The picture below shows\
    \ we use `Automate` node `“Check City Value\"` and flow does not move on after\
    \ logic completed.\n\n| ![](image_rsrc8X9.jpg) |\n| Figures 5-80 shows the flow\
    \ stops at automated node and not move on. |\n\nWe can fix the picture above by\
    \ adding code to complete activity.\n\n```\npublic void completeActivity(ClientContext\
    \ cc,ActivityInstData ad,SymbolTable st) throws Exception{\n    short workitem\
    \ = Short.parseShort((String)st.getSymbol(\"WorkItemIteration\").getPrimaryValue());\n\
    \    WorkItemEntry workItemEntry = WorkItemEntry.queryByID(cc, ad.getActivityInstID(),workitem);\n\
    \    short currentState = workItemEntry.getWorkStateID();\n    if (currentState\
    \ == WorkItemConst.WORK_STATE_AVAILABLE) {\n        workItemEntry.changeState(WorkItemConst.WORK_STATE_OPEN);\n\
    \    }\n    workItemEntry.changeState(WorkItemConst.WORK_STATE_COMPLETE);\n}\n\
    ```\n\nNote 3: Using server automated implement business logic. (Recommendation)\n\
    \nThis topic, we suggest to use the server automated. You don’t need to worry\
    \ to complete activity.\n\n### 5.4.3 Agent scripts can be designated Synchronous\
    \ or Asynchronous.\n\nLet understand what is Synchronous or Asynchronous in Workflow:\n\
    \n* `Synchronous Scripts` means resource’s scripts, synchronous agent’s scripts,\
    \ and state rules.\n* `Asynchronous Scripts` mean asynchronous agent’s scripts,\
    \ mail’s scripts, and alert’s scripts.\n\n`Agent scripts` are typically used to\
    \ make changes to the database or invoke an action. `Agent script` can be Synchronous\
    \ or Asynchronous.\n\n| ![](image_rsrc8XA.jpg) |\n| Figure 5-81 shows agent script\
    \ screen |\n\nSynchronous agent scripts are executed in the same transaction as\
    \ the state change. Asynchronous agent scripts are executed outside of the state\
    \ change transaction and therefore are completed independently. So there are the\
    \ things need to know:\n\n* If you use script modify node’s `User Data`, script\
    \ must execute in synchronous.\n* If you want to complete activity, script must\
    \ execute in asynchronous.\n\nNote 4: agent script of server automated should\
    \ designate as synchronous. When you do the business logic, please designate your\
    \ script.\n\n### 5.4.4 Saving Job Objects\n\nIn official document: programming\
    \ guide, there is topic `Saving Objects` in `Workflow API`.\n\nWhat is saving\
    \ object?\n\n`Job` is instance of process. `Saving object` means you want to keep\
    \ some value for sharing between nodes inside. For example\n\n* You have node\
    \ 1 connect to node 2, and node 2 connect to node 3.\n* Node 1 modify value `X\
    \ =1`\n* Node 3 can see value `X`\n\nSo we have to declare variable `X` in user\
    \ data at process. Does the right click on canvas, select tab `user data` and\
    \ put the name. It is same step as when workflow.\n\n| ![](image_rsrc8XB.jpg)\
    \ |\n| Figure 5-82 shows user data tab in process |\n\nThe official document tell\
    \ aware cache when they save `User Data` in asynchronous. It requires special\
    \ code.\n\nAll synchronous scripts must use the `ThisJobData` or `ThisActivityInstData`\
    \ to fetch `User Data`.\n\n| ![](image_rsrc8XC.jpg) |\n| Figure 5-83 Synchronous\
    \ scripts access job object from parameters |\n\nFor read only, you can use `ThisJobData`\
    \ or `ThisActivityInstData`. When you want to save job in Asynchronous scripts\
    \ you must write code as:\n\n```\nvar jobTableId = ThisJobData.getJobID();\nvar\
    \ job = Job.queryByID(ClientContext,jobTableId,true);\njob.setUserData(\"Test\"\
    ,\"Pass\");\njob.save();\n```\n\n### 5.4.5 Search reference\n\nSometimes, you\
    \ cannot delete some object because there are some references. For example, you\
    \ want to delete script, but you get error because of references. You want to\
    \ know which process or jobs use this script. Click menu `library > scripts`,\
    \ and does right click on `script`, and select `search references` or `search\
    \ dialog`. The search dialog gives more option, if you want to search jobs, please\
    \ check option on `jobs` check box in search dialog.\n\n| ![](image_rsrc8XD.jpg)\
    \ |\n| Figure 5-84 shows search references |\n\nNote 5: Delete related jobs before\
    \ delete process.\n\nIf you deleted process before job, you will get complicated\
    \ when you want to delete script. You select script and search references; you\
    \ will see some jobs refer to scripts. You can’t access all relate jobs because\
    \ you already deleted process. You have to open job one by one and delete each\
    \ job.\n\nSo we suggest delete all related jobs before delete process.\n\n## 5.5\
    \ Use cases examples\n\nIn the official CA IdentityMinder document talked about\
    \ use case examples. Please see `Programming Guides › Programming Guide for Java\
    \ › Workflow API › Workflow API Overview › Use Case Examples` for full details\n\
    \n* Determine workflow direction based on a User object attribute\n"
  raw: 'Error workflow


    Sometimes, you do programming on workflow and you got some errors. You should
    cancel your task or event. We should not leave unfinished flow in system. You
    can cancel in View Submitted task.


    | ![](image_rsrc8X1.jpg) |


    | Figure 5-73 shows buttons cancel event in view submitted task screen |


    ### 5.3.3 Category


    ​Category is group of object. We can use Category to filter object. It is very
    useful to manage our workflow. This example, you will learn:


    *   How to create category and add object to category.


    *   Using library and searching object


    *   Export workflow.


    Create Category


    1.  Click on menu Library > Category.


    | ![](image_rsrc8X2.jpg) |


    | Figure 5-74 shows menu category in library menu |


    2.  Click new button and put name “BookExample”


    | ![](image_rsrc8X3.jpg) |


    | Figure 5-75 shows new button. |


    ​Add objects to category


    ​Select our process and script and add category.


    *   Process


    *   Does the right click on canvas


    *   Select properties and select tab: category


    *   Select “BookExample” and click add button


    *   Node (Activity, Automated, Server Automated, Delay, Transition) , you do not
    need to do, it will follow process’s category.


    *   Script inside Node or transition


    *   Edit script


    *   Select tab category


    *   Select “BookExample” and click add button


    | ![](image_rsrc8X4.jpg) |


    | Figure 5-76 shows category of script |


    ​Filter by category


    After we add category, we can do filter in condition of transition or agents of
    node.


    | ![](image_rsrc8X5.jpg) |


    | Figure 5-77 shows category button for filter |


    ​Export workflow


    ​We can export workflow and import to UAT or production.


    *   Select menu File > Export


    *   Put file name, and click next


    *   You can use category to filter.


    *   We usually export object we did: Category, Process and Script


    | ![](image_rsrc8X6.jpg) |


    | Figure 5-78 shows menu export and export screen filter by category |


    ​Please see appendix A, we have detail about import workflow.


    ## 5.4 WorkPoint Programming


    Now you learned some Workpoint examples. This section has additional concepts
    after you learn some example code.


    ### 5.4.1 Activity, Server Automated and Automated


    There are 3 type of node: Activity![](image_rsrc8X7.jpg), Server Automated ![](image_rsrc8V8.jpg)
    and Automated![](image_rsrc8V7.jpg) . We have 3 types of activity, automated and
    server automated. There are checked boxes in general tab. The picture below shows
    relationship between checkbox and node type .


    | ![](image_rsrc8X8.jpg) |


    | Figure 5-79 below shows relationship between checkbox and node type |


    ### 5.4.2 Script for Server Automated and Automated


    Script for Server Automated ![](image_rsrc8V8.jpg) and Automated![](image_rsrc8V7.jpg)
    are different. If you use node Automate implement business logic, you have to
    do additional code to complete activity by code. The picture below shows we use
    Automate node “Check City Value” and flow does not move on after logic completed.


    | ![](image_rsrc8X9.jpg) |


    | Figures 5-80 shows the flow stops at automated node and not move on. |


    ​We can fix the picture above by adding code to complete activity.


    | public void completeActivity(ClientContext cc,ActivityInstData ad,SymbolTable
    st) throws Exception{short workitem = Short.parseShort((String)st.getSymbol("WorkItemIteration").getPrimaryValue());WorkItemEntry
    workItemEntry = WorkItemEntry.queryByID(cc, ad.getActivityInstID(),workitem);short
    currentState = workItemEntry.getWorkStateID();if (currentState == WorkItemConst.WORK_STATE_AVAILABLE)
    {​workItemEntry.changeState(WorkItemConst.WORK_STATE_OPEN);}workItemEntry.changeState(WorkItemConst.WORK_STATE_COMPLETE);​}
    |


    ​Note 3: Using server automated implement business logic. (Recommendation)


    ​This topic, we suggest to use the server automated. You don’t need to worry to
    complete activity.             


    ### 5.4.3 Agent scripts can be designated Synchronous or Asynchronous.


    Let understand what is Synchronous or Asynchronous in Workflow:


    *   Synchronous Scripts means resource’s scripts, synchronous agent’s scripts,
    and state rules.


    *   Asynchronous Scripts mean asynchronous agent’s scripts, mail’s scripts, and
    alert’s scripts.


    Agent scripts are typically used to make changes to the database or invoke an
    action.  Agent script can be Synchronous or Asynchronous.


    | ![](image_rsrc8XA.jpg) |


    | Figure 5-81 shows agent script screen |


    Synchronous agent scripts are executed in the same transaction as the state change.
    Asynchronous agent scripts are executed outside of the state change transaction
    and therefore are completed independently. So there are the things need to know:


    *   If you use script modify node’s User Data, script must execute in synchronous.


    *   If you want to complete activity, script must execute in asynchronous.


    Note 4: agent script of server automated should designate as synchronous.


    When you do the business logic in work flow, please designate your script in synchronous.


    ### 5.4.4 Saving Job Objects


    ​In official document: programming guide for java, there is topic “Saving Job
    Objects” in Workflow API.


    What is saving job object?


    ​Job is instance of process. Saving job object means you want to keep some value
    for sharing between nodes inside this workflow.  For example


    *   You have node 1 connect to node 2, and node 2 connect to node 3.


    *   Node 1 modify value X =1


    *   Node 3 can see value X


    So we have to declare variable X in user data at process/job level.  Does the
    right click on canvas, select tab user data and put the value X as name. It is
    same step as when you specific TASK_LEVEL for workflow.


    | ![](image_rsrc8XB.jpg) |


    | Figure 5-82 shows user data tab in process properties |


    The official document tell develop aware cache when they save Job’s User Data
    in asynchronous. It requires special code.


    Saving job data in Synchronous scripts


    All synchronous scripts must use the ThisJobData or ThisActivityInstData  to fetch
    User Data.


    | ![](image_rsrc8XC.jpg) |


    | Figure 5-83 Synchronous scripts access job object from parameters |


    Saving job data in Asynchronous scripts


    For read only, you can use ThisJobData or ThisActityInstData objects. When you
    want to save job in Asynchronous scripts you must write code as:


    | ​var jobTableId = ThisJobData.getJobID();​var job = Job.queryByID(ClientContext,jobTableId,true);​job.setUserData("Test","Pass");​job.save();
    |


    ### 5.4.5 Search reference


    ​Sometimes, you cannot delete some object because there are some references. For
    example, you want to delete script, but you get error because of references. You
    want to know which process or jobs use this script. Click menu library > scripts,
    and does right click on script, and select search references or search dialog.
    The search dialog gives more option, if you want to search jobs, please check
    option on jobs check box in search dialog.


    | ![](image_rsrc8XD.jpg) |


    | Figure 5-84 shows search references |


    ​Note 5: Delete related jobs before delete process.


    If you deleted process before job, you will get complicated when you want to delete
    script. You select script and search references; you will see some jobs refer
    to scripts. You can’t access all relate jobs because you already deleted process.
    You have to open job one by one and delete each job.


    So we suggest delete all related jobs before delete process.


    ## 5.5 Use cases examples


    In the official CA IdentityMinder document talked about use case examples. Please
    see Programming Guides › Programming Guide for Java › Workflow API › Workflow
    API Overview › Use Case Examples for full details


    *   Determine workflow direction based on a User object attribute'
