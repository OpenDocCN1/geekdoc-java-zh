    );\n```\n\n请想象管理员任务的屏幕。当我们定义管理员任务时：\n\n*   在管理员任务内部，有选项卡（tabs）。\n*   我们的管理员任务有一个\
    \ profile 选项卡。\n*   在选项卡内部，有一个屏幕（screen）。\n*   在屏幕内部，有字段（fields）。\n\n| ![](img/image_rsrc8UJ.jpg)\
    \ |\n| 图 4-28 显示管理员任务配置中的选项卡屏幕 |\n\n在管理员任务内部，有选项卡。我们调用方法 `getTaskTabHandlers()`\
    \ 返回此管理员任务的所有选项卡。\n\n```java\nVector<TabHandler> tabs = blthContext.getTaskTabHandlers();\n\
    for (TabHandler tab : tabs) {\n```\n\n我们的管理员任务中有一个 profile 选项卡，因此我们需要检查 `ProfileTabHandler`\
