  trans: "\n\n# 图 6-7 显示了逻辑属性\n\n逻辑属性值并不直接关联或写入数据存储器。它需要通过逻辑属性处理程序（logical attribute\
    \ handler）进行处理。\n\n## 预定义逻辑属性\n\nCA IdentityMinder 为某些目的预定义了逻辑属性，例如 `passwordConfirm`、`oldPassword`。我们可以使用或自定义它们。更多细节请参阅办公文档。\n\
    \n## 物理属性\n\n物理属性是底层数据存储器（如 `LDAP` 等用户目录）的属性。如果任务屏幕字段配置了物理属性，则在字段中输入的值将写入数据存储器。\n\
    \n### 6.3.1 编程\n\n创建一个扩展 `LogicalAttributeAdapter` 的 `java` 类并重写以下方法：\n\n*   `public\
    \ void toLogical(LogicalAttributeContext apiContext) throws java.lang.Exception`\n\
    \    *   将物理属性的值转换为逻辑属性值。\n*   `public void toPhysical(LogicalAttributeContext\
    \ apiContext) throws java.lang.Exception`\n    *   将逻辑属性的值转换为物理属性值。\n*   `public\
    \ void initializeOptionList(LogicalAttributeContext apiContext) throws java.lang.Exception`\n\
    \    *   如果你想将值以列表的形式渲染，你需要实现此方法并返回一个 `Vector` 作为屏幕上的显示值列表。\n*   `public void\
    \ initialize(LogicalAttributeContext apiContext) throws java.lang.Exception`\n\
    \    *   在创建用户或创建任何对象时，此方法设置属性的初始值。\n\n### 6.3.2 代码示例\n\n我们的示例展示了将城市（物理属性）转换为办公室代码（逻辑属性）。屏幕将显示办公室代码。当用户选择办公室代码时，它将把办公室代码的值转换为城市值。\n\
    \n| ![](img/image_rsrc8XR.jpg) |\n| 图 6-8 显示了更新办公室的用户屏幕 |\n\n#### 代码\n\n1. 编译我们的\
    \ `java` 代码：`com.book.idm.etc.OfficeCodeLogicalAttr`\n2. 将类（包含包文件夹 `com.book.idm.etc`）复制到文件夹\
    \ `<server>\\IdentityMinder.ear\\custom` 中。\n\n#### 配置：管理控制台 (Management Console)\n\
    \n1. 在管理控制台中，点击 `Environments`。\n2. 点击将使用逻辑属性的环境名称。\n3. 点击 `Advanced Settings`。\n\
    4. 点击 `Logical Attribute Handlers`。\n5. 点击 `new` 按钮并输入如下值：\n\n| 字段名称 | 值 | 描述\
    \ |\n| :--- | :--- | :--- |\n| Name | `OfficeCodeLogicalAttr` | 逻辑属性的名称 |\n| Class\
    \ | `com.book.idm.etc.OfficeCodeLogicalAttr` | `java` 类名 |\n| Object Type | `User`\
    \ | 拥有逻辑属性的对象类型 |\n| Logical Attributes | | |\n| Name | `officeCodeList` | 代码中使用的名称。\
    \ |\n| Attribute Name | `\\|officeCodeList\\|` | 在管理员任务屏幕上显示的名称 |\n| Option List\
    \ | Check | 告诉 CA IdentityMinder 该属性是一个列表 |\n| Name | `officeCode` | 代码中使用的名称。\
    \ |\n| Attribute Name | `\\|officeCode\\|` | 在管理员任务屏幕上显示的名称 |\n| Physical Attributes\
    \ | | |\n| Name | `officeCodePhyAttr` | 代码中使用的名称。 |\n| Attribute Name | `l` |\
    \ (小写字母 L) 用户存储中城市属性的名称。 |\n\n| ![](img/image_rsrc8XS.jpg) |\n| 图 6-9 显示了管理控制中的逻辑属性配置\
    \ |\n\n6. 点击 `Restart Environment` 按钮。\n\n#### 配置：Identity Manager 用户控制台 (User\
    \ Console)\n\n1. 以 `administrator` 身份登录 Identity Manager 用户控制台。\n2. 选择标签页 `Roles`\
    \ 和 `Tasks`，并选择菜单 `create admin task`。\n3. 创建管理员任务，输入如下值：\n\n| 字段名称 | 值 | 描述 |\n\
    | :--- | :--- | :--- |\n| Tab: Profile | | |\n| Name | `Update Office` | 管理员任务的名称\
    \ |\n| Tag | `BookBasicUpdateOffice` | 管理员任务的标签名称 |\n| Description | `Example\
    \ for Logical Attribute` | 管理员任务的描述 |\n| Category | `Book Example` | 管理员任务显示的位置\
    \ |\n| Category Order | `11` | |\n| Category 2 | `Task` | |\n| Category 3 | `Basic`\
    \ | |\n| Primary Object | `User` | 我们想更新城市，所以必须选择对象用户（user），并操作修改（modify）。 |\n\
    | Action | `Modify` | |\n| 为了测试，你可以禁用某些值。 | | |\n| * User Synchronization and\
    \ Account Synchronization: off. | | |\n| * Enable Auditing, Enable Workflow, Enable\
    \ Web Services: uncheck | | |\n| Tab: Search | | |\n| Search Screen | `Default\
    \ User Search` | 用于搜索用户的屏幕 |\n\n4. 针对标签页 Tab: Tabs：\n   选择标准标签页控制器。\n   从列表中选择\
