    city attribute has been already change to be “New Town”


    *   Step 4: When modify User event complete, CA IdentityMinder commit the city
    attribute value from task that has been modify by BLTHContext.  


    ​Step 1 – 3 are occurred in synchronous phase. Step 2 and 3 are occurred by business
    logic task handler. The step 4 is asynchronous phase.


    | ![](image_rsrc8UG.jpg) |


    | Figure 4-26 shows sequence of modification |


    ### 4.4.5 Business Logic Task Handler and screen.


    ​This example, we will do programming to get data from admin task’s screen. This
    example shows:


    *   How to get current extension telephone number and display on screen.


    *   Validate user input. The extension telephone number must be present and be
    number only.


    *   Shows how to send error message back to user.


    *   Using session attribute to share the extension telephone number between methods.


    Code


    1.  Compile our java code: com.book.idm.blth. ModifyUserAndScreen


    2.  Copy class (include package folder ” com.book.idm.blth” ) to folder “\IdentityMinder.ear\custom”.


    Configuration


    1.  Log into the Identity Manager User Console as administrator.


    2.  Select tab Roles and Tasks, and select menu modify admin task.


    3.  Search and select our admin task name: Update Location and Ext Number


    4.  Click button “Business Logic Task Handlers”, then icon “pencil”.


    5.  Modify value as below.


    | Field Name | Value | Description |


    | Java Class | com.book.idm.blth.ModifyUserAndScreen | Our java class that we
    put in custom folder |


    How it works


    ​We can execute our code by admin task following these steps:


    1.  Log into the Identity Manager User Console as administrator.


    2.  Select tab: Book Example and select menu: Basic.


    3.  Select Admin Task: “Update Location and Ext Number”.


    4.  Then search and select some users.


    ​handleSetSubject(): display the current telephone number on screen


    ​The method handleSetSubject() is called, when screen initial display. So we implement
    to set the show extension number inside this method.              


    | ![](image_rsrc8UH.jpg) |


    | Figure 4-27 the current value of extension number has been show on screen |


    ​Setting extension number, we have to do 2 things:


    *   Get current telephone number


    *   Set the value of screen logical attribute: |ExtNumber|


    ​Getting the current telephone number is not new, we use the ProviderAccessor
    get the value.


    | String userid = blthContext.getUser().getUniqueName();User user = blthContext.getUserProvider().findUser(blthContext.getTSContext(),
    userid, null);String telephoneNumber = (String)user.getAttribute("telephoneNumber");
    |


    ​Please imagine the screen of admin task. When we define the admin task:


    *   Inside of admin task, we have tabs.


    *   In our admin task has one profile tab.


    *   Inside of tab, we have a screen. 


    *   Inside of screen, we have fields.


    | ![](image_rsrc8UJ.jpg) |


    | Figure 4-28 shows tab screen in admin task configuration |


    ​Inside of admin task, we have tabs. We call method getTaskTabHandlers() return
    all tabs of this admin task.


    | Vector<TabHandler> tabs = blthContext.getTaskTabHandlers();for (TabHandler tab
    : tabs) { |


    ​In our admin task has one profile tab, so we have to check type of ProfileTabHandler. 
    If you have many profile tabs, you need condition to check screen’s tag name.
    We check screen’s tag name “BookBasicUpdateLocationAndExtNo”. (In our example
    has only one tab, you can skip this condition)


    | // Check tab typeif (tab instanceof ProfileTabHandler) {​ProfileTabHandler profileTab
    = (ProfileTabHandler) tab;​String screenName = profileTab.getScreenHandler().getScreen().getTag();​if(screenName.equals("BookBasicUpdateLocationAndExtNo")){
    |


    ​We can set the value on screen by using method updateRawData().


    | ​HashMap<String, String> data = new HashMap<String, String>();​data.put("&#124;ExtNumber&#124;",
    telephoneNumber.substring(telephoneNumber.indexOf("x") + 1));​...​profileTab.updateRawData(data);
    |


    ​Inside of screen, we have fields. We create new HashMap object. We put key and
    value pair, key’s name |ExtNumber| came from the screen definition in admin task.
    If you want to set city attribute, you can use attribute name same as user store. 
    The city’s attribute uses “l” as key.


    ​handleValidation (): validate user input


    ​After user submit the admin task, if extension number is blank or put some characters,
    the error will be display.


    | ![](image_rsrc8UK.jpg) |


    | Figure 4-29 shows error messages |


    ​We have to override method handleValidation (). We can get any fields from screen
    by method getRawData(). If you are not sure about fields’ name, you can print
    by method getRawData(). It is a HashMap object that key represent by field’s name.


    | ​String extNumber = (String) profileTab.getRawData().get("&#124;ExtNumber&#124;");
    |


    You can get the values from the screen and perform the validation logic as code
    below.


    | ​String extNumber = (String) profileTab.getRawData().get("&#124;ExtNumber&#124;");if
    (extNumber == null) {​...} else {try {int number = new Integer(extNumber);​  }
    catch (NumberFormatException ne) {...}} |


    Shows the error message


    ​We show error by throwing IMSException object. You can put message display on
    screen by method addUserMessage().


    | ​IMSException imsEx = new IMSException();​imsEx.addUserMessage("Telephone number
    can''t be empty");​throw imsEx; |


    Session attributes: pass the value between methods


    ​We have already validated telephone number and we can pass the valid telephone
    value to method handleSubmission() by session. BLTHContext provide session attribute
    for sharing data between method and other CA IdentityMinder APIs.


    | public void handleValidation(BLTHContext blthContext) throws Exception {​//
    Setting value to session​blthContext.setSessionAttribute("extNumber", number);​…}public
    void handleSubmission(BLTHContext blthContext) throws Exception {​// Getting value
    from session​int extNumber = (Integer) blthContext.getSessionAttribute("extNumber");}
    |


    ## 4.5 Use cases examples


    ​The official CA IdenityMinder document gave use cases examples but not provide
    detail of programming. This section will give you some idea of those examples.


    Please see full description from Programming Guides › Programming Guide for Java
    › Business Logic Task Handler API › Business Logic Task Handler API Overview ›
    Use Case Examples.


    Check whether a group membership limit is reached


    | ​When an administrator attempts to add a member to a group by submitting a Modify
    Group task for execution, access the Group managed object to determine the number
    of current members. If the group has the maximum number of members, throw an exception.
    |


    The modify group task, we can use BLTHContext,getGroup(). We call method getMembers()
    return all members inside group. We can check size.  


    | Vector users = blthContext.getGroup().getMembers(ObjectType.USER, null);System.out.println(“user
    size : “+users.size()); |


    ​Please note, the Group class has method getUsers() and getMembers():


    *   Method getUsers() return only user object


    *   Method getMembers() can return any object depending parameters: ObjectType
    . Please see java document: ObjectType for details.


    Verify the job title of a new administrator


    | ​When a user submits a Create Administrator task for execution, access a third-party
    database to determine the job title of the administrator being created. If this
    particular person does not have the job title Supervisor (the only job title authorized
    to be an administrator), throw an exception. |


    We can write java code access the database in handleSubmission().  You pass administrator
    id as argument and get job title.


    | ​//Get administrator who is executing the task​User admin = blthContext.getAdministrator();​//Call
    the third party to get title​String jobTitle = callDB(admin.getFriendlyName());
    |


