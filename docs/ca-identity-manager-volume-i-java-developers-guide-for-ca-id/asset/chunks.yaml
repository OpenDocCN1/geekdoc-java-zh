  trans: "\n\n`CA IdentityMinder` 附带了一个预定义的业务逻辑任务处理器，它会在对象创建之前检查对象可能的重复性。例如，新创建的角色名称必须是唯一的。当角色准备被创建时，预定义的业务逻辑任务处理器会验证新角色的名称是否已经存在。如果名称存在，处理器将抛出一个异常，指示角色名称必须唯一，管理员有机会更改名称并重新提交任务。\n\
    \n我们可以使用 `ProviderAccessor` 搜索角色名称。\n\n```java\nboolean isUnique = false;\ntry{\n\
    \    //Search by friendlyName\n    AccessRole role = blthContext.getAccessRoleProvider().findAccessRole(roleName);\n\
    }catch(NoSuchObjectException e){\n    isUnique = true;\n}\nif(!isUnique){\n  \
    \  IMSException imsEx = new IMSException();\n    imsEx.addUserMessage(“The role\
    \ name must be unique”);\n    throw imsEx;\n}\n```\n\n## 在最大失败登录尝试后禁用用户账户\n\n\
    当用户连续登录失败三次后，账户将在数据存储中被立即禁用。由于账户是直接在数据存储中更新的，而不是在任务会话中，`CA IdentityMinder` 不会为此操作生成事件，任何可能与此操作相关的工作流审批、审计和安全检查都将被跳过。在最后登录尝试后，自定义消息会提示用户该账户已禁用。\n\
    \n用例提到用户账户直接在数据存储中进行更新（禁用）。此用例意味着使用 `ProviderAccessor` 直接更新用户属性。（有关如何直接更新账户属性，请参阅第第二卷）\n\
    \n## 在自注册期间将用户分配到组\n\n以“福利管理员”（Benefits Administrator）头衔进行自注册的用户将被分配到 HR 组。此更新是在任务会话中完成，通过调用\
    \ `RelationshipTabHandler` 中的 `assignResources()` 实现。此更新会触发 `AddToGroupEvent`\
    \ 事件，允许组分配受到审计和工作流审批的影响。\n\n我们使用业务逻辑任务处理器通过如下代码修改选项页中的值。\n\n```java\nfor (TabHandler\
    \ tab : tabs) {\n    RelationshipTabHandler rTab = (RelationshipTabHandler)tab;\n\
    \    rTab.assignResources(groups);\n}\n```\n\n## 为新用户分配“经理”（manager）属性\n\n管理员想在屏幕上显示配置界面之前设置“经理”的值。可以编写一个业务逻辑任务处理器，实现\
    \ `handleSetSubject()` 方法进行初始化。该方法会将管理员的名称分配给经理名称属性。如果管理员名称不可用，则抛出异常。\n\n我们在 `handleSetSubject`\
    \ 方法中编写代码来初始化经理属性。\n\n```java\npublic void handleSetSubject(BLTHContext blthContext)\
    \ throws Exception {\n    String managerId = blthContext.getAdminFriendlyName();\n\
    \    if(managerId == null){\n        throw new IMSException(“administrator’s name\
    \ is not available”);\n    }\n    HashMap<String, String> screenFields = new HashMap<String,\
    \ String>();\n    screenFields.put(“managerId”, managerId);\n    tab.updateRawData(screenFields);\n\
    }\n```\n\n## 4.6 结论\n\n在本章中，我们学习了业务逻辑任务处理器 API 概念的基本编程。我们可以做如下总结：\n\n### 实现业务逻辑任务处理器\n\
    \n- 有 2 个步骤：编码和配置。\n- 对于编码，你必须编写扩展 `BLTHAdapter` 的 Java 类并根据需要重写方法。\n    - `handleStart()`：当用户选择管理员任务时调用。\n\
    \    - `handleSetSubject()`：用于在显示之前设置字段。\n    - `handleValidation()`：用于验证。\n \
    \   - `handleSubmission()`：在用户提交、验证后执行。\n    - 编译并复制到文件夹 `\\IdentityMinder.ear\\\
    custom`。\n- BLTH 配置有 2 个级别：全局和特定任务级别。\n\n### 访问托管对象\n\n- 有 2 种方式：通过 `ProviderAccessor`\
    \ 和 `BLTHConext`（任务会话）。\n- 对于 `BLTH`，我们必须考虑：\n    - 主对象是什么？\n    - 修改的属性是否在管理员任务中定义？\n\
    \n### 编程笔记\n\n- 代码中的用户属性名称是用户存储中的物理名称。\n- 你可以使用 `getRawData()` 和 `setRawData()`\
    \ 访问屏幕上的值。\n- 可以通过 `IMSException` 对象在屏幕上显示消息。\n- 可以使用 session 保持值并在方法之间共享。\n\n\
    业务逻辑任务处理器 API 在同步阶段执行业务逻辑。在异步阶段，我们使用工作流来执行业务逻辑。下一章是工作流。\n\n# 第 5 章 工作流\n\n`CA\
    \ IdentityMinder` 官方文档关于工作流的细节并不多。我们从前面的章节中学了一些基本概念：\n\n- 如果需求需要审批者，则你需要工作流。\n\
    - 工作流在异步阶段运行。\n- 工作流可以持续很长时间。它可能需要一小时或一个月的时间。\n- 业务逻辑任务处理器在工作流开始之前完成。\n\n在本章中，你将学习工作流\
    \ API 以及如何创建自定义工作流。\n\n## 5.1 工作流概念\n\n你必须在管理控制台（Management Console）中启用工作流。默认情况下，工作流是禁用的。\n\
    \n**配置：管理控制台**\n\n1. 在管理控制台中选择环境（Environment）。\n2. 转到 Advanced Settings，Workflow。\n\
    3. 勾选 Enabled 复选框，并点击 Save。\n4. 重启应用程序服务器。\n\n![](img/image_rsrc8UM.jpg)\n\n图\
    \ 5-1 显示了管理控制台中的工作流属性\n\n在事件映射表中，事件与全局工作流过程之间有一些默认映射。这意味着当表中的任何事件启动时，都将执行工作流。我们不修改任何值。\n\
    \n### 5.1.1 默认工作流功能\n\n在本节中，我们将学习 `CA IdentityMinder` 中的默认工作流功能。我们涵盖以下主题：\n\n\
    - 工作流级别：工作流可以运行管理员任务级别。\n- 选择工作流：哪些工作流可以执行。\n- 策略基础：它是启动工作流的条件。\n- 审批者的任务和屏幕。\n\
    - 审批者：谁是审批者。\n- 预期结果：最终结果：通过或拒绝。\n\n#### 工作流级别\n\n工作流可以在管理员任务和/或事件级别运行。应该是什么级别？这取决于需求。例如，我们有一个管理员任务“修改用户”，我们的管理员任务有\
    \ 2 个选项页：配置选项页（Profile Tab）和访问角色选项页（Access Role Tab）。因此，从此管理员任务生成的事件分为两组：\n\n\
    - 第一组事件来自配置选项页；当用户属性被修改时，会生成事件。\n- 第二组事件来自访问角色选项页；当我们添加或删除访问角色时，会生成事件。\n\n![](img/image_rsrc8UN.jpg)\n\
    \n图 5-2 显示了示例管理员任务的所有事件。\n\n我们有 2 个请求：从配置选项页修改用户属性的请求，另一个从访问角色选项页添加/删除角色的请求。\n\
    \n- **场景 1**：所有请求（修改属性和添加角色）都只需要一个工作流进行审批，我们将工作流指定为管理员任务级别。\n- **场景 2**：仅修改用户属性请求（配置选项页）需要审批者，我们将工作流指定为事件级别：`ModifyUserEvent`。\n\
    - **场景 3**：仅添加角色请求（访问角色选项页）需要审批者，我们将工作流指定为事件级别：`AssignAccessRoleEvent`。\n- **场景\
    \ 4**：任何请求（修改属性和添加角色）都需要经理作为第一个审批者。\n    - 修改属性请求需要 HR 经理作为第二个审批者。\n    - 添加角色请求需要\
    \ IT 经理作为第二个审批者。\n\n我们将第一个审批工作流指定为管理员任务级别，并将 HR 和 IT 工作流指定为事件级别：`ModifyUserEvent`\
    \ 和 `AssignAccessRoleEvent`。此案例如下所示。\n\n![](img/image_rsrc8UP.jpg)\n\n图 5-3 显示了场景\
    \ 4 的工作流。\n\n管理员任务级别\n\n"
- fmt: '

    The workflow at admin task requires to set an attribute `TASK_LEVEL=true`. You
    will see it in the example code. Enable work flow at admin task level, you have
    to configure:


    * On the `Profile` tab, check `Enable Workflow` checkbox.

    * On the `Profile` tab, click the pencil icon at workflow process label. The workflow
    configuration screen display.


    | ![](image_rsrc8UR.jpg) |

    | Figure 5-4 shows how to configure workflow at admin task level |


    ## Event Level


    Enable work flow at event level, you have to configure:


    * On the `Profile` tab, verify that `Enable Workflow` is checked.

    * On the `Events` tab, click pencil icon on events. The workflow mapping screen
    display, and select a process template.


    | ![](image_rsrc8US.jpg) |

    | Figure 5-5 shows how to configure workflow at event level |


    ## Select Workflows


    You can select workflow from drop down. CA IdentityMinder provides three default
    process templates:


    * `SingleStepApprovalProcess` for one primary approver and default participant
    when primary approver is not found.

    * `TwoStageApprovalProcess` for two primary approvers and default participant
    when primary approver is not found.

    * `EscalationApprovalProcess` for one primary approver and default participant
    when primary approver is not found. This workflow primary approver can escalate
    to another approver.


    You can create more custom workflow, so we will go details later.


    ## Policy Base


    The policy-based is condition before start workflow. The picture below show Policy
    Base: if user’s city is New York, it requires workflow: `TwoStageApprovalProcess`.


    | ![](image_rsrc8UT.jpg) |

    | Figure 5-6 shows screen of workflow’s policy base |


    If request is not met any condition, event or admin task will execute without
    workflow.


    ## Approver’s Task


    If workflow requires approver, we need screen for approver to perform action approve
    or reject. The picture below show screen to select Approval Task:


    | ![](image_rsrc8UU.jpg) |

    | Figure 5-7 shows configuration for approver’s screen. |


    The picture below shows the example approver’s screen. The icon ![](image_rsrc8UV.jpg)
    means that value has been changed. You can click to rollback the value.


    | ![](image_rsrc8UW.jpg) |

    | Figure 5-8 shows screen for approver |


    You can create new approver task by create new admin task. You have to choose
    action as “Approve Event” or “Approve Task”.


    ## Approver


    If workflow requires approver, we have to specific who is approver. We can select
    type of approver form drop down `Participant Resolver`. It provides condition
    to get approver.


    | ![](image_rsrc8UX.jpg) |

    | Figure 5-9 shows drop down: `Participant Resolver` |


    If your requirement getting approver is complicated, you can do programming by
