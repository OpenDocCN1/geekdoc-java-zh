    \ environment. CA IdentityMinder environment properties are passed to the `init()`\
    \ method of the `EventListenerAdapter`.\n\nThis use case, you just override method\
    \ `after()` and do programming to add user to Microsoft exchange. For `init()`\
    \ method, you can get in the user-defined properties. Please see the example code\
