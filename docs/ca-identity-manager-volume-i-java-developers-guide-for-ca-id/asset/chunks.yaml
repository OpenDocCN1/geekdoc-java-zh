- fmt: "\n`WorkflowCallbackHelper.generateWorkflowContext` require `2` parameters:\
    \ `ims-id` and `ime-id`. These ids will be generated when job create. You can\
    \ search the job (instance of process) and do the right click on canvas and see\
    \ the user data tab of job. Our code get current job by method `queryByID()`,\
    \ then get `ims-id` and `ime-id` by method `getUserData()`.\n\nBy the way, The\
    \ code gets `WorkflowContext` is pattern, you just copy and reuse.\n\n| ![](image_rsrc8WU.jpg)\
    \ |\n\nFigure 5-66 shows `ims-id` and `ime-id` in user data tab of job.\n\nThe\
    \ next line shows getting `User` object from workflow context. We create the utility\
    \ method `getUser()` that return user object.\n\n```\nuser = WorkpointHelper.getUser(workflowContext);\n\
    ```\n\nWe use method `getSubject()` returns the primary object of admin task.\
    \ Our admin task has `User` as primary object. If you try to call this method\
    \ in admin task that primary object is not user, you will get error.\n\n```java\n\
    public static User getUser(WorkflowContext workflowContext) throws Exception{\n\
    \    ManagedObject managedObject = workflowContext.getSubject();\n    if(managedObject\
    \ instanceof User){\n        return (User)managedObject;\n    }else{\n       \
    \ throw new IllegalArgumentException(\"Managed Object is not User\");\n    }\n\
    }\n```\n\n`WorkflowContext` extends `IMContext`, `IMPersistentContext`, `ProviderAccessor`,\
    \ `ServiceProvider`, `TaskInfo`. Please see official java document for more details.\
    \ It is almost same as `BLTHContext` but there is one difference is `WorkflowContext`\
    \ extends `EventContext`.\n\nPlease note workflow has `2` levels: admin task level\
    \ and event level. If your workflow run at admin task level and you try to call\
    \ any methods from parent class `EventContext`, you will get unexpected results.\n\
    \nWe have another method `getUser(EventContext context)`. You have to make sure\
    \ your workflow runs at user event. The code below shows how to get user object\
    \ from event.\n\n```java\nIMEvent evt= workflowContext.getEvent();\nUser user\
    \ = ((UserEvent)evt).getUser();\n```\n\nThe our method `getUser()` in `WorkpointHelper.java`\
    \ can be reuse in your project. We have additional note for workflow programming.\n\
    \n**Note 1: `WorkflowContext`, calling method from the parent class (`EventContext`)\
    \ properly.**\n\n* If work flow run at admin task level, does not call methods\
    \ from parent: `EventContext`. \n* Make sure you do the right casting. For example:\n\
    \    * Workflow attached with event `ModifyUserEvent`, you can cast object by\
    \ `UserEvent` (`ModifyUserEvent` is sub class of `UserEvent`)\n\n```java\nUser\
    \ user = ((UserEvent)evt).getUser();\n```\n* Workflow attached to event: `AddToGroupEvent`,\
    \ you can cast by `GroupEvent` (`AddToGroupEvent` is sub lcass of `GroupEvent`)\n\
    ```java\nGroup group = ((GroupEvent)evt).getGroup();\n```\n\nIt is same as `BLTHContext`,\
    \ when you use method `getSubject()`, please check what the primary object of\
    \ admin task. \n\nThe next line of our code, we print value. It is demonstrate\
    \ how to access new value and old value.\n\n```java\nSystem.out.println(\"City\
    \ : New Value =\"+user.getAttribute(\"l\"));\nSystem.out.println(\"City : Old\
    \ Value =\"+user.getLastCommittedAttribute(\"l\"));\n```\n\nThe next line of code\
    \ shows how to set value in user data tab. In user data tab, we add key/value\
    \ pairs (city=none). This code will modify value to be new user’s city attribute.\n\
    \n```java\n//Put new value to User Data\nthisactivityInstData.setUserData(\"city\"\
    ,user.getAttribute(\"l\").toLowerCase());\n```\n\n`Transition` uses city in User\
    \ Data to determine path. If there are exception occurs (default value is “none”),\
    \ it will go to path “City != New York”. So you should aware exception inside\
    \ workflow.\n\n| ![](image_rsrc8WV.jpg) |\n\nFigure 5-67 shows relationship of\
    \ user data and transition \n\n### Transition\n\n`Transition` is connection between\
    \ nodes. You can edit condition in transition by clicking pencil icon in condition\
    \ tab.\n\n| ![](image_rsrc8WW.jpg) |\n\nFigure 5-68 shows icon pencils for editing\
    \ condition  \n\nIn our example, we use condition wizard. In condition tab, there\
    \ are many ways to create condition. You can do programming also (but not recommend)\n\
    \nYou cannot edit condition after submit but you can change statement type or\
    \ delete this script and create new one. (Some cases, you cannot delete because\
    \ there are some references, I suggest to change name if you don’t want to delete\
    \ references)\n\n| ![](image_rsrc8WX.jpg) |\n\nFigure 5-69 shows listing of statement\
    \ type in transition \n\n#### Transition’s condition with java code\n\nYou can\
    \ use java code in transition; you need to set final result TRUE or FALSE into\
    \ Symbol table. `Transition` will reference value of “Result1” in `SymbolTable`\
    \ to determine path. For example, `Transition` “City == New York”, we can write\
    \ as code below:\n\n```java\nboolean result = false;\nif(city.equalsIgnoreCase(\"\
    new york\")){\n    result = true;\n} \nsymbolTable.add(\"Result1\").setValue(0,result);\n\
    ```\n\nFor more details about `SymbolTable` class, please see Workpoint help document.\n\
    \nWe have to get city value from User Data of node “Check City Value”. The `transition`\
    \ is connection between “source node” and “destination node”.\n\n| ![](image_rsrc8WY.jpg)\
    \ |\n\nFigure 5-70 shows source and destination of transition \n\nThere are `2`\
    \ ways to access city value from user data tab of source node.\n\n**The first\
    \ way: passing parameters.** You have to put `SourceActivity.UD.city`. `SourceActivity`\
    \ means source node, `UD` means User Data and you have to put \n\n| ![](image_rsrc8WZ.jpg)\
    \ |\n\nFigure 5-71 shows `SourceActivity.UD.city` in parameters \n\nFor programming,\
    \ you just declare `String`\n\n```java\npublic void isCityEqualNewYork(String\
    \ city, SymbolTable symbolTable, JobData thisJobData, JobTranData jobTransData){\n\
    \    // Logic to check and set Result1 in symbolTable based on city\n    System.out.println(\"\
    Get city by SourceActivity.city :\"+city);\n}\n```\n\n**The second way, look up\
    \ by source node.** This way you need `2` paramters: `JobData` and `JobTranData`.\n\
    \n| ![](image_rsrc8X0.jpg) |\n\nFigure 5-72 shows `JobData` and `JobTranData`\
    \ in parameters \n\n`ThisJobData` means instance of process. `ThisJobTransitionData`\
    \ means instance of this transition. The code below shows how to access user data\
    \ from source node.\n\n```java\nID sourceNodeID = jobTransData.getSourceNodeID();\n\
    ActivityInstData sourceActivity = thisJobData.getActivityByNodeID(sourceNodeID);\n\
    String cityUD = sourceActivity.getUserData(\"city\").getVariableValue();\nSystem.out.println(\"\
    Get city by sourceNodeID :\"+cityUD);\n```\n\n**Note 2: Keep transition’s condition\
    \ simple**\n\nMy suggesting is please keep transition condition simple. You should\
    \ use condition wizard. Avoid any complicated logic in transition. For example,\
    \ have `2` transitions: “City == New York” and “City != New York”. If you do programming\
    \ to calculate inside transition “City == New York”, you have to do programming\
    \ in another transition also. It means you do twice.\n\nThe suggestion, please\
    \ do logic or calculation in source node and keep the plain result in user data.\
    \ The `transition` just use result to determine paths. It is easier to maintenance\
    \ logic. \n\n### Delay\n\nThe concept of delay is straightforward: you want this\
    \ node hold until when. You just put the value date time in format “yyyy-MM-dd\
    \ HH:mm:ss” in `result1` of `SymbolTable`.\n\n```java\npublic void delay10Minutes(SymbolTable\
    \ symbolTable){\n    Date current = new Date();\n    Calendar calendar = Calendar.getInstance();\n\
    \    calendar.setTime(current);\n    calendar.set(Calendar.MINUTE, calendar.get(Calendar.MINUTE)+10);\n\
    \    SimpleDateFormat simpleDateFormat = new SimpleDateFormat(\"yyyy-MM-dd HH:mm:ss\"\
    );\n    String executeTime = simpleDateFormat.format(calendar.getTime());\n  \
    \  SymbolData r1 = symbolTable.add(\"Result1\");\n    r1.addValue(executeTime);\n\
    }\n```\n\n`Delay` node support delay time by configuration in evaluation date\
    \ tab. Please see Workpoint document for more details.\n\n### Node Commit\n\n\
    We have the rule; we must do approve or reject before finish the workflow. In\
    \ this example we require only one path. So we just want only approve status but\
    \ we use name as “Commit”.\n"
