    \n#### 工作原理\n\n执行管理员任务：Update office。搜索用户，检查属性。\n\n方法：toLogical()\n\n此方法将物理属性的值转换为逻辑属性。该代码包含三个步骤：\n\
    *   步骤 1：从物理属性获取值。\n*   步骤 2：映射，从物理属性转换为逻辑属性。你可能有其他转换方式。我们的代码使用映射进行转换。\n*   步骤\
    \ 3：将值设置逻辑属性。\n\n```java\nprivate String ATTR_REF_PHY = \"officeCodePhyAttr\"\
