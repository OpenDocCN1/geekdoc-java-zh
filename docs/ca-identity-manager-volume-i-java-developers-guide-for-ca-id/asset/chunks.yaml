  trans: "\n\n为了测试，你可以禁用某些值。\n\n* 用户同步和账户同步：关闭。\n* 启用审计、启用工作流、启用 Web 服务：取消勾选\n\n###\
    \ 标签页：搜索\n\n| 搜索界面 | 默认用户搜索 | 搜索用户的界面 |\n| :--- | :--- | :--- |\n| | | |\n\n###\
    \ 4. 关于标签页：标签 (Tabs)\n\n选择标准标签页控制器。\n从列表中选择 `Profile`(`UserProfile`)，并点击符号 `(+)`。\n\
    选择屏幕文本字段处的浏览按钮。\n点击 `new` 按钮创建新界面，并选择一个标准配置界面界面。\n输入值：\n\n* 名称：`Update Employee\
    \ Number`\n* 标签：`BookBasicUpdateEmployeeNumber`\n    * 添加属性：`Employee Number`\n\
    \    * 属性名称：`Employee Number`\n    * 样式：`Text`\n    * 名称：`Employee Number`\n \
    \   * 校验 Java 类：`com.book.idm.etc.EmployeeNumberTaskValidator`\n* 点击 `apply` 按钮完成。\n\
    * 点击 `ok`\n\n![](img/image_rsrc8XY.jpg)\n\n图 6-15 显示了工号属性的配置\n\n### 5. 提交完成任务创建。\n\
    \n#### 将任务添加到管理员角色\n\n1. 选择标签页：`Roles and Tasks`，并选择菜单 `modify admin role`。\n\
    2. 选择角色 `system manager`。\n    * 选择标签页：`task`\n    * 按分类筛选：`Book Example`\n  \
    \  * 选择添加任务：`Update Employee Number`\n3. 点击 `submit` 完成管理员角色的修改。\n\n#### 工作原理\n\
    \n执行管理员任务：`Update employee number`。\n\n1. 以管理员身份登录身份管理器用户控制台（User Console）。\n\
    2. 选择标签页：`Book Example`，并选择 `update employee number`。\n3. 搜索一个用户，屏幕将显示工号作为文本字段。\n\
    4. 修改工号属性，并点击 `submit`。\n\n#### 方法 `validate()`\n\n错误有 2 种情况：\n\n* 输入 5 位数字工号。\n\
    \n![](img/image_rsrc8XZ.jpg)\n\n图 6-16 显示了通过返回值产生的错误\n\n* 输入任意字符。\n\n![](img/image_rsrc8Y0.jpg)\n\
    \n图 6-17 显示了通过异常产生的错误\n\n有 2 种返回消息的方法，你可以选择其中一种。\n\n* 返回 `false` 并通过 `errorMsg.reference`\
    \ 设置消息。\n\n```java\nif(attrValue.trim().length()>4){\n    errorMsg.reference =\
    \ \"Employeer Number can not more than 4 digits\";\n    return false;\n}\n```\n\
    \n* 抛出异常并将消息作为参数。\n\n```java\ntry{\n    ...\n    int employeeNo = new Integer(attrValue);\n\
    \    ...\n}catch(Exception e){\n    throw new AttributeValidationException(\"\
    Employeer Number:invalid format\");\n}\n```\n\n尝试输入一个数字，例如 `1`，并提交。登录用户库，工号将显示为\
    \ `0001`。我们可以通过 `changedValue.reference` 参数修改值。\n\n```java\nint employeeNo = new\
    \ Integer(attrValue);\nDecimalFormat format = new DecimalFormat(\"0000\");\nchangedValue.reference\
    \ = format.format(employeeNo);\n```\n\n任务级校验提供了 `BLTHContext` 作为参数。你可以使用 `BLTHContext`\
    \ 从受管理对象搜索某些属性，例如你必须检查新值必须是唯一的。\n\n### 6.4.3 代码示例：目录级校验\n\n此示例将使用与任务级校验相同的需求。请从管理员任务\
    \ `update employee number` 中禁用任务级校验。\n\n* 搜索管理员任务：`update employee number`\n*\
    \ 转到标签页：`tabs` 并修改界面：`Update Employee Number`。\n* 校验 Java 类的值：`com.book.idm.etc.EmployeeNumberTaskValidator`。\n\
    \n#### 代码\n\n1. 编译我们的 Java 代码：`com.book.idm.etc.EmployeeNumberDirValidator`\n\
    2. 将类（包括包文件夹 `com.book.idm.etc`）复制到文件夹 `\\IdentityMinder.ear\\custom`。\n\n####\
    \ 配置：管理控制台\n\n1. 在管理控制台中，点击 `Directory`。\n2. 点击用户库目录名称。\n3. 点击页面底部的 `export` 按钮。你将获得一个\
    \ `xml` 文件。\n4. 使用文本编辑器打开 `xml` 文件。\n5. 你必须修改 2 个地方：\n    * 在元素 `<ImsManagedObjectAttrValidation>`\
    \ 下添加校验规则。请查阅官方文档中的 xml schema。\n\n```xml\n<ValidationRule name=\"Employee Number\
    \ pattern\" description=\"Validates employee number\" messageid=\"4002\"><Java\
    \ class=\"com.book.idm.etc.EmployeeNumberDirValidator\"/></ValidationRule>\n<ValidationRuleSet\
    \ name=\"Employee Number format\" description=\"validate employee number format\"\
    ><ValidationRule name=\"Employee Number pattern\"/></ValidationRuleSet>\n```\n\
    \n    * 为 `employeeNumber` 属性添加 `validationruleset` =`Employee Number format\"\
    `。\n\n```xml\n<ImsManagedObjectAttr physicalname=\"employeeNumber\" description=\"\
    Employee Number\" displayname=\"Employee Number\" valuetype=\"String\" maxlength=\"\
    0\" validationruleset=\"Employee Number format\"/>\n```\n\n6. 返回管理控制台，选择我们使用的用户库目录。\n\
    7. 点击 `update` 按钮并选择我们的 `xml` 文件。点击 `next` 和 `finish` 按钮。屏幕将在控制台中显示消息，点击 `continue`\
    \ 并重启环境。\n\n#### 工作原理\n\n执行管理员任务：`Update employee number`。\n\n4. 以管理员身份登录身份管理器用户控制台。\n\
    5. 选择标签页：`Book Example`，并选择 `update employee number`。\n6. 搜索一个用户，屏幕将显示工号作为文本字段。\n\
    7. 修改工号属性，并点击 `submit`。\n\n#### 方法 `validate()`\n\n返回消息有 2 种方法，你可以选择其中一种。\n\n\
    * 返回 `false` 并通过 `errorMsg.reference` 设置消息。\n\n```xml\n<ValidationRule name=\"\
    Employee Number pattern\" description=\"Validates employee number\" messageid=\"\
    4002\"><Java class=\"com.book.idm.etc.EmployeeNumberDirValidator\"/></ValidationRule>\n\
    <ValidationRuleSet name=\"Employee Number format\" description=\"validate employee\
    \ number format\"><ValidationRule name=\"Employee Number pattern\"/></ValidationRuleSet>\n\
    ```\n\n    * 为 `employeeNumber` 属性添加 `validationruleset` =`Employee Number format\"\
    `。\n\n```xml\n<ImsManagedObjectAttr physicalname=\"employeeNumber\" description=\"\
    Employee Number\" displayname=\"Employee Number\" valuetype=\"String\" maxlength=\"\
    0\" validationruleset=\"Employee Number format\"/>\n```\n\n* 抛出异常并将消息作为参数。\n\n\
    ```java\ntry{\n    ...\n    int employeeNo = new Integer(attrValue);\n    ...\n\
    }catch(Exception e){\n    throw new AttributeValidationException(\"Employeer Number:invalid\
    \ format\");\n}\n```\n\n![](img/image_rsrc8Y1.jpg)\n\n图 6-18 显示了来自 `IMSException.properties`\
    \ 的消息 ID。\n\n#### 校验集\n\n在管理控制台中点击用户库目录。向下滚动直到校验集。点击内部链接，你将会看到详情。\n\n![](img/image_rsrc8Y2.jpg)\n\
    \n图 6-19 显示了控制台中的校验集\n\n测试后禁用目录级校验。我们将在第二部分中使用工号。\n\n### 6.5 电子邮件通知\n\n部分是一个特殊主题。它用于下一个\
    \ API：`Notification Rule`。CA IdentityMinder 官方文档在管理指南中有电子邮件通知，而不是在编程指南。\n\n####\
    \ 配置 SMTP\n\n在启动电子邮件通知之前，你需要检查 SMTP 配置。在处理电子邮件通知之前有 2 个需要检查的项目。第一个是 SMTP 配置，即\
    \ SMTP 服务器。\n\n* Jboss：检查 `jboss_home\\server\\default\\deploy\\mail-service.xml`\n\
    * WebLogic：检查 JNDI 名称为 `nete/Mail` 的会话\n* WebSphere：检查名为 `mailMail` 的会话对象\n\n\
    请查看官方文档管理指南 > 电子邮件通知 > 配置 SMTP。\n\n第二个是 `iam_im.ear\\config\\com\\netegrity\\\
    config` 文件夹下的 `email.properties` 文件。\n\n### 6.5.1 如何实现电子邮件通知\n\n有 2+1 种实现电子邮件通知的方法。官方文档介绍了\
    \ 2 种发送电子邮件的方法。本书提供了另一种发送方法。\n\n1. 电子邮件通知策略。\n    * 创建电子邮件通知不需要代码。\n    * 电子邮件通知策略是\
    \ Policy Xpress 策略。你可以创建触发策略运行的条件。\n    * 它在 `System` 标签页下，选择 `Email` 菜单。\n\n\
    2. 电子邮件模板\n    * 需要代码（JSP/java 语法）\n    * 支持动态内容（内容中包含 if-else 条件）\n    * 支持 `Notification\
    \ Rule` API。\n\n"
- fmt: "\nBoth email notification policies and email templates are depending on task\
    \ completion or event outcome (approve, reject or fail). You cannot send email\
    \ any time you want. For example, you may have long process steps:\n\n- Step 1:\
    \ HR staffs update user’s office.\n- Step 2: Send email to remind manager for\
    \ approval.\n- Step 3: Send remedy ticket and then send email to HR staff about\
    \ ticket number.\n- Step 4: Send web services request to facility system to request\
    \ permission to access the office. Send email to HR staff after web services response\
    \ successfully. If request fail, send email to IT administrator.\n- Step 5: Wait\
    \ until expected hire date, Send email to confirm user and HR staff.\n\nFor long\
    \ flow process, you have to analysis solutions when email has to be notified.\
    \ This book has a trick to send email by java API.\n\n## 3. Service API\n\n- It\
    \ can send email anytime.\n- Support dynamic content. You can use any popular\
    \ framework such as `velocity`.\n- Please note, CA IdentityMinder document do\
    \ not mention this way. Please use with your own risk.\n\n## 6.5.2 Code Example:\
    \ Email Template\n\nThis example shows how to implement email template. Understanding\
    \ email template is requires for next topic Notification Rule API. Our example\
    \ code will send email after administrator execute admin task: Update Location\
    \ and Ext Number successfully.\n\n### Code\n\n1. Locate file `Update Location\
    \ and Ext Number.tmpl`.\n2. Copy file to folder `<server>\\IdentityMinder.ear\\\
    custom\\emailTemplates\\default\\completed`.\n\n### Configuration: Management\
    \ Console\n\n1. In the Management Console, click `Environments`.\n2. Click the\
    \ name of the environment.\n3. Click `Advanced Settings`.\n4. Click `Email`.\n\
    5. Select check box `Tasks e-mail enabled`.\n\n| ![](image_rsrc8Y3.jpg) |\n| Figure\
    \ 6-20 shows task e-mail enabled configuration |\n\n6. Scroll down until you see\
    \ “Send e-mail when the following tasks are completed or during workflow”\n  \
    \  - In Admin Task Name, select `Equal` from drop down and put value: `Update\
    \ Location and Ext Number`\n    - `Update Location and Ext Number` will be displayed\
    \ in search result. Select check box on that task and click add button.\n    -\
    \ You should see task `Update Location and Ext Number` in task table.\n\n| ![](image_rsrc8Y4.jpg)\
    \ |\n| Figure 6-21 shows adding task for email template |\n\n7. Click save button.\n\
    8. Click `Restart Environment` button.\n\n### How it works\n\nExecute admin task:\
    \ `Update Location and Ext Number`.\n\n1. Log into the Identity Manager User Console\
    \ as administrator.\n2. Select tab: `Book Example`, and select menu `Update Location\
    \ and Ext Number`.\n3. Search a user, the screen will show city drop down.\n4.\
    \ Modify city attribute, and click submit.\n\n### Got the Email\n\nAfter administrator\
    \ submitted, the use should get email that has content as below:\n\n| ![](image_rsrc8Y5.jpg)\
    \ |\n| Figure 6-22 shows email content |\n\nOpen file `Update Location and Ext\
    \ Number.tmpl`, you will see code for email content. They have special variables\
    \ likes `_to` or `_taskContextInformation`. `_to` means receiver of email. We\
    \ will cover more detail in notification rule API. For `_taskContextInformation`\
    \ is a task context. Please see administration guide for more details.\n\n```\n\
    <% _to = _util.getNotifiers(\"USER\", \"\"); _cc = \"\"; _bcc = \"\" ; _subject\
    \ = \"Update Location and Ext Number\";%>User:<%var imsEventContexts = _taskContextInformation.getExposedEventContexts();\
    \ if(imsEventContexts != null) { var eventContext = imsEventContexts.get(0); template.add(eventContext.getPrimaryObjectName());\
    \ }>%has been updated location and ext number successfully.\n```\n\nIf you are\
    \ not getting email or error display on screen, please check log file. SMTP may\
    \ not correct. \n\nIf you do not get email but administrator gets email instead\
    \ and subject is “Update Location and Ext Number Completed”, that means CA IdentityMinder\
    \ uses default template: `defaultTask.tmpl` sending email. Please check folder\
    \ name `default/completed` and admin task should matches with our template name\
    \ exactly. Restart server or environment may is required for some modification.\n\
    \n## 6.5.3 Code Example: Email notification by Service API\n\nThis example shows\
    \ how to send email by CA IdentityMinder service. We will send email by using\
    \ business logic task handler. Please disable email template from previous example.\n\
    \n### Code\n\n1. Compile our java code: `com.book.idm.etc.SendEmail`.\n2. Copy\
    \ class (include package folder `com.book.idm.etc` ) to folder `<server>\\IdentityMinder.ear\\\
    custom`.\n\n### Configuration: Identity Manager User Console\n\n1. Log into the\
    \ Identity Manager User Console as administrator.\n2. Select tab `Roles and Tasks`,\
    \ and select menu `modify admin task`.\n3. Search admin task: `Update Location\
    \ and Ext Number`.\n4. Click button `Business Logic Task Handlers`.\n5. Click\
    \ add and put value as below:\n\n| Field Name | Value | Description |\n| :---\
    \ | :--- | :--- |\n| Name | `SendEmail` | Name of business logic task handler\
    \ |\n| Class | `com.book.idm.etc.SendEmail` | Name of java class |\n\n6. Click\
    \ ok and submit task.\n\n### How it works\n\nExecute admin task: `Update Location\
    \ and Ext Number`.\n\n1. Log into the Identity Manager User Console as administrator.\n\
    2. Select tab: `Book Example`, and select menu `Update Location and Ext Number`.\n\
    3. Search a user, the screen will show city drop down.\n4. Modify city attribute,\
    \ and click submit.\n\n### Service API\n\nThe code is pretty straightforward.\
    \ You can send email by method `sendMail()`.\n\n```\nInternalServiceAccessor.getEmailService().sendMail(from,to,cc,encoding,contentType,subject,body);\n\
    ```\n\nWe can access administrator email in configuration: by calling `getAdminID()`.\n\
    \n```\nString adminEmail = InternalServiceAccessor.getEmailService().getAdminID();\n\
    ```\n\nWe can get email recipient by `ProviderAccessor`. Because email attribute\
    \ does presence in admin task:\n```\nUser user = ctx.getUserProvider().findUser(ctx.getUser().UniqueName(),\
    \ null);\nString to = user.getAttribute(\"mail\");\n```\n\nThis example sends\
    \ email using business logic task handler.\n\n## 6.6 Notification Rule API\n\n\
    This API is used with email template only. It determines who receive an email.\n\
    \n### 6.6.1 Programming\n\nYou have to create java class extend `NotificationRuleAdapter`\
    \ and override method `evaluate()`.\n\n```\nVector evaluate(NotificationRuleContext\
    \ ctx, Hashtable templateParams)\n```\n\n- The first parameter `ctx` is almost\
    \ same as other APIs.\n- The second parameter `templateParams` keeps name/value\
    \ pairs of user-defined data that may be specified in the email template.\n\n\
    ### 6.6.2 Code Example\n\nThis example require previous example: email template.\
    \ So you need to enable email template on task completion. Our requirement is\
    \ when administrator executes admin task: `Update Location and Ext Number`, it\
    \ has to send email to user and cc manager. If they do not have manager, you can\
    \ skip cc email.\n\n### Code\n\n1. Compile our java code: `com.book.idm.etc.ManagerNotificationRule`.\n\
    2. Copy class (include package folder `com.book.idm.etc` ) to folder `<server>\\\
    IdentityMinder.ear\\custom`.\n3. Modify file `Update Location and Ext Number.tmpl`\
    \ in folder email template. Add notification rule name for `_cc`.\n\n```\n_cc\
    \ = _util.getNotifiers(\"ManagerNotificationRule\",\"param1=A,param2=B\");\n```\n\
    \n### Configuration: Management Console\n\n1. In the Management Console, click\
    \ `Environments`.\n2. Click the name of the environment.\n3. Click `Advanced Settings`.\n\
    4. Click `Notification Rules`.\n\n| Field Name | Value | Description |\n| :---\
    \ | :--- | :--- |\n| Name | `ManagerNotificationRule` | Name of notification rule\
    \ |\n| Class | `com.book.idm.etc.ManagerNotificationRule` | Name of java class\
    \ |\n\n5. Click save and restart environment.\n\n### How it works\n\nExecute admin\
    \ task: `Update Location and Ext Number`.\n\nIf you want to send email after task\
    \ complete, please send email by listener in method `after()`.\n"
