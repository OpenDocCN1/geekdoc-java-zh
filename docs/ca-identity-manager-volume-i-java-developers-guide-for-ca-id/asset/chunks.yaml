  trans: "\n\n`CreateUserEvent` 工作流过程中的第一个活动是一个自动化活动，该活动引出了三个条件条件跳转。每个跳转中的条件脚本会从事件包含的\
    \ `User` 对象中获取 `email` 属性。工作流过程执行的下一个活动由条件脚本的结果决定，如下：\n\n- 跳转到 `CA.COM SUFFIX`\
    \ 指向一个审批者：`HR Manager`（HR 经理）。\n- 跳转到 `SECURITY.COM SUFFIX` 指向两个审批者：`HR Manager`\
    \ 和 `IT Manager`（IT 经理）。\n- 跳转到 `EMAIL INVALID` 拒绝工作流。\n\n文档提到在每个跳转中使用条件脚本来获取\
    \ `email`。你可以使用 Java 代码编写跳转的条件。\n\n![](img/image_rsrc8XE.jpg)\n\n*图 5-85 显示了用例的工作流*\n\
    \n### 在工作流过程中更新 CA IdentityMinder 对象\n\n在以前的用例示例中，假设跳转 `CA.COM SUFFIX` 的条件脚本已更新更新，用以检查\
    \ `email` 属性是否为空。如果为空，脚本将根据用户的 ID 和默认后缀 `ca.com` 构建电子邮件地址。脚本将该地址分配给 `User` 对象的\
    \ `email` 属性。然后脚本返回 `true`，并按照上例执行跳转。当 `CA IdentityMinder` 完成事件执行时，将保存更新的对象。\n\
    \n这里有两个有趣点：\n\n- 跳转 `CA.COM SUFFIX` 的条件脚本被更新更新，用以检查 `email` 属性是否为空。\n    - 你可以在跳转\
    \ `CA.COM SUFFIX` 的条件脚本内部执行该逻辑。\n- 脚本将地址分配给 `User` 对象的 `email` 属性。\n    - 我们可以通过\
    \ `ProviderAccessor` 和 `Workflow Context` 将地址分配给 email 属性。在这种情况下，由于两个原因，我们必须使用\
    \ `Workflow context`。第一个原因是 `CreateUserEvent`。我的意思是，事件完成之前用户尚未被创建。第二个原因是，此工作流需要审批者。如果被拒绝，我们必须考虑结果。\n\
    \n我们计划在 `workflow context` 中修改 `email` 属性，在创建管理任务时，你必须确保在 `fields` 标签中定义了 `email`\
    \ 属性。\n\n### 使用第三方数据从工作流过程中验证对象\n\n`CreateUserEvent` 的工作流过程包含一个自动化活动，该活动从第三方数据库获取新用户的信用评分。首先，活动脚本调用\
    \ `Workflow API` 获取事件以及事件中的 `User` 对象。然后，在脚本获取用户的信用评分后，它使用工作流引擎的 API 将信用评分写入活动的\
    \ `User Data` 中，并最终完成活动。从该活动的跳转脚本随后使用 `workflow engine’s API` 从 `User Data` 中获取信用评分并对其进行评估，以确定工作流过程的后续步骤。\n\
    \n我们可以使用服务器自动化（server automated）脚本来调用第三方数据。例如，你调用第三方获取类型并确定路径。\n\n![](img/image_rsrc8XF.jpg)\n\
    \n*图 5-86 显示工作流调用第三方数据*\n\n## 5.6 结论\n\n在本章中，你学习了 `workflow context API` 或如何创建自定义工作流。我们可以将工作流的概念总结为：\n\
    \n**创建工作流前的检查列表：**\n\n- 工作流的级别是什么？`admin task level`（管理任务级）或 `event level`（事件级）\n\
    - 哪个工作流？从 3 个默认工作流中选择还是创建一个新的自定义工作流？\n- 工作流开始前需要策略（或条件）吗？\n- 审批者使用哪个屏幕（任务）？\n\
    - 谁是审批者？\n- 结果是什么？\n\n**自定义工作流的规则**\n\n- 规则 1：必须以 `Start` 节点开始并以 `Stop` 节点结束。\n\
    - 规则 2：在进入 `Stop` 节点之前必须有 `Approve`（通过）或 `Reject`（拒绝）。\n- 规则 3：`Approver Configuration`（审批配置，如果你需要审批者）。\n\
    - 规则 4：管理任务层级的工作流（可选）。\n\n**自定义工作流的注意事项**\n\n- 注意 1：`WorkflowContext` 正确调用来自父类（`EventContext`）的方法。\n\
    - 注意 2：保持跳转条件的简单性。\n- 注意 3：使用 `server automated` 实现业务逻辑。（建议）\n- 注意 4：`server automated`\
    \ 的 `Agent script` 应被指定为同步。\n- 注意 5：在删除进程之前删除相关作业。\n\n你可能认为 `workflow API` 很难，我建议你只需记住本章中的规则和注意事项。对于编程细节，请参阅书籍第二卷，其中包含大量示例。你会熟悉它的。业务逻辑任务处理器和工作流在实际项目中非常有用。在下一章，我们将介绍剩余的\
    \ API。\n\n# 第 6 章：其他 API\n\n我们学习了用于开发业务逻辑的两个主要 API：同步阶段下的 `business logic task\
    \ handler` 和异步阶段下的 `workflow`。本章中的这些 API 是实现目标的工具。\n\n本章中有许多细节。你可能不需要关注所有的 API。我的观点是，我在下表中给出了总结：\n\
    \n| API 名称 | 频率 | 目的 |\n| :--- | :--- | :--- |\n| Participant Resolver API | 有时\
    \ | 决定谁是审批者 |\n| Event Listener API | 经常 | 事件发生时执行自定义业务逻辑 |\n| Logical Attribute\
    \ API | 罕见 | 在物理属性和逻辑属性之间转换 |\n| Validation Rules | 有时 | 验证值 |\n| Email & Notification\
    \ Rule API | 有时 | 发送电子邮件 |\n| Task Execution Web Service | 有时 | 启用管理任务作为 Web 服务\
    \ |\n\n## 6.1 Participant Resolver API\n\n`Participant Resolver API` 是工作流的一部分。`Participant\
    \ Resolver API` 决定工作流中的审批者。审批者是授权审批工作的人。\n\n如果工作流需要审批（例如 `SimpleApproval`），你需要在配置中选择审批者。\n\
    \n![](img/image_rsrc8G.jpg)\n\n*图 6-1 显示审批者界面*\n\n`CA IdentityMinder` 为审批者提供了配置条件，更多详情请参见文档“审批者类型”。当不支持配置条件时我们需要审批者。\n\
    \n### 6.1.1 编程\n\n使用 `Participant Resolver API`，你必须创建一个自 `ParticipantAdapter`\
    \ 的类并重写 `resolve()` 方法。返回值是参与者的向量。\n\n```\npublic Vector resolve(ParticipantResolverContext\
    \ ctx, Hashtable data, String approvalNodeName)\n```\n\n从工作流传递了三个参数。第一个是类似于 `EventContext`\
    \ 或 `WorkflowContext`。第二个参数 `HashTable` 包含 `TASK_TAG`。最后一个参数 `string` 是工作流中的节点名称。\n\
    \n### 6.1.2 代码示例：Participant Resolver API\n\n此示例使用了 `SimpleApproval` 工作流。`SimpleApproval`\
    \ 工作流有两个审批者：主审批者和默认审批者。主审批者调用我们的 `ParticipantResolver` 代码。对于默认审批者，我们使用我们的管理员。\n\
    \n我们的需求是主审批者是 `manager` 或 `manager` 是审批者。如果用户没有 `manager`，则使用 `manager`。如果用户没有\
    \ `manager`，则跳到默认审批者。\n\n代码\n\n3. 编译我们的 Java 代码：`com.book.idm.etc.MgrOfMgrParticipantResolver`\n\
    4. 将类（包含包 `com.book.idm.etc`）复制到文件夹 `<server>\\IdentityMinder.ear\\custom`。\n\n"
- fmt: "\n## 2. Search our admin task name: `Update Location and Ext Number`.\n\n\
    - Please disable business logic task handler, policy Xpress or workflow from previous\
    \ example.\n\n## 3. Select tab event and click `ModifyUserEvent`.\n\n## 4. Select\
    \ Non-Policy Based workflow: `singleStepApproval`\n\n- For Primary Approver:\n\
    \    - `Approval Task` drop down, select `Approve Modify User`\n    - `Participant\
    \ Resolver` drop down, select `Custom:MgrOfMgrParticipantResolver`\n- For Default\
    \ Approver:\n    - `Approval task` drop down, select `Approve Modify User`\n \
    \   - `Participant Resolver` drop down, select your administrator.\n\n| ![](image_rsrc8XH.jpg)\
    \ |\n| Figure 6-2 shows workflow configuration |\n\n### How it works\n\nYou have\
    \ to prepare 3 users: `user A`, `user B` and `user C`. Login to user data store\
    \ and check attribute `managerID`:\n\n- `User A` has `managerID = user B`\n- `User\
    \ B` has `managerID = user C`\n- `User C` has `managerID = \"\"`\n\nLog into the\
    \ Identity Manager User Console as `administrator`, Select tab: `Book Example`\n\
    \n### Case 1: Modify user A, participant is Manager of Manager\n\n4. Select `Admin\
    \ Task`: “Update Location and Ext Number”, then search and select `user A`. Modify\
    \ city’s attribute and submit admin task.\n5. Login as `user C`, you should see\
    \ request for approval.\n\n### Case 2: Modify user B, Participant is Manager\n\
    \n1. Select `Admin Task`: “Update Location and Ext Number” again and select `user\
    \ B`. Modify city’s attribute and submit admin task.\n2. Login as `user C`, you\
    \ should see request for approval.\n\n### Case 3: Modify user C, There is no manager\n\
    \n1. Select `Admin Task`: “Update Location and Ext Number” again and select `user\
    \ C`. Modify city’s attribute and submit admin task.\n2. Login as `administrator`,\
    \ you should see request for approval.\n\n### Find manager of manager\n\nWe use\
    \ `ProviderAccess` find the manager. We get user then we look up attribute `managerID`,\
    \ and search manager by `managerID` and so on until we get manager of manager.\n\
    \n```java\nString userId = ctx.getSubject().getFriendlyName();\nUser user = ctx.getUserProvider().findUser(userId,\
    \ null);\nString managerID = user.getAttribute(\"managerID\");\nUser managerUser\
    \ = ctx.getUserProvider().findUser(managerID, null);\nString mgrOfMgrID = managerUser.getAttribute(\"\
    managerID\");\nUser mgrOfMgrUser = ctx.getUserProvider().findUser(mgrOfMgrID,\
    \ null);\nresolver.add(mgrOfMgrUser);\n```\n\n### Add participants\n\nThe code\
    \ is pretty straightforward. We create vector object and add object `User` who\
    \ is participant to object.\n\n```java\nVector resolver = new Vector();\nresolver.add(mgrOfMgrUser);\n\
    ```\n\n### No manager of manager\n\nIf user does not have manager of manager,\
    \ we will return manager\n\n```java\nif(mgrOfMgrID == null || mgrOfMgrID.trim().length()==0){\n\
    \    System.out.println(userId+\" has only manager \"+managerID);\n    resolvers.add(managerUser);\n\
    \    return resolvers;\n}\n```\n\nIf there are no approver, just return empty\
    \ vector.\n\n### 6.1.3 Use Case Example\n\nIn official document (Programming Guide\
    \ for Java > Workflow API > Participant Resolver API > Participant Resolver Overview\
    \ > Use Case Example) give one use case example.\n\n#### Assign a group’s administrators\
    \ as participants\n\nWorkflow approval is required whenever a user is added to\
    \ the group `HR`. A custom participant resolver assigns the administrators of\
    \ the group as participants in the workflow activity. When a user is added to\
    \ `HR`, the event `AddToGroupEvent` comes under workflow control, and cannot be\
    \ completed successfully until a designated participant approves the activity.\n\
    \nThis workflow runs specific event level `AddToGroupEvent`. We can write the\
    \ condition, if group’s name equals “HR”, return approver. If group’s name does\
    \ not equal “HR”, return empty vector.\n\n```java\npublic Vector resolve(ParticipantResolverContext\
    \ ctx, Hashtable userData, String approvalNodeName) throws Exception {\n    Vector\
    \ resolver = new Vector();\n    AddToGroupEvent event = (AddToGroupEvent)ctx.getEvent();\n\
    \    String groupName = event.getGroup().getFriendlyName();\n    if(groupName.equals(\"\
    HR\")){\n        resolver = event.getGroup().getAdmins(null);\n    }\n    return\
    \ resolver;\n}\n```\n\nWe get group from `event`. We can get administrator of\
    \ this group by method `getAdmins()`. Please see java doc for more details.\n\n\
    ## 6.2 Event Listener API\n\nWhen `CA IdentityMinder` executes an admin task,\
    \ it breaks down the task into its component events. Each event represents a specific\
    \ action to be performed during the execution of the task, for example a `CreateUserEvent`\
    \ is adding the new user.\n\nAn event listener listens to a specific event or\
    \ a group of events. When the event occurs, the event listener performs custom\
    \ business logic that is appropriate for the event and the current event state.\n\
    \n### 6.2.1 Programming\n\nFor Event Listener API, you must create java class\
    \ extend `EventListenerAdapter` and override methods as needs.\n\n- `int before(EventContext\
    \ evtCtx)`: Performs custom business logic during the Pre-approval state.\n- `int\
    \ approved(EventContext evtCtx)`: Performs custom business logic during the Approved\
    \ state.\n- `int rejected(EventContext evtCtx)`: Performs custom business logic\
    \ during the Rejected state.\n- `int after(EventContext evtCtx)`: Performs custom\
    \ business logic during the Post-execution state.\n- `int failed(EventContext\
    \ evtCtx)`: Performs custom business logic during the Failed state.\n\nEvery method\
    \ return `BREAK` or `CONTINUE`. `BREAK` means no more listeners, `CONTINUE` means\
    \ processing the next listener.\n\n### 6.2.2 Code Example: Event Listener\n\n\
    Our example shows life cycle of listener. It use standard out printing.\n\n####\
    \ Code\n\n1. Compile java code: `com.book.idm.etc.LifeCycleEventListener`\n2.\
    \ Copy class (include package `com.book.idm.etc`) to folder `\\IdentityMinder.ear\\\
    custom`\n\n#### Configuration\n\n1. In Management Console, click `Environments`.\n\
    2. Click the name of environment where the event listener will be used.\n3. Click\
    \ `Advanced Settings`.\n4. Click `Event Listeners`.\n5. Click new button and put\
    \ value as the below\n\n| Field Name | Value | Description |\n| :--- | :--- |\
    \ :--- |\n| Name | `LifeCycleEventListener` | Name of event listener |\n| Class\
    \ | `com.book.idm.etc.LifeCycleEventListener` | Name of our java class |\n| Listener\
    \ Level | `ModifyUserEvent` | Event that class is listening to |\n\n| ![](image_rsrc8XJ.jpg)\
    \ |\n| Figure 6-3 shows event listener configuration |\n\n6. Click Restart Environment\n\
    \n#### Configuration: Manager User Console\n\n1. Log into the Identity Manager\
    \ User Console as `administrator`.\n2. Search our admin task name: `Update Location\
    \ and Ext Number`.\n- Please disable business logic task handler, policy Xpress\
    \ or workflow from previous example.\n3. We require one workflow for testing our\
    \ event listener in case of reject or approve. Select tab event and click `ModifyUserEvent`.\n\
    - Select Non-Policy Based: `singleStepApproval`.\n- For primary approver and default\
    \ approver:\n    - `Approval Task` drop down, select `Approve Modify User`\n \
    \   - `Participant Resolver` drop down, select your administrator.\n\n### How\
    \ it works\n\nExecute admin task: `Update Location and Ext Number`.\n\n1. Log\
    \ into the Identity Manager User Console as `administrator`.\n2. Select tab: `Book\
    \ Example`, and select menu `Update Location and Ext Number`.\n3. Select `Admin\
    \ Task`: “Update Location and Ext Number” from tab `Book Example`, Then search\
    \ some users. Modify city’s attribute and submit admin task. You can see message\
    \ in log file. The message does not appear immediately, you have to wait until\
    \ event start.\n\n```\n2013-10-27 INFO [STDOUT] =============>LifeCycleEventListener:before\n\
    ```\n\n4. Log in as approver, you will see approve task and click approve. Look\
    \ at message in log file.\n"
