  trans: "\n\n### 步骤 3：将值写回物理属性。\n\n```java\n@Override\npublic void toPhysical(LogicalAttributeContext\
    \ ctx) throws Exception {\n    //step 1\n    String officeCode = ctx.getLogicalAttributeName(ATTR_OFFICE_CODE);\n\
    \    String officeCodeValue = ctx.getLogicalAttributeValue(officeCode);\n    //step\
    \ 2\n    String cityValue = indexLogicalAsKey.get(officeCodeValue);\n    //step\
    \ 3\n    String city = ctx.getPhysicalAttributeName(ATTR_REFER_PHY);\n    ctx.setPhysicalAttributeValue(city,\
    \ cityValue);\n}\n```\n\n#### 管理任务中的属性\n\n我们在屏幕上声明了 3 个字段：\n\n* 2 个逻辑属性：`officeCode`（下拉列表）和\
    \ `officeCodeList`（隐藏）对于下拉列表是必选的。\n* 1 个物理属性：城市（City，隐藏），我们需要它是因为我们要填充城市属性。因此，城市属性必须存在于管理任务上下文中。\n\
    \n#### 方法：`initializeOptionList()`\n\n如果你想为此逻辑属性提供下拉列表，则必须实现此方法。你只需将向量设置为逻辑属性值。\n\
    \n```java\nctx.setLogicalAttributeMultiValue(officeCodeList,officeCodes);\n```\n\
    \n确保你在配置页面中检查了选项列表。\n\n![](img/image_rsrc8XV.jpg)\n\n图 6-12 显示了选项列表的复选框\n\n####\
    \ 方法：`initialize()`\n\n此方法仅在创建任务时执行，例如创建用户、创建账户。此方法用于设置逻辑属性的初始值。\n\n对于修改任务，此方法从未执行过。我们的示例从未调用过此方法。如果你想执行此方法，必须将操作更改为“创建”（create）（主对象是用户）。然后再次执行此管理任务，你将看到此方法设置了默认值“006NY”。\n\
    \n```java\n@Override\npublic void initialize(LogicalAttributeContext ctx) throws\
    \ Exception {\n    String officeCodeName = ctx.getLogicalAttributeName(ATTR_OFFICE_CODE);\n\
    \    String officeCodeValue = ctx.getLogicalAttributeValue(officeCodeName);\n\
    \    if(officeCodeValue == null || officeCodeValue.trim().length()==0){\n    \
    \    ctx.setLogicalAttributeValue(officeCodeName, \"006NY\");\n    }\n}\n```\n\
    \n#### 方法：`validate()`\n\n`validate()` 方法在用户提交任务时执行。你可以通过选择空值并点击提交来测试我们的代码。\n\n\
    ```java\n@Override\npublic void validate(LogicalAttributeContext ctx) throws Exception\
    \ {\n    String officeCode = ctx.getLogicalAttributeName(ATTR_OFFICE_CODE);\n\
    \    String officeCodeValue = ctx.getLogicalAttributeValue(officeCode);\n    if(officeCodeValue==null\
    \ || officeCodeValue.trim().length()==0){\n        IMSException e = new IMSException();\n\
    \        e.addUserMessage(\"Invalid office value\");\n        throw e;\n    }\n\
    }\n```\n\n![](img/image_rsrc8XW.jpg)\n\n图 6-13 显示了 `validate()` 方法期间的异常\n\n####\
    \ 屏幕定义的逻辑属性 vs 我们的逻辑属性\n\n当你创建屏幕时，可以创建屏幕定义的逻辑属性。屏幕定义的逻辑属性仅针对单个屏幕定义。它们不能与其他屏幕共享，但逻辑属性本身是可以共享的。\n\
    \n### 6.3.3 用例\n\n参考官方文档：Programming guide > Logical Attribute > Use Case Examples\n\
    \n#### 从数据源格式化数据\n\n在用户目录中，电话号码以物理属性 `phone` 的形式存储。它有 10 位数字——例如 9785551212。该物理属性与逻辑属性\
    \ `formatted_phone` 相关。\n\n此用例需要重写 `toLogical()` 以返回格式化后的电话，并重写方法 `toPhysical()`\
    \ 将格式化后的电话转换为数字。\n\n#### 验证数据输入\n\n数据源存在物理属性 `employeeNumber`，它映射到逻辑属性 `validEmployeeNumber`。当用户在任务屏幕上为\
    \ `validEmployeeNumber` 属性分配员工编号并点击提交后，CA IdentityMinder 会调用自定义逻辑属性处理器来查询数据源，以确保提供的员工编号存在于\
    \ `employeeNumber` 中。如果不存在，逻辑属性处理器将抛出异常。\n\n此用例查询数据库并在逻辑属性和物理属性之间进行转换。\n\n```java\n\
    @Override\npublic void toLogical(LogicalAttributeContext ctx) throws Exception\
    \ {\n    //step 1\n    String empNo = ctx.getPhysicalAttributeName(\"employeeNumber\"\
    );\n    String empNoValue = ctx.getPhysicalAttributeValue(empNo);\n    //step2\n\
    \    String validEmpNoValue = queryByPhysicalID(validEmpNoValue);\n    //step3\n\
    \    if(empNo!=null){\n        String validEmpNo = ctx.getLogicalAttributeName(\"\
    validEmployeeValue\");\n        ctx.setLogicalAttributeValue(validEmpNo, validEmpNoValue);\n\
    \        return;\n    }\n    throw new IMSException(\"invalid employee number\"\
    );\n}\n``` （等待，查看下方的逻辑）\n\n任务屏幕要求客户提供他们购买的服务类型——金级（Gold）、银级（Silver）或铜级（Bronze）。这些选项在与逻辑属性\
    \ `serviceType` 关联的下拉列表中。当客户选择服务级别并点击提交时，CA IdentityMinder 会调用逻辑属性处理器，将所选的服务级别转换为对应的物理属性值（1、2\
    \ 或 3），并将该值分配给物理属性 `type`。\n\n此用例与我们的示例相同。你必须实现 `initializeOptionList()` 来返回服务类型：金级、银级或铜级，并实现方法\
    \ `toPhysical()` 将服务类型（金级、银级或铜级）转换为物理属性值（1、2 或 3）。\n\n## 6.4 验证规则\n\n属性验证规则有助于验证用户在屏幕上输入的值符合格式。验证规则可以是正则表达式、JavaScript\
    \ 或 Java 实现。本书将关注 Java 编程。正则表达式和 JavaScript 可以查看官方文档中的示例。\n\n* 任务级验证：针对特定任务。你可以在任务屏幕配置期间定义规则。\n\
    * 目录级验证：应用于所有任务。它是全局范围的。需要在 `directory.xml` 中定义。\n\n#### 6.4.1 编程\n\n对于任务级验证，你必须实现\
    \ `TaskValidator` 并重写 `validate()` 方法。\n\n```java\npublic boolean validate(BLTHContext\
    \ ctx, String attrValue,StringRef changedValue, StringRef errorMsg) throws AttributeException\n\
    ```\n\n对于目录级验证，你需要扩展 `AttributeValidator` 并重写 `validate()` 方法。它与任务级非常相似，但有一些细节。请见示例。\n\
    \n```java\npublic boolean validate(Object attrValue, StringRef changedValue, StringRef\
    \ errorMsg) throws AttributeException\n```\n\n#### 6.4.2 代码示例：任务级验证\n\n此示例需要属性\
    \ `Employee Number`，请检查你的用户存储。我们的需求使用 `employeeNumber` 属性。验证规则如下：\n\n* 员工编号必须是数字。\n\
    * 最大 4 位。\n* 如果用户输入 1-3 位数字，格式将在前面填充 0。例如：2，正确的格式将是 0002。\n\n![](img/image_rsrc8XX.jpg)\n\
    \n图 6-14 显示更新员工编号的用户屏幕\n\n##### 代码\n\n1. 编译我们的 Java 代码：`com.book.idm.etc.EmployeeNumberTaskValidator`\n\
    2. 将类（包含包 `com.book.idm.etc`）复制到 `\\IdentityMinder.ear\\custom` 文件夹。\n\n#####\
    \ 配置：Identity Manager 控制台\n\n1. 以管理员身份登录 Identity Manager 控制台。\n2. 选择 Roles and\
    \ Tasks 选项卡，并选择 create admin taskget。\n3. 创建管理任务，输入如下值：\n\n| 字段名称 | 值 | 描述 |\n\
    | :--- | :--- | :--- |\n| Tab: Profile | | |\n| Name | Update Employee Number\
    \ | 管理任务名称 |\n| Tag | BookBasicUpdateEmployeeNumber | 管理任务标签 |\n| Description\
    \ | Example for Validation | 管理任务描述 |\n| Category | Book Example | 管理任务显示的位置 |\n\
    | Category Order | 11 | |\n| Category 2 | Task | |\n| Category 3 | Basic | |\n\
    | Primary Object | User | 我们想更新员工编号，所以必须选择用户对象和修改操作。 |\n| Action | Modify | |\n\
    \n"
- fmt: "\nFor testing, you can disable some values.\n\n* User Synchronization and\
    \ Account Synchronization: off.\n* Enable Auditing, Enable Workflow, Enable Web\
    \ Services: uncheck\n\n### Tab: Search\n\n| Search Screen | Default User Search\
    \ | Screen for searching user |\n| :--- | :--- | :--- |\n| | | |\n\n### 4. For\
    \ Tab: Tabs\n\nSelect standard tab controller.\nSelect `Profile`(`UserProfile`)\
    \ from list, and click symbol `(+)`.\nSelect browse button at screen text field.\n\
    Click `new` button to create new screen, and select choice standard profile screen.\n\
    Put value:\n\n* Name: `Update Employee Number`\n* Tag: `BookBasicUpdateEmployeeNumber`\n\
    \    * Add attribute: `Employee Number`\n    * Attribute Name: `Employee Number`\n\
    \    * Style: `Text`\n    * Name: `Employee Number`\n    * Validation Java Class:\
    \ `com.book.idm.etc.EmployeeNumberTaskValidator`\n* Click `apply` button to finish.\n\
    * Click `ok`\n\n![](image_rsrc8XY.jpg)\n\nFigure 6-15 shows configuration of employee\
    \ number attributes\n\n### 5. Submit to finish creating task.\n\n#### Add task\
    \ to admin role\n\n1. Select tab: `Roles and Tasks`, and select menu `modify admin\
    \ role`.\n2. Select role `system manager`.\n    * Select tab: `task`\n    * Select\
    \ filter by category: `Book Example`\n    * Select add task: `Update Employee\
    \ Number`\n3. Click `submit` to finish modify admin role.\n\n#### How it works\n\
    \nExecute admin task: `Update employee number`.\n\n1. Log into the Identity Manager\
    \ User Console as administrator.\n2. Select tab: `Book Example`, and select menu\
    \ `update employee number`.\n3. Search a user, the screen will show employee number\
    \ as text field.\n4. Modify employee number attribute, and click `submit`.\n\n\
    #### Method `validate()`\n\nThere are 2 cases of error:\n\n* Put 5 digits of employee\
    \ number.\n\n![](image_rsrc8XZ.jpg)\n\nFigure 6-16 shows error by return value\n\
    \n* Put any characters.\n\n![](image_rsrc8Y0.jpg)\n\nFigure 6-17 shows error by\
    \ exception\n\nThere are 2 ways to return error message, you can pick one.\n\n\
    * Return `false` and set message back by `errorMsg.reference`.\n\n```java\nif(attrValue.trim().length()>4){\n\
    \    errorMsg.reference = \"Employeer Number can not more than 4 digits\";\n \
    \   return false;\n}\n```\n\n* Throw exception and put message as parameter.\n\
    \n```java\ntry{\n    ...\n    int employeeNo = new Integer(attrValue);\n    ...\n\
    }catch(Exception e){\n    throw new AttributeValidationException(\"Employeer Number:invalid\
    \ format\");\n}\n```\n\nTry to put number one digit, for example `1`, and submit.\
    \ Login to user store, employee number will display as `0001`. We can modify value\
    \ by using `changedValue.reference` parameter.\n\n```java\nint employeeNo = new\
    \ Integer(attrValue);\nDecimalFormat format = new DecimalFormat(\"0000\");\nchangedValue.reference\
    \ = format.format(employeeNo);\n```\n\nTask-level validation provides `BLTHContext`\
    \ as parameter. You can use `BLTHContext` to search some attribute from managed\
    \ object, for example you have to check the new value must be unique.\n\n### 6.4.3\
    \ Code Example: Directory-level validation\n\nThis example will use same requirement\
    \ as task-level validation. Please disable task-level validation from admin task:\
    \ `update employee number`.\n\n* Search admin task: `update employee number`\n\
    * Go to tab: `tabs` and modify screen: `Update Employee Number`.\n* Remove value\
    \ of validation java class: `com.book.idm.etc.EmployeeNumberTaskValidator`\n\n\
    #### Code\n\n1. Compile our java code: `com.book.idm.etc.EmployeeNumberDirValidator`\n\
    2. Copy class (include package folder `com.book.idm.etc`) to folder `\\IdentityMinder.ear\\\
    custom`\n\n#### Configuration: Management Console\n\n1. In the Management Console,\
    \ click `Directory`.\n2. Click the name of the user store directory.\n3. Click\
    \ `export` button at bottom page. You will get the `xml` file.\n4. Using text\
    \ editor to open the `xml` file.\n5. You have to modify 2 places:\n    * Add validation\
    \ rule under element `<ImsManagedObjectAttrValidation>`. Please go check xml schema\
    \ from official document.\n\n```xml\n<ValidationRule name=\"Employee Number pattern\"\
    \ description=\"Validates employee number\" messageid=\"4002\"><Java class=\"\
    com.book.idm.etc.EmployeeNumberDirValidator\"/></ValidationRule>\n<ValidationRuleSet\
    \ name=\"Employee Number format\" description=\"validate employee number format\"\
    ><ValidationRule name=\"Employee Number pattern\"/></ValidationRuleSet>\n```\n\
    \n    * Add attribute `validationruleset` =`Employee Number format\"` for `employeeNumber`\
    \ attribute.\n\n```xml\n<ImsManagedObjectAttr physicalname=\"employeeNumber\"\
    \ description=\"Employee Number\" displayname=\"Employee Number\" valuetype=\"\
    String\" maxlength=\"0\" validationruleset=\"Employee Number format\"/>\n```\n\
    \n6. Go back management console, and select our use store directory.\n7. Click\
    \ `update` button and select our `xml` file. Click `next` and `finish` button.\
    \ The screen will show message in console, and click `continue` and restart environment.\n\
    \n#### How it works\n\nExecute admin task: `Update employee number`.\n\n4. Log\
    \ into the Identity Manager User Console as administrator.\n5. Select tab: `Book\
    \ Example` and select menu `update employee number`.\n6. Search a user, the screen\
    \ will show employee number as text field.\n7. Modify employee number attribute,\
    \ and click `submit`.\n\n#### Method `validate()`\n\nThere are 2 ways to return\
    \ error message, you can pick one.\n\n* Return `false` and set message back by\
    \ `errorMsg.reference`.\n\n```xml\n<ValidationRule name=\"Employee Number pattern\"\
    \ description=\"Validates employee number\" messageid=\"4002\"><Java class=\"\
    com.book.idm.etc.EmployeeNumberDirValidator\"/></ValidationRule>\n<ValidationRuleSet\
    \ name=\"Employee Number format\" description=\"validate employee number format\"\
    ><ValidationRule name=\"Employee Number pattern\"/></ValidationRuleSet>\n```\n\
    \n    * Add `validationruleset` =`Employee Number format\"` for `employeeNumber`\
    \ attribute.\n\n```xml\n<ImsManagedObjectAttr physicalname=\"employeeNumber\"\
    \ description=\"Employee Number\" displayname=\"Employee Number\" valuetype=\"\
    String\" maxlength=\"0\" validationruleset=\"Employee Number format\"/>\n```\n\
    \n* Throw exception and put message as parameter.\n\n```java\ntry{\n    ...\n\
    \    int employeeNo = new Integer(attrValue);\n    ...\n}catch(Exception e){\n\
    \    throw new AttributeValidationException(\"Employeer Number:invalid format\"\
    );\n}\n```\n\n![](image_rsrc8Y1.jpg)\n\nFigure 6-18 shows error from messageid\
    \ in `IMSException.properties`.\n\n#### Validation set\n\nIn the Management Console,\
    \ and click user store directory. Scroll down until section validation set. Click\
    \ link inside, you will see the details.\n\n![](image_rsrc8Y2.jpg)\n\nFigure 6-19\
    \ shows validation sets in management console\n\nPlease disable directory-level\
    \ validation after testing. We will use employee number in book II.\n\n### 6.5\
    \ Email Notification\n\nThis section is a special topic. It needs it for the next\
    \ API: `Notification Rule`. The CA IdentityMinder official document has topic\
    \ email notification in administration guide, not in the programming guide.\n\n\
    #### Configure SMTP\n\nYou need to check SMTP configuration before starting email\
    \ notification. There are 2 things to check before working with email notification.\
    \ The first one is SMTP configuration, what is SMTP server.\n\n* Jboss: check\
    \ `jboss_home\\server\\default\\deploy\\mail-service.xml`\n* WebLogic: check a\
    \ mail session with JNDI name `nete/Mail`\n* WebSphere: check mail session object\
    \ called `mailMail`\n\nPlease see the official document administration guide >\
    \ email notifications > configure SMTP Setting.\n\nThe second one is file `email.properties`\
    \ in folder `iam_im.ear\\config\\com\\netegrity\\config`. This file is used for\
    \ specific return address.\n\n### 6.5.1 How to implement email notification\n\n\
    There are 2+1 ways to implement email notification. The official document introduces\
    \ 2 ways to send email. This book offers another way to send email.\n\n1. Email\
    \ Notification Policies.\n    * No coding is required to create email notifications.\n\
    \    * Email notification policies are Policy Xpress policies. You can create\
    \ condition (entry rule) when policy should run.\n    * It is under the `System`\
    \ tab, select `Email` menu.\n\n2. Email templates\n    * Require code (JSP/java\
    \ syntax)\n    * Support dynamic content (include if-else condition in content).\n\
    \    * Support `Notification Rule API`.\n"
