  trans: "\n\n# 工作流错误\n\n有时，你在工作流上进行编程时会遇到一些错误。你应该取消任务或事件。我们不应该在系统中留下未完成的流程。你可以在 `View\
    \ Submitted task`（查看提交的任务）中取消。\n\n| ![](img/image_rsrc8X1.jpg) |\n| 图 5-73 显示了提交任务界面中的取消事件按钮\
    \ |\n\n## 5.3.3 分类 (Category)\n\n`Category` 是对象的组。我们可以使用 `Category` 来过滤对象。这对于管理工作流非常有帮助。在本示例中，你将学习：\n\
    \n* 如何创建分类并将对象添加到分类中。\n* 使用库搜索对象。\n* 导出工作流。\n\n#### 创建分类\n\n1 点击菜单 `Library`（库）\
    \ > `Category`（分类）。\n\n| ![](img/image_rsrc8X2.jpg) |\n| 图 5-74 显示了库菜单中的分类菜单 |\n\
    \n2. 点击 `new` 按钮并输入名称“BookExample”。\n\n| ![](img/image_rsrc8X3.jpg) |\n| 图 5-75\
    \ 显示了新建按钮。 |\n\n#### 将对象添加到分类中\n\n选择我们的进程和脚本并添加分类。\n\n* 进程 (Process)\n* 在画布上右键点击\n\
    * 选择 `properties`（属性）并选择标签页：`category`（分类）\n* 选择“BookExample”并点击添加按钮\n* `Node`（活动、自动化、服务器自动化、延迟、转换），不需要操作，它将遵循进程的分类。\n\
    * `Node` 内部或转换中的脚本\n* 编辑 `script`（脚本）\n* 选择标签页 `category`\n* 选择“BookExample”并点击添加按钮\n\
    \n| ![](img/image_rsrc8X4.jpg) |\n| 图 5-76 显示了脚本的分类 |\n\n#### 通过分类过滤\n\n添加分类后，我们可以在转换的条件或节点的代理中进行过滤。\n\
    \n| ![](img/image_rsrc8X5.jpg) |\n| 图 5-77 显示了用于过滤的分类按钮 |\n\n#### 导出工作流\n\n我们可以导出工作流并导入到\
    \ UAT 或生产环境。\n\n* 选择菜单 `File`（文件） > `Export`（导出）\n* 输入文件名并点击 `next`（下一步）\n* 你可以使用\
    \ `category` 进行过滤。\n* 我们通常导出完成过的对象：`Category`、`Process` 和 `Script`。\n\n| ![](img/image_rsrc8X6.jpg)\
    \ |\n| 图 5-78 显示了导出菜单和按分类过滤的导出屏幕 |\n\n请参阅 `appendix A`，关于导入工作流的详细信息。\n\n## 5.4\
    \ 工作点编程\n\n现在你已经学习了一些工作点示例。这一部分在你学习了一些示例代码后，包含了额外的概念。\n\n### 5.4.1 活动、服务器自动化和自动化\n\
    \n有 3 种节点：`Activity![](img/image_rsrc8X7.jpg)`、`Server Automated![](img/image_rsrc8V8.jpg)`\
    \ 和 `Automated![](img/image_rsrc8V7.jpg)`。我们有 3 种活动、自动化和服务器自动化。在 `general`（常规）标签页中有复选框。下图显示了复选框与节点类型之间的关系。\n\
    \n| ![](img/image_rsrc8X8.jpg) |\n| 下方的图 5-79 显示了复选框与节点类型之间的关系 |\n\n### 5.4.2\
    \ 服务器自动化和自动化的脚本\n\n`Server Automated![](img/image_rsrc8V8.jpg)` 和 `Automated![](img/image_rsrc8V7.jpg)`\
    \ 的 `Script` 是不同的。如果你使用 `Automate` 节点实现业务逻辑，你必须编写额外的代码通过代码完成活动。下图显示我们使用 `Automate`\
    \ 节点“Check City Value”，且流程在逻辑完成后没有继续移动。\n\n| ![](img/image_rsrc8X9.jpg) |\n| 图\
    \ 5-80 显示流程停在自动化节点处没有继续移动。 |\n\n我们可以通过添加完成活动的的代码来修复上面的图片。\n\n```\npublic void\
    \ completeActivity(ClientContext cc,ActivityInstData ad,SymbolTable st) throws\
    \ Exception{\n    short workitem = Short.parseShort((String)st.getSymbol(\"WorkItemIteration\"\
    ).getPrimaryValue());\n    WorkItemEntry workItemEntry = WorkItemEntry.queryByID(cc,\
    \ ad.getActivityInstID(),workitem);\n    short currentState = workItemEntry.getWorkStateID();\n\
    \    if (currentState == WorkItemConst.WORK_STATE_AVAILABLE) {\n        workItemEntry.changeState(WorkItemConst.WORK_STATE_OPEN);\n\
    \    }\n    workItemEntry.changeState(WorkItemConst.WORK_STATE_COMPLETE);\n}\n\
    ```\n\n注意 3：使用服务器自动化实现业务逻辑。（建议）\n\n此主题，我们建议使用服务器自动化。你不需要担心完成活动。\n\n### 5.4.3 代理脚本可以指定为同步或异步。\n\
    \n让我们了解工作流中的同步或异步是什么：\n\n* `Synchronous Scripts`（同步脚本）意味着资源的脚本、同步代理脚本和状态规则。\n\
    * `Asynchronous Scripts`（异步脚本）意味着异步代理脚本、邮件脚本和报警脚本。\n\n`Agent scripts`（代理脚本）通常用于更改数据库或调用操作。`Agent\
    \ script` 可以是同步的也可以是异步的。\n\n| ![](img/image_rsrc8XA.jpg) |\n| 图 5-81 显示了代理脚本界面\
    \ |\n\n同步代理脚本与状态更改在同一个事务中执行。异步代理脚本在状态更改事务之外执行，因此是独立完成。所以有一些需要知道的事：\n\n* 如果你使用脚本修改节点的\
    \ `User Data`（用户数据），脚本必须在同步模式下执行。\n* 如果你想完成活动，脚本必须在异步模式下执行。\n\n注意 4：服务器自动化的代理脚本应指定为同步。当你执行业务逻辑时，请指定你的脚本类型。\n\
    \n### 5.4.4 保存作业对象\n\n在官方文档：编程指南中，`Workflow API` 下有一个 `Saving Objects`（保存对象）主题。\n\
    \n什么是保存对象？\n\n`Job` 是进程的实例。`Saving object` 意味着保留某些值以便在内部节点之间共享。例如：\n\n* 你有节点 1\
    \ 连接到节点 2，节点 2 连接到节点 3。\n* 节点 1 修改值 `X =1`\n* 节点 3 可以看到值 `X`\n\n因此我们必须在进程的用户数据中声明变量\
    \ `X`。在画布上右键点击，选择 `user data` 标签页并输入名称。这与工作流时的步骤相同。\n\n| ![](img/image_rsrc8XB.jpg)\
    \ |\n| 图 5-82 显示了进程中的 user data 标签页 |\n\n官方文档告诉在异步模式下保存 `User Data` 时要注意缓存。这需要特殊的代码。\n\
    \n所有同步脚本必须使用 `ThisJobData` 或 `ThisActivityInstData` 来获取 `User Data`。\n\n| ![](img/image_rsrc8XC.jpg)\
    \ |\n| 图 5-83 同步脚本从参数访问作业 |\n\n对于只读，你可以使用 `ThisJobData` 或 `ThisActivityInstData`。当你想在异步脚本中保存作业时，必须编写如下代码：\n\
    \n```\nvar jobTableId = ThisJobData.getJobID();\nvar job = Job.queryByID(ClientContext,jobTableId,true);\n\
    job.setUserData(\"Test\",\"Pass\");\njob.save();\n```\n\n### 5.4.5 搜索引用\n\n有时由于引用，无法删除某些对象。例如，你想删除脚本，但因为引用报错。你想知道哪些进程或作业使用了该脚本。点击菜单\
    \ `library > scripts`，并在 `script` 上右键，选择 `search references`（搜索引用）或 `search dialog`（搜索对话框）。搜索对话框提供了更多选项，如果你想搜索作业，请勾选对话框中的\
    \ `jobs` 选框。\n\n| ![](img/image_rsrc8XD.jpg) |\n| 图 5-84 显示了搜索引用 |\n\n注意 5：在删除进程之前删除相关作业。\n\
    \n如果你在删除作业之前删除进程，删除脚本将会变得复杂。你选择脚本并搜索引用；你会看到一些作业引用脚本。由于你已经删除了进程，无法访问所有相关作业。你必须逐个打开并删除每个作业。\n\
    \n所以我们建议在删除进程之前删除所有相关作业。\n\n## 5.5 用例示例\n\nCA IdentityMinder 官方文档讨论了用例示例。请参见 `Programming\
    \ Guides › Programming Guide for Java › Workflow API › Workflow API Overview ›\
    \ Use Case Examples` 了解完整细节。\n\n* 根据 User 对象属性确定工作流方向\n\n"
- fmt: "\nThe first activity in a workflow process for a `CreateUserEvent` is an automated\
    \ activity with three conditional transitions leading from it. The condition script\
    \ in each transition retrieves the `email` attribute from the `User` object contained\
    \ in the event. The next activity that the workflow process performs is determined\
    \ by the outcome of the condition scripts, as follows:\n\n- The transition `CA.COM\
    \ SUFFIX`, goes to one approver: `HR Manager`.\n- The transition `SECURITY.COM\
    \ SUFFIX`, goes to 2 approvers: `HR Manager` and `IT Manager`.\n- The transition\
    \ `EMAIL INVALID`, reject workflow.\n\nThe document said using condition script\
    \ in each transition retrieves the `email`. You can write the transition’s condition\
    \ with java code.\n\n![](image_rsrc8XE.jpg)\n\n*Figure 5-85 shows workflow of\
    \ use case*\n\n### Update a CA IdentityMinder object during a workflow process\n\
    \nIn the previous use case example, suppose the condition script for the transition\
    \ `CA.COM SUFFIX` is updated to check whether the `email` attribute is blank.\
    \ If it is blank, the script constructs an email address from the user’s ID and\
    \ the default suffix `ca.com`. The script assigns the address to the `email` attribute\
    \ of the `User` object. The script then returns `true`, and the transition is\
    \ performed as in the previous example. The updated object is saved when `CA IdentityMinder`\
    \ completes the execution of the event.\n\nThere are 2 interesting things:\n\n\
    - The condition script for the transition `CA.COM SUFFIX` is updated to check\
    \ whether the `email` attribute is blank.\n    - You can do the logic inside condition\
    \ script of transition `CA.COM SUFFIX`.\n- The script assigns the address to the\
    \ `email` attribute of the `User` object.\n    - We can assign the address to\
    \ email attribute by `ProviderAccessor` and `Workflow Context`. For this case,\
    \ we have to use `Workflow context` because of 2 reasons. The first one is `CreateUserEvent`.\
    \ I means user not created until event has been done. The second reason, this\
    \ workflow requires approver. If it rejected, we have to concern outcome.\n\n\
    We plan to modify `email` attribute in `workflow context`, you have to make sure\
    \ you define `email` attribute in `fields` tab when you create admin task.\n\n\
    ### Validate an object from a workflow process using third-party data\n\nThe workflow\
    \ process for a `CreateUserEvent` contains an automated activity that retrieves\
    \ the new user’s credit score from a third-party database. First, the activity\
    \ script calls the `Workflow API` to retrieve the event and the `User` object\
    \ within the event. Then, after the script retrieves the user’s credit score,\
    \ it uses the workflow engine’s API to write the credit score to the `User Data`\
    \ for the activity, and finally completes the activity. Transition scripts leading\
    \ from the activity then use the `workflow engine’s API` to retrieve the credit\
    \ score from the `User Data` and evaluate it to determine the subsequent course\
    \ of the workflow process.\n\nWe can use script in server automated to call third\
    \ party data. For example, you call the third party to get type and determine\
    \ path.\n\n![](image_rsrc8XF.jpg)\n\n*Figure 5-86 shows workflow calls the third\
    \ party data*\n\n## 5.6 Conclusion\n\nThis chapter, you learned `workflow context\
    \ API` or how to create custom workflow. We can conclude concept of workflow as:\n\
    \n**The check list before create work flow:**\n\n- What is level of workflow?\
    \ `admin task level` or `event level`\n- Which workflow? Choose from 3 default\
    \ workflow or create new custom workflow?\n- Do we need policy (or condition)\
    \ before workflow starts?\n- What screen (task) for approver?\n- Who is approver?\n\
    - What is outcome?\n\n**Rule of custom work flow**\n\n- Rule 1: Must start with\
    \ a `Start` node and end with a `Stop` node.\n- Rule 2: Must have `Approve` or\
    \ `Reject` before go to `Stop` node.\n- Rule 3: `Approver Configuration` (If you\
    \ require approver)\n- Rule 4: workflow at admin task level (Optional)\n\n**Note\
    \ for custom workflow**\n\n- Note 1: `WorkflowContext`, calling method from the\
    \ parent class (`EventContext`) ) properly.\n- Note 2: Keep transition’s condition\
    \ simple.\n- Note 3: Using `server automated` implement business logic. (Recommendation)\n\
    - Note 4: `Agent script` of `server automated` should designate as synchronous.\n\
    - Note 5: Delete related jobs before delete process.\n\nYou may think `workflow\
    \ API` is difficult, my suggesting you just remember rules and notes in this chapter.\
    \ For programming detail, please see book volume II contains a lot of examples.\
    \ You will familiar it. The business logic task handler and workflow is useful\
    \ in real project. The next chapter, we will go the rest of APIs.\n\n# Chapter\
    \ 6: Additional APIs\n\nWe learned 2 main API to develop business logics; `business\
    \ logic task handler` under synchronous phase and `workflow` under asynchronous\
    \ phase. These APIs in this chapter is helpers to achieve the goals.\n\nThere\
    \ are a lot of details in this chapter. You may not need to pay attention to all\
    \ APIs. My opinion, I give summary the table below:\n\n| API Name | Frequency\
    \ | Purpose |\n| :--- | :--- | :--- |\n| Participant Resolver API | sometimes\
    \ | Determines who is approver |\n| Event Listener API | often | Performs custom\
    \ business logic when event occurs |\n| Logical Attribute API | rarely | Convert\
    \ between physical and logical attributes |\n| Validation Rules | sometimes |\
    \ Validate values |\n| Email & Notification Rule API | sometimes | Sending email\
    \ |\n| Task Execution Web Service | sometimes | Enable admin task as web services\
    \ producer |\n\n## 6.1 Participant Resolver API\n\nThe `Participant Resolver API`\
    \ is a part of workflow. The `Participant Resolver API` determines the participants\
    \ in a workflow activity. A participant is a person who is authorized to approve\
    \ in workflow.\n\nIf workflow requires approver (for example `SingleStepApproval`),\
    \ you need to select the participant resolver in configuration.\n\n![](image_rsrc8G.jpg)\n\
    \n*Figure 6-1 shows the participant resolver screen*\n\n`CA IdentityMinder` provides\
    \ configurable condition for participant resolver, see official document “Types\
    \ of Participant Resolvers” for more details. We need the participant resolver\
    \ API, when configurable condition is not support.\n\n### 6.1.1 Programming\n\n\
    Using the `Participant Resolver API`, you must create class extend `ParticipantAdapter`\
    \ and override method `resolve()`. The return value is a vector of user objects\
    \ containing the list of participants.\n\n```\npublic Vector resolve(ParticipantResolverContext\
    \ ctx, Hashtable data, String approvalNodeName)\n```\n\nThere are 3 parameters\
    \ passed from workflow. The first one is context same as `BLTHContext` or `WorkflowContext`.\
    \ The second parameter `HashTable` has key `TASK_TAG` contain admin task name.\
    \ The last parameter `string` contain node name in workflow.\n\n### 6.1.2 Code\
    \ Example: Participant Resolver API\n\nThis example uses the workflow `SingleStepApproval`.\
    \ The `SingleStepApproval` workflow has 2 approvers; the primary approver and\
    \ default approver. The primary approver calls our `ParticipantResolver` code.\
    \ For default approver, we use our administrator.\n\nOur requirement want the\
    \ primary approver is `manager` or `manager` is approver. If user does not have\
    \ `manager of manager`, use `manager`. If user does not have `manager`, skip to\
    \ default approver.\n\nCode\n\n3. Compile our java code: `com.book.idm.etc.MgrOfMgrParticipantResolver`\n\
    4. Copy class (include package folder `com.book.idm.etc` ) to folder `<server>\\\
    IdentityMinder.ear\\custom`\n\nConfiguration: Management Console\n\n1. In the\
    \ Management Console, click `Environments`.\n2. Click the name of the environment.\n\
    3. Click `Advanced Settings`.\n4. Click `Workflow Participant Resolvers`.\n5.\
    \ Click `new` button and put value as the below table\n\n| Field Name | Value\
    \ | Description |\n| :--- | :--- | :--- |\n| Name | MgrOfMgrParticipantResolver\
    \ | Name of Participant Resolver |\n| Class | com.book.idm.etc.MgrOfMgrParticipantResolver\
    \ | Name of our java class |\n\nConfiguration: Identity Manager User Console\n\
    \n1. Log into the Identity Manager User Console as administrator.\n"
