  trans: "\n\n## 2.3 配置 (Provisioning)\n\n本主题的目标是理解配置的工作原理。实现配置需要以下 4 个配置步骤：\n\n*\
    \ 步骤 1：获取端点 (Endpoint)\n    * 端点可以是 Microsoft Active Directory 或数据库。\n* 步骤 2：创建账户模板\n\
    \    * 链接到端点。\n    * 账户模板定义了全局用户与账户之间的属性映射。\n* 步骤 3：创建配置角色 (Provisioning Role)\n\
    \    * 链接到账户模板。\n    * 一个配置角色可以拥有多个账户模板。\n* 步骤 4：将用户添加到配置角色\n\n整个步骤如图片所示。\n\n\
    | ![](img/image_rsrc8RW.jpg) |\n| 图 2-30 显示了所有步骤和相关界面。 |\n\n### 2.3.1 账户模板与属性映射\n\
    \n账户模板定义了（全局）用户如何在受管端点中被表示。默认情况下，账户模板使用规则字符串（Rule String）定义映射，例如 `%USA%` 或 `%UC%`。您可以在官方文档《管理指南》(Administration\
    \ Guide)中查看更多详细信息。定义映射有两种方式：\n\n1. 规则字符串：官方文档为某些属性定义了规则字符串，但并非所有属性。\n2. 全局用户属性：如果没有规则字符串映射，则可以使用此项。格式为\
    \ `%#<attribute name>%`。\n\n例如，账户模板中的城市（city）属性，您可以放置：\n\n* 规则字符串：`%UC%`\n* 全局用户属性：`%#eTCity%`\n\
    \n两种方式的结果相同。下图显示了账户模板中全局用户的属性城市值。\n\n| ![](img/image_rsrc8RX.jpg) |\n| 图 2-31\
    \ 显示了账户模板中的全局用户属性。 |\n\n另一个使用全局用户属性的示例是图片中的账户容器（container）。例如，如果 `eTGlobalUser`\
    \ 具有 `eTLocation=northamerica`，那么容器将是 `eTADSOrgUnitName=Users`、`eTADSOrgUnitName=NorthAmerica`。这些值都是全局用户属性。\n\
    \n| ![](img/image_rsrc8RY.jpg) |\n| 图 2.32 显示了账户模板和全局用户属性界面 |\n\n### 2.3.2 配置目录\
    \ (Provisioning Directory)\n\n您可以从配置目录获取全局用户属性。您必须使用 LDAP 客户端（如 JXplorer）连接配置目录。您可以从管理控制台（Management\
    \ Console）获取配置存储信息。选择配置存储并检查 URL。\n\n| ![](img/image_rsrc8RZ.jpg) |\n| 图 2-33\
    \ 显示了配置目录的连接性。 |\n\n全局用户（类：`eTGlobalUser`）\n\n在配置目录内部，浏览到路径 `eTGlobalUserContainerName=Global\
    \ Users, eTNamespaceName=CommonObjects, dc=im, dc=eta`，这里保留了所有全局用户。\n\n选择一个用户，您可以查看属性名称和值。（您可以在账户模板中使用此属性名称）\n\
    \n| ![](img/image_rsrc8S0.jpg) |\n| 图 2-34 显示了全局用户的路径和属性 `eTCity`。 |\n\n账户（类：`eTADAccount`）\n\
    \n如果您已经在端点 Active Directory 中拥有某些账户，请浏览路径 `eTADSDirectoryName=<Endpoint Name>,\
    \ eTNamespaceName=ActiveDirectory, dc=im, dc=eta`。它代表端点（Active Directory）。\n\n\
    | ![](img/image_rsrc8S1.jpg) |\n| 图 2-35 显示了账户对象的属性 |\n\n### 2.3.2 账户详情\n\n`eTADSDirectory`\
    \ 路径下的对象 `eTADAccount` 代表账户。如果您直接在账户对象 (`eTADAccount`) 中修改某些值，该值将立即反映在 Active\
    \ Directory 中。例如，我们将 `eTADSl`（代表 City）的值从“New York”更改为“New York Test”，查看 Active\
    \ Directory，该值也会随之更改。\n\n| ![](img/image_rsrc8S2.jpg) |\n| 图 2-36 显示了 `eTADAccount`\
    \ 与 AD 账户之间的关系 |\n\n我们不建议直接在账户对象 (`eTADAccount`) 内部更改任何值，因为 CA IdentityMinder\
    \ 将其视为一个内部处理过程。当您进行编程并尝试修改值但遇到错误时，这可能对调试有用。您可以打印该值并直接将其放入账户对象。让我们看看是否允许。\n\n访问全局用户或账户的另一种选择是使用配置管理器\
    \ (Provisioning Manager)，但您无法从界面看到属性名称。\n\n### 2.3.3 属性映射：用户 - 全局用户 - 账户\n\n为了更好地理解，本节描述了从用户到全局用户以及从全局用户到账户的属性映射。\n\
    \n#### 用户存储 (User Store)\n\n从管理控制台检查用户存储连接信息，并使用任何 LDAP 客户端（如 JXplorer）登录用户存储。\n\
    \n| ![](img/image_rsrc8S3.jpg) |\n| 图 2.-37 显示了用户存储连接性 |\n\n我们可以在管理控制台中查看属性映射：用户属性到全局用户属性的映射。在管理控制台中，选择\
    \ 环境 (Environment) > 您的环境 > 高级设置 (Advanced Settings) > 配置 (Provisioning) > 属性映射\
    \ (Attribute Mappings)。\n\n| ![](img/image_rsrc8S4.jpg) |\n| 图 2-38 显示了管理控制台中的属性映射\
    \ |\n\n下图显示了如何从用户映射城市属性。用户的属性 `l` 通过管理控制台中的属性映射映射到全局用户的属性 `eTCity`。全局用户的属性通过账户模板映射到账户。\n\
    \n| ![](img/image_rsrc8S5.jpg) |\n| 图 2-39 显示了从用户到账户的属性映射 |\n\n### 2.3.4 同步 (Synchronization)\n\
    \n我们学习了如何从用户映射属性，下一步我们需要学习它是如何工作的。\n\n#### 创建了全局用户？\n\n当用户拥有配置角色时，将创建全局用户。在我们的示例中，使用默认值\
    \ = all。\n\n| ![](img/image_rsrc8S6.jpg) |\n| 图 2-40 显示了何时创建全局用户 |\n\n#### 属性同步？\n\
    \n如果您在管理任务的“每个事件”中选择 `账户同步 (Account Synchronization)` 选项，将开始同步。\n\n| ![](img/image_rsrc8S7.jpg)\
    \ |\n| 图 2-41 显示了账户同步下拉菜单 |\n\n什么是用户同步？\n\n管理任务中的 `用户同步 (User Synchronization)`\
    \ 下拉菜单将触发身份集 (Identity Set)。我们将在下一个主题中讨论身份集。\n\n| ![](img/image_rsrc8S8.jpg) |\n\
    | 图 2-42 显示了用户同步下拉菜单 |\n\n## 2.4 身份集 (Identity Set) 与 Policy Xpress\n\n回到我们示例的需求，我们创建了：\n\
    \n* 策略集：将城市映射到国家\n* Policy Xpress：拼接办公室号码和分机号。\n\n| ![](img/image_rsrc8S9.jpg)\
    \ |\n| 图 2-43 显示了如何实现需求。 |\n\n### 2.4.1 身份集\n\n身份策略是用户满足某些条件时发生的一系列业务更改。打开 IdentityMinder\
    \ 管理控制台，选择策略（Policies）选项卡，点击子菜单 `创建身份集 (Create Identity Set)`。\n\n| ![](img/image_rsrc8SA.jpg)\
    \ |\n| 图 2-44 显示了“创建身份集”菜单 |\n\n#### Profile 选项卡\n\n在第一个选项卡 Profile 中，放置以下值：\n\
    \n| 字段名称 | 值 | 描述 |\n| :--- | :--- | :--- |\n| Name | Set Office Address | 策略集名称\
    \ |\n| Category | Book Example | 类别名称 |\n| Description | Set Office Address |\
    \ |\n\n不要点击提交，点击策略（Policies）选项卡。\n\n| ![](img/image_rsrc8SB.jpg) |\n| 图 2-45 显示了\
    \ Profile 选项卡中的值 |\n\n#### Policies 选项卡\n\n此选项卡包含部分：策略集成员规则 (Policy Set Member\
    \ Rule) 和身份策略 (Identity Policies)。策略集成员规则告诉策略适用于谁？在我们的示例中，我们使用默认值 = all，这意味着所有用户都符合此成员规则。\n\
    \n| ![](img/image_rsrc8SC.jpg) |\n| 图 2-46 显示成员规则 == 所有用户 |\n\n接下来，我们需要创建一个身份策略：当城市\
    \ = “New York”时设置地址。点击添加 (Add) 按钮，放置值：\n\n| 字段名称 | 值 |\n| :--- | :--- |\n| Policy\
    \ Name | New York Address |\n| Policy Condition | |\n| City | New York |\n| Action\
    \ on Apply Policy | |\n| Country | United States |\n| | |\n\n点击“确定”，将返回策略（Policies）界面。\n\
    \n| ![](img/image_rsrc8SH.jpg) |\n| 图 2-47 显示了定义身份策略的界面 |\n\n| ![](img/image_rsrc8SJ.jpg)\
    \ |\n| 图 2-48 显示了策略任务的完成 |\n\n为其他城市点击添加按钮\n\n| 策略名称 | 策略条件 | 应用策略时的操作选择“设置<单值用户属性>为<值>”\
    \ |\n| :--- | :--- | :--- |\n| Toronto Address | City =Toronto | Country =Canada\
    \ |\n| Buenos Aires Office | City=Buenos Aires | Country =Argentina |\n| Tokyo\
    \ Office | City=Tokyo | Country =Japan |\n\n"
