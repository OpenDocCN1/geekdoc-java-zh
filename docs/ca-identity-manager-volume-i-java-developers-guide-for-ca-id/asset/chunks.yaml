- fmt: "\n`CA IdentityMinder` is shipped with a predefined business logic task handler\
    \ that checks for possible duplication of objects before object creation. For\
    \ example, the name of a newly created role must be unique. When a role is about\
    \ to be created, the predefined business logic task handler validates whether\
    \ the name of the new role already exists. If the name does exist, the handler\
    \ throws an exception indicating that the role name must be unique, and the administrator\
    \ has the opportunity to change the name and resubmit the task.\n\nWe can write\
    \ code by using `ProviderAccessor` search role name.\n\n```java\nboolean isUnique\
    \ = false;\ntry{\n    //Search by friendlyName\n    AccessRole role = blthContext.getAccessRoleProvider().findAccessRole(roleName);\n\
    }catch(NoSuchObjectException e){\n    isUnique = true;\n}\nif(!isUnique){\n  \
    \  IMSException imsEx = new IMSException();\n    imsEx.addUserMessage(“The role\
    \ name must be unique”);\n    throw imsEx;\n}\n```\n\n## Disable a user account\
    \ after the maximum failed login attempts\n\nAfter a user fails to log in three\
    \ consecutive times, the account is immediately disabled in the data store. Because\
    \ the account is updated directly in the data store rather than in the task session,\
    \ `CA IdentityMinder` does not generate an event for this action, and any workflow\
    \ approval process, auditing, and security checks that may be associated with\
    \ this action are bypassed. After the final login attempt, a custom message advises\
    \ the user that the account is disabled.\n\nThe use case said the user account\
    \ is updated (disable) directly in the data store. This use case mean using `ProviderAccessor`\
    \ update user attributes directly. (For update account attribute directly, please\
    \ see book volume II)\n\n## Assign a user to a group during self-registration\n\
    \nA user who self-registers with the job title Benefits Administrator is assigned\
    \ to the group HR. This update is made in the task session, through a call to\
    \ `assignResources()` in `RelationshipTabHandler`. This update triggers the event\
    \ `AddToGroupEvent`, allowing the group assignment to be subject to auditing and\
    \ workflow approval.\n\nWe use business logic task handler modify the value in\
    \ tab as below code.\n\n```java\nfor (TabHandler tab : tabs) {\n    RelationshipTabHandler\
    \ rTab = (RelationshipTabHandler)tab;\n    rTab.assignResources(groups);\n}\n\
    ```\n\n## Assign “manager” attribute for a new user\n\nAn administrator wants\
    \ to set a value of “manager” before the profile is displayed on the screen. A\
    \ business logic task handler could be written that would implement the `handleSetSubject()`\
    \ method for initialization. This method would assign the administrator’s name\
    \ to the attribute for the manager’s name. If the name of the administrator is\
    \ not available, an exception is thrown.\n\nWe write code in method `handleSetSubject`\
    \ to initial the manager attribute.\n\n```java\npublic void handleSetSubject(BLTHContext\
    \ blthContext) throws Exception {\n    String managerId = blthContext.getAdminFriendlyName();\n\
    \    if(managerId == null){\n        throw new IMSException(“administrator’s name\
    \ is not available”);\n    }\n    HashMap<String, String> screenFields = new HashMap<String,\
    \ String>();\n    screenFields.put(“managerId”, managerId);\n    tab.updateRawData(screenFields);\n\
    }\n```\n\n## 4.6 Conclusion\n\nThis chapter we learn basic programming of Business\
    \ Logic Task Handler API Concepts. We can make short note as follow:\n\n### Implement\
    \ business logic task handler\n\n- There are 2 steps: coding and configuration.\n\
    - For Coding, you have to write java class that extends `BLTHAdapter` and override\
    \ methods as need.\n    - `handleStart()`, it will call when user select admin\
    \ task.\n    - `handleSetSubject()` for setting field before display.\n    - `handleValidation()`\
    \ for validating.\n    - `handleSubmission()` will execute when user submit, after\
    \ validation.\n    - Compile and copy to folder `\\IdentityMinder.ear\\custom`.\n\
    - There are 2 levels of BLTH configuration: global and task-specific.\n\n### Access\
    \ to managed objects\n\n- There are 2 ways: by `ProviderAccessor` and `BLTHConext`\
    \ (task session)\n- `BLTH`, we have to consider:\n    - What is primary object?\n\
    \    - The modified attributes are defined in admin task?\n\n### Programming Note\n\
    \n- The user’s attribute names in code are the physical names in user store.\n\
    - You can use `getRawData()` and `setRawData()` access the values on screen.\n\
    - We can display message on screen by `IMSException` object.\n- We can use session\
    \ keeps value and share between methods.\n\nThe Business Logic Task Handler API\
    \ performs business logic in synchronous phase. In asynchronous phase, we use\
    \ workflow perform business logic. The next chapter is workflow.\n\n# Chapter\
    \ 5 Workflow\n\nThe `CA IdentityMinder` official document does not have much detail\
    \ about work flow. We learned some basic concepts from previous chapter:\n\n-\
    \ If requirement requires approver, you need workflows.\n- Workflow runs under\
    \ asynchronous phase.\n- Workflows can have a long life. It may take time up to\
    \ an hour or month.\n- The Business Logic Task Handler has been done before workflow\
    \ start.\n\nThis chapter, you will learn both workflow API and how to create custom\
    \ workflow.\n\n## 5.1 Workflow Concepts\n\nYou must enable workflow in Management\
    \ Console. By default, workflow is disabled.\n\n**Configuration: Management Console**\n\
    \n1. In the Management Console, select an Environment.\n2. Go to Advanced Settings,\
    \ Workflow.\n3. Select the Enabled check box, and click Save.\n4. Restart the\
    \ application server.\n\n![](image_rsrc8UM.jpg)\n\nFigure 5-1 shows workflow properties\
    \ in Management Console\n\nIn the event mappings table, there are some default\
    \ mappings between event and global workflow process. It means when any events\
    \ in this table start, workflow will be executed. We do not modify any values.\n\
    \n### 5.1.1 Default Workflow Features\n\nThis section, we will learn default workflow\
    \ features in `CA IdentityMinder`. We cover these topics:\n\n- Workflow Level:\
    \ workflow can run admin task level.\n- Select Workflows: which workflow can execute.\n\
    - Policy Base: it is condition to start workflow.\n- Task and screen for Approver.\n\
    - Approver: who is approver.\n- Expected Outcome: the final result: approve or\
    \ reject.\n\n#### Workflow Level\n\nWorkflow can run at admin task and/or Event\
    \ level. What level should be? It is depending on requirements. For example, we\
    \ have admin task “Modify User”, our admin task has 2 tabs: Profile Tab and Access\
    \ Role Tab. So events will be generated from this admin task divides as 2 groups:\n\
    \n- The first group of events came from profile tab; events will be generated\
    \ when user’s attributes have modified.\n- The second group of events came from\
    \ access role tab; events will be generated when we add or remove access role.\n\
    \n![](image_rsrc8UN.jpg)\n\nFigure 5-2 shows all events from example admin task.\n\
    \nWe have 2 requests: request to modify user’s attributes from the profile tab\
    \ and another one request to add/remove role from the access role tab.\n\n- **Scenario1**:\
    \ all requests (both modify user’s attributes and add/remove role) need only one\
    \ workflow for approval, we should specific workflow as Admin Task Level.\n- **Scenario2**:\
    \ only modify user’s attributes request (profile’s tab) require approver, we should\
    \ specific workflow at Event Level: `ModifyUserEvent`.\n- **Scenario3**: only\
    \ add role (access role tab) request requires approver, we should specific workflow\
    \ at Event Level: `AssignAccessRoleEvent`.\n- **Scenario4**: Any requests (modify\
    \ user’s attributes and add/remove role) require Manager as first approver.\n\
    \    - Modify user’s attributes request requires HR manager as second approver.\n\
    \    - Adding role request requires IT manager second approver.\n\nWe specific\
    \ the first approver workflow at Admin Task Level and the HR and IT workflow at\
    \ Event Level: `ModifyUserEvent` and `AssignAccessRoleEvent`. This case shows\
    \ in the picture below.\n\n![](image_rsrc8UP.jpg)\n\nFigure 5-3 shows workflow\
    \ of Scenario4.\n\nAdmin Task Level\n"
