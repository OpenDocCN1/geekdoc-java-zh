  trans: "\n\n连接器是与端点的软件接口。`Provisioning Server` 使用连接器与端点通信。它将 `Provisioning Server`\
    \ 的操作转换为端点上的更改，例如“在 Microsoft Exchange 端点上创建一个新的电子邮件账户”。\n\n`Connector Servers`\
    \ 是一个管理连接器的服务器组件。连接器服务器有两种类型：\n\n* `CA IAM Connector Server` (`CA IAM CS`) 管理用\
    \ `Java` 编写的连接器\n* `C++ Connector Server` (`CCS`) 管理用 `C++` 编写的连接器\n\n由于连接器和代理程序（Agents），某些连接器需要在其管理的系统中安装一个代理程序以完成通信周期。\n\
    \n`Connector Xpress` 是 CA IdentityMinder 的实用程序，用于管理动态连接器、将动态连接器映射到端点以及为端点建立路由规则。你可以使用它配置动态连接器，允许对\
    \ SQL 数据库和 LDAP 目录进行配置和服务。\n\n### 其他组件\n\n`WorkPoint` 工作流引擎和 `WorkPoint Designer`\
    \ 在安装 `CA IdentityMinder` 时会自动安装。这些组件允许你将 `CA IdentityMinder` 任务置于工作流控制下，并修改现有的工作流定义或创建新定义。\n\
    \n`Provisioning Manager` 是一个管理全局用户和配置服务器选项的图形化界面。你也可以使用 `Provisioning Manager`\
    \ 来管理端点或账户。\n\n## 1.5 服务器配置\n\n本书假设你已经安装并配置了：\n\n* `CA IdentityMinder` 和用户库。\n\
    * `Provisioning Server`、`provisioning manager` 和 `provisioning directory`。\n*\
    \ `Connector server`\n* `Wokpoint designer`\n\n我的建议是配置一个 `Microsoft Active Directory`\
    \ 端点，配置账户模板和配置服务角色会更好。你应该在 `IDM` 系统中拥有一些用户和账户。\n\n### 用户库属性\n\n在书中，我们要求 `City`\
    \ 和 `telephone number` 属性作为主要，但其他章节还需要额外的属性。我们将创建 3 个管理任务：\n\n* `Update Location\
    \ and Ext Number`，几乎用于每一个章节。\n    * 需要属性：`L`（或 `City`）。\n    * 需要属性：`telephoneNumber`。\n\
    \    * 在第 2 章节中，我们的 `Express` 策略示例需要 `state`。\n* `Update office`，用于第 6 章节：仅限 `Logical\
    \ Attribute API`\n    * 需要属性：`L`（或与之前的 `City` 相同）\n* `Update Employee Number`，用于第\
    \ 6 章节：仅限 Validation Rule\n    * 需要属性：`employee number`\n\n请检查 `Management Console`，选择\
    \ `Directory` > `User Store` (`Cooperate Store`) > `User` 并检查属性。\n\n| ![](img/image_rsrc8PT.jpg)\
    \ |\n| 图 1-4 显示显示名称 |\n\n### 全局用户属性\n\n在 `Management Console` 中，选择 `Directory`\
    \ > `Provisioning Store` > `Global User` 并检查属性 `Physical Name` 和 `eTCity`。\n\n\
    | ![](img/image_rsrc8PU.jpg) |\n| 图 1-5 显示 `eTCity` 的显示名称 |\n\n### 属性映射\n\n在 `Management\
    \ Console` 中，选择 `Environment` > `your environment` > `Advanced Settings` > `Provisioning`\
    \ 并检查属性映射：`User Attribute` `l` 映射到 `Provisioning Attribute` `eTCity`。\n\n| ![](img/image_rsrc8PV.jpg)\
    \ |\n| 图 1-6 显示属性映射 |\n\n## 1.6 结论\n\n我们介绍了自定义代码和服务器配置的优势。在下一章中，你将学习 CA IdentityMinder\
    \ 管理的基本概念。\n\n# 第 2 章 管理概念\n\n如果你熟悉 `CA IdentityMinder`，可以快速跳过本章。在本章中，你将学习：\n\n\
    * 如何创建管理任务\n* 配置（Provisioning）是如何工作的\n* `Identity Policy Set` 和 `Policy Xpress`\
    \ 是如何工作的\n* 理解已提交的任务和事件\n\n在一个章节中解释所有的管理功能是困难的。我们将只关注与编程相关的部分。如果你是 `CA IdentityMinder`\
    \ 的新手，可能会因为许多功能而容易迷失。我们将使用 `admin task` 作为主要主题。\n\n## 2.1 要求\n\n在本章中，我们将通过管理员工具实现需求。\n\
    \n### 需求\n\n我们的需求需要一个界面来修改 `city`（城市）和分机电话号码（extension telephone number）。需求可以写为如下步骤：\n\
    \n* `Step1`：以管理员身份登录 `Identity Manager User Console`，并选择表单“Update location and\
    \ Ext Number”。\n    * 从下拉菜单选择 `city`\n    * 填写 `extension number`\n    * 点击 `submit`\n\
    * `Step 2`：系统更新用户属性：\n    * 更新 `city` 属性并根据 `city value` 设置 `country`。\n    *\
    \ 拼接 `office number` 和 `extension number`。\n* `Step 3`：系统更新账户属性；`city` 和 `telephone\
    \ number`。\n\n### 设计\n\n我们将通过以下方式实现每个需求的步骤：\n\n* `Step 1`：提供界面\n    * 创建 `admin\
    \ tasks` 和带有 2 个属性的界面：`city` 和 `extension number`。\n* `Step 2`：处理\n    * 我们使用\
    \ `Policy Set` 将 `city` 映射到 `country`。\n    * 我们使用 `Policy Xpress` 拼接 `office\
    \ number` 和 `extension number`。\n* `Step 3`：配置（Provisioning）\n    * 配置 `attribute\
    \ mapping`\n    * 执行 `account synchronization` |\n\n| ![](img/image_rsrc8PW.jpg)\
    \ |\n| 图 2-1 显示如何实现需求。 |\n\n## 2.2 创建管理任务\n\n`Admin tasks` 是主要功能之一。几乎所有的需求都从 `admin\
    \ tasks` 开始。`Admin task` 是用户在 `CA IdentityMinder` 中可以执行的管理功能。`Admin Tasks` 可以是\
    \ `Create User`、`View User`、`Modify User`、`Reset User Password` 等。我们可以在菜单 `home`\
    \ 或 `users > tasks` 下看到管理任务。\n\n| ![](img/image_rsrc8PX.jpg) |\n| 图 2-2 显示控制台中的管理任务\
    \ |\n\n我们将从创建 `Admin Tasks` 开始。\n\n* 以管理员身份登录 `Admin Console`。\n* 点击标签页 `Roles\
    \ and Tasks` > `Admin Tasks` > `Create Admin Task`。\n* 然后选择“Create a new Admin\
    \ Task”并点击 `OK`。\n\n| ![](img/image_rsrc8PY.jpg) |\n| 图 2-3 显示管理任务菜单 |\n\n当你选择创建管理任务时，屏幕将显示\
    \ 5 个标签页（见下文）：\n\n1. `Profile tab` 包含常规信息（`name`）、如何在菜单中显示、什么是主对象和操作（`action`）、`Synchronization`\
    \ 何时工作以及扩展编程。（注：原文中有处拼写错误）\n2. `Search tab` 与 `primary object` 相关；你如何搜索 `primary\
    \ object`。\n3. `Tabs tab` 用于添加任务。\n4. `Fields tab` 显示 `admin task` 中有多少个字段。\n\
    5. `Events tab` 显示提交管理任务后将生成多少事件。\n\n| ![](img/image_rsrc8PZ.jpg) |\n| 图 2-4 显示创建任务时的\
    \ 5 个标签页 |\n\n### 2.2.1 Profile Tab\n\n在 `profile tab` 中有 5 个部分：\n\n1. `General\
    \ Information`\n有 3 个字段\n| Field Name | Value | Description |\n| :--- | :--- |\
    \ :--- |\n| Name | Update Location and Ext Number | 任务名称将在菜单中显示 |\n| Tag | `BasicUpdateLocNo`\
    \ | 任务的唯一值 |\n| Description | Example for Administrative | 描述 |\n\n| ![](img/image_rsrc8R0.jpg)\
    \ |\n| 图 2-5 显示菜单上的名称 |\n\n2. 如何在菜单中显示？\n`Admin Task` 有界面，所以我们必须决定界面在哪里。有 3 个字段\n\
    | Field Name | Value | Description |\n| :--- | :--- | :--- |\n| Task Order | 1\
    \ | 指定在菜单中的显示顺序 ![](img/image_rsrc8R1.jpg) |\n| Category | Book Example | 类别作为标签页显示在屏幕顶部，按数字降序\
    \ ![](img/image_rsrc8R2.jpg) |\n| Category Order | 11 |\n| Category 2 | Tasks\
    \ | 指定第二/三级类别，作为类别标签列表下方的链接出现 ![](img/image_rsrc8R3.jpg) |\n| Category 2 Order\
    \ | 0 |\n| Category 3 | Basic |\n| Category 3 Order | 0 |\n\n| ![](img/image_rsrc8R4.jpg)\
    \ |\n| 图 2-6 显示类别值 |\n\n3. 什么是主对象和操作？\n这非常重要。它就像是问题：你想做什么？我想修改用户信息。所以主对象应该是 `user`，操作应该是\
    \ `modify`。\n\n| Field Name | Value | Description |\n| :--- | :--- | :--- |\n\
    | Primary Object | User | 指定任务操作的对象 |\n| Action | Modify | 指定在对象上执行的操作 |\n\n"
- fmt: '

    This section describes synchronization behavior after submitted this task. There
    are 2 type of synchronization:


    - `User Synchronization` means task will synchronize users with “identity policies
    set”.

    - `Account Synchronization` means any modification in this task will synchronizes
    with global user and accounts.


    There are 3 choices to tell when we want synchronization execute:


    - `None`: do nothing, do not synchronization.

    - `On Task completion`: means when task complete, it will trigger synchronization.

    - `On Every Event`: when task has been submitted, many events will be generated.
    Synchronization will occur on every event complete. This option may impact performance
    because synchronization may occur more than one time.


    | Field Name | Value | Description |

    | :--- | :--- | :--- |

    | User Synchronization | On Task completion | It will synchronize users with “identity
    policies” after task complete |

    | Account Synchronization | On Task completion | It will synchronize account in
    endpoint after task complete |

    | ![](image_rsrc8R5.jpg) | | |


    `Figure 2-7 shows value on screen`


    ## 5. Additional features


    All these attributes in this section are useful when we do programming. We will
    cover more details in next chapter.


    | Field Name | Value | Description |

    | :--- | :--- | :--- |

    | Hide In Menus | Do not check | If check, this task does not show in menus. |

    | Public Task | Do not check | If check, this task can call without login. |

    | Enable Auditing | check | If check, records this task in an auditing database
    |

    | Enable Workflow | check | If check, enables workflow at event level. |

    | Enable Web Services | check | If check, this task can call by web services |

    | Workflow Process | Do not thing | If select, support workflow at task level.
    |

    | Task Priority | Medium | Determines the order in which executes tasks. |

    | Business Logic Task Handlers | Do not thing | Associates a business logic task
    handler. |

    | ![](image_rsrc8R6.jpg) | | |


    `Figure 2-8 shows value on screen`


    Do not submit, select “Search” tab.


    ### 2.2.2 Search Tab


    Some tasks need Search screen depending on your primary object. In profile tab,
    we selected primary object is “User” and action is “Modify”. So before we modify
    user, we need to search user to modify. If your primary object is “NONE”, search
    is not necessary.


    | ![](image_rsrc8R7.jpg) | | |


    `Figure 2-9 shows example screen: Search User`


    On tab Search, click browse, select screen Name: “Default Search Screen”, Type:
    “Standard Search Screen”


    | ![](image_rsrc8R8.jpg) | | |


    `Figure 2-10 select screen “Default User Search”`


    Do not submit, click “Tabs” tab move on to next section.


    ### 2.2.3 Tabs Tab


    On user screen, one admin task can have many tabs. Each tab has difference purposes.
    The figure below shows example of admin task “Modify User” has 5 tabs. Each tab
    has own screen.


    | ![](image_rsrc8R9.jpg) | | |


    `Figure 2-11 shows example of tabs in admin Modify User`


    This section, you have to answer 3 things:


    - What type of tab?

    - How many tabs inside this admin task?

    - What’s screen inside each tab?


    #### Type of tab


    There are 3 types of Tab Controller:


    - `Standard Tab Controller`, every tabs will be displayed in top on admin task.
    We can pick any tabs from top.

    - `Wizard Tab Controller`, it will show as step by steps and button will be “Next”.
    Users have to review every screen.

    - `Sequence Tab Controller`, we don’t see any tab on screen but user will see
    button “next”.


    | ![](image_rsrc8RA.jpg) | | |


    `Figure 2-12 shows type of tab comparison`


    In our code, we select `Standard Tab Controller`.


    #### How many tabs inside this admin task?


    Add tab from drop down below. In Our example we want to modify user, so we pick
    Profile. (`UserProfile`)


    | ![](image_rsrc8RB.jpg) | | |


    `Figure 2-13 show how to add tab`


    #### What’s screen inside each tab


    Each tab must have one screen, we click Pencil icon to add screen.


    | ![](image_rsrc8RC.jpg) | | |


    `Figure 2-14 show icon “Pencil” to add screen.`


    Then click Browse to select screen


    | ![](image_rsrc8RD.jpg) | | |


    `Figure 2-15 shows Browse button to select screen`


    Our prototype requires 2 attributes, so we need to create new screen. So we select
    button “New”.


    | ![](image_rsrc8RE.jpg) | | |


    `Figure 2-16 shows our prototype`


    | ![](image_rsrc8RF.jpg) | | |


    `Figure 2-17 shows how to create new screen`


    Then we add name of screen and tag:


    | Field Name | Value |

    | :--- | :--- |

    | Name | Update Location and Ext Number |

    | Tag | UpdateLocationandExtNumber |


    So we need 2 attributes on screens, click Pencil Icon to add attribute.


    | ![](image_rsrc8RG.jpg) | | |


    `Figure 2-18 show Pencil icon to add attribute`


    The first one is City Name that link to user attribute: `city`


    | Field Name | Value | Description |

    | :--- | :--- | :--- |

    | Attribute Name | City | Select from user’s attribute |

    | Style | Dropdown | Display’s style |

    | Name | City | This field will display as label on screen |

    | Source of selection options | Simple List | Display’s style |


    | ![](image_rsrc8RH.jpg) | | |


    `Figure 2-19 shows value of city attribute`


    | ![](image_rsrc8JI.jpg) | | |


    `Figure 2-20 shows value for Ext Number`


    | ![](image_rsrc8RK.jpg) | | |


    `Figure 2-21 shows select screen`


    | ![](image_rsrc8LM.jpg) | | |


    `Figure 2-22 shows confirmation screen`


    You have done with long step. Then click “Fields” tab


    ### 2.2.4 Fields Tab


    The good news for this tab, you don’t need to do anything. You just review fields.
    You will see 2 fields that you used in screen “Update Location and Ext Number”:ExtNumber`
    and `City`. Other attributes are required for primary object.


    | ![](image_rsrc8RN.jpg) | | |


    `Figure 2-23 shows fields tab`


    Then click “submit”


    ### 2.2.5 Event Tab


    Events list in tab Events will not show immediately when we create admin task.
    It will show after we submit to create admin task.


    Go to menu Modify Admin Task. Select Category from dropdown and type “book”. Select
    task “Update Location and Ext Number” and click Select button.


    | ![](image_rsrc8RP.jpg) | | |


    `Figure 2-24 shows search admin task screen`


    Select tab “Events”, you will see event list . In this chapter, we do nothing
    with events tab.


    | ![](image_rsrc8RR.jpg) | | |


    `Figure 2-25 show tab Events`


    How many events will be generated?


    Number and type of events will be generated depending on Primary Object, Action
    and Tab.


    | ![](image_rsrc8RS.jpg) | | |


    `Figure 2-26 shows relationship of event generation`


    ### 2.2.6 Role Use Tab


    This tab will show who can use this admin task. Now you see nothing.


    | ![](image_rsrc8RT.jpg) | | |


    `Figure 2-27 shows Role Use Tab`


    We add admin role “System Manager” to this admin task. Select tab Roles and Tasks
    > Admin Roles > Modify Admin role > Select Admin Role “System Manager” and click
    Tasks tab.


    | ![](image_rsrc8RU.jpg) | | |


    `Figure 2-28 shows Admin Role Screen`


    Scroll down to bottom of screen, select Filter by category “Book Example” and
    Add Task “Update Location and Ext Number (BookBasicUpdateLocAndExtNo)”


    | ![](image_rsrc8RV.jpg) | | |


    `Figure 2-29 shows selecting our task.`

