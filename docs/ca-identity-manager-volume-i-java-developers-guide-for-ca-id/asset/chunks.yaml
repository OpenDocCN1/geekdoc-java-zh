  trans: "\n\n# 查看提交的任务\n\n查看提交的任务对于开发者理解 CA IdentityMinder 的行为非常重要。在提交了管理员任务后，你可以去“查看提交的任务”中检查状态。选择\
    \ `System`（系统）标签页，选择菜单 `View Submit Task`（查看提交的任务）并点击 `Search`（搜索）。\n\n| ![](img/image_rsrc8SZ.jpg)\
    \ |\n| 图 2-61 显示了查看提交的任务界面 |\n\n找到你提交的任务，应该是最新的一个。点击图标 `![](img/image_rsrc8T0.jpg)`\
    \ 查看内部详情。\n\n| ![](img/image_rsrc8T1.jpg) |\n| 图 2-62 显示了我们提交的任务。 |\n\n提交任务详情中有\
    \ 2 个有趣的地方：\n\n*   `Task History`（任务历史）告诉我们匹配了多少身份策略集（Identity Policy Set）或 `Policy\
    \ Xpress`。\n*   `Included Event`（包含事件）告诉我们生成了多少个事件。\n\n| ![](img/image_rsrc8T2.jpg)\
    \ |\n| 图 2-63 显示了任务历史和包含事件 |\n\n按顺序生成了 7 个事件：\n\n1. **事件 1：修改用户**\n   生成此 `Modify\
    \ user`（修改用户）是因为我们修改了用户的属性：`city`（城市）。它是在提交任务后生成的（主对象为 `User`，操作为 `Modify`）。选择\
    \ `pencil`（铅笔）图标查看更多详细信息。它将在提交任务后显示新值和旧值。\n\n| ![](img/image_rsrc8T3.jpg) |\n\
    | 图 2-64 显示生成事件 1：修改用户是因为我们修改了 city 属性。 |\n\n此事件完成后，`User Store`（用户存储库）中的 `city`\
    \ 属性将发生更改。\n\n| ![](img/image_rsrc8T4.jpg) |\n| 图 2-65 显示事件 1：修改用户完成后，city 属性已更改。\
    \ |\n\n2. **事件 2：同步用户**\n   生成此事件是因为当我们在管理员任务中选择下拉菜单 `User Synchronization: On`（用户同步：开启）任务完成时。当此事件生成时，它将触发我们的策略集：`Set\
    \ Office Address`（设置办公室地址）。\n\n| ![](img/image_rsrc8T5.jpg) |\n| 图 2-66 显示通过 User\
    \ Synchronization Synchronization 生成了事件 2。 |\n\n3. **事件 3：修改用户**\n   此事件由 `Policy\
    \ Xpress` 生成。`Policy Xpress` 设置了 `Business Phone`（业务电话）的值。此事件完成后，`User Store`\
    \ 中的 `telephone number`（电话号码）属性值已更改。\n\n| ![](img/image_rsrc8T6.jpg) |\n| 图 2-67\
    \ 显示事件 3 由 policy Xpress 生成以修改电话号码。 |\n\n4. **事件 4：修改用户**\n   此事件由 `Identity Policy\
    \ Set`（身份策略集）生成。`Identity Policy` 设置了属性 `country`（国家）。此事件完成后，`User Store` 中的 `country`\
    \ 属性值已更改。\n\n| ![](img/image_rsrc8T7.jpg) |\n| 图 2-68 显示事件 4 由 Identity Policy\
    \ Set 生成修改属性 country。 |\n\n5. **事件 5：同步配置角色并为用户添加账户。**\n   生成此事件是因为用户具有配置角色且选择了\
    \ `User Synchronization`（用户同步）选项。此事件用于在 `Endpoint`（终端）中创建账户。如果你已经在 `Endpoint`\
    \ 中拥有账户，则此事件将无操作。你可以在 `TASK SESSION` 中查看账户创建详情：创建：0，更新：0，重建：0，失败：0。\n\n| ![](img/image_rsrc8T8.jpg)\
    \ |\n| 图 2-69 显示了事件 5 的详情。 |\n\n6. **事件 6：同步用户**\n   此事件在修改用户事件后由 `Policy Xpress`\
    \ 生成。我们知道这一点是因为 `Attribute Changed`（属性更改）中的值来自 `Policy Xpress`。\n\n| ![](img/image_rsrc8T9.jpg)\
    \ |\n| 图 2.70 显示了事件 6 的详情。 |\n\n7. **事件 7：与账户同步用户属性的事件详情**\n   生成此事件是因为我们在管理员任务屏幕上选择了\
    \ `Account Synchronization: On Task Complete`（账户同步：任务完成后开启）选项。此事件将更新全局用户和账户的属性。\n\
    \n| ![](img/image_rsrc8TA.jpg) |\n| 图 2-71 显示了事件 7 的详情。 |\n\n在所有事件完成后，去 CA IdentityMinder\
    \ 的 `User Store`、`Provisioning Directory`（配置目录）和 `Endpoint`（`Active Directory`）检查用户属性。\n\
    \n| ![](img/image_rsrc8TB.jpg) |\n| 图 2-72 显示了用户、全局用户和账户的属性 |\n\n提交管理员任务时，你需要知道：\n\
    *   将生成多少个事件？\n*   哪个组件生成事件？\n*   事件的预期结果是什么？\n\n| ![](img/image_rsrc8TC.jpg)\
    \ |\n| 图 2-73 显示了我们示例中的所有事件。 |\n\n### 限制性\n\n我们的管理员任务有一些限制：\n*   它无法显示分机号的当前值。\n\
    *   分机号没有验证。\n*   如果我们只更改分机号而不更改城市值，CA IdentityMinder 将认为此任务中没有发生变化。\n\n我们可以通过编程轻松修复这些局限性。\n\
    \n| ![](img/image_rsrc8TD.jpg) |\n| 图 2.-74 显示我们只更新分机号而不更新 city 属性时的消息 |\n\n##\
    \ 2.6 结论\n\n在本章中，我们创建了管理员任务并使用管理员工具来实现需求。我们学习了：\n*   如何创建管理员任务\n*   配置是如何工作的\n\
    *   `Identity Policy Set` 和 `Policy Xpress` 如何工作\n*   理解事件\n\n## 3 编程概念与配置 IDE\n\
    \n在本章中，我们将学习：\n*   同步和异步阶段\n*   API 概览\n*   配置 IDE\n\n## 3.1 API 概览\n\nCA IdentityMinder\
    \ 有 2 类型的编程：\n*   `Java`（Java 编程）：执行逻辑。\n*   `Connector`（连接器）：用于连接终端。\n\n连接器在另一书中。我们将首先关注\
    \ Java 编程。\n\n### 同步与异步阶段\n\n在开始任何 API 之前，你需要理解同步与异步阶段。\n\n管理员任务的执行分为以下两个阶段：\n\
    *   **同步阶段**在任务提交期间处理用户响应。此时任务尚未拆解为事件。\n*   **异步阶段**在任务提交后处理用户响应。任务已拆解为事件。它可能需要一小时到一个月。\n\
    \n| ![](img/image_rsrc8TE.jpg) |\n| 图 3-1 显示同步和异步阶段 |\n\n### 3.1.1 业务逻辑处理 API\
    \ (BLTH)\n\n业务逻辑处理或 `BLTH API` 可以在管理员任务级别执行逻辑。BLTH 在同步阶段运行，它可以在任务提交后、任何事件发生前执行。\n\
    \n| ![](img/image_rsrc8TF.jpg) |\n| 图 3-2 显示业务逻辑处理 API 在任务之前之后工作。 |\n\n此 API 非常有用，我们将频繁使用。我们可以从\
    \ BLTH 访问存储库。\n\nBLTH 示例：\n*   管理员执行管理员任务；BLTH 屏幕上初始化某些值。\n*   管理员提交管理员任务；BLTH\
    \ 验证屏幕上的字段。\n*   管理员提交管理员任务；BLTH 执行逻辑或修改存储库中的属性。\n\n### 3.1.2 工作流 API\n\n`Workflow\
    \ API` 在现实需求中非常重要。工作流可以在管理员任务级别或事件级别工作。\n\n| ![](img/image_rsrc8TG.jpg) |\n| 图\
    \ 3-3 显示工作流可以在管理员任务级别或事件级别特定 |\n\n在以下情况下需要工作流：\n*   你的需求需要审批\n*   业务逻辑需要很长的处理时间。我们可以使用工作流在事件级别实现业务逻辑。它将在异步阶段运行。\n\
    \n书中，我们将学习如何通过软件 `WorkPoint` 创建自定义工作流。\n\n工作流示例：\n*   如果用户办公室在纽约，此任务需要 2 个审批者。如果用户办公室在伦敦，此任务需要额外的审批者。\n\
    *   需求在入职日期启用账户。\n\n### 3.1.3 参与者解析 API\n\n此 API 是工作流的一部分。`Participant Resolver\
    \ API` 回答问题：谁是审批者？我们可以为查找审批者实现条件。\n\n示例：\n*   我们希望经理的经理是审批者。\n\n| ![](img/image_rsrc8TH.jpg)\
    \ |\n| 图 3-4 显示工作流有一个需要参与者解析 API 的审批者 |\n\n### 事件监听器 API\n\n"
- fmt: "\nWe can implement custom listener to listen event. When the event occurs,\
    \ the event listener performs business logic during particular states of execution:\
    \ before, after, fail, approve, reject. Event Listener runs under asynchronous\
    \ phase.\n\nExamples:\n\n* After user is created successfully, send message to\
    \ MQ.\n* If administrator rejects on any modify user event, listener writes log\
    \ file.\n\n| ![](image_rsrc8TJ.jpg) |\n| Figure 3-5 shows Event Listener API can\
    \ listen to the event. |\n\n### 3.1.5 Logical Attribute API\n\nLogical Attribute\
    \ API displays an attribute differently than how it is stored physically in a\
    \ user directory. This API should be used when you have the attribute share in\
    \ many screens and you do not want to do translation logic the value on every\
    \ screen.\n\nExample:\n\n* You have physical attribute `“BusinessCategory” keeps\
    \ values as code: `1001`, `2001`, or`3001` but on screen display as Advertising,\
    \ Retail, or Telecommunications.\n\n| ![](image_rsrc8TK.jpg) |\n| Figure 3-6 shows\
    \ Logical Attribute API convert physical value to logical on screen. |\n\n###\
    \ 3.1.6 Validation Rules\n\nIt is used validate field’s value on screen. You can\
    \ write rule at:\n\n* Task-level, it will validate on specific screen.\n* Directory-level,\
    \ it will validate that field every time on any screen.\n\nExample:\n\n* The employee\
    \ number must be number only.\n\n### 3.1.7 Email Template\n\nThere are 2 ways\
    \ to sending email from CA IdentityMinder.\n\n* Email Notification Policies.\n\
    * Email templates\n\nThe email template API is the one of them. We can implement\
    \ by writing template file.\n\n### 3.1.8 Notification Rule\n\nThe notification\
    \ rule determines who receive an email. The notification rule use within email\
    \ template only.\n\nExample:\n\n* Sending email to HR manager after task update\
    \ location complete.\n    * The email template is used for generating email content\
    \ and when email should send.\n    * The notification rule is used for getting\
    \ HR manager’s email.\n\n### 3.1.9 Task Execution Web Service (TEWS)\n\nWe want\
    \ to the third party system execute our admin task, we have to enable TEWS feature.\
    \ The TEWS enables the admin task as web services’ provider.\n\nExamples:\n\n\
    * A user uses a web portal to modify address. The portal calls the enterprise\
    \ service bus (ESB) and then ESB calls web services of admin task to update address.\n\
    \n## 3.2 Task Phases\n\nWe already talked about overview Synchronous and Asynchronous\
    \ Phase. This section will explain phase details of admin task execution and when\
    \ each APIs will be executed.\n\nYou do not need to memorize the whole things\
    \ right now, when you practice example in this book, you will memorize them automatically.\n\
    \n### 3.2.1 Synchronous Phase Operations\n\n1. The user selects an admin task\
    \ to perform.\n    * Business Logic Task Handler API: call `handleStart()` method.\n\
    2. The admin task subject is selected but not yet displayed.\n    * Business Logic\
    \ Task Handler API: call `handleSetSubject()` method.\n    * Default values for\
    \ fields can be initialized with JavaScript or hard-code.\n    * Fields associated\
    \ with physical attributes are automatically populated with the corresponding\
    \ data from the data store.\n3. CA IdentityMinder displays and populates the task\
    \ screen.\n    * Logical Attribute: call method `toLogical()`; to convert physical\
    \ attributes.\n4. CA IdentityMinder invokes Validation Rules during data entry\
    \ when user click validate button (if you have) or user change tab or you have\
    \ logic to validate on change.\n5. User submits the task screen.\n    * Invoke\
    \ Validation Rules.\n    * Logical Attribute API: call method `validate()` to\
    \ performs field-level validation.\n    * Logical Attribute API: call method `toPhysical()`\
    \ to converts logical attributes back to their corresponding physical attributes.\n\
    \    * Business Logic Task Handler API: call method `handleValidation()` to perform\
    \ task-level validation.\n6. User submits the task screen.\n   If validation errors\
    \ occur, the errors are reported to the user immediately. The user is allowed\
    \ to correct the errors and resubmit the task.\n7. CA IdentityMinder instantiates\
    \ events for the task.\n   After all validation is performed successfully, CA\
    \ IdentityMinder creates events. Each transaction is represented by an event.\n\
    8. The task enters the asynchronous phase for processing.\n   There are 3 major\
    \ APIs: Business Logic Task Handler, Validation Rules and Logical Attribute execute\
    \ under synchronous phase. The picture below shows the screen after submit admin\
    \ task. The message “Task pending” means there are event processing behind this\
    \ task or asynchronous phase is starting from now on.\n\n| ![](image_rsrc8TM.jpg)\
    \ |\n| Figure 3-7 shows screen display Task pending |\n\n### 3.2.2 Asynchronous\
    \ Phase Operations\n\n1. CA IdentityMinder posts the events.\n2. Event Listeners\
    \ Perform Pre-Approval Attribute Updates\n    * Event Listener API: call method\
    \ `before()`.\n3. Custom Objects Perform Operations During Workflow Processing\n\
    \    * Participant Resolver API: If workflow specify the participants (approvers)\
    \ for a workflow activity, call method `resolve()` to return list of participants.\n\
    \    * Workflow API: `start`. If workflow is enabled, and an event is mapped to\
    \ a workflow process, the activities in the workflow process must be completed\
    \ before the event can be completed.\n4. Event Listeners Perform Pre-Execution\
    \ Attribute Updates\n    * A workflow process results in either the approval or\
    \ rejection of the event.\n    * When a workflow process is approved, CA IdentityMinder\
    \ executes the associated event.\n        * Event Listener API: call method `approve()`\
    \ or `reject()`.\n5. CA IdentityMinder Executes the Event.\n6. Event Listeners\
    \ Perform Post-Execution Operations\n    * Event Listener API: call method `after()`.\n\
    7. CA IdentityMinder Generates Email Notifications\n    * Email Template API,\
    \ Notification Rule API are called.\n\nThere are 5 APIs: Event Listener, Workflow,\
    \ Participant Resolver, Email Template, and Notification Rule are used under asynchronous\
    \ phase.\n\n## 3.3 Configuring IDE\n\nWe use Eclipse to develop code. Please download\
    \ from book’s web site.\n\nClass path\n\nPlease check Project Properties > Java\
    \ Build Path.\n\nIf you use version 12.6:\n\n* Create class path variable: `IDM_LIB`\n\
    \    * Select windows>preference> class path variable > new\n    * Set to path\
    \ `/server/IdentityMinder.ear/library`\n        * If you use WebLogic, all jars\
    \ locate at `APP-INF/lib`\n\n| ![](image_rsrc8TN.jpg) |\n| Figure 3-8 shows class\
    \ path variable |\n\nIf you use version 12.5, remove all my jars:\n* Add all jar\
    \ from deploy folder `/server/IdentityMinder.ear/library`\n    * If you use WebLogic,\
    \ all jars locate at `APP-INF/lib`\n* Add `identitymanager.jar` from `/server/IdentityMinder.ear/user_console.war/WEB-INF/lib`\n\
    \nImport projects\n\n* Run Eclipse and select import > Existing projects into\
    \ Workspace.\n* Browse archive file, select a project, and click finish.\n\n|\
    \ ![](image_rsrc8TP.jpg) |\n| Figure 3-9 shows import project |\n\n## 3.4 Conclusions\n\
    \nThis chapter introduces 9 APIs of CA IdentityMinder: what they are and when\
    \ they execute. We have already explained about task phase: synchronous and asynchronous\
    \ phase.\n\n* Synchronous phase: Business Logic Task Handler, Validation Rules\
    \ and Logical Attribute.\n* Asynchronous phase: Event Listener, Workflow, Participant\
    \ Resolver, Email Template, and Notification Rule.\n* The Task Execution Web Service\
    \ enables the admin task as web services’ provider\n\nCA provides java doc of\
    \ each APIs through bookshelf > CA IdentityMinder > programming > Javadoc Programming\
    \ Reference. The next chapter will go in details of Business Logic Task Handler\
    \ API.\n\n# Chapter 4 Business Logic Task Handler\n\nBusiness Logic Task Handler\
    \ API or `BLTH` is the API to perform business logic at admin task level. There\
    \ are the unique characters of Business Logic Task Handler:\n\n* Business Logic\
    \ Task Handler API works at admin task session level.\n"
  raw: "​We can implement custom listener to listen event. When the event occurs,\
    \ the event listener performs business logic during particular states of execution:\
    \ before, after, fail, approve, reject. Event Listener runs under asynchronous\
    \ phase.\n\n​Examples:\n\n*   After user is created successfully, send message\
    \ to MQ.\n\n*   If administrator rejects on any modify user event, listener writes\
    \ log file.\n\n| ![](image_rsrc8TJ.jpg) |\n\n| Figure 3-5 shows Event Listener\
    \ API can listen to the event. |\n\n### 3.1.5 Logical Attribute API\n\n​Logical\
    \ Attribute API displays an attribute differently than how it is stored physically\
    \ in a user directory. This API should be used when you have the attribute share\
    \ in many screens and you do not want to do translation logic the value on every\
    \ screen.\n\n​Example:\n\n*   You have physical attribute “BusinessCategory” keeps\
    \ values as code: 1001, 2001, or3001 but on screen display as Advertising, Retail,\
    \ or Telecommunications.\n\n| ![](image_rsrc8TK.jpg) |\n\n| Figure 3-6 shows Logical\
    \ Attribute API convert physical value to logical on screen. |\n\n### 3.1.6 Validation\
    \ Rules\n\n​It is used validate field’s value on screen. You can write rule at:\n\
    \n*   Task-level, it will validate on specific screen.\n\n*   Directory-level,\
    \ it will validate that field every time on any screen.\n\n​Example:\n\n*   The\
    \ employee number must be number only.\n\n### 3.1.7 Email Template\n\n​There are\
    \ 2 ways to sending email from CA IdentityMinder.\n\n*   Email Notification Policies.\n\
    \n*   Email templates\n\nThe email template API is the one of them. We can implement\
    \ by writing template file.\n\n### 3.1.8 Notification Rule\n\n​The notification\
    \ rule determines who receive an email.  The notification rule use within email\
    \ template only.\n\n​Example:\n\n*   Sending email to HR manager after task update\
    \ location complete.\n\n    *   The email template is used for generating email\
    \ content and when email should send.\n\n    *   The notification rule is used\
    \ for getting HR manager’s email.\n\n### 3.1.9 Task Execution Web Service (TEWS)\n\
    \n​We want to the third party system execute our admin task, we have to enable\
    \ TEWS feature.  The TEWS enables the admin task as web services’ provider.             \n\
    \n​Examples:\n\n*   A user uses a web portal to modify address. The portal calls\
    \ the enterprise service bus (ESB) and then ESB calls web services of admin task\
    \ to update address. \n\n## 3.2 Task Phases\n\n​We already talked about overview\
    \ Synchronous and Asynchronous Phase. This section will explain phase details\
    \ of admin task execution and when each APIs will be executed.\n\nYou do not need\
    \ to memorize the whole things right now, when you practice example in this book,\
    \ you will memorize them automatically.\n\n### 3.2.1 Synchronous Phase Operations\n\
    \n1.  The user selects an admin task to perform.\n\n*   Business Logic Task Handler\
    \ API: call handleStart() method.\n\n2.  The admin task subject is selected but\
    \ not yet displayed.\n\n*   Business Logic Task Handler API: call handleSetSubject()\
    \ method.\n\n*   Default values for fields can be initialized with JavaScript\
    \ or hard-code.\n\n*   Fields associated with physical attributes are automatically\
    \ populated with the corresponding data from the data store.\n\n3.  CA IdentityMinder\
    \ displays and populates the task screen.\n\n*   Logical Attribute: call method\
    \ toLogical(); to convert physical attributes.\n\n4.  CA IdentityMinder invokes\
    \ Validation Rules during data entry when user click validate button (if you have)\
    \ or user change tab or you have logic to validate on change.\n\n5.  User submits\
    \ the task screen.\n\n*   Invoke Validation Rules.\n\n*   Logical Attribute API:\
    \ call method validate() to performs field-level validation.\n\n*   Logical Attribute\
    \ API: call method toPhysical() to converts logical attributes back to their corresponding\
    \ physical attributes\n\n*   Business Logic Task Handler API: call method handleValidation()\
    \ to perform task-level validation\n\n6.  User submits the task screen.\n\nIf\
    \ validation errors occur, the errors are reported to the user immediately. The\
    \ user is allowed to correct the errors and resubmit the task.\n\n7.  CA IdentityMinder\
    \ instantiates events for the task.\n\nAfter all validation is performed successfully,\
    \ CA IdentityMinder creates events. Each transaction is represented by an event.\n\
    \n8.  The task enters the asynchronous phase for processing.\n\nThere are 3 major\
    \ APIs: Business Logic Task Handler, Validation Rules and Logical Attribute execute\
    \ under synchronous phase.  The picture below shows the screen after submit admin\
    \ task. The message “Task pending” means there are event processing behind this\
    \ task or asynchronous phase is starting from now on.\n\n| ![](image_rsrc8TM.jpg)\
    \ |\n\n| Figure 3-7 shows screen display Task pending |\n\n### 3.2.2 Asynchronous\
    \ Phase Operations\n\n1.  CA IdentityMinder posts the events.\n\n2.  Event Listeners\
    \ Perform Pre-Approval Attribute Updates\n\n    *   Event Listener API: call method\
    \ before();\n\n3.  Custom Objects Perform Operations During Workflow Processing\n\
    \n    *   Participant Resolver API: If workflow specify the participants (approvers)\
    \ for a workflow activity, call method resolve() to return list of participants.\n\
    \n    *   Workflow API: start. If workflow is enabled, and an event is mapped\
    \ to a workflow process, the activities in the workflow process must be completed\
    \ before the event can be completed.\n\n4.  Event Listeners Perform Pre-Execution\
    \ Attribute Updates\n\n*   A workflow process results in either the approval or\
    \ rejection of the associated event.\n\n*   When a workflow process is approved,\
    \ CA IdentityMinder executes the associated event.\n\n    *   Event Listener API:\
    \ call method approve() or reject()\n\n5.  CA IdentityMinder Executes the Event\n\
    \n6.  Event Listeners Perform Post-Execution Operations\n\n    *   Event Listener\
    \ API: call method after()\n\n7.  CA IdentityMinder Generates Email Notifications\n\
    \n    *   Email Template API, Notification Rule API are called.\n\nThere are 5\
    \ APIs: Event Listener, Workflow, Participant Resolver, Email Template, and Notification\
    \ Rule are used under asynchronous phase.\n\n## 3.3 Configuring IDE\n\nWe use\
    \ Eclipse as IDE to develop code. Please download from book’s web site.\n\nClass\
    \ path\n\nPlease check Project Properties > Java Build Path.\n\nIf you use version\
    \ 12.6,\n\n*   Create class path variable: IDM_LIB\n\n    *   Select windows>\
    \ preference> class path variable > new\n\n    *   Set to path <server>\\IdentityMinder.ear/library\n\
    \n        *   If you use WebLogic, all jars locate at APP-INF\\lib\n\n| ![](image_rsrc8TN.jpg)\
    \ |\n\n| Figure 3-8 shows class path variable |\n\nIf you use version 12.5, remove\
    \ all my jars\n\n*   Add all jar from deploy folder <server>\\IdentityMinder.ear\\\
    library\n\n    *   If you use WebLogic, all jars locate at APP-INF\\lib\n\n* \
    \  Add indentitymanager.jar from <server>IdentityMinder.ear\\user_console.war\\\
    WEB-INF\\lib\n\nImport projects\n\n*   Run Eclipse and select import > Existing\
    \ projects into Workspace.\n\n*   Browse archive file, select a project, and click\
    \ finish.\n\n| ![](image_rsrc8TP.jpg) |\n\n| Figure 3-9 shows import project |\n\
    \n## 3.4 Conclusions\n\nThis chapter introduces 9 APIs of CA IdentityMinder: what\
    \ they are and when they execute. We have already explained about task phase:\
    \ synchronous and asynchronous phase.\n\n*   Synchronous phase: Business Logic\
    \ Task Handler, Validation Rules and Logical Attribute.\n\n*   Asynchronous phase:\
    \ Event Listener, Workflow, Participant Resolver, Email Template, and Notification\
    \ Rule.\n\n*   The Task Execution Web Service enables the admin task as web services’\
    \ provider\n\nCA provides java doc of each APIs through bookshelf > CA IdentityMinder\
    \ > programming > Javadoc Programming Reference. The next chapter will go in details\
    \ of Business Logic Task Handler API.\n\n# Chapter 4 Business Logic Task Handler\n\
    \n​Business Logic Task Handler API or BLTH is the API to perform business logic\
    \ at admin task level. There are the unique characters of Business Logic Task\
    \ Handler:\n\n*   Business Logic Task Handler API works at admin task session\
    \ level."
