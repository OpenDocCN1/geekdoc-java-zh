    *   In the agents tab: select “Nobody AutoComplete” to asynchronous


    *   In the user data tab, set value in below table: (We have details step by step
    in example: Basic custom workflow.)


    | Name | Type | Description |


    | ACTION_PERFORMED | Text | For transition |


    | PARTICIPANT_ID | Text | Approver ID |


    | PARTICIPANT_NAME | Text | Link to properties file |


    | PARTICIPANT_DESCRIPTION | Text | Link to properties file |


    Rule 4: workflow at admin task level (Optional)


    The default value, workflow can run at event level. If you want workflow run at
    admin task level, you have to:


    *   Select process’s User Data and add TASK_LEVEL = true


    ### 5.2.2 Workpoint Component


    ​We will introduce basic components of Workpoint Desinger.


    ​Activity Node


    ​An activity represents a step in the business process. There are 3 types of activity
    depending how activity is complete. The node are shown different.


    | Node | Type | Description |


    | ![](image_rsrc8V6.jpg) | Automated by a person | It will complete by a person,
    it is used for approver. |


    | ![](image_rsrc8V7.jpg) | Automated by activity | Requires special code to complete
    activity |


    | ![](image_rsrc8V8.jpg) | Automated by server | The WorkPoint Server automatically
    completes this activity |


    ​If you require approver, choose node type “Automated by a person”.


    If you have to do any logic or call any backend, choose node type “Automated by
    server”. For example, you have logic to call web services, when logic complete,
    Workpoint will move to next node. You do not to do any special code.


    ​If you choose node type “Automated by activity” to call web service, when logic
    complete it will not move to next node. The process will stop. You have to do
    special code to complete activity this node and then Workpoint will move to next
    node. (The node Approve and Reject has code to complete activity)


    ​The picture below shows 3 types of activities/nodes.


    *   Node “App Admin” is Activity: Automated by a person.


    *   Node “Call Web Servcies” is Activity: Automated by server.


    *   Node “Approve” and “Reject” is Activity: Automated by activity.


    | ![](image_rsrc8V9.jpg) |


    | Figure 5-18 shows 3 types of activities |


    Transition


    ​A transition is a line on the work map that connects to two different nodes.
    A transition can be unconditional or conditional. A conditional transition associates
    with a transition selection script.


    ​We use transition as selection path in workflow. The figure below shows the transition
    with conditions. For example, if division equals central, goes to send ticket
    and then sending email and finish workflow.


    | ![](image_rsrc8VA.jpg) |


    | Figure 5-19 shows 3 conditional transitions. |


    ​Delay Node


    ​A delay represents a pause or hold in the business process. For example during
    provision process, we create user but we have to wait until the hire date, then
    we will enable that user. If user’s city is New York, we will add role to user
    at 6 AM.


    | ![](image_rsrc8VB.jpg) |


    | Figure 5-20 shows example of delay |


    Category


    Category is group of object. Category can be used to filter lists of alerts, mail,
    scripts, processes and node templates within the designer. The category help us
    to import and export workflow.


    Parameters


    ​When we write code, Workpoint provides some parameters:


    *   ClientContext, For CA IdentityMinder, ClientContext is one required parameter
    to construct WorkflowContext. WorkflowContext is sub class of ProviderAccessor
    API.


    *   SymbolTable, it used for return value to the WorkPoint Server. We usually
    use the SymbolTable in Delay node to answer how long to delay.


    *   JobData, it contains data at job level. We use JobData to share data between
    nodes.


    *   ActivityInstData, it contains data at node level. We usually use ActivityInstData
    with Transition.


    ## 5.3 Code Examples


    ​The example in this chapter will have 2 parts: 


    *   Workpoint and code


    *   Configuration.


    ​We will use admin task from previous chapter. Please disable Identity Policy
    Set, policy Xpress and Business Logic Task Handler API from previous chapter that
    relate to the admin task “Update Location and Ext number”.


    | ![](image_rsrc8VC.jpg) |


    | Figure 5-21 shows admin task |


    ​We can remove Business Logic Task Handler by


    *   Search our admin task name: Update Location and Ext Number


    *   Click button “Business Logic Task Handlers”, then click minus icon to remove
    Business Logic Task Handlers


    *   Click ok and submit.


    | ![](image_rsrc8VD.jpg) |


    | Figure 5-22 shows icon to remove Business Logic Task Handler |


