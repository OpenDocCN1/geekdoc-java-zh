  trans: "\n\n```java\npackage com.book.idm.blth;\nimport com.netegrity.imapi.BLTHAdapter;\n\
    import com.netegrity.imapi.BLTHContext;\npublic class BasicLifeCycle extends BLTHAdapter{\n\
    \    @Override\n    public void handleStart(BLTHContext blthContext) throws Exception\
    \ {\n        System.out.println(\"UpdateLocationExtNumber:handleStart\");\n  \
    \  }\n    @Override\n    public void handleSetSubject(BLTHContext blthContext)\
    \ throws Exception {\n        System.out.println(\"UpdateLocationExtNumber:handleSetSubject\"\
    );\n    }\n    @Override\n    public void handleValidation(BLTHContext blthContext)\
    \ throws Exception {\n        System.out.println(\"UpdateLocationExtNumber:handleValidation\"\
    );\n    }\n    @Override\n    public void handleSubmission(BLTHContext blthContext)\
    \ throws Exception {\n        System.out.println(\"UpdateLocationExtNumber:handleSubmission\"\
    );\n    }\n}\n```\n\n2. 编译并复制类（包含包文件夹 `com.book.idm.blth`）到文件夹 `\\IdentityMinder.ear\\\
    custom`。\n\n### 配置\n\n有两种类型的配置：全局业务逻辑任务处理器和特定任务的业务逻辑任务处理器。在所有示例中，我们选择了特定任务的业务逻辑任务处理器。\n\
    \n1. 搜索我们的管理员任务名称：Update Location and Ext Number（更新位置和分机号）。\n2. 点击 `Business Logic\
    \ Task Handlers` 按钮，然后点击 `Add` 按钮指定特定的 Java 类名。\n3. 如下所示填写值：\n\n| 字段名称 | 值 | 描述\
    \ |\n| :--- | :--- | :--- |\n| Name | `BLTHExample` | 业务逻辑任务处理器的名称 |\n| Java Class\
    \ | `com.book.idm.blth.BasicLifeCycle` | 我们放在 custom 文件夹中的 Java 类名 |\n\n![](img/image_rsrc8TV.jpg)\
    \  \n图 4-5 显示了“业务逻辑任务处理器详情”屏幕界面。\n\n4. 点击 ok 并提交此管理员任务。\n\n### 工作原理\n\n我们可以通过以下步骤通过管理员任务执行我们的代码：\n\
    \n1. 以管理员身份登录 Identity Manager 用户控制台。\n2. 选择标签页：`Book Example` 并选择菜单：`Basic`。\n\
    3. 选择管理员任务：`Update Location and Ext Number`。\n\n![](img/image_rsrc8TW.jpg)  \n\
    图 4-6 显示了选择管理员任务。\n\n日志文件显示：\n\n```\nINFO [STDOUT]UpdateLocationExtNumber:handleStart\n\
    ```\n\n4. 然后搜索并选择一些用户。当管理员任务显示时，日志文件将显示：\n\n```\nINFO  [STDOUT]  UpdateLocationExtNumber:handleSetSubject\n\
    ```\n\n![](img/image_rsrc8TX.jpg)  \n图 4-7 显示了管理员任务屏幕显示\n\n5. 修改城市属性（你必须修改城市的值）并提交管理员任务，日志将显示：\n\
    \n```\nINFO [STDOUT] UpdateLocationExtNumber:handleValidation\nINFO [STDOUT] UpdateLocationExtNumber:handleSubmission\n\
    ```\n\n你将看到业务逻辑任务处理器的生命周期，以及 `BLTHAdapter` 的每个方法的执行情况。\n\n### 4.4.2 通过 BLTHContext\
    \ 修改用户属性\n\n此示例将演示如何使用 `BLTHContext`：\n\n* 将城市属性修改为“New City”。\n* 从父接口获取当前任务信息：`TaskInfo`。\n\
    \n### 代码\n\n1. 编译我们的 Java 代码：`com.book.idm.blth.ModifyUserByBLTHContext`。\n2.\
    \ 复制类（包含包文件夹 `com.book.idm.blth`）到文件夹 `\\IdentityMinder.ear\\custom`。\n\n### 配置\n\
    \n1. 以管理员身份登录 Identity Manager 用户控制台。\n2. 选择标签页 `Roles and Tasks` 并选择菜单 `modify\
    \ admin task`。\n3. 搜索并选择我们的管理员任务名称：`Update Location and Ext Number`。\n4. 点击 `Business\
    \ Logic Task Handlers` 按钮，然后点击图标 `pencil`。\n\n![](img/image_rsrc8TY.jpg)  \n图\
    \ 4-8 显示了修改 Java 类的“铅笔”图标。\n\n5. 如下所示修改值：\n\n| 字段名称 | 值 | 描述 |\n| :--- | :---\
    \ | :--- |\n| Java Class | `com.book.idm.blth.ModifyUserByBLTHContext` | 我们放在\
    \ custom 文件夹中的 Java 类 |\n\n![](img/image_rsrc8TZ.jpg)  \n图 4-9 设置了新 Java 类的值\n\
    \n### 工作原理\n\n我们可以通过以下步骤通过管理员任务执行我们的代码：\n\n1. 以管理员身份登录 Identity Manager 用户控制台。\n\
    2. 选择标签页：`Book Example` 并选择菜单：`Basic`。\n3. 选择管理员任务：`Update Location and Ext Number`。\n\
    4. 然后搜索并选择一些用户。\n5. 修改城市属性（你必须修改城市的值）并提交管理员任务。\n\n#### Access 用户对象\n\n城市属性的结果将是“New\
    \ City”。无论你在屏幕上选择了什么值，都不重要，因为我们的代码设置了该值。我们在 `handleSubmission()` 方法中设置了城市属性。\n\
    \n```java\n//Access User Object\nUser user = blthContext.getUser();\nuser.setAttribute(\"\
    l\", \"New City\");\n```\n\n在代码中，我们通过 `BLTHContext.getUser()` 访问用户对象并设置属性：`city`。有一个有趣的地方是属性名称。用户对象使用了代表用户存储中的属性名称。`L`\
    \ 的小写表示城市。你可以使用任何 LDAP 客户端连接用户存储并查看用户的属性名称。\n\n![](img/image_rsrc8U0.jpg)  \n\
    #### Access 信息\n\n在代码中，我们通过 `BLTHContext.getUser()` 访问用户对象并设置属性：`city`。有一个有趣的地方是属性名称。用户对象使用了代表用户存储中的属性名称。`L`\
    \ 的小写表示城市。你可以使用任何 LDAP 客户端连接用户存储并查看用户的属性名称。\n\n"
- fmt: "\n3. Select Admin Task: “Update Location and Ext Number”.\n4. Search and select\
    \ some users.\n5. Modify city’s attribute (you have to modify city value) and\
    \ put the value “xxxxxx” in phone extension number. Submit the admin task.\n\n\
    | ![](image_rsrc8U6.jpg) |\nFigure 4-16 shows values for our task\n\n### Using\
    \ ProviderAccessor\n\nUsing `providerAccessor` means using any method of `ProviderAccessor`\
    \ is parent class of `BLTHContext`. For examples: `getUserProvider()`, `getGroupProvider()`,\
    \ etc . The name of method will end with word `provider`. Each managed object\
    \ type (such as `User`, `Group`, and `Organization`) is associated with a provider\
    \ object that you use to access the managed object's data.\n\n```java\nUser user\
    \ = blthContext.getUserProvider().findUser(blthContext.getTSContext(), userid,\
    \ null);\n```\n\n`BLTHContext` has parent interface: `ProviderAccessor`. When\
    \ we call `getUserProvider()`, it returns `UserProvider`. The `UserProvider` has\
    \ method `findUser()`.\n\n```java\nfindUser(TSContext context, java.lang.String\
    \ name, AttributeRightsCollection attributes)\n```\n\nThis method requires 3 arguments:\n\
    \n* `context`: Context information of the current task session. Our code uses\
    \ `BLTHContext`.\n* `name`: The name of the user to retrieve. The name can be\
    \ a unique name or a friendly name. Our code uses unique name of user.\n\n```java\n\
    //Get unique name from task\nString userid = blthContext.getUser().getUniqueName();\n\
    ```\n\n* `attributes`: a collection of `AttributeRight` objects, each containing\
    \ an attribute name and a permission request. Our code pass `null` value.\n\n\
    We get user object from `ProviderAccessor`. We can modify telephone number attribute.\
    \ The attribute name is same as physical attribute’s name of user store.\n\n```java\n\
    user.setAttribute(\"telephoneNumber\", \"212-222-2222x1234\");\nuser.modifyObject();\n\
    ```\n\nWe modify a managed object through `ProviderAccessor`, we are changing\
    \ the local (in-memory) representation of the object. To persist the changes to\
    \ the data store, we need to call `modifyObject()`. The changes are then made\
    \ directly to the data store. No Identity Manager events are generated, and no\
    \ workflow approvals, auditing, or security checks are performed.\n\n### Check\
    \ the results in user store\n\nWe did the 2 things: change city attribute and\
    \ our java code use `AccessProvider` to modify telephone number. Use LDAP client\
    \ to connect to user store, we will see telephone number value has been changed.\n\
    \n| ![](image_rsrc8U7.jpg) |\nFigure 4-17 shows telephone number attribute has\
    \ been changed\n\n### Check the results in view Submitted task screen\n\nSelect\
    \ menu: view submitted task, under tab: `system`. Select our task, you will see\
    \ events inside.\n\n| ![](image_rsrc8U8.jpg) |\nFigure 4-18 shows all events\n\
    \nClick `Modify User` event to see attributes changes:\n\n* The city attribute\
    \ came from screen to modify value in user store.\n* The telephone number, we\
    \ use `ProviderAccessor` to modify. So attributes changed in `Modify User` event,\
    \ we don’t see value from `ProviderAccessor` but we see only the value from screen.\n\
    \n| ![](image_rsrc8U9.jpg) |\nFigure 4-19 shows attributes changed after submitted\n\
    \n### The sequence of modification\n\nNow we have 2 attributes to provision: city\
    \ and telephone number:\n\n* The city value came from screen.\n* The telephone\
    \ number value came from `ProviderAccessor`.\n    * On screen, we put the value\
    \ “xxxxxx”\n    * The final result is “212-222-2222x1234”\n\nIf your environment\
    \ setup for provisioning and active directory accounts, you will see telephone\
    \ attribute in endpoint is “212-222-2222x1234”.\n\n| ![](image_rsrc8UA.jpg) |\n\
    Figure 4-20 telephone number was provisioned to endpoint\n\nWe can explain step\
    \ by steps as:\n\n* Step 1: When user submit admin task, the method `handleSubmission()`\
    \ execute. The telephone number will be commit when method `modifyObject()` is\
    \ called.\n* Step 2: `Modify user` event has been generated. When modify user\
    \ event complete. CA IdentityMinder will commit the city value.\n* Step 3: `Synchronize\
    \ User` event, it is not relate. It will trigger `Policy Set`.\n* Step 4: `Synchronize\
    \ User Attribute with Account` will provision attributes from provisioning directory\
    \ and to endpoint.\n\n| ![](image_rsrc8UB.jpg) |\nFigure 4-21 shows steps of provisioning\n\
    \n### 4.4.4 BLTHContext and ProviderAccessor\n\nThis example is kind of experiment\
    \ for better understanding `BLTHContext` and `ProviderAccessor`. We will try to\
    \ update city and telephone attribute by using both APIs. Let see what is going\
    \ on.\n\n#### Code\n\n1. Compile our java code: `com.book.idm.blth.ModifyUserByBoth`\n\
    2. Copy class (include package folder `com.book.idm.blth`) to folder `\\IdentityMinder.ear\\\
    custom`.\n\n#### Configuration\n\n1. Log into the Identity Manager User Console\
    \ as administrator.\n2. Select tab `Roles` and `Tasks`, and select menu `modify\
    \ admin task`.\n3. Search and select our admin task name: `Update Location and\
    \ Ext Number`.\n4. Click button `Business Logic Task Handlers`, then icon “pencil”.\n\
    5. Modify value as below.\n\n| Field Name | Value | Description |\n| :--- | :---\
    \ | :--- |\n| Java Class | `com.book.idm.blth.ModifyUserByBoth` | Our java class\
    \ |\n\nWe can execute our code following these steps:\n1. Log into the Identity\
    \ Manager User Console as administrator.\n2. Select tab `Roles` and `Tasks`, and\
    \ select menu `modify admin task`.\n3. Search and select our admin task name:\
    \ `Update Location and Ext Number`.\n4. Click button `Business Logic Task Handlers`,\
    \ then icon “pencil”.\n5. Modify value as below.\n\n```java\npublic void handleSubmission(BLTHContext\
    \ blthContext) throws Exception {\n//Using BLTHContext\nUser user1 = blthContext.getUser();\n\
    user1.setAttribute(\"l\", \"New City\");\n//user1.setAttribute(\"telephoneNumber\"\
    , \"111111\");\n//Using ProviderAccessor\nString userid = user1.getUniqueName();\n\
    User user2 = blthContext.getUserProvider().findUser(blthContext.getTSContext(),\
    \ userid, null);\nuser2.setAttribute(\"l\", \"New Town\");\nuser2.setAttribute(\"\
    telephoneNumber\", \"2222222\");\nuser2.modifyObject();\n}\n```\n\n| ![](image_rsrc8UC.jpg)\
    \ |\nFigure 4-22 shows errors\n\n| ![](image_rsrc8UD.jpg) |\nFigure 4-23 shows\
    \ all attributes\n\n| ![](image_rsrc8UE.jpg) |\nFigure 4-24 we change city value\
    \ as Toronto\n\n| ![](image_rsrc8UF.jpg) |\nFigure 4-25 shows the final result\n"
