  trans: "\n\n| 2013-10-27 INFO [STDOUT] =============>LifeCycleEventListener:approved2013-10-27\
    \ INFO [STDOUT] =============>LifeCycleEventListener:after |\n\n## 监听器级别 (Listener\
    \ Level)\n\n我们将监听器级别设置为 `ModifyUserEvent`。这意味着我们的程序只监听一种事件类型：`ModifyUserEvent`。如果我们将监听器级别改为\
    \ `User`，则意味着它监听所有与用户相关的事件。\n\n| ![](img/image_rsrc8XK.jpg) |\n\n| 图 6-4 显示了监听器级别的配置\
    \ |\n\n如果你选择 `*`，意味着此监听器将监听所有事件。\n\n### 6.2.3 代码示例：事件生成\n\n事件生成不是 `Listener` 的特性，而是上下文（context）的特性。我们的示例将展示如何生成新事件；将用户添加到组。此示例代码需要一个名为“IT”的组。如果你没有该组，可以创建一个新组或修改代码更改组名。\n\
    \n我们可以通过 `EventContext` 生成新事件。`EventContext` 可以在当前任务内生成一个次级事件。`EventContext` 拥有方法\
    \ `generateEvent()`。\n\n```\nvoid generateEvent(java.lang.String className,java.lang.Object\
    \ primary,java.lang.Object secondary,java.lang.String workflowID) throws java.lang.Exception\n\
    ```\n\n第一个参数 `className` 是为要生成的事件实例化的类的全限定名。事件类位于 `com.netegrity.ims.events` 包中。你可以在\
    \ java doc 中查看详细信息，但我建议在管理控制台 > Environments > Advance Settings > Event List 中查看，那里是最新的。\n\
    \n| ![](img/image_rsrc8XM.jpg) |\n\n| 图 6-5 显示了事件列表 (Event List) |\n\n第二个和第三个参数是\
    \ `primary` 和 `secondary` 对象类型，你可以参考上面的图片。最后一个参数是 `workflowID`。工作流过程的名称（例如 `SingleStepApproval`）映射到生成的事件。如果你不需要任何工作流，只需传递\
    \ `null`。\n\n此示例展示了如果 `city attribute == “new york”`，我们将用户添加到组“IT”中。\n\n#### 代码\n\
    \n1. 编译我们的 java 代码：`com.book.idm.etc.NewYorkCityEventListener`\n2. 将类文件（包含包文件夹\
    \ `com.book.idm.etc`）复制到文件夹 `\\IdentityMinder.ear\\custom`\n\n#### 配置\n\n1. 在管理控制台中，点击\
    \ `Environments`。\n2. 点击将使用事件监听器的环境名称。\n3. 点击 `Advanced Settings`。\n4. 点击 `Event\
    \ Listeners`。\n5. 点击 `new` 按钮并按下表赋值：\n\n| 字段名 (Field Name) | 值 (Value) | 说明 (Description)\
    \ |\n| :--- | :--- | :--- |\n| Name | `NewYorkCityEventListener` | 事件监听器的名称 |\n\
    | Class | `com.book.idm.etc.NewYorkCityEventListener` | Java 类名 |\n| Listener\
    \ Level | `ModifyUserEvent` | 该类监听的事件 |\n6. 点击 `Restart Environment`。\n\n####\
    \ 配置：Identity Manager 用户控制台\n\n1. 以管理员身份登录 Identity Manager User Console。\n2.\
    \ 检查我们的管理员任务名称：`Update Location and Ext Number`：\n   - 移除所有业务逻辑任务处理器和 Policy Xpress。\n\
    \   - 移除上一个示例中的工作流。\n\n#### 运行原理\n\n执行管理员任务：`Update Location and Ext Number`。\n\
    \n1. 以管理员身份登录 Identity Manager User Console。\n2. 在“Book Example”选项卡中选择管理员任务：“Update\
    \ Location and Ext Number”，然后搜索某些用户。将城市属性更改为“New York”并提交管理员任务。\n3. 查看已提交的任务，并选择详情。你将看到事件“Add\
    \ user to group”。\n\n| ![](img/image_rsrc8XN.jpg) |\n\n| 图 6-6 显示了生成的事件 \"Add\
    \ user to group\" |\n\n你可以搜索组“IT”并查看其成员关系以检查结果。\n\n#### 特定的管理员任务\n\n我们通过配置指定事件，通过代码指定管理员任务。我们添加了条件来检查管理员任务的\
    \ tag。\n\n```\nif(!\"BookBasicUpdateLocAndExtNo\".equalsIgnoreCase(evtCtx.getAdminTask().getTaskTag())){return\
    \ CONTINUE;}\n```\n\n#### 事件生成\n\n此代码展示了事件生成：`AddToGroupEvent`。我们查找组 `IT` 并将其传递给方法\
    \ `generateEvent()`。结果是用户被添加到组“IT”中。\n\n```\nif(city.equalsIgnoreCase(\"new york\"\
    )){Group group = evtCtx.getGroupProvider().findGroup(\"IT\",null);evtCtx.generateEvent(\"\
    com.netegrity.ims.events.AddToGroupEvent\",user,group, null);}\n```\n\n### 6.2.4\
    \ 用例示例\n\n我们梳理了官方文档中所有用例的代码（Programming Guide for Java > Event Listener API >\
    \ Event Listener API Overview > Use Case Examples）。\n\n#### 将用户添加到 Microsoft Exchange（特定事件监听器）\n\
    \n当用户被成功添加到管理员角色 `Exchange Users` 时，CA IdentityMinder 会调用与事件 `AssignAdminRoleEvent`\
    \ 关联的事件监听器的 `after()` 方法。`after()` 方法的实现使用 Exchange API 将用户添加到 Exchange 系统。访问\
    \ Exchange 服务器所需的信息（`SERVER_NAME`、`ADMIN_ID`、`ADMIN_PASSWORD` 等）包含在 CA IdentityMinder\
    \ 环境的用户定义属性中。CA IdentityMinder 环境属性会被传递给 `EventListenerAdapter` 的 `init()` 方法。\n\
    \n在这个用例中，你只需要重写 `after()` 方法并编写程序将用户添加到 Microsoft exchange。对于 `init()` 方法，你可以在用户定义属性中获取。请参见本章末尾的示例代码。\n\
    \n#### 为组分配创建规则（特定事件监听器）\n\n当用户被创建时，CA IdentityMinder 会调用与事件 `CreateUserEvent`\
    \ 关联的事件监听器的 `after()` 方法。`after()` 方法的实现评估用户属性（如 `Job Title`、`Security Level`\
    \ 和 `Department`），将用户分配到一个或多个组。对于每个组分配，实现会生成次级事件 `AddToGroupEvent`。此次级事件可以接受工作流审批和审计。\n\
    \n在这个用例中，你必须通过检查职位等来编写条件。如果匹配，你可以生成新事件：`AddToGroupEvent`。这与我们的示例：事件生成相同。\n\n####\
    \ 使用用户数据更新 RDBMS（类级别事件监听器）\n\n假设用户信息（如 `user ID`、`user name`、`email address` 和组成员关系存储在\
    \ RDBMS 中。每当发生任何用户级事件（`CreateUserEvent`、`ModifyUserEvent` 等）时，必须更新 RDBMS 中的用户记录。事件执行后，CA\
    \ IdentityMinder 会调用与用户事件关联的事件监听器的 `after()` 方法。该方法的实现从传递给 `init()` 方法的 CA IdentityMinder\
    \ 环境属性中检索 RDBMS 连接参数，然后更新 RDBMS 中的用户记录。\n\n在这个用例中，我们在 `after()` 中实现数据库更新逻辑。在管理控制台配置中，我们选择监听\
    \ `user` 级别。这意味着 Java 类将在所有用户事件上执行。\n\n#### 将事件发布到 JMS 队列（所有监听器）\n\n在任何事件成功执行后，CA\
    \ IdentityMinder 会调用所有事件监听器的 `after()` 方法。此监听器将所有事件写入特定的 Java 消息服务（JMS）队列。队列的\
    \ JNDI 名称和 `jndi.properties` 文件中的信息可以通过 CA IdentityMinder 环境属性进行配置。`after()` 方法的实现使用\
    \ JNDI 信息发布简单的对象消息。\n\n这与之前相同，重写 `after()` 方法并发送到 JMS。在管理控制台中配置 `*`，它将在每个事件发生时执行。\n\
    \n## 6.3 逻辑属性 API\n\n逻辑属性 API 用于在逻辑属性（显示在屏幕上）和物理属性（存储在用户数据存储中）之间进行转换。逻辑属性处理器的执行发生在任务处理的同步阶段。\n\
    \n### 逻辑属性\n\n逻辑属性值显示在任务屏幕字段中。逻辑属性名称出现在垂直线（|）之间。例如，扩展逻辑属性显示为 `|Extension|`。\n\n\
    | ![](img/image_rsrc8XP.jpg) |\n\n"
- fmt: "\n# Figure 6-7 shows logical attribute\n\nLogical attribute values are not\
    \ directly associated with or written to the data store. It needs processing by\
    \ a logical attribute handler.\n\n## Predefined Logical Attributes\n\nCA IdentityMinder\
    \ has predefined logical attributes for some purposes, for example `passwordConfirm`,\
    \ `oldPassword`. We can use or customized them. Please see office document for\
    \ more detail.\n\n## Physical Attributes\n\nPhysical attributes are attributes\
    \ of the underlying data store (a user directory such as `LDAP`). If a task screen\
    \ field is configured with a physical attribute, a value entered into the field\
    \ is written to the data store.\n\n### 6.3.1 Programming\n\nCreate `java` class\
    \ extends `LogicalAttributeAdapter` and override methods:\n\n*   `public void\
    \ toLogical(LogicalAttributeContext apiContext) throws java.lang.Exception`\n\
    \    *   Convert value from physical attribute to be logical attribute.\n*   `public\
    \ void toPhysical(LogicalAttributeContext apiContext) throws java.lang.Exception`\n\
    \    *   Convert value from logical attribute to be physical attribute.\n*   `public\
    \ void initializeOptionList(LogicalAttributeContext apiContext) throws java.lang.Exception`\n\
    \    *   If you want to render value as list, you need to implement this method\
    \ and return `Vector` as display value list on screen.\n*   `public void initialize(LogicalAttributeContext\
    \ apiContext) throws java.lang.Exception`\n    *   In case of create user or create\
    \ any object, this method set initial value of attribute.\n\n### 6.3.2 Code Example\n\
    \nOur example show convert city (physical attribute) to be office code (logical\
    \ attribute). The screen will display office as code. When users select office\
    \ code, it will convert value from office code as city value.\n\n| ![](image_rsrc8XR.jpg)\
    \ |\n| Figure 6-8 shows user’s screen for updating office |\n\n#### Code\n\n1.\
    \ Compile our `java` code: `com.book.idm.etc.OfficeCodeLogicalAttr`\n2. copy class\
    \ (include package folder `com.book.idm.etc`) to folder `<server>\\IdentityMinder.ear\\\
    custom`\n\n#### Configuration: Management Console\n\n1. In the Management Console,\
    \ click `Environments`.\n2. Click the name of the environment where the logical\
    \ attribute will be used.\n3. Click `Advanced Settings`.\n4. Click `Logical Attribute\
    \ Handlers`.\n5. Click `new` button and put value as below:\n\n| Field Name |\
    \ Value | Description |\n| :--- | :--- | :--- |\n| Name | `OfficeCodeLogicalAttr`\
    \ | Name of logical attribute |\n| Class | `com.book.idm.etc.OfficeCodeLogicalAttr`\
    \ | Name of `java` class |\n| Object Type | `User` | Type of object that has logical\
    \ attribute |\n| Logical Attributes | | |\n| Name | `officeCodeList` | Name that\
    \ uses in code. |\n| Attribute Name | `\\|officeCodeList\\|` | Name that shows\
    \ in admin task’s screen |\n| Option List | Check | Tell CA IdentityMinder, this\
    \ attribute is list |\n| Name | `officeCode` | Name that uses in code. |\n| Attribute\
    \ Name | `\\|officeCode\\|` | Name that shows in admin task’s screen |\n| Physical\
    \ Attributes | | |\n| Name | `officeCodePhyAttr` | Name that uses in code. |\n\
    | Attribute Name | `l` | (lower case of L) Name of attribute city in user store.\
    \ |\n\n| ![](image_rsrc8XS.jpg) |\n| Figure 6-9 shows logical attribute configuration\
    \ in management console |\n\n6. Click `Restart Environment` button.\n\n#### Configuration:\
    \ Identity Manager User Console\n\n1. Log into the Identity Manager User Console\
    \ as `administrator`.\n2. Select tab `Roles` and `Tasks`, and select menu `create\
    \ admin task`.\n3. Create admin task, put value as below:\n\n| Field Name | Value\
    \ | Description |\n| :--- | :--- | :--- |\n| Tab: Profile | | |\n| Name | `Update\
    \ Office` | Name of admin task |\n| Tag | `BookBasicUpdateOffice` | Tag name of\
    \ admin task |\n| Description | `Example for Logical Attribute` | Description\
    \ of admin task |\n| Category | `Book Example` | Where admin task will show. |\n\
    | Category Order | `11` | |\n| Category 2 | `Task` | |\n| Category 3 | `Basic`\
    \ | |\n| Primary Object | `User` | We want to update the city, so you have to\
    \ choose object user, and action modify. |\n| Action | `Modify` | |\n| For testing,\
    \ you can disable some values. | | |\n| * User Synchronization and Account Synchronization:\
    \ off. | | |\n| * Enable Auditing, Enable Workflow, Enable Web Services: uncheck\
    \ | | |\n| Tab: Search | | |\n| Search Screen | `Default User Search` | Screen\
    \ for searching user |\n\n4. For Tab: Tabs:\n   Select standard tab controller.\n\
    \   Select `Profile(UserProfile)` from list, and click symbol `(+)`.\n   Select\
    \ `browse` button at screen text field.\n   Click `new` button to create new screen,\
    \ and select choice standard profile screen.\n   Put value:\n   * Name: `Book\
    \ Example: Update Office`\n   * Tag: `BookBasicUpdateOffice`\n   Add attribute:\
    \ `\\|officeCode\\|`\n   * Attribute Name: `\\|officeCode\\|`\n   * Style: `Drop\
    \ down`\n   * Name: `Office Code`\n   * Click `apply` button to finish.\n   Add\
    \ attribute: `\\|officeCodeList\\|`\n   * Attribute Name: `\\|officeCodeList\\\
    |`\n   * Style: `Hidden`\n   * Click `apply` button to finish.\n   Add attribute:\
    \ `City`\n   * Attribute Name: `\\|City\\|\n   * Style: `Hidden`\n   * Click `apply`\
    \ button to finish.\n   Click `ok`\n\n| ![](image_rsrc8XT.jpg) |\n| Figure 6-10\
    \ shows configuration of each attributes |\n\n5. Submit to finish. Add this task\
    \ to role.\n1. Select tab `Roles` and `Tasks`, and select menu `create admin task`.\n\
    2. Log into the Identity Manager User Console as `administrator`.\n3. Select tab\
    \ `Book Example`, the screen will display office code.\n4. Modify office attribute,\
    \ and click submit.\n\n#### How it works\n\nExecute admin task: Update office.\
    \ Search user, check city attribute.\n\nMethod: toLogical()\n\nThis method converts\
    \ value from physical attribute to be logical attribute. The code has 3 steps:\n\
    *   Step 1: Get value from physical attribute.\n*   Step 2: Mapping, convert from\
    \ physical to logical attribute. You may have other ways to convert. Our code\
    \ use map for conversion.\n*   Step 3: Set value back to logical attribute.\n\n\
    ```java\nprivate String ATTR_REF_PHY = \"officeCodePhyAttr\";\n@Override\npublic\
    \ void toLogical(LogicalAttributeContext ctx) throws Exception {\n    //get physical\
    \ attribute value\n    String city = ctx.getPhysicalAttributeName(ATTR_REF_PHY);\n\
    \    String cityValue = ctx.getPhysicalAttributeValue(city);\n    //mapping from\
    \ physical value to logical\n    String officeCodeValue = indexPhysicalAsKey.get(cityValue);\n\
    \    if(officeCodeValue!=null){\n        //Set value for logical\n        String\
    \ officeCode = ctx.getLogicalAttributeName(ATTR_OFFICE_CODE);\n        ctx.setLogicalAttributeValue(officeCode,\
    \ officeCodeValue);\n    }\n}\n```\n\nStep 1: We get value from physical attribute,\
    \ variable `officecodePhyAttr` link to attribute `l` in user store when we do\
    \ configuration.\n\n| ![](image_rsrc8XU.jpg) |\n| Figure 6-11 shows attribute\
    \ mapping for physical attributes |\n\nStep 2: mapping, we have our helper object\
    \ `indexPhysicalAsKey` class to convert to be logical value. In the real world\
    \ requirement, you may have some logic to convert. The official document said:\n\
    \n> Logical attribute handler execution occurs in the synchronous phase of task\
    \ processing. If response time during interaction with a third-party system is\
    \ an issue, the same objective can be performed using an event listener during\
    \ the Pre-approval state.\n\nStep 3: The last line of code is set value back to\
    \ logical attribute.\n\nMethod: toPhysical()\n\nThis method is reverse of `toLogical()`.\
    \ The steps are same but reverse.\n"
