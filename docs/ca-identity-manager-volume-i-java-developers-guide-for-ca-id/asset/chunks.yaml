    \ and put the value “xxxxxx” in phone extension number. Submit the admin task.\n\
    \n| ![](image_rsrc8U6.jpg) |\n\n| Figure 4-16 shows values for our task |\n\n\
    ​Using ProviderAccessor\n\n​Using providerAccessor means using any method of ProviderAccessor\
    \ is parent class of BLTHContext. For examples: getUserProvider(), getGroupProvider(),\
    \ etc . The name of method will end with word provider. Each managed object type\
    \ (such as User, Group, and Organization) is associated with a provider object\
    \ that you use to access the managed object's data.\n\n| User user = blthContext.getUserProvider().findUser(blthContext.getTSContext(),\
    \ userid, null); |\n\n​BLTHContext has parent interface: ProviderAccessor. When\
    \ we call getUserProvider, it returns UserProvider. The UserProvider has method\
    \ findUser()\n\n| findUser(TSContext context, java.lang.String name, AttributeRightsCollection\
    \ attributes) |\n\n​This method requires 3 arguments:\n\n*   context: Context\
    \ information of the current task session. Our code uses BLTHContext.\n\n*   name:\
    \ The name of the user to retrieve. The name can be a unique name or a friendly\
    \ name. Our code uses unique name of user.\n\n| ​//Get unique name from task​String\
    \ userid = blthContext.getUser().getUniqueName(); |\n\n*   attributes: A collection\
    \ of AttributeRight objects, each containing an attribute name and a permission\
    \ request. Our code pass null value.\n\n​We get user object from ProviderAccessor.\
    \ We can modify telephone number attribute. The attribute name is same as physical\
    \ attribute’s name of user store.\n\n| ​user.setAttribute(\"telephoneNumber\"\
    , \"212-222-2222x1234\");​user.modifyObject(); |\n\n​We modify a managed object\
    \ through ProviderAccessor, we are changing the local (in-memory) representation\
    \ of the object. To persist the changes to the data store, we need to call modifyObject().\
    \ The changes are then made directly to the data store. No Identity Manager events\
    \ are generated, and no workflow approvals, auditing, or security checks are performed.\n\
    \n​Check the results in user store\n\n​We did the 2 things: change city attribute\
    \ and our java code use AccessProvider to modify telephone number. Use LDAP client\
    \ to connect to user store, we will see telephone number value has been changed.\n\
    \n| ![](image_rsrc8U7.jpg) |\n\n| Figure 4-17 shows telephone number attribute\
    \ has been changed |\n\n​Check the results in view Submitted task screen\n\n​Select\
    \ menu: view submitted task, under tab: system.  Select our task, you will see\
    \ events inside.\n\n| ![](image_rsrc8U8.jpg) |\n\n| Figure 4-18 shows all events\
    \ |\n\n​Click Modify User event to see attributes changes: \n\n*   The city attribute\
    \ came from screen to modify value in user store.\n\n*   The telephone number,\
    \ we use ProviderAccessor to modify. So attributes changed in Modify User event,\
    \ we don’t see value from ProviderAccessor but we see only the value from screen.\n\
    \n| ![](image_rsrc8U9.jpg) |\n\n| Figure 4-19 shows attributes changed after submitted\
    \ |\n\n​The sequence of modification\n\n​Now we have 2 attributes to provision:\
    \ city and telephone number:\n\n*   The city value came from screen.\n\n*   The\
    \ telephone number value came from ProviderAccessor.\n\n    *   On screen, we\
    \ put the value “xxxxxx”  \n\n    *   The final result is “212-222-2222x1234”\n\
    \n​If your environment setup for provisioning and active directory accounts, you\
    \ will see telephone attribute in endpoint is “212-222-2222x1234”.\n\n| ![](image_rsrc8UA.jpg)\
    \ |\n\n| Figure 4-20 telephone number was provisioned to endpoint |\n\nWe can\
    \ explain step by steps as:\n\n*   Step 1: When user submit admin task, the method\
    \ handleSubmission() execute. The telephone number will be commit when method\
    \ modifyObject() is called.\n\n*   Step 2: Modify user event has been generated.\
    \ When modify user event complete. CA IdentityMinder will commit the city value.\n\
    \n*   Step 3: Synchronize User event, it is not relate. It will trigger Policy\
    \ Set.\n\n*   Step 4: Synchronize User Attribute with Account will provision attributes\
    \ from provisioning directory and to endpoint.\n\n| ![](image_rsrc8UB.jpg) |\n\
    \n| Figure 4-21 shows steps of provisioning |\n\n### 4.4.4 BLTHContext and ProviderAccessor\n\
    \n​This example is kind of experiment for better understanding BLTHContext and\
    \ ProviderAccessor. We will try to update city and telephone attribute by using\
    \ both APIs. Let see what is going on.\n\n​Code\n\n1.  Compile our java code:\
    \ com.book.idm.blth. ModifyUserByBoth\n\n2.  Copy class (include package folder\
    \ ” com.book.idm.blth” ) to folder “\\IdentityMinder.ear\\custom”.\n\nConfiguration\n\
    \n1.  Log into the Identity Manager User Console as administrator.\n\n2.  Select\
    \ tab Roles and Tasks, and select menu modify admin task.\n\n3.  Search and select\
    \ our admin task name: Update Location and Ext Number\n\n4.  Click button “Business\
    \ Logic Task Handlers”, then icon “pencil”.\n\n5.  Modify value as below.\n\n\
    | Field Name | Value | Description |\n\n| Java Class | com.book.idm.blth.ModifyUserByBoth\
    \ | Our java class that we put in custom folder |\n\nWe can execute our code by\
    \ admin task following these steps:\n\n1.  Log into the Identity Manager User\
    \ Console as administrator.\n\n2.  Select tab: Book Example and select menu: Basic.\n\
    \n3.  Select Admin Task: “Update Location and Ext Number”.\n\n4.  Then search\
    \ and select some users.\n\nModify attributes by using BLTHContext\n\n​Let see\
    \ the first version of our code inside method handleSubmission(). We comment every\
    \ things about ProviderAccessor.\n\n| ​//Using BLTHConext​User user1 = blthContext.getUser();​user1.setAttribute(\"\
    l\", \"New City\");​user1.setAttribute(\"telephoneNumber\", \"1111111\");​//Using\
    \ ProviderAccessor​/*String userid = user1.getUniqueName();​User user2 = blthContext.getUserProvider().findUser(blthContext.getTSContext(),\
    \ userid, null);​user2.setAttribute(\"l\", \"New Town\");​user2.setAttribute(\"\
    telephoneNumber\", \"2222222\");​user2.modifyObject();​*/ |\n\n​Execute admin\
    \ task: Update Location and Ext Number. We will get error with the telephone attribute.\n\
    \n| ![](image_rsrc8UC.jpg) |\n\n| Figure 4-22 screen shows errors |\n\n​We got\
    \ error about the presence of attribute: telephoneNumber.  When you use BLTHContext\
    \ to modify the attributes, you have to concern “fields” that are defined in this\
    \ admin task.             \n\n| ![](image_rsrc8UD.jpg) |\n\n| Figure 4-23 shows\
    \ all attributes defined in our admin task |\n\n​BLTHContext can modify any attributes\
    \ defined in admin task. If you try to modify any attributes outside scope (for\
    \ example: telephone number), you will get exception.\n\n​Modify attributes by\
    \ using ProviderAccessor\n\n​The next version of our code, we comment the problem\
    \ line (modify telephone number) and uncomment ProviderAccessor part. Compile\
    \ and deploy code to server.\n\n| ​public void handleSubmission(BLTHContext blthContext)\
    \ throws Exception {​//Using BLTHConext​User user1 = blthContext.getUser();​user1.setAttribute(\"\
    l\", \"New City\");​//user1.setAttribute(\"telephoneNumber\", \"1111111\");​//Using\
    \ ProviderAccessor​String userid = user1.getUniqueName();​User user2 = blthContext.getUserProvider().findUser(​      blthContext.getTSContext(),\
    \ userid, null);​user2.setAttribute(\"l\", \"New Town\");​user2.setAttribute(\"\
    telephoneNumber\", \"2222222\");​user2.modifyObject();​} |\n\n​Execute our admin\
    \ task again and see the result. On the screen, we select city value as: Toronto.\n\
    \n| ![](image_rsrc8UE.jpg) |\n\n| Figure 4-24 we change city value as Toronto\
    \ |\n\n​Now we have 3 places set one city attribute:\n\n1.  On screen set value\
    \ as“Toronto”.\n\n2.  BLTHContext modify city value as “New City”.\n\n3.  ProviderAccessor\
    \ modify city value as “New Town”.\n\n​Which one is the winner? The final result\
    \ is:\n\n*   City is “New City”\n\n*   Telephone Number is “2222222”\n\n| ![](image_rsrc8UF.jpg)\
    \ |\n\n| Figure 4-25 shows the final result |\n\n​We can see step by steps:\n\n\
    *   Step 1: User entry city attribute value as “Toronto”.\n\n*   Step 2: BLTHContext\
    \ override city attribute value as “New City” but not commit."
