    \ method\n\n#### Screen-Defined Logical Attributes vs. our Logical Attribute\n\
    \nWhen you create screen, you can create screen-Defined Logical Attributes. The\
    \ screen-Defined Logical Attributes are defined for only one screen. They can’t\
    \ share with other screens but the logical attributes can share.\n\n### 6.3.3\
    \ Use Case\n\nRefer to the official document, Progamming guide > Logical Attribute\
    \ > Use Case Examples\n\n#### Format data from a data source\n\nIn the user directory,\
    \ a telephone number is stored as the physical attribute `phone`. It has 10 digits—for\
    \ example, 9785551212. This physical attribute is associated with the logical\
    \ attribute `formatted_phone`.\n\nThis use case need to override `toLogical()`,\
    \ to return formatted phone and override method `toPhysical()` to convert from\
    \ formatted phone to be number.\n\n#### Validate data entry\n\nThe physical attribute\
    \ `employeeNumber` exists in a data source, and it is mapped to the logical attribute\
    \ `validEmployeeNumber`. After a user assigns an employee number to the `validEmployeeNumber`\
    \ attribute on the task screen and clicks Submit, CA IdentityMinder calls a custom\
    \ logical attribute handler to query the data source to be sure that the supplied\
    \ employee number exists in `employeeNumber`. If it does not exist, the logical\
    \ attribute handler throws an exception.\n\nThis use case queries the database\
    \ to convert between logical attribute and physical attribute.\n\n```java\n@Override\n\
    public void toLogical(LogicalAttributeContext ctx) throws Exception {\n    //step\
    \ 1\n    String empNo = ctx.getPhysicalAttributeName(\"employeeNumber\");\n  \
    \  String empNoValue = ctx.getPhysicalAttributeValue(empNo);\n    //step2\n  \
    \  String validEmpNoValue = queryByPhysicalID(validEmpNoValue);\n    //step3\n\
    \    if(empNo!=null){\n        String validEmpNo = ctx.getLogicalAttributeName(\"\
    validEmployeeValue\");\n        ctx.setLogicalAttributeValue(validEmpNo, validEmpNoValue);\n\
    \        return;\n    }\n    throw new IMSException(\"invalid employee number\"\
    );\n}\n``` (Wait, checking logic below)\n\nA task screen requires a customer to\
    \ provide the type of service they have purchased—Gold, Silver, or Bronze. These\
    \ options are presented in a drop-down list associated with the logical attribute\
    \ `serviceType`. When the customer chooses a service level and clicks Submit,\
    \ CA IdentityMinder calls a logical attribute handler that converts the selected\
    \ service level to the corresponding physical attribute value (1, 2, or 3) and\
    \ assigns the value to the physical attribute `type`.\n\nThis use case is same\
    \ as our example. You have to implement `initializeOptionList()` returns type\
    \ of service: Gold, Silver, or Bronze and implement method `toPhysical()` and\
    \ `toLogical()` convert the value between type of service(Gold, Silver, or Bronze)\
    \ to be number (1,2, or 3).\n\n## 6.4 Validation Rules\n\nAttribute validation\
    \ rules help validate value that user types on screen meet the right format. Validation\
    \ of user entry can be regular expression, JavaScript, or Java implementations.\
    \ In this book will focus on Java programming. For regular expression and JavaScript,\
    \ you can see example from official document (but validation rules by Java programming\
    \ is missing).\n\n* Task-level validation: validation rule directly to a particular\
    \ task. You can define rule during task-screen configuration.\n* Directory-level\
    \ validation: validate the attribute but has been applied all tasks. It is global\
    \ scope. You have to define in `directory.xml`\n\n#### 6.4.1 Programming\n\nFor\
    \ task-level validation, you have to implement `TaskValidator` and override method\
