  trans: "\n\n我们可以实现自定义监听器来监听事件。当事件发生时，事件监听器会在执行的特定状态下执行业务逻辑：执行前、之后、失败、批准、拒绝。事件监听器在异步阶段运行。\n\
    \n示例：\n\n* 用户创建成功后，向 MQ 发送消息。\n* 如果管理员在任何修改用户事件上拒绝了请求，监听器将写入日志文件。\n\n| ![](img/image_rsrc8TJ.jpg)\
    \ |\n| 图 3-5 显示了事件监听器 API 可以监听事件。 |\n\n### 3.1.5 逻辑属性 API (Logical Attribute API)\n\
    \n逻辑属性 API 显示属性的方式与其在用户目录中的物理存储方式不同。当属性在多个屏幕中共享，且你不想在每个屏幕上执行值的转换逻辑时，应使用此 API。\n\
    \n示例：\n\n* 你有一个物理属性 `BusinessCategory`，其存储值为代码：`1001`、`2001` 或 `3001`，但在屏幕上显示为广告、零售或电信。\n\
    \n| ![](img/image_rsrc8TK.jpg) |\n| 图 3-6 显示了逻辑属性 API 在屏幕上将物理值转换为逻辑值。 |\n\n###\
    \ 3.1.6 验证规则 (Validation Rules)\n\n用于验证屏幕上的字段值。你可以在以下位置编写规则：\n\n* 任务级：它将在特定屏幕上进行验证。\n\
    * 目录级：它将在任何屏幕上每次对该字段进行验证。\n\n示例：\n\n* 员工编号必须全数字。\n\n### 3.1.7 邮件模板 (Email Template)\n\
    \n从 CA IdentityMinder 发送邮件有 2 种方式：\n\n* 邮件通知策略。\n* 邮件模板。\n\n邮件模板 API 是其中一种。我们可以通过编写模板文件来实现。\n\
    \n### 3.1.8 通知规则 (Notification Rule)\n\n通知规则决定了谁接收邮件。通知规则仅在邮件模板未使用。\n\n示例：\n\n\
    * 在任务更新位置完成后，向 HR 经理发送邮件。\n    * 邮件模板用于生成邮件内容以及决定何时应该发送邮件。\n    * 通知规则用于获取 HR\
    \ 经理的邮箱地址。\n\n### 3.1.9 任务执行 Web 服务 (TEWS)\n\n如果我们希望第三方系统执行我们的管理任务，则必须启用 TEWS\
    \ 功能。TEWS 将管理任务作为 Web 服务的提供者。\n\n示例：\n\n* 用户使用 Web 门户修改地址。门户调用企业服务总线 (ESB)，然后\
    \ ESB 调用管理任务的 Web 服务来更新地址。\n\n## 3.2 任务阶段 (Task Phases)\n\n我们已经讨论了同步和异步阶段的概述。本节将解释管理任务执行的阶段细节，以及每个\
    \ API 何时会被执行。\n\n你现在不需要记住所有内容，当你练习书中的示例时，你会自动记住它们。\n\n### 3.2.1 同步阶段操作\n\n1. 用户选择一个管理任务进行执行。\n\
    \    * 业务逻辑任务处理器 API：调用 `handleStart()` 方法。\n2. 管理任务主体被选中，但尚未显示。\n    * 业务逻辑任务处理器\
    \ API：调用 `handleSetSubject()` 方法。\n    * 字段的默认值可以使用 JavaScript 或硬编码初始化。\n    *\
    \ 与物理属性关联的字段将自动从数据存储填充相应的数据。\n3. CA IdentityMinder 显示并填充任务屏幕。\n    * 逻辑属性：调用方法\
    \ `toLogical()` 以转换物理属性。\n4. 当用户点击验证按钮（如果你有）、用户更改标签页或你有在更改时验证的逻辑时，CA IdentityMinder\
    \ 在数据输入期间调用验证规则。\n5. 用户提交任务屏幕。\n    * 调用验证规则。\n    * 逻辑属性 API：调用方法 `validate()`\
    \ 执行字段级验证。\n    * 逻辑属性 API：调用方法 `toPhysical()` 将逻辑属性转换回对应的物理属性。\n    * 业务逻辑任务处理器\
    \ API：调用方法 `handleValidation()` 执行任务级验证。\n6. 用户提交任务屏幕。\n   如果发生验证错误，错误将立即报告给用户。允许用户纠正错误并重新提交任务。\n\
    7. CA IdentityMinder 为任务实例化事件。\n   在成功完成所有验证后，CA IdentityMinder 创建事件。每个事务都由一个事件表示。\n\
    8. 任务进入异步阶段进行处理。\n   有 3 个主要的 API：业务逻辑任务处理器、验证规则和逻辑属性在同步阶段执行。下面的图片显示了提交管理任务后的屏幕。消息“Task\
    \ pending”（任务处理中）意味着该任务后面有事件处理，或者异步阶段从现在开始。\n\n| ![](img/image_rsrc8TM.jpg) |\n\
    | 图 3-7 显示了显示 Task pending 的屏幕 |\n\n### 3.2.2 异步阶段操作\n\n1. CA IdentityMinder 发布事件。\n\
    2. 事件监听器执行审批前的属性更新\n    * 事件监听器 API：调用方法 `before()`。\n3. 自定义对象在工作流处理执行执行\n   \
    \ * 参与者解析 API：如果工作流指定了工作流活动的参与者（审批者），调用方法 `resolve()` 返回参与者列表。\n    * 工作流 API：`start`。如果启用了工作流且事件映射到工作流过程，则工作流过程中的活动必须在事件完成之前完成。\n\
    4. 事件监听器执行执行前的属性更新\n    * 工作流过程会导致事件的批准或拒绝。\n    * 当工作流过程被批准时，CA IdentityMinder\
    \ 执行关联事件。\n        * 事件监听器 API：调用方法 `approve()` 或 `reject()`。\n5. CA IdentityMinder\
    \ 执行事件。\n6. 事件监听器执行执行后操作\n    * 事件监听器 API：调用方法 `after()`。\n7. CA IdentityMinder\
    \ 生成邮件通知\n    * 调用邮件模板 API 和通知规则 API。\n\n有 5 个 API：事件监听器、工作流、参与者解析、邮件模板和通知规则在异步阶段使用。\n\
    \n## 3.3 配置 IDE\n\n我们使用 Eclipse 开发代码。请从书籍网站下载。\n\n类路径 (Class path)\n\n请检查 Project\
    \ Properties > Java Build Path。\n\n如果你使用 12.6 版本：\n\n* 创建类路径变量：`IDM_LIB`\n   \
    \ * 选择 windows > preference > class path variable > new\n    * 设置路径为 `/server/IdentityMinder.ear/library`\n\
    \        * 如果你使用 WebLogic，所有的 jar 包都位于 `APP-INF/lib`。\n\n| ![](img/image_rsrc8TN.jpg)\
    \ |\n| 图 3-8 显示了类路径变量 |\n\n如果你使用 12.5 版本，请移除我所有的 jar 包：\n* 从 deploy 文件夹 `/server/IdentityMinder.ear/library`\
    \ 添加所有 jar 包\n    * 如果你使用 WebLogic，所有的 jar 包都位于 `APP-INF/lib`。\n* 从 `/server/IdentityMinder.ear/user_console.war/WEB-INF/lib`\
    \ 添加 `identitymanager.jar`。\n\n导入项目 (Import projects)\n\n* 运行 Eclipse 并选择 import\
    \ > Existing projects into Workspace。\n* 浏览归档文件，选择项目并点击 finish。\n\n| ![](img/image_rsrc8TP.jpg)\
    \ |\n| 图 3-9 显示了导入项目 |\n\n## 3.4 总结\n\n本章介绍了 CA IdentityMinder 的 9 个 API：它们是什么以及在何时执行。我们已经解释了任务阶段：同步阶段和异步阶段。\n\
    \n* 同步阶段：业务逻辑任务处理器、验证规则和逻辑属性。\n* 异步阶段：事件监听器、工作流、参与者解析、邮件模板和通知规则。\n* 任务执行 Web 服务将管理任务作为\
    \ Web 服务的提供者。\n\nCA 通过 bookshelf > CA IdentityMinder > programming > Javadoc Programming\
    \ Reference 提供每个 API 的 java doc。下一章将详细介绍业务逻辑任务处理器 API。\n\n# 第 4 章 业务逻辑任务处理器\n\n\
    Business Logic Task Handler API 或 `BLTH` 是在管理任务级执行业务逻辑的 API。业务逻辑任务处理器具有独特特性：\n\
    \n* 业务逻辑任务处理器 API 在管理任务会话级工作。\n\n"
- fmt: "\n* Business Logic Task Handler API executes under synchronized phase\n  \
    \  * It means users have to wait until the logic complete.\n* Business Logic Task\
    \ Handler API must be complete before any events created.\n* Business Logic Task\
    \ Handler API is good for:\n    * Validating and formatting task screen fields.\n\
    \    * Enforcing custom business logic that require response immediately (synchronous)\n\
    \n## 4.1 Programming and Configuration Concepts\n\nBusiness Logic Task Handler\
    \ API can be implemented by Java or server side Java script. Our book use only\
    \ Java language. For server side Java script, you can see in the details official\
    \ document. We will use `java` as the one language for every APIs and we can gain\
    \ benefit from `java` utility library also.\n\n### 4.1.1 Programming\n\nTo implement\
    \ Business Logic Task Handler API, we just create a `java` class and extend `BLTHAdapter`\
    \ class and override the methods. Each method is a call-back method that will\
    \ execute during admin task’s life cycle. You can choose to implement some or\
    \ all of the methods depending on your requirement:\n\n* `handleStart()`: will\
    \ execute at the beginning of the task.\n* `handleSetSubject()`: will execute\
    \ after selecting the subject (for example select user) from the search result.\
    \ It sets the initial value on screen.\n* `handleValidation()`: will execute after\
    \ the user has submitted the task. It is for validation.\n* `handleSubmission()`:\
    \ will execute after `handleValidation()`. It is used to perform logic.\n\n####\
    \ Development Steps\n\n1. Writing `java` code which extends `BLTHAdapter`.\n2.\
    \ Compiling and making sure there is no error and using `JDK` version same as\
    \ server version.\n3. Copy class file (include package folder) to folder `\\IdentityMinder.ear\\\
    custom`.\n\n### 4.1.2 Configuration\n\nBusiness logic task handlers can be configured\
    \ by 2 scope types:\n\n* Global business logic task handlers: This level means\
    \ it will be applied to all admin tasks. Our `java` code will be executed every\
    \ time when any admin tasks are called.\n* Task-specific business logic task handlers:\
    \ this `java` code will be executed with specific admin tasks that are configured.\
    \ This scope will be used frequently in this book.\n\n#### Global business logic\
    \ task handlers\n\nThey are configured in the Management Console by selecting\
    \ `Home > Environments > <your server> > Advanced Settings > Business Logic Task\
    \ Handlers`.\n\n![](image_rsrc8TR.jpg)\n| Figure 4-1 shows screen for global business\
    \ logic task handlers |\n\nYou can click the `New` button to configure a Business\
    \ Logic Task Handler. Each field on the configuration screen is the same as the\
    \ task-specific business logic task handlers.\n\n#### Task-specific business logic\
    \ task handlers\n\nThis level will apply to specific admin tasks. There are steps:\n\
    \n1. Log into the Identity Manager User Console as administrator.\n2. Search for\
    \ admin task name.\n3. Click the `Business Logic Task Handlers` button, then click\
    \ the `Add` button to specify the `java` class name.\n\n![](image_rsrc8TS.jpg)\n\
    | Figure 4-2 shows button `Business Logic Task Handlers` for task specific |\n\
    \n## 4.2 Task Session\n\nA task session is an instance of an executing task. During\
    \ task execution, business logic task handlers can access the information in the\
    \ current task session. Task session information is available through `BLTHContext`.\
    \ The interface provides methods for retrieving the run-time instances of managed\
    \ objects in the current task session, for example:\n\n* Method `getUser()`: retrieves\
    \ the `User` object involved in the current task.\n    * Please note, `getUser()`\
    \ will work if the admin task has a primary object `User`, for example `modify\
    \ user`. If your admin task is `modify endpoint`, it does not make sense to call\
    \ `getUser()`.\n* Get any relationship objects (such as roles and groups).\n\n\
    `BLTHContext` inherits from many parent interfaces:\n\n* `TaskInfo`: information\
    \ about the current task; for example `getSubject()` returns the primary object.\n\
    * `IMContext`: provides methods about the session used to share the session between\
    \ APIs. This interface provides the method `getAuxDataRoot()` to access the root\
    \ of the auxiliary data tree as well.\n* `ProviderAccessor`: provides direct access\
    \ to any managed objects in the data store. We will talk about managed objects\
    \ in the next section.\n\n## 4.3 Access to Managed Objects\n\nManaged object means\
    \ an object in the data store such as `user` or `account`. A business logic task\
    \ handler can access a managed object in the following 2 ways:\n\n#### By ProviderAccessor\n\
    \nThe `ProviderAccessor` is the parent class of `BLTHContext`:\n\n* Can access\
    \ any managed object.\n* Can access any attributes in a managed object.\n* When\
    \ calling `modifyObject()`, any changes made to a managed object are immediately\
    \ persisted to the data store.\n    * No events are generated, and no workflow\
    \ approvals, auditing, or security checks are performed.\n\n#### By Context\n\n\
    The Context in this chapter means `BLTHContext`, but other chapters mean `WorkflowContext`,\
    \ `EventContext`, etc.\n\n* Limit access to the task session includes the subject\
    \ (primary object) of the task and the subject’s relationships.\n    * For example\
    \ admin task: `Modify User`. The context can access only the `User` object as\
    \ the managed object of this task.\n* Limit access the attributes:\n    * For\
    \ example if an admin task defines only `city` attributes of the `user` object,\
    \ you cannot access the `country` attribute of the `user` object.\n* Any changes\
    \ will commit when the event is complete.\n    * For example if you use `BLTHContext`\
    \ to modify the `city` attribute, but the user modify event fails or the workflow\
    \ (inside event) is rejected, the `city` attribute will not commit.\n    * CA\
    \ IdentityMinder generates events for the task, and workflow approvals, auditing,\
    \ and security checks can be performed.\n\n![](image_rsrc8TT.jpg)\n| Figure 4-3\
    \ shows 2 ways to access managed object. |\n\nThe table below compares the differences\
    \ between `BLTHContext` and `ProviderAccessor`.\n\n| Topic | ProviderAccessor\
    \ | BLTHContext |\n| :--- | :--- | :--- |\n| Access Object | Can access any managed\
    \ objects. | Access only objects related to task session. |\n| Access Attributes\
    \ | Can access any attributes. | Limit access depending on when you define admin\
    \ task. |\n| Modify values | When calling `modifyObject()`, modified values are\
    \ immediately committed in the data store. | Values are not committed until the\
    \ event has been complete. |\n| Events | No additional events are generated. |\
    \ Related to the event associated with the task. |\n\nWe will cover more details\
    \ of managed objects with examples in the next section and chapters.\n\n## 4.4\
    \ Code Examples\n\nIn CA IdentityMinder programming, we use a java project named\
    \ `IdmCode`. We reuse the admin task from the previous chapter. We will execute\
    \ the admin task with Business Logic Task Handler API only, so we need to disable\
    \ Identity Policy Set and policy Xpress from the previous chapter.\n\n![](image_rsrc8TU.jpg)\n\
    | Figure 4-4 shows disabling Identity Policy Set and Policy Xpress by unchecking\
    \ enable check box |\n\n### 4.4.1 Basic programming: BLTHAdapter and life cycle\n\
    \nThis example shows step by step the basic programming of a Business Logic Task\
    \ Handler. The CA IdentityMinder programming always requires two parts: coding\
    \ and configuration. This example just shows the Business Logic Task Handler API\
    \ life cycle. We will print to the log file.\n\n#### Code\n\n1. Run the eclipse\
    \ and select java class:\n    * Package: `com.book.idm.blth`\n    * Class: `BasicLifeCycle`\n\
    \    * Extend `BLTHAdapter`\n\nThe list below shows our code\n"
