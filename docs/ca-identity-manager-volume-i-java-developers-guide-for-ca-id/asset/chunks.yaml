    \ | 由服务器自动 | WorkPoint Server 自动完成此活动 |\n\n如果你需要审批者，请选择节点类型“Automated by a person（由人工自动）”。\n\
    \n如果你必须执行任何逻辑或调用后端，请选择节点类型“Automated by server（由服务器自动）”。例如，你有逻辑调用 Web 服务，当逻辑完成后，Workpoint\
    \ 将移动到下一个节点。你不需要编写任何特殊代码。\n\n如果你选择节点类型“Automated by activity（由活动自动）”来调用 Web 服务，逻辑完成后不会移动到下一个节点。进程将停止。你必须编写特殊代码来完成此节点的活动，然后\
    \ Workpoint 才会移动到下一个节点。（`Approve` 和 `Reject` 节点具有完成活动的代码）\n\n下图显示了 3 种活动/节点。\n\
    \n- 节点“App Admin”是活动：Automated by a person。\n- 节点“Call Web Servcies”是活动：Automated\
    \ by server。\n- 节点 `Approve` 和 `Reject` 是活动：Automated by activity。\n\n| ![](img/image_rsrc8V9.jpg)\
    \ |\n| 图 5-18 显示了 3 种活动 |\n\n#### 转换 (Transition)\n\n转换是工作流上连接两个不同节点的线。转换可以是无条件的，也可以是有条件的。条件转换关联有一个转换选择脚本。\n\
    \n我们使用转换作为工作流中的选择路径。下图显示了带有条件的转换。例如，如果部门（division）等于中心（central），则进入发送 ticket，然后发送邮件并完成工作流。\n\
    \n| ![](img/image_rsrc8VA.jpg) |\n| 图 5-19 显示了 3 个条件转换。 |\n\n#### 延迟节点 (Delay\
    \ Node)\n\n延迟代表业务流程中的暂停或挂起。例如，在配置过程中，我们创建了用户，但必须等待到入职日期，然后才能启用该用户。如果用户的城市是纽约，我们将在早上\
    \ 6 点为用户添加角色。\n\n| ![](img/image_rsrc8VB.jpg) |\n| 图 5-20 显示了延迟的示例 |\n\n#### 分类\
    \ (Category)\n\n类别是对象的组。类别可用于过滤设计器内的告警、邮件、脚本、进程和节点模板的列表。类别可以帮助我们导入和导出工作流。\n\n\
    #### 参数 (Parameters)\n\n当我们编写代码时，Workpoint 提供了一些参数：\n\n- `ClientContext`：对于 CA\
    \ IdentityMinder，`ClientContext` 是构建 `WorkflowContext` 的一个必选参数。`WorkflowContext`\
    \ 是 `ProviderAccessor` API 的子类。\n- `SymbolTable`：它用于返回给 WorkPoint Server。我们通常在延迟节点中使用\
    \ `SymbolTable` 来回答延迟多久。\n- `JobData`：它包含任务级的数据。我们使用 `JobData` 在节点之间共享数据。\n- `ActivityInstData`：它包含节点级的数据。我们通常在转换中使用\
    \ `ActivityInstData`。\n\n### 5.3 代码示例\n\n本章的示例将包含两个部分： \n\n- Workpoint 和代码\n-\
    \ 配置。\n\n我们将使用上一章中的管理任务。请禁用上一章中与管理任务“Update Location and Ext number”相关的 Identity\
