  trans: "\n\n1. 以 `administrator` 身份登录 `Identity Manager User Console`。\n2. 选择标签页：`Book\
    \ Example`，并选择菜单 `Update Location and Ext Number`。\n3. 搜索用户，屏幕将显示城市下拉列表。\n4. 修改城市属性并点击\
    \ `submit`。\n\n## 邮件收件人\n\n我们使用 `ProviderAccessor` 查询用户的经理，然后获取属性 `“mail”`，并将电子邮件地址添加到向量并返回。\n\
    \n```java\nString emailManager = manager.getAttribute(\"mail\");\nif (emailManager\
    \ != null || emailManager.trim().length() != 0) {\n    emails.add(emailManager);\n\
    }\n```\n\n## 模板参数\n\n在邮件模板中，我们添加了通知规则。\n\n```java\n_cc = _util.getNotifiers(\"\
    ManagerNotificationRule\",\"param1=A,param2=B\");\n```\n\n`\"param1=A,param2=B\"\
    ` 是模板参数。我们可以从参数 `templateParams` 中获取这些值。\n\n```java\npublic Vector evaluate(NotificationRuleContext\
    \ ctx,Hashtable templateParams){\n    Enumeration keys = templateParams.keys();\n\
    \    while (keys.hasMoreElements()) {\n        Object key = keys.nextElement();\n\
    \        System.out.println(\"parameter: \" + key +=\"=\"+ templateParams.get(key));\n\
    \    }\n}\n```\n\n### 6.6.3 用例\n\n我们在官方文档（Programming Guide for Java › Notification\
    \ Rule API › API Overview > Use Case Examples）中实现了用例示例。\n\n#### 通知单个用户\n\n当用户数据被修改时，检索用户名称并将请求的状态状态抄送给该用户。\n\
    \n通过编写通知规则代码，你可以从上下文中获取用户名并添加后缀作为邮件地址。你必须在邮件模板的 `_cc` 中调用通知规则。\n\n```java\nString\
    \ userName = ctx.getSubject().getFriendlyName();\nString email = userName+\"@somedomain.com\"\
    ;\nemails.add(email);\n```\n\n#### 通知用户组\n\n当用户被创建并添加到组时，检索组名（从传递到通知规则的上下文信息中），并关于新组成员通知该组。\n\
    \n我们在事件 `AddToGroupEvent` 下编写了邮件模板，因此主对象是组。我们获取组名并将组名作为上下文信息添加到邮件模板中，传递给通知规则。\n\
    \n```java\nString groupName = _eventContextInformation.getPrimaryObjectName();\n\
    _cc = _util.getNotifiers(\"NotificationRule\",\"group=\"+groupName);\n```\n\n\
    ### 6.6.3 通知规则与邮件模板的限制以及服务 API\n\n关于邮件模板和通知规则存在一些问题：\n\n- 通知规则仅配合邮件模板工作，且 Service\
    \ API 不需要通知规则。\n- 通知规则的目标是邮件收件人是谁。虽然可以使用 Service API (`InternalServiceAccessor.getEmailProviderService()`)\
    \ 访问收件人：`to`、`cc` 和 `bcc`。我们可以使用上下文搜索邮件属性。\n- 邮件模板支持动态内容，但你需要学习新的 JSP 标签库。\n-\
    \ 如果使用邮件模板，可能需要学习新的标签库，例如 `_taskContextInformation`。如果你选择 Service API，可以使用简单的\
    \ Java 代码或流行的 Java 模板框架（如 Apache Velocity）生成邮件内容。\n- 邮件模板在任务或事件、失败、完成等条件下运行。\n\
    - 而 Service API 可以在代码中的任何时候调用。\n\n## 6.7 任务执行 Web 服务 (TEWS)\n\n许多人对任务执行 Web 服务感到困惑。任务执行\
    \ Web 服务或 TEWS 将管理任务作为 Web 服务的生产者，而不是消费者。TEWS 是一个 Web 服务接口，允许第三方客户端应用程序向 CA IdentityMinder\
    \ 提交远程任务。\n\n![](img/image_rsrc8Y6.jpg)\n*图 6-23 显示了 TEWS 的工作原理*\n\n### 6.7.1\
    \ 代码示例\n\n我们开发了一个 Java 客户端来消费 TEWS。我们想通过 Java Web 服务执行我们的管理任务：`Update Location\
    \ and Ext Number`。\n\n请禁用之前代码：Policy Xpress、工作流、验证和邮件通知。\n\n#### 配置：管理控制台\n\n\
    1. 在管理控制台中，点击 `Environments`。\n2. 点击使用 Web 服务的环境名称。\n3. 点击 `Advanced Settings`。\n\
    4. 点击 `Web Services`。\n5. 如下所示填写值：\n\n| 字段名称 | 值 | 说明 |\n| :--- | :--- | :---\
    \ |\n| Enable Execution | Check | 勾选以启用该环境的任务执行 Web 服务 (TEWS)。 |\n| Enable WSDL\
    \ Generation | Check | 勾选以启用该环境的 WSDL 生成。 |\n| Enable admin_id | Check | TEWS\
    \ 使用发送到 Web 服务的 SOAP 消息中的 admin ID 来身份验证请求。如果未选择此选项，则使用生成请求的用户 ID 来身份验证请求。 |\n\
    | SiteMinder Authentication | none | 对于身份验证，在我们的示例中使用了 none。 |\n\n![](img/image_rsrc8Y7.jpg)\n\
    *图 6-24 显示了管理控制台*\n\n#### 配置：Identity Manager 用户控制台\n\n1. 登录 `User Console`。\n\
    2. 选择 `Roles and Tasks` 标签页。选择 `Admin Tasks`。选择 `Modify Admin Task`。\n3. 搜索并选择管理任务：`Update\
    \ Location and Ext Number`。\n4. 选择 `Enable Web Services`。\n5. 点击 `Submit` 保存更改。\n\
    \n![](img/image_rsrc8Y8.jpg)\n*图 6-25 显示了管理任务配置*\n\n#### 代码\n\n1. 使用 `Axis` API\
    \ 从 WSDL 生成 Java 代码。我们使用命令 `WSDL2Java` 生成 Java 代码。请检查所有 jar 文件的路径。\n\n```bash\n\
    java -cp lib/axis.jar;lib/log4j-1.2.jar;lib/commons-logging-1.0.jar;lib/commons-discovery-0.2.jar;lib/jaxrpc-1.5.jar;.\
    \ org.apache.axis.wsdl.WSDL2Java -wrapArrays=true http://<host>:8080/idm/TEWS?wsdl\n\
    ```\n2. 将生成的代码拷贝到 eclipse。\n3. 在 eclipse 中打开 Java 代码：`TEClient`。\n4. 检查所需的参数：\n\
    \    - `userId` 是你想修改的用户。\n    - `adminDN` 是执行此任务的名称。稍后详细介绍。\n    - `City` 和 `extNumber`\
    \ 是我们想要修改的值。\n\n```java\nString userId = \"allmi01\";\nString adminDN = \"uid=superuser,ou=users,ou=na,dc=host,dc=com\"\
    ;\nString city = \"New York\";\nString extNumber = \"1234\";\n```\n\n#### 工作原理\n\
    \n1. 从 eclipse 中运行我们的 Java 代码：`TEClient`。\n2. 登录用户存储目录并检查城市属性。\n\n代码从一个与管理任务标签同名的\
    \ Java 类开始：`BasicUpdateLocAndExtNumber`。该代码管理任务有两个标签页：搜索标签页和个人资料标签页。\n\n```java\n\
    BasicUpdateLocAndExtNumber task = new BasicUpdateLocAndExtNumber();\n...\ntask.setBasicUpdateLocAndExtNumberSearch(search);\n\
    ...\ntask.setBasicUpdateLocAndExtNumberUserProfileTab(profileTab);\n```\n\n3.\
    \ 对于搜索标签页，我们使用用户 ID 过滤器进行搜索。\n\n```java\nBasicUpdateLocAndExtNumberSearchFilter[]\
    \ filters = new BasicUpdateLocAndExtNumberSearchFilter[1];\nBasicUpdateLocAndExtNumberSearchFilter\
    \ filter = new BasicUpdateLocAndExtNumberSearchFilter();\nfilter.setIndex(new\
    \ BigInteger(\"0\"));\nfilter.setField(\"%USER_ID%\");\nfilter.setOp(OperatorType.EQUALS);\n\
    filter.setValue(userId);\nfilters[0] = filter;\nsearch.setFilter(filters);\n```\n\
    \n4. 我们在个人资料标签页中设置城市和 `extNumber` 属性。\n\n```java\nBasicUpdateLocAndExtNumberUserProfileTab\
    \ profileTab = new BasicUpdateLocAndExtNumberUserProfileTab();\nprofileTab.setL(city);\n\
    profileTab.set_BAR_ExtNumber_BAR_(extNumber);\n```\n\n在我们的代码中，还有两个文件：`LogHandler.java`\
    \ 和 `client-config.wsdd`。这些文件是 Axis 客户端日志器的辅助文件。你可以看到服务器和客户端之间的 soap 消息。你可以将此\
    \ xml 作为请求在 SOAP UI 或任何 Web 服务工具中使用。\n\nSOAP Request\n\n"
