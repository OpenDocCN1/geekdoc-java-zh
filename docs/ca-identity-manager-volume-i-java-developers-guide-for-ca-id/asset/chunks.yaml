    ### Action Rules Tab\n\nThis tab, we will create condition:\n\n`IF city == “New\
    \ York” THEN set Telephone number + “x” + extension number from screen`\n\nWe\
    \ define `IF` in `Action Rule Conditions` and define `THEN` in `Add Action`.\n\
    \n| ![](image_rsrc8SV.jpg) |\n\n| Figure 2-57 shows condition when city == New\
    \ York |\n\nClick on Add Action Rule button to create Action Rule.\n\n| Field\
    \ Name | Value | Description |\n| :--- | :--- | :--- |\n| Name | Set New York\
    \ Telephone Number | Name of action rule |\n| Action Rule Conditions | | |\n|\
    \ City | New York | Kind of If condition |\n\nTo click “Add Action When Match”\
    \ button, put value as below table:\n\n| Field Name | Value | Description |\n\
    | :--- | :--- | :--- |\n| Name | Set Telephone and Ext | Name of data |\n| Category\
    \ | Attributes | Group of data elements |\n| Type | Set User Values | Specifies\
    \ the data element type |\n| Function | Set | Set function |\n| Attribute Name\
    \ | Business Phone (telephoneNumber) | Our attribute |\n| Value | 111-111-1111\
    \ x {'ExtensionNumber'}` | Expected value |\n\nAdd condition for other cities\
    \ in table below:\n\n| Action Rule Conditions | Set Business Phone (telephoneNumber)\
    \ |\n| :--- | :--- |\n| City =Toronto | `222-111-1111 x {'ExtensionNumber'}` |\n\
    | City=Buenos Aires | `333-111-1111 x {'ExtensionNumber'}` |\n| City=Tokyo | `444-111-1111\
    \ x {'ExtensionNumber'}` |\n| City=London | `555-111-1111 x {'ExtensionNumber'}`\
    \ |\n| City=Sao Paulo | `666-111-1111 x {'ExtensionNumber'}` |\n| City=Dubai |\
