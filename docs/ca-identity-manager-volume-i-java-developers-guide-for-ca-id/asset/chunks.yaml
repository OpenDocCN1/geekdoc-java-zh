    \ | 我们放在 custom 文件夹中的 Java 类 |\n\n### 工作原理\n\n我们可以按照以下步骤通过管理员任务执行我们的代码：\n\n1.\
    \ 以管理员身份登录 Identity Manager 用户控制台。\n2. 选择选项卡：`Book Example` 并选择菜单：`Basic`。\n3.\
    \ 选择管理员员任务：`Update Location and Ext Number`。\n4. 然后搜索并选择一些用户。\n\n#### handleSetSubject():\
    \ 在屏幕上显示当前电话号码\n\n当屏幕初始显示时，会调用 `handleSetSubject()` 方法。因此，在这个方法内部实现设置显示分机号。\n\n\
    | ![](img/image_rsrc8UH.jpg) |\n| 图 4-27 分机号当前值已显示在屏幕上 |\n\n设置分机号，我们需要做两件事：\n\n\
