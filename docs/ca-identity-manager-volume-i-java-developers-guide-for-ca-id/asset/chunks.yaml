    \ | Task completed | Tells when this `Policy Xpress` execute |\n| Event Name |\
    \ Update Location and Ext Number (BookBasicUpdateLocAndExtNo) | Select task name\
    \ from dropdown |\n\n| ![](image_rsrc8SR.jpg) |\n\n| Figure 2-53 displays event\
    \ of `Policy Xpress` |\n\n### Data Tab\n\nThis tab is designed for getting data.\
    \ We have to capture some value before set it back. We plan to create condition\
