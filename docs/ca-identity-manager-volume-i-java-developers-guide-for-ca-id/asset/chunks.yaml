    There are some technical terms for new comer, avoid confusing.


    Endpoint


    It is destination of user data after provisioning. Examples of endpoints can be
    Microsoft Active Directory, SAP, UNIX workstation, Windows PC, or an application.


    User vs. Global User vs. Account


    In CA IdentityMinder, there are 2 major server are CA IdentityMinder Provisioning
    Server (We will call “Provisioning Server” for short)


    User means user information maintained by CA IdentityMinder. User is stored in
    CA IdentityMinder User Store.


    Global User means user information maintained by the Provisioning Server. It is
    stored in CA Directory


    Account means user information in Endpoint. For example account in Active Directory


    In figure below shows relationship between user, global user and accounts. Some
    users have a corresponding global user. When a user receives a provisioning role,
    the Provisioning Server will creates a global user. When server start provisioning
    process, some attributes from global user will been provisioned to accounts.


