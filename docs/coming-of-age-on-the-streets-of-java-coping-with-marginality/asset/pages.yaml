    First origin ethnographies were motivated by the Dutch colonial

    administration''s need for knowledge in order to control the East Indies. The

    first ethnographers were affiliated with the Leiden School of Anthropology

    and were disseminated to study various parts of the archipelago. Fascinated by

    patterns of social organization and local village economies, Patrick E. Josselin

    de Jong and Willem H. Rasser focused on the relations between descent and

    social organization in the early 1920s. Theoretically, these early ethnographers

    formed an acclaimed ''Dutch structuralism'', as seen particularly in Johan P.

    Duyvendak''s (1926) studies of marriage and alliances in the Moluccas, which

    later also inspired French anthropologist Lévi-Strauss (Solvang 2002:31).


    Nevertheless, the ethnography of Indonesia took a turn of direction

    following World War II. Until 1949, the British assisted the Dutch in

    claiming Indonesia by bombing japanese cities, which led to a batch of Dutch

    and British ethnographers from entering the country. In the 1950s, North

    American scholars started to arrive in Java and produced ethnographies most

    significant until today. These include Clifford Geertz'' The Religion of Java

    (1960) and Hildred Geertz'' The Javanese Family (1961), which were part of an

    extensive research project focused on cultural and social formations of the

    city of Modjukuto, East Java. Modjukuto became world famous, and the two

    ethnographies were responsible for almost every anthropologist knowing

    least something about Java, regardless of their geographical or theoretical

    interest. In personal communications, Indonesian colleagues argued that

    Jese culture was not only described but also invented by Clifford and

    Hildred Geertz, their strong and sustainable impact on

    anthropological and political discourses of ''being Javanese''. Influenced by
    Dutch

    structuralists, Clifford categorized the Javanese into what he called

    ''three main cultural types'': the abangan, the santri, and the priyayi. Geertz

    related these types to the ''three social-structural nuclei'' of the village,
    the

    market, and the government bureaucracy. He argued that at all times a group''s

    behavior was formed by these types, which constituted three vertically ranked

