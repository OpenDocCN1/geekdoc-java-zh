    # ARRIVING ON THE STREETS OF YOGYAKARTA


    One of the first destinations for most of the new arrivals to Yogyakarta the economy
    class train station, Stasiun Lempangan. The formally employed/ middle class, workers,
    or university students usually arrived at the Stasiun Tugu, where the trains of
    the business and executive classes stopped. The area around Lempangan consisted
    of many abandoned buildings (which once served as depots or warehouses), vast
    areas of uninhabited space along the railroad tracks, and two road overpasses,
    that served as homes and hangouts (nongkrong) for especially younger street-related
    children, transgender (waria), workers and pedestrians (tukang becak) from the
    countryside, who spent weekdays in the city, and returned home on most weekends.


    It was a lively and crowded area both day and night, and a central meeting point
    for nearby kampung residents, the jalanan, and peasants from the surrounding villages
    who were accompanying or picking arriving and departing relatives and friends.
