    of fear (takut) and hostility (musuh) towards the infected person. Because until
    today, the image of HIV is still attached to a skinny body, skin cancer, an image,
    which is frightening. I think that this is also a media campaign, which is misleading.
    This is what makes us fear HIV (Itu buat kita ketakutan dengan HIV).”


