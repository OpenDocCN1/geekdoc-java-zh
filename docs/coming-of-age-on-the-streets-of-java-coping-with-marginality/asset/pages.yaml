    and ngoko (Berman 1998).


    Anthropologist Laine Berman explains that the three speech levels of the krama,
    krama madya and ngoko reflect the quality of social relationships and the rank-related
    proximity of the interacting persons (1998: 14). If the interactants are similar
    or they are related through kinship ties or spatial neighborhoods, they can address
    each other in ngoko or madya, depending on their social positions. When their
    social positions differ, and/or spatial proximity, they would speak in either
    madya or krama – assumed that the interaction partners know how to speak these
    more refined (halus) forms of Basa Jawa.


    Speech level and behavior are linked to the mutual awareness of interlocutors''
    social positions, and the situation in which conversations or encounters take
    place. Berman writes that "these speech levels, directed by social-contextual
