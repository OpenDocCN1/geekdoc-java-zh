  md: '# 1 Theorizing Life on the Streets


    My enthusiasm for so-called ''street children'' developed as early as I was still
    a student in Social, Cultural and Visual Anthropology. Triggered by media reports
    on ''street children'' in Brazil, Guatemala, Uganda and South Africa, I became
    eager to learn how the situation was like for ''street children'' in Indonesia,
    where my regional interest lay (and still lies). I intended to depict the ''situation''
    of young street-related adolescents by making a documentary about them. Still
    a student that intended to test its ethnographic skills, I prepared for demanding
    six months during my first visit to Yogyakarta in 2001. I began to imagine how
    I could get close to supposedly glue-sniffing, extremely violent and rude, opportunistic
    kids that would take advantage of me on every possible occasion. Yet, these assumptions
    were shattered. None of the stereotypes fit with the boys and young men that I
    met at an open house for ''street children'' at Parangtritis beach, 20 kilometers
    south of the Javanese court city.


    What struck me most at that time were the friendliness, the openmindedness and
    good manners with the adolescents, who described themselves either as anak Bendoro
    or as anak Conglak¹, approached me. After spending three months at the bamboo
    hut, where we made handicrafts together that were sold to a local street art gallery
    and exchanged language skills, which included first insights into their very special
    *bahasa senang* (''happy language''), a group of three asked me to join them to
    sleep at their community hangout near the Conglak street junction in the North
    of the city. 21-year-old Monchi, Kris (19 years old) and Harvey (25 years) assured
    me that they would take care of me and if I didn''t like it there I could leave
    at any time. Of curiosity and the feeling of being offered a once-in-a-lifetime
    opportunity to learn more about life on the streets in a close-up, I agreed. In
    retrospect, this decision (presumably based on my desire and longing to establish
    field report and


    +   1 | Anak (Indon.) can mean ''child'' or ''belonging/relating to someone or
    something''. In this context, the terms can mean ''Bendoro kid/Conglak kid'' or
    ''relating to the Conglak/Bendoro street junctions''.'
