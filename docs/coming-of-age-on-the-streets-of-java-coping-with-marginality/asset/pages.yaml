    they have more power or control or ability to get others to go along, once something
    gets in motion, everyone will fall in line." (2001: 115)


    Although theoretical in his argument, the sociologist could not have provided
    a better description of Monchi. Through his proficiency in framing situations
    and brokering between various sets of actors of his vast affective and socioeconomic
    network, many of the *anak Congklak started working at a hair salon (salon), as
    mechanics (*tukang bengkel*), craftsmen (*tukang*) or small-scale vendors (*pedagang*)
    after their eviction in the aftermath of the *Congklak tragedy* in April 2005.
