    Similar to the Bendoro community, the komunitas Congklak had founded a music band,
    in 1999 (which lasted until 2010) in cooperation with the NGO Humana, which despite
    closing down ''Street University'', was still very engaged on behalf of the issues
    of ''street children''. Even street art exhibitions were held within their emerging
    informal kampung. Good relations with local police officers who guarded the traffic
    and with neighborhood shop owners; the lucrative location just behind a busy street
    junction; the informality of the place with its comparatively loose social rules;
    the openness of the komunitas and the safety it offered to ''homeless'' and busking
    children, youths and adults, made the community soon grow in number.'
