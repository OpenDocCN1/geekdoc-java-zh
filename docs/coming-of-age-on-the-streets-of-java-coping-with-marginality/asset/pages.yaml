  md: '# Note


    The names of street communities, the protagonists, and their friends have been
    anonymized. Except otherwise requested, the names of doctors, researchers, or
    activists who have publicly appeared in terms of the data have not been changed
    in order to give them the credit and respect they deserve. To better navigate
    through the many names that are mentioned in the following chapters, I will present
    community maps of the *komunitas Bendoro* and the *komunitas Congklak* in chapter
    4 (see Figures 1 and 2). The appendix comprises the data analysis framework, a
    list of images and figures of Indonesian, Javanese and colloquial terms.


    Local terms and their particular meanings are cited in brackets after their English
    translation within the text in those cases where it is necessary for a better
    understanding. In reference to emotion terms that are indicated in their original
    version in the text, the translated versions of the English terms are reduced
    to their dominant translations and are put into single quotation marks. Concise
    definitions are presented in footnotes and in the glossary; central emotion words
    and concepts are theoretically and ethnographically discussed and illustrated
    throughout the text.


    Indonesian and Javanese terms are mentioned in their singular form for better
    reading purposes. Due to the multidimensionality of the data and the different
    ways of documentation, I indicate their quality by different forms of size, caption
    and font. This might hamper the reading fluency, but is important to terms of
    accountability.


    English and Indonesian terms that refer to socially constructed categories, labels,
    and attributions are marked by single quotation marks. Again, Indonesian terms
    are italicized:


    Tattoos can equally be considered as identity markers, as important communicators
    of shared ideologies, or as a rejection of being ''spoilt'' and ''childish''.'
