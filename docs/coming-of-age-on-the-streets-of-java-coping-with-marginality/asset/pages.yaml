  md: '# Leaving the Streets 183


    enormous workload might ruin one day, Monchi had not found a solution yet to escape
    these predicaments without being malu when facing his parents-in-law, the new
    neighbors or the komunitas.


    The reasons that made Monchi increasingly furious (emosi), confused (bingung)
    and distressed (pusing) were similar to the reasons that made him leave his home
    in Jakarta almost twenty years earlier: economic pressures and exploitative family
    structures, predominantly based on seniority and patriarchy. Again, the consequences
    of an exaggerated ''machismo'' of his father-in-law and the heads of the new kampung
    painfully affected the most vulnerable. Monchi''s stigmatized identity as jalanan
    (who was neither a ''local'' from Bambangrejo nor did he hold any valuable family
    wealth, honourable or professional background) put him in a subordinate social
    position both within the kampung and the family.


    In January 2007, Monchi, Dyah and Ary finally managed to move out of the house
    into their own home. Surprisingly, the small wooden Javanese house (limasan) was
    only 20 meters from Pak Tanto''s house. When I asked him why they did not move
    further away, he said there were various reasons why his choices for the new place
    were limited: wife did not want to move too far away her parents, he felt pity
    (kasihan) for Ibu and his brothers and sisters-in-law (adik-adik), and there were
    not too many places that would ''accept people like us'' (terima orang seperti
    kita) in his kampung.


    Although Dr Yanri and other activists continuously warned him about the years
    to take better care of himself, Monchi kept rushing through the various fields
    of his vast networks brokering between the anak Congklak, his new kampung, and
