    women NGO-activists, trainees or students who stayed and worked in Yogyakarta
    over a longer period of time, and had different motivations for living, studying
    or working there than the perulating travellers and tourists.


    Referring to professional ''gilolos'' in Bali and Yogyakarta, Judith Schle argues
    that prestige accumulation resulted from the ''conquest'' of bule women might
    be related to a personal triumph in transgressing racial borders (2001:132). In
    the context of the anak Bendoro, I argue that ''prestige surplus'' resulted from
    the young men''s increased economic capital, which was displayed publicly by means
