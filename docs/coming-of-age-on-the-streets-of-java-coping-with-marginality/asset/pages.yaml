  md: 'cohorts. The protagonists'' transitions from street-related ''children'' to
    ''youth'' to ''adults'' shall be analyzed with a critical research perspective,
    which considers bodies'' physical maturation and rebellion as crucial for age-related
    techniques of coming to terms with marginalized resources and contesting stigmatized
    social identities.


    As chapters proceed, I will emphasize the coming of age on the streets was not
    only economically, socially and physically demanding, but also an emotionally
    arduous process. Moral stigmatization, intersecting marginalities and rebellious
    bodies in times of illness did not only influence and limit the protagonists''
    income generating opportunities, but also affected their self-perception and subjective
    well-being. My ultimate aim remains to emphasize the protagonists'' resilience
    and remarkable social and ethics in transforming marginality and stigma into vital
    socio-economic cooperation and affective ties with various actors of their widespread
    social networks.


    Since street-related coming of age and/or socialization theories are predominantly
    rooted within the boundaries of disciplinary rationales I take in a more integrative
    anthropological perspective. My training as social, cultural and visual anthropologist
    and my subsequent interdisciplinary exposure (predominantly to psychology, sociology,
    neuro-anthropology and philosophy) as doctorate student and post-doctoral scholar
    over the course of the last ten years will color the sections in this chapter,
    in I intend to elaborate the theoretical perspective in relation to the situations,
    events and narratives that I had encountered in the ''field''.


    # STREET-RELATED CAREERS


    The ''street child'' label is ineffective for practical (policy making) as well
    as academic purposes. This becomes evident when one considers the label itself
    and asks: whose interests are served by the labeling of ''street children'', and
    whom does this label represent (de Benin 2011; de Moura 2002; Glauser 1990; Panter-Brick
    2002?) Benno Glauser (1990: 143) argued in his groundbreaking contribution Street
    Children: Deconstructing a Construct nearly thirty years ago, ''when talking about
    street children we may so without having a clear idea about what we are talking
    and, in addition, we take the risk of mutual misunderstanding''.


    And yet, the ''street child'' remains a label that sells from a media perspective
    and wins donors for the appeals of transnational NGOs (Aptekar/Stoecklin 2014;
    Glauser 1990). Giuseppe Bolotta (2016) and Didier Fassin (2012; 2013) have discussed
    such global developments in our age of humanitarian reason as a ''passionate ethos'':
    ''an extreme attention to human suffering produced by the continuous staging,
    production, and circulation of'
