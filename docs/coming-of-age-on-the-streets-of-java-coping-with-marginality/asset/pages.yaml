  md: 'Die Reihe EmotionsKulturen / EmotionCultures versammelt Arbeiten, die sich
    aktuellen Fragestungen der Emotionsforschung aus einer innovativen transdisziplinären
    Perspektive nähern. Im Mittelpunkt stehen vornehmlich empirische Studien aus dem
    Bereich der Sozial- und Kulturanthropologie, die – in jeweils enger theoretischer
    und/oder methodischer Verzahn mit weiteren Disziplinen – Prozesse der sozialen
    und kulturellen Modellierung von Emotionen und Affekten untersuchen.

    Zentrale Themenspekpunkte betreffen die Genese emotionaler Ordnungen in ihrem
    Wechselspiel mit soziulturellen, historischen und politischen Strukturen. Die
    Reihe spannt dabei den Bogen der Sozialisation von Emotionen in der Kindheit bis
    zur Transformation im Alter und schließt damit auch konfliktliche Rekonfigurationen
    des Emotionalen vor dem Hintergrund veränderlicher Lebensbedingungen mit ein.
    Ein besonderer Schwerpunkt liegt auf dem mit Migrations-, Globalisierungs- und
    Transnationalalisierungsprozessen verbundenen emotionalen und affektiven Dynamiken.


    The series EmotionCultures is a collection of works centered around current questions
    raised in interdisciplinary and innovative research on emotions. At the core are
    empirical studies from Social and Cultural Anthropology that analyze processes
    of social and cultural modeling of emotions – always in close theoretical as well
    as methodological connection to various other disciplines.

    Key topics concern the generation of emotional codes in interaction with socio-cultural,
    historical, and political structures. Thus, this series ranges from the socialization
    of emotions in childhood to their transformation with increasing age. It incorporates
    reconfigurations of emotions against the backdrop of changing life conditions.
    Furthermore, a particular focus rests upon the emotional dynamics inherent to
    processes of migration, globalization, and transnationalization.'
