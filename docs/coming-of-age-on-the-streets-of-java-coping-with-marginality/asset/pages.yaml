  md: '# Coming of Age on the Streets of Java


    Consequently, guides the reader through the ethnography, whereas the other four
    protagonists and their friends are juxtaposed to illustrate both individual particularities
    and communal similarities in their extended street carers.


    # STEP FIVE: IDENTIFYING PATTERNS OF SOCIAL RELATIONSHIPS AND STRUCTURES.


    The analyses of the protagonists'' life stories and social encounters by means
    of the extended case study method are oriented along sociologist Jack Katz''s
    (2001) ''analytic induction''. The sociologist urges researchers to focus on recurring
    actions and interactions in particular events, from which hypotheses shall subsequently
    be developed. By means of comparison with other events, i.e. social encounters
    and other protagonists'' behavior in similar events, were crosschecked whether
    a hypothesis could be formulated, or if revision was needed until compared cases
    fitted the developed hypothesis.


    STEP SIX: THE RESEARCHER''S EMOTIONS. There has been little work on the epistemological
    dimensions of emotions (Davies 2010, Spencer; Svasek 2010). I expand on the critical
    self-reflexivity of anthropologists such as James Clifford and George Marcus (1986),
    Vincent Capranzano (2010), Georges Devereux (1967), Byron Good (2012), Renato
    Rosaldo (1991), Philip Salzman Hsu (1999), Judith Oikey (2012), Unni Wikan (1992),
    highlighting the methodological significance of emotions as embodied communicators
    between ethnographers and their interlocutors. As I describe more concisely in
    chapter 6, the play and articulation of emotions is crucial in communicating one''s
    positionality within social encounters. As embodied products of researcher-related
    interactions, emotions may either motivate or discourage further engagement. The
    emotions that researchers express (or suppress) and articulate (or mute) in encounters
    with their protagonists, shape the ways in which stories and realities are conveyed.
    Ignoring the epistemic quality of emotions obstruct our capacity to make profound
    claims about other people'' experiences, behaviours, and speech. I am inclined
    to argue that making the participant observer''s social involvement and pervasive
    affective practices in the field more transparent solidifies the ethnographic
    data. Since the research protagonists'' experiences, behaviours, and narratives—ethnographic
    data'' in other words—are not only relational but are also affective and emotional,
    obscuring the researcher''s emotions represents only half of the ethnographic
    reality. More provocatively, one could argue that failing to acknowledge the inter-affectivity
    of ethnographic data (i.e., both relational and affective) distorts the data.


    Similar to other colleagues, I have documented my excitement and anxiety when
    I arrived in Yogyakarta for the first time, the happiness after having established
    social relations, the pride of sensing a ''belonging'' to my host'
