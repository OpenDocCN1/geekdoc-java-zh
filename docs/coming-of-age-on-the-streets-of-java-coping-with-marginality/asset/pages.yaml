  md: '# Appendix 255


    communities, the fear and anxiety to do fieldwork ‘the wrong way’ and the distress
    related to playing many different social roles as activist, anthropologist and
    friend. These reflections have translated into the introduction (chapter 1) and
    the method section (chapter 2). When compared to other disciplines, this has become
    inevitable good anthropological practice, a rhetoric where ethnographers demonstrate
    their ethics in terms of reflecting on the ethnographer''s positionality and subjectivity
    when compared to other disciplines like psychology, social psychology, or political
    science. But once it comes to ‘theory’ and ‘ethnography’, ethnographers sometimes
    transform from immersed empathetic fieldworkers into robotic analysts that disappear
    behind a collage of detached ethnographic data and others'' texts. This is a pity,
    because it homogenizes ethnographers'' vivid and unique perspectives on encountered,
    documented and analyzed social realities. It obscures the generative formation
    of ethnography and reproduces our mode of knowledge production as ‘hermeneutic
    black box’ that sometimes obstructs collaboration with scholars from other disciplines
    (Shryook 2016; Stulka)


    What seems methodologically promising is a thorough documentation of emotions
    that are directly related to encounters with research partners, interlocutors,
    informants, and witnessed less impersonal phenomena, because they arise from and
    the social relationships and encounters with informants, interlocutors, collaborators,
    research partners, and spaces. Treating the fieldworker''s emotions as relational
    data can be epistemologically rewarding, because emotions are by definition phenomena
    that we relate us with others, and this widely acknowledged fact is standard procedure
    when we analyze the experiences and emotions of others (Engelen/ Röttger-Rössler
    2012; Holland 2008), but it has been ignored as epistemological plot, as embodied
    and robust attempt of understanding, imagining, and representing others.


    In my case, the montage of ‘traditional empirical data sets’ with my emotion diaries
    in which I documented my relations to the encounters with research protagonists
    has enriched my understanding of the lifelorlds I got in. I have conducted an
    emotion-based research diary (see, above: tidying up) in which I have documented
    emotions related to my encounters with research partners and protagonists, and
    subsequently analyzed them in relation to the other data sets. Whereas this complementary
    data set remained marginal in many analytical steps, the recognition, reflection,
    and analysis of my own emotions related to the encounters with the *anak Bendoro*
    and the *anak Congklak*, and their comparison with the narratives of NGO activists,
    expatriate social workers, artists, doctors, and researchers, helped me to develop
    a theoretical framework that could make sense of the social and emotional practices
    on both sides of the observed interactive continuum (see)'
