  md: '# Epilogue: ''Cleansed Streets'' 249


    manipulation of various ''faiths'', fanaticism, increasing public shaming and
    stigmatization campaigns of LGBT, violent protests against peaceful feminist events,
    the continued stigmatization of children and grandchildren of alleged former members
    of the communist party (PKI), violent attacks on cultural events, the public demonization
    of alcohol consumption and its prohibition of sale in shopping centres and little
    vending stalls, and a local media and police that gives in to the threats of politico-religious
    thugs for the sake of ''public harmony'' suggest that the suasana Jogja has indeed
    turned sour.


    The Perda Gepeng and related camp assessment do not only affect street-related
    communities as I have described in this book. The Yogyakarta version equally affects
    street-related waria (''transgender'') and the other communities. From a broader
    perspective, which takes the legal practices and related curtailing of free speech,
    the regulations of public spaces, the disciplining of gender identities and sexualities
    (Hegarty/Thajib 2016), and politics of care of Indonesia''s decentralized and
    autonomous local governments into account, the Yogyakarta Peraturan Daerah Gelandangan
    dan Pengemis No. 1 2014 hints to a national movement of disciplining and normalization
    of Indonesia''s citizens. The joint forces of activists, academics and stakeholders
    of the governmental apparatuses seem critical in contributing to more compassionate
    ways of indonesia''s current campaigns of governing its most vulnerable populations,
    and uniting against politico-religious hardliners and their bold techniques of
    stigmatizing, marginalizing and excluding those who do not fall in line.'
