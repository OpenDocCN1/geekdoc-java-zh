  md: '# 6 Emotional Economies of Avoidance and Attention


    With time, practice and experience the protagonists learned how to relate and
    attune to various types of persons in ways that did not result in frustration,
    harm or derogation. The young men clustered persons and related spaces into those
    that needed to be avoided due to anticipated harm and others that were provoked
    and sought after, because of their imagined social support, economic, material
    and other rewards. Douglas Hollan''s definition of subjective wellbeing in relation
    to place-making helps helps to clarify my understanding of what I define as affective
    ''avoidance'' and ''attention fields'', as subjective zones of anticipated distress
    on the one hand, and comfort, security and benefits on the other, when he writes:


    > [A]ll communities create zones of activities and engagements for people that
    affect their sense of well-being in relatively positive or negative ways. As people
    move through the course of a day and traverse the socialscapes around them, as
    they move from one location to another and engage with various types of people
    and activities, they feel more or less safe and secure, more or less stimulated
    and engaged, more or less well or unwell.” (2009:215)


    I will illustrate the protagonists'' empathy-based techniques of ''reading'' and
    encountering different sets of actors within various extended case studies of
    both avoidance and attention fields and ultimately summarize their emotive practice
    and rhetoric as ''emotional economies'' in the final section.'
