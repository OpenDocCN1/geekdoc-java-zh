    with a warm heart”.


    In the 1970s, as a result of prolonged economic crisis in the region, recurring
    droughts, the effects of the ‘green revolution’, a capitalist restructuring of
    agriculture (Hüsken/1980s), a lack of labor-intensive industry, scarce work opportunities
    from agriculture and small-business (Booth 1992), and excessive violence related
    to the killings of communists in the mid-60s (Farid 2005), a great number of farmers
