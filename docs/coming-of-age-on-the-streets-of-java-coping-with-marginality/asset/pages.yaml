    # Cleansed Streets


    In 2014, the government of the autonomous Special Region Yogyakarta (Daerah Istimewa
    Yogyakarta) has adopted a by-law, which is publicly referred to as Perda Gepeng
    No.1.2014. The regional law targets the social welfare (kesejahteraan sosial)
    of the Special Province''s citizens and reveals in its opening paragraph that
    it is concerned with “vulnerable social groups living in poverty, lack, limitation,
    and a social divide, and who lead a disorderly and unruly life [...] in effective,
    rigorous ways based on a sustained legal basis and human dignity, to ensure social
    welfare and public order.” A similar regional law was first introduced in the
    capital autonomous region of Jakarta (Jakarta Khusus Ibukota Jakarta), and has
    since been passed in most of the Java provinces of Indonesia.


    The Perda Gepeng penalizes the “begging street music” (ngamen) in public, the
    street-related communities'' source of income. Article 5 prohibits being a homeless
    person (gelangan), who has no ID card, no fixed abode, no steady income, and who
    “no future plans for themselves nor for their children.” Article 6 forbids to
    a beggar (pengemis), that is a person “a whose income generation depends on the
    sympathy and compassion of others (tertinggal pada bela kasih orang lain), and
    exerts pressure or induces anxiety and fear in others (agak teriksa/takut), by
    who wears dirty and disheveled clothes, c who loiter in busy or strategic places,
    and d. who applies the aforementioned and similar practices in order to induce
    sympathy and compassion in others”.


    After almost ten years of negotiation with NGOs, CBOs, street-related communities
    and local governments, the Yogyakarta administration has translated sociocultural
    stigma that criminalizes street-related communities and subsumes them under the
    new term gepeng, which is an acronym of the Indonesian words for ‘homeless’ (gelandang)
    and ‘beggars’ (pengemis). The increased regulation of public spaces does not come
    as a surprise, but it is striking that a law directly targets the feeling norms
    and emotive practices of street-related workers, pedestrians, motorcycle and car
    drivers. It is prohibited to work at strategic locations if wearing inappropriate
    clothes and trying to evoke sympathy or compassion. Offenders are arrested and
    brought into camps, where they are observed and assessed into one of


