    # KOMUNITAS BENDORO


    Bendoro community comprised of adolescent and young men who were sometimes referred
    to as gembel (vagrants) or preman (gangsters) by people who passed them while
    they worked, slept or hung out at traffic light and related sidewalks of Yogyakarta’s
    city center. Benevolent people referred to them as anak jalanan, jalanan, or anak
    Bendoro. Considering their self-description, anak Bendoro would be the appropriate
    term. It means literally translated ‘child of Bendoro’ or ‘belonging to Bendoro’.
    With Bendoro being the name of a street near Malioboro, the term stands for the
    young men’s (anonymized) local point of reference, where they lived and worked.
    The flock of tourists and various street busking and vending opportunities for
    handicrafts, temporary tattoos or T-shirts still rendered Malioboro a profitable
    location to generate income. However, official vending and busking opportunities
    became more limited throughout the last fifteen years by the numerous vending
    bands that were imposed by the Yogyakarta Municipality. Informal vendors such
    as the anak Bendoro had to struggle in order to keep their selling and busking
    spots.


    Increased spatial pressure and the frequent violent students over working spaces,
    combined with the anak Bendoro’s past prominence when they were portrayed in a
    docufiction in the late 1990s, and their high exposure to NGOs and tourists, created
    pride narratives that the anak Bendoro continuously reproduced. They were not
    tired to stress their bangga (‘Bendoro pride’) in relation to other street-related
    communities including their GIRLI ‘friends’ of the komunitas Congklak, who lived
    and worked about eight kilometers North of the Bendoro hangouts at a busy highway
    intersection.


    Both the anak Bendoro and the anak Congklak initiation at Malioboro as tough (keras)
    and painful (sakit). Monchi, who later became the ketua (‘leader’) of the komunitas
    Congklak, initially had to endure dares in order to be allowed to sit with the
    anak Bendoro when he first arrived in Yogyakarta in 1996:


    If you wanted to join them and sit with them and they knew you were a ‘new kid’,
    they beat you up. Afterwards you were asked to drink and sit with them. Crazy.
    Thomas: And now?


    Monchi: It’s not the same anymore, when a ‘new kid’ joins, or one misbehaves in
    the eyes of the anak Bendoro. Although he will definitely be beaten up, it is
    more human now. Hahaha.'
