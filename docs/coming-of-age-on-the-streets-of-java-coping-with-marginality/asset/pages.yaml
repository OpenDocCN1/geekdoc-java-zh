  md: '# 7 Leaving the Streets


    This final chapter focuses on the relationship between physical maturation, rebelling
    bodies, changing social role expectancies, related transformations of coping strategies
    and attempts of leaving the streets during later stages of the protagonists''
    ''street careers''. The life stories reveal that regardless of individually differing
    coping strategies and biographies, the protagonists increasingly attuned to the
    ''Javanese ways'' (cara Jawa) of the kampung and, in some cases their ''new families'',
    as re-emerging primary social fields of focus and interaction, which they had
    so strongly opposed during their youthful ''heydays'' on the streets (chapter
    5).


    I will scrutinize age-related transformations and adaptations of coping with a
    matured body, its self-perceptions and social ascriptions by the social environment,
    and discuss these vis-à-vis increased stigmatization of street-related communities
    and their radical disciplining by means of laws and surveillance policies. The
    chapter highlights Monchi, Kris and Jim''s stories of personal calamities and
    mental physical illness, which surfaced and accumulated during early adulthood.
    Jempol and Harvey will appear within these stories, but their life stories are
    only touched upon contrastive foils.


