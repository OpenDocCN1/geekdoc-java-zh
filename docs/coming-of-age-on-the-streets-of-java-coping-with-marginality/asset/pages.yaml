    # Encounter 2: Bangor


    Bangor had lived on the streets of Yogyakarta with his older brother Raden since
    he was 11 years old. The two were sent to an Islamic boarding school (pesantren)
    and orphanage with their middle brother, Danny, after their parents had died in
    a traffic accident. In 2001, one year later at the orphanage, Raden and Bangor
    escaped and joined the Bendoro community. Danny followed them in 2003. Raden,
    Bangor, and I had known each other since their first weeks on the streets of Yogyakarta.
    In the early days, Bangor was very quiet and shy whenever I addressed him.


    Six years later, in December 2007, Bangor, 17 years old, called me from the mobile
    phone of Pram, an activist who directed an NGO that focused on HIV prevention,
    care, support, and treatment. I had introduced Bangor to him on one of our jointly
    held workshops on STDs and HIV prevention. HIV had shocked the anak Bendoro after
