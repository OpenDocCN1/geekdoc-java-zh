    # MUSIC WORK


    Work on the streets followed particular rules. The street junctions, traffic lights
    and public spaces of the city were delineated into territories where only certain
    communities were allowed to work and reside. Unauthorized trespassing was severely
    punished by excessive violence from entitled street-related communities. This
    could provoke prolonged spirals of revenge (*balas dendam*) between certain communities.
    The territorial division of the city into community territories was also a way
    of controlling and limiting the access of peers and families from neighboring
    kampung who intended to work on the street junctions, too. In order to protect
    these informal territorial rights to work and sleeping places, the *anak Bendoro*
    and the *anak Congklak* nurtured good relationships (*hubungan baik*) with policemen,
    neighborhood officials, neighbors, shop owners, parking attendants, or passing
    city bus drivers. The cultivation of good relations included respectful and deferent
    behavior, sharing of profits in case of successful trading goods, or passing information
    on suspicious activities of other communities or individuals surrounding the street
    junctions and its neighborhoods.


    The way in which income was generated reflected social positions within the komunitas.
