    # Excursus: The HIV-AIDS Stigma


    Putting the rhetoric and practice of opinion leaders can be elucidated in the
    context of those affected by them, the power of discourses can be elucidated.
    ‘Discourse’, then, is understood as ‘affective talk’. In the context of a hierarchical
    and-worshipping society, publicly articulated virtues are reproduced by alleged
    moral authorities normativizing affective talk on how to lead a moral life and
    how to measure those who do not fall in line.


    Noviantovi pointed out – similar to other local contexts (Butt 2005; Dilger 2005;
    Dilger/Luig 2010; Farmer 1992; Kroeger 2003) – the phenomenon of HIV-AIDS was
