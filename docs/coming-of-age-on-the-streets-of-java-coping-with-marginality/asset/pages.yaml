    # HARVEY: GO ORGANIC!


    Harvey had remained a close friend of Monchi and the *komunitas Bendoro*, although
    he had joined the *komunitas Bendoro* as the Congklak tragedy in 2005. In *chapter
    4*, Jim had described Harvey as excessively violent in case or his *komunitas*
    were threatened. By contrast, I got to know him as polite, affectionate, and cooperative
    person, whose speech was considerate and polite (*halus*), whose gestures were
    serene, and whose walk was smooth and elegant. When the neighbors of the *kampung*
    had burnt the Congklak communities'' shelters in April 2005, Harvey was almost
    killed because he tried to secure some of the community''s belongings. The neighboring
    *kampung* residents, who had burnt the huts behind the busy street junction, inscribed
    their disapproval of the ''*jalanan*'' and left burning scars on his torso and
    on his back. As the Congklak tragedy moved him to open a house near Malioboro,
    joined the *komunitas Bendoro* and started working at the workshop of the frequently
    mentioned eco-social project, where he produced wooden toys that were sold in
    the gallery together with Jempol.


    In February 2006, at the age of 30, Harvey made a decision that would change his
    life. With Harto from *komunitas Bendoro*, he started a vocational training program
    as organic farmer in West Java. 15 months later, in April 2007, they both graduated
    from the training with certified distinction.


