  md: '# Activist and Researcher Encounters


    The encounters of the anak Bendoro and anak Congklak were as diverse as the actors
    within this so-called ''charity field''. Nevertheless, particular interaction
    patterns between protagonists of the komunitas and NGO activists¹¹ did not only
    catch the anthropologist''s attention. These patterns were constantly discussed
    among activists and volunteers of various NGOs, whose insights and ad-hoc analyses
    substantially contributed to formulating my argument.


    Compared to most other Indonesian cities, there was an immense proliferation of
    both local and foreign social activists, volunteers, and researchers in Yogyakarta.
    Particularly until the mid-2000s street-related communities had been a central
    part of the city''s charity and media focus. But with the shifting of donor organization''s
    policies and changing media discourses, the jalanan have faded and more into oblivion
    (Pravitta 2012).


    The focus of this section is to analyze the transformation of interactions and
    attunements between activists and the street-related young men during the last
    fifteen years. I will describe and analyze case studies of social encounters between
    activists, anak Bendoro, anak Congklak, and myself.


    After I started to systematically focus on social encounters and the affective
    and emotive practices and rhetoric, it struck me how contradictory both the protagonists''
    and ''activists'' narratives about each other were compared to their observable
    behavior in face-to-facemouthed. While hanging out on the streets, the protagonists
    continuously mouthed NGOs and their activists. After listening to the adolescents
    and young men talk about NGOs, encounters with activists would have to be subsumed
    within the ''avoidance fields''. Asking for help and being dependent on someone
    else was perceived as manja (''spoiled''), and thus incompatible with the protagonists''
    proud self-narratives. Within these narratives of community-related pride, NGO-workers
    and activists were labeled as ''opportunistic'' and ''exploitative''. They were
    objects of constant gossip and complaint. After a long-term activist from a closely
    related NGO once rejected 20-year-old Raden''s request for monetary support, I
    witnessed him complaining to his Bendoro peers:


    11 | Although there are differences between the Indonesian terms ''aktivis'' (activist)
    and ''orang LSM'' (NGO worker) regarding their monetary compensation and identification
    with their ''cause'', there was a considerable quantitative shift from volunteering
    activists to pay ''contract workers'', I will not further focus on these differences
