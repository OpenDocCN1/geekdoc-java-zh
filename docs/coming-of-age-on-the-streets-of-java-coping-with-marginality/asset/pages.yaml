    stressed the community''s group solidarity, mutual help, and politeness to outsiders.
    Monchi became ketua also to proliferate social skills of framing encounters and
    brokering between various people of different backgrounds. These skills promoted
    him and contributed to the community''s ''prosperity'' and survival over the years.
    It was particularly praised for his great optimism and inspiration for the young
    community members. Moreover, the anak Congkl appreciated his non-macho attitude
    and his non-violent approach when handling disputes and violent conflicts of others.


