  md: '# 2 Fieldwork and Ethnography


    Fieldwork with street-related adolescents and young adults has to consider their
    spatial mobilities and extensive fields of social interaction, and at the same
    time provide the researched, collaborators and researcher himself with enough
    reasons for such time-intensive, psychologically and physically challenging endeavors.
    In trying to understand how the protagonists with marginality, stigma and illness,
    a systematic focus on emotions, which draws on the epistemic reflexivity of research
    partners and collaborators (Holmes/Marcus 2008; Stodulka 2015); offers gateways
    to mutual understanding. Long-term involvement with street-related communities
    is a process that requires empathy, the communication of respect and flexibility
    that allows the ethnographer to participate in their sophisticated lives. As a
    unique way of observing, witnessing and trying to understand and explain what
    matters most to the persons and communities I studied with, ethnography might
    be best described as a “theoretically informed practice” (Comaroff/Comaroff 1992:27),
    that is personal, intimate, affective on the one hand, and analytical, detached
    and scientific on the other.


    # COLLABORATIVE ACTION RESEARCH


    The term ‘collaborative action research’ goes back to social psychologist Kurt
    Lewin, who wrote 70 years ago:


    “The research needed for social practice [...] is a type of action-research, a
    comparative research on the conditions and effects of various forms of social
    action, and research leading to social action. Research that produces nothing
    but books will not suffice. This by no means implies that the research needed
    is in any respect less scientific or ‘lower’ than what would be required for pure
    science in the field of social events. I am inclined to hold the opposite to be
    true.” (Lewin 1946:35)


    Action research is an open-ended cycle of posing questions, gathering data, reflection
    and deciding on a course of collective action. These actions are then'
