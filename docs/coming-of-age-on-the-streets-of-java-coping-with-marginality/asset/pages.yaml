    # MONCHI: THE ''REBEL BODY''


    Compared to Jim''s story, an early diagnosis provided Monchi with more time to
    develop strategies of coping with the newly acquired attribute to identity. Monchi''s
    phenotypically healthy body did not reveal his illness to others. He navigated
    carefully through the social webs of family, friends and neighborhood, and managed
    to cope with self-blame and guilt as long as he was healthy, the HIV-positive,
    but phenotypically healthy body became ''attractive'' for numerous NGOs that focused
    on HIV-AIDS prevention, care, support and treatment. By playing his cards right,
    attractive ''NGO-body'' could facilitate access to new social fields of emotional,
    social and economic attention. In case of an early diagnose, HIV opened up new
    possibilities of evoking sympathy and compassion within the ''charity field''.
    Regarding the ongoing decrease of accessible social fields in the process of coming
    of age, HIV could create possibilities to generate new social fields of attention
    and allure new companions in terms of his sophisticated emotional economy. Whereas
    the stigma of AIDS regarding Jim''s highly visible ''rebelling'' body scared off
    those, were once clustered out of the attention fields, the stigma of HIV, tacitly
    communicated to particular sets of out-group actors (particularly NGOs and HIV
    activists), could open new doors as long as one managed to keep a phenomenologically
    healthy body.


    Attending closed and open meetings of NGO-sponsored support groups and conforming
    one''s HIV-status and related emotions to empathizing interactants (curhat) was
    not only an advisable way of relieving distress. It worked as technique to create
    trust and affective bonds, and establish new social networks and emotional economies
    (between 2006 and 2010 NGOs, for example, sponsored ''ODHA'' when setting up small-scale
    economic enterprises with a warung, a laundry; a beauty salon, and angkiran)


    Monchi started to realize Henry''s and Jim''s deaths that his coping in terms
    of herbal medicine (jamu), forgetting (lupa) and being busy (sibuk) for others
    needed to be attended to changing responsibilities as husband, father, neighbor
    and his increasingly ''rebelling'' body. The week after Jim''s funeral, when we
    started meeting again regularly, he told me once again – that he wanted to change
    his way of life. If not ... - klok, he said and turned his right hand so that
    the inside of his hands showed up to the sky. I cannot remember that Monchi ever
    used the word ''death'' (mati). He referred to ''death'' by either using the words
    sudah pergi – ‘he/she already left’, sudah tidak ada – ‘he/she is not there anymore,
    or simply ... - ''klok'' by simultaneously turning his right hand and raising
    his eyebrows. He continued:'
