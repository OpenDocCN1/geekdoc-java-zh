  md: '# Theorizing Life on the Streets


    discourses and images concerning grief and pain” (Bolotta 2016). Based on a propagated
    simplicity of solving ‘street children’s’ problems by donating money to global
    and local social welfare institutions, the ‘street child’ seems a particularly
    suitable opportunity for various people along the organizational chain of humanitarian
    reason (from donors to those who make a living by working with face-to-face) to
    ‘do good’ and help relocate the children and adolescents into more adequate places
    (i.e. asylums, families, extended families, or orphanages). Such simplified solving
    mechanisms often target symptoms but not causes of homelessness, stigmatization
    and marginalization. ‘Street children’ help to satisfy the urge to ‘do good’ without
    the need of a deeper involvement in political action or a more profound analysis
    of underlying social conditions. Anthropologist Catherine Panter-Brick describes
    the concept of the ‘street child’ as a highly manipulated construct, which ultimately
    represents the needs of welfare agencies and governments. She is convinced that
    matters of children on the street are often inflated, essentially produced to
    justify the agency’s work. She argues that, “At best, these estimates rest upon
    largely elastic and nebulous definitions of homeless and working children. At
    worst they are made up.”(2002: 153)


    The lack of concise definitions not only provoke welfare agencies’ (intentional
    or unintentional) exaggerations in order to legitimize their existence and funding,
    but by the contrary to the downplaying of the numbers by governments in order
    to retreat from their social welfare obligations. “In brief, the statistics are
    problematic: they reflect the particular agendas of organizations that collect
    them, and they are part of the construction and the management of homelessness
    as a social issue.” (Panter-Brick 2002: 15.4)


    The oversimplification of the ‘street child’ label is not limited to the media
    and the project-oriented agendas of NGOs, but also affects the social and cultural
    sciences (de Benítez 2011; de Moura 2002). The pressure to publish with all speed
    and the difficulties to conduct research with street-related persons and communities
    beyond the brokerage and the open houses of NGOs can result in methodological
    rapid assessments that create analyses that are strikingly similar to media and
    NGO-discourses. Referring to theory-building in a more general perspective Henrietta
    states that it is crucial to acknowledge that academic discourses are adopted
    and subverted by media and other public discourses, but for our work as anthropologists
    it is equally important to acknowledge the influences of public discourses, global
    and local folk models on the construction of academic theories (1994: 135).


    Olga Nieuwenhuys describes the ‘street child’ as a “category of discourse constructed
    around the children of the poor, with a firm rooting, in the history of the West”
    (2001: 552). More provocatively, the ‘street child’ is a social category, arbitrarily
    applied to urban settings that have hardly more in common than the existence of
    streets and children. Contrary to Moura and'
