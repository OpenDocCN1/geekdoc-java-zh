    # THE MUTUAL BENEFITS OF EMPATHY


    It took me years to understand put my feelings of sympathy, compassion, admiration,
    and fascination related to the young men''s survival skills, and my insecurity,
    disappointment, even rage when reflecting on their ''judicious opportunism'' (Johnson-Hanks
    2005). I could not make sense of the protagonists'' behavior; I felt hurt and
    exploited over and again. I became very skeptical of the ''truth'' behind their
    stories, especially when I was drawn into curate, emotive actions and social dramas
    that concluded with a plea to take action on their behalf. No matter how long
    I had the young men and how persistently I negotiated with them, in the heat of
    the moment taking action meant that the issue at stake could be solved by, immediately,
    and by ''borrowing'' money and other goods. It felt painful to be reduced to a
    ''walking cash machine'' or to find out from others that stories might have been
    altered by putting these recurring emotions of disappointment and deception, I
    banned them to an emotional scrapbook from my professional notebooks, where I
    targeted emotional detachment in my descriptions and reflections of others'' experiences,
    actions, and narratives. Only later, while at my desk, I was forced to make sense
    of the turbulent times in the field, I reluctantly remembered my emotional diary,
    that gloomy witness of my unprofessional emotional shadow in the field. Reading
    through it led to some surprising insight. My notes hinted at patterns in the
    protagonists'' and interactions that were hidden from my detached analytical sight.
    The emotional diary revealed two things. First, I realized that the young men''s
    judicious opportunism was not necessarily a hostile act toward me as a person,
    but related to my positivity as an activist-anthropologist. This helped me to
    cope with disappointment and disillusionment. Second, the emotional landscape
    of my jottings was almost identical to those recounted in the interviews and narratives
    of the street-related young men''s most prominent interaction partners, such as
    employees and activists of NGOs.'
