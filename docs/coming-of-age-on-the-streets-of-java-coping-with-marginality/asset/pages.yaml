    immorality pushed them back into vicious stigma-marginality circles.


    In his seminal book, Stigma: Notes on the Management of Spoiled Identity, Erving
    Goffman defined stigma as an “attribute” that is deeply discrediting (1963: 12).
    Although the author advised researchers to focus on the relational aspect of stigma,
    subsequent approaches defined stigma as a mark in the person. Only during the
    early 2000s, social psychologists (Crocker/Major/Steele 1998; Major/O’Brien 2005)
    and social scholars (Corrigan/Watson 2002; Sayce 1998; Yang et al. 2007) have
    begun to theorize stigma as a social construction, relational to the socio-cultural,
    political, and historical context and its local hierarchies. This relational situates
    stigma in its socio-cultural environment and power asymmetries between stigmatizers,
    bystanders, and the stigmatized, by actually adopting anthropological marginality
    frameworks.


    Accordingly, the medical scientists Bruce Link and Jo Phelan (2001) argue that
    stigma can be identified when particular ‘others’ are distinguished and labeled
    ‘different’, their ‘difference’ is associated with negative attributes, ‘they’
    are separated from ‘us’, and finally ascribed a status loss that results in ‘their’
    discrimination. In an extension of this decidedly cognitive perspective, epidemiologist
    Lawrence Yang (2008) advanced a stigma model that is more sensitive to cultural
    and moral dimensions. It elaborates how the negative changes in a person’s ascribed
    moral status result in the deprivation of an essential social position by limiting
