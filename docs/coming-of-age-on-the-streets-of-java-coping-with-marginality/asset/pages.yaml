    come of age, too. Although most of the protagonists and their friends still referred
    to themselves as either ''anak Bendoro'' or ''anak Congklak'', depending on who
    they encountered, many young men have become part of *kampung* communities, mostly
    those of wives and new families. Some moved out of the city, and others have died
    due to chronic illnesses, traffic and other accidents.


    What was beyond imagination ten years ago became reality in 2012: both the *komunitas*
    Bendoro and the *komunitas* Congklak evaporated into collectively shared memories.
    Not only did the protagonists and their friends outgrow the age of ''*jalanan*''
    at their former communities'' locations, but also the former hangers themselves,
    were either deserted or turned into shopping centers and hotels. Until 2014, the
    Bendoro and Congklak junctions were still crowded with children, adolescents,
