    in mushrooming local NGOs, especially the anak Bendoro saw many activists and
    researchers come and go. Stories about ''naïve anthropology students'', the gossip
    about ''bad activists'', and the flattering feeling of being ''really special''
    among all the other activists and anthropologists accompanied me throughout the
    years.


    The protagonists managed to address particularly the expatriates among volunteers
    and activists who drew them into their long-term emotional economies. Cooperation
    with local activists, who stayed and did not leave the city after a few weeks
    or months, was initiated in terms of regular and sustainable project activities
    like workshops, medical treatment, or access to education. With the expats on
    the other hand, cooperation targeted the establishment of socio-economic security
    networks in times of crisis. The latter were built on shared affect that transpired
    as sympathy, compassion and care. As foreign activists followed the implicit rules
    of conduct, they were flattered and publicly promoted as ''asyik'' and often contrasted
    with the ''arrogant'' (sombong) and rigid local activists, who could not be as
    easily ''played'' by attended and concerted displays and arrangements.


