    # Contested Images: NGO Activists and ''Jalanan''


    Both professional NGO-workers and volunteering activists were defined as ‘good
    people’ (*orang baik, orang asik*) who did not oblige the protagonists to adhere
    to fixed timetables and rules or ‘force’ to attend compulsory workshops. The ideal
    activist was someone who understood their way of life, spent much time with them,
    did not ask the wrong questions, and helped out financially. The *tekan* repeatedly
    articulated that time-intensive persistence in really caring (*betul-betul peduli*)
    of them and their problems was very important. In order to not only become, but
    remain an *orang baik*, activists had to convey permanent attention for their
    personal and collective concerns without giving the impression to prioritize particular
    persons. The young men emphasized that in order to become an ‘orang baik’, activists
    had to prove first that they were not a ‘bad person’ (*orang jelek*). Regarding
    the myriad interests that lurked in encounters with the young men, remaining an
    ‘orang baik’ seemed almost impossible. Because being a good and caring person
    for Monchi and the *komunitas* Congklak at the same time could be considered ‘jelek’
    for Irianto from the same komunitas, and different in the eyes of the anak Bendoro.


    Individual and collective interactions with NGO-activists were monitored by other
    communities and were a central part of daily gossip and rivalry. Although the
    expression of ‘iri’ (envy) or ‘cemburu’ (jealousy) had to be avoided, as they
    were perceived as signs of vulnerability, inferiority and cultural immaturity
    (Stodulka 2017), they were often articulated when referring to others. Monchi
    was especially *takut* (afraid) of many members from the *komunitas* Bendoro *iri*,
    when either he or his *komunitas* were perceived as being supported too much by
    the activities of an NGO or particular activists. Moreover, Monchi worried that
    friends from his own community might become envious or jealous because he, the
    community leader, was socially very close with many'
