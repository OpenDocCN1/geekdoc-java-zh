    In 2005, the komunitas Conglak comprised of 40 members between the ages of two
    and 66 years. As its leader (ketua²), the then 25-year-old Monchi aimed at attaining
    formal recognition for their place. After collecting the signatures of local bureaucrats,
    the police, and representatives of different political parties, the collective
    efforts of formally adhering to the neighboring kampung'' rules of appropriate
    conduct almost resulted in the squatter community''s local authorization as an
    officially registered kampung. Until one day in April 2005, an infuriated mob
    brought the whole place down. After six years of growth, the community decreased
    in size and those that continued working at the street junction had to move out
    of the area and find a kampung that would accept them as their dwellers. After
    the incident, which will be described in chapter 6, the following families and
    friends formed the nucleus of the community between the 2005 and 2010:


