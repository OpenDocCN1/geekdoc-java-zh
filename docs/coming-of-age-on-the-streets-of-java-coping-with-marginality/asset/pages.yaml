  md: '# Leaving the Streets


    or an anak Congklak had faded with their coming of age. The marginalization of
    street-related young people and their difficulties in blending with local society
    did not stop after they had exited the streets. Contrary to the komunitas, in
    the kampung, tattoos, piercings, ''tattered'' clothes and recurring illnesses
    could unfold as social inscriptions of marginality and stigmatized identity into
    their conspicuous bodies. Regarding the protagonists'' low descent, impaired economic
    prosperity and devalued moral qualities, the most viable way to improve their
    social positions was to comply with the norms and rules of neighborhood. Attuning
    their emotion displays to their low social position according to the hierarchical
    kampung structure by adequately embodying their hormat (''deference'') by performing
    malu was equally crucial as contributing to the social harmony (rukukun) of the
    village by complying to kampung rules and performing services for the community
    (gotong royong: ronda). This way, the protagonists agreed to transgress social
    boundaries and finally become kampung dwellers. In order to pursue these newly
    acquired priorities in life, Monchi, Kris and Jempol frequently articulated as
    fathers, husbands and officially registered kampung citizens that held identity
    cards (KTP), they could not be indifferent (cuek) towards their surroundings any
    longer. Over the years, they increasingly emphasized that as adults (dewasa) they
    had to take responsibility (tanggung jawab) for their families.


    Monchi did not jeopardize the health and lives of his wife and children, because
    he was a morally degenerate ''street kid''. The cultural ideal of securing social
    harmony and silencing ''aberrant'' matters (in this case, HIV) conspired with
    aggravated social pressure in the face of marginality and stigmatized identity
    as a jalanan – a ''street kid''. Despite the remarkable and creative coping styles
    of young men and women on the streets, marginality, stigma and inequity were persistent.


    A long-term perspective highlights the need of a wider ethnographic lens when
    designing ''intervention strategies'' in order to alleviate the psychological
    and physical suffering of street-related children, adolescents and young adults.
    It is not necessarily the immorality of ''deviant'' street communities that undermines
    local moralities of mutual respect and compassion. Sometimes it is the socio-cultural
    fabric of the family and the surrounding local society, the purported haven of
    care, support and security itself, that stirs up and fosters painful transgenerational
    spirals of shame deference and puts the lives of infants and young children at
    great risk.'
