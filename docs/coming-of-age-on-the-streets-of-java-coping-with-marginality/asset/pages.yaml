    his health condition, the future of his wife and daughter, how he could provide
    for his daughter''s and also his wife''s siblings school education, the trouble
    with his parents-in-law, and his work. Although he was always uneasy about the
    subject matter, I repeatedly asked him why he did not move further away from his
    demanding in-laws. Like a mantra, he replied each time:


    I cannot leave the little ones behind, the poor kids. Pak Tanto will keep beating
    them up. He will send them to the streets again to bust, and he would take them
    out of school. I promised Ratna that we would put her through SD and SMP, maybe
    SMA, if she keeps being so committed. And poor Mom Ida would have to beg or prostitute
    herself. I have to take responsibility (harus tanggung jawab) for the little ones.


    During the last year, Monchi had further withdrawn from the komunitas Congklak,
    shrunk to only five people on some days. He only went there to work when he could
    not earn enough as pemuling, when he picked up his daughter, his wife and his
    siblings on some late afternoons. Monchi highly disapproved Dyah took their daughter
    Ary to the street junction, but his parents-in-law thought that was better if
    they all went together. He uttered:


    > It hurts when I think of the time when I will not be here anymore. Who will
    take care of Ary? I know that Pak Tanto will her to the streets so that he does
    not have to work himself. I get furious (emosi) when I only think of it. Dyah
    sometimes is still so ‘naive’ (polos). She does everything her parents tell her
    to do. She does not understand yet (belum mengerti) that we could be independent
    from them.


    By marrying Dyah without being of appreciated descent, bringing economic wealth
    or other prestigious heritage qualities (bibit, bebet, bobot) into his new family,
    his parents-in-law could easily take Monchi’s tiresome contribution to the family
    income and his care for their own children for granted. Monchi felt that it was
    his responsibility as a father and husband to take care of his extended family
    – particularly as he knew all of them since they still lived at the Congklak street
    junction. Hence, 29-year-old Monchi’s ‘shortcomings’ of coping with his increasingly
    ill body, and the manifold phenomena surrounding HIV, particularly his ‘incapability’
    to take Dyah and Ary to a VCT, the fear of stigma and exclusion both for himself
    and his family, is best understood with regard to HIV-AIDS discourses and his
    family’s multiple intersecting marginalities.'
