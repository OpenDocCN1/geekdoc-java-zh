    the transmogrification of the immersed fieldworker into an analyst. Whereas the
    first and the second are the primary focus of this and the subsequent analytical
    summaries of chapters 5, 6 and 7 (Tekyan – Resistance, Subversion or ''Javanese
    Way''; The Mutual Benefits of Empathy; ''Revelation Blues'') the latter will be
    hinted at more implicitly throughout the book. Since the early 2000s the protagonists
    and their friends had cope with increasing police raids, restraining legal decrees,
    and a decreasing number of NGOs focusing on their affairs as ''street children''.
    These public space related political transformations resulted in increased competition
    for space, income and social support in the city center, and fostered not the
    atomization of a partially spatially, culturally and socially unified street-movement
    (GIRLI) into locally dispersed communities (komunitas). The differences between
    their respective spatial and social environments, which affected working opportunities,
    income generation techniques and group composition. Moreover, the different localities
    and social environments of the protagonists had a strong impact on the personal
    and affective dimensions of feeling to fit (cocok) and blend into their community.
    The protagonists mentioned ''feeling comfortable'' (merasa nyaman) as the most
