  md: '# Coming of Age on the Streets of Java


    Although the rules of conduct were less rigid in Bambangrejo than the places that
    have been described by Beatty (1999), Guinness (1986; 2009) or Newberry (2006),
    kampung life still consisted of many formal and informal obligations, if integration
    and cohabitation in harmony (rukun) was aspired. There were formal obligations
    like joining the ronda (patrolling) every other night in order to contribute to
    neighborhood security, taking part in neighborhood meetings, holiday celebrations
    and their preparation meetings to only a few. When asked how his new life in the
    kampung was, Monchi shook his head and answered: *Meetings, meetings, meetings,
    rules, rules.* To attain integration into the kampung, Monchi kept uniting communal
    activities to his everyday schedule.


    By means of contacts to hospitals and NGOs he started to provide the neighbors''
    children with cost-free medicine and appointments at health practitioners in the
    city''s district. Once the neighborhood found out he was volunteering for an NGO,
    the head of the kampung Monchi with the honorable duty to create an extra-curriculum
    for the neighborhood''s children in order to teach English, and make Bambangrejo
    a fix on the route of the local PUSKESMAS¹ mobile clinic through the district.
    On the other hand, the NGO got better access to Bambangrejo''s alleged children
    at risk and could implement their projects there. Again, Monchi functioned as
    an eminent broker between the NGO, the kampung authorities, the children and their
    parents.


    Whereas Monchi had previously described ''being busy'' (sibuk) as adequate coping
    strategy in order to stay healthy, the over-burdening with responsibilities and
    his increasingly rebellious body made him visibly stressed and tired. Although
    chronic diarrhea and increasing opportunistic infections decreased his body weight
    at times to 43 kilograms (48 kg with the already skinny average since he was diagnosed
    as HIV-positive). Although he knew that


