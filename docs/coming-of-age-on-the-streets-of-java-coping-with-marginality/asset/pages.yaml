    # AFFECT, EMOTION, EMOTIVE, FEELING


    Contemporary emotion research agrees on basic theoretical assumptions regardless
    of scholarly origin: emotions are defined as those social, cultural and physiological
    processes that emerge when persons negotiate, engage or interact with someone
    or something, that be real or imaginary, be it related to the past, present or
    anticipated future (Dixon 2012; Engelen et al. 2009; Godbold 2015; Izard 2010;
    2011; Lindquist/Gendron 2013; Matt 2011; Mesquita/Boiger 2014; Mulligan/Scherer
    2012; Russell 2014). Emotions are considered relational phenomena that never exist
    without ''the other''. Epistemic dissent does not primarily arise (except intentionally
    misread others'' arguments), but mostly results from different scales and units
    of analysis: the researcher focuses on physiological arousal; individuals'' experiences;
    or their encounters, communication practices and language patterns; or the transmission
    and circulation of emotions and emotion words within between groups and collectives;
    the feeling and display rules of collectives and societies; the emotion rhetoric
    of nations states; the social and cultural force of emotion words articulated
    in between and cultural and social contexts? Compared to other empirical disciplines,
    anthropology considers if not combines, these different scales within their practice-oriented
    ethnographic approach. And yet, despite anthropology''s ideal of holism, ethnographers
    have to prioritize particular analytical scales because of emotions'' complex
    and intertwined physiological, embodied communicative and rhetorical dimensions.
