  md: 'chapter 6). A more experiential comprehension of what was at stake in the street
    encounters only emerged after I had compared my own emotions as they were produced
    in my encounters with the street-related protagonists, those of local NGO activists’
    and street workers’ narratives about their involvement with the young men. My
    emotions were not an exclusively subjective experience, but a widespread social
    fact that related me to both the protagonists and their interaction partners.
    Without putting my own emotions into the analysis of the other, the theoretical
    enquiry into the affective dynamics of social interactions between actors of significantly
    asymmetrical power positions may not have proceeded.


    STEP SEVEN: RESTUDY, CROSSCHECKING THE DATA, AUTHORIZATION. The hypotheses and
    the remaining loopholes, which became obvious after the data analysis, were further
    crosschecked in restudies by means of interviews and focus group discussions with
    the collaborative action research team, the protagonists and academic research
    partners in the field. In May and June 2012, after a first draft of this book
    had been accomplished, I could luckily obtain approval to publish the monograph
    from most of the the protagonists and local research partners.'
