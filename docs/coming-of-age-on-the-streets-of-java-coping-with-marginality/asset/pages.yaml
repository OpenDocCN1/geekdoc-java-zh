    together. Malioboro exerted a magic attraction for the ''jalanan'', street musicians,
    artists, and students until the mid-2000s. Yogyakarta-based anthropologist Laine
    Berman, documented and contributed to the flourishing of the street movement (GIRLI)
    during its hedays in the 1990s, once described the street very precisely and in
    delightful words as the center of Yogyakarta:


    "Anyone who has ever been to Yogyakarta will know Jalan Malioboro, the "Main Street"
    of the city. To those who have not yet had the pleasure, it is hard to describe.
    Jalan Malioboro is the center of life for Yogians religiously, politically, economically,
    and socially. It links the kraton (the sultan''s palace) with the two "centers"
    of traditional Javanese power in both the mythical and religious senses: Gunung
    Merapi (Mountain of Fire), the world''s most destructive volcano, is located 30
    miles to the north. Parangkusuma, the beach 30 miles to the south, is said to
    be the domain of the Queen of the South Java Sea, the patron saint of Javanese
    mysticism. Jalan Malioboro is the location of the Governor''s office, as well
    as the local legislative councils. Jalan Malioboro is lined on both sides with
    shops and shopping malls of all kinds. It is considered the world''s longest permanent
    open market with stalls lining both sides of the street, on both the street, and
    in front of the shops. it is thus a Mecca for tourists, vendors, artists, musicians,
    thieves, and anyone looking for a bit of easy recreation pretty much any time
    of the day or night." (Berman 1994:20)


    Malioboro still attracted many people and ''new'' to the city, but friends who
    either lived or still live on the streets, and experienced its '' heyday'' in
