  md: '# TEKYAN: RESISTANCE, SUBVERSION OR ''JAVANESE WAY''?


    Newcomers were continuously socialized others into their *komunitas* by means
    of long periods of ritualized initiation, the acquisition of the *bahasa senang*,
    the introduction to masculinity performances, practices of *seks bebas*, working
    patterns, localities, learning how to reap adversities and witnessing the dramatic
    consequences of in-group *kasus*. The collectivity of the *komunitas* with its
    group norms of conduct and narratives of self-elevation and superiority created
    a social and identity that the protagonists communicated with their peers and
    resourcefully communicated in their encounters with others (next chapter). Initial
    feelings of (*takut*) and shame (*malu*) were transformed into a *tekyan* pride
    and the feeling of belonging to a *komunitas*. Negative emotions and self-stigmatization
    gave way to enhanced well-being and pride (*bangga*) displays that fuelled the
    emotional climate (de Rivera 1998: 159) of community life. Sociologist Jack Barbalet
    defined ''emotional climate'' as a set of emotions and feelings that are shared
    by groups of individuals implicated in common social structures and processes.
    Particular emotional climates may further as a signifier of group membership as
    particular emotions – and emotives – are fostered, highlighted, sometimes even
    shared by community members. Once *anak baru* integrated into the community and
    learned how to effectively oscillate between various emotional displays, they
    became acquainted with social techniques that increased their social esteem and
    also socio-economic mobility (next chapter).


    Classical and post-structuralist scholars have argued that a collective style
    of body inscriptions, music preferences and specific slang can come as symbols
    of resistance or culture (Gelder 2007; Hall/Jeffersonson 1993; Hebdige 1979).
    Accordingly, Beazley (2000b;c) argues that the *tekyan* identity is both culture
    and resistance against the hegemonic Javanese society at the same time. The coherence
    and the political force of the 1990s and early 2000''s street-related GIRLI-movement
    was continuously atomized into street-related communities in the 2000s. Considering
    Yogyakarta''s political, economic and social transformations during the last ten
    years, ''resistance'' might not be the adequate term to capture the *anak Bondo*
    and the anak Congklak''s ways of dealing with modernity. Seymour Myers argues
    that the "concept of resistance has become ubiquitous in contemporary cultural
    anthropology (2006: 393; emphasis in the wake of increasing analyses of power
    relations and social inequalities since the late 1970s, ''resistance'' became
    a counter-hegemonic concept, which has been applied to a broad spectrum of activities
    such as poetry among Bedouin (Abu-Lughod 1986) or love letters to Nepali youth
    (Ahearn 2001). Emerging ''subaltern studies'' have promoted the concept as a capacity
    of subordinate groups to challenge the power and hegemony of'
  merge: -1
  pgno: 112
- img_proc: true
  md: 'political, economic and cultural elites. Instead of the concept to wide arrays
    of collective and individual agency in the context of differential power relations
    in a Foucaulian sense – “Where there is power, there is resistance” (1978: 93,
    quoted from Seymour 2006: 303) – my understanding of ‘resistance’ follows Seymour’s
    definition. Resistance comprises of [i]ntensional, and hence conscious, acts of
    defiance or opposition by a subordinate individual or group of individuals against
    a superior individual or set of individuals” (ibid.: 305).


    From this perspective, I do not consider tekyan ideology as primarily intentional
    resistance against social hierarchy or sociocultural and political elites. On
    the contrary, I understand tekyan ways of living as socially and spatially attuned
    coping practices in order to navigate through various social fields in manners
    that neither jeopardize their subjective well-being and self-esteem nor offend
    without reason. Tekyan style and conduct might at first appear deviant and subversive,
    a closer look at tekyan ideology structures and Javanese ways of being, thinking,
    feeling and interacting. Both communities reveal that the young reproduced many
    facets of local social structures and were organized around structures similar
    to those of the kampung (see chapter 3). The organization of the komunitas Bendoro,
    in particular, reproduced politicized cultural ideals of seniority and patri.
    Moreover, both communities built their collective identities around the localities
    of their hangout places. They stressed in-group solidarity and drew their social
    prestige from their ‘professions’. The following chapter illustrates that the
    protagonists intended to increase their social esteem from their proximity to
    ‘good people’ (orang baik), similar to the practices of kampung residents. Only
    if the protagonists attuned to the identities of their respective interaction
    partners could cooperation be induced and social and economic capital increased;
    a social and cultural practice that lies at the heart of ‘being Javanese’ and
    its principles of the budi pekerti.'
