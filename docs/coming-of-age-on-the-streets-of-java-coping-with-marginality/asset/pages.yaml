    to Bali, where everything was commercialized, she was invited to hang out with
    “real street kids”, which she described as her most genuine travelling experience
    so far. To witness firsthand the polarity of street life, the hardships on the
    one hand and the creativity and happiness on the other, had strongly impressed
    her. Although she had “only spent three evenings at the Bendoro hangout, she had
    the impression that she had become a part of the group.” When asked what she particularmente
    liked about the nightly sit-ins, she reminded her of her own student friends in
    Europe. She felt that the people at the nightly gathering were very similar to
    “cool European students.” The way of joking, drinking, smoking and the “live-and-jet-live”
    atmosphere was something she knew from home and had not encountered anywhere else
    in Indonesia. To the tourist tours on Maliooro, “the people at the sit-ins were
    full of surprises, extremely patient, respectful towards women, and not pushy
