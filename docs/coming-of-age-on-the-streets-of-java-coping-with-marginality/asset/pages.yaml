    groups, like IDU²⁶, street children (jalanan), waria or commercial sex workers
    (PSK)²⁷ which are labeled ''dirty'' (kotor) anyways.


    Because HIV-AIDS combined everything that was considered ''non-Javanese'' and
    ''non-religious'' promiscuous sex in general and homosexuality in particular,
    since its first public appearance in Indonesia, it was related to the images of
    ''morally decayed souls'', which ravaged physically decaying bodies''. This moralized
    public discourse created an emotional climate of fear and anxiety among those
    who considered themselves sacrosanct and fueled a fear of social exclusion (i.e.
    malu) amid HIV-positive persons and related families and communities. The link
