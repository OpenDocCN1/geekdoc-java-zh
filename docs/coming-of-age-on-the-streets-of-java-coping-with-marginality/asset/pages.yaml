    taking a break from time to time, he explained to me that this was how to survive.
    Sitting and thinking would make him depressed (depresi), and his health condition
    would decline (nge-drop). He needed the heat of the action. Either he slept or
    he was on the move. The only times he seemed to sit still were our currant sessions.


    When asked he felt responsible for so many other people he always replied that
    ''we have to care for each other'' and that ''we must not be egoistic.'' It seemed
    Nasri was personally learning over his shoulder every years after his death. Although
    Monchi was a ''jalanan'', an anak Congkl, these mantras, his smoothness in maneuvering
    social encounters, his speech, his smile and politeness (span), his humbleness
    and patience (sabar), and his always respectful behavior (hormat) towards others,
