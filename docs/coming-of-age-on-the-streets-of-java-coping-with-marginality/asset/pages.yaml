  md: '# Emotional Economies of Avoidance and Attention


    The recognition, reflection, and analysis of my own emotions related to the encounters
    with the anak Bendoro and anak Congklak (see Appendix: Data Analysis), and their
    comparison with the narratives of NGO activists, expatriate social workers, artists,
    doctors, and other researchers, helped me to develop a theoretical framework that
    could make sense of the social and affective practices on both sides of the observed
    interactive continuum. A more experiential view of what was at stake in the street
    encounters only emerged after I compared my own emotions as they were produced
    in my encounters with the street-related young, to those of local NGO activists''
    and street workers narratives about their involvement with them. My emotions were
    not an exclusively subjective experience, but a widespread social fact that related
    me to both the anak Bendoro, the anak Congklak, and their interaction partners.
    Without putting my own emotions into the ethnographic picture of the other, the
    theoretical inquiry into the affective dynamics of social interactions between
    actors of significantly asymmetrical powers may not have proceeded.


    Analyzing my own emotions as they emerged in encounters with Monchi (see chapter
    6), Suram, Bicycle foe, Bangor and other protagonists and juxtaposing them with
    those articulated by their primary interaction partners, led me to two of crucial
    analytical concerns. First, I could make sense of the protagonists'' ways of coping
