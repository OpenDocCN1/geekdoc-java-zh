  md: '# Becoming Tekyan 95


    identity as ''society dropouts'' (Ziv 2013). This ''othering'' was further increased
    by their visible lack of the Javanese *bibit, bebet, bobot*, which can also be
    regarded as social, economic and cultural capital related to people''s and their
    families'' descent, wealth, and merit.


    Becoming *tekyan* and a fully integrated *anak Bendoro* or *anak Congklak* respectively
    could transpire once the adolescents had waded through the liminal stage of distressing,
    humiliating and painful initiation rituals. In order to establish a certain degree
    of subjective well-being, ''newcomers'' were forced to reappraise and embrace
    their stigmatized social identities in a more positive light. ''Emotions play
    a vital role in transforming the meaning of a stigmatized and marginalized identity
    [and] they are not merely a by-product of that transformation'' (Fields/Kopp/Kleman
    2007: 164), a positive re-evaluation of the self is difficult without emotional
    mobilization. The process of identity attenuation entails ''emotional promises''
    of stress relief and an enhanced well-being at the end of the adolescent initiation
    path guided by ''emotional rewards'' through seniors'' approving loops, words
    of solace or the introduction to new income generating opportunities (that are
    crucial for breaking away from exploitative *kakak-adik relationships*) when particular
    norms of conduct and emotion display rules were performed according to *tekyan*
    ideology.


    The neophytes attempted to leave this initial theatre of pain, not only because
    it was physically painful, but also because they were exposed to derogatory shaming
    and belittling not only by outsiders, but also by those senior *tekyan* that supposedly
    controlled them into *komunitas*. From an identity politics perception of shame-
    and pride-like emotions can manifest as subjective perception of social exclusion
    and inclusion (Casimir 2002; Lewis, 1998; Scheff 2003; 1988; Tangney 1999). Their
    experience is connected strongly to the norms and values of social groups and
    communities one aspires to belong. Participating in and attuning to community
    action contributed to converting shame and loneliness (triggered by their ''exclusion''
    from family, discrimination within their communities as uncultivated pariahs had
    to be disciplined and socialized first, and the painful experiences related to
    sexual and other exploitation by senior community members into the pride of becoming
    an acknowledged member of the *komunitas*. Peaceful experiences of shame and perpetual
    humiliations during the liminal phase of community initiation underwent processes
    of reevaluation once the newcomers felt into the community (Stoduka 2009). The
    senior community members'' positive feedback on the embodiment of *tekyan* ideology
    when reproducing emotive displays and rhetoric when addressing friends and foes
    and the cessing exposure to excessive interpersonal violence could evoke pleasant
    (*nyaman*) feelings among the *anak baru*.'
