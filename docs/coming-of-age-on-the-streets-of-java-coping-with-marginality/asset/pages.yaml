  md: '# Coming Age on the Streets of Java


    Contrary to the wider Javanese context, the public display of bangga (‘pride’)
    on being a member of a street-related community was prerequisite to being perceived
    as ‘one of them’. Whereas the feeling of bangga is locally perceived as appropriate
    by being “rightfully proud of the accomplishments of some person or thing to which
    one is connected” (Collins/Bahar 2000:40), its public display is considered ‘arrogant’
    and referred to as ‘sombong’. ‘Jalanan’ who publicly displayed bangga (‘pride’)
    by talking about their achievements, embodied a steady gaze and erect posture,
    were seen as ‘arrogant’ or ‘vain’ (sombong), ‘not knowing themselves’ (enggak
    tahu), and ‘not-javanese-yet’ (durung java) from a local coming of age perspective.
    In Yogyakarta, people continuously underscored this impropriety with the dictum,
    “Arrogance is a sin!” (Sombong itu dosa!).


    By contrast, life in the komunitas required the newcomers’ public displays or
    otherwise stigmatized identity if they wanted to become anak Bendoro or anak Congklak.
    The newcomers shifted their framework of primary reference from their families
    and the surrounding society (masarakat) to the community (komunitas). Far from
    being ‘dull’ or ‘irrational’, the public accentuation of a stigmatized identity
    could transpire emotionally and socially rewarding enterprise. Although socially
    scorn as culturally immature, the protagonists’ public displays of pride were
    sensible techniques of coping with marginality and stigmatization. The protagonists’
    efforts to resolve the fundamental conflict between sociocurally valued and stigmatized
    identities within their manifold encounters on the streets might adequately captured
    as ‘oppositional identity work’ (Schwalbe/Mason-Schrock 1996): people try to fashion
    and then maintain identities that make them feel good, or at least better about
    themselves, even they might not be morally valued by the majority of the surrounding
    environment.'
