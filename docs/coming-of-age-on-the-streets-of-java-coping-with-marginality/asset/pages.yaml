    for farm life, but who never stayed longer than one or two weeks), Harvey started
    teaching organic gardening in an orphanage and grammar school in a neighboring
    village in 2008. After he got married to his long-term girlfriend Ratih in 2009,
    who was also acquainted with Dewi'
