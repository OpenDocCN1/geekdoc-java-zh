    The imaginations of ''how bule women are'' and ''where they will take you'' one
    day were frequent topics of conversation among the young anak Bendoro.get ranged
    from romantic and mutually caring relationships to frequent, quick and dirty in
    various positions and locations. The continuous circulation and modification of
    both successful (sukses) and unsuccessful encounter stories fueled Harto and his
    peers'' imaginations. The omnipresent discussion of how to approach a bule woman
    and observable examples of suces elevated the ''conquest'' of a bule woman to
    a collective desire. Those who did not succeed yet (belum sukes), were convinced
    that the key to the women''s hearts and everything that was kept inside for them
    was their transgression of malu.


    Relating to a bule woman, and becoming her pacar, was imagined as emotionally,
    socially and economically rewarding. Excursions as ''friendguides'', short-term
    affairs or long-term relationships inspired aspirations to spend time off the
    streets, not working as an pengaman, exit street life for a certain period of
    time, and enhance one''s social position within the community. Love affairs and
    pacaran perfectly complied with the masculinity, freedom, independence and mobility
    of being an anak Bendoro.


    The embodiment of tekyan values of ''freedom'', ''individuality'' and ''independence'',
    by means of vulgar language, body decoration, and public rudeness might have distanced
    the young men who imagined themselves as ''properavanese'' or ''ideal Indonesian
    citizens'', but it promised an attractive and compatible gateway experiencing
    the traveller''s highest good of seeking and engaging in ''culturally authentic
    adventures''. Contrary to street-level young women, the anak Bendoro''s marginalities
    could be cultivated into a mysterious strangerism that proved attractive for travellers
    and other expatriates.


    Being ''strange'' to the surrounding kampung and the bule women opened up possibilities
    of re-inventing their identities and shifting between various ways of addressing
    the other. In the encounters with foreign travellers, being ''strange'' and different
    was not necessarily perceived as immoral, but could transpire as a fascinating
    way of life. Whereas alcohol consumption, hanging out on the streets, singing
    and playing subversive songs countered Javanese conformity rules, these practices
    could turn into cultural capital in their encounters with foreign women. Depending
    on the situation, the context and the imaginations of encounters, the young men
    could highlight their ''tekyanness'', their Javanese-ness, their cosmopolitan
    Rastafarian and punk, or their pauperized ''street kid'' identity.'
