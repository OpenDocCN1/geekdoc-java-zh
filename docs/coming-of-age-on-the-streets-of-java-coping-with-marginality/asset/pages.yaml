  md: '# Theoring Life on the Streets


    T: I would like to know more. And I would like other people to know more about
    how life here we really is. We could write a book together.


    M: Why do you want to write about us? Better stay our friend! You know, I''m not
    a robot who tells you his stories in order to provide you with a manual on how
    to use us.


    The animosity against researchers neither really strike nor did it surprise me
    at that time. During my first stay in Yogyakarta I had heard stories about anthropologists
    and NGO-workers who were selfish and mean that they had forgotten about them after
    they published their books or got a steady position at campus or an international
    NGO. Then I read the young men''s refusal to cooperate as a strategy to settle
    irreconcilable power asymmetries between the researcher and the researched. In
    retrospect, I understood that their narratives about other ''bad'' anthropologists
    (that were so different from me, the ''good'' anthropologist) might not have necessarily
    been based on their ethical transgressions; were a subtle, but effective technique
    to discipline and educate their guest in their terms.


    The young adults knew what I wanted from them: stories, authenticity and a feeling
    of belonging. Then, I had to find out what could offer them in order to remain
    a ''good'' anthropologist. The times had changed and the adolescents had matured
    into young men with ''adult'' problems. The times of chasing girls, experimenting
    with making motorbikes and guitars disappear in the one place and appear in another
    seemed to have passed. Their stories were now circling around marriage trouble,
    providing for the family, exiting streets and integrating into neighborhoods,
    or ways of coping with chronic illnesses. Upon my return to the field another
    year later in 2006, for twenty months, we had to readjust our mutual expectations
    and imaginations. By mutually exhausting and subtle psychological micro-battles
    regarding my role as friend, researcher, and activist, I began to understand how
    the street-related young positioned me and what they expected from me. They wanted
    attention; full attention – economically, socially and emotionally.


    This book describes that the young men''s ways of avoiding harm in and seeking
    attention in other situations when navigating the city did not only apply to their
    encounters with me, the anthropologist-activist. Over the years it became apparent
    that I was not as exceptional as I thought I was during my ultimately related
    to, what I call, their ''emotional economies'', a noticeable style of coping with
    marginality and stigmatization. To put these subtle affective and emotive practices
    into perspective, I focus on the extended street careers of five male protagonists
    and their friends, and scrutinize the adversities they encountered during their
    maturing and rebelling bodies, changing inscriptions and social role expectations
    during their coming of age. I focus on five life stories without omitting significant
    experiences of their street-related'
