    Back at the eco-social project where he worked before, and which had encouraged
    and supported Harvey in his decision to become an organic farmer, the managers
    Patti and Bayu, together with the recently graduated organic gardeners, made plans
    to rent farm, land and a house at the fertile slopes of Merapi. To many people''s
    surprise, the two embarking farmers managed to transform the wasteland into a
    prosperous piece of land and integrated themselves into the local kampung community
    by attending to the village''s rituals of ceremonial meals (slametan) and joining
    the evening prayers at the local mosque. Regarding his motivation to get up at
    5 am every cold mountain morning, working physically hard the whole day, pray
    every evening and go to bed early, Harvey explained in early 2008:


    > I would like to encourage the younger ones (adik) on the streets to join us
    here in the organic gardening project. I have a long-term plan to run this farm
    and integrate as many of them as possible in the future, because they have no
    future. But they have to be motivated. They need to develop a certain degree of
    responsibility (tanggung jawab) for their own lives. They cannot depend on NGOs,
    ''ngamen'', and the good of all of others their life. The problem is that the
    change between the streets and life here in the village is huge. You cannot wake
    up at noon, ''ngamen'' a bit to get food, and then hanging out drunk (mabuk) and
    looking for girls (main cewek). Here we need discipline. The reward is real independence
    and freedom (bebas dari merdeka). Even for me, who is used to a farmer''s life
    for over two years now, it is still very hard. But it is also sad (sedih) to see
    friends on the streets and realize that they are only hanging out. I also was
    like that once, but you can''t go on like that. You can do that when you''re still
    young (waktu masa muda), but when we are grown now we have to take responsibility
    (harus tanggung jawab) and we cannot continue to be ignorant (cuek).


    You know, I lived on the streets for ten years with different jobs here and there.
    And there were also times, and where I was just ''ngamen''. But I got bored there,
    and there was no future perspective if you think it. And look at what we have
    created, the two of us, Harto and me. If we can do it, why the others not be able
    to do it? Most of them are not ready yet (belum siap), that''s the problem. One
    day we can also help our friends, and give them shelter and work here.


    Harvey and Harto managed to transform 1,600 square meters of wasteland into an
    impressive organic garden, where almost twenty varieties of vegetables and herbs
