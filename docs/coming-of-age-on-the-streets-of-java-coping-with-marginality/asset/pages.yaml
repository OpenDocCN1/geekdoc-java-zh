    himself in taking responsibility for his friends from the komunitas, extended
    his social network by obtaining even more cooperation with various stakeholders
    of the rapidly emerging field of NGOs that focused on HIV-AIDS prevention, care,
    support and treatment. Whenever there was an accident, a friend was ill or needed
    to be taken of, fights and conflicts were to be appeared, workshops and other
    events to be organized, Monchi was always there to help and take responsibility.


    He did the exact opposite of what doctor and counselors advised him to do as an
    ODHA. Since JOY joined in 2006, he was not attending any support group; refused
    to start an antiretroviral therapy (ART) although his CD4 cell (also referred
    to as helper T-cells in lay count) was only slightly above the World Health Organization''s
    threshold; worked physically hard in the midday heat in various jobs on the streets;
    smoked high tar cigarettes; occasionally drank low alcohol; had an unhealthy diet;
    and was surrounded by the noise of the street junction and other quarter communities.
    Doctor Yanri warned him, that if he did not change his lifestyle, he was investing
    in his premature death. I wondered how he managed to only survive but also lead
    a contented life, when all the middle-class friends from the support group, who
    started with therapy (ART), took dietary supplements and vitamins, attended various
    self-help groups, and drank healthy, worked in an air-conditioned office or stopped
    working, had died earlier than him? How did he cope and preserve his physical
    health in the face of severe and intersecting social and spatial marginalities?


    What made sense for doctors, NGO activists or scientists, did not necessarily
    make sense to him. In October 2007, while sitting at our favorite ''curhat spot''
    in the shade of a big banyan tree, I asked him without the usual ''twirling''
    (mutar-mutar): What is your secret to staying healthy?


