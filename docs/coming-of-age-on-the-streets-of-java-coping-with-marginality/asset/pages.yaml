  md: '# MONCHI: MARRYING A FAMILY


    Although Harvey and Monchi continued discussing joint ways how to guide junior
    anak Bendora and anak Conglak to a life beyond the streets by renting a piece
    of land behind Monchi''s new ''home'', their plans never transpired.


    After the shacks of the Conglak community had been burned down, Monchi moved to
    Bambangrejo, a kampung about 10 kilometers to the northwest of Conglak, into the
    rented house of his 15-year-old girlfriend Dyah''s parents, who were also part
    of the komunitas Conglak (see Figure 2; chapter 4). Monchi slept in one of the
    two rooms with Dyah and her seven siblings, the belakang of the kampung, which
    consisted of ten houses and huts, was located at the fringes of a prosperous kampung
    having access to clean water, sanitation and sewage disposal, and only few of
    them had cement floors. The drinking and cooking water was taken from the little
    creek behind the hut, which was also used as the communal lavatory. Electricity
    was provided almost 24 hours a day, and the kampung residents participated and
    contributed to the arisan (community meetings) and the gotong royong (mutual help)
    of the adjacent kampung. Monchi''s new home consisted of both refurbished planks
    and bamboo (gedek). The roof consisted of a mixture of bamboo and tiles. Inside
    the house there was a TV, two beds with woven mats on them, one cupboard and kerosene
    stove.


    Ronggo and Danar, who had no other place to go to in the weeks and months after
    the tragedy, spent their nights as guests in Monchi''s new home. The two brothers''
    co-habitation was temporary, as they were not granted permission from the village
    head (Pak RT) to become permanent residents, because they were not married and
    had no proof of steady income. While Monchi was grateful to have a roof over his
