  md: '# Coming Age on the Streets of Java


    Monchi laughed:


    Yes, the others from the open meeting we went together the other day keep asking
    me this, when I show up there once a year. Yes, my secret. They always ask me
    whether I started the ARV therapy. And when I tell them I didn''t and that my
    CD4 is still fine, they don''t believe me. Maybe because they all started with
    their therapies and they feel bad and experience many negative side effects. They
    lose weight, feel sick, have diarrhea, and sometimes also heavy nausea. I then
    told them that I also have diarrhea sometimes, but that I still cure it with jamu.


    T: So, you trust in herbal medicine?


    M: Yes. No, not really, actually that is only a supplement. My secret is to forget
    (lupa).


    T: Sounds interesting. Silence.


    M: Instead of seeing myself as an ODHA, I often forget that I am HIV-positive
    and consider myself as a normal person. Do you know what I mean?


    T: Sounds like you indeed. Laughter.


    M: And my second strategy is ''sharing'' – with you. That''s very important. That
    I have one person to talk to, to get rid of stress.


    For Monchi, ''buying busy'' (sibuk) in keeping his emotional economies running,
    ''sharing'' his thoughts and feelings, and ''forgetting'' (lupa) about his status
    as ODHA every now and then seemed effective strategies of coping with HIV and
    retaining his well-being.


    The sharing was also highly recommended by counselors, doctors and local psychologists.
    Sharing with others does not only mean ''let go'', but is also a way of social
    seeking, which is defined as a rewarding and healthy coping resource in positive
    psychology and academic stress research (Thitos 2010). In a cultural context,
    HIV-AIDS was not only silenced, but also afflicted with a severe stigma, sharing
    was not an easy endeavor. Monchi''s greatest fear was talking to the wrong people,
    who would gossip about him or ostracize him. I think one reason why we related
    to each other so well was that we managed to create a shielded arena of mutual
    trust, which prompted the basis for sharing inconvenient and harmony (rukun) disturbing
    issues with each other. Being a ''professional stranger'' (Agarwal 1996), Monchi
    did not have to fear the same consequences as if he talked to his community friends,
    NGO activists, doctors or family members. The only threat that I represented was
    my ethnography: what I made of our sharing sessions,


