    # The ATOMIZATION OF THE ''GIRLI MOVEMENT''


    The peak times of the ''Jogja street culture'' were the 1990s, coinciding with
    ''street children''s universal prominence in the mass media and NGO agendas. Australian,
    American, European and Indonesian NGO-activists, artists and anthropologists collaborated
    with the ''anak jalanan'' (which was not necessarily a negative term at that time)
    and contributed to the creation of a distinct ''Jogja street culture''. Ten years
    later, when I started to get involved, these times were almost over. The street-related
    communities'' positive self-perceptions as ''anak jalanan'' had given way to the
    atomized landscape of street-related communities, referred to as ''unitas''. The
    stressing of differences between one''s street community and others outweighed
    the collectivism of the 1980s and 1990s ''street movement''. This atomization
    was strongly linked to the demise of the joint movement of street artists, activists,
    and students called GIRLI.


    The Yogyakarta GIRLI ''street movement'', initiated by social activists in 1984,
    was an outstanding example for various social groups, university students, anak
    jalanan, artists, anthropologists, and the wong cik from the kampung around Malioboro
    countered state and media driven marginalization and stigmatization campaigns
    against children and youths living on the streets. GIRLI is an acronym for pingGIR
    kali, ''besides the river or ''river bank'', which of the poorest residents of
    Indonesian cities live. Although the movement originated in Yogyakarta, GIRLI
    also existed in most of the larger Javanese cities and reached as far as Medan
    in North Sumatra and Makassar in South Sulawesi.


    14 | It is not clear, whether he means real ATM machines, or foreign backpackers
    and tourists, who are also sometimes referred to as ''ATM'' by some of the protagonists.'
