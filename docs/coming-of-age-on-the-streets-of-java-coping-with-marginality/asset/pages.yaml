  md: '# Coming of Age on the Streets of Java


    I depend on the stories of Mikini¹⁸ and Jim. They stated besides being punched,
    which they described as ‘eating hard bread’ (makan roti keras), while clenching
    their fists in the shape of a bread roll, they had to give away all the little
    belongings they had, either money, clothes or whatever they had carried with them,
    the seniors bought food and drinks for everyone, and the anak baru newcomers among
    their new community were both fed, beaten, hugged, and mocked, fed, beaten, and
    mugged, until they were ‘full’ (kenyang).


    During their first weeks on the street, the anak baru were literally broken. Their
    actions were monitored, commented upon, and often ridiculed. At other times they
    were slapped or beaten without obvious reason. Their courage and endurance was
    constantly tested. Mikini and Jim, who were both initiated by the komunitas Bendoro
    and also initiated others in the years after that, stated they tried to get out
    of their status as anak baru as fast as possible by complying with new rules and
    not opposing them. Although they were taken care of and provided with food, Mikini
    said that she was tremendously ‘malu/embarrassed’ of being regularly ridiculed
    and mocked publicly amidst the community by even the youngest members:


    They treat you like an idiot (goblok) in the first weeks. And some of the older
    ones are really rude (kasar) and obscene (kurang ajar). Once, they took away my
    pants while I was having a bath in a backyard and then they made me run through
    the streets without pants. I was very ‘malu’.


    One of the most important factors to mark the end of this humiliating stage, which
    could take up to many months, was the newcomers’ ability to contribute food or
    drinks to the communities’ hanging out (nongkrong) at night earning their own
    money. If the stench of mockery and humiliation lasted too long fighting back,
    or the community leaders had the impression that the anak baru did not fit (enggak
    cocok), the group could be chased away before he became a member of the komunitas
    (see Beazly 2003).


    The violence of initiations becomes particularly evident in a practice that Mikini
    and Jim described as sodomi or bo’ol—‘anal sex’ between kakak (senior, older brother)
    and anak baru or adik (junior, younger brother). I first came across these practices
    of sexual patronage and rape in the published biography of Heri Bongkok, who worked
