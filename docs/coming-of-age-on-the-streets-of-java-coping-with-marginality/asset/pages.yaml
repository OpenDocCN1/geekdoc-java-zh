  md: '# 5 Being Tekyan


    The fear (takut) and shame (malu), which could dominate the experiences of ''newcomers'',
    gave way to more positive self-evaluations and narratives of freedom (bebas),
    happiness (senang) and pride (bangga) once the adolescents were integrated into
    their komunitas. By observing, learning and imitating speech and body language
    from senior community members, power inequalities, which were previously responded
    to with frustration became more contestable. This chapter focuses on the *anak
    Bendoro* and the *anak Congklak*''s narratives and embodiment of the *tekyan*
    ideology. The concluding analytical summary discusses whether the protagonists''
    social and cultural practices are best defined as resistance against local social
    order, a deviant subversion or reproduction of ''Javanese ways'' (cara jawa).


    # ADVENTURE, FREEDOM AND STYLE


