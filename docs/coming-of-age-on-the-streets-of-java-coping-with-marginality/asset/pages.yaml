  md: '# Epilogue: ''Cleansed Streets''


    The last paragraph of article 24 does not target those considered ''homeless'',
    but also regulates the passersby by (not) to be affected by ''illegal/emotive
    practices that at the aim at the evocation of sympathy and compassion: “Any person
    (including NGOs and legal entities), which violates the regulation to not give
    money/or other goods to the gepeng [...] is sentenced with up to ten days of prison
    and/or a maximum fine of Rp 1.000.000,00." Synthesizing ''illegally'' and giving
    a few coins, bills or small gifts into the hands of the gepeng at the street intersections,
    is now considered a criminal act.


    The local government has curtailed street-related communities'' participation
    in the city and regulated ways of publicly sympathizing with supporting them with
    money. The Perda Gepeng controls citizens'' agencies at the street junctions and
    alters prevalent local norms of compassion and care. Ignance towards street musicians
    and beggars is not an individual''s choice any longer. It is a legally prescribed
    ''good practice'' of civil obedience. The new ''gepeng'' are no longer public
    annoyances (do I or do not spare a coin?) how to behave morally savvy when ''beggars''
    or ''buskers'' stretch their hands have been answered by the local government.
    Ignorance is now legally endorsed. The good and obedient citizen has no reason
    to feel compassion or sympathy for street-related people or even guilt ignoring
    them any longer. The state has taken care of it. Furthermore, the by-law defines
    social responsibility in Article 18, paragraph 1b in ''modern’ days: Yogkartans
    are obliged to report to the police when there are homeless persons or beggars
    ''loitering'' in their neighborhood.


    Although realistically, culturally and ethically contradictory (Retikas 2016),
    public compassion towards street-related people is now government regulated. Sympathizing
    with street-related communities in face-to-face encounters and being drawn into
    their skilful emotional connections has been ruled out. Although the law was supposed
    to assist vulnerable families in their commitment to keep their children at school
    and not send them out to the streets, it currently contributes to the criminalization
    and marginalization of street-related communities and individuals.


    Street-related communities'' opportunities to generate income have been continuously
    curtailed by the government over the last fifteen years without providing alternatives.
    Many public spaces and empty land that once belonged to the Sultan of Yogyakarta
    have been sold, privatized and transformed into shopping malls, hotels, restaurants
    or fun parks. In the administration''s aspiration to promote Yogyakarta as Southeast
    Asian hub of cultural tourism, the local administration has released dozens of
    new licenses for hotels and leisure parks since 2012. From a broader perspective,
    the rigorous application of the Perda Gepeng in 2015 feeds into Yogyakarta''s
    neoliberalization, which intends to clear the city from the non-normative and
    dirty. It is striking'
