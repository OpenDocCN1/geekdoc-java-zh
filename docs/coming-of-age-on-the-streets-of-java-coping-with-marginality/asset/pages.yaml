    # ATTENTION FIELDS


    ''Macho'' Encounters


    The analysis of the protagonists'' encounters with street-related young women
    focuses on the *anak Bendoro*''s reproduction of institutionalized patriarchy
    and machismo. Although the *anak Bendoro* verbally rejected they enacted them
    ''effectively'' for their own advantages by further marginalizing, stigmatizing
    and exploiting their female peers. The *anak Bendoro* stressed their masculinities
    in order to cement the gendered power asymmetries that cut through the *kampung*
    societies themselves rhetorically rejected. These gender asymmetries resulted
    in a reduced display of *malu* and an increased performance of masculine *bangga*
    in the social encounters with street-related young women.


    Patriarchic rhetoric and practices described in chapter 4 demarcated the agency
    frames of street-related girls and women and became gendered accomplices of the
    *anak Bendoro* in "shifting marginalities" (Beazley 2002: 1672) along a public
    discourse of patriarchy.'
