    idealized and modernized images of purity and deference were labeled as ''anak
    nakal'' or ''cewek nakal'' by the media, opinion leaders of surrounding kampung,
    and also their immediate social environment of pedicab drivers, market vendors,
    passers-by, and last not least the anak Bendoro.


    Compared to the men, where ''nakal'' referred to ''being disobient'', the same
