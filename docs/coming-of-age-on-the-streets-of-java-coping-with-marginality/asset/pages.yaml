  md: '# Coming of Age on the Streets of Java


    Jim, who joined the komunitasas in 2001 described the street-related communities
    at Malioboro as more violent than those that had formed later at the outskirts.
    He described the komunitasas Bendoro as the ''bajangan betul''. Bajangan can be
    translated as ''criminals'', and betul is a further affirmation – making them
    ''real criminals''. Bajangan was often used benevolently to show one''s respect
    or admiration of being ''clever''. Jim recalled one of his first encounters with
    Harvey, who had joined Bendoro during the GIRLI years in the early 1990s:


    Once I was involved in some problems with three guys from another group further
    south, who also asked at the Southern bus line. Our little ones (cilik) wanted
    to bus, but got chased away by them. They were bigger and older than they were.
    And actually it was their sport. The little ones came back to our base camp at
    Malboro and told us what had happened to them. Harvey did not say a word, got
    a knife and asked me to join him. We borrowed a friend''s motorbike, and off we
    were on our way. When we arrived, things happened rapidly. He attacked the three
    guys, who were still there, with his knife. The first guy, he slashed him in his
    back. Blood splattered everywhere. The other one, he got it in the face, and the
    third in the stomach. Then we drove off, returned to our base camp, and nobody
    said a word about the incident. Harvey acted as if nothing had happened. But Harvey
    is also one of the bravest from East Java. There is no one who would take him
    on.


    After a few more stories on Harvey and other friends (teman) from the komunitas
    Jim continued:


    Do you know why the ''anak Bendoro'' are so different from other groups? Well,
    first of all, we are rougher (lebih kasar) because we are in the center of the
    city. Here is a list of competition (kompetisi), and we have to keep newcomers
    and other communities out of here, because everybody wants to bus and sell his
    handicrafts here, but then we would not earn enough. Sometimes others say the
    ''anak Bendoro'' are arrogant (sombong), but actually we are proud (bangga) because
    everybody knows us. There are also two of us who became film stars in a movie¹¹.
    There are many girls (cewek) who like the film, and also many tourists. Some of
    us even made it to Europe and live there now. No wonder that some of us now look
    for foreigners (bule) instead of money. That''s easier (lebih gampang) and it
    lasts longer (lebih awet)! He laughed loudly.


