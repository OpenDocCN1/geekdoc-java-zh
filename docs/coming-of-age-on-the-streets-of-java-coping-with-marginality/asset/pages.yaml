    July 2006. Our reunion four months later was initiated by a short SMS text from
    Monchi: "Hi crazy man! Please come to my house, something important important..
    The best for you and peace on every single of your paths, Monchi.¹12


    When I arrived in Bambangrejo a few hours after I had received the text, he waited
