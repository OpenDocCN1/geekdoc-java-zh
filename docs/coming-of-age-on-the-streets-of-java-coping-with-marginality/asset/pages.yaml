    I don''t know. Sometimes I think so. I talk about HIV a lot with her. Sometimes
    I also bring leaflets and little booklets from NGOs and the clinic home. And I
    talk about the basic information. But I think she does not really understand yet.
    Because the rumors are so strong, I think. The fear of HIV is huge. Kampung people
    think you die straight away when you have HIV. And people are very afraid of once
    you have it. And because I will look healthy, I think she would not believe me.
    But if the neighbours found out, they would chase me out of Bangmarejo.


    A few days later, I asked Monchi under our ''curhat-tree'' how he faced such overwhelming
    adversities. His pale face lightened up, he smiled at me, breathed heavily and
    then said:


    It is amazing. In the evening when everybody sleeps, I sneak out of the house
    and if I have some cigarettes left, I sit down in the little hut in the middle
    of the rice fields behind our ''kampung''. Then I look at Merapi''s river flow
    and have a smoke. This is where I get my inspiration (inspiras) and calm down
    (b tena). When I return to the house I usually read a novel. Then I can really
    slip into the story and feel myself in it. My thoughts are triggered by a word
    or a sentence in the book. But in these moments, I can really feel the book, and
    I feel close with those friends and family who are far away or have already died.
    This is when I feel comfortable (nyaman).


    # Kris: An EPISODE OF ''CRAZINESS''


    After the Congklak tragedy in April 2005 Kris moved back to his family''s house
