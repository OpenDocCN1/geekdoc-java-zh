  md: '# Coming of Age on the Streets of Java


    immerse myself into the young men''s lives marked the beginning of a series of
    events that would keep me attached to them for over fifteen years now. I spent
    months with the komunitas Congklak near one of the city''s biggest six-lane street
    junctions and joined their night sessions of joking and drinking, busking (ngamen)
    during the day, running away from security officers, and sharing leftover food
    (hoyen). Sometimes I joined Monchi and the others to hang out (nkrong) at the
    Bendoro street junction in the city center bustling Malio Street. As I learned,
    this was the domain of the anak Bendoro, a community that shared a similar history
    and ideology with the anak Congklak, and whose members gave shelter to each other
    in case it was needed.


    I revisited Yogyakarta in 2005 for three months. Once there, I was invited to
    the wedding of Monchi, the emerging key informant and protagonist of this ethnography.
    Since he had finally broken ties with his family at the age of 15 in 1995, he
    asked me to represent his part of the new adjoining families. It was only then
    I observed the beaming newlyweds, nearly four years after the beach and street
    junction experiences in 2001, I slowly realized that the lives of the former ''street
    kids'' had changed considerably. Whereas the biggest change in my life was my
    recently acquired Master''s degree in Anthropology, many of them had become husbands
    and fathers who attempted to exit the streets. With wedding transpiring as a mirror,
    the penny inside my head dropped and I realized that with age and the maturing
    of bodies, the collective rituals on the streets, the identification with particular
    street-related communities, former alliances, and their future-oriented dreams
    and desires that I had frozen in my memories over four years had changed and continued
    to shift. Another very striking occurrence was the slow but steady rise of HIV
    infections affecting street-related communities. Some of the former visitors of
    the bamboo hut at the beach had died and others were chronically ill or diagnosed
    HIV-positive in the years to come. I was not prepared for these rapid changes.
    physical decay and the social suffering affected me deeply. Moreover, I had the
    impression that the young men actually disapproved of my plans to conduct research
    and write about them. A few days after then 24-year-old Monchi''s wedding, we
    had the following conversation:


    > Thomas: What would you think if I lived with you again, but this time for longer?
    Monchi: Why?


    > T: I would like to know more about you and your community. The last time I enjoyed
    very much and I am still very fascinated by your way of life. You made quite an
    impression on me.


    > M: Yes, that was really a great time. We were still young. And you are a crazy
    man. Why do you want to stay with us again? You can stay in a better place now.'
