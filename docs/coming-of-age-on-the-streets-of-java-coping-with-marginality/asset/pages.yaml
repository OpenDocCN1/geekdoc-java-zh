  md: '# Coming Age on the Streets of Java


    And yet, the comparative perspective illustrates that competition for economic
    and social resources, spatial atomization and contrastive self-elevations did
    not annihilate their common ''street ideology''. The protagonists stressed that
    they belonged to either the Bendoro or the Conglak community, but they used the
    otherwise rare term ''tekan'' when they referred to norms of conduct and style
    (see chapter 5).


    The interlocutors'' narratives of experiencing the city''s streets before and
    after integration into the *komunitas* revealed a stark contrast in terms of self-esteem
    and subjective well-being. Whereas disquiet, insecurity, shame and fear, were
    prevalent experiences arriving at the streets, their integration increased the
    newcomers'' self-efficacy, feeling of belonging and identification once they worked
    their ways into the community. In addition to the protagonists'' statements, the
    subsequent chapter *''Being Tekan''* suggests a powerful affective force of *tekan*
    ideology and practice on newcomers'' paths to becoming self-confident, self-reflexive
    and skilled social actors despite their public stigmatization as *jalanan* (''street
    kids'').


    The socializing practices of forced anal sex (bo''ol), excessive beating and prolonged
    mocking made painful orders. Whereas the immersed activistfielder could never
    make sense of such in-group violence, the wonders whether these excesses of seniority
    could be discussed in Victor Turner''s (1964) framework of initiation rituals.
    Rituals are defined as processes that existentially transform neophytes, whereas
    repetitive practices that do not exert profound emotional repercussions on individuals
    or collectives are considered ''ceremonies''. At odds with Turner''s argument
    that the liminal stage of rituals is of limited time and ultimately leads to the
    confirmation of involved social actors and the social structure''s previous status
    quo, the initiation practices on the streets of Yogyakarta might be better comprehended
    as ''*rites of passage*'' in Arnold van Gennep''s terms (1909). Passage rites
    assist an individual''s transition from separation from the family (*séparation*),
    chaos and crisis (*marge*) to his incorporation (*agrégation*) into a new community
    including its attunement to initially unrecognized norms and values (van Gennep
    1009). Ultimately, *rites of passage* bridge the gap between the ''old'' and the
    ''new'' and thus give meaning to the liminal phases of the transformations of
    both individual experience and societal life (Kappus 2019: 15).


    The protagonists broke away from their families and started embracing life on
    the streets between the ages of twelve and fifteen. Being young, unprotected and
    homeless gave negative to attributes that strongly affected the adolescent newcomers
    and led to feelings of shame, embarrassment (malus) and emotional distress (stres).
    The protagonists were addressed as ''*jalanan*'' (street kid), with included derogatory
    terms such as ''penglem'' (glue sniffer), ''gembel'' (beggar, scum), ''tuna''
    (rag picker, tramp), ''preman'' (criminal, thug), ''copet'' (pickpocket), ''maling''
    (thief) and the like, reducing adolescent newcomers to their deviant'
