    when compared to their local peers; who integrate themselves in fluid communities
    whose members do not share similar past experiences, but also future-oriented
    targets and motivations to make a living; who identify themselves with and share
    a temporary feeling of belonging to these communities.


    When differentiating ''children'', ''adolescents'' or ''youths'', and ''adults'',
    I will not exclusively refer to chronological age, but local perspectives on the
    life course and maturing bodies. This perspective relates to ethnography-insights
    that ''street children'', ''street youths'' and ''street adults'' do not necessarily
    form exclusive age-specific communities. On the contrary, as we will see in the
    context of Yogyakarta, people of different ages and life stages lived together
    in the same street-related communities. The extension of the ''street career''
    concept as derived from pedagogy and academic social work studies proves helpful
    in the anthropological aspiration to include the lifeworlds of those street-related
    persons into our analyses that cannot be subsumed under the misleading term ''street
