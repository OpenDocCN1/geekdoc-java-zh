  md: 'the ngamen of street-related communities is penalized, whereas recently mushrooming
    angklung bands that comprise up to six performers per junction are promoted as
    Central Javanese cultural heritage. With the criminalization of ngamen and the
    promotion of culturally more ‘traditional public music’, the attention fields
    for those who were considered disturbances on the city’s path of ‘Javanese refinement’
    were continuously shriveling over the last years. The emotional economies of these
    young men and also women, who continued working and living on the streets, were
    radicalized in terms of their emotive practice and speech. Moreover, promising
    social encounters had to take place in highly contested privat or threshold spaces.


    During my last fieldwork between July 2014 and June 2015, street-related communities
    have almost entirely disappeared from the public eye. The ‘successors’ of the
    anak Bendoro and the anak Congklak shifted their workplaces into the city buses
    of semi-private companies, leisure and recreation parks, the beaches, restaurants
    and the food courts near the kraton’s big squares (alun-alun). The latter remained
    safe enough spaces in which the regime of the Javanese ways (cara java), where
    social relationships and spaces are negotiated in relation to the local government’s
    law seems paradox, because the Sultan Hamengkubuwono X is the governor of Yogyakarta
    Special Province, who ultimately passed the Perda Gepeng, at the same time.


    I had always refrained from buying into narratives of Yogyakarta nationalist and
    religious radicalization, the rise of neoliberal consumption patterns and public
    control. The anak Bendoro and the anak Congklak’s maneuvering controlled public
    spaces, radicalizing discourses and xenophobic social currents helped me deconstruct
    the moral panics of an ‘Indonesia gone awry’. But in the face of the rigorous
    application of the Perda Gepeng, the approval of almost one hundred new licenses
    for the construction of hotels and four ‘mega-shopping malls’ in 2013 (http://www.thejakartapost.com),
    suggests, that the local government is serious in pursuing a radical campaign
    driven by economic desires to further promote Yogyakarta’s image of a clean and
    well-managed haven of an orchestrated Javanized Indonesian consumer culture. The
    institutionalized economic and political culture that cannot remit but modern
    of Javanese of Indonesia’s New Order rhetoric of a national family, progress and
    modernity, marginalizes, stigmatizes and criminalizes communities that are as
    ‘lacking morals’ that refer to nothing more than disheveled clothes, non-normative
    public appearances and engagements in the informal economic spheres and sectors.
