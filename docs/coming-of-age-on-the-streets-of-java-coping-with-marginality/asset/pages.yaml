  md: '# Coming of Age on the Streets of Java


    When compared to the anak Bendoro, komunitas Konglak had a more positive image.
    It was often stressed that the anak Konglak were ''more polite'' (lebih sopan),
    ''responsible'' (tanggung jawab), and that cooperation with them ''made sense''
    (masuk akal). Patti, the European founder of the eco-social project, who both
    lived and worked with the anak Bendoro for twenty years, decided to stop recruiting
    them to her project''s workshop one day in 2007, because her patience and energy
    was all used up. She explained:


    This does not make sense any longer. Enough is enough. We offer them education
    as craftsmen, feed them healthy food, and they can shower and relax here. We provide
    them with meditation, workshops and assist them when they have problems with the
    police, other NGOs, doctors and the like. And what do they do? Hang out, smoke,
    make their jokes and obstruct the motivated ones from working and learning sincerely.
    They are ignorant (cuek) about everything! But when they felt neglected, because
    other communities also cooperate with us; we accuse us of being unfair, exploiting
    them and making money by selling them to our donors as ''street children''. ...
    But we also made our mistakes in the past. They were never really taught how to
    take responsibility. When I look at Harvey and some of the young women, who acquired
    skills here and managed to progress in their lives, I sometimes wonder why most
    of the others are ignorant (cuek).


    Patti had watched the anak Bendoro come to age since their childhoods and we were
    sometimes ''shocked'' why the impacts of her and her colleagues'' work remained
    so little. Many of them are just ''asyik-asyik aja'' (want to have fun), and besides
    that it is one big ''cuek!''


    # Growing Out of Focus


    Until the mid-2000s, many NGOs were focusing on ''anak jalanan'', but the policy
    change of international donor organizations and the mere fact that of the protagonists
    reached their mid-20s and hence grew out of their donors'' focus, prompted more
    personalized cooperation networks. Instead of the established cooperation between
    particular communities and particular NGOs, cooperation had to be crafted with
    skillful empathetic brokers on behalf of the communities and committed ''orang
    baik'' or individual activists from formerly cooperating NGOs, who could ''pull
    strings'' even beyond their employers'' shifted policies.


    The following identity performance in July 2005, at the opening of a new conference-sponsored
    camp illustrates the emotional skills of the anak Konglak that targeted affective
    responses of guilt and shame in those who felt had insulted, and provoke a more
    appropriate support of their matters. Affandi (15 years old) lived on and off
    the streets of Konglak with his younger brother Mukri (13), his younger sister
    Ayu (10) and'
