    she demands, she will leave me and become the ‘pacar’ of another guy. Then others
    would mock me and make me ‘malu’.


    Although the women could exert sexual, social and economic power over their male
    peers by means of establishing and maintaining extended pacaran networks, these
    practices could also make them vulnerable to physical violence, undesired pregnancy
    (which sometimes resulted in abortions by illegal selfclaimed ‘specialists’),
    sexually transmitted diseases or HIV infection. In order to avoid these risks
    and lead a secure and sound life, Gita, Rara, Tami and Ambar articulated their
    desire to take a foreigner (bule) as their boyfriend, just like the ‘anak Bendoro’.


    # Intimate Encounters


    Compared to street-related young women, where ascribed promiscucuity and individuality
    became moral sources of stigmatization, the same attributes could transpire as
    sources of fascination and attraction in the case of the anak Bendoro’s encounters
    with foreign women travellers, students and expatriates from Europe, Australia
    or the USA. Individuality, independence, and sexual ‘open-mindedness’ (instead
    of the female version of ‘promiscuity’ in its negative as) were important assets
    of the anak Bendoro. Depending on the context and the locations where such transcultural
    encounters take place, ‘being different’ could fuel stigmatization, but also materialize
    as favorable cultural capital that facilitated cooperation of various forms (e.g.
    social, economic, intimate or sexual).


    As mentioned earlier, the opportunities to meet foreigners were disproportionately
    more for the anak Bendoro compared to their female peers that worked and lived
    in the area around Malioboro and also the anak Congklak. The tourism industry
    and the proliferation of NGOs in Yogyakarta opened up a variety of opportunities
    for transcultural encounters and income generating possibilities. Besides selling
    handicrafts on the sidewalk, working as informal guides (guide liar), or busking,
    some anak Bendoro established friendships with foreigners and developed intimate
    and sometimes long-lasting relationships with foreign women travellers, expats
    or students.


    Yogyakarta as a city itself provided a perfect backdrop for such encounters between
    different worlds to take place (see also chapter 3). The many galleries and art
    collectives as well as universities attracted foreign students, artists and'
