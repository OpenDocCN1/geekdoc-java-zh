    After an earthquake destroyed many parts of Yogyakarta and the Bantul area in
    May 2006, many formerly street-related non-governmental organizations broadened
    their scope of work with an upcoming shift from children''s needs to a children''s
    rights based approach (Pravitta 2012). This coincided with a new focus on preventing
    children to turn to the streets (by empowering not only the children, but also
    their families and the kampus communities), trauma therapies (McRae 2008). Since
    the term ''at risk'' has no definition, program providers still had some leeway
    in to translate the term for their own programs (Moore 2006). Some NGOs, were
    still committed to the issues of the maturing protagonists and their friends,
    used these conceptual loopholes to integrate into their programs in order to provide
    for at least their basic needs. Here, the protagonists began to increasingly engage
    in the establishment of short-term relationships with individual activists on
    a more personalized level in order to maintain their social proximity to NGOs
    and foster their crucial social economic economic support. Although the structure
    and working patterns of NGOs have always been based on personal and patronage
    relationships of activists with both the street-related communities and decision-makers
    in the legal (lawyers and government officials) and health sector (doctors and
    hospitals), the new young men alternatives in ''choosing'' between NGOs intensified
    their emotive performances within their emotional economies.


    Both the anak Bendoro and the anak Congklak increasingly amazed cooperating with
    particular persons for particular purposes. Through their longterm experiences
    of trip and error, they learned which NGO, which NGO worker, and which ''orang
    baik'' outside these organizations could be activated for what issues. Their skills
    of imagining and empathizing with multiple others and situations, and persons,
    were crucial in framing social encounters in ways that could generate trust, affection,
    social and economic capital. The following description of encounters focuses on
    the protagonists'' effective oscillation between malu and bangga as crucial practices
    of their emotional economies.'
