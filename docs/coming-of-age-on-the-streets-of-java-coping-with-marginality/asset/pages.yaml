    # DATA ANALYSIS


    With regard to this ethnography, the collected data was analyzed along the following
    seven steps.


    STEP ONE: TIDY UP. The various transcribed and digitized types of data were arranged
    into the following folders according to their quality and genre:


    +   - On-the-spot interpretations and loose theoretical models from research in
    the field

    - Memory protocols from the systematic observations of social interactions

    - Transcriptions from recorded formal interviews

    - Memory protocols from conversations, especially the curhat-sessions

    - Transcriptions of recorded FGDs

    - Workshop materials: educational tools, participants'' notes, questionnaires

    - Protocols of Rumah Sehat Lestari meetings

    - Photos and videos (and their transcription)

    - Media artifacts (newspaper articles, public signposts, and advertisements)

    - Emotion-based research diary


    STEP TWO: FINDING ITEMS. After having the various data sets at least typologically
    administered, which included an open reading and the composition of memos with
    reflections on every single document, I started looking for central items included
    in the data. This was accomplished by an open coding by means of the index-function
    of data processing software.


    1 | Although such a practice is less flexible and more time-consuming than a softwarebased
    coding (e.g. maxqda, atlas-ti), it worked efficiently for myself. The lack of
    flexibility forced me to decide on central categories. This was particularly helpful
    in order to define the central aspects of the ethnography. And not coding the
