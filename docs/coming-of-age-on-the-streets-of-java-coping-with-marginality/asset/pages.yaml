  md: '# Coming of Age on the Streets of Java


    The criteria for the open coding (i.e. attaching multi-level codes to the transcribed
    and digitized texts) were based on the following dimensions:

    (1) relevance to the research questions, (2) composed memos alongside the documents,
    (3) frequency of phenomena in the data, and (4) statements of local research partners
    and the collaborative action research team, by integrating on-the-spot interpretations
    and loose theoretical models formulated in the.

    The result of step two was an abundance of single indices of every document of
    the above mentioned ten folders of data sets. In order not to complicate the data
    but it was important not to code the emerged texts on more than three levels.


    Figure 4. Example I of a three-level single index.


    |MEMORY PROTOCOL 9B (name of the document)|

