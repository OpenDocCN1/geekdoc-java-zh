  md: '# Coming Age on the Streets of Java


    The dichotomy halus and kasar is intrinsic in Javanese moral values, and halus
    refers to ‘being Javanese’, ‘being of pure thought’, ‘without negative or emotional
    drives’ or ‘moral’. Meanwhile, kasar is the opposite of ‘being Javanese’ and instead
    is ‘driven by negative emotions and/or lust’ or ‘immoral’. Because the worldview
    of the priayi is still powerfully construed as Javanese cultural ideal, the moral
    dichotomy is intimately entangled in the lives of most residents in the court
    city of Yogyakarta.


    In order to be (halus) a person has to master emotions and balance the outer (lahir)
    and the inner (batin) self. Geertz wrote that lahir refers to the “outer realm
    of human behavior” (ibid.), whereas batin refers to the “the inner realm of human
    experience” (ibid.). The distinction should not be mistaken for a body and mind
    dichotomy, as batin (the sphere of feelings and emotions) and lahir (the sphere
    of visible social behavior) are mutually related.


    The balance of the outer self is achieved by the performance of politeness (sopan)
    and pleasantness in social interactions, which is connected to the ordering of
    inner life and a refinement of subjective experience, including feelings (rasa).
    Cultivated persons need to give both to the naturally jagged physical gestures
    that make up external behavior, and to the fluctuating states of feeling that
    comprise inner experience. A truly halus person is polite all the way through.


    Rukun refers to three kinds of culturally desired harmonious relationships: between
    a person and God, between people, and in relation to a person’s outer appearance
    and inner achievements. The latter is supposed to evoke the emotional ease of
    tentram, resulting from the balance between lahir and batin. Because my primary
    target is not the analysis of kejavanese concept of equanimity and practices,
    which promote rukun between person and God, I concentrate on rukun between people
    and its relation to tentram, which I perceive as quantifying well-being. The concept
    manifests to establish and maintain harmony in social relationships. In social
    interaction, rukun indicates a cultural and moral imperative to avoid or regulate
    the display of strong emotions, and to avoid and ignore public arguments and dissonances
    so as not to jeopardize one’s and others’. From the perspective of identity politics,
    rukun and tentram are the central and emotional motivators to participate in communal
    work (gotong royong), perform ritual services to one’s local community (arisan
    and slametan), and adhere to institutionalized cycles of communal and life cycles.
    From the perspective of subjective well-being, rukun is strongly linked to the
    concept of tentram, which can be translated as that of ‘being at emotional ease’,
    and is often referred to


