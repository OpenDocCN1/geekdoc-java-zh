  md: 'Sadly (a word that cannot not quite grasp the experience behind it), these
    were the last moments I shared with the ‘Crazy Man’. We did not see each other
    again. My friends and colleagues from the former RSL collective contacted me by
    text messages and phone calls in mid-December 2013 at my Berlin home Monchi was
    about to die. I did not believe him. I was sure that he recovered again as usual,
    and that I could introduce him to my newborn son in a few months, when we were
    about to disembark on another research year in Indonesia. While Monchi died, I
    was busy growing into a social role that he had mastered so impressively on different
    scales during the years of our friendship. Having a father myself, the pleasure,
    but also the distress related to it in case of the baby''s illness or its sometimes
    inexplicable crying and one''s own lock, my respect and admiration for Monchi
    had grown even more extensively – despite his ‘acts’ of having two children with
    Dyah the knowledgeable HIV-positive person and otherwise reliable young man that
    he was.


    In April 2013 Monchi had already spent two weeks in hospital due to painful virally
    induced neural dysfunctions in his brain. He suffered from spasms and had difficulties
    talking. His mother and his siblings made their way to Yogyakarta to wait on the
    ‘lost son’ and return him into the hands of God. But, the then almost 33-year
    old recovered from the spasms and also from slurring. We remained in contact by
    sms. *I cannot leave Ary and Gembul just like that, was one of his last texts
    in October 2013, promise to take care of them once I will be gone, the last lines
    I have read from him.* After he was hospitalized in December 2013, he did not
    fight long. His body gave up after three days. When I met Dyah. Ary, Gembul and
    her siblings again in August 2014, the now adult young woman assured me that Monchi
    had died in peace. And he asked her to tell me ‘thank you, and you see in hell!’
    – we burst into tearful laughter.


    # ‘REVELATION BLUES’


    This chapter highlighted the afflictions in the lives of former ‘street children’
    and ‘street youths’ while they were exiting the streets. Adversities from various
    interrelated changes both ‘within and without’ the protagonists: the change of
    the socio-cultural environment in terms of a more general social change, the transformation
    of their bodies, shifting social fields of interaction, and a revision of their
    life priorities. Coping with the stigma of being a (former) ‘jalananan’ (and even
    more being an ‘ODHA’) was not always an easy task in the face of intersecting
    dimensions of marginality, branded bodies and social role expectations.'
