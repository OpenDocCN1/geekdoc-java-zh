  md: 'Appendix 253


    # STEP THREE: CREATING STABLE SETS OF ITEMS. In order to create stable sets of
    items, a meta-analysis of the single indices according to the same criteria of
    relevance, composed memos, frequency, and statements was conducted. The following
    eight stable sets of items emerged: (1) Life in the street communities, (2) ''Javanese
    ways'', (3) HIV-AIDS, (4) Hospital practices, (5) NGOs, (6) Life stages, (7) Self-reflection,
    and (8) Conceptual issues (regarding data collection and representation).


    After assessing this thematic octagon, I conducted manual open associative clusterings
    of each of these ''meta-categories''. Subsequently, the dominant items of the
    emerged clusters were crossed with the single indices to find out whether relevant
    phenomena had either not coded in the first coding step or were simply not contained
    in the data. After interpreting the clusters with the aim of identifying stable
    items, and merging with the items of the single indices, the single indices were
    recoded where necessary. The next step contained the assemblage of the recoded
    single indices into multiple indices of the eight emerged meta-categories.


    # STEP FOUR: IDENTIFYING ACTORS, ACTIVITIES, AND SETTINGS. Guided by an actor-centered
    research interest, data-inherent taxonomies in the tradition of James Spradley
    (1979), constant comparisons in the Grounded Theory tradition of Anselm Strauss
    (1987), or the creation of patterns and assembling structures (LeCompte 2000;
    Schensul/LeCompte 1999) were not pursued. Aspiring an extended case study each
    other for years life story approach, the data analysis had to be adapted accordingly.
    Referring to Van Velen (1967) and Mitchell (1982), who both underline the importance
    of focusing on the chain of social events within a particular time frame, besides
    creating stable sets of items, a timeline was identified that could be carried
    by chronologically arranged life stories. Because the life stories had been narrated
    and witnessed at different stages and in different locations, this needed further
    scrutiny.


    Besides having collected sufficiently thick data, the emergence of the five key
    protagonists, Monchi, Jim, Jempol and Harvey, was based on the criteria of similarity
    and peculiarity. They shared social and cultural backgrounds, knew each other
    for many years, shared similar experiences during their socialization into street
    life, and all impressively visibly embodied the particularly Yogyakarta ''tekan''
    style. Furthermore, the five protagonists shared many differences an idealized
    Javanese age of childhood, adolescence and young adulthood. In terms of the protagonists''
    peculiarity, it was striking how their life courses developed very differently
    during young adulthood, although some of them shared so much time together during
    childhood and adolescence.


    Monchi emerged as primary protagonist due to the rich data and his own motivation
    of turning this ethnography into a ''stunning book'', as he put it.'
