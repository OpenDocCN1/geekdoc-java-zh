  md: '# Becoming Tekyan


    Malioboro has transformed into an open-air mall for the self-designated ''middle
    class'', who fought about window seats at the global fast food restaurants in
    Yogyakarta''s first (of now numerous) malls, the ''Malioboro Mall'', which opened
