    long-term relationships, when couples tried to live together in Yogyakarta or
    in the women''s countries of origin for a few months. Whereas too confining practices
    of sharing time and space became the most rampant disruptor of those relationships,
    their implicitly framed temporalities fueled their desirability. A prolonged emotional
    distress and frustration could be avoided either by just moving on, in the case
    of the backpacks, or by the men''s withdrawal from intimate pacaran by disappearing
    and hiding, and withdrawing by reintegrating themselves into komunitas. Only very
    few of these ''romantic affairs'' had developed into long-term relationships.
