    # The Alleyway Autodidact


    > I don''t know where to start my scribbling. What is for sure, that life in the
    alley has many twists and turns. Many people say that the alley can only be dark,
    tough, dry, and dead. But such assumptions, I can only consider them like the
    wind passing by. I live in the alley precisely because I know what real life is
    like. Where companionship is always embraced together, it is rare in the families
    and houses of those who are perceived as elite. We are all united when they try
    to circumcise the rights of the little people. We see many cases where they eat
    our country''s money or simply the coins ... but the alley we is the one that
    is considered a parasite dying off on a lush and fertile green grass and strong
    roots. And yet, we can stand upright on our own feet. What is the difference between
    You, me, us, You of different rank, You of white, black, brown skin? Surely not
    our gender, Bro.


    Between so many communities that grow like mushrooms nowadays, both of formal
    and informal education, that lump around those who wear brilliants so big that
    they could beat David Copperfield. In good or bad magic. It all depends on the
    person itself, whether he wants to be useful for himself alone or also for other
    people. It is on us to choose. See you again, ok, Crazy Man.


