    and young women from the komunitas, whom they later married and raised families
    with (Figure 2), Monchi and Dyah started a pacaran in 2004. Her family also worked
    on the streets and was part of the Congklak community. Dyah''s mother would dress
    in rags for money, while her father occasionally busted and worked as a hired
    laborer at construction sites. He would often often, however, sit in the shade,
    drinking tea, smoking cigarettes and playing cards while ''monitoring'' his children
    working on the streets. After they moved to Bangalorejo, he accompanied his children
    to the street junction in the mornings, and in the evenings he sometimes drove
    his wife and the youngest of their children back home on a motorbike, which was
    purchased on installment. The payment of these installments were frequent, and
    created diffuse networks of debt and dependence (utang-piang); money was borrowed
    from a creditor (rentenir) at high interest rates (up to 50 percent of the actual
    loan) in order to pay back loans from other creditors. Besidalling debts, these
    economic maneuvers resulted in frustration, distress and suffering among the family
    members including Monchi, who was expected to act as a provider for his new family.


    Dyah''s brothers Tirto (14 years old at the time of the Congklak eviction), Dian
    (12) and Heri (11) continued working at the street junction as buskers (pengamen).
    Their sisters Rita (10) and Anita (8) worked on the streets as beggars (pengemis)
    in the late afternoons after they returned home from school. Their little brother
    Monti (5) accompanied them whenever he was bored sitting around with his father
    and his company.


    Economic pressures, scarce material and kinship resources were not surprising
    in a family that lacked culturally esteemed family wealth (bibit), honorable descent
    (bebet), and professional background (bobot). Despite the children''s hard work,
    the economic pressures mostly affected not their father. Malnutrition, the denial
    of a basic school education for most of the siblings, fever diarrhea and heavy
    coughs without proper treatment, affected everyone in the family but Pak Tanto.
    In contrast, he was rarely ill, without food, cigarettes, or drink, and neither
    begged in the rainy season. Those who suffered most worked the hardest: 10-year
    old Ratna, 11-year old Dian, their mother, and Monchi, who worked on the streets
    every day, except Sundays.


    In December 2004, Dyah found out that she was pregnant. Monchi wanted to take
    responsibility and become a caring husband and father, better than his own, so
    they married three months later. In the kampung, a wedding had to precede giving
