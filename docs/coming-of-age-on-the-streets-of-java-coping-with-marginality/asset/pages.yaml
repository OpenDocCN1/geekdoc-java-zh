  md: 'In 1994 Laine Berman wondered about the future of the GIRLI children, whether
    they would be able to change their fates. She wrote, “for now, they are just one
    more example of the callousness and failure of this era of modernization and development
    in just one more third world country” (1994:21). Over twenty years later, answers
    to Berman’s raised question seem odd at at first glance. Some have ''exited''
    the streets, others are still bustling alone or with their wives and children,
    and yet others have died or disappeared. This ethnography of coming age perspective
    is an attempt to analyze and understand the different stories of the anak GIRLI
    of the komunitas Bendoro and komunitas Congklak, in times where the ''street child''
    has suspiciously vanished from anthropological discourses.


    The Yogyakarta street movement, which was localized in the wider Malioboro area,
    has continuously lost its integrative force over the last ten years. The solidarity
    movement is still celebrated annually (related communities in Semarang and Jakarta
    also hold anniversary festivals), but in terms of collective identification and
    the feeling of belonging, it has constantly waned. What has remained a reference
    to shared tekan ideology and values that are passed to newcomers. The self-attributive
    term ''tekan'' is an acronym of the Javanese ''sithik nik lumayan'', which translates
    as ‘a little but enough’. During the last years, the term tekan has more and more
    disappeared from the streets. Monchi has stressed that it has remained an important
    reference in terms of identity formation when interacting with non-GIRLI street
    communities, but that its use of supporting NGOs, CBOs¹⁵, or more personalized
    sponsors, has become less frequent among the newer komunitas Congklak now competed
    with the anak Bendoro and former GIRLI-communities for the resources and attention
    of a constantly decreasing number of supporting NGOs, he assured me that they
    all still carried the *tekan* within their hearts (chapter 6).


    Increasing competition was linked to the permanent cleansing of former centers
    of ''tekan culture'' by the police and both formal and informal economic and spatial
    developments of the inner cities, legitimized by national and local laws and decrees.
    Yogyakarta was no longer the ‘tolerant city of street art’, which drifted towards
    becoming ‘cleanliness’ and ‘safety’, driven by political and economic policies
