  md: '# 6.1.4 Abstract Factory


    Provide an interface for creating families of related or dependent objects without
    specifying their concrete class.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_205_0.png)


    The Abstract Factory Design Pattern serves to define a coherent family of products.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_205_1.png)


    Use cases:


    +   - When different objects are created for a context and therefore always have
    to be created coherently.

    - When a system must be configured with different sets of objects or should be
    able to do so.

    - When a system should be independent of how certain objects are created.

    - If a family of objects is provided but no statements can or should be made about
    the concrete implementations. Instead, interfaces are provided.

    - Typical applications of abstract factors are e.g., GUI libraries that support
    different Look and Feels.'
