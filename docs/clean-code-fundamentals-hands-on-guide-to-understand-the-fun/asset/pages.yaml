  md: "# 4.4.4.3 assertTrue() / assertFalse() / assertAll()\n\nAssert that the supplied\
    \ condition is true or false. assertAll() assert that all supplied executables\
    \ do not throw exceptions. It is a possibility to group assertions and have all\
    \ the failed assertions reported together.\n\nTruth\n\n```\n@Test\nvoid truth()\
    \ {\n    assertTrue('a' < 'b', () -> \"Assertion messages can be lazily evaluated\"\
    \ \n        + \"to avoid constructing complex messages unnecessarily.\");\n}\n\
    ```\n\n```\n@Test\nvoid groupedTruth() {\n    Person person = new Person(\"Jane\"\
    , \"Doe\");\n    assertAll(\"person\",\n        () -> assertEquals(\"Jane\", person.firstName()),\n\
    \        () -> assertEquals(\"Doe\", person.lastName())\n    );\n}\n```\n\n# 4.4.4.4\
    \ assertNull() / assertNotNull()\n\nAssert that actual is null or not.\n\nExistence\n\
    \n```\n@Test\nvoid existence() {\n    assertNotNull(new Calculator());\n    assertNull(null);\n\
    }\n```\n\n# 4.4.4.5 assertThrows()\n\nAssert that the exception of the executable\
    \ throws an exception of the expected type and return the exception.\n\nExceptions\n\
    \n```\n@Test\nvoid exceptions() {\n    Calculator calculator = new Calculator();\n\
    \    Exception exception = assertThrows(ArithmeticException.class, () -> calculator.divide(1,\
    \ 0));\n    assertEquals(\"/by zero\", exception.getMessage());\n}\n```"
