  md: "# ## 6.3.10 Memento\n\nWithout violating encapsulation, capture and externalize\
    \ an object’s internal state so that the object can be restored to this state\
    \ later.\n\n| Originator | Memento | Caretaker |\n| --- | --- | --- |\n| -state\
    \ | -state | |\n| +setMemento(Memento) | +getState() | |\n| +createMemento() |\
    \ +setState() |\n\nUse cases:\n\n+   - For designing a mechanism to capture and\
    \ store the state of an object, when needed, the object can be pushed back to\
