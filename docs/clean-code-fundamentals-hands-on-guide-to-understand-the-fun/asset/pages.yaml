  md: '# 6.3.8 Iterator


    Provide a way to access the elements of an aggregate object sequentially without
    exposing its underlying representation.


    | Aggregate | Iterator |

    | --- | --- |

    | Client +createIterator() | +first()\n+next()\n+isDone()\n+currentitem() |

    |

    | ConcreteAggregate +createIterator() | Concreteliterator |


    Use cases:


    +   - Access aggregate objects without exposing their internal representation.

    - Support multiple traversals of aggregate objects.

    - Provide a uniform interface for differing aggregate structures.


    An iterator can be designed as either an internal iterator or as an external iterator.


    # Internal Iterators:


    +   - The collection itself provides methods that allow a client to visit various
    objects within the collection. For example, the java.util.ResultSet class contains
    the data and also provides methods like next() to navigate through the item list.

    - There can be only one iterator in a collection at a time.

    - The collection must maintain or store the state of the iteration.


    # External Iterators:


    +   - The functionality is separate from the collection and resides in another
    object called an iterator. Normally, the collection returns a corresponding iterator
    object to the client. For example, the java.util.Vector, has its iterator defined
    in the form of a separate object of the type Enumeration.

