  md: '# Design Principles


    | | | | |

    |---|---|---||

    | S | SRP | Single Responsibility Principle | A class should have one, and only
    one, reason to change. |

    | O | OCP | Open Closed Principle | You should be able to extend a classes behavior,
    without modifying it. |

    | L | LSP | Liskov Substitution Principle | Derived classes must be substitutable
    for their base classes. |

    | I | ISP | Interface Segregation Principle | Make fine grained interfaces that
    are client specific. |

    | D | DIP | Dependency Inversion Principle | Depend on abstractions, not on concretions
    |


    SOLID Design Principles


    # Packaging Principles - Cohesion


    | | | | |

    |---|---|---||

    | REP | Release Reuse Equivalency Principle | The granule of reuse is the granule
    of release. |

    | CCP | Common Closure Principle | Classes that change together are packaged together.
    |

    | CRP | Common Reuse Principle | Classes that are used together are packaged together.
    |


    Packaging Principles - Cohesion


    # Packaging Principles - Coupling


    | | | | |

    |---|---|---||

    | ADP | Acyclic Dependencies Principle | The dependency graph of packages must
    have no cycles. |

    | SDP | Stable Dependencies Principle | Depend in the direction of stability.
    |

    | SAP | Stable Abstractions Principle | Abstractness increases with stability.
    |


    Packaging Principles - Coupling


    # Further Design Principles


    | | | | |

    |---|---|---||

    | SCP | Speaking Code Principle | Writing code that speaks for itself and does
    not need a comment. |

    | KISS | Keep It: Simple (and) Stupid | Simplicity should be a key goal in design,
    and unnecessary complexity should be avoided. |

    | DRY | Don''t Repeat Yourself | Every piece of knowledge must have a single,
    unambiguous, authoritative representation within a system. |

    | YAGNI | You Ain''t Gonna Need It! | Always implement when you actually need
    them, never when you foresee that you need them. |

    | SOC | Separation Of Concerns | Process of separating a program into distinct
    features that overlap in functionality as little as possible. |

    | POLA | Principle Of Least Astonishment | If something has a high astonishment
    factor, it may be necessary to redesign it. |

    | LoD | Law of Demeter | Only talk to your immediate friends. |


    Further Design Principles'
