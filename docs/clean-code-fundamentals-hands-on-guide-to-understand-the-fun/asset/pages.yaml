  md: '# 4.6 Mocking with Mockito


    Mockito* is a Java mocking framework for creating test double objects for unit
    tests of Java programs.


    Why do we need test double objects?


    Most of the time the code we depends on other dependencies. If we are using unit
    testing, often the code delegates some work to other methods in other classes
    or our test must depend on those methods. But we want the tests to be independent
    of all dependencies.


    Test double objects help us to isolate a unit of code and test it. Replace DOCs
    (Dependent On Component) and get control over the environment in which the SUT
    (System Under Test) is running and test the state and verify interactions.


    # 4.6.1 Types of Test Double


    Test Double is a generic term used by Gerard Meszaros in his book xUnit Test Patterns
    to manage any case where you replace a production object for testing purposes.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_114_0.png)


    Types of Test Double


    +   **Test stub**nused for providing the tested code with indirect input.


    +   **Mock object**nused for verifying indirect output of the tested code, by
    first defining the expectations before the tested code is executed.


    +   **Test spy**nused for verifying indirect output of the tested code, by asserting
    the expectations afterward, without having defined the expectations before the
    test code is executed. It helps in recording information about the indirect object
    created.


    +   **Fake object**nused as a simple implementation, e.g. using an in-memory database
    in the tests instead of doing real database access.


    +   **Dummy object**nused when a parameter is needed for the tested method but
    without needing to use the parameter.


    > *https://site.mockito.org/'
