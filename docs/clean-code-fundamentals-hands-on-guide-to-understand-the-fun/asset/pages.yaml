  md: "# 4.4.4 Assertions\n\nAssertions is a collection of utility methods that support\
    \ asserting conditions in tests. JUnit 5 contains many of the assertions of JUnit\
    \ 4 and several interesting new assertions.\n\nIt also provides support for lambda\
    \ expressions that can be used in assertions. The advantage of using lambda expressions\
    \ for the assertion message is that it is evaluated lazily, which can reduce time\
    \ and resources by avoiding the construction of complex messages.\n\nThe assertion\
    \ result of a test provides a specific value. A failed assertion will throw an\
    \ AssertionFailedError or subclass.\n\n# 4.4.4.1 assertEquals() / assertEquals()\n\
    \nAssert that expected and actual are equal.\n\n```\nEquality\n#Test\nvoid equality()\
    \ {\n    Calculator calculator = new Calculator();\n\n    assertEquals(2, calculator.add(1,\
    \ 1));\n    assertEquals(4, calculator.multiply(2, 2), \"Optional failure message\"\
    );\n\n    char[] expected = {'J', 'u', 'n', 'i', 't'};\n    char[] actual = \"\
    Unit\".toCharArray();\n\n    assertArrayEquals(expected, actual);\n}\n```\n\n\
    # 4.4.4.2 assertSame() / assertNotSame()\n\nAssert that expected and actual refer\
    \ to the same object.\n\nIdentity\n\n```\n#Test\nvoid identity() {\n    User john\
    \ = new User(1, \"John\", \"Rambo\");\n    User rocky = new User(2, \"Rocky\"\
    , \"Balboa\");\n\n    assertSame(john, john);\n    assertNotSame(john, rocky);\n\
    }\n```"
  merge: -1
