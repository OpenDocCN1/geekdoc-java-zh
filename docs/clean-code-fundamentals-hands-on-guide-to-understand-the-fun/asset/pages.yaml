  md: '# Software Quality Assurance


    # Challenges:


    A 100% coverage is an illusion! Do not try to achieve 100% total code coverage.
    Achievable coverage depends strongly on the project type, whereas realistic values
    are in the range of 80%. Code coverage should be defined project-specifically
    and automatically checked during the build process.


    Attaining 100% code coverage sounds good in theory but is almost always a waste
    of time. We will spend a lot of effort to get from 80% to 100%, as it is much
    more difficult than getting from 0% to 20%.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_119_0.png)


    Increasing code coverage has lower revenues as well. Don''t waste your time trying
    to achieve a very high level of test coverage, to be better positioned with your
    project. Often stupid tests are written to artificially push them up. It is better
    to have tests that you can trust and test the features properly. Testing pure
    setters and getters make not always sense. These tests only cost time and money
    and do not help the project.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_119_1.png)


    Again, code coverage should not be used as a representation of the quality of
    a project!


    # Tooling:


    # Eclemma³²


    Java-based code coverage framework, with support of statement and decision coverage.
    Provide generation of text, HTML, and XML reports and is part of Eclipse.'
