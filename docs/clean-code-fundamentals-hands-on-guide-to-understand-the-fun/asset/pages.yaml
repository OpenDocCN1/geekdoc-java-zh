  md: '# 4.5.5 F.I.R.S.T


    Follow five rules that help writing clean tests, which define the F.I.R.S.T²⁷
    acronym.


    Fast


    +   - Tests should be fast.

    - If tests are slow, they are run less frequently and therefore do not find problems
    early enough.


    Independent


    +   - Tests should not be interdependent but should be executable independently.

    - A test should not set conditions for the next test and should be executable
    in any order.

    - If tests are interdependent, the first one to fail triggers a cascade of further
    failed tests downstream.


    Repeatable


    +   - Tests should be repeatable in any environment.

    - Tests should be executable in the production environment, in the QA environment,
    and on the laptop on the train without a network.


    Self-Validating


    +   - Tests should have a boolean output.

    - Either they are passed, or they fail.

    - The manual study of log files should be avoided.

    - If the tests do not validate themselves, failure can become subjective and a
    long manual evaluation may be required to execute the tests.


    Timely


    +   - Tests must be written in time.

    - Unit tests should be written just before the production code which ensures that
    they are passed.

    - If tests are developed after the production code, the production code may be
    difficult to test.


    > ²⁷Robert, Martin: Clean Code – A Handbook of Agile Software Craftsmanship'
