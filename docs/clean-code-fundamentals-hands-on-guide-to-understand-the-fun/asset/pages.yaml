  md: "Software Quality Assurance\n\n# What should we test?\n\nThe best thing about\
    \ unit tests is that you can write them for all your production code classes,\
    \ regardless of their functionality, complexity, or internal structure. You can\
    \ perform unit tests for controllers, services, repositories, domain, or utility\
    \ classes. Follow the rule of one test per production class. This is a good start,\
    \ but not a must. If you find that you need to split your test into several test\
    \ classes, then it's fine to do.\n\nA unit class should test the public interface\
    \ of the class. If you do this, all other methods will be tested automatically\
    \ in an indirect way.\n\nIf the package structure of your test class is the production\
    \ class, protected and package-private methods are accessible from a test class\
    \ and can be tested as well but testing these methods might be too far. Private\
    \ methods cannot be tested anyway, you cannot call them from another test class.\n\
    \nYour test suite should ensure that all your non-trivial code paths are tested.\
    \ At the same time, they should not be too closely bound to your implementation.\n\
    \n# How to structure tests?\n\nAll structure techniques has the following steps\
    \ in common:\n\n+   * Setting up the test data\n* Calling the method under test\n\
    * Assert that the expected results are returned\n\nThere are two common patterns,\
    \ which can be applied to your test structure like Arrange, Act, Assert¹ and Given,\
    \ When, Then⁴, which was developed as part of Behavior-Driven Development³ (BDD).\n\
    \n# What about project structure and naming conventions?\n\nNowadays all developers\
    \ use standard tools for building their projects like Maven⁵ or Gradle⁶ᶇ. Thus,\
    \ all production source code resides in src/main/java and all test source files\
    \ are in src/test/java.\n\nTypical directory structure\n\n```\nsrc\n└── main\n\
    │   └── HelloWorld.java\n└── test\n    └── HelloWorldTest.java\n```\n\nTest names\
    \ like the above will usually be prefixed with Test. This is a very common naming\
    \ convention and should be followed consistently. It enables the developer to\
    \ understand at once which class is being tested. Furthermore, some tools rely\
    \ on convention.\n\n> https://xp123.com/articles/3a-arrange-assert-assert/\nhttps://martinfowler.com/bliki/GivenWhenThen.html\n\
    https://martinfowler.com/introducing-bdd/\nhttps://maven.apache.org/\nhttps://gradle.org/"
  merge: -1
