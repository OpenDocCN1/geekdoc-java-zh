  md: '# 4.4.5 Annotations


    JUnit supports the following annotations* for configuring tests:


    @BeforeAll

    Methods that are executed when the execution definition is started, before all
    tests.

    Annotated method must be static.


    @AfterAll

    Methods are executed after all tests, before closing the execution definition.
    For example, resources can be released here. Annotated method must be static.


    @BeforeEach

    Methods are performed before each test.


    @AfterEach

    Methods are performed after each test.


    @Test

    The actual methods with this annotation are executed as tests.


    @Disabled

    Temporary deaktiv of test methods.


    @Tag Used to declare tags for filtering, either at class or method level. Like
    Categories**¹ in JUnit

    4.


    @DisplayName

    Specification of user-defined names for test classes and methods.


    @Timeout

    Used to fail a test if its execution exceeds a certain duration.


    @Nested

    Is used to signal that the annotated class is nested. The nested test class must
    be an inner class, meaning a non-static class. And, since inner classes cannot
    have static fields and methods, this prohibits the use of the @BeforeAll and @AfterAll
    annotations in nested tests.


    @ParameterizedTest

    Is used to signal that the annotated method is a parameterized test method. You
    have to pick up at least one source of arguments. There are several types of parameter
    sources you can pick from.


    @TempDir

    Can be to annotate a non-private field in a test class or a parameter in a lifecycle
    method or test method of type PathOfFile that should be resolved into a temporary
    directory.


    > *¹https://junit.org/junit/5/docs/current/user-guide/#writing-tests-annotations

    ²https://github.com/junit-team/junit4/wiki/Categories'
