  md: '# 1.5 Broken Windows Theory


    The importance of fixing the small problems in your code, the “broken windows",
    so they don''t grow into large problems.

    - The Pragmatic Programmer*


    The broken windows theory is a criminological theory that states visible signs
    of crime, anti-social behavior, and civil disorder create an urban environment
    that encourages further crime and disorder, including serious crimes. The theory
    suggests that policing methods target minor crimes, such as vandalism, loering,
    public drinking, jaywalking and fare evasion, help to create an atmosphere of
    order and lawfulness, thereby preventing more serious crimes. -Wikipedia*


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_21_0.png)


    Broken Windows Theory


    The Broken Window Theory can be used as a metaphor for software development and
    technical debt on a project.


    Every time you delay a fix for a known problem, you might know something that
    is broken, but if you don''t fix it now, you''re in debt. If you have some of
    these and you are aware of them, that is make a notice and remember them later.
    But with real debt, it doesn''t take much to get to a point where you can never
    pay back. It is the point where you have so many problems you can never go back
    and solve them.


    You do not want to let debt out of hand. Stop the small problems before they grow
    into bigger ones. Don''t allow broken windows in your project, but fix them. If
    you can''t fix them now, create a technical debt ticket to make everyone knows
    they''re broken. A technical debt log helps to provide an overview within a team.


    As soon as something is broken and cannot be repaired, starts to spread throughout
    the team. The team or new team members get to use these Broken Windows and not
    afraid to add new ones. This leads to even worse code and the Loss of respect
    for how you handle the code. Take care of technical debts and solve problems no
    matter how small they are. Don''t let the code become rotten. The better the code,
    the other team members will be tempted to check in bad code.


    > *https://prag.com/titles/tpp20-the-pragmatic-programmer-20th-anniversary-edition/

    *https://en.wikipedia.org/wiki/Broken_windows_theory'
