    ```

    3 public class InvoiceBuilder {

    4 Recipient recipient = new RecipientBuilder().build();

    5 InvoiceLines lines = new InvoiceLines(new InvoiceBuilder()).build();

    6 PoundsShillingsPence discount = PoundsShillingsPence.ZERO;

    7 InvoiceBuilder withRecipient(Recipient recipient) {

    8  this.recipient = recipient;

    9  return this;

    10 }

    11 public InvoiceBuilder withInvoiceLines(InvoiceLines lines) {

    12  this.lines = lines;

    13  return this;

    14 }

    15 public InvoiceBuilder withDiscount(PoundsShillingsPence discount) {

    16  this.discount = discount;

    17  return this;

    18 }

    19 public Invoice build() {

    20  return new Invoice(recipient, lines, discount);

    21 }

    ```


    # Combined Builder Pattern


    ```

    1 InvoiceWithNoPostcode = new InvoiceBuilder()

    2 .withRecipient(new RecipientBuilder())

    3 .withAddress(new AddressBuilder())

    4 .withNoPostcode()

    5 .build())

    6

    7 .build();

