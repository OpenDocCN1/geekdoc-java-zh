  md: "# 5.3 SOLID Principles\n\n# 5.3.1 Single Responsibility Principle\n\nA class\
    \ should have one, and only one, reason to change.\n\n+   - This is an object-oriented\
    \ version of the functional programming principle that functions\nhave no side\
    \ effects.\n- A class should only have functions that directly contribute to the\
    \ fulfillment of this task.\n- One of the easiest ways to write classes that never\
    \ need to be changed is to write classes\nserve only one purpose.\n- Each class\
    \ should implement a coherent set of related functions.\n- Having multiple responsibilities\
    \ in a class leads to tight coupling and results in fragile designs.\n- Following\
    \ the principle of single responsibility is to ask yourself again and whether\n\
    each method and process of a class is directly related to the name of class.\n\
    - For methods that do not match the name of the class, move these methods to other\
    \ classes.\n\n# 5.3.1.1 Example: Modem\n\n# Noncompliant Code Example\n\n![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_129_0.png)\n\
    \nBad code\n\n```\npublic interface Modem {\n    // Connection management responsibilities\n\
    \    void dial(String phoneNumber);\n    void hangup();\n\n    // Data management\
    \ responsibilities\n    void send(char c);\n    char receive();\n}\n```"
