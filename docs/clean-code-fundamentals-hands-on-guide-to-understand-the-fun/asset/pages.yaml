  md: '# 4.7 Code Coverage


    Code coverage is a metric that measures at runtime which source code lines have
    been processed. The measurement is done by executing test cases and gives you
    a metric of the degree to which the source code has been tested.


    This allows you to make a statement about how comprehensively the code has been
    tested. It improves the SW quality through better quality of the test cases and
    increases the efficiency of the test cases.


    Test coverage should never be understood as metrics as the quality of the tests
    or the code! It is only an indicator for problem areas. Can therefore only make
    negative statements, not positive


    # Measurement techniques:


    # Statement Coverage / Line Coverage


    +   - Measures whether and how often a single line of code has been run through.

    - Problem: If the line is a logical comparison, a single run is not representative.


    # Decision Coverage / Branch Coverage


    +   - For case distinctions (if, while, etc.) it is additionally checked that
    both cases (true and false) have occurred.


    # Path Coverage


    +   - Path Coverage measures whether all possible combinations of program flow
    paths have been run through.

    - Problem: The number of possibilities increases exponentially with the number
    of decisions.


    # Function Coverage


    +   - Measures whether they have been called based on the functions.


    # Race Coverage


    +   - Concentrates on code points that run in parallel.


    Most code coverage tools on the market only support Statement and Decision Coverage,
    in some cases Path Coverage. Nevertheless, they already provide valuable statements,
    e.g. code parts that were simply forgotten during testing and exceptions that
    have not been considered.'
