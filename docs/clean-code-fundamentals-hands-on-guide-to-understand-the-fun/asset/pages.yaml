    protected

    A protected member or constructor of an object may be accessed from outside the
    package

    in which it is declared only by code that is responsible for the implementation
    of that object.

    Can only be applied to fields, constructors, and methods not to classes.


    package-private

    If none of the access modifiers public, protected, or private are specified, a
    class member or

    constructor has package-private access. It is accessible through the package that
    contains

    the declaration of the class which is declared, but the class member or

    constructor is not accessible in any other package.


    private

    A private class member or constructor is accessible only within the body of the
    top-level

    class that enables the declaration of the member or constructor.


    | | Class | Class within same package | Class outside package |

    | --- | --- | --- | --- |

    | | +public() | +public() | +public() |

    | | +protected() | +protected() | |

    | | +default() | +default() | |

    | | +private() | | |


    | Subclass within same package | Subclass outside package |

    | --- | --- |

    | +public() | +public() |

    | +protected() | +protected() |

    | +default() | |


    # Visibility in Java


    Declare members as private and provide accessible methods for private fields.
    Let distributed

    classes communicate only through this method call.


    If a class, interface, method, or field is part of a published API, it can be
    declared public. Other

    classes and members should be declared as either package-private or private. The
    exposure of

    fields and methods that can access the mutable state of a class via interfaces
    must be avoided.

    This is because interfaces only allow publicly accessible methods, which are part
    of the API of

    t class. An exception is the implementation of methods that expose a public immutable
    value of

    a modifiable object. Modifiable classes should provide copy functionality to ensure
    secure passing

    of instances to the client code.


    # Inheritance and visibility:


    If a method is overwritten, the new method cannot have stronger access control
    than the original.

    In the case of private no inheritance is possible. More precisely, no overwriting
    takes place and

    access to the superclass method via super is not possible.'
