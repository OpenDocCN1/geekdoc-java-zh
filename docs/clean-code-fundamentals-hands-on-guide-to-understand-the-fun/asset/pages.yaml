  md: '# Design Principles


    # 5.3.4.3 Example: StockOrder


    # Noncompliant Code Example


    The noncompliant code example violates the Interface Segregation Principle (ISP)
    by defining a single interface StockOrder that includes multiple methods with
    different combinations of parameters. This design forces clients to implement
    and provide unnecessary parameter combinations, leading to a bloated interface
    and potential confusion.


    # Bad code


    ```

    1 public interface StockOrder {

    2

    3 void sell(StockId id, double price, int quantity);

    4

    5 buy(StockId id, int quantity, double price);

    6

    7 buy(StockId id, int quantity, double price, double commission);

    8

    9 buy(StockId id, int quantity, double minPrice, double maxPrice, double commission);

    10

    11 }

    ```


    # Compliant Solution


    The compliant solution resolves the violation by redefining the StockOrder interface
    with two methods: sell() and buy(), both using a Price object to represent the
    price parameter.


    # Good code


    ```

    1 public interface StockOrder {

    2

    3 void sell(StockId id, int quantity, Price price);

    4

    5 buy(StockId id, int quantity, Price price);

    6

    7 }

    ```


    The Price object encapsulates the price value, ensuring a consistent representation
    and avoiding the need for multiple method signatures with different parameter
    combinations.


    By using the Price object, both the sell() and buy() methods can accept the same
    type of parameter for price, simplifying the interface and avoiding the need for
    overloaded methods.


    Clients implementing the StockOrder interface can now provide the necessary parameters
    without being burdened with unnecessary combinations, improving code clarity and
    reducing the chances of errors.'
