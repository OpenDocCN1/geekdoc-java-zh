  md: '# # 6. Design Patterns of the Gang of Four


    Each pattern describes a problem that occurs over and over again in our environment,
    and then describes the core of the solution to that problem, in such a way that
    you can use this solution million times over, without ever doing it the same Twice.

    –Christopher Alexander 1977, A Pattern Language: Towns, Buildings, Construction


    +   - Design patterns originally come from architecture.

    - 1977 Christoph Alexander describes in his book A Pattern Language. Towns, Buildings,
    Construction the design patterns for landscape and urban planning, among other
    things.

    - Kent and Cunningham drew their inspiration for design patterns in software development
    from Alexander (1987).

    - Gamma, Vlissides, Johnson, and Helm transferred the ideas to software technology
    and designed a pattern catalog.

    - The Gang of Four (GoF) published the book “Design Patterns” in 1995 and made
    design patterns.


    Design patterns are solutions for recurring design problems in software design.
    A based-on experience, they are often only understandable and comprehensible with
    appropriate background knowledge and personal experience. They establish communication
    by forming a vocabulary (Pattern Language) that developers use to discuss design.
    The basics of object-oriented design use Encapsulation, Responsibility, Polymorphism
    and Inheritance must be understood.


    Why are design patterns important?


    Many problems repeat themselves in software development. Class hierarchies become
    inflexible over time and individual classes grow uncontrollably. New extensions
    are very difficult to implement, and the dependencies of a class so that the function
    can be fulfilled. The encapsulation of classes is becoming softened and more and
    more of the internal state is being exposed.


    The wheel does not have to be reinvent every time, at least the solutions are
    well documented. Since design patterns have existed for a long time, the solutions
    have been proven many times and the consequences well understood. Furthermore,
    software design can be discussed on a higher level of abstraction and thus more
    efficiently than the wording is already self-explanatory and known to the developers.
    Instead of looking for the solution to a problem, there is a sense of recognizing
    connections that suggest the use of a design pattern.


    Classification of design patterns according to GoF


    The 23 design patterns of the Gang of Four are divided into three groups. The
    categories describe the intention that is to be achieved with a design pattern.'
