  md: "# 4.4.7.2 @MethodSource\n\n+   * @MethodSource24 provides access to values\
    \ returned from factory methods of the class in which this annotation is declared\
    \ or static factory methods in external classes referenced by fully qualified\
    \ method name.\n* Each factory method must generate a stream of arguments.\n*\
    \ A stream that JUnit can convert into a Stream, such as Stream, DoubleStream,\
    \ LongStream, IntStream, Collection, Iterator, be an array of objects, or an array\
    \ of primitives.\n* Factory methods must be static and not declare any parameters.\n\
