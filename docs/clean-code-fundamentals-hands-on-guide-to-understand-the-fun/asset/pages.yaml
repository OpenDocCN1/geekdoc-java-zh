  md: '# 3.1.2 Choose an expressive name and avoid mental mapping


    Choose an expressive name for a variable, method, class, or code element that
    accurately and clearly describes its purpose or behavior. This can help to make
    the code more readable and understandable, and can reduce the need for other developers
    to mentally map the code elements to their intended meanings.


    Bad code


    ```

    int d; // days since birthday

    String n; // name of host

    ```


    In this code, the variables d and n are not descriptive. It is not immediately
    clear what these variables represent or what they are used for. As a result, other
    developers who are working on this code may need to spend time mentally mapping
    these variables to their intended meanings, which can be time-consuming and error-prone.


    Good code


    ```

    int daysSinceBirthday;

    String hostname;

    ```


    In this code, the variables daysSinceBirthday and hostname are more expressive.
    Their names accurately describe their intended meanings and purposes, which makes
    it easier to understand the code without having to mentally map the variables
    to their meanings.


    # 3.1.3 Make differences clear with meaningful variable names


    Bad code


    ```

    public boolean isFileOld(File s1, File s2) {}

    public static ReplaceFirst(String string, Pattern pattern, String with) {}",

    ```


    Good code


    ```

    public boolean isFileOld(File file, File referenceFile) {}

    public static ReplaceFirst(String text, Pattern regex, String replacement) {}",

    ```'
