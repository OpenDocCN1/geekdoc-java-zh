    \ / @AfterAll\n\n```\nclass BeforeAndAfterAnnotationsTest {\n    private Collection<String>\
    \ collection;\n  @BeforeAll\n    static void oneTimeSetup() {}\n  @AfterAll\n\
    \    static void oneTimeTearDown() {}\n  @BeforeEach\n    void setUp() {\n   \
