  md: '# Keep test cases short and understandable!


    +   - Do not write tests with big test methods.

    - Split the test into multiple test methods.


    # Choose meaningful test case names!


    +   - Naming is hard but try to communicate with the test test name what the is
    doing.

    - Be consistent and choose a naming approach that fits best.

    - Test features not methods, this helps to divide tests in clean test cases with
    mean full method names.


    # Do not trade test code as the second citizen in your codebase!


    +   - Test code should be no less important than production code.

    - Do not treat code worse, treat it like production code and use the same coding
    standards.


    # Remove flaky tests!


    +   - Since software tests serve as an early warning of potential regressions,
    they should always work reliably. A failed test should be cause for concern, and
    a broken build should immediately investigate why the test failed. It is a stop-the-world
    event.

    - This approach can only work for tests that fail in a deterministic way. A test
    that sometimes fails and sometimes passes is unreliable and completely corrupts
    the entire test suite. This can have negative effects on the team regarding tests.

    - Developers no longer trust tests and soon ignore them. Even if nonflaky tests
    fail, it is difficult to detect them in several broken tests. On the other hand,
    it is difficult to understand whether new failures are new or whether they come
    from existing flaky tests.'
