  md: "# Software Quality Assurance\n\n+   - Often a test can be extremely simplified\
    \ by making assumptions that another test has already verified.\n- If one gets\
    \ into the trouble of having to adapt too many tests just to make a code change,\
    \ the tests are not orthogonal.\n\n# Record results in the test\n\n+   - Expected\
    \ values are coded as constants, not calculated again in the test.\n- If we reproduce\
    \ application logic in the test, we also reproduce its errors.\n\n# Performance\n\
    \n# Bad code\n\n```\nclass EuroTest {\n    @Test\n    void multiYearInterest()\
    \ {\n        double amount = 100.0;\n        double interest = 5.0;\n        double\
    \ expectedInterest = amount + Math.pow(1 + interest / 100.0, 3.0);\n\n       \
    \ assertEquals(expectedInterest, calculator.interest(amount, interest, 3), 0.001);\n\
    \    }\n}\n```\n\n# Good code\n\n```\nclass EuroTest {\n    @Test\n    void multiYearInterest()\
    \ {\n        double amount = 100.0;\n        double interest = 5.0;\n\n      \
    \  assertEquals(115.76, calculator.interest(amount, interest, 3), 0.001);\n  \
    \  }\n}\n```\n\n# Do not forget about exceptions and errors!\n\n+   - Often the\
    \ error cases are insufficiently tested. But exactly these are important to understand\
    \ how the code behaves when it is not used correctly.\n\n# Remove redundancy in\
    \ test code!\n\n+   - The DRY Principle applies to test code as well.\n- Redundancies\
    \ should be avoided to reduce the impact on test code in the event of future changes\
    \ to the production code."
