  md: '# 6.2.3 Adapter


    Convert the interface of a class into another interface clients expect. Adapter
    lets classes work together that couldn''t otherwise because of incompatible interfaces.


    The adapter pattern defines rules:


    +   - Adaptee which is to be adapted to the target interface.

    - Adapter who performs the adaptation.

    - Target interface to be used by the client.

    - Client who uses the adaptee through the adapter.


    Class Adapter uses multiple inheritance:

    in the case of a class adapter, the adapter inherits its adaptee class and implements
    the target interface. When a client object calls a method of the class adapter,
    the adapter internally calls a method of the adapter it inherits.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_228_0.png)


    Object Adapter relies on composition:

    in the case of an object adapter, the adapter delegates to an instance of the
    adaptee. The adapter implements the target interface but does not inherit the
    classes that need to be adapted. When a client calls a method of the object adapter,
    the object adapter calls a corresponding method on the instance of the adaptee
    it references.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_228_1.png)'
