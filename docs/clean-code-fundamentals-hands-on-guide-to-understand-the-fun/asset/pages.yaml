  md: '# # 4. Software Quality Assurance


    # ## 4.1 Test Pyramid


    Mike Cohn introduced the Test Pyramid in his book Succeeding with Agile. It is
    a great way to visualize different levels of testing. It tells you how many tests
    to do on each level. The original test pyramid consists of three layers that your
    test suite should consist of *Unit Tests, Service Tests* and *User Interface Tests*.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_84_0.png)


    The Test Pyramid


    According to this pyramid, write many small and fast tests. Write some more coarse-grained
    integration tests and very few high-level tests that test your application from
    top to bottom.


    Be careful not to end up with a [Testing Pyramids & Ice-Cream Cones¹](https://alisterscott.com/kb/testing-pyramids/)
    that is a complete waste of time and maintenance.


    # Unit Tests


    Unit tests focus on a single class and are the earliest, cheapest, and fastest
    to complete. Unit tests are written at an early stage so that we get immediate
    feedback and know exactly where the bugs.


    # Integration / Component / Acceptance Tests


    Integration tests focus on the proper integration of different classes and modules.
    Compared to unit tests, they may require more specialized tools either for preparing
    the test environment or for interaction.


    # UI Tests


    UI tests focus on the verification of a system from the client''s point of view.
    The entire application is tested in a real scenario, such as communication with
    the database, network, hardware, and other applications.


    > ¹https://alisterscott.com/kb/testing-pyramids/'
