  md: '# 4.2 Test Classification


    Tests can be classified according to their information status. There are three
    main testing strategies White-Box-Test, Black-Box-Test, and Grey-Box-Test. WBT
    is performed by the development team after coding is complete by testing the internal
    behavior of the code. BBT is performed by the professional test engineer by looking
    at the application. They do not have access to the logic and the flow of the code.
    GBT is the combination of WBT and BBT and is done without the knowledge of the
    implementation.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_85_0.png)


    | | WBT | BBT |

    | :--- | :--- | :--- |

    | Advantage | Testing of subcomponents and internal functionality<br>Less organizational
    effort | Better verification of the overall system<br>Testing of semantic properties
    with suitable specification<br>Portability of systematically created test sequences
    to platform-independent implementations |

    | | Automation through good tool support | |

    | Disadvantage | Compliance with a specification not verified<br>Possible testing
    around errors | Greater organizational effort<br>Additional functions added during
    implementation are only tested by chance<br>Test sequences of an insufficient
    specification are unusable |'
