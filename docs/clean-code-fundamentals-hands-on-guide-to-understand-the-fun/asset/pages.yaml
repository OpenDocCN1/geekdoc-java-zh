  md: '# 2.10 Big Ball of Mud


    > A Big Ball of Mud is a haphazardly structured, sprawling, sloppy, duct-tape-and-baling-wire,
    spaghetti-code jungle. These systems show unmistakable signs of unregulated growth
    and repeated expedient repair. Information is shared promiscuously among distant
    elements of the system, often to the point where nearly all the important information
    becomes global or duplicated.


    The overall structure of the system may never have been well defined.


    If it was, it may have eroded beyond recognition. Programmers with a shred of
    architectural sensitivity shun these quagmires. Only those who are unconcerned
    about architecture, and, perhaps, are comfortable with the inertia of the day-to-day
    chore of patching holes in these failing dikes, are content to work on such systems.

    —Brian Foote and Joseph Yoder, Big Ball of Mud.


    Big Ball of Mud is an anti-pattern of software architecture and describes a program
    that has no recognizable software architecture.


    Most frequent causes:


    +   - Insufficient experience

    - Lack of awareness for software architecture

    - Not modularized, high coupling and low cohesion

    - Does not comply with the principles of good design

    - Pressure on the implementation team

    - Constantly changing requirements

    - High pressure

    - Low budget

    - Employee fluctuation


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_40_0.png)


