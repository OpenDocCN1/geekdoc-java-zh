  md: '# Design Patterns of the Gang of Four


    | Group | Pattern | Description |

    |---|---|---|

    | | Observer | Define a one-to-many dependency between objects so that when one
    object changes state, all its dependents are notified and updated automatically.
    |

    | | Chain of Responsibility | Avoid coupling the sender to its receiver by giving
    more than one object a handle to the request. Chain the receiving objects and
    pass the request along the chain until an object handles it. |

    | | Command | Encapsulates a request as an object, thereby letting you parameterize
    clients with different requests, queue or log requests, and support undoable operations.
    |

    | | Interpreter | Given a language, define a representation for its grammar along
    with an interpreter that uses the representation to interpret sentences in the
    language. |

    | | Iterator | Provide a way to access the elements of an aggregate object sequentially
    without encapsulating how a set of objects interact. |

    | | Mediator | Define an object that mediates loose coupling by keeping objects
    from referring to each other explicitly, and it lets you vary their interaction
    independently. |

    | | Memento | Without violating, capture and externalize an object''s internal
    state so that the object can be restored to its later state. |

    | | Visitor | Represent an operation to be performed on the elements of an object
    structure. Visitor lets you define a new operation without changing the classes
    of the elements on which it operates.|


