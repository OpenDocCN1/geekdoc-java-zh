  md: "# 4.4.7 Parameterized Tests\n\nParameterised tests²³ make it possible to run\
    \ a test several times with different arguments. They are declared just like normal\
    \ @Test methods but use the @ParameterizedTest annotation instead.\n\nJUnit supports\
    \ different sources as arguments:\n\n+   - @ValueSource\n- @EnumSource\n- @MethodSource\n\
    - @CsvSource\n- @CsvFileSource\n- @ArgumentsSource\n- @EnumSource\n- @NullSource\n\
    - @EmptySource\n- @NullAndEmptySource\n\n# 4.4.7.1 @ValueSource\n\n+   - @ValueSource²³\
    \ provides access to an array of values.\n- Supported types are shorts, bytes,\
    \ ints, longs, floats, chars, booleans, strings and classes.\n- Only one of the\
    \ supported types may be specified by @ValueSource declaration.\n\n@ValueSource\n\
    \n```\n@ParameterizedTest\n@ValueSource(strings = { \"otto\", \"level\", \"radar\"\
    , \"rotor\", \"kayak\" })\nvoid palindromes(String candidate) {\n    assertTrue(StringUtils.isPalindrome(candidate));\n\
    }\n\n@ParameterizedTest\n@ValueSource(ints = { 1, 2, 3 })\nvoid testWithValueSource(int\
    \ argument > 0 && argument < 4) {\n    assertTrue(argument);\n}\n```\n\n> ²³https://junit.org/junit5/docs/current/user-guide/writing-tests-parameterized-tests\n\
    ²³https://junit.org/junit5/docs/current/api/org.junit.jupiter.params/org/junit/jupiter/params/provider/ValueSource.html"
