  md: '# 6.2 Structural


    # 6.2.1 Facade


    Provide a unified interface to a set of interfaces in a subsystem. Facade defines
    a higher-level interface that makes the subsystem easier to use.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_219_0.png)


    Use cases:


    +   - Division of a complex system into several simple subsystems.

    - Facade promotes loose coupling.

    - Subdivision of a system into layers and the communication of these via facades.

    - Reduction of dependencies between the client and the subsystem used.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_219_1.png)


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_219_2.png)'
