  md: '# Why does Test-driven development improve the quality?


    If you can''t write a test for something you don''t understand it


    The practice of writing tests before implementation forces to deal more intensively
    with the problem to be solved and leads to a higher quality of the code, which
    is also more comprehensible for other developers. As a side-effect, TDD is also
    forced to deal with the question of what customers expect from the software to
    be written. TDD is therefore basically not a test method but a design method.


    # Without a regression test you can''t clean the code


    Without the possibility of quality testing, you do not risk changing existing
    code. It is better to copy the code of a class, for example, into a new class,
    which is extended with additional features. The result is an overloaded, confusing
    project with large amounts of superfluous code.


    # Fast feedback cycles save time and money


    If you write the test first, the correctness of the implementation a be checked
    immediately. As a result, you always have certainty about when you have finished
    developing a feature.


    # The Physics of Debug Later Programming (DLP)


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_87_0.png)


    +   * As Td increases, Tfind increases dramatically

    * Tfix is usually short, but can increase with Td


    # Debug Later Programming


    With these rapid feedback cycles, you often get lost in the search for the causes
    of a bug. TDD helps to break down a big problem into smaller, manageable, and
    testable problems.


    # You are going to test it anyway, spend the time to do it


    Regression tests are indispensable. Without performing them regularly, testing
    large applications becomes impossible. Of course, regression tests can be written
    afterwards, but then one does not benefit from the better design quality provided
    by TDD. Secondly, time tends to be limited as a deadline comes, so subsequent
    testing often comes up short.


    # It makes my work more enjoyable


    Every successful test gives you the feeling of having created something valuable:
    a piece of executable software that you can proudly show to other developers.'
