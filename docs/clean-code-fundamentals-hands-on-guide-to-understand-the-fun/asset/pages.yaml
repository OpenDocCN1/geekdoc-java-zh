  md: '# 6.2.6 Flyweight


    Use sharing to support large numbers of fine-grained objects efficiently.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_243_0.png)


    Use cases:


    +   - Need to create large number of objects when memory cost is a constraint.

    - When many of the object attributes can be made external and shared.

    - Avoid unnecessary object initialization.

    - Where the identity of the object is not a matter of concern and the required
    operations can be performed on the shared objects.


    As defined by GoF, an object can have two states, the intrinsic and the extrinsic
    state:


    Intrinsic state


    Stored in the flyweight; it consists of information that''s independent of the
    flyweights context, thereby making it shareable.


    Extrinsic state


    Depends on and varies with the flyweight''s context and therefore cannot be shared.
    Client objects are responsible for passing extrinsic state to the flyweight if
    necessary.'
