  md: "# 6.3.4.2 Example: Influencer\n\nSubject\n\n```\npublic interface Subject {\n\
    \    void register(Observer observer);\n    void unregister(Observer observer);\n\
    \    void notifyAllObservers(Object message);\n}\n```\n\nObserver\n\n```\ninterface\
    \ Observer {\n    void update(Object message);\n}\n```\n\nInfluencer\n\n```\n\
    public class Influencer implements Subject {\n    private final Queue<Observer>\
    \ followers = new ConcurrentLinkedQueue<>();\n    private final String name;\n\
    \    public Influencer(String name) {\n        this.name = name;\n    }\n    @Override\n\
    \    public void register(Observer follower) {\n        this.followers.add(follower);\n\
    \    }\n    @Override\n    public void unregister(Observer follower) {\n     \
    \   this.followers.remove(follower);\n    }\n    @Override\n    public void notifyAllObservers(Object\
    \ message) {\n        this.followers.forEach(follower -> follower.update(message));\n\
    \    }\n}\n```"
