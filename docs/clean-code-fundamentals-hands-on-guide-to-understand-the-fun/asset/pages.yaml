  md: '# 2.16 Software Engineering Values


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_57_0.png)


    Software Engineering Values


    +   - To ensure the functional correctness of the system, it is essential that
    each unit of the system is verifiable and has been tested.

    - A system is only complete if its functional correctness and completeness are
    proven by automatically triggered tests.


    # Maintainability


    +   - We build durable systems, which means we always must consider how to maintain
    the systems.

    - The colleagues who maintain a system can change over time. Therefore, a maintainable
    system should be easy to understand. The level of system-specific knowledge required
    to carry out maintenance should be kept to a minimum.


    # Consistency


    +   - To improve flexibility and maintenance, the number of different solutions
    like code-level patterns, libraries, third-party services, and application integration
    patterns, for the same problem should be kept to a minimum.

    - Having multiple solutions to a problem is better than having no solutions, having
    a single solution to a problem is the best.


    # Modularity


    +   - Things are always changing. To protect our code from this fundamental fact,
    we need to limit the impact of change and divide it into reasonably independent,
    coherent units at all levels.


    # Simplicity


    +   - The simplest parts of a system to change are those that do not exist. For
    any given requirement, the simplest, minimalist solution should be provided which
    meets the previous values.'
