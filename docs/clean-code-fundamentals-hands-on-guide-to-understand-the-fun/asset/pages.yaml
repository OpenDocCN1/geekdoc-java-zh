  md: "Software Quality Assurance\n\n# 4.4.3 First unit test\n\nFirst simple JUnit\
    \ 5 test\n\n```\nclass SimpleTest {\n    private Collection<String> collection\
    \ = new ArrayList<>();\n\n    @Test\n    void testEmptyCollection() {\n      \
    \  assertTrue(collection.isEmpty());\n    }\n\n    @Test\n    void testOneItemCollection()\
    \ {\n        collection.add(\"First JUnit Test\");\n        assertEquals(1, collection.size());\n\
    \    }\n}\n```\n\nExecution order\n\n```\ntestEmptyCollection()\ntestOneItemCollection()\n\
    ```\n\nExecution order* of tests:\n\nBy default, test methods will be ordered\
    \ using an algorithm that is deterministic but intentionally nonvious. This ensures\
    \ that runs of a test suite execute test methods in the same order, allowing for\
    \ repeatable builds. Even if unit tests should normally depend on the order in\
    \ which they are executed, there are times when it is necessary to enforce a certain\
    \ order of execution of the test method. To specify the order in which test methods\
    \ are executed, annotate your test class or test interface with @TestMethodOrder\
    \ and provide the preferred MethodOrder.\n\n> With JUnit 5 you can reduce the\
    \ visibility of the test classes and methods. With JUnit 4 the classes and methods\
    \ had to be public. In JUnit 5 test classes can have any visibility, it is recommended\
    \ to use the default package visibility, which improves the test codebase.\n\n\
    *https://junit.org/junit5/docs/current/user-guide/#writing-tests-test-execution"
