    \    public static void main(String[] args) {\n        VehicleFactory vf = VehicleFactory.vehicleFactory(VehicleFactory.LUXURY_VEHICLE);\n\
    \        Car car = vf.car();\n        System.out.println(\"Name: \" + car.name()\
