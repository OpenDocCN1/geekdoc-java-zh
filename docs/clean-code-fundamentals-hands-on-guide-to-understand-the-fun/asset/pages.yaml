    \n# Use cases:\n\n+   - Creating a copy of a prototype object and making required\
    \ modifications.\n\nJava provides some ways to copy an object to create a new\
    \ one. One is the java.lang.Cloneable marker interface. You need to implement\
    \ the java.lang.Cloneable interface and override the clone method which every\
    \ object inherits from the Object class.\n\nThere are two categories regarding\
    \ cloning, shallow and deep cloning.\n\nA shallow copy copies all reference types\
    \ or value types, but it does not copy the objects that the references refer to.\
    \ The references in the new object point to the same objects that the references\
    \ in the original object point. The default clone implementation in Java creates\
    \ a clone as a shallow copy.\n\nA deep copy copies the elements, and everything\
    \ directly or indirectly referenced by the elements.\n\n# 6.1.5.1 Example: Person\
    \ - Shallow copy\n\nPerson\n\n```\npublic class Person implements Cloneable {\n\
    \    private String name;\n    private Address address;\n\n    public Person(String\
    \ name, Address address) {\n        this.name = name;\n        this.address =\
    \ address;\n    }\n\n    public String name() {\n        return this.name;\n \
    \   }\n```"
