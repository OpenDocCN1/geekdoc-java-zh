  md: '# # 3. Clean Code Best Practices


    # ## 3.1 Communicate through code


    > > There are only two hard things in Computer Science: cache invalidation and
    naming things.\ - Phil Karlton


    # ### 3.1.1 Use code conventions and avoid misinformation


    Java code conventions are a set of guidelines for writing Java that are intended
    to help improve the readability and maintainability of the code. Some of the key
    conventions include using descriptive and meaningful names for variables and methods,
    using consistent indentation and spacing, and using comments to document the code.


    To avoid misinformation, it is important to follow these code conventions. This
    can help ensure that other developers who may be working on the code in the future
    can easily understand the code works and what it does.


    ```

    public static final double pi = 3.14159265358979323846;

    int YEAR;

    String first_name;

    public class convert_strategy {

    Set carList;}

    ```


    In this snippet, there are several violations of Java code conventions and potential
    sources of misinformation:


    +   - **Inconsistent Naming**: The variable pi violates the convention of using
    uppercase letters and underscores for constant names. It should be renamed to
    PI to adhere to the convention. Similarly, the variable YEAR violates the convention
    of using lowercase letters for variable names. It should be renamed to year for
    consistency.

    - **Camel Case Naming**: The variable first_name violates the convention of camel
    case for variable names. It should be renamed to firstName to follow the convention.

    - **Class Naming**: The variable convert_strategy violates the convention of using
    PascalCase for class names. It should be renamed to ConvertStrategy to adhere
    to the convention.

    - **Inappropriate Naming**: The variable carList is misleading because it implies
    that it is a list of cars. However, it is declared as a Set, which may cause confusion
    for other developers. It should be renamed to carSet or another appropriate name
    that reflects the actual data structure being used.'
