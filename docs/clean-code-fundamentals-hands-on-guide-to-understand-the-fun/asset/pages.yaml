    # Advantages:


    +   - Decorator offers more possibilities than inheritance, as it is not static
    and therefore defines behavior of the subclass.


    +   - Slim, cohesive classes. Each decorator represents exactly one function and
    nothing else. This increases class cohesion and makes the corresponding code easier
    to maintain and extend.


    +   - Avoidance of long and confusing inheritance hierarchies.


    +   - By combining a few Decorator objects, the functionality of the object can
    be extended considerably.


    # Disadvantages:


    +   - Decorated objects are wrapped by the actual decorator. This makes it difficult
    to determine the identity of the objects.


    +   - High number of objects. Each additional feature requires a new Decorator
    object. The number of many small, similar objects and their initialization code
    can quickly become confusing. Can be fixed by a factory.


    +   - Decorator-Pattern is a dynamic process, so in general the runtime behavior
    is worse with classical inheritance.'
