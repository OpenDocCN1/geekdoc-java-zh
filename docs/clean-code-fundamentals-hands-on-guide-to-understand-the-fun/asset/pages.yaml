  md: '# 4.8 Static Code Analysis


    Static code analysis is a static software test procedure. In contrast to dynamic
    test procedures, the software to be tested does not have to be executed.


    Therefore, only the source code is needed. There is no need to run the system
    or a special test environment. It can be done by manual testing, but also automatically
    by a program. But should be anchored as early as possible in the development process.


    Static code analysis is also used in compilers and IDEs for:


    +   * Type check, e.g. correct use of types

    * Style check, e.g. use of guidelines

    * Bug finding, e.g. determining the use of unialized variables


    Tooling:


    SonarQube³³

    Platform for static code analysis of the technical quality. Supports not only
    Java but also the analysis of other programming languages. Analyses the code for
    different quality ranges and displays the results graphically.


    Checkstyle³⁴

    Checkstyle is an open-source program that supports the compliance of coding conventions
    in Java programs.


    SpotBugs⁵

    Open source program that uses static code analysis to check Java programs for
    numerous bugs. He is the successor of Findbugs.


    PMD³⁶

    PMD is a static code analyzer. It finds common programming flaws like unused variables,
    empty catch blocks, unnecessary object creation, and so forth. Include CPD, a
    copy-paste detector.


    UCDetector⁷⁷

    unnecessary Code Detector searches for non-referenced methods and classes and
    advises on the visibility of methods and classes.


    ³³http://www.sonarqube.org/

    ³⁴https://checkstyle.sourceforge.net/

    ⁵https://spotbugs.github.io/

    ³⁶https://pmd.github.io/

    ⁷⁷http://www.ucdetector.org/'
