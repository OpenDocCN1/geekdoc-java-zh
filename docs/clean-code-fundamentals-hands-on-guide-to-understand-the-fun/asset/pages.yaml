  md: 'Basics of Software Design


    # 2.8 Coupling


    Measure for the dependencies between components.


    Low coupling facilitates maintainability and makes the system more stable.


    Coupling refers to the degree of interdependence between software modules. It
    is a measure of how closely connected different modules or components are within
    a system. Low coupling is a desirable characteristic in software design because
    it enhances maintainability, flexibility, and stability.


    Low coupling is beneficial for several reasons:


    +   - **Maintainability**: When modules are loosely coupled, changes to one module
    have minimal impact on others. This isolation simplifies maintenance and reduces
    the risk of introducing bugs when modifications are made.

    - **Stability**: Low coupling contributes to a more stable system because modules
    operate independently. If one module fails or requires changes, the impact on
    the overall system is limited.

    - **Flexibility**: Systems with low coupling are easier to extend and modify.
    New features can be added with minimal disruption to existing components.

    - **Reusability**: Modules that are independent of each other can be reused in
    different projects, saving development time and resources.


    The following diagram illustrates the concept of coupling:


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_37_0.png)


    Coupling


    High coupling occurs when modules are heavily dependent on each other. This can
    lead to several issues:'
  merge: -1
  pgno: 37
- img_proc: true
  md: '# Basics of Software Design


    +   - **Complex Maintenance**: Highly coupled modules are difficult to maintain
    because changes in one module require changes in another, leading to a cascade
    of modifications.

    - **Fragility**: The system becomes fragile and prone to breaking when changes
    are made. A single change can have widespread effects.

    - **Lack of Modularity**: Highly coupled systems are monolithic, making it challenging
    to isolate and update components.

    - **Poor Reusability**: Reusing a module in a different context is difficult because
    of its dependencies on other parts of the system.


    Coupling can manifest in various forms, each affecting the system differently:


    +   - **Data Coupling**: Occurs when modules share data. This is the most desirable
    form of coupling because it usually involves passing simple parameters.

    - **Control Coupling**: Happens when one module controls the behavior of another
    by passing it information. This is less desirable as it creates dependencies on
    the control logic.

    - **External Coupling**: Exists when modules rely on external systems or libraries.
    While often necessary, this can complicate maintenance if the external dependencies
    change.

    - **Common Coupling**: Occurs when multiple modules share the same global data.
    This creates a high level of interdependency and can lead to unexpected effects.

    - **Content Coupling**: The worst form of coupling, where one module relies on
    the internal workings of another module. Any change in the internals of one module
    necessitates changes in the other.


    While it''s impossible to eliminate coupling entirely, it can be minimized through
    several practices:


    +   - **Encapsulation**: Hide the details of a module from other modules. This
    limits the interdependencies and makes the system more robust.

    - **Interface Design**: Use well-defined interfaces to interact with other modules.
    This allows changes to be made to the internals of a module without affecting
    others.

    - **Dependency Injection**: Instead of a module creating its dependencies, they
    should be provided from the outside. This reduces the hard-coded dependencies
    and improves flexibility.

    - **Event-Driven Architecture**: Use events to communicate between modules. This
    decouples the modules, as they only need to know about the events, not each other.


    # 2.9 Cohesion - Coupling


    Cohesion and coupling are the most important attributes for the quality of a design.
    In software development, coupling means the measure for the dependencies between
    components, while cohesion stands for the measure of the unity of the elements
    of a component. It is very important to understand what impact these two parameters
    can have on a system and how they can be influenced.


    To sum it up:'
