  md: '# 2.12 Cognitive Psychology and Architectural Principles


    Over the course of evolution, the human brain has developed impressive mechanisms
    for managing complex structures. Cognitive psychology, the study of how the human
    mind processes information, focuses on understanding the mental processes underlying
    behavior, such as perception, attention, language, problem-solving, and learning.


    By understanding these processes, we can design software architectures that are
    intuitive and easy to understand. Cognitive psychology provides valuable insights
    that can be translated into architectural principles—guidelines or best practices
    for designing software systems.


    These architectural principles typically focus on the overall structure and organization
    of the system, aiming to ensure it is maintainable, understandable, and easy to
    modify. The goal is to develop software products that maintain consistent quality
    over the long term, even with varying development teams.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_42_0.png)


    Cognitive Psychology and Architectural Principles


    The following mechanisms developed by our brains for handling complex structures
    have direct mappings to software architecture:


    # Chunking


    +   - **Cognitive Psychology**: Chunking involves grouping individual elements
    into larger, manageable units, making it easier to process and remember information.

    - **Software Architecture**: In software design, chunking translates to creating
    cohesive modules or components that encapsulate related functionality. This modular
    approach simplifies development and maintenance.


    # Formation of Hierarchies:


    +   - **Cognitive Psychology**: The brain organizes information into hierarchical
    structures, facilitating processing and retrieval.'
