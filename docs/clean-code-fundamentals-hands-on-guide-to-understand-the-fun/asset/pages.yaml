  md: '# 5.5.2 Stable Dependencies Principle


    Depend on the direction of stability.


    +   - The dependencies between packages should be in the same direction as the
    stability.

    - A package should only depend on packages that are more stable than itself.

    - The fewer dependencies a package has on others and the more dependencies other
    packages have on that package, the more stable it is.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_177_0.png)


    Instability metric


    The stability of a package is the result of outgoing coupling (Ce) to total coupling
    (Ca + Ce).


    ```

    I = Instability, 0 ≤ I ≤ 1

    I = 0, stable package

    I = 1, unstable package

    ```


    > $I = \frac{Ce}{Ca + Ce}$$


    Ca = incoming dependencies (afferent couplings)

    Ce = outgoing dependencies (efferent couplings)


    An instability of 1 means that no other package depends on this package. This
    package depends on other packages and is unstable as a package can be. Its lack
    of dependencies gives it no reason to change. Furthermore, the packages it depends
    on can give it reasons to change.


    An instability of 0 means that the package depends on other packages, but does
    not depend on other packages at all. It is independent and is as stable as it
    can be. Its dependencies make it difficult to change. Further, it has no dependencies
    that could force it to change.


    The SDP says that the metric of a package should be greater than the metrics of
    the packages it depends on. The metric of instability should decrease in the direction
    of dependency.'
  merge: -1
