    \    }\n}\n```\n\nThe Calculator has a calculate method that performs different\
    \ operations based on the value of the operator parameter. However, if we need\
    \ to introduce new operations (e.g., exponentiation, square root), we would have\
    \ to modify the Calculator class, which is against the OCP principle.\n\n# Compliant\
    \ Solution\n\nGood code\n\n```\npublic enum Operation {\n    PLUS(x, y) -> x +\
    \ y,\n    MINUS(x, y) -> x - y,\n    MULTIPLY(x, y) -> x * y,\n    DIVIDE(x, y)\
    \ -> x / y;\n}\n```\n\n```\nprivate final DoubleBinaryOperator operator;\n\nOperation(DoubleBinaryOperator\
    \ operator) {\n    this.operator = operator;\n}\n\npublic double apply(double\
    \ x, double y) {\n    return this.operator.applyDouble(x, y);\n}\n```\n\nAn enum\
    \ called Operation is introduced to represent different operations. Each operation\
    \ is defined as a constant with a corresponding lambda expression (DoubleBinaryOperator)\
    \ that performs the operation. The method is provided to apply the operation to\
    \ the given operands."
