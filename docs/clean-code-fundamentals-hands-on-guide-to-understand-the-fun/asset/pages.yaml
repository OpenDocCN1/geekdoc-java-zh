  md: '# Basics of Software Design


    # Architecture Patterns


    The Architectural Patterns are at the top of the design pyramid. Architectural
    Patterns are the methods of proven design structures. More specifically, an Architectural
    Pattern is a set of design decisions that are repeated in practice, and have well-defined
    characteristics which can be reused. There are many Architecture Patterns like
    microkernel, micro-services, layered architecture, event-based, and many more.


    # 2.2 Basic concepts of OOD


    Object-oriented programming has four basic concepts: abstraction, encapsulation,
    inheritance and polymorphism. Although these concepts may seem complex, understanding
    how they work will help you to understand the basics of software design.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_25_0.png)


    Basic concepts of OOD


    # Abstraction


    Abstraction implies that the client only interacts with specific attributes and
    methods of an object. Abstraction uses simplified high-level access to a complex
    object.


    +   - Hiding of complexity by ignoring irrelevant details

    - Solves the problem at the design level


    # Encapsulation


    Encapsulation is the mechanism for hiding data implementation by restricting access
    to classes, methods, and variables. An example would be achieving this, by keeping
    instance variables private and making access methods more visible. To reduce couplings
    between software components, encapsulation mechanisms are essential.


    +   - Information and data hiding

    - Solves the problem at the implementation level


    # Inheritance


    Inheritance allows classes to inherit characteristics of other classes. In practice,
    parent classes extend attributes and behaviors to subclasses.'
