  md: '# Basics of Software Design


    # 2.13 Layered Architecture


    # 2.13.1 Use of Layered Architecture


    Architectural styles and patterns play an important role in software engineering.
    There are many possibilities for the architecture and design of an application.
    The complexity of an application depends on different requirements. A system should
    be designed in such a way that the architecture is easily reusable, extendable,
    and maintainable and allows a clear separation of components.


    Architectures should not be about frameworks. Frameworks are tools to be used
    that support your desired design of an application. You should not built your
    architecture around a framework.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_44_0.png)


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_44_1.png)


    Use of Layered Architectures


    A common approach is the so-called n-tier architecture. Here, the building blocks
    of the application are divided into layers according to their task. This layering
    was the de-facto standard for many applications and therefore is widely known
    by most architects, designers, and developers.


    Although the layer architecture pattern does not specify the number and types
    of layers, layer architectures consist of three or four layers. For example, smaller
    applications may have only three layers, while larger and more complex business
    applications may have five or more layers.


    A three-tier architecture consists of, for example, the persistence layer, the
    business layer, and the presentation layer. It includes clearly defined interfaces
    and a defined direction of the data flow. To minimize the coupling of the layers,
    domain objects are used to transport the data from layer to layer.'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# Basics of Software Design


    Traditional software architecture defines the following three main layers for
    a layered software design:


    The presentation layer is to respond to client requests. On the one hand, it presents
    the data on an interface in a proper form, and on the other hand, it includes
    the execution and reaction to user actions. When implementing and realizing this
    layer, the challenge is to keep it free of business logic. For this reason, the
    presentation layer should not implement business logic, but only call and use
    it.


    Business Layer


    The business layer represents a logical and presentation-independent layer. In
    it, the business logic is programmed, i.e., everything that can be done independently
    of a concrete presentation. It contains the entire functionality of the business
    requirements developed in the use cases. The focus during implementation is on
    the grouping of related components and the abstraction of the architecture to
    be developed.


    Persistence Layer


    The persistence layer is responsible for the actual access to the data in the
    database. The database access must not be performed by any other layer than the
    persistence layer to achieve the highest level of encapsulation. For the higher
    layers, it must be irrelevant in which the objects are stored. For this reason,
    no direct database call may be used in the business or presentation layer. The
    persistence layer is only called via the business objects of the business layer.


    How do you organize your classes into packages?


    Imagine you''re writing a web application. In this application, you handle tickets
    and reservations. Your classes include classes like TicketController, TicketService,
    TicketRepository for the ticket handling and RegistrationController, RegistrationService
    and RegistrationRepository for registration. So, how do you organize your classes
    into packages and create a valid architecture?


    There are two different ways to structure your packages. You can focus on the
    technical tiers:


    +   - com.swsc.web

    - com.swsc.service

    - com.swsc.repository


    Or you can focus on the domain and separate the packages into feature-driven approach:


    +   - com.swsc.registration

    - com.swsc.ticket


