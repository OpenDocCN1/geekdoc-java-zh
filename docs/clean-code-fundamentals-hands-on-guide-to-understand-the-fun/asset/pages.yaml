    12 (C) ReservationService

    13 (I) ReservationRepository

    14 com.swcs.reservation.repository

    15 (C) ReservationJdbcRepository

    ```


    The advantage of this approach is that the entire business logic is defined centrally
    in a business component and is decoupled from the outside world. But the visibility
    here is also too much open.


    # Reducing dependencies with application events


    Direct dependencies between modules are usually created by direct calls and the
    use of classes from another module. Dependencies should be reduced as far as possible.
    Cyclic dependencies should be avoided at all costs.


    There are several ways to reduce them like application events. Application events
    can be used for loosely coupled components to exchange information. By replacing
    the direct call with an application event, you can reverse the dependencies. A
    module creates an event of a certain type, which is located within it. Another
    module registers an event listener, which listens and reacts to this event type.
    The received module thus has a dependency on the sending module, because it knows
    this event and not vice versa. This is especially useful for calls with direct
    commands to another module like audit logs.


    # 2.13.7 The Java Module System


    With the Java Module System introduced in Java 9, you get another way to add visibility
    rules to your architecture. The architecture examples were designed without the
    capabilities of the module system. If you use this, it will make it easier for
    you to organize your code.


    The modularity adds a higher level of aggregation above the packages. The packages
    in one module are only accessible to other modules if the module explicitly exports
    them. Even then, another module can only use these packages if it explicitly declares
    that it needs the functionality of the other module.


    You will find that taking the module system into account helps you to develop
    cleaner, more consistent designs. You don''t need a modular system to design for
    modularity, but a modular system makes this much easier.


    The book The Java Module System by Nicolai Pavlov gives a detailed insight into
    the features of the module system.


    > https://openjdk.java.net/jeps/261'
