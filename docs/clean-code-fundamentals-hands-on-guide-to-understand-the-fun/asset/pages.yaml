    The advantages are obvious:


    +   * You get a low coupling and high cohesion of the slices.

    * The code structure corresponds to the domain, which ensures a consistent understanding
    and communication between the developers and the department.

    * As new features and enhancements are mostly technical driven, it is easier to
    identify the appropriate modules and to determine the level of change.

    * Changes within a single functional domain can happen within a single part of
    the system. Side effects are avoided or reduced in this way because the modules
    are independent of each other.

    * Vertical separation promotes forming hard contextual boundaries. Vertical layering
    enables easier architectural transformation from a monolithic structure to a distributed
    structure built like micro-services.

    * Testability is better because the technical logic of a module is separate from
    other modules.'
