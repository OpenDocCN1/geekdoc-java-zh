  md: '# 2.6 Information Hiding


    Simplify and reduce access to a class by hiding details, methods, and members
    that shouldn''t be called and accessed by a client.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_32_0.png)


    In Java, classes and class members are access controlled. This mechanism prevents
    the users of a package or class from depending on unnecessary details of the implementation
    of package or class.


    The access is specified by the access modifiers public, protected or private.
    In the absence of an access modifier, it is the default access, also called package-private
    access.


    The following table and illustration show the access control rules in Java.


    | Visible for: | public | protected | (default) | private |

    | --- | --- | --- | --- | --- |

    | Same Class | yes | yes | yes | yes |

    | Different Class, Same Package | yes | yes | yes | no |

    | Different Class, Different Package | yes | no | no | no |

    | Subclass, Same Package | yes | yes | yes | no |

    | Subclass, Different Package | yes | yes | no | no |


    Visibility in Java


    According to the Java Language Specification (JLS)¹:


    ```

    public

    ```


    A public class member or constructor is accessible throughout the package where
    it is declared and from any other package.


    > ¹https://docs.oracle.com/javase/specs/jls/se15/html/jls-6.html#jls-6.6'
