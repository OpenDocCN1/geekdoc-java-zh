  md: "# 4.4 Unit testing with JUnit 5\n\n# 4.4.1 Unit Tests\n\nBenefits of unit tests:\n\
    \n+   - Changes to the code to be checked immediately\n- Better code quality/stability\
    \ or security\n- Less hesitation before making changes to core components\n- Shorter\
    \ development times, despite additional tests to be implemented\n- Easier refactoring\n\
    - Simplified documentation of the implementation\n\nRequirements for unit tests:\n\
    \n+   - Easy implementation of the tests\n- Fast and automated test execution\n\
    - Thorough analysis of the test results\n\n# 4.4.2 JUnit 5\n\nJUnit 5 is a simple\
    \ Java unit testing framework helping testing on the JVM with a focus on Java\
    \ 8 language features, extensibility, and a modern programming API.\n\nWhat are\
    \ the goals of JUnit 5?\n\n+   - Reduce test creation effort to the absolute minimum\n\
    - Easy to learn and use\n- Avoid redundant work\n- Tests must\n    - be repeatedly\
    \ applicable\n    - can be produced separately\n    - be incremental\n    - can\
    \ be freely combined\n    - be feasible by others than the author\n    - can be\
    \ evaluated by others than the author\n- Enable the use of test data\n    - Reusability\
    \ of test data\n    - Test data generation is usually more complex than the test\
    \ itself"
