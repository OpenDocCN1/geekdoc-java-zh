  md: '# 1.4 Boy Scout Rule


    > Always leave the campground cleaner than you found it.

    -Robert C. Martin*


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_20_0.png)


    Boy Scouts have a rule regarding camping that they should leave the campground
    cleaner than they found it. By ensuring this rule, they can guarantee that they
    do not cause new problems, at least far as the cleanliness of the area is concerned.


    What if we apply this rule to our code?


    The Scout Rule suggests that you simply try to make sure that every time you commit,
    you leave the code better than you found it. This means that every time you make
    a change, you improve the codebase. Maybe slightly. Improve a variable, clean
    up incomplete documentation, extract a large method to multiple smaller ones or
    adding a test.


    Keeping code clean is a constant challenge, and developers and software teams
    must decide if, when, and how they want to keep their code. Resolving these technical
    debts through refactoring is necessary to keep the code in a state where it remains
    economically viable to extend and maintain it.


    When does it make sense to spend time working on improving the code?


    Over time, the quality of the source code on which a system is based tends to
    deteriorate, leading to increasing technical debt. Some teams take the approach
    of postponing all-value work and trying to clean up the codebase. This usually
    results in refactoring sprints or a complete rewrite. Neither of these is a solution
    from a business perspective. Feature development and bug-fixing must continue,
    and refactoring should not take up most of time. According to the Scout Rule,
    teams can improve the quality of their code over time while continuing to deliver
    value to their customers and stakeholders. In this way, continuous improvement
    allows you to move in a corridor where technical debt does not dominate your system.
    Do not let your system exceed a point where the application becomes unmaintainable.
    Thus “Try to leave the world a little better than you found it”.


