    +   - An object should change its external behavior at runtime depending on its
    state.

    - State machines e.g., parser. The functionality of many text parsers is inevitably
    state-based. So, a compiler parsing source code must interpret a character depending
    on the characters read before.

    - Representation of states of network connections


