  md: '# Design Principles


    # 165


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_178_0.png)


    How do we achieve stability? The stable packages are not dependent on anything.
    A change from a dependent cannot spread to them and cause them to change. They
    are independent. Independent classes are classes that do not depend on anything
    else. Another reason why a stable package gets stable is that many other classes
    depend on them. The more dependencies they have, the harder it is to make changes
    to them. If we change classes in the stable package, we would also have to change
    all the other classes that depend on them. So, there is a strong constraint that
    stops us from changing these classes. This fact not changing these classes increases
    their stability.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_178_1.png)


    Stable package depend on unstable package


    If all packages are maximally stable, the system would be unchanging. This is
    not a desirable situation. We want to design our package structure so that some
    packages are unstable, and some are stable. The changeable packages should be
    at the top and depend on the stable packages at the bottom. If we place the unstable
    packages at the top and arrange them in this way, it does not violate the SDP.'
