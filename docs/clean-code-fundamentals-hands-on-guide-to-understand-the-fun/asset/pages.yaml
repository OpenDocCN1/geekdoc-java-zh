  md: '# 5.6.3 Don’t Repeat Yourself / Once and Only Once


    Don''t Repeat Yourself (DRY) is a principle of software development aimed at reducing
    repetition of software development patterns, replacing it with abstractions or
    using data structures. When the DRY principle is applied successfully, a modification
    to any one element of a system does not require a similar change to other logically
    unrelated elements.


    Once and Only Once (OOO) is a similar but more specific software development principle
    which states that for each element of software, there should be only one single,
    unambiguous representation within the system. This can be accomplished by ensuring
    that code is not duplicated, and by abstracting code into modules or functions
    that can be reused.


    +   - To avoid the avoidance of duplicated code, i.e code fragments are implemented
    in the same or very similar way in several places.

    - Redundant existing source code is difficult to maintain, as consistency between
    the individual duplicates must be ensured.

    - In systems that remain only to the DRY principle, however, changes need only
    be made in one place.


    As a programmer, it is important to avoid repeating yourself. This not only saves
    time, but also makes your code more reliable and easier to maintain. When you
    need to make a change, you only have to do it in one place, and the change will
    propagate throughout your code. This is in contrast to Write Everything Twice
    (WET) programming, in which you write code that is duplicated, and you have to
    make changes in multiple places. DRY programming is a more efficient and effective
    way to write code, and it is something that programmers should strive for.


    # 5.6.4 You Ain''t Gonna Need It!


    You Ain''t Need It, also known as YAGNI, is a programming principle that suggests
    programmers should not add features or functionality to a software system unless
    it is absolutely necessary.


    Resist the temptation to add features or functionality that you think might be
    needed in the future, and instead focus on building only what is needed now. This
    may seem like a no-brainer, but in practice it can be difficult to resist the
    temptation to add “just in case” features.


    YAGNI can help keep code clean and maintainable, and can also help to reduce development
    time and costs.


    +   - With no requirement, also no implementation!

    - A program should only implement functionality when that functionality is needed.

    - Contrary to this approach, in practice it is often attempted to prepare programs
    for possible future change requests and features through additional or more general
    code. "...this is what THEY will demand soon..."

    - Such code can be very annoying to read, understand, change existing functionality,
    and costs time and money!'
