  md: '# 3.3 Classes and objects


    Designing Java classes is crucial for creating effective and reusable software.
    Follow these practices when designing Java classes:


    +   - Standard Java Code Conventions: Maintain readability and consistency by
    adhering to the standard Java code conventions. Use proper indentation, naming
    conventions, and comment as necessary.

    - Single Responsibility: Each Java class should have a clear and simple purpose.
    Avoid combining too many responsibilities within a single class, as it can lead
    to confusion and maintenance difficulties.

    - Flexibility and Extensibility: Design classes to be flexible and easily adaptable
    to future changes. Ensure that new features can be seamlessly integrated into
    the existing class without significant modifications.

    - Consistency: Maintain consistency in your class design throughout your project.
    Use consistent naming conventions, coding standards, and design patterns. Consistency
    improves code readability and makes it easier for others to understand and work
    with your code.

    - Principle of Least Astonishment (POLA): Design classes with intuitive and predictable
    behavior. Users should not be surprised by the behavior of the system. Follow
    standard conventions and design principles to minimize unexpected behavior.


    In conclusion, design effective Java classes, keep them small, focused on a single
    responsibility, and use access modifiers wisely.


    According to Clean Code by Robert C. Martin, the following best practices can
    help you write good classes, functions, and variables that are easy to read and
    modify.


    # 3.3.1 Classes


    +   - Use noun or phrase names for classes.

    - Avoid naming classes as verbs.

    - Hide internals and minimize the scope of variables and methods.

    - Follow the Law of Demeter (LoD) - a class should only have knowledge of its
    direct dependencies.

    - Base classes should not have knowledge of their derivatives.

    - Prefer immutability whenever possible.

    - Use dependency injection to decouple dependencies.'
