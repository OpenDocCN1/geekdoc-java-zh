  md: '# 5.5.3 Stable Abstractions Principles


    Abstractness increases with stability.


    +   - Establishes a relationship between stability and abstractness.

    - Packages that are maximally stable should be maximally abstract.

    - Unstable packages should be concrete.

    - The abstractness of a package should be proportional to its stability.


    # Abstractness metric


    The abstractness of a package is the ratio of abstract classes like abstract classes
    and interfaces in a package to the total number of classes in the package.


    ```

    A = Abstractness, 0 ≤ A ≤ 1

    A = 0, completely concrete package

    A = 1, completely abstract package

    ```


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_179_0.png)


    Na = number of abstract classes, interfaces

    Nc = total number of classes


    An abstractness of 0 means that the package has no abstract classes. Abstractness
    of 1 means that the package contains nothing but abstract classes such as interfaces
    and abstract classes.


    # Relationship between Stability (I) and Abstractness (A)


    The relationship between I and A can be defined within a graph with A on the vertical
    axis and I on the horizontal axis. There are two good types of packages on this
    graph, the first Interface packages are maximally stable and abstract at the top
    left (0,1). The second is the Implementation packages that are maximally unstable,
    and concrete at the bottom right (1,0).


    However, not all packages can be classified in one of these two categories. Thus,
    packages have degree of abstraction and stability. Therefore, we must accept that
    there is a line of points on the A/I graph that defines meaningful positions for
    packages. This can be done with the Main Sequence which is a line from (0,1) to
    (1,0). This line represents packages whose abstractness is balanced with stability.
    A packet on the Main Sequence is neither too abstract for its stability, nor is
    it too unstable for its abstractness. It has the right number of concrete and
    abstract classes in proportion to its efferent and afferent dependencies.


    We can infer that no packages should be, the Zone of Pain and the Zone of Uselessness.'
