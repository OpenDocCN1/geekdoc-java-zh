  md: "# 4.5 More on Unit Tests\n\n# 4.5.1 Heuristics\n\nTesting features, not methods\n\
    \n+   - Test cases are based on requirements and features, not on the methods\
    \ to be tested.\n- There is no 1:1 correspondence between the test case method\
    \ and the tested method.\n- Test cases should document how to use the classes\
    \ correctly using examples.\n\nBad code\n\n```\nclass EuroTest {\n  @Test void\
    \ newEuro() {..}\n  @Test void getIntAmount() {..}\n  @Test void getAmount() {..}\n\
    \  @Test void plus() {..}\n  @Test void minus() {..}\n}\n```\n\nGood code\n\n\
    ```\nclass EuroTest {\n  @Test void createFromInt() {..}\n  @Test void createFromString()\
    \ {..}\n  @Test void rounding() {..}\n  @Test void simpleAddition() {..}\n}\n\
    ```\n\n# Testing at the edges\n\n+   - Most algorithmic errors occur at the edges\
    \ of the allowed value ranges.\n- The value range be divided into several samples\
    \ equivalent for the test? At least one sample per equivalence class!\n- What\
    \ is not tested may not work.\n\n# Implementation independence\n\n+   - Tests\
    \ are directed against the public class interface.\n- Tests based on the innards\
    \ of a class are extremely fragile.\n- Wanting access to variables or private\
    \ methods shows that the code still lacks a crucial design idea.\n\n# Orthogonal\
    \ test cases\n\n+   - Test cases are independent of each other if they refer to\
    \ orthogonal aspects."
