    # Advantages:


    +   - **Extensibility and change stability.** Easy integration of new states without
    having to change existing code. Changes to state-dependent behavior only affect
    a class and and not the context.

    - **Comprehensibility.** High cohesion and delegation of responsibilities (the
    behavior of a state is encapsulated/localized in the corresponding state object
    itself) make the code easy to understand.

    - **Explicit state transitions.** By introducing objects for each state, the state
    transition becomes explicit. In addition, inconsistent states are prevented, because
    a state change is an atomic command (setting a variable).

    - The design is **less error-prone** concerning later changes than broad, repetitive
    if-else constructs.


    # Disadvantages:


    +   - **Increased number of classes.** Is less compact than a single class. However,
    the aim of the design pattern is precisely to distribute the behavior of a single
    confusing class to several state objects.'
