  md: "# Design Principles\n\n```\npublic double area() {\n    return this.width *\
    \ this.height;\n}\n```\n\nThe Rectangle class has separate height and width properties,\
    \ and its area method calculates the area based on those properties. Square class\
    \ extends Rectangle and overrides the area method to calculate the area based\
    \ on the height only (as all sides of a square are equal). However, this method\
    \ violates the LSP because a square is not a proper subtype of a rectangle in\
    \ behavior.\n\n# Bad code\n\n```\npublic class Square extends Rectangle {\n  \
    \  @Override\n    public double area() {\n        return this.height() * this.height();\n\
    \    }\\}\n```\n\n# Bad code\n\n```\npublic void do(Rectangle rectangle) {\n \
    \   rectangle.width(5);\n    rectangle.height(4);\n    if (rectangle.area() !=\
    \ 20) {\n        throw new IllegalStateException(\"Error in area calculation!\"\
    );\n    }\n}\n```\n\nThe do method accepts a Rectangle object as a parameter and\
    \ performs some operation. Both Rectangle and Square are subclasses of Figure,\
    \ the do method can not work with either rectangle or a square object affecting\
    \ the correctness of the program.\n\n# Compliant Solution\n\n![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_149_0.png)"
