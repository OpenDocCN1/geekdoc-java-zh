  md: "# Design Patterns of the Gang of Four\n\n# Follower\n\n```\npublic class Follower\
    \ implements Observer {\n    private final String follower;\n    public Follower(String\
    \ follower) {\n        this.follower = follower;\n    }\n    @Override\n    public\
    \ void update(Object message) {\n        System.out.printf(\"%s received message:\
    \ %s\\n\", this.follower, message);\n    }\n}\n```\n\n# Client\n\n```\nclass Client\
    \ {\n    public static void main(String[] args) {\n        Influencer influencer\
    \ = new Influencer(\"Java\");\n        influencer.register(new Follower(\"PHP\"\
    ));\n        influencer.register(new Follower(\"QBasic\"));\n        influencer.register(new\
    \ Follower(\"TypeScript\"));\n        influencer.notifyAllObservers(\"Java rocks!\"\
    );\n    }\n}\n```\n\n# Advantages:\n\n+   - Consistency of condition. Automatic\
    \ adjustment of the observer state when the subject changes.\n- Reusability. The\
    \ Observer Pattern allows subject and observer to be varied independently.\n-\
    \ Easy extension of different observers that observe a single subject.\n\n# Disadvantages:\n\
    \n+   - Update cascades and cycles occur. In complex systems with many subjects\
    \ and observers, update cascades can easily occur because the observers do not\
    \ know about each other and cannot estimate the consequences of a single modification\
    \ to a subject."
