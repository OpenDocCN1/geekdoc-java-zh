  md: '# 4.5.3 Object Mother


    An Object Mother26 is a class that can be used in testing, which allows us to
    provide pre-configured objects for our tests. This example here is rather trivial
    but imagine in a real application with classes having many attributes and/or compositions.


    Most no longer instantaneous objects themselves but go through a factory. In a
    future evolution, if a new mandatory attribute is added to a class, then you must
    do to modify the factory and all the tests will pass.


    The combination of builders allows the objects generated by the Object Mother
    to be customized for the needs of the test. Otherwise, it would be necessary to
    multiply the factories for each need with a method taking in all necessary information
    for the test.


    Classical approach


    ```

    1 User user = new User("user","password","USER")

    2 Authentication auth = new UsernamePasswordAuthenticationToken(user, null,user.authorities);

    ```


    # Object Mother Pattern


    +   1 Authentication user = TestAuthentications.authenticatedUser();

    2 Authentication admin = TestAuthentications.authenticatedAdmin();

    3 Authentication tester = TestAuthentications.authenticated(new User("user","password","TESTER\));


    # Object Mother Pattern implementation


    ```

    1 public final class Authentications {

    2

    3 private static final User USER = new User("user","password","USER\n4 private
    static final User ADMIN = new User("admin","password","USER, ADMIN\n5

    6 private TestAuthentications() {

    7 }

    8

    9 public static Authentication authenticatedAdmin() {

    10 return authenticated(ADMIN);

    11 }

    12

    13 public static Authentication authenticatedUser() {

    14 return authenticated(USER);

    15 }

    16

    17 public static Authentication authenticated(User user) {

    18 return new UsernamePasswordAuthenticationToken(user, null,user.authorities);

    19 }

    20}

    ```'
