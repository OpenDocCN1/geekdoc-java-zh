  md: '# # Preface


    This is a *Forever Edition*. That means that this book will see periodic updates.


    If you purchased this book, thank you very much! Writing a book like this takes
    some hours of effort. Please treat your book as your copy and do not redistribute
    the book without authorization.


    If you find this book useful, I would greatly appreciate purchasing a copy. By
    doing so, you''ll let me know that books like this are useful to you.


    # ## What is the goal of this book?


    Readers of this book will acquire in-depth knowledge and skills for the analysis,
    assessment, and improvement of software quality. You will be able to apply principles,
    patterns, techniques, and tools needed to write clean code.


    Understanding important concepts of software quality in Java projects:


    +   - Best Practices

    - Functional and technological scope

    - Development and programming models

    - Tools


    # ## Learning Objectives:


    +   - Acquisition of knowledge and skills to analyze, assess and improve software
    quality

    - Learning principles, patterns, techniques, and tools

    - Deeping technology knowledge


    # ## Which topics can you expect?


    Software testing is not limited to a specific phase of a project. Already during
    the coding phase or the build process, critical and difficult to find software
    defects can be detected in the source code. The necessary procedures and tools
    are presented in this book.


    Among other things, the following topics will be covered:


    +   - Overview of the basics of software quality

    - Software metrics, metric application in practice

    - Structured design, cohesion, and coupling

    - Overview of Principles, Best Practices, and Code Smells'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'Preface


    +   - Compliance and verification of Java code conventions

    - Static software testing, especially review techniques and static program analysis

    - Ensure software quality with tools such as SonarQube, PMD, SpotBugs, Checkstyle,
    ArchUnit, Taikai and Dependency-Track

    - Software tests with JUnit and Mockito

    - Checking the test code coverage

    - CI/CD

    - Design Principles

    - Design Patterns (GoF)


    # Who should read this book?


    I wrote the book because I want to help developers get experience in clean code
    or improve it. Get them a feeling of what it is about to be a Software Craftsman.
    It is about Professionalism, Pragmatism, and Pride!

    It''s a mindset, where software developers choose to be responsible for their
    careers, learning new tools and techniques, and constantly getting better. The
    journey to Software Craftsmanship is one long.

    That''s why I wanted to share some techniques and practices for improving code
    quality and motivating developers.


    # What you must learn about Software Development yourself?


    +   - Developers are always wrong - only the degree to which different developers
    are wrong in their endless architecture discussions differ!

    - If something can break, it will break - make sure that a project is foolproof!

    - All code is bad - there are only gradual gradations of the defectiveness of
    a piece of software!

    - There is always a bug somewhere - you must search long enough!

    - The most important thing is the customer - and they don''t give a damn about
    the technologies and processes used!

    - Project development on paper does not work - problems are only identified during
    the development process!

    - Less is more - if it is not necessary, leave it out!

    - Only 20% of our work consists of coding - the rest is designing, debugging,
    testing, meetings, discussing, etc.

    - The customer never knows what he wants - everyone has only a vague idea of the
    desired result!

    - Someone has done it before - don''t reinvent the wheel!'
