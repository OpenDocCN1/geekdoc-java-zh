    \ to traffic, there's a delay in landing of Airbus A320\nWright Flight landed\
    \ successfully\n\n# Advantages:\n\n+   * The mediator is the **only object** that\
    \ knows about all other objects.\n* It becomes easier to **change the behavior**\
    \ of object relationships by replacing the mediator with one of its subclasses\
    \ with extended or changed functionality.\n* Moving the dependencies between objects\
    \ out of the individual objects leads to better **reusability** of the objects.\n\
    * Since the objects do not have to refer to each other directly, it is **easier\
    \ to test**.\n* The resulting low coupling makes possible to **change individual\
    \ classes** without affecting other classes.\n\n# Disadvantages:\n\n+   * You\
    \ have to be careful not to create a so-called **god object**, which happens when\
    \ the mediator class becomes too big."
