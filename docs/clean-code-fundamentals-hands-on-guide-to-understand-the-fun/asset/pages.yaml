  md: '# 2.13.4 Feature-Based Layering - Single package


    A better approach would therefore be to divide the application into vertical slices
    according to functional responsibilities and keep the technical layering as well.
    Each module is given responsibility for a clear and separate functional context.
    Instead of coupling a layer, we couple vertically along with a slice. Packaging
    by feature improves coupling and cohesion by keeping all classes in the same package
    or module. This minimizes coupling between slices and maximizes coupling in a
    slice. In the long run, this in slices simplifies code maintenance because it
    is clear which part of the code we do. We can make changes without touching or
    fully understanding the rest of the code. It makes easier to make changes to individual
    parts of the application, improving both maintainability and expandability.


    The concepts of cohesion and coupling are useful and important, but there is another
    point that comes into play in this approach.

    The package and module structure "Package by Feature" help the developer to see
    what it does and what functionality it has. The architecture jumps out at you.
    This is a step toward what Uncle calls Screaming Architecture''.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_48_0.png)


    Feature Based Layering - Single package


    With the single package approach, no-packages are used for the individual horizontal
    layers. This makes it possible to set all classes to package-private and thus
    prevent the use of these outside the package. However, this can affect the clarity
    of large modules.


    Both horizontal and vertical slicing have their use cases, but it is obvious that
    vertical combined with horizontal slicing enables a more modern and adaptable
    architecture.


    This approach makes it possible to reduce the visibility of the classes. They
    can be set to package-private and are therefore only available within the feature
    slices. In the horizontal layering, this was not possible because related classes
    had to communicate across packets, which forces us to make everything public.
    The horizontal layering within a slice is still present. The naming conventions
    *Controller, *Service and *Repository define the layering.


    > *https://blog.cleancoder.com/uncle-bob/2011/09/30/Screaming-Architecture.html'
