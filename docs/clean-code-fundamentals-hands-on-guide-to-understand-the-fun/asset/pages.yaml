    }\n```\n\nAircraftTrafficControlRoom\n\n```\npublic class AircraftTrafficControlRoom\
    \ implements AircraftMediator {\n    private final LinkedList<Runway> availableRunways;\n\
    \    private final Map<Aircraft, Runway> aircraftRunways;\n\n    public AircraftTrafficControlRoom()\
    \ {\n        this.availableRunways = new LinkedList<>();\n        this.aircraftRunways\
    \ = new HashMap<>();\n    }\n\n    @Override\n    public void registerRunway(Runway\
    \ runway) {\n        this.availableRunways.add(runway);\n    }\n\n    @Override\n\
    \    public String allotRunway(Aircraft aircraft) {\n        Runway nextAvailableRunway\
    \ = null;\n        if (!this.availableRunways.isEmpty()) {\n            nextAvailableRunway\
    \ = this.availableRunways.removeFirst();\n            this.aircraftRunways.put(aircraft,\
    \ nextAvailableRunway);\n        }\n        return nextAvailableRunway == null\
    \ ? null : nextAvailableRunway.name();\n    }\n\n    @Override\n    public void\
    \ releaseRunway(Aircraft aircraft) {\n        if (this.aircraftRunways.containsKey(aircraft))\
