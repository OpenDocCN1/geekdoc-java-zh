  md: "# Design Patterns of the Gang of Four\n\n# Output\n\n+   1 Original: Original\
    \ name, Original city\n2 Clone: Original name, Original city\n3 Clone after modification:\
    \ Modified name, Modified city\n4 Original after clone modification: Original\
    \ name, Original city\n\n# ### 6.1.5.3 Example: Person - Copy constructor / factory\n\
    \nAccording to Effective Java clone and java.lang.Cloneable is complex and the\
    \ rules for overriding clone are tricky and difficult to get right.\n\nObject’s\
    \ clone method is tricky. It’s based on field copies, and it’s extra-linguistic.\
    \ It creates an object without calling a constructor. There are no guarantees\
    \ that it preserves the invariants established by the constructors. If that state\
    \ is mutable, you don’t have independent objects. If you modify one, the other\
    \ changes as well. Suddenly, you get random behavior. A better approach is providing\
    \ a copy constructor or copy factory.\n\n# Person\n\n```\npublic class Person\
    \ {\n    private String name;\n    private Address address;\n\n    // Copy constructor\n\
    \    public Person(Person person) {\n        this(person.name(),new Address(person.address()));\n\
    \    }\n\n    public Person(String name, Address address) {\n        this.name\
    \ = name;\n        this.address = address;\n    }\n\n    public String name()\
    \ {\n        return this.name;\n    }\n\n    public void setName(String name)\
    \ {\n        this.name = name;\n    }\n\n    public Address address() {\n    \
    \    return this.address;\n    }\n\n    public void address(Address address) {\n\
    \        this.address = address;\n    }\n\n    // Factory\n    public static Person\
    \ newInstance(Person person) {\n        return new Person(person.name(), new Address(person.address()));\n\
    \    }\n```\n\n> Bloch, Joshua: Effective Java - Third Edition, Item 13"
