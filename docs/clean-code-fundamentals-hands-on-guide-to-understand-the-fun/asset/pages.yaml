    \ a directory and checks if it is a directory.\n// Throw IOException if it does\
    \ not exist.\npublic static void deleteDirectory(File directory) throws IOException\
    \ {\n    if (directory != null && directory.isDirectory() && directory.exists())\
    \ {\n        return;\n    }\n    if (!directory.delete()) {\n        throw new\
    \ IOException(\"Unable to delete directory \" + directory + \".\");\n    }\n}\n\
    ```\n\n+   - Reading the comment properly takes longer than reading the code itself.\n\
    - The comment is certainly no more informative than the code.\n- Neither does\
    \ it justify the code, nor does it state its purpose or reason for existence.\n\
    - The comment is less precise than the code and seduces the reader to accept this\
    \ lack of precision.\n\n# 3.2.2 Misleading comments\n\nBad code\n\n```\n// Deletes\
    \ a directory and checks if it is a directory.\n// Throw IOException if it does\
    \ not exist.\npublic static void deleteDirectory(File directory) throws IOException\
    \ {\n    if (directory != null && directory.isDirectory() && directory.exists())\
    \ {\n        return;\n    }\n    if (!directory.delete()) {\n        throw new\
    \ IOException(\"Unable to delete directory \" + directory + \".\");\n    }\n}\n\
    ```\n\n+   - This comment is redundant and misleading!\n- This method does not\
    \ throw IOException if the directory does not exist. It throws IOException if\
    \ the directory cannot be deleted."
