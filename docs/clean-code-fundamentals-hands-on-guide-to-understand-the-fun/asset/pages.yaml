  md: '# 2.14 Architecture Documentation


    Designing architecture means making decisions! The documentation is a persistent
    and communicative artifact for all decisions. It is taken into account the planning
    of the project and focuses more on non-functional than functional requirements.
    The team works closely together to build a system that meets all requirements.
    Some development will address other than functional requirements. Therefore, the
    work on improving the quality of the system must take up a substantial part of
    the team''s time.


    To give all stakeholders of a system, that requires information about the architecture,
    e.g., the internal structure, crossing concepts, or fundamental decisions of a
    fundamental architecture overview, it is important to provide architecture documentation.


    Arc42 provides a comprehensive but condensed template for describing architectures.
    This template provides unfolded architecture documentation which helps to understand
    the big picture and connects the dots by looking at multiple areas.


    The template is structured as follows and contains 12 structure items'':


    +   1. Introduction and Goals


    Short description of the requirements, driving forces, extract of requirements.
    Three or max five quality goals for the architecture which have the highest priority
    for the major stakeholders. A table of important stakeholders with their expectations
    regarding architecture.


    +   2. Constraints


    Anything that constrains teams in the design and implementation decisions or decisions
    about related processes. Can sometimes go beyond individual systems and are valid
    for whole organizations and companies.


    +   3. Context and Scope


    Delim your system from its external communication partners. Specifies the external
    interfaces.


    +   4. Solution Strategy


    Summary of the fundamental decisions and solution strategies that shape the architecture.
    Can include technology, top-level decomposition, approaches to achieve top-quality
    goals, and relevant organizational decisions.


    +   5. Building Block View


    Static decomposition of the system, abstractions of source code, up to the appropriate
    level of detail.


    +   6. Runtime View


    The behavior of building blocks as scenarios, covering important use cases or
    features, interactions at critical external interfaces, operation and administration
    plus error and exception behavior.


    +   7. Deployment View


    > ^https://arc42.org/

    ^https://arc42.org/overview/'
