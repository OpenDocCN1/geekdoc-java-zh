  md: '# 3.3.2 Functions


    +   - Use verb or verb phrase names for functions.

    - Keep functions as small as possible.

    - Functions should do one thing and do it well - follow the Single Responsibility
    Principle (SRP).

    - Use one level of abstraction per function.

    - Avoid code duplication (Don''t Repeat Yourself - DRY).

    - Functions should have no side effects.

    - Place functions in a downward direction, with higher-level functions calling
    lower-level ones.

    - Use consistent and clear terminology for concepts.

    - Minimize the number of function arguments, ideally zero or one.

    - Avoid using flag arguments - split methods into independent methods without
    flags.

    - `private` functions can have longer and more descriptive names and can be refined
    over time using the Boy Scout Rule.

    - The visibility of a function determines the length of its name - shorter names
    for public functions, longer names for private ones.


