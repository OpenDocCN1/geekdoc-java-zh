    # 2.13.5 Feature-Based Based Layering - Slices before layers


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_50_0.png)


    Feature Based Layering - Slices before layers


    The approach of Slices before layers divides the feature slice into technical
    layers such as web, service, and repository. This makes the technical layers within
    the package easier easier to recognize. This serves mainly the organization of
    the codebase and improves the structure of the code.


