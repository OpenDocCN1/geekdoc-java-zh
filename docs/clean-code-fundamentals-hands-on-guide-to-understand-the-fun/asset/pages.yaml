  md: '# 5.6.5 Separation Of Concerns


    Separation of Concerns (SoC) is a principle to relieve the complexity of a program
    by dividing it into distinct parts, each with a separate concern.


    When done effectively, separation of concerns can make code easier to maintain
    and improve over time. This is because each concern can be isolated and changed
    without affecting the others. This can make code more modular and reusable, and
    less error-prone.


    Overall, separation of concerns programming is a good thing. It can help you keep
    your code organized and make it easier to maintain.


    +   - A component should have exactly one task.

    - Avoid mixing of several responsibilities in e.g. one class.

    - Components become simpler, easier to understand, maintain and have better reusability.

    - The complex tasks of a unit should be self-contained (**high cohesion**).

    - The unit should depend as little as possible on other units (**low coupling**).'
