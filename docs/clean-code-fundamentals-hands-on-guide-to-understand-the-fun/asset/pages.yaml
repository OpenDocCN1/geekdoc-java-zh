  md: '# 6.3 Behavioural


    # 6.3.1 State


    Allow an object to alter its behavior when its internal state changes. The object
    will appear to change its class.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_251_0.png)


