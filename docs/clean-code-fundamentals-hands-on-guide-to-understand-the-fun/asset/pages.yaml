  md: "# 6.1 Creational\n\n# 6.1.1 Singleton\n\nEnsure a class has only one instance,\
    \ provide a global point of access to it.\n\nThe Singleton design pattern ensures\
    \ that there is only one instance of a class. This instance is globally accessible\
    \ and reused throughout the application.\n\n| Singleton |\n| -instance: Singleton\
    \ |\n| +Singleton() |\n| +getInstance() : Singleton |\n\n![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_188_0.png)\n\
    \nSingletons are not created at each request. Only single instance is reused again\
    \ and again.\n\n![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_188_1.png)\n\n# 6.1.1.1\
    \ Example: Lazy loading\n\nLazy loading delays the creation of the Singleton instance\
    \ until it is needed. This approach is thread-safe and ensures that the instance\
    \ is created only when required.\n\nLazy loading\n\n```\npublic final class Singleton\
    \ {\n    private static Singleton instance;\n    private Singleton() { }\n   \
    \ public static synchronized Singleton getInstance() {\n        if (instance ==\
    \ null) {\n            instance = new Singleton();\n        }\n        return\
    \ instance;\n    }\n}\n```"
  merge: -1
  pgno: 188
- img_proc: true
  md: "# 6.1.1.2 Example: Eager loading\n\nEager loading creates the Singleton instance\
    \ at the time of class loading. This approach is simple and thread-safe without\
    \ synchronization overhead.\n\nEager loading\n\n```\npublic final class Singleton\
    \ {\n    private static final Singleton instance = new Singleton();\n\n    private\
    \ Singleton() {}\n\n    public static Singleton getInstance() {\n        return\
    \ instance,\n    }\n}\n```\n\n# 6.1.1.3 Example: Enum singleton\n\nUsing an enum\
    \ to implement a Singleton provides serialization for free and guarantees multiple\
    \ instances. This is the preferred approach as it simplifies the Singleton pattern.²\n\
    \nEnum singleton, is the preferred approach\n\n```\npublic enum Singleton {\n\
    \    INSTANCE\n}\n```\n\n# Advantages:\n\n+   - Easy to use. A Singleton class\
    \ is written quickly and easily.\n- Guarantee that only one instance exists in\
    \ a JVM at a time.\n- Compared to global variables there are several advantages:\n\
    \    - Access control. The Singleton encapsulates its creation and can therefore\
    \ control exactly when and how to access to the Singleton is allowed.\n    - Lazy-loading.\
    \ Singletons can only be created when they are needed.\n\n# Disadvantages:\n\n\
    +   - Problematic destruction. To destroy objects in languages with garbage collection,\
    \ an object must no longer be referenced. This is difficult to ensure with Singletons\
    \ due to the global availability, it happens very quickly that code parts still\
    \ hold a reference to the singleton.\n- Especially in multi-user applications,\
    \ a Singleton can reduce the performance because it represents a bottleneck -\
    \ in the synchronized form.\n- Uniqueness beyond physical limits. Ensuring the\
    \ uniqueness of a Singleton across physical boundaries (JVM) is difficult.\n\n\
    > ²Bloch, Joshua: Effective Java – Third Edition, Item 3"
