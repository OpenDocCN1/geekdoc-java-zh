  md: '# 4.5.4 Test Data Builder


    The Object Mother and Builder patterns each bring their own set of advantages
    to our tests can also be combined to further enhance the readability and maintainability
    of our tests. for a complex object the Test Data Builder Pattern described in
    the book Growing Object-Oriented Software, Guided by Tests is a perfect solution
    for creating test objects.


    Use of a Test Data Builder


    ```

    1 Invoice anInvoice = new InvoiceBuilder().build();

