  md: "# 5.3.4 Interface Segregation Principle\n\nMake fine-grained interfaces that\
    \ are client-specific.\n\n+   - Avoidance of interface pollution and fat interfaces.\n\
    - Instead of interfaces with all possible methods that clients might need, there\
    \ should be separate interfaces that cover the specific needs of each client type.\n\
    - Methods of individual interfaces should have low coupling.\n- Clients should\
    \ not depend on methods that are not needed at all.\n- Distribution should be\
    \ made according to the requirements of the interfaces.\n- Clients must only operate\
    \ with interfaces that can only do what they need.\n- Enables software to be divided\
    \ into decoupled and flexible classes.\n- Future professional or technical requirements\
    \ therefore only require minor changes to the software itself.\n\n# 5.3.4.1 Example:\
    \ MultiFunctionDevice\n\nNoncompliant Code Example\n\n![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_159_0.png)\n\
    \nThe noncompliant code violates the Interface Segregation Principle (ISP). It\
    \ defines a single interface MultiFunctionDevice that includes methods for printing,\
    \ faxing, and scanning. This design forces classes that implement this to implement\
    \ all the methods, even if they don't support or need all the functionality. This\
    \ leads to unnecessary dependencies and potential issues if a client tries to\
    \ call unsupported methods.\n\nBad code\n\n```\npublic interface MultiFunctionDevice\
    \ {\n    void print();\n    void fax();\n    void scan();\n}\n```\n\nThe AllInOnePrinter\
    \ implements this interface and provides implementations for all the methods."
