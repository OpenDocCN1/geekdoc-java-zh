  md: '# 5.3.2 Open Closed Principle


    You should be able to extend a classes behavior, without modifying it.


    +   - Classes that follow the OCP have two essential characteristics:

    - Open to extensions, the behavior of such class can be extended to meet new requirements
    of an existing or even new application.

    - Closed against subsequent modification, no longer need to be modified to serve
    as a basis for new requirements.

    - Functions that perform different actions due to switches are good examples of
    OCP violations. Such functions are never closed against changes because adding
    a new type requires changing the source code of the function.

    - It is more elegant and robust to extend a class group by adding a class to modify
    the existing source code.

    - By using e.g. abstract base classes, software components can be created which
    have a fixed unchangeable implementation, whose behavior can be changed indefinitely
    by inheritance and polymorphism.


