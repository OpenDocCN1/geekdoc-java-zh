  md: "# 2.4 Symptoms of bad design\n\nMany signs can indicate a bad design in architecture.\
    \ Some of these indicators are more obvious than others, but all of them can lead\
    \ to problems down the road if they are not addressed.\n\nOne of the most common\
    \ indicators of a bad design is a high degree of coupling between components.\
    \ Coupling is the degree to which one component depends on another. When components\
    \ are highly coupled, they are more difficult to change without affecting the\
    \ other component. This can lead to a lot of problems when trying to make changes\
    \ to the system later on.\n\nAnother common indicator of a bad design is a lack\
    \ of modularity. Modularity is the degree to which a system is composed of separate,\
    \ independent modules. A good design will have a high degree of modularity, which\
    \ makes it easier to add or remove functionality without affecting the rest of\
    \ the system. A system with a low degree of modularity is difficult to change\
    \ and can be more fragile as a result.\n\nThere are many other common causes of\
    \ bad design, but some of the most include a failure to understand the problem,\
    \ a lack of foresight, and a lack of communication among team members. Often,\
    \ bad design is the result of a rushed or poorly planned project.\n\nSome common\
    \ effects of bad design:\n\n+   - High coupling between components\n- Lack of\
    \ modularity\n- Never-touch-running-code Syndrome\n  - Developers are afraid to\
    \ change code.\n  - Many workarounds, code is developed around it.\n- Changes\
    \ have unknown and undetected side effects.\n- Small change in requirements leads\
    \ to big changes in code\n- Reuse through code duplication (Copy-Paste)\n  - Developers\
    \ change after the places that need to be changed.\n  - The more code the more\
    \ difficult it becomes to keep track of duplicates.\n  - Errors have to be patched\
    \ several times at different places.\n- Cyclic relations between artifacts\n \
    \ - Artifacts that are cyclically coupled cannot be tested individually.\n  -\
    \ Artifacts that are used in different cycles often play several roles, which\
    \ makes them difficult to understand.\n  - Artifacts that are used in different\
    \ cycles cannot be exchanged easily."
