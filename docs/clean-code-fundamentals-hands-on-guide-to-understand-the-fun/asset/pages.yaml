  md: "# 4.4.4.6 assertTimeout()\n\nAssert execution of the supplied executable completes\
    \ before the given timeout is exceeded. This can be useful for testing the performance\
    \ and efficiency of code, and for ensuring that it does not take an excessive\
    \ amount of time to execute.\n\nTimeout\n\n```\n@Test\nvoid timeout() {\n    assertTimeout(Duration.ofSeconds(5),\
