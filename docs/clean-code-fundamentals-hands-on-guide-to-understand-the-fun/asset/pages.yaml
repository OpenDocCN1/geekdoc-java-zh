  md: "# 6.3.5 Chain of Responsibility\n\nAvoid coupling the sender of a request to\
    \ its receiver by giving more than one object a chance to handle the request.\
    \ Chain the receiving objects and pass the request along the chain until an object\
    \ handles it.\n\n![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_271_0.png)\n\nUse cases:\n\
    \n+   - Providing a low coupling between an object that should be handled by potential\
    \ handler objects.\n- Where a request can be handled by more than one object.\n\
    - Processing a request at runtime in dynamically sequential order.\n\n# 6.3.5.1\
    \ Example: Purchase\n\nPurchase\n\n```\npublic record Purchase(double amount)\
    \ {\n}\n```\n\nPurchaseAuthorizeFlow\n\n```\npublic interface PurchaseAuthorizeFlow\
    \ {\n  void next(Employee nextEmployee);\n}\n```\n\nEmployee\n\n```\npublic interface\
    \ Employee extends PurchaseAuthorizeFlow {\n  void authorize(Purchase purchase);\n\
    }\n```"
