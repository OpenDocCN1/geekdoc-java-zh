  md: '# # 5. Design Principles


    # ## 5.1 Goal of Design Principles


    Code must be KISS, DRY and YAGNI!


    +   - Design principles'' should lead to good object-oriented design.

    - Code and architecture smells are been by the violation of accepted design principles.

    - Provide important information on how to fix code and architecture smells.

    - If the violated design principle can be identified, it provides a first indication
    of what a better structure for the system might look like.

    - Have been published and propagated by Robert C. Martin, Bertrand Meyer, and
    Barbara Liskov, among others.


    # ## 5.2 Overview of Design Principles


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_127_0.png)


    **SOLID Principles**


    +   - The acronym SOLID was created by Robert C. Martin for a group of these principles.

    - According to Robert C. Martin, applying these principles leads to higher maintainability
    and thus to a longer service life of the software.

    - Deal with the question of how to combine classes into modules and packages.

    - Lead to high cohesion within modules and low coupling between modules.


    *http://butunelebob.com/ArticleS.UncleBob.PrinciplesOfOod'
