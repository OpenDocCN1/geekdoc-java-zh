  md: '# 3.1.9 Use positive names for boolean variables and functions


    When defining boolean functions, it is best to use positive names that accurately
    describe their intended behavior or state. For example, instead of defining a
    function isNotOpen(), it would be more intuitive and readable to define a function
    named isOpen(). This makes the code more self-explanatory and easier to understand.


    Bad code


    ```

    if (!file.isOpen)

    if (!window.isVisible)

    if (!running)

    if (!hasNoLicense)

    ```


    Here, the functions isIsNot(), isVisible() and the boolean variables notRunning
    and hasNoLicense defined with negative names, which can lead to confusion and
    make the code harder to comprehend. Negated names require extra mental processing
    to understand their actual meaning. It is preferable to use positive names that
    convey the intended behavior more directly.


    Good code


    ```

    if (file.isOpen)

    if (window.isVisible)

    if (running)

    if (hasNoLicense)

    ```


    By using positive names for boolean variables and functions, you create code that
    is more intuitive, easier to understand, and less prone to misinterpretation.
    Positive names improve code readability and reduce cognitive load for developers
    who read or maintain the code, leading to more efficient and error-free programming.'
