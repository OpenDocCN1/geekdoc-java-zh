  md: '# # 1. Introduction to Software Craftsmanship and Clean Code


    # ## 1.1 A Passion for Software Development


    Software Craftsmanship is a long journey to mastery. It''s a mindset where software
    developers choose to be responsible for their own careers, constantly learning
    new tools and techniques and constantly bettering themselves.

    —Sandro Mancuso, The Software Craftsman


    The basis of the Software Craftsmanship movement is the publication of Clean Code
    by Robert C. Martin. The author is a co-founder of the Software Craftsmanship
    movement. There are many initiatives like the Manifesto for Software Craftsmanship
    and the Clean Code Developer movement which raised the bar regarding software
    development - luckily.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_14_0.png)


    Software Craftsmanship focuses on the adoption of good technical practices in
    the development process. It is obvious, that everyone likes Software Craftsmanship.
    Everybody wants a clean code base, but it''s difficult to achieve. Several steps
    should also be done in the right way. The practices defined under the Software
    Craftsmanship movement are the ones that will help you to achieve.


    Software Craftsmanship


    Software Craftsmanship should be the goal you are aiming for. It is not the maturity
    of your project, it is the quality of your software and your codebase as Benjamin
    Franklin said: The bitterness of poor quality remains long after the sweetness
    of life is forgotten.


    Some developers are enthusiastic about their work and have already acquired these
    values to provide quality and kindness to the code. They have the necessary skills
    to realize products according to their values. Unfortunately, many others know
    little or not at all that there is another way to develop software. Even today,
    many development practices that help create well-crafted software are simply not
    taught in schools.


    If you work in an environment where these practices are not applied or there is
    no room for well-crafted software, ask yourself if you can change this. Be a craftsman,
    and spread the professionalism of software development out out to the team with
    the hope that individuals will follow you. Adopt a culture where the values of
    Software Craftsmanship have the appropriate value. Do not rank other developers,
    maybe they have never the chance to work in this way or had never the luck having
    a good mentor. When you have success with this approach, fine. If not, you may
    be in the wrong company for you!'
  merge: -1
