  md: '# Continuous Delivery


    +   - Continuous Delivery is an extension of the CI. It involves the Continuous
    Delivery of developed code to a staging environment as soon as the developer has
    developed it.

    - It includes Continuous Integration, test automation, and deployment automation
    processes that enable fast and reliable software development and deployment with
    minimal manual effort.

    - The core idea is to deliver the code to QA, customers, or any user base so that
    it can be continuously and regularly reviewed.

    - This makes it possible to identify problems early in the development cycle and
    ensures that they can be resolved early.


    # Continuous Deployment


    +   - Continuous Deployment is the next logical step after Continuous Delivery.

    - It is the process of delivering code directly into production once it has been
    developed.

    - With Continuous Deployment, all changes that pass the automated tests are automatically
    transferred to production.

    - Successful implementation requires the automation of Continuous Integration,
    as well as the automation of Continuous Delivery into the staging environment.
    Finally, it also requires the ability to automatically deploy to production.'
