  md: '# 2. Basics of Software Design


    # 2.1 Software Design Pyramid


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_24_0.png)


    Basic concepts of OOD


    The basic concepts of OOD are the prerequisite for this book and will be discussed
    only briefly in the following chapter. However, they are the bases for understanding
    the design principles and design patterns in the later chapters. The language
    specification and features of Java and the implementation of polymorphism, encapsulation,
    abstraction, and inheritance help to understand and implement them.


    Design Principles


    The Design Principles are based on the concepts of the OOD. The best known are
    the SOLID principles of Robert C. Martin. SOLID is an acronym for five Design
    Principles intended to make software designs more understandable, flexible, and
    maintainable. These are explained in detail in this book. Besides these, there
    are many others, which are also described and explained in this book.


    Design Patterns


    The Design Patterns go one step further and offer solution patterns for recurring
    problems. Probably the best known are the GoF Design Patterns, which are covered
    in this book with many examples. Besides the GoF Patterns, there are many more
    which are also worth studying.'
