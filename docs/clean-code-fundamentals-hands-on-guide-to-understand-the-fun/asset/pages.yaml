  md: '# 2.13.3 Horizontal Layering


    The classic horizontally layered architectural pattern is a solid general-purpose
    pattern and therefore a good choice for most applications, especially if you were
    not sure which architectural pattern was best for your application.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_47_0.png)


    Today, however, it is no longer the preferred solution. There are a few things
    to keep in mind when choosing this pattern from an architectural point of view.
    With this pattern, you run the risk of building a monolith. This pattern cuts
    the layers horizontally according to purely technical responsibility. This paradigm
    eliminates low coupling and high cohesion. This is exactly the opposite of what
    we want to achieve.


    The different modules become quickly dependent on other parts of the application
    and are not separated from each other. If an application is structured properly
    according to horizontal layers and not according to features like this Ticket
    and Reservation you end up with a pure layer architecture without a clear division
    into feature-based modules.


    When you look at the package structure you will recognize that almost all classes
    must have a public modifier to access the lower layer. It is certainly not the
    best approach and violates the principle of information hiding.


    package structure - Horizontal Layering


    ```

    com.swcs.controller

    (C) TicketController

    (C) ReservationController

    com.swcs.service

    (C) TicketService

    (C) ReservationService

    com.swcs.repository

    (C) TicketRepository

    (C) ReservationRepository

    ```'
  merge: -1
