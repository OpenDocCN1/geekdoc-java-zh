  md: 'Design Patterns of the Gang of Four


    # # Creational Patterns


    How objects or even class hierarchies can be created?


    | Group | Pattern | Description |

    |---|---|---|

    | Creational | Singleton | Ensure a class has only one instance, and provide a
    global point of access to it. |

    | | Builder | Separate the construction of a complex object from its representation
    so that the same construction process can create different representations. |

    | | Factory Method | Define an interface for creating an object, but let the subclasses
    decide which class to instantiate. Factory Method lets a class differ instantiation
    to subclasses. |

    | | Abstract Factory | Provide an interface for creating families of related or
    dependent objects without specifying their concrete class. |

    | | Prototype | Specify the kinds of objects to create using a prototypical instance,
    and create new objects by copying this prototype. |


    # # Structural Patterns


    What must a composition of classes and objects have to solve a certain problem?


    | Group | Pattern | Description |

    |---|---|---|

    | Structural | Facade | Provide a unified interface to a set of interfaces in
    a subsystem. Facade defines a higher-level interface that makes the subsystem
    easier to use. |

    | | Decorator | Attach additional responsibilities to an object dynamically. Decorators
    provide a flexible alternative to subclassing for extending functionality. |

    | | Adapter | Convert the interface of a class into another interface clients.
    Adapter lets classes work together that couldn''t otherwise because of incompatible
    interfaces. |

    | | Composite | Compose objects into tree structures to represent part-whole hierarchies.
    Composite lets treat individual objects and compositions of objects uniformly.
    |

    | | Bridge | Decouple an abstraction from its implementation so that the two can
    vary independently. |

    | | Flyweight | Use sharing to support large numbers of fine-grained objects efficiently.
    |

    | | Proxy | Provide a surrogate or placeholder for another object to access to
    it. |


    # # Behavioral Patterns


    How do the objects work together at runtime? How is responsibility distributed
    among them?


    | Group | Pattern | Description |

    |---|---|---|

    | Behavioral | State | Allow an object to alter its behavior when its internal
    state changes. The object will appear to change its class. |

    | | Template Method | Define a skeleton of an algorithm in an operation, deferring
    some steps to subclasses. Template Method lets subclasses redefine steps of an
    algorithm without changing the algorithm’s structure. |

    | | Strategy | Define a family of algorithms, encapsulate each one, and make them
    interchangeable. Strategy lets the algorithm vary independently from clients that
    use it. |'
