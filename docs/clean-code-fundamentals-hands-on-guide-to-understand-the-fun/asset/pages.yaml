  md: '# 4.9 Continuous Integration


    Continuous integration describes a process of regular, complete rebuilding, testing,
    and distribution of an application. There are cloud providers like CircleCI and
    Travis CI or local servers like Jenkins CI, GitLab CI, TeamCity and Bamboo CI.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_121_0.png)


    Idea:


    +   - Early and more frequent check-in of changes into the version management
    system.

    - Replacement of large changes with incremental, functional small changes.

    - When changes are checked into the version management system, the entire system
    is rebuilt and automatically tested.

    - Try to give the developer feedback on his changes as soon as possible.

    - Improve quality by replacing the traditional approach to testing with continuous
    testing and rapid feedback.


    Parts and steps:


    +   - Compilation

    - Test execution (Unit tests, Integration tests, Acceptance tests, etc.)

    - Integration (Database, Third-party systems)

    - Static analysis (Code & Architecture)

    - Automatic deployment

    - Generation of documentation


