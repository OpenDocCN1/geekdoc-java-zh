  md: '# 6.3.3 Strategy


    Define a family of algorithms, encapsulate each one, and make them interchangeable.
    Strategy.

    lets the algorithm vary independently from clients that use it.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_262_0.png)


    Use cases:


    +   - For many similar classes that differ only in behavior.

    - For input masks, the logic for validation and plausibility checks of user inputs
    can be encapsulated.

    - Behaviour should also be decoupled from the context if different forms of the
    same function are required

    - Sorting of a collection (Array, List), whereby the concrete strategies represent
    different sorting methods.

    - Storage in different file formats.

    - Parker with different compression algorithms.

    - Decoupling and hiding complicated algorithm details from the context.

    - Multiple branches (if(...) ... else if(...) ... else ...) can be avoided and
    this increases the clarity of the code.


    # 6.3.3.1 Example: Compression


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_262_1.png)'
