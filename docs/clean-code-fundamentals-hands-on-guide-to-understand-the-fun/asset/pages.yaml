  md: '# 2.15 Testing the Architecture and Design


    The architecture of a system usually is a design that was made at a certain moment
    in time, However, as the system evolves and developers come and go, it''s hard
    to keep up to date on a reference architecture or encourage developers to make
    changes to it, since it''s usually in the form of documents, confluence pages,
    or something similar. This can result in code that violates architectural specifications
    increasing the technical debt.


    # IntelliJ*


    IntelliJ comes with a simple tool for architecture analysis. With it, you can
    generate a dependency matrix for your code.


    # Eclipse*


    In eclipse you can install various plugins to visualise dependencies and detect
    cycles. eDepend¹¹⁸, STAN¹¹⁹, jDepend¹¹², Java Dependency Viewer¹¹³


    # ArchUnit¹¹⁵


    With ArchUnit you can check the architecture constraints of your Java application
    automatically and run as part of a test suite. It is a free, simple, and extensible
    library for checking the architecture of Java code, which can check dependencies
    between packages and classes, layers and slices, dependencies, and more.


    # Taikai¹⁵


    Taikai extends the capabilities of the ArchUnit library by offering a comprehensive
    suite of predefined rules tailored for various technologies. It simplifies the
    enforcement of architectural constraints and best practices in your codebase,
    ensuring consistency and quality across your projects.


    # JQAssistant¹*


    JQAssistant is a QA tool, which allows the definition and validation of project-specific
    rules on a structural level. It is built upon the graph database Neo4j and can
    be easily plugged into the build process to automate the detection of constraint
    violations and generate reports about user-defined concepts and metrics.


    # Structure 10¹¹


    With Structure 10 you can understand, analyze, ''drag n drop'' refactor, and control
    a large, complex codebase.


    # Sonararquraph¹⁸


    Sonararquraph is a powerful static code analyzer that allows you to monitor a
    software system for technical quality and enforce rules regarding architecture,
    metrics, and aspects in all stages of the development process.


