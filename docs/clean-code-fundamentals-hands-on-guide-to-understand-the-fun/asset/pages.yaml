  md: '# 5.6 Further Design Principles


    # 5.6.1 Speaking Code Principle


    The Speaking Code principle is a design principle that says that code should be
    written so that it is easy to read and understand. This is important because code
    is often read more than it is written. When we write code, we''re communicating
    with computers, but when we read code, we''re communicating with other humans.
    That''s why it''s important to make sure our code is easy to read. So following
    this principle can also make it easier to work with other people on code projects.


    +   - Code should communicate its purpose, even without comment and documentation.

    - Comments are no substitute for bad code.

    - Clear and expressive code with few comments is much better than messy and complex
    code with numerous comments

    - Instead of spending time writing comments that explain the chaos, spend cleaning
    up the chaos.

    - Comment must be adjusted when code is changed.

    - Using of whitespaces and consistent formatting.


    Bad code


    ```

    if ((bike.type & TY_FLAG) && bike.status == READY) { ...

    ```


    Good code


    ```

    if (bike.isRentaable()) { ...

    ```


    # 5.6.2 Keep It Simple (and Stupid!)


    No one is in a position to manage complexity. In software, not in any aspect of
    life. Complexity is the killer of good software and freedom is the enabler. Simplicity
    is something that takes a lot of time to recognize and produce. Of course, many
    rules can be followed.


    An example would be to have methods with only a few parameters. In the best case,
    or only one. We can write "Keep It Simple (and Stupid)" contains "Simple" and
    without reading any documentation, everyone will immediately understand what this
    does and why. The method does one thing and not more. There is no complicated
    context and no other arguments can be passed to the method. There are no special
    cases or any caveats


    +   - Means that the simplest solution of a problem should be chosen.

    - Avoid code that is too complex and therefore too complicated.

    - Finding simple solutions is a rule that helps to avoid various errors.

    - A healthy rejection of non-simple solutions is a sign of searching for good
    code.

    - The more difficult code is to explain, the more likely it is that it is more
    complicated than necessary and is not the most elegant solution.

    - Make things as simple as possible, but not simpler!'
