  md: '# 1.3 Clean Code Developer


    The Clean Code Developer (CCD) is an initiative for more professionalism in software
    development. CCD defines a collection of principles and practices. These are divided
    into different degrees. However, it also includes a collection of specific values,
    such as evolvability correctness, production efficiency and continuous improvement.


    Through constant iteration of the different degrees, these principles and practices
    are becoming part of the way we act. This creates an awareness of quality within
    the development process. Those who practice daily will be able to intuitively
    retrieve this knowledge


    Below you can see an overview of the degrees of the CCD system, the iterative
    cycle goes through. The degrees build on each other in terms of difficulty and
    benefits. A developer who has not yet started with CCD owns the black grade. A
    black grade only indicates the not interest in CCD.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_18_0.png)


    Clean Code Developer Grade Cycle


    Clean Code Developer Grades


    | Grade | Principles | Practices |

    | --- | --- | --- |

    | Red | Don''t Repeat Yourself (DRY)<br>Keep it simple, stupid (KISS)<br><br>Beware
    of Optimizations<br>Favor composition over inheritance | Using a Version Control
    System<br>Refactoring Patterns Rename and Extract Method<br>Boy Scout Rule<br>Root
    Cause Analysis<br>Daily Reflection |


    | One level of abstraction Single Responsibility Principle (SRP) Separation of
    Concerns (SoC) Source Code Convention | Issue Tracking Automatic Integration Tests
    Read, Read, Read Reviews |

    | Yellow Information hiding | Attend Conferences |


    https://clean-code-developer.com/'
