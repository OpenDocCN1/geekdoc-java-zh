  md: "# 6.3.9 Mediator\n\nDefine an object that encapsulates how a set of objects\
    \ interact. Mediator promotes loose coupling by keeping objects from referring\
    \ to each other explicitly, and it lets you vary your interaction independently.\n\
    \n![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_293_0.png)\n\nUse cases:\n\n+   - Many\
    \ objects communicate in well-defined but complex ways. The resulting dependencies\
    \ are unstructured and difficult to understand.\n- Reusing an object is difficult\
    \ because it interacts and communicates with many other objects.\n- A behavior\
    \ that is distributed across several classes should be changeable without much\
    \ subclassing.\n\n# 6.3.9.1 Example:  Chat\n\nChatMediator\n\n```\ninterface ChatMediator\
    \ {\n    void sendMessage(User user, String message);\n    void addUser(User user);\n\
    }\n```"
