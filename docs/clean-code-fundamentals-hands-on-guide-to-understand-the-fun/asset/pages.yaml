    \n@Test\n\n```\nclass TestAnnotationTest {\n@Test\nvoid simple() {\n    Collection<Object>\
    \ collection = new ArrayList<>();\n    assertTrue(collection.isEmpty());\n}\n\
    @Test\nvoid lambdaExpressions() {\n    assertTrue(Stream.of(1, 2, 3)\n       \
