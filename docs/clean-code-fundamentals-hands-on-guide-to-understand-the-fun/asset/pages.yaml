  md: "# 4.4.6 Assumptions\n\nAssumptions²¹ are used to perform tests only if certain\
    \ conditions are met. This is typically used for external conditions that are\
    \ necessary for the test to run properly. If the condition does not apply, the\
    \ method is exited.\n\n# 4.4.6.1 assumeFalse()\n\nIs used to skip a test if a\
    \ given condition is false.\n\nassumeFalse()\n\n```\n#Test\nvoid falseAssumption()\
    \ {\n    assumeFalse(5 < 1);\n\n    assertEquals(7, 5 + 2);\n}\n```\n\n# 4.4.6.2\
    \ assumeTrue()\n\nIs used to skip a test if a given condition is true.\n\nassumeTrue()\n\
    \n```\n#Test\nvoid trueAssumption() {\n    assumeTrue(5 > 1);\n\n    assertEquals(7,\
    \ 5 + 2);\n}\n```\n\n# 4.4.6.3 assumingThat()\n\nIt can be used to skip a test\
    \ if certain conditions are not met.\n\nassumingThat()\n\n```\n#Test\nvoid assumptionThat()\
    \ {\n    String message = \"Just a assumption test\";\n\n    assumingThat(\n \
    \       \"Just a assumptionThat test\".equals(message)\n        -> assertEquals(2\
    \ + 2, 4)\n    );\n}\n```\n\n> ²¹https://junit.org/junit5/docs/current/api/org.junit.jupiter.api/org/junit/jupiter/api/Assumptions.html"
