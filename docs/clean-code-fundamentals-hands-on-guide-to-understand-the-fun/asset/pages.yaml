  md: '# 6.3.4 Observer


    Define a one-to-many dependency between objects so that when one object changes
    state, all its dependents are notified and updated automatically.


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_267_0.png)


    Use cases:


    +   - When changing an object makes it is necessary to modify one or more objects.

    - GUIs (user changes data, new data must be updated in all GUI components).

    - MVC patterns (Model-View-Controller) in view-model communication.

    - Every second of a timer pulse, both the digital clock and the analog clock must
    be updated.

    - Objects should notify other objects without knowing more about the object to
    be notified.

    - Enables loose coupling of objects.


