  md: "# 5.3.3 Liskov Substitution Principle\n\nDerived classes must be substitutable\
    \ for their base classes.\n\nLet q(x) be a property value over objects x of type\
    \ T. Then q(y) should be true for objects of type S, S is a subtype of T.\n\n\
    +   - In a clean OOD, the derivation relationship between superclass and subclass\
    \ represents a so-called is relation. ie object of the subclass is compatible\
    \ with a superclass object and can be used where a superclass object is required.\n\
    - This ensures that superclass type operations applied to a subclass are performed\
    \ correctly.\n- In this case, it is always safe to replace a superclass-type object\
    \ with a subclass-type object.\n- When inheriting, do not pay attention to the\
    \ data but also consider the behavior of the methods of a class.\n\n# 5.3.3.1\
    \ Example: Rectangle\n\nNoncompliant Code Example\n\n![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_148_0.png)\n\
    \n```\npublic class Rectangle {\n    private double height;\n    private double\
    \ width;\n\n    public double height() {\n        return this.height;\n    }\n\
    \n    public double width() {\n        return this.width;\n    }\n\n    public\
    \ void height(double height) {\n        this.height = height;\n    }\n\n    public\
    \ void width(double width) {\n        this.width = width;\n    }\n}\n```\n\nBad\
    \ code"
