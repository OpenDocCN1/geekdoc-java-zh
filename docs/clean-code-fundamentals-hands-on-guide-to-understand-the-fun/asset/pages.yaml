  md: '# 5.4 Packaging Principles - Cohesion


    CRP (Common Reuse Principle)

    USER


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_171_0.png)


    # 5.4.1 Release Reuse Equivalency Principle


    The granule of reuse is the granule of release.


    +   - The elements of reuse are the elements of the release.

    - Classes that are reused should be in the same package so that they can be released
    together.

    - Reducing the number of modules to be distributed, which in turn reduces the
    effort of software distribution.

    - Avoidance of version conflicts during reuse, which can only arise from the simultaneous
    release of several packages.

    - The users of classes, in turn depend on other classes, want to rely on a collective
    release of new versions.


    # 5.4.2 Common Closure Principle


    Classes that change are packaged together.


    +   - All classes in a package should be closed to the same type of changes according
    to the open closed principle.

    - Corresponds to the single responsibility principle applied to packages.

    - Changes to the requirements of the software that requires changes to a class
    of a module should only affect the class of the module.

    - Compliance with this principle allows the software to be broken down into packages
    in such a way that future changes can be implemented in only a few modules.

    - This ensures that changes to the software can be made without major side effects
    and thus relatively inexpensive.'
  merge: -1
