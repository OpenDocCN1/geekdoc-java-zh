  md: '# 2.13.6 Feature-Based Layering - Hexagonal Architecture


    ![](img/9fb5c4b28a508e4c7ac0d3d85a51babf_51_0.png)


    # Feature Based Layering - Hexagonal Architecture


    The hexagonal architecture¹, or port and adapter architecture, is an architectural
    pattern used in software design to create large applications. It is designed to
    create loosely coupled components by using ports and adapters.


    This architectural style can also be applied to code within a module. The principle
    behind it is that the domain logic is centrally encapsulated. The interaction
    with the user and server-side is a database. The user can use an API or a web
    interface. The server-side always depends on the domain core and the other way
    around.


    In the example, the service package defines the interfaces like TicketRepository
    for the actual access to the database. The actual implementation of the interface
    TicketJdbcRepository is located in the package structure - Feature Based Layering
    - Hexagonal Architecture in the direction of the domain package.


    ```

    com.swcs.ticket.web

    (C) TicketController

    com.swcs.ticket.service

    (C) TicketService

    (I) TicketRepository

    com.swcs.ticket.repository

    (C) TicketJdbcRepository


    com.swcs.reservation.web

    (C) ReservationController

    ```


    > https://alistair.cockburn.us/hexagonal-architecture/'
