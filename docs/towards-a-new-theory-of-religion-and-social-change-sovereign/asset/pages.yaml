    and absolutely unique and therefore Divine. In this purely empirical and value-free
    sense charisma is indeed the specifically revolutionary force in history. (Weber
    1978: 1117)


    The narrative of modernity mapped out by Weber envisioned the increasing subordination
    of social life to the calculations of instrumental reason and posed the unfettered
    experience of charisma – as the only potential source for creativity and liberation
    able to shatter the confines of the cage of instrumental rationality. This narrow
