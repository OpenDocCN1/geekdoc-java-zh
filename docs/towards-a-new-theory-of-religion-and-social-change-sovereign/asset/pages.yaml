- img_proc: true
  md: 'If methodological animism and fetishism, assemblages and generative interactivity
    constitute a point of departure for the study of religion and social change, what
    of religion? ‘How do we make a disabling term,’\ asks David Chidester, ‘which
    bears ... [a] legacy of ambiguity, colonialism, and imperialism, an enabling vortex
    for thinking?’ (Chidester 2018: 1). One way forward might be to think of religions
    in terms of flows and flows. Indeed, if the temporarness of religious forms is
    foregrounded then the focus of analysis can be concentrated at the moments of
    hardening and coagulation on the one hand, and at the moments of disintegration
    and dispersal on the other as a means of capturing fleetingly – the becomes and
    unbecomings of religions. There is already interesting research being conducted
    in this area (for example, Coggins 2018; Robertson 2017; Stewart 2017; Thomas
    2019; Wanliss 2019) is opening up what can be thought of as religions precisely
    by complicating the boundaries of the term and by attending to the points at which
    religious forms harden and the points at which they melt, break down and begin
    to flow and take on new shapes (see also Gilhus and Sutcliffe 2013: 260 and compare
    with Bruce 2002: 199–203).


    It might be argued that form and flow is nothing new. After all, much of the history
    of the study of religions has been precisely concerned with a temporal procession
    of religious and social forms. The late nineteenth and early twentieth-century
    fascination with evolutionary and developmental narratives of progress postulated
    successions of forms of religion and institutions such as marriage and the state,
    evolving through time. Animism, pre-animism, fetishism, magic and totemism were
    all contenders for the original form of religion, each imagined in terms of simple
    constellations of beliefs and practices that would be replaced by sequentially
    more advanced and increasingly complex arrangements. But these were forms already
    fixed and written by the hidden hand of Reason, set to appear and disappear on
    cue each stage of human history was reached and surpassed.'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'As this temporal procession of forms gave way to a kind of patch-work quilt
    juxtaposition of forms with the triumph of culturalism, the question of change
    was either not asked at all or simply referred back to a default narrative of
    evolution-lite, that is, as disenchantment, secularization and so forth. Either
    way, these forms – constituted within evolutionary or cultural imaginaries – were
    always and everywhere to be fixed, stable and coherent. What is emphasized in
    these pages are the flows of religions and the interactions from which new religious
    and social forms become and take shape.


    The idea of forms and flows requires a further, spatial framing which consequently
    politicizes the analysis. Religions move or flow from one space into another,
    and these flows or movements are political to the extent that they presuppose
    borders, laws and states – sovereities if you will – well as wanderings, smugglings
    and disruptions. Indeed, they imply processes of sedimentation, coagulation and
    decomposition where solid forms break down and where liquids harden or ossify
    (compare with Tweed 2006) and might, on a political spectrum, compare to authoritarian
    and anarchist social forms. If I have written so far evokes the writings of Deleuze
    and Guattari it would be remiss of me not to acknowledge that there are numerous
    critiques of Deleuze and Guattari’s work and one of the most serious, I think,
    is the charge that the privileging of flow and becoming constitutes an evasion
    of the political:


    The incessant flux of assemblage thinking ... has the effect of reducing all historical
    struggles to abstract becoming. This move to abstraction empties them of their
    historicalities, evacuates their meaning and their political force. Because it
    is also a universalising move, it undermines any possibility of alliance because
    it effaces difference in its specificity and thwarts any capacity to negotiate.
    Furthermore, in flattening difference, it effectively equates all minoritarian
    subject positions and so fails to provide any critical resources to read struggles
    in relation to each other,'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# 10 TOWARDS A NEW THEORY OF RELIGION AND SOCIAL CHANGE


    or to any political ethic beyond that of dispersion of power. (Conway, Osterweil
    and Thorburn 2018: 7; italics in original)


    If politics and political struggle seem distant to the field of religion and social
    change, it is nevertheless the case that the historical and ethnographic examples
    developed in the pages that follow are deeply saturated by struggles against racial,
    ecological, gendered, political and economic forms of injustice. Importantly,
    neither religion nor the study of religion occupies some space above, beyond or
    outside the political and I hope that, in the pages to come, I am able to argue
    convincingly that thinking with flow and without the subject enables a deeper
    grasp of the political rather than its disavowal.


    Approaching religion and social change in terms of methodological animism, assemblages,
    generative interactions, flows and spaces do not enable the discernment of the
    direction of change – it is not a theory with a predictive dimension. It is a
    rejection of subject-centered accounts of religion and social change inspired
    by Deleuze and Guattari’s account of ‘nomad’ or ‘minor’ science and ‘royal’ or
    ‘major’ science (2014: 420–36). The spatial register of the ‘nomad’ is of course
    significant: the sovereign territory of royal science is traversed in a certain
    way to produce a certain point of view (see Scott 1998). Royal science, after
