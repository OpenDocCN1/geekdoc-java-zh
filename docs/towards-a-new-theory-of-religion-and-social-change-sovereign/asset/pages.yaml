    Of course the problem with change is that it has neither beginning nor an end.
    However it is approached, it inevitably seeps away in every direction, undermining
    any vantage point. Just as there can be no beginning point for the study of change
    so can be no end to it either. Change is everywhere, and isolating it for analysis
    can only be a highly artificial and speculative endeavour. It cannot be carried
    out according to the Cartesian principle of breaking the problem down into tiniest
    constituent part in order to find direct, distinct and specific causalities, as
    will only ultimately disaggregate and disconnect elements that, precisely because
    the object of study is change, must be viewed together. If elements need to be
    viewed holistically as connected along myriad agentive and fibrous tissues and
    threads, there arises the question of the spatial scale of the phenomenon being
    investigated (does it span, for example, local, national and global interactions?)
    and its temporal duration (change is inevitably temporal but appears to flow infinitely
    in all directions, rippling sideways, backwards and forwards, thus requiring the
    artificial isolation of units or snapshots of concentrated time). The idea of
    the assemblage at least has the virtue of enabling the analysis of a manageable
    of of elements with empirically specifiable spatial and temporal scale. Each assemblage,
    be sure, when taken by itself, reveals little about change. But, by making use
    of the assemblage as a kind of map and by comparing and overlaying assemblages,
    I show how religious and social change proceeds not as the result of actions by
    human agents nor in terms of any speculative teleology, but rather in terms of
    the agency of assemblages of human and non-human elements in their energized flows
    and generative interactions.'
