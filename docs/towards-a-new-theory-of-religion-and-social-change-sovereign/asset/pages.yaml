  md: '# # Introduction


    The study of religions has long been dominated by modernity’s double lens of reason
    and experience. Each lens entails fairly specific, methodological commitments
    tied in turn to particular definitional latitudes. For the lens of reason, religions
    are beliefs, concepts, views and ideas, best studied in terms of a realist epistemology
    recursively bound to the opposition of the natural to the supernatural. Accordingly,
    religions are cast as distorted representations of a real world, and those representations
    are destined to wither away as the operational or instrumental efficacy of ones
    arrived at, and continuously modified by processes of secular-scientific experiment
    and debate, become pervasive. For the lens of experience, by contrast, religions
    are practices, embodied emotions and affects where the emphasis lies on a hermeneutic
    and theology of moments, events and singularities tied recursively to a notion
    of the sacred as an opening or a rupture – occasioned by madness, possession or
    norm-bending effervescence – that radically de-structures the ordinary world to
    reveal something Other.


    Each lens constitutes both a distinct vision of what religion is and a bundle
    of methodological procedures and rules for studying it. Furthermore, both are
    at work in the sociology of religion’s two most cherished paradigms, the secularization
    thesis and the lived religion thesis. Each thesis seeks to model processes of
    religious and social change. The former has spawned numerous critiques and variants
    from the original, unilinear model of the decline'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'institutional religions in modernizing societies, including multilinear, oscillation
    and post-secular models; has crushed numbers and been informed by ethnographic
    studies, the best of which take seriously the idea that modernity is multiple
    and not everywhere the same, and its effects on religions are, as such, far from
    Uniform (Eisenstadt 2000). Nevertheless, at its core is a fundamental opposition
    of religion to the secular, the assumption that religion can be measured by recording
    (quantities of) expressions of doctrinally correct belief in populations and finally
    that such expressions will wither within modernizing societies. The lived religion
    thesis has also generated variants: religion is implicit, vernacular and liquid,
    its institutional dimensions de-emphasized in favour of the spontaneous and the
    improvised. Focus is the ethnographic description of religious lives which are
    revealed not as bearers of orthodoxy or carriers of the theoretically correct
    beliefs but are messy, intractable and characterized by processes of mixing and
    improvising, with whatever bits and pieces of religions and cultures come to hand.


    The theses form a complementary pair: one stressing religious decline; the other,
    religious production or creation. They are the field’s defining accounts of religion
    and social change and, despite their different assumptions and conclusions, they
    nevertheless share the rational choice-making, meaning-endowing, individual human
    subject at their core and as a common site of analysis. The imaginary of a unitary
    subject as a site of belief and meaning and as a locus of action, underpin social-scientific
    accounts of religion: secularization is measured, after all, in the responses
    of this subject to interviews and questionnaires concerning questions of belief.
    Likewise, lived religion claims the innovative and even heroic powers of this-self,
    phenomenologically authentic individual to renew himself in a continuous process
    of religious (and neo-liberal) auto-creation.


    As disciplinary approaches to the question of religion and social change they
    are of perfectly valid, but what would the question of religion and social change
    look like if a non-, anti- or post-humanist point of departure was'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'adopted instead? This book outlines an answer disrupting the sovereignty of
    the individual, human subject by situating it in a finely grained and thoroughly
    living, moving world of assemblages of human and non-human elements including
    (potentially) cities, the dead, ideas, institutions, monuments, mountains, radio
    and television, all of which, alongside the human, will be treated equally and
    without favour or special privilege (Harman 2018).


    I take the idea of the assemblage to imply the spatial arrangement of ''heterogeneous,
    contingent, [and] unstable'' (Collier and Ong 2005) elements. To be clear, an
    assemblage is not a map or a diagram of a static if complex network but, rather,
    a complex and contingent articulation of human and non-human elements that actually
    generates, fabricates and produces new assemblages and, as such, is always on
    the move. An assemblage is ''a principle of connections'' (Latour 2015: 13) with
    a generative approach that is distributed among its human and non-human parts.


    Of course, thinking without the subject and with the non-human is not new but
    in recent years it has taken a new turn, away structuralist and Habermasian critiques
    of the subject and subject-centred reason and towards a certain vitalism, and
    a recycling of the language of the nineteenth-century anthropology of religion
    notably (though not exclusively) pertaining to animism and fetishism. Both of
    these terms were, in the late nineteenth century, rival theories for the origins
    of religion, and implied constellations of beliefs about the animacy or liveness
    of objects and things. Importantly, their value is not as indicators of beliefs
    but as principles of method: Arjun Appadou’s ''methodological fetishism'' (1986:
    5) and Félix Guattari’s ''animist'' subjectivity (Melitopoulos and Lazzarato 2012)
    – like Bruno Latour’s (2010) notion of the ‘factish’ (a contraction of fact and
    fetish) and his claim that ''we cannot make a place for objects without modifying
    … the social sciences, and without accepting a certain dose of fetishism (Latour
    1996: 236) – suggest a set of methodological assumptions about the real and the
    kinds of theories that might be deployed for understanding it (see also Haraway
    2018). What these'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'terms do encourage an approach to religious and social worlds that does not

    begin with stable and immutable things and objects such as religion, class or

    society. Instead they offer flux, flow and transformation.


    If there is a master science for studying religion and social change without

    t subject it derives as much from postmodern sources and the new

    materialism – both of which have been accused of trying to do away with the

    subject – as the new, quantum sciences. Manuel Castells has suggested

    sociologists need to look beyond their discipline for methodological

    techniques through which to explore new ways of conceiving the social field:


    We have an expanding field of the new mathematics of complexity based

    on notions such as fractals, emergent properties, autopoietic networks, and

    the like. Most of these mathematical discoveries remain confined to formal

    exercises with slight relationship to empirical research. But they are tools

    ready to be used, transformed, and perfected by able researchers with both

    the knowledge of the tools and the substantive knowledge to make sense of

    this formal language. (Castells 2000: 698)


    In this spirit, Philip Ball (2004) has explored the extent to which ‘physics

    is finding its place in a science of society’ (2004: 3). If, in Newtonian physics,

    change boiled boiled down to a strict causality – two particles collide like billiard

    balls to produce predictable, causal effects – the new, quantum physics

    privileges complexity, self-organization and emergence. No master algorithm

    or universal equation is sought, though that may have been Comte’s vision

    for his ‘social physics’ (Comte 1998: 158). Rather, new concepts, methods

    and vocabulary offer new imaginaries for thinking about social and religious

    forms and how they change, from phase transitions to non-equilibrium

    bifurcations – terms which describe multiple interactions of elements and the

    tipping points between different states (compare with Tilly and Tarrow [2015]

    on repertoire transition, political protest and social change). One could begin'
