  md: '# INTRODUCTION


    with an historical example such as the 1789 French revolution, where one might
    want to plot the tipping point at which a solid, institutionalized religion (the
    Catholic Church in France) lost its structural integrity such that, by the 1830s
    and 1840s, a panoply of previously unthinkable religious experiments had either
    been tried or were underway from the Cult of Reason to the Supreme Being, to the
    Religion of Newton, the Sacred College of Saint-Amand Bazard and Barthélemy-Prosper
    Enfant, and the Icarians, and the Religion of Humanity. It could be argued that
    the heat of the revolution had excited the vibrant particles of eighteenth-century
    French culture and society to such an extent that old interactions began to generate
    new things which, in turn, because those new things had been introduced and added
    to the mix, set off new interactions ... you get the idea. It does not matter
    that none of the experiments listed above survived for very long the cumulative
    effect of those experiments was sufficient to re-wire the constitution of both
    the Catholic Church in France and French society more widely.


    According to Carlo Rovelli, in quantum physics and chemistry, when two particles
    interact, something new is generated through that interaction:


    > We have arrived very far from the mechanical world of Newton and Laplace, where
    minute cold stones travelled on long precise trajectories in geometrically immutable
    state. Quantum mechanics and experiments with particles have taught us that the
    world is a continuous, restless swarming of things; a continuous coming to light
    and disappearance of ephemeral entities ... A world of happenings, not of things
    ... There is no longer space which ''contains'' the world, and there is no longer
    time ''in'' which events occur. There are only elementary processes wherein quanta
    of space and matter continually interact with each other. (Rovelli 2014: 31, 42)


    When hydrogen and oxygen interact, water is formed. Significantly, water is a
    liquid while hydrogen and oxygen are both gases (DeLanda 2011). Does'
