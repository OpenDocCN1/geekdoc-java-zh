    # Durkheim, totemism and the energies of things


    In The Elementary Forms of the Religious Life (1915) – a study of Australian,
    so-called aboriginal religion that is usefully read alongside E. B. Tylor’s Primitive
    Culture (Tremlett, Sutherland and Harvey 2017: 2) – Durkheim focuses on ritual
    and, in doing so, develops a highly original and influential theory of religion.
    According to Durkheim, the ‘primary object’ of religion is ‘not to give man a
    representation of the world’ as Tylar had claimed. Rather, Durkheim frames religion
    as ‘a system of ideas with which the individuals represent themselves the society
    of which they are members and the obscure but intimate relations which they have
    with it’ (1915: 225). These ‘obscure but intimate relations’ are organized symbolically:
    the totemic elite individuals who come to feel that they are acted upon some external
    force. However, this external force is not any religious being or power, but society
    itself metaphorically represented by the totem, the ‘flag’ or ‘emblem’ of their
    society (1915: 206).


    According to Durkheim, aboriginal social life is marked by two distinct phases:
    in the first, small groups engage in subsistence activities largely independently
    of one another. In the second phase, these previously dispersed groups concentrate
    for the purposes of celebrating a religious rite. Durkheim characterizes the first
    phase of hunting and gathering as ‘mediocre intensity’'
