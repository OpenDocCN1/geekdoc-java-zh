    # Occupy Democracy


    On the afternoon of Friday 17 October 2014, activists gathered in Whitehall, London,
    for what was planned as a week-long occupation of Parliament Square. A general
    election was on the horizon (it was held on 7 May the following year) while 15
    October was the anniversary of the establishment of the Occupy London camp near
    St Paul''s Cathedral in 2011 and indeed the occupation of over 900 urban sites
    in eighty countries by the wider Occupy movement on the same day.


    Occupy Democracy can be situated within the recent history of the so-called Global
    Justice Movement that has sought to contest neo-liberalism, a form of capitalism
    that is characterized, by the Global Justice Movement, in terms of the socialization
    of risk and the privatization of profit (Mertes 2010: 78). In the UK, for example,
    the official solution to the 2007–8 global financial crisis was found, by national
    political elites, in the use of public money to bail out the stricken banks. The
    solution effectively meant that the pursuit of private profit by global banks
    and other financial institutions would thereafter be underwritten by the British
    public. The legitimacy of this course of action was found in a discourse of austerity
    which re-framed the global crisis into an instance of national propagly (too much
    money had been frittered away public libraries and benefits for the out of work
    and the disabled) that could only be addressed through collective belt-tightening.
    Of course, the belt-tightening was hardly collective at all: the rich prospered
    at the expense of everyone else, while libraries closed and deprivation and inequality
    exploded.'
