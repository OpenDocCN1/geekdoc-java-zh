  md: '# Bloomsbury Studies in Religion, Space and Place


    Series editors: Paul-François Tremlett, John Eade and Katy Soar


    Religions, spiritualities and mysticisms are deeply implicated in processes of
    place-making. These include political and geopolitical spaces, local and national
    spaces, urban spaces, spaces and virtual spaces, contested spaces, spaces of performance,
    spaces of memory and spaces of confinement. At the leading edge of theoretical,
    methodological and interdisciplinary innovation in the study of religion, Bloomsbury
    Studies in Religion, Space and Place brings together and gives shape to the study
    of such processes.


    These places are not defined simply by the material or the physical but also by
    the sensual and the psychological, by the ways in which spaces are gendered, classified,
    stratified, moved through, seen, touched, heard, interpreted and occupied. Places
    are constituted through embodied practices that direct critical and analytical
    attention to the spatial production of insides, outsides, bodies, landscapes,
    cites, soverealities, publics and interiorities.


    # Global Trajectories of Brazilian Religion,


    edited by Martijn Oosterbaan, Linda van de Kamp and Joana Bahia


    # Religion and the Global City,


    edited by David Garbin and Anna Strhan


    # Religious Pluralism and the City,


    edited by Helmuth Berking, Silke Steets and Jochen Schwenk'
