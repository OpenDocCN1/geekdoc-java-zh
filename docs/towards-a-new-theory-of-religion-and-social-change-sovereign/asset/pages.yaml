  md: '# PREFACE AND

    ACKNOWLEDGEMENTS


    This book draws from two distinct research projects. Most recently I was involved
    in the REDO (Re-Assembling Democracy: Ritual as Cultural Resource) project, an
    international research initiative led by Jones Salomonsen and funded by the Norwegian
    Research Council. For my part, I conducted fieldwork with Occupy activists in
    London and Hong Kong. In Hong Kong, the work involved reconstructing the protest
    from the accounts of activists, whereas in London it involved documenting further
    protests and events that continued to be organized by Occupy groups, after the
    global wave of anti-capitalist revolt of 2011 had subsided. Before that, my Arts
    and Humanities Research Board (now the AHRC)-funded doctoral research and a subsequent
    research project generously funded by the British Academy''s Southeast Asia Committee
    allowed me to work on alternative religities gathered around an extinct volcano
    some south kilometres of Manila called Mount Banahaw. I conducted fieldwork with
    healers as well as small, independent churches and spiritual groups notable for
    their millennialarian conviction in the imminent transformation of society, an
    interest in the accumulation and distribution of sacred power and potency (kapangyarihan)
    and their veneration of José Rizal – a Filipino novelist and doctor who was executed
    by the Spanish colonial regime in 1896.


    The two research projects shared a number of features: first an interest in change,
    particularly of the sudden and fundamentally transformative type. Occupy activists
    and ''Rizalists'' alike wanted to change their respective societies. Second, the
    two projects shared an interest in space. The Occupy movement was about the rupturing
    of urban space in the expectation of out'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# viii PREFACE AND ACKNOWLEDGEMENTS


    alternative ways to assemble people together and to engage in creative projects.
    Similarly, the healers and churches in Mount Banahaw sought alternatives to what
    they were perceived to be the unjust and immoral spaces of Manila, partly through
    pilgrimage to Banahaw''s sacred spaces and immersion in its caves, waterfalls
    and healing waters also through journeys along its hidden passages to secret chambers
    and by building their own communities. By the time I was in Banahaw it was a veritable
    cottage industry of religious leaders, healers, mystics, pilgrims, New Agers and
    earnest research students, all participating in and adding to the Banahaw imaginary.


    This book and its interest in change and space is very much a product of the work
