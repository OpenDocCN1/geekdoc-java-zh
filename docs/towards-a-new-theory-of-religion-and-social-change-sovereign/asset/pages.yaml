  md: 'Dennett''s approach is the mirror-image of the early twentieth-century German
    philosopher Ludwig Klages, who compared ''human rationality to a parasite that
    had worked across history to asphyxiate the originally intuitive and prophetic
    soul of primeval humanity'' (Harrington 1996: 32).


