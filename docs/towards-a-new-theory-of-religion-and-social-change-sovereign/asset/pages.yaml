    but as the Global Challenges research project ''Religious Urbanisation and Infrastructural
    Lives in African Mega-Cities'' led by David Garbin, Simon Coleman and Gareth Millington
    makes clear, urban and developmental imaginaries are also articulated through
    religions and by religious actors. See rua-project.ac.uk.'
