  md: '# 5


    # # Towards a General Theory of Religion and Social Change


    This book began claiming that the secularization thesis and the lived religion

    thesis – the field’s dominant theories of religious and social change – shared
    the

    same questionable foundation, namely, the rational choice-making, meaning-

    ending, individual human subject. The question I posed was, what would an

    account of religious and social change look like if a non-, anti- or post-humanist

    point of departure was adopted instead? The proposal was to disrupt the

    sovereignty of the individual, human subject by situating it in a finely grained
    and

    thoroughly living, moving world of assemblages made up of contingent human

    and non-human interactants. I went on to propose a nomad science of religions

    as a means of taking the field to a new methodological and theoretical place.


    Nomad science approaches reality ‘as a state of flows rather than a series of
    discrete

    solids with ‘solids’ understood as ‘a special instance of flow’ and as ‘a temporary

    coagulation’ (Adkins 2015: 197). For nomad science, the real is understood not

    in terms of any perfectly determinable world as once imagined by the likes

    of Pierre-Simon Laplace, but in terms of unceasing movement unmoored from

    any substance, essence or being. A nomad science of religions, then, rejects

    both the teleology of modernity and secularization and the heroic powers of'
  merge: -1
  pgno: 161
- img_proc: true
  md: 'the subject and in their stead privileges movement and liveliness. It is a
    kind of methodological animism or fetishism for which change is unpredictable
    and open-ended.


    David Chidester describes a debate in Turku, Finland in 1973 between Walter Caps
    and C. J. Bleeker. In the debate urged his fellow scholars of religions to stick
    with philology and history, the tried and tested methods of the field. Caps, by
    contrast, insisted on the positionality of the scholar (Chidester 2018: 156) and
    on the necessity of experimentation with new theories and methods because ‘only
    mobile theorizing ... [can] gain access to the dynamics of religion’ (2018: 159).
    Caps was interested in change and for an approach to religions that privileged
    the ‘moving, inconstant, spontaneous, irregular, [and] discontinuous’ (Caps in
    Chidester 2018: 9) because


    Change is rugged and powerful. It transforms everything it touches. It rearranges
    boundaries. It upsets preexisting order. It modifies relationships. It contours.
    It reallocates and redistributes resources. It creates new shapes and inserts
    qualifications into definitions. Not content with simple composition, it decomposes,
    then recomposes. It modulates, transposes, transfigures, and diversifies. (Caps
    in Chidester 2018: 160–1)


    Caps''s interest in religious and social change was part and parcel of his work
    on the history of Christianity. There he identified two poles — one static and
    oriented towards preservation, the other dynamic and oriented towards the future
    — saw their dialectic interplay as the key to understanding continuity and change
    in the tradition (2018: 162). Caps''s envisioning of change in terms of the historical
    oscillations of a single binary opposition arguably functioned to stabilize and
    limit the circulation of elements at any given historical juncture to two oscillating
    clusters, spinning around two fixed, gravitational poles. Moreover, it was ultimately
    an oscillation of ideas closed to any conception of non-human agency and the role
    of things and'
  merge: -1
  pgno: 162
- img_proc: true
  md: 'objects in processes of change. Nevertheless, it is precisely Capps''s interest
    in change that a nomad science of religions seeks to take forward. What, then,
    might a general, nomadic theory of religious and social change actually look like?
    I think it should include the following three, basic methodological procedures:


    +   - methodological animism and fetishism: non-humans, humans, plants, objects
    and things, participate with humans across a flat ontological plane of interactions
    in which neither humans nor non-humans are privileged;


    +   - assemblages: interactions are shaped, stratified and spaced to form assemblages.
    Religions are assemblages formed from heterogeneous elements;


    +   - change can be specified by empirically establishing and comparing the flows
    and patterns of differently located religious assemblages.


    The animating principle of Deleuzian and Latourian ontological democracy offers
    a significant way forward to the question of religion and social change beyond
    the secularization thesis and its rival, lived religion, as well as the arguably
    stale methodological debates about reductionism, phenomenology and explanation
    (see Stoddard 2018). However, the idea of a horizontal plane of interactants is
    probably a poor starting point for entertaining questions of power and inequality.
    As such, it is vital to add a dose of Marx or a Haraway to the mix in order to
    draw out the extent to which interactions are asymmetrically entangled, just as
    a small drop of Lévi-Strauss allows for the sense that transformation does not
    necessarily come unexpectedly and catastrophically from without, but lies as a
    potential within any system, a point his work on myth – like his interest in music
    – bears out. It is to be hoped that others are interested enough to take up some
    of these ideas and put them to work.'
