  md: '# TOWARDS A NEW THEORY OF RELIGION AND SOCIAL CHANGE


    the quantum world of generative interaction offer a point of departure for thinking
    about religion and social change?


    Maria Nita’s Praying and Campaigning with Environmental Christians provides what
    she calls a ‘snapshot of the climate movement’ (2016: 227) in Britain between
    the disappointment (if not betrayal) of the 2009 climate summit in Copenhagen
    to the (tempered) optimism of the summit in Paris six years later. During that
    period Nita conducted ethnographic research with an array of groups from Christian
    anarchists such as Isaiah 58 to green Christians as Operation Noah, participating
    in and observing climate marches, climate camps as well as workshops and related
    gatherings and events. Nita outlines an ‘attractor model’ (2016: 66) to describe
    the self-organizing networks of the movement and the entanglements of the various
    Christian and non-Christian activists involved in it. She represents the model
    through the visual metaphor of ‘the spiral structure of a galaxy’ (2016: 70) and
    with reference to the ‘field of physics’ (2016: 229), deploying these metaphors
    and ideas to envision the processes whereby secular and Christian groups coalesced
    together to participate in climate activism and in the process assemble new forms
    of religion, protest, culture and experience. In short, Nita alerts to the collisions,
    frictions and interactions of climate science, political protest and Christianities
    and the extent to which these collisions, frictions and interactions generated
    new hybrid formations of religion, culture and the secular.


    It is this general assumption – that interaction is generative – which forms the
    conceptual centre of this book. It might be argued that interaction is an apt
    metaphor anywhere for the way the lived religion thesis seeks – through close
    qualitative analysis of lived religious lives – make sense of. Perhaps. Certainly
    ideas such as *bricolage* aim to capture a general sense of play and experiment
    as individuals creatively configure and re-configure the different threads (or
    particles) of their religious lives. It is precisely through these acts and moments
    of wonder and creation that – so the advocates of the lived religion thesis assume
    – the sacred is revealed. But the lived religion thesis has'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# INTRODUCTION


    at least one insuperable problem: even if it is accepted that the thesis alludes
    to the kinds of quantum interactions suggested above, there is, for the most part,
    little or nothing sustainably or durably new that is created as a result, though
    their cumulative effects might yet generate more visible change. But the only
    thing that appears to survive religion’s individual creators is the act of making
    itself, the knowledge of which is distributed anyway among political activists,
    particularly anarchists, musicians and artists, and consequently its salience
    to religions and the sacred is, at best, ambiguous (Graeber 2007; Shukait, Graeber
    and Biddle 2007; Wanless 2019). Of course the lived religion thesis also assumes
    interactivity around a stable, center and organizing node called the subject,
    a move which keeps the interaction but controls or removes all the interesting
    and unpredictable, quantum bits.


    It might equally argued that the interactivity metaphor is apt for the reality
    that the secularization thesis seeks to empirically describe and analyse. Again,
    perhaps. the problem for the secularization thesis is not that it does not model
    the complex interactions of multiple particles (religion, individualism, the state,
    the market, Enlightenment, secularism and so on and so forth) that the interactions
    appear to have no effect on the participating elements which are assumed to be
    real, irreducible wholes. As such, neither the religion particle nor the other
    particles are changed by their interactions; there is simply either less or more
    of them as a result. Again, the exciting part – the quantum part with its unpredictability
    and generativity – is tamed away to nothing. This state of affairs is not altered
    by Berger’s initially promising paradigm of the two plural – ‘the pluralism of
    diverse religious options co-existing in the same society ... [and] the pluralism
    of the secular discourse and the various religious discourses, also existing in
    the same society’ (Berger 2014: 53) – which seems to set up the social as a space
    of interactivity between multiple assemblages. Ultimately, however, Berger seeks
    something like a special formula for managing interactions rather than for exploring
    their alchemical possibilities (see Berking, Steets and Schwenk 2018).'
  merge: -1
