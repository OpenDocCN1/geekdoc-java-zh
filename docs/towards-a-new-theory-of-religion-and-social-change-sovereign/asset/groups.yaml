    > 组结思维不断的流动……具有将所有历史斗争还原为抽象生成的效应。这种走向抽象的运动抽空了它们的历史性，掏空了它们的意义和政治力量。因为这这也是一种普遍化的运动，它削弱了任何联盟的可能性，因为它抹杀了其在特殊性上的差异，并阻碍了任何协商的能力。此外，在抹平差异时，它实际上等同了所有少数族主体位置，因此未能提供任何用于相互解读斗争的批判性资源，也未能提供超越权力分散之外的任何政治伦理。（Conway,
    Osterweil and Thorburn 2018: 7；原文中为斜体）


    ## 10 迈向宗教与社会变化的新理论


    如果政治和政治斗争对于宗教和社会变化领域似乎很遥远，但事实是，后续章节中所发展的历史和民族志案例深受反对种族、生态、性别、政治和经济形式不公正的斗争的影响。重要的是，宗教或宗教研究都没有占据政治之上的、之外或之外的空间，我希望在接下来的章节中，我能够令人信服地论证，以流动且不以主体为中心的思考，能够更深入地把握政治，而非对其进行否定。


    从方法论泛灵论、组结、生成性相互作用、流动和空间来研究宗教和社会变化，并不能辨别变化的方向——它不是一种具有预测维度的理论。它是对以主体为中心的宗教和社会变化说明的拒绝，这种说明灵感来自德勒兹和吉塔里对“游牧式”或“少数”科学与“王权”或“主流”科学的描述（2014:
