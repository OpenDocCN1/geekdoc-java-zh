    同样重要的是，认知理论中培养出的一种科学层次思想，其范围从最科学到最不科学。在这种体系中，文化、社会、心理和历史学科只有在通过达尔文进化论的视角进行重构后，才能获得科学的地位；或者或许更委婉地说，当“研究人员……利用生物与文化变化之间的相似性，沿着进化生物学的路线建立一种文化科学”时（Mesoudi,
    White and Inland 2007: 18；另见 Tooby and Cosmides 1992; Ingold 2007a）。当然了，无论是认知心理学家还是无神论者都没有反思过自己的科学：没有像托马斯·库恩（1970）、保罗·费耶本德（2010）、伊姆尔·拉卡托斯（1978），或上帝保佑的唐娜·哈拉维（1991a;
    1991b）、热内维夫·洛伊德（1993）、桑德拉·哈丁（2004）或琳达·图希瓦特·史密斯（1999）那样的反思。因此，这里提出的实验是混合一种源自德勒兹和加塔维（2014）关于“块茎”和“无器官身体”构想的替代性生物想象。


    德勒兹和加塔维的工作通过后结构主义的法国思想反映了所谓生命主义的元素。早期的生命主义赞美经验，并反对被认为由工业、城市现代性引发的对想象力和创造力的机械论式还原。生命主义将目的论、自主性、自我组织、形式完成以及“生命火花”（有时由神性点燃）的概念结合在一起，用以对抗19世纪的科学主义和资本主义（参见
    Eliad 1969a: 70–1）。它与后结构主义对非线性的兴趣相契合，德勒兹和加塔维的思想也影响了简·本内特、曼努埃尔·德兰达、唐娜·哈拉维、提姆·英格尔德和布鲁诺·拉图尔等人的思考¹。无器官身体和块茎支持了一种反生物学，一种没有主体的生物学，一种处理的不是坚硬本质，而是流动、装配和偶然衔接的去领土生物学。因此，我在书中包含了我称之为“弗勒斯装配”的章节，它是习俗（adat）、天主教、发展、巨石、民族主义、所谓的传统宗教和旅游的混合体。


    ## 生物学


    这个例子的目的是首先展示宗教实践与表演的纠缠，这些传统上可能被认为在宗教研究范围之外；其次，探索同时存在的宗教与世俗认同的多元性，这种多元性成性地干扰了将宗教视为定义单一身份的离散传统的观点。单取装配中的一个元素来说：弗勒斯的天主教徒是不基督教宗教传统连续链的成员，还是说，他们是弗勒斯基督教的参与者，这种基督教与装配的其他部分密不可分？


    ## “达尔文主义使其可能”


    R. R. 马雷特那句难忘的名言“达尔文主义使其可能”（Marett 1912: 8）是对“什么是人类学？”这一问题的回答。对于马雷特来说，人类学和“达尔文主义”共享一个假设，即“世界上所有的生命形式都是相互关联的，而且这些关系‘足够均匀，可以用通用的进化公式或定律来描述’”（1912:
    9）。根据埃里克·沙普的观点，这一假设的结果之一是，当宗教被理解为“启示真理”时，它随后变成了一个“发展的有机体”（Sharpe 1986: 48；另见 Cox
    2006: 70–1），可以被想象为一种根据同样的进化发展规律进行生存、生长、改变和死亡的实体，并且可以通过遵循达尔文在《物种起源》（1859）中关于植物和动物的工作中所追求的同类自然科学方法论来认知。对于弗莱泽来说，进化论是“心理人类学”的基础，这种人类学几乎在达尔文和华斯士于1859年发表进化论后立即出现。我认为我是对的，国内外人类学会的基石随处都在那个日期之后，并且通常在非常短的间隔内随之出现。无论如何，人类从长一系列低等动物生命形式中逐渐进化的理论现在已被广泛接受，尽管在进化的具体模式上仍然存在意见分歧。正是这种进化观念为现代人类学科学提供了基础。（Frazer
    1931: 235–6）


    无疑，达尔文的发现开启了理解世界的全新方式，但迪尔干、弗莱泽、斯宾塞和泰勒关于宗教、变化和发展的观点几乎完全不是达尔文式的，其中包括线性的、发展性的进步观念，这种观念可以沿着单条线进行绘制。欧洲思想家在18世纪中叶已经假设了一种线性和顺序性的历史观，这挑战了关于从原始完美状态退化的圣经观点。相比之下，达尔文进化论描述的是对不可预测的环境变化的适应过程和随机突变过程，这意味着即使物种具有共同起源，如果它们在不同的环境背景下被孤立，它们将沿着无尽的分叉线不断发展（Kuper
    1988: 3）。然而，迪尔干、弗莱泽、斯宾塞和泰勒认为自己是进化的继承者，肩负着将这些见解引入社会和宗教研究的任务，因此，他们并不认为对生物学的诉诸仅仅是文学性的或隐喻性的。同样，这些诉诸是具有想象力的，其特征是跨越社会、宗教和自然领域的巨大飞跃，而这些领域此前被认为是分离且互不联系的。


    对于斯宾塞来说，对生物学的诉诸是基于这样一个观点：社会和自然形式可以通过单一科学进行探索。在《超验生理学》（1890a）一文中，他概述了一种综合视角，旨在对形式结构进行比较分析：


    显而易见，组织有机体显示的发展和结构的一般原则也体现在社会中。社会和生物的共同基本特征是，它们由相互依赖的部分组成；这似乎涉及到一个包含各种其他特征的群体。熟悉生理学和和社会学广泛事实的人，正开始意识到这种对应关系并非一种合合理的幻想，而是一项科学真理。（Spencer
    1890a: 60）


    对于斯宾塞来说，生理学和社会学处理的是实体发展的相同过程，在他的论文《社会有机体》（1890b）中，他提出了一系列类比，通过这些类比，有机体的生长可以被视为为社会政治实体的发展奠定了模板。例如，他将原生动物的自发分裂和聚合与原始部落进行比较，将生物体的血液和循环网络与现代社会的商品流通进行比较，并将神经系统与电报和铁路系统进行比较。这些比较显然既不是中立的，也不简单的比较：它们还是一种排名，通过带有政治色彩的进步视角对生物和社会发展的发展进行概念化。此外，这使得斯宾塞能够自信地声称，在社会和生物领域，组织原则是相同的（Spencer
    1890b: 164）。对于斯宾塞来说，社会不是人类活动的产物，而是产生于一种“通用的发展过程”（1890b: 159），这种过程与生物学具有共同的倾向，即假设在“增长过程中结构复杂性不断增加”（1890b:
    161）。

