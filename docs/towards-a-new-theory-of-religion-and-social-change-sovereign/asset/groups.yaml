    # 能量 45


    与其将其视为有生命的主体：不同的图腾对象区分了不同的社会群体，促进了社会体的高层次整合，而这种整合又被社会学分析所捕获。迪尔干在认识论和本体论上的承诺复制了20世纪初的实证主义感性：社会被呈现为“物一般化”（Bauman
    2005: 362），也就是说，它是一个可以像任何地质学家研究晶体一样研究的对象。它由活跃的人类元素（是他们的“过度兴奋”产生了这种热腾沸感）和惰性的物质元素组成，而前者的行为和思想——印刻在图腾对象上——构成了社会科学者的关注焦点。


    迪尔干将图腾主义描述为身体与客体的能量串联，这不仅叙述了图腾社会的形成；它也是一个特定类型主体的故事，这种主体通过创造外部表征、符号和图号而出现：


    > 集体表征只有当它们嵌入到各种物质对象、事物或生物中——如形象、运动、声音、词汇等——并由这些事物以某种外在形式对其进行象征和勾勒时，才会产生。因为只有通过表达他们的情感、将情感转化为符号、通过在外部将其符号化，那些在本性上相互封闭的个体意识才能感觉到他们正在交流并处于统一状态。（Durkheim
    1960b: 335–6）


    图腾式主体——如果我可以这样称它的话——通过它所创造的物质表征来识别自己。精神或心灵对惰性物质的优先性，为社会和政治确保了一种特定的本体论，在这种本体论中，对象和事物只不过是传递人类意义的被动载体。这种本体论在当代社会运动的研究中得到了复制。例如，在《巨型木偶的现象学：破碎窗户、想象中的尿瓶、警察在美国文化中的宇宙学作用》（2007）中，大卫·格雷伯伯（David
    Graeber）将反资本主义抗议视为一种图腾仪式或节庆，它聚集了人类和非人类元素，并与通过对抗议物质文化的反偶像式破坏，以及对资本主义和消费主义符号的反偶像式粉碎所引导的强大能量释放密切在一起。格雷伯伯以“叛逆者”的拼贴风格写作，关注警察对巨型抗议木偶的粉碎，根据在包括西雅图（1999）、费城（2000）和迈阿密（2003）在内的美国抗议活动中进行的多年研究，他探索了他所谓的“木偶的象征意义”（2007:
    376），并指出这些木偶经常成为警察捕获或破坏的目标，有时甚至在它们出现在街道之前。例如，在2003年迈阿密举行的美洲自由贸易区（FTAA）抗议活动中，格雷伯讲述了一份目击者报告，该报告称：


    > 在来自海滨广场的警察抗议者迫使他们放弃木偶后，警官在接下来的半小时左右系统地攻击并摧毁了它们[这些木偶]：射击、踢踹和撕碎碎片；甚至有人把一个巨型木偶放在他的警车里，头部伸在外面，开车撞击每一个现有的标志牌和路灯柱。（2007:
    390）


    根据格雷伯的观点，由纸浆等脆弱材料制成的巨型木偶，是有意对“永恒性”理念的“嘲弄”（2007: 382）。格雷伯认为，图腾木偶的荒诞和巨大的笨拙唤起了对节日的想象，并预示着“神圣且非异化经验的回收”（2007:
    396；另见 Krøjer 2015），调解了强大的、暴力的、迪尔干式的能量的仪式化释放。但如果仪式通过在清醒过剩体验中释放能量构成了图腾社会，那么抗议除了宣泄式释放的可能性或对日常生活的暂时悬之外，还提供了什么呢？


