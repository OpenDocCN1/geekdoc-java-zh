    1966: 233–4; 1962: 309–10）


    热社会与冷社会的区分首次出现在论文《人类学的范围》（1994a: 29）中，在文中，列维·斯特劳斯在热与冷对立之外，还包含了一个额外的二元对立，即平等主义与层级化的社会结构（在与乔尔斯·波什尼耶的访谈中，他还将时钟与蒸汽机作为不同类型复杂系统的示例进行对立）。根据列维·斯特劳斯的观点，冷、平等的社会只需要少量的初始输入能量即可运转。它们的特征是负反馈回路，“系统输出的信息被回馈到输入，以确保随后的输出维持在有限的参数范围内”，而层级社会则通过剥削产生能量——“为了从中获取变化和能量，不断强调种姓与阶级之间的差异”（Lvi-Strauss
    1994a: 29）——且其特征是正反馈回路，“系统处于一种无限制的指数级增长中”（Johnson 2003: 123）。简而言之，热社会剥削其环境——殖民主义和资本主义就是通过任何必要手段确保持续获得新能源的例子——而冷社会则与其环境产生了一种稳态，从而保证了“适度的生活以及资源的保护”（Lévi-Strauss
    1994a: 28）。根据列维·斯特劳斯的观点，这种稳态建立在[原始社会]那种促使历史进入其其中的特殊智慧之上（Lévi-Strauss 1994a: 28；见
