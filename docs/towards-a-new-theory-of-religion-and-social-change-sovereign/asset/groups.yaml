    every level, human beings tried to understand and control the world around themselves
    and adapt their behaviour to it. Progress in positive knowledge – and therefore
    in effective rationality consisted in a closer coordination of the external world
    and internal mental representations of it, largely by the elimination of reasoning
    that was either erroneously founded or no longer adaptive. (Stocking 1987: 200)


