    # GENERATIVE INTERACTIVITY 113


    When our gaze shifts from Manila ... to the rural areas affected by the revolution,
    we encounter experiences and narratives that the linear history of our nation-state
    would find hard to accommodate. Instead of a straightforward transition from colonial
    darkness to the light of independence, we find people of the Philippines shifting
    their identities under changing circumstance, juggling their loyalties among state,
    family, and church, and mixing up the modern categories of ''religious'' and ''secular''.
    (Ileto 1998a: 97–8)


    Today, the mountain is widely known for the ''Rizalist'' churches on its lower
    slopes, so-called for their veneration of the national hero Rizal, as the Filipino
    Christ. Rizal, a well-travelled and well-educated Filipino novelist and doctor,
    was executed in Manila in 1896 but later elevated by the Americans to the status
    of national hero, and monuments were built in his memory across the archipelago.
    In a survey of Rizalist groups, movements and churches, Foronda (1961) argues
    that their beliefs and practices are evidence for the persistence, among ''the
    poor unlettered folk ... living in mountain areas and far-flung barrios'' (1961:
    37) of an indigenous, pre-Hispanic ancestor worship. This argument denies the
    novelty of Rizalism as a new religious formation, with its own material culture
    and its reversal of the gendered and racialized morphology of the church-plaza
    assemblage.


    One Rizal church — the Ciudad Mistica de Dios or Mystical City of God — moved
    to Banahaw in the 1950s, its leader Amador Suarez having reportedly been guided
    by the Santong Boes. The community has since constructed a large compound that
    includes two churches, an infirmary, a workshop, a residence for their leader
    with rooms for guests as well as quarters for around forty nuns and a large kitchen
    and refectory. These are located at the centre of the compound and, around the
    edge, living quarters for followers have been built. The key components of the
    Law of Indias are present: the power lies at the compound''s centre, radiating
    outwards like the rays of the sun. Additionally, the roof of the main building
    is in the shape of a dove with outstretched wings, symbolizing the presence of
    the Holy Spirit. Mistica’s construction of a ‘city’ in Mount Banahaw is precisely
    an attempt to establish a counter-urbanism – a new Jerusalem, if you will – on
    a mountain they claim has eschatological significance with a basis in scripture.
    However, Mistica’s significance goes further: as well challenging the racial hierarchies
    of religious authority and constituting a novel form of religious urbanization²,
    Mistica is also notable for its female Supreme and the location of spiritual legitimacy
    in Ileto and in a cadre of nuns (Quibuyen 1991).


    According to (1998b), the veneration and remembering of Rizal by groups such as
    Ciudad Mistica de Dios and the Spiritual Filipino Catholic Church subvert state
    and official commemorations of the national hero. For Lahiri (2002), however,
    the veneration and remembering of Rizal by religious groups and movements signifies
    the colonization of former border areas like Mount Banahaw and their transformation
    into ideological props for official nationalism (see Tremlett 2008b). However,
    I would suggest that the monuments to Rizal built on the slopes of Mount Banahaw
    point to a more complex state of affairs that includes the appropriation of a
    secular aesthetic of urban design brought to the Philippines by Daniel Burnham
    and his assistant, Peirce Anderson, as they set about introducing a new kind of
    urbanism to the Philippines.


    At the heart of Spanish rule been the Intramuros with its morphology of walls
    and sharp divides between the inside and the outside – a taxonomy and a mode of
    administration, set in solid stone. The City Beautiful aesthetic brought to the
    Philippines by Burnham transformed the look and feel of the capital. First, the
    centre of Manila was shifted to the Extramuros. Second, new roads and boulevards,
    green spaces, public buildings and monuments were built, with the intention to
    facilitate ‘people to freely see public offices, observe civic rituals and inter’
    (Morley 2018: 79) in ways that had not been possible during the Spanish period.
    Third, the construction of a Rizal monument as a focal point for national pride
    and the invention of a civic ritual


    ![](img/91d03b06161479dec764992b403c4aec_125_0.png)


    FIGURE 5 Rizal monument outside the Spiritual Filipino Catholic Church on Mount
    Banahaw: note the angle of the head. Source: author.


    calendar to mark Rizal''s life and death became key elements of a wider strategy
    of urban design to promote ‘moral, intellectual and governmental progress’ (Morley
    2018: 49). With regard to the latter, Rizal monuments were also constructed in
    towns up and down the country, becoming civic ritual sites in their own right.


    # TOWARDS A NEW THEORY OF RELIGION AND SOCIAL CHANGE


    Importantly, the monuments to Rizal built on the slopes of Mount Banahaw depict
    him in almost the same terms as the official monuments, that is, in the same Western
    attire and heroic, rigid pose and elevated upon concrete plinths. As such, these
    representations reproduce quintessentially modern elements of early twentieth-century
    American monumental architecture on the mountain. Additionally, the angle of Rizal’s
    head suggests a nod – excuse the pun – to baroque depictions of another Filipino
    hero and the suturing together of multiple elements poached from multiple sources.


    Certainly for the Americans, the monumental representation of Rizal’s body as
    an object of discipline and restraint was a means of reproducing and transmitting
    the Protestant masculinity of the period with its emphasis on virtues such as
    courage, discipline, independence, strength and will, among others. According
    to Nagel (1998), this masculinity in concrete is linked in


    ![](img/91d03b06161479dec764992b403c4aec_126_0.png)


    FIGURE 6 Rizal monument in the garden of the church plaza in San Pablo City: note
    the angle of the head. Source: author.


    complex ways with the emergence of nationalism, capitalism and processes of modernization.
    In the Banahaw assemblage, these elements are reconfigured and re-situated among
    a range of new and improvised features, pointing to the mountain as a site of
    religious improvisation and experimentation.


    # The Philippines 1967 arcadian assemblage


    The other of both the church-plaza assemblage with its closed, urban forms, and
    (to anticipate somewhat) the media-church assemblage with its distributed and
    open, rhizomatic connectivities, the arcadian assemblage. This assemblage also
    represents a development of the Banahaw assemblage: whereas the Banahaw assemblage
    reversed the racialized and gendered morphology of the church-plaza assemblage,
    the arcadian assemblage generates its form from pure resistance to urban modernity,
    framed partly in terms of a Vatican II theology of romantic re-enchantment but
    also from local discourses of simplicity and authenticity and a new eco-theology
    (Bullock 2017; Garigueux 2008).


    In the Philippines a political theology emerged, initially, as a response to the
    economic and political crises of the countryside in the 1950s, developing into
    a leftist theology in the 1970s and, more recently, into a fully-fledged theology
    oriented towards Catholic revitalization, routed through a celebration of Filipino
    indigenous forms of life and knowledge. Giordano (1988) has detailed the post-Vatican
    II period within the Church in the Philippines, identifying a resolve among certain
    elements within the Church to tackle widespread problems of poverty, economic
    and political inequality, and abuses of human rights committed by the army and
    police. According to Giordano, the creation of the Labayan Secretariat of Social
    Action (NASSA) under the direction of Bishop Lopez in 1967 led to the adoption
    of increasingly critical positions by elements within the Church towards the government.


    This period also saw the founding of the group Philippine Christians for National
    Liberation, which shared the Philippine Communist Party’s (CPP) analysis

