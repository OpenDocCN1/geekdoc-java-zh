    ## 结语：装配图 159


    它们在成为一个系统之前同时进行自我解构。层级结构依然存在，但它不再是垂直的，而仅表现为权力的集中与去中心化，此时每个元素都在回避系统性结构，并逃离引力和拓扑结构的构建。图画的观察者被赋予了一项视觉练习，即解读结构化与去结构化中的模式，以及那些不足以产生系统的去结构化碎片。对于艺术家而言，绘画这项任务是让不可检测的权力结构出现在可见性领域。希托·斯泰尔（Hito
    Steyer, 2017）讨论了“幻视”（aphenia）——一种在背景噪声中感知模式的能力——是一种帮助我们超越通过脉冲和数据电子网络所组织的现实表面的技能。在网络社会中，标记不再位于根据地理坐标组织的绘图方案，也不存在于天与地的划分之间。


    德勒兹的“装配”（assemblage）概念在提到图画时，是指特定时刻权力配置的快照。与杰拉尔德·劳恩（Gerald Raun, 2010）将机器装配读为社会抵抗的串联和创新性联盟的形成不同，我坚持对图画的特定引用，即变化的权力配置被框定为特定时刻的快照。德勒兹在他关于弗朗西斯·巴肯的书中对“图表”（diagram）的解释提供了一些指导。遵循他的“图表装配”概念，是同步图表中的力量配置。它是一部捕捉不可见权力斗争的电影。当然，德勒兹并不是指图表是注释辅助意义上的插图。图表不服务于思想，它本身在它的图像和物质性中就是一个思想。阿帕杜拉伊（Appadurai）的“流”（flow）概念很有用，因为权力和影响是被分散和获取、采纳和部署的。然而，与流的概念不同，通过特姆莱特（Tremlett）体现的装配包含了斗争和逃逸，而非通过相对建立的网络组织的流。为了将权力配置视觉化，艺术家试图绘制出权力斗争中力量的运动。


    事实上，结果是一个骨化的权力景观，它捕捉了新兴的流，也捕捉了权力的碰撞。只需提到雅克·拉康（Jacques Lacan, 1977）对阳茎的讨论即可，其中权力并非由作者代理人持有，而是通过被演绎、协商、施加和抵抗的关系性力量表现出来的。换句话说，它不断改变着形状、强度、速度、方向和影响。在这些装配图中，我无意去捕捉它们，而是通过特姆（Trem）的写作来想象它们，并让它们以绘画的形式物质化地呈现。当绘画被理解为一种狩猎的形式时（正如托马斯·齐默（Thomas
    Zimmer, 2012）所建议），在绘画的行为中，艺术家试图捕捉一个场景或一个形象。例如，一个运动中形象的图画变成了捕捉运动形象的练习。从这个意义上说，绘画是猎人用套索套住动物的行为。因此，图画试图捕捉并留住观察者。作为狩猎的绘画行为和作为猎物的绘画作品似乎是合适的，但同时，这种隐喻掩盖了艺术家-猎人在与猎物近距离接触时的存在，因为观察者关注的是被捕捉的事物。当绘画事件是一种捕捉行为时，艺术家-猎人实际上站在猎物附近。同样，德勒兹和特姆莱特通过他们对权力的分析参与了领土化、去领土化和再领土化的历史过程。对我而言，在承担绘画任务时，我试图依靠线条作为我的首选武器来产生权力图像——尽管，即使在绘画被视为对感官的视觉攻击时，“武器”一词可能也是夸张。通过采用齐默绘画作为狩猎猎物的比喻，我会错误地暗示知识是“他者”——即变化的权力景观，准备好被捕捉。相反，为了更诚实地反思我创作装配图的经历，从绘画请求提出的起，我就像猎物一样受困在未知之中。在这个过程中，当我绘画时无法看到我想看到的东西时，我经历了技术上的挫败，也有意外标记带来意人结果的愉快时刻。从这个特殊意义上说，绘画正如装配一样，是从“无知”中产生知识的过程，是尝试看到比常规可能看到的更多的东西，并把握不可感知的权力配置。


