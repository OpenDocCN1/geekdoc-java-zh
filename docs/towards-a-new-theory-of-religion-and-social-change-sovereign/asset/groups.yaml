    337），他通过赌徒形象向历史引入了偶然性。这种将历史重新定义为激进偶然性，使列维·斯特劳斯能够暗示进步并非某些文化相对于其他文化的特权，而是运气、最重要的是与其他文化的结合与联盟的结果（1994c:
    356）。在《种族与文化》中，列维·斯特劳斯继续了这一论点，但用遗传学术对其进行了重新表述：


