    Bruce）和大卫·沃斯（David Voas）的生命史定量社会学的重大偏离，后者包含一个隐含假设，即在涉及宗教时，只有固态的才有意义。对于布鲁斯和沃斯来说，世俗化事实——即宗教人口（尤其是西北欧国家教会）在代际更替中持续稀释这一事实——明确地指向一个结论：宗教机构将很快经历极低的人口密度，以至于制度性的传承和再生将很快变得不可能。一方面，存在“生活宗教”假设，它提出了一种永久的宗教流动性或“生成”状态，这种状态在个人传记中达到了极其精微的程度，以至于凝固或钙化的过程永远不会发生。然而，这并不是现实的立场。另一方面，存在“世俗化假说”，它完全忽略了流动性的意义，仅限于对制度性固态及其瓦解的分析。这同样是一个不现实的立场，斯塔克（Stark）和班布里奇（Bainbridge）的世俗化波动模型（Stark
    and Bainbridge 1987）也没有对其很好的缓解。


    本章的目的是为宗教和社会的变化提供一种完全不同的解释，因此我追溯了三个步骤：第一，我探讨了卡尔·马克思（Karl Marx）的作品，特别是他模拟社会变化过程的尝试。第二，我转向克洛·列维·斯特鲁斯（Claude
    Levi-Strauss）的作品以及神话的结构模型及其转型。这两个模型都预示了根据元素的某些相互作用发生的变化，这些相互作用并不取决于任何主体的能动性。在本章最实质的部分，我详细阐述了四组“基督教-菲律宾”装配（Christo-Filipino
    assemblages）。每个装配在空间上构成，且每个似乎都是其他装配的转化。它们并没有陷入任何关于进步的寓言或关于熵增绝望的悲剧故事。它们避开了流动宗教、生活宗教和通俗宗教支持者所犯的范论错误，这些错误一贯表现为将具有意义的理性选择的个体视为分析单位和变化的能动者。在这里，变化是装配的属性，是其人类和非人类元素及其相互作用能量属性。对装配的优先考虑也边缘化了世俗化假说支持者所犯的方法论错误，支持者认为宗教和社会的变化是根据一种令人怀疑的宗教去整合目的论发生的，而这种目的论依赖于将个人视为统一实体的观点，即信仰与行动是完美的。事实上，装配允许精确地描绘固态与流动形式之间的过渡点或临界点——当一个装配发生转化并产生自身的新版本时。


    ## 马克思与变化


    马克思主义与其说是单一的传统或理论体系，不如说是列宁主义、特洛茨基主义、格兰西主义、批判性、新马克思主义和后马克思主义解释与遗产的交织。。我感兴趣的是斯图亚特·哈尔（Stuart
    Hall 1983）所提出的那种“无保证的马克思主义”，以及尚塔尔·穆菲（Chantal Mouffe）和埃内斯托·拉克劳（Ernesto Laclau）对马克思工作关键方面（特别是关于历史和意识形态的思想）的复杂的后结构主义反思（Laclau
    and Mouffe 1985; Laclau 1990）。例如，在《对我们时代革命的新反思》中，拉克劳将马克思在《共产党宣言》中对社会历史变化的描述与在《政治经济学批判》序中的描述进行了对比。拉克劳认为，在《宣言》中，马克思将社会视为斗争的场所，暗示社会从未闭合，而是始终对变化的可能性开放的。重要的是，“这并非因为其特定连贯性在经验上无法实现，而是作为某种从一开始就在结构内部‘起作用’的东西”（Laclau
    1990: 29）。像处于解构中的德里达式文本一样，拉克劳马克思主义的历史偶然性社会形成已经受到变化力量的涟漪和扰动的影响，并存在“微小的运动从无中产生革命”的可能性（Derrida
    1997: 257）。


    相比之下，在序言中，马克思用一对封闭的、预先决定的分析层次（即基础和上层建筑）以及一组有限的首级和次级线性因果关系来界定社会变化：


    在他们的生活生产中，人们进入了特定的关系，这些关系是不可或缺的且独立于他们的意志的，这些生产关系对应于他们物质生产力发展的某个特定阶段。这些生产关系的总和构成了社会的经济结构，即现实的基础，在此基础上，产生了法律和政治上层建筑，并对应着特定的社会意识形式。物质生活条件的生产方式规定了总的社会、政治和智力生活过程。决定他们本质的不是他们的意识，相反，他们的社会存在决定了他们的意识。在他们发展的某个阶段，社会的物质生产力与现有的生产关系或——换句话说，与他们迄今为止在其中发挥作用的财产关系发生冲突。从生产力发展的形式来看，这些关系变成了它们的枷锁。社会革命的时代开始了。随着经济基础的改变，整个上层建筑或或少快速地发生转型。在考虑这种转型时，应当区分生产经济条件的物质转化（可以以自然科学的精确性来确定）与法律、政治、宗教、艺术或哲学——简之，即人们意识到这种冲突并与之争争的意识形态形式。（Marx
    in McLellan 1995: 163）


    在序言中，马克思对意识形态概念的使用预设了社会和历史之外的存在，从那里可以对特定说明和叙述的真伪做出判断。这正是拉克劳所质疑的启蒙运动认知主体的马克思主义化身。相比之下，坚持将社会视为斗争的领域以及这些斗争中的知识，意味着意识形态的概念可以获得不同的权重：它不再是衡量真理的手段，而是指示社会对于调查的不透明性问题——也许是偶然的社会和宗教元素互动并产生意外形式的能力。然而，这种做法不可避免的结果是消除了马克思主义曾声称提供的社会特权视角。


