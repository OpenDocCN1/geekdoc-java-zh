    # ## Introduction


    In *The Savage Mind* (1962; 1966), Claude Lévi-Strauss distinguished between ‘hot\’
    and ‘cold\’ types of society. At first glance, the distinction appears to map
    comfortably with the binary classifications typical of the classical anthropology
    of primitive and modern social forms. For example, Henry Sumner Maine distinguished
    between relations of status and relations of contract, Emile Durkheim between
    mechanical and organic forms of social solidarity and Ferdinand Tönnies between
    the organic bonds of the *Gemeinschaft* and the contractual relations of the *Gesellschaft*.
    However, while Maine, and Tönnies were thinking largely within a constellation
    of nineteenth-century concepts of modernity infected by rationalism and romanticism,
    Lévi-Strauss was thinking with the second law of thermodynamics, entropy and the
    concept of energy. For Lévi-Strauss, pre-modern societies were self-sustaining
    totalities immune to the forces of history and while modern societies were simultaneously
    restless, progressive and destructive.


    Lévi-Strauss’s exploration of the social through metaphors of energy was part
    of a small corpus of anthropological and sociological writings exploring intersections
    of energy and society that included the likes of Leslie A. White and Clifford
    Geertz among others (see Rosa, Maclis and Keating 1988). Much of this work was
    marked by the indelible stamp of evolutionist social'
