    # # Afterword: Assemblage Drawings


    Atsuhide Ito


    One day, I received a request from Paul for a set of drawings to illustrate his
    book. The drawings were to visualize the changing power configurations in the
    Philippines via Gilles Deleuze''s concept of assemblages. The task of drawing
    made me think about lines and their relationship to drawing. The act of drawing
    a line, as simple as it sounds, causes a significant set of consequences. Drawing
    a line on a piece of paper divides a space into spaces and on a map the same act
    produces territories. The act of drawing structures a division and the consequence
    is territorialization. The simple act of drawing provokes a political consequence
    of division, territorialization and ownership.


    On the contrary to the function of lines that divide, lines can also connect.
    Lines connect a point to another, establishing an alliance and a relationship
    and further alliances and relationships to be multiplied. Lines also link up with
    other lines while disrupting its extension, be stop and turn, changing their directions
    to reach another line, in a way to de-territorialize the already established structure
    of divisions and alliances. In so doing, the lines not only connect points and
    produce alliances, but also they can be met and crossed by chance, countering
    the forces aimed at an intended direction. Lines direct'
