    The classical states of Southeast Asia were in theory highly centralized, and
    embodied ideas, derived from Indian influence, of a divine kingship and of a parallelism
    between the universe and the terrestrial order. The capital of the ruler was the
    magical centre of the realm, and at its centre, in turn, a temple or the royal
    palace, whose terraces and orientation were designed in accordance with an elaborate
    symbolism, represented Mt. Meru, the abode of the gods. The kingdom was a microcosm
    of the universe so the king in his capital, a descendant of a god or an incarnation
    of god … maintained the harmony of the kingdom, matching the harmony of the universe.
    (Legge 1999: 32)


    Benedict Anderson’s essay “The Idea of Power in Javanese Culture” (1972) re-worked
    some of Heine-Geldern’s ideas and applied them to twentieth-century Indonesian
    politics, but they were applied elsewhere as well. For, the Filipino historian
    R. C. Ileto’s careful, textual analysis of nineteenth-century Filipino pasyon
    texts and his discussion of the role of those texts in the 1896 revolution and
    other uprisings against Spanish and American colonial rule in the nineteenth and
    early twentieth centuries, draws substantially upon the idea of a pan-Southeast
    Asian conception of spiritual power. Drawing explicitly on Anderson’s, Ileto’s
    investigations include a meticulous approach to questions of spiritual power (kapangyarihan)
    and interiority (loob) in the pasyon, with loob as a space to be cultivated in
    the process of accumulating kapangyarihan (Ileto 2011: 24–5). Herminia Meñez (1999)
    also draws on Anderson in an essay on post-Marcos Filipino politics, highlighting
    the role of anting-anting (amulets), which are ‘concentrated forces of energy’
    are authoritative and highly sought-after symbols and repositories of power for
    political leaders (cf. Sidel 1999). For both Ileto and Meñez, religious ideas
    about power and prowess – ideas long divorced from their articulation with the
    classical states of the early history of the region – constitute a kind of cultural
    constant for explaining certain features of Filipino and wider Southeast Asian
    politics.¹


    More explicitly spatial and geographical approaches to the Philippines, though
    they may explore questions of change, tend not to be interested much in religions.
    Morley''s (2018) study of American urbanism in the archipelago supplements a small
    number of articles and books (for example, Connell 1999; Shatkin 2005; Ortega
    2016) seeking to document the urban history of the country. An exception is Jose
    Mario C. Francisco’s article ‘Mapping Religious and Civil Spaces in Traditional
    and Charismatic Christianities in the Philippines’ (2010). Francisco is interested
    in what he calls the ‘construction of sacred space by particular religious institutions’
    and how these constructions constitute expressions of each group’s ‘self-understanding’
    (2010: 215), shaping their engagements with other religious groups and the wider
    sphere of civil society (2010: 187). In what follows, I interrogate three of the
    four spaces selected by Francisco for analysis, except I treat them as assemblages
    and sever the link made by Francisco between them and self-understanding or subjectivity.


    ## The Philippines 1593 church-plaza assemblage


    Urbanization was prevalent in mainland Southeast Asia long before the arrival
    of Europeans in the region (Keyes 1995). Manila, however, was largely the product
    of Spanish colonialism, central to which was the process of ‘reduction’ as prescribed
    by the Laws of the Indies. These laws, enacted by Philip II in 1573, codified
    Spanish colonial practices of discovery, settlement and pacification across their
    colonial possessions, assuring the ‘creation of a uniform urban form throughout
    the entire geographical reach of the Spanish Empire’ (Morley 2018: 33). These
    sixteenth-century ordinances were a combination of Spanish experiences of urbanism
    in the Americas, classical theories of urbanism, and then contemporary European
    theories of urban forms, such as that developed by the Renaissance architect and
    philosopher, Leon Battista Alberti (1404–72) (see Reed 2002: 166; Morley 2018:
    34, but also Choay 1997). The ordinances required the re-settlement of the scattered
    and dispersed indigenous populations of the Philippine archipelago into town centres
    as a means of concentrating and solidifying Spanish power and facilitating conversion
    (Francisco 2010: 188). These centres were focused around a church and plaza, which
    lay at the heart of the grid. According to Lefebvre, these instructions were arranged
    under the three heads of discovery, settlement and pacification. The result is
    a hierarchical organization of space, a gradual progression outwards from the
    town centre, beginning with the city. The plan is a grid that extends indefinitely:
    each square or rectangular lot has its function assigned to it: church, administrative
    buildings, town gates, streets, warehouses, and so on. Thus a high degree of segregation
    is superimposed upon a homogeneous space ... [It] is also an instrument of production:
    a social structure (Lefebvre 1991: 151).


    Before the arrival of Spain, Filipinos had lived primarily in dispersed settlements
    along coasts and rivers, in stark contrast to the already urbanized populations
    in other regions of Southeast Asia, these pre-colonial populations were grounded
    in a unit known as the *barangay*. Re-settlement provided a means to survey Filipino
    bodies and contain them within Spanish terms: The relocation of native bodies
    – or at least the designation of their areas as parts of a larger administrative
    grid – permitted them to be identified in Spanish and religious terms ... The
    conversion and colonization of the local populace necessitated their physical
    relocation by either force or persuasion (Rafael 1988: 90).


    In order to facilitate the effective administration and conversion of these people,
    then it was necessary to up-route these settlements and re-territorialize them
    in terms of administrative units that made the Church centre, source and symbol
    of the colonial regime. From the mid-1580s the development of Manila proceeded
    with the building of a walled city – the Intramuros – which became the religious,
    political and military seat of Spanish power in the archipelago. By the turn of
    the seventeenth century it was home to almost 30,000 people (Morley 2018: 36),
    a symbol of Spanish civilization lived in stark contrast to the Extramuros where
    the non-European and indigenous populations lived. Throughout the seventeenth
    century the colonial regime organized regular expeditions into frontier parts
    of Luzon, the Visayas and Mindanao, and these were followed by re-settlement.
    Like Intramuros, the colonial towns were built on a grid pattern around a church
    and a central plaza or square. Each new town expanded the network of roads through
    the territory. The towns themselves functioned like gravitational centres around
    which clustered the smaller satellite *barrios* and the even smaller, *sitios*.

