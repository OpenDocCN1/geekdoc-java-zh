    ### 引言


    在《野性思维》（1962; 1966）中，克劳德·莱维-斯特劳斯区分了“热”和“冷”社会。乍一看，这种区分似乎与原始和现代社会形式的二元分类完美契合。例如，亨利·苏曼·梅因区分了身份与契，埃米尔·杜尔凯区分了机械团结与有机团结的形式，费尔迪南德·通尼则区分了“共同（Gemeinschaft）”与“社会（Gesellschaft）”。然而，尽管梅因和通尼在很大程度上是在19世纪的概念内思考，但莱维-斯特劳斯是在用热力学、熵进行思考。对于莱维-斯特劳斯来说，前现代社会是自给自足的整体，而现代社会则是同时不安、进步且具有破坏性的。


    莱维-斯特劳斯通过能量对社会进行的探索是少数人类学和社会学著作的一部分，其中包括莱斯利·A·怀特和克里福德·格尔茨等（见 Rosa, Maclis and
    Keating 1988）。其中的大部分工作带有演化论理论的深刻印记，将社会和技术差异的观察与能量消耗联系起来，为现代性的受益者想象了一条无止境的进步和增长轨迹。


