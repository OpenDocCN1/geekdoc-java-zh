    变化是粗犷且强大的。它转化所触及的一切。重新排列边界。打破既有秩序。修改关系。勾勒。重新分配和重新配置资源。创造新的形状并在定义中插入限定条件。它不满足于简单的组合，而是分解，然后重组。它调制、易位、变相和多样化。（Caps
