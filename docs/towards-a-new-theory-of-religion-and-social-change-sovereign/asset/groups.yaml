    ## 68 TOWARDS A NEW THEORY OF RELIGION AND SOCIAL CHANGE


    not. This difference stems from another set of cognitive capacities. Humans are
    greatly dependent upon cooperation and information about potential cooperators,
    which creates specific cognitive problems. Humans have a set of strategic capacities
    that handle these problems. Now some supernatural concepts are represented in
    such a way that they activate strategic capacities. As a result, they are more
    likely than others to generate high commitment and other psychological and social
    effects typical of ‘religion’. (Boyer 2000: 196; italics in original)


    One of the consequences of this line of thinking is the extent to which religious
    beliefs and religious concepts come to accrue a reproductive agency all of their
    own, at the expense of their human carriers. As Bering points out, ‘Boyer’s model
    holds that religious concepts gain entrance to … mundane cognitive mechanisms
    through their attention-grabbing properties,’ going on to note that religious
    concepts are able to ‘parasitize’ mundane cognitive mechanisms’ by ‘pirating aspects
    of human cognition’ (Bering 2003: 117). This position is also the paradoxical
    hallmark of new atheist populism, which on the one hand celebrates Enlightenment
    ideals of reason and the reason-endowed, rational-choice making human subject,
    while on the other, uses a model derived from genetics (memetics) to account for
    the transmission of religious beliefs and concepts in a way that elides the role
    the human subject might have been expected to play in acquiring beliefs, for example
    through learning.


    Memetics – like genetics – is a theory of information transmission. Unlike genetics,
    however, deals with the transmission of information stored in DNA, memetics deals
    with the transmission of culture and religion as information. An evolutionary,
    memetic approach to religion assumes that religions can be rendered as bundles
    of semantic data such as beliefs whose transmission, extinction, spread and persistence
    in human populations can be modelled in genetics terms. According to Mesoudi,
    Whiten and Laland, ‘cultural [or in this case, religious] knowledge is stored
    in brains as discrete packages of semantic information, comparable to how biological
    information is stored in genes’ (Mesoudi, Whiten and Laland 2006: 342). The next
    move is to approach the diffusion or the distribution of these memes, these units
    of religion and culture, in the same way that geneticists study the distribution
    of genes in a population:


    > Our individual brains are each inhabited by a large number of ideas that determine
    our behaviour ... An idea, born in the brain of one individual, may have, in the
    brains of other individuals, descendants that resemble it. Ideas can be transmitted,
    and by being transmitted from one person to another, they may even propagate ...
    Culture is made up, first and foremost, of such contagious ideas ... To explain
    culture, then, is to explain why and how some ideas happen to be contagious. This
    calls for the development of a true epidemiology of representations. (Sperber
    1996: 1; italics in original)


    As, if a meme — in this instance, the belief in God — like a gene, one must logically
    assume that human beings are hosts or carriers of that belief just as they are
    vehicles for self-propagating genes (Dawkins 2007: 192). Daniel Dennett begins
    his Breaking the Spell (2006) from precisely this point of departure:


    > Watch an ant in a meadow, laboriously climbing a blade of grass, higher and
    higher until it falls, then climbs again and again, like Sisyphus rolling his
    rock, always striving to reach the top. Why is the ant doing that? What benefit
    is it seeking for in this strenuous and unlikely activity? Wrong question, it
    turns out. No biological benefit accrues to the ant. It is not trying to get a
    better view of the territory or seeking food or showing off to a potential mate,
    for instance. Its brain has been commanded by a tiny parasite, a lancet fluke
    ... that needs to get itself into the stomach of a sheep or a cow in order to
    complete its reproductive cycle. This little brain worm is driving the ant into
    position to benefit its progeny, not the ant’s. This is not an isolated phenomenon.
    Similarly manipulative parasites infect fish, and mice, among other species. These
    hitchhikers cause their hosts to behave in unlikely – suicidal – ways, all for
    the benefit of the guest not the host. (Dennett 2006: 3–4)


    Central to Dennett’s discussion of religion and memes is a distinction between
    good memes and bad memes. A bad meme might be something like the idea of virtue.
    A bad meme would be something allegedly maladadaptive like the religious belief
    in God. But this is the crucial point, the basis for making this distinction does
    not derive from memetics or evolutionary theory more generally. Evolutionary theory
    provides no criteria – beyond reproductive success – to make these kinds of distinctions.
    Given that religion – as a meme – is extremely successful in reproductive terms,
    the criteria for making the distinction ultimately be a subjective one, deriving
    not from evolutionary science, but from elsewhere:


    > According to Dennett, memes are spread according to their own criteria of success;
    they do not need a moral defence, and if the moral defence is just a meme, then
    it cannot be morally valid in any philosophical sense ... Dennett actually faces
    this question, posing it himself: ‘What foundation, then, can we stand on as we
    struggle to keep our feet in the meme-store in which we are engulfed? If replicative
    might not make right, what is to be the eternal ideal relative to which “we” will
    judge the value of memes?’ His answer is: ‘We should note that the memes for normative
    concepts – for ought and good and truth and beauty – are the most entrenched denizens
    of our minds. Among the memes that constitute us, they play a central role. Our
    existence as organisms are – as we as thinkers are – not as we are organisms is
    not independent of these memes. If we grant this, however, why is it that religious
    ideas which seem equally entrenched denizens of many minds are potentially dangerous?
    ... How we come that some basic memes are beneficial to whereas others are not?
    (Albinus 2008: 33; italics in original)


    For Albinus, if a meme is really like a gene there can be no moral or political
    standpoint against or for religion as a meme, only the brute fact of evolutionary
    success or extinction. The critique of Religion as maladaptive cannot be sustained
    on the basis of evolutionary theory. It can only be sustained on the basis of
    values derived presumably from ethical, philosophical or political resources,
    a point which implicates memetics and new atheism – but also cognitive and evolutionary
    psychological approaches – in a politics that the appeal to the biological imagination
    elides.


    Cognitive, evolutionary psychological and new atheist approaches to religion have
    drawn legitimacy from the idea that their impetus comes from ‘religion scholars
    wanting to ‘science up’ the study of religion’ (Barrett: 2011: 230) and, more
    provocatively, from claims that


    > The social sciences are still adrift, with an enormous mass of half-digested
    observations, a not inconsiderable body of empirical generalizations, and a contradictory
    stew of ungrounded, middle-level theories expressed in a babel of incommensurate
    lexicons. This is accompanied by a growing malaise, so that the single largest
    trend is toward rejecting the scientific enterprise as it applies to humans. We
    suggest that this lack of progress, this ‘failure to thrive’, has been caused
    by the failure of the social sciences to explore or accept their logical connections
    to the rest of science – that is, to causally locate their objects of study inside
    the larger network of scientific knowledge. (Tooby and Cosmides 1992: 23; see
    also Ingold 2007a; Mesoud, Whiten and Laland 2007)


    Of course, the idea that evolutionary biology is the most scientific way to explain
    human behaviour – religious and otherwise – is to make a very big claim. To posit
    the biological as the deep and sovereign truth that lies behind religion, culture
    and society in the way that many cognitivists, evolutionary psychologists and
    new atheists do, according to Maurizio Meloni (2014a; 2014b), an attempt to advance
    quite a narrow and reductive view of biology. To be sure, ‘if the social sciences
    are ill, biology looks like the therapy; if sociological investigations are thin
    and fragmented, biological knowledge is solid and cohesive, and if the social
    seems to be an erratic, ephemeral entity lacking firmer ground, what is required
    is to anchor onto the firmer basis of evolutionary thinking and neurobiological
    facts’ (Meloni 2014a: 733). Yet intriguingly, what Meloni calls ‘post-genomic’
    biology challenges the value of the ‘biological as what is ‘genetic’, ‘innate’,
    ‘prior to social’, ‘essential’, ‘universal’, and ‘invariable’ (Meloni 2014a: 732)
    towards the idea of the biological as ‘just another interactant’ (Meloni 2014a:
    742). In this new, post-genomic horizon, the social and the biological turn out
    to be increasingly porous, that ‘there is no longer biology and culture as *hybrid
    resources* (interactants) in a unified developmental system (Meloni 2014b: 606;
    italics in original).


