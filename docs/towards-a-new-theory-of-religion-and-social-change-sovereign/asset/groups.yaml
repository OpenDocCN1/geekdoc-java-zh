    FIGURE 4 Assemblage 2: The Banahaw assemblage. © Atsuhide Ito.


    ‘King of the Tagalogs’ (Ileto 2011: 58), but his reign was brief. In 1841 the
    rebellion was crushed as government troops overran the camp. Apolinario de la
    Cruz escaped to the dense forests of San Cristobal’s sister peak Mount Banahaw,
