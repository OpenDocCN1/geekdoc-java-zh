    第四个也是最后一个组合与一种新宗教的出现——天主教魅力派埃沙达伊（El Shaddai）运动有关，并由于大众媒体的传播和一种分裂的城市主义而不断扩张：新的围墙式社区和安全空间（如商场）已取代了教会-广场组合的围墙和围栏，成为菲律宾城市生活和体验的主要场所；而通过广播、电视、社交媒体和手机短信调员的人和物的离散虚拟流动，在菲律宾公众之间建立了新的局部、国家和全球传输与连接回路。我将其称为“2009年菲律宾媒体-教会组合”，因为那一年埃沙达伊在马尼拉外的帕拉纳克完成了第一座巨型教堂——国际祈祷之家的建设。埃沙达伊的大集会、广播节目、电视节目和大型教堂表演让他们能够跨越物理和虚拟空间运作，为我们之前的三个组合增加了新的连接尺度和复杂性，这完全打破了教会-广场组合受严格监管的流动：这一组合在与其他组合叠加时，重新路由了所有旧的流动，并指数级地增长了新的流动。


    每一个组合都形成了一种模式，教会-广场组合构成了根，当它们相互叠加时，会产生万花筒效应，揭示出不断变化的元素序列以及新元素的产生，特别是如里萨主义（Rizalism）和埃沙达伊这样的新宗教。重要的是，这些变化似乎是组合本身的属性，也是互动主体的主性，包括城市规划文件、死者的声音、山脉、广播和电视。必须记住，这些组合并非形成一种时间顺序（即一个组合取代上一个）：相反，它们同时存在，并将持续存在，直到它们在空间上阐述的内部、外部、流动和固体的城市及转型逻辑耗尽。


    第四章“涌现”重新审视了生成交互性的观点，并探讨了新组合——货物崇拜（Cargo Cult）的涌现。这种崇拜是殖民征服者在美拉尼西亚范围内多种元素复合相互作用的结果产生的，其中宇宙地理学构成了组合的核心。我在本章开头探讨了两种宗教创造力理论，它们属于“生活宗教”的范畴。第一种理论借鉴了马克斯·韦伯关于魅力的概念，即那种打破日常经验、预示着绝对新事物到来的能量和力量的爆发爆发。第二种理论则是生活宗教学者们部分从克劳德·莱维-斯特劳斯的“拼贴（bricol）”概念以及俄罗斯文学理论家米哈伊尔·巴赫金的“对话主义”概念中汲取的，用以探索借用、混合和即兴的日常实践，例如罗伯特·奥西在《115街的圣母》中描述的那样，他认为生活宗教是一种“文化工作”（2002:
    xix），它让身体和想象参与到一种“宗教创造力”（2002: xxii）之中。


    在魅力、对话主义和**拼贴**（bricolage）的核心——正如生活宗教理论者所采用的那样——是主体，即本书试图超越的实体。作为一种替代，“涌现”概念允许从优先考虑生成交互的角度来重新构想诸如货物崇拜等新宗教。如果说崇拜的出现当时被解释为疯狂，那么从涌现的角度对它们进行重新构想，则能够绘制出一个具有历史偶然性的组合地图。最后一章“迈向宗教与社会变革的通论”勾勒了一门能量边缘科学的轮廓，即其基本假设和方法。


