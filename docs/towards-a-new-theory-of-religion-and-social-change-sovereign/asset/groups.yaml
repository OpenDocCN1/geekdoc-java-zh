    “国际躯体”的健康可能需要“被修剪，必要时甚至被切除，以促进其他适应形式的诞生”（1994c: 361）。列维·斯特劳斯没有在一个地方指示过此类决策将如何做出或基于什么标准，除非这些将是“国际机构”的特权（同上）。


    西方作为熵增催化剂的观点与接触前文化作为抗熵者的观点相结合，成了某些法西斯主义和后现代主义对现代性疏离感的构成性主题。对于鲍德里亚来说，技术成就并不意味着一条无止境的进步弧线。他深受杜尔凯姆关于图腾社会及其通过仪式抵抗熵性内爆叙述的影响。鲍德里亚假设，在所谓的原始社会中，通过仪式和符号交换特有的爆发性能量的循环释放，规避了熵增（见
    Lotringer, Kraus and El Holti 2007: 9；另另见 Bogard 1987 和 Chen 1987）。相比之下，现代社会受到内爆性能量的影响，他认为现代社会正处于一个完全耗竭的点，其标志是堕入模拟和超真实。在《沉默多数人的阴影》（2007）中，鲍德里亚声称这种堕落是不可避免的，因为社会的基本时间形式……不再是一个进步的、扩张的或历史性的社会……进化现在只是慢了下来，它进入了一个收缩阶段，一系列新法则适用：一个处于向内爆发阶段的社会”（Gane
    1991: 130）。如果说杜尔凯姆在《原始形式》中对图腾仪式的描述是一个大量身体聚集产生一种奇特的狂欢力量或电力，那么鲍德里亚《沉默多数人的阴影》的开头几行似乎是刻意为了唤起那种仪式及其能量，只不过鲍德里亚将其所有元素都倒置了：


    整个社会的混沌星座围绕着海绵状指称旋转；那种不透明但同样透明的现实，那种虚无：大众。作为一个统计学上的水晶球，大众在物质和自然元素的意象中“随着电流和流动而旋动”。至少它们是这样向我们呈现的。它们可以被“磁化”，社会层包裹着它们，就像静电一样；但在大多数时候，恰恰如此；它们形成了一个大众，即吸收了所有社会和政治的电力并永远中和了。它们既不是政治的良导体，也不是社会的良导体，更不是广义意义的良导体。一切都流经它们，一切都使它们磁化，但弥散在它们内部而不留下一任何痕迹……它们不辐射；相反，它们吸收了来自国家、历史、文化和意义等外围星座的所有辐射。（Baudrillard
    2007: 35–6）


    对于鲍德里亚来说，通向内爆的螺旋是不可阻挡的，并且已经获得了了看似“致命的速度”（Baudrillard 2007: 74）。此外，媒体——现代社会宗教的功能性设备，以及据认为确保中心能够真正稳固的粘合剂——产生了一种反向效应：“它们并没有强化或创造‘社会关系’，相反它们是熵增过程，是社会终结的模态”（2007:
    51）。这种“反向能量”（2007: 69；原文为斜体）基于这样一个悖论：信息在扩张增长，而意义在萎缩坍塌：


    “信息将社会溶解成一种模糊状态，这种状态通向的不是创新的存在，相反而是完全的熵”（2007: 102）。


    因此，对于鲍德里亚来说，现代性正在接近耗竭，历史已经失去了动力。在宗教社会学中，最欠缺现代性进化乐观主义目的论时间观的理论是世俗化理论。该理论预测了西方基督教和宗教的终极耗竭。从鲍德里亚的角度来看，世俗化理论的错误不在于其普世主义主张或单线性，而在于它未能意识到宗教归属和认同的坍塌实际上是更广泛耗竭过程的一部分。衰落的不仅是宗教，其他一切也是如此：人们不仅停止了参与教会，也停止（见
    Putnam 2000; Stiegler 2013）。


    进化论的进步思想与世俗化的熵暗示，结合了法西斯式的民族文化纯洁观念、怀旧以及关于能量和创造力的生命主义思想。列德里亚的著作构成了这些元素的复合，他对比宗教研究的影响留下了一种将真实性和经验联系在一起的词汇。根据大卫·凯维的观点，


    列德里亚真实性观点的一个来源是他的导师内奥斯库（1890–1940）。内奥斯库是一位大学讲师、逻辑学家、形而上学家，并在几年里担任《话语》杂志的编辑。内奥斯库的哲学术语
    trăire 成了“一代”知识分子的代号，因此这一运动被称为“体验主义”。trăire 是一个存在主义概念，意味着自发地生活，通过具体的经验抵达哲学，而不是通过咨询理性主义和西方欧洲的思想潮流。（Cave
    1993: 106）。


    列德里亚对真实性和经验的重视带有这种影响印记。在对直觉和创造力的频繁引用中——这被杜比松贬为仅仅是对所有非理性和直觉经验的辩护（Dubisson 2006:
    184）——列德里亚的作品结合了一种既是个人的又是文化的精神危机，以及通过恢复与本体论真理的联系实现的可能。然而，为了让这种恢复发生，必须抵抗来自心理学家、社会学家或各种还原论意识形态信徒对宗教现实的“解释”（Eliade
    1969a: 70）。这是列德里亚为自己和宗教史预见的英雄角色，即为“全人”恢复神圣性：


    我很难相信，在我们这样的历史时刻，宗教史学家不会考虑到他们学科的创造可能性。我们如何从文化上吸收非洲、洋洋、东南亚向我们开放的精神宇宙？所有精神宇宙都有宗教起源和结构。如果不从宗教史的角度来看它们，它们将作为精神宇宙消失；它们将被还原为关于社会组织、经济制度、殖民前和殖民历史的事实。换句话说，它们将不再作为精神创作被理解；它们不会丰富西方和世界文化——它们将增加档案中已经令人恐慌的分类文件数量，等待电子计算机处理。（1969a:
    70–1；原文为斜体）


    如果说列德里亚的反还原论“遗留了一种畸形和扭曲的理性观”，即单逻辑的、工具性的作为一种统治形式，那么他的诠释学贡献了将宗教视为某种非理性和压倒性经验的想法，这种经验可以成为世界重新魔化的起点”（Tremlett
    2011b: 288–9）。然而，宗教研究不是自诩伟大人物表演其弥世主幻想的舞台，而是一门跨学科和跨领域的的社会科学。

