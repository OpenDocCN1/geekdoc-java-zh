    and Guattari 2014: 421），它一方面关注组装和形成过程中至关重要的破坏性流动，另一方面则关注去沉积和瓦解。


    当少数科学关注流动时，主流科学将流体视为固态理论的特例；当少数科学处理生成时，主流科学关注的是稳定、永恒、相同和恒常的事物；而主流科学偏好统一的或


    - 组结和生成性交互作用思维解构了诸如“宗教”（大写字母 R）等主权概念，邀请人们重新考虑它们的内部和外部，并尝试用替代性方法来描绘和取消描绘它们的边界；


    - 组结和生成性交互作用思维是实证的、现实主义的和唯物主义的：也就是说，它规定了元素的动态组结，并在空间和历史上对其进行定位，其中空间不被构想为被动的容器，而是作为一种基本元素。


    当然，变化的难题在于它既没有开始也没有结束。然而无论如何接近它，它都不可避免地向每个方向渗透，削弱任何视角。正如对变化的研究没有起点一样，它也没有终点。变化无处不在，将其孤立进行分析只能是一种高度人工化且具有推测性的尝试。它无法根据笛卡尔的原则将问题分解为最小的组成部分，以寻找直接、清晰和特定的因果关系，因为这最终只会分解并断开元素，而这些元素正因为研究对象是变化，必须被整体看待。如果元素需要被整体地视为，沿着无数代理和纤维的组织和丝线连接在一起，那么就会出现关于所调查现象的空间尺度的问题（例如，它是否跨越了局部、国家和全球的相互作用？）以及其持续时间的问题（变化无疑是时间性的，但似乎在所有方向无限流动，向侧面、后方和前方波动，因此需要人工孤立单位或捕捉浓缩时间的快照）。“组结”的概念至少具有优点，它能够对具有实证可特定空间和时间尺度的可控元素进行分析。确保，每个组结在单独存在时关于变化的揭示很少。但，通过将组结作为一种地图，并通过比较和叠加组结，我展示了宗教和社会变化是如何并非作为人类代理行为的结果，也不是基于任何推测性的目的论，而是基于人类和非人类元素在其能量流动和生成性相互作用中的组结代理性。


