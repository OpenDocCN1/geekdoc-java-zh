    ## 杜尔凯姆、图腾主义与事物的能量


    在《宗教生活的原始形式》（1915）中——这是一对澳大利亚所谓原住民宗教的研究，通常与埃斯·泰勒（E. B. Tylor）的《原始文化》结合阅读（Tremlett,
    Sutherland and Harvey 2017: 2）——杜尔凯姆关注仪式，并在此发展出了一种极具原创性和影响力的宗教理论。根据杜尔凯姆的，宗教的“首要对象”并不是“给人类提供一个世界的表征”，正如泰勒所声称的那样。相反，杜尔凯姆将宗教界定为“一套思想体系，个人用它来表征他们所属的社会，以及他们与社会之间那种模糊但亲密的关系”（1915:
    225）。这些“模糊但亲密的关系”是通过符号组织的：那些图腾精英个体感到自己正受到某种外部力量的作用。然而，这种外部力量并非任何宗教神灵或力量，而是通过图腾隐喻表示的社会本身，即他们社会的“旗帜”或“徽章”（1915:
    206）。


    根据杜尔凯姆，原住民的社会生活以两个不同阶段为特征：在第一阶段，小群体很大程度上相互独立地从事生存活动；在第二阶段，这些此前分散的群体为了举行宗教仪式而聚集。杜尔凯姆将狩猎采集的第一阶段描述为“平庸的强度”，其特征是充满了不太可能“唤醒活跃激情”的活动。因此，第一阶段的生活是“单一、萎靡且枯燥的”（Durkheim
    1915: 215）。然而，一旦群体聚集在一起，变革就发生了：


    > 聚集这一本身充当了一种极其强大的刺激物。当他们一旦聚在一起，他们的聚集就形成了一种类似电流的东西[une sort d''électricité]，迅速将他们带到一种非凡的兴奋状态……最初的冲动由此开始，并在过程中不断增长，就像雪崩在推进中增长一样。因此，这种完全不受控制的活跃激情情不不爆发……这种泛腾往往达到这样的程度，导致了难以想象的行动……它们对生理和精神生活产生了如此剧烈的超兴奋[citation]，以至于无法维持很久：行动者最终发现精疲力竭[épuisé]地倒在地上。（Durkheim
    1915: 215–16; 1960a: 308–108）


    对于杜尔凯姆来说，这种爆炸性的“泛腾”是能量以及社会性的来源。杜尔凯姆认为，“没有任何一个社会是不需要定期维护和重申那些使其统一和个性的集体情感和集体思想的”（1915:
    427），杜尔凯姆进一步暗示，这些定期组织的爆发性仪式能量释放也能维持现代世俗社会：“因此产生了仪式，”他说，“这些仪式在对象、产生的结果或实现这些结果所采用的过程上，与宗教仪式没有区别”（1915:
    427）。


    杜尔凯姆充分意识到能量的氛围，以及它产生与其所希望的增强凝聚力完全不同的效果的能力：在《分工》（2014）和《自杀》（1952）中，失范（anomie）作为内爆功能表现为无组织、解体和断裂，以及一种短路或误火。此外，在社会学院（Collège
    de Sociologie）（Richman 2003）的作品中，或许特别是乔治·巴泰（Georges Bataille）的作品中，杜尔凯姆关于爆炸性泛腾的概念被重新想象为一种越界和革命性的能量：


    > 学院……将神圣视为任何社会群体中心的离心力，并发展了一种新的[政治]活动主义概念，这种活动涉及到这种力量的释放。活动主义不仅仅是通过实际手段强迫政治变革，而是充当代理或催化剂，引发一种不可挡的感染或链反应。学院旨在通过社会体传播一种神圣的“病毒”，使神圣的完全爆发越来越近。（Grindon
    2007: 97）


    巴泰和*学院*的作品指向了杜尔凯姆作品受复杂的接受（Jenks 2003）。如果说布罗尼斯拉夫·马林诺夫斯、阿尔弗雷德·R·拉德克利夫布朗和玛丽·道格斯的英国人类学在杜尔凯姆的作品中看到了制度科学和文化系统的承诺，那么其他人，特别是在《宗教生活的原始形式》中，看到了能量和泛腾的越界、暴力和革命的潜力：


    > 结构性杜尔凯姆主义强调了隐藏的形态力量、法律限制和抽象的集体意识（collective consciousness/conscience），它们叙述了《劳动分工》，赋予《自杀》生命的机械互动与关联；而去常规化点指向稳定性、合法性和社会规范，不仅是经验现实，更是理想。激进的杜尔凯姆主义指向了创造力、泛腾[以及]超越性的仪式。（Smith
    and Alexander 2005: 5）


    然而，杜尔凯姆对图腾仪式和爆炸性泛腾的叙述的核心是客体的作用，这在很大程度上被那些“叛逆派”杜尔凯姆主义者所忽略。例如，在《原始形式》中，他多次提到“丘鲁林加”（churinga）：


    > [丘鲁林加]是木块或磨光的石块，形状多种多样，但通常是椭圆形或长方形。每个图腾群体都有若干多或不重要的这类物品。在每件物品上都刻有一个代表该群体相同图腾的图案。某些丘鲁林加的一端有一个洞，穿过一根人发或负鼠毛。那些用木制并像这样穿孔的，其用途与英国民族学家命名为“鸣鼓”的那些崇拜器具完全相同。（1915:
    119；原文中为斜体）


    根据杜尔凯姆，丘鲁林加是神圣物体（1915: 120），拥有多种力量，包括治愈病人的力量（1915: 121）。还有逐渐消失的 nurtunja，由各种材料组装成的结构，用于“标记仪式的中心点；舞蹈在那里举行，仪式在那里进行”（1915:
    124）。所有这些物体都是神圣的，它们的神圣性源于“它们刻有图腾徽章”（1915: 126），根据杜尔凯姆的观点，正是通过这些物体，个体才开始认为自己是离散的图腾社会群体的成员。

