    Apolinario had appeared, along with the Virgin Mary, to several people urging
    them to re-establish the Cofradia. When I did fieldwork in the mountains in 1999–2000,
    locals told me that Apolinario returned as one of the Santong Boces (Holy Voices),
    and that these voices guided pilgrims like Amador Suarez, who established the
    Ciudad Mistica de Dios on the lower slopes of Mount Banahaw in the early 1950s.


    A key feature of the Cofradia, and the various religious and millenarian insurctions
    of the nineteenth-century Philippines, was how conceptions of spiritual power
    and notions of millenarian, apocalyptic time combined to up-route ‘families ...
    from the often closely knit kinship systems of the towns’, separating ‘men and
    women ... from their spouses, children or parents’, to bring them ‘together in
    a new society’ (Ileto 2011: 60). According to Ilto, these uprisings and the communities
    established the possibility of ‘not just a counterculture, a counterstructure’
    (Ileto 1999: 194) to the Spanish colonial state. These counter-structures emerged
    around a charismatic leader who claims authorized the irruption of these other,
    millenarian temporalities and animistic conceptions of power.


    In ‘Rural Life in a Time of Revolution’ (1998a) Ileto juxtaposes some of the Spanish
    towns of the provinces of Laguna and Quezon (Tiong, Dolores, Sariaya and San Pablo
    City) with Mount Banahaw and Mount San Cristobal, describing the latter as ‘a
    third realm’ (Ileto 1998a: 85). According to Ilto, both the towns with their churches
    and priests at their centres – like the mountain in their midst with their mangagamag
    (healers), supremas (religious leaders), mangukulam (sorcerers) and their reputation
    as a repository for powerful objects known as anting-anting (amulets) – constitute
    competing gravitational centres dependent upon different forms of energy to draw
    and maintain people and things in their orbit. Importantly, Ileto does not simply
    oppose these different attractors – the lowland town as against the upland counterstructure
    – but highlights the extent to which Filipinos flowed across these different spaces:'
