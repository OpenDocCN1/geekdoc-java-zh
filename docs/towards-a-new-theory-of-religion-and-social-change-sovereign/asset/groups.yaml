    ## Occupy Democracy


    On the afternoon of Friday 17 October 2014, activists gathered in Whitehall, London,
    for what was planned as a week-long occupation of Parliament Square. A general
    election was on the horizon (it was held on 7 May the following year) while 15
    October was the anniversary of the establishment of the Occupy London camp near
    St Paul''s Cathedral in 2011 and indeed the occupation of over 900 urban sites
    in eighty countries by the wider Occupy movement on the same day.


    Occupy Democracy can be situated within the recent history of the so-called Global
    Justice Movement that has sought to contest neo-liberalism, a form of capitalism
    that is characterized, by the Global Justice Movement, in terms of the socialization
    of risk and the privatization of profit (Mertes 2010: 78). In the UK, for example,
    the official solution to the 2007–8 global financial crisis was found, by national
    political elites, in the use of public money to bail out the stricken banks. The
    solution effectively meant that the pursuit of private profit by global banks
    and other financial institutions would thereafter be underwritten by the British
    public. The legitimacy of this course of action was found in a discourse of austerity
    which re-framed the global crisis into an instance of national property (too much
    money had been frittered away on public libraries and benefits for the out of
    work and the disabled) that could only be addressed through collective belt-tightening.
    Of course, the belt-tightening was hardly collective at all: the rich prospered
    at the expense of everyone else, while libraries closed and deprivation and inequality
    exploded.


    ## 36 TOWARDS A NEW THEORY OF RELIGION AND SOCIAL CHANGE


    Since the late 1990s anti-capitalist protests have been notable for their use
    of social media ''to build networks to share information, tactics, strategies
    of opposition, and alternative economic practices'' (Mertes 2010: 79). Among others,
    Manuel Castells has characterized the Occupy movement in terms of the emergence
    of ''hybrid public space made up of digital social networks of a newly created
    urban community'' (Castells 2012: 45). The movement of the camps it inspired are
    examples of new teritorializations of space that transgress the boundaries and
    sovereigies of the nation-state by occupying multiple physical and virtual spaces
    simultaneously (see Chandler 2007). Groups as Occupy Democracy are, according,
    to the parameters of this analytic frame, symptomatic of local and global fractures
    as state-level sovereogeneities and territorialities crack and when technologies
    make possible articulation of new physical and virtual territories. Importantly,
    The Occupy movement was more than just a vehicle for protest: the urban camps
    it generated were experiments designed to pilot alternative forms of political
    decision-making, exchange and place-making.


    The Occupy Democracy protest was organized by veterans of the Occupy London camp
    seeking not only to mark the third anniversary of the global wave of Occupy protests
    they had been a part of, but also to launch a series of experiments in democracy
    through the staging of debates with politicians, celebrities, activists, academics
    and others, about issues such as austerity, fracking and the future of democracy
    itself. These debates were characterized by the discussion of points of view on
    the economy, the environment and democracy which, at that time, were rarely presented
    in British mainstream media and political discourse. Nevertheless, they unfolded
    in a manner familiar to democratic, liberal political traditions: a speaker made
    an evidence-based argument and a public had the opportunity to discuss, contest,
    reject or modify the points made by the speaker. If the proximity of this notably
    liberal conception of political reason to Occupy political practices is notable,
    so is the fact that objects were never far away both in terms of the materiality
    of the ENERGY protest itself but also in terms of the space in which the protest
    unfolded and was performed, namely Parliament Square with its iconic architectures
    and monuments.


    Activists had hoped that they would be allowed to stage their protest and the
    various events they had planned on the grass in the centre of Parliament Square,
    although they knew this would bring them into confrontation with the police and
    the heritage wardens. However, they hoped that their explicitly self-declared
    peaceful and time-limited protest would be allowed to proceed without interference.
    Activists did spend a few hours on the grass in the centre of the square on the
    Friday night, but by Saturday morning they had confined to a narrow strip of pavement
    on the south side of the square and to a narrow, raised grass area running down
    its eastern side, where they remained for the most part, for six more days.


    ![](img/91d03b06161479dec764992b403c4aec_47_0.png)


    FIGURE 1 Occupy Democracy protestors take the centre of Parliament Square, 17
    October 2014. Source: author.


    Activists spent much of Saturday waiting to be joined by what was rumoured at
    the time to be a sizeable contingent of black block anarchists and Kurdish activists
    who, that afternoon, were participating in a large Trades Union (TUC) march through
    central London. While the Occupy Democracy protestors waited, the heritage wardens
    – accompanied by police – circulated the fringes of the protest seizing unguarded
    placards and banners and destroying them. These actions continued throughout the
    morning and afternoon leading later to the destruction of two large towers brought
    to the square by activists who had carried them from the square, who joined the
    Occupy Democracy to the grass at the centre of the square. The acts of seizure
    and destruction by the wardens were justified legally on the basis that


    ![](img/91d03b06161479dec764992b403c4aec_49_0.png)


    FIGURE 2 Occupy Democracy protesters briefly re-take Parliament Square, 18 October
    2014. Source: author.


    the protesters did not have the right to do with accompanying forms of material
    culture such as banners, tents, tarpaulins, camp chairs or, specifically, anything
    that might be of use to persons seeking protection from the weather. In addition,
    it is worth noting that protest objects and structures are by no means always
    treated this way: in 2008, English Heritage in the Peak District National Park
    commissioned a team of archaeologists to document the Leeds Cross and Endcliffe
    protest camp because of the camp''s implication in the history of a landscape
    that protesters had sought to preserve (see Badock and Johnston 2009). Moreover,
    the Disobedient Objects exhibition held at the Victoria and Albert Museum in London
    which ran from 26 July 2014 until 1 February the following year, displayed a collection
    of protest objects at a site conventionally associated with high art (see Flood
    and Grindon 2014; Soar and Tremlett 2017). In previous research on Occupy camps
