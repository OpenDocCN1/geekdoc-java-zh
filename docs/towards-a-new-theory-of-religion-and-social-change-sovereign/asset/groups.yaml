    ## INTRODUCTION


    with an historical example such as the 1789 French revolution, where one might
    want to plot the tipping point at which a solid, institutionalized religion (the
    Catholic Church in France) lost its structural integrity such that, by the 1830s
    and 1840s, a panoply of previously unthinkable religious experiments had either
    been tried or were underway from the Cult of Reason to the Supreme Being, to the
    Religion of Newton, the Sacred College of Saint-Amand Bazard and Barthélemy-Prosper
    Enfant, and the Icarians, and the Religion of Humanity. It could be argued that
    the heat of the revolution had excited the vibrant particles of eighteenth-century
    French culture and society to such an extent that old interactions began to generate
    new things which, in turn, because those new things had been introduced and added
    to the mix, set off new interactions ... you get the idea. It does not matter
    that none of the experiments listed above survived for very long the cumulative
    effect of those experiments was sufficient to re-wire the constitution of both
    the Catholic Church in France and French society more widely.


    According to Carlo Rovelli, in quantum physics and chemistry, when two particles
    interact, something new is generated through that interaction:


    > We have arrived very far from the mechanical world of Newton and Laplace, where
    minute cold stones travelled on long precise trajectories in geometrically immutable
    state. Quantum mechanics and experiments with particles have taught us that the
    world is a continuous, restless swarming of things; a continuous coming to light
    and disappearance of ephemeral entities ... A world of happenings, not of things
    ... There is no longer space which ''contains'' the world, and there is no longer
    time ''in'' which events occur. There are only elementary processes wherein quanta
    of space and matter continually interact with each other. (Rovelli 2014: 31, 42)


    When hydrogen and oxygen interact, water is formed. Significantly, water is a
    liquid while hydrogen and oxygen are both gases (DeLanda 2011). Does


    ## TOWARDS A NEW THEORY OF RELIGION AND SOCIAL CHANGE


    the quantum world of generative interaction offer a point of departure for thinking
    about religion and social change?


    Maria Nita’s Praying and Campaigning with Environmental Christians provides what
    she calls a ‘snapshot of the climate movement’ (2016: 227) in Britain between
    the disappointment (if not betrayal) of the 2009 climate summit in Copenhagen
    to the (tempered) optimism of the summit in Paris six years later. During that
    period Nita conducted ethnographic research with an array of groups from Christian
    anarchists such as Isaiah 58 to green Christians as Operation Noah, participating
    in and observing climate marches, climate camps as well as workshops and related
    gatherings and events. Nita outlines an ‘attractor model’ (2016: 66) to describe
    the self-organizing networks of the movement and the entanglements of the various
    Christian and non-Christian activists involved in it. She represents the model
    through the visual metaphor of ‘the spiral structure of a galaxy’ (2016: 70) and
    with reference to the ‘field of physics’ (2016: 229), deploying these metaphors
    and ideas to envision the processes whereby secular and Christian groups coalesced
    together to participate in climate activism and in the process assemble new forms
    of religion, protest, culture and experience. In short, Nita alerts to the collisions,
    frictions and interactions of climate science, political protest and Christianities
    and the extent to which these collisions, frictions and interactions generated
    new hybrid formations of religion, culture and the secular.


    It is this general assumption – that interaction is generative – which forms the
    conceptual centre of this book. It might be argued that interaction is an apt
    metaphor anywhere for the way the lived religion thesis seeks – through close
    qualitative analysis of lived religious lives – make sense of. Perhaps. Certainly
    ideas such as *bricolage* aim to capture a general sense of play and experiment
    as individuals creatively configure and re-configure the different threads (or
    particles) of their religious lives. It is precisely through these acts and moments
    of wonder and creation that – so the advocates of the lived religion thesis assume
    – the sacred is revealed. But the lived religion thesis has


    ## INTRODUCTION


    at least one insuperable problem: even if it is accepted that the thesis alludes
    to the kinds of quantum interactions suggested above, there is, for the most part,
    little or nothing sustainably or durably new that is created as a result, though
    their cumulative effects might yet generate more visible change. But the only
    thing that appears to survive religion’s individual creators is the act of making
    itself, the knowledge of which is distributed anyway among political activists,
    particularly anarchists, musicians and artists, and consequently its salience
    to religions and the sacred is, at best, ambiguous (Graeber 2007; Shukait, Graeber
    and Biddle 2007; Wanless 2019). Of course the lived religion thesis also assumes
    interactivity around a stable, center and organizing node called the subject,
    a move which keeps the interaction but controls or removes all the interesting
    and unpredictable, quantum bits.


    It might equally argued that the interactivity metaphor is apt for the reality
    that the secularization thesis seeks to empirically describe and analyse. Again,
    perhaps. the problem for the secularization thesis is not that it does not model
    the complex interactions of multiple particles (religion, individualism, the state,
    the market, Enlightenment, secularism and so on and so forth) that the interactions
    appear to have no effect on the participating elements which are assumed to be
    real, irreducible wholes. As such, neither the religion particle nor the other
    particles are changed by their interactions; there is simply either less or more
    of them as a result. Again, the exciting part – the quantum part with its unpredictability
    and generativity – is tamed away to nothing. This state of affairs is not altered
    by Berger’s initially promising paradigm of the plural – the pluralism of religious
    options existing in the same society – [and] the pluralism of the secular discourse
    and the various religious discourses, also existing in the same society’ (Berger
    2014: 53) – which seems to set up the social as a space of interactivity. Ultimately,
    however, Berger seeks something like a special formula for managing interactions
    rather than for exploring their possibilities (see Berking, Steets and Schwenk
    2018).


    If methodological animism and fetishism, assemblages and generative interactivity
    constitute a point of departure for the study of religion and social change, what
    of religion? ‘How do we make a disabling term,’ asks David Chidester, ‘which bears
    [a] legacy of ambiguity, colonialism, and imperialism, an enabling vortex for
    thinking?’ (Chidester 2018: 1). One way forward might be to think of religions
    in terms of flows and flows. Indeed, if the temporarness of religious forms is
    foregrounded then the focus of analysis can be concentrated at the moments of
    hardening and coagulation on the one hand, and at the moments of disintegration
    and dispersal on the other as a means of capturing fleetingly – the becomes and
    unbecomings of religions. There is already interesting research being conducted
    in this area (for example, Coggins 2018; Robertson 2017; Stewart 2017; Thomas
    2019; Wanliss 2019) is opening up what can be thought of as religions precisely
    by complicating the boundaries of the term and by attending to the points at which
    religious forms harden and the points at which they melt, break down and begin
    to flow and take on new shapes (see also Gilhus and Sutcliffe 2013: 260 and compare
    with Bruce 2002: 199–203).


    It might be argued that form and flow is nothing new. After all, much of the history
    of the study of religions has been precisely concerned with a temporal procession
    of religious and social forms. The late nineteenth and early twentieth-century
    fascination with evolutionary and developmental narratives of progress postulated
    successions of forms of religion and institutions such as marriage and the state,
    evolving through time. Animism, fetishism, magic and totemism were all contenders
