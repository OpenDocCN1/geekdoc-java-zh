    Catholic missionary activity continued in the islands even though they were now
    under Dutch jurisdiction. But, with colonial policy objectives shifting, the beginning
    of the twentieth century saw the Dutch seeking to make the islands more profitable:
    they planted new export crops, imposed new taxes and built new roads to open the
    islands up further to the gaze of the colonial state. The period saw a concomitant
    increase in Catholic missionary activity in the area, with the number of missionaries
    rising from 52 in 1911 to 222 in 1939


