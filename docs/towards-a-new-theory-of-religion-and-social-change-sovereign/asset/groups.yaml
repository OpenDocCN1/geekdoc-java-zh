    the insistence on seeing the social as a terrain of struggle, and on knowledge
    amidst those struggles, means that the concept of ideology can acquire a different
    weight: rather than a means of measuring truth it can instead indicate the problem
    of the opacity of the social to enquiry – and perhaps the capacity of contingent
    social and religious elements to interact and generate unexpected forms. However,
    the inevitable result of this move is to remove the privileged perspective on
    the social that Marxism once claimed to offer.


