    ## AFTERWORD: ASSEMBLAGE DRAWINGS 159


    simultaneously decomposing themselves before becoming a system. Hierarchy is constructed
    though it is no longer a vertical one, only visible as concentration of power
    and de-concentration, while each element averts against the systemic structure
    and flees from the gravitational and topological structuring. The viewer of the
    drawing is tasked an optic exercise to decipher patterns in the structuring and
    de-structuring, this un-structuring fragments that are short of producing a system.
    Drawing for an artist is this task of letting the undetectable structuring of
    power appear in the domain of visibility. Hito Steyer (2017) discusses how aphenia,
    an ability to perceive patterns in background noise, is a skill that helps us
    see beyond the facade of reality organized through electronic networks of pulses
    and data. In a network society, marks are no longer located in the pictorial scheme
    organized according to geographical coordinates, or the division between the celestial
    and the ground.


    Deleuze''s notion of assemblage, when referring to the drawings, is a snapshot
    of a configuration of power at a given moment. Different from Gerald Raun''s (2010)
    reading of machinic assemblage as a concatenation of social resistance and a formation
    of inventive alliances, I stay with the specific reference to the drawings that
    the changing configurations of power are framed like a snapshot at a given moment.
    How Deleuze explains the diagram in his book about Francis Bacon provides some
    guidance. To follow his notion of diagram assemblage is a configuration of forces
    in a synchronous diagram. It is a film that captures invisible power struggles.
    Of course, Deleuze does not mean that the diagram is an illustration in the sense
    of an annotative aid. A diagram does not serve ideas, but it itself is an idea
    in its image and its materiality. Appadurai''s notion of flow is useful as power
    and influences are dispersed and acquired, adopted and deployed. However, different
    from the notion of flow, the assemblage through Tremlett''s includes struggles
    and flights rather than the flows that are organized through relatively established
    networks. To visualize a configuration of power, the artist attempts to map out
    movements of forces in a power struggle.


    In effect the outcome is a skeletonized power-scape, that captures emerging flows
    but also clashes of power. Suffice to mention Jacques Lacan''s (1977) discussion
    of the phallus in which power is not held by an authorial agent in terms of relational
    forces that are played out, negotiated, imposed and resisted. In other words,
    it is constantly changing shape, intensity, speed, direction and impact. In the
    assemblage drawings I did not intend to capture but imagine them through Trem''s
    writing and let them materially emerge in the form of drawing. When drawing is
    understood as a form of hunting a prey, as Thomas Zimmer (2012) suggests, in the
    act of drawing, the artist attempts to capture a scene, or a figure. For instance,
    a drawing of a figure in motion becomes an exercise of capturing the figure in
    motion. In this sense drawing is an act of the hunter throwing a lasso around
    an animal. Consequently the drawing attempts to captivate and arrest the viewer.
    The act of drawing as hunting and a piece of drawing as a catch seems fitting,
    but at the same time, the metaphor conceals the artist-hunter''s presence in the
    close encounter with the prey as the viewer focuses on the captured. When the
    event of drawing is an act of capture the artist-hunter in fact stands proximal
    to the prey. Similarly both Deleuze and Tremlett participate in the historical
    process of territorialization, de-territorialization and reterritorialization
    with their analysis of power. For my part, while carrying the task of drawing
    I have attempted to produce images of power by relying on lines as my weapon of
    choice – although, perhaps, ''weapon'' is an exaggeration even when a drawing
    is thought of as a visual assault on the senses. By adopting Zimmer''s metaphor
    of drawing as an act of hunting a prey, mistakenly I would be suggesting knowledge
    as-other –that is, the shifting power-scape, ready to be captured. Instead, to
    reflect more sincerely on my experience of making assemblage drawings, I was trapped
    in the unknowness like a prey since the request for the drawings was made. In
    the process, I have gone through technical frustrations when I was not able to
    see what I wanted to see when drawing, and also had delightful moments when accidental
    marks led to surprising results. In this particular sense, drawing as much as
    assemblage is a production of knowledge out of un-knowingness, an attempt to see
    more than one is routinely possible to see, and grasp the imperceptible configurations
    of power.


