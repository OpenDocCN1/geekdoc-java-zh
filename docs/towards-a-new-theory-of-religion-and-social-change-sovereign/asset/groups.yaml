    Significant too is the idea of a hierarchy of the sciences that is cultivated
    in cognitive theory, ranging from the most to the least scientific, and where
    the cultural, social, psychological and historical disciplines only attain status
    as sciences once they have been reconfigured through the lens of Darwinian evolutionary
    theory, or perhaps slightly more diplomatically, when ‘researchers ... take advantage
    of the parallels between biological and cultural change to model a science of
    culture along the lines of evolutionary biology’ (Mesoudi, White and Inland 2007:
    18; see also Tooby and Cosmides 1992; Ingold 2007a). Of course, neither cognitive
    psychologists nor atheists reflect upon their science: no Thomas Kuhn (1970),
    Paul Feyerabend (2010), Imre Lakatos (1978) or God forbid, Donna Haraway (1991a;
    1991b), Genevieve Lloyd (1993), Sandra Harding (2004) or Linda Tuhiwat Smith (1999).
    So, the experiment proposed here is to to mix an alternative biological imaginary
    drawn from Deleuze and Guattari’s (2014) idea of the rhizome and the body without
    organs.


    Deleuze and Guattari’s work reflects elements of so-called vitalism through post-structuralist
    French thought. Earlier forms of vitalism eulized experience and railed against
    what was perceived as the mechanistic reduction of imagination and creativity
    occasioned by industrial, urban modernity. Vitalism bundled together conceptions
    of teleology, autonomy, self-organization, entelechy and the idea of a life spark,
    sometimes divinely ignited, against nineteenth-century scientism and capitalism
    (cf. Eliad 1969a: 70–1). Converging with post-structuralist interests in non-linearity
    and Deleuze and Guattari’s ideas have been influential upon the thinking of Jane
    Bennett, Manuel DeLanda, Donna Haraway, Tim Ingold and Bruno Latour, among others.¹
    The body without organs and the rhizome support a counter-biology, a biology without
    subject, a de-territorializing biology that deals not in hard essences but in
    flows, assemblages and contingent articulations. As such, I include the chapter
    with what I call the Flores assemblage, a hybrid of adat, Catholicism, development,
    megaliths, nationalism, so-called traditional religion and tourism. The purpose


    ## BIOLOGY


    of this example is to demonstrate firstly the entanglement of religions practices
    and performances that might conventionally be understood as outside the purview
    of the study of religions and, secondly, to explore the plurality of simultaneous
    religious and secular identifications that productively disturb the idea of religions
    as discrete traditions that define singular identities. To pull at just one of
    the elements of the assemblage: are the Catholics of Flores members of an unbroken
    chain of Christian religious tradition or, rather, they participants within a
    Flores Christianity that is exquisitely inseparable from the other components
    of the assemblage?


    ## ‘Darwinism makes it possible’


    R. R. Marett’s memorable phrase ‘Darwinism makes it possible’ (Marett 1912: 8)
    was an answer to the question, ‘what is anthropology?’. For Marett, anthropology
    and ‘Darwinism’ shared the assumption that ‘all forms of life in the world are
    related together and that these relations were ‘sufficiently uniform to be described
    under a general formula or law of evolution’ (1912: 9). According to Eric Sharpe,
    one of the consequences of this assumption was that, where one religion had been
    understood as a ‘revealed truth’, it thereafter became a ‘developing organism’
    (Sharpe 1986: 48; see also Cox 2006: 70–1), conceivable as something living, growing,
    changing and dying according to the same evolutionary laws of development, and
    knowable through following the same kinds of natural scientific methodologies
    that had been pursued by Darwin in his work about plants and animals in On the
    Origin of Species (1859). For Frazer, the theory of evolution was the foundation
    for a ‘mental anthropology’ which had emerged almost immediately [after] the promulgation
    of the evolution theory by Darwin and Wallace in 1859. I think I am right in saying
    that the foundation of anthropological societies at home and abroad has everywhere
    been subsequent to that date and has followed it often at very short intervals.
    Be that it is, the theory of the gradual evolution of man out of a long series
    of inferior forms of animal life is now generally accepted, though diversity of
    opinion still prevails at the precise mode in which the evolution has been brought
    about. It is this conception of evolution which supplies a basis for the modern
    science of anthropology. (Frazer 1931: 235–6)


    Certainly Darwin''s discoveries opened up a completely new way of understanding
    the world, yet Durheim, Frazer, Spencer, and Tyler held views about religion,
    change and development that were hardly Darwinian at all, including the notion
    of linear, developmental progress that could be plotted along a single line. European
    thinkers had already postulated, in the mid-eighteenth century, a linear and sequential
    conception of history that challenged biblical ideas of degeneration from an original
    state of perfection. By contrast, Darwinian evolution described processes of adaptation
    to unpredictable environmental shifts and random mutations, which meant that even
    if species had a common origin they would develop along endlessly bifurcating
    lines if and they became isolated, in different environmental contexts (Kuper
    1988: 3). Yet, Durheim, Frazer, Spencer and Tyler saw themselves as evolution''s
    heirs, charged with the task of bringing its insights to the study of society
    and religion and, as such, they did not regard their appeals to biology as being
    merely literary or metaphorical. By the same token, those appeals were imaginative,
    marked by sweeping leaps across domains of society, religion and nature which
    had previously been seen as separate and unconnected.


    For Spencer, the appeal to biology was premised on the idea that social and natural
    forms might be explored by a single science. In the essay ‘Transcendental Physiology’
    (1890a) he outlined a synthetic perspective aimed towards a comparative analysis
    of the structure of forms:


    It is becoming clear that the general principles of development and structure
    displayed in organized bodies are displayed in societies also. The fundamental
    characteristic both of societies and living creatures, is, that they consist of
    mutually-dependent parts; and it would seem that this involves a community of
    various other characteristics. Those who are acquainted with the broad facts of
    both physiology and sociology, are beginning to recognize this correspondence
    not as a plausible fancy, but as a scientific truth. (Spencer 1890a: 60)


    For Spencer, physiology and sociology were dealing with the same processes by
    which entities developed, and in his essay "The Social Organism" (1890b), he proposed
    a series of analogies through which the growth of organic bodies could be seen
    as laying a template for the development of social and political bodies. For example,
    he compared the spontaneous divisions and aggregations of protozoa to aboriginal
    groups, the blood and the circulatory networks of living bodies to the circulations
    of commodities in modern societies, and the nervous system to telegraph and railway
    systems. These comparisons were clearly neither neutral nor simply comparisons:
    they were also rankings by which biological and social developments could be conceptualized
    through the politically charged lens of progress. Moreover, they allowed Spencer
    to confidently claim that across both the social and the biological realms, the
    principles of organization are the same (Spencer 1890b: 164). For Spencer, society
    was not a product of human action but emerged out of a ‘general developmental
    process’ (1890b: 159) that shared with biology the tendency to assume, ‘in the
    course of … growth, a continually increasing complexity of structure’ (1890b:
    161). Like Spencer, Durkheim took the view that the new sciences of biology and
    sociology were analysing processes that were more than merely similar in kind
    or lending themselves to metaphorical association. Durkheim’s appeals to biology
    were, like Spencer’s, premised upon the idea of a fundamental unity of biological
    and social realms.

