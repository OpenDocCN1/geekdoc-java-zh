    for the purposes of celebrating a religious rite. Durkheim characterizes the first
    phase of hunting and gathering as ‘mediocre intensity’ and as being marked by
    activities unlikely ''to awaken lively passions''. Life in the first phase is,
    as such, ''uniform, languishing and dull'' (Durkheim 1915: 215). However, once
    the groups have come together, a transformation occurs:


    > The very fact of the concentration acts as an exceptionally powerful stimulant.
    When they are once come together, a sort of electricity [une sort d''électricité]
