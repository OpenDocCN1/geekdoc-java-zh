    what has been variously termed ''liquid religion'', ''lived religion'', ''implicit
    religion'' and ''vernacular religion'' constitutes a certain celebration of religions
    as flows of ever-changing combinations of elements, assembled together by creative
    individuals in the biographical streams of their lives. It marks a considerable
    departure from the quantitative sociology of the lives of Steve Bruce and David
    Voas and their implicit assumption that, when it comes to religions, only the
    solid is significant. For Bruce and Voas, the fact of secularization - the fact
    of the successive, generational thinning out of institutional, religious populations
    particularly in the national churches of northwestern Europe - points unambiguously
    to the conclusion that religious institutions will soon experience a level of
    population density so low that institutional transmission and reproduction will
    soon be impossible. On the one hand, then, there is lived religion hypothesis
    which proposes a permanent state of religious liquidity or becoming that is implicated
    in the biographies of individuals to such an exquisite degree of minuteness, that
    processes of coagulation or calcification never occur. This, however, is not a
    realistic position. On the other hand, there is the secularization thesis which
    discounts the significance of liquidity altogether, and wets itself solely to
    the analysis of institutional solids and their disintegration. This is also an
    unrealistic position and neither is it mitigated much by Stark and Bainbridge''s
    oscillation model of secularization (Stark and Bainbridge 1987).


    The objective of this chapter is to offer a radically different account of religious
    and social change and, as such, I trace three steps: in the first I address the
    work of Karl Marx and, in particular, his attempt to model processes of social
    change. In the second, I turn to the work of Claude Levi-Strauss and the structural
    model of myths and their transformation. Both of these models anticipate change
    according to certain interactions of elements, interactions that occur without,
    necessarily, the agency of any subject. In the third and most substantial part
    of this chapter, I flesh out a set of four Christo-Filipino assemblages. Each
    assemblage is constituted spatially and each appears to be a transformation of
    the others. They do not play into any fable of progress or sorry tale of entropic
    despair. They avoid the methodological errors made by proponents of liquid, lived
    and vernacular religion, which are consistently marked by the positing of the
    meaning-rational-choice making individual as the unit of analysis and as the agent
    of change. Here, change is the property of the assemblage and of the energy of
    its human and non-human elements and their interactions. The privileging of the
    assemblage also sidelines the methodological mistakes made by supporters of the
    secularization thesis for which religious and social change occurs according to
    a doubtful teleology of religious deconsolidation, which depends on the idea of
    the individual as a unitary entity where belief and action are in perfect harmony.
    The assemblage, indeed, allows for a precise plotting of the transition or tipping
    points between solid and liquid forms – when one assemblage transforms and generates
    new versions of itself.


    ## Marx and change


    Marxism encompasses less a single tradition or body of theory than intersecting
    strands of Leninist, Trotskyist, Gramscian, critical, neo- and post-Marxist interpretations
    and legacies. I am interested in the ‘Marxism without guarantees’ of the kind
    proposed by Stuart Hall (Hall 1983) and the sophisticated, post-structural re-thinking
    of key aspects of Marx’s work – notably his ideas about history and ideology –
    by Chantal Mouffe and Ernesto Laclau (Laclau and Mouffe 1985; Laclau 1990). For
    example, in *New Reflections on the Revolution of Our Time*, Laclau contrasts
    Marx’s descriptions of social and historical change in *The Communist Manifesto*,
    with that in the Preface to *A Critique of Political Economy*. Laclau argues that
    in the *Manifesto* Marx privileges society as a site of struggle, suggesting that
    the social is never closed but is always open to the possibility of change. Importantly,
    this is ‘not as the result of the empirical impossibility of its specific coherence
    being fulfilled, but as something that “works” within the structure from the beginning’
    (Laclau 1990: 29). Like a Derridean text under deconstruction, the Laclau-Marxist
    historically contingent social formation is already prey to forces of change by
    ripples and perturbations and the possibility that the ‘slight movement produces
    a revolution out of nothing’ (Derrida 1997: 257).


    In the Preface, by contrast, Marx frames social change in terms of a pair of closed,
    pre-determined levels of analysis – that is, base and superstructure – and in
    terms of the specification of a limited set of primary and secondary linear relations
