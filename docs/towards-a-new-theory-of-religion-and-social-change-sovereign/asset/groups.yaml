    # BIOLOGY


    certain political discourses and practices have achieved the valuable status of
    legitimacy as the same “thing” (i.e. Christianity) (Nye 2000: 467–8), or in short,
    the processes, sites and occasions through which Christianity is produced (and
    produces itself) as an object that can be disentangled from the social contexts
    in which it is embedded.


    These kinds of questions are not idle, theoretical speculations. The emergence
    of different Christianities in different regions of the world, and the multiple,
    overlapping scales of local, national and global connections they have set in
    motion, bring to the fore the intellectual hazards of assuming the existence of
    any discrete, coherent and continuous, singular object called Christianity. As
    such, Francisco (2018), Cannell (2006) and Nye (2000) open the door to an approach
    that begins not with a fixed form but with historical, ethnographic and rhizomatic
    flows and coagulations. In what follows I apply these methodological ideas to
    a Southeast Asian Christianity.


    # The Flores assemblage


    Flores is a small island towards the eastern end of the Indonesian archipelago
    with a complex history. In 1859 the Dutch conducted negotiations with the Portuguese
