    关于社会对其结构性问题以及解决这些问题的某些解决方案。事实上，在费尔迪南·埃·马科斯（Ferdinand E. Marcos）于1972年戒严后，越来越多的神父、神学生和宗教人士积极与民族民主阵线（NDF）合作，而另一些人甚至在新人民（NPA）内部拿起了武器。


    20世纪30年代，菲律宾共产主义者将神父和神学生称为“教士法西斯主义”（Bolasco 1994a: 235），认为教会是封建残余，一旦革命发生就会枯萎凋零。事实上，天主教会在西班牙内战（1936–39）期间对弗朗哥的支持，使教会在此期间坚定且积极地站在反对共产主义的一边，将其视为一种危险的世俗主义邪教。同样，在20世纪50年代，教会内部的主导立场是反对一切菲律宾社会世俗化的倾向。人们认为，世俗化将致命地削弱国家的道德结构，并引发共产主义的接管。然而，马科斯1972年的戒严令导致菲律宾教会内部的一些元素——这些早已已被梵蒂冈二会议激进化的元素——开始与其他宗教团体以及民族民主阵线对话：


    神父、修女、神学生、牧师以及年轻的基督徒男女已经开始远离被接受的教会社会行动模式。在寻找替代方案的过程中，这个普世小组最终与他们被训练恐惧数十年的马克思主义者面对面。他们不再那么具有防御性，而是面对着毛泽主义对菲律宾基督徒提出的具体挑战。在整个1971年，他们一直在探测。1971年9月，在巴奎奥（Baguio）举行的一次研讨会上，“国家解放基督徒”（CNL）这一组织运动团体正式成立……1972年2月，在举行为期两天的研讨会后，CNL正式宣布与民族民主阵线（NDF）结盟。1972年8月，他们举行了第一次全国大会。1974年，CNL被宣布为一个群众组织，负责开展“特别是在礼仪、神学和宗教生活领域的‘国家民主和文化革命’”。这是一场为了“福音的社会化应用”的斗争。（Bolasco
    1994a: 247）


    教会后来在导致马科斯及其家族遭受耻辱流亡的起义中发挥了关键作用（另见 Bolasco 1994b；Guan 2018: 190）。然而，一旦“人民力量”得到证实，教会阶层就正式与NDF和CNL划清了界。尽管如此，教会与穷人的接触产生了一系列神学实验，其中与农村和当地的接触占据了中心舞台。例如，Heather
    Lynn Claussen（2001）详细描述了本尼笃会传教修女会（Missionary Benedictine Sisters），这些被梵蒂冈二会议激进化的修女，以及马科斯时期的氛围。Claussen强调了她们经常前往巴纳奥山（Mount
    Banaw）访问最高院长（Suprema）和上帝之城（Ciudad Mistica de Dios）。Claussen的这些“不合常俗”的姐妹们，正在追求一种植根于殖民前菲律宾叙事的菲律宾女性主义，这种叙事源于那些神话化的女性宗教专家和领袖，也通过当代女性宗教领袖的榜样，例如上帝之城的其中一位院长。


    耶稣会神学家也经常前往巴纳奥山，以此重新思考他们处理如巴纳奥山等空间存在的即兴和非制度化宗教性和灵性的方法。


    [对菲律宾当地宗教信仰的研究]源于1979年第一学期在马尼拉圣登大学洛悠拉神学学院（Loyola School of Theology）的一场研讨会工作坊。参与者们试图将Longaner的“神学方法”应用于菲律宾本土化的具体问题。这些问题被初步地情境化为两种文化之间的极对立——更具西方化与较不西方化的菲律宾文化之间、城市化的少数群体与农村的大多数基督徒人口之间、官方宗教与民间宗教信仰之间。这种文化对立被视为该国四百年殖民历史的一个重要方面。参与者们认为，梵蒂冈二会议之前的民间虔诚虽然记录详详，但缺乏对梵蒂冈二会议的文化多元性的见解；这些未经批判的人假设中世纪西欧文化或工业化国家的现代技术统治文化是所有文化的“准则”，而文化进步在于让这些其他文化符合“准则”。在历史上，由于这种假设，人们寻求上帝和信仰的某些表达形式被蔑视，并被贬义地标记为“民间宗教”或“民间基督教”。教皇保禄六世在《传播福音》中曾勉励天主教徒重新发现虔诚中的积极元素，并净化其中的负面元素。（Marasigan
    1985: 1）


    Vicente Marasigan指出了一种他认为是二会议之前所谓的“民间虔诚”文件的典型特征。这些文件区分了城市和农村人口，区分了过去菲律宾的城市少数群体作为“官方宗教”的承载者，以及以某种方式保持着“本土化”的农村多数派。换言之，这些文件中提出了一种观点，认为菲律宾农村仍然是一个传教空间，由于一系列复杂的原因，这个空间一直处于教会牧养计划之外。在这种分析中，“民间基督教”被视为官方宗教的一种拙劣复制或模仿。Marasigan对这些论点的批判强调了需要“参与观察”和“沉浸式体验”（1985:
    2），正如他本人在巴纳奥山生活并开展研究的经历那样；他声称居住在那里的人非常接近自然，并以亲密的方式与自然交流（1985: 3）。


    菲律宾学生和学者现在经常作为各种学习计划的一部分，定期前往那座山。Vitaliano Gorospe的咖啡桌风格书籍《巴纳奥：与权力之山朝圣者的对话》（1992）包含了山下山坡周围朝圣路线的地图和照片，而他对居住在巴纳奥山的人的宗教生活的讨论，被明确地设定在农村生活对比对比的对立框架内。人们认为，生活在自然亲旁的人可以直接接触神性和真实的灵性体验，而这种体验是城市居民完全无法获得的：


    自然提醒我们，我们需要拥有宁静和与整个自我和谐的时刻，这样我们才能更接近自然及其创造者，从而发现我们真实的自我。去往巴纳奥山并不是逃离城市中的现实。相反，是城市是人为的，而巴纳奥是自然的。我们不该像被关在水泥笼里的几千只鸡一样被烟雾窒息，被城市噪音震聋。当我们第一次遇到巴纳奥山时，我们会发现它所要求的宁静非常陌生；我们还没有准备好向自然及其创造者投服。（Gorospe
    1992: 73）


    重要的是，Gorospe并不像他之前的Marasigan那样在应对梵蒂冈二会议的神学遗产。今天，巴纳奥不是神学错误的场所，而是深层真理的所在地，在这里，“岩石前祈祷、在溪中沐浴时祈祷、在洞穴祈祷、在树木和星空之间祈祷”提供了“更高、更深旅程——通往我们灵性的旅程”（Gorospe
    1992: 70）。


    如果对神学乃至精英知识话语与菲律宾民间文化之间的结合仍有怀疑，那么这些想法实际上与当代关于农村简单性和真实性的观点非常契合，以及Hannah Bulloch所说的“简单生活”理念（Bulloch
    2017: 15），这是她在锡基霍岛实地调查中记录的。根据Bulloch的说法，“简单生活”是一种地方话语，它倾向于“节俭优于消费文化，关注社交关系而非关注赚钱”（2017:
    49），并且它具有巨大的吸引力


