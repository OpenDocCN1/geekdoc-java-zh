    Edwards 2003: 292），不仅是因为它的反向问题“鉴于宗教，是什么让心灵可能？”是如此引人注目（参见 Durkheim 1915），而且因为将其重构为“给定心理学；是什么让心灵可能？”这一提法本身似乎就令人不安。正如福柯所指出的，向生物学的转向——始于
    19 世纪关于演化和种族的话语——始终具有深远的政治性：


    广义意义上的进化论——换句话说，与其说是达尔文理论本身，不如说是一套概念的集合或束（例如从共同进化树生长出的物种等级制度、物种间的生存斗争、淘汰不不适应者的选择）——在
    19 世纪的几年内，自然不仅是一种将政治话语转译为生物术语的方式，也不仅仅是一种为政治话语披上科学外衣的方式，而是一种思考殖民化、战争必要性、犯罪、疯狂和精神疾病现象、以及具有不同案例的社会历史等关系的真实方式。（Foucault
