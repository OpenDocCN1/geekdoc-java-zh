    dimension to this ethic which stretches backwards in time in a way that renders
    the living responsible for maintaining the dwelling places of the ancestors which
    include the same forests, rivers, mountains and oceans that are targets for various
    forms of resource extraction. This tradition of stewardship is projected forwards
    in time to include the unborn as future inhabitants and custodians of the ancestral
    dwelling places.


    Inang kalikasan suggests that the relationship between nature and human beings
    is an analogue of the relationship enjoyed between a mother and her children.
    For Filipinos, relationship is or ought to be defined by respect by juniors for
