    处于变化过程中的客体。然而，正是坎普（Capps）对变化的兴趣，是游牧宗教科学试图推动的。那么，一种通用的、游牧式的宗教和社会变化理论究竟是什么样的？我认为它应该包含以下三个基本的方法论程序：


    - 方法论的泛灵论与物图拜：非人类、人类、植物、物体和物品在一个平坦的本体论交互面上与人类共同参与，在这个面上人类和非人类都不享有特权；

    - 装配（assemblages）：交互通过塑造、分层和空间化形成装配。宗教是由异质元素构成的装配；

    - 通过实证地建立和比较不同位置宗教装配的流动和模式，可以界定变化。


    德勒兹（Deleuze）和拉图尔（Latour）本体论民主的活力原则，为超越世俗化假设及其竞争对手“活态宗教”的宗教和社会变化问题，以及关于还原论、现象学和解释的那些可能陈旧的方法论争论（见
    Stoddard 2018），提供了一个重要的进展方向。然而，互动者水平面的想法可能在考虑权力和不平等问题时是一个糟糕的起点。因此，在其中加入一些马克思或哈拉维（Haraway）至关重要，以引出交互在多大程度上是对称纠缠的；正如列维-斯特拉斯（Lévi-Strauss）的一小滴水让人感觉到，转型并不一定意外且灾难性地从外部发生，而是作为一种可能性存在于任何系统中，他对神话的研究——以及他对音乐的兴趣——证明了这一点。希望其他人有足够的兴趣来接受这些想法并付诸实践。


    ## 后记：装配图


    伊藤敦秀（Atsuhide Ito）


    一天，我收到保罗（Paul）的要求，希望画一组画来解释他的书。这些画将通过吉尔·德勒兹的“装配”概念，将菲律宾变化的权力配置视觉化。绘画的任务让我思考了线条及其与绘画的关系。画一条线的动作听起来很简单，却会导致一系列的后果。在纸上画一条线将空间划分为多个空间，而在地图上，同样的行为产生了领土。画线的行为结构化了一种划分，结果就是领土化。画线的简单行为引发了划分、领土化和所有权的政治后果。


    与划分的线条功能相反，线条也可以连接。线条将一个点连接到另一个点，建立起联盟和关系，以及可以进一步倍增的联盟和关系。线条还与其他线条连接，同时打破它们的延伸，停止并转弯，改变方向以到达另一条线条，从而去领土化已建立的划分与联盟结构。这样做，线条不仅连接了点并产生了联盟，而且可能偶然相并交叉，反击针对意图方向的力量。线条引导观察者的思维从一个点移动到另一个点。例如，向目标投掷的投影物产生一条代表物体运动的曲线。当投影物投向目标时，潜在的碰撞点是被预设的。也就是说，绘画是一种进攻。它是在特定时刻将思想和行动导向某点的行为。


    在追踪投影物运动时，线条是运动的倒带，也是可能性的快进。就像将现在与过去联系起来的谱学家，或专门识别现状原因的历史学家一样，线条是一种时空装置，在追溯线条时，将现在与记忆中丢失和被遗忘的点连接起来。它们引导我们进入过去，并为未来提供了潜在的通道。


    线条还具有测量长度和持续的功能。通过测量过程，让观察者对包含竞争实体的线条进行比较和评估。例如，在游泳池中，游泳者通过在等距线划分的矩形区域游泳来竞争。游泳池中矩形的建筑概念和建造建立在空间是同向性的感知之上：空间的质量随处都是一样的。这允许公寓楼和多层停车场等空间的产生。正如亨利·列斐（Henri
    Lefebvre, 1991）所说，城市规划师和建筑师为了利润最大化资本积累而抽象、划分并生产空间。根据列斐的观点，在规划多层公寓楼时，居住者与地方之间的有机关系被切断了；相反，城市规划师和建筑师抽象空间，将抽象空间划分为多个空间，以达到资本积累的目的。


    在绘画中，线条要拒绝并否定之前画过的线条，即使被擦除，痕迹依然可见：绘画工具的痕迹，以及艺术家身体在纸上施加的压力。需要强调，艺术家不仅用手将绘画工具按在纸上，而且还将身体的全部重量投入到标记中。从这个意义上说，艺术家的身体变得与工具同一：简而言之，身体变成了一台绘画机器。


    上述所有复杂性都体现在第三章的装配图中。在第一个装配中，权力集中在教堂广场上。它们看起来僵硬且静态，尽管是在很短时间内建立的殖民设施，但作为一种权威将力量汇聚到集中的广场。这些广场通过不可见的线条连接，形成了一个管道化的权力网络。通过这种权力集中中心和网络内从属终端点的做法，系统产生了中心与边缘之间的地理分层制度。当被画出来时，这种系统沉变为一个相对形象的景观。尽管如此，它看起来像一个熟悉的拓扑景观，但同时也作为骨架权力尺度出现，类似于阿琼·阿帕杜莱（Arjun
    Appadurai, 1996）概述媒体产品和话语全球网络中权力流动的方式。


    第二个装配观察到权力从城镇广场转移；边缘获得了强度。纸张矩形的边缘和边界处理得更加密集，木炭被反复涂抹，与之的是，图像中心是稀疏的，留下了痕迹，而不是一个活跃存在的场所。“强度”在德勒兹的写作中意义重大，对于德勒兹来说，身体不是一个有组织的系统，而是一个准备好产生效应的强化物质性。在绘画中，强度是不可表表的，但它仅通过艺术家变成机器的过程呈现出来——一个呼吸进出的纯绘画机器，在纸上施加重量，拉伸和收缩身体。那么，艺术家如何表达和交流运动流？箭头是一个显而易见但过于符号化的。相反，我使用了末端加粗的线条（看起来像线头）来传达方向。这正处于德勒兹（70）的“无意义特征”侧。德勒兹将图表定义为“操作性特征和色块、线条和区域的集合”（2005:
    71），并用更详细的语言进行了定义，说：“它确实是一个混沌，一场灾难，但也是秩序的萌芽。相对于形象的给定物，它是暴力的混沌，但它是节奏的萌芽”（同上）。我用力按在像棉花一样的纸上，留下思考的明确痕迹。有时我对我之前制作的标记做出回应，更准确地说是对它们做出反应。更准确的描述应该是，在我面前展开的图像物质性上进行的暴力的、痴迷的、类似灵式的参与。在这种绘画的入神般的时空（chrono-topos）中，我踏在“视觉坐标崩溃”（同上）的边缘，有时将自己作为标记的组织者，有时迷失在看似混沌的感中。结果是绘画始终处于即将崩溃的边缘，但我将它们保持在图表化和形象的结构中。绘画经常遇到突破点，但它们会被拉回以保持图表化和形象。


    在第三个装配中，力量从边缘向新中心爆发。权力被分散并向多价方向飞出，影响着氛围。在视觉上，曾经出现权力的旧中心广场看起来塌陷了。如果论及身体，它像一个正在吸入或吐出的巨大肛门或大口。从图表上看，爆发性的吸入和吐使得传统的权力广场变得微不足道。


    在第四个装配中，标记不再落地，而是漂浮在不可定义的空间里。线条的分叉频率与其交叉、链接或冲突频率相等。某些区域看起来比其他点、斑点和污渍更强烈。它们正在形成自发的联盟来构建一个系统，但它们是

