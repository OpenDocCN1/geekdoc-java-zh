    The recent philosophical speculations in biology have finally caused us to realise
    that the division of labor [la division du travail] is a fact of a generality
    that the economists, who were the first to speak of it, had been incapable of
    suspect. Indeed ... we know that the law of the division of labor applies to organisms
    as well as societies ... This discovery has had the result not only of enlarging
    the field of action of the division of labor, but also of setting its origins
    back into an infinitely distant past ... It is no longer a mere social institution
    whose roots lie in the intelligence and will of men, but a general biological
    phenomenon [phénomène de biologie générale], the conditions for which must seemingly
    be sought in the essential properties of organized matter [la matière organisée].
    (Durkheim 2014: 34; Durkheim 2013: 4)


    Biology offered not only a means of imagining society as a kind of bodily or organic
    structure but also as one subject to dynamic processes of change and transformation.
    Like Spencer, Durkheim imagined a series of stages of social development from
    the ‘horde’ and the ‘clan’ through subsequent stages to ‘industrial society’,
    characterized by a process of increasing complexity in the division of labour,
    and consequent shifts in the manner that individuals related both to one another
    and the social structure (2014: 138–50). This process, according to Durkheim,
    was determined by ‘the same law that governs biological development’ (2014: 149;
    167) and it also applied to the evolution of religion from immersion in the emotional
    effervescence of ritual in the horde, to the affective individualism of modern
    society (Fish 2002). From the ‘protoplasm’ (Durkheim 2014: 138) of proto-groups
    to references to the ‘rings of anneliated worms’ (2014: 139), ‘organs’ and ‘embryonic
    development’ (2014: 149), biology furnished Durkheim with both a means of imagining
    ‘social evolution’ (2014: 148) and for legitimizing leaps of speculative sociological
    thought by seeming to ground them in the apparently indisputable facts of biology
    and evolution.


    ## BIOLOGY


    The key inference drawn by Spencer and Durkheim from their exposure and engagement
    with nineteenth-century discourses on biological evolution was the tendency in
    nature for simple, homogeneous structures to be surpassed by complex, heterogeneous
    structures. But although this was one account of evolution it was not one which
    treated ''evolution as a process of divergence'', but rather a Lamarckian one
    with a ''strong emphasis on linear progress'' (Bowler 2009: 87). Jean-Baptiste
    Lamarck argued evolution – or what he termed ''transformism'' – the clearest evidence
    that creatures of every kind were working their ways up the scale of nature, with
    each generation taking up the cumulative achievements of its predecessors and
    passing them on enhanced by their own (Ingold 2007b: 113; see also Ingold 1986:
    130–1). The perhaps clearest evidence of Lamarck''s influence on the nineteenth-century
    study of religion can be found in Tylor''s theory of ''survivals''.


    Tylor defined the survival in Primitive Culture as ''processes, customs, opinions
    ... which have been carried on by force of habit into a new state of society from
    in which they had their original home'' that remain as proofs and examples of
    an older condition of culture out of which a newer has been evolved'' (Tylor 1903:
    1.16), while in Anthropology: An Introduction to the Study of Man and Civilization
    he described it as the ''unchanged relic of primitive man'' (1881: 18). In the
    essay ''On the Limits of Savage Religion'' (1892), Tylor had considered the ''blending
    of religions'' (1892: 298) and the importance, as he saw it, of separating out
    the ''genuine native theory'' from ''accretions and transformations'' (1892: 298)
    brought about through contact with ''civilized foreigners'' (1892: 299). ''Blending''
    threatened Tylor''s theoretical operations: his comparative anthropology enabled
    the pulsation of origins and the reconstruction of linear sequences of beliefs
    and practices but unambiguous data sets. The survival was constitutive of this
    theoretical apparatus and he put it to use in the same way as a geologist interpreted
    strata – indeed, Tylor claimed that geology established ‘a principle which lies
    at the very foundation of the science of anthropology’ (1881: 33) – or as a paleontologist
    read fossils, that is, by reconstructing the ‘sequence of forms within a line
    of descent’ (Ingold 1986: 32; see also Marett 1936: 26; Burrow 1968: 240–1; Stocking
    1995: 6). This Lamarckian rather than Darwinian vision of evolution suggested
    a process of continuous development whereby new traits and characteristics replaced
    old ones that had proven redundant in a single and unbroken line of progressive
    improvement (see also Opler 1964: 142–3). Tylor simply transferred Lamarck’s evolutionary
    hypothesis from biology to the study of culture:


    In taking up the problem of the development of culture as a branch of ethnological
    research, a first proceeding is to obtain a means of measurement. Seeking something
    like a definite line along to reckon progression and retrogression in civilisation,
    we may apparently find it best in the classification of real tribes and nations,
    past and present. Civilisation actually existing among mankind in different grades,
    we are enabled to estimate and compare it by positive examples. The educated world
    of Europe and America practically settles a standard by placing its nations at
    one end and savage tribes at the other, arranging the rest of humankind between
    these limits according as they correspond to cultured life. (Tylor 1903: L26;
    see also 1881: 24–5)


    Tylor was far from alone in subscribing to these views: it was the paradigm of
    the day (albeit uncontested) and influenced the scholarship of Marx and Freud
    as a host of thinkers such as John Lubbock, Henry Sumner Maine and Lewis Henry
    Morgan (see Kippenberg 1998: 298–300). For example, Lubbock, in The Origin of
    Civilisation (1870), suggested that


    - In the first place, the condition and habits of existing savages resemble in
    many ways, though not in all, those of our ancestors in a period long gone by

    - in the second, they illustrate much of what is passing among ourselves, many
    customs which have evidently no relation to present circumstances and even some
    ideas which are rooted in our minds, as fossils imbedded in the soil

    - and thirdly, we can even, by means of them, penetrate some of that mist which
    separates the present from the future. (1870: 1)


    Tyler, then, applied the idea of a single line of progress to religion. The line
    plotted from animism to science and was discernible through the study of beliefs.
    Tylor suggested that ''spirits are simply personified causes'' (1903: II.108),
    a claim that set up the animistic belief in spirits as a hypothesis or explanation
    about the world, albeit a mistaken one. The assumption that the origins of religion
    lay in efforts to explain the world was a stuttering kind of science, or in Stocking''s
    memorable phrase, ''primitive man, in an attempt to create science, had accidentally
    created religion instead, and mankind spent the rest of evolutionary time trying
    to rectify the error'' (1987: 192). Religion was just a chapter in the story of
    Reason, and humanity would soon outgrow it; indeed, in the Preface to the second
    edition of Golden Bough (1900), Frazer felt able to write: The comparative study
    of the beliefs and institutions of mankind is fitted to be much more than a means
    of satisfying an enlightened curiosity and of furnishing materials for the researches
    of the learned. Well handled, it may become a powerful instrument to expedite
    progress ... if it shows that much which we are wont to regard as solid rests
    on the sands of superstition rather on the rock of nature. It is indeed a melancholy
    and in some respects thankless task to strike at the foundations of beliefs in
    which, as in a strong tower, the hopes and aspirations of humanity through long
    ages have sought a refuge from the storm and stress of life. Yet sooner or later
    it is inevitable that the battery of the comparative method should breach these
    venerable walls, mantled over ivy and mosses and wild flowers.

