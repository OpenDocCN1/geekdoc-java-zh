    totem evolved into religion and into science. Societies were ordained to progress
    – implicitly either under Western tutelage or according to parameters established
    according to the Western experience of modernity – stage by stage, away from religion
    and towards science, industry and property-owning democracy in a journey towards
    civilization. This linear theory of historical transformation was challenged by
    structuralism and later post-structuralism, which posed a series of non-linear
    models whereby change occurred not as the result of any theory of progress but
    according to contingent and complex interactions of elements. According to Malinowski''s
    functionalist framework, myths functioned homeostatically to sustain social order
    in primitive societies serving ''principally to establish a sociological charter''
    (Malinowski 1984: 144). However, re-framed according to structuralist and post-structuralist
    logics, myths and societies were transformed into complex forms subject not to
    functional laws of closed-system equilibrium but to open-system dynamics and non-linear
    processes of transformation.


