    and its energies, except that Baudrillard places all of its elements into rite
    reverse:


    The whole chaotic constellation of the social revolves around spongy referent;
    that opaque but equally translucent reality, that nothingness:'
  - '[PAGE 42]


    masses. A statistical crystal ball, the masses are ‘swirling with currents and

    flows’, in the image of matter and the natural elements. So at least they are

    represented to us. They can be ‘magnetized’, the social envelopes them, like

    static electricity; but most of the time, precisely; they form a mass, that is,

    absor all the electricity of the social and political and neutralize it forever.

    They are neither good conductors of the political, nor good conductors of

    the social, nor good conductors of meaning in general. Everything flows

    through them, everything magnetizes them, but diffuses throughout them

    without leaving a trace … They do not radiate; on the contrary, they absorb

    all radiation from the outlying constellations of State, History, Culture, and

    Meaning. (Baudrillard 2007: 35–6)


    For Baudrillard, the spiral towards implosion is irresistible, and has acquired

    seemingly ‘fatal speed’ (Baudrillard 2007: 74). Moreover, the media – the

    functional equipment of religion in modern societies, and the adhesive as

    isupposed to ensure that the centre can, in fact, hold – generates a reverse

    effect: ‘Instead of intensifying or creating the “social relation” [they] are
    on

    the contrary entropic processes, modalities of the end of the social’ (2007:

    51). This ‘reverse energy’ (2007: 69; italics in original) rests on the paradox

    that information expands and grows, meaning contracts and collapses:

    ‘information dissolves the social into a sort of nebulous state

    leading not to a serait of innovation but to the very contrary, to total

    entropy’ (2007: 102).


    For Baudrillard, then, modernity is approaching exhaustion and history

    has run out of steam. In the sociology of religion, the theory most indebted

    to the teleological temporalities of modernity’s evolutionary optimism is

    the the secularization thesis. The theory predicts the terminal exhaustion of

    Christianity in the West and of religion more generally under the corrosive

    effects of an endlessly modernizing modernity. From the perspective of

    Baudrillard’s sociology, the error of the secularization thesis lies not in its'
  - '[PAGE 43]


    # ENERGY 33


    universalistic pretensions or in its unilinearity, but in its failure to recognize
    that the collapse of religious affiliations, identifications and belongings is
    in fact but one element of a wider process of exhaustion. It is not only religion
    that is in decline, everything else is as well: populations have not only stopped
    attending church, they have also stopped participating in politics and community
    life in general (see Putnam 2000: Stiegler 2013; Tremlett 2020).


    Intersecting evolutionist ideas of progress and secularization, post-modern intimations
    of entropic exhaustion, are a series of presentations of loss and collapse that
    combine fascist and Nazi conceptions of national and cultural purity, romantic
    tropes of nostalgia and vitalist ideas about energy, life and creativity with
    a certain, general critique of positivism and reductionism. The writings of Eliade
    constitute a compound of these elements, and his influence on the study of religions
    has bequeathed a vocabulary in which Religion is associated with a metaphorical
    chain with conceptions of authenticity and experience. According to David Cave,


    [One] source of Eliade''s view of authenticity came through his Romanian mentor,
    Nae Ionescu (1890–1940). Ionescu was a university lecturer, logician, metaphysician,
    and, for several years, editor of the newspaper Cuvântul. Ionescu’s philosophical
    term *trăire*, ‘lived experience’, became the codeword for the intellectuals of
    the ‘young generation’, whose movement, consequently, became known as Trăirism.
    Trăire is an existential concept that means to live life directly, spontaneously,
    and to arrive at one’s personal philosophy through concrete experience. It is
    not to come to a philosophy by consulting philosophical tomes, especially those
    coming from the rationalism of the Enlightenment and Western European currents
    of thought. (Cave 1993: 106–7).


    The primacy placed by Eliade on authenticity and experience bears the imprint
    of this influence. In frequent allusions to intuition and creativity –'
  - '[PAGE 44]


    damned by Dubuisson as little more than an ‘apology for all irrational and intuitive
    experience’ (Dubuisson 2006: 184) – Eliade’s work combines a sense of spiritual
    crisis that is both individual and cultural, but with the possibility of renewal
    through a restored connection with deep religious and ontological truths. In order
    for this restoration to occur, however, it is imperative to resist the ‘interpretations
    of religious realities made by psychologists, sociologists, or devotees of various
    reductionist ideologies’ (Eliade 1969a: 70). This is the heroic role Eliade foresaw
    for himself and the history of religions to restore the self-styled ‘total man’
    to the Sacred:


    It seems to me difficult to believe that in a historical moment like ours, the
    historians of religions will not take account of the creative possibilities of
    their discipline. How to assimilate *culturally* the spiritual universes that
    Africa, Oceania, Southeast Asia, open to us? All these spiritual universes have
    a religious origin and structure. If one does not approach them in the perspective
    of the history of religions, they will disappear as spiritual universes; they
    will be reduced to *facts* about social organizations, economic regimes, epochs
    of precolonial and colonial history, etc. In other words, they will not be grasped
    as spiritual creations; they will not enrich Western and world culture – they
    will serve to augment the number, already terrifying, of documents classified
    in archives, awaiting electronic computers to take them in charge. (1969a: 70–1;
    *italics* in original)


    If Eliade’s anti-reductionism ‘has bequeathed a deformed and distorted conception
    of reason’ as ‘mono-logical, instrumental and as a form of domination’, his hermeneutics
    have contributed to an idea of religion as some kind of irrational and overwhelming
    experience that can become the point of departure for the re-enchantment of the
    world’ (Tremlett 2011b: 288–9). However, the study of religions is not a stage
    for self-styled great men to act out their messianic fantasies, but an inter-
    and trans-disciplinary social science.'
