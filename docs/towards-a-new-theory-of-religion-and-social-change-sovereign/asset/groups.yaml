    # 50 TOWARDS A NEW THEORY OF RELIGION AND SOCIAL CHANGE


    The opening question of Anna Feigenbaum’s essay ‘Resistant Matters: Tents, Tear
    Gas and the “Other Media” of Occupy’ (2014) is, ‘Can a protest camp speak?’ (2014:
    15). Feigenbaum takes Bennett’s assemblage as a key point of departure, suggesting
    that objects are not simple signs, referents or icons exchanged by human actors
    symbolizing human thoughts and emotions. Rather, Feigenbaum argues that protest
    things and objects constitute ‘intended and unintended elements of communication
    systems’ that ‘mediate and articulate politics’ (2014: 16). For Feigenbaum, the
    focus on material culture does not reduce protest things to representations of
    human thoughts, but re-cognizes them as elements of ‘broader systems or assemblages’
    (ibid). She argues that ‘object-oriented approaches’ (2014: 22) can help direct
    attention to the importance of physical objects and structures in politics, helping
    to de-centre human actors from the analysis of politics and political communication
    (see Winner 1980).


    As a footnote to my earlier description of the Occupy Democracy protest, it is
    worth adding that among the protestors was a group of women who had travelled
    south to London to participate in the week-long Occupy Democracy occupation of
    Parliament Square. They had come from the Barton Moss protest camp near Manchester
    where they had been involved in a long-term action against fracking (the difficult
    conditions of the London protest were nothing to the hardships they had faced
    at the Barton Moss camp which included serious allegations of sustained intimidation
    and gendered violence by police [Gilmore, Jackson and Monk 2016]). The presence
    of these women drew into the protest assemblage of human protesters and protest
    things a range of geological entities including water, shale and gas as a reminder
    of the non-human publics – whose agency has often been neglected and ignored –
    to form an ontologically heterogeneous political community.


    This chapter took, as its point of departure, the neglected discourse of energy
    and society, contrasting conceptions of growth and expansion with those of entropy
    and exhaustion, mapping their implication in modernist, evolutionist, vitalist,
    romantic and fascist imaginaries in which the secularization thesis was so strangely
    implicated. It then opposed Durkheim''s violent, totemic effervescence with Bennett''s
    gentler vibrations of people and things to analyse an iconoclasm at a political
    protest, and to bring into view an animistic vision of energy and the political
    in which both publics and political agency extends beyond the human to objects
    and other non-human interactants.


    # 2


    # Biology


    # Introduction


    In the nineteenth century when the sciences first began to emerge, it was assumed
    that distinct methods were necessary to study on the one hand the stuff of the
    natural world such as amphibians, birds, fossils and trees and, on the other,
    the (allegedly) highest elements of human life and culture, such as the arts,
    literature and religions. Wilhelm Dilthey opposed the *Naturwissenschaften* and
    the *Geisteswissenschaften* – the natural sciences to the arts and humanities,
    and explanation (*Erklärung*) to understanding (*Verstehen*) – claiming that whereas
    the natural sciences focused on explaining laws of cause and effect between phenomena,
    the arts and humanities were concerned with understanding the special meanings
    and inner (spiritual) experiences of human beings that were to lie behind all
    great art, literature and revelation (see Grondin 1994; Palmer 1969; Harrington
    1996: 27). Dilthey, in common with the vitalists and phenomenologists, wanted
    ‘restore the imagination and creativity against the threat of the mechanistic’
    (Jones 2010: 7) to insulate unmediated lived experience from *Erklärung* and the
    allegedly stifling effects of the irrevocably reductive, scientific method.


    These romantic and eminently humanist assumptions would prevail much of the study
    of Religion – and arguably still do – despite concerted critical interrogation
    of the ideological, political and theological dimensions of those assumptions,
    and the implication of this classically humanist division of the sciences in the
    production of particular forms of power-knowledge about Religion (see, for example,
    Asad 1993; McCutcheon 1997; Fitzgerald 2000, 2003; Nongbri 2013). With these debates
    in mind, this chapter articulates an alternative to Dilthey''s humanism, and one
    way to make these methodological concerns visible through what I am calling the
    biological imagination which in the study of Religion, is characterized by multiple
    appropriations of biology for defining Religion and for conceiving of social and
    religious change. This chapter stakes out two configurations of this imagination
    as exemplars of sovereign science and will sketch an incipient biological imaginary
    for a yet-to-be-realized, disruptive, nomadic science for the study of religion
    for which religions will be flowing and not quiescent.


    The first configuration of the biological imagination straddles a period encompassing
    the late nineteenth and early twentieth centuries and a small influential group
    of British and French anthropologists and sociologists interested in thinking
    through questions of religion, culture and society via a biological lens. Emile
    Durkheim, James G. Frazer, Herbert Spencer and Edward Burnett Tylor produced a
    body of work on Religion in which recourse to the biological via a concept of
    evolution became the standard means of demarc the contours of their field. Of
    significance are their appeals to the biological and the assumption of it as a
    realm of fixed laws, and their expectation that the evolutionary development of
    biological organisms was not merely analogous or isomorphic with the development
    of religion, society and culture. For these scholars, religion was a distinct
    object which they characterized as a necessary element of the evolutionary process,
    albeit doomed to increasing obsolescence and eventual extinction.


    The second configuration of the biological imagination covers the late twentieth
    and early-first centuries, and emerges from the growing popularity of cognitive
    and evolutionary theories of Religion for explaining its unexpected persistence.
    Scott Atran, Justin Barrett, Jesse Bering, Pascal Boyer, Stuart Guthrie, Jonathan
    Jong, Ilkka Pyysiäinen, Dan Sperber and Harvey Whitehead, among others, have approached
    the question of Religion assuming its implication in the functioning of evolved
