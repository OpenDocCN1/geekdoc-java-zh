    # GENERATIVE INTERACTIVITY 123


    across a range of socio-economic strata. This discourse emerged through fieldwork
    conversations about development, progress, work and mobility, constituting a moral
    economy if you will through which, according to Bulloch, Filipinos evaluate themselves
    in relation to others both near and far.


    Bulloch describes the discourse of the simple life as a ‘bucolic ideal’ (ibid.)
    and it can be seen tinged with nostalgia for an uncomplicated rural way of life.
    In fact the Philippines was profoundly transformed as a landscape through colonial
    and post-colonial projects such as urbanism, intensive agriculture, tourism and
    mining. Contemporary eco-theologians approach these processes as a kind of ‘unmapping’
    wherein landscapes alive and animated by meaningful relations between peoples,
    animals, places and secret spots were reconfigured as empty (Tsing 2005: 28–9).
    Church groups and NGOs, in response to developments from resource extraction to
    housing, are increasingly becoming a post-Vatican II theology of political engagement.
    Fundamental to this new approach is the anxiety that nature – both in a quantitative
    sense that articulates concern for entities such as trees, rivers, mountains,
    oceans, birds, fish, monkeys and so forth, but also in a qualitative sense that
    encompasses relationships not just between people but also between people and
    trees, animals, rivers, mountains and oceans – is being replaced by a co-ordinating
    dwelling place by an artifice of steel and glass. The textures and relational
    connectivities that these artificial surfaces enable are to quite unnatural and
    de-humanizing. as the Filipino theologian Edwin Gariguez observes, ‘the ecological
    problem [in the Philippines] is part of the present alienation of the human person’,
    an alienation that stems from a (Western) ‘mechanistic and materialistic point
    of view’ that reduces all decisions to a ‘market utilitarian calculus’ (Gariguez
    2008: 4). Environmental degradation will follow – as surely as night follows day
    – when and where ‘the prosperity and security of the greater global economy takes
    over local needs and the personal anxiety of achievement overtakes the integrity
    of community’ (Walpe 2010: iv). Thus there emerges a powerful sense that if economic
    development is not fundamentally re-oriented, certain natural connectivities and
    relationships will become lost or extinct. But what are these other connectivities?
    And where are they to be found? And why should anyone care about the possibility
    or indeed likelihood of their demise?


    Short answers to the above questions are quite straightforward. First, the other
    connectivities in question refer to a religious sensibility that accords the environment,
    and its species, trees, rivers, mountains and oceans, a sacred significance. Second,
    this sensibility is said to be fond structuring lifeways of indigenous groups
    living in the so-called ‘ancestral domains’. Third, the extinction of these life-ways
    would be calamitous because it would represent a further continuation of cultural
    and natural variety but, however importantly, it would also constitute the disappearance
    of a form or way of life that, for Filipino theologians like Gariguez, has the
    potential to renew and revitalize human relationships not simply with the natural
    environment but with God.


    A distinctive feature, then, of the arcadian assemblage is the entanglement of
    tropes of ‘alienation’ and ‘authenticity’ not just in relation to the city but
    in relation to the archipelago’s indigenous peoples. For eco-theologians such
    as Gariguez, the indigenous peoples have become signifiers of re-enchantment as
    well as of ecological sustainability. According to Gariguez,


    "Ecological spirituality is not a newly-discovered path or perspective. On the
    contrary, this kind of spirituality respects the intimate relationship with the
    earth had been part of the traditions of the indigenous peoples since time immemorial
    and had been a constitutive motif of their culture, beliefs and their very identity
    as a people." (2008: 29)


    In fact, indigenous connectivity with nature – with other species, other humans
    and the land – is configured in terms of two idioms: first, buhay ay


    ![](img/91d03b06161479dec764992b403c4aec_135_0.png)


    FIGURE 8 Urban street vendor in Malate, Manila selling paintings depicting a bucolic
    ideal of the Filipino countryside. Source: author.


    lupa at lupa ay buhay inang kalikasan. The first means ''life is earth and earth
    is life'' while the second means, simply, ''mother nature''.


    Buhay ay lupa sa lupa ay ay buhay posits an essential connectivity between human
    life and well-being and the natural environment, in which the well-being of humans
    and the environment is constituted reciprocally and relationally. It constitutes
    nature as the source of authentic sustenance for all people. The earth is a form
    of sustenance that urban dwellers have detached from, but which remains real for
    indigenous peoples. The well-being of the earth in life fashion depends on what
    is framed as an ethic of ''stewardship'' that is said to be practised by indigenous
    peoples. This ethic of stewardship arises from the idea that the landscape and
    its trees, rivers, mountains and oceans are inherently sacred. Indeed, according
    to Gariguez, ''the ancestral domain comprises of interacting landscapes of human
    community, nature ecosystems and the living spirits of the land, which include
    also the spirits of their ancestors’ (Gariguez 2008: 212).


    126 TOWARDS A NEW THEORY OF RELIGION AND SOCIAL CHANGE


    The presence of the ancestors in the landscape suggests a temporal dimension to
    this ethic which stretches backwards in time in a way that renders the living
    responsible for maintaining the dwelling places of the ancestors which include
    the same forests, rivers, mountains and oceans that are targets for various forms
    of resource extraction. This tradition of stewardship is projected forwards in
    time to include the unborn as future inhabitants and custodians of the ancestral
    dwelling places.


    Inang kalikasan suggests that the relationship between nature and human beings
    is an analogue of the relationship enjoyed between a mother and her children.
    For Filipinos, relationship is or ought to be defined by respect by juniors for
    seniors, and for a duty of care between them that creates a cycle of reciprocity
    between the mother and her offspring. This ‘folk’ theory of ethical stewardship
    is glossed by Church activists in such a way that it appears to intersect with
    Catholic conceptions of the allegedly proper mode for human relationships with
    God and to God’s creation. Accordingly, ‘the salvation of our civilization and
    Christian religious tradition may well depend on our ability to draw insights
    from the tribal religious experience which will help us recover the presence of
    God in creation and live lightly on the’ (Gariguez 2008: 8).


    Perhaps the arcadian assemblage is more an imaginary made up of odds and ends
    of discourse and culture, rather than any real place. But even if this is conceded,
    it nonetheless points to empirical processes of decomposition at work particularly
    upon the church-plaza assemblage, and constitutes a definite acceleration of the
    Banahaw assemblage.


    # The Philippines 2009 media-church assemblage


    The regime of Ferdinand Marcos (1917–89) is probably most famous outside the Philippines
    for tales of corruption, murder and shoes, and we all as the so-called Power Revolution
    to which the regime eventually succumbed (see Hamilton-Patern 1999). Less well-known
    is Marcos''s proclamation of the ''New Society'' and his ambitious plans to modernize
    the country. A number of flagship urban projects were launched in Manila including
    clearances of informal settlements and the construction of the Cultural Centre
    Complex (CCC), which today houses the Cultural Centre of the Philippines and which
    was built on reclaimed land on Manila Bay (Connell 1999: 420). Marcos''s development
    of Manila intensified a process that had begun with Daniel Burnham, namely, the
    decalcification of the church-plaza assemblage.


    According to Tiar (1995), during the Marcos years Manila was a low-rise city that,
    unlike Paris, London or New York, denied residents'' ''aerial perspective'' (Tadiar
    1995:285). But after the toppling of the Marcos dictatorship and the much-tested
    restoration of democracy ... a new metropolitan form that is altering the face
    of the metropolis and the experience of its spaces ... emerged: ''flyovers'' (1995:
    286). According to Tiar, the meaning of flyers exceeds civic attempts to de-gest
    Manila''s traffic. Precisely because the flyers make possible new perspectives
    on the city, new experiences and psychological states become possible (1995: 287).


    Tiar''s suggestive claim that roads and flyers might be implicated in urban and
    psychological transformation is important because, after the fall of Marcos and
    in particular from the late 1990s, Manila has seen an explosion in urban development,
    including shopping malls, gated communities, high-rise condominiums and luxury
    hotels. The urban coordinates, frequencies and polarizations generated by these
    new spatial forms constitute an immense transformation of the church-plaza assemblage,
    and embedded in this new, distributed urban morphology, is El Shaddai (see Ortega
    2016: 167–88).

