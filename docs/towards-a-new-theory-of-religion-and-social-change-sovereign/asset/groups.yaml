    在我所提供的一文中，我对一场政治抗议中的偶像崇毁行为进行了万灵论式的分析，这场抗议标志着对上述描绘的关于能源与社会的熵话语的断裂。


    ## 占领民主（Occupy Democracy）


    2014年10月17日（周五）下午，活动人士聚集在伦敦的白厅领街（Whitehall），计划在议会广场（Parliament Square）进行为期一周的占领。当时大选在即（已于次年5月7日举行），而10月15日正是2011年圣保罗大教堂附近“占领伦敦”营成立的周年，事实上也是更广泛的“占领运动”在同一天于80个国家占领超过900个城市地点的纪念。


    “占领民主”可以置于所谓的“全球正义运动”近期历史中，该运动试图挑战新自由主义——全球正义运动将这种资本主义的形式描述为风险社会化和利润私有化（Mertes
    2010: 78）。例如在英国，国家政治精英认为，解决2007–08年全球金融危机的官方方案是使用公共资金救助陷入困的银行。这一解决方案实际上意味着，全球银行和其他金融机构对私人利润的追求此后将由英国公众买单。这种行为的合法性源于一种“紧缩”话语，这种话语将全球危机重构为一个国家财产问题（即过多的资金在公共图书馆和对失业及残障人士的福利上被浪费了），而这只能通过集体的“缩腰过日”来解决。当然，这种缩腰完全不是集体性的：富人以其他所有人的代价为利，而图书馆关闭，贫困和不平等却呈爆炸式增长。


    ## 36 迈向宗教与社会变革的新理论


    自20世纪90年代后期以来，反资本主义抗议的显著特点是利用社交媒体“建立网络以分享信息、战术、反对策略以及替代性的经济实践”（Mertes 2010: 79）。在其中，曼努埃尔·卡斯泰尔斯（Manuel
    Castells）将占领运动刻画为一种“由新创建的城市社区的数字社交网络组成的混合公共空间”的出现（Castells 2012: 45）。该运动激发的营地是空间新领土化的例子，它们通过同时占领多个物理和虚拟空间，跨越了民族国家的边界和主权（参见
    Chandler 2007）。根据这一分析框架的参数，如“占领民主”这样的团体，是国家级主权和领土性出现裂、当技术使新的物理和虚拟领土衔接成为可能时，局部与全球断裂的征兆。重要的是，“占领运动”不仅仅是抗议的载体：它产生的城市营地是旨在试点政治决策、交换和场所营造的替代性形式的实验场。


    “占领民主”抗议由“占领伦敦”营地的老兵组织，他们不仅是为了纪念他们曾参与的全球占领抗议潮的第三周年，还为了通过与政家、名人、活动人士、学者等人的举办辩论，就紧缩、水力压裂法以及民主未来等问题发起一系列民主实验。这些辩论的特点是了对经济、环境和民主观点的讨论，而这些观点在当时的英国主流媒体和政治话语中很少出现。尽管如此，它们是以一种民主、自由政治传统熟悉的方式展开的：演讲者提出基于证据的论点，公众有机会进行讨论、质询、拒绝或修改演讲者提出的观点。如果说这种具有显著自由色彩的政治理性与占领政治实践的亲近性值得注意，那么物体与它们也并不远，这既从“能源”抗议本身的物质性来看，也从抗议发生和进行的空间来看——即具有地标性建筑和纪念碑的议会广场。


    活动人士曾希望被允许在议会广场中心的草坪上举行他们的抗议和计划的各种活动，尽管他们知道这会引发他们与警察和遗产管理员的对峙。然而，他们希望他们明确声明的和平且限时的抗议能够允许在不受干扰的情况下进行。活动人士在周五晚上确实在广场广场的草坪上度过了几个小时，但到周六早上，他们就被局限在广场南侧的一条窄人行道和广场东侧的一条狭窄抬高草地上，并在那里的大部分时间里停留了六天。


    ![](img/91d03b06161479dec764992b403c4aec_47_0.png)


    图1 占领民主抗议者占领议会广场中心，2014年10月17日。来源：作者。


    活动人士周六的大部分时间都在等待，当时传闻有一支大量的黑块无政府主义者库尔德活动人士将加入，他们于当天下午参加了穿越伦敦市中心的大工会（TUC）游行。当“占领民主”的抗议者等待时，遗产管理员在警察的陪同下巡视抗议边缘，没收无人看守的告示和横幅并将其摧毁。这些行动持续了整个上午和下午，导致后来活动人士带到广场的两座大塔被摧毁，这些塔是从广场搬过来的，随后加入了“占领民主”进入广场中心的草坪。管理员的没收和破坏行为在法律上的理由是：


    ![](img/91d03b06161479dec764992b403c4aec_49_0.png)


    图2 占领民主抗议者短暂重新夺回议会广场，2014年10月18日。来源：作者。


    抗议者没有权利处置随附的物质文化形式，如横幅、帐篷、防水布、营地椅，或者特别是任何可能对寻求避雨的人士有用的物品。此外，值得注意的是，抗议物品和结构并非总是这样处理的：2008年，英国遗产委员会在峰峰地区国家公园聘佣了一支考古学家团队，记录利兹十字（Leeds
    Cross）和恩德克里夫（Endcliffe）抗议营地，因为该营地涉及到抗议者试图保护的景观历史（参见 Badock and Johnston 2009）。此外，在伦敦维多利亚和阿尔尔伯特博物馆举办的、从2014年7月26日持续次年2月1日的“不服从物体”（Disobedient
    Objects）展览，在一个传统上与高艺术相关的场所展示了一系列抗议物品（参见 Flood and Grindon 2014; Soar and Tremlett
    2017）。在对伦敦和香港占领营地的早期研究中（Tremlett 2012; 2016），我的工作涉及对主流和独立媒体来源的话语分析，并结合活动人士的访谈和研讨式讨论。同样，当我在2014年10月17日下午抵达议会广场时，我主要关注的是人们说的话；例如，在我的实地笔记中，我引用了塞尔·布兰德（Russell
    Brand）的话，他在18日下午与娜塔莉·本特（Natalie Bennett，当时的绿党领袖）、约翰·麦唐尼利（John McDonnell）和迈克尔·梅彻（Michael
    Meacher）一起发言（这两人当时都是后排左翼工党议员：约翰·麦唐尼利在写作时担任影子财政部长，而迈克尔·梅彻于次年2015年10月21日不幸去世）。布兰德说他曾在2011年占领抗议期间在纽约的朱库蒂公园，并声称“政治、经济和灵性”自60年代以来首次在朱库蒂营地汇合。确实，这是我一直感兴趣的宗教与政治结合领域之一。但直到以后我才意识到，无论是人们所说的话，还是那些独特的且已有记录的用'
