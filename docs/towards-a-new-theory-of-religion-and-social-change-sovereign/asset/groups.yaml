    up. (Habermas 1990: 93)


    For Nietzsche, it would be art and performance – as explored in The Birth of Tragedy
    (1993) – that promised a way out from the constraints of Protestant, ascetic modernity.
    Similarly for Foucault, in the Preface to History of Madness (2006), it was as
    if there was something trying to escape from the confines of the total institution,
    for ''behind the psychiatrically engender phenomenon'
- md: '

    of mental illness, and indeed behind the various masks of madness … there is something
    authentic whose sealed mouth need only be opened up’ (Habermas 1990: 240), that
    Foucault could claim to have written ‘a history not of psychiatry, but of madness
    itself, in all its vivacity, it is captured by knowledge’ with madness described
    as a ‘wild state’ and as a ‘primitive purity’ (Foucault 2006: xxxii-xxxiii).


    The turbulent eddies of charisma and madness – common with those of art and performance
    – have long been construed with the potential to wrest the subject from itself,
    to renew it or restore it or to completely transform it in much the same way that
    William James and Rudolf Otto imagined the contours of the paradigmatic religious
    experience, with its capacity to terrify and compel awe. Certainly too, the religious
    experience – the norm-transgressing experience – has provided certain avenues
    for thinking about religious and social change, but one remains indeed tied to
    the subject, and one incapable of understanding the complexities of change, its
    nonhuman dimensions and the tipping points and transitions between repertoires
    and between routine and improvisation.


    A second set of resources for about religious and social change derives from the
    works of Claude Levi-Strauss and Mikhail Bakhtin respectively, specifically their
    concepts of bricolage and dialogism. Bricolage has been a handy concept for theorists
    of lived religion as it implies a level of improvised fabrication appropriate
    to the lived religious thesis. Danielle Kirby’s suggestion that ‘religious and
    spiritual bricolage is a common feature of contemporary religiosity’ (2012: 39;
    italics in original) amounts to an orthodoxy of sorts in the lived religion milieu
    (see McGuire 2008). However, it is typically taken to mean individual choice,
    imagining individuals drawing from multiple sources for their identity, their
    religious narratives and their relig-cultural practices, of which is not at all
    Levi-Strauss (see Aupers and Houtman 2013: 174; Kirby 2012: 50–1). For Levi-Strauss,
    bricolage is a mode of cognition characterized by the continuous re-cycling of
    a limited set of elements to produce, for example, new myths. The opposition drawn
    by Levi-Strauss between the bricoleur and the engineer is instructive: the engineer
    works from concepts to fulfil the objectives of specific projects; the bricoleur
    by contrast works with whatever comes to hand to generate order from the sensible
    qualities of things (Hénaff 1998: 141–58). Importantly, bricolage was never meant
    to be understood in terms of individual intentions or conceptions of authorship,
    but to denote a type of cognitive operation characteristic of certain cultures
    and societies.


    Dialogism and linked notions of hybridity, intertextuality and heteroglossia have
    also proved useful to scholars interested in religious change, in particular for
    pinpointing instances of blending, mixing and creative borrowing in religious
    and religiously inflected forms of culture-making and production, including music
    (see Appert 2016; Hill 2017). James Cox (2017: 25) draws on Bakhtin as a means
    of theorizing religious change and creating a certain fusion, in Rainbow Spirit
    Theology, of indigenous Australian and Christian concepts and ideas. Cox uses
    Bakhtin precisely because it allows him to theorize Rainbow Spirit Theology in
    terms of ‘will and intention’ but to position ‘the indigenous participants in
    the creation of this new ... [theology] as active, even subversive agents rather
    than passive victims acquiescing to the influences of an outside dominating force’.
    The centrality of political resistance to Cox’s account is significant, grounding
    change in intentional human action – whether framed in terms of bricolage or dialogism
    – means eliding a range of additional sources of agency and lines of causality.
    It is precisely these other lines and sources that are privileged in the account
    of the Cargo Cult assemblage as follows.


    # The Cargo Cult assemblage


    At the end of the eighteenth century, when British Protestant missionary activity
    was expanding into new territories, and after the killing of Captain Cook in 1779
    in Hawaii, the London Missionary Society made the region of Oceania, including
    Melanesia, a mission priority. However, the missionaries who went to these places,
    according to McCulloch theory (2010), often lacked a ‘detailed grasp of Christian
    theology’, although he suggests they bring to the region ‘charisma, a shrewd sense
    of what might appeal to local leaders in the Christian package and a determination
    to destroy the power of traditional cults’ (2010: 876). Certainly, these missionaries
    disturbed local culture with their interventions and the new sources of power
    and later colonial governments brought with them (for example, literacy, firearms
    and medicines). Conversion to Christianity was perhaps seen by locals as a means
    to access these new forms of power. Importantly, however, the interactions of
    Melanesian populations with Christianity was not a straightforward story of either
    conversion or resistance. Rather, these interactions were characterized by the
    emergence of local interpretations and Cargo Cults can be understood as arising
    in part from them.


    It was not only Christianity that was brought to Melanesia. Colonial interventions
    drew the islands and their people into an emergent global economy and international
    politics. Papua was under German control from 1884 but, with the upheavals of
    World War I, changed hands to come under Australian jurisdiction. The Germans
    vast plantations to export copra, which was used for making coconut oil. This
    did not change with the coming of the Australians, but the vagaries of global
    capitalism saw rapid shifts in the extractive colonial economy: by the 1930s,
    copra had been overtaken as the main export by rubber and gold. The labour for
    all of these enterprises was indentured: local men were signed up to work for
    a period of time (e.g., three years) during which time they lived in barracks,
    away from their villages. Mission, colonialism and exposure to world capitalist
    economy constitute the complex, overlapping contexts in which the Cargo Cults
    emerged. The Cargo Cults were very much the product of contact with European missionaries
    and colonizers. They were led by charismatic leaders who emerged from local populations,
    claiming that large quantities of cargo brought into the islands by sea or by
    air would arrive and be delivered to the locals to usher in a new era of plenty
    in which the ancestors would return: Sometimes the word [cargo] meant money or
    various sorts of manufactured goods such as vehicles, packaged foods, refrigerators,
    guns, and tools. And sometimes, metaphorically, cargo represented the search for
    a new social and moral order that would ensure local sovereignty and the withdrawal
    of colonial rulers. In either case, people worked for and expected a sudden, miraculous
    transformation of their lives. Central to the Cargo Cults was the concept of the
    ''end times'' or ''end of days''. This concept was drawn from Christianity with
    its very particular temporal esatology beginning with Eden, followed by the fall
    of humankind and then concluding with humanity''s redemption through a final confrontation
    between good and evil understood as the ''end times''. However, the scholarship
    on Cargo Cults has stressed not only their religious dimensions but their political
    ones as well: ''Cargo Cult'' is a name held to apply to any organized ritual activity
    characterized by a desire for ''cargo'' based on existing religious beliefs. ''Cargo''
    in this context signifies not only the materials of industrial production, but
    in general a higher standard of living and, most importantly, a status equal to
    that of the white colonizers ... The movements termed ''cargo cults'' have also
    been called ''millenarian movements'' ... or ''religious cults'' ... ''social
    movements'' ... ''crisis cults'' ... forerunners of Melanesian nationalism''...
    and ''millennial protest movements''.


    # TOWARDS A NEW THEORY OF RELIGION AND SOCIAL CHANGE

