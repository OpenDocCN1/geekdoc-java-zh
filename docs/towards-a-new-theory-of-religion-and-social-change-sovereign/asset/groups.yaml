    *mangagamag*（治愈者）、*supremas*（宗教领袖）、*mangukulam*（巫师）并作为被称为 *anting-anting*（护身符）的强大物体库而闻名的山屿一样——构成了竞争性的引力中心，依赖于不同形式的能量来吸引并维持人们和事物在其轨道上。重要的是，Ileto
