    – a Catholic evangelical movement called El Shaddai – and Manila’s new urbanism.
    It spread along radio waves, television programmes, mass rallies, mega-church
    performances, social media platforms and diaspor communities as well: I called
    the Philippines 2009 media-church assemblage. Operating across both physical and
    virtual spaces, it added a new layer of global, networked complexity to the inside-outside
    regime of flows initially put in place by the church-plaza assemblage.


