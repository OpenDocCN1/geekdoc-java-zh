    ontological commitments reproduce the positivist sensibilities of the early twentieth
    century: society is rendered ''thing-like'' (Bauman 2005: 362), that is, as an
    object which can be studied by any geologist might study a crystal. It is composed
    of active human elements (it is their ''surexcxcitation'' that generates the effervescence)
    and inert material ones, and it is the behaviour and ideas of the former – imprinted
    upon the totemic objects – that constitutes the focus of the social scientist.


    Durkheim''s account of totemism as an energetic concatenation of bodies and objects
    does not only narr the formation of the totemic social; it is also the story of
    a specific type of subject which emerges through creating external representations,
    signs and symbols:


    > Collective representations originate only when they are embedded in material
    objects, things, or beings of every sort – figures, movements, sounds, words,
    and so on – that symbolize and delineate them in some outward appearance. For
    it is only by expressing their feelings, by translating them into signs, by symbolizing
    them externally, that the individual consciousnesses, which are, by nature, closed
    to each other, can feel that they are communicating and are in unison. (Durkheim
    1960b: 335–6)


    The totemic subject – if I can call it – comes to recognize itself through the
    material representations it has made. The primacy of spirit or mind over inert
    matter, securing a particular ontology for the social and for politics, in which
    objects and things are little more than passive vehicles for conveying human meaning.
    This ontology is reproduced in contemporary research on social movements. For
    example, in ''On the Phenomenology of Giant Puppets: Broken Windows, Imaginary
    Jars of Urine, the Cosmological Role of the Police in American Culture’ (2007),
    David Graeber approaches anti-capitalist protest as a kind of totemic rite or
    festival that assembles human and non-human elements which is bound up with the
    release of powerful energies channeled through both the iconoclastic destruction
    of protest material culture and the iconoclastic smashing of symbols of capitalism
    and consumerism. Writing with the ‘renegade’ Collage, Graeber focuses on the smashing
    of giant protest puppets by police and, working from research conducted over a
    number of years at American protests including Seattle (1999), Philadelphia (2000)
    and Miami (2003), he explores what he calls ‘the symbolism of puppets’ (2007:
    376) noting that they are often targeted for capture or destruction by police,
    sometimes before they appear on the streets. For example, at the Free Trade Areas
    of the Americas (FTAA) protests in Miami in 2003, Graeber recounts an eyewitness
    report which claimed that


    > after Police protesters from the Seaside Plaza forcing them to abandon their
    puppets, officers spent the next half hour or so systematically attacking and
    destroying them [the puppets]: shooting, kicking, and ripping the remains; one
    even putting a giant puppet in his squad car with the head sticking out and driving
    so to smash against every sign and street post available. (2007: 390)


    According to Graeber, a giant puppet – which is made from fragile materials such
    as papierché – is, intentionally, a ‘mockery’ of the idea of ‘permanence’ (2007:
    382). The absurd and giant unwieldness of the totem-puppets, according to Graeber,
    conjures the imaginary of the festival, and augurs ‘the recuperation of the sacred
    and unalienated experience’ (2007: 396; see also Krøjer 2015), mediating the rite-like
    release of powerful, violent, Durkheimian energy. But if ritual constitutes the
    totemic social through releases of energy amidst experiences of lucid excess,
    does protest offer anything more than the possibility of cathartic release or
    the temporary suspension of the quotidian in a fleeting experience of sacred solidarity?


    This, I think, makes it easier to see why giant puppets, that are so extraordinarily
    creative but at the same time so intentionally ephemeral, that make a mockery
    of the very idea of the eternal verities that are meant to represent, can so easily
    become the symbol of this attempt to seize the power of social creativity, the
    power to recreate and redefine institutions. Why, as a result, they can end up
    standing for everything – the new forms of organization, the emphasis on democratic
    process – that standard media portrayals of the movement make disappear. They
    embody the permanence of revolution. From the perspective of the ‘forces of order’,
    this is precisely what makes them both ridiculous and demonic. From the perspective
    of many anarchists, this is precisely what makes them both ridiculous and divine.
    (Graeber: 2007: 408)


    If Graeber’s account of violence against objects is correct, the iconoclasm in
    Miami in 2003 and in London in 2014 were attempts by the police to destroy the
    representations of creativity and imagination that had been materialized by the
    protesters. What the protesters saw in their assembly and in their material culture
    was, according to Graeber, the ‘ruption of the sacred through a re-creation of
    the popular festival’ (2007: 396). The police, by contrast, saw something else
    entirely. The destruction of the puppets by police in Miami was according to Graeber,
    part of a ‘calculated campaign of symbolic warfare (ibid.) intended to prevent
    the ideas represented by the puppets from spreading to, and infecting, the wider
    social body. If Graeber’s Durkheimian account is correct, then the iconoclasm
    at the 2014 Occupy Democracy protest in London can be conceived of as the destruction,
    by police and heritage wardens, of potentially dangerous material symbols that
    threatened the integrity of the urban topology of icons and monuments at Parliament
    Square. However, in my view this is only a partial explanation for the iconoclasm:
    the protest things were destroyed not only for what they represented or symbolized,
    but also for what they might do.


    # The quivering assemblage


    Jane Bennett''s Vibrant Matter: A Political Ecology of Things (2010) is an attempt
    to explore the constitution of the political – including that of publics and political
    agency – in unequivocally provocative, materialist and vitalist if not animist
    terms:


    > For some time political theory has acknowledged that materiality matters. But
    this materiality most often refers to human social structures or to the human
    meanings ‘embodied’ in them and other objects. Because politics is itself construed
    as an exclusively human domain, what registers on it is a set of material constraints
    on or a context for human action. Dogged resistance to anthropocentrism is perhaps
    the main difference between the vital materialism I pursue and this kind of historical
    materialism. I will emphasize, even overemphasize, the agentic contributions of
    nonhuman forces (operating in nature, the human body, and in human artefacts)
    in an attempt to counter the narcissism of human language and thought. We need
    to cultivate a bit of anthropomorphism – the idea that human agency has some echoes
    in nonhuman nature – to counter the narcissism of humans. (Bennett 2010: xvi)
    Where the Durkian social emerges through explosive releases of energy that must
    be ritually and cyclically re-ignited to ensure that the charge is never exhausted,
    Bennett writes of a rather less violent ‘quivering blob of creative élan’ (2010:
    61) that is always already energized. Drawing upon vitalist ideas of self-organizing,
    animate matter, Bennett traces the genealogy of his vitalism through Baruch Spinoza,
    Henri Bergson, Hans Dries, Gilles Deleuze and Félix Guattari, and using the idea
    of the assemblage – ‘living, throbbing confederations’ made up of ‘energies’,
    ‘force[s]’, ‘pulse[s]’ and ‘charged parts’ (2010: 23–4) – pictures the political
    as an ‘interstitial field of non-personal, human forces, flows, tendencies, and
    trajectories’ (2010: 61) and as an ontological field without any unequivocal demarcations
    between human, animal, vegetable, or mineral. All forces and flows (materialities)
    are or can become lively, affective, signalling. And so an affective, speaking
    human body is not radically different from the affective, signalling nonhumans
    with which it coexists, hosts, enjoys, consumes, produces, and competes. (2010:
    116–17; italics in original)


    The concept of the assemblage allows Bennett to re-think liberal, political conceptions
    of publics and political agency. This move de-centres both the agentive, intentional,
    meaning-endowing human subject and the rational, choice-making subject, such that
    publics include non-human elements and non-human entities can have political agency.
    Using the example of a blackout, Bennett moves towards what she calls a ‘congregational
    understanding of agency’ and to ‘a theory of distributive agency (2010: 20–1;
    italics in original) in which agency is configured as ‘something distributed along
    a continuum’ and extrudes from multiple sites (2010: 28). It follows that if political
    agency is also the agency of non-humans – ‘edibles, commodities, storms, [and]
    metals’ (2010: viii) – then the ‘appropriate unit of analysis for democratic theory
    is neither the individual human nor an exclusively human collective but the (ontologically
    heterogeneous) “public” coalescing around a problem’ (2010: 108).

