    我长期以来一直被关于变化的马克思主义和结构主义解释所吸引。在马克思主义解释中对意识形态在变化过程中中心性的强调似乎不可否认的。但各种马克思主义无法逃脱其线性、进化论和目的论思维的影响。包裹在马克思式的阶段性历史观中（即，一种分阶段的历史，也是一种剧场，其中每个角色扮演着特定的角色），一个被选定的主体——无产阶级或工人阶级——扮演着救赎和末世论的角色，带来自由（尽管阿尔都塞试图重建一个没有主体的马克思主义；见
    Althusser 2005）。


    列维-斯特劳斯对转化的描述是列维-斯特劳斯思想的核心，即关于神话及其衰败的不可避免性。在《热带哀歌》中，他宣布我们今天能够研究的社会只有衰弱的社区和残缺的社会形式，“这些被欧洲文明的发展所粉碎，对于广大且无辜的人类来说，这种现象相当于可怕且无法理解的灾难”（2011:
    326）。但变化不可避免是一个关于收缩和耗尽的悲剧吗？是否可以找到另一个核心不是消散或扩张，而是创造与转化的故事？


    在描述我的四种菲律宾式的组合之前，需要对菲律宾宗教和社会变化问题的方法说几句。到目前为止的方法在感官上是明显的现代主义的，尽管在空间上是如此（见 Kataoka
    2012: 361）。例如，城市-农村的区分一直是涵盖西班牙和美国时期的历史和民族志著作的基础，作为区分殖民、基督教以及20世纪菲律宾现代性体验的手段。因此，对群岛基督教的描述通常根据福音化的接触程度来区分低地和山区人口，并根据“小传统”和“大传统”来区分。这些区别使得能够对各种边缘和边界带（位于殖民城镇边缘或之外）的宗教性进行对比，有时采取假定主教正统的视角（Schumacher
    2009），有时采取自由现代性的视角（Sturtevant 1976）。后方和山区的异类基督教往往被描绘为宗教政治的非法杂交，或对雏形政治需求的非理性表达。


