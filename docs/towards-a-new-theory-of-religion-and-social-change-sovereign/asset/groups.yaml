    # GENERATIVE INTERACTIVITY


    El Shaddai’s popularity points to the transformation of the church-plaza assemblage,
    away from the emphasis on hierarchically enclosed spaces to a new emphasis on
    media, mobility and flatter space (many Filipinos live and work outside the country,
    and constitute a huge diasporic audience for El Shaddai). Francisco (2010) notes
