    hierarchy: in each town the church was positioned at the centre, the houses of
    the local elite around the plaza and the homes of the so-called *indios* at the
    periphery. Spanish colonial policy depended upon these architectural and planning
    practices which imposed specific sets of power relations and racial hierarchies
    between peninsular Spaniards, *mestizos* or those of mixed ancestry, and the indios,
    among which was the injunction that neither Filipino men nor Filipina women could
    become priests. Emanating from the Church was not simply ecclesiastical power
    but a particular racialized and gendered morphology of social relationships that
    did not simply re-route Filipinos out of the pre-colonial *barangay* and into
    new towns, but also re-rooted with specific restrictions on movement ‘so that
    the natives may not wander about unless there is no need for it’ (Morga 1970:
    163). Around the Church were the houses of the *principalia* or local elite, whose
    children were educated by the priest (Ileto 1998a: 81). According to Ileto, it
    was ‘the priest [who] determined or at least pleased the social order in the town’
    (Ileto 1998a: 82) and presided over its key rituals including baptisms, marriages,
    funerals and feasts (Ileto 1998a: 80). These occasions were more than ritual moments
    in an individual biography, or the town or city calendar of feasts and celebrations:
    they were simultaneously a kind of surveillance.


    During the Spanish colonial period, the link between the urban fabric of Filipino
    towns and cities, and Christianity, was clear. The Laws of the Indies prescribed
    the construction of the church-plaza complex as the site at which a town or city’s
    most important religious and secular functions would be performed. Ordinance 118
    stated that ‘here and there in the town, smaller plazas of good proportion shall
    be laid out, where the temples associated with the principal church, the parish
    churches and the monasteries can be built, such that everything was distributed
    in a good proportion for the instruction of religion’ (Mundo and Crouch 1977:
    255). As such, the priest and the Church were not simply symbols of religious
    power, but the organizing grammar of hierarchies and relations for which the model
    was a kind of pre-Benthamite panopticon: a spatially orchestrated network of walls
    and roads, and each of the assemblages detailed in the pages that follow are a
    translation or variation of it. The Christianization of the Philippines was, then,
    less a question of conversion – a transmission of discrete beliefs and the instantiation
    of a religious tradition from one part of the world so that it might become continuous
    in another – than an articulation of religious practices (baptisms, confession,
    etc.) with those of town- and city-planning.


    But this mode of Christianization generated not a copy of itself as conversion
    implies, but entirely a new assemblage of objects and things. this assemblage
    combined and composed Filipino bodies into new proximities and distances, into
    new relations between and among bodies, with one another and the colonizing power
    and the rivers, forests and mountains of the archipelago. These combinations and
    compositions constituted a comprehensive de- and re-territorializing of the islands,
    generating new insides and outsides and new polarizations, notably between town
    centres and backwoods peripheries, new frequencies of contact and separation and
    new kinds of coordinates upon which to plot bodies and information (Deleuze and
    Guattari 2014: 503). As Arnisson Andre Ortega Ortega notes (2016), the programme
    of re-settlement was initiated by Church authorities to purge indigenous residents
    and forcibly settle them into ... town centres. This forced relocation brought
    the indigenous population ‘under the bells’ of Spanish Catholicism and classified
    them as civilized, lowland Christian Indians. Politically, this meant the incorporation
    of the barangay social structure within a colonial administrative hierarchy. Those
    who refused to submit fled to the mountains and were classified as ‘uncivilized’
    and ‘pagan’ remontados. (Ortega 2016: 130)


    The Banahaw assemblage establishes an alternative centre of religious power outside
    of the town, marked by new flows and new insides and outs and points to a transition
    from the solid Religion of the towns and cities to an improvised, liquid religious
    form at the periphery.


    # The Philippines 1841 Banahaw assemblage


    The authorized religious space of the colonial Philippines was the enclosed grid
    of the church-plaza assemblage. However, for various reasons – perhaps to escape
    taxes, the constabulary or the friars – various kinds of ''third space'' (Lahiri
    2005: 36) emerged at the periphery of the new towns and cities of the archipelago:


    Spanish colonial rule had delineated cities, towns (pueblos) and provincial boundaries
    within an administrative structure that looked good on paper. In actuality, a
    mandala-like situation existed wherein the prestige and power of the parish priest
    and indigenous town elite (principalia) determined a pueblo-centre’s hold over
    the peripheries. Up to fairly late in the century, there was ample scope for non-pueblo
    elements – called hermits, bandits, wanderers, cures, heretics and the like –
    to operate almost at, attracting people to them during periods of natural calamities
    or annual pilgrimages, or forming permanent communities beyond the pueblos. (Ileto
    1999: 207; italics in original)


    Mount Banahaw was one such space, and it emerged out of the bloody aftermath of
    a religious uprising. The Cofradia de San José was founded by Apolinario de Cruz
    who worked as an orderly in Manila. Having been prevented from joining the priesthood
    on racial grounds, he established his own fraternity. Intended only for Filipinos,
    in 1832 the Cofradia petitioned the Archbishop of Manila, requesting ecclesiastical
    recognition. When this was rejected, a petition was sent to the Royal Audiencia
    but this too was rejected. In 1840 the Cofradia led his followers to the slopes
    of San Cristobal, one of a pair of volcanoes. In 1841 the rebellion was crushed
    as government troops overran the camp. Apolinario de Cruz escaped to the dense
    forests of Mount Banahaw, but he was captured soon after and, along with 200 of
    his followers, executed (see Sweet 1970).


    # GENERATIVE INTERACTIVITY


    **111**


    ![](img/91d03b06161479dec764992b403c4aec_121_0.png)


    FIGURE 4 Assemblage 2: The Banahaw assemblage. © Atsuhide Ito.


    ‘King of the Tagalogs’ (Ileto 2011: 58), but his reign was brief. In 1870, Spanish
    government reports noted that Apolinario had appeared, along with the Virgin Mary,
    to several people urging them to re-establish the Cofradia. When I did fieldwork
    in the mountains in 1999–2000, locals told me that Apolinario returned as one
    of the Santong Boces (Holy Voices), and that these voices guided pilgrims like
    Amador Suarez, who established the Ciudad Mistica de Dios on the lower slopes
    of Banahaw in the early 1950s.


    A key feature of the Cofradia, and the various millenarian instructions of the
    nineteenth-century Philippines, was how conceptions of spiritual power and notions
    of apocalyptic time combined to up-route ‘families ... from the often knit kinship
    systems of the towns’, separating ‘men and women ... from their spouses, children
    or parents’, to bring them ‘together in a new society’ (Ileto 2011: 60). According
    to Ilto, these uprisings and the communities established the possibility of ‘not
    just a counterculture, a counterstructure’ (Ileto 1999: 194) to the Spanish colonial
    state. These counter-structures emerged around a charismatic leader who claims
    authorized the irruption of these other, millenarian temporalities and animistic
    conceptions of power.


    In ‘Rural Life in a Time of Revolution’ (1998a) Ileto juxtaposes some of the Spanish
    towns of the provinces of Laguna and Quezon (Tiong, Dolores, Sariaya and San Pablo
    City) with Mount Banahaw and Mount San Cristobal, describing the latter as ‘a
    third realm’ (Ileto 1998a: 85). According to Ilto, both the towns with their churches
    and priests at their centres – like the mountain in their midst with their mangagamag
    (healers), supremas (religious leaders), mangukulam (sorcerers) and their reputation
    as a repository for powerful objects known as anting-anting (amulets) – constitute
    competing gravitational centres dependent upon different forms of energy to draw
    and maintain people and things in their orbit. Importantly, Ileto does not simply
    oppose these different attractors – the lowland town as against the upland counterstructure
    – but highlights the extent to which Filipinos flowed across these different spaces:

