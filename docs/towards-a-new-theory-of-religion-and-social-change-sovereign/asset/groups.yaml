    El Shaddai 具有创业精神、热情、直觉性（Meyer 2010），并坚定强调圣灵的即时性与临场感。它不仅通过道路，还通过无线电、电视和社交媒体旅行，以新的方式接触新的人。它的传播模式绕过了作为宗教再生产传统空间的“教会-广场组装”的模式。


    # 生成式交互性


    El Shaddai 的盛行预示了“教会-广场组装”的演变——从对等级森严的封闭空间的强调，转变为对媒体、流动性和扁平空间的新侧重（许多菲律宾人在国外生活和工作，构成了
    El Shaddai 巨大的离散观众）。Francisco (2010) 指出，El Shaddai“成长于马里亚诺·‘米克’·韦拉德（Mariano “Mike”
    Velarde）主持的一档广播节目”，现在在菲律宾及海外拥有多达一千万名粉丝……这种广泛的覆盖之所以可能，是因为它通过大众媒体与社区之间独特的相互作用构建了虚拟的宗教空间”（Francisco
    2010: 201）。Wiegele 表达了类似的观点：


    从成立之初，这个社区在很大程度上就是一个由大众媒体介导的社区。尽管 El Shaddai 的户外集会和其他活动现在是现场体验的，但大众媒体实际上产生了了这种‘现场性’。正是无线电和电视的主导地位，使
    El Shaddai 的体验与主流天主教体验区分开来，并有助于创造其的一些独特特征——一种新形式的宗教空间、对宗教社区的新理解，以及与上帝更个性化的关系。（Wiegele
    2005: 41）


    El Shaddai 实践的关键特征包括：在当地村庄分部举行的祈祷活动（gawain）、每周在马尼拉湾附近的菲律宾国际会议中心（PICC）空地举行的露天集会、这些集会的电视直播，以及在马尼拉及全国范围内几乎
    24/7 的无线电存在（Wiegele 2006: 497）。根据 Wiegele (2005: 58)，El Shaddai 的大众集会及其在无线电和电视上的传播，将‘神圣和仪式空间从局部地区延伸到了……家中’。El
    Shaddai并不要求信徒放弃对教区的“传统依恋”，尽管如此，这些‘大众介导的宗教实践’指向了**迈向宗教与社会变革的新理论**中的空间转型。


    在菲律宾群岛各地的城镇和城市中，El Shaddai 是一种新型的菲律宾基督教，它积极开发了不‘受困于某一特权地区’的‘全球网络’（Meyer 2010:
    742）。因此，它属于另一种教会-广场组装，它不是由殖民的、全景式的内外的城市形态形成的，而是由全球城市横向、根茎状的连接形成的（Sassen 2005）。2009年，El
    Shaddai 在靠近马尼拉的 Parañaque 开设了一座巨型教堂。这座“国际祈祷之家”可容纳多达 16,000 人，并声称是亚洲最大的崇拜中心（Wiegele
    2011: 175）。它通过 Foursquare 和 Facebook 等应用和平台联网，在建筑和审美上更像商场而非菲律宾大多数天主教教堂典型的巴洛克风格；它充当组装的节点，连接的不是地理受限的社区，而是分散的、全球菲律宾人口，其中许多人居住在香港、日本、沙特阿拉伯、英国和美国海外。这种组装形式与教会-广场组装完全对立，但又与它共存，产生了线条与空间的复杂纠缠。它通过将教会-广场组装的封闭、围墙空间与新的虚拟、跨国和后广场城市空间重叠，预示着教会-广场组装解构的加速。


    ## 组装与变


    研究宗教就是研究流动，这同时也意味着从空间角度研究宗教。流动从一个空间流向另一个空间，进行占据、退缩和兴起。它们跨越边界并召唤国家。作为流动的宗教因此具有深层的政治性。这些流动并非由人类引导或编写。相反，它们是相互作用的复杂结果，这些作用在持续的互动转型过程中配置了人类和非人类元素。本章发展的宗教与社会变革论述，是本着
    Deleuze 和 Guattari 的游牧科学概念（2014: 420–36）的精神提出的，即作为一种关于流动、湍流涡、活跃空间、事件和问题域的科学。


    我勾勒了四个基督-菲律宾组装：第一个产生于《西印度群法》（Laws of the Indies），这是一份西班牙殖民政策文件，强制在新世界和菲律宾群岛各地建立城镇和城市，我称之为“1593年菲律宾教会-广场组装”。菲律宾人从他们分散的定居点被搬迁并集中在新的城镇和城市，作为基督教化和边界划分过程的一部分：城镇和城市内部传教目光的范围之外是山丘、河流和森林，即外部尚未基督教化的空间。新的城镇和城市不仅建立了这种内外的边界；还监管了跨越和穿过这一边界的性别化和种族化流动与运动，这些运动沿着道路和海路线的纤维网络进行，而这些网络也将群岛接入了一个从殖民边缘到主权中心的新兴提取经济。教会-广场组装是一个奠基时刻，其表述方式仿佛菲律宾是一个空地。随后的三个组装都是它的变体，产生于固态变为液态和移动态的特定转折点或相变。


    第二个组装在山间洞穴和临时纪念碑中脉动：我称之为“1841年菲律宾巴纳望（Banahaw）组装”。该组装在时间和空间上分布在历史事件之间，始于圣约瑟兄弟会（Cofradia
    de San José）——这场起义在 1841 年在巴纳望山附近进行了最后的抗争，以及 20 世纪 1950 年代对里萨纪念碑的系列化建造。后者是美国“城市美化”主义和纪念碑主义本土化挪用的证据，并标志着一个名为“里萨主义”（Rizalism）的全新宗教的出现。这些新的“里萨派”教会之一——神圣之城（Ciudad
    Mistica de Dios），还开始构造自己的城市想象，一种宗教性的城市化：在农村地区建立了一个城市，作为菲律宾人建立真正的基督教社区的场所，并由一支女性宗教官员领导。这些事件和时刻共同建立了一个对西班牙建立的内外流动机制的替代方案，这种方案不会被美国人发生实质性改变：建立了新的宗教知识和体验的循环与中心，赋予了菲律宾男女更高的宗教权力和权威。如果将这种组装的地图叠加在教会-广场组装之上，它将使巴纳望山通过城镇的传教目光变得可见——不再是一个待基督教化的空间，而是一个持续的宗教与社会即兴空间。


    第三个组装是其前者的逻辑加速，产生于偏远的农村地带，那里由被边缘化和被剥夺的原住民居住，并成为真正的菲律宾人的想象和真实基督教化的场所：我称之为“1967年菲律宾世外桃（arcadian）组装”。它反转了教会-广场组装授权的内外流动机制，并不是像巴纳望组装那样借用其人工并重新文化，而是通过让外部变为内部、内部变为外部。农村地带取代了城镇成为真实宗教和真实社区的空间，反之亦然。


    ![](img/91d03b06161479dec764992b403c4aec_141_0.png)


    图 10 四个组装的叠加。© Atsuhide Ito。


    第四个也是最后一个组装与另一种新宗教的兴起（名为 El Shaddai 的天主教福音运动）以及马尼拉的新城市主义有关。它沿着无线电波、电视节目、大众集会、巨型教堂表演、社交媒体平台以及离散社区传播：我称为“2009年菲律宾媒体-教会组装”。它跨越物理和虚拟空间运作，为最初由教会-广场组装建立的内外流动机制增加了一层全球网络复杂性。


