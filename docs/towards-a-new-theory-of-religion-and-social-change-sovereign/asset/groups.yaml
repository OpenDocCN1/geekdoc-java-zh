    # 生成式交互性 113


    当我们的目光从马尼拉转移到受革命影响的农村地区时，我们遇到的是我们国家线性历史难以容纳的经历和叙事。与其说是从殖民黑暗到独立之光的简单过渡，不如发现菲律宾人民在不断变化的局势下转变着身份，在国家、家庭和教会之间权衡他们的忠诚，并将“宗教的”与“世俗的”这些现代类别混合在一起。（Ileto
    1998a: 97–8）


    今天，那座山因其下坡上的“里萨拉主义”（Rizalist）教会而广为人知，这些教会因尊崇将民族英雄里萨视为菲律宾的基督而得名。里萨达是一位游历丰富、受过良好教育的菲律宾小说家兼医生，于1896年在马尼拉处决，但随后被美国人提升到民族英雄地位，并在群岛各地建造了纪念他的纪念碑。在一次对里萨拉主义团体、运动和教会的调查中，Foronda
    (1961) 认为，他们的信仰和实践证明了“生活在山区和偏远村庄的贫穷文盲者”（1961: 37）中仍然存在着本土的、前殖民时期的祖先崇拜。这一观点否定了里萨拉主义作为一种新宗教形态的新颖性，因为它拥有自己的物质文化，并反转了教会-广场组合的性别化和种族化形态。


    一座里萨教会——“上帝圣城”（Ciudad Mistica de Dios）于20世纪50年代搬到了巴纳霍山，据报道其领导人阿马多·苏亚雷斯（Amador
    Suarez）受到了“圣波”（Santong Bayes）的引导。此后，该社区建造了一个大型建筑群，包括两座教堂、一个诊所、一个工作坊、一个带有客房的领导人住所、大约四十名修女的宿舍以及一个大型厨房和食堂。这些建筑位于院落中心，而在边缘建造了信徒的住所。《印第亚法》（Law
    of Indias）的核心要素完备：权力位于院落中心，像光芒一样向外辐射。此外，主建筑的屋顶呈一只展开翅膀的鸽子形状，象征着圣灵的临在。圣城在巴纳霍山建造一座“城市”，恰恰是试图建立一种反城市主义——如果你愿意，可以称之为新耶路撒冷——在一座他们声称具有圣经基础的末世论意义的山上。然而，圣城的意义远不止于：它不仅挑战了宗教权威的种族阶层制度，并构成了一种新型的宗教城市化形式，还因其女性最高领袖以及精神合法性位于
    Ileto 和一个修女团队中的这一点而受到注目（Quibuyen 1991）。


    根据 (1998b) 的观点，像上帝圣城和菲律宾精神天主教教会等团体对里萨的崇拜和纪念，颠覆了国家对这位英雄的官方纪念。但对于 Lahiri (2002)
    来说，宗教团体和运动对里萨的崇拜和纪念标志着巴纳霍山等旧边疆地区的殖民化，以及它们转化为官方民族主义的意识形态道具（见 Tremlett 2008b）。然而，我认为，建立在巴纳霍山坡上的里萨纪念碑指向了一个更复杂的局面，其中包括对丹尼尔·伯纳姆（Daniel
    Burnham）及其助理皮尔斯·安德森（Peirce Anderson）引入菲律宾的世俗城市设计审美挪用，当时他们开始向菲律宾引入一种新的城市主义。


    西班牙统治的核心是内城（Intramuros），其形态特征是围墙以及内外之间的剧烈划分——这是一种固化在坚石中的分类法和管理模式。伯纳姆引入菲律宾的“城市美化”审美改变了首都的外观和感受。首先，马尼拉的中心转移到了外城（Extramuros）。其次，修建了新的道路、大道、绿地、公共建筑和纪念碑，旨在让“人们能够自由地看到公共办公场所、观察公民仪式并进行交流”（Morley
    2018: 79），这在西班牙统治时期是不可能实现的。第三，建造一座作为民族自豪核心的里萨纪念碑，并发明了一种标记里萨生历


    ![](img/91d03b06161479dec764992b403c4aec_125_0.png)


    图 5 巴纳霍山菲律宾精神天主教教会外的里萨纪念碑：注意头部的角度。来源：作者。


    历法成为更广泛的城市设计战略的关键元素，旨在促进“道德、智力和和政府的进步”（Morley 2018: 49）。关于后者，里萨纪念碑也在全国各地的镇市上被建造，它们本身也成为了公民仪式场所。


    # 迈向宗教与社会变革的新理论


    重要的是，建立在巴纳霍山坡上的里萨纪念碑，其描绘里萨的方式与官方纪念碑几乎相同，即：穿着同样的西方装束，摆出英雄式的、僵硬的姿态，并置于混凝土底座上。因此，这些表述在山上复制了20世纪初美国纪念碑式建筑中典型的现代性元素。此外，里萨头部的角度暗示了“点头”（请原谅这个双关语）——对另一位菲律宾英雄的巴洛克式描绘，以及将从多个来源汲取的多种元素缝合在一起。


    ![](img/91d03b06161479dec764992b403c4aec_126_0.png)


    图 6 圣保罗市教堂广场内的里萨纪念碑：注意头部的角度。来源：作者。


    无疑对于美国人来说，将里萨的身体作为纪律和克制的对象的纪念碑式表现，是复制和传递该时期新教男子气的一种手段，这种男子气强调勇气、纪律、独立、力量和意志等美德。根据
    Nagel (1998) 的说法，这种混凝土中的男子气与民族主义、资本主义和现代化进程以复杂的方式联系在一起。在巴纳霍组合中，这些元素被重新配置并重新置于一系列新的即兴特征之中，将这座山指向了宗教即兴和实验的场所。


    # 1967年菲律宾田园组合


    与教会-广场组合的封闭城市形式，以及（某种程度上预示了）媒体-教会组合的分布式且开放的根茎状连接相对，另一种是田园组合（adian combination）。这种组合也代表了巴纳霍组合的发展：当巴纳霍组合反转了教会-广场组合的种族化和性别化形态时，田园组合的形态产生于对城市现代性的纯粹抵抗，这种抵抗部分基于梵蒂冈二会的浪漫重新迷幻神学，但也源于关于简单与真实的本土以及新的生态神学（Bullock
    2017; Garigueux 2008）。


    菲律宾出现了一种政治神学，最初是对20世纪50年代农村经济和政治危机的反应，在70年代发展为左翼神学，最近则变成了一种完全面向天主教复兴的神学，通过庆祝菲律宾本土的生活形式和知识来实现。Giordano
    (1988) 详述了菲律宾教会梵蒂冈二后的时期，确定了教会内部某些元素致力于解决广泛的贫困问题、经济和政治不平等，以及军队和警察所犯的人权侵害行为。根据 Giordano
    的说法，1967年在洛佩斯主教（Bishop Lopez）的指导下，拉班社会行动委员会（NASSA）的建立，导致了教会内部元素对政府采取日益批判的立场。


    这一时期见证了“解放菲律宾基督徒”团体的成立，该团体认同菲律宾共产党（CPP）的分析


