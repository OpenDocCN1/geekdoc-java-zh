    totality. And it is only by treating the myth as if it were an orchestral score,
    written stave after stave, that we can understand it as a totality, that we can
    extract the meaning out of the myth (Lévi-Strauss 2001: 40)


    Lévi-Strauss''s method of reading horizontally and vertically draws upon Saussure''s
    model of language with its syntagmatic and paradigmatic dimensions, but also Vladimir
    Propp''s formalism and his earlier work on fairy tales (see Hawkes 1983: 67).
    However, it points to Lévi-Strauss''s fascination with music (Tremlett 2008a:
    58–61) and a more general but important eclecticism: structuralism, as will be
    seen momentarily, cannot be reduced to its linguistic or Saussurean inheritances.


    Once extracted, the ''bundles of events'' or ''mythmes'' are re-composed into
    binary oppositions that are then compared to other versions of the same myth or
    other myths from the same cultural area, because


    to study a myth is to study the relationships of ''transformation'' ... between
    the different versions of the myth and between the myth and other myths. With
    this approach, neither a single version nor a synthesis of several versions is
    an appropriate object of study. A myth should be considered, rather, as the set
    of all its versions. (Sperber 1996: 27)


    In The Raw and the Cooked (1992), Lévi-Strauss states that he will treat ''the
    sequences of each myth, and the myths themselves in respect of their reciprocal
    interrelations, like the instrumental parts of a musical work'', studying them
    ''as one symphony'' (1992: 26). The book begins with an ''Overture'' and continues
    through a series of variations, symphonies, solos, fugues and a chorus. Lévi-Strauss
    claims classical music emerged with the decline of myth in Western societies and,
    with an almost Nietzscheschean flourish – if we remember that for the early Nietzsche,
    Wagner''s work stood out against the disintegrative, centrifugal forces of modernity
    – adds that both myth and music ''are instruments for the obliteration of time''
    (1992: 16).


    In The Raw and the Cooked, Lévi-Strauss argues that a number of apparently distinct
    Amerindian myths drawn from a wide geographical and cultural area about the origins
    of fire, the origins of wild pigs and the origins of tobacco are actually interrelated,
    and indeed are variations or kaleidoscopic transformations of one another. The
    upshot of these allusions and pronouncements is an approach to myth that breaks
    entirely from previous assumptions about the function of myth in early societies
    and their meaning. If Carl Jung and Joseph Campbell had claimed that the study
    of myth revealed universal, psychological archetypes which pointed to deep and
    profound ontological meanings about human existence and possibilities for well-being,
    Lévi-Strauss re-fashioned the study of myth in terms of a mathematical formula
    (Lévi-Strauss 1993b: 228) in which the meaning of myth was to be found not in
    any isolated figure or element but in their combination and transformation. In
    an interview with the philosopher Didier Eribon, Lévi-Strauss said, ''everything
    I have written on mythology I wanted to show that one never arrives at a final
    meaning'' (Lévi-Strauss and Eribon 1991: 142). According to Lévi-Strauss, myths
    are authorless and come from nowhere, in the last analysis reflecting not social
    structure or any spiritual truth, but the (Kantian) mind that generates them.
    It is for this reason that Lévi-Strauss suggests that his aim is to show ''not
    how men think in myths, but how myth operates in men''s minds without being aware
    of the fact, and that his point of departure is not any human thinking subject'',
    but instead proceeds as the process were taking place in the myths'' (1992: 12).


    Importantly, Lévi-Strauss''s approach to myths draws not just from linguistics
    and music, but also from cybernetics and information theory. The myth is a message,
    and the different versions constitute different transmissions of the message.
    However, in each transmission, different elements of the message are amplified
    or distorted or altered in the process. According to Lévi-Strauss,


    GENERATIVE INTERACTIVITY


    the permutations of myth offer a glimpse into the operations of the mind and its
    attempts to grapple with a range of philosophical and sociological problems. The
    myths are messages sent by society to itself in its attempt to resolve the problems
    it faces – as Lévi-Strauss suggests, ‘the purpose of myth is to provide a logical
    model for overcoming a contradiction’ – but, precisely because these problems
    cannot be solved, new versions of the myth continue to be generated ‘until the
    intellectual impulse which … produced it is exhausted’ (Lévi-Strauss 1993b: 229).
    This means that there are no authors, no originals and no copies of these artefacts,
    only messages without origin, generating variations and transformations that proliferate
    until they are, finally, exhausted.


    ## Four Christo-Filipino assemblages


    I have long been attracted to Marxist and structuralist accounts of change. The
    insistence – in Marxist accounts – on the centrality of ideology to processes
    of change, seems undeniable. But the various Marxisms cannot escape their implication
    in linear, evolutionist and teleological thinking. Wrapped within Marx’s stage-like
    conception of history (that is, a history that proceeds in stages and which is
    also a kind of theatre in which each character plays a well-defined part) is a
    chosen subject – the proletariat or working class – plays a redemptive and eschatological
    role bringing freedom to all, in almost notwithstanding Louis Althusser’s attempt
    to re-construct a Marxism without a subject; see Althusser 2005).


    Lévi-Strauss’s account of transformation is at the centre of Lévi-Strauss’s thinking
    is entropy talking about myths, and the inevitability of decay. In Tristes Tropiques
    he declares that the only ‘societies we are able to study today are debilitated
    communities and mutilated social forms’ that have been shattered by the development
    of European civilization, phenomenon which, for a widespread and innocent section
    of humanity, has amounted to a monstrous and incomprehensible cataclysm’ (2011:
    326). But is change inevitably a sad fable of contraction and exhaustion? Might
    there be found another story at the centre of which is not dissipation or expansion,
    but creation and transformation?


    Before moving on to describe my four Christo-Filipino assemblages, a few words
    need to be said about how the question of religious and social change in the Philippines
    Philippine Studies. Approaches to date have tended to be distinctly modernist
    in their sensibility albeit implicitly spatial (see Kataoka 2012: 361). For example,
    an urban–rural distinction has been constitutive of historical and ethnographic
    works covering both the Spanish and American periods, as a means of distinguishing
    different experiences of colonization, Christianity and, in the twentieth century,
    Philippine modernity. As such, accounts of the Christianity of the archipelago
    typically distinguished lowland from mountain populations in terms of their differing
    levels of exposure to evangelization and in terms of the ‘little’ and the ‘great
    traditions. These distinctions have enabled contrasts to be drawn between the
    religities of varied peripheries and borderlands at the edge or simply beyond
    the reach of the colonial town, sometimes taking the perspective of a putative
    Catholic orthodoxy (Schumacher 2009), sometimes that of a liberal modernity (Sturtevant
    1976). The alter-Christianities of the backwoods and the mountains have often
    been represented as illegitimate synbrids of religio-politics and/or irrational
    expressions of inchoate political demands.


    The question of religion and social change has also been broached with an urban
    framework, drawing upon studies of Southeast Asia’s classical city-states but
    in relation to conceptions of spiritual and religious power, authority and leadership.
    The studies in question – notably Robert Heine-Gelders’ State and Kingship in
    Southeast Asia’ (2006) – assume a significant Indic influence upon the region:

