    of Filipino Christianity that actively develops ''global networks'' that are not
    ''tied to one privileged locality'' (Meyer 2010: 742). It is, as such, of the
    other church-plaza assemblage, formed not from a colonial, pan-optic urban morphology
    of insides and outs but rather from the transversal, rhizomatic connectivities
    of the global city (Sassen 2005). In 2009, El Shaddai opened a mega-church in
    Parañaque, near Manila. This ''International House of Prayer'' seats up to 16,000
    people and it claims to be the largest centre of worship in Asia (Wiegele 2011:
    175). Networked through apps and platforms such as Foursquare and Facebook and
    architecturally and aesthetically resembling a mall more than the baroque style
    typical to most Catholic churches in the Philippines, it acts as a node of assemblage
    not to a geographically bounded community but rather to a dispersed, global Filipino
    population many of whom reside overseas in Hong Kong, Japan, Saudi Arabia, Britain
    and America. This assemblage form is the polar opposite to the church-plaza assemblage,
    yet coexists with it, generating a complex entanglement of lines and spaces. Its
    overlapping of the closed, walled spaces of the church-plaza assemblage with new
    virtual, transnational and post-plaza urban spaces points to the acceleration
    of the decomposition of the church-plaza assemblage.


    ## Assemblages and change


    To study religions is to study flows, it also means studying religions spatially.
    Flows flow from one space to another, occupying, ebbing and swelling. They cross
    borders and invoke states. Religions as flows are, as such, deeply political.
    These flows are not directed or authored by human beings. Rather, they are the
    complex outcomes of interactions that configure human and non-human elements in
    continuous processes of interactive transformation. The account of religion and
    social change developed in this chapter was made in the spirit of Deleuze and
    Guattari’s notion of nomad science (2014: 420–36), that is, as a science of flows,
    turbulent vortices, active spaces, events and problemmatics.


    I sketched four Christo-Filipino assemblages: the first emerged out of the Laws
    of the Indies, a Spanish colonial policy document which mandated the construction
    of towns and cities across the new world and the Philippine archipelago and I
    called it the Philippines 1593 church-plaza assemblage. Filipinos were relocated
    from their dispersed settlements and concentrated in the new towns and cities
    as part of a process of Christianization and boundarymaking: beyond the evangelized
    gaze of the town and city inside were the hills, rivers and forests, the yet-to-be-Christianized
    spaces of the outside. The new towns and cities not only established this inside-outside
    boundary; they also regulated the gendered and racialized flows and movements
    across and through it, along the fibrous networks of roads and sea-routes that
    also plugged the archipelago into an emergent economy of extraction from the colonial
    periphery to the sovereign centre. The church-plaza assemblage was a founding
    moment, articulated as if the Philippines was an empty space. The three subsequent
    assemblages are all variations of it, arising from specific tipping points or
    phase transitions when solid states become liquid and mobile.


    The second assemblage pulsed in mountain grottos and improvised monuments: I called
    it the Philippines 1841 Banahaw assemblage. This assemblage was distributed temporally
    and spatially between historical events beginning with the Cofradia de San José,
    an uprising which made its final stand around Mount Banahaw in 1841, and in the
    twentieth century, the serial construction of Rizal monuments in the 1950s. These
    latter are evidence of the vernacular appropriation of American City Beautiful
    urbanism and monumentalism, and mark the emergence of an entirely new religion
    called ''Rizalism''. One of the new, ''Rizalist'' churches, the Ciudad Mistica
    de Dios, also embarked on fabricating its own urban imaginary, a kind of religious
    urbanization in which a city was built in a rural location as a site for the establishment
    of an authentic Christian community for Filipinos, led by a cadre of female religious
    officers. Together, these events and moments established an alternative to the
    inside-outside flow regime established by Spain, that would not be substantially
    altered by the Americans: new circulations and centres of religious knowledge
    and experience were established that privileged the religious power and authority
    of Filipino men and women. If a map of this assemblage were to be laid over the
    top of the church-plaza assemblage it would make visible Mount Banah through the
    missionary gaze of the towns, not as a yet-to-be-Christianized space, but as a
    counter space of ongoing religious and social improvisation.


    A third assemblage, a logical acceleration of its predecessor, emerged in far-flung,
    rural backwaters inhabited by the marginalized and dispossessed indigenous peoples
    to become an imaginary of the true Filipino and a site for authentic Christianization:
    I called it the Philippines 1967 arcadian assemblage. It reversed the inside-outside
    regime of flows authorized by the church-plaza assemblage, not by borrowing its
    artefacts and re-culturing them as with the Banahaw assemblage, but by making
    the outside the inside and the inside outside. Rural backwater replaced the town
    as the space of real religion and real community, and vice versa.


