    理论上，东南亚的古典国家是高度集权的，并体现了源自印度影响的思想，即神权王权以及宇宙与陆秩序之间的平行关系。统治者的首都是该国家的魔力中心，而在其中心则是一座寺庙或皇宫，其露台和朝向是根据复杂的象征主义设计的，代表着神灵居住的须弥山。王国是宇宙的微观世界，因此作为神之后裔或神化身的国王在首都维持着王国的和谐，使其匹配宇宙的和谐。（Legge
    1999: 32）


    本尼迪克·安德森（Benedict Anderson）的文章《爪哇文化中的权力思想》（1972）重塑了海因-盖尔登（Heine-Geldern）的一些观点，并将其应用于20世纪的印度尼政治，但这些观点也被应用于其他地方。菲律宾历史学家R.
    C. 伊莱托（R. C. Ileto）对19世纪菲律宾苦难（pasyon）文本进行了严谨的文本分析，并讨论了这些文本在1896年革命以及19世纪和20世纪初反西班牙和美国殖民统治起义中的作用，这很大程度上借鉴了泛东南亚精神权力观念。伊莱托明确借鉴了安德森，他的研究对苦难文本中的精神权力（kapangyarihan）和内在性（loob）问题采用了细致的方法，将*loob*视为在积累*kapangyarihan*过程中需要培养的空间（Ileto
    2011: 24–5）。赫尔米尼亚·梅涅斯（Herminia Meñez, 1999）在关于后马科斯时期菲律宾政治的文章中也引用了安德森，强调了护身符（anting-anting）的作用，这些“能量的集中力量”是政治领袖具有权威性且备受追捧的符号和权力宝库（参见
    Sidel 1999）。对于伊莱托和梅涅斯来说，关于权力和威的宗教思想——这些思想长期以来与该地区早期古典国家的表述脱节——构成了解释菲律宾及更广泛东南亚政治某些特征的文化常数。¹


    对菲律宾采用更明确的空间和地理方法虽然可能探讨了变化的问题，但往往对宗教不感兴趣。莫利（Morley, 2018）对群岛美国城市化的研究补充了少数几篇文章和书籍（例如
    Connell 1999; Shatkin 2005; Ortega 2016），旨在记录该国的城市历史。一个例外是何塞·马里奥·C·弗朗西斯科（Jose
    Mario C. Francisco）的文章《菲律宾传统与魅力派基督教中宗教与民事空间的制图》（2010）。弗朗西斯科感兴趣的是他所谓的“特定宗教机构对神圣空间的构建”，以及这些构建如何构成每个群体“自我理解”的表达（2010:
    215），塑造了他们与其他宗教群体以及更广泛的民事社会的互动（2010: 187）。在下文中，我质问了弗朗西斯科选择分析的四个空间中的三个，但我将它们视为装配（assemblages），并切断了弗朗西斯科建立的它们与自我理解或主体性之间的联系。


    ## 1593年的菲律宾教堂广场装配


    在欧洲人到达该地区很久以前，城市化在东南亚大陆就已经盛行（Keyes 1995）。然而，马尼拉很大程度上是西班牙殖民主义的产物，其核心是《印度西群法》（Laws
    of the Indies）所规定的“聚居”（reduction）过程。这些法律由腓力二世于1573年颁布，将西班牙在所有殖民领地的发现、定居和和平殖民实践法典化，确保了“在整个西班牙帝国地理范围内建立统一的城市形态”（Morley
    2018: 33）。这些16世纪的法令是西班牙在美洲城市化经验、古典城市化理论以及当时欧洲城市形式理论的结合，例如文艺复兴建筑师和哲学家莱昂·巴蒂蒂塔·阿尔伯蒂（Leon
    Battista Alberti, 1404–72）开发的理论（参见 Reed 2002: 166; Morley 2018: 34，也见 Choay 1997）。法令要求将菲律宾群岛分散零散的原住民人口重新安置到城镇中心，作为集中和巩固西班牙权力以及促进改教的手段（Francisco
    2010: 188）。这些中心围绕着教堂和广场建立，它们位于网格的核心。根据列斐布尔（Lefebvre），这些指令按照发现、定居和和平三个主题进行安排。结果是空间的一种层次化组织，从城镇中心向外逐渐延伸，从城市开始。规划是一个无限延伸的网格：每个方形或矩形地块都被分配了特定的功能：教堂、行政建筑、城门、街道、仓库等。因此，高度的隔离被叠加在一个均匀的空间之上……[它]也是一种生产工具：一种社会结构（Lefebvre
    1991: 151）。


    在西班牙到达之前，菲律宾人主要居住在海岸和河流沿分散定居点，与东南亚其他地区已经城市化的口形成鲜明对比，这些前殖民人口植根于名为*barangay*（村）的单位。重新安置提供了一种监控菲律宾身体并将其限制在西班牙术语内的手段：本土躯体的迁移——或至少是将他们的区域划定为更大行政网格的一部分——允许他们用西班牙语和宗教术语进行识别……对当地居民的改教和殖民化需要通过武力或劝说使其进行物理迁移（Rafael
    1988: 90）。


    为了有效地对这些人进行管理和改教，有必要移除这些定居点并根据行政单位将其重新领土化，使教堂成为殖民政权的中心、源头和象征。从1580年代中期开始，马尼拉的发展随着围墙城市——内城（Intramuros）的建设而进行，它成为西班牙在群岛权力的宗教、政治和军事中心。到17世纪初，这里居住着近3万人（Morley
    2018: 36），是西班牙文明的象征，并与居住非欧洲人和原住民居住的城外（Extramuros）形成鲜明对比。整个17世纪，殖民政权组织了对吕宋、米沙鄢和米兰老岛边疆地区的定期远征，随后就是重新安置。像内城一样，殖民城镇是围绕教堂和中央广场或广场按网格模式建造的。每个新城镇都扩张了领土内的道路网络。城镇本身的功能像引力中心一样，周围聚集着较小的卫星*barrios*（区）和更小的*sitios*（小社区）。


