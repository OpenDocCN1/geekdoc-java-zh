    1）。


    怀特豪斯试图从硬件化的、生物学给定的认知记忆系统来解释这些对比鲜明的宗教性、教学、传播和团结形式，即：一种“涉及关于世界的抽象知识”并“被编码在泛化图式中”的语义记忆，以及“涉及个人经验中实际发生的事件，编码的时间和地点构成了记忆表征的一部分”的情境记忆（2000:
    113）。根据怀特豪斯的观点，基于图式的语义记忆构成了新教教义知识的生物基础，这种知识通常通过重复的崇拜和学习形式进行传递，而这与本尼迪克·安德森（Benedict
    Anderson 2016）描述的想象社区的出现有关。情境记忆可以通过成年礼和恐惧仪式来体现（Whitehouse 2000: 21–3），“有助于将地方宗教社区的记忆结合在一起，他们共同的启示经验引发了一种强烈且持久的、无法用言语表达的团结感”（2000:
    112）。


    怀特豪斯对记忆系统、宗教和社会团结形式的兴趣是政治性的，因为他本人在进化的认知架构与宗教-社会形态之间建立了一条清晰的因果关系：


    记忆对社会理论的相关性首先由哈瓦赫（Halwachs）进行了实质性的探索，他的工作近期在关于“集体”和“社会”记忆的新学术浪潮中再次受到关注。大而言，这些文献关注记忆的意识形态内容，以及压制、遗忘、选择性回忆、衰变/扭曲以及关于记忆的替代话语的政治动态。许多研究的核心问题是在是谁控制了过去的表征，为了什么目的。我的论的核心方向相反。我不是在问政治组织和意识形态如何帮助塑造人们的记忆，而是在问不同方式激活的人类记忆普遍特征是否可能塑造政治组织和意识形态。（Whitehouse
