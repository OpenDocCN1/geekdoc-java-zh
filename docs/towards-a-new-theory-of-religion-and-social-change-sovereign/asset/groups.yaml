    # 生成式交互 123


    跨越了不同的社会经济阶层。这种话语通过关于发展、进步、工作和流动性的田野调查对话而产生，构成了一种可以称之为“道德经济”，根据布洛赫（Bulloch）的说法，菲律宾人通过这种经济来相对于远近的他人进行自我评估。


    布洛赫将简单生活的话语描述为一种“田园式的理想”（同上），可以看到其中渗透着对一种简单乡村生活方式的怀旧。事实上，菲律宾的景观通过殖民和后殖民项目（如城市化、集约化农业、旅游业和矿业）经历了深刻的转型。当代生态神学家将这些过程视为一种“去地图化”，在此过程中，由人、动物、地点和秘密之地之间有意义的关系而充满生命和活力的景观，被重新配置为空虚之地（Tsing
    2005: 28–9）。教会团体和非政府组织应对从资源开采到住房的发展，正日益成为一种梵蒂冈二会议后的政治参与神学。这种新方法的核心在于一种焦虑：自然——既在量化意义上（对树木、河流、山脉、海洋、鸟类、鱼类、猴子等实体的关注），也在质性意义上（涵盖了不仅是人之间，而且人与树、动物、河流、山脉和海洋之间的关系）——正在被钢玻璃制成的协调居住地取代。这些人工表面所实现的纹理和关系连接是相当不自然且去人性化的。正如菲律宾神学家埃德温·加里格斯（Edwin
    Gariguez）所观察到的，“（菲律宾的）生态问题是人类当下异化的一部分”，这种异化源于一种（西方的）“机械唯物主义观点”，这种观点将所有决策简化为“市场功利计算”（Gariguez
    2008: 4）。当“全球大经济的繁荣和安全取代了当地需求，个人对成就的焦虑超过了社区的完整性”时，环境恶化将日如既归（Walpe 2010: iv）。因此，产生了一种强烈的感：如果经济发展不从根本上进行重新定位，某些自然连接和关系将丢失或灭绝。但这些其他连接是什么？它们在何处寻找？为什么人们应该关心它们消失的可能性，甚至是必然性？


    对上述问题的简短回答非常直接。首先，所说的其他连接指的是一种宗教感，赋予环境及其物种（树木、河流、山脉和海洋）神圣的意义。其次，这种感被认为构建了居住在所谓“祖地”的本土群体的生活方式。第三，这些生活方式的灭绝将是灾难性的，因为它代表了文化和自然多样性的进一步延续；但重要的是，它也意味着一种生活方式的消失，对于像加里格斯这样的菲律宾神学家来说，这种方式具有更新和恢复人类关系的潜力，不仅与自然环境的关系，还与上帝的关系。


    那么，这种田园式组合的一个独特特征是“异化”与“真实性”隐喻的纠缠，这种纠缠不仅与城市有关，也与群岛的土住民有关。对于加里格斯等生态神学家来说，土住民已成为重新魔幻化和生态可持续性的
    Sign符号。根据加里格斯的说法：


    “生态灵性并非一条新发现的路径或视角。相反，这种灵性对与地球亲密关系的尊重自古以来一直是土住民传统的一部分，一直是他们文化、信仰以及作为一个族群身份的构成性主题。”（2008:
    29）


    事实上，土住民与自然（与其他物种、其他人类以及土地）的连接是以两种用语配置的：首先，buhay ay


    ![](img/91d03b06161479dec764992b403c4aec_135_0.png)


    图 8 马尼拉马拉特的街头小贩在售卖描绘菲律宾乡村田园理想的绘画。来源：作者。


    lupa at lupa ay buhay inang kalikasan。前者意思是“生命即大地，大地即生命”，而第二句简单意思是“大自然”。


    Buhay ay lupa sa lupa ay buhay 假设了人类生命、福祉与自然环境之间存在本质的连接，在这种关系中，人类和环境的福祉是相互且关联地构成的。它将自然构成所有人真实生养的来源。地球是城市居民已经脱离的一种生养形式，但对土住民来说仍然是真实的。生活方式中的地球福祉取决于被框架为土住民所行的“管家精神”伦理。这种管家伦理源于一种观点：景观及其树木、河流、山脉和海洋本质上是神圣的。事实上，根据加里格斯的，“祖地包含了人类社区、自然生态系统和土地灵性之间相互作用的景观，其中包括他们祖先的灵性”（Gariguez
    2008: 212）。


    126 迈向宗教与社会变革的新理论


    景观中祖先的存在表明，这种伦理具有一个时间维度，这种维度在时间上向后延伸，使现存者有责任维护祖先的居住地，这些地方包含了森林、河流、山脉和海洋等各种形式资源开采的目标。这种管家传统向未来延伸，将未出生者包含在祖先居住地的未来居住者和守护者。


    Inang kalikasan 表明自然与人类之间的关系类似于母亲与孩子之间的关系。对于菲律宾人来说，关系应当由晚辈对长辈的尊重以及他们之间的照顾责任定义，这种责任在母亲和后代之间创造了互惠循环。这种“民俗”伦理管家理论被教会活动分子进行了加工，使其似乎与天主教观念中认为的人类与上帝以及上帝造物之间的适当模式相交汇。因此，“我们文明和基督教宗教传统的救赎可能取决于我们从部落宗教经验中汲取见解的能力，这将帮助我们恢复上帝在造物中的临在，并轻盈地生活在……”（Gariguez
    2008: 8）。


    也许这种田园式组合更多像是一个由话语和文化的碎片构成的想象空间，而非任何真实的地点。但即使承认这一点，它仍然指向了正在运作的经验性分解过程，特别是在教会-广场组合上，并构成了巴纳豪（Banahaw）组合的明确加速。


    # 2009年菲律宾媒体-教会组合


    费迪南德·马尔科斯（Ferdinand Marcos，1917–89）的政权在菲律宾境外最著名的可能是关于腐败、谋杀和鞋子的故事，以及我们作为所谓的“权力革命”——该政权最终向之屈服（见
    Hamilton-Patern 1999）。少为人知的是马尔科斯对“新社会”的宣告以及他现代化国家的雄心计划。马尼拉启动了许多旗舰城市项目，包括清理非正式定居点和建设文化中心综合体（CCC），该中心如今是菲律宾文化中心的所在地，建立在马尼拉湾的填海陆上（Connell
    1999: 420）。马尔科斯对马尼拉的发展强化了一个从丹尼尔·伯纳姆（Daniel Burnham）就开始的过程，即教会-广场组合的去钙化。


    根据 Tiar（1995），在马尔科斯时代，马尼拉是一个低层城市，与巴黎、伦敦或纽约不同，它拒绝了居民的“视角”（Tadiar 1995:285）。但在马尔科斯独裁倒台和经过充分考验的民主恢复之后……一种正在改变大市面貌及其空间体验的新大都市形态出现了：“高天桥”（1995:
    286）。根据 Tiar 的观点，天桥的意义超过了市政当局缓解（消化）马尼拉交通拥堵的尝试。正因为天桥提供了观察城市的新视角，新的体验和心理状态才成为可能（1995:
    287）。


    Tiar 认为道路和天桥可能涉及城市和心理转型的这一暗示性主张很重要，因为在马尔科斯倒台后，特别是20 世纪 90 年代以后，马尼拉经历了城市发展的爆发，包括购物中心、封闭式社区、高层公寓和豪华酒店。这些新空间形式产生的城市坐标、频率和极化构成了教会-广场组合的巨大转型，而在这种新的分布式城市形态中，嵌入了
    El Shaddai（见 Ortega 2016: 167–88）。


