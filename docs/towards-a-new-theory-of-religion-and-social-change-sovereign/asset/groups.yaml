    that grow from a common evolutionary tree, the struggle for existence among species,
    the selection that eliminates the less fit – naturally became within a few years
    during the nineteenth century not simply a way of transcribing a political discourse
    into biological terms, and not simply a way of dressing up a political discourse
    in scientific clothing, but a real way of thinking about the relations between
    colonization, the necessity of wars, criminality, the phenomena of madness and
    mental illness, the history of societies with their different cases, and so on.
    (Foucault 2004: 256–7)


