    “塔加洛人之王”（Ileto 2011: 58），但他的统治很短暂。1870 年，西班牙政府报告指出，Apolinario 与圣母玛利亚一同出现，敦促他们重建兄弟会。当我11999
    年至2000 年在山里进行实地调查时，当地人告诉我 Apolinario 作为 *Santong Boces*（圣声）之一回归了，这些声音引导了像 Amador
    Suarez 这样的人在50年代初在 Banahaw 建立了 Ciudad Mistica de Dios。


    兄弟会以及19世纪菲律宾各种千年主义的一个的关键特征，是精神力量观念和末日思想如何结合，将家庭……从城镇通常紧密的血缘关系系统中重新路由，将男性和女性……与他们的配偶、孩子或父母分开，将他们汇到一个新的社会中（Ileto
    2011: 60）。根据 Ileto 的说法，这些起义和社区为反对西班牙殖民国家提供了“不仅是反文化，更是反结构”（Ileto 1999: 194）的可能性。这些反结构围绕着一个魅力领袖出现，这位领袖声称授权了这些其他的、千年时间观和泛灵论权力观念的介入。


    在《革命时期的乡村生活》（1998a）中，Ileto 将拉古贡省和奎松省的一些西班牙城镇（Tiong、Dolores、Sariaya 和 San Pablo
