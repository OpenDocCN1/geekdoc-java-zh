    2007; Shukait, Graeber and Biddle 2007; Wanless 2019）。当然，生活化宗教理论还假定在一个被称为“主体”的稳定、中心且组织节点周围存在互动性，这种做法保留了互动，但控制或消除了所有有趣且不可预测的量子部分。


