    不是。这种差异源于另一组认知能力。人类极度依赖合作以及关于潜在合作者的信息，这创造了特定的认知问题。人类拥有一套处理这些问题的战略能力。现在，一些超自然概念的呈现方式，恰使其能够激活这些战略能力。结果是，它们比其他概念更有可能产生高忠诚度以及其他“宗教”特有的心理和社会效应。（Boyer
    2000: 196；斜体见原文）


    这种思维方式的结果之一，是宗教信仰和宗教概念在多大程度上积累了它们完全自身的繁殖代理性，而这是以它们的类载体为代价的。正如贝林（Bering）指出的，“Boyer
    的模型认为，宗教概念通过其吸引注意的特性进入……世俗的认知机制，”并进一步指出宗教概念能够通过“劫持人类认知的某些方面”来“寄生”于世俗认知机制（Bering
    2003: 117）。这种立场也是新无神论民主义的悖论性特征，它一方面歌颂启蒙运动的理性以及被赋予理性的理性选择型人类主体；另一方面，却使用一种源自遗传学（模基因学）的模型来解释宗教信仰和概念的传播，这种方式消解了人类主体在获取信仰时本应扮演的角色，例如通过学习。


    模基因学（Memetics）——就像遗传学一样——是一种信息传递理论。然而，与遗传学处理存储在 DNA 中的信息传递不同，模基因学处理的是作为信息的文化和宗教的传递。一种进化的、模基因学的宗教观假设宗教可以被还原为语义数据包，例如信仰，这些信仰在人类群体中的传播、灭绝、扩散和持续性可以用遗传学术语进行建模。根据
    Mesoudi、Whiten 和 Laland 的观点，“文化（在此情况下是宗教的）知识作为离散的语义信息包存储在大脑中，就像生物信息存储在基因中的方式一样”（Mesoudi,
    Whiten and Laland 2006: 342）。下一步是以遗传学家研究基因在种群中分布的方式，来研究这些模基因（即宗教和文化的单位）的扩散或分布：


    > 我们的每个大脑中都居住着大量的思想，这些思想决定了我们的行为……一个产生于个体大脑中的思想，在其他人的大脑中可能拥有与其相似的后代。思想是可以传递的，并且通过从一个人传递到另一个人，它们甚至可以传播……文化首先是由这种具有传染性的思想构成的……因此，解释文化就是解释为什么以及为什么某些思想恰好具有传染性。这要求发展出一种真正的表征流行病学。（Sperber
    1996: 1；斜体见原文）


    由于如果一个模基因——在本例中，是对上帝的信仰——像基因一样，人们逻辑上必须假设人类是这种信仰的宿主或载体，就像他们是自我繁殖基因的媒介一样（Dawkins
    2007: 192）。丹尼尔·丹尼特（Daniel Dennett）在他的《打破魔咒》（2006）开头正是从这个点出发的：


    > 观察草地上的一只蚂蚁，它正费力地爬一根草，越爬越高，直到它掉落，然后一次又一次地爬，就像西西弗斯推石头一样，总是努力到达顶峰。蚂蚁为什么要这样做？在这种艰辛且不太可能的活动中，它在寻求什么利益？事实证明这是一个错误的问题。蚂蚁并没有获得任何生物利益。例如，它并不是试图获得对领地的更好视野，或在寻找食物或向潜在的配偶炫耀。它的大脑被一个微小的寄生虫——一种片形吸虫控制了……它需要进入羊或牛的胃部来完成它的繁殖周期。这只小脑虫正驱使蚂蚁处于一个有利于其后代的位置，而不是蚂蚁本身。这不是一个孤立现象。类似的，寄生虫会感染鱼类和其他物种。它们驱使宿主以一种不利宿主自身的方式行为。（Dennett
    2006: 3）


    由于一个模基因——在此处，是对上帝的信仰——像基因一样，人们逻辑上必须假设人类是这种信仰的宿主或载体，正如他们是自我繁殖基因的媒介一样（Dawkins 2007:
    192）。丹尼特讨论的核心是基因与模基因在种群中的分布。


