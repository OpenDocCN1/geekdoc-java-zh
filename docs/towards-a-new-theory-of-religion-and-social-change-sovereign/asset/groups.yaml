    In the social production of their life, men enter into definite relations that
    are indispensable and independent of their will, relations of production which
    correspond to a definite stage of development of their material productive forces.
    The sum total of these relations of production constitutes the economic structure
    of society, the real foundation, on which arises a legal and political superstructure
    and to which correspond definite forms of social consciousness. The mode of production
    of material life conditions the social, political and intellectual life process
    in general. It is not the consciousness of men that determines their being, but
    on the contrary, their social being determines their consciousness. At a certain
    stage of their development, the material productive forces of society come in
    conflict with the existing relations of production or – is but a legal expression
    for the same thing – with the property relations within which they have been at
    work hitherto. From forms of development of the productive forces these relations
    turn into their fetters. Then begins an epoch of social revolution. With the change
    of the economic foundations the entire superstructure is more or less rapidly
    transformed. In considering such transformations a distinction should always be
    made between the material transformation of the economic conditions of production,
    which can be determined with the precision of natural science, and the legal,
    political, religious, artistic or philosophical – in short, ideological forms
