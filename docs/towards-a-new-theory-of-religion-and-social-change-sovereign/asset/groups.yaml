    a world ‘out there’ (Ingold 1995: 58; see also 2001: 260–1). According to Ingold,
    the debate about the mind and cognition proceeds from the wrong premises: there
    is no unchanging, pre-engineered modular cognitive architecture, no solitary self-contained
    confronting nature, and no straightforward line of causality from the mental to
    the social. The mind, according to Ingold, is a series of potentials activated
    under different conditions rather than a set form that can be discerned at work,
    behind the varied products of human religion, culture and history. If the cognitivists,
    evolutionary psychologists and new atheists have somewhat about alternative models
    of cognition (see Tremlett 2011a), they have been similarly reticent about the
    political implications of their. The idea that a pre-specified cognitive architecture
    precedes the immersion of the individual in interactive environments has allowed
    them to formulate the following question: ‘Given the biases of the human mind,
    what makes religion possible?’ This question has considerable political consequences
    (see Edwards 2003: 292), and not only because its reversal ‘Given religion, what
    makes the mind possible?’ is so compelling (see Durkheim 1915), while its reconfiguration
