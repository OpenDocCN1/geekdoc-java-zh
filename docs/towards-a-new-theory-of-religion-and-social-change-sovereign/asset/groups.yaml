    ## 生物学


    斯宾塞和杜尔干在接触并参与19世纪生物演化论述后得出的关键结论是：自然界中简单的同质结构倾向于被复杂的异质结构所取代。尽管这是演化的一种解释，但它并非一种将“演化视为分化过程”的观点，而是一种拉马尔式的、“对线性进步的强力强调”（Bowler
    2009: 87）。让·巴普蒂斯特·马克思认为演化——或他所谓的“变异论”——最清晰的证据是，各种生物都在沿着自然阶梯向上攀爬，每一代都继承了前代积累的成就，并通过自身的努力将其增强并传递下去（Ingold
    2007b: 113；另见 Ingold 1986: 130–1）。马克思对19世纪宗教研究影响的最可能清晰的证据，可以在泰勒的“遗存”（survivals）理论中找到。


    泰勒将原始文化中的“遗存”定义为：“那些由于习惯的力量，从其原始家园被带入新社会状态的进程、习俗、观点……它们作为较旧文化状态的证明和范例留了下来，而一种较新的文化正是从中演化而来的”（Tylor
    1903: 1.16），而在《人类学：对人类和文明研究导论》中，他将其描述为“原始人未改变的遗迹”（1881: 18）。在《论野蛮宗教的局限》（1892）中，泰勒考虑了“宗教的融合”（1892:
    298），以及他所认为的将与“文明外来人”（1892: 299）接触而产生的“真正的本土理论”从“积聚与转化”（1892: 298）中剥离出来的重要性。“融合”威胁到了泰勒的理论操作：他的比较人类学使得起源的脉动以及信仰与实践线性序列的重构成为可能，但其基础是明确的数据集。遗存是这套理论装置的组成部分，他使用它的方式正如地质学家解释地层的方式一样——事实上，泰勒声称地质学建立了一个“处于人类学科学最基础的原则”（1881:
    33）——或者像古生物学家解读化石一样，即通过重构“谱系线内的形式序列”（Ingold 1986: 32；另见 Marett 1936: 26; Burrow
    1968: 240–1; Stocking 1995: 6）。这种拉马尔式的而非达尔文式的演化观暗示了一个持续发展的过程，其中新的特质和特征取代了那些在单一且连续的进步路线中被证明为多余的旧特征（另见
    Opler 1964: 142–3）。泰勒简单地将马克思的演化假设从生物学转移到了文化研究中：


    在把文化发展问题作为民族学研究的一个分支时，首要步骤是获得一种测量手段。寻找某种类似于用来衡量文明进步与倒退的确定界线，我们显然可以在过去和现在的真实部落和国家的分类中找到最好的方法。文明实际上在人类中以不同的等级存在，我们使能够通过正面案例对其进行估计和比较。欧洲和美国的受教育世界通过将国家置于一端、野蛮部落置于另一端，实际上确定了一个标准，并根据与文明生活的对应程度将人类安排在中间。（Tylor
    1903: L26；另见 1881: 24–5）


    泰勒在赞同这些观点方面绝非孤单：它是当时的范式（尽管毫无争议），并影响了马克思和弗洛伊德的学术研究，以及约翰·卢布克、亨利·萨默和路易斯·亨·摩根等思想者（见
    Kippenberg 1998: 298–300）。例如，卢布克在《文明起源》（1870）中建议：


    - 首先，现有野蛮人的状况和习惯在许多方面（尽管并非所有）与我们祖先在很久以前的情况相似

    - 其次，它们说明了我们内部正在发生的许多现象，即许多与现状毫无关系的习俗，甚至是一些像埋在土壤中的化石一样的思想观点

    - 第三地，通过它们，我们甚至可以穿透隔离现在与未来的某层迷雾。（1870: 1）


    那么，泰勒将单一进步路线的思想应用于宗教。这条从万灵论到科学的规划的路线，通过对信仰的研究可以被辨别出来。泰勒认为“灵体仅仅是拟人化的原因”（1903: II.108），这一主张将对灵体的万灵论信仰设定为关于世界的假设或解释，尽管这是一个错误的假设。假设宗教的起源在于解释世界的努力，这是一种蹒跚的科学，或者用斯托金（Stocking）那句令人难的话的话：“原始人在试图创造科学时，却意外地创造了宗教，而人类在剩下的演化时间里一直在试图纠正这一错误”（1988:
    192）。宗教只是理性故事中的一个章节，人类很快就会超越它；事实上，在《金枝记》第二版的序言（1900）中，弗雷泽认为可以写道：对人类信仰和制度的比较研究，不仅适用于满足受启蒙的好奇心和为学者的研究提供材料。如果处理得当，它可以成为加速进步的有力工具……如果它证明了许多我们通常认为稳固的东西实际上是建立在迷信的沙之上而非自然的岩石之上。

