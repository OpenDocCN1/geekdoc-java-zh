    # PREFACE AND ACKNOWLEDGEMENTS


    This book draws from two distinct research projects. Most recently I was involved
    in the REDO (Re-Assembling Democracy: Ritual as Cultural Resource) project, an
    international research initiative led by Jones Salomonsen and funded by the Norwegian
    Research Council. For my part, I conducted fieldwork with Occupy activists in
    London and Hong Kong. In Hong Kong, the work involved reconstructing the protest,
    whereas in London it involved documenting events. Before that, my research by
    the Arts and Humanities Research (now the AHRC)-funded doctoral research allowed
    me to work on some kilometres of Manila called Mount Banahaw. I conducted fieldwork
    with healers as well as small, spiritual groups, notable for their millennial
    conviction in the accumulation and distribution of sacred power and potency (kapangyarihan)
    and their veneration of Rizal – a Filipino hero who was executed by the Spanish
    colonial regime in 1896.


    The two projects shared a number of features: first an interest in change, particularly
    of the fundamentally transformative type. Second, the two projects shared an interest
    in space. The Occupy movement was about the rupturing of urban space in the expectation
    of alternative ways to assemble people together and to engage in projects. Similarly,
    the healers and churches in Mount Banahaw sought alternatives to what they perceived
    to be the unjust and immoral spaces of Manila, partly through pilgrimage to Banahaw''s
    sacred spaces and immersion in its caves, waterfalls and healing waters also through
    journeys along its hidden passages to secret chambers. By the time I was in Banahaw
    it was a veritable cottage industry of religious leaders, mystics, pilgrims, New
    Agers and earnest research students, all participating in and adding to the Banahaw
    imaginary.


    This book and its interest in change and space is very much a product of the work
    I pursued in Mount Banahaw in the Philippines and later with REDO, in London and
    Hong Kong. It is also the product of formal and informal interdisciplinary conversations
    at the boundaries of the study of religions where the humanities, the social and
    the physical sciences sometimes, and it would not have been possible without the
    goodwill and support of so many colleagues and friends. I would like to thank
    Lalle Prurslove, Lucy Carroll and Camilla Edwards at Bloomsbury for their enthusiasm,
    support and encouragement for this project. To my departmental, school and faculty
    colleagues (at and present) at the Open University – particularly Hugh Beattie,
    Gwilym Beckerledge, Marion Bowman, Graham Harvey, John Maiden, Susan Newcombe,
    Stephanie Sinclair, Helen Waterhouse and John Wolfe – but also Simon Carter, Peter
    Elmer, Rudy Harrison, Donna Loftus, Liz McFall, Jess Perriam and Peter Redman
    – an immense debt of gratitude: the collective mode of producing course materials
    at the Open University is something I have found, from the very beginning, to
    be a wonderful way of realizing a basic sociological insight, namely, that learning
    is both social and individual.


    To my friends and colleagues who participated in the REDO project which contributed
    so much to the writing of this book, many thanks to Tony Balcomb, Grzegorz Brzozowski,
    Gitte Buch-Hansen, Agnes Czajka, Gregory Delplace, Cora Alexa Doving, Samuel Etikpah,
    Marion Grau, Ron Grimes,

