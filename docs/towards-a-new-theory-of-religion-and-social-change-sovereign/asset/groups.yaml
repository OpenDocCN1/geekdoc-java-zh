    2003: 116）。在《热带哀情》中，列维·斯特劳斯提出了一个新科学的名称——“熵学（entropology）”——用以研究“瓦解”过程（2011: 414），并修辞地问道：“哪种精英除了漫不地拆解数十亿个结构并把它们还原到不再能够整合的状态之外，还做过什么？”（同上）。¹

    在其他地方，他对比了两种社会模型，重用了经典社会学中关于原始形式与现代社会形式的区分，以暗示：


