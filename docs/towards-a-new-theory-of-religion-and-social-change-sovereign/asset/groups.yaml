    much to escape these problems as to fundamentally change the question asked. Interestingly,
    it is Deleuze and Guattari''s reflections on Darwin (2014: 55) that suggest the
    point of departure. Darwin''s focus was on populations as aggregates of characteristics,
    rather than on species as fixed types:


    Darwin replaces types with populations. What this means is that Darwin does not
    see species as a fixed type, he sees species as a temporary and statistical aggregate
    of traits. Second, Darwin replaces degrees (of difference) between species for
    differential relations. The issue here concerns the development from one species
    into another. If a species is a population, then its traits will be grouped around
    a more or less stable point. However, at the margins the members of a population
    will deviate from the mean and possess a different relation among traits. The
    classic example here is the peppered moth. Prior to the industrial revolution
    in England the dominant colour in the population was white with dark spots ...
    This colour provided excellent camouflage against the light-coloured tree trunks
    of the time. At the margins of the population of moths, a few were darker. As
    pollution increased with the industrial revolution the tree trunks became darker.
    As a result, the darker moths were better camouflaged. This shift in colour became
    dominant in the population. Recently, a decrease in pollution in England has reversed
    the process, and now light coloured moths are dominant. Deleuze and Guattari think
    this process is better accounted for not in terms of degrees, where we would posit
    a series of increasingly darker moths, but as a differential relation within the
    population in which the statistical aggregate of traits re-organizes into a new
    statistical aggregate. (Adkins 2015: 53)


