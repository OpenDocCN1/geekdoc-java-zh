    # 序言与致谢


    本书汲取了两个不同的研究项目。最近，我参与了 REDO（重组民主：作为文化资源）项目，这是一个由萨洛森领导并由挪威研究委员会资助的国际研究计划。在我的工作中，我在香港与占领运动的活动人士一起进行了实地调查，而在伦敦则涉及记录活动。在此之前，由艺术与人文研究委员会（现
    AHRC）资助的博士研究让我对被称为马拉特的布鲁姆斯伯里山进行了实地调查。我与治疗者以及小型灵性群体研究了神圣力量与能量（kapangyhan），以及对1896年西班牙殖民政权处决的黎萨。


    这两个项目有许多共同点：首先是对变革感兴趣，特别是根本性的变革。其次，两个项目对空间感兴趣。占领运动关乎对城市空间的撕裂，期望以替代的方式聚集人们并参与项目。同样，布鲁姆斯伯里山的治疗者和教堂在寻找他们认为的拉特不公正且不道德空间的替代方案，部分是通过朝圣布鲁姆斯伯里的圣地并浸入洞穴、瀑布和泉水，部分是沿着隐藏通道前往秘密室。当我进入布鲁姆斯伯里时，那里已变成了一个由宗教领袖、神秘主义者、朝圣者、新时代者和专注的学生组成的真正家庭产业，他们都参与并增加了布鲁姆斯伯里的想象。


    本书及其对变革和空间的兴趣，很大程度上源于我在菲律宾布鲁姆斯伯里山的工作，以及随后在伦敦和香港开展的 REDO 工作。它也是宗教研究边界——即人文科学、社会科学与物理科学之间——正式与非正式跨学科对话的产物，如果没有许多同事和朋友的支持，这一切是不可能的。我要感谢布鲁姆斯伯里的
    Lalle Prurslove、Lucy Carroll 和 Camilla Edwards 对本项目的热情、支持和鼓励。感谢开放大学的部门、学院和教职同事（过去的及现任）——特别是
    Hugh Beattie、Gwilym Beckerledge、Marion Bowman、Graham Harvey、John Maiden、Susan
    Newcombe、Stephanie Sinclair、Helen Waterhouse 和 John Wolfe——以及 Simon Carter、Peter
    Elmer、Rudy Harrison、Donna Loftus、Liz McFall、Jess Perriam 和 Peter Redman —— 我对你们深表感激：开放大学课程材料的集体创作模式，我从一开始就发现是实现基本社会学洞察的绝佳方式，即学习既是社会性的，也是个人的。


    感谢参与 REDO 项目并对本书写作做出巨大贡献的朋们和同事，非常感谢 Tony Balcomb, Grzegorz Brzozowski, Gitte Buch-Hansen,
    Agnes Czajka, Gregory Delplace, Cora Alexa Doving, Samuel Etikpah, Marion Grau,
    Ron Grimes,


