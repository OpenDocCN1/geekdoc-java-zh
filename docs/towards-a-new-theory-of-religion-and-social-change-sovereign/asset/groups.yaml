    embraced phenomenological interpretivism inspired by his readings of Max Weber
    and Paul Ricoeur and, borrowing the notion of ‘thick description’ from Gilbert
    Ryle, he argued that the business of anthropology was meaning as a product of
    human intention.


    Geertz’s interpretive, cultural anthropology drew its intellectual nourishment
    from the hermeneutic tradition of Western philosophy. If, in the interpretation
    of a text, the hermeneutic moved from word to sentence and from text to establish
    textual meaning, so Geertz the ethnographer moved in ‘fields of synecdoches’ (Clifford
    1983: 131) from action to cultural whole:


    What the ethnographer is in fact faced with ... is a multiplicity of complex conceptual
