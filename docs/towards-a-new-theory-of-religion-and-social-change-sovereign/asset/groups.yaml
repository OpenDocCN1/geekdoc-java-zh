    and ‘Darwinism’ shared the assumption that ‘all forms of life in the world are
    related together and that these relations were ‘sufficiently uniform to be described
    under a general formula or law of evolution’ (1912: 9). According to Eric Sharpe,
    one of the consequences of this assumption was that, where one religion had been
    understood as a ‘revealed truth’, it thereafter became a ‘developing organism’
    (Sharpe 1986: 48; see also Cox 2006: 70–1), conceivable as something living, growing,
    changing and dying according to the same evolutionary laws of development, and
    knowable through following the same kinds of natural scientific methodologies
    that had been pursued by Darwin in his work about plants and animals in On the
    Origin of Species (1859). For Frazer, the theory of evolution was the foundation
    for a ‘mental anthropology’ which had emerged


    almost immediately [after] the promulgation of the evolution theory by Darwin
