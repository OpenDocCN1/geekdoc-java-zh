    objects in processes of change. Nevertheless, it is precisely Capps''s interest
    in change that a nomad science of religions seeks to take forward. What, then,
    might a general, nomadic theory of religious and social change actually look like?
    I think it should include the following three, basic methodological procedures:


    - methodological animism and fetishism: non-humans, humans, plants, objects and
    things, participate with humans across a flat ontological plane of interactions
    in which neither humans nor non-humans are privileged;

    - assemblages: interactions are shaped, stratified and spaced to form assemblages.
    Religions are assemblages formed from heterogeneous elements;

    - change can be specified by empirically establishing and comparing the flows
    and patterns of differently located religious assemblages.


    The animating principle of Deleuzian and Latourian ontological democracy offers
    a significant way forward to the question of religion and social change beyond
    the secularization thesis and its rival, lived religion, as well as the arguably
    stale methodological debates about reductionism, phenomenology and explanation
    (see Stoddard 2018). However, the idea of a horizontal plane of interactants is
    probably a poor starting point for entertaining questions of power and inequality.
    As such, it is vital to add a dose of Marx or a Haraway to the mix in order to
    draw out the extent to which interactions are asymmetrically entangled, just as
    a small drop of Lévi-Strauss allows for the sense that transformation does not
    necessarily come unexpectedly and catastrophically from without, but lies as a
    potential within any system, a point his work on myth – like his interest in music
    – bears out. It is to be hoped that others are interested enough to take up some
    of these ideas and put them to work.


    ## Afterword: Assemblage Drawings


    Atsuhide Ito


    One day, I received a request from Paul for a set of drawings to illustrate his
    book. The drawings were to visualize the changing power configurations in the
    Philippines via Gilles Deleuze''s concept of assemblages. The task of drawing
    made me think about lines and their relationship to drawing. The act of drawing
    a line, as simple as it sounds, causes a significant set of consequences. Drawing
    a line on a piece of paper divides a space into spaces and on a map the same act
    produces territories. The act of drawing structures a division and the consequence
    is territorialization. The simple act of drawing provokes a political consequence
    of division, territorialization and ownership.


    On the contrary to the function of lines that divide, lines can also connect.
    Lines connect a point to another, establishing an alliance and a relationship
    and further alliances and relationships to be multiplied. Lines also link up with
    other lines while disrupting its extension, be stop and turn, changing their directions
    to reach another line, in a way to de-territorialize the already established structure
    of divisions and alliances. In so doing, the lines not only connect points and
    produce alliances, but also they can be met and crossed by chance, countering
    the forces aimed at an intended direction. Lines direct the mind of the viewer
    to travel from one point to another. For instance, a projectile thrown towards
    a target generates a curvilinear line representing motion of the object. The potential
    point of impact is predicated as the projectile is thrown towards the target.
    That is to say, drawing is an assault. It is an act of directing thoughts and
    action towards a point at a given moment.


    When tracing the projectile motion the line is a re-wind of motion as well as
    a fast-forward of potentiality. Like a genealogist linking the present to the
    past, or a historian specifically identifying a cause of a present situation,
    lines are a time-travel apparatus linking the present to the lost and forgotten
    points in the memories that are constructed as one traces through lines. They
    lead us into the past and provide potential passages to the future.


    Lines also function to measure a length and duration. Through the process of measuring,
    making the observer compare and assess values in relation to the lines containing
    competing entities. For instance, in a swimming pool, swimmers compete by swimming
    in a rectangular area divided by equidistant lines. The architectural conception
    and construction of rectangles in a swimming pool is premised on a perception
    that space is isotropic: quality of space is the same everywhere. This allows
    production of spaces such as apartment blocks and multi-storey car parks. As Henri
    Lefebvre (1991) says, city planners and architects abstract, divide and produce
    spaces for the purposes of profit maximization and capital accumulation. According
    to Lefebvre, in the case of planning a multi-storey apartment building, the organic
    relations between the dweller and the place are severed; instead, the city planner
    and the architect abstract the space, divide and multiply the abstracted space
    into multiple spaces for the purpose of capital accumulation.


    In a drawing, lines are to deny and negate the lines drawn previously, or even
    when erased, inscriptions are still visible: the traces of the drawing instrument,
    and the pressure the body of the artist placed on the paper. It is important to
    stress that the artist not only use the hand and press the drawing instrument
    onto the paper, but also the whole weight of the body is used to in a mark. In
    this sense, the body of the artist becomes identical to the instrument: in short
    the body becomes a drawing machine.


    All the above complexity is conveyed in the set of assemblage drawings in Chapter
    3. In the first assemblage, power is concentrated in church squares. They appear
    rigid and static, and dwelt as an authority gathering forces into the concentrated
    squares despite being colonial installations established in a relatively short
    period of time. These squares are connected through invisible lines to form a
    canalized network of power. Through this practice of concentrated centres of power
    and subservient terminal points within the network, the system produces a geographical
    hierarchy between centre and periphery. When drawn, such a system settles into
    a relatively figural landscape. Nonetheless it appears as a familiar topological
    landscape but simultaneously emerges as skeleton power-scale, similar to the ways
    in which Arjun Appadurai (1996) outlines flows of power in the global network
    of distribution of media products and discourses.


    The second assemblage observes a shift of power away from the town squares; the
    periphery gains intensity. The margins and edges of the rectangle of paper is
    more intensely worked and charcoal is smeared repeatedly in contrast to the centre
    of the image that is sparsely populated and left as traces instead of being an
    actively present locus. ‘Intensity’ is significant in Deleuze’s writing the body
    is not an organized system for Deleuze but it is an intensified materiality ready
    for effects. In drawing, intensity is un-representable but only presents itself
    through the process of the artist becoming a machine, a pure drawing machine that
    breathes in and out, weight on paper, stretching and contracting the body to.
    Then, how does the artist express and communicate a flow of movement? An arrow
    would be an obvious but sign too literal. Instead, I have used lines with thick
    ends, which look like a head of a line, to communicate a direction. This has just
    kept the on the side of ‘asignifying traits’ Deleuze (70). Deleuze defines the
    diagram as ‘the operative set of traits and color patches, of lines and zones’
    (2005: 71), and he defines it with more details and says, ‘it is indeed a chaos,
    a catastrophe, but also a germ of order. It is a violent chaos in relation to
    the figurative givens, but it is a germ of rhythm’ (ibid.). I was pressing hard
    on cotton-like paper to leave definite traces of my thinking. Sometimes I was
    responding and more precisely reacting to the marks I had previously made. It
    was more accurate to describe it as a violent, obsessive and séance-like engagement
    with the materiality of the image unfolding before me. In this trance-like chrono-topos
    of drawing I was treading on the border of the ‘collapse of visual coordinates’
    (ibid.), sometimes holding myself as an organizer of marks, and other times being
    lost in the sensations of the seeming chaos. As a result the drawings were always
    at the point of near collapse, but I was holding them within a diagrammatic and
    figural structure. The drawings encounter regularly a breaking point but they
    are pulled back to remain diagrammatic and figural.


    In the third assemblage, forces explode from the periphery to a new centre. Power
    is dispersed and flies out into polyvalent directions that affect the atmosphere.
    Pictorially, the old centre square from which power once appeared caved in. If
    talking about the body, it resembles a great anus or gaping mouth in the act of
    sucking or spitting. Diagrammatically, the explosive sucking and spitting of power
    renders the traditional squares of power insignificant.


