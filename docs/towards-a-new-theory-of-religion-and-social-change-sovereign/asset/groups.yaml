    *barangay*（村落）重新路由到新城镇，还通过对行动的特定限制重新扎根，“以使当地土民在没有需要时不要四处游荡”（Morga 1970: 163）。教堂周围是*principalia*（当地精英）的房屋，他们的孩子由祭司教育（Ileto
    1998a: 81）。根据 Ileto 的说法，“是祭司[决定]了、或至少迎合了城镇的社会秩序”（Ileto 1998a: 82），并主持了其关键仪式，包括洗礼、婚礼、葬礼和宴会（Ileto
    1998a: 80）。这些场合不仅是个人传记中的仪式时刻，亦是城镇或城市的节日庆典日历上的日子：它们同时也是一种监视。


    在西班牙殖民时期，菲律宾城镇和城市的城市结构与基督教之间的联系是显而易见的。《印第斯法典》（Laws of the Indies）规定了建造教堂-广场综合体，作为执行城镇或城市最重要的宗教和世俗职能的场所。第118号法令规定：“在城镇的各处，应布局比例良好的较小广场，在其中建立与主教堂、教区教堂和修道院相关的寺庙，使得所有事物按良好比例分布，以便宗教教学”（Mundo
    and Crouch 1977: 255）。因此，祭司和教会不仅是宗教权力的象征，更是等级和关系的组织语法，其模型是一种类似于前哈沁姆式的全景监狱：一个在空间上编排的墙墙和道路网络，而随后的页码中详细描述的每个组装都是对它的翻译或变体。那么，菲律宾的基督教化与其说是一个皈依的问题——即离散信仰的传递以及将一种宗教传统从世界的一个部分传输到另一个部分的实例化，使其在另一处具有连续性——不如说是宗教实践（洗礼、告解等）与城镇和城市规划的衔接。


    但这种基督教化模式产生的并不是皈依所暗示的自身的复制，而是另一套完全全新的物体和事物的组装。这种组装将菲律宾人的身体组合并构成了新的亲近与距离，在身体与身体、彼此之间，以及身体与殖民政权以及群岛的河流、森林和山脉之间建立了新的关系。这些组合和构成了对这些岛屿全面的去领土化和再领土化，生成了新的内部和外部以及新的极化，特别是城镇中心与荒野边缘之间，新的接触与分离的频率，以及用于绘制身体和信息的新类型坐标（Deleuze
    and Guattari 2014: 503）。正如 Arnisson Andre Ortega Ortega 所述（2016），重新安置计划由教会当局发起，旨在驱逐原住民并强迫他们定居在……城镇中心。这种强迫迁徙使原住民处于西班牙天主教的“钟声之下”，并将他们归类为文明的低地基督教印第人。在政治上，这意味着将
    *barangay* 社会结构纳入了殖民行政等级体系之中。那些拒绝服从的人逃到了山里，被归类为“未文明的”和“异教的”*remontados*（回归者）。（Ortega
    2016: 130）


    Banahaw 组装在城镇之外建立了一个替代性的宗教权力中心，由新的流动、新的内外和点进行标记，并标志着从城镇和城市的固态宗教向边缘即兴、流体宗教形式的转变。


    # 菲律宾 1841 Banahaw 组装


    殖民时期菲律宾获得授权的宗教空间是教堂-广场组装的封闭网格。然而，出于各种原因——也许是为了逃避税收、宪兵或修士——在群岛新城镇和城市的边缘出现了各种类型的“第三空间”（Lahiri
    2005: 36）：


    西班牙殖民统治在一个行政结构内划定了城市、城镇（*pueblos*）和省级边界，这种结构在纸面上看起来很好。但实际上，存在一种类似于曼陀罗的情况，其中教区祭司和当地城镇精英（*principalia*）的威望和权力决定了城镇中心对边缘的控制。直到该世纪相当晚的时期，非城镇元素——被称为隐士、土匪、流浪者、治愈者、异教徒等——有充足的空间几乎在[任何]运作，在自然灾害或年度朝圣期间吸引人们加入他们，或者在
    *pueblos* 之外形成永久性社区。（Ileto 1999: 207；原文中此处为斜体）


    Banahaw 山就是这样一个空间，它产生于一场宗教起义后的血腥余波。Cofradia de San José 由 Apolinario de Cruz 创立，他在马尼拉担任一名护士。由于种族原因被阻止加入祭司阶层，他建立了自己的兄弟会。仅针对菲律宾人，兄弟会于
    1832 年向马尼拉大主教申请教会承认。在被拒绝后，他们向皇家法院（Royal Audiencia）提交了请愿书，但也被拒绝了。1840 年，兄弟会带领其追随者前往
    Sanobal 山，那是两座火山之一。1841 年，随着政府军占领营地，起义被镇压。Apolinario逃到了 Banahaw 山的茂密森林，但很快被捕并与
    200 名追随者一同处决（见 Sweet 1970）。


    # 生成性交互


    **111**


