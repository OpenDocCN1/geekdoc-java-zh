    ### Energy


    ### Introduction


    In *The Savage Mind* (1962; 1966), Claude Lévi-Strauss distinguished between ‘hot’
    and ‘cold’ types of society. At first glance, the distinction appears to map comfortably
    with the binary classifications of primitive and modern social forms. For example,
    Henry Sumner Maine distinguished between status and contract, Emile Durkheim between
    mechanical and organic forms of solidarity, and Ferdinand Tönnies between *Gemeinschaft*
    and *Gesellschaft*. However, while Maine and Tönnies were thinking largely within
    nineteenth-century concepts, Lévi-Strauss was thinking with thermodynamics, entropy.
    For Lévi-Strauss, pre-modern societies were self-sustaining totalities and modern
    societies were simultaneously restless, progressive and destructive.


    Lévi-Strauss’s exploration of the social through energy was part of a small corpus
    of anthropological and sociological writings that included the likes of Leslie
    A. White and Clifford Geertz among others (see Rosa, Maclis and Keating 1988).
    Much of this work was marked by the indelible stamp of evolutionist theory that
    linked ethnographic observations of societal and technological difference to energy
    consumption, imagining, for the beneficiaries of modernity, a trajectory of limitless
    progress and growth.


    ## 22 TOWARDS A NEW THEORY OF RELIGION AND SOCIAL CHANGE


    If Jean-François Lyotard, Jean Baudrillard and the postmodernists would later
    outline a very different account of progress, European and especially German scholarship
    – particularly between World War I and World War II – had already sketched a pessimistic
    account of modernity infested by vitalism, anti-scientific and anti-reductionism,
    for which the eclipse of religious and spiritual truths constituted an intolerable
    prospect (see Eliade 1959; 1969a). This work was intersected by tendrils of holism
    and romanticism and would also become interwoven with the racist and anti-Semitic
    ideas that permeated the emergence of Nazi culture (Harrington 1996; Jones 2010).
    If Martin Heidegger, Tönnies and Max Weber articulated a shared sense of German
    cultural crisis after World War I, (now) lesser known figures such as Houston
    Chamberlain, Christian von Ehrenfels, Oswald Spengler and Leopold Ziegler engaged
    in a German search for renewal in notions of racial and cultural purity as the
    means of staying off the collapse of a mythologized Teutonic culture (significantly
    – given his influence on the study of religions – Mircea Eliade also subscribed
    to these views and his work stands implicated in fascist and Nazi imaginaries
    of cultural degeneration and spiritual loss [Cave 1993: 106–7; 1993: 112; Dubisson
    2006: 173–88; Frank 2006].


