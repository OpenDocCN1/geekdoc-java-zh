    ……精神疾病，而且实际上在疯狂的各种面具背后……存在着某种真实的东西，它那紧封的嘴只需被开启”（Habermas 1990: 240），福柯可以声称他写过“一部不是关于精神病学，而是关于疯狂本身的历史，它充满了活力，被知识所捕捉”，其中疯狂被描述为一种“狂野的状态”和一种“原始的纯洁”（Foucault
    2006: xxxii-xxxiii）。


    魅力与疯狂的动荡涡流——与艺术与表演具有共同性——长期以来被解释为具有将主体从自身中解救出来的潜力，使其更新、恢复或完全转型，这正如威廉·詹姆斯（William
    James）和鲁道夫·奥托（Rudolf Otto）想象的范式宗教体验的轮廓一样，具有令人恐惧和令人敬畏的能力。无疑，宗教体验——这种超越规范的体验——为思考宗教和社会变化提供了某些途径，但人确实仍然受困于主体，并且无法理解变化的复杂性、其非人类维度，以及剧库之间、常规与即兴表演之间的转折点和过渡。


    关于宗教和社会变化的第二组资源分别源于列维·斯特劳斯（Claude Levi-Strauss）和米哈伊尔·巴赫金（Mikhail Bakhtin）的作品，特别是他们的“拼贴”（bricolage）和“对话性”（dialogism）概念。“拼贴”对于生活化宗教理论者来说是一个方便的概念，因为它暗示了符合生活化宗教论题的即兴制造水平。丹尼尔·柯比（Danielle
    Kirby）认为“宗教和精神的拼贴是当代宗教性的共同特征”（2012: 39；*原文为斜体*），这在生活化宗教环境中等同于某种正教（见 McGuire 2008）。然而，它通常被理解为个体的选择，即想象个人从多个来源获取其身份、宗教叙事和宗教-文化实践，这完全不是列维·斯特劳斯的观点（见
    Aupers and Houtman 2013: 174; Kirby 2012: 50–1）。对于列维·斯特劳斯来说，拼贴是一种认知模式，其特征是对比有限的元素进行持续循环利用，以产生（例如）新的神话。列维·斯特劳斯在拼贴者与工程师之间建立的对立具有启发性：工程师从概念出发以实现特定项目的目标；相比之下，拼贴者利用随手可得的一切，从事物的感官属性中产生秩序（Hénaff
    1998: 141–58）。重要的是，拼贴从未被意为从个人的意图或作者身份的概念来理解，而是指代某些文化和社会特有的某种认知操作类型。


    对话性以及相关的杂糅性（hybridity）、互文本性（intertextuality）和异质性（heteroglossia）概念也被证明对关注宗教变化的学者非常有用，特别是对于在受宗教影响的文化创造和生产形式中融合、混合和创造性借用的实例，包括音乐（见
    Appert 2016; Hill 2017）。詹姆斯·柯克斯（James Cox, 2017: 25）借鉴巴赫金作为理论化宗教变化的手段，并在《彩虹灵神学》（Rainbow
    Spirit Theology）中创造了澳大利亚本土与基督教概念及思想的某种融合。柯克斯之所以使用巴赫金，正是是因为它允许他从“意愿和意图”来理论化彩虹灵神学，并将“创造这一新……[神学]的本土参与者定位为活跃的、甚至是颠覆性的代理，而非顺从外部支配力量影响的被动受害者”。政治抵抗在柯克斯叙述中的中心地位意义重大，它将变化根植于有意的人类行动——无论是在拼贴还是对话的框架下——意味着忽略了一系列额外的代理来源和因果线。正是这些其他线和来源，在以下对货运崇拜（Cargo
    Cult）组合的描述中受到了重视。


    # 货运崇拜组合


    十八世纪末，当英国新教传教活动向新领土扩张时，在1779年库克船长在夏威夷杀死后，伦敦传教协会会将洋洲地区（包括美拉尼西亚）作为传教的重点。然而，根据 McCulloch
    的理论（2010），去这些地方的传教士往往缺乏“对基督教学的详细掌握”，尽管他暗示他们为该地区带来了“魅力、对基督教包装中可能吸引当地领袖的事物的敏锐直觉，以及摧毁传统崇拜力量的决心”（2010:
    876）。无疑，这些传教士通过他们的干预以及后期殖民政府带来的新权力来源（例如，识字、火器和药物）扰乱了当地文化。对于当地人来说，基督教可能被视为获取这些新形式权力的手段。然而，美拉尼西亚人口与基督教的互动并不是简单的皈宗或抵抗故事。相反，这些互动的特征是当地解释的出现，而货运崇拜可以理解为部分源于此。


    带到美拉尼西亚的不只有基督教。殖民干预将岛屿及其人民拉入了新兴的全球经济和国际政治。巴布亚亚从1884年起受德国控制，但随着第一次世界大战的动荡，转交给了澳大利亚管辖。德国人拥有巨大的种植园用于出口椰干，椰干用于制造椰子油。随着澳大利亚人的到来，这种情况没有改变，但全球资本主义的反复幻测导致榨取型殖民经济发生了快速转变：到20世纪30年代，橡胶和黄金取代椰干成为主要出口产品。所有这些企业的劳动力都是契约制的：当地男子被签约在一段时间内工作（例如三年），在此期间他们住在营房里，远离村庄。传教、殖民主义和与世界资本主义经济的接触构成了货运崇拜产生的复杂、重叠背景。货运崇拜很大程度上是与欧洲传教士和殖民者接触的产物。它们由当地产生的魅力领袖领导，这些领袖声称通过海运或空运岛屿的大量货物（cargo）将抵达并交付当地人，开启一个祖先将回归的富足新时代：有时“[货物]”一词意味着钱或各种制成品，如车辆、包装食品、冰箱、枪支和工具。有时，在比喻上，货物代表了对新社会道德秩序的寻找，这种秩序将确保当地主权和殖民统治者的撤离。无论何种情况，人们都在工作，并期待生活发生突然而奇迹般的转变。货运崇拜的核心是“末日”或“世界末日”的概念。这一概念源于基督教，其非常独特的时间末世论从伊甸开始，接着是人类的堕落，最后以人类通过善恶之间的最终对抗（被理解为“末日”）获得救赎而结束。然而，对货运崇拜的研究不仅强调了它们的宗教维度，还强调了它们的政治维度：“货运崇拜”是一个名称，适用于任何以基于现有宗教信仰的“货物”渴望为特征的组织化仪式活动。在此语境下，“货物”不仅意味着工业生产材料，而且泛指更高的生活水平，最重要的是与白人殖民者平等的地位……被称为“货运崇拜”的运动也被称为“千年王国运动”……或“宗教教”……“社会运动”……“危机教”……“美拉尼西亚民族主义的前驱”……以及“千年王国抗议运动”。

