    shatter the idea of identity or organization: it suggests a ‘disarticulated, dismantled,
    and deterritorialized [body] ... able [nevertheless] to be reconstituted in new
    ways’ (Best and Kellner 1991: 91). Similarly, Deleuze and Guattari’s conception
    of the rhizome – opposed throughout *A Thousand Plateaus* (2014) to use the tree
    as a metaphor of hierarchy and stasis – offers a compelling means for privileging
    not forms and solids, but flows and liquids:


    Rhizomes do not propagate by way of clearly delineated hierarchies but by underground
    stems in which any part may send additional shoots upward, downward, or laterally.
    There is no hierarchy. There are no clear lines of descent. A rhizome has no beginning
    or end. It is always in the middle ... The key to the rhizome ... is that the
    rhizome continually creates the new. It is not predictable. It does not follow
    a linear pattern of growth and reproduction. Its connections are lateral not hierarchical.
