    # EMERGENCE 147


    race and colonial politics. According to Lattas (2000), instead of regarding the
    radios constructed in the midst of the so-called Vailala madness as examples of
    some kind of primitive mentality, they can rather productively be understood as
    attempts to address local concerns with the dead. Lattas argues that in ''cargo
    cults, the white man''s mechanisms for revealing and tapping into concealed scientific
    forces was assimilated to Melanesian magical practices for revealing and tapping
    into the concealed forces belonging to the secluded world of the dead'' (2000:
    326). Cargo cultists sought to use the capacity of radio to bring distant spaces
    closer together, except these spaces pointed to a cosmic geography or spatiality,
    namely, the spaces of the living and the spaces of the ancestors. According to
    Lattas:


    Dreams, hallucinations, possession, and rituals were the customary practices of
    revelation ... used to redisclose and light up the world in different ways, namely
    from the standpoint of the dead. Borrowing and remaking these customary practices
    ... cult followers sought to end the isolation of the dead living by ... communicating
    with their ancestors via modern technology. (Lattas 2000: 326)


    In short, cultists used methods borrowed from Western technology and applied them
    to the problem of communicating with the dead. But making the radios was not the
    only way in which Cargo Cultists tried to harness white experience:


    > [C]argo cult leaders have often mimed European manners: for example, European
    ways of walking in exaggerated steps with one''s hands behind one''s back; or
    European ways of talking, laughing or whistling; or European ways of writing and
    handling books. All of this is more than an appropriation of style; it uses style
    to appropriate the body image of the other and to capture the corporeal schemes
    and personhood of the other. The black man here


    # 148 TOWARDS A NEW THEORY OF RELIGION AND SOCIAL CHANGE


    seeks to make himself into the double of the white man. He seeks to become white
    through occupying the corporeal regimes of the white man, that is by entering
    that space of movement and identity occupied by the white man’s body ... Colonialism
    sought to make the black man into the double of the white man, but along the way,
    state and church often lost control of this mimetic function and doubling process.
    In cargo cults, the process of borrowing the identity of the white man – the clothes,
    gestures, mannerisms and airs of the master – becomes part of a subversive culture.
    It becomes a magical rite designed to discover the bodily form which empowers
    the white man and to discover those secret rituals which the white man hides from
    the black man. (Lattas 1992b: 36)


    Cargo Cults, then, were not confused mis-translations of Christian ideas about
    the end of days. Rather they were a complex blend of Melanesian conceptions of
    the dead and of communicating with the ancestors with Christian conceptions of
    the end times, entangled within the racial and very political hierarchies of colonialism
    and capitalism and their technologies and practices of extraction:


    The classic Western cargo cult stereotype emphasizes the disparity between indigenous
    magical, religious, cultural symbolic means, on the one hand, and European rational
    economic or political ends, on the other. The hallmarks of cargo cult include
    fits of hysterical shaking and frenied activity involving the mimicking of European
    behaviours in ways that are quite apparently ineffectual in obtaining the goals
    attributed to them. Thus, ‘cargo cult’ stands for an intercultural misunderstanding.
    (Dalton 2004: 189–90)


    As Peter Worsley argued, if Cargo Cults seemed irrational to Western observers
    like Edgar Williams, how did the whites appear to Melanesians, with their money,
    their steamers, their radios and their god?


    # EMERGENCE


    # 149


    [I]t is clear that the labelling of the cults as ''irrational'' begs the question.
    Indeed, a Melanesian might make out a good case for flinging the label of ''madness''
    which has often been applied to these cults back at us, and asking whether his
    people, given the knowledge they possessed, have not made quite logical criticisms
    and interpretations of our own unpredictable and irrational society. (Worsley
    1970: 46)


    Perhaps rationality is less a universal yardstick for judging other cultures than
    a matter of contingent, historical and cultural perspective. Arguably, the Cargo
    Cults assemblage revealed an important similarity between Melanesian and Western
    cultures: desire for cargo or material goods through which to project personal
    status and power. Westerners represented Melanesians as ''confused people who
    use irrational means to pursue rational ends'' (Otto 2004: 210), but surely they
    could have been accused of making the same mistake?


    The Cargo Cult assemblage demonstrates religious and social change unfolding not
    according to any religious or secular teleology but in terms of the unexpected
    outcome of interactions among varied and contingent elements including a concatenation
    of objects and entities including missionaries, ancestors, radios, copra and embodied
    mannerisms all combining to generate something entirely unprecedented and new.


    # 5


    ## Towards a General Theory of Religion and Social Change


    This book began claiming that the secularization thesis and the lived religion
    thesis – the field’s dominant theories of religious and social change – shared
    the same questionable foundation, namely, the rational choice-making, meaning-ending,
    individual human subject. The question I posed was, what would an account of religious
    and social change look like if a non-, anti- or post-humanist point of departure
    was adopted instead? The proposal was to disrupt the sovereignty of the individual,
    human subject by situating it in a finely grained and thoroughly living, moving
    world of assemblages made up of human and non-human interactants.


    Nomad science approaches reality as a state of flows rather than a series of discrete
    solids solids understood as ‘a special instance of flow’ and as ‘a coagulation’
    (Adkins 2015: 197). For nomad science, the real is understood not in terms of
    any determinable world as once imagined by Pierre-Simon Laplace, but in terms
    of unceasing movement unmoored from any substance, essence or being. A nomad science
