    in Hermann 1992: 66–7）


    “瓦伊拉拉疯狂”最早于1919年报道于诺穆（Nomu）和阿里哈瓦（Arihava）村，位于今天的巴布亚新内亚南部海岸。这种“疯狂”是后来被称为“货物崇拜”的首个文献记载案例。有三个特征尤为突出：(i)
    轮船的到来，“载着已故祖先的灵魂来到船上，他们将带来‘货物’”（Williams 1977: 341–2；另见 Worsley 1970: 91）；(ii)
