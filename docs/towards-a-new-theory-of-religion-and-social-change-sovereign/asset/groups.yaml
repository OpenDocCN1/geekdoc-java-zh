    # 前言与致谢


    Kjetil Hafstad, Ida Marie Høg, Nina Hoel, Michael Houseman, Morny Joy, Jens Kreinath,
    Bruno Latour, Zaki Nahaboo, Birte Nordahl, Sarah Pike, Jone Salomonsen 以及 Donna
    Seamone；能与你们共同思考是一次难以置信的荣幸。


    在旅程途中，还有许多人的贡献起到了决定性的作用：Syed Mustafa Ali, David Chapman, Jay Cornelio, John Eade,
    José Francisco, David Garbin, Marie Gillespie, Suman Gupta, Titus Hjelm, Richard
    Irvine, Theodoros Kyriakides, Rebecca Lee, Chris Lewis-Jones, Magnus Ramage, Maria
    Nita, Francis Stewart, Steve Sutcliffe, Liam T. Sutherland, Sophie Watson，特别是我的学生们（过去和现在）Hilde
    Capparella, Owen Coggins, Lucy May Constantini, Alison Robertson, Aled Thomas
    和 Claire Wanless。最后，还要特别感谢 Atsuhide Ito（伊藤敦秀），他满热情地投入到为第三章以及后记《装配制图》（Assemblage
    Drawings）制作精美的图表中。书中转载的照片均为我本人拍摄。对于我的家人以及圈外的朋友们——你们是我永恒的伴侣。这本书是给 Katy 的。


    ## 引言


    长期以来，宗教研究一直受到现代性理性与经验双重透镜的主导。每种透镜都包含相当特定的方法论承诺，而这些承诺反过来又对应特定的定义维度。对于理性视角而言，宗教是信仰、概念、观点和想法，最好的研究方式是基于一种现实主义认识论，这种认识论递归地束缚在自然与超自然的对立关系中。因此，宗教被描绘为对现实世界的扭曲表征，随着世俗-科学实验和辩论过程所达并不断修正的操作性或工具性效力变得无处不在，这些表征注定会枯萎。相比之下，对于经验视角而言，宗教是实践、是具化的情感和影响，其重点在于对时刻、事件和奇异性的诠释与神学，这些概念递归地关联到“神圣”的概念，将其视为一种开启或断裂——由疯狂、附身或打破常规的狂热所引发——它从根本上解构了平凡世界，以揭示出某种“他者”（Other）。


    每种透镜都构成了对宗教本质的不同愿景，并包含了一套研究宗教的方法论程序和规则。此外，这两者都应用于宗教社会学两个最受推崇的范式：世俗化假说和生活宗教（lived
    religion）假说。每个假说都试图模拟宗教和社会的变化过程。前者从现代化社会中制度性宗教衰落的原始单线性模型衍生了大量的批判和变体，包括多线性、振荡和后世俗模型；它被大量数据所击败，并受到民族志研究的影响，其中最好的研究认真对待了“现代性是多重性的，且并非处处相同”这一观点，因此，它对宗教的影响绝非是一律的（Eisenstadt
    2000）。尽管如此，其核心是宗教与世俗的根本性对立，即假设宗教可以通过记录人口中对教义正确信仰的（数量化）表达来衡量，并最终认为这些表达将在现代化社会中枯萎。生活宗教假说也产生了变体：宗教是内含的、通俗的、流动的，其制度化维度被淡化，转而强调自发性和即兴。其焦点是对于宗教生活的民族志描述，这些生活被揭示为并非正统的载体或理论上正确信仰的携带者，而是混乱的、难以捉摸的，并以混合和即兴的过程为特征，利用随手可得的任何宗教和文化碎片。


    这两个假说构成了一互补对：一个强调宗教的衰落；另一个强调宗教的生产或创造。它们是该领域对宗教和社会变化的定义性描述，尽管假设和结论不同，但它们的核心都共享了理性选择的、赋予意义的个体人类主体，并将其作为分析的共同场所。将统一主体视为信仰和意义的场域以及行动的中心的想象，支撑了关于宗教的社会科学叙述：毕竟，世俗化的衡量取决于这一主体对有关问题的采访和问卷的回应。


    '
