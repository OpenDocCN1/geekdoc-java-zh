- md: '

    The term ‘Cargo Cult’ also has a history, having first been used in the November
    1945 edition of the magazine Pacific Islands Monthly (Lindstrom 2004: 19), while
    the first academic definition was developed by the anthropologist Lucy Mair, in
    1948:


    A notable feature of the reaction of the peoples of New Guinea to white rule is
    the occurrence at different times in almost every part of the Australian territories
    of a manifestation used to be known as the ‘Vailala Madness’, but it is now more
    commonly described as the ‘cargo cult’ ... The common characteristic is the insistence
    on the cargo of European goods to be sent by the ancestors, and the disappearance
    of the white man and his rule. Underlying the cargo myth is the idea that all
    trade goods have been manufactured in the spirit world by the ancestors as gifts
    for their descendants, and are misappropriated by white men. The prophet of one
    of these movements, was named Batari, scored a strong point on one occasion when
    a crate marked ‘battery’ was unloaded from a ship – but not delivered to him.
    In every case, the leaders order native economic activities to be suspended. No
    gardens need made, since the ancestors will provide all the food required – but
    only to those who have shown their faith by not growing for themselves. For the
    same reason the pigs are killed and eaten. The people spend their time preparing
    to welcome the ancestors; sometimes this involves special songs and dances. (Mair
    in Hermann 1992: 66–7)


    The ‘Vailala Madness’ was first reported in 1919 in the villages of Nomu and Arihava,
    and in what is today the southern coast of Papua New Guinea. The ‘madness’ was
    the first documented case of what would later later be called a ‘Cargo Cult’.
    Three features stand out in particular: (i) the steamer that would arrive ‘carrying
    the spirits of dead ancestors on board, who would bring with them the “Cargo’”
    (Williams 1977: 341–2; also see Worsley 1970: 91); (ii) the construction of various
    structures including buildings but also flagpoles said to be for communicating
    with the dead, and which were said by observers to imitate, in their style and
    construction, radio transmitters (Williams 1977: 349; see also Worley 1970: 95)
    and (iii) bodily movements and actions performed by cultists (Williams 1977: 333–6;
    see also Worley 1970: 85–6).


    Francis Edgar Williams''s essay “The Vailala Madness and the Destruction of Native
    Ceremonies in the Gulf Division” (1977: 331–50) was originally published in 1923
    and composed from a variety of sources, including official reports, testimony
    from eye witnesses, as well as from observations and interviews conducted by Williams
    himself. It is notable not as a more or less first-hand account of the events
    at Vailala but also for the troops and metaphors through which Williams sought
    to make the events explicable to his white colour, colonial audience.


