    # 生成性交互


    患者所表达的意思并非他们表面上表现出的含义。有一位德国语言学者的著作——这项工作在他在疯人院去世后很长一段时间才被完全忽视。结构主义和后结构主义被认为揭示了在作者、人类和上帝这些信托符号下意义保证的幻象，这具有了那位德国人对形而上学进行猛烈抨击的所有特征。


    然而，结构主义和后结构主义不仅仅是对语言的精妙推演。在斐迪南·德·绪尔、西格蒙德·弗洛伊德和弗里德里希·尼采的作品之外，20世纪60年代和70年代震动了人类学和宗教研究的结构主义方法，很大程度上是对由詹姆斯·G·弗雷泽（1910）等进化论者和布朗尼斯拉夫·马林诺斯基（1984）等功能主义者关于神话发起的辩论的干预。在弗雷泽的进化论框架内，图腾演变为宗教，演变为科学。社会被注定要进步——隐含地是在西方的指导下，或者根据西方现代性经验所确立的参数——分阶段地远离宗教，向科学、工业和拥有财产的民主迈进，这是一场通文明之旅。这种历史转型的线性理论受到了结构主义以及随后的后结构主义的挑战，后者提出了一系列非线性模型，认为变化的发生并非任何进步理论的结果，而是根据元素之间偶然且复杂的相互作用。根据马林诺斯基的功能主义框架，神话以稳态方式运作，维持原始社会的社会秩序，“主要是为了建立一种社会学章程”（Malinowski
    1984: 144）。然而，根据结构主义和后结构主义的逻辑重新构建后，神话和社会被转化为复杂的形态，这些形态不受封闭系统平衡的功能法则支配，而是受开放系统动力学和非线性转化过程的影响。


    值得注意的是，语言转向也启发了一种在很大程度上反对结构主义的解释性和人文主义人类学。


    克利福德·格尔茨对“基于形式验证、可复制性和预测”的人类学分析持异意见（Silverman 1990: 131；另见 Geertz 1973: 29），声称文化研究“不是一种寻找规律的实验科学，而是一种寻找意义的解释科学”（Geertz
    1973: 5）。格尔茨接受了受其对马克斯·韦伯和保罗·里科尔阅读启发的现象学解释主义，并借用吉尔伯特·莱尔的“厚描述”概念，认为人类学的任务是研究作为人类意图产物的意义。


    格尔茨的解释性文化人类学从西方哲学的释学传统中汲取智养分。如果说解释文本时，释学从词到句子、从文本到建立文本意义，那么作为民族志者的格尔茨则在“借喻的领域”（Clifford
    1983: 131）中从行动转向文化整体：


    民族志学家实际上面对的是……许多复杂的概念结构，其中许多结构相互叠加或缠结在一起，它们既是奇异的、不规则的又是隐含的，他必须设法先予以把握并呈现……

    进行民族志工作就像是试图阅读（从“构建一种阅读”的角度）一份手稿——它是陌生的、褪色的、充满省略号、不连贯性、可疑的修订和带有倾向性的注释，但它不是用常规的声音图表写成的，而是用塑造行为的瞬态实例写的。（Geertz
    1973: 10）


    根据格尔茨的观点，将文化视为可读的东西改变了“对……解释是什么的感知”，将其转向了“对于翻译者、注释者或圣像学家来说，比对于出题者更熟悉的思维模式”（Geertz
    1983: 31）。但格尔茨并未看重巴赫金不稳定的对话性或德里达的解构。相反，通过借鉴里科尔（同上），格尔茨的文本并未产生多重、通常是模糊或冲突的解读（Silverman
    1990: 128）。格尔茨特权了不稳定的对话性，将文化视为某种可读的东西改变了“对……解释是什么的感知”[注：原文此处似乎存在逻辑错乱，导致翻译部分出现重复或不完整]。


