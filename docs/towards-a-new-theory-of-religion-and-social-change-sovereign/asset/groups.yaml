    of society regarding both its structural problems and some of the solutions to
    those problems. Indeed, after Ferdinand E. Marcos''s declaration of martial law
    in 1972 an increasing number of priests, seminarians and religious began actively
    co-operating with the National Democratic Front (NDF), while others even took
    up arms within the ranks of the New People''s Army (NPA).


    In the 1930s, Filipino communists had branded priests and seminarians ‘clericofascists’
    (Bolasco 1994a: 235), believing that the Church was a feudal remnant to wither
    and die once the revolution had taken place. Indeed, the Catholic Church’s support
    for Franco during the Spanish civil war (1936–39) saw the Church, during this
    period, firmly and actively aligned against communism, understood as a dangerous
    cult of secularism. Likewise, during the 1950s, the dominant position within the
    Church was to resist all tendencies towards the secularization of Philippine society.
    Secularization, it was thought, would fatally weaken the country’s moral fabric
    and precipitate a communist take-over. However, Marcos’s declaration of martial
    law in 1972 led some elements within the Church in the Philippines – elements
    already radicalized by Vatican II – to enter into dialogue with other religious
    groups and with the NDF:


    Priests, nuns, seminarians, pastors and young Christian men and women were already
    distancing themselves from accepted Church patterns of social action. In their
    search for alternatives, this ecumenical grouping finally met face to face the
    Marxists they had been trained to fear for decades. Less defensensively, they
    faced the concrete challenge of Maoism to the Filipino Christian. Through 1971
    they probed. On September 1971, during a seminar in Baguio hasty the organization-movement
    Christians for National Liberation (CNL) was formalised ... In February 1972,
    following a two-day seminar, the CNL formally declared its alignment with the
    National Democratic Front (NDF). In August 1972, they had their first national
    assembly. In 1974, CNL was declared a mass organisation tasked with waging a ‘national
    democratic and cultural revolution particularly in the areas of liturgy, theology
    and religious life’. It was a struggle for the ‘social appropriation of the gospel’.
    (Bolasco 1994a: 247)


    The Church would later play a pivotal role in the uprising that led to ignominious
    exile for Marcos and his family (see also Bolasco 1994b; Guan 2018: 190). However,
    once ‘People Power’ had been asserted, the Church hierarchy formally distanced
    itself from the NDF and the CNL. Nevertheless, the legacy of Church engagement
    with the poor engender a series of theological experiments in which engagement
    with the rural and the local had occupied centre stage. Heather Lynn Claussen
    (2001), for example, provides a detailed account of the Missionary Benedictine
    Sisters, nuns radicalized by Vatican II and the climate of the Marcos period.
    Claussen highlights their regular trips to Mount Banaw to visit the Suprema and
    the Ciudad Mistica de Dios. Claussen’s ‘unconventional’ sisters are, among other
    things, engaged in a quest for a Filipina feminism rooted through accounts of
    the pre-Hispanic Philippines with its mythologized female religious specialists
    and leaders, as well as through the example of contemporary female religious leaders
    such as Mistica’s one Suprema.


    Jesuit theologians have also been making the trip to Mount Banaw as a means of
    re-thinking their approaches to the improvised and extrainstitutional religiosities
    and spiritualities that exist in spaces such as Mount Banaw.


    The study [of local Filipino religities] arose out of a seminar-workshop at the
    Loyola School of Theology, Ateneo de Manila University, during the first semester
    of 1979. The participants were trying to apply Longaner’s ‘Method in Theology’
    to specific problems of inculturation in the Philippines. The problems were tentatively
    contextualised as a polarisation between two cultures – the more Westernised and
    the less Westernised Filipino cultures, between the urbanised minority and the
    rural majority of the Christian population, between official religion and popular
    religiosity. This cultural polarisation was seen as a significant aspect of the
    country’s four centuries of colonial history. The participants agreed that popular
    piety before Vatican II, although well-documented, lacked the insights into the
    cultural pluralism of Vatican II; these uncrit assumed that the culture of medieval
    Western Europe or the modern technocratic culture of industrialised nations the
    ‘norm’ for all other cultures, and that cultural progress consist in making these
    other cultures conform to the ‘norm’. Historically, as a result of this assumption,
    some expressions of the people’s search for God and the faith are despised and
    pejoratively labelled as ‘popular religiosity’ or ‘folk Christianity’. Pope Paul
    VI has exhorted Catholics, in Evangeli Nuntiandi, to rediscover the positive elements
    in popular piety and to purify it of its negative elements. (Marasigan 1985: 1)


    Vicente Marasigan sets out an opposition that he claims was characteristic of
    documents on so-called ‘popular piety’ prepared before Vatican II. These documents
    distinguished between urban and rural populations and between an urban minority
    in the Philippines past as the bearer of ‘official religion’ and a rural majority
    which had remained, somehow, ‘inculturated’. In other words, a position was advanced
    in those documents whereby the rural Philippines continued to be a missionary
    space, a space that, for a host of complex reasons, had remained beyond the pastoral
    project of the Church. In this analysis, ‘folk Christianity’ was, as it were,
    a poor copy or imitation of an official religion. Marasigan’s critique of these
    arguments stresses the need for ‘participant observation’ and ‘immersion experiences’
    (1985: 2) of the kind he himself experienced, living and conducting research in
    Mount Banaw, and his claim that the people who reside there live very close to
    nature and commune with nature in an intimate way (1985: 3).


    Filipino students and academics now travel regularly to the mountain as part of
    various study programmes. Vitaliano Gorospe’s coffee-table style book Banaw: Conversations
    with a Pilgrim to the Power Mountain (1992) includes maps and photographs of the
    pilgrimage routes around the lower slopes of the mountain, while his discussion
    of the religious lives of those who live on Banaw is framed explicitly in terms
    of an opposition of rural life versus city. It is assumed that those who live
    close to nature have unmediated access to the divine and authentic spiritual experience
    in a way that is simply not open to city dwellers:


    Nature reminds us that we need to have moments of stillness and harmony with our
    whole self so that we can come closer to nature and its Creator and thus discover
    our own true selves. Something that going to Banaw is an escape from reality found
    in the city. On the contrary, it is the city that is artificial and Banaw that
    is natural. We were not meant to live like a thousand chickens cooped in cement
    cages and choked by smog and deafened by urban noise. When we first encounter
    Banaw we will find the stillness it demands very strange; we are not ready to
    surrender to nature and its Creator. (Gorospe 1992: 73)


    Importantly, Gorospe is not grappling, as was Marasigan before him, with the legacy
    of pre-Vatican II theology. Today Banaw is a site less for theological error than
    for a deeper truth in which ‘prayer before a rock, prayer while bathing in the
    stream, prayer inside the cave, and prayer among the trees and the stars’ pose
    the possibility of ‘a higher and deeper journey – a journey to our spirituality’
    (Gorospe 1992: 70).


