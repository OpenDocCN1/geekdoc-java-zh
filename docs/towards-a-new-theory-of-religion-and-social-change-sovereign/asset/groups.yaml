    # 生物学 77


    关于宗教，推理的主体本身已变得越来越虚无，要么作为一种难以捉摸的发展地平面上的幻影而消失，要么作为一种漂浮在系列硬编码认知系统中的虚无之物。


    德勒兹和加塔利提供的生物学使得我们并非为了逃避这些问题，而是从根本上改变所提出的问题。有趣的是，正是德勒兹和加塔利对达尔文（2014: 55）的反思了出发点。达尔文关注的是作为特征聚合体的种，而不是作为固定类型的物种：


    达尔文用种取代了类型。这意味着达尔文并不将物种视为一种固定类型，他将物种视为特征的临时性和统计性聚合。其次，达尔文用物种之间的（差异的）程度取代了差异关系。这个问题涉及到从一个物种向另一个物种的发展。如果一个物种是一个种，那么它的特征将围绕一个或或不稳定的点聚集。然而，在边缘，种群的成员将偏离平均值，并在特征之间拥有不同的关系。这里的经典例子是地斑蛾。在英国工业革命之前，种群中的主导颜色是带有深色斑点的白色……这种颜色对当时的浅色树干提供了极好的伪装。在蛾种群的边缘，有几只颜色较深。随着工业革命污染的增加，树干变暗了。结果，深色的蛾伪装效果更好。这种颜色的转变在种群中占据主导地位。最近，英国污染的减少反转了这一过程，现在浅色蛾占据主导地位。德勒兹和加塔利认为，这一过程最好不是通过“程度”来解释的（即我们假设了一系列日益变深的蛾），而是被解释为种群内部的差异关系，在这种关系中，特征的统计聚合重新组织成一个新的统计聚合。（Adkins
    2015: 53）


    与其假设宗教是一个具有具有特定特征并集中在固定点周围的类型或物种，不如想象特征的去聚合和重新聚合，以产生与社会生态变迁相协调的新兴形成和组装。德勒兹和加塔利（2014）对“无器官身体”和“根茎”的概念开启了一种反生物学的想象，恰恰是为了将宗教重新思考为流动、凝固和解体。


    ## 基督教主义、根茎与无器官身体


    德勒兹和加塔利从法国戏剧作家安东尼南·阿尔托那里借用了“无器官身体”的思想（Adkins 2015: 40）。对于阿尔托来说，无器官身体是一种超越身体作为一种能够改变的固体或组织实体的思考手段。因此，无器官身体的理念恰恰是为了打破身份或组织的观念：它暗示了一个“去关节的、拆解的、去领土化的[身体]……尽管如此能够以新的方式重新整合”（Best
    and Kellner 1991: 91）。同样，德勒兹和加塔利对根茎的概念——在整个《千千高原》（2014）中一直反对将树作为等级制度和停滞的隐喻——提供了一种极具服力的手段，优先考虑的不是形式和固体，而是流动和液体：


    根茎不是通过清晰界定的层级进行传播，而是通过地下茎传播，在这些茎中，任何部分都可以向上、向下或侧面发出额外的侧芽。没有等级制度。没有清晰的谱缘线。根茎没有开始也没有结束。它始终处于中间……根茎的关键……在于根茎不断创造新事物。它是不可预测的。它不遵循增长和繁殖的线性模式。它的连接是侧面的，而非层级的。（Adkins
    2015: 23）


    根茎反抗德勒兹和加塔利所谓的“树状系统”（2014: 16；另见 Best and Kellner 1991: 98–9 以及 Marks 1998: 45）；根茎是不是按垂直、层级或谱缘方式组织的流，也不是根据任何中央协调的实体来组织的流，而是“无中心化的”（2014:
    22），向各个方向扩散。


    根据 Adkins 的观点，无器官身体和根茎的作用是允许特定的提问。例如，“构成这一实体的连接是什么？”以及“这组特定的连接使得哪些进一步的连接变得可能或不可能？”（Adkins
    2015: 9）。如果一个像基督教这样的“世界宗教”以无器官身体和根茎的角度被重新投入，它会像什么样？基督教将是一个固定的事物，还是一个由经验、实践和信仰的临时稳定所点缀的流动？


    Andrew Walls (2010) 和 Diarmaid McCulloch (2010） 都强调了基督教传统的多元性，其多重地理位置、历史、连接和翻译。根据
    Walls 的观点：


    基督教已经存在了千年。在这一期间，它的地理和文化重心移动了几次。它适应了不同的社会，并塑造了它们，也被它们所塑造。在某些方面，它是大信仰中融合性最强的……结果是在不同语言和文化中，以及通常是其内部亚文化中的连续翻译。这反过来涉及了一个反复的跨文化传播以及之后的文化解释过程。（Walls
    2010: 61）


    Maculloch 重复了这两个手势，第一个是针对基督教的“不稳定性”（2010: 2）及其“变异能力”（2010: 9），第二个——有趣的是以几乎是生命论的术语构建的——主张“传统的本质不是人类制造的建筑结构，具有恒定的轮廓和形式，而是一种跳动着生命、不断改变形状但保持相同身份的植物”（Maculloch
    2010: 7–8）。但是，Walls 和 McCulloch 都想坚持“基督教”这一概念。它的历史可能是漫长且复杂的，它的边缘可能是模糊的，但它必须有一个核心——一个本质。


    根据 Francisco (2018) 的观点，相反，基督教在特定历史中介中与其他和社会宗教传统的混合……表明其边界在事实上是多孔的，如果不是可移动的话”（2018:
    263），而且，如果“焦点”是作为持久传统的基督教，那么它的边界看起来会更加清晰。通过多元主义的视角，它的边界可以轻易被跨越。当基督教被视为“生活宗教”或从后传统的视角来看时，它的边界被认为是多孔的（2018:
    264）。通过，菲律宾神学家 Jose Mario C. Francisco 利用杂糅性概念作为构想福音化的方式，这种方式将其从“一种单向的、演绎的过程（从信仰到文化）”转化为“动态且多向的相遇”（Francisco
    2018: 260），其结果无法预先。


