    列维-斯特劳斯的横向和纵向阅读法既借鉴了索绪尔的语言模型（包含其结合结维度和范类维度），也借鉴了弗拉基米尔·普罗普的形式主义以及他早年对童话的研究（见 Hawkes
    1983: 67）。然而，它指向了列维-斯特劳斯对音乐的痴迷（Tremlett 2008a: 58–61）以及一种更广泛但重要的折衷主义：正如稍后看到的，结构主义不能被还原为它的语言学遗产或索绪尔式的继承。


    一旦提取出来，“事件束”或“神话素”（mythmes）就会被重新组合为二元对立，然后与同一神话的其他版本或同一文化地区的其他神话进行比较，因为


    研究神话就是研究神话的不同版本之间、以及神话与其他神话之间的“转化”关系……通过这种方法，单一版本或多个版本的综合都不如合适的研究对象。相反，神话应该被视为其所有版本的集合。（Sperber
    1996: 27）


    在《生鱼与熟食》（1992）中，列维-斯特劳斯指出，他将对待“每个神话的序列，以及神话自身的相互相互关系，就像对待音乐作品的乐器部分一样”，将它们作为“一部交响曲”来研究（1992:
    26）。书中以一段“序曲”开始，通过一系列变奏、交响曲、独奏、赋格曲和合唱继续。列维-斯特劳斯认为，古典音乐随着西方社会神话的衰落而出现，并以一种近乎尼采式的华丽——如果我们还记得对于早期的尼采来说，瓦格纳的作品在现代性的解体性、离心力力量中脱颖而出——他补充道，神话和音乐“都是消除时间的工具”（1992:
    16）。


    在《生鱼与熟食》中，列维-斯特劳斯认为，若干源自广阔地理和文化区域、关于火的起源、野猪起源和烟草起源的看似不同的美洲印神话实际上是相互关联的，而且确实是彼此的变体或万花筒式的转化。这些引证和声明的结果是一种研究神话的方法，它完全打破了以往关于早期社会神话功能及其意义的假设。如果卡尔·荣格和约瑟夫·坎贝尔声称神话研究揭示了普遍的心理原型，这些原型指向了关于人类存在和福祉可能性的深远本体论意义，那么列维-斯特劳斯则用数学公式重新塑造了神话研究（Lévi-Strauss
    1993b: 228），在公式中，神话的意义不在于任何孤立形象或元素，而在于它们的组合与转化。在接受哲学家迪迪尔·埃里庞采访时，列维-斯特劳斯说：“我关于神话写过的一切，都是想说明人们永远无法抵达最终的意义”（Lévi-Strauss
    and Eribon 1991: 142）。根据列维-斯特劳斯的观点，神话是无作者的且无中产生，归根结底反映的不是社会结构或任何精神真理，而是产生它们的（康德式）心灵。正因如此，列维-斯特劳斯建议，他的目标不是显示“人们如何在神话中思考，而是神话如何在人们意识不到的情况下在脑脑中运作，他的出发点不是任何人类思维的主体”，而是像这一过程是在神话中发生的一样进行（1992:
    12）。


    重要的是，列维-斯特劳斯处理神话的方法不仅借鉴了语言学和音乐，还借鉴了控制论和信息论。神话是一个信息，而不同的版本构成了信息的不同传输。然而，在每次传输中，信息的不同元素会被放大、扭曲或改变。根据列维-斯特劳斯，神话的排列组合提供了对心灵运作及其试图解决一系列哲学和社会学问题的窥视。神话是社会发送的信息以解决其面临的问题——正如列维-斯特劳斯所言，目的是提供一个逻辑模型——但正因为这些问题无法解决，神话的新版本不断产生，“直到产生它的冲动耗尽”（Lévi-Strauss
    1993b: 229）。这意味着没有作者，没有原始作品和副本，只有没有起源的信息，产生变体和转化，直到它们耗尽。


