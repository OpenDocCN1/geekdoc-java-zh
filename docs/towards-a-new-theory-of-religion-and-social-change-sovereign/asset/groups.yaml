    # 2


    # 生物学


    # 引言


    在19世纪，科学首次开始出现时，人们认为需要不同的方法来研究：一方面是自然世界的物质，如两栖动物、鸟类、化石和树木；另一方面是人类生活和文化的（所谓的）最高元素，如艺术、文学和宗教。威廉·迪尔泰意（Wilhelm
    Dilthey）反对*Naturwissenschaften*（自然科学）与*Geisteswissenschaften*（人文科学）——即自然科学与艺术人文的区别、解释（*Erklärung*）与理解（*Verstehen*）的区别——他声称自然科学专注于解释现象之间的因果律，而艺术人文则关注人类的特殊意义和内在（精神）体验，这些体验存在所有伟大艺术、文学和启示的背后（见
    Grondin 1994; Palmer 1969; Harrington 1996: 27）。迪尔泰与活力论者和现象学家一样，想要“在机械主义的威胁下恢复想象力和创造力”（Jones
    2010: 7），以保护未经中介的生存经验免受*Erklärung*（解释）以及那种不可逆转的还原论科学方法所带来的窒息影响。


    这些浪漫且极具人文主义色彩的假设在宗教研究中占据主导地位——可能仍然如此——尽管人们对这些假设的意识形态、政治和神学维度进行了严密的批判性质疑，且这种古典的人文主义科学划分在产生特定形式的宗教权力知识方面产生了影响（例如，Asad
    1993; McCutcheon 1997; Fitzgerald 2000, 2003; Nongbri 2013）。考虑到这些辩论，本章阐述了迪尔泰人文主义的替代方案，以及一种通过我所说的“生物想象”来使这些方法论关怀变得可见的方法。在宗教研究中，这种想象的特征是多次对生物学的征用，用于定义宗教以及构想社会和宗教变革。本章设定了这种想象的两种配置作为主权科学的范例，并为一种尚未实现的、具有颠覆性的游牧式宗教研究科学勾勒出初步的生物想象，在这种科学中，宗教将是流动的而非静止的。


    生物想象的第一种配置跨越了19世纪末到20世纪初，涵盖了一小群有影响力的英国和法国人类学家及社会学家，他们兴趣于通过生物学视角思考宗教、文化和社会议题。埃米尔·涂尔干（Emile
    Durkheim）、詹姆斯·G·弗雷泽（James G. Frazer）、赫伯特·斯宾塞（Herbert Spencer）和爱德华·伯内特·泰勒（Edward
    Burnett Tylor）产出了一系列关于宗教的作品，在这些作品中，通过演化概念诉诸生物学已成为界定其领域轮廓的标准手段。具有意义的是，他们对生物学的诉求以及将其视为固定法则领域的假设，以及他们预期生物有机体的演化发展不仅与宗教、社会和文化的发展具有类比或同构性。对于这些学者来说，宗教是一个独特的对象，他们将其刻画为演化过程中的必要元素，尽管注定会日益过时并最终灭绝。


    生物想象的第二种配置涵盖了20世纪末到21世纪初，源于认知和演化宗教理论在解释其意想不到的持续性方面的日益流行。斯科特·阿特兰（Scott Atran）、贾斯汀·巴雷特（Justin
    Barrett）、杰西·贝林（Jesse Bering）、帕斯卡·博耶（Pascal Boyer）、斯图特·古斯里（Stuart Guthrie）、乔纳森·宗（Jonathan
    Jong）、伊尔卡·皮塞宁（Ilkka Pyysiäinen）、丹·斯珀伯（Dan Sperber）和哈维·怀特海（Harvey Whitehead）等人，在处理宗教问题时，假设其涉及人类大脑中演化认知架构的功能。对于这些学者——以及新无神论者理查德·道金（Richard
    Dawkins）、丹尼尔·丹尼特（Daniel Dennett）、萨姆·哈里斯（Sam Harris）和克里斯托夫·希特琴斯（Christopher Hitchens），他们对宗教的民粹攻击很大程度上利用了认知理论和演化心理学——演化理论使得新概念和迷人的比喻得以发展，以解释宗教如何在仍被假设为敌意的现代生态中生存。例如，道金斯部署了新词“模基因”（memes）作为思考宗教信仰及其在人口中传播和分布的手段；而丹·斯珀伯对“表征流行病学”（*epidemiology
    of representations*，Sperber 1996: 1；原文斜体）的概念显著将文化和学习的人类学理论转向了疾病模型。认知和新无神论者对该主题的界定同样重要：一方面，他们的人文主义情感必须维护启蒙运动的理性理想及其在追求关于世界的理性知识中的知识英雄形象，他们认为宗教信仰混淆了这一理想。然而，与此同时，认知理论的“标准模型”“将宗教设定为其他演化适应的副产物”（Jong
    2017: 54），并将“宗教思想”视为“一种剧烈的偏离，而是普通认知功能的预见性副物”（Boyer 2003: 119）。但是，如果宗教思想是其他心理功能的“产物”，这是否意味着思维主体并不知道无法控制自己的头脑呢？


