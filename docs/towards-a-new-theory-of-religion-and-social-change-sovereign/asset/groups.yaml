    upon energy flow at a scale vastly greater than that characterizing groups of
    self-sufficient foragers or agriculturists. The result is that as a society evolves
    toward greater complexity, the support costs levied on each individual will also
    rise, so that the population as a whole must allocate increasing portions of its
