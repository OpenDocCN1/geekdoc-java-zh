  - 4.14 根据美国、加拿大及较小国家使用的北美计划（NANP），电话格式为 XYY-XYY-YYYY，其中 X 是 2-9 任意数字，Y 是 0-9 任意数字。编写一个程序，从用户读取一个
    `String` 并验证它为合法的 NANP 电话号码。整个 `String` 的长度必须为12。`String` 中的第四和第八字符（索引为 3 和 7）必须是连字符
    (-)，且所有剩余数字在正确的范围内。使用 `String` 类的 `charAt()` 方法获取索引处的字符值。注意：有多种方法组织你需要使用的 `if`
    语句，但数量可能会很大（23 个或更多！）。
