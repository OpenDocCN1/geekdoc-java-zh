    Start by creating a copy of the project from exercise 2\. You can call the copy
    for *People1*. You must add a few changes. The user interface must be almost the
    same. The only difference is that a new button must be added (see below). Once
    you have entered one or more persons and they have been inserted into the *ListView*
    container, you must be able to click on a person, and the name of the person must
    then be inserted into the two top input fields so the names can be edited. When
    you click OK, no new person should be added, but the list should be updated with
    the changed name. If you have clicked on a name and it is inserted in the input
    fields, you must also be able to delete the name by clicking the new button.


