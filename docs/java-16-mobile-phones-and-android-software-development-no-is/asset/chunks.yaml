    # 9 A final example


    As the final example of this book, I will write the same program, which was the
    final example of the book Java 8, and thus a calendar program where you can navigate
    the calendar and enter notes and appointments. The program should basically have
    the same features as in Java 8, and it is a goal to reuse as much of the design
    and code as possible. One can thus think of the task as a project, where you have
    to migrate a PC application to a mobile phone.


    The purpose of the example is to show a slightly larger program and partly to
    apply many of the elements for developing mobile phone apps mentioned in this
    book. Regarding the requirements of the program, please refer to the Java 8 book,
    and the following will only focus on how I developed the program, what I have
    reused from the previous version, and what has been implemented differently, including
    primarily in relation to Android and mobile phones. The program is developed through
    a series of small iterations or sprints, and the following is a brief presentation
    of these sprints and including the most important decisions.


    ## 9.1 Project start and MainActivity


    ![](image/Image2249.jpg)


    The overall design of the window is shown here, where the icons (buttons) in the
    toolbar are used for:


    *   to navigate the calendar a year back


    *   to navigate the calendar a month back


    *   to navigate the calendar a month onwards


    *   to navigate the calendar a year onwards


    *   to navigate the calendar for a particular month a certain year


    *   set a stopwatch


    *   set a count down


    *   set an alarm'
