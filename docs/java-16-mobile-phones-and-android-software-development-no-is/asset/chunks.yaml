    我将下一个 `TextView` 小部件命名为 `lblDist`，然后通过 `android:layout_below` 定义了该组件应该位于 `lblHead1`
    下方。这就是相对布局（relative layout）发挥作用的地方。接着，通过 `android:layout_alignBaseline`，我定义了显示的文本与后续组件（即输入字段）位于同一条基线（baseline）上，目标是让这两个组件在垂直方向上相互对齐。这里你应该特别注意，在
    XML 中允许引用一个尚未定义的组件 `txtDist`。它是下一个被定义的组件，除了名称被更改为 `txtDist` 之外，请注意 `android:layout_width`
    已更改为 `fill_parent`，这意味着组件的宽度应该填充父组件（此处为 `RelativeLayout`）所留出的剩余空间，即它需要使用窗口的剩余宽度。此外，定义了三个属性：通过
    `android:layout_toEndOf`，该组件应该位于 `TextField` 组件的右侧；通过 `android:layout_below` 让它位于标题文本下方；最后通过
    `android:layout_marginLeft` 在输入字段与前面的文本之间留出空间。


    下一个组件是 `RadioGroup`。这里没什么好解释的，但我给它起了一个名字，并定义了它位于输入字段下方，且与输入字段之间有 10 的间距（margin）。对于两个
    `RadioButton` 组件，也没有什么需要注意的，除非我再次更改了名称并指示第一个必须被选中。同样请注意 `android:layout_weight`
    属性。它实际上并不是必须的，而是由 Android Studio 插入的，意味着要使用整个高度，但在其他语文中它是重要的。


    接下来是两个（顶部的）按钮，与之前解释过的相比，没有新内容，但你应该注意这两个按钮都定义了事件处理程序。


    XML 代码的其余部分原则上只是上述内容的重复，最终结果是各个组件布局得非常美观且彼此协调。这个过程听起来可能有点复杂，确实如此，但只要稍微练习，这实际上是一种非常安全且相对有效的设计复杂窗口的方法。实际窗口对于手机来说已经很复杂，不应该比这更复杂了。


    你应该注意，这次我没有将文本定义为资源，而是直接写在 XML 代码中。这没有特殊理由，仅仅为了编写代码更简单。后面是 Java 代码，这里 `Converter`
    类扩展了两个新的静态转换方法。`MainActivity` 类现在为四个按钮中的每个按钮提供了四个事件处理程序。它们都很简单，我不想在这里显示代码。然后应用程序就完成了，可以在模拟器中进行翻译和测试，甚至可以像引言章节那样安装在手机上。


    ## 3.2 LinearLayout


    在本书的示例中，我使用了 `LinearLayout`，这是一种以行或列形式组合组件的布局管理器。它可以立即与 JavaFX 中的 `VBox` 和 `HBox`
    进行比较，并且像 JavaFX（以及 Swing）一样，布局管理器可以嵌套，你可以使用 `LinearLayout` 解决许多布局挑战。下面显示的示例称为
    `ButtonApp`，它使用两个嵌套的 `LinearLayout` 实例在屏幕上放置了 6 个按钮：


    ![](img/Image1918.jpg)


    该应用程序除了显示 6 个按钮外什么都不做，而且它们没有功能，因此唯一需要显示的代码是 `main_activity.xml`：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_48.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_49.jpg)


    布局从一个 `LinearLayout` 开始，它有一个属性 `android:orientation`，告诉我们组件应该垂直定位。第一个元素是一个新的 `LinearLayout`，因此是一个嵌套布局，它的方向反而是
    `horizontal`（水平）。这里你应该注意它将 `android:layout_height` 设置为 `wrap_content`，这样它就不会占据整个窗口。


    内部的 `LinearLayout` 包含三个文本分别为 A、B 和 C 的按钮，结果是它们水平排列。对于每个按钮，都定义了一个间距（margin），指示按钮外部应该留出多少空间。还定义了内边距（padding），它指定了文本到组件边缘的距离（如果它是带框的组件）。对于所有三个按钮，`android:layout_weight`
    均为 1，这意味着它们必须平分空间并获得相同的宽度。


    外层的 `LinearLayout` 除了上述 `LinearLayout` 元素外，还有三个按钮，这些按钮垂直排列在带有 A、B、C 按钮的布局下方。下方的三个按钮
    D、E 和 F 的权重分别为 2、1 和 3。这意味着它们按照 2/6、1/6 和 3/6 的比例平分垂直空间。关于组件的宽度，请注意 D 的宽度由内容决定，而
    E 给出的是绝对宽度。对于 F，它是父容器的宽度，因此是窗口的宽度。你还应该注意 `android:layout_gravity` 属性，它表示对齐方式。


    以前，`LinearLayout` 是一个非常常用的布局管理器，在需要非常简单的布局的情况下仍然是有意义的。


    ## 3.3 TableLayout


    我在上一节连接 zip 应用程序时使用了这种布局管理器，我不想展示其他示例，但实际上还有很多要解释。最好的方法是将其视为 HTML 表格，它支持跨列合并（colspan）和将组件放置在特定列中的概念，但基本上它是一个易用的布局管理器。


    ## 3.4 GridLayout


    还有一种名为 `GridLayout` 的布局管理器，原则上它对应 JavaFX 中的 `GridPane`。基本上，它是一个将屏幕划分为若干单元格的布局管理器，你可以将组件加载到管理器中，如果没有其他设置，它会将所有组件放在一个大行中，但你可以指定列数以确定应该有多少列。你也可以定义行数，并为单个单元格定义跨度（span）。`IntCalc`
    程序是一个如下布局的简单计算器：


    ![](img/Image1925.jpg)


    计算器仅对整数操作，例如执行整数除法。输入字段是只读的，你只能通过按钮输入数字。表达式必须以后置形式输入，即在参数之后输入运算符。例如，如果你想计算


    ```

    23 + 19

    ```


    你必须输入 23 并点击回车，这意味着 23 将被保存在栈中。然后输入 19，再点击加号按钮，程序计算显示内容与从栈弹出的数字之和，之后显示更新为结果。底行的命令可能并不直观，但
    `!` 决定内容的阶乘，`^` 是幂运算而 `_` 是改变内容的正负。最后，`C` 是删除显示内容的命令，但它同时也会删除栈的内容，尽管这应该是两个命令。


    程序设计得很简单，仅由 `activity_main.xml` 和 `MainActivity.java` 组成。XML 部分占据大量空间，我在下面只展示了较小的一部分，因为其余部分引用了更多按钮，而这些按钮原则上是完全相同的：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_52.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_53.jpg)

