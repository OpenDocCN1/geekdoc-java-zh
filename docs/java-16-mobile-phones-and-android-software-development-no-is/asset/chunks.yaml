    ## 问题 1：LoanApp


    在《Java 3》一书中（以及其他地方）中，我展示过一个实现贷款计算器的应用程序，用户可以在其中计算贷款还款。这次贷款都是等额本息贷款，程序必须打开以下窗口：


    ![](img/Image2068.jpg)


    该窗口只包含标签（labels）、输入框（entry fields）和按钮。在前两个字段中，必须能够输入借贷成本和贷款本金；而在接下来两个字段中，必须能够输入贷款还款的年数和每年的期数。在最后一个字段中，必须能够输入利率，利率是以每年百分比的形式录入。当你点击
    `CALCULATE` 按钮时，程序必须计算每期还款额，并将其显示在文本 `Payment` 之后的字段中，这是一个只读的 `EditText`。


    在计算之前（点击 `CALCULATE` 按钮时），程序必须对数据数据：


    1. 成本不能为负数

    2. 贷款必须为正数

    3. 年数必须是 1 到 60 之间的整数（包含边界在内）

    4. 每年的期数必须是 1 到 12 之间的整数（包含边界在内）

    5. 利率必须为正数且小于 50


    如果发生错误，程序必须以简易 `Toast` 的形式显示错误消息。下方显示了完成计算后的窗口：


    ![](img/Image2076.jpg)


    如果你点击 `AMORTIZATION` 按钮，程序必须打开另一个显示摊还计划的活动：


    ![](img/Image2083.jpg)


    在这里你应该特别注意，窗口的 Action Bar 有一个返回按钮。弄清楚如何添加这个按钮是任务的一部分——这相当简单，你可以尝试在网上搜索。实际表格通过
    `GridView` 显示。弄清楚如何使用 `GridView` 也是任务的一部分，但它与 `TextView` 几乎相同。


    # 5 文件（Files）


    考虑到上述示例，现在展示的主题可以成为开发手机应用的一个良好进展，但手机提供了一系列普通计算机之外的其他服务，我可以提到短信、电话、GPS、摄像头等。这些功能我将在接下来的书中首先介绍，但也可以将数据保存在文件和数据库中，对于许多应用程序是必要的，我将在本章及接下来的章节中重点关注如何实现。本章将介绍文件，包括如何像在普通
    PC 上一样操作文件系统，但我想从另一个地方开始，即你只能读取的文件。如果文件只对当前应用程序感兴趣，可以将文件保存为应用程序内的资源文件。示例可以是文本、图像、音频等。


    ## 5.1 读取资源


    如果你在 Android Studio 中创建项目，在项目文件下有两个目录 `java` 和 `res`，后者包含资源文件。这些是与程序代码一起打包在 `apk`
    文件中的文件。在这里你会发现一个名为 `layout` 的子目录，其中包含 `activity_main.xml`，它定义了应用程序的用户界面，在相同位置还有其他用于其他活动的
    XML 文档。你还遇到了 `values` 子目录下的 `strings.xml` 文件。以这种方式为程序提供数据有几个优点，例如：


    * 易于定义数据，数据对程序始终可用。

    * 它确保了代码与数据的分离。

    * 它允许将资源放在库中，以便多个应用程序使用。

    * 简单的数据可以以 XML 等格式可用。


    它也有缺点，其他方面可以提到：


    * 数据本质上是只读的，尽管在原则上可以修改。

    * 确保数据是最新的可能会有问题。


    为了展示如何操作，我回到关于丹麦国王的示例，它们代表很少变化的数据。问题的数据存储在一个名为 `regents.xml` 的 XML 文中，内容如下：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_100.jpg)


    然后我创建了一个项目，命名为 `DanishRegents`。布局只定义了一个组件：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_1001.jpg)


    剩下的就是在这个 `ListView` 中填充丹麦国王的名字。为了使数据可用，我创建了 `raw` 子目录并将 `regents.xml` 复制到该目录。此时该文档就是应用程序的资源。然后我添加了一个模型类
    `Regent`，它可以代表一个摄，除了名称之外，该类与之前使用的 `King` 类相同。现在只有 `MainActivity` 类：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_101.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_102.jpg)


    首先，注意有很多新的导入语句（import statement），是因为程序应该读取并解析 XML 文档。该类有一个实例变量，是一个用于 `Regent`
    对象的 `List`，即 `ListView` 组件应该显示的对象。否则，该类只有一个 `onCreate()` 方法。它从加载资源开始。在这里你应该注意如何使用
    `getResources()` 方法引用程序资源，以及如何使用 `openRawResource()` 方法加载原始文件，并其结果是一个普通的 `InputStream`。有了这个流，可以使用
    `DocumentBuilder` 读取文档并将其解析为 XML，之后你可以创建当前的 `Regent` 对象并初始化列表。在数据加载并初始化列表后，为 `ListView`
    添加了适配器（adapter）。此外，还添加了一个事件处理器，当你点击 `ListView` 组件中的名称时，程序会显示一个 `Toast`。


