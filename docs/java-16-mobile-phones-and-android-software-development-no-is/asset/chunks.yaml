    作为服务的最后一个示例，我将展示一个启动服务的程序，该服务每 20 秒更新一次数据库。示例还包含了另一个程序（客户端），它可以读取数据库的内容，其目标是展示：


    1. 应用程序和服务如何向数据库写入

    2. 另一个应用程序如何读取同一个数据库


    然而，我将从一个数据库适配器开始，它对于本任务来说并不是必须的，但是一种非常常用的模式。事实上，它只是一个封装了 `SQLiteOpenHelper` 类和数据库操作的类。在这种情况下，数据库必须只有一个包含三列的表：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_1841.jpg)


    其中 `time` 列包含 `YYYY-MM-DD HH:MM:SS` 格式的时钟时间，而最后一列仅为文本。适配器可以写写如下：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_1842.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_185.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_186.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_187.jpg)


    事实上，这个类非常易理解，除了其他内容外，还包含了我之前展示过的 `DbHelper` 类。此外，还有数据库操作，这些操作取决于具体的数据库以及如何使用它。在这种情况下，操作比应用程序使用的要多，只是为了让你对通常需要的操作有个直观的。该类最重要的原因是它使得从多个程序中运行同一个数据库变得简单。


    创建数据库和服务的项目被称为 `LaunchPosts`，因此它是该数据库所属的应用程序。该项目使用了两个类，我在之前的示例中使用过它们：一个是 `King`
    类，它代表一个丹麦国王；另一个是 `Kings` 类，它是 `King` 对象的列表，并有一个返回 `List<King>` 的方法。该服务如下：


    ```

    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_1871.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_188.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_189.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_190.jpg)

    ```


    请注意，这是一个普通服务，由于 `onBind()` 是非常简单的，所以它不是一个客户端可以连接的服务，而是一个启动并运行直到完成的服务，在这种情况下就是运行到执行
    `onDestroy()`。`onStartCommand()` 很简单，但它启动了一个每 20 秒触发一次的定时器，每次触发时，它都会使用最后一个方法创建一个丹麦国王的问候语，并发送到
    `writePost()` 方法。该方法使用数据库适配器用当前的问候语更新数据库。在这里你应该注意，该方法每次都会更新同一行（数据库表只有 1 行），原因是数据库不应该无限制增长。目标仅仅是展示服务可以向数据库写入数据。


    运行 `LaunchPosts` 应用会打开以下窗口：


    ![](img/Image2235.jpg)


    该窗口有 6 个组件。顶部两个是 `TextView` 组件，如果你点击按钮，它们会更新。如果你点击顶部按钮，程序读取数据库，字段将根据读取到的记录进行更新。接下来的测试服务正在运行并更新顶部的
    `TextView` 组件。`Start` 按钮启动服务，而最后一个按钮停止服务。用户界面当然很简单，但 `MainActivity` 类包含了一些代码：


    ```

    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_1911.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_1921.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_1931.jpg)

    ```


    特别注意最后两个方法。这里是第一个通过 `Class` 识别的服务正在运行测试。除了指出这一点外没什么好解释的，但简而言之，你使用 `getSystemService()`
    方法来确定哪些服务正在运行，结果是一个 `ActivityManager` 对象。该对象拥有一个运行的服务集合，你可以遍历这个集合来确定该服务是否正在运行。最后一个方法的工作方式相同，但它更新的是
    `TextView` 组件。这两个方法是从事件处理器调用的，这里你应该特别注意如何指示 `Class` 对象。


    事件处理器 `onStart()` 和 `onStop()` 原则上除了使用上述方法外，没有包含任何新内容，`onCheck()` 也是如此。最后是事件处理器
    `onRead()`，它读取数据库，这是通过适配器完成的。请注意，适配器的 get 方法返回的是一个 `Cursor` 对象，你可以通过返回 `King`
    对象或 `King` 对象列表来创建一个更优雅封装。


    如果你查看 `MainActivity` 类（以及 `PostService` 类），并没有关于数据库应该能够被另一个程序使用的说明。也没有什么需要发生，只是另一个程序应该使用相同的数据库适配器，然后在清单文件中添加内容：


    ```

    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_194.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_195.jpg)

    ```


    然后是第二个程序，名为 `ReadPosts`。首先，该程序的清单必须按照上述方式进行更新，以便它具有相同的 `sharedUserId`。该程序的用户界面与上面几乎相同，只是缺少了底三个按钮。然后添加了
    `DbAdapter` 类的副本，最后是 `MainActivity`：


    ```

    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_1951.jpg)

    ```


    在这里事件处理器 `onRead()` 是相同的，你只需要注意到应该使用 `Context` 来处理数据库，以及如何通过 `context.getResources()`
    确定。


    之后，两个程序都可以安装在手机上，一切都应该正常工作。如果你在物理设备上安装了程序，请务必在测试程序后停止服务，否则它将继续每 20 秒更新一次数据库。


