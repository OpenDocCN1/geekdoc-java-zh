    The application has another problem that you may not discover before installing
    the application on a physical device. The problem is that the activity `PersonActivity`
    has so many fields that they are covered by the virtual keyboard. You can solve
    this problem by placing the window layout in a `ScrollView`.


    # 7 Threads


    Android is a multi-threaded operating system, so you can use threads almost the
    same way you know it from PC. Once an Android application is started, the runtime
    system will create a primary thread, and all the application’s components will
    as defaulted be running in this thread. The primary thread’s main task is to handle
    the user interface, including processing events, but the thread can of course
    perform any other operation, whichever is the default. Like what you know from
    PC, the primary thread can start a secondary thread, and there may be many good
    reasons for which are the same as you know from earlier, but there are also the
    same challenges that if a secondary thread directly updates the user interface,
    so the program will stop with an exception. If you use threads, you need a little
    more, and the purpose of this chapter is to show what is needed.


    I will use an example that I have used earlier, which is an application that opens
    the following window:


    ![](image/Image2170.jpg)


    In the two input fields, you can enter two positive integers, and click on `CALCULATE`,
    the program will determine all prime numbers between the two entered numbers and
    insert them into a `ListView` under the buttons. The idea to use the prime numbers
    is that for large numbers it takes a long time to determine whether a number is
    prime and if you have entered as large numbers as above, the result is that the
    program intermittently adds a prime to the `ListView` component. To limit the
    memory consumption, the two entered numbers must only differ by 1000, but you
    can of course change if you want.


    Under the input fields there are three radio buttons. If you perform the calculation
    and the top radio button is pressed, the calculations are performed in the primary
    thread and the meaning is that you will find that the application is not responding
    and if the numbers are sufficiently large, you will receive a warning as shown
    below where you can interrupt the program:


    ![](image/Image2177.jpg)


    If the program is allowed to perform the calculations, then after all the prime
    numbers are found, it will definitely update the `ListView` component with all
    the numbers found.


    If, on the other hand, you perform the program while the middle radio button is
    pressed, the calculations are performed in second thread, which updates the `ListView`
    component whenever a prime is found. Since nothing special has been done to update
    the component, the result is that the program stops with an exception. On the
    other hand, if you performs the program while the lower radio button is pressed,
    runs everything as it should. The program updates the `ListView` component and
    the program is alive, but this time without causing problems, as it happens with
    a `Handler` object.


    The user interface consists of 10 components that are placed using a `RelativeLayout`,
    and the design does not contain anything new so I do not want to display the XML
    code here, so where there is something new is in the class `MainActivity`. The
    full code is as follows:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_143.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_144.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_145.jpg)


    The class ends with an method `isPrime()` that tests whether a number is a prime
    and is a well-known method that I have used many times. The class defines no less
    than 10 instance variables. The first are references to components in the user
    interface and the names tells what they are use for. Then there is a `List<Long>`
    for the content of the `ListView` component and an associated adapter, and finally
    there are two variables of the type `Handler` that I returns to in a little while.
    In `onCreate()`, there is also nothing new, except for the last two statements
    that create objects for the two `Handler` variables (explained below).


    The program has two event handlers for the buttons, the first one is trivial and
    does nothing but delete the content of the `ListView` component. The other is
    the event handler for the button `CALCULATE`, and even if the code fills, the
    handler is simple enough. It must determine the values of the two numbers entered
    in the user interface and test if they are legal. If this is not the case, a simple
    Toast will appear with an error message. Are the values legal the event handler
    calls one of the methods


    1. `calc1()`

    2. `calc2()`

    3. `calc3()`


    depending on which radio button is pressed. Is it the top radio button the method
    `calc1()` is called with the two numbers as parameters and the method consists
    of a loop that updated the `ListView` component with the primes determined within
    the current range:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_147.jpg)


    Since `calc1()` is a common method, it is executed by the primary thread, which
    in principle is fine enough, but the method can take a long time to perform (for
    large input parameters) and during that time the program does not respond and
    you may receive a warning as shown above.


