    # 3 Layout


    In this chapter I will look a little more on layouts, which have of course already
    been part of the previous examples, but it is about how to place components in
    the window, thus matching what you know from Swing as layout managers. With this
    background (and with knowledge of panes in JavaFX) it is relatively simple to
    address how layouts works, what the previous examples also shows. However, there
    are some syntax, and the following is not a reference, but I will instead show
    through examples what is possible.


    ## 3.1 RelativeLayout


    As example I will show an improved version of the program from chapter 1, which
    is enhanced by conversion between fahrenheit and celsius:


    ![](image/Image1903.jpg)


    In addition to that, the main difference is that another the layout manager that
    has been used, which is called a `RelativeLayout`. The starting point is a new
    project, which I have called `Convert`. After the project has been created, Android
    Studio has created the following design for the user interface (that is `main_activity.xml`):


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_38.jpg)


    The design contains a layout manager, called `ConstraintLayout`, and as I return
    to later, but you may notice that two attributes are defined `android:layout_width`
    and `android:layout_height`, both of which have the value `match_parent`. This
    means that the layout should apply all the space as the parent – and this will
    say the screen – makes available, and it applies to both width and height. In
    this layout, Android Studio has inserted a `TextView` widget that I want to delete.
    I have then added a `RelativeLayout` to the layout window, and from the toolbox,
