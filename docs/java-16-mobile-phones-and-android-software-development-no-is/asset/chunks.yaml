    In section 2.1 I shows an application `Zipcodes`, where you can search for Danish
    zip codes. Start by creating a copy of the project `Zipcodes`. Under the directory
    `res` you must create a subdirectory named `raw`. The book’s source code contains
    a file `zipcodes.txt`, which contains the Danish zip codes as a comma-separated
    file. Copy this file to the new directory `raw`. In the class `Zipcodes`, all
    zip codes are defined in a static array. You must now delete this array and change
    the class so that the `Zipcode` objects are created by instead reading the content
    of your resource `zipcodes.txt`. You can do the following:


    1. Delete the static array

    2. Add a parameter of the type `InputStream` to the class’s constructor

    3. The constructor must then initialize the list of zip codes by reading the content
    of the stream represented by the parameter


    A single change must be added to the class `MainActivity`. In `onCreate()` you
    must create a reference to your resource and send it as a parameter to the constructor
    in the class `Zipcodes`. Then everything should work again.


    ## 5.2 Ordinary files


    You can also use common files, as you know it from PC, and not enough, it goes
    a long way in the same way as described in the book Java 5 about IO. The main
    difference is that files can be stored in two places, either internally where
    they are stored together with the program in internal storage or external where
    they can be stored on an external SD card. I only want to show the first option
    because the ability to save files remotely to a SD card is a security problem
    with Android, and that’s why Google has tightened the requirements for external
    files significantly and they have probably not found the final solution yet. It’s
    actually possible to open up a device so that you can easily create files on a
    SD card, but it is not recommended, so I’m looking only at the internal files,
    but with respect to the code, the difference is not big.


    When files are created internally, they are stored in the phone’s memory which
    in this context is called internal storage. It has its pros and cons where I can
    mention:


    * Internal storage is something that always are there and is part of any Android
    device, but it’s limited in size and significantly less than what, an SD card
    makes available and there’s a not insignificant risk that if applications often
    saves files in internal storage, so that it will be filled up.

    * Basically, files stored in internal storage are associated with an application
    and can only be used immediately by this application. Should the file be used
    by other applications, special efforts are required, and in fact, it is not at
    all the intention to share information between applications using internal files.

    * Files stored in internal storage are perceived as part of the application they
    are associated with, and if you delete the application, you also deletes its internal
    files.


    Internal files are thus primarily suitable for storing smaller amounts of data
    that must be available for a program the next time it starts up, but there is
    also a need for that in many examples, so the conclusion is not to avoid using
    internal files, but just think about what they are used for.


    As mentioned, internal files are associated with an application, and the application
    generally has unlimited access to a file and can thus both read and write the
    file – the application simply owns the file.


    When you open a file, you can specify the following modes:


    * `MODE_PRIVATE`, that is default and only the application that creates the file
    is allowed to access the file

    * `MODE_APPEND`


    In the following, I will look at an example that shows how to use a file.


    ## 5.3 Internal storage


    The program is a simple contact program, where you can enter a name, a phone number,
    an email address and a text for a person:


    ![](image/Image2091.jpg)


    Once you have entered a contact (the name must be entered) you can save the contact
    by saving it to a file in internal storage. If you click the `SHOW` button, you
    will see the window below that shows an overview of the contacts that were entered.
    If you hold your finger on a contact, you will get a context menu with two functions,
    where you can delete a contact (and then delete in the file) and choose to see
    the details for the contact (see the window below). It is therefore an application
    with three activities.


    I do not want to look at the XML code for the three layouts, as here is nothing
    new, so the following mainly concerns the Java code. Here are two things that
    you should notice:


    1. how to write to a file, which is the primary purpose of the example

    2. how to transfer a parameter from one activity to another


    The program uses the following model class where I have not shown get and set
    methods:


    ![](image/Image2098.jpg)![](image/Image2106.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_107.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_108.jpg)


    The class represents a person with the four desired properties. It is the idea
    that contacts should be saved as text lines in a file, and it is therefore necessary
    to separate the fields so you can read in the file again. A seperation mark must
    be used, which is just a character that does not appear in the text fields, and
    here I use a form feed (page shift). The method `getPerson()` thus returns a string
    with the person’s fields separated by form feeds. You should note that if a field
    is empty (what the fields may be if it is not the name), a tab will be saved.

