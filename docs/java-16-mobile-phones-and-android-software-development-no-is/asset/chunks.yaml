    The next `TextView` widget I have called the `lblDist`, and then I have with `android:layout_below`
    defined that the component should be under `lblHead1`. This is where the relative
    layout comes in. Then, with `android:layout_alignBaseline`, I have defined the
    text to be displayed on the same baseline as for the following component, which
    is the input field, and the goal is to get the two widgets aligned vertically
    relative to each other. Here you should especially note that in XML is allowed
    to refer to a widget `txtDist` that is not yet been defined. It is the next widget
    that is defined and in addition to the name being changed to `txtDist`, note that
    `android:layout_width` has been changed to `fill_parent` which means that the
    component width should fill the rest of the space as the parent component (here
    a `RelativeLayout`) has set aside, that is, it needs to use the rest of the window
    width. In addition, three attributes are defined where with `android:layout_toEndOf`,
    the component should be located to the right of the `TextField` component and
    with `android:layout_below` that it should sit under the header text and finally
    with `android:layout_marginLeft` that there is some space between the input field
    and the text in front.


    The next widget is a `RadioGroup`. There is not much to explain here, but I have
    given it a name and defined that it should be below the input field and that there
    must be a margin of 10 to the input field. As for the two `RadioButton` widgets,
    there is also not much to notice except that I have changed the names again and
    indicate that the first one must be checked. Also note the attribute `android:layout_weight`.
    It is actually not necessary but inserted by Android Studio and means that the
    entire height is to be used, but in other contexts it is important.


    Next, follows the two (top) buttons, and compared to what has already been explained,
    there is nothing new, but you should note that for both buttons are defined event
    handlers.


    The rest of the XML code is, in principle, just a repeat of the above, and the
    result of all is that the individual widgets are laid out nicely adjusted to each
    other. The procedure may sound a little bit comprehensive, and it is, but with
    a little practice it is actually a quite safe and also relatively effective way
    to design a complex window. The actual window is actually relative to mobile phones
    complex and should rarely be more complex.


    You should note that this time I have not defined texts as resources, but directly
    in the XML code. There are no reasons, only for making it simple to write the
    code. Back there is the Java code, and here the class `Converter` is expanded
    with two new static conversion methods. The class `MainActivity` now has four
    event handlers for each of the four buttons. They are all simple and I do not
    want to display the code here. Then the application is complete and can be translated
    and tested in the emulator and can even be installed on a phone as described in
    the introductory chapter.


    ## 3.2 LinearLayout


    In the first examples of this book, I have used a `LinearLayout`, which is a layout
    manager that composes components in a row or a column. It can instantly be compared
    to a `VBox` and a `HBox` in JavaFX, and like JavaFX (and Swing) layout managers
    can be nested and you can solve many layout challenges using a `LinearLayout`.
    The example shown below is called `ButtonApp` and puts 6 buttons on the screen
    using two nested `LinearLayout` managers:


    ![](image/Image1918.jpg)


    The application does nothing but show the 6 buttons and they have no function
    so the only code that is to show is `main_activity.xml`:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_48.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_49.jpg)


    The layout starts with a `LinearLayout` and it has an attribute `android:orientation`
    that tells that the components should to be vertically positioned. The first element
    is a new `LinearLayout` and hence a nested layout, and its orientation is instead
    `horizontal`. Here you should note that it sets `android:layout_height` to `wrap_content`
    so it does not take over the entire window.


    The inner `LinearLayout` contains three buttons with the texts A, B and C respectively,
    and the result is that they are laid out horizontally. For each button, a margin
    is defined that indicates how much space there should be outside of the button.
    A `padding` is also defined, and it specifies how the distance should be from
    the text to the edges of the component (if it is a component with a frame). For
    all three buttons, `android:layout_weight` are 1, which indicates that they have
    to share the space equally and thus get the same width.


    The outer `LinearLayout` has, in addition to the `LinearLayout` element above,
    three buttons, which are then vertically laid out below the layout with the buttons
    A, B and C. The three lower buttons D, E and F have the weights 2, 1 and 3\. This
    means that they share the vertical space in the ratios 2/6, 1/6 and 3/6\. With
    respect to the width of the components, note that for D, the width is determined
    of the content, while for E an absolute width is given. For F, it is the width
    of the parent and thus the width of the window. You should also note the attribute
    `android:layout_gravity`, which indicates alignment.


    Previously, `LinearLayout` was a very used layout manager, and it still makes
    sense in situations where a very simple layout is needed.


    ## 3.3 TableLayout


    I used this layout manager in the previous chapter in the connection with the
    zip application, and I do not want to show another examples, but in fact there
    is lot more to explain. The best to do is to think of it as an HTML table, and
    it supports concepts like colspan and placement of widgets in specific columns,
    but basically it’s a layout manager that’s easy to use.


    ## 3.4 GridLayout


    There is also a layout manager called `GridLayout` and, in principle, it corresponds
    to a `GridPane` in JavaFX. Basically, it is a layout manager that divides the
    screen into a number of cells, and you can then load components into the manager,
    and if nothing else, it will put all widgets in a large row, but you can specify
    a number of columns that so how many columns there should be. You can also define
    the number of rows and you can also define a span for the individual cells. The
    `IntCalc` program is a simple calculator with the following layout:


    ![](image/Image1925.jpg)


    The calculator works alone on integers, thus performing, for example, integer
    division. The input field is read-only, and you can only enter numbers by clicking
    the buttons. Expressions must be entered in postfix form, thus entering the operator
    after the arguments. For example, if you want to calculate


    ```

    23 + 19

    ```


    then you must enter 23 and click on Enter, which means that 23 will be saved on
    a stack. Then enter 19, and then click on the plus button and the program calculates
    the sum of the content of the display and the number popped from the stack, after
    which the display is updated with the result. The commands in the bottom row may
    not be quite obvious, but `!` determines the factorial of the content of the display,
    `^` is power raising while `_` changing the sign of the content of the display.
    Finally, `C` is command that deletes the content of the display, but it simultaneously
    deletes the content of the stack, although it should probably be two commands.


    The program is made simple and consists solely of `activity_main.xml` and `MainActivity.java`.
    The XML section fills a lot, and I have only shown a smaller part below, as the
    rest alone refers to more buttons, which, of course, are, in principle, identical:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_52.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_53.jpg)

