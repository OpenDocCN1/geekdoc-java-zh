  trans: '


    日历的其他功能位于程序的主菜单中，以及日历本身的右键菜单中。此手机版本不包含“导出到 XML”功能。起初，只实现了工具栏中的前四个按钮，因此你可以对日历进行一个月的前后切换或一年的年前后切换。


    我从程序的上一个版本复制了 `Date` 和 `MainModel` 两个类。这两个类都放置于一个名为 `models` 的子包中。`Date` 类本身完全没有变化，只是包名发生了变化。原则上讲，这也适用于
    `MainModel` 类，但这里的某些内容目前还没有意义，因此被注释掉了。


    用户界面完全在 XML 中定义。它非常详尽（占据了大量空间），但使用复制/粘贴设计用户界面非常简单，并且在代码中定义了各个组件的引用，结果是得到了一个既简单又稳定的用户界面。因此，到目前为止，`MainActivity`
    类的编写一直很简单。


    在审查代码时，你应该首先注意到如何在 XML 中创建一个 `ImageButton`，这是一个带有图像的按钮。单个图像作为资源被添加到 `res.drawable`
    中。在 Java 代码中，你应该注意如何通过名称而不是 ID 来引用各个控件。你还应该注意代码中的事件处理程序是如何链接到四个按钮的。


    ## 9.2 数据访问层


    程序应该能够维护有关笔记、预约和纪念日的数据。在原始的 PC 应用中，我使用了对象序列化，但在当前版本中，我将改用 SQLite 数据库。这次迭代的目标是明确用于持久化数据的模型。结果如下：


    1.  从 Java 8 项目复制了 `Note`、`Appointment` 和 `Anniversery` 类。这些模型类没有发生任何变化。

    2.  复制了 `Repository` 接口，它也保持不变。

    3.  复制了 `Time` 类。它扩展包含了一个额外的构造函数，用于将 `HH:MM` 格式的字符串解析为 `Time` 对象。

    4.  同样，`Date` 类扩展了一个构造函数，用于将 `YYYY-MM-DD` 格式的字符串解析为 `Date` 对象。


    最后两项更改的原因是 `SQLite` 没有 `Date` 和 `Time` 列的类型。


    项目中添加了一个 `dal` 包，在这里我为 `notes`、`appointments` 和 `anniversaries` 三张表创建了一个 `DbHelper`
    类。


    `IORpository` 类从原始项目中复制而来。该类具有相同的接口（`Repository`），但其他部分已经过完全修改，现在它将数据持久化在 SQLite
    数据库中。该类尚未经过测试，此外它的翻译没有错误，且测试与各个日历函数的实现相关。因此，预计在接下来的三个冲刺阶段，该类将会发生变化。


    ## 9.3 笔记


    本次迭代的任务是实现笔记的维护，原则上包含 3 个功能：


    1.  创建和维护笔记（CRUD）

    2.  显示所有笔记的概述

    3.  删除两个日期范围内的所有笔记


    后两个功能从程序的选项菜单中选择，而第一个功能可以从右键菜单或笔记列表中选择。结果是项目中添加了三个新的活动（Activity），但 `MainActivity`
    类也发生了重大变化。


    由于所有数据库操作都在上一次迭代中实现，因此它们应该已经就绪，且对这些操作没有更改。然而，`IORepository` 类以及 `Repository` 接口扩展了一个新方法，用于通过标题搜索笔记。


    上述活动中的第一个称为 `NoteActivity`，用于 CRUD 操作。它从程序的右键菜单或活动 `NotesActivity` 打开。它是一个简单的活动，可以带有两个参数调用：参数可以是一个
    `Date` 对象（当从右键菜单打开时使用），也可以是一个 `Note` 对象（当从 `NotesActivity` 打开时使用）。在后一种情况下，你将看到笔记的所有数据，可以编辑笔记（而不是指定笔记创建日期的日期），并且可以删除它。


    另一个活动称为 `NotesActivity`，显示所有笔记的概述。如果没有带参数，它将显示所有笔记，但你可以搜索标题，其作用类似于过滤器。如果在不带参数的情况下调用该活动，则它来自程序的选项菜单。如果日历中的某个特定日期创建了笔记，右键菜单将增加一个名为“显示笔记”的额外菜单项，选择此菜单项将再次打开
    `NotesActivity`，这次以日期作为参数，窗口仅显示当天的笔记。


    最后一个活动称为 `RemoveActivity`，非常简单。它只需要能够输入两个日期，然后调用删除该范围内所有笔记的数据库操作即可。该功能从程序的选项菜单执行。由于其基本功能与用于预约和纪念日的函数相同，因此该活动有一个参数，指示该函数用于何处。


    然后是 `MainActivity`，那里存在变化。当然，打开上述活动的部分有所更改，但最大的变化涉及右键菜单。首先，每个日期字段都应该能够打开自己的右键菜单，对应于


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18)


    这必须对所有代表日期的 `TextView` 控件执行。为了读取日期，还应该能够确定用户手指按在了哪个 `TextView` 上，这无法立即实现。一种解决方案是当触摸
    `View` 对象时执行 `onTouch()` 方法，这是在 `OnTouchListener` 接口中定义的事件处理程序。如果你将此事件与所有 `TextView`
    组件关联，可以使用实例变量存储最后查看的 `View` 引用，并在执行右键菜单事件处理程序时确定关联是哪个 `View`。这需要知道它的坐标（行和列），但可以通过向组件挂载
    `tag` 对象来实现。


    另一个要解决的问题是右键菜单应该是动态的。除了三个固定的菜单项外，如果某个日期创建了笔记、预约或纪念日，则必须为这三者每种都增加一个额外的菜单项。最后，如果该日期是节假日，也必须有一个额外的菜单项。由于这些原因，菜单现在在代码中定义（并删除了
    `context_menu.xml` 文件）。


    最后，在用户界面中应该能够通过（红色）显示给定日期是否存在右键菜单扩展。这需要对模型进行更改（之前被注释掉的三个静态方法应该激活并进行微调）。


    ## 9.4 纪念日


    在下一次冲刺中，我将实现纪念日的维护。原则上，它们必须以与笔记相同的方式进行，但更为简单，因为大多数挑战已经解决，而且大部分功能可以通过复制/粘贴来实现。基本上，需要添加两个活动：


    1.  `AnniversaryActivitiy` 用于 CRUD 功能

    2.  `AnniversariesActivity` 用于纪念日概述


    这两个活动都可以通过复制相应的笔记活动来实现。与维护笔记一样，有必要在 `IORepository` 中添加一个关于纪念日的额外搜索方法。


    '
- fmt: '

    Finally, there is removing anniversaries, but it is already implemented in `RemoveActivity`.
    However, it has been necessary to change the method in the class `IORepository`.


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_201.jpg)


    As part of this iteration, `MainActivity` has also been updated, but it’s only
    a matter of updating the menus event handlers.


    At the end of the iteration, the following changes have been made:


    1. I have deleted the interface `Repository`.

    2. I have changed the name of `IORepository` to the `Repository` and at the same
    time changed the class to a singleton.


    The reason for this changes is primarily that it provides a slightly simpler code,
    which does not always require instances of the class `IORepository`. Another reason
    is that the `Repository` class contains several methods that are not used, but
    they are there because of the interface and as part of the conversion of the class
    `IORepository` to the current project. I want to remove these methods as part
    of the next sprint.


    ## 9.5 Appointments


    This sprint is essentially identical to the previous one, but it is less about
    copy/paste. The CRUD window is more complex as it also has to show an overview
    of other appointments for the same day, and also the program must validate that
    an appointment does not consolidate with an already created appointment. The code
    for that is taken from the PC version of the program.


    After this sprint, all functions relating to the database are completed and all
    menu item functions are in place (except the clock menu item). Finally, the class
    `Repository` is updated where the unused methods are removed.


    ## 9.6 The other tools


    The task of this iteration is to implement the last functions, that is the four
    tools in the toolbar and to turn the clock on and off.


    ### The tool: Select a month


    It’s a simple feature. Choosing this tool in the toolbar opens an activity `GotoActivity`,
    where you can enter a year and select a month. If you click `OK`, you will return
    to `MainActity`, and the calendar will show the selected month. In addition to
    adding the `GotoActivity` class, a class `Month` has been added that is used to
    return the selected month.


    ### The tool: Stopwatch


    The stopwatch appears under the calendar as a button and a read-only `EditText`
    component, which displays the clock. By default, these two components are invisible.
    Clicking on the button in the toolbar displays the components and the clock starts.
    If you click on the button again, the components disappear, and the button in
    the toolbar is thus an `on/off` button. If the stopwatch is visible and running,
    and you click the button below the calendar, it will stop the clock and you can
    start it again by clicking the button.


    To implement the stopwatch, the following types are added to the project’s model:


    * `Stopwatch`

    * `StopEvent`

    * `StopListener`


    These types are taken from the PC version and are largely unchanged. `Stopwatch`
    is in principle an enclosure of a timer ticking every second and every time the
    timer is ticking, a notification is sent as a `StopEvent` to a `StopListener`.
    It is an interface that `MainActivity` implements.


    ### The tool: Count Down


    The counter is displayed below the stopwatch as a button and a read-only `EditText`
    component, which displays the clock. By default, these two components are invisible.
    If you click on the button in the toolbar, you switch to an activity `WatchActivity`,
    where you have to set the clock (the clock counts down to 0). Clicking on `OK`
    displays the components and the clock starts. If you click on the button again,
    nothing happens (it’s not an `on/off` button), but clicking on the button below
    the calendar stops the counter and the two components become invisible again.


    When starting a counter, the program simultaneously starts a service that runs
    to just before the counter is 0. When it occurs, the phone rings for 10 seconds
    and the `MainActivity` window opens, which it is not already. The service class
    is called `CounterService`.


    In order to implement the counter, the following types are also added to the project
    model:


    * `Watch, som er basisklasse til Counter`

    * `TimeEvent`

    * `TimeListener`

    * `Counter`


    These types are taken from the PC version and are largely unchanged. `Counter`
    is in principle an enclosure of a timer ticking every second and every time the
    timer is ticking, a notification is sent as a `TimeEvent` to a `TimeListener`.
    It is an interface that `MainActivity` implements. Notifications are also sent
    when the counter starts and stops.


    ### The tool: Alarm


    This tool is in principle identical to the above counter and appears in the window
    under the counter. The difference is that an alarm selects an alarm clock (with
    the activity `WatchActivity`) and the alarm occurs when the clock reaches this
    time. The following types have been added:


    * `Alarm`

    * `AlarmService`


    ### The tool: Clock


    It’s a simple feature. In the menu you can choose to turn a watch on and off.
    The function consists only of starting a timer that ticks every second and the
    following types have been added to the model:


    * `Clock`

    * `ClockEvent`

    * `ClockListener`


    ### The AppointmentService


    In fact, another feature still lacks, that must warning the user if it is time
    for an appointment. The function is implemented as a service that starts when
    the program is started (if it is not already running). The service tests for appointments
    every second minute:


    1. If an appointment occurs within 5 minutes, the service sends a Toast.

    2. If an appointment occurs within 15 minutes, the service sends a Toast.

    3. If an appointment occurs within 1 hour, the service sends a Toast.


    If the time for an appointment has passed, the following occurs:


    1. The service in question is deleted in the database.

    2. The phone rings for 2 seconds.

    3. The service opens the Calendar’s `MainActivity` (if it is not already).

    4. The service will insert a notification in the window’s action bar.


    Appointments have a property `Save`, which indicates that an appointment should
    not to be deleted (a feature inherited from the PC version). This feature does
    not really make sense, and as it complicates the current service, the option is
    removed. The database has not been changed, and the only thing that has happened
    is in the acitivity `AppointmentActivity`, a `CheckBox` has been removed.


