    1. 我删除了接口 `Repository`。

    2. 我将 `IORepository` 重命名为 `Repository`，并同时将类更改为单例。


    进行这些更改的原因主要是因为它提供了稍微简单的的代码，并且并不总是需要 `IORepository` 类的实例。另一个原因是 `Repository` 类包含几个未被使用的方法，但它们之所以存在是因为接口，以及作为将
    `IORepository` 类转换为当前项目的一部分。我想在下一次冲刺中移除这些方法。


    ## 9.5 预约管理 (Appointments)


    这次冲刺本质上与上一次相同，但不再涉及大量的复制/粘贴。CRUD 窗口更加复杂，因为它还必须显示同一天的其他预约概览，而且程序必须验证预约不会与已创建的预约冲突。这部分代码来自程序的
    PC 版本。


    在此冲刺之后，所有与数据库相关的功能都已完成，所有菜单项功能也就位（时钟菜单项除外）。最后，更新了 `Repository` 类并删除了未使用的方法。


    ## 9.6 其他工具


    ### 工具：选择月份


    这是一个简单的功能。在工具栏中选择此工具会打开活动 `GotoActivity`，你可以在其中输入年份并选择月份。点击 `OK`，你将返回 `MainActity`，日历将显示所选月份。除了添加
    `GotoActivity` 类外，还添加了一个 `Month` 类，用于返回所选月份。


    ### 工具：秒表


    秒表以按钮和只读 `EditText` 组件的形式显示在日历下方，该组件显示时钟。默认情况下，这两个组件是不可见的。点击工具栏上的按钮将显示这些组件并开始计时。如果你再次点击该按钮，组件将消失，因此工具栏中的按钮变成了一个“开启/关闭”按钮。如果秒表可见并正在运行，你点击日历下方的按钮，它将停止计时，你可以通过再次点击按钮重新开始。


    为了实现秒表，向项目模型中添加了以下类型：


    * `Stopwatch`

    * `StopEvent`

    * `StopListener`


    这些类型取自 PC 版本且很大程度上没有变化。`Stopwatch` 原上是一个每秒跳动一次计时器的封装，每当计时器跳动时，都会作为 `StopEvent`
    通知 `StopListener`。这是一个 `MainActivity` 实现的接口。


    ### 工具：倒计时


    计数器以按钮和只读 `EditText` 组件的形式显示在秒表下方，该组件显示时钟。默认情况下，这两个组件是不可见的。如果你点击工具栏上的按钮，将切换到活动
    `WatchActivity`，你需要在其中设置时间（时钟将倒计时到 0）。点击 `OK` 将显示组件并开始计时。如果你再次点击按钮，什么都不会发生（它不是“开启/关闭”按钮），但点击日历下方的按钮会停止计数，两个组件将再次变为不可见。


    当启动计数器时，程序会启动一个服务，该服务一直运行到计数器变为 0 之前。当发生这种情况时，手机会响 10 秒并打开 `MainActivity` 窗口（如果它尚未打开）。该服务类名为
    `CounterService`。


    为了实现计数器，项目模型中还添加了以下类型：


    * `Watch, som er basisklasse til Counter`

    * `TimeEvent`

    * `TimeListener`

    * `Counter`


    这些类型取自 PC 版本且很大程度上没有变化。`Counter` 原上是一个每秒跳动一次计时器的封装，每当计时器跳动时，都会作为 `TimeEvent` 通知
    `TimeListener`。这是一个 `MainActivity` 实现的接口。在计数器开始和停止时也会发送通知。


    ### 工具：闹钟


    该工具在原则上与上述计数器相同，并显示在计数器下方的窗口中。区别在于，闹钟会选择一个闹钟时间（通过活动 `WatchActivity`），并在时钟到达该时间时触发闹钟。添加了以下类型：


    * `Alarm`

    * `AlarmService`


    ### 工具：时钟


    这是一个简单的功能。在菜单中，你可以选择开启或关闭手表。该功能仅由启动每秒跳动一次的计时器，并在模型中添加了以下类型：


    * `Clock`

    * `ClockEvent`

    * `ClockListener`


    ### 预约服务 (AppointmentService)


    事实上，还缺少另一个功能，即在预约时间时提醒用户。该功能实现为一个服务，在程序启动时启动（如果它尚未运行）。该服务每两分钟检查一次预约：


    1. 如果预约在 5 分钟内发生，服务将发送一个 Toast。

    2. 如果预约在 15 分钟内发生，服务将发送一个 Toast。

    3. 如果预约在 1 小时内发生，服务将发送一个 Toast。


    如果预约时间已过，将发生以下情况：


    1. 从数据库中删除该预约。

    2. 手机响 2 秒。

    3. 服务打开日历的 `MainActivity`（如果它尚未打开）。

    4. 服务将在窗口的操作栏中插入一条通知。


    预约有一个属性 `Save`，表示该预约不应被删除（从 PC 版本继承的功能）。这个功能实际上没有意义，而且由于它使当前变得复杂，因此删除了该选项。数据库没有更改，唯一发生的是活动
    `AppointmentActivity` 中删除了一个 `CheckBox`。


