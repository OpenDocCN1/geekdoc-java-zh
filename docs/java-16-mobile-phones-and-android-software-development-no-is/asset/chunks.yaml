    ## 4.4 About activities


    I want to conclude this chapter by looking a little closer to the class `Activity`,
    and as shown in the previous examples, each mobile app has an `Activity` object.
    One might think of an `Activity` as an object that represents the program’s window
    and implements the logic that the application uses, and a program may therefore
    have more activities. An activity can be in four modes


    1. `Launched`, when an activity comes in to existence, usually as the result of
    a user performing some action to starts the application.

    2. `Running` at which the users actually sees your activity, after all of the
    various setup steps are performed.

    3. `Killed`, that is a state in which the Android OS has determined to terminate
    the appplication.

    4. `Shut down` at which all persistent state information is deleted.


    Changes are made on the basis of callback methods, where `onCreate()` is an example,
    but there are some others, and it’s all methods that you can override. In the
    following, I will mention the main callback methods.


    `onCreate()` is executed when an activity starts its life cycle, typically because
    a user has requested the activity or the activity is restarted due to changes
    in the environment, for example due to a rotation of the devic. It is for restart
    that `onCreate()` has a parameter of the type `Bundle`, that can contain information
    about the state of the activity. Basically, `onCreate()` is used for:


    1. Load the layouts that the activity uses in `onStart()`.

    2. Initialize the activy’s instance variables.


    There are some tasks that relate to `onCreate()` and primarily concerns restart
    of the activity, including keeping track of existing resources. For example, `onStart()`,
    that is executed after `onCreate()` has created the required objects and is tasked
    with presenting the UI to the user. There is seldom the need to override this
    method. And if you do, it is important to call `super.onStart()`.


    `onResume()` is executed immediately before the user interface becomes visible
    and the method performs almost the same as `onStart()`, but is performed in conjunction
    with another state switch as you can se in the following diagram:


    ![](image/Image2061.jpg)


    `onPause()` is executed after an application is switched to the background state
    after Android has suspended the application. Viewed from the programmer, the method
    can be used to ensure data is saved when the application is suspended.


    `onStop()` sends the activity in background, and you can think of the method as
    the opposite of `onStart()` and the activity is no longer visible to the user,
    while the view and properties still exist and are transferred to `onResume()`
    and `onStart()`. Note that `onStop()` is not necessarily performed, if the Android
    decides to terminate the application, and it is therefore rare to override this
    method.


    `onRestart()` is executed at a state shift from stopped to start, then allowing
    to some extend to decide how to restart the activity.


    `onDestroy()` is performed when an activity is closed, but note that it concerns
    an activity and not the entire application. The method can only be used for a
    cleanup that relates to the current activity.


    The above diagram should show where and when the different callback methods are
    performed in connection with state shift. In the above examples I have only used
    `onCreate()`, but as the examples use more of the phone’s facilities, more of
    the above callback methods are also interesting.


    There are several methods that relates to change of state for an activity and
    can be overwritten, and as example I would like to mention two:


    1. `onRestoreInstanceState()` that is executed when a user leaves an activity
    by clicking the back button or performing other logic that is part of the application
    and the method can be used in situations where there is a need to save user data.

    2. `onSaveInstanceState()` which is responsible for storing an activity’s state
    information, primarily associated with `onDestroy()`.


