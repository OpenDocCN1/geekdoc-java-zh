    activity 中必须具有唯一的标识符。`onCreate()` 中的最后一条语句表示，必须为程序的 `ListView` 组件注册上下文菜单。如果还有其他应该拥有上下文菜单的控件，也应该以相同的方式注册。


    然后是创建菜单的 `onCreateContextMenu()` 方法。在这种情况下，它只有两个菜单项，所以很简单，但当然可以有更多。最后是事件处理器，在当种情况下，每当在上下文菜单中选择一个菜单项时，就会执行一次。参数是被选中的菜单项。首先，确定点击了哪行以及对应的
