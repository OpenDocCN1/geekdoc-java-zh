    2.  *Service.START_NOT_STICKY*, which indicates that the service will not be automatically
    restarted.


    3.  *Service.START_REDELIVER_INTENT*, which means the same as the first option,
    but with the difference that the original *Intent* object is sent to *onStartCommand()*.


    One can end a service with the method *stopService()* and a service can end itself
    with *stopSelf()*.


    To create a bound service, you must implement the method *onBind()* that returns
    an *IBinder* that defines the interface for communication with the service. Other
    applications can then call *bindService()* to retrieve the interface and begin
    calling methods on the service. The service is only alive as long there are applications
    that is bound to it, and when there are no components bound to the service, the
    system destroys it, and you do not need to stop a bound service in the way you
    must when the service is started with *onStartCommand()*. There are two ways you
    can define the *IBinder* interface:


    1.  Extending the *Binder* class. If your service is private to your own application
    and runs in the same process as the application, which is often the case, you
    should create your interface by extending the *Binder* class and returning an
    instance of it from *onBind()*. Then the client receives the *Binder* object and
    can use it to directly access *public* methods available in either the *Binder*
    implementation or the *Service*. When the service is merely a background worker
    for the application it is the way to create the *Binder*, and the only reason
    not to create the interface this way is because the service has to be used by
    other applications or across separate processes.


    2.  Using a *Messenger.* If you your interface must work across different processes,
    you can create an interface for the service with a *Messenger*. In this manner,
    the service defines a *Handler* that responds to different types of *Message*
    objects. This *Handler* is the basis for a *Messenger* that can share an *IBinder*
    with the client, allowing the client to send commands to the service using *Message*
    objects. Also the client can define its own *Messenger* so the service can send
    messages back. This is the simplest way to perform interprocess communication,
    because the *Messenger* queues all requests into a single thread so that you don’t
    have to design your service to be thread-safe.


    Application components can bind to a service by calling *bindService(),* and Android
    then calls the service’s *onBind()* method, which returns an *IBinder* object
    for interacting with the service. It happens asynchronous and *bindService()*
    returns immediately and does not return the *IBinder* object. To receive the object,
    the client must create an instance of *ServiceConnection* and pass it to *bindService()*.
    *ServiceConnection* is an interface and defines a method *onServiceConnected()*
    that the system calls to get the *IBinder* object. The interface also defines
    a method *onServiceDisconnected()* that Android calls when the connection to the
    service is lost because the service has crashed or has been killed. The method
    is not called when the application unbinds. To disconnect from a service, you
    must call the method *unbindService()*. When the application is destroyed, it
    will automatical unbind from the service, but you should always unbind when you’re
    done so that the service can shutdown while it is not longer being used.'
