    ## 8.7 Ring the phone


    The following example opens a simple window as shown below. If you click on the
    top button, the phone rings and continue until you click the bottom button. Note
    that if you click on the top button and then close the program, the phone will
    continue to ring. This is because the program starts a service, and since it is
    not a local service, it will still be active after the application is closed.


    After the phone has ringed for 10 seconds, the phone will open the window below
    (allowing you to stop ringing), regardless of whether the application is closed
    or not.


    I do not want to show the layout for the user interface, and `MainActivity` is
    also simple:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_1721.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_173.jpg)![](image/Image2215.jpg)


    There is only an `onCreate()` and there is not much about services. An event handler
    to a button is an object of a class that implements the interface `View.OnClickListener`.
    This interface defines a single method called `onClick()` and has a `View` object
    as parameter. The method associates event handlers with the two buttons by creating
    objects of anonymous classes. The event handler for the button `cmdStart` has
    a single statement, which calls the method `startService()`, where the parameter
    is an `Intent` object for the current class and also the class `RingService`,
    which is the service class. With regard to the method `startService()`, it is
    a method in the `Context` class as an `Activity` inheritance, and the method starts
    a `RingService` service – if it is not already running. The event handler for
    the second button is implemented accordingly, but instead calls the method `stopService()`.


    The services itselves are written as follows:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_174.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_175.jpg)


    The class has a variable of the type `MediaPlayer` that is used to ring the phone,
    but otherwise, the class overrides two methods from the class `Service`. The first
    is called from the event handler for the first button when it calls `startService()`
    and it creates a `MediaPlayer` object (if it is not already created) and says
    it should continue to ring. Then, the method starts a thread that waits for 10
    seconds, and then opens the window `MainActivity,` even if the application is
    closed. The syntax is not simple and by no means obvious and there is not much
    more than to take it into account. The second method is called equivalent from
    the event handler to the bottom button when it performs the method `stopService()`.


    ## 8.8 A local service – ServiceApp


    I will then show an application that uses a local service. The application opens
    the following window:


    ![](image/Image2224.jpg)


    The program uses a service that always finds the next prime number. In the beginning,
    it’s fast, but if the program has run for a long time, it starts to take time
    to determine the next prime. The window has 4 buttons and a `ListView`. If you
    click on the button `PRIME`, the prime for which the service is reached is added
    to the `ListView`, partly as the number’s index in the sequence of primes and
    partly as the actual prime number. Clicking the button `CLEAR` will delete the
    content of the `ListView`. If you click on the button `WAIT`, the service stops
    its work, but it can be restarted (meaning it continues) by clicking `GO`. Above,
    after the program has been running for a while, there are clicked


    *   `PRIME`

    *   `PRIME`

    *   `WAIT`

    *   `PRIME`

    *   `PRIME`

    *   `GO`

    *   `PRIME`

    *   and after a while PRIME


    The layout is simple and contains only 5 components:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_177.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_178.jpg)


    and the only thing to note is the names that I have given the buttons and the
    `ListView`, as well as the names of the event handlers that the buttons calls.
    The code for `MainActivity` is as follows:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_178.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_179.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_180.jpg)


    The first thing to note is that the class implements an interface `ServiceConnection`.
    This interface defines two methods to be overridden. The first is `onServiceConnected()`,
    and it is executed when the application starts and binds to the service. It initializes
    a `Toast`, which refers to the service. The second method is `onServiceDisconnected()`,
    and is executed if the application disconnects from the service.


    In addition to the variable `service`, there is nothing new about `onCreate()`.
    On the other hand, the class overrides both `onResume()` and `onPause()`, and
    these methods bind or unbind the application to the service.


    Finally, there are the 4 event handlers for the buttons, which are generally trivial,
    but three of them use methods at the service to pause, restart, and read its value.


    The service is also a class and is written as follows:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_181.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_182.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_183.jpg)


    First, note that the class inherits the class `Service`, which is what makes it
    to a service. Then note the class variables, where the first has the type `IBinder`,
    which is an interface that defines how components can communicate with the service.
    The variable refers to a `PrimesBinder` object, which is a public inner class
    inheriting the class `Binder`, and the class does nothing but implement a method
    that returns a reference to the current service. The following variables are for
    the current prime number, while the last indicates whether the service is paused.


    The class overrides three methods from the class `Service`, which is performed
    when a component binds or rebinds the service, and a method if a component unbinds.
    Here is the last trivial, in which it just sets `running` to false, while the
    others call the method `start()`. It is the method that starts the work of the
    service by starting a thread that runs until the variable `running` becomes `false`.
    When the thread terminates (`running` becomes false) the thread stops and the
    variables `index` and `prime` are not updated, but their value are retained. This
    means that if the method `start()` is executed again, it will start a new thread,
    which will then continue from where the previous one stopped.


    The thread itself is implemented by an inner class `Generator`, but here is nothing
    new and the method `isPrime()`, is as you have seen it many times.


    Back there is only one thing, that the manifest must be updated:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_184.jpg)


