    ## 6.1 创建数据库


    你可以通过两种方式创建数据库。你可以在开发机外部创建，然后将数据库作为资源拷贝到应用程序中，但如果以后需要更新数据库，这很容易导致困难。出于这个原因，有一个辅助类可以方便地在代码中创建数据库，并确保数据库在第一次使用应用程序时自动创建，同时也确保在你稍后更改它时数据库也会更新——前提是你已经添加了所需的代码。在当前情况下，我添加了以下类：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_124.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_125.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_126.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_127.jpg)


    最初定义了一个随机生成器，它不应该是完成的应用程序的一部分，但我稍后会解释该语句。否则，该类定义了大量定义数据库的常量。这些常量并非绝对必要，但它们可以使后续代码更容易易读和理解，并能显著简化代码的维护工作。因此，建议引入这些常量，在本例中，两个数据库表各有一两组常量。当你看到这些常量时，很容易理解它们的含义。注意，数据库名称本身有一个常量，注意版本号也有一个常量。此外，还有创建数据库表的两个
    SQL 表达式的常量。


    该类继承自 `SQLiteOpenHelper`，基类中的构造函数会检查是否存在同名的数据库。如果没有，它将执行 `onCreate()`。如果找到了数据库，会测试版本号，如果版本大于数据库版本号，则执行
    `onUpgrade()` 方法。如果版本小于数据库版本号，则执行 `onDowngrade()` 方法。因此，`SQLiteOpenHelper` 类应该重写这三个方法——但在许多情况下，你不需要重写最后一个（版本号总是更高的）。


    在这种情况下，`onCreate()` 创建了两个表。注意，是基类的构造函数创建了数据库，而 `onCreate()` 创建了表。`onCreate()`
    调用了 `insertZipcodes()` 方法。它使用 `StringBuilder` 使用带有邮政编码的资源动态创建一个 `SQL INSERT`，方法返回字符串结果。`onCreate()`
    有一个类型为 `SQLiteDatabase` 的参数，它拥有诸如 `execSQL()` 头部的方法，该方法执行 SQL 语句。该方法用于创建两个表，通常可以执行表示为字符串的
    SQL 语句，因此也可以执行 `insertZipcodes()` 的结果。


    程序还重写了基类的另外两个方法：`onUpgrade()` 和 `onDowngrade()`。两者都无关紧要，因为所有代码都被注释掉了，但其意思是当版本号增加时你需要插入代码。当你开发程序时，通常会在每次运行时创建数据库。


