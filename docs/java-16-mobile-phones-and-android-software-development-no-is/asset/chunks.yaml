    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_581.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_59.jpg)


    and Android Studio has converted all editor constraints into actual constraints,
    after which the program can be translated and run, and the components are located
