    # 4 User interaction


    In this chapter I will look a little more on the basic user interaction, including
    how to use menus and dialogs. However, I want to start with the virtual keyboard.


    An Android device may well have a hardware keyboard, but most devices, including
    smartphones, have a virtual keyboard that pops up when you click in an input field.
    An input field is an *EditText* widget, but if you look at the design editor under
    the *Text* palette, you will see that there are many options, and each option
    tells you how to display the content, but primarily which virtual keyboard to
    use:


