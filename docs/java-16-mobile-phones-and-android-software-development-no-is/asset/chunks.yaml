    服务也可以是一个前台服务（foreground service），它是与用户可感知的某些内容相关，因此在内存不足时不会成为系统杀掉的候选对象。前台服务必须在状态栏中提供一个通知，该通知在服务停止或从前台移除之前是无法消除的。要启动一个前台服务，你使用
    `startForeground()` 方法，该方法接收两个参数，其中第一个是一个 `int`，用于唯一标识该通知以及状态栏中的通知。


    在简单的情况下，活动（activity）和服务之间不需要任何通信。服务从活动组件接收一个 `Intent` 对象，然后执行其工作；但在其他语境下，活动和之间之间需要直接通信，这时你可以使用接收器（receiver）。活动可以检测用于某个事件的广播接收器，而服务可以为该事件发送通知，并通常通过向活动对象发送信号来响应其已完成工作：


    ![](img/Image2185.jpg)


    广播接收器是一个扩展自 `BroadcastReceiver` 的类，可以在 `AndroidManifest.xml` 或代码中注册为应用程序或其他接收器。该接收器能够接收通过
    `Context.sendBroadcast()` 方法生成的意图（intents）。`BroadcastReceiver` 类定义了 `onReceive()`
    方法，应用程序可以使用该方法获取接收到的对象。


    这里简要介绍了一些理论，在接下来的部分我将展示使用服务具体需要写什么，至少是简单服务的启动以及本地服务的使用，但这个主题实际上相对复杂，我将在下一本书中回到它。此外，书中没有介绍
    `BroadcastReceiver` 对象。


    不过，我想对 `Intent` 类添加几点注释。


    ## 8.1 Intent 类


    `Intent` 类并不仅仅与服务有关，我已经多次使用过该类，但没有提到它作为一个类是干什么用的。由于该类在服务中起着至关重要的作用，我将在这里简要提到它。


    该类主要应用于活动、服务和广播接收器。这些组件是通过被称为“意图”（intents）的消息创建的，意图是组件的一种后期绑定形式，因此这种方式总是以相同的方式发生。`Intent`
    对象是一个数据结构，包含了对要执行的操作的抽象描述，或对已发生并需要发布的事件的描述。有几种机制可以将意图发送给不同类型的组件：


    1. 将 `Intent` 对象传递给 `Context.startActivity()` 或 `Activity.startActivityForResult()`
    以启动活动或获取现有的活动以执行新操作。它也可以被传递给 `Activity.setResult()`，以返回来自通过 `startActivityForResult()`
    执行的活动的信息。


    2. 将 `Intent` 对象传递给 `Context.startService()` 以启动服务或向正在运行的服务递送新指令。同样，意图可以传递给 `Context.bindService()`
    以在调用者活动和服务之间建立连接。如果服务尚未运行，它也可以用于启动该服务。


    3. `Intent` 对象可以传递给广播方法（见下一本书），例如 `Context.sendBroadcast()`、`Context.sendOrderedBroadcast()`
    或 `Context.sendStickyBroadcast()`，并被递交给所有感兴趣的广播接收器。


    意图在服务中非常有用，用于在调用对象和服务之间交换信息和通知。鼓励你查看 `Intent` 类的文档。


    ## 8.2 ServiceApp1


    服务被写为一个继承自 `Service` 或 `IntentService` 的类，后者派生自前者。`IntentService` 的目标是尽可能简化服务的启动。服务在它们自己的线程中异步执行请求，可以花费需要的时间，且不会阻塞应用程序。单个请求被添加到队列中，并逐个执行。`IntentService`
    是一个由活动启动的后台服务，此时服务和活动之间没有直接通信。一个典型的应用是启动耗时较长的操作，例如下载文件。


    示例 `ServiceApp1` 打开了以下窗口：


    ![](img/Image2192.jpg)


    如果你点击顶部的按钮，窗口会获得随机颜色；点击底部的按钮会启动一个作为 `IntentService` 的服务。该服务写如下类：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_156.jpg)


    该类应该只有一个默认构造函数，该构造函数以服务名称为参数执行基类的构造函数，并且它必须重写 `onHandleIntent()` 方法，该方法是负责执行所需的操作。在这种情况下，该方法执行一个长长的（无意义的）操作，之后它会激活一个铃声。关于该操作，目标是展示你如何通过
    `Intent` 将值传递给服务，以及服务在运行了一段时间后，你因为声音而观察到服务已经完成了它的工作。


    当应用程序使用服务时，必须在程序的清单（manifest）中定义它：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_1561.jpg)


    一个需要记住的细节。


    关于程序（`MainActivity`），顶部按钮的目标是展示在服务执行工作时应用程序并没有被阻塞——同时也为了稍微展示如何更改窗口的背景颜色。当你尝试程序时，请注意你可以启动多个服务以及它们是如何进入队列的。`MainActivity`
    的代码如下：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_157.jpg)


    这里重要的是事件处理器 `onStart()`，它启动了服务。首先为服务创建一个 `Intent` 对象，然后使用 `startService()` 方法启动服务。


    ## 8.3 ServiceApp2


    通常，`IntentService`提供的选项不够，例如如果你想停止正在运行的服务，你就必须编写一个直接继承 `Service` 类的服务。`ServiceApp2`
    展示了如何这样做。程序的窗口与上面几乎相同，只是多了三个按钮：


    ![](img/Image2200.jpg)


    用于停止正在运行的服务。这次服务被写为：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_159.jpg)[](image/Java_16_–_Mobil_phones_and_Android_29-6-18_160.jpg)


    后台服务（没有用户界面的）可以通过两种方式与环境通信，其中一种是简单的 `Toast`，它只是短暂显示在屏幕上的简单消息。该类这次继承了 `Service`
    类，服务拥有一个 `onCreate()` 方法，你可以在其中初始化服务。在这种情况下，除了服务显示一个说已创建的 `Toast` 之外什么都没有发生。还有一个名为
    `onBind()` 的方法是由 Android Studio 插入的，但只用于绑定服务。然后是最后一个方法 `onDestroy()`，它在服务停止时执行，在这种情况下它也只显示一个简单的
    `Toast`。


    最后是 `onStartCommand()`，它是当服务启动时执行的方法，即当启动活动执行 `startService()` 时。在这种情况下，一个循环将运行大约
    30 秒。在每次迭代中，都会执行一个 `Toast`，之后服务等待 5 秒。

