    # 2 Widgets


    If you consider the introductory example, it contains 5 controls:


    *   a entry field – a `EditText` control

    *   two radiobuttons – `RadioButton` controls

    *   two buttons – `Button` controls


    In Android, these are called controls for `widgets`, but the above are the same
    as you know from Swing or JavaFX. There are many such widgets, and some of the
    first to learn to write Android applications is of course learning which and how
    they are used. I do not want to systematically review the various components in
    this book, but illustrate some of them through examples, but basically they are
    used the same way you know it from controls in Java. Things are of course called
    something else, and there are other properties that you can set, but the principles
    are the same. Widgets are arranged in an extensive class hierarchy, where the
    overall basic class is called `View`. In this context, it is good to know the
    web address


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_24.jpg)


    which is the basic reference for Android’s many features.


    As with Swing and JavaFX, the biggest challenges are getting a component placed
    in the window, where you now exactly want them to be, but also that the window
    looks nice at different sizes of the screen, but that is the subject of the next
    chapter.


    In general, Android has the same widgets that you know as controls in Swing /
    JavaFX, but maybe they are called something else. However, there are also new
    ones that are not found in Java, and as an example, I want to show an application
    with two widgets:


    *   a `Switch`, that is an alternative to a `CheckBox`

    *   an `AnalogClock`, har shows a clock (the widget is now deprecated)


    The project is called `TheClock`, and if you opens the application in the emulator,
    the result is as shown below. The application shows an analogue clock that counts
    in minutes. Over the clock there is a `Switch` (you know the widget from your
