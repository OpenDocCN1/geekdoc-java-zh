    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_162.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_163.jpg)


    Note that at the start of the class, an instance variable is defined. It must
    be used to ensure that the service can only start one thread. It is not necessary,
    but it is included to show how to stop a thread started by a service. Note, in
    particular, that the variable is set to `false` in the method `onDestroy()`, and
    it is executed either because the thread stops or because `onDestroy()` is called
    from an activity. The method `onStartCommand()` starts testing this variable,
    and if it is `true`, nothing else happens than the method performs a `Toast`.
    Otherwise, the method creates a thread that performs the same as in the previous
    example, in which in an iteration it performs a `Toast` followed by a `wait()`.
    However, there is a small problem. The message is now sent from a secondary thread,
    and although it is only a `Toast`, the thread must still update the user interface.
    It requires a `Handler` and is performed in the method `sendMessage()`. A `Handler`
    is linked to a message loop, and since a thread does not have a message loop,
    the method `getMainLooper()` is used. The `Handler` object will then use thet
    method `post()` to insert a `Runnable` object that performs the desired `Toast`.


