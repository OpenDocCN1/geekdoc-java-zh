    # Android 服务


    Service 是一种在后台执行且不与用户直接交互的组件，它没有用户界面。Service 用于执行特殊操作，且通常是耗时较长的操作。例如，它可以从互联网下载文件、测试新数据等。服务的执行优先级高于
    Activity，因此在可用资源不足时，Service 被 Android 中断的概率较小。不过，也可以提供一个优先级与前台 Activity 相同的的服务，如果是这样，则必须提供一个可见的指示来告知该服务正在运行，这通常用于视频和音乐播放器。


    ## 服务的类型


    主要有两种类型的 Service：


    1. 当应用程序（一个 Activity）通过调用 `startService()` 方法启动服务时，该服务被标记为 `started`（已启动）。一旦启动，服务就可以在后台无限运行，即使启动该服务的应用程序被销毁也是如此。通常，一个启动的服务会执行单一操作（如在网络上下载或上传文件），并且不会向调用者返回结果。操作完成后，服务应该停止自己。


    2. 当应用程序组件通过调用 `bindService()` 方法绑定到服务上时，该服务被标记为 `bounded`（已）。绑定的服务提供了一个客户端-服务器接口，允许组件与服务进行交互、发送请求、获取结果，并支持跨进程交互。只要有另一个应用程序组件绑定在该服务，绑定服务就会运行。多个组件可以同时绑定到服务，但当所有组件都解绑时，服务就会被销毁。


    ## 服务的执行与生命周期


    默认情况下，Service 在应用程序的主线程所在的进程中执行，但如果是由应用程序启动的服务，该服务通常会在辅助线程中执行工作，并在将随着辅助线程的结束而终止。


    Android 执行了许多预定义的服务，如果被允许，任何应用程序都可以使用这些服务。这些服务的使用通常通过特殊的 `Manager` 类并使用 `getSystemService()`
    方法来实现，并且 `Context` 类为这些服务定义了更多常量。除了这些系统服务外，应用程序还可以定义并应用行为与系统服务相同的新服务。`Custom`（自定义）服务通常可以从其他
    Android 组件（即 Activity、广播接收器和其他 Service）启动。


    服务的整个生命周期发生在调用 `onCreate()` 方法和调用 `onDestroy()` 方法之间，其中 `onCreate()` 用于所有的初始化设置，而资源的释放将在
    `onDestroy()` 中完成。无论通过 `startService()` 还是 `bindService()` 创建，所有服务都会调用这些方法。服务通过调用
    `onStartCommand()` 或 `onBind()` 开始工作。每个方法都会接收一个分别向 `startService()` 或 `bindService()`
    传递的 `Intent` 对象。如果服务是 `started` 状态，它会在 `onStartCommand()` 返回时结束工作；如果服务是 `bound`
    状态，它会在 `onUnbind()` 返回时结束。


    ## 实现


    Service 必须在 `AndroidManifest.xml` 中定义，并编写为一个继承自 `Service` 类或其某个子类的类。例如，Android
    组件（到目前为止指 Activity）可以使用 `startService()` 方法启动服务，作为替代方案，可以使用 `bindService()` 来与服务进行直接通信。


    `started` 服务通过 `startService()` 方法开始其生命，如果服务尚未运行，则会在服务的 `onCreate()` 方法中创建一个服务对象。一旦运行，服务可以使用
    `Toast` 通知或 `Status Bar`（状态栏）通知通知用户事件，但服务不能直接调用用户。


    ### onStartCommand


    `onStartCommand()` 方法返回一个 `int`，用于指示如果服务被 Android 终止，应该如何重启服务，有以下选项：


    1. `Service.START_STICKY`，意味着服务会被重启，但此时 `Intent` 对象为 null，适用于服务维护自己的状态且不依赖于 `Intent`
    对象的情况。


    2. `Service.START_NOT_STICKY`，表示服务将不会自动重启。


    3. `Service.START_REDELIVER_INTENT`，含义与第一个选项相同，但不同之处原始的 `Intent` 对象会被发送到 `onStartCommand()`。


    可以使用 `stopService()` 方法结束一个服务，服务也可以通过 `stopSelf()` 结束自己。


    ## 绑定服务的详情


    要创建一个绑定的服务，你必须实现 `onBind()` 方法，该方法返回一个 `IBinder`，它定义了与服务通信的接口。其他应用程序随后可以调用 `bindService()`
    获取该接口并开始调用服务上的方法。只要有应用程序绑定到它，服务就是存活的；当没有组件绑定到该服务时，系统就会销毁它，你不需要像在使用 `onStartCommand()`
    启动服务时那样去停止绑定服务。你有两种方式来定义 `IBinder` 接口：


    1. 扩展 `Binder` 类。如果你的服务对于你自己的应用程序是私有的，并且在应用程序相同的进程中运行（这通常是如此），你应该通过扩展 `Binder`
    类来创建接口，并在 `onBind()` 中返回它的实例。然后客户端接收到 `Binder` 对象，并可以使用它直接访问 `Binder` 实现或 `Service`
    中可用的 `public` 方法。当服务仅仅是应用程序的后台工作器时，这是创建 `Binder` 的方法；而不采用这种方式创建接口的唯一理由是该服务必须被其他应用程序或跨独立进程使用。


    2. 使用 `Messenger`。如果你的接口必须跨不同的进程工作，你可以使用 `Messenger` 为服务创建一个接口。通过这种方式，服务定义了一个
    `Handler` 来响应不同类型的 `Message` 对象。这个 `Handler` 是 `Messenger` 的基础，`Messenger` 可以与客户端共享
    `IBinder`，允许客户端使用 `Message` 对象向服务发送命令。此外，客户端也可以定义自己的 `Messenger`，以便服务可以发回消息。这是执行进程间通信最简单的方法，因为
    `Messenger` 将所有请求队列到单个线程中，这样你就不需要将服务设计为线程安全的。


    ### 绑定过程


    应用程序组件可以通过调用 `bindService()` 绑定到服务，随后 Android 会调用服务的 `onBind()` 方法，该方法返回一个用于与服务交互的
    `IBinder` 对象。这是异步发生的，`bindService()` 会立即返回而不会返回 `IBinder` 对象。要接收该对象，客户端必须创建一个
    `ServiceConnection` 实例并将其传递给 `bindService()`。`ServiceConnection` 是一个接口，定义了一个 `onServiceConnected()`
    方法，系统调用它来获取 `IBinder` 对象。该接口还定义了一个 `onServiceDisconnected()` 方法，当由于服务崩溃或被杀死导致与服务的连接丢失时，Android
    会调用该方法。当应用程序解绑时，不会调用此方法。要断开服务的连接，必须调用 `unbindService()` 方法。当应用程序被销毁时，它会自动从服务解绑，但你应该在完成后始终解绑，以便服务在不再使用时可以关闭。


