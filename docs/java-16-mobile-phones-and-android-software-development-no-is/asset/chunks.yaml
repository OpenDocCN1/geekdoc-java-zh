    ## 8.5 ServiceApp4


    在本节中，我将展示一个本地服务的示例，即应用程序可以绑定并与之通信的服务。它是本地服务意味着它是在与应用程序相同的进程中执行的服务，并且在应用程序关闭时会自动终止。程序打开以下包含一个
    `TextView` 和 3 个 `Button` 组件的窗口：


    ![](img/Image2207.jpg)


    程序启动后，文本显示 `Disconnected`（未连接），点击上方两个按钮什么都不会发生，因为程序尚未连接到服务。如果你点击底部的按钮，文本将变为 `Connected`（已连接），因为程序现在已绑定到服务，当你点击上方两个按钮时，文本会分别显示当前的日期和时间。这些值是由程序（按钮事件处理器）通过调用服务方法确定的，而读取时钟的是服务本身。


