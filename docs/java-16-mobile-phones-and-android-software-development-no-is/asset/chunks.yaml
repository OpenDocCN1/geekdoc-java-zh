    # Appendix A, installing of Android Studio


    The following is a brief introduction to how to set up a development environment
    for Android. There are several options, and you can add a plugin to NetBeans,
    thus using your well-known development tool. However, most people use either `Eclipse`
    or `Android Studio`, and as I apply the latter, it is the product as the following
    reviews. An `Android` developer tool requires two things:


    1. A common IDE, where you can enter and edit the code.

    2. An emulator, which is a program running a virtual Android machine on your PC,
    simulating a mobile phone, for example, to test the programs you write before
    they are installed on a physical device such as a phone.


    In fact, the integration between the two products is the challenge, as it seems
    from the developer must be easy and effective without big problems. That’s why
    there are not so many who uses NetBeans as a platform for software development
    for Android.


    To write Android applications you need two things:


    1. `Android SDK` that best can be characterized as a number of libraries that
    contains all the components that an Android application may need.

    2. `Android Tools`, which are a number of tools used in the development of apps,
    including the emulator and more.


    When Android came on the market, the most widely used development environment
    was `Eclipse` combined with the above two products, and it has since been a stable
    and efficient development platform. When I mention `Eclipse` here, it’s also because
    the product is worth acquainting for completely other reasons, as it is generally
    an effective tool for developing a Java application, and it’s in every way an
    alternative to NetBeans, and many prefer `Eclipse` rather than NetBeans. There
    may be a long discussions about – and will be – which of the two products is the
    best and in fact it is probably the product that for the user is the best known
    and has the most experience with. In these books I have used NetBeans everywhere,
    but it is good to know that there is something called `Eclipse` and you can easily
    end up in a development organization using this tool, especially if the tasks
    relate to the development of apps for mobile phones or other mobile devices.


    The two products `Android SDK` and `Android Tools` come from Google, as is the
    company behind Android’s development. Together with these products, Google has
    also developed an IDE for the development of Android applications. It has been
    quite a long time underway, but today it has reached a stage where it is quite
    user-friendly and efficient tool. That’s the reason why I’ll use this tool everywhere,
    a tool which Google calls `Android Studio`.


    In principle, it is quite simple to install `Android Studio`, as it is all packed
    into a single package that can be downloaded and installed instantly, and it is
    quite easy under Windows, whereas Linux requires a little more. In the following,
    I will outline what I have done to set up a development environment on a Fedora
    machine, and it’s actually not easy to write a precise guide, partly because updates
    and changes are constantly being added and partly because the commands depend
    a little of the current Linux distribution. Fortunately, there are many guides
    online, and the best thing to do is follow these instructions, if it is manuals
    of recent date. The following are therefore primarily references to good guidelines.


    In order for you to develop Android applications in practice, you need to have
    installed virtualization software, supported by a hardware accelerator, as the
    emulator otherwise runs intolerably slow. You can see how at the following addresses
    (for Fedora and Ubuntu, respectively):


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_208.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_209.jpg)


    The emulator itself is 32 bit software, and if you have a 64 bit machine (whatever
    you have), you should also install a special library called `ia32-libs`. For Fedora
    you can see how at the following address:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_2091.jpg)


    and for Ubuntu, the following document explains how, and also to download and
    install `Android Studio`:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_2092.jpg)


    The document is also a brief introduction to what Android is, and also shows how
    to write the first application.


    With the above referrals (or alternatives), setting up your development environment
    should run without the big challenges, but keep in mind that Android is a dynamic
    world that is constantly changing.

