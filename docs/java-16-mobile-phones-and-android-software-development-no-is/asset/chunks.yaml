    # 5 Files


    In view of the above examples, the subjects shown can now be a good move in developing
    mobile phone apps, but the phone provides a range of other services beyond what
    is applicable to ordinary computers, where I can mention SMS and phone, GPS, camera
    and more. These are facilities that I will first treat in the following book,
    but it is also possible to save data in files and databases, which is necessary
    for many apps, and in this and the following chapter I will focus on how to do
    that. This chapter will look at files, including how to manipulate the file system
    just like on a regular PC, but I want to start somewhere else, namely files that
    you only can read. If there are files that only have interest in the current application,
    the files can be saved as resource files within the application. Examples could
    be text, images, audio and more.


    ## 5.1 Reading resources


    If you create a project in Andoid Studio, under project files there will be two
    directories `java` and `res`, where the latter contains resource files. It are
    files that are packed with the program code in the `apk` file. Here you will find,
    among other things, a subdirectory `layout` that contains `activity_main.xml`
    that defines the application’s user interface and at the same location will be
    other xml documents for layout of other activities. You have also met the file
    `strings.xml` under the subdirectory `values`. Making data available to the program
    in this way has several advantages, such as:


    * It is easy to define data, that is always available for the program.

    * It ensures a separation of code and data.

    * It allows to place resources in a library so that they can be used by multiple
    applications.

    * Simple data can be available in a standard format such as XML.


    There are also disadvantages, among other things, to mention:


    * Data is fundamentally read-only, although in principle it is possible to modify
    the content.

    * It can be problematic to ensure data is up to date.


    To show an example of how to do, I will return to the example with the Danish
    kings, which represent data that rarely changes. The data in question is stored
    in an XML document named `regents.xml` and has the following content:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_100.jpg)


    I have then created a project, which I have called `DanishRegents`. The layout
    defines only a single component:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_1001.jpg)


    and the only thing to do is to fill this `ListView` with the names of the Danish
    kings. In order to make data available, I have created a subdirectory `raw` and
    copied file `regents.xml` to this subdirectory. Then the document is a resource
    for the application. I have then added a model class `Regent`, which can represent
    a regent, and apart from the name, the class is identical to the class `King`
    that I used previously. Back there is only the class `MainActivity`:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_101.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_102.jpg)


    First, note that there are a number of new import statement, among other things
    because the program should read and parse a XML document. The class has a single
    instance variable, which is a `List` for `Regent` objects, and thus to the objects
    that the `ListView` component should display. Otherwise, the class only has an
    `onCreate()`. It starts by loading the resource. Here you should note how to refer
    to a program’s resources using the method `getResources()` and how to load a raw
    file using the method `openRawResource()` and that the result is a regular `InputStream`.
    With this stream available, a `DocumentBuilder` can read the document and parse
    it as XML, after which you can create the current `Regent` objects and initialize
    the list. After the data is loaded and the list is initialized, an adapter is
    added to the `ListView` component. Additionally, an event handler has been added
    so that the program shows a `Toast` if you click on a name in the `ListView` component.


