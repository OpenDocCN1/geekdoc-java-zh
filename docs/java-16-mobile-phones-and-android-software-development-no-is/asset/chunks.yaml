    # Android Services


    A service is a component that is performed in the background without direct interaction
    with the user, and a service has no user interface. Services are used to perform
    special operations and often operations that take a long time. For example, it
    could be downloading a file from the Internet, testing for new data, and more.
    A service is performed with higher priority than activities, and there is therefore
    less chance that a service will be interrupted by Android if there is insufficient
    resources available. However, it is possible to provide a service with the same
    priority as foreground activities, and if so, it is necessary to have a visible
    indication that tells that the service is active, something that is used by video
    and music players.


    ## Types of Services


    There are two main types of services:


    1. A service is be `started` when an application (an activity) starts it by calling
    the method `startService()`. Once started, a service can run in the background
    indefinitely, even if the application that started the service is destroyed. Usually,
    a started service performs a single operation (as download or upload a file over
    the network) and does not return a result to the caller. When the operation is
    done, the service should stop itself.


    2. A service is `bounded` when an application component binds to it by calling
    the method `bindService()`. A bound service offers a client-server interface that
    allows components to interact with the service, send requests, get results, and
    also across processes. A bound service runs only as long as another application
    component is bound to it. Multiple components can bind to the service at once,
    but when all of them unbind, the service is destroyed.


    ## Service Execution and Lifecycle


    By default, a service is performed in the same process as an application’s primary
    thread, but if it is a service that is started by an application, that service
    will usually perform its work in a secondary thread, and the service will then
    be terminated with the end of the secondary thread.


    Android performs a number of predefined services that any application may apply
    if it is allowed. Use of these services usually occurs with a special `Manager`
    class using a method `getSystemService()`, and the `Context` class defines more
    constants for these services. An application may, in addition to these system
    services, define and apply new services that behave in the same way as system
    services. `Custom` services can generally be started from other Android components,
    that is, activities, broadcast receivers and other services.


    The entire lifetime of a service happens between the call of a method `onCreate()`
    and the call of the method `onDestroy()` where `onCreate()` is used to all initial
    setup, while the release of resources is done in `onDestroy()`. The methods are
    called for all services, whether they’re created by `startService()` or `bindService()`.
    A service begins its work with a call to either `onStartCommand()` or `onBind()`.
    Each method is handed an `Intent` object passed to either `startService()` or
    `bindService()`, respectively. If the service is `started`, it ends its work when
    `onStartCommand()` returns, and if the service is `bound`, it ends when `onUnbind()`
    returns.


    ## Implementation


    A service must be defined in `AndroidManifest.xml` and written as a class that
    inherits the class `Service` or one of its subclasses. As an example, an Android
    component (and so far, to say an activity) can start a service with the method
    `startService()`, and as alternative it can use `bindService()` that allows for
    direct communication with the service.


    A `started` service starts its life with the method `startService()` and if the
    service is not already running, a service object is created in the service’s `onCreate()`
    method. Once running, a service can notify the user of events using `Toast` notifications
    or `Status Bar` notifications, but the service can not directly call the user.


    ### onStartCommand


    The method `onStartCommand()` returns an `int` that indicates how services should
    be restarted if it is terminated by Android and there are the following options:


    1. `Service.START_STICKY`, which means that the service is restarted, but such
    that the `Intent` object is null and used if the service maintains its own state
    and does not depend on the `Intent` object.


    2. `Service.START_NOT_STICKY`, which indicates that the service will not be automatically
    restarted.


    3. `Service.START_REDELIVER_INTENT`, which means the same as the first option,
    but with the difference that the original `Intent` object is sent to `onStartCommand()`.


    One can end a service with the method `stopService()` and a service can end itself
    with `stopSelf()`.


    ## Bounded Services Detail


    To create a bound service, you must implement the method `onBind()` that returns
    an `IBinder` that defines the interface for communication with the service. Other
    applications can then call `bindService()` to retrieve the interface and begin
    calling methods on the service. The service is only alive as long there are applications
    that is bound to it, and when there are no components bound to the service, the
    system destroys it, and you do not need to stop a bound service in the way you
    must when the service is started with `onStartCommand()`. There are two ways you
    can define the `IBinder` interface:


    1. Extending the `Binder` class. If your service is private to your own application
    and runs in the same process as the application, which is often the case, you
    should create your interface by extending the `Binder` class and returning an
    instance of it from `onBind()`. Then the client receives the `Binder` object and
    can use it to directly access `public` methods available in either the `Binder`
    implementation or the `Service`. When the service is merely a background worker
    for the application it is the way to create the `Binder`, and the only reason
    not to create the interface this way is because the service has to be used by
    other applications or across separate processes.


    2. Using a `Messenger.` If you your interface must work across different processes,
    you can create an interface for the service with a `Messenger`. In this manner,
    the service defines a `Handler` that responds to different types of `Message`
    objects. This `Handler` is the basis for a `Messenger` that can share an `IBinder`
    with the client, allowing the client to send commands to the service using `Message`
    objects. Also the client can define its own `Messenger` so the service can send
    messages back. This is the simplest way to perform interprocess communication,
    because the `Messenger` queues all requests into a single thread so that you don’t
    have to design your service to be thread-safe.


    ### Binding Process


    Application components can bind to a service by calling `bindService()`, and Android
    then calls the service’s `onBind()` method, which returns an `IBinder` object
    for interacting with the service. It happens asynchronous and `bindService()`
    returns immediately and does not return the `IBinder` object. To receive the object,
    the client must create an instance of `ServiceConnection` and pass it to `bindService()`.
    `ServiceConnection` is an interface and defines a method `onServiceConnected()`
    that the system calls to get the `IBinder` object. The interface also defines
    a method `onServiceDisconnected()` that Android calls when the connection to the
    service is lost because the service has crashed or has been killed. The method
    is not called when the application unbinds. To disconnect from a service, you
    must call the method `unbindService()`. When the application is destroyed, it
    will automatical unbind from the service, but you should always unbind when you’re
    done so that the service can shutdown while it is not longer being used.

