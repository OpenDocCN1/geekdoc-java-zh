    ## 6.1 Creates a Database


    You can create a database in two ways. You can do it extern on the developer machine,
    and then copy the database to the application as a resource, but it can easily
    lead to difficulties if the database has to be updated later. For that reason,
    there is a helper class that makes it easy to create the database in the code
    and ensures that the database is automatically created the first time the application
    is used, but also ensures that the database is updated if you change it later
    – assuming that you have added the required code. In the present case, I have
    added the following class:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_124.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_125.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_126.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_127.jpg)


    Initially, a random generator has been defined and it should not be part of a
    the finished application, but I will explain the stetement in a while. Otherwise,
    the class defines a large number of constants that defines the database. These
    constants are not absolutely necessary, but they can make the following code easier
    to read and understand, and they can make the maintenance of the code significantly
    easier. It is therefore advisable to introduce these constants, and in this case
    there are two sets of constants for each of the two database tables. When you
    see the constants, it’s easy enough to understand the meaning. Note that there
    is a constant for the database name itself, and note that there is a constant
    for the version number. Also note that there are constants for the two SQL expressions
    that create the database tables.


    The class inherits `SQLiteOpenHelper`, and the constructor in the base class checks,
    if there is a database with that name. If not, it will perform `onCreate()`. If
    the database is found, the version number is tested and it is larger than the
    database version number the method `onUpgrade()` is performed. Is the version
    number smaller than the database version number the method `onDowngrade()` is
    performed. A `SQLiteOpenHelper` class should therefore override these three methods
    – however, in many cases you do not override the last one (the version number
    will always be higher).


    In this case, `onCreate()` creates the two tables. Note that it is the constructor
    in the base class that creates the database, while `onCreate()` creates the tables.
    `onCreate()` calls the method `insertZipcodes()`. It uses a `StringBuilder` to
    dynamically create a `SQL INSERT` using the resource with the zip codes, and the
    method returns the result as a string. `onCreate()` has a parameter of the type
    `SQLiteDatabase` and it has methods, such as header `execSQL()`, which performs
    a SQL statement. The method is used to create the two tables and can generally
    be used to execute a SQL statement represented as a string and thus also the result
    of `insertZipcodes()`.


    The program also overrides the other two methods from the base class: `onUpgrade()`
    and `onDowngrade()`. Both are trivial as all the code has been commented out,
    but the meaning is that you have to insert the code if the version number is increased.
    When you develop a program, you will typically be interested in creating the database
    each time you run.


