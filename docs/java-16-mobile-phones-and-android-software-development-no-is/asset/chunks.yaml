  trans: "\n\n这里最重要的的一点是，基于搜索标准的两个构造函数决定了数据库中的联系人数量。它们的区别在于定义 SQL SELECT 语句的方式。\n\n\
    第一个构造函数查找所有特定邮政编码的联系人，但这次 `Cursor` 对象是使用 `rawQuery()` 方法创建的。它有两个参数，第一个参数是以字符串形式编写的普通\
    \ SELECT 语句。正如你之前看到的，SQL 语句可能包含由 `?` 标示的参数，而 `rawQuery()` 方法的最后一个参数应该是用于替换 `?`\
    \ 占位符的值数组。语句完成后，`Cursor` 以与上面相同的方式使用该对象，但这次创建的是 `Person` 对象。注意它是如何使用 `DbHelper`\
    \ 类中的常量来引用各个列的。\n\n另一个构造函数除了对已打开数据库的引用外，还有四个参数，全部都是字符串。该构造函数必须找到满足以下条件的联系人：名字以某个值开头、姓以某个值开头、地址包含某个值以及头衔包含特定值。这次\
    \ `Cursor` 对象是使用 `query()` 方法创建的，但前四个参数用于定义一个 `WHERE` 部分。实际的 `WHERE` 部分是一个字符串（一个表达式），随后的参数是对应该表达式占位符的字符串数组。除此之外，这两个构造函数的作用似乎完全相同，但请注意，在最后一种，必须通过读取数据库来确定邮政编码。\n\
    \n## 6.3 SQL INSERT, UPDATE 和 DELETE\n\n应用程序有一个名为 `PersonActivity` 的活动，用于显示联系人详情（见上方窗口），同时也用于创建新联系人、编辑现有联系人以及删除联系人。因此，代码同样完整：\n\
    \n![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_133.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_134.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_135.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_136.jpg)\n\
    \n该类定义了几个变量，但为了代码起见，最重要的是前两个，它们分别定义了一个 `Zipcode` 对象和一个 `Person` 对象。其他变量是用户界面的组件，并在\
    \ `onCreate()` 中初始化。当打开相关活动时，会传递一个参数：一个 `Zipcode` 对象（如果你想创建新联系人）或一个 `Person` 对象（如果你想查看或编辑联系人）。`onCreate()`\
    \ 从引用一个 `Zipcode` 对象开始，如果该引用不为空，则它是一个传递过的 `Zipcode` 对象，变量 `zipcode` 被初始化（此时变量\
    \ `person` 仍为 `null`）。接下来，将字段 `txtDate` 赋值为 `date`，因为该字段必须包含联系人最后修改的日期。如果 `obj`\
    \ 为 0，说明传递的参数是一个 `Person` 对象，此时变量 `person` 将用该对象进行初始化。它是要在用户界面中显示的对象，所有字段都用对象的值进行初始化。最后，注意\
    \ `txtDate` 和 `txtZip` 字段是只读的，因为这些字段无法更改。\n\n该类定义了两个事件处理器 `onOk()` 和 `onRem()`，其中第一个在点击\
    \ `OK` 按钮时使用，最后一个在点击 `REMOVE` 按钮时使用。`onOk()` 测试是否输入了名字（假设联系人必须有一个名字）。如果是，则处理器将确定用户界面中输入的其他值，然后创建一个代表数据库的对象。在这里你必须注意语法，因为数据库是以\
    \ `writeable` 模式打开的。接下来，创建一个 `ContentValue` 对象，其中包含要写入数据库的值，无论是因为需要创建新行还是为了更新现有行。再次注意语法，并注意如何使用\
    \ `DbHelper` 类中定义的常量来引用各个列。接下来测试变量 `person`，如果它为 `null`，则执行 `INSERT`，否则应执行 `UPDATE`。基本上，两者的处理方式是一样的：在一种情况下，你使用\
    \ `insert()` 方法；而在第二种情况下，你使用 `update()` 方法，只不过后者需要指定一个 `WHERE` 部分。\n\n最后，有一个用于删除联系人并执行\
    \ SQL `DELETE` 的最后一个事件处理器。它的实现方式与上面完全一样，不同之处在于你必须使用 `delete()` 方法。\n\n## 6.4 其他活动\n\
    \n应用程序还有三个额外的活动。`PersonsActivity` 显示数据库中找到的联系人列表，这是一个带有 `ListView` 的简单活动，点击联系人后会显示\
    \ `PersonActivity`。Java 代码不包含任何关于数据库的内容。`SearchActivity` 也是简单的，用于输入搜索标准，代码执行一个\
    \ SQL `SELECT`，但使用的是 `Persons` 类。最后是 `MainActivity`，它将所有内容整合在一起并填充大量内容。我不想显示这三个活动的代码，因为它们没有包含任何关于数据库的新内容，顺便说，没有任何新东西。\n\
    \n## 练习 7：电话录 (PhoneBook)\n\n在本次练习中，你需要对上述程序进行一些修改，目标是添加一些改进，但为了更多地操作数据库。从创建项目的副本开始。\n\
    \n作为第一个更改，扩展 `addresses` 表以一个额外的列，将其命名为 `text`，其类型为 `VARCHAR(1000)`。其想法是为联系人关联一个简短描述。你必须开始修改\
    \ `DbHelper` 类：\n\n1. 删除类开头的 `rand` 变量\n2. 删除构造函数中的注释行\n3. 删除 `onDowngrade()`\
    \ 方法\n4. 在类中添加一个名为 `ACOL_TEXT` 值为 9 的 `int` 常量\n5. 在 `ATABLE_COLUMNS` 数组中添加字符串\
    \ “text”\n6. 更新 SQL 表达式（`AINITIAL_SCHEMA`）以创建一个名为 `text` 类型为 `varchar(1000)` 的列\n\
    \n接下来，你必须将 `onUpgrade()` 方法改为：\n\n![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_137.jpg)\n\
    \n测试程序。结果应该是 `addresses` 表多了一个新列，但它仍然包含旧的联系人。\n\n然后你必须扩展程序以便能够输入文本，这意味着进入和编辑联系人的窗口必须扩展一个输入字段：\n\
    \n![](img/Image62.jpg)\n\n你可以执行以下操作：\n\n1. 扩展 `Person` 类，添加一个名为 `text` 的额外 `String`\
    \ 属性。有必要扩展两个构造函数以包含该新属性。\n2. 修改 `Persons` 类，使其现在考虑到数据库表有了新列以及 `Person` 类有了新属性。\n\
    3. 扩展 `activity_person.xml` 布局以包含新字段（带标签），该字段应该是一个多行的 `EditText`。\n4. 更新 `PersonActivity`，将新字段的值存储在数据库中。\n\
    \n 测试应用程序以确保文本已保存。记得要测试创建新联系人和编辑现有联系人。\n\n按照目前程序的编写方式，所有文本都是硬编码的，即标签文本、按钮文本、吐司消息和菜单项。用\
    \ `string.xml` 中的常量替换这些文本，同时为 4 个活动标题行定义其他文本，这样你就能知道自己在应用程序的哪个位置。\n\n"
