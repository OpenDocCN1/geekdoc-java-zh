    在 2.1 节中我展示了一个应用程序 `Zipcodes`，你可以在其中搜索丹麦邮政编码。首先创建一个 `Zipcodes` 项目的副本。在 `res` 目录下，你必须创建一个名为
    `raw` 的子目录。书籍源码包含一个 `zipcodes.txt` 文件，该文件以逗号分隔的形式包含了丹麦邮政编码。将此文件复制到新目录 `raw`。在
    `Zipcodes` 类中，所有的邮政编码都定义在一个静态数组中。你现在必须删除这个数组并修改类，使其通过读取你的资源文件 `zipcodes.txt` 内容来创建
    `Zipcode` 对象。你可以执行以下操作：


    1. 删除静态数组

    2. 为类的构造函数添加一个类型为 `InputStream` 的参数

    3. 构造函数必须通过读取参数所代表的流的内容来初始化邮政编码列表


    `MainActivity` 类中必须添加一个改动。在 `onCreate()` 中，你必须创建该资源的引用并将其作为参数传递给 `Zipcodes` 类的构造函数。然后一切应该就能恢复正常运行。


    ## 5.2 普通文件


    你也可以像在 PC 上所了解的那样使用普通文件，不仅如此，这与《Java 5 程序》书中关于 IO 的描述大同小异。主要的区别在于文件可以存储在两个地方：内部存储（与程序一起存储在内部存储空间中）或外部存储（可以存储在外部
    SD 卡上）。我只想展示第一种方案，因为将文件远程保存到 SD 卡在 Android 中是一个安全问题，这也就是为什么 Google 大幅收紧了对外部文件的要求，而且他们可能还没有找到最终的解决方案。实际上可以打开设备以便你轻松地在
    SD 卡上创建文件，但不被建议这样做，所以我只关注内部文件，但从代码角度来看，区别并不大。


    当文件在内部创建时，它们存储在手机内存中，这在语境下被称为内部存储。它有其优缺点，我可以提到：


    * 内部存储是始终存在的，并且是任何 Android 设备的一部分，但其容量有限，明显少于 SD 卡提供的空间，而且存在一个不容忽视的风险：如果应用程序频繁在内部存储中保存文件，它就会满。

    * 基本上，存储在内部存储中的文件与应用程序关联，且只能由该应用程序直接使用。如果文件需要被其他应用程序使用，则需要特殊的努力，事实上，使用内部文件的目的完全不是为了在应用程序之间共享信息。

    * 存储在内部存储中的文件被视为与其关联应用程序的一部分，如果你删除了应用程序，也会删除其内部文件。


    因此，内部文件主要适用于存储较少的数据，这些数据在程序下次启动时必须可用，但在许多示例中也有这种需求，所以结论不是避免使用内部文件，而是要思考它们的用途。


    如前文提到的，内部文件与应用程序关联，应用程序通常对文件有无限的访问权限，因此既可以读取也可以写入该文件——该程序直接拥有该文件。


    当你打开一个文件时，可以指定以下模式：


    * `MODE_PRIVATE`，这是默认模式，只有创建文件的应用程序被允许访问该文件

    * `MODE_APPEND`


    在下文中，我将查看一个展示如何使用文件的示例。


