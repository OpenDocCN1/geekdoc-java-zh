    ## 练习 2：人员 (People)


    你必须编写一个与上述示例类似的程序，用于打开下方的窗口。顶部有两个输入字段，底部有一个 `ListView`。在顶部的两个字段中，你必须能够输入人的名字，当点击
    `OK` 时，名字必须插入到列表视图。在下面的示例中，输入了 4 个名字。


    ![](img/Image1895.jpg)


    你可以按照下面的描述解决此练习：


    1.  在 Android Studio 中创建一个新项目，可以命名为 `People`。

    2.  在 `string.xml` 中创建所有文本。

    3.  编写设计，即从工具箱中拖动所有组件并将其到 `Component Tree`（组件树）中，然后调整 XML 代码，但不要添加事件处理器。

    4.  在模拟器中测试程序，并重复此过程，直到你认为一切看起来都很好。

    5.  添加一个简单的模型类 `Person`，用名和姓来表示一个人。

    6.  在你的 `MainActivity` 中添加一个 `List<Person>`。

    7.  在你的列表和 `ListView` 之间添加一个适配器。注意，适配器在你的列表和组件之间创建了一种形式的数据绑定。

    8.  为 `Clear` 按钮编写事件处理器。

    9.  为 `OK` 按钮编写事件处理器，该处理器（如果同时输入了姓和名）必须创建一个 `Person` 对象并将其添加到你的列表中。


    完成后，程序就应该了。


    # 3 布局 (Layout)


    在本章中，我将更详细地讨论布局，布局当然已经是之前示例的一部分，但本章重点在于关于如何在窗口中放置组件，从而与你在 Swing 中了解的作为布局管理器的知识相匹配。有了这一背景（以及对
    JavaFX 中窗格的了解），处理布局如何工作变得相对简单，之前的示例也展示了这一点。然而，存在一些语法问题，以下内容不是参考手册，我将通过示例展示哪些可以的操作。


    ## 3.1 相对布局 (RelativeLayout)


    作为示例，我将展示第 1 章程序的改进版本，该版本通过华氏度和摄氏度的转换进行了增强：


    ![](img/Image1903.jpg)


    此外，主要区别在于使用了另一个布局管理器，称为 `RelativeLayout`。起点是一个新项目，我将其命名为 `Convert`。创建项目后，Android
    Studio 创建了如下用户界面设计（即 `main_activity.xml`）：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_38.jpg)


    该设计包含一个名为 `ConstraintLayout` 的布局管理器，正如稍后我会提到的，你可能会注意到定义了两个属性 `android:layout_width`
    和 `android:layout_height`，两者的值都是 `match_parent`。这意味着布局应该占据父容器（即屏幕）提供的所有空间，并同时应用于宽度和高度。在这个布局中，Android
    Studio 插入了一个我想删除的 `TextView` 组件。然后我在布局窗口中添加了一个 `RelativeLayout`，并从工具箱中将当前组件拖到布局中，这样几乎所有的组件现在已以正确的层级结构添加到窗口中（在此我更改了单个组件的名称）：


    ![](img/Image1910.jpg)


    结果是所有组件都在窗口的左上角，Android Studio 生成了如下 XML：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_39.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_40.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_41.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_42.jpg)


    在这里你应该特别注意 Android Studio 分别为 `android:layout_width` 和 `android:layout_height`
    分配的值。对于 `RelativeLayout`，它是 `match_parent`，这意味着它占据父容器提供的所有空间，这里是一个填充整个窗口的 `ConstraintLayout`。对于其他组件，到处都使用了
    `wrap_content`，这意味着组件的大小由内容决定，以 `TextView` 为例，它就是组件的内容。


    在我像上面描述的那样不加批判地将组件填充窗口后，我的工作是让它们放置得美观，这就是布局管理器介入的地方，这里是 `RelativeLayout`。正如其名所示，它通过指定属性设置单个组件之间的相对位置，因此我有一个通过添加属性来调整
    XML 代码的过程，直到符合我的要求。在这个过程中，我也为单个组件了命名，使它们比 Android Studio 分配的名称更明确。以下是完成后的 XML：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_421.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_43.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_44.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_45.jpg)


    在接下来的内容，我将简要提到发生了什么。在 `ConstraintLayout` 中，我定义了背景颜色，而在 `RelativeLayout` 中，我定义了
    20 的外边距。无论单个组件放置在哪里，这些都是全局设置，甚至独立于当前的布局管理器。


    对于第一个 `TextView` 组件，我将名称更改为 `lblHead1`，然后在组件下方定义了 10 的外边距。我还更改了文本（显示在屏幕上的文字）并定义了字体大小。


