    As the last example of a service, I will show a program that starts a service
    that updates a database every 20 seconds. The example also includes another program
    (a client) that can read the content of the database and the goal is to show


    1. how an application and a service can write to a database

    2. how another application can read the same database


    However, I will start with a database adapter that is not necessary for the purpose
    of this task, but a very used pattern. In fact, it is nothing but a class that
    encapsulates the class `SQLiteOpenHelper` and the database operations. In this
    case, the database must have only one table that has three columns:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_1841.jpg)


    where the column `time` contains a clock time of the form `YYYY-MM-DD HH:MM:SS`,
    while the last column is just a text. The adapter can then be written as follows:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_1842.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_185.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_186.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_187.jpg)


    In fact, the class is easy enough to understand and contains, among other things,
    what I have previously shown as a `DbHelper` class. In addition, there are the
    database operations and which will depend on the specific database and how it
    will be used. In this case, there are more than the applications uses, just to
    give an impression of which operations you typically want. The most important
    reason for the class is that it makes it easy to use the same database from multiple
    programs.


    The project that creates the database and the service is called `LaunchPosts`,
    and it will thus be the application to which that database is a belongs. The project
    uses two classes, which I have used in previous examples and it are the class
    `King`, which represents a Danish king and the class `Kings`, which is a list
    of `King` objects and has a method that returns a `List<King>`. The service is
    as follows:


    ```

    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_1871.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_188.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_189.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_190.jpg)

    ```


    Please note that it is a normal service, and since `onBind()` is trivial, it is
    not a service that clients can connect to, but a service that starts and runs
    until it’s done, and in this case it’s until `onDestroy()` is performed. `onStartCommand()`
    is simple, but it starts a timer ticking every 20 seconds, and every time it ticks,
    it creates with the last method a greeting from a Danish king, which is sent to
    the method `writePost()`. This method uses the database adapter to update the
    database with the current greeting. Here you should note that the method updates
    the same row every time (the database table has only 1 row) and the reason is
    that the database should not grow beyond all limits. The goal is only to show
    that a service can write to a database.


    Running the `LaunchPosts` application opens the following window:


    ![](image/Image2235.jpg)


    The window has 6 components. The top two are `TextView` components and are updated
    if you click the buttons. If you click on the top button, the program reads the
    database and the fields are updated with the record that is read. The next tests
    where the service is running and updates the top `TextView` component. The Button
    `Start` starts the service, while the last stops the service. The user interface
    is of course simple, but the class `MainActivity` contains some code:


    ```

    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_1911.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_1921.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_1931.jpg)

    ```


    In particular, note the two last methods. Here’s the first the test where the
    servise identified by a `Class` is running. There is not much to explain in addition
    to noting that, but shortly, you use the method `getSystemService()` to determine
    which services are running and the result is an `ActivityManager` object. This
    object has a collection of running services, and you can traverse this collection
    to determine if that service is running. The last method works in the same way,
    but it updates the `TextView` component. The two methods are used from the event
    handlers, and here you should especially note how to indicates the `Class` object.


    The event handlers `onStart()` and `onStop()` in principle do not contain anything
    new besides using the above methods, and the same applies to `onCheck()`. Finally,
    there is the event handler `onRead()`, which reads in the database, and it happens
    with the adapter. Note that the adapter’s get methods returns a `Cursor` object,
    and you could make a nicer wrapper by returning a `King` object or a list of `King`
    objects instead.


    If you look at the class `MainActivity` (and also the class `PostService`), there
    is nothing about that the database should be able to be used from another program.
    Nor should much happen, but only that the other program should use the same database
    adapter and then add an addition to the manifest:


    ```

    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_194.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_195.jpg)

    ```


    Then to the second program, called `ReadPosts`. Firstly, the manifest of this
    program must be updated in the same way as shown above, so it has the same `sharedUserId`.
    The program’s user interface is almost identical to the above, just missing the
    three bottom buttons. Then a copy of the class `DbAdapter` has been added, and
    finally there are `MainActivity`:


    ```

    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_1951.jpg)

    ```


    Here the event handler `onRead()` is the same and all you need to note is that
    `Context` should be used for the database and how to determine this with `context.getResources()`.


    After that, both programs can be installed on the phone and it all should work.
    If you install the programs on a physical device, be sure to stop the service
    after you have tested the programs as it will continue and update the database
    every 20 seconds.

