    首先，注意 `GridLayout` 定义了 5 列。在这里你也可以指定行数，但没有必要，因为行数是从 XML 代码中确定的。第一个组件是 `EditText`，你应该注意它的宽度被设置为
    0。这是因为宽度是由 `weight`（权重）属性和 `graverty` 属性决定的，这些是 `GridLayout` 用于确定组件应该填充多大空间的属性。还要注意，该组件定义了
    5 个 `columnSpan`（列跨），因为机器的显示器应该填充整个窗口宽度。最后，注意该组件有一个 ID，以便在 Java 代码中引用它，但它是布局中唯一一个带有
    ID 的组件。


    其余所有（20 个）组件都是 `Button` 组件，事实上，除了定义了哪些尺寸的属性外，没有什么特别需要注意的。由于任何地方的权重都设为 1，这意味着它们都具有相同的宽度，因为
    `gravirty` 被设置为 `fill_horizontal`。


    Java 代码也比较冗长，因为有 20 个事件处理器，以下仅代码的一部分：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_54.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_55.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_56.jpg)


    该类有两个实例变量，第一个是栈（stack），另一个用于控制在点击数字时，显示内容是否应该存放在栈上。构造函数扩展了两个语句，用于设置显示器为只读，这样你就无法直接输入数字。注意，这意味着不会显示虚拟键盘。


    如果你点击某个数字按钮，将执行 `insert()` 方法。它会测试变量 `newValue`，如果为 `true`，则意味着正在输入一个新数字，该方法尝试将显示内容解析为整数并放入栈中。然后将点击的数字作为显示器的值插入。如果
    `newValue` 为 `false`，除了将点击的数字添加到显示内容外，没有发生其他操作。


    点击带有两个参数的运算符时，事件处理器调用 `clac2()` 方法。它解析显示内容并弹出栈以执行实际计算，之后更新显示。注意 `newValue` 被设置为
    `true`，因为下一次点击按钮时，结果必须添加到栈中。相反，点击仅有一个参数的运算符（对于当前机器它显示为 ! 和 _），会调用 `calc1()` 方法，它会改变显示器的值。


    ### 3.5 ConstraintLayout


    作为最后一个布局管理器，我想提到 `ConstraintLayout`，这是 Android Studio 定义为活动（activity）默认的布局管理器。原则上，它的工作方式有点像
    `RelativeLayout`，但它更灵活，目标是让你仅使用鼠标和 Android Studio 的布局编辑器就能设计复杂的布局。也就是说，你可以从工具箱将组件拖到窗口中，并用鼠标将其拖到想要的位置。这样，你就不需要自己编写
    XML 就能完成最终的设计。


    要定义视图组件的位置，它必须至少有一个水平和一个至少一个垂直 `constraint`（约束），每个约束都是相对于另一个视图或父布局的附加或对齐。因此，每个约束都定义了沿水平或垂直轴的视图位置，但通常每个轴会有更多的约束。


    如果你在布局编辑器中丢入一个视图，它没有约束，而是停留在你丢入的位置。可能有一些属性，例如：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_57.jpg)


    其中最后两个属性告诉你组件在布局编辑器中的位置，但如果你运行程序，你会发现按钮位于左上角，因此这两个属性对最终程序没有影响。


