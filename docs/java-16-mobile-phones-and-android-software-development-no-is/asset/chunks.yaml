    ## 4.1 A context menu


    Menus are frequently used in mobile phone apps, and in this section I will show
    you how to attach a context menu to a control. As example, I will use the program
    `TheKings`, as I have shown above, where I want to attach a context menu for the
    single kings in the `ListView` component. I have started with a copy of the project,
    which I have called `AboutKings`. The user interface is exactly the same, so the
    changes concern only the Java section. Therefore, I do not want to show the XML
    code for the user interface again.


    The class `Kings` contains a static array, where data for Danish kings are defined
    as constants. For each king there are three values, but the array is expanded
    with a fourth value, which is a brief description of the current king. The information
    is obtained from


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_77.jpg)


    but regarding the program, the information is not critical (it’s just a text)
    and the text is not translated into English. Similar to this extension, the class
    `King` is also expanded with an additional attribute that returns that description,
    and the class is expanded by a method `getKing()`, which returns a string that
    is the king’s name and government period.


    Then there’s the class `MainActivity`, which is expanded a lot:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_78.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_79.jpg)


    First, two constants are defined that define two menu items in a context menu.
