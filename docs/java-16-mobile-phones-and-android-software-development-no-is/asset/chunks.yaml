    ### 3.5 A ConstraintLayout


    As the last layout manager, I would like to mention a `ConstraintLayout`, which
    is the layout manager that Android Studio defines as default for an activity.
    In principle, it works a bit like a `RelativeLayout`, but it is more flexible
    and the goal is that you can design a complex layout solely using the mouse and
    in the Android Studio’s layout editor. That is, you can drag widgets to the window
    from the toolbox and drag it into the wanted places with the mouse. You can thus
    create the finished design without having to write XML yourself.


    To define the position of a view component, it must have at least one horizontal
    and at least one vertical `constraint`, each constraint being an attachment or
    alignment to another view or parent layout. Each constraint thus defines a view
    position along either a horizontal or vertical axis, but often there will be more
    constraints for each axis.


    If you drop a view in the layout editor, it has no constraints, but sits where
    it is dropped. There are probably some attributes, and an example could be:


