    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_128.jpg)


    该类有一个实例变量，用于 `Zipcode` 对象。该列表在构造函数中初始化，构造函数的参数是一个打开的数据库。构造函数首先创建一个 `Cursor`，它是一个代表
    SQL SELECT 的对象，并用于遍历结果。在这种情况下，使用 `query()` 方法执行 SELECT 语句，这是一个相当复杂的方法


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_129.jpg)


    该方法为包含在 SELECT 语句中的每个元素提供一个参数，在上面我只为前两个参数设置了值，因为该语句应该检索数据库中的所有邮政编码。你应该注意如何使用 `DbHelper`
    类中的常量来定义表名和列名。语句完成后，你可以使用 `Cursor` 对象遍历行，该对象的基本原理与 `ResultSet` 相同。


