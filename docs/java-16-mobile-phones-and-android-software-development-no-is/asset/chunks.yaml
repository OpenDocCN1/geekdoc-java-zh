    and here is a *ConstraintLayout* that fills the entire window. For the other components,
    *wrap_content* is used everywhere, which means that the component size is determined
    by the content, and if you take a *TextView* as an example, it is the component’s
    text.


    After I, as described above, have uncritically filled the widgets into the window,
    it’s my job to make them sit nicely, and this is where the layout manager enters
    the image, as here is a *RelativeLayout*. As the name says, it sets the individual
    widgets relative to each other by specifying attributes, and so I have a process
    back where I adjust the XML code by adding attributes until it’s all the way I
    want it. It’s also as part of this process that I name the individual widgets
    so they have slightly more pronounced names than what Android Studio has assigned.
    Below is the completed XML:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_421.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_43.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_44.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_45.jpg)


    In the following I will briefly mention what has happened. In the *ConstraintLayout*,
    I have defined a background color, and in the *RelativeLayout* I have defined
    a margin of 20\. It does not matter where the individual widgets are placed, but
    are overall settings that are even independent of the current layout manager.


    For the first *TextView* widget, I changed the name to *lblHead1*, and then I
    have defined a margin of 10 below the component. I have also changed the text
    (the text to be displayed on the screen) and I have defined a font size.'
