    # Java 16: 手机与安卓


    ## 软件开发


    ### Poul Klausen

    Java 16: 手机与安卓：软件开发

    第一版

    © 2018 Poul Klausen & [bookboon.com](http://bookboon.com)

    ISBN 978-87-403-2330-6

    Ove Thomsen, EA Dania 同行评审


    # 前言


    本书是该 `Java` 软件开发系列书籍中的第十六本，同时也是两本专注于开发 `Android` 应用（特别是手机应用）书籍中的第一本。本书要求具备 `Java`
    基础知识以及一般的系统开发知识，目标是让读者在读完本书后，能够为 `Android` 手机编写简单的应用程序。重要的主题包括常用的组件（widgets）、布局以及关于活动（activities）的基础，还会处理文件和数据库的使用。手机编程在许多方面与为普通电脑编程不同，例如，手机是不同于传统计算机的机器，而且手机以及其他
    `Android` 设备（如平板电脑）具有 PC 不具备的功能。然而，这些功能将在下一本书中讨论。


    正如标题所示，这一系列书籍涉及软件开发，目标是教读者如何用 `Java` 开发应用程序。这可以通过阅读相关主题和学习完整的示例程序来掌握，但最重要的是亲自动实践并从零开始编写自己的程序。因此，书籍的重要部分是练习和问题，读者需要在其中编写与书中所讲内容相对应的程序。该系列的所有书籍都围绕同一个骨架构建，由文本、示例、练习和问题组成，这些内容被放置在文本中自然的位置。练习（exercises）与问题（problems）的区别在于，练习很大程度上是重复文中介绍的内容，并且对要做什么描述得相对准确。相比之下，问题的描述较为松散，通常规模稍大一些，且很少有明确的最佳解决方案。这些书应该从头到尾完整读完，但大量的代码示例（包括练习和问题）起着核心作用，让读者详细研究许多示例代码，并解答练习和问题，或者可能只是研究推荐的答案，这一点是非常重要的。


    所有书籍都以一或两个较大的示例程序结束，这些程序主要关注流程以及对程序如何编写的解释。另一方面，代码仅在有限范围内出现——如果出现的话——读者应该在在测试程序时学习完成后的程序代码。除了展示比其他示例更大的程序开发外，结语示例的目的还为了展示不同应用领域的程序示例。


    大多数书籍还以一个附录结束，处理书中未涉及的主题。这可能是关于软件安装问题或其他计算机技术的主题，这些主题不属于软件开发，但在必要时需要介绍性知识。如果读者已经熟悉该主题，可以跳过当前附录。编写编程语言如前所述是
    `Java`，除了书籍外，还使用了以下产品：


    1. `etBeans` 作为应用开发的 IDE

    2. `MySQL`，在需要数据库服务器时使用（从 `Java 6` 书籍开始）

    3. `GlassFish` 作为 Web 服务器和应用服务器（从 `Java 11` 书籍开始）

    4. `Android Studio`，一个用于开发手机 App 的工具


    这些产品都是免费且可免费安装的，甚至提到有些产品的安装可以完全自动完成，不需要费大的努力和挑战。此外，网上有针对这三个产品的详细安装说明。这些产品支持 `Windows`
    和 `Linux`，因此，无论你使用 `Linux` 还是 `Windows` 并没有特殊区别。


    所有示例程序都在运行 `Linux` 的机器上开发和测试。事实上，这并没有主要影响，因为无论平台是哪一个，`Java` 和其他产品的工作方式都完全相同。书中某些地方你会看到平台是
    `Linux`，这主要适用于涉及文件系统的命令。否则，对于读者来说，程序在 `Linux` 机器上开发并没有意义，它们也可以立即在 `Windows` 下运行，除非程序引用了文件系统，在此时可能需要更改文件名。


    最后简单介绍一下这些书**不是**什么的。它们不是 `Java` 的“如何编写”指南或参考手册，而是正如标题所示，是关于软件开发的书籍。我希望读者在阅读这些书籍并通过许多示例时，能够找到如何编写良好程序的灵感，也可以将其作为解决方案集，包含许多你作为软件开发人员经常面对的具体日常编程问题的解决方案示例。


    # 1 引言


    简而言之，本书是关于手机编程的，尽管它在原则上与为普通 PC 编写程序没有太大，但也存在显著的差异。首先，程序是用 `Java` 编写的，所以这方面没有问题，但让编程变得不同的是硬件差异。


    `Android` 被用在手机、平板电脑、智能电视等各种设备上的操作系统，尽管本书的起点是智能手机，但它们在屏幕尺寸和其他选项上也有很大不同。此外，手机市场的发展如此之快，为最新的手机编写程序时，你无法确定它们是否仅被少数手机支持。因此，在编写手机应用时有一系列新因素需要考虑。


    作为开发工具，本书其余部分将使用 `Android Studio`，这是一个 IDE。附录 A 解释了如何下载和安装该产品，以及设置 `Android` 应用开发环境的要求。在接下来假设
    `Android Studio` 已安装，在本节的剩余部分中，我将向你展示如何编写一个简单的应用程序，可以将公里转换为英里，这比 `Hello World`
    稍微复杂一点。我想关注你应该做什么，而不是它是如何运作的，后者我想以后再说。


    我首先打开 `Android Studio`。如果是你第一次打开该程序，你会看到以下窗口：


    ![](img/1793.jpg)


    在这里点击顶部的链接 `Start a new Android project`，结果是下面的窗口，我必须输入项目名称（这里是 `KmMiles`），以及项目在文件系统中的创建位置：


    ![](img/1800.jpg)


    我还输入了公司域名 `Company domain`，这通常是一个网址，该名称会被包含在项目的包名中。点击 Next 后，你会得到一个窗口：


    ![](img/1809.jpg)


    从中选择你要创建的应用类型以及你想支持的操作系统版本。我选择了应用为 `Phone and Tablet`，并且支持 `API 22`（对应 `Android
    5.1`）。你应该注意，`Android Studio` 写道预计我的应用可以在 62.6% 的设备上运行。


    '
- fmt: '

    In the next window, you must select the `activity` for the phone that corresponds
    to the overall layout of the screen and what elements should be on it:


    ![](image/Image1817.jpg)


    In this case, I have chosen `Empty Activity`, which is default. In the next window
    again, select the name for that activity, which becomes a class name, and you
    must also choose the name for the layout. There is no special reasons for choosing
    other names than what Android Studio has done as default, so I keep the names.
    When you click `Next`, you get a window where Android Studio builds the project
    and you then have to click `Finish`.


    Is it the first time you run the program, Android Studio ask you to download more
    files, what you should do, and after Android Studio opening the window with the
    program’s code, you may also need to click on a few download links, but then the
    project has been created and ready and you can start programming.


    ![](image/Image1824.jpg)


    Below is a screenshot of Android Studio after the project has been created:


    ![](image/Image1832.jpg)


    On the left side you have an overview of the project’s files, which I do not want
    to mention further in this place. Otherwise, there are two tabs, where the first
    shows the application layout, while the other shows a Java class that corresponds
    to a main class in a conventional Java application.


    The layout is called `activity_main` and is an XML document that defines the user
    interface. You can work with the document both in design mode where you can place
    components using the mouse, or you can work directly in the XML code. You can
    switch between the two modes by clicking on the bottom tabs `Design` and `Text`.


    The project is actually a complete application that you can build and test. To
    test the program, click the green arrow after `app` in the toolbar. When you do,
    you get the following window:


    ![](image/Image1841.jpg)


    where to choose which device to test the program on. The first time the window
    is empty. There is no device connected, but you can create a virtual device by
    clicking the bottom button. Here you will first get an overview of which virtual
    devices are available. When I created the project, I chose that the application
    has to support `API 22`, and so I must choose a virtual device that does. I have
    chosen `Nexus 4`, and in the next window you will need to download the current
    device. It requires some downloads, but when that happens, you have a virtual
    device as shown in the above window.


    When I then click `OK`, Android Studio will open the emulator (see below). It
    takes a while, because you have to download the emulator itself, and it takes
    a long time to start, but with a little hassle, you get a window that simulates
    a phone and with the current application active. For the time being, the application
    is trivial as it does nothing but write a text in the window. I will now expand
    the program from what Android Studio has auto generated to an application that
    opens an emulator as shown below, that is, an application where you can enter
    a number and then click on the `Convert` button, and depending on which radio
    button are checked, the number entered is interpreted as miles or kilometers and
    the number is converted to a value in the opposite unit. That’s a classic conversion
    program. It is of course a very simple program that consists of


    *   a text field

    *   two radio buttons

    *   and two push buttons


    but it is nevertheless a program that performs a data processing and not just
    shows a text.


    ![](image/Image1848.jpg)![](image/Image1856.jpg)


    To write the program I will start in the design window and drag components from
    the toolbox to the design window’s `Component Tree`:


    ![](image/Image1864.jpg)


    The design originally had a component that showed the text `Hello World`. I’ve
    deleted this component, and then I added


    *   a `LinearLayout`, there is some kind of layout manager

    *   a `EditText` (a `Plain Text`), there is an input field

    *   a `RadioGroup`, which is a container for components

    *   two `RadioButton` components

    *   a `LinearLayout`

    *   two `Button` components


    You should note that the design panel shows how the individual components are
    nested in a hierarchy. Also note that if you select a component with the mouse,
    you get a panel on the right side of the window, where you can specify properties
    for that component.


    If you examine the project files, see `app | res | values`, there is a file called
    `strings.xml`. It is an XML document that defines strings and other resources
    that the application can apply and only one is defined, which is the program’s
    name. I have expanded the file with 5 new definitions, the first 4 being texts
    for radio buttons and other buttons, while the last is for the background color
    of the window:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_17.jpg)


    I will then display the finished XML for the user interface, which is essentially
    autogenerated by the designer window, but where I made some adjustments:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_171.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_18.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_19.jpg)


    When you see the code, you can not of course know that it should be written in
    this way, but you can easily understand the code and the meaning of individual
    lines. You should notice how to create an identifier for a component (widget),
