    The calendar’s other functions are located in the main menu of the program and
    as a context menu for the calendar itself. The function export to XML is not included
    in this mobil phone version. Initially, only the first four buttons in the toolbar
    are implemented, so you can navigate the calendar one month back or forth and
    one year back or forth.


    From the previous version of the program I have copied the two classes `Date`
    and `MainModel`. Both these classes are placed in a sub package called `models`.
    The class `Date` is completely unchanged from the fact that the package name has
    been changed. In principle, this also applies to the class `MainModel`, but something
    here has no meaning yet and is therefore commented out.


    The user interface is defined entirely in XML. It’s extensive (fills a lot), but
    the user interface is simple to design using copy/paste, and in the code is defined
    references to individual components, and the result is a user interface that is
    simple and stable to update. As a result, the class `MainActivity` until this
    place is simple to write.


    When reviewing the code, you should first notice how to create an `ImageButton`
    in XML, which is a button with an image. The individual images are added as resources
    to `res.drawable`. In the Java code, you should notice how to refer to the individual
    widgets using their name and not their ID. You should also note how the event
    handlers are linked to the four buttons in the code.


    ## 9.2 The data access layer


    The program should be able to maintain data regarding notes, appointments and
    anniversaries. In the original PC application, I used object serialization, but
    in the current version I would instead use a SQLite database. The goal of this
    iteration is to clarify the model to persist data. The result is as follows:


    1.  The classes `Note`, `Appointment` and `Anniversery` are copied from the Java
    8 project. These model classes have not been changed.

    2.  The interface `Repository` is copied and it is also unchanged.

    3.  The class `Time` is copied. It is expanded with an additional constructor
    that parses a string on the form `HH:MM` to a `Time` object.

    4.  Similarly, the class `Date` is expanded with a constructor that parses a string
    on the form `YYYY-MM-DD` to a `Date` object.


    The reason for the last two changes is that `SQLite` does not have types for `Date`
    and `Time` columns.


    A package `dal` has been added to the project, and here I have created a `DbHelper`
    class for three tables `notes`, `appointments` and `anniversaries`.


    The class `IORpository` is copied from the original project. The class has the
    same interface (`Repository`), but otherwise the class has been completely modified
    so it now persists data in a SQLite database. The class has not been tested in
    addition to it has an error-free translation, and the test is associated with
    the implementation of the individual calendar functions. One must therefore expect
    that there will be changes to the class during the following three sprints.


    ## 9.3 Notes


    This sprint is about implementing maintenance of notes and in principle includes
    3 features:


    1.  To create and maintain a note (CRUD)

    2.  To show an overview of all notes

    3.  To delete all notes within an interval of two dates


    The two lower functions are selected from the program’s options menu, while the
    first one is selected either from the context menu or from the list of notes.
    The result is that three new activities have been added to the project, but there
    are also significant changes to the class `MainActivity`.


    Since all database operations are implemented in the previous iteration, it should
    be in place and there are no changes to these operations. However, the class `IORepository`
    and thus the interface `Repository` are expanded with a new method used to search
    notes by title.


    The first of the above activities is called `NoteActivity` and is used for CRUD
    operations. It opens from the program’s context menu, or from the activity `NotesActivity`.
    It is a simple activity and can be called with two parameters, which can be a
    `Date` object and is used if the activity is opened from the context menu, and
    it may be a `Note` object and used if opened from `NotesActivity`. In the latter
    case, you will see all the note’s data, you can edit the note (not the date that
    specifies when the note is created) and you can delete it.


    The other activity is called `NotesActivity` and shows an overview of all notes.
    If it has no parameter, it shows all notes, but you can search for a title that
    works like a filter. If the activity is called without parameter, it is from the
    program’s options menu. If a note has been created for a specific day in the calendar,
    the context menu is expanded with an additional menu item called `Show notes`,
    and selecting this menu item opens `NotesActivity` again, but this time with the
    date as parameter, and the window only shows notes for the current day.


    The last activity is called `RemoveActivity` and is very simple. It’s only a matter
    of being able to enter two dates and then call a database operation that deletes
    all notes within that range. The function is performed from the program’s options
    menu. Since it basic is the same function that will be used for appointments and
    anniversaries, the activity has a parameter indicating what the function is to
    be used for.


    Then there is `MainActivity` where there are changes. There are of course changes
    to open the above activities, but the biggest change concerns the context menu.
    First, each date field should be able to open its own context menu, which corresponds
    to that


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18)


    must be performed for all `TextView` widgets that represent a date. In order to
    read the date, one should also be able to determine which `TextView` one has held
    his finger on, and you can not do that immediately. One solution is that when
    you touch a `View` object, an `onTouch()` method is performed, which is an event
    handler defined in the interface `OnTouchListener`. If you associate this event
    with all `TextView` components, you can initialize an instance variable with the
    reference of the last viewed `View`, and when the event handler for the context
    menu is executed, you can determine which `View` relates to the event. It requires
    that you also know its coordinates (row and column), but it can be done by attaching
    a `tag` object to the component.


    Another problem to be solved is that the context menu should be dynamic. In addition
    to the three fixed menu items, there must be an additional menu item for each
    of the three, if a note, appointment or anniversary has been created for that
    date. Finally, there must be an additional menu item if the date is a public holiday.
    For these reasons, the menu is now defined in the code (and the file `context_menu.xml`
    is removed).


    Finally, it should be possible in the user interface to see (with a red color)
    and for a given date if there are extensions to the context menu. It requires
    a change in model (the three static methods previously commented out should be
    activated and changed slightly).


    ## 9.4 Anniversaries


    In the next sprint, I will implement maintenance of anniversaries. In principle,
    they must be done in the same way as maintenance of notes, but it is simpler as
    most challenges are solved, and since the function can be implemented to a large
    extent using copy/paste. Basically, two activities must be added:


    1.  `AnniversaryActivitiy` to CRUD functions

    2.  `AnniversariesActivity` to overview of anniversaries


    Both activities can be implemented by copying the corresponding activities for
    notes. In the same way as for the maintenance of notes, it has been necessary
    to add an additional search method to `IORepository` regarding anniversaries.

