    ## 8.4 ServiceApp3


    This example is exactly the same as the previous example, just showing the solution
    to the above problem. That is, the layout and `MainActivity` (and the manifest)
    are completely unchanged. The solution is, of course, that the service must do
    its work in a second thread, which in principle is quite simple, but there are
