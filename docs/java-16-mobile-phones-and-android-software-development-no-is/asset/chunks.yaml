    A service can also be a foreground service, which is a service associated to something
    that the user is aware of and thus not a candidate for the system to kill when
    low on memory. A foreground service must provide a notification in the status
    bar, which is a notification that cannot be dismissed unless the service is either
    stopped or removed from the foreground. To start a service in the foreground you
    use the method `startForeground()`, that takes two parameters, where the first
    is an `int` that uniquely identifies the notification and the notification for
    the status bar.


    In the simple case, there is no need for any communication between activity and
    service. The service receives an `Intent` object from the activity component,
    and the service then performs its work, but in other contexts there is a need
    for direct communication between an activity and a service, and here you can use
    a receiver. An activity can detect a broadcast receiver for an event and the service
    can send notifications for this event and typically responds that the service
    will signal the activity object that it has completed its work:


    ![](image/Image2185.jpg)


    A broadcast receiver is a class which extends `BroadcastReceiver` and which is
    registered as a receiver in an application other in `AndroidManifest.xml` or in
    code. The receiver will be able to receive intents generated with the method `Context.sendBroadcast()`.
    The class `BroadcastReceiver` defines the method `onReceive()` that the application
    can use to get the received object.


    It was briefly a little about the theory, and in the following I will show what
    exactly to be written to use services, at least the start of simple services and
    the use of local services, but the subject is actually relatively complex, and
    I will return to it in the next book. Among other things, `BroadcastReceiver`
    objects are not featured in this book.


    First, however, I would like to attach a few comments to the class `Intent`.


    ## 8.1 The class Intent


    The class `Intent` has not alone to do with services, and I have already used
    the class many times without mentioning what it is for a class. As the class plays
    a crucial role in services, I will briefly mention it here.


    The class primarily applies to activities, services and broadcast receivers. These
    components are created using messages called intents, which are a form of late
    binding of components, so it always happens in the same way. An `Intent` object
    is a data structure that contains an abstract description of an operation to be
    performed or a description of something that has happened and has to be advertised.
    There are several mechanisms to send intents to different types of components:


    1. An `Intent` object can be passed to `Context.startActivity()` or `Activity.startActivityForResult()`
    to launch an activity or get an existing activity to do something new. It can
    also be passed to `Activity.setResult()` to return information from the activity
    that has been performed with `startActivityForResult()`.


    2. An `Intent` object can be passed to `Context.startService()` to initiate a
    service or deliver new instructions to a running service. Similarly, an intent
    can be passed to `Context.bindService()` to establish a connection between the
    calling activity and a service. It can also be used to initiate the service if
    it’s not already running.


    3. `Intent` objects can be passed to broadcast methods (see the next book) such
    as `Context.sendBroadcast()`, `Context.sendOrderedBroadcast()`, or `Context.sendStickyBroadcast()`
    and are delivered to all interested broadcast receivers.


    Intents are really useful with services to exchange information and notification
    between the calling object and the service. You are encouraged to examine the
    documentation for the `Intent` class.


    ## 8.2 ServiceApp1


    A service is written as a class inheriting the class `Service` or `IntentService`,
    where the last is derived from the first. The goal of an `IntentService` is to
    simplify the start of a service as much as possible. The service carries out requests
    asynchronously in their own thread, and it can take as long as necessary and does
    not block the application. The individual request is added to a queue and executed
    one at a time. An `IntentService` is a background service that is started by an
    activity, and then there is no direct communication between the service and the
    activity. A typical application is the start of an action that takes a long time,
    such as downloading a file.


    The example `ServiceApp1` opens the following window:


    ![](image/Image2192.jpg)


    If you click on the top button, the window gets a random color and clicking on
    the bottom button starts a service that is an `IntentService`. The service is
    written as the following class:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_156.jpg)


    The class should only have a default constructor who performs the base class’
    constructor with the service name as parameter and furthermore it must override
    the method `onHandleIntent()`, which is the method that performs the desired action.
    In this case, the method performs a long (meaningless) action, after which it
    activates a ringtone. With regard to the action, the goal is to show how you with
    an `Intent` can transfer values to a service and that the service is doing something
    for a while, before you because of the sound observes that the service has performed
    its work.


    When an application uses a service, it must be defined in the program’s manifest


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_1561.jpg)


    A detail that is important to remember.


    With regard to the program (`MainActivity`), the goal of the top button is to
    show that the application is not blocked while the service performs its work –
    and also a little to show how to change the background color of the window. When
    you try out the program, note that you can start multiple services and how they
    are queued. The code for `MainActivity` is as follows:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_157.jpg)


    Here the most important is the event handler `onStart()`, that starts a service.
    First, an `Intent` object is created for the service and the service is started
    with the method `startService()`.


    ## 8.3 ServiceApp2


    Often, an `IntentService` does not provide enough options, for example, if you
    want to stop a running service, and you will then have to write a service that
    directly inherits the class `Service`. The program `ServiceApp2` shows how. The
    program’s window is almost identical to the above, just there is a third button:


    ![](image/Image2200.jpg)


    which is used to stop a running service. The service is this time written as:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_159.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_160.jpg)


    A background service (which does not have a user interface) can communicate with
    the environment in two ways, and the one with a simple `Toast`, which is just
    a simple message that appears briefly on the screen. The class inherits this time
    the class `Service` and a service has an `onCreate()` method where you can initialize
    the service. In this case, nothing happens other than the service shows a `Toast`
    that says it was created. There is also a method called `onBind()` and is inserted
    by Android Studio, but it is only used for a bounded service. Then there is the
    last method `onDestroy()` that is performed when the service is stopped, and in
    this case it also shows just a simple `Toast`.


    Finally, there is `onStartCommand()`, which is the method that is performed when
    the service is started, thus when the starting activity performs `startService()`.
    In this case, a loop is running for approximate 30 seconds. For each iteration,
    a `Toast` is performed, after which service is waiting 5 seconds.

