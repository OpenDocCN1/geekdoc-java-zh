    determines a number of contacts in the database. The difference is how they define
    the SQL SELECT statement.


    The first finds all contacts that have a specific zip code, but this time the
    `Cursor` object is created using a method `rawQuery()`. It has two parameters,
    the first being a regular SELECT statement written as a string. In the same way
    as you have seen before, the SQL statement may have parameters as indicated by
    `?` and the last parameter for the method `rawQuery()` should be an array of values
    to be substituted for the `?` placeholders. After the statement is completed,
    the `Cursor` uses the object in the same way as above, but this time, `Person`
    objects are created. Note how the individual columns are referenced with constants
    from the class `DbHelper`.


    The other constructor has in addition to a reference to an open database four
    parameters, all of which are strings. The constructor must find all contacts where
    the first name starts with a certain value, where the last name starts with a
    certain value, where the address contains a certain value and the title contains
    a particular value. The `Cursor` object is created this time using the method
    `query()`, but the first four parameters are used to define a WHERE part. The
    actual WHERE part is a string (an expression), and the following parameter is
    an array of strings to the expression’s placeholders. Otherwise, the two constructors
    seems to work identically, but note that in the last case it is necessary to determine
    the zip code by reading the database.


    ## 6.3 SQL INSERT, UPDATE and DELETE


    The application has an activity called `PersonActivity`, which is used to display
    contact details (see the window above), but also used to create new contacts,
    edit existing contacts, and delete contacts. The code is therefore similarly comprehensive:


    ![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_133.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_134.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_135.jpg)![](image/Java_16_–_Mobil_phones_and_Android_29-6-18_136.jpg)


