  trans: '

    该应用程序还有另一个问题，你在物理设备上安装应用程序之前可能不会发现。问题是 `PersonActivity` 包含太多字段，导致它们被虚拟键盘遮挡。你可以通过将窗口布局放置在
    `ScrollView` 中来解决这个问题。


    # 7 线程


    Android 是一个多线程操作系统，因此你使用线程的方式几乎与你在 PC 上了解的方式完全相同。一旦 Android 应用程序启动，运行时系统就会创建一个主线程（primary
    thread），所有的应用程序组件默认都会在这个线程中运行。主线程的主要任务是处理用户界面，包括处理事件，但该线程当然也可以执行任何其他操作，无论该操作是否是默认。就像你在
    PC 上了解的那样，主线程可以启动子线程（secondary thread），这可能有许多充分的理由，这些理由和你之前学过的一样，但也面临着同样的挑战：如果子线程直接更新用户界面，程序将抛出异常并停止。如果你使用线程，你需要更多的技巧，本章的目的就是展示这些所需的内容。


    我将使用我之前用过的一个示例，这是一个打开以下窗口的应用程序：


    ![](img/Image2170.jpg)


    在两个输入框中，你可以输入两个正整数，点击 `CALCULATE`，程序将确定两个输入数字之间的所有素数，并将它们插入到按钮下的 `ListView` 中。使用素数的想法是因为对于大数，确定一个数字是否为素数需要长时间，如果你输入的数字像上面那样大，结果就是程序会间断地向
    `ListView` 组件添加素数。为了限制内存消耗，输入的两个数字差值不能超过 1000，但你可以根据需要更改。


    输入框下方有三个单选按钮。如果你执行计算并按下了顶部的单选按钮，计算将在主线程执行，这意味着你会发现应用程序没有响应；如果数字足够大，你将收到如下所示的警告，你可以在那里中断程序：


    ![](img/Image2177.jpg)


    如果允许程序执行计算，在找到所有素数后，它将会使用找到的所有数字更新 `ListView` 组件。


    另一方面，如果你在按下中间单选按钮时运行程序，计算将在第二个线程执行，每找到一个素数就会更新一次 `ListView` 组件。由于没有对更新组件做任何特殊处理，结果是程序将抛出异常并停止。另一方面，如果你在按下底部单选按钮时运行程序，一切都按预期运行。程序更新了
    `ListView` 组件且程序保持运行，但这次没有引起问题，因为这是通过一个 `Handler` 对象实现的。


    用户界面由 10 个组件组成，使用 `RelativeLayout` 布局，设计并不包含任何新内容，因此我不想在这里显示 XML 代码，新颖之处在于 `MainActivity`
    类中。完整代码如下：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_143.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_144.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_145.jpg)


    该类以一个 `isPrime()` 方法结束，该方法测试一个数字是否为素数，这是我使用很多次的常用方法。该类定义了至少 10 个实例变量。首先是对用户界面中组件的引用，名称说明了它们的用途。接着是一个用于
    `ListView` 组件内容的 `List<Long>` 及其关联适配器（adapter），最后是两个 `Handler` 类型的变量，我稍后会返回它们。在
    `onCreate()` 中也没有什么新内容，除了最后两个创建两个 `Handler` 变量对象的语句外（下文将解释）。


    程序有两个按钮的事件处理器，第一个是简单而易的，除了删除 `ListView` 组件的内容外什么都不做。另一个是 `CALCULATE` 按钮的事件处理器，即使代码看起来很长，该处理器也足够简单。它必须确定用户界面中输入的两个数字的值并测试它们是否合法。如果不合法，将出现一个带有错误消息的简单
    `Toast`。如果值合法，事件处理器将调用以下方法之一：


    1. `calc1()`

    2. `calc2()`

    3. `calc3()`


    取决于按了哪个单选按钮。如果是顶部单选按钮，则调用 `calc1()` 方法并传入两个数字作为参数，该方法包含一个循环，用当前范围内确定的素数更新 `ListView`
    组件：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_147.jpg)


    由于 `calc1()` 是一个普通方法，它由主线程执行，原则上这已经足够了，但该方法的执行可能需要很长时间（对于大的输入参数），并且在此期间程序不会响应，你可能会收到上方所示的警告。


    如果执行的是 `calc2()`，会发生相同的情况，但这次是在子线程中进行，该线程执行上述循环。一旦找到一个素数，就会调用适配器的 `add()` 方法，由于数据绑定，它将更新用户界面；但由于是从另一个线程发生的，程序将失败并抛出异常。


    这个问题在 `calc3()` 中得到了解决，它使用 `Handler` 对象更新用户界面，该对象是在主线程执行的。在 `MainActivity.java`
    的末尾定义了两个类：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_147.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_148.jpg)


    这两个类都重写了 `handleMessage()` 方法，这是一个由主线程执行的回调方法，类之间的区别在于传递了参数。在第一个类中，`handleMessage()`
    是简单的，因为它只执行一个 `Toast`；但在第二个类中，必须传递参数。这是通过 `Bundle` 对象实现的，在这种情况下它必须是 `Long` 类型，即要添加到
    `ListView` 组件的素数。


    有了这两个 `Handler` 类型后，程序可以在 `onCreate()` 中创建这些类型的实例变量。特别注意参数的类型为 `Message`，并注意引用传递值的语法。

