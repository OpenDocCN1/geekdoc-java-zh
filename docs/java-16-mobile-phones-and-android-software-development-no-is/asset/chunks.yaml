    # 6 SQLite


    你也可以编写使用数据库的手机应用，因为 Android 生带了一个非常简单的数据库 SQLite。该数据库在 Android 设备之外的许多地方也被广泛使用。它是一个简单的数据库（这正是目标），它远没有其他数据库产品（如
    `MySQL`、`Oracle` 等）提供的辅助功能，但它是一个完整的 SQL 数据库，你可以在其中创建本地数据库并执行常规操作——就像你从 `MySQL`
    中了解的那样。在本章中，我将通过一个示例向如何使用 SQLite。


    作为示例，我将编写一个名为 `PhoneBook` 的应用，它对应于手机自带的联系人应用，但并不是作为该应用程序的替代品，而只是为了展示数据库的使用。应用程序的数据必须存储在带有两个表的数据库中：


    ![](img/Image2131.jpg)

