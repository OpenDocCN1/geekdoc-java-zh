    # 2 Widgets


    如果你考虑介绍性示例，它包含了 5 个控件：


    *   一个输入框 – 一个 `EditText` 控件

    *   两个单选按钮 – `RadioButton` 控件

    *   两个按钮 – `Button` 控件


    在 Android 中，这些被称为 `widgets`（控件），但上述内容和你从 Swing 或 JavaFX 中熟悉的是一样的。有许多这样的控件，学习编写
    Android 应用程序的首要任务之一当然是学习哪些控件以及如何使用它们。我不想在书中系统地回顾各种组件，而是通过示例来说明其中的一些，但基本上它们的使用方法与你在
    Java 控件中熟悉的方法相同。这些东西的名称当然不同，还有其他你可以设置的属性，但原理是相同的。Widgets 排列在一个广泛的类层次结构中，其总的基类被称为
    `View`。在这种情况下，知道这个网址是有好处的


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_24.jpg)


    它是 Android 许多功能的基础参考。


    与 Swing 和 JavaFX 一样，最大的挑战是将组件放置在窗口中你恰好希望它们所在的位置，以及如何让窗口在不同的屏幕尺寸下看起来很好，但那是下一章的主题。


    总的来说，Android 拥有与你在 Swing / JavaFX 中熟悉的相同的控件，但可能名称不同。然而，它也有一些在 Java 中没有的新控件，例如，我想展示一个包含两个新控件的应用程序：


    *   一个 `Switch`，它是 `CheckBox` 的替代方案

