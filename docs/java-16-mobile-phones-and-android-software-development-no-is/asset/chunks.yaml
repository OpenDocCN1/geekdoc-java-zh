    在维护笔记、预约和纪念日时，必须更新用户界面，以显示本月内某个日期发生了变化。这种变化是可预测的，且仅适用于通过选项菜单进行的更改。该更改主要包括使用 `startActivityForResult()`
    方法代替 `startActivity()` 来切换活动。


    关于 `AppointmentService` 服务，让该服务一直运行可能并不是理想的，至少如果它是一个演示程序的话。因此，选项菜单中扩展了两个新的菜单项，用于启动和停止此服务。因此，你必须手动启动服务，但随后它应该一直运行到设备启动为止。人们也可以考虑在程序开始时启动服务（像现在这样做的那样），并保留菜单项，从而获得停止服务的机会。


    除此之外，只引入了细微的颜色调整、新图标以及一些更改，以确保你使用正确的虚拟键盘。


    这次迭代的大部分工作都花在了测试，并纠正了一些错误。


    如果你查看最终结果，本应该会有一些不同的地方，例如，应用程序的一些活动（activities）应该替换为对话框（dialogs），但在这里我缺乏基础，所以这必须留到以后再说。然而，最大的问题是程序完全无法工作——至少不是如预期那样。只要手机处于开启状态，原则上一切运行良好，但如果手机进入睡眠状态，这三个服务就无法唤醒应用程序，因此这个想法有点付诸东流了。因此这是下一本书的一个伏笔。


    # 附录 A，安装 Android Studio


    以下是关于如何为 Android 配置开发环境的简要介绍。有多种选择，你可以为 NetBeans 添加插件，从而使用你熟悉的开发工具。然而，大多数人使用 `Eclipse`
    或 `Android Studio`，由于我使用了后者，因此它是如下文评论所示的产。一个 `Android` 开发工具需要两样东西：


    1. 一个常用的 IDE，你可以在其中输入和编辑代码。

    2. 一个模拟器，这是一个在你的 PC 上运行虚拟 Android 机器的程序，例如模拟手机，以便在将编写的程序安装到手机等物理设备之前对其进行测试。


    事实上，这两个产品之间的集成是一个挑战，因为从开发者的角度来看，必须简单且高效且没有大问题。这就是为什么没有多少人使用 NetBeans 作为 Android
    软件开发的平台。


    编写 Android 应用程序你需要两样东西：


    1. `Android SDK`，最好可以被描述为一组库，包含了 Android 应用程序可能需要的所有组件。

    2. `Android Tools`，一组在应用开发中使用的工具，包括模拟器等等。


    当 Android 问世时，最广泛使用的开发环境是 `Eclipse` 结合上述两个产品，从那时起它一直是稳定且高效的开发平台。我在这里提到 `Eclipse`，也是因为该产品出于完全其他的原因而值得了解，因为它通常是开发
    Java 应用程序的有效工具，而且在各方面都是 NetBeans 的替代方案，许多人倾向于使用 `Eclipse` 而不是 NetBeans。关于哪一个产品更好，可能会有——且将会有——长讨论，事实上，它可能是对用户来说最知名且经验最丰富的产品。在这些书中，我处处都使用了
    NetBeans，但知道有名为 `Eclipse` 的东西是好的，你可以轻松地进入一个使用该工具的开发组织，特别是当任务涉及手机或其他移动设备的应用开发时。


    `Android SDK` 和 `Android Tools` 这两个产品来自 Google，Android 开发背后的公司也是它。与这些产品一起，Google
    还开发了一个用于开发 Android 应用程序的 IDE。这已经持续了很长时间，但今天它已经达到了一个非常用户友好且高效的阶段。这就是为什么我处处都使用这个工具，一个
    Google 称为 `Android Studio` 的工具。


    原则上，安装 `Android Studio` 是非常简单的，因为它被封装在一个单一包中，可以立即下载并安装，在 Windows 下非常容易，而 Linux
    则需要稍更多操作。在接下来，我将概述我在 Fedora 机器上配置开发环境所做的工作，实际上编写一份精确的指南并不容易，部分是因为更新和更改在不断添加，部分是因为命令稍微取决于当前的
    Linux 发行版。幸运的是，网上有很多指南，最好的做法是遵循这些说明（如果手册是最近的）。因此，以下主要作为良好指南的参考。


    为了让你在实践中开发 Android 应用程序，你需要安装受硬件加速支持的虚拟化软件，否则模拟器的运行速度会慢得难以忍。你可以在以下地址（分别对应 Fedora
    和 Ubuntu）：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_208.jpg)![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_209.jpg)


    模拟器本身是 32 位软件，如果你有 64 位的机器（无论你是什么），也应该安装一个名为 `ia32-libs` 的特殊库。对于 Fedora，你可以在以下地址查看：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_2091.jpg)


    对于 Ubuntu，以下文档解释了如何操作，以及如何下载和安装 `Android Studio`：


    ![](img/Java_16_–_Mobil_phones_and_Android_29-6-18_2092.jpg)


    该文档也是对 Android 是什么的简要介绍，并展示了如何编写第一个应用程序。


    通过上述参考（或替代方案），配置你的开发环境应该不会遇到大挑战，但请记住，Android 是一个不断变化的动态世界。


