  md: "Here we define three fields, Red, Yellow, and Green, and initialize each of\
    \ them with a call to Value. This is a shortcut for\n\n```\nval Red = Value\n\
    val Yellow = Value\nval Green = Value\n```\n\nEach call to the Value method returns\
    \ a new instance of an inner class, also called Value.\n\nAlternatively, you can\
    \ pass IDs, names, or both to the Value method:\n\n```\nval Red = Value(0, \"\
    Stop\"\nval Yellow = Value(10) // Name \"Yellow\"\nval Green = Value(\"Go\") //\
    \ ID 1\n```\n\nIf not specified, the ID is not more than the previously assigned\
    \ one, starting with zero. The default name is the field name.\n\nYou can now\
    \ refer to the enumeration values as TrafficLightColor.Red, TrafficLightColor.Yellow,\
