  md: '# 11.6 Associativity


    1 + 2 * 3


    the operator is evaluated first. Languages such as Java and C++ have a fixed number
    of operators, and the language standard decrees precedence over which. Scala can
    have arbitrary operators, so it uses a scheme that works for all operators, while
    also giving the familiar precedence order to the standard ones.


    Except for assignment operators, the precedence is determined by the first character
    of the operator.


    Highest precedence: An operator character other than those below


    | * % |

    | + - |

    | ; |

    | < > |

    | = |

    | & |

    | ^ |

    | |


    A character that is not an operator character


    Lowest precedence: Assignment operators


    Characters in the same row yield operators with the same precedence. For example,
    + and -> have the same precedence.


    Postfix operators have lower precedence than infix operators:


    +   - a infixOp b postfixOp


    is the same as


    (a infixOp b) postfixOp


    # 11.6 Associativity


    When you have a sequence of operators of the same precedence, the associativity
    determines whether they are evaluated left-to-right or right-to-left. For example,
    in the expression 17 - 2 - 9, one computes (17 - 2) - 9. The operator is left-associative.'
