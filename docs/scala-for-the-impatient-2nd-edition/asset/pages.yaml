    \ the () => in the call, use the call by name notation: Omit the (), but not\n\
    the =>, in the parameter declaration and in the call to the parameter function:\n\
    \n```\ndef runInThread(block: () => Unit) {\n  new Thread {\n    override def\
    \ run() { block }\n  }.start()\n}\n```\n\nThen the call becomes simply\n\n```\n\
    runInThread { println(\"Hi\"); Thread.sleep(10000); println(\"Bye\") }\n```\n\n\
    This looks pretty nice. Scala programmers can build control abstractions: functions\n\
    that look like language keywords. For example, we can implement a function that\n\
    looks *exactly* as a while statement. Or, we can innovate a bit and define an\
    \ until\nstatement that works like while, but with an inverted condition:\n\n\
    ```\ndef until(condition: () => Boolean)(block: () => Unit) {\n  if (!condition)\
    \ {\n    block\n    until(condition)\n  }\n}\n```\n\nHere is how you use until:\n\
    \n```\nvar x = 10\nuntil (x == 0) {\n  x -= 1\n  println(x)\n}\n```"
