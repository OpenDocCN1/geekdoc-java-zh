  md: 'In this chapter, you will see how to use the “parser combinators” library to
    analyze data with fixed structure. Examples of such data are programs in a programming
    language or data in formats such as HTTP or JSON. Not everyone needs to write
    parsers for these languages, so you may not find this chapter useful for your
    work. If you are familiar with the basic concepts of grammars and parsers, glance
    through the chapter anyway because the Scala parser library is a good example
    of a sophisticated domain-specific language embedded in the Scala language.


    > NOTE: The API documentation for Scala parser combinators is at www.scala-org/api/current/scala-parser-combinators.


    The key points of this chapter are:


    +   * Alternatives, concatenation, options, and repetitions in a grammar turn
    into |, ~, opt, and rep in Scala combinator parsers.

    * With Regex, literal strings and regular expressions match tokens.

    * Use ^ to process parse results.

    * Use pattern matching in a function supplied with ^ to take apart ~ results.

    * Use -> and < to discard tokens that are no longer needed after matching.

    * Use reps combinator handles the common case of repeated items with a separator.'
