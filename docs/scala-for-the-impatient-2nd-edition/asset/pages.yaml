    # 18.1 Generic Classes


    As in Java or C++, classes and traits can have type parameters. In Scala, you
    use square brackets for type parameters, for example:


    ```

    class Pair[T, S](val first: T, val second: S)

    ```


    This defines a class with two type parameters T and S. You use the type parameters
    in the class definition to define the types of variables, method parameters, and
    return values.


    A class with one or more type parameters is generic. If you substitute actual
    types for the type parameters, you get an ordinary class, such as Pair[Int, String].

    Pleasantly, Scala attempts to infer the actual types from the construction


    ```

    val p = new Pair(42, "String") // It''s a Pair[Int, String]

    val2 = new Pair[Any, Any](42, "String")

    ```


    # 18.2 Generic Functions


    Functions and methods can also have type parameters. Here is a simple example:


    ```

    def getMiddle[T](a: Array[T]) = (a.length / 2)

    ```


    As generic classes, you place the type parameter after the name.

    Scala infers the actual types from the arguments in the call.


    ```

    getMiddle(Array("Mary", "had", "a", "little", "lamb")) // getMiddle[String]

    val f = getMiddle[String] // The function, saved in f

    ```


    # 18.3 Bounds for Type Variables


    Sometimes, you need to place restrictions on type variables. Consider a Pair type
    where both components have the same type, like this:


    ```

    class Pair[T](val first: T, val second: T)

    ```'
