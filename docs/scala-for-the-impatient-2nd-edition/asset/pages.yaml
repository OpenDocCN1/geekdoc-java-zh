  md: "# 19.1 Singleton Types\n\nGiven any reference v, you can form the type v.type,\
    \ which has two values: v and null. This sounds like a curious type, but it has\
    \ a couple of useful applications.\n\nFirst, consider a method that returns this\
    \ you can chain method calls:\n\n```\nclass Document {\n  def setTitle(title:\
    \ String) = { ...; this }\n  def setAuthor(author: String) = { ...; this }\n}\n\
    ```\n\nYou can then call\n\n```\narticle.setTitle(\"Whatever Floats Your Boat\"\
    ).setAuthor(\"Cay Horstmann\")\n```\n\nHowever, if you have a subclass, there\
    \ is a problem:\n\n```\nclass Book extends Document {\n  def addChapter(chapter:\
    \ String) = { ...; this }\n}\n```\n\n```\nval book = new Book()\nbook.setTitle(\"\
    Scala for the Impatient\").addChapter(chapter1) // Error\n```\n\nSince the setTitle\
    \ method returns this, Scala infers the return type as Document. Document doesn't\
    \ have an addChapter method.\n\nThe remedy is to declare the return type of setTitle\
    \ as this.type:\n\n```\ndef setTitle(title: String): this.type = { ...; this }\n\
    ```\n\nNow the return type of book.setTitle(\"...\") is book.type, and since book\
    \ has an addChapter method, the chaining works.\n\nYou can use a singleton type\
    \ if you want to define a method that takes an object instance as parameter. You\
    \ might wonder why you would ever want to do that—after all, if there is just\
    \ one instance, the method could simply use it instead of making the caller pass\
    \ it.\n\nHowever, some people like to construct \"fluent interfaces\" that read\
    \ like English, for example:\n\n```\nbook setTitle to \"Scala for the Impatient\"\
