    has a method probablePrime that generates a random prime number with a given number
    of bits:


    ```

    BigInt.probablePrime(100, scala.util.Random)

    ```


    Here, Random is a singleton random generator object, defined in the scala.util
    package. Try this in the REPL; you''ll get a number such as 103944798049120027548650240713.


    # 1.6 The apply Method


    In Scala, it is common to use a syntax that looks like a function call. For example,
    if s is a string, s(i) is the ith character of the string. In C++, you would write
    s(i); in Java, s.charAt(i.) Try it out in the REPL:


    ```

    val s = "Hello"

    s(4) // Yields ''o''

    ```


    You can think of this as an overloaded form of the () operator. It is implemented
    as a method with the same name. For example, in the documentation of the StringOps
    class, you will find a method


    ```

    def apply(n: Int): Char

    ```


    That is, s(4) is a shortcut for


    ```

    s(4)

    ```


    Why not use the [] operator? You can think of a sequence s of element type T as
    a function from 0, 1, ..., n-1 to T that maps i to s(i), the ith element of the
    sequence.


    This argument is even more convincing for maps. As you will see in Chapter 4,
    you look up a map value for a given key as map(key). Conceptually, a map is a
    function from keys to values, and it makes sense to use the function notation.


    > CAUTION: Occasionally, the () notation conflicts with another Scala feature:
    implicit parameters. For example, the expression


    "Bonjour".sorted(3)


    yields an error because the sorted method can optionally be called with an ordering,
    but 3 is not a valid ordering. You can use parentheses:


    ```

    ("Bonjour".sorted)(3)

    ```


    or call apply explicitly:


    ```

    "Bonjour".sorted.apply(3)

    ```


