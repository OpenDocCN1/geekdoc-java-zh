  md: "# 7.1 Packages\n\nPackages in Scala fulfill the same purpose as packages in\
    \ Java or namespaces in C++: to manage names in a large program. For example,\
    \ the name Map can occur in the packages scala.collection.immutable and scala.collection.mutable\
    \ without conflict. To access either name, you can use the fully qualified scala.collection.immutable.Map\
    \ or scala.collection.mutable.Map. Alternatively, use an import statement to provide\
    \ a shorter alias—see Section 7.7, \"Imports,\" on page 85.\n\nTo add items to\
    \ a package, you can include them in package statements, such as:\n\n```\npackage\
    \ com {\n    package horstmann {\n        package impatient {\n            class\
    \ Employee\n        ...}\n    }\n}\n```\n\nThen the class name Employee can be\
    \ accessed anywhere as com.horstmann.impatient.Employee.\n\nUnlike an object or\
    \ a class, a package can be defined in multiple files. The preceding code might\
    \ be in a file Employee.scala, and a file Manager.scala might contain\n\n```\n\
    package com {\n    package horstmann {\n        package impatient {\n        \
    \    class Manager\n        ...}\n    }\n}\n```\n\n> NOTE: There is no enforced\
    \ relationship between the directory of the source and the package. You don't\
    \ have to put Employee.scala and Manager.scala into a com/horstmann/impatient\
    \ directory.\n\nConversely, you can contribute to more than one package in a single\
    \ file. The file Employee.scala may contain"
