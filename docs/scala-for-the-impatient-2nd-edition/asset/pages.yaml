    \ “Abstract Classes,” on page 97 for abstract methods.) For example,\n\n```\n\
    class Person {\n    override def toString = s\"${getClass.getName}[name=$name]\"\
    \n}\n```\n\nThe override modifier can give useful error messages in many of common\
    \ situations, as:\n\n+   * When you miss the name of the method that you are overriding\n\
