  md: "# 18.11 Objects Can't Be Generic\n\nIt is not possible to add type parameters\
    \ to objects. Consider, for example, immutable lists. A list with element T is\
    \ either empty, or it is a node with a head of type T and a tail of List[T]:\n\
    \n```\nabstract class List[+T] {\n  def isEmpty: Boolean\n  def head: T\n  def\
    \ tail: List[T]\n}\n\nclass Node[T](val head: T, val tail: List[T]) extends List[T]\
    \ {\n  def isEmpty = false\n}\n\nclass Empty[T] extends List[T] {\n  def isEmpty\
    \ = true\n  def head = throw new UnsupportedException\n  def tail = throw new\
    \ UnsupportedException\n}\n```\n\n> NOTE: Here use Node and Empty to make the\
    \ discussion easier to follow for Java programmers. If you are experienced with\
    \ Scala lists, just substitute :: and Nil in your mind.\n\nIt seems silly to define\
    \ Empty as a class. It has no state. But you can't simply turn it into an object:\n\
    \n```\nobject Empty[T] extends List[T] // Error\n```\n\nYou can't add a parameterized\
    \ type to an object. In this case, a remedy is to inherit List[Nothing]:\n\n```\n\
    object Empty extends List[Nothing]\n```\n\nRecall from Chapter 8 that the Nothing\
    \ type is a subtype of all types. Thus, we make a one-element list\n\n```\nval\
    \ lst1 = new Node(42, Empty)\n```\n\ntype checking is successful. Due to covariance,\
    \ a List[Nothing] is convertible to List[Int], and the Node[Int] constructor can\
    \ be invoked."
