    > NOTE: The expression

    val p(x1, ..., xn) = e


    is, by definition, exactly the same as

    val result = e match { case p(x1, ..., xH) => (x1, ..., xH)}

    val x1 = result._1

    ...

    valnH = result._nH


    where x1, ..., xH are the free variables in the pattern p.

    This definition holds even when there are no free variables in the pattern. For
    example:

    val 2 = x

    is perfectly legal Scala code, provided x has been defined elsewhere. you apply
    the definition, you get

    val result = x match { case 2 => () }

    followed by no assignments. In other words, it is equivalent to

    if (!(2 == x)) throw new MatchError


    # 14.8 Patterns in Expressions


    You can use patterns with variables in for expressions. For each traversed value,
    the variables are bound. This makes it possible to traverse a map:


    ```

