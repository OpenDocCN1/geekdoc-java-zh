  md: '# Chapter 10


    In this chapter, you will learn how to work with traits. A class extends one or
    more traits in order to take advantage of the services that the traits provide.
    A trait may require implementing classes to support certain features. However,
    unlike Java interfaces, Scala traits can supply state and behavior for these these
    features, which makes them far more useful.


    Key points of this chapter:


    +   * A class can implement any number of traits.

    * Traits can require implementing classes to have certain fields, methods, or
    superclasses.

    * Unlike Java interfaces, a Scala trait can provide implementations of methods
    and fields.

    * When you layer multiple traits, the order matters—the trait whose methods execute
    *first* goes to the back.


    # 10.1 Why No Multiple Inheritance?


    Scala, like Java, does not allow a class to inherit from multiple superclasses.
    At first, this seems like an unfortunate restriction. Why shouldn''t a class extend
    multiple classes? Some programming languages, in particular C++, allow multiple
    inheritance—but at a surprisingly high cost.'
  merge: -1
  pgno: 143
- img_proc: true
  md: "# Chapter 10 ■ Traits\n\nMultiple inheritance works fine when you combine classes\
    \ that have nothing in common. But if these classes have common methods or fields,\
    \ thorny issues come up. Here is a typical example. A teaching assistant is a\
    \ student and also an employee:\n\n```\nclass Student {\n  def id: String = ...\n\
    \  ...\n}\n```\n\n```\nclass Employee {\n  def id: String = ...\n  ...\n}\n```\n\
    \nSuppose we could have\n\n```\nclass TeachingAssistant extends Student, Employee\
    \ { // Not actual Scala code\n...\n}\n```\n\nUnfortunately, this TeachingAssistant\
    \ inherits two methods. What do the fields myTA.id return? The student ID? The\
    \ employee ID? Both? (In C++, you need to redefine the id to clarify what you\
    \ want)\n\nNext, suppose that both Student and Employee extend a common superclass\
    \ Person:\n\n```\nclass Person {\n  var name: String = _\n}\n```\n\n```\nclass\
    \ Student extends Person { ... }\nclass Employee extends Person { ... }\n```\n\
    \nThis leads to the diamond inheritance problem (see Figure 10–1). We only want\
    \ one name field inside a TeachingAssistant, not two. How do the fields get merged?\
    \ In C++, you use \"virtual base classes,\" a complex and brittle feature, to\
    \ address this issue.\n\nJava designers were so afraid of these complexities that\
    \ they took a very restrictive approach. A class can extend only one superclass;\
    \ it can implement any number of interfaces, but interfaces can have only abstract,\
    \ static, or default methods, no fields.\n\nJava default methods are very restricted.\
    \ They can call other interface methods, but they cannot make use of object state.\
    \ It is therefore common in Java to provide both an interface and an abstract\
    \ base class, but that just kicks the can down the road. What if you need to extend\
    \ two of those abstract base classes?"
  merge: -1
