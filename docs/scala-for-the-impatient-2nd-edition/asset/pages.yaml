    \ future at 13:01:29.140\n\nWhen you create a Future, its code is run on thread.\
    \ One could create a new thread for each task, but thread creation is not free.\
    \ It is better to keep some pre-created threads around and use them to execute\
    \ tasks as needed. A data structure that assigns tasks to threads is usually called\
    \ a thread pool. In Java, the Executor interface uses such a data structure. Scala\
    \ uses the ExecutionContext trait introduced.\n\nEach Future must be constructed\
    \ with a reference to an ExecutionContext. The simplest way is to import ExecutionContext.Implicits.global\n\
    \nThen the tasks execute on a global thread pool. This is fine for demos, but\
