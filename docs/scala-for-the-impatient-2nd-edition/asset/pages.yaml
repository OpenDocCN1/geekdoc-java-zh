    and the compound type

    Shape with Serializable

    is a shortcut for

    Shape with Serializable { }


    # 19.7 Infix Types


    An infix type is a type with two parameters, written in “infix” syntax, with the
    type name between the type parameters. For example, you can write

    String Map Int

    instead of

    Map[String, Int]

    The infix notation is common in mathematics. For example, A × B={ (a, b) | a ∈
    A, b ∈ B } is the set of pairs with components of type A and B. In Scala, this
    type is written as (A, B). If you prefer the mathematical notation, you can define

    type x[A, B] = (A, B)

    Then you can write String × Int instead of (String, Int).

    All infix type operators have the same precedence. As with regular operators,
    they are left-associative unless their names end in {. For example,

    String × Int × Int'
