  md: '# 13.15 Parallel Collections


    It is hard to write correct concurrent programs, yet concurrency is often required
    nowadays to keep all processors of a computer busy. Scala offers a particularly
    attractive solution for manipulating large collections. Such tasks often parallelize
    naturally. For example, to compute the sum of all elements, multiple threads can
    concurrently compute the sum of different sections; in the end, these partial
    results are summed up. Of course it is troublesome to schedule these concurrent
    activities—but with Scala, you don''t have to. If coll is a large collection,
    then


    ```

    coll.par.sum

    ```


    computes the sum concurrently. The par method produces a parallel implementation
    of the collection. That implementation parallelizes the collection methods whenever
    possible. For example,


    ```

    coll.par.count(_ % 2 == 0)

    ```


    counts the even numbers in coll evaluating the predicate on subcollections in
    parallel and combining the results.


    You can parallelize a loop by applying .par to the collection over which you want
    to iterate, like this


    ```

    for (i <- (0 until 100000).par) print(s"$i$")

    ```


    Try it out—the numbers are printed in the order they are produced by the threads
    working on the task.


    In a for/yield loop, the results are assembled in order. Try this:


    ```

    (for (i <- (0 until 100000).par) yield i) == (0 until 100000)

    ```


    > CAUTION: If parallel computations mutate shared variables, the result is unpredictable.
    For example, not update a shared counter:


    ```

    var count = 0

    for (c <- coll.par) { if (c % 2 == 0) count += 1 } // Error!

    ```


    The collection returned by the par method belongs to types that extend the ParSeq,
    ParSet, or Map traits. These are not subtypes of Seq, Set, or Map, and you cannot
    pass a parallel collection to a method that expects a sequential collection. You
    can convert a parallel collection back to a sequential one with the seq method.


    ```

    val result = coll.par.filter(_).seq

    ```


    Not all methods can be parallelized. For example, reduceLeft and reduceRight require
    that each operator is applied in sequence. There is an alternate method, reduce,
    that operates on parts of the collection and combines the results. For this'
