  md: "# 12.10 The return Expression\n\nThe technical term for such a function parameter\
    \ is a call-by-name parameter. Unlike a regular (or call-by-value) parameter,\
    \ the parameter expression is not evaluated when the function is called. After\
    \ all, we don't want x == 0 to evaluate to false in the call until. Instead, the\
    \ expression becomes the body of a function with no arguments. That function is\
    \ passed as a parameter.\n\nLook carefully at the until function definition. Note\
    \ that it is curried: It first consumes the function, then the block as a second\
    \ parameter. Without currying, the call would look like this:\n\n```\nuntil(x\
    \ = 0, { ... })\\which wouldn't be as pretty.\n```\n\n# 12.10 The return Expression\n\
    \nIn Scala, you don't use a return statement to return function values. The return\
    \ value of a function is simply the value of the function body.\n\nHowever, you\
    \ can use return to return a value from an anonymous function to an enclosing\
    \ function. This is useful in control abstractions. For example, consider this:\n\
    \n```\ndef indexOf(str: String, ch: Char): Int = {\n  var i = 0\n  until (i ==\
    \ str.length) {\n    if (str(i) == ch) return i\n    i += 1\n  }\n  return -1\n\
    }\n```\n\nHere, the anonymous function { if str(i) == ch) return i; i += 1 } is\
    \ passed to until. When the return expression is executed, the enclosing function\
    \ indexOf terminates and returns the given value.\n\nIf you use return inside\
    \ a named function, you need to specify its return type. For example, in the indexOf\
    \ function above, the compiler was not able to infer that it returns an Int.\n\
    \nThe control flow is achieved with a special exception that is thrown by the\
    \ return expression in the anonymous function, passed out of the until function,\
    \ and caught in the indexOf function.\n\n> CAUTION: If the exception is caught\
    \ in a try block, before it is delivered to the named function, then the value\
    \ will not be returned."
