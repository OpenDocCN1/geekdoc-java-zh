  md: '# 13.2 Mutable and Immutable Collections


    > NOTE: In Java, both ArrayList and LinkedList implement a common List interface,
    making it difficult to write efficient code when random access is preferred, for
    example when searching in a sorted sequence. This was a flawed design decision
    in the original Java collections framework. In a later version, a marker RandomAccess
    was added to deal with this problem.


    Each Scala collection trait or class has a companion object with an apply method
    for constructing an instance of the collection. For example,


    ```

    Iterable(0xFF, 0xFF00, 0xFF000)

    Set(Color.RED, Color.GREEN, Color.BLUE)

    Map(Color.RED -> 0xFF, Color.GREEN -> 0xFF00, Color.BLUE -> 0xFF)

    SortedSet("Hello", "World")

    ```


    This is called the "uniform creation principle."


    There are methods toSeq, setTo, toMap, and well as a generic [C] method, that
    you can use to translate between collection types.


    ```

    val coll = Seq(1, 2, 3, 5, 8, 13)

    val set = coll.toSet

    val buffer = coll.to[ArrayBuffer]

    ```


    > NOTE: You can use the == operator to compare any sequence, set, or map with
    another collection of the same kind. For example, Seq(1, 2, 3) == (1 to 3) yields
