    such as PrintStream.printf(MessageFormat.format, you need to convert any primitive
    types to type. For example,

    val str = MessageFormat.format("The answer to {0} is {1}", "everything", 42.asInstanceOfOf[AnyRef]))


    This is the case for any Object parameter, but I mention it here because it is
