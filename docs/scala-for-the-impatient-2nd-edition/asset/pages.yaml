  md: "+   3. You define methods foo and foo_.\n4. You define a method foo.\n\n> NOTE:\
    \ In Scala, you cannot have a write-only property (that is, a property\nwith a\
    \ setter and no getter).\n\n> TIP: When you see a field in a Scala class, remember\
    \ that it is not the same\nas a field in Java or C++. It is a private field together\
    \ with a getter (for a val\nfield) or a getter and a setter (for a val field).\n\
    \n# 5.4 Object-Private Fields\n\nIn Scala (as well in Java or C++), a method can\
    \ access the private fields of all\nobjects of its class. For example,\n\n```\n\
    class Counter {\n  private var value = 0\n  def increment() { value += 1 }\n\n\
    def isless(other: Counter) = value < other.value\n// Can access private field\
    \ of other object\n}\n```\n\nAccessing other.value is legal because other is also\
    \ a Counter object.\nScala allows an even more severe access restriction with\
    \ the private[this] qualifier:\nprivate[this] var value = 0 // Accessing someObject.value\
    \ is not allowed\n\nNow, the methods of the Counter class can only access the\
    \ value field of the current\nobject, not other objects of type Counter. This\
    \ is sometimes called\nobject-private, and it is common in some OO languages such\
    \ as SmallTalk.\nWith a class-private field, Scala generates private getter and\
    \ setter methods.\nHowever, for an object-private field, no getters and setters\
    \ are generated at all."
