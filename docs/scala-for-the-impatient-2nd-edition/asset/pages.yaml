    ```


    As a special bonus, for a function that has just one parameter, you can omit the
    () around the parameter:


    ```

    valueAtOneQuarter(x => 3 * x)

    ```


    It gets better. If a parameter occurs only once on the right-hand side of the
    =>, you can replace it with an underscore:


    ```

    valueAtOneQuarter(3 * _)

    ```


    This is the ultimate in comfort, and it is pretty easy to read: a function that
    multiplies by 3.


    Keep in mind that these shortcuts only work when the parameter types are known:


    ```

    val fun = 3 * _ // Error: Can''t infer types

    val fun = 3 * (: Double) => OK

    val fun: (: Double) => Double = 3 * _ // OK because we specified the type for
    fun

    ```


    Of course, the last definition is contrived. But it shows what what happens when
    a function is passed to a parameter (which has just such a type).


    > NOTE: Specifying the type of _ is useful for turning methods into functions.
    For example, (: String).length is a function String => Int, and (: String).substring(:Int,
    : Int) is a function (String, Int, Int) => String.


