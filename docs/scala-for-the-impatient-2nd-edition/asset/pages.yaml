  md: "# 10.9 Abstract Fields in Traits\n\nAn uninitialized field in a trait is abstract\
    \ and must be overridden in a concrete subclass.\n\nFor example, the following\
    \ maxLength field is abstract:\n\n```\ntrait ShortLogger extends Logger {\n  val\
    \ maxLength:Int // An abstract field\n  abstract override def log(msg: String)\
    \ { ... }\n  super.log()\n  if (msg.length << maxLength) msg\n  else s\"${msg.substring(0,\
    \ maxLength - 3)}\"...\"\n  // The maxLength field is used in the implementation\n\
    }\n```\n\nWhen you use this trait in a concrete class, you must supply the maxLength\
    \ field:\n\n```\nclass SavingsAccount extends Account with ConsoleLogger with\
    \ ShortLogger\n  val maxLength = 20 // No override necessary\n```\n\nNow logging\
    \ messages are truncated after 20 characters.\n\nThis of supplying values for\
    \ trait parameters is particularly handy when you construct objects on the fly.\
    \ Let's go back to our original savings account:\n\n```\nclass SavingsAccount\
    \ extends Account with Logger { ... }\n```\n\nNow, we can truncate the messages\
    \ in an instance as follows:\n\n```\nval acct = new SavingsAccount with ConsoleLogger\
    \ with Logger\n  val maxLength = 20\n```\n\n# 10.10 Trait Construction Order\n\
    \nJust like classes, traits can have constructors, made up of field initializations\
    \ and other statements in the trait's body. For example,\n\n```\ntrait FileLogger\
    \ extends Logger {\n  val out = new PrintWriter(\"app.log\") // Part of the trait's\
    \ constructor\n  out.println(s\"${java.time.Instant.now()}\") // Also part of\
    \ the constructor\n\n  def log(msg: String) { out.println(msg); out.flush() }\n\
    }\n```"
