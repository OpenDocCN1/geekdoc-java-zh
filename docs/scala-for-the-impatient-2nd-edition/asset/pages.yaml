  md: '# 9.9 Process Control


    Traditionally, programmers use shell scripts to carry out mundane processing tasks,
    such as moving files from one place to another, or combining a set of files. The
    shell language makes it easy to specify subsets of files and pipe the output of
    one program into the input of another. However, as programming languages, most
    languages leave much to be desired.


    Scala was designed to scale from humble scripting tasks to massive programs. The
    `scala.sys.process` package provides utilities to interact with shell programs.
    You can write your shell scripts in Scala, with all the the power that the Scala
    language puts at your disposal.


    Here is a simple example:


    ```

    import scala.sys.process._

    "ls -al " .."

    ```


    As a result, the `ls -al` command is executed, showing all files in the parent
    directory. The result is printed to standard output.


    The `scala.sys.process` package contains an implicit conversion from strings to
    `ProcessBuilder` objects. The `!` method executes the `ProcessBuilder` object.


    The result of the `!` is the exit code of the executed program: `0` if the program
    was successful, or a nonzero failure indicator otherwise.


    If you use `!!` instead of `!`, the output is returned as a string:


    ```

    val result = "ls -al "/!!

    ```


    > NOTE: The `!` and `!!` operators were originally intended to be used as postfix
    operators without the method invocation syntax:


    "ls -al "/ !!


    However, as you will see in Chapter 11, the postfix syntax is being deprecated
    since it can lead to parsing errors.


    You can pipe the output of one program into the input of another, using the `|`
    method:


    ```

    "ls -al "/| "grep u",

    ```


    > NOTE: As you can see, the process library uses the commands of the underlying
    operating system. Here, I use bash commands because bash is available on Linux,
    Mac OS X, and Windows.'
