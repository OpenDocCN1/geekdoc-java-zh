    \nA Seq is an ordered sequence of values, such as an array or list. IndexedSeq\
    \ allows fast random access through an integer index. For example, an ArrayBuffer\
    \ is indexed but a linked list is not.\n\nA Set is an unordered collection of\
    \ values. A SortedSet, elements are always visited in sorted order.\n\nA Map is\
    \ a set of {key, value} pairs. A SortedMap visits the entries as sorted by the\
    \ keys. This Chapter 4 for more information.\n\nThis hierarchy is similar to that\
    \ in Java, with a couple of welcome improvements:\n\n+   1. Maps are a part of\
    \ the hierarchy and not a separate hierarchy.\n\n+   2. IndexedSeq is the supertype\
    \ of arrays but not of lists, allowing you to tell the two apart."
