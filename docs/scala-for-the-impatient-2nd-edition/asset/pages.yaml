  md: '# Chapter 12


    Scala mixes object orientation with functional features. In a functional programming
    language, functions are first-class citizens that can be passed around and manipulated
    just like any other data types. This is very useful whenever you want to pass
    some action detail to an algorithm. In a functional language, you just wrap how
    to be productive into a function that you pass as a parameter. In this chapter,
    you will see how to be productive with functions that use or return functions.


    Highlights of the chapter include:


    +   - Functions are “first-class citizens” in Scala, just like numbers.


    +   - You can create anonymous functions, usually to give them to other functions.


    +   - A function argument specifies behavior that should be executed later.


    +   - Many collection methods take function parameters, applying a function to
    the values of the collection.


    +   - There are syntax shortcuts that allow you to express function parameters
    in a way that is short and easy to read.


    +   - You can create functions that operate on blocks of code and look much like
