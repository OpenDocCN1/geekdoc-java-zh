    \ 5)`\ncould either\n`3 * fraction2Double(Fraction(4, 5))`\nor\n`int2Fraction(3)\
    \ * Fraction(4, 5)`\nThe first conversion wins over the second, since it does\
    \ not require modification of the object to which the `*` method is applied.\n\
    \n> TIP: If you want to find out which implicit conversion the compiler uses,\
    \ compile your program as\n`scalac -Xprint:typer MyProg.scala`nYou will see the\
