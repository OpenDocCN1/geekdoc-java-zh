  md: '# 2.10 Procedures


    Scala has a special notation for a function that returns no value. If the function
    body is enclosed in braces without a preceding = symbol, then the return type
    is Unit. Such a function is called a procedure. A procedure returns no value,
    and you call it for its side effect. For example, the following procedure prints
    a string inside a box, like


    ```

    |Hello|

    ```


    Since the procedure doesn''t return any value, we omit the = symbol.


    ```

    def box(s: String) { // Look carefully: =

    val border = "-"+ (s.length + 2)

    print("$border%n|$s|$border%n")

    }

    ```


    Some people (not we) dislike this syntax for procedures and suggest that you always
    use an explicit return type of Unit:


    ```

    def box(s: String): Unit = {

    }

    ```


    > CAUTION: The concise procedure syntax can be a surprise for Java and C++ programmers.
    It is a common error to accidentally omit the = in a function definition. You
    then get an error message at the point where the function is called: You are told
    that Unit is not acceptable at location.


    # 2.11 Lazy Values L1


    When a val is declared as lazy, its initialization is deferred until it is accessed
    for the first time.


    ```

    lazy val words = scala.io.Source.from("/usr/share/dict/words").mkString

    ```


    (We will discuss file operations in Chapter 9. Now, just take it for granted that
    this reads all characters from a file into a string.)


    If the program never accesses words, the file is never accessed. To verify this,
    try it out in the REPL, but misspell the file name. There will be no error when
    the initialization statement is executed. However, if you access words, you will
    get an error message that the file is not found.'
