  md: '# Foreword to the First Edition


    When I met Cay Horstmann some years ago he told me that Scala needed a better
    introductory book. My own book had come out a little bit earlier, of course I
    had to ask him what he thought was wrong with it. He responded that it was great
    but too long; his students would not have the patience to read through the eight
    hundred pages of Programming in Scala. I conceded that he had a point. And he
    set out to correct the situation by writing Scala for the Impatient.


    I am very happy that his book has finally arrived because it really delivers on
    what the title says. It gives an eminently practical introduction to Scala, explains
    what''s particular about it, how it differs from Java, how to overcome some common
    hurdles to learning it, and how to write good Scala code.


    Scala is a highly expressive and flexible language. It lets library writers use
    highly sophisticated abstractions, that library users can express simply and intuitively.
    Therefore, depending on what code you look at, it might seem very simple or very
    complex.


    A year ago, I tried to provide some clarification by defining a set of levels
    for Scala and its standard library. There were three levels for each application
    programmers and for library designers. The junior levels could be learned quickly
    and would be sufficient to program productively. Intermediate levels would make
    programs more concise and more functional and would make libraries more flexible
    to use. The highest levels were for experts solving specialized tasks. At the
    time I wrote:'
  merge: -1
