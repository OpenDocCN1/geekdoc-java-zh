  md: '# # Chapter 4


    A classic programmer’s saying is, "If you can only have one data structure, make
    it a hash table." Hash tables—or, more generally, maps—are among the most versatile
    data structures. As you will see in this chapter, Scala makes it particularly
    easy to use them.


    Maps are collections of key/value pairs. Scala has a general notion of tuples—aggregates
    of $n$ objects, not necessarily of the same type. A pair is simply a tuple with
    $n = 2$. Tuples are useful whenever you need to aggregate two or more values together,
    and we briefly discuss the syntax at the end of this chapter.


    Highlights of the chapter are:


    +   * Scala has a pleasant syntax for creating, querying, and traversing maps.

    * You need to choose between mutable and immutable maps.

    * By default, you get a hash map, but you can also get a tree map.

    * You can easily convert between Scala and Java maps.

    * Tuples are useful for aggregating values.'
