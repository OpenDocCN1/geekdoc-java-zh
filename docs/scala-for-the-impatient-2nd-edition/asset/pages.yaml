  md: '# 14.5 Matching Arrays, Lists, and Tuples


    **CAUTION:** Matches occur at runtime, and generic types are erased in the Java
    virtual machine. For that reason, you cannot make a type match for a specific
    Map type.


    ```

    case m: Map[String, Int] => ... // Don''t

    ```


    You can match a generic map:


    ```

    case m: Map[_, _] => ... OK

    ```


    However, arrays are not erased. You can match an Array[Int].


    # 14.5 Matching Arrays, Lists, and Tuples


    To match an array against its contents, use Array expressions in the patterns,
    like this:


    ```

    arr match {

    case Array(0) => "0"

    case Array(x, y) => s"$x $y"

    case Array(0, _) => "0 ..."

    case _ => "something else"

    }

    ```


    The first pattern matches the array containing 0. The second pattern matches any
    array with two elements, and it binds the x and y to the elements. The third pattern
    matches any array starting with zero.


    If you want to bind a variable argument match_ to a variable, use the _ notation
    like this:


    ```

    case Array(x, rest _ _) => rest.min

    ```


    You can match lists the same way, with List expressions. Alternately, you can
    use the :: operator:


    ```

    1st match {

    case _ :: Nil => "0"

    case x :: y :: Nil => s"$x $y"

    case _ :: tail => "0 ..."

    case _ => "something else"

    }

    ```


    With tuples, use the tuple notation in the pattern:


    ```

    pair match {

    case (0, _) => "0 ..."

    case (y, 0) => s"$y 0"

    case _ => "neither is 0"

    }

    ```'
