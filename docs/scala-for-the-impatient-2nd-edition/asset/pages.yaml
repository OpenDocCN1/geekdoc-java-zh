  md: "# Chapter 19 ■ Advanced Types\n\nThe type constructor C has now been constrained\
    \ to be a Container, so we know that we can add items to the object that build\
    \ returns. We can no longer use a wildcard for the parameter of C since we need\
    \ to indicate that C[X] is a container for the same X.\n\n> NOTE: The Container\
    \ trait is a simpler version of the builder mechanism that is used in the Scala\
    \ collections library.\n\nThe map method can be implemented in the Iterable trait:\n\
    \n```\ndef map[F](f: (E) => F) : C[F] = {\n  var res = build[F]()\n  var iter\
    \ = iterator()\n  while (iter.hasNext) res += f(iter.next())\n}\n```\n\nIterable\
    \ classes no longer need to supply their own map. Here is the Range class:\n\n\
    ```\nclass Range(val low: Int, val high: Int) extends Iterable[Int, Buffer] {\n\
    \  def iterator() = new Iterator[Int] {\n    private var i = low\n    def hasNext\
    \ = i <= high\n    def next() = { i += 1; i - 1 }\n  }\n\n  def build[F]() = new\
    \ Buffer[F]\n}\n```\n\nNote that a Range is an Iterable: You can iterate over\
    \ its contents. But it is not a Container: You can't add values to it.\n\nA Buffer,\
    \ on the other hand, is both:\n\n```\nclass Buffer[E : ClassTag] extends Iterable[E,\
