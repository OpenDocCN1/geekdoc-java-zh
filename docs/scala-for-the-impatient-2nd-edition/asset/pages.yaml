    \ the groups. These are assigned to the variables num and item.\n\nNote that the\
    \ extractor isn't a companion object but a regular expression object.\n\n# 14.7\
    \ Patterns in Variable Declarations\n\nIn the preceding sections, you have seen\
    \ how patterns can contain variables. You can use these patterns inside variable\
    \ declarations. For example,\n\n```\nval (x, y) = (1, 2)\n```\n\nsimultaneously\
    \ defines x as 1 and y as 2. This is useful for functions that return a pair,\
    \ for example:\n\n```\nval (q, r) = BigInt(10) % 3\n```\n\nThe % method returns\
    \ a pair containing the quotient and the remainder, which are captured in the\
    \ variables q and r.\n\nThe same syntax works for any patterns with variable names.\
    \ For example,\n\n```\nval Array(first, second, rest _) = arr\n```\n\nassigns\
    \ the first and second element of the array to the variables first and second\
    \ to a Seq of the remaining elements.\n\n> CAUTION: The same warning applies as\
    \ in 14.3, \"Variables in Patterns,\" on page 199. The variable names that you\
    \ use in the pattern must start with a lowercase letter. In a declaration val\
    \ Array(E, x) = arr, E is deemed a constant and x a variable that becomes arr(1)\
    \ if arr has length 2 and arr(0) == E."
