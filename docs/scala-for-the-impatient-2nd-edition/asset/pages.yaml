    # 16.1 XML Literals


    In Scala, you can define XML literals, simply by using the XML code:


    ```

    val doc = <html><head><title>Fred''s Memoirs</title></head><body>...</body></html>

    ```


    In this case, doc becomes a value of type scale.xml.Elem, representing an XML
    element.


    An XML literal can also be a sequence of nodes. For example,


    ```

    val items = <li>Fred</li>/<li>Wilma</li>/</li>

    ```


    yields a scale.NodeSeq. We will discuss the Elem and NodeSeq classes in the section.


    > CAUTION: Sometimes, the compiler suspects XML literals when none are intended.
    For example,

    val (x, y) = (1, 2)

    x < y // Error--unclosed XML literal


    In this case, the remedy is to add a space after the <.


    # 16.2 XML Nodes


    The Node is the ancestor of all XML node types. Its two most important subclasses
    are Text and Elem. Figure 16–1 shows the complete hierarchy.


    The Elem class describes an XML element, such as


    ```

    val elem = <a href="http://scala-lang.org">The <elem>Scala</elem> language="a"></a>

    ```


    The label property yields the tag name (here, "a"), and child is the child node
    sequence (two Text nodes and an Elem node in this example).'
