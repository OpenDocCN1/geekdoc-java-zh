  md: "In the annotation constructor, you can provide any subset of Unit, Boolean,\
    \ Byte, Char, Int, Long, Float, Double.\n\n# 15.7 Annotations for Errors and Warnings\n\
    \nIf you mark a feature with the @deprecated annotation, the compiler generates\
    \ a warning whenever the feature is used. The annotation has two optional arguments,\
    \ message and since.\n\n```\n@deprecated(message = \"Use factorial(n: BigInt)\
    \ instead\")\ndef factorial(n: Int): Int = ...\n```\n\nThe @deprecatedName is\
    \ applied to a parameter, and it specifies a former name for the parameter.\n\n\
    ```\ndraw(@deprecatedName('sz') size: Int, Int = NORMAL)\n```\n\nYou can still\
    \ draw(sz = 12) but will get a deprecation warning.\n\n> NOTE: The constructor\
    \ argument is a symbol—a preceded by a single quote. Symbols with the same name\
    \ are guaranteed to be unique. Therefore, comparing symbols is a bit more efficient\
    \ than comparing strings. importantly, there is a semantic distinction: A symbol\
    \ denotes a name of some item in a program.\n\nThe @deprecatedInheritance and\
    \ @deprecatedOverriding annotations generate warnings that inheriting from a class\
    \ or overriding a method is now deprecated.\n\nThe @implicitNotFound and @implicitAmbiguous\
    \ annotations generate meaningful error messages when an implicit value is not\
    \ available or ambiguous. See Chapter 21 for details about implicits.\n\nThe @unchecked\
    \ annotation suppresses a warning that a match is not exhaustive. For example,\
    \ suppose we know that given list is never empty:\n\n```\n(unchecked) match {\n\
    \  case head :: tail => ...\n}\n```\n\nThe compiler won't complain that there\
    \ is no Nil option. Of course, if 1st is Nil, an exception is thrown at runtime.\n\
    \nThe @uncheckedVariance annotation suppresses a variance error message. For example,\
    \ it would make sense for java.util.Comparator to be covariant. If Student is\
    \ a subtype of Person, then a Comparator[Person] can be used when a Comparator[Student]\
    \ is required. However, Java generics have no variance. We can fix this with the\
    \ @uncheckedVariance annotation:"
