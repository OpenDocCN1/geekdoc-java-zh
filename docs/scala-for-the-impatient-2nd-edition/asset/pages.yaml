- img_proc: true
  md: '# xviii Foreword to the First Edition


    I hope this will help newcomers to the language decide in what order to pick subjects
    to learn, and that it will give some advice to teachers and book authors in what
    order to present the material.


    Cay''s book is the first to have systematically applied this idea. Every chapter
    is tagged with a level that tells you how easy or hard it is and whether it''s
    oriented towards library writers or application programmers.


    As you would expect, the first chapters give a fast-paced introduction to the
    basic Scala capabilities. But the book does not stop there. It also covers many
    of the more "senior" concepts and finally progresses to very advanced material
    which is not commonly covered in a language introduction, such as how to write
    parser combinators or make use of delimited continuations. The level tags serve
    as a guideline for what to pick up. And Cay manages admirably to make even the
    most advanced concepts simple to understand.


    I liked the concept of Scala for the Impatient so much that I asked Cay and his
    editor, Greg Doench, whether we could get the first part of the book as a free
    download on the Typesafe web site. They have gracefully agreed to my request,
    and I would like to thank them for that. That way, everybody can quickly access
    what I believe is the best compact introduction to Scala.


    Martin Odersky


    January 2012'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Preface


    The evolution of traditional languages such as Java, C#, and C++ has slowed down
    considerably, and programmers who are eager to use more modern language features
    are looking elsewhere. Scala is an attractive choice; in in fact, I think it is
    by far the most attractive choice for programmers who want to improve their productivity.
    Scala has a concise syntax that is refreshing after the Java boilerplate. It runs
    on the Java virtual machine, providing access to a huge set of libraries and tools.
    And Scala doesn''t target the Java virtual machine. The Scala project emits code,
    enabling you to write both the server-side and client-side parts of a web application
    in a language that isn''t JavaScript. Scala embraces the functional programming
    style without abandoning object orientation, giving you an incremental learning
    path to a new paradigm. The interpreter lets you run quick experiments, which
    makes Scala very enjoyable. But far not least, Scala is statically typed, enabling
    the compiler to find errors, so that you don''t waste time finding them—or later
    in the running program.


    I wrote this for impatient readers who want to start programming in Scala right
    away. I assume you know Java, C#, or C++, and I don''t bore you with explaining
    variables, loops, or classes. I don''t exhaustively list all paradigm over another,
    and I don''t lecture you about the superiority of another and I don''t make you
    suffer through long and contrived examples. Instead, you will get the information
    that you need in compact chunks that you can read and review as needed.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Preface


    Scala is a big language, but you can use it effectively without knowing all of
    its details intimately. Martin Odersky, the creator of Scala, has identified levels
    of expertise for application programmers and library designers—as shown in the
    following table.


    | Application Programmer | Library Designer | Overall Scale Level |

    | --- | --- | --- |

    | Beginning A1 | | Beginning |

    | Intermediate A2 | Junior L1 | Intermediate |

    | Expert A3 | Senior L2 | Advanced |

    | | Expert L3 | Expert |


    For each chapter (and occasionally for individual sections), I indicate the experience
    level required. The chapters progress through levels A1, L1, A2, A3, L3. Even
    if you don''t want to design your own libraries, knowing the tools that Scala
    provides for library designers can make you a more effective library.


    This is the second edition of this book, and I updated it thoroughly for Scala
    2.12. I added coverage of recent Scala features as string interpolation, dynamic
    invocation, implicit classes, and futures, and updated all chapters to reflect
    current Scala usage.


    I hope you enjoy learning Scala with this book. If you find errors or have suggestions
    for improvement, please visit http://horstmann.com/scala and leave a comment.
    On that page, you will also find a link to an archive file containing all code
    examples from the book.


    I am very grateful to Dmitry Kirasanov and Alina Kirasnova who turned my manuscript
    of XML into a beautiful book, allowing me to concentrate on the content without
    fussing with the format. Every author should have it so good!

    nReviewers include Adrian Cumiskey, Mike Davis, Rob Dickens, Steve Haines, Susan
    Potter, Daniel Sobral, Craig Tataryn, David Walend, and William Wheeler. Thanks
    so much for your comments and suggestions!


    Finally, as always, my gratitude goes to my editor, Greg Doench, for encouraging
    me to write this book, and for his insights into the development process.


    Cay Horstmann

    San Francisco, 2016'
  merge: -1
