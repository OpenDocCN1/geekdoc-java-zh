  md: '# 7.7 Imports


    Imports let you use short names instead of long ones. With the clause


    ```

    import java.awt.Color

    ```


    you can write Color in your code instead of java.awt.Color.


    That is the sole purpose of import. If you don''t mind long names, you''ll need
    need them.


    You can import all members of a package as


    ```

    import java.awt._

    ```


    This is the same as the * wildcard in Java. (In Scala, * is a valid character
    for an identifier. You could define a package com.horstmann.*people, but please
    don''t.)


    You can also import members of a class or object.


    ```

    import java.awt._

    c c1 = RED // Color.RED

    c c2 = decode("#ff0000") // Color.decode

    ```


    This is like import static in Java. Java programmers seem to live in fear of this
    variant, but in Scala it is commonly used.


    Once you import a package, you can access its subpackages with shorter names.
    For example:


    ```

    import java.awt._


    h handler(evt:event.ActionEvent) { // java.awt.event.ActionEvent

    ...

    ```


    The event package is a member of java.awt, and the import brings it into scope.


    # 7.8 Imports Can Be Anywhere


    In Scala, an import statement can be anywhere, not just at the top of a file.
    The scope of the import statement extends until the end of the enclosing block.
    For,


    example,


    ```

    class Manager {

    import scala.collection.mutable._

    val subordinates = new ArrayBuffer[Employee]

    ...

    }

    ```'
