    Parser extends RegexParsers, which has an implicit conversion from a Regex to
    a Parser[String]. The regular expression number is converted into such a parser—a
    function that consumes a Reader[Char].


    If the initial characters in the reader match the regular expression, the function
    returns a Success[String]. The result property of the returned object is the matched
    input, and the next property is the reader with the match removed.


    If the initial characters in the reader don''t match the regular expression, the
