  md: "# # Chapter 6\n\nIn this short chapter, you will learn when to use the object\
    \ construct in Scala. Use it when you need a class with a single instance, or\
    \ when you want to find a home for miscellaneous values or functions.\n\nThe key\
    \ points of this chapter are:\n\n+   - Use objects for singletons and utility\
    \ methods.\n- A class can have a companion object with the same name.\n- Objects\
    \ can extend classes or traits.\n- The apply method of an object is usually used\
    \ for constructing new instances of the class.\n- To avoid the main method, use\
    \ an object that extends the App trait.\n- You can implement enumerations by extending\
    \ the Enumeration trait.\n\n# ## 6.1 Singletons\n\nScala has no static methods\
    \ or fields. Instead, you use the object construct. An object defines a single\
    \ instance of a class with the features that you want. For example,\n\n```\n```scala\n\
    object Accounts {\n  private var lastNumber = 0\n  def newUniqueNumber() = { lastNumber\
    \ += 1; lastNumber }\n}\n```\n```"
  merge: -1
