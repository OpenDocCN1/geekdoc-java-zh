  md: "# 15.5.4 Variable Arguments\n\nThe @varargs annotation lets you call a Scala\
    \ variable-argument method from Java. By default, if you supply a method such\
    \ as\n\n```\ndef process(args: String);\n```\n\nthe Scala compiler translates\
    \ the variable argument into a sequence\n\n```\ndef process(args: Seq[String])\n\
