  md: '# 9.3 Reading Tokens and Numbers


    Here is a quick-and-dirty way of reading all whitespace-separated tokens in a
    source:

    val tokens = source.toString.split("\s+")

    To convert a string into a number, use thetoInt or toNumber method. For example,
    if you have a file containing floating-numbers, you can read them all into an
    array

    val numbers = for (w <- tokens) yield w.toDouble

    or

    val numbers = tokens.map(_.toDouble)


    > TIP: Remember—you can always use the java.util.Scanner class to process a file
    that contains a mixture of text and numbers.


    Finally, note that you can read numbers from scala.io.Stdin:

    print("How old are you?")

    val age = Scala.io.readInt()

    // Or use readDouble or readLong


    > CAUTION: These methods assume that the next input line contains a single number,
    without leading or trailing whitespace. Otherwise, a NumberFormatException occurs.


    # 9.4 Reading from URLs and Other Sources


    The Source object has methods to read from sources other than files:

    val source = Source.fromURL("http://horstmann.com", "UTF-8")

    val source = Source.fromString("Hello, World!")

    // Reads from the given string—useful for debugging

    val source = Source.stdin

    // Reads from standard input


    > CAUTION: When you read from a URL, you need to know the character set in advance,
    perhaps from an HTTP header. See www.w3.org/International/O-charset for more information.'
