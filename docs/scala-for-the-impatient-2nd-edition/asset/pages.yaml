  md: "It would make more sense to add utility functions or constants to a package\n\
    to some Utils package. Package objects address this limitation.\n\nEvery package\
    \ can have one package object. You define it in the parent package,\nand it has\
    \ the same name as the child package. For example:\n\n```\npackage com.horstmann.impatient\n\
    \npackage object people {\n    val getDefault = \"John Q. Public\"\n}\n\npackage\
    \ people {\n    class Person {\n        var name = getDefault // A constant from\
    \ the package\n    }\n}\n```\n\nNote that the default value didn't need to be\
    \ qualified because it was in the\nsame package. Elsewhere, it is accessible as\
    \ com.horstmann.impatient.people.defaultName.\n\nBehind the scenes, the package\
    \ object gets compiled into a JVM class with static\nmethods and fields, called\
    \ package.class, inside the package. In our example, that\nwould be a class com.horstmann.impatient.people.package\
    \ with a static field defaultName.\n(In the JVM, you can use package as a class\
    \ name.)\n\nIt is a good idea to use the same naming scheme for source files.\
    \ Put the package\nobject into a file/com/horstmann/impatient/people/package.scala.\
    \ That way, anyone who\nwants to add functions or variables to a package can find\
    \ the package object\neasily.\n\n# 7.6 Package Visibility\n\nIn Java, a class\
    \ member that isn't declared as public, private or protected is visible\nin the\
    \ package containing the class. In Scala, you can achieve the same effect with\n\
    qualifiers. The following method is visible in its own package:\n\n```\npackage\
    \ com.horstmann.impatient.people\n```\n\n```\nclass Person {\n    private[people]\
    \ def description = s\"A person with name $name\"\n}\n```\n\nYou can extend the\
    \ visibility to an enclosing package:\n\n```\nprivate[impatient] def description\
    \ = s\"A person with name $name\"\n```"
