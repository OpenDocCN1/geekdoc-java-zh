    The method combines two parsers. That is, if p and q are functions, then p | q
    is again a function. The combined function consumes a reader, say r. It calls
    p(r). If that returns Success or Error, then that''s the value of p | q. Otherwise,
    the return value is the result of q(r).


    # 20.11 Regex Parsers


    The RegexParsers trait, which we have used in all this point, provides two implicit
    conversions for defining parsers:


