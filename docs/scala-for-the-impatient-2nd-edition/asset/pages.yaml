  md: "> NOTE: It may seem odd throughout this chapter, traits can be much more similar\
    \ to classes than interfaces.\n\nIf you need more than one trait, add the others\
    \ using the with keyword:\n\n```\nclass ConsoleLogger extends Logger with Cloneable\
    \ with Serializable\n```\n\nHere we use the Cloneable and Serializable interfaces\
    \ from the Java library, just for the sake of using the syntax. All Java interfaces\
    \ can be used as Scala traits. As in Java, a Scala class can have only one superclass\
    \ but any number of traits.\n\n> NOTE: It may seem odd that you use the extends\
    \ keyword before the first trait but with before all the others. But that's not\
    \ the way Scala thinks about it. In Scala, Logger with Cloneable with Serializable\
    \ is the entity that the class extends.\n\n# 10.3 Traits with Concrete Implementations\n\
    \nIn Scala, the methods of a trait need not be abstract. For example, we can make\
    \ our ConsoleLogger into a trait:\n\n```\ntrait ConsoleLogger {\n  def log(msg:\
    \ String) { println(msg) }\n}\n```\n\nThe ConsoleLogger provides a method with\
    \ an implementation—in this case, one prints the logging message on the console.\n\
    \nHere is an example of using this trait:\n\n```\nclass SavingsAccount extends\
    \ Account with ConsoleLogger {\n  def withdraw(amount: Double) {\n    if (amount\
    \ > balance) log(\"Insufficient funds\")\n    else balance -= amount\n  }\n}\n\
    ```\n\nNote how the SavingsAccount picks up a concrete implementation from the\
    \ ConsoleLogger trait. In Java, this is also possible by using default methods\
    \ in interfaces. However, as you will see shortly, traits can also have state,\
    \ which would not be possible with a Java interface.\n\nIn Scala (and other programming\
    \ languages that allow this), we say that the ConsoleLogger functionality is \"\
    mixed in\" with the SavingsAccount class."
