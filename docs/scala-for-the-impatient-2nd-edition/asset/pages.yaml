  md: '# 13.6 Operators for Adding or Removing Elements


    When you want to add or remove an element, or a number of elements, the operators
    to use depend on the collection type. Table 13–1 provides a summary.


    Table 13–1 Operators for Adding and Removing Elements


    | Operator | Description | Collection Type |

    | --- | --- | --- |

    | coll(k) (i.e., coll.apply(k)) | The kth sequence element or the map value for
    key k. | Seq, Map |

    | coll += elem elem += coll | A collection of the same type as coll to which elem
    has been appended or prepended. | Seq |

    | coll + elem coll + (e1, e2, ...) | A collection of the same type as coll to
    which the elements have been added. | Set, Map |

    | coll - elem coll - (e1, e2, ...) | A collection of the same type as coll from
    which the elements have been removed. | Set, ArrayBuffer |

    | coll ++ coll2 coll ++ coll | A collection of the same type as coll, containing
    the elements of both collections. | Iterable |

    | coll -- coll2 coll -- coll | A collection of the same type as coll from which
    the elements of coll have been removed. (For sequences, use diff.) | Set, ArrayBuffer
    |

    | elem :: 1st lst2 :: 1st | A list with the element or list prepended to 1st.
    Same as += and ++. | List |

    | list ::= list2 | Same as :: list2. | List |

    | set | set2 set & set2 set &= set2 | Set union, intersection, difference; | is
    the same as +, and &- is the same as --. | Set |

    | coll += elem coll += (e1, e2, ...) coll += coll2 coll -= elem coll -= (e1, e2,
    ...) coll -= coll2 | Modifies coll by adding or removing the given elements. |
    Mutable collections |

    | elem += coll coll2 += coll | Modifies coll by prepending the given element or
    collection. | ArrayBuffer |'
