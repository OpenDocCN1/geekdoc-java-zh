  md: '# 13.5 Sets


    A set is a collection of distinct elements. Trying to add an existing element
    has no effect. For example,


    Set(2, 0, 1) + 1


    is the same as Set(2, 0, 1).


    Unlike lists, sets do not retain the order in which elements are inserted. By
    default, sets are implemented as hash sets in which elements are organized by
    the value of the hashCode method. (In Scala, as in Java, every object has a hashCode
    method.)


    For example, if you iterate over


    Set(1, 2, 3, 4, 5, 6)


    the elements are visited in the order


    5 1 6 2 4


    You may wonder why sets do not retain the element order. It turns out that you
    can find elements much faster if you allow sets to reorder their elements. Finding
    an element in a set is much faster than in an array or list.


    A hash set remembers the order in which elements were inserted. It keeps a linked
    list for this purpose. For example,


    ```

    val weekdays = scala.collection.mutable.LinkedHashSet("Mo", "Tu", "We", "Th",
    "Fr")

    ```


    If you want to iterate over elements in sorted order, use a sorted set:


    ```

    val numbers = scala.collection.mutable.SortedSet(1, 2, 3, 4, 5)

    ```


    A bitSet is an implementation of a set of non-negative integers as a sequence
    of bits. The bit is 1 if i is present in the set. This is an efficient implementation
    as long as the maximum element is not too large. Scala provides both mutable and
    immutable BitSet classes.


    The contains checks whether a set contains a given value. The subsetOf method
    checks whether all elements of a set are contained in another set


    ```

    val digits = Set(1, 7, 2, 9)

    digits contains 0 // false

    Set(1, 2) subset digits // true

    ```


    The union, intersect, and diff methods carry out the usual operations. If you
    prefer, you can write them as |, &, &-. You can also write union as ++ and difference
    as --. For example, if we have the set


    ```

    val primes = Set(2, 3, 5, 7)

    ```


    then digits union primes is Set(1, 2, 3, 5, 7, 9), digits & primes is Set(2, 7),

    digits -- primes is Set(1, 9).'
