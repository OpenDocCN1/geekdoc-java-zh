  md: '# Chapter 11


    This chapter covers in detail implementing your own operators—methods with the
    same syntax as the familiar mathematical operators. Operators are often used to
    build domain-specific languages—minilangUAGES embedded inside Scala. Implicit
    conversions (type conversion functions that are applied automatically) are another
    tool facilitating the creation of domain-specific languages. This chapter also
    discusses the special methods apply, update, and unapply. We end the chapter with
    a discussion of dynamic invocations—method calls that can be intercepted at runtime,
    so that arbitrary actions can occur depending on the method names and arguments.


    The key points of this chapter are:


    +   - Identifiers contain either alphanumeric or operator characters.

    - Unary and binary operators are method calls.

    - Operator precedence depends on the first character, associativity and others.

    - The apply and update methods are called when evaluating expr(args).

    - Extractors extract tuples or sequences of values from an input L

    - Types extending the Dynamic trait can inspect the names of methods and arguments
    at runtime.'
