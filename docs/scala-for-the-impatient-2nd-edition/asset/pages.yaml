  md: "# Chapter 10 Traits\n\n![](img/9468ae1ab6d9bb5b638fb89107936395_156_0.png)\n\
    \n**Figure 10–3** The Superclass of a trait becomes the superclass of any class\
    \ mixing in the trait.\n\nWhat if our class already extends another class? That's\
    \ OK, as long as it's a subclass of the trait's superclass. For example,\n\n```\n\
    class UnhappyException extends Exception with LoggedException\n```\n\nHere UnhappyException\
    \ extends Exception, which already extends Exception. When mixing in the trait,\
    \ its subclass is already present, and there is no need to add it. However, if\
    \ our class extends an unrelated class, then it is not possible to mix in the\
    \ trait. For example, you cannot form the following class:\n\n```\nclass UnhappyFrame\
    \ extends JFrame with LoggedException\n// Unrelated superclasses\n```\n\nIt would\
    \ be impossible to add both JFrame and Exception as superclasses.\n\n# 10.13 Self\
    \ Types\n\nWhen a trait extends a class, there is a guarantee that the superclass\
    \ is in any class mixing in the trait. Scala has an alternate mechanism for guaranteeing\
    \ this: self types.\n\nWhen a trait starts out with\n\n```\nthis: Type =>\n```\n\
    \nthen it can only be mixed into a subclass of the given type.\nLet's use this\
    \ feature for our LoggedException:\n\n```\ntrait LoggedException extends ConsoleLogger\
    \ {\n  this: Exception =>\n  def log(getMessage(): String) {\n  }\n}\n```\n\n\
    Note that the trait does notnot extend the Exception class. Instead, it has a\
    \ self type of Exception. That means it can only be mixed into subclasses of Exception."
