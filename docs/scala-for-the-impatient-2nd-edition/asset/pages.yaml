  md: '# Chapter 17 Futures


    Unfortunately, now combined is a Future[Future[Int]], which isn’t so good. That’s
    what flatMap is for:


    ```

    val combined = f1.flatMap(n1 => f2.map(n2 => n1 + n2)

    ```


    This looks much nicer when you use a for expression instead of chaining flatMap
    and map:


    ```

    val combined = for (n1 <- future1; n2 <- future2) yield n1 + n2

    ```


    This is exactly the same code for expressions are translated to chains of map
    and flatMap.


    You can also apply guards in the for expression:


    ```

    val combined =

    for (int n1 <- future1; n2 <- future2 if n1 != n2) yield n1 + n2

    ```


    If the future fails, the computation fails with a NoSuchElementException.


    What something goes wrong? The map and flatMap implementations take care of all.
    As soon as one of the tasks fails, the entire pipeline fails, and the exception
    is captured. In contrast, when you manually combine callbacks, you have to deal
    with failure at every step.


    > NOTE: If you find the for/yield construct unnatural, check out the Scala Async
    library at http://github.com/scala/async. It uses Scala Macros to let you express
    the flow more naturally as


    ```

    val combined = async { await(future1) + await(future2) }

    ```


    So you have seen how to run two tasks concurrently. Sometimes, a Future starts
    execution immediately when it is created. To delay the creation, use functions.


    ```

    def future1 = Future { getData() }

    def future2 = Future { getData() } // def, not val

    val combined = for (n1 <- future1; n2 <- future2) yield n1 + n2

    ```


    Now Future is only evaluated when future has completed.


    It doesn''t matter whether you use val or def for future. If you use def, creation
    is slightly delayed to the start of the expression.


    This is particularly useful if the second stage depends on the output of the first:


    ```

    def future1 = Future { getData() }

    def future2(arg: Int) = Future { getData(arg) }

    val combined = for (n1 <- future1; n2 <- future2(n1)) yield n1 + n2

    ```'
