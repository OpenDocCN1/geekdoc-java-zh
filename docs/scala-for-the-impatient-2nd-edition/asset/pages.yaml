    for ((k, v) <- System.getProperties())

    println("$k -> $v")

    ```


    For each (key, value) pair in the map, k is bound to the key and v to the value.

    In for expression, match failures are silently ignored. For example, the following
    loop prints all keys with empty value, skipping over all others:


    You can also use a guard. Note that the if goes after the <- symbol:


    ```

    for ((k, v)) <- System.getProperties() if v == ""

    println(k)

    ```'
