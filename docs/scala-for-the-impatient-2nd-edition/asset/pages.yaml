  md: 'Note that try/catch and try/finally have complementary goals. The try/catch
    statement handles exceptions, and the try/finally statement takes some action
    (usually cleanup) when an exception is not handled. You can combine them into
    a single try/catch/finally statement:


    ```

    try { ... } catch { ... } finally { ... }

    ```


    This is the same as


    ```

    try { try { ... } catch { ... } } finally { ... }

    ```


    However, that combination is rarely useful.


