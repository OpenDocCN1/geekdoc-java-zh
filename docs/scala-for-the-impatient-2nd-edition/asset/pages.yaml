  md: '> NOTE: We defined the method as final because it is generally very difficult
    to correctly extend equality in a subclass. The problem is symmetry. You want
    a.equals(b) to have the same result as b.equals(a), even when b belongs to a subclass.


    > CAUTION: Be sure to define the equals method with parameter type Any. The following
    would be wrong:


    ```

    final def equals(other: Item) = { ... } // Don''t!

    ```


    This is a different method which does not override the equals method of AnyRef.
    Also, don''t supply == method. You cannot override the = method defined in AnyRef,
    but you could accidentally supply a different one with an Item argument:


    ```

    final def equals=(other: Item) = { ... } // Don''t!

    ```


    When you define equals, remember to define hashCode as well. The hash code should
    be computed only from the fields that you use in the equality check, so that equal
    objects have the same hash code. In the Item example, compare the hash codes of
    the fields.


    ```

    final override def hashCode = (description, price).##

    ```


    The ## method is a null-safe version of the hashCode that yields 0 instead of
    throwing an exception.


    > TIP: You are not compelled to override equals and hashCode. For many classes,
    it is appropriate to consider distinct objects unequal. For example, if you have
    two distinct input streams or radio buttons, you will never consider them equal.


    In an application program, you don''t generally call eq or equals. Simply use
    the == operator. For reference types, it calls equals after doing the appropriate
    check for null operands.


    # 8.13 Value Classes


    Some classes have a single field, such as the wrapper classes for primitive types,
    and the "rich" or "ops" wrappers that Scala use to add methods to existing types.
    It is inefficient to allocate new object that holds just one value. Value classes
    allow you to define classes that are "inline," so that the single field is used
    directly.'
