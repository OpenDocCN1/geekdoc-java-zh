  md: '# 21.6 Implicit Conversions with Implicit Parameters


    An implicit function parameter is also usable as an implicit conversion. To understand
    the significance, consider first this simple generic function:


    ```

    def smaller[T](a: T, b: T) = if (a < b) else b // Not quite

    ```


    That doesn''t work. The compiler won''t accept the function because it doesn''t
    know that a and b belong to a type with a <operator.


    We can supply a conversion function for purpose:


    ```

    def smaller[T](a: T, b: T)(implicit order: T => Ordered[T])

    if (order(a) < b) else b

    ```


    Since the Ordered[T] trait has a < operator, this version is correct.

    As it happens, this is such a common situation that the Predef object defines-it
    values of type T => Ordered[T] for a large number of types, including all types
    that already implement Ordered[T] or Comparable[T]. Therefore, you can call


    ```

    smaller(40, 2)

    ```


    and


    ```

    smaller("Hello", "World")

    ```


    If you want to call


    ```

    smaller(Fraction(1, 7), Fraction(2, 9))

    ```


    then you need to define a function function Fraction => Ordered[Fraction] and
    either supply it in the call or make it available as an implicit val. I leave
    this as an exercise because it moves us too far from the point that I want to
    make in this section.


    Here, finally, to Look again


    ```

    def smaller[T](a: T, b: T)(implicit order: T => Ordered[T])

    ```


    Note that order is a function that is tagged implicit and is in scope. Therefore,
    it is an implicit conversion, in addition to being an implicit parameter. So,
    we can omit the call to the body of the function:


    ```

    def smaller[T](a: T, b: T)(implicit order: T => Ordered[T])

    if (a < b) else b // Calls(order) < b if a doesn''t have a <operator

    ```


    # 21.7 Context Bounds


    A type parameter can have a context bound of the form T : M, where M is another
    generic type. It requires that there is an implicit value of type M[T] in scope.


    For example,


    ```

    class Pair[T : Ordering]

    ```'
