  md: 'The linearization gives the order in which super is resolved in a trait. For
    example, calling super in a ShortLogger invokes the FileLogger method, and calling
    super in a FileLogger invokes the Logger method.


    # 10.11 Initializing Trait Fields


    Traits cannot have constructor parameters. Every trait has a single parameter
    constructor.


    > NOTE: Interestingly, the absence of constructor parameters is the only technical
    difference between traits and classes. Otherwise, traits can have all the features
    of classes, such as concrete and abstract fields and superclasses.


    This limitation can be a problem for traits that need some customization to be
    useful. Consider a file logger. We would like to specify the log file, but we
    can''t use a constructor parameter:


    ```

    val acct = new SavingsAccount with FileLogger("myapp.log")n// Error: can''t have
    constructor parameters for traits

    ```


    You saw one possible approach in the preceding section. The FileLogger can have
    an abstract field for the file name.


    ```

    trait FileLogger extends Logger {

    val filename: String

    val out = new PrintWriter(filename)

    def log(msg: String) {out.println(msg); out.flush()}

    }

    ```


    A class like this can override the filename field. Unfortunately, there is a pitfall.
    The straightforward approach does not work:


    ```

    val acct = new SavingsAccount with FileLogger {

    val filename = "myapp.log" // Does not work

    }

    ```


    The problem is the constructor order. The FileLogger constructor runs before the
    subclass constructor. Here, the subclass is a bit hard to see. The new statement
    constructs an instance of an anonymous class extending SavingsAccount (the subclass)
    with the FileLogger trait. The initialization of filename only happens in the
    anonymous subclass. Actually, it doesn''t happen at all—before the subclass gets
    its turn, a null pointer exception is thrown in the FileLogger constructor.


    One remedy is an obscure feature that we described in Chapter 8: early definition.
    Here is the correct version:'
