    \ Person\nCompiled from \"Person.scala\"\npublic class Person extends java.lang.Object\
    \ implements scala.ScalaObject{\n    private int age;\n    public int age(); public\
    \ void age_seq(int);\n    public Person();\n}\n```\n\nAs you can see, the compiler\
    \ created methods age and age_seq. (The symbol\nis translated to seq because the\
    \ JVM does not allow an = in a method name.)\n\nTIP: You can run the javap command\
    \ inside the REPL as\n: javap -private Person\n\nAt any time, you can redefine\
    \ the getter and setter methods. For example,\nclass Person {\nprivate var privateAge\
    \ = 0 // Make private and rename\n\n```\ndef age = privateAge\ndef age_(newValue:\
    \ Int) {\n    if (newValue > privateAge) privateAge = newValue; // Can't get younger\n\
    }\n```\n\nThe user of your class still accesses fred.age, but now Fred can't get\
    \ younger:\n\n```\nval fred = new Person\nfred.age = 30\nfred.age = 21\nprintln(fred.age)\
    \ // 30\n```\n\n> Bertrand Meyer, the inventor of the influential Eiffel language,\n\
    formulated the Uniform Access Principle that states: \"All services offered by\n\
    a module should be available through a uniform notation, which does not\nbetray\
    \ whether they are implemented through storage or through computation.\nIn Scala,\
    \ the much of fred.age doesn't know whether age is implemented\nthrough a field\
    \ or a method. (Of course, in the JVM, the service is always\nimplemented through\
    \ a method, either synthesized or programmer-supplied.)"
