  md: '# 20.12 Token-Based Parsers


    Token-based parsers use a Reader[Token] instead of a Reader[Char]. The Token type
    is defined in the trait scala.util.parsing.combinator.token.Tokens. The StdTokens
    subtract four types of tokens that one commonly finds when parsing a programming
    language:


    +   - Identifier

    - Keyword

    - NumericLit

    - StringLit


    The StandardTokenParsers class provides a parser that produces these tokens. Identifiers
    can consist of letters, digits, or _ but do not start with a digit.


    > CAUTION: the rules for letters and digits are subtly different from those in
    Java or Scala. Dig in script are supported, but letters in the "supplementary"
    range (above U+FFFF) are excluded.


    Numeric literals are sequences of digits. String literals are enclosed in "..."
    or ''...'', with no escapes. Comments, enclosed in /* ... / or from // to the
    end of the line, are considered whitespace.


    When you extend this parser, add any reserved words and tokens to the lexical.reserved
    and lexical.delimiters sets:


    ```

    class MyLanguageParser extends StandardTokenParsers {

    lexical.reserved += ("auto", "break", "case", "char", "const", ...)

    lexical.delimiters += ("=", ":", "<", ">", "=\, "!", ...)

    }

    ```


    When a reserved word is encountered, it becomes a Keyword, not an Identifier.

    The parser sorts the delimiters according to the "maximum munch" rule. For example,
    when the input includes <, you will get it as a single token, not as a sequence
    of tokens < -.


    The indent function parser extends numericLit and stringLit literals.

    For example, here is our arithmetic grammar, using StandardTokenParsers:


    ```

    class ExprParser extends StandardTokenParsers {

    lexical.delimiters += ("+"

    ```'
