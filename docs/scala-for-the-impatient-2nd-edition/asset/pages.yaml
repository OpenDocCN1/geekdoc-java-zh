  md: "A class has the following properties:\n\n+   1. The class extends AnyVal.\n\
    2. Its primary constructor has exactly one parameter, which is a val, and no body.\n\
    3. The class has no other fields or constructors.\n4. The automatically provided\
    \ equals and hashCode methods compare and hash the underlying value.\n\nAs an\
    \ example, let us define a value class that wraps a “military time” value:\n\n\
    ```\nclass MillTime(val time: Int) extends AnyVal {\n  def minutes = time % 100\n\
    \  def hours = time / 100\n  override def toString = f\"$time%04d\"\n}\n```\n\n\
    When you create a new MillTime(1230), the compiler doesn’t allocate a new object.\
    \ Instead, it uses the underlying value, the integer 1230. You can invoke the\
    \ minutes and hours methods on the value, but just as importantly, you cannot\
    \ invoke Int methods.\n\n```\nMillTime lunch = new MillTime(1230)\nprintln(lunch.hours)\
    \ // OK\nprintln(lunch + 2) // Error\n```\n\nTo guarantee proper initialization,\
    \ the primary constructor private and provide a factory method in the companion\
    \ object:\n\n```\nclass MillTime(val time: Int) extends AnyVal ...\nobject MillTime:\n\
