    # 7.9 Renaming and Hiding Members


    If you want to import more than one member from a package, use a selector like
    this:


    ```

    import java.awt.(Color, Font)

    The selector syntax lets you rename members:

    import java.util.(HashMap => JavaHashMap)

    import scala.collection.mutable._

    ```


    Now JavaHashMap is a java.util.HashMap and plain HashMap is a scala.collection.mutable.HashMap.


    The selector HashMap => hides a member instead of renaming it. This is only useful
    if you import others:


    ```

    import java.util.(HashMap => _, _)

    import scala.collection.mutable._

    ```


    Now JavaHashMap unambiguously refers to scala.collection.mutable.HashMap since
    java.util.HashMap is hidden.


    # 7.10 Implicit Imports


    Every Scala program implicitly starts with


    ```

    import java.lang._

    import scala._

    import Predef._

    ```


    As Java programs, java.lang is always imported. Next, the scala package is imported,
    but in a special way. Unlike all other imports, this one is allowed to override
    the preceding import. For example, scala.StringBuilder overrides java.lang.StringBuilder
    instead of conflicting with it.


    Finally, the Predef object is imported. It contains commonly used types, implicit
    conversions, and utility methods. (The methods could equally well have'
