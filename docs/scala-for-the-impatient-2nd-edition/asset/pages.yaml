    # 13.12 Streams


    In the preceding sections, you saw that an iterator is a “lazy” alternative to
    a collection. You get the elements as you need them. If you don''t need any more
    elements, you don''t pay for the expense of computing the remaining ones.


    However, iterators are fragile. Each call to next mutate the iterator. Streams
    offer an immutable list in which the tail is computed lazily—that is, only when
    you ask for it.


    Here is a typical example:


    ```

    def numsFrom(n: BigInt) = n #: numsFrom(n + 1)

    ```


    The #: operator is like the :: operator for lists, but which constructs a stream.


    When you call


    ```

    val tenMore = numsFrom(10)

    ```


    you get a stream object that is displayed


    ```

    Stream(10, ?)

    ```


    The tail is unevaluated. If you call


    ```

    tenMore.tail.tail.tail

    ```


    you get


    ```

    Stream(13, ?)

    ```


    Stream methods are executed lazily. For example,


    ```

    val squares = numsFrom(1).map(x => x * x)

    ```


    yields


    ```

    Stream(1, ?)

    ```


    You have to call squares.tail to force evaluation of the next entry.


    If you want to get more than one element, you can invoke take followed by force,
    which forces evaluation of all values. For example,


    ```

    squares.take(5).force

    ```


    produces Stream(1, 4, 9, 16, 25).'
