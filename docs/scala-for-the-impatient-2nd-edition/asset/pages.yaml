    \ but not everywhere.\n\n> CAUTION: A type projection such as Network#Member is\
    \ not considered a “path,\nand you cannot import it. We discuss paths in the next\
    \ section.\n\n# 19.3 Paths\n\nConsider a type such as\n\n```\ncom.horstmann.impatient.chatter.Member\n\
    ```\n\nor, if we nest Member inside the companion object,\n\n```\ncom.horstmann.impatient.Network.Member\n\
    ```\n\nSuch an expression is called a path.\n\nEach component of the path before\
    \ the final type must be “stable,” that is, it must\nspecify a single, definite\
    \ scope. Each such component is one of the following:\n\n+   * A package\n* An\
    \ object\n* A val\n* this, super, super[S], C.this, C.super, or C.super[S]\n\n\
    A path component cannot be a class as you have seen, a nested class isn’t\na single\
    \ type, but it gives rise to a separate type for each instance.\nMoreover, a path\
    \ element can be a var. For example,\n\n```\nvar chatter = new Network\n..\nval\
    \ fred = new chatter.Member // Error—chatter is not stable\n```\n\nSince you might\
    \ assign a different value to chatter, the compiler can’t assign a\ndefinite meaning\
