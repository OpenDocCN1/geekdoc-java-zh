  md: "# Chapter 17 ■ Futures\n\nYou get a future that, when it completes successfully,\
    \ yields Some(r), where r is the result of one of the given futures that fulfills\
    \ the predicate. Failed futures are ignored. If all futures complete but none\
    \ yields a result that matches the predicate, then returns None.\n\n> CAUTION:\
    \ A potential problem with firstCompletedOf is find that the other computations\
    \ keep going even when the result has been determined. Scala futures do not have\
    \ a mechanism for cancellation. If you want to stop unnecessary work, you have\
    \ to provide your own mechanism.\n\nFinally, the Future object provides convenience\
    \ methods for generating simple futures:\n\n+   - Future.successful(r) is an already\
    \ completed future with result r.\n- Future.failed(e) is an already completed\
    \ future with exception.\n- Future.fromTry(t) is an already completed future with\
    \ the result or exception given in the Try object t.\n- Future.unit is an already\
    \ completed future with Unit result.\n- Future.never is a future that never completes.\n\
    \n# 17.8 Promises\n\nA Future object is read-only. The value of the future is\
    \ set implicitly when the task has finished or failed. A Promise is similar, but\
    \ the value can be set explicitly.\n\nConsider this method that yields a Future:\n\
    \n```\ndef computeAnswer(arg: String) = Future {\n  val n = workHard(arg)\n}\n\
    ```\n\nWith a Promise, it looks like this:\n\n```\ndef computeAnswer(arg: String)\
