  md: '# 8.10 ■ Construction Order and Early Definitions


    +   1. The Ant constructor calls the Creature constructor before doing its own
    construction.


    +   2. The Creature constructor sets its range field to 10.


    +   3. The Creature constructor, in order to initialize the env array, calls the
    range() getter.


    +   4. That method is overridden to yield the (as yet uninitialized) range field
    of the Ant class.


    +   5. The range method returns 0. (That is the initial value of all integer fields
    when an object is allocated.)


    +   6. env is set to an array of length 0.


    +   7. The Ant constructor continues, setting its range field to 2.


    Even though it appears as if range is either 10 or 2, env has been set to an array
    of length 0. The moral is that you should not rely on the value of val in the
    body of a constructor.


    In Java, you have a similar issue when you call a method in a superclass constructor.
    It might be overridden in a subclass, and it might not do what you want to do.
    (In fact, that is the root cause of our problem—the expression range calls the
    getter.)


    There are several remedies.


    +   Declare the val as final. This is safe but not flexible.


    +   Declare the val as lazy in the superclass (see Chapter 2). This is safe but
    a bit inefficient.


    +   Use the early definition syntax in the subclass—see below.


    The "early definition" syntax lets you initialize fields of a subclass before
    the superclass is executed. The syntax is so only a mother could love it. You
    place the val fields after the extends keyword, like this:


    ```

    class Ant extends { override val range = 2 } with Creature

    ```


    Note with the keyword before the superclass name. This keyword is normally used
    with traits—see Chapter 10.


    The right-hand side of an early definition can only refer to previous definitions,
    not to other fields or methods of the class.


    > TIP: You can debug construction order problems with the -Xcheckinit compiler
    flag. This flag generates code that throws an exception (instead of yielding the
    default value) when an uninitialized field is accessed.'
