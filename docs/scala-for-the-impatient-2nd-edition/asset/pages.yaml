  md: 'A common optimization is method inlining—replacing a method call with the method
    body. You can tag methods with @inline to suggest inlining, or @nonline to suggest
    not to inline. Generally, inlining is done in the JVM, whose "just in time" compiler
    does a good job without any annotations. The @inline and @nonline annotations
    let direct the Scala compiler, if you perceive the need to do so.


    # 15.6.3 Eliding Methods


    The @elidable annotation flags methods that can be removed in production code.
    For example,


    ```

    @elidable(S00) def dump(props: Map[String, String]) { ... }

    ```


    If you compile with


    ```

    scalac -Xloride-below 800 myprog.scala

    ```


    then the method code will not be generated. The elidable object defines the following
    numerical constants:


    +   * MAXIMUM or OFF = Int.MaxValue

    * ASSERTION = 2000

    * SEVERE = 1000

    * WARNING = 900

    * INFO = 800

    * CONFIG = 700

    * FINE = 500

    * FINER = 400

    * FINEST = 300

    * MINIMUM or ALL = Int.MaxValue


    You can use one of these constants in the annotation:


    ```

    import scala.annotation.elidable.

    @elidable(FINE) def dump(props: Map[String, String]) { ... }

    ```


    You can also use these names in the command line:


    ```

    scalac -Xloride-below INFO myprog.scala

    ```


    If you don''t specify the -Xloride-below flag, annotated methods with values 1000
    are elided, leaving SEVERE methods and assertions, but removing warnings.'
