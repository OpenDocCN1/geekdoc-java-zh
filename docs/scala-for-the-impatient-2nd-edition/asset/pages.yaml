    To multiply two numbers, you call


    mul10oneAtTime(6)(7)

    Strictly speaking, the result of mul10oneAtTime(6) is the function (y: Int) =>
    6 ÷ y. That function is applied to 7, yielding 42.


    When you use def, there is a shortcut for defining such methods in Scala:

    def mul10oneAtTime(x: Int) (y: Int) = x × y


    > NOTE: Recall that anything defined with def (in the REPL or a class or object)
    is a method, not a function. When defining curved methods with def, you can use
    multiple parentheses:


    ```

    scala> mul10oneAtTime(x: Int)(y: Int) = x × y

    mul10oneAtTime: (x: Int)(y: Int) IntInt

    ```


    The method type uses arrows. In contrast, when you use multiple arrows, not multiple
    parentheses:

    scala> val mul10oneAtTime = (x: Int) => (y: Int) => x × y

    mul10oneAtTime: (x: Int) => (y: Int) => Int


    As you can see, multiple parameters are just a frill, not an essential feature
    of a programming language. It''s an amazing theoretical insight, but it has one
    practical use in Scala. Sometimes, you can use currying for a method parameter
    so that the inferencer has more information.


    Here is a typical example. The corresponds method can compare whether two sequences
    are under some proper criterion. For example:


    ```

    val a = Array("Hello", "world")

    val b = Array("hello", "world")

    a.corresponds(b)(_equalsIgnoreCaseCase())

    ```


    Note that the function _equalsIgnoreCase() is passed as a curried parameter, in
    a separate set of (). When you look into the Scaladoc, you will see that corresponds
    is declared as


    ```

    def corresponds[B](this: Seq[B])(p: (A, B) => Boolean): Boolean

    ```


    The sequence and the predicate p are separate parameters. The inferencer can figure
    out what B is from the type of that, and then it can use that information when
    analyzing the function that is passed for p.


    In our example, that is a String sequence. Therefore, the predicate is expected
    to have type (String, String) => Boolean. With that information, the compiler
    can accept ..equalsIgnoreCaseCase() as a shortcut for (a: String, b: String) =>
    a.equalsIgnoreCaseCase(b).'
