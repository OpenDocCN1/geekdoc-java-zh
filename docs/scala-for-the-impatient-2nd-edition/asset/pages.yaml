  md: '# 20.2 Combining Parser Operations


    Such symbols are called nonterminal symbols. One of the nonterminal symbols is
    at the root of the hierarchy; in our case, it is expr. It is called the start
    symbol. To produce correctly formatted strings, you start with the start symbol
    and apply the grammar rules until all nonterminals have been replaced and only
    tokens remain. For example, the derivation


    ```

    expr -> op expr -> number op expr =

    -> number "u" expr -> number "u" number

    ```


    shows that 34 is a valid expression.

    The most used "extended Backus-Naur form," or EBNF, allows specifying optional
    elements and repetition. I will use the familiar regex operators ? * + for 0 or
    1, or more, 1 or more, correspondingly. For an example, a comma-separated list
    of numbers can be described with the grammar


    ```

    numberList := "(", numberList)?

    ```


    or with


    ```

    numberList := "("," number)*

    ```


    As another example of EBNF, let''s make an improvement to the grammar for arithmetic
    expressions to support operator precedence. Here is the revised grammar:


    ```

    expr := term ( "+" | "-") expr )?

    term := factor ("+" factor)*

    factor := number | "(" expr ")

    ```


    # 20.2 Combining Parser Operations


    To use the Scala library, provide a class that extends the Parsers trait and defines
    parsing operations that are combined from primitive operations, such as


    +   - Matching a token

    - Choosing between two operations ()

    - Performing two operations in sequence (-)

    - Repeating an operation (rep)

    - Optionally performing an operation (opt)


    The following parser recognizes arithmetic expressions. It extends RegexParsers,
    a subset of Parsers that can match tokens against regular expressions. Here, we
    specify number with the regular expression "[0-9]+".r:'
