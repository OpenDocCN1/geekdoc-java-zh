    # 13.10 Zipping


    The methods of the preceding section apply an operation to adjacent elements in
    the same collection. Sometimes, you have two collections, and you want to combine
    corresponding elements. For example, suppose you have a list of product prices
    and corresponding quantities:


    ```

    val prices = List(5.0, 20.0, 9.95)

    val quantities = List(10, 2, 1)

    ```


    The zip method lets you combine them into a list of pairs. For example,


    prices zip quantities:


    is a List[(Double, Int)];


    ```

    List((Double, Int)) = List((5.0, 10), (20.0, 2), (9.95, 1))

    ```


    The method is called "zip" because it combines the two collections like the teeth
    of a zipper.


    Now it is easy to apply a function to each pair.


    ```

    (prices zip quantities) map { p => p._1 * p._2 }

    ```


    The result is a list of prices:


    ```

    List(50.0, 40.0, 9.95)

    ```


    The total price of all items is then


    ```

    ((prices zip quantities) map { p => p._1 * p._2 } sum)

    ```


    If one collection is shorter than the other, the result has as many pairs as the
    shorter collection. For example,


    ```

    List(5.0, 20.0, 9.95) zip List(10, 2)

    ```


    is


    ```

    List((5.0, 10), (20.0, 2)

    ```


    The zipAll method lets you specify defaults for the shorter list:


    ```

    List(5.0, 20.0, 9.95).zipAll(List(10, 2), 0.0, 1)

    ```


    is


    ```

