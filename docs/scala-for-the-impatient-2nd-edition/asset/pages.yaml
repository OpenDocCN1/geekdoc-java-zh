  md: "# 7.3 Chained Package Clauses\n\nA package clause can contain a “chain,” or\
    \ path segment, for example:\n\n```\npackage com.horstmann.impatient {\n  // Members\
    \ of com and com.horstmann are not visible here\n  package people {\n    class\
    \ Person {\n      ...\n    }\n  }\n}\n```\n\nA clause limits the visible members.\
    \ Now a com.horstmann.collection package would no longer be accessible as collection.\n\
    \n# 7.4 Top-of-File Notation\n\nInstead of the nested notation that we have used\
    \ up to you, you can have package clauses at the top of the file, without braces.\
    \ For example:\n\n```\npackage com.horstmann.impatient\npackage people\n\nclass\
    \ Person\n...\n```\n\nThis is equivalent to\n\n```\npackage com.horstmann.impatient\n\
    \  package people {\n    class Person {\n      ...\n      // Until the end of\
    \ the file\n    }\n  }\n```\n\nNote in the example above, everything in the file\
    \ belongs to the package com.horstmann.impatient.people, but the package com.horstmann.impatient\
    \ has also been opened up so you can refer to its contents.\n\n# 7.5 Package Objects\n\
    \nA package can contain classes, objects, and traits, but not the definitions\
    \ of functions or variables. That’s an unfortunate limitation of the Java virtual\
    \ machine."
