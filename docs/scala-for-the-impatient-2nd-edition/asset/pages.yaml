  md: '# 16.2 XML Nodes


    > CAUTION: Unfortunately, unlike a DOM node, a Scala Node retains no information
    about its parent.


    Node sequences are of type NodeSeq, a subtype of Seq[Node] that adds support for
    XPath-like operators (see Section 16.7, "XPath-like Expressions," on page 235).
    You can use any of the Seq operations described in Chapter 13 with XML node sequences.
    To traverse a sequence, simply use a for loop, for example: (n <- elem.child)
    process n


    > NOTE: The Node class extends NodeSeq. A single node is a sequence of length
    1. It is supposed to make it easier to deal with functions that can return a single
    node or a sequence. (It actually creates as many problems as it solves, so I don''t
    recommend using this trick in your owns.)


    There are also node classes for XML comments (<!-- -->), entity references (&...;),
    and processing instructions (? ... ?>). Figure 16–1 shows all node types.


    ![](img/9468ae1ab6d9bb5b638fb89107936395_253_0.png)


    Figure 16–1 XML node types


    If you build node sequences programmatically, you can use a NodeBuffer, subclass
    of ArrayBuffer[Node].'
