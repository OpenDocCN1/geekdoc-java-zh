  md: '# 18.12 Wildcards


    In Java, all generic types are invariant. However, you can vary the types where

    y use them, using wildcards. For example, a method


    ```

    void makeFriends(List<? extends Person> people) // This is Java

    can be called with a List<? extends Student>.

    ```


    You can use wildcards in Scala too. They look like this:


    ```

    def process(person: java.util.List[_ <: Person]) // This is Scala

    ```


    In Scala, you don''t need the wildcard for a covariant Pair class. But suppose
    Pair

    is is invariant:


    ```

    class Pair[T](var first: T, var second: T)

    ```


    Then you can define


    ```

    def makeFriends(p: Pair[_ <: Person]) // OK to call with a Pair[Student]

    ```


    You can use wildcards for contravariance


    ```

    import java.util.Comparator

    def min[T](p: Pair[T])(comp: Comparator[_ > T])

    ```


    Wildcards are “syntactic sugar” for existential types, which we will discuss in

    detail in 19.


    > CAUTION: In certain complex situations, Scala wildcards are still a work in

    progress, the following declaration does not work in Scala 2.12:

    def min[T <: Comparable[_ > T]](p: Pair[T]) = ...


    A workaround is the following:


    ```

    type SuperComparable[T] = Comparable[_ > T]

    def min[T <: SuperComparable[T]](p: Pair[T]) = ...

    ```


