  md: "# Chapter 5 ■ Classes\n\n> **TIP:** The Scala designers think that every keystroke\
    \ is precious, so they let you combine a class with its primary constructor. When\
    \ reading a Scala class, you need to disentangle the two. For example, when you\
    \ see\n\n```\nclass Person(val name: String) {\n  var age = 0\n  def description\
