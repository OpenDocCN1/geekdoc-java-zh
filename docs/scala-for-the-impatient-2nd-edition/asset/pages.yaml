  md: "Here, we'll just compute the average of two values. The general case is left\
    \ as an exercise. There are two ways in which we can supply the type class instance:\
    \ as an implicit parameter, or with a context bound. Here is the first approach:\n\
    \n```\ndef average[T](x: T, y: T)(implicit ev: NumberLike[T]) =\n  ev.divideBy(ev.plus(x,\
    \ y), 2)\n```\n\nThe parameter name ev is shorthand for \"evidence\"—see the next\
    \ section.\nWhen using a context bound, we retrieve the implicit object from the\
    \ \"nether world.\"\n\n```\ndef average[T : NumberLike](x: T, y: T) = {\n  val\
    \ ev = implicit[NumberLike[T]]\n  ev.divideBy(ev.plus(x, y), 2)\n}\n```\n\nThat's\
    \ all there to it. Finally, let's see what a type needs to join the NumberLike\
    \ type class. It must provide an implicit object, just like the NumberLikeDouble\
    \ and NumberLikeDecimal objects that we provided out of the gate. Here is how\
    \ Point can join:\n\n```\nclass Point(val x: Double, val y: Double) {\n  ...\n\
    }\n```\n\n```\nobject Point {\n  def apply(x: Double, y: Double) = new Point(x,\
    \ y)\n  implicit object NumberLikePoint extends NumberLike[Point] {\n    def plus(p:\
    \ Point, q: Point) = Point(p.x + q.x, p.y + q.y)\n    def divideBy(p: Point, n:\
    \ Int) = Point(p.x + 1.0 / n, p.y + 1.0 / n)\n  }\n```\n\nHere we added the implicit\
    \ object to the companion object of Point. If you can't modify the Point class,\
    \ you can put the implicit object elsewhere and import it as needed.\n\nThe Standard\
    \ Scala library provides useful type classes, such as Equiv, Ordering, Numeric,\
    \ Fractional, Hashing, TraversableOnce, TraversableLike. As you have seen, it\
    \ is easy to provide your own.\n\nThe important point about type classes is that\
    \ they provide an \"ad-hoc\" way of providing polymorphism that is less rigid\
    \ than inheritance."
