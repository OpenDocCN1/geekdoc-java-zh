  md: '# 21.1 Implicit Conversions


    An implicit conversion function is a function with a single parameter that is
    declared with the implicit keyword. As the name suggests, such a function is automatically
    applied to convert values from one type to another.


    Consider the Fraction class from Section 11.2, "Infix Operators," on page 143
    with a method * for multiplying by another number. We want to convert integers
    to fractions / 1.


    ```

    implicit def int2Fraction(n: Int) = Fraction(n, 1)

    ```


    Now we can evaluate


    ```

    val result = 3 * Fraction(4, 5) // Calls int2Fraction(3)

    ```


    The implicit conversion function turns the integer into a Fraction object. That
    object is multiplied by Fraction(4, 5).


    You can give any name to the conversion function. Since you don''t call it explicitly,
    you might be tempted to use something short such as i2f. But, you will see in
    Section 21.3, "Importing Implicits," on page 325, sometimes it is useful to import
    a conversion function. I suggest that you stick with the source2 convention.


    Scala is not the first language that allows the programmer to provide automatic
    conversions. However, Scala gives programmers a great deal of control over when
    to apply these conversions. In the following sections, we will discuss exactly
    when the conversions happen, and how you can fine-tune the process.


    > NOTE: Even though Scala gives you tools to fine-tune implicit conversions, the
    language designers realize that implicit conversions are potentially problematic.
    To avoid a warning when using implicit functions, add the statement import scala.language.implicitConversions
    or use the compiler option -language:implicitConversions.


    > In C++, you specify conversions as one-argument constructors or member functions
    with the name operator Type(). However, in C++, you cannot selectively allow or
    disallow these functions, and it is common to run into unwanted conversions.


    # 21.2 Using Implicits for Enriching Existing Classes


    Did you ever wish that a class had a method its creator failed to provide? For
    example, wouldn''t it be nice if the java.io.File class had a read method for
    reading a file:'
