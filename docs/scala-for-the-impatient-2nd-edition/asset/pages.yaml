  md: '# Chapter 15


    Annotations let you add information to program items. This information can be
    processed by the compiler or by external tools. In this chapter, you will learn
    how to interoperate with Java annotations and how to use the annotations that
    are specific to Scala.


    The key points of this chapter are:


    +   * You can annotate classes, methods, fields, local variables, parameters,
    expressions, type parameters, and types.

    * With expressions and types, the annotation follows the @Annotation, @Annotation(value),
    or @Annotation(name=value, ...).

    * @volatile, @transient, @strictfp, and @native generate the equivalent Java modifiers.

    * Use @throws to generate Java-compatible throws specifications.

    * The @tailrec annotation verifies that a recursive function uses tail optimization.

    * The assert function takes advantage of the @elidable annotation. You can optionally
    remove assertions from your Scala programs.

    * Use the @deprecated annotation to mark deprecated features.'
