    ```

    scores.keySet // A as Set("Bob", "Cindy", "Fred", "Alice")nfor (v <- scores.values)
    println(v) // Print 10 8 7 10 or some permutation thereof

    ```


    To reverse a map—that is, switch keys and values—use


    ```

    for ((k, v) <- map) yield (v, k)

    ```


    # 4.5 Sorted Maps


    There are two common implementation strategies for maps: hash tables and

    balanced trees. Hash tables use the hash codes of the keys to scramble entries,

    orating over the elements yields them in unpredictable order. By default,

    Scala gives you a map based on a hash table because it is usually more efficient.

    is you need to visit the keys in sorted order, use a SortedMap.


    ```

    val scores = scala.collection.mutable.SortedMap("Alice") -> 10,

    "Fred" -> 7, "Bob" -> 3, "Cindy" -> 8

    ```


    > TIP: If you want to visit the keys in insertion order, use a LinkedHashMap.
    For

    ample:


    ```

    val months = scala.collection.mutable.LinkedHashMap("January") -> 1,

    "February" -> 2, "March" -> 3, "April" -> 4, "May" -> 5, ...

    ```


