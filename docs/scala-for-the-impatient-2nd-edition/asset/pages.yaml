  md: '# Table 5–1 Generated Methods for Fields


    | Scala Field | Generated Methods | When to Use |

    | --- | --- | --- |

    | val/var name | public name name_=(var only) | To implement a property that is
    publicly accessible and backed by a field. |

    | @BeanProperty val/var name | public name getName() name_=(var only) setName(...
    var only) | To interoperate with JavaBeans |

    | private val/var name | private name name_=(var only) | To confine the field
    to the methods of this class, just like in Java. Use private unless you really
    want a public property. |

    | private[this] val/var name | none | To confine the field to methods invoked
    on the same object. Not commonly used. |

    | private[ClassName] val/var name | implementation-dependent | To grant access
    to an enclosing class. Not commonly used. |


    > NOTE: If you define a field as a primary constructor parameter (Sec 5.7, “The
    Primary Constructor,” on page 63), and you want JavaBeans getters and setters,
    annotate the constructor parameter like this:

    class Person(@BeanProperty name: String)


    # 5.6 Auxiliary Constructors


    In Java or C++, a Scala class can have as many constructors as you like. However,
    a Scala class has one constructor that is more important than all the others,
    called the primary constructor. In addition, a class may have any number of auxiliary
    constructors.


    We discuss auxiliary constructors first because they are easier to understand.
    They are similar to constructors in Java or C++, with just two differences.


    +   1. The auxiliary constructors are called this. (In Java or C++, constructors
    have the same name as the class—which is not so convenient if you rename the class.)

    2. Each auxiliary constructor *must* start with a call to a previously defined
    auxiliary constructor or the primary constructor.'
