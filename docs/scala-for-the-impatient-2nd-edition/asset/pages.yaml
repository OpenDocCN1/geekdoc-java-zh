    # 13.14 Interoperability with Java Collections


    At times you may need to use a Java collection, and you will likely miss the rich
    set of methods that you get with Scala collections. Conversely, you may want to
    build up a Scala collection and pass it to Java code. The JavaConversions provides
    a set of conversions between Scala and Java collections.


    Give the target value an explicit type to trigger the conversion.


    ```

    import scala.collection.JavaConversions._

    val props: scala.collection.mutable.Map[String, String] = System.getProperties()

