    # 4.4 Iterating over Maps


    The following amazingly simple loop iterates over every key/value pairs of a map:


    ```

    for ((k, v) <- map) process k v

    ```


    The magic here is that you can use pattern matching in a Scala for loop. (Chap-ter14
    has all the details.) That way, you get the key and value of each pair in the

    map without tedious method.


    If for some reason you want to visit only the keys the keySet and

