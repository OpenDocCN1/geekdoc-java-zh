  md: '# # Chapter 1


    In this chapter, you will learn how to use Scala as an industrial-strength pocket
    calculator, working interactively with numbers and arithmetic operations. We introduce
    a number of important Scala concepts and idioms along the way. You will also learn
    how to browse the Scaladoc documentation at a beginner''s level. Highlights of
    this introduction are:


    +   * Using the Scala interpreter

    * Defining variables with var and val

    * Numeric types

    * Using operators and functions

    * Navigating Scaladoc


    # ## 1.1 The Scala Interpreter


    To start the Scala interpreter:


    +   * Install Scala.

    * Make sure that the the scala/bin directory is on the PATH.

    * Open a command shell in your operating system.

    * Type scala followed by the Enter key.'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'Now type commands followed by Enter. Each time, the interpreter displays the
    answer, as shown in Figure 1–1. For example, if you type 8 ⮮ 5 + 2 (as shown in
    boldface below), you get 42.


    ```

    scala=8 ⮮ 5 + 2

    res0: Int = 42

    ```


    The answer is given the name res0. You can use that name in subsequent computations:


    ```

    scala=0.5 ⮮ res0

    res1: Double = 21.0

    scala="Hello", " + res0

    res2: java.lang.String = Hello, 42

    ```


    As you can see, the interpreter also displays the type of the result—in examples,
    Int, Double, and java.lang.String.


    ![](img/9468ae1ab6d9bb5b638fb89107936395_24_0.png)


    Figure 1–1 The Scala Interpreter


    > TIP: Don''t like the command shell? Several integrated development environments
    that support Scala have a "worksheet" feature for entering expressions and displaying
    their result whenever the sheet is saved. Figure 1–2 shows a worksheet in the
    Eclipse-based Scala IDE.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# 1.1 The Scala Interpreter


    ![](img/9468ae1ab6d9bb5b638fb89107936395_25_0.png)


    Figure 1–2 A Scala Worksheet


    When calling methods, try using tab completion for method names. Type res2.to
    and then hit the Tab key. If the interpreter offers choices such as


    toArray toLowerCase toString toUpperCase


    this means tab completion works in your environment. Type a U and hit the Tab
    key again. You now get a single completion:


    res2.toUpperCase


    Hit the Enter key, and the answer is displayed. (If you can''t use tab completion
    in your environment, you''ll have to type the complete method name yourself.)
    Also try hitting the ↑ and arrow keys. In most implementations, you will see the
    previously issued commands, and you can edit them. Use the ←, →, and Del keys
    to change the last command to


    res2.toLowerCase


    As you can see, the Scala interpreter reads an expression, evaluates it, prints
    it, and reads next expression. This is called the read-eval-print loop, or REPL.'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'Technically speaking, the scala program is not an interpreter. Behind the scenes,
    your input is quickly compiled into bytecode, and the bytecode is executed by
    the Java virtual machine. For that reason, most Scala programmers prefer to call
    it "the REPL".


    > TIP: The REPL is your friend. Instant feedback encourages experimenting, and
    you will feel good when something works.


    It is a good idea to keep an editor window open at the same time, so you can copy
    and paste successful code snippets for later use. Also, as you try more complex
    examples, you may want to compose them in the editor and then paste them into
    the REPL.


    > TIP: In the REPL, type :help to see a list of useful commands. All commands
    start with a colon. For example, :warnings command give more detailed information
    about the most recent compiler warning. You only have to enter the unique prefix
    of each command. For example, :w is the same as :warnings-at least now, since
    there isn''t currently another command starting with w.


    # 1.2 Declaring Values and Variables


    Instead of using res, res1, and so on, you can define your own names:


    ```

    scala> val answer = 8 * 5 + 2

    answer: Int = 42

    ```


    You can use these names in subsequent expressions:


    ```

    scala> 0.5 * answer

    res1: Double = 21.0

    ```


    A declared value for val is actually a constant—you can''t change its contents:


    ```

    scala> answer = 0

    <console>:6: error: reassignment to val

    ```


    To declare a variable whose contents can vary, use a var:


    ```

    var counter = 0

    counter = 1 // change a var

    ```


    In Scala, you are encouraged to use a val unless you really need to change the
    contents. Perhaps surprisingly for Java or C++ programmers, most programs don''t
    need many variables.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# 1.3 Commonly Used Types


    Note that you need not specify the type of a value or variable. It is inferred
    from the type of the expression with which you initialize it. (It is an error
    to declare a value or variable without initializing it.)


    However, you can specify the type if necessary. For example,


    ```

    val greeting: String = null

    val greeting: Any = "Hello"

    ```


    > NOTE: In Scala, the type of a variable or function is written after the name
    of the variable or function. This makes it easier to read declarations with complex
    types.


    As I move back and forth between Scala and Java, I find that my fingers write
    Java declarations upon autopilot, so I have to rewrite them as greeting: String.
    This is a bit annoying, but when I work with complex Scala programs, I really
    appreciate that I don''t have to decrypt C-style type


    > NOTE: You may have noticed that there are no semicolons after variable declarations
    or assignments. In Scala, semicolons are only required if you have multiple statements
    on the same line.


    You can declare multiple values or variables together:


    ```

    val xmax, ymax = 100 // Sets xmax and ymax to 100

    var greeting: String = null

    // greeting and message are strings, initialized with null

    ```


    # 1.3 Commonly Used Types


    You have already seen some of the data types of Scala, such as Int and Double.
    Like Java, Scala has seven numeric types: Byte, Char, Short, Int, Long, Float,
