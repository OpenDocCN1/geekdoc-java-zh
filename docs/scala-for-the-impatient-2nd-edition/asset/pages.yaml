  md: '# 20.13 Error Handling


    When a parser can''t accept an input, you want to get an accurate message indicating
    the failure occurred.


    The parser generates an error message that describes the position at which the
    parser was unable to continue. If there were several failure points, the one that
    was visited is reported.


    You may want to keep error reporting in mind when you order alternatives. For
    example, if you have a rule


    ```

    def value: Parser[Any] = numericlit | "true" | "false"

    ```


    and the parser doesn''t match any of them, then it''s not so useful to know what
    the input failed to match. You can add a failure clause with an explicit error
    message:


    ```

    def value: Parser[Any] = numericlit | "true" | "false" \

    failure("Not a valid value")

    ```


    The failure combinator only reports an error when it is visited. It does not change
    the error messages that another combinator reports. For example, a RegexParser
    has an error message such


    ```

    string matching regex ''\d+'' expected but ''x''

    ```


    Then use the failureErrorMessage method, like this:


    ```

    def value = opt(sign) ~ digits withfailureErrorMessage "Not a valid number"

    ```


    When the parser fails, the parse() method returns a Result. Its msg property is
    an error message that you can display to the user. The next property that points
    to the unconsumed input at the failure. You will want to display the line number
    and column, which are available as next.pos.line and next.pos.column.


    Finally, next.first is the lexical element at the failure occurred. If you use
    the RegexParsers trait, that element is a Char, which is not very useful for error
    reporting. But with a token parser, next.first is a token, which is worth reporting.


    > TIP: If you want to report errors that you detect after a successful parse (as
    type errors in a programming language), use the positioned combinator to add a
    position to a parse result. The result type must extend the Positional trait.
    For example,


    ```

    def vardecl() = "var" ~ positioned(ident { _ }) ~ " ~ value

    ```'
