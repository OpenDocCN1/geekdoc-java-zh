    If you take advantage of that project, you can write both the client-side and
    the server-side code of web applications in Scala.


    # 1.7 Scaladoc


    Java programmers use Javadoc to navigate the Java API. Scala has its own variant,
    called Scaladoc (see Figure 1–3).


    Using Scaladoc can be a bit more overwhelming than Javadoc Scala classes tend
    to have many convenience methods than Java classes. Some methods use advanced
    features that are more meaningful to library implementors than to library users.


    Here are some tips for navigating Scaladoc as a newcomer to the language.


