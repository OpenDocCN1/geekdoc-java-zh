    ```


    > NOTE: The Try class is designed to work with computations that may fail with
    exceptions. We will look at it more closely in Chapter 17. Here is a simple example:


    ```

    import scala.io._

    val result =

    for (a <- Try { StdIn.readLine("a: ").toInt };

