  md: "# 5.7 The Primary Constructor\n\nConstruction parameters can also be regular\
    \ method parameters, without val var. How these parameters are processed depends\
    \ on their usage inside the class.\n\n+   If a parameter without val or var is\
    \ used inside at least one method, it becomes a field. For example,\n```java\n\
    class Person(name: String, age: Int) {\n    def description = s'$name is $age\
    \ years old'\n}\n```\ndeclares and initializes immutable fields name and age that\
    \ are object-private. Such a field is the equivalent of a private[this] val field\
    \ (see Section 5.4, \"Object-Private Fields,\" on page 60).\nOtherwise, the parameter\
    \ is not saved as a field. It's a regular parameter that can be accessed in the\
    \ code of the primary constructor. (Strictly speaking, this is an implementation-specific\
    \ optimization).\n\nTable 5-2 summarizes the fields and methods that are generated\
    \ for different kinds of primary constructor parameters.\n\n# Table 5–2 Fields\
    \ and Methods Generated for Primary Constructor\n\n| Primary Constructor Parameter\
    \ | Generated Field/Methods |\n|---|---|\n| name: String | object-private field,\
    \ or no field if method uses name |\n| val/var name: String | private field, private\
    \ getter/setter |\n| val/var name: String | private field, public getter/setter\
    \ |\n| @Property val/var name: String | private field, public Scala and JavaBeans\
    \ getters/setters |\n\nIf you find the primary constructor confusing, you don't\
    \ need to use it. Just provide one or more auxiliary constructors in the usual\
    \ way, but remember to call this() if you don't chain to another auxiliary constructor.\n\
    However, many programmers like the concise syntax. Martin Odersky suggests to\
    \ think about this way: In Scala, classes takes parameters, just like methods.\n\
    \n> NOTE: When you think of the primary constructor's parameters as class parameters,\
    \ parameters without val or var become easier to understand. The scope of such\
    \ a parameter is the entire class. Therefore, you can use the parameter in methods.\
    \ If you do, it is the compiler's job to save it in a field."
