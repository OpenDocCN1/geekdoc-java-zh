  md: "# Chapter 14 Pattern Matching and Case Classes\n\nIf you find this a bit heavyweight,\
    \ you may prefer the Enumeration helper class that was described in Chapter 6.\n\
    \n# 14.16 The Option Type\n\nThe Option type in the standard library uses case\
    \ classes to express values that might or not be present. The case subclass Some\
    \ wraps a value, for example Some(\"Fred\"). The case object None indicates that\
    \ there is no value.\n\nThis is less ambiguous than using an empty string and\
    \ safer than using null for a missing value.\n\nOption is a generic type. For\
    \ example, Some(\"Fred\") is an Option[String].\n\nThe method of the Map class\
    \ returns an Option. For a given key, it returns None. Otherwise, it wraps the\
    \ value inside Some.\n\nYou can use pattern matching to analyze such a value.\n\
    \n```\nval aliceScore = scores.get(\"Alice\")\naliceScore match {\n  case Some(score)\
    \ => println(score)\n  case None => println(\"No score\")\n}\n```\n\nBut frankly,\
    \ that is tedious. Alternatively, you can use isEmpty and Empty:\n\n```\nif (aliceScore.isEmpty)\
    \ println(\"No score\")\nelse println(aliceScore.get)\n```\n\nThat’s tedious.\
    \ It is better to use the getOrElse method:\n\n```\nprintln(aliceScore.getOrElse(\"\
    No score\"))\n```\n\nIf aliceScore is None, then getOrElse returns \"No score\"\
    \nA powerful way of working with options is to consider them as collections that\
    \ have zero or one element. You can visit the element with a loop:\n\n```\nfor\
    \ (score <- aliceScore) println(score)\n```\n\nIf aliceScore is None, nothing\
    \ happens. If it is a Some, then the loop executes once, with bound to the contents\
    \ of the option.\n\n```\nval bigScore = aliceScore.map(_ + 1) // Some(score +\
    \ 1) or None\nval acceptableScore = aliceScore.filter(_ > 5) // Some(score) if\
    \ score > 5 or None\nacceptableScore.foreach(println(_)) // Prints the score if\
    \ it exists\n```\n\nYou can use methods such as map, filter, or foreach. For example,\n\
    \n> TIP: When you create an Option from a value that may be null, you can simply\
    \ use Option(value). The result is None if null and Some(value) otherwise."
