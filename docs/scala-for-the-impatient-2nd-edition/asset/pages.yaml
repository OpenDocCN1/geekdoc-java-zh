    \ feel free to—they do no harm.\n\n# 2.3 Block Expressions and Assignments\n\n\
    In Java or C++, a block statement is a sequence of statements enclosed in { }.\
    \ You use a block statement whenever you need to put multiple actions in the body\
    \ of a branch or loop statement.\n\nIn Scala, a } block contains a sequence of\
    \ expressions, and the result is also an expression. The value of the block is\
    \ the value of the last expression.\n\nThis feature can be useful if the initialization\
    \ of a value takes more than one step. For example:\n\n```\nval distance = { val\
