  md: '# Methods in the Future Object


    Suppose that, as you are computing a result, you organize the work so that you
    can concurrently work on different parts. For example, each part might be a range
    of inputs. Make a future for each part:


    ```

    val futures = futures.map(p => Future { compute result in p })

    ```


    Now you have a collection of futures. Often, you want to combine the results.
    By using the Future.sequence method, you can get a collection of all results for
    further processing:


    ```

    val result = Future.sequence(futures)

    ```


    Note that the call doesn''t block-it gives you a future to a collection. For example,
    assume futures is a Set[Future[T]]. Then the result is a Future[Set[T]]. When
    the results for all elements of futures are available, the result future will
    complete with a set of the results.


    If any of the futures fail, the resulting future fails as well with the exception
    of the leftmost failed future. If multiple futures fail, you don''t get to see
    the remaining failures.


    The traverse method combines the map and sequence steps. Instead of


    ```

    val futures = futures.map(p => Future { compute result in p })

    val result = Future.sequence(futures)

    ```


    you can call


    ```

    val result = Future.traverse(parts)(p => Future { compute result in p })

    ```


    The function in second argument is applied to each element of parts. You get a
    future to a collection of all results.


    There are reduceleft and foldleft operations that are analogous to the reductions
    and folds described in Section 13.9, "Reducing, Folding, and Scanning," on page
    184. You supply an operation that combines the results of all futures as they
    become available. For example, here is how you can compute the sum of the results:


    ```

    val result = Future.reduceleft(futures)(_ + _)

    // Yields a future to the sum of all futures

    ```


    So far, we have collected the results from all futures. Suppose you are willing
    to accept a result from any of the parts. Then call


    ```

    Future[T] result = Future.firstCompleted(futures)

    ```


    You get a future that, when it completes, has the result or failure of the first
    completed futures.


    The find method is similar, but you also supply a predicate.


    ```

    val result = Future.find(futures)(predicate)

    // Yields a Future[Option[T]]

    ```'
