    \ extends Account with Logger {\n  def withdraw(amount: Double) log {\n    if\
    \ (amount > balance) log(\"Insufficient funds\")\n    else {\n    }\n  }\n```\n\
    \nThis class is abstract since it can't do any logging, which might seem pointless.\
    \ But you can \"mix\" in a concrete logger when constructing an object.\n\n```\n\
    trait ConsoleLogger extends Logger {\n  def log(msg: String) { println(msg) }\n\
    }\n```\n\nval acct = new SavingsAccount with ConsoleLogger\nWhen calling the object,\
    \ the log method of the ConsoleTrait executes. Of course, another object can add\
    \ in a different trait:\n\n```\nval acct2 = new SavingsAccount with FileLogger\n\
    ```\n\n# 10.5 Layered Traits\n\nYou can add, to a class or an object, multiple\
    \ traits invoke each other starting with the last one. This is useful when you\
    \ need to transform a value in stages. Here is a simple example. We may want to\
    \ add a timestamp to all logging messages.\n\n```\ntrait TimestampLogger extends\
    \ ConsoleLogger {\n  override def log(msg: String) {\n    super.log(\"${java.time.Instant.now()}\
    \ \\$msg)\n  }\n```\n\nAlso, suppose we want to truncate overly chatty log messages\
    \ like this:"
