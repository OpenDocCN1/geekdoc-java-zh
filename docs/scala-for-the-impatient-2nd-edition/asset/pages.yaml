  md: '# 11.1 Identifiers


    The names of variables, functions, classes, and so on are collectively called
    identifiers. In Scala, you have more choices for forming identifiers than in Java.
    Of course, you can follow the time-honored pattern: sequences of alphanumeric
    characters, starting with an alphabetic character or an underscore, such as input
    or next_token.


    As in Java, Unicode characters are allowed. For example, quantité ou phố are valid
    identifiers.


    In addition, you can use operator characters in identifiers:


    +   The ASCII characters ! % & + = - <= >= \ ^ | ~ that are not letters, digits,
    underscore, the ; punctuation marks, parentheses () [] {}, or quotation marks
    ''''.


    +   Unicode mathematical symbols or other symbols from the Unicode categories
    Sm and So.


    For example, == and √ are valid identifiers. With the definition


    ```

    val √ = scala.math.sqrt _

    ```


    you can write √(2) to compute a square root. This may be a good idea, provided
    one''s programming environment makes it easy to type the symbol.


    > NOTE: The identifiers @ # := _ -> < &: <= are reserved in the specification,
    and you cannot redefine them.


    You can also form identifiers from alphanumeric characters, followed by an underscore,
    and then a sequence of operator characters, such as


    ```

    val happy_birthday!!! = "Bonne anniversaire!"

    ```


    This is probably not a good idea.


    Finally, you can include just about any sequence of characters in backticks. For
    example,


    ```

    val val^ = 42

    ```


    That example is silly, but backticks can sometimes be an “escape hatch”. For example,
    in Scala, yield is a reserved word, but you may need to access a Java method of
    the same name. Backticks to the rescue: Thread.`yield`().'
