  md: "# 5.5 Bean Properties\n\n> NOTE: Scala allows you to grant access rights to\
    \ specific classes. The `private[ClassName]` qualifier states that only methods\
    \ of the given class can access the given field. Here, the `ClassName` must be\
    \ the name of the class being defined or an enclosing class. (See Section 5.8,\
    \ \"Nested Classes,\" on page 66 for a discussion of inner classes.)\n\nIn this\
    \ case, the implementation will generate auxiliary getter and setter methods that\
    \ allow the enclosing class to access the field. These methods will be public\
    \ because the JVM does not have a fine-grained access control system, and they\
    \ will have implementation-dependent names.\n\n# 5.5 Bean Properties L1\n\nAs\
    \ you saw in the preceding sections, Scala provides getter and setter methods\
    \ for the fields that you define. However, the names of these methods are not\
    \ what Java tools expect. The JavaBeans specification (www.oracle.com/technet/articles/javaee/spec-136004.html)\
    \ defines a Java property as a pair of getFoo/setFoo (or just a getFoo method\
    \ for a read-only property). Many Java tools rely on this naming convention.\n\
    \nWhen you annotate a Scala field with @BeanProperty, then such methods are automatically\
    \ generated. For example,\n\n```\nimport scala.beans.BeanProperty\n```\n\n```\n\
    class Person {\n  @BeanProperty var name: String = _n}\n```\n\ngenerates four\
    \ methods:\n\n+   1. name: String\n2. name_=(newValue: String): Unit\n3. getName():\
    \ String\n4. setName(newValue: String): Unit\n\nTable 5–1 shows which methods\
    \ are generated in all cases."
