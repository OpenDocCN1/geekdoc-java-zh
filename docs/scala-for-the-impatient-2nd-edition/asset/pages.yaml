    \ in a trait is very common in Scala. In\nJava, you can achieve the same with\
    \ default methods.\n\n# # 10.8 Concrete Fields in Traits\n\nA field in a trait\
    \ can be concrete or abstract. If you supply an initial value, the\nfield is concrete.\n\
    \n```\ntrait ShortLogger extends Logger {\n  val maxLength = 15 // A concrete\
    \ field\n  override def log(msg: String) {\n    super.log(\n      if (msg.length\
    \ <= maxLength) msg\n      else s\"${msg.substring(0, maxLength - 3)}...\"\n \
    \   )\n  }\n}\n```\n\nA class that mixes in this trait acquires a maxLength field.\
    \ In general, a class gets a\nfield for each concrete field in one of its traits.\
    \ These fields are not inherited; they\nare simply added to the subclass. This\
    \ may seem a subtle distinction, but it is\nimportant. Let us look at the process\
    \ more closely, with this version of the\nSavingsAccount class:"
