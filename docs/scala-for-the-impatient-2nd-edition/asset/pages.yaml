    # 2.7 Functions


    Scala has functions in addition to methods. A method operates on an object, a
    function doesn''t. C++ has functions as well, but in Java, you have to imitate
    them with static methods.


    To define a function, specify the function’s name, parameters, and body like this:

    def abs(x:Double) = if (x > 0) x else -x


    You must specify the types of all parameters. However, as long as the function
    is not recursive, you do not need to specify the type. The Scala compiler determines
    the return type from the type of the expression to the right of the = symbol.


    If the body of the function requires more than one expression, use a block. The
    last expression of the block becomes the value the function returns. For example,
    the function returns the value of r after the loop.


    ```

    def fac(n: Int) = {

    var r = 1

    for (i <- 1 to n) r = r * i

    }

    ```


    There is no need for the return keyword in this example. It is possible to return
    as in Java or C++, to exit a function immediately, but is not commonly done in
    Scala.


    > TIP: There is nothing wrong with using return in a named function (except the
    waste of seven keystrokes), it is a good idea to get used to life without return.
    Pretty soon, you will be lots of anonymous functions, and there, return doesn''t
    return a value to the caller but breaks out of the enclosing named function. Think
    of return as a kind of break statement for functions, and only when you want that
    breakout functionality.


    With a recursive function, you must specify the return type. For example,

    def fac(n: Int): Int = if (n <= 0) else n * fac(n - 1)'
