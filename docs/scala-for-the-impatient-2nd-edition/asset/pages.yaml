  md: '# 4.1 Constructing a Map


    You can construct a map as


    ```

    val scores = Map("Alice") -> 10, "Bob" -> 3, "Cindy" -> 8

    ```


    This constructs an immutable Map[String, Int] whose contents can''t be changed.

    If you want a mutable.map, use


    ```

    val scores = scala.collection.mutable.Map("Alice" -> 10, "Bob" -> 3, "Cindy" ->
    8)

    ```


    If you want to start out with a blank map, you have to supply parameters:


    ```

    val scores = scala.collection.mutable.Map[String, Int]()()

    ```


    In Scala, a map is a collection of pairs. A pair is simply a grouping of two values,

    not necessarily of the same type, such as ("Alice", 10).

    The -> operator makes a pair. The value of


    ```

    "Alice" -> 10

    ```


    is


    ```

    "Alice", 10

    ```


    You could have equally defined the map as

    val scores = Map("Alice", 10), ("Bob", 3), ("Cindy", 8)

    The -> operator is just a little easier on the eyes than the parentheses. It also

    supports the intuition that a map data structure is a kind of function that maps

    keys to values. The difference is that a function computes values, and a map just

    looks them up.


    # 4.2 Accessing Map Values


    In Scala, the analogy between functions and maps is particularly close

    y you use the (key) notation to look up key values.


    ```

    val bobScore = scores("Bob") // Like scores.get("Bob") in Java

    ```


    If the map doesn''t contain a value for the requested key, an exception is thrown.

    To check whether there is a key with the given value, call the contains method:


    ```

    val bobScore = if (scores.contains("Bob")) scores("Bob") else 0

    ```


    Since this call is combination with some, there is a shortcut:


    ```

    val bobScore = scores.getOrElse("Bob", 0)

    // If the map contains the key "Bob", return the value; otherwise, return 0.

    ```


    Finally, the map.get(key) returns an Option object that is either Some(value for
    key)

    or None. We discuss the Option class in Chapter 14.'
