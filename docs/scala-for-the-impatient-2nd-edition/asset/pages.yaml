  md: '# # Chapter 16


    Scala has built-in support for XML literals that makes it easy to generate XML
    fragments in your programs. The Scala library includes support for common XML
    processing tasks. In this chapter, you will learn how to put these features to
    use for reading, analyzing, creating, and writing XML.


    > > NOTE: The XML support in Scala is brilliant because it makes it possible to
    slice and dice XML easily and conveniently, in the REPL and in Scala programs.
    It is also flawed because of some unfortunate design decisions and lack of maintenance.
    It is difficult to remedy these issues because XML is so tightly integrated into
    Scala. A future version of Scala will likely abandon this tight integration and
    rely instead on string interpolation and third-party libraries. But for now, we
    can enjoy a uniquely powerful way of processing XML.


    > > NOTE: The API documentation for Scala XML is at www.scala-lang.org/api/current/scala-xml.


    The key points of this chapter are:


    +   - XML literals `<like>this</like>` are of type NodeSeq.

    - You can embed Scala code inside XML literals.

    - The child property of a Node yields the child nodes.'
