    In Scala, you can use type parameters to implement classes and functions that
    work with multiple types. For example, an Array[T] stores elements of an arbitrary
    type T. The basic idea is very simple, but the details can get tricky. Sometimes,
    you need to place restrictions on the type. For example, to sort elements, T must
    provide an ordering. Furthermore, if the parameter type varies, what should happen
    with the parameterized type? For example, can you pass an Array[String]? In Scala,
    you specify how your types should vary depending on their parameters.


    The key points of this chapter are:


    +   - Classes, traits, methods, and functions can have type parameters.

    - Place the type parameters after the name, enclosed in square brackets.

    - Type bounds have the form T <: Bound, T <: LowerBound, T : ContextBound.

    - You can restrict a method with a type constraint such as (implicit ev: T <<
    upperBound).

    - Use +T (covariance) to indicate that a generic type''s subtype relationship
    is in the same direction as the parameter T, or -T (contravariance) to indicate
    the reverse direction.

    - Covariance is appropriate for parameters that denote outputs, such as elements
    in an immutable collection.'
