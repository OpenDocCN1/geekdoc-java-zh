  md: 'CAUTION: The Nothing type is not at all the same as void in Java or C++.

    Scala, void is represented by the Unit type, the type with the sole value ().\Note
    that Unit is not a supertype of any other type. However, the compiler still

    allows any value to be replaced by a (). Consider


    ```

    def printAny(x: Any) { println(x) }

    def printUnit(x: Unit) { println(x) }

    printAny("Hello") // Prints Hello

    printUnit("Hello")

    // Replaces "Hello" with () and calls printUnit(),), which prints (

    ```


    CAUTION: When a method has a parameter of type Any or AnyRef, and it is

    called with multiple arguments, then they are placed in a tuple:


    ```

    def show(o: Any) { println("${o.getClass}: ${o}") }

    show(3) // Prints class java.lang.Integer: 3

    show(3, 4, 5) // Prints class scala.Tuple3: (3,4,5)

    ```


    If you call show() with no parameters, a Unit value is passed. However, the

    behavior is deprecated.


    # 8.2 Object Equality L1


    In Scala, the eq method of the AnyRef class checks whether two references refer
    to

    t same object. The equals method in AnyRef calls eq. When you implement a class,

    y should consider overriding the equals method to provide a natural notion of

    equality for your situation.


    For example, if you define a class Item(val description: String, val price: Double),

    might want to consider two items equal if they have the same description

    and price. Here is an appropriate method:


    ```

    final override def equals(other: Any) = {

    other.isInstanceOf[Item] && {

    val that = other.asInstanceOfOf[Item]

    description = that.description && price == that.price

    }

    ```


    Or better, use pattern matching:


    ```

    final override def equals(other: Any) = other match {

    case that: Item => description == that.description && price == that.price

    case _ => false

    }

    ```'
