    \ to make the calls to target.append(...). Structural typing gives you a safe\
    \ and convenient way of making such calls.\n\nHowever, a reflective call is much\
    \ more expensive than a regular method call. For that reason, you should only\
    \ use structural typing when you model common behavior from classes that cannot\
    \ share a trait.\n\n> NOTE: Structural types are similar to \"duck typing\" in\
    \ dynamically typed programming languages such as JavaScript or Ruby. In these\
