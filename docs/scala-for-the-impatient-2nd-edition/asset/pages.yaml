  md: "# 15.5.2 Marker Interfaces\n\nScala uses annotations @cloneable and @remote\
    \ instead of the Cloneable and java.rmi.Remote interfaces for cloneable and remote\
    \ objects.\n\n```\n@cloneable class Employee\n```\n\nWith serializable classes,\
    \ you can use the @Serializable annotation to specify the serial version:\n\n\
    ```\n@SerializableVersionUID(6157032470129070425L)\nclass Employee extends Person\
    \ with Serializable\n```\n\n> NOTE: For more information about Java concepts such\
    \ as volatile fields, cloning, or serialization, see C. Horstmann, Core Java;\
    \ Tenth Edition (Prentice Hall, 2016).\n\n# 15.5.3 Checked Exceptions\n\nUnlike\
    \ Scala, the Java compiler tracks checked exceptions. If you call a Scala method\
    \ from Java code, its signature should include the checked exceptions that can\
    \ be thrown. Use the @throws annotation to generate the correct signature. For\
    \ example,\n\n```\nclass Book {\n  @throws(classOf[IOException]) def read(filename:\
    \ String) { ... }\n  }\n```\n\nThe Java signature is\nvoid read(String filename)\
    \ throws IOException\n\nWithout the @throws annotation, the Java code would not\
    \ be able to catch the exception.\n\n```\ntry { // This is Java\n  book.read(\"\
    war-and-peace.txt\");\n} catch (IOException ex) {\n  ...\n  }\n```\n\nThe Java\
    \ compiler needs to know that the read method can throw an IOException, or it\
    \ will refuse to catch it."
