    \ {\n    class Counter\n      ...\n  }\n}\n```\n\n# 7.2 Scope Rules\n\nIn Scala,\
    \ the scope rules for packages are more consistent than in Java. Scala packages\
    \ nest just like all other scopes. You can access names from the enclosing scope.\
    \ For example,\n\n```\npackage com {\n  package horstmann {\n    object Utils\
    \ {\n      def percentOf(value: Double, rate: Double) = value * rate / 100\n \
