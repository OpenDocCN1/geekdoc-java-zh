    # 3.6 Deciphering Scaladoc


    There are lots of methods on arrays and array buffers, and it is a good idea to
    browse the Scala documentation to get an idea of what''s there. Scala has a richer
    type system than Java, so you may encounter some strange-looking syntax as you
    browse the Scala documentation. Fortunately, you don''t have to understand all
    nuances of the type system to do useful work. Table 3-1 as a "decoder ring".


    Table 3–1 Scaladoc Decoder Ring


    | Scaladoc | Explanation |

    | --- | --- |

    | def count(p: (A) => Boolean): Int | This method takes a predicate, a function
    from A to Boolean. It counts for many elements the function is true. For example,
    a.count(_ > 0) counts how many elements of A are positive. |

    | def append(elems: A): Unit | This method takes zero or more arguments of type
    A. For example, b.append(1, 7, 2, 9) appends four elements to b. |

    | def appendAll(xs: TraversableOnce[A]): Unit | The xs parameter can be any collection
    with the TraversableOnce trait in the Scala collections hierarchy. Other traits
    that you may encounter in Scaladoc are Traversable and Iterable. All Scala collections
    implement these traits, and the difference between them is academic for library
    users. Simply think "any collection" when you use one of these.


    (Continues)'
