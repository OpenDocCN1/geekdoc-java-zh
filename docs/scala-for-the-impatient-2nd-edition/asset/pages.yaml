    you just get a reference to the old set. This is particularly natural in recursive
    computations. For example, we compute the set of all digits of an integer:


    ```

    def digits(n: Int): Set[Int] =

    if (n < 0) digits(-n)

    else if (n < 10) Set(n)

    else digits(n / 10) + (n % 10)

