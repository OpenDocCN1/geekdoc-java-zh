    # 14.11 Infix Notation in case Clauses


    When an unapply method yields a pair, you can use infix notation in the case clause.
    In particular, you can use infix notation with a case class that has two parameters.
    For example:


    ```

    amt match { case Currency u => ... } // Same as case Currency(a, u)

    ```


    Of course, that is a silly example. The feature is meant for matching sequences.
    For example, every List object is either Nil or an object of the case class ::
    defined as


    ```

    case class ::[E](head: E, tail: List[E]) extends List[E]

    ```


    Therefore, you can write


    ```

    1st match { case h :: t => ... }

    // Same as case ::(h, t), which calls ::.unapply(1st)

    ```


    In Chapter 20, you will encounter the case clause for combining pairs of parse
    result. It is also intended for use as an infix expression in case clauses:


    ```

    result match { case p ~ q => ... } // Same as case ~(p, q)

    ```


    These infix expressions are easier to read when you have more than one. For example,


    ```

    result match { case p ~ q ~ r => ... }

    ```


    is nicer than ~(p, q), r.


    If the operator ends in a colon, it associates right-to-left. For example,


    ```

    case first :: second :: rest

    ```


    means


    ```

    case ::(first, ::(second, rest))

    ```'
