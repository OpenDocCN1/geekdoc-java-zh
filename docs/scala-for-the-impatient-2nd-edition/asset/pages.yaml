  md: "# 10.6 Overriding Abstract Methods in Traits\n\nIn the preceding section, the\
    \ TimestampLogger and ShortLogger traits extended ConsoleLogger. Let's make them\
    \ extend our Logger trait instead, where we provide no implementation to the log\
    \ method.\n\n```\ntrait Logger {\n  def log(msg: String); // This method is abstract\n\
    }\n```\n\nThen, the TimestampLogger class no longer compiles.\n\n```\ntrait TimestampLogger\
    \ extends Logger {\n  override def log(msg: String) // Overrides an abstract method\n\
    \  super.log(\"${java.time.Instant.now()} ${msg}\") // Is super.log defined?\n\
    }\n```\n\nThe compiler fails to call log as an error.\nNormal inheritance rules,\
    \ this could not be correct—the Logger method has no implementation. But actually,\
    \ as we saw in the preceding section, there is no way of knowing which log is\
    \ actually being called—it depends on the order in which traits are mixed in.\n\
    \nScala takes the position that TimestampLogger is still abstract—it requires\
    \ a concrete log method to be mixed in. You therefore need to tag the method with\
    \ the abstract keyword and the override keyword, like this:\n\n```\nabstract override\
    \ def log(msg: String) {\n  super.log(\"${java.time.Instant.now()} ${msg}\")\n\
    }\n```\n\n# 10.7 Traits for Rich Interfaces\n\nA trait can have many utility methods\
    \ that depend on a few abstract ones. One example is the Scala Iterator trait\
    \ that defines dozens of methods in terms of the abstract next has methods.\n\n\
    Let us enrich our rather anemic logging API. Usually, a logging API lets specify\
    \ a level for each log message to distinguish informational messages from warnings\
    \ or errors. We can easily add this capability without forcing any policy for\
    \ the destination of logging messages."
