  md: '# Chapter 17 ■ Futures


    Table 17–1 Transformations on a Future[T] with success value v or exception


    | Method | Result | Description |

    | --- | --- | --- |

    | collect(pf: PartialFunction[T, S]) | Future[S] | Like map, but with a partial
    function. The result fails with a NoSuchElementException if pf(v) is not defined.
    |

    | foreach(f: T => U) | Unit | Calls f(v) like map, but only for its side effect
    |

    | andThen(pf: PartialFunction[Try[T], U]) | Future[T] | Calls pf(v) for its side
    effect and returns a future with v. |

    | filter(pf: T => Boolean) | Future[T] | Calls pf(v) with v or a NoSuchElementException.
    |

    | recover(pf: PartialFunction[Throwable, U]) recoverWith(pf: PartialFunction[Throwable,
    U]) | Future[U] (where U is a supertype of T) | A future with value v or pf(ex),
    flattened in the asynchronous case |

    | fallback(f2: Future[U]) | Future[U] (where U is a supertype of T) | A future
    with value v, or if this future failed, with the value of f2, or if that also
    failed, with exception. |

    | failed transform(s: T => S, f: Throwable => Throwable) transform(f: Try[T] =>
    Try[S]) transformWith(f: Try[T] => Future[Try[S]]) | Future[Throwable] Future[S]
    | A future with value ex. | Transforms both the success and failure. |


    The zipWith method is similar, but it takes a method to combine the results instead
    of returning a pair. For example, here is another way of obtaining the sum of
    two computations:


    ```

    val future1 = future { getData1() }

    val future2 = future { getData2() }

    val combined = future1.zipWith(future2)(_ + _)

    ```


