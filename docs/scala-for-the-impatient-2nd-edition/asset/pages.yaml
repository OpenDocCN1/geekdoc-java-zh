  md: "# 16.10 Transforming XML\n\nSometimes, you need to rewrite all descendants\
    \ that match a particular condition. The XML library provides a RuleTransformer\
    \ class that applies one or more RewriteRule instances to a node and its descendants.\n\
    \nFor example, suppose you want to change all ul nodes in a document to ol. Define\
    \ a RewriteRule that overrides the transform method:\n\n```\nval rule1 = new RewriteRule\
    \ {\n  override def transform(n: Node) = n match {\n    case e <- ul[li] => e.asInstanceOf[Elem].copy(label\
    \ = \"ol\")n    case => n\n  }\n}\n```\n\nThen you can transform a tree with the\
    \ command\n\n```\nval transformed = new RuleTransformer(rule1).transform(root)\n\
    ```\n\nYou can supply any number of rules in the constructor of the RuleTransformer:\
    \ or a URL:\n\n```\nval transformer = new RuleTransformer(rule1, rule2, rule3);\n\
    ```\n\nThe method traverses the descendants of a node, or applies all rules, and\
    \ returns the transformed tree.\n\n# 16.11 Loading and Saving\n\nTo load an XML\
