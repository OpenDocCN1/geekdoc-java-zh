  md: '# 2.1 Conditional Expressions


    Scala has an if/else construct with the same syntax as in Java or C++. However,
    in Scala, an if/else has a value, namely the value of the expression that follows
    the if or else. For example,


    ```

    if (x > 0) 1 else -1

    ```


    has a value of 1 or -1, depending on the value of x. You can put that value in
    a variable:


    ```

    s = if (x > 0) 1 else -1

    ```


    This has the same effect


    ```

    if (x > 0) s = 1 else s = -1

    ```


    However, the first form is better because it can be used to initialize a val.
    In the second term, s needs to be a var.


    (As already mentioned, semicolons are mostly optional in Scala—see Section 2.2,
    "Statement Termination," on page 19).


    Java and C++ have ?: operator for this purpose. The expression


    ```

    x > 0 ? 1 : -1 // Java or C++

    ```


    is equivalent to the Scala expression if (x > 0) 1 else -1. However, you can''t
    put statements inside a ?:. The Scala if/else combines the if/else and ?: constructs
    that are separate in Java and C++.


    In Scala, every expression has a type. For example, the expression if (x > 0)
    1 else -1 has the type Int because both branches have the type Int. The type of
    a mixed-type expression, such as


    ```

    if (x > 0) "positive" else -1

    ```


    is the common supertype of both branches. In this example, one branch is a java.lang.String,
    and the other an Int. Their common supertype is Any. (See Section 8.11, "The Scala
    Inheritance Hierarchy," on page 100 for details.)


    If the else part is omitted, for example in


    ```

    if (x > 0) 1

    ```


    then it is possible that the statement yields no value. However, in Scala, every
    expression is supposed to have some value. This is finessed by introducing a class
    Unit that has one value, written as (). The statement without an else is equivalent
    to


    ```

    if (x > 0) 1 else ()

    ```


    Think of () as a placeholder for "no useful value," and of Unit as an analog of
    void in Java or C++.'
