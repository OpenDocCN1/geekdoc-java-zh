  md: '314 Chapter 20 Parsing


    # 20.8 Avoiding Backtracking


    Whenever an alternative p | q is parsed and p fails the parser tries q on the
    same input. This is called backtracking. Backtracking also happens when there
    is a failure in an opt or rep. Clearly, backtracking can be inefficient. For example,
    consider an arithmetic expression parser with the rules


    ```

    ```cpp

    def expr: Parser[Any] = ~ ("+" | "-\-") ~ expr | term

    def term: Parser[Any] = factor ~ "+" ~ term | factor

    def factor: Parser[Any] = """ ~ expr ~ ")") | number

    ```"

    ```


    If the expression (3+4) is parsed, the term matches the entire input. Then the
    match for + or - fails, and the compiler backtracks to the second alternative,
    parsing again.


    It is often possible to rearrange the grammar rules to avoid backtracking. For
    example:


    ```

    ```cpp

    def expr: Parser[Any] = term ~ opt("+" | "-") ~ expr

    def term: Parser[Any] = factor ~ rep("") ~ factor

    ```

    ```


    You can use the ~! operator instead of to express that there is no need to backtrack.


    ```

    ```cpp

    def expr: Parser[Any] = term ~ opt("+" | "-") ~! expr

    def term: Parser[Any] = factor ~ rep("") ~! factor

    def factor: Parser[Any] = (""" ~! expr ~ ")") | number

    ```"

    ```


    When p ~ q is evaluated and q fails, no other alternatives are tried in an enclosing
    |, opt, or rep. For example, if factor finds a "(" and expr doesn''t match, the
    parser won''t try matching number.


    # 20.9 Pakrat Parsers


    A pakrat parser uses an efficient parsing algorithm that caches previous parse
    results. This has two advantages:


    +   * Parse time is guaranteed to be proportional to the length of the input.

    * The parser can accept left-recursive grammars.


    In order to use pakrat parsing in Scala, follow these steps:


    +   1. Mix the PakratParsers trait into your parser.

    2. Use val or lazy val, not def, for each parser function. This is important because
    the parser caches these values, and it relies on them being identical. (A def
    would return a different value each time it is called).

    3. Have each parser function return PakratParser[T] instead of Parser[T].'
