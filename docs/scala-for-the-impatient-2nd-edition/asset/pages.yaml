  md: '# Chapter 17


    Writing concurrent applications that work correctly and with with high performance
    is very challenging. The traditional approach, in which concurrent tasks have
    side effects that mutate shared data, is tedious and error-prone. Scala encourages
    you to think of a computation in a functional way. A computation yields a value,
    sometime in the future. As long as the computations don''t have side effects,
    you can let them run concurrently and combine the results when they become available.
    In this chapter, you will see how to use the Future and Promise traits to organize
    computations.


    The key points of this chapter are:


    +   - A block of code wrapped in a Future { ... } executes concurrently.

    - A future succeeds with a result or fails with an exception.

    - You can wait for a future to complete, but you don''t usually want to.

    - You can use callbacks to get notified when a future completes, but that gets
    tedious when chaining callbacks.

    - Use methods such as map/FlatMap, or the equivalent for expressions, to compose
    futures.

    - A promise has a future whose value can be set (once), which gives added flexibility
    for implementing tasks that produce results.

    - Pick an execution context that is suitable for the concurrent workload of your
    computation.


    247'
