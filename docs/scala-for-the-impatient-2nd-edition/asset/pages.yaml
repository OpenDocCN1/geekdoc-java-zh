  md: "# 9.10 Regular Expressions\n\nWhen you process input, you often want to use\
    \ regular expressions to analyze it. The scala.util.matching.Regex class makes\
    \ this simple. To construct a Regex object, you can use the r method of the String\
    \ class:\n\n```\nval numPattern = \"[0-9]+\n```\n\nIf the regular expression contains\
    \ backslashes or quotation marks, then it is a good idea to use the \"raw\" string\
    \ syntax, \"\"\"\". For example:\n\nThe findAll method returns an Iterator[String]\
    \ through all matches. You can use it in a loop:\n\n```\nfor (matchString <- numPattern.findAll(\"\
    99 bottles, 98 bottles\"))\n println(matchString)\n```\n\nAlternatively, turn\
    \ the iterator into an array:\n\n```\nval matches = numPattern.findAll(\"99 bottles,\
    \ 98 bottles\").toArray\n Array(\"99\", \"98\")\n```\n\nTo find the first match\
    \ in a string, use findFirst. You get an Option[String]. See Chapter 14 for the\
    \ Option class.\n\n```\nval firstMatch = wsnumPattern.findFirst(\"99 bottles,\
    \ 98 bottles\")\n // Some(\"98\")\n```\n\n> NOTE: There is no method to test whether\
    \ a string matches the regex in entirety, but you can add anchors:\nval anchoredPattern\
    \ = \"^[0-9]+\\$\".r\n if (anchoredPattern.findFirstIn(str) != None) ...\n\nAlternatively,\
    \ use the String.matches method:\n\n```\nif (str.matches(\"[0-9]+\")) ...\n```\n\
    \nYou can replace the first match, all matches, or some matches. In the latter\
    \ case, supply a function Match => Option[String]. The Match class has information\
    \ about the match (see the next section for details). If the function returns\
    \ Some(str), the match is replaced with str.\n\n```\nnumPattern.replaceFirstIn(\"\
    99 bottles, 98 bottles\", \"XX\")\n // XX bottles, 98 bottles\n```"
