    # 13.8 Mapping a Function


    You may want to transform all elements of a collection. The map method applies
    a function to a collection and yields a collection of the results. For example,
    given a list of strings


    ```

    val names = List("Peter", "Paul", "Mary")

    ```


    you get a list of the uppercased strings as


    ```

    names.map(..upperCase) // List("PETER", "PAUL", "MARY")

    ```


    This is exactly the same as


    ```

    for (n <- names) yield n.upperCase

    ```


    If the function yields a collection instead of a single value, you may want to
    concatenate all results. In that case, use flatMap. For example


    ```

    def ulcase(s: String) = Vector(s.upperCase(), s.toLowerCase())

    ```


    Then names.map(ulcase) is


    ```

    List(Vector("PETER", "peter"), Vector("PAUL", "paul"), Vector("MARY", "mary")

    ```'
