  md: "# Chapter 6 Objects\n\nObject(arg1, ..., argN)\nTypically, such apply method\
    \ returns an object of the companion class.\nFor example, the Array object defines\
    \ apply methods that allow array creation with expressions such as\n\n```\nArray(\"\
    Mary\", \"had\", \"a\", \"little\", \"lamb\")\n```\n\nWhy doesn't you just use\
    \ a constructor? Not having the new keyword is for nested expressions, such as\n\
    \n```\nArray(1, 7), Array(2, 9))\n```\n\n> CAUTION: It is easy to confuse Array(100)\
    \ and new Array(100). The first expression calls apply(100), yielding Array[Int]\
    \ with a single element, the integer 100. The second expression invokes the constructor\
    \ this(100). The result is Array[Nothing] with 100 null elements.\n\nHere is an\
    \ example of defining an apply method:\n\n```\nclass Private (val id: Int, initialBalance:\
    \ Double) {\n  private var balance = initialBalance\n  ...\n}\n```\n\n```\nobject\
    \ Account { // The companion object\ndef apply(initialBalance: Double) = \n  new\
    \ Account(newUniqueNumber(), initialBalance)\n  ...\n}\n```\n\nNow you can construct\
    \ an account as\n\n```\nval acct = Account(1000.0)\n```\n\n# 6.5 Application Objects\n\
    \nEach Scala program must start with an object's main method of type Array[String]\
    \ => Unit:\n\n```\nobject Hello {\n  def main(args: Array[String]) {\n    println(\"\
