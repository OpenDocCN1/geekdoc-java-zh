    # 3.8 Interoperating with Java


    Since Scala arrays are implemented as Java arrays, you can pass them back and
    forth between Java and Scala.

    This works in almost all cases, except if the array type is not an exact match.
    In Java, an array of a given type is automatically converted to an array of a
    supertype. For example, a Java String[] array can be passed to a method that expects
    a Java Object[] array. Scala does not permit this automatic conversion because
    it is unsafe. (See Chapter 18 for a detailed explanation.)


    Suppose you want to invoke a Java method with an Object[] parameter, such as java.util.Arrays.binarySearch(a,
    "beef") // Does work


    ```

    val a = Array("Mary", "a", "had", "lamb", "little")njava.util.Arrays.binarySearch(a,
    "beef") // Does not work

    ```


    This does not work because Scala will not convert an Array[String] into an Array[Object].
    You can force the conversion like this:


    ```

    java.util.Arrays.binarySearch(a.asInstanceOfOf[Array[Object]], "beef")

    ```


    > NOTE: This is an example of how to overcome element type differences. If you
    want to carry binary search in Scala, do it like this:


    ```

    import scala.collection.Searching._nval result = a.search("beef")

    ```


    The result is Found(n) if the element was found at position n or InsertionPoint(n)
    if the element was not found before position n.


