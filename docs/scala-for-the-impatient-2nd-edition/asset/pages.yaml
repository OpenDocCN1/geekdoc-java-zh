  md: "# 15.6 Annotations for Optimizations\n\nSeveral annotations in the Scala library\
    \ let you control compiler optimizations. They are discussed in the following\
    \ sections.\n\n# 15.6.1 Tail Recursion\n\nA recursive call can sometimes be turned\
    \ into a loop, which conserves stack space. This is important in functional programming\
    \ where it is common to write recursive methods for traversing collections.\n\n\
    Consider this method that computes the sum of a sequence of integers using recursion:\n\
    \n```\nobject Util {\n  def sum(xs: Seq[Int]): BigInt =\n    if (xs.isEmpty) 0\
    \ else xs.head + sum(xs.tail)\n}\n```\n\nThis method cannot be optimized because\
    \ the last step of the computation is the recursive call. But a slight transformation\
    \ can be optimized:\n\n```\ndef sum2(xs: Seq[Int], partial: BigInt) =\n  if (xs.isEmpty)\
    \ partial else sum2(xs.tail, partial + partial)\n```\n\nThe partial sum is passed\
    \ as a parameter; a recursive call to call this method as sum2(xs, 0). Since the\
    \ last step of the computation is a recursive call to the same method, it can\
    \ be transformed into a loop to the top of the method. The Scala compiler automatically\
    \ applies the “tail recursion” optimization to the second method. If you try\n\
    \n```\nsum(1 to 1000000)\n```\n\nyou will get a stack overflow error (at least\
    \ with the default stack size of the JVM), but\n\n```\nsum2(1 to 1000000, 0)\n\
    ```\n\nreturns the sum 5000050000.\n\nEven though the Scala compiler will try\
    \ to use tail recursion optimization, it is sometimes blocked from doing so for\
    \ nonvious reasons. If you rely on the compiler to remove the recursion, you should\
    \ annotate your method with @tailrec. Then, if the compiler cannot apply the optimization,\
    \ it will report an error.\n\nFor example, suppose the sum2 method is in a class\
    \ instead of an object:"
