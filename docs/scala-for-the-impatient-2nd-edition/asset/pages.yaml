    In the preceding section, we saw that stream methods are computed lazily, delivering
    results only when they are needed. You can get a similar effect with other collections
    by applying the view method. This method yields a collection on which methods
    are applied lazily. For example,


    ```

    val palindromicSquares = (1 to 1000000).view

    .map(x => x * x)

    .filter(x => x.toString.reverse)

