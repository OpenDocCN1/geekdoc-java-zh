  md: '# 20.6 Avoiding Left Recursion


    If a parser function calls itself without first consuming input, the recursion
    will never stop. Consider this function that is supposed to consume any sequence
    of ones:


    ```

    def ones: Parser[Any] = ones ~ "1" | "1"

    ```


    Such a function is called left-recursive. To avoid the recursion, you can reformulate
    the grammar. Here are two alternatives:


    ```

    def ones: Parser[Any] = "1" ~ ones "1"

    ```


    or


    ```

    def ones: Parser[Any] = repl1("1")

    ```


    This problem occurs commonly in practice. For example, consider our arithmetic
    expression:


    ```

    def expr: Parser[Any] = term ~ opt("+" | "-") ~

    ```


    The rule for expr has an unfortunate effect with subtraction. The expressions
    are grouped in the wrong order. When the input is 3-4-5, the expression is parsed
    as


    ```

    / \\

    3 \n / \\

    4 5

    ```


    That is, 3 is accepted as term, and -4-5 as "-\ ~ expr. This yields a wrong answer
    of 4 instead of -6.


    Could we turn the grammar around?


    ```

    def expr: Parser[Any] = expr ~ opt("+" | "-") ~ term

    ```


    Then we would get the correct parse tree. But that doesn''t work—this expr function
    is left-recursive.


    The original version eliminates the left recursion, but at a cost—it is harder
    to compute the parse result. You need to collect the intermediate results and
    combine them in the correct order.


    Collecting intermediate results is easier if you use a repetition, which yields
    a List of the collected values. For example, an expr is a sequence of term values,
    joined by + or -:'
