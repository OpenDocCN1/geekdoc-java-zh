    # 20.3 Transforming Parser Results


    Instead of having a parser build up a complex structure of ~, options, and lists,
    you should transform intermediate outputs to a usable form. Consider, for example,
    the arithmetic expression. If it is our goal to evaluate the expression, then
    each of the functions expr, term, and factor should return the value of the parsed
    subexpression. Let''s start with


    ```

    def factor: Parser[Any] = number | "" ~ expr ~ ""

    We want it to return an Int:

    def factor: Parser[Int] = ...

    When a whole number is received, we want its integer value:

    def factor: Parser[Int] = number ^^ { .toInt } | ...

    Here, the ^^ operator applies the function { .toInt } to the result of number.

    ```


    > NOTE: There is no particular significance to the ^^ symbol. It conveniently
    has lower precedence than ~ but higher precedence than |.


    Assuming expr has changed to return a Parser[Int], we can evaluate "("expr ~ "")
    simply by returning expr, which yields an Int. Here is one way of doing that (you''ll
    see a simpler one in the next section):

    def factor: Parser[Int] = ... | "("expr ~ "")" ^^ {

    case ~ e ~ => e

    }

    In this case, the argument of the ^^ operator is the partial function { case ~
    e ~ => e }.


    > NOTE: The combinator returns an instance of the ~ case class instead of a pair
    to make matching easier. If ~ returned a pair, then you would have to write case
    ((_, e)) instead of case ~ e ~ ~.


    A similar pattern yields the sum or difference. Note that opt yields an Option:
    either None or Some(...).'
