  md: "# Chapter 5 ■ Classes\n\n```\nclass Counter {\n    private var value = 0 //\
    \ You must initialize the field\n    def increment() { value += 1 } // Methods\
    \ are public by default\n    def current() = value\n}\n```\n\nIn Scala, a class\
    \ is not declared as public. A Scala source file can contain multiple classes,\
    \ and all of them have public visibility.\n\nTo use this, you construct objects\
    \ and invoke methods in the usual way:\n\n```\nval myCounter = new Counter //\
    \ Or new Counter()\nmyCounter.increment()\nprintln(myCounter.current)\n```\n\n\
    You can call a parameterless method (such as current) with or without parentheses:\n\
    \n```\nmyCounter.current // OK\nmyCounter.increment() // Also OK\n```\n\nWhich\
    \ form should you use? It is considered good style to use () for a mutator method\
    \ (a method that changes the object state), and to drop the () for an accessor\
    \ method (a method that does not change the object state).\n\nThat's what we did\
    \ in our example:\n\n```\nmyCounter.increment() // Use () with mutator\nprintln(myCounter.current)\
    \ // Don't use () with accessor\n```\n\nYou can enforce this style by declaring\
    \ current without ():\n\n```\nclass Counter {\n    ...\n    def current = value\
    \ // No () in definition\n}\n```\n\nNow classes use myCounter.current, without\
    \ parentheses.\n\n# 5.2 Properties with Getters and Setters\n\nWhen writing a\
    \ Java class, we don't like to use public fields:\n\n```\npublic class Person\
    \ { // This is Java\n    public int age; // Frowned upon in Java\n}\n```\n\nWith\
    \ a public field, anyone could write to fred.age, making Fred younger or older.\
    \ That's why we prefer to use getter and setter methods:"
