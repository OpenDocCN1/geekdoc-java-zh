  md: '# 15.1 What Are Annotations?


    Annotations are tags that you insert into your source code so that some tools
    can process them. These tools can operate at the source level, or they can process
    the class files into which the compiler has placed your annotations.


    Annotations are widely used in Java, for example by testing tools such as JUnit
    4 and enterprise technologies such as Java EE.

    The syntax is just like in Java. For example:


    ```

    @Test(timeout = 100) def testSomeFeature() { ... }

    ```


    ```

    @Entity Credentials

    @Id @BeanProperty username : String =

    @BeanProperty var password : String =

    }

    ```


    You can use Java annotations with Scala classes. The annotations in the preceding
    examples are from JUnit and JPA, two Java frameworks that have no particular knowledge
    of Scala.


    You can also use Scala annotations. These annotations are specific to Scala and
    are usually processed by the Scala compiler or a compiler plugin. (Implementing
    a compiler plugin is a nontrivial undertaking that is not covered in this book.)


    Java annotations do not affect how the compiler translates source code into bytecode;
    they merely add data to the bytecode that can be harvested by external tools.
    In Scala, annotations can affect the compilation process. For example, the @BeanProperty
    annotation that you saw in Chapter 5 causes the generation of getter and setter
    methods.


    # 15.2 What Can Be Annotated?


    In Scala, you can annotate classes, methods, fields, local variables, and parameters,
    just like in Java.


    ```

    @Entity class Credentials {}

    @Test def testSomeFeature() {}

    @BeanProperty var username =

    def doSomething(@NotNull message: String) { }

    ```


    You can apply multiple annotations. The order doesn''t matter.


    ```

    @BeanProperty @Id var username =

    ```


    When annotating the primary constructor, place the annotation before the constructor,
    and add a pair of parentheses if the annotation has no arguments.


    ```

    class Credentials @Inject(var username: String, var password: String)

    ```'
