  md: '# 12.3 Functions with Function Parameters


    In this section, you will see how to implement a function that takes another function
    as a parameter. Here is an example:


    ```

    def valueAtOneQuarter(f: (Double) => Double) = f(0.25)

    ```


    Note that the parameter can be any function receiving and returning a Double.
    The valueAtOneQuarter function computes the value of that function at 0.25.


    For example:


    ```

    valueAtOneQuarter(ceil(_)) // 1.0

    valueAtOneQuarter(sqrt(_)) // 0.5 (because 0.5 × 0.5 = 0.25)

    ```


    What is the type of valueAtOneQuarter? It is a function with one parameter, so
    its type is written as


    ```

    (parameterType) => resultType

    ```


    The Result is clearly Double, and the parameterType is already given in the function
    header as (Double) => Double. Therefore, the type of valueAtOneQuarter is


    ```

    ((Double) => Double) => Double

    ```


    Since valueAtOneQuarter is a function that receives a function, it is called a
    higher-order function.


    A higher-order function can also produce a function. Here is a simple example:


    ```

    def mulBy(factor : Double) = (x : Double) => factor * x

    ```


    For example, mulBy(3) returns the function (x : Double) => 3 × x which is seen
    in the preceding section. The power of mulBy is that it can deliver functions
    by multiply by any amount:


    ```

    val quintuple = mulBy($)

    quintuple(20) // 100

    ```


    The mulBy has a parameter of type Double, and it returns a function of type (Double)
    => Double. Therefore, its type is


    ```

    (Double) => ((Double) => Double)

    ```


    # 12.4 Parameter Inference


    When you pass an anonymous function to another function or method, Scala helps
    you out by deducting types when possible. For example, you don''t have to write


    ```

    valueAtOneQuarter(x: Double) => 3 * x) // 0.75

    ```'
