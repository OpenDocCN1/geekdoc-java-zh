  md: "NOTE: The levels ALL and OFF are potentially confusing. The annotation @elide(ALL)\
    \ means that the method is always elided, and @elide(OFF) means that it is never\
    \ elided. But -Xelide-below OFF means to elide everything, and -Xelide-below ALL\
    \ means to elide nothing. That's why MAXIMUM and MINIMUM have been added.\n\n\
    The Predef object defines an elidable assert method. For example,\n\n```\ndef\
    \ makeMap(keys:Seq[String], values: Seq[String]) = {\n    assert(keys.length ==\
    \ values.length, \"lengths don't match\")\n}\n```\n\nIf the method is called with\
    \ mismatched arguments, the method throws an AssertionError with message failed:\
    \ lengths don't match.\n\nTo disable assertions, compile with -Xelide-below 2001\
    \ or -Xelide-below MAXIMUM. Note that by default assertions are not disabled.\
    \ This is a welcome improvement over Java assertions.\n\n> CAUTION: Calls to elided\
    \ methods are replaced with Unit objects. If you use the return value of an elided\
    \ method, a ClassException is thrown. It is best to use the @elidable annotation\
    \ only with methods that do not return a value.\n\n# 15.6.4 Specialization for\
    \ Primitive Types\n\nIt is inefficient to wrap and unwrap primitive types—but\
    \ in generic code, this often happens.\n\n```\ndef allDifferent[T](x: T, y: T,\
    \ z: T) = x != y && x != z && y != z\n```\n\nIf you call allDifferent(3, 4, 5),\
    \ each integer is wrapped into a java.lang.Integer before the method is called.\
    \ Of course, you can manually supply an overloaded version\n\n```\ndef allDifferent(x:\
    \ Int, y: Int, z: Int) = ...\n```\n\nas well as many other methods for the other\
    \ primitive types.\n\nYou can generate these methods automatically by annotating\
    \ the type parameter with @specialized:\n\n```\ndef allDifferent[@specialized\
    \ T](x: T, y: T, z: T) = ...\n```\n\nYou can restrict specialization to a subset\
    \ of types:\n\n```\ndef allDifferent[@specialized(Long, Double) T](x: T, y: T,\
    \ z: T) = ...\n```"
