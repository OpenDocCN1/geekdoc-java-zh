    # 3.4 Transforming Arrays


    In the preceding sections, you saw how to work with arrays just like you would
    in Java or C++. In Scala, you can go further. It is easy to take an array (or
    array buffer) and transform it in some way. Such transformations do not modify
    the original array but yield a new one.


    Use a comparison like this:


    ```

    val a = Array(2, 3, 5, 7, 11)

    val result = for (elem <- a) yield 2 * elem

    // result is Array(4, 6, 10, 14, 22)

    ```


    The for/yield loop creates a new collection of the same type as the original collection.
    If you started with an array, you get another array. If you started with an array
    buffer, that''s what you get from for/yield.


    The result contains the expressions after the one, for each iteration of the loop.
    Oftentimes, when you traverse a collection, you only want to process the elements
    that match a particular condition. This is achieved with a guard: an if inside
    the for. We double every even element, dropping the odd ones:


    ```

    for (elem <- a if elem % 2 == 0) yield 2 * elem

    ```


    Keep in mind that the result is a new collection—the original collection is not
    affected.'
