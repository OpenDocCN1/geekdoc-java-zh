    ```


    Use whatever you think is easier to read. Beginning Scala programmers tend to
    stick to the Java syntax, and that''s fine. Of course, even the most hardened
    Java programmers seem to prefer a + b over a.+b).


    There is one notable difference between Scala and Java or C++. Scala does not
    have ++ or -- operators. Instead, simply use +1 or -=1:


    ```

