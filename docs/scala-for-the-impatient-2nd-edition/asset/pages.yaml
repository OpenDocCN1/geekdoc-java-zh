  md: "# 21.8 Type Classes\n\nHave another look at the Ordering trait in the preceding\
    \ section. We have an algorithm that required the parameters to have an ordering.\
    \ Normally, in object-oriented programming, we would require the parameter types\
    \ to extend a trait. But that's not what happened here. In order to make a class\
    \ usable with the algorithm, it is not necessary to modify the class at all. Instead,\
    \ one provides an implicit conversion. This is much more flexible than the object-oriented\
    \ approach.\n\nA trait such as Ordering is a type class. A type class defines\
    \ some behavior, and a type can join the class by providing that behavior. (The\
    \ term comes from Haskell, and \"class\" is not used in the same way as in object-oriented\
    \ programming. Thinking of \"class\" as in a \"class action\"—types banding together\
    \ for a common purpose.)\n\nTo see how a type joins a type class, let us look\
    \ at a simple example. We want to compute averages,(xi + ... + tn)/n. To do that,\
    \ we need to be able to add two values and divide a value by an integer. There\
    \ is a type class Numeric in the Scala library, which requires that values can\
    \ be added, multiplied, and compared. But it doesn't have any requirement that\
    \ values can be divided by an integer. Therefore, let's define our own:\n\n```\n\
    trait NumberLike[T] {\n  def plus(x: T, y: T): T\n  def divideBy(x: T, n: Int):\
    \ T\n}\n```\n\nNext, to make sure that the type class is useful out of the gate,\
    \ let's add some common types as members. That's easy to do by providing implicit\
    \ objects in the companion object:\n\n```\nobject NumberLike {\n  implicit object\
    \ NumberDouble extends NumberLike[Double] {\n    def plus(x: Double, y: Double)\
    \ = x + y\n    def divideBy(x: Double, n: Int) = x / n\n  }\n\n  implicit object\
    \ NumberBigDecimal extends NumberLike[BigDecimal] {\n    def plus(x: BigDecimal,\
    \ y: BigDecimal) = x + y\n    def divideBy(x: BigDecimal, n: Int) = x / n\n  }\n\
    }\n```\n\nNow we are ready to put the type class to use. In the average method,\
    \ we need an instance of the type class so we can call plus and divideBy. (Note\
    \ that these are methods of the type class, not the type members)."
  merge: -1
