  md: "Java has several tools that allow programmers to express dependencies through\
    \ frameworks as Spring or module systems such as OSCi. Each component describes\
    \ on which other component it depends. References to actual component implementations\
    \ are “injected” when the application is assembled.\nIn Scala, you can achieve\
    \ a simple form of dependency injection with traits and self types.\nFor logging,\
    \ suppose we have a trait\n\n```\ntrait Logger { def log(msg: String) }\nwith\
    \ implementations ConsoleLogger and FileLogger.\n```\n\nThe user authentication\
    \ trait has a logging dependency to log authentication failures:\n\n```\ntrait\
    \ Auth {\n  this: Logger =>\n  def login(id: String, password: String): Boolean\n\
    }\n```\n\nThe application depends on both:\n\n```\ntrait App {\n  this: Logger\
    \ with Auth =>\n  ...\n}\n```\n\nNow we can assemble an application as\nIt’s a\
    \ bit awkward to use trait composition in this way. After all, an application\
    \ isn’t an authenticator and a file logger. It has these components, and it is\
    \ more natural to use instance variables for the components to glue them all into\
    \ one huge type. A better design is by using the cake pattern. In this pattern,\
    \ you supply a component trait for each service that contains\n\n```\nobject MyApp\
    \ extends App with FileLogger(\"test.log\") with MockAuth(\"users.txt\")\n```\n\
    \n+   - Any dependent components, expressed as self types\n- A trait describing\
    \ the service interface\n- An abstract val that will be instantiated with an instance\
    \ of the service\n- Optionally, implementations of the service interface"
