  md: "# 14.15 Simulating Enumerations\n\n> CAUTION: The toString, equals, hashCode,\
    \ and copy methods are not generated for case classes that extend other case classes.\
    \ You get a compiler warning if one case class inherits from another. A future\
    \ version of Scala may outlaw such inheritance altogether. If you need multiple\
    \ levels of inheritance to factor out common behavior of case classes, make only\
    \ the leaves of the inheritance tree case classes.\n\n# 14.14 Sealed Classes\n\
    \nWhen you use pattern matching with case classes, you would like the compiler\
    \ to check that you have exhausted all alternatives. To achieve this, declare\
    \ the common superclass as sealed:\n\n```\nsealed abstract class Amount\ncase\
    \ class Dollar(value: Double) extends Amount\ncase Currency(value: Double, unit:\
    \ String) extends Amount\n```\n\nAll subclasses of a case class must be defined\
    \ in the same file as the class itself. For example, if someone wants to add another\
    \ class for euros,\ncase class Euro(value: Double) extends Amount\nthey must do\
    \ so in the file in which Amount is declared.\n\nWhen a class is sealed, all of\
    \ its subclasses are known at compile time, enabling the compiler to check pattern\
    \ clauses for completeness. It is a good idea for all case classes to extend a\
    \ sealed class or trait.\n\n# 14.15 Simulating Enumerations\n\nCase classes let\
    \ you simulate enumerated types in Scala.\n\n```\nsealed abstract class TrafficLightColor\n\
    case object Red extends TrafficLightColor\ncase object Yellow extends TrafficLightColor\n\
    case object Green extends TrafficLightColor\n```\n\n```\ncolor match {\n  case\
    \ Red => \"stop\"\n  case Yellow => \"hurry up\"\n  case Green => \"go\"\n}\n\
    ```\n\nNote that the superclass was declared as sealed, enabling the compiler\
    \ to check that the match clause is complete."
