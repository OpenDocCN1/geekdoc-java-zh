    # ## 16.3 Element Attributes


    To process the attribute keys and values of an element, use the attributes property.
    It yields an object of type MetaData which is almost, not quite, a Map from attribute
    keys to values. You can use the () operator to access the value for a given key:


    ```

    val elem = <a href="http://scala-lang.org/">The Scala language</a>

    val url = elem.attributes("href")

    ```


    Unfortunately, this yields a node sequence, not a string, because the attribute
    might contain entity references. For example,


    ```

    val image = <img alt="San Jos&acute; State University Logo"

    src="http://www.sjsu.edu/publicaffairs/pics/sjsu_logo_color_web.jpg/>

    val alt = image.attributes("alt")

    ```


    Here, take the value for the key "alt" is a node sequence consisting of a text
    node for "San Jos", an EntityRef for &acute;, and another text node for "State
    University Logo".


    Why not resolve the entity reference? There is no way to know what &acute; means.
    In XHTML it means &#23; (the code for é), and in another document type it can
    be defined as something else.


    > > **TIP:** If you find it inconvenient to deal with entity references in XML
    literals, you can use character references instead: <img alt="San Jos&#238; State
    University Logo" ...//>.


    If you are certain you don''t have unresolved entities in your attributes, you
    can simply call the text method to turn the node sequence into a string:


    ```

    val url = elem.attributes("href").text

    ```


    If an attribute is not present, the () operator returns null. If you dislike working
    with null, use the method, which returns an Option[Seq[Node]].'
