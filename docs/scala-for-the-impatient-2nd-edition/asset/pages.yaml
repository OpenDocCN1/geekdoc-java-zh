  md: "CanBuildFrom trait has an apply method that yields an object of a type Builder[E,\
    \ To]. A Builder has methods += for adding elements into an internal buffer, and\
    \ result for producing the desired collection.\n\n```\ntrait Builder[-E, +To]\
    \ {\n  def +==(e: Unit)\n  def result(): To\n}\n```\n\n```\ntrait CanBuildFrom[-From,\
    \ -E, +To] {\n  def apply(): Builder[E, To]\n}\n```\n\nTherefore, the map method\
    \ simply constructs a builder for the target type, fills the builder with the\
    \ values of the function f, and yields the resulting collection.\n\nEach collection\
    \ provides an implicit CanBuildFrom object in its companion object. Consider a\
    \ simplified version of the ArrayBuffer class:\n\n```\nclass Buffer[E : ClassTag]\
    \ extends Iterable[E, Buffer[E]] {\n  with Builder[E, Buffer[E]] {\n    private\
    \ var elems = new Array[E](10)\n    ...\n    def iterator() = {\n      private\
    \ var i = 0\n      def hasNext() = i < length\n      def next() = { i += 1; elems(i\
    \ - 1) }\n    }\n    def +==(e: E) { ... }\n    def result() = this\n  }\nobject\
    \ Buffer {\n  implicit def canBuildFrom[E : ClassTag] = {\n    new CanBuildFrom[Buffer[_],\
    \ E, Buffer[E]]\n  }\n  def apply() = new Buffer\n}\n```\n\nConsider a buffer.map(f),\
    \ where f is a function of type A => B. The implicit bf parameter is obtained\
    \ by calling the canBuildFrom[B] method in the Buffer companion object. Its apply\
    \ method returns the builder, in this case Buffer[B].\n\nAs it happens, the Buffer\
    \ class already has a += method, and its result method returns to itself. Therefore,\
    \ a Buffer is its own builder.\n\nHowever, a builder for the Range class doesn't\
    \ return a Range, and clearly it can't. For example, (1 to 10).map(x => x * x)\
    \ has a value that isn't a Range. In the actual"
