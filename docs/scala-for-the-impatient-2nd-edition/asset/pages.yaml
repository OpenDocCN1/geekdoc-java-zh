  md: '# Chapter 13


    In this chapter, you will learn about the Scala collections library from a library
    user’s point of view. In addition to arrays and maps, which you have already encountered,
    you will see other useful collection types. There are many methods that can be
    applied to collections, and this chapter presents them in an orderly way.


    The key points of this chapter are:


    +   - All collections extend the Iterable trait.


    +   - The three major categories of collections are sequences, sets, and maps.


    +   - Scala list has mutable and empty and immutable versions of most collections.


    +   - A Scala list is either empty, or it has a head and a tail which is again
    a list.


    +   - Sets are unordered collections.


    +   - Use a LinkedHashSet to retain the insertion order or a SortedSet to iterate
    in sorted order.


    +   - adds an element to an unordered collection; + and += prepend to a sequence;
    ++ concatenates two collections; - and -- remove elements.


    +   - The Iterable and Seq traits have dozens of useful methods for common operations.
    Check them out before writing tedious loops.


    +   - Mapping, folding, and zipping are useful techniques for applying a function
    or operation to the elements of a collection.'
