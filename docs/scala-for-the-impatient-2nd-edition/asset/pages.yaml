    * When you introduce a new method in a superclass that clashes with a subclass\
    \ method\n\n> NOTE: The last case is an instance of the fragile class base problem\
    \ where a change in the superclass cannot be verified without looking at all the\
    \ subclasses. Suppose programmer Alice defines a Person class, and unbeknown to\
    \ Alice, programmer Bob defines a subclass with a method id yielding the student\
