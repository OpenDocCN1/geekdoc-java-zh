    You can call this function with many arguments as you like.

    val s = sum(1, 4, 9, 16, 25)


    The function receives a single parameter of type Seq, which we will discuss in
    Chapter 13. For now, all you need to know is that you can use a for loop to visit
    each element.


    If you already have a sequence of values, you cannot pass it directly to such
    a function. The following is not correct:

    val s = sum(1 to 5) // Error


    If the function is called with one argument, that must be a single integer, a
    range of integers. The remedy is to tell the compiler that you want the parameter
    to be considered an argument sequence. Append :_, like this:

    val s = sum(1 to 5: _*) // Consider 1 to 5 as an argument sequence


    This call syntax is nested in a recursive definition:


    ```

    def recursiveSum(args: Int*) : Int = {

    if (args.length == 0) 0

    else args.head + recursiveSum(args.tail : _)

    }

    ```


    Here, the head of a sequence is its initial element, and the tail is a sequence
    of all other elements. That''s again a Seq, and we have to use :_* to convert
    it into an argument sequence.


