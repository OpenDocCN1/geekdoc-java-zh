    In this chapter, you will learn how to work with arrays in Scala. Java and C++
    programmers usually choose an array or its close relation (such as array lists
    or vectors) when they need to collect a bunch of elements. In Scala, there are
    other choices (see Chapter 13), but for now, I''ll assume you are impatient and
    just want to get going with arrays.


    Key points of this chapter:


    +   - Use an Array if the length is fixed, and an ArrayBuffer if the length can
    vary.

    - Don''t use new when supplying initial values.

    - Use () to access elements.

    - Use for (elem <- arr) to traverse the elements.

    - Use for (elem <- arr if ...) ... to transform into a new array.

    - Scala and Java arrays are interoperable; with ArrayBuffer, use scala.collection.JavaConversions.


