  md: '# 17.8 Promises 259


    Calling future on a promise yields the associated Future object. Note that the
    method returns the future right away, immediately after starting the task that
    will eventually yield the result. That task is run after another future, defined
    by the expression Future { ... }, that is unrelated to the promise''s future.


    From the point of view of the consumer (that is, caller of the computeAnswer method),
    there is no difference between the two approaches. Either way, the consumer has
    a Future and eventually gets the result.


    The producer, has more flexibility when using a Promise. As suggested in the code
    sample, the producer can do other work before fulfilling this promise. For example,
    the producer might work on fulfilling multiple promises.


    ```

    val p1 = Promise[Int]()

    val p2 = Promise[Int]()

    Future {

    val n1 = getData(n1)

    p1.success(n1)

    val n2 = getData(n2)

    p2.success(n2)

    }

    ```


    It is also possible to have multiple tasks that work concurrently to fulfill a
    single promise. When one of the tasks has a result, it calls trySuccess on the
    promise. Unlike the success method, that method accepts the result and returns
    true if the promise has not yet completed; otherwise it returns false and ignores
    the result.


    ```

    val p = Promise[Int]()

    Future {

    var n = workHard(arg)

    p.trySuccess(n)

    }

    Future {

    var n = workSmart(arg)

    p.trySuccess(n)

    }

    ```


    The promise is completed by the first task that manages to produce the result.
    With this approach, the tasks might want to periodically call p.isCompleted to
    check whether they should continue.'
