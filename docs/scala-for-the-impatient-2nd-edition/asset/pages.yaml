  md: '# 13.6 Operators for Adding or Removing Elements


    Generally, + is used for adding an element to an unordered collection, while +:

    +: add an element to the beginning or end of an ordered collection.


    ```

    Vector(1, 2, 3) // Yields Vector(1, 2, 3, 5)

    1 += Vector(1, 2, 3) // Yields Vector(1, 1, 2, 3)

    ```


    Note that +, like all operators ending in a colon, is right-associative, and that
    it is a method of the right operand.


    These operators return new collections (of the same type as the originals) without
    modifying the original. Mutable collections have a += operator that mutates the
    left-hand side. For example:


    ```

    numbers = ArrayBuffer(1, 2, 3)

    numbers += 5 // Adds 5 to numbers

    ```


    With an immutable collection, you can use += or := with a var, like this:


    ```

    numbers = Set(1, 2, 3)

    numbers += 5 // Sets to the immutable numbers + 5

    numberVector = Vector(1, 2, 3)

    numberVector += 5 // does not work since vectors don''t have a + operator

    ```


    To remove an element, use the - operator:


    ```

    Set(1, 2, 3) - 2 // Sets(1, 3)

    ```


    You can add multiple elements with the ++ operator:


    ```

    coll ++ coll2

    ```


    yields a collection of the same type as coll that contains both coll and coll2.
    Similarly, the -- operator removes multiple elements.


    > TIP: As you can see, Scala provides many operators for adding and removing elements.
    Here is a summary:


    +   1. Append (+:) or prepend (:) to a sequence.

    2. Add (+) to an unordered collection.

    3. Remove with - operator.

    4. Use ++ and -- for bulk add and remove.

    5. Mutations are += and -= =.

    6. For lists, many Scala programmers prefer the :: and ::: operators.

    7. Stay away from ++: +==:; ++=.


    > NOTE: For lists, you can use +;: instead of := for consistency, with one exception:
    Pattern matching (case h::t) does not work with the += operator.'
