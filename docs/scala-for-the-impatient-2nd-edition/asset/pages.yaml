    # 16.5 Expressions in Attributes


    You can compute attribute values with Scala expressions, for example:


    ```

    <img src={{makeURL(fileName)}/>

    ```


    Here, the makeURL function returns a string that brings the attribute value.


    > CAUTION: Braces inside quoted strings are not evaluated. For example,

    <img src="{makeURL(fileName)}"/>


    sets the src attribute to the string "{makeURL(fileName)}", which is probably
    not what you want.


    The embedded block can also yield a node description. This is potentially useful
    if you want to include entity references or others in an attribute:


    ```

    <a id={{newAtom(1)}} ... />

    ```


    If the embedded block returns null or None, the attribute is not set. For example:


    ```

    <alt={{if description == "TODO"} null description ... />

    ```


    If description is the string "TODO" or null, the element will have no alt attribute.


    You can get the same effect with an Option[Seq[Node]]. For example,


    ```

    <alt={{if (description == "TODO" || description == null} None

    else Some(Text(description))} ... />

    ```'
