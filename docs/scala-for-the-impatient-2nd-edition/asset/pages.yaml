    For that reason, I prefer opt and rep.


    # 2.0 Discarding Tokens


    As you saw in the preceding section, it can be tedious to deal with tokens when

    analyzing a map. The tokens are required for parsing, but they can often be

    discarded after they have been matched. The -> and ~ operators are used to

    match and discard a token. For example, the result of "*" -> factor is just the
    result

    of factor, not a value of the form "* ~ f. With that notation, we can simplify
    the

    term to


    ```

    def term = factor ~ rep("*") -> factor) ^^

    case f ~ r => f * r.product

    }

    ```'
