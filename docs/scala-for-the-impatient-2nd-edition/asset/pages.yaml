  md: "# 16.8 Pattern Matching\n\nYou can use XML literals in pattern matching expressions.\
    \ For example,\n\n```\nnode match {\n  case <img> => ...\n}\n```\n\nThe first\
    \ match succeeds if node is an ing element with any attributes and no child elements.\n\
    \nTo deal with child elements is a little tricky. You can match a single child\
    \ with\n\n```\ncase <li></li> => ...\n```\n\nHowever, if li has more than one\
    \ child, for example <li>An <em>important</em>item</li>, then the match fails.\
    \ To match any number of items, use\n\n```\ncase <li>.*}</li> => ...\n```\n\n\
    Note the braces—they might remind you of the embedded code notation for XML literals.\
    \ Inside XML patterns, braces indicate code patterns, not to be evaluated.\n\n\
    Instead of the wildcard indicators, you can use variable names. The match is bound\
    \ to the variable.\n\n```\ncase <li><child></li> => child.text\n```\n\nTo match\
    \ a text node, use a class match like this:\n\n```\ncase{{Text(item)}</li> =>\
    \ ... item\n```\n\nTo bind a variable to a node sequence, use the following syntax:\n\
    \n```\ncase <li>{children @_}</li> => for (c - children) yield c\n```\n\n> CAUTION:\
    \ In such match, children is a Seq[Node] and not a NodeSeq.\n\nYou can use only\
    \ one node in the case clause. For example, the following is not legal:\n\n```\n\
    case <>{_{}/<br/> => ... // Not legal\n```\n\nXML patterns can’t have attributes.\n\
    \n```\ncase <img alt=\"TODO\"> => ... // Not legal\n```"
