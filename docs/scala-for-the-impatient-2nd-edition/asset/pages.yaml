  md: '# # Chapter 9


    In this chapter, you will learn how to carry out common file processing tasks,
    such as reading all lines or words from a file or reading a file containing numbers.

    Chapter highlights:


    +   - Source.FromFile(...).getLines yields all lines of a file.

    - Source.from(...).mString yields the file contents as a string.

    - To convert a string to a number, use the toInt or toDouble method.

    - Use the Java PrintWriter to write text files.

    - "regex".r is a Regex object.

    - Use """ if your regular expression contains backslashes or quotes.

    - If a regex pattern has groups, you can extract the file contents using the syntax
    for (regex(var1,...,var) < string).


    # ## 9.1 Reading Lines


    To read all lines from a file, call the getLines method on a scala.io.Source object:


    ```

    import scala.io.Source

    val source = Source.fromFile("myfile.txt", "UTF-8")

    // The first argument can be a string or a java.io.File

    // You can omit the encoding if you know that the file uses

    ```'
