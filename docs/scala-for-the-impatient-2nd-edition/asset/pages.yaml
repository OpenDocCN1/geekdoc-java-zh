    that your function may be called when the variable is no longer in scope.


    Here is an example: the mulBy function from Section 12.3, "Functions with Function
    Parameters," on page 160.


    ```

    def mulBy(factor : Double) = (x : Double) => factor * x

    ```


    Consider these cases:


    ```

    val triple = mulBy(3)

    val half = mulBy(0.5)

    println(s"${triple:14}") // Prints 42

    ```


    Let''s look at them in motion.


    +   1. The first call to mulBy sets the parameter factor to 3. Variable is referenced
    in the body of the function (x : Double) => factor * x, which is stored in triple.
    Then the parameter variable is popped off the runtime stack.

    2. Next, mulBy is called again, with factor set to 0.5. That variable is referenced
    in the body of the function (x : Double) => factor * x, which is stored in half.
    Each of the returned functions has its own setting for factor.


    Such a function is a closure. A closure sets of code together with the definitions
    of any nonlocal variables that the code uses.


    These functions are actually implemented as objects of a class, with an instance
    variable factor and an apply method that contains the body of the function.


    It doesn''t really matter how a closure is implemented. It is the job of the Scala
    compiler to ensure that functions can access nonlocal variables.


    > NOTE: Closures aren''t difficult or surprising if they are a natural part of
    the language. Many modern languages, such as JavaScript, Ruby, and Python, support
    closures. Java, as of version 8, has closures in the form of lambda expressions.


