  md: "# 5.2 Properties with Getters and Setters\n\n```\npublic class Person { //\
    \ This is Java\nprivate int age;\npublic int getAge() { return age; }\npublic\
    \ void setAge(int age) { this.age = age; }\n}\n```\n\nA getter/setter pair such\
    \ as this is often called a property. We say that the class Person has an age\
    \ property.\n\nWhy is this any better? By itself, it isn't. Any client can call\
    \ fred.setAge(21), keeping him forever twenty-one.\n\nBut if that becomes a problem,\
    \ we can guard against it:\n\n```\npublic void setAge(int newValue) { if (newValue\
    \ > age) age = newValue;\n// Can't get younger\n```\n\nGetters and setters are\
    \ better than public fields because they let you start with simple get/set semantics\
    \ and evolve them as needed.\n\n> NOTE: Just because getters and setters are better\
    \ than public fields doesn't mean they are always good. It is plainly bad if every\
    \ client can get set and pieces of an object's state. In this section, I show\
    \ you how to implement properties in Scala. It is up to you to choose wisely when\
    \ a gettable/settable property is an appropriate design.\n\nScala provides getter\
    \ and setter methods for every field. Here, we define a public field:\n\n```\n\
    class Person {\n  var age = 0\n}\n```\n\nScala scales the getter and setter methods\
    \ called age=. These methods are public because we did not declare age as private.\
    \ For a private field, the getter and setter methods are.\n\nIn Scala, the getter\
    \ and setter methods are called age=. For example,\n\n```\nprint(fred.age) //\
    \ Calls the method fred.age()\nfred.age = 21 // Calls fred.age=(21)\n```\n\nIn\
    \ Scala, the getters and setters are not named getXXX and setXXX, but they fulfill\
    \ the same purpose. Section 5.5, \"Bean Properties,\" on page 61 shows how to\
    \ generate Java-style getXXX and setXXX methods, so that your Scala classes can\
    \ interoperate with Java tools."
