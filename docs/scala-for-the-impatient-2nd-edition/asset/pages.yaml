    # 18.4 View Bounds


    In the preceding section, we had an example of an upper bound:


    ```

    class Pair[T <: Comparable[T]]

    ```


    Unfortunately, if you try constructing a new Pair(4, 2), the compiler complains
    that Int is not a subtype of Comparable[Int]. Unlike the java.lang.Integer wrapper
    type, the Scala Int type does not implement Comparable. However, RichInt implements
    Comparable[Int], and there is an implicit conversion from Int to RichInt. (See
    Chapter 21 for more information on implicit conversions.)

    A solution is to use a "view bound" like this:


    ```

    class Pair[T & Comparable[T]]

    ```


    The relation means that T can be converted to a Comparable[T] through an implicit
    conversion.

    However, view bounds are on their way in Scala. If you compile with the -future
    flag, you''ll get a warning when you use them. You can replace a view bound with
    a "type constraint" (see Section 18.8, “Type Constraints,” on page 269), like
    this:


    ```

    class Pair[T](val first: T, val second: T)(implicit ev: T => Comparable[T]) {

    defef smaller = if (first.compareTo(second) < 0) first else second


    }

    ```


