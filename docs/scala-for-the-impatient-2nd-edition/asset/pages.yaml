  md: '# # Chapter 2


    In this chapter, you will learn how to implement conditions, loops, and functions
    in Scala. You will encounter a fundamental difference between Scala and other
    programming languages. In Java or C++, we differentiate between expressions (such
    as 3 + 4) and statements (for example, an if statement). An expression has a value;
    a statement carries out an action. In Scala, almost all constructs have values.
    This feature can make programs more concise and easier to read.


    Here are the highlights of this chapter:


    +   * An if expression has a value.

    * A block has a value—the value of its last expression.

    * The Scala for loop is like an “enhanced” Java for loop.

    * Semicolons are (mostly) optional.

    * The void type is Unit.

    * Avoid using return in a function.

    * Beware of missing = in a function definition.

    * Exceptions work just like in Java or C++, but you use a “pattern matching” syntax
    for catch.

    * Scala has no checked exceptions.'
