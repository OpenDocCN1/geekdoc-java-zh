  md: '# 15.3 Annotation Arguments


    You can also annotate expressions. Add a colon followed by the annotation, for
    example:


    ```

    (myMap.get(key): @unchecked) match { ... }

    // The expression myMap.get(key) is annotated

    ```


    You can annotate type parameters:


    ```

    class MyContainer[@specialized T]

    ```


    Annotations on an actual type are placed after the type, like this:


    ```

    def country: String @Localized

    ```


    Here, the String type is annotated. The method returns a localized string.


    # 15.3 Annotation Arguments


    Java annotations can have named arguments, such as


    ```

    @Test(timeout = 100, expected = classOf[IOException])

    ```


    However, if the argument name is value, it can be omitted. For example:


    ```

    @Named("creds") var credentials: Credentials = -

    // The value argument is "creds"

    ```


    If the annotation has no name, the parentheses can be omitted:


    ```

    @Entity class Credentials

    ```


    Most annotations have defaults. For example, the timeout of the JUnit Test annotation
    has a default value of 0, indicating no timeout. The expected argument has a default
    dummy class to signify that no exception is expected. If you use


    ```

    @def testSomeFeature() { ... }

