    # 16.9 Modifying nodes and Attributes


    In Scala, XML nodes and node sequences are immutable. If you want to edit a node,
    you have to create a copy of it, making any needed changes and copying what hasn''t
    changed.


    To copy an Element, use the copy method. It has five named parameters: the familiar
    label, attributes, and child, well as prefix and scope which are used for namespaces
    (see Section 16.12, "Namespaces," on page 242). Any parameters that you don''t
    specify are copied from the original element. For example:


    ```

    val list = <ul><li>Fred</li><li>Wilma</li></li></ul>

    val list2 = list.copy(li="ol")

    ```


    makes a copy of list, changing the label from ul to ol. The children are shared,
    but that''s OK since node sequences are immutable.


    To add a child, make a copy to do this like:


    ```

    list.copy(child) = list.child << <li>Another item</li>

    ```


    To add or change an attribute, use the % operator:


    ```

    val image = <img src="hamster.jpg"/>

    val image2 = image % Attribute(null, "alt", "An image of a hamster", Null)

    ```


    The first argument is the namespace. The last one is a list of additional metadata.
    Just Node extends NodeSeq, the Attribute trait extends Metadata. To add more than
    one attribute, you can chain them like this:


    ```

    val image3 = image % Attribute(null, "alt", "An image of a frog",

    Attribute(null, "src", "frog.jpg", Null)

    ```


    > CAUTION: Here, scala.xml.Null is an empty attribute list. It is not the scala.Null
    type.


    Adding an attribute with the same key replaces the existing one. The image3 element
    has a single attribute with key "src"; its value is "frog.jpg".'
