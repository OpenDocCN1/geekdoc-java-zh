- img_proc: true
  md: 'These statements are executed during construction of any object incorporating
    the trait.


    Constructors execute in the following order:


    +   1. The superclass constructor is called first.

    2. Trait constructors are executed after the superclass constructor but before
    the class constructor.

    3. Traits are constructed left-to-right.

    4. Within each trait, the parents get constructed first.

    5. If multiple traits share a common parent, and that parent has already been
    constructed, it is not constructed again.

    6. After all traits are constructed, the subclass is constructed.


    For example, consider this class:


    ```

    class SavingsAccount extends Account with Logger with ShortLogger

    ```


    The constructors execute in the following order:


    +   1. Account (the superclass).

    2. Logger (the parent of the first trait).

    3. Logger (the first trait).

    4. ShortLogger (the second trait). Note that its Logger parent has already been
    constructed.

    5. SavingsAccount (the class).


    > NOTE: The constructor ordering is the reverse of the linearization of the class.
    The linearization is a technical specification of all supertypes of a type. It
    is defined by the rule:

    If C extends C1 with C2 with ... with Cn, then lin(C) = C >> lin(Cn) >> ... >>
    lin(C2) >> lin(C1)

    Here, » means "concatenate and remove duplicates, with the right winning out.".
    For example,


    ```

    lin(SavingsAccount)

    = SavingsAccount >> lin(ShortLogger) >> lin(FileLogger) >> lin(Account)

    = SavingsAccount >> (ShortLogger >> Logger) >> (FileLogger >> Logger) >> lin(Account)

    = SavingsAccount >> ShortLogger >> FileLogger >> Logger >> Account.

    ```


    (For simplicity, I omitted the types ScalaObject, AnyRef, and Any that are at
    the end of any linearization.)'
  merge: -1
