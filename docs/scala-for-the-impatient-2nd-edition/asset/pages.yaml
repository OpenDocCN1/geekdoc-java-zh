  md: '# 17.6 Other Future Transformations


    NOTE: Like the Future trait, the Try class from Section 17.3, "The Try Class,"
    on page 251 has map and flatMap methods. A Try[T] is a collection of hopefully,
    one element. It is just like a Future[T], except you don''t have to wait. You
    can apply map with a function that flattens the result, or flatMap if you have
    Try-valued function and want to flatten the result. For example, here is how to
    compute the sum of two function calls that might fail:


    In this way you can compose Try-valued functions and you don''t to deal with the
    boring part of error handling.


    # 17.6 Other Future Transformations


    The map and flatMap methods that you saw in the preceding section are the most
    fundamental transformation of Future objects.


    Table 17–1 shows several ways of applying functions to the contents of a future
    that differ in subtle details.


    The foreach method works exactly like it does for collections, applying a method
    for its side effect. The method is applied to the single value in the future.
    It is convenient for harsening the answer when it materializes.


    ```

    val combined = for (n1 <- future); n2 <- future) yield n1 + n2

    combined.foreach(n => println("Result: %s\n"))"

    ```


    The recover method accepts a particular that can turn an exception into a successful
    result. Consider this:


    ```

    val f = Future { persist(data) } recover { case: SQLException => 0 }

    ```


    The fallback method provides a recovery mechanism. When you call f.fallback(f2),
    it returns a different future if f fails, and its value becomes the value of the
    future. However, f2 cannot inspect the reason for the failure.


    The failed method turns a failed Future[T] into a successful Future[Throwable],
    just like the Try.failed method. You can retrieve the failure in a expression
    like this:


    ```

    val f = Future { ... }\nfor (ex <- f.failed) println(ex)

    ```


    Finally, you can zip two futures together. The f1.zip(f2) yields a future whose
    result is a pair (v, w) if v was the result of f1 and w the result of f2, or an
    exception if f1 or f2 failed. (If both fail, the exception of f1 is reported.)'
