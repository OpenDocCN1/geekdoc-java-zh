  md: '# 8.11 The Scala Inheritance Hierarchy


    > NOTE: At the root of the construction order problem lies a design decision of
    the Java language—namely, to allow the invocation of subclass methods in a superclass
    constructor. In C++, an object''s virtual function table pointer is set to the
    table of the subclass when the superclass constructor executes. Afterwards, the
    pointer is set to the subclass table. Therefore, in C++, it is not possible to
    modify constructor behavior through overriding. The Java designers felt that this
    subtlety was unnecessary, and the Java virtual machine does not adjust the virtual
    function table during construction.


    Figure 8-1 shows the inheritance hierarchy of Scala classes. The classes that
    correspond to the primitive types in Java, as well as the type AnyVal. You can
    also define your own value classes—see Section 8.13, "Classes," on page 103.


    All other classes are subclasses of the AnyRef class. When compiling to the Java
    virtual machine, this is a synonym for the java.lang.Object class.


    Both AnyVal and AnyRef extend Any, the root of the hierarchy.


    The Any class defines isInstanceOf, asInstanceOf, and the methods for equality
    and hash codes that we will look at in Section 8.12, "Object Equality," on page
    102.


    AnyVal does not add any methods. It is just a marker for value types.


    The AnyRef class adds the methods wait and notify/notifyAll from the Object class.
    It also provides a synchronized method with a function parameter. That method
    is the equivalent of a synchronized block in Java. For example,


    ```

    account.balance += amount {

    ```


    > NOTE: Just in Java, I suggest you stay away from wait, notify, and synchronized
    units unless you have a good reason to use them instead of higher-level concurrency
    constructs.


    All Scala classes implement the marker interface Serializable, which has no methods.
    At the other end of the hierarchy are the Nothing and Null types. Null is the
    type whose sole instance is the value null. You can assign null to any reference,
    but not to one of the value types. For example, setting an Int to null is not
    possible. This is better than in Java, where it would be possible to set an Integer
    wrapper to null.'
