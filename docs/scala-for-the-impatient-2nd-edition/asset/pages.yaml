    Inside the JVM, a Scala Array is implemented as a Java array. The arrays in the
    preceding example have the type java.String[] inside the JVM. An array of Int,
    Double, or any equivalent of the primitive types is a primitive type array. For
    example, Array(2,5,7,11) is an int[] in the JVM.


    # 3.2 Variable-Length Arrays: Array Buffers


    Java and C++ have vector for arrays that grow and shrink on demand. The equivalent
    in Scala is the ArrayBuffer.


    ```

    import scala.collection.mutable.ArrayBuffer

    val b = ArrayBuffer[Int]()

    // An empty array buffer, ready to hold integers

    b += 1

    // Add an element at the end with +=

    b += (1, 2, 3, 5)

    ArrayBuffer(1, 2, 3, 5)

    // Add multiple elements at the end by enclosing them in parentheses

    b += Array(8, 13, 21)

    ArrayBuffer(1, 2, 3, 5, 8, 13, 21)

    // You can append any collection with the += operator

    b.trimEnd(5)

    ArrayBuffer(1, 1, 2)

    // Removes the last five elements

    ```


    Adding or removing elements at the end of an array buffer is efficient ("amortized
    constant time") operation.'
