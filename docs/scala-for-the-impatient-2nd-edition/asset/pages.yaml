  md: "# 21.10 The implicitNotFound Annotation\n\nThe implicitNotFound annotation\
    \ raises an error message when the compiler cannot construct an implicit parameter\
    \ of the annotated type. The intent is to give a useful error message to the programmer.\
    \ For example, the <<-From<<To> class is annotated as\n\n```\nimplicitNotFoundMsg\
    \ = \"Cannot find ${From} << ${To}.\"\nababstract class[-From, +To] extends Function1[From,\
    \ To]\n```\n\nFor example, if you call\n\n```\nfirstLast[String, List[Int]](1,\
    \ 2, 3))\n```\n\nthen the error message is\n\n```\nCannot prove that <<: Iterable[String]\n\
    ```\n\nThat is more likely to give the programmer a hint for the default\n\n```\n\
    Could not find implicit value for parameter ev: <<[List[Int], Iterable[String]]\n\
    ```\n\nNote that ${From} and ${To} in the error message are replaced with the\
    \ type parameters From and To of the annotated class.\n\n# 21.11 CanBuildFrom\
    \ Demystified\n\nIn Chapter 1, I wrote that you should ignore the implicit CanBuildFrom\
    \ parameter. Now you are finally ready to understand how it works.\n\nConsider\
    \ the map method. Simplifying slightly, map is a method of Iterable[A, Rep] with\
    \ the following implementation:\n\n```\ndef map[B, That](f : (A) => B)(implicit\
    \ bf: CanBuildFrom[Repr, B, That]): That = {\n  val builder = bf()\n  var iter\
    \ = iterator()\n  while (iter.hasNext) { builder += iter.next() }\n  builder.result\n\
    }\n```\n\nHere, Rep is the \"representation type.\" That parameter will enable\
    \ us to create appropriate builders for unusual collections such as Range or String.\n\
    \n> NOTE: In the Scala library, map is actually defined in the TraversableLike[A,\
    \ Rep] trait. That way, the more commonly used Iterable trait doesn't need to\
    \ carry it with the Rep type parameter.\n\nThe CanBuildFrom[From, E, To] trait\
    \ provides evidence that it is possible to create a collection of values of type\
    \ To, that is compatible with From. Before discussing how these objects are generated,\
    \ let's see what they do."
