  md: '# # Chapter 5


    In this chapter, you will learn how to implement classes in Scala. If you know
    classes in Java or C++, you won''t find this difficult, and you will enjoy the
    much more concise notation of Scala.


    The key points of this chapter are:


    +   - Fields in classes automatically come with getters and setters.

    - You can replace a field with a custom getter/setter without changing the client
    of a class—that is the "uniform access principle."

    - Use the @propertyPath annotation to generate the JavaBeans getXXX/setXXX methods.

    - Every class has a primary constructor that is “interwoven” with the class definition.
    Its parameters turn into the fields of the class. The primary constructor executes
    all statements in the body of the class.

    - Auxiliary constructors are optional. They are called this.


    # ## 5.1 Simple Classes and Parameterless Methods


    In its simplest form, a Scala class looks very much like its equivalent in Java
    or C++:'
