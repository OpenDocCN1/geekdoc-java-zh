  md: "# 15.6 Annotations for Optimizations\n\n```\nclass Util {\n  @tailrec sum2(xs:\
    \ Seq[Int], partial: BigInt): BigInt =\n    if (xs.isEmpty) partial else sum2(xs.tail,\
    \ xs.head + partial)\n  \n}\n```\n\nThe program fails with an error message \"\
    could not optimize @tailrec annotated method sum2: it is neither private nor final\
    \ so it cannot be overridden. In this situation, you move the method to an object,\
    \ or you can declare it as private or final.\n\n> **NOTE:** A more general mechanism\
    \ for recursion elimination is \"trampolining\". A trampoline implementation runs\
    \ a loop that keeps calling functions. Each function returns the next function\
    \ to be called. Tail recursion is a special case where each function returns itself.\
    \ The more general mechanism allows for mutual calls—see the example that.\n\n\
    Scala has a utility called TailCalls that makes it easy to implement a trampoline.\
    \ mutually recursive functions have type TailRec[A] and return either done(result)\
    \ or tailcall(fun) where fun is the next function to be called. This needs a parameterless\
    \ function that also returns a TailRec[A]. Here is a simple example:\n\n```\n\
    import scala.util.control.TailCalls\ndef evenLength(xs: Seq[Int]): TailRec[Boolean]\
    \ =\n  if (xs.isEmpty) done(true) else tailcall(oddLength(xs.tail))\ndef oddLength(xs:\
    \ Seq[Int]): TailRec[Boolean] =\n  if (xs.isEmpty) done(false) else tailcall(evenLength(xs.tail))\n\
    ```\n\nTo obtain the final result from the TailRec object, use the result method:\n\
    even(1 to 1000000).result\n\n# 15.6.2 Jump Table Generation and Inlining\n\nIn\
    \ C++ or Java, a switch statement can be compiled into a jump table, which is\
    \ more efficient than a sequence of if/else expressions. Scala attempts to generate\
    \ jump tables for match clauses. The @switch annotation lets you check whether\
    \ a Scala match clause is compiled into one. Apply the annotation to the expression\
    \ preceding a match clause:\n\n```\n(n) match {\n  case 0 => \"Zero\"\n  case\
    \ 1 => \"One\"\n  case _ => \"\"\n}\n```"
