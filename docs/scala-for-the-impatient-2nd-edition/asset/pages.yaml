  md: "# 5.3 Properties with Only Getters\n\n> TIP: It may sound scary that Scala\
    \ generates getter and setter methods for every field. But you have some control\
    \ over this process.\n\n+   - If the field is private, the getter and setter are\
    \ private.\n- If the field is a val, only a getter is generated.\n- If you don't\
    \ want any getter or setter, declare the field as private[this] (See Section 5.4,\
    \ \"Object-Private Fields,\" on page 60).\n\n# 5.3 Properties with Only Getters\n\
    \nSometimes you want a read-only property with a getter but no setter. If the\
    \ value of the property never changes after the object has been constructed, use\
    \ a val field:\n\n```\nclass Message {\n  val timestamp = java.time.Instant.now\n\
    }\n```\n\nThe Scala compiler produces a Java class with a private final field\
    \ and a public getter, but no setter.\n\nSometimes, however, you want a property\
    \ that a client can't set at will, but that is mutated in some other way. The\
    \ Counter class from Section 5.1, \"Simple Classes and Parameterless Methods,\"\
    \ on page 55 is a good example. Conceptually, the counter has a current property\
    \ that is updated when the increment method is called, but there is no setter\
    \ for the property.\n\nYou can't implement such a property with a val—a val never\
    \ changes. Instead, provide a private field and a property, like this:\n\n```\n\
    class Counter {\n  private var value = 0\n  def increment() { value += 1 }\n \
    \ def current = value // No () in declaration\n}\n```\n\nNote that there is no\
    \ ( ) in the definition of the getter method. Therefore, you must call the method\
    \ without parentheses:\n\n```\nval n = myCounter.current // Calling myCounter.current()\
    \ is a syntax error\n```\n\nTo summarize, you have four choices for implementing\
    \ properties:\n\n+   - var foo: Scala synthesizes a getter and a setter.\n- val\
    \ foo: Scala synthesizes a getter."
