    # 18.10 Co- and Contravariant Positions


    In the preceding section, you saw that functions are contravariant in their arguments
    and covariant in their results. Generally, it makes sense to use covariance for
    the values an object consumes, and contariance for the values it produces. (Aide-mémoire:
