  md: '# # Chapter 21


    Implicit conversions and implicit parameters are Scala’s power tools that do useful
    work behind the scenes. In this chapter, you will learn how implicit conversions
    can be used to enrich existing classes, and how implicit objects are summoned
    automatically to carry out conversions or other tasks. With implicits, you can
    provide elegant libraries that hide tedious details from library users.

    The key points of this chapter are:


    +   * Implicit conversions are used to convert types.

    * You must import implicit conversions so that they are in scope.

    * An implicit parameter list requests objects of a given type. They can be obtained
    from implicit objects that are in scope, or from the companion object of the desired
    type.

    * If an implicit parameter is a single-argument function, it is also used as an
    implicit conversion.

    * A context bound of a type parameter requires the existence of an implicit object
    of the given type.

    * If it is possible to locate an implicit object, this can serve as evidence that
    a type conversion is valid.'
