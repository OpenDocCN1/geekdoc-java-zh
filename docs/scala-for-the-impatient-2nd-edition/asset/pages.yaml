  md: '# Chapter 21 ■ Implicits


    # 21.5 Implicit Parameters


    A function or method can have a parameter list that is marked implicit. In that
    case, the compiler will look for default values to supply with the function call.
    Here is a simple example:


    ```

    class Delimiters(left: String, right: String)

    ```


    ```

    def quote(what: String)(implicit delims: Delimiters) =

    delims.left + what + delims.right

    ```


    ```

    quote("Bonjour le monde")

    ```


    In that case, the compiler will look for an implicit value of type Delimiters.
    This must be a value that is declared as implicit. The compiler looks for such
    an object in two places:


    +   - Among all and def of the desired type that are in without a prefix.

    - In the companion object of a type that is associated with the desired type.
    Associated types include the desired type itself, and if it is a parameterized
    type, its parameters.


    In our example, it is useful to make an object, such as


    ```

    object FrenchPunctuation {

    implicit val quoteDelimiters = Delimiters("", "")

    }

    ```


    Then imports all values from the object:

    import FrenchPunctuation._nnor just the specific value:

    import FrenchPunctuation.quoteDelimiters

    Now the French delimiters are supplied implicitly to the quote function.


    > NOTE: There can only be one implicit value for a given data type. Thus, it is
    not a good idea to use implicit parameters of common types. For example, quote(what:
    String)(implicit left: String, right: String) // No! would not work—one could
    supply two different strings.'
