  md: '# Chapter 7


    In this chapter, you will learn how packages and import statements work in Scala.
    Both packages and imports are more regular than in Java; they are also a bit more
    flexible.


    The key points of this chapter are:


    +   * Packages nest just like inner classes.

    * Package paths are not absolute.

    * A chain x.y.z in a package clause leaves the intermediate packages x and x.y
    invisible.

    * Package statements without braces at the top of the file extend to the entire
    file.

    * A package object can hold functions and variables.

    * Import statements can import packages, classes, and objects.

    * Import statements can be anywhere.

    * Import statements can rename and hide members.

    * java.lang, scala, and Predef are always imported.'
