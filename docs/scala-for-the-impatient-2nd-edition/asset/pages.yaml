  md: '# 14.17 Partial Functions


    A set of clauses enclosed in braces is a partial function—a function which may
    not be defined for all inputs. It is an instance of a class PartialFunction[A,
    B]. (A is the parameter type, B the return type.) That class has two methods:
    apply, which computes the function value from the matching pattern, and isNotDefined,
    which returns true if the input matches one of the patterns.


    For example:


    ```

    val f: PartialFunction[Char, Int] = { case ''+'' => 1; case ''-'' => -1 }

    f(''-'') // Calls f.apply(''-''), returns -1

    f.isNotDefined(''0'') // false

    f(''0'') // Throws MatchError

    ```


    Some methods accept a PartialFunction as a parameter. For example, the collect
    method of the GenTraversable trait applies a partial function to all elements
    it is defined, and returns a case of the results:


    ```

    "-344".collect { case ''+'' => 1; case ''-'' => -1 } // Vector(-1,0)

    ```


    The partial function expression must be in a context where the compiler can infer
    the return type. It is the case when you assign it to a type variable or pass
    it as an argument.


    > NOTE: An exhaustive set of case clauses defines a Function, not just a PartialFunction,
    that you can pass whenever a function is expected.


    ```

    "-344".map { case ''+'' => 1; case ''-'' => -1; case _ => 0 }

    // Vector(-1, 0, 0)

    ```


    A Seq[A] is a PartialFunction[Int, A], and a Map[K, V] is a PartialFunction[K,
    V]. For example, you can pass a map to collect:


    ```

    val names = Array("Alice", "Bob", "Carmen")nval scores = Map("Alice" => 10, "Carmen"
    => 7)

    names.count(scores) // Yields Array(10, 7)

    ```


    The lift method transforms a PartialFunction[T, R] into a regular function with
    return type Option[R].


    ```

    val f: PartialFunction[Char, Int] = { case ''+'' => 1; case ''-'' => -1 }

    val g = f.lift // A function with type => Option[Int]

    ```


    Now g(''-'') is Some(-1) and g(''\0$'') is None.


    In Chapter 9, you that saw that the Regex.replaceSomeIn method requires a function
    String => Option[String]. If you have a map (or some other PartialFunction), you
    can use lift to produce such a function:'
