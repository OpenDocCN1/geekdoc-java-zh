  md: "# Chapter 10 ■ Traits\n\n```\ntrait ShortLogger extends Logger {\n    override\
    \ def log(msg: String) {\n        super.log\n        if (msg.length << 15) else\
    \ s$\"${msg.substring(0, 12)}...\"\n    }\n}\n```\n\nNote that each of the log\
    \ methods passes a modified message to super.log.\nWith traits, super.log does\
    \ not have the same meaning as it does with classes. Instead, super.log calls\
    \ the log method of another trait, which depends on the order in which the traits\
    \ are added.\n\nTo see how the order matters, compare the following two examples:\n\
    val acct1 = new SavingsAccount with TimestampLogger with ShortLogger\nval acct2\
    \ = new SavingsAccount with ShortLogger with TimestampLogger\n\nIf we overdraw,\
    \ we get a message\nSun Feb 06 17:45:45 ICT 2011 Insufficient...\nAs you can see,\
    \ the ShortLogger's log method was called first, and the call to super.log called\
    \ the TimestampLogger.\nHowever, overdrawing acct2 yields\nSun Feb 06 1...\n\n\
    Here, the TimestampLogger appeared last in the list of traits. Its log message\
    \ was called first, and the result was subsequently shortened.\nFor simple mixin\
    \ sequences, the \"back to front\" rule will give you the right intuition. See\
    \ Section 10, \"Trait Construction Order,\" on page 130 for the details that arise\
    \ when the traits form an arbitrary tree and not just a chain.\n\n> NOTE: With\
    \ traits, you cannot tell from the source code which method is invoked by super.someMethod.\
    \ The exact method depends on the ordering of the traits in the object or class\
    \ that uses them. This makes super far more flexible than in plain inheritance.\n\
    \n> NOTE: If you want to control which trait's method is invoked, you can specify\
    \ it in brackets: super[Console].log(...). The specified type must be an immediate\
    \ supertype; you cannot access traits or classes that are further away in the\
    \ inheritance hierarchy."
