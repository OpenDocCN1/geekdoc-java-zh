  md: '# 2.12 Exceptions


    Lazy values are useful to delay costly initialization statements. They can also
    deal with other initialization issues, such as circular dependencies. Moreover,
    they are essential for developing lazy data structures—see Section 13.12, “Streams,”
    on page 189.


    ```

    You can think of lazy values as halfway between val and def. Compare

    words = scala.io.Source.FromFile("/usr/share/dict/words").mkString

    // Evaluated as soon as words is defined

    lazy val words = scala.io.Source.FromFile("/usr/share/dict/words").mkString

    // Evaluated the first time words is used

    def words = scala.io.Source.FromFile("/usr/share/dict/words").mkString

    // Evaluated every time words is used

    ```


    > NOTE: Laziness is not cost-free. Every time a lazy value is accessed, a method
    is called that checks, in a threadsafe manner, whether the value has already been
    initialized.


    # 2.12 Exceptions


    Scala exceptions work the same way as in Java or C++. When you throw an exception,
    for example


    ```

    throw new IllegalArgumentException("x should not be negative")

    ```


    the current computation is aborted, and the runtime system looks for an exception
    handler that can accept an IllegalArgumentException. Control resumes with the
    innermost handler. If no such handler exists, the program terminates.


    In Java, the objects that you need to belong to a subclass of java.lang.Throwable.
    However, unlike Java, Scala has no “checked” exceptions—you never have to declare
    that a function or method throw an exception.


    > NOTE: In Java, “checked” exceptions are checked at compile time. If your method
    might throw an IOException, you must declare it. This forces programmers to think
    those exceptions should be handled, which is a laudable goal. Unfortunately, it
    can also give rise to monstrous methods such as doSomething() throws IOException,
    InterruptedException, NotFoundException. Many Java programmers detest this feature
    and end it by either catching exceptions too early or using excessively general
    exception classes. The Scala designers decided against exceptions, recognizing
    that thorough compile-time checking isn''t always a good thing.'
