  md: "# 6.6 Enumerations\n\nInstead of providing a main method for your application,\
    \ you can extend the App trait and place the program code into the constructor\
    \ body:\n\n```\nobject Hello extends App {\n  println(\"Hello, World!\")\n}\n\
    ```\n\nIf you need the command-line arguments, you can get them from the args\
    \ property:\n\n```\nobject Hello extends App {\n  if (args.length > 0) {\n   \
    \ println(f\"Hello ${args(0)}\")\n  } else {\n    println(\"Hello, World\")\n\
    \  }\n```\n\nIf you invoke the application with the scala.time option, then the\
    \ elapsed time is displayed when the program exits.\n\n```\n$ scalac Hello.scala\n\
    $ scala -Dscala.time Hello Fred\nHello, Fred\n[total 4ms]\n```\n\nAll involves\
    \ a bit of magic. The App trait extends another trait, DelayedInit, that gets\
    \ special handling from the compiler. All initialization code of a class with\
    \ that trait is moved into a delayedInit method. The main of the App trait captures\
    \ the command-line arguments, calls the delayedInit method, and optionally prints\
    \ the elapsed time.\n\n> NOTE: Older versions of Scala had an Application trait\
    \ for the same purpose. That trait carried out the program's action in the static\
    \ initializer, which is not optimized by the just-in-time compiler. Use the App\
    \ trait instead.\n\n# 6.6 Enumerations\n\nUnlike Java or C++, Scala does not have\
    \ enumerated types. However, the standard library provides an Enumeration helper\
    \ class that you can use to produce enumerations.\n\nDefine an object extends\
    \ the Enumeration class and initialize each value in your enumeration with a call\
    \ to the Value method. For example:\n\n```\nobject TrafficLightColor extends Enumeration\
    \ {\n  val Red, Yellow, Green = Value\n}\n```"
