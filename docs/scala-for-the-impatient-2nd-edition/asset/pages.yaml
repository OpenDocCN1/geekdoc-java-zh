  md: 'In Scala, all operators are left-associative except for


    +   - operators that end in a colon (:)


    +   - assignment operators


    In particular, the :: operator for constructing lists is right-associative. For
    example,


    ```

    1 :: 2 :: Nil

    ```


    means


    ```

    1 :: (2 :: Nil)

    ```


    This is as it should bewe first need to form the list containing 2, and that list
    becomes the tail of the list whose head is 1.


    A right-associative binary operator is a method of its second argument. For


    ```

    2 :: Nil

    ```


    means


    ```

    Nil::(2)

    ```


    # 11.7 The apply and update Methods


    Scala lets you extend the function call syntax


    ```

    f(arg1, arg2, ...)

    ```


    to other values than functions. If f is not a function or method, then this expression
    is equivalent to the call


    ```

    f.apply(arg1, arg2, ...)

    ```


    unless it occurs to the left of an assignment. The expression


    ```

    f(arg1, arg2, ...) = value

    ```


    corresponds to the call


    ```

    f.update(arg1, arg2, ..., value)

    ```


    This mechanism is used in arrays and maps. For example,


    ```

    val scores = new scala.collection.mutable.HashMap[String, Int]

    scores("Bob") = 100 // Calls scores.update("Bob", 100)

    val bobsScore = scores("Bob") // Calls scores.apply("Bob")

    ```


    The apply method is also commonly used in companion objects to construct objects
    without calling new. For example, consider a Fraction class.'
