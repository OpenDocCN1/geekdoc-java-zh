  md: "# 10.2 Traits as Interfaces\n\n![](img/9468ae1ab6d9bb5b638fb89107936395_145_0.png)\n\
    \nFigure 10–1 Diamond inheritance must merge common fields.\n\nScala has traits\
    \ instead of interfaces. A trait can have abstract and concrete methods, as well\
    \ as state, and a class can implement multiple traits. This neatly solves the\
    \ problem of Java interfaces. You will see in the following sections how Scala\
    \ deals with the perils of conflicting features from multiple traits.\n\n# 10.2\
    \ Traits as Interfaces\n\nLet’s start with something familiar. A Scala trait can\
    \ work exactly like a Java interface. For example:\n\n```\ntrait Logger {\n  def\
    \ log(msg: String) // An abstract method\n}\n```\n\nNote that you need not declare\
    \ the method as abstract—an unimplemented method in a trait is automatically abstract.\n\
    \nA subclass can provide an implementation:\n\n```\nclass ConsoleLogger extends\
    \ Logger { // Use extends, not implements\n  def log(msg: String) { println(msg)\
    \ // No override needed\n}\n```\n\nYou need not supply the override keyword when\
    \ overriding an abstract method of a trait."
  merge: -1
