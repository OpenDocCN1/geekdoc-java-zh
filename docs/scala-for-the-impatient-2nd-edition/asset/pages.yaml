  md: '# 9.5 Reading Binary Files


    Scala has no provision for reading binary files. You''ll need to use the Java
    library. Here is how you can read a file into a byte array:


    ```

    val file = new File(filename)

    in = new FileInputStream(file)

    val bytes = new Array[Byte](file.length.toInt)

    in.read(bytes)

    in.close()

    ```


    # 9.6 Writing Text Files


    Scala has no built-in support for writing files. To write a text file, use a java.io.PrintWriter,
    for example:


    ```

    val out = new PrintWriter("numbers.txt")

    for (i <- 1 to 100) out.println(i)

    out.close()

    ```


    Everything works as expected, except for the printf method. When you pass a number
    to the compiler, will it complain that you need to convert it to AnyRef?


    ```

    printf("%6d %10.2f",

    quantity.asInstanceOfOf[AnyRef], price.asInstanceOfOf[AnyRef]) // Ugh

    ```


    Instead, use the f interpolator:


    ```

    out.print(f"$quantity%6d $price%10.2f")

    ```


    # 9.7 Visiting Directories


    There are no "official" Scala classes for visiting all files in a directory, or
    for recursively traversing directories.


    The simplest approach is to use the Files.list and Files.walk methods of the java.nio
    file package. The list method only visits the children of a directory, and the
    walk method visits all descendants. These methods yield Java streams of Path objects.
    You can visit them as follows:


    ```

    import java.nio.file._

    String dirname = "/home/cay/scala-impatient/code"

    val entries = Files.walk(Paths.get(dirname)) // or Files.list

    ```'
