  md: "# Chapter 7 Packages and Imports\n\nThere is a fly in the ointment, however.\
    \ Consider\n\n```\npackage com {\n  package horstmann {\n    package impatient\
    \ {\n      class Manager {\n        val subordinates = new collection.mutable.ArrayBuffer[Employee]\n\
    \        ...\n      }\n    }\n  }\n}\n```\n\nThis code takes advantage of the\
    \ fact that the scala package is always imported. Therefore, the collection package\
    \ is actually scala.collection.\n\nAnd now suppose someone introduces the following\
    \ package, perhaps in a different file:\n\n```\npackage com {\n  package horstmann\
    \ {\n    package collection {\n      ...\n    }\n  }\n```\n\nNow the Manager class\
    \ no longer compiles. It looks for a mutable member inside the com.horstmann.collection\
    \ package and doesn't find it. The intent in the Manager class was the collection\
    \ package in the top-level scala package, whatever collection subpackage happened\
    \ to be in some accessible scope.\n\nIn Java, this problem can't occur because\
    \ package names are always absolute, starting at the root of the package hierarchy.\
    \ In Scala, package names are relative, just like inner class names. With inner\
    \ classes, one doesn't usually run into problems because all the code is in one\
    \ file, under control of whoever is in charge of that. But packages are open-ended.\
    \ Anyone can contribute to a package at any time.\n\nOne solution is to use absolute\
    \ package names, starting with _root_, for example:\n\n```\nval subordinates =\
    \ new _root_.scala.collection.mutable.ArrayBuffer[Employee]\n```\n\nAnother approach\
    \ is to use \"chained\" clauses, as detailed in the next section.\n\n> NOTE: Most\
    \ programmers use complete paths for package names, without the _root_.prefix.\
    \ This is as long as everyone avoids names scala, java, com, net, and so on, for\
    \ nested packages."
  merge: -1
