    # 10.12 Traits Extending Classes\n\nAs you have seen, a trait can extend another\
    \ trait, and it is common to have a hierarchy of traits. Less commonly, a trait\
    \ can also extend a class. That class becomes a subclass of any class mixing in\
    \ the trait.\n\nHere is an example. The LoggedException extends the Exception\
    \ class:\n\n```\ntrait LoggedException extends Exception with ConsoleLogger {\n\
