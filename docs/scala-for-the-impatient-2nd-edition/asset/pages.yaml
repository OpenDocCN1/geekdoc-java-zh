  md: "# Chapter 6 Objects\n\nWhen you need a new unique account in your application,\
    \ call Accounts.newUniqueNumber().\n\nThe constructor of an object is executed\
    \ when the object is first used. In our example, the Accounts constructor is executed\
    \ with the first call to Accounts.newUniqueNumber(). If an object is never used,\
    \ its constructor is not executed.\n\nAn object can have all the features of a\
    \ class—it can even extend other classes or traits (see Section 6.3, \"Objects\
    \ Extending a Class or Trait,\" on page 73). There is just one exception: You\
    \ cannot provide constructor parameters.\n\nUse an object in Scala whenever you\
    \ would have used a singleton object in Java or C++:\n\n+   * As a home for utility\
    \ functions or constants\n* When a single immutable instance can be shared efficiently\n\
    * When a single instance is required to coordinate some service (the singleton\
    \ design pattern)\n\n> NOTE: Many people view the singleton design pattern with\
    \ disdain. Scala gives you the tools for both good and bad design, and it is up\
    \ to you to use them wisely.\n\n# 6.2 Companion Objects\n\nIn Java or C++, you\
    \ often have a class with both instance methods and static methods. In Scala,\
    \ you can achieve this by having a class and a \"companion\" object of the same\
    \ name. For example:\n\n```\nclass Account {\n  val id = Account.newUniqueNumber()\n\
    \  private var balance = 0.0\n  def deposit(amount: Double) { balance += amount\
    \ }\nn}\n```\n\n```\nobject Account { // The companion object\n  private var lastNumber\
    \ = 0\n  private def newUniqueNumber() = { lastNumber += 1; lastNumber }\n}\n\
    ```\n\nThe class and its companion object can access each other's private features.\
    \ They must be located in the source file."
