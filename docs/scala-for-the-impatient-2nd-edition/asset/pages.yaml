  md: '# 20.7 More Combinators


    Table 20–2 Additional Combinators (Continued)


    | Combinator | Description | Notes |

    | --- | --- | --- |

    | p ^? f | Like ^^, but takes a partial function f. Fails if f can''t be applied
    to the result of p. In the second version, error is a function from the result
    type of p, yielding an error message string. | ident ^? (symbols, "undefined symbol
    " + +) looks up ident in the map symbols and reports an error if it is not contained
    in the map. Note that a map can be converted to a partial function |

    | p ^? (f, error) | | |

    | log(p)(str) | Executes p and prints a logging message. | log(number("number")
    ^^ ..toInt prints a message whenever a number is parsed |

    | guard(p) | Calls p, succeeds or fails, then restores the input if p had not
    been called. | Useful for looking ahead. For example, to distinguish between a
    variable and a function call, you can use a guard ~ "(). |

    | not(p) | Calls p and succeeds if p fails, or if p succeeds. | |

    | p ~! q | Like -, but if the second match fails, the failure turns into an error,
    inhibiting backtracking in an enclosing |. | See Section 20.8 |

    | accept(descr, f) | Accepts an item that is accepted by the partial function
    f, returning the function result. The string desc is used to describe the expected
    item in the measure. | accept("string literal", { case t: lexical.StringLit =>
    t.chars }) |

    | success(v) | Always succeeds with value v. | Can be used to add a value v to
    a result |

    | failure(msg) err(msg) | Fails with the given error message. | See Section 20.13
    on how to improve error messages |

    | phrase(p) | Succeeds if p succeeds and no input is left over. | Useful for defining
    a parseAll method; see, for example, Section 20.12. |\| positioned(p) | Adds position
    to the result of p (must extend Positional). | Useful for reporting errors after
    parsing has finished. |'
