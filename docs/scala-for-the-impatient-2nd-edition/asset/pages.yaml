    # 16.12 Namespaces


    In XML, namespaces are used to avoid name clashes, similar to packages in Java
    or Scala. However, an XML namespace is a URI (and usually a URL), such as

    http://www.w3.org/1999/xhtml


    The xmlns attribute declares a namespace, for example:

    <html xmlns="http://www.w3.org/1999/xhtml">

    <head>...</head>

    <body>...</body>

    </html>


    The html element and its descendants (head, body, and so on) are placed in this
    namespace.


    A descendant can introduce its own name, for example:

    <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">

    <rect x="25" y="25" width="50" height="50" fill="#ff0000"/>

    </svg>


    In Scale, each element has a property of type NamespaceBinding. The uri property
    of that class yields the namespace URI.


    If you want to mix elements from multiple namespaces, it is tedious to work with
    them. An alternative is a namespace prefix. For example, the tag

    <html xmlns="http://www.w3.org/1999/xhtml"

    xmlns:svg="http://www.w3.org/2000/svg">'
