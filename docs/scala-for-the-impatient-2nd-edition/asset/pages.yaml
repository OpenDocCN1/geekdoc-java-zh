  md: '# 21.9 Evidence


    In Chapter 18, you saw the type constraints


    ```

    T :== U

    T <<: U

    T => U

    ```


    The constraints test whether T equals U, is a subtype of U, or is convertible
    to U. To use such a constraint, you supply an implicit parameter, such as


    ```

    def firstLast[A,C](it:C)(implicit ev: C <<: Iterable[A]) =

    (it.head, it.last)

    ```


    The :== <<[:-To] extends defined in the Predef object. For example, <<: is essentially


    ```

    abstract class <<[-From, +To] extends Function1[From, To]

    ```


    ```

    object << {

    implicit def conforms[A] = new (A: <: A) apply(x: A) = x

    }

    ```


    Suppose the compiler processes a constraint ev: String <<: Any. It looks in the
    companion object for an implicit instance of type String <<: AnyRef. Note that
    <<: is invariant in From and covariant in To. The object


    ```

    <<.conforms[String]

    ```


    is usable as a String <<: AnyRef instance. The (<<.conforms[AnyRef] object is
    also usable, but it is less specific and not considered.


    We call ev an "evidence object”—its existence is evidence of the fact that, in
    case, String is a subtype of AnyRef.


    Here, the ev is the identity function. To see why the identity function is required,
    have a closer look at


    ```

    def firstLast[A,C](it:C)(implicit ev: C <<: Iterable[A]) =

    (it.head, it.last)

    ```


    The compiler doesn''t actually know that C is an Iterable[A]—recall that is not
    a feature of the language, just a class. The code calls head and last are not
    valid. But ev is a function with one parameter, and an implicit conversion from
    C to Iterable[A]. The compiler applies it, computing(it).head and ev(it).last.


    > TIP: To test whether a generic implicit object exists, you can call the implicitly
    function in the REPL. For example, type implicitly[String <<: AnyRef](is a function)
    in the REPL, and you get a result (which happens to be a function) But implicitly[AnyRef
    <<: String] fails with an error message.


    ![](img/9468ae1ab6d9bb5b638fb89107936395_355_0.png)'
