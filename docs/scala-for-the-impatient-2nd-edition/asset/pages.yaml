  md: '# 17.2 Waiting for Results


    When you have a Future, you can use the isCompleted method to check whether it
    is completed. But of course you don''t want to wait for completion in a loop.


    You can make a blocking call that waits for the result.


    ```

    import scala.concurrent.duration._

    val f = Future { Thread.sleep(10000); 42 }

    val result = Await.result(f, 10.seconds)

    ```


    The call to Await.result blocks for ten seconds and then yields the result of
    the future.


    The second argument of the Await.result method is a Duration object. Importing
    scala.concurrent.duration._ enables conversion methods from integers to Duration
    objects, seconds, millis, and so on.


    If the task is not ready by the allotted time, the Await.ready method throws a
    TimeoutException.


    If the task throws an exception, it is rethrown in call to Await.result. To avoid
    that, you can call Await.ready and then get the result.


    ```

    val f = Future { ... }

    Await.ready(f, 10.seconds)

    Some(t) = f.value

    ```


    The value method returns an Option[Try[T]], which is None when the future is not
    completed and Some(t) when it is. Here, t is an object of the Try class, which
    holds either the result or the exception that caused the task to fail. In our
    situation, the value method is only executed if the future is completed, so we
    can use an extractor to get the Try object. You will see how to use the Await.result
    or Await.ready methods in the next section.


    > NOTE: In practice, you use the Await.ready methods many tasks run concurrently
    when they are time-consuming and your program can do something more useful than
    waiting for the result. Section 17.4, "Callbacks," on page 251 shows how you can
    harvest the results without blocking.


    > CAUTION: In this section, we used the result and ready methods of the Await
    object. The Future class also has result and ready methods, but you should not
    call them. If the execution context uses a small number of threads (which is the
    case for the default fork-join pool), you don''t want them to block. Unlike the
    Future methods, the Await methods notify the execution context so it can adjust
    the pooled threads.'
