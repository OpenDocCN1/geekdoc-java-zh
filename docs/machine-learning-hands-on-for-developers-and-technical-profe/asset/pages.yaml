    # FP-Growth


    The Frequent Pattern Growth (FP-Growth) algorithm works as a tree structure (called
    an FP-Tree). It creates the tree by counting the occurrences of the items in the
    database and storing them in a header table.


    In a second pass, the tree is built by inserting the instances it goes along the
    header table. Items that don''t meet the minimum support threshold are discarded;
    otherwise, they are listed in descending order.


    You can think of the FP-Growth like a graph, as is covered in the chapter about
    Bayesian Networks (Chapter 4). With a reduced dataset in the formation, the FP-Growth
    starts at the bottom—the place with the longest branches—and finds all instances
    of the given condition. When no more single items match the attribute''s support
    threshold, the growth ends, and then it works on the next part of the FP-Tree.


