  md: '# Chapter 2 Planning for Machine Learning


    You can acquire data from many sources; it might be data that''s held by your
    organization or open data from the Internet. There might be one dataset, or there
    could be 10 or more.


    You must come to accept that data will need to be cleaned and checked for quality
    before any processing can take place. These processes occur during the prepare
    phase.


    The processing phase is where the work gets done. The machine learning routines
    that you have created this phase.


    Finally, the results are presented. Reporting can happen in a variety of ways,
    such as reinvesting the data into a data store or reporting the results as a spreadsheet
    or report.


    # It All Starts with a Question


    There seems to be a misconception that machine learning, like Big Data, is a case
    of throwing enough data at the problem that the answers magically appear. As I''d
    like to say this all the time, it doesn''t. Machine learning projects start with
    a question or a hunch that needs investigating. I encountered this quite a few
    times speaking to people about their companies'' data ambitions and what they
    are looking to achieve with the likes of machine learning and Hadoop.


    Using a whiteboard, sticky notes, or even a sheet of paper, start asking questions
    like the following:


    +   - Is a correlation between our sales and the weather?

    - Do sales on Saturday and Sunday generate the majority of revenue to the business
    compared to the other five days of the week?

    - We can plan what fashions to stock in the next three months by looking at Twitter
    data for popular hashtags

    - Can we tell when our customers become pregnant?


    All these are reasonable questions, and they also provide the basis for proper
    discussion. Stakeholders will usually come with the questions, and then the data
    project team (which might be one person—you!) can spin into action.


    Without the question, it''s difficult to know where to start. Anyone who thinks
    the answers just pop out of air needs a polite, but firm, explanation of what
    has to happen for the answers to be discovered.


    # I Don''t Have Data!


    This sounds like a silly statement when you have a book on machine learning in
    your hands, but sometimes people just don''t have the data.'
  merge: -1
