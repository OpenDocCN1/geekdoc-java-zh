  md: "# Bulk Converting CSV to JSON\n\nOne common request is converting data from\
    \ one type to another. In this final example, I'll use Embulk to convert a CSV\
    \ file to JSON. While it seems trivial, it can be done in code. What I'm doing\
    \ is thinking forward to when the volumes of data are too big for single processes\
    \ to handle.\nThe first thing to do is install the filter plugin, which will transform\
    \ the data to JSON.\n\n```\n$ embulk gem install embulk-filter-to_json\n2019-01-01\
    \ 01:01:01.000 +0100: Embulk v0.9.17\n```\n\nIn the csv_to_json example directory,\
    \ you will see a data.csv file with scoring data. This is what will be converted\
    \ to JSON. The same directory also has the configuration file for Embulk.\n\n\
    ```\nin:\ntype: file\n  path_prefix: data.csv\nparser:\n  type: CSV\n  charset:\
    \ UTF-8\n  newline: CRLF\n  null_string: 'NULL'\n  skip_header_lines: 1\n  comment_line_marker:\
    \ '#'\n  columns:\n    {name: time, type: timestamp, format: \"%Y-%m-%d\"}\n \
    \   {name: id, type: long}\n    {name: name, type: string}\n    {name: score,\
    \ type: double}\nfilters:\n  type: to_json\n  column:\n    name: test\n    type:\
    \ string\n    skip_if_null: [id]\n  default_timezone: Asia/Tokyo\nout:\n  type:\
    \ stdout\n```\n\nRemember that the filter is not a CSV-to-JSON conversion; it's\
    \ transforming to JSON anything that has passed in the process stream. When this\
    \ example is run, the CSV data is passed through the input and then into the filter,\
    \ and the resulting JSON output is sent to the console through the standard output\
    \ channel.\n\n```\n$embulk run config.yml\n```"
