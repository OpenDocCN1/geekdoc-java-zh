    sale (POS) and fed back to a data warehouse. In the early days of the Clubcard,
    the data couldn''t be fast enough; there was just too much. As processing methods
    improved over the years, Tesco and marketing Dunn Humby developed a good strategy
    for understanding customer behavior and shopping habits and encouraging customers
