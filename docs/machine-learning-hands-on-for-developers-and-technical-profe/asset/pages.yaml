  md: "# Chapter 9 Artificial Neural Networks 173\n\n![](img/896dd33398480a544ce5ff39ab4e6e43_196_0.png)\n\
    \nThis is where the neural network becomes useful. You can train the network for\
    \ classification and pattern recognition, but it does require training. You can\
    \ train an artificial neural network by unsupervised or supervised means.\n\n\
    The issue is that you don't know what weight values should be for the hidden layer.\
    \ By changing the bias in the Sigmoid function, you can vary the output layer,\
    \ an error function can be applied, and the aim is to get the value of the error\
    \ function to a minimum value.\n\nI described the threshold function within the\
    \ perceptron previously in the chapter, but this isn't suitable for your needs.\
    \ You need something that is continuous and differentiable. With the bias option\
    \ implemented in the Sigmoid function, each run of the network refines the output\
    \ and the error function. This leads to a better-trained network and more reliable\
    \ answers.\n\n# Back Propagation\n\nWithin the multilayer perceptron is the concept\
    \ of back propagation, short for “backward propagation of errors.” Back propagation\
    \ calculates the gradients and maps the inputs to the correct outputs.\n\nThere\
    \ are two steps to back propagation: the propagation phase and the updating of\
    \ the network. This would occur for all the neurons in the network.\n\nIf you\
    \ were to look at this as pseudocode—assuming an input layer, a hidden layer,\
    \ and an output layer—would look like this:\n\n```\ninitialize weights in network\
    \ (random values)\n\nwhile(examples to process)\n  for example x\n    prediction\
    \ = neural_output(network, x)\n    actual = trained-output(x)\n    error is (prediction\
    \ - actual) on output nodes\n```\n\n```\nbackwardpass:\n  compute weights from\
    \ hidden layer to the output layer\n  compute weights from input layer to hidden\
    \ layer\n```"
