- img_proc: true
  md: '# Chapter 2 = Planning for Machine Learning


    The primary question about the output of machine learning data is “Who is the
    intended audience?” Depending on the answer to that question, your output will
    vary. You might need a spreadsheet for the financial folks to see the results.
    If the audience is comprised of website users, then it makes sense to put the
    data back into a database table. The machine learning results could be merged
    with other data to define more learning. It really comes down to what defined
    in the project.


    There are a number of paid and free reporting tools available. Some are full-blown
    systems, such as Jasper Reports, BIRT, and Tableau. If you are reporting to a
    web-based audience, then the likes of D3 and Processing might be of help to you.


    # Don’t Be Afraid to Experiment


    It’s safe to say that there is no one solution fits all.” There are many components,
    formats, tools, and considerations to ponder on any project. Every machine learning
    project starts with a clean sheet and communication among all involved, from stakeholders
    all the way to visualization. Tools and scripts can be reused, but every case
    is going to be different, so things need minor adjustments as you go. Don’t be
    afraid to play around with data as you acquire it; see whether there’s anything
    you can glean from it.


    It’s also worth taking time over some data and make your own scenarios and ask
    your questions. It’s like a musician practicing an instrument; it’s worth putting
    in the hours so you are ready for the day when the big gig arrives.


    The machine learning community is large, and there are plenty of blog posts, articles,
    videos, and books produced by the community. Forums are place to swap stories
    and experiences. As with most things, the more you put in, the more you will get
    out of it.


    Over the years, I’ve found that people are more than willing to help contribute
    to a solution if you’re stuck on a problem. If you haven’t looked at the likes
    of http://stackoverflow.com, a collaborative question-and-answer platform for
    software developers, then have a search around. Chances are that someone will
    have encountered the problem as you.


    # Summary


    With any project, planning is a key and essential part of machine learning and
    shouldn’t be taken lightly. This chapter covered many aspects of planning, including
    processing, storage, privacy, and data cleaning. You were also introduced to some
    useful tools and commands that will help in the cleaning phases and some validation
    checks.'
  merge: -1
