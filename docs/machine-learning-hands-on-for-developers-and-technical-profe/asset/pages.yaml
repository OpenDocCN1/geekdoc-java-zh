  md: '# The Coded Method


    The workbench works well, and the command line suits needs better when scheduled
    jobs are done. But, for ultimate flexibility, there''s nothing better than coding
    your own program using the API to get things done. The core Weka classes are used
    by the workbench, command line, and Java coded examples. It''s a case of figuring
    out how the data is loaded and the clustering with the options you''ve used in
    previous examples.


    Creating a k-means cluster in Java is actually a trivial matter; it''s a matter
    of knowing what elements you go. You are going to create a simple Java program
    to complete what you''ve done in the previous two walkthroughs. I''ll be using
    Eclipse.


    # Create the Project


    Select File -> Java Project and call it WekaCluster, as shown in Figure 6.10.


    ![](img/896dd33398480a544ce5ff39ab4e6e43_143_0.png)


    There''s only one library to install; that is the weka.jar file. On macOS machines,
    Weka is usually installed in the Applications directory. The location on Windows
    machines varies depending on the specific operating system.


    With the WekaCluster project selected, click File -> Properties and look for Java
    Build Path. Then, click the Libraries tab. Add the external jar file by clicking
    Add External JARS. In the File dialog box, find the weka.jar file, as shown in
    Figure 6.11.'
