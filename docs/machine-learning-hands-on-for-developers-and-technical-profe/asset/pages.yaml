  md: '# Chapter 12 Machine Learning Streaming with Kafka 275


    With things being so variable over time, it raises some interesting questions
    on how the model is going to be built. With simple linear regression and decision
    trees the training model require no configuration or planning: the training is
    run against the data, the model is created, and the evaluation is performed. A
    neural network, on the other hand, needs a little more crafting to get the best
    performance out of it.


    # Data Importing


    I''m using the DeepLearning4J library to create this neural network application.
    One of the positive aspects of DL4J is the amount of thought that''s gone into
    loading the data.


    To import the CSV data, there''s a dedicated RecordReader class that will import
    the data based on a passed-in delimiter. As there is no header record, there are
    no lines to skip, so that value is set to zero.


