  md: '# Preparing Text for Analysis


    Let''s start at the start; someone, is going to present you with documents. Previous
    experience has told me it''s going to be in the format you least expect. When
    we say "text document", some might think of plain text (.txt), while others might
    think of a Rich Text Format (.rtf) or even a Microsoft Word document (.doc|.docx).
    For text analysis we want plain text, so there is usually going to be some data
    scrubbing to find.


    # Apache Tika


    If you are totally unsure what kind of document type you are dealing with, then
    it''s worth taking a look at the Apache Tika library to inspect the content metadata.


    You can download Tika from http://tika.apache.org/, and it can be used either
    as a command-line tool or embedded into an application.

    Tika isn''t just limited to documents; it can read image, video, sound, email,
    and other file types. To see the full list of supported types, please look at
    the support page on the Apache Tika website.


    ```

    http://tika.apache.org/1.22/formats.html#Full_list_of_Supported_Formats

    ```


    # Downloading Tika


    For the command-line examples, I''m going to download the JAR file from the Apache
    mirror site. Choose your closest mirror, go to the following website and choose
    from the:


    ```

    https://www.apache.org/dyn/closer.cgi/tika-app-1.22.jar

    ```


    Once you have saved the JAR file (you may get a security warning about the downloading
    of a JAR file), you can now reference it from the command line. A built-in GUI
    is available to you; from the command line, run the following command.


    ```

    java -jar tika-app-1.22.jar

    ```


    Once the GUI (see Figure 10.1) has loaded, find a text file and drag it over the
    GUI and then drop it there. You''ll see the metadata for the file you''ve dropped.'
