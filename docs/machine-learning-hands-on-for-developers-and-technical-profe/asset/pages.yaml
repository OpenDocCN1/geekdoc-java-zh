  md: "![](img/896dd33398480a544ce5ff39ab4e6e43_129_0.png)\n\nOne of the most commonly\
    \ used models is the k-centroid model, which is where the k-means algorithm comes\
    \ in. The k-means algorithm is basically vector quantization. This chapter concentrates\
    \ on the k-means algorithm and creates a basis of the walk-through later in the\
    \ chapter.\n\n# # How the K-Means Works\n\nIf you have a group of objects, the\
    \ idea of the k-means algorithm is to define a number of clusters. What's important\
    \ is that it's up to you to define how many clusters you want. For example, say\
    \ I have 1,000 objects and I want to find 4 clusters:\n\n```\nn (objects) = 1000nk\
    \ (clusters) = 4\n```\n\nEach one of the clusters has a centroid (sometimes called\
    \ the mean, hence the name k-means), a point where the distance of the objects\
    \ will be calculated. The clusters are defined by an iterative process on the\
    \ distances of the objects to calculate which are near to the centroid. This is\
    \ all done unsupervised; you just have to let the algorithm do its processing\
    \ and inspect the results. The iterations have taken place to the point where\
    \ the objects don't move to different centroids, it is assumed that the k-means\
    \ clustering is complete.\nThe following pseudocode describes what's happening:\n\
    \n```\ncalculate initial values for means m[1],m[2],m[3],m[4]\nassign object to\
    \ nearest center\nwhile(there are changes in the mean position) {\n  estimate\
    \ the means to classify into clusters\n  for(i in 1 to k) {\n    m[i] = mean of\
    \ the samples for cluster i\n  }\n}\n```"
  merge: -1
  pgno: 129
- img_proc: true
  md: '# Initialization


    First, the algorithm must initialize by assigning a cluster to every observation
    made. The random partition method places the cluster points toward the center
    of the dataset. Another initialization method is the Forgy method, which spreads
    out the randomness of the initial location of the cluster.


    After the initial cluster observations are assigned, you can look at the assignment
    and updating of the algorithm.


    # Assignments


    Each observed object is assigned to the cluster to find out which cluster centroid
    is assigned to; the algorithm uses Euclidean distance measurement. The sum of
    squares is then calculated by squaring the Euclidean distances to each cluster
    centroid, and the one with the smallest value is the cluster that is assigned
    to.


    Calculating the Euclidean distance is simple and requires only some entry-level
    math; if you can remember how to do Pythagoras’ theorem, you are already there.


    Assume a basic grid of six positions on the X-axis (horizontal) and four positions
    on the Y-axis (vertical). The center point of my cluster is currently at 1,6,
    and the object is located at 3,1, as shown in Figure 6.3.


    The distance is 3-1-2 on the vertical side and 6-5 on the horizontal axis. Using
    Pythagoras’ theorem, the squared distance is


    ```

    2^2 + 5^2 = 4 + 29

    ```


    ![](img/896dd33398480a544ce5ff39ab4e6e43_130_0.png)


    Figure 6.3: Euclidean distances'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'The square root of 29 is 5.38. This carries on for all the objects in the dataset
    that are assigned to the clusters.


    # Update


    In the update step, you assign the object values to the cluster. The recalculation
    of the center points of the cluster (centroids) is taken as the average of the
    values of the objects that are part of the cluster. This process carries on as
    a loop until the entities in each group no longer change.


    The k-means algorithm is very effective, but it''s not without its problems. It
    can take a few runs with the data to get a decent if of clusters. When you choose
    too few, objects can easily spill into the incorrect cluster over a period of
    time during the processing.


    # Calculating the Number of Clusters in a Dataset


    When presented with a dataset, it can be hard to define the number of clusters
    you want to classify against. Sometimes this number will already be determined
    by a stakeholder. For example, in a marketing initiative you might have the following:


    +   ■ Low-frequency, low-value customers

    ■ Low-frequency, high-value customers

    ■ High-frequency, low-value customers

    ■ High-frequency, high-value customers


    There are times when this information is not available, and you have to find a
    balance for making your decisions. There are a number of methods for calculating
    the optimum.


    # The Rule of Thumb Method


    Nothing beats your finger and sticking it in the air to see which way the wind
    is blowing. There''s a simple calculation that is roughly the equivalent for clusters:
    the number of clusters (k) is equal to the square root of the number of objects
    divided by 2.


    ```

    K = √objects/2

    ```


    If you have 250 objects, half of that is 125, and the square root of 125 is 11.18—so,
    there are 11 clusters. This can obviously be tested and reapplied depending on
    how the trial runs go.'
