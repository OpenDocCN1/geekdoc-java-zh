  md: "# Chapter 4 Statistics, Linear Regression, and Randomness\n\n# Java\n\nThe\
    \ Collections object will give you access to the methods min and max assuming\
    \ that the input type is a collection. The List<Integer> type covered in the file\
    \ loading earlier in the chapter will work here.\n\n```\nCollections.min(numList);\n\
    Collections.max(numList);\n```\n\n# Sum\n\nThe sum, or rather summation, is the\
    \ addition of a sequence of numbers. The result is a single value of the total.\
    \ The order of the numbers is not important in summation. For example, the summation\
    \ of [1, 2, 3, 4] is same as [3, 1, 4, 2].\n\n# Mathematical Notation\n\nThe mathematical\
    \ notation for summation is the Greek letter sigma, which looks like a big E:Σ.\
    \ The more we look at the algorithms used in machine learning, the more you'll\
    \ see the addition of a sequence or collection of numbers happens a lot.\n\n#\
    \ Clojure\n\nWe're using the apply function against the collection again; the\
    \ only change is that function's being applied. The + is classed as a function.\n\
    \n```\n(def find-sum [v]\n  (apply + v))\n\n;; Run on the REPL\nch04.core> (find-sum\
    \ numlist)\n3113.0\n```\n\n# Java\n\nWith Java, things require a little more thought,\
    \ as we are dealing with a collection of objects. At this point, I could write\
    \ a method to get the sum for me, iterating each value in the collection and adding\
    \ to the cumulative total.\n\n```\npublic int getSum(List<Integer> numList {\n\
    \  int total = 0;\n  for(Integer i : numList){\n    total += i.intValue();\n \
