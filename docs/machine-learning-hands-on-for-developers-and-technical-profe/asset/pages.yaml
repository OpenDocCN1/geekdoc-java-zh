  md: '# Chapter 1 = What Is Machine Learning?


    # Summary Definition


    Machine learning is a branch of artificial intelligence. Using computing, we design
    systems that can learn from data in a manner of being trained. The systems might
    learn and improve with experience and, with time, refine a model that can be used
    to predict outcomes of questions based on the previous learning.


    # Algorithm Types for Machine Learning


    There are a number of different algorithms that you can employ in machine learning.
    The required output is what decides which to use. As you work through the chapters,
    you''ll see the different algorithm types being put to work. Machine learning
    algorithms characteristically fall into one of two learning types: supervised
    or unsupervised learning.


    # Supervised Learning


    Supervised learning refers to working with a set of labeled training data. For
    every example in the training data you have an input object and an output object.
    An example would be classifying Twitter data. (Twitter data is used in the later
    chapters of the book.) Assume you have the following data from Twitter; these
    would be your input data objects:


    > Really loving the new St Vincent!

    #fashion I''m selling my Louboutins! Who''s interested? #louboutins

    I''ve got my Kafka cluster working on a load of data. #data


    For your supervised learning classifier to know the outcome of each tweet, you
    will have to manually enter the answers; for clarity, I''ve added the output object
    at the start of each line.


    ```

    music Really loving the new St Vincent album!

    clothing #fashion I''m selling my Louboutins! Who''s interested?

    #louboutins

    data I''ve got my Kafka cluster working on a load of data. #data

    ```


    Obviously, to classify make any sense of the data when you run properly, you have
    to work manually on a lot more input data. What you have, though, is a training
    set that can be used for the later classification of data.


    There are issues with supervised learning that must be taken into account. The
    bias-variance dilemma is one of them: the machine learning model performs accurately
    using different training sets. High-bias models contain restricted learning sets,
    whereas high-variance models learn with complexity'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Chapter 1 ■ What Is Machine Learning?


    against noisy training data. There''s a trade-off between the two models. The
    key is to settle with the trade-off and when to apply which type of model.


    # Unsupervised Learning


    On the opposite end of this spectrum is unsupervised learning, where you let the
    algorithm find a hidden pattern in a load of data. With unsupervised learning
    there is no right or wrong answer; it''s just a case of running the machine learning
    algorithm and seeking what patterns and outcomes occur.


    Unsupervised learning might be more a case of data mining of actual learning.
    If you''re looking at clustering data, then there''s a good chance you''re going
    to spend a lot of time with unsupervised learning in comparison to something like
    artificial neural networks, which are trained prior to being used.


    # The Human Touch


    Outcomes will change, data will change, and requirements will change. Machine
    learning cannot be seen as a write-it-once solution to problems. Also, it requires
    human hands and intuition to write these algorithms. Arthur Samuel''s checkers
    basically improved on what the human had already taught it. The computer needed
    a human to get it started, and then it built on that basic knowledge. It''s important
    that you remember that.


    Throughout this book I talk about the importance of knowing what question you
    are trying to answer. The question is the cornerstone of any data project, and
    it starts with open discussions and planning. (Read more about this in Chapter
    2, "Planning for Machine Learning.")


    It''s only in rare circumstances that you can throw data at a machine learning
    routine and have it start to provide insight immediately.


    # Uses for Machine Learning


    So, what can you do with machine learning? Quite a lot, really. This section breaks
    things down and describes how machine learning is being used at the moment.


    # Software


    Machine learning is widely used in software to enable an improved experience with
    the user. With some packages, the software is learning about the user''s behavior
    after its first use. After the software has been in use for a period of time,
    it begins to predict what the user wants to.'
