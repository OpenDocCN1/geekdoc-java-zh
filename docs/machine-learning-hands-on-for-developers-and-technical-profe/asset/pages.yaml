    # # Wrapping SparkSQL


    The SparkSQL API is a good way to extract data from large datasets before you
    start any machine learning. There''s little point in using every column of data
    when you know it''s going to provide any value in the final model.


    It''s perfect for segmenting large volumes of data; it''s a big data tool after
    all. For example, if you were correlating data from lots of point-of-sale terminals
    and you wanted to start running analysis on specific stock item types, using Spark
    could pull all the POS data in, query against the type, and then run your machine
    learning training on the saved output data.


    # # Spark Streaming


    In the previous chapter, you learned how Kafka functions as a streaming log. Within
    Kafka there are various ways of consuming and transforming the stream of messages.
    Spark has a streaming API that enables the cluster to process blocks of messages
    as they are set from a data source. In this section, you will see how the streaming
    API functions and how it connects with other data sources.


    # # Basic Concepts


    Spark Streaming can ingest data from a range of sources, such as ZeroMQ, Kafka,
    Flume, and raw TCP sockets. With Spring XD, after data has entered the system,
    you have the option to process and manipulate the data coming in the system and
    to store it to an outbound location.


    Spark Streaming divides data into batches for processing, rather than handling
    one piece of data at a time like Kafka does. Then Spark Streaming processes and
    hands those batches to the requested output. Spark calls them *micro batches*.'
