    \ {\n            result++;\n        }\n    }\n    return result / doc.size();\n\
    }\n```\n\nThe final step of calculating the term frequency is to divide the number\
    \ of occurrences against the size of the document.\n\n# Calculating the Inverse\
    \ Document Frequency\n\nThe inverse document frequency is calculated against all\
    \ the documents in the corpus, this is why the collection of word lists was created\
    \ when the files were loaded. This measure provides us with an indication of how\
    \ common, or rare, the term is against the complete corpus of documents.\nSimilarly,\
