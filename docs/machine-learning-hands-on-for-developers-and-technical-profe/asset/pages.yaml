    I can find out easily, as shown here:


    ```

    $ printf ''%s'' ''Jason Bell'' | md5sum

    a7b19bd2ca59f8e94121b549f26333c

    ```


    Now, I have a hash value, which is a good start, but it''s still not protecting
    my identity. You now know it and what would possibly relate to if it were used
    as a user in a machine learning process. It wouldn''t take much time for a decent
    programmer with a list of first and last names to generate all md5 values for
    all the combinations.


    Using a salt value is a better solution. A salt value is data that''s with the
    piece of data to make it more secure and harder to crack.


    Let''s assume the salt value is the number of nanoseconds from January 1, 1970.
    You take that and the string you''re looking to hash:


    ```

    $ printf ''Jason Bell $(date +%s)'' | md5sum

    40e6b488a87c3c080469dbefaa5e16

    ```


    There are different ways of handling the input string. You might want to remove
    spaces, but the concept remains the same. The security of these hashes has to
    be maintained by you when the time comes to interpret the answers, you''ll know
    which customers are the actions you are seeking. Hashes are not just restricted
    to usernames or customer names; they can be applied to any data. Anything that
    you consider private information (known as personally identifiable information
    [PII])—something that you don''t want any third party to see—must be hashed.


    Be careful not to make the customer freak out by crossing the line in the sand
    that I call the "creepy line." It''s the point where the horrified customer would
    shriek, "How did they know that?" For example of a company and what they know
    about you, visit the settings pages of your Google account and take a look at
    your web search history or your location history:


    ```

    https://www.google.com/settings/dashboard

    ```


