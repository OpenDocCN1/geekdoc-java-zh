  md: '# CHAPTER 3


    # Data Acquisition Techniques


    > “Computers aren’t the thing. They’re the thing that gets us to the thing.”

    —Joe MacMillan


    This quote comes from the television program Halt and Catch Fire; perhaps we should
    reconsider that statement for our purposes: “Data isn’t the thing. Data is the
    thing that gets us to the thing.” The question to ask is where is the data coming
    from and does it need cleaning or transforming?

    When it comes to machine learning and machine learning projects, you’ll spend
    a large portion of your time on getting the data into the right shape it can be
    processed. Welcome to the dark art that is extracting, transforming, and loading
    data.


    # Scraping Data


    The sad fact of reality is that data is rarely neatly packaged the way we want.
    Sure, there are exceptions like WikiData and the Facebook Graph API, and there
    are application programming interfaces (APIs) that will give you nicely prepared
    data (more than on shortly). But you must be prepared to work with the messy world
    of scraping data.'
