  md: '# Building a Decision Tree


    Decision trees are built around the basic concept of this algorithm.


    +   - Check the model for the base cases.

    - Iterate through all the attributes (attr).

    - Get the normalized information gain from splitting on attr.

    - Let best_attr be the attribute with the highest information gain.

    - Create a decision node that splits on the best_attr attribute.

    - Work on the sublists that are obtained by splitting on best_attr and those nodes
    as child nodes.


    That’s the basic outline of what happens when you build a decision tree. Depending
    on the algorithm type, the ones previously mentioned, there might be subtle differences
    in the ways they are done.


    # Manually Walking Through an Example


    If you are interested in the basic mechanics of how the algorithm works and want
    to follow along, this section walks through the basics of calculating entropy
    and information gain. If you want to get to the hands-on part of the chapter,
    then you can skip this section.


    The method of using information gain based on pre- and post-attribute entropy
    is the key method used within the ID3 and C45 algorithms. As these are the commonly
    used algorithms, this section concentrates on that basic method of finding out
    how the decision tree is built.


    With machine learning-based decision trees, you can get the algorithm to do all
    the work for you. It will figure out which is the best node to use for the root
    node. This requires finding out the purity of each node. Consider Table 5.1, which
    includes only true/false values, of some user purchases through an e-commerce
    store.


    Table 5.1: Users’ Purchase History


    | HAS CREDIT ACCOUNT? | READ REVIEWS? | PREVIOUS CUSTOMER? | DID PURCHASE? |

    |---|---|---|--|

    | User A | N | Y | Y | Y |

    | User B | Y | N | Y | Y |

    | User C | N | N | Y | N |

    | User D | Y | N | N | Y |

    | User E | Y | Y | Y | Y |'
  merge: -1
