- img_proc: true
  md: '# Chapter 2 = Planning for Machine Learning 17


    In an ideal world, we expect companies to have well-groomed customer relationship
    management (CRM) systems and neat repositories of data that could be retrieved
    on a whim and copied nicely into a Hadoop filesystem, countless MapReduce jobs
    could run (read more about MapReduce in Chapter 13, "Apache Spark and MLLib")


    Data comes from a variety of sources. Plenty of open data initiatives are available,
    so you have a good chance of being to find some data to work with.


    # Starting Local


    Perhaps you could make a difference in your local community; see what data they
    have with which you can experiment. New York City has a whole portal of open data
    with more than 1,100 datasets for citizens to download and learn from. Hackathons
    and competitions encourage people to get involved and give back to the community.
    The results of the hackathons make a difference because insights about how the
    local community is run fed back to the event organizers. If you can''t find the
    dataset you want, then you also encouraged to request it.


    # Transfer Learning


    With the amount of machine learning now being executed out in the field, it may
    be worth looking into existing models and altering certain parameters to fit in
    your prediction data, especially if you don''t have much in the way of training
    data. This is called transfer learning. It''s perfect for models that require
    large scale datasets for training, such as images, video, and large text corpus.
    I will highlight some transfer learning examples in later chapters.


    # Competitions


    If you fancy a real challenge, then think about entering competitions. One of
    the most famous was the Netflix Prize, which was a competition to improve the
    recommendation algorithm for the Netflix film service.


    Teams were competing downloaded sample sets of user data and worked on an algorithm
    to improve the predictions of movies that customers would like. The winning team
    improved it by 10 percent. In 2009, the $1 million prize was awarded to "BellKor''s
    Pragmatic Chaos." This triggered a new wave of competitions, letting the data
    out into the open so collaborative teams could improve things.


    In 2010, Anthony Goldblom founded Kaggle.com, which is a platform for predictive
    modeling and analytics competitions. Each competition has sample datasets and
    a brief of the desired outcome. Either teams or individuals can enter, and the
    most effective algorithms, similar to the Netflix Prize, decide the winner.'
