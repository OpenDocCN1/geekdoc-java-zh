  md: "# Chapter 4 = Statistics, Linear Regression, and Randomness 59\n\n# Loading\
    \ Data with Java\n\nThe process is identical to the Closure process, though in\
    \ the Java language it's a little more involved in terms of code. Using the BufferedReader\
    \ and FileReader objects, a stream is created to read in the file. After iterating\
    \ it, converts the value to an integer and adds it to the list.\n\nNotice the\
    \ use of the Double object to call the parse method. It's the same method used\
    \ as the Closure program.\n\n```\npackage ch04;\nimport java.io.*;\nimport java.util.ArrayList;\n\
    import java.util.List;\n\npublic class LoadFileExample {\n    public List<Double>\
    \ loadFile(String filename) throws Exception {\n        List<Double> numList =\
    \ new ArrayList<Double>();\n        File file = new File(filename);\n        BufferedReader\
    \ br = new BufferedReader(new FileReader(file));\n        String s;\n        while\
    \ ((s = br.readLine()) != null) {\n            numList.add(Double.parseDouble(s));\n\
    \        }\n        return numList;\n    }\\}\n```\n\n```\npublic static void\
    \ main(String[] args) throws Exception {\n    List<Double> nums = new LoadFileExample();\n\
    \    nums.loadFile(\"stats.txt\");\n    System.out.println(nums);\n}\n```\n\n\
    Regardless of the method, the output is basically the, a list of numbers.\n\n\
    [2, 5, 3, 4,.... 3, 9, 8, 8]\n\nAssuming the resulting functions have been stored\
    \ in a new object, then it's ready for you to get some summary statistics. In\
    \ the following sections, we'll look at calculating basic statistics with our\
    \ vector of numbers.\n\n# Introducing Basic Statistics\n\nI don't know why, but\
    \ the mere mention of word statistics can bring either a wide smile or a breakout\
    \ of panic. There was a time I was the former camp but transferred to the smiling\
    \ camp. Regardless of how you feel about them, statistics are straightforward\
    \ enough in code. I also include the mathematical notation for each of the summary\
    \ statistic methods."
