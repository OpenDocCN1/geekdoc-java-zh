  md: '# Chapter 4 Statistics, Linear Regression, and Randomness


    # Using Simple Linear Regression


    While linear regression is not a machine learning algorithm, it is classed as
    a statistical method. Regardless, being able to predict a value from historical
    data is a worthwhile skill to have at your disposal. Simple linear regression
    plots an independent variable (the predictor) against a dependent variable (criterion).


    A good example uses the two commonly used temperature scales, Fahrenheit and Celsius,
    because there''s a relationship between the two. It''s illustrated with the following
    regression equation:


    ```

    Fahrenheit = 1.8x + 32

    ```


    Say we have a temperature reading of 28 Celsius. To find the Fahrenheit reading,
    we multiply 28 by 1.8 and add 32. The answer is 82.4f.


    You can generate your own linear regression calculations easily either using a
    spreadsheet or by using a library. In this example, we are going to use the comma-separated
    value file ch4slr.csv and generate a simple linear regression by using an application
    and writing some code.


    The data is comprised of two sets of scores from a competition. With the scores
    of the first judge, it is possible to reliably predict the scores of the second
    judge? We can find out by using simple linear regression.


    # Using Your Spreadsheet


    No one I''m aware of sits down and writes out on paper that often. This is even
    more true when you have a lot of data, as we do with our score data. To impress
    your friends at dinner parties and other social gatherings, you can show them
    that you can do simple linear regression on a spreadsheet.


    # Using Excel


    Within the graph functions of Excel, there are tools to enable linear regression.
    For this example, I''m using Microsoft Excel Office 365. The same functionality
    exists in Libre Office and Open Office, and you can also work out simple linear
    regression in Google Sheets.


    # Loading the CSV Data


    Start Excel, and the opening screen will give you the option to create a new file
    or open an one. Click the Open button on the left.


    Find the file ch4slr.csv and open it into Excel. This is just a two-column file
    representing two judges'' scores from a competition (see Figure 4.1).'
