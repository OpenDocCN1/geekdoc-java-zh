  md: '# Chapter 6 Clustering 119


    Now, you have six clusters with a good definition of objects going into their
    specific clusters. The only problem is that you don''t know which cluster the
    objects belong.


    # Name That Cluster


    From the command line, the -p flag tells Weka to display the assignment of each
    row''s cluster instance. To use this feature, you have to instruct Weka which
    data attribute to use for each row. From the command line, you use the following:


    ```

    java -cp /path/to/weka.jar weka.clusterers.SimpleKMeans \

    -t kmeansdata.arff -N 6 -S 42 -p 0

    ```


    The -p flag tells Weka to display the row and cluster based on the row of data.
    When this is run, you see the following output to the console:


