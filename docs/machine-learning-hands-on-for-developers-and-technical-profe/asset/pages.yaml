  md: '# Data Processing


    After you have a team in place and a rough idea of how all of this is going to
    get put together, it''s time to turn your attention to what is going to do all
    the work for you. You must give thought to the frequency of the data process jobs
    that will take place. If it will occur once in a while, and then it might be false
    economy in hardware over the long term. It makes more sense to start with what
    you have in hand and then add as you go along and as you notice growth in processing
    times and frequency.


    # Using Your Computer


    Yes, you can use your own machine, either a desktop or a laptop. I do my development
    on an Apple MacBook Pro. I run the likes of Kafka, Spark, and Hadoop on this machine
    as it''s pretty fast, and I''m not using terabytes of data. There''s nothing to
    stop you from using your own machine; it''s available, and it saves financial
    outlay to get more machines. Obviously, there can be limitations. Processing a
    heavy job might mean you have turn your attention to less processor-intensive
    tasks, but never rule out the option of using your own machine.


    Operating systems like Linux and MacOS tend to be preferred over Windows, especially
    for Big Data-based operations. The best choice comes down to what you know best
    and what suits the best project in order to get the job done efficiently. I don''t
    believe there''s only one right way to do things.


    # A Cluster of Machines


    Eventually you will come across a scenario that requires you to use a cluster
    of machines to do the work. Frameworks like Hadoop are designed for use over clusters
    of machines, which make possible for the distribution of work to be done in parallel.
    Ideally the machines should be on the same network to reduce network traffic latency.


    At this point in time, it''s also worthwhile to add a good system administrator
    to the data science team. Any performance that can be improved over the cluster
    will bring a marked performance improvement to the whole project.


    # Cloud-Based Services


    If the thought of maintaining and paying for your own hardware does not appeal,
    consider using some form of cloud-based service. Vendors such as Amazon, Rackspace,
    and others provide scalable servers where you can increase, or decrease, the number
    of machines and amount of power you require.'
