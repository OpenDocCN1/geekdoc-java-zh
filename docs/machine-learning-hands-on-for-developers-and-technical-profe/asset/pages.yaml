    # The Command-Line Method


    The command-line method is similar to the workbench method, but it gives you a
    little more flexibility in terms of running cron jobs. This means you can collect
    more data and rerun the analysis on a regular basis.


    # Converting CSV File to ARFF


    Weka uses the .arff format to determine object types and have data ready for processing.
    The GUI enables you to import .csv files directly, but it''s nice to have a tool
    that converts files for you.


    You can use the CSVLoader class on the command line to convert .csv files to .arff.
    For example, the .csv file you created in the previous walk-through was kmeansdata.csv.
    Use the converter by running the following from the terminal command line:


    ```

    java -cp weka.jar weka.core.converters.CSVLoader \ \

    meansdata.csv > kmeansdata.arff

    ```


    > NOTE If you''re using the Windows operating system then you can omit the -cp
    weka.jar from the java command.'
