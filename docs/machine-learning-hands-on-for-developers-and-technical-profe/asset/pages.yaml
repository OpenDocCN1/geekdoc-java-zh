- img_proc: true
  md: 'There are four nodes in the table:


    +   - Does the customer have an account?

    - Did the customer read previous product reviews?

    - Is the customer a returning customer?

    - Did the customer purchase the product?


    At the start of calculating the decision tree there is no awareness of the node
    that will give the best result. You''re looking for the node that can best predict
    the outcome. This requires some calculation. Enter entropy.


    # Calculating Entropy


    Entropy is a measure of uncertainty and is measured in bits and comes as a number
    between zero and 1 (entropy bits are not the same bits used in computing terminology).
    Basically, you are looking for the unpredictability in a random variable.


    There are two entropy types to work out; the first is on a single attribute, and
    the second is for two attributes. With this example, I''ll use the Had Credit
    Account as our target attribute for our working example. By the end of the exercise,
    we will know the next node to use in the decision tree. The single attribute for
    the Has Credit Account attribute has two outcomes (Yes or No).


    | HAS CREDIT ACCOUNT |

    | Yes | No |

    | 3 | 2 |


    The entropy calculation looks as follows:


    ```

    Entropy(Has Credit Account) = Entropy (2,3)

    = Entropy (0.4,0,6)

    = -(0.4 log₂ 0.4) - (0.6 log₂ 0.6)

    = 0.97095

    ```


    When two attributes are applied, the values are mapped as in the following table:


    | HAS CREDIT ACCOUNT |

    | Y | N |

    | Reads Reviews | 2 | 1 | 3 |

    | N | 1 | 1 | 2 |'
  merge: -1
  pgno: 110
- img_proc: true
  md: '# Chapter 5 Working with Decision Trees 87


    With two attributes, we end up with the following entropy calculation:


    Entropy (Has Credit Account, Reads Reviews)

    =P(Y)×E(2,1)+P(N)×E(1,1)

    =(2/5)×0.971+(1/5)×1

    =0.5884


    So, you have two gains: one before the split (Has Credit Account, which is 0.97095)
    and one after the split (Has Credit Account/Reads Reviews, which is 0.5884).


    You''re nearly done on this attribute. The next step is to calculate the information
    gain.


    # Information Gain


    When you know the gain before and after the split in the attribute, you can calculate
    the information gain. With the attribute to see if the customer has a credit account,
    your calculation will be the following:


    InformationGain = Gain(before the split) – Gain(after the split) with Reads Reviews

    =0.97095–0.5884

    =0.38255


    So, the information gain on the Has Credit Account attribute is 0.38255.


    # Rinse and Repeat


    The previous two sections covered the calculation of information gain for one
    attribute, Has Credit Account. You need to work on the other two attributes to
    find their information gain. With the values of information gain for all the attributes,
    you can now make a decision on which node to start with in the tree.


    | ATTRIBUTE | INFORMATION GAIN |

    |---|---|

    | Reads Reviews | 0.38255 |

    | Did Make Purchase | 0.48672 |

    | Is Previous Customer | 0.37095 |


    Now things are becoming clearer; assuming the Has Credit Account is the root node,
    the Did Make Purchase attribute has the highest information gain and therefore,
    should be the next deciding node in the tree.'
