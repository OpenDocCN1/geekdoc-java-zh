  md: '# Range Checks


    Range or reasonableness checks are used with numeric or date ranges. Age ranges
    are the main talking point here. Until there advances in scientific medicine to
    prolong life, you can make a fairly good assumption that the upper lifespan of
    someone is above 120. You can play safe and extend the upper range to 150; anyone
    older than that is lying or just trying to put a false value in trip up the system.


    | FIELD | LOWER RANGE | UPPER RANGE |

    | --- | --- | --- |

    | Age | 0 | 120 |

    | Mont;h | 1 | 12 |


    # Format Checks


    When you know that certain data must follow a given format, then it''s good to
    check it. Regular expression knowledge is a big advantage here if you know it.
    E-mail addresses can be used and abused in web forms and database tables, so it''s
    always a good idea to validate what you can at the source.


    There''s much discussion in the developer world about what a correct e-mail regular
    expression is. The official standard for the e-mail address specification is RFC
    5322. Correctly matching the e-mail address as a regular expression is a huge
    pattern. What you''re looking for is something that can catch the majority of
    e-mail addresses.


    ```

    [a-z0-9!#\$%&''*+/=?^_`{|}~-]+(?:\.[a-z0-9!#\$%&''*+/=?^_`{|}~-]+)*@(?:(?:[a-z0-9](?:[a-z0-9]*[[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9]*[a-z0-9])?)

    ```


    The main thing is to create a run of test with all thealities of an e-mail address
    you think will come across. Don''t just test it; keep retesting over time.

    Postcodes and ZIP codes are another source of formatting woe—especially UK postcards.
    Regular expressions also help in this case, but sometimes an odd slips during
    the testing. At the end of the day, this sort of thing is better left to specialized
    software or expert services.


