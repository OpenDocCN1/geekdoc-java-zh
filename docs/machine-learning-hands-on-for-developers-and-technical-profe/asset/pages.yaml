    # # Rest API Microservice


    The backbone of the system is a prediction HTTP API. This accepts requests from
    the two streaming applications and can accept requests directly to the endpoint,
    which could be a web page using an asynchronous Ajax call, for example.

    Using the ComposeAPI library, it''s a trivial matter to create REST-based APIs
    that also include the Swagger front end, which makes testing a lot easier.

    There are number of handlers that need to be implemented, any required values,
    and the function of the endpoint.


    # ### 12.5: Breakdown of Endpoints


    | ENDPOINT | PARAMETERS | FUNCTION |

    | --- | --- | --- |

    | /api/build_dtr | None | Triggers the build script for decision tree model |

    | /api/build_slr | None | Triggers the build script for simple linear regression
    |

    | /api/build_mlp | None | Triggers the build script for the multilayer perceptron
    neural network build |

    | /api/predict/dtr/:d | Three-part CSV line | Predicts the score against the decision
    tree model |

    | /api/predict/slr/:d | Three-part CSV line | Predicts the score against the simple
    linear regression model |

    | /api/predict/mlp/:d | Three-part CSV line | Predicts the score against the multilayer
    perceptron neural network |'
