    # Determining Which Algorithms to Use


    So far in this book we''ve looked at a single set of data against a single type
    of algorithm in a "Well, it''s this, so let''s do this" manner. Depending on the
    data volumes, some algorithms might be better suited than others. With the streaming
    nature of the data, some algorithms may be more favorable than others.


    For example, a J4 decision tree algorithm may be far more effective than a neural
    network to start off with, but over time it may be less effective for training
    with large volumes of data. What if we want to test types of neural networks with
    different numbers of hidden nodes?


    With this proof-of-concept project, we have the chance to try any model we want.
    For this, I''m going to concentrate on three: the J4 decision tree built from
    Weka, which is an old but very effective Java-based machine learning library;
    a multilayer perceptron using DL4J; and finally, a model using simple linear regression
    from the Apache Commons Math library.


    The beauty of this system is that you can hold different model types in memory
    and predict all of them. If you decide to add another model, like a support vector
    machine, then you can do so once you have the basic model coded. Let''s take a
    closer look at the three models I''m going to use.


    # Decision Trees


    The Weka machine learning library has been around a few years now. For some personal
    projects, it''s my go-to library as the footprint is small. And for most things
    like CSV files, it''s perfect. For a more comprehensive look at Weka, please refer
    to Chapter 5, "Working with Decision Trees."


