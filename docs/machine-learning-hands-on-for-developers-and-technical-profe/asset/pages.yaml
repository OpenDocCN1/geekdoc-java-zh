  md: "# Chapter 12 Machine Learning Streaming with Kafka 289\n\nThe first function,\
    \ get-broker-list, takes the Zookeeper client and returns all the brokers from\
    \ the Zookeeper nodes. This is returned as a broker-str function maps through\
    \ the entries and retrieves a host name and port. The final step is to return\
    \ the string. Depending on which broker names exist, this is either a single entry\
    \ or a comma-separated list of broker addresses.\n\n# A Command or an Event?\n\
    \nWhen a message passes through the event topic, the application needs to determine\
    \ whether the payload is a training event containing a line of CSV data or a command.\n\
    \ the streaming API, there's a method to branch the stream. Testing on condition,\
    \ in this case whether our payload is a command or a training line, the message\
    \ values can be directed to the correct element of an array.\n\nFor example, the\
    \ first array element consists of the commands; these are handled by the process-command\
    \ function. At the processing of the command, the model type is extracted and\
    \ set to the API to start a training job.\nThe training data messages are handled\
    \ by the process-training function, and the CSV data is extracted from the payload\
    \ and returned. The stream then acts as a producer writing the raw data to the\
    \ training data topic. Going to this topic is persisted via the Kafka job and\
    \ appended to the training data file on the filesystem.\n\n```\n(let [partitioned-stream\n\
    \  (.branch\n    (.stream builder input-topic)\n      (into-array Predicate [(reify\n\
    \      Predicate\n      (test [ _ v]\n        do\n          (log/info *p0 * v)\n\
    \          (>> v)\n        (pre-process-data)\n        (pred-key-type))\n    \
    \  \"command\\))))\n(reify\n      Predicate\n      (test [ _ v]\n        do\n\
    \          (log/info *p1 * v)\n          (>> v)\n        (pre-process-data)\n\
    \        (pred-key-type))\n\"training\\))))\n```"
