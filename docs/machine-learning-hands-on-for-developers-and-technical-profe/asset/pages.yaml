  md: '# Chapter 14 = Machine Learning with R 339


    If at any time you want on a topic, you can use the help command. For example,
    if you want to know about Standard Deviation, just type help(sd), and R opens
    a new window with the information (see Figure 14.2).


    ![](img/896dd33398480a544ce5ff39ab4e6e43_359_0.png)


    Figure 14.2: R''s help system


    You can quit it by clicking the light switch on the top right of the program window
    (refer to Figure 14.1) or by typing quit(i) on the command line. For basic needs,
    the R shell is fine and does the job well. For an actual development environment,
    you have to install more software such as R-Studio.


