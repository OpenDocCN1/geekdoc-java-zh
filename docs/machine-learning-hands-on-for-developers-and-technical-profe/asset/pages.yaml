  md: '# Chapter 3 Data Acquisition Techniques


    An API is a set of routines supplied by a system or a website that lets you request
    and receive data or talk to a system directly. Most of the time you have some
    sort of authority to talk to the service; this might be a token key or username
    and password combination, for example. Some APIs are public and don''t require
    any sign-up, but those are rarer now because suppliers like to know who''s calling,
    seeing what you''re taking, and how often you''re it.


    # Acquiring OpenWeather Data


    The website OpenWeather(https://openweathermap.org) has a full suite of APIs to
    retrieve weather information. There are various endpoints to get things like weather
    for a city or a three-day forecast and historical data. When you call the API
    service, you can specify the format you want to be in, whether that be JSON, CSV,
    or HTML.


    Before you start, you will need to sign up at openweathermap.org. Once an account
    is created, you will need to take a copy of the API key that has been generated
    for you. Once your key is active, it can take a couple of hours, then you can
    try the examples.


    For this example, I''m going to retrieve data from the API using three methods:
    the command line, Java, and then Clojure.


    # Using the Command Line


    The curl command appears in most Linux distributions. There is a lot of power
    in this simple command that is worth investigating. For our uses now, it''s quite
    simple because the weather API is a GET-based HTTP call. Using the -o flag, you
    can output the results to a file.


