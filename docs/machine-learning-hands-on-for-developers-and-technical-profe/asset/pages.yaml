    # The id of the broker. This must be set to a unique integer for each broker.

    brokerid=0


    The keyword here is unique, so we need create another broker IDs (1 and 2 for
    this example). Our first task is to create a copy of the server properties file
    for the other brokers.


    ```

    $ server.properties server1.properties

    $ server.properties server2.properties

    ```


    Each of these new configuration files needs editing. Open your text editor, edit
    the server1.properties file so that it has the same values as Table 12.1, and
    then make the changes in server2.properties.


    Table 12.1: Server 1 and 2 Properties


    | SETTING NAME | SERVER1.PROPERTIES | SERVER2.PROPERTIES |

    |---|---|--|

    | broker.id | 1 | 2 |

    | listeners | PLAINTEXT:::9093* | PLAINTEXT:::9094* |

    | log.dirs | /tmp/kafka-logs1* | /tmp/kafka-logs2* |


    * Remove the comment character (#) from the listeners line of properties file.


    What have we changed? There are three changes. First, there’s the broker ID as
    these must be unique, so we now have broker 0, 1, and 2. Second, each broker needs
    a port address that is different from the other brokers as they are going to be
    operating on the same machine. Last, the directory of the log information, the
    actual messages, changed, as each broker needs its own location for the messages
    and other associated files.


