    algorithm. Within the tree of algorithms, click Functions and then select LibSVM,
    as shown in Figure 8.9.


    There are a couple of changes to make before you set the classifier to work. First,
    you may change a percentage of training data against test data. In this case,
    you can be fairly confident that the data is not going to be difficult to classify
    and it''s not going to be a nonlinear classification problem; you can train with
    10 percent of the data (10,000 rows) and with the 90 percent to see how it performs.


