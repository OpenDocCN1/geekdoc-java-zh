    # Languages for Machine Learning


    This book uses the Java and Cloj programming languages for the working examples.
    The reasons are simple: Java is a widely used language, especially in the enterprise,
    and the libraries are well supported. Cloj gives better data handling abilities
    thanks to its functional nature: data goes into a function, and the result is
    output as data. Java isn''t the only language to be used for machine learning—far
    from it. If you''re working for an existing organization, you may be restricted
    to the languages used within.


    With most, there is a lot of crossover in functionality. The languages that access
    the Java Virtual Machine (JVM) have a good chance that you''ll be accessing Java-based
    libraries. There''s no such thing as one language being "better" than another.
    It''s a case of picking the right tool for the job. The following sections describe
    some of the other languages that you can use for machine learning.


    # Python


    The Python language has increased in usage because it''s easy to learn and easy
    to read. It also has some good machine learning libraries, such as scikit-learn,
    PyML, and prawn. Python was developed as a Python interpreter for the JVM, which
    may be worth investigating.


    If you are looking at the Tensorflow libraries, then Python is an obvious choice,
    and while there are Java extensions, I''d recommend using Python in the first
    instance.'
