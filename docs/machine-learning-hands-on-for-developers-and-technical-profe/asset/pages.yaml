    # Production


    When all is tested, reviewed, and refined by the team, moving to production shouldn''t
    be a big job. Be sure to give consideration to when this project will be run is
    it an hourly/daily/weekly/monthly job? Will the data change wildly between the
    project going into production and the next run?


    Make sure the team reviews the first few production runs to ensure the results
    are as expected and then look at the project as a whole to see whether it''s meeting
    the criteria of the stakeholders. Things might need to be refined. As you already
    know, software is rarely finished.


    # Avoiding Bias


    Let''s not forget that machine learning is hard; getting models that avoid bias
    is hard. It''s important to get the teams talking to each other about how to avoid
    introducing any form of bias into the final solution.


    Dataset choice is important. Make sure that it''s evenly weighted. Whether it''s
    gender, age, or another parameter, if the quantity of source data type is too
    heavy, then the model is going to bias toward it.


    Try using different model types and evaluate the test predictions. Unsupervised
    models can introduce bias with tighter correlations when clustering from the training
    data, and supervised models can creep in bias when human intervention is brought
    to control either the model or the training data. Care must be taken.


    # Building a Data Team


    A data scientist is someone who can bring the facets of data processing, analytics,
    statistics, programming, and visualization to a project. With so many skill sets
    in action, for the smallest of projects, it''s a lot to ask for one person to
    have all the necessary skills. In fact, I''d go as far as say that a person might
    not exist—or is at extremely rare. A data science team might touch on some, or
    all, of the following areas of expertise.


    # Mathematics and Statistics


    Someone on the team needs to have a good head for mathematics—someone who isn''t
    going to flinch when the words linear regression are mentioned in the interview.
    I''m not saying there''s a minimum level of statistics you should know'
