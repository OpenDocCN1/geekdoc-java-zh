  md: "# Chapter 4 Statistics, Linear Regression, and Randomness\n\nAn alternative\
    \ would be to use the Arrays class and use the stream() method. Be aware that\
    \ this method uses primitive arrays as its input, so you need to convert the List\
    \ first.\n\n```\nint[] pNumList = list.stream()\\n      .mapToInt(Integer::intValue)\n\
    \      .toArray();\n\nint total = Arrays.stream(pNumList).sum();\n```\n\n# Mean\n\
    \nThe mean, or the average, is one of the first statistical methods you'll learn\
    \ at school. When we say \"mean\" or the \"average\" we are normally referencing\
    \ the arithmetic mean. The mean gives us a good idea of where the middle is in\
    \ a set of data. However, there is a caveat to that a nice average is working\
    \ with the assumption that the dataset is evenly distributed. If there are outliers\
    \ within the dataset, then the average can be heavily distorted and incorrect.\
    \ When there are outliers in the data, then it's wiser to use the median as a\
    \ gauge.\n\n# Arithmetic Mean\n\nTo calculate the arithmetic mean, take the set\
    \ of numbers and sum them. The last step is to divide that summed number by the\
    \ number of items in the dataset.\n\n+   - 1 + 2 + 3 = 6\n- 6 / 3 = 2\n\n# Harmonic\
    \ Mean\n\nThe harmonic mean is calculated differently. There are three steps to\
    \ complete the calculation.\n\n+   - 1. For each value, calculate the reciprocal\
    \ value.\n- 2. Find the average of the reciprocal values.\n- 3. Calculate the\
    \ reciprocal of the average.\n\n```\n1/1 = 1, 1/2 = 0.5, 1/3 = 0.3333\n1 + 0.5\
    \ + 0.3333 = 1.8333\n3/1.8333 = 1.6366\n```"
  merge: -1
