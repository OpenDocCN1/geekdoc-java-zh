- img_proc: true
  md: '# Chapter 2 Planning for Machine Learning 23


    The advantage of these services is that they are “turn on/turn off” technology,
    enabling you to use only what you need.

    Keep a close eye on the cost of cloud-based services, as they can sometimes prove
    more expensive than using a standard hosting option over longer periods. Some
    companies provide dedicated Big Data services if you require the likes of Spark
    to do your processing. With cloud-based services, it’s always important to turn
    the instance off; otherwise, you’ll be charged for the usage while the instance
    is active.


    # Data Storage


    There are some decisions to make on how the data is going to be stored. There
    might be on a physical disc or deployed on a cloud-based solution.


    # Physical Discs


    The most common form of storage is the one that you will more than likely have
    in your computer to start off. The hard disc is adequate for testing and small
    jobs. You will notice a difference in performance between physical discs and solid-state
    drives (SSDs); the latter provides much faster performance. External drives are
    cheap, too, and provide a good storage solution for when data volumes increase.


    # Cloud-Based Storage


    Plenty of cloud-based storage facilities are available to store your data as required.
    If you are looking at cloud-based processing, you’ll more than likely be purchasing
    some form of cloud-based storage to go with it. For example, if you use Amazon’s
    Elastic Map Reduce (EMR) system, then you would be using it alongside the S3 storage
    cloud; other solutions exist for the Microsoft Azure platform and Google Cloud
    Compute.


    Like cloud processing, storage based on cloud will cost you on a monthly or annual
    basis. You also have to think about the bandwidth implications of moving large
    volumes of data from your office location to the cloud system, which is another
    cost to keep in mind.


    # Data Privacy


    Data is power and with it comes an awful lot of responsibility. The privacy issue
    will always rage on the hearts and minds of the users and the general public.
    Everyone has an opinion on the matter, and often people err on the side of caution.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# Chapter 2 Planning for Machine Learning


    In the last five years there has been a huge emphasis on how user data is used.
    In Europe, the General Data Protection Regulations control how business can use
    personal data within their organizations.


    Ultimately, with great power come great responsibility, and it will be up to you
    that data is protected and processed.


    # Cultural Norms


    Cultural expectations are difficult to measure. As the World Wide Web has progressed
    since the mid-1990s, there has been a privacy battle about everything from how
    cookies were stored on your computer to a multitude of companies are tracking
    locations, social interactions, ratings, and purchasing decisions through your
    mobile devices.


    If you''re collecting data via a website or mobile application, there''s an expectation
    that you will be giving something in return for user information. When you collect
    that information, it''s only right to tell the user what you intend to do with
    the data.


    Supermarket loyalty cards are a simple data-collecting exercise. For every basket
    that goes through the checkout, there''s the potential that the customer has a
    loyalty card. In associating that customer with that basket of products you can
    apply machine learning. Over time you will be able to see the shopping habits
    of that customer—her average spend, the day of the week she shops—and the customer
    expects some form of discount promotion for telling you all this information.


    So, how do you keep cultural norms inside? By giving customers a clear opt-in
    or opt-out strategy.


    # Generational Expectations


    During sessions of my iPhone development class, I open up with a discussion about
    personal data. I can watch the room divide instantly, and I can easily see the
    deciding factor: age.


    Some people are more than happy to share with their friends, and the rest of the
    world, location, what they are doing, and with whom. These people post pictures
    of their activities and tag them so could be easily searched, rated, and commented
    on. You use Facebook, Instagram, YouTube, Twitter, and other apps as a normal,
    everyday part of their lives.


    The other group of people, who were older, are not comfortable with the concept
    of handling over personal information. Some of them think that no one in their
    right minds would be interested in such information. Most can''t see the point.


    Although the generation gap might closing and there is a steady relaxation of
    what people are willing to put on the Internet, developers have a responsibility
    to the suppliers of the information. You have to consider whether the results
    you generate will cause a concern to them or enhance their lives.'
  merge: -1
  pgno: 49
