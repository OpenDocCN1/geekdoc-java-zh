- img_proc: true
  md: 'Basically, you''re taking half of ||w|| squared instead of using the square
    root of ||w||. Based on Lagrange multipliers, to find the maxima and minima in
    the function, you can now look for a saddle point and discount other points that
    don''t match zero (fit inside the saddle).


    > For those that don''t know, a saddle point is a mathematical function where
    you have two values at a critical point when both function values are zero. It''s
    called a saddle point as that the shape it produces in graphic form. You can read
    more about at http://wikipedia.org/wiki/Saddle_point.


    You''re shaping the graph into a multidimensional space and seeing where the vectors
    lie in order to make the category distinctions as big as possible. With standard
    quadratic programming, you then apply the function expressing the training vectors
    as a linear combination


    ```

    $w = \sum_{i=1}^{n} a_i y_i x_i.$

    ```


    Where $\alpha i$ is greater than zero, the $xi$ value is a support vector.


    # Using Non-Linear Classification


    In an ideal world, the objects would lie on one side of the hyperplane or the
    other. Life, unfortunately, is rarely like that. Instead, you see objects straying
    from the hyperplane, as shown in Figure 8.6.


    ![](img/896dd33398480a544ce5ff39ab4e6e43_173_0.png)


    **Figure 8.6:** Objects rarely go where you want them to go.'
  merge: -1
