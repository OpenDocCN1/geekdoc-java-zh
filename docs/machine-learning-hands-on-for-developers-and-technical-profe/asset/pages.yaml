    # Images in Machine Learning


    As you are aware from reading this book and working through the examples, most
    of what we are doing with machine learning is feeding information, usually in
    number form, and finding patterns that can then be defined into models.

    So, if we can convert image data into a grid of numbers, what we are left with
    is a matrix grid that a machine learning algorithm can train against.


    You will find that the machine learning examples use a fairly small grid of numbers;
    images that are 16 × 16 and 28 × 28 pixels are used a lot. The reason for this
    is processing time; if an image is too large, then it will take a long time, depending
    on machine performance, to convert and process the image. When you are dealing
    with tens of thousands of images, these processes can take hours.'
