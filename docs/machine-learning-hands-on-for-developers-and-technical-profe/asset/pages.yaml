  md: "Covered in the section are the basic statistics: the sum, minimum and maximum,\
    \ mean, mode, median, variance, and standard deviation. Once again, I'll cover\
    \ both Java and Clojure variations. With Clojure we have the bonus of having something\
    \ called REPL, which stands for “read, evaluate, print, loop,” meaning you can\
    \ type the commands out and get the results of code easily. Java sadly does not\
    \ have this luxury in version I.8, but there are services on the Internet that\
    \ provide REPL-like interfaces for Java if you want to experiment.\n\nI will assume\
    \ from this point on that you have the collection of scores in a value called\
    \ numList.\n\n# Minimum and Maximum Values\n\nFinding the minimum and maximum\
    \ values of a list of numbers, while seemingly groundbreaking in terms of stats\
    \ or machine learning, is still worthwhile to know.\n\n# Mathematical Notation\n\
    \nIt's perfectly fine to use the words min and max, but it's also acceptable to\
    \ an upper and lower arrow.\n\n+   * ^ for the minimum value.\n* for the maximum\
    \ value.\n\n# Clojure\n\nWith Clojure we apply a function to the collection. This\
    \ takes a function (in this instance either min or max) and uses the contents\
    \ of the collection as an argument. If I were to pass directly to min or max,\
    \ I would get the whole collection returned as it is classed as one argument.\n\
    \n```\n(def find-min-value [v]\n  (apply min v))\n\n(def find-max-value [v]\n\
    \  (apply max v))\n\n;; Run on the REPL\nch04.core> (find-min-value numlist)\n\
    2.0\nch04.core> (find-max-value numlist)\n10.0\n```"
