  md: 'The filter values can be set in a way that if we are looking for vertical features,
    the vertical aspect of the filter could be set to 1, for example (Figure 11.7).
    Or if looking for horizontal features, the filter could be set for:


    | 1 | 0 | | 1 | 1 | 1 |

    | 0 | 1 | | 0 | 0 | 0 |

    | 1 | 1 | | 1 | 1 | 1 |

    | Vertical | | Horizontal |


    **Figure 11.7:** Filter values set at vertical and horizontal


    How the filter is configured will determine the output of the CNN; features that
    are not featured in the filter will be dimmed from the outgoing computed CNN value.


    # Activation Functions


    As we established in Chapter 9, there is an activation layer that is usually done
    by way of a Sigmoid function (or TANH if you prefer). The ANN is a linear combination
    of its own inputs.


    Nonlinear functions let perform classification of data when it''s not linearly
    separable. In the CNN, once the filter has passed the part of the image, it will
    be passed to another mathematical function, an activation function. The commonly
    used function for this operation is a Rectified Linear Unit, or ReLU for short.
    The ReLU is doing is converting all the negative values to zero and leaving the
    positive values as they are. At this point, the resulting dimming created by the
    filter will be enhanced.


    # Pooling


    The convolution layer, as described earlier, leaves us with a set of feature maps.
    Common among CNN implementations is to add a subsampling layer, also known as
    pooling. Performing pooling reduces the number of parameters and computations
    in the network, and therefore, reduces the dimensionality. With reduced dimension,
    this will decrease the time taken to train the network.


    With max-pooling, we are looking at a window, similar to our feature filter, and
    moving across the feature map. This time, however, we are only finding the maximum
    value of the window and registering that value in the new filter.


    # Classification


    So far, we''ve covered the steps of building the CNN; these are the convolution
    (our filter steps), using Rectified Linear Unit (ReLU) to enhance the feature
    map and then pooling to reduce the filter map again.'
