  md: '# Chapter 5 Working with Decision Trees


    The data file has a few elements to it, let''s look through it one section at
    a time.


    # Relation


    The @relation tag is the name of the dataset you are using. In this instance it''s
    Lady Gaga''s CDs, so I''ve called it ladygaga.


    # Attributes


    Next, you have the attributes that are used within your data model. There are
    five attributes in this set that are the top line of raw CSV data that you received
    from the client.


    +   **Placement**: What type of stand is displayed on: an end rack, a special
    offer bucket, or a standard rack?

    **Prominence**: What percentage of the CDs on display are Lady Gaga CDs?

    **Pricing**: What percentage of the full price was the CD at the time of purchase?
    Rarely is a CD sold at full price, unless it is an old, back-catalog title.

    **Eye Level**: What is the product displayed at eye-level position? The majority
    of sales happen when a product is displayed at eye level.

    **Customer Purchase**: What was the outcome? Did the customer purchase?


    The Prominence and Pricing attributes are both numeric values. The other three
    are the nominal values that are to be expected when the algorithm is running.
    Placement has three: end_rack, cd_spec, or std_rack. The Eye Level attribute is
    either true or false, and the Customer Purchase attribute has two nominal values
    of either yes or to show that the customer bought the product.


    # Data


    Finally, you have the data, comma separated in the order of the attributes (Placement,
    Prominence, Pricing, and Customer Purchase). In this sample, you know the outcomes—whether
    a customer purchased or not; this model is about using regression to get your
    predictions in tune for new data coming in. You can find all the code for this
    chapter on the book''s companion website at


