    # Model Training


    With the configuration completed, the model is then created. The training split
    is set for 65 percent of the training data, with the remaining 35 percent being
    used for evaluation. As the model is trained, the application will output the
    progress every 100 iterations; the training of the model is set in the application
    at 2,000 iterations.


    ```

    MultiLayerNetwork model = new MultiLayerNetwork(conf);

    model.init();

    model.setListeners(new ScoreIterationListener(100));


    model.fit(trainingData);

    ```


    # Evaluation


    The evaluation steps don''t require any intervention from the application itself;
    it''s more of a reporting exercise. With our 11 output nodes, the evaluation class
    generates an output based on the feature matrix of the test data. Once the evaluation
    is complete, it''s output to the console.


    ```

    evaluation eval = New Evaluation(11);

    log.info("Getting evaluation");

    INDArray output = model.output(testData.getMatrix());

    log.info("Getting evaluation output");

    eval.eval(testData.getLabels(), output);

    System.out.println(eval.stats());

    ```


    # Saving the Model Results to the Database


    As with other models, the evaluation results are stored in the database. A figure
    of the split of training data is taken, along with the time to create the model,
    and the final F1 score of the model. When the prediction events happen, the criteria
    on what model will be determined by the F1 score.


    ```

    // Write output results to database

    DBTools.writeResultsToDB(uuid, esplit, timetaken, eval.f1())

    eval.stats(), "mlp");

    ```


    # Persisting the Model


    Models generated in DeepLearning4 are persisted as ZIP files. The ModelSerializer
    gives us an easy way to persist the generated model. In our demo system, there''s
    no need to update models; we are only creating new models each run, so we set
    the saveUpdater Boolean value to false.'
