    # Kafka as a Multinode Cluster


    While a single node cluster has one broker connected to Zookeeper, a multinode
    cluster has many brokers connected to Zookeeper, and the log is distributed across
    the cluster. You can create this cluster locally, but it''s not a configuration
    that would really be used in a production setting. It does, however, give a good
    foundation for how the multinode cluster works. In this example, I''ll set up
    a three-broker configuration on a single Zookeeper cluster.


    There are some configuration aspects that we need to do before we start Kafka.
    In the config directory, there is the server.properties file; this is the configuration
    for a single broker. If you open the file and look for the broker.id key, you
    will see the value 0 for it. The comments give important information.'
