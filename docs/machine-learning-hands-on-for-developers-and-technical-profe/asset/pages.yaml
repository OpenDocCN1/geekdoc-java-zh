    update network weights

    until all classified correctly against training data

    return finalized network

    ```


    Propagation happens, and the training is input through the network and generates
    the activations of the output then back ward propagates the activations and deltas
    of all the output and hidden layers of the network based on the target of the
    training pattern.


    In the second phase, the weight update is calculated by multiplying the output
    delta and input activation. This gives you the gradient weight. The percentage
    ratio is then subtracted from the weight. The second part is done for all the
    weight axes in the network.


    The percentage ratio is called the learning rate. The higher the ratio, the faster
    the learning. With a lower ratio you know the accuracy of the learning is.


    > NOTE I appreciate that it''s difficult to grasp mathematical concepts on neural
    networks in a book that focuses on the practical aspects of getting machine learning
    and up running quickly. This overview gives a general idea of how they work. The
    main concepts of input and output layers, perceptrons, and the notion of forward
    and backward propagation wide provide a good, although simple, grounding in the
    thought process.


    # Data Preparation for Artificial Neural Networks


    For creating an artificial neural network, it''s worth using a supervised learning
    method. However, this requires some thought about the data that you are going
    to use to train the network.


    Artificial neural networks work only with numerical data values. So, if there
    are normalized weights with text values, they need to be converted. This isn''t
    so much issue with the likes of gender, where the common output would be Male
    = 0 and Female = 1, for example. Raw text wouldn''t be suitable, so it either
    need to be tidied up, hashed to numeric values, or removed from the test.


    With all data strategies, it''s a case of thinking about what''s important and
    what data you can live without.


    As variables increase in your data for classification, you will come across the
    phenomenon called the "curse of dimensionality." This is when added variables
    increase the total volume of data required to get reasonable results and insight.
    So, when you are thinking of adding another variable, make sure you have enough
    training data to cover eventalities across all the other variables.


    Artificial neural networks are perfectly tolerant to noisy data, it''s worth trying
    to ensure that there aren''t large outliers that could potentially cause issues
    with the results. Either find and remove the wayward digits or turn them into
    missing values.'
