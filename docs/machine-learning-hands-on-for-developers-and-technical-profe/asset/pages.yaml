    # Model Configuration


    The model we''re going to use is a three-layer neural network with an input layer,
    a hidden layer, and the output layer.

    Our input layer is made up of 78 input nodes; this represents each pixel in the
    image (28 x 28), and the output of this input layer is sent to the hidden layer.
    The hidden layer is made up of 500 nodes and output to a 100-node output layer.

    The final layer uses the Softmax activation method to determine the output class,
    which consists of 10 different numbers in the MNIST dataset.


    ```

    MultiLayerConfiguration config = new NeuralNetConfiguration.Builder()

    .seed(randomSeed)

    .activation(Activation.RELU)

    .weightInit(WeightInit.XAVIER)

    .update(new Nadan())

    .l2(rate * 0.005)

    .list()

    .layer(new DenseLayer.Builder()

    .in(imageHeight * imageWidth)

    .nout(500)

    .build())

    .layer(new DenseLayer.Builder()

    .in(500)

    .nout(100)

    .build())

    .layer(new OutputLayer.Builder(LossFunction.NEGATIVELOGLIKELIHOOD)

    .activation(Activation.SOFTMAX)

    .nout(outputClasses)

    .build())

    .build();

    ```


    With the configuration in place, it''s added to the model and initialized. To
    see how the model is performing while training, we add a score iteration listening
    to the model. During training, the score will be output to the console.


    ```

    MultiLayerNetwork model = new MultiLayerNetwork(conf);

    model.init();nmodel.setListeners(new ScoreIterationListener(5));

    ```'
