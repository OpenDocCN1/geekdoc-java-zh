  md: '# Increasing the Test Data Size


    Within the `for` loop of the `MLPData.java` program you created earlier in the
    chapter, change the loop count from 100 rows to 100,000. Go back to the Preprocess
    window and load the new CSV file. It might take some time to load.


    Now, go back to the Classify window opens, the network looks the same as before
    in terms of the hidden layers. Where you have had 500 epochs running against the
    100 rows of data, you now have each epoch number against 100,000 rows of training
    data.

    Click Start and rerun the training. You''ll notice a difference in response time
    from the GUI as it runs all 100,000. The main thing to look at is the errors per
    epoch; the number keeps reducing to the point where you get minutes from 100 to
    200 epochs. By the time the training has finished, you will have a very accurate
    training model.


    All this comes at a price of memory, though. Your training set took more than
    two minutes.


    Time to build model: 124.52 seconds


    Two minutes isn''t a huge amount in the grand scheme of things, but as I previously
    mentioned in regard to gathering data for neural networks, adding more variables
    gives the curse of dimensionality.

    The more you use for training, the better the prediction results will be. There
    is a point in time to figure out there''s too much training data against the errors
    per epoch. It takes some practice (and everyone''s data is different, so there''s
    no hard or fast rule), and it''s a case of experiment, measure, and try again.


    # Implementing a Neural Network in Java


