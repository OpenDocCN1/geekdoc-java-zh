  md: '# # CHAPTER 6

    # Clustering


    One of the more common machine learning strands you''ll come across is clustering,
    mainly because it''s very useful. For example, marketing companies love because
    they can group customers into segments. This chapter describes the details of
    clustering and illustrates how clusters work and where they are used.


    > **NOTE** Please don''t confuse machine learning with clusters of machines in
    a networking sense; we''re talking about something very different here.


    # ## What Is Clustering?


    If you boil down all the definitions of clustering out there, you get “organizing
    a group of objects that share similar characteristics.” It''s classed as an unsupervised
    learning method, which means there''s no prior training data from which to learn.
    In Figure 6.1 there are three distinct groups of data; each one of those is a
    cluster.


    The main aim is to find structure within a given set of data. Because there are
    a lot of algorithms to choose from, clustering casts a wide net. This is why experimentation
    comes in handy; which algorithm is the right choice? Sometimes you just need to
    put some code together and play with it. You''ll do that shortly.'
  merge: -1
  pgno: 126
- img_proc: true
  md: '# Chapter 6 Clustering


    ![](img/896dd33398480a544ce5ff39ab4e6e43_127_0.png)


    Figure 6.1: A graph representation of a cluster


    # # Where Is Clustering Used?


    Clustering is a widely used machine learning approach. Although it might seem
    simple, do not underestimate the importance of grouping multivariate data into
    refined groupings.


    # ## The Internet


    Social media network analysis uses clustering to determine communities of users.
    With so many users on Facebook, for example, using these sorts of techniques can
    refine advertising so that certain ads go to specific groups of customers. If
    you''ve searched on one of many mapping websites, you might have seen clustering
    at work when there are a lot of interest pins built up in a given location. Instead
    of showing all the pins, which would provide a bad user experience, clustering
    is used to define the group of pins within the given location. Website logs and
    search results are often clustered to show more relevant search groups. A number
    of companies are using clustering to refine engine queries.


    # ## Business and Retail


    Market research companies use clustering a lot. With surveys that contain many
    variables, a multivariate system like clustering gives marketers a better definition
    of groups of customers in relation to the answers given in the survey. This might
    be broken down by population, location, and previous buying habits, for example.
    With the clusters defined, the marketing companies can try to develop new products
    or think about testing products for certain clusters in the results.'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Chapter 6 Clustering 105


    Along with association rules learning (discussed in Chapter 7), clustering is
    also used for basket analysis. Certain auction sites use clustering because there
    is no defined stock number in the listings. It''s easier to run clustering and
    items and preferences use association rules.


    # Law Enforcement


    Crimes are logged with all the aspects of the felony listed. Police departments
    are running clustering and other machine learning algorithms to predict when and
    where future crimes will happen. The result of this might be patrol cars are deployed
    to control problem areas at certain times, or specialist help is sent to areas
    where certain sorts of crimes have high numbers.


    # Computing


    With the rise of the “Internet of Things,” we are now collecting more data from
    sensors than ever before. Clustering can be used to group the results of the sensors.
    For example, thinking of a temperature sensor, you might cluster date and time
    against the temperature. Another example would be detection, number of passive
    infrared sensors could be generating data on movement within a location. Is a
    location hotspot at a specific time? This information can be easily clustered
    and inspected.


    Course work in the education sector, especially with the advent of large-scale
    learning online, can be clustered into student groups and results. For example,
    do certain clusters of students excel at courses compared to other students? Clustering
    is often used in digital imaging. When large groups of images need to be segmented,
    it''s usually a cluster algorithm that works on the set and defines the clusters.
    Algorithms can be trained to recognize faces, objects, or borders, for example.


    # Clustering Models


    As previously mentioned, the goal of clustering is to segment data into specific
    groups. There are many different clustering algorithms for the simple fact that
    there is really only one common denominator among all clusters—that’re trying
    to find groups of objects.


    For example, there are distribution models that use multivariate distributions
    for their modeling. Graph models can show cluster-like properties when the nodes
    starting as small subsets connected with one main edge, as shown in Figure 6.2.


    You can also approach simple clustering with groups in the same way group in a
    structured query language.'
