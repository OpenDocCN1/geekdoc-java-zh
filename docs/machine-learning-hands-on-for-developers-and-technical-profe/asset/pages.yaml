    \ to build out functions quickly in the REPL and transfer them to your main codebase.\n\
    \nThis streaming application uses the Java APIs to set up the streaming job, like\
    \ the example you saw earlier in the chapter. There are a few features that I've\
    \ added, though, to make the application and configuration easier.\n\n# Finding\
    \ Kafka Brokers\n\nAs you've realized from using the Kafka command-line tools,\
    \ there's a lot of specifying where broker lists and Zookeeper servers reside.\
    \ After a while, it becomes hard to find and configure all of them, especially\
    \ when it's a large cluster.\n\nWithin this application, there are two functions\
    \ that will create the broker list for us at runtime, so there's no need for configuration\
    \ or hard coding. The base Zookeeper server address is within the EDN configuration\
    \ file.\n\n```\n(defn get-broker-list\n  (zk-conf)\n  (let c (merge (zk-defaults/zk-client-defaults)\
