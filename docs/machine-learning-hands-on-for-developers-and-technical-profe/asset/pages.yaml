    # Making Predictions


    With Kafka handling the incoming events and training data, it''s now time to turn
    your attention to making predictions against the built models. In the event topic
    streaming application, you may have noticed a reference to the API endpoint.


    ```

    (def api-endpoint "http://localhost:3000/api/")

    ```


    The code for the API is covered earlier in the chapter. For making predictions,
    the three endpoints are used. They all work in the same way.


    ```

    /predict/<model to use>/<csv values>

    ```


    The model used in this instance is either the simple linear regression model (slr),
    the decision tree (dt), or the neural network (mlp). The CSV values are the three
    scores, 3, 4, and 5 to the decision tree. For example, a call to the API to predict
    the scores 3, 4, and 5 to the decision tree would look like this:


    ```

    http://localhost:3000/api/predict/dtr/3,4,5

    ```


    For predictions being made through Kafka via request_topic, there needs to be
    an application that will read the payload and run the prediction-against the API.


    # Prediction Streaming API


    The streaming application reads the message from the topic and deserializes to
    a JSON format. The configuration of the application is similar to that of the
    event processing application shown earlier.

    The real work happens in the run-prediction function.


    ```

    (def run-prediction [data-in]

    (let [json (pre-process-data data-in)

    prediction-json (p/make-prediction json)]

    (-> prediction-json

    (.getBytes)))

    ```'
