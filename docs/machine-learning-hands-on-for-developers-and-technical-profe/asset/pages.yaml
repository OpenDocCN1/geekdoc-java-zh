    To start the brokers, open two new terminal windows and ensure that each is in
    the directory where Kafka was installed. One broker is started in each terminal
    window.


    Starting the first broker, broker 0, is the same as previously shown.


    ```

    $ bin/kafka-server-start.sh config/server.properties

