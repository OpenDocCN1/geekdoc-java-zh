    \ jsonm)\n  (.getBytes)))\n```\n\n; This is the actual Kafka streaming application.\n\
    ; All the config is read in and the app will figure out the rest.\n\n```\n(def-start\
    \ []\n(let [{:keys [kafka zookeeper] :as configuration} (config keyword\nenv :profile))\n\
    (log/info \"PROFILE\" (env profile))\nbroker-list (broker-str (broker zookeeper))\n\
    props StreamsConfig/APPLICATION_ID_CONFIG, (:consumer-group\nkafka))\n```\n\n\
    ```\nStreamsConfig/BOOTSTRAP_SERVERS_CONFIG, broker-list\nStreamsConfig/ZOOKEEPER_CONNECT_CONFIG,\
    \ zookeeper\nStreamsConfig/TIMESTAMP_EXTRACTOR_CLASS_CONFIG\norg.apache.kafka.streams.processor.WallClockTimestampExtractor\n\
    StreamsConfig/KEY_SERDE_CLASS_CONFIG, (.Name\n(Serdes/String))\nStreamsConfig/VALUE_SERDE_CLASS_CONFIG,\
    \ (.Name\n(Serdes/ByteArray))\nbuilder (KStreamsBuilder.)\nkonig (StreamsConfig,\
    \ props)\ninput-topic (input-array [{:input-topic kafka])\nresponse-topic-name\
    \ (:output-topic kafka))\n(log/info \"Zookeeper Address: %s\" zookeeper)\n(log/info\
