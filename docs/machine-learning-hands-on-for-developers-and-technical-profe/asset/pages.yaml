    9.13.

    You need to tell Eclipse the Weka API is; it''s called `weka.jar`. On macOS machines,
    Weka is usually installed within the Applications directory. The location on Windows
    machines varies on the specific operating system and Weka installation. In most
    cases, it will be `/Program Files (x86)/Weka-3-8/weka.jar`.


