    Good mathematics and item matching isolated a number of items that mothers-to-be
    started to buy. Target has enough data to predict what trimester of the pregnancy
    mother is in. With an opt-in to the baby club, this might have passed without
    problem. When an angry father rolls up to the store to inquire why his daughter
    is receiving promotions and coupons, well, that''s a different matter.


    What does this example highlight? Well, apart from freaking out the customer,
    it causes undue pressure on the in-store staff. Everyone in the organization needs
    to be aware of what data is going on. Also, the data team needs to be aware of
    the social effect of their learning.


    The UK supermarket Tesco started the Clubcard loyalty scheme in 1995; it holds
    more data than some governments on purchasing behavior, social classes, and income
    bracket. The store''s data processing power is controlled by a marketing company,
    Dunn Humble, which runs the Clubcard and analyzes the data. What is the upside
    for the customer? Four times a year Club members receive coupons for money and
    incentives to buy items they normally purchase. The offers resemble the customers''
    typical shopping patterns, but other items are tracked in so it doesn''t look
    like they''ve been stalked.


    Mining the baskets is hardly a new idea (you''ll be reading about other techniques
    in later chapters), but when the supermarket becomes large and the volumes of
    data are huge, the insight that be gained becomes an enormous commercial advantage.
    The cost of this advantage is appearing to know the intimate details of the customer
    even when they''re not overly given permission to send offers.


    # Data Quality and Cleaning


    In an ideal world, you would receive data and put it straight into the system
    for processing. Then your favorite actor or actress would hand you your favorite
    drink and put you on the back for a job well done.


    In the real world, data is messy, usually unclean, and error prone. The following
    sections offer some basic checks you should do, and I''ve included some sample
    data so you can see clearly what to look for.


    The example data is a simple address book with a first name, last name, e-mail
    address, and age.


    # Presence Checks


    First things first, check that data has been entered at all. Within web-based
    businesses, registration usually involves at least an e-mail address, first name,'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Chapter 2 Planning for Machine Learning 27


    and last name. It''s amazing how many times users will try to avoid putting in
    their names.


    The presence check is simple enough. If the field is empty or null that piece
    of data is important in the analysis, you can''t use records from which the data
    is missing.


    | FIRSTNAME | LASTNAME | E-MAIL | AGE |

    |---|---|---||}{

    | Correct | Jason | Bell | me@domain.com | 42 |

    | Incorrect | Bell | | 42 |


    The first name and e-mail are missing from the example, so the record should be
    fixed or rejected. In theory, the data could be used if knowing the customer was
    not important.


    # Type Checks


    With relational databases you have schemas created, so there''s already an expectation
    of what type of data is going where. If incorrect data is written to a field of
    a different data type, then the database engine will throw an error and complain
    at you.


    In text data, as CSV files, that''s not the case, so it''s worth looking at field
    and ensuring that what you''re expecting is valid.


    ```

    #firstname, lastname, email, age

    Jason, Bell,me@domain.com, 42

    42, Bell,me@domain.com,Jason

    ```


    From the example, you can see that the first row of data is correct, but the second
    is wrong because the firstname field has a number in it and not a string type.
    There are a couple of things you could do here. The first option is to ignore
    the record, as it doesn''t fit the data-quality check. The other option is to
    see if any other records have the same e-mail address and the name after that.


    # Length Checks


    Length fields must be checked; once again, relational databases exercise a certain
    amount of control, but textual data can be error-prone if people don''t go with
    the general rules of the schema.


    | FIELD | LENGTH | GOOD | BAD |

    |---|---|---||}{

    | Firstname | 10 | Jason | Mr Jason Bell |

    | Email | 20 | me@domain.com | jason.bell@thing.domain.com |'
