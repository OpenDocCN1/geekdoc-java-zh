  md: 'In this short introduction, you will see how to create, list, and delete topics

    how to send messages to the log and receive them.


    # Creating Topics


    Topics can be created in one of two ways. The first is with the command-line

    tool, and the second is from within a producer application, which will create

    t topic if it does not exist.


    It''s worth working with the command line as that will give you an under-

    standing of what''s required within the topic creation, the required settings

    for replication, and how the header and Zookeeper settings are

    handled.


    Let''s create a test topic now; we''ll call it testtopic for demonstration.

    Within the binary of the Kafka distribution, you will see a shell script

    called kafka-topics.sh this is the main command for topic-related activities.

    to create the topic, execute the following command from your terminal window:


    ```

    $KAFKA_HOME/bin/kafka-topics.sh --zookeeper localhost:2181 --create

    --topic testtopic --replication-factor 1 --partitions 1

    Created topic ''testtopic''

    ```


    Let''s break this command down into smaller segments and break down when

    t script is doing. The first setting is telling Kafka which Zookeeper server

    are using. This is a required setting, as we''re using the local deployment, and

    the Zookeeper server is running on localhost on port 2181 (the default port for

    Zookeeper).


    Next --create is telling the application we want to create a topic. The name

    of the topic is handled next with the --topic flag. As the cluster is just forndevelopment,
    I''m not concerned about the replication factor or the number of

    partitions, this is set to 1.


    # Finding Out Information About Existing Topics


    With the same command, you can find out information about the topics that

    are available on the cluster. To generate a list of all the topics on the cluster,
    run

    t following command:


    ```

    bin/kafka-topics --zookeeper localhost:2181 --list

    testtopic

    ```


    If you''ve created only one topic, then you may be surprised to see more topics

    y you were expecting. The Kafka cluster creates internal topics for monitor-

    t and metrics. From the offset information, including the message positions

    of the associated consumers, is held within a topic as well.'
