  md: '# Further Development


    You will discover putting together a basic cluster algorithm with SimpleKMeans
    is a fairly straightforward matter. I''ve covered the main aspects of coding a
    solution. There are obvious developments from this point, such as connecting to
    a database table with Java Database Connectivity (JDBC) and extracting the data
    into instances.


    One thing to remember with Weka is that when huge volumes of data are applied,
    the memory performance can suffer. I suggest that most needs of enterprises are
    still covered using this method and can be developed with scale in mind. In particular,
    sampling the data to fit in Weka memory will give you very good results.


    # Summary


    Clustering will be one of those machine learning techniques that you''ll pull
    out again and again. To that end, it needs some thought before you go building
    clusters and seeing what happens.


