  md: '# Windows


    The .exe download for Windows provides binaries for running on 32- or 64-bit machines.
    The base package download will provide you with everything you need to get started.


    # Linux


    Binary downloads are available for Debian, Ubuntu, Red Hat, and SUSE Linux distributions.
    If you want to save some time (and effort) and you''re running Debian or Ubuntu,
    then you can use apt-get to install the r-base and r-base-dev packages. Ensure
    that the repository package is up-to-date. For users of the Red Hat family of
    distributions, use the command sudo yum install


    # Your First Run


    When you run R, you''re presented with the basic R shell, as shown in Figure 14.1.
    This is the main place where the work is done. It is sparse, but it does the job
    fine.


    Use this to quit the shell


