  md: '# Chapter 2 ■ Planning for Machine Learning


    Whiteboards are good, too. Whiteboards hold lots of ideas and diagrams, but I
    find they can get out of control and messy after a while. There was one office
    wall in Santa Clara that I covered in sticky notes.(I did take them down once
    I was finished. The team thought it was.)


    Planning might take into account where the data is coming from, if it needs to
    be cleaned, what learning methods to use, and what the output is going to look
    like. The main point is that these things can be changed at any time—the earlier
    in the process they change, the better. So, it''s worth taking the time to sit
    around a table with stakeholders and the team and figure out what you are trying
    to achieve.


    # Developing


    This process might involve algorithm development or code development. The more
    iterations you perform on the code, the better it will be. Agile development processes
    work best; in agile development, you work on what needs to be done without trying
    to future-proof the software as you go. It''s worth using some form of code repository
    like GitHub or Bitbucket to keep all your work private; it also means you can
    roll back to earlier versions if you''re not happy with the way things are going.


    # Testing


    In this case, testing means testing with data. You might use a random sample of
    the data or the full set. The important thing is to remind yourself that you''re
    testing the process, so it''s okay for things not to go as planned. If you push
    things to production, you won''t really know what''s going to happen. With testing
    you can get an idea of the pain points. You might find data loading issues, data-processing
    issues, or answers that just don''t make sense. When you test, you have time to
    change things.


    # Reporting


    Sit down with the stakeholders and discuss the results. Do the results make sense?
    The developers and mathematicians want to amend algorithms or the code. Stakeholders
    might have a new question to ask (this happens a lot), or perhaps you want to
    introduce some new data to get another angle on the answers. Regardless of the
    situation, make sure the original people from the planning phase are back around
    the table again.


    # Refining


    When everyone is happy with the way the process is going, it''s time to refine
    code and, if possible, the algorithms. With huge volumes of data, if you squeeze'
