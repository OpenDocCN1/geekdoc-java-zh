  md: '# R


    R is an open source statistical programming language. The syntax is not the easiest
    to learn, but I encourage you to take a look at it. It also has a large number
    of machine learning packages and visualization tools. The R project allows Java
    programmers to access R functions from Java code. For a basic introduction to
    R, take a look at Chapter 14, “Machine Learning with R.”


    # Matlab


    The Matlab language is used widely within academia for technical computing and
    algorithm creation. Like R, it also has a facility for plotting visualizations
    and graphs.


    # Scala


    A new breed of languages is emerging that takes advantage of Java’s runtime environment,
    which potentially increases performance, based on the platform. Scala (which is
    an acronym for Scalable Language) is one of these, and it is being widely used
    by a number of startups.

    There are machine learning libraries, such as ScalaNLP, but Scala can access Java
    JAR files, and it can also implement the likes of Classifier4J and Mahout. It’s
    also core to the Apache Spark project, which is covered in Chapter 13, “Apache
    Spark”


    # Ruby


    Many people know about the Ruby language by association with the Ruby on Rails
    web development framework, but it’s also used as a stand-alone language. The best
    way to integrate machine learning frameworks is to look at JRuby, which is a JVM-based
    alternative that enables you to access the Java machine learning libraries.


    # Software Used in This Book


    The hands-on elements in the book use a number of programs and packages to get
    the algorithms and machine learning working.


    To keep things easy, I strongly advise that you create a directory on your system
    to install all these packages. I’m going to call mine mlbook.


    ```

    $mkdir ~/mlbook

    $cd ~/mlbook

    ```'
