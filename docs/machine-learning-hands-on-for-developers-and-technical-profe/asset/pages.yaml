  md: '# Connecting to Social Media with R


    I know, another mention of the Twitter application program interface (API). This
    sort of data is important and not for sentiment analysis. The majority of news,
    social graphs, and conversations happen on these platforms, and it''s increasingly
    important to keep on top of developments. This goes for R, too; being able to
    connect to Twitter is important.


    In the previous examples you used Twitter''s development account to create the
    authorization keys for the application. You''re essentially forcing your application
    to use these pre-existing keys. That works, but you have to approach things a
    little differently for the tweetlibrary.


    Make a note of the consumer key and secret you''ll need, but there are couple
    of other things you need to confirm.


    First, make sure there''s no callback URL. You confirm this on the Settings tab
    of your application. Make the Allow This Application to Be Used to Sign in Twitter
    box is set to true as well. Don''t forget to update the settings for them to take
    effect. Refresh the page until you see the settings are correct.

    Now that Twitter is set up, you can look at R code to help you log to Twitter.


    You need to open a text editor and edit the following code:


    ```

    library(twitterR)

    cred <- OAuthFactory$new(consumerKey="xxxxxxxxxxxx",nconsumerSecret="xxxxxxxxxxxxxxxx"

    requestURL="http://api.twitter.com/oauth/request_token",naccessURL="http://api.twitter.com/oauth/access_token",nauthURL="http://api.twitter.com/oauth/authorize"

    downloadfile(url="http://curl.hax.se/ca/cacert.pem",

    destfile="cacert.pem")

    cred$handshake(cainfo="cacert.pem")

    ```


    Replace the consumer key and secret values with the ones you have for your application.
    Save the file as twitterconnect.r and then quit the text editor. Back in the R
    command line, load the file, and it runs as soon as it''s loaded.


    ```

    >source(''twitterconnect.r'')

    ```


    You see the twitterR library loads the dependencies and then connect to Twitter.


    ```

    > source("twitterconnect.r")

    Loading required package: ROAuth

    Loading required package: htURL

    Loading required package: bitops

    Loading required package: digest

    ```'
