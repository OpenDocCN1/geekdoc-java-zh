  md: '# Working with Decision Trees


    Do not be deceived by the decision tree; at first glance it might look like a
    simple concept, but within the simplicity lies its power. This chapter shows you
    how decision trees work. The examples use Weka to create a working decision tree
    that will also create the Java code for you.


    # The Basics of Decision Trees


    The aim of any decision tree is to create a workable model that will predict the
    value of a target variable based on the set of input variables. This section explains
    where decision trees are used along with some of the advantages and limitations
    of decision trees. In this section, you also find out how a decision tree is calculated
    manually so you can see the math involved.


    # Uses for Decision Trees


    Think about how you select different options within an automated telephone call.
    The options are essentially decision trees being made for you to get to the desired
    department. These decision trees are used effectively in many industry.

    Financial institutions use decision trees. One of fundamental use cases is in
    option pricing, where a binary-like decision tree is used to predict the price
    of an option in either a bull or bear market.'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# Chapter 5 Working with Decision Trees


    Marketers use decision trees to establish customers by type and predict whether
    a customer will buy a specific type of product.


    In the medical field, decision tree models have been designed to diagnose blood
    infections or predict heart attack outcomes in chest patients. Variables in the
    decision tree include diagnosis, treatment, and patient data.


    The gaming industry uses multiple decision trees in movement recognition and facial
    recognition. The Microsoft Kinect platform uses this method to track body movement.
    The Kinect team used one million images and trained three trees. Within one day
    and using a 1,000-core cluster, the decision trees were classifying specific body
    parts across the screen.


    # Advantages of Decision Trees


    There are some good reasons to use decision trees. For one thing, they are easy
    to read. After a model is generated, it''s easy to report to others regarding
    how the trees work. Also, with decision trees you can handle numerical or categorized
    information. Later, this chapter demonstrates how to manually work through an
    algorithm with category values; the example walk-through uses numerical data.


    In terms of data preparation, there is something comma-separated variables, then
    you can create a working model. This also makes it easy to validate the model
    using various tests. Decision trees use white-box testing—meaning the internal
    workings can be observed but not changed; you can view the steps that are being
    used when the tree is modeled.


    Decision trees perform well with reasonable amounts of computing power. If you
    have a large set of data, decision tree learning will handle it well.


    # Limitations of Decision Trees


    With every set of advantages there is usually a set of disadvantages sitting in
    the background. One of the main issues with decision trees is that they can create
    complex models, depending on the data presented in the training set. To avoid
    the machine learning algorithm''s over-fitting the data, it''s sometimes worth
    reviewing the training data and pruning the trees to categories, which will produce
    a more refined and better-tuned model.


    Some of the decision tree concepts can be hard to learn the model cannot express
    them easily. This shortcoming sometimes results in a larger-than-normal model.
    You might be required to change the model or look at different methods of machine
    learning.


    # Different Algorithm Types


    Over the years, there have various algorithms developed for decision tree analysis.
    Some of the more common ones are listed here.'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# Chapter 5 Working with Decision Trees 83


    # ID3


    The ID3 (Iterative Dichotomiser 3) algorithm was invented by Ross Quinlan to create
    trees from datasets. By calculating the entropy for every attribute in the dataset,
    this could be split into subsets based on the minimum entropy value. After the
    set had a decision tree node created, all that was required was to recursively
    go through the remaining attributes in the set.


    ID3 uses the method of information gain—the measure of difference in entropy before
    and after an attribute is split—to decide on the root node (the node with the
    highest information gain).


    ID3 suffered from over-fitting on training data, and the algorithm was better
    suited to smaller trees than large ones. The ID3 algorithm is used less in favor
    of the C4.5 algorithm, which is outlined next.


    # C4.5


    Quinlan came back for an encore with the C4.5 algorithm. It''s also based on the
    information gain method, but it enables the trees to be used for classification.
    This is widely used algorithm in that many users run in Weka with the open source
    Java version of C4.5, the J48 algorithm.


    There are notable improvements in C4.5 over the original ID3 algorithm. With the
    ability to work on continuous attributes, the C4.5 method will calculate a threshold
    point for the split to occur. For example, with a list of values like the following:


    85, 80, 83, 70, 68, 65, 64, 72, 69, 75, 72, 81, 71


    C4.5 will work out a split and give a simple decision criterion of the attribute
    (a)


    ```

    a < 80 or a > 80

    ```


    C4.5 has the ability to work despite missing attribute values. The missing values
    are marked with a question mark (?). The gain and entropy calculations are simply
    skipped when there is no data available.


    Trees created with C4.5 are pruned after creation, the algorithm will revisit
    the nodes and decide if a node is contributing to the result in the tree. If it
    isn''t, then it is replaced with a leaf node.


    # CHAID


    The CHAID (Chi-squared Automatic Interaction Detection) technique was developed
    by Gordon V. Kass in 1980. The main use of it was within marketing, but it was
    also used within medical and psychiatric research.'
  merge: -1
