  md: '# Chapter 9 Artificial Neural Networks


    In biology terms, a neuron is a cell that can transmit and process chemical or
    electrical signals. The neuron is connected with other neurons to create a network;
    picture the notion of graph theory with nodes and edges, and then you''re picturing
    a neural network.


    Within humans, there are a huge number of neurons interconnected with each other—tens
    of billions of interconnected structures. Every neuron has an input (called the
    dendrite), a cell body, and an output (called the axon), as shown in Figure 9.1.


    ![](img/896dd33398480a544ce5ff39ab4e6e43_189_0.png)


    Figure 9.1: The neuron structure


    Outputs connect to inputs of other neurons, and the network develops. Biologically,
    neurons can have near 10,000 different inputs, but their complexity is much greater
    than the artificial ones I''m talking about here.


    Neurons are activated when the electrochemical signal is sent through the axon.
    The cell body determines the weight of the signal, and if a threshold is passed,
    the firing continues through the output, along the dendrite.


    # Artificial Neural Network Uses


    Artificial neural networks thrive on data volume and speed, so they are used within
    real-time or very near real-time scenarios. The following sections describe some
    typical cases where artificial neural networks are used.


    # High-Frequency Trading


    With the artificial neural networks mimic the brain but with a much increased
    speed factor, they are perfect for high-frequency trading (HFT). Because HFT can
    make decisions faster than a human can—thousands of transactions'
  merge: -1
  pgno: 189
- img_proc: true
  md: '# Chapter 9 ■ Artificial Neural Networks 167


    can be done in the same time it takes a human to make one—it''s obvious why the
    majority of stock market systems have gone to the automated trading side.


    High-frequency trading is usually done on a supervised learning method; there
    is a lot of trading data available from which to learn. The artificial neural
    network is looking for entropy from the incoming data.


    # Credit Applications


    Although many examples of credit applications are performed with decision trees,
    they are often run with artificial neural networks. With the variety of application
    data available, it''s a fairly straightforward task to train the model to spot
    good and bad credit factors.


    # Data Center Management


    Google uses neural networks for data center management. With incoming data on
    loads, operating temperatures, network usage, and outside air temperatures, Google
    can calculate efficiency of the data center and be able to adjust the settings
    on monitoring and cooling equipment.


    Jim Gao started this as a Google 20 percent project (a program in which Google
    employees are encouraged to use 20 percent of their work time on their own projects)
    and, over time, has trained the model to 99.6 percent accurate. If you are interested
    in reading more on this, check Google''s blog post on the subject here:


    ```

    http://googleblog.blogspot.ca/2014/05/better-data-centers-through-machine.html

    ```


    # Robotics


    Artificial intelligence has been used in robotics for several years. Some artificial
    intelligence requires pattern recognition, and some huge amounts of sensor data
    to be fed into a neural network to determine what movement or action to take.


    Training models in robotics takes an awful long time to create, because there
    are so many different inputs and output variables to process and learn from. For
    example, developers of autonomous driving vehicles need hundreds of thousands
    of previous driving data to make a model that can handle many road conditions.


    The car manufacturer Tesla collects the live data from its vehicles; this means
    it is generating knowledge 24 hours a day. This data is used to enrich the self-driving
    experience in its vehicles. Personally, I prefer my hands on the wheel; that''s
    just my preference.'
