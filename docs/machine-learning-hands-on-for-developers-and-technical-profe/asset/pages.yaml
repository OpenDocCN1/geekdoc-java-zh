  md: 'For learning purposes, I''ve kept the replication factor and partitions to
    1. If this system were put into a production setting, I would be looking at increasing
    these numbers to give some resilience of the overall application. The following
    is the full script to create the topics required:


    ```

    KAFKA_HOME=/usr/local/kafka/2.11-1.0.0/

    ZK_CONNECT=localhost:2181

    REPLICATION_FACTOR=1

    PARTITIONS=1

    ```


    ```

    # training_data_topic - Where the raw data will be transported to

    training. Using Kafka Connect to push the data to a datastore.

    echo "Creating topic: training_data_topic"

    ```


    ```

    $KAFKA_HOME/bin/kafka-topics.sh --create --topic training_data_topic

    --zookeeper $ZK_CONNECT --partitions $PARTITIONS --replication-factor

    $REPLICATION_FACTOR

    ```


    ```

    # event_stream_topic - Events are sent to the Events Kafka Streaming API

    application.

    echo "Creating topic: event_topic"

    $KAFKA_HOME/bin/kafka-topics.sh --create --topic event_topic --zookeeper

    $ZK_CONNECT --partitions $PARTITIONS --replication-factor

    FACTOR

    ```


    ```

    # prediction_request_topic - Sends data to the Prediction Streaming

