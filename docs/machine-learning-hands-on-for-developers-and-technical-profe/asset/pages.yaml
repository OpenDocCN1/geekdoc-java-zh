  md: '# Checking the Java Version


    As the programs used in the book rely on Java, you need to quickly check the version
    of Java that you''re using. The programs require Java 1.8, or newer. To check
    your version, open a terminal window and run the following:


    ```

    $ java -version

    java version "1.7.0_40"

    Java(TM) SE Runtime Environment (build 1.7.0_40-b43)

    Java HotSpot(TM) 64-Bit Server VM (build 24.0-b56, mixed mode)

    ```


    If you are running a version older than 1.6, then you need to upgrade your Java
    version. You can download the current version from


    www.oracle.com/technetwork/java/javase/downloads/index.html


    # Weka Toolkit


    Weka (Waikato Environment for Knowledge Acquisition) is a machine learning and
    data mining toolkit written in Java by the University of Waikato in New Zealand.
    It provides a suite of tools for learning and visualization via the supervised
    workbench program or the command line. Weka also enables you to retrieve data
    from existing data sources that have a JDBC driver. With Weka you can do the following:


    +   - Preprocessing data

    - Clustering

    - Classification

    - Regression

    - Association rules


    The Weka toolkit is widely used and now supports the Big Data aspects by interfacing
    with Hadoop for clustered data mining.

    You can download Weka from the University of Waikato website at


    www.cs.waikato.ac.nz/ml/weka/download.html


    There are versions of Weka available for Linux, macOS, and Windows. To install
    Weka on Linux, you just need to unzip the supplied file to a directory. On macOS
    and Windows, an installer program is supplied that will unzip all the required
    files for you.'
