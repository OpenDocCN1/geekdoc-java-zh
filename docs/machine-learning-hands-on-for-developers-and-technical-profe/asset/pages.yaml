    \ might be personality scorers in a social network or what kind of music you are.\n\
    \nThe Word2Vec algorithm is based on vectors, called neural word embeddings, representing\
    \ words with numbers. Word2Vec trains against other words in the input text. This\
    \ is done in two ways, either using a continuous bag (CBOW), which is a context\
    \ of words to predict a target word, or using skip grams, which predicts a word\
    \ from a context of words.\n\nWords are read in the vector one at a time and scanned\
    \ within a certain range of words; these skip-grams are an n-gram with items dropped.\
    \ During the training, the vector contains the context of each word and the similarity\
