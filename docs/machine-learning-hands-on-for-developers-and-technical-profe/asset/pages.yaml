- img_proc: true
  md: '# Chapter 2 = Planning for Machine Learning 41


    The planning phase is a constantly evolving process, and the more machine learning
    projects you and the team perform, the more you will learn from previous mistakes.


    The key is to start small. Take a snapshot of the data and take a random sample
    with a size of 10 percent of the total. Get the team to inspect the data. Can
    you work with it? Do you anticipate any problems with the processing of this data?


    Cleaning the data might take the most time of the project; the actual processing
    might consume only a fraction of the overall project time. If you supply clean
    data, then your results will be refined.


    Regardless of whether you are working on a 10-person team or on your own, be aware
    of your network of contacts; some might have domain knowledge that will be useful.
    Ask lots of questions, too. You''d be surprised how many folks are willing to
    answer questions in order to see you succeed.


    The next few chapters examine some different machine learning techniques and put
    some sample code together, so you can start to apply them to your own projects.'
  merge: -1
