    #  Summary


    The Spark framework has changed a lot since it was covered in the first edition
    of this book. The APIs are a lot easier to code with, especially for Java. If
    you use Python, then it''s worth looking at the PySpark REPL for doing Spark work.
    If you are a Clojure user, then there are a number of Spark wrappers available
    to you as well.


    Remember, this framework is for large-scale data. If you have medium or small
    amounts of data, then look at the alternatives that were shown earlier in the
    book first. If those seem to struggle while training, then it''s worth looking
    at Spark as the next stage of your development pipeline.'
