    \ applied to the input string. I'm using a StringBuilder to create an output string\
    \ that can be used.\n\n```\npublic String removePunctuation(String in) {\n   \
    \ String pattern = \"[\\w]+\\]+\";\n\n    Pattern pattern = Pattern.compile(pattern);\n\
