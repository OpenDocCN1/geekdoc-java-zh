- img_proc: true
  md: '# Chapter 2 ■ Planning for Machine Learning 39


    The Java programming language has a few APIs to choose from that will enable you
    to read and write spreadsheets. The Apache POI project and Excel API are the most
    popular.


    # Databases


    If you''ve been brought up with web programming, you might have had some exposure
    to databases and database tables. Common ones are MySQL, Postgres, Microsoft SQL
    Server, and Oracle.


    Recently, there''s been an explosion of NoSQL (meaning Not Only SQL), such as
    MongoDB, CouchDB, Cassandra, and HBase, which all bring their flavors to storage.
    These document and key-value stores move away from the rigid table-like structures
    of traditional databases.


    In addition, there are graph databases such as Apache Giraph and Neo4j and in-memory
    systems such as Spark, memcached, and Storm. Chapter 13 is an introduction to
    Spark.


    In my opinion, all databases have their place and are worth investigating. There''s
    nothing wrong with having relational, document, and graph databases running concurrently
    for the project. Each has its advantages to the project that you might not have
    considered. As with all things, there might be a learning curve that you need
    to factor into your project time.


    # Images


    The common data formats previously mentioned mainly deal with text or numbers
    in different shades, but you can''t discount images. There are a number of things
    you can learn from images. Whether you''re trying to use facial recognition or
    emotion tracking or you''re trying to determine whether an image is a car or dog
    (yes, it has been done), there are several APIs that will help.


    The most popular formats are Portable Network Graphics (PNG) and JPEG images;
    these are regularly used on the Web. If processing power is freely available,
    then TIFF or BMP are much larger files, but they can contain more information.


    Ultimately our job is to convert images to numbers so the algorithms can work
    with the vectors of number information. This will require reducing image size
    and then doing the conversion. More of these techniques are covered in Chapter
    11, "Machine Learning from Image Information."


    # Thinking About Output Data


    Now it''s time to turn your attention to the output data. This is where the stakeholders
    have a say in how things are going to be done, because ultimately it will be those
    people who deal with the results.'
  merge: -1
