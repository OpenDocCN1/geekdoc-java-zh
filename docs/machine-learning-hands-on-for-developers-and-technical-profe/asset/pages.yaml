    # Altering the Network


    With the GUI option set to True, you can add nodes and also remove input paths
    to parts of the hidden layer. If you make any changes, you need to retrain the
    neural network; the updated network will display in the GUI.


    # Which Bit Is Which?


    Working from left to right to the GUI, you see the raw input nodes as labels in
    the yellow boxes. Red dots are the hidden layer nodes, and the orange dots are
    the output nodes. The orange labels are the classes with which the orange nodes
    are associated.


    # Adding Nodes


    You can add a new node by clicking the GUI. The red dot appears to signify a hidden
    layer node. It won''t be connected to anything, unless you have already selected
    nodes in the GUI.


    # Connecting Nodes


    With the node selected, you can click another node to see the connection being
    made.


    # Removing Connections


    To remove a connection, select one of the connected nodes and then right-click
    the other connected node. The connecting line disappears.


    # Removing Nodes


