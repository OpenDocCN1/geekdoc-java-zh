    # Creating Your First Java Code in R


    Open your R console or R-Studio. Assuming you''ve installed the package earlier
    in this chapter, you can do the following:


    ```

    > library(rJava)

    > .jinit()

    > stringobj <- .jnew("java/lang/String", "This is a string as a Java

    object, in R")

    > stringobj

    [1] "Java-Object(This is a string as a Java object, in R)"

    ```


    After the library is loaded, you need to initialize the rjava system with the

    .jinit() method. You then create a new variable in R that is containing a

    Java object string. The .jnew() method creates a new String object and popul-

    ates. Notice that you need to put the full Java package name in with

    as slashed notation and not the dotted one.


    If you want to find the position of the word Java in the string, you use Java''s

    indexOf. You can call it with Java by executing the following:


    ```

    [1] "Java-Object(This is a string as a Java object, in R)"

    > .jcall(stringobj, "I", "indexOf", "Java")

    [1] 22

    ```


    The command looks involved. The first parameter is the existing object you

    previously created. The next is the return type from method; because the indexOf

    method returns an integer, you use the "I" in the calling method. Next is the

    method name—“indexOf”—and last is the thing you''re looking for, "Java". You

    see the result on the line under.


    For the full package information for the rjava interface, take a look at the

    method list at


    ```

    http://rforge.net/doc/packages/rJava/00Index.html

    ```


