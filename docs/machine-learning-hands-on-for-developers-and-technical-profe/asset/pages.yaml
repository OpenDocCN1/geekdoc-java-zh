    \n# TF/IDF\n\nOne useful technique is to find out how important a word or phrase\
    \ is within a corpus or a collection of documents. Term Frequency/Inverse Document\
    \ Frequency (TF/IDF) is a method of giving a numerical value to the importance\
    \ of a word. TF/IDF is used widely within recommendation systems, and it's quite\
    \ easy to implement.\n\nTo give you an idea of how it works, let's work through\
    \ some sample code to build a TF/IDF algorithm in Java.\n\n# Loading the Documents\n\
    \nBefore any calculations can be done, we need to load the documents into the\
    \ application. The documents are loaded and split on the space character; each\
    \ word is added to a List collection and returned. The reason for using a List\
    \ of words is simple; it will be easier to iterate and count the word frequencies.\
    \ I'm assuming that the document is clean, as in that it has been converted to\
    \ lowercase and the punctuation has already been removed.\n\nFor every document\
    \ that you included in your document set, you will execute this step and load\
    \ the document.\n\n```\npublic List<String> loadDocToStrings(String filePath)\
    \ {\n    List<String> words = new ArrayList<String>();\n    try {\n        File\
    \ file = new File(filePath);\n        BufferedReader reader = new BufferedReader(new\
    \ FileReader(file));\n        String s;\n        while ((s = reader.readLine())\
    \ != null) {\n            String[] ws = s.split(\" \");\n            for (int\
    \ i = 0; i < ws.length; i++) {\n                words.add(ws[i]);\n          \
    \  }\n        }\n    } catch (IOException e) {\n        e.printStackTrace();\n\
    \    }\n    return words;\n}\n```"
