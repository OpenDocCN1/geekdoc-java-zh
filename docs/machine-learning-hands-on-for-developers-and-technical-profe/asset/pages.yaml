  md: '# Finding Pi with Random Numbers


    The Monte Carlo method is the concept of emulating a random process. When the
    process is repeated many times, it will give rise to the approximation of some
    mathematical quantity of interest. So, in theory with enough random darts thrown
    at a circle, you should be able to find the number of Pi.


    Figure 4.5 shows square.


    ![](img/896dd33398480a544ce5ff39ab4e6e43_100_0.png)


    Figure 4.5: Initial drawing of a square


    Now draw a circle within the square (see Figure 4.6).


    ![](img/896dd33398480a544ce5ff39ab4e6e43_100_1.png)


    Figure 4.6: Circle within a square


    Placing enough random data in the square will give you darts that are in the square,
    and some of them will be within the circle (see Figure 4.7). These are the darts
    that we''re really interested in.


    ![](img/896dd33398480a544ce5ff39ab4e6e43_100_2.png)


    Figure 4.7: Random darts within the circle and the square'
