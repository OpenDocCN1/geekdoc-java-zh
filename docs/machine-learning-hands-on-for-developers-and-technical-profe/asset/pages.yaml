  md: '# Chapter 3 Data Acquisition Techniques 53


    # Migrating Files to Database


    You have been asked to migrate some online review stats from a file dump in CSV
    format and migrate them to MySQL. While I appreciate it''s easy to migrate a single
    file to MySQL database with the mysqldump command, when there are many files in
    a directory, a more managed approach is required.


    The schema for the MySQL database is in the same directory as the configuration.
    To install it, assuming you have MySQL installed (it will also be used in Chapter
    12, "Machine Learning with Kafka"), run the following command to create the database:


    ```

    $ mysqldmin -u root -pyourpassword create embodtest

    ```


    Import the schema.


    ```

    $ mysql -u root -pyourpassword> embodtest < schema.sql

    ```


    The next job is to install the MySQL plugin from the Embulk repository. From the
    command line, run the following Embulk command:


    ```

    $ gem install embulk embulk-output-mysql

    2019-01-01 01:01:01.00 +0100; Embulk v0.9.17

    Gem path is: /home/jason/.embulk/lib/gems

    Fetching: embulk-output-mysql-0.8.2.gem (100%)

    Successfully installed embulk-output-mysql

    1 gem installed

    ```


    I''m using the simple config principle that I used in the previous example; I''m
    going to let Embulk do the work for me. This time, I''ve crafted the required
    output element with the information about the MySQL database username and password
    information.


    ```

    type: file

    path_prefix: /path/to/repo/.embulkdata/file_to_db/output/

    type: mysql

    host: localhost

    user: root

    password: xxxxx

    port: 3306

    table: scenario

    database: embodtest

    mode: insert

    ```


    When I run the guess function on Embulk, it will generate the config.yml as shown
    earlier, keeping the output element intact and updating the input element with
    the new information it learned from the CSV file.'
