    RDD is based in memory.


    # Filter Text from the RDD


    With the .filter function, you can start to inspect specific things within the
    text file. Assuming that you want to see how many times the word statistical occurs
    in the document, you can run the following:


    ```

    scala> text.filter(line => line.contains("whale")).count()

    ```


    One line in Scala and Spark iterate the RDD and inspect the lines. Because you''ve
    appended the count at the end, you will get the following result:


    ```

    res3: Long = 316

    ```


    So, there are 316 mentions of the word whale in the entire document. If required,
    you could save this output to another Spark Array.


    ```

    scala> var filtered = textF.filter(line => line.contains("whale"))

    filtered: org.apache.spark.RDD[String] = MapPartitionsRDD[6]

    at at <console>:25

    ```


    ```

    scala> filtered.count()

    res4: Long = 316

    ```


    With the aid of concise commands in Scala and the power of in-memory processing
    of distributed datasets (the RDDs), you have a neat system to get large amounts
    of crunching done quickly.


    # Spark Monitor


    Earlier, I mentioned that when you start Spark, a few things are being run. One
    of them is the web-based monitor. If you point your browser to http://<yourdomain>:4040,
    you should get the website shown in Figure 13.1, assuming Spark is still running.


    As far as Spark is concerned, every line you run is a job, so Spark logs it accordingly,
    giving its duration and outcome. There''s also information on the storage and
    runtime environment.


    You can click each of the stages to see full details of the job and its execution
    output. If one of your jobs is causing trouble, it''s handy to look here first
    and get a bird''s-eye view of things.'
