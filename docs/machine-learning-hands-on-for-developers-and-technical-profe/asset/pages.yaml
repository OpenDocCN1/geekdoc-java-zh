  md: "Consumer applications are members of consumer groups. It's not essential to\
    \ specify one, but Kafka will assign one during runtime if a group name is not\
    \ given. It's worth using your own group names for ease of searching for metrics\
    \ consumers.\n\nAs previously shown in the producer application, we are aware\
    \ that the key and payload data for our messages are strings. The producer application\
    \ serialized with the key.serializer and value.serializer settings. Consumers\
    \ require the deserializers for the message. When the message is consumed by the\
    \ consumer, it arrives as a byte array; it’n deserialized to the format specified\
    \ in the properties.\n\n```\nProperties props = new Properties();\n```\n\n```\n\
    props.put(\"bootstrap.servers\", \"localhost:9092\");\nprops.put(\"group.id\"\
    , \"testcog\");\nprops.put(\"auto.commit\", \"true\");\nprops.put(\"auto.commit.interval.ms\"\
    , \"1000\");\nprops.put(\"session.timeout.ms\", \"30000\");\nprops.put(\"key.deserializer\"\
    ,\n  \"org.apache.kafka.common.StringDeserializer\");\nprops.put(\"value.deserializer\"\
    ,\n  \"org.apache.kafka.common.StringDeserializer\");\n```\n\n# Fetching Consumer\
    \ Records\n\nConsumer applications poll records from the broker. The .poll() method\
    \ takes an integer value with the number of records you want the consumer to process.\
    \ Depending on the message load from the brokers, if you pull too many messages,\
    \ you can have a slow-running consumer. Time to test and experiment with the number\
    \ of records you are polling.\n\nDuring polling and processing of records, the\
    \ commit position of the topic is written back to the log. If the properties of\
    \ the consumer enable the auto setting of the offset, this will be performed while\
    \ your application is running. The duration between each setting of the offset\
    \ is determined by the value of the auto.commit.interval.ms setting; in this application\
    \ example, it to 1000ms, or 1 second.\n\n```\nKafkaConsumer<String, String> consumer\
