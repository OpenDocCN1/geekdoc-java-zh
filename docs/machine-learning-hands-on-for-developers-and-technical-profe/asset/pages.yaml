  md: '# Gaming Analytics


    We''ve already established checkers is a good candidate for machine learning.
    Do you remember those old chess computer games with the plastic pieces? The human
    player made a move, and then the computer made a move. Well, that''s a case of
    machine learning algorithms in action. Fast-forward a few decades (the chess computer
    still feels like yesterday to me) to today when the console market is pumping
    out analytics every time you play your favorite game.


    Microsoft has spent time studying the data from Halo 3 to see how players perform
    on certain levels and to figure out when players are using cheats. Fixes have
    been created based on the analysis of data coming back from the consoles. Other
    games like Blizzard (Overwatch), Epic Games (Fortnite), and Respawn Entertainment
    (Apex Legends) use matrix calculations to ensure that players are suitably matched
    before a game start.


    Microsoft also worked on Drivatar, which is incorporated into the driving Forza
    Motorsport. When you first play the game, it knows about your driving style. Over
    a period of practice the system learns your style, consistency, exit speeds, and
    positioning on the track. The sampling happens over three laps, which is enough
    time to see how your player behaves. As time progresses, the system continues
    to learn from your driving style, the game opens up new levels and lets you compete
    with other drivers and earn your friends.


    Even with story-based games like The Last of Us by Naughty Dog, characters within
    gameplay scenes are aware of their surroundings and other characters within the
    gameplay. For example, if a bottle is thrown and smashes, enemies, friends, and
    infected alike would be alerted and their next moves decided by in-play artificial
    intelligence.


    If you have children, you might see the likes of Nintendo (or cats), a game in
    which a person is tasked with looking after an on-screen scale (Think Tamagotchi,
    but on a larger scale) Algorithms can work out when the pet needs to play, how
    to react to the owner, and how hungry the pet is.


    It''s the early days of game companies putting machine learning into infrastructure
    to make the games better. With more and more games appearing on small devices,
    such as those with the iOS and Android platforms, the real learning is in how
    to make players come back and play more and more. Analysis can be performed about
    the “stickiness” of the game—do players return to play again, or do they drop
    off over a period of time in favor of something else? Ultimately there''s a trade-off
