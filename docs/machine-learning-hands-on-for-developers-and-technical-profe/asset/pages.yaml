  md: "# Loading and Converting the Dataset\n\nYou can download the dataset from the\
    \ GitHub repository. In the folder /data/ch04 there is a file stats.txt. As we\
    \ are dealing with the text of numbers, there are some tasks that are required\
    \ before we can start any work. Let's look at the first file, shown here:\n\n\
    ```\n2\n5\n3\n4\n...\n3\n9\n8\n```\n\n```\n/data/ch04/stats.txt\n```\n\nWhile\
    \ it appears that there are numbers on each line of the text file, they are still\
    \ treated as text. If we were to use mathematical notation at this point, our\
    \ list of numbers would look like this:\n\n```\n{2, 5, 3, 4,..,3, 9, 8, 8}\n```\n\
    \nOur first task is to convert the contents of each line of the text file and\
    \ convert them to an integer type that our program can understand.\n\n# Loading\
    \ Data with Clojure\n\nReading a file in Clojure can be done in one command using\
    \ slurp and taking the file path as an argument. Slurping the file will consume\
    \ it all, so there's some modification to do. This is called transforming.\nCurrent\
    \ the file is one line of numbers and newlines.\n\n```\n2\\n5\\n3\\n4\\n...3\\\
    n9\\n8\\n8\n```\n\nThe split command in the clojure.string library will split\
    \ on a regular expression. This will produce a collection of strings. The last\
    \ thing to do is to map through each string and cast it to a double value. The\
    \ double parsing is using a Java function, as Clojure is a JVM language. We can\
    \ call Java with Java Interop.\n\n```\n(def load-file [filepath]\n  (map (fn [v]\
    \ (Double/parseDouble v))\n    (-> (slurp filepath)\n      (s/split \"#\\n\")))\n\
    ```"
