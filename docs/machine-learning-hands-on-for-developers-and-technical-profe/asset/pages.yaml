  md: "# Chapter 4 = Statistics, Linear Regression, and Randomness 77\n\nThese are\
    \ random throws. You might throw 10 times; you might throw 1 million throws. At\
    \ the end of the darts throws, you count the number of darts within the circle,\
    \ divide by the number of throws (10 million, 1 million, and so on), and multiply\
    \ it by 4.\n\nπ = 4 × (darts within the circle / total points)\n\nThe more throws\
    \ we do, the better chance we get of finding a number near Pi. This is the law\
    \ of large numbers at work. It's a classic computer science problem, and I'm going\
    \ to solve it by writing a program in Clojure to simulate the throws.\n\n# Using\
    \ Monte Pi in Clojure\n\nI'm going to create a function that simulates a single\
    \ dart throw. I want to break down my Clojure code into as many simple functions\
    \ as possible. This makes testing and bug finding far easier.\n\n```\ndefn throw-dart\
    \ []\n  {:x (calc-position 0)\n   :y (calc-position 0))\n```\n\nWhat I'm creating\
    \ is a map with an x,y coordinate with a 0,0 center point and passing the coordinate\
    \ for x and y through another function to calculate the position (calc-position).\n\
    \n```\n(def side-of-square 2\n(defn calc-position [v]\n  (* (/ (+ v side-of-square\
