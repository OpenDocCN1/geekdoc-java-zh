  md: '# The Elbow Method


    You can calculate the variance of the dataset as a percentage and plot against
    the number of clusters. There''s a point at which the clusters are at an optimum—that
    point after adding more clusters will not make a huge difference to the final
    classifications. You can see in Figure 6.4 how the elbow method shows the optimum
    number of clusters is four, which has classified 80 percent of the data.


    ![](img/896dd33398480a544ce5ff39ab4e6e43_132_0.png)


    Figure 6.4: The elbow method graph


    # The Cross-Validation Method


    By splitting the dataset into separate partitions, you can apply the analysis
    on the dataset and then on the remaining partitions. By averaging the results
    of the sum of squares, you can determine the number of clusters to use.

    Weka supports cross-validation with the weka.clusterers.MakeDensityBased-Clustering
    class. This class is covered in more detail in the command-line-based walk-through
    later the chapter.


    # The Silhouette Method


    Peter J. Roussee first described the silhouette method in 1986. It is a method
    for suggesting a way of validating where the objects lie within a cluster.

    For any object, you can calculate how similar an object is with another object
    within the same cluster. By calculating the averages of objects that connect to
    a cluster and then evaluating how dissimilar they are in relation to the other'
