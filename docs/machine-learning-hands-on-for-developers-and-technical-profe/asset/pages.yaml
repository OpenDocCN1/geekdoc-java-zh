  md: '# Locating Anything: find


    The find command is one of my favorites. It takes a little getting used to, but
    once you do, it will be a big help to you.


    The syntax starts with a source directory (using a period [.] if you want to start
    in the current directory) and various text options. For example, here''s what
    it looks like to run the find command on the home directory on your machine:


    ```

    $ find -type f -name ''*.txt'' -print

    ./gradle/caches/1.10/scripts/build3d16heej7li7errd096649rjns/

    ProjectScript/buildscript/classes/emptyScript.txt

    ./gradle/caches/1.8/scripts/build-43rj3keecul5gb80of3d9d4hso/

    ProjectScript/buildscript/classes/emptyScript.txt

    ./rv/config/displayed-notes.txt

    ./rv/ruby-1.9.2-p220/gems/arel-3.0.2/History.txt

    ./rv/ruby-1.9.2-p220/gems/arel-3.0.2/Manifest.txt

    ```


    With the -type flag, I am looking for files (f).name gives the types of file I''m
    looking for—in instance any file with the extension .txt. I print the results
    with the -print flag


    So far, there''s nothing that a few Unix commands couldn''t do. The great thing
    about find is that you can use Unix commands within the command itself. Imagine
    you looking for files with the phrase "SOFTWARE IS PROVIDED" in the text file.


    ```

    $ find -type f -name "*.txt" -exec grep "SOFTWARE IS PROVIDED" {} \ \

    -print

    THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND,

    ./rv/ruby-1.9.2-p220/gems/arel-3.0.2/MIT-LICENSE.txt

    THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND,

    ./rv/ruby-1.9.2-p220/gems/polyglot-0.3/License.txt

    THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND,

    ./rv/ruby-1.9.2-p220/gems/polyglot-0.3/README.txt

    THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND,

    EXPRESS OR

    ./rv/ruby-1.9.2-p220/gems/rack-test-0.6.1/MIT-LICENSE.txt

    THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND,

    EXPRESS OR

    ./rv/ruby-1.9.2-p220/gems/rack-test-0.6.2/MIT-LICENSE.txt

    THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND,

    ./rv/ruby-1.9.2-p220/gems/uglier-1.2.6/LICENSE.txt

    THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND,

    ./rv/ruby-1.9.2-p220/gems/uglier-1.3.0/LICENSE.txt

    ```


    This example uses the standard grep that is covered earlier in this appendix,
    but it replaces the filename with {}, which is a placeholder for the filename
    on which the find command is running.'
