    # The Streaming API


    The consumer application processes messages. On the surface it''s quite basic,
    and that''s where beauty lies with Kafka. If you need more power and features,
    then the streaming API is going to be a better bet.


    With a streaming application, you have access to both the producer and consumer
    APIs and lambda-like functions that enable you to map, filter, and reduce on messages
    passing through the application. If you require aggregation functions like sliding
    and fixed windows and tabling, then the streaming API is perfect to do it.


    The following code listing outlines the basics of the classic word count application.
    You''ll see the properties configured as the producer and consumer applications
    already covered in this chapter. Within the listing, the core of the application
    is in the createWordCountStream method.'
