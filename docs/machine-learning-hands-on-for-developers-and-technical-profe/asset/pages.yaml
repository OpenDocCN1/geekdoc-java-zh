    An American equivalent is Target, which runs a similar sort of program that tracks
    every customer engagement with the brand, including mailings, visits, and even
    in-store visits. From the data warehouse, Target can fine-tune how to get the
    right communication method to the right customers in order for them to react to
    it. Target learned that not every customer wants an e-mail or an SMS message;
    some prefer receiving mail via the postal service.


    The uses for machine learning in retail are obvious: Mining baskets and segmenting
    users are key processes for communicating the right message to the customer. On
    the other hand, it can be accurate and cause headaches. Target’s “baby club” story,
    which was widely cited in the press as a huge danger in Big Data, showed that
    machine learning can easily determine that we are creatures of habit, and when
    those habits change, they will get noticed.


    # TARGET''S PRIVACY ISSUE


    Target''s statistician, Andrew Pole, analyzed data to see whether he could determine
    when a customer was pregnant. A select number of products started to show up in
    the analysis, and Target developed a prediction score. Coupons were sent to customers
    who were predicted to be pregnant according to the newly mined score. That was
    all well until the father of a teenage girl contacted his local store to complain
    about the baby coupons that were being sent to his daughter. It turned out Target
    predicted the girl’s pregnancy before she told her father she was pregnant.


    For all the uses of machine learning, there are some urban myths, too. For example,
    you might have heard the “beer and diapers” story associated with Walmart and
    other large retailers. The idea is that the sales of beer and diapers both increase
    up on Fridays, suggesting that mothers were going out with dads would stock up
    on beer for themselves and diapers for the little ones they were looking for.
    It turned out to be myth, but this still stops marketing companies from weeding
    out the story (and believing it’s true) organizations who want to learn from their
    data.


    Another myth is that the heavy-metal band Iron Maiden used data to figure out
    which countries were illegally downloading their songs and then flew to those
    locations to play concerts. That story got the marketers and media very excited
    about Big Data and machine learning, but sadly it’s untrue. That’s not to say
    that these things can’t happen someday; they just haven’t happened yet.'
