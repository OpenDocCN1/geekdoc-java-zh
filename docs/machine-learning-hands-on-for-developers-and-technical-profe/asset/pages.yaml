  md: "```\npublic static void main(String[] args) throws Exception {\n    System.out.println(\"\
    Starting BasicSparkWordCount...\");\n    if (args.length < 1) {\n        System.err.println(\"\
    Usage: BasicSparkWordCount <file>\");\n        System.exit(1);\n    }\n\n    SparkSession\
    \ sparkSession = SparkSession\n        .builder()\n        .appName(\"BasicSparkWordCount\"\
    )\n        .create();\n\n    JavaRDD<String> lineText = sparkSession.read()\n\
    \        .textFile(args[0]).javaRDD();\n    JavaRDD<String> wordsInEachLine =\
    \ lineText\n        .flatMap(s -> Arrays.asList(s.split(\" \"))).iterator();\n\
    \    JavaPairRDD<String, Integer> allTheOn = wordsInEachLine\n        .mapToPair(word\
    \ -> new Tuple<>(word, 1));\n    JavaPairRDD<String, Integer> finalCounts = allTheOn\n\
    \        .reduceByKey((i1, i2) -> i1 + i2);\n\n    List<Tuple2<String, Integer>>\
    \ output = finalCounts.collect();\n    for (Tuple2<String, Integer> tuple : output)\
    \ {\n        System.out.println(\"Spark \" + tuple._1 + \" was found \" + tuple._2\
    \ + \" times.\");\n    }\n\n    sparkSession.stop();\n    System.out.println(\"\
    Finishing BasicSparkWordCount...\");\n```\n\nThe process flow of the application\
    \ works as follows. The SparkSession handles all the setup for the Spark application.\
    \ Any specific config settings and naming would happen at this point. The following\
    \ four lines are where the real work is happening.\nThe first stage is using the\
    \ sparkSession.read() function to load the data into RDDs. The strings from the\
    \ text file. The second stage is to split the words in each line by the space\
    \ character. The resulting transform is an array of words.\nNow we're at the third\
    \ stage, the mapToPair function generates a new RDD with the word as the key and\
    \ the number 1 as a value. The final RDD reduces each instance of the word/value\
    \ pairs in the allTheOn R.\nTo output results, the .collect function is used.\
    \ It applies the Spark job in the session and collects the reduced results from\
    \ the finalCounts RDD. The resulting list is iterated, and the results are displayed\
    \ to the standard output."
