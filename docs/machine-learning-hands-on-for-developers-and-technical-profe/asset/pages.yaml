  md: '# Thinking About Input Data


    With any machine learning project, you need to think about the incoming data,
    how format it''s in, and how it will be accessed by the code that''s being built.


    Data comes in all sorts of formats, so it''s a good idea to know what you''re
    dealing with you start crafting any code. The following sections describe some
    of the more common data formats.


    # Raw Text


    Basic raw text files are used in many publications. If you look at the likes of
    the Gutenberg Project, you''ll see that you can download works in a raw text file.
    The data is unstructured, so it rarely has a proper form with which you can work.


    Lorem ipsum dolor sit amet, consectetur adipiscing elit. Suspendisse metus erat
    tempor hendrer. Vestibulum turpis ante, bibendum vitae nisi, euismod blandit dui.
    Maecenas tincidunt consectetur est nec. Maecenas porttitor, arcu sed gravida,
    tellus lacinia eu, dapibus felis elit nisl. Nunc mollis volutpat ligula. Etiam
    interdum porttitor nulla non lobortis.


    Common formats for text files are Unicode, ASCII, or UTF-8. If there''s any international
    encoding required, UTF-8 and Unicode are most common. Note that PDF documents,
    Rich Format files, and Word documents are not raw text files. Microsoft Office
    documents (such as Word files) are particularly troublesome because of "smart
    quotes" and other extraneous characters that wreak havoc in Java programs.


    # Comma-Separated Variables


    The CSV format is widely used across the data landscape. The comma character is
    used between each field of data. You might find that other delimiters are used,
    such as tab (TSV) and the pipe (|) symbol (PSV). Delimiters are not limited to
    one character either. If you look at something like the USDA Database, you''ll
