    # Basic Classification with Neural Networks


    We''ve already covered how neural networks function in Chapter 9; the same multilayer
    perceptron can be applied to images. The work is in converting the image information
    into numerical form.


    The DeepLearning4 framework provides several file input classes to use, it''s
    possible to read in a directory of images and convert them to be ready for training.

    If you''ve spent any time looking in books or searching the Internet for machine
    learning examples when it comes to images, you may have seen the Modified National
    Institute of Standards and Technology database (MNIST database). It''s a large
    database of handwritten digits, and it''s widely used for training image processing
    systems. The original database has 60,000 images for training and 10,000 for testing
    and evaluation.

    To help further, they are sized as 28 × 28 pixels and are black and white using
    a grayscale palette.

    For the following example using a multilayer neural network, I''ll use this dataset.
    You don''t have to download the actual images yourself, within the DeepLearning4
    libraries are helper functions to do that for you.


    # Basic Settings


    The image size, we''ve established, is 28 × 28 pixels. There are 10 output classes
    0–9. Training will happen in batches of 64 images. The rate is the learning rate
    of the multilayer perceptron.


    ```

    int imageHeight = 28;

    int imageWidth = 28;

    int outputClasses = 10;

    int batchSize = 64;

    int randomSeed = 123;

    int epochs = 15;

    double rate = 0.0015;

    ```


    # Loading the MNIST Images


    We need to define two datasets, one for the training data and another for the
    test data to evaluate the model. The DeepLearning4 framework provides some'
