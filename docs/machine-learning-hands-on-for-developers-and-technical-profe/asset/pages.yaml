    # The R Basics


    To run through the R basics, I''m going to use the standard R development environment.
    The command-line prompt is a simple greater-than sign (>). You can perform calculations
    on the command line, so adding numbers is a trivial process, like:


    +   > 1+2

    [1] 3

    >


    To get proper use from R, though, you need to think a little more programmatically.


    # Variables and Vectors


    R supports variables as you would expect. To assign them, you can use either the
    equal sign (=) or the less-than sign and a hyphen together (<-):


    +   > myage = 21

    > myageagainain <- 21'
