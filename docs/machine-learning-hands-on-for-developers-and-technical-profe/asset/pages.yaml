  md: "# Spark Program Summary\n\nWith our Spark application created, let's expand\
    \ on this knowledge and look at some of the other APIs that Spark provides: SparkSQL,\
    \ Spark Streaming, and MLLib.\n\nYou can build all the applications in the same\
    \ way. By refactoring the pom xml file, you can quickly expand the Spark libraries\
    \ for your applications.\n\n# Spark SQL\n\nThe Big data world has moved on a lot\
    \ since its Hadoop heyday. Sadly, no one really talks about Pig scripts anymore.\
    \ The introduction of SparkSQL gave us a system to run high-performance queries\
    \ against large datasets.\n\nSince the first edition of this book, the Spark SQL\
    \ system went through an overhaul that introduced data frames and a more robust\
    \ way of handling queries. In this section, you will see how to build a Java Spark\
    \ application to load CSV data and run queries against it.\n\n# Basic Concepts\n\
    \nAs you will remember from the previous Spark application example, SparkSession\
    \ creates the Spark environment that will run your application in the cluster.\
    \ The SparkSQL libraries work in the same way.\n\nTo illustrate the different\
    \ layers of the SparkSQL functionality, I'm going to start with a basic Spark\
    \ job and add the SQL methods to do different things from the API.\n\n```\npackage\
    \ mlbook.ch13.spark;\n\nimport org.apache.spark.sql.AnalysisException;\nimport\
    \ org.apache.spark.sql.Dataset;\nimport org.apache.spark.sql.Row;\nimport org.apache.spark.sql.SparkSession;\n\
    \npublic class BasicSparkSQL {\n    private static String airportDataPath =\n\
    \        \"/path/to/data/ch13/airports.csv\";\n\n    public static void main(String[]\
    \ args) throws AnalysisException {\n        SparkSession spark = SparkSession\n\
    \            .builder()\n            .appName(\"ML Book Spark SQL Example\")\n\
    \            .getOrCreate();\n        // we'll add more here soon!\n        spark.stop();\n\
    \    }\n}\n```"
