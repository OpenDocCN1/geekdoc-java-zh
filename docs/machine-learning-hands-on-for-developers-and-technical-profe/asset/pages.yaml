    # Summary


    Kafka provides us with a solid system to produce and consume messages in real
    time. By combining it with other technologies from your acquired machine learning
    knowledge you can build a system that uses streaming data to create a set of models
    to make predictions, over time improving on the accuracy of the models as new
    data is added.


