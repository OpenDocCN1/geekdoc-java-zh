  md: '# Machine Learning with R


    When you’re in a room of data scientists, statisticians, and math types, you’ll
    hear one letter crop up again and again: the letter R is a programming language,
    and it’s basically command-line driven. In addition to being used in the command-line
    shell, R can be written in code form and run.


    Why am I telling you all this? Well, on top of the programming skills that get
    mentioned, you might also be asked, “Do you do R?” After this chapter, you’ll
    hopefully have a starting point to reply, “Yes!”


    # Installing


    The R language comes ready to use for a number of operating systems. The download
    page at http://www.r-project.org has a number of mirror sites, pick a mirror that’s
    closest to you. From the mirror, choose the download for your operating system.


    # macos


    The current version of R (3.6 at time of writing) will run on the 64-bit Intel-based
    Macs. Download the file and open it to install it. It installs the R binaries
    into /Applications folder.'
