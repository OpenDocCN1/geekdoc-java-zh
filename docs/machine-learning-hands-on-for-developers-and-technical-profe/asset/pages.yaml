  md: '# CHAPTER 10

    Machine Learning with Text Documents


    The word document sounds too formal when you take a moment to consider the amount
    of text that is stored. That may take the form of a word-processed document, a
    blog post, an email, a news article, or an academic paper. When you pause to consider
    the amount of text data held on the Internet and the Web, well, it''s a lot, making
    sense of it is going to take some doing.


    Text analysis, and the machine learning from it, is not the easiest thing in the
    world to do. Documents are messy, there''s a fair amount of cleaning to do, and
    they come in all sorts of formats, which usually presents challenges to too.


    For this chapter I will describe various methods of finding information from text
    documents but will also cover the steps of getting data ready for analysis. From
    there I will show you methods to learning from your text: TF-IDF, Word2Vec, and
    using neural networks to generate new text.


    As a further study of text analysis, it''s worth looking into the more advanced
    techniques using Long Short Term Memory (LSTM) for improved results especially
    in context awareness. Google has designed a neural network architecture Bidirectional
    Encoder Representations from Transformers (BERT); a basic overview is available
    here:


    ```

    https://colab.research.google.com/github/google-research/bert/master/predicting_movie_reviews_with_bert_on_tf_hub.ipynb#scroll=to=hszvic2YxnNtz

