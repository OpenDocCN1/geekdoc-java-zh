  md: '# Running the Project


    This is a big project with a lot of services that are running. Here’s a quick
    run-down of how to get it running. I’m assuming you are in the root directory
    of the project.


    # Run MySQL


    Assuming MySQL is already running, create the tables.


    ```

    $ mysql -u root -p<your admin password> create mlchapter12

    $ mysql -u root -p<your admin password> mlchapter12 < schema.sql

    ```


    # Run Zookeeper


    Open a new terminal window and run the following command as the root user:


    ```

    $ /path/to/kafka/bin/zookeeper-server-start.sh /path/to/kafka/config/

    zookeeper.properties

    ```


    # Run Kafka


    Open a new terminal window and run the following command as the root user:


    ```

    $ /path/to/kafka/bin/kafka-server-start.sh /path/to/kafka/config/server.

    properties

    ```


    # Create the Topics


    Create the topics (in the scripts directory).


    ```

    $ /path/to/project/scripts/create-topics.sh

    ```


    # Run Kafka Connect


    As the root user change the directory names to reflect your directory names.


    ```

    $ /path/to/kafka/bin/connect-standalone.sh /path/to/kafka/config/

    connect-standalone.properties

    /path/to/project/config/d14j_event_to_sink.properties /path/to/

    project/config/d14j_to_fs_sink.properties

    ```'
