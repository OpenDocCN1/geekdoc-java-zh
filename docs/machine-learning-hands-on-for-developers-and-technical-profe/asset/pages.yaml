  md: '# APPENDIX D


    # Further Reading


    Machine learning is only part of the story; it''s the application of knowing what
    to use to get the insight you need. The domain of data science combines several
    disciplines that cover programming, math, domain knowledge, and visualization.
    It''s rare for one book to cover it all. To that end, I''ve included some further
    reading that will be big, in-depth affairs that can take you on your machine learning
    and data journey. (I know what you''re thinking, and yes, I have bought and read
    all of these books.)


    # Machine Learning


    The machine learning arena is a huge domain and the majority of the books written
    are big, in-depth, heavy affairs that can take time to read, digest, and appreciate.
    Two stand out:


    +   * Data Mining – Practical Machine Learning Tools and Techniques by Ian H.
    Witten, Eibe Frank, and Mark A. Hall (Morgan Kaufmann, 2011, ISBN 9780123748560)


    +   * Collective Intelligence in Action by Satnam Alag (Manning, 2008, ISBN 9781939388313)'
  merge: -1
  pgno: 404
- img_proc: true
  md: '# Appendix D Further Reading


    # Statistics


    More and emphasis is being put on statistical knowledge and its application. Sometimes
    it feels hard to get into, especially for software developers, so these titles
    will help you along:


    +   The Art of Statistics by David Spielhalter (Pelican Books, 2019, ISBN 9780241398630)

    - Naked Statistics: Stripping the Dread from the Data by Charles Whelan (Norton,
    2013, ISBN 97808039307155)

    - Keeping Up with the Quants: Your Guide to Understanding and Using Analytics
    by Thomas H. Davenport and Jinho Kim (Harvard Business Review Press, 2013, ISBN
    9781422182758)


    # Big Data and Data Science


    Regardless of whether you are a supporter of the term Big Data, there''s no denying
    the impact that data has on industry. In Big Data, planning is key, and it''s
    important to have a proper understanding of the implications of planning and insight.


    +   Data Just Right: Introduction to Large-Scale Data & Analytics by Michael Manochechri
    (Addison-Wesley, 2014, ISBN 9780321898654)


    +   Big Data: Understanding How Data Powers Big Data by Bill Schmarzo (Wiley,
    2013, ISBN 9781118379570)


    +   Big Data @ Work: Dispelling the Myths, Uncovering the Opportunities by Thomas
    H. Davenport (Harvard Business Review Press, 2014, 9781422168165)


    +   Big Data: A Revolution That Will Transform How We Live, Work, and Think by
    Viktor Mayer-Schonberger and Kenneth Cukier (Eamon Dolan/Houghton Harriet, 2013,
    ISBN 9780544002692)


    +   Data Smart: Using Data Science to Transform Information into Insight by John
    W. Foreman (Wiley, 2013, ISBN 9781118661468)


    +   Data Science for Business: What You Need To Know About Data Mining and Data
    Analytic Thinking by Foster Provost and Tom Fawcett (O''Reilly Media, 2013, ISBN
    9781449361327)'
  merge: -1
  pgno: 405
- img_proc: true
  md: '# Visualization


    My book concentrates on the pure back-end processing of data with machine learning
    techniques, but do not discount the power of visualization to communicate your
    results. These books will help:


    +   - Visualize This: The Flowing Data Guide to Design, Visualization, and Statistics
    by Nathan Yau (Wiley, 2011, ISBN 9780470944882)


    +   - Information Is Beautiful by David McCandless (Harper Collins, 2012, ISBN
    9780007492893)


    +   - Acts Are Sacred by Simon Rogers (Faber & Faber, 2013, ISBN 97805771301614)


    # Making Decisions


    The key to machine learning projects is making good decisions. With insight in
    hand, you can form next steps. The books listed here aren''t software oriented
    at all, but they will give you vast pools of thinking about how to process and
    make decisions with the information you have.


    *Thinking in Bets by Annie Duke (Portfolio/Penguin, 2018, ISBN 9780735216358*


    *How to Develop Your Thinking Ability by Kenneth S. Keyes


    > A brilliant book, now out of print but can be found by various sellers on the
    Internet. If it''s good enough for Marilyn Noore, it''s good enough for me.


    *Eyes Wide Open by Noreena Hertz (HarperCollins, 2013, ISBN 9780062268617*


    *The Signal and the Noise: Why So Many Predictions Fail—but Some Don''t by Nate
    Silver (Penguin Books, 2012, ISBN 9781594204111*


    *Lean Analytics: Use Data to Build a Better Startup by Alistair Roll and Benjamin
    Yoskovitz (O''Reilly Media, 2013, ISBN 9781449335670*


    *Obviously Awesome by April Dunford (Ambient Press, 2019, ISBN 9781999023003*


    Not strictly a decision-making book, but if you are a starting anything, then
    this is the book you need.'
  merge: -1
  pgno: 406
- img_proc: true
  md: '# Datasets


    Sometimes it''s hard to find data to play with. Luckily, there are a few websites
    with loads of the stuff to download.


    +   - UCI Machine Learning Repository: http://archive.ics.uci.edu/ml/


    The UCI maintains 290 datasets covering many different domains. What''s the most
    popular downloaded dataset? It''s still there.


    +   - Quora: http://www.quora.com/Where-can-I-find-large-datasets-open-to-the-public


    Here you''ll find a long list of URLs covering all sorts of topics that you can
    investigate (This site requires you to sign in.)


    +   - Kaggle: https://www.kaggle.com


    There are plenty of datasets, advice, tutorials, and competitions to pour through
    here.


    # Blogs


    And they said RSS feeds were dead.. I don''t think so! There are a few blogs that
    I keep an eye on regularly, and these are the ones that relate to what is covered
    in this book:


    +   - FiveThirtyEight: http://www.fivirtyeight.com


    Nate Silver and a team of contributors build this daily digest of stories with
    data, covering everything from politics to which is the best bur-rito in the United
    States.


    +   - Radar: http://radar.oreilly.com


    This site for emerging technologies is worth checking out for the daily “Four
    Short Links,” which pinpoints some interesting programs, stories, and case studies
    from around the Internet.


    +   - MathBaby: http://mathbaby.org


    Cathy O''Neill''s blog discusses data, quantitative issues, and other subjects
    within Neill''s analytics arena.'
  merge: -1
  pgno: 407
- img_proc: true
  md: '# Useful Websites


    Although Google does a good job of showing where to find the best sites, I still
    refer to the following sites when I''m looking for specifics:


    +   - Wiley: www.wiley.com


    This is the main website for all Wiley books and also the place to go for the
    sample code examples for this book.


    +   - Stack Overflow: www.stackoverflow.com


    A community of developers helping a community of developers, what''s not to like?
    This site is definitely worth a quick look for answers on coding, servers, and
    machine learning.


    # The Tools of the Trade


    Here are the links to the tools that are used in this book. It''s worth having
    them bookmarked for updates and announcements.


    +   - Apache Spark: http://spark.apache.org


    +   - Weka: httpwww.cs.waikato.ac.nz/ml/weka


    +   - Kafka: http://kafka.apache.org


    +   - DeepLearning4J: https://deeplearning4j.org'
