  md: '# Writing a Function to Score Sentiment


    You have a function that takes a sentence and two word lists (positive and negative
    sentiment words). Now you can test it.


    ```

    GetScore<-function(sentence, pos.words, neg.words) {

    sentence = gsub(''[[:punct:]]'', '''', sentence)

    sentence = gsub(''[[:cntrl:]]'', '''', sentence)

    sentence = gsub(''[\d-]'', '''', sentence)


    tolower(sentence)


    word.list = str_split(sentence, ''\\s+'')

    words = unlist(word.list)


    pos.matches = match(words, pos.words)

    neg.matches = match(words, neg.words)


    score = sum(pos.matches) - sum(neg.matches)


    return(score)

    }

    ```


    The first thing that happens is the sentence is cleaned up with punctuation, control
    characters, and numbers removed. That should give you just a sentence of words;
    you then convert it into lowercase letters.


    You split the sentence into a list of words and find out how many times the words
    match in the positive word list. You also do the same with the negative word list.


    With a positive score and negative score, you take the negative away from the
    positive to get the final score.


    You can save the functions as an R source file. You can either create it in a
    text editor or use the R-Studio editor to create the source file. For this example,
    I save it all in a file called sentiment.r.


    # Testing the Function


    To test the sentiment code, you first need to load the code and the required library
    into R.


    ```

    install.packages("stringr")

    library(stringr)

    source(''sentiment.r'')

    ```'
