  md: '# # CHAPTER 9

    # Artificial Neural Networks


    There’s something about gathering knowledge about the human brain that makes people
    tick. Many people think that if we can mimic how the brain works, we’ll be able
    to make better decisions.


    In this chapter, you look at how artificial neural networks work and how they
    are applied in the machine learning arena. If you are looking for how convolutional
    neural networks function, that will be covered in Chapter 11 when we look at image
    processing.


    # ## What Is a Neural Network?


    Artificial neural networks are essentially modeled on the parallel architecture
    of animal brains, not necessarily human ones. The network is based on a simple
    form of inputs and outputs.


    > > **a computing system made up of a number of simple, highly interconnected
    processing elements, which process information by their dynamic state response
    to external inputs.**


    *Dr. Robert Hecht-Nielson as

