  md: '# Breaking Down the Artificial Neural Network


    Before you jump into data and a few examples, I will cover the rationale and working
    of the neural network.


    # Perceptrons


    The basis for a neural network is the *perceptron*. Its role is quite simple.
    It receives an input signal and then passes the value through some form of function.
    It outputs the result of the function. (See Figure 9.2).


    ![](img/896dd33398480a544ce5ff39ab4e6e43_192_0.png)


    **Figure 9.2:** a simple perceptron


    Perceptrons deal with numbers when a number or vector of numbers are passed to
    the input. It is then passed to a function that calculates the outgoing value;
    this is called the *activation function*. The node can handle any number of inputs—Figure
    9.3 shows two inputs passing into the function—and it takes the weighted sum of
    all the inputs.


    Assuming the input is a vector Z, you''d end up with something like this:


    ```

    Z1 = 2

    2 = 5

    3 = 1

    ```


    Or (2,5,1)


    The weighted sum of all the inputs is calculated as follows:


    ```

    \sum wiZi

    ```


    In other words, "add it all up." For the likes of me, who is not used to too much
    math notation, it looks like the following:


    ```

    2w1 + 5w2 + 1w3

    ```


    The outgoing part of the node has a set threshold. If the summed value is over
    the threshold, then the output, denoted by the $y$ variable, is 1, and if it''s
    below the threshold, then $y$ is 0 (zero).'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'You end up with the following equation:


    ```

    $if \sum w_i z_i \geq 1 \text{ then } y=1$

    else $y=0$

    ```


    ![](img/896dd33398480a544ce5ff39ab4e6e43_193_0.png)


    **Figure 9.3:** Perceptron with two inputs


    The weight of the perceptron can be zero or any other value. If the weight value
    is zero, it does not alter the input node value coming into the perceptron. Likewise,
    inputs can be positive or negative numbers. The key to the output is based on
    the weighted sum against the threshold.


    That''s the basis of a single-node perceptron. When you strip the components apart,
    it''s quite basic in composition.


    # Activation Functions


    The activation function is the processing that happens after the input is passed
    into the neuron. The result of this function determines whether the value is passed
    to the output axon and onto the next neuron in the network.


    Commonly, the Sigmoid function (see Figure 9-4) and the hyperbolic tangent are
    used as activation functions to calculate the output.


    The Sigmoid function outputs only one of two values: 0 and 1. For the grammers,
    the function is written as follows:


    ```

    return 1.0 / (1.0 + Math.exp(-x));

    ```


    The sharpness of the curve could also be altered if required, but for most applications
    a straight function is fine.'
