    \ comes from the APIs that are available. This means it's possible to build data\
    \ applications in Java, Python, Scala, or any other supported language. For the\
    \ duration of this chapter, I will keep with Java. If you are a Clojure developer,\
    \ then it's worth investigating the Sparkling Spark wrappers for Clojure (http://gorillalabs.github.io/sparkling/).\n\
    \n# Spark Programs in Java\n\nEarlier in the chapter I showed you how to perform\
    \ a basic word count on the Mobi Duck text. For this example, I'll cover the basics\
    \ of writing an application in Java to do the same in Spark. The workflow is broken\
    \ down into three parts.\n\n+   * The code\n* The Maven build file (pom.xml)\n\
    * Deployment to Spark to run the basic word count\n\nThe following Java code is\
    \ the basic word count application:\n\n```\npackage mlbook.ch3.spark;\n\nimport\
    \ org.apache.spark.api.java.JavaRDD\nimport org.apache.spark.sql.SparkSession\n\
    import scala.Tuple2;\nimport org.apache.spark.api.java.JavaPairRDD;\nimport java.util.List;\n\
    import java.util.regex.Pattern;\n\npublic final class BasicSparkWordCount {\n\
    \    private static final Pattern SPACE = Pattern.compile(\" \"); {\n```"
