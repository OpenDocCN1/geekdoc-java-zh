  md: '# Medical Monitoring


    Medical machinery can be monitored via artificial neural networks, which involves
    the constant updating of many variables, such as heart rate, blood pressure, and
    so on. Conditions that have multiple variations and trigger symptoms can be calculated
    and monitored, and staff can be alerted when the variables go over certain thresholds.


    There have been huge advantages in medical imaging and using deep learning techniques
    such as convolutional neural networks to predict disease areas and support decision-making
    for the consultants and doctors.


    # Trusting the Black Box


    There have been large-scale adoption of neural networks since the first edition
    of this book. The volumes of data have increased, meaning that there is enough
    data to support accurate predictions, it''s difficult to explain how these black-box
    algorithms are working.


    The rule of thumb is: if you are unsure of the relationship between input and
    output of your model, then investigating with a neural network is a good way to
    go. If you have a good understanding of the input/output relationship, then chances
    are other traditional methods would be used.


    I''ve always encouraged students, software professionals, and management to explore
    all the algorithmic options before settling on a neural network, especially if
    your findings will eventually end up scrutinized by another professional or the
    public at large.


    Over time has been much coverage on incorrect predictions made by many strands
    of artificial intelligence. The term explainable AI has taken the forefront of
    the discussion when it comes to creating algorithms that are going to predict
    behold of others.


    Furthermore, it is important you have sufficient volumes of training data for
    training neural networks. Small volumes of training will produce low accuracy
    scores, and there are times other machine learning algorithms, even linear regression,
    perform better than a neural network.


    It''s also important to look at the quality of the data training. Does it cover
    the spectrum of the question you are trying to answer? Biased data will give you
    incorrect predictions, and you will have no way of explaining why.


    Ultimately, before you invest time, data, and money into a neural network, it''s
    worth asking yourself if this is the best way to do this task.'
