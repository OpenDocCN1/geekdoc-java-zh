  md: "# Chapter 10 ■ Machine Learning with Text Documents 207\n\nHaving n-gram sequences\
    \ of words can be used against algorithms such as Term Frequency/Inverse Document\
    \ Frequency, which will be covered later in this chapter. Each sequence in the\
    \ n-gram can then be used as a term. Some-times will give more meaningful single\
