  md: "# Properties\n\nAny Java application that communicates with a Kafka cluster\
    \ is set up via the Java classes. The key-pair values are required by the Kafka\
    \ API to send default settings and flags to the brokers.\n\n```\nprops = new Properties();\n\
    props.put(\"bootstrap.servers\", \"localhost:9092\");\nprops.put(\"acks\", \"\
    all\");\nprops.put(\"retries\", 0);\nprops.put(\"key.serializer\",\n  \"org.apache.kafka.common.serialization.StringSerializer\"\
    );\nprops.put(\"value.serializer\",\n  \"org.apache.kafka.common.serialization.StringSerializer\"\
    );\n```\n\nLooking at this properties setup, we can see some settings that are\
    \ familiar from previous examples in the chapter but also some new ones.\n\n#\
    \ Bootstrap Servers\n\nThe bootstrap.servers key is telling the application where\
    \ the brokers are. In the stand-alone development cluster, this is only one node\
    \ and one bootstrap server. It acts as a starting point for the application to\
    \ discover the other brokers in the cluster. If you have more than one broker,\
    \ you can use comma-separated values in the value.\n\n```\nprops.put(\"bootstrap.servers\"\
    , \"server1.localhost:9092, server2.localhost:9093\");\n```\n\n# Acks\n\nNext\
    \ is the acks, which is short for acknowledgments. When a producer sends a message\
    \ to the broker, it can receive an ack to say that the broker has received the\
    \ message. While this is good from an application safety point of view, it's worth\
    \ keeping in mind there is a small amount of latency introduced. Three settings\
    \ are available for the acks key. Table 12.2 explains the settings.\n\nTable 12.2:\
    \ Kafka Producer Acks\n\n| ACKS SETTING | MEANING |\n|---|---|\n|acks=0 | The\
    \ producer does not receive any confirmation that the broker has received the\
    \ message. This is basically a fire-and-forget setting, and there is no guarantee\
    \ the message has reached the broker. |\n|acks=1 | The producer will receive an\
    \ acknowledgment from the lead broker (the leader), but it will have been received\
    \ without the confirmation that all the brokers follow that leader have received\
    \ the message. | |\n|acks=all or acks=-1 | The producer will receive an acknowledgment\
    \ once the leader has received confirmation that the message is with the in-sync\
    \ replicas. |"
