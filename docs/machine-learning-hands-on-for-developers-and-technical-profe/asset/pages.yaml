    # Spreadsheets


    Talk to any finance person in your organization, and you''ll discover that their
    entire world revolves around spreadsheets. Programmers have a tendency to shun
    spreadsheets in favor of formats that make their lives easier. You can''t ignore
    them, though. Spreadsheets are the lifeblood of an organization, and they probably
    hold most of the organization''s data.


    There are lots of different programs, the most commonly used applications are
    Microsoft Excel, Google Docs Spreadsheet, and LibreOffice.

    Fortunately, there are programming APIs that you can use to extract the data from
    spreadsheets directly, which saves a lot of work in converting the spreadsheet
    to the list of CSV files. It''s worth studying the formulas in the spreadsheets,
    because there might be some algorithms lurking there that are worth their weight
    in gold.


    If you want finance person to be supportive of the project, tell that person that
    the results will be in a spreadsheet and you''ll have a friend for a long time
    after.'
  merge: -1
