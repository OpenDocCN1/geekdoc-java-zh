    # Planning the System


    To start, it''s worth writing down what''s required to acquire the data, train
    the models, and deal with predictions. Also consider such things as where you
    persist the data and the models. Will they be on the file system? Or are you going
    to persist them on a storage service like Amazon S3 or on Azure''s storage facility?


    So, here''s a quick list of questions to consider during the planning stage:


    +   - What topics do we require?

    - Where is the data coming from?

    - What format is the data in?

    - What algorithms are we going to use?

    - How will the training be triggered?

    - Where will the models be saved?

    - How do we determine which models to use for predictions?

    - How do we perform a prediction?


