  md: '# Chapter 12 Machine Learning Streaming with Kafka 265


    The command event is basically an instruction to trigger a machine learning model.
    They''re not built all at the same time as that would start to drag down the system
    and degrade performance. The idea is that we can trigger any build type at any
    time. So, for example, build_mlp will trigger the build for our neural multilayer
    perceptron.


    ```

    {"type":"training", "payload":"3,4,5,6"}

    ```


    The training data predicts consists of the CSV values in the payload.


    # Predictions


    To make a prediction via Kafka, the process is to send a JSON message to the prediction
    request topic. The payload contains the three values from the scores, and the
    model returns the predicted value.


    ```

    {"model":"mlp", "payload":"3,4,5"}

    ```


    The responses from the model are not returned in a traditional programming sense
    but there be some form of mechanism to trigger the training commands. Once the
    Kafka event is sent as a message to the prediction response topic. It''s up to
    the developer to create a consumer application to read the response from Kafka.


    # Continuous Training


    There are numerous options for how to update our trained models. As data passes
    through the training topic and is persisted to disk through the connector, there
    needs to be some form of mechanism to trigger the training commands.


    One approach is to send an event to the event topic itself. Once the Kafka streaming
    job parses the message, it will send a request to the API to start the required
    model build.


    The alternative to sending a payload message is to use a scheduled cron job on
    the server. This does have one downside; it means that there''s a command action
    that isn''t registered in the event stream.


    # How to Install the Crontab Entries


    If you want to install the cron entries, then you must do this via the crontab
    command. Open a terminal window and type the following:


    ```

    crontab -e

    ```


    Depending on the editor you have set as the default (it could be vi or nano, for
    example), the current crontab will be displayed.'
