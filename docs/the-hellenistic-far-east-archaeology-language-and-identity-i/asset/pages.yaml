  md: 'AI KHANOUM 91


    Both Chinese and Greek sources,120 as well as by archaeological finds, began the
    series of migrations and military conquests that would establish groups such as
    the Yuezhi in the region, among them the ancestors of the later Kushan rulers
    of Bactria.121 Bacteria were also involved in a conflict with Parthia, although
    this naturally affected the west of the kingdom more than the east.122 And finally,
    the reign of Eukrates came to an end with internal struggles and political fragmentation.
    All these factors led to the collapse of the Graeco-Bactrian kingdom, and although
    they provide a general political and military context, it is difficult to find
    specific evidence for the role played by any of them in the fall of Ai Khanoum.
    Above all, the end of the Graeco-Bactrian period of Ai Khanoum was not a simple
    matter of invasion of supposed barbarian hordes from the north. The main assault
    suffered by the wall of the city at this period included the use of siege equipment,
    difficult to reconcile with the notion of attack by nomadic warriors.123 In a
    wider sense, the traditionally proposed nomadic conquest of Bactria was not a
    matter of complete destruction. Some continuity was maintained, given that the
    Kushan rulers of Bactria later developed a literacy using Greek script. So, as
    discussed in the conclusion to chapter 1, some kind of administrative continuity
    was maintained across conquest and regime change.


    The destruction and abandonment of the Graeco-Bactrian city at Ai Khanoum itself
    was in no case complete and decisive. There was a period of reoccupation of the
    city (the “occupation post-greek” or “occupation tardive”) in which many of the
    city’s institutions were adapted to different uses and their contents moved around
    or disturbed. Although this period is most often interpreted as a takeover of
    the site by new populations, to the area but not non-Greek, there is no reason
    why these reoccupants of the site should not have had some relationship to the
    city and its immediate hinterland, or why they may not have numbered among them
    survivors of the fall. The urban landscape was being used in different ways, and
    the city’s essential social and political infrastructure had clearly been completely
    destroyed, but this may reflect precisely the collapse of such order, not the
    reality of absolutely new populations. The real death of the city is actually
    marked by a citywide fire that put an end to the fairly brief period of the immediately
    post-Greek occupation.124


