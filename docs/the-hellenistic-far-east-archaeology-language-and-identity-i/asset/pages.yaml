    Another point that the communities of the Hellenistic Far East have in common
    with their Greek neighbors to the west is that the supposedly rigid Greek-barbarian
    divide is in practice permeable—in contrast to what might be protested in public
    display and rhetoric. Just as in the south individuals such as Sôphytos and Heliosodor
