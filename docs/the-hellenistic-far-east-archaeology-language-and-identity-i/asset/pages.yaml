  md: 'a local dynast. I propose in addition, however, that the original Hellenistic
    palace at Ai Khanum either was built directly on the site of an Achaemenid predecessor
    or least drew on local Achaemenid architectural and administrative models.


    If one includes the adjacent mausolea, gymnasium, and pool enclosure, the Ai Khanum
    structure fulfills functions of other Hellenistic palaces.74 Comparison with other
    palaces, furthermore, offers precedents for the co-occurrence of these features
    at Ai Khanum and explanations of the political significance that their design
    to this complex may have. It is significant that the palaces of the Hellenistic
    world often incorporated palaces of recreation and education—and culture-specific
    Greek forms of recreation and education, as in gymnasium and palaestrae. If we
    identify the pool enclosure that lies between the main palace and the gymnasium
    as a garden, then that could be paralleled by the large parks surrounding Hellenistic
    palaces, or the courtyard-gardens that may have contained within them, for which
    the paradise of Achaemenid palaces offered models.75


    One of the Greek words used for such a garden is also,a term that occurs in an
    unproven Greek inscription supposedly from Kulab, in what is now southern Tajikistan.77
    A man named Heliodotos dedicates an altar to Hestia, for the sake of the kings
    Euthydemos and Demetrius, the asos of Zeus. Without further information on its
    provenance, it is impossible to know what kind of archaeological context this
    inscription, or may have come from Ai Khanum—which is impossible—or whether its
    description accurately represents the sites and practices that it claims to. What
    is significant for the purposes of the present discussion is, already in the late
    third or early second century B.C.E., decades before the final architectural program
    at Ai Khanum, we find a garden dedicated to a Greek deity being used as a place
    for an individual''s demonstration of political loyalty. A garden space such as
    the one in the central complex at Ai Khanum could be used as a theater for all
    sorts of religious and political acts and performances.


