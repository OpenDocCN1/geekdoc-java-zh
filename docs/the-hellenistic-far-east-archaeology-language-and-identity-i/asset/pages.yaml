  md: 'These are quite considerable sums of money, suggesting, along with the regularity
    with which the figures of five hundred drachmas and ten thousand Indian coins
    recur (the exclusion of any other amounts), these are transactions of an official
    nature, not personal payments (for example) of taxes or for purchases. Whatever
    the ultimate sources of these sums—and the Indian coinage may suggest tribute
    or taxes exerted from Indian lands conquered by the Greco-Bactrian kings—what
    is happening at the treasury is evidently that revenue is being consolidated and
    recorded, according to fixed divisions. I propose that the regular figures chosen—as
    well as being, round counting units—have much to do with the practicalities of
    storage and transportation.82 What seems less likely—although the possibility
    must be considered—that these coins counted and verified (see below) in the treasury
    were the products of a local mint. Although blank bronze flans attest to the presence
    of a mint at Ai Khanoum, there is no firm evidence that silver coinage (such as
    drachmas) was struck there.83


    The texts already discussed relate the transaction and supervision of various
    payments in commodities and by a series of individuals. These are the most common
    formulae among the treasury texts, although there are a couple of exceptions.
    One, which is written in a more cursive script than the others, may be a lengthy
    financial account written on an ostrakon rather than a record of the same type
