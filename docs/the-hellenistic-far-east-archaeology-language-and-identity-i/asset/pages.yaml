    self-other, civilized-barbarian polarity is a matter of rhetoric as much as socioeconomic
    and political reality, as I will discuss in following sections.


    Chinese historical sources are principally concerned with the movements of two
    major confederacies—the Xionggnu and the Yuehi—in the mid-century b.C.E., inasmuch
    as these are immediate threats to the security of the Chinese empire. There have
    been a number of recent studies studies on the archaeology of the Xionggnu confederacy
    and the Xiongnu-Chinese frontier regions, and the problem of viewing the material
    culture of the Xiongnu through an historical lens—or simply identifying a Xiongnu
    archaeological culture—is as acute as it is for the Greek sources and for the
    archaeology of Bactria and neighboring regions. Sima Qian Shiji (Records of the
    Grand Historian) draws extensively on Zhang Qian, who undertook a diplomatic mission
