- pgno: 24
  md: '# 6 INTRODUCTION


    In the following chapters, I examine a range of sources and suggest that we can
    do a lot more than simply “make the best of” what we have. A combination of documentary
    texts written on leather and ceramics, stone inscriptions, coins, and a wealth
    of archaeological data, from both excavation and field survey, provide arguably
    more valuable than a connected narrative, political history: an insight into the
    lives, culture, and identities of the inhabitants of the Hellenistic Far East.
    That we can gain such an insight is thanks to a number of important recent discoveries
    of inscriptions and documentary texts, as well as ongoing archaeological projects
    in Afghanistan and Central Asia. Nevertheless, the foundation of our chronological
    framework for the Hellenistic Far East remains numismatic. Here, too, innovative
    scholarship of the past couple of decades has allowed us to pinpoint the reigns
    of kings and the territorial extent of their kingdoms more accurately, and has
    explored the political and cultural messages contained in the images and inscriptions
    on Greco-Bactrian and Indo-Greek coins.¹⁰


    The most important step that we can take towards a better understanding of the
    material from the Hellenistic Far East is, in my view, to restore to it something
    of its context. This mean in a general sense—as part of a wider Hellenistic world,
    a topic to which I shall return in my conclusion to this volume—and in terms of
    diachronic approach, an approach I will adopt most notably in chapter 1, on the
    administrative continuity from the Achaemenids to the Greeks in Bactria, and in
    chapter 4, on the end of Greek rule in Bactria in the mid-second century B.C.E.


    It is also important to recognize the apparent current contradictions in the archaeological
    and epigraphic evidence, in particular, and to find nuanced ways of approaching
    these a simple statement that a particular individual or structure is “Greek”
    or otherwise. Ai Khanoum, the “Greek city in Central Asia,”¹¹ complements its
    “Greek” gymnasium, theater, and founder’s shrine with other institutions and architectural
    elements that are overly “non-Greek.” This stylistic dissonance is striking to
    modern archaeologists who have made some kind of culture to contemporary local
    populations is allows us to find a reasonable model for the social dynamics of
    such a society.¹² The Greek epigraphic record of the Hellenistic Far East introduces
    a range of figures and concepts that would be unlikely to encounter in more Hellenistic
    inscriptions: Buddhist ethical terminology,¹³


