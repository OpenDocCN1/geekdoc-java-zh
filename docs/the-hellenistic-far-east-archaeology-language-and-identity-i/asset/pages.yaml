    Greek inscription, however open-minded we should remain about the individual''s
    ethnic identity and status, is a remarkable occurrence, that allows us an insight
    into the process of ethnic and linguistic change and variation in Hellenistic
    Arachosia which we might otherwise remain ignorant. That evolved alongside a more
    formal system of ethnic categorization may perhaps be deduced from the epigram
    of 303 B.C.E., if its terms remained in force, or from the possible repercussions
    of the Graeco-Bactrian takeover of the early second century. Finally, Sophytos''s
    statement of the restoration of his house and of their fortunes is explicitly
    couched in terms of his restoration. A tomb is a visible symbol in the landscape,
    one that could be used to project an individual''s or a community''s sense of
    his or own identity and relationship to the local environment. Sophytos''s family
    tomb was bound up with ideas of personal and familial prestige, and it was one
    of the key vehicles through which he chose to make a statement of his own status
    and identity.


