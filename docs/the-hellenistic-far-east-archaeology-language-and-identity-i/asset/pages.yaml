    # THE POSTCOLONIAL HELLISTIC FAR EAST


    In the introduction I briefly noted some theoretical concepts from postcolonial
    studies that have been influential in the analysis of material from the Hellenistic
    world. A major problem with (perceived) earlier debates between Greek and Indian
    influence on the culture of the Hellenistic Far East is that they cultures as
    reified, bounded units, corporate entities that act in union and may be isolated
    in our analysis. In response to similar problems, the postcolonial vocabulary
    for the spaces of interaction and negotiation between tradition-defined cultures
    has been enthusiastically taken up by archaeologists and historians of the Hellenistic
    world. The Hellenistic Far East is as a good ground as for exploring how theoretical
    concepts—may or not—help us toward a better understanding of the ethnic and cultural
    dynamics of the region.24


    Perhaps the most important—or at rate most popular—of these concepts are that
    of hybridity, a biological metaphor adapted in, for example, the work of Homi
    Bhabha beside the coming together and intermingling of cultures and the discourse
    and power dynamics that arise from this.25 Hybridity and hybridization, however,
    have been adapted by classicists and archaeologists from postcolonial studies,
    not directly from the work of Bhabha and other scholars. There are ways in which
    hybridity may not transfer well to historical contexts before modern colonial
    enterprises. In particular, there is a potential clash between postcolonial hybridity''s
    active, self-conscious negotiation between cultures (and the formation of new
    identities) and the efforts that we may observe in some populations of the Hellenistic
    Far East to defend monolithic identity. Hybridity may offer a useful tool in analyzing
    the material culture of the Hellenistic Far East, but it may well be alien to
    the outlook of the people who created and created this material culture. The choice
    to call something hybrid is ours.26


