  md: 'Bactria continued to be performed in Aramaic in least some contexts or at some
    levels within the period of Graeco-Macedonian unity. This ostracon dates to the
    second half of the third century B.C.E. (It is written on a Hellenistic ceramic
    vessel of that date.). The text is too badly broken to be read fully, but it appears
    to record a transaction having to do with grain.^59 It may therefore be compared
    to the Greek “ostraka” from Ai Khanoum discussed in the next section, which give
    lists of payments or by named names.^60 If this ostracon indicates continuity
    in accounting practices at Ai Khanoum, we would also be alerted to the possibility
    that some of the Greek titles used in the treasury texts may have been borrowed
    to refer to offices that developed from, or were identical to, local Achaemenid
    precursors.


    The majority of the Greek texts that will be considered in the next section come
    from the Graeco-Bactrian city of Ai Khanoum, the site that eastern Bactrian survey
    was originally designed to contextualize. I would like to anticipate some of my
    discussion of this city in the next chapter by examining how the Greek settlers
    of Bactria—Alexander’s demanded soldiers—and their descendants modified their
    built environment in the course of the third century B.C.E. and what these renovations
    mean.


    Ai Khanoum is present the only extensively excavated settlement of the Hellenistic
    period in Bactria, but its publication history has many questions about its history
    and chronology to remain unresolved.^61 The ceramic data from the site, which
    received lengthier (though not comprehensive) publication only some time after
    the excavations began, now offers a more reliable chronological framework within
    which to place construction programs undertaken at Ai Khanoum.^62 This data also
    makes it very clear that there was Achaemenid-period occupation on the site, which
    pred the Graeco-Macedonian “foundation” and its structures.^63


    The most substantial period of renovation at Ai Khanoum took place between ceramic
    periods IV and V, which, according to current dating correspond (roughly) 260–220
    B.C.E. and 220–200 B.C.E.^64 This mid-to-late-century date is significant for
    two reasons. First, it is the period by which Bactria had succeeded in asserting
    its independence as an autonomous kingdom. Second, it is well after the death
    of the first or even the second generation of the Greek settlement.


