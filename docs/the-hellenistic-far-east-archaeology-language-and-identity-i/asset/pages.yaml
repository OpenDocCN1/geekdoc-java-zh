    Not only was the settlement of the region long, but its connections to regions
    far beyond Bactria and Central Asia were long standing. These connections are
    best illustrated by the team''s discovery, in 1975, of the site of Shortugai,
    21 kilometers northeast of Al Khanoum''s position at the confluence of the Amu
    Darya.³ The settlement at Shortugai, in its first phase (ca. 2200–2000 B.C.E.),
    was an “output” of the Harappan civilization of the Indus Valley, with identical
    material culture, imported shell and ceramics, a seal depicting a rhinoceros with
    signs in the Indus script, and the same standard brick sizes used in Indus cities.
    The land around was irrigated by a canal some twenty-five kilometers in length.
    The “lap factor” may account in large part for Harappan interest in eastern Bactria
    at this period—once again, it must be stressed that Shortugai was not the earliest
    archaeological site discovered in the region. In addition to beads, unworked pieces
    and chips of seals were found at Shortugai alongside microliths and drillhead
    used to work them.³⁴ In second phase (ca. 2000–1800 B.C.E.), however, the picture
    changes. The site becomes integrated into the local eastern Bactrian archaeological
    culture and yields no further evidence of long-distance connections to the south
    and does display evidence of connections to western Bactria and to the steppe.
    The constant is Shortugai’s intimate relationship to and reliance on its immediate
    agricultural hinterland.


    The precise status of the Harappan settlement at Shortugai (I hesitate to use
    the term “colony”) is subject to debate, as is the nature of its connection to
    the Indus Valley, and its position on the “lapis route” to the West. But the relevance
    of this is to my main discussion, on the Achaemenid and Hellenistic administration
    of Bactria, is very clear. The dramatic changes in material culture between the
    site’s two periods represent some fundamental realignment of its relationship
    to the civilization of the Indus Valley. Whether we can view this in terms of
