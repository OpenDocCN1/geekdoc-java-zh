    Artaxerxes was the name assumed by Bessos, and it is very tempting to identify
    Bessos (Bayasa) of line 2 with the historical Bessos: it is certainly of the right
    date for this to be possible. He may therefore appear twice in the same document
    as the ruling authority by whom paperwork was dated and as the individual who
