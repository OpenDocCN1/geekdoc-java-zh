  md: '# INTRODUCTION


    In 1927, Foucher published an article on the first years of the DAFA.^65 This
    brief account is still more important because publication of the full account
    of his Afghan projects, la vieille route de l''Inde de Bactres at Taxila, was
    delayed until the 1940s.^66 Two of the most important themes in Boucher''s preliminary
    note and the (much) larger publication are: first, his disappointment and frustration
    that the site of Bactria (modern Balkh) had, failed to yield substantial evidence
    of Greco-Bactrian remains, and indeed of anything—a frustration that was all the
    greater, second, the visual culture of Hellenistic Bactria was essential to understanding
    the Buddhist art of Central Asia and Gandhara. It is important to note that Foucher
    had never been under any illusion that the excavation of Bactria would be both
    difficult and that it might not yield much. He was only aware of the practical
    problems associated with excavating the site, but the promise and lure of Bactria,
    the “Mother of Cities,” was too great, and his superiors in Paris insisted that
    he go ahead with the project.^67 Boucher wished to find the unknown art of Hellenistic
    Bactria, and to find in the origins of later Gandhāra Buddhist art, as it happened,
    realized by, however, saw Afghanistan as a “missing link”68 in one more sense:
    chronologically in the development of Buddhist art but also geographically as
    a zone of transition between the archaeologically better-known regions of India
    and Turkmenistan. His thought only later developed in the direction of seeing
    Afghanistan as a land of invaders and pilgrims as a region with its own internal
    cultural dynamics.^69


