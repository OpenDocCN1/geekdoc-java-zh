    What would have meant to a contemporary Indian reader for Heliodoros to be a yona?
    First and foremost, a yona is a foreigner (Sanskrit mleccha, Prakkrit milakha)
    and a speaker of a foreign language. In contemporary and later Indian textual
    sources, Greeks are regularly listed alongside other people of the Northwest,
    such as Kambojas (probably an Iranian people) and Scythians.¹112 In a neat reversal
    of the classical perspective, they are a group on the geographical fringes of
    the Indian world: the mleccha, the outsider who does not subscribe to the established
    norms of Indian society, is not strange, but barbarous.¹113 Furthermore, Greeks
    were noted for their nonadherence to the Indian caste system, at least in any
    standard form. In the Maijjhika Nikāya (discourses attributed to the Buddha and
    his disciples, but perhaps for the most part of later composition), the Buddha
    said: “Have you heard that in Yona and Kamboja and other distant districts there
    are only two castes, the master and the slave?”¹114


    This difference in social structures not only provoked comment from contemporary
    observers, Greek and Indian, but has been the focus of modern debate on the position
    of Greeks as outsiders in the more regmented Indian system. Greek writers such
    as Megasthenes recognized that India had a rigidly stratified social system in
    which endogenous groups occupied a particular niche. inevitably has provoked comparisons
    with the caste system of


