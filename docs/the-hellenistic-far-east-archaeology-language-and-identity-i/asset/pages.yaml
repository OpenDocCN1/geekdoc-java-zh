    3. The Ai Khanoum palace lacks any equivalent of the "apadana" features or hypostyle
    halls found in several Achaemenid palaces (e.g., Persepolis, Susa). There is a
    preference instead for open-air spaces.


    There are plausible reasons for these differences, but they also reflect differences
    in function. The idiosyncratic features of the Ai Khanoum palace have the potential
    to tell us something about social structures and organizations, or simply ways
    of building, which were peculiar to Bactria and may have been inherited from preexisting
    Achaemenid or Seleucid systems of organization. As will be discussed in the next
    section, on domestic architecture, how much of the excavated public and private
    buildings at Ai Khanoum reflect a distinctive Graeco-Bactrian idiom, which may
    have been argued to have had its roots in Achaemenid Bactria or still earlier.
    I shall first discuss Bactrian comparanda, of the Hellenistic and Kush periods,
    but when I turn to a place where we look more productive for architectural and
    functional compara for the Ai Khanoum palace in imperial centers such as Persepolis
    and Susa: in the regional administrative centers or gubernatorial seats of the
    Achaemenid and Hellenistic empires.


    However its architectural origins, there is much to be gained regarding the Ai
    Khanoum central complex as a palace in the Achaemenid or Hellenistic sense, a
    building with a particular set of functions that acts as an administrative and
    ceremonial center for an area, whether a local district or an entire empire. I
    follow Niels''s practical definition of a palace as a building that combines an
    official and a residential function, whether that is the seat of a king or a governor
    or other local official; and I note that the Ai Khanoum palace fulfils most of
    her functional and ... criteria for identifying a palace.72


    The most important question is how closely it adheres to some model floor plan
    for an Achaemenid or Hellenistic palace (and it really does not conform to any
    excavated Achaemenid or Hellenistic example) but how far the features of the Ai
    Khanoum palace demonstrate that it was designed to fulfill the same functions.73
    Nielsen''s decision to include Ai Khanoum in her study of Hellenistic palaces
