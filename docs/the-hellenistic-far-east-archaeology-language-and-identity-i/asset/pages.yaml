    It has been suggested that both pillars were originally surmounted by images of
    the mythical bird Garuda,98 in later tradition the emblem and mount of the god
    Visnu.99


    The religious expressions in the inscription all point to a connection with Vaishnavism,
    a spectrum of religious practice incorporating the cults of numerous of the supreme
    god Nārāyaṇa-Visnu, of which Vādeva-Kṛisna is one.99 The term bhāagata refers
    to the devotee of a Vaishnavite cult.100 A point must be emphasized that the inscription
    of Heliodoros is the earliest epigraphic reference to the cult of Vaishnavite
    divinity. Pre-Gupta-period (fourth-to-sixth-century-C.E.).101 inscriptions of
    Vaishnavite affinity are free, mostly of a native nature or simply containing
    an opening invitation to a Vaishnavite deity.102 Our understanding of cult practice
    and devotion at a popular level must, of necessity, be limited. Within early Vaishnavism,
    we should at rate posit some fluidity of doctrine and practices.103 The precise
    implications of the various names and associations in the inscription are open
    to debate, and we should reclaim about tracing later associations back to the
    second century B.C.104 The briefer inscription on the pillar of Heliodoros is
    on the side facing the platform that at the time of the pillar''s erection bore
    the cult temple. The tone of the inscription is ethical rather than political,
    facing inward towards the sanctuary rather than for more public or political display.105


