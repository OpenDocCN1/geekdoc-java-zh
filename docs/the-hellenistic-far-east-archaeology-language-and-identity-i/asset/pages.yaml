  md: 'The fortifications provide some of the most interesting and extensive documentation
    of the history of the site before and after the Graeco-Bactrian city. Their basic
    format was preserved even when other structures inside the city walls were completely
    razed and rebuilt. Fortifications, of course, retained their function and importance
    when other institutions might gain or lose theirs. As discussed in chapter 1,
    it is here that we find the most decisive evidence for Achaemenid of the site.
    The citadel, particular—the highest, most impregnable part of the fortifications—displays
    a record of occupation from the Achaemenids right to the Timurids.¹112


    Within a more restricted chronological window, the fortifications show several
    destruction events and renovation projects over the course of the life of the
    Graeco-Bactrian city.¹113 Mud-brick architecture requires constant maintenance—a
    problem at the site as a whole, while as discussed in the section on water management
    at Ai Khanoum, below—and no damage and rebuilding is necessarily to be associated
    with military attack. At the citadel, for example, it is difficult to say whether
    the collapse of the latest Greek period was due to an attack or to slight degradation.¹114
    Some traces of specifically military activity, however, remain in various periods
    of the city: evidence of sapping in the northern wall and a fire in the wall by
    the Others.¹115 stone projectiles, some as much as twenty kilograms in weight,
    in the citadel.¹116 spear points and arrows in the northern wall.¹117


    The problem, course, is in trying to tie these attacks and renovations to an absolute
    chronology (establishing which is a contentious matter in itself for Ai Khanoum)
    and, further, to associate them with numismatic finds from elsewhere in historical
    events.¹118 A series of assaults on its fortifications mark the end of the Graeco-Bactrian
    city at Ai Khanoum. As already discussed, textual and numismatic finds date to
    the end of the reign of Eukrates, around 145 BCE. This was a period when the Graeco-Bactrian
    kingdom was menaced by external threats and by internal drastic strife, and it
    is tempting to tie one or all of these to the fall of Ai Khanoum.¹119 I will discuss
    this period fully in chapter 4, but I provide a summary of my discussion here.
