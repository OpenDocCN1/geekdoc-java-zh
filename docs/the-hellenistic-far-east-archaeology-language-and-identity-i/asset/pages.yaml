  md: 'As well as providing a medium through which the inhabitants of Ai Khanoum could
    reimagine their connections to their Greek colonial origins,65 remodeling the
    urban landscape of the city also allowed them to make blunter, more assertive
    statements of their local autonomy, in the form of grander, more monumental architecture.
    If not a fundamental break in terms of government and administration, this marked
    a point when Bactria was developed and administered on its own terms rather than
    as part of a Near Eastern empire, whether was that of the Achaemenids, Alexander,
    or the Seleucids. It was not the introduction of a new external imperial power
    that marked a new direction for Bactria but a change in its status from province,
    however devolved its provincial administration, to independent kingdom.


    # ADMINISTERING HELLENISTIC BACTRIA:

    REVENUE AND TAXATION


    From the last dated Aramaic documents of the new (but not bureaucratically innovative)
    Graeco-Macedonian administration in Bactria in the 320s B.C.E., there is a gap
    of a century or until the first preserved Greek documentary texts, of the late
    third or early century B.C.E. The two documentary corpus give us different kinds
    of information, and the Greek material is on two different media (skain and ceramic
    vessels) from several different locations. Another contrast with the Aramaic documents
    is that the majority of the Greek texts come from an excavated context and are
    securely provenanced, to a site (Ai Khanoum) and to a building within that site
    (the treasury, in the administrative quarter).66


    The office at Ai Khanoum from which these texts derived (and any additional bureaus
    that existed within the administrative quarter) were on a scale rather different
    from that of Akhvamazda''s central satrapal archive but perhaps more akin to Bagavant''s
    regional governor''s office. Although we cannot precisely identify the territory
    that Bactrian administered or assessed land usage or other forms of economic exploitation,
    the regional Bactrian center at Ai Khanoum may be related to a wider archaeological
    context, the area of the eastern Bactrian survey, the data from which was discussed.
    If the Aramaic documents give us the local viewed from the (Achaemenid) center,
    the Greek texts of the Hellenistic period give a more realistic perspective on
    economic affairs.


