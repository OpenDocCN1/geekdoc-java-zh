  md: '# INTRODUCTION


    25


    Our expedition''s concept of what might be found at Ai Khanum the investigation
    began changed profoundly in the 15 years of excavation. No one expected to find
    what had obviously been a powerful and wealthy capital city in this remote corner
    of Central Asia. Nor had anyone anticipated, on the one hand, the Greek settlers''
    stubborn loyalty to Hellenic culture in most respects, and on others, their wholeheartedly
    acceptance of Eastern practices in such matters as architecture and religious.
    ... As the Greek colonists on the banks of the Oxus strove to preserve their cultural
    identity they were also prepared to assimilate the lessons that could be learned
    from the local civilization.


    The presentation of Ai Khanum is essentially a colony in the modern European-sense,
    with certain power dynamics between the immigrant, colonial population and the
    locals. As it will be discussed throughout the following chapters, I do not think
    that the ethnic dynamics of Bactria worked in this way, not least because the
    Greek and Macedonian settlers could have maintained any social or matrimonial
    segregation. On the local Bactrian names around the persons mentioned in the Greek
    economic texts from the treasury, Bernard suggests that “evidently the new masters
    of Bactria found it expedient to retain the native bureaucrats trained by the
    former rulers of the province. It seems safe to assume that the same reasoning
    was applied to local workers and those of more modest statudes. A number of modest
    one-room houses on the acropolis could have been those of local people who were
    not allowed to settle in the lower town.”⁹⁷ It is not that I think Bernard is
    essentially wrong in this regard (chapter 1, in particular, will argue strongly
    for the kind of administrative continuity here we suggested): more than there
    are issues of ethnic and cultural nuance that we ought to explore further. Nor
    is it that I think modern colonial parallels should be rejected: more that we
    should also take on board what some more recent contexts, and the political and
    cultural dialogue resulted from them, to tell us how groups interact and conceptualize
    interaction in such situations. If, as Bernard and others have often noted, the
    architecture and material culture of Ai Khanum demonstrate a cultural conservatism,
    then we ought consider whether conservatism was a deliberate policy of Hellenization
    or a matter of separation from the Greek world and internal development.”⁹⁸


