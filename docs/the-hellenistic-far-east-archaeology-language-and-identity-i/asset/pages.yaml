    # SÓPHYTOS AND HIS INCRIPTION


    Sōphyt''s inscription fits within the tradition of Greek funerary epigrams, played
    with an implicit or explicit appeal to the passersby to stop, and think about
    the accomplishments or misfortunes of the person commemorated.³⁸ The *proskunēmata*
    of Pappius Maximus and on the temples of Lower Nubia, discussed below, sometimes
    offer the additional reward—that they, will come from the author''s prayer to
    the god—but Sōphyt''s references to Greek gods are as patterns of the arts, and
    the achievements of Sōphyt and his family are the major themes.


    The names of Sōphytos and his father, Naratos (or Narates: the name appears as
    the patronymic *Nārādēs*) are not Greek. Peanut makes a strong case for their
    being Indian, from original forms Subhūti and Nārada.³⁹ There were no absolute
    rules for the transcription of Indo-Aryan languages into Greek (as there were
    none for the transcription of Greek into Middle Indo-Aryan Prakṛts; see further
    below), but there seems to have been some attempt to adapt the phonology to something
    more usual in a Greek name, even if the result is meaningless nonsense. The composer
    clearly has no problem adapting and integrating these names into a Greek text,
    freely forming a Greek patronym from the foreign name Naratos.


