  md: '# AI KHANOUM 93


    The final phase of the gymnasium, Phase II,¹³¹ is dated by the excavators to the
    end of the second quarter of the second century B.C.E.¹¹³² and, like the palace,
    is the product of a wholesale destruction and rebuilding of an earlier structure.¹¹³³
    Logical and financial problems made it difficult for the excavators to get a clear
    idea of the phases that preceded, but but layout was rather different; the only
    constant was the open water-channel, which ran east to west across the southern
    court.¹³⁴ Phase III¹³⁵ contained a rotundale building of unknown function in the
    southern part of the complex,¹³⁶ as well as a bas complex similar to elsewhere
    in the city, and other buildings in the southwestern part of what would later
    be the pool enclosure.¹¹³⁷ Phase IV¹³⁸ earlier still, contained a more extensive
    bath complex.¹¹³⁹


    Phase II¹⁴⁰ consisted of two connected quadrilateral courtyards. The northern
    courtyard was a square with sides of around one hundred meters. It containeded
    columns in the middle of each, and a corridor ran immediately inside the outer
    walls. This corridor had few access points, and perhaps served for promenading.¹¹⁴¹
    A Greek inscription was found on the back of a statue of a bearded man set into
    the back of the northern porch.¹¹⁴² This was a brief dedication by Straton and
    Strabilon, sons of Straton, to the gods of the gymnasium, Hermes and Herakles.¹¹⁴³


    The southern courtyard (120 × 100 m) consisted of a simple enclosure wall with
    access to two stone sundials as an outdoor exercise practice. This area was the
    findspot of these¹⁴⁴ These attest to the intellectual as well as the sporting
    activities that typically took place in gymnasiums, and they may also have served
    the purpose of regulating time for gymnasium activities.


