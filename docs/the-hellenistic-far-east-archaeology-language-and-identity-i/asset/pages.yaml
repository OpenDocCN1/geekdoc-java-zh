    # ## HELLENISTIC FAR EAST AND

    ## HELLENISTIC WORLD


    The Hellenistic Far East, as I argued in the introduction, demands to be considered
    part of a wider Hellenistic world. I make no cultural assumptions here. By "Hellenistic"
    I do not mean Greek, and it is precisely the encounter of ethnic identities, languages,
    and cultures in the Hellenistic world that I think provides the best context for
    the material from the Hellenistic Far East. Politically, the Graeco-Bactrian and
    Indo-Greek kingdoms were very much part of the Hellenistic world. The periodic
    attempts of Seleucid monarchs to assert control over the region may have been
    rebuffed (chapter 4), but political ideologies and imagery were shared. The Indo-Greek
    king Agathocles (reigned ca. 190–180 B.C.E.) struck a series of pedigree coins,
    including one of Alexander the Great, making a plea for legitimacy based on a
    connection to his illustrious Macedonian predecessor. Various Greco-Bactrian and
    Indo-Greek kings used royal epithets familiar from other Hellenistic dynasties,
