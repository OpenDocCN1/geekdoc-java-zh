    # Construction Materials and Techniques


    In comparison with other materials, little stone was used in the architecture
    and sculpture of Hellenistic Bactria. Instead, mud brick, rammed earth, and clay
    are the predominant materials. (Bactrian clay sculpture is discussed further in
    subsection 4, below.) These were raw materials that were more readily available
    locally to Bactrian builders and artisans, and so even where Greek (or other)
    artistic styles were adopted, they were also adapted to new media and new techniques
    of workmanship.¹⁹


    The architecture of Ai Khanoum has a number of idiosyncratic features, some of
    which may be observed in other sites of the region. In the absence of excavated
    urban the monumental size of the city''s institutions is a feature of Hellenistic-Bactrian
    urbanism or simply a feature of Ai Khanoum''s architectural program of the early
    second century B.C.E. The “isolating” or “circulation” corridors of the palace
    and domestic spaces of the city can, however, be identified at other sites, such
    as Saksanhand and later, Dil’berzhin. This reflect, in Bernard''s view, “an obsessive
    concern with using corridors to mark axes of circulation in material form, and
    by channeling routes along pathways determined in advance, by bypassed rooms or
    groups of rooms, or even entire buildings, without crossing them.”It is at present
    difficult to say much about the rationale behind the adoption of such plans and
    the features of behavior and circulation that they were designed to channel and
    constrain.


