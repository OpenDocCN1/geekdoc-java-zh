    To the west of the office and reception units, the two adjacent residential complexes
    are both divided and linked by the same large north-to-south corridor, with several
    internal doorways, that runs down the western side of the great court. The larger
    unit, to the east, has its own court and iwan, and is separated from the smaller,
    to the west, by a peripheral isolating corridor. It is tempting to identify these
    as men''s and women''s quarters, but we really know too little about the social
    structure of Ai Khanoum and Hellenistic Bactria in general to make such assumptions.
    These residential units are comparable in plan to the private houses of Ai Khanoum.
    The units are self-contained, but with connections to the corridors and, indirectly,
    the official rooms. One of the larger rooms of the western block (77) was decorated
    with a clay relief, fragments of which indicate that it may have been a series
    of bursts, some of them female.45 Both units had complexes with pebble mosaics
    and the same layout as baths elsewhere in the city.46 The existence of a bath
    complex under the portion of the palace immediately to the south of the great
    court may indicate that the palace had residential function even at the time of
    its construction or that it contained public baths.47 To the north of the western
    residential unit (but, as typically, separated from it yet another corridor) was
    an peristyle courtyard, and to the north of this was the treasury.


    The treasury building in its preserved form, the unit to the southwest of the
    great court and directly to the north of the western residential unit, was an
    innovation of the final phase of the palace. In the preceding phase, it was located
    elsewhere, probably in the unexcavated rooms off the east side of the great court.48
    Like other parts of the palace, the remains of the treasury show how access was
    managed and restricted. There were several blocked-up entranceways in the western,
    external wall, used for access of workers and materials during construction and
    subsequently blocked up.49 To the south, where a passageway leads into a peristyle
    courtyard, which further gives access into the innermost apartments of the palace,
    there is no evidence of provisions for closing. The only other entrance to the
    treasury was to the east, into the great court, which was indirect—an intervening
    isolating corridor—and had a doorway with a stone threshold and for a wooden door.50
