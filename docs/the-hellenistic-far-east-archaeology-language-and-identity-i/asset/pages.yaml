    with which the system was confronted: “Pre-colonial kingdoms and their subjects
    did not treat cases as one-dimensional abilities, but as references to be negotiated,
    challenged or reshaped to fitting circumstances”¹¹⁷


    Political expediency was one of the key factors in determining the cultural acceptance
    or rejection of *lechcha* groups. *Melechas* could be useful as military or political
