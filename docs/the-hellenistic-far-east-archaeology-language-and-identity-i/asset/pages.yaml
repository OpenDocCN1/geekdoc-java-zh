    he may be a Sōphyos or a Sphytes. Bernard treats the question of this earlier
    Sōphytos and his relationship to the Sōphytos of our inscription at some length.
    He argues that “Sōphytos A” was a Mauryan satrap of Arachosia, of Indian origin,
