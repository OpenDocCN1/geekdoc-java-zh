  md: 'Now that we have some documents from the satrapal archives, what do these add
    to our understanding of the Achaemenid administration of Bactria? The first thing
    to be said is that the documents currently known contain no references to irrigation
    or canals but do refer to public land under cultivation, the management of such
    land, and its agricultural products. The archaeological evidence already considered
    shows this agricultural production, in Bactria, was made possible by large-scale
    irrigation works, but the execution of such works is not mentioned in any of the
    written sources present at our disposal. Another point for which the archaeological
    and documentary evidence may be viewed as complementary rather than accumulative
    is geographical provenance. The best-documented surveys are eastern Bactria, the
    area on which I have focused and the valley of the Surkhan-darya, in central Bactria
    (which will be discussed in chapter 4). The documents, in contrast, most come
    from the satrapal archive in the city of Bactria, in central Bactria. Some of
    them relate to the administration of the area around the town of Khulmi, just
    to the east. Nevertheless, as will be discussed, there are numerous places in
    the documents which provide new information to bring bear on existing historical
    questions.⁴⁶


