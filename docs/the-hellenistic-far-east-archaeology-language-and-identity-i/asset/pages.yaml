  md: 'The latter point—that incoming imperial powers might integrate preexisting
    systems of administration and land management into their apparatus of government
    and exploitation—is, I would argue, the most fundamental one. Not only is it supported
    by the most recently discovered documentary evidence (as will be discussed in
    following sections), but it offers a point on which we may reconcile the long-standing
    debates between Gardin and his colleagues versus Briant.⁴² I have already outlined
    the basic thrust of Briant''s arguments above. Bactria, he argues, must not be
    considered in isolation from other provinces, as a "special case" within the Persian
    empire: the documentary lacuna that had obscured the mechanisms of the Achaemenid
    administration in Bactria was a lacuna in our evidence and did not prove the nonexistence
    of an ancient bureaucracy and its paperwork (as has since been confirmed).⁴³ Long-term
    continuities may imply that the Achaemenid state lacked influence on or failed
    to intervene in the local administration but rather that state mobilized and utilized
    existing structures and systems.⁴⁴ Here, it should be noted, Gardin and Briant
    are essentially making the same point.


    One reason why Achaemenid imperial control in Bactria is not especially archaeologically
    visible is because much of the existing administrative and economic apparatus
    was retained. The retention of these systems does not imply the lack of imperial
    control, but it tells us that one of the ways in which this imperial control operated
    was to take advantage of existing structures. Achaemenid and Hellenistic imperial
    control does become visible in the documentary record, to which I now turn.


    # THE SATRAPAL ARCHIVE:

    ADMINISTERING ACHAEMENID BACTRIA


    Although documentary texts from Achaemenid Bactria have emerged only recently,
    their evidence and contents provide confirmation of what scholars have been arguing
    for some time: that Bactria, a province of economic and strategic importance to
    the Achaemenid state, can have been administered only with the same care and using
    the same administrative registers (the Aramaic and Elamite languages) and tools
    as other provinces of the empire.⁵


