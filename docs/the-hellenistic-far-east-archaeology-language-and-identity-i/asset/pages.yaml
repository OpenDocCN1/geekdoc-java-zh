  md: '# Introduction


    Coins with Indian inscriptions.

    Those of the most powerful monarchs,

    of Evoukratindaza, of Stratasa,

    of Menandrata, of Heramaïaza.

    That''s how the scholarly book conveys to us

    in Indian writing on one side of the coins.

    But the book shows the other side as well,

    that, moreover, the right side,

    with the figure of the king. And how quickly he stops there,

    how a Hellenene is as he reads the Greek,

    Hermaios, Straton, Menandros.


    > —C. P. CAVAFY, “COINS WITH INDIAN INSCRIPTIONS” (1920; TRANS. AFTER MENDELSOHN
    2012, 334)


    # A GREEK CITY IN AFGHANISTAN


    In 1966, excavators at an ancient city on the river Oxus in northern Afghanistan
    discovered two Greek inscriptions. In one, from a gymnasium, two brothers named
    Straton and Triballidos dedicate to Hermes and Herakles. In the second, the more
    famous inscription, a man named Klearchos states that he has copied a series of
    ethical maxims at Delphi and brought them to be set up in the “sanctuary of Kineas.

    On the same stone, the surviving portion of a longer inscription, we find the
    last of these precepts, which contain instructions for those different stages
    in their lives: “As a child, be well behaved; as a young man, self-controlled;
    in middle age, be just; as an elder, be of good counsel; and when you come to
    the end, without grief.”


    +   1. For the idea of Ai Khanoum as an intrusive “Greek city” in Central Asia,
    see Frye 1966 and Bernard-1982b. “two short Greek inscriptions” mentioned in the
    text were published by the epigraph Louis Robert in the Comptes-Rendus de l''Académie
    des Inscriptions et Belles-Lettres for 1968. Both will be discussed at greater
    length in chapter 2.'
