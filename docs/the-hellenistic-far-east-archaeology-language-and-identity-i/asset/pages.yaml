  md: '# THE FALL OF GREEK BACTRIA 147


    previous royal families is not obvious. The general picture is one of heterarchy,
    not hierarchy: political fragmentation among several Greek-named kings ruling
    currently in different regions of the conquered Indian territories.


    The most destructive forces at in the period of instability in the 140s and 130s
    B.C.E.; however, come from the lands to the north and west of Bactria. There was
    war with Parthia, but the principal agents of the fall of the Graeco-Bactrian
    kingdom have long been considered to be nomadic groups who moved into the region
    of the Oxus at praxis. Ever since Chinese sources became available to Western
    scholars, the potential of Chinese and classical Greek and Roman sources to corroborate
    each other on this point has been recognized.


    My purpose is not fundamentally challenge or alter this narrative of the fall
    of the Graeco-Bactrian kingdom under the pressure of invasions from the north
