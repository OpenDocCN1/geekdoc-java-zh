    have certain common formats that reflect these shared functions and, potentially,
    architectural inspiration. Like other regional palaces,68 that at Ai Khanoum not
    necessarily have been the seat of a royal family for any or of its active life,
    but did contain residential accommodation for some prominent local family, perhaps
    of a regional governor.


    Comparisons are most frequently drawn with the Achaemenid empire—and there are
    certain similarities—but the structures of the Persepolis terrace,690 for example,
    do not really work as a comparison, and there is no reason why they should. If
    we are to look for the origins of Ai Khanoum’s architecture in the Achaemenid
    empire (as if we thought to do) and in terms of administrative functions, Persepolis
    is the wrong place to look. Its construction (in the late sixth century B.C.E.)
    and active life are far earlier than the Ai Khanoum palace. Its functions are
    also very different: Persepolis was the capital of an empire, the seat of an emperor,
    the Great King, and part of the complex appears to have been designed to house
    tribute to a “harem.” The Ai Khanoum palace gives the impression of wealth and
    grandeur, and shares a layout of grand courts surrounded by complexes of official
    and residential units. Such grandeur and “size for the sake of size” could, of
    course, be a political statement in themselves.70 on finer levels of detail the
