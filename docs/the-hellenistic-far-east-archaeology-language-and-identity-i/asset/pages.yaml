  md: '# An Obscure History


    Even as late as the first half of the twentieth century, historians were largely
    justified in their complaints about the poor research prospects of the Hellenistic
    Far East. Greek coins from Bactria and India had been known to European scholars
    as early as the eighteenth century, but the region has also traditionally been
    renowned for its exceedingly low yield of archaeological and epigraphic material
    and the apparent unwillingness of Greek and Roman authors to transmit much in
    the very of useful information on their history.³37 It says that one of our few
    “historical” references to a Greek king of Bactria—one of Tarn’s “scraps” of information—comes
    in Chaucer’s Canterbury Tales.³38


    Given this general lack of historical and archaeological data, the Hellenistic
    Far East has therefore long posed challenges to scholarship. As a result of excavations
    and survey projects in the twentieth century, and particularly from the 1960s
    onwards, we now have more evidence at our disposal than could have been hoped
    at the time of the first major modern synthetic, Tarn’s The Greeks in Bactria
    (first edition 1938; second, 1951) and Narain’s The Indo-Greeks (1957). New discoveries
    have recovered much of the discussion in these books, each still has a useful
    perspective to, and occasionally shall I make reference to their arguments in
    the following chapters.


    Tarn and Narain held different views about the political and cultural affinities
    of the easternmost “Greek” kingdoms, and they outlined these views in quite tolerable
    terms. Tarn, a classicist, set out to reclaim Bactria’s “lost chapter of Hellenistic
    history”³³⁹ Narain argued, on the contrary, that “their history is part of the
    history of India and not of the Hellenistic states; they, saw, but India conquered.”⁴⁰
    Upon examination, however, this apparent opposition breaks down.¹ Each scholar
    is right in his own way; but both focus on different regions and chronological
    periods. The Greek kingdom of Bactria developed along the lines lines as other
    nascent states of the Hellenistic world: its ruling population, political rhetoric,
    language, culture, and sense of its origins are overtly and awedly Greek. In the
    northern territories that Greco-Bactrian kingdoms were subsequently conquered,
    over time, Greek states ceased to exist as political entities, and the Greek language
    and culture disappeared.


    The excavations at the city of Ai Khanoum (discussed further below), the Hellenistic
    Far East has enjoyed a reputation for obscurity of a slightly different sort,
    inasmuch as it has has a reputation at all: as an occasional source of


