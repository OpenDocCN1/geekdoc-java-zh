  md: 'Where we find the closest and most compelling architectural comparanda for
    the Ai Khanoum palace (and also domestic architecture) is locally, as may be expected,
    several excavated structures of the Hellenistic and Kushan periods are visibly
    phrased in the same Graeco-Bactrian architectural vernacular. Perhaps the most
    compelling comparison is to make a structure with Saksanour, in southern Tajikistan,
    thirty-five kilometers northeast of Ai Khanoum as the crow flies.⁸⁰ A citadel
    with a fortified palace (and possibly also cult) structure and a nearby artisans''
    quarter were excavated in the 1960s and 1970s, while excavations at Ai Khanoum
    were going on to south. The excavators of each site made reference to the other
    in their publications,⁸⁰ and comparisons were made with the architectural plans
    of the two palaces and with individual elements such as stone columns and capitals.
    Saksanour is the closest and most compelling relative of the Ai Khanoum structures.
    It reinforces the idea of a local Hellenistic-Bactrian architectural koine, which
    evolved in part from Achaemenian and Seleucid models, one that may differentiate
    from that of the Indo-Greek kingdoms.⁸² Coins, ceramics, and other finds date
    the active life of the Saksanour building from the second century B.C.E. (i.e.,
    the late Graeco-Bactrian period in this region) to the Kushan period, the second
    to third centuries c.E. Unfortunately, these dates mean that it cannot elucidate
    much about the origins and development of a "Graeco-Bactrian school."


    The excavated structures at Saksanour were only a small part of a much larger
    site, most of which had been leveled and plowed over in more recent times. What
    survived was the highest point of the settlement, with the "palace-temple complex."
    As at Khanoumoum the buildings are mostly constructed of rammed earth (Persian
    paksa) and mud brick, covered with adobe or plaster, which


