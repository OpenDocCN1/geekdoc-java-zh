  md: '# CONCLUSION


    179


    Another area in which it makes sense to think of political and cultural evolution
    in the long term is in the relationship between settled and mobile populations.
    The Aramaic administrative documents from Achaemenid Bactria make some reference
    to the pastoral economy. As evidence from field survey indices, which continued
    to be important through the Hellenistic period. The best evidence comes from the
    valleys to the north of the Oxus, but the same is likely to have been true in
    eastern Bactria, around Ai Khanoum. This is one context in which we should view
    the contractions and expansions of Graeco-Bactrian power in Central Asia at the
    expense or to the advantage of nomadic populations. Well as indicating short-term
    conflicts with particular nomad groups and the periodic loss of territory beyond
    the Iron Gates at Derbent, in Samarkand, and in the Zeravshan Valley, where the
    evidence shows a gradual process by which mobile populations moved into Bactria,
    living for much of the Graeco-Bactrian period in symbiotic populations, not in
    conflict with them.


    # AI KHANOUM


    The city of Ai Khanoum has been a dominant presence throughout the preceding chapters.
    In the introduction, I discussed how discovery of this city came about in the
    context of the history of European exploration and archaeological investigation
    in Central Asia. This discovery was reported in the popular press, including the
    Kabul Times, as well as scholarly journals, but for long time analysis of the
    remains appears have stalled, with the ideas of a Greek city in Central Asia and
    an anomalous and bizarre mixture of architectural traditions both persisting.
    In chapter 1 I tried to restore to Ai Khanoum mentioning of its historical and
    geographical context. The city was located in a region heavily exploited in antiquity
    for its natural resources and agricultural potential, and was situated so to control
    them. The administration of Ai Khanoum, which included individuals with Greek
    and Bactrian names, was the successor of an earlier Achaemenid administration,
