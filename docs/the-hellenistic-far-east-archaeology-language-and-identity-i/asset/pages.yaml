  md: '# CONCLUSIONS


    The four inscriptions (by three authors) discussed here, despite their differences
    in language, region, date, and purpose, have certain points in common that make
    them worth discussing together. The inscriptions of Heliodoros and Paccius come
    from excavated religious centers, whereas that of Sophytos is without any verifiable
    archaeological context. Sophytos and Maximus are compulsive Greek language-droppers
    and seem at pains to display their education and erudition. Heliodoros, Sophytos,
    and Maximus leave us to speculate about their identities and self-definitions—although
    Maximus claims a professional identity as a Roman decent, whereas Heliodoros assumes
    the double title, both ethnic and deorum, of Greek ambassador.


    The problem with recognizing ethnic identity and ethnic behavior in the archaeological
    record, as has frequently been pointed out, is that it is usually very difficult
    to identify which forms and styles of material culture were held to have significance
    as index of group identity and which not.¹⁶⁸ This is a problem that I touched
    upon in the introduction and confronted directly in chapter 2, on the urban landscape
    of Ai Khanoum. Is a Corinthian column in the Hellenistic Far East a sign of Greek
    identity¹⁹ is it something that supports a roof? Similarly, in the epigraphic
    record from the Hellenistic Far East, it is difficult to tell which descriptors,
    references, language choices, and literary styles should be read as ethnic cues
    and which not. In the preceding discussion, I have tried to demonstrate that such
    apparent cues, when they come in such beguiling straightforward forms as the description
    of a man with a Greek name as a Greek ambassador, are open to more than one interpretation.
    In particular, a classicist, Heliodoros will always look as though he has gone
    native.¹⁷⁰ Sophytos will look at first glance like a try-hard *nouveau grec*.
    To an Indologist, however, both are equally foreign.


    There is little that is itself problematic in Sophytos''s or Heliodoros''s statement
    of their cultural reference points or identity. Identity ambiguity is, crucially,
    something that individual public display may go to lengths to avoid, however we
    may be to recognize it in the exotic archaeological and epigraphic material from
    the Hellenistic Far East. Analysis of the conflicts between claimed ethnicity
    and other factors such as descent or language use is a key modern question, but
    one that the ancient sources— sought to obscure. The ethnic loading of terminology
    and


