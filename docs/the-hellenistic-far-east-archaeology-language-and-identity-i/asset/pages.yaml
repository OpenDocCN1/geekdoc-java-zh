    # ETHNIC IDENTITIES


    As I noted in chapter 3, Heliodoros, the Greek ambassador from Taxila, is the
    only individual from the Hellenistic Far East for whom we have an explicit ethnic
    descriptor. This appears to contrast with the evidence from contemporary Egypt,
    where individuals were frequently classified as belonging to one ethnic group
    or another in both bureaucratic convention and in everyday social discourse. Ptolemaic
    documents, we find listings of individuals and families as Greek, Arab, Jew, and
    for the life.15 There is also some evidence for ethnic discrimination and violence.16


    Part of the reason why we do not have evidence of similar practices and forms
    of behavior in the Hellenistic Far East is that we do not have the same wealth
    of documentary texts as is available from Egypt. Should more be made in the future,
    this picture may well change. In the data available at present, we find some indication
    of the presence and differentiation of ethnic groups—in the section “The Siege
    of Bactra in 206 B.C.E. and the Nomad Threat,” in chapter 4, I discussed a Greek
    documentary text that makes reference to Scythians. That the officials of the
    Ai Khanoum treasury are not given ethnic descriptors simply due to the fact that
    these are brief texts documenting transactions and that ethnicity was not salient
    in this context. We have little idea of how individuals of mixed descent and culture
    have been classified in the Hellenistic Far East—or of whether the administration
    or society took an interest in such classifications—because we know so little
    about the family background (the occasional patronymic) of any of the individuals
    mentioned in our sources.


