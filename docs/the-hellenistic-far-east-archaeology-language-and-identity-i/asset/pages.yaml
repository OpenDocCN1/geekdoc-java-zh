  md: '# THE FALL OF GREEK BACTIA 157


    period extends considerably before and after the specific population movements
    of the mid-second century B.C.E. affected the Greek kingdom of Bactria, but such
    is the nature of the archaeological record—and, in fact, just such a durée is
    desirable. I begin with a general discussion of mobility (migration, nomadism,
    pastoral transhumance) and its visibility in the archaeological record before
    proceeding to a Central Asian case study—that of Xiongnu-Chinese interaction—that
    has useful lessons for the study of population mobility and mixed subsistence
    strategies in Bactria and neighboring territories. Finally, I review the evidence—from
    the excavation of settlements and burials, and from field surveys—from these territories
    themselves.


    The topic of migration has undergone a—not atypical—theoretical cycle of simplistic,
    unnuanced application (further compromised by political and racial overtones from
    which subsequent scholars have sought to demean themselves), enthusiastic debunking,
    and a limited redefinition. Archaeological cultures do not equate to peoples—or
    not least in the senses intended by early generations of historians such as Gustaf
    Kossina, Gordon Childe, or Sir William Flinders Petrie—and the spread of cultural
    traits or assemblages not have to be explained in vague terms of the movement
    of peoples. The process emphasis on internal processes of social, cultural, and
    economic change, on the other hand, does not deal particularly with the observable
    fact that people indeed do, even in large groups and over great distances.


    In the Hellenistic world, and more specifically in Hellenistic Bactria, we are
    directly confronted with this fact, not just because of well-documented population
    movements associated with Graeco-Macedonian military expansion and colonization
    but because the Greek and Chinese historical sources just attested the movement
    of peoples in Central Asia. These peoples—I use the term precisely because it
    is vague—are described in the historical sources as groups with particular names,
    with their own cultural traits and customs, and acting under the political authority
    of leaders. These descriptions inevitably tell us more about outside—Chinese or
    Greek—attempts to understand and categorize groups than internal affairs and organization,
    and conception of themselves, but they also indicate very clearly that population
    movements were going on. We identify or corroborate archaeologically these waves
    of population movement without lapsing into the kinds of cultural-historical approaches
    that first discredited the whole project of looking for migration in the archaeological
    record?


