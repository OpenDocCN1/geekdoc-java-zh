  md: 'The Achaemenid imperial apparatus exercised considerable direct control over
    the economic and military affairs of the province. Agricultural produce is gathered,
    consolidated, and distributed. The kinds of products mentioned include livestock
    (chickens, geese, horses, camels), harvested grain, and processed foodstuffs such
    as yogurt, wine, and vinegar.52 Significantly, the documents differentiate between
    cattle and sheep roaming free at pasture and confined in an enclosed, supervised
    space.53 an important confirmation of the importance of the pastoral economy in
    Achaemenid Central Asia and the ability of the state to supervise and profit from
    it.54 Such products are both collected and distributed to lists of named individuals
    and groups, including soldiers. The tasks with which Bagavent is charged are the
    transportation of grain to the satrapal granary, fortification of towns, and one
    of correspondenceences Bagavent''s resistance to an earlier order to build a wall
    around the town: the crops have not yet been harvested, he protests, and are at
    risk from locusts. Akhvamazda gives his permission for the work to complete the
    harvest before starting on the fortifications.55 Although already noted no documents
    refer to irrigation works and their maintenance, this last-mentioned letter does
    demonstrate the extent to which the Achaemenid apparatus was able to mobilize
    and direct labor.


    As in the Greek texts that will be discussed in the next section, onomans gives
    us some limited but potentially useful evidence on the ethnic origins or assumed
    ethnic identities of various officials. The highest officials have all Persian
    names, as the "scribes" of the documents—who may in fact also be executive officers
    rather than simple secretaries.56 Like the Bactrian Greeks of the Ai Khanon treasury
    texts (on whom we see further below), these Bactrian Persians may have had deeper
    roots in the region, whether as long-term residents or as the products of families
    had been settled there for some generations and integrated with local communities.
    Some of the names in the documents do, however, bear traces of Bactrian influence,
    in particular theophor names derived from the deified river Oxus.


    Still evidence for the deep enmeshment of the Achaemenid apparatus and its personnel
    in local affairs and socioeconomic structures, comes from the indistinct dividing
    line between Akhvamazda''s administration of state property and his personal holdings.57
    Bagavent is charged with managing both the satrap''s personal estates (for example,
    carrying out repairs on buildings) and state lands, and it seems difficult to
    tell which


