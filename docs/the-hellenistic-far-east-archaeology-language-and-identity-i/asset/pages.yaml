  md: '# INTRODUCTION


    In Mortimer Wheeler’s Flames Khanoum took a starring role in his account of the
    spread of Greek culture to the East, cast once again as the first material evidence
    of the Greek kingdom of Bactria and as a remote colonial outpost of Greekness.³³
    Wheeler’s modern adventure story of the discovery of a lost Hellenistic civilization
    in Bactria lays emphasis on the natural advantages of the site, Hellenic institutions
    like the probable theater and gymnasium, Greek inscriptions, and Greek architectural
    elements as Corinthian columns:⁹⁴


    In one way and another, this city at Ai Khanoum is already, in the early stages
    of its revelation, a human and historical witness of the first order. It was the
    work of adventurous and imaginative and all civilized peoples on the utmost fringe
    of the Eurasian world. The elements of Delhi were here advertised in midst, perhaps
    by the carefully cherished tomb of the founder. The architecture was skillfully
    sculpted and colored, in accordance with Western canons though not without occasional
    acknowledgment of an Asian environment; here and details such as the bolstered,
    classical base of a column, already referred to, or the winged pseudo-marble of
    a roof-ornament have been thought to point to Ai, perhaps Achaemenid influence,
    indeed they may. With the progress of discovery, such hybrid elements will no
    doubt a clearer measure of importance. This will remain secondary to the over-all
    Hellenism of the sect. Greek priests, philosophers, craftsmen may rely on. The
    stamp on a jar or oil which may be of local manufacture refers to an agronomos
    or master-controller which is known in Greek cities of the Black Sea and Near
    East. It is not too much to imagine that most of the familiar apparatus of Hellenistic
    urban life will be revealed in due course.


    But the most influential article on Ai Khanoum in Anglophone scholarship has been
