  md: '# INTRODUCTION 9


    Ethnic identity is one of my main preoccupations in this book. By "ethnic identity,"
    I mean not some monolithic, unchallenged, primal identity by an individual or
    community but a fluid, situational identity, subject to change across time and
    space in different social contexts. (See below on linguistic domains and code
    switching.) This model of ethnicity is fundamentally that of the anthropologist
    Friedrich Barth, who noted that a boundary between groups can be delineated in
    cases when there is little observable difference between the languages, cultures,
    and societies of the groups concerned, and that many different forms of behavior
    and culture can be given ethnic weight.28 From a Hellenistic perspective, this
    is what means that many have defended strong ethnic identities where their material
    record does not differ greatly from that of their neighbors. It also means, as
    I will argue in chapter 2, that is important for us to differentiate between what
    we view as external criteria of ethnic belonging (e.g., the use of Greek architectural
    forms) and those that were perceived as such by contemporary agents.


    The postcolonial turn in classical studies29 has also brought new ways of approaching
    the Hellenistic world. The Hellenistic Far East was, of course, a settler society,
    home to an incoming Greek colonial diaspora and to these settlers'' descendants.30
    The lessons from more recent colonial encounters be to learn from the region?
    My approach is more cautious. From the nineteenth century onward, European colonization
    of the Indian subcontinent and Central Asia, Alexander and the Greeks of Bactria
    were viewed as predecessors of the British in India—an identification claimed
    with some pride by the British themselves.31 But there are important differences
    between the two historical contexts, not least in attitudes towards intermarriage
    and mixing between ethnic groups and races. I will discuss the more recent European
    archaeological research in the region further below. Other concepts generated
    from postcolonial studies, as hybridity and the middle ground, may perhaps be
    productively applied to the evidence from the Hellenistic Far East, a subject
    to which I shall return in my conclusion.32


    Aside from identity and its construction, the most important theme in this book
    is that of interaction between communities, and this topic is again a preoccupation
    that I share with those who work on other regions of the Hellenistic


