    led back to a series of more private chambers: a colonned entrance hall, to the
    courtyard; a reception room behind a door; an inner suite of rooms, linked by
    corridors, in several groups of people work or be received without having to encroach
    on one''s spaces or even visible; and finally, in the southwestern corner, residential
    units. Two corridors, each with severally, led directly from the main courtyard
    to the innermost rooms, allowing direct access to certain people, presumably high
    officials or residents. The ways in which these featured the working life of the
    administrative center will be discussed in the next section.


    The treasury, in the last phase of the palace was located to the west of the main
    courtyard, also had several entrances, with different degrees of closure or protection.
    A passageway (with no doors) led to a colonned courtyard in the interior of the
    complex, which itself was linked to one of the inner residential units and to
