    consider that certain programmes of the Achaemenid period could not have been
    realised without the initiative of the satrap of Bactria, who was the primary
    beneficiary of them in the form of tribute payments.

    ⁴⁴ Briant 1985b, 244. See also Briant 1985a, 244: "What one might call the ''Bactrian''
