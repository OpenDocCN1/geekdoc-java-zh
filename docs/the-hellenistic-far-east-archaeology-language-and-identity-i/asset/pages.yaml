    overshadow the interest of the second part of the compound, -dūta—“ambassador,”
    “envoy,” “negotiator.” Greek ambassadors to Indian courts are known in the persons
    of Megathenes, Daimachos (or Deimachos) and Dionysus, but these are later Hellenic
    envoys from Western kings. Heliosodoros is a representative of a closer, more
