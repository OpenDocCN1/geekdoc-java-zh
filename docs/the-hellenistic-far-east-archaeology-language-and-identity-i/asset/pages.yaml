    # AI KHANOUM AND THE GRAECO-BACTRIAN KOINÉ


    I have suggested the the discussion that there is some merit to considering the
    architecture and material culture of Ai Khanum as forming part of a distinctive
    Hellenistic-Bactrian koinē. While the culture of Bactria bears clear influence
    from neighboring regions, especially those with which it was politically integrated,
    there are certain idiosyncratic features that make the culture of Bactria Bactrian.¹⁷⁶
    The notion of Bactrian koinē may also be useful in assessing continuities in material
    culture in Bactria in the periods before and after the Graeco-Bactrian kingdom.
    In concluding, I would like to recap some of the places I have suggested we may
    see these and draw attention to some more.


