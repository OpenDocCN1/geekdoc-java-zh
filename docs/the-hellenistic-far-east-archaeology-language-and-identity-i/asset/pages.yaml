  md: '# 180 CONCLUSION


    sion of the fall of the Greek kingdom of Bactria also considered the fall of Ai
    Khanoum, and the evidence for the city''s destruction and subsequent limited reoccupation.


    In a Hellenistic context, there are several interesting parallels for the encounter
    of ethnic groups and cultural traditions at Ai Khanoum, and one I wish to pursue
    further is that of Babylon. Unlike Ai Khanoum, Babylon had a long pre-Hellenistic
    history, and it was not a major center of Greek settlement: there was nearby at
    the new foundation of Seleucia-on-Tigris. There were, however, some Greeks, and
    some form of Greek political organization, alongside the persistence of native
    Babylonian structures and institutions, such as temple complexes. There was also,
    as at Ai Khanoum, a Greek theater (an unfamiliar concept that was translated in
    Babylonian bit tamarti, “house of observation”). Greek literature and intellectual
    culture, too, were present at Babylon. The city had a philosophical school, said
    to have been established by Archedemos of Tarfus. It was the home of the poet
    and grammarian Herodikos of Babylon, who lived in Alexandria for Egypt in the
    second century B.C.E., and in anigram quoted by Athenaeus claims his attachment
    to both Greece and Babylon.


    Yet no Greek temple has yet been at Babylon. Is this simply because it remains
    to be excavated, or did Greeks worship at the Babylonian temple of Bel, perhaps
    interpreting him as a Greek god? If they did so, they failed to leave any recognizable
    evidence of Greek devotional practices. My point is not that Babylon presents
    a direct analogy for Ai Khanoum—the composition of their populations, one ancient
    city and the other Greek colony, were very different—but it shows that there was
    room for Greek cultural foundations such as a theater in an otherwise indigenous
    urban landscape, and that Greeks might incorporate unexpectedly local institutions
    into their everyday lives.


    Ai Khanoum, sadly, has been heavily plundered during recent wars in Afghanistan.
    Some material from the city appears to have emerged onto the antiquities market,
    such as two golden bracelets with a craftsman’s signature and weight marks. A
    good portion of the site remains to be fully published, such as the public buildings
    to the south and east of the palace—although a new volume on too late to be taken
