    Whether we suppose that in fact did so intimately linked with our perception of
    how individuals in the own ethnic identity. If, as I argued in the introduction
    to this volume (and will argue again in the conclusion), it was possible for individuals
    to adapt a wide range of ethnic identity—and the arenas in which identity was
    publicly expressed thereby charged with political and social significance—then
    we may imagine that the performance of religious activity in the temple sanctuary
    was a selective business, not wholly promiscuous but subject to manipulation and
    variation depending upon the individual or the occasion.


    # DEFENSES


    Ai Khanum had impressive natural defenses: these were one of the principal attractions
    of the site. The city was surrounded on two sides by rivers, with high, steep
    banks. Its upper city stood around sixty meters above the level of the plain and
    afforded a line of sight across the nearer and farther banks of the rivers.¹¹⁰
    At the far southeastern corner of the acropolis was a still higher citadel. The
    only weak point lay to the north, and here the city was protected by the most
    formidable of its extensive and imposing man-made defensive structures, a wall
    and a defensive ditch some twenty meters across and five meters deep. The northern
    wall had towers, with larger ones at the gateway, where the main street entered
    the city, and at its northwestern corner, where it reached the river Oxus. This
    wall continued along the northern side of the acropolis. Elsewhere, along the
    river banks, the city was protected by less impressive but formidable ramparts,
    without towers. The upper city had its own internal defenses, including a fortresslike
    structure at its northwestern corner, situated so to protect the levels of the
    lower city, and a deep ditch separating the citadel. The city’s arsenal, which
    has been neither fully excavated nor fully published, stood on the eastern side
    of the southern part of the main street. As well as containing stores of working
    arms, metallurgical debris suggests strongly that workshops for making arms were
    located here.¹¹¹¹


