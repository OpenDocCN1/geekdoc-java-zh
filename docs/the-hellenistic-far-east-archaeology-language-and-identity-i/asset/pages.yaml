  md: '# CONCLUSION 187


    sion of ethnicity, there is a potential disjunction between the ethnic signals
    that we read from material culture, architecture, and even written documents,
    and those that may have been perceived or deliberately intended to be sent as
    signals by the actors.


    Does postcolonial theory and vocabulary have anything more to offer to the analysis
    of material from the Hellenistic Far East? Discussion of “middle ground” emphasizes
    the process of creative misunderstanding: “A middle ground is the creation, in
    part through creative misunderstanding, of a set of practices, rituals, offices,
    and beliefs that although comprised of elements of the group in contact is as
    well a separate from the practices and beliefs of all those groups.”³⁰ This, is
    one of the processes in the creation of the hybrid culture of the Hellenistic
    Far East: the creation of what in chapter 2 I called the HellenisticBactrian cultural
    seine. A structure such as the Temple with Indented Niches at Ai Khanoum could
    be understood in many ways by the people who used and called by different names.
    But perhaps most important, as I argued in chapter 2, the shared practices and
    material environment, of diverse origins, that bound Hellenistic Bactria together
    as such were important in allowing an accommodation and dialogue to come between
    diverse ethnic and cultural constituencies. In this sense, I argue that given
    the provenance of many important pieces on the ground closer attention to the
    original theoretical formulation of the middle ground, not interpretation in a
    generic sense, brings the most productive approach to evidence from the Hellenistic
    Far East.


    # FUTURE DIRECTIONS


    Most of the buildings, artifacts, and texts discussed in this volume have come
    to light only within the last half-century, many only within the last decade.
    It is perhaps naive, or even unethical—given the provenance of many important
    pieces on the antiquities market—to hope that more material will soon come to
    light. Without a site such as Ai Khanoum, we know little about the material culture
    of the Greco-Bactrian kingdom and still rely on the numismatic record and on the
    few mentions of the kingdom in Greek, Roman, and Chinese historical accounts.
    I hope to have demonstrated in the preceding chapters that much useful information
    can be derived from the traditional sources, even on such unlikely topics as interaction
    between mobile and settled populations.


    Beyond the Bactrian cultural seine, the material from the Hellenistic Far East
    has a wider relevance. Throughout this book, I have quoted from the work of the
    modern Alexandrian Greek poet Constantine P. Cavafy. For those with a taste for
    comparisons between the ancient and the modern world—as Cavafy had—the


