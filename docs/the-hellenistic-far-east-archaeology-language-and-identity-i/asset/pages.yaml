    # AI KHANOUM AND EASTERN BRACTRIA


    Ai Khanoum occupies a special place in the historiography of the Hellenistic Far
    East, as the first major archaeological site to offer a look at the architecture,
    material culture, and wider urban landscape of an actual Graeco- Bactrian community.
    Its supposed Greekness (See the introduction.) has given it a certain celebrity,
    but this celebrity—as an anomaly, a remarkable and exotic “out-post of Hellenism”—has
    not necessarily led to wider, deeper discussions of the site in the classical
    or archaeological literature. Part of the aim of the previous chapter has to situate
    Ai Khanoum in its geographical and chronological context, as the latest in a long
    series of settlements that allowed external powers to control the resources of
    eastern Bractria. My intention in what follows is to provide a further level of
    contextualization—that of the institutions of Ai Khanoum within their urban setting—but
    also to provide a detailed description of the architecture, inscriptions, and
    material culture of the site, something that those unfamiliar with the site and
    its literature may use to orient themselves and direct further research.


