  md: 'AI KHANOUM 95


    The curious lack of substantial reoccupation of the site may also be in large
    part have to do with reasons connected with water or with the lack of a strong
    central power to control and manage water: the destruction or neglect of the city''s
    main canal, and in much more recent times, conditions favorable to the breeding
    of mosquitoes and as a result endemic malaria.¹150


    The position of the main canal, by the base of the acropolis, meant that it became
    something of a water feature in the theater. In earlier phases, it ran right across
    the curved side, crossed by little footbridges to reach the aisles of the seating-area.¹151
    Other facilities were less decorative: the great court of the palace had an extensive
    drainage system and open-air basins to catch runoff from the tiled roofs. This
    water was then channeled out of the courtyard in pipes, including one that ran
    across the treasury building.¹152 Lack of such drainage facilities may be used
    to argue that particular areas were flooded.¹153


    Bathing have been identified at several places throughout the city. The most common
    layout was a suite of two or three adjoining rooms, with pebble-lined floors tilted
    at an angle for better drainage, and with channels and drains. These were often
    adjacent to kitchen facilities and shared a common heat source or their own hearth.
    Baths were located in all the city''s residential buildings, whether independent
    or part of larger complexes.¹154 Most of the pebble-mosaic floors bore no distinct
    pattern, with the exception of the bath in the inner residential-unit of the palace,
    which had mosaics with abstract figures (a star), floral patterns, and marine
    creatures.¹155 The use of this technique, in which designs are picked out in white
    pebbles against a field of dark ones, is viewed by some as another instance of
    the material culture in a period when monastics in the Mediterranean world had
    come to use the technique of square-cut tesserae.¹156 Although such conservatism
    would be in keeping with interpretations of the sculpture from the site as classicizing,
    practical reasons should also be noted: the ready availability of river pebbles
    and a possible lack of direct contact or knowledge of evolving Greek techniques.
