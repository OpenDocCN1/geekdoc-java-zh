    The Greek question has dominated much of my discussion in the preceding chapters.
    I have sought to differentiate between the use of practices and material of ultimately
    Greek origin and the active assertion of a Greek identity. We may also make the
    point that people may feel and prove themselves to be Greek without this claim
    being recognized by others—as in the case of Cavafy’s Libyan prince who goes about
    Alexandria in constant fear that his poor command of the Greek language, thus
    his claim to a Greek identity, be exposed. I have also suggested that Greek and
    non-Greek are not always the most important divisions in our evidence, especially
    in the analysis of material from a single site such as Ai Khanoum. For this, a
    wider perspective—geographically and historically—is necessary.


    # THE LONG DURÉE


    My emphasis in chapters 1 and 4 was on the durée de Bactrian history, on the long
    process of development and evolution of society and administrative organization
    that accompanied apparently dramatic ruptures in Bactria’s government. Thus, the
    incoming Greek regime did little, at least initially, to change an Achaemenid
    administration that had proved effective managing the population and their affairs,
    and maximizing revenue from the land. Continuity in administration and management
    of resources can be a deliberate strategy as well the result of a laissez-faire
    approach. The Achaemenid blend underlying the administration and economy of other
    Hellenistic kingdoms, at least in the early years of the new order, has increasingly
    been recognized in scholarship, as I discussed in chapter 1.


    After the period of Graeco-Bactrian rule, there also appears to have been some
    administrative continuity. The Greek language continued to be used as the main
    written medium until it was replaced by a deliberate policy of the Kushan Kiska
    the Great in the first half of the second century C.E.³ Bactrian, however, was
    itself written in a modified form of the Greek script. In other regions, in the
    short term at least, an existing Greek administration and administrative titles
    were preserved. This is true for the Swat Valley, in Gandhara, where the Greek
    titles *strategos* and *meridarchos* in some texts of the late centuries B.C.E.
    and early centuries C.E.


