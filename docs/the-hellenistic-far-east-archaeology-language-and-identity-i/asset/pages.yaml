    # TEMPLES AND RELIGIOUS LIFE


    The temples and dedicatory inscriptions of Ai Khanoum have perhaps attracted more
    scholarly attention than any other feature of the site. My focus here will be
    seeing how we provide an overall, integrated picture of the religious life of
    the city; by setting straight common assumptions about the gods worshipped at
    Ai Khanoum, and on integrating the religious features of the city better into
    its urban landscape. Religion cannot, of course, be separated from other practices:
    the intramural and extramural burial places have already been discussed, and a
    dedicatory inscription in the gymnasium, to Hermes and Heracles, will deal with
    it in the next section.


    Three structures at Ai Khanoum have been identified as site of formal religious
    cult: a temple in a walled enclosure, accessed off the main street in the lower
    city; another temple by the side of the road where it leaves the walled city to
    the north; and an open-air raised podium on the acropolis.⁸ non-Greek characteristics
    of these structures and many of the artifacts recovered from them is striking
    and raises numerous questions about the cultural identity of the people who used
    them. Yet, as I will argue, the nature and diversity of cult practice within these
    religious institutions is possible through the conventional dichotomy of Greek
    versus non-Greek. The main temple, so-called Temple with Indented Niches, and
    its sanctuary constitute one of the most strikingly non-Greek sections of the
    city.¹⁹


