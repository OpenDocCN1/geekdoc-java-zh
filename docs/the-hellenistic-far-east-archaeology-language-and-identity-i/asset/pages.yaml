    # MOBILITY


    The Graeco-Bactrian expansion into northwestern India was followed within a few
    decades by the loss of the kingdom''s Bactrian heartland. The world of Heliodoros
    and his king was that of the Indian subcontinent, and whatever diplomatic, commercial,
    or cultural contacts the Greeks of Bactria had maintained with the other Hellenistic
    states were now effectively impeded by the intervening Parthian empire and various
    nomadic confederacies. In the first century C.E., the author of the Periplus of
    the Erythraean Sea, a practical manual to "the present day ancient drachmas [from
    Bactria] are current in Barygaza [on the northwestern coast of India] ... bearing
    inscriptions in Greek letters and the devices of those who reigned after Alexander,
    Apollodotus, and Menander." But by this period the Indo-Greek states had to be
    politically independent and culturally distinct entities.


    The sudden decline and fall of the Graeco-Bactrian state was precipitated by forces
    both within and without the kingdom². The Indian conquests had evidently offered
    opportunities for ambitious men to advance themselves. Eukrates was, according
    to Justin''s Epitome of Pompeius Trogus, murdered by his own son, but we also
    find "new men," as the great Menander," whose connection to


