    from the Near East. Inside, an anamber led back to a tripartite cell. Within the
    enclosure wall, the sanctuary contained two smaller chapels. Both are on a plan
    that may verify more recognizable Greek, with columned vestibules. A number of
    different artistic styles occur in the equipment from the temple, ranging from
    ivory furniture in a Greek or Hellenistic style to objects in which Persian or
    Central Asian motifs are present. Although it is worth noting that all the raw
    materials would have been available to local craftsmen, two examples of plaster
    moldings demonstrate one mechanism by which motifs may have been propagated over
    a long distance in the Hellenistic world: a rare point of access to the ways in
    which ideas and artistic forms may have been physically transmitted.¹100


    Analysis of the temple sanctuary, of the objects of worship, and the activities
    conducted in it is complicated by the fact that the spatial distribution of the
    objects found in the temple and in its sanctuary was created largely by the occupants
    of the city for their “fall,” around 145 B.C.E.¹101 It is possible, however, that
    some items were neglected for their lack of obvious value (as compared with, for
    example, metals and precious stones) and left in situ: that the northeastern part
    of the sanctuary may include the ivory furniture in the temple building and small
    limestone pedestals that may have served as altars or provided supports for burners.¹102


    Most discussion of the temple centers around two related problems: the identification
    of the main cult deity and the origins of the architectural form of the shrine
    itself. As indicated by the limestone pedestals, a number of cultic activity took
    place within the sanctuary. At the rear of the temple platform, ceramic vessels
    were used to make libations to the earth. The remains of stucco and clay sculptures
    of human figures, larger than life-size, were found in the vestibule; these may
    represent absent objects of worship or simply depict donors or royal figures.¹103
    In the southern sanctuary of the tripartite shrine, a medallion depicting the
    goddess Cybele was caught between two jars: it shows signs of having been violently
    torn off an original wooden support.¹104 The only indication of the image that
    occupied the central chamber of the inner shrine, however, comes


