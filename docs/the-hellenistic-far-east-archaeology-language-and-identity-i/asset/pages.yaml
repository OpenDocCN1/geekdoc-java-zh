    may say that this behavior was not ethnically marked but a "default setting,"
    a common practice of worship not held to have any ethnic weight. It is possible,
    of course, to read a measure of cultural insecurity to recognize that our sensitivity
    to things as artistic style or religious practice may introduce a conflict between
    culture, political status, and ethnic identity where the agents themselves may
    have perceived.


