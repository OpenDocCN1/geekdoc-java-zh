  md: '# 74 AI KHANOUM


    ... speak well of everyone; a leader of wisdom. . . .


    These wise sayings of men old, the maxims of renowned men, are enshrined in the
    holy Pytho [i.e., at Delphi]. There Klearchos copied them conscientiously, and
    he set them up in the sanctuary of Kineas, blazing from afar.


    As a child, well behaved; as a young man, self-controlled; in middle age, be just
    as an elder, be of good counsel; and when you come to the end, without grief.


    The vault beneath the shrine contained several burials in sarcophagi, one of which
    had provisions for liquid offerings to be made from the room above, through a
    conduit, directly into the coffin—which we may suppose to be of Kineas of the
    inscription. The early date of the shrine have been traced back to the late fourth
    century⁵⁶ and its veneration of a named figure within the city walls that Kineas
    was regarded as the founder of the Greek city of Ai Khanoum. The positioning of
    the vault''s additional burials indicates that they belonged to different phases
    of the shrine''s construction⁵⁷ successive generations of a family or, alternatively,
    series of magistrates or high officials, successors in a different sense to Kineas?
    In addition to libations from the chamber above the burial vault, in Phase III
    of the structure the northern and western outer walls of the shrine had two long
    niches, perches for additional offerings.⁵⁸ These would have been clearly visible
    from both arms of the street leading to the palace court-yard.


    The connection to a wider Greek world that the inscription claims, or that it
    aspires, through the reference to the Delphic maxims has naturally provoked much
    comment. The inscription is one of several features—the gymnasium and theater,
