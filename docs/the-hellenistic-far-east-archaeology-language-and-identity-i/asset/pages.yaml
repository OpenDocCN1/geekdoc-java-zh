  md: '# APPENDIX 193


    καὶ τοῦ ἀάνγόντος σήμερον

    παρά θέφ Μάνδουλι.


    (Acrostic: Paccius)

    All times I celebrate you, son of Leto, Pythian Apollo,

    Guide of the immortals and Paean of the golden lyre.

    For I have come before your gates. Give me,

    Lord, get successes in the army.

    For if you give me, I will give you libations,

    Such as due to a great god and to Isis the queen.

    I will always make libations both for these successes.

    To find out the name of the one who wrote this,

    Count two times two hundred and twenty-one.

    Act of dedication for the one who wrote it

    And for the one who recognizes the sign

    For the god Mandoulis.


