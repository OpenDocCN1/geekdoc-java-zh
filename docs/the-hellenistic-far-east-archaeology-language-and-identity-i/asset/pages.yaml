  md: 'tially) to limit political resistance. Maintaining the existing bureaucracy,
    and keeping-on the staff to run it, is not “lazy imperialism”—however calculating
    the laissez-faire attitude of its practitioners or may not have been—but a sound
    political and economic strategy. Crucially for the present study, however, such
    administrative continuity may mean that control and exploitation of a territory
    by an external power is less visible in the archaeological and documentary records
    than may be supposed.


    Although I will introduce material—in particular the archaeological field survey
    of eastern Bactria—from the Bronze Age to the Kushan empire, my focus will be
    on the periods of Persian control in the region, under the Achaemenid, and of
    Greek control, under both the external authority of Alexander the Great and his
    Seleucid successors, and the local control of subsequent independent Graeco-Bactrian
    dynasties. This corresponds to the later part of the eastern Bactrian Iron Age,
    from 800 B.C.E. to the conquest of the region by Alexander the Great in 330–329
    B.C.E., and the Hellenistic period, which in Bactria effectively ends with the
    northern invasions of the mid-second century B.C.E. The new data from the documentary
    texts now allow us to revisit and reign long-standing debates about the nature
    of the Achaemenid and Hellenistic empire in Bactria. On one side of this debate
    have traditionally been the archaeologists (and in particular Jean-Claude Gardin),
    who emphasize the lack of any break in the archaeological record corresponding
    to an Achaemenid state intervention in the socioeconomic affairs of Bactria. On
    the other side stand Pierre Briant, who draws on historical textual evidence for
    substantial Achaemenid state and for the management of resources and resource-gathering
    systems like irrigation. Resolving this debate is not a matter of simple compromise:
    archaeological and historical sources each obscure some aspect of the “true picture”
    of Achaemenid Bactria. This historical sources, for example, make no mention of
    the region’s impressive irrigation works. The new documentary texts now also make
    clear that the picture of continuity in material culture observes the very real
    and effective mechanisms of Achaemenid imperial control.


