  md: '# INTRODUCTION 17


    The reason the French were granted the archaeological concession in Afghanistan
    was largely a reaction against British dominance in the region. In May 1919, Afghanistan,
    under the emir Amanullah Khan (1892–1960); reigned 1919–29), launched a surprise
    attack against the British in India; and in August, thanks in part to British
    preoccupations in Europe at the aftermath of World War I, managed to negotiate
    the Treaty of Rawalpindi, which granted Afghanistan autonomy in matters of foreign
    affairs. The aim was keen to demonstrate Afghan independence from both Britain
    and Russia. Amanullah actively solicited foreign aid and cooperation, and his
    overtures were responded to with enthusiasm. Germany, Turkey, and Italy—but especially
    France—were among the counts that took an interest in Afghanistan in this period,
    providing aid, investment, training, and expertise. Amanullah’s drive toward modernization,
    Westernization, and secularization was commented upon favorably in the European
    press. The creation of the DAFA must be seen in this context.¹⁰ The convention
    was initiated by the Afghans and negotiated as part of a package that included
    the opening of a permanent French diplomatic mission and a French school in Kabul,
    the École Amanya (later the Lycée Esteqlal). The archaeologist Boucher and his
    wife and collaborator Eugénie Bazin-Foucher, in fact, arrived before the diplomats—or
    themselves constituted the first diplomatic mission. Boucher’s reports back to
    the French Ministry of Foreign Affairs were concerned with diplomatic as much
    as with scientific matters.¹¹ Given the sensitivity of the situation, the Fouchers
    endeav to travel from India to Afghanistan via Iran, in secret, in order to avoid
    exciting British suspicion.⁶²


    The archaeological convention of 1922 gave the DAFA exclusive rights to excavate
    in Afghanistan for thirty years and established provisions for the sharing of
    finds between Afghanistan and France. The monopoly was insisted upon by the Afghan
    and French governments and not by the French archaeologists. Boucher had, indeed,
    hoped for international collaboration, intending to bring the British-Hungarian
    archaeologist Aurel Stein to excavate at Bactra and the Ernst Herzfeld to work⁶³
    Stein had been trying unsuccessfully to visit Bactra for most of his long career.
    French diplomatic and archaeological ventures in Afghanistan proved an attractive
    subject for the popular press. In May 1923, L’Excelsior, an illustrated daily
    newspaper, carried an article reporting that “un français, M. Foucher, est chargé
    dépérer des feuilles de l''Afghanistan.”⁶⁴


