    and its other neighbors, the peoples of the steppe and pastoral nomadic groups
    in the immediate hinterland of the settled river val- les of Bactria-Sogdiana.
    Like Bactria links to the Near East, these connections are crucial to understanding
    the region''s internal affairs.


    The field-study, as already noted, gives a valuable perspective on the longue
    durée in Bactria. The surviving documentary evidence in Aramaic, on the other
    hand, happens to cover an especially interesting microperiod in the admin- istrative
    history of Bactria, the transition from Achaemenid to Greco-Macedonian control.
    This provides an intimate perspective on a phenomenon widely attested throughout
    the Hellenistic world, the retention of the existing Achaemae- nid bureaucracy
    as a foundation for the administrative structures of the new Hellenistic states.12
    It has frequently been argued, was the "last of the Achaemenids"; the Seleucid
    empire, too, "in its origin and its constituent elements, was a branch grafted
    directly onto Achaemenid stock."13 The Seleucid empire provides more copious evidence
    for exploring such questions of admin-strative continuity.14 Even allowing for
    the different types of evidence available for the two periods (primarily the Persepolis
    fortification tablets for the Achaemenid administration and Greek documents from
    the Seleucid), there is, as may be anticip-ated, much similarity between the two
    systems. Evidence from Bactria may be more limited, but my conclusions are essentially
    the same.


