  md: '# GREEK LITERARY AND INTELLECTUAL CULTURE


    The written material from Ai Khanoum—inscriptions and documentary texts—provide
    the greatest insights into the cultural life of the city, and it is furthermore
    possible to contextualize this material within the urban landscape. The palace
    treasury contained a small library. The gymnasium, a quintessentially Greek cultural
    and civic institution, also served as a focus for intellectual activities. And
    the city also boasted a larger theater, in classic Greek semicircular form, set
    into the side of the acropolis.


    Room 107 of the treasury was the findspot of the only Greek literary texts preserved
    in the city.¹125 A philosophical dialogue, originally written on papyrus, was
    preserved in the form of an ink imprint on tied open earth.¹126 Two fragments
    of a text on parchment were also recovered. Little text was preserved, but what
    there was, was enough to indicate that it was composed in iambic meters and to
    suggest identification as a dramatic text.


    This dramatic text is one of several indicators that Greek drama was performed
    at Ai Khanoum. One of the spouts from the fountain in the western Oxus wall was
    in the form of a comic mask, pouring through its open mouth.¹127 The theater was
    set into the side of the acropolis, but enough has been excavated to reveal a
    typical Greek theater form, with tiered rows of seats, a semicircular orchestra,
    and a stage with a backdrop gloomy. Many of the institutions could seat around
    six thousand people, more than can possibly have lived within the city itself.
    It therefore served a population in the wider region, and may have served as a
    venue for periodic festivals.


    The gymnasium stood immediately inside the western Oxus wall, separated by a street.¹12⁹
    Its position in the city’s urban schema and its connections to other complexes
    are not entirely clear, and in particular little is known about the areas immediately
    to the north and east of the gymnasium complex. The road inside the western wall
    connected it to districts to the north and south. It is difficult to establish
    the precise relationship of the gymnasium to the pool enclosure. There is no direct
    connection between them—although a person might pass between them indirectly,
    from the southern door of the gymnasium to the western entrance of the pool enclosure—and
    are oriented along different axes. Their proximity and the lack of bathing facilities
    in the latest phase of the gymnasium imply some connection¹¹⁰.


