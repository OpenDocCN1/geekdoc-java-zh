  md: '# CONCLUSION


    Other postcolonial memes, although they can generate productive approaches to
    our evidence, also require to be situated historically. Richard White’s “middle
    ground,” for example, originated as a literal description of a geographical territory
    in which Native Americans and European settlers interacted and by metaphorical
    extension the creative dialogue instigated in this limited space.^27 The middle
    ground’s further metaphorical extension to refer to zones of cultural interaction
    in general was not something intended in White’s original thesis, but this fact
    does not invalidate the uses to which it has been put in other historical contexts.^28
    The point, once again, is that theoretical evolution and reinterpretation do not
    invalidate a concept where it is found to be useful or evocative in ways beyond
    its original formulation. Tracing this evolution, however, may be extremely useful
    in allowing us to identify which aspects of the theory in question are historically
    contingent.


    The archaeology of the Hellenistic Far East has thus far attracted very limited
    analysis in the kinds of postcolonial theoretical views outlined above. Investigating
    such analysis to be an important part of bringing the region into closer dialogue
    with scholarship on other regions of the Hellenistic world and, indeed, neighboring
    regions of South and East Asia.^29


    What can the evidence considered in the preceding chapters bring to such debates?
    First, as we have already noted, we should be cautious in how we lift terminology
    from postcolonial studies, and cultural studies more. Hybridity in many cases
    means something closer to the biological metaphor—of the mixing of two cultures
    to create a new one—in classical studies than it does to postcolonial hybridity,
    in addition to the discourse that arises from cultural contact and the further
    political implications of this discourse. The Hellenistic Far East, despite the
    architectural mélange that is Ai Khounam and the mixed signals given out by the
    inscriptions of Sophyitos, is not hidden in the latter sense. A self-reflective
