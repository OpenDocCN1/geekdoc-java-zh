- pgno: 86
  md: 'courtyard and an attached building, divided up into blocks that had different
    functions: offices and meeting rooms, residential units, baths, and the treasury,
    which was discussed in chapter 1. The central question is what type of administrative
    or political authority this housed: a palace on an Achaemenid or Hellenistic model,
    which was the seat of a representative of royal authority, or a more neutral administrative
    quarter, whose functions and functionaries we cannot identify with. I argue for
    the former, on the basis of distinctive features and potential analogies to outlined
    below. There is, furthermore, much to be gained from considering the whole quarter
    before the propylaea—palace, treasury, gymnasium, open-air pool—as a single supercomplex.
    Although, as will be discussed, the palace complex Ai Khanum shows many features
    and functions with various Achaemenid and Hellenistic places; there are also elements
    that are quintessential outside Graeco-Bactrian. One of the most important of
    these is the use of peripheral corridors to isolate individuals of a building
    from each other. This was a distinctive feature of local Hellenistic-Bactrian
    architecture, which can be seen also from the houses inside and outside Ai Khanum,
    to a lesser extent in another structure excavated at Saksanokhur, a site to the
    north of the Oxus.


    In its construction materials and provision for climatic conditions, the Ai Khanum
    palace is very much a building of Central Asia.27 The walls were preserved in
    places up to a height of two to three meters. Construction was predominantly in
    raw mud-brick, with more sparing of baked brick (especially for elements such
    as the foundations of walls) and very little stone (a soft white limestone) for
    stone items such as columns, door thresholds, and the foundations of some walls.
    Stone was not available locally, but there were several possible quarries upriver
    from several places which could have been transported by water.28 Wood, which
    was found carbonized by fire in several places, was used as an inner support for
    walls (and also for clay and stucco statuary) and for roof beams. Roofs were tiled,
    with different styles of antefixes in shapes as palmettes. The orientation of
    the courtyards of various structures—the palace and the houses—was dictated by
    the climate, to turn backs rain-bearing winds coming from the southwest. In the
    palace, where the rooms of the interior were lit by windows in the walls, orientation
    may also have been influenced by a desire to catch the sunlight at different times
    of day. A drainage system, with pipes and open-air basins, took water from the
    main court and carried out toward the river through a channel among others.29


