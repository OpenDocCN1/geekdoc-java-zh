    The picture I have sketched in this chapter is one of long-term political and
    cultural change within a dynamic zone of nomad-settled interaction in Central
    Asia. There were times and places where relations within this symbiosis were broken
    down or deliberately altered by the actions or policies of the settled states
    of Bactria and China, and by mobility of groups both from outside the wished zone
    and from within. In the mid-second century B.C.E., a long-distance domino effect
    of population movement from the borders of China southward and eastward into Central
    Asia contributed toward the collapse of the Greek state in the Oxus Basin.


    The archaeological and textual data sets this period tell us slightly different
    things, both of great historical and cultural significance: the general trend
    of population movements and military expansions as revealed by changes in material
    culture and in the construction and destruction of defenses, and how these impacted
    on and were perceived by surrounding regions. The Chinese and Greco-Bactrian historical
    stories, as it happens, give us more nuanced data on nomad lifestyles and settled-interaction
    in Central Asia than may be assumed. Some historians both ancient and modern (Strabo
    is the worst offender) fall back on the cliché of the settled Greek civilization
    of Bactria overrun by nomadic hordes, but others, including Justin and Sima Qian,
    recognize the true complexity of the situation. Although incursions from Central
    Asia had a devastating impact on Bactria, the historical and archaeological evidence
    reveals that there was no single, sudden, nomadic invasion. Under the impact of
    a long series of such incursions, crippling wars with Parthia, and interdynastic
    fighting in Bactria and India, it still took Bactria some time to slowly bleed
    to death.


