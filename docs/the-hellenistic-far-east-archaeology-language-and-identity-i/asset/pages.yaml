    # IDENTITIES


    In the archaeological and textual evidence that I have discussed in the preceding
    chapters, it is difficult to pick out individual histories. Although we know the
    names of a small number of the inhabitants of Ai Khanoum, we know little about
    their personal, social identities. At a community level, I have argued that categories
    of Greek and non-Greek are not necessarily helpful. A building’s architectural
    form and the motifs with which it is decorated may visibly derive from the traditions
    of a particular culture or geographical region, but we can presuppose that nothing
    of the personal, self-scribed identities of those who frequented, nor of the cultural
    and political capital with which they invested any particular institution and
    the activities that took place within.


    To ask whether one inhabitant of Ai Khanoum was a Greek is an even thornier matter
    than may at first appear. The question, “Was this person a Greek?” or “How Greek
