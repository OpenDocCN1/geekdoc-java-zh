    handbook of Indian epigraphy is highly recommended.54


    The inscription appears on a pillar of pinkish brown sandstone with a bell-shaped
    capital, the first report of which was published by Sir Alexander Cunningham,
    founder of the Archaeological Survey of India, in 1880.55 The inscription initially
    went unnoted, since at the time of Cunningham''s inspection the pillar was still
    much an object of cult and pilgrimage—56 The column shaft had been sheared by
    pilgrims with a thick coating of vermillion. Cunningham was unable to examine
    further and reluctantly restricted himself to recording the report of local people
    who were uninitiated. Marshall, in 1909, was the first to record the translation
    and translation gave an initial translation by Jules Block in the same publication.57
    The inscribed area of the main inscription (A) is approximately fifty-six centimeters
    by fifty-two centimeters. A briefer inscription (B) appears on the opposite side
    of the pillar. The script is Brahmi of the Śūnga period, and the language is central-western
    epigraphic Prakṛt, with some Sanskrit spellings. Inscription B may be in verse.58
