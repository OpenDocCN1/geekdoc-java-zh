  md: '# CONCLUSION


    social bases of ethnic belonging in the Hellenistic East with any thoroughness,
    but with the evidence that we have a certain amount can already be done.


    # CULTURE AND EDUCATION


    Whichever cultural traits and models were invested with ethnic significance in
    the Hellenistic East, individuals might have acquired these somehow: in childhood
    from their families, through education or through acquisition later in life. Examples
    from elsewhere in the Hellenistic world show us some of the mechanisms by which
    people and communities incorporated new practices into an old identity that they
    considered to remain unchanged.


    The Homeric flourishes given by Sophyrus to his verse inscription indicate that
    he had received the same kind of Greek education as students elsewhere in the
    Hellenistic world. Homer was far by the most commonly read and taught author at
    all levels of Greek education in Egypt, can be seen from surviving papyri.¹ The
    philosophical and dramatic texts from Ai Khanum, as well as the sundials in the
    gymnasium and the theater, also show that some of the city''s inhabitants were
    both practitioners and consumers of Greek culture. So education and participation
    in cultural activities was one way in which a Greek identity might be included
    or maintained—although Plutarch''s assertion “when Alexander was colonizing Asia,
    and the children of the Persians, of the Susians, and of the Gedrosians learned
    to sing the tragedies of Sophocles and Euripides”² is perhaps something of an
    overstatement.


    Did a Greek education or attendance at the theater or gymnasium make a person
    Greek, by their, or their community''s, own definition? In the preceding discussion,
    I indicated that this was not necessarily so. But it is also important to emphasize
    the agency of individuals and communities in adopting the trappings of Greek culture,
    the reasons that they may have for doing so, and the ways in which this might
    be perceived by outsiders and by their own neighbors. The second book of Maccabees
    recounts how in 175 B.C.E. Jason, the Jewish high priest, established a gymnasium
    and and enrolled the enrolled of Jerusalem as citizens of a new Antioch.³ He encouraged
    his fellow Jews to adopt a Greek way of life in other areas, such as dress and
    participation in athletics, and to neglect sacrifices. This brought Greek criticism
    and resentment—although it was another Hellenized Jew, Menelaos, who eventually
    deposed him as high priest. He died in exile in Greece. The example of Jason,
    the holder of a high office, shows that Greek culture could be adopted by individuals
    who in other respects adhered


