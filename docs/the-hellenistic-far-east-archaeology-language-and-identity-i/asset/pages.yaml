- pgno: 26
  md: '# INTRODUCTION


    # IDENTITY


    The region comprising Afghanistan, Central Asia, and the northwestern Indian subcontinent
    in antiquity was ethnically and culturally diverse. Greek settlers were only the
    latest addition to an already heterogeneous population, which spoke many languages
    and practiced a variety of religions. The annexation of the region by a foreign
    king, Alexander the Great, was also, in a way, nothing new. It had previously
    been ruled by Persia as part of the Achaemenid empire. What is novel and exciting
    about the history of the territory taken over by Alexander, from the late fourth
    century B.C.E. is the dynamic interaction we can see between the new Greek immigrant
    community and their neighbors. This interaction is visible in architecture and
    material culture at sites such as Ai Khanoum. Documents written on animal skin
    and on potsherds, recovered from excavations or on the antiquities market, also
    provide us with insights into administrative structures and ethnic landscapes.
    The ethnic and cultural diversity of the region, in short, becomes very visible
    in our evidence from Hellenistic Central Asia and northwestern India—and much
    of this archaeological and documentary evidence has become known to scholarship
    only recently.


    I use the word "Greek" in my title, although "Greek," as will become, is not a
    term I would apply to any individuals, communities, inscriptions, or archaeological
    material discussed in this book without prophylactic commas. The "Greek question
    is one that has dominated scholarly debates on the Hellenistic Far East, as the
    wider Hellenistic world. Here Greek, in culture, language, and identity (not to
    genetics) were the new kingdoms left in the wake of Alexander the Great’s campaigns?
    Does the use of Greek as an administrative language and a more general franca
    indicate that it held cultural and political dominance, and that individuals may
    have sought to associate themselves with it for this reason?


    I opened this chapter with a poem by Cavafy, a Greek from Egyptian Alexandria,
    writing at a time when the city still had much of the ethnic and linguistic diversity
    of the Hellenistic metropolis. As a Greek of the diaspora, Cavafy becomes emotional
    when he recognizes familiar Greek names in Indo-Greek coins.⁶ Cavafy, many modern
    scholars have struggled to reconcile the Greek and the non-Greek side of the peoples
    and states of the Hellenistic Far East. I view the region as part of a wider Hellenistic
    world, concepts and theories that have allowed us to develop more productive approaches
    to culture and identity in other Hellenistic states are equally applicable to
    Bactria and the East.²⁷


