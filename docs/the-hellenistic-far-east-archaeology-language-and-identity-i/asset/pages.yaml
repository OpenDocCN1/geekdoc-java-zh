  md: 'were covered in painted daub, with geometric designs in red, yellow, and white,
    with black lines and dots against a lighter background.


    Behind the iwan and the first main hall, the architectural plan of the building
    becomes increasingly complex and sophisticated. This complexity is not the product
    of a gradual, unplanned evolution in the building''s form but is a deliberately
    organized architectural scheme, implemented in the renovation program of the last
    phase of Ai Khanoum. This plan is characterized by a network of long corridors
    that isolate units from each other. Doors between corridors and rooms are almost
    always offset, so that there are direct access—direct lines of movement—outside
    the corridors themselves, and even where there are no remains of an actual door,
    access was direct. The columned iwan (2) and hall (3) are themselves separated
    by a large door with a stone threshold, with cavities in the masonry whereby the
    mechanism of a wooden door would have been fitted. Some pieces of ivory were found
    in the vicinity, indicating that the daub was decorated with this material.³35
    These between units and corridors were very real points of restriction, which
    could be locked rather than just closed.³36


    The internal configuration of the innermost area of the palace is that it is divided
    into four units: two apparently official, for reception or administration, and
    two residential. Beyond the iwan and main hall—but not in direct communication
    with them—is a square block composed of two nearly identical pairs of units, separated
    by a cross-shaped corridor. The block would be isolated from its peripheral corridors
    by wooden doors with stone thresholds.³37 Each of these units contained a reception
    unit to the east (identified by the size of the rooms and their fine decoration)
    with one large room and two or more antechambers, and to the west an an“office
    unit” with a smaller central room and greater number of subsidiary chambers. Each
    unit had a vestibule with a hearth for heating.³38 The units nestled like Russian
    dolls within their peripheral corridors. To get from the main hall behind the
    iwan to the (spatially very close) reception rooms, a person would have to cross
    fewer than three of its isolating corridors.


    The main rooms (6 and 9) of the reception units were decorated with stucco and
    clay statues on worm armature, in room 9 at least fifteen human figures in room
    6 or more human figures, two to three times life-size, as well as a horse. The
    colors are vividly preserved on some fragments of these statues: vermillion, pale
    pink, brown-black, and a golden yellowish-


