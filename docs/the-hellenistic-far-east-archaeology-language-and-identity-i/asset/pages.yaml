  md: '128 THE INSCRIPTIONS OF SŌPHYTOS HELIODOROS


    How may Heliosodor have regarded Vasudeva and his own attachment to his cult?
    The Greeks with Alexander, and later Megasthenes, identified Indian cults with
    those of Herakles and Dionysos,¹⁰⁷ and it has been argued that Megasthenes "Indian
    Herakles" was in fact Vasudeva-Kṛṣna.¹¹⁰⁸ Syncretism, both theoretical and practical,
    was a common phenomenon in Hellenistic culture, a way of making sense of coexisting
    Greek and non-Greek gods or of driving home a political message. "Heliodora" had
    made a Greek dedication as Heliosodor, might have referred his chosen deity by
    a Greek name, or translated the god''s Indian name into Greek letters? I suggest,
    rather, that this simply not have been an occasion to make a Greek inscription
    at all. Earlier Greek commentators made equations between Greek and Indian gods,
    but there is no need to assume that those of Greek descent living in India in
    the second century b.C.E. did. The issue is that of familiarity. Just as the brahmanai
    and srameni of the Aṣokan edicts required no Greek translation for the Greeks
    of third-century Kandahar, Heliosodor and his community, for whom the Indian culture
    evidently bore some relation to their own identity, may felt no need to rationalize
    a local god into the framework of Greek religion.¹¹⁰ If this was the case, then
    the official status of Indian cults (not just appearing on coins for the benefit
    of a native Indian constituency but patronized also by Greeks) might suggest a
    contrast with the case in third-century Bactria, where the existence of a complicated
    reality (for example, in the temples of Ai Khananum) contrasts with an official,
    civic identity, on coins and public inscriptions, which is entirely Greek.


    # GREEKS AND THEIR STATUS IN SECOND-CENTURY-B.C.E. INDIA


    Heliosodor is described as a yavana (Sanskrit yavana). The term, especially in
    later periods, came to be a generic term for foreigners from the West¹¹ but its
    original derivation is from the word Ion, "Ionian," the word for "Greek" in many
    Indo-Aryan and Afro-Asiatic languages.¹¹¹ In the inscription of Heliosodor, we
    may translate it "Greek."


