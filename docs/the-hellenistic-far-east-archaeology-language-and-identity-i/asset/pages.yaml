- pgno: 20
  md: 'It had long been known from brief references in the works of Greek and Roman
    historians that Greeks had settled in Central Asia in the aftermath of the campaigns
    of Alexander the Great, in the late fourth century B.C.E. The city that was being
    uncovered on the Oxus, however, was the first actual material remnant of such
    settlement to have revealed. Its local name was Ai Khanoum (“Lady Moon” in Uzbekistan).
    Adjacent to the shrine of Kineas and the gymnasium, Ai Khanoum contained a fine
    array of public buildings, some of them strikingly Greek in architecture, with
    other connections to the architecture of Central Asia and the Near East. Ai Khanoum
    has remained the most important source of evidence for the Greek settlers of Central
    Asia and their descendants, but important questions remain unanswered. Our impression
    of what gods did they worship, and what relationship did they consider themselves
    to be their Greek ancestral homeland?


    The territories with which this book will be concerned the easternmost regions
    crossed by Alexander the Great in his campaigns through the Persian empire, in
    the late fourth century B.C.E. These were Sogdia and Bactria in the north, now
    in what is Uzbekistan, Tajikistan, and northern Afghanistan: Arachosia, now southern
    Afghanistan and Gandhara, in today’s northwestern Pakistan. I will discuss some
    matter from other regions, in particular from Central India, where we have evidence
    of the presence of Greeks. The common history of these territories may a catchall
    term convenient, and I have chosen to use the “Hellenistic Far East,” which is
    imperfect but of reasonably common currency.


    The history of the Hellenistic Far East is known only in the broadest of outlines.
    In the 320s B.C.E., Alexander the Great left garrisons of Greek and Macedonian
    settlers across the territories Sogdiana to northwestern India. The whole region
    was inherited by his Seleucid successors, but Arachosia and the Indian territories
    were quickly lost to the Mauryan empire, and by the mid-third century B.C.E. Bactria
    was effectively independent under a local Greek dynasty, the Diootids. The Diotetids
    were overthrown by Euthydemos, whose independence the Seleucid king Antioch III
    was forced to confirm at the end of the third century. Euthydemos’s son Demetrius
    the realm fragmented into a large number of smaller kingdoms, ruled by kings who
    began to strike coins on one side and


