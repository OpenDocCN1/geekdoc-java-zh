  md: '# The City


    Ai Khanoum was built on an immense scale. Its main street, which runs along the
    foot of the "acropolis" or upper city, is around a kilometer and a half in length,
    and the longest of the city''s triangular site, along the northern fortification
    walls of the lower and upper city, stretches for two and a half kilometers. The
    level of the upper city was around sixty meters higher than the lower city. Its
    institutions, too, were built on a colossal scale, with a gymnasium whose two
    square courts had exterior sides around one hundred meters and a theater with
    a capacity of over six thousand spectators. Ai Khanoum''s latest Hellenistic phase,
    of the first half of the second century B.C.E., was the result of a major, centrally
    directed architectural program. Traces of the city''s earlier layout (or layouts),
    however, can be seen in places: most visibly in the slightly awward coexistence
    of two main axes, an original parallel to the main street, a later at an angle
    to this; and in the way which the main approach to the palace detours-off in order
    to avoid the shine of Kineas, one of the earliest structures in the city, the
    essential orientation and layout of which was not disturbed despite renovations.
    This city planning is also very visible in the regular, sized units of the southern
    residential quarter. Stone is used throughout the city. Unbaked brick is the predominant
    building material, with baked brick much in evidence. Constant renovations to
    the fortifications—necessitated not necessarily a military attack but by the weathering
    and wear to which raw brick architecture is vulnerable—also show the resources
    and planning that went into designing and maintaining the urban fabric of the
    city.


    Part of this planning was directed toward a functional zoning and architectural
    treatment of different districts. The most extensive and most integrated treatment
    of urban planning and zoning at Ai Khanoum remains, unfortunately, unpublished:
    Jean-Claude Liger''s maitrise thesis of 1979, submitted at the Université de Paris
    VIII.. Despite the fact that this thesis is not widely available, it is worth
    briefly summarizing (and giving credit to) its contents and major arguments. Particular
    interest is Liger''s view that the spatial arrangement of various institutions
    and the establishment of strict routes of circulation relate to some form of social
    or ethnic segregation, or perhaps analogous to that in more recent colonial contexts.
