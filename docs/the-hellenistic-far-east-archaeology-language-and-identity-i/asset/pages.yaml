  md: 'The Badakshan Mountains of eastern Bactria were the location of probably the
    only exploited source of lapis lazuli in the ancient world, as well as deposits
    of other minerals and precious stones. There does not appear to have been any
    archaeological investigation of the Badakshan mines to date, but their products
    appeared as far away as Egypt, as early as the Predynastic Period. At Shortugai,
    an outpost of the Indus civilization was established around 2200 B.C.E., evidently
    to control access to the Badakshan mineral resources. As well as serving as a
    center for management of this resource, Shortugai was also notable for the working
    of lapis. The treasury at the Hellenistic city of Ai Khanum contained some 75
    kilograms of unworked blocks of lapis at the time of its abandonment. The lap
    factor is therefore an important constant in the economic history of eastern Bactria.


    A combination of archaeological and written sources (both literary and documentary)
    make Bactria an excellent case study for looking at how an empire might manage
    a resource-rich region, though our knowledge of administrative systems must necessarily
    remain. Crucially, in order to effectively Bactria''s resources required concerted
    effort and the mobilization of substantial labor forces. The land had agricultural
    potential but required irrigation. Lapis had to be mined from deposits high in
    the Badakshan Mountains. Soldiers had to be recruited or conscripted, and elephants
    had to be acquired and transported. Although there are only a few excavated sites
    of the Achaemenid and Hellenistic periods, the extensive field-survey project
    conducted in eastern Bactria in the 1970s provides on settlement patterns and
    land use over a period of several millennia. More recently, a small number of
    administrative documents written on prepared skin emerged without secure provenance
    to the antiquities market. Three are in Greek and date to the late third or early
    second century B.C.E. A further group, deriving from a single archaeological context,
    are in Aramaic and cover the period of the end of Achaemenid rule in the region
    and the conquests of Alexander the Great.


    The sections that follow will discuss what these sources tell us about the organized
    exploitation of agricultural and other resources in Bactria by locally based apparatch
    working in the ultimate service of external imperial powers. The presence and
    efficacy of such administrative structures is manifested in sources both directly
    and indirectly—indirectly by the very existence of irrigation systems and operating
    mines that required collective effort, as might be made possible by a strong local
    administrative apparatus; and directly by the information contained in the documentary
    texts on revenue collection, pay


