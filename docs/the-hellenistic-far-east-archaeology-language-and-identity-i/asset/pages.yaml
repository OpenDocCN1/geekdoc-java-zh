- pgno: 22
  md: '# 4 INTRODUCTION


    record of the Hellenistic Far East is exotic in analysts'' constant confrontations
    with material that will be unfamiliar to them, whatever their scholarly training.
    Ai Khanoum is exotically, intrusively, Greek in its Central Asian location, but
    it is also exotically un-Greek in terms of much archaeological material recovered
    from it. It is not Athens, nor even Alexandria, Antioch, or Seleucia. The challenge
    with such material is beyond its exoticism—or to elucidate something of the social
    and cultural dynamics of the society that produced it, and to relate this situation
    in a meaningful way to its regional hinterland and contemporary states in the
    Near East and the Indian subcontinent. Material from the Hellenistic Far East
    may be novel and interesting, but what do we actually do with it?


    These are all questions that I shall explore in the following chapters. This book
    is not, however, intended to be a general or comprehensive history of the Hellenistic
    Far East, and there are many topics—perhaps even familiar to a general audience—that
    I will not cover. These include the campaigns of the Greek in the region, the
    Greek inscriptions of the Maurya emperor Asoka from Kandahar, questions of the
    Greco-Bactrian and Indo-Greek kingdoms, and questions of political and dyn history
    in general. I have selected my material in order to explore several broad research
    questions. In chapter 1, I ask how the Hellenistic Far East was administered by
    its rulers, and I discuss the evidence for continuity in administrative practices
    and before the period of Greek rule. Chapter 2 is devoted to a study of Ai Khanoum
    in which I try to view the city as a living, working community rather than an
    abstract collection of diverse architectural traits, and to contextualize it within
    the wider and longer-term evidence for urban settlement in Bactria. Two inscriptions,
    one by a Greek in Prākrit and the other by an Indian, are analyzed in chapter
    3. Both inscriptions raise questions about the attachment of individuals in the
    Hellenistic Far East to the Greek language and culture, and the types of identities
    that they might try to construct and assert on the basis of this attachment. In
    chapter 4, I return to archaeological evidence and to a *longue durée* approach,
    examining the period of the fall of Greco-Bactrian kingdom. Question the traditional
    viewpoint that the Greek “civilization” of Bactria was destroyed by “barbarian”
    nomadic invaders from the north.


    In this preamble, I aim to set the historiographical scope, to explain how we
    came to the textual and archaeological record that we do, and why this record
    has come to be viewed by scholars the source material available from the Hellenistic
    Far East, whether textual or archaeological; the ways in which current debates
    on culture and ethnicity in the ancient world


