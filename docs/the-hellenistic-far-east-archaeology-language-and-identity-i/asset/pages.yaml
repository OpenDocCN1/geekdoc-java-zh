  md: '# CONCLUSION 183


    already noted, although not a Greek name, was one that had been borne by an earlier
    dynast in the region.


    In the introduction, I introduced some key theoretical approaches to thinking
    about ethnic identity. An ethnic identity is a constructed identity, predicated
    upon the selective mobilization of cultural behavior and material culture in the
    construction of a group identity, in which the delineation of a boundary between
    one''s own group and others is an essential part of the process. What is important
    in the construction of an ethnic group and the maintenance of its boundaries is
    not that a group has any objective common culture but that groups take aspects
    of their cultural toolkit and invest these with ethnic significance. It is therefore
    impossible to identify an ethnic identity in this sense solely in terms of observable
    behavior such as language or material culture as dress, ceramic forms, or architecture.
    It is also difficult in the archaeological record to identify what forms of material
    culture are used ethnically and which not.


    In my discussion of Ai Khanum in particular, I have aimed to identify some aspects
    of material culture and social practice salient in the Hellenistic Far East. Equally
    important, I believe that it is possible to identify other forms and practices
    that devote not to compromise an individual''s projected ethnic identity, whether
    as Greek or otherwise. At Ai Khanum, temple architecture is the best example of
    an area in which ethnic resonance might be neutralized. There was no Greek-style
    temple in the city; the non-Greek Temple with Indented Niches and the extramural
    temple were used by a broad constitution of the city''s inhabitants, whether they
    considered themselves Greek or not. Areas in which we can see an overt assertion
    and celebration of Greanness are, in contrast, the sanctuary of Kineas with its
    Delphic inscription, the theater, and the gymnasium. It is significant that these
    were the findspots of some of the only Greek inscriptions from the city. Likewise,
    in death it seems that the inhabitants of Ai Khanum were more inclined to resort
    to the Greek language, Greek motifs, and Greek tropes, sculpture.


    The inscriptions of Sophytos and Heliosodoros offer further insights into forms
    of behavior that were and not felt to compromise a Greek identity. As I have already
    noted, Sophytos'' non-Greek name does not from his perspective reduce the impact
    of his Greek education and cultural values. But we do not know whether or Sophytos
    considered himself Greek or was considered by others. Heliosodoros is another
    matter. Here we find a clear indication that an individual who was considered
    Greek (by outsiders to his own community) could nevertheless be presented in Prākrit
    as the devote of an Indian god. A great deal of further evidence would be necessary
    to explore the question of the material and


