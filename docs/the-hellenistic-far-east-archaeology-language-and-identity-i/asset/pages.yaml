  md: 'The third, associated, preliminary point to be made from the historical sources
    is that attempts by outsiders to disrupt the status quo in Central Asia were often
    violently resisted, such resistance being marshaled by the kinds of local “big
    men” just discussed. Again, Alexander provides the best example, with his foundation
    of the new settlement of Alexandria Eschate on the river Jaxartes (the modern
    Syr-darya) in 329 B.C.E. Alexander treated the river as a border with the steppe
    lands to the north and attempted to consolidate its position as such, this represented
    a fundamental break with the existing cultural and political state of affairs,
    where people on either side of the river were in constant interaction, and inadvertently
    provoked a major rebellion.³29 For an incoming power, there were political benefits
    to continuing in executive and administrative personnel. The retention of familial
    institutions and social structures (even if these are now managed at the top level
    by different people) could also be very effective in reducing any “shock of the
    new” and potential for resistance or revolt among the colonized population.


    As I have already suggested, this is the most important time that emerges from
    our various forms of evidence from Achaemenid and Hellenistic Bactria, whether
    these were historical, documentary, or archaeological. Rather than a weakness
    or deficiency, the retention and productive use of existing structures instead
    of or in addition to introducing new systems of administration and exploitation
    is a strength, an active and effective strategy in efficient management of resources
    and imposition of control.


