  md: '# 94 AI KHANOUM


    The canals built and maintained in the agricultural plain around Ai Khanoum (chapter
    1) fed a branch that ran along the foot of the acropolis, between the main street.
    It was from this canal, rather than directly from the rivers (the banks at the
    city being too high), that the city drew its water supply. A network of open channels
    and ceramic pipes provided water and drainage to various institutions. An elaborate
    fountain by the Oxus channeled spring water spouts into the river.


    Quite apart from its location at the junction of two rivers, the Oxus (Amu-darya)
    and the Kokcha, water played a prominent role at Ai Khanoum. The rivers were essential
    for irrigation, and also for transportation. Although, as already discussed, the
    predominant building material at Ai Khanoum was dried or baked mud brick, there
    were some elements, in a soft white limestone. Stone was not available locally,
    but several possible quarry sites were located在了 in the mountains, from which
    the most practical route was by water.¹⁴⁵ The rivers or their valleys may also
    have allowed easier access to the mines in the Badakhshan Mountains and the local
    climate meant that water might also be destructive.


    The topography of the city, its construction materials, and its movement through
    the city, and across changes in elevation of several meters in the lower city
    area, were carefully managed. Constructions in raw mud-brick needed constant maintenance,
    and when this maintenance was interrupted—as was the case after the fall of the
    city—rain and runoff from higher ground could cause serious damage.¹⁴⁶ In the
    case of the city''s fortifications, several phases of repairs were executed via
    a section through the wall, and in some places¹⁴⁷ it can be difficult to tell
    whether damage is due to military attack or to weathering and erosion. Along the
    banks of the rivers, the city''s fortifications were less impressive than along
    the northern side of the city, in large part because the rivers themselves acted
    as a line of defense. But here too the river could compromise what defenses there
    were: by the Oxus, the excavation of the remains of the defenses and the fountain
    were essentially rescue excavations, and the collapse of the banks being sped
    up by the intensification of irrigation activities in the plain near the city;
    by the Kokcha, almost trace of defensive structures had already been washed away
    by the time of excavation.¹⁴⁸ The problems of unbaked mud-brick architecture and
    destructive runoff may have been taken into account by the city''s architects,
    as in the replacement of the stepped base of the earlier phases of the temple
    with a more solid, blocklike platform less vulnerable to weathering.¹⁴⁹


