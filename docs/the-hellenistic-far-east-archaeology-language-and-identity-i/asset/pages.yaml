  md: 'Where we have contemporary texts preserved on perishable materials, however,
    is at a lower level of the administration, in the sense of one that relates to
    regulation of the legal and financial affairs of individuals and their dealings
    with the state bureaucracy. There are, present, just three known Greek texts,
    on prepared skin, from Bactria. Like the economic texts from the Ai Khan treasury—and,
    if it should be recalled, the Aramaic documents of a century or so before—these
    documents are written in hands indistinguishable from those of the contemporary
    eastern Mediterranean world, testifying to their origin and perhaps continued
    inclusion in a shared bureaucratic system or modus operandi. My interest here
    is primarily in the data on economic and administrative affairs that may be gleaned
    from these than their (considerable) interest in matters of Greco-Bactrian chronology.
    In all cases, it is recalled that the texts which are fragmentary and do not always
    yield much sense. They certainly do not furnish a coherent map of Bactrian administrative
    hierarchies.


    The first published document was a tax receipt dated to the first half of the
    second century BCE.¹100 It bears a formula according to local Greek kings, with
    a Macedonian month name, and a location in a place called Asagorna.¹101 A guardian
    of the name (nomophlux) is the first official named: "Although the placing suggests
