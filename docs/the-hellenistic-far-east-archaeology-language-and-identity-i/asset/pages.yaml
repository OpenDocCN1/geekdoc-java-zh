  md: '# ADMINISTERING BACTRIA


    extended their empire as far as the Seres and Phryni.¹

    ... that most prosperous Bactrian empire of the thousand cities...²


    The campaigns of Alexander the Great brought the Greek language and Cavalry’s
    narrator rule to large territories of Central Asia and northwestern India. In
    200 B.C.,³ uses Bactria and India to indicate the very ends of the earth, the
    farthest extent of the Hellenistic *oikoumene*, the inhabited—for which we read
    “Hellenized and civilized”—world. But Bactria has undergone something of a scholarly
    rehabilitation from the reputation it once held as the “Siberia of the Hellenistic
    world.” Part of this rehabilitation is due to our better understanding of the
    political and economic ties that bound it to the world of the Near East. Although
    geographically distant from the centers of the various Eastern empires that controlled
    it (the Achaemenid Persian empire, and later the empire of the Great and his Seleucid
    successors), Bactria was neither economically nor peripheral. It possessed considerable
    natural resources and occupied a strategic position between the world of Iran
    and Mesopotamia and the world of the Eurasian steppe.⁴ The resources that made
    Bactria attractive to the Persians and then to the Greeks also meant that it could
    be used as a power base, whether as a springboard for satrap’s imperial ambitions
    or for the secession of an independent regional state.


    In addition to its agricultural potential with irrigation, Bactria and its southern
    neighbor Arachosia were sources of manpower. Because of their geographical position,
    these territories also served as conduits for military forces and war elephants
    from northwestern India, which might serve under the command of the satraps of
    Bactria and Arachosia.⁵ The region continued to be a source of elephants for the
    rulers of the Seleucid empire as and when they were able to assert some authority.
    In 305 B.C.E., Seleukos received five hundred elephants under the provisions of
    a treaty with the Indian emperor Chandragupta Maurya but lost control of Arachosia
    under this same accord.⁶ Babylonian astronomical diary records the satrap of Bactria
    supplying elephants to the Seleucid king in 274/3 B.C.E. In the last decade of
    the third century B.C.E., Antioch III conducted an extensive campaign in which,
    in the end, made little in the way of territorial acquisitions but did acquire
    elephants—one hundred and fifty in total—from the Graeco-Bactrian king Euthydemos
    and the Indian king Sophagasanes, who ruled in the Kabul Valley.⁸


