  md: '# INTRODUCTION


    This interaction may be broken down in several ways: between Greek and non-Greek,
    between politics, inside and outside the Greek-ruled states of the Hellenistic
    Far East, and between settled and mobile populations. This last area will form
    the main theme of chapter 4, where I explore the myths of a strict nomadic-settled
    divide in Central Asia and the fall of a settled Greek civilization to nomadic
    horsemen from the steppe.


    # LANGUAGE


    In most regions, for most of the period considered in this book, Greek was the
    dominant written language. The earlier use of Aramic as an administrative language
    by the Persian empire left some legacy. In chapter 1 I will discuss how, in Bactria,
    the Persian bureaucracy may have been used by a model including the Greeks. In
    Arachosia, Aramic was used by the Maurya emperor Ashoka in a series of edicts
    to his subjects, alongside Greek, as late as the third century. The influence
    of Aramic faded; it had always been a language of bureaucracy rather than a language
    of the street. Although many languages may have been spoken in the Hellenistic
    Far East, Greek remained the only language of literacy after the demise of Aramic.
    It was only in a much later period that a local vernacular, Bactrian, was given
    a written form, and it is significant that Greek adapted for this purpose.


    The Greek documents and Greek inscriptions discussed in this book are testimony
    to the enduring importance of the Greek language in the Hellenistic Far East,
    but they are the tip of the linguistic iceberg. The Hellenistic world as a whole
    was a profoundly multilingual language. In regions such Egypt, we have written
    evidence of the variety of languages used by the population and the range of linguistic
    registers that a single individual might command. In Bactria we do not, but this
    absence of evidence should not be taken as absence of evidence. The makers and
    readers of Greek inscriptions—including those of the Delphic inscription from
    the sanctuary of Kineas at Al Khanoun—were probably bilingual or multilingual,
    and the communities in which they lived must have speakers of many languages.
    This should be borne in mind throughout the discussion. In one case, in chapter
    3, we happen to have evidence of how a representative of an Indo-Greek king may
    have appeared in a different context, in a Prakrit inscription from a Central
    Indian kingdom. We find a with a Greek name, Heliosoros, who is described as a
    Greek ambassador and a devotee of an Indian god. This inscription gives some insight
    into the ethnolinguistic complexity of the region and allows us to speculate about
    the range of languages—other than Greek—that Heliosoros may have spoken.


    Thinking of the Hellenistic Far East as multilingual is useful because it reminds
    us that the individuals and communities who created the documents and monu'
