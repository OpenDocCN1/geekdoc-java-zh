  md: '# THE FALL OF GREEK BACTRIA


    In chapter 1, I situated Ai Khounam within its Bactrian and Near Eastern context.
    In the material discussed here, I have endeavored to do something similar in locating
    the city within a wide swath of Central Asia where population mobility over shorter
    and longer distances and symbiosis between mobile and economic strategies were
    very much the norm. There were, however, episodes of more dramatic disruption
    to the status quo, such as that we may illustrate clearly in the archaeological
    record from the Samarkand region. My discussion of the arrival of new material-culture
    assemblages from southern Tajikistan—and their users—in eastern Bactria, and the
    subsequent modification of such assemblages under the incorporation of Graeco-Bactrian
    ceramics, has far avoided direct reference to the historical event of the fall
    of Ai Khounam. Our impression of this fall as a traumatic and cataclysmic event
    an accurate one?


    The fall of Ai Khounam, certainly, was not a single event. The archaeological
    remains of the city in many places the impact of both sudden attacks and long-term
    decline and reappropriation of the site during the period in which Bactria was
    bleeding to death. In my discussion of the defenses of Ai Khounam in chapter 2,
    I noted a number of points relevant to the mid-second-century-B.C.E. assaults
    on the city and their probable perpetrators. The mud-brick fortification walls
    were vulnerable to erosion and collapse and constant maintenance, above and beyond
    may have been necessitated by military attack. In several places where there is
    evidence of attack, the techniques used are not those that we associate with steppe-nom
    mounted archers: sapping and the use of heavy projectiles.⁷ Establishing the chronology
    of attacks on the city’s fortifications is difficult, but what is clear is that
    the final, decisive attack that ended the life of the Greek city around 145 B.C.E.
    was neither final nor decisive.⁸⁰ It was the first of two waves of attack.⁸¹ Period
    of reoccupation followed, each with a devastating finish. The precise duration
    of the post-Greek occupation is not clear, but it is in the region of years rather
    than decades.⁸²


