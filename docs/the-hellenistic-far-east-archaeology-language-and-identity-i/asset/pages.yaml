  md: '# CONCLUSION


    Another way in which the material from the Hellenistic Far East differs from that
    elsewhere in the Hellenistic world is naming practices—or at least in the evidence
    that we have naming practices. In places such as Egypt and Babylonia, we find
    double names in where an individual may be described using a Greek or an indigenous
    name to context (the language of the document) or use both names together. This
    phenomenon has been discussed for Egypt, where it was reasonably, but it also
    occurred in other regions. In Babylonia, we find some Akkadian-Greek doubling.
    The reasons why individuals might use double names are complex. The adoption of
    such trappings of Greek identity—and especially the Greek language—might allow
    a person to advance further in public life. Greek names may be granted as well
    as adopted: Anu-uballit, governor of Guruk, had the Greek name Nikarkos bestowed
    upon him by the first Seleucid emperor, Seleukos I.¹⁸ As well as being adopted
    or bestowed, double names may reflect mixed descent and exposure to more than
    one ethnic community from birth. The children of interethnic marriages could did
    move between communities and cultural spheres, whatever their official ethnicity.
    Double names may also reflect a very real attachment on the part of some individuals
    to both sides of their cultural identity.


    In the Hellenistic Far East, in contrast, we find only single names. As I have
    already noted, this is at least a product of the kind of evidence available to
    us. The, functional Ai Khanoum treasury texts have little room for subsidiary
    information on the transactions conducted. We may suggest, however, that the adoption
    of a Greek name (with or without the Greek language or cultural practices) was
    not so common among the indigenous inhabitants of the Hellenistic Far East as
    it was in Hellenistic Egypt. The Ai Khanoum treasury is just the kind of context
    in which a Greek name may have been appropriate. Most telling, however, the failure
    of Sophytos of Naratos to use. Given his otherwise careful cultivation of an educated
    Greek cultural identity, this suggests to me that he did not have one. Although
    the appearance of a non-Greek name in such an overtly Greek inscription may strike
    us as jarring, however, it is by no means certain that it is the impression that
    it would have had on a contemporary observer. Acceptance could have been aided
    by a judicious choice of names. I have argued elsewhere that specific Greek names
    may have been adopted of their local resonance. Heliosdor or Heliodontos, for
    example, could have been chosen because they were equivalents of the Iranian Mithradates.¹⁹
