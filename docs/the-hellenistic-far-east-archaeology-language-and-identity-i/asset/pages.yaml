  md: '# 192 APPENDIX


    As I could not convict myself of any evil,

    my nature urged me to cultivate mystic toil.

    In my wisdom I then composed a complex song,

    having received from the gods a holy and expressive idea.

    When it was clear that the Muse had accomplished something pleasing to the gods,

    i shook out my festival song, like the flower of a green shoot on Helicon.

    Then a cave tempted me to enter and sleep,

    although I was a little afraid to yield to a dream of fantasy.

    Sleep picked me up and swirled me away to a dear land.

    I seemed to be gently washing my body in the flowing streams of a river

    with bountiful waters of the sweet Nile.

    I imagined Calliope, a holy member of the Muses,

    sang together with all the nymphs a sacred song.

    Thinking there still remained a bit of Greece,

    I set down in written form the idea that my soul had inspired in me.

    Just as one moving his body in time to beat by a staff,

    is summoned rhythm as a partner for the inscription of my song,

    leaving of a critical little reason for blame.

    The urged me to speak my clever poem.

    Then great Mandoulos, glorious, came down from Olympus.

    He charmed the barbaric speech of the Athiopians

    and urged me to sing in sweet Greek verse.

    He came with brilliant chords on the right hand of Isis,

    exulting in his greatness and the glory of the Romans,\and uttering Pythian oracles
    like an Olympian god.

    You declared how of you men can look forward to a livelihood,

    how day and night and all the seasons revere you\and call you Breath and Mandoulos,
    fraternal gods,

    stars who rose as a sign of the gods in heaven.

    And you yourself to inscribe these clear words,

    in order that they be viewed by all without flattery.


    (Acrostic: Paccius)

