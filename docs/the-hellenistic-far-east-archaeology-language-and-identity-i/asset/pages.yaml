    The second problem in analyzing the form and function of the Temple with Indented
    Niches is the architectural plan of the building itself, which is commonly referred
    to as Mesopotamian in inspiration and has been compared with the later layers
    of Doura-Europos. What does this similarity actually signify What it might mean
    to find a way of reconciling it with the temple''s local Bactrian context? As
    I have argued elsewhere, the analogies that have been drawn from the form of the
    temple and Mesopotamian influence are valid only in the sense that Mesopotamian
    influence on the Ai Khanoum niche has been mediated through an Achaemenid official
    text (Maires 2013). I argue that if when one becomes known about Achaemenid Bactria,
    more about the institutions and material culture of Hellenistic Bactria would
    begin to make sense.


    In comparison with niched temple, less is known of the city''s two identified
    cult sites, the temple outside the northern gate and the podium on the acropolis.
    The extramural temple was constructed according to an architectural program similar
    to that of the intramural niched temple.¹⁰⁷ It stood on a raised platform, with
    niches in its exterior walls, and in its first phase had a tripartite inner cella.
    Two wings were added, with additional chambers. The extramural temple, unfortunately,
    yielded hardly any, and we can say little about the cult practiced there or any
    similarities that it may have had with the niched temple inside the city walls
    or divergences from it.


