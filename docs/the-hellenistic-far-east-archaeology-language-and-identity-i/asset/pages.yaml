    spectacular but problematic material that defies straightforward analysis or cultural
    categorization. This material, furthermore, has tended not to be much discussed
    (as opposed to simply cited) in connection with evidence from elsewhere in the
    Hellenistic world.⁴² Two of the central airs of the present work are, first, to
    move beyond simple synthesis of the available archaeological and textual evidence⁴³
    and ask what we may practically do with it; and, to discuss a series of case studies
    that may be of interest to those who work on other regions of the Hellenistic
    world and indeed, beyond.


    # Russian and Soviet Central Asia


    In the late nineteenth and the twentieth century, two nationalities dominated
    archaeology in Afghanistan and Central Asia: the Russians and the French. North
    of the Oxus, the context of the first major archaeological investigations was
    firstly colonial. In the 1860s and 1870s, Russia successfully annexed the territories
    of what would later become the Soviet and post-Soviet republics of Kazakhstan,
    Uzbekistan, Turkmenistan and Kyrgyzstan. To the southeast, meanwhile, the attempts
    of the British to extend their influence into Afghanistan resulted only in the
    establishment of an Afghan state.⁴⁴ A number of the soldiers, administrators,
    scholars, travelers, and journalists who arrived in the wake of the Russian conquest
    developed amateur excavations in the region''s antiquities supported a thriving
    local market for antiquities and other artworks and crafts.⁴⁵ Museums were established
    in Samarkand (1874), Tashkent (1876), Ferghana (1888), and Ashgabat (1889)—not
    to mention the vast collections of Central Asian artifacts that make their way
    through purchase, pillage, or excavation to the great museum collections of Russia
    and Europe.⁴⁶ The “Oxus Treasure,” a hoard of Achaemenid period gold and silver
    items, was found in 1877 (probably in the neighborhood of the “Oxus” at Takht-i
    Sangin), transported for sale to India, and eventually ended up in the British
    Museum.⁴⁷ The construction of a road between Samarkand and Tashkent destroyed
    the ancient site of Afasiab, and the flood of antiquities onto the market led
