  md: 'Most of the rooms of the palace—or at least of those excavated—lay in a complex
    to the south of the great court. This complex contained a number of rooms probably
    for official business (reception rooms, offices) and a residential area. The internal
    configuration of the palace was such that rooms were divided into smaller units
    by a system of corridors, which had the effect of isolating them from each other
    and restricting access. There are, long corridors that allow a person, in theory,
    to pass from the great court into the innermost chambers of the palace without
    passing through the formal reception areas or the reception rooms and offices
    of the interior.³ These were constricted by a series of doors and were evidently
    only for individuals with special permission. Such a corridor, which from the
    great court along the eastern side of the palace''s units, passed all the way
    to the back of the palace to another massive open-air court. A further, open court
    lay to the east of this corridor. Unlike the great court, these courtyards did
    not have colonnades. They have not been fully excavated, and it is difficult to
    say much about their function, but the southern court, at least, seems to have
    communicated with other structures or yards to the south. Bernard suggests that
    they may have been used for stationing troops,³¹ and of course numerous other
    functions.


    The main entrance to the palace building is in the middle of the southern side
    of the peristyle great court and takes the form of a columned porch, three rows
    of column behind the peristyle. This kind of porch is often designated in the
    literature as an iwan, term taken from the later architecture of Persia and Central
    Asia, indicating a high, roofed entrance hall, completely open on one side. The
    columned iwan, as will be, is a common feature of Graeco-Bactrian architecture.


    Behind the iwan, through a slightly off-center doorway, was a large hall (room
