- pgno: 29
  md: 'ments considered in the following chapters do not subscribe to some single,
    monolithic cultural identity; but it is also helpful from a theoretical point
    of view. Linguistic analogies have long enjoyed a vogue in studies of cultural
    interaction more generally. The ways in which languages interact—within individual
    usage or within a speech community—offer any number of useful models for how cultures
    and ethnic groups interact. Multilingual individuals rarely use their languages
    equally across all speech domains. Instead, they may use language to speak to
    their family and another at school, or they may have sufficient competence in
    one language to talk about aspects of their jobs but not hold social conversations.
    Speech domains offer an interesting analogy for the patterning of different architectural
    and artistic styles in a site such as Ai Khanoum, as the concept of markedness,
    a marked form is one that differs from a default, more neutral norm; for example
    "lion" may be used as a neutral form, whereas "lioniness" is marked because it
    refers only to a female. In chapter 2, on Ai Khanoum, I suggest that it is helpful
    to question whether forms of public behavior are marked or unmarked. A dedication
    to a temple that does not have a Greek architectural form does not have to be
    an ethnically marked form of behavior; it may equally be an unmarked default.
    These considerations have implications for how we consider the ethnic resonance
    of activities within the public life of Ai Khanoum more generally.


    One linguistic model is particularly useful in analyzing the material from the
    Hellenistic Far East, of code switching. Accomplished bilinguals move back and
    forth between languages in the course of a single conversation or utterance, and
    can switch between languages depending upon context or interlocutor. Individuals
    such as the Greek ambassador Heliosoros are most likely to have been able to manage
    their behavior in this way, switching fluently between languages and cultures
    as the need arose. Heliosoros had a professional reason for doing so, but even
    within communities it is likely that individuals were able to modify the outward
    expression of their ethnic identity as when it proved advantageous to do so.


    # ARCHAEOLOGY IN CENTRAL ASIA


    The full story of the modern rediscovery of the Greek kingdoms of Bactria and
    India, and the painstaking process of piecing together what was possible of their
    history, has been narrated elsewhere. In recent years, a number of important studies
    have surveyed the intellectual history of Bactrian studies and provided syntheses
    and new analyses of the available evidence. The context for this renewed interest
    in antiquity of the region is, of course, political. Much of the territory


