- pgno: 21
  md: '# INTRODUCTION 3


    Indian on the other. In the 240s B.C.E., the Greek state of Bactria itself fell,
    to a combination of nomadic invasions from the north, with Parthia, and internal
    dynastic conflict. Some Indo-Greek statelets struggled in northern India until
    around the turn of the common era.


    The archaeological and epigraphic evidence of the Hellenistic Far East is still
    patchy and problematic, despite the advantages brought by the discovery of Ai
    Khoum. In addition to the material from Ai Khanoum, we have a variety of other
    pieces of historical and archaeological evidence from across the region. (See
    “Sources,” below.) There are a small number of Greek inscriptions from sites other
    than Ai Khanoum, as well as one important mention of a Greek in a contemporary
    Indian inscription. There are also mundane, everyday administrative and legal
    documents in Aramaic and Greek. There are the coins struck by the kings of a succession
    of Graeco-Bactrian and Indo-Greek kingdoms. There is evidence (mostly limited
    in quality and quantity) from archaeological sites across Bactria, Sogdiana, Arachosia,
    and Gandhara. In this material, discussed in the following chapters, we encounter
    such characters as a Greek ambassador to the court of an Indian king, a man with
    a non-Greek name writing sophisticated Greek verse, Greek and Bactrian officials
    working in a royal treasury, and Scythian mercenaries in Greek employment. This
    record is, however, fragmentary; and it demands to be contextualized: geographically,
    historically, and in terms of theoretical approaches to questions of ancient colonialism,
    ethnic nation, and identity formation.


    Distance, terrain, and political boundaries isolate the Hellenistic Far East geographically
    from the better-known contemporary empires of the Mediterranean, Near East, and
    India. Its archaeological record displays a complex combination of material culture
    forms and stylistic traits, some of which are also found in neighboring empires,
    and some of which are not. which are not. Scholarly territorial claims over the
    Hellenistic Far East that the region does not really “belong” in either a classics
    department or an oriental studies or South Asian department—although the remains
    of Ai Khanoum, and the Greek inscriptions of the region, have on occasion provoked
    excitement and doubt. This material is exotic in a double sense. It presents a
    dramatic confirmation of the presence and persistence of Greek culture in a remote
    region, Central Asia and the Indo-Iranian borderlands, for a period of some three
    hundred years after the initial settlement under Alexander and the early Seleucids.
    Earlier generations of scholars spoke of the notion of a vibrant Greek culture
    in Central Asia, to be discovered by adventurous archaeologists, as a “mirage”;
    but this mirage has turned out to have material substance. The other sense in
    which the archaeological and epigraphic


