  md: '# Responses to the Bactrian Environment


    The local, continental climate offers further possible reasons for choices in
    Bactrian architectural design. The iwans of the palace and residences faced away
    from the prevailing winds. A now of structures—such as the antechambers of the
    palace’s “meeting rooms”—contained fireplaces. Long corridors, such as those surrounding
    the northern courtyard of the gymnasium, could have allowed engaging in activities
    usually conducted out of doors in the Mediterranean Greek world—such as promenading
    and philosophizing—to be protected from extremities of heat and cold, and from
    precipitation. It may further be suggested that the practice of surrounding buildings
    with corridors immediately inside the outer walls provided insulation from the
    elements.


    # Local Traditions of Craft Production


    As well as techniques of manufacture, specific types of artifacts or craft products
    are typical of Bactria before, after, and during the period of the Graeco-Bactrian
    kingdom. These items are known in the literature by the Greek term *pyxides*,
    small (ca. 10–12 cm in diameter), hemispherical, lidded containers used for a
    variety of purposes.¹ They are made of schist or steatite, locally available in
    the mountains of the region, near or inlaid decoration on their lids, and contain
    two or small compartments. Many of these vessels were found at Ai Khanoum; others
    are known from nearby Bactrian sites such as Takht-i-Sangi.² These idiosyncratic
    elements of local Hellenistic-Bactrian craft production started out, as containers
    for jewelry, cosmetics, or other items. Contains in these forms continued to be
    used and produced in the region, however, and in Gandhāra of the early centuries
    C.E. these were used as reliquaries for Buddhist relics.³ These *pyxides* are
    a good example of ways in which changes in purpose and meaning could be couched
    within the same local Bactrian material idiom.


    What is most striking, however: local techniques of clay sculpture, upon wooden
    armatures and sometimes containing elements in stone, are typical of the region
    during the Hellenistic period (for example, in the temple and palace of Ai Khanoum)
    and in later periods. Khalchayan, in the Surkhan-darya Valley, was a settlement
    of the Hellenistic period. In the first century B.C.E., the immediate successors
    of the Greek kings of Bactria, precursors of the Kushans, built a palace adorned
    with wall paintings and clay sculptures.⁴ In both their


