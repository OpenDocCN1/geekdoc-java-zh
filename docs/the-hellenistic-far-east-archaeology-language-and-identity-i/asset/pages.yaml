  md: '# INTRODUCTION


    # 5


    may help us to approach this source material; and the immediate intellectual and
    political context of the discoveries in Central Asia of the nineteenth and twentieth
    centuries.


    # SOURCES


    In his “Coins with Indian Inscriptions,” the Alexandrian Greek poet Constantine
    P. Cavafy (1863–1933) describes his surprise in browsing through a catalogue of
    Indo-Greek coins and finding some with the names of Greek kings rendered in Indian
    script. Some of these kings are known only from the numismatic record and do not
    appear in any ancient historical account. Greek, Roman, Indian, and Chinese sources
    preserve little of the history of the Hellenistic Far East in.(What few sources
    there will be in chapters 1 and 4) Until the second half of the twentieth century,
    the amount of archaeological and documentary evidence was also extremely limited.


    The project with which modern historians of the Hellenistic Far East have traditionally
    been faced is that making the best of what there is. The outlooks of scholars
    (as stated in print) show a combination of pessimism and pluck. We might look
    at three examples. The German scholar T.S. Bayer (1694–1738) wrote on a range
    of classical and oriental topics, including Bactria. In his published writings
    he often quoted from the Hellenistic poet Theocritus (an Alexandrian predecessor
    of Cavafy by over two thousand years): “The Greeks got into Troy by trying....
    Everything is done by trying!” The French archaeologist Alfred Foucher, who became
    the first director of the Delegation Archologique Française en Afghanistan (DAFA)
    in 1922 (see further below), dug Bactra without discovering any significant evidence
    of Hellenistic occupation for eighteen months. He later wrote that the Greek dynasties
    of Bactria “have failed in their most basic duty toward their scholarly societies
    in neglecting to construct in marble temples and palaces engraved with inscriptions.”
    In The Bactria and India, first published in 1938, the British historian Sir Liamthorpe
    Tarn tackled the historical sources.


    A word must be said here about the sources, they will sufficiently appear as the
    book proceeds. They are of course very scrappy.... As there was once a tradition,
    it is somebody’s attempt to recover the outline of it.


