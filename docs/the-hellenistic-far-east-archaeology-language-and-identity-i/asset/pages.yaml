    text describes Heliosodor, in the local Prakrit, as a Greek (yona) and a devotee
    of an Indian god. Both inscriptions raise similar questions about culture, ethnic
    identity, and self-representation in the region. A few Greek and Latin inscriptions
    from another frontier of the classical world, Lower Nubia, will also enter into
    my discussion, most notable among an acrostic verse in Greek by a Nubian soldier
    Paccius Maximus. My intention is to contextualize the inscriptions of Sophytos
    and Heliosodor in two senses: geographically, with reference to what we know of
    their archaeological and sociohistorical contexts, and thematically, with reference
    to the techniques of self-representation that they share with each other and with
    the Nubians.


    The inscriptions of Sophytos and Heliosodor appear to contain certain Greek and
    Indian cultural tropes, their authors very actively seek to present themselves
    and their social and cultural backgrounds in particular ways, as the face of modern
    scholarship may view as more ambiguous signals about their ethnicity, education,
    status, and even native language. These inscriptions all share a consciousness
    of being looked at, and of authors (or commissioners) being judged by the reader.
    They were produced, of course, in very different geopolitical contexts, and their
    authors—aside from their self-consciousness in the epigraphic act and attachments,
    of varying degree, to Greek identity—probably had little in common. The question
    who these individuals actually were is only one that we should ask of their inscriptions.
    Equally important are the questions who they thought they were, what they hoped
    their inscriptions to achieve, and the common themes and strategies that they
    employed in their inscriptions'' composition.


    There are three main points that I would like to make in this chapter. First and
    most fundamental, that these inscriptions can be used, and their place is not
    just as a scholarly aside on the strange things Greeks did in the East. Second,
    and I assume uncontroversial, the ethnic strategies employed in public display
    are considerably more complex and subtle than any polarity of Greeks versus non
    Greeks. This complexity is something that I have illustrated in my discussion
    of the urban landscape of Ai Khanoum in chapter 2 and that I have noted above.
    My third point is that ethnic expression or self-designation is mediated through
    a written medium in which an individual may be able to exercise only limited freedom
    of choice. In addition to issues familiar from the epigraphy of other regions
