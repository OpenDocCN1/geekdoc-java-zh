  md: '# ACKNOWLEDGMENTS


    The book in which I first read about Ai Khanoum was a childhood gift from my grandparents,
    but my interest in Hellenistic Bactria began in earnest when I was an undergraduate
    in the library of St Catherine''s College, Cambridge, when I should have been
    writing an essay on something else. Sir William Woodthorpe Tarn''s The Greeks
    in Bactria and India had a title too intriguing and downright bizarre to be ignored.
    It also left me with more questions than I could even begin to know how to go
    about answering.


    Dorothy J.Thompson has been a supervisor and mentor without equal throughout my
    vacations between Egypt and Central Asia. I owe her immense debt for showing me
    one can think critically and creatively about language and identity. Parts of
    this book originated in a PhD thesis under her supervision at the University of
    Cambridge.


    The Hellenistic Far East does not have any real disciplinary home, but I have
    been grateful for the welcome given by various centers of classes, oriental studies,
    and archaeology, as well as the institutions where I have worked over the past
    few years. The academic communities of the Institute for the Study of the Ancient
    World (ISAW), New York University; Merton College, University of Oxford; the Joukowsky
    Institute for Archaeology and the Ancient World, Brown University; and the Department
    of Classics, University of Reading, have all provided financial support and terrific
    opportunities to share and discover new research. My students at Brown have given
    me the chance to actually teach Central Asian archaeology for the first time.
    Soren Stark and Lillian Tseng allowed me to participate in their seminar on Cultural
    Interactions in Eurasian Art and Archaeology at ISAW and to learn more about the
    archaeology of Central Asian nomads.


    xi'
