  md: '![](img/04c35c741e3fa8078ec254a899ae6e7f_73_0.png)


    # CONCLUSIONS: ADMINISTRATIVE CONTINITY


    I would like to be quite cautious in assessing the extent to which all of these
    texts, even in combination, can be used to reconstruct the workings of the bureaucracy
    of Bactria in the Hellenistic period, still less the extent to which this bureaucracy
    was based on the early years of the Achaemenid predecessor. As noted in the introduction
    to this chapter, the probability is great that the Achaemenid administration of
    Bactria, like that of other regions of the Achaemenid empire, supplied the template
    for later Hellenistic administrative structures. Continuity in personnel may be
    traced only as far down as the early years of the reign of Alexander but is likely
    to have persisted for much longer. The field-survey evidence, crucially, demonstrates
    that the essential workings of systems of land management and resource extraction
    were not interfered with. As discussed above in the introduction to this chapter,
    the apparent absence of evidence for the Achaemenid and Hellenistic takeovers
    in eastern Bactria is in fact rather good evidence for a particular political
    and economic strategy, the retention of existing personnel and systems of economic
    production and exploitation in the service of a new political power. The survey
    data, along with the existence of administrative texts of the fourth and fifth
    centuries CE. in the Bactrian language,¹⁶ raise the tantalizing possibility that
    one day we may be able to trace something of Bactria''s longer-term administrative
    history.


