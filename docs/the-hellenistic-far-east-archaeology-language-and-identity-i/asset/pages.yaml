  md: '# THE INSCRIPTIONS OF SOPHYTOS HELIODOROS


    contact Besnagar and its rulers had with foreign groups, so it is impossible to
    tell whether Heliosodor was aided by a precedent for behavior toward eminent foreigners.
    His inscription does not attempt to disguise the fact that he is a yona, a foreigner,
    with a foreign name and origin: probably this would have been neither possible
    nor desirable. His position as intermediary with a foreign king is clearly stated.
    At the same time, his description as devotee of an Indian cult and his dedication
    of a pillar and inscription makes no attempt to exclude him from local cultural
    practices and religious activities. (if any) Heliosodor experienced on a ritual
    or social level from the local population because of his yona status we do not
    know; but his pillar dedication and personal involvement with a local cult—heartfelt
    or politically motivated—demonstrate just one of the individual, personal inroads
    of foreign origin might readily make into a theoretically closed social structure.


    # PACCIUS MAXIMUS (LOWER NUBIA)


    My discussion of the final inscriptions considered in this chapter—the Greek acrostic
    verses of Paccius Maximus from Lower Nubia—will be comparative. I intend to use
    them, for the most part, to highlight strategies and structural elements that
    they have in common with the inscriptions of Sophytos and Heliosodor, and to illustrate
    that such inscriptions are by no means confined to the Far East of the Graeco-Roman
    world.¹


    The temple of the gods Maudolis and Isis at Kalabba (Roman Talmis) was constructed—in
    the form in which it is presently relocated, above the water level of Lake Nasser—in
    the period between Augustus and Vespasian.¹ Kalabba was a military garrison, and
    for many of the graffiti and inscriptions on the walls of the temple were left
    by Roman soldiers. The vast majority are in Greek. The Roman decurion Paccius
    Maximus responsible for three texts at Kalabsa and one at Maharraqa.¹ he was banished
    to Legio III Cyrenaica, which was stationed at Kalabsa in the first century C.E.


    Paccius Maximus is of particular interest in our discussion of the inscriptions
    of Sophytos and Heliosodor because he was stationed at one of the fringes of the
    Graeco-Roman world, because he makes references to Greek religious and cultural
    themes in his verses, because he composes two of his inscriptions in acrostic
    form and makes use of other wordplay, and because he has, inevitably, been accused
    of being a Nubian protecting Greek culture and erudition. With


