  md: '# INTRODUCTION


    of the former Graeco-Bactrian and Indo-Greek kingdoms has experienced war or political
    instability in modern times, as it did in antiquity,34 and such instability has
    inhibited archaeological research and provided a catalyst for it. In the nineteenth
    century, British and Russian exploration of Central Asia and investigation of
    its history took place in the context of colonial expansion. More recently, decades
    of war in Afghanistan have witnessed widespread destruction of the country''s
    cultural heritage and the systematic looting of many sites for antiquities to
    be sold illegally on the international market. The fact that Afghanistan is in
    the news has also provoked somewhat of a surge of public and scholarly interest
    and this interest has been sustained by several major exhibitions and television
    documentaries in Europe, North America, Australia, and Japan.35 From the early
    2000s, foreign archaeological expeditions have once again active in Afghanistan,
    and the Afghan Institute of Archaeology has also been conducting fieldwork. The
    collapse of the Soviet Union in the 1990s disrupted archaeological research in
    the region (among other factors, funding for archaeological projects was not readily
    available) but also opened the way for new collaborations between Central Asia
    and Western archaeologists.


    Popular and scholarly interest in the Central Asian has always been excited and
    driven by political circumstances. The history of European exploration and antiqu
    research is well-trodden ground, a story that has been covered in detail elsewhere,
    among places in the works that I have already cited but also in institutional
    histories of the archaeological missions active in the region, such as the Delegation
    Archologique Française en Afghanistan.36 In what I follow, I would like to offer
    a slightly different perspective on the intellectual history of Graeco-Bactrian
    studies, one that focuses on the interface between specialist scholarship in the
    Hellenistic Far East and its dissemination, explication to and reception by wider
    audiences, both within the academy and an interested public. I shall also discuss
    the perspectives brought by scholars to the Hellenistic Far East by their earlier
    training and political and cultural milieux. After surveying the history of archaeological
    investigation in the Hellenistic Far East, I turn more specifically towards Ai
    Khanoum and the excitement that the discovery of this city aroused not just in
    scholarly journals and learned societies but also in the popular press.


