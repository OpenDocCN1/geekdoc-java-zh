    that counts for much. If his person is intrusive in a Greek inscription—as it
    has been claimed Sophytos the Indian and Heliosoros the Yona are equally intrusive
    in theirs—then his being intrusive as a Roman is equally likely as his being intrusive
    as a Nubian.


    # INTELLECTUAL AND LITERARY CULTURE


    Discussions of all these inscriptions have focused to some extent on the overt
    display of Greek (or Indian) literary culture in an inscription a zone of cultural
    interaction ought to make. The notion that the author is in some way culturally
    insane is reason, or illicit belief beneath the durability or extent of Greek
    culture at such frontiers. Sophytos, Heliodoros, and Paccius Maximus, is simply
    insecure, social-climbing nouveaux or autodacts with their shoulders. We may assume
    cultural conservatism as a reaction among the Greeks of Arachosia, for example,
    to position mixed-blood colonists of a city outside the political control of a
    Greek state; but by this assumption, along with that of an insecurity accompanying
    this conservatism, is an imposition from outside, from our own greater familiarity
    with the Greek states of the Mediterranean littoral, not a picture that emerges
    directly from the local evidence. The local societies in which Sophytos, Heliodoros,
    and Paccius lived, and local forms of identity inscription and self-inscription,
    were much more complex and structured than this. The constraints imposed on the
    authors of these inscriptions by local social structures and forms of acceptable
    behavior will be discussed in the next section. The question remains, however,
    of what an overt display of the intellectual culture (such as Homer or metrical
    verse in general) associated with a specific culture (such as Greeks) means in
    terms of the educational background and cultural identity of the one who makes
    such a display.


    Sophytos’ Homericisms and his reworking of the first lines of the Odyssey to reflect
    his journey through foreign lands are the clearest example of the influence of
    a particular Greek author on the literary style of these inscriptions, although
    Maximus’s verses are also self-consciously literary, and he name drops Apollo
    and the Muses. Sophytos had certainly read Homer, and, as can be seen from the
    dominance of Homer as a school text in contemporary Egypt,


