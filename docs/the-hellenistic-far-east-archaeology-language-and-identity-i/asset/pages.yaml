    Pačak-tepe in the lower Surkhan-daya Valley provides a good local parallel for
    the Ai Khanum stepped podium. This structure is a-tiered podium of rammed earth,
    oriented to the southeast, with only a light super-structure. Its dimensions are
    comparable to the stepped podium at Ai Khanum. It is dated by ceramics to the
    fifth or fourth century B.C.E., which would offer a context for the Ai Khanum
    podium within a local Bactrian Achaemenid context as well as a wider Iranian one.


    I began by posing—among other questions—that of how we may conceptually situate
    the sites of Ai Khanum within the wider urban landscape. I argue that it is important
    to consider them as "non-Greek" exotica and more functioning institutions, integrated
    into a city whose architectural inhabitants moved on a daily basis among buildings
    whose architectural format and decor incorporated from across ancient Central
    Asia, the Near East, and the Mediterranean world. This diversity in material and
    visual culture have not compromised an individual’s or a community’s ability and
    desire to assert a particular ethnic identity if they wished to. What I argue
    the archaeological evidence from Ai Khanum reveals a city where public assertions
    of civic identity took place within a very Greek framework, but individuals might
    exhibit variation in their behavior in other spheres. As Greek identity was asserted
    so strongly in areas such as the gymnasium or at any ethnic resonance in activities
    such as temple dedications or offerings toward the rising sun might easily be
