  md: 'continued to have influence and to be diffused beyond the site itself. Once
    again, the most productive approach is to look at Ai Khanoum in a local context.
    The fact that Saksanokhur continued to be occupied through into the second and
    third centuries c.e., the period of the Kushan empire, also shows the existence
    of some-standing local architectural tradition; furthermore, Saksanokhur provides
    an example of the kind of long-term administrative and socioeconomic continuity
    argued in chapter 1. This is an actual institution that continued to function
    in some way across political changes.


    My discussion of Saksanokhur leads on a consideration of domestic architecture,
    which will be covered in the next section. By analyzing the function of the Ai
    Khanoum palace, it is important not to artificially separate the domestic from
    the official architectural context. The existence of residential suites within
    administrative buildings—like the presence of family crypts with provisions for
    cult offerings in the central neighborhood of the lower city—has the potential
    to tell us something about the manner in which Ai Khanoum was governed, as in
    the last decades of its existence. Both are suggestive of one or more families''
    significant political power in Ai Khanoum, perhaps a dynasty of local governors,
    and of the city''s having at some point became a seat of royal authority. Although
    a site, in a region, prime strategic and economic importance, Ai Khanoum was not
    (at least initially) a royal capital. But the evidence does, I think, in the direction
    of its having been the seat of a Greco-Bactrian governor, and perhaps previously
    Achaemenid governor, managing the region from resident in the palace. The mausoleum
    with a stone vault, likewise, is a possible candidate for the burial place of
    a powerful local family. The potential for continuity here (as discussed in chapter
    1) alters any notion that we may have of Ai Khanoum as a purely Greek creation,
    whether politically or culturally.


    # DOMESTIC ARCHITECTURE


    In addition to the residential units within the palace, large houses with similar
    layouts were found both inside and outside the city walls. Like the palace, these
    have often been compared with contrasted to residential structures elsewhere in
    the Near Eastern or the Mediterranean world. Although there may be connection
    to Near Eastern architectural traditions, describing the houses of Ai Khanoum
    in terms of, for example, Persepolis or Olynthos is misleading. They are best
    treated as local forms of Hellenistic Bactria and as to some extent responses
    to the local environment.


    Much of the southern part of the lower city, to the south and west of the main
