    # EARLY HELLISTIC BRACTIA: BUSINESS AS USUAL


    On the 15th of Sivan, 7 year of Alexander the King. Disbursement of barley <from
    Vakhshudata, the barley supplier in Ariavant. (Naveh and Shaked 2012: C4 [Khalili
    IA 17], 8 June 324 B.C.E.)


    Six years later, similar documents were given by a different king. The Aramaic
    documents from Bactria cover a period of transition, from the last decades of
    Achaemenid rule into the early years of the new Graeco-Macedonian regime. In a
    very literal sense, the Aramaic documents do record “business as usual”: the continuing
    regulation of the province’s economic life according to existing practices, within
    administrative hierarchies, and written down in the same language according to
    the same templates. In dating formulae, the Persian kings gave so seamlessly to
    Alexander the Great, the “last Achaemenid”. Since the documents currently know
    come down only as far as the 32os B.C.E., it is at impossible to say if and when
    this Achaemenid Arama bureaucracy was modified or replaced. At least by the time
    of the first Greek documentary texts now known, in the late third or early second
    centuries B.C.E., Bactria was being administered in Greek.'
