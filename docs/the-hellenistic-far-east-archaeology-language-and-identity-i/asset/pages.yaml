  md: '# THE INSCRIPTIONS OF SÓPHYTOS HELIODOROS 103


    forms of material culture people associated with particular identities. No one
    really is anything objectively. Identities are constructed, defended, and ascribed,
    and the frameworks and vocabulary of anthropology and postcolonial studies have
    brought terms such as "hybridity" and "creolization" into common currency in Greek
    and Roman archaeology. Ethnicity, of course, has become a familiar trope in dealing
    with both archaeological and textual data from the ancient Mediterranean, as was
    discussed in the introduction to this work. Barth''s definition of ethnicity as
    a constructed identity in the defense of a boundary around a notions set of cultural
    traits is often more important than objective differentiation in language or material
    culture still presents a useful model for many classical and Hellenistic case
    studies.


    In this chapter, I consider two individuals from the Hellenistic East Far for
    whom we can reconstruct something of a personal history. Both left inscriptions
    in territories beyond the Hindu Kush: Sophytos at Kandahar, in Arachosia, and
    Heliosodor at Besnagar, in Central India. Heliosodor is the only individual from
    the eastern Greek states who is actually given ethnic descriptor in our sources—he
    is referred to as a Greek—but it is typical of the material from the region that
    we have one case where no ethnic does make analysis of the person''s identity
    any more straightforward. My purpose in what follows is to investigate the constructed
    identities of Sophytos and Heliosodor: the linguistic registers of their inscriptions,
    their cultural points of reference, the identities that they attempt to project,
    and the conscious and unconscious signals that give their audiences about their
    backgrounds and identities. I will also set them within a wider geographical context,
    as the products of multicultural and multethnic societies similar to those of
    other regions of the Hellenistic world.


