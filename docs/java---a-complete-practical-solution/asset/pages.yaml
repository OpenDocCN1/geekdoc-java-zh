  md: '# JDBC


    Java Database Connectivity (JDBC) is an application programming interface (API)
    which allows the programmer to connect and interact with databases.

    It provides methods to query and update data in the database through update statements
    like SQL''s CREATE, UPDATE, DELETE, and INSERT, and query statements such as SELECT.

    Additionally, JDBC can run stored procedures.


    Just like Java, JDBC is compatible with many platforms like Unix and MAC OS.

    Before JDBC, ODBC API was the database API to connect and execute query with the
    database.

    But, ODBC API uses ODBC driver which is written in C language (i.e. platform dependent
    and unsecured).

    That is why Java has defined its own API (JDBC API) that uses JDBC drivers (written
    in Java language).

    The JDBC API uses Java standard classes and interfaces to connect to databases.

    In order to use JDBC to connect Java applications to a specific database server,
    a JDBC driver that supports the JDBC API for that database server is required.


    # JDBC Driver:


    JDBC driver implementations vary because of the wide variety of operating systems
    and hardware platforms in which Java operates.

    JDBC Driver is a software component that enables Java application to interact
    with the database.There are 4 types of JDBC drivers:


    +   1. JDBC-ODBC bridge driver

    2. Native-API driver (partially Java driver)

    3. Network Protocol driver (fully Java driver)

    4. Thin driver (fully Java driver)'
