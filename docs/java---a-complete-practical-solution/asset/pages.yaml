  md: '# JDBC 223


    # Type 1: JDBC-ODBC Bridge Driver


    In a Type 1 driver, a JDBC bridge is used to access ODBC drivers installed on
    each client machine. Using ODBC, requires configuring on your system, a Data Source
    Name (DSN) that represents the target database.


    When Java first came out, this was a useful driver because most databases supported
    only ODBC access but now this type of driver is recommended for experimental use
    or when no other alternative is available.


    Open Database Connectivity (ODBC) is an open standard API for accessing a database.


    By using ODBC statements in a program, you can access files in a number of different
    databases, including Access, dBase, DB2, Excel, and Text. In addition to the ODBC
    software, a separate module or driver is needed for each database to be accessed.


    The main of ODBC programming support is Microsoft.


    # Type 2: JDBC-Native API


    In a Type 2 driver, JDBC API calls are converted into native C/C++ API calls,
    which are unique to the database.


    These drivers are typically provided by the database vendors and used in the same
    manner as the JDBC-ODBC Bridge. The vendor-specific driver must be installed on
    each client machine.


    The Native API driver uses the client-side libraries of the database. The driver
    converts JDBC method calls into native calls of the database API. It is not written
    entirely in Java.


    # Type 3: . Network Protocol driver / JDBC-Net pure Java


    In a Type 3 driver, a three-tier approach is used to access databases. The JDBC
    clients use standard network sockets to communicate with a middleware application
    server.


    The socket information is then translated by the middleware application server
    into the call format required by the DBMS, and forwarded to the database server.


    # Type 4: . Fully Java Driver


    This is the highest performance driver available for the database and is usually
    provided by the vendor itself.'
