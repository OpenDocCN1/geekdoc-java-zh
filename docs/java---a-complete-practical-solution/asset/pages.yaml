    85. Why would it be more secure to store sensitive data (such as a password, social
    security number, and so on) in a character array rather than a String?


    Answer:


    In Java, Strings are immutable and stored in the String pool. What this means
    is that, once a String is created, it stays in the pool in memory until being
    garbage collected.


    Therefore, even after you''re done processing the string value (e.g., the password),
    it remains available in memory for an indeterminate period of time thereafter
    (again, until being garbage collected) which you have no real control over.


    Therefore, anyone having access to a memory dump can potentially extract the sensitive
    data and exploit it. In contrast, if you use a mutable object like a character
    array, for example, to store the value, you can set it to blank, once done with
    confidence that it will no longer be retained in memory.


