  md: '# JSP


    JSP technology is used to create web application just like Servlet technology.


    This can also be used to access JavaBeans objects.

    The jsp pages are easier to maintain than servlet because we can separate designing
    and development.

    It provides some additional features such as Expression Language, Custom Tag etc.

    We can share information across pages using request and response objects.

    JSP can be used for separation of the view layer with the business logic in the
    web application.

    If JSP page is modified, we don''t need to recompile and redeploy the project.

    The servlet code needs to be updated and recompiled if we have to change the look
    and feel of the application.


    JSP scripting Element:


    +   1. scriptlet tag <% ......... %>

    2. expression tag <%= ......... %>

    3. declaration tag <%!........ %>


