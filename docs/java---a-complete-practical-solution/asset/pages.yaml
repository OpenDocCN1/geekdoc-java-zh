  md: '# SERVLET


    After the Web began to be used for delivering services, service providers recognized
    the need for dynamic content.


    Developers investigated using the server platform for the same purpose. Common
    Gateway Interface (CGI) server-side scripts were the main technology used to generate
    dynamic content.


    But, CGI scripting technology had many shortcomings, including platform dependence
    and lack of scalability.


    To address these limitations, Java Servlet technology was created as a portable
    way to provide dynamic, user-oriented content.

    Servlet can be described as:


    +   - Servlet is a technology, used to create web application.

    - Servlets have access to the entire family of Java APIs, including the JDBC API
    to access enterprise databases.

    - Servlets execute within the address space of a Web server. It is not necessary
    to create a separate process to handle each client request.

    - A servlet is a Java programming class used to extend the capabilities of servers
    that host applications accessed by means of a request-response programming model.

    - Servlets are platform-independent because they are written in Java.

    - Servlet is a class that extends the capabilities of the servers and responds
    to the incoming requests. It can respond to any type of requests.


    CGI technology enables the web server to call an external program and pass HTTP
    request information to the external program to process the request. For each request,
    it starts a new process.


    A number of Web Servers that support servlets are available in the market. Some
    web servers are freely downloadable and Tomcat is one of them.


    The javax.servlet package contains many interfaces and classes that are used by
    the servlet or web container.


    The javax.servlet.http package contains interfaces and classes that are responsible
    for http requests only.'
