  md: "# 4. MAC Address\n\nMedia Access Control (MAC) Address is a unique identifier\
    \ of Network Interface Controller (NIC). A network node can have multiple NICs\
    \ but each with unique MAC.\n\n# 5.Connection-oriented and connection-less protocol\n\
    \nIn connection-oriented protocol, acknowledgement is sent by the receiver. So,\
    \ it is reliable but slow.\nIn connection-less protocol, acknowledgement is not\
    \ sent by the receiver. So it is not reliable but fast.\n\n# 6. Socket\n\nA socket\
    \ is an endpoint between two way communication.\n\nThe java.net package provides\
    \ support for the two common network protocols:\n\nTCP: Transmission Control Protocol\
    \ (TCP), which allows for reliable communication between two applications. TCP\
    \ is typically used over the Internet Protocol, which is referred to as TCP/IP.\n\
