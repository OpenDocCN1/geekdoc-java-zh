  md: '# INHERITANCE:


    Inheritance can be defined as the process where one class acquires the properties
    (methods and fields) of another.

    extends is the keyword used to inherit the properties of a class.


    # Super


    +   - The super keyword

    - It is used to differentiate the members of superclass from the members of subclass,
    if they have same names.

    - It is used to invoke the superclass constructor from subclass.


    # Overriding


    If a class inherits a method from its super class, then there is a chance to override
    the method provided that it is not marked finalnThe benefit of overriding is:
    ability to define a behaviour that''s specific to the subclass type which means
    a subclass can implement a parent class based on its requirement.


    Rules for method overriding:


    +   - The argument list should be exactly the same as that of the overridden method.

    - The return type should be the same or a subtype of the return type declared
    in the original overridden method in the superclass.

    - The access level cannot be more restrictive than the overridden method''s access
    level. For example: if the superclass method is declared public then the overriding
    method in the sub class cannot be either private or protected.

    - Instance methods can be overridden only if they are inherited by the subclass.'
