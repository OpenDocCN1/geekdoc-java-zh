  md: '# MULTITHREADING


    Multithreading is a process of executing multiple threads simultaneously.

    A multi-threaded program contains two or more parts that can run concurrently
    and each part can handle a different task at the same time.


    Threads share a common memory area. They don''t allocate separate memory area
    so, saves memory, and context-switching between the threads takes less time than
    process.


    There are two ways to create a thread:


    +   1. By extending Thread class

    2. By implementing Runnable interface.


