  md: '# COLLECTION AND GENERICS


    A Collection is a group of individual objects represented as a single unit.

    Java provides Collection Framework which defines several classes and interfaces
    to represent a group of objects as a single unit.


    The Collection interface (java.util.Collection) and Map interface (java.util.Map)
    are two main root interfaces of Java collection classes.


    Collections in Java is a framework that provides an architecture to store and
    manipulate the group of objects.


    All the operations that you perform on a data such as searching, sorting, insertion,
    manipulation, deletion, and so on can be performed by Java Collections easily.


    All collections frameworks contain the following:


    +   **Interfaces**: These are abstract data types that represent collections.
    Interfaces allow collections to be manipulated independently of the details of
    their representation. In object-oriented languages, interfaces generally form
    a hierarchy.

    **Implementations, i.e., Classes**: These are the concrete implementations of
    the collection interfaces. they are reusable data structures.

    **Algorithms**: These are the methods that perform useful computations, such as
    searching and sorting, on objects that implement collection interfaces. The algorithms
    are said to be polymorphic; that is, the same method can be used on many different
    implementations of the appropriate collection interface.


    Java Collection framework provides many interfaces (Set, List, Queue, Deque, and
    so on) and classes (ArrayList, Vector, LinkedList, PriorityQueue, HashSet, LinkedHashSet,
    TreeSet and so on).


    Generics helps us to create a single class, which can be useful to operate on
    multiple data types. A class, interface or a method that operates on a parameterized
    type is called generics class, interface or method. Generics adds type safty.


    Remember that generics only works on objects, not primitive types.'
