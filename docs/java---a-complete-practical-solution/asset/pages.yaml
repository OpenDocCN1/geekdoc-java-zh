    # 28. What is Life cycle of a servlet?


    Answer:


    +   Following are the stages of servlet life cycle:

    1) Loading of Servlet class: The servlet container finds the servlet class mentioned
    in web.xml file and loads it.

    2) Servlet instantiation: The object of servlet class gets created in this phase.

    3) Initialization: Servlet initialization by calling init() method.

    4) Servicing the request: In this phase of the servlet service the client request
    by calling the service() method.

    5) Destroy: Last phase of servlet life cycle. The destroy() method free up the
    servlet instance so that it can be garbage collected.


    # 29. Why Servlet is better than CGI?


    Answer:


    Servlet responses faster than CGI because it uses the multithreading concept to
    service each request.

    CGI performance is not as good as it creates a new object for each request while
    servlet allot a new thread for each request.

    Memory consumption is low in servlet compared to CGI.


