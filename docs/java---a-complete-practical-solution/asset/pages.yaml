  md: '# APPLET


    Applet is a Java program which can be embed in webpage and inside the browser
    and works at client side.


    # Lifecycle of Java Applet


    +   1. Applet is initialized. (init())

    2. Applet is started. (start())

    3. Applet is painted. (paint())

    4. Applet is stopped. (stop())

    5. Applet is destroyed. (destroy())


    # AWT package:


    AWT stands for Abstract window toolkit.

    Graphics: color, font etc.

    UI components: Button, TextField, List etc.

    Layouts: FlowLayout,BorderLayout( for arranig objects/controls)

    Container: Frame, Dialog, Panel

    Events:Listener – ActionListener, MouseListener,WindowListener etc.

    Listener: Listener listen the event which associated with the application.

    This can be context or session of the application. Listener gives us a great control
    over application without touching architecture of the application.


