    # RMI, Border in Swing component, LookAndFeel etc.


    213. What is RMI?


    # Remote Method Invocation (RMI)


    The RMI is an API that provides a mechanism to create distributed application
    in java.


    The RMI allows an object to invoke methods on an object running in another JVM.

    The RMI provides remote communication between the applications using two objects
    stub and skeleton.


    The RMI is distributed application because :


    +   1. The application need to locate the remote method.

    2. It need to provide the communication with the remote objects.

    3. The application need to load the class definitions for the objects.


    214. What is pluggable Look and feel?


    Java Swing provides pluggable look and feel ( PL&F) capability that allows swing
    GUI to change appearance based on the programmers customized look and feel setting.

    Each Java runtime has a UIManager object that determines the look and feel of
    the Swing components.


