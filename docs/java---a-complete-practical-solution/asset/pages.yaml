  md: '# MAGIC CODE : BYTECODE:


    Java Byte Code is the language to which Java source is compiled and the Java Virtual
    Machine understands. Unlike compiled languages that have to be specifically compiled
    for each different type of computers, a Java program only needs to be converted
    to byte code once, after which it can run on any platform for which a Java Virtual
    Machine exists.


    Bytecode is a set of instruction designed to be executed by the java run time
    system, which is called JVM. JVM is an interpreter of bytecode.


    # Features of Java:


    +   * Simple

    * Secure

    * Platform Independent

    * Object Oriented

    * Robust

    * Portable

    * Dynamic

    * Multithreaded

    * Compiled and interpreted both Supports networking

    * High Performance

    * Distributed

    * Architecture Neutral'
