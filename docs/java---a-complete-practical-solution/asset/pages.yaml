  md: '# NETWORKING


    Networking refers to the concept of connecting more than two devices to share
    resources


    Java socket programming provides facility to share data between different computing
    devices.


    The widely used Java networking terminologies are given as follows:


    +   1. IP Address

    2. Protocol

    3. Port Number

    4. MAC Address

    5. Connection-oriented and connection-less protocol

    6. Socket


    +   1. IP Address

    IP address is a unique number assigned to a node of a network e.g. 192.168.0.1
    . It is composed of octets that range from 0 to 255. It has 5 classes A to E.
    It is a logical address that can be changed.


    +   2. Protocol

    A protocol is a set of rules , followed for communication.

    TCP

    FTP

    Telnet

    SMTP

    POP etc.


    +   3. Port Number

    The port number is used to uniquely identify different applications. It acts as
    a communication endpoint between applications.

    The port number is associated with the IP address for communication between two
    applications.'
