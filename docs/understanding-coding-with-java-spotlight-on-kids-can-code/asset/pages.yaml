- pgno: 11
  md: '# Learn the Rules


    Before you can begin using a programming language or writing code, you need to
    know that computer programming is about following rules. Knowing these rules will
    help you create a program that runs without errors. They will also help other
    programmers read and understand your programs.


    ![](img/08bcf051ae32d63af14aba42d7934d6b_11_0.png)'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'Rule 1: Coders must know what they want the computer to do and write a plan.


    Rule 2: Coders must use special words called commands to have the computer accept
    input, make choices, and take action.


    Rule 3: Coders need to think about what tasks can be put into a group.


    Rule 4: Coders need to employ logic using AND, OR, NOT, and other key words.


    Rule 5: Coders must explore the environment and understand how it works.


    Once you understand these rules, you''ll be ready to learn more about Java and
    other programming languages.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Getting Started


    The first step for learning Java is setting up your environment. You can use a
    text editor or an integrated development environment (IDE). An IDE is software
    in which you can write your programs and practice running them. One advantage
    of some IDEs is that you can use tutorials. Some IDEs can check your work with
    testing and diagnostic tools, which act like spell check for programmers.


    You also need to make sure you have downloaded Java Development Kit (JDK) to your
    computer. JDK is free to download for any platform. After you start a new project,
    make sure you name it carefully to reflect what you want to do, use the file extension
    "java", and save it.


    You can use a number of different text editors and IDEs to create a program using
    Java. Some popular free IDEs are NetBeans, Eclipse, and IntelliJ Edit'
  merge: -1
  img_proc: true
