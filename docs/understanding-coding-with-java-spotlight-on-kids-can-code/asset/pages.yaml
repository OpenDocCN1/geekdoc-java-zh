- pgno: 9
  md: '# # What Is Java?


    Java is an object-oriented programming (OOP) language, which means it focuses
    on objects. Objects in Java are similar to physical items in real life. These
    objects can be named, described, changed, and used in different ways. When you
    write a program in Java, you start with naming an object within a class and then
    decide what to do with it from there.


    Coding with Java is a little like building a LEGO kit. In a new LEGO kit, you
    get lots of different pieces, which are like Java objects. An object''s state
    is what it''s like. In the same way, LEGO bricks may have different colors or
    different numbers of studs.


    Object behaviors are represented as methods or functions. Some LEGO bricks can
    be used to make things move or create a more stable construction. In the same
    way, objects can do different things and behave in different ways depending on
    their methods or functions.'
  merge: -1
  img_proc: true
