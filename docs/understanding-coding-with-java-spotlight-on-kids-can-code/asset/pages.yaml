- pgno: 23
  md: '# Java Programs


    Once you create your first program, you may start to wonder what other programs
    you can create using Java. Some of the most basic programs you can create with
    Java can store information and do math operations. You can save a person''s name
    after they type it into your program. You can create a program to add up your
    purchases and then calculate the tax if you''re purchasing something in an application.


    Another type of program follows certain steps when conditions are met. When you
    are playing a game, you might be collecting coins to level up. That program is
    waiting for certain conditions to be met in order to run another line of code.


    ![](img/08bcf051ae32d63af14aba42d7934d6b_23_0.png)'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Java Data Types


    **boolean**: used for true and false data only


    **int**: a data type used for numbers ranging from -2,147,483,648 to 2,147,483,647


    **byte**: used for smaller numbers from -128 to 127


    **long**: a data type used for numbers ranging from -9,223,372,036,854,775,808
    to 9,223,372,036,854,775,807


    **char**: used for a single character, like a letter or a symbol


    **short**: used for slightly larger numbers from -32,768 to 32,767


    **double**: used for very large numbers with decimal points


    **float**: used for numbers that have a decimal point


    # Java Math Operations


    +   * used for multiplication

    * used for division

    * used for division with a remainder

    * used for addition

    * used for subtraction

    * == used when two numbers are equal

    * used when two numbers are unequal


    +   * used when the first number is less than

    * used when the first number is greater than

    * <= used when the first number is less than or equal to

    * >= used when the first number is greater than or equal to


    ![](img/08bcf051ae32d63af14aba42d7934d6b_24_0.png)'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Good Programming


    When creating a program with Java, make sure you add comments. Comments supply
    programmers with information about the program they want to run, such as the name
    of its creator or what the code does. Comments will be helpful to you and to anyone
    who might want to use one of your programs by starting a line with "//."


    Good programmers know that sometimes programs don''t work on the first try. If
    you practice writing programs and read through other people''s programs, you''ll
    get better.


    Many different companies all over the world use Java because it can be used to
    create many different things and is easy to use. Learning Java is a great way
    to begin a career in computer science.


    ![](img/08bcf051ae32d63af14aba42d7934d6b_25_0.png)'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Glossary


    **application**: A software program that runs on a computer, smartphone, tablet,
    or web browser.


    **command**: A code or message that tells a computer to do something.


    **data type**: The type of data that can be stored in a variable.


    **diagnostic**: Used to locate issues in a program.


    **environment**: The combination of computer hardware and software that allows
    a user to perform various tasks.


    **file extension**: The letters and numbers that make up the last part of a file
    name, such as .docx or .txt.


    **function**: Part of a program that performs a specific task.


    **input**: Information that is put into a computer.


    **logic**: A proper or reasonable way of thinking about or understanding something.


    **method**: A procedure, or list of tasks, associated with a class.


    **tutorial**: A book or guided program that provides information about a specific
    topic.


    **variable**: A placeholder value that can change depending on conditions or other
    information passed to the program.'
