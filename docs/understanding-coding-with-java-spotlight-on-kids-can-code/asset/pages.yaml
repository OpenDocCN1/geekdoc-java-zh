- pgno: 17
  md: '# Variables and Data Types


    **A variable** is where objects or information is placed. This information can
    be letters, numbers, or other characters. To use a variable in your program, you
    have to give it a name first (such as "tax") and then define it with a data type.


    When working with numbers, you use the data types "int," "long," "float," and
    "double." The data type "int," is short for "interger," which is used for smaller
    whole numbers. The data type "long" is used for very large whole numbers; "float"
    is used for numbers with a decimal point; and "double" is used for very large
    numbers with a decimal point.


    If we want our program to calculate the cost of an item with sales tax added,
    we might use a variable named "tax" and the variable data type "float."


    ```

    Java''s many different variables store information. Some of the most basic variables
    in Java are known as primitives. These include "byte," "short," "int," "long,"
    "float," "double," "char," and "boolean."

    ```'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Breaking the Code


    When naming variables, you need to write the names without spaces.mers use naming
    systems such as CamelCase or snake_case instead of spaces between the words in
    their variable names. CamelCase uses uppercase letters for each word like humps
    on a camel. Snake_case uses an underscore to connect words. It''s important to
    remember exactly how you name your variables and programs because they won''t
    run if you don''t type them with the same uppercase and lowercase letters you
    used to create them.


    ![](img/08bcf051ae32d63af14aba42d7934d6b_18_0.png)'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Hello World!


    Hello World is a basic program that tells the computer to print, or display, the
    text “Hello world!" To write this program, you first have to create a new project
    in your IDE or text editor and name your project “HelloWorld.java".


    Next, you will create a class that explains the purpose of your program. Then,
    write out your main method, which is the first line of code that is executed when
    the program is run. The main method in Java is like a list of things to do: The
    following words are always used in the main method: “public static void main(String
    [ ] args){”. The last line of this program is a print line, which tells the computer
    to print the words “Hello world!" one time for each time the program is run. This
    means the words will be typed out on the screen or terminal where the program
    is being run.'
  merge: -1
  img_proc: true
