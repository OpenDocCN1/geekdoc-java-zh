- pgno: 21
  md: '# Java and Minecraft


    Java is easier to understand than some programming languages and can be used on
    computers, gaming systems, smartphones, and tablets. Because it''s one of the
    most popular programming languages, it''s widely used to create web and desktop
    applications and design games as Minecraft.


    Minecraft is a popular sandbox construction game created using Java. This type
    of game allows users freedom to make decisions about where to go and what to do.
    Java was a good programming language to use to create Minecraft because it''s
    easy to use with different computer operating systems, such as Windows, macOS,
    and Linux. Minecraft is also available on some gaming systems and pocket gaming
    devices, but those versions were written with C++ programming language.


    > Minecraft is just one example of a real-world application of Java.'
  merge: -1
  img_proc: true
