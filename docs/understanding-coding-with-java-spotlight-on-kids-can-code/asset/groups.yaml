    # Introduction to Java


    Imagine you''re walking down the toy aisle trying to choose what toy you want
    for your birthday. There are so many choices! How will you decide which one to
    buy? When choosing a programming language to use, there are almost as many choices
    as there are toys in the toy store. You might think of Java as a toy car. You
    can find a toy car in any toy store and Java is one of the most common programming
    languages.


    Java is not only used to create programs on the Internet but also a variety of
    smartphone applications. Java is used to create most Android applications. You
    may be surprised how many devices and applications you encounter every day run
    with the help of Java. However, if you try Java and it isn''t your favorite programming
    language, there are many others to choose from.'
  - '[PAGE 8]


    Choosing a programming language can be hard when there are so many options. Consider
    what you''d like to create and choose from the programming languages that best
    fit the job.


    5'
  - '[PAGE 9]


    # # What Is Java?


    Java is an object-oriented programming (OOP) language, which means it focuses
    on objects. Objects in Java are similar to physical items in real life. These
    objects can be named, described, changed, and used in different ways. When you
    write a program in Java, you start with naming an object within a class and then
    decide what to do with it from there.


    Coding with Java is a little like building a LEGO kit. In a new LEGO kit, you
    get lots of different pieces, which are like Java objects. An object''s state
    is what it''s like. In the same way, LEGO bricks may have different colors or
    different numbers of studs.


    Object behaviors are represented as methods or functions. Some LEGO bricks can
    be used to make things move or create a more stable construction. In the same
    way, objects can do different things and behave in different ways depending on
    their methods or functions.'
  - '[PAGE 10]


    LEGO instructions that help you build a toy are simlar to a class in Java. A class
    is a design plan that helps you build something.'
  - '[PAGE 11]


    # Learn the Rules


    Before you can begin using a programming language or writing code, you need to
    know that computer programming is about following rules. Knowing these rules will
    help you create a program that runs without errors. They will also help other
    programmers read and understand your programs.


    ![](img/08bcf051ae32d63af14aba42d7934d6b_11_0.png)'
  - '[PAGE 12]


    Rule 1: Coders must know what they want the computer to do and write a plan.


    Rule 2: Coders must use special words called commands to have the computer accept
    input, make choices, and take action.


    Rule 3: Coders need to think about what tasks can be put into a group.


    Rule 4: Coders need to employ logic using AND, OR, NOT, and other key words.


    Rule 5: Coders must explore the environment and understand how it works.


    Once you understand these rules, you''ll be ready to learn more about Java and
    other programming languages.'
  - '[PAGE 13]


    # Getting Started


    The first step for learning Java is setting up your environment. You can use a
    text editor or an integrated development environment (IDE). An IDE is software
    in which you can write your programs and practice running them. One advantage
    of some IDEs is that you can use tutorials. Some IDEs can check your work with
    testing and diagnostic tools, which act like spell check for programmers.


    You also need to make sure you have downloaded Java Development Kit (JDK) to your
    computer. JDK is free to download for any platform. After you start a new project,
    make sure you name it carefully to reflect what you want to do, use the file extension
    "java", and save it.


    You can use a number of different text editors and IDEs to create a program using
    Java. Some popular free IDEs are NetBeans, Eclipse, and IntelliJ Edit'
