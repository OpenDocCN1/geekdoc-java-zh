    # Glossary


    **application**: A software program that runs on a computer, smartphone, tablet,
    or web browser.


    **command**: A code or message that tells a computer to do something.


    **data type**: The type of data that can be stored in a variable.


    **diagnostic**: Used to locate issues in a program.


    **environment**: The combination of computer hardware and software that allows
    a user to perform various tasks.


    **file extension**: The letters and numbers that make up the last part of a file
    name, such as .docx or .txt.


    **function**: Part of a program that performs a specific task.


    **input**: Information that is put into a computer.


    **logic**: A proper or reasonable way of thinking about or understanding something.


    **method**: A procedure, or list of tasks, associated with a class.


    **tutorial**: A book or guided program that provides information about a specific
    topic.


    **variable**: A placeholder value that can change depending on conditions or other
    information passed to the program.'
