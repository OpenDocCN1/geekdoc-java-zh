    # Introduction to Java


    Imagine you''re walking down the toy aisle trying to choose what toy you want
    for your birthday. There are so many choices! How will you decide which one to
    buy? When choosing a programming language to use, there are almost as many choices
    as there are toys in the toy store. You might think of Java as a toy car. You
    can find a toy car in any toy store and Java is one of the most common programming
    languages.


    Java is not only used to create programs on the Internet but also a variety of
    smartphone applications. Java is used to create most Android applications. You
    may be surprised how many devices and applications you encounter every day run
    with the help of Java.


    Choosing a programming language can be hard when there are many options.


    # What Is Java?


    Java is an object-oriented language (OOP), which means it focuses on objects.
    Objects are similar to real life. When you start a project, the first thing to
    do is create a class. A class describes how objects will behave. Java has some
    classes that are already created, but you can also create your own. Java is used
    to create programs on the Internet but also a variety of smartphone applications.
    Java is used to create most Android applications. You may be surprised how many
    devices and applications you encounter every day run with the help of Java.


    # Learn the Rules


    Before you can begin using Java, you need to know the rules. Knowing these rules
    will help you create a program without errors.


    - Rule 1: Coders must know what they want to do.

    - Rule 2: Coders must use special words called commands.

    - Rule 3: Coders need to think about a group.

    - Rule 4: Coders must use logic using AND, OR, NOT.

    - Rule 5: Coders must explore how it works.


    # Getting Started


    The first step for learning Java is setting up your environment. You can use a
    text editor or an integrated development environment (IDE). An IDE is software
    in which you can write and test programs. One advantage of some IDEs is that they
    check your work.


    You also need to make sure you have downloaded Java Development Kit (JDK) to your
    computer. JDK is free to download for any platform. After you start a new project,
    make sure you name it carefully, use the extension .java, and save it.


    You can use a number of different text editors and IDEs to create programs. Some
    popular IDEs are:

    - NetBeans

    - Eclipse

    - IntelliJ


