  - '[PAGE 15]


    # Fundamentals


    Like learning a new spoken language, learning a programming language can be difficult.
    However, if you break it down into parts, you will see how those parts fit together
    to make a program.


    Java code is made up of a combination of letters, numbers, and other characters.
    The order of these elements is very important. Each character must be in the correct
    order for your program to run properly. Any mistakes in your code will produce
    errors. It is good practice to always check your work, just like you would for
    a math problem.


    When you start a new project, the first thing to do is create a class. A class
    describes how objects (such as letters, words, and numbers) will behave. Java
    has some classes that are already created, but you can also create your own.


    # Breaking the Code


    Java uses white space to make code easier to read and to group parts of code that
    are related. White space is just what it sounds like—any blank space where you
    do not see characters. White space is created using spaces, tabs, and enter/return.
    Java knows to ignore this white space and focus on the commands in the code. There
    are some rules about where to put space and how much space to use between certain
    parts of a program. However, a program will run with or without white space.'
