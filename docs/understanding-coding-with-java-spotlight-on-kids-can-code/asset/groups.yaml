    # Good Programming


    When creating a program with Java, make sure you add comments. Comments supply
    programmers with information about the program they want to run, such as the name
    of its creator or what the code does. Comments will be helpful to you and to anyone
    who might want to use one of your programs by starting a line with "//."


    Good programmers know that sometimes programs don''t work on the first try. If
    you practice writing programs and read through other people''s programs, you''ll
    get better.


    Many different companies all over the world use Java because it can be used to
    create many different things and is easy to use. Learning Java is a great way
    to begin a career in computer science.


