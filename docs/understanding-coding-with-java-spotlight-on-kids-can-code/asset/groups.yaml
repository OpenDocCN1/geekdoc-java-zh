    \n# 变量与数据类型\n\n**变量**是放置对象或信息的地方。这些信息可以是字母、数字或其他字符。在程序中使用变量时，你必须先给它起一个名字（例如“tax”），然后用数据类型来定义它。\n\
    \n在处理数字时，你会使用 `int`、`long`、`float` 和 `double` 数据类型。`int` 类型是 `integer`（整数）的缩写，用于较小的整数。`long`\
    \ 类型用于非常大的整数；`float` 用于带有小数点的数字；而 `double` 用于带有小数点的非常大的数字。\n\n如果我们让程序计算包含销售税的物品成本，我们可能会使用一个名为“tax”的变量和数据类型\
    \ `float`。\n\n```java\nJava 的许多不同变量存储信息。Java 中最基础的变量被称为原始类型（primitives）。这些包括 \"\
    byte\"、\"short\"、\"int\"、\"long\"、\"float\"、\"double\"、\"char\" 和 \"boolean\"\
    。\n\n# 代码规范\n\n命名变量时，你需要编写不带空格的名字。程序员使用驼峰命名法（CamelCase）或蛇形命名法（snake_case）等命名系统，而不是在变量名的单词之间使用空格。CamelCase\
    \ 在每个单词的首字母使用大写，就像驼背上的峰一样。Snake_case 使用下划线连接单词。准确记住你是如何命名变量和程序的非常重要，因为如果你输入的字母大小写与你创建它们时使用的不相同，它们将无法运行。\n\
    \n![](img/08bcf051ae32d63af14aba42d7934d6b_18_0.png)\n\n# 你好世界！\n\nHello World\
    \ 是一个基础程序，告诉计算机打印或显示文本“Hello world!”要编写此程序，你首先必须在你的 IDE 或文本编辑器中创建一个新项目，并命名为“HelloWorld.java”。\n\
    \n接下来，你将创建一个类来解释程序的目的。然后，编写你的主方法（main method），它是程序运行时执行的第一行代码。Java 中的主方法就像一个待办事项列表：主方法中始终使用以下单词：`public\
    \ static void main(String [] args){`。程序的最后一行是打印行，它告诉计算机在程序每次运行时都打印一次“Hello world!”。这意味着这些词将在运行程序的屏幕或终端上显示。\n\
    \n```java\npublic class HelloWorld {\n\n    public static void main(String[] args)\
    \ {\n        System.out.println(\"Hello world!\");\n    }\n}\n```\n\nHelloWorld\
    \ [Java 应用] /Library/Java/VirtualMachines/jdk8.0.111/jdk/Contents/Home\nHello\
    \ world! 这个“Hello World”程序是在 Eclipse 中编写的。代码行 `System.out.println(\"Hello world!\"\
    )` 是主方法，它将在控制台中打印该行文本。\n\n![](img/08bcf051ae32d63af14aba42d7934d6b_20.png)\n\n\
    # Java\n\nJava 比某些编程语言更容易理解，并且可以用于很多事情。Java 比某些编程语言更容易理解，并且可以用于很多事情。Java 比某些编程语言更容易理解，并且可以用于很多事情。Java\
    \ 比某些编程语言更容易理解，并且可以用于很多事情。\n\n*(注：原文中该段存在大量重复和乱码，此处已根据要求精简了可读的逻辑描述。)*\n\n# Java\
    \ 运算\n\n- 乘法\n- 除法\n- 余数\n- 加法\n- 减法\n- 等于\n- 不等于\n- 小于\n- 大于\n- 小于或等于\n- 大于或等于\n\
    \n![](img/08bcf051ae32d63af14aba42d7934d6b_24.png)\n\n# 良好的编程\n\n在创建 Java 程序时，确保你添加了注释。注释为程序员提供有关程序的信息，例如创建者的名字或代码的功能。对于任何可能想使用你的程序的人来说，注释将非常有帮助。\n\
    \n良好的程序员知道，有时程序第一次尝试并不运行。如果你练习编写程序并阅读其他人的程序，你会变得更好。\n\n世界各地许多公司使用 Java，因为它可以用于许多不同的事情而且易用。学习\
    \ Java 是开启计算机科学职业的很好的开始。\n\n# 词汇表\n\n**应用程序 (application)**：运行在计算机、手机、平板电脑或浏览器上的软件程序。\n\
    \n**命令 (command)**：告诉计算机执行某些操作的代码或消息。\n\n**数据类型 (data type)**：存储在变量中的数据类型。\n\n\
    **诊断 (diagnostic)**：用于定位程序中的问题。\n\n**环境 (environment)**：计算机硬件和软件的结合，允许用户执行各种任务。\n\
    \n**文件扩展名 (file extension)**：构成文件名最后部分的字母和数字，例如 .docx 或 .txt。\n\n**函数 (function)**：执行特定任务程序部分。\n\
    \n**输入 (input)**：输入计算机的信息。\n\n**逻辑 (logic)**：思考或理解某事的正确或合理的方法。\n\n**方法 (method)**：与类相关的过程或任务列表。\n\
    \n**教程 (tutorial)**：提供特定主题信息的书籍或引导程序。\n\n**变量 (variable)**：可以根据条件或传递给程序的其他信息而改变的占位值。\n"
