    # Java and Minecraft


    Java is easier to understand than some programming languages and can be used on
    computers, gaming systems, smartphones, and tablets. Because it''s one of the
    most popular programming languages, it''s widely used to create web and desktop
    applications and design games as Minecraft.


    Minecraft is a popular sandbox construction game created using Java. This type
    of game allows users freedom to make decisions about where to go and what to do.
    Java was a good programming language to use to create Minecraft because it''s
    easy to use with different computer operating systems, such as Windows, macOS,
    and Linux. Minecraft is also available on some gaming systems and pocket gaming
    devices, but those versions were written with C++ programming language.


    > Minecraft is just one example of a real-world application of Java.'
  - '[PAGE 22]


    ![](img/08bcf051ae32d63af14aba42d7934d6b_22_0.png)'
  - '[PAGE 23]


    # Java Programs


    Once you create your first program, you may start to wonder what other programs
    you can create using Java. Some of the most basic programs you can create with
    Java can store information and do math operations. You can save a person''s name
    after they type it into your program. You can create a program to add up your
    purchases and then calculate the tax if you''re purchasing something in an application.


    Another type of program follows certain steps when conditions are met. When you
    are playing a game, you might be collecting coins to level up. That program is
    waiting for certain conditions to be met in order to run another line of code.


    ![](img/08bcf051ae32d63af14aba42d7934d6b_23_0.png)'
  - '[PAGE 24]


    # Java Data Types


    **boolean**: used for true and false data only


    **int**: a data type used for numbers ranging from -2,147,483,648 to 2,147,483,647


    **byte**: used for smaller numbers from -128 to 127


    **long**: a data type used for numbers ranging from -9,223,372,036,854,775,808
    to 9,223,372,036,854,775,807


    **char**: used for a single character, like a letter or a symbol


    **short**: used for slightly larger numbers from -32,768 to 32,767


    **double**: used for very large numbers with decimal points


    **float**: used for numbers that have a decimal point


    # Java Math Operations


    +   * used for multiplication

    * used for division

    * used for division with a remainder

    * used for addition

    * used for subtraction

    * == used when two numbers are equal

    * used when two numbers are unequal


    +   * used when the first number is less than

    * used when the first number is greater than

    * <= used when the first number is less than or equal to

    * >= used when the first number is greater than or equal to


    ![](img/08bcf051ae32d63af14aba42d7934d6b_24_0.png)'
