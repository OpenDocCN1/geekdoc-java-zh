    # Java 简介


    想象你正在走在玩具过道，试图为你的生日挑选想要的玩具。有太多选择了！你将如何决定买哪一个呢？在选择要使用的编程语言时，选择几乎和玩具店里的玩具一样多。你可以把
    Java 想成一辆玩具汽车。你可以在任何玩具店找到玩具汽车，而 Java 是最常用的编程语言之一。


    Java 不仅用于创建互联网上的程序，还用于各种智能手机应用程序。大多数 Android 应用都是使用 Java 创建的。你可能会惊讶每天遇到的多少设备和应用程序是在
    Java 的帮助下运行的。


    当有很多选项时，选择编程语言可能是困难的。


    # 什么是 Java？


    Java 是一种面向对象的语言（OOP），这意味着它关注对象。对象类似于现实生活。当你开始一个项目时，要做的第一工作是创建一个类。类描述了对象将如何行为。Java
    已经创建了一些类，但你也可以创建自己的类。Java 用于创建互联网上的程序，还用于各种智能手机应用程序。Java 用于创建大多数 Android 应用。你可能会惊讶你每天遇到的多少设备和应用程序是在
    Java 的帮助下运行的。


    # 学习规则


    在开始使用 Java 之前，你需要了解规则。了解这些规则将帮助你创建无错误的程序。


    - 规则 1：编码者必须知道他们想做什么。

    - 规则 2：编码者必须使用被称为“命令”的特殊单词。

    - 规则 3：编码者需要考虑“组”。

    - 规则 4：编码者必须使用逻辑，使用 AND、OR、NOT。

    - 规则 5：编码者必须探索它是如何工作的。


    # 入门


    学习 Java 的第一步是搭建你的环境。你可以使用文本编辑器或集成开发环境（IDE）。IDE 是你可以在其中编写和测试程序的软件。某些 IDE 的优势之一是它们会检查你的工作。


    你还需要确保已向电脑下载了 Java 开发工具包（JDK）。JDK 任何平台均免费下载。当你启动新项目后，请确保仔细命名，使用 .java 扩展名并保存。


    你可以使用多种不同的文本编辑器和 IDE 创建程序。一些流行的 IDE 包括：

    - NetBeans

    - Eclipse

    - IntelliJ



