  raw: 'angular.isDefined( ) tests a value to see if it has been defined, returns
    true if the value has been defined.


    ## Example 8.10


    ## <html>


    ## <script src= "js\angular.min.js"></script>


    ## <body>


    ## <script>   


    ## var futureCar;


    ## var existingCar = "Very Good!";  


    ## document.write(angular.isDefined(futureCar) + " ");   


    ## document.write(angular.isDefined(existingCar) + " ");      


    ## </script>


    ## </body>


    ## </html>


    ## Output:


    false  true


    ## Explanation:


    “futureCar” has not been defined. Therefore, isDefined(futureCar) returns false.


    “existingCar” has been defined. Therefore, isDefined(existingCar) returns true.


    isUndefined( )


    angular.isUndefined( ) tests a value to see if it has not been defined, returns
    true if the value has not been defined.


    ## Example 8.11


    <html>


    <script src= "js\angular.min.js"></script>


    <body>


    <script>   


    var futureCar;


    var existingCar = "Very Good!";  


    document.write(angular.isUndefined(futureCar) + " ");   


    document.write(angular.isUndefined(existingCar) + " ");      


    </script>


    </body>


    </html> 


    ## Output:


    true  false


    ## Explanation:


    “futureCar” has not been defined. Therefore, isUndefined(futureCar) returns true.


    “existingCar” has been defined. Therefore, isUndefined(existingCar) returns false.


    ## Summary


    “var myModule = angular.module(''myApplication'', [ ])” creates a new module “myModule”
    with “myApplication”.


    “myModule.controller(''myController'', function($scope)” adds the controller''s
    constructor to the module using the controller( ) method, makes myController belongs
    to myModule.


    $scope is defined as an object.


    angular.uppercase( ) converts a string to uppercase.


    angular.lowercase( ) converts a string to lowercase.


    isString( ) tests a value to see if it is a string, returns true if the value
    is a string.


    isNumber( ) tests a value to see if it is a number, returns true if the value
    is a number.


    isDate( ) tests a value to see if it is a Date object, returns true if the value
    is a Date Object.


    isFunction( ) tests a value to see if it is a function, returns true if the value
    is a function.


    isElement( ) tests a value to see if it is a Dom element, returns true if the
    value is a Dom element.


    isObject( ) tests a value to see if it is an object, returns true if the value
    is an object.


    isDefined( ) tests a value to see if it has been defined, returns true if the
    value has been defined.


    isUndefined( ) tests a value to see if it has not been defined, returns true if
    the value has not been defined.


    Hands-On Project


    ## Module Sample


    Open Notepad, write AngularJS codes:


    <!DOCTYPE html>


    <html>


    <script src= "js\angular.min.js"></script>


    <body>


    <div ng-app="myApplication"


    ng-controller="myController">


    Height:


    <p><input type="number" ng-model="height"></p>


    Length:


    <p><input type="number" ng-model="length"></p>


    <br>


    Area of a Triangle:


    <h4><p>{{(height * length)/2}}</p></h4>


    </div>


    <script>


    var app = angular.module(''myApplication'', [ ]);


    app.controller(''myController'', function($scope) {


        $scope.height = 0;


        $scope.length = 0;


    });


    </script>


    </body>


    </html>


    ![](images/00045.jpeg)


    Please save the file with name “ModuleSample.html” at myFolder. Double click “ModuleSample.html”
    file, input height and length of a triangle, and see the output.


    Output: 


    ![](images/00046.jpeg)


    ## Explanation:


    “ng-controller="myController"”defines a controller.


    “app = angular.module()” creates a new module.


    “app.controller()” adds the controller''s constructor function to the module.


    “function($scope)” defines a constructor function, and also defines an object
    $scope. When page is loaded, the function will run.


    “$scope.property = value” assigns the value to the property of $scope object.


    # Appendix 1 


    # Ajax Basic


    What is Ajax?


    AJAX stands for “Asynchronous JavaScript And XML”. AJAX is a new technique for
    creating better, faster, and more interactive web scripts with XML, HTML, CSS,
    PHP, ASP and Java Script by the server.


    AJAX is used to update parts of a web page, without reloading the whole page.


    That means with Ajax, you can communicate with the server to renew the information,
    without refreshing the web page.


    By jQuery and JavaScript, you can easily implement Ajax in your web pages.


    To run Ajax, you need a server.


    The following will talk about how to set up a server in your own computer, and
    then how to use Ajax.


    Set up a Server


    If you want to run Ajax, you need to set up a server in your own computer.


    “AppServ” is free software to setup a server; it can run Apache, PHP, MySQL, PhpMyAdmin,
    Ajax, JavaScript, JQuery……


    ## Step 1:


    Download “AppServ” form link:  (Figure 1)


    [http://www.appservnetwork.com/](http://www.appservnetwork.com/)    


    (Figure 1)


    ## Step 2:


    Install AppServ to local computer.


    C:\AppServ


    (Figure 2)


    ![A1](images/00047.jpeg)


    (Figure 2)


    ## Step 3:


    Please check all box to install anything.(Figure 3)


    ![A2](images/00048.jpeg)


    (Figure 3)


    ## Step 4:


    Server Name:  localhost


    Email Address:   xxxxxxxx@xxxxx.xxx


    Apache HTTP Port:  80  (Figure 4)


    ![A3](images/00049.jpeg)


    (Figure 4)


    ## Step 5:


    Enter root password: 12345  (Figure 5)


    (Default user name: root)


    ![A4](images/00050.jpeg)


    (Figure 5)


    ## Step 6:


    Check the box, Start Apache, Start MySQL


    Click Finish button. (Figure 6)


    ![A5](images/00051.jpeg)


    (Figure 6)


    ## Step 7:


    Test to see if AppServ installation is successful, please run a browser, enter
    the address: 


    http://localhost


    If you can see the page like this: (Figure 7)


    ![](images/00052.jpeg)


    (Figure 7)


    Congratulation! Your own server runs successfully.


    ## Step 8:


    How to use server?


    Open folder C:\AppServ\www, please create a folder named “myServer”, which can
    work as a workplace. You can put all you program files to “myServer” folder. From
    now on, you are able to run Ajax files, PHP files and HTML files on C:\AppServ\www\myServer.
    (Figure 8)


    ![](images/00053.jpeg)


    (Figure 8)


    ## Note:


    Please use “http://localhost/......“to run any files on the server, for example:


    If you want to run AjaxEvent.html, enter address:


    http://localhost/myServer/AjaxEven.html


    If you want to run Response.php, enter address:


    http://localhost/myServer/Response.php


    How to use Ajax?


    Note: Ajax needs a server support.


    If your computer can work as a server, please prepare a text file “data.txt” which
    contains words “Hello Ajax World!”, and put “data.txt” in the same folder with
    the following Ajax file.


    Sample 1


    ## Example B1


    1\. <script Language = “JavaScript”>


    2\. var ajaxObject = new XMLHttpRequest( );


    3\. ajaxObject.open( “GET”, “data.txt”, true);


    4\. ajaxObject.onreadystatechange = function( ) {


    5. if (ajaxObject.readyState == 4) {


    6\. alert( ajaxObject.responseText);


    7\. }


    8\. }


    9\. ajaxObject.send( );


    10\. </script>


    Save the file as “B1.html”, and double click it.


    ## Output: 


    Hello Ajax World!


    ## Explanation:


    Line 2:


    “new XMLHttpRequest( )” creates an XMLHttpRequest object named “ajaxObject”, which
    will be used to Ajax scripts.


    Line 3:


    “ajaxObject.open( “GET”, “data.txt”, true)” initializes the request of XMLHttpRequest
    object.


    “GET” specifies a request method. “POST” or “PUT” can also been used.


    “data.txt” is a URL which supplies with data resource.


    In here, the content of datat.txt is “Hello Ajax World!”.


    “true” indicates using Asynchronous technique.


    Line 4:


    “ajaxObject.onreadystatechange = function( ) { … }” specifies a function to run
    when the server’s response has been received. The server’s response is 0 to 4:


    | readyState | explanation |


    | 0 | uninitialized |


    | 1 | initialized |


    | 2 | send data |


    | 3 | receive data |


    | 4 | complete.  returned data is available. |


    “ajaxObject.onreadystatechange” is waiting for server’s response.


    Line 5:


    “if (ajaxObject.readyState == 4)” means if the server’s response is 4, the returned
    data is available.


    Line 6:


    “alert( ajaxObject.responseText)” display the retrieved text from data.txt.


    Output: “Hello Ajax World!”.


