    # 第 5 小


    # 事件


    ## 事件


    事件与不同的 HTML 元素关联。例如，点击事件与按钮元素关联；同样，按键事件与文本框或文本区域元素关联。AngularJS 提供了多个与 HTML 控制关联的事件。


    ### 点击事件 (Click event)

    | ng-click = “expression” |


    `ng-click = “expression"` 定义了一个点击事件。当按钮被点击时，会发生事件并计算该表达式。点击事件通常作用于按钮。


    #### 示例 5.1

    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>AngularJS for beginners</title>

    <script src="js\angular.min.js"></script>

    </head>

    <body>

    <h3>使用点击事件两个数字相加</h3>

    <div ng-app="" ng-init="firstNumber=47; secondNumber=23">

    <p>第一个数字： <input type="number" ng-model ="firstNumber"></p>

    <p>第二个数字： <input type="number" ng-model ="secondNumber"></p>

    <button ng-click="Result=firstNumber + secondNumber"> Add Numbers </button>

    <p>结果:<p style="font-weight:bold; color:blue" ng-bind ="Result"> </p></p>

    </div>

    </body>

    </html>

    ```

    打开记事本并粘贴上述代码，保存为 `.html` 扩展名。


    输出：

    ![](img/00030.jpeg)


    解析：

    `<button ng-click="Result=firstNumber + secondNumber"> Add Numbers </button>`：当按钮被点击时，会发生事件。`firstNumber`
    加上 `secondNumber`，并将结果赋值给 `Result`。


    在上面的示例中，页面首次加载时，第一个文本框显示数字 47，第二个文本框显示数字 23，但没有结果。（注意：这些数字是在 `ng-init` 指令中初始化的，但你可以在两个文本框中输入自己的数字）。当我点击按钮（Add
    Numbers）时，Result 区域显示的结果为 70。


    ### 双击事件 (Double Click event)

    | ng-dblclick = “expression” |


    `ng-dblclick = “expression"` 定义了一个双击事件。当按钮被双击时，会发生事件并计算该表达式。


    双击事件通常作用于按钮。


    #### 示例 5.2

    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>AngularJS for beginners</title>

    <script src="js/angular.min.js"></script>

    </head>

    <body>

    <h4>使用双击事件两个数字相加</h4>

    <div ng-app="" ng-init="firstNumber=26;SecondNumber=89">

    <p>第一个数字: &nbsp;&nbsp;&nbsp; <input type="number" ng-model="firstNumber"></p>

    <p>第二个数字: <input type="number" ng-model="SecondNumber"></p>

    <button ng-dblclick="Result=firstNumber + SecondNumber">Double Click</button>

    <p>结果:<p style="font-weight:bold;color:blue" ng-bind="Result"> </p>

    </div>

    </body>

    </html>

    ```

    打开记事本并粘贴上述代码，保存为 `.html` 扩展名。


    输出：

    ![](img/00031.jpeg)


    解析：

    `<button ng-dblclick="Result=firstNumber + secondNumber"> Add Numbers  </button>`：当按钮被双击时，会发生事件。`firstNumber`
    加上 `secondNumber`，并将结果赋值给 `Result`。


    在上面的示例中，页面首次加载时，第一个文本框显示数字 26，第二个文本框显示数字 89，但没有结果。当我双击按钮（Add Numbers）时，Result
    区域显示的结果为 115。


    ### 鼠标移动事件 (Mouse Move event)

    | ng-mousemove = “expression” |


    `ng-mousemove = “expression"` 定义了一个鼠标移动事件。当鼠标移动时，会发生事件并计算该表达式。


    鼠标移动事件通常作用于 div、body 以及特定区域或元素。


    #### 示例 5.3

    ```html

    <!doctype html>

    <html>

    <head>

    <script src="js\angular.min.js"></script>

    </head>

    <body ng-app="">

    <br><br>

    <textarea ng-mousemove="count = count + 1" ng-init="count=0">

    Here is a textarea

    </textarea>

    <br><br>

    <h2>count: {{count}}</h2>

    </body>

    </html>

    ```

    （假设你在 textarea 上移动了 20 次鼠标。）


    输出：

    | Here is a textarea. |

    count: 20


    解析：

    `ng-mousemove="count = count + 1"`：当鼠标在 textarea 上移动时，`count` 增加 1。

    `ng-init="count=0"` 将 `count` 的值初始化为 0。

    `{{count}}` 显示 `count` 的值。

    `count : 20` 表示鼠标移动了 20 次。


    ### 鼠标悬停事件 (Mouse Over event)

    | ng-mouseover = “expression” |


    `ng-mouseover = “expression"` 定义了一个鼠标悬停事件。当鼠标悬停时，会发生事件并计算该表达式。


    鼠标悬停事件通常作用于 div、body 以及特定区域或元素。


    #### 示例 5.4

    ```html

    <!doctype html>

    <html>

    <head>

    <script src="js\angular.min.js"></script>

    </head>

    <body ng-app="">

    <br><br>

    <textarea ng-mouseover="count = count + 1" ng-init="count=0">

    Here is a textarea

    </textarea>

    <br><br>

    <h2>count: {{count}}</h2>

    </body>

    </html>

    ```

    （假设鼠标在 textarea 上上悬停了 20 次。）


    输出：

    | Here is a textarea. |

    count: 20


    解析：

    `ng-mouseover="count = count + 1"`：当鼠标悬停在 textarea 上时，`count` 增加 1。

    `ng-init="count=0"` 将 `count` 的值初始化为 0。

    `{{count}}` 显示 `count` 的值。

    `count : 20` 表示鼠标悬停了 20 次。


    ### 鼠标离开事件 (Mouse Leave event)

    | ng-mouseleave = “expression” |


    `ng-mouseleave = “expression"` 定义了一个鼠标离开事件。当鼠标离开时，会发生事件并计算该表达式。


    鼠标离开事件通常作用于 div、body 以及特定区域或元素。


    #### 示例 5.5

    ```html

    <!doctype html>

    <html>

    <head>

    <script src="js\angular.min.js"></script>

    </head>

    <body ng-app="">

    <br><br>

    <textarea ng-mousemove="count = count + 1" ng-init="count=0">

    Here is a textarea

    </textarea>

    <br><br>

    <h2>count: {{count}}</h2>

    </body>

    </html>

    ```

    （假设鼠标离开 textarea 区域了 10 次。）


    输出：

    | Here is a textarea. |

    count: 10


    解析：

    `ng-mousemove="count = count + 1"`：当鼠标在 textarea 上移动时，`count` 增加 1。

    `ng-init="count=0"` 将 `count` 的值初始化为 0。

    `{{count}}` 显示 `count` 的值。

    `count : 10` 表示鼠标移动了 10 次。


    ### 按键释放事件 (Key Up event)

    | ng-keyup = “expression” |


    `ng-keyup = “expression"` 定义了一个按键释放事件。当按键释放时，会发生事件并计算该表达式。


    按键释放事件通常作用于文本框和文本区域。


    #### 示例 5.6

    ```html

    <!doctype html>

    <html>

    <head>

    <script src="js\angular.min.js"></script>

    </head>

    <body ng-app="">

    <br><br>

    <textarea ng-keyup="count = count + 1" ng-init="count=0">

    Here is a textarea

    </textarea>

    <br><br>

    <h2>count: {{count}}</h2>

    </body>

    </html>

    ```

    （假设你在 textarea 中输入了 12345678。）


    输出：

    | Here is a textarea.12345678 |

    count: 8


    解析：

    `ng-keyup="count = count + 1"`：当按键在 textarea 上释放时，`count` 增加 1。

    `ng-init="count=0"` 将 `count` 的值初始化为 0。

    `{{count}}` 显示 `count` 的值。

    `count : 8` 表示按键释放了 8 次。


    ### 按键按下事件 (Key Down event)

    | ng-keydown = “expression” |


    `ng-keydown = “expression"` 定义了一个按键按下事件。当按键按下时，会发生事件并计算该表达式。


    按键按下事件通常作用于文本框和文本区域。


    #### 示例 5.7

    ```html

    <!doctype html>

    <html>

    <head>

    <script src="js\angular.min.js"></script>

    </head>

    <body ng-app="">

    <br><br>

    <textarea ng-keydown="count = count + 1" ng-init="count=0">

    Here is a textarea

    </textarea>

    <br><br>

    <h2>count: {{count}}</h2>

    </body>

    </html>

    ```

    （假设你在 textarea 中输入了 123456。）


    输出：

    | Here is a textarea.123456 |

    count: 6


    解析：

    `ng-keydown="count = count + 1"`：当按键在 textarea 上按下时，`count` 增加 1。

    `ng-init="count=0"` 将 `count` 的值初始化为 0。

    `{{count}}` 显示 `count` 的值。

    `count : 6` 表示按键按下了 6 次。


    ### 复制与剪切事件 (Copy & Cut event)

    | ng-copy= "result1=true" ng-cut= "result2=true" |


