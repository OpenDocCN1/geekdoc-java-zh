    \ 文件，查看输出。\n\n输出：\n\n![](img/00040.jpeg)\n\n## 解析\n\n`{{firstNumber + secondNumber}}`\
    \ 显示 `firstNumber` 和 `secondNumber` 的和。\n\n# 第 7 小\n\n## Controller & Scope\n\n\
    ### 什么是 Controller？\n\nController 基本上是一个控制应用程序数据流的 JavaScript 对象。因此， AngularJS\
    \ 是由 `Controller` 控制的。\n\n### 如何定义 Controller？\n\n使用 `ng-controller` 指令来定义 `Controller`。我们知道\
    \ `Controller` 是包含 JavaScript 函数和属性的 JavaScript 对象。`Controller` 的语法如下：\n\n| `<div\
    \ ng-app=\"\" ng-controller=\"controllerName\">` |\n\n### 示例 7.1\n\n```html\n\
    <html>\n<script src=\"js\\angular.min.js\"></script>\n<body>\n<div ng-app=\"Calculation\"\
    \ ng-controller=\"myController\">\nFirst Number: <input type=\"number\" ng-model=\"\
    firstNumber\"><br>\nSecond Number: <input type=\"number\" ng-model=\"secondNumber\"\
    ><br>\n<br>\nSum: {{firstNumber + secondNumber}}\n</div>\n<script>\nvar app =\
    \ angular.module('Calculation', [ ]);\napp.controller('myController', function($scope)\
    \ {\n    $scope.firstNumber = 4;\n    $scope.secondNumber = 8;\n});\n</script>\n\
    </body>\n</html>\n```\n\n输出：\n\n![](img/00041.jpeg)\n\n### 解析\n\n- `ng-controller=\"\
    myController\"` 定义了一个控制器。\n- `app = angular.module()` 创建了一个新模块。\n- `app.controller()`\
    \ 将控制器的构造函数添加到模块中。\n- `function($scope)` 定义了一个构造函数，同时也定义了一个对象 `$scope`。当页面加载时，该函数将运行。\n\
    - `$scope.property = value` 将值赋值给 `$scope` 对象的属性。\n\n在上面的示例中，在当页面第一次加载时，你会看到两个文本框显示不同的数字，分别是\
    \ 4 和 8；结果区域显示结果为 12。\n\n`angular.module()`：AngularJS 模块是应用程序各个部分的集合，例如控制器、服务、过滤器、指令等。一个\
    \ AngularJS 模块定义了一个应用程序，我们将在后面的章节中详细讨论。\n\n### 什么是 Scope？\n\nScope 是一个包含模型数据的\
    \ JavaScript 对象。\n\n| `function ($scope) { }` |\n\n`$scope` 是 JavaScript 函数的参数，由控制器调用。让我们通过一个例子来理解。\n\
    \n### 示例 7.2\n\n```javascript\n<script>\nfunction ($scope) {\n    $scope.firstNumber\
    \ = 23;\n    $scope.secondNumber = 63;\n}\n</script>\n```\n\n### 解析\n\n在上面的示例中，`$scope`\
    \ 是函数 `function ($scope) { }` 的参数。`$scope` 是 AngularJS 中的一个对象。\n\n`$scope.firstNumber`\
    \ 和 `$scope.secondNumber` 是 HTML 中使用的模型。模型数据通过 `$scope` 对象访问。我们使用以下公式给模型赋值：`$scope.property\
    \ = value`。\n\n### 例如：\n\n```javascript\n$scope.firstNumber = 23;\n$scope.secondNumber\
    \ = 63;\n```\n\n## MVC & Scope\n\n### 什么是 MVC？\n\nMVC 代表模型（Model）、视图（View）和控制器（Controller）。\n\
    - 模型（Model）直接管理应用程序的数据、逻辑和规则。\n- 视图（View）显示数据。\n- 控制器（Controller）处理输入。\n\n在上面的示例中：\n\
    - `$scope.firstNumber` 和 `$scope.secondNumber` 是模型。\n- `<p ng-bind = \"firstNumber\
    \ + secondNumber\"></p>` 是 HTML 中使用的视图。\n- `ng-controller=\"myController\"` 定义了一个控制器。\n\
    \n控制器与视图之间的通信被称为 `Scope`，因此我们可以说 `Scope` 就像连接控制器与视图的桥梁。\n\n## 模块基础\n\n| `app =\
    \ angular.module()` |\n\n`app = angular.module()` 创建了一个新模块。\n\n### 示例 7.3\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<script src=\"\
