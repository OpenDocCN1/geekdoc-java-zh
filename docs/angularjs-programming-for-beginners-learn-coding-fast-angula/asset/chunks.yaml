  trans: "\n\n在本章中，我们学习了什么是过滤器。以及不同类型的过滤器，如大写过滤器、小写过滤器、排序过滤器和货币过滤器。我已尝试通过适当的示例、输出和解释来介绍本章的每一个主题。\n\
    \n- `Value | uppercase` 将值转换为大写。\n- `Value | lowercase` 将值转换为小写。\n- `Value | orderBy:\
    \ ’value’` 按升序顺序显示值。\n- `Value | orderBy: ’-value’` 按降序顺序显示值。\n- `Value | currency`\
    \ 将值转换为货币格式。\n- `Array | filter:input` 可以根据用户输入对数组元素进行过滤。\n\n## 动手实践项目\n\n###\
    \ 大写过滤器 (Uppercase Filter)\n\n打开记事本，编写以下 AngularJS 代码：\n\n```html\n<!DOCTYPE html>\n\
    <script src=\"js\\angular.min.js\"></script>\n<body>\n<h4>Uppercase Filter</h4>\n\
    <div ng-app=\"\">\n<p>Book Name: </p>\n<p><input type=\"text\" ng-model = \"Book\"\
    ></p>\n<h3><p ng-bind=\"Book|uppercase\"></p></h3>\n</div>\n</body>\n</html>\n\
    ```\n\n![](img/00020.jpeg)\n\n请将该文件命名为 `UppercaseFilter.html` 并保存到 `myFolder`\
    \ 中。注意：确保使用 `.html` 扩展名。\n\n双击 `UppercaseFilter.html` 文件，浏览器将运行该文件，在文本框中输入书名“JavaScript\
    \ in 8 Hours”，并查看输出结果。\n\n输出： \n![](img/00021.jpeg)\n\n#### 解释：\n`<p ng-bind=\"\
    Book|uppercase\"></p>` 将 `Book` 的值转换为大写。\n\n# 第 4 小时\n\n# DOM 中的指令 (Directive\
    \ in DOM)\n\n### Show 指令 (Show Directive)\n\n| `<p ng-show=\"true\"> visible.</p><p\
    \ ng-show=\"false\">invisible.</p>` | |\n\nShow 指令用于显示或隐藏 HTML 中 `<p>` 元素中的文本。\n\
    如果 `ng-show` 为 true，将显示文本“visible”。\n如果 `ng-show` 为 false，则将隐藏文本“invisible”。\n\
    \n#### 示例 4.1\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJS\
    \ for beginners</title>\n    <script src=\"js/angular.min.js\"></script>\n</head>\n\
    <body>\n<h3>Using Show directive</h3>\n<div ng-app=\"\" >\n<input type=\"checkbox\"\
    \ ng-model=\"showHideDiv\">Show Div\n<div ng-show=\"showHideDiv\" style=\"background-color:yellow;height:50px;\"\
    >\n<p>I am a div</p>\n<p>I appear when the check box is checked.</p>\n</div>\n\
    </div>\n</body>\n</html>\n```\n\n输出：\n![](img/00022.jpeg)\n\n#### 解释：\n`ng-model=\"\
    showHideDiv\"` 将复选框的值与 `showHideDiv` 绑定。\n`ng-show=\"showHideDiv\"` 当 `showHideDiv`\
    \ 的值为 true 时显示文本。\n在上面的示例中，起初初次加载页面时，div（页面的黄色区域）是不显示的，但当我勾选复选框（show Div）时，`showHideDiv`\
    \ 的值为 true；div（页面的黄色区域）就会出现。\n\n### Hide 指令 (Hide Directive)\n\n| `<p ng-hide=\"\
    true\"> invisible.</p><p ng-hide=\"false\">visible.</p>` | |\n\nHide 指令用于隐藏或显示\
    \ HTML 中 `<p>` 元素中的文本。\n如果 `ng-hide` 为 true，则将隐藏文本“invisible”。\n如果 `ng-hide` 为\
    \ false，将显示文本“visible”。\n\n#### 示例 4.2\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \    <title>AngularJSfor beginners</title>\n<script src=\"js\\angular.min.js\"\
    ></script>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
    \ />\n</head>\n<body>\n<h3>Using Hide directive</h3>\n<div ng-app=\"\" >\n<input\
    \ type=\"checkbox\" ng-model=\"HideShowDiv\">Hide Div\n<div ng-hide=\"HideShowDiv\"\
    \ style=\"background-color:pink;height:50px;\">\n<p>I am a div</p>\n<p>I will\
    \ disappeared when the check box is checked.</p>\n</div>\n</div>\n</body>\n</html>\n\
    ```\n\n打开记事本并粘贴上述带有 `.html` 扩展名的代码。\n\n输出：\n![](img/00023.jpeg)\n\n请勾选复选框并查看结果。\n\
    ![](img/00024.jpeg)\n\n#### 解释：\n`ng-model=\"showHideDiv\"` 将复选框的值与 `showHideDiv`\
    \ 绑定。\n`ng-hide=\"showHideDiv\"` 当 `showHideDiv` 的值为 true 时隐藏文本。\n在上面的示例中，页面初次加载时，div（页面的粉色区域）是显示的。\n\
    但当我点击复选框（Hide Div）时，`showHideDiv` 的值为 true；div（页面的粉色区域）消失了。（注：保留了原始文本变量名）。\n\n\
    ### Disable 指令 (Disable Directive)\n\n| `<input type=\"button\" ng-disabled=true\
    \ value=\"myButton\">` | |\n\nDisable 指令用于禁用或启用 HTML 元素。\n如果 `ng-disabled` 为 true，元素将是禁用的。\n\
    \n#### 示例 4.3\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJS\
    \ for beginners</title>\n    <script src=\"js/angular.min.js\"></script>\n</head>\n\
    <body>\n<h3>Using Disable directive</h3>\n<div ng-app=\"\" >\n<input type=\"checkbox\"\
    \ ng-model=\"showHideDiv\">Show Div\n<div ng-disabled=\"showHideDiv\" style=\"\
    background-color:yellow;height:50px;\">\n<p>I am a div</p>\n<p>I appear when the\
    \ check box is checked.</p>\n</div>\n</div>\n</body>\n</html>\n```\n\n输出：\n![](img/00025.jpeg)\n\
    \n#### 解释：\n`ng-model=\"showHideDiv\"` 将复选框的值与 `showHideDiv` 绑定。\n`ng-disabled=\"\
    showHideDiv\"` 当 `showHideDiv` 的值为 true 时禁用元素。\n在上面的示例中，页面初次加载时，div（页面的黄色区域）是禁用的。\n\
    \n### Click 指令 (Click Directive)\n\n| `ng-click=\"expression\"` | |\n\nClick 指令用于定义点击事件。\n\
    \n#### 示例 4.4\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJS\
    \ for beginners</title>\n    <script src=\"js/angular.min.js\"></script>\n</head>\n\
    <body>\n<h3>Using Click directive</h3>\n<div ng-app=\"\" ng-init=\"result=0\"\
    >\n<button ng-click=\"result=result+100\">Click Here!</button>\n<H1><p ng-bind=\"\
    result\"></p></H1>\n</div>\n</body>\n</html>\n```\n\n输出：\n![](img/00026.jpeg)\n\
    \n#### 解释：\n`ng-click=\"result+100\"` 点击按钮时更新值。\n\n### If 指令 (If Directive)\n\n\
    | `ng-if=\"condition\"` | |\n\nIf 指令用于在 DOM 中添加或移除元素。\n如果 `ng-if` 为 true，元素将添加到\
    \ DOM 中。\n如果 `ng-if` 为 false，元素将被移除。\n\n#### 示例 4.5\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n    <title>AngularJS for beginners</title>\n    <script src=\"\
    js/angular.min.js\"></script>\n</head>\n<body ng-app=\"\" align=\"center\">\n\
    <input type=\"checkbox\" ng-model=\"result\" >\n<div ng-if=\"result\"> \n<p>When\
