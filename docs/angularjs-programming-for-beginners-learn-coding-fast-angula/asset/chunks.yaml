    # 第 1 小时：AngularJS 简介


    ### 什么是 AngularJS？

    AngularJS 是一个 JavaScript 框架。可以使用 HTML 作为模板语言，并扩展 HTML 结构来清晰、简洁地定义应用程序的组件。


    AngularJS 的语法如下：

    ```html

    <div ng-app=""></div>

    ```

    我们知道 `div` 是一个 html 标签，但 `ng-app` 是 AngularJS 的指令，它像属性一样用在 `div` 标签中。（稍后我们会讨论指令）


    ### 学习 AngularJS 的前提条件

    在学习 AngularJS 之前，你应该具备 HTML 和 JavaScript 的基础知识，因为 AngularJS 是基于 HTML 和 JavaScript
    工作的。你可以在附录 1 或附录 2 中回顾 HTML 和 CSS（注意：本书的附录包含了“HTML、CSS 和 JavaScript 复习”）。


    ### 下载 AngularJS

    下载 AngularJS 并不是难事；你只需要访问 AngularJS 网站 `https://AngularJS.org` 并点击“Download”按钮。下载
    AngularJS 文件 `angular.min.js` 后，你可以将其放在 `myFolder/js` 文件夹中（即 html 文件和 JavaScript
    文件放在 `myFolder` 文件夹，并将 `angular.min.js` 放在 `myFolder/js` 文件夹），然后在 html 页的 head
    部分如所示编写该 `angular.min.js` 文件的路径：

    ```html

    <html>

    <head>

    <script src="js/angular.min.js"></script>

    ```

    在上面的示例中，你可以看到 AngularJS 的路径 `<script src="js/angular.min.js">`。现在 AngularJS 框架已添加到我们的应用程序中。所以从现在起我们可以使用
    AngularJS 框架。


    ### AngularJS 的优势

    - AngularJS 具有与 HTML 绑定数据的能力。

    - AngularJS 提供单页应用 (SPA)。

    - AngularJS 的 View 完全用 HTML 编写，Controller 用 JavaScript 编写，Model 用 AngularJS 编写。它是一个
    MVC 框架。

    - 你只需要几行代码就能实现更多功能。

    - AngularJS 代码和组件的可重用性。


    ## 第一个 AngularJS 脚本


    ### 示例 1.1

    打开记事本，编写如下代码（图 1）：

    ```html

    <html>

    <script src="js/angular.min.js"></script>

    <body>

    <div ng-app="">

    <p>在输入框中输入我的 id：</p>

    <p><input type="text" ng-model="id" </p>

    <br>

    <h1>Welcome! {{id}}</h1>

    </div>

    </body>

    </html>

    ```

    ![](img/00001.jpeg)

    （图 1）


    请将文件命名为 `FirstAngularJS.html` 并保存到 `myFolder` 中。注意：确保使用 `.html` 扩展名。双击 `FirstAngularJS.html`
    文件，浏览器将运行 `FirstAngularJS.html`，并查看输出（图 2）。假设我输入的 id 为 `168168`。


    #### 输出：

    ![](img/00002.jpeg)

    （图 2）


    #### 解释：

    - `<script src="js/angular.min.js"></script>` 将 AngularJS 框架添加到当前应用程序中。

    - `<div ng-app=""></div>` 表示你可以在这里编写 AngularJS 应用程序。

    - `ng-model="id"` 将来自 HTML 控件（input, select 和 textarea）的输入数据绑定到应用程序数据 `id`。

    - `{{id}}` 与 `ng-model="id"` 中的 `id` 同步。

    - `{{id}}` 显示 `id` 的值。


    如果你想编辑代码，右键点击文件 `FirstAngularJS.html` > 打开方式 > 记事本。


    Hello World!

    ```html

    <html ng-app="">...</html>

    ```


    ### 示例 1.2

    打开记事本，编写如下代码（图 1）：

    ```html

    <html>

    <script src="js/angular.min.js"></script>

    <body>

    <div ng-app="">

    <p>在输入框中输入我的 id：</p>

    <p><input type="text" ng-model="id" </p>

    <br>

    <h1>Welcome! {{id}}</h1>

    </div>

    </body>

    </html>

    ```

    请将文件命名为 `FirstAngularJS.html` 并保存到 `myFolder` 中。注意：确保使用 `.html` 扩展名。双击 `FirstAngularJS.html`
    文件，浏览器将运行 `FirstAngularJS.html`，并查看输出（图 2）。假设我输入的 id 为 `168168`。


    #### 输出：

    ![](img/00003.jpeg)

    （图 2）


    #### 解释：

    - `<script src="js/angular.min.js"></script>` 将 AngularJS 框架添加到当前应用程序中。

    - `<div ng-app=""></div>` 表示你可以在这里编写 AngularJS 应用程序。

    - `ng-model="id"` 将来自 HTML 控件（input, select 和 textarea）的输入数据绑定到应用程序数据 `id`。

    - `{{id}}` 与 `ng-model="id"` 中的 `id` 同步。

    - `{{id}}` 显示 `id` 的值。


    ### 示例 1.3

    打开记事本，编写如下代码（图 1）：

    ```html

    <html>

    <script src="js/angular.min.js"></script>

    <body>

    <div ng-app="">

    <p>在输入框中输入我的 id：</p>

    <p><input type="text" ng-model="id" </p>

    <br>

    <h1>Welcome! {{id}}</h1>

    </div>

    </body>

    </html>

    ```


    ## 总结

    在本章中，我们学习了 AngularJS 是什么、如何下载 AngularJS 以及 AngularJS 的优势。


