- fmt: "\nThe AngularJS allows us to extend HTML in very simple way using attributes.\
    \ The attributes are basically directives. There are different types of directives\
    \ which can play different roles in Application. They are `App Directive`, `Model\
    \ Directive`, `Bind Directive`, `Init Directive`, and `Repeat Directive`. Let's\
    \ discuss one by one in detail.\n\n### App Directive\n\n| `ng-app= \" \"` |\n\n\
    The `app` directive defines the area of AngularJS application. The syntax of `app`\
    \ directive is `ng-app = \" \";` In here the `ng` is the namespace of AngularJS\
    \ and `app` is the application area of Angular JS.\n\n#### Example 2.1\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJS for beginners</title>\n\
    \    <script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n    <div ng-app=\"\
    \ \"> \n        The AngularJSapplication has been started.\n    </div>\n</body>\n\
    </html>\n```\n\n#### Output:\nThe AngularJSapplication has been started.\n\n####\
    \ Explanation:\nIn `head` section (`<script src = \"js\\angular.min.js\"> </script>`),\
    \ the framework of AngularJSis loaded, which means that we can use AngularJS framework\
    \ now.\n\nIn `body` section (`<div ng-app=\" \"> </div>`), AngularJS application\
    \ can be written in here.\n\nIn last tag (`</div>`), the AngularJSapplication\
    \ is ended.\n\n### Model Directive\n\n| `ng-model = \"data\"` |\n\nThe `model`\
    \ directive is used to bind the inputted value from HTML controls (input, checkbox\
    \ and select etc.) to application data. The `ng-model = \"data\"` is the syntax\
    \ of `model` directive. Let's take an example for better understanding.\n\n####\
    \ Example 2.2\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJSfor\
    \ beginners</title>\n    <script src=\"js\\angular.min.js\"></script>\n</head>\n\
    <body>\n<div ng-app=\"\">\n<p>User Name: <br>\n<input type=\"text\" ng-model =\
    \ \"Username\"></p>\n</div>\n</body>\n</html>\n```\n\n#### Output:\nUsername:\n\
    \n#### Explanation:\n`\"ng-model = “Username\"` binds the inputted value from\
    \ HTML control to `\"Username\"`.\n\nNow you cannot see the result because this\
    \ program is missing the code `<p ng-bind=\"Username\"></p>`.\n\n### Bind Directive\n\
    \n| `<p>ng-bind = \"data\"</p>` |\n\nThe `bind` directive is used to bind the\
    \ data value to an html element `<p>`; the syntax of `bind` directive is `<p>ng-bind\
    \ = \"data\"</p>`. Let's take an example for better understanding.\n\n#### Example\
    \ 2.3\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJSfor beginners</title>\n\
    \    <script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n<div ng-app=\"\
    \">\n<p>User Name: <br>\n<input type=\"text\" ng-model = \"Username\"></p>\n<p\
    \ ng-bind=\"Username\"></p>\n</div>\n</body>\n</html>\n```\n\nOpen the notepad\
    \ and paste the above mentioned code with `.html` extension, and type username\
    \ “Ray Yao” in the input box.\n\n#### Output:\n![](images/00007.jpeg)\n\n####\
    \ Explanation:\n`“<p>ng-bind=\"Username\"</p>\"` binds the value of `\"Username\"\
    ` to `<p></p>` tag, and \"shows\" its value.\n\nIn the above example, (`<p ng-bind=\"\
    Username\"></p>`) can update the value of `\"Username\"` and writes it to `<p></p>`\
    \ tag.\n\n`<p>ng-bind=\"data\"</p>` can \"output\" the value of `\"data\"` in\
    \ specified html element `<p>`.\n\n#### ng-model & ng-bind\n\nThey both use “bind”.\n\
    \n(1) `ng-model = \"data\"`: binds the inputted value from Html controls (textarea,\
    \ checkbox, select, input and radio etc.) to `\"data\"`.\n\n#### For example:\n\
    `\"ng-model = “Username\"` binds the inputted value to `\"Username\"`. (Just like\
    \ assign the inputted value to `\"Username\"`.)\n\n(2) `<p>ng-bind= \"data\"</p>`:\
    \ binds the `\"data\"` to an html element `<p></p>`.\n\n#### For example:\n`<p\
    \ ng-bind=\"Username\"></p>` binds the data `\"Username\"` to `<p></p>` element\
    \ and shows its value. (Just like display the value of the `\"Username\"` in `<p></p>`.)\n\
    \n### Init Directive\n\n| `ng-init = \"data = ‘value’\"` |\n\nThe `init` directive\
    \ is used to initialize the data with a value. The syntax of `init` directive\
    \ is `ng-init = \"data = ‘value’\"`. Let's take an example for better understanding.\n\
    \n#### Example 2.4\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJSfor\
    \ beginners</title>\n    <script src=\"js\\angular.min.js\"></script>\n</head>\n\
    <body>\n<div ng-app=\"\" ng-init=\"Username= 'Andy Smith' \">\n    <p>User Name:\
    \ <input type=\"text\" ng-model = \"Username\"></p>\n    <p ng-bind=\"Username\"\
    ></p>\n</div>\n</body>\n</html>\n```\n\nOpen the notepad and paste the above mentioned\
    \ code with `.html` extension.\n\n#### Output:\n![](images/0008.jpeg)\n\n####\
    \ Explanation:\n`\"ng-init=Username= 'Andy Smith' \"` initializes the `\"Username\"\
    ` with a value.\n\nIn the above example, `<div ng-app=\"\" ng-init=\"Username=\
    \ 'Andy Smith' \">`, the AngularJSapplication is ended.\n\n### Repeat Directive\n\
    \n| `ng-repeat = \"item in array\"` |\n\nThe `repeat` directive works like a loop.\
    \ The `repeat` directive repeats to get the values of an array.\n\n#### Example\
    \ 2.5\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJSfor beginners</title>\n\
    \    <script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n<div ng-app=\"\
    \">\n<<ul>\n    <li ng-repeat=\"x in ['Red', 'Green', 'Blue']\">{{x}}</li>\n</ul>\n\
    </div>\n</body>\n</html>\n```\n*(Note: Based on the provided text structure, the\
    \ example for repeat directive was fragmented; the reconstructed logic here follows\
    \ standard directive logic)*\n\nIn `body` section (`<div ng-app=\" \"> </div>`),\
    \ AngularJS application can be written in here.\n\nIn last tag (`</div>`), the\
    \ AngularJSapplication is ended.\n\n### Valid Directive\n\n| `ng-valid` |\n\n\
    The `valid` directive can change the status of a specified element when an input\
    \ is valid.\n\n#### Example 2.6\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \    <title>AngularJS for beginners</title>\n    <script src=\"js\\angular.min.js\"\
    ></script>\n    <style>\n    input.ng-valid {\n        background-color: yellow;\n\
    \    }\n    </style>\n</head>\n<body>\n<form>\nPlease enter number:\n<input type=\"\
    text\" ng-model=\"psw\" required>\n</form>\n</body>\n</html>\n```\n\n#### Output:\n\
    ![](images/0010.jpeg)\n\n#### Explanation:\n`\"input.ng-valid\"` changes the background\
    \ when the input is valid.\n\n### Check Email Address\n\n| `$error.email` |\n\n\
    `“$error.email\"` is used to check email address validity; and return error message\
    \ if wrong email address format is inputted.\n\n#### Example 2.7\n\n```html\n\
    <!DOCTYPE html>\n<html ng-app=\"\">\n<head>\n    <title>AngularJS for beginners</title>\n\
    \    <script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n<form name=\"\
    iForm\">\nPlease input your email address: <br><br>\n<input type=\"email\" name=\"\
    eMailAddr\" ng-model=\"text\"> <br><br>\n<div ng-show=\"iForm.eMailAddr.$error.email\"\
    > Invalid email address!</div>\n</form>\n</body>\n</html>\n```\n\n#### Output:\n\
    ![](images/0011.jpeg)\n\n#### Explanation:\nWhen you input an wrong format email\
    \ address, you will see an alert: Invalid email address!\n"
  raw: "The AngularJS allows us to extend HTML in very simple way using attributes.\
    \ The attributes are basically directives. There are different types of directives\
    \ which can play different roles in Application. They are App Directive, Model\
    \ Directive, Bind Directive, Init Directive, and Repeat Directive. Let`s discuss\
    \ one by one in detail.\n\nApp Directive\n\n| ng-app= “ ” |\n\nThe app directive\
    \ defines the area of AngularJS application. The syntax of app directive is ng-app\
    \ = “ ”; In here the ng is the namespace of AngularJS and app is the application\
    \ area of Angular JS.\n\n## Example 2.1\n\n<!DOCTYPE html>\n\n<html >\n\n<head>\n\
    \n    <title>AngularJS for beginners</title>\n\n    <script src=\"js\\angular.min.js\"\
    ></script>\n\n</head>\n\n<body>\n\n    <div ng-app=\" \"> \n\n The AngularJSapplication\
    \ has been started.\n\n    </div>\n\n</body>\n\n</html>\n\n## Output:\n\nThe AngularJSapplication\
    \ has been started.\n\n## Explanation:\n\nIn head section (<script src = \"js\\\
    angular.min.js\"> </script>), the framework of AngularJSis loaded, which means\
    \ that we can use AngularJS framework now.\n\nIn body section (<div ng-app=\"\
    \ \"> </div>), AngularJS application can be written in here.\n\nIn last tag (</div>),\
    \ the AngularJSapplication is ended.\n\nModel Directive\n\n| ng-model = “data”\
    \ |\n\nThe model directive is used to bind the inputted value from HTML controls\
    \ (input, checkbox and select etc.) to application data. The ng-model = “data”\
    \ is the syntax of model directive. Let`s take an example for better understanding.\n\
    \nExample 2.2\n\n<!DOCTYPE html>\n\n<html >\n\n<head>\n\n    <title>AngularJSfor\
    \ beginners</title>\n\n <script src=\"js\\angular.min.js\"></script>\n\n</head>\n\
    \n<body>\n\n<div ng-app=\"\">\n\n<p>User Name: <br>\n\n<input type=\"text\" ng-model\
    \ = \"Username\"></p>\n\n</div>\n\n</body>\n\n</html>\n\n## Output:\n\nUsername:\n\
    \n|  |\n\nExplanation:\n\n“ng-model = “Username”” binds the inputted value from\
    \ HTML control to “Username”.\n\nNow you cannot see the result because this program\
    \ is missing the code <p ng-bind=\"Username\"></p>.\n\nBind Directive\n\n| <p>ng-bind\
    \ = “data”</p> |\n\nThe bind directive is used to bind the data value to an html\
    \ element <p>; the syntax of bind directive is <p>ng-bind = “data”</p>. Let`s\
    \ take an example for better understanding.\n\nExample 2.3\n\n<!DOCTYPE html>\n\
    \n<html >\n\n<head>\n\n    <title>AngularJSfor beginners</title>\n\n    <script\
    \ src=\"js\\angular.min.js\"></script>\n\n</head>\n\n<body>\n\n<div ng-app=\"\"\
    >\n\n<p>User Name: <br>\n\n<input type=\"text\" ng-model = \"Username\"></p>\n\
    \n<p ng-bind=\"Username\"></p>\n\n</div>\n\n</body>\n\n</html>\n\nOpen the notepad\
    \ and paste the above mentioned code with .html extension, and type username “Ray\
    \ Yao” in the input box.\n\nOutput:\n\n![](images/00007.jpeg)\n\nExplanation:\n\
    \n“<p>ng-bind=\"Username\"</p>” binds the value of “Username” to <p></p> tag,\
    \ and “shows” its value.\n\nIn the above example, (<p ng-bind=\"Username\"></p>)\
    \ can  update the value of “Username” and writes it to <p></p> tag.\n\n <p>ng-bind=\"\
    data\"</p> can “output” the value of “data” in specified html element <p>.\n\n\
    ng-model & ng-bind\n\nThey both use “bind”.\n\n(1)\n\nng-model = “data”: binds\
    \ the inputted value from Html controls (textarea, checkbox, select, input and\
    \ radio etc.) to “data”.\n\n## For example:\n\n“ng-model = “Username”” binds the\
    \ inputted value to “Username”.\n\n(Just like assign the inputted value to “Username”.)\n\
    \n(2)\n\n<p>ng-bind= “data”</p>: binds the “data” to an html element <p></p>.\n\
    \n## For example:\n\n<p ng-bind=\"Username\"></p> binds the data “Username” to\
    \ <p></p> element and shows its value.\n\n(Just like display the value of the\
    \ “Username” in <p></p>.)\n\nInit Directive\n\n| ng-init = \"data = ‘value’” |\n\
    \nThe init directive is used to initialize the data with a value. The syntax of\
    \ init directive isng-init = \"data = ‘value’”. Let`s take an example for better\
    \ understanding.\n\nExample 2.4\n\n<!DOCTYPE html>\n\n<html >\n\n<head>\n\n   \
    \ <title>AngularJSfor beginners</title>\n\n    <script src=\"js\\angular.min.js\"\
    ></script>\n\n</head>\n\n<body>\n\n<div ng-app=\"\" ng-init=\"Username= 'Andy\
    \ Smith' \">\n\n   <p>User Name: <input type=\"text\" ng-model = \"Username\"\
    ></p>\n\n   <p ng-bind=\"Username\"></p>\n\n</div>\n\n</body>\n\n</html>\n\nOpen\
    \ the notepad and paste the above mentioned code with .html extension.\n\nOutput:\n\
    \n![](images/00008.jpeg)\n\nExplanation:\n\nng-init=\"Username= ‘Andy Smith’”\
    \ initializes “Username” with a value “Andy Smith”.\n\nIn the above example, (<div\
    \ ng-app=\"\" ng-init = \"Username= 'Andy Smith' \">) initializes the value of\
    \ User Name. When the page is loaded completely, the value of User Name “Andy\
    \ Smith” is displayed.\n\nRepeat Directive\n\n| ng-repeat = “variable in array”\
    \ |\n\nThe repeat directive works like a loop. The ng-repeat directive repeats\
    \ to get the value of an array.\n\nExample 2.5\n\n<html >\n\n<head>\n\n    <title>AngularJSfor\
    \ beginners</title>\n\n<script src=\"js\\angular.min.js\"></script>\n\n<meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=UTF-8\" />\n\n</head>\n\n<body>\n\n\
    <div ng-app=\"\"  ng-init = \"ColorName = ['Pink', 'Red', 'Green', 'Blue', 'Black',\
    \ 'White', 'Yellow', 'Gray']\">\n\n<p style=\"color:green; font-weight:bold\"\
    >Colours Name:</p>\n\n<ol>\n\n<li ng-repeat=\"x in ColorName\">\n\n  <p ng-bind=\"\
    x\"></p>     \n\n     </li>\n\n</ol>\n\n</div>\n\n</body>\n\n</html>\n\nOpen the\
    \ notepad and paste the above code with .html extension.\n\nOutput:\n\n![](images/00009.jpeg)\n\
    \nExplanation:\n\nng-repeat = \"x in ColorName” repeats to get the value of array\
    \ “ColorName”, and assigns all array values to “x” variable.\n\n<p ng-bind=\"\
    x\"></p> repeats to output the value of “x”.\n\nValid Directive\n\n| input.ng-valid\
    \ |\n\nng-valid directive can change the status of a specified element when an\
    \ input is valid.\n\n## Example 2.6\n\n<!DOCTYPE html>\n\n<html ng-app=\"\">\n\
    \n<head>\n\n<script src=\"js\\angular.min.js\"></script>\n\n<meta charset=\"utf-8\"\
    >\n\n<style>\n\ninput.ng-valid{ // check number if valid\n\nbackground-color:\
    \ yellow;\n\n}\n\n</style>\n\n</head>\n\n<body>\n\n<form>\n\nPlease input your\
    \ number:<br>\n\n<input text=\"mynumber\" ng-model=\"psw\" required>\n\n</form>\n\
    \n</body>\n\n</html>\n\n## Output:\n\n![](images/00010.jpeg)\n\n## Explanation:\n\
    \n## “input.ng-valid” change thes input element status when the input is valid.\n\
    \n## <input text=\"mynumber\" ng-model=\"psw\" required> is used to input numbers.\
    \ ng-model= “psw” need a property of “required”, otherwise this element cannot\
    \ change status.\n\n## When you input some valid numbers to text field, the text\
    \ field background becomes yellow.\n\nCheck Email Address\n\n| $error.email |\n\
    \n“$error.email” is used to check email address validity; and return error message\
    \ if wrong email address format is being inputted.\n\n## Example 2.7\n\n<!DOCTYPE\
    \ html>\n\n<html ng-app=\"\">\n\n<head>\n\n<script src=\"js\\angular.min.js\"\
    ></script>\n\n<meta charset=\"utf-8\">\n\n</head>\n\n<body>\n\n<form name=\"iForm\"\
    >\n\nPlease input your email address: <br><br>\n\n<input type=\"email\" name=\"\
    eMailAddr\" ng-model=\"text\"> <br><br>\n\n<div ng-show=\"iForm.eMailAddr.$error.email\"\
    > Invalid email address!</div>\n\n</form>\n\n## Output:\n\n## ![](images/00011.jpeg)\n\
    \n## Explanation:\n\n“$error.email” is used to check email address validity; and\
    \ return error message if wrong email address format is being inputted.\n\nWhen\
    \ you input an wrong format email address, you will see an alert: Invalid email\
    \ address!\n\n## Summary\n\nIn this chapter we learnt ng-app directive, ng-model\
    \ directive, ng-bind directive and ng-repeat directive and their functionalities\
    \ with proper examples and outputs.\n\nng-app directive indicates you can write\
    \ AngularJS application codes in here.\n\nng-init directive initializes application\
    \ data.\n\nng-model directive binds the inputted value from HTML controls (input,\
    \ select, and textarea) to an application data.\n\nng-bind directive binds an\
    \ application data to a specified HTML element and outputs the value of the data.\n\
    \nng-repeat directive repeats to get the values of an array.\n\nng-valid directive\
    \ can change the status of a specified element when an input is valid.\n\n“$error.email”\
    \ is used to check email address validity; and return error message if wrong email\
    \ address format is being inputted.\n\nHands-On Project\n\n## Repeat Output\n\n\
    Open Notepad, write AngularJS codes (Figure 1):\n\n<!DOCTYPE html>\n\n<html>"
