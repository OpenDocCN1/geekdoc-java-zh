    choosedFruit\" ng-options=\"obj.fruit for obj in fruits\" size = \"4\">\n</select>\n\
    <h3>Your favorite fruit is: {{choosedFruit.fruit}}</h3>\n<h3>The color is: {{choosedFruit.color}}</h3>\n\
    </div>\n<script>\nvar app = angular.module('myFruit', [ ]);\napp.controller('iController',\
    \ function($scope) {\n    $scope.fruits = [\n    {fruit : \"Apple\", color : \"\
    Red\"},\n    {fruit : \"Orange\", color : \"Golden\"},\n    {fruit : \"Banana\"\
    , color : \"Green\"}\n];\n});\n</script>\n</body>\n</html>\n```\n\n## 输出：\n\n\
    ![](img/00042.jpeg)\n\n## 解析：\n\n- `<div ng-app=\"myFruit\" ng-controller=\"iController\"\
    >` 定义了控制器 `iController`。\n- `<select ng-model=\"choosedFruit\" ng-options=\"obj.fruit\
    \ for obj in fruits\" size = \"4\">` 创建选择框。\n- `{{choosedFruit.fruit}}` 显示水果。\n\
    - `{{choosedFruit.color}}` 显示颜色。\n- `var app = angular.module('myFruit', [ ]);`\
    \ 创建了一个模块。\n- `app.controller('iController', function($scope))` 定义了控制器。\n- `$scope.fruits\
    \ = [...]` 存储数组。\n\n## 总结\n\n在本章中我们学习了什么是控制器、如何定义控制器、以及 MVC 和 Scope。\n`ng-controller=\"\
    myController\"` 定义了一个控制器。\n`app = angular.module()` 创建了一个新模块。\n`app.controller()`\
    \ 将控制器的构造函数添加到模块中。\n`function($scope)` 定义了一个构造函数，同时也定义了一个对象 `$scope`。\n`$scope.property\
    \ = value` 将值赋值给 `$scope` 对象的属性。\n`Scope` 是连接控制器与视图的桥梁。\n\n## 动手项目\n\n打开记事本，编写\
