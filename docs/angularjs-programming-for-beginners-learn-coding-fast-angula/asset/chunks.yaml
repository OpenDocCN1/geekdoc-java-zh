    \    <script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n<h1>Using\
    \ OrderBy filter</h1>\n<div ng-app=\"\" ng-init=\"StudentsResult=[{name: 'Tienq',\
    \ marks:81},    {name: 'Svbrf', marks:70}, {name: 'Yaito', marks:90}, {name: 'Pewfn',\
    \ marks:63}, {name: 'Riet', marks:98}]\">\n<table border=\"1\" >\n<tr>\n<th>Student\
    \ Name</th>\n<th>Mathematics Result</th>\n</tr>\n<tr ng-repeat=\"x in StudentsResult\
    \ | orderBy:'-marks' \">\n<td ng-bind=\"x.name \"></td>\n<td ng-bind=\"x.marks\
    \ \"></td>\n</tr>\n</table>\n</div>\n</body>\n</html>\n```\n\nOutput:\n![](images/00016.jpeg)\n\
    \nExplanation:\n- `StudentsResult | orderBy:'-marks'` displays the values of `StudentsResult`\
    \ in descending order.\n- You can see that the highest mark is on top and the\
    \ lowest mark is on bottom using `orderBy:'-marks'`.\n- If you want reverse the\
    \ order, you can remove the `-`.\n\n#### Example 3.4\n\n```html\n<!DOCTYPE html>\n\
