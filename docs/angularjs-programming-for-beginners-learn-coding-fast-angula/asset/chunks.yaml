    "x.salary | currency " converts the salary to currency format.


    In the above example, there are two columns in the table, the first column is
    Employee Name and the second is Employee Salary. The salary column displays the
    salary in currency format.


    Array filter


    | Array &#124; filter:input |


    “Array | filter:input” can filter the array elements based on the user input.


    ## Example 3.6


    <!DOCTYPE html>


    <html ng-app="">


    <head>


    <script src="js\angular.min.js"></script>


    <meta charset="utf-8">


    </head>


    <body>


    <div ng-init="students = // define an array “students”


    [{name:''Andy'', age:''19''},


    {name:''Rose'', age:''18''},


    {name:''Jony'', age:''17''},


    {name:''Judy'', age:''16''},


    {name:''Tomy'', age:''15''},


    {name:''Lily'', age:''14''}]">


    </div>


    <table>


      <tr><th>Name</th><th>Age</th></tr>


      <tr ng-repeat="person in students | filter:myList"> 


    // filter the array “students” according to the input value


        <td>{{person.name}}</td>


        <td>{{person.age}}</td>


      </tr>


    </table>


    <br><br>


    <label>Please input one of the above name or age


    <br><br>


    <input ng-model="myList"></label> // user input


    </body>


    </html>


    Please try to input a number 18 to text field.


    ## Output:


    ![](images/00019.jpeg)


    ## Explanation:


    “<div ng-init="students =….” defines an array “students”.


    “person in students | filter:myList” filters the array “students” according to
    the input value “myList”.


    <input ng-model="myList"> accepts the user input, and store the input value to
    “myList”.


    When you input 18 to text field, the output shows “Rose  18”.


