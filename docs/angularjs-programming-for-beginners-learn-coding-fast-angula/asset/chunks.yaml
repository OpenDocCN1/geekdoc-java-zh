  trans: "\n\n`angular.isDefined()` 测试一个值是否已经定义，如果该值已定义，则返回 `true`。\n\n## 示例 8.10\n\
    \n## <html>\n\n```html\n<html\n<script src=\"js\\angular.min.js\"></script>\n\
    <body>\n<script>\nvar futureCar;\nvar existingCar = \"Very Good!\";\ndocument.write(angular.isDefined(futureCar)\
    \ + \" \");\ndocument.write(angular.isDefined(existingCar) + \" \");\n</script>\n\
    </body>\n</html>\n```\n\n## 输出:\n\nfalse true\n\n## 解释:\n\n`futureCar` 尚未被定义。因此，`isDefined(futureCar)`\
    \ 返回 `false`。\n\n`existingCar` 已定义。因此，`isDefined(existingCar)` 返回 `true`。\n\n\
    ---\n\n## `isUndefined()`\n\n`angular.isUndefined()` 测试一个值是否未被定义，如果该值未被定义，则返回\
    \ `true`。\n\n## 示例 8.11\n\n```html\n<html\n<script src=\"js\\angular.min.js\"\
    ></script>\n<body>\n<script>\nvar futureCar;\nvar existingCar = \"Very Good!\"\
    ;\ndocument.write(angular.isUndefined(futureCar) + \" \");\ndocument.write(angular.isUndefined(existingCar)\
    \ + \" \");\n</script>\n</body>\n</html>\n```\n\n## 输出:\n\ntrue false\n\n## 解释:\n\
    \n`futureCar` 尚未被定义。因此，`isUndefined(futureCar)` 返回 `true`。\n\n`existingCar` 已定义。因此，`isUndefined(existingCar)`\
    \ 返回 `false`。\n\n---\n\n## 总结\n\n- `var myModule = angular.module('myApplication',\
    \ [ ])` 创建了一个带有 `myApplication` 的新模块 `myModule`。\n- `myModule.controller('myController',\
    \ function($scope)` 使用 `controller()` 方法将控制器的构造添加到模块中，使 `myController` 属于 `myModule`。\n\
    - `$scope` 被为一个对象。\n- `angular.uppercase()` 将字符串转换为大写。\n- `angular.lowercase()`\
    \ 将字符串转换为小写。\n- `isString()` 测试一个值是否为字符串，如果是字符串则返回 `true`。\n- `isNumber()` 测试一个值是否为数字，如果是数字则返回\
    \ `true`。\n- `isDate()` 测试一个值是否为 `Date` 对象，如果是 `Date Object` 则返回 `true`。\n- `isFunction()`\
    \ 测试一个值是否为函数，如果是函数则返回 `true`。\n- `isElement()` 测试一个值是否为 `Dom` 元素，如果是 `Dom` 元素则返回\
    \ `true`。\n- `isObject()` 测试一个值是否为对象，如果是对象则返回 `true`。\n- `isDefined()` 测试一个值是否已经定义，如果已定义则返回\
    \ `true`。\n- `isUndefined()` 测试一个值是否未被定义，如果未被定义则返回 `true`。\n\n---\n\n## 动手项目\n\
    \n### 模块示例\n\n打开记事本，编写 AngularJS 代码：\n\n```html\n<!DOCTYPE html>\n<html>\n<script\
    \ src=\"js\\angular.min.js\"></script>\n<body>\n<div ng-app=\"myApplication\"\
    \ ng-controller=\"myController\">\n高度:\n<p><input type=\"number\" ng-model=\"\
    height\"></p>\n长度:\n<p><input type=\"number\" ng-model=\"length\"></p>\n<br>\n\
    三角形面积:\n<h4><p>{{(height * length)/2}}</p></h4>\n</div>\n<script>\nvar app = angular.module('myApplication',\
    \ [ ]);\napp.controller('myController', function($scope) {\n    $scope.height\
    \ = 0;\n    $scope.length = 0;\n});\n</script>\n</body>\n</html>\n```\n\n![](img/00045.jpeg)\n\
    \n请将文件命名为 `ModuleSample.html` 并保存在 `myFolder` 中。双击 `ModuleSample.html` 文件，输入三角形的高度和长度，并查看输出。\n\
    \n**输出:** \n\n![](img/00046.jpeg)\n\n## 解释:\n\n- `ng-controller=\"myController\"\
    ` 定义了一个控制器。\n- `app = angular.module()` 创建了一个新模块。\n- `app.controller()` 将控制器的构造函数添加到模块中。\n\
    - `function($scope)` 定义了一个构造函数，同时也定义了一个对象 `$scope`。当页面加载时，该函数将运行。\n- `$scope.property\
    \ = value` 将值赋值给 `$scope` 对象的属性。\n\n---\n\n# 附录 1\n\n## Ajax 基础\n\n### 什么是 Ajax？\n\
    \nAJAX 代表“异步 JavaScript 和 XML”。AJAX 是一种新技术，通过服务器使用 XML、HTML、CSS、PHP、ASP 和 JavaScript\
    \ 创建更好、更快、更具交互性的 Web 脚本。\n\nAJAX 用于更新网页的一部分，而无需重新加载整个页面。\n\n这意味着通过 Ajax，你可以与服务器通信以更新信息，而无需刷新网页。\n\
    \n通过 jQuery 和 JavaScript，你可以轻松地在网页中实现 Ajax。\n\n运行 Ajax 需要一个服务器。\n\n下将将介绍如何设置服务器。\n\
    \n### 步骤 1:\n`下载“AppServ”免费链接: [http://www.angular.com/]`\n\n### 步骤 2:\n`安装 AppServ`\n\
    `images/0047.jpeg`\n\n### 步骤 3:\n`检查任何文件`\n`images/0048.jpeg`\n\n### 步骤 4:\n`服务器名称:\
    \ localhost`\n`images/0049.jpeg`\n\n### 步骤 5:\n`输入密码: 123`\n`images/0050.jpeg`\n\
    \n### 步骤 6:\n`完成按钮`\n`images/0051.jpeg`\n\n### 步骤 7:\n`检查页面`\n`images/0052.jpeg`\n\
    \n### 步骤 8:\n`文件夹 C:\\AppServer\\www`\n`images/0053.jpeg`\n\n---\n\n## 示例 1: \
    \ B1\n\n```html\n<script lang=\"JavaScript\">\nvar ajaxObject = new XMLHttpRequest();\n\
    ajaxObject.open(\"GET\", \"data.txt\", true);\najaxObject.onreadystatechange =\
    \ function() {\n    if (ajaxObject.readyState == 4) {\n        alert(ajaxObject.responseText);\n\
    \    }\n};\najaxObject.send();\n</script>\n```\n\n将文件保存为 `B1.html` 并双击运行。\n\n\
    **输出:**\nHello World!\n\n## 解释:\n\n- 第 2 行：`new XMLHttpRequest()` 创建了一个名为 `ajaxObject`\
    \ 的 `XMLHttpRequest` 对象，它将用于 Ajax 脚本。\n- 第 3 行：`ajaxObject.open(\"GET\", \"data.txt\"\
    , true)` 初始化了 `XMLHttpRequest` 对象。\"\"GET\"` 指定了请求方法。\"\"data.txt\"` 是提供数据资源的\
    \ URL。`true` 表示使用异步技术。\n- 第 4 行：`ajaxObject.onreadystatechange = function() {\
    \ ... }` 指定了一个在接收到服务器响应时运行的函数。服务器响应的状态为 0 到 4。\n- 第 5 行：`if (ajaxObject.readyState\
    \ == 4)` 意味着如果服务器响应为 4，则返回的数据可用。\n- 第 6 行：`alert(ajaxObject.responseText)` 显示从\
    \ `data.txt` 获取的文本。\n\n"
- fmt: "\n`ajaxObject.send()` sends the request to the server.\n\n## Sample 2\n\n\
    ### Example B2\n\n1. `<input type=\"button\" value=\"try\" onClick=\"ajaxRequest();\"\
    />`\n2. `<script type=\"text/javascript\">`\n3-20.\n```javascript\nfunction ajaxRequest()\
    \ {\n  if (window.XMLHttpRequest){\n    ajaxObject = new XMLHttpRequest();\n \
