  trans: "\n\n当复制指定的文本时，结果 `1` 将为 `true`。\n\n当剪切指定的文本时，结果 `2` 将为 `true`。\n\n## 示例\
    \ 5.8\n\n```html\n<!doctype html> \n<html ng-app> \n<head> \n<script src=\"js\\\
    angular.min.js\"></script> \n<meta charset=\"utf-8\"> \n</head> \n<<body>\n<br>\n\
    <input ng-copy= \"result1=true\" ng-init= \"result1=false; value1='please copy\
    \ me'\" ng-model= \"value1\" > \ncopy status: {{result1}}</br><br>\n<input ng-cut=\
    \ \"result2=true\" ng-init= \"result2=false; value2='please cut me'\" ng-model=\
    \ \"value2\" > \ncut status: {{result2}} \n</body> \n</</html> \n```\n\n## 输出:\n\
    \n![](img/00032.jpeg)\n\n## 解释:\n\n`ng-copy= \"result1=true\"` : 当复制指定的文本时，结果\
    \ `1` 将为 `true`。\n\n`ng-cut= \"result2=true\"` : 当剪切指定的文本时，结果 `2` 将为 `true`。\n\
    \n`{{result1}}` 将显示 `true` 或 `false`。\n\n`{{result2}}` 将显示 `true` 或 `false`。\n\
    \n## 总结\n\n在本章中，我们学习了不同的事件，如点击事件、双击事件、鼠标移动事件、鼠标移入事件、鼠标离开事件、键盘释放事件和键盘按下事件。\n\n\
    `ng-click` 定义了一个 AngularJS 点击事件。\n\n`ng-dblclick` 定义了一个 AngularJS 双击事件。\n\n`ng-mousemove`\
    \ 定义了一个 AngularJS 鼠标移动事件。\n\n`ng-mouseover` 定义了一个 AngularJS 鼠标移入事件。\n\n`ng-mouseleave`\
    \ 定义了一个 AngularJS 鼠标离开事件。\n\n`ng-keyup` 定义了一个 AngularJS 键盘释放事件。\n\n`ng-keydown`\
    \ 定义了一个 AngularJS 键盘按下事件。\n\n`ng-copy= \"result1=true\"` : 当复制指定的文本时，结果 `1` 将为\
    \ `true`。\n\n`ng-cut= \"result2=true\"` : 当剪切指定的文本时，结果 `2` 将为 `true`。\n\n## 动手项目\n\
    \n## 鼠标移入事件\n\n打开记事本，编写 AngularJS 代码：\n\n```html\n<!doctype html>\n<html <script\
    \ src=\"js\\angular.min.js\"></script>\n<body ng-app=\"\">\n<br><br>\n<textarea\
    \ ng-mouseover=\"count = count + 1\" ng-init=\"count=0\">\n鼠标悬停在这里。\n</textarea>\n\
    <br><br>\n<h2>count: {{count}}</h2>\n</body>\n</html>\n```\n\n![](img/00033.jpeg)\n\
    \n请将文件命名为 `MouseOverEvent.html` 并保存到 `myFolder` 中，运行 `MouseOverEvent.html` 文件，将鼠标悬停在\
    \ textarea 上 8 次，然后查看输出。\n\n### 输出:\n\n![](img/00034.jpeg)\n\n## 解释:\n\n`ng-mouseover=\"\
    count = count + 1\"` 在鼠标移动到文本区域上方时求值表达式。\n\n# 第 6 小时\n\n## 表达式\n\n`{{ Expression\
    \ }}`\n\n`{{Expression}}` 用于将值绑定到 html 元素并显示该值。它的作用与 `ng-bind` 指令相同。`{{Expression}}`\
    \ 写在两个大括号内。`{{expression}}` 基本上是纯 JavaScript 表达式。有不同种的表达式，让我们逐一讨论。\n\n### 字符串表达式\n\
    \n我们知道字符串是字符的集合。在 AngularJS 中，字符串表达式如下。\n\n| <element> {{First String + Second\
    \ String}} </element> |\n\n#### 示例 6.1\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \    <title>AngularJS 初学者教程</title>\n    <script src=\"js/angular.min.js\"></script>\n\
    </head>\n<body>\n<h4>使用字符串表达式组合两个字符串</h4>\n<div ng-app=\"\" >\n第一个字符串 &nbsp;&nbsp;&nbsp;:\
    \ <input type=\"text\" ng-model=\"firstString\"/><br><br>\n第二个字符串: <input ng-model=\"\
    secondString\"/><br><br>\n结果字符串:<p style=\"color:blue;font-weight:bold;\">{{firstString\
    \ +\" \"+secondString}}</p>\n</div>\n</body>\n</html>\n```\n\n输出:\n\n![](img/00035.jpeg)\n\
    \n### 解释:\n\n`{{firstString +\" \"+secondString}}` 将两个字符串连接在一起。\n\n`{{ expression}}`\
    \ 显示表达式的值。\n\n在上面的示例中，第一个文本框中写了 `Ray`，第二个文本框中写了 `Yao`，但在结果字符串区域由于使用了字符串表达式 `{{\
    \ }}`，`Ray` 字符串和 `Yao` 字符串被组合在了一起。注意：加号 `+ 用于字符串拼接。\n\n### 数字表达式\n\n在 AngularJS\
    \ 中，你可以使用数字表达式执行不同的数学运算。\n\n| <element> {{First Number + Second Number}} </element>\
    \ |\n\n#### 示例 6.2\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJS\
    \ 初学者教程</title>\n    <script src=\"js/angular.min.js\"></script>\n</head>\n<body>\n\
    <h4>使用数字表达式相乘两个数字</h4>\n<div ng-app=\"\" ng-init=\"firstNumber=9;secondNumber=6\"\
    >\n第一个数字 &nbsp;&nbsp;&nbsp;: <input type=\"text\" ng-model=\"firstNumber\"/><br><br>\n\
    第二个数字: <input ng-model=\"secondNumber\"/><br><br>\n结果字符串:<p style=\"color:blue;font-weight:bold;\"\
    >{{firstNumber * secondNumber}}</p>\n</div>\n</body>\n</html>\n```\n\n输出:\n\n\
    ![](img/00036.jpeg)\n\n### 解释:\n\n`{{firstNumber * secondNumber}}` 将 `firstNumber`\
    \ 和 `secondNumber` 相乘。\n\n`{{ expression}}` 显示表达式的值。\n\n在上面的示例中，第一个文本框中写了 `9`，第二个文本框中写了\
    \ `6`，但在结果字符串区域由于使用了数字表达式 `{{ }}`。\n\n### 对象表达式\n\nAngularJS 字符串表达式如下。（这里应该是对象表达式）\n\
    对象表达式如下：\n\n#### 示例 6.3\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJS\
    \ 初学者教程</title>\n    <script src=\"js/angular.min.js\"></script>\n</head>\n<body>\n\
    <h4>对象表达式</h4>\n<div ng-app=\"\" ng-init=\"user={name:'John', age:20}\">\n姓名:\
    \ <input ng-model=\"user.name\"><br><br><br>\n年龄: <input ng-model=\"user.age\"\
    ><br><br><br>\n结果: {{user.name}} 今年 {{user.age}} 岁。\n</div>\n</body>\n</html>\n\
    ```\n\n输出:\n\n![](img/00037.jpeg)\n\n### 解释:\n\n`{{user.name}}` 显示对象的属性。\n\n`{{user.age}}`\
    \ 显示对象的属性。\n\n### 数组表达式\n\nAngularJS 类似于数组。语法如下：\n\n| <element> {{val1, val2,\
    \ val3}} </element> |\n\n#### 示例 6.4\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \    <title>AngularJS 初学者教程</title>\n    <script src=\"js/angular.min.js\"></script>\n\
    </head>\n<body>\n<h4>数组表达式</h4>\n<div ng-app=\"\" ng-init=\"colors=['Red','Green','Blue']\"\
    >\n第一种颜色: {{colors[0]}}<br>\n第二种颜色: {{colors[1]}}<br>\n第三种颜色: {{colors[2]}}\n\
    </div>\n</body>\n</html>\n```\n\n输出:\n\n![](img/00038.jpeg)\n\n### 解释:\n\n`{{colors[0]}}`\
    \ 显示数组的第一个元素。\n\n`{{colors[1]}}` 显示数组的第二个元素。\n\n`{{colors[2]}}` 显示数组的第三个元素。\n\n"
- fmt: "\nPlease save the file with name `ExpressionSample.html` at `myFolder`. Double\
    \ click `ExpressionSample.html` file, and see the output.\n\nOutput:\n\n![](images/00040.jpeg)\n\
    \n## Explanation\n\n`{{firstNumber + secondNumber}}` shows the sum of the `firstNumber`\
    \ and `secondNumber`.\n\n# Hour 7\n\n## Controller & Scope\n\n### What is Controller?\n\
    \nThe controller is basically a JavaScript object that controls the flow of data\
    \ of an application. So the AngularJS application is controlled by `Controller`.\n\
    \n### How to define Controller?\n\nThe `ng-controller` directive is used to define\
    \ the `Controller`. We know that `Controller` is a JavaScript object which contains\
    \ JavaScript function and properties. The syntax of `Controller` is as following:\n\
    \n| `<div ng-app=\"\" ng-controller=\"controllerName\">` |\n\n### Example 7.1\n\
    \n```html\n<html>\n<script src=\"js\\angular.min.js\"></script>\n<body>\n<div\
    \ ng-app=\"Calculation\" ng-controller=\"myController\">\nFirst Number: <input\
    \ type=\"number\" ng-model=\"firstNumber\"><br>\nSecond Number: <input type=\"\
    number\" ng-model=\"secondNumber\"><br>\n<br>\nSum: {{firstNumber + secondNumber}}\n\
    </div>\n<script>\nvar app = angular.module('Calculation', [ ]);\napp.controller('myController',\
    \ function($scope) {\n    $scope.firstNumber = 4;\n    $scope.secondNumber = 8;\n\
    });\n</script>\n</body>\n</html>\n```\n\nOutput:\n\n![](images/00041.jpeg)\n\n\
    ### Explanation\n\n- `ng-controller=\"myController\"` defines a controller.\n\
    - `app = angular.module()` creates a new module.\n- `app.controller()` adds the\
    \ controller's constructor function to the module.\n- `function($scope)` defines\
    \ a constructor function, and also defines an object `$scope`. When page is loaded,\
    \ the function will run.\n- `$scope.property = value` assigns the value to the\
    \ property of `$scope` object.\n\nIn the above example, at the first time when\
    \ the page is loaded, you see there are two textboxes with different numbers,\
    \ which are 4 and 8; the result area displays the result 12.\n\n`angular.module()`:\
    \ AngularJS module is a collection of various part of an application, such as\
    \ controllers, services, filters, directives, etc. An AngularJS module defines\
    \ an application, which will be discussed in later chapter in detail.\n\n### What\
    \ is Scope?\n\nScope is a JavaScript object which contains model data.\n\n| `function\
    \ ($scope) { }` |\n\n`$scope` is a parameter of JavaScript function which is called\
    \ by a controller. Let's take an example for understanding.\n\n### Example 7.2\n\
    \n```javascript\n<script>\nfunction ($scope) {\n    $scope.firstNumber = 23;\n\
    \    $scope.secondNumber = 63;\n}\n</script>\n```\n\n### Explanation\n\nIn above\
    \ example, the `$scope` is the parameter of the function `function ($scope) {\
    \ }`. `$scope` is an object in AngularJS.\n\n`$scope.firstNumber` and `$scope.secondNumber`\
    \ are models used in HTML. Model data is accessed by the `$scope` object. We assign\
    \ values to the model with following formula: `$scope.property = value`.\n\n###\
    \ For example:\n\n```javascript\n$scope.firstNumber = 23;\n$scope.secondNumber\
    \ = 63;\n```\n\n## MVC & Scope\n\n### What is MVC?\n\nMVC stands for Model, View,\
    \ and Controller.\n- The Model directly manages the data, logic and rules of the\
    \ application.\n- The View displays the data.\n- The Controller handles the input.\n\
    \nIn above example:\n- `$scope.firstNumber` and `$scope.secondNumber` are models.\n\
    - `<p ng-bind = \"firstNumber + secondNumber\"></p>` is a view used in HTML.\n\
    - `ng-controller=\"myController\"` defines a controller.\n\nThe communication\
    \ between controller and view is called `Scope`, so we can say `Scope` works like\
    \ a bridge that connects controller to view.\n\n## Module Basic\n\n| `app = angular.module()`\
    \ |\n\n`app = angular.module()` creates a new module.\n\n### Example 7.3\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<script src=\"js\\\
    angular.min.js\"></script>\n</head>\n<body>\n<div ng-app=\"myFruit\" ng-controller=\"\
    iController\">\n<p>Please select your favorite fruit.</p>\n<select ng-model=\"\
    choosedFruit\" ng-options=\"obj.fruit for obj in fruits\" size = \"4\">\n</select>\n\
    <h3>Your favorite fruit is: {{choosedFruit.fruit}}</h3>\n<h3>The color is: {{choosedFruit.color}}</h3>\n\
    </div>\n<script>\nvar app = angular.module('myFruit', [ ]);\napp.controller('iController',\
    \ function($scope) {\n    $scope.fruits = [\n    {fruit : \"Apple\", color : \"\
    Red\"},\n    {fruit : \"Orange\", color : \"Golden\"},\n    {fruit : \"Banana\"\
    , color : \"Green\"}\n];\n});\n</script>\n</body>\n</html>\n```\n\n## Output:\n\
    \n![](images/00042.jpeg)\n\n## Explanation:\n\n- `<div ng-app=\"myFruit\" ng-controller=\"\
    iController\">` defines a controller `iController`.\n- `<select ng-model=\"choosedFruit\"\
    \ ng-options=\"obj.fruit for obj in fruits\" size = \"4\">` create select.\n-\
    \ `{{choosedFruit.fruit}}` shows fruit.\n- `{{choosedFruit.color}}` shows color.\n\
    - `var app = angular.module('myFruit', [ ]);` create a module.\n- `app.controller('iController',\
    \ function($scope))` defines a controller.\n- `$scope.fruits = [...]` stores array.\n\
    \n## Summary\n\nIn this chapter we learnt what controller is, how to define controller,\
    \ what MVC and Scope are.\n`ng-controller=\"myController\"` defines a controller.\n\
    `app = angular.module()` creates a new module.\n`app.controller()` adds the controller's\
    \ constructor function to the module.\n`function($scope)` defines a constructor\
    \ function and also defines an object `$scope`.\n`$scope.property = value` assigns\
    \ the value to the property of `$scope` object.\n`<p ng-bind = \"firstNumber +\
    \ secondNumber\"></p>` displays data.\n`Scope` is a bridge that connects controller\
    \ to view.\n\n## Hands-On Project\n\nOpen Notepad, write AngularJS codes (Figure\
    \ 1):\n\n```html\n<!DOCTYPE html>\n<html>\n<script src=\"js\\angular.min.js\"\
    ></script>\n<body>\n<div ng-app=\"myApplication\" ng-controller=\"myController\"\
    >\nFirst Text: <p><textarea ng-model=\"firstNumber\"></textarea></p>\nSecond Text:\
    \ <p><textarea ng-model=\"SecondNumber\"></textarea></p>\n<br>\nConnected Text:\
    \ <h4><p>{{firstText + \" \" + SecondText}}</p></h4>\n</div>\n<script>\nvar app\
    \ = angular.module('myApplication', [ ]);\napp.controller('myController', function($scope)\
    \ {\n    $scope.firstText = \"JavaScript\";\n    $scope.SecondText = \"8 Hours\"\
    ;\n});\n</script>\n</body>\n</html>\n```\n\n![](images/00043.jpeg)\n(Figure1)\n\
    \nPlease save the file with name `ControllerSample.html` at `myFolder`. Double\
    \ click `ControllerSample.html` file, input texts, and see the output. (Figure\
    \ 2)\n\nOutput: (Figure 2 as following)\n\n![](images/00044.jpeg)\n\n# Hour 8\n\
    \n## Module & API\n\n### What is AngularJS module?\n\nAn AngularJS module is a\
    \ collection of various part of an application, such as controllers, services,\
    \ filters, directives, etc. An AngularJS module defines an application.\n\nThe\
    \ syntax of create a module looks like this:\n\n| `var myModule = angular.module(\"\
    myApplication\", [ ]);` |\n\n### Example 8.1\n\n```html\n<html>\n<script src=\"\
    js\\angular.min.js\"></script>\n<body>\n<div ng-app=\"myApplication\" ng-controller=\"\
    myController\">\n{{ firstNum + lastNum }}\n</div>\n<script>\nvar myModule = angular.module(\"\
    myApplication\", [ ]);\nmyModule.controller(\"myController\", function($scope)\
    \ {\n    $scope.firstNum = 100;\n```\n"
