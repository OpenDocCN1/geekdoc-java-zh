    \n### 第 3-9 行:\n这些代码创建了一个名为 `ajaxObject` 的 `XMLHttpRequest` 对象，它将用于 Ajax 脚本。\n\
    如果浏览器是 `NON-IE`，它使用 `new XMLHttpRequest()` 创建 `ajaxObject`。\n如果浏览器是 `IE`，它使用 `new\
    \ ActiveXObject(...)` 创建 `ajaxObject`。\n\n### 第 10 行:\n`ajaxObject.open(\"POST\"\
    , \"data.txt\", true)` 初始化 `XMLHttpRequest` 对象的请求。\n`\"POST\"` 指定请求方法。也可以使用 `\"\
    GET\"` 或 `\"PUT\"`。\n`\"data.txt\"` 是提供数据资源的 URL。\n在这里，`data.txt` 的内容为 `\"Hello\
    \ Ajax World!\"`。\n`\"true\"` 表示使用异步技术。\n\n### 第 11 行:\n`ajaxObject.onreadystatechange\
    \ = function() { ... }` 指定了一个在接收服务器响应时运行的函数。服务器的响应状态为 0 到 4：\n\n| readyState |\
    \ 解释 |\n| :--- | :--- |\n| 0 | 未初始化 |\n| 1 | 已初始化 |\n| 2 | 发送数据 |\n| 3 | 接收数据\
    \ |\n| 4 | 完成。返回的数据可用。 |\n\n`ajaxObject.onreadystatechange` 正在等待服务器的响应。\n\n###\
    \ 第 12 行:\n`if (ajaxObject.readyState == 4)` 表示如果服务器响应状态为 4，则返回的数据可用。\n\n### 第\
