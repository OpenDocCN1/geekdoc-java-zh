  trans: "\n\nAngularJS 允许我们使用属性以非常简单的方式扩展 HTML。这些属性本质上都是指令（directives）。有不同类型的指令，它们在应用程序中可以发挥不同的作用。它们分别是\
    \ `App Directive`、`Model Directive`、`Bind Directive`、`Init Directive` 和 `Repeat\
    \ Directive`。让我们逐一详细讨论。\n\n### App Directive\n\n| `ng-app= \" \"` |\n\n`app` 指令定义了\
    \ AngularJS 应用程序区域。`app` 指令的语法为 `ng-app = \" \";`。在这里，`ng` 是 AngularJS 的命名空间，`app`\
    \ 是 Angular JS 的应用区域。\n\n#### 示例 2.1\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \    <title>AngularJS for beginners</title>\n    <script src=\"js\\angular.min.js\"\
    ></script>\n</head>\n<body>\n    <div ng-app=\" \"> \n        The AngularJSapplication\
    \ has been started.\n    </div>\n</body>\n</html>\n```\n\n#### 输出:\nThe AngularJSapplication\
    \ has been started.\n\n#### 解析:\n在 `head` 部分（`<script src = \"js\\angular.min.js\"\
    > </script>`），加载了 AngularJS 框架，这意味着我们现在可以使用 AngularJS 框架了。\n\n在 `body` 部分（`<div\
    \ ng-app=\" \"> </div>`），可以在这里编写 AngularJS 应用程序。\n\n在最后一个标签（`</div>`），AngularJS\
    \ 应用程序结束结束。\n\n### Model Directive\n\n| `ng-model = \"data\"` |\n\n`model` 指令用于将\
    \ HTML 控件（输入、复选框和选择等）输入的值绑定到应用程序数据。`ng-model = \"data\"` 是 `model` 指令的语法。让我们来看一个例子以便更好地理解。\n\
    \n#### 示例 2.2\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJSfor\
    \ beginners</title>\n    <script src=\"js\\angular.min.js\"></script>\n</head>\n\
    <body>\n<div ng-app=\"\">\n<p>User Name: <br>\n<input type=\"text\" ng-model =\
    \ \"Username\"></p>\n</div>\n</body>\n</html>\n```\n\n#### 输出:\nUsername:\n\n\
    #### 解析:\n`\"ng-model = “Username\"` 将来自 HTML 控件的输入值绑定到 `\"Username\"`。\n\n现在你看不到结果，因为此程序缺少了代码\
    \ `<p ng-bind=\"Username\"></p>`。\n\n### Bind Directive\n\n| `<p>ng-bind = \"\
    data\"</p>` |\n\n`bind` 指令用于将数据值绑定到 html 元素 `<p>`；`bind` 指令的语法是 `<p>ng-bind =\
    \ \"data\"</p>`。让我们来看一个例子以便更好地理解。\n\n#### 示例 2.3\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n    <title>AngularJSfor beginners</title>\n    <script src=\"\
    js\\angular.min.js\"></script>\n</head>\n<body>\n<div ng-app=\"\">\n<p>User Name:\
    \ <br>\n<input type=\"text\" ng-model = \"Username\"></p>\n<p ng-bind=\"Username\"\
    ></p>\n</div>\n</body>\n</html>\n```\n\n打开记事本并将上述代码以 `.html` 扩展粘贴，并在输入框中输入用户名“Ray\
    \ Yao”。\n\n#### 输出:\n![](img/00007.jpeg)\n\n#### 解析:\n`“<p>ng-bind=\"Username\"\
    </p>\"` 将 `\"Username\"` 的值绑定到 `<p></p>` 标签，并“显示”它的值。\n\n在上面的示例中（`<p ng-bind=\"\
    Username\"></p>`）可以更新 `\"Username\"` 的值并写入 `<p></p>` 标签。\n\n`<p>ng-bind=\"data\"\
    </p>` 用于指定的 html 元素 `<p>` 中“输出”`data` 的值。\n\n#### ng-model & ng-bind\n\n它们都使用“bind”（绑定）。\n\
    \n(1) `ng-model = \"data\"`：将来自 Html 控件（文本区域、复选框、选择、输入和单选按钮等）的输入值绑定到 `\"data\"\
    `。\n\n#### 例如:\n`\"ng-model = “Username\"` 将输入值绑定到 `\"Username\"`。（就像将输入值赋值给 `\"\
    Username\"`一样。）\n\n(2) `<p>ng-bind= \"data\"</p>`：将 `\"data\"` 绑定到 html 元素 `<p></p>`。\n\
    \n#### 例如:\n`<p ng-bind=\"Username\"></p>` 将数据 `\"Username\"` 绑定到 `<p></p>` 元素并显示其值。（就像在\
    \ `<p></p>` 中显示 `\"Username\"` 的值一样。）\n\n### Init Directive\n\n| `ng-init = \"\
    data = ‘value’\"` |\n\n`init` 指令用于用值初始化数据。`init` 指令的语法为 `ng-init = \"data = ‘value’\"\
    `。让我们来看一个例子以便更好地理解。\n\n#### 示例 2.4\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \    <title>AngularJSfor beginners</title>\n    <script src=\"js\\angular.min.js\"\
    ></script>\n</head>\n<body>\n<div ng-app=\"\" ng-init=\"Username= 'Andy Smith'\
    \ \">\n    <p>User Name: <input type=\"text\" ng-model = \"Username\"></p>\n \
    \   <p ng-bind=\"Username\"></p>\n</div>\n</body>\n</html>\n```\n\n打开记事本并将上述代码以\
    \ `.html` 扩展粘贴。\n\n#### 输出:\n![](img/0008.jpeg)\n\n#### 解析:\n`\"ng-init=Username=\
    \ 'Andy Smith' \"` 为 `\"Username\"` 初始化一个值。\n\n在上面的示例中，`<div ng-app=\"\" ng-init=\"\
    Username= 'Andy Smith' \">`，AngularJS 应用程序结束。\n\n### Repeat Directive\n\n| `ng-repeat\
    \ = \"item in array\"` |\n\n`repeat` 指令的作用像循环一样。`repeat` 指令通过重复来获取数组的值。\n\n####\
    \ 示例 2.5\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJSfor\
    \ beginners</title>\n    <script src=\"js\\angular.min.js\"></script>\n</head>\n\
    <body>\n<div ng-app=\"\">\n<ul>\n    <li ng-repeat=\"x in ['Red', 'Green', 'Blue']\"\
    >{{x}}</li>\n</ul>\n</div>\n</body>\n</html>\n```\n（注：根据提供的文本结构，repeat 指令的示例是片段化的；此处重构的逻辑遵循标准的指令逻辑）\n\
    \n在 `body` 部分（`<div ng-app=\" \"> </div>`），可以在这里编写 AngularJS 应用程序。\n\n在最后一个标签（`</div>`），AngularJS\
    \ 应用程序结束。\n\n### Valid Directive\n\n| `ng-valid` |\n\n`valid` 指令可以在输入有效时更改指定元素的状态。\n\
    \n#### 示例 2.6\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJS\
    \ for beginners</title>\n    <script src=\"js\\angular.min.js\"></script>\n  \
    \  <style>\n    input.ng-valid {\n        background-color: yellow;\n    }\n \
    \   </style>\n</head>\n<body>\n<form>\nPlease enter number:\n<input type=\"text\"\
    \ ng-model=\"psw\" required>\n</form>\n</body>\n</html>\n```\n\n#### 输出:\n![](img/0010.jpeg)\n\
    \n#### 解析:\n`\"input.ng-valid\"` 在输入有效时更改背景颜色。\n\n### Check Email Address\n\n\
    | `$error.email` |\n\n`“$error.email\"` 用于检查电子邮件地址的有效性；如果输入了错误的邮箱格式，则返回错误消息。\n\
    \n#### 示例 2.7\n\n```html\n<!DOCTYPE html>\n<html ng-app=\"\">\n<head>\n    <title>AngularJS\
    \ for beginners</title>\n    <script src=\"js\\angular.min.js\"></script>\n</head>\n\
    <body>\n<form name=\"iForm\">\nPlease input your email address: <br><br>\n<input\
    \ type=\"email\" name=\"eMailAddr\" ng-model=\"text\"> <br><br>\n<div ng-show=\"\
    iForm.eMailAddr.$error.email\"> Invalid email address!</div>\n</form>\n</body>\n\
    </html>\n```\n\n#### 输出:\n![](img/0011.jpeg)\n\n#### 解析:\n当你输入格式错误的电子邮件地址时，你将看到一个提示：Invalid\
    \ email address!\n\n"
- fmt: "\n```html\n<script src=\"js\\angular.min.js\"></script>\n<body>\n<div data-ng-app=\"\
    \" data-ng-init=\"colors=['Red','Yellow','Green','White','Black']\">\n  <p>Show\
    \ colors:</p>\n  <ol type=\"1\">\n    <li data-ng-repeat=\"show in colors\">\n\
    \      {{ show }}\n    </li>\n  </ol>\n</div>\n</body>\n</html>\n```\n\n![](images/00012.jpeg)\n\
    (Figure1)\n\nPlease save the file with name `RepeatOutput.html` at `myFolder`.\
    \ Note: make sure to use `.html` extension name.\n\nDouble click `RepeatOutput.html`\
    \ file, `RepeatOutput.html` will be run by a browser, and see the output. (Figure\
    \ 2)\n\nOutput: (Figure 2)\n\n![](images/00013.jpeg)\n\n## Explanation:\n\n- `data-ng-app`\
    \ is almost the same as `ng-app`, but `data-ng-app` is more suitable for HTML5.\n\
    - `<div data-ng-app=\"\" > </div>` indicates you can write AngularJSapplication\
    \ in here.\n- `data-ng-init` is almost the same as `ng-init`, but `data-ng-init`\
    \ is more suitable for HTML5.\n- `data-ng-init=\"colors=…\"` initializes array\
    \ `colors` with some values.\n- `data-ng-repeat =\"show in colors\"` repeats to\
    \ get the value of array `colors`, and assigns all array values to `show` variable.\n\
    - `{{ show }}` displays the value of `show`.\n\n# Hour 3\n\n## Filters\n\n###\
    \ What is filter?\n\nFilter is used to format the value of data. The pipe sign\
    \ (`|`) indicates that filter is used. The proper syntax of filter looks like\
    \ this:\n\n| Value | filter |\n\nLet's try to understand the filers one by one.\n\
    \n### Uppercase filter\n\n| Value | uppercase |\n\nThe uppercase filter changes\
    \ the text to upper case. Suppose a user writes a text in lower case (e.g. `ray`)\
    \ or title case (e.g. `Ray`) or in mixed case (e.g. `rAy` or `RaY` or `rAY` etc.),\
    \ and you want the upper case result, then you will have to use upper case filter.\n\
    \n#### Example 3.1\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJSfor\
    \ beginners</title>\n<script src=\"js\\angular.min.js\"></script>\n<meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=UTF-8\" />\n</head>\n<body>\n<h3>Using\
    \ Upper Case Filter</h3>\n<div ng-app=\"\" ng-init=\"Username= 'ray' \">\n<p>User\
    \ Name: <input type=\"text\" ng-model =\"Username\"></p>\n<p style=\"color:red\"\
    \ ng-bind=\"Username | uppercase\"></p>\n</div>\n</body>\n</html>\n```\n\nOutput:\n\
    ![](images/00014.jpeg)\n\nExplanation:\n- `Username | uppercase` changes the value\
    \ of `Username` to uppercase.\n- In the above example, I set the default value\
    \ (`ray`) in lower case, but the result becomes upper case (`RAY`).\n\n### Lowercase\
    \ filter\n\n| Value | lowercase |\n\nThe lowercase filter changes the text to\
    \ lower case. Suppose a user writes a text in upper case (e.g. `RAY YAO`) or title\
    \ case (e.g. `Ray Yao`) or in mixed case (e.g. `rAy` or `RaY` or `rAY` etc.),\
    \ and you want the lower case result, then you will have to use lower case filter.\n\
    \n#### Example 3.2\n\n```html\n<html>\n<head>\n    <title>AngularJSfor beginners</title>\n\
    \    <script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n<h3>Using\
    \ Lower Case Filter</h3>\n<div ng-app=\"\" ng-init=\"Username= 'Ray YAO' \">\n\
    <p>User Name: <input type=\"text\" ng-model=\"Username\"></p>\n<p style=\"color:red\"\
    \ ng-bind=\"Username | lowercase\"></p>\n</div>\n</body>\n</html>\n```\n\nOpen\
    \ the notepad and paste the above mentioned code with `.html` extension.\n\nOutput:\n\
