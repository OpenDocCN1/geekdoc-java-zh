    >` 显示错误消息。\n\n### Angular 包含\n\n| `ng-include=\"'another.txt'\"` |\n\n`ng-include=\"\
    'another.txt'\"` 将外部文件包含到当前文件中。\n\n## 示例 A6\n\n```html\n/* 注意：以下示例需要服务器支持。\n假设服务器上有一个文件\
