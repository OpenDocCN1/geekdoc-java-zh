    # Hour 1


    # Introduction to AngularJS


    What is AngularJS?


    The AngularJS is a framework of JavaScript. It can use HTML as a template language
    and can extend HTML''s sentence structure to state an application''s components
    plainly and briefly.


    The syntax of AngularJS looks like this:


    | <div ng-app=" ">…… </div> |


    We know that div is an html tag, but ng-app is directive of Angular JS, which
    is used in div tag like an attribute. (We will discuss about directive latter)


    Prerequisite to learn AngularJS


    Before learning the Angular JS, you should have basic knowledge of HTML and JAVASCRIPT,
    because AngularJS works with HTML and JavaScript. You can review HTML, CSS and
    JavaScript in Appendix1 or Appendix 2\.


    (Note: The appendix of this book includes “HTML, CSS and JavaScript Review”)


    Download Angular JS


    Downloading the AngularJS is not big deal; you just go to AngularJS site [https://AngularJS.org](https://AngularJS.org)
    and click on “Download” button. After downloading the AngularJS file “angular.min.js”,
    you can put it on myFolder\js folder (Namely put html file and JavaScript file
    to myFolder folder, and put “angular.min.js” to myFolder\js folder), then write
    the path of this “angular.min.js” file in html page`s head section like this:


    <html>


    <head>


    <script src="js\angular.min.js"></script>


    ………………………………………………………………………………………………………………………………………….......</head>


    In above example, you can see the path of AngularJS like “<script src="js\angular.min.js">”.
    Now AngularJS framework has been added in our application. So we can use AngularJS
    framework from now on.


    Benefits of AngularJS


    AngularJS has capability to bind data with HTML.


    AngularJS provides Single Page Application (SAP).


    Angular JS’s View is totally written in HTML, Controller is written in JavaScript,
    and Model is written in AngularJS. It is a MVC framework.


    You can achieve more functionality with just a few lines of code.


    AngularJS provides the reusability for codes and components.  


    First AngularJS Script


