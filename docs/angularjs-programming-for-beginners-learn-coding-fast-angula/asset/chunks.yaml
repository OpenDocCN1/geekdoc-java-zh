    #### 解释：\n`ng-if=\"result\"`  `result` 的真值。\n\n## 总结\n\n- `ng-show=\"showHideDiv\"\
    ` 当 `showHideDiv` 的值为 true 时显示文本。\n- `ng-hide=\"showHideDiv\"` 当 `showHideDiv`\
    \ 的值为 true 时隐藏文本。\n- `ng-disabled=\"DisableEnable\"` 当 `DisableEnable` 为 true\
    \ 时禁用 HTML 元素。\n- `ng-click=\"expression or function( )\"` 点击按钮时更新表达式或运行函数( )。\n\
    - `ng-if 指令` 用于在 DOM 中添加或移除元素。\n\n## 动手实践项目\n\n### 点击事件 (Click Event)\n\n打开记事本，编写以下\
    \ AngularJS 代码：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script src=\"js\\\
    angular.min.js\"></script>\n</head>\n<body>\n<br><br>Click Directive<br><br>\n\
    <div ng-app=\"\" ng-init=\"result=0\">\n<button ng-click=\"result=result+100\"\
