    # Hour 3


    # Filters


    What is filter?


    Filter is used to format the value of data. The pipe sign ( |  ) indicates that
    filter is used. The proper syntax of filter looks like this:


    | Value &#124; filter |


    Let`s try to understand the filers one by one.


    Uppercase filter


    | Value &#124; uppercase |


    The uppercase filter changes the text to upper case. Suppose a user writes a text
    in lower case (e.g. ray) or title case (e.g. Ray) or in mixed case (e.g. rAy or
    RaY or rAY etc.), and you want the upper case result, then you will have to use
    upper case filter.


    Example 3.1


    <!DOCTYPE html>


    <html >


    <head>


        <title>AngularJSfor beginners</title>


    <script src="js\angular.min.js"></script>


    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />


    </head>


    <body>


    <h3>Using Upper Case Filter</h3>


    <div ng-app=""  ng-init="Username= ''ray'' ">


    <p>User Name: <input type="text" ng-model = "Username"></p>


    <p style="color:red" ng-bind="Username | uppercase"></p>


    </div>


    </body>


    </html>


    Output:


    ![](images/00014.jpeg)


    Explanation:


    “Username | uppercase” changes the value of “Username” to uppercase.


    In the above example, I set the default value (ray) in lower case, but the result
    becomes upper case (RAY).


    Lowercase filter


    | Value &#124; lowercase |


    The lowercase filter changes the text to lower case. Suppose a user writes a text
    in upper case (e.g. RAY YAO) or title case (e.g. Ray Yao) or in mixed case (e.g.
    rAy or RaY or rAY etc.), and you want the lower case result, then you will have
    to use lower case filter.


    Example 3.2


    <html >


    <head>


        <title>AngularJSfor beginners</title>


        <script src="js\angular.min.js"></script>


    </head>


    <body>


    <h3>Using Lower Case Filter</h3>


    <div ng-app=""  ng-init="Username= ''Ray YAO'' ">


    <p>User Name: <input type="text" ng-model="Username"></p>


    <p style="color:red" ng-bind="Username | lowercase"></p>


    </div>


    </body>


    </html>


    Open the notepad and paste the above mentioned code with .html extension.


    Output:


    ![](images/00015.jpeg)


    Explanation:


    “Username | lowercase”: changes the value of “Username” to lowercase.


    In the above example, when I enter text (Ray YAO) in upper case, but the result
    become lower case (ray yao).


    OrderBy filter


    OrderBy filer is used to display values in ascending order or descending order.
    The syntax of “orderBy” looks like this:


    | Value &#124; orderBy: ’value’    //for ascending orderValue &#124; orderBy:
    ’-value’   //for descending order |


    Let`s take an example for better understanding.


    Example 3.3


    <!DOCTYPE html>


    <html >


    <head>


        <title>AngularJSfor beginners</title>


        <script src="js\angular.min.js"></script>


    </head>


    <body>


    <h1>Using OrderBy filter</h1>


    <div ng-app="" ng-init="StudentsResult=[{name: ''Tienq'', marks:81},             
    {name: ''Svbrf'', marks:70},              {name: ''Yaito'', marks:90},              
    {name: ''Pewfn'', marks:63}, {name: ''Riet'', marks:98}]">


    <table border="1" >


    <tr>


    <th>Student Name</th>


    <th>Mathematics’ Result</th>


    </tr>


    <tr ng-repeat="x in StudentsResult | orderBy:''-marks'' ">


    <td ng-bind="x.name "></td>


    <td ng-bind="x.marks "></td>


    </tr>


    </table>


    </div>


    </body>


    </html>


    Output:


    ![](images/00016.jpeg)


    Explanation:


    StudentsResult | orderBy:''-marks'' displays the values of StudentsResult in descending
    order.


    You can see that the highest mark is on top and the lowest mark is on bottom by
    using ( value | orderBy:''-marks'' ).


    If you want reverser the order, you can remove the “-“sign”.


    ## Example 3.4


    <!DOCTYPE html>


    <html >


    <head>


        <title>AngularJSfor beginners</title>


        <script src="js\angular.min.js"></script>


    </head>


    <body>


