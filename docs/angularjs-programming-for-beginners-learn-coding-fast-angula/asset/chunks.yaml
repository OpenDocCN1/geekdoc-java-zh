    # Hour 1: Introduction to AngularJS


    ### What is AngularJS?

    AngularJS is a framework of JavaScript. It can use HTML as a template language
    and can extend HTML''s structure to state application''s components plainly and
    briefly.


    The syntax of AngularJS looks like this:

    ```html

    <div ng-app=""></div>

    ```

    We know `div` is an html tag, but `ng-app` is directive of AngularJS which is
    used in `div` tag like an attribute. (We will discuss directive later)


    ### Prerequisites to learn AngularJS

    Before learning AngularJS, you should have basic knowledge of HTML and JavaScript
    because AngularJS works with HTML and JavaScript. You can review HTML and CSS
    in Appendix 1 or Appendix 2 (Note: The appendix of this book includes “HTML, CSS
    and JavaScript Review”).


    ### Download AngularJS

    Downloading the AngularJS is not big deal; you just go to AngularJS site `https://AngularJS.org`
    and click on “Download” button. After downloading the AngularJS file `angular.min.js`,
    you can put it on `myFolder/js` folder (Namely put html file and JavaScript file
    to `myFolder` folder, and put `angular.min.js` to `myFolder/js` folder), then
    write the path of this `angular.min.js` file in html page''s head section like
    this:

    ```html

    <html>

    <head>

    <script src="js/angular.min.js"></script>

    ```

    In above example, you can see the path of AngularJS like `<script src="js/angular.min.js">`.
    Now AngularJS framework has been added in our application. So we can use AngularJS
    framework from now.


    ### Benefits of AngularJS

    - AngularJS has capability to bind data with HTML.

    - AngularJS provides Single Page Application (SPA).

    - AngularJS’s View is totally written in HTML, Controller is written in JavaScript,
    and Model is written in AngularJS. It is a MVC framework.

    - You can achieve more functionality with just a few lines of code.

    - AngularJS provides the reusability for codes and components.


    ## First AngularJS Script


    ### Example 1.1

    Open the Notepad, write codes as following (Figure 1):

    ```html

    <html>

    <script src="js/angular.min.js"></script>

    <body>

    <div ng-app="">

    <p>Input my id in the input box:</p>

    <p><input type="text" ng-model="id" </p>

    <br>

    <h1>Welcome! {{id}}</h1>

    </div>

    </body>

    </html>

    ```

    ![](images/00001.jpeg)

    (Figure 1)


    Please save the file with name `FirstAngularJS.html` at `myFolder`. Note: make
    sure to use `.html` extension name. Double click `FirstAngularJS.html` file, `FirstAngularJS.html`
