    \ \">\n<td ng-bind=\"x.name \"></td>\n<td ng-bind=\"x.marks \"></td>\n</tr>\n\
    </table>\n</div>\n</body>\n</html>\n```\n\nOutput:\n![](images/00017.jpeg)\n\n\
    Explanation:\n- `StudentsResult | orderBy: 'marks'` displays the values of `StudentsResult`\
    \ in ascending order.\n\n### Currency filter\n\n| Value | currency |\n\nThe currency\
    \ filter is used to display the result in currency format.\n\n#### Example 3.5\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJSfor beginners</title>\n\
