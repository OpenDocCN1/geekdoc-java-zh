    x in Employees_Monthly_Salary \">\n<td ng-bind=\"x.name \"></td>\n<td ng-bind=\"\
    x.salary | currency \"></td>\n</tr>\n</table>\n</div>\n</body>\n</html>\n```\n\
    \nOpen the notepad and paste the above mentioned code with `.html` extension.\n\
    \nOutput:\n![](images/00018.jpeg)\n\nExplanation:\n- `x.salary | currency` converts\
