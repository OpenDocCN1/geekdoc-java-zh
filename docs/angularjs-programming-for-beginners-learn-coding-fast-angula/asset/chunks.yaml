    `existingCar` has been defined. Therefore, `isUndefined(existingCar)` returns\
    \ `false`.\n\n---\n\n## Summary\n\n- `var myModule = angular.module('myApplication',\
    \ [ ])` creates a new module `myModule` with `myApplication`.\n- `myModule.controller('myController',\
    \ function($scope)` adds the controller's constructor to the module using the\
    \ `controller()` method, makes `myController` belongs to `myModule`.\n- `$scope`\
    \ is defined as an object.\n- `angular.uppercase()` converts a string to uppercase.\n\
    - `angular.lowercase()` converts a string to lowercase.\n- `isString()` tests\
    \ a value to see if it is a string, returns `true` if the value is a string.\n\
    - `isNumber()` tests a value to see if it is a number, returns `true` if the value\
    \ is a number.\n- `isDate()` tests a value to see if it is a `Date` object, returns\
    \ `true` if the value is a `Date Object`.\n- `isFunction()` tests a value to see\
    \ if it is a function, returns `true` if the value is a function.\n- `isElement()`\
    \ tests a value to see if it is a `Dom` element, returns `true` if the value is\
    \ a `Dom` element.\n- `isObject()` tests a value to see if it is an object, returns\
    \ `true` if the value is an object.\n- `isDefined()` tests a value to see if it\
    \ has been defined, returns `true` if the value has been defined.\n- `isUndefined()`\
    \ tests a value to see if it has not been defined, returns `true` if the value\
    \ has not been defined.\n\n---\n\n## Hands-On Project\n\n### Module Sample\n\n\
    Open Notepad, write AngularJS codes:\n\n```html\n<!DOCTYPE html>\n<html>\n<script\
    \ src=\"js\\angular.min.js\"></script>\n<body>\n<div ng-app=\"myApplication\"\
    \ ng-controller=\"myController\">\nHeight:\n<p><input type=\"number\" ng-model=\"\
    height\"></p>\nLength:\n<p><input type=\"number\" ng-model=\"length\"></p>\n<br>\n\
    Area of a Triangle:\n<h4><p>{{(height * length)/2}}</p></h4>\n</div>\n<script>\n\
    var app = angular.module('myApplication', [ ]);\napp.controller('myController',\
    \ function($scope) {\n    $scope.height = 0;\n    $scope.length = 0;\n});\n</script>\n\
    </body>\n</html>\n```\n\n![](images/00045.jpeg)\n\nPlease save the file with name\
    \ `ModuleSample.html` at `myFolder`. Double click `ModuleSample.html` file, input\
    \ height and length of a triangle, and see the output.\n\n**Output:** \n\n![](images/00046.jpeg)\n\
    \n## Explanation:\n\n- `ng-controller=\"myController\"` defines a controller.\n\
    - `app = angular.module()` creates a new module.\n- `app.controller()` adds the\
    \ controller's constructor function to the module.\n- `function($scope)` defines\
    \ a constructor function, and also defines an object `$scope`. When page is loaded,\
    \ the function will run.\n- `$scope.property = value` assigns the value to the\
    \ property of `$scope` object.\n\n---\n\n# Appendix 1\n\n## Ajax Basic\n\n###\
    \ What is Ajax?\n\nAJAX stands for “Asynchronous JavaScript And XML”. AJAX is\
