    StudentsResult | orderBy: ''marks'' displays the values of the StudentsResult
    in ascending order.


    Currency filter


    | Value &#124; currency |


    The currency filter is used to display the result in currency format.


    Example 3.5


    <!DOCTYPE html>


    <html >


    <head>


