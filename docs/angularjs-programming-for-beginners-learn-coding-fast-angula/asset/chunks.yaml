    \ =\"show in colors\"` 重复获取数组 `colors` 的值，并将所有数组值赋值给变量 `show`。\n- `{{ show }}`\
    \ 显示 `show` 的值。\n\n# 第 3 小时\n\n## 过滤器 (Filters)\n\n### 什么是过滤器？\n\n过滤器用于格式化数据的值。管道符号\
    \ (`|`) 表示使用了过滤器。过滤器的正确语法如下所示：\n\n| Value | filter |\n\n让我们逐个理解过滤器。\n\n### 大写过滤器\
    \ (Uppercase filter)\n\n| Value | uppercase |\n\nuppercase 过滤器将文本转换为大写。假设用户写了小写文本（例如\
    \ `ray`）、标题大小写文本（例如 `Ray`）或混合大小写（例如 `rAy` 或 `RaY` 或 `rAY` 等），而你想要大写形式的结果，那么你就必须使用大写过滤器。\n\
    \n#### 示例 3.1\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJSfor\
    \ beginners</title>\n<script src=\"js\\angular.min.js\"></script>\n<meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=UTF-8\" />\n</head>\n<body>\n<h3>Using\
    \ Upper Case Filter</h3>\n<div ng-app=\"\" ng-init=\"Username= 'ray' \">\n<p>User\
    \ Name: <input type=\"text\" ng-model =\"Username\"></p>\n<p style=\"color:red\"\
    \ ng-bind=\"Username | uppercase\"></p>\n</div>\n</body>\n</html>\n```\n\n输出：\n\
    ![](img/00014.jpeg)\n\n解释：\n- `Username | uppercase` 将 `Username` 的值转换为大写。\n-\
    \ 在上面的示例中，我设置了小写的默认值（`ray`），但结果变成了大写（`RAY`）。\n\n### 小写过滤器 (Lowercase filter)\n\
    \n| Value | lowercase |\n\nlowercase 过滤器将文本转换为小写。假设用户写了大写文本（例如 `RAY YAO`）、标题大小写文本（例如\
    \ `Ray Yao`）或混合大小写（例如 `rAy` 或 `RaY` 或 `rAY` 等），而你想要小写形式的结果，那么你就必须使用小写过滤器。\n\n\
    #### 示例 3.2\n\n```html\n<html>\n<head>\n    <title>AngularJSfor beginners</title>\n\
    \    <script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n<h3>Using\
    \ Lower Case Filter</h3>\n<div ng-app=\"\" ng-init=\"Username= 'Ray YAO' \">\n\
    <p>User Name: <input type=\"text\" ng-model=\"Username\"></p>\n<p style=\"color:red\"\
    \ ng-bind=\"Username | lowercase\"></p>\n</div>\n</body>\n</html>\n```\n\n打开记事本并并将上述代码以\
    \ `.html` 扩展名粘贴。\n\n输出：\n![](img/00015.jpeg)\n\n解释：\n- `Username | lowercase`:\
    \ 将 `Username` 的值转换为小写。\n- 在上面的示例中，当我输入大写的文本（`Ray YAO`）时，结果变成了小写（`ray yao`）。\n\
    \n### 排序过滤器 (OrderBy filter)\n\nOrderBy 过滤器用于按升序或降序显示值。`orderBy` 的语法如下：\n\n| Value\
    \ | orderBy: 'value' // 用于升序 | Value | orderBy: '-value' // 用于降序 |\n\n让我们来看一个例子以更好地理解。\n\
    \n#### 示例 3.3\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJSfor\
    \ beginners</title>\n    <script src=\"js\\angular.min.js\"></script>\n</head>\n\
    <body>\n<h1>Using OrderBy filter</h1>\n<div ng-app=\"\" ng-init=\"StudentsResult=[{name:\
    \ 'Tienq', marks:81},    {name: 'Svbrf', marks:70}, {name: 'Yaito', marks:90},\
    \ {name: 'Pewfn', marks:63}, {name: 'Riet', marks:98}]\">\n<table border=\"1\"\
    \ >\n<tr>\n<th>Student Name</th>\n<th>Mathematics Result</th>\n</tr>\n<tr ng-repeat=\"\
    x in StudentsResult | orderBy:'-marks' \">\n<td ng-bind=\"x.name\"></td>\n<td\
    \ ng-bind=\"x.marks\"></td>\n</tr>\n</table>\n</div>\n</body>\n</html>\n```\n\n\
    输出：\n![](img/00016.jpeg)\n\n解释：\n- `StudentsResult | orderBy:'-marks'` 按降序显示 `StudentsResult`\
    \ 的值。\n- 你可以看到使用 `orderBy:'-marks'` 时，最高分在最顶端。\n- 如果你想反转顺序，可以去掉 `-`。\n\n#### 示例\
    \ 3.4\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJSfor beginners</title>\n\
    \    <script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n<h1>Using\
    \ OrderBy filter</h1>\n<div ng-app=\"\" ng-init=\"StudentsResult=[{name: 'Tienq',\
    \ marks:81},    {name: 'Svbrf', marks:70}, {name: 'Yaito', marks:90}, {name: 'Pewfn',\
    \ marks:63}, {name: 'Riet', marks:98}]\">\n<table border=\"1\" >\n<tr>\n<th>Student\
    \ Name</th>\n<th>Mathematics Result</th>\n</tr>\n<tr ng-repeat=\"x in StudentsResult\
    \ | orderBy:'marks' \">\n<td ng-bind=\"x.name\"></td>\n<td ng-bind=\"x.marks\"\
    ></td>\n</tr>\n</table>\n</div>\n</body>\n</html>\n```\n\n输出：\n![](img/00017.jpeg)\n\
    \n解释：\n- `StudentsResult | orderBy: 'marks'` 按升序显示 `StudentsResult` 的值。\n\n###\
    \ 货币过滤器 (Currency filter)\n\n| Value | currency |\n\ncurrency 过滤器过滤器用于货币格式显示结果。\n\
    \n#### 示例 3.5\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJSfor\
    \ beginners</title>\n<script src=\"js\\angular.min.js\"></script>\n<meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=UTF-8\" />\n</head>\n<body>\n<h1>Using\
    \ Currency filter</h1>\n<div ng-app=\"\" ng-init=\"Employees_Monthly_Salary=[{name:\
    \ 'Jay', salary:8100}, {name: 'Sdwt', salary:7000}, {name: 'Hao', salary:9000},\
    \ {name: 'Luoe', salary:6300}, {name: 'Fin', salary:9800}]\">\n<table border=\"\
    1\" >\n<tr>\n<th>Employee Name</th>\n<th>Employee Salary</th>\n</tr>\n<tr ng-repeat=\"\
    x in Employees_Monthly_Salary \">\n<td ng-bind=\"x.name\"></td>\n<td ng-bind=\"\
    x.salary | currency \"></td>\n</tr>\n</table>\n</div>\n</body>\n</html>\n```\n\
    \n打开记事本并将上述代码以 `.html` 扩展名粘贴。\n\n输出：\n![](img/00018.jpeg)\n\n解释：\n- `x.salary\
    \ | currency` 将工资转换为货币格式。\n- 在上面的示例中，表格中有列，第一列是员工姓名，第二列是员工工资。工资列以货币格式显示工资。\n\n\
    ### 数组过滤器 (Array filter)\n\n| Array | filter:input |\n\n`Array | filter:input`\
    \ 可以根据用户输入过滤数组元素。\n\n#### 示例 3.6\n\n```html\n<!DOCTYPE html>\n<html ng-app=\"\"\
    >\n<head>\n<script src=\"js\\angular.min.js\"></script>\n<meta charset=\"utf-8\"\
    >\n</head>\n<body>\n<div ng-init=\"students = // 定义数组“students”\n[{name:'Andy',\
    \ age:'19'},\n{name:'Rose', age:'18'},\n{name:'Jony', age:'17'},\n{name:'Judy',\
    \ age:'16'},\n{name:'Tomy', age:'15'},\n{name:'Lily', age:'14'}]\">\n</div>\n\
    <table>\n  <tr><th>Name</th><th>Age</th></tr>\n  <tr ng-repeat=\"person in students\
    \ | filter:myList\">\n    // 根据输入值过滤数组“students”\n    <td>{{person.name}}</td>\n\
    \    <td>{{person.age}}</td>\n  </tr>\n</table>\n<br><br>\n<label>Please input\
    \ one of the above name or age 以上姓名或年龄之一\n<br><br>\n<input ng-model=\"myList\"\
    ></label> // 用户输入\n</body>\n</html>\n```\n\n请尝试在文本框输入数字 18。\n\n输出：\n![](img/00019.jpeg)\n\
    \n解释：\n- `<div ng-init=\"students =….\"` 定义了数组 `students`。\n- `person in students\
    \ | filter:myList` 根据输入值 `myList` 过滤数组 `students`。\n- `<input ng-model=\"myList\"\
    >` 接收用户输入并将输入值存储到 `myList`。\n- 当你向文本框输入 18 时，输出显示 `Rose 18`。\n\n"
- fmt: "\nIn this chapter we learnt what a filter is. And different types of filter\
    \ like Upper Case filter, Lower Case filter, Order By filter and Currency filter.\
    \ I have tried to explain each topic of this chapter with proper example, output\
    \ and explanation.\n\n- `Value | uppercase` changes the value to uppercase.\n\
    - `Value | lowercase` changes the value to lowercase.\n- `Value | orderBy: ’value’`\
    \ shows the value in ascending order.\n- `Value | orderBy: ’-value’` shows the\
    \ value in descending order.\n- `Value | currency` converts the value to currency\
    \ format.\n- `Array | filter:input` can filter the array elements based on the\
    \ user input.\n\n## Hands-On Project\n\n### Uppercase Filter\n\nOpen Notepad,\
    \ write AngularJS codes:\n\n```html\n<!DOCTYPE html>\n<script src=\"js\\angular.min.js\"\
    ></script>\n<body>\n<h4>Uppercase Filter</h4>\n<div ng-app=\"\">\n<p>Book Name:\
    \ </p>\n<p><input type=\"text\" ng-model = \"Book\"></p>\n<h3><p ng-bind=\"Book|uppercase\"\
    ></p></h3>\n</div>\n</body>\n</html>\n```\n\n![](images/00020.jpeg)\n\nPlease\
    \ save the file with name `UppercaseFilter.html` at `myFolder`. Note: make sure\
    \ to use `.html` extension name.\n\nDouble click `UppercaseFilter.html` file,\
    \ `UppercaseFilter.html` will be run by a browser, input the book name “JavaScript\
    \ in 8 Hours” in text box, and see the output.\n\nOutput: \n![](images/00021.jpeg)\n\
    \n#### Explanation:\n`<p ng-bind=\"Book|uppercase\"></p>` changes the value of\
    \ `Book` to uppercase.\n\n# Hour 4\n\n# Directive in DOM\n\n### Show Directive\n\
    \n| `<p ng-show=\"true\"> visible.</p><p ng-show=\"false\">invisible.</p>` | |\n\
    \nShow directive is used to show or hide the text in `<p>` elements of HTML.\n\
    If `ng-show` is true, the text “visible” will be shown.\nIf `ng-show` is false,\
    \ the text “invisible” will be hidden.\n\n#### Example 4.1\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n    <title>AngularJS for beginners</title>\n    <script\
    \ src=\"js/angular.min.js\"></script>\n</head>\n<body>\n<h3>Using Show directive</h3>\n\
    <div ng-app=\"\" >\n<input type=\"checkbox\" ng-model=\"showHideDiv\">Show Div\n\
    <div ng-show=\"showHideDiv\" style=\"background-color:yellow;height:50px;\">\n\
    <p>I am a div</p>\n<p>I appear when the check box is checked.</p>\n</div>\n</div>\n\
    </body>\n</html>\n```\n\nOutput:\n![](images/00022.jpeg)\n\n#### Explanation:\n\
    `ng-model=\"showHideDiv\"` binds the check box value with `showHideDiv`.\n`ng-show=\"\
    showHideDiv\"` shows the text when the value of `showHideDiv` is true.\nIn the\
    \ above example, at first time when the page is loaded, the div (yellow area of\
    \ the page) is not shown, but when I check the check box (show Div), the value\
    \ of `showHideDiv` is true; the div (yellow area of the page) is appeared.\n\n\
    ### Hide Directive\n\n| `<p ng-hide=\"true\"> invisible.</p><p ng-hide=\"false\"\
    >visible.</p>` | |\n\nHide directive is used to hide or show the text in `<p>`\
    \ elements of HTML.\nIf `ng-hide` is true, the text “invisible” will be hidden.\n\
    If `ng-hide` is false, the text “visible” will be shown.\n\n#### Example 4.2\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJSfor beginners</title>\n\
    <script src=\"js\\angular.min.js\"></script>\n<meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\" />\n</head>\n<body>\n<h3>Using Hide directive</h3>\n\
    <div ng-app=\"\" >\n<input type=\"checkbox\" ng-model=\"HideShowDiv\">Hide Div\n\
    <div ng-hide=\"HideShowDiv\" style=\"background-color:pink;height:50px;\">\n<p>I\
    \ am a div</p>\n<p>I will disappeared when the check box is checked.</p>\n</div>\n\
    </div>\n</body>\n</html>\n```\n\nOpen the notepad and paste the above mentioned\
    \ code with `.html` extension.\n\nOutput:\n![](images/00023.jpeg)\n\nPlease chick\
    \ the Check Box, and see the result.\n![](images/00024.jpeg)\n\n#### Explanation:\n\
    `ng-model=\"showHideDiv\"` binds the check box value with `showHideDiv`.\n`ng-hide=\"\
    showHideDiv\"` hides the text when the value of `showHideDiv` is true.\nIn the\
    \ above example, at the first time when the page is loaded, the div (pink area\
    \ of the page) is shown.\nBut when I click check box (Hide Div), the value of\
    \ `showHideDiv` is true; the div (pink area of the page) is disappeared. (Note:\
    \ original text variable preserved).\n\n### Disable Directive\n\n| `<input type=\"\
    button\" ng-disabled=true value=\"myButton\">><input type=\"button\" ng-disabled=false\
    \ value=\"myButton\">` | |\n\nDisable directive is used to disable or enable the\
    \ element of HTML.\nIf `ng-disable` is true, `myButton` will be disabled.\nIf\
    \ `ng-disable` is false, `myButton` will be enabled.\n\n#### Example 4.3\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJS for beginners</title>\n\
    \    <script src=\"js/angular.min.js\"></script>\n</head>\n<body>\n<h3>Using Disable\
    \ directive</h3>\n<div ng-app=\"\" >\n<input type=\"checkbox\" ng-model=\"DisableEnable\"\
    >Disable Button<br><br><br>\n<input type=\"button\" ng-disabled=\"DisableEnable\"\
    \ value=\"Submit\">\n</div>\n</body>\n</html>\n```\n\nOutput:\n![](images/00025.jpeg)\n\
    \n#### Explanation:\n`ng-model=\"DisableEnable\"` binds the checkbox value with\
    \ `DisableEnable`.\n`<input type=\"button\" ng-disabled=\"DisableEnable\" value=\"\
    Submit\">` disables the “submit” button when `DisableEnable` is true.\nIn the\
    \ above example, at the first time when the page is loaded, the (button) is disabled.\n\
    \n### Click Directive\n\n| `ng-click=\"expression\"` | |\n\nThe click directive\
    \ is used to define an event.\n\n#### Example 4.4\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n    <title>AngularJS for beginners</title>\n    <script src=\"\
    js/angular.min.js\"></script>\n<meta http-equiv=\"Content-Type\" content=\"text/html;\
    \ charset=UTF-8\" />\n</head>\n<body>\n<h3>Using Click directive</h3>\n<div ng-app=\"\
    \" ng-init=\"result=0\">\n<button ng-click=\"result=result+100\">\nClick Here!</button>\n\
    <H1><p ng-bind=\"result\"></p></H1>\n</div>\n</body>\n</html>\n```\n\nOutput:\n\
    ![](images/00026.jpeg)\n\n#### Explanation:\n`ng-click=\"result=result+100\"`\
    \ updates the `result` when clicking the button.\n`<p ng-bind=\"result\">` binds\
    \ the `result` and displays its value.\n\n### If Directive\n\n| `ng-if=\"condition\"\
    ` | |\n\n`ng-if` directive is used to add or remove an element in Dom.\nIf `ng-if`\
    \ is true, the element will be added.\nIf `ng-if` is false, the element will be\
    \ removed.\n\n#### Example 4.5\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n \
    \   <title>AngularJS for beginners</title>\n    <script src=\"js/angular.min.js\"\
    ></script>\n</head>\n<body ng-app=\"\" align=\"center\">\n<input type=\"checkbox\"\
    \ ng-model=\"result\" >\n<div ng-if=\"result\"> \n<p>When you check the box, thethe\
    \ text will be shown.<br>\nWhen you uncheck the box, thethe text will be hidden.</p>\n\
    </div>\n</body>\n</html>\n```\n\nOutput:\n![](images/00027.jpeg)\n\n#### Explanation:\n\
    `ng-if=\"result\"` checks the result if true or false.\nWhen the `result` is true,\
    \ the element will be added.\nWhen the `result` is false, the element will be\
    \ removed.\n\n## Summary\n\n- `ng-show=\"showHideDiv\"` shows the text when the\
    \ value of `showHideDiv` is true.\n- `ng-hide=\"showHideDiv\"` hides the text\
    \ when the value of `showHideDiv` is true.\n- `ng-disabled=\"DisableEnable\"`\
    \ disables the element of HTML when `DisableEnable` is true.\n- `ng-click=\"expression\
    \ or function( )\"` updates the value in express or run the function( ) when clicking\
    \ the button.\n- `ng-if directive` is used to add or remove an element in Dom.\n\
    \n## Hands-On Project\n\n### Click Event\n\nOpen Notepad, write AngularJS codes:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script src=\"js\\angular.min.js\"\
    ></script>\n</head>\n<body>\n<br><br>Click Directive<br><br>\n<div ng-app=\"\"\
    \ ng-init=\"result=0\">\n<button ng-click=\"result=result+100\">\nClick Here!</button>\n\
    <H1><p ng-bind=\"result\"></p></H1>\n</div>\n</body>\n</html>\n```\n\n![](images/00028.jpeg)\n"
  raw: 'In this chapter we learnt what a filter is. And different types of filter
    like Upper Case filter, Lower Case filter, Order By filter and Currency filter.
    I have tried to explain each topic of this chapter with proper example, output
    and explanation.


    “Value | uppercase” changes the value to uppercase.


    “Value | lowercase” changes the value to lowercase.


    Value | orderBy: ’value’ shows the value in ascending order


    Value | orderBy: ’-value’ shows the value in descending order


    “Value | currency” converts the value to currency format.


    “Array | filter:input” can filter the array elements based on the user input.


    Hands-On Project


    ## Uppercase Filter


    Open Notepad, write AngularJS codes:


    <!DOCTYPE html>


    <script src="js\angular.min.js"></script>


    <body>


    <h4>Uppercase Filter</h4>


    <div ng-app="">


    <p>Book Name: </p>


    <p><input type="text" ng-model = "Book"></p>


    <H3><p ng-bind="Book|uppercase"></p><H3>


    </div>


    </body>


    </html>


    ![](images/00020.jpeg)


    Please save the file with name “UppercaseFilter.html” at myFolder. Note: make
    sure to use “.html” extension name.


    Double click “UppercaseFilter.html” file, “UppercaseFilter.html” will be run by
    a browser, input the book name “JavaScript in 8 Hours” in text box, and see the
    output.


    Output: 


    ![](images/00021.jpeg)


    ## Explanation:


    “<p ng-bind="Book|uppercase"></p>” changes the value of Book to uppercase.


    # Hour 4


    # Directive in DOM


    Show Directive


    | <p ng-show="true"> visible.</p><p ng-show="false">invisible.</p> |


    Show directive is used to show or hide the text in <p> elements of HTML.


    if ng-show is true, the text “visible” will be shown.


    if ng-show is false, the text “invisible” will be hidden.


    Example 4.1


    <!DOCTYPE html>


    <html >


    <head>


        <title>AngularJS for beginners</title>


        <script src="js/angular.min.js"></script>


    </head>


    <body>


    <h3>Using Show directive</h3>


    <div ng-app="" >


    <input type="checkbox" ng-model="showHideDiv">Show Div


    <div ng-show="showHideDiv" style="background-color:yellow;height:50px;">


    <p>I am a div</p>


    <p>I appear when the check box is checked.</p>


    </div>


    </div>


    </body>


    </html>


    Output:


    ![](images/00022.jpeg)


    Explanation:


    “ng-model="showHideDiv”  binds the check box value with “showHideDiv”.


    “ng-show="showHideDiv"” shows the text when the value of “showHideDiv” is true.


    In the above example, at first time when the page is loaded, the div (yellow area
    of the page) is not shown, but when I check  the check box (show Div), the value
    of “showHideDiv” is true; the div (yellow area of the page) is appeared.


    Hide Directive


    | <p ng-hide="true"> invisible.</p><p ng-hide="false">visible.</p> |


    Hide directive is used to hide or show the text in <p> elements of HTML.


    if ng-hide is true, the text “invisible” will be hidden.


    if ng-hide is false, the text “visible” will be shown.


    Example 4.2


    <!DOCTYPE html>


    <html >


    <head>


        <title>AngularJSfor beginners</title>


    <script src="js\angular.min.js"></script>


    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />


    </head>


    <body>


    <h3>Using Hide directive</h3>


    <div ng-app="" >


    <input type="checkbox" ng-model="HideShowDiv">Hide Div


    <div ng-hide="HideShowDiv" style="background-color:pink;height:50px;">


    <p>I am a div</p>


    <p>I will disappeared when the check box is checked.</p>


    </div>


    </div>


    </body>


    </html>


    Open the notepad and paste the above mentioned code with .html extension.


    Output:


    ![](images/00023.jpeg)


    Please chick the Check Box, and see the result.


    ![](images/00024.jpeg)


    Explanation:


    “ng-model="showHideDiv”  binds the check box value with “showHideDiv”.


    “ng-hide="showHideDiv"” hides the text when the value of “showHideDiv” is true.


    In the above example, at the first time when the page is loaded, the div (pink
    area of the page) is shown.


    But when I click check box (Hide Div), the value of “showHideDiv” is true; the
    div (pink area of the page) is disappeared.


    Disable Directive


    | <input type="button" ng-disabled=true value="myButton”><input type="button"
    ng-disabled=false  value="myButton”> |


    Disable directive is used to disable or enable the element of HTML.


    if ng-disable is true, myButton will be disabled.


    if ng-disable is false, myButton will be enabled.


    Example 4.3


    <!DOCTYPE html>


    <html >


    <head>


        <title>AngularJS for beginners</title>


        <script src="js/angular.min.js"></script>


    </head>


    <body>


    <h3>Using Disable directive</h3>


    <div ng-app="" >


    <input type="checkbox" ng-model="DisableEnable">Disable Button<br><br><br>


    <input type="button" ng-disabled="DisableEnable" value="Submit">


    </div>


    </body>


    </html>


    Output:


    ![](images/00025.jpeg)


    Explanation:


    “ng-model="DisableEnable"” binds the checkbox value with “DisableEnable”.


    <input type="button" ng-disabled="DisableEnable" value="Submit"> disables the
    “submit” button when “DisableEnable” is true.


    In the above example, at the first time when the page is loaded, the button (Submit)
    is enabled, but when I click check box, which makes the “DisableEnable” true,  the
    button (Submit) is disabled.


    Click Directive


    | ng-click = “expression” |


    The click directive is used to define an event, and evaluates the expression.


    Example 4.4


    <!DOCTYPE html>


    <html >


    <head>


        <title>AngularJSfor beginners</title>


    <script src="js\angular.min.js"></script>


    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />


    </head>


    <body>


    <h3>Using Click directive</h3>


    <div ng-app=""  ng-init="increaseNumber=0">


    <button ng-click="increaseNumber = increaseNumber + 1">Click Me!</button>


    <p ng-bind="increaseNumber" style="color:blue"></p>


    </div>


    </body>


    </html>


    ## Output:


    ![](images/00026.jpeg)


    Explanation:


    “ng-click="increaseNumber = increaseNumber + 1"” updates the value “increaseNumber”
    when click the button.


    “<p ng-bind="increaseNumber" style="color:blue"></p>”: binds the “increaseNumber”
    value with <p> and displays its value.


    In the above example, at the first time when the page is loaded, the count shows
    0, it means that I do not click on button (Click Me!), but when I click the button,
    it increases one by one, which signifies the number of clicks.


    If Directive


    | ng-if="result" |


    “ng-if directive” is used to add or remove an element in Dom.


    If the result of “ng-if” is true, an element will be added.


    If the result of “ng-if” is false, an element will be removed.


    ## Example 4.5


    <!DOCTYPE html>


    <html>


    <head>


    <script src="js\angular.min.js"></script>


    <meta charset="utf-8">


    </head>


    <body ng-app="" align = "center"><br><br>


    <input type="checkbox" ng-init="result = true" ng-model="result" >


    <div ng-if="result"> // check true or false


    <p>When you check the box, <br>


    the text will be shown.<br>


    When you uncheck the box, <br>


    the text will be hidden.</p>


    </div>


    </body>


    </html>


    Please check or uncheck the box.


    ## Output:


    ![](images/00027.jpeg)


    ## Explanation:


    ng-if="result" checks the result if true or false.


    When the result of “ng-if” is true, an element will be added.


    When the result of “ng-if” is false, an element will be removed.


    ## Summary


     “ng-show="showHideDiv"” shows the text when the value of “showHideDiv” is true.


    “ng-hide="showHideDiv"” hides the text when the value of “showHideDiv” is true.


    “ng-disabled="DisableEnable"” disables the element of HTML when “DisableEnable”
    is true.


    ng-click = “expression or function( )” updates the value in express or run the
    function( ) when clicking the button.


    “ng-if directive” is used to add or remove an element in Dom.


    Hands-On Project


    ## Click Event


    Open Notepad, write AngularJS codes:


    <!DOCTYPE html>


    <html >


    <head>


    <script src="js\angular.min.js"></script>


    </head>


    <body>


    <br><br>Click Directive<br><br>


    <div ng-app=""  ng-init="result=0">


    <button ng-click="result=result+100">


    Click Here!</button>


    <H1><p ng-bind="result" ></p></H1>


    </div>


    </body>


    </html>


    ![](images/00028.jpeg)


    Please save the file with name “ClickEvent.html” at myFolder. Note: make sure
    to use “.html” extension name.'
