    \ & MySQL》。\n\n### Angular 检查\n\n| `$dirty` // 检查用户已输入 `$pristine` // 检查用户未输入\
    \ |\n\n## 示例 A4\n\n```html\n<head>\n<script src=\"js\\angular.min.js\"></script>\n\
    </head>\n<body>\n<form ng-app=\"iCode\" ng-controller=\"iController\" name=\"\
    iForm\" novalidate>\n<p>请在此输入您的名字：<br><br>\n<input type=\"text\" name=\"userName\"\
    \ ng-model=\"userName\" required>\n<div style=\"color:red\" ng-show=\"iForm.userName.!$dirty\"\
    >\n<!--检查输入是否为空-->\n<div ng-show=\"iForm.userName.$error.required\">\n<!--显示错误消息\
    \ -->\n此字段不能为空！</div>\n</div>\n</p>\n</form>\n<script>\nvar iModule = angular.module('iCode',\
    \ []);\niModule.controller('iController', function($scope) {\n$scope.userName\
    \ = '';   \n});\n</script>\n</body>\n</html>\n```\n\n## 输出：\n\n请在此输入您的名字：\n\n\
    |  |\n\n此字段不能为空！\n\n## 解释：\n\n`iForm.userName.!$dirty` 检查输入字段的非空性。你可以使用 `$pristine`\
    \ 或 `!$dirty`。\n\n`.$error.required` 显示错误消息。\n\n### Angular 验证\n\n| `$valid` //\
    \ 检查输入的有效性 `$invalid` // 检查输入的无效性 |\n\n## 示例 A5\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n\
