    \ 与 `ng-app` 几乎相同，但 `data-ng-app` 更适用于 HTML5。\n- `<div data-ng-app=\"\" > </div>`\
    \ 表示你可以在这里编写 AngularJS 应用程序。\n- `data-ng-init` 与 `ng-init` 几乎相同，但 `data-ng-init`\
