  \n# 第 6 小时\n\n## 表达式\n\n`{{ Expression }}`\n\n`{{Expression}}` 用于将值绑定到 html 元素并显示该值。它的作用与\
  \ `ng-bind` 指令相同。`{{Expression}}` 写在两个大括号内。`{{expression}}` 基本上是纯 JavaScript 表达式。有不同种的表达式，让我们逐一讨论。\n\
  \n### 字符串表达式\n\n我们知道字符串是字符的集合。在 AngularJS 中，字符串表达式如下。\n\n| <element> {{First String\
  \ + Second String}} </element> |\n\n### 示例 6.1\n\n```html\n<!DOCTYPE html>\n<html>\n\
  <head>\n    <title>AngularJS 初学者教程</title>\n    <script src=\"js/angular.min.js\"\
  ></script>\n</head>\n<body>\n<h4>使用字符串表达式组合两个字符串</h4>\n<div ng-app=\"\" >\n第一个字符串\
  \ &nbsp;&nbsp;&nbsp;: <input type=\"text\" ng-model=\"firstString\"/><br><br>\n\
  第二个字符串: <input ng-model=\"secondString\"/><br><br>\n结果字符串:<p style=\"color:blue;font-weight:bold;\"\
  >{{firstString +\" \"+secondString}}</p>\n</div>\n</body>\n</html>\n```\n\n输出:\n\
  \n![](img/00035.jpeg)\n\n### 解释:\n\n`{{firstString +\" \"+secondString}}` 将两个字符串连接在一起。\n\
  \n`{{ expression}}` 显示表达式的值。\n\n在上面的示例中，第一个文本框中写了 `Ray`，第二个文本框中写了 `Yao`，但在结果字符串区域由于使用了字符串表达式\
  \ `{{ }}`，`Ray` 字符串和 `Yao` 字符串被组合在了一起。注意：加号 `+ 用于字符串拼接。\n\n### 数字表达式\n\n在 AngularJS\
  \ 中，你可以使用数字表达式执行不同的数学运算。\n\n| <element> {{First Number + Second Number}} </element>\
  \ |\n\n### 示例 6.2\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJS\
  \ 初学者教程</title>\n    <script src=\"js/angular.min.js\"></script>\n</head>\n<body>\n\
  <h4>使用数字表达式相乘两个数字</h4>\n<div ng-app=\"\" ng-init=\"firstNumber=9;secondNumber=6\"\
  >\n第一个数字 &nbsp;&nbsp;&nbsp;: <input type=\"text\" ng-model=\"firstNumber\"/><br><br>\n\
  第二个数字: <input ng-model=\"secondNumber\"/><br><br>\n结果字符串:<p style=\"color:blue;font-weight:bold;\"\
  >{{firstNumber * secondNumber}}</p>\n</div>\n</body>\n</html>\n```\n\n输出:\n\n![](img/00036.jpeg)\n\
  \n### 解释:\n\n`{{firstNumber * secondNumber}}` 将 `firstNumber` 和 `secondNumber` 相乘。\n\
  \n`{{ expression}}` 显示表达式的值。\n\n在上面的示例中，第一个文本框中写了 `9`，第二个文本框中写了 `6`，但在结果字符串区域由于使用了数字表达式\
  \ `{{ }}`。\n\n### 对象表达式\n\nAngularJS 字符串表达式如下。（这里应该是对象表达式）\n对象表达式如下：\n\n### 示例 6.3\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJS 初学者教程</title>\n\
  \    <script src=\"js/angular.min.js\"></script>\n</head>\n<body>\n<h4>对象表达式</h4>\n\
  <div ng-app=\"\" ng-init=\"user={name:'John', age:20}\">\n姓名: <input ng-model=\"\
  user.name\"><br><br><br>\n年龄: <input ng-model=\"user.age\"><br><br><br>\n结果: {{user.name}}\
  \ 今年 {{user.age}} 岁。\n</div>\n</body>\n</html>\n```\n\n输出:\n\n![](img/00037.jpeg)\n\
  \n### 解释:\n\n`{{user.name}}` 显示对象的属性。\n\n`{{user.age}}` 显示对象的属性。\n\n### 数组表达式\n\n\
  AngularJS 类似于数组。语法如下：\n\n| <element> {{val1, val2, val3}} </element> |\n\n### 示例\
  \ 6.4\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJS 初学者教程</title>\n\
  \    <script src=\"js/angular.min.js\"></script>\n</head>\n<body>\n<h4>数组表达式</h4>\n\
  <div ng-app=\"\" ng-init=\"colors=['Red','Green','Blue']\">\n第一种颜色: {{colors[0]}}<br>\n\
  第二种颜色: {{colors[1]}}<br>\n第三种颜色: {{colors[2]}}\n</div>\n</body>\n</html>\n```\n\n\
  输出:\n\n![](img/00038.jpeg)\n\n### 解释:\n\n`{{colors[0]}}` 显示数组的第一个元素。\n\n`{{colors[1]}}`\
  \ 显示数组的第二个元素。\n\n`{{colors[2]}}` 显示数组的第三个元素。\n\n\n\n\n\n请将文件保存为 `ExpressionSample.html`\
  \ 并位于 `myFolder`。双击 `ExpressionSample.html` 文件，查看输出。\n\n输出：\n\n![](img/00040.jpeg)\n\
  \n## 解析\n\n`{{firstNumber + secondNumber}}` 显示 `firstNumber` 和 `secondNumber` 的和。\n\
  \n# 第 7 小\n\n## Controller & Scope\n\n### 什么是 Controller？\n\nController 基本上是一个控制应用程序数据流的\
  \ JavaScript 对象。因此， AngularJS 是由 `Controller` 控制的。\n\n### 如何定义 Controller？\n\n使用\
  \ `ng-controller` 指令来定义 `Controller`。我们知道 `Controller` 是包含 JavaScript 函数和属性的 JavaScript\
  \ 对象。`Controller` 的语法如下：\n\n| `<div ng-app=\"\" ng-controller=\"controllerName\"\
  >` |\n\n### 示例 7.1\n\n```html\n<html>\n<script src=\"js\\angular.min.js\"></script>\n\
  <body>\n<div ng-app=\"Calculation\" ng-controller=\"myController\">\nFirst Number:\
  \ <input type=\"number\" ng-model=\"firstNumber\"><br>\nSecond Number: <input type=\"\
  number\" ng-model=\"secondNumber\"><br>\n<br>\nSum: {{firstNumber + secondNumber}}\n\
  </div>\n<script>\nvar app = angular.module('Calculation', [ ]);\napp.controller('myController',\
  \ function($scope) {\n    $scope.firstNumber = 4;\n    $scope.secondNumber = 8;\n\
  });\n</script>\n</body>\n</html>\n```\n\n输出：\n\n![](img/00041.jpeg)\n\n### 解析\n\n\
  - `ng-controller=\"myController\"` 定义了一个控制器。\n- `app = angular.module()` 创建了一个新模块。\n\
  - `app.controller()` 将控制器的构造函数添加到模块中。\n- `function($scope)` 定义了一个构造函数，同时也定义了一个对象\
  \ `$scope`。当页面加载时，该函数将运行。\n- `$scope.property = value` 将值赋值给 `$scope` 对象的属性。\n\n\
  在上面的示例中，在当页面第一次加载时，你会看到两个文本框显示不同的数字，分别是 4 和 8；结果区域显示结果为 12。\n\n`angular.module()`：AngularJS\
  \ 模块是应用程序各个部分的集合，例如控制器、服务、过滤器、指令等。一个 AngularJS 模块定义了一个应用程序，我们将在后面的章节中详细讨论。\n\n###\
  \ 什么是 Scope？\n\nScope 是一个包含模型数据的 JavaScript 对象。\n\n| `function ($scope) { }` |\n\
  \n`$scope` 是 JavaScript 函数的参数，由控制器调用。让我们通过一个例子来理解。\n\n### 示例 7.2\n\n```javascript\n\
  <script>\nfunction ($scope) {\n    $scope.firstNumber = 23;\n    $scope.secondNumber\
  \ = 63;\n}\n</script>\n```\n\n### 解析\n\n在上面的示例中，`$scope` 是函数 `function ($scope)\
  \ { }` 的参数。`$scope` 是 AngularJS 中的一个对象。\n\n`$scope.firstNumber` 和 `$scope.secondNumber`\
  \ 是 HTML 中使用的模型。模型数据通过 `$scope` 对象访问。我们使用以下公式给模型赋值：`$scope.property = value`。\n\n\
  ### 例如：\n\n```javascript\n$scope.firstNumber = 23;\n$scope.secondNumber = 63;\n\
  ```\n\n## MVC & Scope\n\n### 什么是 MVC？\n\nMVC 代表模型（Model）、视图（View）和控制器（Controller）。\n\
  - 模型（Model）直接管理应用程序的数据、逻辑和规则。\n- 视图（View）显示数据。\n- 控制器（Controller）处理输入。\n\n在上面的示例中：\n\
  - `$scope.firstNumber` 和 `$scope.secondNumber` 是模型。\n- `<p ng-bind = \"firstNumber\
  \ + secondNumber\"></p>` 是 HTML 中使用的视图。\n- `ng-controller=\"myController\"` 定义了一个控制器。\n\
  \n控制器与视图之间的通信被称为 `Scope`，因此我们可以说 `Scope` 就像连接控制器与视图的桥梁。\n\n## 模块基础\n\n| `app = angular.module()`\
  \ |\n\n`app = angular.module()` 创建了一个新模块。\n\n### 示例 7.3\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<meta charset=\"utf-8\">\n<script src=\"js\\angular.min.js\"></script>\n\
  </head>\n<body>\n<div ng-app=\"myFruit\" ng-controller=\"iController\">\n<p>Please\
  \ select your favorite fruit.</p>\n<select ng-model=\"choosedFruit\" ng-options=\"\
  obj.fruit for obj in fruits\" size = \"4\">\n</select>\n<h3>Your favorite fruit\
  \ is: {{choosedFruit.fruit}}</h3>\n<h3>The color is: {{choosedFruit.color}}</h3>\n\
  </div>\n<script>\nvar app = angular.module('myFruit', [ ]);\napp.controller('iController',\
  \ function($scope) {\n    $scope.fruits = [\n    {fruit : \"Apple\", color : \"\
  Red\"},\n    {fruit : \"Orange\", color : \"Golden\"},\n    {fruit : \"Banana\"\
  , color : \"Green\"}\n];\n});\n</script>\n</body>\n</html>\n```\n\n## 输出：\n\n![](img/00042.jpeg)\n\
  \n## 解析：\n\n- `<div ng-app=\"myFruit\" ng-controller=\"iController\">` 定义了控制器 `iController`。\n\
  - `<select ng-model=\"choosedFruit\" ng-options=\"obj.fruit for obj in fruits\"\
  \ size = \"4\">` 创建选择框。\n- `{{choosedFruit.fruit}}` 显示水果。\n- `{{choosedFruit.color}}`\
  \ 显示颜色。\n- `var app = angular.module('myFruit', [ ]);` 创建了一个模块。\n- `app.controller('iController',\
  \ function($scope))` 定义了控制器。\n- `$scope.fruits = [...]` 存储数组。\n\n## 总结\n\n在本章中我们学习了什么是控制器、如何定义控制器、以及\
  \ MVC 和 Scope。\n`ng-controller=\"myController\"` 定义了一个控制器。\n`app = angular.module()`\
  \ 创建了一个新模块。\n`app.controller()` 将控制器的构造函数添加到模块中。\n`function($scope)` 定义了一个构造函数，同时也定义了一个对象\
  \ `$scope`。\n`$scope.property = value` 将值赋值给 `$scope` 对象的属性。\n`Scope` 是连接控制器与视图的桥梁。\n\
  \n## 动手项目\n\n打开记事本，编写 AngularJS 代码（图 1）：\n\n```html\n<!DOCTYPE html>\n<html>\n<script\
  \ src=\"js\\angular.min.js\"></script>\n<body>\n<div ng-app=\"myApplication\" ng-controller=\"\
  myController\">\nFirst Text: <p><textarea ng-model=\"firstNumber\"></textarea></p>\n\
  Second Text: <p><textarea ng-model=\"SecondNumber\"></textarea></p>\n<br>\nConnected\
  \ Text: <h4><p>{{firstText + \" \" + SecondText}}</p></h4>\n</div>\n<script>\nvar\
  \ app = angular.module('myApplication', [ ]);\napp.controller('myController', function($scope)\
  \ {\n    $scope.firstText = \"JavaScript\";\n    $scope.SecondText = \"8 Hours\"\
