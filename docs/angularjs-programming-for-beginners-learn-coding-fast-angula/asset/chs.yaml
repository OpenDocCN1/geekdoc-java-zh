  \ = value` 将值赋值给 `$scope` 对象的属性。\n\n---\n\n# 附录 1\n\n## Ajax 基础\n\n### 什么是 Ajax？\n\
  \nAJAX 代表“异步 JavaScript 和 XML”。AJAX 是一种新技术，通过服务器使用 XML、HTML、CSS、PHP、ASP 和 JavaScript\
  \ 创建更好、更快、更具交互性的 Web 脚本。\n\nAJAX 用于更新网页的一部分，而无需重新加载整个页面。\n\n这意味着通过 Ajax，你可以与服务器通信以更新信息，而无需刷新网页。\n\
  \n通过 jQuery 和 JavaScript，你可以轻松地在网页中实现 Ajax。\n\n运行 Ajax 需要一个服务器。\n\n下将将介绍如何设置服务器。\n\
  \n### 步骤 1:\n`下载“AppServ”免费链接: [http://www.angular.com/]`\n\n### 步骤 2:\n`安装 AppServ`\n\
  `images/0047.jpeg`\n\n### 步骤 3:\n`检查任何文件`\n`images/0048.jpeg`\n\n### 步骤 4:\n`服务器名称:\
  \ localhost`\n`images/0049.jpeg`\n\n### 步骤 5:\n`输入密码: 123`\n`images/0050.jpeg`\n\
  \n### 步骤 6:\n`完成按钮`\n`images/0051.jpeg`\n\n### 步骤 7:\n`检查页面`\n`images/0052.jpeg`\n\
  \n### 步骤 8:\n`文件夹 C:\\AppServer\\www`\n`images/0053.jpeg`\n\n---\n\n## 示例 1:  B1\n\
  \n```html\n<script lang=\"JavaScript\">\nvar ajaxObject = new XMLHttpRequest();\n\
  ajaxObject.open(\"GET\", \"data.txt\", true);\najaxObject.onreadystatechange = function()\
  \ {\n    if (ajaxObject.readyState == 4) {\n        alert(ajaxObject.responseText);\n\
  \    }\n};\najaxObject.send();\n</script>\n```\n\n将文件保存为 `B1.html` 并双击运行。\n\n**输出:**\n\
  Hello World!\n\n## 解释:\n\n- 第 2 行：`new XMLHttpRequest()` 创建了一个名为 `ajaxObject` 的\
  \ `XMLHttpRequest` 对象，它将用于 Ajax 脚本。\n- 第 3 行：`ajaxObject.open(\"GET\", \"data.txt\"\
  , true)` 初始化了 `XMLHttpRequest` 对象。\"\"GET\"` 指定了请求方法。\"\"data.txt\"` 是提供数据资源的 URL。`true`\
  \ 表示使用异步技术。\n- 第 4 行：`ajaxObject.onreadystatechange = function() { ... }` 指定了一个在接收到服务器响应时运行的函数。服务器响应的状态为\
  \ 0 到 4。\n- 第 5 行：`if (ajaxObject.readyState == 4)` 意味着如果服务器响应为 4，则返回的数据可用。\n- 第\
  \ 6 行：`alert(ajaxObject.responseText)` 显示从 `data.txt` 获取的文本。\n\n\n\n\n\n`ajaxObject.send()`\
  \ 将请求发送到服务器。\n\n## 示例 2\n\n### 示例 B2\n\n1. `<input type=\"button\" value=\"try\"\
  \ onClick=\"ajaxRequest();\"/>`\n2. `<script type=\"text/javascript\">`\n3-20.\n\
  ```javascript\nfunction ajaxRequest() {\n  if (window.XMLHttpRequest){\n    ajaxObject\
  \ = new XMLHttpRequest();\n  }\n  else if (window.ActiveXObject){\n    ajaxObject\
  \ = new ActiveXObject(\"Microsoft.XMLHTTP\");\n  }\n  ajaxObject.open(\"POST\",\
  \ \"data.txt\", true);\n  ajaxObject.onreadystatechange = function() {\n    if (ajaxObject.readyState\
  \ == 4) {\n      if(ajaxObject.status == 200) {\n        alert(ajaxObject.responseText);\n\
  \      }\n    }\n  }\n  ajaxObject.send();\n}\n```\n21. `</script>`\n\n将文件保存为 `B2.html`\
  \ 并双击它。\n\n## 输出:\nHello Ajax World!\n\n## 解释:\n\n### 第 1 行:\n`onClick=\"ajaxRequest();\"\
  ` 在点击按钮时调用函数 `ajaxRequest()`。\n\n### 第 3-9 行:\n这些代码创建了一个名为 `ajaxObject` 的 `XMLHttpRequest`\
  \ 对象，它将用于 Ajax 脚本。\n如果浏览器是 `NON-IE`，它使用 `new XMLHttpRequest()` 创建 `ajaxObject`。\n\
  如果浏览器是 `IE`，它使用 `new ActiveXObject(...)` 创建 `ajaxObject`。\n\n### 第 10 行:\n`ajaxObject.open(\"\
  POST\", \"data.txt\", true)` 初始化 `XMLHttpRequest` 对象的请求。\n`\"POST\"` 指定请求方法。也可以使用\
  \ `\"GET\"` 或 `\"PUT\"`。\n`\"data.txt\"` 是提供数据资源的 URL。\n在这里，`data.txt` 的内容为 `\"\
  Hello Ajax World!\"`。\n`\"true\"` 表示使用异步技术。\n\n### 第 11 行:\n`ajaxObject.onreadystatechange\
  \ = function() { ... }` 指定了一个在接收服务器响应时运行的函数。服务器的响应状态为 0 到 4：\n\n| readyState | 解释\
  \ |\n| :--- | :--- |\n| 0 | 未初始化 |\n| 1 | 已初始化 |\n| 2 | 发送数据 |\n| 3 | 接收数据 |\n|\
  \ 4 | 完成。返回的数据可用。 |\n\n`ajaxObject.onreadystatechange` 正在等待服务器的响应。\n\n### 第 12 行:\n\
  `if (ajaxObject.readyState == 4)` 表示如果服务器响应状态为 4，则返回的数据可用。\n\n### 第 13 行:\n`if(ajaxObject.status\
  \ == 200){ }` 表示如果服务器返回的 http 状态码为 200，则请求成功。\n\n| http status | 解释 |\n| :--- |\
  \ :--- |\n| 200 | 请求成功 |\n| 401 | 未授权 |\n| 403 | 拒绝 |\n| 404 | 未找到 |\n\n### 第 14\
  \ 行:\n`alert(ajaxObject.responseText)` 显示从 `data.txt` 获取的文本。\n输出：`\"Hello Ajax World!\"\
  `\n\n### 第 15 行:\n`ajaxObject.send()` 将请求发送到服务器。\n\n## 结果:\n运行整个脚本，将弹出一个对话框显示 `\"\
  Hello Ajax World!\"`。\n\n## 示例 3\n\n示例 3 中的代码与示例 2 基本相同。\n但示例 2 中的代码可以修改并如下所示示例\
  \ 3：\n\n### 示例 B3\n\n14. `document.getElementById(\"display\").innerHTML = \"A message\
  \ from server is: \" + ajaxObject.responseText;`\n22. `<div id=\"display\"></div>`\n\
  \nB3.html 内容如下：\n```html\n<input type=\"button\" value=\"try\" onClick=\"ajaxRequest();\"\
  />\n<script type=\"text/javascript\">\nfunction ajaxRequest() {\n  if (window.XMLHttpRequest){\n\
  \    ajaxObject = new XMLHttpRequest();\n  }\n  else if (window.ActiveXObject){\n\
  \    ajaxObject = new ActiveXObject(\"Microsoft.XMLHTTP\");\n  }\n  ajaxObject.open(\"\
  POST\", \"data.txt\", true);\n  ajaxObject.onreadystatechange = function() {\n \
  \   if (ajaxObject.readyState == 4) {\n      if(ajaxObject.status == 200) {\n  \
  \      document.getElementById(\"display\").innerHTML = \"A message from server\
  \ is: \" + ajaxObject.responseText;\n      }\n    }\n  }\n  ajaxObject.send();\n\
  }\n</script>\n<div id=\"display\"></div>\n```\n\n将文件保存为 `B3.html` 并双击它。\n\n## 输出:\n\
  A message from server is: Hello Ajax World!\n\n## 解释:\n\n### 第 14 行:\n`document.getElementById(\"\
  display\").innerHTML` 显示 ID 为 `\"display\"` 的指定位置的内容。\n`ajaxObject.responseText`\
  \ 从 `data.txt` 获取数据。\n输出：`\"A message from server is: Hello Ajax World!\"`。\n\n\
  ### 第 22 行:\n`<div id=\"display\"></div>` 创建一个 id 为 `\"display\"` 的标签，用于显示内容。\n\n\
  ## 结果:\n运行整个脚本。\n输出：`\"A message from server is: Hello Ajax World!\"`\n\n## 注意：\n\
  `\"data.txt\"` 可以是 `data.php`、`data.asp`、`data.jsp` 和 `data.xml`。\nAjax 需要服务器的支持。\n\
  \n## Ajax 优势:\nAjax 在不重新加载整个网页的情况下更新部分内容。\n\n### Ajax 图表:\n|  | 描述 |\n| :--- | :---\
  \ |\n| `open()` | 初始化请求 |\n| `send()` | 将请求发送到服务器 |\n| `onreadystatechange` | 事件\
  \ |\n| `responseText` | 来自服务器文本 |\n| `readyState` | 状态 |\n\n| readyState | 解释 |\n\
  | :--- | :--- |\n| 0 | 未初始化 |\n| 1 | 已初始化 |\n| 2 | 发送数据 |\n| 3 | 接收数据 |\n| 4 | 完成。返回的数据可用。\
  \ |\n\n| http status | 解释 |\n| :--- | :--- |\n| 200 | 请求成功 |\n| 401 | 未授权 |\n| 403\
  \ | 拒绝 |\n| 404 | 未找到 |\n\n## 附录:\nAjax 需要服务器的支持。\n\n### 示例 A1:\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n<script>\nfunction ajaxRequest() {\n  if (window.XMLHttpRequest){\n\
  \    ajaxObject = new XMLHttpRequest();\n  }\n  // ... 逻辑\n}\n</script>\n</head>\n\
  <body>\n<div id=\"display\">\n  <h2 id=\"message\"></h2>\n</div>\n<script>\n// ...\
  \ 逻辑\n</script>\n</body>\n</html>\n```\n\n\n\n\n| ID | 水果 | 颜色 |\n| 001 | 苹果 | 红色\
  \ |\n| 002 | 香蕉 | 绿色 |\n| 003 | 橙子 | 金色 |\n\n## 解释：\n\n`$http.get(\"angular_mysql.php\"\
  ).then(function (feedback) { }` 从 `mysql` 数据库获取数据。\n\n`$scope.title = feedback.records;`\
  \ 返回 `mysql` 数据库的每条记录。\n\n`<tr ng-repeat=\"v in title\">` 遍历每个字段。\n\n关于 PHP & MySQL，请阅读我的另一本书《8\
  \ 小时精通 PHP & MySQL》。\n\n### Angular 检查\n\n| `$dirty` // 检查用户已输入 `$pristine` // 检查用户未输入\
  \ |\n\n## 示例 A4\n\n```html\n<head>\n<script src=\"js\\angular.min.js\"></script>\n\
  </head>\n<body>\n<form ng-app=\"iCode\" ng-controller=\"iController\" name=\"iForm\"\
  \ novalidate>\n<p>请在此输入您的名字：<br><br>\n<input type=\"text\" name=\"userName\" ng-model=\"\
  userName\" required>\n<div style=\"color:red\" ng-show=\"iForm.userName.!$dirty\"\
  >\n<!--检查输入是否为空-->\n<div ng-show=\"iForm.userName.$error.required\">\n<!--显示错误消息\
  \ -->\n此字段不能为空！</div>\n</div>\n</p>\n</form>\n<script>\nvar iModule = angular.module('iCode',\
  \ []);\niModule.controller('iController', function($scope) {\n$scope.userName =\
  \ '';   \n});\n</script>\n</body>\n</html>\n```\n\n## 输出：\n\n请在此输入您的名字：\n\n|  |\n\
  \n此字段不能为空！\n\n## 解释：\n\n`iForm.userName.!$dirty` 检查输入字段的非空性。你可以使用 `$pristine` 或\
  \ `!$dirty`。\n\n`.$error.required` 显示错误消息。\n\n### Angular 验证\n\n| `$valid` // 检查输入的有效性\
