  - Angular Include\n\n## 附录 3\n- AngularJS 测试与答案\n- 源代码下载\n\n# 第 1 小时：AngularJS 简介\n\
  \n### 什么是 AngularJS？\nAngularJS 是一个 JavaScript 框架。可以使用 HTML 作为模板语言，并扩展 HTML 结构来清晰、简洁地定义应用程序的组件。\n\
  \nAngularJS 的语法如下：\n```html\n<div ng-app=\"\"></div>\n```\n我们知道 `div` 是一个 html 标签，但\
  \ `ng-app` 是 AngularJS 的指令，它像属性一样用在 `div` 标签中。（稍后我们会讨论指令）\n\n### 学习 AngularJS 的前提条件\n\
  在学习 AngularJS 之前，你应该具备 HTML 和 JavaScript 的基础知识，因为 AngularJS 是基于 HTML 和 JavaScript\
  \ 工作的。你可以在附录 1 或附录 2 中回顾 HTML 和 CSS（注意：本书的附录包含了“HTML、CSS 和 JavaScript 复习”）。\n\n\
  ### 下载 AngularJS\n下载 AngularJS 并不是难事；你只需要访问 AngularJS 网站 `https://AngularJS.org`\
  \ 并点击“Download”按钮。下载 AngularJS 文件 `angular.min.js` 后，你可以将其放在 `myFolder/js` 文件夹中（即\
  \ html 文件和 JavaScript 文件放在 `myFolder` 文件夹，并将 `angular.min.js` 放在 `myFolder/js` 文件夹），然后在\
  \ html 页的 head 部分如所示编写该 `angular.min.js` 文件的路径：\n```html\n<html>\n<head>\n<script\
  \ src=\"js/angular.min.js\"></script>\n```\n在上面的示例中，你可以看到 AngularJS 的路径 `<script\
  \ src=\"js/angular.min.js\">`。现在 AngularJS 框架已添加到我们的应用程序中。所以从现在起我们可以使用 AngularJS\
  \ 框架。\n\n### AngularJS 的优势\n- AngularJS 具有与 HTML 绑定数据的能力。\n- AngularJS 提供单页应用 (SPA)。\n\
  - AngularJS 的 View 完全用 HTML 编写，Controller 用 JavaScript 编写，Model 用 AngularJS 编写。它是一个\
  \ MVC 框架。\n- 你只需要几行代码就能实现更多功能。\n- AngularJS 代码和组件的可重用性。\n\n## 第一个 AngularJS 脚本\n\
  \n### 示例 1.1\n打开记事本，编写如下代码（图 1）：\n```html\n<html>\n<script src=\"js/angular.min.js\"\
  ></script>\n<body>\n<div ng-app=\"\">\n<p>在输入框中输入我的 id：</p>\n<p><input type=\"text\"\
  \ ng-model=\"id\" </p>\n<br>\n<h1>Welcome! {{id}}</h1>\n</div>\n</body>\n</html>\n\
  ```\n![](img/00001.jpeg)\n（图 1）\n\n请将文件命名为 `FirstAngularJS.html` 并保存到 `myFolder`\
  \ 中。注意：确保使用 `.html` 扩展名。双击 `FirstAngularJS.html` 文件，浏览器将运行 `FirstAngularJS.html`，并查看输出（图\
  \ 2）。假设我输入的 id 为 `168168`。\n\n#### 输出：\n![](img/00002.jpeg)\n（图 2）\n\n#### 解释：\n\
  - `<script src=\"js/angular.min.js\"></script>` 将 AngularJS 框架添加到当前应用程序中。\n- `<div\
  \ ng-app=\"\"></div>` 表示你可以在这里编写 AngularJS 应用程序。\n- `ng-model=\"id\"` 将来自 HTML 控件（input,\
  \ select 和 textarea）的输入数据绑定到应用程序数据 `id`。\n- `{{id}}` 与 `ng-model=\"id\"` 中的 `id`\
  \ 同步。\n- `{{id}}` 显示 `id` 的值。\n\n如果你想编辑代码，右键点击文件 `FirstAngularJS.html` > 打开方式 >\
  \ 记事本。\n\nHello World!\n```html\n<html ng-app=\"\">...</html>\n```\n\n### 示例 1.2\n\
  打开记事本，编写如下代码（图 1）：\n```html\n<html>\n<script src=\"js/angular.min.js\"></script>\n\
  <body>\n<div ng-app=\"\">\n<p>在输入框中输入我的 id：</p>\n<p><input type=\"text\" ng-model=\"\
  id\" </p>\n<br>\n<h1>Welcome! {{id}}</h1>\n</div>\n</body>\n</html>\n```\n请将文件命名为\
  \ `FirstAngularJS.html` 并保存到 `myFolder` 中。注意：确保使用 `.html` 扩展名。双击 `FirstAngularJS.html`\
  \ 文件，浏览器将运行 `FirstAngularJS.html`，并查看输出（图 2）。假设我输入的 id 为 `168168`。\n\n#### 输出：\n\
  ![](img/00003.jpeg)\n（图 2）\n\n#### 解释：\n- `<script src=\"js/angular.min.js\"></script>`\
  \ 将 AngularJS 框架添加到当前应用程序中。\n- `<div ng-app=\"\"></div>` 表示你可以在这里编写 AngularJS 应用程序。\n\
  - `ng-model=\"id\"` 将来自 HTML 控件（input, select 和 textarea）的输入数据绑定到应用程序数据 `id`。\n\
  - `{{id}}` 与 `ng-model=\"id\"` 中的 `id` 同步。\n- `{{id}}` 显示 `id` 的值。\n\n### 示例 1.3\n\
  打开记事本，编写如下代码（图 1）：\n```html\n<html>\n<script src=\"js/angular.min.js\"></script>\n\
  <body>\n<div ng-app=\"\">\n<p>在输入框中输入我的 id：</p>\n<p><input type=\"text\" ng-model=\"\
  id\" </p>\n<br>\n<h1>Welcome! {{id}}</h1>\n</div>\n</body>\n</html>\n```\n\n## 总结\n\
  在本章中，我们学习了 AngularJS 是什么、如何下载 AngularJS 以及 AngularJS 的优势。\n\n\n\n\n\nAngularJS 允许我们使用属性以非常简单的方式扩展\
  \ HTML。这些属性本质上都是指令（directives）。有不同类型的指令，它们在应用程序中可以发挥不同的作用。它们分别是 `App Directive`、`Model\
  \ Directive`、`Bind Directive`、`Init Directive` 和 `Repeat Directive`。让我们逐一详细讨论。\n\
  \n### App Directive\n\n| `ng-app= \" \"` |\n\n`app` 指令定义了 AngularJS 应用程序区域。`app`\
  \ 指令的语法为 `ng-app = \" \";`。在这里，`ng` 是 AngularJS 的命名空间，`app` 是 Angular JS 的应用区域。\n\
  \n### 示例 2.1\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJS for\
  \ beginners</title>\n    <script src=\"js\\angular.min.js\"></script>\n</head>\n\
  <body>\n    <div ng-app=\" \"> \n        The AngularJSapplication has been started.\n\
  \    </div>\n</body>\n</html>\n```\n\n#### 输出:\nThe AngularJSapplication has been\
  \ started.\n\n#### 解析:\n在 `head` 部分（`<script src = \"js\\angular.min.js\"> </script>`），加载了\
  \ AngularJS 框架，这意味着我们现在可以使用 AngularJS 框架了。\n\n在 `body` 部分（`<div ng-app=\" \"> </div>`），可以在这里编写\
  \ AngularJS 应用程序。\n\n在最后一个标签（`</div>`），AngularJS 应用程序结束结束。\n\n### Model Directive\n\
  \n| `ng-model = \"data\"` |\n\n`model` 指令用于将 HTML 控件（输入、复选框和选择等）输入的值绑定到应用程序数据。`ng-model\
  \ = \"data\"` 是 `model` 指令的语法。让我们来看一个例子以便更好地理解。\n\n### 示例 2.2\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n    <title>AngularJSfor beginners</title>\n    <script\
  \ src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n<div ng-app=\"\">\n<p>User\
  \ Name: <br>\n<input type=\"text\" ng-model = \"Username\"></p>\n</div>\n</body>\n\
  </html>\n```\n\n#### 输出:\nUsername:\n\n#### 解析:\n`\"ng-model = “Username\"` 将来自\
  \ HTML 控件的输入值绑定到 `\"Username\"`。\n\n现在你看不到结果，因为此程序缺少了代码 `<p ng-bind=\"Username\"\
  ></p>`。\n\n### Bind Directive\n\n| `<p>ng-bind = \"data\"</p>` |\n\n`bind` 指令用于将数据值绑定到\
  \ html 元素 `<p>`；`bind` 指令的语法是 `<p>ng-bind = \"data\"</p>`。让我们来看一个例子以便更好地理解。\n\n\
  ### 示例 2.3\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJSfor\
  \ beginners</title>\n    <script src=\"js\\angular.min.js\"></script>\n</head>\n\
  <body>\n<div ng-app=\"\">\n<p>User Name: <br>\n<input type=\"text\" ng-model = \"\
  Username\"></p>\n<p ng-bind=\"Username\"></p>\n</div>\n</body>\n</html>\n```\n\n\
  打开记事本并将上述代码以 `.html` 扩展粘贴，并在输入框中输入用户名“Ray Yao”。\n\n#### 输出:\n![](img/00007.jpeg)\n\
  \n#### 解析:\n`“<p>ng-bind=\"Username\"</p>\"` 将 `\"Username\"` 的值绑定到 `<p></p>` 标签，并“显示”它的值。\n\
  \n在上面的示例中（`<p ng-bind=\"Username\"></p>`）可以更新 `\"Username\"` 的值并写入 `<p></p>` 标签。\n\
  \n`<p>ng-bind=\"data\"</p>` 用于指定的 html 元素 `<p>` 中“输出”`data` 的值。\n\n### ng-model\
  \ & ng-bind\n\n它们都使用“bind”（绑定）。\n\n(1) `ng-model = \"data\"`：将来自 Html 控件（文本区域、复选框、选择、输入和单选按钮等）的输入值绑定到\
  \ `\"data\"`。\n\n#### 例如:\n`\"ng-model = “Username\"` 将输入值绑定到 `\"Username\"`。（就像将输入值赋值给\
  \ `\"Username\"`一样。）\n\n(2) `<p>ng-bind= \"data\"</p>`：将 `\"data\"` 绑定到 html 元素\
  \ `<p></p>`。\n\n#### 例如:\n`<p ng-bind=\"Username\"></p>` 将数据 `\"Username\"` 绑定到\
  \ `<p></p>` 元素并显示其值。（就像在 `<p></p>` 中显示 `\"Username\"` 的值一样。）\n\n### Init Directive\n\
  \n| `ng-init = \"data = ‘value’\"` |\n\n`init` 指令用于用值初始化数据。`init` 指令的语法为 `ng-init\
  \ = \"data = ‘value’\"`。让我们来看一个例子以便更好地理解。\n\n### 示例 2.4\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <title>AngularJSfor beginners</title>\n    <script src=\"js\\\
  angular.min.js\"></script>\n</head>\n<body>\n<div ng-app=\"\" ng-init=\"Username=\
  \ 'Andy Smith' \">\n    <p>User Name: <input type=\"text\" ng-model = \"Username\"\
  ></p>\n    <p ng-bind=\"Username\"></p>\n</div>\n</body>\n</html>\n```\n\n打开记事本并将上述代码以\
  \ `.html` 扩展粘贴。\n\n#### 输出:\n![](img/0008.jpeg)\n\n#### 解析:\n`\"ng-init=Username=\
  \ 'Andy Smith' \"` 为 `\"Username\"` 初始化一个值。\n\n在上面的示例中，`<div ng-app=\"\" ng-init=\"\
  Username= 'Andy Smith' \">`，AngularJS 应用程序结束。\n\n### Repeat Directive\n\n| `ng-repeat\
  \ = \"item in array\"` |\n\n`repeat` 指令的作用像循环一样。`repeat` 指令通过重复来获取数组的值。\n\n### 示例\
  \ 2.5\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJSfor beginners</title>\n\
  \    <script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n<div ng-app=\"\
  \">\n<ul>\n    <li ng-repeat=\"x in ['Red', 'Green', 'Blue']\">{{x}}</li>\n</ul>\n\
  </div>\n</body>\n</html>\n```\n（注：根据提供的文本结构，repeat 指令的示例是片段化的；此处重构的逻辑遵循标准的指令逻辑）\n\
  \n在 `body` 部分（`<div ng-app=\" \"> </div>`），可以在这里编写 AngularJS 应用程序。\n\n在最后一个标签（`</div>`），AngularJS\
  \ 应用程序结束。\n\n### Valid Directive\n\n| `ng-valid` |\n\n`valid` 指令可以在输入有效时更改指定元素的状态。\n\
  \n### 示例 2.6\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJS for\
  \ beginners</title>\n    <script src=\"js\\angular.min.js\"></script>\n    <style>\n\
  \    input.ng-valid {\n        background-color: yellow;\n    }\n    </style>\n\
  </head>\n<body>\n<form>\nPlease enter number:\n<input type=\"text\" ng-model=\"\
  psw\" required>\n</form>\n</body>\n</html>\n```\n\n#### 输出:\n![](img/0010.jpeg)\n\
  \n#### 解析:\n`\"input.ng-valid\"` 在输入有效时更改背景颜色。\n\n### Check Email Address\n\n| `$error.email`\
  \ |\n\n`“$error.email\"` 用于检查电子邮件地址的有效性；如果输入了错误的邮箱格式，则返回错误消息。\n\n### 示例 2.7\n\n\
  ```html\n<!DOCTYPE html>\n<html ng-app=\"\">\n<head>\n    <title>AngularJS for beginners</title>\n\
  \    <script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n<form name=\"\
  iForm\">\nPlease input your email address: <br><br>\n<input type=\"email\" name=\"\
  eMailAddr\" ng-model=\"text\"> <br><br>\n<div ng-show=\"iForm.eMailAddr.$error.email\"\
  > Invalid email address!</div>\n</form>\n</body>\n</html>\n```\n\n#### 输出:\n![](img/0011.jpeg)\n\
  \n#### 解析:\n当你输入格式错误的电子邮件地址时，你将看到一个提示：Invalid email address!\n\n\n\n\n\n```html\n\
  <script src=\"js\\angular.min.js\"></script>\n<body>\n<div data-ng-app=\"\" data-ng-init=\"\
  colors=['Red','Yellow','Green','White','Black']\">\n  <p>Show colors:</p>\n  <ol\
  \ type=\"1\">\n    <li data-ng-repeat=\"show in colors\">\n      {{ show }}\n  \
  \  </li>\n  </ol>\n</div>\n</body>\n</html>\n```\n\n![](img/00012.jpeg)\n（图 1）\n\
  \n请将文件命名为 `RepeatOutput.html` 并保存到 `myFolder` 中。注意：确保使用 `.html` 扩展名。\n\n双击 `RepeatOutput.html`\
  \ 文件，浏览器将运行 `RepeatOutput.html` 并即可输出结果。（图 2）\n\n输出：（图 2）\n\n![](img/00013.jpeg)\n\
  \n## 解释：\n\n- `data-ng-app` 与 `ng-app` 几乎相同，但 `data-ng-app` 更适用于 HTML5。\n- `<div\
  \ data-ng-app=\"\" > </div>` 表示你可以在这里编写 AngularJS 应用程序。\n- `data-ng-init` 与 `ng-init`\
  \ 几乎相同，但 `data-ng-init` 更适用于 HTML5。\n- `data-ng-init=\"colors=…\"` 初始化带有某些取值的数组\
  \ `colors`。\n- `data-ng-repeat =\"show in colors\"` 重复获取数组 `colors` 的值，并将所有数组值赋值给变量\
  \ `show`。\n- `{{ show }}` 显示 `show` 的值。\n\n# 第 3 小时\n\n## 过滤器 (Filters)\n\n### 什么是过滤器？\n\
  \n过滤器用于格式化数据的值。管道符号 (`|`) 表示使用了过滤器。过滤器的正确语法如下所示：\n\n| Value | filter |\n\n让我们逐个理解过滤器。\n\
  \n### 大写过滤器 (Uppercase filter)\n\n| Value | uppercase |\n\nuppercase 过滤器将文本转换为大写。假设用户写了小写文本（例如\
  \ `ray`）、标题大小写文本（例如 `Ray`）或混合大小写（例如 `rAy` 或 `RaY` 或 `rAY` 等），而你想要大写形式的结果，那么你就必须使用大写过滤器。\n\
  \n### 示例 3.1\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJSfor\
  \ beginners</title>\n<script src=\"js\\angular.min.js\"></script>\n<meta http-equiv=\"\
  Content-Type\" content=\"text/html; charset=UTF-8\" />\n</head>\n<body>\n<h3>Using\
  \ Upper Case Filter</h3>\n<div ng-app=\"\" ng-init=\"Username= 'ray' \">\n<p>User\
  \ Name: <input type=\"text\" ng-model =\"Username\"></p>\n<p style=\"color:red\"\
  \ ng-bind=\"Username | uppercase\"></p>\n</div>\n</body>\n</html>\n```\n\n输出：\n\
  ![](img/00014.jpeg)\n\n解释：\n- `Username | uppercase` 将 `Username` 的值转换为大写。\n- 在上面的示例中，我设置了小写的默认值（`ray`），但结果变成了大写（`RAY`）。\n\
  \n### 小写过滤器 (Lowercase filter)\n\n| Value | lowercase |\n\nlowercase 过滤器将文本转换为小写。假设用户写了大写文本（例如\
  \ `RAY YAO`）、标题大小写文本（例如 `Ray Yao`）或混合大小写（例如 `rAy` 或 `RaY` 或 `rAY` 等），而你想要小写形式的结果，那么你就必须使用小写过滤器。\n\
  \n### 示例 3.2\n\n```html\n<html>\n<head>\n    <title>AngularJSfor beginners</title>\n\
  \    <script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n<h3>Using Lower\
  \ Case Filter</h3>\n<div ng-app=\"\" ng-init=\"Username= 'Ray YAO' \">\n<p>User\
  \ Name: <input type=\"text\" ng-model=\"Username\"></p>\n<p style=\"color:red\"\
  \ ng-bind=\"Username | lowercase\"></p>\n</div>\n</body>\n</html>\n```\n\n打开记事本并并将上述代码以\
  \ `.html` 扩展名粘贴。\n\n输出：\n![](img/00015.jpeg)\n\n解释：\n- `Username | lowercase`: 将\
  \ `Username` 的值转换为小写。\n- 在上面的示例中，当我输入大写的文本（`Ray YAO`）时，结果变成了小写（`ray yao`）。\n\n###\
  \ 排序过滤器 (OrderBy filter)\n\nOrderBy 过滤器用于按升序或降序显示值。`orderBy` 的语法如下：\n\n| Value |\
  \ orderBy: 'value' // 用于升序 | Value | orderBy: '-value' // 用于降序 |\n\n让我们来看一个例子以更好地理解。\n\
  \n### 示例 3.3\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJSfor\
  \ beginners</title>\n    <script src=\"js\\angular.min.js\"></script>\n</head>\n\
  <body>\n<h1>Using OrderBy filter</h1>\n<div ng-app=\"\" ng-init=\"StudentsResult=[{name:\
  \ 'Tienq', marks:81},    {name: 'Svbrf', marks:70}, {name: 'Yaito', marks:90}, {name:\
  \ 'Pewfn', marks:63}, {name: 'Riet', marks:98}]\">\n<table border=\"1\" >\n<tr>\n\
  <th>Student Name</th>\n<th>Mathematics Result</th>\n</tr>\n<tr ng-repeat=\"x in\
  \ StudentsResult | orderBy:'-marks' \">\n<td ng-bind=\"x.name\"></td>\n<td ng-bind=\"\
  x.marks\"></td>\n</tr>\n</table>\n</div>\n</body>\n</html>\n```\n\n输出：\n![](img/00016.jpeg)\n\
  \n解释：\n- `StudentsResult | orderBy:'-marks'` 按降序显示 `StudentsResult` 的值。\n- 你可以看到使用\
  \ `orderBy:'-marks'` 时，最高分在最顶端。\n- 如果你想反转顺序，可以去掉 `-`。\n\n### 示例 3.4\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJSfor beginners</title>\n   \
  \ <script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n<h1>Using OrderBy\
  \ filter</h1>\n<div ng-app=\"\" ng-init=\"StudentsResult=[{name: 'Tienq', marks:81},\
  \    {name: 'Svbrf', marks:70}, {name: 'Yaito', marks:90}, {name: 'Pewfn', marks:63},\
  \ {name: 'Riet', marks:98}]\">\n<table border=\"1\" >\n<tr>\n<th>Student Name</th>\n\
  <th>Mathematics Result</th>\n</tr>\n<tr ng-repeat=\"x in StudentsResult | orderBy:'marks'\
  \ \">\n<td ng-bind=\"x.name\"></td>\n<td ng-bind=\"x.marks\"></td>\n</tr>\n</table>\n\
  </div>\n</body>\n</html>\n```\n\n输出：\n![](img/00017.jpeg)\n\n解释：\n- `StudentsResult\
  \ | orderBy: 'marks'` 按升序显示 `StudentsResult` 的值。\n\n### 货币过滤器 (Currency filter)\n\
  \n| Value | currency |\n\ncurrency 过滤器过滤器用于货币格式显示结果。\n\n### 示例 3.5\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJSfor beginners</title>\n<script\
  \ src=\"js\\angular.min.js\"></script>\n<meta http-equiv=\"Content-Type\" content=\"\
  text/html; charset=UTF-8\" />\n</head>\n<body>\n<h1>Using Currency filter</h1>\n\
  <div ng-app=\"\" ng-init=\"Employees_Monthly_Salary=[{name: 'Jay', salary:8100},\
  \ {name: 'Sdwt', salary:7000}, {name: 'Hao', salary:9000}, {name: 'Luoe', salary:6300},\
  \ {name: 'Fin', salary:9800}]\">\n<table border=\"1\" >\n<tr>\n<th>Employee Name</th>\n\
  <th>Employee Salary</th>\n</tr>\n<tr ng-repeat=\"x in Employees_Monthly_Salary \"\
  >\n<td ng-bind=\"x.name\"></td>\n<td ng-bind=\"x.salary | currency \"></td>\n</tr>\n\
  </table>\n</div>\n</body>\n</html>\n```\n\n打开记事本并将上述代码以 `.html` 扩展名粘贴。\n\n输出：\n\
  ![](img/00018.jpeg)\n\n解释：\n- `x.salary | currency` 将工资转换为货币格式。\n- 在上面的示例中，表格中有列，第一列是员工姓名，第二列是员工工资。工资列以货币格式显示工资。\n\
  \n### 数组过滤器 (Array filter)\n\n| Array | filter:input |\n\n`Array | filter:input`\
  \ 可以根据用户输入过滤数组元素。\n\n### 示例 3.6\n\n```html\n<!DOCTYPE html>\n<html ng-app=\"\">\n\
  <head>\n<script src=\"js\\angular.min.js\"></script>\n<meta charset=\"utf-8\">\n\
  </head>\n<body>\n<div ng-init=\"students = // 定义数组“students”\n[{name:'Andy', age:'19'},\n\
  {name:'Rose', age:'18'},\n{name:'Jony', age:'17'},\n{name:'Judy', age:'16'},\n{name:'Tomy',\
  \ age:'15'},\n{name:'Lily', age:'14'}]\">\n</div>\n<table>\n  <tr><th>Name</th><th>Age</th></tr>\n\
  \  <tr ng-repeat=\"person in students | filter:myList\">\n    // 根据输入值过滤数组“students”\n\
  \    <td>{{person.name}}</td>\n    <td>{{person.age}}</td>\n  </tr>\n</table>\n\
  <br><br>\n<label>Please input one of the above name or age 以上姓名或年龄之一\n<br><br>\n\
  <input ng-model=\"myList\"></label> // 用户输入\n</body>\n</html>\n```\n\n请尝试在文本框输入数字\
  \ 18。\n\n输出：\n![](img/00019.jpeg)\n\n解释：\n- `<div ng-init=\"students =….\"` 定义了数组\
  \ `students`。\n- `person in students | filter:myList` 根据输入值 `myList` 过滤数组 `students`。\n\
  - `<input ng-model=\"myList\">` 接收用户输入并将输入值存储到 `myList`。\n- 当你向文本框输入 18 时，输出显示 `Rose\
  \ 18`。\n\n\n\n\n\n在本章中，我们学习了什么是过滤器。以及不同类型的过滤器，如大写过滤器、小写过滤器、排序过滤器和货币过滤器。我已尝试通过适当的示例、输出和解释来介绍本章的每一个主题。\n\
  \n- `Value | uppercase` 将值转换为大写。\n- `Value | lowercase` 将值转换为小写。\n- `Value | orderBy:\
  \ ’value’` 按升序顺序显示值。\n- `Value | orderBy: ’-value’` 按降序顺序显示值。\n- `Value | currency`\
  \ 将值转换为货币格式。\n- `Array | filter:input` 可以根据用户输入对数组元素进行过滤。\n\n## 动手实践项目\n\n### 大写过滤器\
  \ (Uppercase Filter)\n\n打开记事本，编写以下 AngularJS 代码：\n\n```html\n<!DOCTYPE html>\n<script\
  \ src=\"js\\angular.min.js\"></script>\n<body>\n<h4>Uppercase Filter</h4>\n<div\
  \ ng-app=\"\">\n<p>Book Name: </p>\n<p><input type=\"text\" ng-model = \"Book\"\
  ></p>\n<h3><p ng-bind=\"Book|uppercase\"></p></h3>\n</div>\n</body>\n</html>\n```\n\
  \n![](img/00020.jpeg)\n\n请将该文件命名为 `UppercaseFilter.html` 并保存到 `myFolder` 中。注意：确保使用\
  \ `.html` 扩展名。\n\n双击 `UppercaseFilter.html` 文件，浏览器将运行该文件，在文本框中输入书名“JavaScript in\
  \ 8 Hours”，并查看输出结果。\n\n输出： \n![](img/00021.jpeg)\n\n#### 解释：\n`<p ng-bind=\"Book|uppercase\"\
  ></p>` 将 `Book` 的值转换为大写。\n\n# 第 4 小时\n\n## DOM 中的指令 (Directive in DOM)\n\n### Show\
  \ 指令 (Show Directive)\n\n| `<p ng-show=\"true\"> visible.</p><p ng-show=\"false\"\
  >invisible.</p>` | |\n\nShow 指令用于显示或隐藏 HTML 中 `<p>` 元素中的文本。\n如果 `ng-show` 为 true，将显示文本“visible”。\n\
  如果 `ng-show` 为 false，则将隐藏文本“invisible”。\n\n### 示例 4.1\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <title>AngularJS for beginners</title>\n    <script src=\"js/angular.min.js\"\
  ></script>\n</head>\n<body>\n<h3>Using Show directive</h3>\n<div ng-app=\"\" >\n\
  <input type=\"checkbox\" ng-model=\"showHideDiv\">Show Div\n<div ng-show=\"showHideDiv\"\
  \ style=\"background-color:yellow;height:50px;\">\n<p>I am a div</p>\n<p>I appear\
  \ when the check box is checked.</p>\n</div>\n</div>\n</body>\n</html>\n```\n\n\
  输出：\n![](img/00022.jpeg)\n\n#### 解释：\n`ng-model=\"showHideDiv\"` 将复选框的值与 `showHideDiv`\
  \ 绑定。\n`ng-show=\"showHideDiv\"` 当 `showHideDiv` 的值为 true 时显示文本。\n在上面的示例中，起初初次加载页面时，div（页面的黄色区域）是不显示的，但当我勾选复选框（show\
  \ Div）时，`showHideDiv` 的值为 true；div（页面的黄色区域）就会出现。\n\n### Hide 指令 (Hide Directive)\n\
  \n| `<p ng-hide=\"true\"> invisible.</p><p ng-hide=\"false\">visible.</p>` | |\n\
  \nHide 指令用于隐藏或显示 HTML 中 `<p>` 元素中的文本。\n如果 `ng-hide` 为 true，则将隐藏文本“invisible”。\n\
  如果 `ng-hide` 为 false，将显示文本“visible”。\n\n### 示例 4.2\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n    <title>AngularJSfor beginners</title>\n<script src=\"js\\angular.min.js\"\
  ></script>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
  \ />\n</head>\n<body>\n<h3>Using Hide directive</h3>\n<div ng-app=\"\" >\n<input\
  \ type=\"checkbox\" ng-model=\"HideShowDiv\">Hide Div\n<div ng-hide=\"HideShowDiv\"\
  \ style=\"background-color:pink;height:50px;\">\n<p>I am a div</p>\n<p>I will disappeared\
  \ when the check box is checked.</p>\n</div>\n</div>\n</body>\n</html>\n```\n\n\
  打开记事本并粘贴上述带有 `.html` 扩展名的代码。\n\n输出：\n![](img/00023.jpeg)\n\n请勾选复选框并查看结果。\n![](img/00024.jpeg)\n\
  \n#### 解释：\n`ng-model=\"showHideDiv\"` 将复选框的值与 `showHideDiv` 绑定。\n`ng-hide=\"showHideDiv\"\
  ` 当 `showHideDiv` 的值为 true 时隐藏文本。\n在上面的示例中，页面初次加载时，div（页面的粉色区域）是显示的。\n但当我点击复选框（Hide\
  \ Div）时，`showHideDiv` 的值为 true；div（页面的粉色区域）消失了。（注：保留了原始文本变量名）。\n\n### Disable 指令\
  \ (Disable Directive)\n\n| `<input type=\"button\" ng-disabled=true value=\"myButton\"\
  >` | |\n\nDisable 指令用于禁用或启用 HTML 元素。\n如果 `ng-disabled` 为 true，元素将是禁用的。\n\n### 示例\
  \ 4.3\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJS for beginners</title>\n\
  \    <script src=\"js/angular.min.js\"></script>\n</head>\n<body>\n<h3>Using Disable\
  \ directive</h3>\n<div ng-app=\"\" >\n<input type=\"checkbox\" ng-model=\"showHideDiv\"\
  >Show Div\n<div ng-disabled=\"showHideDiv\" style=\"background-color:yellow;height:50px;\"\
  >\n<p>I am a div</p>\n<p>I appear when the check box is checked.</p>\n</div>\n</div>\n\
  </body>\n</html>\n```\n\n输出：\n![](img/00025.jpeg)\n\n#### 解释：\n`ng-model=\"showHideDiv\"\
  ` 将复选框的值与 `showHideDiv` 绑定。\n`ng-disabled=\"showHideDiv\"` 当 `showHideDiv` 的值为 true\
  \ 时禁用元素。\n在上面的示例中，页面初次加载时，div（页面的黄色区域）是禁用的。\n\n### Click 指令 (Click Directive)\n\n\
  | `ng-click=\"expression\"` | |\n\nClick 指令用于定义点击事件。\n\n### 示例 4.4\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJS for beginners</title>\n  \
  \  <script src=\"js/angular.min.js\"></script>\n</head>\n<body>\n<h3>Using Click\
  \ directive</h3>\n<div ng-app=\"\" ng-init=\"result=0\">\n<button ng-click=\"result=result+100\"\
  >Click Here!</button>\n<H1><p ng-bind=\"result\"></p></H1>\n</div>\n</body>\n</html>\n\
  ```\n\n输出：\n![](img/00026.jpeg)\n\n#### 解释：\n`ng-click=\"result+100\"` 点击按钮时更新值。\n\
  \n### If 指令 (If Directive)\n\n| `ng-if=\"condition\"` | |\n\nIf 指令用于在 DOM 中添加或移除元素。\n\
  如果 `ng-if` 为 true，元素将添加到 DOM 中。\n如果 `ng-if` 为 false，元素将被移除。\n\n### 示例 4.5\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n    <title>AngularJS for beginners</title>\n  \
  \  <script src=\"js/angular.min.js\"></script>\n</head>\n<body ng-app=\"\" align=\"\
  center\">\n<input type=\"checkbox\" ng-model=\"result\" >\n<div ng-if=\"result\"\
  > \n<p>When you check the box, the will be shown.<br>\nWhen you uncheck the box,\
  \ the will be hidden.</p>\n</div>\n</body>\n</html>\n```\n\n输出：\n![](img/00027.jpeg)\n\
  \n#### 解释：\n`ng-if=\"result\"`  `result` 的真值。\n\n## 总结\n\n- `ng-show=\"showHideDiv\"\
  ` 当 `showHideDiv` 的值为 true 时显示文本。\n- `ng-hide=\"showHideDiv\"` 当 `showHideDiv` 的值为\
  \ true 时隐藏文本。\n- `ng-disabled=\"DisableEnable\"` 当 `DisableEnable` 为 true 时禁用 HTML\
  \ 元素。\n- `ng-click=\"expression or function( )\"` 点击按钮时更新表达式或运行函数( )。\n- `ng-if\
  \ 指令` 用于在 DOM 中添加或移除元素。\n\n## 动手实践项目\n\n### 点击事件 (Click Event)\n\n打开记事本，编写以下 AngularJS\
  \ 代码：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<script src=\"js\\angular.min.js\"\
  ></script>\n</head>\n<body>\n<br><br>Click Directive<br><br>\n<div ng-app=\"\" ng-init=\"\
  result=0\">\n<button ng-click=\"result=result+100\">Click Here!</button>\n<H1><p\
  \ ng-bind=\"result\"></p></H1>\n</div>\n</body>\n</html>\n```\n\n![](img/00028.jpeg)\n\
  \n\n\n\n\n双击 `ClickEvent.html` 文件，浏览器将运行 `ClickEvent.html`，点击按钮“Click Here!”并查看输出。\n\
  \n输出：\n\n![](img/00029.jpeg)\n\n## 解析：\n\n`ng-click=\"result=result+100\"` 在点击按钮时计算该表达式。\n\
  \n# 第 5 小\n\n## 事件\n\n## 事件\n\n事件与不同的 HTML 元素关联。例如，点击事件与按钮元素关联；同样，按键事件与文本框或文本区域元素关联。AngularJS\
  \ 提供了多个与 HTML 控制关联的事件。\n\n### 点击事件 (Click event)\n| ng-click = “expression” |\n\n\
  `ng-click = “expression\"` 定义了一个点击事件。当按钮被点击时，会发生事件并计算该表达式。点击事件通常作用于按钮。\n\n### 示例\
  \ 5.1\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>AngularJS for beginners</title>\n\
  <script src=\"js\\angular.min.js\"></script>\n</head>\n<body>\n<h3>使用点击事件两个数字相加</h3>\n\
  <div ng-app=\"\" ng-init=\"firstNumber=47; secondNumber=23\">\n<p>第一个数字： <input\
  \ type=\"number\" ng-model =\"firstNumber\"></p>\n<p>第二个数字： <input type=\"number\"\
  \ ng-model =\"secondNumber\"></p>\n<button ng-click=\"Result=firstNumber + secondNumber\"\
  > Add Numbers </button>\n<p>结果:<p style=\"font-weight:bold; color:blue\" ng-bind\
  \ =\"Result\"> </p></p>\n</div>\n</body>\n</html>\n```\n打开记事本并粘贴上述代码，保存为 `.html`\
  \ 扩展名。\n\n输出：\n![](img/00030.jpeg)\n\n解析：\n`<button ng-click=\"Result=firstNumber\
  \ + secondNumber\"> Add Numbers </button>`：当按钮被点击时，会发生事件。`firstNumber` 加上 `secondNumber`，并将结果赋值给\
  \ `Result`。\n\n在上面的示例中，页面首次加载时，第一个文本框显示数字 47，第二个文本框显示数字 23，但没有结果。（注意：这些数字是在 `ng-init`\
  \ 指令中初始化的，但你可以在两个文本框中输入自己的数字）。当我点击按钮（Add Numbers）时，Result 区域显示的结果为 70。\n\n### 双击事件\
  \ (Double Click event)\n| ng-dblclick = “expression” |\n\n`ng-dblclick = “expression\"\
  ` 定义了一个双击事件。当按钮被双击时，会发生事件并计算该表达式。\n\n双击事件通常作用于按钮。\n\n### 示例 5.2\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<head>\n<title>AngularJS for beginners</title>\n<script src=\"\
  js/angular.min.js\"></script>\n</head>\n<body>\n<h4>使用双击事件两个数字相加</h4>\n<div ng-app=\"\
  \" ng-init=\"firstNumber=26;SecondNumber=89\">\n<p>第一个数字: &nbsp;&nbsp;&nbsp; <input\
  \ type=\"number\" ng-model=\"firstNumber\"></p>\n<p>第二个数字: <input type=\"number\"\
  \ ng-model=\"SecondNumber\"></p>\n<button ng-dblclick=\"Result=firstNumber + SecondNumber\"\
  >Double Click</button>\n<p>结果:<p style=\"font-weight:bold;color:blue\" ng-bind=\"\
  Result\"> </p>\n</div>\n</body>\n</html>\n```\n打开记事本并粘贴上述代码，保存为 `.html` 扩展名。\n\n\
  输出：\n![](img/00031.jpeg)\n\n解析：\n`<button ng-dblclick=\"Result=firstNumber + secondNumber\"\
  > Add Numbers  </button>`：当按钮被双击时，会发生事件。`firstNumber` 加上 `secondNumber`，并将结果赋值给\
  \ `Result`。\n\n在上面的示例中，页面首次加载时，第一个文本框显示数字 26，第二个文本框显示数字 89，但没有结果。当我双击按钮（Add Numbers）时，Result\
  \ 区域显示的结果为 115。\n\n### 鼠标移动事件 (Mouse Move event)\n| ng-mousemove = “expression”\
  \ |\n\n`ng-mousemove = “expression\"` 定义了一个鼠标移动事件。当鼠标移动时，会发生事件并计算该表达式。\n\n鼠标移动事件通常作用于\
  \ div、body 以及特定区域或元素。\n\n### 示例 5.3\n```html\n<!doctype html>\n<html>\n<head>\n\
  <script src=\"js\\angular.min.js\"></script>\n</head>\n<body ng-app=\"\">\n<br><br>\n\
  <textarea ng-mousemove=\"count = count + 1\" ng-init=\"count=0\">\nHere is a textarea\n\
  </textarea>\n<br><br>\n<h2>count: {{count}}</h2>\n</body>\n</html>\n```\n（假设你在 textarea\
  \ 上移动了 20 次鼠标。）\n\n输出：\n| Here is a textarea. |\ncount: 20\n\n解析：\n`ng-mousemove=\"\
  count = count + 1\"`：当鼠标在 textarea 上移动时，`count` 增加 1。\n`ng-init=\"count=0\"` 将 `count`\
  \ 的值初始化为 0。\n`{{count}}` 显示 `count` 的值。\n`count : 20` 表示鼠标移动了 20 次。\n\n### 鼠标悬停事件\
  \ (Mouse Over event)\n| ng-mouseover = “expression” |\n\n`ng-mouseover = “expression\"\
  ` 定义了一个鼠标悬停事件。当鼠标悬停时，会发生事件并计算该表达式。\n\n鼠标悬停事件通常作用于 div、body 以及特定区域或元素。\n\n### 示例\
  \ 5.4\n```html\n<!doctype html>\n<html>\n<head>\n<script src=\"js\\angular.min.js\"\
  ></script>\n</head>\n<body ng-app=\"\">\n<br><br>\n<textarea ng-mouseover=\"count\
  \ = count + 1\" ng-init=\"count=0\">\nHere is a textarea\n</textarea>\n<br><br>\n\
  <h2>count: {{count}}</h2>\n</body>\n</html>\n```\n（假设鼠标在 textarea 上上悬停了 20 次。）\n\
  \n输出：\n| Here is a textarea. |\ncount: 20\n\n解析：\n`ng-mouseover=\"count = count\
  \ + 1\"`：当鼠标悬停在 textarea 上时，`count` 增加 1。\n`ng-init=\"count=0\"` 将 `count` 的值初始化为\
  \ 0。\n`{{count}}` 显示 `count` 的值。\n`count : 20` 表示鼠标悬停了 20 次。\n\n### 鼠标离开事件 (Mouse\
  \ Leave event)\n| ng-mouseleave = “expression” |\n\n`ng-mouseleave = “expression\"\
  ` 定义了一个鼠标离开事件。当鼠标离开时，会发生事件并计算该表达式。\n\n鼠标离开事件通常作用于 div、body 以及特定区域或元素。\n\n### 示例\
  \ 5.5\n```html\n<!doctype html>\n<html>\n<head>\n<script src=\"js\\angular.min.js\"\
  ></script>\n</head>\n<body ng-app=\"\">\n<br><br>\n<textarea ng-mousemove=\"count\
  \ = count + 1\" ng-init=\"count=0\">\nHere is a textarea\n</textarea>\n<br><br>\n\
  <h2>count: {{count}}</h2>\n</body>\n</html>\n```\n（假设鼠标离开 textarea 区域了 10 次。）\n\n\
  输出：\n| Here is a textarea. |\ncount: 10\n\n解析：\n`ng-mousemove=\"count = count +\
  \ 1\"`：当鼠标在 textarea 上移动时，`count` 增加 1。\n`ng-init=\"count=0\"` 将 `count` 的值初始化为\
  \ 0。\n`{{count}}` 显示 `count` 的值。\n`count : 10` 表示鼠标移动了 10 次。\n\n### 按键释放事件 (Key\
  \ Up event)\n| ng-keyup = “expression” |\n\n`ng-keyup = “expression\"` 定义了一个按键释放事件。当按键释放时，会发生事件并计算该表达式。\n\
  \n按键释放事件通常作用于文本框和文本区域。\n\n### 示例 5.6\n```html\n<!doctype html>\n<html>\n<head>\n\
  <script src=\"js\\angular.min.js\"></script>\n</head>\n<body ng-app=\"\">\n<br><br>\n\
  <textarea ng-keyup=\"count = count + 1\" ng-init=\"count=0\">\nHere is a textarea\n\
  </textarea>\n<br><br>\n<h2>count: {{count}}</h2>\n</body>\n</html>\n```\n（假设你在 textarea\
  \ 中输入了 12345678。）\n\n输出：\n| Here is a textarea.12345678 |\ncount: 8\n\n解析：\n`ng-keyup=\"\
  count = count + 1\"`：当按键在 textarea 上释放时，`count` 增加 1。\n`ng-init=\"count=0\"` 将 `count`\
  \ 的值初始化为 0。\n`{{count}}` 显示 `count` 的值。\n`count : 8` 表示按键释放了 8 次。\n\n### 按键按下事件\
  \ (Key Down event)\n| ng-keydown = “expression” |\n\n`ng-keydown = “expression\"\
  ` 定义了一个按键按下事件。当按键按下时，会发生事件并计算该表达式。\n\n按键按下事件通常作用于文本框和文本区域。\n\n### 示例 5.7\n```html\n\
  <!doctype html>\n<html>\n<head>\n<script src=\"js\\angular.min.js\"></script>\n\
  </head>\n<body ng-app=\"\">\n<br><br>\n<textarea ng-keydown=\"count = count + 1\"\
  \ ng-init=\"count=0\">\nHere is a textarea\n</textarea>\n<br><br>\n<h2>count: {{count}}</h2>\n\
  </body>\n</html>\n```\n（假设你在 textarea 中输入了 123456。）\n\n输出：\n| Here is a textarea.123456\
  \ |\ncount: 6\n\n解析：\n`ng-keydown=\"count = count + 1\"`：当按键在 textarea 上按下时，`count`\
  \ 增加 1。\n`ng-init=\"count=0\"` 将 `count` 的值初始化为 0。\n`{{count}}` 显示 `count` 的值。\n\
  `count : 6` 表示按键按下了 6 次。\n\n### 复制与剪切事件 (Copy & Cut event)\n| ng-copy= \"result1=true\"\
  \ ng-cut= \"result2=true\" |\n\n\n\n\n\n当复制指定的文本时，结果 `1` 将为 `true`。\n\n当剪切指定的文本时，结果\
  \ `2` 将为 `true`。\n\n## 示例 5.8\n\n```html\n<!doctype html> \n<html ng-app> \n<head>\
  \ \n<script src=\"js\\angular.min.js\"></script> \n<meta charset=\"utf-8\"> \n</head>\
  \ \n<<body>\n<br>\n<input ng-copy= \"result1=true\" ng-init= \"result1=false; value1='please\
  \ copy me'\" ng-model= \"value1\" > \ncopy status: {{result1}}</br><br>\n<input\
  \ ng-cut= \"result2=true\" ng-init= \"result2=false; value2='please cut me'\" ng-model=\
  \ \"value2\" > \ncut status: {{result2}} \n</body> \n</</html> \n```\n\n## 输出:\n\
  \n![](img/00032.jpeg)\n\n## 解释:\n\n`ng-copy= \"result1=true\"` : 当复制指定的文本时，结果 `1`\
  \ 将为 `true`。\n\n`ng-cut= \"result2=true\"` : 当剪切指定的文本时，结果 `2` 将为 `true`。\n\n`{{result1}}`\
  \ 将显示 `true` 或 `false`。\n\n`{{result2}}` 将显示 `true` 或 `false`。\n\n## 总结\n\n在本章中，我们学习了不同的事件，如点击事件、双击事件、鼠标移动事件、鼠标移入事件、鼠标离开事件、键盘释放事件和键盘按下事件。\n\
  \n`ng-click` 定义了一个 AngularJS 点击事件。\n\n`ng-dblclick` 定义了一个 AngularJS 双击事件。\n\n`ng-mousemove`\
  \ 定义了一个 AngularJS 鼠标移动事件。\n\n`ng-mouseover` 定义了一个 AngularJS 鼠标移入事件。\n\n`ng-mouseleave`\
  \ 定义了一个 AngularJS 鼠标离开事件。\n\n`ng-keyup` 定义了一个 AngularJS 键盘释放事件。\n\n`ng-keydown`\
  \ 定义了一个 AngularJS 键盘按下事件。\n\n`ng-copy= \"result1=true\"` : 当复制指定的文本时，结果 `1` 将为 `true`。\n\
  \n`ng-cut= \"result2=true\"` : 当剪切指定的文本时，结果 `2` 将为 `true`。\n\n## 动手项目\n\n## 鼠标移入事件\n\
