    a bike trailer, to a set of cardboard dumpsters behind the dollar store and the
    Mark''s Work Wearhouse in our town. Sinclair toddled around as Will climbed into
    the dumpster and frisbe nice good boxes out towards me. We used the cardboard
    to smother the grass paths and heaped it with high wood chips—just sixty-five
    dollars for a local florist, which saved him a trip to the dump.


    I still direct-seed little—it helps the plants to let them grow large in their
    cells in the warmth of the hoop house (built in year two) or the greenhouse (built
    in year three). I grow my basil in five-gallon pots ringed with copper tape, and
    I wrap the tender stalks of my squash, cucumber, and melon seedlings with aluminum
    foil collars when I plant them out to keep them being felled. But I no longer
    go on nightly slug raids or see them in my dreams, my conscience haunting me.


    In this case, the advice I''d been absorbing from hippieish experts panned out:
    the more we built up the soil and transitioned the grass to garden and wood chip
    paths, the less the slugs were a problem.


    But it wasn''t our last pestilence. And not all of them are solvable with habitat
    changes and patience. Some of them—especially as climate change renders each season
    a little weirder, a little less predictable—we just have to'
