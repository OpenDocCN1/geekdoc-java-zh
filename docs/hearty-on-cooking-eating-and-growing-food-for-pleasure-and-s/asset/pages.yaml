    quite related to Queen Anne’s lace, which is also known as wild carrot.


    Carrot seeds, Dan Jason, author of Saving Seeds and owner of Salt Spring Seeds,
    are very easy to harvest. The flower plant sends up in its second year carries
    hundreds of tiny, easily accessible seeds. To collect them, you just need to place
    a paper bag over the flower head and shake until the seeds rain into it.


    > The hard thing is to make sure the seed is pure,” Dan says. The conventional
    wisdom says that if you live within a mile or so of a plant, it’s difficult to
    grow carrots for seed. If you try, they can end up cross-pollinating. In Washington
    State, Queen Anne’s lace is classified as a class B noxious weed, and it’s prohibited
    to sell or transport its seeds. Frankly, there’s no Queen Anne’s lace in the valley
    where his farm is located, and so he’s safe to save carrot seeds.


    The taproots of Queen Anne’s lace, technically edible when they’re very small
    and young, become woody and bitter as the plant matures. If you pick Queen Anne’s
    lace or brush it with your hand, it smells temptingly carrot. But if your carrots
    cross-pollinate, they’ll most likely pick the traits they want in carrots (toughness,
    woodiness, bitterness).


