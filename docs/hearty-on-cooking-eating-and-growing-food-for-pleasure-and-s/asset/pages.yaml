    The second year of the garden, I decided to let one of my overwintered curly kale
    plants, which had done quite well, go to seed. It doubled and then tripled in
    size before developing hundreds of stalks of small yellow flowers. (These were
    popular with bees and other flying insects, so much that in the height of its
    bloom, the plant appeared to audibly hum.) We harvested some of the flowers and
    ate them; others soon turned into long thin pods, which I''d need to get dry out
    on the plant.


    All was going well until it wasn''t. I went out one afternoon to attend to something
    else—watering or weeding, or maybe harvesting some greens or purple sprouting
    broccoli—and realized that, seemingly overnight, the kale plant pods had been
    colonized by thousands of aphids. The plant was also alive with ants, which had
    most likely installed the aphids on the pods in order to farm the liquid they
    secrete, which is called honeydew and which ants love. The result was that the
    kale plant looked almost like coral. To me, it felt like I''d accidentally chosen
    the wrong movie on Netflix and found myself in medias res in some kind of body
    horror. I realized the aphids were everywhere; I even discovered them on Macker''s
    cat grass.


    I''d already begun to reflect on the amount of death I''d met out in order to
    see my fruit and vegetable plants through to harvest, and I had decided that gardening
    and farming, even when done organically with nothing approaching terminator seeds,
    pesticides, or herbicides, was not simply a life-giving act, an uncomplicated
    idyll. This I found almost funny; our garden, which we''d designed to feel like
    a bit of an oasis and which'
