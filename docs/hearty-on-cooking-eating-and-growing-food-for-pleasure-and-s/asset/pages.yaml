    Today, Brits eat more Heinz baked beans than anyone else on the planet. But the
    dish probably emerged from similar First Nations dishes, which were most likely
    made with maple syrup and venison and sometimes were adopted by hungry settlers,
    before being subsumed into industrialized production under Henry John Heinz and
    the H.J. Heinz Company, which began producing tinted beans in 1895 in Pittsburgh.


    Heinz had a trip to England a decade earlier, cold-calling the head of the grocery
    department for Fortnum & Mason of London in 1886. The grocer began carrying Heinz
    items such as bottled horseradish sauce. Tinned beans made it to England in 1899,
    according to one source, and 1901, according to another, initially as a luxury
    import item. In 1928, the company began producing tinted beans in Harlesden, a
    district in northwest London; the price came down, and the product gained popularity.


    It''s unclear when, exactly, the New England-style beans exported from the U.S.
    changed recipes—but eventually the beans were adapted to suit British tastes,
    omitting molasses, maple syrup, and brown sugar for a tomato-based sauce.


    From 1941 to 1948, tinned beans were rationed on the points system in the U.K.
    Coupon rationing covered staples like milk, eggs, butter, bacon, and ham. Points
    rationing was more flexible: each person received a certain number of points to
    use on a variety of essentials, beginning with canned meats, fish, and beans,
    and later extending to things like biscuits, grains, cheeses, dried eggs, and
    dried fruits. This is also when the beans lost their pork and became vegetarian—why
