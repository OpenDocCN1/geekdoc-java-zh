  md: '+   8. Place the crock or mason jars in a cool, dry, dark place—the back of
    a cupboard or in a basement.


    +   9. Check for fermentation on day five. The brine should be cloudy. If you
    shimmy the container back and forth, you should see bubbles come to the top of
    the brine. Fermentation happens more slowly if it''s quite cool in your house.
    I usually leave mine to ferment for another couple days. But if you have a cloudy
    brine and see bubbles, you can choose to move to the next step at five days.


    +   10. Next, set a colander over a large bowl—you want to save the brine. Strain
    the vegetables, and place them into a food processor or blender. Start by adding
    one cup of the brine, and add more later if you''d like a thinner sauce. Blend
    until you reach your desired consistency. I keep mine a bit chunky, like a mash;
    I do this by pulsing the mix in a food processor. But you can also blend until
    it''s fully smooth.


    +   11. Place in squeeze bottles with the tip open, or a jar with a loosened lid,
    and store in the fridge. Fermentation continues after the initial five to seven
    days; leaving the tip open or the lid loosened allows gases to escape. A sealed
    container may explode, in particular if it''s left at room temperature.'
