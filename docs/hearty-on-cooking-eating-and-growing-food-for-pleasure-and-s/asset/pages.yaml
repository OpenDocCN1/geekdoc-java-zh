- img_proc: true
  md: '# Ingredients


    +   * 2 cups heavy cream

    * 1 cup milk

    * 2/3 cup sugar

    * generous pinch of salt

    * 6 egg yolks (save the whites for another use; I often freeze them)

    * 1/4 cup lemon juice

    * 1 cup spruce tips


    1. Place the six egg yolks into a mixing bowl. Whisk them together and set aside.

    2. Whisk the cream, milk, sugar, and salt together in a medium-sized heavy-bottomed
    pot on medium-low heat until the sugar has dissolved and the mixture is beginning
    to emit the tiniest bit of steam.

    3. Take the pot off the heat.

    4. Slowly drizzle about one-third of the hot cream mixture into the egg yolks,
    whisking constantly. The idea is to temper the yolks, which keeps them from scrambling.

    5. Once you''ve added one-third of the cream mixture into the yolks, it''s time
    to add that yolk mixture back into the main pot. Keeping the pot off the heat,
    slowly drizzle the yolk mixture back into the cream mixture, whisking constantly.'
  merge: -1
  pgno: 203
- img_proc: true
  md: '+   6. Place the pot back onto a medium-low heat and gently cook the custard,
    whisking regularly. You’re looking for the custard to come to 170°F (77°C). If
    you don’t have a thermometer, it should be thick enough to coat the back of a
    spoon.


    +   7. Remove the pot from the heat and let it come to room temperature for half
    an hour on the countertop.


    +   8. Meanwhile, wash and dry your spruce tips, and roughly chop them into largeish
    pieces.


    +   9. After half hour, stir the lemon juice and your spruce tips into the custard
    base.


    +   10. Transfer into a bowl and place in the fridge. (Or just place the pot into
    the fridge; we’re not judging.)


    +   11. Allow the spruce tips to infuse into the custard in the fridge for 36
    to 48 hours.


    +   12. Strain the custard through a fine-mesh strainer into a new bowl. It’s
    okay if a few little spruce bits make it through.


    +   13. Churn the ice cream in your ice cream maker, or DIY using a baking pan
    and a whisk.


    +   14. Serve in a cup or cone.


