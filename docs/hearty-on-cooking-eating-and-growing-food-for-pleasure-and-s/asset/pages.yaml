    # Fermented hot sauce


    Adapted from a recipe from *Feasting at Home*


    I’ve mentioned elsewhere in this book that I have chronic gastritis. In addition
    to avoiding gluten, I drink very little alcohol and limit coffee and spicy foods.
    So I usually use poblano peppers or a mix of jalapeno peppers and bell peppers.
    It’s a choose-your-own-spiciness type of hot sauce.


    A note on salt: Sea salt, pickling salt and kosher salt are the best options for
    this recipe. Avoid iodized salt, which might inhibit fermentation. Also avoid
    anything too fancy—it’s just necessary.


    A note on salt: From everything I’ve read, the fermentation window occurs in a
    solution of salt water that contains between 2 percent and 5 percent salt. Anything
    below that and harmful bacteria will grow; anything above gets you above 2 percent.
    An alternative method for figuring out how much salt you need is to place your
    vegetables in your tared fermentation container, cover them with water, and then
    weigh the mixture. Multiply the weight of the vegetables and water by 0.025 to
    get the weight of the salt you’ll need, and you’ll end up with a brine just south
    of 2.5 percent salt.


    # Ingredients


    +   - 1,183 grams (42 ounces) water'
