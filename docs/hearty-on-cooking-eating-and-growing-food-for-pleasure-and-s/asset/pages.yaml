  md: '# andrea’s favourite tomato chutney, from Nana


    A note on canning safety: While improvisation and substitution is generally welcome
    in cooking, it''s important to stick to the ingredients and proportions in recipes
    that are jarred and preserved in a water bath, like this chutney. A pH of 4.6
    or lower is required for safe water bath canning.


    # Tools


    +   - six hot, sterilized 500-millilitre (pint-size) mason jars and fresh canning
    lids

    - knife, cutting board, and peeler

    - large cooking pot

    - water bath canning pot, jar rack, and jar tongs

    - cheesecloth


    # Ingredients


    +   - 24 tomatoes (I used San Marzano/Roma tomatoes)

    - 6 apples, peeled and chopped (I used Gala apples)

    - 5 medium white onions, chopped

    - 1 bunch celery, chopped finely

    - 2 green peppers, chopped'
  merge: -1
  pgno: 47
- img_proc: true
  md: '+   - 2 red peppers, chopped

    - 2 cups white sugar

    - 2 cups white vinegar

    - 1 teaspoon each of cloves, ginger, cinnamon, turmeric, and dried mustard

    - 4 tablespoons mixed pickling spice (tied up in a cheesecloth bundle)

    - 2 teaspoons pickling salt


    +   1. Cut an X into the bottom of the tomatoes and place them into boiling water
    for one minute to remove skins. Then chop into small pieces and place them in
    a colander over a bowl to drain. Chop onions and celery into fine pieces and place
    in the same colander. Sprinkle salt over mixture. Place colander and bowl in the
    fridge to drain overnight.


    +   2. The next day, remove the contents from fridge, and after pressing lightly
    to remove excess fluid, pour the contents of the colander into a large cooking
    pot.


    +   3. Chop green and red peppers and apples into small pieces and add to pot.


    +   4. Stir in the rest of the ingredients, and mix well.


    +   5. Place pot over medium heat until it reaches a gentle boil. Keep stirring
    until it is as thick as you want it—about two hours, the longer the thicker. You
    might have to lower the temperature to keep it at a gentle boil and not a full
    boil.


    +   6. When done, remove the pickling spice bag.'
