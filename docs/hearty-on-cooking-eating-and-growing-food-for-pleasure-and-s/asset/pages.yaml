    The connections I make this way are often small and simple. Sometimes they build
    into something bigger over time, and sometimes they don''t. Sometimes what seems
    like a good idea—making lilac syrup with kids—works out the way it might on a
    television segment, or Pinterest, but more often it''s imperfect, and sometimes
    it completely slides off the rails.


    In these food-centric interactions with friends and loved ones and kids and neighbours,
    there''s space to be experimental and creative while also being nourished and
    practical. It''s all low-stress. We eat things, and we love them or hate them
    or find them fine enough, and then they''re gone. The process of eating several
    times a day helps with this—like an endless ocean of waves breaking on the beach.


    When we eat, cook, and grow food, we are implicated in cycles of birth and germination
    and harvest. In community, in pleasure. For me, it is a way to be grounded and
    connected, to participate directly in life. To nudge free of nuclear family structures
    and seek ones that are more supportive, less capitalistic.


    I feel quite anxious about the world, worrying about climate change and drought
    and soil running out of the fossil fuels that ship our foods and create our fertilizers.
    But when I participate in these life cycles, and connect with others who are working
    to seek solutions to these problems, my anxieties, like my hunger, can be temporarily
    allayed.


    Food has been a big part of my life for decades now, though it hasn''t always
    been charming as lilac lemonade. Starting in my teens, I spent ten years working
    in food service. I worked at an organic bakery; I worked at a'
