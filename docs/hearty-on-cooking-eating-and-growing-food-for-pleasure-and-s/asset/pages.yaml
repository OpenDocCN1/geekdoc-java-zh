  pgno: 220
- img_proc: true
  md: 'bulbing onions, but I can grow peppers and eggplants in my greenhouse, which
    might be trickier for someone who’s not on a sunny plot near a particularly shielded
    patch of the Pacific. That’s what bartering and sharing are for.


    Similarly, I come to gardening hoping it might perhaps solve my life by teaching
    me to understand patience and my place in the world. A tall order. Maybe, for
    someone like me, lifelong lessons stick each year as well as latex paint adheres
    to oil-based paint. But a real lesson I have learned more resolutely, if painfully,
    is that it’s okay to do my best and not be perfect, not annihilate every single
    post. Maybe a percentage of my crops each year will be great and another percentage
    will suffer subpar conditions, resulting in a mediocre harvest. What’s mediocre
    is still edible. Sometimes, for the sake of happiness, excellence isn’t worth
    it. Save the effort of an uprising for political goals; at home, in the garden,
    embrace periodic mediocrity.


    The garden teaches gratefulness through its bounty and through its funges, its
    aphids, its bolted cabbages. Every summer, it provides. It provides carrots and
    potatoes, peppers and garlic, saffron and basil and thyme, tomatoes, broccoli,
    squash, zucchini, cantaloupe, celery, strawberries, blueberries. Even when it
    fails, it provides. Abundance, nourishment; a mediocre crop acting as a foil to
    last year’s, or next year’s, much better crop; sore muscles, warm sun, a cool
    breeze from the ocean. Provision.'
