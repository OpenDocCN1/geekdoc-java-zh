    Different varieties of potatoes have different ideal uses. Waxy varieties, like
    new potatoes (or baby potatoes of any variety) and fingerlings and Norland potatoes,
    are best in recipes where you want the potato to stay together, solid—in salade
    niçoise, in a stew or chunk soup. Medium-starch potatoes, like Yukon Golds and
    Kennebec, are best for scalloped potatoes, potatoes au gratin, and mayonnaise-based
    potato salad, where you want the potato to retain a bit of its shape while allowing
    its cooked exterior to mix with the dairy or mayo to make a creamy, starchy sauce.
    Starchy potatoes, like russets, are best for making French fries and for baking;
    once baked, they can be added to a creamy soup. Either medium starchy or starchy
    can make good mashed potatoes; Alton Brown suggests using a two-to-one ratio of
    starchy to waxed, but it comes down to preference.


    Starchy potatoes become glue if you overmix them, which is why cooks recommend
    using a potato ricer, which reduces a potato uniformly, and with one press, into
    a workable base for salt and butter and milk and sour cream. If you don’t mind—or
    you, like me, prefer—mashed potatoes with some lumps and texture, a masher works
    fine. For a puréed soup like cheesy potato and broccoli, bake or boil the potato
    separately and add it to your soup after you’ve pulled the stock and aromatics
    and broccoli—blenders also make potatoes glue. (On Good Eats, Brown suggests adding
    a slurry of riced baked potato and dairy to soup to achieve a perfect creamy consistency.)


