    霉菌；它能防止果实在接触地面时变软或产生霉斑，并防止蛞牛试着附着在果皮上。


    修剪，或称打侧芽，对于不定生长的番茄，在生长时移除下部叶片，保持它们之间推荐的距离，并用 T 型桩、钢丝、竹竿和棉绳进行支撑，这有助于增加空气流通，防止真菌和病害，并保持一切整洁，这样受感染的植物在传播疾病之前就可以被移除。


    尽管如此，这一切并非万无一失。白粉病最终蔓延，当南瓜藤在10月中旬爬过成熟的终点时，它们看起来没那么活力和健康。有些年份，番茄长得非常好，从7月开始成熟一直持续到11月，至于我们处理它们时感到疲惫，并渴望冬季。其他年份，五月和六月天气炎热，第一批结实的果出现了脐腐病，或者该地区的人都患上了八月或九月的病害，果实需要在绿色时采摘以制腌或在室内成熟。


    我们的季节和微气候也会影响我们院子里的生长良好的植物。我尝试过好几次小白菜，才意识到它在这里注定会抽花——在北纬五十度线附近，早春的光照不足，而到了五月，当白天足够长促进大量生长时，天气又太热了，敏感植物会产生早花梗。（蛞牛也一直在它们身上节食。）当我种出第一批成功的卷心菜品种——theaton（紫色且边缘轻微皱褶）和Charmant（肉质、光滑且绿色的）时，我感到欣喜若狂。这两个品种都不适合做泡菜（这正是我对小白菜想要的），但它们可以做其他菜，更重要的是，它们能在花园里生长。


    去年是西兰花平平的一年，但对黄瓜来说是极好的一年，我我忙不过来收割，并送出了几十个，包括在用光了朋友和邻居后，捐送给了当地的一个食品安全项目。当我3月开始准备今年的种苗，并准备今年的菜床和花园基础设施时，我们还在吃着去年夏秋季处理并冷冻的农产品。


    这感觉有点混乱，但与其说是各种因素复杂的跳舞，不如说是其中一些——如浇水和覆盖——是我控制的，而另一些——如温度、湿度和虫媒疾病——是我无法控制的。事实是，我是一个完美主义者，但没有
    Will 那种坚定的耐心。园艺教会了我延迟满足的快乐，它也教会了我接受有些事情超出了我的影响范围，而有些事情只要 Will 愿意照料我们的果果树、柑橘树和灌木，我就永远无法将它们*置入*我的影响范围。


    Will 有有一份无穷无尽的任务清单，这是一份常青的清单，有着更大时间尺度上的节奏。例如，为了让我们盆里的柑橘树开心，他必须每两三年将它们取出，修剪根部，并放入新鲜土壤。这必须在树木休眠时进行。他经常在一年中的某个时候做这件事，那时我因收获而精疲，待在花园的时间还没玩《星露谷物语》多。在室内，重要的是抑制任何出现的昆虫，而不仅仅是管理它们——果蝇的侵害对我们来说和对榕或咖啡植物来说同样令人讨厌。


    在外的蔬菜园里，我的一年生和二年生植物的时间尺度更加集中。它们生长、结果、死亡。要杀死每一个影响植物的昆虫是不理智的。只要我们还能收获足够的番茄做酱，收获足够的胡萝卜维持供应，与蛞牛、蚜虫甚至甘心菜蛾共处就并不是世界末日。


    我的植物看起来不像我最喜欢的无耕作园艺师 Charles Dowding 种得那么完美。我转过头感觉才过了五分钟，爬行的黄毛地锦和旋花就冲破了我的菜床并生了根，干扰了我的胡萝卜，或缠绕着我的芥蓝。我忘记了移除西兰花或羽衣甘蓝变黄的下部叶片，我本该早点收获的。邻居的橡树整个冬天都在掉落橡果，我在豌豆、豆类和草莓床里发现了它们的幼苗。我觉得一颗卷心菜看起来很美，很完美，准备好发
    Instagram 了；我摘掉外叶，发现一只蛞牛钻了进去咬掉了一个大洞，留下了它黏糊糊的泄物作为额外的惊喜。


    但说真的，这没关系。我的农产品有时不完美没关系。它们仍然可用，即使它们在超市里无法出售，或者不被那些供应我 CSA 盒蔬菜的农民认为有价值。我亲手种它们，从种子到种苗再到植物到收获（有时又回到种子），这一事实让我更投入于挽救它们。我更有可能使用植物的部位，比如西兰花叶，这些是可以食用的但商店通常不卖。为什么要浪费免费的蔬菜呢？


    有些年份我喜欢的品种买不到，而买得到的以及我种的，结果都不如理想。例如，适应我们较短生长季节的杂交品种 Halona 瓜，生长比其他类型的哈甜瓜快，后者成熟得太久了。在新冠疫情高峰期间，Halona
    种子买不到；我10月种的另一种品种，味道糟糕得惨死。


    花园提供了定制的教训。我们大多数人的目标都是同一个——种食物——使用相似的工具：种子、土壤。除此，我们特定的微气候、地形的坡度、周围的动植物都意味着我们面对着略有不同的谜题，并被赋予略有不同的机会。我种不了小白菜，我不喜欢洋葱，但我可以在温室里种辣椒和茄子，这对于一个不在阳光充足的太平洋地区的人来说可能更棘手。这就是以物易物的的意义。


    我来园艺是希望它或许能解决我的生活，教我理解耐心以及我在世界上的位置。这是一个很高的要求。也许对于像我这样的人来说，一生的教训每年都像乳胶漆附着在油性漆上一样牢固。但我学得更坚决、尽管很痛苦的真实教训是：尽力而为且不需要消灭每一个环节没关系。也许每年有一比例的作物会很棒，另一比例会遭受次优的条件，导致平平的收获。平平的也仍然食用。


    ## 花园


    花园通过它的丰收、它的真菌、它的蚜虫、它的抽花的卷心菜教会我们感激。夏天，它都会提供。它提供胡萝卜和土豆、辣椒和大蒜、藏红、罗勒和百香、番茄、南瓜、西芦、哈密瓜、西芹、草莓、蓝莓。即使它失败了，它依然提供。丰富，营养；平平的作物作为去年，或明年更好收获的对比；酸痛的肌肉，温暖的阳光，来自海洋的凉风。供给。


