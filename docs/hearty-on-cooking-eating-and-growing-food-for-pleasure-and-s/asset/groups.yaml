    # give us this day our daily beans


    On Saturday mornings when I was a kid, my mother was usually at work, and my father
    was responsible for making sure we were clothed, fed, and washed. If you met my
    gregarious father, he might tell you he''s great at making a stir-fry, or perhaps
    that he drinks a smoothie every day. I suspect he''s stretching the truth; the
    last time I stayed at his apartment, nosily discovered a film of dust on the blender
    and extra-nosily rooted through his pantry, finding a packet of gravy mix that
    expired two decades ago.


    When he met my brother and me train-watching (exactly what it sounds like), he
    bought McDonald''s and let us free in the botanical gardens close to the bridge
    where he most liked to see trains chug by so he could record their reporting numbers
    in a little book.


    On days when there were Premier League soccer games featuring Manchester United,
    breakfast was usually beans on toast. on toast; most often Heinz Original Beans
    in Tomato Sauce, without pork, on with pork, and sometimes the ones in molasses.
    A more frequent substitute was store-brand baked beans in tomato sauce, which
    were much cheaper. I remember them going for forty-nine cents at a No Frills in
    the late ''90s and early 2000s. (They’re $1.19 as I write this in late January
    2023.)


    My dad likes his with Worcestershire sauce and other adulterations. I like mine
    the way they come in the can. My brother doesn’t really like them at all, and
    often opted for cereal. My dad would heat up two cans in an oblong plastic Tupperware
    in the microwave, toasting six pieces of bread.'
  - '[PAGE 179]


    One and a half cans and four slices for him; two slices and a half can for me.
    I disliked margarine, which was what we had at our house, so I had mine on plain
    toasted bread, letting the beans soak in until the bread had softened by the sauce.
    Today, my household contains salted butter; even better, the bean sauce mixes
    with the butter and becomes a little richer.


    In my younger, poorer, not cooking for my family years, I ate beans on toast with
    some carrot sticks on the side anywhere from once to four times a week. I still
    eat them today—on toast and incorporated into the very humble vegetarian shepherd''s
    pie I developed (recipe on page 125).


    Full of fibre and protein, they are a cheap, easy meal; if I was asked, on a TV
    show like Top Chef, to make my “comfort food,” baked beans are the food I would
    think of before coming up with something I actually serve to the judges. (Could
    I serve beans? I can make a convincing homemade dupe, but it takes hours longer
    than the twenty minutes cooks are usually allotted for these challenges.) I might
    be the last person in my family who eats them regularly; Will and Sinclair don’t
    like them, and my brother never did.


    I’ve taken their existence for granted my whole life. It’s only in considering
    their familial demise that I become curious about their history and the way they
    became a cultural touchstone for us.


    The story of how baked beans became iconic in the U.K., like iconic British things
    (tea! chutney!), begins elsewhere. Navy beans—a small white bean and a variety
    of Phaseolus vulgaris, which includes other common beans like pintos, green beans,
    black beans, and kidney beans, but not soybeans (Glycine max) or scarlet runners
    (Phaseolus coccineus)—are used to make them. Phaseolus vulgaris is native to what’s
    currently known as the'
  - '[PAGE 180]


    Americas and was first domesticated over five centuries ago; the bean had developed
    into many different varieties and traditionally grown alongside corn and squash
    in many cultures, before colonizers stepped foot here. Europeans had favas and
    chickpeas and lentils pretty early, but it wasn''t until the sixteenth century
    that they got the common bean.


    Today, Brits eat more Heinz baked beans than anyone else on the planet. But the
    dish probably emerged from similar First Nations dishes, which were most likely
    made with maple syrup and venison and sometimes were adopted by hungry settlers,
    before being subsumed into industrialized production under Henry John Heinz and
    the H.J. Heinz Company, which began producing tinted beans in 1895 in Pittsburgh.


    Heinz had a trip to England a decade earlier, cold-calling the head of the grocery
    department for Fortnum & Mason of London in 1886. The grocer began carrying Heinz
    items such as bottled horseradish sauce. Tinned beans made it to England in 1899,
    according to one source, and 1901, according to another, initially as a luxury
    import item. In 1928, the company began producing tinted beans in Harlesden, a
    district in northwest London; the price came down, and the product gained popularity.


    It''s unclear when, exactly, the New England-style beans exported from the U.S.
    changed recipes—but eventually the beans were adapted to suit British tastes,
    omitting molasses, maple syrup, and brown sugar for a tomato-based sauce.


    From 1941 to 1948, tinned beans were rationed on the points system in the U.K.
    Coupon rationing covered staples like milk, eggs, butter, bacon, and ham. Points
    rationing was more flexible: each person received a certain number of points to
    use on a variety of essentials, beginning with canned meats, fish, and beans,
    and later extending to things like biscuits, grains, cheeses, dried eggs, and
    dried fruits. This is also when the beans lost their pork and became vegetarian—why
    waste extra points?'
  - '[PAGE 181]


    Tinned beans ranged in value from three—eight points from the time point system
    rationing was introduced in 1941 (four points per pound) to 1944 (three points
    per pound) to 1947 (eight points per pound) to 1948 (six points per pound). The
    number of points citizens were allotted over the course of the rationing period—starting
    with sixteen in 1941, later rising to twenty-four, and then back down to twenty.
    (When I ask my Grandma Garcia if she remembers beans being rationed, she says
    no. She was only three in 1941, she reminds me.)


    Today, Heinz Beanz—the U.K. version—are made in a factory in Wigan, in Greater
    Manchester, that claims the title of largest food processing plant in North America.
    The beans used to make them are still imported from Europe. And the tomatoes for
    the sauce are mostly grown in Spain and Portugal. The beans are checked for quality
    and then blanched for rehydration purposes, the actual cooking process occurs
    after they''re sealed into the can with the tomatoes and spices. The cans themselves
    are cooked in high-pressure steam.


    Learning about the history of baked beans makes me wish I liked the ones with
    maple syrup or even pork. I could spin this off into an exploration of “authenticity”
    in food, but the truth is that authenticity is complicated and messy, and many
    foods and recipes are pluralized in a way that is authentic. It''s important to
    understand relationships of power and colonialism, the movement of different foods
    and food cultures through history. But ultimately, tinned beans in tomato sauce
    are the more familiar to me; they''re my comfort food, even if they''re a Frankenfood,
    a sloppy-looking hodgepodge of tan and brown that left this place for England
    only to come back again.'
  - '[PAGE 182]


    A further complication is that my Canadian taste buds aren’t actually accustomed
    to Heinz Beanz. No, like many things with complicated colonial histories—spellings
    in English, for example—the Canadian beans I eat are a bit of a North American—British
    hybrid.


    To explore this, I walk up to my local Save-On-Foods and buy two tins of Heinz
    beans in tomato sauce. The first comes from the British imports section: a turquoise
    tin reading “Heinz Beanz” on sale for $3.99 (or $3.49 if you have a Save-On card).
    On the other side of the aisle, for $2.49 (card price $1.89) are the Canadian
    beans in tomato sauce—my personal standard-bearer. Also in a turquoise tin, but
    reading “Heinz Beans Original.”


    At home, I open the tins (pop top for the U.K. beans, can opener for the (Canadian))
    and arm myself with a fork. The U.K. version tastes more tomatoey, and there’s
    more definition between the beans and the sauce. The Canadian beans are noticeably
    sweeter, less tomatoey, and just the faintest mushier—like the bean starch has
    leached into the sauce a little more readily.


    The U.K. ingredient list: beans (51 percent), tomatoes (34 percent), water, sugar,
    spirit vinegar, modified cornflour, salt, spice extracts, herb extract.


    The Canadian: water, white beans, tomato purée, sugar, salt, calcium chloride,
    spice, mustard, onion powder, garlic powder.


    In the U.K., the “spice mix” is apparently a closely guarded secret. In Canada—for
    allergy reasons?—we’re willing to admit it contains mustard, onion, and garlic.
    I’m convinced I taste a hint of cloves, so I google and find cloves included,
    alongside Worcestershire sauce, in a number of dupe recipes.


    My taste test confirms that I prefer the sweeter Canadian version. It also makes
    me reflect on the specific place these beans hold as a staple—mainly'
- md: '

    because after I have a few forkfuls, I need to decide on how we''ll eat the remainder
    of the tins.


    These days, we mostly eat dried beans. The pandemic solidified my movement towards
    dry goods and a full, stocked pantry, inspiring me to bulk-order twenty-five-kilo
    sacks of pintos and black beans. The pintos I cook simply, incorporating sautéed
    garlic, onions, carrot, and green pepper and serving them over rice or polenta,
    with sour cream and salsa and homemade fermented hot sauce. The black beans, we
    use in anything from veggie burgers (the trick is to lay the cooked beans out
    on a baking sheet and dry them out a bit before incorporating them into the other
    ingredients for the burger) to soup to enchiladas. I use the Crock-Pot method,
    which sometimes calls, on the bean, for soaking and boiling for a short period
    before slowly cooking over the course of the day, the lid rocking gently on the
    porcelain when it reaches its highest heat, the house filling with the smell of
    stewed beans.


    I cook favas, kidney beans, black-eyed peas, scarlet runners—anything going. And
    I love these beans. But I usually plan to make them the night before, setting
    up the dry ingredients in the Crock-Pot and sautéing any precooked elements when
    I make that night''s dinner. They serve one function, and tinned beans serve another.


    Because as a processed food, tinned beans are a cure-all for being both out of
    money and time. They are—still!—what I make when I''m hungry and tired and penny-pinching,
    in search of something that will take five minutes to prepare and still satisfy
    and sati me. They are a cultural hangover from my dad''s side of the family, both
    of our recent roots in England and a reminder of times when food insecurity was
    pressing for us, when we worked too much for little money. But a reminder, too,
    of the calmer pockets of my childhood, slow mornings with my dad, and the power
    of finding comfort where we can.


    ## a taste for finery


    Do you remember the first time you cut open a cantaloupe? I was sixteen and working
    at my best friend’s father’s produce store, which had a salad bar. My mother and
    her father were having an affair at the time, and while we worked at the store,
    they were drinking together at a nearby bar. My best friend’s chipper Christian
    uncle worked at the store, as well as her grandmother Jean, who did not eat until
    dinner, subsisting on cigarettes and four-cream extra-large coffees from Tim Hortons.
    The store is closed now, and Jean is dead, so it’s safe to tell you that she smoked
    in the kitchen.


    Jean, who was generous and kind but also deeply grumpy, learned many of my first
    cooking lessons. I already worked prep at Tim Hortons, which at the time still
    made doughnuts in-house; I didn’t make the doughnuts, but I peeled and chopped
    apples for the fritters, made strawberry tarts, and whipped cream cheese blocks
    in a giant industrial mixer to soften and aerate them before portioning them into
    individual cups for the sandwich station.


    Mostly, Jean told us what needed to be done to refill the salad bar. Her recipes
    lived in a binder and were detailed and clear, sometimes with additional notes
    in the margin, in a spiny hand (Jean’s) or a very near semi-cursive (chipper uncle’s).
    But Jean sometimes dropped in a bit of additional information, like the beginning
    of a verbal crumb trail. It was from her, for example, that I learned to boil
    potatoes for potato salad skin-on. Their peels crack and come off easily afterwards—and
    you have to peel them while they’re warm, in fact as hot as you can bear to handle,
    so that the outer layer of the potato blends effectively with the mayo in the
    dressing.


    Jean was most likely there when I cut open my first-ever cantaloupe, and I would
    have hidden my surprise at discovering it was not in fact a solid mass of orange
    inside but had a large cavity that contained ribs of seeds. She would have shown
    me, rather than describing in words, how to scoop out those seeds and slice the
    cantaloupes into moons and chunks. Small enough to fit in one’s mouth, but the
    less surface area, the better—they keep longer that way.


    Before I brought the cantaloupe out to the salad bar, I ate a piece. Because the
    salad bar was in a produce store, the melons we used for it were usually overripe.
    The cantaloupe was fragrant and sweet, a bit floral. More complex than watermelon,
    which I had eaten before, and a very different texture. At the Tim Hortons, we
    could eat Timbits for free, but that grew old. Snacking on Jean’s salad bar offerings
    as I prepared them did not. Her potato salad was perfect, salty and tangy with
    the crunch of celery and green onions. Her pasta salad used chicken stock in the
    otherwise straightforward dressing. Everyone (except me, I never tried them) loved
    their deviled eggs, and she had very clear instructions on how to cook them in
    order to avoid a green-grey ring around the outside of the yolk. (Making devilled
    eggs also marked the first time I used a pastry bag, which required a certain
    finesse and was incidentally the way you found out if you’d gotten the consistency
    of the filling.)


    But free access to cantaloupe was for the far best thing about working at the
    store. Each one tasted a bit different. Every single fruit offered a lesson about
    how to understand the signs of underripeness, ripeness, overripeness. An overripe
    cantaloupe tasted a bit like Sharpe. Not pleasant, but curious, and not entirely
    unpleasant. Unripe cantaloupes were firmer and tasted like more than entirely
    agave-sweetened fibre water. The best cantaloupes were the Ontario-grown ones
    we got in the summer, because they were picked closer to ripeness, and their flavour
    and texture were complex and tender, something like malted honey transmuted into
    melon.


    I started working at the salad bar because I wanted to spend more time with my
    best friend—and because I don''t have a personality suited for public-facing roles
    in entry-level jobs, such as retail. What kept me working in kitchens, though,
    was the food. We didn''t make anything upscale for the salad bar, just the kinds
    of things you''d find at a blue-collar catered lunch for someone''s retirement,
    or a stag or do someone might hold in the community room of the local hockey arena.
    But by working there, I got to access new tastes, new textures, new experiences
    I wouldn''t have otherwise. It made me want more.


    For chef, activist, and author Joshua Maharaj, culinary school offered a different
    type of lesson—namely, that there was an expectation that, as a student from an
    Indian family whose house “was the house where everybody came, and it was just
    big pots of Indian food to feed everybody,” would have the edges off her flavour
    profiles to satisfy what her instructors wanted to see as she made dishes like
    homemade mac and cheese and pie.


    When I ask Maharaj if she has any memories that stand out, she immediately recalls
    a spoonful of olive oil that she had in Italy. “I had been told here by Italian
    friends that the measure of good olive oil was something you could drink a spoonful,”
    she says. And then she went to Tuscany and taste-tested in an olive grove. “I
    was a different person after that,” she says. The same thing happened with tomatoes,
    she says. Jean, who was generous and kind but also deeply grumpy, learned many
    of my first cooking lessons. [Wait, the text seems to loop or overlap, correcting
    for flow based on the provided segments].


    “It changed everything,” Maharaj says. The Italians and the French, she adds,
    are no jokes when it comes to their food. They expect adherence to high standards.
    It shows up through the whole system, she says, and they are able to maintain
    those standards because, unlike in North America, everyone in that system, from
    the people growing the food to the people cooking and serving it, are valued.
    When I started working in late 1990s, minimum wage for students under eighteen
    was $6.40 in Ontario. For everyone else, $6.85. One job paid me $5 an hour under
    the table. A couple of the places I worked a little more; those jobs emerged through
    word of mouth.


    Two decades later, when wages look higher on paper, they’re paltry in comparison
    to other industries and the current cost of living. The average wage in Canada
    in 2021, today’s dollars, is $30.67 and cooks often de an hour in transportation
    and warehousing, $29.94. In educational services, $36.70. In agriculture, $20.78.


    In accommodation and food services, the average wage is $17.34.


    Meanwhile, in 2021, the living wage rate in Vancouver was $20.52 an hour; by 2023,
    it had increased to $25.68 an hour.


    The hours for culinary work can be grueling, and cooks often don''t receive the
    rests and meal breaks they’re legally entitled to. Kitchens are hot and moist,
    and cuts and burns are frequent. For people who like food and cooking, and care
    about their jobs, the satisfaction comes from serving meals that taste good and
    satiate your customers. To this end, cooks train their palates and noses to pick
    up the small details—to tell the difference between nice vanilla extract and crappy
    extract, to balance the sweetness in a soup depending on the sweetness of the
    carrots that arrived.

