    At dinner, I whipped some of the 36 percent cream with sugar, added some vanilla
    extract, dolloped it on top of the custard, and smoothed it out. Then I added
    blackberries.


    It was perfect. The sponge stood up well, and this time around, I had been generous
    enough with the sherry. The proportions were correct; the custard was delicious.
    The blackberries were nice and tart, and nothing was too sweet.


    It tasted exactly like what I’d expect from Grandma Garcia’s trifle, and I felt
    like I’d learned a new magic trick. The only step remaining is to take everything
    I’ve learned a few thousand kilometres east, so I can make it for her. Only then
    will I really learn how she feels about my version and the idea that I’ll be carrying
    it on.'
