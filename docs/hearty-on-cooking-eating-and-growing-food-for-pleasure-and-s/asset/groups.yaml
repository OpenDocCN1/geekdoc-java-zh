    because after I have a few forkfuls, I need to decide on how we''ll eat the remainder
    of the tins.


    These days, we mostly eat dried beans. The pandemic solidified my movement towards
    dry goods and a full, stocked pantry, inspiring me to bulk-order twenty-five-kilo
    sacks of pintos and black beans. The pintos I cook simply, incorporating sautéed
    garlic, onions, carrot, and green pepper and serving them over rice or polenta,
    with sour cream and salsa and homemade fermented hot sauce. The black beans, we
    use in anything from veggie burgers (the trick is to lay the cooked beans out
    on a baking sheet and dry them out a bit before incorporating them into the other
    ingredients for the burger) to soup to enchiladas. I use the Crock-Pot method,
    which sometimes calls, on the bean, for soaking and boiling for a short period
    before slowly cooking over the course of the day, the lid rocking gently on the
    porcelain when it reaches its highest heat, the house filling with the smell of
    stewed beans.


    I cook favas, kidney beans, black-eyed peas, scarlet runners—anything going. And
    I love these beans. But I usually plan to make them the night before, setting
    up the dry ingredients in the Crock-Pot and sautéing any precooked elements when
    I make that night''s dinner. They serve one function, and tinned beans serve another.


    Because as a processed food, tinned beans are a cure-all for being both out of
    money and time. They are—still!—what I make when I''m hungry and tired and penny-pinching,
    in search of something that will take five minutes to prepare and still satisfy
    and sati me. They are a cultural hangover from my dad''s side of the family, both
    of our recent roots in England and a reminder of times when food insecurity was
    pressing for us, when we worked too much for little money. But a reminder, too,
    of the calmer pockets of my childhood, slow mornings with my dad, and the power
    of finding comfort where we can.'
  - '[PAGE 184]


    # a taste for finery


    Do you remember the first time you cut open a cantaloupe? I was sixteen and working
    at my best friend’s father’s produce store, which had a salad bar. My mother and
    her father were having an affair at the time, and while we worked at the store,
    they were drinking together at a nearby bar. My best friend’s chipper Christian
    uncle worked at the store, as well as her grandmother Jean, who did not eat until
    dinner, subsisting on cigarettes and four-cream extra-large coffees from Tim Hortons.
    The store is closed now, and Jean is dead, so it’s safe to tell you that she smoked
    in the kitchen.


    Jean, who was generous and kind but also deeply grumpy, learned many of my first
    cooking lessons. I already worked prep at Tim Hortons, which at the time still
    made doughnuts in-house; I didn’t make the doughnuts, but I peeled and chopped
    apples for the fritters, made strawberry tarts, and whipped cream cheese blocks
    in a giant industrial mixer to soften and aerate them before portioning them into
    individual cups for the sandwich station.


    Mostly, Jean told us what needed to be done to refill the salad bar. Her recipes
    lived in a binder and were detailed and clear, sometimes with additional notes
    in the margin, in a spiny hand (Jean’s) or a very near semi-cursive (chipper uncle’s).
    But Jean sometimes dropped in a bit of additional information, like the beginning
    of a verbal crumb trail. It was from her, for example, that I learned to boil
    potatoes for potato salad skin-on. Their peels crack and come off easily afterwards—and
    you have to peel them while they’re warm, in fact as hot as you can bear to handle,
    so that'
  - '[PAGE 185]


    the outer layer of the potato blends effectively with the mayo in the dressing.


    Jean was most likely there when I cut open my first-ever cantaloupe, and I would
    have hidden my surprise at discovering it was not in fact a solid mass of orange
    inside but had a large cavity that contained ribs of seeds. She would have shown
    me, rather than describing in words, how to scoop out those seeds and slice the
    cantaloupes into moons and chunks. Small enough to fit in one’s mouth, but the
    less surface area, the better—they keep longer that way.


    Before I brought the cantaloupe out to the salad bar, I ate a piece. Because the
    salad bar was in a produce store, the melons we used for it were usually overripe.
    The cantaloupe was fragrant and sweet, a bit floral. More complex than watermelon,
    which I had eaten before, and a very different texture. At the Tim Hortons, we
    could eat Timbits for free, but that grew old. Snacking on Jean’s salad bar offerings
    as I prepared them did not. Her potato salad was perfect, salty and tangy with
    the crunch of celery and green onions. Her pasta salad used chicken stock in the
    otherwise straightforward dressing. Everyone (except me, I never tried them) loved
    their deviled eggs, and she had very clear instructions on how to cook them in
    order to avoid a green-grey ring around the outside of the yolk. (Making devilled
    eggs also marked the first time I used a pastry bag, which required a certain
    finesse and was incidentally the way you found out if you’d gotten the consistency
    of the filling.)


    But free access to cantaloupe was for the far best thing about working at the
    store. Each one tasted a bit different. Every single fruit offered a lesson about
    how to understand the signs of underripeness, ripeness, overripeness. An overripe
    cantaloupe tasted a bit like Sharpe. Not pleasant, but curious, and not entirely
    unpleasant. Unripe cantaloupes were firmer and tasted like more than entirely
    agave-sweetened fibre water. The best cantaloupes were the'
  - '[PAGE 186]


    Ontario-grown ones we got in the summer, because they were picked closer to ripeness,
    and their flavour and texture were complex and tender, something like malted honey
    transmuted into melon.


    I started working at the salad bar because I wanted to spend more time with my
    best friend—and because I don''t have a personality suited for public-facing roles
    in entry-level jobs, such as retail. What kept me working in kitchens, though,
    was the food. We didn''t make anything upscale for the salad bar, just the kinds
    of things you''d find at a blue-collar catered lunch for someone''s retirement,
    or a stag or do someone might hold in the community room of the local hockey arena.
    But by working there, I got to access new tastes, new textures, new experiences
    I wouldn''t have otherwise. It made me want more.


    For chef, activist, and author Joshua Maharaj, culinary school offered a different
    type of lesson—namely, that there was an expectation that, as a student from an
    Indian family whose house “was the house where everybody came, and it was just
    big pots of Indian food to feed everybody,” would have the edges off her flavour
    profiles to satisfy what her instructors wanted to see as she made dishes like
    homemade mac and cheese and pie.


    When I ask Maharaj if she has any memories that stand out to her, of something
    she wouldn''t necessarily have if she didn''t work in food, she immediately recalls
    a spoonful of olive oil that she had in Italy. “I had been told here by Italian
    friends that the measure of good olive oil was something you could drink a spoonful
    of,” she says. “And I had never tasted anything there that I was happy to drink
    a spoonful of.” And then she went to Tuscany and taste-tested in an olive grove.
    “I was a different person after that,” she says. The same thing happened with
    tomatoes, she says.'
  - '[PAGE 187]


    “It changed everything,” Maharaj says. The Italians and the French, she adds,
    are no jokes when it comes to their food. They expect adherence to high standards.


    It shows up through the whole system, she says, and they are able to maintain
    those standards because, unlike in North America, everyone in that system, from
    the people growing the food to the people cooking and serving it, are valued.


    This contrasts pretty harshly with the way most culinary workers are deeply undervalued
    in Canada and across North America. When I started working in the late 1990s,
    minimum wage for students under eighteen was $6.40 in Ontario. For everyone else,
    $6.85. One job paid me $5 an hour under the table. A couple of the places I worked
    a little bit more; those jobs emerged through word of mouth.


    Two decades later, when wages look higher on paper, they’re paltry in comparison
    to other industries and the current cost of living. The average wage in Canada
    in 2021, today’s dollars, is $30.67 and cooks often-de an hour in transportation
    and warehousing, $29.94. In educational services, $36.70. In agriculture, $20.78.


    In accommodation and food services, the average wage is $17.34.


    Meanwhile, in 2021, the living wage rate in Vancouver was $20.52 an hour; by 2023,
    it had increased to $25.68 an hour.


    The hours for culinary work can be grueling, and cooks often don’t receive the
    rests and meal breaks they’re legally entitled to. Kitchens are hot and moist,
    and cuts and burns are frequent. For people who like food and cooking, and care
    about their jobs, the satisfaction comes from serving meals that taste good and
    satiate your customers. To this end, cooks train their palates and noses to pick
    up the small details—to tell the difference between nice vanilla extract and crappy
    extract, to balance the sweetness in a soup depending on the sweetness of the
    carrots that arrived'
- md: '

    in that week’s produce order. They learn how to manipulate and understand things
    like heat. Through a lot of repetition and practice, they learn knife skills,
    consistency, and how things are supposed to feel as they stir them and they tear,
    or sear and they release.


    Whatever affinity for food cooks enter a kitchen with, they increase assiduously
    in service of others. But most workers are paid so poorly that their jobs do not
    allow them to afford a meal at the very place they labour. At a mid-scale mom
    and pop restaurant where I live, pad Thai and a Diet Coke, with tax and tip, costs
    $23.49—one hour and twenty-one minutes of kitchen work paid at the average of
    $17.35 an hour. At a higher-end steakhouse in Vancouver, steak au poivre and a
    glass of pinot noir, with tax and tip, runs you $119.91—six hours and fifty-five
    minutes of kitchen work.


    Growing up, most of the food my parents made was inexpensive, basic, quick to
    prepare, and aligned with my class status: peanut butter and banana on toast,
    frozen ravioli casserole, tuna casserole made with canned cream of mushroom soup,
    ham and scalloped potatoes, pasta sauce heated in a plastic measuring cup in the
    microwave and dolloped onto plain boiled noodles. Tim Hortons before early morning
    hockey practice. McDonald’s on special occasions, or maybe a buffet if your grandparents
    were treating.


    As a teen working in food service, I learned how to make Jean’s salads and gained
    some knife skills; later, I learned to cook brunch, make a good soup, bake bread,
    make yogurt, mix and fry pakoras, bake date squares and butter tarts, mandolin
    radishes so they look like vellum. To make demi-glace, to nail the technique for
    Swiss meringue buttercream, because American buttercream is too sweet and tastes
    of anti-caking agent. To grow my own San Marzano tomatoes and use them to make
    Marcella Hazan’s can’t-be-improved-upon four-ingredient tomato sauce, which calls
    only for tomatoes, butter, onion, and salt.


    In other words, working in kitchens led me to develop tastes I had no business
    developing. Even today, I dress like a person who balks at Value Village’s recent
    price increases; I eat like a tenured humanities professor who purchased a home
    in Vancouver in 1994. I will not indent myself to buy a car. I will indent myself
    to buy one hundred grams each of three of the semi-soft, raw milk, organic French
    cheeses the cheese shop carries so that I can compare them to see how they differ
    and decide which one I prefer. I will indent myself when the stand mixer or enamelled
    cast iron pot I’ve been coveting goes on sale. I will fry my own gluten-free doughnuts
    because doughnuts are best fresh and warm. I will buy myself a water-sealed fermentation
    crock for my birthday so I can easily make fermented sauces and kimchi at home.
    When I visit the city, I will make a special trip to the specialty store in order
    to restock my favourite brand of smoked paprika. And when I watch the brands and
    real estate and interior design shows on Netflix and HGTV—Sunset, Dream Home Makeover,
    Love It or List It—or see nice kitchens in Architectural Digest, I will not covet
    their views or their custom sofas, but I will believe I deserve the kitchens rich
    people think deserve.


    It’s not that food has to be expensive to be good. Or that it’s impossible to
    make great food using humble tools. But fundamentally why should the person responsible
    for making something delicious not to get it? If it is my skill and palate creating
    the meal, I deserve to be able to eat that meal. And the people who will best
    use of kitchen tools are the ones deserving of owning them. Wealthy people get
    easy access to expensive food and tools; some of those wealthy people seek out
    that food and tools because they like to eat and cook. But some seek out that
    food and tools as markers of their wealth, cycling through cuisines as if a well-built
    mixer, or an entire country’s food culture, can go off-trend. And so to me, it’s
    only fair that the working-class aesthetics and gluttons and farm workers driving
    those consumers’ choices with their labour and creativity receive access too.
    Preferably by raising their wages and increasing access to affordable housing.
    But at minimum, ensuring workers get a chance to sit for fifteen minutes in order
    to eat their own breakfast or lunch or dinner.


    After I moved out and before I graduated and began working an ill-suited communications
    job, the free meal I ate at whatever kitchen job I was working was sometimes the
    only substantial food I ate that day. In 2004, Ontario’s minimum wage increased
    to $7.15 an hour; by 2007, it reached $8. The push, at that time, was a $10 minimum
    wage—achieved far later than it was needed, with inflation outpacing wage gains.
    I spent these years in poverty, calculating in my head how many shift hours it
    would take to earn enough to pay rent, pay my bills, buy groceries. This sometimes
    led to a sense of futility: if I couldn’t afford to replace my shoes, worn out
    from being on my feet for so many hours, I as well spend what I’d earned that
    day on post-work beers at the Jimmy Jazz (still open) and a vegan burrito at the
    Salsaateria (now closed, RIP). I thought I was terrible with money; when a friend
    who paid their tuition using a line of credit chose to pursue bankruptcy, I realized
    we were all just very underpaid.


    Working in kitchens changed my relationship to food and my access to it, broadening
    my palate and allowing me to explore techniques, ingredients, and methods I wouldn’t
    have been exposed to otherwise.

