    That night, right after work, I start my sixth attempt. I decide on using the
    Swiss technique, which involves cooking the aquafaba with granulated sugar before
    whipping it into a meringue. I find the recipe on a blog called Project Vegan
    run a London-based vegan named Tom. The macarons pictured on the blog are quite
    textured in the shell, and the recipe contains no food coloring, they’re natural.
    But the recipe catches my eye for its precision, offering in grams for the amount
    I should cook my aquafaba and sugar down to. I do a bit of back-of-the-napkin
    math to figure out what weight plus half will equal.


    The other variable that has been keeping me up at night is my oven temperature.
    Something has felt off. The shells I pipe following Tom’s recipe are thick, thicker
    than this, and he suggests leaving them to rest for an hour. While they rest,
    I calibrate my oven with a thermometer. When the oven display reads 250, the thermometer
    reads about 295. My oven has been betraying me. Setting it at 225 or 230, I discover
    gets me closer to 250. Normally I would feel frustrated. But I find myself hopeful
    instead: better control of my oven temperature might lead to better results.


