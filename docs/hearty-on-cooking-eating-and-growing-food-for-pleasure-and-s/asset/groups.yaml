    summer, started second-year university courses, and discovered that cognitive
    behaviour therapy and group therapy were not going to work for me, I searched
    for jobs. Specifically for jobs in food service, working in the kitchen. I knew
    a kitchen was a place I could work while I was not fit to be seen by the public.
    And That’s when I found Curry.'
  - '[PAGE 91]


    As long as I showed up, worked my shifts, and fulfilled my duties, I would get
    my cheque and pay my rent and buy my groceries—even as I was having my blood taken
    regularly to measure its level of lithium. And even as I was still regularly hallucinating—hearing
    voices and seeing birds indoors, in places they could not have been.


    Much has been written and said about how kitchens are unsafe places for women
    and queer people and racialized people, shot through with cruelty and harassment—in
    particular if the kitchen follows the strict hierarchical structure of fine dining,
    adopted from the French tradition. Kitchens also underpay workers, compounding
    that underpayment with wage and tip theft. But like many things in life, it’s
    more complex than that. Kitchens, they’re always hiring (so it’s easy to leave
    and go elsewhere), no one gives a shit what you look like, and if you are battling
    some personal demons, you’re generally not alone. In fact, if you’re used to dysfunction,
    they can feel very much like a second home.


    One night it was snowing. Curry was very slow, takeout orders only, and my partner
    created an entire board game designed to help us get drunk. He called it the Spins
    Family Board Game. One square required us to throw frozen peas into a red solo
    cup from across the room, taking a shot for every pea that missed the cup. Another
    had us turn in circles, our foreheads pressed to a baseball bat. Every time a
    delivery driver or customer came to pick up an order, we were temporarily quiet.
    After they left, we resumed the game.'
  - '[PAGE 92]


    Sometimes at Curry, I joined in when everyone drank, and sometimes I went home
    alone and studied. And sometimes I was uptight, short-tempered with my friends
    for drinking so much, when really the problem was that I wanted to be surrounded
    by sobriety but didn''t know how to seek it. Innocent and a bit naive, according
    to Tim. And often the voice of reason, though everyone ignored me.


    The night of the Spins Family Board Game, I got as drunk as anyone. I spilled
    curry all over my off-brand Crocs and ran them through the dishwasher at the end
    of the night with the slip-resistant commercial kitchen mats. I don''t remember
    leaving work or going upstairs to sleep. I remember feeling woozy and finding
    it funny—it was the essence of his charm—that my partner named the game so presciently.
    In retrospect, it marked a turning point, a night when things had gone a bit too
    off the rails, inebriation seeping too late into theหน่อย. This would become something
    my partner would lean into, and something I''d break from, afraid of losing any
    more control over my life.


    But we really did feel like family. Tim was like my wild yet protective older
    brother. My co-worker Ali, whose favourite line when training people was “There
    is no right way,” was also a bit like an older sibling. Or maybe a twin I loved
    even though one of us had emerged wound tighter than a cake made with no leaving
    and the other as relaxed as high-hydration ciabatta. We were stuck together, close
    and sometimes resentful. Usually caring, sometimes enabling. Spinning, but spinning
    together.


    After writing the first draft of this essay, I wondered if my friends had known
    that I had been emotionally in the nadir of my life, that they had formed part
    of the small web of relationships that kept me afloat. After a long period of
    procrastination—I felt anxious about reaching out—I asked them.'
  - '[PAGE 93]


    Tim told me that food service had offered him a lot of the same things it offered
    me. “I could maintain a job through my mental health issues and addictions,” he
    told me. “Not starting until eleven a.m. can make doing drugs until sunrise a
    reality.”


    Ali was the parent of one when we finally reconnected on the phone for the first
    time. It was a busy afternoon, and our conversation was very soon interrupted
    by the arrival of a delivery at her tree nursery job. And then by the time we
    talked again, she was the parent of two. I got the sense from Ali—and Tim told
    me directly—that when they reflect on our time together at they feel some shame,
    alongside love and care.


    Tim put it better than I could, texting, “I felt safe and seen when we were all
    out together.”


    It’s reassuring that Tim feels a similar mix of emotions as I feel. I tell him
    about my concept friend Sigal developed, something called “scarf of absolution.”
    Someone waves it for you, I tell him, and you’re absolved. Maybe we can all wave
    it for each other.


    The complicating factor for all of this is that I can''t get back in touch with
    everyone I''d like to; I’ll never know exactly what this time felt like for them,
    or how they see it now. One of the people I was really close to doesn''t have
    an internet presence anymore, and I''m not sure what it fell off the radar. Another,
    I reach out to a few times when I stumble across his profile on Facebook—but I
    don''t hear back. A mutual friend tells me he went to rehab. Maybe me popping
    up is like poking a bruise. Maybe it provokes too much anxiety. Maybe I hurt him
    somehow, in a way I don''t remember in the haze of time. Maybe the same things
    that kept me afloat pulled him under. I''m not sure, and it''s unfair to guess.'
