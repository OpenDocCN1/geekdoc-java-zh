    [content]

    pretty slowly, towards the farm, turning down its bumpy, rutted lane as my heart
    rate begins to return to normal.


    On the lot at the east end of King Avenue, there is a little farm stand, with
    some parking. Up behind it, the fallow meadow. The lot at the north ends the old
    farmhouse, where Ron Berezan, a certified permaculture teacher who runs the farms,
    the farm lane leads north past an herb garden and beehives on the left, the wash
    station and cold storage on the right, and at the end of the lot, a meadow and
    three-quarters of an acre of U-pick blueberries on the left and a two-acre market
    garden on the right. The farm supports a CSA box program and supplies vegetables
    to the community through the farm store and a couple of locally owned grocery
    stores. It also draws people: cohousing members, volunteers like me, and kids
    from the local school, visiting with their teachers.


    I did not start volunteering out of the goodness of my heart, or even a desire
    to contribute to community food security. I started volunteering halfway through
    the season, one week into July, after I threw a potted bell pepper plant out my
    greenhouse door and onto the driveway, where it shattered.


    The peppers, which were initially growing, had developed soft spots—maybe blossom
    from overwatering, maybe anthracnose, a fungus that thrives in warm, moist conditions.
    I''d been in content with how the peppers were growing, and the season''s early
    heat we were in line to get a large crop. The soft spots found me at a mental
    health nadir, and they felt like the last straw; my snap peas had powdery mildew;
    my container-planted tomatoes, even the cherry tomatoes, had blossom rot; my eggplants
    had a spider mite infestation; and cabbage moths had deforested my purple sprouting
    seedlings—twice.


    I took the soft spots personally. The peppers had failed because I was a failure.
    Someone who''d had beginner''s luck the first couple seasons would now need to
    contend with reality. A person who’d built the entirety of their self-worth on
    their accomplishments and was now accomplishing nothing other than a waste of
    soil and time. In that moment of overwhelming frustration, temporary self-hatred,
    a wave of anger I couldn’t quell, I swore and lobbed the pepper plant.


    In the aftermath—apologizing to my bewildered child and partner and cat, sweeping
    the soil, rinsing and recycling the shards of plastic—I realized I couldn’t continue
    the ways things. That same day, I joined an online peer support group for bipolar
    people, and I emailed Ron Berean at Blueberry Commons. When that, I joined the
    bipolar support group. Two weeks later, I was volunteering on the farm. Both acts
    were in service of two questions: What would it take to get better? What would
    it take to not it so personally when my crops failed?


    “I am ready for spring but not the passage of time,” I’d written in my garden
    diary earlier that year. And: “my desire for it to be March for gardening-related
    reasons is heavily compartmentalized from my desire to stop Pac-Man chomping through
    all the days and months as I’m trying to live them during this godforsaken pandemic.”


    Initially, gardening offered me a way to ground my natural tendencies towards
    anxiety and depression by allowing me to align myself with the rhythms of the
    seasons, of plants and insects and soil and rain and sun and weather. Growing
    plants from seed and supporting them as they grew and cooking with their fruits
    felt literally transformative.


    In my third year, this was intermittently true and not true. Sometimes tending
    the garden felt like a gift; other times, it felt like another chore on a long
    list of daily, never-ending chores. A box to check or, worse, a task that further
    sapped my depleted energy and willpower.


    When I texted my friend Nola about the failures of my garden, she told me to complain
    away. “It’s very disheartening,” she wrote back. “If it helps, know every farmer
    at every scale has had that experience. Some years, you grow more knowledge. Some
    years, more food.”


    Nola shared a story: one year, a permaculture gardener wanted to visit her tea
    garden. The gardener knew Nola used to be a permaculture designer, so she felt
    it needed to be good—but everything was a pile of weeds and some of the plants
    were really struggling. Nola told her friend not to come. When the friend pressed
    her, she confessed to the state of her garden. “You’d be surprised what four hours
    of work side by side with a friend can accomplish,” Nola’s friend told her. “It
    made an incredible difference,” Nola told me. “On the land and in my head.”


    Bill Mollison, who coined the term permaculture, defines it “the conscious design
    and maintenance of agriculturally productive systems which have the diversity,
    stability, and resilience of natural ecosystems.” His definition also folds in
    people and community: permaculture is “the harmonious integration of the landscape
    with people, providing their food, energy, shelter, and other material and non-material
    needs in a sustainable way.” “Non-material” comes at the end of a rather long
    and practical list, but it’s a significant inclusion: we truly nourish us spiritually
    and bolster the connective tissues of our communities.


    It’s not really sustainable, or a reflection of a well-functioning ecosystem,
    to approach a garden so individually, as if it is a report card. I learned much
    about what I was practising from watching YouTube videos and consulting agricultural
    extension materials created by American universities. This education was invaluable,
    as was the connection I felt directly with the plants and insects and soil in
    my garden. But at a certain point, what had felt intimate began to feel isolating.
    I realized I needed to broaden my connections—to learn from others and bolster
    my participation in community, in person. I wanted to see what mitigation techniques
    other organic growers were using to ward off pests and diseases. I needed to see
    how other people were surviving and thriving.


