    There is no universal viewer, no universal witness to appetite. There are only
    people making the food they themselves enjoy and sharing it with us. And then
    there is the filter—the way culture reflects what it imagines to be our desires.


    When our viewing choices are more democratized through platforms like YouTube
    and TikTok and Instagram, the math changes. (Even though the algorithms still
    prioritize white creators.)


    The ecosystem of creation on these platforms is more diverse than what you find
    on TV in a variety of ways: more women of colour, more trans cooks, more non-tokenizing
    and creative approaches to food. (Food Network’s Pioneer Woman, going into its
