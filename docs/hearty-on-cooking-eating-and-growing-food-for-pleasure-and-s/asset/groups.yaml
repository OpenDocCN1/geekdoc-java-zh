    concerned about animal welfare, then the best way to seek change is at the systems
    level. It would be great if everyone took the bus, but if the bus isn''t accessible,
    doesn''t run where you need it to go, and costs too much, readership won''t go
    up. The fixes are easier for transit. What might they look like food?


    When I cook, I make hearty food. For subsistence, just as importantly, for pleasure.
    To keep myself alive and enrich my life. My goal was to approach these essays
    from the same place I approach gardening, harvesting, and cooking—with curiosity,
    with optimism, and community. What you find is much, if any, admonition about
    the consumption of beef or high-fructose corn syrup. No recommendation to eat
    food, not too much, mostly plants. Instead, I hope that sharing some of what I''ve
    been thinking about as I research and write might be a way to extend the conversations
    I''ve been having with friends and family. And so, in the pages ahead, I''ll combine
    journalism, cookery, and horticulture in order to study the personal and cultural,
    aiming to understand where we''re coming from and where we could go next.


    Eating is one of the most important things humans do on a daily basis. Our eating
    habits are shaped by personal and global forces long before we’re born, even as
    what we eat now is shaping the future. I think the best way to change our food
    systems is to tap into the pleasure we derive from eating in a way that meets
    us where we are but eat a heap of broccoli instead of a box of Kraft Dinner, because
    when we can access greens and roast them with oil and salt, they’re delicious.


    ## Illness and appetite


    “Vegetarians are the enemy of everything good and decent, an affront to all I
    stand for, the pure enjoyment of food.”—Anthony Bourdain, Kitchen Confidential


    When Anthony Bourdain speaks disdainfully of vegetarians in Kitchen Confidential,
    writing that they are a persistent irritant to any chef, it feels deeply short-sighted.
    “Life without veal stock, pork fat, sausage, organ meat, demi-glace or even stinky
    cheese,” he continues, “is a life not worth living. He will accommodate vegetarians,”
    he writes, if he has a few slices of grilled eggplant and zucchini.


    There is a lot to like Bourdain’s approach to eating and cooking signals that
    vegetables are so dull they should be an afterthought, but rather when vegetables
    are treated as an afterthought, they become dull. When chefs scorn people like
    me—people who opt not to eat meat, people who have other dietary restrictions,
    like gluten or dairy or nuts—the kitchen finds us irritating. I think about what
    experiences we miss out on because constraints can be the basis of creativity.
    Beans and grains and fruits and vegetables are worthy of the same thoughtful treatment
    with which chefs prepare everything else. Why, at least in mainstream North America,
    is pleasure treated as the providence of meat? And why is writing about vegetarianism
    so often aligned with a weird sort of health and environmental purity culture?
    I have little desire to proselytize about food, which is so often what offers
    in books that make the case for eating vegetables. I have absolutely no desire—working
    at Adbusters as a plump person extinguished it completely—to hear how ignorant
    fat people eating McDonald’s are the root of all the world’s ills.


    Where are all the bestselling essay collections obsessed with tomatoes and seaweed
    and ginger and white beans and butter and herbs?


    When I was nine, I stopped eating red meat. My most constant friend was my cat,
    a domestic shorthair named Cinnamon whose warm brown undercoat shimmered in the
    sunlight under his soft black fur. Cinnamon, who feared my unpredictable mother
    as much as I did, sought me out when I was upset. He slept on my bed, curled up
    on my lap, purred in something close to sympathy.


    Until we got Cinnamon, I hadn’t spent much time considering the farm-to-slaughterhouse-to-grocery-store
    relationship between animals and meat. We fished, but I didn’t know who hunted;
    no one brought venison to our house. Looking at Cinnamon one day he flipped a
    switch: there was no real difference, other than our personal connection, between
    him and any given cow or pig.


    Red meat must have been a compromise with my parents; it may even have been palatable
    to my image-obsessed mother, considering that I was a chubby child in the low-fat
    ’90s. But then at twelve, I stopped eating chicken and fish too. My mother, who
    generally fed us, viewed this as mutiny. So I learned how to cook.


    There are many ways to find pleasure in vegetarian food. You can extract it, through
    techniques like braising and infusing and using rich blends of herbs and spices.
    You can keep things simple; add a chiffon of mint to grilled peach and ricotta
    toast at the height of summer. You can spend heaps of money on fancy cheese, or
    much less on beans and pulses and alliums, or meet in the middle—buying a few
    things like parmesan and avocados to round out cheaper meals. Where you live and
    what''s easily available to you, of course, plays a role in determining this;
    it might be easier to grow avocados than broccoli, eggplants than carrots.


    What I learned to cook in the ''90s in white suburban Ontario, with no computer
    and no cable TV, were stir-fries and curries. Both were basically pan-Asian, and
    I relied on prepared sauces—Patak''s and storebrand jars. I had to trace the journey
    of lettuce from seed to home in B.C., mull over my family history of heart disease
    while volunteering at a local farm. To make food good, it was necessary to balance
    salt and sweet, fat and acid. Mushrooms, which we only ate raw in salad which
    I thought had the texture of peanuts, became one of my favourite foods when cooked
    in butter in an uncrowded skillet. Ripe pineapple, not from the can, was another
    revelation.

