    In the nineteenth century and earlier, the working classes, in particular farmers
    and farm labourers, or ploughmen, would have woken up, laboured for a few hours,
    and paused around eleven a.m. for sustenance, Collingham says. This meal would
    have consisted of a hunk of bread and often a raw onion and, if financially feasible,
    some cheese. Cheese was considered the labour’s “white meat”—the consumption of
    meat wasn’t necessarily daily, perhaps confined to a Sunday roast. So the practice
    of eating chutney as part of this meal followed directly in the footsteps of eating
    meat with pungent condiments, and it was probably related to the practice of augmenting
    the meal with raw onion. When pickle became accessible to the working classes,
    it was added to the meal.


    Peter Atkins, professor emeritus at Durham University with a specialization in
    the geographies of food and drink, traces a slightly earlier cousin of the pickle
    in the ploughman’s lunch. “I think it really began with anchovy sauce at the end
    of the nineteenth century in London,” he says. “That was really, I think, the
    first and most popular addition to the British diet, based upon Italian anchovies.”
    The beginning of the nineteenth century, Atkins says, marked the beginning of
    the various pickles. Their method of preservation relied on sugar—which had entered
    England much earlier, part of the triangular trade, with its own legacy of enslavement
    and colonialism—and vinegar. Unlike the vinegar on the continent, which was made
    using wine (hence vinegar, “vin aig” or “sour wine”), Atkins says the Brits used
    beer as the basis of their vinegar. Called malt vinegar, it often relies on fermented
    barley and is still in use today.


    In an article entitled “Vinegar and Sugar: The Early History of Factory-Made Jams,
    Pickles, and Sauces in Britain,” Atkins traces the appearance of industrial-scale
    packaged goods preserved in sugar and vinegar in the late eighteenth and early
    nineteenth century, through companies like E. Lazenby'
  - '[PAGE 55]


    & Son, Batty & Co., John Burgess and Son, and, notably, Crosse & Blackwell, which
    was one of the earliest, largest, and most successful manufacturers of pickles,
    table sauces, and other related products. In the midnineteenth century, Atkins
    writes, Crosse & Blackwell bypassed wholesale markets like the Covent Garden Market
    and purchased the product they needed for their goods directly from farmers, whom
    they contracted. They also brewed their own vinegar—vertical integration. On our
    call, Atkins describes the company as “ruthless.” The company grew throughout
    the early nineteenth century; by the 1860s, Atkins describes their output as “industrial”
    in scale. Crosse & Blackwell exported its goods to Australia, China, and India
    and advertised “extensively” in newspapers and magazines in Britain in the nineteenth
    century, reaching the middle classes and making the brand a household name. By
    the time the company began manufacture Branston Pickle in 1922, it had honed tactics
    tactics; used inexpensive, plentiful ingredients and advertised broadly to stir
    up familiarity and the emotion—domestic bliss, nationalism, nostalgia.


    When I ask him why he thinks Branston Pickle became so ubiquitous, Atkins confesses
    that he doesn’t like it. “I think it’s mainly the advertising,” he says. “It was
    a very profitable product.”


    (After our interview, Atkins sends me the conference presentation his article
    was based on. It opens with a 1950 quote from an Italian man named Alberto Denti
    di Piragno: “The British are . . . ‘incable of giving any flavour to the food,
    [they] call on sauces to serve to their dishes which their dishes do not have.
    This explains the sauces, the jellies and prepared extracts, the bottled sauces,
    the chutneys, which populate the tables of this unfortunate people.” He was a
    fascist during the Second World War, Atkins tells me. “So I’m not sure I believe
    anything he says, I quoted it because it’s a really nice indication of what other
    people think of the British diet.)”'
  - '[PAGE 56]


    Echoing what Colingham told me, Atkin guesses pickles and chutneys

    would’t have been able to enter the working-class diet until after the

    working classes began to benefit from “improved purchasing ability” in the

    1850s onwards, but markedly in the 1870s.


    “They were being paid better wages,” Atkins says.\And the food that

    they wanted to buy was relatively in price. The reason being—let’s

    take bread for instance—because of the importation of wheat from Canada

    and America and various other places, with lower production costs in the

    Canadian prairies. It could be exported more cheaply. The flour was

    cheaper. and therefore the bread was cheaper.”


    Wheat became more economical to import after the demise of the Corn

    Laws (which had attempted to favour domestic agriculture by placing tariffs

    stap staple grains like wheat and corn) in 1846. At first, it came mostly from

    t U.S.; by the late nineteenth and early twentieth century, it was coming

    mostly from Canada, which by 1910 was the world’s largest wheat exporter.


    Canada was able to achieve success in wheat exports because of the

    construction of the Canadian Pacific Railway, which allowed for relatively

    cheap transport of wheat across the country from the prairies. Both the

    railway and the “clearing” of the plains for agriculture were violent colonial

    undertakings.


    In other words: every element of the ploughman’s lunch—and my

    cheese and chutney sandwiches—are bound up in class, in history, in

    politics, in food systems, in empire. But this doesn’t quite answer

    where my nana’s chutney came from.


    There are hundreds of different kinds of regional chutneys and pickles eaten

    across India and South Asia. Some are sweet, some are spicy, some are'
  - '[PAGE 57]


    cooling agents; some add interest and moisture to a meal heavier on rice or idli
    or dosa. Some palate cleansers. Many were initially developed to use parts of
    plants, such as cauliflower leaves, that are nutritionally significant but require
    more treatment and attention to become delicious.


    It could be tempting to dismiss the British approaches to chutney as pale comparisons
    of the originals. Or to say British people are just eating chutneys wrong—or,
    culturally appropriating them. If that''s true, would it be possible to decolonize
    a British chutney?


    Simon Majumdar, a British-born broadcaster, and author of Welsh and Indian descent
    who regularly enjoys on Food Network shows, including my favourite, *Iron Chef*,
    he says he doesn''t think so. In his 2011 book *Eating for Britain*, he called
    chicken tikka masala, which was most likely developed in Glasgow by a man who''d
    immigrated from Pakistan as a way to appeal to British palates, “British as fish
    and chips.” But he drew the line at trying chicken tikka masala lasagna, a featured
    special at a pub. “I''d probably try it now,” Majumdar says “I mean, there''s
    a certain point where you might say, ‘Let''s stop.’


    “Looking at your recipe,” he says, “you have red peppers and green peppers. Red
    peppers and green peppers come from Latin America. So where does that come from?
    You''ve got all this mixture to create this thing called pickle. And the term
    ‘pickle’ comes from a German term, and from there a Norse term,” he says.


    The more food history he learns, Majumdar tells me, the more he lets go of authenticity.


    When it comes to British and Indian cuisines, Majumdar points out that it''s been
    a long relationship. The first Indian restaurant to open in Britain was the Hindoostane
    Coffee House in London in 1809 or 1810.


    And it''s a bidirectional relationship too. “Go and look up Indian sandwiches,”
    Majumdar says. “If you go to Delhi, they have something'
  - '[PAGE 58]


    called a pav bhaji, which is a bread roll filled with this tomato dal. There’s
    a whole range of different types of sandwiches. They all have some pickles in
    them or some cheese in them, which wasn’t really a part of Indian cuisine apart
    from paneer cheese they use for things like saag paneer. They’ll put some pickles
    on top, which could be a tomato pickle or a green chutney, or whatever. And they’ll
    usually toast them. There are dozens, if not hundreds, of Indian sandwiches now
    have been there for, I’m guessing, probably around a hundred years.” The idea
    of these sandwiches most likely came back to India with the British, Majumdar
    says. They’re delicious. And neither side can quite claim them, but the hundred
    years seems long enough to call them “authentic.”


    Or perhaps that term is somewhat futile anyway. “I’ve stopped thinking about authenticity,”
    Majumdar says. “What I am thinking about now is ‘Am just enjoying it?’ And that’s
    how I think about any food I’m going to write about now. How am I enjoying it?
    And then from that, I’ll start off where it comes from.”


    Tomatoes, like peppers, are their own particular artifact of colonial movement
    and adoption and adaptation. In Indian Food: A Historical Companion, food historian
    K.T. Achaya writes “there seems to be no record of when the tomato came to India.”
    Thought to have originated in Mexico or Peru, he continues, it seems most likely
    that the tomato arrived in India by way of England in the late eighteenth century
    and was first cultivated to feed the foreign palates of the English, before eventually
    being adopted into sou curries by Bengalis and Burmans the following century.


    Collingham describes a Bengali chutney she frequently makes at home: you heat
    a pinch of panch phoron, which consists of cumin seeds, nigella'
- md: '

    seeds, fennel seeds, wild celery seeds, and fenugreek seeds, in hot oil, and then
    you add minced ginger and garlic. After a few seconds, you add dried hot chilies.
    And then chopped tomatoes, some sugar and salt, cover, and let it cook down. At
    the end, she says, you add a big green chili or two, just so the spice comes out,
    and then we add some dried mango, so it reconstitutes, adding sweetness to the
    chutney. “That is just an absolutely wonderful chutney,” she says. And a pretty
    standard Bengali fresh chutney.


    In Britain, Collingham says, a pickle could be described as vegetables in a clear
    vinegar sauce; a chutney would be a bit messy, with everything incorporated and
    less distinguishable. They’d both use vinegar, unlike the vast majority of Indian
    chutneys, relishes, and pickles.


    My nana’s chutney is pretty dissimilar to most South Asian tomato chutney recipes
    I find online, other than the tomatoes and the use of spices such as turmeric
    and cloves. It doesn’t bloom its spices; it treats the tomatoes overnight with
    salt, uses vinegar, uses bell peppers rather than chilis. But it bucks British
    pickle trends, too, by using white sugar and white vinegar, alongside more familiar
    English pickle staples like tomatoes, apples, onions, and mustard.


    It may not taste like Bengali tomato chutney, but it also tastes very unlike Branston
    Pickle, which is made using barley malt vinegar, sugar, apple pulp, tomato purée,
    date paste, and “vegetables in various proportions”—namely those that grow easily
    in the U.K. and have been around for a while: carrots, rutabaga, onions, and cauliflower.


    In a Spectator article that makes a case for Branston Pickle as a national treasure,
    Aimee Kote writes, “There is something pleasing about its ugliness: brown and
    lumpy. A rebuke to Instagram. The unassuming appearance makes its delightful flavour
    all the more surprising: the vinegary tang, the gentle spice, the sweet fruitiness,
    all in perfect balance.” (He also writes that Branston Pickle, which is a bit
    reminiscent of Bengali date and tomato chutney or Rajasthani sweet and sour lemon
    pickle, “has the hallmarks of Empire.))


    To me, Branston Pickle tastes sweet in the way that molasses or treacle tastes
    sweet—with a profound sass, and umami, note. I don’t like it.


    When I first became curious about where my nana might have gotten her recipe,
    research led me to a type of chutney popular on the East Coast of Canada and in
    the southern United States. Called chow or chow chow (maybe after “choux,” French
    for cabbage), some recipes for this chutney, maybe more aptly called a sweet relish,
    overlap quite a bit with my nana’s. One recipe, billed as Southern Chow and claiming
    regional coverage from Kentucky to Florida, says it “takes you a step back in
    time to Granny’s kitchen.” It uses white vinegar and sugar and similar spices
    to my nana’s and includes onion and green and red peppers. But it omits pickles,
    contains green tomatoes instead of twenty-four tomatoes, and uses six cups of
    shredded cabbage, a vegetable that never came within a metre of my nana’s chutney.


    Collingham suggests a different origin. She wonders if my nana’s chutney made
    was adapted from another popular—but not quite as enduring as Branston Pickle—British
    chutney called piccalilli. “Instinctively,” she says, “my sense is that it’s probably
    coming out of both traditions. The desire to have sharp condiments with roast
    meat, which is a very old kind of Anglo desire. And the actual pickling spice
    profile sounds like a tomato version of piccalilli. The spice profile could have
    been influenced by Indian spices.


    It sounds very similar, she says, to piccalilli recipes from the 1920s in sources
    like Good Housekeeping. When she was growing up in the 1970s, her granny might
    have made piccalilli. But she hasn’t seen it at the stores or anyone’s kitchens
    for a while. (Incidentally, when Atkins confines a dislike for Branston Pickle,
    he tells me he does like, and makes annually using vegetables from his garden,
    a mustard-forward variation of piccalilli.)


    And it''s possible that my nana made a tomato variation wherever we grow tomatoes,
    we seek ways to preserve the summer glut of them, Collingham says.


    As I end research, I still don''t have an answer. This is a field, Atkins tells
    me, that hasn''t been terribly well researched yet. (Fleetingly, I consider the
    prospect of doing a food history PhD.) Though I don''t have a variety of possibilities
    and lineages to consider. It''s possible my nana ate piccalilli in England, brought
    a recipe over, and adapted it. It''s possible my nana carried with her, like my
    dad''s family did, the idea of eating cheese and chutney, was introduced to chow
    chow, and adapted that recipe based on what my grandfather grew in his garden
    and what they liked to eat. It''s possible her recipe came from her mother. It''s
    possible it came from a family she nannied for when she first came to Canada.
    It''s possible she cribbed it from a magazine, either in the U.K. or in Canada.
    It''s possible she saw it in on the back of a bottle of vinegar. Who knows.


    Ultimately, I''m okay with this uncertainty. And now I''m curious if my nana would
    have stopped making this chutney if I hadn''t had such a voracious appetite for
    it. Which makes me a bit funny: as an unwitting working-class settler born in
    the 1980s in Canada, it''s possible my affection for my grandmother and her chutney
    kept this condiment, with tangled colonial roots, alive.


