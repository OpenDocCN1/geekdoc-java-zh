    concerned about animal welfare, then the best way to seek change is at the systems
    level. It would be great if everyone took the bus, but if the bus isn''t accessible,
    doesn''t run where you need it to go, and costs too much, readership won''t go
    up. The fixes are easier for transit. What might they look like food?


    When I cook, I make hearty food. For subsistence, just as importantly, for pleasure.
    To keep myself alive and enrich my life. My goal was to approach these essays
    from the same place I approach gardening, harvesting, and cooking—with curiosity,
    with optimism, and in community.


    What you find is much, if any, admonition about the consumption of beef or high-fructose
    corn syrup. No recommendation to eat food, not too much, mostly plants.


    Instead, I hope that sharing some of what I''ve been thinking about as I research
    and write and live and make lilac lemonade might be a way to extend the conversations
    I''ve been having with friends and family and cooks and farmers.


    And so, in the pages ahead, I''ll combine journalism, cookery, and horticulture
    in order to study the local and the systemic, the personal and the cultural, aiming
    to understand where we''re coming from and where we could next head. I''ll figure
    out why my grandfather''s carrots tasted so different from the cello-packed supermarket
    version, trace the journey of lettuce from seed to my home in B.C., mull over
    my family history of heart disease while making ice cream with berries and herbs
    from my yard, and try to heal myself from perfectionism while volunteering at
    a local farm.'
