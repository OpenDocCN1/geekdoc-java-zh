    # illness and appetite


    > “Vegetarians are the enemy of everything good and decent in

    the human spirit, an affront to all I stand for, the pure

    enjoyment of food.”


    —Anthony Bourdain, Kitchen Confidential


    When Anthony Bourdain speaks disdainfully of vegetarians in Kitchen

    Confidential, writing that they are “a persistent irritant to any chef worth a

    damn,” it feels deeply short-sighted. “Life without veal stock, pork fat,

    sausage, organ meat, demi-glace or even stinky cheese,” he continues, “is a

    life not worth living.” “He will accommodate vegetarians, he writes, if he has

    to—“fourteen dollars for a few slices of grilled eggplant and zucchini suits

    my food cost fine.


    There is a lot to like Bourdain’s approach to eating and cooking

    d the culture of kitchens. But his approach to feeding vegetarians signals

    less that vegetables are so dull they should be an afterthought, but rather

    that when vegetables are treated as an afterthought, they become dull.


    When chefs scorn people like me—people who opt not to eat much

    meat, people who have other dietary restrictions, like gluten or dairy or nuts

    —I think about what experiences we miss out on because someone in the

    kitchen finds us it irritating. And I think about the extent to which constraints

    can be the basis of creativity.


    Beans and grains and fruits and vegetables are worthy of the same

    thoughtful treatment with which chefs prepare everything else. Why, at least'
  - '[PAGE 13]


    in mainstream North America, is pleasure treated as the providence of meat?


    And why is writing about vegetarianism so often aligned with a weird sort of health
    and environmental purity culture? I have little desire to proselytize about food,
    which is so often what''s offer in books that make the case for eating vegetables.
    I have absolutely no desire—working at Adbusters as a plump person extinguished
    it completely—to hear about how ignorant fat people eating McDonald’s are the
    root of all the world’s ills.


    Where are all the bestselling essay collections obsessed with tomatoes and seaweed
    and ginger and white beans and butter and herbs?


    When I was nine, I stopped eating red meat. My most constant friend was my cat,
    a domestic shorthair named Cinnamon whose warm brown undercoat shimmered in the
    sunlight under his soft black fur. Cinnamon, who feared my unpredictable mother
    as much as I did, sought me out when I was upset. He slept on my bed, curled up
    on my lap, purred in something close to sympathy.


    Until we got Cinnamon, I hadn’t spent much time considering the farm-to-slaughterhouse-to-grocery-store
    relationship between animals and meat. We fished, but I didn’t know who hunted;
    no one brought venison to our house. Looking at Cinnamon one day he flipped a
    switch: there was no real difference, other than our personal connection, between
    him and any given cow or pig.


    Red meat must have been a compromise with my parents; it may even have been palatable
    to my image-obsessed mother, considering that I was a chubby child in the low-fat
    ’90s. But then at twelve, I stopped eating'
  - '[PAGE 14]


    chicken and fish too. My mother, who generally fed us, viewed this as mutiny.


    So I learned how to cook.


    There are many ways to find pleasure in vegetarian food. You can extract it, through
    techniques like braising and infusing and using rich blends of herbs and spices.
    You can keep things simple; add a chiffon of mint to grilled peach and ricotta
    toast at the height of summer. You can spend heaps of money on fancy cheese, or
    much less on beans and pulses and alliums, or meet in the middle—buying a few
    things like parmesan and avocados to round out cheaper meals. Where you live and
    what''s easily available to you, of course, plays a role in determining this;
    it might be easier to grow avocados than broccoli, eggplants than carrots.


    What I learned to cook in the ''90s in white suburban Ontario, with no computer
    and no cable TV, were stir-fries and curries. Both were basically pan-Asian, and
    I relied on prepared sauces—Patak''s and storebrand jars of teriyaki shaped like
    salad dressings. Instead of choosing a few complementary vegetables for any given
    dish, I added a small amount of everything I had in the fridge. Undsalted, timed
    things poorly, burned my rice, cut my carrots into too-thick coins and overcooked
    them. I had to use a small duck knife for everything. I ate a lot of canned soup
    and beans on toast.


    Then I started working in kitchens—prep at Tim Hortons, the salad bar at my best
    friend''s father''s produce store. These kitchens had large knives, sharp peelers;
    I quickly learned that there was an order in which one did things. That salad
    dressing needed far more oil than I''d initially thought. To make food taste good,
    it was necessary to balance salt and sweet'
  - '[PAGE 15]


    fat and acid. Mushrooms, which we only ate raw in salad at home and which I thought
    had the texture of packing peanuts, became one of my favourite-ever foods when
    cooked in butter in an uncrowded skillet.


    Ripe pineapple, not from the can, was another revelation. I ate ate whatever I
    could get my hands on. And I came to love prep work: each fruit and vegetable
    calling for its own way to be broken down with a knife, lined up until it was
    ready for the gentle whack-thwack-thwack of the blade onto the cutting board.
    I had always enjoyed eating sweet carrots straight from my grandfather’s garden.
    I liked the subtleness of cucumbers and the thirst-quenching greenness of the
    celery my nana cut and kept in water-filled cups in the fridge. Working in food
    let me taste more. The salad bar began to teach me how to approach a fistful of
    vegetables and make them into dozens of dishes, each with its own distinct flavours
    and textures. Vegetables contained multitudes.


    At sixteen, I was at my friend Jenny’s apartment, helping her make a Thai curry
    with tofu for dinner. Jenny lived with her dad in an apartment above a business
    downtown. We set cutting boards on an island, or peninsula, in the kitchen, and
    prepped the vegetables together. Jenny used green curry paste and coconut milk
    and lemongrass. She cut the bottoms off the lemongrass, smashed them, and stuck
    them in the pot with the paste and some water. I’d never eaten green curry, and
    the flavours—in particular, the perfume of the lemongrass—lit a little sparkler
    in my brain. Jenny taught me how to make it, and I started making myself at home.
    Dish by dish, ingredient by ingredient, I learned to make what I wanted to eat.'
- md: '

    My turn away from vegetarianism began with the removal of my gallbladder in my
    early twenties. After initially being misdiagnosed—a doctor at my school’s health
    clinic took one look at my chart, saw “anxiety,” and turned me away as if I had
    nothing more than a nervous tummy—I lived with gallstone attacks for months. After
    I finally had surgery, the attacks stopped, but I never fully got better. For
    a while, I kept eating as though everything would eventually be okay. I saw another
    doctor, who didn’t notice anything, other than anemia. Things progressed; I began
    to double over eating or feel a need to lie down with my knees tucked into my
    stomach, waiting for the pain to pass. My body stopped hunger cues. I started
    feeling full after eating just a few tentative bites. And then I started eating,
    knowing it would bring pain.


    Eventually, the doctor suggested I see a neuropath, and the neuropath suggested
    an elimination diet. After eliminating a lot of different foods, I stopped feeling
    so sick after I did. But the list of what I had to avoid was long: gluten, peanut
    butter, all dairy other than yogurt, and basically anything high fat made me feel
    sick. I could stomach things like corn tortillas and eggs, steamed vegetables
    and almond butter.


    I lost so much weight that my grandmother, who had lived through rationing in
    the wake of the Second World War, grew concerned. But having received both cultural
    and messages from my mother that my larger body became undesirable and signalled
    that I was weak-willed, I was not concerned. Initially, in fact, I felt like I’d
    discovered the key to success: my body, now so bad at digestion, no longer seemed
    to want me to feed it.


    But I did get shaky. And I had to Lego together nutritional blocks of meals with
    only one-quarter of the set. When I exercised, instead of feeling strong, I felt
    a giant weight pressing on my chest. Biking against the wind one day, something
    my friends were managing well enough, I felt so weak and unable to keep up, I
    began to cry. I stopped menstruating.


    The food restrictions I was living with made it hard to go out to eat with friends
    or grab something while I was out running errands. Then, like now, I walked and
    walked everywhere; if I got stuck in the middle of nowhere without an adequate
    meal or snack, I became seized with panic. Like my grandmother had foreseen, my
    body no longer had anything to fall back on. No reserves.


    I also began, eventually, to worry about how much control and caution I was exerting
    over what appeared on my plate. Most of that caution was necessary, but it had
    activated the part of my brain that had been trained to hate and control my physical
    appearance. A child and teen, it was my hungry, my body’s desire for life and
    strength, that encouraged me to eat instead of starving myself to be smaller.
    But my weakened body couldn’t advocate for itself. I needed to let go of the idea
    of being thin, as accidental the road to thinness had initially been.


    When I chose to add chicken and fish and bacon and steak back into my diet, it
    felt like I was choosing between my own self-preservation and that of the animals
    I''d be eating.


    I chose my own self-preservation.


    Three decades later, that fundamental truth I felt about food still feels true,
    even though I eat meat once or twice a month. Animals are autonomous beings with
    their own personalities and understandings of the world, and it seems odd to categorize
    them based on whether or not they’re inclined to develop personal relationships
    with humans, to culturally separate them into pet and not pet. Often when people
    propose thought experiments on these questions, they’ll contrast North American
    cultural understandings of animals with another culture’s understandings—but that’s
    not actually necessary. What I''ve always found fascinating are our very homegrown
    boundary cases. I love bunnies, for example, identifying with their anxiety and
    mischievous love of raw vegetables and their tendency to stomp their powerful
    hind legs when alerting or angry. Some people keep rabbits as pets, and some people
    eat them, and that’s not a clean cut. While my pet bunnies roamed my house, nibbling
    on my paperbacks and being fed like petite kittens, lots of people keep them in
    pens outdoors, caring for them before harvesting them for the table. Some North
    Americans view horses as pets, and some view horses at dinner. Some frogs, and
    some eat them. No one would bat at an eye at a parrot owner eating a chicken salad
    sandwich.


    It’s my decision about what to do with the information that animals are thinking,
    feeling beings that changed. I see vegetarianism as only one of the conclusions
    a person could come to, and I see my vegetarianism as having been deeply influenced
    by my culture, upbringing, and surroundings. Another equally valid conclusion
    would be that humans are more similar to other animals than some of us might believe,
    and as omnivores, it’s pretty natural to participate in the food chain by eating
    other animals. Just because I grew up in the suburbs and ate industrially produced
    meat doesn’t mean that everyone’s relationship to eating animals is. Further,
    even if it is, meat is a calorically dense vehicle for protein and fat. When your
    budget is tight, an on-sale cut stored in the freezer can go a long way, making
    meals feel satisfying and keeping you saturated longer.


    If animals are thinking, feeling beings and humans are still going to eat them,
    because we are animals and we like meat, one addressable problem is that of animal
    welfare: to offer the animals we farm a better life. This is the solution that
    Eliza MacLean, an animal rescuer turned pig farmer in North Carolina, has opted
    for. “I have spent my life finding, receiving, injured animals,” she tells the
    filmmakers of Cooked, the Netflix series inspired by Michael Pollan’s book. “Once
    I decided that I could save them, I really wanted to give them the best life they
    could have,” she tells the filmmakers of Cooked, the Netflix series inspired by
