    It was only after I’d had a kid, moved back across the country, bought a house,
    and then bought two trifle dishes in succession that I finally asked GG for the
    recipe. She mailed it inside a card, on cardstuck of its own. read:


    # Cunliffe family trifle (Over 100 years old)


    # Simplified version


    +   **Day 1:** Place pound cake, Swiss roll, or any sponge cake in bottom of large
    dish. (Can be stale.) Sprinkle generously with sherry and brandy.


    +   **Day 2:** Open a can of fruit—peaches, mandarin oranges, etc.—and place on
    cake base. Make a jelly, any flavour, using the juice to replace the cup of cold
    water called for recipe. Stir well, and pour over the cake and fruit, cover and
    return to fridge to set.


    +   **Day 3:** Carefully pour a can of custard over the above and smooth. Cover
    and return to fridge.'
