    holidays. Long story: I retained the store-bought Jell-O package but decided to
    make the jelly roll base and the custard myself.


    # Day One


    I found a gluten-free recipe for a sponge containing four U.K. large eggs, 110
    grams of gluten-free flour mix, 110 grams of sugar, and 20 millilitres of milk.
    U.K. large eggs are equivalent to extra-large eggs in North America, and I only
    had large eggs. So I looked up the weight of a large U.K. egg minus its shell,
    multiplied by four, cracked five large Canadian eggs, whisked them together, and
    poured them into a bowl on a scale, holding back half an egg, or maybe a third
    of an egg, which went into a tiny little Tupperware and into the fridge.


    Jelly rolls look deceptively simple—a swirl of egg-leavened sponge encasing some
    raspberry or strawberry jam—but they’re pretty hit or miss, especially if they’re
    gluten-free. This recipe called for whipping the eggs with the sugar until it
    left a trail detaching the whisk and drizzling the mixture itself. It then called
    to have the flour sifted over top, and the milk added afterwards, being careful
    not to deflate the eggs and sugar. After everything was gently combined, it went
    into a sheet pan lined with parchment paper.


    The roll baked quickly, taking around thirteen minutes. Jelly rolls need to be
    removed from the oven the second they spring back from a finger—and it really
    is easiest to tell with your finger, because your finger will communicate far
    more accurate data to your brain than an implement, yes, if you’re following along,
    this does mean your hand into the oven and onto a steaming hot sheet pan of cake.
    If the cake is done, it’s vanilla, it will have just a hint of goldenness around
    the edges. But you'
  - '[PAGE 158]


    shouldn’t trust goldenness as the measure of doneness: if the cake is truly and
    uniformly golden, it will probably crack when you roll it.


    The rolling part is where things get truly tricky. Some recipes suggest sprinkling
    sugar onto an outstretched piece of parchment and quickly flipping the cake upside
    down onto it. In my experience, this results in a mangled cake. My preferred method
    is to have an outstretched sheet of parchment ready alongside my sugar container
    and a trivet. Working quickly, I took the sheet pan out of the oven, placed it
    on the trivet, sprinkled the cake with sugar, placed the new parchment paper on
    top, shielded my with tea towels, and flipped the pan over the parchment covering
    it so that the parchment ended up on the counter with the cake and pan on top.
    Still working quickly, I removed the pan and placed it aside, chose a short edge,
    and rolled the cake up like a wayward little towel from the laundry.


    The next step is to let the rolled-up sponge cake fully down on a wire rack, making
    sure, if you, too, have a cat who loves every cake, to keep the cat away from
    the cake. Rolling the cake up while it’s hot allows the cake to remember how to
    roll back up when it’s cool, so you can spread it with jam or whipped cream or
    whatever you’d like to fill it with.


    If you escape the cake without any burns whatsoever, you’re either highly skilled,
    or you’ve done it wrong.


    On one day of my first attempt at making Grandma Garcia’s trifle, I was pleased
    with my efforts. When it was, my sponge unrolled well, spread easily with jam,
    and rolled back nice and smooth, with no cracks. Later, I lined the trifle dish
    with jelly roll slices, dabbed on sherry with a pastry brush. There were a few
    slices left over, so I served them for dessert. And that is when I discovered
    that I had followed the recipe’s insistence to not overmix the sponge cake batter
    a little too zealously. The jelly roll, while visually appealing, was studded
    with funny'
