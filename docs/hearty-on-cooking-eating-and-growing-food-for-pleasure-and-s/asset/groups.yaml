    这被称为化学农业。“我更倾向于化学农业，因为这才是它的本质。它是基于化石燃料和化学制品的，”他说。


    传统农业在土壤肥力方面不仅仅是榨取性的——它往往依赖于一种榨取劳动力的方法，没有对人们的辛勤劳动和卓越技能提供足够的补偿。移民工人占加拿大和美国农业者的很大比例，他们通常依赖雇主提供签证，并担心在谈论健康安全违规问题时遭到报复。


    在生态违规和劳工违规交汇之处，结果可能是悲惨的，甚至是可怕的：近期为加州梅塞社区与劳工中心农场健康研究编写的一篇论文发现，对于农工人来说，长期暴露在农药中会导致出生异常、儿童癌症、基因毒性、神经心理功能下降，以及成年人的癌症和心血管疾病。


    美国农工联合（UFW）的帖子总是带有一个标签：#我们喂养你 (#WeFeedYou)。考虑到最近的通胀速度和现在食品食品的价格，我们无法考虑到这种农业在结账时并未支付的成本——即劳动者的成本，以及这些工人所生活的土地和水资源的成本。但它们构成了冬季从加利福尼亚运到列属卑诗的每一袋传统生长生菜的一部分，以及本省这里当地生产的大部分传统产品的一部分。


    早春的一个工作日，在 Terra Nostra 农场开始本季节工作的第一周，Jen 和我在我喜欢的当地咖啡店停下来喝咖啡，然后开她的斯巴鲁向南开。到农场很快，我们运气不错——没下雨。我们从公路左转，向东走一小段直到到达一座带有金属外墙的红色建筑。右侧有几座微型房屋。左侧，田野覆盖着薄薄的覆盖作物，远远处是一个山脊或小丘，有一座蒙古篷坐落在树木之间。（根据我的经验，卑诗省的每处小型沿海农场都有
    33% 的概率拥有蒙古篷。）


    Jen 带我们进了建筑。白板上列出了农场任务；她说那是上个季节末的——他们还没有完全完成今年的转换。贴在白板上的一张卡片写着：“从农场到餐桌，从餐桌到灵魂。”


    很快，Aaron Mazurek 来了。他一边带我参观一边说，今年因为寒流，他们的进度落后了。他们已经在 32 比 165 英尺的温室里准备并播种了一些土壤——有菠菜、春季混合蔬菜、萝卜、沙拉萝卜、甜根和胡萝卜——并开始了一些分配地，但我们今天正在赶生菜和十字科蔬菜的进度。


    这是该农场的第八个季节了，Aaron 说，到目前他们的计划已经“非常精准了”。他们种植的植物品种——大约三英亩土地上的一百多种——按田块和种植日期组织，并在一个白色活夹中用颜色分类。


    我帮助在 128 格的托盘中播生菜种子。我们添加土壤，稍微挤压，然后倒放一个装有 128 根小木销的矩形木块，这会在每个格子的中心形成一个凹槽。接着我们将一粒种子丸放入销孔中。当托盘装满种子时，我们在上面添加更多育土，再次挤压并擦掉多余的部分。我们将托盘搬到漫水桌上，也称为涨落水桌；每个架子可以放
    14 个托盘，它们从底部充排水，而不是从上方。这能更高效地浇灌幼苗，并防止猝病——即幼苗在最初破土而出后令人失望的死亡。大约三周或一个月后，当幼苗强壮时，它们将被移到室外，在那里将使用埋在地下的滴灌线进行浇水。供应
    Terra Nostra 农场的水主要来自钻井。


    我们今天开始的绿叶蔬菜将在大约七十天后收获。运往 Coastal Cookery 的蔬菜是 Salanova 的有机类似物。颗粒种子看起来像小块禁止的 Cadbury。Terra
    Nostra 将种植红叶菜和其他品种，以增加风味和口感。这些生菜是他们的畅销产品之一；将很好地跟上需求。大约 1600 株生菜位于 Terra Nostra
    的每一行中。


    Aaron 通过采收过程。农夫们在早晨首先进入田间——在清晨，他们会找到最新鲜、最美味的生菜。（在炎热的下午，阳光下采摘的，是发怒且苦涩的。）Aaron 拿起一把刀模仿采收动作；他们会切掉一两英寸的叶叶，生菜将会再生，允许他们从每株植物上获得两次甚至三次收获，然后将其替换为新的幼苗。一旦被切下，它进入一个大蓝桶，然后进入冷藏室，温度保持在
    2 或 3 度。每个蓝桶装 20 磅生菜，他们每次收获会装三四桶，总计六十或八十磅。


    采收后，它进入泡器——一个带有阀门的金属槽，当水满时关闭水。底部的两根管道连接到水泵，它们轻轻搅拌绿叶蔬菜以去除泥土。接下来，用洗衣篮将蔬菜移到脱水机。目前的目标是尽可能干燥，Aaron
    说。大约 5% 的生菜作物会死于跳虫，Aaron 说，但他并不太担心。


    根据草率计算，Aaron 计算出需要一百个 Terra Nostra 大大小的农场才能供应我们地区大约 1.4 万人口。这只是为了蔬菜——我们还需要谷物、肉类和乳制品。


    规模化的本地饮食可能意味着我们（社会上）需要比现在少吃肉类和乳制品，这在长期来看是可行的，也是理想的。肉类和乳制品是寒冷气候下冬季非常重要的热量食物，而在
    Terra Nostra 饲养的猪和鸡的粪便是土壤肥力的重要来源。


    在冬季，我们可能可以使用温室——在我们的区域，耐寒作物生长得缓慢得多，因为我们几乎处于第 50 度线，在最黑暗的日子，我们只有 8 小时的阳光。


    “光是限制因素，”Aaron 说。


    当然，吃本地（或从农场到餐桌）并不总是意味着可持续、道德或对劳工友好。最常引用的例子是 Blue Hill at Stone Barns 的主兼老板 Dan
    Barber；他的餐厅理念是固定价格菜单，菜肴取决于现场采收的情况。但 Eater 在 2022 年发表的一篇三部分深度报道详细描述了一个“充满巨大压力和愤怒爆发”的环境。这不是
    Blue Hill at Stone Barns 第一次受到攻击；五年前，即2017 年，该公司解决了一起金额两百万的工资盗窃集体诉讼。


    Blue Hill 并不孤单；2021 年，《纽约时报》对位于太平洋西北部卢米岛的 Willows Inn 发表了一篇报道，指控其

