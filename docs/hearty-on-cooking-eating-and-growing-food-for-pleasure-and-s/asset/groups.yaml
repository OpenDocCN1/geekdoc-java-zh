    每年在花床或田地上覆盖堆肥或陈年粪，而不是将其挖入土或使用肥料——这告诉你，如果你的农场花园是多样化且平衡的，你就不会看到严重的虫害或疾病压力。


    随着时间的推移，大体上这是事实：轮作有助于防止或抑制某些病原体，并改善土壤质量，例如，在种植了大量消耗氮元素的西兰花、羽甘蓝等十字花科植物后，种植豌豆和豆类固氮植物。多样性还可以帮助吸引益虫和授粉者，而且如果种植了具有不同优缺点的品种，即使在过热、过冷、多雨或干旱的年份也能确保产量。但事实也是，有些事情就是看运气。


    在我们搬进新家的第一年，后院的土壤一变得可用，我们就开始挖掉草皮并创建花床。Will 先用手锯，后用电链锯，从后院的南侧移除了一排雪松树篱，以引入更多光线。他修剪了过度生长的月桂树篱，那些树木高得横跨了我们房屋的沥青瓦屋顶，造成了积水、苔藓和落叶堆的问题。他砍掉了一棵死的榛子树；他修剪、剪断，最终堆了一大堆摆放整齐的灌木和树木修剪物。并不是所有的都符合我们的用途，但我们在新挖的床里利用了能用的部分，将修剪物分层，下面覆盖着从深处挖出的土层。


    今年，我们成功创建了三个南北走向的长花床——其中一个作为 Will 繁殖的幼树和灌木的苗圃，另外两个用于我的蔬菜。我们在花床之间留了草地，并用月桂枝衬了边缘。它们看起来很漂亮：整洁、清新、经过打理。我们的猫
    Mackerel 戴着项圈，自己在露台上晒着太阳，看着我们的进度。我为她买了猫草，将一丛紧凑的植物重新盆到三个独立的容器中。


    那年我种得很简单，有辣椒、西番茄、羽甘蓝、豌豆、豆类、西兰花和蚕豆。我尝试播胡萝卜，但它们没有发芽。我们在室内开始西番茄、辣椒和西兰花，等幼苗长壮后再移到室外。我们直接在土里种了豌豆和羽甘蓝。


    很快我发现了一个问题：子里潮湿且多草的栖息地对蛞来说简直完美，而我们在翻动土壤创建花床并用小木头衬床时，我们创造了一个完美的“小早餐酒店”。它们在十字花科植物叶子上咬出大洞；撞倒了豌豆和西番茄。它们无处不在，就像圣经里的灾疫。在葡萄架的保护下，有一组带混凝土墙的
    U 形床，我在那里种了草本。我特别关注罗勒。蛞也是如此。


    我建议了一些对策，比如撒咖啡渣和蛋壳，但它们没用。我发现的一个德语网站详细测试了“防蛞”技术——将蜗牛和蛞放入小实验中，以看哪种威慑措施有效。这些生物保护性黏液让它们能轻松滑过任何尖锐物。三件事是有效的：宽铜带、一种被称为“蛞栅”的某种复杂的物理屏障，以及用电线带对蛞进行电击。


    这些选择在我的花园里无法立即实现，所以我开始了一场战争。晚上，我戴着头灯提着一桶盐水出去，后来我用它换了剪刀——痛苦更少，死得更直接。我抓到正在偷食和撞倒植物的小灰色田间蛞，并对它们执行即时的极刑。我每晚都会杀死几十只。


    很快，我开始梦到那些蛞。这感觉有点不可理喻。我深信，当我死后，我将再次见到它们，并向我杀掉的每一个一个交代。


    我向遇到的每人都提了蛞蝓的事。当他们建议民间偏疗法时，我详细说明了防蛞测试的结果。与此同时，Will 将继续对他的植物进行尽职的照顾，不让它们的牌子变成别人的麻烦。


    季节快结束时，我意识到我们用来衬花床的木头必须处理掉。我和 Will 骑自行车，Sinclair 坐在她的婴儿座椅上并拖着一辆拖车，去了镇上美元商店和 Mark''s
    Work Wearhouse 后方的一组纸板垃圾桶。Sinclair 在周围蹒跚，而 Will 爬进垃圾桶，把好的箱子朝我扔出来。我们用纸板覆盖了草径，并在上面堆了高木屑——这对当地花花师来说只要六十五美元，为他省去了一趟去填埋场的行程。


    我仍然很少直接播种——这有助于植物在圆顶屋（第二年建造）或温室（第三年建造）的温暖细胞里长得更大。我把罗勒种在五加仑的盆里，盆缘环绕着铜带，当我把移到室外时，会在南瓜、黄瓜和甜瓜幼苗的嫩茎上包上铝箔圈，防止它们再次被撞倒。但我不再进行每夜的袭蛞行动，也不再在梦中看到它们，我的良心不再折磨着我。


    在这种情况下，我从那些嬉皮士专家那里吸收的建议起效了：我们越是改善土壤并将草地转变为花园和木屑径，蛞蝓的问题就越小。


    但并不是我们最后的瘟疫。并不是所有的问题都能通过栖息地的改变和耐心来解决。其中一些问题——随着气候变化让每个季节都变得更怪、更不可预测——我们只能学会与它们共处，就像我们必须学会接受失去一样。


    花园的第二年，我的胡萝卜发芽了，但当我采摘时，我发现有很多被穿了——那是由被称为胡萝卜蝇的生物造成的微型隧道。下年，我在园艺商店买了网罩，从当地水暖店买了
    PVC 管，并在 Rona 割了 18 英寸长的钢筋。我把钢筋钉进土里，锯断管子，并弯曲成倒置的小 U 形，帮助网罩跨在花床上方。覆盖胡萝卜能很好地防止胡萝卜蝇；覆盖十字花科植物则阻挡了菜蛾和蚜。


    在太平洋西北部凉爽潮湿的气候下，我发现让冬南瓜上架生长有助于防止白粉病的发生


