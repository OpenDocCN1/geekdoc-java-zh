    almond flour I use, which, until now, has been the store brand. I’ve been pulsing
    it together with the icing sugar in the food processor a few times before running
    it through a sieve; maybe pulsing it is releasing almond oil and messing with
    the chemistry of the macarons? I buy a bag of Bob’s Red Mill Super-Fine Almond
    Flour that costs almost twenty dollars. I also buy four cans of chickpeas, no
    salt added.


    That night, right after work, I start my sixth attempt. I decide on using the
    Swiss technique, which involves cooking down the aquafaba with granulated sugar
    before whipping it into a meringue. I find the recipe on a blog called Project
    Vegan Baking, run by a London-based vegan named Tom. The macarons pictured on
    the blog are quite visibly textured in the shell, and the example recipe contains
    no food colouring, they’re a natural almond colour. But the recipe catches my
    eye for its precision, offeringหน่อย in grams for the amount I should cook my
    aquafaba and sugar down to. I calculate the weight of the pot and the initial
    weight of the contents, doing a bit of back-of-the-napkin math to figure out what
    pot plus half will equal. As it’s cooking, I place the pot onto the scale periodically
    to check.


    The other variable that has been keeping me up at night is my oven temperature.
    Something has felt off. The mac shells I pipe following Tom’s recipe are thick,
    thicker than this, and he suggests leaving them to rest for an hour. While they
    rest, I calibrate my oven with an thermometer. When the oven display reads 250
    degrees, the oven thermometer reads about 295. My oven has been betraying me.
    Setting it at 225 or 230, I discover, gets me closer to 250. Normally I would
    feel frustrated. But I find myself hopeful instead: better control of my oven
    temperature might lead to better results.


    The first tray I bake are mini macarons. Tom’s recipe suggests leaving them in
    the oven for a whopping forty minutes and then turning off the oven'
  - '[PAGE 85]


    and leaving the door cracked open for an hour to let them dry out. So I do.

    During the baking stage, the macarons lift prodigiously—but then a bit too high,
    and lopsided.


    Still, when I open the oven and take a mini mac off the Silpat, it lifts cleanly.
    It is not an unappealingly heated marzipan. It is a macaron. An imperfect macaron,
    but a macaron nonetheless. I actually have a piped batch for the first I''ve ever
    been able to produce. I feel like crying with joy. I also feel cursing the macarons
    out: Take that, you little fuckfaces, I finally got one over you.


    The second batch, which are regular sized, take forty-five minutes to bake. By
    now, it is somehow 11:30 p.m. So when I turn off the oven, I leave the door popped
    open with the macarons in and go to bed. In the morning, I check on them: they’re
    still there, they peel off the mat easily, and they have large feet. They are
    somewhat hollow and look as though they came straight out of a cement mixer, but
    when I test—sandwich it with vegan lemon curd and some Swiss meringue buttercream
    I take out of my freezer—it rings the macaron bell in my brain. Finally—finally!
    I have made something resembling a passable vegan macaron.


    After work, I engage Will’s and Sinclair’s help to make dinner—soba noodles in
    a miso broth with roasted broccoli, sweet potatoes, and chickpeas—while I make
    a vegan vanilla buttercream in the stand mixer and then painstakingly match the
    slightly wonky macaron shells, filling them with curd and frosting. I tell Nota:
    this time, pictures of the filled macs. I’m excited for her to try them.


    In Steingarten’s boudin essay, he travels to France to learn how to make a boudin
    from start—butchering the pig—to finish, canning the boudin. After making the
    boudin, he and the cooks and farmers who butchered the pig eat a celebratory meal
    they call a fête cochon, and Steingarten writes that “all [he] wanted to do after
    lunch was stagger to a soft bed and lose'
  - '[PAGE 86]


    consciousness for a day or two.” And yet tomorrow I’ll face more emptied-

    of-aquafaba cans of unsalted chickpeas to use in some kind of meal—\maybe braised
    with lemon, over quinoa and sweet potato purée? Will and

    Sinclair and I are beginning to tire of meals featuring unsalted chickpeas.


    After making his boudin underelage, Steingarten returns to France to

    try again, this time just with his friends. The group begins the project at

    ine a.m. and finishes sealing the boudin in cans at seven p.m. By that time,

    Steingarten writes, they are “staring listlessly into space.” They must then

    boil their sealed cans for three hours. Before leaving Paris for New York,

    Steingarten and his friends try their boudin noir. “We were in heaven, at

    least at first,” he writes. “Our more mature judgment was that the taste and

    texture were nearly perfect, but that there was a bit too much blood in

    proportion to meat.


    I’d remembered only the pleasure and satisfaction he described in this

    essay—a simple if obsessive and minded journey undertaken with more

    resources I generally have access to, fresh Canadian lemons aside. And

    when I first started making vegan macarons last winter, I assumed it

    would take a couple trials and then I’d have a new skill I could break out

    from time to make gifts for friends who don’t or can’t eat eggs. But

    his hasn’t been the case. Instead, the quest has activated the part of my

    personality that was disappointed when I got 90 percent on a math test. I’d

    forgotten about the feeling that takes root when you go on a quest for

    perfection and can’t reach it.


    And I realized that the quest, which started out with friends, turned into

    sewhat of a quixotic venture. In some ways, it was more fun to

    fail in a group than begin to succeed alone, even if what I was

    undertaking in service of a friend.


    Still, I am tempted to try another round of vegan macarons immediately.

    But I’m worried that if I remake them and they aren’t an improvement on'
