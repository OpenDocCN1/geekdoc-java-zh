    Around the anniversary of my dad’s heart attack, I made one of my favourite flavours
    yet: spruce tip.


    Spruce tip ice cream is less a tension and more a clear intermingling with our
    evergreen coastal surroundings. Christopher Cheung and I cowrote a piece for The
    Tyeee when he tested a Philadelphia-style base, and I called Kirsten Wood, a Cree
    ice cream maker and the owner of Blue Spruce Ice Cream, a small-batch shop located
    near the 5th Street Bridge in Courney, for tips on how to infuse my classic custard-style
    base with spruce tips collected from the blue spruce in my yard. Wood told me
    that for her, making spruce tip ice cream is, in part, an expression of the relationship
    between Indigenous approaches to food and locally available ingredients. With
    her suggestions, I made an ice cream that was so good I plan to make it yearly
    as long as our blue spruce is standing and I can harvest from it.


    Later that same summer, I made what I have taken to calling my life’s work. I’m
    not sure what sparked it, but I began to wonder if the Momofuku Cereal Milk ice
    cream technique could be applied to pretzels—specifically gluten-free pretzels
    in sugar and dry milk powder in the oven, and steeping them in four cups of whole-fat
    milk in order to make one cup of pretzel-infused milk. From there, making the
    custard, and churning the custard. Initially, my plan was to make chocolate-covered
    pretzels to add as a mix-in; it was rich enough without—the salty, tasty-bread
    flavour of the pretzels needed to be enjoyed on its own.


    Will thought the pretzel flavour was an abomination. This was good news for me,
    because I did not want to share.


    After the pretzel ice cream, a disappointing chalky vegan lemon ice cream. And
    then the plum ice cream made using a jar of plums my friend Erin had canned. The
    resulting ice cream was rich and a bit salty. I used much of it to make a frozen
    meringue pie with a graham crumb base and a toasted meringue top.


    Then I made a peanut butter ice cream and placed the leftover plum alongside the
    peanut butter ice cream in silicone ice bar molds to make PB&J ice cream bars
    (Buying the moulds felt like acquiring a new superpower. Ice cream in a bowl is
    one thing; ice cream on sticks, dipped into milk or white or dark chocolate, and
    then rolled in toasted nuts or sprinkles, is a whole new thing entirely.)


    And then a satsuma ice cream, used in mini baked Alaskas with a brownie base,
    and an orange sherbet, because the satsuma ice cream was subtle and I wanted to
    know if I could make something that tasted juicy.


    Nutella ice cream again (“cannot be improved upon”), and a yuzu encore, this time
    with no goumi berries. And then blackberry.


    Finally, in March 2023, just over two years after I started the project, s''mores.
    I made a chocolate base, toasted the mini marshmallow mix-ins with a culinary
    torch, and enrobed gluten-free graham crackers in chocolate so they would remain
    crunchy.


    My friend Jen shared the s''mores ice cream with her best friend Jenn, who’s celiac,
    while they were house-sitting for Will and Sinclair and me we were in Vancouver
    for my nephew’s birthday. In the middle of painting an overturned half-dome cake
    so that it would look like Jupiter, my nephew’s favourite planet, I got a text
    from Jen: a photo of Jenn’s face halfway into a ceramic bowl, licking it clean—“How
    Jenn feels about the ice cream.”


    One of the things I wonder about, with my dad and mortality, is whether he has,
    in part, lived his life as a rebellion against the self-denial and moderation
    preached by the Methodist church of his youth. Why go to all the trouble of parting
    from it to opt in back for health reasons? Why reach ninety if reaching means
    no whiskey or fish and chips or gummies? From his initial, fairly strict, recovery
    diet, he''s branched back out into a more varied diet that includes more of the
    foods he actually enjoys eating. Another tension that emerges is I don''t believe
    we owe health to anyone—but I want to argue my father as if I am his dietitian
    or fitness coach, because his heart attack was terrifying and I would like to
    see him grow old.


    While I find pleasure in places other than food—swimming in the ocean, walking
    around new places, making art, seeing art, reading books, rewatching familiar
    TV series—food is a joy that reaches out as a daily necessity, regular and accessible.
    In the end, I scaled back my initial goal of reaching one hundred batches of ice
    cream twenty-four in just two years instead. But like my nana and my Grandma Garcia
    and my dad, I generally eat a bit of dessert, a little something sweet, ice cream
    or not, every day. Is this moderation? Is this healthy? Health is holistic. Moderation
    is subjective.


    I feel plagued, sometimes, by my family history and by the statistics that say
    as a trans person and a person with bipolar disorder, I will live a shorter life
    than my peers. I want to live forever. Literally forever. But this feeling lifts
    when I cook and bake things that I enjoy and can share with others. When I engage
    in the practical creativity that food represents. I haven''t resolved the essential
    tension, or the essential question; in fact it''s difficult to disentangle in
    a culture saturated with fatophobia and shifting trends and ideas about what exactly
    leads to and constitutes health and wellness. Standing over the stove watching
    the custard come together, it''s less that I resolve the essential tension between
    ideas of health and pleasure—or even if there is an essential tension—than that
    I forget about it for a time. And maybe that’s enough.


    ## Spruce tip ice cream


    ### Tools

    - whisk

    - medium-sized heavy-bottomed pot

    - medium-sized fine-mesh strainer

    - food thermometer (optional)

    - ice cream maker (optional)


    ### Ingredients

    - 2 cups heavy cream

    - 1 cup milk

    - 2/3 cup sugar

    - generous pinch of salt

    - 6 egg yolks (save the whites for another use)

    - 1/4 cup lemon juice

    - 1 cup spruce tips


    1. Place the egg yolks into a bowl. Whisk them together and set aside.

    2. Whisk the cream, milk, sugar, and salt together in a medium-sized heavy-bottomed
    pot on medium-low heat until the sugar has dissolved and the mixture is beginning
    to emit the tiniest bit of steam.

    3. Take the pot off the heat.

    4. Slowly drizzle about one-third of the cream mixture into the yolks, whisking
    constantly. The idea is to temper the yolks, which keeps them from scrambling.

    5. Once you''ve added one-third of the cream mixture into the yolks, it''s time
    to add yolk mixture back into the main pot.

    6. Place the pot back onto a medium-low heat and gently cook the custard, whisking
    regularly. You’re looking for the custard to come to 170°F (77°C). If you don’t
    have a thermometer, it should be thick enough to coat the back of a spoon.

    7. Remove the pot from the heat and let it come to room temperature for half hour
    on the countertop.

    8. Meanwhile, wash and dry your spruce tips, and roughly chop them into largeish
    pieces.

    9. After half hour, stir the lemon juice and your spruce tips into the custard.

    10. Transfer into a bowl and place in the fridge. (Or just place the pot into
    the fridge; we’re not judging.)

    11. Allow the spruce tips to infuse into the custard in the fridge for 36 to 48
    hours.

    12. Strain the custard through a fine-mesh strainer into a new bowl. It’s okay
    if a few little spruce bits make it through.

    13. Churn the ice cream in your ice cream maker, or DIY using a baking pan and
    a whisk.

    14. Serve in a cup or cone.


    ## Pretzel-infused ice cream

    Adapted from the Momofuku recipe for Cereal Milk ice cream

