    # because someone saved the seed


    Kevin Wilson, who also lives on about one-fifth of an acre in a striking two-tone
    blue house with a pride flag flapping gently in the breeze above the front porch,
    grows breadseed poppies and lovage and fennel and crocuses and narcissus. He grows
    lettuce and corn salad and comfrey. Several kinds of currant and an apple tree,
    called a maiden apple, that grows straight up rather than branching out. His specialty,
    though, is soup peas, a type of pea that''s grown to dry and store, and as its
    name suggests, mainly used for soup. He grows them for himself and to sell to
    friends and neighbours.


    A mutual friend introduced us because because she thought I''d learn a lot from
    Kevin, who also runs a homesteading school and forms part of a fairly large network
    of smaller-scale seed farmers and sellers in the Pacific Northwest. I''d been
    looking to learn more about what goes into the process of saving seeds to sow
    and grow; as it had begun to feel, for me, like an inevitable offshoot of growing
    fruits and vegetables.


    Understanding how different types of plants grow and to seed is the first step
    towards learning how to save seeds at home and what it means when we''re buying
    a packet at the store. Plants like kale and carrots, for example, are biennial,
    meaning they need to be overintered and allowed to flower and go to seed in their
    second year. Some plants, like squash and cucumber and carrots, cross-pollinate
    fairly readily, meaning they need to be isolated from varieties that share the
    same family. Other plants, like tomatoes, are self-pollinators, meaning it''s
    possible to grow different varieties in fairly close proximity. Plants like bell
    peppers need to be fully'
  - '[PAGE 63]


    red and ripe before their seed can be harvested, which can be tricky due to climatic
    conditions in the Pacific Northwest. I often pick and eat mine when they’re green
    because they’re reluctant to redden, even in my greenhouse.


    But there are other considerations involved. When I buy my Sweet Million tomatoes,
    I’m buying a variety bred to be productive and disease-resilient. But they’re
    hybrid seeds, created by intentionally cross-pollinating parent plants—meaning
    any seeds I save from the fruits won''t be reliably similar to their parent plants.
    Should I be growing an open-pollinated variety instead, one that can adapt, over
    time, to climate change and my microclimate? The year I visit Kevin is one that
    will see a record-breaking heatwave and a perilously early start to wildfire season.
    So resilience is top of mind. How are ecologically minded growers and seed sellers
    adapting their practices to make small-farm and backyard crops more resilient?
    And what should growers be keeping in mind when we’re buying the seeds we can''t
    save ourselves?


    Saving seed is a political act. Much of the food we buy from the grocery store
    is derived from seeds that have been genetically modified to tolerate herbicides
    and pesticides, increase nutrients, or increase disease and drought tolerance.
    In some cases, the food we buy is grown from “terminator” seeds—seeds developed
    by companies such as Monsanto, which are designed to produce plants that have
    sterile seed, so farmers are forced to buy new seeds from that the following year.
    These same companies may also vertically integrate their seed-selling arm with
    their pesticide and fertilizer arms. They sue farmers aggressively to protect
    their seed patents. In short, their seeds are the kernel from which industrialized
    farming—with its strengths and its myriad weaknesses—grows.


    Saving and sharing seed, then, defies the capitalistic pressure to hoard and monopolize.
    It feels more akin to what seeds themselves aim to in'
