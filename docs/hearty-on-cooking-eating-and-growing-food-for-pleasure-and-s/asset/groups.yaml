    # about the author


    ![](img/b511df8691509de551f227f92620fd02_242_0.png)


    Photo by Erin Flegg


    andrea bennett is a National Magazine Award–winning writer and a senior editor
    at The Tyee. Their writing has been published by The Walrus, Chatelaine, The Atlantic,
    the Globe and Mail, and many other outlets. Their first book of essays, Like a
    Boy but a Boy, was one of CBC Books’ 2020 picks for the top Canadian nonfiction
    of the year. Originally from Hamilton, andrea is now back on the west coast after
    a stint in Montréal.'
