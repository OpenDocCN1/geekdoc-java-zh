    Adapted from a Kristina Razon recipe for *Serious Eats.*


    Unlike other recipes in this book, this one takes a while to come together. About
    an hour and forty minutes—or up to two hours if you''re pulling various elements
    of dinner together simultaneously.


    The beauty of this Serious Eats–adapted recipe is that it calls for a low-starch
    potato variety and then takes specific steps to further reduce starch and moisture.
    This results in an incredibly light and crispy final product. A higher-starch
    potato variety will lead to a denser (and still delicious) result.


    Serve with gravy and whatever you like eating with gravy. The pommes dauphine
    are a bit of a production, so it''s nice to keep the other elements of the plate
    simple. (I started the gravy, for example, before starting the pommes dauphine—that
    way, it could hang low on another part of the stovetop while I focused on the
    pommes.)


    ## Tools


    - large Dutch oven or deep fryer

    - thermometer suitable for deep-frying

    - stand mixer with paddle attachment (optional but nice)

    - medium-sized heavy-bottom pot

    - wooden spoon

    - spatula

    - large bowl

    - peeler

    - knife

    - slotted spoon, strainer, or spider


    ## Ingredients


    ### For the choux pastry


    - 1/2 cup milk

    - 3 tablespoons (42 grams/1.5 ounces) unsalted butter

    - pinch of salt

    - 1/4 cup plus 2 tablespoons gluten-free flour mix (or 64 grams/2.3 ounces all-purpose
    wheat flour)

    - 2 large eggs at room temperature


    ### For the potatoes


    - 454 grams (two or three) russet potatoes, peeled and cut into cubes

    - 1 teaspoon table salt

    - 2 tablespoons (28 grams) unsalted butter

    - black pepper


    ### For frying To make choux pastry


    1. In a heavy-bottom pot, combine milk, butter, and salt. Bring to a boil.


    2. Over high heat, pour in the flour. Stir vigorously with a spatula until a skin
    forms.


    3. Remove from the heat, transfer to stand mixer with paddle attachment.


    4. Beat the mixture to cool down.


    5. Add the egg one at a time, beating until the dough is shiny and smooth.


    ### To make pommes dauphine


    1. In a heavy-bottom pot, add the cubed potatoes and water. Cook until fork tender.


    2. Drain and rinse potatoes until the water runs clear.


    3. Rice the potatoes into a large bowl. (You can also mash them with a fork, but
    icing keeps them light and fluffy.)


    4. Fold in the melted butter and pepper.


    5. Fold the choux pastry into the potatoes until incorporated.


    6. Add vegetable or canola oil to Dutch oven and bring it to 340°F (170°C) over
    medium-high heat.


    7. Using one spoon, grab about a tablespoon of dough and plunge it into the oil.
    Repeat until you have ten balls of dough in the oil.


    8. Cook them for three and a half minutes until they’re golden brown.


    9. Transfer them to the paper-towel-covered rack in the oven. Using a slotted
    spoon or strainer/spider, collect a few balls, allow the oil to drip back into
    the Dutch oven for a moment, and then open the oven and pull the rack out to transfer
    the dough.


    10. Repeat the process two or three more times until you’ve used up the dough.

