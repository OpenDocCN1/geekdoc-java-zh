    thoroughly. After watching dozens of clips of people in Ireland and England make
    trifle, I learned of something called “trifle sponge,” which appeared to be the
    same sheet sponge I’d been baking but into small rectangles, bisected through
    the centre of the crumb, and sandwiched together with jam, instead of being made
    into a jelly roll. It was a good thing I decided to do this before I made the
    second sponge, even though I baked it for the exact same number of minutes as
    last time, it came out a hair too golden to roll.


