    Spearing tells me. Imperator carrots, in the industry, are often referred to as
    “cello” carrots, probably referring to the cellophane bags in which they used
    to be sold. They''re tough. They can survive being harvested and packed with machinery.
    They don''t shatter easily as the Nantes.


