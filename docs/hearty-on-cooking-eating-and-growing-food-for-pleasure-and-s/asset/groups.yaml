    I thrive in this abundance. But it was poverty and scarcity that taught me to
    thrive. How to understand what each ingredient was doing in any given recipe,
    and how that ingredient could be swapped, lessened, or left altogether. Because
    some of the most satisfying meals of my life have started with a problem: I’m
    missing an ingredient, or I don’t eat or can’t eat or can’t afford an ingredient
    in a meal I’d like to make.


    A substitution can be something simple, like crushing salted potato chips onto
    a baked mac and cheese instead of breadcrumbs, or something more complex, like
    using a mixture of gluten-free flours, xanthan gum, and psyllium husk gel to make
    gluten-free phyllo. It’s understanding when it is advisable to swap carrots for
    squash or sweet potato and when it isn’t. When an ingredient is contributing to
    texture or flavour; fat or acid; what the ingredient is doing in its secondary
    function, if it has one—like making another key ingredient or adding a needed
    earthy.


    And that’s why my definition of what makes a good cook doesn’t necessarily have
    anything to do with how well a person can roast a lamb or sear a steak. Instead,
    my definition centres on how well a cook can analyze a recipe in order to adapt
    it—either to make a new recipe or to make a similar one whatever ingredients are
