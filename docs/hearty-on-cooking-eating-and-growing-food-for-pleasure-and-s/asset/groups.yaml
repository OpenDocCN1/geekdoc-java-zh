    November to April, with the addition, at least on the West Coast, of cold-hardy
    vegetables with long harvest windows, such as kale, Brussels sprouts, and cabbages.


    At Coastal Cookery, owner Sarah McClean and executive chef Sean Hansen tell they
    prioritize labour, sustainability, and local growing in their decision-making
