    In early winter, when the sun is rising at 8:16 a.m. in Powell River, it''s up
    at 6:42 about 2,500 kilometres south of the Imperial Valley. The valley is tucked
    into the very southeastern part of California, near the Mexican border to the
    south and the Arizonan border to the east. It would be desert if not for land
    speculators building a canal westward from the Colorado River in 1901. (It was
    a failure of this canal that created the now heavily polluted Salton Sea in 1905).
    A new canal, the All-American Canal, was constructed in the 1930s as part of the
    New Deal and delivering water to Imperial Valley in 1940. This canal runs miles
    (about 128 kilometres) from the Colorado in the east to the Imperial Valley in
    the west, relies on gravity, and has been the sole source of water to the area
    since 1942.


    Water drawn from the Colorado River has enabled farmers in the Imperial Valley
    to grow green crops like lettuce that otherwise wouldn''t grow well, if at all,
    in this climate. But drought and overreliance on the Colorado, which starts in
    the Rocky Mountains and runs southwest to the Gulf of California in Mexico, supplying
    irrigation and drinking water along the way, mean it''s drying up. Farmers in
    the Imperial Valley draw more water from the Colorado than the states of Arizona
    and Nevada together—and their senior water rights mean they''re legally entitled
    to do so. But as the river rises to disappear, these farmers are facing cutbacks;
    they need to give up 10 percent of their supply.


    The lettuce grown for the salad I''m eating in March was most likely sown in late
    October or early November. It likes the sandy, loamy soil of the desert. As it
    was either sown as pelleted seed—a seed encapsulated in clay, which makes it easier
    to handle—using a machine called a precision planter, or it was transplanted as
    seedlings in paper pots or little cubes of soil, using a different kind of machine.
    Both machines move effectively to cover a large terrain, which is helpful since
    the average farm in California is'
  - '[PAGE 27]


    about 351 acres. This translates into the Vatican City three times over, or about
    266 football fields. If you stand at the end of the row, it''s lettuce, lettuce,
    as far as the eye can see.


    After seeding, the lettuces are usually watered by sprinklers for the first five
    to seven days, until the seeds germinate and the seedlings emerge. Farmers then
    switch to furrow irrigation; the soil is depressed between the lettuce rows and
    those paths, or furrows, are flooded, watering the lettuce from the bottom and
    the side. In this arid environment, usually takes about three acre-feet, or 3,700
    cubic metres, of water per acre to grow leaf lettuce. To conserve water, some
    farmers are switching to drip line irrigation. (But something called like these
    don''t equal more water left in the watershed; farmers often use the savings to
    increase their irrigated crop area or grow more water-intensive production.)


    The soil is helped along by fertilization—as much as 250 pounds per acre of phosphorus
    pre-planting and between 200 and 250 pounds per acre of nitrogen via side-dressing
    when the lettuces have begun to grow. Conventional herbicides are sprayed to help
    control weeds; conventional pesticides are sprayed to help control insects, such
    as aphids, leaf miners, and the silverleaf whitefly.


    The lettuce destined for my salad grows slowly but surely through the winter and
    is ready to pick by early March, let''s say March 1. It''s chilly in the morning,
    around 9 degrees Celsius, and cloudy. By noon, it will hit a high of 17.


    The harvest itself is a carefully orchestrated agricultural ballet. I''ve never
    seen it in person, but it''s a whole niche genre on YouTube.


    A farm worker who goes by Chore Vlogs, for example, films a March day in his life
    working for Andrew Smith Company in Greenfield, California: he picks out a ball
    cap, makes some coffee to warm,'
  - '[PAGE 28]


    catches a company bus to the field. “The landscape is beautiful,” he says in Spanish,
    arriving at the farm and training his camera in a slow circle, capturing the mountains
    ringing the fields. When it’s time to pick, about a dozen farm workers form production
    lines, bending, beheading the lettuce, and knocking off a few outer leaves beforeucking
    it into clear plastic bags affixed to a belt around their waists and placing it
    on the outstretched metal arms of a machine that is slowly inching across the
    field. Packers tape the bags closed and place the lettuces into black plastic
    crates and cardboard boxes and onto a conveyor belt, which runs down the centre
    of the machine, towards a truck that quickly fills with crates and boxes.


    “The speed of those guys is impressive,” says another man, David T., who films
    workers in the United States. David T., speaking in Spanish, pans the vast field.
    “We walk for hours, friends,” he says.


    The social media feeds of United Farm Workers also offer a peek behind the scenes
    and a bit of education about what farm life is like—heat, flooding, rain, snow.
    “My work is very hard,” a lettuce loader Ismael tells UFW “We work in different
    climates, cold, heat, and rain. Thanks to farm workers, the country has food.
    We deserve to be treated as people, not just tools in the fields.


    After it’s harvested, the lettuce must be kept cold—at a temperature right above
    freezing—and in humid conditions, it will keep well for two or three weeks.


    The path from the field in Imperial Valley, California, to Coastal Cookery probably
    consists of initial cold storage at or near the farm; the lettuce travels by refrigerated
    truck or rail, making its way to Sysco’s Victoria, B.C., distribution centre before
    being trucked up to Powell River.


    Sysco is one of, if not the, largest food distributor in the world. But it feels
    a bit like a black box. I know that it serves Coastal Cookery, and I know it serves
    other restaurants in the area too. Its big refrigerated eighteen-'
  - '[PAGE 29]


    wheelers park outside any given establishment making deliveries, the back door
    open, ramp down.


    The first time I try to reach the distribution centre that services Powell River,
    it''s April 2022. I ask for three things: to visit the facility, interview someone
    who can chat a bit about the produce sources for this facility, and go on a ride-along
    from Victoria to Powell River with a delivery driver. When I finally manage to
    contact someone on the phone, she says she''ll get back in touch soon to see if
    she can make arrangements. When I ask for a callback number, she says the main
    line will. But no one ever answers the main line again, and the phone system is
    labyrinthine. I follow-up emails every once in a while for a year before I give
    up.


    In Canada, Sysco has cold and dry storage facilities spanning 4,150,000 square
    feet, or about ninety-five acres. The company earned more than $68 billion in
    fiscal year 2022, growing annual sales by 36.9 percent and returning $1.5 billion
    to shareholders. “We could not have accomplished these impressive results without
    the more than 71,000 associates at Sysco, whose passion and dedication fuel our
    success,” president and CEO Kevin Hurican wrote in a letter to stockholders, opening
    the 2022 annual report.


    Reviews from drivers on Indeed—numbering over five thousand—are middling


    By the end of March 2023, a thousand drivers and warehouse workers have gone on
    strike against the company in Indiana, Kentucky, and California, alleging excessive
    overtime and demanding higher wages and better health care benefits. “We regret
    the union has chosen to walk out'
  - '[PAGE 30]


    our customers instead of working in good faith to reach an agreement at the table,”
    Sysco says in a press release about the strike in Indianapolis. “Sysco Indianapolis
    has implemented its contingency plans to quickly ramp up operations to serve our
    customers despite the Teamsters leadership’s actions to disrupt deliveries to
    hospitals, nursing homes, schools and local small businesses. Sysco Indianapolis
    has also filed an unfair labour practice charge with the National Labor Relations
    Board contesting Local 135’s bad faith bargaining actions.


    A few thousand kilometres away from the striking workers, and a bit earlier in
    the season, I’m at Blueberry Commons, where I used to volunteer, asking lead farmer
    Ron Berezan my twin questions: Could we farm locally at scale, and if so, how?
    and if conventional agriculture is going to continue to constitute the majority
    of what feeds us, can we reform it?


    “Is it reformable?” Ron echoes my question back to me, rolling around for consideration.
    “I think from the very beginning, it was predicated on a misunderstanding of mathematics.
    In other words, that you can keep subtracting and never add, and somehow continue
    to produce—it’s extractive by definition.


    Ron is referring to soil health when he describes conventional agriculture as
    extractive—to grow a crop, it takes nutrients, mines soil fertility, and adds
    back selectively, rather than holistically, to regenerate fertility. In another
    conversation, with farmer Aaron Mazurek, who owns Terra Nostra, he goes so far
    as to set the term “conventional” aside. Conventional, he says, should be what
    we call the kind of farming people have done for hundreds and thousands of years.
    What we currently call conventional—so we can distinguish it from organic—should
    more rightly'
- md: '

    be called chemical agriculture. “I prefer chemical agriculture, because that’s
    really what it is. It’s based on fossil fuels and chemicals,” he says.


    Conventional ag is not just extractive when it comes to soil fertility—it often
    relies on an extractive approach to labour that does not adequately compensate
    people for their hard work and considerable skills. Migrant workers, who make
    up a large proportion of agricultural workers in Canada and the U.S., are often
    dependent on their employers for their visas and fear retion if they speak about
    health and safety violations.


    Where ecological offences and labour offences intersect, the results can be sad,
    even gruesome: a recent paper put together for the UC Merced Community and Labor
    Center Farmworker Health Study found that for farm workers, chronic exposure to
    pesticides can cause adverse birth effects, cancer in children, genotoxicity,
    declined neuropsychological functioning, cancer, and cardiovascular diseases in
    adults.


    Posts from the UFW always carry a hashtag: #WeFeedYou. We can, with the recent
    pace of inflation and how expensive groceries are right now, to factor in the
    costs associated with this kind of agriculture we don’t pay at the till—the costs
    to labourers, and the costs to the land and water where these labourers live.
    But they form part of what goes into each and every bag of conventionally grown
    lettuce that comes to B.C. from California in the winter months and much of what
    is produced conventionally right here in the province.


    On a weekday in early spring, the first week the farmers at Terra Nostra are back
    at it for the season, Jen and I stop for coffee at my favourite local coffee shop
    and head south in her Subaru. It’s a quick drive to the farm and we’ve lucked
    out—it’s not raining. We turn left off the highway and head east a short ways
    until we reach a red building with metal siding. To the right, there are a few
    tiny homes. To the left, the fields are blanketed in a light dusting of cover
    crops, and a bit farther, a ridge, or hill, with a yurt nestled amongst some trees.
    (Every small coastal farm in B.C., from my experience, holds about a 33 percent
    chance of yurt.)


    Jen us us into the building. A whiteboard outlines farm chores; they’re from the
    end of last season, Jen says—they haven’t quite flipped things over yet for the
    year. A card tacked to the whiteboard reads, “Farm to Table and Table to Soul.”


    Soon, Aaron Mazurek arrives. They’re behind schedule this year because of the
    cold snap, he says while giving me a tour. They’ve prepped and seeded some of
    the soil in the 32-by-165-foot greenhouse—with spinach, spring mix, radishes,
    salad turnips, beets, and carrots—and have started some allotments, but we are
    catching up today on lettuce and brassicas.


    This is the farm’s eighth season, and by now they’ve got their schedule “pretty
    dialed in,” Aaron says. The plant varieties they’re growing—over a hundred on
    about three acres—are organized by field and planting date, colour-coded in a
    white binder.


    I help seed lettuce in 128-cell trays. We add soil, compress it a bit, and place
    a rectangular wooden block fitted with 128 small dowels, upside down, which creates
    a divot in the centre of each cell. Next we place a pellet seed into the dolly.
    When the tray is full of seeds, we add more potting mix on top, compress again,
    and wipe off the excess. We carry the trays over to flood tables, also known as
    ebb and flow tables; each of these holds 14 trays, and they fill and drain from
    the bottom, rather than overhead. This waters the seedlings more efficiently and
    helps prevent damping off—the disappointing death of baby seedlings following
    their initial eruption from the soil. In about three weeks or a month, when the
    seedlings are strong, they''ll be transplanted outdoors, where they''ll be watered
    using buried drip line. The water feeding Terra Nostra''s farm comes mostly from
    a drilled well.


    The greens we''re starting today will crop in about seventy days. The lettuce
    destined for Coastal Cookery is an organic analogue of Salanova, productive in
    a number of sub-varieties for salad mix. The pelletized seeds look like little
    forbidden Cadbury Mini Eggs in my palm. Terra Nostra will grow red leaf lettuce
    and some other varieties to add flavour and texture. These lettuces are one of
    their top sellers; they''ll seed well to keep up with demand. About 1,600 lettuce
    plants fit into each of Terra Nostra''s two-hundred-foot rows.


    Aaron mooks through the harvest process. The farmers will head into the field
    first thing in the morning—the cool start of the day will find the lettuce at
    freshest and tastiest. (Picked in the heat and direct sun of the afternoon, it
    is grumpy and bitter.) Aaron grabs a bread knife and mimics the act of harvesting;
    they''ll cut an inch or two above the ground, peeling off a few outer leaves,
    and the lettuce will regenerate, allowing them to get two or maybe even three
    harvests from each plant before replacing them with a new hardened-off seedling.
    Once it''s cut, it goes into a big blue Rubbermaid and then into the walk-in cooler,
    which is kept at 2 or 3 degrees. Each Rubbermaid holds twenty pounds of lettuce,
    and they''ll fill three or four bins per harvest, tallying sixty or eighty pounds.


    After it''s harvested, it goes into the bubbler—a big metal trough that has a
    Hudson valve, which switches off the water when the tub is full, whoever is harvesting
    can busy themselves with other things. Two pipes in the bottom of the greens washer
    are connected to a jacuzzi pump, and they agitate the greens gently to remove
    dirt. Next, bright orange tubs that look like laundry baskets are used to scoop
    the greens up and move them to a salad spinner. The goal at this point is to get
    as dry as possible, Aaron says. By about 5 percent of the lettuce crop will be
    lost to wireworm, Aaron says, but he’s not too worried about it.


    Back-of-the-napkin math, Aaron calculates would take a hundred farms the size
    of Terra Nostra to feed the fourteen thousand or so people who live in our area.
    And that’s just for vegetables—we’d also need grains and pulses, meat, and dairy.


    While an eating-local-at-scale scenario probably means that we would (societally)
    need to eat far less meat and dairy than we currently do, cutting it entirely
    isn''t feasible or, in the long term, desirable. Meat and dairy are high-calorie
    foods that are important in the winter months in cold climates, and the manure
    from animal agriculture, like that the pigs and chickens being raised at Terra
    Nostra, is an important source of soil fertility.


    In the winter, we could potentially use the greenhouse—in our zone, cooler-weather
    crops will grow in unheated greenhouses—but the plants would grow much more slowly,
    as we''re almost at the fiftieth parallel here, and on our darkest winter days,
    we only get eight hours of sun.


    “Light is the limiting factor,” Aaron says.


    Of course, eating local (or farm to table) isn’t always a synonym for sustainable
    or ethical or labour-friendly. One of the most cited exemplars of the form used
    to be Dan Barber, the chef and owner of Blue Hill at Stone Barns; the concept
    of his restaurant is a menus prix fixe where the day''s dishes are determined
    by what’s harvested on-site. But a three-part exposé published by Eater in 2022
    detailed an environment “rife with grinding pressure and explosions of anger.”
