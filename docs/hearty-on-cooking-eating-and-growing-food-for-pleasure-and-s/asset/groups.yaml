    这个世界。正如物理学家兼活动人士万丹纳·希瓦（Vandana Shiva）所说：“种子是为了更新、繁衍、分享和传播而生的。种子就是生命本身。”


    在一个反常温暖干燥的10月午日，我在盐泉岛（Salt Spring Island）距离恒恒河港（Ganges Harbour）一多公里处名为 Root 的当地农业枢纽，遇到了几位来自斯托尔湖农场（Stowel
    Lake Farm）的农民。Root 由盐泉岛农场信托（Salt Spring Farmland Trust）运营，拥有一个商业厨房、食品储存空间、会议空间和一个办公空间。它还入驻盐泉岛种子保护区（Salt
    Spring Seed Sanctuary），这是一个致力于保护和推广授粉传粉物种的慈善机构。其数据库包含115个品种；577名成员进行育种，汇报植物的生长情况，并从最好、最强壮的样本中收集种子。他们在2022年的夏季简报中写道：“我们的格言是，良食源于良种。”


    今天，Root 提供了另一项服务：它与 FarmFolk City 合作，带来一台移动种子清洗机来到岛上，处理她自种的扁豆。当我到达时，一位女性正在使用清洗筛进行处理。麦根·麦克希恩（Meghan
    McEachern）是斯托尔湖农场的首席农民，她和其他五六名农民一起，带着几个 Rubbermaid 桶，里面装满了需要清洗的大袋种子。


    在 FarmFolk City 工作的 Siri van Gruen 向我展示了脱粒机，那是一台红白相间的机器，通过剧烈的运动将果荚和种子从外壳中分离。Siri
    将黑麦籽放入料斗。种子掉过筛网从机器侧面排出，经过滑槽掉入一个等待的蓝色 Rubbermaid 桶中。杂壳则通过机器排出，并喷射在等待的接口上。筛网有两种尺寸——较小的用于谷物，较大的则适合豆类。她告诉我，她见过的最奇的用途之一是给一个制作荞麦枕的人用的，那个人的重点是获取壳而不是种子。


    来自斯托尔湖的农民 Thea 尝试用脱粒机处理萝卜种子；虽然种子本身相对较小，但包裹在坚硬、膨胀且难以破开的果荚中。脱粒机显然不是果荚的对手，于是 Thea
    转向了一种被称为脱粒箱（threshing box）的设备：它是木制的，地板有凹槽，大到站进去。Thea 穿着靴子踩萝卜，随着脚底画半圆移动，压碎了顽固的果荚。


    Siri 接着演示了风选大师（Winnow Wizard）。这台机器更大，顶部有一个料斗。斯托尔湖的农民向里面加入了一些菠菜种子。料斗中的螺旋杆将种子从果荚中抖落。风扇——对于菠菜这样的小种子设为低速，对于豆类这样的大种子设为高速——吹散杂壳，种子被引导进一个木箱。我不知道为什么，我原以为菠菜种子看起来像羽衣甘籽：小、深色、圆。相反，我发现它们看起来像荞麦仁。看着脱粒机和风选大师工作非常着迷。尽管现场嘈杂，他们的工作依然非常精细。看到果荚被如此高效地处理真是令人欣慰。


    “麦根，你头发里有很多杂壳！”有人——是 Thea 还是 Hannah——在大喊，而风选大师继续工作。


    当 Thea 完成压碎萝卜果荚后，她使用发电机驱动的空气压缩机吹掉箱子里种子上的杂壳。


    机器的噪音加上产生的物理分离，很难交谈，有时甚至不知道有人正试图说话。记录了半小时笔记后，我在 Root 的碎石停车场找了个地方坐下，用几把手动种子清洗筛，慢慢处理花种。首先是德克萨斯蜂鸟鼠草（Texas
    hummingbird sage），一种鼠尾草植物，它的种子保护在小果荚中，我用手把它们放在金属筛上揉搓使其破裂，落入等待的木箱中。接着是混合波斯菊，长细的种子伴有大小相似的杂壳，最容易分离的方法是轻吹吹筛网，直到它们随风飘走。最后是倒心金菊（coreopsis），它也将种子保护在花朵基部的一个小果荚里。


    当机器安静下来，我与斯托尔湖的农民们聊天。除了菠菜和萝卜，他们还在处理芥末、芝麻菜、甜菜、阿米什豌豆、生菜、小葱等。小葱的种子头出奇地蓬松；我从未猜想过。同样，我从未猜想过种子本身是如此迷人。但事实确实——每一颗小小的种子都包含着一个与其相对巨大的潜力世界。


    我们保留一些种子是为了再次种植蔬菜或花卉。另一些是双用途的。我们在烹饪中使用的干豆和豌豆是明年要种的。芹菜种子吃起来和芹菜一模一样，可以用于豆子沙拉、油醋汁、汤和浓汤。芥末科植物（也称为十字花科）的种子，如西兰花，可以用来制作颗粒芥末酱。南瓜种子可以烘烤。


    当像羽衣甘籽这样的植物长出花梗并结实时，它们的高度会飙升到收获季节高度的两、三倍或五倍。随着植物能量转向繁殖，它的叶子会变苦；此时，它在花园里占据空间是为了制造未来可收获的植物，而不是继续让自己被收获。某些植物，如芹菜——或又是羽衣甘籽——每株产生的种子数量惊人，超过了家庭园艺者合理使用的量。两者都始于极小的种子，小到会消失在手心的纹路中。

