    “There’s no such thing as ethical food,” a farm worker told me a few years ago,
    near the end of the growing season. “More ethical?” I asked,

    referring to our local context. He shrugged, conceding.


    “There certainly is a tendency to think that small farm, local farm,

    organic farm, all equal good farms,” says Antonio De Loera-Brust, communications
    director for the United Farm Workers. “And maybe those

    things are good for other reasons. But there’s no correlation with you, know,

    being small, local, organic [and] necessarily treating your workers right.

    You can be doing all that stuff, and that does not in and of itself mean that

    you’re going to treat workers with the dignity they deserve.


    One of the most “stunning” farming statistics is that a high percentage

    of farm labourers struggle with food insecurity, De Loera-Brust says. “The

    very workers who are feeding us often struggle to put food on the table for

    own families.”


    The solution, he says, is for workers to unionize. California is only one

    of two states in the U.S. where agriculture workers have the legal right to

    unionize. (The other state is New York.)


    De Loera-Brust also recommends that consumers focus on buying food

    from unionized farms. Co-op and independent grocers focused on organics

    or sustainability can opt to make this part of their purchasing strategy.

    Though it’s trickier, consumers can do it themselves by checking the labels

    or fruit stickers for the farm name, De Loera-Brust says, and by writing to

    the grocery chain to note their preference for union-grown food.


    Another consumer mindset shift might involve opting to eat seasonally,

    including consuming fresh greens in the winter. In Canada, this

    means we eat things like salad from May to October, eschewing them for

    stored root vegetables and pickled, frozen, and dried vegetables from'
