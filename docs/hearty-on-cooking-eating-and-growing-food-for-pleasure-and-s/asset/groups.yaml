    of technical stuff, all gluten-free. I’ve made Italian meringue for a s’mores
    cake; I’ve perfected my Swiss meringue buttercream used it to frost a half-sphere
    cake I then painted with food colouring gels to resemble the planet Jupiter. I’ve
    even made more perfectly fine macarons with egg whites. What I have not yet succeeded
    at this cursed recipe.'
