    In-May, and in early June, for ice cream sandwiches, because it was popular, mint
    ice cream with David Lebovitz’ recipe for fudge ripple.


    I thought about conversations about mortality I used to have with my father as
    a child. What happened, I asked him, often, when a person died? He told me some
    people believe in God, and when you died, you went to some kind of afterlife.
    He said he personally did not believe in God or an afterlife. When that’s it,
    that’s it, he said. Believing the second scenario to be more likely, I kept pressing
    him, over years, for details. What happened then, I asked. Where did your being
    go? Back to the earth, my dad told me. To rejoin the earth and turn into something
    else. Nobody knew, really, about consciousness. That unknow was ultimately the
    scaffolding of religion. The goal of life was to learn how to live with uncertainty,
    rather than trying to build a scaffolding for it.


