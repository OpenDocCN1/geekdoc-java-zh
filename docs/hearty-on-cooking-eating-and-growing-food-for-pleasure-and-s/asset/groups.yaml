    seeds, fennel seeds, wild celery seeds, and fenugreek seeds, in hot oil, and then
    you add minced ginger and garlic. After a few seconds, you add dried hot chilies.
    And then chopped tomatoes, some sugar and salt, cover, and let it cook down. At
    the end, she says, you add a big green chili or two, just so the spice comes out,
    and then we some dried mango, so it reconstitutes, adding sweetness to the chutney.
    “That is just an absolutely wonderful chutney,” she says. And a pretty standard
    Bengali fresh chutney.


    In Britain, Collingham says, a pickle could be described as vegetables in a clear
    vinegar sauce; a chutney would be a bit messy, with everything incorporated and
    less distinguishable. They’d both use vinegar, unlike the vast majority of Indian
    chutneys, relishes, and pickles.


    My nana’s chutney is pretty dissimilar to most South Asian tomato chutney recipes
    I find online, other than the tomatoes and the use of spices such as turmeric
    and cloves. It doesn’t bloom its spices; it treats the tomatoes overnight with
    salt, uses vinegar, uses bell peppers rather than chilis. But it bucks British
    pickle trends, too, by using white sugar and white vinegar, alongside more familiar
    English pickle staples like tomatoes, apples, onions, and mustard.


    It may not taste like Bengali tomato chutney, but it also tastes very unlike Branston
    Pickle, which is made using barley malt vinegar, sugar, apple pulp, tomato purée,
    date paste, and “vegetables in various proportions”—namely those that grow easily
    in the U.K. and have been around for a while: carrots, rutabaga, onions, and cauliflower.


    In a Spectator article that makes a case for Branston Pickle as a national treasure,
    Aimee Kote writes, “There is something pleasing about its ugliness: brown and
    lumpy. A rebuke to Instagram. The unassuming appearance makes its delightful flavour
    all the more surprising: the vinegary tang, the gentle spice, the sweet fruitiness,
    all in perfect balance.” (He also writes that Branston Pickle, which is a bit
    reminiscent of Bengali'
  - '[PAGE 60]


    date and tomato chutney or Rajasthani sweet and sour lemon pickle, “has the hallmarks
    of Empire.)


    To me, Branston Pickle tastes sweet in the way that molasses or treacle tastes
    sweet—with a profound sass, and umami, note. I don’t like it.


    When I first became curious about where my nana might have gotten her recipe,
    research led me to a type of chutney popular on the East Coast of Canada and in
    the southern United States. Called chow or chow chow (maybe after “choux,” French
    for cabbage), some recipes for this chutney, maybe more aptly called a sweet relish,
    overlap quite a bit with my nana’s. One recipe, billed as Southern Chow and claiming
    regional coverage from Kentucky to Florida, says it “take you a step back in time
    to Granny’s kitchen.” It uses white vinegar and sugar and similar spices to my
    nana’s and includes onion and green and red peppers. But it omits pickles, contains
    green tomatoes instead of twenty-four tomatoes, and uses six cups of shredded
    cabbage, a vegetable that never came within a metre of my nana’s chutney.


    Collingham suggests a different origin. She wonders if my nana made was adapted
    from another popular—but not quite as enduring as Branston Pickle—British chutney
    called piccalilli. “Instinctively,” she says, “my sense is that it’s probably
    coming out of both traditions. The desire to have sharp condiments with roast
    meat, which is a very old kind of Anglo desire. And the actual pickling spice
    profile sounds like a tomato version of piccalilli. The spice profile could have
    been influenced by Indian spices.


    It sounds very similar, she says, to piccalilli recipes from the 1920s in sources
    like Good Housekeeping. When she was growing up in the 1970s, her granny might
    have made piccalilli. But she hasn’t seen it at the stores or anyone’s kitchens
    for a while. (Incidentally, when Atkins confesses a'
  - '[PAGE 61]


    dislike for Branston Pickle, he tells me he does like, and makes annually using
    vegetables from his garden, a mustard-forward variation of piccalilli.)


    And it''s possible that my nana made a tomato variation wherever we grow tomatoes,
    we seek ways to preserve the summer glut of them, Colingham says.


    As I end research, I still don''t have an answer. This is a field, Atkins tells
    me, that hasn''t been terribly well researched yet. (Fleetingly, I consider the
    prospect of doing a food history PhD.) Though I don''t have a variety of possibilities
    and lineages to consider. It''s possible my nana ate piccalilli in England, brought
    a recipe over, and adapted it. It''s possible my nana carried with her, like my
    dad''s family did, the idea of eating cheese and chutney, was introduced to chow
    chow, and adapted that recipe based on what my grandfather grew in his garden
    and what they liked to eat. It''s possible her recipe came from her mother. It''s
    possible it came from a family she nannied for when she first came to Canada.
    It''s possible she cribbed it from a magazine, either in the U.K. or in Canada.
    It''s possible she saw it in on the back of a bottle of vinegar. Who knows.


    Ultimately, I''m okay with this uncertainty. And now I''m curious if my nana would
    have stopped making this chutney if I hadn''t had such a voracious appetite for
    it. Which makes me a bit funny: as an unwitting working-class settler born in
    the 1980s in Canada, it''s possible my affection for my grandmother and her chutney
    kept this condiment, with tangled colonial roots, alive.'
