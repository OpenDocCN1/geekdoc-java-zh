    the spice level of the dishes using cayenne pepper; one of the most popular recurring
    pranks we played on each other was to tip a pinch into a co-worker’s almost-finished
    Diet Coke, offering them a little wake-up kick.


    After I worked at the restaurant for a while, the apartment above it went up for
    rent, and I moved in with my then-partner and his childhood friend. Eventually,
    they worked at Curry too. After shifts, we drank at a bar a street over called
    the Jimmy Jazz. Smoking indoors was no longer legal in Ontario, but there was
    a loophole in the bar’s back patio, which was semi-covered by an arbour and set
    up with wooden benches and teetering tables propped up by layers of weathered
    cardboard coasters. We drank pitchers of beer, and on Tuesdays, two-dollar mixed
    drinks.


    By then, I was in my early twenties. I vacillated between overachieving and crashing
    and burning. High grades were then the primary way I understood myself as having
    value in the world. But I often felt like a garbage person. Classes had easily
    understandable rules; were some university-wide, and others classroom- or instructor-specific,
    and after settling in for a couple weeks, I understood these rules. But the unstructured
    time between classes—in hallways, in professors’ offices, in social situations—were
    crevasses. I knew I could not be myself, unless I was to performing a version
    of myself that was funny or palatable through studied self-deprecation. Some of
    the things that had happened in my childhood felt unsably shameful. I meant to
    escape them and then did not; my partner had become an alcoholic, much like my
    mother, and I again felt like I had to hide that reality from polite society.
    Much of my interior life, and my coping mechanisms, felt out of bounds.


    In the small kitchen of the restaurant, however, heating up curry and deep-frying
    pokoras and bhajis and gently whisking yogurt into warm milk, I did not owe my
    co-workers sanity. They ribbed me lightly for wearing closely related iterations
    of the same bargain-basement outfit every day, saying I resembled a cartoon character.
    We listened to the same CBC shows regularly, mixing them in with albums we could
    agree on: Modest Mouse’s Moon & Antarctica, the Streets’ Original Pirate Material.
    I was fucked up, I knew that. But they all were too. In ways I could recognize.
    In ways that let me be at ease, the person I was.


    We were also chronically broke. Towards the ends of our shifts, if we’d made enough
    tips, we pooled our money and sent someone to the liquor store for Forty Creek
    whisky or vodka, usually Stoli. And we smoked a lot of pot. I stopped around the
    time I recreational drugs on lithium—you are definitely not supposed to take recreational
    drugs while on lithium. I started smoking Belmont Milds, though, feeling bumming
    them off Tim so I could avoid feeling like I was really a smoker.


    A few summers earlier, when I’d had my first hypomanic episode, which landed me
    in the ER, I was working three jobs. My Parks and Rec gig—expected me to arrive
    at the same time every day, be pleasant to park visitors, and leave at the same
    dinner hour daily—became too much. But the others, food service gigs with variable
    schedules, I could even while coming off a combination of Paxil and benzodiazepines—I
    was on two, one for panic attacks and one for chronic anxiety—cold turkey.


    That fall, when I returned to school, I was too poor to work. As I adjusted to
    a new regimen of medications, processed the chaos and trauma of the preceding
    summer, started second-year university courses, and discovered that cognitive
    behaviour therapy and group therapy were not going to work for me, I searched
    for jobs. Specifically for jobs in food service, working in the kitchen. I knew
    a kitchen was a place I could work while I was not fit to be seen by the public.
    And That’s when I found Curry.


    As long as I showed up, worked my shifts, and fulfilled my duties, I would get
    my cheque and pay my rent and buy my groceries—even as I was having my blood taken
    regularly to measure its level of lithium. And even as I was still regularly hallucinating—hearing
    voices and seeing birds indoors, in places they could not have been.


    Much has been written and said about how kitchens are unsafe places for women
    and queer people and racialized people, shot through with cruelty and harassment—in
    particular if the kitchen follows the strict hierarchical structure of fine dining,
    adopted from the French tradition. Kitchens also underpay workers, compounding
    that underpayment with wage and tip theft. But like many things in life, it’s
    more complex than that. Kitchens, they’re always hiring (so it’s easy to leave
    and go elsewhere), no one gives a shit what you look like, and if you are battling
    some personal demons, you’re generally not alone. In fact, if you’re used to dysfunction,
    they can feel very much like a second home.


    One night it was snowing. Curry was very slow, takeout orders only, and my partner
    created an entire board game designed to help us get drunk. He called it the Spins
    Family Board Game. One square required us to throw frozen peas into a red solo
    cup from across the room, taking a shot for every pea that missed the cup. Another
    had us turn in circles, our foreheads pressed to a baseball bat. Every time a
    delivery driver or customer came to pick up an order, we were temporarily quiet.
    After they left, we resumed the game.


    Sometimes at Curry, I joined in when everyone drank, and sometimes I went home
    alone and studied. And sometimes I was uptight, short-tempered with my friends
    for drinking so much, when really the problem was that I wanted to be surrounded
    by sobriety but didn''t know how to seek.

