    “I just finished watching the movie The Menu again, to drink it in,” Maharaj tells
    me. “It’s a scathing indictment of fine dining culture, on both sides of the counter.


    “Places like this, scenarios like this, have nothing to do with hunger. This is
    performance and art status and conspicuous consumption. Do the cooks have to be
    able to eat that? This is not about four square meals a day, right? It''s 1,250
    dollars a plate.


    But, Maharaj says, there is an inextricability connected to food that makes the
    gap between cooks’ wages and the price of a meal seem worse, whatever the restaurant—because
    food, alongside shelter, air, and water, is a basic building block of survival.
    Culinary culture, Maharaj says, conditions chefs to believe that at the early
    juncture of their careers, they should be okay with poverty and starvation; this
    period represents the hardship before the chef gets to become “some sort of wild
    dictator” running their own kitchen. But despite what we may be indoctrinated
    to believe—and despite how far any fine dining plate represents performance and
    art—there’s something within that we finds this gap fundamentally unjust.


    Maharaj contrasts the chafe of fine dining to The Stop Community Food Centre in
    Toronto, and the level of satisfaction she had in knowing her knowledge and labour
    were actually being helpful to people, participating in what she characterizes
    as a basic human connection. “My job is to highlight and underline the fact that
    we don’t do anything that takes us far away from meeting this very basic human
    need,” Maharaj says. “Because it’s food! I think it’s reckless and irresponsible
    for us to let food become a thing that this is unattainable for people. It’s fucking
    nuts. We should not let it get this crazy.”'
