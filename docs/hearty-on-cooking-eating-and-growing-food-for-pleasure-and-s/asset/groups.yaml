    What’s harder for an individual person or family to do at a grocery chain, in
    other words, it is easier for institutions to do at scale.


    ![](img/b511df8691509de551f227f92620fd02_39_0.png)


    So change is possible. But it’s tricky. Lettuce, for example, can be grown as
    a greenhouse crop year-round but requires additional light (and sometimes heat)
    in the winter, which can be a costly energy draw. In some areas of the country—including
    Windsor-Essex, prime Ontario growing land, where electricity demand is expected
    to double over the next five years—greenhouses are the largest draw of increased
    demand for electricity.


    One new B.C. business, based in Pitt Meadows, recently told the CBC that it could
    produce “up to six million bags of salad greens” per year—baby leafy greens, grown
    vertically, using grow lights. The vertical farm, according to one of its owners,
    “uses 99 percent less agricultural land, 99 percent less freshwater, and 99 percent
    less fertilizer than farming practices.” But the article leaves out electricity
    use—a key factor when growing vertically and indoors. Part of the goal of local
    agriculture is to cut down on energy expenditures in shipping, indoor farming
    does not present a viable solution.


    Aaron from Terra Nostra suggests a different, much simpler, if more labour-intensive
    solution. There’s a great book called Farmers of Forty Centuries, he tells me,
    written by Franklin Hiram King, who toured China, Korea, and Japan in 1909—before
    commercial fertilizers were available. These intensive systems, Aaron says, recycled
    of the human and animal manure, all of the vegetable waste, and it back into the
    system, and the'
