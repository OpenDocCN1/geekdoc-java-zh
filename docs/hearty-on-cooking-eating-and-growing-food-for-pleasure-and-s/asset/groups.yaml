    ## 大口朵食的奇观


    2011年，杰夫·戈迪尼（Jeff Gordinier）为《纽约时报》写过关于名人专中包含大口朵食现象的文章。他写道，这些报道通常描写一位“身材纤细且灵动”的女星如何点并吃下一份为“饥饿的码头工人”准备的餐食来打破读者的预期。他提到了詹妮弗·劳伦斯、佐伊·萨尔达娜和凯特·布兰切等案例，并点名《时尚杂志》（*Esquire*）——他后来在该杂志担任了五年的食物饮料编辑——是该类型尤为频繁的贡献者。戈迪尼补充道，这种现象现在已经频繁到有了一个专门的名字：“公开进食的记录实例”。


    与那些关注演员为了特定角色而减重或增重的报道不同，公开进食的记录实例标志着名人的消瘦与美丽似乎是不费而为的。一个瘦女人在公共场合大口朵食的想法，比一个胖女人在公共场合吃饭更容易让人接受，或者大卫·贝贝汉姆承认维多利亚·贝贝汉在二十五年来一直吃同样的烤鱼和蒸蔬菜这种低热量晚餐更为难以接受。


    这些报道反映了我们文化对纤瘦和“肥胖”的痴迷，反映了我们对“人的道德可以清晰地通过身体呈现”这一观念的执着，即对“正确”或“错误”选择的积累。公开进食的记录实例之所以如此引人注目并成为一种陈词，是因为它蔑视了这种预期，展示了一个“正确”的身体做出了“错误”的选择。那个在吞噬汉堡时保持苗条的酷女孩；那个食欲的对象展示了她有自己的胃口。（我唯一不确定的是，我们是否应该承认为了完成这场短暂的公开表演而在幕后付出的努力。）


    但显然，当公开进食的记录实例变成一个厨师的公开进食记录实例时，名人专中的这种多余行为其意义就发生了变化。


    当我们观看关于烹饪的电视节目——或 TikTok 或 Instagram 的短视频——时，食物是核心。看着别人烹饪，我们学习食材和技巧。我们还在想象成品尝起来可能是什么味道，质地又是怎样的。


    于时间和距离将我们与食物隔离开，我们通过厨师的反应来间接体验。但如果是盖·菲耶里（Guy Fieri）吃塔可，与一位漂亮的女厨师吃她的任何作品，体验又是不同的。


    而且是否经常存在戈迪尼描述的类似动态——公开可见的食欲根据你的性别、体型、性取倾向、种族意味着不同的含义。这绝不仅仅关乎食物。


    在《两个胖女人》（*Two Fat Ladies*）中，克拉丽莎·迪克斯森·莱特（Clarissa Dickson Wright）和詹妮弗·帕特森（Jennifer
    Paterson）骑着带侧边的摩托车来到海边，在便携炉子上用黄油、葡萄酒、红葱和欧芹煮贻贝。当她们剥壳并吃下丰满的小贝类时，麦克风记录下了她们嘴里发出愉悦的啧啧声。


    尼格拉·劳森（Nigella Lawson）向锅里倒蜂蜜，用手指接住瓶子里滴落的一滴，然后将其放入嘴里。


    盖·菲耶里是该类型中不加修饰版的易选人：看五分钟的食物频道，你就会看到他把帽子檐转向后面，以便更好地咬卷饼。《你得吃这儿》（*You Gotta Eat Here!*）的主持约翰·卡图奇（John
    Catucci）也是如此，他的工作与菲耶里相似——用嘴含住大得惊人的汉堡或炸鸡块，体现出对味道的狂热渴望。


    安东尼·波波登（Anthony Bourdain）吃得很香，通常是在聊天时；在节节目的宣传照中，他经常被捕捉到正要把筷子或勺子送到唇边，让他看起来似乎正要开始用餐。


    当亚历克斯·瓜尔纳舍基利（Alex Guarnaschelli）在《切碎》（*Chopped*）中担任评审时，她会戳、咬、评估。她的脸在进食的愉悦瞬间或相反的、不安分析瞬间之间切换。《切碎》中的女性评委比男性少；瓜尔纳舍基利并没有软化她的反馈，并不总是很和，经常穿长袖衬衫。（穿长袖是一个女性被允许融入食欲而不同时成为食欲本身的对象的一个指标。）


    在《每天40美元》（*$40 a Day*）中，瑞秋尔·雷（Rachael Ray）发出“嗯”的声音，抬头看着天花板。在《30分钟晚餐》和她同名的（且人气极高的）电视节目，她说“Yum-of”的频率几乎和“EVOO”（特级榨橄榄油）一样，两者并用。（她在镜头前食物的热情只有盖·菲耶里可以匹敌——虽然菲耶里长期被批评的土气有有说服力的辩护者，而雷没有。相反，YouTube
    上的关于她旧节目的评论集中在一个事实上：她的身体比她二十多岁开始主持美食电视节目时要大。）


    帕德玛·拉克什米（Padma Lakshmi）在勺子再次回到她的碗里时，分享了一个热情的“嗯”。她小心地吃一根肋骨，方式不会让酱汁弄在脸上或在手指上留下太多——就像我奶奶教我怎么吃肋骨一样，如果我在认识她的大部分时间里不是一个固执的素食者的话。


    将拉克什米和劳森与臃肿的男厨师相比，你可能会认为这两位女性需要勾选更多选项，而获得的机会更少。显然她们也喜欢自己品尝的食物。但对于劳森——对于在开始节目《味道国家》（*Taste
    the Nation*）之前的拉克什米来说——相机捕捉她们享受的方式有一种微妙的、闪电般的差异。我们被要求想象她们正在尝到什么。但这种愉悦向外融，停留在她们的身体和感官上。在真空环境下，这很好。


    但归结底，结果是一样的：一个人越接近男性化和白人化，越能成为探索和品尝的化身——而对于具有魅力、发型完美、着装得体、美丽的预期就越少。


    但情况并非一直如此，我不认为这是观众真正想要的。与电视烹饪相关的持久个性并不一定有吸引力。他们有空间表现得有点古怪、高大、肥胖、牙歪、反常。让烹饪节目主持人变得像《空间大改造》（*Trading
    Spaces*）中制作家具的木匠那样平庸、漂亮且平易近人，是一个错误。

