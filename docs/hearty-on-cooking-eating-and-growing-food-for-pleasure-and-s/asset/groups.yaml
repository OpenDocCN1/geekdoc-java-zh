    今天，与其在工作，我更想烤个蛋糕。我的冷冻里有半杯浓缩的树莓果泥，旁边还有做冰淇淋酱时留下的蛋蛋白。我脑海中构思着一个双层树莓白蛋糕，抹上巧克力瑞士蛋白糖奶油霜——这可能是一个耗时两天的项目，因为我最喜欢的烘焙方式是不紧不慢地，一边听有声书。


    这种对食物的构想对我来说非常愉悦。当我生病时——最终我被诊断出患有一种与细胞膜不耐“密切相关”的慢性胃炎——我的思绪经常转向我可能会吃什么，或者很快就会变成一种近乎绝望的方式。回想起来，我的身体一直在伤害我。在某些早晨或下午，当我做当时那份通讯工作时，我会发现自己自己在走神，完全没有意识到思绪是从何时从那些错误的并行逻辑转移到了我什么时候能吃上一块烟熏三文米饼。


    如果你现在为我拍张照，把它和我生病时的照片放在一起，用 IPS 相机拍摄加拿大的人并问他们哪一张是“之后”，大多数人可能会选择更瘦的那个我，不健康的那个，因为这就是我们被灌输的健康观念方式。


    但我现在更健康了。我更强壮了，吃完饭很少感到不适，食欲也恢复到了我觉得正常的水平。我的心理状态也更好了。思考食物就像是一个阳光明媚、微风徐习的日子，而不是热岛效应期间那种折磨人的潮湿天气。当我形容自己是“快乐地肉肉”时，我是认意的。


    随着我身体的康合、体重的增加以及我能够消化更多种类的食物，我对杏仁奶、奇亚籽和向日葵籽的依赖减少了，我回到了牛奶和花生酱。尽管我选择了吃肉，但肉在我的饮食中比例仍然少于豆类、鸡蛋和豆腐。美国人均肉类消费量每年约为225
    磅，而我只吃 10 磅——除了我怀孕、贫血期间定期在蒙特利尔 Jean-Talon 市场的肉铺主那里购买牛肉边角。


    对我来说，一直很奇怪，像安东尼·波波丹（Anthony Bourdain）这样的厨师竟然认为这意味着我拒绝了对“食物的纯粹享受”。相反，这感觉像是我付出了双倍努力来保留贪吃的快乐。为了保持健康，我必须避开麸质，所以我学会了不含麸质的烘焙和烹饪。我拒绝肉并不是为了拒绝快乐；快乐随处可见。


    - 也就是说，文章和评论——而不是食谱。有很多优秀的素食食谱。

    - 一张常用的 Adusters 图片是一个有着大肚子的、穿着背带的男人。在 2008 年第 80 期封面上，这张图片的变体配有文字：“自由不是免费的。这是对免于匮乏的滥用。”另一张显示了两个没有头的人，都有大肚子——一个是胖子，另一个是饥荒者——配上讽刺的说明文字：“毫无联系”。第
    83 期刊登了 Henrich Kimerling 的《美国美女》——一张穿着比基尼、周围环绕着便利食品的胖女照片——位于对页写着“贪婪”的跨页上。


    ## 两袋生菜


    周三下班后，我和威尔（Will）劝说辛莱尔（Sinclair）穿上一件蓝色波点抓绒外套穿上靴子下市中心。春天温暖明媚，天空是蔚蓝色的。我们走到沿岸烹饪（Coastal
    Cookery），那是当地的一家餐厅，可以俯 Tex Texada岛和 Ahgyk 岛之间的 Algerine 海峡。对于这个季节来说，海面很平静——波浪很小，有些还泛着温柔的白色浪花。


    辛莱尔点了儿童菜单上的炸鱼和薯条以及橙汁；威尔点了鸡肉华夫饼和啤酒。我通常点肋排，它们酥软到脱骨，配有土豆泥和时令蔬菜，但今天感觉更像是吃沙拉的一天。我点了野外蔬菜和一份无糖可乐。


    我们的朋友克莱尔（Clare）在工作，当服务生端上我们的食物时，我们正在聊天。我的沙拉堆在长方形盘子里，那是我身体一直渴望的植物盛宴。


    当我三月吃下这盘沙拉时，主厨肖恩·汉森（Sean Hansen）告诉我，餐厅通过食品配送商 Sysco 储存生菜，该配送商利用全球供应链全年供应农产品、海鲜、肉类禽类、乳制品和干货食品。为了服务加拿大西岸，在深秋，这些生菜生长在亚利桑那州的尤马（Yuma）——根据农民工人联合会主任
    Antonio De Loera-Burst 的说法，那里是世界上阳光充足的地方之一，也是“冬季生菜之都”。


    从 6 月到 10 月，沙拉里的生菜将来自 Terra Nostra（意大利语意为“我们的土地”），这是一座距离这里开车十分钟或骑车半小时路程农场。那是我的朋友珍（Jen）与其他五到六名农工工作的农场；威尔和我过去几年里一直从
    Terra Nostra 购买社区支持农业（CSA）蔬菜盒。

