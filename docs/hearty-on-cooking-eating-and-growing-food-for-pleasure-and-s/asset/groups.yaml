    and by people making living wages or receiving enough social or disability income
    to have the time and mental space to lessen food waste.


    These incremental steps would help us make the shift to more sustainable agriculture.
    Supporting unionized labour at home and abroad, as De Loera-Brust suggests, would
    have immediate material benefits for farm workers—and potential secondary benefits,
    if farms are forced, via government legislation, to retool their approaches to
    chemical use to protect labourers. And supporting local agriculture would help
    us build local food systems—in the way that Coastal Cookery and Nourish do, and
    by buying directly from farmers and through programs like CSA boxes. Nothing would
    change overnight, but it would change eventually.


    Back at Coastal Cookery, I tuck into my salad, which is composed of slightly bitter
    crunchy greens, refreshingly tart pickled golden beets, lightly candied walnuts,
    crispy bacon, and then slices of apple and red onion, all dressed in a simple
    vinaigrette.


    The salad is good, and I''m grateful for it and all the labour that went into
    it. It can be easy, I think, to feel a sense of alienation from this labour when
    purchasing produce from a restaurant or grocery store, when there are more, and
    longer, links in the supply chain. I feel like I helped the salad mix is more
    special because of the relationships and connections I have to it. Though the
    trip is longer for the Californian lettuce, it''s still a trip from farm to table.
    The greens are still growing in soil, watered by rain and rivers and aquifers,
    powered by the warmth of the sun, picked by skilled labourers, just like my friends
    here, who deserve good working conditions and living wages. I think that part
    of the mystery of multinational corporations, their focus on perfect produce available
    consistently, is'
  - '[PAGE 42]


    designed to obfuscate the particular origins of that produce as a material good
    that has been grown and harvested and packed and shipped by workers we would otherwise
    be in solidarity with.


    And part of our responsibility as people nourishing ourselves is to recognize
    this labour, familiarize ourselves with it if it''s not part of our everyday life,
    and contribute to meaningful structural change in whatever ways we can, both locally
    and through solidarity with the people growing, harvesting, and processing our
    food in places we''re connected to primarily through vast complex supply chains.
    The system we have in place now is unsustainable, a miracle and a mess. But reforming
    it can be empowering, can build community, can help us feel like we are participating,
    rather than extracting; participating, rather than being extracted from. Feeding
    ourselves while building and sustaining so much more than just ourselves.'
  - '[PAGE 43]


    # tomato chutney, part i: reviving my nana’s recipe


    A few Septembers ago, I harvested two green bell peppers and a bunch of celery—twisting
    at the base so that its leftover roots could feed the soil. Roma tomatoes and
    Gala apples I’d previously picked from my garden, and red peppers and onions from
    the grocery store, and I made my nana’s tomato chutney for the first time, ever,
    by myself.


    My nana was then in her nineties and living in a retirement home in small-town
    Ontario, having recently sold the well-kept split-level house in Burlington where
    my brother and I spent our summers with her and my granddad. My childhood home
    was chaotic; my parents fought, my mother drank, ours built-popcorn-flavoured
    rice cakes, I was plump and my mother helped me diet, starting at the age of eight.
    (In the ''90s, this meant caramel-flavoured rice cakes, apple-cinnamon-flavoured
    rice cakes.) My internal goal for each day was to eat eight hundred calories or
    less. I rarely felt at ease.


    At my grandparents’ house, my granddad gardened and made compost. His garden stretched
    over the bottom of the backyard, with his compost bin in the corner. He showed
    my brother and me how to rewire a lamp. We did the crossword together. He taught
    me all the math he’d learned at the night classes after immigrating to Canada.
    He wrote stories about his time in the war and as a young electrician first on
    a typewriter and then on a computer in the basement. My nana taught us how to
    play a card game called clock solitaire, gave us old hardcover Nancy Drew to read
    in the'
  - '[PAGE 44]


    sunroom, and turned the produce my granddad harvested into lunch and dinner and
    preserves.


    My grandparents’ calm, unwavering attention made me feel secure and loved—and
    my nana’s attention often crystallized in the form of eight-ounce jars of chutney,
    made and set aside especially for me. My favourite way to eat it was cheese-and-chutney
    sandwiches, cut on a diagonal, the sweet, tart, slightly crunchy red chutney contrasting
    with crumbly, pungent cheddar.


    When I was entering my mid-twenties, the prostate cancer my granddad had lived
    with since I was a child finally spread. I’d moved out of my parents’ house by
    then and was living about forty-five kilometres north of my grandparents. My mother
    and stepfather gave me one of their old cars, a lozenge-shaped blue Taurus, and
    I drove from Guelph to Burlington once a week to stay over with my grandparents,
    leaving early in the morning to get back to my new communications job.


    When I was twenty-six, after my granddad had died and I moved across the country
    to go back to school, my mother disowned me. She’d stumbled across an essay I’d
    written about our strained relationship, one I hadn’t meant for her to see.


    My relationships with the rest of my maternal family also became more tense, more
    sad. It was supposed to stay a secret, what I had written about. I was supposed
    to feel gutted when she disowned me. I was supposed to apologize.


    At thirty-three, when I gave birth to Sinclair, my nana didn’t answer my calls.
    I found out she didn’t want to meet Sinclair unless I rekindled a relationship
    with my mother, whom I hadn’t spoken to for years. Maybe it felt would be a betrayal
    to meet my child if my mother most likely never—but the silence felt like a betrayal
    to me. My own belonging to the family was conditional and not as primary as my
    mother’s.'
  - '[PAGE 45]


    Like I would need to fend for myself again, the way I had as a child, fearing
    my mother’s alcoholism and anger and her desire, above all, to keep up appearances.
    But this time without the respite of my grandparents’ love and steady care.


    My nana’s chutney recipe calls for twenty-four ripe tomatoes, six apples, one
    bunch of celery, three medium onions, two green peppers, two red peppers, sugar,
    vinegar, salt, mustard seeds, cloves, and ginger. I skin the tomatoes after dumping
    them into boiling water, and chop everything into a fine dice. I place the tomatoes,
    onion, and celery in a col overnight to drain any excess water. The next day,
    when everything is in the pot and begins to warm, the house fills with the chutney’s
    smell, a smell that I haven''t experienced in years. A smell I can now identify
    as the result of the recipe’s unique combination of green pepper, tomatoes, and
    cloves.


    The recipe I have is in my nana’s hand. She wrote a letter to go alongside it,
    sent several years before the maternal side of my family stopped talking to me.
    When I wrote the first draft of this essay, I couldn’t even remember where I was
    living when she sent it. Now, the memory returned: I was living in a Guelph neighbourhood
    called the Ward with two bunnies Acorn and Bigwig. I called her when the recipe
    arrived in the mail. We talked I was doing the dishes, and I almost dropped my
    phone in the sink.


    The recipe bears my name: “Andrea’s favourite tomato chutney.”

    After the chutney has cooled, I spoon some onto a piece of cheddar. It is the
    taste of being in my grandparents’ kitchen at lunchtime. It is the clock ticking,
    the radio turned down still broadcasting the news. It is the precise feeling of
    being safe and loved. Sinclair tries it with cheese and'
  - '[PAGE 46]


    crackers; she likes it, and I feel grateful to be able to share something of my
    nana with her.


    Once, when I was nine, we visited my grandparents for Christmas in Florida. I
    remember getting into the car to go home and not being able to say goodbye because
    I was crying and didn’t want to leave. That temporary parting contained the kernel
    of the larger parting that, even as a child, I understood was to come. I began
    to hoard time with them. My grand died when he was eighty-seven; I cried for two
    weeks straight and then didn''t cry again for nearly two years, as if the loss
    had evaporated a reservoir. But I felt my nana would live into the nineties, that
    she’d be alongside me when I was thirty-five, maybe even forty. I guessed I could
    lose her earlier, in another way.


    As the distance between us grew, I crafted her chutney more fiercely. I’d moved
    across the country three times since she’d sent me the recipe, and I thought I’d
    lose it. I couldn’t exactly call her and ask her to send another copy. Before
    I found the recipe folded into the pages of an old book—looking for something
    entirely different I’d also misplaced—I thought I’d never taste it again.


    Having made it again, I miss my nana fiercely too. I wish I could call her and
    tell her that I didn’t have all the right tools, so when I introduced my mason
    jars to the canning bath, it created a geyser of boiling water. But also that
    my chutney was a success: it tasted just like hers. That grew much of the produce
    I used to make it, as my granddad had for her. That I love her, and that I am
    sorry, but I’m not sorry enough to accept my mother’s abuse as a condition of
    belonging to the family. That was her early love, in fact, that helped me make
    a strong enough person to say no.'
- md: "\n## Andrea’s favourite tomato chutney, from Nana\n\nA note on canning safety:\
    \ While improvisation and substitution is generally welcome in cooking, it's important\
    \ to stick to the ingredients and proportions in recipes that are jarred and preserved\
    \ in a water bath, like this chutney. A pH of 4.6 or lower is required for safe\
    \ water bath canning.\n\n## Tools\n\n- six hot, sterilized 500-millilitre (pint-size)\
    \ mason jars and fresh canning lids\n- knife, cutting board, and peeler\n- large\
    \ cooking pot \n- water bath canning pot, jar rack, and jar tongs\n- cheesecloth\n\
    \n## Ingredients\n\n- 24 tomatoes (I used San Marzano/Roma tomatoes)\n- 6 apples,\
    \ peeled and chopped (I used Gala apples)\n- 5 medium white onions, chopped\n\
    - 1 bunch celery, chopped finely\n- 2 green peppers, chopped\n- 2 red peppers,\
    \ chopped\n- 2 cups white sugar\n- 2 cups white vinegar\n- 1 teaspoon each of\
    \ cloves, ginger, cinnamon, turmeric, and dried mustard\n- 4 tablespoons mixed\
    \ pickling spice (tied up in a cheesecloth bundle)\n- 2 teaspoons pickling salt\n\
    \n1. Cut an X into the bottom of the tomatoes and place them into boiling water\
    \ for one minute to remove skins. Then chop into small pieces and place them in\
    \ a colander over a bowl to drain. Chop onions and celery into fine pieces and\
    \ place in the same colander. Sprinkle salt over mixture. Place colander and bowl\
    \ in the fridge to drain overnight.\n\n2. The next day, remove the contents from\
    \ fridge, and after pressing lightly to remove excess fluid, pour the contents\
    \ of the colander into a large cooking pot.\n\n3. Chop green and red peppers and\
    \ apples into small pieces and add to pot.\n\n4. Stir in the rest of the ingredients,\
    \ and mix well.\n\n5. Place pot over medium heat until it reaches a gentle boil.\
    \ Keep stirring until it is as thick as you want it—about two hours, the longer\
    \ the thicker. You might have to lower the temperature to keep it at a gentle\
    \ boil and not a full boil.\n\n6. When done, remove the pickling spice bag.\n\n\
    7. While still hot, pour into sterilized jars, leaving half an inch of room at\
    \ the top.\n\n8. Can in a water bath.\n\nGood luck and enjoy. Love, Nana.\n\n\
    > *** My nana’s recipe doesn’t give specifics, but you can treat this like you’re\
    \ canning salsa. Put the lids onto the jars and screw until finger tight. Then\
    \ submerge the jars in a large pot of water, fitted with a canning rack, that\
    \ has been brought to a rolling boil. Ensure the jars are covered fully, with\
    \ an inch of water above the tops of the jars. Place the lid on the pot and keep\
    \ it at a boil for thirty minutes, then use tongs to remove the jars and place\
    \ them on a tea towel. I leave them on the counter until I’m sure they’ve sealed\
    \ properly—generally overnight. Sealed properly, they’ll keep in a cool, dark\
    \ place for up to a year.\n\n## tomato chutney, part ii: the empire in a sandwich\n\
    \n> “From food do all creatures come into being.”\n—The Bhagavad Gita\n\nIn my\
    \ nana’s final year of life, she told me my brother, that it would be okay to\
    \ call her Her. So before she died in late 2020, at the age of ninety-five, I\
    \ got to speak with her on the phone a couple final times. The conversations were\
    \ short. She wanted to hear about Sinclair, and she wanted to know that I was\
    \ happy. She didn't want to talk about herself. I told her I’d made her chutney,\
    \ and there was a piece I’d written about it that I wanted her to read one day,\
    \ when she was ready. The pandemic was less than a year old. I was worried about\
    \ her—worried she’d get COVID, worried she’d be isolated. I wanted to visit, but\
    \ I lived thousands of kilometres away, and it would have been irresponsible.\n\
    \nI first visited her grave in late 2021. My brother and I trudged through the\
    \ swampy grass, our boots getting muddier, searching for where she’d buried. When\
    \ we got there, we weeded the small area in front of her gravestestone, and I\
    \ cried, my brother and I hugged, and then we went home.\n\nWhen I was growing\
    \ up, I used to press my family members for information—details that would help\
    \ me piece together the stories of their lives. My dad and my maternal grandfather\
    \ and my paternal grandmother all shared freely, sometimes remembering something\
    \ new as I jogged my memories with noisy follow-ups. But my nana often demured.\
    \ She told some stories—one about why she didn’t like to put her head underwater\
    \ while swimming—but kept of what makes family stories fun, like scandals and\
    \ fights and fractures and breakups and makeups, to herself. Though I regularly\
    \ asked about it, she kept her birth year private until she reached nieces; she\
    \ preferred to share fond memories of family members, such that much of what I\
    \ learned about her family life was through what was left unspoken.\n\nBut it\
    \ also came through in her habits, including her cooking and her food, which were\
    \ the clearest connection with her past and one of the clearest demonstrations\
    \ of her love and care. When my grandfather developed high blood pressure and\
    \ high cholesterol, for example, she switched from cooking with leftover bacon\
    \ to cooking with lighter oils and making things like steamed fish.\n\nI never\
    \ thought to ask my nana directly about the culture she was passing down in the\
    \ form of food. Though I had the recipe for her chutney, I hadn’t thought about\
    \ where exactly it came from my mid-thirties, and I never got the chance to ask\
    \ her. While I was writing the essay about chutney meant in our relationship,\
    \ I began to wonder if someone had passed it down to her, or if it was something\
    \ she’d picked up in her lifetime. Did she start making when her kids were young?\
    \ Or much later? Or maybe earlier, growing up in England?\n\nI’m curious enough\
    \ that I’ve been tempted to email my aunt, from whom I’m estranged, to ask. But\
    \ this impulse to get to the heart of things is part of the reason we’re estranged\
    \ in the first place. So I opt not to, instead asking father, who began attending\
    \ family meals at my mother’s house while he was in high school in the mid-1970s.\
    \ His side of the family eats their cheese sandwiches and ploughman’s lunches—bread,\
    \ cheese, chutney, pickled onion—with Branston Pickle, a popular type of pickled\
    \ chutney, first manufactured in 1922, that’s often eaten in this application\
    \ in England. (My nana was born just three years after Branston Pickle.)\n\nMy\
    \ dad says my nana’s chutney was unique to him—he’s never had another like it.\
    \ There is a joke about the British—that they went colonizing in search of flavour,\
    \ only to neglect, as a culture, spice.\n\nIn the sixteenth and seventeenth centuries,\
    \ English cooks did tend to use spices, such as mace and nutmeg, to season their\
    \ meats. Food historian Lizzie Colingham’s *The Taste of Empire* traces amongst\
    \ many things the eventual decline of spices in British cuisine. One chapter follows\
    \ naval administrator and diarist Samuel Pepys and his wife on a mid-seventeenth-century\
    \ excursion to a French restaurant, which, Colingham writes, rejected spice rather\
    \ than enhanced flavour. As spices disappeared from English food, it became increasingly\
    \ plain, dominated by roast meats, pastries and pies,” Colingham writes. “These\
    \ plain meat dishes were, however, always accompanied by pungent condiments: mustard,\
    \ horseradish sauce, pickles or fruit jellies.”\n\nOver a video call, Colingham\
    \ tells me that while British cuisine eventually relegated spices to the sweet\
    \ course, savoury condiments remained really important. By the 1850s, she says,\
    \ Indian curries made with curry powder had become quite fashionable, adorning\
    \ middle-class dinner tables and being featured at parties. The middle classes\
    \ also hashed cold meat with curry spices to make their leftovers more appealing.\n\
    \nThis would not quite have been my family: all the branches I’m familiar with\
    \ were working class. I know less about my maternal ancestors, but my paternal\
    \ ancestors worked in mills and as farmers and butchers. When Colingham asks,\
    \ I tell her my name came to Canada from England after the Second World War, as\
    \ a nanny, and then worked in retail at the Bay; my grandfather enlisted in England\
    \ at seventeen, hoping to become a pilot, but his eyesight was too poor. So he\
    \ came to Canada via the postwar red carpet that was rolled out for English veterans\
    \ and began working as an electrician. Neither of my grandparents went past eighth\
    \ grade in school.\n\nWhile curries saw a rise in popularity in nineteenth-century\
    \ Britain for the middle classes, as a direct result of the colonization of India—first\
    \ Company Rule from 1773 to 1858, and then the British Raj until 1947—Brits didn’t\
    \ adopt the practice of eating chutneys, or relishes, with their curries. Chutneys\
    \ and pickles, however, were “very, very much a working-class thing by the first\
    \ half of the twentieth century,” Colingham says. “Of all the Indian influences\
    \ that might have gone through to the British working classes, it tended to be\
    \ picallilli and Branston Pickle.”\n"
