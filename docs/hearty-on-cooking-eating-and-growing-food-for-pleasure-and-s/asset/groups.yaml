    The memory of carrying carrots and canned foods in bright yellow bags, their handles
    elongating under the weight of our heavy grocery stores, is as bright and consistent
    as the memory of my grandfather showing me how to pull a ready-to-harvest carrot
    from soil helped me to grow them straight and true. I guess what I’m saying is
    that carrots have range.


    Carrots are in the parsley family. They’re biennial plants, meaning they flower
    in their second year, and their pollination is assisted by insects like'
  - '[PAGE 98]


    bees, hoverflies, houseflies, and bluebottles. If you let them flower and go to
    seed, they look remarkably like Queen Anne’s lace: clusters of tiny white flowers
    radiate out from small stalks in an umbel pattern, looking sort of a cross between
    a dolly and an umbrella. The carrots we eat (Daucus carota subsp. sativus) look
    remarkably like Queen Anne’s lace (Daucus carota var. carota) because they’re
    quite related to Queen Anne’s lace, which is also known as wild carrot.


    Carrot seeds, Dan Jason, author of Saving Seeds and owner of Salt Spring Seeds,
    are very easy to harvest. The flower plant sends up in its second year carries
    hundreds of tiny, easily accessible seeds. To collect them, you just need to place
    a paper bag over the flower head and shake until the seeds rain into it.


    > The hard thing is to make sure the seed is pure,” Dan says. The conventional
    wisdom says that if you live within a mile or so of a plant, it’s difficult to
    grow carrots for seed. If you try, they can end up cross-pollinating. In Washington
    State, Queen Anne’s lace is classified as a class B noxious weed, and it’s prohibited
    to sell or transport its seeds. Frankly, there’s no Queen Anne’s lace in the valley
    where his farm is located, and so he’s safe to save carrot seeds.


    The taproots of Queen Anne’s lace, technically edible when they’re very small
    and young, become woody and bitter as the plant matures. If you pick Queen Anne’s
    lace or brush it with your hand, it smells temptingly carrot. But if your carrots
    cross-pollinate, they’ll most likely pick the traits they want in carrots (toughness,
    woodiness, bitterness).


    David Schatz, the BC Seed Security Program manager for FarmFol CityFolk, tells
    me that carrot seed saving is slightly more complicated than distance between
    carrots and Queen Anne’s lace. The insects that pollinate both plants, he says,
    can travel up to five kilometres, not just a mile. But, he'
- md: '

    says, “the carrots can be right by Queen Anne’s lace if it doesn’t flower right
    at the same time.”


    “Isolation by distance is just one factor,” David tells me. “Exact distance is
    a guideline that changes depending on the landscape. A farmer’s lived experience
    with isolation on their farm is more relevant than suggested numbers in a book.”


    David also raises another consideration for carrot seed saving. If you’re seed
    saving from plants like lettuce, tomatoes, beans, and peas, you can harvest from
    five plants each year for generations and suffer no hardships. But for long-term
    genetic health for carrots, you need to be harvesting about a hundred plants—a
    little trickier as a home grower.


    Carrots are still one of my top five all-time favourite foods. Even a bad carrot—one
    a little woody, or one whose flesh has separated from its core—is still a useful
    carrot in something like a stew or a soup, where it will be cooked so long that
    it picks flavour and moisture, and no one will notice. A truly good carrot is
    a thing of beauty. Sweet and crunchy, unfussy and welcoming. They’re one of the
    few foods I can eat every day and never tire of. And I’m not alone: according
    to the UN’s Food and Agriculture Organization, just under 41 million tonnes of
    carrots and turnips (the organization combines the two) were grown worldwide in
    2020, the most recent year for which data’s available. (This isn’t quite as impressive
    as potatoes, 359 million tonnes, but it’s more than pumpkins, squash, and gourds,
    coming in just under 28 million tonnes.)


    The first piece of writing the title of this essay harkens back to M.F.K. Fisher’s
    book *Consider the Oyster*, which is part biology lesson, part diatribe on whether
    oyster-related food poisoning is all it’s made out to be, and part recipe book.
    “Love and Death among the Molluscs,” its first essay, describes in detail the
    life cycle of an oyster from its imagined perspective. Another begins by citing
    a gravestone: “C. Pearl Swallow. He died of a bad oyster.”


    The second piece of writing this essay gestures towards David Foster Wallace’s
    “Consider the Lobster,” about the Maine Lobster Festival and about lobster fishing
    and lobster etymology, but probably best known for its exploration of one central
    question: “Is it all right to boil a sentient creature alive just for our gustatory
    pleasure?”


    On the surface, talking about growing and eating carrots might not seem interesting,
    because they’re plants—as in most agriculture, with the potential for exploitative
    labour practices; ecologically not so bad, at not any worse, other forms of conventional
    plant-based agriculture. Fewer ethical questions about plucking and boiling.


    But I think they deserve a closer look because they are so popular, so well eaten,
    a cornerstone of our diets. And so full of contradictions: somewhat tricky to
    grow at home, but relatively easy in commercial farm settings; potentially high-barrier
    in terms of cross-pollination, but if you manage to sidestep it, each umbel produces
    somewhere around a thousand extremely tiny seeds, easy to harvest.


    And if you’re drawn in the morbid (I too often am): their consumption has killed
    at least one person I could find, a man who died in the 1970s of cirrhosis of
    the liver, his skin bright yellow, after consuming “a gallon of carrot juice a
    day” on top of millions of units of vitamin A.


    On the internet, until very recently, there was a website called the World Carrot
    Museum, run by an English man named John Stolarczyk. As of December 2022, @CarrotMuseum
    was still tweeting—carrot-related content, but also a heady mix of pro-police
    and pro-Crown content—but the last snapshot of the website seems to have been
    captured by the Internet Archive Wayback Machine in late September 2022.


    I learned about this website from Brody Irvine, who works in purchasing at Discovery
    Organics, an organic distributor to that, where possible, purchases locally; he
    told me the website featured an “incredibly detailed” page, “almost like a novel,”
    about baby carrots.


    It also includes several detailed pages of carrot history, and it’s where I learned
    that carrots were most likely cultivated over hundreds of years and initially
    domesticated in Afghanistan about five thousand years ago. That the earliest domesticated
    varieties were most likely purple, with some yellow variations, or maybe white,
    and the roots were much thinner than we see today. That it took hundreds more
    years to develop fatter, sweeter, nonforking carrots. That in the Middle East,
    carrots got bigger and better and more delicious but are still more purple, from
    anthocyanins, the same pigment that makes red cabbage reddish-purple. And that
    the orange carrot originated in northern Europe in the late fifteenth century,
    most likely by selectively growing yellow variations until they became progressively
    orange, from beta-carotene.


    Orange carrots are less prone to bolting than purple carrots but do not—which
    I know from reading—a period of cold weather to bolt and flower the following
    spring, which is called vernalization. Irvine notes that this cold period also
    makes carrots sweeter. The best carrots, he says, are the ones you harvest after
    the first frost, when the carrots’ starches develop into sugars.


    While Irvine’s customers are not big consumers of baby carrots, the mildly illicit
    novel-like baby carrot webpage I access through the Internet Archive Wayback Machine
    asserts that the average American consumes about half their carrots in baby form.


    I also learn from Irvine and the baby carrot novel that it''s a specific type
    of carrot-Imperator carrots tend to be longer and skinnier than Nantes carrots,
    which are shorter and stockier, and Chantenay carrots, which are really short,
    and Danvers carrots, which seem to be (I haven''t grown) sort of rounded. It is
    Elaine Spearing, who co-owns Enderby Farm, located an hour north of Kelowna, B.C.,
    who clarifies for my part of the mystery why I tasted such a difference between
    the carrots my grandfather grew when I was a kid and the carrots I brought from
    Frills. Spearing and her partner are about to retire, but they''ve grown a lot
    of great (including carrots they sell to Discovery Organics). One of her favourite
    to grow is a Nantes-type called Bolero. “It’s bored if you eat it out of the ground,
    it''s okay, but it''s not as great as a summer carrot. By January, if you keep
    it in cool conditions, it''s much nicer. It''s very tasty.” Another likes to grow
    is also a Nantes-type, the Laguna, but that one is best eaten in warm conditions,
    straight from the ground.

