    Whisk these ingredients together while bringing them to a simmer over medium heat.
    Meanwhile, crack some eggs, separating the yolks from the whites. Save the whites
    for a later purpose (like Swiss meringue buttercream or macarons or amaretti),
    and place the yolks in a medium-sized bowl. When the cream mixture begins to steam,
    take it off the heat, and slowly mix a third of it, half of it, or all if you
    want to, into the yolks, whisking constantly. Once the warm cream mixture has
    been successfully integrated into the yolks, pour the whole thing back into the
    pot, continuing to whisk as if your wrists do not suffer from repetitive stress
    injuries. Place the pot back on medium-low heat, and stir gently but consistently
    for five or six minutes. Over the course of this five or six minutes, the custard
    will reach a temperature of 170 degrees Fahrenheit and begin, almost imperceptibly,
    to thicken. When it''s done, it''ll be able to coat the back of a spoon. Now it''s
    time to strain, bring to room temp, and chill. You can churn the ice cream once
    it''s thoroughly refrigerated.


    Each ice cream is slightly different. If you''re making Kahlua-coffee, the flavourours
    go in with the cream and milk. If you''re making Nutella, you whisk it into the
    warm custard after you''ve incorporated the egg yolks, thickened and strained.


    But most ice cream involves the stovetop—the alchemy of milk and cream and sugar
    and egg yolks turning into much more than the sum of their parts. I love eating
    ice cream, but maybe even more than eating it, I love to watch it come together
    on the stove, getting hot in service of it, later, getting as cold as possible.


    I am estranged from my mother and her family, as my dad was estranged from his
    father before him. I''m not necessarily great at keeping in touch with the people
    I want to with. Sometimes, when I think about the course of life, I think about
    how it involves an increasing series of losses and fractures. And it sounds ridiculous,
    but'
