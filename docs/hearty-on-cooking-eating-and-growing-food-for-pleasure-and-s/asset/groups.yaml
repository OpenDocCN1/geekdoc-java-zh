    # the spectacle of the big bite


    In 2011, for the *New York Times*, Jeff Gordinier wrote about the phenomenon of
    celebrity profiles that include a spectacle of voracious eating. The profiles,
    he wrote, generally feature a starlet of “slim and gamine proportions” thwarting
    reader expectations by ordering and eating a meal fit for “hungry dockworker.”
    He namechecks Jennifer Lawrence, Zoe Saldaña, and Cate Blanchett as profiles and
    calls out *Esquire*—a magazine he’d later work at for five years as the food and
    drinks editor—as a particularly frequent contributor to the genre. The phenomenon,
    Gordiniert adds, is now so frequent it has a name: “documented instance of public
    eating.”


    Unlike profiles focusing on actors losing or gaining weight for particular roles,
    the documented instance of public eating signals that a celebrity’s thinness and
    beauty is something close to effortless. The idea of a thin woman eating voraciously
    in public is more palatable than a fat woman eating in public, or David Beckham’s
    admission that Victoria Beckham has eaten the same low-calorie dinner of grilled
    fish and steamed vegetables for the past twenty-five years.


    These profiles are a reflection of our culture’s obsession with thinness and “obesity,”
    our fixation on the idea that the morality of a person is clearly and bodily legible,
    an accumulation of “right” or “wrong” choices. What makes the documented instance
    of public eating so compelling that it became a trope is that it flouts this expectation,
    showing a “right” body making a “wrong” choice. The cool girl who stays thin while
    devouring'
  - '[PAGE 146]


    burgers; the object of appetite showing that she has an appetite of her own. (The
    one thing I’ve never been sure about is whether we’re supposed to acknowledge
    the effort made behind the scenes in order to enact this brief public show.)


    But is obviously gratuitous for a celebrity profile changes in meaning when the
    documented instance of public eating is a chef’s documented instance of public
    eating.


    When we watch TV shows—or TikToks or Instagram reels—about cooking, the food is
    the point. Watching someone cook, we learn about ingredients and technique. We’re
    also imagining the finished product might taste like, what its textures might
    be.


    Given that time and distance separate us from the food itself, we live vicariously
    through the chef’s response. But the experience is different when it’s Guy Fieri
    and a taco versus than attractive woman chef and whatever she has created.


    And are there often dynamics at work similar to what Gordinier described—publicly
    visible appetite means something different depending on your gender, your size,
    your queerness, your race. It’s never just about the food.


    On Two Fat Ladies, Clarissa Dickson Wright and Jennifer Paterson putter to the
    seaside on a motorbike with a sidecar, cooking mussels on a portable stove in
    butter, wine, shallots, and parsley. They’re miked as they crack open the shells
    and eat the plump little shellfish, their mouths smacking in pleasure.


    Pouring honey into a pan, Nigella Lawson catches a drip from the jar with her
    finger, which she then puts to her mouth.'
  - '[PAGE 147]


    Guy Fieri is an easy pick for the unfussy version of the genre: watch five minutes
    of the Food Network and you’ll see him turn the brim of his cap to the back to
    better sink his teeth into a burrito. Ditto the host of You Gotta Eat Here!, John
    Catucci, whose job parallels Fieri’s—to wrap his mouth around surprisingly large
    burgers, or pieces of fried chicken, embodying a zealous desire to taste.


    Anthony Bourdain ate heartily, usually while in conversation; in promotional photos
    for his shows, he’s often caught as he’s to bring a pair of chopsticks or a spoon
    to his lips, making it seem like he is perpetually about to start a meal.


    When Alex Guarnaschelli judges for Chopped, she pokes, bites, evaluates. Her face
    shifts in a moment of pleasure from eating or, conversely, a moment of uneasy
    analysis. There are fewer women on Chopped than male judges; Guarnaschelli doesn’t
    soften her feedback, isn’t always kind, often wears shirts with sleeves.(Wearing
    sleeves is one indicator a woman is allowed to embed appetite without also being
    the object of itself.)


    On $40 a Day, Rachael Ray makes a little “mmm” sound, looking up at the ceiling.
    In 30-Minute Meals and on her eponymous (and incredibly popular) TV show, she
    tended to say “Yum-of” almost as frequently as “EVOO,” being paried for both.
    (Her on-camera exuberance for food is rivalled only by Guy Fieri’s—but while Fieri
    has convincing defenders for his long-lambasted corniness, Ray doesn’t. Instead,
    the comments on her older shows posted to YouTube zero in the fact that her body
    is larger now than when she first started hosting food TV in her twenties.)


    Padma Lakshmi shares an enthusiastic “mmm” as the spoon’s holding returns to her
    bowl. She eats a rib carefully, in a way that won’t leave sauce on her face or
    much on her fingers—the way nana would'
  - '[PAGE 148]


    have taught me to eat a rib, if I hadn''t been a stubborn vegetarian for most
    of the time I knew her.


    Comparing Lakshmi and Lawson to schlumpy male chefs, you can come away thinking
    that both women are required to check more boxes and receive fewer opportunities
    in return. It''s clear they also enjoy the food they''re tasting. But for Lawson—and
    for Lakshmi before she began her show Taste the Nation—there''s a subtle, electric
    difference in the way the camera captures their enjoyment. We''re meant to be
    imagining what they are tasting. But the pleasure melts outwards, pausing on their
    bodies and sensuality. In a vacuum, it''s fine. Viewed through a broader lens,
    why doesn''t the camera make the same pauses for male chefs? Why is sensuality
    only allowable for women chefs who fit certain fairly narrow beauty parameters?
    And is it required of women in a way that it is not required of male chefs? And
    where do non-binary, trans, and queer chefs fit into this paradigm, which feels
    so classically for the heterosexual male gaze? Finally, is this framing of attractive
    women part of what limits, in the imaginations of studio executives, their career
    ambitions?


    A long-time host of Bravo''s Top Chef, successful cookbook author, and household
    name, Lakshmi had to pitch Taste the Nation several times before it was picked
    up by Hulu, flying to L.A. to do so on her own dime. She pitched Diners, Drive-Ins
    and Dives type show where she''d travel around the U.S. to explore immigrant contributions
    to American culture through food. "My show has been nominated for an Emmy single
    year that I''ve been doing it," she told the New York Times. "All these networks
    that claim want diversity—and here was Taste the Nation, a show about the diversity
    of our country, and they said no."


    It''s possible the exec Lakshmi referred to in interview said because they believed
    it''s easier to send a white man around the country to speak with the bros we
    might misguidedly picture staffing'
  - '[PAGE 149]


    all kitchens;**** it’s possible execs said no because they believed viewers, regardless
    of their own identities, can better see themselves tasting from the perspective
    of a white man than white men can see themselves tasting from the perspective
    of anyone else.


    Ultimately, though, the result is the same: the closer one is to maleness and
    whiteness, the more one gets to be the avatar for exploration and tasting—with
    less of an expectation to be charming, perfectly coiffed, well-dressed, gorgeous.


    But it wasn''t always like this, and I''m unconvinced it''s what viewers are really
    down. The enduring personalities associated with TV cooking aren''t necessarily
    classically attractive. There''s space for them to be a bit odd, tall, fat, crooked-toothed,
    eccentric. It was a mistake to make cooking show hosts as blandly attractive and
    next-door relatable as the carpenters who built furniture for _Trading Spaces.


    In the moments when chefs perform the theatre of eating on camera—something Stanley
    Tucci describes in an essay about Julia Child as an act that “humanizes” famous
    people, makes us feel closer to them—I’m also thinking about the function of pleasure.
    Do non-male chefs get to publicly experience an exuberant kind of pleasure? Do
    women get to keep eating until they’re satiated if they want to? Is a female chef’s
    job just to make enjoyable food and then enjoy it? Or is it her job, unlike Fieri’s,
    in part to be consumable herself?


    If a TV chef spits the food into a dump bucket at the end of a take, does it matter?
    If we want the hot white woman cook to stay youthful, impeccably thin, beautiful,
    can we also expect her eat voraciously? Is'
- md: '

    appetite only a desirable trait in a woman when it is presented as an impossible
    puzzle?


    Of course, these questions are overly simplistic, and the enduring popularity
    of shows like Two Fat Ladies believe them. Dickson Wright and Paterson were popular
    when their series first aired and remain recognizable and well watched over two
    decades later. Rachael Ray, chef and author Joshua Maharaj points out when I speak
    with her, may be less popular with viewers than Guy Fieri because of a history
    of cultural appropriation in her dishes, which often take “shortcuts” to “simplify”
    for white American audiences. Lakshmi’s Taste the Nation was picked out for a
    second season, and Samin Nosrat is arguably the most beloved food writer and TV
    host working in North America today.


    There is no universal viewer, no universal witness to appetite. There are only
    people making the food they themselves enjoy and sharing it with us. And then
    there is the filter—the way culture reflects what it imagines to be our desires.


    When our viewing choices are more democratized through platforms like YouTube
    and TikTok and Instagram, the math changes. (Even though the algorithms still
    prioritize white creators.)


    The ecosystem of creation on these platforms is more diverse than what you find
    on TV in a variety of ways: more women of colour, more trans cooks, more non-tokenizing
    and creative approaches to food. (Food Network’s Pioneer Woman, going into its
    eleven billion season and epitomizing the network’s non-competition offerings,
    packs the punch and creativity of a dry piece of toast.) My personal favourites
    also tend to focus less on meat as the centre of each and every plate.


    Some examples: on Instagram, as @BlackForager, Alexis Nicole forages, cooks, and
    eats whatever’s edible in her surroundings: lilac cordial brewed using the wild
    yeast on the lilac flowers; veggie-bacon-wrapped hosta shoots; grape hyacinth
    extract that turns pink when added to lemonade.


    Poppy O’Toole (@PoppyCooks), a Michelin-trained chef whose kitchen job cooks potatoes
    obsessively, including variations on a fifteen-hour pressed and fried potato dish.
    Her cooking video style is one part food prep ASMR and one part voiceover, generally
    culminating in a crunch and "ooh."


    Richard Makin (@SchoolNightVegan) offers inventive vegan swaps for ingredients
    like anchovy paste, with a focus on technique; Bettina Lakhal (@crispyegg420)
    makes delicious bowls featuring eggs, tasty mushrooms, and crispy tofu; Afia Amoako
    (@EatWithAfia) cooks vegan versions of Ghanaian foods like melon soup and jollo
    rice while sharing cultural, ecological, and historical information about ingredients
    like millet and sorghum; Ben Siman Tov (@BenGingi) bakes breads and says, "YASSSI!"


    Some of these cooks taste their food at the end of the video loop; some continue
    the video past the first taste, as if you’re sharing the table with them; some
    enact a pre-eating ritual like breaking a cookie, or drawing a fork across an
    egg until it flows like a small avalanche—more possible on TikTok or Instagram
    than TV because these platforms allow us to feel closer to the creator themselves,
    so these instances become point-of-view stand-ins for us breaking, snapping, pulling,
    and poking.


    Because the act of eating is necessarily simpler than the act of cooking, the
    tropes of eating and tasting in cooking videos become more evident. The theatre
    of tasting, done again and again, even on one’s channel, can begin to replicate
    the relatively narrow available options. How many times can a person crunch or
    “ooh”? Who’s not going to try to take a more elegant or substantial or noteworthy
    bite they’re on camera, bearing their dentistry to the world?


    But it’s also true that you can find on Instagram often feels more genuine than
    most of what’s available on food television—and that’s true of the tasting as
    well as the cooking. Some cooks sidestep the whole process itself, opting, like
    Sohla El-Waylly often does, to let the viewer make the imaginative leap between
    seeing the food and dreaming of tasting it.


    Do you usually watch your friends or family eat when you eat together? I don’t.
    I’m usually focused politely elsewhere, making eye contact only when they’ve swallowed
    and are talking between bites. I’ve probably Nigella Lawson and Guy Fieri and
    Jamie Oliver eat on camera more than I’ve seen my partner, who I eat with three
    times a day, twenty-one times a week, in person.


    By definition, it’s a very normal thing to eat. But a less normal thing to perform
    the act of eating for others.


    So the spectacle of the big bite will always be a spectacle, always a bit of theatre.
    It provides one lens through to examine cultural trends, trends, and the way food
    media has the power to unleash desire and appetite from cultural conditioning—more
    people embodying what they want to embody, unreservedly, one bite at a time.


    In more democratic arenas, it has the power to unashackle desire and appetite
    from cultural conditioning—more people embodying what they want to embody, unreservedly,
    one bite at a time.


    **** Plenty of colour, and plenty of white and non-binary people, work in the
    restaurant industry; what’s true is that racism, sexism, and other barriers have
    led to underrepresentation of these groups in areas of the industry that carry
    more prestige—and pay more money. The majority of higher-level restaurant positions
    are occupied by white workers and a disproportionate percentage of these positions
    are held by white men. See Restaurant Opportunities Centers United, Ending Jim
    Crow in America''s Restaurants: Racial and Gender Occupational Segregation in
    the Restaurant Industry, 2015, https://laborcenter.berkeley.edu/pdf/2015/racial-gender-occupational-segregation.pdf.


    Before I even thought of making, I bought a crystal dish from a thrift store.
    A few weeks later, I saw it had a metal rim.


    ## Cunliffe family trifle (Over 100 years old)


    ### Simplified version


    - **Day 1:** Place pound cake, Swiss roll, or any sponge cake in bottom of large
    dish. (Can be stale.) Sprinkle generously with sherry and brandy.

    - **Day 2:** Open a can of fruit—peaches, mandarin oranges, etc.—and place on
    cake base. Make a jelly, any flavour, using the juice to replace the cup of cold
    water called for recipe. Stir well, and pour over the cake and fruit, cover and
    return to fridge to set.

    - **Day 3:** Carefully pour a can of custard over the above and smooth. Cover
    and return to fridge.

