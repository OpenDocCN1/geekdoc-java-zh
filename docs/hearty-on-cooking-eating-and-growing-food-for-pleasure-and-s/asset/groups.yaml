    - 2 tablespoons butter

    - 2 tablespoons sour cream

    - splash of milk

    - salt and pepper


    1. Preheat your oven to 375°F (190°C). Heat oil in a saucepan (or, if you have
    it, a cast iron Dutch oven—you’ll be able to put the mash on top and throw the
    whole thing into the oven). Add onion, celery, and carrot, and allow it to cook
    for about five minutes before adding the garlic.


    2. Meanwhile, set a large salted pot of water boiling. Peel the potatoes and chop
    them into large cubes. Drop the potatoes into the boiling water and let them cook
    until fork tender—about 15 minutes.


    3. To your onions, celery, carrot, and garlic, add your baked beans, TVP, herbes
    de Provence, and stock. Once the mixture begins to bubble, turn it down to low
    and let it hang out until your potatoes are cooked.


    4. When your potatoes are ready, mix the frozen corn and peas into the shepherd’s
    pie base. If you’ve been working in a non-oven-safe saucepan, transfer the mixture
    to an oven-safe casserole dish.


    5. Make the mashed potatoes: drain the water; use the potatoes or a masher; add
    butter, sour cream, splash of milk, and salt and pepper; and mix.


    6. Dollop the mashed potatoes onto the shepherd’s pie base. Spread them out with
    a spoon or spatula so everything is evenly covered. Drag a fork across the mash
    in rows to create a series of parallel lines.


    7. Place in the preheated oven and cook at 375°F for 30 minutes. The peaks of
    the mash should get a little browned and crispy, and the shepherd’s pie base should
    bubble up the sides of the dish.


    ## Lentil Loaf


    ## Ingredients


    - butter or oil for sautéing

    - 1 large carrot, diced

    - 1 medium-sized onion, diced

    - 2 ribs celery, diced

    - 3 to 5 cloves of garlic, minced

    - 1 large russet potato (or 2 medium-sized potatoes), cut into small cubes

    - 1/2 cup roasted buckwheat kernels

    - 3/4 cup dry red lentils

    - 2 cups vegetable stock

    - 1 tablespoon herbs de Provence

    - 1/4 cup nutritional yeast

    - 1/2 cup frozen corn

    - 1/2 cup frozen peas

    - salt and pepper

    - breadcrumbs (optional)


    1. Preheat the oven to 400°F (200°C).


    2. In a pan or in an oven-and-stovetop-safe pot like a cast iron Dutch oven, sauté
    onion, carrot, and celery in butter or oil for about seven minutes; add garlic
    and potatoes. Add salt and pepper to taste.


    3. After a few more minutes, add the lentils, buckwheat groats, herbs de Provence,
    and vegetable stock. Turn up the heat and bring just to a boil, stirring frequently.


    4. Turn down and let simmer for 30 to 40 minutes, until the liquid has been absorbed
    and the lentils and buckwheat are cooked.


    5. Add nutritional yeast, frozen corn, and frozen peas. Stir to combine. Taste;
    add more salt and pepper and more nutritional yeast, if desired.


    6. If you''ve been using a sauté pan, transfer contents into a loaf dish and place
    into oven. If you''ve been using an oven-and-stovetop-safe vessel, bung it directly
    into the oven. You can top the dish with breadcrumbs before placing it in the
    oven, if you like.


    7. Cook for 30 minutes at 400°F (200°C).


