    # the spins family board game


    The restaurant where I learned to make yogurt did not make most of its food in-house.
    The curries were made the next town over and driven in in two-gallon pails, much
    of it Northern Indian fare: matar paneer, chana masala, rajma, butter chicken.
    We made onion bhajis and vegetable pakoras and rice in-house, letting by heating
    milk in a large pot on a hot plate, letting it cool to room temperature, and whisking
    in high-quality plain yogurt with a strong enough culture to transform the whole
    plate.


    The restaurant was called Curry in a Hurry, and it was located in downtown Guelph
    in a century-old house next to the Guelph Mercury. Before I ever worked there,
    I ate there with my dad. Our server was usually Tim, an energetic, outgoing dude
    who seemed so at ease with himself, the kind of person who coheres a group.


    It was Tim who later taught me how to make yogurt. And onion bhajis. The onions,
    the butter, the spiking, the ratio of batter to onions—just enough to coat, the
    bhajis would come out looking like friendly edible spiders. We did the whole process
    with our hands. And then we''d drop the bhajis into hot oil for the first time,
    cooking just enough so they''d ready to become golden brown and to order on their
    second fry.


    Our job mostly consisted of reheating curries for people dining in and people
    ordering takeout. There was prep work in addition to making bhajis and pakoras
    and yogurt and raita—you could add green peppers to tomatoes or raisins to your
    base curry for a small fee. But for the most part, it was a choreographed dance
    of microwaves and dishwashing.'
