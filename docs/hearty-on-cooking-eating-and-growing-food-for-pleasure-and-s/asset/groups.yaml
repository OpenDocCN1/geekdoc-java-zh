    # the garden will bloom again


    The first seed to break the surface of the soil in 2021 was celery. Next came
    the bergamot and lemongrass, and then, more slowly, the leeks. Their greens were
    tiny pinpricks against the deep brown and perlite white of the potting soil; under
    the bright grow light in my kitchen, they began to unfurl, stretch upward. It
    was early March of my third year in my house, with my garden.


    Outside, there was a large pile of horse manure sitting on our driveway, which
    is separated from the backyard portion of the garden by a deer fence, the cheapest
    deer fence we could construct, made out of six-foot metal fencing lashed onto
    eight-foot metal T-posts that we drove into the ground using large rocks—rocks
    the size of a very generous sourdough loaf. To do this, I wore Will''s bike helmet
    and braced the T-posts with my hands; Will stood above me on a ladder, whacking
    the posts as hard and as evenly as he could. We must have looked out to our neighbours.
    But at least one rock cleaved apart from the pressure of repeated whacking, booming
    the helmet and rolling off its side onto the ground.


    We live on a quarter acre with a view of the Pacific Ocean, in a microclimate
    that is a little warmer than that of the surrounding area, warm enough that tomatoes
    grow vigorously outdoors. But not warm enough for peppers or eggplant. The backyard
    is set up in beds separated by wood-chip paths, with a few six-inch-high raised
    beds and one foot-high raised bed. Will and I share the beds. About a third are
    nursery beds for the trees and shrubs that she propagates, and two-thirds are
    for vegetables. We build'
- md: '

    archways for the squash, melons, cucumbers, and beans out of laurels and string
    or leftover fencing. A small patch of grass remains in the northwest corner, large
    enough to hold our picnic table and the little wading pool set up in the summer.
    There is an asparagus patch and an herb garden, a cherry tree and two apple trees,
    a number of shrubs that bear currants and blueberries, and a strawberry patch.
    Our hoop house and our greenhouse.


    The front yard, which came with a giant blue spruce, is where Will’s trees and
    shrubs go when they are mature enough to suit his vision for the yard—into shaped
    beds that work with the slight grade and the shape of the space. There is no deer
    fence in the front yard, the most vulnerable plants, like the ginkgo biloba we
    splurged on from a nursery on the island, are rigged by little cylinders of metal
    fencing, or in the case of a small spotted laurel, nestled underneath an overturned
    bird cage that showed up at the curb in front of a neighbour’s house garage day.


    We live in the house in almost the exact haphazard state that we bought it—but
    the garden, we transformed. Are still transforming.


    One of our earliest springs takes every year is to spread manure or compost, wheelbarrow
    over the garden beds. This is a task that Sinclair, now six, has helped with ever
    since she could walk. In 2020, when she was two years old, she used a small plastic
    spade. By 2021, when she was using her own real little shovel, which she’d received
    as a present from a friend.


    The first spring of COVID, Sinclair and I were digging sod together in the backyard
    to make new beds for trailing squash. I was listening to the news every day. There
    were pictures of cooling trucks parked behind New York City hospital morgues.
    Li Wenliang, the whistleblower who had noticed the emergence of what he identified
    as a new SARS-like virus and alerted other doctors, who had died after contracting
    COVID himself. People were sheltering in their apartments. Everyone was talking
    about essential work.


    The docuceries Lenox Hill aired a special pandemic episode, taking viewers inside
    the hospital as health care workers struggled to keep up with the intense pace
    and requirements of caring for COVID patients—crying, their post-shift faces reddened
    and grooved with lines from pandemic PPE.


    On the northern Sunshine Coast, distant from the initial main epicentre of the
    pandemic, we focused on growing the garden. As we shovelled, Sinclair wrapped
    her two-year-old mouth around the word “coronavirus,” repeating it over and over
    as we worked in crisp air and sunshine.


    That spring, the sprouts and blooms emerged by two by two with worsening news
    and our worsening anxiety. But the garden provided hope. A literally grounded
    vision of the future. We raised beds from cedar planks, spread mushroom manure,
    planted our first snap peas. Hellebore and heather offered colour against the
    grey early spring sky; blueberry blossoms followed by blueberries; tiny broccoli
    seedlings were followed by leaves and the eruption of edible florets. Everything
    in the garden felt meaningful, full of life.


    The second pandemic spring was different. Alongside a vanishing wick of hope,
    our early preparatory time in the garden unearthed the difficulties of the previous
    year. My nana had died, and I hadn’t gone home to attend her funeral. I felt unable
    to mourn, as if I’d hit a pause button on life, the continuous seasonal rhythms
    of the garden wasn''t quite unsticking. It still felt good to be outside, working
    on spring tasks, but the meaning felt different—tinged with sadness and frustration
    and nihilism.


    I wasn’t alone in this. When Lori Weidenhammer, the author of Victory Gardens
    for Bees, was a child in Saskatchewan, she spent the winters looking at seed catalogues
    and thinking about what she’d grow the following season. In Vancouver, where she
    lives now, there’s an idiom that marks the beginning of the season for her: “When
    the forsythia is blooming, it’s time to prune the roses.”


    But the events of 2020 complicated her relationship to the hopefulness of spring
    gardening in 2021. “Yesterday I was exercising outdoors by this currant bush,
    last year at this time of the year I was exercising at, and it was just the beginning
    of the lockdown, so it triggered all of these horrible, horrible feelings,” she
    told me.


    The third and fourth pandemic springs brought their own lessons. As I spend more
    concentrated time on the farming and gardening and homesteading sides of Instagram—I
    am always looking to learn and grow in spring—the algorithm starts me content
    from preppers and people who do not believe in pasteurizing milk but believe in
    water-bath canning it. People who mistrust the government about vaccines and digital
    banking and, apparently, botulism. It’s depressing, makes my stomach churn with
    anxiety.


    Meanwhile, in 2023, drought persists. Cedars in my neighbourhood turning brown
    and dying off. The wildfire haze settles in early. We water half the garden diligently,
    but with a sprinkler, so we can keep up with its needs. For the other half of
    the garden, I use last year’s drip line from a local farm to set up irrigation
    for tomatoes, squash, melons, cucumbers, and celery. My friend Jen helps me plan
    and figure out the hardware I need to buy to complete the system; we order some
    online and get some at the local Rona, and Will do one final trip to Pete’s Plumbing
    for some PVC pipe we’ll use as a header pipe.


    Often, I feel as I’m floating above my body. Still, the rhythms of attending to
    the garden’s needs bring me back into myself for a moment as I turn on spigot
    to start the morning watering or enact a gentle, measured yank to harvest a pea
    or a bead of chamomile flower.


    Spring reminds me that life is cyclical, rather than linear.

