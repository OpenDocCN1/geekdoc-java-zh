  - '[PAGE 64]


    the world. As physicist and activist Vandana Shiva has said, “Seed is created
    to renew, to multiply, to be shared, and to spread. Seed is life itself."


    On an unseasonably warm and dry October day, I meet a handful of farmers from
    Stowel Lake Farm at a local agricultural hub called the Root, just over a kilometre
    from Ganges Harbour on Salt Spring Island. The Root, which is run by the Salt
    Spring Farmland Trust, has a commercial kitchen, food storage space, meeting space,
    and an office space. It also houses the Salt Spring Seed Sanctuary, a charitable
    organization dedicated to preserving and promoting-pollinated heritage seeds.
    Its database contains 115 varieties; 577 members grow out seeds, reporting back
    on the performance of the plant and sowing seeds from the best and strongest specimens.
    “Our mantra is that good food comes from good seed,” they write in their summer
    2022 newsletter.


    Today, the Root is providing another service: it’s teamed up with FarmFolk CityFolk
    to bring a mobile seed cleaner to the island to process her homegrown lentils.
    When I arrive, a woman is using-cleaning screens to process her Meghan McEachern,
    Stowel Lake’s head farmer, arrives with five or six other farmers and several
    Rubbermaid bins holding large bags full of seeds that need to be cleaned.


    Siri van Gruen, who works at FarmFolk CityFolk, shows me the thresher, a red and
    beige machine that uses vigorous motion to split the pods and seeds from chaff.
    Siri places rye in the hopper. The seeds fall through a screen and pass out the
    side of the machine, through a chute, into a waiting blue Rubbermaid bin. The
    chaff is carried through the machine and spat out onto a waiting tap. There are
    two screen sizes—smaller screen for grain, and a larger one useful for beans.
    One of the'
  - '[PAGE 65]


    more curious uses she''s seen, she tells me, was for a buckwheat pillow maker
    whose focus was on getting the hulls rather than the seeds.


    Thea, a farmer from Stowel Lake, attempts to use the thresher for radish seeds;
    although the seeds themselves are relatively small, they''re enclosed in hard,
    puffy, tough-to-crack pods. The thresher turns out to be no match for the pods,
    so Thea turns to something called threshing box: it''s wooden with a ridged floor
    and is large enough to stand in. Thea steps on the radishes in her boots, crushing
    the stubborn pods as she grinds the balls of her feet in semicircles.


    Siri demonstrates the Winnow Wizard next. This machine is larger with a hopper
    on top. Farmers from Stowel Lake feed it some spinach seeds. An auger in the hopper
    shakes the seeds loose from the pods. A fan—which is set to low for small seeds
    like spinach, and high for large seeds like beans—blows the chaff loose, and the
    seeds get funnelled into a wooden box. I''m not sure why, but I was expecting
    spinach seeds to look like kale seeds: small, dark, round. Instead, I find they
    look like buckwheat groats. It is mesmerizing to watch the thresher and the Winnow
    Wizard at work. Despite the commotion, their work is delicate. And it''s satisfying
    to see the seed pods processed so efficiently.


    “You have a good amount of chaff in your hair, Meghan! someone—Thea or Hannah—calls
    the Winnow Wizard continues to do its work.


    When Thea is done crushing radish pods, she uses a generator-powered air compressor
    to blow the chaff from the seeds in the box.


    With the noise from the machines added to the physical separation they create,
    it''s hard to hold a conversation, or sometimes to even tell someone is trying
    to talk. After a half hour of taking notes, I settle into a spot on the Root’s
    gravel parking lot with some manual seed-cleaning screens, slowly working my way
    through flower seeds. First up is Texas hummingbird sage,'
  - '[PAGE 66]


    a type of salvia that guards its seeds in small pods that I break open by rubbing
    them over a metal screen with my hands and into a waiting wooden box. I move on
    to mixed cosmos, long thin seeds with similarly sized chaff, separated most easily
    by lightly blowing on the screen until it floats away on the breeze. And finally
    coreopsis, which also guards its seeds in a little pod at the base of the flower.


    When the machines are quiet, I chat with the farmers from Stowel Lake. In addition
    to the spinach and radish, they’re tackling mustard, arugula, chard, Amish peas,
    lettuce, scallions, and more. The scallion seed heads are surprisingly fluffy;
    I never would have guessed. Similarly, I never would have guessed I’d find seeds
    in general so magnetizing. But do I—each small seed contains its own comparatively
    massive world of potential.


    Some seeds we save so we can sow the vegetables or flowers again. Others are dual
    purpose. The dried beans and peas we use in cooking are the ones we’ll plant next
    year. Celery seed, which tastes exactly like celery, can be used in potato salads
    and vinaigrette, soups andmillis. The seeds of plants in the mustard family, also
    known as brassicas, like broccoli, can be used to make grainy mustards. Squash
    seeds can be roasted or toasted.


    When plants like kale grow a flower stalk and go to seed, they shoot up to double
    or triple or quintuple their harvest-season height. The leaves of the plant become
    bitter as it turns its energy towards reproduction; at this point, it is taking
    up space in the garden in service of making future plants that will be harvestable,
    rather than continuing to be harvestable itself. Some plants, like celery—or again
    kale—produce an overwhelming amount of seed per plant, more than a home gardener
    would ever reasonably use themselves. Both start from seeds so small they can
    get lost in the creases of your palm. And then they grow, and they crop, and they
    produce thousands of new seeds. Each plant feeds us for a time and provides us
    with an'
  - '[PAGE 67]


    opportunity to feed ourselves and each other again the next year. It''s all terribly
    mundane, but it''s mundane in the way that all life cycles are simultaneously
    mundane and a type of embodied magic, full of love and grief. From the earth we
    all emerged, and to the earth we all will return again.


    At the same time, it''s all very practical. The machinery that FarmFol CityFol
    tours around the province allows home gardeners and small and mid-sized farms
    the ability to save labour by sharing machines and tools at a scale that makes
    sense for them—a half step between manual seed-cleaning cleans and the giant combines
    used on large-scale farms.


    This brings a lot of value to farms like Stowel Lake. Tea tells me she estimates
    they''re spending at the Root with the mobile seed cleaner will save a month''s
    worth of manual seed-cleaning work back at the farm.


    Most farms I''ve visited, even small run by people heavily invested in local food
    and food security, do not build seed saving into their annual rhythm. It''s time-consuming,
    takes up growing space, and can be tricky if it gets too cold or rainy too quickly
    in the fall. Stowel Lake is an outlier; I''ve come to Salt Spring to understand
    why and to see how they do what they do.


    The next day, I reach Stowel Lake using a hand-drawn map Meghan sketched into
    my notebook. I cross a dry creek bed and an ornately carved wooden bridge that
    looks like something from the Lord of the Rings. I pass by a house, through a
    gate, and down a lane. I walk by a field containing two white alpac and an inquisitive
    brown cow relaxing in some lush grass. Eventually, the market comes into view:
    a gentle'
  - '[PAGE 68]


    slope down into a small valley, the sun hitting the hill rising on the other side.
    There''s an apple orchard, a wash station, an open-air seed propagating area holding
    pea sprouts that have just had a haircut. There are plastic-covered hoop houses
    and garden beds full of greens; there''s a converted barn with rich brown wood
    and floor-to-ceiling windows in its loft. I am wearing a T-shirt and sunscreen;
    if the apples weren''t near ripe on the trees, it would be hard to tell we''re
    midway through autumn.


    The farm is beautiful, verdant, idyllic. It''s the type of place you visit once
    and immediately begin visualizing as a fantasy home. I hear people talking over
    in the wash station; when I approach, I see farmers Thea and Hannah, who direct
    me to the converted barn, which I learn houses the commercial kitchen, used to
    prepare meals for retreats, as well as the farm office and a loft space set up
    with dining and lounge areas.


    Squash is curing under the skylights in the loft: red kuri, kabocha, carnival
    butternut, sweetmeat. If I lived here, I catch myself thinking, I''d work in the
    retreat kitchen, which smells like many vegetarian kitchens I''m familiar with:
    oats and cinnamon, roasted vegetables, cumin. While Meghan finishes up a few tasks,
    I gaze out the loft''s tall windows, picturing myself turning farm greens into
    salad tossed in an herby vinaigrette; in the fall, using some homemade yogurt
    in a dough for an apple galette, topped with a drizzle of caramel.


    When she''s done, Meghan gives me a garden tour. As soon as we leave the converted
    barn, we run into Lisa, who bought this land in the mid-''70s and raised her family
    here. For a time, Lisa ran the farm as a U-pick strawberry farm. Now, she focuses
    on the perennial gardens, designing them so that there is something blooming year-round,
    providing nectar for birds and pollinators. The perennial garden has become something
    of a collection, Meghan tells me; Lisa grows some unusual, harder-to-find perennials,
    gleaning seeds and selling thems through the farm stand.'
- md: '

    About twenty-five people live on the farm year-round, including eleven children
    ranging in age from two to seventeen. The farmers grow food for the retreat groups
    that come to the farm, for their community, and to sell at the farm stand. Unlike
    a lot of other market garden farms, they also grow seeds for seed production.


    The farm comprises about 120 acres in total, but the market garden is growing
    on an acre and a half of land that sits in a low valley. This geography influences
    where crops are planted; a low mist comes in the fall, Meghan says, making the
    area wetter and a bit colder. The hill, on the other hand, stays warmer and drier
    in the early spring and fall, so this is where they tend to grow plants destined
    for seed saving. There are pollinator beds planted around the food beds. In one
    area that Lisa has planted, redwing blackbirds are taking turns swooping in and
    harvesting seeds from a row of sunflowers.


    They''re intentional about which crops they grow for purposes, Meghan says. For
    the farm store, they choose quick succession crops, like greens, that are ready
    to harvest in under seventy days. Crops like potatoes, squash, and onions, which
    take much longer to grow and ripen, are grown just for the community.


    It''s warm enough this October that tomatoes, eggplant, peppers, and basil remain
    in unheated hoop houses; fall crops like lettuce have now been planted at the
    base of the tomatoes and will continue growing after the tomatoes are taken out
    when it gets too cold for them. I try an herb I''ve never tried before, called
    tuls. The leaves taste a bit sweet, a minty.


    Meghan is carrying paper bags. In one field, we stop to harvest seeds from a Salvia
    romaine lettuce. We place the paper bags over the seed heads, bend the stalk of
    the plant, and shake. The seeds, surrounded by cottony fluff, flutter to the bottom
    of the bag.


    Meghan points out some leeks growing—Lancia and Darcy’s Purple. Eventually, she’ll
    select the ones she wants to save and transplant them to the beginning of the
    row, to keep things tidy, concentrated, and easy to access.


    There are still lots of plants in the ground, but much has been harvested, and
    Stowel Lake is now readying for winter. The zucchini will be pulled soon; some
    beds will be mulched, and some will be tarped to keep the ground warmer and dryer
    for the crops to be planted in the spring.


    We end our tour on the hill that rises on the opposing side of the valley from
    the converted barn. There are beehives, taken care of by a local beeper, Bruce.
    There are scarlet runner beans and bush beans. There are fruit and nut trees planted
    on a swale and berm system, contour, for water management: hazel, apple, pear,
    peach, cherry, and olive trees. And there’s a huge greenhouse—Lisa’s new dream,
    Meghan says. It’ll house subtropical trees, like citrus and avocado.


    Over the years, Meghan says, Lisa has developed the farm with an eye to beauty.
    To me, it feels like Stowel Lake’s seed saving is part of this: allowing plants
    to cycle all the way through their life stages instead of stopping them short
    also allows us to know them better, to pay a fuller kind of attention.


    Larger companies, like West Coast Seeds, get around the problems of climate and
    seasonality by sourcing seeds from regions where the plants reliably grow well.
    Skagit County in Washington State, for example, is one of only two major regions
    in the world for spinach seeds, according to Mark Macdonald, West Coast Seeds’
    former communications manager.


    On a visit to Skagit County, Mark once visited a warehouse for spinach producers.
    “They had these wooden boxes, four foot by four foot by four foot,” he says. “And
    they’d be full of seeds. And there were ten of them tall, and fifty of them that
    way, and fifty of them that way. And that wasn’t for one hundred years. That was
    for this season’s spinach production. That’s producing most of the world’s spinach
    seeds.


    “Many of us source from the same farm,” Mark says. “And when those plants are
    ready to harvest the seeds, the farmers go out with their equipment and fill trucks,
    and the trucks line up for miles.”


    There’s a stark difference between the scale of this type of spinach operation
    and what I saw at Stowel Lake, which saves seeds for their growing purposes, as
    well as to package and sell through Salt Spring Seeds. The scale of the operation
    that West Coast Seeds taps into allows them to provide a massive amount of non-GMO,
    non-chemically-treated hybrid and open-pollinated seeds reliably every year.


    But growing seeds out through smaller-scale farms and via home growers, in conditions
    plant varieties find less than optimal, also forms a key part of long-term sustainability
    and food security plans.


    Dan Jason, owner of Salt Spring Seeds and author of *Saving Seeds: A Home Gardener’s
    Guide to Preserving Plant Diversity*, first got seed saving and selling as an
    extension of his interest in practising self-sustaining, bioregional growing.
    His perspective on dealing with climate conditions and diseases that make seed
    harvesting more difficult is the long view.


    “It’s about navigating and taking advantage of situations that somebody would
    look at as bad news,” he says. “One year that I grew three hundred different kinds
    of tomatoes, there was a very bad blight. And a couple of tomato varieties survived
    it. So there you go: there’s your opportunity to save blight-resistant tomatoes.
    That’s a great opportunity.”


    Next to Dan Jason himself, Stowel Lake is the largest grower for Salt Seeds. For
    seeds, they grow out three types of leeks; four types of beans; herbs like cilantro,
    parsley, and dill; greens like arugula, mustard, kale, spinach, beets, radishes,
    squash, and tomatoes.


    “It’s quite an orchestra,” Meghan says.


    The importance of home growers to seed saving and diversity movements has also
    seen a recent resurgence. Seeds of Diversity, for example, has a thousand members
    coast to coast. Its seed library boasts over 2,900 regionally adapted and rare
    seed varieties; volunteer members grow out and multiply these seeds each year,
    helping to secure these varieties’ futures. They also hold events called Seedy
    Saturdays, where home growers can share seeds and get seeds from their area—a
    way to try out new varieties with no cost outlay. Home growers don’t often have
    the space to grow out dozens of examples of each plant, as Meghan might at Stowel,
    but they do have the freedom to grow varieties that may not be commercially viable,
    productive, or that have a smaller niche of people who prefer their characteristics.
    And this can lead to situations like Dan Jason saw with his blighted tomatoes—a
    surprising underdog variety can pull ahead in circumstances more popular varieties
    find too challenging.

