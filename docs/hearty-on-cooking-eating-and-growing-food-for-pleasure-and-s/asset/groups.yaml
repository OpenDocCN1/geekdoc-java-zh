  mdcn: '

    在那周的食材订单中。他们学习了如何操控和理解像热量这样的东西。通过大量的重复和练习，他们学会了刀工、一致性，以及在搅拌、撕裂，或煎制和释放时，食材应有的感觉。


    厨师们进入厨房时无论对食物有多种热爱，都会为了服务他人而勤奋地增加这种热爱。但大多数工人的工资极低，以至于他们无法在工作的地方吃起顿饭。在我住的地方一家中型家庭餐厅里，一份泰式河粉加无糖可乐，加上税和小费需要
    23.49 美元——这相当于一小时二十一分钟的厨房工作（平均时薪 17.35 元）。在温哥华的一家高级牛排馆，一份黑椒牛排和一杯黑红酒，加上税和小费要花费
    119.91 美元——相当于六小时五十五分钟的厨房工作。


    成长过程中，我父母做的大多数食物都是廉价、基础、准备快速，且符合我的阶级地位：面包上的花生酱香蕉吐、冷冻意大利饺面焗菜、用罐装蘑菇奶油汤做的金枪鱼焗菜、火腿奶油焗土豆、在微波炉里用塑料量杯加热后淋在白水水面上的意面酱。早晨冰球练习前的
    Tim Hortons。特殊场合去吃麦当劳，或者如果祖父母请客就去吃自助餐。


    作为一个在食品服务行业工作的青少年，我学会了如何制作简沙拉并获得了一些刀工；后来，我学会了做早午餐、熬好汤、烤面包、制作酸奶、混合并油炸印度油饼、烤枣枣块和黄油挞、用切片刀切萝卜使其看起来像羊皮纸。制作浓肉汁（demi-glace），掌握瑞士蛋白奶油霜的技巧，因为美式奶油霜太甜了，而且有防结剂的味道。种植自己的圣马扎诺番茄，并用它们来制作
    Marcella Hazan 那种无可比拟的四配料番茄酱，这种酱只需要番茄、黄油、洋葱和盐。


    换句话说，在厨房工作让我培养出了本不该拥有的味蕾。即便今天，我的穿得也像个对 Value Village 近期涨价感到反感的人；我吃得像个在 1994 年于温哥华买房的终身制人文教授。我不会为了买车而贷款。但我会贷款购买奶酪店现有的三种半软生牛奶有机法国奶酪，每种一百克，以便我比较它们的差异，并决定我更喜欢哪一种。当我觊已久的厨用搅拌机或上琅铸铁锅打折时，我会贷款购买。我会自己炸无面粉甜甜圈，因为甜甜圈新鲜温热时最好吃。我会为自己的生日买一个水密封发酵罐，这样我就可以在家轻松制作发酵酱和泡菜。当我去城市时，我会特意去专营店补货我最喜欢的品牌熏红椒。当我看
    Netflix 和 HGTV 上的品牌、房地产和室内设计节目——《落日阳光》、《梦想家改造》、《留着还是卖掉》——或者在《建筑摘要》上看到精美的厨房时，我不会羡慕他们的景观或定制沙发，但我会相信我拥有富人认为应该拥有的那种厨房。


    并不是说食物必须昂贵才好吃。也不是说用简单的工具无法做出美食。但从根本上说，为什么负责制作美味食物的人不应该享用它？如果是我的技能和味觉创造了这顿饭，我就应该能吃到这顿饭。而最能利用厨房工具的人才是值得拥有它们的人。富人可以很容易获得昂贵的食物和工具；一些富人寻找这些食物和工具是因为他们喜欢吃和煮。但另一些寻找这些食物和工具是为了财富的标志，切换菜系就好像一个制作良好的搅拌机或整个国家的饮食文化会过时一样。因此对我来说，那些通过劳动和创造力驱动这些消费者选择的工人阶级审美、饕客和农农也能获得机会，这是公平的。最好是通过提高他们的工资并增加负担得起的住房供应。但至少，要确保工人有机会坐下十五分钟吃自己的早餐、午餐或晚餐。


    在我搬出去之后、毕业并开始做一份不合适的传播类工作之前，我在任何厨房工作中吃到的免费餐有时是我当天唯一吃的一顿充实食物。2004 年，安大略省的最低工资增加到每小时
    7.15 元；到 2007 年，达到了 8 元。当时的推动目标是 10 美元的最低工资——实现得比需要的时间晚得多，而且通胀速度超过了工资增长。我在贫困中度过了这些几年，在脑子里计算需要多少个班次才能赚够付房租、付账单、买菜。这有时会导致一种无力感：如果我买不起换双站了这么多小时后磨损的鞋，我不如把当天赚的钱花在
    Jimmy Jazz（还在营业）的下班啤酒，和 Salsaateria（已关门，愿安息）的素食卷饼。我曾以为自己很会花钱；当一个用贷款额度支付学费的朋友选择破产时，我意识到我们都只是薪水太低了。


    在厨房工作改变了我与食物的关系以及获取食物的方式，拓宽了我的味蕾，让我能够探索我本不会接触接触的技术、食材和方法。

