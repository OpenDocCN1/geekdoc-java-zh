    我正缓慢地朝农场驶去，驶入那条崎岖、坑洼的小径，心率开始恢复正常。


    在国王大道东端的地块上有一个小农场摊位，带有一些停车位。它后面是一片休耕的草地。北端的地块坐落着一座老农场，Ron Berezan 在那里经营农场，他是一位认证永续农业教师。农场小径向北延伸，左侧是一个草药园和蜂箱，右侧是清洗站和冷库；在地块尽头，左侧是一片草地和四分之一英亩的自采蓝莓园，右侧是一个两亩大的蔬菜园。这座农场支持CSA（社区支持农业）蔬菜计划，并通过农场商店和几家当地杂货店向社区供应蔬菜。它还吸引了人们：共享社区成员、像我这样的志愿者，以及带着老师访问的当地学校的孩子。


    我开始做志愿者并不是出于本心，甚至不是出于对社区食品安全的愿望。我是在季节中期，七月的第一周开始志愿的，此前我把一盆甜椒植物从温室门口扔到了车道上，它在那里摔碎了。


    那些最初生长得很好的辣椒出现了软腐斑点——也许是浇水导致的花腐病，也可能是炭疽病，一种在温暖潮湿条件下盛行的真菌。我本对对辣椒的生长状况很满意，而且季节初的炎热让我们本能大丰收。这些软斑点的出现正值我心理健康的低谷，它们感觉就像是最后一根稻草；我的荷兰豆得了白粉病；我盆栽种植的番茄，甚至是樱桃番茄，也染了花腐病；我的茄子感染了红蜘蛛；而菜蛾还吃光了我的紫芽苗——整整两次。


    我把那些软斑点看作是自己的失败。辣椒的失败是因为我是一个个失败者。一个在前几个季节拥有了“新手运”的人，现在必须面对现实了。一个人将所有的自我价值建立在成就之上，而现在除了浪费土壤和时间外一无所事事。在那一刻极度的挫败、暂时的自我厌恶和一阵无法平息的怒火冲击中，我咒骂着并扔掉了那盆辣椒。


    在事后——向向我困惑的孩子、伴侣和猫道歉，清扫土壤，冲洗并回收塑料碎片——我意识到不能再这样生活了。同一天，我加入了一个针对双相情感障碍者的在线同伴支持小组，并给
    Blueberry Commons 的 Ron Berean 发了邮件。之后，我加入了双相情感障碍支持小组。两周后，我在农场开始做志愿者。这两个行为都是为了两个问题：想要好起来需要什么？当作物失败时，怎样做才不会对此如此个人化？


    “我准备好迎接春天，但还没准备好面对时光流，”今年早些时候我在花园日记中这样写道。还有：“出于园艺原因我对三月的向往，与我希望在这个该死的瘟疫期间停止像吃豆人一样吞噬每一天每一月的愿望之间，是完全隔绝的。”


    起初，园艺为我提供了一种缓解焦虑和抑郁倾向的方法，让我能够顺应季节的节律、植物、昆虫、土壤、雨水、阳光和天气变化。从种子培育植物并支持它们生长，最后用它们的果实烹饪，这种感觉是字面意义上的转变。


    到了第三年，这种感觉有时如此，有时并非如此。有时打理花园感觉是一份礼物；其他时候，它就像是长长永无没了的日常杂务清单上的又一项任务。变成一个待勾选的项目，或者更糟，是一项进一步消耗我枯竭的能量和意志力的任务。


    当我给朋友 Nola 发短信说我花园的失败时，她叫我倾诉出来吧。“这确实令人沮丧，”她回道，“如果这有帮助，请记住，任何规模的农农都经历过那种体验。有些年份，你收获的是知识；有些年份，收获的是更多食物。”


    Nola 分享了一个故事：有一，一位永续农业园丁想去她的茶园。园丁知道 Nola 曾是一位永续农业设计师，所以她觉得那里应该很好——但实际上到处都是杂草，有些植物长得非常吃力。Nola
    告诉她的朋友不要来。当朋友坚持时，她坦白了花园的状况。“你会惊讶于和朋友并肩工作四个小时能成就什么，”Nola 的朋友告诉她。“这产生了巨大的变化，”Nola
    告诉我，“在土地上是如此，在我心里也是如此。”


    创造了“永续农业”术语的 Bill Mollison 将其定义为：“对农业生产系统有意识的设计和维护，这些系统具有自然生态系统的多样性、稳定性和韧性。”

