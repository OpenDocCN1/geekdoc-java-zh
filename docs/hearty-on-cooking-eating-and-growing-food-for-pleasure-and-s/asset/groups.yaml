    the basics, foods that would keep me fueled and ward scur and anemia. But Nosrat
    is right about what happens when you survive on grains and pulses—it the pop of
    sweetness from adding frozen corn or peas, the zing from grated ginger, the freshness
    of mint or parsley or cilantro, the dollop of sour cream, that makes it possible
    to eat in again rather than running up your credit card in search of novelty.


    Cooking with what I have lying around is different for now that I am middle class.
    It took me a long time to become middle class, well into my thirties, and when
    I did, I turned into my grandparents: well-stocked pantry, well-stocked freezer,
    savings growing very slowly every month, except for the months I need to go to
    the dentist or send money to the farm in order to buy my CSA for the year.


    The main difference, like Nosrat’s buffet of recipes suggests, is that my pantry
    allows me to pivot into different countries or regions of cuisine on a whim—everything
    from Dijon mustard and mustard seeds to honey and maple syrup and many kinds of
    vinegars; soy sauce and sesame oil and Lao'
  - '[PAGE 114]


    Gan Ma chili sauce and gochujang. Pine nuts and sesame seeds, almonds and peanuts
    and pistachios. Rice noodles, gluten-free pasta, gnocchi, cornmeal, short-grain
    and long-grain rice, wild rice, popcorn kernels, buckwheat groats. Red lentils,
    French lentils, black-eyed peas, pinto beans, scarlet runners, black beans, small
    white만의. Chickpeas I buy in cans—the aquafaba''s useful as an egg substitute.
    Baked beans. Frozen peas and corn. Frozen blueberries. Roasted seaweed sheets,
    and furikake seasoning, which, in my household, we call "the shaky seaweed."


    I know the landscape of the cupboards like a park ranger knows their home park.
    I am thinking ahead four or five days at given time, planning out how and when
    the perishables will need to be used, what I''m craving, what my kids likes, what
    we haven''t had in a while, what will need to be prepped the night before. If
    we want to eat a galette and salad on a weeknight, I''ll need to make the dough
    and prep the innards the night before. If I''ll be cooking beans in the slow cooker,
    I''ll place it on the counter night before, filling it with the dry ingredients
    to make life easier in the morning.


    This flexibility makes it possible to eat beans every night of the week and not
    tired of them. If one night is pinto beans and rice with fermented hot sauce and
    sour cream, the next can be a black-eyed pea stew over polenta, and the night
    after that, chickpeas and roasted broccoli with peanut sauce and rice noodles.
    One night, lentil loaf; the next, warm lentil salad dressed in butter vinaigrette.


    If you asked me to define wealth, it would be housing security and this. I have
    three batches of homemade ice cream in my freezer right now. If I want rosemary
    for my roast potatoes, I can pick it fresh outside. Once a year, in the fall,
    I get to harvest from my saffron crocuses and make a pot of golden rice. What
    more could I ever want in life?'
