    His farm is on twenty-six acres, and he''s been there twelve years. He grows out
    a large variety of seeds, everything from carrots to grains to legumes. In one
    greenhouse, Dan shows me black chickpeas, Utrecht blue wheat, and gaucho beans,
    a bush bean that''s good to eat fresh as well as dried. All three are drying in
    the warm sun. In a second glass house, there are Lulu and Queen Sophia marigold
    seeds drying, and zinnia seeds and Nova aster. There are Gaillardia seeds that
    look like badminton birds. Triticale, a cross between rye and wheat; there''s
    Black Einkorn wheat, and there are millet seeds, which resemble fuzzy caterpillars.
    Birds like the millet, Jason says, and you can get a lot of seeds from one head.


    “When the birds start eating them,” he adds, “you know they’re ready to harvest.


    Underneath the seed tables, there are lidded buckets partially filled with fermenting
    tomatoes: Graham’s Good Keeper and Pollock, an early and productive variety. The
    fermentation process removes the protective natural coating around the seeds,
    which, while the fruits are growing, prevents them from germinating inside the
    tomato.


    In 2019, Dan published Changing the Climate with the Seeds We Sow, which advocates
    that small growers turn their attention to beans, grains, herbs, and seeds that
    haven''t typically grown widely in North America, at least on a smaller scale.


    “I keep on telling people: if we’re going to feed ourselves, it’s okay to have
    carrots and beans and onions, but it’s important to have the beans and grains
    that have fed us for thousands of years,” he says. “Very few companies focus on
    grains and quinoa. But they’re the easiest of all. They take minimal care and
    are the most rewarding.”


    I’m convinced, my next Salt Spring order contains Annie Jackson beans and a variety
    of bush bean called Early Pinkies. And—as I can’t eat gluten and was aesthetically
    quite drawn to them in seed head form—it includes the millet I saw drying in Dan’s
    glass house.


    Speaking with seed growers and sellers gives me some real hope about mitigating
    the impacts of climate change—impacts that have been all around us in increasing
    ways the past few years, especially on the West Coast. It has also helped me better
    visualize the connections between what grows in my garden and its recent lineage.


    By the time I said goodbye to Kevin Wilson at the end of his driveway last year,
    for example, I was taking home walks onions, lady’s mantle, and a packet of Swedish
    Red peas, also known as Bishopens—a productive deep-burgundy soup pea he counts
    among his favourites. Now, the grew onions and the lady’s mantle are thriving
    in our front yard. In our backyard, and I saved enough for a few pots of soup
    and to grow next year.


    After I’d initially spoken with Dan and Meghan, I placed an order for seeds from
    Salt Spring, choosing at least one seed I knew would come from Stowel Lake Farms.
    Those plants I grew the year I visited Salt Spring. I saved seeds from a variety
    of tomato I bought called King Umberto and from Sunshine Cava beans.


    Growing out seeds from the farmers and home growers I spoke with for this essay
    continues a cycle they began at their homes and on their farms, placing the plants
    I raise in a network that grows deeper and broader with each new grower. It takes
    a lot of care and attention to follow a seed from germination to the production
    of its own seeds; each seed I have received is a gift that will continue and itself
    become a gift for someone else.


    When I ask Meghan if farming for seed has changed her perspective on gardening
    and the growing process, she says it’s expanded her view on ecology. “At every
    stage of a plant’s life,” she says, “it’s not just the plant itself, it''s also
    all of the pollinators, it''s all of the other creatures and systems working around
    it which are working towards creating a plant at each stage.


    It''s also expanded the way she views seasons and the passage of time.

    “Seeds are a multigenerational project,” she says. “I''m not necessarily going
    to see all the fruits of what I''m doing today. You have to have a trust in the
    future, that actually what we''re doing has a benefit. And also that I''m inheriting
    all this work that people have done in the past.


    “We are on the backs of thousands of years of seed savers and people who have
    adapted the varieties we eat today, for the characteristics that we''re able to
    enjoy,” she adds. “The only reason why we are able to eat the food we eat today
    is because someone has saved the seed.”


    ## vegan lemon macarons


    On a grey day in mid-February 2022, after the first peak of Omicron has passed,
    my friends Nola and Megan come over to attempt vegan lemon macarons. (That is,
    the fancy little sandwich cookies generally made with almond flour, icing sugar,
    and egg whites, not the desiccated coconut mounds.)


    Sinclair has been wearing underwear on her head as a hat all day, and outside
    we''re having a weeping willow installed underneath the perimeter of our house—every
    time it rains, water and mud seep into our basement, trailing miniature rivers
    along the concrete pad that separates the rest of the house from the dirt underneath
    and around us.


    Nola is vegan and, like me, can''t eat gluten. She''s never tried a macaron before—a
    fact I find buoyant, because if ours end up mediocre she will never know. Nola
    and Megan are bearing gorgeous bright-yellow lemons plucked from the tree growing
    in Nola''s greenhouse.


    My desire to perfect vegan macarons is one part social, one part food-driven,
    and one part emery. Socially, the pandemic has left me lonely, and the idea of
    having friends hanging out in my kitchen to bake nearly brings me to tears. Food-wise,
    I want to provide Nola with a delectable morsel. And being emery: one of my favourite
    food essays is by Jeffrey Steingarten, and it''s about his quest to make a perfect
    macaron after he eats one “at a dinner party outside Paris,” one so good he “quickly
    added it to [his] list of the hundred greatest foods of the world, tearfully removing
    the Milky Way bar from [his] pantheon.” Steingarten and I share a picky, snobby
    aesthete’s love of food that is great, food that feels like a revelation, food
    that lodges itself in one’s yearnings for life. (We also share a similar opinion
    about Milky Ways—well, for me, Mars bars.) But my goal is to go on a quest for
    perfection. I would like to see Nola’s beautiful lemons turn into a delicately
    crunchy, beautifully chewy macaron, one that she can eat.


    We''re using a recipe from the blog Pies and Tacos, which specializes in macarons
    and cupcakes, seems to have done the most moist recipe of any of the bakers I
    find online who have made vegan macarons. The blog, Camila Hurst writes that she,
    like me, took baking in part as a cure for depression—to find a hobby that would
    infuse her life with purpose and joy.


    This recipe calls for aquafaba in place of the egg whites that would normally
    be used for the meringue that is folded with almond flour and icing sugar to make
    macaron shells. Aquafaba, as of those who are vegan, vegan-adjacent, or allergic
    to eggs might know, is the liquid that surrounds canned chickpeas. The term was
    coined in 2015 by an American software engineer named Goose Wohlt, but the first
    known use of bean slime as an egg substitute came in December 2014, by Joël Roessel,
    a vegan opera tenor who wanted to eat fondant, asked himself, according to the
    Washington Post, “What would disgust me as a raw egg white?”


    Unlike Nola, I have made and eaten many macarons. I''ve eaten them in Paris. I''ve
    eaten them in Montreal and Vancouver and New York. I''ve eaten them fresh in my
    kitchen, deciding that I have spoiled myself for most commercial versions and
    can no longer purchase them from bakeries that only do them instead instead really
    well. (Many bakeries use the Italian technique to make the meringue, which produces
    a more stable drier cookie; many also seem not to use fresh flavoured almond flour.
