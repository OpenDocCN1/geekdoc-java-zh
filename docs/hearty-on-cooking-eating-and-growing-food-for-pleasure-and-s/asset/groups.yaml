    A representative of her trifle custards (she’s made many over the years) calls
    for:


    +   * 50 grams (2 oz) caster sugar

    * 3 tablespoons cornfl

    * 4 egg yolks

    * 1 tablespoon vanilla extract

    * 450 ml (15 fl oz) full-fat milk

