    The next day, after swimming lessons, Sinclair and I went to the grocery store
    to get more mandarin oranges, whipping cream, and eggs. The centre is closest
    to the grocery store that carries organic dairy in glass bottles, which I''ve
    developed a taste for; the double nice thing about this cream is that it''s 36
    percent, even higher than the 33 percent available in cartons. (And it''s a true
    500 millilitres, unlike the carton, which comes in 473.)


    On day two, I again poured the tin of mandarin oranges over the sieve, reserved
    the juice, topped the sponges with the oranges, whisked boiling water into raspberry
    Jell-O, and added the mandarin orange juice. I cooled the Jell-O in the fridge
    for an hour, then poured it over a spoon and onto the orange slices and sponge.
    I felt like this was a step I could sleepwalking—but then it''s type of hubris
    that leads to mistakes.


    The morning of day three, I took what I''d learned from Mary Berry and made the
    custard recipe for her “celebration trifle.” It came together easily and reached
    the perfect consistency. I strained it, pressed plastic wrap lightly onto the
    top to prevent it from developing a film, let it come to room temperature on the
    counter, and then cooled it in the fridge for a couple hours before pouring it
    on top of the Jell-O layer.'
