  mdcn: '

    因为在我吃了几几口后，我需要决定如何处理剩下的那些罐装豆。


    这些天，我们大多吃干豆。疫情巩固了我转向干货和建立一个物资充盈的储藏室的趋势，这促使我大量订购了25公斤一袋的斑豆豆和黑豆。我做斑豆豆的方法非常简单：加入炒过的大蒜、洋葱、胡萝卜和青椒，配上米饭或玉米粉糊食用，再淋上酸奶油、莎莎酱和家里自制的发酵辣酱。黑豆我们则用于任何食物，从素食汉堡到汤或墨西哥卷饼（汉堡的秘诀是将煮好的豆铺在烤盘上稍微晾干，然后再把它们加入到汉堡的其他配料中）。我经常使用慢炖锅（Crock-Pot）方法，有时需要让豆子先浸泡并短时间煮，然后在一天之中慢慢炖煮；当它达到最高温度时，盖子在瓷器上轻轻摇动，房子里弥漫着炖豆的香气。


    我煮蚕豆、腰豆、黑眼豆、红跑豆——任何种类的都可以。我非常喜欢这些豆子。但我通常计划在前一天晚上就做好准备，把干食材放在慢炖锅里，在做当晚晚餐时炒一下任何预先处理好的食材。它们提供一种功能，而罐装豆则提供另一种。


    因为作为一种加工食品，罐装豆是解决没钱又没时间的万能药。它们现在依然如此！当我饥饿、疲惫且精打拮肘时，寻找某种只需要五分钟就能准备好又能让我感到饱腹的东西，我就会做它们。它们是我父亲家族留下的的一种文化后遗，既代表了我们近期在英国的根源，也提醒着那些食物不安全曾紧迫我们生活的时光，那时我们工作过度而报酬极少。但它也提醒了我童年里那些平静的时光，与父亲度过的慢节奏早晨，以及在所能寻找慰藉的力量。


    ## 对精致生活的追求


    你还记得第一次切开哈密瓜吗？当时我十六岁，在好朋友父亲开的蔬菜水果店工作，店里有一个沙拉吧。那时我母亲和她的父亲正在私遇，当我们在店里工作时，他们就在附近的酒吧一起喝酒。我好朋友那个开朗的基督徒叔叔也在店里工作，还有她的奶奶珍（Jean），奶奶在晚餐前不吃东西，靠香烟和
    Tim Hortons 的四大杯奶油咖啡度日。那家店现在关门了，珍也去世了，所以可以放心告诉你她在厨房里抽过烟。


    珍是一个既慷慨善良又脾气古怪的人，她学了我的许多第一堂烹饪课。我已经在 Tim Hortons 做准备工作了，那里当时还在店内制作甜甜圈；我不做甜甜圈，但我要为炸苹果块去皮并切碎苹果，制作草莓挞饼，并在巨大的工业搅拌机中搅打奶油奶士块，使其变软并充气，然后分装到小杯里，供三明治站使用。


    在大多数时候，珍会告诉我们加满沙拉吧需要做哪些工作。她的食谱记录在一个活夹里，详细且清晰，有时会在页边留有额外的备注，字迹是瘦硬的笔画（珍的字）或非常接近半草体（开朗叔叔的字）。但珍有时会丢进一些额外信息，就像开启口头的碎片线索。例如，正是从她那里，我学会了如何煮带皮的土豆做土豆沙拉。皮在煮后会裂开并很容易脱落——事实上，你必须在趁热时剥皮，最好是你能忍受的最高热度，这样土豆的外层才能有效地与酱料中的蛋黄酱融合。


    当我第一次切开哈密瓜时，珍很可能就在场，当我惊讶发现它内部并不是实心的橙色肉块，而是一个盛满种子梗的大空洞时，我本想隐藏自己的惊讶。她会演示给我看，而不是用语言描述，如何挖出那些种子，并将哈密瓜切成月形和块状。切小到刚好能入口嘴，但表面积越小越好——这样保存得越久。


    在把哈密瓜拿去沙拉吧之前，我先吃了一块。因为沙拉吧在水果店里，我们用的甜瓜通常是熟透了。哈密瓜香甜又甜，带着一丝花香。它比我以前吃过的西瓜味道更复杂，口感也完全不同。在
    Tim Hortons，我们可以免费吃 Timbits，但吃多了就腻了。而在准备沙拉时品尝珍的沙拉吧点心就不会腻。她的土豆沙拉很完美，咸中带酸，带有西芹和青葱的脆感。她的意面沙拉在原本简单的酱汁中加入了鸡汤。每个人（除我之外，我从没试过）都喜欢她的魔鬼蛋，而且她对如何煮这些蛋有非常清晰的指示，以避免蛋黄周围出现青灰色的圈。（做魔鬼蛋也标志着我第一次使用奶油袋，这需要一定的技巧，顺便通过这种方式你就能发现馅料的粘稠度是否合适。）


    但能免费吃到哈密瓜是在那店里工作最棒的事之一。每一块的味道都略有不同。每一颗水果都教给我一堂关于如何判断未成熟、成熟、过熟的课程。过熟的哈密瓜吃起来有点像
    Sharpe 苹果。味道不太好，但很新奇，并不完全不可忍受。未熟的哈密瓜口感更硬，吃起来不像完全是龙舌甜味的纤维水。最好的哈密瓜是我们夏天买的安大略产产的，因为它们在接近成熟时就被采摘，味道和口感复杂而娇嫩，就像麦芽蜂蜜转化成了甜瓜。


    我开始在沙拉吧工作是因为我想多陪我的好朋友待会儿——而且因为我的性格并不适合零售等初级面对客户的职位。然而，真正让我坚持在厨房工作下去的是食物。我们并不为沙拉吧制作任何高端食物，只是那种在蓝领阶层参加退休宴会、单身派对或在当地冰球场社区室举办的聚会上能见到的菜。但通过在那里工作，我接触到了新的味道、新的口感和我原本无法获得的新体验。这让我想要更多。


    对于主厨、活动家兼作家约书亚·马哈拉吉（Joshua Maharaj）来说，烹饪学校提供了另一种课程——即人们预期一个来自印度裔家庭的学生（她的家里是“大家都会来的地方，只要一大锅印度菜就能喂饱所有人”），她的风味特征应该更加圆润平衡，以满足她在制作自制奶士通粉和派等食物时，老师们希望看到的效果。


    当我问马哈拉吉是否有什么印象深刻的记忆时，她立刻想起了在意大利的一口橄榄油。“意大利朋友告诉我，衡量优质橄榄油的标准是你可以像喝水一样喝掉一勺，”她说。然后她去了托斯卡纳，在橄榄园里进行试吃。“在那之后我变成了一个不同的人，”她说。她说西红柿也发生了同样的事。珍是一个既慷慨善良又脾气古怪的人，她学了我的许多第一堂烹饪课。（等等，文本似乎循环或重叠了，根据提供的片段进行了流畅度修正）。


    “它改变了一切，”马哈拉吉说。她补充道，意大利人在对待食物方面不是开玩笑的。他们要求遵循高标准。她说，这体现在整个体系中，他们能够维持这些标准，是因为与北美不同，那个系统里的每一个人，从种地的到烹饪和供应的，都受到了重视。当我20
    世纪90 年代末开始工作时，安大略 18 岁以下学生的最低工资是 6.40 美元。对其他人是 6.85 美元。有一份工作私下给我每小时 5 美元。有些工作给得得多一点；那些工作是口碑相传的。


    二十年后，尽管薪资在纸上看起来很高，与其他行业和目前的生活成本相比，却非常微小。2021 年加拿大的平均薪资（按现值计算）为 30.67 美元，厨师在运输和仓储行业为
    29.94 美元。教育服务为 36.70 美元。农业为 20.78 美元。


    住宿和餐饮业的平均薪资为 17.34 美元。


    与此同时，2021 年温哥华的生活工资标准是每小时 20.52 美元；到 2023 年已增加到 25.68 美元。

