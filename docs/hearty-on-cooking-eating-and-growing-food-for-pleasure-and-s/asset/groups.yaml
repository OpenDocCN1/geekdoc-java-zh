  mdcn: '


    当食欲被呈现为一个无法破解的谜题时，它对女性来说仅仅是一种理想的特质吗？


    当然，这些问题过于简单了，但《胖女人们》（Two Fat Ladies）等节目的持久不衰支持了这些观点。迪森·莱特（Dickson Wright）和帕特森（Paterson）在系列首次播出时非常受欢迎，二十多年后依然具有很高的知名度和收视率。厨师兼作家瑞秋·雷（Rachael
    Ray）告诉我，当我与她交流时，她在观众中的人气可能不如盖伊·菲里（Guy Fieri），因为她的菜肴存在文化挪用的历史，往往为了“简化”美国白观众而走捷径”。Lakshmi的《Taste
    the Nation》被选中第二季，而萨敏·诺斯拉特（Samin Nosrat）无疑是如今北美最受爱的美食作家和电视节目。


    不存在通用的观众，也没有对食欲的通用见证者。只有人们在制作自己喜欢的食物并与我们分享。此外还有一种“过滤器”——文化反映它所想象的我们欲望的方式。


    当我们的观看选择通过 YouTube、TikTok 和 Instagram 等平台变得更加民主化时，情况发生了变化。（尽管算法仍然优先考虑白人创作者。）


    这些平台的创作生态在许多方面比电视上看到的内容更加多样：更多有色人女性、更多跨性别厨师、更多对食物的非标签化且具有创新的方法。（食物频道的《先驱妇女》（Pioneer
    Woman）已进入其第十一季，是该频道非竞争性节目的精髓，它充满了像一片干面包般的冲击力和创造力。）我个人的偏好也倾向于少把肉类作为每盘菜的中心。


    一些例子：在 Instagram 上，@BlackForager 的艾莉克西·尼科尔（Alexis Nicole）采集、烹饪并食用她周围任何可食的东西：使用紫丁花上的野生酵母酿制的紫丁花糖；蔬菜培根包裹的玉簪笋；加入柠檬水后会变成粉色的葡萄风子提取物。


    波波·奥图尔（Poppy O’Toole，@PoppyCooks）是一位受过米林培训的厨师，她在厨房工作中痴迷地烹饪豆子，包括一种十五小时压制煎炸土豆的变体。她的烹饪视频风格是一部分食物准备的
    ASMR 和另一部分旁白，通常以清脆的响声和“哦”的声音结尾。


    Richard Makin（@SchoolNightVegan）为���鱼酱等原料提供了创新的素食替代方案，侧重于技巧；Bettina Lakhal（@crispyegg420）制作含有鸡蛋、美味蘑菇和酥脆豆腐的美味人人碗；Afia
    Amoako（@EatWithAfia）烹饪加纳美食的素食版本，如西瓜汤和朱洛夫饭，同时分享关于小米和高粱等原料的文化、生态和历史信息；Ben Siman
    Tov（@BenGingi）烘焙面包并说：“YASSSI！”


    这些厨师中有些人会在视频循环结束时品尝他们的食物；有些人会在第一口之后继续播放视频，仿佛你正与他们同桌进餐；还有人会执行饭前的仪式，如折断饼干，或用叉子划过鸡蛋直到它像小雪崩一样流出来——这在
    TikTok 或 Instagram 上比在电视上可能，因为这些平台让我们感到离创作者本人更近，因此这些瞬间成为了我们破碎、折断、拉扯和戳的视角代入。


    因为吃饭的行为必然比烹饪的行为简单，所以烹饪视频中吃饭和品尝的陈词变得更加明显。品尝的剧场反复进行，即使在自己的频道上，也可能开始复制相对有限的选项。一个人可以发出多少次清脆声或“哦”？谁又不想在镜头前尝试一口更优雅、更充实或更值得注意的食物，向世界展示他们的牙齿呢？


    但事实也是，你在 Instagram 上发现的内容往往比美食电视节目上的大部分内容感觉更真实——无论是在品尝还是烹饪上如此。有些厨师会避开整个过程，像 Sohla
    El-Waylly 经常做的那样，让观众在看到食物和梦想品尝它之间进行想象的飞跃。


    当你和朋友或家人一起吃饭时，你通常会看他们吃吗？我不会。我通常会礼貌地关注别处，只有在他们吞咽并在两口之间说话时才进行眼神交流。我在镜头前看尼格拉拉·劳森（Nigella
    Lawson）、盖伊·菲里（Guy Fieri）和杰米·奥利弗（Jamie Oliver）吃饭的次数，可能比我亲眼看到我每天三次、每周二十一次的伴侣吃饭还要多。


    从定义上说，吃饭是非常正常的事情。但为了他人表演吃饭的行为就不那么正常了。


    所以，大口吃字的奇观将永远是一场奇观，永远是一场戏。它提供了一个视角来观察文化趋势、趋势以及美食媒体如何能够从文化束缚中释放欲望和食欲——更多的人毫无保留地成为他们想要成为的样子，一次又一口。


    在更具民主性的领域，它有力量将欲望和食欲从文化束缚中解放——更多的人毫无保留地成为他们想要成为的样子，一次又一口。


    **** 许多肤色人，以及大量的白人和非二性别者，在餐饮行业工作；事实是，种族主义、性别歧视和其他障碍导致这些群体在行业中声望更高、薪水更高的领域代表性不足。大多数餐厅的高层职位由白人占据，且这些职位中很大比例由白男性持有。见：Restaurant
    Opportunities Centers United，《Ending Jim Crow in America''s Restaurants: Racial
    and Gender Occupational Segregation in the Restaurant Industry》， 2015，https://laborcenter.berkeley.edu/pdf/2015/racial-gender-occupational-segregation.pdf。


    在我甚至考虑制作之前，我就从二手店买了一个水晶盘。几周后，我发现它有一个金属边。


    ## Cunliffe 家族布丁（100多年历史）


    ### 简化版


    - **第 1 天**：将磅蛋糕、瑞士卷或任何海绵蛋糕放在大盘底部。（可以是陈期的。）大量地洒上雪莉和白兰地。

    - **第 2 天**：打开一罐水果——桃子、柑橘等——并放在蛋糕基底上。制作任何口味的果冻，用果汁代替配方中要求的一杯冷水。搅拌均匀，倒在蛋糕和水果上，盖好放入冰箱冷藏。

    - **第 3 天**：小心地将一罐卡仕酱倒在上面并抹平。盖好放入冰箱。


