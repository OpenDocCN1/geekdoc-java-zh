    A 2019 essay by Alison Herman for The Ringer goes into what makes the New York
    Times’ Cooking comment section so good, when so many other recipe comment sections
    are so terrible. The essay opens with Daniel Lavery lampooning terrible comment
    sections: “I didn’t have any eggs, so I replaced them with a banana-chia-flaxseed
    pulse. It turned out terrible; this recipe is terrible.” The wrong kind of substitution.


    But, Herman continues, NYT Cooking’s comments—or “notes,” as editor Sam Sifton
    calls them—are different. “Cooking’s are genuinely additive, have a ready-made
    takeaway, and best of all, inspire downright bonhomie toward my fellow man,” Herman
    writes.


    Cooking’s notes, unlike many others, offer hints, explication, tips, and good
    substitutions. Herman’s interviewees go so far into the weeds that the essay briefly
    turns to what a recipe even is. (“Everything is a derivative of something else,”
    Sifton says.) They’re moderated; notes that don’t contribute much of value are
    rejected, never seeing the oven light of day.


    Freed from the stricture of the page, loosed into the freeform conversational
    style of the podcast, Nosrat’s Home Cooking recipes are similar. They become a
    verbal diagram for how to interpret the idea of a meal that will end up looking
    a bit different for everyone. She offers the reasoning behind certain treatments
    of food—that will help the dish become crunchy or properly seasoned or melt-in-your-mouth—but
    the approach also places a lot of trust in her listeners.


    This same approach features Nosrat’s foundational book *Salt, Fat, Acid, Heat*,
    which she began writing about a year internning at Chez Panisse. “Salt, fat, acid,
    and heat were the four elements that guided basic decision making in every single
    dish, no matter what,” she writes in the introduction. This is the structure through
    which Nosrat understands cooking and disseminates her knowledge about it, and
    it pervades the book as she explains why and how she does what she does.


    Nosrat’s epiphany occurs after she’s been cooking and learning at Chez Panisse
    for a while, and she begins to recognize patterns in the treatment of cuts of
    meat and delicate fish fillets and deep-fried foods and seasoning as the restaurant’s
    menu changes daily. Theory and praxis.


    What’s more complicated is creating the space and opportunity to learn—Chez Panisse,
    I’m guessing, has limited internship spots. Food security programs that feed kids
    and bring cooks and farmers into classes can help, and they’re experiencing revivals
    in some areas of the country. Practice, including alongside friends or family
    members, and access to recipes like Nosrat’s slide into technical territory can
    also help home cooks improve their improvisational skills. (Alton Brown’s recipes
    and TV shows, the Bon Appetit Test Kitchen, and Serious Eats are more resources
    that explain the why and how of ingredients—making it possible to better understand
    how to substitute them and when not to.) These are the kinds of recipes I consult
    to learn how to make and improve upon everything from pate à choux to pastry cream
    to onion rings. Because the more we’re able to learn about the underlying science
    and theories of cooking and baking, the more we’re able to adapt any given recipe
    based on what we have in our gardens and pantries. To make good substitutions
    instead of terrible ones.


    “Fancy is overrated,” Nosrat says near the end of *Home Cooking*’s first episode
    to guest Josh Malina, who has just gone into some detail describing his latke
    recipe and then much less detail describing some Instant Pot black beans mixed
    with a tomato-cilantro slurry, before adding the caveat that he’s more of a hearty
    staples type of cook than a fancy type of cook.


    What isn’t overrated is using what you have to make satisfying food and sharing
    it with others. What isn''t overrated is understanding what will ring the bells
    of your cravings, or how to adapt a food you love for a friend with allergies,
    or who’s vegan, and coming over for dinner.


    When a meal or an ingredient is unfamiliar, a recipe offers a way into something
    new. As it becomes more familiar, it becomes possible to see its structure and
    what you may swap out for something else. It’s this part that is the beating heart
    of any recipe worth its salt. And it’s this familiarity, and understanding, I’ve
    been working towards my entire cooking life.


    There’s nothing wrong with enjoying what’s fancy. But it’s also free to dispense
    with fancy in favour of what’s personally satisfying, what’s available, what’s
    right for you—treat cooking and baking like a lifelong pursuit of alchemy, with
    the goal of making the sum ever better than its parts.


    ## Kale pesto: An ode to substitution


    Traditional pesto, or pesto alla Genovese, is made from basil, garlic, pine nuts,
    Parmigiano-Reggiano, olive oil and salt, ideally in a mortar and pestle. (“Pesto”
    and “pesto” share the same word origins.)


    Before I had a garden, I didn''t quite understand why anyone would eat anything
    other than the classic—basil is one of the world’s best flavours. After I had
    a garden, I realized it: kale has an unbelievably long growing window, and as
    long as your soil is half-decent, it basically grows itself. It’s available at
    times of the year in Canada where almost nothing survives outdoors.


    This pesto is a highly substitutable recipe. A looser definition of pesto also
    allows you to use up an overabundance of chard, garlic scrapes, carrot tops, lovage,
    or even softer greens like spinach and mizuna. If you don’t have a garden, you
    can even forage stinging nettles, which emerge in the spring. For stinging nettles,
    wear gloves and remove the leaves.


    ### Ingredients


    - 1 large bunch greens: kale, chard, stinging nettles, carrot tops, spinach or
    mizuna

    - 1/2 cup raw nuts: walnuts, pepitas, or pistachios

    - ½ cup olive oil

    - 2 cloves garlic

    - fistful of grated Parmigiano-Reggiano

    - pinch of salt

    - squeeze of lemon (optional)


    1. Toast the nuts in a dry pan, just until you can smell their toasty aroma. Take
    off the heat and set aside.

    2. Wash and dry the greens thoroughly and prepare them. For stinging nettles,
    cook them briefly in boiling water.

    3. Add the toasted nuts, garlic, and Parmigiano-Reggiano to a food processor;
    pulse until the nuts and garlic are fairly chopped.

    4. Add the greens. With the food processor running on low, drizzle the olive oil
    until you have a relatively smooth. It''s okay if it''s a little chunky, and the
    greens have a bit of texture.

    5. Add pepper and salt to taste.

    6. Add a squeeze of lemon to brighten the flavour and counteract any bitterness.


    ## the garden will bloom again


    The first seed to break the surface of the soil in 2021 was celery. Next came
    bergamot and lemongrass, and then, more slowly, the leeks. Their greens were tiny
    pinpricks against the deep brown and perlite white of the soil; under the bright
    grow light in my kitchen, they began to unfurl, stretch upward.


    We live on a quarter acre with a view of the Pacific Ocean, in a microclimate
    that is a little warmer than that of the surrounding area, warm enough that tomatoes
    grow vigorously outdoors. But not warm enough for peppers or eggplant. The backyard
    is set up in beds separated by wood-chip paths, with a few six-inch-high raised
    beds and one foot-high raised bed. Will and I share the beds. About a third are
    nursery beds for the trees and shrubs she propagates, and two-thirds are for vegetables.
    We build'
