    # 求赐我们每日的日用豆子


    在我小时候的周六早晨，我母亲通常在上班，我父亲则负责确保我们衣穿整、吃饱、洗干净。如果你遇到我那开朗好客的父亲，他可能会告诉你他非常擅长炒菜，或者也许他每天都喝一杯奶昔。我怀疑他在夸大事实；上次我住在他公寓时，我好奇地发现搅拌机上有一层灰，又“好奇入入”地搜遍了他的储藏室，结果找到了一包二十年前就过期的肉汁调粉。


    当他带我和我哥哥去“看火车”（完全正如其字面意思）时，他会买麦当劳，然后让我们在桥附近的植物园里自由玩耍，那里他最喜欢看火车轰鸣着驶过，这样他就能在一本小笔记本上记录下它们的运行编号。


    在有英超联赛曼联队足球赛的日子里，早餐通常是豆子配烤吐司（beans on toast）。最常见的是亨氏原味番茄酱豆子，有的加猪肉，有的不加，有时还是那种加糖浆的。更常见的替代品是超市品牌的番茄酱烘烤豆，价格便宜得多。我记得在
    90 年代后期和 21 世纪初，在 No Frills 超市，这些豆子只要 49 分钱。（当我写这段文字时是 2023 年 1 月底，它们卖到了 1.19
    美元。）


    我爸爸喜欢在豆子里加伍斯特斯特酱和其他调料。我喜欢它们罐头里装出来的味道。我哥哥完全不喜欢，通常选择吃麦片。我爸爸会用一个长方形塑料保鲜盒在微波炉里加热两罐豆子，同时烤六片面包。


    他吃一罐半配四片面包；我吃两片配半罐豆。我不喜欢黄油，我们家里用的就是黄油，所以我把豆子放在原味的烤吐司上，让豆子酱浸泡直到面包被酱汁浸软。今天，我的家里有盐黄油；更棒的是，豆子酱和黄油混合在一起，味道变得更浓郁。


    在我那些年轻、贫穷、没机会为家人做饭的日子里，我每周会吃一次到四次豆子配吐司，配上一些胡萝卜条。我今天仍然吃它们——放在吐司上，或者加入到我开发的非常简易的素食羊肉派中（食谱见第125页）。


    它们富含纤维和蛋白，是一种廉价、方便的餐食；如果被要求在像《顶级厨厨》这样的电视节目中制作我的“慰藉美食”，在想出真正端给评委的菜之前，我首先想到的是烘烤豆。（我能给评委上豆子吗？我可以做一个非常有说服力的自制仿品，但比这些挑战通常给出的二十分钟要花好几个小时。）我可能是我家里最后一个经常吃这种豆子的人；Will
    和 Sinclair 不喜欢，我哥哥从来不喜欢。


    我这辈子一直认为它们的存在是理所当然的。只有在考虑到它们在家族中的“消亡”时，我才对它们的历史以及它们如何成为我们的文化支柱感到好奇。


    烘烤豆子如何在英国成为标志性食物，就像其他的标志性物品（茶！酸豆酱！），这个故事始于别处。它们的原料是菜豆——一种较小的白豆，是菜豆属（Phaseolus
    vulgaris）的一个品种，该属包括其他常见豆类如斑豆、绿豆、黑豆和肾豆，但不包括大豆（Glycine max）或红腰豆（Phaseolus coccineus）。菜豆原产于目前已知的美洲，在五个世纪前就被驯化；在殖民者踏足这里之前，这种豆已经演化出许多品种，并在许多文化中传统与玉米、南瓜一同种植。欧洲人很早就拥有蚕豆、鹰嘴豆和扁豆，但直到
    16 世纪才获得普通菜豆。


    今天，英国人吃亨氏烘烤豆比地球上任何地方都要多。但这道菜可能源于类似的原住民菜肴，它们很可能是用枫糖和鹿肉制成的，有时会被饥饿的定民者采纳，随后被亨利·约翰·亨斯（Henry
    John Heinz）和 H.J. Heinz 公司工业化生产所吸收，该公司于 1895 年在匹兹堡开始生产有染色的豆子。


    亨斯在十年前去过一趟英国，于 1886 年致电伦敦 Fortnum & Mason 超市的食品部门主管。这家杂货商开始经营亨氏的产品，如瓶装辣根酱。根据一个来源，罐装豆子于
    1899 年进入英国，另一个来源说是 1901 年，最初是作为奢侈进口物品。1928 年，公司开始在伦敦西北部的哈尔斯登（Harlesden）生产有染色的豆子；价格下降了，产品也流行了起来。


    目前还不清楚从美国出口的新英格兰风格豆子具体何时改变了配方——但豆子最终被调整以适应英国人的口味，去掉了糖浆、枫糖和红糖，改用番茄为底的酱汁。


    1941 年到 1948 年间，英国通过积分制度配给罐装豆。优惠券定量涵盖了牛奶、鸡蛋、黄油、培根和火腿等主食。积分配给更为灵活：每个人都会收到积分。


