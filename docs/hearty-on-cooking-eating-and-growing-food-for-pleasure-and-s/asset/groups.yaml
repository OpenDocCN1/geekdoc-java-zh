    # twenty-four batches of ice cream


    About two years ago, my friends Ben and Michael mailed me a chest-warming gift.
    I''d just had surgery to radically reduce the size of my chest, so that I could
    feel more at home in my non-binary body. The ice cream maker was the perfect gift,
    in the vein of teaching a man to fish: I could celebrate over and over again,
    testing out as many different kinds of ice cream as I wanted to. Ben and Michael
    own their own ice cream maker, and the gift reminded me of all the time I spent
    in their apartment, hanging out, sleeping over their pull-out couch, taste-testing.


    The first ice cream I churned, just a few weeks after my surgery in late January
    2021, was Nutella flavoured—one of the sixteen flavours suggested as a “jumping-off
    point” by the *New York Times*''s Master Ice Cream Recipe, published in summer
    2014 and developed by Melissa Clark. I toasted some hazelnuts we had in the cupboard
    for the garnish, and started a spreadsheet to track the flavours I was testing,
    documenting flavour, date made, recipe source, and notes. “Yum,” I wrote about
    the Nutella ice cream, and nothing further.


    Next, I made a mediocre vegan chocolate ice cream using coconut milk. Notes: “Should
    be fuller fat.” Then another deviation from a standard custard base: a *Serious
    Eats* recipe by Max Falkowitz for strawberry ice cream, called “The Best Strawberry
    Ice Cream,” that calls for keeping the strawberries fresh and macerating them
    in alcohol to preserve their bright spring flavour, uses half and half instead
    of heavy cream, and relies on the corn syrup to achieve a smooth texture free
    of ice crystals. This batch'
- md: '

    of ice cream, made using wild strawberries from our backyard, won the opinion
    of the household. “Very good,” I wrote in my notes.


    In the early summer, Will’s goumi berry tree produced. Overconfident, I soaked
    pitted goumi berries in crème de cassis and sugar overnight, drained them, and
    mixed them, in a glass Tupperware, with a yuzu and lemon-flavoured ice cream base
    I’d made with yuzu zest from the freezer and a lemon from the grocery store. If
    you google goumi berries, you’ll discover the tree from which they grow is a nitrogen
    fixer; you’ll see the berries described as “tart” and “edible.” You can read between
    the lines and guess what happened next. The yuzu-lemon base was impeccable—gentle
    and sweet; the goumi berries, rather than adding little hits of interest, were
    so astringent they stripped our tongues and inner cheeks of moisture upon.


    A couple of days after I made the ice cream, as I was trying to decide what I
    could do with it—if we’d get used to the very peculiar experience of the goumi
    berries, or if I scoop them individually out of the ice cream in order to salvage
    it—I went to the freezer to pull out frozen corn while making dinner and caught
    the edge of the glass Tupperware housing the yuzu-lemon-goumi ice cream. It fell
    and smashed on the floor, which freed us from goumi purgatory but felt like a
    very big waste of heavy cream, eggs, yuzu zest, and expensive glass Tupperware.


    Still, I wasn’t too bothered, the ice cream maker was working as intended, as
    a tool for experimentation, joy, celebration. A way to satisfy our cravings and
    use harvests from our garden.


    That summer, I got a call from my brother. He asked me where I was, if I was sitting
    down, if I was at home, or in public—the universal preamble for bad news. Our
    dad was having a heart attack, he said, and he’d just followed his ambulance to
    the hospital. COVID rules were in place and my brother wasn’t allowed into the
    ER. He was calling from the hospital parking lot. Though I was 4,500 kilometres
    away, it felt like we were in the same boat. All we could do was wait and hope.


    Eventually, my dad had an emergency angioplasty and received a stent. While in
    the hospital, he was also told he had diabetes. We came home—or, rather, went
    to my aunt and uncle’s convalescence—with a maraca set of new medication and a
    very restrictive diet.


    One of the first things I thought after I knew my dad was safe was the spreadsheet
    for my ice creams. And then I thought of my biological grandfather, Alan. We’d
    been estranged from him for years; he hadn’t been around much for his family even
    when he’d been around on paper. We’d heard through the Ontario Hydro grapevine
    (he worked there, my aunt and uncle worked, my brother works there) that he’d
    had a quadruple bypass sometime in the 2000s. Later, we heard he’d eventually
    died. Heart failure, we guessed. (“Ironic,” someone said).


    Alan had fucked off, but in some ways we were all stuck with him. Had his last
    name, his tendency towards high blood pressure, high cholesterol, heart issues.
    As I worried about my dad, I wondered if I should abandon my ice cream making
    project. (Was it a project? The spreadsheet made it feel like a project.) Drafting
    the proposal to this book, I’d initially been thinking of this essay as “One Hundred
    Batches of Ice Cream.” Upon reflection, maybe a hundred was an unwise goal.


    There is a basic method for making homemade ice cream bases: combine cream, milk,
    sugar, and flavourings in a heavy-bottomed pot. Whisk these ingredients together
    while bringing them to a simmer over medium heat. Meanwhile, crack some eggs,
    separating the yolks from the whites. Save the whites for a later purpose (like
    Swiss meringue buttercream or macarons or amaretti), and place the yolks in a
    medium-sized bowl. When the cream mixture begins to steam, take it off the heat,
    and slowly mix a third of it, half of it, or all if you want to, into the yolks,
    whisking constantly. Once the warm cream mixture has been successfully integrated
    into the yolks, pour the whole thing back into the pot, continuing to whisk as
    if your wrists do not suffer from repetitive stress injuries. Place the pot back
    on medium-low heat, and stir gently but consistently for five or six minutes.
    Over the course of this five or six minutes, the custard will reach a temperature
    of 170 degrees Fahrenheit and begin, almost imperceptibly, to thicken. When it''s
    done, it''ll be able to coat the back of a spoon. Now it''s time to strain, bring
    to room temp, and chill. You can churn the ice cream once it''s thoroughly refrigerated.


    Each ice cream is slightly different. If you''re making Kahlua-coffee, the flavours
    go in with the cream and milk. If you''re making Nutella, you whisk it into the
    warm custard after you''ve incorporated the egg yolks, thickened and strained.


    But most ice cream involves the stovetop—the alchemy of milk and cream and sugar
    and egg yolks turning into much more than the sum of their parts. I love eating
    ice cream, but maybe even more than eating it, I love to watch it come together
    on the stove, getting hot in service of it, later, getting as cold as possible.


    I am estranged from my mother and her family, as my dad was estranged from his
    father before him. I''m not necessarily great at keeping in touch with the people
    I want to with. Sometimes, when I think about the course of life, I think about
    how it involves an increasing series of losses and fractures. And it sounds ridiculous,
    but making custard offers a small opportunity to watch things coalesce, rather
    than fall apart. The threat of failure—the eggs scrambling, the custard breaking
    under too high a heat—is not so great as to provide frustration, but present enough
    each success actually feels like a success. An edible, quick-turnaround success.
    Not one I wanted to give up.


    After the “Best Strawberry Ice Cream” and the heart attack, I made a full-fat
    vegan chocolate coconut ice cream with gluten-free Oreos crushed and added in
    the last minute of churning. This was an improvement on the previous batch. Then
    Sinclair requested a peach and almond ice cream cake for his late-fall birthday.
    I sandwiched layers of almond cream around ice cream made from tinned peaches
    (the best bet, out of season), iced the cake with whipped cream, and covered the
    top in rainbow sprinkles.


    Next, a Kahlua-coffee ice cream I used in a tiramisu baked Alaska, meant to mirror
    Richard’s tiramisu baked Alaska from series five, episode four of The Great British
    Bake Off—somewhat infamously, the episode in which Iain’s Alaska melts, and he
    bins it and presents the bin to the judges. (Notes: “SO GOOD.”)


    My slowly got better and looked more like himself. His favourite fish and chips
    shop, he’d previously visited every Friday, closed during this period; he was
    well enough that we could joke that his lack of patronage had single-handedly
    put it out of business.


    For Will’s birthday, I made a watermelon—pistachio ice cream for the green layer
    of the rind, store-bought coconut for the white layer, and raspberry ice cream
    studded with shards of gluten-free Oreo wafer for the juicy red fruit and pips.
    I placed a thin circular vanilla sponge on top of the bowl holding the ice cream,
    and then inverted it and removed a wedge, which looked pleasingly like a cartoon
    watermelon slice.


    And then mango coconut ice cream to use some leftover mango purée: scant two cups
    of purée, a can of coconut milk, some maple syrup, and some salt. A coffee base
    with mix-ins: Junior Mints, Reese’s cups, Aero bits, Caramil bits. (Notes: “Like
    having gotten stony in the Ben & Jerry’s test kitchen.)


    In-May, and in early June, for ice cream sandwiches, because it was popular, mint
    ice cream with David Lebovitz’ recipe for fudge ripple.

    '
