    and by people making living wages or receiving enough social or disability income
    to have the time and mental space to lessen food waste.


    These incremental steps would help us make the shift to more sustainable agriculture.
    Supporting unionized labour at home and abroad, as De Loera-Brust suggests, would
    have immediate material benefits for farm workers—and potential secondary benefits,
    if farms are forced, via government legislation, to retool their approaches to
    chemical use to protect labourers. And supporting local agriculture would help
    us build local food systems—in the way that Coastal Cookery and Nourish do, and
    by buying directly from farmers and through programs like CSA boxes. Nothing would
    change overnight, but it would change eventually.


    Back at Coastal Cookery, I tuck into my salad, which is composed of slightly bitter
    crunchy greens, refreshingly tart pickled golden beets, lightly candied walnuts,
    crispy bacon, and then slices of apple and red onion, all dressed in a simple
    vinaigrette.


    The salad is good, and I''m grateful for it and all the labour that went into
    it. It can be easy, I think, to feel a sense of alienation from this labour when
    purchasing produce from a restaurant or grocery store, when there are more, and
    longer, links in the supply chain. I feel like I helped the salad mix is more
    special because of the relationships and connections I have to it. Though the
    trip is longer for the Californian lettuce, it''s still a trip from farm to table.
    The greens are still growing in soil, watered by rain and rivers and aquifers,
    powered by the warmth of the sun, picked by skilled labourers, just like my friends
    here, who deserve good working conditions and living wages. I think that part
    of the mystery of multinational corporations, their focus on perfect produce available
    consistently, is designed to obfuscate the particular origins of that produce
    as a material good that has been grown and harvested and packed and shipped by
    workers we would otherwise be in solidarity with.


    And part of our responsibility as people nourishing ourselves is to recognize
    this labour, familiarize ourselves with it if it''s not part of our everyday life,
    and contribute to meaningful structural change in whatever ways we can, both locally
    and through solidarity with the people growing, harvesting, and processing our
    food in places we''re connected to primarily through vast complex supply chains.
    The system we have in place now is unsustainable, a miracle and a mess. But reforming
    it can be empowering, can build community, can help us feel like we are participating,
    rather than extracting; participating, rather than being extracted from. Feeding
    ourselves while building and sustaining so much more than just ourselves.


    ## Tomato Chutney, Part I: Reviving My Nana’s Recipe


    A few Septembers ago, I harvested two green bell peppers and a bunch of celery—
    twisting at the base so that its leftover roots could feed the soil. Roma tomatoes
    and Gala apples I’d previously picked from my garden, and red peppers and onions
    from the grocery store, and I made my nana’s tomato chutney for the first time,
    ever, by myself.


    My nana was then in her nineties and living in a retirement home in small-town
    Ontario, having recently sold the well-kept split-level house in Burlington where
    my brother and I spent our summers with her and my granddad. My childhood home
    was chaotic; my parents fought, my mother drank, ours built-popcorn-flavoured
    rice cakes, I was plump and my mother helped me diet, starting at the age of eight.
    (In the ''90s, this meant caramel-flavoured rice cakes, apple-cinnamon-flavoured
    rice cakes.) My internal goal for each day was to eat eight hundred calories or
    less. I rarely felt at ease.


    At my grandparents’ house, my granddad gardened and made compost. His garden stretched
    over the bottom of the backyard, with his compost bin in the corner. He showed
    my brother and me how to rewire a lamp. We did the crossword together. He taught
    me all the math he’d learned at the night classes after immigrating to Canada.
    He wrote stories about his time in the war and as a young electrician first on
    a typewriter and then on a computer in the basement. My nana taught us how to
    play a card game called clock solitaire, gave us old hardcover Nancy Drew to read
    in the sunroom, and turned the produce my granddad harvested into lunch and dinner
    and preserves.


    My grandparents’ calm, unwavering attention made me feel secure and loved—and
    my nana’s attention often crystallized in the form of eight-ounce jars of chutney,
    made and set aside especially for me. My favourite way to eat it was cheese-and-chutney
    sandwiches, cut on a diagonal, the sweet, tart, slightly crunchy red chutney contrasting
    with crumbly, pungent cheddar.


    When I was entering my mid-twenties, the prostate cancer my granddad had lived
    with since I was a child finally spread. I’d moved out of my parents’ house by
    then and was living about forty-five kilometres north of my grandparents. My mother
    and stepfather gave me one of their old cars, a lozenge-shaped blue Taurus, and
    I drove from Guelph to Burlington once a week to stay over with my grandparents,
    leaving early in the morning to get back to my new communications job.


    When I was twenty-six, after my granddad had died and I moved across the country
    to go back to school, my mother disowned me. She’d stumbled across an essay I’d
    written about our strained relationship, one I hadn’t meant for her to see.


    My relationships with the rest of my maternal family also became more tense, more
    sad. It was supposed to stay a secret, what I had written about. I was supposed
    to feel gutted when she disowned me. I was supposed to apologize.


    At thirty-three, when I gave birth to Sinclair, my nana didn’t answer my calls.
    I found out she didn’t want to meet Sinclair unless I rekindled a relationship
    with my mother, whom I hadn’t spoken to for years. Maybe it felt would be a betrayal
    to meet my child if my mother most likely never—but the silence felt like a betrayal
    to me. My own belonging to the family was conditional and not as primary as my
    mother’s.


    Like I would need to fend for myself again, the way I had as a child, fearing
    my mother’s alcoholism and anger and her desire, above all, to keep up appearances.
    But this time without the respite of my grandparents’ love and steady care.


    My nana’s chutney recipe calls for twenty-four ripe tomatoes, six apples, one
    bunch of celery, three medium onions, two green peppers, two red peppers, sugar,
    vinegar, salt, mustard seeds, cloves, and ginger. I skin the tomatoes after dumping
    them into boiling water, and chop everything into a fine dice. I place the tomatoes,
    onion, and celery in a col overnight to drain any excess water. The next day,
    when everything is in the pot and begins to warm, the house fills with the chutney’s
    smell, a smell that I haven''t experienced in years. A smell I can now identify
    as the result of the recipe’s unique combination of green pepper, tomatoes, and
    cloves.


    The recipe I have is in my nana’s hand. She wrote a letter to go alongside it,
    sent several years before the maternal side of my family stopped talking to me.
    When I wrote the first draft of this essay, I couldn’t even remember where I was
    living when she sent it. Now, the memory returned: I was living in a Guelph neighbourhood
    called the Ward with two bunnies Acorn and Bigwig. I called her when the recipe
    arrived in the mail. We talked I was doing the dishes, and I almost dropped my
    phone in the sink.


    The recipe bears my name: “Andrea’s favourite tomato chutney.”

    After the chutney has cooled, I spoon some onto a piece of cheddar. It is the
    taste of being in my grandparents’ kitchen at lunchtime. It is the clock ticking,
    the radio turned down still broadcasting the news. It is the precise feeling of
    being safe and loved. Sinclair tries it with cheese and crackers; she likes it,
    and I feel grateful to be able to share something of my nana with her.


    Once, when I was nine, we visited my grandparents for Christmas in Florida. I
    remember getting into the car to go home and not being able to say goodbye because
    I was crying and didn’t want to leave. That temporary parting contained the kernel
    of the larger parting that, even as a child, I understood was to come. I began
    to hoard time with them. My grand died when he was eighty-seven; I cried for two
    weeks straight and then didn’t cry again for nearly two years, as if the loss
    had evaporated a reservoir. But I felt my nana would live into the nineties, that
    she’d be alongside me when I was thirty-five, maybe even forty. I guessed I could
    lose her earlier, in another way.


    As the distance between us grew, I crafted her chutney more fiercely. I’d moved
    across the country three times since she’d sent me the recipe, and I thought I’d
    lose it. I couldn’t exactly call her and ask her to send another copy. Before
    I found the recipe folded into the pages of an old book—looking for something
    entirely different I’d also misplaced—I thought I’d never taste it again.


    Having made it again, I miss my nana fiercely too. I wish I could call her and
    tell her that I did not have all the right tools, so when I introduced my mason
    jars to the canning bath, it created a geyser of boiling water. But also that
    my chutney was a success: it tasted just like hers. That grew much of the produce
    I used to make it, as my granddad had for her. That I love her, and that I am
    sorry, but I’m not sorry enough to accept my mother’s abuse as a condition of
    belonging to the family. That was her early love, in fact, that helped me make
    a strong enough person to say no.

