    # vegan lemon macawrongs


    On a grey day in mid-February 2022, after the first peak of Omicron has passed,
    my friends Nola and Megan come over over to attempt vegan lemon macarons. (That
    is, the fancy little sandwich cookies generally made with almond flour, icing
    sugar, and egg whites, not the desiccated coconut mounds.)


    Sinclair has been wearing underwear on her head as a hat all day, and outside
    we''re having a weeping tile installed underneath the perimeter of our house—every
    time it rains, water and mud seep into our basement, trailing miniature rivers
    along the concrete pad that separates the rest of the house from the dirt underneath
    and around us.


    Nola is vegan and, like me, can''t eat gluten. She''s never tried a macaron before—a
    fact I find buoyant, because if ours end up mediocre she will never know. Nola
    and Megan bearing gorgeous bright-yellow lemons plucked from the tree growing
    in Nola''s greenhouse.


    My desire to perfect vegan macarons is one part social, one part food-driven,
    and one part emery. Socially, the pandemic has left me lonely, and the idea of
    having two friends hanging out in my kitchen to bake nearly brings me to tears.
    Food-wise, I want to provide Nola with a delectable morsel. And being emery: one
    of my favourite-ever food essays is is by Jeffrey Steingarten, and it''s about
    his quest to make a perfect bourdin noir after he eats one “at a dinner party
    just outside Paris,” one so good he “quickly added it to [his] list of the hundred
    greatest foods of the world, tearfully removing the frozen Milky Way bar from
    [his] pantheon.” Steingarten and I'
  - '[PAGE 78]


    share a picky, snobby aesthete’s love of food that is great, food that feels like
    a revelation, food that lodges itself in one’s yearnings for life. (We also share
    a similar opinion about frozen Milky Ways—well, for me, Mars bars.) But my goal
    is to go on a vegetarian quest for perfection. I would like to see Nola’s beautiful
    lemons turn into a delicately crunchy, beautifully chewy macaron, one that she
    can eat.


    We''re using a recipe from the blog Pies and Tacos, which specializes in macarons
    and cupcakes, seems to have done the most moist recipe of any of the bakers I
    can find online who have made vegan macarons. The blog, Camila Hurst writes that
    she, like me, took baking in part as a cure for depression—to find a hobby that
    would infuse her life with purpose and joy.


    This recipe calls for aquafaba in place of the egg whites that would normally
    be used for the meringue that is folded with almond flour and icing sugar to make
    macaron shells. Aquafaba, as of those who are vegan, vegan-adjacent, or allergic
    to eggs might know, is the liquid that surrounds canned chickpeas. The term was
    coined in 2015 by an American software engineer named Goose Wohlt, but the first
    known use of bean slime as an egg substitute came in December 2014, by Joël Roessel,
    a vegan opera tenor who wanted to eat î flottant, asked himself, according to
    the Washington Post, “What would disgust me as a raw egg white?”


    Unlike Nola, I have made and eaten many macarons. I''ve eaten them in Paris. I''ve
    eaten them in Montreal and Vancouver and New York. I''ve eaten them fresh in my
    kitchen, deciding that I have spoiled myself for most commercial versions and
    can no longer purchase them from bakeries that only do them decently instead really
    well. (Many bakeries use the Italian technique to make the meringue, which produces
    a more stable drier cookie; many also seem not to use fresh flavoured almond flour.
    As a'
