    colonized by thousands of aphids. The plant was also alive with ants, which had
    most likely installed the aphids on the pods in order to farm the liquid they
    secrete, which is called honeydew and which ants love. The result was that the
    kale plant looked almost like coral. To me, it felt like I''d accidentally chosen
    the wrong movie on Netflix and found myself in medias res in some kind of body
    horror. I realized the aphids were everywhere; I even discovered them on Macker''s
    cat grass.


    I''d already begun to reflect on the amount of death I''d met out in order to
    see my fruit and vegetable plants through to harvest, and I had decided that gardening
    and farming, even when done organically with nothing approaching terminator seeds,
    pesticides, or herbicides, was not simply a life-giving act, an uncomplicated
    idyll. This I found almost funny; our garden, which we''d designed to feel like
    a bit of an oasis and which'
  - '[PAGE 217]


    was one for many species of birds and pollinators, was the place where I was a
    backyard grim reaper.


    I used the hose nozzle to send a hard spray of water to wash the aphids off the
    kale pods and then used my bare hands to crush the small bodies of the survivors,
    which so angered the ants—of crush it did!—they began to swarm towards my fingers
    and palms and wrists and forearms to bite me.


    For days and weeks, I fought off the ants and aphids, and they fought me. The
    kale plant would be temporarily clear and then begin to look like a terribly creepy
    land coral again. I am sure my neighbours must have seen me stalk outside in rubber
    boots and boxers, cursing at insects and the sky.


    In the end, I had to abandon parts of the plant. But the goal was to save seeds.
    And I did. I saved hundreds—enough to grow as many kale plants I wanted for years,
    and to share with anyone who wanted curly kale. Abundance!


    In year two of the garden, my carrots germinated, but when I picked them, I found
    many tunneled through—little miniature tunnels caused by something called the
    carrot fly. The following year, I bought sheets of mesh from the gardening store,
    PVC piping from a local plumbing shop, and had eighteen-inch lengths of rebar
    cut at the Rona. I hammered the rebar into the soil, sawed lengths of piping,
    and curved little inverted Us that helped the mesh arch over the garden beds.
    Covering the carrots worked well to keep off carrot rust fly; covering the brassicas
    deterred cabbage moths and aphids.


    In the cool damp of the Pacific Northwest, I discovered that growing my winter
    squash up trellis helped stave off the development of powdery'
- md: '

    mildew; it kept the fruits from developing soft or mouldy spots where they touched
    the ground and discouraged slugs from trying to latch onto the rind.


    Pruning, or side shooting, the indeterminate tomatoes, removing lower leaves as
    they grow, keeping them the recommended distances away from each other, and staking
    them with T-posts, wire, bamboo, and cotton twine helped prevent fungi and blights
    by increasing air flow, and keeping everything neat and tidy that an affected
    plant could be yoinked before it passed its illness on.


    Still, none of this is foolproof. The powdery mildew eventually takes over, and
    the squash vines look less spry and healthy as their fruits crawl over the finish
    line of ripeness in mid-October. Some years, the tomatoes do so well, starting
    to ripen in July and going until November, that we tire of processing them and
    yearn for the winter. Other years, it’s hot in May and June and the first fruits
    to set have blossom end rot, or everyone in the area gets August or September
    blight and the fruits need to be picked green to pickle or ripen indoors.


    Our season and microclimate also affect what grows well in our yard. I tried sui
    choy several times before realizing it would forever be destined to bolt here—near
    the fiftieth parallel, there isn’t enough light in the early spring, and by May,
    when the days are long enough to promote lots of growth, it’s too hot, and sensitive
    plants produce premature flower stalks. (The slugs also fasted on it.) When I
    grew my first successful cabbage varieties—theaton, which is purple and mildly
    frilly, and Charmant, which is dense and smooth and green—I felt overjoyed. Neither
    would work in kimchi, which is what I wanted for the sui choy, but they’d work
    in other things, and more importantly, they’d work in the garden.


    Last year was a mediocre year for broccoli, and such a great year for cucumbers
    that I struggled to keep up with harvesting them and gave dozens away, including
    to a local food security project after I’d exhausted my friends and neighbours.
    As I began this year''s seedlings in March, and prepared this year''s beds and
    garden infrastructure, we were still eating produce I processed and froze last
    summer and fall.


    It feels a bit like chaos, but it''s instead of a complicated dance of factors,
    some—like watering and covering—I control, and others—like temperature and humidity
    and insect-borne illness—I don''t. The truth is, I''m a perfectionist but one
    without Will''s steady patience. Gardening has taught me the pleasures of delayed
    gratification, and it''s also taught me to accept that some things lie beyond
    my sphere of influence, and some things I''ll never place *into* my sphere of
    influence, so long as Will is willing to tend to our fruit trees and citrus trees
    and shrubs.


    Will has a never-ending list of tasks, one that is perennial, with the rhythms
    on a larger timescale. To keep our citrus trees happy in their pots, for example,
    he has to remove them every two or three years, prune their roots, and place them
    in fresh soil. This must be done when the trees are dormant. He often does this
    during a time of year when, exhausted from the harvest, I''m spending less time
    in the garden than I am playing Stardew Valley. Inside the house, it''s more important
    to suppress any bugs that arrive, rather than simply manage them—an infestation
    of fungus gnats is as unpleasant for us as it is for the ficus or the coffee plant.


    Outside, in the vegetable garden, the timescale for my annuals and biennials is
    more concentrated. They live, they produce, they die. It''s unreasonable to kill
    off every insect that affects the plants. And as long as we''re still able to
    harvest enough tomatoes for sauce, enough carrots to keep us going, it''s not
    the end of the world to co-exist with slugs, aphids, even cabbage moths.


    My plants do not look as perfect as those of my favourite no-till gardener, Charles
    Dowding. I look away for what feels like five minutes and creeping buttercup and
    bindweed have burst through my garden beds and found purchase, disrupting my carrots
    or winding around my gai lan. I neglect to remove the lower yellowing leaves from
    my broccoli, or kale, which I should have harvested sooner. The neighbour''s oak
    sends acorns down all winter, and I discover their seedlings in my peas, beans,
    strawberry bed. I think a cabbage looks beautiful, perfect, ready for Instagram;
    I remove the outer leaves and discover a slug has burrowed in and eaten a large
    hole, leaving its slimy castings as a bonus surprise.


    But really, it''s okay. It''s okay that my produce is sometimes imperfect. It''s
    still usable, even if it wouldn''t be saleable at a grocery store, or be deemed
    worthy by the farmers who harvest the vegetables that go into my CSA box. The
    fact that I''ve grown it, from seed to seedling to plant to harvest (and sometimes
    back to seed again), makes me more invested in salvaging it. I''m also more likely
    to use parts of a plant, like broccoli leaves, that are edible but not generally
    sold at the store. Why waste free greens?


    Some years my favourite varieties aren''t available, and what is available, and
    what I grow, is not as good as a result. As hybrids tailored to our shorter growing
    season, Halona melons, for example, crop faster than other kinds of cantaloupes,
    which take too long to mature. During peak COVID, Halona seeds weren''t available;
    the other variety I grew in October, miserably without flavour.


    The garden offers bespoke lessons. Most of us are aiming for the same goal—grow
    food—using similar tools: seeds, soil. Beyond that, our particular microclimates,
    the slopes of our terrain, the surrounding flora and fauna all mean we face slightly
    different puzzles and are given slightly different opportunities. I can''t grow
    sui choy and I don''t like onions, but I can grow peppers and eggplants in my
    greenhouse, which might be trickier for someone who''s not on a sunny patch of
    the Pacific. That’s what bartering and sharing are for.


    I come to gardening hoping it might perhaps solve my life by teaching me to understand
    patience and my place in the world. A tall order. Maybe, for someone like me,
    lifelong lessons stick each year as well as latex paint adheres to oil-based paint.
    But a real lesson I have learned more resolutely, if painfully, is that it’s okay
    to do my best and not annihilate every single post. Maybe a percentage of my crops
    each year will be great and another percentage will suffer subpar conditions,
    resulting in a mediocre harvest. What’s mediocre is still edible.


    ## The garden


    The garden teaches gratefulness through its bounty and through its fungi, its
    aphids, its bolted cabbages. Every summer, it provides. It provides carrots and
    potatoes, peppers and garlic, saffron and basil and thyme, tomatoes, squash, zucchini,
    cantaloupe, celery, strawberries, blueberries. Even when it fails, it provides.
    Abundance, nourishment; a mediocre crop acting as a foil to last year’s, or next
    year’s, much better crop; sore muscles, warm sun, a cool breeze from the ocean.
    Provision.


    # Acknowledgements


    A previous version of “Tomato chutney, part I: reviving my nana’s recipe” was
    published by Chatelaine as “Thicker Than Water.” Thank you to Chantal Braganza
    for her insightful edits. Previous versions of “The garden will bloom again” and
    “Because someone saved the seed” were published by The Tyee, as were the kale
    pesto and spruce tip ice cream recipes.


    The writing of this book was supported by a grant from the Canada Council for
    the Arts.


    A very hearty thank you to everyone I spoke with and visited and farmed with and
    cooked with and ate over the making of this book.


    Thank you, as well, to my colleagues at Tyee, in particular Christopher Cheung.
    To my incredibly supportive and talented editor, the dream editor for this book,
    Jen Knoch. And to Kim Fu, my best friend and favourite person in the whole world
    to discuss food with. And as always my partner, Will, for helping me make the
    space to research and write. For doing the vast majority of the dishes (by hand!
    Someday we’ll get a dishwasher).

