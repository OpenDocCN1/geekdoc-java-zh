    “There’s no such thing as ethical food,” a farm worker told me a few years ago,
    near the end of the growing season. “More ethical?” I asked, referring to our
    local context. He shrugged, conceding.


    “There certainly is a tendency to think that small farm, local farm, organic farm,
    all equal good farms,” says Antonio De Loera-Brust, communications director for
    the United Farm Workers. “And maybe those things are good for other reasons. But
    there’s no correlation with you, know, being small, local, organic [and] necessarily
    treating your workers right. You can be doing all that stuff, and that does not
    in and of itself mean that you’re going to treat workers with the dignity they
    deserve.


    One of the most “stunning” farming statistics is that a high percentage of farm
    labourers struggle with food insecurity, De Loera-Brust says. “The very workers
    who are feeding us often struggle to put food on the table for their own families.”


    The solution, he says, is for workers to unionize. California is only one of two
    states in the U.S. where agriculture workers have the legal right to unionize.
    (The other state is New York.)


    De Loera-Brust also recommends that consumers focus on buying food from unionized
    farms. Co-op and independent grocers focused on organics or sustainability can
    opt to make this part of their purchasing strategy. Though it’s trickier, consumers
    can do it themselves by checking the labels or fruit stickers for the farm name,
    De Loera-Brust says, and by writing to the grocery chain to note their preference
    for union-grown food.


    Another consumer mindset shift might involve opting to eat seasonally, including
    consuming fresh greens in the winter. In Canada, this means we eat things like
    salad from May to October, eschewing them for stored root vegetables and pickled,
    frozen, and dried vegetables from November to April, with the addition, at least
    on the West Coast, of cold-hardy vegetables with long harvest windows, such as
    kale, Brussels sprouts, and cabbages.


    At Coastal Cookery, owner Sarah McClean and executive chef Sean Hansen tell they
    prioritize labour, sustainability, and local growing in their decision-making
    processes. But, McClean says, the restaurant can’t be recreating its menu every
    day to suit what’s coming in local growers—they need regular dishes that each
    cook can learn to create consistently, alongside specials they can feature for
    a reasonable duration, maybe a month’s time, in the summer.


    What changed things for Coastal Cookery, McClean and Hansen agree, was the establishment
    of a few local farms, such as Terra Nostra, that have an understanding of their
    needs as a restaurant and that can consistently deliver reasonable amounts of
    certain kinds of produce, like the lettuce mix that ends up on my plate.


    When I ask McClean and Hansen why purchasing from local growers is important to
    them, both pause. They’re also participating in a composting program that diverts
    much of what would end up in the landfill to a local facility, McClean says. They
    make their sauces in-house. Put care into their food. It’s just baked into their
    values to support local agriculture. It costs more to do so, but it is a worthwhile
    investment in community and sustainability.


    McClean also says that the growth of local small-scale agriculture, and consumer
    desire for that agriculture has spurred important changes in the ways companies
    like Sysco and its competitors operate.


    “Similar to craft beer, and what pressure that put on Moluson Canadian to adapt
    their business model,” McClean says, Sysco has been to recognize that small farms
    do good produce, but they need support. “Sysco’s done a lot of work with local
    farms, almost brokering for them in the sense of giving them the capacity to expand
    their growth so that they can be sustainable for a wholesale market,” she says.
    “Because also for a lot of farmers, it''s not a nice life to go and slog at the
    market for two days, three days a week, and just try and get rid of everything.”


    Homes and restaurants are just two of the places people eat; some of the systems-wide
    solutions are easier to seek for institutions like universities and hospitals,
    which purchase and cook at larger quantities with regularized meals and more predictable
    demand.


    Hayley Lapalme and Jennifer Reynolds, executive directors of Nourish, work with
    hospitals to reform their food offerings to better meet patients’ cultural needs,
    bring dignity back into kitchens for workers, and build and support local food
    systems.


    There is often dissonance for hospitals, they say over a Zoom call, in the way
    budgets reflect food values. “It’s treated like parking,” Lapalme says. In other
    words, just another budget item, rather than one of the building blocks of patient
    health.


    CHU Sainte-Justine in Montreal—incidentally, the hospital where I gave birth to
    Sinclair via C-section, meaning we were there for a few days—managed to shift
    its food offerings in a way that saw an increase in patient satisfaction from
    50 percent to 99 percent, and a decrease in food waste from 45 percent to 5 percent.
    Patients are now eating more of the food they’re served, nourishing their bodies
    and supporting healing. Fifty percent of CHU Sainte-Justine’s menu is now vegetarian
