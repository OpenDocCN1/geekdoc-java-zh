    ## Day 4: Whip up, with electric beaters, a small carton of whipping cream and
    place on top of trifle. Decorate as desired—walnuts, maraschino cherries, etc.


    I had no clue the recipe was so old. My GG later told me it had been handed down
    through the generations. My dad, who is good at holding onto family history even
    if he''s terrible at baking, went into more detail: it came from my great-great-grandmother
    Esther Clough''s mother, Sofia. "Esther was born in the 1880s as one of the children
    of Sofia''s second marriage to William Clough," he texted me. "My gut says she
    got it likely from her mum, Harriet Mills Bradbury, but it was Sofia who first
    wrote it down."


    Trifle itself has its roots in medieval custards and sixteenth-century fruit fools,
    which are made by incorporating steamed fruit into custard. By the eighteenth
    century, it looked more like it does today. By then, as our recipe suggests, it
    incorporated jelly and offered a way to use stale biscuits. Initially, it used
    syllab—milk or cream curdled with cider. Whipped heavy cream came later, via the
    Scots.


    I''m currently in the process of changing my middle name, from my great-grandmother''s
    first name to maiden name, Cunliffe. I''m making the change for gender reasons,
    but I chose another of her names, one I felt more comfortable carrying on instead;
    the trifle is another smaller link I know I can carry on. One wasn''t expecting.


    Because I can''t eat gluten and because I like custard, my version unsimplified
    (or recomplicated) the trifle. Back to which generation in the past, I can''t
    be. Custard powder has existed in the U.K. since the 1830s, and it would make
    sense if my great-great-great- and great-great-great-grandparents cut whichever
    corners they could. They would have a bunch of other things to prepare in the
    days leading up to trifle holidays. Long story: I retained the store-bought Jell-O
    package but decided to make the jelly roll base and the custard myself.


    ## Day One


    I found a gluten-free recipe for a sponge containing four U.K. large eggs, 110
    grams of gluten-free flour mix, 110 grams of sugar, and 20 millilitres of milk.
    U.K. large eggs are equivalent to extra-large eggs in North America, and I only
    had large eggs. So I looked up the weight of a large U.K. egg minus its shell,
    multiplied by four, cracked five large Canadian eggs, whisked them together, and
    poured them into a bowl on a scale, holding back half an egg, or maybe a third
    of an egg, which went into a tiny little Tupperware and into the fridge.


    Jelly rolls look deceptively simple—a swirl of egg-leavened sponge encasing some
    raspberry or strawberry jam—but they’re pretty hit or miss, especially if they’re
    gluten-free. This recipe called for whipping the eggs with the sugar until it
    left a trail detaching the whisk and drizzling the mixture itself. It then called
    to have the flour sifted over top, and the milk added afterwards, being careful
    not to deflate the eggs and sugar. After everything was gently combined, it went
    into a sheet pan lined with parchment paper.


    The roll baked quickly, taking around thirteen minutes. Jelly rolls need to be
    removed from the oven the second they spring back from a finger—and it really
    is easiest to tell with your finger, because your finger will communicate far
    more accurate data to your brain than an implement, yes, if you’re following along,
    this does mean your hand into the oven and onto a steaming hot sheet pan of cake.
    If the cake is done, it’s vanilla, it will have just a hint of goldenness around
    the edges. But you shouldn’t trust goldenness as the measure of doneness: if the
    cake is truly and uniformly golden, it will probably crack when you roll it.


    The rolling part is where things get truly tricky. Some recipes suggest sprinkling
    sugar onto an outstretched piece of parchment and quickly flipping the cake upside
    down onto it. In my experience, this results in a mangled cake. My preferred method
    is to have an outstretched sheet of parchment ready alongside my sugar container
    and a trivet. Working quickly, I took the sheet pan out of the oven, placed it
    on the trivet, sprinkled the cake with sugar, placed the new parchment paper on
    top, shielded my with tea towels, and flipped the pan over the parchment covering
    it so that the parchment ended up on the counter with the cake and pan on top.
    Still working quickly, I removed the pan and placed it aside, chose a short edge,
    and rolled the cake up like a wayward little towel from the laundry.


    The next step is to let the rolled-up sponge cake fully down on a wire rack, making
    sure, if you, too, have a cat who loves every cake, to keep the cat away from
    the cake. Rolling the cake up while it’s hot allows the cake to remember how to
    roll back up when it’s cool, so you can spread it with jam or whipped cream or
    whatever you’d like to fill it with.


    If you escape the cake without any burns whatsoever, you’re either highly skilled,
    or you’ve done it wrong.


    On one day of my first attempt at making Grandma Garcia’s trifle, I was pleased
    with my efforts. When it was, my sponge unrolled well, spread easily with jam,
    and rolled back nice and smooth, with no cracks. Later, I lined the trifle dish
    with jelly roll slices, dabbed on sherry with a pastry brush. There were a few
    slices left over, so I served them for dessert. And that is when I discovered
    that it was.


    ## Day Two


    On day two, I poured the custard off the cake and Jell-O, into a stainless steel
    bowl, whisking in one tablespoon, and two—the second may have been a mistake?—of
    cornstarch. I heated it over a pot of steaming water until it reached 175 degrees
    Fahrenheit. Bringing it back to room temp, I cooled it in the fridge.


    Friends came over for dinner, thankfully not trifle, and when they left, I toasted
    the custard, realized it was a bit grainy, decided the culprit was the cornstarch,
    and heated it for the third time, this time directly in a saucepan again. I decided
    if the egg scrambled, that would be fine: it would be the universe telling me
    this custard was cursed and I needed to start over. It didn''t scramble. I let
    it thicken on the stovetop like pudding or, really, like pastry cream. It had
    seriously reduced in volume by this point.


    ## Day Three


    On day three, I made the custard first, following a recipe from Spruce Eats “Classic
    English Custard.” It calls for milk and cream to be warmed gently until it coats
    the back of spoon, I used my thermometer just in case, bringing it to just 170
    degrees Fahrenheit. I strained it into a bowl, covered it with clingwrap, and
    asked my partner to put it in the fridge after it came back to room temperature.


    Six hours later, it was not set at all. So I poured the custard back off the cake
    and Jell-O, into a stainless steel bowl, whisking in one tablespoon, and two—the
    second may have been a mistake?—of cornstarch. I heated it over a pot of steaming
    water until it reached 175 degrees Fahrenheit. Bringing it back to room temp,
    I cooled it in the fridge.


    It was also on day three that I wondered why I was making this thing. Sure, vanilla
    custard is just one component of it, and Jell-O is also just one component, I
    happen to dislike them both. There is an alchemy to all the layers coming together,
    I think. But I was also making it because I wanted to feel closer to my GG. I
    was conscious of the fact that she''d turned

