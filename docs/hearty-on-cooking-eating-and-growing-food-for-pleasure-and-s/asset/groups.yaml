    FarmFol City 的 David Catzel 一直参与着育种计划，旨在他们他们开发出一种与 Bolero 品种媲美的开放授粉胡萝卜。该项目由“加拿大种子安全的鲍塔家族倡议”（Bauta
    Family Initiative）运营，FarmFol City 是地区合作伙伴，David 则是该地区的代表。


    David 表示，在过去的 150 年里，行业对开发杂交品种的支持非常多，但对开放授粉品种的支持远跟不上——开放品种（OP varieties）已经落后了。“Bolero
    由法国的一家公司生产，”他说，“如果他们决定不再生产，农民就得寻找新品种。”


    作为项目的地区代表，David 正在与不列颠伦比亚省的农民们进行品种试验。卑诗省的农民通常种植六、七种胡萝卜；David 和他的团队将外观最好的根部种在带有授粉昆虫的温室隔离箱中。然后他们收集种子，让农民在那个夏天把这些胡萝卜重新种到地上。David
    说，他们尝试过的一个开放品种“在味道上可以与 Bolero 媲美，但产量还是不够。”最终是 Bolero 赢了。


    但 David 看起来并没有因此气馁。“种子属于公共领域，”他说。大多数农民已经好几代没有培育种子了；这个项目正在重新引入这个理念。“就像抚养孩子需要社区一样，培育种子也需要社区。”


    我第一次尝试种胡萝卜是一季秋季作物。我翻开了一块新地，将房子附近的一块草地变成了农田，发现里面既有土壤也有垃圾填料——旧鸡骨碎片、玻璃渣、一个旧铝罐、生锈钉子。我坚持了下来，在新地上撒了种。接下来究竟发生了什么已经随着时间的流逝和经验的匮而模糊。是下雨太大了？还是土壤太差？还是我把小小的种子埋得太深了？


    很快，地里开始出现了一些绿意。起初我很兴奋，但很快意识到那是草，它们不知怎么在被拔起、翻动和倒埋后存活了下来。


    今年，我从 4 月初开始种了三茬南特（Nantes）胡萝卜，旁边还有去年剩下的一些彩虹胡萝卜。我是在一个采用无耕风格的架高床上种植，每年在冬季施一次堆肥或覆盖物。有一位来自英国索默塞特、性格随和且乐于现状的小型农民兼蔬菜园艺专家
    Charles Dowding，自从我们 2019 年买房以来就在 YouTube 上关注他，他关于根根类蔬菜的建议我记在了心心里：“现在人们对土壤如何运作以及土壤生命如何运作有了更多的理解，我们不需要通过物理上松松土壤来让根部向下生长探索。”在另一个视频中，Dowding
    直接在草地上搭建了一个 6 英寸高的架高床，填满堆肥并种了胡萝卜。Dowding 说，这是为了说明在这样的新地里种出好胡萝卜是可能的。随着时间的推移，我学会了在种胡萝卜之前给土壤浇水而不是之后（如果土壤干燥的话）；不要过度播种；只用薄薄的土覆盖种子。如果土壤已经潮湿沉重，我会用为幼苗设计的轻质混合土覆盖种子，这样它们就不会被压扁或埋没。


    我们从 6 月开始收获胡萝卜，直到我写这些文字的 12 月底，我们仍在收获。Dowding 的建议是正确的：绝大多数胡萝卜都长得很强壮、真实，有些已经深入了那片不久还长满匍生毛菜的土壤中。


    我的花园并不完美；我们没能根除所有的旋花（晨光花的近亲属），而且冬季鸟类掉进花床里的一堆橡子在胡萝卜发育期间开始发芽，长成了半排胡萝卜植物，这意味着我需要把它们拔掉并重新开始，因为胡萝卜不喜欢在幼年或青少年时期被扰动。但这些都是正常现象——生活中没有什么是能像
    Instagram 贴文那样完美的，在家庭花园里，即使是一颗破碎的、裂开的被冲刷的胡萝卜，也会在你的盆里找到它的位置。


    在种胡萝卜的第二年，我开始在胡萝卜行上覆盖防护网。我将钢筋钉在床的边缘，并将 1/2 英寸的 PVC 管弯成拱形从根钢筋跨过床到另一根。然后在上方铺上昆虫网，并用大石头固定在床的两侧。这样做是为了防止胡萝卜蝇蝇在胡萝卜的土壤中产卵；如果不防止，卵里的幼虫会钻进胡萝卜根部，留下沟槽和隧道，导致胡萝卜腐烂生病。我认为这也有助于在种子发芽时保持土壤中的少量水分。


    在我种胡萝卜的第三或第四年，我成功产出了足够在半年多时间里每周收获胡萝卜的量——在孩子的午餐盒里送胡萝卜条，做胡萝卜汤，收获一些在圣诞节带到温哥华，做胡萝卜蛋糕。卷心和南瓜是我喜欢的另外两种耐寒作物，占据了大量蔓延的叶片空间。胡萝卜在初期被细心照顾并保持湿润和覆盖，之后就非常容易且节省空间。现在，特别是在霜后，它们吃起来又甜又嫩、又脆，就像我小时候吃过那么多胡萝卜，以至于让我的手掌都变成了胡萝卜素黄色。


    ## 收割胡萝卜扁豆汤


    ## 配料


    - 2 汤蔬菜油或橄榄油

    - 1 个中等洋葱，切丁

    - 1 头大蒜，切末

    - 2 个大胡萝卜，切片

    - 1 根芹芹，切片

    - 1 杯红扁豆，洗净

    - 4 杯蔬菜汤

    - 1 茶匙孜然

    - 1/2 茶匙肉桂

    - 1/2 杯牛奶

    - 适量盐和胡椒


    ## 制作步骤


    1. 在大锅中中火加热油。加入洋葱翻炒至透明，约 5 分钟。

    2. 加入胡萝卜和芹芹，再煮 5-7 分钟。

    3. 拌入孜然和肉桂，翻炒 1 分钟直到散发出香气。

    4. 加入扁豆和蔬菜汤。大火煮，然后转小火。焖煮 20-25 分钟，直到扁豆变软。

    5. 拌入牛奶并加热透。

    6. 上菜前根据口味加入盐和胡椒。


    ## 关于替代


    在 7 月底，我我写这篇文章的初稿时，花园正进入产出过剩的季节。我的孩子在这个夏天已经变得半野化了，今天早上出门时穿着她自己选的衣服，只有内衣、袜子和凉鞋。她出去是为了玩，也是为了采摘所有成熟或正在成熟的水果：常采草莓、蓝莓、树莓。


    番茄植物像杂草一样生长并结出一串串果实——但都是绿色的。豌豆、芥兰、红葱和大蒜已经收获完了。辣椒和茄子还没有结果；胡萝卜、甜菜根和西兰花分阶段收获，我们正处于第一批羽衣甘蓝的收获期。今天早上，是黄瓜、豆角和西瓜长得如此快，以至于我们几乎赶不上它们的速度。


    我们会把豆角放入通常含有它们的沙拉配方中；我还会把它强行塞进几乎所有的菜里，用它们来替代水栗（我也用 CSA 蔬菜箱里的萝卜替代）和豌豆。它们可以炒饭；可以做汤；也可以用黄油炒。吃不完的我会焯水冷冻。黄瓜我会用来做一种“泥土水水”——新鲜切片放入一个大空亚当斯花生酱罐里冷藏几小时——我们会当作零食吃，也会放在各种沙拉里。


