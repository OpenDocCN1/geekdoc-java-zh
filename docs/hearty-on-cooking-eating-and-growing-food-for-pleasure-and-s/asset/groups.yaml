    symbolizes is easy, clean; other years it’s bittersweet, a hope that emerges despite,
    rather than because of, its surroundings.


    The winter and early spring provide natural moments to pause and reflect for gardeners.
    In their essay “Winter Is for Regeneration. The Garden’s—and Yours, Too,” ‘Cuágilávk
    (Jess H’austí) writes about the connection between trauma, mental health, grief,
    and gardening.


    For ‘Cuágilávk, the link between gardening and mental health was solidified when
    they transformed an empty lot into a community garden the year following the Nathan
    E. Stewart spill, which polluted what had been then until the breadbasket of Heilstuk
    territory, impacting “dozens of marine and intertidal species that hundreds of
    Heilstuk families relied on for sustenance.’Cuágilávk had been the incident commander
    during the spill; when the acute response phase ended, they struggled to rediscover
    the pace of daily life and were eventually diagnosed with post-traumatic stress
    disorder.


    > “We knew that growing carrots and onions could never replace the tainted beds
    or the plethora of ocean relatives that were poisoned by the spill,” ‘Cuágilávk
    writes. “But it gave me a small sense of stability, control and agency over my
    family’s food security—enough to help pull me through the worst of mental and
    spiritual anguish. And I hope it gave that gift to others too.”


    > In the winter, they write, “The deeper work that supports our seasonal thriving
    is still creating magic in our raised beds; beneath the frost, the layers of kelp
    mulch and decaying bracken fern, the soil is rebuilding itself with deep inhales
    of cold winter air.”'
  - '[PAGE 125]


    Rest in winter and early spring is purposeful, active in a way that contrasts
    with the heady midday time of abundant harvest—but it is key to that time of abundance.
    It is an act of hope and care to tend to the soil and participate in the ecosystem
    and ready it for the coming year.


    But part of what offers hope contains sadness for me: the garden will bloom again,
    but not everyone and everything will be here to see it. The return of last year''s
    rhythms, the return of tiny pinpricks of green against the rich and joyous brown
    of the earth—they hold promise for the future, but they also remind me of what
    we have lost.


    Maybe, though, this is also part of gardening''s gift, offering a way into the
    grief I have not been able to process, the stress I thought was going to be acute
    but instead chronic, the anger I have that the early pandemic hope of social cohesion
    in crisis gave way to the same pressures of capitalism and conspiracy that have
    been making life feel more and more unlivable.


    It makes sense that spreading manure, or compost, is the act that drums everything
    I''ve been processing over the winter—composting an act that embraces death and
    transformation, turning organic matter into material that will feed the soil.
    The sound of my shovel against the metal of the wheelbarrow, the way it catches
    on the rivets when it''s getting empty, the way the gardens look when they''ve
    been top-dressed, deep brown and ready for the coming year—everything so familiar,
    sweaty, and meditative, and of course it doesn''t engender the same feelings it
    did last year, or the year before that, because I''m a different person, needing
    to learn different lessons.


    I remember the years best by their springs—the way they unearth the past and offer
    a generative way forward into the cacophony of summer. I also look forward to
    them most, even though they''re not always easy. They'
