    Conventional ag is not just extractive when it comes to soil fertility—it often
    relies on an extractive approach to labour that does not adequately compensate
    people for their hard work and considerable skills. Migrant workers, who make
    up a large proportion of agricultural workers in Canada and the U.S., are often
    dependent on their employers for their visas and fear retion if they speak about
    health and safety violations.


    Where ecological offences and labour offences intersect, the results can be sad,
    even gruesome: a recent paper put together for the UC Merced Community and Labor
    Center Farmworker Health Study found that farm workers, chronic exposure to pesticides
    can cause adverse birth effects, cancer in children, genotoxicity, declined neuropsychological
    functioning, cancer, and cardiovascular diseases in adults.


    Posts from the UFW always carry a hashtag: #WeFeedYou. be can,,, the recent pace
    of inflation and how expensive groceries are right now, to factor in the costs
    associated with this kind of agriculture we don’t pay at the till—the costs to
    labourers, and the costs to the land and water where these labourers live. But
    they form part of what goes into each and every bag of conventionally grown lettuce
    that comes to B.C. from California in the winter months and much of what is produced
    conventionally right here in the province.


