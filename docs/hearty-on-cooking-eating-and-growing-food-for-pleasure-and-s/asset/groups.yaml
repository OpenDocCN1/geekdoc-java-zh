    他的农场占地26英亩，他在那里已经住了十二年。他种植各种种子，从胡萝卜到谷物到豆类无无不包。在一个温室里，丹（Dan）向我展示了黑鹰豆、乌特勒支蓝小麦和高乔豆（一种既可以鲜吃也可以干吃的矮生豆）。这三种种子都在温暖的阳光下晾晒。在第二座玻璃房里，晾晒着露露（Lulu）和女王索菲亚（Queen
    Sophia）金盏菊种子，还有倒子花种子和新星菊。有像羽羽毛球的柳菊种子。黑小麦是黑麦和小麦的杂交种；还有单粒小麦，以及像毛茸茸毛虫的小米。杰森说，鸟儿喜欢小米，一穗小米就能收获很多种子。


    “当鸟儿开始吃它们时，”他补充道，“你就知道该收获了。”


    种子桌下放着一些带盖的桶，里面装了一部分正在发酵的番茄：格拉姆的优秀守护者（Graham’s Good Keeper）和波洛克（Pollock），这都是早熟且高产的品种。发酵过程去除了种子周围的保护性天然层，这种层在果实生长期间能防止种子在番茄内部发芽。


    2019年，丹出版了《用我们的种子改变气候》（Changing the Climate with the Seeds We Sow），该书主张小生产者将注意力转向在北美通常没有广泛种植（至少规模较小）的豆、谷物、草药和种子。


    “我一直告诉人们：如果我们自给自足，种胡萝卜、豆角和洋葱没关系，但拥有那些养了我们千年的豆类和谷物非常重要，”他说，“很少有公司关注谷物和藜。但它们是最容易的。它们需要的照顾最少，回报也最丰厚。”


    我信服了，我的下一份盐泉岛（Salt Spring）订单包含了安妮·杰克逊（Annie Jackson）豆和一种名为早期粉（Early Pinkies）的矮生豆。而且——由于我不能吃麸质，且对种子头的形态非常有审美吸引力——还包括我在丹的玻璃房里看到晾晒的小米。


    与种子生产者和销售者的交流让我对缓解气候变化的影响有了真实的希望，这些影响在过去几年里不断增加，特别是在西海岸。这帮助我更好地视觉化花园里生长的植物与其近期血缘之间的联系。


    去年当我与凯文·威尔逊（Kevin Wilson）在道尽道别时，我带走了洋葱、鱼香草和一包瑞典红豌（Swedish Red peas，也称为主教豌 Bishop
    peas）——他认为这是他最喜欢的豌豆之一。现在，洋葱和鱼香草在我们前院生长茂盛。在我们的后院，我留了足够的几盆豌豆供明年种植。


    在最初与丹和梅根（Meghan）交谈后，我从盐泉岛订购了种子，至少有一种我知道是来自斯托尔农场（Stowel Farms）的。在我访问盐泉岛的那年，我买了一些名为国王乌伯托（King
    Umberto）和阳光卡瓦（Sunshine Cava）的番茄种子。


    与农民和家庭种植者的交流，延续了他们从家里到农场的循环，这种网络随着每个新种植者的加入变得更加深广。需要大量的照顾和关注来追踪从发芽到生产的种子；我收到的每一颗种子都是一份持续成为他人的礼物。


    当我问梅根种植种子是否改变了她对园艺和种植过程的看法时，她说这扩展了她的生态学观点。“在植物生命的每个阶段，”她说，“不仅仅是植物本身，还有所有的授粉者，以及围绕它的其他生物和系统。”这也扩展了她对季节和时间流逝的看法。

    “种子是一个跨世代的项目，”她说，“我看到了我们今天所做的果实。我们所做的是有益的。你要对未来有信任。”而且我继承了人们过去所做的一切工作。“我们站在数千年来种子保存者以及适应了我们今天品种的人们的背上，”她补充道，“我们能够享用今天的食物的唯一原因是因为有人保存了种子。”


    ## 素食柠檬饼干


    2022年2月中一个阴郁的日子，在奥密克戎（Omicron）的第一高峰过去后，我的朋友诺拉（Nola）和梅根来家里，尝试制作素食柠檬饼干（即那种通常用杏仁粉、糖粉和蛋蛋白制成的精致三明治饼干）。


    辛克莱（Sinclair）一整天都把内衣戴在头上当帽子，而我们在房屋外围安装了垂柳——每当下雨时，水和泥土就会渗进我们的地下室，沿着混凝土底在房屋下方及周围的地上形成微型河流。


    诺拉是素食者，而且和我一样不能吃麸质。她以前从未尝试过饼干——这个事实让我很宽慰，因为如果我们的饼干平平无奇，她永远不会。诺拉和梅根正带着从诺拉温室里的树上摘下的鲜艳亮黄色柠檬过来。


    我完善素食柠檬饼干的欲望部分源于社交，部分源于食物，部分源于执着。在社交方面，疫情让我感到孤独，有朋友聚在我的厨房里烘焙的想法几乎令我流泪。在食物方面，我想为诺拉提供一口美味的小食。而在执着方面：我最喜欢的食物随之一是杰弗里·斯廷格（Jeffrey
    Steingarten）写的文章，那是关于他在巴黎外的一场派对上吃到一个饼干后，追求完美饼干的之旅，那种饼干好到让他“迅速将其加入了世界百大美食清单，并流泪地从他的神殿中移除了士力巧克力棒”。斯廷格和我对食物有种这种挑剔的、傲慢的审美者的喜爱，即那种极佳的食物、感觉像一种启示的食物、植根于人们对生活渴望的食物。（我们对士力巧克力也有类似的看法——嗯，对我来说，是玛士力巧克力。）但我的目标是开启追求完美之旅。我希望看到诺拉那些美丽的柠檬变成口感细腻酥脆、嚼劲十足的饼干，一种她可以吃的饼干。


    我们正在使用来自“饼与塔可”（Pies and Tacos）博客的食谱，该博客专门经营饼干和杯蛋糕，在我网上找到的所有制作过素食柠檬饼干的烘焙师中，他们提供的食谱似乎是水分最充足的。该博客博主卡米拉·赫斯特（Camila
    Hurst）写道，她和我一样，学习烘焙部分是为了治疗抑郁——寻找一个能给她的生活注入目标和快乐的爱好。


    这个食谱要求用鹰豆水（aquafaba）来代替蛋蛋白，蛋蛋白通常用于制作与杏仁粉和糖粉混合的蛋白霜来制作饼干壳。对于素食者、类素食者或对鸡蛋过敏的人来说，鹰豆水是罐装鹰豆周围的液体。这个术语是由一位美国软件工程师古斯·沃尔特（Goose
    Wohlt）于2015年创造的，但最早的用豆汁作为蛋蛋白替代品的记录是2014年12月，来自乔埃尔·罗塞尔（Joël Roessel），他是一个想吃糖霜的素食歌剧男高，根据《华盛顿邮报》，他问自己：“什么让我对生蛋白感到恶心？”


    和诺拉不同，我制作并吃过很多饼干。我在巴黎吃过。我在蒙特利尔、温哥华和纽约吃过。我在自己的厨房里现现吃过，决定自己已经被大多数商业版本宠坏了，无法从那些没做好的烘焙店里购买了。作为一名


