    farming and our responsibility to the land.


    Another solution is to rely more on sustainably harvested wild animals—an ancestral
    right of Indigenous Peoples on this continent that needs to be prioritized over
    settler hunting rights, as colonial plunder has endangered the habitats of so
    many animal species.


    And yet another solution is a cultural shift, that one could come directly from
    the chefs watch on television and see in magazines. Just as HGTV exalts unnecessary
    renovations as the world is burning, so does the Food Network centre its entire
    aspirational ethos around cuts of meat.


    Watch any competitive cooking show—from Iron Chef to Chopped to Top Chef—and it
    will soon become clear that the unrelenting priority of most dishes is beef, lamb,
    chicken, rabbit, fish, or quail. The test of a chef’s depth and breadth of skills
    is rarely how they cook fiddleheads or asparagus; generally, it’s how they handle
