    本书的写作得到了加拿大艺术委员会的资助。


    衷心感谢所有在本书期间与我交谈、拜访、一起耕作、一起烹饪和一起吃饭的人。


    同样感谢 *Tyee* 的同事们，特别是 Christopher Cheung。感谢我极具支持且才华横溢的编辑，这本书的梦幻编辑 Jen Knoch。还有
