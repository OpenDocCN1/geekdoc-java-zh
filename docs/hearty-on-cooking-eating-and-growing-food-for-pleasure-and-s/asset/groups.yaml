    prepare the greens.


    +   2. Wash and dry the greens thoroughly and prepare them. For kale and chard,
    remove the spine from each leaf. Carrot tops are good to go after washing. For
    stinging nettles, wear gloves and remove the leaves carefully from the spiky spine
    and cook them briefly in boiling water. (For garlic scape pesto, omit the garlic
    from the recipe, remove the area thatid would become the garlic flower on the
    scape, and chop the rest roughly before blending.)


    +   3. Roughly chop the greens and set aside.


    +   4. Add the toasted nuts, garlic, and Parmigiano-Reggiano to a food processor;
    pulse until the nuts and garlic are fairly well chopped.


    +   5. Add the greens. With the food processor running on low, drizzle the olive
    oil until you have a relatively smooth paste. It''s okay if it''s a little chunky,
    and the greens have a bit of texture.


    +   6. Add pepper and salt to taste. Add a squeeze of lemon to brighten the flavour
    and counteract any bitterness.'
