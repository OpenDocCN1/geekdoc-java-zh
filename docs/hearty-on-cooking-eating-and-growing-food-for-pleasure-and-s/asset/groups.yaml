    as a celebratory meal with our excess of potatoes, it would be a pommes dauphine
    I ate during the pandemic with my partner at a bistro-style French restaurant
    in Kitsilano, while our kid was having a sleepover with her cousin. They came
    alongside steak dressed in butter, and I was expecting them to be pommes dauphinois,
    because I''d misread the menu. They were absolutely not gluten-free, but I didn''t
    realize until later when my stomach hurt. All I knew at the time was that I''d
    accidentally ordered some kind of strange French tot that arrived at the table
    perfectly fluffy and deep-fried, the jus from the steak acting as a kind of dipping
    gravy.


    The ingredients to make it—(gluten-free) flour, eggs, milk, butter, salt and pepper,
    potatoes—aren''t any more complicated than anything I cooked in my twenties. But
    the process is complex, like some of the Peruvian processes for turning potatoes
    into otherworldly things with pleasantly confounding textures—only unmistakably
    French, because it involves combining choux pastry with mashed potatoes and then
    deep-frying them.


    When I make them at home, I study a few different recipes and then settle on a
    *Serious Eats* version; this way, as long as I am looking for the same product
    they''re looking for (crisp outside, light and fluffy inside), someone has done
    the recipe testing for me, and I do not need to fuss around with my roux and potato
    ratios.


    I begin the day before removing a small Tupperware full of vegetable demi-glace
    from the deep freeze and thawing it in the fridge. On the day of, I start the
    gravy, sautéing onion from the grocery store with some frozen leeks I grew last
    year. Once the gravy is bubbling away, I turn it to low and make my choux. Then
    I begin boiling a pound of russet potatoes, making a salad with mizuna and cilantro
    from the yard, and a simple vinaigrette, while they cook. I rice the potatoes
    using an antique ricer I got off Facebook from a woman who crawls the local thrift
    stores and estate sales and then upsells, tacking on a small finder’s fee. I heat
    canola oil in a Dutch oven, which I got on sale from Canadian Tire, until it reaches
    340 degrees, and then I use two spoons to drop slightly wonky balls of dough into
    the hot oil, ten per batch. While I’m frying, I make some maple-balsamic-glazed
    tofu. All in all, it takes about two hours, and we have a fancy vegetarian dinner.
    These pommes dauphine are lighter, airer than the ones I had in Vancouver; they
    go so well with the deep umami of the leek and onion gravy, with the light and
    acidic crunch of the salad on the side. The recipe says it''s meant to feed four
    to six, but the three of us eat four helpings, dipping her potatoes in a ramekin
    of gravy, and when she’s done, drinking the gravy straight up.


    It is strange that my favourite gift from my mother is a fifty-pound bag of potatoes
    that reminded me of being assaulted in her presence? Probably. But I think it’s
    attributable to the enduring nourishment and culinary power of the potato. Potatoes
    could remind me of sexual assault, the enduring anger I feel towards my mother,
    and of poverty, but they don’t, usually. On a daily basis, they’re simply a reliable,
    flexible cornerstone. They are so good at adapting to their surroundings, becoming
    crispy or crunchy, soft and fluffy, ever glue.


    They are so transmutable when Sinclair turned four, I began to call my little
    sack of potatoes (pronounced puh-tatt-ohs). She weighed just under forty pounds,
    and it was no longer an effortless task to heft up and carry her. So I began to
    say, “Of, my little sack of potatoes, you’re getting so strong!” and then carried
    her wherever she wanted to go, or she did. Sometimes, still, we gallop along and
    I pretend to be a horse, bouncing her and making cluh-clop, cluh-clop, cluh-clop
    noises with my tongue.


    # Vegetarian Shepherd’s Pie


    This recipe can be made more simply and adapted to suit your needs. Can’t afford
    celery or sour cream? Omit them. Have some snap peas or some sad-looking broccoli
    in the fridge? Add it.


    # Ingredients


    - 2 tablespoons vegetable or olive oil

    - 1 medium-sized onion, diced

    - 2 ribs of celery, diced

    - 1 large carrot, diced

    - 4 cloves of garlic (at least), minced

    - 1 398 millilitre (14 fluid ounce) can of tomato-based baked beans

    - large handful of texturized vegetable protein (TVP)

    - 1/2 cup of vegetable stock (or 1 teaspoon of soy sauce and 1/2 cup of water)

    - 1 1/2 tablespoons herbes de Provence

    - 1/2 cup frozen peas

    - 5 large or 8 medium-sized potatoes

