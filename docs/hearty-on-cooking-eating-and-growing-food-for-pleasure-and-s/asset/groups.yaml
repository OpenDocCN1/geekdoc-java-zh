    # tomato chutney, part ii: the empire in a sandwich


    > “From food do all creatures come into being.”

    —The Bhagavad Gita


    In my nana’s final year of life, she told me my brother, that it would be okay
    to call her Her. So before she died in late 2020, at the age of ninety-five, I
    got to speak with her on the phone a couple final times. The conversations were
    short. She wanted to hear about Sinclair, and she wanted to know that I was happy.
    She didn''t want to talk about herself. I told her I’d made her chutney, and there
    was a piece I’d written about it that I wanted her to read one day, when she was
    ready. The pandemic was less than a year old. I was worried about her—worried
    she’d get COVID, worried she’d be isolated. I wanted to visit, but I lived thousands
    of kilometres away, and it would have been irresponsible.


    I first visited her grave in late 2021. My brother and I trudged through the swampy
    grass, our boots getting muddier, searching for where she’d buried. When we got
    there, we weeded the small area in front of her gravestestone, and I cried, my
    brother and I hugged, and then we went home.'
  - '[PAGE 51]


    When I was growing up, I used to press my family members for information—details
    that would help me piece together the stories of their lives. My dad and my maternal
    grandfather and my paternal grandmother all shared freely, sometimes remembering
    something new as I jogged my memories with noisy follow-ups. But my nana often
    demurured. She told some stories—one about why she didn’t like to put her head
    underwater while swimming—but kept of what makes family stories fun, like scandals
    and fights and fractures and breakups and makeups, to herself. Though I regularly
    asked about it, she kept her birth year private until she reached nieces; she
    preferred to share fond memories of family members, such that much of what I learned
    about her family life was through what was left unspoken.


    But it also came through in her habits, including her cooking and her food, which
    were the clearest connection with her past and one of the clearest demonstrations
    of her love and care. When my grandfather developed high blood pressure and high
    cholesterol, for example, she switched from cooking with leftover bacon to cooking
    with lighter oils and making things like steamed fish.)


    I never thought to ask my nana directly about the culture she was passing down
    in the form of food. Though I had the recipe for her chutney, I hadn’t thought
    about where exactly it came from my mid-thirties, and I never got the chance to
    ask her. While I was writing the essay about chutney meant in our relationship,
    I began to wonder if someone had passed it down to her, or if it was something
    she’d picked up in her lifetime. Did she start making when her kids were young?
    Or much later? Or maybe earlier, growing up in England?


    I’m curious enough that I’ve been tempted to email my aunt, from whom I’m estranged,
    to ask. But this impulse to get to the heart of things is part of the reason we’re
    estranged in the first place. So I opt not to, instead'
  - '[PAGE 52]


    asking father, who began attending family meals at my mother’s house while he
    was in high school in the mid-1970s. His side of the family eats their cheese
    sandwiches and ploughman’s lunches—bread, cheese, chutney, pickled onion—with
    Branston Pickle, a popular type of pickled chutney, first manufactured in 1922,
    that’s often eaten in this application in England. (My nana was born just three
    years after Branston Pickle, in 1925.)


    My dad says my nana’s chutney was unique to him—he’s never had another like it.
    But it was a staple of household when he first entered it. This, and the recipe,
    are the two clues I have to go by.


    There is a joke about the British—that they went a’colonizing in search of flavour
    and spice, only to then neglect, as a culture, to season their food.


    In the sixteenth and seventeenth centuries, English cooks did tend to use spices,
    such as mace and cinnamon and nutmeg, to season their meats and meals. Herbs and
    spices were used for something like medicinal purposes in cooking, to “balance”
    the “humours.”


    Food historian Lizzie Colingham’s *The Taste of Empire* traces amongst many things
    the eventual decline of popularity of spices in savoury British cuisine. One chapter
    follows naval administrator and diarist Samuel Pepys and his wife on a mid-seventeenth-century
    excursion to a French restaurant, or “ordinary,” which, Colingham writes, “rejected
    spice mixtures on the grounds that they disguised rather than enhanced flavour.


    As spices disappeared from English food, it became increasingly plain, dominated
    by roast and boiled meats, pastries and pies,” Colingham writes. “These plain
    meat dishes were, however, always accompanied by pungent condiments: mustard,
    horseradish sauce, pickles or fruit jellies.”'
  - '[PAGE 53]


    Over a video call, Collingham tells me that while British cuisine eventually relegated
    spices to the sweet course of the meal, savoury condiments remained “really important.”
    By the 1850s, she says, Indian curries made with curry powder had become quite
    fashionable, adorning middle-class dinner tables and being featured at parties.
    The middle classes also hashed cold meat with curry spices to make their leftovers
    more appealing.


    This wouldn''t quite have been my family: all the branches I’m familiar with were
    working class. I know less about my maternal ancestors, but my paternal ancestors
    worked in mills and as labourers and farmers and butchers. When Collingham asks,
    I tell her my name came to Canada from England after the Second World War, as
    a nanny, and then worked in retail at the Bay; my grandfather enlisted in England
    at seventeen, hoping to become a pilot, but his eyesight was too poor. So he came
    to Canada via the postwar red carpet that was rolled out for English veterans
    and began working as an electrician. Neither of my grandparents went past eighth
    grade in school.


    While curries saw a rise in popularity in nineteenth-century Britain for the middle
    classes, as a direct result of the colonization of India—first Company Rule from
    1773 to 1858, and then the British Raj until 1947—Brits didn’t adopt the practice
    of eating chutneys, or relishes, with their curries. (They also simplified their
    cooking approaches and their spice blends initially brought back from India to
    a much narrower spread of options that follow a similar cooking technique. But
    that’s an essay lots of others have written)


    Chutneys and pickles, however, were “very, very much a working-class thing by
    the first half of the twentieth century,”” Collingham says. “Of all the Indian
    influences that might have gone through to the British working classes, it tended
    to be piccallilli and Branston Pickle.”'
