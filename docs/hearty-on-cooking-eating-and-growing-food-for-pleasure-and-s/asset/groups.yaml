    There is often dissonance for hospitals, they say over a Zoom call, in the way
    budgets reflect food values. “It’s treated like parking,” Lapalme says. In other
    words, just another budget item, rather than one of the building blocks of patient
    health.


    CHU Sainte-Justine in Montreal—incidentally, the hospital where I gave birth to
    Sinclair via C-section, meaning we were there for a few days—managed to shift
    its food offerings in a way that saw an increase in patient satisfaction from
