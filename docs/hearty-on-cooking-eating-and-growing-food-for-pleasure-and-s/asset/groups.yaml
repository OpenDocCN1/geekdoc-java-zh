    systems fed millions of people. On the municipal level, this is an involved but
    available fix: organic waste can be composted and reused to support soil fertility
    instead of being sent to the landfill, where it does nothing but create methane.


    All agriculture was sustainable a hundred years ago, because we had no chemical
    fertilizer,” he says. “It’s not that we can’t do it. It’s already done. We could
    do it today. It’s just a mindset. It’s cultural.”


    So we could reduce waste, but we could also reduce it and focus on getting more
    of what we produce on tables. A 2021 paper in the journal *Resources, Conservation
    & Recycling* found that 14 percent of food is “lost before it ever reaches the
    retail level.” Suggested solutions included shifting away from the model of offering
    tax incentives for donations, which farmers often find time-consuming and difficult
    to take advantage of, and shifting towards investing in processing infrastructure,
    which allows farmers to turn “ugly” produce into value-added foods; hooking farmers
    up with alternative markets as farm-to-school programs; and focusing on price
    support and stabilization for produce.


    Further waste happens at the retail and consumer levels. In B.C., the government
    estimates that organic waste represents 40 percent of the material sent to landfills.
    Not all of this will be edible or directly recoupable, of course—some of it consists
    of things like eggshells and the tough leaves of cabbages and the half-eaten peanut
    butter sandwiches that come in a five-year-old’s lunch box. In the case of retail-level
    waste, some can be diverted or avoided by matching businesses with programs they
    can donate to. Consumer-level waste can be reduced by shifting to meal-planning
    and learning how to process to freeze, dry, or on-the-cusp vegetables before they
    turn. These practices require social support, though—via in-school food literacy
    and farm-to-school programs'
