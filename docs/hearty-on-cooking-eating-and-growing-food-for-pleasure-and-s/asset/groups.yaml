    my most recent batch, I''ll ruin my desire to ever make them again. Reading some
    Serious Eats run by Nik Sharma, I learn that canned chickpeas made with kombu,
    which contains carrageenan, makes the meringue, and thus the macarons, more stable.
    Part of me wants to to wake up early tomorrow and head back to the store for chickpeas
    made with kombu. But I decide to keep that in mind for next time and choose to
    be satisfied for now; I''ll wait until Nola''s birthday rolls around, and I have
    an excuse to try a chocolate batch.


    And it turns out I don''t have to worry all that much about Nola and her partner
    Jason''s reactions to the mediocre, just-passable macarons. “They’re for us?!"
    Jason asks Nola, seeing my process posts on Instagram. Picking them up from our
    house, Nola tries one and loves it—satisfaction! Later that evening, she texts:
    “Jason is flipping out over the cookies!”


    For me, this offers a lesson I''ll need to keep learning. It''s the opposite of
    what made me want to mimic Stegarten: not only can there be pleasure without animal
    products, there can be pleasure without perfection.'
