    little bits of flour that had not been fully hydrated by the whipped egg and sugar
    mix. Disappointing! But not disappointing enough to turf the entire thing and
    start over.


    # Day Two


    On day two, I poured a tin of mandarin oranges over a fine-mesh sieve, reserved
    the juice, topped the sponges with the oranges, whisked boiling water into a raspberry
    Jell-O packet, and added the mandarin orange juice. I cooled the Jell-O in the
    fridge for an hour, then poured it over a spoon for gentler distribution onto
    the orange slices and sponges. The cooling step and the spoon step are not included
    in the recipe, but both helped to ensure I didn’t mangle or, or worse, cause the
    complete disintegration of the sponge cake by power-washing with hot liquid.


    # Day Three


    On day three, I made the custard first after breakfast, following a recipe from
    the Spruce Eats “Classic English Custard Sauce.” It’s specifically billed as being
    for trifle; it calls for milk and cream to be heated in a saucepan with a teaspoon
    of sugar and then used to temper egg yolks that have been beaten with a third
    of a cup less one teaspoon of sugar. The mixture is added back to the saucepan
    with vanilla bean seeds and warmed gently until the stovetop until it coats the
    back of a spoon (meaning that if you dip the spoon into the custard and run your
    finger through the custard mix on, the line you draw will keep its boundaries).


    This should not have been terribly difficult for me. I regularly make successful
    custard for churning into ice cream; I make pastry creams, which'
  - '[PAGE 160]


    are similar but thickened with cornstarch; one of my favourite simple desserts
    is chocolate mousse, which is made by folding whipped cream into homemade chocolate
    custard. I followed the Spruce Eats recipe to a T. Even though I was certain I
    knew what it meant to warm the custard gently on the stovetop until it coated
    the back of the spoon, I used my thermometer just in case, bringing it to just
    over 170 degrees Fahrenheit. I strained it into a bowl, covered it with clingwrap,
    and asked my partner to put it in the fridge after it came back to room temperature—I
    was running out to errands. When I came home, I poured it onto the jelly layer.


    Six hours later, it was not set at all. So I poured the custard back off the cake
    and Jell-O, into a stainless steel bowl, whisking in one tablespoon, and two—the
    second may have been a mistake?—of cornstarch. I heated it over a pot of steaming
    water until it reached 175 degrees Fahrenheit. Bringing it back to room temp,
    I cooled it in the fridge.


    Friends came over for dinner, thankfully not trifle, and when they left, I toasted
    the custard, realized it was a bit grainy, decided the culprit was the cornstarch,
    and heated it for the third time, this time directly in a saucepan again. I decided
    if the egg scrambled, that would be fine: it would be the universe telling me
    this custard was cursed and I needed to start over. It didn''t scramble. I let
    it thicken on the stovetop like pudding or, really, like pastry cream. It had
    seriously reduced in volume by this point. It was not perfect, but each scoop
    of the finished trifle would have so little custard-pudding-pastry-cream I figured
    no one would notice that it was at best five out of ten.


    It was also on day three that I wondered why I was making this thing. Sure, vanilla
    custard is just one component of it, and Jell-O is also just one component, I
    happen to dislike them both. There is an alchemy to all the layers coming together,
    I think. But I was also making it because I wanted to feel closer to my GG. I
    was conscious of the fact that she''d turned'
- md: '

    eighty-five year, and that she would not remain hale and hearty and anxious and
    grumpy forever. I wanted to get good at making her trifle while she was still
    around, so that I was next in Ontario, I could make it for her.


    I also wondered why I’d followed a North American recipe for custard on a website
    I find bit uneven. In part, it’s because of the egg size issue I had with the
    jelly roll. I wanted six large egg yolks to be equivalent, without any math or
    partial yolks, to the six large egg yolks I had. (Laziness!)


    After I spooned my custard-pudding-pastry-cream over my jelly layer and set the
    whole thing back in the fridge again, I immediately began looking Mary Berry trifle
    recipes. Surely she had a recipe for a custard that would actually work in a trifle.
    A representative of her trifle custards (she’s made many over the years) calls
    for:


    - 50 grams (2 oz) caster sugar

    - 3 tablespoons cornstarch

    - 4 egg yolks

    - 1 tablespoon vanilla extract

    - 450 ml (15 fl oz) full-fat milk

    - 150 ml (5 fl oz) double cream


    On YouTube, I watch a 1975 clip of Mary Berry making a trifle for the show Good
    Afternoon! Host Judith Chalmers asks Mary Berry, as she is adding five tablespoons
    of sherry to pear juice and maraschino cherry juice to soak her sandwiched sponges,
    what she thinks of sherry substitutes. “I don’t think it’s a good idea to use
    them at all,” Berry says, forecasting her later fondness for boozy desserts on
    Great British Bake Off.


    In this clip, Mary heats half a pint of milk on the stovetop. “This is a vanilla
    pod, Judith,” she says. “That’s the real McCoy.” She adds three egg yolks to a
    glass bowl, whisking in an ounce of sugar and a teaspoon of cornstarch. When the
    milk is hot, she tempers the egg mixture and places it back on the stovetop, she
    cautions to cook slowly. “It is quite tricky,” she says. “You mustn’t let it boil
    or become too hot. It must be very, hot, so you can hardly put your hand in, and
    it must coat the back of a spoon. Then let it get cold, and pour it on top, and
    it sets like that.”


    Gently shaking her trifle bowl, Mary Berry demonstrates that her custard is firm,
    with just the hint of the wobble. I take notes.


    ## Day Four


    On the fourth day, I whipped some cream, plopped onto the top of the custard,
    and decorated the top of the trifle with raspberries. This is not canon according
    to my GG’s recipe, but it is something I’m sure I’ve witnessed her do. I texted
    friends of ours, Jen and Peter, who live just up the hill from us: “Are you interested
    in . . some trifle?” When Jen said yes, I added the cake that the jelly roll nor
    the custard was perfect. “Oh, we’ve been following on Instagram,” she wrote. (I
    had been Instagramming, via the Stories function, my trifle journey.)


    Later, after they visited, Jen texted again: “Tastes pretty freaking good to me!”
    If I were a more normal person, I think I would have found this satisfying. But
    I knew I’d be remaking the entire thing again the following weekend, because I
    needed to perfect the sponge and custard based on what I’d learned from my first
    attempt.


    To prepare, I watched more people make trifles. On the TV show This Morning, I
    watched Phil Vickery make a retro trifle, for Christmas, to what were apparently
    the Queen’s specifications: sponge sandwiched with jam, a ton of sherry, tinned
    mandarin oranges, Bird’s Instant Custard, no Jell-O, decorative elements that
    would be at home at a 1970s dinner party. The hosts are Holly Willoughby and Phillip
    Schofield; Willoughby, I recognize from another clip, a clip where she tells chef
    Gino D’Acamapo if her pasta dish had ham in it, it would be “closer to a British
    carbonara,” and in response, he tells her if her grandmother had wheels, she would
    have been a bike. We’re an anti-monarchist family, so it’s a touch disappointing
    to discover many similarities between our truffle and the Queen’s, but very little
    has ever turned me off eating dessert. On Ireland AM, I watch Karl Clarke make
    a traditional sherry trifle, again for Christmas. His incorporates sherry into
    the Jell-O as well as dosing the sponge with it. For kicks, I watched Nigella
    Lawson make an Anglo-Italian trifle, not for Christmas, with a base of sponge
    and jam, amaretti biscuits, lemon liqueur, and a layer of glossy, jammy blackberries
    topped with a whipped mascarpone.


