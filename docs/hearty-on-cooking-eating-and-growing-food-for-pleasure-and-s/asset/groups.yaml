- md: '

    David Catzel from FarmFol City has been participating in a breeding program to
    see if they can develop an open-pollinated carrot variety that compares well to
    Bolero. The project is run by the Bauta Family Initiative on Canadian Seed Security;
    FarmFol City is the regional partner, and David is the regional representative.


    There has been so much industry support to develop hybrid varieties over the past
    150 years, David says, and not nearly as much on open-pollinated varieties—the
    OP varieties have fallen behind. “Bolero is produced by one company in France,”
    he says. “If they decide not to produce anymore, farmers have to find a new variety.”


    As the regional representative for the project, David is running variety trials
    with farmers across B.C. Farmers grow about six or seven varieties of carrots;
    David and his team plant the best-looking roots in isolation cases that contain
    pollinators in the greenhouse. Then they collect the seed, and farmers plant the
    carrots back out that summer. One OP they tried “competed with Bolero with flavour,”
    David says, “but the yield wasn’t quite there.” Bolero won.


    But David doesn’t seem defeated. “Seeds belong in the public domain,” he says.
    Most farmers haven’t been growing seeds for generations; this project is reintroducing
    the idea. “Like it takes seeds a community to raise kids, takes a community to
    raise seeds.”


    My first-ever attempt to grow carrots was a fall crop. I turned over a new bed,
    converting a patch of grass close to the house, and discovered it was part soil
    and part garbage fill—bits of old chicken bones, glass shards, an old aluminum
    can, rusty nails. I pressed onwards, seeding the new patch. What exactly happened
    next was lost to time and lack of experience. Did it rain too much? Was the soil
    poor? Did I bury the tiny seeds too deep?


    Soon, bits of green began to show in the bed. Initially excited, I soon realized
    it was grass that had somehow survived being uprooted, turned, and buried upside
    down.


    This year, I sowed three successions of Nantes carrots alongside some rainbow
    carrots leftover from the previous year, starting in early April, in a raised
    bed that I cultivate in the no-till style, top-dressing with compost or mulch
    once a year in the winter. There’s a mildly drizzled, happy-go-lucky small-scale
    farmer and vegetable gardening expert from Somerset, England, I''ve been watching
    on YouTube since we bought our house in 2019, Charles Dowding, whose advice about
    taproot vegetables I took to heart: “There is a growing understanding now how
    soil works and how soil life works, and we do not need to physically loosen soil
    in order for roots to go down and explore.” In another video, Dowding constructs
    a six-inch raised bed directly on top of grass, filling it with compost and sowing
    carrots. This is to show, Dowding says, that growing good carrots is possible
    in a fresh bed like this. Over time, I''ve learned to water the soil before sowing
    the carrots, not after, if the soil is dry; to not overseed; and to cover the
    seeds only very lightly with soil. If the soil is already wet and heavy, I cover
    the seeds with a lightweight soil mix designed for seedlings, so that they don''t
    get weighed down or buried.


    We began harvesting carrots in June and are still harvesting them in late December,
    as I write. Dowding’s advice was correct: the vast majority have grown strong
    and true, some deep into the part of the soil that was pretty recently grass through
    with creeping buttercup.


    My garden is not perfect; we haven''t managed to rout out all the bindweed, a
    close relative of morning glory, and a bunch of acorns birds dropped into the
    bed over the winter began sprouting up half a row of carrot plants as they were
    developing, meaning I needed to pull them and start over, as carrots do not like
    to be disturbed in their childhood or teenage years. But all this is normal—nothing
    in life is as perfect as an Instagram post, and in a home garden, even a shattered
    carrot, or split carrot, washed out, finds its place in your pot.


    In my second year of growing carrots, I began covering my carrot rows with netting.
    I drive pieces of rebar into the edges of the beds and arch half-inch PVC pipes
    from one piece of rebar across the bed to another. Then I drape insect netting
    over top and weigh it down at the sides of the bed with large rocks. This is to
    prevent carrot rust flies from laying their eggs in the carrots'' soil; if not
    prevented, the larva from the eggs burrow into the carrot roots, leaving grooves
    and tunnels and opening the carrot up to rot and disease. I also think it helps
    to retain a little bit of moisture in the soil while the seeds are germinating.


    In my, third or fourth year of growing them, I''ve managed to produce enough to
    harvest carrots weekly for over half the year—sending carrot sticks to school
    in my kid''s lunch, making carrot-based soups, harvesting some to take down to
    Vancouver at Christmas, making carrot cake. Cabbage and squash, two other hearty
    crops I like to grow, take up a lot of sprawling, leafy space. Carrots, babied
    and kept moist and covered in the beginning, are afterwards quite easy and space-efficient.
    And now, in particular after the frost, they''re as sweet and tender and crunchy
    as the carrots I ate so much of as a child that they began to turn my palms carotene-yellow.


    ## Harvest carrot and lentil soup


    ## Ingredients


    - 2 tablespoons vegetable or olive oil

    - 1 medium onion, diced

    - 1 knob of garlic, minced

    - 2 large carrots, sliced

    - 1 stalk celery, sliced

    - 1 cup red lentils, rinsed

    - 4 cups vegetable stock

    - 1 teaspoon cumin

    - 1/2 teaspoon cinnamon

    - 1/2 cup milk

    - Salt and pepper to taste


    ## Instructions


    1. Heat the oil in a large pot over medium heat. Add the onion and sauté until
    translucent, about 5 minutes.

    2. Add the carrots and celery, cooking for another 5-7 minutes.

    3. Stir in the cumin and cinnamon, cooking for 1 minute until fragrant.

    4. Add the lentils and vegetable stock. Bring to a boil, then reduce heat to low.
    Simmer for 20-25 minutes, or until the lentils are tender.

    5. Stir in the milk and heat through.

    6. Season with salt and pepper to taste before serving.


    ## on substitution


    In late July, as I write the first draft of this essay, the garden is entering
    its season of overwhelming abundance. My child, semi-feral by this point in the
    summer, headed outside this morning wearing an outfit she had selected, which
    consisted solely of underwear, socks, and sandals. She was heading out to play
    but also to pick and eat all the berries that are ripe and ripening: ever-bearing
    strawberries, blueberries, raspberries.


    The tomato plants are growing like weeds and bearing trusses of fruits—but they’re
    all green. The snap peas, gai lan, shallots, and garlic are finished. The peppers
    and eggplants aren’t yet bearing; the carrots and beets and broccoli are cropping
    in stages, and we’re in the middle of the harvest window for the first batch of
    kale, which I planted in the spring. This morning, it’s the cucumbers, green beans,
    and zucchini that are coming so fast and furious we can barely keep up with eating
    them.


    We’ll eat the green beans in recipes, like salad niço, that usually contain them;
    I’ll also shoehorn them into almost everything else, using them to replace things
    like water chestnuts (which I also replace with turnips from our CSA box) and
    snap peas. They’ll go into fried rice; they’ll go into soup; they’ll be sautéed
    in butter and eaten as a side. Whatever we don’t eat, I’ll blanch and freeze.
    The cucumbers, I’ll use to make a sort of dirt spa water—fresh slices and water
    refrigerated for a few hours in a large empty Adams peanut butter jar—and we’ll
    snack on and eat them in as many kinds of salad. The zucchini, everyone but me
    is picky about, disliking its texture; we eat it in fritters and shredded in.

