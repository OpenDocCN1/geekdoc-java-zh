    # the failure of the peppers


    On a warm summer day, I bike to Blueberry Commons, where I’ve been volunteering
    every Friday. At the end of the nine-kilometre ride, which features a forest trail
    and a somewhat punishing hill, I onto King Avenue. On this street, there are a
    number of professionally printed signs declaring their opposition to an application
    to rezone Blueberry Commons lots to allow for a cohousing project—and a few more
    signs, planted in the lawns of the wilder-looking houses, in support. Blueberry
    Commons farm is on one of conjoined lots; its new cohousing units are set to be
    built on a second lot that has stood fallow as a meadow for years. The street
    features a mix of small-scale agriculture and residential housing, like much of
    the Wildwood neighbourhood, located on the territory of the Tla’amin Nation in
    what is currently known as Powell River, B.C. The most of lots are large—maybe
    a half acre or an acre—and some, like Blueberry Commons, are even larger.


    This is the case for the farm’s closest neighbours, too; they have a horse paddock.
    When I look over to check out the horses, I do most on Fridays, I see a juvenile
    black bear in the paddock with them. The curious bear, rebuffed by a horse, turns
    its attention towards me. And in a blink, the bear is running in my direction.
    My first instinct—to pedal faster—is the wrong instinct. My second instinct is
    to dismount, stand behind the bike, clap my hands, and tell the bear it has to
    stop and turn around. The bear, looking dejected—it just wanted to investigate,
    maybe play—turns around and lopes off. When it’s safely gone, I get back on my
    bike and ride, this time'
