    About twenty-five people live on the farm year-round, including eleven children
    ranging in age from two to seventeen. The farmers grow food for the retreat groups
    that come to the farm, for their community, and to sell at the farm stand. Unlike
    a lot of other market garden farms, they also grow seeds for seed production.


    The farm comprises about 120 acres in total, but the market garden is growing
    on an acre and a half of land that sits in a low valley. This geography influences
    where crops are planted; a low mist comes in the fall, Meghan says, making the
    area wetter and a bit colder. The hill, on the other hand, stays warmer and drier
    in the early spring and fall, so this is where they tend to grow plants destined
    for seed saving. There are pollinator beds planted around the food beds. In one
    area that Lisa has planted, redwing blackbirds are taking turns swooping in and
    harvesting seeds from a row of sunflowers.


    They''re intentional about which crops they grow for purposes, Meghan says. For
    the farm store, they choose quick succession crops, like greens, that are ready
    to harvest in under seventy days. Crops like potatoes, squash, and onions, which
    take much longer to grow and ripen, are grown just for the community.


    It''s warm enough this October that tomatoes, eggplant, peppers, and basil remain
    in unheated hoop houses; fall crops like lettuce have now been planted at the
    base of the tomatoes and will continue growing after the tomatoes are taken out
    when it gets too cold for them. I try an herb I''ve never tried before, called
    tuls. The leaves taste a bit sweet, a minty.


    Meghan is carrying paper bags. In one field, we stop to harvest seeds from a Salvius
    romaine lettuce. We place the paper bags over the seed heads, bend the stalk of
    the plant, and shake. The seeds, surrounded by cottony fluff, flutter to the bottom
    of the bag.'
  - '[PAGE 70]


    Meghan points out some leeks growing—Lancia and Darcy’s Purple. Eventually, she’ll
    select the ones she wants to save and transplant them to the beginning of the
    row, to keep things tidy, concentrated, and easy to access.


    There are still lots of plants in the ground, but much has been harvested, and
    Stowel Lake is now readying for winter. The zucchini will be pulled soon; some
    beds will be mulched, and some will be tarped to keep the ground warmer and dryer
    for the crops to be planted in the spring.


    We end our tour on the hill that rises on the opposing side of the valley from
    the converted barn. There are beehives, taken care of a local beeper, Bruce. There
    are scarlet runner beans and bush beans. There are fruit and nut trees planted
    on a swale and berm system, contour, for water management: hazel, apple, pear,
    peach, cherry, and olive trees. And there’s a huge greenhouse—Lisa’s new dream,
    Meghan says. It’ll house subtropical trees, like citrus and avocado.


    Over the years, Meghan says, Lisa has developed the farm with an eye to beauty.
    To me, it feels like Stowel Lake’s seed saving is part of this: allowing plants
    to cycle all the way through their life stages instead of stopping them short
    also allows us to know them better, to pay a fuller kind of attention.


    Larger companies, like West Coast Seeds, get around the problems of climate and
    seasonality by sourcing seeds from regions where the plants reliably grow well.
    Skagit County in Washington State, for example, is one of only two major regions
    in the world for spinach seeds, according to Mark Macdonald, West Coast Seeds’
    former communications manager.'
  - '[PAGE 71]


    On a visit to Skagit County, Mark once visited a warehouse for spinach producers.
    “They had these wooden boxes, four foot by four foot by four foot,” he says. “And
    they’d be full of seeds. And there were ten of them tall, and fifty of them that
    way, and fifty of them that way. And that wasn’t for one hundred years. That was
    for this season’s spinach production. That’s producing most of the world’s spinach
    seeds.


    “Many of us source from the same farm,” Mark says. “And when those plants are
    ready to harvest the seeds, the farmers go out with their equipment and fill trucks,
    and the trucks line up for miles.”


    There’s a stark difference between the scale of this type of spinach operation
    and what I saw at Stowel Lake, which saves seeds for their growing purposes, as
    well as to package and sell through Salt Spring Seeds. The scale of the operation
    that West Coast Seeds taps into allows them to provide a massive amount of non-GMO,
    non-chemically-treated hybrid and open-pollinated seeds reliably every year.


    But growing seeds out through smaller-scale farms and via home growers, in conditions
    plant varieties find less than optimal, also forms a key part of long-term sustainability
    and food security plans.


    Dan Jason, owner of Salt Spring Seeds and author of *Saving Seeds: A Home Gardener’s
    Guide to Preserving Plant Diversity*, first to got seed saving and selling as
    an extension of his interest in practising self-sustaining, bioregional growing.
    His perspective on dealing with climate conditions and diseases that make seed
    harvesting more difficult the long view.


    “It’s about navigating and taking advantage of situations that somebody would
    look at as bad news,” he says. “One year that I grew three hundred different kinds
    of tomatoes, there was a very bad blight. And a couple of tomato varieties survived
    it. So there you go: there’s your opportunity to save blight-resistant tomatoes.
    That’s a great opportunity.”'
  - '[PAGE 72]


    Next to Dan Jason himself, Stowal Lake is the largest grower for Salt Seeds. For
    seeds, they grow out three types of leeks; four types of beans; herbs like cilantro,
    parsley, and dill; greens like arugula, mustard, kale, spinach, and twenty varieties
    of lettuce; three kinds of peppers; peas; beets; radishes; two kinds of squash;
    and ten kinds of tomatoes.


    “It’s quite an orchestra,” Meghan says. For each open-pollinated variety, Meghan
    tries to grow at least eighty plants in order to keep the genetic diversity healthy.
    When she grows the plants for seed, she tries to balance the conditions she knows
    the plant prefers with those that are naturally available on the farm.


    “We are looking at a climate reality where we are going to be struggling with
    drought in the future,” Meghan says. “So it’s crucial to see that we are working
    to grow seed that doesn’t need as much water. Each year, we’re really selecting
    and looking for those traits that survive those kinds of climatic conditions.”


    In practice, this means she’s experimenting with growing approaches. For the second
    year in a row, she’s ensuring spring-sowed seeds for crops destined for seed saving
    are given water to establish themselves in the spring but are not watered in the
    summer. “One of the varieties of lettuce did not develop seed because of that,”
    she says. “Others did.”


    Within a variety, Meghan then zeroes in on which individual plants were most successful.
    “You’re selecting done really well, this one hasn’t.” Saving the seeds from that
    plant, she hopes, will help develop adaptability in the next years’ crops.


    The importance of home growers to seed saving and seed diversity movements has
    also seen a recent resurgence. Seeds of Diversity, for example, a thousand members
    coast to coast in Canada. Its seed library boasts over 2,900 regionally adapted
    and rare seed varieties; volunteer members grow out and multiply these seeds each
    year, helping to secure'
  - '[PAGE 73]


    these varieties’ futures. They also hold events called Seedy Saturdays, where
    home growers can share seeds and get seeds from other growers in their area—a
    way to try out new varieties with no cost outlay whatsoever.


    Home growers don’t often have the space to grow out dozens of examples of each
    plant, as Meghan might at Stow Lake, but they do have the freedom to grow varieties
    that may not be as commercially viable, productive, or that have a smaller niche
    of people who prefer their characteristics. And this can lead to situations like
    Dan Jason saw with his blighted tomatoes—a surprising underdog variety can pull
    ahead in circumstances more popular varieties find too challenging.


    When it comes to seed saving, both volume and diversity are important to ensuring
    food security in a changing climate; large farms, small farms, and home growers
    all have key roles to play.


    While I’m on Salt Spring, I visit Dan Jason’s farm too. The timing is not ideal;
    I haven’t had cell service, and our plans were only tentative. But Meghan is heading
    over to drop off seeds (we packaged some French Breakfast radish and Amish pea
    seeds when I visited the farm, as we were chatting), and I catch a ride. “It’s
    not the time to talk about saving,” he says when I arrive. “It’s time to do the
    seed saving.


    But he indulges in a farm tour, and though I feel slightly guilty for imposing
    on a busy time of year, I’m grateful to see his seed cleaning and seed drying
    set-ups. In addition to writing about seeds and running Salt Spring Seeds, Dan
    is also the president of the Salt Spring Seed Sanctuary. He still does everything
    related to seed saving by hand; for large seeds like beans, he uses a threshing
    box and an air compressor to blow off chaff. For smaller, lighter seeds, he uses
    seed-cleaning screens.'
