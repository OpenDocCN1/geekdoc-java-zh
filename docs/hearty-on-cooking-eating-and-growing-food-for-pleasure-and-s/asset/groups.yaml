    In this attempt, I make two batches. The first, the same as before with more macaronage
    and a longer rest time. The second, using two grams less aquafaba, because I''m
    curious if the moisture held in the ingredients our damp climate has been throwing
    things off. For the second batch, I also make some mini macarons, wondering if
    a smaller size will help.


    The first batch, all like my previous batches, is curiously ridged. The second
    batch, with slightly less aquafaba and taken to the ribbon stage, finally pipes
    like a proper macaron. Unlike the others, it also looks like a proper macaron
    on the Silpat. I leave both batches to rest and develop a skin for an hour. But
    both batches have the same hollow shell, exploded feet, gooey hellhole centre
    I''ve had since the beginning.


    Today, I''m making the macarons (or, to use the parlance of those in the macaron
    community, macawrongs), I de clean my kitchen and make jamalaya for dinner. My
    best friend, Kim, says that when you bake, you still also have to cook. And when
    you fail at cooking, you still typically have something edible, something that
    sustain you and that you never have to think about again. But baking offers us
