    西葫芦渍酱和西葫芦面包。（我们还会把它和豆子、切丝胡萝卜和羽衣甘一起冷冻——作为冬天的炒饭料。）


    我在这种富足中茁成长。但是贫穷和匮乏教会了我如何生存：学会了理解任何食谱中每种食材起着什么作用，以及这些食材如何被替换、减少或完全省略。因为我生命中最令我满意的餐点往往始于一个问题：我缺少某种食材，或者在我想做的道菜中，我不吃、不能吃、或买不起某种食材。


    替代可以很简单，比如在烘烤的芝士通心粉面上压碎咸味土豆片代替面包屑；也可以更复杂，例如使用无麸面粉混合物、黄原胶和普西壳胶来制成无麸面酥饼皮。这需要理解何时建议将胡萝卜换成南瓜或红薯，以及何时不宜。当一种食材对质地或风味、脂肪或酸产生贡献时；以及食材在次要功能上的作用（如果有的话——比如使另一种关键食材更佳，或增加所需的泥土香气）。


    这就是为什么我对“好厨师”的定义并不一定取决于一个人烤羊肉或煎牛排的水平有多高。相反，我的定义核心在于厨师分析食谱并对其调整的能力如何——无论是为了制作出一道新菜谱，还是根据现有的任何食材制作出一道类似的菜肴。


    > “我们无法否认当前的新冠肺炎疫情与大萧条之间的相似之处，”烘焙师 B. Dylan Hollis 在 2021 年告诉 Food52，“我们中的许多人仍然被困在室内，资金短缺，而在公共场所用餐的阻碍迫使我们回到厨房，并将其视为一个比以往任何时候都更有创造和维持意义的地方。制作历史食谱是体验过去最有趣且引人入胜的方式之一，通过这种方式：理解我们当下的位置。”


    Hollis 最近在 TikTok 上制作了一个“水派”。这个食谱需要饼皮、水、糖、面粉、香草精和黄油，它是新冠疫情前一年半流传的几种萧条时代食谱之一，随后北美大部分健康机构耸了耸肩宣布疫情结束，一切都“回到正轨”。


    人们还制作了花生酱面包、堆肥汤、蒲公英沙拉和酸酸面包；他们与祖父母交谈，向过去寻求避免食物浪费和廉价饮食的建议。蔬菜园艺活动激增，回到了第二次世界大战时期的胜利氛围。人们购买量巨大，导致某些公司面临短缺。其他公司，如
    West Coast Seeds，其包装种子的速度跟不上需求，尽管他们到 2021 年已经将生产能力翻了一番。尽管当时大多数文章关注种子，但家庭园艺相关的一切供应都超过了需求。例如，获得优质且价格适中的粪肥或堆肥变得异常激烈，这形成了一个获取牛粪、马粪和羊驼粪的私下信息网络。


    2022 年，这种热潮消退了。“今年，我们看到了更大的稳定性，园和种植者恢复了正常的购买模式，创造了一个非常受欢迎的平台期，”West Coast Seeds
    营销经理 Elizabeth Clark 说道；而一些新园艺者继续着他们在疫情期间养成的习惯，另一些人则回到了以前的习惯。这很合理：蔬菜园艺需要大量的耐心、时间和规划。烹饪也是如此。要求个人在每周至少工作
    40 小时、通勤并担任孩子、朋友或亲人的照顾者的同时，去抵消食品生产的工业化是不现实的；每个人为了付清账单已经很忙了。但 Clark 也告诉我，需求依然强劲，许多人继续“从种子种植食物，作为环境可持续和粮食安全生活方式的一部分”。当然，这引起了我的共鸣。但随着通胀挤压食品预算，政府不再缓解疫情的影响的影响，社会援助水平几十年来也没有跟上，增加最多的是食品银行的使用，而非蔬菜园艺。


    疫情来袭时，我已经在经常种菜和烹饪了，而且在没钱饥饿时花过足够的时间制作现在所谓的“苦难餐”，以至于我并没有真正的兴趣去看萧条时代的食谱。不过，我确实开始更多地烘焙，并花时间制作更复杂的食物。我在厨立式搅拌器打折一半时买了一个苹果绿色的，最后——我为什么以前没早点买？——一个数字温度计。我学会了制作冰淇淋、无麸面起泡酥和瑞士蛋白糖奶油霜。渴望吃巴拉克拉瓦（Baklava），我自己制作了酥饼皮。但直到我听到《盐、肥、酸、热》一书作者
    Samin Nosrat 在她限期推出的播客节目 *Home Cooking* 中谈论食物，我才意识到多年年来我在食物和烹饪上实际上学到了多少——比我意识到的要多，而且在很大程度上，这与我最近制作完美焦糖奶奶的能力无关。


    Nosrat 在 *Home Cooking* 中做的一部分工作是根据人们冰箱、冷冻室和储藏柜里的食材，提供多种传统的饮食选择——同时提供储备冰箱、冷冻室和储藏柜的方法，让家庭厨师能够在饮食中创造多样性。正如此，Nosrat
    很少提供单一的食谱。


    在首节目中，她根据人们冰箱、冷冻室和储藏柜里的食材，提供多种传统的饮食选择——同时提供储备冰箱、冷冻室和储藏柜的方法，让家庭厨师能够在饮食中创造多样性。正如此，Nosrat
    很少提供单一的食谱。（注：此处原文后续内容为大量重复，已略去）

