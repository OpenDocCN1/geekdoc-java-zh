    - 烘焙盘

    - 烘焙纸

    - 打蛋器

    - 中号厚底锅

    - 中号细网滤

    - 食用温度计（可选，但很有帮助）

    - 冰淇淋机（可选，但很有帮助）


    ## 材料


    ### 焦糖碱水结


    - 280克（10盎司）碱水结（或无麸碱水结）

    - 55克（2盎司）奶粉

    - 4汤匙糖

    - 185克（6.5盎司）无盐黄油，融化


    ### 碱水浸味牛奶


    - 4 杯全脂牛奶

    - 焦糖碱水结


    ## 用于碱水浸味冰淇淋（约制作3.5杯）


    - 1 杯淡奶油

    - 1 杯碱水浸味牛奶

    - 1/2 杯（100克）糖

    - 1/4 茶匙盐

    - 1 茶匙香草提取液

    - 4 大蛋黄

    - 一小把碎碱水结，用于装饰


    ## 如何制作焦糖碱水结


    1. 将烤箱预热至275°F (135°C)。将碱水结放入食物处理器、搅拌机或干净的研钵棒中，将其碎成如豌豆大小或更小的碎末。


    2. 在另一个碗中混合奶粉和糖。搅拌均匀。加入融化的黄油。搅拌均匀。加入碎碱水结并充分混合。


    3. 将混合物铺在垫了烘焙纸的烘焙盘上，烘烤至碎碱水结焦糖化，约需要35分钟。取出并冷却至室温。


    ## 如何制作碱水浸味牛奶


    1. 将焦糖碱水结和牛奶放入大号混合碗中，浸泡一小时。通过细网筛过滤牛奶，挤压碱水结以提取牛奶。清洗滤网。再次将滤液过滤到另一个干净的碗中；这次不要按压或挤榨任何东西。


    ## 如何制作碱水浸味冰淇淋


    1. 将淡奶油倒入中碗中并放入冷藏。

    2. 将碱水浸味牛奶、糖、盐和香草提取液放入小锅中，用中火加热至混合物开始冒热气。

    3. 与此同时，在中号碗中用打蛋器搅拌蛋黄。在不断搅拌的同时，将热的牛奶混合液缓慢倒入蛋黄中。置于中火上搅拌直到蛋乳酱达到170°F (77°C)。如果没有温度计，它的质地应该厚到能裹住勺背。

    4. 将蛋乳酱通过滤网倒入冷藏的淡奶油中并搅拌均匀。

    5. 将混合物冷藏一夜，然后用冰淇淋机搅拌你的冰淇淋基底。或使用烘焙盘和打蛋器进行DIY。

    6. 撒一些碎碱水结作为装饰即可。


    ## 烤芙（S’mores）冰淇淋


    基底改编自 Melissa Clark 的《纽约时报》大师冰淇淋配方


    制作这种冰淇淋最简单的方法分两天。第一天制作基底并用融化的巧克力包裹格汉饼干。第二天，用火枪烤小棉花糖，将巧克力裹格汉饼干从硅胶垫上取下，搅拌冰淇淋，并将所有食材混合在一起。


    ## 工具


    - 硅胶垫 (Silpat)

    - 食用火枪

    - 打蛋器

    - 小混合碗

    - 中号混合碗

    - 大混合碗

    - 中号厚底锅

    - 中号细网滤

    - 食用温度计（可选，但很有帮助）

    - 冰淇淋机（可选，但很有帮助）


    ## 材料


    ### 冰淇淋基底


    - 170克（6盎司）半甜烘焙巧克力

    - 3汤匙可可粉

    - 1 1/2 杯全脂牛奶

    - 3/4 杯糖

    - 一小撮盐

    - 6 个蛋黄

    - 3/4 杯酸奶油

    - 1 茶匙香草提取液


    ### 添加料


    - 200克（7盎司）小棉花糖

    - 100克（3.5盎司）格汉饼干（如果使用无麸质，我推荐 Schär 无麸质蜂蜜 Honeygrams）

    - 170克（6盎司）烘焙巧克力


    1. 将半甜烘焙巧克力切碎、刨片，放入小混合碗中。

    2. 在中号厚底锅中，将奶油和可可粉加热至微沸并不断搅拌。热后，将其淋在巧克力上，在碗上盖上干净的茶巾，置在一旁备。

    3. 将六个蛋黄放入中号混合碗中。搅拌均匀并备用。

    4. （注：OCR文本此处重复了步骤，遵循逻辑流如下）：

    4. 将碱水浸味牛奶、糖、盐和香草提取液放入小锅中，用中火加热至混合物开始冒热气。

    5. 与此同时，在中号碗中用打蛋器搅拌蛋黄。在不断搅拌的同时，将热的牛奶混合液缓慢倒入蛋黄中。置于中火上搅拌直到蛋乳酱达到170°F (77°C)。如果没有温度计，它的质地应该厚到能裹住勺背。

    6. 将蛋乳酱通过滤网倒入冷藏的淡奶油中并搅拌均匀。

    7. 将混合物冷藏一夜，然后用冰淇淋机搅拌你的冰淇淋基底。或使用烘焙盘和打蛋器进行DIY。

    8. 撒一些碎碱水结作为装饰即可。

    9. 当冰淇淋完成后，将它盛入容器中，分层加入添加料。

    10. 使用木勺轻轻混合。

    11. 放入冷冻室结几小时以凝固。


