    Still, they seem promising as a second attempt. We let them rest for fifty minutes
    on the counter, until the vast majority feel dry to the touch—no batter comes
    away on my fingertip when I press them lightly. In climates that are not as punishingly
    moist as ours, this step takes half as long.


    I put them into the oven at 250 Fahrenheit for twenty minutes, rotating every
    five minutes. They rise and get a foot—the little band of waffly ridges at the
    base of the cookie. And then too large a foot: worstisome.


    These shells end up completely hollow and fragile: another fail. We eat some of
    them, and I send Nola home with the lemon curd and a jar of broken macaron shards.


    I have gathered some ideas for the next try: longer rest, lower temperature, and
    slightly more mixing, but just slightly.


