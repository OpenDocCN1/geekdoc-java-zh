    After I left Curry, the Spins Family Board game continued on as Family Social,
    adding new mini games like BLUT (Believable Lie or Unbelievable Truth) and feats
    of strength. Ali rented a house with her brother and cousin, and it had an open-door
    policy, and I was there a lot. We fed each other, ran errands together, did the
    crossword, spent too much money, remained chronically broke.


    I got a job in communications after I graduated, broke up with my partner, and
    then got an additional part-time job in another kitchen. Eventually, most of us
    who worked at Curry found our way out of the hot, humid environment of kitchens
    altogether—into trades, into horticulture, into publishing. It wasn''t a linear
    path for me, and when I moved across the country a couple years later, I shed
    everything that connected me to Guelph, as much of it felt too painful to hold
    on.


    Today, I keep the option of food service tucked away in my mind as if-everything-goes-wrong-plan
    C. When I couldn''t bother dressing myself, when I was at my most unwell, I could
    still work in a kitchen. I placed food at the top of my pyramid of needs, jettisoning
    much of what most other people considered necessary and retaining it well after
    I let other basic daily requirements fall through the cracks.


    Even now, when I''m so depressed to talk or think or do anything, as I intermittently
    during the writing of this book—in summer and fall 2022, when my brain feels like
    it''s stripped of serotonin, and my body of energy and affect—I can still cook.
    I cook when I''m so exhausted that I need to take breaks to lie down while things
    are in the oven. When the harvest starts in the garden, and it takes me two hours
    to pull a simple sentence out of myself, I can prep and cook and bake all day.
    I listen to audiobooks and reach a kind of effortless peace.


    This is in part to the small but satisfying achievement of taking disparate ingredients
    and turning them into a meal. But it''s also because the people I’ve worked with
    in kitchens have allowed me to be myself, nowhere more than at Curry.


    Revisiting my memories, I want to revisit the food too. For the first time in
    years, I make yogurt at home. I buy a bunch of onions and a jug of oil, and mix
    the batter for bhajis. I let the oil get hot in an enamelled cast iron pot fitted
    with a thermometer. The feeling of the batter on my hands as I incorporate the
    onions is as familiar as Ali’s voice was on the phone. When I drop the bhajis
    into the oil, working quickly, I watch and listen, satisfied, as hundreds of tiny
    steam bubbles froth to the surface. My kitchen fills with the smell of frying
    onions, cumin, chickpea flour.


    The act of making them conjures the past. And when I dip a bhaji in tamarind chutney
    and take a bite, it feels as if I am bringing a small piece of my former self
    forward in time and offering it the unconditional acceptance my co-workers offered
    me when I wasn’t able to offer it to myself.


    # consider the carrot


    When I was a child, my family tells me, I ate so many carrots straight from my
    grandfather’s garden that my palms started to turn yellow. My brother and I were
    dropped off at my grandparents’ house every weekday morning in the summers when
    we were in elementary and middle school. Every year, my granddad rototilled an
    eighth-of-an-acre patch in their backyard, adding asparagus, zucchini, tomatoes,
    lettuce, carrots, leeks, strawberries. They had a plum tree and a pear tree, under
    which some of our family photos were taken over the years. If my nana was watching,
    we’d run the carrots under the water of the hose at the back of the house. If
    she wasn''t, my grandfather would gesture at me to brush the dirt off my pant
    leg.


    The carrots we ate inside, at lunch, but were still carrots from the garden, but
    they were carrots my nana had peeled, cut into sticks, and placed into a glass
    with water in the bottom to keep them fresh. This glass also usually contained
    celery and cucumber. In a rectangular Tupperware fitted with a plastic screen
    at the bottom, she kept the as-yet-uncut backup vegetables, wrapped in damp paper
    towels.


    At the time—still—I loved rabbits, who ate everything in the garden, leaving little
    nibbling bites on the lettuce. My grandfather often threatened to purchase a pellet
    gun to show the rabbits what was what. Rabbit stew! he’d yell. You’ll be rabbit
    stew! And I''d protest, and my nana would say, Phil! And the rabbits and their
    sets of four ever-growing teeth would live on, feasting.


    As I got older, carrots became a different kind of cornerstone in my life. When
    I first moved away from my childhood home, my parents weren’t able to help me
    financially, and I didn’t want to ask my grandparents, who were, guessed, already
    helping my parents; student loans, after tuition, left me about five thousand
    dollars a year to supplement my earnings from the part-time jobs I worked while
    going to school full-time. The first year was rough, but the following years were
    worse—my grip on stability loosened further after I was diagnosed bipolar at eighteen.
    It felt like a feat to survive, and looking back, I’m not sure how I did.


    My friend Jane and I shopped at the No Frills together, which was a city ride
    away. Our staples were eggs, tinned of beans and diced tomatoes, oatmeal, potatoes,
    rice, pasta, beans and pulses, carrots, apples, and bananas. These carrots were
    not like the carrots my grandfather had grown. These carrots have peels that had
    gone pale with age. Raw, they were bit bland, and bit hard on the jaw. Cooked,
    they added bulk to pastas, and soups. The memory of carrying carrots in bright
    yellow bags, is as bright and consistent as the memory of my grandfather showing
    me how to grow them straight and true. I guess what I’m saying is that carrots
    have range. Carrots are in the parsley family. They’re biennial plants, meaning
    they flower in their second year, and their pollination is assisted by insects
    like bees, hoverflies, houseflies, and bluebottles. If you let them flower and
    go to seed, they look remarkably like Queen Anne’s lace: clusters of tiny white
    flowers radiate out from small stalks in an umbel pattern.


    Carrot seeds, Dan Jason, author of Saving Seeds and owner of Salt Spring Seeds,
    are very easy to harvest. The flower plant sends up in its second year carries
    hundreds of tiny, easily seeds. To collect them, you just need to place a paper
    bag over the flower head and shake until the seeds rain into it.


    > The hard thing is to make sure the seed is pure,” Dan says. The conventional
    wisdom says that if you live within a mile or so of a plant, it’s difficult to
    grow carrots for seed. If you try, they can end up cross-pollinating. In Washington
    State, Queen Anne’s lace is classified as a class B noxious weed, and it’s prohibited
    to sell or transport its seeds. Frankly, there’s no Queen Anne’s lace in the valley
    where his farm is located, and so he’s safe to save carrot seeds.


    The taproots of Queen Anne’s lace, technically edible when they’re very small
    and young, become woody and bitter as the plant matures. If you pick Queen Anne’s
    lace or brush it with your hand, it smells temptingly carrot. But if your carrots
    cross-pollinate, they’ll most likely pick the traits they want in carrots (toughness,
    woodiness, bitterness).


    David Schatz, the BC Seed Security Program manager for FarmFol CityFolk, tells
    me that carrot seed saving is slightly more complicated than distance between
    carrots and Queen Anne’s lace. The insects that pollinate both plants, he says,
