    用月桂树和绳子或剩余的围栏，为南瓜、甜瓜、黄瓜和豆类搭建了架子。西北角留出了一小片草地，足够足够放下我们的野餐桌和夏天摆起来的小戏水池。那里有一片芦笋地和一个香草园，一棵樱桃树和两棵苹果树，几株结着醋栗和蓝莓的灌木，以及一片草莓地。我们的圆顶房和温室。


    前院有一棵巨大的蓝云杉，当 Will 的树木和灌木成熟到符合他对庭院的愿景时，它们会被移到成形状的花床中，以适应轻微的坡度和空间形状。前院没有鹿围栏，那些最脆弱的植物，比如我们从岛上苗圃豪掷购买的银杏，用小小的金属围栏柱固定起来；而一株小斑叶月桂，则被罩在一个倒扣的鸟笼下，那个鸟笼某天出现在邻居家车库前的路边上。


    我们住在这栋房子里，几乎保持着买来时那种杂乱无章的状态——但花园，我们改变了它。仍在改变中。


    我们每年春天最早的任务之一就是撒粪肥或堆肥，用推车运到花床上。现在六岁的 Sinclair 从会走路起就一直在协助这项工作。2020年，她才两岁时，用的是一个小塑料铲子。到了2021年，她已经用上了自己的真小铲子，那是朋友送给她的礼物。


    新冠的第一个春天，Sinclair 和我在后院一起挖草皮，为蔓生性南瓜开辟新床。我每天都听新闻。画面上显示有冷藏车停在纽约医院停房室后面。李文亮，那位察觉到某种被他识别为新
    SARS 类似病毒出现、并警示了其他医生的吹哨士，在自己感染新冠后去世了。人们躲在自己的公寓里。每个人都在谈论维持性工作。


    纪录片《诺克斯山医院》播出了一集大流行特别节目，带观众进入医院内部，目睹医护人员如何苦苦应对护理新冠患者的强度节奏和要求——他们哭泣，下班时脸部通红，留满了由个人防护装备（PPE）勒出的压痕和皱纹。


    在北部的阳光海岸，远离疫情最初的主要中心地，我们专注于打理花园。当我们铲着土时，Sinclair 用她两岁的小嘴嘟囔着“coronavirus”（冠状病毒）这个词，在清新的空气和阳光中一遍又一遍重复。


    那个春天，随着消息的恶化和我们日益加剧的焦虑，芽和花朵成对出现。但花园提供了希望。一种实实的未来愿景。我们用雪杉板架了高床，铺了蘑菇粪，种了第一批甜豌豆。菜花和石楠在早春灰蒙色的天空下增添了色彩；蓝莓花开后结出了蓝莓；微小的西兰花苗随后长出了叶子和食用花序的爆发。花园里的一切都显得很有意义，充满生命力。


    第二个大流行春天很不同。随着希望之火的熄灭，我们在花园里早期的准备工作揭示了去年的困难。我的奶奶去世了，我没能回家参加她的葬礼。我感到无法哀悼，仿佛给生命按了暂停键，花园持续的季节律动并未完全解脱。待在户外处理春季任务仍然感觉很好，但意义变得不同了——染杂了悲伤、挫败和虚无主义。


    我并不孤单。当《蜜蜂的胜利花园》的作者 Lori Weidenhammer 在萨斯喀彻彻省长大时，她度过的每个冬天都在看种子目录，想着下个季节要种什么。在她的现在生活的温哥华，有一个习语为她标记着季节的开始：“当迎翘花开时，就是修剪玫瑰的时候。”


    但 2020 年的事件复杂了她与 2021 年春季园艺希望的关系。“昨天我在这丛醋栗丛旁户外运动，去年此时我我也在这里运动，那时正是封锁的开始，所以它触发了所有这些糟糕、糟糕的情感，”她告诉我。


    第三和第四个大流行春天带来了它们自己的教训。随着我花更多精力关注 Instagram 上的农耕、园艺和自给自足生活方面——我总在春天学习和成长——算法开始向我推送预备者，以及那些不相信牛奶杀菌但相信水浴罐罐头的人的内容。那些对政府的疫苗、数字银行以及显然对肉毒杆菌不信任的人。这令人沮郁，让我焦虑得胃翻倒海。


    与此同时，2023 年干旱持续。我社区里的雪杉变褐枯萎。山火霾早早降临。我们勤地浇了一半花园的水，但用喷淋器，这样才能跟上它的需求。对于花园的另一半，我使用去年从当地农场剩下的滴线为番茄、南瓜、甜瓜、黄瓜和西芹建立灌溉。我的朋友
    Jen 帮我规划并计算完成系统所需的硬件；我们在网上订了一些，在当地的 Rona 买了一些，Will 最后又去了一趟 Pete’s Plumbing 买了一些我们将作为主管的
    PVC 管。


    经常，我感觉自己仿佛漂浮在身体上方。尽管如此当我打开龙头开始晨间浇水，或者轻柔、有节奏地摘下一颗豌豆或一朵洋菊花时，照顾花园需求的律动让我找回了自我。


    春天提醒着我，生命是循环的，而非线性的。

