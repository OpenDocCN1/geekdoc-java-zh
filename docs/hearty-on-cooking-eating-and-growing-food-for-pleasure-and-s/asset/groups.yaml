    1. 将烤箱预热至 375°F (190°C)。在煎锅中加热油（或者，如果你有铸铁锅，可以直接把整个锅放入预热好的烤箱）。加入洋葱、芹菜和胡萝卜，炒约5分钟后加入大蒜。

    2. 与此同时，烧一大锅水。将土豆去皮并切成大块，放入水水中煮至叉子易软——大约15分钟。

    3. 在你的洋葱、芹菜和胡萝卜中加入扁豆、普罗旺斯草和高汤。当混合物开始沸腾时，转至小火，煮至土豆煮熟。

    4. 当土豆准备好后，将冷冻玉米和豌豆加入底中。如果你使用的是非烤箱锅，将混合物转移到烤碗中。

    5. 制作土豆泥：沥水分；使用土豆压泥；加入黄油、酸奶油、少许牛奶、盐和胡椒；搅拌均匀。

    6. 将土豆泥铺在底上。用勺子或铲子抹平，直到完全覆盖。用叉子在土豆泥上划出一排行。

    7. 放入预热好的烤箱，在 375°F (190°C) 下烤30分钟。土豆泥的顶部应该变得焦黄酥脆，底座应该冒泡。


    ## 扁豆饼


    ## 配料


    - 煎用黄油或油

    - 1 个大胡萝卜，丁

    - 1 个中洋葱，丁

    - 2 根芹菜，丁

    - 3至5 瓣蒜，末

    - 1 个大褐豆（或2个中等土豆），切成小块

    - 1/2 杯烤荞麦

    - 3/4 杯干红扁豆

    - 2 杯蔬菜汤

    - 1 汤匙普罗旺斯草

    - 1/4 杯营养酵母

    - 1/2 杯冷冻玉米

    - 1/2 杯冷冻豌豆

    - 盐和胡椒

    - 面包碎（可选）


    1. 将烤箱预热至 400°F (200°C)。

    2. 在煎锅或烤箱安全的锅中，用黄油或油炒洋葱、胡萝卜和芹菜约7分钟；加入大蒜和土豆。加入盐和胡椒调味。

    3. 再过几分钟，加入扁豆、荞麦、普罗旺斯草和蔬菜汤。开火煮沸，频繁搅拌。

    4. 转小火慢炖30到40分钟，直到液体吸收且扁豆和荞麦煮熟。

    5. 加入营养酵母、冷冻玉米和豌豆。搅拌均匀。尝试；根据需要加入更多盐、胡椒和营养酵母。

    6. 如果你使用的是煎锅，将内容倒入饼模并放入烤箱。如果你使用的是烤箱安全的容器，直接放入烤箱。如果你喜欢，可以在入烤前撒上面包碎。

    7. 在 400°F (200°C) 下烤30分钟。


    ## 多尔芬土豆球 (Pommes dauphine)


    改编自 *Serious Eats* 的 Kristina Razon 食谱。


    与书中的其他食谱不同，这个需要一些时间。大约1小时40分钟——如果你在同时准备晚餐的不同元素，可能需要2小时。


    这个由 *Serious Eats* 改编食谱精妙之处在于，它要求低淀粉土豆，并通过特定步骤进一步减少淀粉和水分。这带来了非常轻酥脆的效果。高淀粉土豆会导致口感更扎（但依然美味）。


    搭配肉汁以及任何你喜欢搭配肉汁的食物。多尔芬土豆球制作比较耗时，所以盘子里的其他元素保持简单比较好。（例如，我在开始多尔芬土豆之前就开始准备肉汁——这样它就可以留在炉台另一侧维持着，而我专注于土豆。）


    ## 工具


    - 大铸铁锅或油炸锅

    - 适用于油炸的温度计

    - 带搅拌桨的搅拌机（可选，但有更好）

    - 中号平底锅

    - 木勺

    - 铲子

    - 大碗

    - 削皮刀

    - 刀

    - 漏勺、滤网或炸勺


    ## 配料


    ### 泡芙面团 (choux pastry)


    - 1/2 杯牛奶

    - 3 汤匙（42克/1.5盎）无盐黄油

    - 一小撮盐

    - 1/4 杯加2 汤匙无麸质面粉（或64克/2.3盎）通用面粉）

    - 2 个室温大鸡蛋


    ### 土豆


    - 454克（两个或三个）大褐豆，去皮并切成块

    - 1 茶匙食盐

    - 2 汤匙（28克）无盐黄油

    - 黑胡椒


    ### 油炸及制作泡芙面团


    1. 在平底锅中，混合牛奶、黄油和盐。煮沸。

    2. 大火，倒入入面粉。用铲子用力搅拌直到形成一层皮。

    3. 离火，转移到带搅拌桨的搅拌机中。

    4. 搅拌混合物使其冷却。

    5. 逐个加入鸡蛋，搅拌直到面团变得光泽光滑。


    ### 制作多尔芬土豆球


    1. 在平底锅中，加入土豆块和水。煮至叉子易软。

    2. 沥水并冲洗土豆直到水变清。

    3. 将土豆压入大碗中。（你也可以用叉子压，但压泥能保持口感轻松。）

    4. 拌入融化的黄油和胡椒。

    5. 将泡芙面团折入土豆中直到混合均匀。

    6. 在锅中加入植物油或菜籽油，中火加热至340°F (170°C)。

    7. 用勺取一汤匙面团放入油中。重复直到锅中有十个球。

    8. 油炸3分半钟，直到金黄酥脆。


