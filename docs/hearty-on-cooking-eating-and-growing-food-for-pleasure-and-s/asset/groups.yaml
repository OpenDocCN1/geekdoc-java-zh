    In early winter, when the sun is rising at 8:16 a.m. in Powell River, it''s up
    at 6:42 about 2,500 kilometres south of the Imperial Valley. The valley is tucked
    into the very southeastern part of California, near the Mexican border to the
    south and the Arizonan border to the east. It would be desert if not for land
    speculators building a canal westward from the Colorado River in 1901. (It was
    a failure of this canal that created the now heavily polluted Salton Sea in 1905).
    A new canal, the All-American Canal, was constructed in the 1930s as part of the
    New Deal and delivering water to Imperial Valley in 1940. This canal runs miles
    (about 128 kilometres) from the Colorado in the east to the Imperial Valley in
    the west, relies on gravity, and has been the sole source of water to the area
    since 1942.


    Water drawn from the Colorado River has enabled farmers in the Imperial Valley
    to grow green crops like lettuce that otherwise wouldn''t grow well, if at all,
    in this climate. But drought and overreliance on the Colorado, which starts in
    the Rocky Mountains and runs southwest to the Gulf of California in Mexico, supplying
    irrigation and drinking water along the way, mean it''s drying up. Farmers in
    the Imperial Valley draw more water from the Colorado than the states of Arizona
    and Nevada together—and their senior water rights mean they''re legally entitled
    to do so. But as the river rises to disappear, these farmers are facing cutbacks;
    they need to give up 10 percent of their supply.


    The lettuce grown for the salad I''m eating in March was most likely sown in late
    October or early November. It likes the sandy, loamy soil of the desert. As it
    was either sown as pelleted seed—a seed encapsulated in clay, which makes it easier
    to handle—using a machine called a precision planter, or it was transplanted as
    seedlings in paper pots or little cubes of soil, using a different kind of machine.
    Both machines move effectively to cover a large terrain, which is helpful since
    the average farm in California is about 351 acres. This translates into the Vatican
    City three times over, or about 266 football fields. If you stand at the end of
    the row, it''s lettuce, lettuce, as far as the eye can see.


    After seeding, the lettuces are usually watered by sprinklers for the first five
    to seven days, until the seeds germinate and the seedlings emerge. Farmers then
    switch to furrow irrigation; the soil is depressed between the lettuce rows and
    those paths, or furrows, are flooded, watering the lettuce from the bottom and
    the side. In this arid environment, usually takes about three acre-feet, or 3,700
    cubic metres, of water per acre to grow leaf lettuce. To conserve water, some
    farmers are switching to drip line irrigation. (But something called like these
    don''t equal more water left in the watershed; farmers often use the savings to
    increase their irrigated crop area or grow more water-intensive production.)


    The soil is helped along by fertilization—as much as 250 pounds per acre of phosphorus
    pre-planting and between 200 and 250 pounds per acre of nitrogen via side-dressing
    when the lettuces have begun to grow. Conventional herbicides are sprayed to help
    control weeds; conventional pesticides are sprayed to help control insects, such
    as aphids, leaf miners, and the silverleaf whitefly.


    The lettuce destined for my salad grows slowly but surely through the winter and
    is ready to pick by early March, let''s say March 1. It''s chilly in the morning,
    around 9 degrees Celsius, and cloudy. By noon, it will hit a high of 17.


    The harvest itself is a carefully orchestrated agricultural ballet. I''ve never
    seen it in person, but it''s a whole niche genre on YouTube.


    A farm worker who goes by Chore Vlogs, for example, films a March day in his life
    working for Andrew Smith Company in Greenfield, California: he picks out a ball
    cap, makes some coffee to warm, catches a company bus to the field. “The landscape
    is beautiful,” he says in Spanish, arriving at the farm and training his camera
    in a slow circle, capturing the mountains ringing the fields. When it’s time to
    pick, about a dozen farm workers form production lines, bending, beheading the
    lettuce, and knocking off a few outer leaves beforeucking it into clear plastic
    bags affixed to a belt around their waists and placing it on the outstretched
    metal arms of a machine that is slowly inching across the field. Packers tape
    the bags closed and place the lettuces into black plastic crates and cardboard
    boxes and onto a conveyor belt, which runs down the centre of the machine, towards
    a truck.


