    # trifling


    Before I ever even thought of making Grandma Garcia''s trifle recipe, I found
    myself buying a crystal dish from a thrift store in my small town. A few weeks
    later, I saw an even ever better trifle dish. It had a metal rim and little triangles
    and ridges like the back of a stegosaurus. I bought it and unceremoniously red
    redonated the initial one I''d purchased, feeling only a mild twang of guilt.


    Once I was in possession of the nicer trifle dish, it seemed only right to ask
    my Grandma Garcia for her recipe, like the dish was willing the dessert into existence.
    I knew the trifle took my GG several days to make, and I knew she used booze to
    make it—both the trifle and the cake that she and my Granddad Ralph make at the
    holidays was boozy. I''ve eaten them since I was a child, but this was the first
    time I felt called to recreate them.


    Before my mid-twenties, I''m not sure I would have told someone, if they''d asked
    out of the blue, that I liked trifle. It''s composed of a basesponge cake and
    jam—I can take or leave; a layer of tinned fruit, usually mandarin oranges, which
    I like; a layer of Jell-O, which I don''t otherwise eat; a layer of vanilla custard,
    which I''d only otherwise eat if hospitalized; and some finishing layers of whipped
    cream and fresh fruit (no gripes about either of those).


    The year before Sinclair was born, Will and I were living in a tiny three-and-a-half
    in Little Italy in Montreal, and my paternal family were going to visit from Ontario
    for Thanksgiving, and my GG asked me what I''d like her to bring, I learned I
    missed her trifle exact second'
  - '[PAGE 155]


    blurted it out, thoughtlessly: “Trifle, please.” I tried to backtrack as soon
    as I said it. Not because I didn’t want trifle, but because I realized how selfish
