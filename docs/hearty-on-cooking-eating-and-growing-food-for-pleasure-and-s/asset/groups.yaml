    of foods, my reliance on almond milk and chia seeds and sunflower butter lessened,
    and I turned back to cow’s milk and peanut butter. Though I made a choice to eat
    meat, it remainedمرار in my diet than beans and eggs and tofu. Per-capita meat
    consumption in the U.S. comes in around 225 pounds per year, while I consume ten—other
    than a brief'
  - '[PAGE 22]


    while I was pregnant, anemic, and regularly purchasing off-cuts of beef from the
    butcher at Jean-Talon Market in Montreal.


    It will always be odd to me that cooks like Anthony Bourdain think this means
    I’ve rejected of “pure enjoyment of food.” Instead, it feels like I’ve worked
    double time to retain the joys of gluttony. I have to avoid gluten in order to
    remain well, so I’ve learned to bake and cook without it. I don’t eschew meat
    to eschew pleasure; pleasure is readily available elsewhere.


    +   * That is, essays and commentary—not cookbooks. There are a lot of great vegetarian
    cookbooks.


    +   ** One commonly used Adbusters image features a man with a large belly wearing
    suspenders. On a 2008 cover, issue 80, an iteration of this image is paired with
    the text “Freedom isn’t free. This is abuse of the freedom from want.” Another
    shows two headless bodies, both with large bellies—one fat, and one from famine—with
    the sarcastic cutline “No connection.” Issue 83 featured Henrichch Kimerling’s
    *American Beauty*—a photo of a fat woman wearing a bikini, surrounded by convenience
    foods—on a spread that reads “GLUTTONY” on the opposite page.'
  - '[PAGE 23]


    # two bags of lettuce


    After work on a Wednesday, Will and I coax Sinclair into a blue polka-dot fleece
    and boots head downtown. It’s spring warm and sunny, a cornflower-blue sky. We
    walk to Coastal Cookery, a local restaurant with a view of the Algerine Passage
    between Texada and Ahgyk Islands. The ocean is calm for this time of year—small
    waves, some with gentle whitecaps.


    Sinclair orders fish and chips and orange juice off the kid''s menu; Will, chicken
    and waffles and a beer. I usually get the ribs, which are fall-apart tender and
    with mashed potatoes and seasonal greens, but it feels more like a salad day.
    I get the backwoods greens and a Diet Coke.


    Our friend Clare is working, and we’re chatting when a runner brings out our food.
    My salad is stacked high on an oblong plate, a feast’s worth, the absolute pile
    of vegetation my body has been craving.


    When I eat this salad in March, executive chef Sean Hansen tells me, the restaurant
    stores its lettuce through the food distributor Sysco, which taps into the global
    supply chain to keep shelves and walk-ins stocked with produce, seafood, meat
    and poultry, dairy, and pantry staples year-round. To serve the west coast of
    Canada, in the late fall and winter, this lettuce is grown in Yuma, Arizona—one
    of the sunniest places in the world and the “winter lettuce capital of America,”
    according to Antonio De Loera-Burst, communications director for United Farm Workers—and
    in arid spots of Southern California, such as the Imperial Valley.'
  - '[PAGE 24]


    From June until October, the lettuce in this salad will come from Terra Nostra
    (“Our land,” in Italian), a farm located a ten-minute drive, or half-hour bike
    ride, down the road. It’s the farm where my friend Jen works alongside four or
    five or six other farmhands; Will and I have gotten community-supported agriculture
    (CSA) box from Terra Nostra for the past few years.


    Much of the reporting and writing done about ecologically friendly and equitable
    food has focused on small-scale local food with a sustainability focus, and I
    understand why: uses less fossil fuel to ship, farmers are more able to focus
    on soil health, and we are more easily to influence things on the local political
    level. If we want to get better labour conditions, or more stringent animal welfare
    rules, or concerned about runoff in a local creek, it’s theoretically easier to
    lobby, harangue, and gently encourage our neighbours.


    Moreover, as J.B. MacKinnon, co-author of The 100-Mile Diet, points out on a phone
    call, change is possible through consumer pressure on food systems in a way that
    isn’t quite as possible in other areas of our lives—because we eat about three
    times a day and spend so much of our money on what we eat.


    “The thing that ended up really actually blowing my mind about that experience
    was how dramatic an impact the local food movement had on the landscape,” he tells
    me, reflecting on what it was to try out the hundred-mile experiment just as the
    local eating movement took off.


    “It changed the way people were actually doing things and changed what people
    were growing in different areas in a way that was highly visible,” he says. “We
    saw a whole bunch of system-level changes, none of them revolutionary, but all
    of them, and especially all of them together, adding up to something pretty impressive.”'
  - '[PAGE 25]


    Small-scale farmers in the province have made great strides, but the reality is
    that the majority of what sustains most of us in the winter in Canada comes from
    elsewhere. In B.C., it is often California that is feeding us—a state that''s
    facing intense drought pressures on top of the usual caveats about conventional
    large-scale agriculture, such as the fact that oil and gas are running out, we''re
    facing fertilizer shortages, and agricultural greenhouse gas emissions in the
    U.S. and Canada account for about 11 percent and 10 percent of our annual output,
    respectively (not emissions from fossil fuel usage or fertilizer production).
    The labour conditions on large conventional farms are often abominable: labourers
    are frequently illegally paid piece rates that don''t add up to minimum wage,
    and agricultural employers are regularly cited for not following legally mandated
    rest breaks and for wage theft.


    For a long time, for anyone who''s been paying attention, it has felt like industrial
    food systems have been borrowing from the future—including labourers'' futures—and
    the necessarily heavy consequences are looming.


    Considering my heaping mound of greens, two sets of questions emerge. First: on
    a systems level, if we wanted to eat locally and sustainably year-round, what
    could that look like? Is it possible?


    And second: if for the near future, the majority of what we eat will continue
    to come through the global supply chain via conventional agriculture, what could,
    or should, we be doing to extend our sphere of influence to the places where our
    food is grown and harvested? Are conventional agriculture’s sustainability and
    labour practices reformable in any meaningful way?'
