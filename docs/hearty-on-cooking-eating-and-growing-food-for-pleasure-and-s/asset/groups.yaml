    At 6:10, when the macarons have been in for for over an hour, I open the oven
    door and discover—though the shells look fine from the outside—that the insides
    of the macarons resemble angry lava.


    We decide to bake them for a little longer. And then a little longer. At 6:30,
    after we''ve eaten sushi together, which in itself is nice—surprise dinner guests,
    kind of like you''re a kid and your parents acquiesce to an impromptu sleepover—we
    pull five specimens from the oven. One for me, one for Sinc, one for Will, one
    for Megan, one for Nola. We scoop out the molten centre and pipe vegan buttercream
    and lemon curd into the dry empty shells. They’re . . . weird. Nola and Megan
    go home, and Sinclair goes to bed.


    By 9:45, I decide that this first batch of shells, though they haven''t yet dried
    out, can''t stay in the oven longer. I have a plane to catch the next morning.
    I decide to let them hang on the counter overnight with a tea towel draped over
    them and pipe them if they''ve dried out by the time I wake up. They do not dry
    out. They are the worst thing I''ve ever to to bake, and a prickly sensation comes
    over me, a sensation that I have bitten off more than I can chew.


    ## Attempt two: Friday, December 9, 2022.


    This time, Nola comes over solo, and we use a French macaron technique from a
    blog called Bakers and Blunders, which does not require to cook down the aquafaba.
    It isn''t lemon season, so we don''t have beautiful lemons to use from her tree.


    The first part goes well. The aquafaba whips up and folds nicely into the almond
    flour and icing sugar. We make the same lemon curd we made last time; it works,
    too, even with grocery-store citrus. The bright lemon flavour feels a little like
    splashing water on your face.


    I''ve been pouring over vegan macaron recipes, and the recipes have impressed
    upon me that I should not overmix the batter. I am not looking to get to the stage
    of macaronage I would for for traditional macarons, where the batter falls from
    my spatula in near-smooth ribbons. The batter that whips up for this attempt is
    closer to what I''m familiar with—just a little thicker. But the macarons still
    don''t settle into a smooth shell. Instead, they retain ridges that remind me
    a bit of the poop emoji.


    Still, they seem promising as a second attempt. We let them rest for fifty minutes
    on the counter, until the vast majority feel dry to the touch—no batter comes
    away on my fingertip when I press them lightly. In climates that are not as punishingly
    moist as ours, this step takes half as long.


    I put them into the oven at 250 Fahrenheit for twenty minutes, rotating every
    five minutes. They rise and get a foot—the little band of waffly ridges at the
    base of the cookie. And then too large a foot: worstisome.


    These shells end up completely hollow and fragile: another fail. We eat some of
    them, and I send Nola home with the lemon curd and a jar of broken macaron shards.


    I have gathered some ideas for the next try: longer rest, lower temperature, and
    slightly more mixing, but just slightly.


    ## Attempt three: Sunday, December 18, 2022.


    This time, I make the macarons alone. hoping to make it finer, more like caster
    sugar. I fold the aquafaba meringue and almond flour and icing sugar together
    for longer this time, taking almost to the ribbon stage before putting it in the
    piping bag. When I pipe the shells, they spread better, but I can tell my batter
    is still a bit too firm, still a bit undermixed. In other words, I know that the
    third time will not be the charm.


    I let the shells rest on the countertop, where they are briefly investigated by
    my cat, Macker, who is confused—I’m also making miso soup, and the kitchen smells
    like dashi—but does not try to absorb with anything. The shells take about forty
    minutes to be fully dry to the touch.


    This time, I put them into the oven at 200 degrees Fahrenheit, rotating them every
    ten minutes. I think they’ll be done at thirty minutes. They are not. I take them
    out at forty minutes and can tell that they are hollow. But, I think, maybe they’ll
    be workable? They are still not workable. The feet are smaller than last time.
    The shells lift off the Silpat more evenly. But they are still molten inside,
    more like a grainy marzipan than a macaron. I text Nola: “I think they’d be good
    on vegan ice cream?”


    I’d baked gluten-free chocolate chip cookies that weekend. The night before making
    the macarons, we’d had black beans, squash, and tomatoes on polenta, a meal composed
    of ingredients almost entirely grown in our yard. And still I had to remind myself
    that I chose to take vegan macarons in part because I knew they''d be a challenge,
    and that I am failing not because I am a terrible, useless, no-good person who
    can’t even get one thing, but mostly the proteins in aquafaba are weaker than
    those in egg whites and that it’s a bit zany to be attempting this in the first
    place. When I asked aloud, mostly rhetorically, what I am doing wrong, Will deadpans,
    “Making vegan macarons.”


    “On the upside,” Nola texts, “it’s good for your word count.”


    ## Attempts four and five: Sunday, February 26, 2023.


    It’s been a year since my first try. In the intervening months, I’ve made ice
    cream, cream bars, truffles, baked Alasks, eclairs, choux pastry, pizzas, breads—lots
