    father said it was like watching someone cling to life with every fibre of will
    he had and losing the battle. He said he, too, would cling to life, that he’d
    be dragged kicking and screaming to death clinging to the cliff of the living
    with his fingertips.


    For all this, however my dad believes life is for living, for enjoying. He and
    I share a dopamine-seeking, celebratory approach to daily life, the basic belief
    that it is in these daily moments that we find meaning. It’s a tension.'
