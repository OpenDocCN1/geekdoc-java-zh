    Eating is one of the most important things almost living being does on a daily
    basis. Our eating habits are shaped by personal and global forces long before
    we’re born, even as what we eat now is shaping the future. I think the best way
    to change our food systems is to tap into the pleasure we derive from eating in
    a way that’s conscious of colonialism and community and cultural roots, that meets
    us where we are but inspires us to seek alternatives that might better sustain
    us all. To eat a heap of broccoli not instead of a box of Kraft Dinner but in
    addition to it, because when we can access greens, and roast them with oil and
    salt, they’re delicious.'
