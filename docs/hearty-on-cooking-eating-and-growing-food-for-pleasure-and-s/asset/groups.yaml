    ## a fifty-pound bag of potatoes


    On the eve of my third year at university, my mother made one of the only trips
    she’d ever make to visit me in the seven years I spent living half an hour down
    the road from her in Guelph. She brought her boyfriend. Together, they bought
    a fifty-pound bag of potatoes. He worked in produce, and they’d been on sale.


    It was summer, and I was then living in the two-bedroom apartment above the curry
    restaurant downtown where me, my-then-partner, and my roommate all worked. Our
    kitchen was on the east side of the apartment, with a window that opened out onto
    a peaked roof we sometimes climbed to smoke a joint. Our rent was $267 each, but
    we were still chronically broke—money like water we had no container for.


    If you’ve never carried a fifty-pound bag of potatoes: the best way to do it is
    over a shoulder, distributing the weight evenly. You can also opt for a fireman’s
    carry, slinging it over both shoulders and keeping it in place with your arms.
    It feels eerie like a lumpy torso.


    If you’re strong, the most annoying thing about it is the lumps. If you’re not
    very strong, your knees might buckle. If you’re somewhere in the middle, you’ll
    be able to carry it, but your being will be focussed on carrying it, unable to
    think or hope or desire anything else.


    My mother and her boyfriend had been drinking at a bar next to his produce shop
    one evening before I left home, when I still worked at his produce store, when
    I was tasked to bring a fifty-pound bag of potatoes over to the caterer who worked
    out of the bar’s kitchen. I hefted it onto shoulders and carried it down a short
    set of stairs at the front of the store, then across the parking lot towards the
    bar.


    My parents were still married at the time and were not really supposed to have
    other significant others; I was thinking about this as I hefted the potatoes down
    a second set of stairs into the bar, wondering what I was about to see—hand where
    it shouldn''t be, knees touching underneath the table of a booth. I hadn''t anticipated
    any other surprises, but as I was carrying the potatoes through the bar, a man
    approached me. He told me he''d help me, I said it wasn''t necessary, and then
    he took advantage of the fact that I was occupied with the potatoes to, in the
    guise of “helping,” grope my teenage body.


    After I unfrozen, I yelled at him and beelined for the kitchen. My mother followed.
    She told me misunderstood the man’s intentions and needed to apologize. My mouth
    began to feel salty, as if I was going to throw up. My face got hot; my cheeks
    turned red. It was a dizzying anger, a new level of betrayal. I left out a door
    I''d never used before and found myself in the bar’s overflow parking lot, looking
    at a Second World War fighter plane mounted on a pole. My mother didn''t follow;
    she went back to her boyfriend and her glass of white wine.


    Gifts from my mother so often came with strings. Attached. But I think this one
    was really from her boyfriend. I''m sure she wasn''t thinking about the incident
