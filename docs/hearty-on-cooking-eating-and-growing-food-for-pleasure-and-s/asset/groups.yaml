    In the nineteenth century and earlier, the working classes, in particular farmers
    and farm labourers, or ploughmen, would have woken up, laboured for a few hours,
    and paused around eleven a.m. for sustenance, Collingham says. This meal would
    have consisted of a hunk of bread and often a raw onion and, if financially feasible,
    some cheese. Cheese was considered the labour’s “white meat”—the consumption of
    meat wasn’t necessarily daily, perhaps confined to a Sunday roast. So the practice
    of eating chutney as part of this meal followed directly in the footsteps of eating
    meat with pungent condiments, and it was probably related to the practice of augmenting
    the meal with raw onion. When pickle became accessible to the working classes,
    it was added to the meal.


    Peter Atkins, professor emeritus at Durham University with a specialization in
    the geographies of food and drink, traces a slightly earlier cousin of the pickle
    in the ploughman’s lunch. “I think it really began with anchovy sauce at the end
    of the nineteenth century in London,” he says. “That was really, I think, the
    first and most popular addition to the British diet, based upon Italian anchovies.”
    The beginning of the nineteenth century, Atkins says, marked the beginning of
    the various pickles. Their method of preservation relied on sugar—which had entered
    England much earlier, part of the triangular trade, with its own legacy of enslavement
    and colonialism—and vinegar. Unlike the vinegar on the continent, which was made
    using wine (hence vinegar, “vin aig” or “sour wine”), Atkins says the Brits used
    beer as the basis of their vinegar. Called malt vinegar, it often relies on fermented
    barley and is still in use today.


    In an article entitled “Vinegar and Sugar: The Early History of Factory-Made Jams,
    Pickles, and Sauces in Britain,” Atkins traces the appearance of industrial-scale
    packaged goods preserved in sugar and vinegar in the late eighteenth and early
    nineteenth century, through companies like E. Lazenby & Son, Batty & Co., John
    Burgess and Son, and, notably, Crosse & Blackwell, which was one of the earliest,
    largest, and most successful manufacturers of pickles, table sauces, and other
    related products. In the mid-nineteenth century, Atkins writes, Crosse & Blackwell
    bypassed wholesale markets like the Covent Garden Market and purchased the product
    they needed for their goods directly from farmers, whom they contracted. They
    also brewed their own vinegar—vertical integration. On our call, Atkins describes
    the company as “ruthless.” The company grew throughout the early nineteenth century;
    by the 1860s, Atkins describes their output as “industrial” in scale. Crosse &
    Blackwell exported its goods to Australia, China, and India and advertised “extensively”
    in newspapers and magazines in Britain in the nineteenth century, reaching the
    middle classes and making the brand a household name. By the time the company
    began manufacture Branston Pickle in 1922, it had honed tactics; used inexpensive,
    plentiful ingredients and advertised broadly to stir up familiarity and the emotion—domestic
    bliss, nationalism, nostalgia.


    When I ask him why he thinks Branston Pickle became so ubiquitous, Atkins confesses
    that he doesn’t like it. “I think it’s mainly the advertising,” he says. “It was
    a very profitable product.”


    (After our interview, Atkins sends me the conference presentation his article
    was based on. It opens with a 1950 quote from an Italian man named Alberto Denti
    di Piragno: “The British are . . . ‘incable of giving any flavour to the food,
    [they] call on sauces to serve to their dishes which their dishes do not have.
    This explains the sauces, the jellies and prepared extracts, the bottled sauces,
    the chutneys, which populate the tables of this unfortunate people.” He was a
    fascist during the Second World War, Atkins tells me. “So I’m not sure I believe
    anything he says, I quoted it because it’s a really nice indication of what other
    people think of the British diet.))


    Echoing what Colingham told me, Atkins guesses pickles and chutneys wouldn’t have
    been able to enter the working-class diet until after the working classes began
    to benefit from “improved purchasing ability” in the 1850s onwards, but markedly
    in the 1870s.


    “They were being paid better wages,” Atkins says. And the food that they wanted
    to buy was relatively in price. The reason being—let’s take bread for instance—because
    of the importation of wheat from Canada and America and various other places,
    with lower production costs in the Canadian prairies. It could be exported more
    cheaply. The flour was cheaper. and therefore the bread was cheaper.”


    Wheat became more economical to import after the demise of the Corn Laws (which
    had attempted to favour domestic agriculture by placing tariffs on staple grains
    like wheat and corn) in 1846. At first, it came mostly from U.S.; by the late
    nineteenth and early twentieth century, it was coming mostly from Canada, which
    by 1910 was the world’s largest wheat exporter.


    Canada was able to achieve success in wheat exports because of the construction
    of the Canadian Pacific Railway, which allowed for relatively cheap transport
    of wheat across the country from the prairies. Both the railway and the “clearing”
    of the plains for agriculture were violent colonial undertakings.


    In other words: every element of the ploughman’s lunch—and my cheese and chutney
    sandwiches—are bound up in class, in history, in politics, in food systems, in
    empire. But this doesn’t quite answer where my nana’s chutney came from.


    There are hundreds of different kinds of regional chutneys and pickles eaten across
    India and South Asia. Some are sweet, some are spicy, some are cooling agents;
    some add interest and moisture to the meal. Collingham describes a Bengali chutney
    she frequently makes at home: you heat a pinch of panch phoron, which consists
    of cumin seeds,

