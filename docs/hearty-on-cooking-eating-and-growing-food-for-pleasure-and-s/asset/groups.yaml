    So we could reduce waste, but we could also reduce it and focus on getting more
    of what we produce on tables. A 2021 paper in the journal *Resources, Conservation
    & Recycling* found that 14 percent of food is “lost before it ever reaches the
    retail level.” Suggested solutions included shifting away from the model of offering
    tax incentives for donations, which farmers often find time-consuming and difficult
    to take advantage of, and shifting towards investing in processing infrastructure,
