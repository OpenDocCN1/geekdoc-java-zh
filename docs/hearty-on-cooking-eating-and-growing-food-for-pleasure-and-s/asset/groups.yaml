    在初冬，当鲍威尔河（Powell River）的太阳在上午8:16升起时，距离帝国谷（Imperial Valley）以南约2500公里的地方已经在6:42升起。这个山谷位于加利尼亚州的最东南部，南部邻墨西哥边境，东部邻亚利桑那州。如果不是1901年土地投机者从科罗拉多河向西修建了一条运河，这里将是一片沙漠。（正是这条运河的失败在1905年造成了如今严重污染的萨尔顿海）。20世纪30年代，作为新政的一部分，修建了一条新运河——全美运河（All-American
    Canal），并于1940年向帝国谷输送水。这条运河从东部的科罗拉多河延伸到西部帝国谷数英里（约128公里），依靠重力流动，自1942年以来一直是该地区的唯一水源。


    从科罗拉多河引出的水让帝国谷的农民能够种植生菜等绿色蔬菜，而在这种气候下，这些作物本无法良好生长，甚至根本无法生长。但干旱和对科罗拉多河的过度依赖（该河源于落基山脉，向西南流向墨西哥的加利尼亚湾，沿途提供灌溉和饮用水）意味着它正在枯竭。帝国谷农民从科罗拉多河汲取的水比亚利桑那州和内华达州加起来还要多——而且他们的优先水权意味着他们在法律上有权这样做。但随着河流水位升高直至消失，这些农民正面临削减压力；他们需要放弃10%的供水量。


    我三月份要吃的沙拉里的生菜，很可能是在10月底或11月初播种的。它们喜欢沙漠中沙质的壤土。生菜要么作为球粒种子（包裹在粘土中的种子，更易处理）使用一种名为精密播种机的机器进行播种，要么使用另一种机器将幼苗以纸盆或小土块的形式移栽。这两种机器都能有效移动以覆盖大片区域，这很有帮助，因为加州州的平均农场面积约为351英亩。这相当于梵蒂冈的三倍，或者大约266个足球场。如果你站在行排的尽头，放眼望去全是生菜，生菜。


    播种后，生菜通常由喷淋器浇水五到七天，直到种子发芽、幼苗出现。农民随后切换到沟灌法；生菜行之间的土壤被压低，这些路径（即沟）被放水，从底部和侧面浇溉生菜。在干旱环境中，种植每英亩叶生菜通常需要3英亩径（或3700立方米）的水。为了节水，一些农民正在转向滴灌系统。（但这类设备并不等同于流域留下了更多水；农民通常利用省下的水扩大灌溉作物面积或种植耗水量更大的作物。）


    土壤生长得到了施肥的帮助——种植前每英亩施入高达250磅磷，生菜开始生长时通过侧施每英亩施入200至250磅氮。喷洒常规除草剂帮助控制杂草；喷洒常规农药帮助控制昆虫，如蚜虫、叶潜和银叶白粉虱。


    用于我沙拉的生菜在冬季缓慢而稳健地生长，并在3月初（比如3月1日）准备采摘。早晨很冷，大约9摄氏度，且多云。到中午，气温将达到17摄氏度。


    采收本身是一场精心策划的农业芭蕾。我从未亲眼见过，但在YouTube上这是一个专门的小众类型。


    例如，一个名为 Chore Vlogs 的农工人记录了他在加利福尼亚州格林菲尔德的 Andrew Smith 公司工作的三月的一天：他挑选了一顶棒球帽，泡了咖啡暖暖，乘坐公司大巴前往农田。“风景很美，”他用西班牙语说道，到达农场后让镜头缓慢转动，捕捉着环绕田野的山脉。到了采摘时间，大约十几名农工人组成生产线，弯着腰，切断生菜根部，摘掉几片外叶，然后将其装入固定在腰间带上的透明塑料袋中，并放置在横向田田移动的机器伸出的金属臂上。包装工将袋子封好，把生菜放入黑色塑料箱和纸箱中，并放在机器中央的传送带上，传送带通向卡车。


    （注：原文中存在大量重复的段落，译文已根据要求确保内容不重复输出。）

