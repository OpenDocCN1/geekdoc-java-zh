  - '[PAGE 208]


    Base adapted from the New York Times Master Ice Cream Recipe by Melissa Clark


    It’s easiest to make this ice cream over two days. On day one, make the base and
    enrobe the graham crackers in melted chocolate. On day two, torch the mini marshmallows,
    break the chocolate-covered graham crackers apart from the Silpat, churn the ice
    cream, and mix everything together.


    # Tools


    +   - Silpat

    - culinary torch

    - whisk

    - small mixing bowl

    - medium-sized mixing bowl

    - large mixing bowl

    - medium-sized heavy-bottomed pot

    - medium-sized fine-mesh strainer

    - food thermometer (optional but helpful)

    - ice cream maker (optional but helpful)


    # Ingredients


    # Ice cream base'
  - '[PAGE 209]


    +   • 170 grams (6 ounces) semi-sweet Baker’s chocolate

    • 3 tablespoons cocoa powder

    • 1 1/2 cups whole milk

    • 3/4 cup sugar

    • pinch of salt

    • 6 egg yolks

    • 3/4 cup sour cream

    • 1 teaspoon vanilla extract


    # Mix-ins


    +   • 200 grams (7 ounces) mini marshmallows

    • 100 grams (3.5 ounces) graham crackers (if using gluten-free, I recommend the
    Schär gluten-free Honeygrams)

    • 170 grams (6 ounces) Baker’s chocolate


    +   1. Chop finely, shave, the semi-sweet baking chocolate into a small mixing
    bowl.

    2. In a medium-sized heavy-bottomed pot, bring the cream and cocoa powder to a
    simmer, stirring. When it’s hot, pour it over the chocolate, place a clean tea
    towel over the bowl, and set it aside.

    3. Place six egg yolks into a medium-sized mixing bowl. Whisk them together and
    set aside.'
  - '[PAGE 210]


    +   4. Clean out the pot. Whisk the milk, sugar, and salt together in the pot
    on medium-low heat until the sugar has dissolved and the mixture is beginning
    to steam. Take the pot off the heat.


    +   5. Slowly drizzle one-third of the hot cream mixture into the egg yolks, whisking
    constantly.


    +   6. Add that yolk mixture back into the main pot. Keeping the pot off the heat,
    slowly drizzle the yolk mixture back into the cream mixture, whisking constantly.


    +   7. Place the pot back onto a medium-low heat and gently cook the custard,
    whisking regularly. You''re looking for the custard to come to 170°F (77°C). If
    you don''t have a thermometer, it should be thick enough to coat the back of a
    spoon.


    +   8. Strain the custard through the fine-mesh sieve into a clean mixing bowl.
    (I usually quickly wash out the one that was housing my yolks.) Whisk in the melted
    chocolate mixture, as well as 3/4 cup of sour cream. Add your teaspoon of vanilla.


    +   9. Let the base come to room temperature for half an hour on the countertop.
    Then place it in the fridge. Allow it to chill for at least four hours. (I usually
    leave mine overnight.)


    +   10. Meanwhile, while on enrolling your graham crackers in chocolate. Set out
    a Silpat (or parchment paper). Break the graham crackers into bite-sized pieces.
    Chop the chocolate and place it into a microwave-safe bowl. Microwave it in thirty-second
    increments, stirring in each session, until it''s fully melted—about two or three
    sessions. Add the graham cracker pieces to the melted chocolate, and gently fold
    together with a spatula until the graham crackers are coated in chocolate. Overturn
    the chocolate-coated graham crackers onto the Silpat and spread them out so they''ll'
  - '[PAGE 211]


    easy to snap apart when they’ve solidified in a few hours. I cover mine with a
    baking sheet (you could also put them in Tupperware) and leave them out at room
    temperature overnight.


    +   11. The next day (or when your base is chilled and your enrobed graham crackers
    have solidified), lay the marshmallows out in a flat layer on a platter—something
    that isn''t terribly melty or flammable. Using a culinary torch, toast the marshmallows
    until they have golden-brown and burnt bits. Set aside.


    +   12. Churn your ice cream base in your ice cream maker. Or DIY using a baking
    pan and a whisk.


    +   13. Your mix-ins will not fit into a regular-sized ice cream maker. When the
    ice cream is done churning, scoop it into a large bowl, layering it with the graham
    cracker and marshmallow mix-ins (making sure to add bite-sized chunks of marshmallow
    at a time—if you add a big chunk, it might freeze a big chunk!). Mix together
    gently using a wooden spoon. Working quickly, scoop it into your container of
    choice (mine fit roughly into two large-size Adams peanut butter jars) and place
    it into the freezer for a few hours to solidify before serving.'
  - '[PAGE 212]


    # pestilence and abundance


    There are lessons to be learned in the mindful, long-term care of plants. My partner,
    Will, has kept dozens of indoor plants alive for the entire time I’ve known him.
    These plants—euphorbias and cacti, ferns and broadleaf evergreens—get all manner
    of pests I most likely never would have heard of if it wasn’t for meeting him.
    Thrips, mealies, mealies, spider mites—Will kills them all. He checks in on his
    plants diligently, watering them and repotting them, pruning and root pruning
    them. The bigger plants, he waters in the bathtub. The pots of oxalis, which grows
    from cores, get periodic haircuts. Why? He’s explained it to me, but I’m never
    quite sure. At regular intervals throughout the week, he moves through the house
    with a watering can, a repurposed toaster oven grill, and a bucket to catch the
    excess water. Anything that needs a soak is set on the grill over the bucket and
    tended to with indoor artificial rain.


    Will has written about taking care of these plants, saying that he finds something
    thrilling about keeping them all alive—that they lend a purpose to his life, especially
    if they originated in an illicit roadside cutting or involved an illegal border
    crossing. I think this kind of care must also be somewhat meditative—slowing the
    world down, focusing on long-term, persistent solutions to pests and problems.


    But there’s also satisfaction in helping an annual or biennial vegetable mope
    along until crops.


    Many permaculists and regenerative farmer types and backyard gardeners into no-till
    farming—which, for the uninitiated, means top-'
- md: '

    dressing garden beds or fields with compost or aged manure annually, rather than
    digging it in or using fertilizers—will tell you that if your farm garden is diverse
    and in balance, you will not see significant pest or disease pressure.


    Over time, in broad strokes, this is true: practising crop rotation help guard
    against or suppress some pathogens, in addition to improving soil quality by,
    for example, planting nitrogen fixers as peas and beans following a year growing
    brassicas, such as broccoli and Brussels sprouts, which draw heavily on nitrogen
    stores. Diversity can also help attract beneficial insects and pollinators, and
    it ensures a yield even in years that are overly hot or cold or rainy or dry,
    if varieties with different strengths and weaknesses have been planted. But it’s
    also true that things are just sometimes a crapshoot.


    The first year we moved into our house, as soon as the soil in the backyard was
    workable, we began to dig out the sod and create garden beds. First with a handsaw
    and then with a chainsaw, Will removed a row of cedar hedges from the south side
    of the backyard to let in more light. He trimmed back the overgrown laurel hedge,
    which was so tall it arched over the asphalt tile roof of our house, creating
    issues with water, moss, and leaf detritus. He cut back a dead hazel tree; he
    pruned and snipped and eventually grew large piles of neatly ordered shrub and
    tree trimmings. Not all of them were suitable for our purposes, but used what
    we could in the newly dug-out beds, layering trimmings with sod underneath soil
    we’d dug from further down.


    This year, we managed to create three long north-south beds—one that would act
    as a nursery for the young trees and shrubs Will propagated, and two for my vegetables.
    We left grass between the beds and lined them with laurel limbs. They looked nice:
    tidy, fresh, cared for. For our cat, Mackerel, on a harness and sunny herself
    on the deck, watched over our progress. I bought her cat grass, repotting a tightly
    bound clump into three separate containers.


    I started simple that year, growing peppers, tomatoes, kale, peas, beans, broccoli,
    and favas. I tried to seed carrots, but they didn’t germinate. We started the
    tomatoes, peppers, and broccoli inside the house, letting the seedlings grow strong
    before transplanting them out. I seeded the peas and kale directly in the soil.


    Soon I discovered a problem: the damp, mostly grassy habitat of the yard was absolutely
    perfect for slugs, and in turning over the soil to create garden beds, and lining
    those beds with small logs, we’d created a perfect little bed and breakfast. They
    ate large holes in the brassica leaves; they felled peas and tomatoes. They were
    everywhere, like a Biblical plague. Under the grape armour, there was a U-shaped
    set of beds with concrete walls where I planted herbs. I was particularly invested
    in the basil. So were the slugs.


    I suggested remedies, like spreading coffee grounds and eggshells, but they didn’t
    work. A German-language website I found went into depth trialling “anti-schncken”
    techniques—placing snails and slugs in little experiments to see what worked as
    a deterrent. The creatures’ protective mucus allowed them to glide over any pokey
    with ease. Three things worked: wide copper tape, a somewhat complicated physical
    barrier known as a slug fence, and literally shocking the slugs with bands of
    electrical wiring.


    None of these options was immediately possible in my garden, so I began a war.
    At Night I went outside wearing a headlamp and carrying a bucket of salt water,
    which I later traded for scissors—less suffering, a more immediate death. I caught
    little grey field slugs in the act of snacking and felling and doled out immediate
    capital punishment. I killed dozens every night.


    Soon I began to dream of the slugs. It felt a bit untenable. I became convinced
    that when I died, I''d have to meet them again and answer to each and every one
    that I''d killed.


    I told everyone I met about the slugs. When they suggested folk remedies, I went
    into detail about the results of the anti-schnecken trials. Meanwhile, Will will
    continue his dutiful attentions to his plants, not making their plaques anyone
    else''s problem.


    Near the end of the season, I realized that the logs we''d used to line the garden
    beds had to go. Will and I biked, with Sinclair in her baby bike seat and hauling
    a bike trailer, to a set of cardboard dumpsters behind the dollar store and the
    Mark''s Work Wearhouse in our town. Sinclair toddled around as Will climbed into
    the dumpster and frisbe nice good boxes out towards me. We used the cardboard
    to smother the grass paths and heaped it with high wood chips—just sixty-five
    dollars for a local florist, which saved him a trip to the dump.


    I still direct-seed little—it helps the plants to let them grow large in their
    cells in the warmth of the hoop house (built in year two) or the greenhouse (built
    in year three). I grow my basil in five-gallon pots ringed with copper tape, and
    I wrap the tender stalks of my squash, cucumber, and melon seedlings with aluminum
    foil collars when I plant them out to keep being felled. But I no longer go on
    nightly slug raids or see them in my dreams, my conscience haunting me.


    In this case, the advice I''d been absorbing from hippieish experts panned out:
    the more we built up the soil and transitioned the grass to garden and wood chip
    paths, the less the slugs were a problem.


    But it wasn''t our last pestilence. And not all of them are solvable with habitat
    changes and patience. Some of them—especially as climate change renders each season
    a little weirder, a little less predictable—we just have to learn to live with,
    like we have to learn to live with, loss.


    The second year of the garden, my carrots germinated, but when I picked them,
    I found many tunneled through—little miniature tunnels caused by something called
    the carrot fly. The following year, I bought sheets of mesh from the gardening
    store, PVC piping from a local plumbing shop, and had eighteen-inch lengths of
    rebar cut at the Rona. I hammered the rebar into the soil, sawed lengths of piping,
    and curved little inverted Us that helped the mesh arch over the garden beds.
    Covering the carrots worked well to keep off carrot rust fly; covering the brassicas
    deterred cabbage moths and aphids.


    In the cool damp of the Pacific Northwest, I discovered that growing my winter
    squash up trellis helped stave off the development of powdery

