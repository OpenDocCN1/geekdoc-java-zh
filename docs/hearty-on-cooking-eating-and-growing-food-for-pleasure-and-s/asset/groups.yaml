  - '[PAGE 172]


    internalize an employer’s goals and standards. Some days it is difficult to make
    myself wake up and bike to the farm; some days, left to my own devices in the
    field, I feel as sad or devoid of feeling as I do at home. But volunteering begins
    to free me from the overarching obsession with productivity that exacerbates my
    mental illness. Volunteering, whatever I offer is a bonus. If I lose thirty-eight
    seconds admiring the way as resting in a head of broccoli the way a human would
    sit in the crook of a tree, I feel no guilt.


    In August, I harvest summer squash at the farm—dark green zucchini, yellow zucchini,
    Romanesco, crookneck, and pattypan—after reinflating a wheelbarrow tire my bike
    pump. I can hear lambs and turkeys beyond the western edge of the field.


    The squash leaves scrape and pickle my forearms and shins and calves. As I bike
    home, it rains, and the rain mixes with my sweat, and every bare inch of scratched
    skin out in pain. It should bother me more than it does; instead, the feeling
    of the rain on my face and the nettle-sting on my limbs is invigorating, like
    a free spa treatment. The raindrops, collecting, leave clean trails on my legs,
    which have been primed with a fine layer of mud and silt.


    My summer and winter squash plants have begun to develop powdery mildew; the farm’s
    have too. I study tips and tricks to mitigate it, removing the affected leaves
    and being careful to water the ground around the plant, rather than the leaves.
    But I also accept that it’s a common late-season problem, not a personal failing.'
  - '[PAGE 173]


    Each Sunday afternoon, at the beginning of my bipolar support group, we rate our
    moods on a scale that accommodates both depression and mania. We share and offer
    each other feedback and support. At the end of the session, we rate our moods
    again. Occasionally, for me, the number doesn''t budge. But usually, after listening
    and talking—sometimes more, sometimes less—I feel better.


    Most days when I volunteer, if I rated my mood before I went into the field and
    then afterwards, I''d find that it had improved. At first, I thought what gardening
    was teaching me patience—to learn how to put in small detail effort for a reward
    that would come much later. I also thought it would help me slow down, appreciate
    the role of each passing season, stop catastrophizing about death and mortality,
    and come to respect the power of dormancy and re-emergence. It has. But the lessons
    keep coming. A crop failure, for example, is like a bit like relapse. In learning
    how to accept these failures, I can also learn a bit about how to accept myself.


    In September, I use a little sickle to harvest cabbages. It''s serrated, with
    a red handle. The days are finally growing cooler and cloudy. Lauren asks if I''d
    like to participate in a casual triathlon her friend is organizing. It will begin
    with a 1.5-kilometre swim in Lund, followed by a forty-kilometre bike ride to
    Powell River, finishing with a ten-kilometre run. I say sure.


    In October, a third-grade French immersion class visits for an hour to pick sugar
    pie and Jack Be Little pumpkins. The pumpkins are slick with mud, and the kids
    compete to see who can carry the heaviest ones. We place them into wheelbarrows
    and line them up on tarps at the top of the field. The meadow just south of the
    blueberries has been turned into a'
  - '[PAGE 174]


    pumpkin patch, which features a few large pumpkins the farm has been trying to
    guard from the neighbourhood bears. On the weekend, the pumpkins we harvested
    will be set up in this field, available for purchase.


    Later, after the class has left and Lauren and I are picking the last hot peppers
    of the season, we hear gunshots. One of the nearby farms is harvesting its pigs.
    At the far end of the field, though Thanksgiving approaches, the turkeys are still
    strutting about bothered, searching for worms and grubs in the grass.


    By mid-October, Lauren has finished her season at the farm, and mine is winding
    up too. The triathlon, which I decided to swim and bike but not run, prompted
    us to meet every Sunday morning with some other new friends for a cold ocean dip.


    At home, I harvest handfuls of bell peppers to augment the jalapenos from the
    farm and from my CSA box in a fermented hot sauce I''m making. I add slices of
    carrot and chunks of onion for flavour, placing everything in mason jars and adding
    carefully measured salt water, and a Ziploc bag of water to weigh the vegetables
    down and keep them submerged.


    It''s only a few days later, checking on the ferment, that I realize this act
    of processing has closed a loop: these peppers began and ended a particular cycle
    of life in my garden, as well as marked the beginning and the soft end of the
    worst of my depression.


    As I roll up to the farm on my own last day, it finally clicks for me the space
    consists of two overlapping ecosystems—the food that''s growing, and the social
    ecosystem of workers and volunteers. I''m a vanishingly small part of it, but
    I''m still a part of it. The smallness is a comfort: it''s not all on me. Larger
    functioning systems compensate and rebalance and adjust.'
  - '[PAGE 175]


    In this framework, the goal is not perfection or achievement. It’s symbiosis and
    balance.


    # Fermented hot sauce


    Adapted from a recipe from *Feasting at Home*


    I’ve mentioned elsewhere in this book that I have chronic gastritis. In addition
    to avoiding gluten, I drink very little alcohol and limit coffee and spicy foods.
    So I usually use poblano peppers or a mix of jalapeno peppers and bell peppers.
    It’s a choose-your-own-spiciness type of hot sauce.


    A note on salt: Sea salt, pickling salt and kosher salt are the best options for
    this recipe. Avoid iodized salt, which might inhibit fermentation. Also avoid
    anything too fancy—it’s just necessary.


    A note on salt: From everything I’ve read, the fermentation window occurs in a
    solution of salt water that contains between 2 percent and 5 percent salt. Anything
    below that and harmful bacteria will grow; anything above gets you above 2 percent.
    An alternative method for figuring out how much salt you need is to place your
    vegetables in your tared fermentation container, cover them with water, and then
    weigh the mixture. Multiply the weight of the vegetables and water by 0.025 to
    get the weight of the salt you’ll need, and you’ll end up with a brine just south
    of 2.5 percent salt.


    # Ingredients


    +   - 1,183 grams (42 ounces) water'
  - '[PAGE 176]


    +   - 25 grams (1 ounce) salt

    - 454 grams (16 ounces) peppers

    - 1 medium unpeeled carrot

    - 6 cloves of garlic

    - 1 small onion (or 1/2 large onion)


    1. Stir the salt into hot water (hot from the tap is fine) until it''s dissolved,
    and let the water come back to room temperature.


    2. Cut the peppers into large chunks—around two by two inches, or a bit larger—and
    remove the seeds, pith, and ribs.


    3. Slice the carrot and garlic into thin coins.


    4. Quarter the onion lengthwise.


    5. Mix up the vegetables and pack them into a fermentation crock or mason jars.
    Pour the saltwater brine over the veggies, making sure they’re covered. I’ll often
    retain a couple nice pieces of pepper to place on top of the veggie mix—or you
    can use a big kale leaf, or cabbage leaf. This basically ensures that none of
    the smaller bits will float above the brine and touch the air. You want everything
    to be immersed.


    6. If you need more brine, mix more at a ratio of 100 grams of water to 2.5 grams
    of salt (4 ounces water to 0.1 ounces salt).


    7. Weigh down the vegetable mix with clay fermentation weights, or if you are
    using mason jars and don’t have weights, fill a Ziploc bag with water and place
    it on top of the veggie mix. Cover the crock with its lid, or if using mason jars,
    cover with cheesecloth or a tea towel and an elastic band.'
  - '[PAGE 177]


    +   8. Place the crock or mason jars in a cool, dry, dark place—the back of a
    cupboard or in a basement.


    +   9. Check for fermentation on day five. The brine should be cloudy. If you
    shimmy the container back and forth, you should see bubbles come to the top of
    the brine. Fermentation happens more slowly if it''s quite cool in your house.
    I usually leave mine to ferment for another couple days. But if you have a cloudy
    brine and see bubbles, you can choose to move to the next step at five days.


    +   10. Next, set a colander over a large bowl—you want to save the brine. Strain
    the vegetables, and place them into a food processor or blender. Start by adding
    one cup of the brine, and add more later if you''d like a thinner sauce. Blend
    until you reach your desired consistency. I keep mine a bit chunky, like a mash;
    I do this by pulsing the mix in a food processor. But you can also blend until
    it''s fully smooth.


    +   11. Place in squeeze bottles with the tip open, or a jar with a loosened lid,
    and store in the fridge. Fermentation continues after the initial five to seven
    days; leaving the tip open or the lid loosened allows gases to escape. A sealed
    container may explode, in particular if it''s left at room temperature.'
