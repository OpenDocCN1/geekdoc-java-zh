    zucchini relish and zucchini bread. (We’ll also freeze it with beans, some shredded
    carrot, and kale—a fried rice mix for the winter.)


    I thrive in this abundance. But it was poverty and scarcity that taught me to
    thrive. How to understand what each ingredient was doing in any given recipe,
    and how that ingredient could be swapped, lessened, or left altogether. Because
    some of the most satisfying meals of my life have started with a problem: I’m
    missing an ingredient, or I don’t eat or can’t eat or can’t afford an ingredient
    in a meal I’d like to make.


    A substitution can be something simple, like crushing salted potato chips onto
    a baked mac and cheese instead of breadcrumbs, or something more complex, like
    using a mixture of gluten-free flours, xanthan gum, and psyllium husk gel to make
    gluten-free phyllo. It’s understanding when it is advisable to swap carrots for
    squash or sweet potato and when it isn’t. When an ingredient is contributing to
    texture or flavour; fat or acid; what the ingredient is doing in its secondary
    function, if it has one—like making another key ingredient or adding a needed
    earthy.


    And that’s why my definition of what makes a good cook doesn’t necessarily have
    anything to do with how well a person can roast a lamb or sear a steak. Instead,
    my definition centres on how well a cook can analyze a recipe in order to adapt
    it—either to make a new recipe or to make a similar one whatever ingredients are
    presently available.


    > “We can’t deny the parallels our current COVID-19 pandemic shares with the Great
    Depression,” baker B. Dylan Hollis told Food52 in 2021. “Many of us are still
    stuck inside, money is short, and the hindrances to eating out in public has forced
    us to return to our kitchens and reflect on it as a place to create and sustain
    more than ever before. Baking historical recipes is one of the most interesting
    and engaging ways to experience the past, and through that: understand our place
    in the present time.


    Hollis had recently baked a water pie on TikTok. The recipe, which requires a
    pie crust, water, sugar, flour, vanilla extract, and butter, was one of several
    Depression-era recipes that made the rounds during the first year and a half of
    COVID, before most health agencies across North America shrugged their shoulders
    and declared the pandemic over, and everything went “back to normal.”


    People also made peanut butter bread, compost soup, dandelion salad, and sourdough
    bread; they spoke with their grandparents and turned to the past for advice how
    to avoid food waste and eat cheaply. There was a huge bump in vegetable gardening,ening
    back to Second World War era victory. People bought so much that some companies
    faced shortages. Others, as West Coast Seeds, couldn’t package seeds fast enough
    to keep up with demand, even though they’d doubled their production capacity by
    2021. Though most articles at the time focused on seeds, supply outpaced demand
    in everything related to home gardening. Getting your hands on good, decently
    priced manure or compost, for example, as cutthroat, a whisper network of access
    to the excrement of cows and horses and alpacas.


    In 2022, this fervour tapered off. “This year, we have experienced a much greater
    stability with gardeners and growers returning to normal buying patterns, creating
    a very welcome plateau,” Elizabeth Clark, marketing manager at West Coast Seeds,
    while some new gardeners have continued with the practice they picked up over
    the pandemic, others went back to doing what they had been doing before. Which
    makes sense: vegetable gardening takes quite a bit of patience, time, and planning.
    As does cooking. It’s unreasonable to expect individuals to undo the industrialization
    of food production as they work at least forty mixer hours a week, commute, and
    act as caregivers for kids or friends or loved ones; everyone is pretty busy just
    trying to keep their bills paid. But Clark did also tell me that demand remains
    strong and that many people have continued to “grow food from seed as part of
    an environmentally sustainable and food secure lifestyle.” And of course, this
    resonates with me. But as inflation presses food budgets, and there are no more
    government income programs to blunt the economic impacts of the pandemic, and
    social assistance rates haven''t kept up for decades, it’s food bank use that
    has increased the most, much than vegetable gardening.


    When the pandemic hit, I was already gardening and cooking a lot, and I''d spent
    enough time making what are now called “struggle meals” when I was penniless and
    hungry that I had no real desire to look back to Depression-era recipes. I did
    start baking a lot more, though, and putting time into making more elaborate food.
    I bought an apple-green stand mixer when it went on sale for half off and finally—why
    didn''t I sooner?—a digital thermometer. I learned how to make ice cream and gluten-rough
    puff pastry and Swiss meringue buttercream. Craving baklava, I made my own phyllo.
    But it wasn''t until I listened to Samin Nosrat, author of Salt, Fat, Acid, Heat,
    talk about food on her limited-run podcast Home Cooking that I realized how much
    I''d actually picked up, over the years, about food and cooking—more than I realized
    I knew, and for the most part, it had nothing to do with my more recent ability
    to make a perfect crème caramel.


    Part of what Nosrat does on Home Cooking is to suggest meal options from a broad
    spread of traditions, based on what people have lurking in their fridges, freezers,
    and pantries—alongside ways to stock fridges, freezers, and pantries that will
    give home cooks the ability to create variety in their meals. Because of this,
    Nosrat rarely offers a straight recipe.


    In the inaugural episode, she suggests meal options from a broad spread of traditions,
    based on what people have lurking in their fridges, freezers, and pantries—alongside
    ways to stock fridges, freezers, and pantries that will give home cooks the ability
