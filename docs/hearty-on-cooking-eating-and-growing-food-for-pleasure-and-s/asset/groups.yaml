    In Jeffrey Steingarten’s essay “Where’s the Boeuf?” he writes that steamed broccoli
    is “the root of all evil.” But he also writes approving about visiting Alain Passard’s
    Arpège, which was one of only twenty-one restaurants in France in the early 2000s
    with a three-star Michelin rating, and had recently shifted its main focus from
    animal-based foods to plant-based foods. Steingarten describes his meal at Arpège
    as “stunning, original, precise, provocative, and very delicious.”


    It’s true that growing beans, pulses, grains, and vegetables, in general, creates
    a much smaller ecological footprint than growing meat; it’s true that industrial-scale
    livestock practices generally do not respect animals. It is also true that dishes
    centred on beans and pulses and grains and vegetables can be satisfying, and hearty,
    and flavourful. I don’t think the Food Network should suddenly become meat-free;
    I do think that if you approach non-meat as an afterthought, that approach will
    become self-propagating. If Chopped required the same care of leeks as it did
    of cow’s tongue, it would make for more imaginative viewing, a different kind
    of cooking inspiration.


    Even Anthony Bourdain changed his tune after visiting India for Parts Unknown.
    “I am dismissive and sometimes contemptuous of food that is made with a narrow
    world view as its first priority,” he told Vogue India in 2017. “This is not the
    case in India, one of the few places on earth, where eating vegetarian is not
    a burden. In Punjab, wildly varying textures, huge selections, thrilling blends
    of spices and assertive, delicious flavours are always accompanied by wonderful,
    freshly made breads.”'
