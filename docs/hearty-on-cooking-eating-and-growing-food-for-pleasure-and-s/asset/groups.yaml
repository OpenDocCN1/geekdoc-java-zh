    will be more finicky than egg whites, and I figure this is a safe place to start
    our trials. If it works well, I''ll switch to French.


    The aquafaba must be reduced to half of its volume by heating it in a saucepan.
    Half must then be used to make a marzippan-like paste with the almond flour and
    icing sugar, and the other half whipped to stiff peaks, which I''ll add sugar-water
    heated to 245 degrees Fahrenheit.


    When I mix the marzippan with the meringue, the result is much stiffer than I''m
    used to. It takes muscles to complete the macaronage, and I don''t get the batter
    to nearly the state I want. It feels like we could use it to speckle chips in
    our concrete basement floor.


    Still, we pipe them and get them into a 210-degree oven just before five p.m.
    The recipe says they should take about thirty minutes to bake. It''s a journey
    to even get them here; we''ve made vegan vanilla buttercream and lemon curd too.


    At 5:45 p.m., the macarons are nowhere near done. I place an order for takeout
    sushi.


    At 6:10, when the macarons have been in for for over an hour, I open the oven
    door and discover—though the shells look fine from the outside—that the insides
    of the macarons resemble angry lava.


    We decide to bake them for a little longer. And then a little longer. At 6:30,
    after we''ve eaten sushi together, which in itself is nice—surprise dinner guests,
    kind of like you''re a kid and your parents acquiesce to an impromptu sleepover—we
