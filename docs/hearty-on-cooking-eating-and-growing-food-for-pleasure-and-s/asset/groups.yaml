    # dedication


    For Kim


    # introduction


    On the way to school last year, my then-five-year-old Sinclair often threaded
    through a small stand of evergreens on the lawn of an empty house—to a gardener,
    the trees felt like a magical forest. The house had been empty and for sale since
    the previous spring, during lilac season, when I availed myself of the blooms
    of a bush between the evergreens and the sidewalk to make lilac simple syrup.


    When new people finally moved in, I told Sinclair she''d need to stop crossing
    the lawn. “It’s private property,” I explained. “There are people living there
    now.”


    One afternoon, Sinclair went through the trees again and we were repeating our
    conversation about other people’s lawns when a voice piped up: “She can cross
    if she wants!” Our new neighbour said hello and we chatted briefly. When I confessed
    I’d harvested her lilacs last year when the house was empty, she encouraged me
    to pick them this year. And I brought a metal bowl and a pair of secateurs to
    school drop-off one morning, and on my way home, I snipped until the bowl was
    filled with clusters of purple flowers.


    “I use them for simple syrup,” I told her. “And then to make lemonade.”


    And what I did: after work, I plucked the flowers from the branches while listening
    to Nirvana. Once they were all cleanly separated from the stems, I washed them
    under cold water in a fine-mesh sieve. I mixed equal parts sugar and water in
    a pot, bringing it to a boil, added the flowers to simmer at the end for a minute,
    and then steeped them overnight on the countertop. The next day, I strained the
    flowers. When we walked to school, I left a not-quite-full Bonne Maman jam jar
    of the syrup on a chair by my neighbour’s door with a recipe for lilac lemonade:
    one part syrup, one part lemon juice, two parts water.


    The lilac syrup itself is one of the most inviting things I’ve ever consumed.
    Drinking it feels like something out of Alice’s Adventures in Wonderland: for
    the briefest of moments, I felt to be inside the vibrant fragrance of the lilac,
    transformed. I imagine this is what a bumblebee feels like every day. If made
    with purple lilacs (and not a white variety), the syrup is a beautiful light violet.
    And the lemonade is pink—the result of the anthocyanins in the lilac flowers reacting
    with the acid in the lemons.


    I was describing lilac lemonade to Sinclair’s kindergarten teacher that week while
    we were making latkes with the class, and I realized that it would be a fun activity
    to do with the kids. With permission, I gathered lilacs from another neighbour’s
    house, leaving a couple kale seedlings on the picnic table in their yard as a
    thank you.


    In the classroom that Friday, a dozen tiny hands worked to pull the flowers from
    the branches. But it was the day before the May long weekend; everything descended
    into chaos, and we had to cut things short. The kids filed out, and I finished
    up the syrup in the quiet of the cafeteria, with the intermittent cacophony normal
    to an elementary school doppler through the halls.


    I share these anecdotes not because they’re exceptional but because they’re illustrative:
    I how to grow food, to cook food, to talk about (where people in town are finding
    good cheese; who’s doing the next bulk order for beans or nuts or spices; how
    our region could support more farms). It’s often the primary way I’m in community
    with friends and acquaintances where I live. Seed swapping by mail or making a
    loved one’s recipe, I remain in community with friends and acquaintances and family
    who live elsewhere.


    The connections I make this way are often small and simple. Sometimes they build
    into something bigger over time, and sometimes they don''t. Sometimes what seems
    like a good idea—making lilac syrup with kids—works out the way it might on a
    television segment.


    I think about food systems like I think about public transit: people make the
    best decisions they can in the circumstances in which they find themselves, and
    if I’m worrying about climate change and labour justice, I feel quite anxious
    about food running out of fertilizers. But when I participate in these cycles,
    and connect with others who seek solutions, my anxieties, like my hunger, can
    be temporarily allayed. Food has been a big part of my life for decades now, though
    it hasn''t always been charming as lilac lemonade. Starting in my teens, I spent
    ten years working in food service. I worked at an organic bakery; I worked at
    Subway. I worked a small-town salad bar; I worked at Tim Hortons. I worked at
    a curry restaurant and at a well-known vegetarian restaurant in Guelph, Ontario,
    that made everything from scratch. During parts of this period, I was involved
    in a tenants'' union that cooked free meals and wrote letters to help fellow tenants
    fight evictions and force their landlords to fix issues with their rental suites.
    I was often poor and overworked. And mentally ill—I’m bipolar and have generalized
    anxiety disorder.


    My experiences mean I''m not interested in personal judgments about what people
    eat or how they eat it. The strictures of life, alongside the particular cultures
    in which we''re raised, shape what makes it onto our plates. It makes very little
    sense to expect individuals to solve problems that have their roots in structural
    issues.


    Our bodies need sustenance; our budgets determine what much time we have to devote
    to cooking. Meals, often social, provide opportunities for cultural connection—and
    sometimes opportunities for anxiety, if you have allergies, sensory issues, or
    a complicated relationship with food. We might need to make what others consider
    a bad decision, like extracting the last of what''s left on a credit card to buy
    a veggie burger combo from Harvey’s—providing an opt-out from making dinner, alongside
    a nice little hit of dopamine crunching into the onion rings. (Ask me why this
    example is so specific.)


    I’m much more interested in exploring how things could be functioning better,
    in ways that are equitable, support labourers, meet people where we are, recognize
    the interiority and autonomy of animals, stop borrowing resources from the future,
    and do not further enrich billionaires—they’ve extracted enough from us.

