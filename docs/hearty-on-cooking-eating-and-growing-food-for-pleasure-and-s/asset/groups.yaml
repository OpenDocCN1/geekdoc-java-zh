    - medium-sized heavy-bottomed pot

    - medium-sized fine-mesh strainer

    - food thermometer (optional but helpful)

    - ice cream maker (optional but helpful)


    ## Ingredients


    ### For caramelized pretzels


    - 280 grams (10 ounces) pretzels (or gluten-free pretzels)

    - 55 grams (2 ounces) dry milk powder

    - 4 tablespoons sugar

    - 185 grams (6.5 ounces) unsalted butter, melted


    ### For pretzel-infused milk


    - 4 cups whole milk

    - caramelized pretzels


    ## For pretzel-infused ice cream (makes approximately 3.5 cups)


    - 1 cup heavy cream

    - 1 cup pretzel-infused milk

    - 1/2 cup (100 grams) sugar

    - 1/4 teaspoon salt

    - 1 teaspoon vanilla extract

    - 4 large egg yolks

    - a handful of crushed pretzels, to serve


    ## To caramelize pretzels


    1. Preheat your oven to 275°F (135°C). Put the pretzels in a food processor, blender,
    or clean mortar and pestle to reduce them to peas or smaller pieces.


    2. Combine milk powder and sugar in another bowl. Stir. Add the melted butter.
    Stir. Add the crushed pretzels and mix well.


    3. Spread the mixture onto a baking sheet lined with parchment paper, and bake
    until the crushed pretzels caramelize, approximately 35 minutes. Remove and let
    cool to room temperature.


    ## To make pretzel-infused milk


    1. Combine the caramelized pretzels and milk in a large mixing bowl and let steep
    for an hour. Strain the milk through a fine-mesh sieve, squeezing the pretzels
    to extract the milk. Clean the strainer. Strain again into a clean bowl; this
    time, don’t press or squeeze anything.


    ## To make pretzel-infused ice cream


    1. Pour the heavy cream into a medium bowl and place it in the fridge.

    2. Combine the pretzel-infused milk, sugar, salt, and vanilla extract in a small
    pot and heat over medium-low until the mixture begins to steam.

    3. In the meantime, in a medium-sized bowl, whisk together the egg yolks. Slowly
    pour the warm milk mixture into the yolks while whisking constantly. Place over
    medium heat and stir until the custard comes to 170°F (77°C). If you don’t have
    a thermometer, it should be thick enough to coat the back of a spoon.

    4. Pour the custard through a strainer into the chilled heavy cream and stir to
    combine.

    5. Chill the mixture overnight, then churn your ice cream base in your ice cream
    maker. Or DIY using a baking pan and a whisk.

    6. Serve with some crushed pretzels as a garnish.


    ## S’mores ice cream


    Base adapted from the New York Times Master Ice Cream Recipe by Melissa Clark


    It’s easiest to make this ice cream over two days. On day one, make the base and
    enrobe the graham crackers in melted chocolate. On day two, torch the mini marshmallows,
    break the chocolate-covered graham crackers apart from the Silpat, churn the ice
    cream, and mix everything together.


    ## Tools


    - Silpat

    - culinary torch

    - whisk

    - small mixing bowl

    - medium-sized mixing bowl

    - large mixing bowl

    - medium-sized heavy-bottomed pot

    - medium-sized fine-mesh strainer

    - food thermometer (optional but helpful)

    - ice cream maker (optional but helpful)


    ## Ingredients


    ### Ice cream base


    - 170 grams (6 ounces) semi-sweet Baker’s chocolate

    - 3 tablespoons cocoa powder

    - 1 1/2 cups whole milk

    - 3/4 cup sugar

    - pinch of salt

    - 6 egg yolks

    - 3/4 cup sour cream

    - 1 teaspoon vanilla extract


    ### Mix-ins


    - 200 grams (7 ounces) mini marshmallows

    - 100 grams (3.5 ounces) graham crackers (if using gluten-free, I recommend the
    Schär gluten-free Honeygrams)

    - 170 grams (6 ounces) Baker’s chocolate


    1. Chop finely, shave, the semi-sweet baking chocolate into a small mixing bowl.

    2. In a medium-sized heavy-bottomed pot, bring the cream and cocoa powder to a
    simmer, stirring. When it’s hot, pour it over the chocolate, place a clean tea
    towel over the bowl, and set it aside.

    3. Place six egg yolks into a medium-sized mixing bowl. Whisk them together and
    set aside.

    4. In a medium-sized heavy-bottomed pot, bring the cream and cocoa powder to a
    simmer, stirring. When it’s hot, pour it over the chocolate, place a clean tea
    towel over the bowl, and set it aside. (Wait, the OCR text repeats steps here,
    following logical flow):

    4. Combine the pretzel-infused milk, sugar, salt, and vanilla extract in a small
    pot and heat over medium-low until the mixture begins to steam.

    5. In the meantime, in a medium-sized bowl, whisk together the egg yolks. Slowly
    pour the warm milk mixture into the yolks while whisking constantly. Place over
    medium heat and stir until the custard comes to 170°F (77°C). If you don’t have
    a thermometer, it should be thick enough to coat the back of a spoon.

    6. Pour the custard through a strainer into the chilled heavy cream and stir to
    combine.

    7. Chill the mixture overnight, then churn your ice cream base in your ice cream
    maker. Or DIY using a baking pan and a whisk.

    8. Serve with some crushed pretzels as a garnish.

    9. When the ice cream is done, scoop it into your container, layering it with
    mix-ins.

    10. Mix together gently using a wooden spoon.

    11. Place in the freezer for a few hours to solidify.

