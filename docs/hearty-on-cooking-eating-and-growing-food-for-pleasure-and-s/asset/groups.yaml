  mdcn: '

    我使用的杏仁粉，到目前为止都是超市品牌。在通过筛网之前，我习惯先用食物处理机将它和糖粉粉一起打碎几次；也许这种打碎过程释放了杏仁油，破坏了马卡龙的化学特性？我买了一袋花费近
    20 美元的 Bob''s Red Mill 超细杏仁粉。我还买了四罐无盐的鹰嘴豆。


    那天晚上，下班后，我开始了第六次尝试。我决定使用瑞士式技法，即在打发成蛋白霜之前，先将鹰豆水（aquafaba）与砂糖一起煮。我在一个名为 Project
    Vegan 的博客上找到了这个配方，该博客由一位住在伦敦的素食者 Tom 运营。博客上图片的马卡龙外壳很有质感，而且配方中没有食用色素，是天然的。但这个配方的精准性吸引了我的目光，它以克的形式提供了我应该将鹰豆水和糖熬到的程度。我在草稿上简单算了一下数学题，算出重量加上一半后会是多少。


    另一个让我彻夜难眠的变量是我的烤箱温度。感觉有些不对劲。我按照 Tom 的配方挤出的外壳很厚，比这还要厚，他建议让它们静置一小时。在静置期间，我用温度计校准了烤箱。当烤箱显示为
    250 度时，温度计显示约为 295 度。我的烤箱背叛了我。我发现将温度设定在 225 或 230 度，得到的结果更接近 250 度。通常我会感到很沮丧，但我发现自己反而充满了希望：更好地控制烤箱温度可能会带来更好的结果。


    我烘烤的第一盘是迷你马卡龙。Tom 的配方建议在烤箱中烘烤整整 40 分钟，然后关烤箱并开门留一小时让它们晾干。当我打开烤箱从硅胶垫（Silpat）上取起一个迷你马卡龙时，它完整地脱落下了。它并不是一个令人作呕的烂团。它是一个不完美的马卡龙，但终归是一个马卡龙。这实际上是我为止能挤出的最好的一批。我喜得想哭。同时我也在心里咒骂这些马卡龙：得意，你们这群小混蛋，我终于赢过你们了。


    第二批是普通尺寸的，需要 45 分钟才能烤好。此时，不知已经是下午 1:30 了。所以当我关掉烤箱时，我让马卡龙留在里面开门去睡觉了。第二天早上，我检查了它们：它们还在那里，很容易地从垫子上取下，而且有很大的“脚”。它们有些空心，看起来就像直接从水泥搅拌机里出来的，但当我进行测试——夹上素食奶酪和我从冷冻室拿出的瑞士式蛋白霜奶油时——它在大脑中响起了马卡龙的成功信号。终于——终于！我做出了看起来像合格马卡龙的东西。


    下班后，我让 Will 和 Sinclair 帮我做晚餐——味噌汤配荞面，配上烤西兰花、红薯和鹰嘴豆——同时我用立式搅拌机制作素食香草蛋白奶油霜，然后将那些略微扭曲的马卡龙壳进行匹配，填入奶酪和奶油。我告诉
    Nola：这次要拍下填好马卡龙的照片。我很兴奋让她尝试它们。


    在 Steingarten 关于血肠（boudin）的文章中，他前往法国学习如何从头开始制作血肠——从宰猪到最后的装罐。做完血肠后，他与宰猪的厨师和农夫一起吃了一顿名为“猪肉宴”（fête
    cochon）的庆祝晚餐，Steingarten 写道，“午饭后他只想做的就是踉跄着走向软床，昏睡一两两天。”然而，明天我又要面对一堆用完的无盐鹰嘴豆罐，用来做某种餐点——也许用柠檬焖，配上藜麦和红薯泥？Will、Sinclair
    和我开始厌倦以无盐鹰嘴豆为主角的菜了。


    做完血肠后，Steingarten 回到法国再次尝试，这次只有他的朋友们。小组从早上 9 点开始项目，到晚上 7 点完成血肠的罐头封口工作。到那时，Steingarten
    写道，他们正“无神地盯着空间”。他们随后必须将密封的罐头煮三 小时。在离开巴黎前往纽约之前，Steingarten 和他的朋友尝试了他们的黑血肠（boudin
    noir）。“我们像在天堂，至少最初是这样，”写道，“我们更成熟的判断是，味道和口感近乎完美，但血相对于肉的比例稍了一点。”


    我只记得他在文章中描述的那种快乐和满足感——这是一场简单却执着且细致的旅程，拥有比我通常能获得的更丰富的资源，除了新鲜的加拿大柠檬。去年冬天当我第一次开始做素食马卡龙时，我本以为只需要几次尝试，就能拥有一项新技能，偶尔拿出来送给那些不吃或不能吃蛋的朋友了。但事实并非如此。相反，这种追求激活了我性格中那个在数学考试中只得
    90 分时感到失望的部分。我忘记了那种在追求完美的道路上扎根内心的感受。


    在烘烤阶段，马卡龙膨起得非常惊人——但升得太高了，而且歪斜。尽管如此，当我打开烤箱从硅胶垫上取起一个迷你马卡龙时，它完整地脱落下了。它并不是一个令人作呕的烂团。它是一个不完美的马卡龙，但终归是一个马卡龙。这实际上是我为止能挤出的最好的一批。我喜得想哭。同时我也在心里咒骂这些马卡龙：得意，你们这群小混蛋，我终于赢过你们了。

