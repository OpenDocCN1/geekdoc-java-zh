    Alison Herman 在 2019 年为《The Ringer》写的一篇文章深入探讨了为什么《纽约时报烹饪》的评论区如此出色，而许多其他食谱评论区却糟糕透顶。文章以
    Daniel·拉弗（Daniel Lavery）对糟糕评论区的嘲讽开篇：“我没有鸡蛋了，所以我用香蕉-奇亚籽-亚麻籽糊代替了它们。结果糟透了；这道食谱也太糟糕了。”这是错误的替代方式。


    但 Herman 继续写道，《纽约时报烹饪》的评论——或者编辑 Sam Sifton 所称的“笔记”——与众不同。“烹饪区的评论是真正的增值性的，具有现成的见解，而且最棒的是，它们激发了我对同胞发自内心的友谊，”Herman
    写道。


    与许多地方不同，烹饪区的“笔记”提供了提示、解释、技巧和良好的替代方案。Herman 的受访者甚至深入到了细节，以至于文章短暂地转到了什么是食谱（Sifton
    说：“万物都是其他东西的衍生物”）。这些评论是经过审核的；没有太大价值的笔记会被拒绝，永远无法得见烤箱的光亮。


    脱离版面的束缚，释放到播客那种自由的对话风格中，Nosrat 的《家常烹饪》（*Home Cooking*）食谱也是如此。它们变成了一个口头图表，教你如何解读一个最终对每个人看起来都略有不同的餐的想法。她提供了某些食物处理方式背后的原理——这有助于菜肴变得酥脆、调味恰当或入口即化——但这种方法也对她的听众有很大的信任。


    同样的方法出现在 Nosrat 的基础著作《盐、脂肪、酸、热》（*Salt, Fat, Acid, Heat*）中，她在她在 Chez Panisse 实习大约一年后开始写这本书的。“盐、脂肪、酸和热是引导每一道菜肴基本决策的四个元素，无论如何，”她在引言中写道。这是
    Nosrat 理解烹饪并传播相关知识的结构，在她解释自己为什么以及如何做这些事情时，这种结构贯穿全书。


    Nosrat 的顿悟发生在她在 Chez Panisse 烹饪和学习一段时间之后，她开始从对肉块、精细鱼片、油炸食品和调味的处理中识别出模式，随着餐厅菜单的每日变化。理论与实践。


    更复杂的是创造学习的空间和机会——我猜 Chez Panisse 的实习名额是有限的。喂养儿童并将厨师和农民带入课堂的食品安全计划有所帮助，而且它们在国家某些地区正在经历复兴。实践，包括与朋友或家人一起进行，以及获取像
    Nosrat 那样进入技术领域的食谱，也可以帮助家庭主厨提高他们的即兴技能。（阿尔尔顿·布朗 Alton Brown 的食谱和电视节目、Bon Appetit
    测试厨房以及 Serious Eats 都是解释食材“为什么”和“如何做”的更多资源——使人们可能更好地理解如何替代它们以及何时不该替代。）这些是我用来咨询的食谱类型，用以学习如何制作和改进从泡芙丽饼、酸奶油到洋葱圈的一切东西。因为我们对烹饪和烘焙的底层科学和理论了解得越多，我们就越能根据花园和储藏室里的现有物品来适应任何给定的食谱。从而做出良好的替代，而不是糟糕的替代。


    “华丽被高估了，”Nosrat 在《家常烹饪》第一集接近结束时对嘉宾 Josh Malina 说道，Josh Malina 刚刚详细描述了他的土豆饼（latke）食谱，然后用较少细节描述了一些混合了番茄香菜泥的
    Instant Pot（即压力锅）黑豆，并补充说他是一个更偏于扎实主食型的厨师，而不是华丽型的厨师。


    没有被高估的是利用你现有的东西制作令人满意的食物并与他人分享。没有被高估的是理解什么会触动你的渴望，或者如何为你一位对过敏敏感、素食主义者或要来吃晚餐的朋友调整你喜爱的食物。


    当一餐饭或一种原料陌生时，食谱提供了一个通往新事物的方法。随着它变得越来越熟悉，看到它的结构以及你可以用什么来交换就变得可能了。这部分是任何有价值的食谱的心脏。而这种熟悉和理解，正是我整个烹饪生涯一直在追求的目标。


    享受华丽的东西并没有错。但也可以舍弃华丽，转而追求个人的满足感、触手可得的东西、适合你的东西——将烹饪和烘焙看作一种一生的炼金术追求，目标是使整体大于部分之和。


    ## 羽衣甘蓝青酱：替代的颂歌


    传统的青酱，或 *pesto alla Genovese*，是由罗勒、大蒜、松子、帕玛森帕奶士、橄榄油和盐制成的，理想情况下使用研钵和研杵制成。（“Pesto”和“pesto”具有相同的词源。）


    在我拥有花园之前，我并不理解为什么有人会吃除了经典款的任何东西——罗勒是世界上最好的风味之一。在拥有花园后，我意识到：羽衣甘蓝的生长长期长得不可置信，只要你的土壤基本还可以，它基本上就是自己生长的。在加拿大某些几乎没有植物能在户外生存的季节，它也是可用的。


    这种青酱是一个高度可替代的食谱。对青酱更宽泛的定义也允许你用过量的甜根、大蒜梗、胡萝卜叶、欧芹，甚至是更软的绿叶蔬菜（如菠菜和水菜）。如果你没有花园，你甚至可以采集春天长出的荨麻。处理荨麻时，请戴上手套并摘掉叶子。


    ### 配料


    - 1 大把绿叶：羽衣甘蓝、甜根、荨麻、胡萝卜叶、菠菜或水菜

    - 1/2 杯生坚果：核桃、南瓜子或开心果

    - ½ 杯橄榄油

    - 2 瓣大蒜

    - 一把碎的帕玛森奶士

    - 一小撮盐

    - 挤一点柠檬汁（可选）


    1. 在干锅中烘烤坚果，直到闻到焦香的香味。离火备用。

    2. 洗净并彻底干绿叶并准备好。对于荨麻，在沸水中短烫一下。

    3. 将烤过的坚果、大蒜和帕玛森奶士放入食物处理器中；脉冲直到坚果和大蒜切碎。

    4. 加入绿叶。在食物处理器低速运转时，淋入橄榄油，直到变得相对光滑。如果有点颗粒且绿叶带有质感也没关系。

    5. 加入胡椒和盐调味。

    6. 挤入柠檬汁以提味并抵消任何苦味。


    ## 花园将再次绽放


    2021 年第一个破土的种子是西芹。接着是佛柑和柠檬草，然后是缓慢长出的葱。它们的绿色在深褐色和珍珠岩白色土壤中是微小的针点；在我厨房里明亮的生长灯下，它们开始舒展、向上生长。


    我们住在四分之一英亩土地上，可以俯瞰太平洋，那里的微气候比周围地区温暖，足以让番茄在户外生长茂盛。但不足以让辣椒或茄子生长。后院由木屑路径隔开床位组成，有几个六英寸高的抬起床和一个英尺高的抬起床。Will
    和我共享这些床。大约三分之一是她繁殖树木和灌木的苗床，三分之二是蔬菜床。

