    Array length = %d\\n\", sArray1.length);\n    }\n}\n```\n\n> Note: As you will\
    \ observe, the length of the array is the number of allocated spaces in the array,\
    \ not the number of occupied spaces.\n\nWrite a program which instantiates an\
    \ integer array named intArray1. Print out the length of the array using the field\
    \ of arrays.\n\n```\npublic class PracticeYourJava {\n    public static void main(String[]\
    \ args) {\n        int[] intArray1 = new int[50];\n        int length = intArray1.length;\
    \ // The length of the array\n        System.out.printf(\"The length of the array\
    \ is %d\\n\", length);\n    }\n}\n```\n\nState the difference between the following\
    \ two initialization methods for an array:\n\n```\nint[] intArray1 = new int[50];nintArray1[0]\
    \ = 10;\nintArray1[1] = 11;\nintArray1[2] = 12;\nintArray1[3] = 13;\nintArray1[4]\
    \ = 14;\n```\n\n```\nint[] intArray1 = new int[] {10, 11, 12, 13, 14 };\n```\n\
    \nIn this example, there is no difference at. The second method is convenient\
    \ when you are hardcoding arrays into a program and also want the length of the\
    \ array to match the number of elements you are initializing it with. In this\
    \ case (the second case), the compiler infers the desired number of elements of\
    \ the array by counting the number of comma separated items in the package.\n\n\
    The benefit of the first initialization method is that we can declare the array\
    \ to be of a size greater than the number of elements we initialize it with, as\
    \ opposed to the second method the compiler only allocates as many spaces to the\
    \ array as the number of elements specified at instantiation.\n\nNonetheless,\
    \ irrespective of whichever method is chosen, Java provides an indirect way to\
    \ modify the number of allocated spaces in an already existing array. We will\
    \ see this in a later exercise.\n\nYes or No: Does Java initialize the values\
    \ in an array?\n\nYes. The reader should contrast this with the fact that Java\
    \ does not initialize individual variables.\n\nWhat are the elements of an array\
    \ of numerical primitives initialized by default?"
