  md: '# Practice Your Java Level 1


    ArrayList, to name a few. Using "*" (i.c. java.util.*) lets the compiler see all
    of these types for potential compilation with our application code.

    You are free to specify the individual types that you want to use directly in
    an import statement; for example you can import java.util.HashMap; instead of
    java.util.*; if you know the HashMap class is the only item in the package java.util
    that you want to use in your program. Precise selection only makes compilation
    faster, it doesn''t have any impact on the size of your program.

    You can create your own packages. In the code example above, we are putting the
    contents of the program in a package named practiceYour. In fact, the IDE might
    prompt you to specify a package name when you create a class. If you don''t define
    a package, the IDE might use the "default package", which doesn''t have a name
    and its contents cannot be referenced from other packages.

    We also see in our code importation of the packages java.io.file.* and java.io.file.,
    with observation of name we see that the first package name is a subset of the
    first. If not, the concept of nested or sub-packages does not exist in Java. They
    are different packages whose have been made similar just to show the relationship
    between their contents.


    Default imports

    Java by default imports the following:


    +   (1) the package java.lang.* which contains a lot of useful classes such as
    the class Math

    (2) the other types of the package that your code is a part of


    In summary: a package is a grouping of types. You must state in the package that
    you want to import any package which contains you in your application


    > Note: A good IDE will inform you as to need to import a given built-in package
    when you are referring in your code to any of the contents of the package in question.


    In the code block presented at the beginning of the chapter, we see the following
    statement:


    ```

    public class PracticeYourJava {

    ```


    What does it mean?

    It means we are creating our class that we have named PracticeYourJava.

    All code in Java applications is in a class,

    The keyword public means this class is accessible by any other class.

    In this way we will use a good number of built-in classes and essentially create
    our own.


    True/False: In Java, should each type (class, interface, enumeration, etc) that
    you create when you direct it be in its own file?

    True. The file name should also be the name of the contained type, with .java
    applied to it. For example, the class PracticeYourJava should be in a file named
    PracticeYour.java.


    What is the concept of a "class"?

    In Java, a class is the result of the compilation process applied to a java.file.
    The content of this file is the compiled bytecode that the Java Virtual Machine
    (JVM) runs. The output file is the same name as the input, however with an extension
    of .class. This bytecode is unique to the language Java. You can think of it as
    "java code",


    What is the Java Virtual Machine (JVM)?

    The Java Virtual Machine (JVM) is the software in which your Java applications
    run, as programs do not run directly on the processor unless you say a program
    in C. The JVM interprets your classes (which are contain) and translates them
    into instructions for the particular environment (Windows, UNIX, Linux, etc) that
    Java is running.

    The JVM runs directly on the processor. The existence of the JVM concept is what
    facilitates Java’s "write once anywhere", as the bytecode in the class is understood
    as "machine code" which makes all JVM objective of the operating system or microprocessor
    that they are running on, understand and translate for their particular environment.


    What is the name of the method for which the compiler allows to invoke/execute
    when you want your program to run?

    The method main.

    Every class that you run directly must have a method named main (method names
