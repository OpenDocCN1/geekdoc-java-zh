  md: '# # Appendix A. Classes, Objects & Methods: An Introduction


    This Appendix presents the concepts of classes and objects and then presents the
    implementation of these concepts in Java. The reader who is new to the concept
    of classes and objects should rest assured that the basic concepts of classes
    and objects are actually simple.


    Following this, an introduction to the concept of methods in Java is made.


    # Classes & Objects


    We start with the question, *What is a class?* We explain by analogy, our first
    analogy using human beings.


    The concept of human beings is a *class*


    You reader are an *instance* of the class of human beings


    Your father is an instance of the class of human beings


    Your mother is an instance of the class of human beings


    We use dogs as another analogy. We''ll assume that you have a dog and your neighbor
    has two dogs.


    The *class* is *Dog*


    Your own dog is an instance of the class Dog


    Your neighbors'' two dogs are each instances of the class Dog


    In Java code, the class that represents human beings can be written as follows:


    ```

    class HumanBeing{

    }

    ```


    We''ve just written the basic code for a class HumanBeing to represent human beings.


    To create the instances of the class (you, father, mother), the code for each
    class is simply as


    ```

    Human be = new HumanBeing();

    Human father = new HumanBeing();

    Human mother = new HumanBeing();

    ```


    Think of a class as simply being a template. Each instance of the class has all
    the attributes that we listed in the template (we haven''t put any in so so far
    for the class HumanBeing).


    For the *Dog* analogy we can have the following class definition:


    ```

    class Dog{

    }

    Dog myDog = new Dog();

    Dog neighborDog1 = new Dog();

    Dog neighborDog2 = new Dog();

    ```


    That really is the basic concept of classes and objects.'
