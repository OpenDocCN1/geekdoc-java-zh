  md: '# Chapter 18. Console Handling III: Command Line Input


    There are a significant number of programs in existence which are run directly
    from the command line or invoked by other programs without any direct user input.
    A number of these programs require parameters to be passed to them on the command
    line (or by calling program) at the time of invocation. This chapter presents
    exercises which ensure understanding of how programs receive and process command
    line input that is passed to them on invocation.


    **Note:** The exercises in this chapter must be run directly from the command
    line and not from an IDE.


    | 1. What does the information in the brackets in the following method declaration
    mean?

    static void main(String[] args)

    It means that this method is expected to be an array of Strings. This method main
    in which is invoked by the operating system, means that this method is expecting
    an array of String may be passed to it by the operating system (or whatever program
    invokes this program directly). It is acceptable that an empty array be passed
    to it, in which case the number of elements in the String args will be 0. |

    2. What is the type that command line input is interpreted as?

    Command line input is always interpreted as a String.

    This implies that if we are expecting numerical input, we will have to use the
    Integer.parseInt, Long.parseLong and such methods to convert the strings to numbers.
    |

    3. Write and test a program that can receive any number of integers from the command
    line. Print the number of command line arguments received and also print each
    argument value out in the following format:

    argument[xx] = value

    public class ConsoleHandling {

    public static void main(String[] args) {

    System.out.printf("Number of args=%d\n", args.length);

    for (int i = 0; i < args.length; i++) {

    System.out.printf("argument[%d] = %s\n", args[i]);

    }

    } |

    4. Write a program which receives the first and last name of a person, in that
    order, on the command line. Print these out to the console in format <lastname>
    <firstname>. If anything other than two arguments are entered, output the statement
    "Please pass exactly 2 arguments." and then exit the program. Remember to run
    the program from command line.

    public class ConsoleHandling {

    public static void main(String[] args) {

    if(args.length!=2) {

    System.out.printf("Please pass exactly 2 arguments.");

    System.out.exit(0);

    }

    System.out.printf("%s, %s\n", args[1], args[0]);

    } |

    5. Write a program which takes an unlimited number of integers from the command
    line and does the following:

    1. Adds them up and print out the sum of the integers presented on the command
    line. If any non-integers are presented, ignore them.

    2. Prints out how many integers were passed on the command line.

    3. Prints out how many arguments were presented on the command line.

    Hint: Long.parseLong |'
