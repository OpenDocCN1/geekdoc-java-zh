    \        System.out.println(\"bits occupied = %d\" + Float.SIZE);\n    }\n}\n\
    ```\n\n+   35. Write a program that prints out the smallest positive float that\
    \ Java supports.\n```java\npublic class PracticeJava {\n    public static void\
    \ main(String[] args) {\n        System.out.printf(\"smallest positive float =\
    \ %f\" + Float.MIN_VALUE);\n    }\n```\n\n+   36. Why does java have a suffix/F\
    \ applied to the variable of a type of float?\nThe reason is because Java assumes\
