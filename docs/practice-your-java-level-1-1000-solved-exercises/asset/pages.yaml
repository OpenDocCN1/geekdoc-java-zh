  md: "# Chapter 31. Enumerations II\n\nThis chapter, entitled Enumerations II, is\
    \ a continuation of the previous chapter Enumerations I. In Enumerations I, exercises\
    \ which ensured an understanding of the basic functioning of enumerations in Java\
    \ was presented. This chapter extends the previous chapter by presenting exercises\
    \ which pertain to the extended capabilities of enumerations in Java.\n\nFrom\
    \ the previous chapter on enumerations we know that in Java enumerations are classes\
    \ and have thus most of the features of classes. The exercises in this chapter\
    \ focus on expanding our skill and understanding enumerations more fully as the\
    \ classes and instances that they are.\n\n+   1. Explain what the code shown below\
    \ is and what its implications are:\n```java\npublic enum Gender {\n    MALE(10),\
    \ FEMALE(20);\n    private final int value;\n    public int getValue(){\n    \
    \    return value;\n    }\n    private Gender(int value){\n        this.value\
    \ = value;\n    }\n}\n```\n\nIt was stated in the chapter I that an enumeration\
    \ class is a special kind of class which has all the objects that can be instantiated\
    \ from within the class definition itself. It was also stated that objects are\
    \ considered to have an ordinal that is directly derived from their order of declaration\
    \ within the enumeration class in question.\n\nSince we stated that enumerations\
    \ are objects of their particular class, like any class, an enumeration can have\
    \ constructors. Again, because enumerations are objects, they can have initialization\
    \ parameters passed to their constructors. We see in this example two enumerations\
    \ MALE and FEMALE, being presented with the values that we want to pass to their\
    \ constructor; in the case of the enumeration Gender.MALE, we want it to pass\
    \ the value 10 to its constructor and for the enumeration Gender.FEMALE, we want\
    \ it to pass the value 20 to its constructor.\n\nNow, like for each class, the\
    \ initialization parameters can be chosen as we choose; in this case, we happen\
    \ to be storing them in a variable within the class. A method named getValue has\
    \ been created with which access this variable.\n\nAgain, think of enumeration\
    \ as a special kind of class whose objects and their constructor parameters are\
    \ specified within it at class time. You can actually learn enumerations to a\
    \ variant of the singleton pattern?\n\nIf we want to use any of the enum initialization\
    \ parameters to represent the relative order of the enum objects, we would have\
    \ to override the compareTo method or do order comparisons using a method that\
    \ we have ourselves created. In this example we use the getValue method that we\
    \ created to do order comparisons, the natural ordinal of the enum is irrelevant\
    \ to us and we can insert objects into the class definition in any order that\
