  md: "# Chapter 14. Number Handling V – Unsigned Integers\n\nIn this chapter, we\
    \ look at the topic of unsigned integers in Java. This feature, existent in many\
    \ other languages, has now had support for it added to Java as of version 8.\n\
    \nThis chapter is the fifth of five chapters in this book on number handling in\
    \ Java.\n\n| 1. | Explain what an unsigned number is. An unsigned number is one\
    \ that is always non-negative, 0 or higher. The word \"unsigned\" means that the\
    \ number does not need to have a sign in front of it, i.e. the non-negative numbers.\
    \ |\n| 2. | Describe briefly the difference in internal storage between a signed\
    \ and an unsigned number. With a signed number, the most significant bit in the\
    \ set of bits represents the number used to identify the sign of the number. This\
    \ implies that there is one less bit for representing the actual value in such\
    \ a case. With unsigned numbers, since integers are known to be positive any bit\
    \ can represent the sign of the number and thus the full set of bits allocated\
    \ can be used to represent the numerical value. For example, int represents integers\
    \ using 32 bits. However, the highest bit represents the sign, leaving us with\
    \ 31 bits for representing positive and negative int values. For an unsigned however,\
    \ all 32 bits are used to represent the numerical value. |\n| 3. | List the types\
    \ in Java that support unsigned types. The types in Java that support unsigned\
    \ types are the types int and long. Note that the support is largely implemented\
    \ through specific methods in the Integer and Long classes; no new primitives\
    \ or classes have been created to support these types. |\n| 4. | What is an unsigned\
    \ \"int\" in Java? An unsigned int in Java is a number which occupies the same\
    \ space as the integer type int which is a signed type. Being that the int occupies\
    \ 32 bits, of which 31 are used for the value and the highest bit for the sign\
    \ of the number, an unsigned int, not needing a bit for its sign is free to use\
    \ the 32 bits to represent a number |\n| 5. | What is unsigned long? An unsigned\
    \ long is a number which occupies the same space as the long type which is a signed\
    \ type, however as an unsigned int, the unsigned long does not use the uppermost\
    \ bit as a sign and therefore it can use the full space allocated to a long to\
    \ represent a number. |\n| 6. | How does unsigned int work? Interestingly, Java\
    \ uses the int primitive to store unsigned int values, since the int primitive\
    \ does indeed have 32 bits which is the space that an unsigned int requires. However,\
    \ Java provides specific methods to use for storing unsigned numbers into int\
    \ variables. |\n| 7. | What is the numerical range supported by an unsigned int\
    \ in Java? 0 to 2^32 - 1 = 0 to 4,294,967,295 |\n| 8. | What is the numerical\
    \ range supported by an unsigned long in Java? 0 to 2^64 - 1 = 0 to 18,446,744,073,709,551,615\
    \ |\n| 9. | Explain the result of attempting to compile the following code: ```java\n\
    class PracticeYourJava {\npublic static void main(String[] args) {\n int01=4294967290;\n\
    }\n```\nThe code will not compile, because we attempted to assign a value greater\
    \ than Integer.INT_MAX to an int. |"
