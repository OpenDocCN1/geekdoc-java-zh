  md: "# Practice Java Level 1\n\n| | computations within that class are to conform\
    \ to the strict-FP requirement.\nThe keyword strictfp only applies to the floating\
    \ point types double and float.\n2 | What is the concept behind the existence\
    \ of the class StrictMath?\nThe class StrictMath exists to ensure strict reproducibility,\
    \ to the bit level, the output of mathematical operations in Java irrespective\
    \ of the platform on which the mathematical operations are run.\nCertain applications\
    \ require bit-level reproducibility across the different platforms on which the\
    \ program may be run. Implementation of the class Math only requires accuracy\
    \ within a \"high tolerance\"; there may be slight variations in the output due\
    \ to the different hardware on which the program is run or differences due to\
    \ the choice of algorithm for implementing the floating point method in question.\n\
    The strict reproducibility is achieved by specifying the algorithm that each method\
    \ in StrictMath utilizes to compute results on different platforms (software,\
    \ not hardware) algorithms.\nYou can consider that any computation using StrictMath\
    \ is effectively strictfp.\n3 | What is the difference between Math methods and\
    \ their StrictMath counterparts?\nThe StrictMath methods can generally be expected\
    \ to be slower as they are more often than software algorithms.\nIn some implementations,\
    \ the Math methods are produced to call their StrictMath equivalents. However\
    \ even in cases the virtual machine is free to use specific functionality for\
    \ such methods, in short, it is free to ignore the use of StrictMath in such cases.\n\
