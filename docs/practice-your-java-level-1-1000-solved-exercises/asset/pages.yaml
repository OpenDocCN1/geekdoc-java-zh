  md: "# Chapter 22: Classes I1\n\nScenario 1: field vs. parameter disambiguation\n\
    If example I have a class Car that has a field color defined as:\n\n```\nclass\
    \ Car {\n    private String color;\n}\n```\n\nIf the class has a method setColor(String\
    \ color){...} whose function is to set the field color of a Car, a problem arises\
    \ because the parameter name in the method declaration matches the field name\
    \ in the class itself. You see we can't say:\n\n```\nsetColor(String color) {\n\
    \    color = color;\n    // Our intent is that the 1st color is the object field\
    \ and the 2nd color\n    // the parameter passed to the method. The compiler however\
    \ can't tell which is.\n```\n\nSuch a statement is confusing because it is not\
