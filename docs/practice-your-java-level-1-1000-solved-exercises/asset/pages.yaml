    +   67. Why would you want to cast variables?

    nYou would want to cast variables in scenarios where you want the contents of
    a casted variable to be put into a different type.


    For example, if you have an int a=10 and given its small value is, I want to put
    it into a variable of type byte (which supports values from 0 to 255), I would
    cast it as:


    ```

    byte c= (byte)a;

    ```


    This line is taking a copy of the contents of int a and stuff into the format
    of a byte as best as you can.


    If I have to cast an int and a long and want the resultant value to be put into
    an int, due to the fact that the target variable has a smaller width than at least
    one of the input variables, input variables that are larger than the output variable
    can be cast to the width of the target variable. We see the following example:


    ```

    long a=10;

    int result = (int)a + b;

    ```


    Some are more dramatic. For the char type (which represents characters) can be
    cast into an integer representation. For example:


    ```

    char letter = ''A'';

    int integerEquivalent = (int)letter;

    ```


    With this, you are now able to facilitate the sorting of characters because they
    have an explicit numerical representation, which lends itself to ordering by magnitude.


    You can also cast objects. For example, if you have the following object of a
    class named Road:

    Road x = new Road();


    I can, if I desire, cast the object out to an object of the ultimate ancestor
    class Object as:

    Object y = (Object)x;


    (The casting of any object to any of its ancestor classes is feasible by the concept
    of polymorphism)


    I can cast y back to an object of class Road as:

    Road z = (Road)y;


    As previously, for numerical values you will lose data casting if you try to cast
    a variable which contains a higher value than the target variable support. For
