  md: "# # Chapter 9. Number Handling II – Numeric Wrapper Classes\n\nAs stated in\
    \ the chapter Number Handling I, the numeric primitives have corresponding wrapper\
    \ classes (Integer, Float, Byte, Short, Long and Double); we had in that chapter\
    \ used some of the constants from the wrapper classes. This chapter presents exercises\
    \ that focus on the numeric wrapper classes.\n\nThe functionality of the wrapper\
    \ classes can largely be broken up into the following groups:\n\n+   - Constants\
    \ that respect their respective primitives (already seen in the chapter Number\
    \ Handling I)\n- Methods and means (boxing/autoboxing) which convert between the\
    \ primitive and its wrapper class\n- Methods which mimic the functionality of\
    \ the primitives\n- Methods which provide additional functionality for their respective\
    \ primitives\n\nIt should be understood that at the present wrapper classes do\
    \ not provide the full functionality of their respective primitives, but might\
    \ provide new functionality and in some overlapping functionality. Nonetheless,\
    \ to enjoy the full functionality of Java one must be conversant with the primitives\
    \ and their wrapper classes.\n\nGiven the natural relationship of the primitives\
    \ to their respective classes, we will also see a more of exercises in this chapter\
    \ that show the auto-boxing/unoboxing of primitives and their respective classes.\n\
    \nThis is the second of five chapters in this book on number handling in Java.\n\
    \n| The corresponding wrapper classes for the following primitives: byte, short,\
    \ int, float, double. | The wrapper classes are (respectively): Byte, Short, Integer,\
    \ Long, Float and Double. |\n|---|---|n| 1. | Write a program which instantiates\
    \ an object of class Integer, with an initial value of 5. Use the **operator**.\
    \ | ```java\npublic class PracticeJava {\n    public static void main(String[]\
    \ args) {\n        Integer i = new Integer(5);\n    }\n}\n```\n``` |\n| 2. I have\
    \ an int k, with a value of 53, Instantiate an object of class **Integer** using\
    \ the **k** as the initialization parameter. | ```java\npublic class PracticeJava\
    \ {\n    public static void main(String[] args) {\n        int k = 5;\n      \
    \  Integer int0 = new Integer(k);\n    }\n}\n``` |\n| 3. What is the concept of\
    \ **boxing** The concept of boxing is by which code can be written in Java to\
    \ take a primitive type and create its equivalent wrapper object by using the\
    \ primitive type as a parameter to initialize the corresponding wrapper class.\
    \ For example if we assign an int **j** with a value of **100** to an object of\
    \ its corresponding class **Integer** the code would be as follows: ```java\n\
    int j = 100;\nInteger boxedEquivalent = new Integer(j);\n```\nWe have seen this\
    \ in the immediately preceding exercise; its formal name is *boxing*. |\n| 4.\
    \ What is the concept of **auto-boxing** This feature is the automated version\
    \ of boxing. Auto-boxing is the name of the Java feature by which we create a\
    \ wrapper class object by assigning a primitive value to it without the use of\
    \ standard object creation syntax (i.e. use of the **keyword** new). For example,\
    \ if we want to represent an int j as an object of its corresponding class **Integer**\
    \ the code would be as follows: ```java\nInteger boxedEquivalent = j;\n``` |"
