  md: "# Practice Your Java Level 1\n\n+   22. (IMPORTANT) Describe the actions undertaken\
    \ by a constructor when it is invoked.\nIn Java, the creation of an object invokes\
    \ its constructor to, as its first order of business, invoke a designated constructor\
    \ in its superclass (which is the parameterless constructor by default) before\
    \ its own body runs. The constructor of the parent will in turn invoke a designated\
    \ constructor in its superclass (the parameterless constructor is the default);\
    \ before its own body, and a designated constructor in its own parent, before\
    \ its own body runs, all the way to the top of the inheritance hierarchy at which\
    \ is the Object is the ultimate ancestor class of all classes. In short, a constructor\
    \ of each ancestor class, starting from the body of the constructor at the top\
    \ of the inheritance hierarchy of the class (which is always the class Object),\
    \ ending with the body of the constructor of the object being instantiated.\n\
    If the immediate superclass does not have a parameterless constructor and neither\
    \ have you specified in your constructor that you should invoke a different constructor\
