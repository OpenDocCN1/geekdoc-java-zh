  md: "# Practice Your Java Level 1\n\n```\n{\n}\n}\n```\n\nfor loop\n5. Explain the\
    \ components and the functioning of a for loop, using the sample code below:\n\
    \n```\nint loopCounter;\nfor(loopCounter=3; loopCounter < 10; loopCounter++)\n\
    {\n    // do action\n}\n```\n\nThe control section of a for loop consists of the\
    \ following elements:\n\n+   1. The keyword, for brackets the other control elements\
    \ are semi-colon separated within the brackets.\n2. The other control elements\
    \ are semi-colon separated within the brackets.\n\nIn the brackets, we have, in\
    \ the order:\n\n+   1. A statement indicating that the control variable of the\
    \ for loop, with its initial value specified. In our example above, we that our\
    \ loop counting named loopCounter has an initial value of 3. Note that the initialization\
    \ of the control variable not to be done inside the control section of the for\
    \ in each case, the initialization section of the for loop will be left blank.\n\
    2. A conditional statement that states the condition while true permits the for\
    \ loop to continue running. In our example we are saying \"keep performing this\
    \ loop while the variable loopCounter is less than 10\".\n3. Finally, an increment\
    \ statement, which indicates the incremental value to add to the loop counter\
    \ after each iteration of the actions that are supposed to be performed in the\
    \ statements by the for loop are performed. In our example, we indicate that the\
    \ loop counter loopCounter should be incremented by 1.\n\nThe body of the for\
    \ loop is shown in this example as:\n\n```\n{\n    // do action\n}\n```\n\nThese\
    \ braces immediately follow the for loop surround the code that is to be run on\
    \ each iteration of the for loop.\n\nA for loop is, in a sense, a repackaged while\
    \ in Java. This can be said because its conditional statement says \"while this\
    \ condition is true, continue looping\".\n\nNotes\n\n+   1. If you have only one\
    \ line that you want to be performed for each iteration of a for loop, there is\
    \ no need to put braces around the single line to run. For example we would write:\n\
    \n```\nint loopCounter;\nfor(loopCounter=3; loopCounter < 10; loopCounter++)\n\
    single line of action.\n```\n\n+   2. The loop counter can be declared directly\
    \ in the control section of the for loop. For example we write:\n\n```\nfor(int\
    \ loopCounter = 0; loopCounter < 20; loopCounter++)\n{\n    // do action\n}\n\
    ```\n\nThe scope of a variable declared in the control section is limited to the\
    \ scope of the for loop itself.\n3. Another point to note is that it is acceptable\
    \ for any (or all) of the loop control components to be missing! Only the two\
    \ semicolons in the control statement are mandatory.\n\n70"
