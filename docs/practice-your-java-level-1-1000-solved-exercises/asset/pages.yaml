    \ tests a given x is greater than 5 and a given y is greater than 7.\nTest the\
    \ program with the following combinations of x and y respectively and print the\
    \ result out after each test: (1,1), (6,7) and (15,15).\n\n# Solution #1\n\n```\n\
    public class PracticeYourJava {\n    public static void main(String[] args) {\n\
    \        boolean result;\n        int x,y;\n        x=1; y=1; result = ((x > 5)\
    \ && (y > 7)); System.out.println(result);\n        x=6; y=7; result = ((x > 5)\
    \ && (y > 7)); System.out.println(result);\n        x=15; y=15; result = ((x >\
    \ 5) && (y > 7)); System.out.println(result);\n    }\n}\n```\n\n# Solution #2\n\
    \n```\npublic class PracticeYourJava {\n    public static void main(String[] args)\
    \ {\n        boolean result;\n        int x,y;\n        x=1; y=1; result = ((x\
    \ > 5) & (y > 7)); System.out.println(result);\n        x=6; y=7; result = ((x\
    \ > 5) & (y > 7)); System.out.println(result);\n        x=15; y=15; result = ((x\
    \ > 5) & (y > 7)); System.out.println(result);\n    }\n}\n```\n\n+   13. What\
    \ is the difference between the two solutions presented to the preceding exercise?\n\
    \nThe first solution is using \"short-circuiting\" logical operator, whereas the\
    \ second is not.\n\n+   14. What is the difference between short-circuiting logical\
    \ operators and the regular logical operators?\n\nThe short-circuiting logical\
    \ operators stop as soon as the whole test is deemed to have failed/passed as\
    \ soon as the failure/passing of a sub-test of the test can be determined as causing\
    \ the failure/passing of the test there there would be no point in continuing/completing\
    \ the evaluation. Using the first test in the solution to exercise 12 as an example,\
    \ there is no point in checking to whether x > 7 when we know that x is less than\
    \ 5 and both parts of the test are required to be true. The non-short-circuiting\
    \ logical operators however evaluate the entire conditional statement instead\
    \ of stopping at a failed/passed sub-test.\n\nThe result of this difference is\
    \ that the short-circuiting logical operator can potentially perform better than\
    \ the regular logical operators.\n\n+   15. Write a program which tests x is greater\
