    ```

    int var01 = 75000;

    short var02 = (short)var01;

    ```


    Because the value of the var01 exceeds the maximum for a short, var02 definitely
    will not contain the value 75,000, but rather a distorted value.


    +   68. What is implicit casting?


    Implicit casting is a scenario where, given the operation at hand, the compiler
    will see it to fit the contents of a variable to a more appropriate type that
    is safe to cast the given type to.


