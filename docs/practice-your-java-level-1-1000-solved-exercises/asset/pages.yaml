  md: "# Chapter 16: Exceptions\n\n| Checked Exceptions (Mandatory-catch exceptions)\
    \ |\n| --- |\n| 15. Explain the concept of \"checked exceptions\".\nThere are\
    \ certain scenarios where Java insists that you make provision for catching exceptions\
    \ that may be thrown, the compiler will not compile your code. File handling is\
    \ one key area of Java programming you are mandated to catch for exceptions. |\n\
    | 16. Explain why the code below attempts to create a symbolic link to a non-existent\
    \ file will not compile and what state is required for it to compile.\n```java\n\
    import java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\n\
    import java.nio.file.Paths;\n\npublic class ExceptionTest {\n\n    public static\
    \ void A() {\n        String fileName = \"ThisFileNotExist\";\n        String\
    \ symlinkName = \"link01\";\n\n        Path targetPath = Paths.get(System.getProperty(\"\
    user.home\"), \"Desktop\", fileName);\n        Path symlinkPath = Paths.get(System.getProperty(\"\
    user.home\"), \"Desktop\", symlinkName);\n        Files.createSymbolLink(symlinkPath,\
    \ targetPath);\n    }\n\n    public static void main(String[] args) {\n      \
    \  A();\n    }\nnThe code will not compile because it contains methods whose potential\
    \ exceptions Java demands that we handle. I/O operations fall into that category\
    \ of \"you must catch\" exceptions; Java calls these \"checked exceptions\". There\
    \ are two ways to handle and these:\n1. standard try/catch handling\n2. the method\
    \ in which that can throw these \"checked exceptions\" must appear explicitly\
    \ and have a throws statement in its method declaration. For example, the header\
    \ of the method A() above in which the method Files.createLink which can throw\
    \ such an exception would be modified as follows:\n```java\npublic static void\
    \ A() throws IOException {\n```\nIf this is chosen, it implies that in the stack\
    \ call for method A() the exception(s) will be handled. In this particular, the\
    \ exception must be handled in the calling method, main(Note). Note that it is\
    \ still valid to apply try/catch blocks to catch the same exception directly within\
    \ the method.\nThe benefit of this mechanism is that it facilitates exception\
    \ handling in a central place, without blocks scattered all over the code. (Exercise\
    \ 22 shows the catching of an exception in a given method by an exception handler\
    \ in its calling method.)\nNotes\n1. Restatement: Even with this second mechanism,\
    \ it is still valid to apply try/catch blocks within the method which uses this\
    \ mechanism.\n2. If main() is the method with the throws <exception> clause in\
    \ its header, then clearly if the exception is not handled within main() itself,\
    \ the program will halt running when the exception occurs.\n```\n\n141"
