  md: "# Practice Your Java Level 1\n\n13. User-defined exceptions: creating your\
    \ own exception class\nJava provides the facility for you to define your own custom\
    \ exception classes. These look like any other exception class, that must be derived\
    \ from the Exception or any subclass thereof. With that in mind, we have the following\
    \ example:\n\nCreate a custom exception named DivideBy2Exception, of superclass\
    \ Exception.(Do not add any substantive code to the methods therein).\n\n*Note:\
    \ If you are using Eclipse IDE, it is easiest to do this using the class creation\
    \ template, simply specifying in the window that the superclass is Exception;\
    \ the IDE will present the stubs of the inherited methods to you.\n\n```\npublic\
    \ class DivideBy2Exception extends Exception {\n    public DivideBy2Exception()\
    \ {\n    }\n\n    public DivideBy2Exception(String message) {\n        super(message);\n\
    \    }\n\n    public DivideBy2Exception(Throwable cause) {\n        super(cause);\n\
    \    }\n\n    public DivideBy2Exception(String message, Throwable cause) {\n \
    \       super(message, cause);\n    }\n\n    public DivideBy2Exception(String\
    \ message, Throwable cause,\n        boolean enableSuppression, boolean writableStackTrace)\
    \ {\n        super(message, cause, enableSuppression, writableStackTrace);\n \
    \   }\n}\n```\n\n14. Throwing a user-defined exception\nWrite a program that divides\
    \ a given float by another (hardcode the values for testing). Throw your created\
    \ exception DivideBy2Exception when the divisor is divisible by 2.\n\nHave the\
    \ catch block for the exception print out:\n1. the message field of the exception\n\
    2. the phrase \"Divisor divisible by 2 exception\"\n\n```\npublic class ExceptionTest\
    \ {\n    public static void main(String[] args) {\n        float a = 10f;\n  \
    \      float b = 2f;\n        try {\n            if ((b % 2) == 0) {\n       \
    \         throw new DivideBy2Exception(\"Divisor divisible by 2 exception\");\n\
    \            }\n            float c = a / b;\n            System.out.println(c);\n\
    \        } catch (DivideBy2Exception e) {\n            System.out.println(e);\n\
    \        } catch (ArithmeticException e) {\n            System.out.println(e);\n\
    \        }\n    }\n}\n```"
