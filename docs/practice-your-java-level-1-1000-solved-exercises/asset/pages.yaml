  md: "# Chapter 20. Random Numbers\n\nThe ability to produce random numbers is an\
    \ important feature in such scenarios as the generation of random data for statistical\
    \ purposes, for adding randomness to computer games and particularly for cryptographic\
    \ applications. This chapter presents exercises that ensure your basic ability\
    \ to perform random number generation in Java.\n\nThe key class on which exercises\
    \ are presented in this class is Random.\n\n+   1. Initialization of the random\
    \ number generator\nWhat is the difference between the following two initialization\
    \ methods for the random number generator?\n1. Using a user seeded value\n2. Using\
    \ the built-in time-based seed for the generator\nIn the first case, you supply\
    \ the seed value. However if you use the same value again the random number generator\
    \ will simply generate the same random value.\nin the second case, you are ensuring\
    \ randomness to the built-in generator, which indeed uses the time-honored method\
    \ of using the system clock as one of the inputs in the generator\n\n+   2. The\
    \ JVM determine the seed, instantiate a random number generator object and print\
    \ out the first 10 values that it returns. Use the method *Random.nextInt().*\n\
    ```java\nimport java.util.*;\npublic class PracticeYourJava {\n    public static\
    \ void main(String[] args) {\n        Random randomGenerator = new Random();\n\
    \        int nextRandomValue;\n        for(int count=0; count < 10; count++){\n\
    \            nextRandomValue = randomGenerator.nextInt();\n            System.out.println(nextRandomValue);\n\
    \        }\n    }\n}\n```\n\n> Notes: Observe that the returned values can be\
    \ both negative and positive and span the range of an int.\n\n+   3. The JVM determine\
    \ the seed, instantiate a random number generator object and print out the first\
