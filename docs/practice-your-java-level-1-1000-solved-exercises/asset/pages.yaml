    This solution requires some background knowledge on how filesystems work. We present
    first a simplified view

    of how filesystems can track entries in order to answer the question.


    The filesystem has a "file directory" (think of a phone directory here), where
    it stores the following tuples of

    information about the files in a manner akin to the:

    (entry#, entry name, entry type, actual file location on disk, target)


    In our example, the file entry type will have the following F(file), D(Directory),
    S(Soft Symbolic Link),nH(Hard Symbolic).


    For the purposes of this illustration, that entry name as the resolved name of
    the directory in

