  md: "# # Chapter 1. For Starters\n\nThe intent of this chapter is largely to provide\
    \ a quick overview of introductory topics with which the reader may already be\
    \ fully acquainted; these topics pertain to the basic structure of Java applications\
    \ as well as a cornucopia of basic Java programming topics and concepts. As previously\
    \ stated, the exercises in this chapter are presented as a quick overview.\n\n\
    **Note:** The reader needs an introduction to the concepts of classes, and methods\
    \ should first read Appendix A.\n\nFirst, we present a sample program below; we\
    \ will reference it in one of the exercises in this chapter.\n\n```\npackage practiceYourJava;\n\
    import java.util.*;\nimport java.time.*;\nimport java.nio.file.*;\nimport java.nio.file.attribute.*;\n\
    ```\n\n```\npublic class PracticeYourJava {\n\n    public static void main(String[]\
    \ args) {\n}\n}\n```\n\n+   1. With respect to the code block shown above, what\
    \ does the statement package practiceYourJava; mean? This means that we are writing\
    \ to place in a \"package\" which we named practiceYourJava (the concept of package\
    \ is elucidated upon the next exercise).\n2. With respect to the code block above,\
    \ give a brief explanation of what the meaning of the statements import java.util.*;\
    \ import java.time.*; import java.nio.*; import java.nio.file.attribute.*; is.\
    \ Each of these statements refers to our intent to import a package; by \"import\"\
    \ means we are informing the compiler that we intend to use part of the contents\
    \ of the stated package(s) in our program. Our final program will be whatever\
    \ we write plus the particular nodes of the noted package we use in our program.\n\
    3. What is a \"package\" in Java?\nA \"package\" is a grouping of Java types(by\
    \ here we mean classes of sorts, including enumeration classes, exception classes\
    \ and interfaces); we will look at each of these in later chapters. It is up to\
    \ the developer of the package to group whatever types they want to put into given\
    \ package. An example of this is the package java.nio which contains java classes\
    \ that pertain to certain aspects of file I/O. We have to import this package\
    \ for use in our program in order to use the classes and methods with which we\
    \ perform I/O.\nSo, why do we have to inform the compiler that we want to import\
    \ packages into your program? The reason is that the compiler needs to verify\
    \ things: (1) so that it can ensure that you are referring to the types correct\
    \ and (2) so that it can compile those existing types along with your program.\
    \ The package content that you refer Java libraries in your program is not compiled\
    \ with your program because those classes are already present in the JVM; at runtime\
    \ when the JVM sees a reference in your code to a component of a standard Java\
    \ library it simply links to the version/copy of the library that it already has.\n\
    Now what does \"*\" mean in the package name? It indicates that every top-level\
    \ type that appears in the package in question to be visible for potential use\
    \ in our program. For example, in the package java.util there are a number of\
    \ classes; these include the classes Random, LinkedList, HashMap"
