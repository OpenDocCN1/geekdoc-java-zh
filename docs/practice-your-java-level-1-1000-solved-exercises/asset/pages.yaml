  md: "# Appendix A\n\nYou see that we created the method within the parentheses of\
    \ the class Calculator. We named the addition as can be seen, it takes two values\
    \ of type float, which we chose to give the names a and b. The variables name\
    \ just stand for whatever values we pass to it, there is nothing special or specific\
    \ about the names.\n\nWhen we pass values to a method we have to specify that\
    \ the value is. We want to be able to add non-integer values, so we stated that\
    \ we are passing a float value and another float value.\n\nThe computer needs\
    \ to know what kind of value each method intends to send back to whoever invoked\
    \ it; we are sending a value of type float back; that is why the float appears\
    \ before the method name.\n\nInside the method you see that we created a variable\
    \ result which has a type of float, into which we put the result of our computation.\n\
    \nThen we have to tell the method to send a float back, because it said it was\
    \ going to send a float back. We do this using the built-in method return and\
    \ we the built-in method return float variables' value we want to send it back,\
    \ which in this case is the value of float result.\n\nSo how do call/invoke our\
    \ calculator addition method? Simple, we call it from another method! For example,\
    \ we called the method from within the method.\n\nLet's write a full program where\
    \ we will perform the addition of the numbers 5 and 7 on our instance of a Calculator.\n\
    \n```\nclass Calculator{\n  float addition(float a, float b){\n    float result\
    \ = a + b;\n    return(result);\n  }\n  static void main(String[] args) {\n  \
    \  Calculator JohnsCalculator = new Calculator();\n    float myResult;\n    myResult\
    \ = JohnsCalculator.addition(5.2, 7.2); // I am using my calculator object.\n\
    \    //Now let's print it to the console\n    System.out.println(myResult);\n\
    \  }\n```\n\nYou can take this program, put it in a file named Calculator.java,\
    \ compile it and run the resulting Calculator.class file.\n\n# Some explanation\n\
    \nEvery class that we want to run directly must have a named main. This method\
    \ is the one that Java looks to run. The header line of the main method is generally\
    \ presented in the fashion that we see it (for more details Chapter 1).\n\nThink\
    \ of the main method as a \"governor\" method for what we do with the other methods\
    \ in the class. Since that we created our calculator instance (JohnsCalculator),\
    \ in the method main.\n\nNow, we have a calculator object that we named JohnsCalculator,\
    \ we want to perform the addition on this calculator. So we simply call the addition\
    \ on our calculator (because if you want an addition on your calculator you press\
    \ the buttons on your own calculator, not on someone else's) as JohnsCalculator.addition(5.2,\
    \ 7.2). But remember that the method addition sends"
