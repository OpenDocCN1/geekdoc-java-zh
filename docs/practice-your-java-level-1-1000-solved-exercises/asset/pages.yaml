    # Casting


    Explain the concept of casting.

    Casting is a feature where you can force the compiler to make a copy of the contents
    of a variable and convert it to the format of another type.

    For example, I can do the following:

    int a = 50;

    short b = (short)a;

    The second line means, give me a copy of a that has been converted into the internal
    format and format of a short. It is reasonable to say that any value which is
    less than or equal to the range of a short (i.e. an int value is between -32,768
    and 32,767) can legally fit into a short. However, we have to explicitly inform
    the compiler that we do want to convert the contents of the int into a question
    into short.

    Note that you can actually cast the value of a higher width whose contents are
    greater than that of a lower width into type; for example you can cast an int
    whose value is greater than 32,768 into a short; while the value in question cannot
    actually fit into the space of a short, the compiler will still do its best to
    cast the value, however value will be distorted, i.e. wrong, since you cannot
    fit something of a higher width into a smaller space property.'
