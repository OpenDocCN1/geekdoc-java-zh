  md: "# Chapter 22; Classes I\n\n| Polymorphism |\n| 78. | As clear, the class Car\
    \ is a descendant of the class Vehicle. If we have an object car01 of class Car,\
    \ explain why it is valid to write the following code:\n`Vehicle v01 = car01;`\n\
    The code in question is valid because it is a feature of \"polymorphism\", which\
    \ is a key concept in oriented programming. One of the characteristics of polymorphism\
    \ is that an object of a descendant class can be assigned to a variable that is\
    \ of the same type as any of its ancestor classes.\n| 79. | Given an object car01\
    \ of class Car, explain why the following code is valid:\n`Object obj01 = car01;`\n\
    The code is valid for the same reason that the preceding solution is valid, because\
    \ the class Object is a superclass of the class Car (the class Object is the ultimate\
    \ superman of all classes in Java). | Polymorphism and method overriding for instance\
    \ methods vs. method hiding for static methods |\n| 80. | Determine the output\
    \ of this program and explain why it so.\n```java\npublic class A {\n    public\
    \ void MyName() { System.out.println(\"My Name is class A.\"); }\n}\npublic class\
    \ B extends A {\n    public void MyName() { System.out.println(\"My Name is class\
    \ B.\"); } // overriding\n    public static void main(String[] args) {\n    Object\
    \ object01 = new B(); // NOTE: We are using a variable of type class A\n    //\
    \ to access an object of type class B\n    object01.MyName();\n}\n```\n**Output:**\
    \ My Name is class B.\n**Explanation:** It is very important to note that we created\
    \ an object of class B, but assigned it to a variable of an ancestor class, class\
    \ A (this assignment is possible via polymorphism). Nevertheless, because MyName\
    \ is an instance method, it is the version of the method that belongs to the actual\
    \ class of the object being accessed by a variable (in this case the type cast\
    \ in the variable object01 of class B) is invoked.\nContrast with this method\
    \ version that is invoked under the same conditions when the method being invoked\
    \ is a static method (see the next exercise). | 81. | Determine the output of\
    \ this program and explain why it so. (The code is only different from the code\
    \ of the preceding exercise in the method MyName is static in this exercise).\n\
    ```java\npublic class A {\n    public static void MyName() { System.out.println(\"\
    My Name is class A.\"); }\n}\npublic class B extends A {\n    public static void\
    \ MyName() { System.out.println(\"My Name is class B.\"); } // overriding\n  \
    \  public static void main(String[] args) {\n    Object object01 = new B(); //\
    \ NOTE: We are using a variable of type class A\n    // to access an object of\
    \ type class B\n    object01.MyName();\n}\n```\n**Output:** My Name is class A.\n\
    **Explanation:** In Java, when a static method is invoked, the variant of the\
    \ method that is invoked is the variant that belongs to the class of the variable\
    \ with which the method was invoked. Contrast with the variant of the method which\
    \ is invoked when the method in question is an instance method (see preceding\
    \ exercise). The reader should repeat this exercise, instantiating object01 as\
    \ being of class B, in order to confirm this explanation.\nYou can only \"hide\"\
    \ static methods, you cannot override them. |\n\n195"
