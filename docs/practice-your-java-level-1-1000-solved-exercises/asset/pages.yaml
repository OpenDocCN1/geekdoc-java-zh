    30. In general terms what are the similarities and differences between the StringBuilder
    class and the StringBuffer class? Which one is preferred and why?

    The StringBuffer class and StringBuilder class are essentially the same in functionality,
    however the StringBuilder class is a more modern version of StringBuilder in its
    internal functioning. In particular StringBuilder provides better support for
    threading.

    As a result, StringBuilder is the preferred class to use of the two. As can be
    seen in the exercises in this chapter, we used the more modern one, StringBuilder
    for our exercises.'
