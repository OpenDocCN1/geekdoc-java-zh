    takeoffs.add(ITakeoff(h01));

    takeoffs.add(ITakeoff(null));

    takeoffs.add(ITakeoff(h03));


    All the lines of code are valid! This is stated in the solution to exercise 1,
    a reference variable of an interface type can be used to reference objects of
    classes which implement it. The classes Helicopter and Airplane implement both
    of interfaces ITakeoff and ILanding, therefore each of them is valid.

    With the regard to declaration ArrayList<ITakeoff>, just as easily as a declaration
    of ArrayList<Integer> is valid, so is also a declaration ArrayList<interface>
    name valid.

    This exercise was to ensure clarity and reinforcement of this sub-topic of the
    preceding exercise.


    3. Write the declaration syntax of a class that extends another and also implements
    a number of interfaces

    <accessibility> <class name> extends <superclass> implements <interface>,...,<interface>,

    The name of the class must come before the name of the interfaces. See the solution
    to exercise 1.


    4. What is the access level of the members of an interface?

    The level of the members of an interface is the access level public.


    5. What kind of class is an interface most like?

    An interface is not an abstract class, because unlike an abstract class, the methods
    in an interface are not required to be implemented (but should at least be specified)
    and also, when an interface is implemented in a concrete class all of the methods
    of the interface must be implemented just as with an abstract class.


    6. How many interfaces can a class implement?

    There is no limit.


    7. What does interfaces present over abstract classes?

    The main benefit is that a given class can implement multiple interfaces, however
    it can only inherit from one class at a time, when that inheritance is not the
    correct relationship between given classes; for example, a car has components
    a steering wheel and a gear box; even if inheritance was possible in Java, a car
    most is not a descendant of a steering wheel or gear box, they are merely members
    of a car with specific parameters as specified by their respective interfaces.


