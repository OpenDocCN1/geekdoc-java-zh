  md: "# Practice Your Java Level 1\n\n3. Attempts have been made to deprecate the\
    \ <applet> tag. In its place, the <object> tag or the <embed> tag can be used.\n\
    \n6. Explain the concept of a \"security sandbox\" for applet.\nThe security sandbox\
    \ refers to constraints put on a Java applet. For example, a Java applet that\
    \ is running in the sandbox cannot access the system files of the computer it\
    \ is on, nor can it access any network point except that from which it was downloaded\
    \ (by name, not by ip address). It cannot even access the system clipboard. Also,\
    \ sandboxed applets can only read a list of the available system properties.\n\
    \n7. What is a \"privileged\" applet?\nA privileged applet is one that runs outside\
    \ the sandbox and does not have the restrictions of a sandboxed applet. Any signed\
    \ applet can request permission to run as a privileged applet.\nThe user of course\
    \ has to be careful in using, such as applets have access to the components of\
    \ the users' computer.\n\n8. Explain the differences between an applet and a regular\
    \ Java GUI application.\n\nA Java applet is a public class which extends the class\
    \ Applet (this for a Swing applet, an AWT applet would extend Applet), as opposed\
    \ to a desktop GUI application which extends JFrame.\nA Java applet does not have\
    \ the main method; it has a method named init which performs the same function.\n\
    The methods getSize and setVisible of JFrame are not relevant for an applet, since\
    \ it sets the size according to what is specified in the HTML tag and is automatically\
    \ made visible by the browser.\n\nSee the sample applet code below:\n\n```\nimport\
    \ java.awt.EventQueue;\nimport javax.swing.Applet;\nimport javax.swing.JLabel;\n\
    \npublic class AppHello extends Applet{\n    public void init(){\n        EventQueue.invokeLater(new\
    \ Runnable(){\n            public void run() {\n                JLabel label01\
    \ = new JLabel(\"Hello. How are you?\");\n                add(label01);\n    \
    \        }\n        });\n    }\n}\n```\n\nOn security: we have discussed the security\
    \ constraints on such applets in the preceding exercises. With these in mind,\
    \ we understand that any sandboxed applet shouldn't attempt any file operations\
    \ (It might have such written and compiled with the code, however an attempt to\
    \ access forbidden areas will result in an exception)."
