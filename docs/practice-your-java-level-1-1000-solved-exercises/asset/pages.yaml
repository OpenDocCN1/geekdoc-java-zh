    \ out of its own and outer class by giving it a private constructor.\n\n# Anonymous\
    \ Classes\n\n10. Describe what an anonymous class is, when it makes sense to use\
    \ one and how objects thereof are instantiated. Anonymous class is a class that\
    \ (1) has no name and (2) is defined at the point of instantiation of the object\
    \ which is an instance of the anonymous class. An anonymous class is usually created\
    \ when a single instance of an already existing class needs the behavior of the\
    \ class to be modified somewhat; this being the case, it is easy enough to change\
    \ the class definition at the same point in code where the object is in question\
    \ instantiated. An anonymous class is defined by the compiler as an expression\
    \ and it terminates with a semicolon. Following example shows the implementation\
    \ of an anonymous class (in this case the anonymous class is a subclass of the\
    \ class Hello)\n\n```\nclass Hello {\n    public void sayHello() {\n        System.out.println(\"\
    Hello are you?\");\n    }\n}\n\npublic static void main(String[] args) { // the\
    \ left after after constructor parameters indicates\n    Hello obj1 = new Hello()\
    \ {\n         // the start of the anonymous class\n        public void sayHello()\
    \ { //overriding an inherited method\n            System.out.println(\"HI !!!\"\
    );\n        }\n    }; obj1.sayHello(); //end of the class. With right brace =\n\
    \    // Here we are using the object of the anonymous class. Run\n    // the code\
    \ to see that it prints out \"HI !!!\".\n}\n```\n\nAs earlier, the anonymous class\
    \ is defined at the point of instantiation of an object of the intended anonymous\
    \ class. Why is it called anonymous? It is so called because normally a class\
    \ is given an explicit name, whereas one has no explicit name. While it is true\
    \ that we used the class name from which we are inheriting"
