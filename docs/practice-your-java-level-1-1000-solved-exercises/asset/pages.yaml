    \n+   72. What is an abstract class?\nHint: See exercises 58 and 59.\nAn abstract\
    \ class is one of the following:\nA class where some the expected implementation\
    \ (methods and suchlike) is not done/complete and thus the class and its incomplete\
    \ components have been explicitly denoted as abstract. Such abstract components\
    \ are placeholders and it is intended that they be developed in a derived class.\n\
    A class which is derived that it is not instantiated but that all classes derived\
    \ from it are instantiate (notable that all the components of the class may be\
    \ completely developed, however we can still choose to denote the class as abstract).\n\
    Either case, an abstract class cannot be instantiated, a non-abstract subclass\
    \ of such can be.\nOnce any of the component is denoted as abstract, the class\
    \ itself must be marked abstract.\n\n+   73. What is the procedure for instantiating\
    \ an object of an abstract class?\nAn abstract class cannot have instances.\n\
    A only non-abstract descendant (which will not have any abstract components) of\
    \ the abstract class can be instantiated.\n\n+   74. Why are abstract classes\
    \ useful?\n abstract class is a class that demands a mandatory set of components\
    \ (that is, all of the components tagged as abstract in the class) be implemented\
    \ in its subclasses before the subclass is usable. By doing so, the abstract class\
    \ forces a minimum implementation for its concrete subclasses.\nFor example, if\
    \ we had a class Shape and wanted to derive classes from it that represents the\
    \ shape, circle, triangle, hexagon and wanted to use that programmer provided\
    \ methods for computing the perimeter and area of the derived subclasses, defining\
    \ abstract methods in the class Shape for computing the perimeter and area would\
    \ compile any non-abstract class that derives from Shape implement the methods\
