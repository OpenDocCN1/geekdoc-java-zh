  md: "# Practice Your Java Level 1\n\ncharacteristics.\n\nEvent Listeners\n\nThere\
    \ are a number of built-in interfaces in Java whose task is to facilitate the\
    \ recognition and receipt of input from Java GUIs. For example, if you click on\
    \ a button component using a mouse, your application can react, if it has implemented\
    \ the MouseListener interface, recognize element has been clicked on the mouse\
    \ and detect the appropriate action as your application has programmed to.\n\n\
    The event listeners are quite easy to program.\n\nWe summarize above as follows:\
    \ Each application exists within a frame. The frame has three areas, namely the\
    \ application frame, the menu bar and a content area. Individual components are\
    \ laid out in the content frame, either by specifying (x, y) coordinates, or by\
    \ using a \"layout manager\". Each of the components can implement \"event listeners\"\
    . The event listener methods for user interaction and can implement the application\
    \ as whatever the user is doing/acting with the application so that your application\
    \ can respond appropriately.\n\nNote: In addition to the content pane, a JFrame\
    \ has three panes, namely the root pane, the layered pane and a pane called the\
    \ glass pane. These are not immediately important for basic construction of Swing\
    \ applications. The order of the four panes from top to lowest is: root, layered,\
    \ content and glass pane.\n\n+   4. Explain the concept of event programming.\
    \ Touch upon the concept of event listeners.\n\nThis is actually a concept that\
    \ you are familiar with.\n\nEvent programming simply means a program which waits\
    \ for user events to occur and then the program responds based on these events.\
    \ Examples of these include pressing a push button, scrolling a scroll bar, typing\
    \ into a text area and such. Each graphical component can be programmed to \"\
    listen\" for specific events\n\nTo \"hear\", the application has to \"listen\"\
    \ to the user devices, mainly the keyboard and the mouse. Each graphical component\
    \ has registered to \"listen\" to the input devices will be prompted when the\
    \ mouse device is utilized. A component has to be handled by the event listener\
    \ itself or directly extend the event listeners through anonymous classes in order\
    \ to listen when it is impacted by the user inputs.\n\nJava has implemented a\
    \ number of different event listener interfaces which are contains of listening\
    \ for user input can. Each type of event listener interfaces for different things\
    \ and can pass \"what it hears\" to whoever is listening. For example, a MouseListener\
    \ can tell you if the mouse is moving and where it is, a ListSelectionListener\
    \ can tell you which item has been selected on a list.\n\nThe above can be summarized\
    \ as follows: each component that wants to listen for user input can using appropriate\
    \ listener interfaces and can react as desired.\n\n+   5. Below is the structure\
    \ of a basic GUI:\n\n```\nimport java.swing.*;\npublic class graphicsPractice\
    \ {\n    public void createGUI() {\n        JFrame frame0 = new JFrame(\"My Application\
    \ Title\");\n        frame0.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \        frame0.setVisible(true);\n    }\n\n    public static void main(String[]\
    \ args) throws Exception {\n        SwingUtilities.invokeLater(new Runnable()\
    \ {\n            public void run() {\n                new graphicsPractice().createGUI();\
    \ //Here we create an object of the class\n                //and call a method\
    \ in it the same line\n            }\n        }); //an an anonymous class implementing\
    \ an interface\n    }\n}\n```\n\n290"
