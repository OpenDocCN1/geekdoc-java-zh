  md: '# Practice Your Java Level 1


    would have the 10 dollars in my pocket. If I was a reference type I wouldn''t
    have the 10 dollars in my pocket, but rather a piece of paper in my pocket that
    has the address of where 10 dollars is; physically you would then have to do and
    go and get the money from the address on the paper in my pocket.

    Note, when you use a variable, primitive or reference, the Java runtime does the
    fetching of the 10 dollars for me, so that in the case of reference types I don''t
    have extra work to do; Java does the work for me. If as it Java involves two steps
    to fetch the actual value of a reference type and then getting to the value of
    the variable which contains "written on piece of paper", whereas for primitive
    it only has one step.

    The type of nature that we are dealing with (reference or primitive) is important
    when it comes to dealing with questions of equality. For example, for variables
    a=2 and b=4 of any primitive type, for the question a==b (is the value of a equal
    to the value of b), the == operator does direct comparison of the values 2 and
    4 and gives the appropriate result (when this is false)

    In case of reference types, if we have reference type variables x and y and then
    for example are as follows: x=object and y=object, then the question x==y will
    yield a value of false! This happens because, a reference type variable being
    a piece of paper on the address where it is written is clearly not the same piece
    of paper (even though the thing is written on them). While sometimes you want
    to "check whether you are talking about the same sheet of paper", more often than
    not, you want to compare what is written on the papers, compare the contents of
    what and y are referring to. To do so you must use the specific comparator for
    the reference type in order to compare the values referred to by reference types.


    +   6. List the different types of reference types.

    Every-primitive type in Java is a reference type. That includes classes, interfaces
    and all arrays (even if the arrays are of primitive types).


    +   7. Describe the difference in passing from a method, to methods (including
    what effect an attempt by methods to change the value of variable passed to it)
    to each of the following types:

    * primitive type

    * reference type

    When you "pass" a primitive variable from a method to methods you are merely passing
    a copy of the data in the primitive variable from method to the methods. copy
    does not have anything to do with the original!

    However, when you pass a reference type variable to a method, you are actually
    passing a copy of an address (as opposed to a primitive type where you were passing
    a copy of data; here you are passing a copy of the address where the data is).
    This is how I imagine; however address is written on paper and I am writing that
    address on a different piece of paper for you.

    The result of an attempt by methods to change the value passed to it is:

    * 1. For a primitive type if methods changes the value of the parameter passed
    to, it doesn''t have any effect on the value of the variable in method, because
    you never passed a reference type to method, to you it knows nothing about the
    original variable that contained the value.

    * 2. For a reference type if methods changes the value in the parameter passed
    to it (meaning for reference types it looks at the address and goes to change
    what is stored at address), it effectively has an effect on the value of the variable
    in methods, using the address analogy, methods has been told that the data resides
    (as address was passed to) and therefore methods can modify the contents at that
    address.

    NOTE: The exception to this is when passing wrapper class objects and the String
    class. We will see this in this chapter.


