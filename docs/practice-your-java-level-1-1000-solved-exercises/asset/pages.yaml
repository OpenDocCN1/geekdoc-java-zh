    \ the fully resolved class name, in this case Shape.Circle.\n2. The second item\
    \ is the name of the inner class object that we want to create.\n3. The third\
    \ item is the equals sign which we use here with any object instantiation.\n4.\
    \ The fourth item is shape1.new shows that we are creating a sub-object of the\
    \ outer class. Recall that it was stated earlier that an inner class object is\
    \ a sub-object of its enclosing class. That is why the name of the outer class\
    \ appears, that the compiler knows which outer class to bind this new object to;\
    \ the keyword is attached as .new.\n5. The fifth item in the line is the name\
    \ of the class being instantiated.\n\nWe show how to access a variable in the\
    \ outer class that the inner object is a sub-object of.\n\n```\n1. public class\
    \ Shape{\n2. private int shapeInt;\n\n3.     public class Circle{\n4.        \
    \ public void printOuterInfo() {\n5.             System.out.println(Shape.shapeInt);\n\
