  md: '# Appendix B. Project


    Here is a project which will exercise your skills in a number of areas that have
    been presented in this volume. As you go through the exercise, you should be able
    to identify particular Java features apply to the different parts of the exercise.


    In this project we are going to simulate the operation of a bank. You will build
    the simulation to run for simulated periods of your choosing, the simulated period
    reflecting day 1 to 30 years of operations.


    The bank will have a set of customers, who come to the bank from time to time.
    The potential activities of the customers include the following:


    # Customer Activities


    +   1. Salary deposit this is deposited every week in bank by the customers

    2. Miscellaneous deposits

    3. Requesting loans

    4. Loan repayment (this is an automatic withdrawal by the bank and is always scheduled
    for the day after their salary deposit)

    5. Cash withdrawals (if they have taken any loan, then the amount left in the
    account must suffice for the next loan repayment)

    6. Statement of transactions for the day (this should include the ID# of the employee
    who served the customer)

    7. Obtain a monthly bank statement for the last month which states the following:


    +   a. total deposits they have

    b. cash withdrawals taken out in the given month

    c. Each loan taken out and the interest rate

    d. Total of loans taken out far

    e. Loan amounts repaid so far

    f. Expected loan repayment completion date for each loan

    g. Next loan repayment date


    This statement should be available on demand. Also, whether it is requested or
    not, the bank should produce it on the first of the month and store it in a directory
    for the customer.


    The file directory structure should be customer_id_number/monthly_statements/


    For each day that the customer comes into the bank, they should have a record
    of their daily activity stored in a directory of the following: customer_id_number/year/daily_reports/


    # End of day duties


    Your bank itself has the following duties at the end of the day


    +   1. Produce a report stating the total deposits for the day

    2. Produce a report stating the total loans issued that day

    These should be stored in an appropriately named directory.


    # Bank Loans


    +   1. Maximum loan amount across all loans = 300% of salary

    2. Interest rate: randomly selected value between 3.00% and 8.00%

    3. Payment term: variable, from one month to 30 years

    4. Aggregate loan repayment for a customer cannot exceed 50% of their salary'
