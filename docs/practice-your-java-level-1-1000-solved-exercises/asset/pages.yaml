    9. What are the implications if your .java file does not contain a method main?

    *Hint: See preceding exercise*

    By putting a method main into the .java file in question, we are saying that we
    do not want our class to be double runnable. This is very common, most .java files
    simply contain type definitions that other programs use as components.

    10. Write out the possible modifier declarations for a given method that we want
    to be callable/invokable that the JVM can have.

    The only possible modifier declaration that fits the criteria for method main
    is as follows:

    1. public static void main(String[] args)

    The access modifier gives the visibility for it to be seen and is thus invokable
    by the JVM. The method main cannot return a value to the operating system directly
    (there are other methods such as System.exit). The method main must always be
    ready to receive an array of type String as seen in the input. Also, main always
    has the modifier static to apply it (We discuss this modifier in Chapter 22 Classes
    I).

    11. Apart from the modifier static, what other modifier type can be used for the
    method main?

    No. The method main is always a static method.

    Modifiers (such as static) are covered in Chapter 22, Classes I.

    12. In the code snippet below, we have the keyword return. What does this keyword
    do?

    public static void main(String[] args) {

    return;

    }

    The return keyword, when executed, causes the immediate termination of the method
    in which it is invoked/and returns control to the calling method. In the case
    of the method main exits the program and returns control to the operating system.
    In summary, we can say that return means "exit the method that you are running
    now and return control back to whoever called this method."

    13. Contrast the use of the keyword return in this program with its use in the
    preceding exercise.

    public int doSomething() {

    return(5);

    }

    The statements in this and that exercise have the same basic effect that they
    return control to the method that invoked the method that invoked the return statement,
    however, in this case, the return also "returns" a desired value to its calling
    method (in this example it is returning the value 5). A very important point to
    note is the ability of the return statement to return anything is linked to the
    return type specified in the method definition in which the return statement appears.
    This particular example says that we are returning a value of int and that declaration
    allows us to return the int value 5.

    14. Explain why the following code is invalid:

    public void main(String[] args) {

    return("finished");

    }

    it is invalid because the method main cannot return anything directly; its return
    type should be void.What does the sequence // mean when it appears on a line in
