  md: '# Chapter 11. Enumerations I


    This chapter presents exercises on the concept of enumerations in Java. This chapter
    is the first of two in this book to

    present exercises on this topic.


    +   1. What is an enumeration (enum) and why is it useful? Also show an example
    of a simple enumeration named

    Gender that contains the values MALE and FEMALE in order.

    In its most basic form, Java an enum (short for enumeration) can be described
    as a type that is assigned (by the

    programmer) a ordered set of strings that in the context of an enum can be treated
    as integer constants, each of

    "value" is simply their name, however they have a recognized order; this order
    in which they are

    placed into the enumeration, with the first value having the lowest "order number"
    and the last having the

    higest "order number". (Note, though an advanced feature of enumerations provides
    us the choice of assigning

    values, of any type, in any quantity of them to be associated with the string
    that represents the

    enumeration. We will see this in Chapter II).

    Why are enumerations useful?ations are useful because they allow the programmer
    to use meaningful

    names for related items where numerical ordering is determined to be desirable.
    Also, by this

    numerical ordering, the writing of code for comparisons is simplified. If I have
    the set of months

    January to December and have to write code to do order comparisons, I can either
    write an

    if/else block to compare the values of the months, or I can create an enum that
    represents each of

    ten integer comparison clearly an easier way of doing

    month order comparisons instead of comparing the strings directly.

    Here is an example of an enumeration named Gender which defines string values
    for gender:

    public enum Gender {

    MALE,

    FEMALE

    }

    The values in this would be used/assigned as Gender.MALE and Gender.FEMALE, assigning
    them to variables of

    type Gender.

    Beyond the definition of an enum, in Java, an enumeration is actually a special
    type of class! It is

    descendant of the special enum. Being that it is a class, in addition to the ability
    to define constants in it,

    it also supports many of the other features of class; for example, you can create
    an enumeration class that has

    methods. From the definition of enumerations in many other programming languages
    (example

    C, C#), where enumerations are not classes and of the strings in an enum represents
    a single

    numerical value.

    Given that a Java enumeration is actually a class, each of the constants in an
    enumeration is actually the

    of object of that enumeration class (the definition style is special/different!)
    This is a very important

    dist between enumerations in Java and many other languages where an enum only
    represents a member.

    (The class Enumeration) design presents a unique mechanism for defining its objects,
    as we have seen the

    definition of the objects MALE and FEMALE in the enum class above).

    Think of an enum as a class of all whose objects are known by name and the advances
    of all of

    these objects are listed in the class. The runtime can simply create all of the
    objects of the

    enumeration class in question at initialization time.

    For programmers who are used in other languages to enum being an ordered list
    that is backed by integer

    representation, the way to achieve the same effect with Java enumerations as in
    other languages is to use either

    t ordinality of the entries in the enumeration for comparison, or always using
    the compareTo method. Exercises

    later.

    Recall that it stated earlier that enum''s are special classes and each of the
    constants there is actually an

    object. We will see in the chapter entitled How to implement methods in enumerations.

    Note: Being a class, an enumeration is defined in its own class file.'
