    \ on data encapsulation\nExplain the concept of accessor and mutator methods is\
    \ a very simple one with a fancy name.\nThe concept of accessor and mutators (or\
    \ getter and setter methods) is a convention to implement data encapsulation.\
    \ You have actually implemented examples of such before in exercises 29, 30, 52\
    \ and 53; please have a quick look at the solutions to these exercises now.\n\
    \ accessor is an \"other private\" (most likely public) method which is used to\
    \ access a private field in an object; this method has the following requirements:\n\
    1. its naming convention is getVariableName (with the 1st letter in uppercase)\n\
    2. it returns the value of the private field to which it refers\nAs seen in exercise\
    \ 52, you actually implemented a set of accessors.\nA mutator method is an \"\
    other private\" (most likely public) method which is used to set the value of\
    \ a private field in an object; this method has the following requirements:\n\
    1. its naming convention is setVariableName (with the 1st letter in uppercase)\n\
    2. it is passed the value that we wanted to set the field\n3. it sets the value\
    \ of the private field to the value received (Actually, the mutator method can\
    \ apply whatever transformations are required to the input value; it does not\
    \ have to set the value of the field directly to what is passed to it).\nAs seen\
    \ in exercise 53, you actually implemented a set of accessors.\nNow, why do accessor\
    \ and mutator exists? The reason is: encapsulation of data.\nIf we wanted to access\
    \ a given field in an object from another object, we have the programming option\
    \ of making the field public is not optimal, because it violates a fundamental\
    \ tenet of object-oriented programming, which is key encapsulation of data. Making\
    \ the field public implies access to the field by any object in the program can\
    \ lead to the corruption of the internal state of the object which has presented\
    \ a field as public which should be private. If such corruption occurs, a search\
    \ has to be made through the source code to see which part of the corrupted field\
    \ in question. The accessor and mutator methods serve as single points of entry\
    \ to the field in question (for reading and writing respectively). Any attempt\
    \ to read or write the data can be trapped by a single breakpoint in either case,\
    \ making it a lot easier to identify the source of errors.\nThe reader should\
    \ also note that the naming convention for accessors and mutators are built into\
