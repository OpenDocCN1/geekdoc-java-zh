  md: "# Chapter 15. Date/Time Handling – Foundation\n\nAn important part of any computer\
    \ language is the ability to determine and measure time, including the determination\
    \ of dates and times (and sub-elements thereof such as the year, month, day, hour,\
    \ minute, second), present or future, time zones, measurement of date/time differences\
