  md: '# Practice Your Java Level 1


    # More details


    Simulation should create the following:


    A list of bank customers. One way to do this is to have a list of first names
    and also a list of last names and then randomly pair data from each list in a
    way so as to generate as many customers as you want in your simulation. At the
    same time, assign customer ID numbers; sequential numbers might be optimal. Randomly
    assign each customer the following: a day of the month on which to deposit their
    pay and the amount of pay. If that day falls on a day when the bank is not open,
    then customer should make the deposit on the next business day.


    Your customer class will have fields to represent at the following: id, first
    name, last name, salary, deposit rate.


    A list of bank tellers. Specify to how many programs you use and it can create
    them from lists in the same manner as which the customer is created. Assign them
    employee id numbers too. This employee id# should appear on the customer statement
    that printed out at the end of the day.


    Bank hours. Define your banking hours and days within your simulation. That will
    help determine the “end of the day”. On days when the bank is not open, still
    ahead and generate bank reports for the day to reflect the activity of those days.


    Customer arrivals: Randomly select customers who show up at the bank on any day
    within the hours is open. They should enter a queue and they will be serviced
    by the next available teller. Customers who are depositing their pay on a given
    day will not be selected, but must be in the list of customers for the day.


    A customer can have multiple activities that they want to perform on a given day.
    Select this set of activities running too. You might want to apply a weighting
    to certain activities, for example loan requests cannot be too frequent. Also,
    the customer is free to reject the loan if they find the interest rate to be unacceptable.


    Banking activity time: Assign a time for each banking activity. This will help
    determine the time that each customer spends at the teller. The next customer
    in the queue should automatically be assigned to the next available.


    Day transaction statement: On processing customer, copy their statement of activity
    for the day to the out directory.


    Bank statement requests: If the customer requests their statement of transactions
    for the month far, copy this to the out directory.


    # End of day


    At the end of the banking day, run the bank reports for the day in question. Store
    them in an appropriately named directory.


    At the end of the month, create a monthly statement for each of your customers.
    Also create a monthly statement for the bank itself.


    Of course, as the developer, you will scale your unit of time appropriately to
    represent days, months and years!'
