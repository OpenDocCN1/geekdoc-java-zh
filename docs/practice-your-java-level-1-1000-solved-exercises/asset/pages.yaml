  md: "# Chapter 24. Classes II: Nested Classes, Local Classes, Anonymous Classes\n\
    \nThe chapter Classes I was a foundational one for the concept of classes in Java.\
    \ This chapter extends that one by presenting exercises on the interesting topic\
    \ of non-top level classes, that is the different types of nested classes.\n\n\
    | What is a nested class? |\n| A nested class is what is declared within another\
    \ class. |\n| There are four explicit types of nested classes, these being member\
    \ classes (of which there are two types, namely the (1) static class and the non-static\
    \ nested class known as an (2) inner class), (3) local classes and (4) anonymous\
    \ classes. Member classes are directly declared within an outer class, local classes\
    \ and anonymous classes are declared directly within methods. |\n| Member Classes\
    \ |\n| 2. Identify the static Shape and the inner class in the code below.\n```java\n\
    public class Shape {\n    public double area(double length) {\n        return(length*length);\n\
    \    }\n}\n\nstatic class Rectangle {\n    public double area(double length, double\
    \ breadth) {\n        return(length*breadth);\n    }\n}\n```nThe static class\
    \ is the class Rectangle. This is discernible by the following two facts: (1)\
    \ It is defined within another class (the Shape in this case) and (2) it has the\
    \ keyword static in front of the class definition.\nThe inner class is the class\
    \ Square. This is discernible by the following two facts (1) It is defined within\
    \ another class and (2) it does not have the keyword static in its definition.\
    \ |\n| 3. Describe what an inner class is, when it makes sense to use an inner\
    \ class and how objects thereof are instantiated.\nInner class is a non-static\
    \ class which is defined within the body of another class. except that it is another\
    \ class. Inner class can only be instantiated as objects of their containing class.\
    \ Inner objects have access to the members of their containing object.\nNow, where\
    \ would you use an inner class? An inner class is an appropriate choice when it\
    \ contains information that is likely only pertinent as part of a component of\
    \ its containing class.\nThe following example shows this:\n1. declaration of\
    \ an inner class\n2. instantiation of an object of an inner class\n3. public class\
    \ Shape{\n4. public class Circle{\n}\n5. public static void main(String args[]){\n\
    6. Shape shape01 = new Shape();\n7. Shape.Circle circle01 = shape01.new Circle();\n\
    } |"
