  md: '# Structure of Contents


    This book is structured in chapters, with each chapter covering a major topic
    (or part thereof). Overlap between topics is covered in the appropriate chapter
    for such.


    # Chapter Legend/Structure


    Exercises are numbered sequentially. The question numbers are uniformly on the
    left-hand side of the book. The solution to each exercise appears beside or immediately
    below the exercise.


    An $M$ appearing in the question number column indicates an action which must
    be performed manually; for example, an instruction to insert a USB stick/drive
    into the computer.


    An $E$ followed by a number in the question number column indicates that this
    is an extra exercise given to the reader to solve. Where they appear, they are
    at the end of the chapter.


    # How to use the book


    The individual who is fairly new to Java is advised to go through the chapters
    in the book sequentially. A classroom instructor or the individual person who
    is simply refreshing their Java knowledge can go through the individual chapters
    in an order that best suits their needs.


    # What You Need To Use This Book


    In order to implement all of the exercises in this book you need to download and
    install the Java 8 JDK as well as your Java IDE of choice.


    The user will also need access to the freely available official Java documentation
    supplied by Oracle. The code for this book is downloadable from the publishers''
    website.


    # About The Author


    Ayodle "Ayo" Agbola holds a degree in Electrical Engineering from the University
    of Waterloo in Canada. He has had the pleasure of programming over the course
    of 30 years, first personally and then professionally. As a professional he has
    worked globally in many roles, including software development, project management
    and training, implementing software of various scale, largely for telecom service
    providers.'
