  md: "# Chapter 22; Classes I\n\nNote: There is another class modifier, static, which\
    \ we will look at in the nested classes as it does not apply to top-level classes.\n\
    \n+   1. abstract - a class which we desire not be instantiable. Its members may\
    \ or may not be; however, with this modifier, the defined members thereof cannot\
    \ be invoked. Only non-abstract subclasses of abstract classes can be instantiated.\n\
    2. final - no other can be derived from such a class (i.e. it cannot have subclasses).\n\
    \nNote: Any instantiable class (i.e. any non-abstract class is called a \"concrete\
    \ class\")\n\n# 59. Class member modifiers\n\nWhat does each of these class member\
    \ modifier means?\n\n+   1. abstract\n2. final\n3. static\n\n1 - abstract (this\
    \ applies to method) an abstract method is a method that is defined but unimplemented.\n\
    The body of this method in the question cannot be overridden in descendant classes.\n\
    \n2 - final - indicates that the member in question belongs to the class itself,\
    \ not to the instances. For example the method equals(String, String) from class\
    \ String exists to the class String and is therefore accessed to the class name\
    \ at its beginning; rather accessed to the name of an object. Another example\
    \ of a static is the double PI in Math; which has been seen in exercises in a\
    \ previous chapter that the methods of Math are all accessed as static methods.\n\
    \n3 - static - indicates that the member in question belongs to the class itself,\
    \ not to the instances.\n\nNote: Not all of these modifiers are valid for every\
    \ potential member type. They are all though for methods.\n\nSummary of concepts\
    \ practiced today: type modifiers (abstract & final), class member modifiers.\n\
    \n| static class members, blocking instantiation |\n| 60. What is the difference\
    \ between an instance method of a class and a static member of a class? \nan instance\
    \ method of a class can only be invoked relative to the instance (instantiated\
    \ object) of a class; a static member is never invoked relative to the class itself;;\
    \ a static member operates without reference to any object.\nLet us take examples\
    \ from the class Float which has both instance and static methods. The method\
    \ .isInfinite(float)\nboolean true = Float.isInfinite(700.5f);\nAs you can see,\
    \ the method is invoked to the class name Float.\nOn the other hand, the shortValue()\
    \ of the same class would have to be given for a given instance as <instance>;\
    \ that is, this particular method has to be invoked relative to class Float. For\
    \ example, to invoke it for an instance float8 of Float we would have to invoke\
    \ it as float8.shortValue();\nNow, not only methods can be static methods as discussed\
    \ above, but fields can also be static. For example in the class Math, the field\
    \ that represents the mathematical constant π is defined as a static field which\
    \ is accessed as Math.PI.\nSome well known static members are the in and out of\
    \ class System; you have the object used extensively for console output as System.out.\
    \ System.in is an instance of class PrintStream, System.in is in instance of class\
