    \ void main(String[] args) {\n        int[] intArray1 = new int[] {55, 747, 15000,\
    \ 89, 2333};\n        int[] intArray2;\n\n        System.out.printf(\"intArray1's\
    \ contents are currently %s\\n\", Arrays.toString(intArray1));\n        intArray2\
    \ = Arrays.copyOfRange(intArray1, 0, 10);\n        System.out.printf(\"Length\
    \ of intArray2 = \" + intArray2.length);\n        System.out.printf(\"intArray2's\
    \ contents are %s\\n\", Arrays.toString(intArray2));\n    }\n}\n```\n\nObservations:\
    \ In the method Arrays.copyOf, the program starts that it is going to copy the\
    \ contents of intArray1 to 10, which is greater than the number of elements in\
    \ the source array intArray1. Nevertheless, the code runs and we see that intArray2\
    \ has 10 elements! On looking the contents of intArray2 we observe that the values\
    \ in intArray1 were copied to intArray2 and the extra positions were filled with\
    \ the default value of 0 for the int type.\n\nThis mechanism of specifying a length\
    \ greater than the length of the source array is actually a useful way to use\
    \ the method Arrays.copyOf to programmatically create an array of longer length\
    \ than the source. This same mechanism can be used to shorten the source array\
    \ itself by being created with the same source and destination (what really happens\
    \ is that another object will be created with the same data as the original array\
    \ and the memory address of the new array will be assigned to the name of the\
    \ original array).\n\n+   27. Shorten the array to only 3 elements:\nint[] intArray1\
