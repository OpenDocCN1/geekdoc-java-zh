  md: '# Chapter 32: Graphical User Interfaces using Swing


    Run the explanation and explain what it is doing. Also, explain why the application
    needs to be run in a thread.


    In this method we create a JFrame object. It will be recalled from exercise 3
    above that every graphical application starts with a JFrame object. Next, we specify
    what the application does when the close button on the window is selected by the
    user; our choice is indicated by the constant `JFrame.EXIT_ON_CLOSE`. Following
    this, we direct the application to make the frame visible.


    GUI applications are run on what the Swing "event dispatch thread". The way GUI
    application runs on the event dispatch thread is by an instance of the GUI class
    being invoked in the method run of a class that implements the `Runnable` interface.
    We see in our example an anonymous class which implements Runnable. We implemented
    the interface method run and in this method we create an of our GUI class and
    kick off the method which creates our GUI.


    The "event dispatch thread" is responsible for proper scheduling and handling
    of event notifications in graphical applications.


    **Observations:** When running the program, see the application started with length
    and width of 0 and 0 pixels! This is because we do not specify a size for it using
    the method `JFrame.size(width, height)`. **Note:** We have the use of threading
    in Java GUI here; using the Runnable interface. This rudimentary knowledge of
    threading is sufficient for you in this test.


    +   6. Describe in terms the layout managers in Swing.


    It started earlier (see solution to exercise 3), Swing provides the concept of
    layout managers to handle the task of placing components in an ordered way. Swing
    provides the following (8) layout managers:


    **BorderLayout** – this manager defines the 5 areas, top, bottom, left and right,
    center. The constants that characterize these areas are `BorderLayout.PAGE_START`,
    `BorderLayout.PAGE_END`, `BorderLayout.LAYOUT`, `BorderLayout.LINE_START`, `BorderLayout.LINE_END`,
    `BorderLayout.CENTER` respectively.


    **BoxLayout** – this manager lays out the components in either a top/down order,
    or left to right (the constants for these are respectively `BoxLayout.PAGE_AXIS`
    and `BoxLayout.LINE_AXIS`).


    **CardLayout** – this manager allows you to put many panels as candidates for
    a given frame; as the names allow, this manager is actually one like playing cards
    in a stack has only the current card (the top panel in case) visible at any given
    time.


    **FlowLayout** – The flow layout puts components in a panel from left to right,
    expanding to more rows if necessary. It ensures that each row is centered.


    **GridLayout** – This container divides the panel into equal sized grids. Each
    component is put into a grid. This layout makes each component fill its grid position,
    each component can be scaled to the size.


    **GridBagLayout** – This manager has grids, however, not each row has to be the
    same height and a given component can span many grids.


    **GroupLayout** – This manager allows the user to specify groups of items at the
    same time, requiring the user to specify both the horizontal grouping and the
    vertical grouping of the group of items.


    **SpringLayout** – In this manager, component positioning is defined by its vertical
    and horizontal distance from other components.


    **Absolute positioning:** – In addition to the layout managers, you can place
    the components directly on a panel by (x, y) position. This is called absolute
    positioning.


    In addition to the above, Java allows you to create your own custom layout managers.


    +   7. Can you put JPanel objects inside another JPanel object?


    Yes you can!


    +   8. Why might you want to put JPanel objects inside another JPanel?


    It might be optimal for your application to have different component groupings
    on the screen that different types of layout managers would be best. This is when
    you want different panels on a class.


    **Implementation:** Given that a frame has a single content panel, a layout manager
    would have to be selected'
