    a LinkedList, which also implements the interface List). We might want to make
    such a change for performance reasons. The grouping in Java of collection types
    by their many interface facilitates this modification. It should also be noted
    that one key benefit of interfaces is the separation as far as possible of the
    concept of how the data is accessed from the implementation of the storage of
    data.


