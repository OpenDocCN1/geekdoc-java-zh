  md: '# Chapter 26. Interfaces


    The concept of interfaces is important one in Java, as it facilitates the enforcement
    of certain behaviors in the classes that implement the interfaces, without using
    an abstract class for the same purpose. The exercises presented in this chapter
    are introductory exercises on this topic.


    +   1. What is an interface?


    We present two complementary answers to this question.


    Solution #1


    An “interface” is defined as a “contract” (in which practice looks like a class)
    that specifies unimplemented methods that must be implemented by any class that
    it “implements” the interface. An interface actually looks like an abstract class.


    Interfaces are implemented by classes; in fact, multiple interfaces can be implemented
    by a single class. An interface can extend others.


    The requirement for implementing an interface is that any class that implements
    the interface in question must implement all of the methods of the interface.


    We restate the given in the following manner: Normally, an interface is said to
    be a “contract” that the interface enters into, mandating the developer of the
    implementing class to define all of the methods specified in the interface.


    The interface does not specify how to implement its methods; it only specifies
    the methods.


    Why? Interfaces are useful for ensuring that specific functionality is implemented
    by the classes that implement the interface(s) is assured that the functionality
    specified by the interface is present in the class in question. If for example
    the interface comparable (this is an interface that specifies a single method
    that is used to establish ordering among objects of the same kind), then any program
    needs to sort a list of elements of the implementing class is assured that the
    class has provided way of ordering objects of the class. This compulsion of implementation
    of methods is similar in concept to abstract classes, there is no limit however
    on the number of interfaces that a class can implement, whereas a class can inherit
    directly from one class that may be abstract or otherwise.


    Again, a class is said to implement an interface.


    Solution #2

    (We start out using an analogy)


    In a real-world scenario, you can think of the steering wheel, gearbox, accelerator
    and brake pedals of a car as an “interface” to its transmission and engine. You
    may not know what fact goes on inside the engine compartment of a vehicle or its
    transmission, but you have the above listed standards to use it. In fact, every
    car is expected to implement these interfaces to its transmission and engine.
    These common interfaces to the engine and transmission are what allow you to drive
    different vehicles once we learn how these interfaces work.


    In Java, an interface is a contract that stipulates specific methods that classes
    choose to implement the interface in question must implement (in practice looks
    like an abstract class). Think of it like this; every car manufacturer has essentially
    agreed to a steering wheel, gearbox and foot pedals in their vehicles; in short
    they have agreed to “implement” these common interfaces in order to hide the actual
    implementation details of what the interfaces are connected to (they are connected
    to the engine and the transmission) from the user. Once we learn an interface
    we can in in effect use whatever the interface is attached to. Well known built-in
    interfaces in Java include, Set, List and CompareTo.'
