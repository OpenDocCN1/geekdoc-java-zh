    Casting also pertains to objects; you can cast an object of a given class into
    a variable of any of its ancestor classes. This ability is facilitated by the
    concept of polymorphism. We see examples of this in the chapter on classes.


    The concepts of boxing and unboxing can be seen as a special type of casting.
