    read_character_from_file_disk()\n    wait your turn among all programs waiting\
    \ to read the disk\n    move the disk head to the position of disk the next character\n\
    \    read what is at that position.\n\nLooking at the pseudocode above, we see\
    \ that this sequence is relatively slow!\nSolution to this slow access is when\
    \ a request is made to read data from a file, a reasonable amount of the file\
    \ should be read into a space in memory instead of reading data by character.\
    \ When each request for a character is, the read_character_from_file_disk() method\
    \ would then go to the space in memory to fetch the next character, rather than\
    \ going to the disk. The area of memory where the file is read is called a buffer.\
    \ Now our method read_character_from_file_disk() would look like this:\n\n```\n\
    read_character_from_file_disk()\n    are desired file contents already in buffer?\n\
    \    no then read a reasonable portion of the file into the buffer, starting from\
    \ the\n        desired character\n    return character from buffer\n```\n\nThis\
    \ is the concept of buffered reading.\nThis is standard in disk reading. As a\
    \ general rule, operating systems read disk sections into memory once.\n\n*The\
    \ concept of buffered writing*\nThe concept of buffered writing is similar. Similar\
    \ to the issue with reading files disk, it is not optimal to write each data item\
