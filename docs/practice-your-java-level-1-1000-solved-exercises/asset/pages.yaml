  md: '# Chapter 33. Applets – a brief look


    This chapter presents a very brief set of exercises on the topic of Java Applets.
    As we have already covered GUI''s and given the fact that an is a modified GUI
    application that runs in a browser, we present the following short set of exercises.


    | 1 | (explain in a single line) What is a Java applet? An applet is a Java program
    that is written to run on a web page. |

    | 2 | Why was there originally a reason for applets? One original reason for the
    existence of applets was to provide a more graphics rich running experience for
    users; such graphics rich applications have also been termed "Rich Internet Applications".
    Understand that applets precede web technologies like Cascading Style Sheets (CSS)
    and HTML 5 which provide more advanced graphical options for webpage design. |

    | 3 | Explain the mechanism by which browsers support the running (not the loading)
    of java applets. There are two ways in which web browsers support the running
    of java apps. These are:

    1. The embedding of a JVM within the browser itself

    2. The installation of a Java browser plug-in (which works through the browser
    extension interface that many browsers provide). This plugin then runs the applet
    on the webpage. |

    | 4 | What is a WebStart application? A WebStart application is a Java application
    that is loaded by the Java Network Launching Protocol (JNLP). browser embedded
    facilitates the loading of java apps in a browser also facilitates the loading
    of desktop applications over the web and running them as regular applications
    on a computer. |

    | 5 | Explain the mechanisms by which an applet is loaded into a browser using
    HTML. There are two different sets of tags that are used; the basic applet tag
    and the jnlp tag. |


    Using the Applet tag

    The of the object in question and its startup parameters (for example, startup
    size) are embedded in the HTML tag <applet> in an HTML page. The browser recognizes
    this and runs the indicated applet. For example, if we have a local applet (our
    example is one we compiled in a class named Hello, we embedded it in an HTML page
    as follows:

    A remote applet would need to specify the codebase, for example, an applet that
    is be loaded from zyco''s web server might look like this:


    ```

    <applet code="Hello" width="300" height="200"></applet>

    <applet codebase="http://www.zyco.com/appletdir/ code="Hello.class" width="300"
    height="200"></applet>

    ```


    Using JNLP

    JNLP uses a different set of html tags, primarily the tag <jnlp>. Also, JNLP specifies
    a particular way to package your applet. This does not get into the details of
    JNLP, but wants you be aware of this functionality.


    +   Notes

    1. For immediate testing purposes, you can use the applet viewer that is packaged
    with Java. Also, some IDE''s automatically recognize code when you try to run
    and start your applet in the applet viewer.

    2. At present, all applets, whether local or not, have to be signed by a certificate
    authority before they are allowed to run. If you configure an entry into the Java
    Control Panel (the execution javcp) on your computer where the location of your
    local classifies and also set browser permissions you would be able to run your
    local applet in a browser that supports java apps. You would have to use the URI
    of your class files into the exceptions list in the Java Control Panel an. (see
    Chapter 29, exercise 51 for an example of how to determine the URI of a directory
    or folder.'
