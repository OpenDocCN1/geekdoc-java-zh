  md: "# Practice Your Java Level 1\n\n# More details\n\nNow, what characteristics/attributes\
    \ does a human being have? They have for example, a first name, a last name, and\
    \ a weight. We need to have fields for inside each instance. So we will enhance\
    \ our Java class HumanBeing with these fields as follows:\n\n```\nclass HumanBeing{\n\
    \    String firstName;\n    String lastName;\n    int age;\n    float weight;\n\
    }\n```\n\nLooking at the enhanced definition of the class HumanBeing, observe\
    \ that each field has a type specified for it. For example, our first names and\
    \ last names are \"string of characters\" type data; string of character data\
    \ can be represented by the Java type String. Our ages are whole numbers (integers)\
    \ and Java has many integer types that can handle; we choose the type int. Our\
    \ weight has fractions in it, so we need a type that can handle fractions; float\
    \ is a type that can handle.\n\nNow, do we need the data fields for each person's\
    \ individual object? It's simple. Let's set the data for ours (our name is John\
    \ Smith, we are 40 years old and weigh 178 pounds).\n\nWe recalled every object/instance\
    \ that we called me, that represents ourselves. Now we want to do the following\
    \ is:\n\n```\nme.firstName = \"John\";nme.lastName = \"Smith\"\nme.age = 40;\n\
    me.weight = 178.0;\n```\n\nNow, say Dad's name is Singdon, aged 67 and he weighs\
    \ 163 pounds. You go ahead and fill the object that represents Dad and then look\
    \ at the answer below\n\n```\ndad.firstName = \"Singdon\"\ndad.lastName = \"Smith\"\
    \ndad.age = 67;\ndad.weight = 163.0;\n```\n\nYou get the general picture. Of course\
    \ there are more details that can go into the picture but this is the essence\
    \ of it.\n\n# The concept of methods\n\nWe have a class named Calculator. I have\
    \ one, my friend has this. For now our calculator can perform only the addition\
    \ for any two numbers given to. How do we express the desired functionality within\
    \ our Calculator to do each of these operations?\n\nThe solution is methods. A\
    \ method is a \"named block of code\" within a class we coded to. We can pass\
    \ values to a method and the method will do whatever it can and pass the solution\
    \ back. Let us create a named method addition to do this:\n\n```\nclass Calculator{\n\
    \    float addition(float a, float b) {\n        float result = a + b;\n     \
    \   return(result);\n    }\n}\n```"
