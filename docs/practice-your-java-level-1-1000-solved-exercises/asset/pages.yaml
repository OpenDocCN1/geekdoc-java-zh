    A soft symbolic link hardLink01 to this file would be entered as:

    (\#2, "softLink01", S, , "C:/Users/PJ/Desktop/abc.txt")


    Observe that the soft link does not have an entry indicating the actual location
    of the file.


    A hard symbolic link to this file would be entered as:

    (#3,hardLink01, H, 1500001, "")


    Observe that the soft link does not have an entry pointing to the name of the
    file being pointed to

    (the soft symbolic link), but has an entry pointing to the actual location of
    the disk. Also,

    the operating system stays aware of it is pointing to the physical location of
    a file on disk.


    File Access mechanism for soft link hard link


    When a file is accessed through a soft symbolic link, the operating system looks
    at the name of the soft link

    pointing to, the actual entry for that item and from the original entry determines
    the actual location

    disk of file and accesses the file.


    When a file is accessed through a hard symbolic link, the operating system looks
    at the resolved name of the that

    link itself is directly pointing to and accesses the file in that way.


    Effect on links of updating a file


    If we update the file, whether the file is accessed through either a hard link
    or a soft link, the access

    mechanismism is maintained as described above. The file contents can be accessed
    directly or through the links.


    Effect on links of renaming a file


    Now, if the file abc.txt is renamed to def.txt, #1 becomes the following:

    (\#1, "C:/Users/PJ/Desktop/def.txt", F, 1500001, "")


    Observe that renaming a file the actual location of the file (1500001) is not
    moved if

    renamed on the filesystem (in this example). Understand that renaming a file

    nither the soft links nor the hard links to the file are updated.


    Effect on soft link


    Entry #2 (the soft link) is now a "dead link" as there is no longer a C:/Users/PJ/Desktop/abc.txt

    to point! The file can no longer be accessed through the soft.


    Effect on hard link


    The file content is still accessible through the hard link hardLink01 because
    the filesystem

    from the hard link actual location of the data that the hard link is pointing
    to.


    Effect on links of deleting a file


    According to our previous explanation, this means that entry #2 is deleted from
    the file directory.


