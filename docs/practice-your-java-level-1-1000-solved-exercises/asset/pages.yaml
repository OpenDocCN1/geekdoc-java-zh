    using | public class PracticeJava {

    public static void main(String[] args) {

    boolean a = false;

    Boolean obj1 = a; //autoboxing

    Boolean obj2 = new Boolean(a);

    }

    } |

    | 1. autoboxing

    2. assignment via a constructor | public class PracticeJava {

    public static void main(String[] args) {

    String a = "true";

    Boolean obj1 = new Boolean(a);

    }

    }|

