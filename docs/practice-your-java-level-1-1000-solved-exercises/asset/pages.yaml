    22. Explain the concept of "precision" with respect to BigDecimal.


    The concept of precision for a BigDecimal, is simply the definition for the BigDecimal
    object at hand how many digits it is supposed to have. The precision pertains
    to the total count of significant digits in the whole number of the number and
    in the fractional part of the number. For example, the 8.3 has two significant
    digits, 0.83 has two digits, 1.35 has three digits, 0.135 has three significant
    digits.


    23. Explain the concept of a "rounding mode" as applies to objects of the class
    BigDecimal.


    The concept of "rounding mode" pertains to the determination of how the least
    digit of a number we have specified should be determined when the number has more
    significant digits than our desired precision for it.

    The reader is likely familiar with one particular rounding mode; that is "rounding
    up", i.c if any digit that is greater or equal to 5 results in a value of 1 added
    to its adjacent superior. In Java there are eight rounding modes for BigDecimal.


    24. List and describe with all eight rounding modes in the enumeration RoundMode.
    Your examples should depict rounding of both positive and negative numbers of
    precision = 2.


    | CEILING | The value is rounded to the nearest positive value. | 8,73 -> 8.8.
    Note that even though the number in the 2nd decimal place is less than 5, CEILING
    nevertheless moves the number up. |

    | DOWN | Round to 0. This actually implies that positive numbers decrease in value
    and negative numbers increase in value! For this think like "zero" is seen as
    DOWN". | 8.78 -> 8.7. Note that even though the number in the 2nd decimal place
    is greater than 5, DOWN nevertheless moves the number towards 0. -8.78 -> -8.7
    Towards toward zero as stated! |

    | FLOOR | The value is rounded to the nearest lower value for the specified precision.
    | 8.78 -> 8.7 Note that even though the number in the 2nd decimal place is greater
    than 5, for positive values, FLOOR truncates the digits. -8,73 -> -8.8. Note that
    even though the number in the 2nd decimal place is less than 5, FLOOR moves it
    lower. |

    | HALF_DOWN | Rounds to the nearest neighbor for the specified precision. The
    value 5 is counted as the lower half of numbers to be rounded. The values are
    thought of as two rounding groups: 1-5 and 6-9. Contrast with HALF_UP. Think of
    "down" as meaning "to a lower digit". | 8.75 -> 8.8 8.75 -> 8.7 -8.77 -> -8.7
    -8.75 -> -8.7 Note the difference in the handling for 5 when it is positive versus
    when it is a negative. Interestingly it''s not to a lower number when negative.
    |

    | HALF_EVEN | Rounds to the nearest neighbor for the specified precision, however
    | 8.74 -> 8.7 8.78 -> 8.8 |


