  md: '# Chapter 23. Object References & Primitive Type Variables: A Deeper Understanding


    This very important chapter addresses the need to have a proper understanding
    of the concepts of how object references and primitives are passed from method
    to method in Java. While indeed exercises on these topics have been presented
    to a degree in previous chapters, there is a need for focused exercises on the
    topic. This chapter presents exercises which to hone your skills in these concepts.


    As you go through the exercises and solutions in this chapter, you may observe
    a degree of restatement. This is deemed necessary, given the importance of the
    topics in this chapter.


    | What is a type | A type is a specific "template" for whatever data it is appropriate
    for. In Java there are two general categories of types, primitives types and reference
    types. Whatever is not a primitive type (we have dealt with all of them earlier)
    is a reference type.

    Examples of types include the type double, which is a primitive type that is appropriate
    for floating point values, the type double is an reference type for floating point
    objects as we have seen earlier.

    In Java the programmer is free to create more reference types, but not primitives.
    These "templates" are necessary for the compiler to determine many things the
    data at hand, as how much memory to use to store the data, where memory to store
    the data and what data manipulations/handlers are valid for the data in question.
    | Define what is meant in Java by the primitive type. | A primitive is one whose
    value directly contains its data. Elucidating by example, if I have an variable
    named x1, "x1" is the name assigned to a location in the computer''s memory and
    the contents of that memory location is value as x1.

    (Contrast the primitive type with the reference type) | List the primitive types
    available in Java. | Primitive types include the numerical types byte, short,
    int, long, float, double and the type boolean and char. | What is a primitive
    variable? | For a primitive variable is simply a named space in memory for a data
    item. Of the variable also corresponds to the name we are giving the data item.
    So when we say x5, we are giving a name to a value, and also its location in memory
    (so that we can find it). The space allocated for it memory corresponds to the
    space that is appropriate for that type of primitive that it is declared. | Explain
    what a reference type variable is | A "reference type" variable is one that "contains"
    a reference to an object. We have already used these to a large degree in this
    book, however we explain their details more formally here.

    A reference variable actually contains a reference to the place in the memory
    to which it refers is stored; for reference types this reference is a reference
    to an object.

    To restart the above, we would say that a variable is a reference type is not
    the actual container of the data/object in question, but rather a reference to
    the location where that data/object it represents is stored.

    Stated simply we can say that "a variable of reference type contains a reference
    to the address of the object it refers to".

    Here is an analogy to explain the concept. I say 10 dollars. If I was a primitive
    type variable I |'
