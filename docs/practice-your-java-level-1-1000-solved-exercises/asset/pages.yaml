    | 2. package-private – the class can only be accessed by other items in the same
    package as itself Note: "package-private" is not explicitly written in our code,
    rather, if public is not specified then the default class access level for the
    class in question is package-private. Conclusion: if you want the class to be
    package-private then not add any access modifier to its definition.

    | 8. class member access modifiers

    Describe each of the following class access modifiers:

    1. public

    2. protected

    3. no modifier specified

    4. private


    1. public – the class member in question can be accessed directly by any other
    class anywhere, be it a subclass (look at the concept of subclasses later), other
    types in the package of which it contains a class, or types in any package. Summary,
    anything anywhere can access a member with the access level public.

    2. protected – can be accessed by members of its class, subclasses, or members
    of the package of which it is a part (contrast with public).

    3. no modifier specified – the class member in question can only be accessed by
    members of its class and its package; subclasses of the class with this unspecified
    permission cannot access unless the subclass is in the same package! This access
    level is called "package-private".

    4. private – the member is directly accessible by only elements of the very class
    which it is a part.

    For recession, note that the access levels are listed in ascending order of restriction.

    Should be understood that the member access level is subordinate to the access
    level of its class. For example, if a class has an access level of public but
    its containing class has an access-level of package-private, the access level
    of the class member remains limited to package-private.|


