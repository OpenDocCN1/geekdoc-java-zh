  md: '# Chapter 22: Classes


    +   11. State why no class can access the fields of objects of the class Vehicle
    that we just defined.

    The reason for such non-access is because every field that we have defined for
    this class has an access level of private, therefore the fields of any object
    of class Vehicle are accessible only by the other members of the object.


    +   12. What is the default value assigned to fields in an object in Java?

    The default value for primitives is zero.

    The default value for object reference fields is null.


    +   13. What is the title of the special method which present in any class is
    automatically invoked on creation of an instance of the class?

    it is called a constructor.


    +   14. What is the function of a constructor?

    A constructor is used to perform initialization actions on newly instantiated
    objects. Initialization parameters can be passed to the constructor at the time
    of instantiation of an object. For example, if you have a class which represents
    a person and thus fields for a person''s last name and first name, your constructor
    might receive values for these fields on object initialization to initialize the
    object.

    Beyond initializing the newly instantiated object, a constructor is free to perform
    any actions on any other part of the program at the time of instantiation if desired;
    it is not limited to the initialization of objects.


    +   15. What at point in the lifetime of an object is the constructor invoked?

    it is invoked automatically on instantiation of the object.


    +   16. What is the minimum number of constructors a class can have in Java?

    The minimum number of constructors class can have is 1, every class must have
    at least one constructor. if the programmer do not define any constructor for
    the class, the compiler will create one automatically; the compiler created is
    called the default constructor, as it is created by default. It takes no parameters.


    +   17. Can constructors be overloaded?

    Yes constructors can be overloaded like any method.


    +   18. Explain the need for overloaded constructor.

    This is like overloading method; you would want an overloaded constructor in order
    to accommodate the different input values and types you want to initialize your
    object with instantiation time. For example, if I have a class that has fields
    named lastName, firstName and age, I can, have the following constructors:

    public Person(String lastName, String firstName);

    public Person(String lastName, int age);

    public Person(String lastName, String firstName, int age);


    +   19. For the either class Vehicle, what would be the name of any of its constructor
    methods?

    The name of the constructor method always has the same name as the class itself.
    Constructors are the only methods that have the same name as the class in which
    they appear.


    +   20. What is the return type of a constructor?

    Constructors do not have a return type at all (not even void).


    +   21. What is a parameterless constructor?

    Aless constructor is a constructor that has no parameters passed to it. It is
    the constructor that is invoked when an object is instantiated without parameters.
    For example we have the following:

    Vehicle v0 = new Vehicle(); // Example of instantiation using a parameterless
    constructor;

    // No parameters in the brackets.

    The programmer can create the parameterless constructor, or leave the constructor
    to the compiler to do implicitly (which Java will do if the programmer has not
    defined any constructor). For example, because we have not explicitly defined
    any constructor for our class Vehicle, Java has actually created a parameterless
    constructor, which it (Java) will do only if the programmer has not defined any
    constructor for the class in question.'
