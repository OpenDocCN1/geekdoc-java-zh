  md: "# # Chapter 3. Number Handling I – Numerical Primitives\n\nThis chapter offers\
    \ extensive coverage of the topic of number handling in Java. Your knowledge of\
    \ numerical types in Java and operations therein is exercised and enhanced by\
    \ the wide-ranging set of exercises that are presented in this chapter.\n\nKey\
    \ topics on which exercises are presented in this chapter include: knowledge of\
    \ the primitive types, appropriate selection of numerical types, computation exercises\
    \ with built-in numerical operators as well as with the methods of the class Math.\n\
    \nBeyond the topics noted above, exercises on the usage of numerical constants\
    \ from the wrapper classes, overflow conditions, the Exact methods, infinity handling,\
    \ hexadecimal numbers, number base conversion, logical and bitwise operations,\
    \ increment, decrement and shorthand numerical operators are also included. A\
    \ robust set of exercises on the formatting of numerical primitives\n\nThe topic\
    \ of number handling in Java is extensive and thus is not limited to the topics\
    \ in this chapter; this is the first of five exercises in this book on the topic\
    \ of number handling in Java.\n\n| | Explain the concept of numerical primitives\
    \ in Java. |\n| 1. | One way to describe a numerical primitive in Java is that\
    \ a numerical primitive is a number type that is natively represented and handled\
    \ in the CPUs that run Java. Most CPUs in the world today can represent and process\
    \ the types byte, short, int, float and double natively. Also, numerical operations\
    \ as +, -, *, / on primitive types are native into CPUs. |\n| 2. | List in ascending\
    \ order of size, the integer primitives In order of: byte, short, int and long.\
    \ \nExplain the concept of numerical wrapper classes in Java.\nIn the first exercise,\
    \ we explain numerical primitives and some operations that can be performed on\
    \ them are represented in most common CPUs. However, not every operation that\
    \ we would like performed is possible. To address this, a corresponding class\
    \ for each primitive exists in Java. These classes serve as an appropriate collection\
    \ point for all methods representing the primitive type that they correspond to.\
    \ For example, the primitive int has a corresponding class Integer, the primitive\
    \ short has a wrapper class Short. By serving a collection point, there is also\
    \ functionality in Java which works only on objects (for example Collections functionality,\
    \ which we will see on later); objects of these wrapper classes stand for their\
    \ equivalent primitive values in such cases.\nIn this chapter we will use the\
    \ use of wrapper classes to a degree; and their interaction with primitives is\
    \ covered more directly in the chapter entitled Number Handling II – Wrapper Classes.\
    \ |\n| 4. | List the names of the wrapper classes for each of the integer primitives:\
    \ byte, short, int and long Byte, Short, Integer |\n| 5. | What is the minimum\
    \ value supported by the Java int type? -2,147,483,648 |\n| 6. | What is the maximum\
    \ value supported by the Java int type? 2,147,483,648 |\n| 7. | What is the default\
    \ value assigned to an int variable that have not yet assigned a value to (called\
    \ an uninitialized variable)? There is no value assigned by the compiler. You\
    \ will have to assign a value to a primitive variable before you can use it. |\n\
    | 8. | How many bits are used to represent an int in Java? | 32 bits/4 bytes |\n\
    | 9. | Write a line of code to show the declaration and initialization Int firstInteger\
    \ = 5; |"
