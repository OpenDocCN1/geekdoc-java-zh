  md: '# Chapter 22. Classes I


    Java is an object-oriented language and the concept of classes and objects is
    central to it. This is a very important one as it presents exercises which cover
    the concepts of classes (top-level classes in this chapter) and types thereof,
    classes (objects), class/object member accessibility, constructors, initializers,
    inheritance, polymorphism and other key related topics.


    Please note that the exercises in this chapter particular should be completed
    in sequential order, as often through this chapter subsequent exercises build
    on preceding ones.


    Given the number of topics and sub-topics covered in this chapter, a brief summary
    of the topics covered is provided after each section in this chapter.


    The reader should note that this is the first of two chapters in this book that
    address the topic of classes.


    | 1. What is a class in Java? |

    | A class is a data structure that can combine Java members (i.e. fields, methods,
    constructors, initializers, as well as implemented interfaces) in a single unit.
    A class is a "template" for dynamically created instances of the class; these
    are called objects. Classes support the concept of inheritance, a mechanism where
    derived classes obtain the functionality of the class they inherit (known as a
    "superclass") of the class which is doing the inheriting) and can enhance the
    inherited functionality as desired. |

    | 2. In Java, what is a package? |

    | Simply put, a package is a grouping of types (usually all class, enumerations
    and interfaces). The programmer determines the types you want to group in a package
    (See exercise 2 in Chapter 1). |

    | 3. Describe the potential members of a class. |

    | 1. Constants — constant values associated with the class (for example Math.PI),
    or with instances thereof

    | 2. Fields — variables of the class or its instances

    | 3. Methods — distinct method blocks that belong to the class (static methods)
    or its instances

    | 4. Constructors — special methods which are invoked on the instantiation of
    instances of the class

    | 5. Static initialization blocks — blocks of code that initialize class variables

    | 6. Initialization blocks — blocks of code that can be used to initialize instance
    variables (they work in conjunction with constructors)

    | 7. Types — other classes, as well as implemented interfaces

    | Note: Not all of these members are required to be present in a class given at
    once. |

    | 4. In Java, can a class be defined within another class? |

    | Yes. (In the solution to exercise 3 above it was stated that a class can have
    other classes defined within). |

    | 5. Explain the concept of a "top-level" class |

    | A top-level class is simply a class that is not defined within another class.
    (In the solution to exercise 3 above it was stated that a class can have other
    classes defined within All the classes defined here are top-level classes.) |

    | 6. What is a nested class? |

    | A brief description of a nested class is "a class which is defined within another
    class"

    | We look closely at the different kinds of nested classes in Chapter 24 entitled
    Classes II. |

    | 7. top-level class access modifiers |

    | Explain the meaning of each of the following top-level class access modifiers:
    |

    | 1. public

    | 2. package-private — the class in question can be accessed by any other class
    anywhere |

    | 1. public |'
