  md: "# Chapter 24: Classes\n\nHello to kick the instantiation, this isn't the real\
    \ class that pertains to the object.\nAn anonymous class is identified existence\
    \ by a left brace before the brackets that house the constructor\nparameters.\
    \ An anonymous class ends with a right brace; the semi-colon being the character\\\
    used to end lines of code; this contributes to why an anonymous class is regarded\
    \ as an expression.\n\nWe see this in the definition of an anonymous class which\
    \ is derived from the class Hello.\nAnonymous classes are very useful when you\
    \ have classes that are really one-time use in your code. These\none-oneous scenarios\
    \ occur a lot in Java GUI programming. For example, each button in your GUI might\
    \ have a\nunique task; instead of having to create an explicitly named class for\
    \ the actions that each button will perform,\nanonymous classes linked to each\
    \ button instance can be created to handle such functionality.\n\nAnonymous classes\
    \ also implement interfaces! This will be in Chapter 26 Inherited Interfaces.\n\
    \n+   11. How do you define a new constructor in an anonymous class since it does\
    \ not have a class name?\nYou cannot define a constructor for an anonymous class!\
    \ It can only use an inherited constructor. If it\nwants to define its own constructor-like\
    \ functionality it can use an initialization block.\n\n```\nclass Hello {\n  String\
    \ name;\n  Hello(String name){\n    name = name;\n  }\n  public void sayHello(){\n\
    \    System.out.println(\"Hello \" + name + \" how are you?\");\n  }\n}\n```\n\
    \nWe modify the method in main the preceding anonymous class in the preceding\n\
    question use the field name, printing out the following in method sayHello: \"\
    Hi <name> !!!\"\nWe show only main here.\n\n```\npublic static void main(String[]\
    \ args) {\n  String nameToPass = \"Jack\";\n  Hello obj1 = new Hello(nameToPass){\n\
    \    public void sayHello(){\n      System.out.println(\"Hi \" + name + \" !!!\"\
    );\n    }\n  };\n  obj1.sayHello();\n}\n```\n\nThis code shows that anonymous\
    \ classes inherit the constructors of their superclass and that the seen in this\
    \ exercise\nclearly the value of the parameter passed to the constructor of the\
    \ anonymous class has been assigned to the\ninstance variable name (we used this\
    \ variable in the method sayHello).\n\n+   13. Modify the anonymous class above\
