  md: "# Practice Your Level 1\n\nfloating points types (float, double)\n\n| | | |\n\
    | 28 | What is the minimum value supported by the float type? | -3.402825 x 10^-38\
    \ |\n| 29 | What is the maximum value supported by the float type? | 3.402825\
    \ x 10^38 |\n| 30 | How many bits/bytes are used to represent a float? | 32 bits\
    \ / 4 bytes |\n\n**What is the precision of a float?**\n6-7 significant digits\
    \ (that includes the digits before and after the decimal point).\nYou know that\
    \ integers are discrete values with a deterministic integer range of 1 between\
    \ each point on the integer scale. With floating points it is not so that there\
    \ are an infinite number of floating point numbers possible, even between two\
    \ integers (for example 0 and 1). It is impossible for a computer to represent\
    \ the infinite number of points within a small range on the floating point number\
    \ scale. It has been decided that the float type will have a given precision that\
    \ it can represent. Any attempt to use the float type to represent a number with\
    \ more than 6-7 digits will be unsuccessful.\n\nEven within the specified range\
    \ of 6-7 digits, there are some numbers which cannot be represented exactly due\
    \ to the way in which floating point numbers are stored in computers. Any decimal\
    \ number that requires maintenance of precision (such as currency calculations)\
    \ should only use the `BigDecimal`nThe reader is urged to investigate sources\
    \ how floating point numbers are represented in computers.\n\n+   32. What is\
    \ the smallest positive value that a float can represent? ~1.4 x 10^-45\nThink\
    \ of the number as the smallest step away from that the Java type can make.\n\
    Float reality refers to what is called a \"single floating point number\", which\
    \ is a floating point number format that is designed to occupy only 4 bytes. This\
    \ enumeration is IEEE standard.\n\n+   33. Why is a float also described as a\
    \ single?\n\n+   34. Write a program that uses the built-in constants of class\
    \ Float, which writes out the maximum and minimum values supported by the float\
    \ type. Also print the size in bits that a float occupies.\n```java\npublic class\
