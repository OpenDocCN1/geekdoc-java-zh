    back a value which we want to capture; its use a float type value back and we
    want to know what it is, so we create a float named myResult with which to receive
    what our addition method gives us.


    Just like writing a formula y = sin(x), we wrote myResult = JohnsCalculator(value,
    value) and the result was returned.


    Note: something what we call the parameters in the definition for the method addition
