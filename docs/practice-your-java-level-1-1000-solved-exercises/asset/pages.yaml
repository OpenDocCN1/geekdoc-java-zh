    Why is this knowledge of the immutability of objects of the String class important
    to know? It is important to know for a number of reasons, including the fact that
    modifying a String (which now causes a new string to be created, and the variable
    holding a reference to it to be updated to the location of the new string) is
    relatively expensive time. Therefore, for situations where we need to modify a
    string quite in program, it is better to use the StringBuilder which is mutable
    rather than the class String and if the particular memory reference to which then
    you should know that it will be beneficial when you modify the contents of the
    String variable.


    Really, strings can be referred to as immutable types. They have unique behavior,
    in particular the following:

    1. (Previously stated) They cannot be changed once created. If you modify a String
    (amending, trimming, etc), a new string is created and presented to the program
    in it was changed, with the same variable name, giving you the appearance that
    the contents of the String variable have changed (As stated earlier, in sense
    by creating a new string and making the variable s1 contain a reference to the
    location in memory of this new string). For many programs, this has no negative
    impact on the construction of the program as this away and re-creation is hidden
    from the programmer who requested the modification.

    2. Even though are reference types, due to their immutability, unlike other types,
    if you pass a String to another method which then tries to modify its contents,
    the contents of the original String in the calling method will not be modified.


    Note: Despite the explanation above, for general intents and purposes, you can
    program with the mentality that you can change the contents of a String in a method,
    however you must be aware of what is going on in the background.


