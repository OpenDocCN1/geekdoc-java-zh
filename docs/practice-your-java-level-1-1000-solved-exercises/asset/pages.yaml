    Hint: *The immediately preceding exercises.*\nThe keyword super is used under\
    \ the following circumstances:\n1. A constructor in a subclass can invoke to invoke\
    \ a constructor of choice in its superclass.\n2. A method in a subclass can use\
    \ to invoke a method in its superclass that the subclass has hidden through reuse\
    \ of the same method.\n\nWhat is the ultimate ancestor class of all classes in\
    \ Java?\nThe ultimate ancestor class of all classes in Java is the class Object.\
    \ This class provides a number of methods that each of its descendant inherits.\
    \ The reader is urged to look at the official Java documentation to see the methods\
    \ that this class provides, especially the methods toString and getClass. We have\
    \ used the toString implicitly in this: we will use the method getClass later\
    \ in this chapter.\n\n```\nThe code below does not compile. Explain why it does\
    \ not.\n```java\npublic class A {\n    public A(int x) {\n        return;\n  \
    \  }\n    // Here we have defined a constructor that is not parameterless for\
    \ this class.\n    // Therefore, we now have only one constructor for this class,\
    \ because we ourselves\n    // define a constructor, Java will no longer take\
    \ the responsibility of creating\n    // the parameterless constructor for us.\n\
    }\n\npublic class B extends A {\n    static void main(String[] args) {\n     \
    \   B obj = new B();\n    }\n}\n```\n```\n\n(Observe that class A has only one\
    \ constructor defined and that this constructor takes arguments and that class\
    \ B has only the default constructor)\nState successfully, that there is no constructor\
    \ in the superclass A for the constructor of its subclass B (B itself has a compiled\
    \ default constructor) to invoke. A detailed explanation of the problem appears\
    \ below.\nIt previously stated that once a constructor is defined for a class\
    \ by the programmer, the compiler no longer takes on the responsibility of providing\
    \ a parameterless constructor for the class. Thus, class A in this example does\
    \ not have a parameterless constructor. This is not wrong, but in this example,\
    \ it is a part of the problem. We know that when an object of a given class is\
    \ created, the object will by default seek to invoke the parameterless constructor\
    \ of its superclass. In the code given above, the problem is that there is no\
