  md: "# # Chapter 21. StringBuffer & StringBuilder\n\nThis chapter presents exercises\
    \ that pertain to the StringBuffer and StringBuilder classes, which are mutable\
    \ counterparts of the String class. The programming exercises in this chapter\
    \ will focuses on the StringBuilder class, which while fully equipped in outward\
    \ functionality to the older StringBuffer class is a safer class to use.\n\n+\
    \   1. Describe the StringBuffer class and how it relates to and differs from\
    \ the String class. StringBuffer class is a class that supports the same content\
    \ as the String class, however objects of class StringBuffer are mutable, as opposed\
    \ to the String class whose objects are immutable (the immutability of String\
    \ objects has been discussed in Chapter 5. String: Basic Handling). Due to mutability,\
    \ the StringBuffer objects are mutable, when a StringBuffer is passed from one\
    \ method to another, the receiving method can change the contents of the StringBuffer\
    \ and this will reflect in the calling method; this cannot happen with String\
    \ objects. You will see some examples of this in Chapter 23. It should be noted\
    \ that despite the speed improvement, it is still very acceptable to use the String\
    \ class for operations; the speed advantage of StringBuilder class is made more\
    \ apparent in programs which need to do a very high amount of string manipulation.\n\
    2. When a StringBuilder object is instantiated, what is its default capacity?\
    \ The initial capacity is 16 characters.\n3. What happens if you attempt to append\
    \ to a StringBuffer larger than its current capacity? The StringBuffer objects\
    \ capacity is automatically resized by the system to at least the necessary capacity.\n\
    4. Write a program which will instantiate a StringBuilder object named sb01. Print\
    \ out its capacity as well. Hint: StringBuilder.capacity\n```java\npublic class\
    \ PracticeYourJava {\n    public static void main(String[] args) {\n        StringBuilder\
    \ sb01 = new StringBuilder();\n        System.out.println(\"The capacity = \"\
    \ + sb01.capacity());\n    }\n}\n```\n5. Write a program which will instantiate\
    \ a StringBuilder object sb02 with an initial capacity of 1000 characters. Hint:\
    \ PracticeYourJava\n```java\npublic class PracticeYourJava {\n    public static\
    \ void main(String[] args) {\n        StringBuilder sb02 = new StringBuilder(1000);\n\
    \    }\n}\\```\n6. Given the StringBuffer object declared above, enhance the preceding\
    \ exercise to ensure that the StringBuffer is set to a minimum capacity of 5000\
    \ after its initial creation with a size of 1000. Print out the new capacity to\
    \ confirm that it has been modified. Hint: StringBuffer.ensureCapacity\n```java\n\
    public class PracticeYourJava {\n    public static void main(String[] args) {\n\
    \        StringBuilder sb02 = new StringBuilder(1000);\n        sb02.ensureCapacity(5000);\n\
    \        System.out.println(\"Capacity = \" + sb02.capacity());\n    }\n}\n```\n\
    7. Explain the use of the trimToSize method of class StringBuffer. There are times\
    \ when we want the size of an oversized StringBuffer to exactly match the length\
    \ of the contents. The method trimToSize effects this.\n8. What value does the\
    \ length of the StringBuffer class represent?"
