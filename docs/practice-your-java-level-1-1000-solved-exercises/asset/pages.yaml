    \ of firstLong is \" + firstLong);\n    }\n}\n```\n\n+   25. Explain the reason\
    \ for the postfix L at the end of the numerical value in the preceding exercise.\
    \ if the literal is greater than Integer.MAX_VALUE then Java sees it as an invalid\
    \ value because in a sense it sees as an integer that is out of bounds. However\
    \ when it sees postfix, Java evaluates the value as the type that the type of\
    \ postfix implies.\n\n+   26. What is the difference between the following declarations\
    \ of the variable firstLong?\n\n```\nlong firstLong = 7000000000L;\nand\nlong\
    \ firstLong = 7000_000_000L;\nand\nlong firstLong = 7_000_000_000L;\nand\nlong\
    \ firstLong = 7_000_000_000L;\n```\n\nThere is actually no difference between\
    \ any of the declaration styles. Java allows you to put the underscore character\
    \ in literals as adds clarity for human viewers of the numerical value. The underscore\
    \ does not matter either (see the 4th example). However, the underscore cannot\
    \ be at the beginning or the end of the number.\n\n27. Write a program, using\
