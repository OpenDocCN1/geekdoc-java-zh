  md: '# # Chapter 25. Collections I: Collections with Generics


    Collections are built-in classes which represent well-known computer data structures
    such as List, stacks, queues and dictionaries among others.


    The exercises in this chapter largely pertain to the collections classes ArrayList,
    Stack, TreeSet, HashSet, HashSet and HashMap. We also make use of number of the
    methods of the classes Arrays and Collection.


    | What are “Collections” in Java?


    “Collections” are specifically designed data structures that support the storage
    of a set of data items and provide individual access to the contents. Many of
    these are well-known data structures in computer science, each having a specific
    design with its own capabilities and performance characteristics. In general,
    the features that collections support insertion, removal, sorting and searching
    among other operations. Traditional collections may include stacks, queues, tables,
    trees, lists, sets, maps and variants thereof. Java presents a significant number
    of collections, groupable in the categories Set, List, Queue, Deque and Map.

    | | | |

    |---|---|---|n| 1. | a) A Stack, (2) a Queue... | Set, List, Queue, Deque and
    Map |

    | 2. | Which would be the best out of (1) a Stack, (2) a Queue or (3) a List to
    represent each of the following scenarios: | a) A Stack. The reason is because
    a stack is like a first-in-first-out structure and clearly, the stack you put
    into the box is the first that you will bring out.

    | | a) You put 5 books on top of each other into a box | b) A Queue. A queue is
    generally a first-in-first-out structure and the person on the queue is the one
    that is next to be served.

    | | b) People lining up to pay for groceries at a store checkout counter | c)
    A List. A bookshelf has no specific order in which you must take books or put
    them in.

    | | c) Books on a bookshelf | |

    | 3. | What is the concept of “Generics” in Java? | For example, the ArrayList
    class in Java is written to write collections, it can support objects of any class
    as its content. | |


    The concept of “Generics” in Java is the mean within Java to create classes or
    interfaces that can support any class. For example, the ArrayList class in Java
    is written to write collections, it can support objects of any class as its content.


    Continuing with the ArrayList as an example, it can handle any data type, it is
    spoken/written of as ArrayList<E>,the placeholder E being replaced by whichever
    type the ArrayList at hand is referencing. The placeholder E is the generic type
    parameter.


    ArrayList


    +   4. Explain what is meant by the following declaration:

    ArrayList<Integer> arrayList1 = new ArrayList<Integer>();


    We are telling the compiler that we want to instantiate an ArrayList object that
    will contain objects of Integer.

    This is the first appearance of the “diamond operator” in this book. The diamond
    operator is used to specify parameters that can be generic; for example, for an
    ArrayList we can also specify <String, Boolean>,<any class> with the diamond operator.
    As noted in the preceding exercise, the ArrayList is a class that supports the
    use of a generic type that lets the user specify what kind of type they want making
    given instance of ArrayList to contain.


    | | |

    |---|---|n| 5. | Instantiate an ArrayList<String> variable named List01. ArrayList<String>
    List01 = new ArrayList<String>();'
