    \ {\n    int a = 26;\n    int result = ~a;\n    System.out.println(result);\n\
    }\n```\n\n176. Write a program class PracticeJava that uses left-shift by four\
    \ values. Print the result to the console.\n\n```\npublic static void PracticeJava(String[])\
    \ args) {\n    int a = 38, b = 4;\n    int result = a << b;\n    System.out.println(result);\n\
    }\n```\n\n177. What is the difference between\n\n+   There is no equivalence for\
    \ the result because computers represent data in base 2, therefore left shifting\
    \ is the equivalent of multiplying it by 2; and left shifting by 4 means multiplying\
    \ by 2^4.\n\nand\n\n+   Think about this normally: we operate in base 10. Left\
    \ shifting in base 10 would mean multiplying by 10. Left shifting 4 times in base\
    \ 10 would mean multiplying the number by 10^4.\n\n```\nint a=38;\nresult = a\
    \ << 4;\n```\n\nAnd why is the result what it is?\n\n178. Write a program which\
    \ will right-shift by two values the value 38.\nExplain the result.\n\n```\npublic\
    \ static void PracticeJava(String[]) args {\n    int a = 38, b = 2;\n    int result\
    \ = a >> b;\n    System.out.println(result);\n}\n```\n\nExplanation\nRight shifting\
    \ is equivalent to doing an integer division by 2 and returning the quotient of\
    \ the result. Therefore right-shifting 2 times means, divide by 2 (integer division,\
    \ ignoring the remainder), then divide the result (the quotient of the earlier\
    \ computation) by 2 which yields the following computation and result:\n\n```\n\
    38 >> 1 = 19\n19 >> 1 = 9\n```\n\nE1 Given the two complex numbers, 10 + 5i and\
    \ 2 + 9i, write a program to divide the first number by the second.\n2nd (Hint:\
    \ convert to polar form, do the computation and then convert back to Cartesian\
    \ format).\n\nE2 Write your own equivalent of the Math.copySign method.\nHint:\
    \ Math.signum\n\n39"
