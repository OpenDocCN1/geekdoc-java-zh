  md: '# # Chapter 13. Number Handling IV – strictfp & StrictMath


    In this chapter, we present exercises on strict handling of numerical computations
    in Java using the keyword strictfp and the class StrictMath.


    The topic is not difficult, however it has not been put into its own separate
    chapter for emphasis.


    This chapter is the fourth of five chapters in this book on number handling in
    Java.


    | 1. | What is the concept behind the existence of keyword strictfp?

    | There are a number of factors that comprise the result of a numerical computation:
    the design of the CPU on which the computation is performed and the algorithm
    which is used to perform the computation.

    | **Hardware:** When performing floating point computations, some platforms have
    actually wider intermediate registers than a float or a double can support; the
    width of the registers in handling intermediate computations which exceed the
    width of the type in question. We explain by example:

    First, let''s say a processor supports decimal numbers with up to 4-significant
    digits. In this example, we have the CPU Model-1 which only uses 4 significant
    digits throughout internally. If I have the computation $1000 \times 10 - 5000$,
    with only 4 significant digits everywhere, the result will be as:

    ```

    1000

    x 10

    0000 \leftarrow$ Overflow error in CPU! We lost the "1" because our register is
    only 4 digits wide

    -5000

    -5000

    ```, if another manufacturer decided to create a decimal CPU Model-2 which supports
    up to only 4 significant digits, internally it uses an expanded width of 5 significant
    digits for intermediate computations, we would have the following:

    ```

    1000

    x 10

    10000 \leftarrow$ We still have the "1" because the intermediate internal register
    is 5 digits wide

    -5000

    5000 \leftarrow$ This result fits within 4 digits.

    ```


    Clearly, if my program run on a computer with CPU Model-1 my answer will be different
    from the answer on one run on a computer with CPU Model-2. The strictfp keyword
    would prevent this variance in intermediate by forcing intermediate computations
    to conform to the IEEE-754 standard that defines the handling of floating point
    numbers; this specification demands that double occupies a maximum of 64 bits
    at all times and a single/float occupies a maximum of 32 at all times. This calls
    the strict-FP requirement. With the preceding example in mind, the output of CPU-1
    (which has/no extra places internally) would result under the strict-FP requirement
    (Yes, that output in some situations might not be correct due to under/overflow,
    however it is consistent across platforms. It is left to the programmer to handle
    the under/overflow properly).


    When the keyword strictfp is applied to a method, all floating point computations
    within that method are made to conform to the strict-FP requirement. When the
    keyword is applied to a class, all floating point'
