  md: "# Chapter 8. Iterations/Loops\n\nThe facility in a programming language to\
    \ iterate easily through a set of items (for example the individual elements of\
    \ an array) and perform common actions on each element is a key enable of complex\
    \ code. This chapter contains exercises on different loop mechanisms within Java,\
    \ such as the while, do/while, and for enhanced loops. Exercises which require\
    \ the use of \"labels\" as well as the loop jump keywords continue and break are\
    \ also presented, as well as exercises with nested loops.\n\n# while loop\n\n\
    | Use a loop to print out the numbers 0 to 9 in order, on sequential lines. |\
    \ ```java public class PracticeJava {\n    public static void main(String[] args)\
    \ {\n        int counter = 0; // We are starting at 0\n        while (counter\
    \ < 10) {\n            System.out.println(counter);\n            counter = counter\
    \ + 1; //we increment counter\n        }\n    }\n``` |\n Use a loop to add the\
    \ numbers 1 to 15000. Print out the result. | ```java public class PracticeJava\
    \ {\n    public static void main(String[] args) {\n        long counter = 1; //\
    \ We are starting at 1\n        long total = 0;\n        while (counter <= 15000)\
    \ {\n            total++;\n            counter++;//we increment counter\n    \
    \    }\n        System.out.println(\"Total = \" + total);\n    }\n}\n``` |\n\n\
    We have an integer intArray01 which has 5 elements with the following positions\
    \ in the array:\n\n+   - [0] - 18\n- [1] - 42\n- [2] - 26\n- [3] - 44\n- [4] -\
    \ 55\n\nUsing a while loop, print the values contained in this array, in the following\
    \ format: `intArray01[index]=<value>`\n\n```\npublic class PracticeJava {\n  \
    \  public static void main(String[] args) {\n        int[] intArray01 = new int[]\
    \ {18, 42, 26, 44, 55};\n        int loopCounter = 0; // We are starting at element\
    \ 0\n        int arrayLength = intArray01.length; // upper limit\n        while\
    \ (loopCounter < arrayLength) {\n            System.out.printf(\"intArray01[%d]\
    \ = %d\\n\", loopCounter, intArray01[loopCounter]);\n            loopCounter++;\n\
    \        }\n    }\n}\n```\n\nPrint the contents of the array in the preceding\
    \ exercise backwards, in the same format, using a while loop.\n\n```\npublic class\
    \ PracticeJava {\n    public static void main(String[] args) {\n        int[]\
