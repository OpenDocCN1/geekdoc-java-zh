  md: "# # Chapter 12. Number Handling III – BigInteger & BigDecimal\n\nThis chapter\
    \ is the third of five chapters in this book on number handling in Java.\n\n|\
    \ BigInteger |\n| --- |\n| 1. Explain the reason for the existence of the class\
    \ BigInteger. \nThe class BigInteger exists to facilitate the representation in\
    \ Java of integer values that exceed the range of the largest primitive/class,\
    \ long/Long. The primitive type long can be represented natively by most modern\
    \ CPUs on which Java is run; any integer value that exceeds range has been implemented\
    \ in software as BigInteger has. |\n| 2. Create a program which will initialize\
    \ an object of class BigInteger to handle the value Long.MAX_VALUE.\nA BigInteger\
    \ cannot be directly initialized with a value, but rather with the string representation\
    \ of value. Therefore, we have to convert the desired Long.MAX_VALUE to a string.\
    \ We first have to convert the value of Long.MAX_VALUE (which is a long) to a\
    \ Long object since the object permits us to convert its contents to a string.\n\
    import java.math.*;\npublic class PracticeJava {\n    public static void main(String[]\
    \ args) {\n        long long_max = Long.MAX_VALUE;\n        BigInteger bigInt1\
    \ = new BigInteger(long_max.toString());\n        System.out.println(bigInt1);\n\
    \    }\n} |\n\n+   3. Enhance the solution to the preceding exercise by increasing\
    \ the value held by the variable bigInt1 by 5 and then print the resulting out.\n\
    Hint: BigInteger.\nAInteger can only be directly added to an object of class BigInteger\
    \ (nothing smaller as this version of Java), therefore we have to:\n(1) convert\
    \ the primitive number that we seek to add to an object of its wrapper class,\n\
    (2) convert that object to its String representation using its toString method\
    \ and then,\n(3) Use that to create an object of class BigInteger, which you now\
    \ add to the original BigInteger.\nIt might seem like a lot of steps, but it is\
    \ really not. Let's go!\nimport java.math.*;\npublic class PracticeJava {\n  \
    \  public static void main(String[] args) {\n        long long_max = Long.MAX_VALUE;\n\
    \        int numberToAdd = 5;\n        Integer numberToAddI = Integer(numberToAdd);\n\
    \        String numberToAddS = numberToAdd.toString();\n        BigInteger numberToAddBI\
    \ = new BigInteger(numberToAddS);\n        BigInteger bigInt1 = new BigInteger(numberToAdd);\n\
    \        bigInt1 = new BigInteger(long_max.toString());\n        bigInt1.add(numberToAddBI);\n\
    \        System.out.println(bigInt1);\n    }\n}"
