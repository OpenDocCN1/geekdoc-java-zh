  md: '# Chapter 7. Arrays


    Arrays are a convenient and necessary part of any computing language, as they
    facilitate the grouping of data items together as a single indexed unit. In this
    chapter, you get an opportunity to exercise and enhance your skills with arrays
    in Java. Among the exercises presented in this chapter are exercises on array
    declaration, creation, initialization, assignment, copying, reversal, subset manipulation,
    sorting and element searches. Exercises on multi-dimensional arrays are also presented.


    In addition to the built-in syntax for array handling, recourse is made heavily
    to the methods of the Array class.


    | | In Java, what is an array? | An array is a data element that has an indexed
    list of items (primitives or objects) that are of the *same* type. The array index
    is an integer index.

    |---|---||

    | 1 | | If you want to put objects that are different types into an array, you
    have to cast the objects to the type of the array (if possible in the given case).
    In the sense of the items they are of the same type. |

    | 2 | Are descendants from class Object? | Yes, as arrays objects and the ultimate
    ancestor class of objects in Java is the Object |

    | 3 | I have an array of integers defined as: `int[] array = new int[3];` Explain
    what each part of this code statement means:

    1. `int` is the variable name of what we are going to define, in this case is
    a reference variable to array of integers. In a declaration, [] after the name
    of a type indicates that it is an array variable of type.

    2. `array` is the variable name we''ve chosen to define this array object reference
    that contains elements of type.

    3. `new int[3]` is saying that we are asking the system to allocate space for
    an array of 3 integers.

    4. `array` which appears on the left-hand side of the equals sign. |

    | 4 | What is the *1st* index of an array? | 0. Arrays in Java always start at
    index 0 |

    | 5 | Write a line of code which declares an int array variable intArray. | `int[]
    intArray;` |

    | 6 | Write a line of code which will instantiate an array named intArray with
    a capacity for 20 integers. | `int[] intArray = new int[20];` |

    | 7 | Assign the value 2 to the 1st index of the array defined above. | `intArray[0]
    = 2; // Remember that the 1st index is 0 |

    | 8 | Assign the value 800 to the 1st index of the array above. | `intArray[0]
    = 800;` simply overwrites whatever was previously set |

    | 9 | Assign the value 17 to the 3rd index of the array defined earlier. | `intArray[2]
    = 17;` |

    | 10 | Write a program which instantiates an array of size 5 of each of the following
    types: Float, float, Integer, int, double, boolean. | `import java.util.*;

    public class PracticeYourJava {

    public static void main(String[] args) {

    Float[] fArray1 = new Float[5];

    float[] fArray2 = new float[5];

    Integer[] iArray1 = new Integer[5];

    int[] intArray2 = new int[5];

    double[] dArray1 = new double[5];` |'
