  md: "# Chapter 19. The char primitive & the Character Wrapper Class\n\nJava presents\
    \ the ability to manipulate single characters, whether they are of char, or individual\
    \ characters in a String. This chapter presents exercises pertaining to various\
    \ aspects of the char type and its related wrapper class Character. Also exercises\
    \ on the relationship between the char type and integers individual elements of\
    \ String objects are presented.\n\nThe methods which operate on the char primitive\
    \ are found in its corresponding wrapper class Character; their interrelationship\
    \ is wov throughout the exercises in this chapter.\n\n|1. What is Unicode?\nUnicode\
    \ is a encoding by which characters from various languages are assigned a particular\
    \ positive numerical value. The Unicode range exceeds one million, however, most\
    \ of the characters that are in use are in the range 0000(hex) to FFFF(hex) to\
    \ 65535 in base 10), a range can be represented in 2 bytes, which is the size\
    \ of the char primitive.\n2. What is the char type?\nThe char is a Java type that\
    \ is used to represent Unicode characters.\n3. Explain the basic concept of Unicode\
    \ encoding schemes.\nIt was earlier that in Unicode, characters have been assigned\
    \ a numerical value, ranging from 0 to a value that is greater than 1,000,000.\
    \ The concept of a Unicode encoding scheme refers to the different ways in Unicode\
    \ values are represented; In Unicode there are different encoding schemes, each\
    \ with a different emphasis. The schemes UTF-8, UTF-16 and UTF-32 exist; each\
    \ encodes the characters in a different way. For example, UTF-32 encodes the characters\
    \ in 4 bytes per character (which takes up a lot of space for characters which\
    \ don't really need to 4 bytes for representation), UTF-8 encodes the characters\
    \ in either 1, 2 or 4 bytes per character (which saves space for characters at\
    \ the lower end of the Unicode space, adds programming complexity). UTF-16 encodes\
    \ characters in either 2 or 4 bytes.\n4. What is the Unicode encoding used for\
    \ characters in Java?\nThe particular Unicode encoding uses 2 or 4 bytes to represent\
    \ characters.\n5. How many bytes are used to represent a char in Java?\n2 bytes,\
    \ which represents a range of 65536 numbers. The char type is represented by positive\
    \ integer values, the range of these 2 bytes is 0 to 65535.\nNote however, there\
    \ are enough Unicode characters that require 4 bytes for representation; these\
    \ are represented in Java by 2 chars.\n6. What numerical type would most directly\
    \ to the numerical range that a char will fit into?\nan unsigned short integer,\
    \ has a range of 0...65535 (char doesn't have an unsigned short type).\n7. Write\
    \ a line of code which will initialize the char variable first to the value 'x'.\n\
    char firstChar = 'x';\n8. Run the program and explain it.\npublic class PracticeYourJava\
    \ {\n    public void main(String[] args) {\n        char char01 = (char)100;\n\
    \        System.out.println(char01);\n    }\n}\n\nOutput: The program will output:\
    \ d\nThe reason why we can cast an integer to a char is because every character\
    \ has been mapped to a numerical equivalent in Unicode and its various encoding\
    \ schemes. In this example, we see the 100"
