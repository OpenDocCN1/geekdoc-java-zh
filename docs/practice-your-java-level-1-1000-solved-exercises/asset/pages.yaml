    }|

    | Given the following variable: boolean a = obj1 = new Boolean("false"), assign
    the value of this variable to a boolean variable. | |

    | Given the following variable: boolean a = true, assign its value to a String
    object. | public class PracticeJava {

    public static void main(String[] args) {

    boolean a = true;

    String str = Boolean.toString(a);

    }

    }|'
