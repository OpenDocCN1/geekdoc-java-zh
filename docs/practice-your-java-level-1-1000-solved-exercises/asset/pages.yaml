  md: "# Practice Your Java Level 1\n\nThe compiler takes care of the details in the\
    \ background.\nContrast the case of this with the use of boxing.\nThis feature\
    \ was made available in java as of version 1.5.\n\nWhat is the concept of unboxing?\n\
    unboxing is the means by which you explicitly, by means of a cast, convert a boxed\
    \ type back to its primitive type. If we want to convert the contents of an Integer\
    \ object obj1 with a value of 100 to an int k, the code would be as follows:\n\
    \n```\nInteger obj1 = new Integer(100);\nint k = (int)obj1;\n```\n\nWhat is the\
    \ concept of auto-unboxing?\n(This is the automated version of unboxing). Auto-boxing\
    \ is the name of the Java feature by which the compiler converts an object of\
    \ a wrapper class to its primitive value by means of using the assignment operator.\
    \ For example if we have an Integer obj1 and we want to put its contents into\
    \ a primitive k of type int we need to do the following:\n\n```\nint k = obj1;\n\
    ```\n\nThe compiler takes care of any details in the background.\n\nWhy is the\
