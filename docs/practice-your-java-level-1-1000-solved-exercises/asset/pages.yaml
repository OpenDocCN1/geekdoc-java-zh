    2. Given the following interface and class definitions:

    interface ITakeoff();

    interface ILanding();

    public class Helicopter implements ITakeoff, ILanding(...)

    public class Airplane implements ITakeoff, ILanding(...)


    State if any of the following lines of code is invalid:

    public Helicopter h01 = new Helicopter();

    public Helicopter h02 = new Helicopter();

    public Airplane a01 = new Airplane();

    public Airplane a02 = new Airplane();

    ILanding landings[] = new ILanding[];

    landings[0] = ILanding(h01);

    landings[1] = ILanding(h02);

    landings[2] = ILanding(h03);

    landings[3] = ILanding(h04);


