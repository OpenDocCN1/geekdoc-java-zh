    \ time information.\nWithin each, time zone has been assigned a name. The class\
    \ ZonedDateTime represents each of the time zones; as its name implies an \"id\"\
    \ for date. Now, being that each ZonedDateTime object has a time zone that it\
    \ is, in that time zone can be extracted from the ZonedDateTime object and assigned\
    \ to a Zoned object.\nThe class ZoneOffset represents the offset in minutes and\
    \ the time of a ZonedDateTime object from UTC/GMT.\nSummary: once you have a ZonedDateTime\
    \ object, you can determine which time zone (this is put into a ZoneId object)\
    \ and in what is the gap between this time zone and UTC/GMT (this is put into\
