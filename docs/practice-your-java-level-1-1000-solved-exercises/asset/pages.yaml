  md: "# Your Java Level 1\n\n| If I added 2 to x, then x would be moved to the position\
    \ Integer.MIN_VALUE -1.\nThis is how integer overflow occurs in Java.\nInteger\
    \ overflow should be assumed to be a risk for any integer computation.\nNote:\
    \ Even when you used the int type as an example, this concept applies to any integer\
    \ type |\n\nDescribe the concept of integer overflow.\nInteger overflow happens\
    \ when the result of an integer computation is a result that is less than (i.e.\
    \ closer to --) the minimum value that the int type can contain. With continuing\
    \ the analogy of int overflow on a wheel, if we subtract the value of 1 from x,\
    \ i.e. x=x-1, we are moving backwards on the wheel and the result is x=Integer.MAX_VALUE,\
    \ which is clearly incorrect.\n\nHow do I guard against integer overflow/underflow?\n\
    \ the \"Exact\" set of methods (introduced in Java 8) of the class Math with the\
    \ regular operators.\n\nWhat if a computation overflows or underflows when we\
    \ use an \"Exact\" method?\nAn exception will be generated by the program. If\
    \ it is not caught by the program, the program will stop running. We will look\
    \ at exceptions in a later chapter.\n\nI have two int variables a and b, the addition\
    \ of which has a risk of overflow and I want to catch this overflow. Write a sample\
    \ program to show how this would be done.\nState the output of this program is\
    \ using value of Integer.MAX_VALUE for both variables a and b.\nHint: Math.addExact\n\
    \n```\npublic class PracticeJava {\n    public static void main(String[] args)\
    \ {\n        int a = Integer.MAX_VALUE; //just for the purposes of this program\n\
    \        int b = Integer.MAX_VALUE; //as above\n        int total;\n\n       \
    \ total = Math.addExact(a, b);\n        System.out.println(total);\n    }\n}\n\
    ```\n\n+   Note(s):\n1. Running this code for the numbers will result in an overflow,\
    \ which causes the throwing of the exception java.ArithmeticException. Exceptions\
    \ are discussed in a later chapter.\n2. If you do not use the Math.addExact method,\
    \ the result would overflow anyway, not inform you (the next exercise).\n3. The\
    \ same exception occurs for integer underflow.\n\nI have two int variables a and\
    \ b with the value Integer.MAX_VALUE. Add using the addition operator and print\
    \ the result. Contrast the results of this computation with the result of the\
    \ preceding exercise.\n\n```\npublic class PracticeJava {\n    public static void\
    \ main(String[] args) {\n        int a = Integer.MAX_VALUE; //just for the purposes\
    \ of this program\n        int b = Integer.MAX_VALUE; //as above\n        int\
    \ total;\n\n        total = a + b;\n        System.out.println(total);\n    }\n\
    }\n```\n\nOutput: -2\nNotes: The result of the computation is clearly wrong due\
    \ to the fact that it overflowed! Also, there was no exception generated!\nConclusion:\
    \ If we want to detect under/overflow conditions, the \"Exact\" methods should\
    \ be used.\nHowever, their exceptions should be caught in order to avoid program\
    \ stoppage the exception being thrown.\nWe look at how to handle exceptions in\
    \ a later chapter."
