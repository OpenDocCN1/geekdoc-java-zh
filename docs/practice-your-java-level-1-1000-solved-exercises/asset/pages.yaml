  md: '# Introduction


    Welcome to Practice Your Java Level! This is a book designed to, through practice,
    improve the knowledge, skill and confidence of the reader in Java programming.
    Over 1000 carefully designed exercises along with their solutions are presented
    in this book to help achieve this end.


    On the back cover of the print of this book, we present four important objectives
    that are designed to help you achieve. We want to help you quickly achieve the
    following:


    +   (1) Attain a firm understanding of the foundations of this language

    (2) Have high retention of the knowledge presented in this book,

    thus increasing your (skill) and (4) confidence in your ability to program in
    Java at this level and pursue higher levels of this language.


    There are two ways by which this book helps achieve these objectives; first by
    properly ordering the chapters and contents therein, and by our unique question
    structure. We explain these by:


    # Understanding, Retention, Skill, Confidence by Proper Chapter & Question Order


    I have the following saying regarding airplanes; "despite the vast of buttons
    in the cockpit, an airplane is easy to fly if you let things in the right order".
    When learned and understood in the right order, you will easily remember which
    button is and what it does. The same concept holds for true Java. Therefore in
    this book, the presentation of the sub-topics of the language is put in the appropriate
    order for learning this particular language, aiding retention. As the reader proceeds
    from chapter to chapter, their knowledge and skill in Java is built a methodical
    fashion.


    # Understanding, Retention, Skill, Confidence by Optimal Question Structure


    It was stated that one of the objectives of this volume is to help aid understanding
    and to help aid retention of the material learned. Before the ubiquity of the
    internet, a developer had to retain a high degree of knowledge (not just facts)
    in his head, referring to texts only when necessary. However, now, due to improper
    learning and practice in the language at hand, a developer may spend a lot of
    time online looking for "point solutions" for problems, rather than taking the
    time to learn the foundation of the language properly.


    How does this volume aid understanding? How does it aid retention? How does it
    help up learning? It airs understanding, retention and learning by the following
    structure of the exercises:


    > The reader is often presented one concept/method at a time per exercise


    Like when we learnt the alphabet, we learned it by letter. Therefore, in this
    volume, an appropriate number of programming exercises require the use of one
    single Java method as the key to the solution of the exercise. This allows the
    reader to focus on this single method, aiding understanding and memorization.


    Of course, questions with multiple concepts are presented as well.


    # The reader is often presented with direct hints for programming questions


    This is a very important feature of the exercises in this book. We explain why.


    You see, if an exercise is presented on a topic with which the reader is unfamiliar
    or peripherally familiar, the reader will search (likely on the internet) for
    possible solutions. This'
  merge: -1
  pgno: 4
- img_proc: true
  md: '# Practice Your Java Level 1


    wastes time. In fact, for more complex topics, a reader may end up spending so
    much time reading potential solutions, that when he finally finds a solution he
    has forgotten how he got there and is too fatigued to actually remember it! It
    is better, as is done in this volume, to have "hints" which specify the exact
    Java methods that feature in the solution to the problem so that the reader can
    spend his time studying the methods/features that pertain to solving the problem
    at hand and implementing the solution. This focus also aids retention.


    # Inverse question structure


    There are some topics which are somewhat recondite. Instead of requiring that
    the reader come with solutions to questions, completed code is presented as the
    question, and the reader is asked to analyze the presented solution. The intent
    of these exercises is clearly to teach the reader involved topic at hand. Again
    this saves time and lets the user focus on learning the material instead of spending
    time searching at length for a solution.


    The reader will find this question structure most helpful.


    The astute reader will actually observe that while this is considered a practice
    volume, the structure of many the solutions is one actually teaching the Java
    topics presented.


    # Usage Scenarios For This Book


    It is envisaged that this book will fulfill the needs of the beginning to early
    intermediate Java developer and for seeking a hands-on review of the topics presented
    herein. The following usage scenarios are foreseen for this book:


    +   - For the individual without previous experience in Java, this book is intended
    as a companion text to a Java programming volume to help the reader broaden and
    solidify their understanding, retention, skill and confidence in Java by way of
    practice exercises.

    - For the returning Java programmer at this level, working through the exercises
    in this book may suffice as a text, giving the depth and extent of the exercises
    and presented solutions.

    - The programmer who prefers to learn by practice exercises will find this to
    be an appropriate volume.

    - The classroom instructor, who will be delighted to find that this book is a
    robust tool for ensuring that their students are well versed in and have proper
    depth in Java programming.


    # Intended Audience


    The primary audience for this volume is the Java beginner up to the early intermediate
    Java programmer.


    # Toolset


    The coding solutions in this book were implemented in Java 8 using version 4.4
    of the Eclipse IDE. There are no IDE specific exercises in this volume. The reader
    is encouraged to use any IDE of their choosing.'
