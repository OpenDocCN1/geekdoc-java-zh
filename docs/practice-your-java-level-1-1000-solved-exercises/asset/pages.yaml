  md: "# Chapter 29. File System I: Path, Directory and File Handling using NIO/NIO.2\n\
    \nThis is a key chapter in confirming and enhancing your skills with knowledge\
    \ in computer filesystem handling Java. Among the exercises in this chapter are\
    \ on directory creation, directory path handling, symbolic links, file archives\
    \ (zip files), the manipulation (moving, renaming, deleting, etc.) of the same\
    \ as well as the manipulation files.\n\nThe title of this chapter states that\
    \ the filesystems in this chapter use NIO/NIO.2 (which stands for New Input Output\
    \ Version). Prior to NIO, Java filesystem handling was handled by the functionality\
    \ in the java.io package. In version 1.4 of Java, NIO was introduced and in version\
    \ 7 was further enhanced and at present is called NIO.2. NIO/NIO.2 provide a number\
    \ of enhancements over the java.io package. While the java.io package is still\
    \ available and is still used by many, it is advised that Java programmers familiarize\
    \ themselves with the new package which has been present in Java for a number\
    \ of versions now. With that in mind, this chapter has been written to exercise\
    \ and enhance your skills using the path provided in Java.\n\nNIO/NIO.2 present\
    \ a number of classes and enumerations. In this chapter, you will exercise and\
    \ enhance your skills in using them. The exercises in this chapter employ the\
    \ NIO classes Path, Paths, FileSystem, FileStore, FileTime, the DirectoryStream,\
    \ UserPrincipal and BasicFileAttributes, along with the exception that NIO handles\
    \ for filesystem operations. Various Java concepts, including the use of interfaces,\
    \ and anonymous classes are necessary tools in solving the exercises presented\
    \ in this chapter.\n\n| In NIO, what does a Path object represent | A Path in\
    \ NIO generally represents a directory to either directory, a file or a symbolic\
    \ link. In such scenarios, the last element contained in a given Path is the name\
    \ of the directory, file or symbolic link that the Path refers to. In addition\
    \ to representing absolute paths, a Path object can represent a relative path,\
    \ or even just part of a path you might want to combine with other paths. We summarize\
    \ the answer given above as \"A Path object can represent the path to a directory,\
    \ a file, a symbolic link or even just part of a directory path\". |\n| Write\
    \ a program that obtains and prints out the path of the default working directory\
    \ that Java uses when running your program. \nHint: import java.util.*; \npublic\
    \ class PracticeYourJava {\n public static void main(String[] args) { \n System.out.println(\"\
    JVM working directory: \" + System.getProperty(\"user.dir\")); \n }\\ } |\n| Explain\
    \ in general terms the relationship of the Path to the class Classes. \nAs described,\
    \ the Path object can represent the full path to a directory, a file, a symbolic\
    \ link, or even just part of a directory path. If the Path class is a Path object\
    \ string that defines the individual elements of a path. For example, on a Windows\
    \ system, the path to a file might be defined as: \\\\\\\\Users\\\\PyJ3\\\\Desktop\\\
    \\abc.txt, whereas on a UNIX derived system the path to the file in question might\
    \ be defined as \\\\/Users/PyJ3/Desktop/abc.txt. The \\/Users/PyJ3/Desktop/abc.txt\
    \ of the path in sequence, PyJ3, Desktop, abc.txt of the path in sequence knows\
    \ how to concatenate them properly for the given system it is on (it pays attention\
    \ to the property path.separator) to form a Path object. \nThe Path class is also\
    \ used to create Uniform Resource Indicators (URI's) in the same way. (Exercises\
    \ on URI) |"
