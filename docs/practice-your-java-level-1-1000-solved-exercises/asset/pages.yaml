  md: '# Chapter 10. The Boolean Wrapper Class


    The Boolean class is the wrapper class for the primitive boolean. As certain features
    in Java do not accept primitives input (such as Collections, which we will see
    in later chapters), the Boolean class clearly stands for boolean primitives in
    such cases.


    The Boolean class presents the same operations that can be performed on boolean
    primitives, albeit in method form rather than operator form. This chapter presents
    exercises on this simple wrapper class.


    | Rewrite the following code using Boolean class objects instead of boolean primitives
    | public class PracticeJava {

    public static void main(String[] args) {

    boolean a = true, b = false;

    System.out.println(a & b);

    System.out.println(a | b);

    System.out.println(a ^ b);

    }

    } |

    | Hint methods Boolean.LogicalAnd,LogicalOr, | System.out.println(Boolean.LogicalAnd(a,b));

    System.out.println(Boolean.LogicalOr(a,b));

    System.out.println(Boolean.LogicalXor(a,b)); |

