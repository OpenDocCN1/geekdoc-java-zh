  md: "# # Chapter 32. Graphical User Interfaces using Swing\n\nThis chapter presents\
    \ exercises on graphical user interface implementation using the Swing library.\n\
    \nGraphics in Java is an extensive topic, exercises on which can easily fill multiple\
    \ volumes. It is quite likely that you will be the front end of graphical applications\
    \ using a GUI builder, sidestepping some issues in GUI layout (for example details\
    \ of Layout managers). The foregoing notwithstanding, there benefit in having\
    \ understanding of what the GUI builders are. This chapter presents a carefully\
    \ chosen set of exercises that confirm your understanding, of the structure of\
    \ GUI applications, GUI components and event listeners in Java Swing.\n\n+   1.\
    \ Describe in general terms each of the following Java packages and their relationship:\
    \ AWT, Swing & JavaFX.\n Abstract Windowing Toolkit, also known by its acronym\
    \ AWT, is the original graphics package with Java. It delegates a lot of graphical\
    \ painting to the underlying operating system and therefore AWT applications have\
    \ the look and feel of the system that they are running on.\n Swing, which is\
    \ built on top of AWT, developed in a later version of Java (version 1.2), It\
    \ presents more advanced-built graphical painting of components than AWT. Swing\
    \ itself is written in Java. Swing also has more control over the actual drawing\
    \ and painting of components and their look and feel, allowing you to specify\
    \ a common look and feel for your application across all platforms.\n JavaFX is\
    \ currently the next generation graphical toolkit. It is based on a scene graph\
    \ model. A FXML, is provided for layout and JavaFX components. It also provides\
    \ even more powerful built-in components than Swing (for example, the MediaFX\
    \ library). The look and feel of JavaFX applications can be customized using Calling\
    \ Style Sheets (CSS). JavaFX's design makes it easier to provide environments\
    \ within your application. If desired, the user can also embed JavaFX features\
    \ within a Swing application through the Swing JPanelFX.\n2. In general terms,\
    \ what are \"components\" in Swing?\n\nA component in Swing means a \"graphical\"\
    \ component of your user interface. Well-known examples of built-in graphical\
    \ components include buttons (push), text areas (there are a number of different\
    \ ones), radio, check boxes, list boxes, scroll bars, menus, file chooser and\
    \ tooltips among others. Each of these components can \"listen\" for user interaction\
    \ and report them to the application for the appropriate processing.\nYou can\
    \ also build your own custom components.\n\n+   3. Describe in broad terms the\
    \ components of Java and how to build a graphical application in Java Swing. Your\
    \ description touch on the concepts of Frames, Layouts, and Event Listeners.\n\
    A Java application exists in a frame (in this think of a picture); this is realized\
    \ by an object of JFrame. A JFrame object has a number of distinct subarrays,\
    \ one of immediate pertinence being (1) the application frame (the use of) (2)\
    \ a menu bar (the use of which is optional) and (3) the content pane, generally\
    \ of JPanel, where the application components (such as buttons, although, text\
    \ areas, check boxes and similar) are. There is a default object assigned as the\
    \ content pane for a JFrame, you can obtain it by the following code:\n\n```\n\
    <JFrame>.getContentPane();\n```\n\nnYou are free to replace the default component\
    \ with your own JPanel object. You would do that in following:\n\n```\n<JFrame>.setContentPane(new\
    \ JPanel(...));\n```\n\nLayouts\nHow do you determine the layout of different\
    \ components within a JPanel? One way is to manually specify the individual positioning\
    \ of components by (x, y) coordinates, or to use one of the \"layouts\" that Swing\
    \ has provided to help ease the component layout process. Each of these layout\
    \ managers has different"
