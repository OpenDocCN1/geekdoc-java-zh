    # The sonic


    ‘Bass history is a moving/as hurting black story’ intones dub poet Linton Kwesi
    Johnson on the 1980 album Bass Culture (Johnson 1980). In landmark collaboration
    with Dennis Bovell, Johnson speaks poetic verse through dub''s deconstructive
    rhythms, drawing attention to the work of sound, and bass, and in conveying the
    history of black Atlantic people in Britain. Eight decades earlier, US sociologist
    W. E. B. Dubois made similar comment on black US culture. In his seminal work
    The Souls of Black Folk, slave spiritual as central agencies for an exploration
    of racialized being and knowledge. These haunting melodies welcomed from the black
    souls of America’s dark past. Scored in minor key, they ‘articulate[d] the message
    of the slave to the world’ (Du Bois 2007: 3–4, 169) – a message not intelligible
    to slave-owning households. For Plantation Lady Mary Boykin Chesut ‘the words
    have no meaning at all’. For, the handlers, ‘shrill shrieks,’ ‘minor key’ (cited
    in Shaw 2013: 138). Indeed, like the reggae bass line, many of those songs did
    not have literal meaning, but they carried them knowledge both terrible and joyous.
    They communicated a message to the world, ‘a hope – faith in the ultimate justice
    of things’ (Du Bois 2007: 169, 175).²


    > ¹The sonic sounds selected for this book are not to be representative of British
    diasporic sound and music cultures in the post-war period, or of all associated
    sonic intimacies. Rather, they are selected because of their prominent place in
    popular culture and because of their particular affinities with their moments.
    These affinities, then, provide the basis for making a theoretical argument about
    the transformation of sonic intimacy in late modernity. Readers interested in
    the interface with the black diasporic and south Asian sound culture are advised
    to engage additionally with some of the excellent work in the field (Sharma al.
    1996; Kim 2012).


    > ²The child sang it to its children and to their children, and so two hundred
    years it has travelled down to us and we sang it to our children, knowing as little
    as our fathers what its words may mean, but knowing the meaning of its music’
    (Du Bois 2007: 170).'
