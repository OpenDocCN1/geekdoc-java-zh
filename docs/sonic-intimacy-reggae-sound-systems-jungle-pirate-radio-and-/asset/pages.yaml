    # Relation


    This chapter explores how reggae sound systems were comprised, experienced and
    lived in that moment and what that entailed for the alternative cultural politics
    of 1970s and 1980s Britain. It tells this story through sonic intimacy; the its
    intimate social and material relations, through its intimate knowled, through
    its proximities, through the fullness of its vibe and through its deep sensibilities.
    But in order to consider these matters we first need to engage with how the reggae
    and dub sound systems were dynamically comprised technologically, socially and
    sonically. We need to acknowledge the basis of sonic system''s techno, social
