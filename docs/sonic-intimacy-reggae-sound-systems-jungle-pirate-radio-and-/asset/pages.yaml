  md: '# SONIC INTIMACY


    Critical left scholarship, then, offers an attractive thesis — one which can be
    mobilized with facility to understand all manner of social, cultural and political
    problems. Indeed, the most reductive and loudest versions of these critiques are
    particularly saleable and satisfying. When society is run by politicians who have
    more invested in hedge funds than high streets and where racism and nationalism
    are the principle moves of generating electoral consent, nothing feels better
    to shout back, but a roar on those terms, however cathartic, is cathic in the
    night.


    That is not the approach I have endorsing in this book. Rather, through a discussion
    of sonic intimacy, the book has explored how versions of modern culture skew to
    the dominant regimes of racial capitalism — not with or without, but alternative;
    and how alternative culture provide political resources for anti-racism and post-colonial
    power.


    Making this case for alternative political culture is categorically not an argument
    for the pre-modern — for animism and the like. I have repeatedly stated the perils
    of these discussions in relation to race. While animist analyses might sometimes
    be useful in figuring industrial modernity as a destructive aberration in planetary
    time, their anti-modern positions also frustrate alternative engagements with
    modernity and the uneven resonances it contains, both intellectual and political,
    for anti-racist and post-colonial scholarship. This book''s analysis of sonic
    intimacy has responded to the racial and classed violence of late modernity not
    by addressing outside modernity (the primordial model) or culture as object from
    modernity (resistance), but by addressing culture in alternative relation to dominant
    modernity.


    In this book, the alternative cultural politics of black diasporic sound cultures
    have been discussed in terms of sonic intimacy. It has been through sonic intimacy
    that the book has reflected on the ways in which the cultural politics of the
    black Atlantic are alternative to dominant racial, capitalist visual and textual
    scripts. It is through the transformation of sonic intimacy that key shifts in
    alternative cultural politics have been assessed.


    In this book, alternative cultural politics has been placed in tension with the
    dominant politics of racial capitalism — economist'
