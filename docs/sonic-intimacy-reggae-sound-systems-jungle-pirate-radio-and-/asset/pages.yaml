  md: 'literary of the enlightenment, precisely because of its marginal relation to
    it. Its documentation is not primarily found in the textbook (although there is
    now a significant literature in this area) but in its accumulated traditions,
    expressions and politics, many of which are sonic.


    This is not to make the case for the neat separation of sound and text, and by
    inference blackness and whiteness. Such binary conflations are in fact ''unhelpful
    in thinking through the transformation of sonic intimacy through modernity. The
    sonic and symbolic remain intertwined, both are part of the racial structuring
    of modernity, just as diasic sound cultures resist, but can also reproduce dominant
    social orders.


    To draw out these textures and tensions, this book addresses sound not as a ''thing''
    or an ''effect'', but as relation. For that reason sound is discussed as ''sonics''.
    The sonic is not synonymous with ''sound''. Rather it is concerned with the ways
    in which sound is culturally formatted the sonic has included both the structured
    materiality of sound and the hearing subject, which becomes a feeling subject
    when vibration is taken into account. In this way, the sonic relates to the subject
    and by extension to their everyday hearing/feeling contexts and social organizations,
    that is to say, to the cultural. The sonic is cultured matter.


    In modern scholarship the visual has tended to take primacy over the sonic – whether
    that be sound, vibration, music or noise. It has been the visual, not the sonic,
    that has dominated discussions of twentieth-century modern culture. From advertising
    hoardings and cinema projections to flat screens, modern society has been saturated
    by the visual. That, as documented in Guy Debord''s Society of the Spectacle,
    has profoundly affected how we know and how we are, pushing sound (which is ubiquitous
    as light) to more marginal sites of public knowledge (Debord 2002).


    Understanding the sonic in modernity is, then, fraught; the quality of sound not
    easily grasped by scholarly disciplines born of modernity and predisposed to (and
    often preoccupied with) the visual. But to comment on a preoccupation with the
    visual is not only to note an analytic predisposition for culturally informed
    arrangements of light. In fact preoccupation with the visual is more particular.
    Whether it be the advertising hoarding or indeed the page of a book, the preoccupation
    has been particularly with the textual – which is to say, it has been concerned
