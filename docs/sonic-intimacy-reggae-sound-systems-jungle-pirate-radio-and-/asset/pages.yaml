    Cultural studies of jungle were published at the time,¹ and less still written
    about jungle pirate radio itself. Ethnographic approaches were frustrated by the
    radio pirates'' secrecy, while media studies focussed their preferred gaze on
    commercial, state, military and community broadcasters. For radio studies, black
    diasporic illegal music radio was not actively disregarded as such, just not heard.


    To address this, the chapter engages with recordings of jungle pirate radio shows
    uploaded by fans to Internet sites. Discussion of these is supported by analysis
    of journalism, literature, documentaries and film footage from the period. Jungle
    pirate radio''s online archive is uneven. Prominent stations such as Kool FM are
    accounted for, where many hundreds of smaller stations from around London’s peripheral
    market towns – the stations of High Wycombe, Uxbridge and Hertford, for example
    – are absent. In this way, we miss the people who stood an aerial up on a shed,
    or the side of a hill, to broadcast to the town centre massive.


    # History of jungle pirate radio


    Appearing after the vibrations of the sound system and before the devotions of
    YouTube, jungle pirate radio is synchronous, not separate, from both. It shares
    the black vernacular music forms of reggae and grime, as it does its autonomous
    media ecologies and geographies of the city. Their modernities and mobilities
    are intertwined, too. In jungle pirate radio, the recorded music and transistor
    technologies of sound systems move through telephony, cars, motorways and young
    people’s bedrooms.² pirate radio’s history is, then, a modern one as it is also
    a black diasporic sonic once.


    Popular attention to illegal music radio has focused on the UK sea pirates of
    the late 1950s and 1960s for whom the ‘pirate radio’ was coined. The risqué but
    palatable heroes of stations such as Radio Caroline and Radio London are the stuff
