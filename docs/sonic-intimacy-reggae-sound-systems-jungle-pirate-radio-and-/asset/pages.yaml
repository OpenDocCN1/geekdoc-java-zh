- img_proc: true
  md: '# SONIC INTIMACY


    better than magic. It''s the full and relational coming together of diasporic
    sounds, technologies and human/social relations in the sound culture as expressed
    in the dancehall, rave or radio. That particular collection of factors coheres
    into a sense of something powerful, something genuinely spellbinding.


    The vibe of the reggae dancehall is a wholeness that precedes the moment the stylus
    touches the record. As the tune drops, technology, sound and the social are activated.
    The wholeness of jungle pirate radio is speed and love. It is raves, radios, cars,
    phones and records, running to burn-out. That ‘hype’ is mutual, outward-looking,
    multi-ethnic, black and expansive, but within the city’s limits. It is composed
    of multiple diasporic strands. Hype is for/by the junglist massive. It is prefigured
    in the ether. It anticipates the MC. It hangs for the b-line, drop, buzzing for
    the phone-in, for the shout to Anita from Charlton. Full to bursting, jungle radio
    wholeness is supercharged. It threatens obliterate the moment, but it can’t.


    The wholeness of grime music videos is viscosity, endorphins, blue light, paper-thin
    permanence and hyperlinked bits. It is social media, mobile phones, tiny speakers,
    screens, the Internet and the everywhere/nowhere digital proletarius. The affective
    binds, chemical rushes and restless hyperactivity provides feelings of hunger
    and near-satiation, a sense of spilling over that is too capital-orientated to
    ever be poetic. Its spills and thrills are less based on a dissonant fullness
    at odds with dominant racial capitalism than they are the denial of that condition.
    This is the wholeness of the lived multi-ethnic city, for a sound culture that
    is not easily ethically owned. But it is also a wholeness for audiences sourced
    by Google Analytics, for spectators fed on hackneyed images of authentic saleable
    selects.


    The sound cultures in this book do not exhaust the sonic intimacies of late modernity,
    or even those of black diasporic cultures, but they are three of the most popular
    and most telling. Shifts between them matter because they concern our abilities
    to be filled with the other, with the dance, with the city and humanity. Vibes,
    hypes and grime instruct us on the resonance and residue of humanity. Their challenge
    is where to press one’s ear and how to listen. In an era better attuned to vociferous
    claim and counter claim, the minor keys of human life easily go'
