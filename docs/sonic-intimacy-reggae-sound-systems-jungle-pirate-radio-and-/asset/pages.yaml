  md: '# INTRODUCTION


    logos – signs, signification and the like. In cultural studies this influence
    is ubiquitous. From the semiotics of Barthes and the textuality of Butler, to
    Hall’s work on representation and Dick Hebdige’s statement that youth subcultures
    (punk in particular) were ‘pregnant with significance’ (Hebdige 1979), it has
    been a textual reading of the visual that has provided the codex to decrypt the
    inner meaning of the modern. Indeed, this approach to culture has informed accounts
    on sound and music in every everyday life (DeNora 2000). This prediction for the
    visual-textual has not been helped by the conjoint (patriarchal) assignment of
    the ear as a vulnerable organ; or an that could be penetrated; that could not
    be closed the eye; that could not be mastered to attend critically to the dangers
    of modern life (Boutin 2015: 13–14; McLuhan 1967: 32; Simmel and Lefebvre 1971).


    This is not to say that the relation of sound to modernity has gone ever unnoticed.
    Scholars most associated with textual readings of life have also explored modernity
    through sound. Benjamin and Lefebvre both developed personal and poetic reflections
    on the sounds of cities. Benjamin’s writing on Freiburg, Marseille and Berlin
    show how the city’s echoes add and alternativeities to the urban spectrum. His
    essay on Naples explores the porous rhythms of architecture, society, religion,
    history, emotion, eroticism, touch, smell and sound. Sonics spill from his pages
    as they overflow from crowded dwellings and communal streets (Benjamin 1979).
    Lefebvre’s work – the last text before he died in 1992 – attended to the rhythms
    of Mediterranean towns. Positing a flâneur (the ‘rhythmanalyst’), Lefebvre revealed
    his sonic sensitivity, one attuned more to times than spaces, to moods than images,
    the atmosphere as to particular events (Lefebvre and Regulier 2004: 87–8). Lefebvre’s
    ‘rhythmanalyst’ was alive to the diasporic formation of these towns (part of their
    maritime history), and to the ways in which each peculiar locale develops its
    own reverberation.


    As Benjamin rejected the narratives of progress and containable clarity that bourgeois
    textual accounts of the city, Lefebvre’s rhythmanalyst deployed a relational and
    distinctly post-colonial early to the same end. Benjamin’s anti-enlightenment
    sensibilities and Lefebvre’s diasic empathy form, a productive interface with
    black diasporic and post-colonial scholarship, but this is not to say that they
    were engaged with questions of race or colonialism in particular.'
