    There, the impression of collective anti-racist assertion is little more than
    overinvested digital personas. Such political action no longer has the means or
    desire to unveil its object of attention – racism. It no longer has the ability
    to form critical antirac associations. A politics that claims to do anti-racist
    work through loud, cultish and denounced accounts of elsewhere is not effectively
    anti-racist at all. It feeds a theatre of indignant contest set on its own erroneous
    terms.


    Through these submissions we adhere to one of bourgeois capitalism’s principle
    rules, and operations of power – the rule/power over time is ordered to the end
    of property and profit. Because what is occurring in these moves is also an over-privileging
    of the immediate, in which the past becomes a fragment in critical scholarship
    to more forcefully render the anti-racist claim. Snippets of texts, bites of convenient
    history and the odd Lorde and Fanon quote become incorporated into a form of action
    less interested in'
