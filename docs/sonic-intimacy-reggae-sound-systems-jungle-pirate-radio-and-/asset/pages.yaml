  md: 'distance between her body and the dead weight of the mê. Her greatest moments
    of comfort appeared to come when her ‘skwod’ gathered on stage, evidently friends,
    and she could feel the intimate embrace of the cypher. Her other moment of comfort
    came as she physically abandoned those assembled in front of her to live Snapchat
    from a screen that she gives her love.


    This book’s enquiry on the transformation of sonic intimacy and alternative cultural
    politics lies between this moment (the interface of black diasporic sound culture
    with social media) and two others: the reggae and dub sound systems of the 1970s
    and 1980s and jungle radio prior to the 1990s. Half a century prior to Nadia Rose’s
    appearance at Village Underground, hundreds of reggae and dub sound systems were
    producing the bass-mediated demands in excess of the racist state of the moment
    (Gilroy 1987). As captured in Franco Rosso’s film Babylon, their low-end properties
    collected the dance floor and a largely black and working-class contingent, while
    providing the raw material to produce an alternative imagination of Britain (Rosso
    1981). A decade or so later, hundreds of jungle radio stations blasted rolling
    bass across British cities moving under the pressure of decades of Tory rule.
    Between bedrooms and cars, working-class and multi-ethnic dialogues were sustained.


    Between these three moments (regae sound systems, jungle pirate radio and YouTube
    music videos) lies an important question about the transformation of alternative
    black diasporic sound culture in Britain. How did the bass-mediated demands of
    the reggae and dub sound system bleed into the fractured fervour of pirate radio
    in the 1990s and then into the hyperlinked intensities and immediacies of YouTube
    music videos from 2008 onwards? To what extent was the tactility and proximity
    of the sound system necessary for the kinds of alternative politics it generated
    against the racist state? How can these politics to an illegal radio infrastructure,
    dispersed, extensive and fully charged with the optimism of John Major’s Britain?
    And how should both be considered in relation to YouTube music videos’ corporate
    ownership, atomization and digital screen intensities?


    The book addresses these questions through lending an empathetic ear to modernity’s
    relational flows of alternative and dominant formations. That is also to say that
    it does not answer'
