    of racism. That is to say, the figuration of the working-class as white develops
    a critique of socio-economic injustice but does not extend the same lens to racism.
    Whiteness is not a reactionary category not a critical one. Unlike race, whiteness
    is not conveyed in critical relation to power but rather solicits a key mode of
