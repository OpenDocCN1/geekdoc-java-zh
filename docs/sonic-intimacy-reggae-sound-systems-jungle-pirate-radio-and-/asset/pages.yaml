  md: '# CONCLUSION


    establishing its relation to those pasts than it is in substantiating its own
    immediate claim through the currency of the present. As with all bourgeois capitalist
    regimes, the immediate must be dominated, must be owned, an assertion must be
    substantiated over that moment. Loudly contesting racial dominance while re-inscribing
    capitalist governance can then frustrate, rather than further, activist scholarship
    and its knowledge of located anti-racist histories and cultures.


    Pushing back and forth along the lines set by modern dominance, this mode of critical
    left scholarship then finds it difficult to understand how cultural politics exists
    in relation to dominant modernity. It finds it difficult to assess the ways in
    which alternative modernisms intertwine with dominance and how they are also available
    as powerful threads for anti-racist work. It finds it difficult not because it
    disagrees with the possibility of such things, but rather because the moulds in
    which it is sedimented those lines of interrogation and action. When scholarly
    engagement is set by the epistemic terms it contests, when its defensive identitarian
    positions pertain to the magnitudes of that which it disavows and when the effectiveness
    of the argument in the arena comes through strategies of violence and property,
    it will be necessarily difficult to understand the ambiguities of a moment and
    to have a feeling for the forms of critical modern life that move beneath the
    ground in which its feet are so firmly planted.


    It takes a riot, heavy snowfall (in the UK that can reroute society for a day),
    tragedies such as Grenfell and the ‘refugee crisis’ or a strike to bring popular
    attention to the cultural political alternatives of quotidian life.³ When these
    disruptions take place, alternative conditions are awoken and momentarily at least,
    frames of reference are shifted. When flows of commerce and drudgery are recomposed
    by fire and mass street occupation; when the middle-class and working-class sides
    of London’s neighbourhoods convene for snowball fights and sledging; when hundreds
    walk silently every month against housing injustice; when strangers come together
    to care for refugees on shores of the Mediterranean; when workers act against
    injustice, a reconnection with people and the deliberative reality of political
    action occurs. But as normal service resumes, those moments are folded back into
    the rhythms of dominance.


    ³Or, indeed, door-stepping in a General Election campaign (Balani 2019).'
