  md: '# CONCLUSION


    appraisal of multi-ethnic conviviality is based (Back 1994; Gilroy 2004; James
    2015; Valluvan 2016). Finitude structures a city’s ‘indifference to difference’
    (Amin 2010). The finite collective of the dancehall and the pirate radio made
    contact and coexistence comprehensible.


    YouTube is plenitude. Grime YouTube music videos are convivial, but their mediation
    is not finite. YouTube videos require users to infill the absence of the everywhere-but-nowhere
    interlocutor. Absence is often supplemented by retrenchment to the self and loud
    saleable identity positions. In that sense, plenitude is the feeling of being
    pulled apart. It is the basis of anxiety which feeds the already existing social
    negations of late modern life.


    Mutuality doesn’t end. It encompasses the politics of care and gift that are inherent
    to conviviality but do not require and cannot be reduced to it. Mutuality, care
    and gifting operate as alternatives to cruelty, property ownership and privatization,
    even as they are often entangled with them. In reggae, jungle and grime, they
    are observed through community, kinship and the intergenerational spread of family
    networks and peer associations. These relations are deep. They work against the
    privatization dominant society demands. They extend from close networks to wider
    communities, to the ‘massive’, where they are regarded as ‘life support systems’.
    An extraordinary claim in today’s terms, the systems of care in sound cultures
    can support life!


    And in sonic life-support systems, expression and dialogue routinely come before
    profit. Here, wisdom is gifted through apprenticeship, music is gifted to the
    city, the producers gift beats, mixes and samples to one another. Property is
    not the point. Getting rich or getting by is usually secondary. And even when
    such practices find affinity with proumption, they are not totally captured by
    it. Reciprocation is still vital. And in the context of which hostility is the
    norm, that matters also.


    # Wholeness


    Together, these alternative cultural politics are often explained as magic and
    mysticism. This is not because ravers believe in witches and steppas in wizards,
    but because the experience of sound cultures surpasses language. But this experience
    isn’t magic, it’s'
