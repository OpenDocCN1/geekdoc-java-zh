    # Jungle pirate radio as relation


    Jungle pirate radio was broadcast from studios in sheds, disused flats, squats
    and hired premises. Standard to most studios were two turntables, a mixer with
    crossfader (the influence of hip hop), an amplifier, speakers, headphones and
    a microphone. This studio technologies were connected to a transmitter. The transmitter
    was hardwired to the studio’s location or, more commonly in this period, connected
    to a microwave emitter. The microwave emitter sent the signal in a direct line
    of sight to a microwave receiver located on a different site. That protected the
    position of the station in the event that it was discovered by the authorities.
    The microwave receiver was connected to a solid-state transmitter wired to an
    antenna from which the radio signal was sent. The FM signal is reduced as it passes
    through solid objects, so these


    On the reception was a radio receiver. By the 1970s domestic radios were common
    in British homes. These radios were usually the size of a shoebox and contained
    one speaker that produced about 5–10w of sound. By the 1990s these sets were being
    replaced in young people’s bedrooms by the hi-fi and portable stereos of Japanese
    technology companies Sharp, Sony, Akai, JVC, Technics'
