- img_proc: true
  md: '# CONCLUSION


    sound signed through the racialized body, sang with a human voice, a voice that
    appeared in pixelated form. And while that singing continues, racial capitalism
    has not taken full hold.


    # Autonomous temporal zones


    Travels in time, from clockwise to ‘dub-wise’, the alternative temporalities of
    the reggae sound system move outside the grind of white bourgeois rhythhythms,
    keeping alive black diasporic experiences at home and abroad. Jungle pirate radio
    cites the chronometers of dub inducing autonomous temporal zones of intensity
    and speed. Dance floors and call-ins strain the mechanisms of the normative dial,
    the aesthetic impermanence of dialogue and misdistort diurnal formality, for the
    reimagination of the future city.


    Grime is more immediate still; on the limit, on the brink, spilling out of pirate
    radio studios across London, rooftops with no safety rail. Its raves and radios
    move in lockstep with the grit and impermanence of advancing physicality. Record
    shops, radio ... YouTube music videos intensify that immediacy, but also curtail
    its impermanence. On impermanence, post-reggae humanisms were set, and by YouTube
    they decay. In flux but not on the brink, grime YouTube music videos are out-of-time
    hollow hyper replications of the now, intensifying grime’s theatre of claim and
    counter-claim to the detriment of urgently restlessness and autonomous temporality.
    YouTube grime music videos move with the compulsive clicks of the networked meter,
    when breaking the mould of dominant time still matters a great deal.


    # Wisdom


    The knowledge systems of reggae, jungle and grime move outside the property regimes
    of dominant life. Livity, jungism and grime lay below the informatic-now. The
    wisdom of black life in British cities are compiled with acmens of the diasporic
    experience, intelligence on fast-paced multi-ethnic conviviality and the aptitude
    of post-industrial places. In series, they are chains of activation. Together
    they carry the fullness of shared life, knowing touched by many hands.'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'Wisdom moves through music – through codified sounds played back to the city
    and affirmed by its celebrants. Affirmations of social position and daily rituals,
    political struggle, oppression and emancipation filter in and out of those sounds.
    But wisdom is born through sonic atmospheres, too. Registers of intensity, coldness
    and warmth, structure the general knowledge of moments, as their variable amplification
    patterns sagacity in time. Intertwined with information, reggae and jungle nonetheless
    white labels, mixing and the sonic form itself undermine property. But in grime
    YouTube music videos, wisdom and information are more tightly twisted. Dominance
    is nearly indiscernible from its alternatives, although alternatives persist nonetheless.
    In fact, DIY grime YouTube productions are redolent with alternative knowledge,
    even as they are routed through the reductive streams of digital capitalism.


    # Craft


    Craft doesn’t live here any more! Those techno-social processes anathema to labour
    alienation, these open material relations productively at odds with capitalist
    exploitation, seem to have their day with the advent of YouTube and 3G. In the
    reggae sound system, constellations of skill, refinement and creativity found
    their expressive outlets through the sounds and sociabilities of the dance floor.
    Consumer culture made inroads into jungle but couldn’t pierce the illegality of
    its pirate infrastructure where apprenticeship thrived. As the tower blocks fell
    and the social media came of age, the closed circuitry of consumer technology
    advanced. That didn’t change the music or its feeling overnight, but its techno-social
    relations were altered. Craft has been laid down, and with it a potent alternative
    to techno-capitalist domination.


    # Mutuality


    Mutuality has transformed. In reggae sound systems and jungle pirate radio, mutuality
    was sustained through finitude – presence and horizontal relations within delimited
    social and geographical spaces. Finitude facilitated the openness on which the
    more routine'
