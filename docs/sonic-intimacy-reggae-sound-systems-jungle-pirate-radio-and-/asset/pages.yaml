    it is in popular culture, the fabric of everyday life and in the creative and
    habitual patternings of the ordinary, where barbarity is lived, and consent to
    secure (Hall 1996). Equally, it is in popular culture that alternatives to barbarousness
    are found. It is in the routine banality of popular culture that lie vital contradictions
    and persistent sources of hope.


    Sonic intimacy is suited to this inquiry precisely because of its ambivalent relationship
    to dominance – to visual and textual racial capitalism. The sonic intimacies of
    black diasporic culture then carry a cultural politics from below; a cultural
    politics which has stories to tell. ‘Bellow’, here, does not denote ‘separate’
    from dominant modernity. Rather, Bellow is the minor key to modernity’s major
    movements.⁴Bellow’ is laid down against the grain of capitalist information-time.
    ‘Bellow’ prefigures dominant modern epistemes as it also carries the terror and
    joy of its times. What ‘below’ can be struck up and rearranged for the present⁵


    ‘Bellow is democratic, realized by revellers and open to fellow travellers. In
