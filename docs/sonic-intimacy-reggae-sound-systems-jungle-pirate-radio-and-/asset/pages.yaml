    # Intimacy


    Intimacy is less familiar to cultural studies than scholarship on

    sound and the sonic, although it is well developed in English

    literature, psychology and psychoanalysis, and to a lesser extent in

    sociology. Much of this, of course, deals with love, sexuality and

    romance. And while the dynamics of these relations are relevant

    to this book, the forms of intimacy discussed in the following

