    # Deterritorialized and hyperlocal


    As YouTube took grime, many of the social and spatial intimacies of the sound
    culture''s pirate radio were retained. After all, God''s Gift and DJ Target were
    family friends, D Double E''s and Jammer''s dads had been at school together,
    and Tinchy Stryder, Dizzee Rascal and other members of Ruff Squad went to Link
    Centre youth club of Devons Road.⁷ These relations went under various interpersonal
    stresses and strains, but they did not evaporate. At the same time, however, forms
    of presence were altered. As YouTube became more prominent and the media ecologies
    of pirate radio were displaced, people were no longer calling into pirate radios
    saying, ''Yes, Wiley, you''re calling it!'' or ''Big up Blah-Blah from Blah-Blah''
    (Wiley 2017: 82). From city wide call-ins and rewinds, the dialogues of the city
    were now increasingly online – simultaneously hyperlocal and deterritorialized.


    Hyperlocality refers to the intensification, by social media platforms, of already
    existing neighbourhoods YouTube videos. These videos perform hyperlocality through
    the use of neighbourhood symbolism (local landmarks, gang colours and the male
    crew), which map onto territories and postcode areas. We can see this in the videos
    of the Newham group Upcoming Movement (Ice Films Entertainment et al. 2011a, b;
    Upcoming Movement 2012). These localisms are not new, but trace older rivalries
    between working-class neighbourhoods also negotiated through masculinity.


    Through YouTube music videos these historical localisms are shrunk. Here, the
    jungle that opened up to the city, turns in. These hyperlocalities are compounded
    by the age and limited mobility of many grime protagonists, by the closing down
    of former sites of sociability – pirate radio stations, record stores, club nights
    and youth clubs – and the policing of the remaining available public spaces –
    street corners, parks and stairwells. However, it is also the case that grime''s
    condition of hyperlocality is shaped by the YouTube platform itself. Where a grime


