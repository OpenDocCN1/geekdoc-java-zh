  md: '# GRIME AND YOUTUBE MUSIC VIDEOS


    not through shared sonic knowledges of the past and everyday life, but through
    impressions left in view numbers, comments boxes and Google Analytics’ data. These
    deterritorializations accompanied entrenched localism. In the context of pervasive
    neoliberal negation, and in the absence of foster forms of social mixing (record
    shops, youth clubs and city-wide pirate radio broadcasts), pre-existing definitions
    of neighbourhood insiders and outsiders were revived. This was a shift away from
    the city that embraces you back, and one that looked to local rivalry rather than
    metropolitan movement for comforts.


    Although redolent with autonomous hubs of street life and local affiliation, as
    the sound systems were replaced by algorithms, grime YouTube music videos were
    increasingly for elsewhere, for YouTube. These videos produced in the street were
    consumed as past outside of their immediate circles.


    The alternative rhythms and expression of craft and illegal DIY were denied by
    the closed circuitry of mobile phones and online platforms. These locked technologies
    were proprietary, too. The form of mutuality and gifting that has long existed
    in black diasporic sound culture was co-opted into their systems of prosumption
    capitalized precisely on the forms of cooperation that had formerly persisted
    beneath profiteering.


    This was not all unique to grime culture. Rather, it was shared across society,
    part of the broader shifts in technology, capitalism and neo-liberal cultural
    politics affecting all social strata. Grime YouTube music videos were then constituted
    with wider social forces, and not marginal instances of cultural life. It is also
    true that what was at stake in this shift for black diasporic sound culture was
    particular. The historical formation of black diasporic sound vis-à-vis regimes
    of whiteness, textuality and capital had occasioned forms of wisdom and social
    practice at odds with dominant culture, carried through sound. These sonic intimacies
    were porous and open in ways that white capitalist textuality not be on account
    of its affinity with privacy, property and racist order. And, as such, they came
