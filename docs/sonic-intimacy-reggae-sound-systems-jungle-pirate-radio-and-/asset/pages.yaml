    Hype was not the authoritative garner of the masses. Rather, its was predicated
    on co-production, through the call and response of the rave and the radio, and
    even the co-production of the technology as you wandered around the living room
    in hand. Hype was horizontal, a sense of political belonging of shared labour
    and a far cry from the increasingly hollowedout democracies of that post-war period.
    Hype was not anodyne either, but immediate. Hype''s immediacy demanded attention
    and investment that was wholesale and deep, but also precarious as the working-class
    city in which many ravered.


    Jungle pirate radio''s social intimacies of community and service extended from
    the pirate crews, to the neighbourhood and through the listeners, into the city
    and back. They provided systems of pleasure and support that mitigated the social
    atomization of the time. They were not the familial forms of reggae sound system,
    rather were part of fragmenting social affinities and institutions that continued
    to provide alternative networks of mutuality and identification.


    These different scales of social and spatial intimacy were grounded in the materiality
    of the rave. As the reggae sound system, jungle pirate radio was physically consecrated
    in dance. Its alternative cultural politics are otherwise unimaginable. Through
    pirate radio, the rave was extended across the city, connecting the otherwise
    disconnected late modern micro-environments of bedrooms and cars. Spilling out
    from the rave, the sonic transmissions of the radio then created a tangible multitude
    with shared practices, habits and ethics that attained a feeling of wholeness
    on a city scale, working around the otherwise visual racisms and confines of daily
    life.


    The multi-ethnic make-up of the city and the diasporic formation of the sound
    constituted a culture in which racial affinity and the racial ownership became
    estranged. Jungle remained a black diasporic music culture, but one that was composed
    and for the multi-ethnic city, in which indifference to difference was routine;
    where ethnic and cultural difference could habitually lived and acknowledged but
