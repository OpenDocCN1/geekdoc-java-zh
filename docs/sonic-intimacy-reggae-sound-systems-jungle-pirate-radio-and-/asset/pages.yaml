  md: 'Porter 2010). Likewise, the sound system is tuned to the resonant space of
    the dancehall, with the deep frequencies coming out of the back of the boxes allied
    to the architecture of an individual building. ‘In the early days we worked hard
    on the frequency’, explains Jah Shaka, ‘not only power, to get the right frequency.
    Some bass is very loud, but some is Hz – rumbling but you don’t hear – very low
    frequency. We try to get that’ (Jah Shaka 2014).


    This is not necessarily the learning of a science, although it may be well that,
    too – electronics, for example – but more often an art – a qualitative, interpretive
    and creative understanding of how the sound system will play.


    All sound systems look for a combination of quality and power. When sound reproduction
    gets upwards of 3000 watts, distortion or a blurry sound is a problem – frequently
    unsolved in larger nightclub clubs. With sound systems, this problem is compounded
    by mobility. Unlike a club PA, the sound system is only set up a few hours before
    a dance. Nonetheless, even in testing acoustic contexts, power, quality and clarity
    are prized in maintaining the vibe of the dance, and each sound fine tunes those
    attributes to achieve their characteristic sound.


    Anybody who has developed a skilled relationship with an object they deem expressive
    will understand the intimate significance that object, or collection of objects,
    hold. In an expressive art object, one that is is prefigured in dialogue with
    the audience, this is magnified such that the sound system becomes a collectivized
    ‘extension of personality’ (Jah Observer interviewed in Gaonach 2014).


    It is important to note, then, because it is not often said, that for sound system
    personnel, when the sound plays, the audience is not only listening to their music,
    but to their craft, which is an intimate relationship between craftsperson and
    object. To put it another way, if you have spent weeks building electrical components
    for a sound system, or maybe just the the frequency crossovers, when the sound
    plays and the capacitors hold out, your pleasure in the sound, in the dance and
    in the expression is also pleasure in the crossovers themselves; your intimate
    relationship with the sound system is at once with the crossovers and the revellers
    assembled.'
