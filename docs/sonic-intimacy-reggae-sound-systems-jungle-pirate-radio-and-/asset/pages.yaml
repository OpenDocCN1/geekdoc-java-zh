  md: '# INTRODUCTION


    them through an argument of linear decline – the sound system losing out progressively
    to jungle pirate radio and grime YouTube music videos. Attractive as the ‘capitalism
    as progress, capitalism as ever and all consuming’ thesis is to certain branches
    of Marxist media scholarship, what cultural theory doesn’t need another negative
    restatement of myth-mantra of dominant capitalism as modernity.


    Such questions are concerned with sonic intimacy might not be immediately apparent.
    After all, the notion of sonic intimacy, while habitually known, is also somewhat
    illusory. Scholarship on the sonic has opened up regimes of knowledge not fully
    captured by the visual, and literature on intimacy has enabled an exploration
    of relationships, inter-subjectivity, feeling, forces and vibes not present in
    textual approaches to social and cultural life. But the relation of the sonic
    and intimate to alternative cultural politics has infrequently considered. Rather,
    with the exception of some selects works addressed below, the vibe of a dancehall
    or the hype of pirate radio has tended to provide the atmosphere for scholarly
    discussion, rather than be the focus. This is not inconsequential for our understanding
    of alternative cultural politics in modern society, especially if we consider
    that black diasporic sounds and their intimacies have had a close relationship
    to the alternative forms of being and knowledge practised produced and projected
    by peoples marginalized by the textual, visual and racial regimes of Eurocentric
    capitalist modernity (Hall 1997; Wynter and McKittrick 2015).


    The remainder of this chapter clarifies this assertion, opening up the dynamics
    of sonic intimacy and locating them in the conjoint fields of race, post-colonial,
    sound and cultural studies. The remainder of the book is divided into three chapters,
    each focusing on a different sound culture and conjecture. Chapter 2 explores
    the 1970s and 1980s reggae and dub sound system, Chapter 3 addresses 1990s jungle
    radio, and Chapter 4 post-2008 grime YouTube music videos. This conjunctural approach
    does not imply that these moments are discrete. Indeed, the book is organized
    so as to draw through their continuities and discontinuities. It does also imply
    that reggae sound systems, jungle pirate radio and grime music videos can be understood
    as particular clusters of sonic, social and technological materials and that these
    clusters are archetypal'
