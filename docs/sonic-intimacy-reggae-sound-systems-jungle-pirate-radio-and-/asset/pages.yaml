  md: '# INTRODUCTION


    terms – its instruments, studios, recording processes, distribution etc. – means
    thinking about it as modern music.^4


    This relation between modernity, technology and black diasporic music is explored
    in the final scene of Ralph Ellison’s Invisible Man. Here Ellison’s ‘poetics [are]
    situated in the interstices of music and technology, [bridging] the assumed divide
    between black cultural production and modern informational technologies, probing
    their textual and overdetermined interdependencies rather than contrasting natures’
    (Weheliye 2005: 47). This scene is discussed at length by Weheliye, but also elaborated
    here to clarify Ellison’s contribution to the sonic, and to lay the ground for
    a later discussion of Ellison’s less observed, and unproblematic, analysis of
    intimacy.


    In the prologue to Ellison’s eponymously titled book, the Invisible Man hibernates
    in a dark basement-cum-hole under a ‘whites one building’. Having lived through
    multiple racial institutions – the industrial, the activist socialist and the
    street, and having been thwarted in his search for full humanity at turn, the
    Invisible Man’s final sojourn is to the underground. The scene in the basement
    of the apartment building allegorically captures the enduring inescapability of
    racial structure, as it justifies the way in which the Invisible Man comes to
    know life beyond racialized being. In the darkness of the basement transcendental
    possibilities arise because the Invisible Man can finally see the visual regimes
    of racism that have operated on him, and through which he has been living. This
    is stressed by the inclusion of sound in the scene, which both clarifies racism’s
    relationship to the visual and offers an alternative register for life not captured
    by it. Louis Armstrong’s rendition of Fats Waller’s protest song Black and Blue
    provides soundtrack. The source of the sound that fills the basement is a phonograph.
    Like the light bulbs also populate the basement, the phonograph is a quintessentially
    modern technology (Ellison 2001).


    In this way, Ellison comments on the relationship between sound, the visual, technology
    and the modern Black American experience. The phonograph highlights the relation
    of the protagonist to sound recording and reproduction technologies, just as it
    does to the


    ^4Jazz is as modern and American as the ‘automobile and the airplane’, Duke Ellington
    (Ellington 1993: 253, see also 80, 151).'
