    # ## Introduction


    In 1981 NME* magazine undertook the somewhat impossible task

    of itemizing UK reggae sound systems. Their list included a hundred

    London-based sounds, and more than thirty elsewhere across the

    country, only a proportion of those active at the time (NME 1981a).

    That simple act of enumeration spoke of the social significance of

    the reggae sound system at that moment. A list that missed off

    many smaller sounds nonetheless showed that up and down the UK

    sound system culture was at its apogee.


    Today we reflect on the significance of this moment.

    Although, back then, there was some disagreement about the UK

    sound system''ss influence on social and political life, now, whether

    it through sound production, sound technology, sound culture,

    music or in terms of the racial politics of Britain, it is undeniable

    that the sound system has profoundly influenced how we listen,

    produce and indeed *are*. The sound system has fundamentally

    altered the way that Britain relates to itself. Reverberating

    through popular culture, underground music, anti-racist activism\and street protest,
    the sound system produced a demand that

    exceeded the racist state at that moment. Central to this was

    bass, the expansive sensibilities of dub and the deep co-presence

    of the dancehall. The contention of this chapter is that these

    reverberations concern *sonic intimacy*'
