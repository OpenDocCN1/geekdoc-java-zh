  md: '# INTRODUCTION


    The sound cultures discussed in this book contain reverberations of those moments,
    but reggae sound systems, jungle pirate radio and grimeYouTube music videos are
    not spirituals just sure as a reggae bass line is not a jungle one. Of different
    times, produced and productive in different moments of capitalism, racism and
    colonialism, they are part of each other''s stories as they are resolute of their
    own. Still, to differing degrees, they convey through sound alternative stories
    of modernity, and to that end Linton Kwesi Johnson and Bois''s remain prescient.


    After all, the over-determination of being and knowledge by visual and textual
    means has remained a central plank of modern Western societies, as the coterminous
    development of the visual and textual with racism and capitalism (Dyer 1997; Wynter
    and McKittrick 2015). In the margins of these dominant alternatives of modernity,
    black diasporic sound cultures have continued to provide alternative playlists
    for the modern condition, just as they have offered registers through which demands
    beyond those positions have materialized. It is for reason that the reggae sound
    system is written about as:


    > ... the recorded documentation of an alternative living history of the black
    presence in Britain; a space in which black Britons could tell, intellectualise
    and become conscious of social justice, black rights, anti-racism and against
    police harassment with people who understood and had sympathy with it. (Henry
    2006: 8)


    The use of ‘alternative’ rather than ‘oppositional’ in the above quote is instructive.
    For Henry, black and working-class reggae sound systems are culturally alternative
    to the dominant white petitbourgeois culture of the day. They are alternative,
    not neatly oppositional because they contain elements of dominant culture, not
    least pieces of consumer technology.


    For Henry, the UK reggae sound system documents an alternative history to formal
    written culture and to the white bourgeois


    In Marxism and Literature, Williams discusses the relation of dominant culture
    to any conjuncture, but also in how that same conjuncture other forms of culture
    exist that are alternative and oppositional to those dominant forms (1977: 121–7).'
