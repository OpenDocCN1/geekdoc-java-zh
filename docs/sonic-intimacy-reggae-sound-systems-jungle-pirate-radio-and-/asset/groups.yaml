    \ 1989: 75–87). Indeed, the intimacy that can be so profound that on its basis\
    \ you may die for the Other (Levinas 1998: 2–3).⁸ Intimacy’s presence is not held\
    \ only in the face, the gaze, the kiss and the touch but in music and sound.\n\
