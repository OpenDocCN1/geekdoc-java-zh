    # 雷鬼音响系统与氛围


    对新克罗斯火灾（New Cross fire）黑人儿童死亡案的调查失败成为了一个特别的动员焦点。说那个时期警察既有种族主义倾向又好斗简直是轻描淡写，¹而且这种事实确实成为雷鬼更具政治色彩的音响系统（sound
    systems）的谈资。


    年轻人缺乏就业机会，以及他们在街头面临来自警察和种族主义黑帮的危险，也使得音响系统提供的廉价娱乐变得愈为重要。随着许多俱乐部门前经营着非官方的种族隔离酒吧，音响系统成为黑人年轻人必须聚集的某些场所之一（Jones
    1988: 127）。作为黑人和工人阶级文化的中心，这些休闲场所在偶然性上构成了对法律和秩序的威胁；与一种危险且具有文化侵蚀性的黑人文化联系在一起。早在1957年，当“地下酒馆”（shebeens）进入白人公众视野时，就有了要求对其进行镇压的呼声。20世纪50年代，警察对杜克·文（Duke
    Vin）音响的破坏预示着此类虐待在当时是罕见的（Vin 2017）。


    整个20世纪70年代，警察对黑人年轻人参加的派对、文化活动和青年俱乐部进行了搜查。这些侵略行为的清单在此无法列举，但为了让大家有个概念，在那个年代初：


    诺丁希尔法拉利路（Faraday Road）教堂大堂的墙上贴满了海报，列出了过去一年的战役荣誉……地铁青年俱乐部（16人被捕）、哈尔斯登（Harlesden）（8人）、阿顿公园（Acton
    Park）（10人）、佩珀姆莱（Peckham Rye）（五十多人）、利森格罗夫（Lisson Grove）；名单以此类推。（Hartley 1971）


    ¹在新克罗斯火灾中，有13名儿童在派对上被烧死。在事后，警察通过操纵媒体、胁迫证人以及将责任归咎于死者的朋友，一贯且频繁地阻碍了适当的刑事调查。这些深层的不公导致了“新克罗斯大屠行动委员会”的工作，该委员会组织了一场有1.5万至2万黑人参加的抗议，约翰·拉罗斯（John
    La Rose）是该委员会主席，致力于追究警察并并真相（La Rose 1984: 3）。


    ²这些不公引发了1981年、1985年伦敦布克斯顿（Brixton）的抗议和起义；利兹查普尔顿（Chapletown）1975年和1981年；伯明翰汉德斯沃斯（Handsworth）1981年、1985年；伦敦诺丁希尔（Notting
    Hill）1976年；南索尔（Southall）1979年；布里斯托尔圣保罗（St Pauls）1980年；托特纳姆（Tottenham）1987年；利物浦托克斯斯（Toxteth）1981年。


    # 36 声音的亲密性


    除了这些，还可以加上汉德斯沃斯（Handsworth）维拉十字一家黑人酒吧遭的虚假搜查，以及警察在利兹查普尔本篝火节（Chapelt Bonfire Day
    celebration，利兹黑人社区的特别活动）上驾车高速冲过一群黑人的事件（种族关系研究所 1987: 6; Plummer (1972)）。


    警察暴力的一个特定关注点是诺丁希尔的红树树餐厅（Mangrove Restaurant）。1977年诺丁希尔狂欢节期间的某一次¹¹警察无差别地用武力进入现场。当时的受害者证词记录了警察如何折断肢体、恐吓儿童、进行极其残忍的毒打、阻碍救护车队的紧急医疗救治，并强迫一些人从地面4到5米的窗户跳下。值得注意的是，他们还针对了音响系统。当时来自“黑拳系统”（Black
    Punch System）的巴塞尔正在播放。


    我第一次听到外面有人在大喊说警察在追人。另一个人大喊关上门。等我反应过来就是一波冲锋。门上的窗户被警棍砸碎，然后他们就进来了。他们开始毒打每一个人并让我们出去，但门被封锁了。警察把我的放大器砸在地上，把我的唱片撒得到处都是。我旁边有一对小夫妇，我向警察抗议让他们出去。除了我的放大器，至少有45张单曲唱片被砸碎，还有五张在这个国家完全买不到的LP（长胶片）。对我来说，他们这样进入一个地方，殴打他人、破坏财产并逮捕，简直不可理喻。（Race
    Today 1977）


    ¹¹后续影响包括“7·红树树事件”，事件中九名黑人知识分子和活动人士社区成员因虚假的毒品和犯罪指控，在餐厅遭到持续搜查时被捕。1974年，警察袭击了克里克伍伍德（Crickwood）的俱乐部，逮捕了12人，其中包括丹尼斯·博维尔（Dennis
    Bovell），他曾被处三年监禁，但在六个月后获得无罪释放（Johnson 1981: 10）。这一事件在电影《巴比伦》（Babylon）的结尾中被永化，博维尔为该片创作了配乐。


    # 雷鬼音响系统与氛围 亲友与社区


    在《低音文化》（Bass Culture）中，洛伊德·布莱利（Lloyd Bradley）写道，音响系统不仅仅是一墙扬声器；它从字面上来说就是“社区的心跳”（2000:
    4）。虽然布莱利认为，音响系统作为“社区的心跳”的说法可能并不完全准确，但它确实是如此。


    [content]

    我们还可以加上汉德斯沃斯维拉十字一家黑人酒吧遭的虚假搜查，以及警察在利兹查普尔本篝火节上驾车高速冲过一群黑人的事件……[/content]

    （注：此处由于原文逻辑重复，根据指令“不要重复输出原文”，此处仅为衔接段落的翻译演示）


    [content]

    电影《巴比伦》很好地展示了这一点。影片讲述了阿斯瓦·福德（Aswad Ford）饰演的名为“Blue”的年轻人的日常苦。……[/content]


    [content]

    音响系统也离开了这些空间，因为年轻的家庭成员重新利用它的扬声器和放大器来……'
