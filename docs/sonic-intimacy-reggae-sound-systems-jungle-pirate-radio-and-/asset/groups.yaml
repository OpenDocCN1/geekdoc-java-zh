    # 雷鬼音响系统与氛围


    可以被收集。当音响系统收集并连接人们时，它通过声音和歌词实践对他们进行验证，强化了“共在感”。正如 Back 指出的，音响系统的调音师（deejays）通过将“日常关怀中的普通幽默、胜利、悲剧和绝望”传回给观众，验证了空间的互动性（Back
    1988: 149–51）。


    这些存在的形式对音响系统如此核心，以至于它们在舞蹈的象征意义中被仔细复制。Lloyd Coxone 解释道：


    > “如果没有我们拥有的那些音箱和放大器，就无法营造出氛围，”他解释道，“你明白吗？横穿的电线和众多的箱子确实营造了一种氛围。你必须让声音保持在那些箱子里的状态，因为它们代表了声音。（Lloyd
    Coxone 在 Dineen and Caidan 1981 中访谈）


    Coxson 注意扬声器、电线和人的排列方式强化了共在感。连接扬声器和放大器的电线悬在天花板上，在舞池上方形成了一张网，为下方的舞者提供了顶篷，而扬声器则形成了一个珊瑚丛。


    在这些空间中流传着有关主流社会背景的亲密知识，以及通过英国黑人对他们与加勒比关系理解而形成的更广泛的离散文学作品。


    由此推断，这些亲密知识并非疏远或脱节，而是你的“日常生活（daily livity）”、“今日讨论的话题”。Blacker Dread 解释道：


    > 那就是发生的事情。那是今天的话题，所以每个人都会参与其中，因为那是你的日常生活。这并不是什么新鲜事。你去那里不是学习你不知道的东西。这只是在增强并让人们意识到《搜查法》（SUS
    laws）之类的事情。调音师以前会告诉你们：“哥们，你走上路警察拦住你，然后一个特警（g man）陷害你，或者特警对你做了这样或那样”。在纽克罗斯火灾案中，我们参加了那些游行。1986年反对反种族隔离运动——克拉普姆公地有10万人。我们在那些活动中演出。最终我们成为了非种族隔离大会（ANC）的成员，并在诺丁山狂欢节上连续17年为
    ANC 演出，每年如此。我们不是在街上演出，而是在卡车背上。但那就是政治。我们所做的是确保人们意识到发生了什么。站在布里克斯顿的巴克莱银行外，告诉黑人不要进巴克莱银行，因为那是种族隔离的产物。我们做了这一切，这是你日常生活中不可分割的一部分，因为这就是你周围发生的一切。这没什么不同的。（Blacker
    Dread 在 Bass Culture Research 2018 中访谈）


    在舞蹈中，这些亲密知识作为智慧在流传。社会学家兼雷鬼调音师 Lez Henry 解释道，调音师们有能力在叙事中定位我的位置，“[并且]通过他们作为文字工作人的特殊技巧，实际上让我开始思考那些想法是他们自己的还是我自己的’（Henry
    2006: 201）。通过音响系统，狂欢者和音响工作人员了解彼此的心灵，发展出了 Jah Shaka 所说的“直觉”——感知他人心灵的能力，以及“心灵感应”——通过离散的空间和时间做到这一点的能力（Jah
    Shaka 2014）。


    这些词承载在调音师的话语中，也承载在声音中。“低音历史是一个流动的/痛苦的故事，”Linton Kwesi Johnson 提醒我们，关注了低音符与黑人离散体验之间的亲缘关系（Johnson
    1980）。在此过程中，Johnson 同时回起了爵士乐中的倍低提琴、加勒比的芬斯达吉他，以及 Sylvan Morris 在 Studio One 的录音技术（Bradley
    2000: 309–10; Veal 2007: 98）¹，他还讲述了民主及之外那“恐惧的、令人恐惧的、兄弟般的‘低频频率’”（Callahan 1996:
    xxxiii）。


    # 雷鬼音响系统与氛围


    但如此，这些是更直接的智慧。来自 Aba Ashanti 音响系统的 Blood Shanti 评论道：


    > 我出生在英国，带着市中心的氛围（vibes）。许多艺术家追求加勒比声音或美国声音，但我认为那是英国艺术家应该走的错路。我们出生在这里，必须创造我们自己的声音形式，并在世界上留下我们的印记。实际上，当我们创作音乐时，我们在反映和回响我们周围看到的一切，从我们每天早上醒来环顾四周开始。当我出去，我看到到处都是城市的烟雾、交通、黑暗，没有鸟，没有树，没有自然。我知道有些加勒比人觉得我们的音乐在这里艰苦而残酷，但我们处于混凝土森林中，你明白吗，我只能通过我的生活方式来表达自己。（Whitfield
    2002）


    在这里注意到，雷鬼音响系统开始讲述一个关于经历和一个关于英国本身的故事——这种故事一直延伸到书中讨论的丛林（jungle）和垃圾（grime）声音文化。这并不是说英国正在通过
    Aba Ashanti Sound System 良地接纳黑人文化形式——毕竟，在白人的大众想象中，音响系统仍然充满了危险——但与此同时，音响系统所扮演的关于日常生活、种族主义和阶级政治的亲密声音知识，正在塑造着多族城市的活力。


    在舞池上，白人和亚洲人发现自己处于“他者”之中，暂时中止了英国生活的种族主义组织。音响系统并不是一个熔炉。城市的混合体并没有随着舞蹈的召唤而涌入街道。在种族主义加剧的背景下，关于黑人文化符号如何被白人使用和采用，哪些是可以接受的，哪些是不可以的问题依然存在。这并没有记录这些空间的共享快乐，或它们引发的多样文化开放与渗透。


    ¹Ellington 普及了倍低提琴（电低音的前身），相比大管，他更喜欢它的爆发力。他还引入了双低音，实验了“贴麦克”技术以从乐器中获得最具爆发力的声音（Pekar
    2010）。


    # 声音亲密性


    这种程度因地而异。考文特、伯明翰（巴尔萨尔希斯）以及西北、南部和东南部的不同社区在这方面有不同的动态（Back 1994; Bradley 2000: 254;
    Coxsum 2018; Jones 1988: 120）。


    # 氛围/比率


    有时在舞会上“我不知道问题出在哪里，可能是地方的问题，可能是你放的声音的问题，可能是任何原因，但你就是感觉不对，氛围不对劲’。（Bikey by Sir Coxsome
    在 Dineen and Caidan 1981 中访谈；我的强调）


