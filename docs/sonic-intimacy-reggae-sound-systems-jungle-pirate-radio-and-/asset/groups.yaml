    # Introduction


    In April 2017 I went to see Nadia Rose play at Village Underground in Shoreditch,
    London. I''d previously seen her videos on YouTube and was impressed by her affinity
    with the camera. I tried to buy a physical copy of her EP but it was only available
    on YouTube. It was later released on MP3. Wanting to support the artist, I paid
    to later download the tracks. When I did I was then struck by what they lacked.
    I had come to know Nadia Rose and her music almost exclusively through YouTube.
    I was expecting the audio to reproduce its effects. It didn''t.


    In a third-year undergraduate class on post-colonial approaches to the city, I
    encouraged students to think about these shifts might mean for music, and indeed
    for the alternative cultural and political registers of black diasporic sound
    culture. We went back through Debord, Benjamin, Adorno and Wynter, thinking about
    the relationship between visual culture, capitalism and race, and then engaged
    with Gilroy, Du Bois and Weheliye to explore the alternative relation of sound
    to modernity.


    At Village Underground, Nadia Rose''s Croydon crew turned up, but the rest of
    the audience was only there on the back of the Skwod video. They didn''t know
    the other tracks. Aloof and half-interested, as London crowds could, they were
    draining, and Rose, who is so confident on screen, has such proficiency in the
    medium of her generation, was perceptibly nervous. Granted, this was a big gig,
    but she also seemed unfamiliar with these live arts.

    A graduate of Brit School, clearly trained to a high level in video performance,
    your YouTube persona was not easily communicated to the crowd. The little gestures,
    flicks, facial movements that are caught on camera to such great effect lost in
    the physical'
