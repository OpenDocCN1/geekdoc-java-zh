    # JUNGLE PIRATE RADIO AND HYPE 63


    Parallel to this, youth culture was labelled dangerous, debauched and out of control.
    Part of wider Tory moralizing on good virtue – ended with Prime Minister John
    Major''s affair with his colleague Edwina Currie – these moral panics were not
    triggered, as they might be, by the murder of Stephen Lawrence, but by the deaths
    of two more grievous victims – the white infant Jamie Bulger was abducted and
    murdered by two older boys, and the Ecstasy-related death of white clubber Leah
    Beats (France 2007: 97, 136).


    Bulger''s death influenced the drafting of the 1994 Criminal Justice and Public
    Order Act (Criminal Justice Act), which doubled the maximum sentences for children
    in young offenders'' institutions. Linked to concerns over dance music culture
    and drugs (and those of home counties'' landowners) that same legislation cracked
    down on open-air raves, catalysing, somewhat ironically, and the inner-city club
    scene.


    In these panics, jungle was figured as dangerous and degenerate on black terms.
    In 1994, Observer Life magazine ran an article stating that jungle is a controversial
    and prominently black phenomena (Belle-Fortune 2004: 162). The police and local
    authorities link pirate radio to black organized crime (BBC 1994; London Tonight
    1994). Even the name ''jungle'' becomes associated with colonial notions of darkness,
    urban decay and ''ragamuffin house'', ''drum ''n'' bass'' (Congo Natty interviewed
    in Seely 1994: 11 mins; Ferrigno 2008: 7). Until Fabio and Grooverider appear
    on Kiss in 1994, and Radio One launches One in the Jungle in 1995, jungle is sidelined
    from broadcast.


    We needed a platform to get the music out there and no else wanted to play it.
    (Eastman, Kool FM interviewed in Mavros 2011: 1.58 mins)


    Jungle pirate radio responded to this censorship by providing music for the masses.
    That commitment brought the pirates into contact with the authorities, their legislation
    and their regulatory powers. The 1990 Broadcasting Act expanded the


    > *Mixmag has no jungle music policy (Christoloudou 2009: 109; James 1997: 58–9).'
  - '[PAGE 74]


    remit of The Telecommunications Act 1984, providing for two years’ imprisonment
    for involvement in pirate radio, unlimited fines and the confiscation of studio
    equipment including the DJ’s records. It also extended culpability under law to
    those indirectly supporting the station, and trading with it in any way. It justified
    this through the general panic around black and youth culture, and by specific
    concerns (propagated by Department of Trade and Industry) that pirate radio frequencies
    were leaking onto airport traffic control and emergency services bands – although
    the crystal locks of most transmitters and the shift of the emergency services
    to different frequencies made this unlikely (Trevor Dunn, Head of BBC Music Entertainment
    interviewed in Cordell 1997a: 1.40 mins; Wolton 2010). As Kool FM’s Chief explains,


    It was bollocks ... We were a gang, but we were a musical gang – nothing to do
    with causing trouble or selling drugs. (Chief quoted in Clifton 2015)


    # Kinship and community


    Unlike the reggae sound system, jungle pirate radio was not intimate to the family.
    It was not present at weddings or found at the centre of the home. Indeed, as
    the next stage in British youth culture, jungle was squarely defined against parental
    affiliations. Jungle pirate radio’s intimate social relations of kin and community
    were better located in ties between friends, neighbours and youth club associates
    (Geen interviewed in SBTV and All 2017: 8.50 mins).


    These intimacies were well reflected in the imagined communities of the stations
    themselves. ‘Rinse’ is the jungle vernacular for doing something well – ‘Rinsing
    out a tune’ and in 1994 RINSE FM was set up a jungle station by a group of East
    London friends (Geen cited in SBTV and All 4 2017: 8.50 mins). RINSE FM latter
    became a grime station. Transmitting from a broom handle across a 30 km city radius,
    these friends imagined were broadcasting to people like them (Nicolov 2017). Chatting
    on the mic, they pictured their schoolmates tuning in – the people they could
    see from the vantage point of the high-'
  - '[PAGE 75]


    # JUNGLE PIRATE RADIO AND HYPE


    rise rooftop. Reflecting on his involvement as a DJ with the station, DJ Dugs
    explains, ‘You could see your whole life from there, your community, your school,
    your friends'' homes, your homes and the parks you went to’ (Dugs and Woods 2016:
    177) – the places and people intimate to you were projected through RINSE’s transmissions.


    This intimate relation with the community extended through jungle pirate radio''s
    broader commitment to public service. With aerials spouting from public housing,
    it is not hard to make a material connection between jungle pirates and the welfare
    state. It is captured wonderfully in the 1996 documentary Radio Renegades features
    DJ Brockie driving around East London pointing out a series of council blocks
    adorned with the tell-tale double stack aerial (Rooper 1996: 6.40 mins). But it
    was also the case that jungle pirate activated all their mutualisms. More than
    any of the other sound cultures in this book, it was there to provide music for
    ‘the massive’ – that is to say, for public provision. And this was reciprocated,
    not beneficial. For listeners, jungle pirate radio was not just another broadcast
    on a crowded FM dial. It was real. It was a ‘lifeline''.


    Pirate radio ... was so important to those of us who couldn''t afford to go raving
    every week or were not old enough. It was a lifeline. [If Kool didn''t switch
    on] it was like a relative had died. (Dugs and Woods 2016: 148–9)


    # The micro-massive


    Jungle pirate radio extended the intimate presence of the dance floor to thousands
    of bedrooms and cars across the city, providing a common presence between otherwise
    isolated micro-environments. In a fractured and sped-up society, jungle pirate
    radio was a unifying force through which listeners in different places (physically
    and socially) felt they were known and heard by others. Their micro-sites comprised
    the ‘junglist massive’ whose co-presence unfolded through the air-waves. [Wait,
    re-reading text: ‘junglist massive’] whose co-presence unfolded through the airwaves.


    This one goes out to the Capital! (MC Shabba on Remarc and Flirt 1994)'
