    # GRIME AND YOUTUBE MUSIC VIDEOS


    lo-fi sound (Charles 2018: 7). Whereas ‘hi-fi’ denotes a listening experience
    that replicates, often through expensive technology, the mythical clarity of real
    and physical music, lo-fi is a listening experience characterized by distortion.


    Grime''s lo-fi sound is partly accounted for by the DIY technology used to make
    many of the early instrumentals – cracked versions of FruityLoops, Mario Paint
    for the SNES and Music 2000 for the PlayStation (used by Skepta, So Solid Crew
    and Dizzee Rascal) (Hancox 2015b; 2018: 61). Far from constituting a problem,
    in grime, the lo-fi sounds produced these technologies are culturally appropriate
    to the sound culture''s wider stretch of feeling. As grime journalist Prancehall/John
    McDonnell notes, ‘a lot of the early grime was actually quite bad production.
    I liked that’ (Prancehall/John McDonnell cited in Collins and Rose 2016: 37).


    This lo-fi sound is exacerbated by the YouTube ecology. As noted, early YouTube
    strips often used backing instrumentals played from mobile phones, with the MCs
    lyrical performance video-recorded back into another mobile phone for upload to
    YouTube (Upcoming Movement 2010). The final audio playback stripped the original
    lo-fi instrumental of any remaining bass, further reducing definition and increasing
    the levels of distortion. In cases, the original instrumental was only vaguely
    recognized in the final audio through its tinny rhythm and distorted mid and treble.


    Video content goes through a similar process. Third-generation mobile phones’
    poor quality resolution handling of light create dark and grainy pictures, while
    the YouTube platform limits resolution (and length) through its 100MB limit (Gannes
    2009).¹⁵


    After September 2008 this limit was increased to 1GB.


    # Treble and lyricism


    The lo-fi sonic genre of YouTube music videos strips the bass from music videos,
    emphasizing the treble. In the previous two chapters we have attended to the special
    importance of bass to black diasporic music. We find this at its most instructive
    in the reggae sound system, in which the bass itself is part of the modulations
    of affect and political demands. As we trace this jungle pirate radio, we note
    that (powerful car stereos aside) we are in a bass referent media ecology – where
    the bass heavy rave is central to the radio playback experience. Grime is still
    bass music, part of culture, but as we enter the era of YouTube music videos,
    and as the raves are closed down, grime is less centrally defined by a felt relationship
    to bass.


    Early grime instrumentals are not even particularly bass heavy. In a DJ Slimzee
    from an early 2000s Sidewinder event, Dzee Rascal calls out ''listen to the mids'',
    not listen to the bass (Dzee Rascal and Slimzee c. 2001; 15.43). Indeed, as Hancox
    notes, “The glorification of treble culture reached a peak of forthrightness with
    the Slix Rhythm “No Bass”, rinsed by the likes of Ruff Squad, Bossman, and scores
    of mobile DJs throughout 2005/6 (Hancox 2009). However, this is more than a predilection
    for different frequency ranges because, as mobile phones and YouTube come of age,
    bass is also being actively tuned out of the productions.


    Musical recording equipment has been historically tailored to the frequency range
    of sound reproduction technologies. The particular frequency ranges of LPs determined
    how studio sound was recorded and how microphones were designed (Marshall 2014:
    54). The same is true of MP3s and mobile phones. Music coded into the MP3 format
    for playback through mobile phone and computer speakers likewise reflects the
    treble range of mobile phones.


    This emphasis on treble tells a story that has been carried through reggae and
    jungle bass lines. From the moment at which cars were fitted with radios (1940s
    and 1950s), there has been an obvious affinity between treble culture, mobility
    and modern white sonics. This is a question of weight and weightlessness – the
    sonic and physical heaviness of black diasporic sounds giving way to the portability
    of white consumer movements. For those place importance on the way bass conveys
    a ‘moving/hurting black story’ (Johnson 1980), the shift from heavy weight to
    weightlessness and treble culture, from the city resonant with sound systems and
    end to one coloured by the hiss of mobile phones, is profound.


    However, this is also only a partial analysis because the wisdom of black diasporic
    sonic cultures is not only carried by bass. To suggest it implies a reductive
    affinity between black diasporic life and only one range of sound frequencies.
    Fred Moten cautions against this by tracing treble histories in black diasonics
    – in the snares and screams of Aunt Hester, Al Green, Michael Jackson, Max Roach
    and Abbey Lincoln (Moren 2003). In YouTube grime music, see Hancock Richard Wiley
    (reggae musician and father of the ‘Godfather of Grime’), the snare is the most
    important instrument in grime, not the bass. But it also comes to the fore through
    the human voice of the MC.


    The rise of MC culture in grime is partly explained by the economic realities
    of young people involved in the scene. Djing is a relatively expensive pastime.
    You need decks, a mixer and a regularly updated supply of music. To MC you only
    need your voice and a microphone. So, De La Soul warped ‘everybody wants to be
    a DJ’, Willey warped ‘everyone wants to be an MC’ (for Wiley comment, see Hancock
    2018: 52). As MC bemoaned the dominance of DJs in jungle culture, DJ Logan Sama
    occupied the backstage of grime events. This shift to the human voice does not,
    however, return grime’s sonics to an Elvis track playing in a 1950s car on a US
    highway, in which the bass has been replaced by the banjo, became broke from the
    whiteness and heightened sound of Elvis is not the (historically or culturally)
    as that of the grime.


    In grime MCing, crews like Dreem Team and Pay as You Go Cartel broke of UK garage’s
    front of house announcers, re-engaging a lineage of toasting that extends from
    reggae and through jungle. After all, nearly every MC in Pay as You Go learned
    their trade in jungle (DJ Target 2018: 75). Maxwell studied Hyper D’s lyrical
    structure of eight-bar hooks and Reloads. Double E was a scholar of MC General
    Levy (Double E D cited in Collins and Rose 2016: 30–7). That is to say, as grime
    sonics are increasingly turned to the treble range, what is heard are both the
    mobility of digital capitalism and the reinvigoration of black British soul.


    # The sonic screen


    The YouTube screen recalibrates grime’s sonics, re-colouring the sound, re-sensitizing
    its affect and absorbing its sonic matrix into visual field (see Berland 1993:
