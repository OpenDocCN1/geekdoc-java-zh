    # CONCLUSION


    sound signed through the racialized body, sang with a human voice, a voice that
    appeared in pixelated form. And while that singing continues, racial capitalism
    has not taken full hold.


    # Autonomous temporal zones


    Travels in time, from clockwise to ‘dub-wise’, the alternative temporalities of
    the reggae sound system move outside the grind of white bourgeois rhythhythms,
    keeping alive black diasporic experiences at home and abroad. Jungle pirate radio
    cites the chronometers of dub inducing autonomous temporal zones of intensity
    and speed. Dance floors and call-ins strain the mechanisms of the normative dial,
    the aesthetic impermanence of dialogue and misdistort diurnal formality, for the
    reimagination of the future city.


    Grime is more immediate still; on the limit, on the brink, spilling out of pirate
    radio studios across London, rooftops with no safety rail. Its raves and radios
    move in lockstep with the grit and impermanence of advancing physicality. Record
    shops, radio ... YouTube music videos intensify that immediacy, but also curtail
    its impermanence. On impermanence, post-reggae humanisms were set, and by YouTube
    they decay. In flux but not on the brink, grime YouTube music videos are out-of-time
    hollow hyper replications of the now, intensifying grime’s theatre of claim and
    counter-claim to the detriment of urgently restlessness and autonomous temporality.
    YouTube grime music videos move with the compulsive clicks of the networked meter,
    when breaking the mould of dominant time still matters a great deal.


    # Wisdom


    The knowledge systems of reggae, jungle and grime move outside the property regimes
    of dominant life. Livity, jungism and grime lay below the informatic-now. The
    wisdom of black life in British cities are compiled with acmens of the diasporic
    experience, intelligence on fast-paced multi-ethnic conviviality and the aptitude
    of post-industrial places. In series, they are chains of activation. Together
    they carry the fullness of shared life, knowing touched by many hands.'
