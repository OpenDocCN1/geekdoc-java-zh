    This unpredictability was central to the listener’s relationship with the station.
    The impermanence of the jungle pirate listening experience was an intimate connection
    to the radio itself. Odd as it might seem, the frustrating experience of moving
    a room, antenna in hand, trying to clear the fuzz, was an affirmation of pirate
    radio’s poise and its place within that. Deeply frustrating and energizing in
    equal measure, and nor, too, the OFFION dependability of regulated radio can never
    achieve, and nor, too, the qualities of its Internet versions.


    # The sonic intimacies of jungle pirate radio


    From the early to mid-1990s jungle pirate radio was the metronome for London and
    much of the South East, too, a popular culture with wide reach,  with contradictions.
    Co-presence and mutuality intertwined with capitalist individualism and consumerism;
    shared knowledges of welfareism and multi-ethnic conviviality were channelled
    at hyper-capitalist speeds.


    Jungle pirate radio attained a condition of wholeness and depth known as ‘hype’.
    Hype was illegality traced through buzzes, edginess of not-for-sale jungle culture.
    Hype was immediacy and'
