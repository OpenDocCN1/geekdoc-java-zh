    在我20世纪80年代初成长时，英国的街道上是黑白分明的。周末时，我的白人朋友会去白人俱乐部，我的黑人朋友会去黑人俱乐部，双方互不往来。显然，会有少数几个白人过去，也有少数几个黑人过去。我一起长大的朋友有90%是黑人。我的继父是黑人。我的姐姐是混血儿……我以前经常去那些蓝调舞会并为
    [Four] Aces 推广……我当时并没有意识到……但我的白人朋友一个也不来。当狂欢（rave）场景出现时，它吸引了我。我可以去一个我的黑人和白人朋友都会去的地方，这就是它的魅力所在。DJ
    Vape 采访 Cordell 1997：5.06分钟。


    丛林海盗电台反映了这一点。1994年和1995年在 Kool FM拍摄的照片显示，MC Remadee、Smurff、DJ Trace 和 DJ Ice、Busey
    G、Skibabee 和 Tekka、Murff、DJ As Slippery——在欢快的复兴中，有黑人、混血儿、土耳其人和亚洲人（Clifton 2015）。随着
    Shy FX 和 UK Apache 的《Original Naught》，现在一个英国黑人制作人和一个英国亚裔 MC（拥有南非、英国、阿拉伯和印度血统）可以在嘻哈节拍上用科克尼口音、牙买加方言和双青雷加（dub
    ragga）押韵，听起来就像伦敦，而对文化真实性的担忧忽略（24H Canal + 1994）。


    这种共处的形式在狂欢活动中是普遍的。在1997年 One Nation 的跨年派对上，MC Dett 解释道：“One Nation，尤其是考虑到伦敦的一切。它是非常多元族化的，有白人、黑人、中国和印度血统。这就是为什么它被称为
    One Nation（一个国家）”（MC Dett 采访 Cordell 1997：0.18分钟）。开放的着装规范鼓励了这些运动，减轻了社会紧张局。这并不意味着种族主义被根除了，但在狂欢中，存在一种普遍的感觉，即你是谁或来自哪里并不重要，“只要音乐在响，它就一直响”（Zinc
    采访 Cordell 1997b：2分钟..）。


    丛林海盗电台以及更广泛文化的声音状况是这些亲密关系的关键。虽然 E 因为场景中欢乐的共获得了一些赞誉，但丛林（jungle）的影响力更大。这部分归功于音乐。丛林的杂糅性帮助了不同背景的人听到自己


    以及彼此的声音。


    ## 丛林海盗电台与炒作 71


    以及彼此。但同样重要的是，丛林的声音状况意味着他们并不总能在同一时间看到彼此。通过无线广播、唱片和狂欢活动在听觉上捕捉的种族标记（如肤色）很难从声音表面被勾勒出来。显然，丛林是一种黑人声音。没有人异议。但这种黑人声音无法通过白人对“黑人他者（black
    Other）”的认同而轻易封闭。事实上，丛林的声音状况确保了任何此类种族身份验证都是容易出错的，而且这种扰扰受到了黑人和白人制作人的共同欢迎。


    “人们不能说丛林是黑人的东西，也不能说它是白人的东西。我可以给你听二十首该死的曲，问你哪个肤色的人创作了它，你根本无法告诉我。”（Goldie 在 Taraska
    1996 采访）


    ## 从手工艺到 DIY


    这一切的兴奋之处在于，用几个晶体管、一个汽车电池、电烙铁、购买电缆、制作我们自己的天线，设置好一切，让它运行起来，然后在家里听音乐。（Belle-Fortune
    2004: 223）


    丛林海盗电台与其说是“手工艺”，不如说是“DIY”（自己动手）。监管机构袭击的持续威胁减少了完善的途径。经常被移除的发射器（更换既昂贵又费力）确保了对实用主义的强调。虽然无线电技术仍然易于手工艺式的捣弄——事实上，无线电的发展很大程度上归于业余爱好者的捣弄¹²——对于大多数海盗电台来说，重点在于捣弄以及更多保持在线。


    这种从手工艺到 DIY 的转变在文化上也能得到解释。到2世纪90年代中期，新兴的丛林艺术家有一系列声音和音乐消耗品可以使用。价格负担得起的 JBL 和 Cerwin
    Vega PA 音响系统模糊了自己制作音箱的需求。卧室工作室设备提供了建造自制音箱的手段。


    ## 声音亲密性 72


    90年代后半叶的丛林音乐正成为一项可行的业务。当1997年，Guy Richie 在大片电影《两杆火枪和一个烟家伙》中使用 EZ Rollers 的《Walk
    this Land》时，这种音乐变得更加响亮。现在，创意产业设计了 L. T. Bukem 的 Good Looking Records 办公室；而 Bukem、Roni
    Size、Goldie 以及其他一些是、仍然是名人（Modern Times 1996）。


