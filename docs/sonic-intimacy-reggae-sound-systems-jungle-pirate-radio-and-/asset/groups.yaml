    # GRIME AND YOUTUBE MUSIC VIDEOS 101


    YouTube is not designed for listening at all. It is geared for watching, and to
    consuming with your eyes, at speed. The intensity of the blue light stimulates
    adrenaline in our bodies, raising resting heartbeats, inducing a chemical high
    that is addictive and compulsive. The habitual scanning of the algorithmically
    organized side bar for visual consumer cues, loosely absorbing the bright atmosphere
    of the track playing, before the compulsion to click takes over and the video
    is changed.


    Through YouTube music videos ‘we are captured not doing what we want but what
    we must’, says media scholar Jodi Dean (Dean 2010: 21).¹⁶ And of this state of
    agitation compounds wider anxieties redolent in neo-liberal society. Talking about
    the relationship between music videos and everyday life Jordan, a musician from
    Plaistow, East London explains: ‘People are looking at little bits of information,
    taking this and that, nobody knows how to stick to anything ... (Jordan King interviewed
    by Malcolm Jones, 19 November 2018). The agonisms of grime sonics that called
    across the city are reworked through an interface that specializes in rupturing
    deeper human connections, compounding our general state of social negation, calling
    it into action, rather than moving beyond it.¹⁷


    YouTube firsthand particular intimacies of grime. The MC’s voice is heard but
    now seen. As the Conflict DVD comes to known through YouTube, listeners no longer
    have to guess which MC is which, as they did with the original pirate radio broadcast.
    The recall of intonation, pitch, metre and content is a lost art. Those arguments
    held between friends over who is on an audio track are now given visual clarity.
    The identity of the rappers, the racial and gendered codes of their bodies and
    their somatic movement to sing, calibrating the hype and intensity of their wordplay
    ... as they spill out onto the roof.


    In this way, too, the open sonics of agonism, those called by Devlin in Dagenham,
    are folded back into the visual and racial


    ¹⁶Internet – inter-net, worldwide web. Why is everybody logging into a world wide
    web. Why do you want to log into a web. The only web we does catch is, traps them.
    Everyone is trapped in the inter-net’ (Jordan interview).


    ¹⁷See for complementary commentary on the affinity of networked media with racism’s
    scavenger ideology, Titley 2019.


    regimes they formerly exceeded. As the excessive belligerence of the towards Giggs
    showed, the visual coding of ‘Talkin'' the Hardest’ stuck to Giggs’ body in ways
    not possible when (as with jungle) blackness and (by racist association) criminality
    is an assessment of som alone.¹⁸


    YouTube artists started to understand their expression on tese too, learning social
    roles, performing social scripts for the camera. ‘They learned to be in front
    of camera’, says Keefe (Risky Roadz 2017). Classed and racialized performances
    of anger then become part of the repertoire of effective expression. Crime artists’
    performances become conditioned by the racialized affective economies of YouTube
    music videos. In this way, the possibility for the ‘grottiest’ tune, where sound
    comes before ethic affinity, is tightened but not eliminated – grime remains a
    multi-ethnic genre in that sense.¹⁹


    # The sonic intimacies of grime YouTube music videos


    From 2008 onwards YouTube became the centre of grime’s media ecology, displacing
    raves, pirate radio, record shops and cable TV. The screen-based dimension of
    this wasn’t unprecedented, black music video culture was already well established
    in Britain, but the affinities between music video, mobile phones, Internet platforms
    and fans were new.


    In terms of presence, earlier relations of kinship and community remained, the
    intimacies of the sound system and pirate radio were increasingly absent. Being
    on the dance floor or in radio call-ins with people like you was now secondary
    to deterritorialized dialogue. Verifications of yourself and others come


    > ¹⁸The Metropolitan Police embarked on a five-year campaign to close down Giggs
    (Wolson 2013).

    > ¹⁹These videos, as part black diasporic and working-class culture, are undeniably
    clear to the ways in which Britain relates to itself, which is also to say that
    they continue to disrupt normative nationalist, capitalist and racist representations
    on mass media. While they may adopt some of the normative racial scripts, they
    are also nonetheless black, multi-ethnic and working-class young people representing
    themselves to the masses.


    # GRIME AND YOUTUBE MUSIC VIDEOS


    not through shared sonic knowledges of the past and everyday life, but through
    impressions left in view numbers, comments boxes and Google Analytics’ data. These
    deterritorializations accompanied entrenched localism. In the context of pervasive
    neoliberal negation, and in the absence of foster forms of social mixing (record
    shops, youth clubs and city-wide pirate radio broadcasts), pre-existing definitions
    of neighbourhood insiders and outsiders were revived. This was a shift away from
    the city that embraces you back, and one that looked to local rivalry rather than
    metropolitan movement for comforts.


    Although redolent with autonomous hubs of street life and local affiliation, as
    the sound systems were replaced by algorithms, grime YouTube music videos were
    increasingly for elsewhere, for YouTube. These videos produced in the street were
    consumed as past outside of their immediate circles.


    The alternative rhythms and expression of craft and illegal DIY were denied by
    the closed circuitry of mobile phones and online platforms. These locked technologies
    were proprietary, too. The form of mutuality and gifting that has long existed
    in black diasporic sound culture was co-opted into their systems of prosumption
    capitalized precisely on the forms of cooperation that had formerly persisted
    beneath.


    This was not all unique to grime culture. The coldness of the sonics and the coldness
    of the screen, and the agonism of society and that of social media mixed, turning
    resources for alternative life towards never-satiated activations of pressure.

