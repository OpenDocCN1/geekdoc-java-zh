    # THE REGGAE SOUND SYSTEM AND VIBE 39


    their burgeoning sound systems. These practices illustrate the sound system''s
    condition as DIY technology (a status shared by all technologies discussed in
    this book), and they also start to identify it as craft (a status not shared by
    all sound cultures in this book).


    DIY approaches to sound technology have a long history in black diasporic sound
    cultures and, indeed, more broadly in sectors of society limited by wealth but
    not by creativity. They are part of the story of the jumper as football goalpost,
    and the plank as affordable turntable as hip-hop instrument. And they are the
    practices before the initial emergence of sound systems in downtown Jamaica —
    who played recorded music for the masses, in part because upfront bands were too
    expensive. But not all of these can be considered craft, and in there is something
    at stake for our discussion of sonic intimacy.


    In the sound system, the DIY process is also a craft process, and the craft process
    entails intricacy between the object and in this case the sounderson. The documentary
    Sound Business follows Sir Coxson Outational Sound System showing the process
    of cutting, gluing and screwing together new speaker cabinets. The interviewer
    inquires about the practice. Having spent days building the box, the craftsman
    thus explains to the camera his labour, his relationship with the sound technology
    and with the sound itself. ‘When you hear that section [of speakers] play’, he
    says, ‘the bass that going to come out of it, you are going to feel it. It is
    a crucial part. Hearing the sound play’ (Dineen and Kaidan 1981). Much more than
    tautology, the box builder is explaining to the camera how his craft becomes expressed
    in sound. The moment the sound system plays, the moment you feel the bass, is
    already prefigured in his intimate relation with the sound technology; with the
    act of gluing wood together. His expressive labour relation with the sound technology
    foreshadows the creative dynamics of the dance. Craft itself is sonic expression.


    Craft entails skill and creativity. Sound systems, and particularly home-built
    and maintained sound systems, require the learning of specialist knowledge. ‘A
    speaker cabinet have to be designed to suit the particular speaker you are going
    to put in’, you can’t just make box and put a speaker in it. It don’t normally
    work’ (Mr Herron interviewed in Smith and Wei'
  - '[PAGE 50]


    Porter 2010). Likewise, the sound system is tuned to the resonant space of the
    dancehall, with the deep frequencies coming out of the back of the boxes allied
    to the architecture of an individual building. ‘In the early days we worked hard
    on the frequency’, explains Jah Shaka, ‘not only power, to get the right frequency.
    Some bass is very loud, but some is Hz – rumbling but you don’t hear – very low
    frequency. We try to get that’ (Jah Shaka 2014).


    This is not necessarily the learning of a science, although it may be well that,
    too – electronics, for example – but more often an art – a qualitative, interpretive
    and creative understanding of how the sound system will play.


    All sound systems look for a combination of quality and power. When sound reproduction
    gets upwards of 3000 watts, distortion or a blurry sound is a problem – frequently
    unsolved in larger nightclub clubs. With sound systems, this problem is compounded
    by mobility. Unlike a club PA, the sound system is only set up a few hours before
    a dance. Nonetheless, even in testing acoustic contexts, power, quality and clarity
    are prized in maintaining the vibe of the dance, and each sound fine tunes those
    attributes to achieve their characteristic sound.


    Anybody who has developed a skilled relationship with an object they deem expressive
    will understand the intimate significance that object, or collection of objects,
    hold. In an expressive art object, one that is is prefigured in dialogue with
    the audience, this is magnified such that the sound system becomes a collectivized
    ‘extension of personality’ (Jah Observer interviewed in Gaonach 2014).


    It is important to note, then, because it is not often said, that for sound system
    personnel, when the sound plays, the audience is not only listening to their music,
    but to their craft, which is an intimate relationship between craftsperson and
    object. To put it another way, if you have spent weeks building electrical components
    for a sound system, or maybe just the the frequency crossovers, when the sound
    plays and the capacitors hold out, your pleasure in the sound, in the dance and
    in the expression is also pleasure in the crossovers themselves; your intimate
    relationship with the sound system is at once with the crossovers and the revellers
    assembled.'
  - '[PAGE 51]


    # THE REGGAE SOUND SYSTEM AND VIBE


    These skills are learned through apprenticeship.¹12 Junior personnel learn not
    through the canned immediacy of information manuals, but through what is shown,
    it is circuitry, pre-amp or cabinetry design. Here, there is an assumption that
    one cannot simply acquire the skills of the sound system, they are not available
    off the shelf, because craft is slow, learned and patient. It is wisdom.¹13


    These practices sit anew to the dominant rhythms of capitalism, providing alternative
    potential for imagination and pleasure. The intimate relationship between crafterson
    and craft object is out of step with capitalist production, enabling alternative
    forms of expression to materialize. The expressive content of the craft process
    and its characteristic attention to detail fail딨 dominant rationales for production.
    In this quote from Count Spinner, an early sound system pioneer from Coventry,
    we see how the craft operated on a tangential plane to dominant capitalist profite:


    I came to England in 1961 and had a job at a hospital. The first week''s wages
    were five pounds and I bought a little gramophone and I found a record selling
    selling blue records ... And then I got my sound and took it to a timber shop
    and bought some board ... After I finish making this sound box, the House of Joy,
    a massive wardrobe, and the thing was we couldn''t get it out of the room. It
    was too big. (Count Spinner interviewed in Smith and Porter 2010)


    The fact that most people involved in sound systems have some version of this
    story is testament to the alternative relation of sound system craft to dominant
    capitalist timeframes. It is indicative of a form of obsession and patience, misplaced
    otherwise in capitalist money-making, in industrial form, maximizes passivity
    and speed. This sentiment is well put by socialist crafterson William Morris:


    ¹²For a discussion of apprenticeship in Jamaican sound systems'
  - '[PAGE 52]


    The creation of surplus value being the one aim of the employers of labour, they
    cannot for a moment trouble themselves as to whether the work which creates the
    surplus value is pleasurable to the worker or not. In fact, in order to get the
    greatest amount possible of surplus value out of the work ... it is absolutely
    necessary that it should be done under such conditions as make ... a mere burden
    which nobody would endure unless upon compulsion. (Morris cited in Thompson 1976:
    646–7)


    The speaker that was too big to fit in or too big to get out of a residential
    building does not fit this model. We might laugh at at the calamity, but it is
    a serious point that this obsessive level of attention, an intimate investment
    in the craft object, disrupts the scripts of capitalist life. The sound system
    is an object of enthusiasm that exists against the grain of financial stratification;
    at odds with the imagination of a lucrative life (although they may also have
    desired this).


    # Presence and wisdom


    The intimate presence of the sound system further disrupts the scripts of capitalist
    alienation. The performers are no different, in terms of socioeconomic background,
    from the people in the crowd; the music is performed and consumed by equals’,
    explains sociologist Les Back.


    > The MCs are by no means superstars, aloof and mythical ... The physical and
    social reality common to the audience and the performers makes the music relevant
    and accessible. The dance provides a powerful unifying context for the sharing
    and the celebration of collective experiences – the power of the music lies in
    its collective nature. (Back 1988: 149–51)


    In the sound system, shared experiences are then powerfully cohered through sound
    and through horizontal proximities. These are at odds with the individualism and
    privatisation of Thatcher’s Britain. The sound system keeps people together in
    the context of racial and classed alienation by providing a site in which daily
    experience and common social and historical circumstance'
