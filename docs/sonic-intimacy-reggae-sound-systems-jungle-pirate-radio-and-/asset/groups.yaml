    # THE REGGAE SOUND SYSTEM AND VIBE 39


    their burgeoning sound systems. These practices illustrate the sound system''s
    condition as DIY technology (a status shared by all technologies discussed in
    this book), and they also start to identify it as craft (a status not shared by
    all sound cultures in this book).


    DIY approaches to sound technology have a long history in black diasporic sound
    cultures and, indeed, more broadly in sectors of society limited by wealth but
    not by creativity. They are part of the story of the jumper as football goalpost,
    and the plank as affordable turntable as hip-hop instrument. And they are the
    practices before the initial emergence of sound systems in downtown Jamaica —
    who played recorded music for the masses, in part because upfront bands were too
    expensive. But not all of these can be considered craft, and in there is something
    at stake for our discussion of sonic intimacy.


    In the sound system, the DIY process is also a craft process, and the craft process
    entails intricacy between the object and in this case the sound-serson. The documentary
    *Sound Business* follows Sir Coxson Outational Sound System showing the process
    of cutting, gluing and screwing together new speaker cabinets. The interviewer
    inquires about the practice. Having spent days building the box, the craftsman
    thus explains to the camera his labour, his relationship with the sound technology
    and with the sound itself. ‘When you hear that section [of speakers] play’, he
    says, ‘the bass that is going to come out of it, you are going to feel it. It
    is a crucial part. Hearing the sound play’ (Dineen and Kaidan 1981). Much more
    than tautology, the box builder is explaining to the camera how his craft becomes
    expressed in sound. The moment the sound system plays, the moment you feel the
    bass, is already prefigured in his intimate relation with the sound technology;
    with the act of gluing wood together. His expressive labour relation with the
    sound technology foreshadows the creative dynamics of the dance. Craft itself
    is sonic expression.


    Craft entails skill and creativity. Sound systems, and particularly home-built
    and maintained sound systems, require the learning of specialist knowledge. ‘A
    speaker cabinet have to be designed to suit the particular speaker you are going
    to put in, you can’t just make box and put a speaker in it. It don’t normally
    work’ (Mr Herron interviewed in Smith and Wei Porter 2010). Likewise, the sound
    system is tuned to the resonant space of the dancehall, with the deep frequencies
    coming out of the back of the boxes allied to the architecture of an individual
    building. ‘In the early days we worked hard on the frequency’, explains Jah Shaka,
    ‘not only power, to get the right frequency. Some bass is very loud, but some
    is Hz – rumbling but you don’t hear – very low frequency. We try to get that’
    (Jah Shaka 2014).


    This is not necessarily the learning of a science, although it may be well that,
    too – electronics, for example – but more often an art – a qualitative, interpretive
    and creative understanding of how the sound system will play.


    All sound systems look for a combination of quality and power. When sound reproduction
    gets upwards of 3000 watts, distortion or a blurry sound is a problem – frequently
    unsolved in larger nightclub clubs. With sound systems, this problem is compounded
    by mobility. Unlike a club PA, the sound system is only set up a few hours before
    a dance. Nonetheless, even in testing acoustic contexts, power, quality and clarity
    are prized in maintaining the vibe of the dance, and each sound fine tunes those
    attributes to achieve their characteristic sound.


    Anybody who has developed a skilled relationship with an object they deem expressive
    will understand the intimate significance that object, or collection of objects,
    hold. In an expressive art object, one that is prefigured in dialogue with the
    audience, this is magnified such that the sound system becomes a collectivized
    ‘extension of personality’ (Jah Observer interviewed in Gaonach 2014).


    It is important to note, then, because it is not often said, that for sound system
    personnel, when the sound plays, the audience is not only listening to their music,
    but to their craft, which is an intimate relationship between craftsperson and
    object. To put it another way, if you have spent weeks building electrical components
    for a sound system, or maybe just the the frequency crossovers, when the sound
    plays and the capacitors hold out, your pleasure in the sound, in the dance and
    in the expression is also pleasure in the crossovers themselves; your intimate
    relationship with the sound system is at once with the crossovers and the revellers
    assembled.


