    # Frequency


    The discussion of alternative cultural politics in this book has been convoluted.
    It has explored shifts in mediation, and in the qualities and frequencies of sound.
    It has been concerned with alternative realizations of time and ways of knowing.
    It has considered shifting expressive relationships and mutualities. And it has
    addressed how all of these are held and conveyed through techno-social-sonic moments.


    The journey from the sonic intimacies of dancealls and radios to the seams of
    YouTube music videos offers one path for reflection. That path connects the relationship
    between frequency and alternative cultural politics.


    The reggae sound system''s bass carried black diasporic wisdoms and depths – ‘the
    moving hurting black story’ – which travelled beyond the radical capitalism of
    the day. Jungle raves fired up low-end strut through in-concert antiphonies to
    Yuppie bile. Pirate radio quickened their movement and diminished their depths.
    Those rolling, accelerating, waning stubs were intense. They are going to take
    over ... and then digital capitalism catches up. Grime YouTube music videos are
    lighter and quicker still. As digitized hype habitually lived, bass was too heavy
    and the social and historical messages of pleasure and pain carried away to featherweight
    sonics at historical odds


    But with grime''s mobiles the voice of the MC all returned, displacing the DJ
    and his/her turntables from centre stage. MC vocals thrived in the treble range.
    A load lessened of vinyl, decks and weighty speaker stacks. Leaking out of East
    London''s former industrial landscapes were tinny tonalities of humanity, not
    only white capitalist mobility. The MC''s voice carried pathos and pleasure like
    no other instrument, and that resonated word for word with the new-liberal city.


