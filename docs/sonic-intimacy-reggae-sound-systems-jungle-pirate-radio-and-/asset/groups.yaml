    # SONIC INTIMACY


    that the majority of grime music videos are conceived in terms of selling music.
    While professional performers and producers work in these rationales, the vast
    majority are amateur productions and any monetization of the video is non-existent
    or negligible, but they nonetheless know themselves on these terms. The intimate
    relation between producer, technology, expression and knowledge is practised and
    narrated through the regulated rationales of digital capitalism and less through
    the alternative economies, practices and temporalities of gift and craft.¹ This
    is a shift in the intimate relation between black diasporic music cultures and
    technologies. The patterns of expression possible through sound technologies are
    increasingly manufacturer designated. You can record and upload the video that
    you want, but an intimate creative relation with its closed-circuit technologies
    is impossible.


    # Grime, coldness, agonism, intensity


    Sonically, grime is a diverse music, about 140bpm, faster than slower than jungle,
    and typically scored in 4/4 time with 8- or 16-bar cycles. It is largely comprised
    of electronic sounds, synth keyboards and sampled soul and R&B melodies (as with
    UK Garage) and employs programmed drums and bass lines (as with jungle). Initially,
    this follows a two-step garage pattern filled with jungle snares and hi-hats (derivative
    of hip hop) (Charles 2018: 5–6; Painting 2016: 11). The bass lines draw from reggae/dub
    and the lyricism extends from reggae toasting and jungle MCing with hip hop and
    rap influences.


    Those sonic properties correspond to the biographies of its producers. Skepta
    grew up in Tottenham listening to reggae, dancehall, Snoop Dogg, jungle and UK
    Garage. No Lay wrote poetry and jungle bars in her bedroom (No Lay 2011). As Footsie
    says, ''It''s so deep I think I''m not doing anything special, other than caring
    on what was already done'' (Footsie cited in Hancox 2018: 34).


    Grime is a version of what came before but it''s also its own story. Grime''s
    recent history can be narrated through jungle and its split from UK garage. Whereas
    UK garage was concerned with champagne, this is reflected in grime early video
    content. Released on Channel U in 2005, Kano''s ''Ps and Qs'' uses the roads of
    London as a backdrop. A cameo from The Street''s Skinner is all that remains of
    the high budget Missy Eliott-esque aesthetics of UK garage (à la So Solid Crew)
    (Kano, 2005). Roll Deep''s behind-the-scenes documentary, One on One with Roll
    Deep, released with their debut Album In the Deep End, takes these aesthetics
    further, developing the predominant grime music video style (Roll Deep, 2005).
    As also evident in No Lay''s video for ''Unorthoded Daughter'', council estate
    locations, graffiti walls, chest-high camera shots and basic lighting become default
    (No Lay 2008).¹²


    On the dance floor, the accompanying two-step sonics are ''dirty'', ''mucky'',
    ''groty'' and ''grimy'' (Hancox 2018: 17). ''Wheel that grotty tune!'' calls Kano
    (Kano 2005a). This is an appeal to the soil of former industrial places. ''I come
    from nothing – I come from the underground, pirate radio stations, I come from
    the ground man'', says Dizee Rascal in a 2003 interview for BBC News (Dizee Rascal
    cited in White 2017: 15; my emphasis). Shystie''s first album, Diamond in the
    Dirt (Shystie 2004), is not just a play on ''diamond in the rough'' but sings
    the sonic history of London soil itself. This is not a rejection of ostentatious
    aesthetics but a claim to the material history of East London working-class life,
    its factories, soot and grease. It is a revisionist claim against UK garage, as
    it is also a reckoning with the clean glass of Canary Wharf, and the social violence
    of those aesthetics.13


    As grime is a sonic document of the post-industrial working-class life. The ground
    and earth play, too, through reggae, jungle and, indeed, jazz. Duke Ellington''s
    first grounding bass, and the downward bass-heavy shakes of UK reggae and jungle
    dance floors become more intense, harsher and chromatic in grime. This is where
    D Double meets Burial by Leviticus and Boy Better Know meets UK hip hop Clash
    Clashoff.


    Grime''s are also cold. Towards the end of the 1990s, the RAM records jungle productions
    of Andy C, Optical and Ed Rush to develop a metallic sonic. In the hands of Groove
    UK garage productions, they become further exemplary here. Grime extends this
    repertoire through its ''sparse, glacial, machine-made beats leaking out of a
    thousand phone ringtones'' (in-sleeve from Various artists 2005). Wiley adopts
    the pseudonym ''Eskiboy'' and in 2002 produces two foundational instrumentals
    ''Eskimo'' and ''Eskance''. The sound came from our situation. It''s a cold, dark
    sound because we came from a cold, dark place. These are inner-city streets. It''s
    gritty, icy, cold that all comes from childhood. The pain, the isolation, the
    frustration being in a dark place My sister understands; from when we were kids,
    she''s always been with me (Wiley 2017: 79, 255).


    # GRIME AND YOUTUBE MUSIC VIDEOS


    Wiley’s traces the Invisible Man’s.¹⁴ The ice itself, a metaphor for social negation,
    isolation and sanctuary, is the structure for the sonics of his music. As Ellison’s
    warmth is to jazz, darkness, to light, and new beginnings in the context of a
    racist and capitalist society; Wiley’s ice is to grime, to whiteness, to darkness,
    to social wildness and coldness. Wiley’s ice is white but dark, and ‘darkness’,
    anger and pain (agonism) colour the sound of grime. Grime is ‘about aggression
    and pain’, says Crazy Titch (Crazy Titch cited in Collins and Rose 2016: 35).
    Sonically, ‘this can be hard on the ear, the beats can be disturbing and brutal’
    (White 2017: 30). As the road puts it: The aggressive, minimal sound shaking out
    of the lights all over London and beyond; the tense soundtrack of stations like
    Rinse and Freeze that has unclassifiable beats rolling out the door of record
    stores like Lord of Music or Conflict (in-sleeve from Various artists 2005).


    Here we find the lyrical assault that is Lethal Bizzle’s ‘Pow!’ ‘made of pure
    frustration’ (cited in Collins and Rose 2016: 23), Dizzee Rascal’s Boy in a Corner,
    ‘an astonishing debut, a projectile of anger and violence, alienation and confusion’
    (Hattenstone 2010). As sociologist Ysef Bakkali puts it, this is the ‘pain of
    the mundane’ (Bakkali 2019). ‘The best MCs speak from pain’, says Wiley ‘from
    when they were down and never had a fever’ (Wiley 2017: 29). This is the anger
    of ‘dysfunctional families from when you are a grown man in a house tearing down
    road to go Iceland to put food on the table and make sure your mum’s okay’ (BBC
    Radio 1Xtra 2015: 5 mins). Grime sounds out neo-liberalism’s ‘fuck this. Fuck
    everyone. Everyone’s so angry at the world and each other. And they don’t know
    why’ (Wiley cited in Hancox 2018: 68).


    In grime, these sonic expressions of grime, coldness and anger are intense and
    energetic. ''I was always gassed’, says Ghetto (NFTR 2015). ''All this violence
    around you can fuck you up, but as a musician it can help you. It gives you raw
    energy'' (Danny Weed cited in Collins and Rascal 2016: 27). Battle clashes, calls
    out, sending for people, MC culture and war dubs then compound an already social
    identity, born of no-liberal capitalism, marginalization and alienation in late
    Labour and early Tory Britain. Sound boy I can have your guts for it, this place
    into a lyrical slaughter. (No Lay 2008)


    There are numerous examples of this. Terror Da Ft (Riko, Bruza, D Double E and
    Hyper) ''Cock Back'', a track about gunplay, relentless of aggression and coldness
    coupled with speed and energy (Various artists 2005). Dizzee Rascal''s staccato,
    fast pace high-pitch attack on Body in Carn and in his sidewinder collaborations
    with DJ Slimzee. No Lay''s relentless wordplay for ''Fire in the Booth''. In the
    rave this intensity shifts UK garage''s ''one也就, two-step in your new shoes''
    to grime''s ''put up your fingers and see who you might move to'' (Kano 2005a).
    These registers echo Baby in Babylon, My Dynamic and Lauren Hill, but so, too,
    the hard scowling sonics of jungle.


    Which is also to say, while the agonism of grime stems from internal pains, is
    also shared. Devlin recalls, as a young man, the agonism of the new grime sound
    called him from his Dagenham outer East London; it moved across London, establishing
    connections out of isolations (DJDUBLTV 2017). ''I feel, I feel'', said Ghetto,
    ''and it just happens a lot of other people feel it too'' (NFTR 2015). Indeed,
    of Wiley''s intentions was for other people to find themselves in his sound (Wiley
    2017: 255).


    # Lo-fi sonic intimacies – grime, coldness, aggression and intensity – are retained
    and altered through YouTube. To approach the significance of this we can engage
    with Monique Charles feels grime''s


    ¹In the context of shorter and shorter attention spans, and for those who imagine
    success on financial terms, a continual flow of audio-visual stimulus takes precedent
    in this way, the content of the music becomes empty, reduced to an affect-governing
    shell. Played alongside personal brand and merchandising it becomes just another
    way in which visually organized business is done. On consumer terms, Boy Better
    Know as celebrity, brand and music video pastiche is a minor example of this.


    ¹²That video is shot on the Lansbury Estate, Bow, London underground garages and
    National Front (NF) graffiti.


    ¹⁴Ellison’s Invisible Man contains many references to coldness as inhumanity,
    and this is countered by the warmth of the dark, jazz-resonating explored at the
    end/beginning of the book (2001).

