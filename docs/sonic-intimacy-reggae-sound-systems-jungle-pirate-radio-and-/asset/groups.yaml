    # 36 SONIC INTIMACY


    We can add to these, the spurious raid of a black pub in Villa Cross, Handsworth
    and the police driving a car at high speed through a group of black people at
    Leeds Chapelt Bonfire Day celebration (a special event for the black community
    in Leeds) (Institute of Race Relations 1987: 6; Plummer (1972).


    A particular focus of police violence was the Mangrove Restaurant in Notting Hill.
    On one occasion during the 1977 Notting Hill Carnival!¹¹ police entered the premises
    with indiscriminate force. Testimonies of victims from the time record how the
    police broke limbs, terrified children, administered savage beatings, frustrated
    emergency medical attention from ambulance crews and forced some to jump from
    windows 4 to 5 metres off the ground. Notably, they also targeted the sound system.
    Basil from the Black Punch System was playing at the time.


    The first I heard somebody outside shouting that the police are chasing people.
    Somebody else shouted to close the door. Next thing I knew was a charge. The window
    to the door was smashed by truncheons beating on it and then they came in. They
    started beating everybody and telling us to get out, but we couldn''t because
    the door was cordoned off. Police smashed my amplifier to the floor and tossed
    my records all over. There was a couple with the child near me and I protested
    to the police to let them out. Apart from my amplifier, at least 45 singles were
    smashed and five LPs which you can''t buy in this country at all. It''s just nonsensical
    to me that they come into a place in that way, beating people and smashing property
    and making no arrests. (Race Today Collective 1977: 27)


    ¹¹Corollaries to include the 1970 Mangrove 9 incident in which nine members of
    the black intellectual and activist community were arrested for protesting against
    the continual raids of the restaurant on false drug and criminal possession charges.
    Those arrested former Race and Class editor Darius Howe. In 1974, the police had
    attacked the Cari Club in Crickwood, arresting twelve people, among them the Suffer
    Hi-Fi operator Dennis Bovell on a charge of incitement to riots, for whom he received
    a sentence of three years in prison, before being acquitted after six months (Johnson
    1981: 10–11). This event is immortalized in the final scene of Babylon, for which
    Bovell wrote the soundtrack (Rosso 1981). For more details on Notting Hill Carnival,
    please see Gutmore 1993.'
