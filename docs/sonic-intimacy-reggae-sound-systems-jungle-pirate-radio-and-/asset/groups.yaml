    # 丛林非法广播电与狂热


    以及布莱尔早期的狂喜，那些时代的轮廓如今已成为撒切勒和新工党（New Labour）时期那些心碎与高潮的脚注。


    当时出版了关于丛林的文化研究，¹，但对丛林非法广播电本身的描写却更少。民族学方法因非法广播电员的保密性而受阻，而媒体研究则将其青睐的目光聚焦在商业、国家、军事和社区广播上。对于广播研究而言，黑人离散的非法音乐广播电并未像这样被主动忽视，只是没有被听见。


    为了解决这个问题，本章探讨了粉丝上传到网站的丛林非法广播电节目录音。对这些录目的讨论得到了该时期新闻、文学、纪录片和电影片段的支持。丛林非法广播电的在线档案是不均匀的。像
    Kool FM 这样知名的电台有所记载，但来自伦敦周边市场城镇的数百个小型电台——例如海伊威科姆、乌克斯桥和赫特福德的电台——却缺失了。通过这种方式，我们错过了那些在棚上或山坡上架设天线，向市中心大规模广播的人。


    # 丛林非法广播电的历史


    丛林非法广播电出现在音响系统的震动之后、YouTube 的崇拜之前，它与两者都是同步的，而非分离。它共享了雷鬼（reggae）和垃圾（grime）等黑人本土音乐形式，同时也拥有其自主的媒体生态和城市地理。它们的现代性和流动性也交织在一起。在丛林非法广播电中，录制音乐和音响系统的晶体技术通过电话、汽车、高速公路和年轻人的卧室流动。²因此，非法广播电的历史是现代的，因为它也是一种黑人离散的声记忆。


    大众对非法音乐广播电的关注集中在 20 世纪 50 年代和 60 年代的英国海盗电台，“海盗广播”一词正是为他们而产生的。Radio Caroline 和
    Radio London 等电台那些大胆但平易接受的英雄人物是展览的素材。


    > ¹这些研究包括 Christoloudou 2009; James 1997.


    > ²Michael Bull 通过 Walkman（Bull 2000）探讨了这一现代声音流动故事的另一个版本。


    这些回顾了一个反叛且流行的时刻的书籍，最终在 1967 年《海洋广播法案》通过后被重新吸回重组后的 BBC。


    随之出现的陆地平原记录较少。Laser 558 在 Radio Caroline 消失后播放流行音乐。从 20 世纪 70 年代末开始，Invicta 播放灵魂乐，到
    1984 年“海盗广播之夏”，Dread Broadcasting Corporation、JFM 和 Horizon 在整个伦敦传输雷鬼、电子乐和灵魂乐（Goddard
    2011: 24; Hind and Mosco 1985）。到 1988 年，伦敦有 31 个非法广播电台在运营，包括 London Weekend Radio、Galaxy
    和 Kiss FM。他们播放灵魂乐、雷鬼和其他黑人音乐流（Wolton 2010）。到 1989-90 年，光伦敦就有 60 多个非法电台，包括硬核、派对和酸性浩室：Sunrise、Centre
    France、Dance FM 和 Fantasy（Hebditch 2015; 2017）。


    丛林非法广播电在这里是混合的。许多早期丛林非法者在音响系统和非法雷鬼、派对、灵魂乐和放克广播电中成长。Ragga Twins 是 Kool FM 的常客，属于
    Unity 音响系统。DJ Hype 曾担任嘻哈哈唱片 DJ，制作传单和扬声器箱，收听硬核非法电台，并在 1984 年加入 Heatwave 音响系统播放
    ragga、稀有律动、嘻哈哈、灵魂乐和早期浩室。在伦敦东北部的一个仓库工作期间，他加入了托特特纳姆的非法广播电 WIBS，然后搬到哈克尼的 Fantasy
    FM。1989 年，PJ、Smiley 和 Hype 经营了 ragga 音响系统 Private Party。受 Soul II 穿过北部和东部的影响，Shut
    Up and Dance（PJ 和 Smiley）发布了浩室、嘻哈哈和硬核的混合，正如 Paul Chambers (Ibiza Records) 将酸性浩室与他父亲的雷鬼相结合，而
    Residents 的 Fabio 和 Grooveider 将灵魂乐与浩室、科技舞和嘻哈混合（Belle-Fortune 2004; Evans 2014）。³


    > ³此外，DJ Zinc 正在混合酸性浩室之前的电子乐、酸性浩室和嘻哈（Hyponic 2016）。来自伦敦郊区的 Prodigy 使用加速的节奏（break
    beats），带有科技舞和均衡处理的低音，并开始在 Dalston 的 Laboratory 出现。MC GQ 的兄弟在音响系统工作，正在雷鬼声前硬核 MC
    上发展嘻哈歌词，而 MC White 和 Eminem Rat Pack 此前曾如此（Belle-Fortune 2004: 150）。MC Skibabee
    听着嘻哈、稀有律动、灵魂乐、说唱和 ragga，并在 KRS One、Public Enemy 和 Capleton 的节奏发展丛林歌词。


    # 丛林非法广播电与狂热 59


    到 1991 年，“丛林”正在出现。Defection FM 在硬核曲目上引入了节奏（DJ Wicked et. 1992）。在 Don FM 上，Ed Rush
    正在播放由数字化低音贝斯、160 bpm 嘻哈节奏和 ragga MC 组成的“硬核”（Rush et. 1993）。在 Harlesden，rude boys
    和 crusties 正在体验某种“非硬核”的东西（Belle-Fortune 2004: 13）。在哈克尼和托特纳姆的俱乐部和仓库里，Early Rebel
    MC（又名 Project X，又名 Konga Natty）和 Lennie 在雷鬼声前硬核 MC 上发展嘻哈歌词，而 MC White 和 Eminem
    Rat Pack 此前曾如此（Belle-Fortune 2004: 150）。MC Skibabee 听着嘻哈、稀有律动、灵魂乐、说唱和 ragga，并在
    KRS One、Public Enemy 和 Capleton 的节奏发展丛林歌词。


