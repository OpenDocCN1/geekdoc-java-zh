    of Dub (King Tubby and The Upsetter 2005), and Sir Coxsone''s King of the Dub
    Rock 1 and 2 are notable albums here (Sir Coxsone Sound 1975, 1982).


    Dub is the avant-garde work of dub deconstruction, the tools for which are the
    mixing desk, reverb, echo, phasing and tape editing. As LKJ explains,


    Here, the recording engineer, through skilful manipulation of the controls, the
    use of echo, reverb, phasing and other sound effects in the mixing of the rhythm
    tracks, is able to lend the music added rhythmic and illusory affect, making it
    particularly suited to dancing. (Johnson 1981: 10)


    In the dance a second level of deconstruction takes place as the selector drops
    the bass in and out, adding reverb and echo to further distort time and space.
    Jah Shaka is unsurpassed in this aspect of the art. From the early 1970s he has
    presided over'
