    # GRIME AND YOUTUBE MUSIC VIDEOS


    Wiley’s igloo traces the Invisible Man’s hole.¹¹⁴ The igloo itself, a metaphor
    for social negation, retraction, isolation and sanctuary, is the structure for
    the sonics of his music. As Ellison’s warmth is to jazz, darkness, to light, and
    new beginnings in the context of a racist and capitalist society; Wiley’s igloo
    is to grime, to whiteness, to darkness, to social wildness and coldness.


    Wiley’s igloo is white but dark, and ‘darkness’, anger and pain (agonism) colour
    the sound of grime. Grime is ‘about aggression and anger and pain’, says Crazy
    Titch (Crazy Titch cited in Collins and Rose 2016: 35). Sonically, ‘this can be
    hard on the ear, the beats can be disturbing and brutal’ (White 2017: 30). As
