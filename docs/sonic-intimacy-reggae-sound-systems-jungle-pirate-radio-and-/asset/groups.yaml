    ## Intimacy


    Intimacy is less familiar to cultural studies than scholarship on sound and the
    sonic, although it is well developed in English literature, psychology and psychoanalysis,
    and to a lesser extent in sociology. Much of this, of course, deals with love,
    sexuality and romance. And while the dynamics of these relations are relevant
    to this book, the forms of intimacy discussed in the following pages have more
    in common with intimacy’s other applications: an intimate room, an intimate sound,
    an intimate feeling, an intimate relation, intimate knowledge and, indeed, an
    intimate atmosphere. As with the Latin *intimus*, the superlative of intimate,
    intimacy in this book is concerned with innermost depth, presence, wholeness and
    privileged knowledge, always in relation (Sexton and Sexton 1982: 2).


    Debates on intimacy in the West are often staged over a pre-romantic/romantic/modern
    timeline corresponding to the ways in which intimacy with God became an infatuation
    with the soul of another, and then a project of self-betterment (Giddens 1992:
    2; Elouz 2012: 39; Zeldin 1994: 125). The subjects of these debates are routinely
    European, with the Romantic period being particularly prominent in literary analysis
    (Yousef 2013).


    In these Eurocentric accounts, property, family and the individual session of
    man’s own person are developed as sites of intimacy and corners of European and
    Western liberty (Lowe 2015: 28). The intimate rooms, objects and interior (personal)
    musings that redound in romantic literature are not casual decorations. They are
    rather the privileged sites to which the bourgeois individual withdraws from an
    alienating world, and at the same time, the sites of the reproduction of bourgeois
    power. Bourgeois intimacy concerns the reproduction of property at the same time
    as it is contingent with reproduction of the bourgeois itself. The sexual intimacy
    of the European bourgeoisie, Boym writes, took place surrounded by their ‘innumerable
    curio cabinets and chests of drawers’ (Boym 2001: 255).


    The relationship between intimacy, liberty and the reproduction of Eurocentric
    bourgeois power depended on the simultaneous reproduction of subjugation. That
    subjugation was organized through race and Empire. In European colonial contexts,
    the symbolic over-sexualization of Indian, Chinese and black women in accordance
    with the sexual desires of Western men had the function of establishing the intimate
    household order of white female domesticity (Nandy 1983: 32; Stoler 2010: 8).
    Nineteenth-century US images of the intimate-feminine as caste, modest and meek
    operated similarly through the over-sexualization of black femininity as the constitutive
    threat to white order (Carby 1987: 27). As the white woman symbolized the intimacy
    of the family home with its connotations of civility, domesticity and property,
    the Indian, Chinese and black woman symbolized its negative opposite, often through
    her appeal to the white man’s baser inserts.


    The intimacies of colonized people were also structured by racial and colonial
    orders. Servants and slaves were laved of time and private quarters in which to
    ruminate on their inner selves, and familial, romantic and kinship attachments
    were structured differently. Indeed, the intimate itself was often a site of brutality
    and control, as accounts of sexual violence reveal.² As Lowe notes, just as there
    was a colonial division of humanity there was ‘the historically differentiated
    access to the domains of liberal personhood from interiority and individual will,
    to the possession of property and domesticity’ (Lowe 2015: 18).


    But intimacy nonetheless persisted among colonial and racially subjugated people,
    in an alternative historical relationship to the development of white bourgeois
    modernity. To deny that is to limit human intimacy to one set of normative relations
    privileged racial dominance, and simultaneously thereby to erase the possibility
    of intimacy from the subjects of racial and colonial violence, which is also to
    remove the essence of humanity. As authors like Frederick Douglass and Primo Levi
    make clear, that intimacy persists in systems of crushing racial violence is testament
    to its enduring human quality (Douglass 2001; Levi 1988).


    However, in the social sciences and humanities the tendency has been less to understand
    the racial and colonial contingencies of intimacy than to understand intimacy,
    and much else, into liberal and Eurocentric dichotomies of private and public,
    femininity and masculinity, interiority and exteriority, and emotion and rationality,
    and that as the basis for normative discussions on well-functioning democracy
    (Habermas 1989).


    These-repeated approaches have ushered in a phalanx of analytical errors. These
    include the notions that: the public is not intimate; public relations are not
    concerned with intimacy; too much intimacy (privacy) causes a lack of social connection;
    and too little intimacy produces alienation (Dean 2005; Putnam 2000; Turkle 2011).
    In this sense, intimacy is not a question of public or private but at essence
    is marked by the barest of gestures (Giddens 1992: 3).


    Lauren Berlant bridges the false distinction between the intimate and public by
    engaging with intimacies of late capitalism. Working with the concept of ‘intimate
    public’, Berlant explores the ways in which affect is consumed (Berlant 1998;
    2008; see also 2011). This disrupts the valorization of intimacy as positive or
    damaging, as existent with patriarchy and bourgeois capitalism. But Berlant is
    nonetheless hampered by figuring intimacy as a benchmark for well-functioning
    democracy, which misses many of intimacy’s more productive registers. This book’s
    approach to intimacy is different. Through a relational approach to intimacy,
    it avoids the analytical ends of binary analysis.


    ## SONIC INTIMACY


    ## INTRODUCTION


    (Note: Text continues from below)


    Intimacy’s qualities depend on its relations not on a priori categories.


    In psychological works intimacy is said to occur when an individual has self-knowledge
    (intimate and internal) and is able to share this knowledge with another that
    it may be reciprocated (Fisher and Stricker 1982: xi). Intimacy is, then, the
    product of relation, or an interaction between two people, as Milner notes:


    The ability of each intimate to be a full presence with the other bespoke reciprocity
    between them so fundamental that it need only be hinted by the barest of looks,
    smiles, or intonations of voice in order to be immediately and unmistakably grasped.
    (Wilner 1982: 24)


    Intimacy is not a question of public or private but at essence is marked by the
    barest of gestures. Expanding from two people to a collective, this reciprocity
    can colour the entire atmosphere of a social situation, that it frames the interaction
    itself rather than being merely the product of it. It can also persist in the
    absence of the gestures that produce it, such that it precedes those acts. Here
    it becomes not only produced but productive: an ‘active process of shared engagement
    rather than simply a feeling or state’ (Sexton and Sexton 1982: 7)⁷


    As much as intimacy is produced and productive in collective social situations,
    it is also maintained through objects. In this book we are considering ‘Where
    Might I Find You?, Gail Lewis explores this dimension of intimacy. She considers
    how music (Jamaican popular songs) and their associated technologies (78, 45 and
    33 rpm records, and audio tapes) were the intimate sound objects through which
    she experienced her relationship with her father within a changing racialized
    and diasporic north-west London context that was black, white, Jamaican and English.
    For Lewis, those sounds and sound technologies are intimate because of the relationships
    they sustained with her father and with herself, because of the way in which she
    related to those materials and because of the ways in which personal feelings
    were carried out them (Lewis 2012: 138).


    ¹See also for discussion Sedwick and Frank 1995: 8, 10.

    ²The mind, the body, sexuality and sexual organs, friends, family and homes are
    sites of racial and colonial intimate governance (Beauvoir and Halimi 1962; Stoler
    2010; Weizman 2007).

    ⁷What Raymond Williams might refer to as a structure of feeling (Williams 1977).

