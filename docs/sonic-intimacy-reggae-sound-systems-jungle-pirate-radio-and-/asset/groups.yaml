    # SONIC INTIMACY


    Consumption and entrepreneurism, rather than production and mutuality, were the
    watch words of the time (Bauman 1998; Beck and Beck-Gernsheims 2001). Jungle pirate
    radio''s apogee then coincided with a less secure, more precarious and impermanent
    society, especially for its working-class protagonists less able to maximize themselves
    through spending power (Bauman 2000).


    Between 1990 and 1993 housing repossessions accompanied housing benefit cuts and
    council housing was reduced through pro-market ''to buy'' schemes. Labour market
    reorganization meant low and semi-skilled employment deprioritized, disadvantaging
    working-class young people. Unemployment among the young working-class was high,
    particularly for black and Asian young people also facing structural racism (France
    2007: 18; Mizen 2004: 67). In education, the introduction of free market competition
    and league tables, coupled with funding cuts, led to an increase in school exclusion
    among black boys. Only one in five young people leaving school at minimum age
    (16) entered the labour market and only half of these stayed on government work
    schemes (Mizen 2004: 23–55).


    This was also a time of heightened racism. In 1993 Derek Backon won the BNP''s
    first in East London''s Isle of Dogs on a ''rights for whites'' platform, targeting
    newly resettled Bangladeshis. In mainstream Conservative politics, the Island
    Nationalism of Norman Tebit MP was prominent. These Little Englanders fuelled
    street-level racism. In 1993, black schoolboy Stephen Lawrence was murdered by
    two racists in south London.


    The ongoing failure of the police to properly investigate these crimes were emblematic
    of its complexity, too. As the decade before, policing in this period was known
    for its racist intimidation and sometimes racist deaths, too. The deaths in police
    custody of Joy Gardener and Roger Silvester were prominent rallying points (Mizen
    2004: 131; Solomos 2003: 182).


    ⁷Permanent exclusions increased from 3,000 to over 100,000 between 1990 and 1997;
    the vast majority were boys, and the rates for black boys were five to eight times
    higher than those for whites (France 2000: 80).


    ⁸Tebbit''s 1990 ''Cricket Test'' was fuelled by the fear that post-colonial (black
    and Asian) culture was supplanting English culture. The test of loyalty to English
    culture was, for Tebbit, who you support in a match (Solomos 2003: 18–19).


