    # SONIC INTIMACY


    In this simple and regularly heard invocation, the jungle pirate defines and calls
    on the collective, as they locate themselves in the massive – moving the city
    away from local identifications to a metropolitan culture set by the broadcast
    radius of the transmitters. These metropolitan presences were reinforced and maintained
    through phone-ins and radio call-outs to crews, areas and constituencies of the
    metropole. Listeners waited in hand to catch their station''s number, ''held tight''
    for the impending shout to their driving/raving/bedroom/record shop/local collective,
    all the while hearing the other massives reeled off like a speed-regurgitated
    A to Z.


    Hertford, Bounds Green, Total Music, Dulwich Massive. Wicked reception in that
    part of town. Stratford massive, Ilford massive. Picking it up good over the east
    region. Leyton, Tottenham, Ladbroke Grove, Hackney, Clapton, Brixton. Big up to
    all the driving massive all around the capital. Kool FM one family. (Extracts
    from Marley Marl and Kool FM 1995: 34 mins)


    Bigging up Antony and Amy. Bigging up Nicky not forgetting Danny. Bigging up Charlie.
    Bigging up Louise. Bigging up the Henden massive. Bigging up Porsche, Denver,
    Isla the Camden massive. (Extracts from DJ Zinc and MC Rage on Eruption FM 1995:
    11 mins)


    These shout-outs were untidy and error prone; imperfect, redolent of stutters,
    mumbles and background noise; the voice sometimes audible over the music. This
    generated presence. Affirming the messy vernacular of everyday relations, it opened
    listeners to the station and to each other. This was not the disembodied voice
    of BBC unity (Loviglio 2005: xix). The MCs and DJs were people like you. This
    was ‘a real interaction and it was worth something’ (JME on SBTV and All 4 2017:
    20.14 mins).


    The intimate presence of jungle pirate radio was generated without for the public.
    Regulated radio''s dilemma of how to whisper into someone''s ear while finding
    the tone for the every-person was not a dilemma for Dream FM and their like.¹⁰
    ‘I always felt I was one of many thousands that would be listening’, explains
    Dream FM fan Finch. ''And that''s a feeling of inclusion and connection with all
    these people you don''t know'' (Finch quoted in Hancock 2011).


    Jungle pirate radio presence was at once with the massive and with the city, but
    it was also personal and private. After all, jungle pirate radio still permeated
    the (intimate) spaces of private homes, bringing music into people''s bedrooms
    and into their lives, intimately connecting MCs and DJs to their public.


    These guys Fize and Swifflee (on Dream FM) really brought hardcore and rave music
    into my bedroom and into my life. I don''t know what it is, maybe it was the style
    they did in or the music they played, but it connected with me. (Michael Finch
    in Jackson 2011: 9 mins 58 secs)


    This intimacy was distinct from that of regulated radio.¹¹ It was private and
    personal, but it was not the passive pervasive wash of ever-on shoebox transistors
    situated across parental homes. Jungle pirate radio was an active experience.
    for the ''girls in their bedrooms'' getting ready for a night out, listening because
    they could not go out or indeed switching back in the early morning to facilitate
    their come down, jungle pirate radio had a dynamic relation to their lives. Indeed,
    it was even difficult to listen to it passively. Its demand for attention made
    drifts from background to foreground fewer and further between. Jungle pirate
    radio was never quite assimilated into the dominant aural regimes of home or city.
    Its vibration was rarely idle and was frequently intoxicating.


    Shout out to the girls in their bedrooms! (Rush et al. 1993: 43 mins)


    # Junglist knowledge


    On a mid-1990s summer night, MC Top Cat reminds us, ''if you don''t go to jungle
    college you can''t get the junglist knowledge''. Junglist knowledge was an intimate
    knowledge; an insider status and posture, ''hard stepping into the 1990s'' (DJ
    Zinc and MC Rage on 1995: 13 mins). It was forged through common experiences of
    crap work, the city, low quality council and rented accommodation, the downbeat
    end of Tory Britain, a disregard for police and authority ... and raves.


    Jungle pirate collected and sonically distributed this knowledge in lock-step
    with the city. This knowledge was a plural wisdom. For Harlesden''s reggae vibes
    and Isle of Dogs’ hardcore, to the Americana and hip hop in heart of Hertfordshire
    and Stevenage, ‘many music’s [made] up jungle’ and many knows, too (Marley Marl
    and Footlose 1995: 26 mins). Jungle pirate radio was an impressionist''s mask
    of the city; an affirmation of the heterogeneity of British underground wisdom,
    not property of the Island Nation.


    While house music offered a kind of confetti reality, all dressup, fun and excess,
    and acid tech afforded a counter-culture reggae-skank-meets-white-crackers-in-the-city-from-the-shires,
    jungle''s knows were of pleasure and glitchy darkness. All inner-city grit.


    ¹⁰See, for a discussion on regulated radio, Crisell 1994: 4.

    ¹¹See, for a discussion of regulated radio as intimate to private life, Dyson
    1994: 179; Loviglio 2005.

