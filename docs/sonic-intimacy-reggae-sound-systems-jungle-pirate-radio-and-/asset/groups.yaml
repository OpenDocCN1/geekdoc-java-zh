    # SONIC INTIMACY


    A largely unremark dialogue upon Frederic Jameson’s Postmodernism (Jameson 1991)
    and Paul Gilroy’s Black Atlantic (Gilroy 1993) helps us understand what is at
    stake in this partial absence. In those seminal texts, Jameson and Gilroy address
    similar epistemic moments, both are persistent in their call to engage with the
    doubling of modernity and both further concern themselves with the shifts from
    soul to commodification. For Jameson the soul of the modern demands fractured
    through late modernity. For Gilroy, counter-modernities occur alongside the uneven
    capture of black diasporic demands by Eurocentric capitalism. And it is through
    these similarities that key differences in the texts become pronounced. Jameson''s
    analysis is principally visual and aesthetic and omits the relationship of late
    modernity to racism, slavery and capitalism. For Gilroy, racism, slavery and capitalism
    are central to any consideration of the modern, the visual and the coded, and
    this leads invariably to an enquiry into the sonic as a central modality through
    which black people have communicated themselves to the world in the context of
    visual and racial over-determination. When race and modernity are centered in
    the analysis, the sonic ‘supplement[s] and partially displace[s] concerns with
    textually’, while also showing black diasporic sound cultures to be thoroughly
    modern (Gilroy 1993: 36).


