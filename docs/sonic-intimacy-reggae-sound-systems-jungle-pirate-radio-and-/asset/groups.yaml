    # CONCLUSION


    bourgeois capitalism argument, but does so, crucially, on the terms of whiteness.
    The figuration of whiteness is not idle. It turns the orthodox working-class vs
    bourgeois capitalism critique into an issue of race without developing a critique
    of racism. That is to say, the figuration of the working-class as white develops
    a critique of socio-economic injustice but does not extend the same lens to racism.
    Whiteness is not a reactionary category, not a critical one. Unlike race, whiteness
    is not conveyed in critical relation to power but rather solicits a key mode of
    human domination — namely, white supremacy. That claim is defensive and identitarian.
    Its identitarian defence around class loss, explained through the loss experienced
    at the hands of multi-ethnic society and non-white, or not enough white (in the
    case of Eastern Europeans) immigration (James 2014b; James and Valluan 2018).
    Whiteness is valorized as Belonging, the Nation and Right to its hard to win resources.
    Left scholarship of the white working-class is less a defence of class against
    capital than it is a reactionary identitarian claim against those who are less
    racially deserving (Valluan 2019). The identitarian claim to whiteness, and not
    the class critique, is the heart of the matter, and that explains the manifest
    inconsistencies of the argument. In the working-class-white approach, whiteness
    is not the anodyne supplement to class analysis but its driving force. The appeal
    to whiteness relegates a critical analysis of class to little more intellectual
    dressing for a reactionary racist claim.


    Anti-racist scholarship routinely calls out this version of left for the assertion
    of race dominance it is so manifestly it. In doing so, it draws connections between
    the working-class-as-white argument and more assertive forms of white supremacy,
    nationalism and authoritarianism operating across the West and Europe. While it
    debunks these myths, locating them in their wider historical projects of domination,
    it adopts similar epistemic terms. That is to say, its critique of racism is sometimes
    based on defining tighter and more authentic identitarian claims against racist
    violence, often on the terrain established by racial dominance itself. This move
    has different names. It is sometimes called ‘strategic essentialism’, but it is
    also named the ‘treacherous bind’ (Spivak 2008: 260; Gunaratnam 2003: 28–9). Strategic
    essentialism lies in defining and defending people’s history, culture and cosmologies
    against colonial and racist erasure, and in mounting resistance on the basis of
    those resources. Here structure, power, identity and becoming be held productively
    in tension. The treacherous bind is a warning of how identitarian strategy can
    slip from a position of critical defence and action to one which essentialist
    orders are set by racism and colonialism becoming the orders for minoritized groups
    – the kind of resistance that the ‘nation-state hegemony finds logically comprehensible
    and ontologically satisfying’ (Valluan 2019: 47). When the strategic tensions
    between structure, power, identity, becoming and action slip into a starker defence
    of identitarian positions, those positions become the end in themselves, not a
    ‘strategic’ means to critical resistance. The defensive positions that reject
    racist austerity capitalism then acquiesce to the terms set by it.


    Social media intensifies this landscape in particular ways, stripping-racist utterances
    from their social context and opening onto the wider trends of hegemonic media.
    In Britain, US political positionalities become increasingly influential and accordingly
    regent the tone of anti-racist debate. In doing, the nuances and porosities of
    a more grounded dialogue are distilled and hyped through reactive Twitter contents
    (Seymour 2019; Titley 2019). There, effective claims and counter claims are won
    through amplifying sediment positions, shored up by the mobilization of cultish
    celebrity. Our transient attentions are continually captured by arresting demonstrations
    of grievance and injustice.


    There, the impression of collective anti-racist assertion is little more than
    overinvested digital personas. Such political action no longer has the means or
    desire to unveil its object of attention – racism. It no longer has the ability
    to form critical antirac associations. A politics that claims to do anti-racist
    work through loud, cultish and denounced accounts of elsewhere is not effectively
    anti-racist at all. It feeds a theatre of indignant contest set on its own erroneous
    terms.


    Through these submissions we adhere to one of bourgeois capitalism’s principle
    rules, and operations of power – the rule/power over time is ordered to the end
    of property and profit. Because what is occurring in these moves is also an over-privileging
    of the immediate, in which the past becomes a fragment in critical scholarship
    to more forcefully render the anti-racist claim. Snippets of texts, bites of convenient
    history and the odd Lorde and Fanon quote become incorporated into a form of action
    less interested in establishing its relation to those pasts than it is in substantiating
    its own immediate claim through the currency of the present. As with all bourgeois
    capitalist regimes, the immediate must be dominated, must be owned, an assertion
    must be substantiated over that moment. Loudly contesting racial dominance while
    re-inscribing capitalist governance can then frustrate, rather than further, activist
    scholarship and its knowledge of located anti-racist histories and cultures.


    Pushing back and forth along the lines set by modern dominance, this mode of critical
    left scholarship then finds it difficult to understand how cultural politics exists
    in relation to dominant modernity. It finds it difficult to assess the ways in
    which alternative modernisms intertwine with dominance and how they are also available
    as powerful threads for anti-racist work. It finds it difficult not because it
    disagrees with the possibility of such things, but rather because the moulds in
    which it is sedimented those lines of interrogation and action. When scholarly
    engagement is set by the epistemic terms it contests, when its defensive identitarian
    positions relate to the magnitudes of that, it will be necessarily difficult.


    # SONIC INTIMACY


    Critical left scholarship, then, offers an attractive thesis — one which can be
    mobilized with facility to understand all manner of social, cultural and political
    problems. Indeed, the most reductive and loudest versions of these critiques are
    particularly saleable and satisfying. When society is run by politicians who have
    more invested in hedge funds than high streets and where racism and nationalism
    are the principle moves of generating electoral consent, nothing feels better
    to shout back, but a roar on those terms, however cathartic, is cathic in the
    night.


    That is not the approach I have endorsing in this book. Rather, through a discussion
    of sonic intimacy, the book has explored how versions of modern culture skew to
    the dominant regimes of racial capitalism — not with or without, but alternative;
    and how alternative culture provide political resources for anti-racism and post-colonial
    power. Making this case for alternative political culture is categorically not
    an argument for the pre-modern — for animism and the like. I have repeatedly stated
    the perils of these discussions in relation to race. While animist analyses might
    sometimes be useful in figuring industrial modernity as a destructive aberration
    in planetary time, their anti-modern positions also frustrate alternative engagements
    with modernity and the uneven resonances it contains, both intellectual and political,
    for anti-racist and post-colonial scholarship. This book''s analysis of sonic
    intimacy has responded to the racial and classed violence of late modernity not
    by addressing outside modernity (the primordial model) or culture as object from
    modernity (resistance), but by addressing culture in alternative relation to dominant
    modernity.


    In this book, the alternative cultural politics of black diasporic sound cultures
    have been discussed in terms of sonic intimacy. It has been through sonic intimacy
    that the book has reflected on the ways in which the cultural politics of the
    black Atlantic are alternative to dominant racial, capitalist visual and textual
    scripts. It is through the transformation of sonic intimacy that key shifts in
    alternative cultural politics have been assessed.

