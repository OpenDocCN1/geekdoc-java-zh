    # 结论


    思考、财产所有权、个人主义、种族主义、民族中心主义和民族主义。与其关注政治客的刻薄言辞以及警察和军队的野蛮行为，统治地位通过流行文化得到了探索——因为正是在流行文化中，在日常生活的织锦以及在普通人的创造性和习惯性模式中，野蛮被经历，而同意也得以保障（Hall
    1996）。同样，在流行文化中，人们找到了野蛮的替代方案。在流行文化的日常平庸中，蕴含着至关重要的矛盾和持久的希望之源。


    声音亲密（Sonic intimacy）之所以适用于这一探究，恰是因为它与统治地位——即视觉和文本上的种族资本主义之间存在矛盾的关系。黑人散居文化的声音亲密带来了一种自下而上的文化政治；一种有故事可说的文化政治。在这里，“低鸣”（Bellow）并不意味着脱离了主流现代性。相反，“低鸣”是现代性大调运动的小调关键。⁴“低鸣”是逆着资本主义信息时间铺设的。“低鸣”预示了主流的现代认识论，因为它同时也承载了那个时代的恐怖与喜悦。
    “下方”的东西可以为当下被奏响并重新排列⁵


    “低鸣”是民主的，由狂欢者实现；它是民主的，由狂欢者实现；它是民主的，由狂欢者实现。它是现代性大调的小调的关键。它对同类旅行者开放。在散居的形式中，它随着时间跨越国家移动。通过引用，它追溯了流动的暴力性。在财产和资本的制度中，流动是半是表达的，半是隐藏的，被主张但未被捕获的。“低鸣”，是人类性可能繁荣的音域。“低鸣”是许多代人的声音和振动。


    “我们”离开了主张与反主张的舒适领域。这种做的动力是如此紧迫。在这一强化的种族主义和威权主义时刻，我们对所处之境的诉求，通过这些路径以不同的形式呈现了人性（McKittrick
    2015）。


    ⁴ 这种对“下方”概念的参与，在后殖民主义和批判文本中勾勒出来（见McKittrick 2015; 2006）。

    ⁵ 关于历史性的讨论，见Bakhtin 1986; Benjamin 1968。


    # 频率


    书中对替代文化政治的讨论是复杂的。它探索了媒介的变化，以及声音的特性。它关注了时间的替代性实现，并考虑了表达性的关系和共同性。它解决了这些是如何通过技术-社会时刻被持有和传递的。


    从舞池和电台的声音亲密性到YouTube音乐视频的旅程，为反思提供了一条路径。这条路径连接了频率与替代文化政治。


    雷鬼声音系统的低音承载了散居的智慧和深度——“流动的散居故事”——跨越了资本主义的激进。丛林狂欢点燃了这些。地下电台的运动削减了它们的深度。这些滚动的、加速的、衰减的片段是剧烈的。它们将接管……然后数字资本主义追了上来。Grime
    YouTube音乐视频更加轻盈、更加快速。随着数字化的热潮习惯性地生活，低音太重了，历史性的快乐与痛苦信息被带到了轻量级的音学中。


    但随着Grime的移动性，MC的声音回归了，取代了舞台中心的DJ和唱片机。MC的人声在高频范围内繁荣。黑胶唱片、调音台和沉重的音箱堆减少了。从东伦敦过去的工业景观中渗透出的，是人性的细微调性。MC的声音承载了其他乐器无法比拟的情感与快乐，与新的自由主义城市产生了共鸣。


    YouTube音乐视频改变了那些频率，但视觉并未取代声音。相反，社交媒体开始歌唱。声音被筛选，然后屏幕成了声音；MC的人性在视觉流中被重建。真实性、诱惑和危险的瞬间渗透了声音制作的复杂性。种族主义、男性气概和个人品牌的符号勾勒了他们的音学。愤怒、温暖和寒冷的声音化被编码在身体上。吟唱继续。声音通过种族化的身体签名，以像素化的形式出现了一种人性的声音。当这种歌唱继续时，种族资本主义尚未完全掌握。


    # 自主时间区域


    在时间的旅行，从顺时针到“达布式”，雷鬼声音系统的替代时间性在白人阶级节奏的磨损之外移动，使散居的经历在家和国外保持活力。丛林地下电台引用了达布引发的强度和速度的自主时间区域。舞池和活动拉紧了规范拨的机制，对话的美学非持续性扭曲了日常形式，以实现未来城市的重构。


    Grime更加即时；在极限，在边缘，从遍布伦敦、没有安全栏的屋顶地下电台中溢出。它的狂欢和电台与前进的物理性和非持续性同步移动。唱片店、电台……YouTube音乐视频强化了那种即时性，但也削减了它的非持续性。在非持续性上，后雷鬼的人性被设定了，并在YouTube中消亡了。在流动但并非边缘的状态，Grime
    YouTube音乐视频是脱时间的虚空超复制，强化了Grime主张与反主张的剧场，损害了紧迫的焦虑和自主时间性。YouTube Grime音乐视频随着网络化的强迫点击移动，打破主流时间的模具仍然非常重要。


    # 智慧


    雷鬼、丛林和Grime的知识体系在主流生活的财产制度之外移动。Livity（生命力）、丛林主义和Grime位于信息化的当下之下。英国城市中黑人生活的智慧与散居经验的精髓、对快节奏多族裔共处的智慧以及后工业场所的格调汇编在一起。在系列中，它们是激活的链条。它们共同承载了共享生活的完整，被许多手触碰过的认知。


    智慧通过音乐移动——通过被编码的声音回放给城市，并被其庆祝者确认。社会地位和日常仪式的确认、政治斗争、压迫与解放，在这些声音中过滤、流出。但智慧也通过声音氛围产生。强度、寒冷和温暖的音域构建了时刻的一般知识，随着它们多变的放大模式在时间中显现睿智。与信息交织在一起，雷鬼和丛林尽管如此使用了白标签、混音，但声音形式本身破坏了财产。但在Grime
    YouTube音乐视频中，智慧和信息被更紧密地扭在一起。统治地位与其替代方案几乎无法区分，尽管替代方案依然存在。事实上，DIY YouTube制作充满了替代性知识，即使它们被路由到数字资本主义的还原性流。


    # 工艺


    工艺再存在于这里了！那些对劳动异化敌视的技术社会过程，这些与资本主义剥削产生生产性冲突的开放物质关系，随着YouTube和3G的出现似乎结束了它们的时代。


