    1997: 138–9）。


    ¹¹ 灵魂乐并非被困在私人领域——一个我们不执行而只是遭受（pathen）的或或混乱的避难所，在这些情况下，极大的强度作为快乐和欲望淹没了我们（Arendt
    1978: 72）。阿伦特此于她对公共行动和私人生活的二元假设，她通过一种社会从性的全权主义现代性瓦解并内化了这种区分，这种方式对政治行动是不有利的（Arendt
    1958）。


    ¹² 这通常通过对赫克阿姨尖叫的描述来解释。海克阿姨是弗雷德里克·道格拉斯《叙事》中出现的奴隶妇女（Douglass 2001）。她是道格拉斯家族成员。


