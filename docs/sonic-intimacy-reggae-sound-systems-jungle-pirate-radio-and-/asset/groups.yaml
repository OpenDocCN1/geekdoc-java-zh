    jungle''s knows were of pleasure and glitchy darkness. All inner-city grit and
    suburban aggression with grins, jungle informed what it felt like to live in London
    and the south-east of England at that moment.


    The name ‘jungle’ contained its own black diasporic wisdom – Duke Ellington (Jungle
    Sound), James Brown (Jungle Groove), Bob Marley (Concrete Jungle) and Grandmaster
    Flash (‘It’s like a jungle sometimes, It makes me wonder how I keep from goin’
    under). It cited an area of Kingston and the feeling of black urban living in
    the US. When Congo Natty with X Project used the Jamaican yard tape sample ‘all
    junggalists’ in his 1991, it spoke an old but new knowledge to Britain, too.


    Jungle''s sonics and samples referenced the social issues of the time: inner-city
    violence, loneliness and disconnection (Ferrignano 2008: 94). Its MCing patched
    the Jamaican gunslinger over the Wild Atlantic to make sense, not of UK culture,
    but of a popular Atlantic rebel melancholy surrounded by the shock and awe of
    social violence. Its commentary channeled Martin Scorsese, the capitalist powerhouses
    of Michael Jordan Inc and Premier League football in celebrations of snatch and
    grab capitalism, entrepreneurship and the merits of consumer society, for the
    boys.


    These were combined in junglist knowledge. Jungle pirate radio understood the
    blues of a February winter and a mid-week lull at work. It knew the euphoria of
    the summer, the highs of Friday night'
