    # THE REGGAE SOUND SYSTEM AND VIBE


    failure to investigate the deaths of black children in the New Cross fire became
    a particularly rallying point. To say the police were both racist and belligerent
    in this period is an understatement,¹ and indeed this knowledge became popular
    fare for reggae''s more politicized sound systems.


    The absence of employment for young people, and the danger they faced on the streets
    at the hands of the police and racist gangs, also placed greater importance on
    the affordable leisure provided by the sound systems. With unofficial race bars
    operating on the doors of many clubs, sound systems were some of the sites black
    young people had to congregate around (Jones 1988: 127). As focal points of black
    and working-class culture, these leisure sites were contingently as a threat to
    law and order; associated with a dangerous and culturally corrosive black culture.
    As early as 1957 when shebeens came into the white public consciousness, there
    were calls for their crackdown. The vandalizing by the police of Duke Vin''s sound
    in the 1950s heralded a rarity of such mistreatment (Vin 2017).


    Throughout the 1970s, there were police raids on parties, cultural events and
    youth clubs attended by black young people. The list of these aggressions is impossible
    to enumerate here, but to give a sense, early in the decade:


    The walls of the Church Hall at Faraday Road, Notting Hill, are covered with posters
    listing the battle honours of the last year ... the Metro Youth Club (sixteen
    arrested), Harlesden (eight), Acton Park (ten), Peckham Rye (over fifty), Lisson
    Grove; and so the lists on. (Hartley 1971)


    ¹In the New Cross fire thirteen children were burned to death at a party. In the
    aftermath, police consistently and often frustrated proper criminal investigation
    through manipulation of the media, coercion of witnesses and the assignment of
    blame to friends of the dead. These deep injustices resulted in the work of the
    New Cross Massacre Action Committee which organized a protest of 15,000–20,000
    black people, John La Rose was the chair of committee that worked to hold the
    police to account and find out (La Rose 1984: 3).


    ²These injustices gave rise to a series of protests and uprisings in Brixton,
    London 1981, 1985; Chapletown, Leeds 1975 and 1981; Handsworth, Birmingham 1981,
    1985; Notting Hill, London 1976; Southall 1979; St Pauls, Bristol 1980; Tottenham
    1987; Toxteth, Liverpool 1981.


    # 36 SONIC INTIMACY


    We can add to these, the spurious raid of a black pub in Villa Cross, Handsworth
    and the police driving a car at high speed through a group of black people at
    Leeds Chapelt Bonfire Day celebration (a special event for the black community
    in Leeds) (Institute of Race Relations 1987: 6; Plummer (1972).


    A particular focus of police violence was the Mangrove Restaurant in Notting Hill.
    On one occasion during the 1977 Notting Hill Carnival!¹¹ police entered the premises
    with indiscriminate force. Testimonies of victims from the time record how the
    police broke limbs, terrified children, administered savage beatings, frustrated
    emergency medical attention from ambulance crews and forced some to jump from
    windows 4 to 5 metres off the ground. Notably, they also targeted the sound system.
    Basil from the Black Punch System was playing at the time.


    The first I heard somebody outside shouting that the police are chasing people.
    Somebody else shouted to close the door. Next thing I knew was a charge. The window
    to the door was smashed by truncheons beating on it and then they came in. They
    started beating everybody and telling us to get out, but because the door was
    cordoned off. Police smashed my amplifier to the floor and tossed my records all
    over. There was a couple with the child near me and I protested to the police
    to let them out. Apart from my amplifier, at least 45 singles were smashed and
    five LPs which you can''t buy in this country at all. It''s just nonsensical to
    me that they come into a place in that way, beating people and smashing property
    and making arrests. (Race Today 1977)


    ¹¹Corollaries to include the 7 Mangrove incident in which nine members of the
    black intellectual and activist community were arrested against the continual
    raids of the restaurant on false drug and criminal charges. In 1974, the police
    had attacked the Club in Crickwood, arresting twelve people, among them Dennis
    Bovell for whom he received a sentence of three years in prison, before being
    acquitted after six months (Johnson 1981: 10). This event is immortalized in the
    final scene of Babylon, for which Bovell wrote the soundtrack.


    # THE REGGAE SOUND SYSTEM AND VIBE Kin and community


    In Bass Culture, Lloyd Bradley writes that the sound system was much more than
    a wall of speaker boxes; it was quite literally ‘the community’s heartbeat’ (2000:
    4). While Bradley’s image of the sound system as the community’s heartbeat is
    perhaps not the right metaphor for the relationality I have been outlining – trapped
    as it is in a hermetic image of organs in the body – it is a useful point from
    which to consider the sound system as intimate in the context above.


    The film Babylon illustrates this well. Babylon follows the daily tribulations
    of a young man called Blue, played by Aswad Forde. Blue is a deej with a sound
    system and the plot follows him as they prepare for a dance. This provides the
    narrative arc to explore cultural production, racism and interracial friendship
    in late 1970s London. The same sound system that gets shut off by the police in
    the final scene has also entertained at a wedding in a local community hall. That
    is, reggae sound system is portrayed as at once intimate to family events and
    dances.


    The privileged relation of the sound system to black life is underlined by its
    version in the family home, and indeed the most sacred of spaces – the front room.
    Here, it took the form of the radiogram, and in particular the Blaupunkt Blue
    Spot. The Blue Spot was not a sound system. It was a radiogram nonetheless informed
    by its larger cousin, a domestic version of it. In the 1950s, radiograms were
    common among English middle-class families. Many featured cabinets, making them
    entertainment hubs – music, drinking and socializing wrapped into one. While companies
    like Grundig and Garrard made popular, Caribbean immigrants often bought the Blue
    Spot because it was louder and had better bass response. It suited listening practices
    informed by the music culture of the Caribbean.


    Mikey D and Jah Baddis, sound system personnel from Coventry, both describe the
    central importance of this technology to the black family home, and the recurring
    preference for this particular model: ‘We had a Blue Spot gram most West Indian
    people did at the time’ (Mikey D interviewed in Smith and Porter 2010); [the Blue
    Spot] was played on a Sunday afternoon (Jah Baddis interviewed in Smith and Porter
    2010).


    The British Caribbean room, in which the Blue Spot sat, was a hybrid of the Caribbean
    and English Edwardian-Victorian front room. The Caribbean front room was already
    a hybrid of colonial Victorian and African aesthetics (Hall 2009). In Britain,
    its particular arrangement marked status and belonging in the UK, as addressed
    by Vincentian author Michael McMillan:


    You weren''t allowed in this room unless there were guests, it''s Sunday, Jim
    Reeves''s ''The Distant Drums'' is blaring out of the ''Bluespot'' radiogram and
    big people are chatting news from back home. Mum is drinking Beckham. I pass the
    pineapple ice bucket and listen quiet as a lamb, my skin sticking to the plastic
    covering the PVC imitation leather. I smell rice and the paraffin heater competing
    with the cabinet filled with glasses that are never used. I touch the painted
    glass fish and plastic flowers on fanciful-stitched crochet on a gold-rimmed fake
    marble coffee table. A blue-eyed Jesus looks at me from The Last Supper on floral
    wallpaper saying ''cleanliness is next to godliness''. The front room looked so
    good, that it didn''t matter how poor we were, we were decent people. Growing
    up, this room echoed the proverb, ''By the sweat of your brow, you will eat bread''
    haunted me like nails scratching a blackboard. I know now that it is part of who
    I am and unconsciously I recreate a similar shrine in my own home today. (McMillan
    2005)


    The image McMillan paints is of a sensory space, filled with visual symbolism,
    deeply personal, deeply intimate to how his family were and who he is. Post-war
    American popular music is opening onto black British sounds, and in the midst
    is the Blue Spot radiogram – an image of a sound system focusing and challenging
    black family life.


