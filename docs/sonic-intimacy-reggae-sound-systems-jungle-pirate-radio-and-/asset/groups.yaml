    # INTRODUCTION


    into a dialogue between jazz and opera and also between Ellison and the opera
    singer, acknowledges not just their cultural and racial differences but also the
    similarities of their institutions, practices and expressions. Through music the
    apartment building is elaborated a microcosm of the contradictions of American
    life; a location through which the neat dichotomies of race and culture (black
    and white, jazz and opera, unmodern and modern) can be productively called into
    question. One of his devices for this is technology, with his modern hi-fi and
    jazz recordings prominent in questioning the Eurocentric myth of modernity.


    However, that account of sonic intimacy in his apartment building reveals more
    than an astute engagement with sound, intimacy and the contradictions of race
    in modern America. At the same time (although it is not Ellison’s critical intention)
    it shows how patriarchy also plays through these relations. Although they are
    not the point of the essay, masculinity and violence are in fact central to it.
    The essay is as much a discussion of race as it is an engagement with mastery,
    control and domination. The contest with the opera singer is after all violent.
    Ellison weaponizes amplified music to reassert his dominance over their shared
    building, and over the opera singer herself. As he does so he demonstrates his
    mastery over technology; over the hi-fi, which has correlates with the jazz instruments.
    The male affinity with technology as modern vector of control and domination in
    Fordist (and post-Fordist) society is played out.


    Here again we see how sonic intimacy is socially produced and culturally informed,
    and how the relationships of humans, technologies and sounds contain popular entanglements
    of conviviality and violence. Reading Ellison’s ‘Living with Music’ in that way
    provides a bridge to understanding the sonic intimities discussed in this book,
    and their conjoint commentaries on race, everyday life, and masculinity’s ‘intimate
    bond with technology’ (Wajcman 1991: 137).


    # How the book proceeds


    This chapter has been used to outline how sonic intimacy is understood in this
    book, and to signal what is at stake in sonic intimacy for black diasporic sound
    cultures. To address these concerns in more detail, each of the following chapters
    explores a different sound culture and conjuncture – reggae sound systems, jungle
    pirate radio and grime YouTube videos. Each establishes the sound culture through
    its technological, social and sonic relations, and explores its sonic intimacy
    with regard to presence, knowledge, wholeness and depth. Discussion is structured
    such that the chapters not be read in any particular order. If you’re more interested
    in jungle or pirate radio then you can begin here. However, to understand the
    overall argument on transformation all the chapters need to be read. After all,
    the book is less a guide to each discrete sound culture than it is an argument
    about the movements between them.¹ That argument, along with a polemic defence
    of the approach taken in this book vis-à-vis contemporary race scholarship, is
    collected in the Conclusion.


