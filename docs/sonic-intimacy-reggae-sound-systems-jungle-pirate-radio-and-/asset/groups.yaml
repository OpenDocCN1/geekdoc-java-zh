    radio''s apogee then coincided with a less secure, more precarious and impermanent
    society, especially for its working-class protagonists less able to maximize themselves
    through spending power (Bauman 2000).


    Between 1990 and 1993 housing repossessions accompanied housing benefit cuts and
    council housing was reduced through pro-market ''to buy'' schemes. Labour market
    reorganization meant low and semi-skilled employment deprioritized, disadvantaging
    working-class young people. Unemployment among the young working-class was high,
    particularly for black and Asian young people also facing structural racism (France
    2007: 18; Mizen 2004: 67). In education, the introduction of free market competition
    and league tables, coupled with funding cuts, led to an increase in school exclusion
    among black boys. Only one in five young people leaving school at minimum age
    (16) entered the labour market and only half of these stayed on government work
    schemes (Mizen 2004: 23–55).


