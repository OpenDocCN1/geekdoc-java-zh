    ## 结论


    对多族共处的评估是基于事实的（Back 1994; Gilroy 2004; James 2015; Valluvan 2016）。局限性构建了一个城市对“差异的漠视”（Amin
    2010）。舞池厅和海盗电台的有限集体，使得接触与共存变得易于理解。


    YouTube 是丰饶的象征。Grime YouTube 音乐视频是极具共融性的，但它们的媒介化并非有限的。YouTube 视频需要用户去填补那个“无处不在又无处可见”的对话者的缺席。这种缺失往往通过退缩回自我以及喧扬的、可销售的身份来补充。从这个意义上说，丰饶是一种感到被撕裂的感觉。它是焦虑的根源，滋养了晚现代生活中早已存在的社会否定。


    互惠性并没有结束。它包含了共处中固有的关怀与馈赠政治，但这些并不依赖于共处，也无法被还原为共处。互惠、关怀和赠予作为残酷、财产所有权和私有化的替代方案存在，即使它们经常与这些纠缠在一起。在雷鬼、jungle
    和 grime 中，这些通过社区、亲缘以及家庭网络和同伴协会的代际传播被观察到。这些关系是深层的。它们反对主导社会所要求的私有化。它们从紧密网络延伸到更广泛的社区，再到“大众”，在那里它们被视为“生命支持系统”。用今天的话来说，这是一个非寻常的主张：声音文化中的关怀系统可以支撑生命！


    在音响生命支持系统中，表达和对话通常优先利润。在这里，智慧通过学徒制被赠予，音乐被赠予城市，制作人们之间相互赠送节拍、混音和采样。财产并不是重点。致富或维持生存通常是次要的。即使当此类实践与预设产生共鸣时，它们也没有完全被其捕获。互惠依然至关重要。在敌意成为常态的背景下，这一点同样重要。


    ## 完整性


    这些替代性的文化政治在一起通常被解释为魔法和神秘主义。这并不是因为派对者相信巫师和魔法师阶层，而是因为声音文化的体验超越了语言。但这种体验并非魔法，它是：


    ## 声音的亲密


    比魔法更好。它是散居声音、技术以及人类/社会关系在声音文化中（通过舞池、派对或电台表达出来）的完全且关联的汇聚。这些特定因素汇聚成一种力量感，一种真正令人着迷的感觉。


    雷鬼舞池的氛围是一种在唱针触碰唱片之前就存在的完整性。随着旋律的落下，技术、声音和社会性被激活了。jungle 海盗电台的完整性是速度与爱。它是派对、电台、汽车、手机和唱片，向着耗尽而运行。那种“hype”（氛围）是互惠的、向外的、多族族的、黑色的且扩张的，但受限于城市的范围。它由多个散居分支组成。hype
    是为 jungle 大众产生/由大众产生。它在以太中被预示。它预判了 MC。它悬浮于低音线条和段落之上，为电话拨入而躁动，渴望来自查尔顿的 Anita 的呼喊。几乎要溢出来地，jungle
    电台的完整性是过载的。它威胁要抹除这一刻，但做不到。


    grime 音乐视频的完整性是粘性、内啡肽、蓝光、薄如纸的持久性和超链接碎片。它是社交媒体、手机、微型扬声器、屏幕、互联网以及无处不在又无处可见的数字无产阶级。情感纽带、化学冲动和不安的过度活跃提供了饥饿与近乎饱和的感觉，一种溢出的感，这种感觉太过于资本化而永远无法诗意。它的溢出与震撼与其说是基于与主导种族资本主义相矛盾的不协调完整，不如说是对那种状态的否定。这是活着的多族城市的完整性，对于一个不易于被伦理占有的声音文化而言。但它也是一种通过
    Google Analytics 获取的观众的完整性，对于被喂养的观众而言。这种完整性在声音文化中并非易于被伦理占有的。这种完整性在声音文化中。这种完整性并非易于被伦理占有的。


