    ⁶⁶ 关于海盗广播电中使用手机的详细评论，请参阅 Fuller 2005: 50–2。


    # 听觉亲密性


    消费与创业精神，而非生产与互助，是那个时代的行号（Bauman 1998; Beck and Beck-Gernsheims 2001）。丛林海盗广播电的巅峰恰恰遇上一个安全性更低、更动荡不安且转瞬即逝的社会，特别是对于那些无法通过消费能力实现自身价值最大化的工人阶级主角而言（Bauman
    2000）。


    1990年到1993年间，房屋收回伴随着住房津贴的削减，市政住房通过亲市场的“买房”计划而减少。劳动力市场的重组意味着低技能和半技能就业机会不再被优先考虑，这使工人阶级年轻人处于不利地位。年轻工人阶级的失业率非常高不下，特别是对于同样面临结构性种族主义的黑人和亚洲年轻人来说（France
    2007: 18; Mizen 2004: 67）。在教育领域，自由市场竞争和排名制度的引入，加之资金的削减，导致黑人男孩被勒学的比例有所增加。在最低年龄（16岁）离开学校的年轻人中，只有五分之一进入了劳动力市场，而其中只有一半留在政府的工作计划中（Mizen
    2004: 23–55）。


    这也是一个种族主义加剧的时期。1993年，德里克·巴科肯（Derek Backon）在“白人权利”的平台上在东伦敦的狗岛获得了英国民族党（BNP）的首胜，目标是新移民的孟加拉国人。在主流保守政治中，议员诺曼·泰比特（Norman
    Tebit）的“岛屿主义”非常突出。这些小英格兰主义者助长了街头的种族主义。1993年，黑人学生斯蒂芬·劳伦斯（Stephen Lawrence）被伦敦南部的两个种族主义者杀害。


    警方未能妥调查这些犯罪的持续失败，也反映了问题的复杂性。与上十年一样，这一时期的执法工作也以其种族主义恐吓和有时发生的种族主义死亡而闻名。乔伊·加德纳（Joy
    Gardener）和罗杰·西尔维斯特（Roger Silvester）在拘留期间的死亡是主要的集结焦点（Mizen 2004: 131; Solomos 2003:
    182）。


    ⁷1990年到1997年间，永久开除人数从3,000人增加到100,000人；绝大多数是男孩，黑人男孩的比例是白人的五到八倍（France 2000: 80）。


    ⁸泰比特1990年的“板球测试”源于对后殖民（黑人和亚洲人）文化正在取代英国文化的恐惧。对于泰比特来说，对英国文化的忠诚测试就在于你在比赛中支持哪一方（Solomos
    2003: 18–19）。


    # 丛林海盗广播与炒作


    与此同时，青少年文化被贴上了危险、堕落和失控的标签。作为保守党对美德更广泛道德化的一部分——以首相约翰·梅杰（John Major）与其同事爱德维纳·库里（Edwina
    Currie）的情闻告终——这些道德恐慌的引发并非像那样是因为斯蒂芬·劳伦斯的死，而是两个更惨的受害者的死亡：白人婴儿詹米·布尔格（Jamie Bulger）被两个大较大的男孩绑架并杀害，以及白人俱乐部爱好者莉亚·比茨（Leah
    Beats）因摇头古因导致的死亡（France 2007: 97, 136）。


    布尔格的死亡影响了1994年《刑事司法与公共秩序法》（刑事司法法）的起草，该法案将少年犯罪机构儿童的最高刑期翻了一倍。由于对舞蹈音乐文化和药物（以及郡县地主的担忧）的关注，同一项法律打击了露天派对，带有讽刺的是，这反而催化了市中心俱乐部场景的发展。


    在这些恐慌中，“丛林”（jungle）被认为是从黑人角度来看危险且退化的。1994年，《观察者生活》（Observer Life）杂志发表了一篇文章，称丛林是一种具有争议且具有显著黑人特征的现象（Belle-Fortune
    2004: 162）。（注：原文此处存在大量重复段落，已按要求去重处理）。

