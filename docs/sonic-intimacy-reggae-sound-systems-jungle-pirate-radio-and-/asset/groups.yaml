    # 雷鬼音响系统与氛围


    它是通过其与其他组件的关系来定义的。因此，它不是一种报警器、警报器或个人广播系统，而是一个低音、中音或高音单元。


    这种原创性并未止于此，因为社会维度也与技术维度相关。也就是说，人们及其实践融入了“套件”（set）——播放曲目的挑选者（selector）以及负责歌词创作的
    DJ（在后狂舞术语中称为 MC）赋予技术以定义，他们负责控制麦克风或运行和配置整套设备。技术也赋予了他们的角色意义。麦克风定义了 DJ，而唱片定义了挑选者。


    我正在阐述并将贯穿全本书的观点是：音响系统的声音亲密性只有在关系中才能被理解。如果不强调这一点，我们得到的将是一个对文化的规范性描述，一种面向特定职业或控制体系的规范，这些规范往往更多地反映了对声音文化本身的掌控程度，而非其动态过程。


    音响系统的原创性并不仅止于个人与技术之间的互惠关系，因为这些个人社会角色是相互依赖的。音响系统通常不是个人的追求，而是集体的、即团队（crew）的追求。正如麦克风与
    DJ 之间存在互惠关系，音响系统与其团队之间也存在这种关系。团队赋予了技术特定的地位，而音响系统的力量和质量则赋予了他们意义。Dez Henry 在《DJ
    说的话》（*What the Deejay Said*）一书中讨论了这些技术社会关系，解释了音响系统如何与 DJ 共享声誉。在这种情况下，这种声誉是提升、意识歌词和黑人赋权的象征。这种声誉并非由
    DJ 单独承担，而是整个音响系统，使得一个系统被评估为一个技术社会共同体（Henry 2006: 151）。


    所有这些关系（包括搬运和移动设备的搬运工、潜在的 DJ 和挑选者，以及对于大型系统的电子或扬声器制造专家）都通过声音凝聚在一起。事实上，是声音而非技术宣告了音响系统的存在。是声音穿越整个舞池。当声音召唤团队并让技术产生时，它也验证了其中汇聚的角色。如果你是操作员，你的职责就是音质、功率和可靠性。如果声音糟糕，那么你和你的技术就会被这样评价。当
    Henry 提到他的音响系统在提升方面的声誉时，他指的是声音。他识别了歌词叙述（声音性的），同时也暗示了音乐（也是声音性的）。这种声音可以进一步分为不同的频率范围，对应鼓点、器乐、歌词和基准线。


    但如果没有舞厅（dancehall），这些意义不大。当活跃时，扬声器发射的声波将技术和团队与观众联系起来。音响系统预设了观众的存在，观众远非音乐的被动接收者，而是共同生产者。音响系统的建立建立与其观众的对话之上。在这个意义上，音响系统是一种技术社会配置，其定义取决于其社会关系的现场性。音响系统的技术通过与观众的关系获得其意义（在
    Henry 看来是其声誉），观众通过舞蹈和声音来验证其立场；通过躯体和声音符号。舞池中的斯康克舞（skank）和“回放！”（rewind！）的呼喊是音响系统团队的关键信息。当一个音响系统不演出、处于处于无弦的状态时，它可能仍然有一个团队，但事实上它不再是一个音响系统。当被锁在仓库、车库或地下室时，它失去了社会生活和活力，重新变成了一堆具有潜力的易碎技术。


    # 危机


    在建立了音响系统的关系性基础后，必须强调它活跃的节点。雷鬼音响系统的文化和政治维度只有在将其置于社会经济背景中时才能被评估。对于音响系统来说，这种推测是由战后资本主义危机塑造的，危机中种族主义和民族主义主张占据了核心。


    资本主义的结构性危机定义了音响系统活跃的战后时期，塑造了此后二十年的 70 年代和 80 年代。全球经济转型导致英国制造业基础下降、技术竞争力的降低以及全球贸易地位的削弱。这些转型在保守党首相玛格丽特·撒哲的自由市场革命得到了解决，并偶然导致经常针对黑人和黑人文化（包括音响系统文化）的种族主义和民族主义主张。


    在动荡的第一任期后，马尔逊岛战争为撒哲在 1983 年大选中的意外胜利铺平了道路，为快速去工业化、国家收缩和新自由主义市场经济的粗暴实施提供了政治机会。公共支出的剧减、通货膨胀飙升和失业随之而来，严重打击了黑人，这一时期大多数黑人是工人阶级。青年人口的百分之五十失业，其中黑人青年受影响最严重。


    危机的经济解决方案伴随着一个种族主义的危机。在撒哲之前，战后国家在经济和社会领域大幅度扩张，这意味着经济压力也被体验为政治压力。国家使自己对大部分经济和社会领域负责，因此因此也对其短板负有责任。这些政治困境动摇了政府的合法性，导致了社会民主原则的侵蚀。从工党詹姆斯·卡拉纳汉（James
    Callaghan）政府执政（1976–79）起，这种侵蚀日益被民粹主义政治所填充，其特点是对比法律秩序的威权主义诉求。这取代了当时社会民主的共识模式（Hall
    et al. 1978: 21）。


    那些对法律秩序的民粹主义诉求源于反黑人种族主义的深渊，在 70 年代和 80 年代，这导致了黑人在私人和市政住房中受到歧视，遭受警察过度执法、任意逮捕和拘留、警察暴力和性侮辱。在教育领域，黑人儿童经常面临骚扰和制度性种族主义（Institute
    of Race Relations 1987）。还有对 SUS 法的无差别使用（导致黑人和亚裔受到不成比例的针对），最终导致了 SW1 行动，使布里克斯顿数千人被扣留（Institute
    of Race Relations 1987）。


    > “撒哲在 1978 年为格兰纳达电视《行动世界》（World in Action）播出的关于‘淹没’（swamping）的演讲，加强了民族阵线（National
    Front）的支持及其对边缘种族的排斥。但更大的意义被赋予了伊诺克·鲍威尔（Enoch Powell）的影响，在撒哲之前，他利用 60 年代末期的美国白人政治，来放大了反黑人种族主义的论调；他是沃尔瑟汉普斯特西部的保守党议员，在
    1968 年的《血之河》演讲中，他预言性地警告了黑人移民的后果。他在1964 年大选演讲中提出了‘颜色问题’的危害，并在1967 年的‘突击’中将工人阶级描绘成压迫性的、社会化的且脱离主流英国社会的。演讲结束后，立即发生了种族主义袭击，十四名青少年对一个黑人家庭划刀，并喊着‘鲍威尔和你们回你们的国家吧’（James
    and Valluan 2018）。


    从 1975 年到 1976 年，全球最大的流行明星之一大卫·鲍威（David Bowie）对纳粹形态表示了同情，并在维多利亚站外做出纳粹礼（他辩解称那是挥手）。鲍威后来对这些错误表示道歉，但我们不应忽视这种自认为幼稚的行为对英国黑人和亚洲人造成的重大影响。事实上，加上埃里克·克拉普顿（Eric
    Clapton）的白人至上主义言论，足以引发 1978 年反种族主义摇滚（Rock Against Racism）的形成——该运动包括了 The Clash、Tommy
    Robinson Band、X-Ray Specs 和 Steel Pulse 等表演者。


