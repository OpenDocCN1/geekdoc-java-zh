    ## 格莱姆与 YouTube 音乐视频


    年轻人仍然在卧室写歌词并在公共空间进行音乐对战，但到 2009 年，许多人通过手机和 YouTube 制作和欣赏音乐。在短短几年内，黑人离散文化将其对二十世纪模拟声音技术的偏好转向了对二十世纪数字和网络音乐视频的痴迷。社交媒体现在成为了黑人离散文化的中心。


    格莱姆的主要 YouTube 频道在此时出现。2006 年，16岁的 Jamal Edwards 创建了 SBTV（Smokeybarz Television）。随后在
    2008 年出现了 Link Up TV，以及在 2009 年的 GRM Daily。这些频道遵循了早期 DVD 建立的格式：街头说唱（SBTV 的 F64
    即兴系列在此是关键的——以说唱 64 小节的长度命名！）、幕后视频、纪录片和各种制作水平的音乐视频。当 GRM Daily 发布时，视频内容不再像 DVD
    那样是分集的，而是连续的流。在新千年的第一个十年的末，SBTV 积累了数百万 YouTube 观看，并成为全球发现格莱姆音乐的来源之一（Jamal Edwards
    引用自 Collins and Rose 2016: 170；White 2017: 77）。


    ## 新自由主义资本的（持续性）危机


    随着新工党于 1997 年执政，早先保守党政府的自由市场理念被扩大为对去监管的全球金融资本主义的全心拥抱，这在后来导致了 2008 年金融危机。这种被称为“赌场资本主义”的商业模式成为新工党的核心支柱，对于工人阶级来说，其影响往往是极局部的。2008
    年金融危机的影响在格莱姆音乐诞生的社区感受得最为剧烈。


    尽管有早期的承诺，数字革命的影响并不均匀。对于许多人来说，互联网提供了新的表达工具，但对另一些人来说，它是另一层排斥。从海盗广播到数字平台的转变改变了音乐消费和生产的本质。

