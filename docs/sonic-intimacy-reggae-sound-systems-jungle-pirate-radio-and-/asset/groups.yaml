    # 致谢


    本书的完成离不开一些支持。首先要感谢 Michael Bull 的鼓励和对话。我想感谢 Carolyn Birdsall 的建议。感谢 Martin Daughtry
    的反馈。感谢 Michael Heller 的深刻见解。感谢 Brian Kane 的友善。感谢 Marie Thompson 的帮助。感谢 James Mansell
    的支持。


    我想感谢 Naaz Rashid 的见解。感谢 Antonia Dawes 的帮助。感谢 Jordan King 的支持。感谢 Katie Thorinson
    的帮助。感谢 Matthew White 的友善。感谢 Caspar Bains 的帮助。感谢 Dave White 的支持。感谢 Hancox 的帮助。感谢
    John dees 的友善。感谢 Elena 的支持。


    感谢我的朋友们的支持。感谢大学教师联盟（UCU）的团结。在混乱中，感谢我的父母的支持。感谢我的姐姐和家人所有的爱。最后，感谢 Nicole 和 Sonny，感谢我的父母、姐姐和家人所有的爱。没有你们这一切是不可能的！


    # 引言


    2017年4月，我去伦敦肖德奇的 Village Underground 看了 Nadia Rose 的表演。我之前在 YouTube 上看过她的视频，对她与相机的亲和力留下了印象。我试图购买她的
    EP 实体，但只有 YouTube 上提供。为了支持这位艺术家，我付费下载了曲目。当我这样做时，我被它们缺乏了什么。


    在一个关于后殖民城市方法的三级本科课程上，我鼓励学生思考这些变化对音乐意味着什么，实际上对黑人散居文化的替代文化和政治记录意味着什么。我们追溯 Debord、Benjamin、Adorno
    和 Wynter，思考视觉文化、资本主义与种族的关系，然后通过 Gilroy、Du Bois 和 Weheliye 进行讨论，探索声音与现代性的替代关系。


    在 Village Underground，Nadia Rose 的克罗登团队出现了，但其他观众只是是因为 Skwod 的视频来的。他们疏离而漠不在焉，就像伦敦观众那样，令人精疲力竭，而
    Rose 在屏幕上是如此自信，在这一代人的媒介中如此熟练，却显得很紧张。诚然，这是一场大演出，但她似乎对这些现场艺术并不熟悉。


    作为 Brit School 的毕业生，在视频表演方面接受过高水平训练，你的 YouTube 人设很难传达给观众。


