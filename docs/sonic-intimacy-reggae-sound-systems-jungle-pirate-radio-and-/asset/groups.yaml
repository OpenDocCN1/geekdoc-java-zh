    # Sonic intimacy


    The subject of sonic intimacy receives various renderings in scholarly work. One
    of the most authoritative is Tia DeNora’s Music in Everyday Life. In that book,
    DeN explores the intimate dimensions of music (codified sound) to understand the
    role that it plays in romantic relationships. She explores how music is culturally
    constructed with ideas of love, gender and sexuality and how, for heterosexual
    couples, their performance of love and sexuality is intertwined with the symbolism
    that music has on these terms (DeNora 1999; 2000). Certain songs are symbolic
    of certain constructions of romance, and the playing of them helps us make sense
    of ourselves as gendered beings in sexual relationships.


    As part of the wider textual trend in cultural theory, DeNora’s work helps us
    to understand why a man or woman might choose a certain song in a certain moment
    – because it symbolizes their gendered understanding of love and physical romance.
    But, at the same time, it makes difficult to understand the ways in which sonic
    intimacy might exceed the symbolic. It makes hard to know what intimacy feels
    like in those moments, or, indeed, how part of that feeling concern our intimate
    relation with the music (or music technology) itself.


