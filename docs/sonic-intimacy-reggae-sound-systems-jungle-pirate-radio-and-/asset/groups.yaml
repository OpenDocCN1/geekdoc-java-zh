    pirate could stand on the roof of a tower block and imagine the community s/he
    was playing to, on YouTube these projections are unfathomable. Defined by plenitude
    rather than finitude, YouTube communities cannot be tangibly embraced or embrace
    you.


    These hyperlocalisms are compounded by deterritorialization. Deterritorialization
    refers to the ways in which social context, time and space are fractured and recomposed
    through YouTube. Whereas pirate radio relays through a central point (radio station),
    the YouTube dialogue counts on numerous different dialogic partners. These multiple
    linked horizons, interlocutors and social contexts move digital bits through networked
    space in several directions at once, speeding up and slowing the arrival of the
    message; ‘decomposing and recombining, multiplying and aggregating into different
    contexts’ (Rubinstein and Sluis 2013: 30). As grime producer Tricks says, ‘You
    can upload your stuff, send it out and anyone in the world can hear it’, importantly,
    and unlike Wiley’s comments about pirate radio, this anyone is an empty figure
    (Mavros 2011).


    Relying on user inputs, ‘aggregated practices of sequential viewing’ are filtered
    and organized algorithms by global corporations to increase the consumption of
    online material (Airoidia et al. 2016: 1). These algorithms are produced far away
    from grime’s local realities. When YouTube music videos become nodes in a decontextualized
    network, where the sequence in these videos are suggested to viewers is determined
    not by the contents of a track or the call-in dialogues between DJs and listeners,
    but by the relative weight of the videos to each other (Airoidia et al. 2016:
    4; Davidson et al. 2010; Zhou et al. 2010). In the absence of a city that can
    embrace you, the hyperlocal becomes an increasingly tangible horizon for deterritorialized
    experience.


    For audiences, the hyperlocal appears as a key signature through which deterritorialized
    grime video’s credentials can be established. As East London producer Malacki
    da Monarch explains:


    When you see artists who are getting millions of views, you will find that most
    of their fans are not [from where they are]. If you go on Google Analytics, they
    are not from here ... they’ve got fans elsewhere. What people are catching on
    to is that it is very authentic ... people are intrigued, and that is commercial.
    (Interview with Malacki da Monarch, 15 October 2018)


    ## GRIME AND YOUTUBE MUSIC VIDEOS


    Without requisite contextual knowledge, the concrete, tracksuits, crews, masculine
    somatic performance, angst and intensity function as open coded affective hooks,
    drawing the detritorialized viewer in. Here distinctions between authentic ''hood
    videos and pastiche become blurred. SBTV''s F4 road raps quickly realize the value
    of placeless localism, as do obviously made for a global online market. In the
    Barbican London, Skepta’s ‘Shut Down’ takes the high culture brutalist aesthetics
    of the wealthy Barbican estate, to set grimey urban locality to an online audience
    (Skepta 2015).⁸


    ## Closed-circuit DIY


    Through craft processes, alternative expression was built into the fabric of the
    sound system speaker boxes. Intimate knowled ask to the dominant flows of capitalist
    production and information were grafted onto jungle pirate radio through illegal
    and pragmatic DIY practices. Crime YouTube music videos follow the DIY ethos of
    jungle pirate radio, in that they make pragmatic use of available technologies.
    The ubiquitous mobile phone provides young people with the means to play tracks
    and record music videos, and the YouTube interface allows for these productions
    to be shared online. However, despite some similarities, this labour relation
    is not of the same order as sound systems or pirate radio.


    Mobile phones and YouTube technologies are designed with a low user skill threshold.
    Their nominally global reach, their profit imperative and their legality means
    that they are manufactured, unlike sound systems and pirate radio, to be used
    by potentially anyone. There is no apprenticeship to be had and little alternative
    wisdom to be forged. Early grime YouTube producers like Jamal Edwards did Rooney
    Keefe. Yes, you can ‘chip’ the Sony Ericsson W8110 to boost power to its speaker,
    and this constitutes a minor hack, but it is negligible compared to the wider
    patterning of labour and expression through these technologies. Unlike the open
    knowledge and craft of the sound system or the wisdom of pirate radio, YouTube
    music video technologies simply


