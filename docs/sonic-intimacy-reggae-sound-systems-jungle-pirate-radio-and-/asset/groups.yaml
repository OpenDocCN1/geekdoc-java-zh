    # 雷鬼音响系统与氛围


    Pryce 所讨论的“派对”是一种舞蹈会，通常是指安装了一个或多个音响系统的私人住宅。它们在 20 世纪 60 年代和 70 年代的英国城市非常流行。Pryce
    描述的布里斯托尔活动是一场雷鬼蓝鲁斯，由当地英国加勒比社区的人们参加，也有少数白人男女出席。


    Pryce 写道，在那种“好的蓝鲁斯”中，通常有 100 到 200 人紧挤在一个单层公寓里。音乐的音量大到让人无法交流，因此大多数交流是通过身体完成的。这表现为舞蹈动作，也表现为对拥挤空间的日常博弈：


    “我们敲门并让进，结果却变成了一个稠密、沸腾、汗流淋漓的人类潮的一部分。一团由烟草烟和水气组成的蓝色不透明云雾在我们头顶上方漂浮。汗水和体味与大麻烟的甜味草药味以及啤酒的刺鼻味交织在一起：一种令人窒息的酸味弥漫在整个氛围中。我们在拥挤的过道里保持不动，所有人都在试图挤进去。黑人和白人正试图逃到正在跳舞的最近房间，但那个房间也满了。这不可能的，我们既无法后退也无法向前……我从过道里涌入的人群中抽出身，逃到其中一个播放音乐的房间，那里同样拥挤。我环顾四周。两个挤满人的房间相通。在其中一个房间里，只有一个音响或扬声器。这里的氛围更轻松，光线更明亮。动作更多。人们随着音乐节奏地跳舞。成对的人分开跳，在跳雷鬼时向前向后挥手。”（Pryce
    1986: 100–1）


    Pryce 捕捉到了蓝鲁斯的氛围，概述了其人类、声音和技术上的关系——邻近的身体、私密的空间、扬声器、声音和空气。人们擦肩而过、共同起舞、音量、节奏和技术的差异构成了这种氛围。


    Lez Henry 补充指出，氛围的动态关系也通过视觉符号和声音来识别。在回忆一次 Ghettitone 和 Frontline 音响系统的冲突时，Henry
    描述了将 Ghettitone 的四声道扬声器箱（4 × 18 英寸低音器）搬进现场的兴奋，期待着低音的声音和感觉，结果面对的是 Frontline 的七个四声道箱，它们将压倒那个较小的系统。Henry
    说，仅仅是看到这些充满期待的箱子，更不用说“体验它们震天动地的特性”了（Henry 2006: 170）。


    在半光影下，扬声器堆、移动的身体和错综复杂的线路是系统氛围的重要组成部分，但它们次于声音。在 Brighton Jamm 的一次 Channel One 现场中，可以看到
    Mikey Dread，他被一盏同时也照亮唱片机的灯微弱地照明着。这是一个小的奇观，人们面向他、Garvey、H.M.（海莱·塞拉斯）和加勒比三色旗，尽管他们也在心中与人们交流。随着声音在空间中移动，视觉过度刺激的大脑放松下来，低音、音调和歌词接管了一切。就像巨大扬声器堆上方微小的红色
    LED 指示器一样，视觉变得极简、如此毫无修饰，以至于在空气重量和身体震动感中变成了一种微弱的压力。


    音响系统的氛围主要是声音的，而其中最重要的部分是低音。低音“产生了一种氛围……能量流经低音流动，”Shaka 说道（Arte Vast n.d.）。虽然将低音与鼓分开是不现实的——低音提供了律动，鼓插入了节奏感——但核心是低音。它们被低音维持。但低音中有一种处于上升趋势的低音。没有低音，鼓就无法存在。它们是基石，被鼓增强，规划了它们的节奏，并在没有它们的情况下毫无章。来自
    Boom 的 Russ Disciples 解释道：


    “雷鬼是以低音为主的音乐。旋律在它的低音线条中——低音线条作为支撑——所以我们看到音响系统、大扬声器和功率放大器，我们用力推动这些设备让人们感受到。”（Russ
    Disciples 接受 Folke and Weslien 2008）


    更大的声音可能会运行二十个低音箱，有时采用双路或四路配置，产生 10,000 瓦的单向低频。这种单向效应通过设置在舞池前后的四角或三角形布局的扬声器堆达到最大化。这与欧洲音乐会的消费模式不同，后者的声音比前面大。这种音响系统在社交和声音上都不是提升的。事实上，它与听任何其他形式的声音重放——耳机、家庭音响、电脑或手机扬声器——完全不同。


    低音箱传递的波形非常缓慢，以耳朵无法完全捕捉，而是通过身体捕捉。它与身体紧密接触，在身体内部移动，震动你的胸腔、鼻毛和内脏。“它将音乐声音的问题变成了音乐之外的震动和耳外感知”（Jasen
    2016: 3）。在这里，震动就是‘氛围’（Henriques 2008: 221）。Lover’s rock 歌手 Sylvia Tella 回忆道：“坐在扬声器前，看到他们的身体晃动，我想体验那种感觉，让我感受到低音。”（Marre
    2011）。


