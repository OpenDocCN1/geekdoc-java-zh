    # GRIME AND YOUTUBE MUSIC VIDEOS


    lo-fi sound (Charles 2018: 7). Whereas ‘hi-fi’ denotes a listening experience
    that replicates, often through expensive technology, the mythical clarity of real
    and physical music, lo-fi is a listening experience characterized by distortion.


    Grime''s lo-fi sound is partly accounted for by the DIY technology used to make
    many of the early instrumentals – cracked versions of FruityLoops, Mario Paint
    for the SNES and Music 2000 for the PlayStation (used by Skepta, So Solid Crew
    and Dizzee Rascal) (Hancox 2015b; 2018: 61). Far from constituting a problem,
    in grime, the lo-fi sounds produced these technologies are culturally appropriate
    to the sound culture''s wider stretch of feeling. As grime journalist Prancehall/John
    McDonnell notes, ‘a lot of the early grime was actually quite bad production.
    I liked that’ (Prancehall/John McDonnell cited in Collins and Rose 2016: 37).


    This lo-fi sound is exacerbated by the YouTube ecology. As noted, early YouTube
    strips often used backing instrumentals played from mobile phones, with the MCs
    lyrical performance video-recorded back into another mobile phone for upload to
    YouTube (Upcoming Movement 2010). The final audio playback stripped the original
    lo-fi instrumental of any remaining bass, further reducing definition and increasing
    the levels of distortion. In cases, the original instrumental was only vaguely
    recognized in the final audio through its tinny rhythm and distorted mid and treble.


    Video content goes through a similar process. Third-generation mobile phones’
    poor quality resolution handling of light create dark and grainy pictures, while
    the YouTube platform limits resolution (and length) through its 100MB limit (Gannes
    2009).¹⁵


    # Treble and lyricism


    The lo-fi sonic genre of YouTube music videos strips the bass from music videos,
    emphasizing the treble. In the previous two chapters we have attended to the special
    importance of bass to black diasporic music. We find this at its most instructive
