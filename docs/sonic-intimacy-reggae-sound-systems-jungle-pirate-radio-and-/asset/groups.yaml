    # THE REGGAE SOUND SYSTEM AND VIBE


    kind Pryce discussing, was a dance, generally a private home with one or more
    sound systems rigged up. They were popular in British cities throughout the 1960s
    and 1970s. The Bristolian occasion described by Pryce was a reggae blues attended
    by people from the local British Caribbean community, with smaller numbers of
    white men and women present.


    Pryce writes in a ''good blues'' there were usually 100 to 200 people tightly
    crammed into a single-floor flat. The music''s volume made conversation impossible,
    so most communication was done through the body. This took the form of dance moves,
    but also the routine negotiation of the crowded space:


    "We ring the bell and let in, only to become part of a dense, teeming, sweaty
    mass of humanity. A bluish opaque cloud of tobacco smoke and vapour floats above
    our heads. Perspiration and body odours mingle with the sweet, herbal smell of
    ganja smoke and the pungent smell of beer: a crippling acridity pervades the whole
    atmosphere. Inside remain motionless in the crowded passage, trying all to push
    our way in. Blacks and whites are trying to escape to the nearest room where the
    dancing is taking place, but that room is just packed. It is impossible, we cannot
    move backward or forward ... I pull myself from the incoming crowd in the passage
    and escape to one of the rooms where the music is playing, equally crowded I looked
    around me. The two rooms packed with people opened into each other. In one of
    the rooms, there was only one sound- or speaker. Here the atmosphere was lighter
    and the light brighter. There was more movement. The people were dancing rhythmically
    to the music. Pairs of people dance apart, thrusting their hands forward and backward
    as they do the reggae." (Pryce 1986: 100–1)


    Pryce captures the vibe of the blues outlining its human, sonic and technological
    relations – the proximate bodies, the intimate space, the speakers, the sound
    and the air. People pushing past each other, dancing together, variances in volume,
    rhythm and technology constitute the atmosphere.


    Lez Henry expands noting how the dynamic relations of the vibe are also identified
    through visual symbols and sound. Recalling a Ghettitone and Frontline sound system
    clash, Henry describes the exciting of hauling Ghettitone''s quad speaker box
    (4 × 18 inch woofers) into the venue, anticipating the sound and feeling of bass,
    only to be confronted with Frontline''s seven quad boxes which were to overpower
    the smaller system. The mere sight of these boxes, says Henry, filled with anticipation,
    let alone the ‘experience of their earth-shaking qualities’ (Henry 2006: 170).


    The sights of speaker stacks, moving bodies and webs of wires in the half-light
    are then important components of the system''s vibe, but they are also secondary
    to sound. In a Channel One session at Brighton Jamm, Mikey Dread is visible, faintly
    illuminated by a lamp that also lights the turntable. A minor spectacle, people
    turn to face him, record, Garvey, H.M. (Haile Selassie) and the Jamaican tricolor,
    although also turning to engage the people in their minds. As sound moves through
    the space, visually over-stimulated minds relax and the bass, tones and lyrics
    take over. Like the tiny red LED indicator atop the enormous speaker stack, the
    visual becomes minimal, so unadorned, that it is a faint pressure amid the weight
    of the air and the vibration on the body.


    The vibe of the sound system is predominantly sonic and the most significant component
    of that is bass. Bass ‘causes a vibe ... energy flows through the bass’, says
    Shaka (Arte Vast n.d.). Although it is not plausible to separate the bass from
    the drums – the bass provides the roll, the drums insert the groove – it is the
    bass. They are sustained by it. But the bass has a bass that is always in ascendance.
    The drums cannot exist without the bass. They are the bedrock, enhanced by the
    drums, patterning their rhythms and relentless without them. Russ Disciples from
    Boom-shaka-laack explains:


    "Reggae is a bass dominant music. The melody is in its bass line – bass line is
    there as an underpinning – So we see our sound systems, our big speakers and massive
    amps and we push these things hard to make people feel it." (Russ Disciples interviewed
    in Folke and Weslien 2008)


    Larger sounds might run twenty bass bins, sometimes in double or quad configurations
    producing 10,000watts of unidirectional low end. This unidirectional effect is
    maximized by the configuration of the speaker stacks set up at the front and back
    of the dance floor in either quad or triangular formation.¹⁶ This is distinct
    from European concert consumption where sound is louder at the front than at the
    back. This sound system is not socially and sonically elevated. In fact, it is
    very different from listening to any other form of sound reproduction – headphones,
    home stereo, computer or mobile phone speaker, etc.


    The waveform delivered by the bass bins is so slow that it''s not fully picked
    up by the ears, but by the body. It is intimate with the body, moving within it,
    shaking your chest, your nose hairs and your internal organs. ''It turns questions
    of musical sound to matters of extra-musical vibration and extra-cochlear perception''(Jasen
    2016: 3). Here, vibration is‘vibe’ (Henriques 2008: 221). Lover’s rock singer,
    Sylvia Tella, recalls, ‘I would be sitting in front of a speaker and you see their
    bodies going drvvvvvvv and I wanted to experience that so I would feel the bass’
    (Marre 2011).


