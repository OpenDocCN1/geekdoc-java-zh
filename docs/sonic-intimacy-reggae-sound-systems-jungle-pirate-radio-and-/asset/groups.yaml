    # Hype


    Listening to pirate phone in sessions like this, I felt like there was a feedback
    loop of ever exaltation switching back and forth between the station and ‘ardcore
    ‘massive’ at home. (Reynolds 2008: 234)


    Hype flows through the ether. Hype is presence, felt as a connective closeness,
    it is the affective modulation of jungle world, and it is wholeness, a junglist
    disposition deeply and commonly held.


    Hype moves in waves, heightening and diminishing through a multitude of interactions
    in the sonic, social and technological ecology. Hype is composed of many strands.
    It is comprised of the buzzes of different activities and emotional states. It
    is generated through technicians’ search for transmission sites, climbing onto
    roofs and the night, the risk and anticipation of broadcast; waiting all day,
    turning to night, invested in the expectation of the future energies of the city.
    Hype is that ‘something extra’ or ‘edge’ that arises from those states (DJ Brock
    interviewed in Trooper 1996: 3.40 mins; King Yoof quoted in JamieS23 2014).¹


