    # 声音的亲密性


    在这种简单且经常听到的呼唤中，丛林非法广播电台（jungle pirate）定义并号唤了集体，让他们在宏大的群体中定位自我——将城市从地方性认同转变为一种由发射器广播半径定义的都市文化。这些都市存在感通过电话热线以及对大都市各个小组、区域和选民的无线电呼唤得到了加强和维持。听众们守在电话旁，等待捕捉自己电台的号码，“紧紧握着”等待即将到来的对他们驾车/狂欢/卧室/唱片店/当地群体的呼喊，与此同时，听到其他大群的名字像被飞速吐出的
    A 到 Z 字母表一样接连而出。


    Hertford, Bounds Green, Total Music, Dulwich Massive。城那个区域的信号极好。Stratford massive,
    Ilford massive。在东部接收得很好。Leyton, Tottenham, Ladbroke Grove, Hackney, Clapton, Brixton。向整个首都市地区所有的驾车族群体点赞。Kool
    FM 是一家人。（选自 Marley Marl and Kool FM 1995: 34 mins）


    为 Antony 和 Amy 点赞。为 Nicky 点赞，不要忘记 Danny。为 Charlie 点赞。为 Louise 点赞。为 Henden massive
    点赞。为 Porsche, Denver, Isla 以及 Camden massive 点赞。（选自 DJ Zinc and MC Rage on Eruption
    FM 1995: 11 mins）


    这些呼喊是杂乱且容易出错的；不完美，充满了结结、含哝和背景噪音；声音有时在音乐声中若约可闻。这产生了一种存在感。通过肯定日常关系中杂乱的口语，它让听众打开了电台也打开了彼此。这并不是
    BBC 那种脱离体的统一声音（Loviglio 2005: xix）。这些 MC 和 DJ 都是像你一样的人。这是一种“一种真实的互动，而且是有价值的”（JME
    on SBTV and All 4 2017: 20.14 mins）。


    丛林非法广播电台的亲密存在感并非为公众而设计的。规制电台面临的困境在于如何在向某人耳边低语的同时为大众找到语调，但这对于 Dream FM 及其类似的电台来说并不是困境¹⁰。“我一直觉得自己是成千上万听众之一，”Dream
    FM 的粉丝 Finch 解释道，“这是一种与所有陌生人之间的包容感和连接感”（Finch 引用自 Hancock 2011）。


    丛林非法广播电台的存在既属于群体也属于城市，但它同时也是私人且私密的。毕竟，丛林非法广播电台仍然渗透了家庭的（亲密）空间，将音乐带入人们的卧室和生活，将 MC
    和 DJ 与他们的观众亲密地连接在一起。这些 Fize 和 Swifflee（在 Dream FM 上）真的将硬核和狂欢音乐带入了我的卧室和我的生活。我不知道是怎么回事，也许是他们的风格，或者是他们播放的音乐，但它和我产生了共鸣。（Michael
    Finch in Jackson 2011: 9 mins 58 secs）


    这种亲密感与规制电台截然不同¹¹它是私密且个人的，但它并不是那些分布在父母家中、永不停止的小盒子收音机所那种被动的弥漫性冲刷。丛林非法广播电台是一种主动的体验。对于“在卧室里准备出门的女孩们”来说，因为无法出门而听广播，或者在清晨切换回电台来度过幻觉期（come
    down），丛林非法广播电台与她们的生活有着动态的关系。事实上，它甚至很难被被动地聆听。它对注意的要求使得从背景到前景的漂移变得越来越稀少。丛林非法广播电台从未完全同化到家庭或城市的主听体系中。它的震动从未闲置，且往往令人陶醉。


    向那些在卧室里的女孩们点赞！（Rush et al. 1993: 43 mins）


    # 丛林人知识（Junglist knowledge）


    20 世纪 90 年代中期的一个夏夜，MC Top Cat 提醒我们，“如果你不去丛林学院，你就无法获得丛林人知识”。丛林人知识是一种亲密的知识；一种内部人的身份和姿态，“硬核地步入
    90 年代”（DJ Zinc and MC Rage on 1995: 13 mins）。它是通过对糟糕工作、城市、低质议会住房和租房、保守党执政时期英国低迷终点的共同经历，以及对警察和权威的忽视……以及狂欢活动锻就的。


    丛林非法广播电台与城市同步收集并通过声音传播了这种知识。这种知识是一种多元的智慧。从 Harlesden 的雷鬼氛围和 Isle of Dogs 的硬核音乐，到
    Hertfordshire 和 Stevenage 中心地带的美式风情和嘻哈，“许多音乐构成了丛林”，也有许多人（如此（选自 Marley Marl and
    Footlose 1995: 26 mins）。丛林非法广播电台是城市的一种印象派面具；是对英国地下异质性的肯定，而非岛屿国家的财产。


    ¹⁰ 有关于规制电台的讨论，参见 Crisell 1994: 4。

    ¹¹ 有关于规制电台与私密生活亲密的讨论，参见 Dyson 1994: 179; Loviglio 2005。


