    # 结论


    这种资产阶级资本主义的论点，但关键在于，它是基于“白人性”的条款进行的。白人性的构筑并非空谈。它将正统的工人阶级对资产阶级资本主义的批判转化为一个种族问题，而没有发展出对种族主义的批判。也就是说，将工人阶级构筑为白人产生了一种对社会经济不公的批判，但并未将同样的视角延伸到种族主义。白人性不是一个反动的类别，也不是一个批判性的。与种族不同，白人性并非在权力的批判性关系中传递，而是诉求一种人类统治的关键模式——即白人至上主义。这种主张是防御性和身份认同。它围绕阶级流失进行的身份性防御，被解释为在多族社会以及非白人、或白人不够多（以东欧人为例）的移民手中遭受的损失（James
    2014b; James and Valluan 2018）。白人性被价值化为归属感、国家以及对那些难以获得的资源的权利。针对白人工人阶级的左翼学术，与其说是阶级对抗资本的防御，不如说是对那些在种族上不那么值得的人提出的反动身份认同主张（Valluan
    2019）。对白人性的身份认同主张而非阶级批判才是问题的核心，这解释了该论点显而易见的不一致性。在基于白人的工人阶级的方法中，白人性并非阶级分析的缓解剂，而是其驱动力。对白人性的诉求将对阶级的批判性分析贬低为反动种族主义主张的智力装饰。


    反种族主义学术经常指责这种版本的左翼，因为它对种族支配的断言是如此显而易见。通过这种方式，它将“作为白人的工人阶级”这一论点与跨越西方和欧洲的更具进攻性的白人至上主义、民族主义和权威主义形式联系起来。虽然它揭穿了这些神话，将其定位在更广泛的历史统治项目中，但它也采取了类似的认识论术语。也就是说，它对种族主义的批判有时基于对反对种族暴力的更紧密、更真实的身份认同主张，而这往往是在种族支配本身建立的领土上。这种做法有不同的名称。它有时被称为“战略本质主义”，但也被称为“危险的束缚”（Spivak
    2008: 260; Gunaratnam 2003: 28–9）。战略本质主义在于定义和保护人们的历史、文化和宇宙观，以抵抗殖民和种族主义的抹除，并基于这些资源发起反抗。在这里，结构、权力、身份和生成被富有成效地处于紧张关系中。危险的束缚警告了，身份认同策略如何从批判性防御和行动的立场滑向一个由种族主义和殖民主义设定本质主义秩序，并使其成为少数群体的秩序——这种正是“民族国家霸权在逻辑上可以理解且在本体上令人满意”的抵抗（Valluan
    2019: 47）。当结构、权力、身份、生成与行动之间的战略紧张关系滑向对身份认同立场的更严的防御时，这些立场就变成了目的本身，而非批判性反抗的“战略”手段。那些拒绝种族主义紧缩资本主义的防御性立场，随之顺从了它设定的条款。


    社交媒体以特别的方式强化了这种格局，将反种族主义的言论从其社会语境中剥离，并开启了霸权媒体的广泛趋势。在英国，美国的政治立场变得越来越有力，并相应地统治了反种族主义辩论的基调。通过这种方式，更有根据的对话的微妙差别和渗透性通过反应性的
    Twitter 内容被提炼和炒作（Seymour 2019; Titley 2019）。在那里，有效的主张和反主张通过放大沉积的立场赢得，并由崇拜式的名人动员提供支持。我们转瞬即逝的注意力不断被抓人的诉苦和不公展示所捕捉。


    在那里，集体反种族主义主张的影响仅仅是过度投入的数字人格。这种政治行动不再具有手段或愿望揭示其关注的对象——种族主义。它不再具有形成批判性反种族结社的能力。


    反种族主义学术经常指责这种版本的左翼，因为它所断言的种族支配是如此显而易见。通过这种方式，它将“作为白人的工人阶级”这一论点与跨越西方和欧洲的更具进攻性的白人至上主义、民族主义和权威主义形式联系起来。虽然它揭穿了这些神话，将其定位在更广泛的历史统治项目中，但它也采取了类似的认识论术语。也就是说，它对种族主义的批判有时基于对反对种族暴力的更紧密、更真实的身份认同主张，而这往往是在种族支配本身建立的领土上。这种做法有不同的名称。它有时被称为“战略本质主义”，但也被称为“危险的束缚”（Spivak
    2008: 260; Gunaratnam 2003: 28–9）。战略本质主义在于定义和保护人们的历史、文化和宇宙观，以抵抗殖民和种族主义的抹除，并基于这些资源发起反抗。在这里，结构、权力、身份和生成被富有成效地处于紧张关系中。危险的束缚警告了，身份认同策略如何从批判性防御和行动的立场滑向一个由种族主义和殖民主义设定本质主义秩序，并使其成为少数群体的秩序——这种正是“民族国家霸权在逻辑上可以理解且在本体上令人满意”的抵抗（Valluan
    2019: 47）。当结构、权力、身份、生成与行动之间的战略紧张关系滑向对身份认同立场的更严的防御时，这些立场就变成了目的本身，而非批判性反抗的“战略”手段。那些拒绝种族主义紧缩资本主义的防御性立场，随之顺从了它设定的条款。


    社交媒体以特别的方式强化了这种格局，将反种族主义的言论从其社会语境中剥离，并开启了霸权媒体的广泛趋势。在英国，美国的政治立场变得越来越有力，并相应地统治了反种族主义辩论的基调。通过这种方式，更有根据的对话的微妙差别和渗透性通过反应性的
    Twitter 内容被提炼和炒作（Seymour 2019; Titley 2019）。在那里，有效的主张和反主张通过放大沉积的立场赢得，并由崇拜式的名人动员提供支持。我们转瞬即逝的注意力不断被抓人的诉苦和不公展示所捕捉。


