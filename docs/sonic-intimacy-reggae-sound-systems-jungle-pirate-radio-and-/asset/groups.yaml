    # GRIME AND YOUTUBE MUSIC VIDEOS


    In this way, Rooney Keefe – along with A-Plus, Capo, Ratty and Jammer, and Crazy
    Twitch – found himself at the centre of growing grime DVD culture, selling products
    to record stores like Rhythm Division on Roman Road. These DVDs included documentary
    footage of pirate radio and raves like Eskimo Dance, but also included interviews,
    street raps and freestyles (Risky Roach, Practice Hours by A-Plus); clashes and
    battle videos (Lord of the Decks and Lord of the Mics by Capo, Ratty and Jammer);
    and behind-the-scenes footage (DVD with Aim High Volume 2 by A Plus).


    In 2003, Darren Platt launched Channel U on cable TV, renamed Channel AKA in 2009.
    Channel U expanded the reach of grime, influencing the programming of public platforms
    like BK 1xtra and black commercial radio station Choice FM (Riki Bleu Music and
    Promotions Manager, Channel U, 2004–7 cited in Collins and Rose 2016: 53). Now,
    for as little as £100 production cost and a relatively small fee, artists were
    broadcasting their videos nationwide to an audience of millions, with the possibility
    of getting picked up by larger cable channels. Roll Deep’s ‘When I’m ‘Ere’ was
    played every twenty minutes on Channel U finding its way to MTV Base (DJ Target:
    185). Deezzee Ska, Kano, Skepta, Tinchy Stryder, Tinie Tempah and Wiley came to
    prominence through these means (White 2017: 72).


    File sharing was well underway by this point. Napster, LimeWire, Kazaa and MSN
    Messenger had all been launched between 1999 and 2001, and these platforms permitted
    the distribution of garage and early two-step music files between desktop computers
    (Plastician cited in Collins and Rose 2016: 37). That culture was nurtured by
    early Internet forums like the RWD Grime Music Forum, with 50,000 users. As DJ
    Logan Sama, grime was the ‘first genre in the [UK] to be born with the Internet,
    to be spread virally’ (Logan Sama cited in Wiley 2017: 94). Between 2000 and 2008
    these trends, and the draconian Wireless Telegraphy Act 2006,¹ started calling
    time on FM radio stations, causing many to move online. Supplanted by CDs, MP3
    downloads, LimeWire and iTunes, record shops and cutting houses were in their
    final throws. Many Djs had


    > ¹DJ Spooky discusses the implications of the Wireless Telegraphy Act 2006 (Gibbins
    2015).'
