    Through grime YouTube music videos, the aesthetics of griminess remained but the
    felt story of bass was engineered. Digitally weightless grime music videos were
    then aesthetically grymey, but with close affinity to capitalist white mobility.
    With grimeey aesthetics retained and the bass tuned out, treble — a sonic ally
    of mobility — returned in the form of the MC''s voice. These vocals were fiery,
    too faithful to the ‘fuck’ neo-liberal capitalism of the moment. They were expressive
    of the shared depths of agonism and energy between like-minded people. Conveying
    echoes of rage, they provided living resources for alternative mutualisms without
    any other particular demands.


    Seen on the screen, sound''s openness to the city was warped. YouTube music videos
    returned multi-ethnic and convivial sound cultures to registers of race and racism.
    Who best conveyed rage to sonic affect was again visibly of skin colour, of the
    racial coding of rage and energy through the screen. Likewise, the blue light
    of the monitor, the intimate close-to-face interface and the compulsion to click
    re-coloured those sonic mutualisms, altering its properties and the stories it
    conveyed. The coldness of the sonics and the coldness of the screen, and the agonism
    of society and that of social media mixed, turning resources for alternative life
    towards never-satiated activations of pressure.'
