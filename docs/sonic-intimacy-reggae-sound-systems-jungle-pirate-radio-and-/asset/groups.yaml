    # THE REGGAE SOUND SYSTEM AND VIBE


    # Kin and community


    In Bass Culture, Lloyd Bradley writes that the sound system was much more than
    a wall of speaker boxes; it was quite literally ‘the community’s heartbeat’ (Bradley
    2000: 4). While Bradley’s image of the sound system as the community’s heartbeat
    is perhaps not the right metaphor for the relationality I have been outlining
    above – trapped as it is in a hermetic biological image of organs in the body
    – it is a useful point from which to consider the sound system as intimate, in
    the context detailed above.


    The film Babylon illustrates this well. Babylon follows the daily tribulations
    of a young man called Blue, played by the Aswad Brinsley Forde. Blue is a deej
    with a sound system and the plot follows him as they prepare for a dance. This
    provides the narrative arc to explore cultural production, racism and inter-racial
    friendship in late 1970s London. The same sound system that gets shut off by the
    police in the final dance scene has also entertained at a wedding in a local community
    hall. That is, the reggae sound system is portrayed as at once intimate to family
    events and dances. It has a privileged role in ceremonial accompaniment and in
    politicized soundings.


    The privileged relation of the sound system to black British life is underlined
    by its versioning in the family home, and indeed the most sacred of home spaces
    – the front room. Here, it took the form of the radiogram, and in particular the
    Blaupunkt Blue Spot. The Blue Spot was not a sound system. It was a radiogram.
    nonetheless informed by its larger cousin, a domestic version of it. In the 1950s,
    radiograms were common among English middle-class families. Many featured cabinets,
    making them entertainment hubs – music, drinking and socializing wrapped into
    one. While companies like Grundig and Garrard made popular, Caribbean immigrants
    often bought the Blue Spot because it was louder and had better bass response.
    It better suited listening practices informed by the music and sound system culture
    of the Caribbean.


    Mikey D and Jah Baddis, sound system personnel from Coventry, both describe the
    central importance of this sound technology to the black family home, and the
    recurring preference for this particular model: ‘We had a Blue Spot gram which
    most West Indian people did at the time’ (Mikey D interviewed in Smith and'
  - '[PAGE 48]


    Porter 2010); [the Blue Spot] was played on a Sunday afternoon (Jah Baddis interviewed
    in Smith and Porter 2010).


    The British Caribbean room, in which the Blue Spot sat, was a hybrid of the Caribbean
    and English Edwardian-Victorian front room. The Caribbean front room was already
    a hybrid of colonial Victorian and African diasmatic aesthetics (Hall 2009). In
    Britain, its particular arrangement marked status and belonging in the UK, as
    addressed by Vincentian author Michael McMillan:


    You weren''t allowed in this room unless there were guests, it''s Sunday, Jim
    Reeves''s ''The Distant Drums'' is blaring out of the ''Bluespot'' radiogram and
    big people are chatting news from back home. Mum is drinking Beckham. I pass the
    pineapple ice bucket and listen quiet as a lamb, my skin sticking to the plastic
    covering the PVC imitation leather. I smell rice and the paraffin heater competing
    with the drink''s cabinet filled with glasses that are never used. I touched the
    painted glass fish and plastic flowers on fanciful-stitched crochet on a gold-rimmed
    fake marble coffee table. A blue-eyed Jesus looks at me from The Last Supper on
    floral wallpaper saying ''cleanliness is next to godliness''. The front room looked
    so good, that it didn''t matter how poor we were, we were decent people. Growing
    up, this room echoed the proverb, ''By the sweat of your brow, you will eat bread''
    haunted me like nails scratching a blackboard. I know now that it is part of who
    I am and unconsciously I recreate a similar shrine in my own home today. (McMillan
    2005)


    The image McMillan paints is of a sensory space, filled with visual symbolism,
    deeply personal, deeply intimate to how his family were and who he is. Post-war
    American popular music is opening onto black British sounds, and in the midst
    is the Blue Spot radiogram – an image of a sound system focusing and chelling
    black family life.


