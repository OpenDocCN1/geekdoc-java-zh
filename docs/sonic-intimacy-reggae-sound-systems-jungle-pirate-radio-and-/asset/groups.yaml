    experience it, I find it hard to explain. It is the excitement: are they coming
    tonight or not? (Frank, 43, cited in van der Hoeven 2012: 932)


    Jungle pirate radio hype is crystallized not in the moment that the bass bins
    warm after 2 hours of set up in a static buzz – white noise. The white noise collects
    the labour, the anticipation, the emotion, as it also sends it out to the city.
    The white noise is the first interface of public flavour.


    There was nothing better than getting up there, plugging everything in and hearing
    that ‘shhhh – that white noise. It’s always an amazing feeling. (Eastman cited
    in Clifton 2015)


    Hype is generated through the DJ’s experience, the excitement of being called
    into play, feeling like you ‘just won the FA cup’, getting ready to play, going
    to the stations, hiding your records, covert, and then getting on the decks, and
    playing all that back to the city (DJ Target 2018: 34–5)


    Back in the dance hype is ferocious and funky in equal measure. It’s a ‘warrior
    stance’ charged with ‘militant euphoria’ (Reynolds 2008: 239); it’s ‘exuberance
    without the gaiety, pleasure without the grins’ (Belle-Fortune 2004: 94). That
    hype is fractured, explosive, deep and guttural, swinging, strunting, momentary
    highs and dirty lows. There the Roland 808 digitized by Rebirth¹⁷ and the manipulation
    of the Akai S1000 wave keeps the hype down below the bottom-end of Studio One
    – huge and booming, window rattling ‘rumblizm’ (pers. comm. Misinformation; DJ
    Nicky Blackmarket quoted in Reynolds 2008: 243); reggae’s rebel remade as frantic
    drummer, speed and shapes, heating up the funk and burning out its warmth (Reynolds
    2008: 241).¹⁸


    After a night out, hype is feeling in, phone-ins, feeling the rave in the living
    room. The rush from the bass of a stereo that doesn’t have bass. Your body recalling
    the dance through aural signals that are no longer registered on the surface of
    the skin. The skin prickles, hairs on end with the memory of sensation, intimation
