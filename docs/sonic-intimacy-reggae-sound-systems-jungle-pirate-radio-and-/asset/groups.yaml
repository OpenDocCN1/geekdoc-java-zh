    impermanence laced dialogically through the rave, the radio, bedrooms and cars.
    Hype operated at speeds and rhythms beyond that moment''s bourgeois capitalist
    myopia, providing for different imaginations of life, without actually proposing
    any.


    Hype was not the authoritative garner of the masses. Rather, it was predicated
    on co-production, through the call and response of the rave and the radio, and
    even the co-production of the technology as you wandered around the living room
    in hand. Hype was horizontal, a sense of political belonging of shared labour
    and a far cry from the increasingly hollowed-out democracies of that post-war
    period. Hype was not anodyne either, but immediate. Hype''s immediacy demanded
    attention and investment that was wholesale and deep, but also precarious as the
    working-class city in which many ravered.


    Jungle pirate radio''s social intimacies of community and service extended from
    the pirate crews, to the neighbourhood and through the listeners, into the city
    and back. They provided systems of pleasure and support that mitigated the social
    atomization of the time. They were not the familial forms of reggae sound system,
    rather were part of fragmenting social affinities and institutions that continued
    to provide alternative networks of mutuality and identification.


    These different scales of social and spatial intimacy were grounded in the materiality
    of the rave. As the reggae sound system, jungle pirate radio was physically consecrated
    in dance. Its alternative cultural politics are otherwise unimaginable. Through
    pirate radio, the rave was extended across the city, connecting the otherwise
    disconnected late modern micro-environments of bedrooms and cars. Spilling out
    from the rave, the sonic transmissions of the radio then created a tangible multitude
    with shared practices, habits and ethics that attained a feeling of wholeness
    on a city scale, working around the otherwise visual racisms and confines of daily
    life.


    The multi-ethnic make-up of the city and the diasporic formation of the sound
    constituted a culture in which racial affinity and the racial ownership became
    estranged. Jungle remained a black diasporic music culture, but one that was composed
    and for the multi-ethnic city, in which indifference to difference was routine;
    where ethnic and cultural difference could be habitually lived and acknowledged
    but not always determining.


    ## JUNGLE PIRATE RADIO AND HYPE 79


    The sonic condition of jungle pirate radio allowed for contingent diasporic and
    heterogeneous wisdom within a black dance music format to circulate. These were
    alternative to the dominant composition of racial modernity vis-à-vis black criminality
    and Island Englishness of the time. Through the sounds of jungle pirate radio,
    multiple marginal and popular knowledges travelled, at the same time as racial
    identification, self-curation and celebrity culture was frustrated.


    This was patriarchal. Certainly, there were many female ravers and pirate radio
    fans, but at the same time its principal producers, practices and narratives were
    masculine (with the notable exceptions of DJ Rap, Kemistry and Storm). The culture
    as a whole – the risky heroics of the transmission sites, the cat and mouse territories
    of the city, control of technology and airways, the steely warmth of the dance
    floor and, not least, the popular cultural references were all orientated to men,
    even if these were generally not sexually aggressive spaces.


    Jungle pirate radio sustained intimacies in time, at odds with the normative prescription
    of the city. Its illegal condition, autonomous economic infrastructure and residues
    of craft allowed for expressions outside of corporate and state production rhythms.
    In jungle pirate radio, sonic expression existed as a way of life, not as a commodity,
    although property and personal brand was not far away. It was not a code for a
    different society. Jungle pirate radio was too synchronous with the capitalist
    mobilities of the moment for that to be the case. The ethos of craft and the longue
    durée of dub was after after all by consumer objects and communication speeds.
    But we don’t need to demand that of jungle pirate radio either. It is enough that
    it was an alternative.


    ## 4

    ### Grime and YouTube music videos


    It''s 2008. New Labour is burning out and the aspirational sloganeering they specialize
    in is bleeding into Tory austerity dogma. YouTube has recently been purchased
    by Google and the platform has expanded rapidly, becoming popular with young people
    and surpassing television the most engaged with televisual medium for that generation
    (BBC 2019). Thousands of professional and amateur grime and rap videos are being
    uploaded, and YouTube channels like SBTV, LinkUp TV and Grime Daily are offering
    regular content. One of the first videos to make an impact in this format is Giggs’
    ‘Talkin’ the Hardest’ (Giggs 2009). Shot at chest height with a third-generation
    mobile phone camera, it is played back through countless computer screens and
    tinny speakers, quickly accruing tens of thousands of views.


    ‘Talkin’ the Hardest is emblematic of that moment, but its YouTube mediation never
    sat well with grime’s own mythology of council estates, record stores and pirate
    radio. The authenticity of the street seemed anathema to the everywhere-but-nowhere
    detachment of Web 2.0. Indeed, grime’s archivists pay only fleeting attention.
    But, as this chapter will show, grime did embrace YouTube and that embrace was
    as significant as the other sound cultures discussed in this book. As with reggae
    sound systems and jungle pirate radio, grime YouTube music videos tell a story
    of a moment in the transformation of black diasporic sound culture in Britain,
    one


    ## SONIC INTIMACY


    in which autonomous infrastructures are absorbed by capitalist imperatives, treble
    supplants bass, hyperlocal presence is embedded, social media becomes the centre
    and the screen starts to sing.


    ## Risky Roadz to SBTV


    Black diasporic music videos were well established before the advent of YouTube.
    From the 1980s, home video technologies found their way into sites of everyday
    leisure, including jungle raves and reggae dancealls fans documented musical memories
    for home viewing or commercial ‘VHS tape packs’. Crime’s first wave of producers
    and MCs were weaned on these offerings. DJ Target and friends watched Jamaican
    dancehall videos at Flowdan’s parents’ house in Limehouse, East London. ‘My house
    was the arena for watching sound system classes’, Flowdan recalls, ‘my parents
    had a load of videos and we to watch them again and again’ (Flowdan cited in Wiley
    2017: 52).


    Early grime music followed in these footsteps. By 2005, the Sanctuary in Milton
    Keynes was less well known for its Dreamscape and Jungle Mania than it was for
    garage/twostep/grime Sidewinder nights. The Sidewinder CD packs featuring the
    likes of Roll Deep with MCs Wiley, Flowdan, Kano, JME, Riko, Skepta and others
    – names that became synonymous with grime. These packs were the stuff of legend
    and were consumed by those who were by too young to attend.


    As CD and DVD packs flew out of record stores, MTV kept a steady stream of US
    rap and hip hop videos flowing into family homes. These hip hop videos – including
    music videos, behind-the-scenes videos, interviews and freestyles inspired grime’s
    DVD pioneers like Rooney ‘Risky Roadz’ Keefe.


    There were a few DVDs at the time, Lord of the Decks and the Conflict pack, but
    but wasn that showed the scene as a whole ... So, I asked to Sparkie, let’s start
    a DVD. I asked my nan to lend money for a camera, and the rest is history. (Rooney
    Keefe cited in DJ Target 2018: 145)


    ## GRIME AND YOUTUBE MUSIC VIDEOS


    In this way, Rooney Keefe – along with A-Plus, Capo, Ratty and Jammer, and Crazy
    Twitch – found himself at the centre of growing grime DVD culture, selling products
    to record stores like Rhythm Division on Roman Road. These DVDs included documentary
    footage of pirate radio and raves like Eskimo Dance, but also included interviews,
    street raps and freestyles (Risky Roach, Practice Hours by A-Plus); clashes and
    battle videos (Lord of the Decks and Lord of the Mics by Capo, Ratty and Jammer);
    and behind-the-scenes footage (DVD with Aim High Volume 2 by A Plus).


    In 2003, Darren Platt launched Channel U on cable, renamed AKA in 2009. Channel
    U expanded the reach of grime, influencing the programming of public platforms
    like 1xtra and black radio station Choice FM (Riki Bleu Music and Promotions Manager,
    Channel U, 2004–7 cited in Collins and Rose 2016: 53). Now, for as little as £100
    production cost and a relatively small fee, artists were broadcasting their videos
    nationwide to an audience of millions, with the possibility of getting picked
    up by larger channels. Roll Deep’s ‘When I’m ‘Ere’ was played every twenty minutes
    on Channel U finding its way to MTV Base (DJ Target: 185). Deezezee Ska, Kano,
    Skepta, Tinchy Stryder, Tinie Tempah and Wiley came to prominence through these
    means (White 2017: 72).


    File sharing was well underway by this point. Napster, LimeWire, Kazaa and MSN
    Messenger had all been launched between 1999 and 2001, and these platforms permitted
    the distribution of garage and early two-step music files between desktop computers
    (Plastician cited in Collins and Rose2016: 37). That culture was nurtured by early
    Internet forums like the RWD Grime Music Forum, with 50,000 users. As DJ Logan
    Sama, grime was the ‘first genre in the [UK] to be born with the Internet, to
    be spread virally’ (Logan Sama cited in Wiley 2017: 94). Between 2000 and 2008
    these trends, and the draconian Wireless Telegraphy Act 2006,¹ started calling
    time on FM radio stations, causing many to move online. Supplanted by CDs, MP3
    downloads, LimeWire and iTunes, record shops and cutting houses were in their
    final throws. Many Djs had


    > ¹DJ Spooky discusses the implications of the Wireless Telegraphy Act 2006 (Gibbins
    2015).

