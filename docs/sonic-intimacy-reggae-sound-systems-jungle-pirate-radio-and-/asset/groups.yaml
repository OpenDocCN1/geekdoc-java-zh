    YouTube 音乐视频。本章最后探讨了 YouTube 屏幕和网络平台对格莱（grime）声音亲密性（sonic intimacies）的影响，并关注了屏幕上种族的可读性，以及界面本身引发的随之情感转变。


    每一章都评估了对于黑裔散居声音文化以及更广泛的社会而言，声音亲密性的转型关乎什么。全书的结论部分整合了声音文化与种族和后殖民研究领域中标准左翼批判模式之间的关系分析。这种论辩明确了开启并维持关于对于主导性种族资本主义之外的替代性文化政治的存在与潜力的问题的重要性。结论的后半部分探讨了书中探讨的声音亲密性转变所关乎的问题。具体而言，它考虑了关系、工艺、伟大的时刻与智慧、有限性与互惠以及完整性，是如何以及未来可能如何继续在没有保障的情况下成为重要的声音文化形式，并成为那些关注声音文化如何维持人类生活替代性（而非被主导性种族资本主义重新编写）的人的用用切入点。


    # 2

    # 雷鬼音响系统与氛围


    ### 引言


    1981 年，NME* 杂志承担了一项几乎不可能完成的任务：对英国雷鬼音响系统（sound systems）进行分类。他们的名单包含了一百个位于伦敦的音响系统，以及全国其他地区的三十多个系统，而其中只有一部分在当时是活跃的（NME
    1981a）。这种简单的列举行为说明了雷鬼音响系统在那个时刻的社会意义。尽管这份清单遗漏了许多较小的系统，但它表明，英国各地的音响系统文化正处于鼎时期。


    今天，我们反思这一时刻的意义。尽管当时对于英国音响系统对社会政治生活的影响存在一些争议，但现在，无论是通过声音制作、声音技术、声音文化、音乐，还是从英国种族政治的角度来看，不可否认，音响系统深刻地影响了我们倾听、制作乃至*存在*的方式。音响系统从根本上改变了英国与其自身的关系。音响系统在流行文化、地下音乐、反种族主义活动和街头抗议中回响，产生了一种超越当时种族主义国家的需求。其核心是低音、回回声（dub）的广阔感以及舞厅的深层共存。本章的论点是，这些回响涉及*声音亲密性*。


    考虑以下来自 Channel One 音响系统 Mikey Dread 的引言：


    我可以从现在一直到明天早上和你谈论音响系统，但你必须去*感受*音响系统才能知道它是怎么的。（Mikey Dread 在 Folke and Weslien
    2008 中接受采访）


    在这里，正如许多其他关于音响系统的评论一样，音响系统是无法言喻的。言语描述显得捉襟从心。Mikey Dread 强调的是你*感受*到的东西。了解音响系统就是感受它。


    虽然狂欢者应该听从 Mikey Dread 的建议，让自己沉浸在音响系统无法言言的特质中，但作者的任务是不同的。Mikey Dread 随后为音响系统学者提出了一个难题——如何描写一种超越语言的事物？如何在文中分析音响系统的“感觉”？


    解决这个问题最有说服力的方法之一是探索低音的触感（Jasen 2016）。在这里，人们认为 Mickey Dread 指的是低音作用在皮肤上的感觉。当他说“你必须感受音响系统才能知道它是怎么的”时，人们认为他在暗示低频声波对人体的触碰。我同意这种分析，但感觉绝不仅于此吧？我们可以说，因为音响系统显然是一个关于肉体压力的问题，它也远不止如此。毕竟，对声音的感觉只有在更广泛的声音文化感受中、对它的知识、对音乐以及对与你同房间的人的感觉中才有意义。换句话说，对音响系统的感受不仅指低音，而且指声音亲密性。


    本章通过重新梳理那些被遗弃或仅被提及的学术评论，探讨了雷鬼和回声（dub）音响系统的声音亲密性。同样地涉及了纪录片、电影和采访。本章大致位于 20 世纪 70
    年代和 80 年代，这一时期正值加勒比和英国黑人对音响系统文化呈现之间的运动，以及在英国长大的当代黑人和工人阶级人对替代性文化政治的发展。我们正在从稳步摇滚（rocksteady）转向雷鬼和回声系统，从像
    Metrobeat¹ 这样较小的系统转向 Jah Shaka、Sufferer Hi Fi、Fatman、Frontline 和 Earthquake 等较大的系统。这是英国音响系统文化的巅峰。¹这些巨大的低音共振高保真设备是一个很大程度上自给自足的黑人音乐文化的中心，该文化由唱片进口商、店主、标签所有、压片厂、拷贝厂和分销商组成（May
    1977a; 1977b; 1977c）。在英国各大城市，工作日的舞会汇变成周末派对。Seven Sisters Road 和 Tolling Park 的社区大厅流向
    Tottenham、Hornsey、Wandssworth、Brixton 和 Acton 的市政厅。Willesden 的 Apollo、Hackney
    的 All Nations、Dalston 的 Four Aces、Deptford 的 Crypt 以及伯明翰，补充了如 Wood Green 的 Bluesville
    这样的酒吧、许多学生会以及无数的家庭、地下室和青年俱乐部的舞会（Gayle 1974; Sullivan 2014: 61）³


    ### 关系


    本章探讨了雷鬼音响系统在那个时刻是如何构成、体验和生活的，以及这对于 20 世纪 70 年代和 80 年代英国的替代性文化政治意味着什么。它通过声音亲密性讲述这个故事；通过其亲密的社会物质关系，通过其亲密的知识，通过其亲近性，通过其氛围的饱满以及通过其深层的感性。但为了考虑这些问题，我们首先需要接触雷鬼和回声音响系统在技术、社会和声音上是如何动态构成的。我们需要承认音响系统技术、社会和声音关系的基础。


    ¹这一时期的音响系统，包括 Duke Vin 和 Count Suckle 的故事，获得了一些关注（Bradley 2000; Melville 2020;
    Salewicz 2012; Vin 2017）。

    ²这是一种主要是男性的声音文化。恋人摇（Lovers'' Rock）是一个性别更混合的雷鬼空间，已被 Beck 和 and 2011 讨论过。

    ³尽管本章的大部分讨论基于伦敦音响系统，但在黑人加勒比社区中也存在一种音响系统文化（Campion 2017; Huxtable 2014; Jones 1988;
    Riley 2014; Veal 2007）。


    在同一份 1981 年 NME 特刊中，Sir Coxone Outternational⁴ 被要求提供其音响系统的技术规格（NME 1981b）。


    | Sir Coxone Outternational 音响系统 – 技术规格 |

    | :--- | :--- |

    | 放大器 | 五台 600 瓦（4 台 600 瓦低音管放大器，2 台 600 瓦高音晶体管放大器）——取决于场地，例如 Brixton 市政厅决定三台管和一台晶体管。
    |

    | 前级 | 带有内置均衡器以覆盖低音、中频。 |

    | 回声单元 | HH |

    | 打击盒 | 特制 |

    | 扬声器 | 平均 19–20 个低音扬声器。高音部分有许多喇叭和小扬声器。 |

    | 线缆 | 几千码。 |

    | 车辆 | 七吨卡车和运货车。 |


    ⁴以传奇的加勒比 Studio One 制作人 Coxone Dodd 命名，并由同名的英国加勒比音响系统先驱 Lloyd Coxone 所有。


