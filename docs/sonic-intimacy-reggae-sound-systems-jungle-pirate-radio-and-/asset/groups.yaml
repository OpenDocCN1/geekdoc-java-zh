    通过这种方式，刘易斯（Lewis）暗示了亲密是如何通过声音和声音技术传递的，同时也暗示了亲密在后殖民动态中是如何被构建的。也就是说，亲密关系对于以流散、诗作（poesis）和运动（游荡，errantry）为特征的社会文化历史存在与归属的运作是内在的（Glissant
    1997: 160）。


    亲密的基础是关系性的。但为了加深我们对亲密这一概念的理解，我们必须详细阐述它的其他特质。关于亲密的大学术著作大多回避了或浅谈了亲密的构成，而非对其进行详述。它们倾向于用亲密来代替效果，或将其作为一个收集私人生活动态的流行术语。这限制了该概念的分析潜力。


    发展一个更深层次的亲密概念需要扩展它的定义特质。亲密的定义特质是：临场、认知、深度和完整。


    对于刘易斯来说，我们看到声音和声音技术的存在与她父亲不稳定的存在之间存在张力。


    > “也许在六岁左右，我仍在用音乐来支撑自己，那或许正是我吸入体内的音乐声音，成为一种在你不确定的存在中我可以依靠的纽带力量。”（Lewis 2012: 143）


    关于亲密*临场*的讨论进一步记录在关于亲密非语言维度的文献中；目光、脸庞和触摸施加的强大魔力（Lorde 1984: 329; Marar 2012; Prager
    1995）。对于列维纳斯（Levinas）来说，他人脸的亲密临场是你理解自己的基础，不是基于你自己的，而是基于关系（Levinas 1989: 75–87）。事实上，这种亲密是如此深刻，以至于你可能因此为他人而死（Levinas
    1998: 2–3）。⁸亲密的临场不仅存在于脸、目光、吻和触摸中，也存在于音乐和声音中。


    > ⁸与其法农（Fanon）和萨特（Sartre）的存在主义作品中目光过度决定了并最终破坏了内部自我不同（在法农那里，这是种族化的他和白人目光）不同，在列维纳斯那里，在关系之前不存在被过度决定的基础自我（Fanon
    1986: xxix; Sartre 1969）。面对临场是前自我的、前认知的，即你不是基于自我来理解他人，列维纳斯将其视为一种暴力、支配、占有和财产的行为，是根据认知者的条款设定的（Levinas
    1998: 8–9）。


    # 引言


    列维纳斯还对“节奏的非人格步态——迷人的、魔幻般的，是否不是艺术对社交性的替代，以及]脸”感兴趣（Levinas 1998: 9）。这意味着狂欢派对（rave）或舞厅（dancehall）的亲密偏好可能足以消除差异并消除人与之间的个人空间。


    亲密涉及认知。事实上，亲密在认知方面的口语用法已早已确立——例如，人们可能对某人或某种情况有亲密的认知。认知（特别是对他人的认知）可能是暴力的——涉及到对他人存在的所有权占有。那种版本的知识有时被称为“信息”（Benjamin
    and Arendt 1968: 91）。然而，亲密认知也超越了信息。“在知识及其对存在的掌控之外，[是否]出现了一种更紧迫的形式——即智慧？”（Levinas
    1989: 78）。智慧是源于共享生活充实的亲密认知，是受到多个主体触碰的认知。我们已经在上面的讨论中遇到过这种版本的亲密了。约翰逊（Johnson）的“贝斯历史”是智慧，而非信息。“流动的、痛苦的黑人故事”并不完美契合现代数据流。


    亲密属于完整性，因为亲密意味着将他人视为整体，无论他们是否在。存在主义哲学家马尔塞尔（Marcel）写道：


    > “即使我看不见你，我无法触摸你，我感觉到你和我在一起；如果不能确定这一点，就是对你的否定。” 与我在一起：注意这个词的形而上学价值，哲学家们很少承认它，它既不对应内在或内在性的关系，也不对应外部性的关系。它是真正的共存（coesse）的本质（Marcel
    1948: 25）。


    亲密是完整性，因为亲密意味着将他人视为整体，无论他们是否在。


    > “即使我看不见你，我无法触摸你，我感觉到你和我在一起；如果不能确定这一点，就是对你的否定。” 与我在一起：注意这个词的形而上学价值，哲学家们很少承认它，它既不对应内在或内在性的关系，也不对应外部性的关系。它是真正的共存（coesse）的本质（Marcel
    1948: 25）。


    真正的共存（coesse）的本质是（Marcel 1948: 25）。（注：原文此处存在大量重复的OCR错误文本，已按要求进行去重处理）

