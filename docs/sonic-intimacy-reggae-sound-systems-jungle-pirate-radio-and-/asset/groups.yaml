    # THE REGGAE SOUND SYSTEM AND VIBE


    is defined by its relation to other components. And, as such it is not an alarm,
    a siren or a personal address system but a bass, mid-range or treble unit.


    This is not where originality ends, because the social also relates to the technological.
    That is to say, people and their practices are infused in the ‘set’, the selector
    who plays the tunes and the deejay (the MC in post-rave nomenclature) responsible
    for the lyricism give definition to the technology, controlling the microphone
    or running and configuring the set. The technology gives meaning to their roles,
    too. The microphone defines the deejay and the record defines the selector.


    The point I am developing, and will run through this book, is that the sonic intimacies
    of the sound system can only be known in relation. If we do not foreground that
    we end up with a technical specification of culture, one oriented to particular
    professional or indeed systems of control, which often say more about the mastery
    of sound culture itself than they do of its dynamics.


    The sound system''s originality does not end with the individual''s reciprocal
    relationship with technology either, because these individual social roles are
    co-dependent. The sound system is not generally a solo pursuit but that of a collective,
    of the crew. As there is a reciprocal relation between microphone and deejay,
    there is between sound system and its crew. The crew gives the technology a particular
    status, and the power and quality of the sound system gives meaning to them. In
    his book What the Deejay Said, Dez Henry discusses these techno-social relations,
    explaining how the sound system shared a reputation with the deejay. In this case,
    this was a reputation of upliftment, conscious lyrics and black empowerment. It
    was not the deejay alone who carried this reputation, but the whole sound system,
    such that a system would be evaluated as a techno-social collective (Henry 2006:
    151).


    All of these relations (including the box boys who carried and moved the equipment,
    the prospective deejays and selectors and, for larger systems, the electronics
    or speaker-building specialists) are cohened through sound. It is in fact sound
    and not technology that announces the sound system. It is sound that calls across
    the dance floor. As sound calls the crew and technology into being, it also verifies
    the collected roles therein. If you are the operator,'
  - '[PAGE 42]


    your business is sound quality, power and reliability. If the sound is poor, then
    you and your technology are so appraised. When Henry mentions the reputation of
    his sound system for upliftment, he is addressing sound. He is identifying lyrical
    discourse (which is sonic) and also implying music (also sonic). This sound can
    further be divided into frequency ranges that correspond with the drums, instrumentals,
    lyricism and baseline.


    But without the dancehall, this means little. When active, the sound waves emitted
    from the speakers relate the technology and crew to the audience. The sound system
    presupposes the audience who – far from being passive recipients of music – are
    co-producers. The sound system is predicated on dialogue with its audience. The
    sound system in this sense is a techno-social configuration predicated on the
    liveness of its social relations for its definition. The technology of the sound
    system attains its meaning (its reputation, in Henry’s) through its relation to
    the audience, who verify its stance through dance and voice; through somatic and
    sonic symbols. The skank of the dance floor and the call of ‘rewind!’ are essential
    information for the sound system crew. When a sound system doesn’t play out, where
    it resides unstrung, it may still have a crew, but it ceases in fact to be a sound
    system. Locked in a warehouse, garage or basement, it loses its social life, its
    vitality, becoming again an assortment of prone technology, with potential.


    # Crisis


    Having established the relational basis for the sound system, must foreground
    the juncture in which it is active. The cultural and political dimensions of the
    reggae sound system can only be evaluated when placed in their social and economic
    context. For the sound system, that conjecture was shaped by the post-war crisis
    of capitalism in which racism and nationalist assertion featured heavily.


    The structural crisis of capitalism defined the post-war period in which sound
    systems played, shaping the 1970s and 1980s as it had the two decades previous.
    Global economic shifts had led to a decline in Britain’s manufacturing base, reduced
    technological competitiveness and a weakened global trade position. Those'
  - '[PAGE 43]


    # THE REGGAE SOUND SYSTEM AND VIBE


    shifts found a resolution in Conservative Prime Minister Margaret Thatcher''s
    free market revolution, and contingently in racist and nationalist claims often
    levelled against black people and black culture, including sound system culture.


    After a choppy first term, the Falklands War paved the way for Thatcher''s unexpected
    victory in the 1983 General Election, providing the political opportunity$^{5}$
    for rapid deindustrialization, the contraction of the state and the rude implementation
    of neo-liberal market economics. Drastic cuts in public spending, soaring inflation
    and unemployment ensued, impinging heavily on black people, the majority of whom
    were working-class in this period. Fifty per cent of the general youth population
    was unemployed, with black youth worst affected.


    The economic resolution to the crisis is accompanied by a racist one. Prior to
    Thatcher, the post-war state had expanded significantly into economic and social
    spheres, meaning that economic strains were also experienced as political ones.
    The state had made itself responsible for large tracts of the economy and society
    it was there also culpable for its shortcomings. Those political straits pulled
    at the legitimacy of the government, leading to an erosion of social democratic
    principles. From the tenure of Labour''s James Callaghan administration (1976–9)
    onwards, this erosion was increasingly filled with populist politics characterized
    by an authoritarian appeal to law and order. In place of a social democratic model
    of consensus, then appeals to the people became the mode through which the government
    sought to rule (Hall et al. 1978: 214).


    Those populist appeals to law and order drew from the deep well of British racism,
    often siphoning anti-black sentiment to its ends The ideologies of Otherness–through
    which Britain had legitimate its rule in the colonies and through which the Edwardian
    and Victorian upper and middle classes designated the working-class– provided
    a reservoir for this populistriol. Political leaders


    ⁵Thatcher reformed her 1979 cabinet, removing the older more consensual guard
    broadly loyal to former Prime Minister Edward Heath, and installed her own evangelists.'
