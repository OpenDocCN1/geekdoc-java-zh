    that’ (Logan Sama in Mavros 2011).


    As the videos for Wiley’s ‘Wot Do Call It’ shows, mobile phones were prominent
    in the grime scene (Wiley 2004).² Indeed, the UK Garage crew Pay as You Go Cartel
    (that would morph into the grime scene Roll Deep) derived its name from an in-joke
    mobile network errors during the summer of 2000 that made call-ins to Rinse FM
    free—‘It’s the pay as you go!’ (Plagued in DJ Target 2006: 71). Around 2006, mobile
    phones are fitted with better video cameras and become the technology through
    which grime videos are shot. The Sony Ericsson W810 was popular for this purpose.
    That model had a louder speaker that could be ‘chipped’ by young people to produce
    extra volume for backing tracks. It also had video and audio recording capacities.
    Come 2008, if you wanted to rap over an instrumental and record and upload it
    to YouTube, it was essential technology.³


    Grime artists in this period did not launch their careers on pirate radios or
    clubs—the police campaign against grime noises is well documented—but through
    mobile phones and YouTube. Stormzy recalls


    In secondary school, Year 7 [age 11]. I know a lot of grime artists started off
    on pirate radio, but I missed that era, I was way too young. I was MCing in the
    playground, spitting lyrics over mobile phones—Sony Ericsson, Walkmans, W810s,
    the Teardrop Nokia phones, all of that. Vital equipment! I never even had a DJ
    set where a DJ’s playing vinyl and I’m spitting (Hancox 2015a)


    > ²This is also discussed Zuberi 2014: 197–8.


    > ³In his book, Richard Bramwell captures the audio version of this moment, through
    his discussion of the ways in which groups of people share grime and hip hop MP3s
    on the backs of London buses, to create their own alternative public space (Bramwell
    2015).


    > ⁴ During the tenure of Prime Ministers Tony Blair and David Cameron, grime music
    is criminalized on the basis of its blackness and linked to an array of social
    problems (cultural degradation, knife crime, violence). The introduction of the
    infamous risk assessment form 696 means that grime nights could be closed down
    on the basis of the music and the audience’s ethnic designation as black. Crime
    responds to this with indignation. JME for Noisy 2014; Bizzle 2006.


    ## GRIME AND YOUTUBE MUSIC VIDEOS


    Young people still wrote lyrics in their bedrooms and maintained musical cyphers
    in public spaces, but by 2009 many were more producing and listening to music
    through their mobile phones and YouTube. Over only a few years, black diasporic
    culture had shifted its twentieth-century affinity for analogue sound technology
    to a twenty-first-century compulsion for digital and networked music videos. Social
    media was now the center of black diasporic culture.


    Grime''s principal YouTube channels emerge at this moment. In 2006, sixteen-year-old
    Jamal Edwards created SBTV (Smokeybarz Television). That is shortly followed by
    Link Up TV in 2008 and by GRM Daily in 2009. These channels follow the format
    established in the earlier DVDs: street raps (SBTV''s F64 freestyle series is
    pivotal here – named after the 64-bar duration for the raps!), behind-the-scenes
    videos, documentaries and music videos of varying production values. By the time
    GRM Daily is launched, video content is not episodic, as it was for DVDs, but
    a continuous stream. By the end of the first decade of the new millennium, SBTV
    is accruing millions of YouTube views and has become one of the sources through
    which grime is discovered worldwide (Jamal Edwards cited in Collins and Rose 2016:
    170; White 2017: 77).


    ## The (ongoing) crisis of neo-liberal capitalism


    As New Labour took power in 1997, the free market ethos of the earlier Conservative
    administration was extended to a wholehearted embrace of deregulated global finance
    capitalism that would later result in the 2008 financial crisis. Named ''casino
    capitalism'', that business model became a central plank of New Labour, it was
    also the case that for the working class, the impact was often hyper-local. The
    impact of the 2008 financial crisis was felt most acutely in the communities where
    grime was born.


    Despite early promises, the impact of the digital revolution was not uniform.
    For many, the internet provided new tools for expression, but for others, it was
    another layer of exclusion. The shift from pirate radio to digital platforms changed
    the very nature of how music was consumed and consumed.

