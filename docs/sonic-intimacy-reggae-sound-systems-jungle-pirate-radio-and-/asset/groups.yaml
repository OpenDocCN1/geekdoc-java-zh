    ## 丛林海盗电台与炒作（hype）


    ### 引言


    送给所有被锁住的大哥……向所有正在找时间（cotch time）插磁带的人致敬……发送最强烈的律动给 Gunor。稳住，Smurf。向 Ragga Twins
    致敬，稳住 Flinty，稳住 Deeman……绝对主宰着 94.5 频段……送给所有在公路上穿梭的人，当我们向你们展示即刻而来的氛围时，是时候夺回一些控制权了。（DJ
    Brockie and MC Det 1996）


    通过这种方式，MC Det 在 1996 年夏天通过歌曲《16 Track Ting》介绍了 DJ Brockie，回想了 20 世纪 90 年代初中期的一个时刻，当时丛林（jungle）海盗电台是城市的节拍器，在保守党统治十年的末尾设定了一个疯狂的节奏。《刑事司法法案》（Criminal
    Justice Act）已经出台，伦敦周边的户外浩室派对正在被关闭。狂欢者、灵魂乐迷（soul heads）、B-boys 和雷鬼舞团队（其中许多人是黑人、白人和亚洲人）出生于
    20 世纪 60 年代和 70 年代，他们在伦敦市中心的俱乐部和仓库派对中混音。他们创作的黑人方言声音被他们称为“丛林”。正如 Rebel MC Congo
    Natty 所说，它是“人们的丛林”。与此同时，海盗电台遭受了又一次严厉打击；这次并没有退缩，而是以前所未有的速度扩张，成千上万的年轻人在客厅和车里收听。


    在 90 年代瞬息万变的格局中，丛林海盗电台更快。这看起来似乎是永恒的，尽管它的最高速度只真正持续了五年。


    丛林海盗电台的听学亲密性是“炒作”（hype）。部分性、流动性和速度，炒作是激烈的、破碎的、脆弱且非法的。从发射站的建立到呼应互动，炒作在各个领域持续着。1995
    年，Kool FM 的 Marley Marl 在电波中喊道：


    > “电话电话接踵而至，Footloose 能帮你吗？斯特拉福德大军，伊尔福德大军，在整个地区播放得很棒。短小有力，这是我们喜欢的。（Marley Marl
    and Footloose 1995）


