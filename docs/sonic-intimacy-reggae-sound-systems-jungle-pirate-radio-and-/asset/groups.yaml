    Wisdom moves through music – through codified sounds played back to the city and
    affirmed by its celebrants. Affirmations of social position and daily rituals,
    political struggle, oppression and emancipation filter in and out of those sounds.
    But wisdom is born through sonic atmospheres, too. Registers of intensity, coldness
    and warmth, structure the general knowledge of moments, as their variable amplification
    patterns sagacity in time. Intertwined with information, reggae and jungle nonetheless
    white labels, mixing and the sonic form itself undermine property. But in grime
    YouTube music videos, wisdom and information are more tightly twisted. Dominance
    is nearly indiscernible from its alternatives, although alternatives persist nonetheless.
    In fact, DIY grime YouTube productions are redolent with alternative knowledge,
    even as they are routed through the reductive streams of digital capitalism.


    # Craft


    Craft doesn’t live here any more! Those techno-social processes anathema to labour
    alienation, these open material relations productively at odds with capitalist
    exploitation, seem to have their day with the advent of YouTube and 3G. In the
    reggae sound system, constellations of skill, refinement and creativity found
    their expressive outlets through the sounds and sociabilities of the dance floor.
    Consumer culture made inroads into jungle but couldn’t pierce the illegality of
