    in the 1980s. The discrepancies between Mandelson''s rich and Thatcher''s poor
    were nowhere sharper than in the London boroughs that birthed the grime sound.
    Haringey, Barking and Dagenham, Lewisham and Lambeth all have their place, but
    it was the former industrial East London boroughs of Tower Hamlets (particularly
    Bow) and Newham that were most important for the early scene (2017).


    On other side of the River Lea, with the River Thames to the south, Tower Hamlets
    and Newham were multi-ethnic boroughs demographically composed through generations
    of migration. They counted with higher than average unemployment, lower than average
    pay, precarious employment conditions and multiple forms of social deprivation
    (James 2015; White 2017). They were also frizzed with excess wealth. To the south
    of Tower Hamlets was Canary Wharf mounted to global finance capitalism and Yuppie
    indulgence. To the south of Newham (on the other side of the Thames) was the Millennium
    Dome, New Labour''s architectural realization of urban chic, aspiration and deregulation,
    for a short time was to house an actual ''super casino''.


    Grime relationship to capitalism should be understood in this nexus. Grime is
    not anti-capitalist (neither was reggae or jungle); ''Money motivates me. I''m
    motivated by money,'' says Dizzee Ras. Skepta hails grime pirate radio a successful
    ''pop-up investment'' (Skepta kinda Hancox 2015b; Hancox 2013, Kindle location
    249). But not were Dizzee and Skepta casino bankers or bourgeois entrepreneurs.
    After all, grime''s ''hustle'' produced in the constitutive elements of those
    dominant capitalist cultures. Figured in the shadow of Canary Wharf, desiring
    its light, grime''s early protagonists were always more certain that the money
    would run out than it would keep flowing. The presence of Canary Wharf in so many
    grime videos – for example, Shystie''s ''Ima boss'' and Upcoming Movement''s ''Time
    is Up (Ice Films Entertainment at. 2011b; Shystie 2011) – was symbolic of these
    psychic and social relations, and indeed illustrative of how a scene so heavily
    invested in the myth of authentic street life did not reject wealth and celebrity
    as YouTube took over the autonomous infrastructures of raves and pirate radio,
    but embraced it.


    > “See for discussion of entrepreneurialism in grime, White 2017: 110.'
