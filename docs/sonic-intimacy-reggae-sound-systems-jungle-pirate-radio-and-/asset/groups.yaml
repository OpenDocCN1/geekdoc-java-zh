    # 雷鬼音响系统与氛围 39


    他们蓬发展的音响系统。这些实践说明了音响系统作为 DIY（自己自做）技术的特质（这是书中讨论的所有技术共同具有的地位），它们也开始将其识别为一种“技艺”（craft）（书中并非所有音响文化都具有这种地位）。


    声音技术的 DIY 方法在黑人离散的声音文化中有着悠久的历史，事实上，更广泛地说，存在于那些受财富限制而非创造力限制的社会领域。它们是“跳线者作为足球门柱”的故事的一部分，也是“木板作为廉价唱片机作为嘻哈乐器”的一部分。它们还是在牙买加市中心音响系统最初出现之前的实践——当时他们为大众播放录制音乐，部分原因是预先聘请乐队的费用太贵了。但并非所有这些都能被视为技艺，这涉及到我们对声音亲密性讨论中一个至关重要的问题。


    在音响系统中，DIY 过程也是一个工艺过程，而工艺过程涉及对象与（在本例中）声音操作者之间的复杂关系。纪录片《Sound Business》记录了 Sir
    Coxson Outational 音响系统如何切割、胶合和螺接新的扬声器箱体。采访者询问了这种做法。手工艺人花费了好几天制作箱子，因此向摄像解释了他的劳动、他与声音技术以及声音本身的关系。“当你听到那部分[扬声器]播放时，”他说，“从那里传出来的低音，你会感觉到它。它是至关重要的一部分。听着声音播放”
    (Dineen and Kaidan 1981)。这远不止同义反复，箱体制造者是在向摄像解释他的技艺是如何通过声音表达出来的。音响系统播放的那一刻，你感受到低音的那一刻，已经预示在他与声音技术的亲密关系中；在他将木头粘在一起的行为中。他与声音技术的表达性劳动关系预示了舞蹈的创造动态。技艺本身就是声音的表达。


    技艺意味着技能和创造力。音响系统，特别是自制和维护的音响系统，需要学习专业知识。“扬声器箱的设计必须你要放入的特定扬声器，你不能只做一个箱子然后放一个扬声器。那通常行不通”（Mr
    Herron 接受 Smith and Wei Porter 2010 采访）。同样，音响系统根据舞厅的共鸣空间进行调校，从箱体后面出来的低频与单个建筑的建筑结构相结合。“早期，我们在频率上下了很大功夫，”Jah
    Shaka 解释道，“不仅是为了功率，为了获得正确的频率。有些低音很大，但有些是赫兹————嗡嗡作响但你听不到——非常低的频率。我们努力得到那种” (Jah
    Shaka 2014)。


    这并不意味着是在学习一种科学，尽管它可能也是这样——例如电子学——但更多时候是一种艺术——一种对音响系统将如何播放的定性的、解释性的和创造性的理解。


    所有音响系统都在寻求质量和力量的结合。当声音复制超过 3000 瓦时，失真或模糊的声音就是一个问题——这在较大的夜总俱乐部中往往得不到解决。对于音响系统，这个问题由于移动性而变得复杂。与俱乐部的扩音系统不同，音响系统只在舞蹈前几小时才搭建。尽管如此，即使在测试声学语境下，功率、质量和清晰度对于维持舞蹈氛围也至关重要，每个音响系统都微调这些属性以实现其特征声音。


    任何与他们认为具有表达力的对象建立起熟练关系的人，都会理解该对象（或对象集合）所具有的亲密意义。在一个表达性的艺术对象中，一个在与观众对话中被预示的对象，这种意义被放大了，音响系统变成了一个集体化的“个性延伸”（Jah
    Observer 接受 Gaonach 2014 采访）。


    那么，重要的是指出（因为这很少被提到），对于音响系统人员来说，当声音播放时，观众不仅在听他们的音乐，而且在听他们的技艺，这是手工艺人与对象之间的亲密关系。换句话说，如果你花费了几周时间为音响系统制作电子元件，或者只是频率分频器，当声音播放且电容器保持良好时，你对声音、对舞蹈和表达的快乐也是对分频器本身的快乐；你与音响系统的亲密关系同时存在于分频器和聚集的人群之中。


    # 雷鬼音响系统与氛围


    （注：此处原文中存在大量重复段落，已根据要求不进行重复输出，仅保留核心内容及后续章节）


    ## 技艺之道


    那么，重要的是指出（因为这很少被提到），对于音响系统人员来说，当声音播放时，观众不仅在听他们的音乐，而且在听他们的技艺，这是手工艺人与对象之间的亲密关系。换句话说，如果你花费了几周时间为音响系统制作电子元件，或者只是频率分频器，当声音播放且电容器保持良好时，你对声音、对舞蹈和表达的快乐也是对分频器本身的快乐；你与音响系统的亲密关系同时存在于分频器和聚集的人群之中。


    这些技能通过学徒制学习。音响系统是质量和力量的结合。当声音复制超过 3000 瓦时，失真或模糊的声音就是一个问题——这在较大的夜总俱乐部中往往得不到解决。对于音响系统，这个问题由于移动性而变得复杂。与俱乐部的扩音系统不同，音响系统只在舞蹈前几小时才搭建。尽管如此，即使在测试声学语境下，功率、质量和清晰度对于维持舞蹈氛围也至关重要，每个音响系统都微调这些属性以实现其特征声音。


    重要的是指出（因为这很少被提到），对于音响系统人员来说，当声音播放时，观众不仅在听他们的音乐，而且在听他们的技艺，这是手工艺人与对象之间的亲密关系。换句话说，如果你花费了几周时间为音响系统制作电子元件，或者只是频率分频器，当声音播放且电容器保持良好时，你对声音、对舞蹈和表达的快乐也是对分频器本身的快乐；你与音响系统的亲密关系同时存在于分频器和聚集的人群之中。


    ## 临场与智慧


    音响系统的亲密现场进一步打破了资本主义异化的剧本。表演者在社会经济背景上与人群中的人没有区别；社会学家 Les Back 解释道。


    > MC 绝不是高不可攀、神秘的明星……观众与表演者共同的物理和社交现实让音乐具有相关性和易于理解。舞蹈为集体经验的分享和庆祝提供强大的统一背景——音乐的力量在于集体性。(Back
    1988: 149–51)


    在音响系统中，共享的经验通过声音和水平邻近性被有力地凝聚在一起。这与撒切尔时代英国的个人主义和私有化相立。音响系统在种族和阶级异化的背景下将人们聚集在一起，提供了一个日常经验和共同社会历史状况的场所。


