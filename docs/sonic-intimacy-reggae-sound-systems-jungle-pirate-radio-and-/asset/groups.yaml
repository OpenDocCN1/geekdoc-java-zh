    ## 5 Conclusion: From left critique to alternative cultural politics


    When Nadia Rose performed live at Village Underground in London in 2017 to a soporific
    room, Snapchat gave her love. Turning from the audience to the rapping circle
    and social media, she shifted between different modes of presence. From the cold
    crowd, she recharged in the warmth of rounds. The rounds she reached for the tactility
    of digital media. The room, full but empty; the cypher, deep and proximate; the
    social media, infatuating and never-satisfied – of the three, the cypher and social
    media were in dialogue. The former supplementing the deficiencies of the latter,
    the latter requiring the former. But as the live audience receded into the background,
    social media was in ascendance. Around that turned the unfulfilled love of evening
    in Shoreditch.


    To say social media ‘gives us love’ is to employ a platitude. That platitude makes
    sense only because we really do feel that social media provides something akin
    to love – at least as we understand love in the contemporary transactional sense
    of reciprocal self-affirmation. To say social media gives us love is to confirm
    that the deep intimate potential of human relations has been reduced to screen-mediated
    consumerism. It is to signal the ways in which the affective environment of social
    media replicates those feelings. To say social media gives us love is to say that
    not only replicates love but provides it freely and easily. In a society in which
    even transactional SONIC INTIMACY love often feels hard to come by, to say social
    media gives us love signals infatuation with what social media provides readily.
    As with all transactional love, social media love is never enough.


    To say social media gives us provides a window onto changes in sonic intimacy.
    In the context of this book, to say social media gives us love is to acknowledge
    the ways YouTube video movies provide for an intimate transaction; a transaction
    that is never complete, that reinforces social negation; a transaction that finds
    denied in multiple verifications of the collective of the dance floor than it
    does in self; a transaction that moves more to the affective aura of the networked
    screen and restless interface than it does to the haptic rhythms of the night;
    a transaction so overwhelming one needs to hunker in the cypher so as not be pulled
    apart. But listen! Hunkered in the cypher we find an embrace that is not dead,
    that is still vital. The cypher''s embrace is mutual, democratic and horizontal.
    As it bolsters the deficiencies of social media, it affirms the necessity of sonic
    vitality for life.


    One might in Shoreditch draws our analysis to a close by opening a discussion
    on the kind of scholarship we might pursue; where endings are beginnings pointing
    to forms of evaluation we might better avoid. This final chapter begins by making
    a case for the approach to cultural analysis adopted in this book – for why a
    relational approach to cultural analysis is important. That approach has provided
    insight into the alternative cultural politics of black diasporic sound cultures.
    This chapter ends by evaluating the sonic intimacies of those and by clarifying
    what is at stake in them.


    It matters, after all, what questions we ask, how we ask and how we reflect on
    the answers. As authoritarianism, nationalism and racism coalesce in popular culture,
    in the UK and globally, our attention must be resolute. Do we provide latitude
    for alternative flows of life, or do we unintentionally re-scribe the same assumptions
    from which authoritarianism, nationalism and racism spring? That interrogative
    may seem abrupt, given the appraisal that follows is critical left scholarships,
    but it is nonetheless necessary. Because while critical left scholarship is CONCLUSION


    > ¹See, for wider dialogue on love, hooks 2000.


    honed in the anti-image of the nationalist, authoritarian and racist right, it
    often proceeds on the same epistemological basis.


    Critical scholarship is routine fare in Those most-leaning humanities and social
    sciences disciplines. Those concerned with capitalism and class address how are
    alienated from our labour, from each other and from the planet around us. Those
    concerned with racism and colonialism explore how race and Empire function to
    organize humans into hierarchies to the ends of domination. These approaches overlap
    and share many features. Both stand in critical relation to the dominant ideal
    figure at the centre. For those focusing on race and colonialism this is routinely
    the white, colonial figure around racialized notions of humanity, morality and
    progress violently turn. For those focusing on class, the bourgeois enlightenment
    man does work in explaining the violence of property and capitalism. In both cases
    the outside of these centres are the racialized and working-class human which
    the critical scholar fibres to free, to different degrees and at different levels
    of abstraction.


    These forms of scholarship, in their various guises, have been the default mode
    of critical analysis for almost a century, arguably reaching their zenith in the
    post-structuralisms and postcolonialisms of the 1970s to 1990s. While poststructural
    and postcolonial analysis was problematic for scholar activists to uphold more
    clearly delineated political positions, for example on racism (Sivanandan 1990),
    it was also the case that poststructuralism and post-colonialism developed increasingly
    refined (crafted) languages and frameworks through which questions of racial and
    classed violence, Empire, alienation, subjectivity and power could be understood.
    This complexity was partly for its sake, to be, but it also responded to the dynamic
    entanglement of social forces in late modern capitalist societies.


    Post-2008 ‘the last decade’, the financial crisis, austerity, the killing of Mark
    Duggan, ‘the refugee crisis’, Prevent and the Hostile Environment – the confiscated
    hope of the new millennium feels eons away.¹ Pges to end child poverty and arguments


    > ²For detail, see Ali and Whitham 2018; Bakkali 2019; Bhattacharyya 2017; de
    Noronha 2019; El-Enany 2020; James 2014; Jones al. 2017; Kapoor 2018; Kundnani
    2014; Rashid 2016; Trilling 2015; Valluvan et. 2013.


    redistribution and the constitution of multi-ethnic Britain are now faint memories
    in a miasma of climate denial, fake news and nationalist-authoritarian assertion.
    And it is here that a more assertive critical scholarship has emerged. Schools
    formerly entrenched in the post-structural analyses of Stuart Hall, Avtar Brah
    and others, new fractures have developed. Stuart Hall''s death in 2014 in some
    way marked a watershed as scholars (identifying as activists) moved away from
    the frameworks and idioms of poststructural towards particular readings of anti-colonial
    and anti-racist texts. Here, standards of colonial and anti-racist theory are
    revisited, separated out and pared down to fit the sharper positions necessitates.
    Fanon became a version of Wretched of the Earth (Fanon 1991) and Baldwin with
    a partial distillation of The Fire Next Time (Baldwin 1973).


    To say these analyses are formed on the same terrain as dominant culture is not
    to suggest they push in the same direction. The opposite is, of course, true.
    After all, critical traditions work to debunk racial and classed hierarchies and
    to call out their myths. Scholars inclined in this way also frame the categories
    and power structures map over the lines laid down by racial and classed modernity
    and show how they are bankrupt, how they are historically routed and how they
    act in the present. Such critiques map itself. Their critique is maintained by
    positioning themselves in negative relation to the dominant movement - sometimes
    referring to themselves as ''resistance'' on those terms. That is to say, increasingly
    strident and reactionary forms of nationalism and racism are marked by more assertive
    anti-racist and anticist positions, but the terms of engagement are still set
    by racist and capitalist violence, as opposed to a world view that springs organically
    from modernity''s counter-currents.


    To develop this point, consider for a different form of leftist critique against
    which anti-racism is set. This is the left critique of capitalism that also frames
    the working class as white (normally written ''white working-class'').

