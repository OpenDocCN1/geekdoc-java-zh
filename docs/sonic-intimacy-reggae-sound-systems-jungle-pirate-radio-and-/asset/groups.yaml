    # 72 SONIC INTIMACY


    and engineer for a fraction of the cost of a professional set up.¹13 There was
    a general shift in music culture away from craft and towards consumer culture.
    The intimate and expressive relations reggae sound system personnel with sound
    technologies were contingently displaced by the ready-made objects of late-modern
    society.


    This is not to say that all features of craft evaporated. In pirate radio, the
    knowledge of transmission was still acquired and handed down through apprenticeship.
    The illegal condition of pirate radio endured by this denying information and
    property streams across to ambit of cultural life. Jungle pirate radio''s frenetic
    game of cat and mouse with the authorities then ran alongside a slow and patient
    learning that supplemented pirate radio''s wider patterns of mutuality and community.
    This knowledge was also not property in the sense that, while different stations
    competed for sites and FM frequencies, knowledge of transmission was also shared.
    Mister T, for example, took technical and logistic experience from Passion FM
    and Rude FM to Origin FM (Belle-Fortune 2004: 222).


    These tensions between mutualism and capitalism defined jungle pirate radio, and
    indeed wider society at the time. Jungle pirate radio was not a shop window. DJ''s
    tracks were rarely identified, and DJs were unrecognizable off-air. Un-cleared
    samples – like the copied tapes of listeners – widespread, denying liberal ownership
    in copyright form. Pirate radio itself was free. Its pirates did not depend on
    spending power. Jungle pirate radio ran advertising¹⁴ and charged DJs and MCs
    subs to appear on the station. However, this was not profiteering. The pirates
    on the whole did not make money from the stations and any revenue raised generally
    went back into day-to-day operations (Doran 2014).¹⁵ And also, capitalist imperatives
    were never far away. By


