    bodies going drvvvvvvv and I wanted to experience that so I would feel the bass
    go brvv’ (Marre 2011).


    The bass properties change your body


    It seemed that when the other sounds had done with their boasting and toasting,
    there would come a discrete hiss from the corner, and Shaka would mutter a title,
    or more often an invocation to Jah Rastafari, and the old-style heavyelite-style
    head of his arm lower to the vinyl. Then it might seem that the walls were tumbling
    down around your ears. Then it might seem that your body had never felt those
    rhythms to impel and overwhelm, you''d find your feet flashing like sparklers.(NME
    1981c)¹⁷


    As your body is moved, so is your mind. Connecting the sonic intimacy of vibe
    and vibration to presence and wisdom, Steve Goodman, aka dubstep producer Kode
    9, writes,


    ¹⁶Quad is two at the front and at the back. Triangular is one at the back and
    at the front.


    ¹⁷As with vibration more broadly, this full bodily experience can of course be
    translated into other ways; some people find it pleasurable (Trower 2012: 126–49),
    some people find it grounding, others find it deeply relaxing. I have a good friend
    who was on more than one occasion found asleep, curled up at the foot of a bass
    bin at the end of the night.'
  - '[PAGE 60]


    For many artists, musicians, dancers, and listeners, vibratory immersions provides
    the most conductive environment for movement of the body and movement of thought.
    (Goodman 2009: 79)


    And, as with the rest of the sound system, this was not a lonely flight but one
    that was relational because those same vibratory encounters also worked to ''unravel''
    self-certainty ... recast our sensed surroundings ... and rethink what we can
    do and how we operate'' (Jasen 2016: 3-4).


