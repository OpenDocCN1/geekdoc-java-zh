    In the dance this leads to a feeling of losing time. The repetition of rewind
    (when the selector pulls the track back to the beginning) reinforces that. Deejays
    also work to intensify the dub, allowing it to slip into, before bringing it back
    from, collapse. Deej Kayleb''s utterances match the slipping, before closing in
    on the trance of the dub, bringing you back to reality.


    Alongside the deejay''s work, the repetitive composition of the music and the
    extended playing of versions of the same track, the meditative embrace of the
    dub means that it is frequently difficult to recall how long you have been dancing.
    In a diametrically opposed way which industrial alienation is regulated by the
    hands of the clock, dub break the mood of capitalist time for alternative imaginings.
    This temporality is referred to as dub-wise.


    The alternative imaginings of dub-wise are well discussed. For African Simba,
    the dub lifts you out of the rhythms of capitalist exploitation; distressing,
    winding down, lightening the load and getting by:


    > A lot of people when they go to the roots dance, whether Rasta or not, whether
    they go with the intention of getting rid of a burden or not, they say coming
    out of a dance, Simba feel different. I feel like all my problem is gone. My shoulder
    feel like I was carrying something and it is gone. (Afrika Simba interviewed in
    Folke Wes Wesley 2008)


    But there are other possibilities for the dub-wise, too, altering your imagined
    relation to time and space more fundamentally, putting you on a ''different''
    level, a different planet'', making you feel like a ''space man'' or ''deep-sea
    diver'' (Robbie Shakespeare cited in Veal 2007: 63), or indeed providing an opening
    to violence on the dance floor as the structures and governance of the day-to-day
    are displaced, and the emanation of daily life flows over (Back 1988: 150).


    ## The sonic intimacies of the sound system


    The sonic intimacies of the sound system are like no other discussed in this book.
    In the context of heightened racism and class marginalization their properties
    were such that they collected people, conveyed a demotic story and provided space
    for forms of expression and imagination that were at odds with the modes of


    oppression under which black people had lived and were living. This wasn’t a marginal
    concern but one, from the home to the pleasure of the dance, that was central
    to black British life in the period; nor was it defined as a novelty supplementing
    the expansion of capital into ever-newer realms of commodification. Rather was
    it the centre of kinship, community and leisure life as it was also autonomous
    in terms of its processes of production and dialogue.


    The sound system was a dynamic system of relation comprised of technology, sound
    and society, in which each facet of the culture was intimately present with the
    other. Socially, people with similar experiences of racism, class marginalization
    and daily life opened onto each other, as they found their stories played through
    the speakers and in the sound (both musical and phonic). Racist social structure
    impinging upon these spaces, but so too were these sufficiently open so to engender
    multi-ethnic relations on the dance floor, in the experience of sound and in society
    more broadly.


    The capacity for forms of expression that moved outside capitalism rhythms was
    ensured by the sound systems’ processes of labour and co-production. The crafting
    of the technology provided for expressive relations at odds with industrial alienation
    and Eurocentric consumption. They allowed for the maintenance of alternative traditions
    of pleasure, skill and attention, and a dance space for these to be completely
    realized and co-produced.


    Here alternative knowledge, intimate to those in the room, could breath and circulate.
    As wisdom was present through the process of crafting, so did it move through
    sound and people in the dance. The people in the dance brought their experiences
    and histories into the room where they were collected under a web of wires, and
    there those experiences were intuited by deejays, and resonated in speaker boxes
    and through the black diasporic history of bass.


    The bass told a collective story of black diasporic life, as it moved through
    revellers collecting them together with the speakers and the studios. Its vibrational
    properties engender movement, pleasure and release as they also dealt the tyrannies
    of the visual, racial and capitalist, expanding mutual relation. The dub deconstructed
    the sonic-sensory experience of Eurocentric capitalist time. If all that came
    together, the dance had a good vibe; a vibe so charged that it would flow through
    time.


    # 3


    ## Jungle pirate radio and hype


    ### Introduction


    Goes out to all the massive locked in ... Shout to all those who are getting cotch
    time to stick a tape in ... Sending the maximum moves out to stick to the Gunor.
    Hold tight Smurf. Goes out to the Ragga Twins, hold tight Flinty, hold tight Deeman
    ... Absolutely ruling 94.5 ... Goes out to all those cutting on the open road,
    time to take some element of control as we flex the vibe coming at ya. (DJ Brockie
    and MC Det 1996)


    In this way, MC Det introduces DJ Brockie over the track ''16 Track Ting'' in
    the summer of 1996, recalling a moment in the early to mid-1990s when jungle pirate
    radio was the metronome of the city, setting a frenetic tempo at the end of a
    decade of Tory rule. The Criminal Justice Act had come in and the outdoor house
    raises around London were being closed down. The ravers, soul heads, b-boys and
    reggae crews, many of whom, black, white and Asian, were born in the late 1960s
    and 1970s, were mixing at clubs and warehouse parties in inner-city London. The
    black vernacular sound they compose, they call ''jungle''. As Rebel MC Congo Natty
    says, it was ''the people who called jungle''. At the same time, pirate radio
    suffered another heavy crackdown; this time did not recede, but exploded and stations
    proliferated like never before, or since, as thousands of young people in their
    living rooms and cars tuned in.


    In the fast-changing landscape of 1990s, jungle pirate radio was faster. That
    seemed permanent, although its maximum velocity was only really sustained for
    five years.


    The sonic intimacy of jungle pirate radio was ‘hype’. Part mobility, part liquidity
    and part speed, hype was fierce, fractured, fragile and illegal. From the setting
    up of transmission sites to the call and response, hype was sustained across the
    board. In 1995, Kool FM’s Marley Marl shouts over the airwaves:


    > “Phone calls coming thick and fast’ Footloose can help you, please?’Stratford
    massive, Ilford massive, picking it up good over the region. Short and sweet that''s
    how we like it. (Marley Marl and Footloose 1995)


    Hype still contained a rebel stance – in the illegality of the endeavour and the
    black militancy of the music, in the patterns of dialogue sustained across the
    city, in the forms of multi-ethnic and spatial collectivity, and in the commitment
    to common good. But this was a people against – I’m not sure what, culture. It
    had all the angst, energy, escape and catharsis but no particular purpose. Guy
    Gerald, Congo Natty, MC Navigator, MC 5ive’O, MC Hermione and Kemet Crew’s Mark
    X retained elements of black international, anti-racist, civil rights and Rastafi
    idioms, these did not predominate, or define the culture. After all, in the trauma
    and pleasure of John Major’s Britain, jungle pirate radio’s more routine demands
    were in-time or higher tempo than contemporary capitalism’s rhythms and desires.


    Jungle pirate radio was the structure of feeling for a generation, never far from
    its headlines and media panics, in the annals of cultural history that rearrangement
    of diasporic social and sonic forms is a mere murmur. Between the terminal burn
    of Tory Britain

