    ## 5 结论：从左翼批判到替代性文化政治


    当纳迪亚·罗斯（Nadia Rose）2017年在伦敦地下村（Village Underground）现场表演时，现场气氛昏沉，但 Snapchat 给了她热烈。她从观众转向说唱圈（rapping
    circle）和社交媒体，在不同的存在模式之间切换。从冷漠的人群，她在圆圈的温暖中重新充电。她所追求的圆圈是数字媒体的触感。房间拥挤却空虚；即舞圈（cypher）深邃而亲近；社交媒体迷人且永不满足——在这三者中，即舞圈和社交媒体在对话。前者补充了后者的缺陷，后者则需要前者支持。但当现场观众退居背景时，社交媒体正处于上升阶段。肖尔迪奇（Shoreditch）夜晚那未竟的爱意便围绕此展开。


    说社交媒体“给了我们爱”是一种陈词滥调。这种调调之所以有意义，是因为我们确实感觉到社交媒体提供了某种类似于爱的东西——至少在我们对当代交易式的、互惠自我肯定的爱的理解中。说社交媒体给了我们爱，是确认人类关系的深层亲密潜力已简化为屏幕媒介的消费主义。它标志着社交媒体的情感环境如何复制这些感受。说社交媒体给了我们爱，是说它不仅复制了爱，而且免费轻松地提供爱。在一个即使是交易式的**声音亲密**（SONIC
    INTIMACY）之都往往难以获得的社会里，说社交媒体给了我们爱，标志着对社交媒体提供提供的痴迷。正如所有的交易之爱一样，社交媒体之爱永远是不够的。


    说社交媒体为我们提供了一个观察声音亲密变化的窗口。在本书的背景下，说社交媒体给了我们爱，是承认 YouTube 视频电影提供了一种亲密的交易；这种交易永不完成，它强化了社会否定；这种交易在舞池集体的多重验证中找到被否认，而非在自我之中；这种交易更多地趋于网络化屏幕和不安界面的情感光环，而非趋于夜晚的触觉律动；这种交易是如此具有压倒性，以至于人们需要蜷缩在即舞圈中以免被撕碎。但听！在蜷缩的即舞圈中，我们找到了一个并非死亡、依然充满力的拥抱。即舞圈的拥抱是相互的、民主且水平的。当它支持社交媒体的缺陷时，它肯定了声音生命力对生活的必要性。


    在肖尔迪奇，人们可能会开启对我们可能追求的学术类型的讨论来结束我们的分析；在那里，终点是起点，指向我们可能更好地避免的评估形式。最后一章开始对本书所采用的文化分析方法进行辩护——即为什么一种关系性的文化分析方法是重要的。这种方法为黑人散居声音文化的替代性文化政治提供了洞察。本章结束于对这些声音亲密关系的评估，并澄清了其中的关涉。


    毕竟，我们问什么问题、如何提问以及如何对答案进行反思是重要的。当威权主义、民族主义和种族主义在流行文化、英国及全球汇合时，我们的注意力必须坚定。我们是否为替代性的生命流提供了余地，还是在无意中重写了产生威权主义、民族主义和种族主义的相同假设？这个提问可能显得突兀，考虑到随后的评估是对批判性左翼学术的批判，但它仍然是必要的。因为虽然批判性左翼学术是在针对民族主义、威权和种族主义右翼的反意象中磨练出来的，但它往往在相同的认识论基础上进行。


    > ¹关于爱的更广泛的对话，参见 hooks, 2000。


    批判性学术是那些最倾向左翼的人文和社会科学学科的日常便饭。关注资本主义和阶级的学科探讨我们如何从自己的劳动、彼此以及我们周围的星球中异化。关注种族主义和殖民主义的学科探索种族和帝国如何运作，将人类组织成等级制度以达到统治的目的。这些方法相互重叠并共享许多特征。两者都与中心的主导理想人物保持批判性关系。对于关注种族和殖民主义的人来说，这个人物通常是围绕种族化的人性、道德和进步观念而发生暴力转折的白人殖民人物。对于关注阶级的人来说，资产阶级启蒙运动的人在解释财产和资本主义的暴力方面发挥了作用。在这两种情况下，这些中心的外部都是种族化和工人阶级的人，批判性学者以不同程度和不同抽象层次试图将其解放。


    这些学术形式以其各种伪装，近一个世纪一直是批判分析的默认模式，可以说在 20 世纪 70 年代到 90 年代的后结构主义和后殖民主义达到了巅峰。虽然后结构和后殖民分析对于学者活动家维持更清晰界定的政治立场（例如关于种族主义，Sivanandan
    1990）存在问题，但后结构主义和后殖民主义也发展出了日益精炼（加工过的）语言和框架，通过这些框架可以理解种族和阶级暴力、帝国、异化、主体性和权力的问题。这种复杂性部分是为了自身，但也回应了晚现代资本主义社会社会力量的动态纠缠。


    > ²详情请参见 Ali and Whitham 2018; Bakkali 2019; Bhattacharyya 2017; de Noronha 2019;
    El-Enany 2020; James 2014; Jones al. 2017; Kapoor 2018; Kundnani 2014; Rashid
    2016; Trilling 2015; Valluvan et. 2013。


    2008 年后的“最后一个十年”，金融危机、紧缩、马克·杜根（Mark Duggan）被杀害、“难民危机”、预防计划（Prevent）和敌对环境——新千年被没收的希望感觉如此遥远.¹消除儿童贫困的、重新分配以及多族裔英国的构成，现在已成为气候否认、假新闻和民族主义威权主张的雾中微弱的记忆。而这里出现了一种更具进性的批判性学术。曾经根于斯图特·霍（Stuart
    Hall）、阿夫塔尔·布拉（Avtar Brah）等人的后结构分析学派出现了新的裂痕。斯图特·霍2014年的去世在某种程度上标志着分水岭，学者们（身份为活动家）离开了后结构的框架和语言，转向对反殖民和反种族主义文本的特定解读。在这里，殖民和反种族主义理论的标准被重新审视、分离并精简，以适应更尖锐立场的需求。法农（Fanon）变成了《大地的隶者》（Fanon
    1991）的一个版本，鲍德威（Baldwin）则对《下一次火临》（Baldwin 1973）进行了部分提炼。


    说这些分析形成在与主流文化相同的土地上，并不是意味着它们朝着相同的方向推动。相反，事实确实如此。毕竟，批判传统致力于揭露种族和阶级等级制度并揭穿它们的神话。倾向于这种方法的学者也对种族和阶级现代性划定的类别和权力结构进行建模，并展示它们是如何破产的、在历史上如何被击败的以及在当下如何运作。这种批判本身就是一种映射。它们的批判通过与主导运动保持负相关关系来维持——有时称自己为“反抗”。也就是说，日益激进和反动的民族主义和种族主义形式，以更具果断的反种族和反阶级立场为特征，但接触的术语仍然由种族主义和资本主义暴力设定。


    为了阐述这一点，请考虑另一种针对反种族主义的**左翼批判形式。这种针对资本主义的左翼批判也将工人阶级框定为白人（通常写为“白人工人阶级”）。


