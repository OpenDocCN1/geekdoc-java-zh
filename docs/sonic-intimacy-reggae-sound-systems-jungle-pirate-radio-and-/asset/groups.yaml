    现代且种族主义的观看与被看体制。但对于艾利森来说，《隐形人》从未成为他人中的一个身体。尽管他通过声音被放置，在阿斯特朗音乐的间隙中移动，在唱片机的震动下移动，但关乎的仍然是人类生活。说话者对电波的震动与隐形人的耳膜超越了意义，因为它们使得技术的维护和人类的起始变得难以定义，¹，但人类仍然是政治上关乎的核心。


    ## 亲密性


    与声音和音学的研究相比，亲密性在文化研究中并不那么常见，尽管它在英语文学、心理学和精神分析中已非常成熟，在社会学中也稍有涉及。当然，其中很大一部分涉及爱、性欲和浪漫。虽然这些关系的动态与本书相关，但后续页面中讨论的亲密形式与亲密性的其他应用有更多共同点：一个亲密的房间、一种亲密的声音、一种亲密的感觉、一种亲密的关系、亲密的知识，实际上一种亲密的氛围。正如拉丁语
    *intimus*（亲密的最高级形式）一样，本书中的亲密性关注的是最深处、存在、完整性和特权知识，且始终处于关系之中（Sexton and Sexton 1982:
    2）。


    西方关于亲密性的辩论通常建立在前浪漫主义/浪漫主义/现代的时间线之上，对应于与上帝的亲密如何变为对他人灵魂的痴迷，随后变为一个自我完善的计划（Giddens
    1992: 2; Elouz 2012: 39; Zeldin 1994: 125）。这些辩论的主体通常是欧洲人，其中浪漫主义在文学分析中尤为突出（Yousef
    2013）。


    在这些欧洲中心主义的叙述中，财产、家庭和个人对自身身体的拥有被发展为亲密性的场所，以及欧洲和西方自由的角落（Lowe 2015: 28）。浪漫文学中反映的亲密房间、物品和内在（个人）思绪并非偶然的装饰。它们是资产产阶级个人从异化世界撤退的特权场所，同时也是资产产阶级权力再生产的场所。资产产阶级的亲密涉及财产的再生产，同时也与资产产阶级自身的再生产相联系。波伊姆写道，欧洲资产产阶级的性亲密发生在他们“无数的陈列柜和抽屉”的围绕之中（Boym
    2001: 255）。


    亲密性、自由与欧洲中心主义资产产阶级权力再生产之间的关系，取决于服从的同步再生产。那种服从是通过种族和帝国组织的。在欧洲殖民语境下，根据西方男性的性欲对印度人、中国人和黑人女性进行符号性的过度性化，其功能是建立白人女性家务的亲密家庭秩序（Nandy
    1983: 32; Stoler 2010: 8）。19世纪美国将“亲密女性化”视为种姓、谦虚和温顺的形象，通过对黑人女性特性的过度性化产生类似作用，将其作为对白人秩序的构成性威胁（Carby
    1987: 27）。当白女性象征着带有文明、家务和财产内涵的家庭的亲密性时，印度人、中国人和黑人女性则象征着它的负面对立，往往通过诉诸白男性的低级欲望来实现。


    被殖民者的亲密性也受到种族和殖民秩序的建构。仆人和奴隶被剥夺了反思内在自我的时间和私人空间，家庭、浪漫和亲属纽带的结构也与不同。事实上，正如性暴力记录所揭示的那样，亲密本身往往是暴行和控制的场所²。正如
    Lowe 所指出的，正如存在对人类的殖民划分一样，也存在“从内在和个人意志的自由人格领域，到对财产和家务的所有，在历史上具有差异的进入途径”（Lowe 2015:
    18）。


    尽管如此，亲密性在殖民和受种族压迫的人中仍然存在，处于与白人资产产阶级现代性发展不同的另类历史关系中。否定这一点，就是将人类的亲密性限制为一组赋予种族主导地位的规范性关系，并同时抹除了种族和殖民暴力受害者产生亲密性的可能，这同时也消除了人性的本质。正如弗雷德里克·道格拉斯和普里莫·列维等作者所明确的那样，那种在压迫性种族暴力系统中依然存在的亲密性，证明了其持久的人性特质（Douglass
    2001; Levi 1988）。


    然而，在社会科学和人文领域，趋势与其说是理解亲密性的种族和殖民偶然性，不如将亲密性以及许多其他纳入私人与公共、女性化与男性化、内在与外部、情感与理性的自由和欧洲中心主义二元对法中，并将其作为对良好民主规范讨论的基础（Habermas
    1989）。


    这些重复的方法引入了一系列分析错误。这些包括以下观点：公共领域是不亲密的；公共关系不涉及亲密性；过度的亲密（隐私）导致社会联系缺乏；以及亲密性过少会导致疏离（Dean
    2005; Putnam 2000; Turkle 2011）。从这种意义上说，亲密性不是公共或私人的问题，而本质上是最细微的姿态所标记的（Giddens
    1992: 3）。


    劳伦·伯兰特通过参与晚期资本主义的亲密性，弥合了亲密与公共之间的虚假区别。通过“亲密公共”的概念，伯兰特探索了情感被消费的方式（Berlant 1998;
    2008; 见2011）。这打破了将亲密性视为积极或破坏性的价值化。但伯兰特仍然受到将亲密性视为良好民主基准的阻碍，这错过了亲密性的许多维度。本书对待亲密性的方法是不同的。通过一种关系方法，它避免了二元论分析的终点。


    ## 音频亲密


    ## 引言


    （注：文本接下）


    亲密性的性质取决于关系而非先验范畴。


    在心理学著作中，当个人拥有自我知识（亲密的且内在）并能与他人分享这种知识以获得回应时，这种亲密性（Fisher and Stricker 1982: xi）。因此，亲密性是关系的产物，或是人之间的互动，正如
    Milner 指出的：


    每个亲密者与他人保持完全存在的能力，使他们之间的互惠是如此基础，以至于只需最细微的眼神、微笑或语调即可被立即且明确地捕捉。（Wilner 1982: 24）


    亲密性不是公共或私人的问题，而本质上是最细微的姿态所标记的。从两个人扩展到集体，这种互惠可以影响整个社会情的氛围，以至于它构建了互动本身而非仅仅是其产。它也可以在产生它的姿态缺失的情况下持续，使得它先于那些行为。在这里，它不仅被产生，而且具有生产性：一种共享参与的积极过程，而非简单的感受或状态（Sexton
    and Sexton 1982: 7）⁷


    正如亲密性在集体社会情中被产生并具有生产性一样，它也通过物品维持。在书中，我们在《我在哪里寻找你》中盖尔·刘斯探索了亲密性的这一维度。她考虑了音乐（加流行歌曲）及其相关技术（78、45和33转唱片以及录磁带）如何作为亲密的声音对象，让她在变化的种族化和裔伦敦西北背景下（涵盖黑人、白人、加人和英国人）体验与父亲的关系。对于刘斯来说，那些声音和声音技术之所以亲密，是因为它们与她父亲以及她自己维持的关系，是因为她与这些材料的关系方式，以及个人情感承载其中的方式（Lewis
    2012: 138）。

