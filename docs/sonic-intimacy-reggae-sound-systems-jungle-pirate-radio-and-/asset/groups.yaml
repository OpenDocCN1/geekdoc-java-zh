    \ foundation is then, relational. But to deepen our appreciation of intimacy as\
    \ a concept we must also elaborate on its other particular qualities. The bulk\
    \ of scholarly works on intimacy sidestep or peruse intimacy’s make-up rather\
    \ than elaborating on. They tend to employ intimacy in place of effect or as a\
    \ popular term to collect dynamics of private life. This limits the analytic potential\
    \ of the concept.\n\nDeveloping a thicker conceptualization of intimacy requires\
    \ expanding on its defining qualities. The defining qualities of intimacy are:\
