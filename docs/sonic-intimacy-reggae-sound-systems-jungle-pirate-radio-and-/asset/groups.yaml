    go to those blues dances and promote for [Four] Aces ... I didn''t see it ...
    but none of my white friends would come. When the rave scene came''s appealed
    to me. I could go somewhere where my black mates would go and my white mates,
    and that''s the beauty. DJ Vape interviewed Cordell 1997: 5.06 mins.


    Jungle pirate radio stations reflected this. Photographs taken at Kool FM in 1994
    and 1995, show MC Remadee, Smurff, DJ Trace and DJ Ice, Busey G, Skibabee and
    Tekka, Murff, DJ As Slippery – black, mixed race, Turkish and Asian in convivial
    revival (Clifton 2015). As Shy FX and UK Apache’s ‘Original Naught’, it was now
    possible for a black British producer and British Asian MC (of mixed South African,
    British, Arab and Indian heritage) to rhyme in cockney, Jamaican patois and dub
    ragga, over hip hop beats, and sound like London with only minor concerns for
    cultural authenticity (24H Canal + 1994).


    These forms of conviviality were endemic to the rave. At One Nation''s New Year''s
    Eve party 1997, MC Dett explains, ‘One Nation, especially with being in London
    and everything. It''s very multiracial, white, black, Chinese and Indian heritage.
    That''s why it''s called One Nation’ (MC Dett interviewed Cordell 1997: 0.18 mins).
    The open sartorial codes encouraged these movements. Reduced social tensions.
    That didn''t mean that racism was eradicated, but in the rave there was a pervasive
    sense that it didn''t matter much as who you were or where you are from, ‘if the
    music''s running, its running’ (Zinc interviewed Cordell 1997b: 2 mins..


    The sonic condition of jungle pirate radio, and the wider culture, was key to
    these intimacies. Whereas E gets some plaudits for the convivial co-presence of
    the scene, jungle''s holds more sway still. This was partly on account of the
    music. The hybridity of jungle helped people from different walks of life hear
    themselves


    ## JUNGLE PIRATE RADIO AND HYPE 71


    and each other. But importantly, too, the sonic condition of jungle means that
    they couldn''t always see each other at the same time. Picked up aurally through
    radio, records and raves, racial markers (like skin colour) were not easily drawn
    from the sounds surface. Evidently, jungle was a black sound. No one disputed.
    But it was a black sound that could not easily be closed down by white identifications
    of the black Other. In fact, the sonic condition of jungle ensured that any such
    act of racial authentication was error-prone, and that disruption was celebrated
    by black and white producers alike.


    "People can''t say jungle''s a black thing, they can''t say it''s a white thing.
    I could play you twenty fucking tunes and ask you which colour position made it,
    and you wouldn''t be able to tell me." (Goldie interviewed in Taraska 1996)


    ## From craft to DIY


    It was the excitement of it all, building something with a few transistors, a
    car battery, soldering iron, buying cables, making our own aerials, setting it
    all up, getting it to work and then listening at home. (Belle-Fortune 2004: 223)


    Jungle pirate radio was more DIY than craft. The continual threat of regulator’s
    raids mitigated avenues of refinement. Regularly removed transmitters, both expensive
    and laborious to replace, ensured an emphasis on pragmatism. While the radio technology
    remained amenable to the tinkering of craft – indeed, the development of radio
    owes much to the tinkering of amateur enthusiasts¹² for most pirate radio stations
    the emphasis was on tinkering and more staying on air.


    This shift from craft to DIY is also culturally explained. By the mid-1990s, the
    budding jungle artist had an array of sound and music consumables available to
    them. Affordable JBL and Cerwin Vega PA sound systems obfuscated the need to build
    your own boxes. Bedroom studio equipment provided the means to build your own
    boxes.


    ## SONIC INTIMACY 72


    The second half of the 1990s jungle was becoming a viable business. When, in 1997,
    Guy Richie used EZ Rollers’ ‘Walk this Land’ on the blockbuster film Lock, Stock
    and Two Smoking Barrels that became louder. Now, creative industries styled the
    offices of L. T. Bukem’s Good Looking Records; and Bukem, Roni Size, Goldie and
    a few others were, and remain, celebrities (Modern Times 1996).

