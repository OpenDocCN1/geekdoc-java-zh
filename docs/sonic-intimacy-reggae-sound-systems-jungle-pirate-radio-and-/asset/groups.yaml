    启蒙运动文学，恰恰因为它与启蒙运动处于边缘关系。它的记录并非主要存在于教科书中（尽管目前该领域已有大量的文献），而是存在于其积累的传统、表达方式和政治中，其中许多是听觉的。


    这并不是要主张声音与文本之间存在清晰的划分，并以此推导出黑色与白色的对立。这种二元的混淆对于思考现代性中“听觉亲密性”（sonic intimacy）的转型实际上“毫无帮助”。听觉与符号仍然交织在一起，两者都是现代性种族结构的一部分，正如离散音响文化既抵制主导社会秩序，也可能复制它。


    为了引出这些纹理与紧张关系，本书将声音视为一种“物体”或“效果”，而是一种“关系”。因此，声音被作为“声学研究”（sonics）来讨论。听觉并不等同于“声音”（sound）。相反，它关注声音如何被文化化——听觉既包含了声音的结构化物质性，也包含了听觉主体；当考虑到振动时，听觉主体变成了一个感受主体。通过这种方式，听觉与主体相关，并延伸到他们的日常听觉/感受语境和社会组织中，也就是说，关乎文化。听觉是文化化的物质。


    在现代学术中，视觉往往主主于听觉——无论那是声音、振动、音乐还是噪声。主导 20 世纪现代文化讨论的是视觉，而非听觉。从广告牌牌、电影投影到平坦显示屏，现代社会被视觉所浸透。正如居··德波在《奇观社会》（*Society
    of the Spectacle*）中所记录的那样，这深刻影响了我们的认知和存在方式，将声音（作为光一样无处不在）推向了公共知识中更加边缘的位置（Debord
    2002）。


    因此，理解现代性中的听觉是充满的；声音的质量不易那些诞生于现代性并倾向于（且往往痴迷于）视觉的学术学科所捕捉。但对对视觉的痴迷进行评论，不仅是指出对具有文化背景的光影安排的一种分析倾向。事实上，对视觉的痴迷更为特殊。无论是广告牌还是书的一页，这种痴迷特别是针对“文本”的——也就是说，它关注的是：


    # 引言


    逻各（logos）——符号、意义化等。在文化研究中，这种影响无处不在。从巴特（Barthes）的符号学和巴特勒（Butler）的文本性，到霍尔（Hall）关于表征的研究，以及迪克·赫伯迪奇（Dick
    Hebdige）关于青年亚文化（特别是朋克）“充满意义”的论述（Hebdige 1979），是对视觉的文本化解读解译现代性的内在意义提供了密码。事实上，这种文化方法影响了日常生活中对声音和音乐的描述（DeNora
    2000）。这种对视觉-文本的预测并没有因为耳朵被共同地（父权制地）归为一个脆弱的器官而得到帮助；它是一个可以被渗透的器官；一个无法像眼睛那样闭合；一个无法被掌握以批判性地关注现代生活危险的器官（Boutin
    2015: 13–14; McLuhan 1967: 32; Simmel and Lefebvre 1971）。


    这并不是说声音与现代性的关系从未被注意到。与生活的文本化解读关联最密切的学者们也通过声音探索过现代性。本雅明（Benjamin）和列斐伏尔（Lefebvre）对城市的声音都有个人化且富有诗意的反思。本雅明关于弗赖堡、马赛赛和柏林的写作展示了城市的回声如何为城市频谱增添了可能性。他关于那不勒斯的文章探索了建筑、社会、宗教、历史、情感、色欲、触觉、嗅觉和声音的渗透性节奏。声学从他的书页中溢出，正正如它们从拥挤的居所和公共街道中溢出来一样（Benjamin
    1979）。列斐伏尔的作品——他在 1992 年去世前的最后遗作——关注了地中海小镇的节奏。列斐伏尔通过设定一个“漫游者”（flâneur，即“节奏分析师”），揭示了他的听觉敏感性，这种敏感性对时间的关注超过了对空间的关注，对情绪的关注超过了对图像的关注，对氛围的关注超过了特定事件（Lefebvre
    2004: 87–8）。


    （此处省略了原文中重复的乱码片段，已逻辑整合）


    ## 听觉亲密性 (SONIC INTIMACY)


