    # THE REGGAE SOUND SYSTEM AND VIBE


    can be collected. As the sound system collects and connects people, it verifies
    them through sonic and lyrical practices, reinforcing the sense of co-presence.
    As Back notes, sound system deejays validate the mutuality of the space by relaying
    ‘the ordinary humour, triumphs, tragedy, and despair of everyday concerns’ back
    to the audience (Back 1988: 149–51).


    These forms of presence were so central to the sound system that they were carefully
    replicated in the symbolism of the dance. Lloyd Coxone explains:


    > “Without having those boxes and amplifiers the way we have it, it wouldn’t create
    an atmosphere’, he explains. ‘You understand? It does create an atmosphere with
    the wires stringing over and the many boxes. You have to keep the sound in those
    boxes as it is because that represent sound’. (Lloyd Coxone interviewed in Dineen
    and Caidan 1981)


    Coxson drawing attention to the ways in which speakers, wires and people are arranged
    reinforces co-presence. The wires connecting the speakers to the amplifiers are
    hung from the ceiling, creating a web above the dance floor, providing a canopy
    for the dancers below as the speakers form a coral.


    Circulating through those spaces were intimate knowidges pertaining to the prevailing
    social context and to a wider diasporic oeuvre through black people in Britain
    understood their relation to the Caribbean.


    These intimate knowledge were by inference not aloof or disconnected but your
    ‘daily livity’, ‘the topic of the day’. Blacker Dread explains,


    > It was what going on innit. That was the topic of the day so everyone would
    be involved in that because that was your daily livity. It wasn''t nothing new.
    You weren''t going there to learn something you didn''t know. It was just enhancing
    and making people aware of the SUS laws and things like that. The deejays used
    to tell you about ‘man you go to the road and police stop you and then a g man
    plant you, or a g man do this to you or dat to you’. In the New Cross fire, we
    were there on those marches. 1986 playing Anti-Apartheid – 100,000 people in Clapham
    Common. We played at those things. Eventually we became members of the ANC and
    we played for the ANC at Notting Hill Carnival for 17 years non-stop, every year.
    We didn''t play on the street we played on the back of a truck. But that was politics.
    What we were doing making sure people were aware of what was going on. Standing
    outside Barclays Bank in Brixton and telling black people not to go into Barclays
    Bank because it was an Apartheid thing. We did all of that and it was a part and
    parcel of your daily living because it was what was going around you. It was nothing
    different. (Blacker Dread interviewed in Bass Culture Research 2018)


    In the dance, these intimate knowledges circulated as wisdom. Sociologist and
    reggae deej, Lez Henry explains, the deejays possessed the ability to locate me
    within the narrative [and] through their particular skills as wordsmiths actually
    had me considering whether the thoughts were theirs or my own’ (Henry 2006: 201).
    Through the sound system, ravers and sound system personnel knew each other’s
    minds, developing what Jah Shaka refers to as ‘intuition’ – the ability to know
    another mind and ‘telepathy’ – the ability to do so through diasporic space and
    time (Jah Shaka 2014).


    These words were carried in the deejay''s words, and in the phonics of the sound.
    ‘Bass history is a moving/is hurting story’, Linton Kwesi Johnson reminds us,
    directing attention to the affinity of bass notes with the black diasporic experience
    (Johnson 1980). In doing so, Johnson simultaneously recalls the double bass in
    jazz, the Fender guitar in Jamaica and the recording techniques


    # THE REGGAE SOUND SYSTEM AND VIBE


    of Sylvan Morris in Studio One (Bradley 2000: 309–10; Veal 2007: 98)¹ as he also
    tells of the ‘frightened, frightening, fraternal ‘lower frequencies’ of democracy
    and beyond’ (Callahan 1996: xxxiii).


    But so, these were more immediate wisdoms. Blood Shanti from Aba Ashanti Sound
    System comments:


    > I was born in England, with inner city vibes. So many artists strive for a Jamaican
    sound, or an American sound, but I feel that the wrong road for UK artists to
    take. We''ve been born here and we must create our own sound forms, and put our
    stamp on the world. Actually, when we music we reflect and echo what we see all
    around us, from the point at which we wake up every morning and looking around
    us. When I go outside, I see city smoke everywhere, traffic, darkness, no birds,
    no trees, no nature. I know that some Jamaican see our music here so hard and
    harsh, but we''re in a concrete jungle, you understand, and I can only express
    myself from the way I live. (Whitfield 2002)


    It is normative to note here that the reggae sound system starts to convey a story
    of the experience and a story of Britain itself – one that extends onward into
    the jungle and grime sound cultures also discussed in this book. This is not to
    say that Britain is benignly adopting black cultural form through the Aba Ashanti
    Sound System – after all, sound systems were still too wound with danger in the
    white popular imagination for to be the case – but at the same time, intimate
    sonic knowledge of daily life, racism and class politics played by the sound system
    is shaping the levity of the multi-ethnic city.


    On the dance floor, white and Asian found themselves in the Other, temporarily
    suspending the racist organization of British life. The sound system was no crucible.
    A smelt amalgam of the city did not pour onto the streets as the dances called
    time. In the context of heightened racism, questions persisted around how black
    cultural symbols could be used and adopted by white people, what was acceptable
    and what was not. By this did not recount shared pleasure of these spaces or the
    multicultural openings and porosities that they occasioned.


    ¹Ellington popularized the upright bass (the precursor of the electric bass),
    preferring it to the tuba for its explosive qualities. He also introduced paired
    bases, experimented with ‘crowding the mic’ technique to get the most explosive
    sound from the instrument (Pekar 2010).


    # SONIC INTIMACY


    The extent to which they did varied from place to place. Dances in Coventry, Birmingham
    (Balsall Heath) and different neighbourhoods in north-west, south and south-east
    had different dynamics in this regard (Back 1994; Bradley 2000: 254; Coxsum 2018;
    Jones 1988: 120).


    # Vibe/ration


    Sometimes at dance ‘I don''t know what the problem is, could be the place, or
    could be the sound you are playing with, could be anything but you don''t feel
    right, the vibe''s not right’. (Bikey by Sir Coxsome interviewed in Dineen and
    Caidan 1981; my emphasis)

