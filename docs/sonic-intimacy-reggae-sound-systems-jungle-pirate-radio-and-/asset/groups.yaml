    # SONIC INTIMACY


    love often feels hard to come by, to say social media gives us love signals infatuation
    with what social media provides readily. As with all transactional love, social
    media love is never enough.


    To say social media gives us provides a window onto changes in sonic intimacy.
    In the context of this book, to say social media gives us love is to acknowledge
    the ways YouTube video movies provide for an intimate transaction; a transaction
    that is never complete, that reinforces social negation; a transaction that finds
    denied in multiple verifications of the collective of the dance floor than it
    does in self; a transaction that moves more to the affective aura of the networked
    screen and restless interface than it does to the haptic rhythms of the night;
    a transaction so overwhelming one needs to hunker in the cypher so as not be pulled
    apart. But listen! Hunkered in the cypher we find an embrace that is not dead,
    that is still vital. The cypher''s embrace is mutual, democratic and horizontal.
    As it bolsters the deficiencies of social media, it affirms the necessity of sonic
    vitality for life.


    One might in Shoreditch draws our analysis to a close by opening a discussion
    on the kind of scholarship we might pursue; where endings are beginnings pointing
    to forms of evaluation we might better avoid. This final chapter begins by making
    a case for the approach to cultural analysis adopted in this book – for why a
    relational approach to cultural analysis is important. That approach has provided
    insight into the alternative cultural politics of black diasporic sound cultures.
    This chapter ends by evaluating the sonic intimacies of those and by clarifying
