    # The sonic intimacies of grime YouTube

    music videos


    From 2008 onwards YouTube became the centre of grime’s media

    ecology, displacing raves, pirate radio, record shops and cable TV.

    The screen-based dimension of this wasn’t unprecedented, black

    music video culture was already well established in Britain, but the

    affinities between music video, mobile phones, Internet platforms

    and fans were new.


    In terms of presence, earlier relations of kinship and

    community remained, the intimacies of the sound system and

    pirate radio were increasingly absent. Being on the dance floor

    or in radio call-ins with people like you was now secondary to

    deterritorialized dialogue. Verifications of yourself and others come


