    # 引言


    这种爵士乐与歌剧之间、以及埃利森与歌剧演员之间的对话，不仅承认了他们在文化和种族上的差异，也承认了他们在制度、实践和表达方式上的相似性。通过音乐，这栋公寓楼被构建成美国生活矛盾的微观世界；通过这个地点，种族与文化的清晰二元性（黑与白、爵士乐与歌剧、非现代与现代）可以被富有针对地质疑。他的手段之一是技术，他现代的高保真和爵士乐录音突出地质疑了以欧洲为中心的现代性神话。


    然而，书中对他公寓楼内声音亲密关系的描述，揭示的不仅是对声音、亲密关系以及现代美国种族矛盾的敏锐参与。与此同时（尽管这并非埃利森的批判意图），它还展示了父权制如何通过这些关系发挥作用。尽管它们并不是文章的重点，但男性气概和暴力因素实际上是该文章的核心。这篇短文既是对种族的讨论，也是对掌控、控制和统治的探讨。毕竟，与歌剧演员的竞争是暴力的。埃利森将扩音音乐武器化，以重新确立他对共享大楼以及对歌剧演员本人的主导地位。在此过程中，他展示了对技术的掌握；对与爵士乐器器对应的高保真设备的掌握。男性作为福特主义（以及后福特主义）社会中控制和统治的现代媒介的技术认同。


    在这里我们再次看到声音亲密关系是如何被社会生产并在文化影响的，人类、技术与声音之间的关系如何包含了友好与暴力的流行纠葛。这样阅读埃利森的《与音乐生活》，为理解书中讨论的声音亲密关系提供了一个桥梁，以及它们对种族、日常生活和男性气概与“技术的亲密纽带”（Wajcman
    1991: 137）的共同评论。


    # 本书结构


    本章概述了书中如何理解声音亲密关系，并指出了声音亲密关系对于黑人离散声音文化而言意味着什么。为了更详细地解决这些问题，接下来的每一章都探索了一种不同的声音文化和汇合——雷鬼音系统、丛林海盗无线电和
    grime YouTube 视频。每一章都通过其技术、社会和声音关系建立了声音文化，并探索了其在存在感、知识、完整性和深度方面的声音亲密关系。章节的结构使得它们可以不按任何特定顺序阅读。如果你对丛林或海盗无线电更感兴趣，可以从这里开始。然而，为了理解关于转型的整体论点，需要阅读所有章节。毕竟，本书与其说是对每种离散声音文化的指南，不如说是关于它们之间运动的论证。¹
    该论证连以及针对当代种族研究对书中所用方法的辩论性辩护，都汇集在结论中。


    贯穿章节的是对声音亲密关系在晚期现代性中转型时所起作用的评估。本书探讨了从 dub（dub）的深度到……强度的转变。


    ¹也就是说，本书不被读作英国黑人离散音乐文化发展的全面指南。关于这段音乐历史更完整的图景可以在其他处找到（Melville 2020）。它既不是雷鬼、丛林或
