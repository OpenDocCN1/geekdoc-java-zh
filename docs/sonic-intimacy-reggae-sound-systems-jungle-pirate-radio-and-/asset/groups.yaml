    # JUNGLE PIRATE RADIO AND HYPE


    and the morning after. In a wonderful piece of radio from early morning summer
    1994, DJ Sparkie on Freedom FM reflects that wisdom of the dawn city.


    Sound of the Freedom on the FM 89.6. Shouting out to all the DJs out. What''s
    going on? Make your way to the studio! Coming from myself the Sparks. Shout to
    the DJs. DJ Vision if you''re out eating your cornflakes and get your burn down
    the studio. Shout to the Vinyl, all the crew. Get up the studio, you know the
    koo ... Sounds of myself the Sparks, seeing you through for the last two or three
    hours. None of the DJs hurry up and get ''round here. That goes out to the Extreme,
    the Darkzone, all the Mini crew, all the ex-Park crew. Make your way to the studio.
    That''s coming from myself the Sparks. Especially going out to the Vision. Your
    cornflakes down and sort it ... Oye owe! That goes out to the crew. Shout to the
    DJ Vision and his cornflakes. Let''s go ... Shout out to Wayne and all the other
    crew over Upminster, Church, that. Shouts to all you lot if you''re locked in.
    Coming from myself the Sparks. I''ll be seeing you later. See you later. Shout
    to everyone. Hold tight! (DJ Sparkie 1994: 35 mins)


    Sparkie''s words and intonation are capturing the feeling of the city in these
    early hours. Sweaty skin and cold air, tired eyes and early light, ringing ears
    and bird song, fatigue and confusion. Cornflakes, alarm clocks and property flows
    suspended, as your alternative knowledge of your city is served back. DJ Spark''s
    you got!


    # Multiculture


    These presences and knowled catalysed a form of multiculture whose vernacular
    rejection of Island Britain was pointed in its mundanity. Jungle was redefining
    everyday British culture on black terms (Koshick Banerjia in Pilkington 1994 (12.23
    mins)), but more subversively jungle was a multi-ethnic undertaking, confounding
    the very rules of racial order and governance (Congo Natty in Seely 1994: 11 mins).
    Jungle helped the multi-ethnic city hear itself.'
