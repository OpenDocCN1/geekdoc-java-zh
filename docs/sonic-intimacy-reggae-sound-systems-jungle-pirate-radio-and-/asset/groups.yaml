    在舞蹈中，这导致了一种时间流逝的感觉。倒带的重复（当选择器将轨道拉回开头）强化了这种感觉。DJ（Deejays）致力于增强迪布（dub）的强度，使其滑入崩溃的边缘，又将其拉回。DJ
    Kayleb 的言语与这种滑入感相匹配，随后进入迪布的迷幻状态，将你带回现实。


    除了 DJ 的工作，音乐的重复性以及对同一曲目不同版本的延长播放，加上迪布那种冥想式的拥抱，意味着你往往很难记得自己已经跳了多久舞。与之截然相反的是，工业异化受时钟之手的调节，而迪布打破了资本主义的时间氛围，为替代性的想象开启了空间。这种时间性被称为“迪布式”（dub-wise）。


    关于“迪布式”的替代性想象被广泛讨论。对于非洲人 Simba 来说，迪布将你从资本主义剥削的节奏中抽离出来；痛苦的、缓和的、减轻负担并维持生存的：


    > 很多去参加根源舞（roots dance）的人，无论是否是拉斯塔（Rasta），无论是否带着摆脱负担的意图去，跳完舞出来，Simba 感觉不一样。我觉得我所有的问题都消失了。我的肩膀感觉像扛着什么东西，现在消失了。（Afrika
    Simba 在 Folke Wes Wesley 2008 中的访谈）


    但“迪布式”也有其他可能性，它从更根本上改变了你对时间和空间的想象关系，将你置于一个“不同的”层面、另一个星球，让你觉得自己像一个“宇航员”或“深海潜员”（Robbie
    Shakespeare 引用自 Veal 2007: 63），或者确实在日常生活的结构和治理被取代、日常生活的渗透流溢出来时，为舞池上的暴力提供了一个突破口（Back
    1988: 150）。


    ## 音响系统的听学亲密性


    音响系统的听学亲密性与书中讨论的其他任何都不同。在种族主义加剧和阶级边缘化的背景下，它们的特性使得它们能够聚集人群，传递一种平民故事，并为表达和想象的形式提供空间，这些形式与黑人过去及现在所生活的压迫模式格格不入。这并不是一个边缘关注，而是一个从家庭到舞蹈乐趣、该时期英国黑人生活的核心问题；它也没有被定义为补充资本向不断新的商品化领域扩张的新奇事物。相反，它是亲缘、社区和休闲生活的中心，因为它在生产和对话过程方面也是自主的。


    音响系统是一个由技术、声音和社会组成的动态关系系统，在这个系统中，文化的每个方面都与其他方面紧密共存。在社会层面，具有相似的种族主义、阶级边缘化和日常生活经历的人们彼此开放，因为他们发现自己的故事通过扬声器和声音（音乐的和声学的）播放出来。种族主义社会结构冲击着这些空间，但这些空间也足够开放，在舞池中、在声音体验中以及更广泛的社会中产生多族裔关系。


    这种跳出资本主义节奏的表达形式的能力，是由音响系统的劳动和共同生产过程确保的。技术的工艺提供了与工业异化和欧洲中心主义消费格格不入的表达关系。它们允许维持替代性的快乐、技能和注意力的传统，并提供了一个让这些得以完全实现并共同生产的舞蹈空间。


    在这里，对于房间里的人来说，亲密的替代知识可以呼吸和流动。由于智慧存在于工艺过程中，它也随着声音和舞池中的人们而移动。跳舞的人将他们的经历和历史带入房间，在错综复杂的线网下被收集，在那里，这些经历被
    deejays 直觉到，并在扬声器箱和黑人散居低音历史中产生共鸣。


    低音讲述了黑人散居生活的集体故事，当它在狂欢者中移动，将他们与扬声器和工作室聚集在一起。它的震动属性产生了运动、快乐和释放，同时也应对了视觉的、种族的和资本主义的暴政，扩张了相互关系。迪布解构了欧洲中心主义资本时间的听觉感官体验。如果这一切汇聚在一起，舞蹈的氛围很好；这种氛围如此充满，以至于会穿越时间。


