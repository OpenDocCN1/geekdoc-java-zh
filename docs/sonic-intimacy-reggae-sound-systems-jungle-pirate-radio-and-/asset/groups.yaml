    require financial and physical access. With enough money and a few clicks of a
    button almost anyone can express themselves through its closed circuits.


    MP3s, peer-to-peer software, social media platforms and streaming services such
    as YouTube still allow for the sharing of grime music, and therefore for a gift
    economy (Mauss 1966).⁹ Discussed in some corners as a democratic musical revolution
    freeing music from corporate ownership – what this actually entailed for grime
    was the mainstream of dominant capitalism through the alternative infrastructures,
    technologies and relations of the sound culture. As with reggae and jungle, grime
    had sustained through its alternative media ecologies (not through major record
    labels) and through gift economies in which key instruments like ‘Tings in Boots’
    by Ruff Squad (Ruff Squad 2003), ‘Pulse X’ by Musical Mob and ‘The Matrix Instrumental’
    by Wiley (2010 [2001–61]) were shared and versioned many hundreds of times. As
    the alternative media ecologies of grime were displaced by YouTube, these forms
    of economy found affinity with the systems of consumption that characterize labour
    exploitation and profit generation in Web 2.0.


    Prosumption is a concept in media theory used to explain the ways in which the
    consumer of media products also becomes the producer of media, valueized by algorithms
    (Fuchs 2014; Jordan 2015). In the alternative media ecologies of grime were displaced
    by YouTube, these forms of economy found affinity with the systems of consumption
    that characterize labour exploitation and profit generation in Web 2.0.


    > ⁹A gift economy is one in which objects of value are given voluntarily, and
    in which the shared acts of giving form a reciprocal social contract.


