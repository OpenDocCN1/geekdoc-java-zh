    # GRIME 与 YouTube 音乐录带 101


    YouTube 根本不是为了听而设计的。它是为了看，为了让你用眼睛快速地消费而设计的。蓝光的强度刺激了我们体内的肾上腺素，提高了静息心率，引发了一种成瘾且具有强迫性的化学高潮。人们习惯性地扫描算法组织的侧边栏寻找视觉消费线索，松散地吸收播放曲目的明亮氛围，直到点击的冲动占据主导，视频随被切换。


    “通过 YouTube 音乐录带，我们被捕捉的不是我们想做的事，而是我们必须做的事，”媒体学者乔迪·迪（Dean 2010: 21）说道。¹⁶ 这种焦虑的状态加剧了新自由主义社会中存在的更广泛焦虑。来自伦敦东普莱斯托（Plaistow）的音乐家
    Jordan 在谈到音乐录带与日常生活之间的关系时解释道：“人们看着碎片化的信息，拿这个那个，没有人知道如何坚持某件事……（Jordan 接受 Malcolm
    Jones 采访，2018年11月19日）。那些响彻城市的 Grime 音效所包含的斗争性，通过一个专门负责切断深层人类连接的界面被重新加工，这加剧了我们普遍的社会否定状态，是在号召采取行动，而非超越它。”⁷


    YouTube 展现了 Grime 特有的亲密性。MC（主唱）的声音可以被听到，但现在也可以被看到。随着《Conflict》DVD 通过 YouTube 广为人知，听众不再需要像在最初的盗版电台广播中那样去猜哪位
    MC 是哪一个。对语调、音高、节奏和内容的记忆回已是一门失传的艺术。以前朋友之间关于谁出现在某段音轨上的争论，现在具有了视觉上的清晰度。说歌手的身份、他们身体的种族和性别编码，以及他们演唱时的肢体动作，校准着他们歌词游戏的热度和强度……当他们涌向屋顶时是。


    通过这种方式，斗争的开放音效——那些 Devlin 在达根哈姆（Dagenham）发出的召唤——也被折回到了他们曾经跨越的视觉和种族体制中。


    ¹⁶ 互联网——inter-net，全球网。为什么每个人都要登录全球网。你为什么想登录网页。我们唯一捕捉到的网是陷阱，困住了他们。每个人都困在互联网中（Jordan
    采访）。


    ¹⁷ 关于网络化媒体与种族主义掠食者意识形态之间亲和力的补充评论，请参见 Titley 2019。


    正如针对 Giggs 表现出的过度好斗所示的那样，“Talkin'' the Hardest”的视觉编码紧贴在 Giggs 身体上，而这种方式在过去（如同丛林音乐
    jungle 一样），当黑人身份和（由于种族主义联想）犯罪性仅仅是对肤色的评估时，是不可能的。¹⁸


    YouTube 艺术家也开始理解自己在这些平台上的表达，学习社会角色，为摄像表演社会脚本。“他们学会了如何站在镜头前，”Keefe 说道（Risky Roadz
    2017）。随后，阶级化和种族化的愤怒表演变成了有效表达剧库的一部分。犯罪题材艺术家的表演受到 YouTube 音乐录带中种族化情感经济的制约。通过这种方式，那种“最粗俗”曲目的可能性——即声音先于伦理认同——被收紧了但并未消除——从这个意义上说，Grime
    仍然是一个多族族流。⁹


    # Grime YouTube 音乐录带的音频亲密性


    从2008年开始，YouTube 成为 Grime 媒体生态的中心，取代了派对、盗版电台、唱片店和线电视。这种基于屏幕的维度并非空所未有，黑色音乐录带文化在英国早已建立，但音乐录带、手机、互联网平台和粉丝之间的亲和力是新的。


    在存在感方面，早期的亲缘和社区关系依然存在，音响系统和盗版电台的亲密性日益缺失。在舞池上或与你相似的人进行电台互动现在已次于去领土化的对话。对自己和人的验证来自……


    > ¹⁸ 大都会警察启动了一项为期五年的关闭 Giggs 活动（Wolson 2013）。

    > ¹⁹ 这些视频作为黑人裔和工人阶级文化的一部分，无疑清晰地展示了英国自身的方式，这也意味着它们继续打破大众媒体上规范的民族主义、资本主义和种族主义表述。虽然它们可能采纳了一些规范的种族脚本，但它们同样是黑人、多族裔和工人阶级年轻人向大众展示他们自己。


    # GRIME 与 YouTube 音乐录带


    不是通过过去和日常生活的共享音频知识，而是通过在观看次数、评论框和 Google Analytics 数据中留下的印象。这些去领土化伴随着根深蒂固的局部主义。在普遍的新自由主义否定背景下，以及在缺乏促进社交混合的形式（唱片店、青年中心和全市盗版电台广播）的情况下，预先存在的社区内部人士和外人的定义被重新激活。这远离了那个拥抱你的城市，转向了局部竞争而非大都市运动来寻求舒适。


    尽管充满了街道生活的自治中心和局部认同，但随着音响系统被算法取代，Grime YouTube 音乐录带越来越多地是为了别处，是为了 YouTube。这些在街头制作的视频被作为其直接圈子之外的过去来消费。


    工艺和非法 DIY 的替代节奏和表达被手机和在线平台的封闭电路所否夺了。这些锁定的技术也是专有的。长期存在于黑人裔声音文化中的互惠和赠送形式被吸收进他们的消费体系，这些体系恰恰利用了以前持续存在的合作形式。


    这并非全是 Grime 文化所有。音频的冰冷与屏幕的冰冷，以及社会斗争与社交媒体斗争的混合，将替代生活的资源转向了永无止境的压力激活。


