    YouTube 施加其引力）时，要理解其中的关键将变得困难。我们可能会被误导，认为仅仅由于 YouTube 的出现，我们需要开启文本视角。这是一个错误，它忽略了黑人全音声音文化中意义化、情感、声音和光影之间更长期且更具说明性的波动。


    通过对声音的分析来破解语义和文本性对现代性的支配，并不是要否定符号的情感，并不是假设文本与视觉是等同的，或认为视觉与声音之间存在清晰的界限。相反，它是理解声音拥有视觉想象，当你听海盗电台时，这些想象会在你脑海中闪过，就像声音可以穿过墙上的画作一样，且两者都是情感性的。视觉的文本、音学和情感属性，正如声音具有音学、文本和情感属性一样，两者相互关联。正如
    YouTube 屏幕符号化的方式，以及演唱屏幕如何改变 Grime 歌曲学术研究。


    这些辩论中的一些发生在美英两国灵魂乐和后现代音乐的研究中。这些研究关注黑人激进美学和政治随时间的演变。在更广泛的文化研究框架下，灵魂乐被概念化为美国民权运动末期位于黑人文化中的一种“情感结构”，这一时期以马丁·路德·金的去世为标志，并与一种新的意识和文化相关（Iton
    2008）。然而，虽然社会斗争构成了其社会背景，但音乐，尤其是灵魂乐的政治性和亲密性，才是同名概念所指代的内容。


    正如 1968 年发布的 Aretha Franklin 的《Think》中所记录的，灵魂乐既是意义的又是关联的，因为它延伸自一段反对种族主义和白人至上主义的社会斗争。这构成了它的完整性，渗透并连接了多个社会-声音的节点。灵魂乐是“共处”，它在在路上……与那些有同感的人在一起，“与他们一同感受，在他们走过时捕捉他们的灵魂和身体的震动”（Deleuze
    1987: 62）。¹¹ 它们的呐喊和尖叫具有超越音乐编码的声音历史，这些历史是无法还原为“言语意义或传统音乐形式”的。阿蕾莎、詹姆斯·布朗等人的尖叫和呐喊，开启了一段通往世界的快乐与痛苦的历史（Moten
    2003: 6）。¹²


