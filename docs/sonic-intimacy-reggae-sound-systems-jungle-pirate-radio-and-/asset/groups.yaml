    # 听觉的亲密


    大多数格莱姆（grime）音乐录视频是基于销售音乐而构思的。虽然专业表演者和制作人在这些逻辑下工作，但大多数是业余制作，视频的任何变现都是不存在或微乎其微的，尽管他们根据这些标准来定义自己。制作者、技术、表达与知识之间的亲密关系是通过数字资本主义的监管逻辑进行实践和叙述的，而不是通过礼物与手工艺的替代性经济、实践和时间性¹。这是黑人散居音乐文化与技术之间亲密关系的转变。通过声音技术可以实现的表达模式日益由制造商指定。你可以录制并上传你想要的视频，但要与其闭路技术建立一种亲密的创作关系是不可能的。


    # 格莱姆、冷酷、斗争性、强度


    从听觉上说，格莱姆是一种多样化的音乐，节奏约为 140bpm，比丛林（jungle）快或慢，通常采用 4/4 拍子，以 8 或 16 小节为一个循环。它主要由电子音、合成器键盘以及采样的灵魂和
    R&B 旋律组成（类似于英国车库 UK Garage），并使用编程鼓和贝斯线（类似于丛林音乐）。最初，这遵循一种充满了丛林军鼓和���鱼（嘻哈哈的衍生品）的双步车库（two-step
    garage）模式（Charles 2018: 5–6; Painting 2016: 11）。贝斯线源自雷鬼/达布（dub），歌词则从雷鬼吟唱（toasting）和丛林
    MC 延伸，并受到嘻哈哈和说唱的影响。


    这些声音属性与其制作人员的个人背景相对应。Skepta 在托特特纳姆（Tottenham）长大，听着雷鬼、乡村舞厅（dancehall）、斯普特·狗狗、丛林音乐和英国车库音乐。No
    Lay 在她的卧室里写诗和丛林音乐风格的段落（No Lay 2011）。正如 Footsie 所说：“这太深了，我觉得我没有做什么特别的，除了关注已经完成的事情之外”（Footsie
    引用自 Hancox 2018: 34）。


    格莱姆是此前的产物，但它也有自己的故事。格莱姆近期的历史可以通过丛林音乐及其与英国车库音乐的分离来叙述。英国车库关注的是香槟，这在格莱姆早期的视频内容中有所体现。Kano
    在 2005 年在 Channel U 上发布的《Ps and Qs》以伦敦的街道为背景。The Street 成员 Skinner 的客串出现就是英国车库那种高预算、类米西·艾莉奥特式美学的全部（效仿
    So Solid Crew 式）（Kano, 2005）。Roll Deep 的纪录片《One on One with Roll Deep》随他们的首张专辑《In
    the Deep End》发布，进一步发展了这种美学，发展了主要的格莱姆音乐录视频风格（Roll Deep, 2005）。这在 No Lay 的《Unorthoded
    Daughter》视频中也显而易见，廉租房地点、涂鸦墙、胸高的拍摄角度和基础灯光变成了默认配置（No Lay 2008）¹²。


    在舞池中，伴随的双步声音是“肮脏的”、“浑浊的”、“令人作呕的”和“格莱姆式的”（Hancox 2018: 17）。Kano 喊道：“旋转那首糟糕的曲子！”（Kano
    2005a）。这是对旧工业地区土地的呼唤。“我一无所有——我来自地下，来自盗版电台，我来自大地，兄弟，”Dizee Rascal 在 2003 年接受 BBC
    新闻采访时这样说（Dizee Rascal 引用自 White 2017: 15；强调）。Shystie 的张专辑《Diamond in the Dirt》（Shystie
    2004）不仅是对“璞中玉”（diamond in the rough）的双关，更歌唱了伦敦土壤本身的声音历史。这并非对浮华美学的拒绝，而是对东伦敦工人阶级生活物质历史（其工厂、烟灰和油脂）的诉求。这是对英国车库音乐的一种修正主义主张，因为它也是对金雀码头（Canary
    Wharf）洁净玻璃以及那种美学中的社会暴力的清算¹³。


    格莱姆是后工业工人阶级生活的声音记录。地面和大地也通过雷鬼、丛林，实际上通过士乐发挥作用。杜克·艾灵顿的落地贝斯，以及英国雷鬼和丛林舞池向下的沉重贝斯震动在格莱姆中变得更加激烈、粗犷且具有色彩性。这是
    D Double 遇上 Leviticus 的 Burial，Boy Better Know 遇上英国嘻哈 Clash Clashoff 的地方。


    格莱姆也是冷的。20 世纪 90 年代末，RAM 记录了 Andy C、Optical 和 Ed Rush 的丛林音乐，发展出一种金属感的声音。在 Groove
    的英国车库制作手中，它们在这里变得更具代表性。格莱姆通过其“稀疏的、冰冷的、机器制造的节拍从数千个手机铃声中漏出”扩展了这一曲库（来自 Various artists
    2005 内页）。Wiley 采用了艺名“Eskiboy”，并在 2002 年制作了两首基础性的器乐曲《Eskimo》和《Eskance》。这种声音源于我们的处境。这是一种寒冷、黑暗的声音，因为我们来自寒冷、黑暗的地方。这些是城市街道。这种粗粝、冰冷、寒冷感源自童年。痛苦、孤立、在黑暗地方的挫败感我姐姐理解；从我们小时候起，她一直陪在我身边（Wiley
    2017: 79, 255）。


    # 格莱姆与 YouTube 音乐录视频


    Wiley 追踪了《隐形人》（Invisible Man）¹⁴。冰本身是社会否定、孤立和避难的隐喻，是他音乐声音的结构。正如艾利森的温暖之于爵士、黑暗之于光以及在种族主义和资本主义社会背景下的新开始；Wiley
    的冰之于格莱姆、白化、黑暗、社会的荒野性与寒冷。Wiley 的冰是白的却是暗的，而“黑暗”、愤怒和痛苦（斗争性）色彩了格莱姆的声音。格莱姆“关于攻击性和痛苦的，”Crazy
    Titch 说道（Crazy Titch 引用自 Collins and Rose 2016: 35）。从听觉上说，“这可能让耳朵很难受，节拍可能令人不安且残忍”（White
    2017: 30）。正如街头所言：侵略性的、极简的声音从伦敦各地及以外的灯光中震荡；Rinse 和 Freeze 等电台的紧张背景音乐，伴随着无法分类的节拍从
    Lord of Music 或 Conflict 等唱片店门口流出（来自 Various artists 2005 内页）。


    我们在这里发现了 Lethal Bizzle 的《Pow!》那样的歌词冲击，它是“由纯粹的挫败构成的”（引用自 Collins and Rose 2016:
    23），Dizzee Rascal 的《Boy in a Corner》，“一个令人惊讶的出道作，一个愤怒与暴力的投射物，异化的产物”（Hattenstone
    2010）。正如社会学家 Bakkali 所言，这源于痛苦（Bakkali 2019）。这种痛苦源于我们小时候就感到的（Wiley 2017: 29）。这种痛苦源于我们功能失调的家庭，这种愤怒让每个人都感到痛苦（Wiley
    引用自 Hancox 2018: 68）。这种痛苦是格莱姆的，是白色的（Ghetto 2015:15）。


    这种痛苦是格莱姆的，是冷酷的，是强烈的且充满能量的（Wiley 2017）。


    有很多这样的例子。Terror Da Ft (Riko, Bruza 和 Hyper) 的《Cock Back》，一首关于攻击性和冷酷以及速度与能量的歌曲（Various
    artists 2005）。Dizzee Rascal 的停顿节奏、快速节奏对《Body in Carn》的攻击以及与 DJ Slim 的合作。No Lay
    的《Fire in the Booth》。在派对中，这种英国车库的“新双鞋”感转变为格莱姆的“竖起手指看你可以动哪里”（Kano 2005a）。


