    In the same 1981 special edition of NME, Sir Coxone Outternational^4 was asked
    to produce a technical specification of their sound system (NME 1981b).


    # Sir Coxone Outternational Sound System – Technical Specification


    Amplifiers: five pieces of 600 watts (4 x 600 bass valve amps, 2 x 600 treble
    transistor amps) – depending on venue i.e. Brixton Town Hall determines three
    pieces of valve and one piece of transistor.

    Preamp with built equaliser to cover weight, treble, midrange.

    HH Echo Unit.

    Special percussion box.

    Speakers: on average 19–20 bass speakers.

    Many different horns in treble section and small speakers.

    Several thousand yards of cable.

    Seven-ton truck and transit van.


    Each line of the specification, which includes a seven-ton truck and transit van,
    denotes a component of the sound system. As the reader scans the list, the sound
    system emerges from a collection of separate units. We piece together its power,
    its frequency, its weight and size and something about the quality of its sound,
    too. But this list is also an illusion. The technical specification is an act
    of accountability that enables the control and auditing of the sound system as
    much as it facilitates a cultural appreciation of its make-up.


    A cultural understanding of sound system technology is not a technical specification.
    Rather, a cultural approach requires that we place its parts in dynamic relation,
    understanding the sound system more as a system than the pieces of a puzzle. The
    technology of the sound system is inescapably together. Speaker cable is not only
    PVC-insulated multi-stranded copper wire but the conduit for transmitting power
    from the amplifiers to the speakers.


    > ^4Named after the legendary Jamaican Studio One producer, Coxone Dodd, and owned
    by eponymously named British Jamaican sound system pioneer Lloyd Coxone.'
