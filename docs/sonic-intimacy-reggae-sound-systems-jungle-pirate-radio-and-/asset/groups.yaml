    随着德勒兹对情感理论的修正，这一观点在声音学术研究中已得到更好的确立（Deleuze 1990）。¹¹⁰ 情感不仅存在于声音的前认知维度，也存在于意义化之中。例如，我们在音乐的叙事、舞厅的幽暗环境，或者雷鬼扬声器阵列的视觉以及其与读者/观众的生成关系（被记录为兴奋/焦虑）中发现了情感，正如我们在文学、语言和奇观中发现它们的一样（Deleuze
