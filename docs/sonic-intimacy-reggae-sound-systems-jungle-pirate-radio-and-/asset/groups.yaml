    # 格莱姆与 YouTube 音乐视频


    低保真音（lo-fi）（Charles 2018: 7）。“高保真”（hi-fi）指的是一种通过昂贵技术来复制真实和物理音乐那种神话般清晰度的听体验，而低保真是一种以失真为特征的听体验。


    格莱姆（Grime）的低保真音部分归功于制作许多早期器乐曲时使用的 DIY 技术——破解版的 FruityLoops、针对 SNES 的 Mario Paint
    以及用于 PlayStation 上的 Music 2000（被 Skepta、So Solid Crew 和 Dizzee Rascal 使用）（Hancox
    2015b; 2018: 61）。在格莱姆中，这些技术产生的低保真音并非问题，而是对于声音文化更广泛的情感范围在文化上恰当的。正如格莱姆记者 Prancehall/John
    McDonnell 所言：“早期的很多格莱姆制作水平其实很糟糕。我喜欢这一点”（Prancehall/John McDonnell 援自 Collins and
    Rose 2016: 37）。


    这种低保真音被 YouTube 的生态系统加剧了。正如所提到的，早期的 YouTube 视频经常使用手机播放的背景器乐，而 MC 的歌词表演则被录制到另一部手机中上传到
    YouTube（Upcoming Movement 2010）。最终的音频播放剥离了原始低保真器乐中剩余的所有低音，进一步降低了清晰度并增加了失真程度。在某些情况下，原始器乐在最终音频中仅通过其刺耳的节奏以及失真的中音和高音被模糊地认出来。


    视频内容也经历着类似的过程。第三代手机对光的低质量分辨率处理导致了黑暗且充满颗粒的画面，而 YouTube 平台通过其 100MB 的限制限制了分辨率（以及长度）（Gannes
    2009）。¹⁵


    2008 年 9 月之后，这一限制增加到了 1GB。


    # 高音与抒情


    YouTube 音乐视频的低保真声音流派剥离了音乐视频中的低音，强调了高音。在前两个章节中，我们关注了低音对黑人离散音乐的特殊重要性。我们在雷鬼（reggae）音系统中发现了这一点ن最具指导意义之处，在那种系统中，低音本身就是情感调制和政治需求的一部分。当我们追踪这种丛林海盗电台时，我们注意到（撇开强大的汽车音响不），我们处于一个以低音为参照的媒体生态系统中——重低音派对（rave）是电台播放体验的核心。格莱姆仍然是低音音乐，是文化的一部分，但当我们进入
    YouTube 音乐视频时代，随着派对的关闭，格莱姆不再仅仅通过一种对低音的感官关系来定义其核心。


    早期的格莱姆器乐甚至并不特别重低音。在 2000 年代早期一次 Sidewinder 活动的一段 DJ Slimzee 录音带中，Dzee Rascal 呼吁要“听中音”，而不是听低音（Dzee
    Rascal and Slimzee c. 2001; 15.43）。事实上，正如 Hancox 指出的，“对高音文化的推崇在 Slix Rhythm 的《No
    Bass》中达到了直率的巅峰，这首歌被 Ruff Squad、Bossman 以及整个 2005/6 年间的无数移动 DJ 翻唱”（Hancox 2009）。然而，这不仅仅是对不同频率范围的偏好，因为随着手机和
    YouTube 的成熟，低音也在从制作中被主动地剔除。


    音乐录制设备在历史上是根据声音再现技术的频率范围定制的。LP 的特定频率范围决定了录音室声音是如何录制的以及麦克风是如何设计的（Marshall 2014:
    54）。MP3 和手机也是如此。编码成 MP3 格式以通过手机和电脑扬声器播放的音乐同样反映了手机的高音范围。


    这种对高音的强调讲述了一个贯穿雷鬼和丛林（jungle）贝线条的故事。从汽车配备收音机的那刻起（1940 年代和 1950 年代），高音文化、移动性与现代白人声学之间就存在明显的亲缘。这是一个关于重量与无感的问题——黑人离散声音在声音和物理上的沉重感让位于白人消费者运动的可便携性。对于那些重视低音如何传达“移动/痛苦的黑人故事”（Johnson
    1980）的人来说，从沉重到无感和高音文化的转变，从一个充满音响共鸣的城市变为一个被手机嘶嘶声染色的城市，这种变化是深远的。


    然而，这仅仅是部分分析，因为黑人离散声音文化的智慧不仅由低音承载。这种暗示意味着黑人离散生活与单一一种声音频率范围之间存在一种还原性的亲缘。Fred Moten
    通过追踪黑人声学中的高音历史来警示人们不要产生这种倾向——在 Aunt Hester、Al Green、Michael Jackson、Max Roach
    和 Abbey Lincoln 的小鼓声和尖叫中（Moren 2003）。在 YouTube 格莱姆音乐中（参见 Hancock Richard Wiley，雷鬼音乐人和“格莱姆之父”的父亲），小鼓是格莱姆最重要的乐器，而不是低音。但它也通过
    MC 的人声脱颖。


    格莱姆中 MC 文化的兴起部分解释于参与圈子的年轻人的经济现实。当 DJ 是一项相对昂贵的爱好。你需要唱片机、调音器和定期更新的音乐储备。而要做 MC，你只需要你的声音和一个麦克风。所以，De
    La Soul 扭曲了“每个人都想当 DJ”，Willey 扭曲了“每个人都想当 MC”（关于 Wiley 的评论，参见 Hancock 2018: 52）。当
    MC 感叹丛林文化中 DJ 的统治地位时，DJ Logan Sama 占据了格莱姆活动的后台。然而，这种向人声的转变并没有让格莱姆回到对低音的感官关系中。


    [/content]


    由于你提供的文本在结尾处中断了，我为你翻译了提供的所有部分。内容如下：


    [content]


    # 声音屏幕


    YouTube 屏幕重新校准了格莱姆声学，重新赋予声音以敏感性，并将其声音矩阵吸收进视觉领域（见 Berland 1993: 20）。通过 YouTube
    视频，我们通过视频看到声音多于通过扬声器听到声音。我们过去通过声音熟悉的音乐（这让视频变得陌生）现在通过视频熟悉（这让音频变得陌生）。正如 Berland
    指出的，这是一种“文化吞噬”的形式，声音在其中早已被图像所“消化”（Berland 1993: 31）。


