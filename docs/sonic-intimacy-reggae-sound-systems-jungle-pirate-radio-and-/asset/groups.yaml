    # SONIC INTIMACY


    Scholarship on post-soul is concerned with the ways in which soul transforms through
    the music machines of late modern black diasporic sound culture. For Kodwo Eshun,
    the relationship of humans to modern technology is qualitatively changed by the
    introduction of drum machines and sequencers. In post-soul such as jungle, humans
    are said to no longer move through machines but are moved by them. Writing on
    the Roland TR808 rhythm composer, whose pirated software versions became a staple
    of jungle production, Eshun discusses the ways in which the technology opened
    up a new threshold, the programming of posthuman rhythmatics – of programming
    humanly impossible time’, which seize and rewire the sensorium in a kinaesthetic
    of shocks and stutters’; a machine-located intensification and pleasure driving
    a generation (Eshun 1998: 79, 186–7). The implication here that the human is no
    longer expressed through technology but is merely its physical extension.


    This book’s understanding of the sonic intimacy of soul and post-soul music does
    not follow Eshun down the post-human rabbit hole. Here, it maintains that, as
    drum machines and sequencers are introduced, humanity extends through music technology.
    Jungle dancers are not seized and rewired through its sounds technology is also
    productive of them – as jungle’s technology is the producer split from their technology.
    They are not empty vessels wired into 808s (McKittrick and Weheliye 2017: 31).
    Rather, jungle’s drum sequencers become the expressive means through which life’s
    pains and pleasures play out in all its non-reductive complexity. Those mechanic
    flows include joy and sadness, and might include violence and emancipation.


