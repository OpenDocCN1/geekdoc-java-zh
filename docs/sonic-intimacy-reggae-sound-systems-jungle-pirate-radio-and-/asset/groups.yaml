    # 2


    # # The reggae sound system

    and vibe


    # ## Introduction


    In 1981 NME* magazine undertook the somewhat impossible task

    of itemizing UK reggae sound systems. Their list included a hundred

    London-based sounds, and more than thirty elsewhere across the

    country, only a proportion of those active at the time (NME 1981a).

    That simple act of enumeration spoke of the social significance of

    the reggae sound system at that moment. A list that missed off

    many smaller sounds nonetheless showed that up and down the UK

    sound system culture was at its apogee.


    Today we reflect on the significance of this moment.

    Although, back then, there was some disagreement about the UK

    sound system''ss influence on social and political life, now, whether

    it through sound production, sound technology, sound culture,

    music or in terms of the racial politics of Britain, it is undeniable

    that the sound system has profoundly influenced how we listen,

    produce and indeed *are*. The sound system has fundamentally

    altered the way that Britain relates to itself. Reverberating

    through popular culture, underground music, anti-racist activism\and street protest,
    the sound system produced a demand that

    exceeded the racist state at that moment. Central to this was

    bass, the expansive sensibilities of dub and the deep co-presence

    of the dancehall. The contention of this chapter is that these

    reverberations concern *sonic intimacy*'
  - '[PAGE 38]


    Consider the following quote from Channel One sound system''s Mikey Dread:


    I can tell you about sound system from now ''til tomorrow morning put you have
    to feel sound system to know what it''s about. (Mikey Dread interviewed in Folke
    and Weslien 2008)


    Here, as in much other commentary on sound systems, the sound system cannot be
    spoken. Verbal description falls short. Mikey Dread instead places emphasis on
    what you feel. To know a sound system is to feel it.


    While revellers should heed Mikey Dread''s advice, filling themselves with the
    unspeakable qualities of the sound system, the task for writers is what different.
    Mikey Dread then presents a conundrum for the sound system scholar – how to write
    about something that surpasses language? How to analyse in text the sound system''s
    feeling?


    One of the most convincing approaches to resolving this problem has been to explore
    the tactility of bass (Jasen 2016). Here, Mickey Dread is taken to be referring
    to the feeling of the bass on your skin. When he says, ''you have to feel the
    sound system to know what it''s about'', he is taken to be alluding to the touch
    of low frequency sound waves on the human body. I agree that with analysis, but
    surely feeling does not stop there? We can say that because, the sound system
    is evidently a question of the pressure on the flesh, it is also much more. After
    all, the feeling of the sound only makes sense within a broader feeling for the
    sound culture, a feeling for its knowledge, for the music and for the people present
    with you in the room. In other words, the feeling of the sound system refers not
    only to bass but sonic intimacy.


    This chapter explores the sonic intimacies of reggae and dub sound systems by
    reworking scholarly commentaries for threads abandoned or only unpicked. Similarly
    engages with documentaries, films and interviews. This chapter is roughly located
    in the 1970s and 1980s, a period that coincides with the movement between Jamaican
    and black British renderings of sound system culture, and the development of alternative
    cultural politics by a generation of black and working-class people growing up
    in the UK. We are shifting from rocksteady to reggae and dub'
  - '[PAGE 39]


    # THE REGGAE SOUND SYSTEM AND VIBE 29


    systems, and from smaller sounds like Metrobeat¹ to the larger sounds of Jah Shaka,
    Sufferer Hi Fi, Fatman, Frontline and Earthquake. This is the high point of UK
    sound system culture.¹ These huge bass-resonant hi-fi are the gravitational centres
    of a largely self-sustaining black music culture comprised of record importers
    and store owners, ¹ label owners, pressing sites, cutting houses and distributors
    (May 1977a; 1977b; 1977c). Across UK cities, weekday dances are culminating in
    weekend parties. Community halls in Seven Sisters Road and Tolling Park feed into
    town halls in Tottenham, Hornsey, Wandsworth, Brixton and Acton. The Apollo in
    Willesden, and All Nations in Hackney, Four Aces in Dalston, the Crypt in Deptford
    and Birmingham supplement pubs like the Bluesville in Wood Green, many student
    unions and countless house, basement and youth-club dances (Gayle 1974; Sullivan
    2014: 61)³


    # Relation


    This chapter explores how reggae sound systems were comprised, experienced and
    lived in that moment and what that entailed for the alternative cultural politics
    of 1970s and 1980s Britain. It tells this story through sonic intimacy; the its
    intimate social and material relations, through its intimate knowled, through
    its proximities, through the fullness of its vibe and through its deep sensibilities.
    But in order to consider these matters we first need to engage with how the reggae
    and dub sound systems were dynamically comprised technologically, socially and
    sonically. We need to acknowledge the basis of sonic system''s techno, social
    and sonic relations.


    > ¹This period of sound systems, including the stories of Duke Vin and Count Suckle,
    has received some attention (Bradley 2000; Melville 2020; Salewicz 2012; Vin 2017).

    ²This is a predominantly masculine sound culture. Lovers'' Rock was a more mixed
    gender reggae space and has been discussed by Beck and 2011.

    ³Although much of the discussion in this chapter is based on London sound systems,
    there was a sound system culture in black Caribbean communities across the UK
    (Campion 2017; Huxtable 2014; Jones 1988; Riley 2014; Veal 2007).'
