    \        stack.push(3);\n        System.out.println(\"Stack: \" + stack);\n  \
    \      System.out.println(\"Stack size: \" + stack.size());\n        System.out.println(\"\
    Stack pop: \" + stack.pop());\n    }\n}\n```\n\nStack output: [1, 2, 3];\nStack\
    \ height: 3\n3 stack pop\nStack isEmpty: false Stack top: 2\n\nThe push and pop\
    \ methods of the ArrayDeque<T> class are also used to implement the stack.\n\n\
    ArrayDeque<T> and Stack<T> are both provided by JDK. Both of these classes are\
    \ applicable. However, ArrayDeque<T> has some advantages.\n\n- 1. The first reason\
    \ is that Stack<T> is not driven by the Collection interface.\n- 2. Second Stack<T>\
    \ drives from Vector<T>, allowing for random access and breaking stack abstraction.\n\
    - 3. Third ArrayDeque<T> is more efficient than Stack<T>.\n\n## Queue\n\nA queue\
    \ is a data structure that operates on the First-In-First-Out (FIFO) principle.\
    \ The first element added to the queue will be the first to be removed, and so\
    \ on.\n\nThe following applications make use of queue:\n\n- 1. Use of shared resources\
    \ (e.g., printer)\n- 2. Multiprogramming\n- 3. The message queue\n- 4. Queue is\
    \ used to implement BFS or breadth-first traversal of a graph or tree.\n\n## ADT\
    \ Queue Operations:\n\nAdd(K): Inserts a new element k at the end of the queue.\n\
    \nRemove() returns the value of an element removed from the front of the queue.\n\
    \nFront() returns the value of the element at the front.\n\nSize(): Returns the\
