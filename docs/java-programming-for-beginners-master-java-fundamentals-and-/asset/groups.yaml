    expressions are used to assign a new value to a variable. Expressions are typically
    composed of values, variables, operators, and method calls. Some expressions produce
    no result but affect another variable. An expression that changes the value of
    a variable based on an operation is an example: there is no new value output,
    and there is no true "assignment" of a new value, but rather there is what is
    known as a side effect that results in a changed variable value.


