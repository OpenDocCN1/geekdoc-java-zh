    # JAVA FUNDAMENTALS


    One of the primary reasons to use Java is its emphasis on object-oriented programming.
    Object-oriented programming, also known as "OOP," is a programming language model
    that allows program code to be organized around data rather than functions and
    logic, is in procedural programming.


    These objects are created by "classes," which are understood in the traditional
    sense of how classes are types of objects that allow the programmer to "classify"
    them based on two major criteria: attributes and methods.


    The attributes of a class are the raw data that will be used to create the object:
    these are its descriptors, such as the values it possesses, and other relevant
    data that will be used to create the object.


    11


    The object''s "method" is the second criterion.


    These theoretical components comprise the "human" class, which serves as a blueprint
    for an object.


    Now that the class has been defined, the programmer can use the "human" class
    as a blueprint to create an object.


    They can use the class "Human" to "populate" its attributes, such as height, weight,
    gender, and race. Furthermore, the object already has built-in functions such
    as "run," "walk," and "talk," so when an object named "Mike" from the "Human"
    class is created, it already contains the functions to run, walk, and talk, without
    the need for the programmer to code those specific functions again, as they are
    already "inherent" in the created object.


    In a nutshell, that is what object-oriented programming is intended to be: a programming
    style that allows the programmer to draw on pre-defined classes to make it easier
    to describe them and use their internal, or built-in, functions to operate them.


    Assuming the reader is not a complete novice to programming and has been introduced
    to the world of programming using C or another procedural-heavy language, the
    next logical question is: why use object-oriented programming at all?


    One of its primary benefits is that it saves time in the long run.


    In simpler algorithms and programs, procedural programming is usually much faster
    and more straightforward; rather than having to construct and define a class,
    and then create an object based on that class, all the programmer has to do is
    declare the necessary variables, write the functions, and create the algorithm
    to solve the problem that the code is supposed to address.


    However, when it comes to more complex programs that require more complex solutions,
    object-oriented programming begins to shine and demonstrate its strength.


    There will be times in many programs when several variables or data clusters must
    be grouped, and the programmer will be treated in a specific way.


    This is what "classes" are supposed to help with.


    Rather than declaring a new set of variables for each data cluster, they can simply
    draw on an existing "class" and create a new "object." Let us see how this works
    in practice.


    A programmer would have to manually describe each and every sixteen pawns, four
    bishops and four knights, four rooks, two queens, and two kings if they were to
    code a chess game procedurally. They will also have to write the functions that
    allow each piece to move independently.


    If the programmer uses object-oriented programming, instead of having to code
    sixteen pawns, four bishops, four knights, four rooks, two queens, and two kings,
    they only have to code six classes: one for each piece on the board.


    The programmer can now simply include the movement functions within each class,
    and have the attributes describe their position: whether they''re the white king''s
    pawn or the black queen''s pawn, these are all things that can be inserted through
    the "pawn" class''s "attributes" portion. Instead of thirty-two code clusters,
    the programmer only needs to do six.


    It''s now much easier, much shorter, and much more elegant.


