    # OBJECT-ORIENTED PROGRAMMING


    Java is an object-oriented language, as you already know. As such, it adheres
    to the basic principles of this programming paradigm.


    An object is a physical entity such as a bag, car, chair, or pen.


    Object-oriented programming languages enable programmers to create applications
    that make use of objects and classes. They provide and support features that aid
    in the development and maintenance of software. The following are the most important
    concepts in this programming paradigm:


    # Objects


    # Classes


    # Method


    # Instance


    # Inheritance


    # Abstraction


    # Polymorphism


    Parsing Messages Encapsulation


    # Objects


    In the real world, you will come across humans, dogs, cars, and cats. These objects
    have both state and behavior. When you think of a cat, for example, its state
    could be its breed, color, or name. Its behavior can include running, jumping,
    and wagging its tail.


    In terms of these characteristics, a software object is similar to a real-world
    object. Its state is stored in fields, and its behavior is displayed via methods.


    # Classes


    Classes are used to define the properties of objects. These specifications act
    as blueprints for the construction of objects.


    While they are not immediately applied when classes are created, they are available
    if a class object is instantiated. Within a program, an object or class can have
    multiple copies or instances.


