    # Functional collections


    We expose every step when we externalize code. This is a defining feature of imperative
    programming. However, one of the recurring themes of functional programming is
    the concept of doing the inverse: internalizing code. Internalizing code is the
    process of hiding details within a function. However, functional programming takes
    this concept a step further by transforming everyday programming micro-patterns
    into functions. One of those micro-patterns is iterating over data, whether with
    iterators, for-loops, or while-loops. Functional programming alters our perception
    of them.


    Java''s functionalization effort would be incomplete unless the Collections library,
    specifically the Collection, Map, List, and Set interfaces, were redesigned. This
    is because iteration is frequently performed over collections, which are the foundation
    of Java programs. It is a natural location for the functionalization effort to
    take place. However, any significant changes, such as adding new methods to the
    Collection interface, would break backward compatibility with all pre-Java 8 programs.
    This includes not only the JDK''s hierarchy that extends the Collection interface
    but also any open or closed source third-party library and in-house classes.


    Java''s designers have never used, and will never use such a strategy. Nonetheless,
    changes were required; the library had been introduced in 1998, eons in the software
    industry years ago, and was showing its age.


    The need to modernize and functionalize the Collections library prompted the introduction
    of default methods. Default methods are ideal because they allow behavior to be
    added at the root of the hierarchy without disrupting dependent classes. Subclasses
    have the option of inheriting or overriding the behavior.


    Subclasses, unlike interface methods, can automatically accept new default methods
    without recompilation. There is instant compatibility. Default methods have proven
    useful in and of themselves, but their existence is due to the need to functionalize
    the Collections library.


    Parallelization is a recurring theme in functional programming.


    Simply put, functional programming improves the mousetrap for parallel processing.
    As a result, the Collections library has been enhanced to take advantage of multi-core
    CPUs when processing collections. The Collections library, along with Streams,
    is at the forefront of bringing functional-style parallel processing to Java.


    We can now apply what we''ve learned about Java''s standard functional interfaces
    to Collections. Let''s take a look at what happened to the Collections library
    in Java 8.


    # Interface for collection


    We''ll start with a brand new default method in the Collection interface that''s
    available to lists and sets. The forEach() method is as follows:


    This method loops through the entire collection, allowing the Consumer to determine
    what to do with each element. This is an example of declarative programming and
    the concept of internal iteration. The method for iterating is not specified.
    This is in contrast to external iteration, which specifies how to iterate as well
    as what to do with each element in code.


    We will demonstrate these functionalized collection methods using the slapstick
    comedy trio of The Three Stooges from the golden age of Hollywood films: Larry,
    Moe, and Curly. To begin, print the contents of a collection:


    The forEach() method can be used in a variety of situations. It is a far more
    convenient method of iterating through collections and should be your de-facto
    standard. However, because it is a declarative construct, there are some limitations.
    Most notably, unlike in a while loop, you cannot change the state of local variables.
    Algorithms must be functionally rethinked. For the time being, just know that
    forEach() is ideal for iterations that do not change state.


    We will now look at another new method in Collection:


    The method removeIf() internalizes the entire iteration, testing, and removing
    process. It only needs to be informed of the condition for removal.


    We can easily determine what type of lambda to use by using the now-familiar predicate
    functional interface.


    ReplaceAll() can be used to replace all of the contents of a List: ReplaceAll()''s
    interface is an UnaryOperator, which is a Function sub interface.


    All subclasses can use replaceelf() and replaceAll(), with one caveat: the underlying
    class must support removal or an exception will be thrown.


    These examples demonstrate the brevity of functional programming. The function
    did the majority of the work, with the lambda providing the details.


    # The map interface


    The map constant need to check for the presence of the map before adding, updating,
    or removing an element is one of the most vexing aspects of using lists as values
    in maps. First, you must attempt to extract the list and, if it cannot be found,
    create it. Assume we have a method that updates a movie database that is implemented
    as a Map. The key of the map is the year of the film, and the value is a list
    of films from that year. Before Java 8, the code would have looked like this:


    With these default methods, Java 8 provides a better alternative:


    Let''s begin with the computation methods. Each variant allows the mapping function
    to generate the map''s value. Mapping happens conditionally in computeIfPresent()
    and computeIfAbsent(). So, using these methods, we can refactor the following
    code example:


    It''s worth noting that the computeIfAbsent() lambda handles the list''s creation.
    When it comes time to add the movie to the list via the compute() method, the
    add() method will never throw a NullPointerException because the list is guaranteed
    to exist.


    In this case, using the computeIfAbsent() method is overkill; instead, we should
    use putIfAbsent():


    This method has no lambda and expects a value to be given rather than calculated.
    Even though no lambda was used, this is still a functional method.


    If you still need to extract the data, you can use the getOrDefault() method for
    a more functional approach:


    As an alternative, you can use the merge() method. It makes the the existence
    of a list easier. If the key (year) does not exist on the map, it places the value
    (titles) on the map. If it exists, a BiFunction can decide what to do with the
    two lists:


    The BiFunction can also return null, indicating to the merge that the key should
    be deleted.


    The takeaway is that we have eliminated the overhead code of checking for the
    existence of an element and can now concentrate on what is important: defining
    how to create the list and how to add an element to the list.


    The map interface has been enhanced with additional functional methods such as
    forEach(), replace(), and replaceAll(), and it employs the same code internalization
    principle. The complete list can be found in the appendix.


    # Spliterator


    The Collections library is still subject to the same concurrent access restrictions.
    As always, select the Collections library class that corresponds to your thread
    safety needs. This is because the new methods shown above are simply functional
    abstractions riding on top of the same underlying data structures. Because they
    are still based on multiple threads mutating the collection and synchronizing
    access to the underlying data, these methods are not particularly amenable to
    functional programming''s take on parallel processing. There is, however, a new
    Java 8 abstraction that is compatible. It is intended to perform parallel data
    iteration. The Spliterator interface embodies the concept. This interface''s premise
    is to partition data and pass chunks to different threads.


    Spliterators can be obtained via the Collection interface, which includes the
    subinterfaces List and Set.

