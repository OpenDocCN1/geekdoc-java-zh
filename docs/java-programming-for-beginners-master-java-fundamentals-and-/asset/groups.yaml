    所有子类都可以使用 replaceIfPresent() 和 replaceAll()，但有一个前提：底层类必须支持移除，否则将抛出异常。


    这些示例展示了函数式编程的简洁性。函数完成了大部分工作，而 lambda 提供了细节。


