    Creating variables is a simple task, especially since Java programmers name them
    after the data type or purpose of what the variable will store. However, there
    are a few rules to naming these variables; otherwise, Java will not recognize
    them and will display an error message. The main constraint with variable names
    is that they cannot begin with a special character such as an underscore or a
    number. Variable names, on the other hand, can contain characters such as letters
    and'
