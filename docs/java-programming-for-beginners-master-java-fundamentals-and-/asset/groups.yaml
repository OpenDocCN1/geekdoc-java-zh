    ## Modifiers


    Modifiers are keywords that change the meaning of your code''s definitions. Java
    includes several modifiers.


    ## Modifiers of Access


    Access modifiers are used to specify the levels of access for methods, variables,
    classes, and constructors.


    - Private—accessible only within the class: A method, variable, class, or constructor
    that is declared private is only accessible within the class. However, if the
    class has public getter methods, you may be able to access a private variable
    from outside the class. The private keyword denotes the most stringent access
    restriction. It is important to note that interfaces and classes cannot be declared
    private.


    - Public—open to the entire world: A public method, interface, constructor, class,
    or another object can be accessed from other classes. Similarly, blocks, methods,
    or fields defined within a public class can be accessed from a Java class. This
    is true as long as they are packaged together. If you want to use a public class
    from another package, you must import it first. Subclasses inherit all public
    variables and methods of a class under the class inheritance concept. Keep in
    mind that the main() method of an application must be declared public before the
    Java interpreter can use it to run the class.


    - Protected: All subclasses and packages have access to it because it is protected.
    Declaring a method, variable, or constructor in a superclass as protected restricts
    access to classes within its package or its subclasses in another package. This
    access type is used when you want to allow the subclass to use variable or helper
    methods while preventing other classes from doing so. Interfaces and the fields
    and methods within them should not be declared protected, but fields and methods
    outside of the interface can be. Protected classes should not be declared.


    - Default: When no modifier is supplied—accessible to the package: A method or
    variable declared without a modifier is available to other classes in the package.


    The table below summarizes the various access modifiers and their effects:


    | Modifier | Inside the class | Inside the package | Subclasses outside of the
    package | External packaging |

    | :--- | :---: | :---: | :---: | :---: |

    | Private | Y | N | N | N |

    | Public | Y | Y | Y | Y |

    | Protected | Y | Y | Y | N |

    | Default | Y | Y | N | N |


    ## Modifiers with No Access


    The non-access modifiers in Java can be used to access various functionalities.


    - Final—used to complete variable, method, and class implementations.


    ## Variables at the end


    A final variable can only be explicitly initialized once. When you declare a variable
    as final, you cannot reassign it to another object. However, keep in mind that
    you can still change the data stored within the object. This means that while
    you can change the object''s state, you cannot change its reference. The final
    modifier is frequently used in conjunction with static to generate a class variable
    from a constant value.


    ## Methods of conclusion


    The final keyword is used to prevent subclasses from changing a method.


    Final exams: The final modifier is used to prevent other classes from inheriting
    any of the features of the final class.


    - Static is used to define class methods or variables. This keyword can be used
    to create a unique variable (also known as a static variable or class variable)
    that exists independently of other instances of the class. A local variable cannot
    be declared static.


    You can also use the static keyword to define a method (also known as a static
    method or class method) that exists independently of other instances of the class.
    Static methods recognize and work only on data from the arguments provided, without
    taking variables into account. You can access class methods and variables by following
    the class name with a dot and the variable or method name ().


    - Abstract: Used to create abstract methods or classes.


    ### The abstract class


    When you declare a class as abstract, it means you will never be able to instantiate
    it. The only reason to declare a class abstract is to extend it. You cannot declare
    a class to be both final and abstract because a final class cannot be extended.
    A class that employs abstract methods must be declared abstract. Compile errors
    will occur if this is not done.


    ## Method of abstraction


    An abstract method derives its method body from the subclass because it is declared
    without implementation. Abstract methods are neither strict nor final. A class
    that extends an abstract class must use the abstract methods of the superclass
    unless it is also an abstract class. An abstract class should be declared if it
    contains at least one abstract method. An abstract class, on the other hand, does
    not have to have abstract methods.


