    # 函数式集合


    当我们将代码外部化时，我们会暴露每一个步骤。这是命令式编程的一个定义特征。然而，函数式编程的一个反复出现的主题是执行反向操作的概念：代码内部化。代码内部化是在函数内部隐藏细节的过程。但是，函数式编程将这一概念更进了一层，将日常的编程微模式转换为函数。这些微模式之一就是对数据进行迭代，无论是通过迭代器、for
    循环还是 while 循环。函数式编程改变了我们对它们的认知。


    如果不对重新设计 Collections 库（特别是 Collection、Map、List 和 Set 接口），那么 Java 的函数化努力将是不完全的。这是因为迭代经常在集合上进行，而集合是
    Java 程序的的基础。这是开展函数化工作的自然场所。然而，任何重大的更改（例如向 Collection 接口添加新方法）都将破坏与所有 Java 8 之前程序的后兼容性。这不仅包括扩展了
    Collection 接口的 JDK 层级结构，还包括任何开源或闭源第三方库以及内部类。


    Java 的设计者从未使用过这种策略，也永远不会使用。尽管如此，更改是必要的；该库引入于 1998 年，在当年的软件行业已经是几个世纪以前，并且显现出了老态。


    现代化和函数化 Collections 库的需求促成了默认方法（default methods）的引入。默认方法是理想的，因为它们允许在层次结构的根部添加行为，而不破坏依赖类。子类可以选择继承或覆盖这些行为。


    与接口方法不同，子类可以自动接受新的默认方法而无需重新编译。这实现了即时兼容性。默认方法本身已被证明是有用的，但它们存在是因为对 Collections 库函数化的需求。


    并行化是函数式编程中一个反复出现的主题。


    简单来说，函数式编程改进了并行处理的“捕鼠器”。因此，Collections 库得到了增强，以便在处理集合时利用多核 CPU 的优势。Collections
    库连同 Streams 是为 Java 引入函数式风格并行处理的前沿。


    我们现在可以将学到的关于 Java 标准函数式接口的知识应用于 Collections。让我们看看 Java 8 的 Collections 库发生了什么。


