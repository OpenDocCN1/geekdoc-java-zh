    The method trySplit() divides the underlying data into two parts. It generates
    a new Spliterator with half of the data and retains the other half in the original
    instance. Each can be assigned to a thread, which iterates through the partitioned
    data using forEachRemaining(). The tryAdvance() method is a one-at-a-time variant
    that returns the new element or null if the list is empty.


    Splitators do not perform parallel processing themselves, but rather provide the
    abstraction for it. Here''s an example of the concept in action:


    The method isMovieInList() parallelizes the search to determine if it is contained
    in the list given a title and a list of movies. If found, it sets the flag in
    booleanHolder to true. It selects a Spliterator instance from the list, divides
    it in half, and distributes one half to each thread. If more threads become available,
    the splitting process can be repeated.


    Splitators can be obtained from other Collection types as well as from other JDK
    libraries. Numerous implementations deal with various properties such as finite/infinite,
    ordered/non-ordered, sorted/non-sorted, and mutable/immutable.


