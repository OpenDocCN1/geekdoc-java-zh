    结论是，我们消除了检查元素存在的开销代码，现在可以专注于重要的工作：定义如何创建列表以及向列表添加元素。


    map 接口已经增加了额外的函数式方法，如 forEach()、replace() 和 replaceAll()，并且采用了相同的代码内部化原则。完整列表见附录。


    # Spliterator


    Collections 库仍然受到相同的并发访问限制。一如既往，根据你的线程安全需求选择 Collections 库类。这是因为上面显示的方法仅仅是构建在底层数据结构上的函数式抽象。由于它们仍然基于多个线程修改集合并同步访问底层数据，这些方法并不特别适用于函数式编程的并行处理方式。然而，有一个新的
    Java 8 抽象是可以兼容的。它用于并行数据迭代。Spliterator 接口体现了这一概念。该接口的设计是将划分数据并传递给不同的线程。


    可以通过 Collection 接口获取 Spliterator，该接口包括 List 和 Set。


