    # Important Information and More


    Classes are the building blocks of Java programs. In one of its classes, every
    program must have a main() method. The main() method''s name must be public static
    void main (String[] args). Later lessons will define all of those terms. Multiple
    classes are frequently used in tandem to create a single program. However, the
    majority of the programs in this book will only have one class.


    A superclass is required for each class. As a superclass, any class can be used.
    In a later lesson, you''ll create your superclass. Classes that share the same
    superclass are thought to be of the same type. For example, the DIYWindow class
    will be the superclass of the main class you create for each program in this book.
    As a result, every program in this book will be a DIYWindow. Right-click in the
    Package Explorer pane to create a class. Numbers, letters, dollar signs, and underscores
    can all be used in class names. Dollar signs and underscores are not commonly
    used.


    In class names, no blanks or periods are permitted.


    Class names must not begin with a number.


    The majority of class names begin with an uppercase letter. If the class name
    contains more than one word, the first letter of each word is usually capitalized,
    while the remaining letters are lowercase.


    There can be one or more constructors in a class.


    The class constructor has the same name as the class and must be made public.
    Constructors will be covered in greater detail in subsequent lessons. A constructor
    is invoked by using new, 53, followed by the constructor''s name and parentheses.
    In the main() method, for example, new HelloWorld() invokes the HelloWorld constructor.
    Curly brackets surround code blocks, each line of code ends with a semicolon;
    every Java program starts with the main() method.


    In all of the programs in this book, the main() method calls the class constructor.
    As a result, the main() method will be executed first, followed by the class constructor.
    Each statement enclosed by curly brackets is executed one at a time, in the order
    they appear in the code. The presence of blank lines between lines of code does
    not affect the code runs. To make the code easier to read, blank lines are added.
    Statements () should be printed. The text between the parentheses should be printed
    to a window.


    Each print() statement creates a new line of text. Use print() with empty parentheses
    to print a blank line. DIYWindow, which is included in DIYJava.jar, contains the
    print() method. That is why you included the external JAR file, DIYJava.jar, and
    why you chose DIYWindow as the superclass for the HelloWorld class. Comments are
    lines beginning with / or a group of lines beginning with /* and ending with *.


