    # What exactly are variables?


    In contrast, a variable is an "object" that contains a specific data type and
    it''s assigned or received value. It''s called a variable because the value it
    contains can change depending on how it''s used in the code, how the coder declares
    its value, or even how the program''s user interacts with it. In short, a variable
    is a data type''s storage unit. Having access to variables allows programmers
    to easily label and refer to stored values.


    19


    # Variable types in Java


    Declaration statements, lines of code used to declare variables and define them
    by specifying the specific data type and name, are required by Java. Java defines
    variables as containers that contain a specific type and value of information,
    as opposed to some languages, such as Python, which only requires a variable'
  - '[PAGE 32]


    declaration and the variable can dynamically change its type; Java variables are
    static and retain their type once declared.


    Integer number = 20


    completed Boolean = true


    hello, string = "Hello World!"


    The syntax for declaring variables is shown in the preceding examples, with the
    type of variable coming first, followed by the variable name, and finally the
    value. It is also worth noting that the declaration statement can contain multiple
    declarations in a single line, as shown in the following example:


    Integer number = 20, Boolean completed = true, string hello =


    "Hello, World!"


    Java variables can be declared with no value at the start; in such cases, Java
    chooses to declare these variables with a specific default value, such as:


    Byte a;'
  - '[PAGE 33]


    Short number;


    Boolean response;


    Will produce the values o and false, respectively. The following is a more comprehensive
    list of default values: The byte, short, int, and long data types all have a default
    value of o, while the float and double data types have a default value of o.o.,
    the char data type has a default value of ''uoooo'', a string or any other object
    has a null default value, and all Booleans begin with a false default value.


    Variables in Java are static when declared, which means that the programmer must
    define the data type that the variable will contain. To illustrate, if we want
    to store a number in variable num, we must first declare the variable: "int num,"
    before we can assign a value, such as "num = 10."


    The preceding procedure is commonly referred to as an


    "assignment statement," in which a value is assigned to the variable as declared
    by the programmer. However, one notable'
  - '[PAGE 34]


    feature of Java, and indeed most programming languages, is that in the assignment
    statement, such as in our example of num = 10, the actual value stored is the
    one on the right side of the equals sign, the value of 10, and num is simply a
    "marker" to refer to that stored value. This is why many Java programmers prefer
    the jargon of


    "getting" a value rather than "assigning," even though they can be used interchangeably
    and, except in a few rare cases, function almost identically.


    21


    However, once variables have been assigned values, functions must be performed
