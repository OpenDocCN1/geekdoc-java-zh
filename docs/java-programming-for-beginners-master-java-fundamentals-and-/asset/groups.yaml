    \n## Stack\n\nA stack is a type of data structure that uses the Last-In-First-Out\
    \ (LIFO) strategy. This means that the last element added will be the first to\
    \ be removed.\n\nThe stack's various applications include:\n\n- Recursion: System\
    \ stack is used to implement recursive calls.\n- 1. Expression postfix evaluation.\n\
    - 2. Stack-based backtracking implementation\n- 3. Tree and graph depth-first\
    \ search\n- 4. Converting a decimal number to a binary number, and so on.\n\n\
    ## ADT Stack Operations\n\nPush(k): Pushes k to the top of the stack.\n\nPop():\
    \ Remove an element from the stack's top and return its value.\n\nTop(): Returns\
    \ the value of the stack element at the top.\n\nSize() returns the number of stack\
    \ elements.\n\nIsEmpty() checks to see if the stack is empty. If the stack is\
    \ empty, it returns true; otherwise, it returns false.\n\nAll of the preceding\
    \ stack operations are implemented in O(1) time complexity.\n\n## JAVA Collection\
    \ stack implementation\n\nThe stack is created by invoking the push and pop methods\
    \ of the Stack<T> class.\n\nExample:\n\n```java\npublic class StackDemo {\n  \
    \  public static void main (String[] args) {\n        Stack<Integer> stack = new\
