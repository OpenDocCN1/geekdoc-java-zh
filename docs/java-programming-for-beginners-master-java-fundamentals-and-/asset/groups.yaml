    ## Making Use of Constructors in Your Code


    We''ll just go over a few more details about object-oriented programming. As previously
    stated, a constructor will appear to be a method, and you can certainly think
    of and treat it as a special type of method in Java programming.


    A constructor, on the other hand, will differ from a method in several ways. A
    constructor''s name will be the same as the class name. To create a new instance
    of the constructor and initialize it, use the keyword or operator "new." Here''s
    an example of a class called "Employee" and several ways to initialize it in your
    code:


    ```

    Employee payrate1 = new Employee();

    Employee payrate2 = new Employee(2.0);

    Employee payrate3 = new Employee(3.0, "regular"); 24


    A constructor will also return void implicitly, which simply means it has no return
    type. A return statement cannot be placed within the body of a constructor because
    compilers will flag it as an error. The only way to call a constructor is to use
    the "new" statement. In the preceding examples, we showed you several ways to
    call constructors.


    Another distinction is that constructors cannot be inherited.


    Returning to the examples above, the first line includes "Employee();"—this is
    known as a default constructor. As you can see, there are no parameters. A default
    constructor''s job is to simply set the member variables to a specific default
    value. In the preceding example, the member variable payrate was set to its default
    pay rate and employee status.


