    ## Some of Java''s design goals are listed below:


    The language is designed to be written only once and run on any operating system.


    The language should support several software engineering principles. Portability
    is an important consideration. This is why Java can run on the Windows, Linux,
    and macOS operating systems.


    ## Internationalization requires a lot of support.


    Java is designed to be used for developing applications for both hosted and embedded
    systems.


    Other design objectives are discussed next:


    Type checking is extremely important.


    Java is a powerful type of language. Every variable that is defined must be associated
    with a data type.


    You don''t need to understand the entire program right now, so let''s just look
    at two lines of code.


    7


    ```java

    +   // 1) int i = 5;

    ```


    In this case, we''re defining a variable, which is used to store a value. The
    amount of data that can be stored is determined by the data type. In this example,
    I am of the type ''int'' or Integer, which is a numeric data value.


    ## Array Bounds Validation


    Java will check whether the array has the required number of values at runtime.
    An exception will be thrown if a value is accessed that is outside the bounds
    of the array.


    You don''t need to understand the entire program right now, so let''s just look
    at the following lines of code.


    ```java

    1) int[] array1 = new int[2];

    ```


    In this case, we''re declaring an array, a collection of integer values. The value
    of ''2'' means that we can only store two values in the array.


    ```java

    2) array1[0] = 1; array1[1] = 2; array1[2] = 3;

    ```


    We can see from this code that we are assigning three values to the array. When
    you run this program, you will receive an error because the array has exceeded
    its maximum allowable bounds of two. At runtime, you will receive the error shown
    below.


    Exception in "main" thread at HelloWorld.main,


    ```

    java.lang.ArrayIndexOutOfBoundsException: 2 (HelloWorld.java:8)

    ```


    ## What is the significance of Java?


    Next, Java''s syntax and features are similar to those of other programming languages
    such as C and C++. Learning Java will be a breeze if you have any prior programming
    experience. Even if you are completely new to programming, Java is designed to
    be a relatively simple language to learn. Most programmers find Java easier to
    learn than C or C++.


    Java is also intended to be platform-agnostic. As previously stated, Java code
    is first compiled into bytecode, which can then be run on any machine that has
    the Java Virtual Machine.


    As a result, with Java, you can write the code once and run it anywhere.


    ## Why is Java used?


    One of the primary reasons to use Java is its emphasis on object-oriented programming.


    Object-oriented programming, also known as "OOP," is a programming language model
    that allows program code to be organized around data rather than functions and
    logic, as in procedural programming.


    These "data clusters" are organized into "objects," thus the term "object-oriented
    programming."


    These objects are created by "classes," which are understood here in the traditional
    sense: types of objects that allow the programmer to "classify" them based on
    two major criteria: attributes and methods.


    The attributes of a class are the raw data that will be used to create the object:
    these are its descriptors, such as the values it possesses, and other relevant
    data that will be used to create the object. The object''s "method" is the second
    criterion.


    This "method" is the class''s behavior or the logical sequences that describe
    how it interacts or can be interacted with natively.


