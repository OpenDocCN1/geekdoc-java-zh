    \n简单来说，循环是一种允许代码块执行多次的结构。Java 提供了几种构造来实现循环。`while` 循环、`for` 循环和 `do while` 循环就是这些示例。\n\
    \n`while` 循环迭代地执行代码块，直到 `while` 循环指定的条件为真。当此条件失败时，`while` 循环终止。\n\n`for` 循环构造允许程序员在同一个构造中操纵条件和循环变量。因此，你可以创建一个循环变量，对其进行递//减，并运行循环直到满足该变量的条件。\n\
