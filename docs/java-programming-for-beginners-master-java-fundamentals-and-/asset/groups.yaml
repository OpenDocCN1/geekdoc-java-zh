    属性。


    ## Java EE


    Java EE 平台是由全球 Java 社区成员共同创建的开源产品。由于前者构建在后者之上，因此 Java EE 与之密切相关。该软件整合了旨在用于企业解决方案的变革性创新。新版本中引入的功能和进展经常反映了
    Java 社区成员的投入、需求和请求。Java EE 平台包含20多个符合 Java 标准的实现。


    Java EE SDK 旨在开发大型应用程序。正如其名称所示，此 Java SDK 的创建是为了为企业级软件解决方案提供支持。JDK 包含了 Java 程序员创建可扩展和可网络化应用程序所需的强大
    API 和运行时属性。需要创建多层架构应用程序的开发者可能发现此 JDK 很有很有用。


    在撰写本文稿时，Java EE 8 是最新的发布版本。


    Java EE 的新设计包含了用于企业解决方案的增强技术，以及用于安全和管理的现代化应用程序。该版本包含多项改进，包括由 Client、JSON Binding、Servlet
    和 Security APIs 提供的增强型 REST API 能力。根据 2019 年12 月在 Oracle 公司官方网站发布的信息，该版本还包含日期和时间
    API 以及流 API。


    30


    ## Java ME


    Java ME 平台结合了简单性、可移植性和动态性，为小型设备和设备开发应用程序提供了一个灵活的环境。由于其交互式且用户友导航界面，以及实现网络概念的内置功能，Java
    ME 以具有卓越的应用程序开发环境闻名。它与物联网（IoT）密切相关，在开发用于内置技术或连接设备的应用程序时（这些设备可创建或实现未来的概念）非常有用。由于其可移植性和运行时特性，Java
    ME 适用于可穿戴设备、手机手机、相机、传感器和打印机等物品和设备的软件应用。


    Java ME SDK 包含了在独立环境中开发软件应用、测试功能和实现设备仿真所需的工具。根据 2019 年在 Oracle 公司官方网站发布的信息，此 JDK
    非常适用于配合“连接受限设备配置 (CLDC)”技术以及“连接设备配置 (CDC)”功能。这为应用程序开发提供了一个统一且多功能的环境。


    其他几种 Java ME 解决方案允许 Java 编程语言部署到应用程序中。Java ME 运行时环境集成了设备中的 IoT 能力，而 Java ME 嵌入式客户端简化了运行和优化内置程序功能的软件解决方案的开发。为了移动设备创建创新功能，Java
    for Mobile 利用了 CLDC 和 Java ME 开发者工具栈。


    ## Java 运行时


    请记住，Java 应用程序必须满足某些条件才能高效运行。JRE 包含了创建这些条件所需的成分。这包括 JVM 以及与之相关的文件和类属性。尽管 JRE 是
    JDK 的组件，但它可以独立运行，特别是当任务限于运行而非构建应用程序指令时。


    JRE 为 Java 编程生态系统中的各种程序提供关键的运行属性。例如，如果一个程序包含一个独立的 JRE，则被认为是自包含的。这意味着该程序不依赖其他程序来访问
    JRE。这种独立性使得程序能够兼容各种操作系统。


    ## Java 中的虚拟机


    JVM 是一种将 Java 整合到计算机程序中的规范。它是 Java 语言平台无关特性的驱动力。JVM 作为由其他程序执行的程序的地位强调了这一点。与 JVM
    交互并执行它的程序将 JVM 视为一台机器。因此，使用类似的集合、库和接口来编写 Java 程序，以使每个实现都能匹配特定的操作系统。这使得将 Java 程序翻译或解释为本地操作系统的运行时指令变得更容易，消除了
    Java 编程对平台的依赖。


    作为开发者，你必须意识到你的开发环境和应用程序对网络攻击和其他威胁的脆弱性。JVM 包含了增强的安全功能，保护你免受此类威胁的影响。稳固的安全基础归功于类操作代码中内置的语法和结构限制。然而，这并不意味着对
    JVM 支持的类文件数量有任何限制。只要类文件可以被验证为安全，JVM 就能接受广泛的类文件。因此，JVM 是使用其他编程语言开发软件的可行补充。


    JVM 经常作为移植功能包含在各种软件和硬件安装中。它是使用 Oracle 或其他提供商开发的算法实现的。因此，JVM 作为一个开放的实现平台。运行时实例是
    JVM 的核心属性，锚定了它的命令操作。例如，创建一个 JVM 实例只需在命令提示符中输入运行 Java 类属性的指令即可简单。


    Java 程序员应该熟悉 JVM 的关键领域，例如用于运行的类加载器和数据段，以及负责程序执行的引擎。性能相关的组件（如垃圾回收器和堆维度工具）对于 JVM
    的部署也至关重要。JVM 和字节码之间有着密切的关系。


    ## 字节码


    字节码是存储在类文件中并与符号表等信息并存的 JVM 命令。它们作为后台语言程序运行，辅助解释和执行 JVM 操作。由于 Java 不提供原生代码，因此使用字节码来代之。JVM
    寄存器的结构使得它包含方法，这些方法反过来容纳字节码流——即 JVM 的指令集。换句话说，每个 Java 类都包含方法，而类文件加载过程为每个方法运行单个字节码33
    流。当方法被调用时，字节码会在启动时自动执行。


    字节码的另一个重要特性是即时编译 (JIT) 编译器，它在运行时操作期间编译执行代码。在 JVM 生态系统中，该功能以 HotSpot JIT 编译的形式提供。它与
    Java 运行时操作并发执行，因为它可以在优化水平执行，并具有扩展以适应指令流量的灵活性。以前，需要定期启动 JIT 编译器以清除冗程序并刷新内存。调优是确保
    JIT 编译器优化运行的必要程序。另一方面，Java 新版本的频繁升级逐渐引入了自动内存刷新机制，消除了对定期调优的需求。


    字节码可以是原始类型、灵活类型或栈类型。根据 Venners (1996)，原始数据参数包括 byte、char、double、float、int、long
    和 short。boolean 参数为列表增加了另一个原始类型，使总数达到八个。这八个参数中的每一个旨在协助开发者部署供字节码操作的变量。这些原始类型参数表示为字节码流中的操作数。因此，更大更强大的参数被分配给更高级别的字节


