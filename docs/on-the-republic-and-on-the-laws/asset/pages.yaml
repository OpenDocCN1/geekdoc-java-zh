  md: '# Note on the Text

    and the Translation


    Cicero probably began writing On the Republic in the year 54 BCE and probably
    published it in 51 BCE, before leaving to become governor of the province of Cilicia
    in Asia Minor. He had originally planned a dialogue of nine books over nine days,
    featuring Scipio and Scipio''s colleagues. After reading drafts of the first two
    books, a friend suggested that Cicero make himself the main character so that
    he might treat contemporary events, Letters to His Brother Quintus 3.1-2). Cicero
    then began to recast the work as a dialogue between his brother Quintus and himself.
    Later returned to his original plan, except that the work became six books over
    three years.


    The complete text of the Republic disappeared during the later years of the western
    Roman Empire. Snippets existed in the writings of the church fathers. The end
    of book 6, called “Scipio''s Dream” (Somnium Scipionis), was separately preserved
    (often with the commentary of the Roman scholar Macrobius, who flourished around
    400). In 1819 Cardinal Angelo Mai discovered a fourth-fifth-century copy of the
    manuscript, amounting to about one-fourth of the work, as a palimpsest in the
    Vatican Library; a scribe copied a text of Augustine over.


    Cicero may have begun On the Laws while he was writing the Republic; the Laws
    follows the plan he considered but rejected for the other work. In the year before
    his death, he listed his philosophical works, he did not include the Laws (Cicero,
    On Divination 2.1-4). We have Macrobius''s word that there were at least five
    books (see the second fragment at the end of the Laws). The Laws has been in circulation
    at least from around fifteen years after Cicero''s death to the present, by transmission
    of the text suffered during medieval times, and in its current state it is often
    corrupt. Our earliest manuscripts, from the mid-ninth century, belong to the Leiden
    corpus and are housed in that city.'
