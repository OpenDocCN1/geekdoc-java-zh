    can be fully separated from poetic delight (Leg. 1.5). Marcus will not grant Atticus''s
    and Quintus''s request to write a history of Rome, but he is willing to tackle
    civic law, although he considers most of it trivial (Leg. 1.14).


    To understand civil law, Marcus maintains, we must understand the nature of law—the
    Latin for *lex*, *ius*, can also mean “right” in the sense of what is right, not
    necessarily a right held by an individual person or “justice”—and the nature of
    law we must work our way back to a knowledge of human nature (Leg. 1.17). Marcus
    presents his definition of law in qualified agreement with “highly educated men”
    (Leg. 1.18). Law is “highest reason, implanted in nature,” which commands and
    prohibits actions. It can also be viewed as fully developed reason in the human
    mind. It bears contemplating the relation between those senses of law mentioned
    in that confusing passage, but we must remember that Marcus is speaking in ordinary
    terms for the sake of “strengthening republics” (Leg. 1.19, 37): quotation from
    the latter. After securing Atticus''s confession that gods rule over all of nature
    (Leg. 1.21), Marcus makes another beginning: he moves from the identification
    of reason as the aspect of human nature enabling fellowship between gods and humans
    (Leg. 1.22–23) to an account of how reason came to the human soul, an explanation
    that relies on the agency of both gods and nature (Leg. 1.24–27). The conclusion,
    that nature has equipped us for justice (Leg. 1.28), is supposedly clinched by
