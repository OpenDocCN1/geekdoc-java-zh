    unenforceable moral precepts among the laws (e.g., Leg. 2.19.1)⁴ may be to hold
    that they are natural laws.


    As Marcus presents his laws on religion, he observes the example of Plato''s Laws
    by providing a preface on the importance of religion with that of enhancing the
    persuasiveness of what is follows. But he does not want to imitate Plato so he
    loses his originality (Leg. 2.14–17).


    The first point in Marcus''s religious laws is his proposal that religious ceremonies
    be lessened (Leg. 2.19.1). He gives as a reason that “nothing is less than being
    pleasing to the god himself not lie to all” (Leg. 2.25). If natural law—the supposed
    basis of these laws—is to apply to everyone, then worship of the god must be affordable
    to all. He also proposes that expiations and worship in funerals be diminished
