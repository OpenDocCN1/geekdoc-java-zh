  md: '# of Personal Names


    This index features real human beings and mythical divine and human beings. For
    Roman persons, alphabetization is usually by the person’s second (i.e., family)
    name. All years are BCE. References include book and section numbers by a period
    (and appropriate in the Laws, subsection number separated by another period).
    Some references do not involve explicit use of the name. There be more than one
    reference to a person in a given section.


    Accius, Lucius (170-ca. 326): Tragedian, poet, and literary. Commissioned by Iunius
    Brutus Callimachus to compose epigrams to a temple of Mars that Brutus built in
    Campus Martius. Leg. 2.5


    Aeschines (ca. 397-ca. 322): Athenian statesman and orator who opposed Demosthenes.
    Rep. 4.21


    Accius, Lucius (second century): Jurist and commentator on Twelve Tables. Leg.
    2.59 Aelius Paetus, Sextus: Consul 198. Pioneer of Roman jurisprudence and author
    of on Tables. Nicknamed Cato (Censor). Rep. 1.30, 327-ca. 2.59


    Aeschulapius: Roman god of healing. Aslepius in Greek. Leg. 2.197, 2.27


    Achilles: Greek hero of Trojan War. Main character of Homer’s Iliad. Rep. 1.30


    Africanus: See Cornelius


    Aelius Stius Praeacus, Lucius: Consul 155-ca. 75: Stoic, grammarian and speechwriter.
    Leg. 2.59


    Ahila: See Vergil


    Antipius in Republic: Son of Scipio’s brother Africanus. 129. Stoicism to moral
