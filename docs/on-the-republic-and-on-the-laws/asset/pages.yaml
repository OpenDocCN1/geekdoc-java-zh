    \ without a ballot. But\nthough Scipio said for himself in that book,⁶¹ I bestow\
    \ this\nfreedom on the people so respectable men may be strong and use\ntheir\
    \ authority. The law concerning votes has been recited by me:\n\nM: I say that\
    \ you have indeed rejected the law without a ballot.\nLet them know to the aristocrats,\
    \ free to the plebeians.\" Then After-\nlaw contains a variant eliminating all\
    \ laws that were provided After-\ndance conceal the vote in every manner: \"No\
    \ one may inspect the\nballot\"; \"No one may acost for it\"; \"No one may acost\
    \ [another man]\ncerning it.\" And the Marian law made the voting passages nar-\r\
    ow⁶³ If they are an obstacle to those who would bribe, as they mostly\nire, do\
    \ not dispose. If the laws are ineffective at preventing\nbbery, I concede that\
    \ the people may—provided it is shown and voluntarily offered to each ex-\ncellent,\
    \ highly respected citizen. The freedom should consist in this,\nthe power of\
    \ honorably gratifying respectable men is given to the\npeople. And now comes\
    \ what you just said, Quintus, that the ballot\ncondemns men for voice unless\
    \ because it is permitted [to vote]. If that is retained, the rest\nof the will\
    \ is transmitted through influence and gratitude.⁶⁴ And so, if\nI omit votes corrupted\
    \ by largest, don't you see that—if bribery is\ndormant—what is sought in votes\
    \ is what the best men feel?⁶⁵ There-\\efore, my law gives the appearance of freedom;\
    \ the authority of re-\nspectable men is retained; a cause of contention is eliminated.\n\
    \n> ⁶⁰The one referred to Scipio in Rep. and Leg.\n⁶¹Le., Marcus. \"those books.\"\
    \ See Rep. 4.14–15.\n⁶²This law of Marius, tribune in 119, made voters pass through\
