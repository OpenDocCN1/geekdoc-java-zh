  md: '# Introduction 9


    The section on Scipio''s dream in book 6 begins with his assertions that “for
    wise men the consciousness of extraordinary deeds is itself the amblest reward
    for virtue; (Rep. 6.12). yet “divine virtue” wants to have lasting rewards more
    than to be distinguished from all other people. While Scipio is asleep, his adoptive
    father, Publius Cornelius Scipio Africanus, tells him that reward is—eternal life—and
    managing one''s father is the way to attain that goal (Rep. 6.17). Up to that
    point, the dream supports Cicero''s earlier claim for the superiority of the practical
    life over the theoretical. But when an appearance of Scipio''s natural life, Lucius
    Aemilius Paullus, puts the earth in cosmological perspective, shows him the dialogue
    of the spheres, and makes him discontented with empire, the dream seems to support
    the superiority of the theoretical life (Rep. 6.20-23). The reader should consider
    whether African''s second speech (Rep. 6.24-33) affects a coherent synthesis of
    the two views, especially concerning the question of glory is desirable (contrast
    Rep. 1.27, 60 and 6.27-29 with 3.2).


    Despite the fragmentary state of the Republic, it is apparent that Cicero succeeds
    in raising a number of important philosophical questions, both through direct
    concern among characters and statements over the course of dialogue. He dispatches
    the Epicurean antipathy to public life while teaching the reader that the superiority
    of public life may have considerable merit (even if not in the Epicurean term
    of pleasure). He treats the Stoic position with subtlety that explains Laelius''s
    character through discussion with Scipio is the best way to explain the Stoics''
    devotion to theoretical purity can overwhelm their concern to eliminate injustice.
    As the dialogue develops, Cicero manages to promote both concern for public affairs
    in general and dedication to the particular form of the Roman Republic.


    # On the Laws


    The Laws presents a dialogue among Cicero and two other men he knew well. His
    younger brother, Quintus Tullius Cicero, held high political office and served
