  md: '# Introduction 3


    reelection to a charge of treason, and when a consul refused to stop him from
    doing so, a mob of senators and their clients killed him. That episode marked
    the beginning of a violent period that enveloped Gracchus''s brother Gaius and
    saw his murder in 121 BCE after he had instigated a variety of popular and aristocratic
    reforms. In this this era, Cicero seems to think, that Rome''s republican constitution—which
    unwritten, hence the importance of custom and precedent—became endangered.


    The setting of the dialogue is the estate of the former consul and hero Scipio
    Aemilianus, just outside the boundary of Rome, where he is spending the holiday.
    Plato''s Republic is a conversation about justice and other matters among people
    at leisure, so is Cicero''s. But Cicero announces from the beginning that he is
    no imitator of Plato by delivering a preface in which he questions the desirability
    of leisure; in other words, he questions the precondition of his own dialogue
    (Rep. 1.1–13).² In doing so, he raises the question of whether the best way of
    life is practical (political) or theoretical (contemplative).


    Cicero knows that many or even most of his readers will have heard the best way
    to lead a life of moderated pleasure. Thus he tries to show the necessity of a
    concern with public affairs by contrasting the activity of political leaders with
    that of philosophers. Although it may seem that he is attacking philosophy in
    general, he affirms that there are some philosophers who perform a public service
    through their writings about political things (Rep. 12). Cicero has not yet settled
    the question of the best way of life he knows that he has made controversial assertions:
    especially the claims that the highest use of virtue is found in government and
    that political leaders are superior in wisdom to apolitical philosophers.


    Once the dialogue commences, Scipio takes the lead. Cicero chooses Scipio''s life
    as an admirable combination of practical and intellectual achievements. Scipio,
    therefore, is apparently someone who can speak about Rome with political experience
    and philosophical awareness. The historical record does not allow us to confirm
    or reject Cicero''s judgment about the latter, but Scipio did know the Greek historian
    Polybius, the Stoic philosopher Panaetus and the Roman poet Terence. Scipio''s
    supposed combination of accomplishments is well suited for provoking readers to
    further reflection on the life Scipio initially dismisses discussion of


