  md: '# Fragments


    +   1. (from book 3) Who will be able to protect the allies if he does not have
    a choice between advantageous and disadvantageous things?^1

    2. (from book 5) Then, the sun now seems to have declined a little from midday,
    and this entire place is not yet shaded enough by these young trees, do you want
    us to go down to the Liris and pursue the remaining matters in those shady retreats
    of alders?^2

    3. (uncertain location) Just as the universe, all of whose parts are congruent
    with one another, coheres and supports itself by one and the same nature, as all
    human beings, joined among themselves by nature, disagree due to depravity, do
    not they understand that they are blood relatives and all subject to one and the
    same guardian. If that were grasped, surely human beings would live the life of
    the gods.^4

    4. (uncertain location) And let us call ourselves happy, since death will bring
    a condition better than that of life or certainly not worse. For divine life exists
    when the soul thrives without the body; and without sensation, there is surely
    nothing bad.^5


    ^1Macrobius, On the Differences and Similarities between the Greek and Latin Word
