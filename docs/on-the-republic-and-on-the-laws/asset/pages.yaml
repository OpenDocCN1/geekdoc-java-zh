    justice were natural, it would be the same for all people, yet people have extremely
    different views of justice (Rep. 3.8–11). But how sound is that argument? Does
    the existence of disagreement prove that no view is true, or is it possible that
    some people may live in error, perhaps for a long time, about what is naturally
    just?


    Philus ran wisdom ahead of justice, but Laelius will not cede the territory of
    mind. By paying attention to the mind, Laelius argues, is to discern a natural
    hierarchy of mind over body, reason over lust, and ultimately god over man; for
    that hierarchy will lead a person to recognize the law of nature (Rep. 3.21–22,
    27). The reader should consider Laelius''s account of natural law is compatible
    with Scipio''s in book 1, as how Laelius''s definition of a just war differs from
    Scipio''s in book 2 (Rep. 3.24–26).


    Book 4 is highly fragmentary, but we can observe the following developments: Some
    character (which one is unclear) needs to reassert that the cause of political
    communities is living well, not merely the prevention of harm, after Philus called
    that into question (contrast 3.17 with 1.39 and 4.1). Tubero has his question
    addressed from the end of book 2 concerning how to preserve the best republic.
    Cicero wants to have stern morals than those of the Greeks, which are reflected
    in Greek licentiousness concerning gymnastics and poetry (especially comedy) (Rep.
    4.2a, 204a–23).


    In book 5 (even more fragmentary than back) Cicero returns to the subject of the
    guide, which has been previously addressed (Rep. 2.51, 67, 69; 3.3). Although
    Cicero sometimes seems to suggest that a ruler, there is no conclusive evidence
    that a monarch is intended, or even a single office. The guide must have moral
    virtue, prudence (see also Rep. 6.1), and wisdom. He must be able to shame people''s
    opinions through institutions and training, using shame as at least as much as
    fear. Scipio had compared that ability to the guide''s facility in directing a
    wild beast “wherever he wants (Rep. 2.67), but the mixed constitution and the
