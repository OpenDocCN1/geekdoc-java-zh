    [11.7] Next have been placed those things that we also have in our political institutions
    and laws: “Let them look out for the taking of auspices; let them augur.” Furthermore,
    it is the part of a good augur to remember that [he] ought to be at at the most
    important times of the republic, that he has been given as adviser and assistant
    to Jupiter the Greatest just those whom he has ordered to be at the taking of
    auspices are to him, that parts of heaven have been marked off and assigned to
    him, from which he can often bring sanction to the republic.


    [11.8] Then concerning promulgation, concerning conducting matters individually,
    concerning licensing to private men or magistrates. [11.9-10] Then two laws transferred
    from the Twelve Tables, of which^{73} the other forbids proposals concerning the
    life of a citizen except through the greatest assembly of the people.^{74} And
    since seditious behaviour of the plebe had not yet seen, not even imagined, it
    must be marveled that our ancestors had so much foresight. They did not want laws
    to be provided against private men: that is a law of privilege. What is more unjust
    than that, since the significance of law is [that it should be] a resolution and
    an order for all? They did not want [laws] to be provided concerning individuals
    except in the centuriate assembly. A people regarded by wealth, social class,
    and age displays more judgment in its vote than it had been called together by
    tribes. Thus all the truer is that Lucius Cotta, a man of great talent and prudence,
    said in my case, that nothing at all had been done about me.^{75} Besides the
    fact that those were invalid [since] they had been carried out through the weapons
    of slaves, no [decision] by the assembly arranged according to tribes concerning
