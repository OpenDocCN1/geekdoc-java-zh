  md: '# Note on the Text and the Translation


    politeia, refers to the distribution of power within a city. The phrase res publica
    cannot be translated as "republic," but I do so often as the context permits.


    2. The Latin title of the other work in this volume, De legibus, contains a form
    of the word lex. The words lex and ius may be translated as "law," but the latter
    has a broader range of meaning. Ius may have the following meanings, among others:
    (1) right or righteousness, in the sense of what is right (akin to the Greek diikaiion);
    (2) justice (synonymous with the Latin iustitia, akin to the Greek dikaiosune;
    almost identical to the first meaning); (3) law (synonymous with the Latin lex,
    (4) a right to do or have something (for which there is no Greek equivalent which
    evolves to assume significance in modern political philosophy). By means brackets
    I indicate instances where ius is translated as "law" in sections where lex is
    used, and I indicate instances where ius is translated as "justice" in sections
    where iustitia is also used. Wherever the reader finds the noun "right," the Latin
    word so translated is ius.


    3. The Latin optimus (plural optimatum), when it refers to a person, is translated
    as "best man" or "excellent man," while the plural optimates is translated as
    "aristocrats." Cicero uses the terms synonymously. The English "aristocrat" derives
    from the Greek aristrateia, meaning "rule of the best."


    4. The Latin "duty," officium, has the primary meaning of beneficial act or "service."
    I translate it as "duty" because sense of the word fits the context. Cicero''s
    last philosophical work was De Officiis, usually translated as On Duties.


    5. The Latin civitas is usually translated as "city." I have avoided the word
    "state" because it would lead the reader to forget differences between ancient
    politics, in which the main unit was the city, and the modern system of nation-states.
    Occasionally I have translated civitas as "citizenship" or "political community."


    6. The Latin virtus is always translated as the old-fashioned "virtue," never
    as the modern "value" with its relativistic connotations. What you and I hold
    as "values" may differ, but "virtue" has a firmer meaning.


    Some of the footnotes treat matter of translation. The index of terms in the back
    of the book should prove helpful to those who want to follow Cicero''s usage of
    important words.


    I have made one noteworthy concession to readability in the presentation of the
    Republic: I have put the speaker''s name at the beginning of every speech, instead
    of following Cicero''s use of introductory phrases in reportorial style. English
    words in brackets, of which result from'
