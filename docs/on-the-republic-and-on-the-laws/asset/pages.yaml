    \ are sought from copyists, so I notice that most men in magistracies, because\
    \ of their ignorance of the law [ius] concerning themselves,⁷⁹ are as wise as\
    \ their clerks they want to be. Therefore, if you thought that something needed\
    \ to be said concerning the transfer of ownership of the sacred rites when you\
