  md: '# Introduction


    Marcus Tullius Cicero is widely respected today as one of the two greatest orators
    (along with Demosthenes) of the ancient world and a brilliant advocate in legal
    cases. Many people hail him as a statesman who, while holding the highest office
    of the Roman Republic, saved Rome from the ruthless politician Catiline. But Cicero
    is not nearly as renowned as a philosopher, despite the fact that one of his works,
    On Duties (De officiis), became a textbook of moral philosophy for centuries.
    Over the years many scholars have regarded him not as a philosopher at the philosophical
    schools of his day, they have been prim the sources from which they believe he
    must have taken his material. In the political parlance of today, those scholars
    are Cicero’s “handlers”—advisers who want to see nothing original from their man
    but instead insist that this volume is a translation and not a monograph, it is
    easier for me to make the handlers step aside so that I may follow this principle:
    Let Cicero be Cicero. If I accomplish that goal, you will not see only a politician
    who can think for himself, not merely an orator for the ages, but also a philosopher
    of considerable merit.


    The primary objective to accomplish that goal is that both of Cicero’s works in
    this volume have come down to fragmentary condition. Of the first, On the Republic
    (De re publica), about one-fourth of the manuscript survives. Cicero does not
    list the second, On the Laws (de legibus), among his published works—an indication
    that he never completed it—and we probably do not have the end of what he did
    complete (for the list see Cicero, On Divination 2:1–4). Nevertheless, it makes
    sense to unite these works because they are Cicero’s two most important writings
    in politics and government, and because the Laws refers to the Republic and hence
    sheds light on it.'
