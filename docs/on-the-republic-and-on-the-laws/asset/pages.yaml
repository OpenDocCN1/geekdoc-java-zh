    Scipio and Aristotle agree that among desirable forms of government, the three
    simple forms are the rule of the one, the few, and the many. But each simple form
    has a tendency toward faults; and because the almost divine ability required to
    prevent these faults cannot be expected, Scipio begins to argue that a mixture
    of the simple forms is best (Rep. 1.45).


    Laelius interrupts movement in the conversation by requesting Scipio give the
    arguments for the simple forms (Rep. 1.46). The case for the rule of the many
