  md: '# On the Laws


    life of a citizen could be valid, any [decision] concerning a law of privilege.
    For that reason he said that I had no need of a law, as nothing at all had been
    done concerning me the laws. But it seemed better both to you and very famous
    men for all of Italy to show what it felt about someone concerning whom slaves
    robbers said that they knew something.


    [11.11] Laws concerning wealth that has been taken and bribery. And since such
    should be established by judicial payments than words, [11.12] it is added, “Let
    be a penalty equal to the wrongdoing,” so that each man may be punished for his
    own vice: let violence be made punishable with [loss of] public life,76 avarice
    with a fine, desire for ignominy.


    [11.13] The final laws are not familiar to us but are necessary for the republic:
    we have no guardian of the laws, so the laws are as our clerks work. We see them
    from copyists, and we have no memory recorded in public documents. The Greeks
    are more careful about this: nomophylakes77 are chosen among them. [Formerly]
    they kept an eye not on the documents (that existed among our ancestors) but also
    on the deeds of human beings, and measured them by the laws. [Therefore] let this
    be given to the censors, since we want them always to exist in the republic.


    [11.14] In the presence of the same man, let those who have left a magistracy
    explain what they have carried out in their magistracy and let the censors give
    preliminary judgment concerning them. This happens in Greece with publicly established
    accusers, who certainly cannot be respected unless they are volunteers.78 For
    that reason it is better for accounts to be referred, and the case explained,
    to the censors; but the case should be kept open to the law, an accuser, and a
    court of law. But enough has now been discussed about magistrates, unless by chance
    not you desire something more.


    A: If we are silent? Doesn''t the topic itself remind of what you need to say?


    M: I need to say? I think you mean about the courts of law, Pompeius. In fact
    that is linked to the magistrates.


    A: What about the law [ius] of the Roman people, with which we began? Don''t you
    think something needs to be said?


    M: What in the world do you lack on this topic?


    > 76Or“life.” For analysis see Dyck, Commentary, 548.


    > 77Guards of the laws; they watched over the public archives and ruled on the
    constitutionality of laws.


    > 78In Athens logistai were financial accountants, and euthunoi determined whether
    public or wrong had been committed.'
