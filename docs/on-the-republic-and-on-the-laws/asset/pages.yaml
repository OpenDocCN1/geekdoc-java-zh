  md: '# On the Republic and the Laws


    This translation is the first to make full use of the latest edition of the Latin
    texts: M. Tullius Cicero''s ''De re publica'', ''De legibus'', Cato Maior de senatu,''
    ''Laelius de amicia'', ed. J.G.F. Powell, Oxford Classical Texts (Oxford: Clarendon
    Press, 2006). That edition replaces K. Ziegler, de re publica: Liborum sex quae
    manserunt, 7th ed. (Leipzig: Teubner, 1992). Occasionally I have departed from
    Powell''s texts. The existence of many fragments in the Republic makes it tempting
    for a translator to undertake a reconstruction of the text in line with what he
    Cicero intended; but I have usually avoided such speculation or argument, preferring
    the solid ground of producing a translation that can be used alongside Powell''s
    excellent scholarship.


    Four translations of the Republic into English still cite: those of Clinton Walker
    Keyes (Loeb Library, originally William Hermann), Niall Rudd (Oxford University
    Press), George Holland Sabine and Stanley Barney Smith (originally Ohio State
    University Press), and James E.G. Zetel (Cambridge University Press). The editions
    of Keyes, Rudd, and Zetzel also contain the Laws. I have benefited from the labors
    of all of these scholars, as well as Zetzel''s commentary on parts of the Republic,
    Karl Büchner''s commentary on the Republic, and Timothy W. Casper''s and Andrew
    R. Dick''s commentary on the Laws.


    To one extent or another, each of the four translations gave too much little of
    Cicero. In keeping with the principle announced at the beginning of the introduction,
    my animating desire has been for the reader to be able to come to grips with Cicero
    in the author''s own words as possible. I have tried to enable the reader to study
    the terms that were important to Cicero understood them. Even if the task is endless
    for the translator and the reader, the effort is nonetheless worthwhile. Thus
    my method of translation has been to be as literal as consistent with readable
    English.


