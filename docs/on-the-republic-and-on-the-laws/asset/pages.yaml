  md: '# On the Laws


    [10.8]⁶⁶ A following one concerns those who have the right of conducting public
    business with the people or with the senate. [10.9] An important and, I think,
    splendid law: “Let those things that are done through the Fathers be moderate,”
    that is, temperate and settled. He who conducts public business directs fashions
    not only minds and wills but most the countances of those among whom he acts.
    But that is not difficult in the senate. for a senator is not someone whose mind
    is carried away by one who conducts public business, but someone who wants to
    be wanted for himself.


    [11.1] There are three orders for him: that be present, for the matter obtains
    when the order⁶⁷ has its members present; that he speaks in long speech, that
    is, when he has asked; that he speaks with measure, that is, not endless. Brevity
    in [speaking] an opinion is a cause of grace, not only for a senator but also
    for an orator. He should never use a long speech, [which happens most often in
    canvassing votes,] except [when] the senate does wrong, and no magistrate is assisting,
    or when the cause is that there is need of an orator ability for curing or teaching.
    Our friend Cato⁶⁹ is great in both of those respects. [11.2] What is added: “Let
    him have a grasp of the people’s concerns.” It is necessary for a senator to know
    the republic. And that has wide application: what soldiers, what it is worth in
    its treasury, what allies the republic has, what friends.⁷⁰ what tributaries,
    the law, agreement, and treaty for each one; to maintain the customary of making
    decrees; to know the ancestors’ precedents. Now you see the entire range of knowledge,
    diligence, and memory, without which a senator can in no way to be prepared.


    [11.3] There are actions with the people, the first and greatest of which is,
    “Let violence be absent.” Nothing is more disastrous to cities, nothing so contrary
    to right and laws, nothing less civil and more savage, for anything to be done
    by violence in an orderly, established republic. [11.4] It orders a person to
    obey someone who exercises a veto, and there is nothing superior to that; for
    it is better for a good to be hindered than a bad to be allowed. [11.5] As to
    my order that is an offense by the one who conducts public business, I said that
    based entirely on the opinion of Crassus, a very wise man⁷¹ The senate found him
    concerning the sedition


    > ⁶⁶There is no commentary on Leg. 3.10.7.

    ⁶⁷Le, the senatorial order.

    ⁶⁸Le, in order to prevent a resolution from passing.

    ⁶⁹Marcus Porcius Cato (2).

    ⁷⁰The senate granted the title “friend of the Roman people” upon a magistrate’s
    request.

    ⁷¹Lucius Licicinius Crassus.'
