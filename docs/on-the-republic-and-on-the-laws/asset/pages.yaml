    in extraordinary circumstances. Marcus would reinstate an augur’s order which
    the augurs did not perform when this work was written (Leg. 2.21.1). Capital punishment
    would be decreed for those who disobeyed an augur’s order (Leg. 2.21.6). Marcus
    would also raise the significance of the fetials, the priests who once represented
