    But servants, finally, are walled off the resources that facilitate mobility.
    Balram is resigned to overworking at the service of his employers for the sake
    of not returning to his native village. Ashok and Pinky brutalise him, mock his
    lack of formal education, and even plot for him to be blamed for the death of
    a child run over by Pinky. Symbolic violence and symbolic capital underscore the
    caste/class markers at Buckingham Towers,, as much as physical violence does in
    Laxmangarh: “We have left the villages, the masters still own us, body, soul,
    and arse."


    Neither stimulus from the liberalised economy nor the action of a technocratic
    NMC encourage the social mobility that will enable India to be on par with China.
    Mumma/Balram/Ashok Sharma are avatars of the same individual, one among the millions,
    waiting expect to belong proudly to the nation and share the boom of the Asian
    Century. It is not ghar wapsi, but another, more inclusive kind of contract that
    the White Tigers seek.


