    And, when she was forcibly produced before the press and the representatives of
    the United Nations as a trophy on display, she denounced the state and also learned
    from a doctor that the FMLN was doing fine and the war was on.^{18} How do we
    read this in terms of material performativity?


    Crucial to understanding the workings of power is an understanding of the nature
    of power in the fullness of its materiality. Restrict power''s productivity to
    the limited domain of the "social", for example, or to figure matter as merely
    an end product rather than an active factor in further materializations, is to
    cheat matter out of the fullness of its capacity. How might understand not only
    how human bodies are constituted through psychic processes but how even the very
    atoms that make up the biological body come to matter and, more generally, how
    matter makes itself?^{19}


    That is why, as Nidia Díaz survived to tell her tale herself, she politicised
    her stories in retelling. She only found dignity in her revolutionary struggles,
    both the frontline battles as well as the struggles during interrogation. The
    retelling happens as interrogation as performatives, challenging representational
    paradigms of the testimonial or the diary. There are no witnesses to her narrative,
    except for the body itself the body hides perhaps some of the worst scars. Diaz
    does not allure to any moment of her own rape she writes about her horror as she
    was forced to listen to others being raped or tortured.


