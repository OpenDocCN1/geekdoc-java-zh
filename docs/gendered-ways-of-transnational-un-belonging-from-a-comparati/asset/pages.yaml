    # ## The Paradoxes of Millay’s Empiric and Poetic ‘I’s

    ## in her Life


    For Julia Kristeva, the question of female status is not a static condition,

    but a permanent process of formation of subjectivity closely related to the

    context(s) of the subject and, of course, to the tool used to interact with the

    others: language. Language is thus no longer a static meaning system with

    one directionality as claimed by the psychoanalytic theorists; it

    evoles and changes with the subject as it also represents the subject’s\inner
    changes. As Kristeva states, the process is what energises

    deconstructing the signs with which the individual expresses his or her

    identity: "The process dissolves the linguistic sign and its system (word,

    syntax), dissolves, that is, even the earliest and most solid guarantee of the

    un subject."


    Jacques Derrida once stated that writing is a process of a never-ending

    quest for meaning. For him, texts were just a part of a whole whose center

    is in permanent movement or, using his term, ‘deferred.’ This was the

    basis for his celebrated theory of ‘deconstruction’ that states that texts can

    only claim authority to the inner signs that compose them, then denying all

    the formerly granted authority to the outer world that they were supposed

    to re-present. Traditional pairs of ‘opposites’ share a missing piece that

    tothers, at this point, what Derrida

    referred to as the trace’: the far and remote origin of a non-existent origin,

    a ‘deferred’⁸. The removal of rigid structures: human’s ‘opposite’

    (nature) and means ‘opposite’ (women) accounts for a virtual impossibility

    to close-up identities separated from their counterparts.


    Millay’s intense struggle for women’s independence and social

    recognition as equal citizens to their male counterparts is in sharp contrast

    to the last lines of her poem. “The Penitent” tells the story of a repentant

    woman who has a “little sorrow / born of a little⁹ who found a room

