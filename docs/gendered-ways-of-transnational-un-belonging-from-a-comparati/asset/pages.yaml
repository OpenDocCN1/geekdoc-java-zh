    # Hosseini''s Representations of Feminist Self-Assertion


    But the novel is not simply a tale of pathetic victimisation. It is also a tale
    of heroic resistance based on the ever-growing bonding between two women who initially
    saw each other as enemies. Moved to murderous fury by the news of Laila''s meeting
    with her long-estranged lover Tariq, Rashid unleashed a horrible assault on both
    Mariam and Laila, in which, Laila would surely have been strangled had it not
    for Mariam''s decisive intervention. Overcoming years of fear and subjugation
    she decides decides shape the course of her own destiny and Rasheed''s murder
    becomes a heroic act of resistance necessary for their emancipation. Mariam''s
    action connects her with the likes of Phoolan Devi and Commandanta Esther27 and
    becomes symbolic of postcolonial women''s resistance against patriarchal violence28.


