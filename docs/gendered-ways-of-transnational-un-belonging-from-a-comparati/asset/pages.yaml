  md: '# Space, the Fifth Pillar of Feminist Literary Criticism


    # Space as a Substantive Element in Gnosticism


    The common thread of space runs through the various places that constitute culture
    — the house, the school, the temple, the café, the work — each spatially organised
    place is inalienable from cultural perceptions. Linda McDowell, the noted feminist
    geographer, maintains that it is widely agreed that location – the standpoint
    – of the theorist makes a difference to what is being claimed.⁸ By the same token,
    locations featured in the text also make a difference to what is being claimed.
    When women writers move the narrative onto abandoned beaches populated by militants
    or temples embellished by erotic sculptures they reject ghettoised interiors and
    prescribed places — they contest, subvert, and appropriate spatiality, the places
    become agency-laden, critical, and liminal, breaking prescribed frontiers. Thus,
    space emerges as a substantive perspective in the cultural viewpoint demarcated
    by Showalter, and the location of the characters along the spatialization of that
    location in a literary narrative makes a difference to what is being said. The
    space that emerges from the pens of Peri Rossi and Roy ceases to be an “inert
    and static entity on or through which cultural forces operate”⁹, it becomes an
    autonomous element of material culture.


    # Relocating Space in the Chronotope


    Space is always impregnated with time in a literary work. Bakhtin articulated
    the inseparability of spatiality and temporality in his concept of the literary
    chronotope. Bakhtin identified five major chronotopes and five minor ones, among
    these, the minor chronotopes of threshold and its antithetical chronotope of the
    Gothic castle are of particular interest to the attempted readings of the selected
    works of Peri Rossi and Roy.


    Though Bakhtin treated time as the primary axis, perceiving the chronotope of
    threshold, he seems to hint at some circumstances that may dissolve the primacy
    of time over space. In the chronotope of threshold,


