  md: '# 76 Space, the Fifth Pillar of Feminist Literary Criticism


    Rarification and saturation are the two terminal points of the spatial axes; while
    in a rarified state spatial information remains static, undisturbed by new stimuli;
    in a saturated state spatial information undergoes a radical change under the
    impact of a constant flow of new information. The axis of temporal awareness calibrates
    the slowness or acceleration of reactions to new information. Keunen explains
    slowness and acceleration as temporal variables dependent on memory and anticipation.
    When memory is the dominant force in consciousness, reactions are slow, when anticipation
    commands consciousness, reactions to new information are accelerated.


    Sometimes, the observing consciousness halts the processing of information in
    such a way that an effect of slowing down occurs: at other moments, the impression
    of acceleration arises, because the consciousness reacts in an unusual way to
    the new information...temporal processes slowing down and acceleration are related
    to the way in which consciousness deals with memory and anticipation.19


    In time, preponder of memory makes consciousness passive, in accelerated time
    consciousness is active because knowledge from memory is subjugated to new information
    and anticipated states. Though Keunen''s analysis suggests that in the chronotope
    of threshold there is a "strong influence with nnemonic material,",20 the transformative
    power of threshold, in the seashore narratives, seems more suggestive of preponderance
    over memory.


    Centripetal narratives that are directed towards a telos are characterised by
    rarification and slowness because the comprising events are determined by chance,
    not by consciousness. Even though the adventure novel may transport its characters
