    ones. Even after so many years of the Dirty War, there is a constant effort to
    put in place the stories of kidnappings, tortures, and deaths making the metanarratives
    of the Argentinian history of dictatorship?


    While active resistance is still in Argentina, an equally daunting manifestation
    has emerged vis-à-vis cultural production. Short stories, chronicles, novels,
    essays, interviews, documentaries, and films continue to discursive this moment
    with Argentine history with fever. This paper looks how torture played out on
    the bodies and particularly women’s bodies and how it is constantly becoming a
    recurrent theme with which many Argentine artists continue to grapple. In doing
    so, it focuses on films that depict this particular period either as a main narrative
    or as a backdrop to other stories to examine how the body foregrounds itself in
    repressive regimes on which a counter-narrative of resistance is played out. In
    order to approach this subject, an initial sketch of body as subject of new theoretical
    conjectures and knowledge formations is drawn upon.


