    # The Victim, the Resuer, the Saviour, and the Martyr


    “La Anunciación” and “Naufragos” both describe rescue attempts. The protagonist
    of the former is a young boy who seems engaged in a mindless game of picking stones
    and other debris from the sea bed. He rescues them as if they were creatures.
    He thinks he is alone, until one day when he sees a woman dressed in white walking
    from the sea towards the shore. He ree her as the Holy Virgin reigns in his village
    church and builds a temple for her. Eventually, his efforts in invoking the divine
    power in the apparition are seem to be misdirected and futile. The sea, which
    is enemy, destroys the temple. At the same time some soldiers who had been hiding
    in the woods firing at the bay. At this juncture, the boy becomes the saviour
    and the goddess from whom he expected miracles, finds herself in need of rescue.
    The other rescue story, “Naufragos” describes the fates of two survivors in the
    immediate aftermath of a shipwreck. When, having reached the safety of the shore,
    decides to come back to rescue the woman.


    Whereas in “La Anunciación” the chronotope of the seashore generates an ambience
    of abandonment on the sea shore, and locates the rescue outside the sea, focusing
    on the objects and the apparition salvaged out from the sea, “Naufragos” shifts
    the narrative space further away from the border to the fluid sea itself. Locating
    the story in and within the sea makes the chronotope less saturated. The flow
    of information is condensed to what is conveyed by the sea alone with minimal
    intervention of other forces, consequently the chronotope is rarified. The space,
    though in a constant state of turmoil from the very start of the narrative, does
    not undergo radical change; the modulations in spatiality are purely emphatic
    not transformative. But Peri Rossi manages to transplant the chronotope of threshold
    from its natural soil of “saturated” space to a “rarified” one by accelerating
    time. Her unusual pairing for a centripetal narrative, establishes a gender difference
