    # Conclusion


    Through the use of Barad''s philosophy to read a non-canonised third world text,
    we have managed to gather new tracks of knowledge? Diaz fights against becoming
    a passive knowable entity and instead winds up as the know and the knowledge maker
    through her discourse. At the same time, we can avoid slipping back into a Nidia
    Diaz subject as a privileged subject that is uniquely again laden? Why should
    a material understanding of this subject matter? Her blood and bones perform as
    non-animate things along with those of her comrades, of the materiality of the
    prison cell, of El Salvador as a geopolitical matter. Most important is the material
    ontology of timespacemattering as the memoir divests itself from a presence in
    time and space and becomes the material time space hanging between here and there
    and will be also between now and then and will be. The margins of the body-matter
    of Nidia Diaz are not a fixed social and political containment as it stretches,
    retracts, or springs back and forth in unstable and unpredictable spatio-temporal
    moves, rather becomes those moves. As the FMLN and Diaz struggle to deepen democracy
    and work towards the material act of demilitarisation and democratisation of hyper
    masculinity in post-dictatorial El Salvador, the memoir actively engages in this
    process too. In an interview 20 years later, she continues to remember the names
    of the dead revolutionaries while reveling in her continued struggles to decolonise,
    democratise, and dialogue in order to comply with the vitality of the FMLN''s
    real material goals. Yet there can never be any erasure as precipitate over matter
    into historical reminiscences. While history had always felt most comfortable
    in the domain of representations, the present reading precludes dispensing with
    the material reminiscences such as pain, blood, violence, jail cell, guerrilla
    wars, sky, and trees. In this war between wordy representations and material performance,
    Díaz'' body as we have said, had become therapified into a trophy on display and
    an object of exchange for the president''s daughter.


    > 37. Barad, Meeting the Universe Halfway, 360.'
