  md: '# INDO-Oriental TANTRA IN THE WEST—

    FROM KNOWLEDGE TO COMMODITY:

    THE RECOURSE OF A PRIVILEGED

    DISCOURSE IN THE POPULAR


    # Abstract


    ‘Oriental sex’, as Edward Said observed, was “as standard a commodity as any other
    available in the mass culture”. Historically, as it was categorically constructed
    in the West through manifold proliferations of religio-confessional and literary
    discourses, began to sense a serious lack of spirituality in the late 19th century.
    At that precise juncture, Oriental discoveries delivered the most precious element:
    the exotic religio-sexual culture of the Indo-Oriental world, namely, tantra.
    Evidently, the cultural remnants of scientia-sexual found a new shelter in magia-sexual.
    Society promoted soon established itself as two things: one to revitalise the
    mundane sexual practices of the West by adding elements of spirituality in sexuality;
    second, it ensured that sexual practice has a higher meaning – the pleasure in
    carnal activities could result in spiritual apotheosis. In this paper I explore
    how ‘Oriental’ exotic sexuality gradually developed as a commodity, a lifestyle
    product for the Euro-American society in the postmodern world. I explore how it
    has formulated a distinct sub-genre of celluloid, media, and digital narratives
    promoting tantrism as a transnational cultural commodity in the global market.
    Finally, I will observe, how the heteronormative patriarchal definition of femininity
    is revalidated through this global transfusion of tantric sexual culture.


    Key Terms: Orientalism, tantra, sexuality, post-colonialism, scientificity.'
