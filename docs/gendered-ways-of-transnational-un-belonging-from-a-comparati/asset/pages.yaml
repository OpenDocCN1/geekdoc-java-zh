    # Centripetal and Centrifugal Energies


    The spatial-temporal unity in the chronotope of the seashore can be understood
    through a grid of rarification-saturation and slowness-acceleration. Keunen¹16
    draws upon the Bergsonian construct of Duration¹17 to map four possibilities of
    temporal experience. He terms these forms extreme because they are independent
    of biographical time. All events due to their inherent dialogic nature¹18 can
    be located on the cartographic space generated by the dual axes, each of which
    represents a process of change—change in spatial information and change in the
    awareness of time.


