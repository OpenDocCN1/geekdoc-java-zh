    Feminism of colour intersectional theory becomes instructive for the reading of
    American women’s poetry precisely because resistance to oppression is on multiple
    fronts, an oppositional stance that defies attempts to posit a unique Arab or
    Arab-American identity and argues for a multiplicity of readings. Indeed, Nimri
    Aziz, writing in 2004, charged that “we [Arab-American writers] expose little
    of the real conflicts we [...] I doubt if we can really advance without openly
    confronting the ills that afflict us, the barriers that confront us, internal
    and external. We are the opposite of the angry young artist at this point in our
    journey.” While it remains true that Arab-American poets, citizens of the United
    States, have emphasised external prejudices and injustice in their work over exploration
    of intra-community matters, a number of contemporary poets are essentializing
    definitions of Arab womanhood and Arab masculinity emanating from both private
    (intra-community) and public (Islamist-nationalist) discourses, often contextualizing
    these discourses through a relational examination of neo-colonial and orientalist
    discourses.


