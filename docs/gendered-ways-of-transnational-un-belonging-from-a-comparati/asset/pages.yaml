    The exception is one unforgettable scene, the best and most intense in the entire
    film, when it seems for a moment that Eliza, in utter despair, is about to kill
    her kids a gesture signaled merely, in a long shot, by her stepping behind them
    a clef, and then returning to her initial spot. This is a rare instance of “electricity”
    in Diaz''s cinema, with his way of showing an fuses perfectly with the dramatic
    content and his intent as a cruel moralist of our time.³


    We have accompanied Diaz and his women and the bodies of the latter, we have followed
    them to their (sometimes watery) graves.⁴ Where do they disappear? Their origins
    might be, as we see, traced back to histories of the archipelago, histories of
    the world, literary histories and biblical histories, to Rizal, and Dostevsky.
    But their point of no return, their future remains undecided, as the future of
    the world that they inhabit remains undecided too. Meanwhile we face people who
    do not disappear, who return from the threshold of disappearance. The scene that
    Martin describes as one instance.


    According to Martin, Diaz'' cruel moralist auteur-self treats him much better
    than his women. Eliza and her children, crushed under their burden, freeze off
    the cliff, from where only one Don Alberto have sent the children down so that
    they live forever with the angels of heaven, because nobody should do it.⁵ But
    Eliza is not a Catholic fanatic to be blinded by her imaginary service to God.
