    # Locating Agency and the Body as a Material Performative


    The experience of pain has a common reference point in the experiences of the
    guerrilla movement and comradery challenging its resistance to linguistic representation.
    Her “I”, constitutive of her own body and of those of all her cell-mates, therefore,
    is embodied/entangled material, working like an apparatus that measures selective
    objects as she hears of rape and torture inflicted on other cell mates, implying
    a kind of intra-active entanglement of the discursive and the material. It is
    positioning itself beyond an interplay of the Marxian speaking for/and as through/with,
    as a material production while also unsettling uncomfortable questions of temporality.
    The memory, likewise becomes a material performative. It is this positioning that
    becomes a non-ego agent subject, tending towards a commonality of a material cause/becoming
    of a revolution. The entangled “I” and the memoir thus blindfolded and embodied
    are pushing and pulsating along their own materiality as they re-member, re-process
    and re-code themselves with full political charge, creating thereby a kind of
    ungramity² through embodied modes of epistemo-ontological ‘disobedience’.²¹ Being
    is interwoven with matter so that spacetime is reconfigured through intra-action.
    Diaz responded to her interrogators by asking them where her disappeared comrades
