    In his History of Sexuality, Michael Foucault suggests the idea of scientia sexualis
    is intended to produce “scientific truth” about sexuality in the West. Simultaneously,
    Foucault observed that the Eastern civilizations have been practicing an ars erotica
    or erotic art since antiquity, where “truth is drawn from pleasure itself” through
    educational discourses on sexual knowledge and pragmatics, devoid of any “law
