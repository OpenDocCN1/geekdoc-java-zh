  md: '# Preface


    corporate entities. However, her analysis reveals that the advertisements, as
    mouth pieces of global capitalism, merely appropriate the vocabulary of feminism
    without any attempt to address its politics.


    Ratul Ghosh traces the processes that have framed Indian tantra as a transnational
    cultural commodity. His paper explains through the scholarship of numerous religious
    and philosophical scholars, by the first half of the 20th century, tantra had
    been established as an emancipatory discourse to Western materialism by explicating
    it as a quasi-scientific body of knowledge. Subsequently, celluloid, media, and
    digital channels were deployed for marketing sexual pleasure as a commodity. Ghosh
    explores how, in this strategy, the consumer becomes a student in the class of
    esotericism offered by the global culture industry.


    Sarat Kumar Jena traces the remnants of coloniality in the construct of modernity
    fostered by the centre on the periphery. The misrepresentation of indigenous identities
    does not end when the colonial era is jettisoned from power structures. The exclusionary
    democratic systems adopted by the decolonised nation-state initiate a local elite
    who further perpetuate the misrepresentation. Jena’s reading of Pratibha Ray’s
    Primal Land (Adhibumi) reveals that Ray’s construction of the sexuality of Banda
    women propagates a collective identity of the indigenous community and the translation
    of the text in English broadcasts the hegemonic representation of the Banda to
    a global readership.


    The last two in Part II are commentaries on diasporic writings from Australia.
    Tara Senanayake views the Sri Lankan-Australian writer, If the Moon Smiled as
    a contributory element in the invention of migrant identities and the creation
    of diasporic hybrid. The convergences between postcolonial and feminist approaches,
    whereby formulations attempt a defence of the marginalised order, are brought
    to bear on the ‘mapping’ of the protagonist’s body and mind. The paper considers
    the question the protagonist’s eventual “madness” is emancipatory or whether they
    confirm that the migrant woman’s sub-alter condition remains unchanged as she
    moves from a traditional, less developed country to a modern, economically advanced
    society.


    Juan José Cruz studies the enumeration of the inevitable human toll of economic
    growth in The White Tiger, by Aravind Adiga -- the Indo-Australian, Booker winner
    (2008). The epistolary form of the novel establishes a direct trans-national communication
    between a politically visible Indian picaro and a global political leader. The
    letters foreground the struggles of the underclass as it contests the centrality
    of the oligarchs. The gleaming veneer of modernity exposed by multi-national corporations'
