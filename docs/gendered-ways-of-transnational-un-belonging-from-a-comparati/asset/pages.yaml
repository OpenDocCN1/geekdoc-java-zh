    One manifestation was the protest of the mothers of disappeared children, known
    popularly as the Madres de Plaza de Mayo. It was the foremost organisation that
    tried to retrieve information of their ''disappeared'' family members. It had
    a humble beginning when on April 30, 1977 a small group of mothers gathered at
    the Plaza de Mayo Square to silently protest and mourn for their children who
    had disappeared since the military regime came to power. This act of standing
    quietly by supposedly innocuous and gentle mothers was essentially a challenge
    to the authority of the regime, which was notorious for not tolerating any opposition.
    Such was the regime of fear that all political formations went underground or
    in exile to avoid attracting any attention to themselves. And yet, the mothers
    stood just meters away from the Presidential Palace, La Casa Rosa, asking (without
    voicing) the whereabouts of their children. The mothers stood collectively, holding
    one another''s hands displaying their motherhood consciously by wearing white
