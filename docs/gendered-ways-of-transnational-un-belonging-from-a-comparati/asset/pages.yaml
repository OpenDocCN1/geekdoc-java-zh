  md: '188 Revisiting Edna St. Vincent Millay, the Forgotten Authoress


    # # Conclusion: The Dynamism of Organic Identities


    This essay has analysed the terms in which Edna St. Vincent Millay presents herself
    in relation to her context. The analysis developed based on the paradoxes that
    have existed in the life of this poetess, which have been reflected in her poetic
    work, with a special focus on the triad of identities. The multimodal approach
    presented in this article has enabled a new vision of the identity of the authoress
    of “The Penitent”.


    The present paper has explored the view this poetess had herself as a dynamic,
    changing subject, a subject in process, but also as an individual who belongs
    to a society that molds her and changes her identity. This analysis has allowed
    us to look deeply into the complex identity of Edna St. Vincent Millay where we
    have seen Kristeva’s subject-in-process, is here not only visible in the language
    the authoress uses to talk about herself but also in the dynamic identity of this
    poetess, her sense of longing for belonging.


