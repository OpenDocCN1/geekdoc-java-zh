  md: '# 266 Reading the Politics of Body through Films about the "Dirty War"


    The Dirty War started in Argentina in the mid-1970s, it lasted for almost a decade.
    The violent repression and the fear that the Argentine military state generated
    under the command of General Videla left an indelible blot on the minds of millions
    of its civilians. But at the same time this period of fear and frenzy also witnessed
    a new kind of resistance that delved into the human psyche and brought to the
    free discourses of the body, not just at an abstract theoretical level but in
    the everyday experiences of its people through the intricacies of memory and also
    through new/innovative forms of active resistance. This Dirty War had the characteristics
    of many things it was not: this was not the typical open war that was marked by
    the belligerose rants of generals of two charging nations; it was not a civil
    war where both factions were more or less armed and drawing each other into a
    guerrilla warfare that was articulated within the national boundaries. This ''war''
    was idiosyncratic to the absence of violence on one side and the unleashing of
    terrifying violence and by use of a plethora of apparatus within and outside the
    realm of the state, by other.


    Blatantly, the Dirty War in Argentina under General Videla was all unbridled,
    violent state terrorism between 1976 and 1983 (although some scholars date the
    beginning of the fear regime to 1969 during the latter half of the Peron regime).
    During this period military forces along with illicit right-wing death squads
    hunted down, tortured, and killed left intellectuals, guerrillas, trade unions,
    political and social activists, artists, writers, journalists, students, and anyone
    whom they considered to be associated with socialism in any way. The most notorious
    effect of this war was etched in Argentina collective memory its citizens. The
    ''disappearances'' were usually unlawful kidnappings, torture, and finally death
    in some inognito place carried out by the military junta or extra-legal death
    squads. This called ''disappearance'' was rampant that it became a salient manifestation
    with which the regime was identified, and it made desaparecido (appeared ones)
    notorious as a term of reference for all future anticocratic governments that
    unleashed state terrorism on their citizens across the globe.


    Conversely, if this regime is etched in the collective memory for all the pain
    and suffering it caused the people, it also remained etched in the collective
    memory due to the innovative forms of resistance that rose from the hitherto unexpected
    quarters during, and in the aftermath of, the military dictatorship.'
