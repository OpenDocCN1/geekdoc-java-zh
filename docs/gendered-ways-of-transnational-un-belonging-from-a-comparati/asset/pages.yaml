  md: '# REVISTING EDNA ST. VINCENT MILLAY,

    THE FORGOTTEN AUTHARESS WHO MARKED A GENERATION''


    # ANA ABIL HERNÁNDEZ


    # Abstract


    The literary work of the feminist poet and playwright Edna St. Vincent Millay
    (1892-1950) has gone through different stages of popularity. In the last few years
    the publication in graphic form of an adaptation of some of Millay''s poems has
    brought this forth again thanks to their graphic version in the Graphic Canon
    Vol. 3: From Heart of Darkness to Hemingway to Infinite Jest published in 2013.
    This article examines one of the poems published in her second collection of poetry,
    A Few Figs from Thistles (1920), entitled “The Penitent” in the light of a comparative
    multimodal approach of the original poem and its visual representation, in an
    attempt to deepen the paradoxical identity of the American poet.


    **Key words:** Edna St. Vincent Millay, intermediality, Subject-in-in-process,
    identity, graphic.


    # Introduction


    The poet, playwright, and American feminist activist Edna St. Vincent Millay (1892-1950)
    is the third woman author to win the Pulitzer Prize for Poetry in 1923 as well
    as the first woman to receive this award as we know it today. This American writer
    was born in Maine in 1892 in a family where culture occupied an important place
    in the lives and work of her parents: Henry Tollman Millay (a school teacher and
    later headmaster) and Cora Lounella Buzelle (a nurse). At the age of twenty, Millay
    – who


