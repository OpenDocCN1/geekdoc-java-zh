    Kumaran Asan is considered to be a poet who fundamentally changed the poetic discourse
    in Malayalam. Asan was born into an Ezhava family in 1873. During his childhood
    days, Asan learned traditional medicine, Sanskrit literature and astrology, and
    after elementary education he briefly worked as an accountant. His incessant desire
    for knowledge drove him to join a Sanskrit school called Vijnanasandayini. He
    started composing poems at an early age and later remarked that his attention
    had mainly been on prose and other poetic devices.¹14 A decisive moment in Asan''s
    life was his meeting with Sree Narayana Guru, at the age of 18, who became an
    important spiritual figure for the Ezhavas. Guru encouraged Asan in his poetic
    enterprise but is reported to have advised him “against an accent on erotic sentiment”.¹15
    Asan''s exposure to English literature— while he was away from Kerala for higher
    education— was a central influence on him. Asan rose to prominence with his Veena
    Poovu (Fallen Flower, 1907), considered to be the first lyric poem in Malayalam.
    He subsequently wrote longer poems such as Nalini (1911), Leela (1914), Chandala
    Bhikhukshi (1922), and Duravastha (1922) – sometimes drawing from the Buddhist
    and Hindu literary canon, and sometimes with their implied social commentary.
    Apart from poetic writings he actively participated in the political debates of
    the period and wrote political commentaries often delineating the suffering and
    marginalisation that his community had to undergo. His work was published in mainstream
    magazines addressing the sovereign and also the general public. He also served
    as the general secretary of the S Narayana Dharma Paripalana Yoga, the organisation
    of the Ezhavas that worked for community reform.


    The mark of subjectivity is clearly visible in Asan''s poem Veena Poovu. A very
