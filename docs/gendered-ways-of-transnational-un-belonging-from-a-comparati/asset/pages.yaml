  md: '# Space, the Fifth Pillar of Feminist Literary Criticism


    Bakhtin remarks, "the road is a particularly good place for random encounters...
    People who are normally kept separate by social and spatial distance can meet...The
    road is especially (but not exclusively) appropriate for portraying events governed
    by chance."¹⁴


    Just as the road is an appropriate space for random encounters, the seashore by
    its very geographic placement represents the final threshold. It is suggestive
    of transitions, it dissolves the borders of solid ground approaching, yet not
    attaining, the fluidity of the sea. It offers immense potentialities and becomes
    an appropriate space for "resurrections, renewals, epiphany." If a chronotope
    of the seashore were constructed then it would have to be located within the motivic
    chronotope of threshold that is connected with "the breaking point of life, the
    moment of crisis, the decision that changes a life (or the indecisiveness that
    fails to change a life, the fear to step over the threshold)."¹⁵


    # The Motif of Rescue in the Chronotope of the Seashore


    The chronotope of the seashore in the selected stories of Cristina Peri Rossi
    carries the motif of rescue as opposed to the motif of conquest, which is integral
    to several male representations of the sea. Among the selected stories, Tsunami
    and Naufragos overtly describe two contrasting rescue attempts—the contrast lies
    in the magnitude of the rescue and in the outcome of the attempts. The motif of
    rescue is also etched out in less bold lines with greater metaphorical complexity
    in "La Anunciación" where it plays out through two distinct metaphors—the retrieval
    of discarded debris from the sea and the defence of an apparition of the Holy
    Virgin from militants—both effected by a child. The chronotope of the seashore,
    which is the space-time configuration of the events on the seashore, in all these
    narratives are inextricably linked with the rescue motif. In order for the "event"
    of rescue to take place the spatiality must be fraught with danger, victims and
    the Saviour must populate the space at the same time, and the temporal framing
    must focus sharply on that moment in time wherein solely the spatial location
    of each character at the critical moment will confer the status of victim or saviour
    on them.


