    # Abstract


    Indian cinema is strewn with misogynist cultural practices in Indian society.
    Most mainstream Indian films just end up replicating a damsel-in-distress stereotype
    of Indian women whose fulfilment lies in finding, in a marital partnership, a
    solid salvaging support to protect and provide for her in her life. However, there
    are optimistic exceptions in some of the films, mostly in the tradition of parallel
    cinema, with occasional contributions of mainstream films as well, representing
    active resistance of female protagonists to the cultural practices of toxic misogyny
    and gynophobia. This paper aims at discussing this on-screen resistance of celluloid
    women to the regressive cultural practices in India by looking at selected premillennial
    films.


    **Key Terms:** Misogyny, cinema, gynophobia, female stereotype, discrimination.


    In an aggressively male-dominated Indian society, reflections of social practices
    with its roots in the Brahmanical substructure and an affiliated toxic misogyny
    are rather common in the cultural practices that demonstrate a visceral connection
