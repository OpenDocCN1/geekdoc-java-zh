    cinema is strewn with references of gendered cultural practices of the society
    it represents, that is of repressing women''s agency, on screen. The representation
    of women in Indian films is usually done through the two most popular stereotypes,
    i.e. the naive infantile heroine and the seductress. By doing so they not only
    normalise oppressive practices, instinctual misogyny, and gynophobia present in
    the patriarchal substructure, but also validate gender-violence as'
