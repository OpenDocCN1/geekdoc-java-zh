  md: '# RECLAIMING THE VAGINA

    THROUGH EVE ENSLER’S

    THE VAGINA MONOLOGUES

    AND RESPONSES IN INDIAN ADAPTATIONS''


    # ANUM FATIMA AND ARIBA ZAINAB


    # Abstract


    Women are taught how to detach themselves from their bodies. Judith Butler discusses
    the hegemonic conceptual scheme in her book Gender Trouble (1990). She talks of
    how the concepts of gender, male and female or masculine and feminine, are placed
    according to Foucault''s power matrix. She points out how the heterosexual dynamics
    outcast ‘other’ different social or sexual dispositions. Eve Ensler’s The Vagina
    Monologues (1996) was an attempt to highlight how such a power-matrix works within
    the heterosexual society so to marginalise women and the sexuality of their bodies.
    The paper discusses how the Indian audience reacted to a body-part that, is the
    Vagina. When it was discussed it made the misogynist angry and the woman empowered.
    These monologues lay bare the prominence of one’s identity and an acceptance of
    it in its entirety. In this study, our purpose is to extract how the aforementioned
    adaptation in India is different, why it is different and how this change has
    contributed to the development of l''ecriture feminine in Third-World countries.


    Key terms: Bodies, language, power-matrix, marginalise, vagina.


    1. An earlier version of this paper was published as “Thus Spake the Body: Delineating
    Social, Cultural and Linguistic ‘Othering’ in the Indian Adaptation of Eve Ensler’s
    Monologues” in Lapis Lazuli, Issue Spring, vol. 7, (2017): 189-205.*'
