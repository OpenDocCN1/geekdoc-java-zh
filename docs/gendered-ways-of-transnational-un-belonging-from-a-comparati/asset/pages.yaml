  md: '# COLONIAL MODERNITY, FORMATION OF THE NATION-STATE AND TRIBAL IDENTITY: LOCALIZING
    THE IDENTITY OF BONDA WOMEN IN PRATIBHA RAY''S ADIBHUMI


    # SARAT KUMAR JENA


    # Abstract


    Representation of tribal society and culture in popular media in the early 20th
    century and even later may be seen as a political endeavour of the colonial elite
    and the local elite, both are equally responsible for the (mis)representation
    of indigenous societies and cultures. Similar colonial practices have been continued
    in free India. The ''ethnographic novel'' that appears as a minor genre of the
    modern indian literary canon may be examined in this context. This paper examines
    the debate of ''representation'' vis-à-vis ''mis-representation'' of social and
    political identities of Bonda Women in Pratibha Ray''s Adibhumi (The Primal Land,
    1993). Ray''s construction of the sexuality of Bonda women by borrowing available
    local myths and folktales propagates a collective identity of the indigenous Bonda
    community and the later translation of the text in English re-organises its global
    readership under a hegemony representation of the Bonda. This may be studied as
    an extended consequence of colonial modernity, heavily industrialisation in the
    Eastern Ghats in the 1960s and political (re)formation of the nation-state in
    post-colonial period.


    Key Terms: Tribal, indigenous, odisha, nation-state, feminism.


    # Introduction


    Pratibha Ray''s Adibhumi (The Primal Land 1993), a saga of the Bonda ethnic society
    and culture, is the first work of fiction about the indigenous community of the
    Koraput district in odisha. Ray received a fellowship from the Goverment of odisha
    in the 1980s for her postdoctoral research.


    *** Note'
