    By writing in Standard English, Umpierre appropriates a language that is considered
    privileged and is the one utilised in the United States by the powers she purports
    to resist. This act of engagement helps to shift the power of discourse back to
    her so that she can unleash attacks on her aggressors and on the discriminatory
    practices that accompany her actions."15 She also challenges the performances
    of inaction and acceptance that have been assigned to women. In her poem "In Response,"
    she writes:


    +   My name is not Maria Cristina

    I speak, I think,

    i express myself in any voice,

    any tone, in any language that conveys

    my house.

    The only way to fight oppression is through resistance:

    I do complain

    I will complain

    I revise,

    I don''t conceal,

    I will reveal, I will revise.16


    There are certain characteristics and qualities, which by being reiterated over
    and again again have been naturalised as belonging to and inherent to women. Waiting,
    patience, passivity, and defenselessness are considered customarily typical of
    the female gender. Umpierre breaks this cycle, and changes, reinterpre, and subverts
    the discursive codes that constitute women. By declaring that "I will revise",
    she highlights the need to use old structural discourses, and reconstit them from
    the margins.


    In the introduction to this collection of poems The Margarita Poems, the poet
    talks of ''Margarita''. She describes Margarita as "intoxicating drink, a flower
    back home in Puerto Rico, the title of a traditional ''danza'' that was a favourite
    of my mother, and the name of a woman I love. Margarita is all of these and none.
    Margarita is my muse, Margarita is my poetry, Margarita is my imaginary lover,
