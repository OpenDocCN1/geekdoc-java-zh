  md: '# # MAPPING MADNESS

    WHEN THE MOON SMILES:

    THE FASHIONING OF IDENTITY

    AND DIS(ORDER) IN THE FEMALE BODY IN

    CHANDANI LOKUGE’S IF THE MOON SMILED


    TARA SENANAYAKE


    # # Abstract


    The invention of migrant identities and the creation of diasporic hybridity have
    been central themes in the corpus of work by migrant writers of Sri Lankan origin.
    The representation and re-presentation of women as the “Sri Lankan Oriental Other”
    is also a key aspect in the Sri Lankan expatriate novel. Chandani Lokuge’s If
    the Moon Smiled is a story that charts the saga of a Sri Lankan woman in Australia
    who has lost her “self” and yearns for “home” as the migratory experience fails
    her. The trajectory of inquiry in this study relates to the manner in which Manthi’s
    identity is negotiated, as a woman and as a female migrant. The presentation of
    the corporeal female body as the site for the “mapping” of a rigid cartography
    by the patriarchal order will be examined by the author seems to suggest that
    such “mapping” will only result in a state of “madness”. Thus, different levels
    of madness – madness brought on by the lack of identity, the conflict between
    “home” and “received” culture, the loss of roots, and the inability to follow
    results will be examined in this paper.


    **Key Terms:** *Female identity, mapping, hybridity, disorder, diaspora.*


    > *Silence gives the proper grace to women.

    *Sophocles, Ajax*


    What we consider madness…is either the acting out of the devalued female role
    or the total or partial rejection of one’s sex-role stereotype.

    Phyllis Chesler, *Women and Madness*'
