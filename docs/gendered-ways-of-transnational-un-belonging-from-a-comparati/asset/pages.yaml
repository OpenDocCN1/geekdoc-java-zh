    the collective identity of the Bonda tribe – antithetical to the modern civilational
    project and traditional tribal ethos.


    # Conclusion


    Postmodern Odisha fiction, which continues to address the dominant themes of the
    subaltern, brings in discourses on the poor, women, tribes, untouchables, and
    ‘other’ marginalized groups that may be seen as a continuation of the colonial
    institutions of Empire. These dominant themes of the subaltern play an important
    role since the inception of fictional narratives in modern Odisha literature,
    which may be seen as an outcome of the meeting of British and Odisha modernity
    institutions as formation of ‘nation-state’ projects. In Adhibumi the colonial
    model of nation formation is seen as a dominant mode of addressing tribal identity.
    The narrative of Adhibumi may be seen as a complex structured text that has several
    layers of ethnic identities. A close observation of Ray’s narrative in Adhibumi
    and the representation of her feminist outlook, treatment of gender and myth,
    and sexuality of the Bonda woman, nature of fear and horror, landscape and ecology
    of the Eastern Ghats and the clash of tribal and non-tribal systems articulates
    the harsh realities of such confrontations. Though richly informed by her extensive
    research in the area, the narrative fails to use the wealth of information to
    enter deep into the complex causality of these confrontations.


