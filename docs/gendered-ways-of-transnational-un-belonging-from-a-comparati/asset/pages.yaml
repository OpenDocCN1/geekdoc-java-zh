    WOMEN EMPOWERMENT:

    A STUDY OF SELECT INDIAN

    TELEVISION/ONLINE ADVERTISEMENTS


    KAVYA KRISHNA K.R.


    # Abstract


    Recent years have seen the emergence of a ''new genre'' of television/online advertisements
    based on the theme of ''women empowerment''/ ''gender equality'' by neo-liberal
    companies. They are widely discussed and shared on social media for their apparent
    ''feminist'' stand point. While it is a global trend, this paper tries to understand
    this development by particularly looking at a set of television YouTube commercial
    series released between 2014 and 2016 in the Indian context. It is already understood
    that the epistemology and practice of feminism and the cultural logic of global
    capitalism are diametrically opposed to each other. If so, what triggered the
    increased interest in women empowerment in neo-liberal companies? Are the advertisements
    as progressive as they seem to be? Can the term feminism be easily interchangeably
    with the term empowerment? Which section of women do these advertisements represent
    and address? Can the analysis of these new advertisements add or problematise
    the existing feminist questions/concerns in the Indian context? By addressing
    these questions, the paper tries to expati the appropriation of feminism by global
    capitalism through the visual texts of advertisements and impact of the same for
    the political project of feminism.


    **Key Terms:** Gender, advertisement, visual culture, Indian Middle Class, intersectionality.'
