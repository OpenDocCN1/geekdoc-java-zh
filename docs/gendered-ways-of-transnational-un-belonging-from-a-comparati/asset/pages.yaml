    \ to destroy the artistic dimension of courtesan culture, by reducing it to bare\
    \ prostitution. I study the agency demonstrated by the sex-workers in establishing\
    \ a sense of ownership over their own bodies and defying the chauvinistic social\
    \ arrangement that posits their femininity as “impure” yet desirable. I also analyse\
    \ the role that the male-centric society plays in antagonizing women’s rights\
    \ activists, who promote a certain brand of contrived celibacy, against erotically\
    \ charged and socially marginalised females. The paper also examines how a brothel\
    \ becomes an indispensable limb for “socially legitimate” activities, whereas\
