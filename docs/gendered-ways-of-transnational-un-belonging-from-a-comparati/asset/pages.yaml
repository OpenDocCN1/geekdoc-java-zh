  md: '# Preface


    rhizomatic intersections of different kinds of gender related violence at play,
    un-weaving thereby predictable epistemologies. This new and rough un-weaving,
    cuts across fixed paradigms of institutionalized gender designs on one hand and
    deconstructs and problematizes said paradigms of the other.


    Thus questions of global and local transnationalism in our book address how the
    authors work either through representations or performatives of their own geo-political
    location or often through those of foreign ones but, always sited in spaces of
    translocation, transit, and the transnational from where they can see both sides.
    The unique feature of this book rests on this aspect of the authors'' locations,
    framing texts from a comparative literature and transnational perspective in this
    sense. The authors in this volume are unique in their double operation as they
    iteratively appropriate, reject, and hybridize hegemonic epistemologies. Use.
    the book not only provides a reading lens but also adjusts its focal length to
    cast light differentially from other books with seemingly comparable headings.
    Hence the title of the book is justified as we explore and explore the idea of
    ‘gendered ways of transnational un-belonging from a comparative perspective’.


    The papers are arranged in four sections: Un-belonging through displaced bodies,
    the democratic global, defiant re-writings, and defiled bodies. In the first section,
    Un-belonging through Displaced Borders, all five papers/authors track shifting
    bodies across nations, within nations, without nations or through the transnational.


    +   Mar Baz Radwan writes about the works of the two Arab-American poets, Laila
    Halaby’s poem ‘rage’ and Angele Ellis’ ‘The Blue State Ghazals’. They resist and
    insensitive ways of racial discrimination, in order to expose the hegemonic discourse
    of the post 9/11 situation and puncture stereotypical images of the Oriental Arab
    and the Christian American. Their poetry negotiates shifting borders of their
    own citizen status, of Americans and Arabs in the Iraq war, of fear and rage of
    imposed patriotism. What we see at play here are borders without and within nations/images/consciousness.


    Abin Chakraborty’s paper takes us to Afghanistan, in Khaled Hosseini’s A Thousand
    Splendid Suns, where women were caught in a double contradiction. While they mourn
    those who were killed as a result of fighting against the Russians, they are pushed
    back into the regressive regime of the US supported Taliban. ‘Can the white man
    save the brown woman from the brown man?’ becomes a transnational matter.'
