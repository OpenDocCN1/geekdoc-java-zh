    The industrial revolution in the 1960s appears as a political marker in the history
    of the Eastern Ghats. It is a period when two distinct societies—the tribal and
    the non-tribal, came in close contact with each other. The fact remains that the
    non-tribal society has always been the policy maker and occupies the pinnacle
    in the power hierarchy wherein tribal societies are left as the powerless and
    submissive group. They lie at the periphery of the democratic system. The non-tribal
    centre constantly attempts to alter tribal identities through socio-economic changes,
    political stands, industrialisation, policies for reformation and development,
    and spread of popular culture.


    In popular culture, tribal identity is shown as heterogenic and ambiguous. The
    narrative of Pratibha Ray’s Adhibumi may be studied as a fictional account that
    attempts a serious engagement with the ethnic identities of the Bonda connection,
    society, and culture dictated by a tribal, high caste Hindu and elitist point
