    # Introduction: Empire, Nation, and Women


    The predicaments faced by postcolonial nation-states around the world, while stemming
    from varied sources, have often been born out of complicated intersections of
    nation, empire, and gender, which have steadfastly determined that vision of horizontal
    comradeship is ideally supposed to be the bedrock of the imagined community of
    the nation. Instead, nationalist policies in different countries have often been
    imbricated in a typically patriarchal equivocation that has meant the consistent
    use of women as both icons and participants in nationalist movements even while
    denying them equality in socio-political structures. In fact, not only have patriarchal
    championed the confinement of women within the domestic sphere by positioning
    them as uncontaminable custodians of tradition but have vehemently opposed even
    their imperial laws that sought to provide comparative relief to colonised women
    by attempting to reform certain oppressive customs and conventions. In the native,
    native women not only bore the brunt of colonial lost and violence, which itself
    led to countless atrocities in colonies and plantations, even faced discrimination
    and inequality within their own communities where too they were often subjugated.
