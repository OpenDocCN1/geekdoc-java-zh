  md: '# SPACE, THE FIFTH PILLAR OF FEMINIST

    LITERARY CRITICISM:

    MILITANT BEACH AND EROTIC TEMPLE

    IN SEASHORE NARRATIVES

    OF CRISTINA PERI ROSSI

    AND ANURADHA ROY


    # JAVA SINGH


    # Abstract


    The practice of gynocritics, enunciated by Elaine Showalter, attempts to read
    the female difference in texts by women writers. In addition to the four pillars
    of difference identified by Showalter, space emerges as a substantive basis for
    differentiation of female texts through the lines of analysis developed in the
    first part of the paper. In the next part, Mikhail Bakhtin’s literary chronotope
    is explicated as a tool for reading the spatial differentiality of texts. Finally,
    the paper attempts to decipher the distinct female spatial strategy that emerges
    from reading the selected short stories of the iconic post-modernist voice of
    the Hispano-Uruguayan writer, Cristina Rossi¹,, and Anuradha Roy’s novel Sleeping
    on Jupiter.


    Key Terms: Space, gynocritics, seashore, chronotope, threshold.


    # Locating the Female Difference


    The sea is a "natural" frontier, located at the margins, yet when it is cast in
    literature and mythology, it occupies centre stage. Ram, Ravana, and Ulysses fulfil
    their destinies by making journeys across the sea, Captain Ahab in Moby Dick churn
    the sea in search of his adversary and Hemingway’s Old Man Santiago seeks his
    prized quarry in the sea.


    +   1. All translations of Peri Rossi’s works cited in the paper are mine.'
