    the existence and the representation of the bodies that do not fit within the
    lines clearly demarcated by the heterosexual society.


    Umpierre''s poetry is based on the premise that the body does not have an inherent
    truth. We create the said truth through the gaze, a gaze that can be turned blind
    by the normalised representations. She reveals the deceit of the naturalness of
    ''grammatical'' bodies. She challenges the labeling of the bodies into boxes based
    on dichotomous categorisations of male/female, heterosexual/homosexual/normal/abnormal.
    She works from the premise that a body at the same time could be one or the other,
    or none of these or all of these at the same time. She renders the labeling process
