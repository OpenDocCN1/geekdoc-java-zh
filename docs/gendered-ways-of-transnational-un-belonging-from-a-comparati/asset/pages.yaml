    # Female’ Spatial Strategy


    A chronotopic analysis of the texts marks out two ‘female’ techniques for effecting
    spatial strategy. The alternation between the chronotope and the chronotope of
    the Gothic castle highlight the contrast between established normative structures
    and liminal spaces. The contrast demonstrates that it is the liminal spaces that
    sustain aspirations and suggests how such spatially provide a creative impetus
    to “imag(ining)” as yet yet non-existing relationalities. The second technique
    of simultaneous evacuation of the antithetical chronotopes directly challenges
    the assumption of stability of inherited centres and the socio-political systems
    they propagate, chief among these, androcentric, patriarchal, homogenizing collectivities.


