  md: '# Key Terms: Intersectional/Transnational feminism, Arab-Americans, American
    ethnic literature, imagology, political poetry.


    Arab-American women speaking out, writing, and mobilizing in resistance to American
    cultural and political discourses, whether they are neo-colonial, nationalist,
    heteropatriarchal, or indeed, feminist is not a recent phenomenon, a flowering
    in the aftermath of the 9/11 attacks. Arab-American feminists have long understood
    that gender oppression cannot be divorced from other forms of oppression or more
    pointedly, that "an oppressive gender system [emphasis in original] work without
    the collaboration of other systems of power and oppression." The need to identify
    and investigate intersecting oppressions has also been at the heart of women-of-colourfeminism
    and many Arab-American feminists have claimed feminism of colour as their political
    and spiritual home. U.S. governments use the ''plight'' of Arab and Muslim women
    to generate support for war, when Arab nationalist leaders revoke women''s freedoms
    in the name of ''cultural authenticity'', when the mainstream women''s movement
    takes upon itself to voice the struggles of Arab sisters, the bounding of struggle
    with racial, colonial, and national oppression is clear. Strategies of resistance,
    then, for Arab-American feminists over the last two decades have predominantly
    articulated within intersectional and transnational feminist frameworks. A transnational
