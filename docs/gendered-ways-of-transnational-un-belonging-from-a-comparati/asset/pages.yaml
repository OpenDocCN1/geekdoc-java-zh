    class did not recognise issues related to the Dalit identity before this period.
    The mainstream Hindi film industry was dedicated to providing intelligibility
    only to the urban middle class. Consequently, caste identity and associated issues
    of discrimination were not viewed as something with a diegetic potential to initiate
    a popular celluloid effect on Indian screen. However, caste discrimination and
    untouchability were considered highly problematic practices by contemporary social
    reformers, political activists, and artists. For example, the Indian parallel
    or the new wave cinema made efforts to bring lower caste subjectivity and the
    question of gender as well as caste inequality on the big screen as part of their
    social realism and ideological paradigm.


    Unfortunately, instead of developing into a progressive discourse in popular cinema,
    this trend subsequently disappeared in the wake of the cinematic celebration of
    the hypermasculine figure of the young man in the 1970s. The emergence of this
    new development on Indian screen resulted in the gradual disappearance of passive
    and mellow masculinity of the male protagonist represented in pre-independence,
    and the first two decades of post-independence Hindi cinema. As a result, the
    role of the female protagonist slowly became more and more submissive, in conformity
    with the strictly defined gender role in which Indian women are supposed to be
    bound to the ''home'' space and kept outside the public sphere.


