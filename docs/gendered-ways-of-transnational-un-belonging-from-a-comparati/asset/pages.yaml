  md: '# ‘WOMEN OF COLOUR’ FEMINISM

    AND POST-9/11 ETHNIC IDENTITY

    IN THE POETIC DISCOURSE OF ARAB-AMERICAN WOMEN WRITERS


    # OMAR BAZ RADWAN


    # Abstract


    Resistance to the appropriation of Arab women’s bodies and cultural roles has
    been a cornerstone of Arab-American feminisms over the last three decades. Since
    the 9/11 terrorist attacks, the need to “write or be written”¹ has assumed a greater
    urgency, with the rise of anti-Arab bigotry, the sweeping deployment of neo-Orientalist
    narratives of Arabs and Muslims in the service of U.S. foreign policy, and the
    sanctioning of racial and religious profiling vis-à-vis the Patriot Act. Arab-American
    poet Nathalie Handal writes, “Who are you, if you answer and others still find
    it necessary to redefine your identity without your permission? [...] How do you
    define yourself when you’re hyphenated, or maybe even hyphenated, when you exist
    in the innessness of in-betweenness?”² In this article, I will analyse, using
    literary imagery as a methodological approach, the identity politics within rubrics
    of intersectional/transnational feminist discourse in the identity construction
    and ensuing mental images evident in the post-9/11 poetic discourse of two contemporary
    Arab-American poets, namely Laila Halaby’s poem “rage” and Angele Ellis’s “The
    Blue State Ghazals”.


    +   1. “Write or be written” farms one of the guiding principles of the Italian
    Writers Association, as Barbara Aziz Nimri notes in the foreword to Scheherazade’s
    Legacy. Arab and Arab American Women on Writing. It is a principle, Aziz argues
    that has informed the proliferation of new works by Arab-American writers, xii.


    +   2. Nathalie Handal, ed., The Poetry of Arab women: A Contemporary Anthology
    (New York and Northampton: Interlink Books, 2001), 158.'
