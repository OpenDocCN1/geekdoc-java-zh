    Perardeniya and has taught literature and theory at Perardeniya and the

    University of Sri Lanka. Her publications focus on themes of postcolonial

    migrants, migrant writing and gender students. Her research interests also

    include areas of Discourse Analysis, Sri Lankan and Cultural

    Studies. [tara.senanayake@gmail.com].


    Gatha Sharma is Assistant Professor in the Department of English in Shiv

    adar University Uttar Pradesh. Her doctoral thesis include the novels of R.

    L. Stevenson. Her research interests include 18th century prose, Corpus

    Linguistics and Translation. [gatha.sharma@snu.edu.in].


    Java Singh received her PhD, in Hispanic Literature from Jawaharlal Nehru

