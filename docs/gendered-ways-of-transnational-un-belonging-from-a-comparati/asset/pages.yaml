    of knowledge. Hers is a discourse that fracturing identities liberates languages
    from their colonial history. By refusing to be silenced, or homogenised and universalised,
    Umpierre inverts the ‘normal’ to create and de-create borders, adding alternative
    strategies to geographies, and undoing these frontiers. Her voice rises from the
    ‘other’ side of the colonial difference, and it challenges the regimes of normalisation.
    She uses the very language of the coloniser against him to articulate subjectivities,
    desires, and sexualities that have been invisibilised and silenced.


