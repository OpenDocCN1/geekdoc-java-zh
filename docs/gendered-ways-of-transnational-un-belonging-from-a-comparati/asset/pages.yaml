  md: '# MAHASWETA DEVI’S IMAGINARY MAPS: A CRITIQUE OF THE NATIVE COLONISER IN POSTCOLONIAL
    INDIA


    # PAMODA JAYAWEERA


    # Abstract


    Touching and insightful, Mahasweta Devi’s *Imaginary Maps* problematises the conception
    of nation as a single, monolithic body and challenges the projection of postcolonial
    narrative(s) of nation-making as homogenous by giving voice to subaltern narratives
    of nation-creation. Located in post-independent India preoccupied with the so-termed
    postcolonial projects of ‘decolonisation’ and ‘nation-making’, Imaginary Maps
    demystifies the grand narratives of nation, modernity, and civilisation by foregrounding
    the exclusion of the indigenous populations from the mainstream project of nation-building.
    Thus, this paper seeks to examine how the three stories recounted in *Imaginary
    Maps* expose the power hierarchies and processes of subalternisation that are
    in operation in postcolonial India. It discusses how Mahasweta Devi frames the
    body politics, and the discourses of religion as well as ‘reason’, among others,
    manipulated in constructing and perpetuating the ‘subalternity of the subalterns’
    within the postcolonial Indian nation-state. The paper evaluates whether the narratives
    establish the validity of Devi’s assertion that, postcolonial India differs from
    its colonial past only in the sense that the monopoly of power previously enjoyed
    by the British has now been transferred to the hands of the local elite who are
    no less oppressive.


    **Key Terms:** Nation, postcolonial, subaltern, indigenous, modernity.


    Nation/nationalism has often been uncritically posited as a positive homogenizing
    force that establishes a sense of community/brotherhood and a collective consciousness
    among the entire population of the sovereign state. Nevertheless, as Rosa Luxemburg
    cautions us, when one'
