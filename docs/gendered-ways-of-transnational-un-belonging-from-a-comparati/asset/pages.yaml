    # ABIN CHAKRABORTY


    # # Abstract


    The physical and cultural presence of women has always been contested territory,
    especially in relation to the struggles between empire and nation where each dominant
    discourse has sought to inscribe itself onto the physical or cultural presence
    of women in different ways. This has often led to the re-assertion of entrenched
    orthodoxies, commonly bound with retrograde religious visions. This is especially
    true of Afghanistan, from the days of the Soviet incursion, the reign of mujahideen,
    the rise and fall of the Taliban to the U.S.-instituted Karzai administration,
    has been marked by a torrid history where women have been both victims and loci
    of struggle and subjects of appropriation of master-narratives in different ways.
    My paper would map this tortuous and, at times, traumatic trajectory through Khaled
    Hosseini’s A Thousand Splendid Suns.


