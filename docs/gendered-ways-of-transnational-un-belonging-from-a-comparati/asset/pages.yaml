  md: '# FAIRY TALES AND ‘CONSTRAINTS

    OF STRUCTURES'':

    REMAPPING SELECT FAIRY TALES

    AND THEIR FILM ADATIONS

    THROUGH A FEMINIST LENS


    ERAM SHAHEEN ANSARI


    # Abstract


    Reading fairytales and watching fairytale films transports us to a magical world
    of a young beautiful princess rescued by a prince leading to a “happily ever after”
    world. The transition from the woods to the palace ostensibly transforms the life
    of the wretched princess. In the last few decades this essential thread of fabric
    of childhood – fairytales, has been an exceedingly debated genre in literature
    involving intense criticism and re-definition of them. Much of the criticism comes
    from the view that these fairytales perpetuate patriarchy, maintain gender inequality,
    and induce tropes where women are always weak, submissive, and shallow whereas,
    men are always powerful, active, and authoritative. An analysis of the Walt Disney
    version (that is considered a by-product of patriarchal) reveals they maintain
    strict gender binaries and perpetuate gender stereotypes. On screen, the ‘evil’
    characters like the ‘witch’ and the wicked stepmother are always punished and
    are portrayed as ugly, in contrast to the beautiful submissive heroines. These
    witches are punished because they “dare” to challenge patriarchal laws. These
    tales were analysed through the feminist lens in the wake of the women’s movement
    of the 1960’s and 1970’s. The present paper tries to expose women’s subjugation
    in Disney adaptations through hidden devices. The paper also explores the more
    recent adaptations’ attempts to convey women’s sense of individual dignity, self-realisation,
    and assertion of their identity.


    **Key terms:** Fairytales, gender roles, stereotypes, feminism, Disney.'
