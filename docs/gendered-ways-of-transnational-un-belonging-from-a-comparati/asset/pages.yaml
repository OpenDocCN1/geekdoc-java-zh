    Perspective


    barely conceals the mercenary criminality upon which it is superimposed. Jose
    Cruz focuses on the ''new middle-class'' portrayed in the novel to divulge despite
    its ''newness'' it perpetuates the dominance of traditionally hegemonic moods.


    Part three, ''Un-belonging through Defiant Rewrites'', comprises papers whose
    authors consciously choose, address or read through textual memories of generic
    and/or traditional tales, to re/de-construct different kinds of partisanship of
    gendered identities navigating global spaces.


    Ana Abril Hernández explores a poem ''The Penitent'' from Vincent Millay''s Few
    Figs from Thistles (1920) against its graphic adaptation in the Graphic Canon
    Vol. 3: From Heart of Darkness to Hemingway Infinite Fest (2013). She argues how
    an evolving and embodied subject of the poem struggles through public/personal
    anxieties pertaining to her desires of freedom and equality within a stifling
    patriarchal state. The graphic rendition of the poem, however, sounds more indulgent
    and less stressful as she seems to bear no regrets about her sexual adventures
    not her domesticated spaces.


    Eram Shaheem Ansari begins by noting that fairy tales perpetuate gender roles
    and that Walt Disney reinforcements reinstate hierarchies they infantilise uses
    of sexuality and gender. The female subject has no agency as she is docile and
    demure waiting for redemption by a ''noble prince''. She contrasts these with
    their recent adaptations that engage in critically undoing the patriarchal order
    through feminist stances.


    Likewise, Sanghita Sen addresses how most Indian films end up replicating prescribed
    gender stereotypes; yet some actually argue in favour of women'' agency, in space
    of predatory masculine sets exist just on-screen but also off-screen, such as
    the censor board, community vigilante groups or even unfair courts. She analyses
    two films of the parallel cinema: Milch Masala, set in colonial times and Bhawander,
    the account of a rape in rural India, retold by an American Indian. This filmic
    retellings of fiction or real stories forbidden through transnational modes.


    Pamoda Jayaweera, a Sri Lankan, chooses to work with Mahasweta Devi''s text Imaginary
    Maps to explore questions of un-belonging in the Indian nation-state. Jayaweera
    mediates between concepts of the national as a homogeneous or plural entity through
    differing critical discourse and submits Devi''s texts to a post-colonial reading
    in order to articulate subaltern un-belonging. The indigenous are excluded in
    the programme of the nation-state through slavery, prostitution, and ''information''
    in ways that sanitize neo-colonial drives as the national prescription.'
