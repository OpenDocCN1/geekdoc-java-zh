  md: '# Gendered Ways of Transnational Un-Belonging from a Comparative Literature
    Perspective


    Gatha Sharma explores two travel writings, Lady Montagu’s and Mary Wollstonecraft’s.
    Women travelling and writing in the 18th century, when any venture into the public
    sphere was considered ‘intrusion’, was a very rare case of breach. They break
    another border, that is in spite of the orientalist gaze, Lady Montagu finds the
    harem as a safe space for women, very much wanting in the European world; while
    Mary Wollstonecraft is fierce in her criticism of Europe’s lost for wealth and
    slavery. The Euro-centric borders became tainted with contradictions.


    Gursheen Ghamar’s paper argues how the poetry of Luis Maria Principe in trans-locations
    of a ‘Third’ space, which becomes the voice of rebellion. It negotiates realms
    of the personal and the public with respect to one’s sexuality, in terms of bodies
    and exile within heteronomative knowledge systems. The borders that her poetry
    draws/breaks are free and unstable as they adventure with alternative cartographies
    of bodies and spaces, thus destabilizing the given-ness of dominant narratives
    of hierarchies, originality, and knowledges.


    Java Singh positions ‘space’ as a fulcrum to weigh in on selected writings of
    Cristina Peru Rossi and Anuradha Roy. The paper’s theoretical approach, built
    upon the axioms of Elaine Showalter and Mikhail Bakhtin, concentrates on the portrayal
    of the seascape. Peri Rossi, with two nations—Spanish and Uruguayan, is always
    conscious of her location at the borders and Roy’s narrative starts with the tragic
    fallouts of the antitheticalical Bakhtinian chronotopes of threshold and the Gothic
    castle in the texts of these writers. The emergence of a common literary technique
    of the writers suggests a gathered alignment through un-belonging across nations.


    The authors/papers in the second part sit on the edges of the global and the local
    to examine the breaks in globally mandated circuits that on one hand, seek new
    products and new markets and on the other, exclude groups that do not conform
    to their economic agenda. In these circuits, imprinted with democratic codes,
    a movement from the margins to the centre, such as an economically less developed
    country to an advanced one or of the centre to the margin, such as the imposition
    of dominant national paradigms on tribal populations, signifies progress. The
    papers in this section contest the notion of ‘progress’


    Kavya Krishna K.R. attempts to understand, through advertisements, the paradoxical
    reconciliation of diametrically opposed cultural logic of feminism and global
    capitalism. The paper analyses selected advertisements that were widely discussed
    and shared on social media for their apparent ‘feminist’ stand point. The “Top
    Girls” in these advertisements symbolise the gender-sensitive attitude to women
    empowerment of profit seeking'
