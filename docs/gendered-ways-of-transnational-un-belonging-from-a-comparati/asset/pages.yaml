  md: '# PREFACE


    This book, as the title suggests, is about ‘gendered ways of trans-national un-belonging
    from a comparative literature perspective’. Globalization and neoliberal polities
    have led to increasing numbers of people from all over the world to transit south
    to north/east-west finance-scapes of inland or international territories. At the
    same time, battles today are being fought not only on the borders between nations,
    ethnicities or class-caste paradigms but also on a whole set of new frontiers
    such as issues of legitimacy, sexuality, trauma, and terrorism amidst widening
    spaces of law-and-orderly societies. The ‘transnational’ thus is not restricted
    to un-belonging(s) related to travel, immigration, and exile across nations, but
    also plays through multipolar crevices of gendered identities, spatialities, and
    chronologies within ‘nations’. It addresses ‘gendered’ as a site of precarity,
    alterity, fluidity, lesser, disadvantaged or dispossessed though, enabling and
    provoking.


    Most of the authors of this book are researchers and/or faculty members of reputed
    universities from India and abroad who were participants at a Young Scholars’
    Conference on Gendered Mths of Conflict and Un-Belonging from a Comparative Literature
    Perspective (Under Project — University with Potential of Excellence -- II or
    the UPE-II Project D10, JNU), from August 2-3, 2016. We, thereafter, also invited
    other scholars and faculty members from other institutions to write for this volume.
    All the papers have been double reviewed by a distinguished scientific committee.


    The conference was a call to explore gendered myths of conflict and un-belonging
    against patriarchal tropes, social hierarchies, and misogyny. However, when we
    received all the papers, we found that they were actually addressing the processes
    involved in such alienation and struggle rather than just interpreting myths as
    such. Un-belonging in idioms of political and socio-economic memories encounter
    certain slippages that disturb language, geography, and history as making a push
    towards translation and comparativism. Generally, these papers track spaces/times
    of real/ghost-like hybridity in which any comparativ is forced to overcome issues
    of passive equivalence or sameness to propose, instead, a reification of the political
    and the personal, thus widening the scope of the study. Consequently there is
    a heightened sense'
