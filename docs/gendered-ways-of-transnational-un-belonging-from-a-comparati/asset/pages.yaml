    We have narratives on women like Rani Laxmibai of Jhansi, Sarojini Naidu, and
    Vijayalakshmi Pundit as active participants in the freedom struggle. The participation
    of women in large numbers in the freedom movement, after Gandhi took the leadership
    of the movement, also created conditions where the ‘feminisation’ of the movement
    could corroborate the ideology of non-violence. An iconic example is the event
    of the Dandi March of 1930. Though the initial group of satyrahis did not include
    any women, many women joined the movement as it gathered force. There could be
    reasons why the figure of the woman appears prominently in such nationalist narratives.
    The need for social reform felt by the emerging middle class was most motivated
    by the need to respond to the colonial scholarship that depicted the sexual and
    familial character of Indian society as inferior. And, in this colonial women
    had a lower social position, and such reform, at times, was accompanied by a genuine
    desire to change social circumstances. In popular history, nationalism was represented
    in the form of Bharat Mata (Mother India) that created an affective and territorial
    community. In most cases, women have either been an object of reform or an enduring
    figure that bears the nationalist decenter.


    Partha Chatterjee has famously theorised a nationalist resolution of the women’s
    question into the ‘material’ and the ‘outer’ or the ‘spiritual’ and the ‘inner’.
    Chatterjee’s argument is that as nationalist accepted modernity as the material/outer
    domain, which was understood to be the sphere of action for men, women were entrusted
    with the task of representing the national culture that was considered to be superior
    to that of the West and all its achievements. This paper attempts to raise a few
    preliminary questions as part of an investigation into modes of vernacular expressions
    of the fundamental problem of modern political existence in so far as it opens
    up through the lens of gender. I will look at some of the contemporary re-appropriations
    of the epic character Sita as an icon in the nationalist discourse of iminent
    self-rule, but as a new locus for the elaboration of a critical subjectivity,
    which undergrids the continuous deconstruction of the patriarchal colonial state.


