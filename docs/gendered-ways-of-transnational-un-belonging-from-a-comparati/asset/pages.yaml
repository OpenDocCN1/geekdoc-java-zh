  md: '# Gursheen Ghuman


    61


    Umpierre creates a new border space from which emerge alternate knowledges, a
    knowledge that breaks the hegemony of knowledge and sense. Through her language
    and manner of speaking Umpierre replaces the universality of knowledge by a multivocal
    pluriversality. There is a fragmentation of order and logic. According to Walter
    Mignolo the colonial difference is constituted by alphabetic writing, which is
    used in the construction of an imaginary of the modern/colonial world.31 Mignolo
    also shows how colonial translation as a tool was deployed in the absorption of
    the colonial difference. According to him border thinking is a “restitution of
    the colonial difference that colonial translation (unidirectional, today''s globalisation)
    attempted to erase.”32 This is one of the objectives of the voice raised by Umpierre
    as well. Her voice embodies “the erasure of the colonial epistemic difference
    from the perspective of what has been a subaltern form of knowledge”.33 There
    is a desubaltemisation of knowledges that go beyond the occidental conceptions
    of knowledge.


    Language, which has been a tool of oppression, is converted into a weapon for
    decolonisation. Silencing the dissident voices, as well as being silent about
    ungrammatical beings is the way in which the colonial knowledge system is implemented.
    This is a way of rendering their very existence as impossible. The claims in the
    coloniser''s discourse of working towards the revelation of the truth are proved
    to be false. In fact, the entire process is aimed at suppressing truths to maintain
    the hegemony of the discourse in power. The normative society “excludes certain
    forms of individual and social experience or accounts for them in incomplete and
    prejudicial ways.”34 Umpierre speaks against this exclusion and deleterious representations
    of the queer bodies and beings.


    Umpierre’s voice surges and arises from the colonial difference. She uses her
    words as a counter-discourse to “restrict divisive forms of identity that the
    prevailing sign neutralises or obliterates.”35 She decentralises this organisation
    of knowledge by changing and disturbing the definitive center of enunciation,
    and by naming the absent location of enunciation. She uses queerness to pull out
    and bring a new language, a language that does not adhere to the norms and does
    not follow the directives put in place for this purpose. It is a language freed
    of boundaries that flourishes on the other side of the border.


