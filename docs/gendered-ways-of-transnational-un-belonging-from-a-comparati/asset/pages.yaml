  md: '# THE VOICE OF REBELLION IN THE POETRY OF UMPPIERRE THROUGH A QUEER LENS


    GURSHEEN GHUMAN


    # Abstract


    The primary focus of this paper will be on exploring how queer sexualities reside
    in the Third space, on the ''other'' side of the borders to become a voice of
    rebellion. Luz Umpierre creates a new language – a hybrid that is free from its
    colonizing shackles; that ruptures the patriarchal hegemonies and hierarchies
    established by a heteronative society. This voice rises in counter-discourse to
    challenge what has been naturalised as the ''normal''. Umpierre reinscribes the
    body while rewriting what it means or could mean to a woman. We will see how she
    appropriates the actions and deeds (like the act of cooking), which by being reiterated
    time and again come to be traditionally associated with the ''good woman'' and
    deises them. She uses eroticism as a tool to make visible queer desires that have
    been silenced and made invisible by the act of homogenisation. The ''ungmatical''
    bodies as texts have been placed outside the ambit of the recognizable. By representing
    them, she reveals the cultural codes of naturalisation that have been used by
    the hegemonic discourse to decrypt certain bodies as normal and grammatical while
    rendering others as unmatical or impossible. She raises her voice against this
    negation of recognition to certain ''abnormal'' bodies, a process that she shows
    be leading to a real and symbolic violence. By foregrounding alternate histories
    and knowledges, she subverts the concept of an only truth, of universalisation
    of history and colonisation of knowledge.


    Key Terms: Counter-discourse, hybrid, unmatical, violence, alternate.


    This paper will explore the poetry of Luz María Umpierre, and how she uses it
    as a counter discourse to oppose prevalent structures. Eurocentrism'
