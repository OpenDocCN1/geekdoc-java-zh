  md: '# READING NIDIA DÍAZ’ PRISON DIARY

    AS EMBODIED MATTER

    THROUGH KAREN BARAD’S\NEW MATERIALISM


    # BAISHALI CHOUDHURI

    AND INDRANI MUKHERJEE


    # Abstract


    Violence such as death, torture and disappearance highlight the body as matter,
    a thing of flesh and blood. Phallogocentric humanism has for too long dwelt on
    images, signs, and languages premised on a firm Cartesian subject. The questions
    that we seek to address in this paper are how to read Díaz’ prison memoir through
    Karen Barad’s body-matter entanglements, which are always already present/constituted
    and how therefore the mind-body-meaning and knowing-doing-epistemological materialisations
    are realised through intra-active agent matter. Matter is not an animate given-ness,
    nor an unresponsive inert canvas – it is the materializing of time and space in
    its ongoing trans-materiality. Thus, matter is an active ‘agent’ that ensures
    that and and are mutually articulated. Socio-constructivist theories of embodied
    subjects would not be able to read how they (body matter) work or are produced
    in prison conditions except as mere rhetorical assertions of patriarchal and nationalist
    templates. Herein lies the importance of the present proposal. Can a prison memoir,
    therefore, be read like a body, solid, material, and performing?

    To what end?


    Key Terms: Body, entanglement, matter, agential, spacetimeimatter.'
