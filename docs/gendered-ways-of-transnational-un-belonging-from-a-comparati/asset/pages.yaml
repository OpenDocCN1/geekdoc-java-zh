    # Women and the Dynamics of Gender Relation on Screen


    Despite the Hindi film industry of India (also known as Bollywood post-199s) being
    one of the most thriving film industries of the world churning huge financial
    and cultural capital, women-centric films in the Indian mainstream are quite rare.
    Female protagonists who live their onscreen lives without the patronising intervention
    of their onscreen patriarchal saviours areably scarce. Nevertheless, the received
    notion of Indian masculinities may be one of the reasons Indian films pervasively
    represent Indian feminities as reductive, marginal, multidimensional, and non-diverse.
    Characters of female protagonists hardly ever get a chance to grow as the film
    progresses, remaining constricted rigidly by their passive acceptance of objectification.
    Like most mainstream cinema of the world, "women stand as lynch pin to the system"¹²
    Whereas this is a general trend in Indian mainstream cinema, there are films,
    though scarce, that represent women and Dalit characters standing firm in resistance
    against gender atrocities and discriminatory practices prevalent in Indian society.
    This paper aims to investigate how the gender ways of un-belonging is embedded
    deeply into the cultural tropes at par with the transnational designs propagating
    the culture of patriarchy in the politically problematic onscreen spaces of Indian
    cinema.


