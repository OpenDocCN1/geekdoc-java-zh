    # ‘Angry Young Man’ Normalising Hypermasculinity on Screen


    The political contexts of the early 1960s resulted in important changes in the
    narrative of popular Hindi cinema in terms of orientation towards issues as nationalism,
    patriotism, and celebration of the military prowess of the Indian state. The 1970s
    saw a complete transformation in narrative and characterisation in Indian cinema
    with the ‘angry young man’ at its centre. Indian cinema of this period turned
    films into a cultural site reflecting the socio-economic frustration of India
    that was under met tremendous internal conflicts and turmoil. At this point the
    Naxal Movement was at its peak in different parts of the country and Emergency
    was declared on the pretext of dealing with internal troubles. The pent-up anger
    and frustration of common underprivileged Indians found expression in the portrayal
    of the ‘angry young man’ began an over-emphasis on projecting hypermasculinity
    that stood in opposition to the characterisation of early heroes as mellow, soft,
    and slightly ‘passive’ gentle individuals. However, whereas the portrayal of the
    ‘angry young man’ on the Indian screen gave visibility to social-underdogs as
    possible heroes, it either kept the caste-identity of such heroes unpronounced
    or chose not to go beyond the upper caste identity of such characters. One of
    the reasons for the absence of such issue in cinematic representation seems to
