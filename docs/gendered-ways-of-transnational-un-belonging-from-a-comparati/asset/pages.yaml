    Australia and yearns for “home”. The comparison to the moon speaks of the waxing
    and waning of Manthri’s emotions, her frame of mind and her passivity and resignation.
    On a more literal level, it relates to a deeply entrenched cultural belief that
    moonlight had a powerful effect on human behavior and resulted in lunacy. The
    author has used this central symbol of Sri Lankan culture and suggests that the
    moon smiles at those who sought to map madness. Lokuge weaves her tale in the
    shadow of this smile and presents body and being as the dominant tropes of her
    text. Manthri gradually becomes schizophrenic and her tragedy can be explained
    in the terms of motif of “place and displacement”, which is, as Ashford, Griffiths,
    and Tiffin angle, “a major feature of post-colonial literatures”.⁶ The very predication
    of Lokuge’s protagonist cannot be constructed simply as the case of a failed immigrant.
    Manthri is “brought” to Australia by her authoritarian husband, without any effort
    on his part to understand whether his wife is a willing migrant. Added to her
    incapacity to adjust in an alien land, Manthri has to grapple with issues that
    are deeply grounded in her gendered body – a body which is both a site of patriarchal
    inscription and a moving image of repetitive displacement – physical, ontological
    and psychological.”


    If the Moon Smiled is thus a novel about growing up, a Bildungroman in a sense.
    It is also a novel that represents the complexities of the diasporic experience,
