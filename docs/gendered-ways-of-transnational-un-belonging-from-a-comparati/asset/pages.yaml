    The rarified space in accelerated time is shared by the woman who is on the verge
    of drowning and the man who is her self-appointed saviour. Self-appointed because
    she is too weak to call out for help. The man does not respond to her cry for
    help but to the imperative of an egoistic consciousness. A consciousness that
    informs perception through (self) imagination rather than fact-based knowledge
    is the stimulus for change. The actions of the man are driven by his self-image.
    He believes that because he survived the shipwreck he has certain exceptional
    qualities, like astuteness, intelligence, and foresight. Having survived, he feels
    invulnerable. He acknowledges his decision to rescue another drowning passenger
    is prompted by “a certain sentiment of value and roughness rather than generosity”.23
    Accelerated time is important because outcomes of life and death are determined
    in an instant. In, the final moment the drowning woman crosses the threshold over
    to safe land, while the man sinks in waters made dangerous by his self-image.


    How does Peri Rossi saturate space and accelerate time in “La Anunciación?” The
    spatial situation is saturated, is that it undergoes changes in response to new
    information. Though the story seems to occur on the same strip of beach, the space
    experiences a radical transformation from an abandoned sand strip to first, a
    playground for a child, then to a commanding arena for a monarch or a temple potent
    with powers of the Virgin and then to a battlefield where the lone saviour stands
    against the mighty enemy.


    As is typical of the chronotope of threshold, time is instantaneous and therefore
    imestimable. We may term this archaeological time because it reveals “several
    forms of connexion, several hierarchies of importance, several networks of determination,
    several teleologies.”—24 The temporal experience thus is highly concentrated as
