    to another huge apartment building, built by the same company, which was Buckingham
    Towers A Block. Next to that was Windsor Manor A Block. And there were apartment
    blocks like this, all shiny and new, and with nice big English names, as far as
    the eye could see.48


    Since Balram and the servants of the other neighbours to be available at all times,
    the complex includes quarters for them to live in; close enough to be hungry,
    but strictly separated from the sphere of their employers, "sometimes at the back,
    and sometimes (in the case of Buckingham Towers B Block) underground."49 No matter
    how modern Gaurgaon pretends to be, each is a small-scale model of social stratification,
    where Lightness and Darkness are co-dependent.


