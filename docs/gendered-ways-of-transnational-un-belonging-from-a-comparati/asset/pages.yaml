    The scholar Cheryl Walker discusses in her book Outrageous and Austere the life
    and work of several writers of the 2th century, among which we find Edna St. Vincent
    Millay. In research, Walker says that although Millay “thought of herself as a
    fighter and a feminist” she was forced to face the “good girl/bad girl syndrome”2.
    As Walker points out, we come across another paradox in Millay’s life. On the
    one hand, there is the self-image of the feminist whom she sought to portray through
    her letters and her tours of public readings. On the other hand, there is the
    woman behind the poetic voice that “actually wanted to please the public and this
    mean, in a significant way, pleasing a masculine-centered culture.”21 Already
    from her second volume of poetry, some paradoxes, or in Kristeva, of a “subject-in-process”,
    begin to appear through her poems. They show an individual identity that is not
    static and whose context strongly influences the construction and dynamism of
    its identity.2


    The sardonic and veiled conservative style found in “The Penitent” points to the
    difficult identity of the authoress herself, of her empirical ‘I’. The serious
    health problems afflicting Millay worsened after the death of her husband. She
    had to go home alone, where she would live her toughest year, until her death
    in 1950. Her body, silent pain container, suffered greatly, leading her through
    several nervous breakdowns caused by the negative criticism that her political
