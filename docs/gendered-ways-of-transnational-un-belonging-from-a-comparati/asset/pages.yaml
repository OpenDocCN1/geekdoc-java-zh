  md: '# READING THE POLITICS OF BODY

    THROUGH FILMS ABOUT THE “DIRTY WAR"

    IN ARGENTINA


    # Abstract


    The body becomes an inscription, a text that reveals the history of the times
    in which it is located. It is coded in certain ways that have not only implications
    for embodied subjectivity but also serve as a narrative that reveals social relacionities.
    Beverley Skeggs argues that bodies are “the physical sites where the relations
    of class, gender, race, sexuality, and age come together and are embodied and
    practiced” and that, class is always coded through bodily dispositions: “the body
    is the most ubiquitous signify of class.” Dalla Costa argues, “women’s sexuality
    remains a commodity emerging from a past in which it was not recognised as a woman’s
    personal right, can be robbed with impunity.” Latin American history has been
    replete with examples and instances of how the body becomes a site of political
    exploitation and struggle. The Dirty War in Argentina, understood through the
    films La Noche de los Lapices, Death and the Maiden, and Imagining Argentina,
    provides us one occasion to analyse this phenomenon. This paper will explore the
    politics of how both the torturer and the tortured treated the body. Reading politics
    through the above-mentioned films against Luisa Valenzuela’s concept of writing
    with the body, it will examine the political economy of the Dirty War epoch and
    its subsequent impact in Argentina through the body of an individual.


    Key Terms: Body, skeggs, narratives, politics, torture.


    +   1. Beverley Skeggs, Formations of Class & Gender: Becoming Respectable (London:
    Sage, 2002), 82.


    +   2. Maria Rosa Dalla Costa, “To Whom Does the Body of this Woman Belong?” The
    Commoner, October 13, (2010), url: http://www.commoner.org/wp-content/uploads/2010/10/dallosta_mexico_paper.pdf.*'
