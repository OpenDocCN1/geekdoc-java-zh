  md: '# # REFIGURING OF SITA:

    NOTES ON KUMARAN ASAN’S

    POETICS OF FREEDOM


    VIPIN K. KADAVATH


    # ## Abstract


    This paper looks at the re-appropriation of the epic character of Sita not as
    an icon in the nationalist discourse of imminent self-rule that meant: (i) a response
    to colonial scholarship of Indian society that stressed the inferior status of
    women, and (ii) the nationalist re-imagination of women as the repository of national
    difference. This is a new locus for the elaboration of a critical subjectivity,
    which undergoes the continuous deconstruction of the postcolonial state. It would
    critically analyse the poem Chinthavishtaya Sita (Sita Engrossed in Thought, 1919)
    by the eminent Malayalam poet Kumaran Asan in an attempt to understand Sita in
    a moment of self-introspection and self-possession after sage Valmiki takes her
    sons to Ayodhya, in the broader context of the re-tellings of the Ramayana by
    modern vernacular writers for political assertion of liberal freedom.


    **Key Terms:** Iconography, vernacular, nation, Ramayana, Malayalam.


    # ## Introduction


    The figure of the woman intertwined with the discourse of nationalism has been
    studied extensively. The role, participation, and agency of women in the freedom
    movement, the social status of women as a central concern for social reform, the
    complex iconography of the nation as the mother in the nationalist task of laying
    claim to sovereignty – these are a few framing questions that have been posed
    against the vast body of nationalist writing.'
