    Posthumanism, as I intend it here, is not calibrated to the human; on the contrary,
    it is about taking issue with human exceptionalism while being accountable for
    the role we play in the differential constitution and differential positioning
    of the human among other creatures (living and nonliving). Posthumanism does not
    attribute the source of all change to culture, denying any sense of agency or
    historicity. In fact, it refutes the idea of a natural (or, for that, a purely
    cultural) division between nature and culture, calling for an accounting of how
    this boundary is actively configured and reconfigured. Posthumanism does not presume
    that man is the measure of all things.³¹


    Knowing is not premised on the human subject as an absolute and certain field.
    Diaz remembers her husband and is nostalgic about that relationship because she
    had to abandon her son in order to join the revolution. She also misses the green
    trees in some distant garden and years to see once.³² While in the cell, it is
    her conviction to the revolution that gives her strength to face terrible violence.
    The State though, continue reduce her to pure sexual matter that contains information.
    “I” narrator of the memoir functions like an embodied apparatus that can split
    the particles of light and the waves of light; they all become parts of an agency
    of enactment becoming “a matter of possibilities for reconfiguring entanglements.
    So, agency is not about choice in any liberal humanist sense; rather, it is about
    the possibilities and accountability entailed in reconfiguring material-discursive
    apparatuses of bodily production, including the boundary articulations and exclusions
    that are marked by processes.³³ In this sense of entangled comradery that she
    sees the only way of surviving the immediate circumstances and situations of dehumanisation.
    The “I” therefore is not just a socio-political construct but also an enigmatic
    element of material things including trees, pain, and loss. The title of her book,
    I was never alone, makes new sense in this way. Her “I”, therefore, is not just
    about any real or imaginary herself but also about her body and the bodies of
    all her loved ones, comrades inside and outside jail, those who are dead or alive
    to be born, of her son whom she left behind, the city, the jungles or other landscapes
    that she traversed, the animals, and non-animals that inhabited those spaces.


