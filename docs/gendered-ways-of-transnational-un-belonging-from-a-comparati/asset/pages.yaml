  md: '# Refiguring Sita: Notes on Kumaran Asan''s Poetics of Freedom


    More recent re-tellings of the Ramayana, especially by Indian English writers
    continue with the same concerns with regard to the character of Sita but seem
    to be not pertinently troubled by that one singular moment in Sita''s life, this
    is in stark contrast with the vernacular versions. Books such as Sita: An Illustrated
    Retelling of Ramayana by Devutt Pattanik, Sita: Daughter of the Earth by Saraswati
    Nagpal, etc. narrate the story of Sita from her birth to the end. Most often these
    books are explicitly presented in the form of a modern appraisal of a mythological
    story. This new mythological imagination is produced and sustained by the current
    transformation of the nation-state itself. Pattanik''s book, for example, contains
    references to books with information regarding the historical and folk elements
    of the Ramayana.


    The attempt here was to read the epic character of Sita in relation to the women''s
    question in the nationalist discourse and the larger problem of the Indian state
    form itself. The feminist movement in India has been trying to raise questions
    on this reformed patriarchy of nationalism. What we need to remember is this is
    women''s questioning (not the nationalist one of seeing women as a repository
    of culture and finding a “proper” place in society for them, but one of equality
    and citizenship) cannot be addressed without a reworking of the nation form itself.


