  md: '# Preface


    While there have many retellings of Sita in the epic Ramayana, mostly framed within
    the nationalist bourgeoisie ideals ideals of femininity, Vipin K. Kadavath dwells
    on Kumaran Asan’s poem, Chinthavishayataya Sita to address how the national icon
    is given agency by locating her in a prohibited dialogic zone of introspection.
    Sita is re-imagined as a thinking subject who can see through all the injustices
    she has suffered and who decides never to return to the palace of Rama.


    Part four is the climaxing of all ways of un-belonging to the materiality of the
    body.


    Lav Diaz’ cinematic space is filled with women’s bodies of the violently raped
    and mutilated, dead or the survived who transit through the purgatory trans-spaces
    across and beyond his films. It connects intertextually with sound tracks in the
    films of Pere Portabella, with a distraught lone woman in the work of Ritwick
    Ghatak and with Buñuel’s repertoire. It also intersects with Dostevsky, Glauber
    Rocha, José Rizal, and the biblical characters of Mary Magdalene many others.
    Parichay Patra argues that eventually only cinema remains as it consumes the world
    it sets out to inspect. Un-belonging of bodies spills over into all spaces without
    borders and what remains is only the sound and light.


    In contrast to disappearing and spilled over bodies, Shyam Benegal’s Mandi is
    a full of women who practice their art of courtesan culture but refuse to sell
    their bodies as prostitutes. Sarbani Banerjee argues how the market pulls everything
    towards itself as it commodities women’s bodies like any other object. The women
    craft their resistance to commodification, by seeking recourse to traditions of
    familial bonds among the brothel women and all to the courtesan role – a combination
    of artful (re)presentation and sex work, they perform for their customers.


    Rama Paul’s paper dwells on bodies that write back as inscriptions and are located
    in Argentina’s ‘Dirty War’. Dead and disappeared bodies are spread all over the.
    But the living ones of Mothers de la Mayo silently moun the ‘disappeared’ before
    the international gaze. As bodies are tortured, defiled, and mutilated, they become
    embodied markers of history and containers of knowledge. Yet, these bodies are
    denied the role of knowledge makers. The paper examines three films in this context
    of violated bodies as knowledge makers/markers. The Night of the Pencils (1986),
    Imagining Argentina (2003), and Death and the Maiden (1994) show how the body
    grounds itself in repressive regimes on which a counter-narrative of resistance
    is played out. While this essay in no way refutes the violence suffered by men
    during such oppressive and violent regimes, its scope is restricted to the female
    body.'
