    # Introduction


    Anybody who is interested in the question of feminism might have noticed the emergence
    of a number of advertisements in recent years that ostensibly speak for women
    empowerment and gender equality. One who wishes for gender sensitive representation
    of women in popular visual culture feels contended that the ''new generation''
    / ''new genre'' of advertisements has moved far away from stereotypical representations
    of women. We see that the slogans and ideas once raised by feminist movements
    are now taken up by global capitalism. The paper tries to look at this process
    of appropriation of feminism by global capitalism and the impact of the same for
    the political project of feminism. While this trend is a global phenomenon after
    the post liberalisation era, the paper keeps the focus on the Indian context using
    select television and YouTube/online commercials.


