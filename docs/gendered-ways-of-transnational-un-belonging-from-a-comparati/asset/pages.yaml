  md: '# Sarat Kumar Jena


    She lived for a considerable period with the indigenous community to carry out
    her post-doctoral research on the identity of Bonda women and the gendered space
    they occupy. The feminist outlook of Ray is prominent in all her works – Yajnaseni
    (The Daughter of the Sacred Fire 1984), Mahahoma (The Great Illusion 1997), and
    Adhibumi. These narratives address certain issues of gendered myth and identity,
    but they often remain blind to the intersections of differences and conflicts
    between tribal and hegemonic myths, traditions. In Yajnaseni and Mahahoma the
    women are self-assertive; Draupadi and Ahalya are portrayed as transgressors of
    the mythic space codified by the Mahabharata, the Ramayana, and Hindu ideology
    and principles. In Adhibumi, the other hand represents a reductive identity of
    the Bonda woman. She claims knowledge of indigenous viewpoints of the myths she
    had collected during her stay at the Bonda hills in the 1980s and 1990s. Her definition
    of the identity of the Bonda women draws from close observation of the community
    during her research; yet the Bonda woman in the narrative of Adhibumi are never
    allowed to break the hegemonic stereotypes of their mythic representations. This
    contrasts with portrays of Draupadi and Ahalya in Yajnaseni and Mahahoma who,
    challenge the set code of Hindu ideology and principles. Ray''s depiction of tribal
    identity in Adhibumi on the other hand, perhaps casts doubt on the potential of
    that identity as a source of a revolutionary stand of the tribe against the socio-political
    order. There is a visible and conscious high caste Hindu ideology interwoven into
    the narrative of Adhibumi. Hence, for Ray the tribal myths are passive, fixed
    in a nostalgic past, devoid of regenerative power. The non-tribal “myths” generated
    by upper-caste attitudes, however, are explored and explained as enabling and
    empowering for women of higher social orders. There is an inherent contradiction
    in this intellectual investment of Ray as she seems to deny the findings of her
    own research while she lived with the Bonda community. She does not accept the
    role of reality of tribal myths for empowerment and liberation as she distances
