  md: '# Gendered Ways of Transnational Un-Belonging from a Comparative Literature
    Perspective


    Anum Fatima and Ariba Zainab look at The Vagina Monologues and its Indian adaptations.
    In patriarchal systems, the woman''s body is reduced only to its reproductive
    and sexual organs. The paper interprets the transition of the body from a more
    reproductive organ to a sexual one as effected in The Vagina Monologues. Though
    intended as a monologue, the paper argues that the play is actually a dialogic
    narrative between the woman and the prohibited zone of her own pleasures and desires.
    It is about her reckoning with its being cast as ''ugly'' and ''dirty''. The writers
    subsequently examine cultural and linguistic characteristics of producing for
    Indian audiences. The Indian production had to negotiate through different social
    taboos. It also had to encounter the conservative and regressive forces of the
    traditionalists. Yet the play became a huge success as the ''vagina'' exposed
    the histories of violence on, and pleasures of women''s bodies.


    The last paper in this book reads Nidia Diaz'' prison memoir through Karen Bard''s
    concept of new materialism, focusing on the indivisibility of matter and meaning
    or that of the body and the mind. Nidia Diaz'' prison memoir was written twenty
    years after she actually faced imprisonment and torture. Choudhury and Mukherjee
    show that the memoir is an embedded narrative and materially agency laden Diaz
    vividly collects the events of torture and humiliation that as her comrades faced.
    The body that written upon, actively ''writes back'' as it rejects any kind of
    conformity or submission. The memoir is a performative so that it recodes itself
    to defy and subvert any matters of societal or generic habit of language as a
    mere ritual of representation. Entangled performativity of the body and the memoir
    expose how representation has been reduced to a mere realistic habit of the mind
    and a semantic shift of movements.


    Thus considered subjects in the selected texts face displacement, discrimination,
    defilement and/or death through forced exile or immigration to vile spaces as
    distant lands, prisons, and brothels or through compulsive break from familiar
    enclosed spaces of home and domesticity. At the same time, all the authors (of
    papers) conscientiously take a threshold position as they plough through their
    chosen texts that negotiate across either historical, fictional, and/or mythical
    time-space materials, so that a trans-national gender perspective of un-belonging
    is further reiterated. This is un-belonging that is like a double bind, result
    of the texts consciously chosen and the threshold position consciously taken by
    the authors, towards a new etiquette of empathy with the dislocated and the dispossessed.
    They labour from the outside of any national literature and are critical of any
    patronising paradigms of'
