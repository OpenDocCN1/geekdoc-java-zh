- fmt: "\n# JavaScript Basics\n\nExample: `break` // this is a JavaScript keyword.\n\
    `return` // this is a JavaScript keyword.\n\n### Explanation\nJavaScript keyword\
    \ may not be used when choosing identifier names for variables, functions, properties.\n\
    \n## Variables\nA `Variable` is a symbolic name associated with a value. `Variable`\
    \ uses `var` to define. \n\n### Example\n```html\n<script type = “text/javascript\"\
    >\nvar abcde;\nvar abc888;\nvar my_variable;\n</script>\n```\n### Explanation\n\
    `abcde`, `abc888` and `my_variable` are all variables. They can store some value.\
    \ e.g. `var abcde=100;`, `var abc888=”Hello World”;`, `var my_variable=true;`.\n\
    Notice that variable naming cannot start with number, cannot have space. e.g.\
    \ “23var”, “abc de” are invalid variable name. But “var23”, “abcde” are valid\
    \ variable name.\n\n## Data Types\n- `string` – a character or a string of characters\n\
    - `number` – an integer or floating point number\n- `boolean` – a value with true\
    \ or false.\n- `function` – a user-defined method\n- `object` – a built-in or\
    \ user-defined object\n\n### Example\n```html\n<script type = “text/javascript\"\
    >\nvar mystring= “I am a string”;\nvar myinteger=168;\nvar myfloat=12.88;\nvar\
    \ mybool=true;\n</script>\n```\n### Explanation\n`var mystring=”I am a string”;`\
    \ // `mystring` data type is `string`.\n`var myinteger=168;` // `myinteger` data\
    \ type is `number`.\n`var myfloat=12.88;` // `myfloat` data type is `number`.\n\
    `var mybool=true;` // `mybool` data type is `boolean`.\nNote: Double quotes are\
    \ always used in string. e.g. “abcde”, “learning”.\n\n## Escape Sequences\nThe\
    \ `\\` backslash character can be used to escape characters.\n- `\\n` outputs\
    \ content to the next new line.\n- `\\r` makes a return\n- `\\t` makes a tab\n\
    - `\\'` outputs a single quotation mark.\n- `\\\"` outputs a double quotation\
    \ mark.\n\n### Example\n```html\n<script type = “text/javascript\">\nalert (“JavaScript\
    \ says \\”Hello World! \\” ”);\n</script>\n```\n(Output: “Hello World”)\n### Explanation\n\
    `\\\"` outputs a double quotation mark. Note that “Hello World” has a double quotation\
    \ with it. Another sample: `\\t` makes a tab\n`alert (“Hello \\t\\t\\t World”);`\
    \ // Note here has three taps\n( Output: Hello     World )\n\n## Functions\nA\
    \ function is a code block that can repeat to run many times. To define a function,\
    \ use `function function-name ( ) { }`.\n\n| Syntax | `function function-name\
    \ ( ) {……}` |\nTo call a function, use `function-name ( );`\n\n| Syntax | `function-name\
    \ ( );` |\n\n### Example\n```html\n<script type = “text/javascript\">\nfunction\
    \ test( ){\n   alert (“show a sample”);\n}\ntest ( );\n</script>\n```\n(Output:\
    \ show a sample)\n### Explanation\n`“function test( ) { }` is a declaration of\
    \ `test( )` function. `test( )` is a command to call a function named `test(){`.\
    \ When running the function `test ( )`, it will output “show a sample”.\n\n###\
    \ Function with Arguments\nA function can have one or more arguments inside the\
    \ bracket. Arguments are used to pass data to function.\n\n| Syntax | `function\
    \ function-name ( var arg ) {……}` |\nTo call a function, use `function-name (argument);`\n\
    \n| Syntax | `function-name (argument );` |\n\n### Example\n```html\n<script type\
    \ = “text/javascript\">\nfunction test( var arg ){\n  alert ( arg );\n}\ntest(“display\
    \ a sample”);\n</script>\n```\n(Output: display a sample)\n### Explanation\nWhen\
    \ `test(“display a sample”)` call the function `test(var arg){…}`, it will pass\
    \ the “display a sample” to `var arg`. After `var arg` has received the data,\
    \ it will pass the data inside the function. `alert ( arg )` will use the data,\
    \ and then outputs “display a sample”.\n\n### Return Values\n`return` can return\
    \ a value to the caller.\n\n| Syntax | `function function-name ( var arg ) { return\
    \ value }` |\nTo call a function, use `function-name (argument);`\n\n| Syntax\
    \ | `function-name (argument );` |\n\n### Example\n```javascript\nfunction cube(var\
    \ num){return num*num*num}\nalert ( cube(2) );\n```\n( Output: 8 )\n### Explanation\n\
    `“cube (2)”` means that `cube(2)` calls the function `cube(var num){ }`, and pass\
    \ the argument “2” to `var num`. `“return num*num*num” returns the result to caller\
    \ `cube(2)`, you can treat it as `cube(2) = return num*num*num`, assigning the\
    \ value to `cube(2)`. `alert ( cube(2) )` will show the result of `cube(2)`.\n\
    \n## Variable Scope\nGlobal variable is declared outside the function, it can\
    \ be used in everywhere; local variable is declared inside the function, it is\
    \ only used inside current function.\n\n### Example\n```html\n<script type = “text/javascript\"\
    >\nvar num=200; // This variable num is global variable.\nfunction test( ){\n\
    \  var num=100; // This variable num is local variable\n}\nalert (num);\n</script>\n\
    ```\n(Output: 200)\n### Explanation\n`“alert (num)”` outputs 200, which means\
    \ variable `num` stores a value of global variable. Local variables are only visible\
    \ within the function block where they are declared.\n\n## Show the Texts\n`document.write(\
    \ )`\n`“document.write( )”` simply prints or display the specified text to the\
    \ current web page.\n\n### Example\n```html\n<script type = “text/javascript\"\
    >\ndocument.write (“Hello World Again!”);\n</script>\n```\n( Output: Hello World\
    \ Again! )\n### Explanation\n`“document.write (“Hello World Again!”)` displays\
    \ characters directly into the HTML page. Note that `“alert ( )` pops open dialog\
    \ box showing a message.\n\n## Operators\n\n### Arithmetical Operators\n| Operator\
    \ | Description |\n| :--- | :--- |\n| `+` | Addition |\n| `-` | Subtraction |\n\
    | `*` | Multiplication |\n| `/` | Division |\n| `%` | Modulus: divides the first\
    \ operand by the second, returns the remainder. |\n| `++` | Increment |\n| `--`\
    \ | Decrement |\n\n### Example\n```javascript\nvar add=100+200;\nalert (add);\n\
    var div=800/2;\nalert ( div );\nvar mod=100%3;\nalert ( mod );\nvar inc=10;\n\
    alert ( inc );\nvar str=”abc”+”de”;\nalert ( str );\n```\n### Explanation\n`var\
    \ add=100+200; alert (add);` outputs 300.\n`var div=800/2; alert ( div );` outputs\
    \ 400.\n`var mod=100%3; alert ( mod );` outputs 1.\n`var inc=10; alert ( inc );`\
    \ outputs 10.\n`var str=”abc”+”de”; alert ( str );` outputs abcde.\n\n### Logical\
    \ Operators\n| Operator | Description |\n| :--- | :--- |\n| `&&` | AND |\n| `||`\
    \ | OR |\n| `!` | NOT |\n\n### Example\n```javascript\nvar x=true; var y=false;\n\
    var a=x && y; alert ( a ); // output: false\nvar b=x || y; alert ( b ); // output:\
    \ true\nvar c=! x; alert ( c ); // output: false\n```\n### Explanation\n`true\
    \ && true` returns true; `true && false` returns false; `false && false` returns\
    \ false; `true || false` returns true; `false || false` returns false; `! true`\
    \ returns false; `! false` returns true.\n\n### Assignment Operators\n| Operator\
    \ | Example |\n| :--- | :--- |\n| `+=` | `x+=y` |\n| `-=` | `x-=y` |\n| `*=` |\
    \ `x*=y` |\n| `/=` | `x/=y` |\n| `%=` | `x%=y` |\n\n### Example\n```javascript\n\
    var x=200; var y=100;\nx+=y; alert ( x );\nx/=y; alert ( x );\nx-=y; alert ( x\
    \ );\nvar m=”abc”; var n=”de”;\nm+=n; alert ( m );\n```\n### Explanation\n`x+=y\
    \ // x=x+y;` outputs 300.\n`x/=y; // x=x/y;` outputs 200.\n`x-=y; // x=x-y;` outputs\
    \ 100.\n`m+=n; // m=m+n;` outputs abcde.\n\n### Comparison Operators\n| Operator\
    \ | Description |\n| :--- | :--- |\n| `>` | Greater than |\n| `<` | Less than\
    \ |\n| `>=` | Greater than or equal to |\n| `<=` | Less than or equal to |\n|\
    \ `==` | Equal to |\n| `!=` | Not equal to |\n\n### Example\n```javascript\nvar\
    \ a=100; var b=200;\nvar result = (a>b); alert ( result );\nvar result = (a==b);\
    \ alert ( result );\nvar result = (a!=b); alert ( result );\n```\n### Explanation\n\
    `var result = (a>b); // test 100>200;` outputs false.\n`var result = (a==b); //\
    \ test 100==200;` outputs false.\n`var result = (a!=b); // test 100!=200;` outputs\
    \ true.\n\n### Conditional Operator\nThe syntax of conditional operator looks\
    \ as following:\n`(test-expression) ? (if-true-do-this) : (if-false-do-this);`\n\
    `(test-expression)` looks like `a<b`, `x!=y`, `m==n`, etc.\n\n### Example\n```html\n\
    <script type = “text/javascript\">\nvar a=100; var b=200;\nvar result=(a<b) ?\
    \ ”apple” : ”boy”;\nalert ( result );\n</script>\n```\n( Output: apple )\n###\
    \ Explanation\nThe output is “apple”. The conditional operator use `(a<b)` to\
    \ test the “a” and “b”, because “a” is less than “b”, it is true. Therefore, the\
    \ output is “apple”.\n\n### If Statement\n```javascript\nif ( test-expression\
    \ ) { // if true do this; }\n```\n`if statement` executes codes inside `{ … }`\
    \ only if a specified condition is true, does not execute any codes inside `{…}`\
    \ if the condition is false.\n\n### Example\n```javascript\nvar a=200; var b=100;\n\
    if (a>b){\n  alert ( ”a is greater than b.” );\n}\n```\n(Output: a is greater\
    \ than b.)\n### Explanation\n`( a>b )` is a test expression, namely `(200>100)`,\
    \ if returns true, it will execute the codes inside the `{ }`, if returns false,\
    \ it will not execute the codes inside the `{ }`.\n\n### If-else Statement\n```javascript\n\
    if ( test-expression) { // if true do this; } else { // if false do this; }\n\
    ```\n"
