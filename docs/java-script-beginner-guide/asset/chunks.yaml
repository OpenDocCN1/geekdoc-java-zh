- fmt: "\n## reset()\n\n`reset()` is used to clear the form data.\n\nExample:\n```html\n\
    <form id=\"myform\" method=\"get\" action=\"f.php\">\n……\n<input type=\"button\"\
    \ onclick=\"myfunction()\" value=\"Clear\">\n</form>\n<script>\nfunction myfunction()\
    \ {\n  document.getElementById(\"myform\").reset();\n}\n</script>\n```\n(Result:\
    \ The form data are completely cleared.)\n\nExplanation: `onclick=\"myfunction()\"\
    ` means when click the button, `myfunction()` immediately executes. `document.getElementById(\"\
    myform\")` access the `myform` by its id. `reset()` clears `myform` data.\n\n\
    ## Submit Method\n\n### submit()\n\n`submit()` is used to submit the form data\
    \ to server.\n\nExample:\n```html\n<form id=\"myform\" method=\"get\" action=\"\
    f.php\">\n……\n<input type=\"button\" onclick=\"myfunction()\" value=\"Submit\"\
    >\n</form>\n<script>\nfunction myfunction() {\n  document.getElementById(\"myform\"\
    ).submit();\n}\n</script>\n```\n(Result: The form data are submitted to the server.)\n\
    \nExplanation: `onclick=\"myfunction()\"` means when click the button, `myfunction()`\
    \ immediately executes. `document.getElementById(\"myform\")` access the `myform`\
    \ by its id. `submit()` submits `myform` data to server.\n\n## Select Selection\n\
    \n| `<select id=\"myid \" onchange=\"function ( )\">` |\n\nWhen a `select` value\
    \ in form is change, `onChange` event occurs and runs the `function ( )` at once.\n\
    \n| Red | v |\n\nExample:\n```html\n<select id=\"mySelect\" onchange=\"myfunction()\"\
    >\n  <option value=\"Red\">Red</option>\n  <option value=\"Blue\">Blue</option>\n\
    \  <option value=\"Pink\">Pink</option>\n</select>\n<script type=\"text/javascript\"\
    >\nfunction myfunction() {\n  var v=document.getElementById(\"mySelect\").value;\n\
    \  alert(\"You selected: \" + v);\n} // e.g. select Pink\n</script>\n```\n(Output:\
    \ You selected: Pink)\n\nExplanation: `document.getElementById(\"mySelect\")`\
    \ access `mySelect` by its id. `document.getElementById(\"mySelect\").value` means\
    \ to get a value.\n\n## Radio Selection\n\n| `<input type=\"radio\" id=\"myid\"\
    \ value=\"myvalue\">` |\n\nA group of radio buttons allows one circle to be check\
    \ at any time and submit the selected value to process.\n\nExample:\n```html\n\
    ( Display: ○ red ○ blue ○ pink )\n<input type=\"radio\" id=\"color\" value=\"\
    Red\">Red\n<input type=\"radio\" id=\"color\" value=\"Blue\">Blue\n<input type=\"\
    radio\" id=\"color\" value=\"Pink\">Pink\n<input type=\"submit\" value=\"submit\"\
    \ onclick=\"myfunct()\">\n<script>\nfunction myfunct() {\n  var v=document.getElementById(\"\
    color\").value;\n  alert(v);\n} // e.g. select Blue\n</script>\n```\n(Output:\
    \ Blue)\n\nExplanation: `document.getElementById(\"color\")` access `color` by\
    \ its id. `document.getElementById(\"color\").value` means to get a value.\n\n\
    ## CheckBox Selection\n\n| `<input type=\"checkbox\" id=\"myid\" value=\"myvalue\"\
    >` |\n\nA group of check buttons allows multiple boxes to be check at any time\
    \ and submit the selected value to process.\n\nExample:\n```html\n( Display: □\
    \ red □ blue □ pink )\n<input type=\"checkbox\" id=\"color\" value=\"Red\">Red\n\
    <input type=\"checkbox\" id=\"color\" value=\"Blue\">Blue\n<input type=\"checkbox\"\
    \ id=\"color\" value=\"Pink\">Pink\n<input type=\"submit\" value=\"submit\" onclick=\"\
    myfunct()\">\n<script>\nfunction myfunct() {\n  var v=document.getElementById(\"\
    color\").value;\n  alert(v);\n} // e.g. select Blue Pink\n</script>\n```\n(Output:\
    \ Blue Pink)\n\nExplanation: `document.getElementById(\"color\")` access `color`\
    \ by its id. `document.getElementById(\"color\").value` means to get a value.\n\
    \n## JavaScript: Function ( ) (1)\n\nThe `href` attribute in a hyperlink usually\
    \ includes code of `JavaScript: function( )`.\n\n| `<a href=\"javascript: function(\
    \ )\"> text</a>` |\n\n`<a>` defines a hyperlink.\n\nExample:\n```html\n<p><a href=\"\
    javascript:confirm('Are you sure?')\"> Learn JavaScript!</</a></p>\n```\n(Output:\
    \ Learn JavaScript!)\n\n![](image_rsrc270.jpg)\n\nExplanation: When you clicks\
    \ the hyperlink \"Learn JavaScript!\", confirm dialog box displays \"Are you sure?\"\
    \ immediately, you can click \"OK\" or \"Cancel\".\n\n## JavaScript: Function\
    \ ( ) (2)\n\nThe `href` attribute in a hyperlink usually includes code of `JavaScript:\
    \ function( )`.\n\n| `<a href=\"javascript: function( )\"> text</a>` |\n\n`<a>`\
    \ defines a hyperlink.\n\nExample:\n```html\n<p><a href=\"javascript:prompt('Do\
    \ you like JavaScript?')\"> JavaScript in 8 Hours! </a></p>\n```\n(Output: JavaScript\
    \ in 8 Hours!)\n\n![](image_rsrc271.jpg)\n\nExplanation: When you clicks the hyperlink\
    \ “JavaScript Prompt dialog box displays “Do you like JavaScript?” immediately,\
    \ you can enter “Yes, I like it.”, then “OK”!\n"
