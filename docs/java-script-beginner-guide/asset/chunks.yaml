  trans: "\n\n# JavaScript 基础\n\n示例：`break` // 这是一个 JavaScript 关键字。\n`return` // 这是一个\
    \ JavaScript 关键字。\n\n### 解析\n在为变量、函数、属性选择标识符名称时，不能使用 JavaScript 关键字。\n\n## 变量\n\
    `Variable`（变量）是与值关联的符号名称。使用 `var` 来定义变量。\n\n### 示例\n```html\n<script type = “text/javascript\"\
    >\nvar abcde;\nvar abc888;\nvar my_variable;\n</script>\n```\n### 解析\n`abcde`、`abc888`\
    \ 和 `my_variable` 都是变量。它们可以存储某些值。例如 `var abcde=100;`，`var abc888=”Hello World”;`，`var\
    \ my_variable=true;`。\n注意变量命名不能以数字开头，不能包含空格。例如，“23var”，“abc de”是无效的变量名。但“var23”，“abcde”是变量变量。\n\
    \n## 数据类型\n- `string` – 字符或字符字符串\n- `number` – 整数或浮点数\n- `boolean` – 值为 true 或\
    \ false 的值\n- `function` – 用户定义的方法\n- `object` – 内置或用户定义的对象\n\n### 示例\n```html\n\
    <script type = “text/javascript\">\nvar mystring= “I am a string”;\nvar myinteger=168;\n\
    var myfloat=12.88;\nvar mybool=true;\n</script>\n```\n### 解析\n`var mystring=”I\
    \ am a string=”` // `mystring` 数据类型是 `string`。\n`var myinteger=168;` // `myinteger`\
    \ 数据类型是 `number`。\n`var myfloat=12.88;` // `myfloat` 数据类型是 `number`。\n`var mybool=true;`\
    \ // `mybool` 数据类型是 `boolean`。\n注意：字符串始终使用双引号。例如，“abcde”，“learning”。\n\n## 转义序列\n\
    反斜杠 `\\` 用于转义字符。\n- `\\n` 将内容输出到下一行。\n- `\\r` 产生回车。\n- `\\t` 产生制表符。\n- `\\'` 输出单引号。\n\
    - `\\\"` 输出双引号。\n\n### 示例\n```html\n<script type = “text/javascript\">\nalert\
    \ (“JavaScript says \\”Hello World! \\” ”);\n</script>\n```\n（输出: “Hello World”）\n\
    ### 解析\n`\\\"` 输出双引号。注意 “Hello World” 带有一个双引号。另一个示例：`\\t` 产生一个制表符\n`alert (“Hello\
    \ \\t\\t\\t World”);` // 注意这里有三个制表符\n（ 输出: Hello     World )\n\n## 函数\n函数是一个可以重复运行多次的\
    \ own 块。要定义函数，使用 `function function-name ( ) { }`。\n\n| 语法 | `function function-name\
    \ ( ) {……}` |\n要调用函数，使用 `function-name ( );` |\n\n| 语法 | `function-name ( );`\
    \ |\n\n### 示例\n```html\n<script type = “text/javascript\">\nfunction test( ){\n\
    \   alert (“show a sample”);\n}\ntest ( );\n</script>\n```\n（输出: show a sample）\n\
    ### 解析\n`“function test( ) { }` 是 `test( )` 函数的声明。`test( )` 是调用名为 `test(){` 函数的命令。运行函数\
    \ `test ( )` 时，它将输出 “show a sample”。\n\n### 带参数的函数\n函数括号内可以有一个或多个参数。参数用于将数据传递给函数。\n\
    \n| 语法 | `function function-name ( var arg ) {……}` |\n要调用函数，使用 `function-name\
    \ (argument);` |\n\n| 语法 | `function-name (argument );` |\n\n### 示例\n```html\n\
    <script type = “text/javascript\">\nfunction test( var arg ){\n  alert ( arg );\n\
    }\ntest(“display a sample”);\n</script>\n```\n（输出: display a sample）\n### 解析\n\
    当 `test(“display a sample”)` 调用函数 `test(var arg){…}` 时，它会将 “display a sample”\
    \ 传递给 `var arg`。在 `var arg` 接收数据后，它将传递函数内部的数据。`alert ( arg )` 将使用该数据，然后输出 “display\
    \ a sample”。\n\n### 返回值\n`return` 可以向调用者返回一个值。\n\n| 语法 | `function function-name\
    \ ( var arg ) { return value }` |\n要调用函数，使用 `function-name (argument);` |\n\n\
    | 语法 | `function-name (argument );` |\n\n### 示例\n```javascript\nfunction cube(var\
    \ num){return num*num*num}\nalert ( cube(2) );\n```\n（ 输出: 8 ）\n### 解析\n`“cube\
    \ (2)”` 意味着 `cube(2)` 调用函数 `cube(var num){ }`，并将参数 “2” 传递给 `var num`。`“return\
    \ num*num*num” 将结果返回给调用者 `cube(2)`，你可以将其视为 `cube(2) = return num*num*num`，将值赋值给\
    \ `cube(2)`。`alert ( cube(2) )` 将显示 `cube(2)` 的结果。\n\n## 变量作用域\n全局变量在函数外部声明，可以在地方可以使用；局部变量在函数内部声明，仅在函数内部使用。\n\
    \n### 示例\n```html\n<script type = “text/javascript\">\nvar num=200; // 全局变量\n\
    function test( ){\n  var num=100; // 局部变量\n}\nalert (num);\n</script>\n```\n（输出:\
    \ 200）\n### 解析\n`alert (num)` 输出 200，这是全局变量。局部变量仅在函数块内可见。\n\n## 显示文本\n`document.write(\
    \ )` 将指定的文本显示到当前页面。\n\n### 示例\n```html\n<script type = “text/javascript\">\ndocument.write\
    \ (“Hello World!”);\n</script>\n```\n（输出: Hello World!）\n### 解析\n`alert ( )` 弹出对话框显示消息。\n\
    \n## 运算符\n\n| 运算符 | 说明 |\n| :--- | :--- |\n| `+` | 加法 |\n| `-` | 减法 |\n| `*` |\
    \ 乘法 |\n| `/` | 除法 |\n| `%` | 取模：第一个操作数除以第二个操作数，返回余数。 |\n| `++` | 递增 |\n| `--`\
    \ | 递减 |\n\n### 示例\n```javascript\nvar add=100+200;\nalert (add);\nvar div=800/2;\n\
    alert ( div );\nvar mod=100%3;\nalert ( mod );\nvar inc=10++;\nalert ( inc );\n\
    ```\n### 解析\n`var add=100+200; alert (add);` 输出 300。\n`var div=800/2; alert (\
    \ div );` 输出 400。\n`var mod=100%3; alert ( mod );` 输出 1。\n`var inc=10++; alert\
    \ ( inc );` 输出 10。\n\n## 逻辑运算符\n| 运算符 | 说明 |\n| :--- | :--- |\n| `&&` | 与 (AND)\
    \ |\n| `||` | 或 (OR) |\n| `!` | 非 (NOT) |\n\n### 示例\n```javascript\nvar x=true;\
    \ var y=false;\nvar a=x && y; alert ( a ); // 输出: false\nvar b=x || y; alert (\
    \ b ); // 输出: true\nvar c=! x; alert ( c ); // 输出: false\n```\n### 解析\n`true &&\
    \ true` 返回 true；`true && false` 返回 false；`false && false` 返回 false；`true || false`\
    \ 返回 true；`false || false` 返回 false；`! true` 返回 false；`! false` 返回 true。\n\n##\
    \ 赋值运算符\n| 运算符 | 示例 |\n| :--- | :--- |\n| `+=` | `x+=y` |\n| `-=` | `x-=y` |\n\
    | `*=` | `x*=y` |\n| `/=` | `x/=y` |\n| `%=` | `x%=y` |\n\n### 示例\n```javascript\n\
    var x=200; var y=100;\nx+=y; alert ( x );\nx/=y; alert ( x );\nx-=y; alert ( x\
    \ );\nvar m=”abc”; var n=”de”;\nm+=n; alert ( m );\n```\n### 解析\n`x+=y // x=x+y;`\
    \ 输出 300。\n`x/=y; // x=x/y;` 输出 200。\n`x-=y; // x=x-y;` 输出 100。\n`m+=n; // m=m+n;`\
    \ 输出 abcde。\n\n## 比较运算符\n| 运算符 | 说明 |\n| :--- | :--- |\n| `>` | 大于 |\n| `<` |\
    \ 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n| `==` | 等于 |\n| `!=` | 不等于 |\n\n###\
    \ 示例\n```javascript\nvar a=100; var b=200;\nvar result = (a>b); alert ( result\
    \ );\nvar result = (a==b); alert ( result );\nvar result = (a!=b); alert ( result\
    \ );\n```\n### 解析\n`var result = (a>b); // 测试 100>200;` 输出 false。\n`var result\
    \ = (a==b); // 测试 100==200;` 输出 false。\n`var result = (a!=b); // 测试 100!=200;`\
    \ 输出 true。\n\n## 条件运算符\n条件运算符的语法如下所示：\n`(test-expression) ? (if-true-do-this)\
    \ : (if-false-do-this);`\n`(test-expression)` 类似于 `a<b`、`x!=y`、`m==n` 等。\n\n###\
    \ 示例\n```html\n<script type = “text/javascript\">\nvar a=100; var b=200;\nvar\
    \ result=(a<b) ? ”apple” : ”boy”;\nalert ( result );\n</script>\n```\n（ 输出: apple\
    \ ）\n### 解析\n输出是 “apple”。条件运算符使用 `(a<b)` 测试 “a” 和 “b”，因为 “a” 小于 “b”，它是 true。因此，输出是\
    \ “apple”。\n\n### 语句\n```javascript\nif ( test-expression ) { // 如果为真执行此操作 }\n\
    ```\n`if 语句` 在指定的条件为真时执行 `{ … }` 中的代码；如果条件为假，则不执行 `{…}` 中的任何代码。\n\n### 示例\n```javascript\n\
    var a=200; var b=100;\nif (a>b){\n  alert ( ”a is greater than b.” );\n}\n```\n\
    （输出: a is greater than b。）\n### 解析\n`( a>b )` 是测试表达式，即 `(200>100)`，如果返回 true，则执行\
    \ `{ }` 内部的代码；如果返回 false，则不执行 `{ }` 内部的代码。\n\n### If-else 语句\n```javascript\n\
    if ( test-expression) { // 如果为真执行此操作 } else { // 如果为假执行此操作 }\n```\n\n"
- fmt: "\n# If...else Statement\n\n`if...else statement` runs some code if a condition\
    \ is true and runs another code if the condition is false.\n\nExample:\n```javascript\n\
    var a=100; var b=200;\nif (a>b){\n  alert ( ”a is greater than b.”)}\nelse {\n\
    \  alert ( “a is less than b” );\n}\n```\n(Output: `a is less than b.`)\n\nExplanation:\
    \ `(a>b)` is a test expression, namely `(100>200)`, if `if` returns true, it will\
    \ output `\"a is greater than b.\"` if `if` returns false, it will output `a is\
    \ less than b`.\n\n# Switch Statement\n\n```javascript\nswitch ( var variable\
    \ ){\n  case 1: if equals this case, do this; break;\n  case 2: if equals this\
    \ case, do this; break;\n  case 3: if equals this case, do this; break;\n  default\
    \ : if not equals any case, run default code; break;\n}\n```\n\nThe value of variable\
    \ will compare each `case` first, if equals one of the `case` value; it will execute\
    \ that `case` code. `break;` terminates the code running.\n\nExample:\n```javascript\n\
    var number=20;\nswitch ( number ) {\n  case 10 : alert ( “Running case 10” );\
    \ break;\n  case 20 : alert ( “Running case 20” ); break;\n  case 30 : alert (\
    \ “Running case 30” ); break;\n  default : alert ( “Running default code” ); break;\n\
    }\n```\n(Output: `Running case 20`)\n\nExplanation: The `number` value is `20`;\
    \ it will match `case 20`, so it will run the code in `case 20`.\n\n# For Loop\n\
    \n```javascript\nfor( init, test-expression, increment) { // some code; }\n```\n\
    \n`for loop` runs a block of code by specified number of times.\n\nExample:\n\
    ```html\n<script type = “text/javascript”>\nfor (var x = 0; x <= 5; x++) {\n \
    \ document.write ( \"x \" );\n}\n</script>\n```\n(Output: `012345`)\n\nExplanation:\
    \ `var x = 0` is an initializer, `x <= 5` is test-expression, the code will run\
    \ at most 5 times. `x++` means that `x` will increase 1 each loop. After 5 times\
    \ loop, the code will output `012345`.\n\n# While Loop\n\n```javascript\nwhile\
    \ ( test-expression ) {\n  // some js code in here;\n}\n```\n\n`while loop` loops\
    \ through a block of code if the specified condition is true.\n\nSample:\n```javascript\n\
    var counter=0;\nwhile (counter < 8){\n  document.write ( “&” );\n  counter++;\n\
    }\n```\n(Output: `&&&&&&`)\n\nExplanation: `“counter< 8\"` is a test expression,\
    \ if the condition is true, the code will loop less than 8 times, until the `counter`\
    \ is `8`, then the condition is false, the code will stop running.\n\n# Do-While\
    \ Loop\n\n```javascript\ndo{ // some js code in here } while ( test-expression);\n\
    ```\n\n`do...while` loops through a block of code once, and then repeats the loop\
    \ if the specified condition is true.\n\nExample:\n```javascript\nvar counter=0;\n\
    do {\n  document.write ( “@” );\n  counter++;\n} while (counter<8);\n```\n(Output:\
    \ `@@@@@@@@`)\n\nExplanation: `“counter< 8\"` is a test expression, if the condition\
    \ is true, the code will loop less than 8 times, until the `counter` is `8`, then\
    \ the condition is false, the code will stop running.\n\n# Array\n\n## Create\
    \ an Array\nAn array is a particular variable, which can contain one or more value\
    \ at a time. `new Array()` creates an array.\n\nThe syntax to create an array:\n\
    ```javascript\nvar array-name = new Array (“value0”, “value1”, “value2”);\n```\n\
    \nOther syntax to create an array:\n```javascript\nvar array-name = new Array\
    \ ( );\narray-name[index0] = “value1”;\narray-name[index1] = “value1”;\narray-name[index2]\
    \ = “value2”;\n```\n\nExample:\n```javascript\nvar color = new Array ( );\ncolor\
    \ [0] = “red”;\ncolor [1] = “blue”;\ncolor [2] = “green”;\n```\nExplanation: Above\
    \ code creates an array, array name is `color`, and it has three elements: `color[0]`,\
    \ `color[1]`, `color[2]`. Its indexes are 0, 1, and 2. Its values are `red`, `blue`,\
    \ and `green`. Note that index begins with zero.\n\n## Show array element values\n\
    To show array element values, use syntax as following:\n```javascript\ndocument.write\
    \ ( array-name[index] );\n```\n\nExample:\n```html\n<script type = “text/javascript”>\n\
    color = new Array(“yellow”, “purple”, “orange”);\ndocument.write ( color[1] );\n\
    </script>\n```\n(Output: `purple`)\n\nExplanation: From above, you can know:\n\
    - The value of `color[0]` is `yellow`.\n- The value of `color[1]` is `purple`.\n\
    - The value of `color[2]` is `orange`.\nNote that the indexes begin counting from\
    \ zero.\n\n## Get the Size of Array\nA function can get the size of an array.\n\
    ```javascript\narray.length\n```\n\nExample:\n```html\n<script type = “text/javascript”>\n\
    var color = new Array(“yellow”, “purple”, “orange”);\nvar size = color.length;\n\
    document.write ( size );\n</script>\n```\n(Output: `3`)\n\nExplanation: `“var\
    \ size=color.length\"` can return the size of array `color`, and assigns the size\
    \ of array to `size`. `new Array(“yellow”, “purple”, “orange”)` has three elements,\
    \ so its size is 3.\n\n## Join Array Elements\n```javascript\narray.join( );\n\
    ```\n`array.join( )` can join elements.\n\nExample:\n```javascript\nvar arr =\
    \ new Array( );\narr[0] = “I”;\narr[1] = “love”;\narr[2] = “JavaScript”;\ndocument.write(\
    \ arr.join(\" \") ) );\n```\n(Output: `I love JavaScript!`)\n\n## Reverse Element\n\
    ```javascript\narray.reverse();\n```\n`array.reverse()` can reverse the order.\n\
    \nExample:\n```javascript\nvar arr = new Array( );\narr[0] = “A”;\narr[1] = “B”;\n\
    arr[2] = “C”;\narr.reverse();\ndocument.write( arr.join(\",\") );\n```\n(Output:\
    \ `C,B,A`)\n\n## Slice Elements\n```javascript\narray.slice( start, end );\n```\n\
    `array.slice(start, end)` can slice elements.\n\nExample:\n```javascript\nvar\
    \ arr = new Array( );\narr[0] = “a”;\narr[1] = “b”;\narr[2] = “c”;\narr[3] = “d”;\n\
    arr[4] = “e”;\nvar sli = arr.slice(2, 4);\n```\n(Output: `c,d`)\n\n## Sort Elements\n\
    ```javascript\narray.sort();\n```\n`array.sort()` can sort elements.\n\nExample:\n\
    ```javascript\nvar arr = new Array( );\narr[0] = “Z”;\narr[1] = “A”;\narr[2] =\
    \ “B”;\narr.sort();\ndocument.write( arr.join(\",\") );\n```\n(Output: `A,B,Z`)\n\
    \n## Change Elements to String\n```javascript\narray.toString();\n```\n`array.toString()`\
    \ can convert elements to a string.\n\nExample:\n```javascript\nvar myarray =\
    \ new Array( );\nmyarray[0] = “Mon”;\nmyarray[1] = “Tue”;\nmyarray[2] = “Wed”;\n\
    document.write( myarray.toString() );\n```\n(Output: `Mon,Tue,Wed`)\n\n## Search\
    \ Specific Element (1)\n```javascript\narray.indexOf( element );\n```\n`array.indexOf(\
    \ element )` can find the first place where an element occurs.\n\nExample:\n```javascript\n\
    var myarray = new Array( );\nmyarray[0] = “Mon”;\nmyarray[1] = “Tue”;\nmyarray[2]\
    \ = “Wed”;\nmyarray[3] = “Tue”;\ndocument.write( myarray.indexOf(\"Tue\") );\n\
    ```\n(Output: `1`)\n\n## Search Specific Element (2)\n```javascript\narray.lastIndexOf(\
    \ element );\n```\n`array.lastIndexOf( element )` can find the last place where\
    \ an element occurs.\n\nExample:\n```javascript\nvar myarray = new Array( );\n\
    myarray[0] = “Mon”;\nmyarray[1] = “Tue”;\nmyarray[2] = “Wed”;\nmyarray[3] = “Tue”;\n\
    document.write( myarray.lastIndexOf(\"Tue\") );\n```\n(Output: `3`)\n\n# Math,\
    \ Time Math Methods\n\n| Method | Returns |\n| :--- | :--- |\n| `abs()` | a number’s\
    \ absolute value |\n| `ceil()` | an integer greater than or equal its argument\
    \ |\n| `cos()` | an angle’s trigonometric cosine |\n| `exp()` | a number’s `Math.E`\
    \ to the power |\n| `floor()` | an integer less than or equal its argument. |\n\
    | `log()` | a number’s natural logarithm |\n| `random()` | a random positive value\
    \ from 0 to 1 |\n| `max()` | a greater between two numbers |\n| `min()` | a smaller\
    \ between two numbers |\n| `pow()` | the first argument to the power of the second\
    \ |\n| `round()` | an integer |\n| `sin()` | an angle’s trigonometric sine |\n\
    | `sqrt()` | a number’s square root |\n"
