  trans: "\n\n## substr()\n\n`substr( start, length )` 可以从字符串中提取子字符串。`start` 参数指定提取的起始位置。`length`\
    \ 参数指定子字符串的长度。\n\n示例：\n```javascript\nvar mystring = “JavaScript is easy.\";\n\
    var sub = mystring.substr( 4, 6 );\nalert ( sub );( Output:  Script )\n```\n解释：`mystring.substr(\
    \ 4, 6 )` 从 `mystring` 中提取子字符串。`( 4, 6 )` 指定子字符串的起始位置为 4，长度为 6。注意字符串索引从零开始。\n\n\
    ## 将数字转换为字符串\n\n| `number.toString( )` |\n\n为了满足 JS 编程的需求，有时需要将数字转换为字符串数据类型。`number.toString(\
    \ )`可以将数字转换为字符串。\n\n示例：\n```javascript\nvar num1 = 12; \nvar num2 = 68;\nvar str1\
    \ = num1.toString( );\nvar str2 = num2.toString( );\nvar sum = str1 + str2;\n\
    document.write( sum );(  Output:  1268 )\n```\n解释：`num1.toString( )` 和 `num2.toString(\
    \ )` 将两个数字转换为字符串数据类型。因此，`str1` 相加 `str2` 的结果是 1268，而不是 80。\n\n## 将字符串转换为数字\n\n\
    | `parseInt(string);` `parseFloat( string);` |\n\n`parseInt(string)` 和 `parseFloat(string)`可以将字符串转换为整数或浮点数。\n\
    \n示例：\n```javascript\nvar str1 = “12”;  \nvar str2 = “68”;\nvar sum = str1 + str2;\
    \  \nalert ( sum );(  Output: 1268  )\nvar num1 = parseInt( str1 );\nvar num2\
    \ = parseInt( str2 );\nvar addition = num1 + num2;\nalert ( addition );(  Output:\
    \ 80 )\n```\n解释：`parseInt( str1 )` 和 `parseInt( str2 )` 将两个字符串转换为数字数据类型。因此，`num1`\
    \ 相加 `num2` 的结果是 80，而不是 1268。\n\n## 搜索特定文本 (1)\n\n| `indexOf( )` |\n\n`indexOf(\
    \ )`可以在字符串中查找特定文本第一次出现的位置。\n\n示例：\n```javascript\nvar mystring = \"Please find\
    \ where find word occurs!\";\nvar place = mystring.indexOf(\"find\");\nalert (\
    \ place );( Output: 7)\n```\n解释：`mystring.indexOf ( “find” )` 返回“find”在 `mystring`\
    \ 中第一次出现的位置。输出为 7。字符索引从零开始。如果在字符串中未找到该文本，`indexOf( )` 返回 -1。 \n\n## 搜索特定文本 (2)\n\
    \n| `lastIndexOf( )` |\n\n`lastIndexOf( )`可以在字符串中查找特定文本最后一次出现的位置。\n\n示例：\n```javascript\n\
    var mystring = \"Please find where find word occurs!\";\nvar place = mystring.lastIndexOf(\"\
    find\");\nalert ( place );( Output: 18 )\n```\n解释：`mystring.lastIndexOf ( “find”\
    \ )` 返回“find”在 `mystring` 中最后一次出现的位置。输出为 18。字符索引从零开始。如果在字符串中未找到该文本，`indexOf( )`\
    \ 返回 -1。\n\n## 对象声明\n\n对象（Object）指的是某个具体的事物。例如：汽车、书、狗、房子等……\n\n| `obj = new Object(\
    \ );` `obj.property;` |\n\n`obj = new Object( )`创建一个名为 `obj` 的新对象。`obj.property`\
    \ 意味着对象的属性。\n\n示例：\n```javascript\nhouse = new Object ( );\nhouse.color = “white”;\n\
    house.size = “big”;\ndocument.write( “House color: ” + house.color + “\\n”);\n\
    document.write( “House size: ” + house.size + “\\n” );(  Output:  House color:\
    \ whiteHouse size:  big )\n```\n解释：`house=new Object( )` 创建了一个名为 `house` 的对象。`house.color`意味着房屋的颜色。`house.size`意味着房屋的大小。\n\
    \n## 网页间导航\n\n| `windows.history.back( );` `windows.history.forward( );` |\n\n\
    `back( )`用于导航到上一个网页。`forward( )`用于导航到下一个网页。\n\n示例：\n```javascript\nwindows.history.back(\
    \ );(  Returns:  Previous web page. )\nwindows.history.forward( );(  Returns:\
    \  Next web page. )\n```\n解释：`back( )`回到上一个页面。`forward( )`前往下一个页面。`window.history.method(\
    \ )`用于导航到指定的网页。该方法通常由网页上的按钮调用，将在后续章节中介绍。\n\n## 跳转到指定页面\n\n| `window.history.go(\
    \ number );` |\n\n`window.history.go( number)`跳转到指定的网页。\n\n示例：\n```javascript\n\
    window.history.go(1);( Returns:  Next web page.)\nwindow.history.go( -1);( Returns:\
    \ Previous web page.)\nwindow.history.go( 0 );( Returns: Reload current web page.)\n\
    ```\n解释：`window.history.method( )`用于导航到指定的网页。该方法通常由网页上的按钮调用，将在后续章节中介绍。\n\n## 打开自定义窗口\n\
    \n| `window.open( name, width, height, status, menubar )` |\n\n`window.open`可以打开一个新的自定义窗口。`name`\
    \ 参数意味着新窗口名称。`width` 参数意味着新窗口宽度。`height` 参数意味着新窗口高度。`status` 和 `menubar`。\n\n\
    示例：\n```javascript\nwindow.open( “MyWindow”, “400”, “300”, “Status”, “no” );\n\
    ```\n解释：`MyWindow`是窗口名称。`400`、`300`是宽度和高度。`Status`是状态。`no`是菜单栏。\n\n## 确认\n\n|\
    \ `window.confirm( );` |\n\n`window.confirm( )`需要用户确认。对话框如下：\n\n示例：\n```javascript\n\
    var ask = window.confirm( “Are you sure?” );\nif ( ask == true ) {\n  alert (“All\
    \ Right!”);\n} else {\n  alert (“No Good!”);\n}\n```\n解释：用户点击“确定”或“取消”。\n\n##\
    \ 输入提示\n\n| `window.prompt( );` |\n\n`window.prompt( )`需要用户输入。对话框如下：\n\n示例：\n\
    ```javascript\nvar ask = window.prompt( “Enter your name” );\nif ( ask != null\
    \ ) {\n  alert (“Hello ” + ask);\n} else {\n  alert (“Cancelled”);\n}\n```\n解释：用户在提示框中输入句子。\n\
    \n"
- fmt: "\n```html\n<html><head><title>…</title></head><body><form></form>…..</body></html>\n\
    ```\n\nExplanation: `<html>`...`</html>` define the document of a web page. `<head>`...`</head>`\
    \ define the head of a web page. `<title>`...`</title>` define the title of a\
    \ web page. `<body>`...`</body>` define the body of a web page. `<form>`...`</form>`\
    \ define a form, which accepts the requests or input from a user.\n\n### Click\
    \ Event\nWhen a user clicks an element on the web page, a “click” event occurs.\n\
    \n```onClick = function( );\n```\n\n`onClick = function( );` means when clicking\
    \ an element, a function immediately executes.\n\nExample:\n```html\n<form><input\
    \ type=\"button\" value=\"Previous\" onClick=\"history.back( )\"></form>\n```\n\
    ( Returns: Previous web page. )\n\nExplanation: `<form>` and `</form>` is HTML\
    \ tags, which is in web page, `form` is used to accept the request from users.\
    \ `<input type=\"button\" value=\"Previous\"...>` defines a button in the form,\
    \ the button has “Previous” text on it.\n\n`onClick=\"history.back( )\"` means\
    \ when clicking the button, the `history.back( )` runs at once, and then go back\
    \ to Previous web page.\n\n### Onload Event\nWhen a web page has completely loaded,\
    \ an “onload” event occurs.\n\n```onload = function( );\n```\n\n`onload=function(\
    \ )` means when a web page has loaded, `function( )` immediately executes.\n\n\
    Example:\n```html\n<html><body onload = alert ( \"Welcome to my page!\" )>……</body></html>\n\
    ```\nExplanation: `<html>` and `</html>` is html tags, which defines a web page.\
    \ `<body>` and `</body>` define a web page body. `onload=alert( )` means when\
    \ a web page loaded, `alert( )` runs at once, and shows the message “Welcome to\
    \ my page!”.\n\n### Unload Event\nWhen a web page has unloaded, an “unload” event\
    \ occurs.\n\n```unload = function( );\n```\n\n`unload=function( )` means when\
    \ a web page has unloaded, `function( )` immediately executes.\n\nExample:\n```html\n\
    <html><body unload = confirm ( \"Are you sure?\" )>……</body></html>\n```\nExplanation:\
    \ `<html>` and `</html>` is html tags, which defines a web page. `<body>` and\
    \ `</body>` define a web page body. `unload=confirm( )` means when a web page\
    \ unloaded, `confirm( )` runs at once, and shows the message “Are you sure?”.\n\
    \n### Mouseover Event\nWhen a mouse pointer moves over an element, a “mouseover”\
    \ event occurs.\n\n```mouseover = function( );\n```\n\n`mouseover = function(\
    \ )` means when mouse pointer moves over an element, `function( )` executes immediately.\n\
    \nExample:\n```html\n<body><img src = \"myphoto.jpg\" mouseover = alert (\"Please\
    \ view the photo.\") ;></</body>>\n```\nExplanation: `<img>` is a tag for defining\
    \ an image. `src=\"myphoto.jpg\"` specify an image `myphoto.jpg` showing in web\
    \ page. `mouseover=alert( );` means when mouse pointer moves over the image, `alert(\
    \ )` runs immediately, and displays the message “Please view the photo”.\n\n###\
    \ Mouseout Event\nWhen a mouse pointer moves out of an element, a “mouseout” event\
    \ occurs.\n\n```mouseout = function( );\n```\n\n`mouseout = function( )` means\
    \ when mouse pointer moves out of an element, `function( )` executes immediately.\n\
    \nExample:\n```html\n<body><img src = \"myphoto.jpg\" mouseout = alert (\"See\
    \ you!\") ;></</body>>\n```\nExplanation: `<img>` is a tag for defining an image.\
    \ `src=\"myphoto.jpg\"` specify an image `myphoto.jpg` showing in web page. `mouseout=alert(\
    \ );` means when mouse pointer moves out of the image, `alert( )` runs immediately,\
    \ and displays the message “See you!”.\n\n### Onkeydown Event\nWhen a key is pressed\
    \ down, an “onkeydown” event occurs.\n\n```onkeydown = function( );\n```\n\n`onkeydown\
    \ = function( )` means when a key is pressed down, `function( )` executes immediately.\n\
    \nExample:\n```html\n<body><input type=\"text\" onkeydown=\"myfunction( )\"></</body>\n\
    <script>function myfunction( ){ alert (\"You pressed a key.\"); }</script>\n```\n\
    Explanation: `<input type=\"text\"...>` means there is an input field in web page\
    \ for user entering data. Input field looks like this:\n\n`onkeydown=\"myfunction(\
    \ )\"` means when a key is pressed down, `myfunction( )` runs at once.\n\n###\
    \ Onkeyup Event\nWhen a key is released, an “onkeyup” event occurs.\n\n```onkeyup\
    \ = function( );\n```\n\n`onkeyup = function( )` means when a key is released,\
    \ `function( )` executes immediately.\n\nExample:\n```html\n<body><input type=\"\
    text\" onkeyup=\"myfunction( )\"></</body>\n<script>function myfunction( ){ alert\
    \ (\"You released a key.\"); }</script>\n```\nExplanation: `<input type=\"text\"\
    ...>` means there is an input field in web page for user entering data. Input\
    \ field looks like this:\n\n`onkeyup=\"myfunction( )\"` means when a key is released,\
    \ `myfunction( )` runs at once.\n\n### Focus Event\nWhen the user moves the cursor\
    \ onto an element in the web page, a “focus” event occurs.\n\n```onfocus = function\
    \ ( );\n```\n\n`onfocus = function ( )` means when the user moves the cursor onto\
    \ an element of the web page, `function( )` immediately executes.\n\nExample:\n\
    ```html\n<body><input type=\"text\" onfocus=\"myfunction( )\"></</body>\n<script>function\
    \ myfunction( ){ confirm (\"Are you ready to input?.\"); }</script>\n```\nExplanation:\
    \ `onfocus=\"myfunction( )\"` means when the user moves the cursor onto input\
    \ field, `myfunction( )` immediately executes.\n\n### Blur Event\nWhen the user\
    \ moves the cursor out of an element, a “blur” event occurs.\n\n```onblur = function(\
    \ );\n```\n\n`onblur = function( )` means when the user moves the cursor out of\
    \ an element, `function( )` immediately executes.\n\nExample:\n```html\n<body><input\
    \ type=\"text\" onblur=\"myfunction( )\"></</body>\n<script>function myfunction(\
    \ ){ confirm (\"Are you sure?\"); }</script>\n```\nExplanation: `onblur=\"myfunction(\
    \ )\"` means when the user moves the cursor out of input field, `myfunction( )`\
    \ immediately executes.\n\n### Work with Form\nA `form` in html is a important\
    \ element, which is used to accept the requests or inputs from a user.\n\nExample:\n\
    ```html\n<form id=\"myform\" method=\"get\" action=\"f.php\">\n  <input type=\"\
    text\">\n  <input type=\"password\">\n  <input type=\"radio\" value=\"val2\">\n\
    \  <input type=\"checkbox\" value=\"val3\">\n  <input type=\"submit\" value=\"\
    OK\">\n  <input type=\"reset\" value=\"Cancel\">\n</form>\n```\nExplanation: `id`\
    \ means a name of the element. `method=\"get/post\"` means the data send by `get`\
    \ or `post`. `action=f.php` means the data will be processed by `f.php`. `type`\
    \ specify the type of element.\n\n### Access Form Attributes\n`window.document.forms`\
    \ object can access the form attributes.\n\n`document.forms.id.attribute`\n\n\
    `document.forms.id.attribute` can access the attribute in a form.\n\nExample:\n\
    ```javascript\nvar message1 = document.forms.myform.method;\nvar message2 = document.forms.myform.action;\n\
    document.write ( message1);\ndocument.write ( message2);\n```\n(Output:  get \
    \ f.php )\nExplanation: `document.forms.myform.method` can access the `method`\
    \ in `myform`, the result is `get`. `document.forms.myform.action` can access\
    \ the `action` in `myform`, the result is `f.php`.\n\n### Assign Text Value\n\
    `document.forms.id.element.value = \"newvalue\";`\n\n`document.forms.id.element.value\
    \ = \"newvalue\";` can assign a new value to an element.\n\nExample:\n```javascript\n\
    document.forms.myform.txt.value = \"Hello World!\";\ndocument.forms.myform.txt.style.fontFamily\
    \ = \"Arial\";\ndocument.forms.myform.txt.style.fontSize = \"16pt\";\ndocument.forms.myform.txt.style.color\
    \ = \"blue\";\ndocument.forms.myform.txt.style.background = \"yellow\";\n```\n\
    (Output:  Hello World! )\nExplanation: `myform` is the form id. `txt` is the “text\
    \ field” id. `value = \"Hello World!\"` assign a new value to text field. `style.fontFamily\
    \ = \"Arial\"` sets the font family. `style.fontSize = \"16pt\"` sets the font\
    \ size. `style.color = \"blue\"` sets the font color. `style.background = \"yellow\"\
    ` sets the background color.\n\n### Reset Method\n```reset( )\n```\n"
