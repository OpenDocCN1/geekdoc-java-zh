  trans: "\n\n## reset()\n\n`reset()` 用于清除表单数据。\n\n示例：\n```html\n<form id=\"myform\"\
    \ method=\"get\" action=\"f.php\">\n……\n<input type=\"button\" onclick=\"myfunction()\"\
    \ value=\"Clear\">\n</form>\n<script>\nfunction myfunction() {\n  document.getElementById(\"\
    myform\").reset();\n}\n</script>\n```\n（结果：表单数据被完全清除。）\n\n解释：`onclick=\"myfunction()\"\
    ` 意味着点击按钮时会立即执行 `myfunction()`。`document.getElementById(\"myform\")` 通过其 id 访问\
    \ `myform`。`reset()` 清空 `myform` 数据。\n\n## 提交方法 (Submit Method)\n\n### submit()\n\
    \n`submit()` 用于将表单数据提交到。\n\n示例：\n```html\n<form id=\"myform\" method=\"get\" action=\"\
    f.php\">\n……\n<input type=\"button\" onclick=\"myfunction()\" value=\"Submit\"\
    >\n</form>\n<script>\nfunction myfunction() {\n  document.getElementById(\"myform\"\
    ).submit();\n}\n</script>\n```\n（结果：表单数据已提交到服务器。）\n\n解释：`onclick=\"myfunction()\"\
    ` 意味着点击按钮时会立即执行 `myfunction()`。`document.getElementById(\"myform\")` 通过其 id 访问\
    \ `myform`。`submit()` 将 `myform` 数据提交到服务器。\n\n## 选择框选择 (Select Selection)\n\n\
    | `<select id=\"myid \" onchange=\"function ( )\">` |\n\n当表单中的 `select` 值发生变化时，会触发\
    \ `onChange` 事件并立即运行 `function ( )`。\n\n| Red | v |\n\n示例：\n```html\n<select id=\"\
    mySelect\" onchange=\"myfunction()\">\n  <option value=\"Red\">Red</option>\n\
    \  <option value=\"Blue\">Blue</option>\n  <option value=\"Pink\">Pink</option>\n\
    </select>\n<script type=\"text/javascript\">\nfunction myfunction() {\n  var v=document.getElementById(\"\
    mySelect\").value;\n  alert(\"You selected: \" + v);\n} // 例如：选择 Pink\n</script>\n\
    ```\n（输出：You selected: Pink）\n\n解释：`document.getElementById(\"mySelect\")` 通过其\
    \ id 访问 `mySelect`。`document.getElementById(\"mySelect\").value` 意味着获取值。\n\n##\
    \ 单选框选择 (Radio Selection)\n\n| `<input type=\"radio\" id=\"myid\" value=\"myvalue\"\
    >` |\n\n一组单选按钮允许随时勾选一个圆，并提交选中的值进行处理。\n\n示例：\n```html\n( 显示：○ red ○ blue ○ pink\
    \ )\n<input type=\"radio\" id=\"color\" value=\"Red\">Red\n<input type=\"radio\"\
    \ id=\"color\" value=\"Blue\">Blue\n<input type=\"radio\" id=\"color\" value=\"\
    Pink\">Pink\n<input type=\"submit\" value=\"submit\" onclick=\"myfunct()\">\n\
    <script>\nfunction myfunct() {\n  var v=document.getElementById(\"color\").value;\n\
    \  alert(v);\n} // 例如：选择 Blue\n</script>\n```\n（输出：Blue）\n\n解释：`document.getElementById(\"\
    color\")` 通过其 id 访问 `color`。`document.getElementById(\"color\").value` 意味着获取值。\n\
    \n## 复选框选择 (CheckBox Selection)\n\n| `<input type=\"checkbox\" id=\"myid\" value=\"\
    myvalue\">` |\n\n一组复选按钮允许随时勾选多个框，并提交选中的值进行处理。\n\n示例：\n```html\n( 显示：□ red □ blue\
    \ □ pink )\n<input type=\"checkbox\" id=\"color\" value=\"Red\">Red\n<input type=\"\
    checkbox\" id=\"color\" value=\"Blue\">Blue\n<input type=\"checkbox\" id=\"color\"\
    \ value=\"Pink\">Pink\n<input type=\"submit\" value=\"submit\" onclick=\"myfunct()\"\
    >\n<script>\nfunction myfunct() {\n  var v=document.getElementById(\"color\").value;\n\
    \  alert(v);\n} // 例如：选择 Blue Pink\n</script>\n```\n（输出：Blue Pink）\n\n解释：`document.getElementById(\"\
    color\")` 通过其 id 访问 `color`。`document.getElementById(\"color\").value` 意味着获取值。\n\
    \n## JavaScript: Function ( ) (1)\n\n超链接中的 `href` 属性通常包含 `JavaScript: function(\
    \ )` 代码。\n\n| `<a href=\"javascript: function( )\"> 文本</a>` |\n\n`<a>` 定义了一个超链接。\n\
    \n示例：\n```html\n<p><a href=\"javascript:confirm('Are you sure?')\"> Learn JavaScript!</</a></p>\n\
    ```\n（输出：Learn JavaScript!）\n\n![](img/image_rsrc270.jpg)\n\n解释：当你点击“Learn JavaScript!”超链接时，确认对话框立即显示“Are\
    \ you sure?”，你可以点击“OK”或“Cancel”。\n\n## JavaScript: Function ( ) (2)\n\n超链接中的 `href`\
    \ 属性通常包含 `JavaScript: function( )` 代码。\n\n| `<a href=\"javascript: function( )\"\
    > 文本</a>` |\n\n`<a>` 定义了一个超链接。\n\n示例：\n```html\n<p><a href=\"javascript:prompt('Do\
    \ you like JavaScript?')\"> JavaScript in 8 Hours! </a></p>\n```\n（输出：JavaScript\
    \ in 8 Hours!）\n\n![](img/image_rsrc271.jpg)\n\n解释：当你点击超链接 “JavaScript Prompt”时，Prompt\
    \ 对话框立即显示“Do you like JavaScript?”，你可以输入“Yes, I like it.”，然后点击“OK”！\n\n"
