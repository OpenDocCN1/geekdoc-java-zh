    ### JavaScript 基础


    #### 什么是 JavaScript?

    JavaScript 是一种动态编程语言，用于使网页具有交互性。它的解释器嵌入在浏览器软件中，如 IE、Chrome 和 Firefox。它运行在访问者的计算机和浏览器上。


    JavaScript 的语法如下：


    ```html

    <script type="text/javascript">...</script>

    ```


    示例：

    ```html

    <script type="text/javascript">

    alert("Hello World");

    </script>

    ```


    解释：`<script type="text/javascript">` 是 JavaScript 的标签。JavaScript 代码包含在其中。`alert`
    会弹出一个显示消息的警告框。`alert("Hello World")` 显示 "Hello World" 消息。


    #### 注释

    JavaScript 块可以位于 HTML 的任何位置。注释用于解释代码。


    ```javascript

    // 这是一个单行注释

    /*这是一段多行注释；JavaScript 解释器将忽略单行注释和多行注释*/

    ```


    示例：

    ```html

    <script type="text/javascript">

    alert("Hello World"); // "alert" 弹出一个消息

    /*"alert" 弹出一个显示消息 "Hello World" 的警告框。如果你想确保消息传达给用户，通常使用 alert() */

    </script>

    ```


    解释：`// "alert" 弹出一个消息` 是单行注释。`/* "alert" 弹出一个显示消息 "Hello World" 的警告框。... */` 是多行注释。


    #### 关键字

    关键字属于 JavaScript 本身。在选择变量、函数、属性的标识符名称时不能使用这些。以下是 JavaScript 关键字：


    `break`, `case`, `continue`, `default`, `delete`, `do`, `else`, `export`, `False`,
    `for`, `function`, `if`, `import`, `in`, `new`, `null`, `return`, `switch`, `this`,
    `true`, `typeof`, `var`, `void`, `while`, `With`, `Array`, `Date`, `Math`, `Object`,
    `window`, `location`, `history`, `navigator`, `document`, `images`, `links`, `forms`,
    `elements`, `getElementById`, `innerHTML`.


