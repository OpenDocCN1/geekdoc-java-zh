  trans: "\n\n# If...else 语句\n\n`if...else statement` 在条件为真时执行某些代码，在条件为假时执行另一段代码。\n\
    \n示例：\n```javascript\nvar a=100; var b=200;\nif (a>b){\n  alert ( ”a is greater\
    \ than b.”)}\nelse {\n  alert ( “a is less than b” );\n}\n```\n(输出: `a is less\
    \ than b.`)\n\n解释：`(a>b)` 是一个测试表达式，即 `(100>200)`，如果 `if` 返回 true，它将输出 `\"a is\
    \ greater than b.\"`；如果 `if` 返回 false，它将输出 `a is less than b`。\n\n# Switch Statement\n\
    \n```javascript\nswitch ( var variable ){\n  case 1: 如果等于此 case，执行操作; break;\n\
    \  case 2: 如果等于此 case，执行操作; break;\n  case 3: 如果等于此 case，执行操作; break;\n  default\
    \ : 如果不等于任何 case，运行默认代码; break;\n}\n```\n\n变量的值将首先与每个 `case` 进行比较，如果等于其中一个 `case`\
    \ 值，它将执行该 `case` 代码。`break;` 终止代码运行。\n\n示例：\n```javascript\nvar number=20;\nswitch\
    \ ( number ) {\n  case 10 : alert ( “Running case 10” ); break;\n  case 20 : alert\
    \ ( “Running case 20” ); break;\n  case 30 : alert ( “Running case 30” ); break;\n\
    \  default : alert ( “Running default code” ); break;\n}\n```\n(输出: `Running case\
    \ 20`)\n\n解释：`number` 的值为 `20`；它将匹配 `case 20`，因此将运行 `case 20` 中的代码。\n\n# For 循环\n\
    \n```javascript\nfor( 初始化, 测试表达式, 增量) { // 某些代码; }\n```\n\n`for loop` 通过指定的次数运行代码块。\n\
    \n示例：\n```html\n<script type = “text/javascript”>\nfor (var x = 0; x <= 5; x++)\
    \ {\n  document.write ( \"x \" );\n}\n</script>\n```\n(输出: `012345`)\n\n解释：`var\
    \ x = 0` 是初始化器，`x <= 5` 是测试表达式，代码最多运行 5 次。`x++` 意味着 `x` 每次循环增加 1。在循环 5 次后，代码将输出\
    \ `012345`。\n\n# While 循环\n\n```javascript\nwhile ( 测试表达式 ) {\n  // 在此处编写某些 js\
    \ 代码;\n}\n```\n\n`while loop` 当指定的条件为真时循环执行一个代码块。\n\n示例：\n```javascript\nvar counter=0;\n\
    while (counter < 8){\n  document.write ( “&” );\n  counter++;\n}\n```\n(输出: `&&&&&&`)\n\
    \n解释：`“counter< 8\"` 是一个测试表达式，如果条件为真，代码将循环少于 8 次，直到 `counter` 等于 `8`，此时条件为假，代码将停止运行。\n\
    \n# Do-While 循环\n\n```javascript\ndo{ // 在此处编写某些 js 代码 } while ( 测试表达式);\n```\n\
    \n`do...while` 循环执行一次代码块，如果指定的条件为真，则重复循环。\n\n示例：\n```javascript\nvar counter=0;\n\
    do {\n  document.write ( “@” );\n  counter++;\n} while (counter<8);\n```\n(输出:\
    \ `@@@@@@@@`)\n\n解释：`“counter< 8\"` 是一个测试表达式，如果条件为真，代码将循环少于 8 次，直到 `counter` 等于\
    \ `8`，此时条件为假，代码将停止运行。\n\n# 数组 (Array)\n\n## 创建数组\n数组是一种特殊的变量，可以包含一个或多个值。`new Array()`\
    \ 创建数组。\n\n创建数组的语法：\n```javascript\nvar array-name = new Array (“value0”, “value1”,\
    \ “value2”);\n```\n\n创建数组的另一种语法：\n```javascript\nvar array-name = new Array (\
    \ );\narray-name[index0] = “value1”;\narray-name[index1] = “value1”;\narray-name[index2]\
    \ = “value2”;\n```\n\n示例：\n```javascript\nvar color = new Array ( );\ncolor [0]\
    \ = “red”;\ncolor [1] = “blue”;\ncolor [2] = “green”;\n```\n解释：上述代码创建了一个数组，数组名为\
    \ `color`，它有三个元素：`color[0]`、`color[1]`、`color[2]`。它们的索引是 0, 1 和 2。它们的值是 `red`、`blue`\
    \ 和 `green`。注意索引从零开始。\n\n## 显示数组元素值\n要显示数组元素值，使用以下语法：\n```javascript\ndocument.write\
    \ ( array-name[index] );\n```\n\n示例：\n```html\n<script type = “text/javascript”>\n\
    color = new Array(“yellow”, “purple”, “orange”);\ndocument.write ( color[1] );\n\
    </script>\n```\n(输出: `purple`)\n\n解释：从上面你可以可以知道：\n- `color[0]` 的值为 `yellow`。\n\
    - `color[1]` 的值为 `purple`。\n- `color[2]` 的值为 `orange`。\n\n## 获取数组长度\n从上面可以知道：\n\
    ```javascript\nvar len = color.length;\n```\n(输出: `3`)\n\n## 修改数组元素\n要修改数组元素，使用以下语法：\n\
    ```javascript\narray-name[index] = “new value”;\n```\n\n示例：\n```javascript\ncolor[1]\
    \ = “black”;\n```\n\n## 删除数组元素\n要删除数组元素，使用以下语法：\n```javascript\narray-name.splice(index,\
    \ count);\n```\n\n示例：\n```javascript\ncolor.splice(1, 1);\n```\n\n"
- fmt: "\n### `tan()`\n| `tan()` ` | an angle’s trigonometric tangent |\n\nExample:\n\
    ```javascript\nvar num = 10.2;\ndocument.write ( Math.round(num) );\n```\n(Output:\
    \ 10)\nExplanation: `Math.round(num)` returns an integer of `10.2`. Result is\
    \ `10`.\n\n### `Ceil()` & `Floor()`\n\n| `Math.ceil() ` | `Math.floor() ` |\n\
    | :--- | :--- |\n\n`Math.ceil( )` returns an integer that is greater than or equal\
    \ to its argument. `Math.floor( )` returns an integer that is less than or equal\
    \ to its argument.\n\nExample: \n```javascript\nvar num = 9.5;\ndocument.write\
    \ ( “Ceiling number is”+Math.ceil( num ) );\ndocument.write ( “Flooring number\
    \ is”+Math.floor( num ) );\n```\n( Output: Ceiling number is 10.0 Flooring number\
    \ is 9.0 )\nExplanation: `Math.ceil( num )` returns an integer that is greater\
    \ than or equal `9.5`, the result is `10.0`. `Math.floor( num )` returns an integer\
    \ that is less than or equal to `9.5`, the result is `9.0`.\n\n### `Max()` & `Min()`\n\
    \n| `Math.max() ` | `Math.min() ` |\n| :--- | :--- |\n\n`Math.max( )` returns\
    \ the greater one between two numbers. `Math.min( )` returns the less one between\
    \ two numbers.\n\nExample: \n```javascript\nvar x = 100;\nvar y = 200;\ndocument.write\
    \ (“Greater number is”+Math.max(x, y) );\ndocument.write (“Less number is”+Math.min(x,\
    \ y) );\n```\n( Output: Greater number is 200 Less number is 100 )\nExplanation:\
    \ `Math.max(x, y)` returns the greater number between `100` and `200`, the result\
    \ is `200`. `Math.min(x, y)` returns the less number between `100` and `200`,\
    \ the result is `100`.\n\n### `Math.PI` & `random()`\n\n| `Math.PI` | `Math.random()\
    \ ` |\n| :--- | :--- |\n\n`Math.PI` is a constant that stores the value of pi.\
    \ `Math.random( )` generates a number between `0.0` to `1.0`.\n\nExample: \n```javascript\n\
    var pi = Math.PI;\nvar ran = Math.random( );\ndocument.write (“The PI value is”\
    \ + pi);\ndocument.write (“The random number is” + ran);\n```\n( Output: The PI\
    \ value is 3.141592653589793 The random number is 0.16869328 )\nExplanation: The\
    \ value of `Math.PI` is `3.141592653589793`. `Math.random( )` generates a random\
    \ number between `0.0` to `1.0`, in here the result is `0.16869328`.\n\n### Date\
    \ & Time\nJavaScript often use date and time to design the web page. When using\
    \ date and time, you must create an object of date first.\n\n| `var DateObject\
    \ = new Date( )` |\n\n`new Date( )` can create an object of date.\n\nExample:\
    \ \n```javascript\nvar DateObject = new Date( );\nalert ( DateObject );\n```\n\
    ( Output: Sun Apr 12 12:23 UTC 2015 )\nExplanation: `var DateObject = new Date(\
    \ )` creates an object of date. `alert ( DateObject )` displays the current date\
    \ and time.\nNote that: To create an object of date, you can use other variable\
    \ name, for instance:\n```javascript\nvar now= new Date( );\nvar TimeObjcet =\
    \ new Date( );\n```\n\n#### Date, Month, Year, Day\nThe Date Object has following\
    \ method:\n\n| `getDate() ` | get the date |\n| :--- | :--- |\n| `getMonth() `\
    \ | get the month |\n| `getYear() ` | get the year |\n| `getDay() ` | get the\
    \ day |\n\nNote that `getDay( )` returns from `0` (Sunday) to `6` (Saturday).\
    \ `getMonth( )` returns from `0` (January) to `11` (December).\n\nExample: \n\
    ```javascript\nvar now = new Date ( );\nvar y = now.getYear( );\nvar d = now.getDate(\
    \ );\nalert ( y+ “ ” + d );\n```\n( Output: 2015 12 )\nExplanation: `now.getYear(\
    \ )` returns the current year. `now.getDate( )` returns the current date.\n\n\
    #### Hours, Minutes, Seconds\nThe Date Object has following method:\n\n| `getHours()\
    \ ` | get the hours |\n| :--- | :--- |\n| `getMinutes() ` | get the minutes |\n\
    | `getSeconds() ` | get the seconds |\n| `getTime() ` | get the time |\n\nNote\
    \ that `getTime( )` returns a number from January `1, 1970` to current time.\n\
    \nExample: \n```javascript\nvar now = new Date( );\nvar h = now.getHours( );\n\
    var m = now.getMinutes( );\nvar s = now.getSeconds( );\nalert ( “Current time\
    \ is” + h+ “:” + m + “:” + s );\n```\n( Output: Current time is 19:30:28 )\nExplanation:\
    \ `getHours` returns the current hours. `getMinutes` returns the current minutes.\
    \ `getSeconds` returns the current seconds.\n\n#### Different Time\n| `getUTCHours()\
    \ ` | `getTimezoneOffset() ` |\n| :--- | :--- |\n\n`getUTCHours( )` returns the\
    \ Greenwich Mean Time. (UTC). `getTimezoneOffset( )` returns the time difference\
    \ between UTC time and local time. For example, if your time zone is `GMT+2`,\
    \ `-120` will be returned.\n\nExample: \n```javascript\nvar now = new Date( );\n\
    var utc = now.getUTCHours();\nvar timezone = now.getTimezoneOffset();\nalert (\
    \ utc + timezone );\n```\n( Output: utc + timezone )\nExplanation: `getUTCHours(\
    \ )` returns the Greenwich Mean Time. `getTimezoneOffset( )` returns the time\
    \ difference between UTC time and local time.\n\n### Set Date & Time\nThe Date\
    \ Object has following method:\n\n| `getDate() ` | set the date |\n| :--- | :---\
    \ |\n| `getMonth() ` | set the month |\n| `setYear() ` | set the year |\n| `setDate()\
    \ ` | set the day |\n| `setHours() ` | set the hours |\n| `setMinutes() ` | set\
    \ the minutes |\n| `setSeconds() ` | set the seconds |\n| `setTime() ` | set the\
    \ time |\n\nNote that `setDate( )` sets the day of the month.\nExample: \n```javascript\n\
    var now = new Date( );\nnow.setDate(15);\nnow.setMonth(5);\nnow.setYear(2023);\n\
    alert ( now );\n```\n( Output: Date object )\nExplanation: `setDate( )` sets the\
    \ day of the month.\n"
