  trans: "\n\n### `tan()`\n| `tan()` ` | 角度的三角正切 |\n\n示例:\n```javascript\nvar num\
    \ = 10.2;\ndocument.write ( Math.round(num) );\n```\n( 输出: 10)\nExplanation: `Math.round(num)`\
    \ 返回 `10.2` 的舍入整数。结果为 `10`。\n\n### `Ceil()` & `Floor()`\n\n| `Math.ceil() ` |\
    \ `Math.floor() ` |\n| :--- | :--- |\n\n`Math.ceil( )` 返回一个大于或等于其参数的整数。`Math.floor(\
    \ )` 返回一个小于或等于其参数的整数。\n\n示例: \n```javascript\nvar num = 9.5;\ndocument.write (\
    \ “Ceiling number is”+Math.ceil( num ) );\ndocument.write ( “Flooring number is”+Math.floor(\
    \ num ) );\n```\n( 输出: Ceiling number is 10.0 Flooring number is 9.0 )\nExplanation:\
    \ `Math.ceil( num )` 返回一个大于或等于 `9.5` 的整数，结果为 `10.0`。`Math.floor( num )` 返回一个小于或等于\
    \ `9.5` 的整数，结果为 `9.0`。\n\n### `Max()` & `Min()`\n\n| `Math.max() ` | `Math.min()\
    \ ` |\n| :--- | :--- |\n\n`Math.max( )` 返回两个数字中较大的一个。`Math.min( )` 返回两个数字中较小的一个。\n\
    \n示例: \n```javascript\nvar x = 100;\nvar y = 200;\ndocument.write (“Greater number\
    \ is”+Math.max(x, y) );\ndocument.write (“Less number is”+Math.min(x, y) );\n\
    ```\n( 输出: Greater number is 200 Less number is 100 )\nExplanation: `Math.max(x,\
    \ y)` 返回 `100` 和 `200` 之间较大的数字，结果为 `200`。`Math.min(x, y)` 返回 `100` 和 `200` 之间较小的数字，结果为\
    \ `100`。\n\n### `Math.PI` & `random()`\n\n| `Math.PI` | `Math.random() ` |\n|\
    \ :--- | :--- |\n\n`Math.PI` 是存储圆周率 值的常量。`Math.random( )` 生成一个于 `0.0` 到 `1.0`\
    \ 之间的数字。\n\n示例: \n```javascript\nvar pi = Math.PI;\nvar ran = Math.random( );\n\
    document.write (“The PI value is” + pi);\ndocument.write (“The random number is”\
    \ + ran);\n```\n( 输出: The PI value is 3.141592653589793 The random number is 0.16869328\
    \ )\nExplanation: `Math.PI` 的值为 `3.141592653589793`。`Math.random( )` 生成一个于 `0.0`\
    \ 到 `1.0` 之间的随机数，在这里的结果是 `0.16869328`。\n\n### Date & Time\nJavaScript 经常使用日期和时间来设计网页。在使用日期和时间时，必须先创建一个日期对象。\n\
    \n| `var DateObject = new Date( )` |\n\n`new Date( )` 可以创建一个日期对象。\n\n示例: \n```javascript\n\
    var DateObject = new Date( );\nalert ( DateObject );\n```\n( 输出: Sun Apr 12 12:23\
    \ UTC 2015 )\nExplanation: `var DateObject = new Date( )` 创建了一个日期对象。`alert ( DateObject\
    \ )` 显示当前的日期和时间。\n注意：要创建一个日期对象，你可以使用其他变量名，例如：\n```javascript\nvar now= new Date(\
    \ );\nvar TimeObjcet = new Date( );\n```\n\n#### Date, Month, Year, Day\nDate\
    \ 对象拥有以下方法：\n\n| `getDate() ` | 获取日期 |\n| :--- | :--- |\n| `getMonth() ` | 获取月份\
    \ |\n| `getYear() ` | 获取年份 |\n| `getDay() ` | 获取星期 |\n\n注意 `getDay( )` 返回值从 `0`（星期日）到\
    \ `6`（星期六）。`getMonth( )` 返回值从 `0`（一月）到 `11`（十二二月）。\n\n示例: \n```javascript\nvar\
    \ now = new Date ( );\nvar y = now.getYear( );\nvar d = now.getDate( );\nalert\
    \ ( y+ “ ” + d );\n```\n( 输出: 2015 12 )\nExplanation: `now.getYear( )` 返回当前年份。`now.getDate(\
    \ )` 返回当前日期。\n\n#### Hours, Minutes, Seconds\nDate 对象拥有以下方法：\n\n| `getHours()\
    \ ` | 获取小时 |\n| :--- | :--- |\n| `getMinutes() ` | 获取分钟 |\n| `getSeconds() ` |\
    \ 获取秒 |\n| `getTime() ` | 获取时间 |\n\n注意 `getTime( )` 返回一个从 `1970 年 1 月 1 日` 到当前时间的数字。\n\
    \n示例: \n```javascript\nvar now = new Date( );\nvar h = now.getHours( );\nvar m\
    \ = now.getMinutes( );\nvar s = now.getSeconds( );\nalert ( “Current time is”\
    \ + h+ “:” + m + “:” + s );\n```\n( 输出: Current time is 19:30:28 )\nExplanation:\
    \ `getHours` 返回当前小时。`getMinutes` 返回当前分钟。`getSeconds` 返回当前秒。\n\n#### Different\
    \ Time\n| `getUTCHours() ` | `getTimezoneOffset() ` |\n| :--- | :--- |\n\n`getUTCHours(\
    \ )` 返回格林尼治时间（UTC）。`getTimezoneOffset( )` 返回 UTC 时间与本地时间的差异。例如，如果你的时区是 `GMT+2`，将返回\
    \ `-120`。\n\n示例: \n```javascript\nvar now = new Date( );\nvar utc = now.getUTCHours();\n\
    var timezone = now.getTimezoneOffset();\nalert ( utc + timezone );\n```\n( 输出:\
    \ utc + timezone )\nExplanation: `getUTCHours( )` 返回格林尼治时间。`getTimezoneOffset(\
    \ )` 返回 UTC 时间与本地时间的差异。\n\n### Set Date & Time\nDate 对象拥有以下方法：\n\n| `setDate()\
    \ ` | 设置日期 |\n| :--- | :--- |\n| `setMonth() ` | 设置月份 |\n| `setYear() ` | 设置年份\
    \ |\n| `setDate() ` | 设置日期 |\n| `setHours() ` | 设置小时 |\n| `setMinutes() ` | 设置分钟\
    \ |\n| `setSeconds() ` | 设置秒 |\n| `setTime() ` | 设置时间 |\n\n注意 `setDate( )` 设置月份中的日期。\n\
    示例: \n```javascript\nvar now = new Date( );\nnow.setDate(15);\nnow.setMonth(5);\n\
    now.setYear(2023);\nalert ( now );\n```\n( 输出: Date object )\nExplanation: `setDate(\
    \ )` 设置月份中的日期。\n\n"
- fmt: "\n## substr()\n\n`substr( start, length )` can extract a substring from a\
    \ string. `start` argument specify the start position to extract. `length` argument\
    \ specify the substring length.\n\nExample:\n```javascript\nvar mystring = “JavaScript\
    \ is easy.\";\nvar sub = mystring.substr( 4, 6 );\nalert ( sub );( Output:  Script\
    \ )\n```\nExplanation: `mystring.substr( 4, 6 )` extract a substring from `mystring`.\
    \ `( 4, 6 )` specify substring’s start position is 4, length is 6. Note that string\
    \ index begins with zero.\n\n## Convert a Number to String\n\n| `number.toString(\
    \ )` |\n\nTo meet the requirement of JS programming, sometimes a number needs\
    \ to convert to a string data type. `number.toString( )` can change a number to\
    \ a string.\n\nExample:\n```javascript\nvar num1 = 12; \nvar num2 = 68;\nvar str1\
    \ = num1.toString( );\nvar str2 = num2.toString( );\nvar sum = str1 + str2;\n\
    document.write( sum );(  Output:  1268 )\n```\nExplanation: `num1.toString( )`\
    \ and `num2.toString( )` change two numbers to string data type. Therefore, the\
    \ result of `str1`adding `str2` is 1268, instead of 80.\n\n## Convert a String\
    \ to a Number\n\n| `parseInt(string);` `parseFloat( string);` |\n\n`parseInt(string)`\
    \ and `parseFloat(string)` can change a string to integer or floating point number.\n\
    \nExample:\n```javascript\nvar str1 = “12”;  \nvar str2 = “68”;\nvar sum = str1\
    \ + str2;  \nalert ( sum );(  Output: 1268  )\nvar num1 = parseInt( str1 );\n\
    var num2 = parseInt( str2 );\nvar addition = num1 + num2;\nalert ( addition );(\
    \  Output: 80 )\n```\nExplanation: `parseInt( str1 )` and `parseInt( str2 )` convert\
    \ two strings to number data type. Therefore, the result of `num1`adding `num2`\
    \ is 80, instead of 1268.\n\n## Search Specific Text (1)\n\n| `indexOf( )` |\n\
    \n`indexOf( )` can find the first place where a particular text occurs in a string.\n\
    \nExample:\n```javascript\nvar mystring = \"Please find where find word occurs!\"\
    ;\nvar place = mystring.indexOf(\"find\");\nalert ( place );( Output: 7)\n```\n\
    Explanation: `mystring.indexOf ( “find” )` returns the first place where the “find”\
    \ occurs in `mystring`. The output is 7. Character index begins with zero. If\
    \ the text is not found in string, `indexOf( )` returns -1. \n\n## Search Specific\
    \ Text (2)\n\n| `lastIndexOf( )` |\n\n`lastIndexOf( )` can find the last place\
    \ where a particular text occurs in a string.\n\nExample:\n```javascript\nvar\
    \ mystring = \"Please find where find word occurs!\";\nvar place = mystring.lastIndexOf(\"\
    find\");\nalert ( place );( Output: 18 )\n```\nExplanation: `mystring.lastIndexOf\
    \ ( “find” )` returns the last place where the “find” occurs in `mystring`. The\
    \ output is 18. Character index begins with zero. If the text is not found in\
    \ string, `indexOf( )` returns -1.\n\n## Object Declaration\n\nObject refers to\
    \ a concrete something. For example: a car, a book, a dog, a house, etc…\n\n|\
    \ `obj = new Object( );` `obj.property;` |\n\n`obj = new Object( )` creates a\
    \ new object named `obj`. `obj.property` means a object’s property.\n\nExample:\n\
    ```javascript\nhouse = new Object ( );\nhouse.color = “white”;\nhouse.size = “big”;\n\
    document.write( “House color: ” + house.color + “\\n”);\ndocument.write( “House\
    \ size: ” + house.size + “\\n” );(  Output:  House color: whiteHouse size:  big\
    \ )\n```\nExplanation: `house=new Object( )` creates an object name `house`. `house.color`\
    \ means house’s color. `house.size` means house’s size.\n\n## Navigate Web Page\n\
    \n| `windows.history.back( );` `windows.history.forward( );` |\n\n`back( )` is\
    \ used to navigate the previous web page. `forward( )` is used to navigate the\
    \ next web page.\n\nExample:\n```javascript\nwindows.history.back( );(  Returns:\
    \  Previous web page. )\nwindows.history.forward( );(  Returns:  Next web page.\
    \ )\n```\nExplanation: `back( )` goes to previous page. `forward( )` goes to next\
    \ page. `window.history.method( )` is used to navigate the specified web page.\
    \ This method is usually called by a button on web page, which will be mentioned\
    \ in later chapter.\n\n## Go to Specified Page\n\n| `window.history.go( number\
    \ );` |\n\n`window.history.go( number)` can turn to specified web page.\n\nExample:\n\
    ```javascript\nwindow.history.go(1);( Returns:  Next web page.)\nwindow.history.go(\
    \ -1);( Returns: Previous web page.)\nwindow.history.go( 0 );( Returns: Reload\
    \ current web page.)\n```\nExplanation: `window.history.method( )` is used to\
    \ navigate the specified web page. This method is usually called by a button on\
    \ web page, which will be mentioned in later chapter.\n\n## Open Customized Window\n\
    \n| `window.open( name, width, height, status, menubar )` |\n\n`window.open` can\
    \ open a new customized window. `name` argument means new window name. `width`\
    \ argument means new window width. `height` argument means new window height.\
    \ `status` and `menubar`.\n\nExample:\n```javascript\nwindow.open( “MyWindow”,\
    \ “400”, “300”, “Status”, “no” );\n```\nExplanation: `MyWindow` is the window\
    \ name. `400`, `300` are width and height. `Status` is status. `no` is menubar.\n\
    \n## Confirmation\n\n| `window.confirm( );` |\n\n`window.confirm( )` requires\
    \ user to confirm. Dialog box looks like this:\n\nExample:\n```javascript\nvar\
    \ ask = window.confirm( “Are you sure?” );\nif ( ask == true ) {\n  alert (“All\
    \ Right!”);\n} else {\n  alert (“No Good!”);\n}\n```\nExplanation: User enters\
    \ “OK” or “Cancel”.\n\n## Prompt to Input\n\n| `window.prompt( );` |\n\n`window.prompt(\
    \ )` requires user to input. Dialog box looks like this:\n\nExample:\n```javascript\n\
    var ask = window.prompt( “Enter your name” );\nif ( ask != null ) {\n  alert (“Hello\
    \ ” + ask);\n} else {\n  alert (“Cancelled”);\n}\n```\nExplanation: User enters\
    \ a sentence into prompt box.\n"
