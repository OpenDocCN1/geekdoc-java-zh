    ### JavaScript Basic


    #### What is JavaScript?

    JavaScript is a dynamic programming language used to make web pages interactive.
    Its interpreter is embedded inside browser software, such as IE, Chrome, and Firefox.
    It runs on visitor''s computer and browser.


    The syntax of JavaScript looks like this:


    ```html

    <script type="text/javascript">...</script>

    ```


    Example:

    ```html

    <script type="text/javascript">

    alert("Hello World");

    </script>

    ```


    Explanation: `<script type="text/javascript">` is a tag for JavaScript. The JavaScript
    codes are included within it. `alert` pops up an alert box displaying a message.
    `alert("Hello World")` displays "Hello World" message.


    #### Comment

    JavaScript block can located anywhere in HTML. Comment is used to explain the
    code.


    ```javascript

    // This is a single line comment

    /*This is a multi line comment; JavaScript interpreter will ignore both single
    line comment and multi line comment*/

    ```


    Example:

    ```html

    <script type="text/javascript">

    alert("Hello World"); // "alert" pops up a message

    /*alert" pops up an alert box displaying a message "Hello World". alert() is usually
    used if you want to make sure message comes through to the user. */

    </script>

    ```


    Explanation: `// "alert" pops up a message` is a single line comment. `/* "alert"
    pops up an alert box displaying a message "Hello World". ... */` is a multi line
    comment.


    #### Keywords

    Keywords belong to JavaScript itself. These may not be used when choosing identifier
    names for variables, functions, properties. The following are part of JavaScript
    keywords:


    `break`, `case`, `continue`, `default`, `delete`, `do`, `else`, `export`, `False`,
    `for`, `function`, `if`, `import`, `in`, `new`, `null`, `return`, `switch`, `this`,
    `true`, `typeof`, `var`, `void`, `while`, `With`, `Array`, `Date`, `Math`, `Object`,
    `window`, `location`, `history`, `navigator`, `document`, `images`, `links`, `forms`,
    `elements`, `getElementById`, `innerHTML`.

