- "# JavaScript：初学者指南\n\n\n\n![](img/image_rsrc26Z.jpg)\n\n\n## 关于作者\nKarthigadevi\
  \ 是安纳大学（Anna University）计算机科学与信息系统系的副教授。他在巴拉蒂亚尔大学（Bharathiyar University）获得计算机科学硕士学位，并在安纳大学获得计算机科学学士学位。他曾在行业内担任软件工程师和项目经理，精通\
  \ Java 以及各种网络技术——`HTML`、`CSS`、`JavaScript`、`JavaServer Pages` 和 `servlets`。他教授过全系列的计算机科学课程，包括客户端和服务端\
  \ Web 编程课程。\n\n邮箱：ebookauthor011@gmail.com\n\n## 法律声明\n版权所有。未经以任何形式或通过任何手段复制或传输本书的任何部分。除非获得本书公司的书面许可，否则严禁复印、发布到网络和/或数字复制。允许为面向公众撰写的评论中限制度地使用本书的内容。\n\
  \n## JavaScript\n\n\n## JavaScript 基础\n\n#### 什么是 JavaScript?\nJavaScript 是一种动态编程语言，用于使网页具有交互性。它的解释器嵌入在浏览器软件中，如\
  \ IE、Chrome 和 Firefox。它运行在访问者的计算机和浏览器上。\n\nJavaScript 的语法如下：\n\n```html\n<script\
  \ type=\"text/javascript\">...</script>\n```\n\n示例：\n```html\n<script type=\"text/javascript\"\
  >\nalert(\"Hello World\");\n</script>\n```\n\n解释：`<script type=\"text/javascript\"\
  >` 是 JavaScript 的标签。JavaScript 代码包含在其中。`alert` 会弹出一个显示消息的警告框。`alert(\"Hello World\"\
  )` 显示 \"Hello World\" 消息。\n\n#### 注释\nJavaScript 块可以位于 HTML 的任何位置。注释用于解释代码。\n\n\
  ```javascript\n// 这是一个单行注释\n/*这是一段多行注释；JavaScript 解释器将忽略单行注释和多行注释*/\n```\n\n示例：\n\
  ```html\n<script type=\"text/javascript\">\nalert(\"Hello World\"); // \"alert\"\
  \ 弹出一个消息\n/*\"alert\" 弹出一个显示消息 \"Hello World\" 的警告框。如果你想确保消息传达给用户，通常使用 alert() */\n\
  </script>\n```\n\n解释：`// \"alert\" 弹出一个消息` 是单行注释。`/* \"alert\" 弹出一个显示消息 \"Hello\
  \ World\" 的警告框。... */` 是多行注释。\n\n#### 关键字\n关键字属于 JavaScript 本身。在选择变量、函数、属性的标识符名称时不能使用这些。以下是\
  \ JavaScript 关键字：\n\n`break`, `case`, `continue`, `default`, `delete`, `do`, `else`,\
  \ `export`, `False`, `for`, `function`, `if`, `import`, `in`, `new`, `null`, `return`,\
  \ `switch`, `this`, `true`, `typeof`, `var`, `void`, `while`, `With`, `Array`, `Date`,\
  \ `Math`, `Object`, `window`, `location`, `history`, `navigator`, `document`, `images`,\
  \ `links`, `forms`, `elements`, `getElementById`, `innerHTML`.\n\n\n\n\n\n## JavaScript\
  \ 基础\n\n示例：`break` // 这是一个 JavaScript 关键字。\n`return` // 这是一个 JavaScript 关键字。\n\n\
  ### 解析\n在为变量、函数、属性选择标识符名称时，不能使用 JavaScript 关键字。\n\n## 变量\n`Variable`（变量）是与值关联的符号名称。使用\
  \ `var` 来定义变量。\n\n### 示例\n```html\n<script type = “text/javascript\">\nvar abcde;\n\
  var abc888;\nvar my_variable;\n</script>\n```\n### 解析\n`abcde`、`abc888` 和 `my_variable`\
  \ 都是变量。它们可以存储某些值。例如 `var abcde=100;`，`var abc888=”Hello World”;`，`var my_variable=true;`。\n\
  注意变量命名不能以数字开头，不能包含空格。例如，“23var”，“abc de”是无效的变量名。但“var23”，“abcde”是变量变量。\n\n## 数据类型\n\
  - `string` – 字符或字符字符串\n- `number` – 整数或浮点数\n- `boolean` – 值为 true 或 false 的值\n-\
  \ `function` – 用户定义的方法\n- `object` – 内置或用户定义的对象\n\n### 示例\n```html\n<script type\
  \ = “text/javascript\">\nvar mystring= “I am a string”;\nvar myinteger=168;\nvar\
  \ myfloat=12.88;\nvar mybool=true;\n</script>\n```\n### 解析\n`var mystring=”I am\
  \ a string=”` // `mystring` 数据类型是 `string`。\n`var myinteger=168;` // `myinteger`\
  \ 数据类型是 `number`。\n`var myfloat=12.88;` // `myfloat` 数据类型是 `number`。\n`var mybool=true;`\
  \ // `mybool` 数据类型是 `boolean`。\n注意：字符串始终使用双引号。例如，“abcde”，“learning”。\n\n## 转义序列\n\
  反斜杠 `\\` 用于转义字符。\n- `\\n` 将内容输出到下一行。\n- `\\r` 产生回车。\n- `\\t` 产生制表符。\n- `\\'` 输出单引号。\n\
  - `\\\"` 输出双引号。\n\n### 示例\n```html\n<script type = “text/javascript\">\nalert (“JavaScript\
  \ says \\”Hello World! \\” ”);\n</script>\n```\n（输出: “Hello World”）\n### 解析\n`\\\
  \"` 输出双引号。注意 “Hello World” 带有一个双引号。另一个示例：`\\t` 产生一个制表符\n`alert (“Hello \\t\\t\\\
  t World”);` // 注意这里有三个制表符\n（ 输出: Hello     World )\n\n## 函数\n函数是一个可以重复运行多次的 own\
  \ 块。要定义函数，使用 `function function-name ( ) { }`。\n\n| 语法 | `function function-name\
  \ ( ) {……}` |\n要调用函数，使用 `function-name ( );` |\n\n| 语法 | `function-name ( );` |\n\
  \n### 示例\n```html\n<script type = “text/javascript\">\nfunction test( ){\n   alert\
  \ (“show a sample”);\n}\ntest ( );\n</script>\n```\n（输出: show a sample）\n### 解析\n\
  `“function test( ) { }` 是 `test( )` 函数的声明。`test( )` 是调用名为 `test(){` 函数的命令。运行函数 `test\
  \ ( )` 时，它将输出 “show a sample”。\n\n### 带参数的函数\n函数括号内可以有一个或多个参数。参数用于将数据传递给函数。\n\n\
  | 语法 | `function function-name ( var arg ) {……}` |\n要调用函数，使用 `function-name (argument);`\
  \ |\n\n| 语法 | `function-name (argument );` |\n\n### 示例\n```html\n<script type =\
  \ “text/javascript\">\nfunction test( var arg ){\n  alert ( arg );\n}\ntest(“display\
  \ a sample”);\n</script>\n```\n（输出: display a sample）\n### 解析\n当 `test(“display\
  \ a sample”)` 调用函数 `test(var arg){…}` 时，它会将 “display a sample” 传递给 `var arg`。在 `var\
  \ arg` 接收数据后，它将传递函数内部的数据。`alert ( arg )` 将使用该数据，然后输出 “display a sample”。\n\n###\
  \ 返回值\n`return` 可以向调用者返回一个值。\n\n| 语法 | `function function-name ( var arg ) { return\
  \ value }` |\n要调用函数，使用 `function-name (argument);` |\n\n| 语法 | `function-name (argument\
  \ );` |\n\n### 示例\n```javascript\nfunction cube(var num){return num*num*num}\nalert\
  \ ( cube(2) );\n```\n（ 输出: 8 ）\n### 解析\n`“cube (2)”` 意味着 `cube(2)` 调用函数 `cube(var\
  \ num){ }`，并将参数 “2” 传递给 `var num`。`“return num*num*num” 将结果返回给调用者 `cube(2)`，你可以将其视为\
  \ `cube(2) = return num*num*num`，将值赋值给 `cube(2)`。`alert ( cube(2) )` 将显示 `cube(2)`\
  \ 的结果。\n\n## 变量作用域\n全局变量在函数外部声明，可以在地方可以使用；局部变量在函数内部声明，仅在函数内部使用。\n\n### 示例\n```html\n\
  <script type = “text/javascript\">\nvar num=200; // 全局变量\nfunction test( ){\n  var\
  \ num=100; // 局部变量\n}\nalert (num);\n</script>\n```\n（输出: 200）\n### 解析\n`alert (num)`\
  \ 输出 200，这是全局变量。局部变量仅在函数块内可见。\n\n## 显示文本\n`document.write( )` 将指定的文本显示到当前页面。\n\n\
  ### 示例\n```html\n<script type = “text/javascript\">\ndocument.write (“Hello World!”);\n\
  </script>\n```\n（输出: Hello World!）\n### 解析\n`alert ( )` 弹出对话框显示消息。\n\n## 运算符\n\n\
  | 运算符 | 说明 |\n| :--- | :--- |\n| `+` | 加法 |\n| `-` | 减法 |\n| `*` | 乘法 |\n| `/` |\
  \ 除法 |\n| `%` | 取模：第一个操作数除以第二个操作数，返回余数。 |\n| `++` | 递增 |\n| `--` | 递减 |\n\n### 示例\n\
  ```javascript\nvar add=100+200;\nalert (add);\nvar div=800/2;\nalert ( div );\n\
  var mod=100%3;\nalert ( mod );\nvar inc=10++;\nalert ( inc );\n```\n### 解析\n`var\
  \ add=100+200; alert (add);` 输出 300。\n`var div=800/2; alert ( div );` 输出 400。\n\
  `var mod=100%3; alert ( mod );` 输出 1。\n`var inc=10++; alert ( inc );` 输出 10。\n\n\
  ## 逻辑运算符\n| 运算符 | 说明 |\n| :--- | :--- |\n| `&&` | 与 (AND) |\n| `||` | 或 (OR) |\n\
  | `!` | 非 (NOT) |\n\n### 示例\n```javascript\nvar x=true; var y=false;\nvar a=x &&\
  \ y; alert ( a ); // 输出: false\nvar b=x || y; alert ( b ); // 输出: true\nvar c=!\
  \ x; alert ( c ); // 输出: false\n```\n### 解析\n`true && true` 返回 true；`true && false`\
  \ 返回 false；`false && false` 返回 false；`true || false` 返回 true；`false || false` 返回\
  \ false；`! true` 返回 false；`! false` 返回 true。\n\n## 赋值运算符\n| 运算符 | 示例 |\n| :--- |\
  \ :--- |\n| `+=` | `x+=y` |\n| `-=` | `x-=y` |\n| `*=` | `x*=y` |\n| `/=` | `x/=y`\
  \ |\n| `%=` | `x%=y` |\n\n### 示例\n```javascript\nvar x=200; var y=100;\nx+=y; alert\
  \ ( x );\nx/=y; alert ( x );\nx-=y; alert ( x );\nvar m=”abc”; var n=”de”;\nm+=n;\
  \ alert ( m );\n```\n### 解析\n`x+=y // x=x+y;` 输出 300。\n`x/=y; // x=x/y;` 输出 200。\n\
  `x-=y; // x=x-y;` 输出 100。\n`m+=n; // m=m+n;` 输出 abcde。\n\n## 比较运算符\n| 运算符 | 说明 |\n\
  | :--- | :--- |\n| `>` | 大于 |\n| `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n\
  | `==` | 等于 |\n| `!=` | 不等于 |\n\n### 示例\n```javascript\nvar a=100; var b=200;\n\
  var result = (a>b); alert ( result );\nvar result = (a==b); alert ( result );\n\
  var result = (a!=b); alert ( result );\n```\n### 解析\n`var result = (a>b); // 测试\
  \ 100>200;` 输出 false。\n`var result = (a==b); // 测试 100==200;` 输出 false。\n`var result\
  \ = (a!=b); // 测试 100!=200;` 输出 true。\n\n## 条件运算符\n条件运算符的语法如下所示：\n`(test-expression)\
  \ ? (if-true-do-this) : (if-false-do-this);`\n`(test-expression)` 类似于 `a<b`、`x!=y`、`m==n`\
  \ 等。\n\n### 示例\n```html\n<script type = “text/javascript\">\nvar a=100; var b=200;\n\
  var result=(a<b) ? ”apple” : ”boy”;\nalert ( result );\n</script>\n```\n（ 输出: apple\
  \ ）\n### 解析\n输出是 “apple”。条件运算符使用 `(a<b)` 测试 “a” 和 “b”，因为 “a” 小于 “b”，它是 true。因此，输出是\
  \ “apple”。\n\n### 语句\n```javascript\nif ( test-expression ) { // 如果为真执行此操作 }\n```\n\
  `if 语句` 在指定的条件为真时执行 `{ … }` 中的代码；如果条件为假，则不执行 `{…}` 中的任何代码。\n\n### 示例\n```javascript\n\
  var a=200; var b=100;\nif (a>b){\n  alert ( ”a is greater than b.” );\n}\n```\n\
  （输出: a is greater than b。）\n### 解析\n`( a>b )` 是测试表达式，即 `(200>100)`，如果返回 true，则执行\
  \ `{ }` 内部的代码；如果返回 false，则不执行 `{ }` 内部的代码。\n\n### If-else 语句\n```javascript\nif\
  \ ( test-expression) { // 如果为真执行此操作 } else { // 如果为假执行此操作 }\n```\n\n\n\n\n\n## If...else\
  \ 语句\n\n`if...else statement` 在条件为真时执行某些代码，在条件为假时执行另一段代码。\n\n示例：\n```javascript\n\
  var a=100; var b=200;\nif (a>b){\n  alert ( ”a is greater than b.”)}\nelse {\n \
  \ alert ( “a is less than b” );\n}\n```\n(输出: `a is less than b.`)\n\n解释：`(a>b)`\
  \ 是一个测试表达式，即 `(100>200)`，如果 `if` 返回 true，它将输出 `\"a is greater than b.\"`；如果 `if`\
  \ 返回 false，它将输出 `a is less than b`。\n\n## Switch Statement\n\n```javascript\nswitch\
  \ ( var variable ){\n  case 1: 如果等于此 case，执行操作; break;\n  case 2: 如果等于此 case，执行操作;\
  \ break;\n  case 3: 如果等于此 case，执行操作; break;\n  default : 如果不等于任何 case，运行默认代码; break;\n\
  }\n```\n\n变量的值将首先与每个 `case` 进行比较，如果等于其中一个 `case` 值，它将执行该 `case` 代码。`break;` 终止代码运行。\n\
  \n示例：\n```javascript\nvar number=20;\nswitch ( number ) {\n  case 10 : alert ( “Running\
  \ case 10” ); break;\n  case 20 : alert ( “Running case 20” ); break;\n  case 30\
  \ : alert ( “Running case 30” ); break;\n  default : alert ( “Running default code”\
  \ ); break;\n}\n```\n(输出: `Running case 20`)\n\n解释：`number` 的值为 `20`；它将匹配 `case\
  \ 20`，因此将运行 `case 20` 中的代码。\n\n## For 循环\n\n```javascript\nfor( 初始化, 测试表达式, 增量)\
  \ { // 某些代码; }\n```\n\n`for loop` 通过指定的次数运行代码块。\n\n示例：\n```html\n<script type =\
  \ “text/javascript”>\nfor (var x = 0; x <= 5; x++) {\n  document.write ( \"x \"\
  \ );\n}\n</script>\n```\n(输出: `012345`)\n\n解释：`var x = 0` 是初始化器，`x <= 5` 是测试表达式，代码最多运行\
  \ 5 次。`x++` 意味着 `x` 每次循环增加 1。在循环 5 次后，代码将输出 `012345`。\n\n## While 循环\n\n```javascript\n\
  while ( 测试表达式 ) {\n  // 在此处编写某些 js 代码;\n}\n```\n\n`while loop` 当指定的条件为真时循环执行一个代码块。\n\
  \n示例：\n```javascript\nvar counter=0;\nwhile (counter < 8){\n  document.write ( “&”\
  \ );\n  counter++;\n}\n```\n(输出: `&&&&&&`)\n\n解释：`“counter< 8\"` 是一个测试表达式，如果条件为真，代码将循环少于\
  \ 8 次，直到 `counter` 等于 `8`，此时条件为假，代码将停止运行。\n\n## Do-While 循环\n\n```javascript\ndo{\
  \ // 在此处编写某些 js 代码 } while ( 测试表达式);\n```\n\n`do...while` 循环执行一次代码块，如果指定的条件为真，则重复循环。\n\
  \n示例：\n```javascript\nvar counter=0;\ndo {\n  document.write ( “@” );\n  counter++;\n\
  } while (counter<8);\n```\n(输出: `@@@@@@@@`)\n\n解释：`“counter< 8\"` 是一个测试表达式，如果条件为真，代码将循环少于\
  \ 8 次，直到 `counter` 等于 `8`，此时条件为假，代码将停止运行。\n\n## 数组 (Array)\n\n### 创建数组\n数组是一种特殊的变量，可以包含一个或多个值。`new\
  \ Array()` 创建数组。\n\n创建数组的语法：\n```javascript\nvar array-name = new Array (“value0”,\
  \ “value1”, “value2”);\n```\n\n创建数组的另一种语法：\n```javascript\nvar array-name = new\
  \ Array ( );\narray-name[index0] = “value1”;\narray-name[index1] = “value1”;\narray-name[index2]\
  \ = “value2”;\n```\n\n示例：\n```javascript\nvar color = new Array ( );\ncolor [0]\
  \ = “red”;\ncolor [1] = “blue”;\ncolor [2] = “green”;\n```\n解释：上述代码创建了一个数组，数组名为\
  \ `color`，它有三个元素：`color[0]`、`color[1]`、`color[2]`。它们的索引是 0, 1 和 2。它们的值是 `red`、`blue`\
  \ 和 `green`。注意索引从零开始。\n\n### 显示数组元素值\n要显示数组元素值，使用以下语法：\n```javascript\ndocument.write\
  \ ( array-name[index] );\n```\n\n示例：\n```html\n<script type = “text/javascript”>\n\
  color = new Array(“yellow”, “purple”, “orange”);\ndocument.write ( color[1] );\n\
  </script>\n```\n(输出: `purple`)\n\n解释：从上面你可以可以知道：\n- `color[0]` 的值为 `yellow`。\n-\
  \ `color[1]` 的值为 `purple`。\n- `color[2]` 的值为 `orange`。\n\n### 获取数组长度\n从上面可以知道：\n\
  ```javascript\nvar len = color.length;\n```\n(输出: `3`)\n\n### 修改数组元素\n要修改数组元素，使用以下语法：\n\
  ```javascript\narray-name[index] = “new value”;\n```\n\n示例：\n```javascript\ncolor[1]\
  \ = “black”;\n```\n\n### 删除数组元素\n要删除数组元素，使用以下语法：\n```javascript\narray-name.splice(index,\
  \ count);\n```\n\n示例：\n```javascript\ncolor.splice(1, 1);\n```\n\n\n\n\n\n### `tan()`\n\
  | `tan()` ` | 角度的三角正切 |\n\n示例:\n```javascript\nvar num = 10.2;\ndocument.write (\
  \ Math.round(num) );\n```\n( 输出: 10)\nExplanation: `Math.round(num)` 返回 `10.2` 的舍入整数。结果为\
  \ `10`。\n\n### `Ceil()` & `Floor()`\n\n| `Math.ceil() ` | `Math.floor() ` |\n| :---\
  \ | :--- |\n\n`Math.ceil( )` 返回一个大于或等于其参数的整数。`Math.floor( )` 返回一个小于或等于其参数的整数。\n\n\
  示例: \n```javascript\nvar num = 9.5;\ndocument.write ( “Ceiling number is”+Math.ceil(\
  \ num ) );\ndocument.write ( “Flooring number is”+Math.floor( num ) );\n```\n( 输出:\
  \ Ceiling number is 10.0 Flooring number is 9.0 )\nExplanation: `Math.ceil( num\
  \ )` 返回一个大于或等于 `9.5` 的整数，结果为 `10.0`。`Math.floor( num )` 返回一个小于或等于 `9.5` 的整数，结果为\
  \ `9.0`。\n\n### `Max()` & `Min()`\n\n| `Math.max() ` | `Math.min() ` |\n| :--- |\
  \ :--- |\n\n`Math.max( )` 返回两个数字中较大的一个。`Math.min( )` 返回两个数字中较小的一个。\n\n示例: \n```javascript\n\
  var x = 100;\nvar y = 200;\ndocument.write (“Greater number is”+Math.max(x, y) );\n\
  document.write (“Less number is”+Math.min(x, y) );\n```\n( 输出: Greater number is\
  \ 200 Less number is 100 )\nExplanation: `Math.max(x, y)` 返回 `100` 和 `200` 之间较大的数字，结果为\
  \ `200`。`Math.min(x, y)` 返回 `100` 和 `200` 之间较小的数字，结果为 `100`。\n\n### `Math.PI` &\
  \ `random()`\n\n| `Math.PI` | `Math.random() ` |\n| :--- | :--- |\n\n`Math.PI` 是存储圆周率\
  \ 值的常量。`Math.random( )` 生成一个于 `0.0` 到 `1.0` 之间的数字。\n\n示例: \n```javascript\nvar pi\
  \ = Math.PI;\nvar ran = Math.random( );\ndocument.write (“The PI value is” + pi);\n\
  document.write (“The random number is” + ran);\n```\n( 输出: The PI value is 3.141592653589793\
  \ The random number is 0.16869328 )\nExplanation: `Math.PI` 的值为 `3.141592653589793`。`Math.random(\
  \ )` 生成一个于 `0.0` 到 `1.0` 之间的随机数，在这里的结果是 `0.16869328`。\n\n### Date & Time\nJavaScript\
  \ 经常使用日期和时间来设计网页。在使用日期和时间时，必须先创建一个日期对象。\n\n| `var DateObject = new Date( )` |\n\n\
  `new Date( )` 可以创建一个日期对象。\n\n示例: \n```javascript\nvar DateObject = new Date( );\n\
  alert ( DateObject );\n```\n( 输出: Sun Apr 12 12:23 UTC 2015 )\nExplanation: `var\
  \ DateObject = new Date( )` 创建了一个日期对象。`alert ( DateObject )` 显示当前的日期和时间。\n注意：要创建一个日期对象，你可以使用其他变量名，例如：\n\
  ```javascript\nvar now= new Date( );\nvar TimeObjcet = new Date( );\n```\n\n####\
  \ Date, Month, Year, Day\nDate 对象拥有以下方法：\n\n| `getDate() ` | 获取日期 |\n| :--- | :---\
  \ |\n| `getMonth() ` | 获取月份 |\n| `getYear() ` | 获取年份 |\n| `getDay() ` | 获取星期 |\n\
  \n注意 `getDay( )` 返回值从 `0`（星期日）到 `6`（星期六）。`getMonth( )` 返回值从 `0`（一月）到 `11`（十二二月）。\n\
  \n示例: \n```javascript\nvar now = new Date ( );\nvar y = now.getYear( );\nvar d =\
  \ now.getDate( );\nalert ( y+ “ ” + d );\n```\n( 输出: 2015 12 )\nExplanation: `now.getYear(\
  \ )` 返回当前年份。`now.getDate( )` 返回当前日期。\n\n#### Hours, Minutes, Seconds\nDate 对象拥有以下方法：\n\
  \n| `getHours() ` | 获取小时 |\n| :--- | :--- |\n| `getMinutes() ` | 获取分钟 |\n| `getSeconds()\
  \ ` | 获取秒 |\n| `getTime() ` | 获取时间 |\n\n注意 `getTime( )` 返回一个从 `1970 年 1 月 1 日` 到当前时间的数字。\n\
  \n示例: \n```javascript\nvar now = new Date( );\nvar h = now.getHours( );\nvar m =\
  \ now.getMinutes( );\nvar s = now.getSeconds( );\nalert ( “Current time is” + h+\
  \ “:” + m + “:” + s );\n```\n( 输出: Current time is 19:30:28 )\nExplanation: `getHours`\
  \ 返回当前小时。`getMinutes` 返回当前分钟。`getSeconds` 返回当前秒。\n\n#### Different Time\n| `getUTCHours()\
  \ ` | `getTimezoneOffset() ` |\n| :--- | :--- |\n\n`getUTCHours( )` 返回格林尼治时间（UTC）。`getTimezoneOffset(\
  \ )` 返回 UTC 时间与本地时间的差异。例如，如果你的时区是 `GMT+2`，将返回 `-120`。\n\n示例: \n```javascript\nvar\
  \ now = new Date( );\nvar utc = now.getUTCHours();\nvar timezone = now.getTimezoneOffset();\n\
  alert ( utc + timezone );\n```\n( 输出: utc + timezone )\nExplanation: `getUTCHours(\
  \ )` 返回格林尼治时间。`getTimezoneOffset( )` 返回 UTC 时间与本地时间的差异。\n\n### Set Date & Time\n\
  Date 对象拥有以下方法：\n\n| `setDate() ` | 设置日期 |\n| :--- | :--- |\n| `setMonth() ` | 设置月份\
  \ |\n| `setYear() ` | 设置年份 |\n| `setDate() ` | 设置日期 |\n| `setHours() ` | 设置小时 |\n\
  | `setMinutes() ` | 设置分钟 |\n| `setSeconds() ` | 设置秒 |\n| `setTime() ` | 设置时间 |\n\
  \n注意 `setDate( )` 设置月份中的日期。\n示例: \n```javascript\nvar now = new Date( );\nnow.setDate(15);\n\
  now.setMonth(5);\nnow.setYear(2023);\nalert ( now );\n```\n( 输出: Date object )\n\
  Explanation: `setDate( )` 设置月份中的日期。\n\n\n\n\n\n## substr()\n\n`substr( start, length\
  \ )` 可以从字符串中提取子字符串。`start` 参数指定提取的起始位置。`length` 参数指定子字符串的长度。\n\n示例：\n```javascript\n\
  var mystring = “JavaScript is easy.\";\nvar sub = mystring.substr( 4, 6 );\nalert\
  \ ( sub );( Output:  Script )\n```\n解释：`mystring.substr( 4, 6 )` 从 `mystring` 中提取子字符串。`(\
  \ 4, 6 )` 指定子字符串的起始位置为 4，长度为 6。注意字符串索引从零开始。\n\n## 将数字转换为字符串\n\n| `number.toString(\
  \ )` |\n\n为了满足 JS 编程的需求，有时需要将数字转换为字符串数据类型。`number.toString( )`可以将数字转换为字符串。\n\n示例：\n\
  ```javascript\nvar num1 = 12; \nvar num2 = 68;\nvar str1 = num1.toString( );\nvar\
  \ str2 = num2.toString( );\nvar sum = str1 + str2;\ndocument.write( sum );(  Output:\
  \  1268 )\n```\n解释：`num1.toString( )` 和 `num2.toString( )` 将两个数字转换为字符串数据类型。因此，`str1`\
  \ 相加 `str2` 的结果是 1268，而不是 80。\n\n## 将字符串转换为数字\n\n| `parseInt(string);` `parseFloat(\
  \ string);` |\n\n`parseInt(string)` 和 `parseFloat(string)`可以将字符串转换为整数或浮点数。\n\n示例：\n\
  ```javascript\nvar str1 = “12”;  \nvar str2 = “68”;\nvar sum = str1 + str2;  \n\
  alert ( sum );(  Output: 1268  )\nvar num1 = parseInt( str1 );\nvar num2 = parseInt(\
  \ str2 );\nvar addition = num1 + num2;\nalert ( addition );(  Output: 80 )\n```\n\
  解释：`parseInt( str1 )` 和 `parseInt( str2 )` 将两个字符串转换为数字数据类型。因此，`num1` 相加 `num2` 的结果是\
  \ 80，而不是 1268。\n\n## 搜索特定文本 (1)\n\n| `indexOf( )` |\n\n`indexOf( )`可以在字符串中查找特定文本第一次出现的位置。\n\
  \n示例：\n```javascript\nvar mystring = \"Please find where find word occurs!\";\n\
  var place = mystring.indexOf(\"find\");\nalert ( place );( Output: 7)\n```\n解释：`mystring.indexOf\
  \ ( “find” )` 返回“find”在 `mystring` 中第一次出现的位置。输出为 7。字符索引从零开始。如果在字符串中未找到该文本，`indexOf(\
  \ )` 返回 -1。 \n\n## 搜索特定文本 (2)\n\n| `lastIndexOf( )` |\n\n`lastIndexOf( )`可以在字符串中查找特定文本最后一次出现的位置。\n\
  \n示例：\n```javascript\nvar mystring = \"Please find where find word occurs!\";\n\
  var place = mystring.lastIndexOf(\"find\");\nalert ( place );( Output: 18 )\n```\n\
  解释：`mystring.lastIndexOf ( “find” )` 返回“find”在 `mystring` 中最后一次出现的位置。输出为 18。字符索引从零开始。如果在字符串中未找到该文本，`indexOf(\
  \ )` 返回 -1。\n\n## 对象声明\n\n对象（Object）指的是某个具体的事物。例如：汽车、书、狗、房子等……\n\n| `obj = new Object(\
  \ );` `obj.property;` |\n\n`obj = new Object( )`创建一个名为 `obj` 的新对象。`obj.property`\
  \ 意味着对象的属性。\n\n示例：\n```javascript\nhouse = new Object ( );\nhouse.color = “white”;\n\
  house.size = “big”;\ndocument.write( “House color: ” + house.color + “\\n”);\ndocument.write(\
  \ “House size: ” + house.size + “\\n” );(  Output:  House color: whiteHouse size:\
  \  big )\n```\n解释：`house=new Object( )` 创建了一个名为 `house` 的对象。`house.color`意味着房屋的颜色。`house.size`意味着房屋的大小。\n\
  \n## 网页间导航\n\n| `windows.history.back( );` `windows.history.forward( );` |\n\n`back(\
  \ )`用于导航到上一个网页。`forward( )`用于导航到下一个网页。\n\n示例：\n```javascript\nwindows.history.back(\
  \ );(  Returns:  Previous web page. )\nwindows.history.forward( );(  Returns:  Next\
  \ web page. )\n```\n解释：`back( )`回到上一个页面。`forward( )`前往下一个页面。`window.history.method(\
  \ )`用于导航到指定的网页。该方法通常由网页上的按钮调用，将在后续章节中介绍。\n\n## 跳转到指定页面\n\n| `window.history.go(\
  \ number );` |\n\n`window.history.go( number)`跳转到指定的网页。\n\n示例：\n```javascript\n\
  window.history.go(1);( Returns:  Next web page.)\nwindow.history.go( -1);( Returns:\
  \ Previous web page.)\nwindow.history.go( 0 );( Returns: Reload current web page.)\n\
  ```\n解释：`window.history.method( )`用于导航到指定的网页。该方法通常由网页上的按钮调用，将在后续章节中介绍。\n\n## 打开自定义窗口\n\
  \n| `window.open( name, width, height, status, menubar )` |\n\n`window.open`可以打开一个新的自定义窗口。`name`\
  \ 参数意味着新窗口名称。`width` 参数意味着新窗口宽度。`height` 参数意味着新窗口高度。`status` 和 `menubar`。\n\n示例：\n\
  ```javascript\nwindow.open( “MyWindow”, “400”, “300”, “Status”, “no” );\n```\n解释：`MyWindow`是窗口名称。`400`、`300`是宽度和高度。`Status`是状态。`no`是菜单栏。\n\
  \n## 确认\n\n| `window.confirm( );` |\n\n`window.confirm( )`需要用户确认。对话框如下：\n\n示例：\n\
  ```javascript\nvar ask = window.confirm( “Are you sure?” );\nif ( ask == true )\
  \ {\n  alert (“All Right!”);\n} else {\n  alert (“No Good!”);\n}\n```\n解释：用户点击“确定”或“取消”。\n\
  \n## 输入提示\n\n| `window.prompt( );` |\n\n`window.prompt( )`需要用户输入。对话框如下：\n\n示例：\n\
  ```javascript\nvar ask = window.prompt( “Enter your name” );\nif ( ask != null )\
  \ {\n  alert (“Hello ” + ask);\n} else {\n  alert (“Cancelled”);\n}\n```\n解释：用户在提示框中输入句子。\n\
  \n\n\n\n\n```html\n<html><head><title>…</title></head><body><form></form>…..</body></html>\n\
  ```\n\n解释：`<html>`...`</html>` 定义了网页文档。`<head>`...`</head>` 定义网页的头部。`<title>`...`</title>`\
  \ 定义网页的标题。`<body>`...`</body>` 定义网页的正文。`<form>`...`</form>` 定义了一个表单，用于接收来自用户的请求或输入。\n\
  \n### 点击事件 (Click Event)\n当用户点击网页上的某个元素时，会触发“click”事件。\n\n```onClick = function(\
  \ );\n```\n\n`onClick = function( );` 意味着当点击元素时，会执行一个函数。\n\n示例：\n```html\n<form><input\
  \ type=\"button\" value=\"Previous\" onClick=\"history.back( )\"></form>\n```\n\
  （ 返回：上一个网页。 ）\n\n解释：`<form>` 和 `</form>` 是 HTML 标签，位于网页中，`form` 用于接收来自用户的请求。`<input\
  \ type=\"button\" value=\"Previous\"...>` 在表单中定义了一个按钮，按钮上有“Previous”文本。\n\n`onClick=\"\
  history.back( )\"` 意味着当点击按钮时，`history.back( )` 会立即运行，然后返回上一个网页。\n\n### 加载事件 (Onload\
  \ Event)\n当网页完全加载完成后，会触发“onload”事件。\n\n```onload = function( );\n```\n\n`onload=function(\
  \ )` 意味着当网页加载完成后，`function( )` 会立即执行。\n\n示例：\n```html\n<html><body onload = alert\
  \ ( \"Welcome to my page!\" )>……</body></html>\n```\n解释：`<html>` 和 `</html>` 是 html\
  \ 标签，定义了一个网页。`<body>` 和 `</body>` 定义网页的正文。`onload=alert( )` 意味着当网页加载时，`alert( )`\
  \ 会立即运行并显示消息“Welcome to my page!”。\n\n### 卸载事件 (Unload Event)\n当网页卸载时，会触发“unload”事件。\n\
  \n```unload = function( );\n```\n\n`unload=function( )` 意味着当网页卸载时，`function( )`\
  \ 会立即执行。\n\n示例：\n```html\n<html><body unload = confirm ( \"Are you sure?\" )>……</body></html>\n\
  ```\n解释：`<html>` 和 `</html>` 是 html 标签，定义了一个网页。`<body>` 和 `</body>` 定义网页的正文。`unload=confirm(\
  \ )` 意味着当网页卸载时，`confirm( )` 会立即运行并显示消息“Are you sure?”。\n\n### 鼠标悬入事件 (Mouseover\
  \ Event)\n当鼠标指针移动到元素上方时，会触发“mouseover”事件。\n\n```mouseover = function( );\n```\n\n\
  `mouseover = function( )` 意味着当鼠标指针移动到元素上方时，`function( )` 会立即执行。\n\n示例：\n```html\n\
  <body><img src = \"myphoto.jpg\" mouseover = alert (\"Please view the photo.\")\
  \ ;></</body>>\n```\n解释：`<img>` 是定义图片的标签。`src=\"myphoto.jpg\"` 指定了网页中显示的图片 `myphoto.jpg`。`mouseover=alert(\
  \ );` 意味着当鼠标指针移动到图片上方时，`alert( )` 会立即运行并显示消息“Please view the photo”。\n\n### 鼠标移出事件\
  \ (Mouseout Event)\n当鼠标指针移出元素时，会触发“mouseout”事件。\n\n```mouseout = function( );\n\
  ```\n\n`mouseout = function( )` 意味着当鼠标指针移出元素时，`function( )` 会立即执行。\n\n示例：\n```html\n\
  <body><img src = \"myphoto.jpg\" mouseout = alert (\"See you!\") ;></</body>>\n\
  ```\n解释：`<img>` 是定义图片的标签。`src=\"myphoto.jpg\"` 指定了网页中显示的图片 `myphoto.jpg`。`mouseout=alert(\
  \ );` 意味着当鼠标指针移出图片时，`alert( )` 会立即运行并显示消息“See you!”。\n\n### 按键按下事件 (Onkeydown Event)\n\
  当按键被按下时，会触发“onkeydown”事件。\n\n```onkeydown = function( );\n```\n\n`onkeydown = function(\
  \ )` 意味着当按键按下时，`function( )` 会立即执行。\n\n示例：\n```html\n<body><input type=\"text\"\
  \ onkeydown=\"myfunction( )\"></</body>\n<script>function myfunction( ){ alert (\"\
  You pressed a key.\"); }</script>\n```\n解释：`<input type=\"text\"...>` 意味着网页中有一个输入框供用户输入数据。输入框如下所示：\n\
  \n`onkeydown=\"myfunction( )\"` 意味着当按键按下时，`myfunction( )` 会立即运行。\n\n### 按键释放事件 (Onkeyup\
  \ Event)\n当按键被释放时，会触发“onkeyup”事件。\n\n```onkeyup = function( );\n```\n\n`onkeyup\
  \ = function( )` 意味着当按键释放时，`function( )` 会立即执行。\n\n示例：\n```html\n<body><input type=\"\
  text\" onkeyup=\"myfunction( )\"></</body\n<script>function myfunction( ){ alert\
  \ (\"You released a key.\"); }</script>\n```\n解释：`<input type=\"text\"...>` 意味着网页中有一个输入框供用户输入数据。输入框如下所示：\n\
  \n`onkeyup=\"myfunction( )\"` 意味着当按键释放时，`myfunction( )` 会立即执行（立即运行）。\n\n### 聚焦事件\
  \ (Focus Event)\n当用户将光标移动到元素上时，会触发“focus”事件。\n\n```focus = function( );\n```\n\n\
  `focus=function( )` 意味着当光标移动到元素时，`function( )` 会立即执行。\n\n示例：\n```html\n<body><input\
  \ type=\"text\" onfocus=\"myfunction( )\"></</body>\n```\n（：网页中的输入。`focus=function(\
  \ )` 意味着当光标移动到元素时，`function( )` 会立即执行。\n\n### 失去聚焦事件 (Blur Event)\n当用户光标移出元素时，会触发“blur”事件。\n\
  \n```blur = function( );\n```\n\n`blur=function( )` 意味着当光标移出元素时，`function( )` 会立即执行。\n\
  \n\n\n\n\n## reset()\n\n`reset()` 用于清除表单数据。\n\n示例：\n```html\n<form id=\"myform\"\
  \ method=\"get\" action=\"f.php\">\n……\n<input type=\"button\" onclick=\"myfunction()\"\
  \ value=\"Clear\">\n</form>\n<script>\nfunction myfunction() {\n  document.getElementById(\"\
  myform\").reset();\n}\n</script>\n```\n（结果：表单数据被完全清除。）\n\n解释：`onclick=\"myfunction()\"\
  ` 意味着点击按钮时会立即执行 `myfunction()`。`document.getElementById(\"myform\")` 通过其 id 访问 `myform`。`reset()`\
  \ 清空 `myform` 数据。\n\n## 提交方法 (Submit Method)\n\n### submit()\n\n`submit()` 用于将表单数据提交到。\n\
  \n示例：\n```html\n<form id=\"myform\" method=\"get\" action=\"f.php\">\n……\n<input\
  \ type=\"button\" onclick=\"myfunction()\" value=\"Submit\">\n</form>\n<script>\n\
  function myfunction() {\n  document.getElementById(\"myform\").submit();\n}\n</script>\n\
  ```\n（结果：表单数据已提交到服务器。）\n\n解释：`onclick=\"myfunction()\"` 意味着点击按钮时会立即执行 `myfunction()`。`document.getElementById(\"\
  myform\")` 通过其 id 访问 `myform`。`submit()` 将 `myform` 数据提交到服务器。\n\n## 选择框选择 (Select\
  \ Selection)\n\n| `<select id=\"myid \" onchange=\"function ( )\">` |\n\n当表单中的 `select`\
  \ 值发生变化时，会触发 `onChange` 事件并立即运行 `function ( )`。\n\n| Red | v |\n\n示例：\n```html\n\
  <select id=\"mySelect\" onchange=\"myfunction()\">\n  <option value=\"Red\">Red</option>\n\
  \  <option value=\"Blue\">Blue</option>\n  <option value=\"Pink\">Pink</option>\n\
  </select>\n<script type=\"text/javascript\">\nfunction myfunction() {\n  var v=document.getElementById(\"\
  mySelect\").value;\n  alert(\"You selected: \" + v);\n} // 例如：选择 Pink\n</script>\n\
  ```\n（输出：You selected: Pink）\n\n解释：`document.getElementById(\"mySelect\")` 通过其 id\
  \ 访问 `mySelect`。`document.getElementById(\"mySelect\").value` 意味着获取值。\n\n## 单选框选择\
  \ (Radio Selection)\n\n| `<input type=\"radio\" id=\"myid\" value=\"myvalue\">`\
  \ |\n\n一组单选按钮允许随时勾选一个圆，并提交选中的值进行处理。\n\n示例：\n```html\n( 显示：○ red ○ blue ○ pink )\n\
  <input type=\"radio\" id=\"color\" value=\"Red\">Red\n<input type=\"radio\" id=\"\
  color\" value=\"Blue\">Blue\n<input type=\"radio\" id=\"color\" value=\"Pink\">Pink\n\
  <input type=\"submit\" value=\"submit\" onclick=\"myfunct()\">\n<script>\nfunction\
  \ myfunct() {\n  var v=document.getElementById(\"color\").value;\n  alert(v);\n\
  } // 例如：选择 Blue\n</script>\n```\n（输出：Blue）\n\n解释：`document.getElementById(\"color\"\
  )` 通过其 id 访问 `color`。`document.getElementById(\"color\").value` 意味着获取值。\n\n## 复选框选择\
  \ (CheckBox Selection)\n\n| `<input type=\"checkbox\" id=\"myid\" value=\"myvalue\"\
  >` |\n\n一组复选按钮允许随时勾选多个框，并提交选中的值进行处理。\n\n示例：\n```html\n( 显示：□ red □ blue □ pink )\n\
  <input type=\"checkbox\" id=\"color\" value=\"Red\">Red\n<input type=\"checkbox\"\
  \ id=\"color\" value=\"Blue\">Blue\n<input type=\"checkbox\" id=\"color\" value=\"\
  Pink\">Pink\n<input type=\"submit\" value=\"submit\" onclick=\"myfunct()\">\n<script>\n\
  function myfunct() {\n  var v=document.getElementById(\"color\").value;\n  alert(v);\n\
  } // 例如：选择 Blue Pink\n</script>\n```\n（输出：Blue Pink）\n\n解释：`document.getElementById(\"\
  color\")` 通过其 id 访问 `color`。`document.getElementById(\"color\").value` 意味着获取值。\n\
  \n## JavaScript: Function ( ) (1)\n\n超链接中的 `href` 属性通常包含 `JavaScript: function(\
