  md: '+   The precedence of multiplication and division is higher than that of addition
    and subtraction.


    +   If an expression contains several operators of the same precedence, then the
    expression is evaluated from left to right.


    In addition the basic operators, JavaScript also supports modulo (%) operator.
    This operator performs division and returns the remainder as result. For example,
    23%7 is equal to 2.


    # Unary Operators


    While operators like addition and subtraction need to operands to execute, some
    operators require only one. An example of such operators is typeof, which returns
    the datatype of the data. For example, typeof 12 returns ‘number’. Please note
    that ''+'' and ''-'' can be used as unary operators. This is the case when they
    are used to specify the sign of a number.


    # Logical Operators


    Three logical operators are available for use in JavaScript namely, Not (!), Or
    (||) and And (&&). The results of operations that involve these operators are
    Boolean (true or false). The results of these operations are computed in accordance
    with the following:


    | AND (&&) | Binary operator |

    |---||

    | | Both the conditions must be true |

    | OR (||) | Binary operator |

    | | At least one of the conditions must be true |

    | NOT (!) | Unary operator |

    | | The value of the condition determined is complemented |'
