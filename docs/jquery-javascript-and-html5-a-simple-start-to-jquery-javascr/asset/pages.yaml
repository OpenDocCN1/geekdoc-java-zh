  md: 'for this operation:


    var fName = localStorage.getItem(''fName'');


    If no value is set, then null is returned.


    +   - removeItem(key)


    It is a method that is used to remove a value associated to the specified key.
    The syntax for this operation is:


    localStorage.removeItem(''fName'');


    +   - clear()


    Removes all items from the local storage. Its syntax is:


    localStorage.clear();


    +   - length


    It is the property that returns the number of entries in the storage.


    var count = localStorage.length;


    +   - key(index)


    This method is used for finding the key associated with the given value. The syntax
    for this operations is:


    var keyValue = localStorage.key(1);


    One of the biggest benefits of using this storage mechanism is that it is supported
    by most modern browsers, unlike other storage mechanisms, which are supported
    by only a few browsers. Although, this mechanism is supported by most web browsers,
    it is a good idea to check it before using it. If the first reference to this
