  md: 'denoted by Infinity.


    +   - Infinity - any number that exceeds the value 1.7976931348623157E + 10308
    is denoted by Infinity.


    # String Data Type


    A string can simply be described as a collection of characters. Whenever you declare
    character(s) within quotes, the system interprets as a string. Sample strings
    include:


    ‘Hello World!’


    “Hello World!”


    However, if you want to include quotes as characters in the string, then you must
    add ''\'' before the character. Sample string:


    ‘You\re Welcome’


    “You\re Welcome”


    JavaScript also supports other escape sequences like \t for tab and \n for newline.


    # Boolean Data Type


    The Boolean data type is a binary data type and return either true or false. These
    operators are commonly used to indicate results of comparisons. For example,


    10 > 5 will give ‘true’ while 5 > 10 will give ‘false’.


    # Operations on Number Data Type


    In order to perform calculations, operators are used. JavaScript supports all
    the basic operators and the operator precedence is as follows:


    +   - Addition and subtraction have the same precedence.


    +   - Multiplication and division have the same precedence.'
