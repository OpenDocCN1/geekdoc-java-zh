  md: '# CHAPTER 3: BASICS OF JAVASCRIPT


    Interaction is an important facet of any website. In order to connect with the
    audience in a better way, it is vital to add behaviour to the website. This can
    be as simple as buttons or as complex as animations. These tasks can be added
    using JavaScript, which is a web and programming language. This chapter introduces
    JavaScript and shall help you get started with JavaScript on an immediate basis.


    # Background


    JavaScript is the preferred programming language for client side scripting. Contrary
    to popular belief, JavaScript is in no way related to Java. In fact, it finds
    resemblance to ECMAScript. Besides this, the only common thing between this programming
    language and other programming languages like C and C++ is that it uses curly
    braces. The international standard for JavaScript is given in ISO/IEC 16262 and
    ECMA-262 specification.


    One of the most important features of this programming language is that it is
    untyped. In other words, specifying the type of a variable is not necessary for
    using it. For example, if you have assigned a string to a variable, you can later
    assign an integer to the same variable. Variables are declared using the keyword
    var.


    # Data and Expressions


    Any program accesses, manipulates and represents data to the user. Data is available
    in different types and forms. This data can be easily decomposed into values.
    In JavaScript, data may be represented as a primitive value, object or function.


    The data representation at the lowest level is known as primitive type and includes'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'null, undefined, number, string and Boolean.


    Several built-in objects are defined in JavaScript. These entail the Object object,
    global object, Array object, Function object, Boolean object, String object, Math
    object, Number object, the RegExp object, Date object, Error object and JSON object.


    Any object that is callable is called a function. It may also be referred to as
    a method if the function is associated with an object.


    Data is produced by using expressions, which is a name given to any code that
    generates a value. It may be assigned a value directly or the value may be computed
    by substituting and computing an expression composed of operands and operators.
    It is important to note that an operand can be another expression as well.


    # Number Data Type


    The number data type is a primitive data type and it is internally stored as a
    floating point number, which is a 64 bit, double precision number. This 64 bit
    field stores the sign, exponent and fraction. While the leftmost bit is reserved
    for sign, the bits 0 to 51 are reserved for storing the fraction and bits 52-62
    are reserved for the exponent.


    Because of memory limitation on the system, 253 is the highest integer that can
    be stored. It is important to note that integer calculations generate a precise
    value. However, fractional data calculation may give imprecise results. Therefore,
    these values have to be truncated.


    In addition to numbers and strings, JavaScript also supports the use of the following
    special characters.


    +   - undefined specifies that the value has not been assigned yet.

    - NaN stands for ''Not a Number''

    - -Infinity any number that is less than -1.7976931348623157E + 10308 is'
  merge: -1
