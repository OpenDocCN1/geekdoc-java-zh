  md: '# CHAPTER 10: MANAGING LOCAL DATA WITH THE HELP OF WEB STORAGE


    Most of the topics discussed in the previous section focused on improving the
    performance of the websites and the services that it provides its customers. Therefore,
    handling information or data has been restricted to the data that is transferred
    between the client and server. In such a case, the server needs to wait for the
    complete round trip to occur. This involves cost overheads.


    In order to address this issue, most modern day browsers have started supporting
    web or DOM storage, which allows storage of some data at the client level. This
    chapter provides an overview of storage mechanisms used and how they can be used
    to improve the performance of the system in this regard.


    # Introduction to Web Storage


    In most web application, a server side storage solution like SQL Database Server
    is implemented. This may be an attempt to kill a mosquito with a sword. You don''t
    need such a huge solution as storing small bits of information at the browser
    level could have solved your purpose.


    Http cookies have been the most preferred and commonly used form of data storage
    at the browser level. In fact, it is used by most browsers for storing user information.
    The cookie value can be set in the following manner:


    ```

    function setCookieValue(cName, cValue, daysToExpire) {

    ```


