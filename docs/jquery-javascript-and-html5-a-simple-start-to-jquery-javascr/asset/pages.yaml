    +   - Blue - Unvisited link

    - Purple - Visited link

    - Red - Active link


    The first attribute of the <a> element is href, which is given the value of the
    URL.


    Syntax for external links:


    ```

    <a href="address">Text</a>

    ```


    Syntax for internal links:


    ```

    <a href="#id">Text</a>

    ```


    The id here is the id of the tag to which you want the link to jump onto. However,
    if you use only the # value, the link jumps to the top of the page.


    The other attribute used with the <a> element is target, which allows you to control
