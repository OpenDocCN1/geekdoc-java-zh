  md: '# CHAPTER 7: FORMS


    In the previous chapters, you have already studied how HTML documents can be created
    and manipulated. Taking a lead from them, we can now move on to to understanding
    forms, which is one of the most crucial and commonly used units of content in
    webpage development.


    Simply, a form is a way in which data is collected and sent to a location where
    it can be processed, which is a server in most cases. However, since we are yet
    to discuss server scripting, we will focus on sending the data to an email address.
    However, it is important to note that we do not recommend this practice and it
    is used only for understanding purposes.


    # Web Communications


    Before moving to the working of forms, it is important to know some basics of
    HTTP. A typical web communication consists of the following activities:


    +   1. When a user browses a webpage, a request for access to a web server resource
    is initiated by sending a GET HTTP request.

    2. The request is processed by the server and sends a response to the browser
    using HTTP protocol.

    3. The browser process the server response and presents it to the user in the
    form of a ‘form’.

    4. The user enters inputs to the form and upon hitting the submit or enter button,
    data is sent to the server, using HTTP protocol again.

    5. This data is again processed by the server and the server posts its response
    to the browser, which is displayed on the webpage.'
  merge: -1
