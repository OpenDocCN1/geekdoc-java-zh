  md: 'Sandboxing is used for avoiding the introduction of pop-ups or any other malware
    in your HTML document. In order to implement this, the attribute ‘sandbox’ is
    used. You can use this attribute in the following manner:


    ```

    <iframe sandbox="keywords" src="name">

    </iframe>

    ```


    When you use sandboxing, several restrictions are imposed on the called context.
    These restrictions include disabling forms, scripts, plugins and any frame other
    than its itself. You can force the system to override these restrictions using
    keywords like:


    +   - allow-same-origin

    - allow-scripts

    - allow-forms

    - allow-top-navigation


    Multiple keywords can be used by separating them using a space.


    # Seamless Embedding


    The seamless attribute can be used in the <iframe> element for embedding of content
    in a manner than this content appears to be part of the main content. This attribute
    can be used in the following manner:


    ```

    <iframe seamless="" src="name"></iframe>

    ```


    ```

    <iframe seamless src="name"></iframe>

    ```


    ```

    <iframe seamless="seamless" src="name"></iframe>

    ```


    This attribute may not be supported by many browsers. Therefore, you can use CSS
    to achieve a similar effect.


    # Hyperlinks'
