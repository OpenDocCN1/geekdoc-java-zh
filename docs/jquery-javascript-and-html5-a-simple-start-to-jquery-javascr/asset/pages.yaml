- img_proc: true
  md: 'available for us.


    +   - IndexedDB


    This is a NoSQL database that is seen as a good alternative to its relational
    counterpart. It is considered to be a good option for complex database requirements.


    +   - Filesystem API


    This is the preferred form of data storage the data is of larger data types like
    images, audios and videos.


    In all of the above mentioned types of data storage, the data is tied to the URL.
    Therefore, this data cannot be accessed by other websites. This is an important
    consideration when multiple websites are hosted on a shared domain.


    # Exploring localStorage


    LocalStorage is one of the two storage mechanisms used for data storage. It is
    basically a Storage Object, which is stored as a global variable. The biggest
    advantage of using this mechanism is that the API provided for reading and writing
    data is simple and easy to use.


    # How to Use localStorage Object Reference


    The attributes and methods available include:


    +   - setItem(key, value)


    It is a method that is used to set a value with the help of an associated key.
    The syntax for this operation is:


    ```

    localStorage.setItem(''fName'', (''#fName'').val());

    ```


    +   - getItem(key)


    It is a method that is used to get a value associated to the specified key. The
    syntax'
