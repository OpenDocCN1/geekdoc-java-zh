  md: 'Synchronization is the biggest challenge faced in the implementation of web
    storage. In order to deal with this issue, you can subscribe to storage events,
    which can notify you about any changes that may have been occurred. When you subscribe
    to a StorageEvent, you get access to the following properties:


    +   * newValue

    * oldValue

    * url

    * storageArea


    Unlike other events, cancelling or bubbling a StorageEvent is not allowed. You
    can subscribe to an event using the following construct:


    ```

    function respond (exc) {


    alert(exc.newValue);


    }

    ```


    window.addEventListener(''storage'', respond, false);

    This event can be triggered using the following operation:

    localStorage.setItem(''name'', Clark);


    You can also bind to these events with the help of jQuery.'
