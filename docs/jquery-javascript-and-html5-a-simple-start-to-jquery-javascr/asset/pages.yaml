    # HTML5 Storage


    Although, these tools offer some good, yet potentially improvable solutions, HTML5
    has come up with some innovative tools in their attempt to provide a comprehensive
    solution.


    +   - Web storage


    The simplest form of storing data over the web is web storage, in which key-value
    pairs are stored.


    +   - Web SQL database


    If the application requires a full relational database, then Web SQL database
    is also'
  merge: -1
