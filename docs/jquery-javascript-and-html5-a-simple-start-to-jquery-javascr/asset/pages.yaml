  md: 'You may need to run your application in web farm, in which case the incoming
    requests may be handled by many servers. Multiple server are used to perform load
    balancing and performance optimization. In this case, you can implement sticky
    servers, which ensures that a client is served by only one server. In other words,
    all the requests by one client are processed by the same server. This helps you
    to address issues that may arise due to open connections. These problems can also
    be handled using products like Microsoft App Fabric Caching Service and Redis.


    # How to Use WebSocket Libraries


    Dealing with all the issues mentioned above can be challenging. Therefore, the
    best way to deal with the situation is to use server and client libraries. There
    are several libraries like SignalR and Socket.IO are available for you to explore.'
