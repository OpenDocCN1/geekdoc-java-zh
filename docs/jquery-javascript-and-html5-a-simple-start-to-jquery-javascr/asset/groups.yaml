    have to be written as <div></div> even if they do not have any content.


    ## How to Add Expanda Attributes


    Any attribute that you as the author define is known as expanda attribute. You
    can give this custom attribute a name and assign a value to the same as and when
    required.


    ## How to Add Comments


    Comments can be added using a ! and two hyphens (-). The syntax for adding comments
    is as follows:


    ```

    <!--text -->

    ```


    You can also add conditional comments using the following syntax:


    ```

    <!--[if lte IE 7]><html class="no-js ie6" lang="en"><![endif]-->

    ```


    This comment determines if the browser being used is an earlier version released
    than IE7.


    ## How to Create HTML Document


    An HTML document can simply be described as a frame that contains metadata, content
    and a structure.


    The HTML document must start with the tag `<!DOCTYPE html>`. In HTML5, the declaration
    is an indication to the browser that it should work in no-quirks mode or HTML5
    compliant mode.


    The next tag should be `<html>`. This element includes within itself the elements
    `<head>` and `<body>`. The `<head>` element can contain the metadata for the HTML
    document, which is declared and defined using the `<meta>` tag. The `<head>` element
    also contains the `<title>` element, which serves the following purposes:


    - Used by search engines

    - - This content is displayed in the browser toolbar

    - Gives a default name to the page.


    The `<body>` element includes any other information that is to be displayed on
    the HTML document.


    A sample HTML document is given below:


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8" />

    <title>TITLE OF DOC</title>

    </head>

    <body>

    CONTENT

    </body>

    </html>

    ```


    Note: Special character ''›'' or ''<'', which are part of the HTML syntax, can
    be used on the HTML doc using their name or number. The syntax for their usage
    is:


    `&entity_name` or `&entity_number`


    The appendix contains the table of entity names and numbers to be used.


    - 1. White space created using tabs, line breaks and spaces is normalized by HTML
    into a single space. Therefore, if you want to use multiple spaces, you must use
    the non-breaking space character. For example, if you want to display 10 mph such
    that 10 and mph are not separated by a newline, you can write 10 &nbsp;mph.


    ## How to Embed Content


    Now that you know how to create HTML documents with your content, you may want
    to embed content into the document from other sources. This content may be text
    from another HTML document or flash applications.


    ## Inline Frames


    Inline frames are used to embed HTML documents inline with the content of the
    current HTML document. Therefore, in a way, this element creates nested browsers
    as multiple web page are loaded in the same window. These are implemented using
    the `<iframe>` element. Nested browsing contexts can be navigated using:


    - window.parent – This WindowProxy object represents the parent context.

    - window.top – This WindowProxy object represents the top-level browsing context

    - window.frameElement – This represents the browsing context container and if
    there is no context container, it returns null.


    The syntax of the `<iframe>` element is as follows:


    ```html

    <iframe src="name"></iframe>

    ```


    Here the name of the attribute defines the name of the browsing context. This
    name can be any string like ‘sample.html’. However, the strong should not start
    with an underscore as names starting with underscore are reserved for special
    key names like _blank.


    ## Sandboxing


    Sandboxing is used for avoiding the introduction of pop-ups or any other malware
    in your HTML document. In order to implement this, the attribute ‘sandbox’ is
    used. You can use this attribute in the following manner:


    ```html

    <iframe sandbox="keywords" src="name"></iframe>

    ```


    When you use sandboxing, several restrictions are imposed on the called context.
    These restrictions include disabling forms, scripts, plugins and any frame other
    than its itself. You can force the system to override these restrictions using
    keywords like:


    - allow-same-origin

    - allow-scripts

    - allow-forms

    - allow-top-navigation


    Multiple keywords can be used by separating them using a space.


    ## Seamless Embedding


    The seamless attribute can be used in the `<iframe>` element for embedding of
    content.


    ```html

    <iframe seamless src="name"></iframe>

    ```


    ```html

    <iframe seamless="" src="name"></iframe>

    ```


    ```html

    <iframe seamless="name"></iframe>

    ```


    ## Hyperlinks


    Hyperlinks can be used to link both external and internal locations. The `<a>`
    element is used for this.


    - Blue - Unvisited link

    - Purple - Visited link

    - Red - Active link


    The syntax for external links:


    ```html

    <a href="address">Text</a>

    ```


    The syntax for internal links:


    ```html

    <a href="#id">Text</a>

    ```


    The `target` attribute is used to specify where the link should be opened:


    - _blank

    - _parent

    - _self

    - _top

    - _frame


    Hyperlinks can also be used to send emails using the following syntax:


    ```html

    <a href="mailto:email address">Text</a>

    ```


    ## Embedding Images


    The `<img>` element is used for adding images to the HTML document. The `<img>`
    tag is a void element and does not require a closing tag. The required tag for
    this element is `src`, which specifies the absolute or relative address at which
    the image is stored. Another attribute than can be used with the `<img>` tag is
    `alt`, which specifies the text that must be displayed in case the image is not
    available.


    ```html

    <img src="address" target="alternative text">

    ```


    It is important to note that you only give references to images and they are not
    embedded into the HTML document. The allowed image formats are jpeg, png and gif.


    ## How to Create Image Map


    The `<map>` element can be used to create a clickable image map. In order to create
    a link between the map and image, you must set a name of the map and use this
    name in the `usemap` attribute of the `<img>` tag.


    The area of the map element is defined using `<area>` element. This is a self-closing
    tag that is used to define the area of the map. The area of the map can be set
    using the attributes `shape`, `href`, `alt` and `coords`.


    The `shape` attribute can give the values poly, circle, rect or default. The default
    value sets the area as the size of the image. The `href` and `alt` attributes
    are used in the same manner as they are used in the `<a>` element. Lastly, the
    `coords` attribute are defined according to the shape chosen in the following
    manner:


    - poly - x₁, y₁, x₂, y₂, ..., xₙ, yₙ

    - circle - x, y, radius

    - rect - x₁, y₁, x², y₂


    For the polygon, the starting and ending coordinates should be the same. In case
    a discrepancy in this regard exists, a closing value is added.


    Example:


    ```html

    <img src="worldmap.gif" width="145" height="126" alt="World Map" usemap="#country"
    />


    <map name="country">


    <area shape="circle" coords="105,50,30" href="China.html" alt="China" />


    <area shape="default" href="InvalidCountry.html" alt="Please Try Again" />

    ```

