    alert('None of the alphabets chosen\\n');\nbreak;\n}\n```\n\n`switch` 结构将用户输入的值与\
    \ `case` 中呈现的值进行匹配。如果找到匹配的值，则执行该 `case`。然而，在这种情况下，如果没有 `case` 值与输入的输入匹配，则执行 `default`\
    \ 分支。此外，你还可以在 `case` 值中使用条件，并执行条件成立的 `case`。\n\n如果你在 `case` 代码后没有使用 `break` 语句，则匹配\
    \ `case` 之后的所有 `case` 都将被执行。例如，如果用户在上述示例中输入‘b’，且在 case 代码后没有 `break` 语句，那么输出将是：\n\
    \nb chosen\nc chosen\nNone of the alphabets chosen\n\n此外，在 `default` 分支中使用 `break`\
    \ 语句也是一种良好的习惯。\n\n注意：\n\n如果你想确定一个关键字是否被赋值了值，可以使用以下代码：\n\n```\nif(c)\n{\n//code\n\
