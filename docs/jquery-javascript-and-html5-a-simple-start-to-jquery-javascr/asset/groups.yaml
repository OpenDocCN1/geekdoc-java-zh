    # Grouping Selectors


    Multiple selectors can be used for a style rule. These selectors must be separated
    by commas. Sample implementation:


    ```

    body, button {

    color: white;

    }

    ```


    # Using Adjacent Selectors


    If you want to style the first heading in a div or any similar adjacent elements,
    the selector is constructed using a plus sign (+) between the two selectors. Sample
    implementation:


    ```

    div ~ h1 {

    color: white;

    }

    ```


    # Sibling Selectors


    Sibling selectors are similar to adjacent selectors except for the fact that all
    the matching elements are styled against adjacent selectors, which only style
    the first matching element. The selector is constructed using a ~ sign between
    the two selectors. Sample implementation:


    ```

    div ~ h1 {

    color: white;

    }

    ```'
