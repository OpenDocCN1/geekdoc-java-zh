    # CHAPTER 4: BASICS OF CSS3


    Cascading Style Sheets or CSS provide the presentation that webpages are known
    for. Although, HTML is capable of providing a basic structure to the webpage,
    CSS offers developers host of design options. Besides this, it is fast and efficient,
    which makes it an all more popular design tool.


    CSS is known to have evolved from SGML (Standardized Generalized Markup Language).
    The goal of efforts made in this direction was to standardize the manner in which
    web pages looked. The latest version of this technology is CSS3, which is a collection
    of 50 modules.


    The most powerful characteristic of CSS is its cascading ability. Simply, it allows
    a webpage to take its styles from multiple sheets in such a manner that changes
    to the style in subsequently read sheets overwrite the style already implemented
    from one or more of the previous sheets.


    # How to Define and Apply Style


    The definition and application of a style involves two facets or parts, selector
    and declaration. While the selector determines the area of the webpage that needs
    to be styled, the declaration block describes the style specifications that have
    to be implemented. In order to illustrate how it works, let us consider the following
    example:


    ```css

    body {

    color: white;

    }

    ```


    In this example, the selector selects the body of the webpage and the declaration
    block defines that the font color should be changed to white. This is a simple
    example and declarations and selectors can be much more complex than this.


    # How to Add Comments


    Comments can be added to the style sheet using the following format:


    ```css

    /*write the comment here*/

    ```


    # How to Create an Inline Style


    Every element has an associated global attribute, style. This global attribute
    can be manipulated within the tag for element to modify the appearance of that
    element. This type of styling does not require you to specify the selector. Only
    the declaration block is required. An example of how this is done is given:


    ```html

    <body style=''color: white;''>


    </body>

    ```


    This HTML tag performs the same functionality as the CSS code specified in the
    previous section. The advantage of using this approach is that the style information
    given in this manner overwrites any other styling information. Therefore, if you
    need to use different style for one element while the rest of the document needs
    to follow a different style, you can use a stylesheet for the document and specify
    the style for this element in its tag.


    # How to Use Embedded Style


    Another approach for accomplishing the same outcome as inline styles is to use
    the <style> element within the element concerned, for defining its style specification.
    Here is how this can be done:


    ```html

    <!DOCTYPE html>

    <html xmlns=''http://www.w3.org/1999/xhtml''>

    <head>

    <title></title>


    <style>

    body {

    color: white;

    }

    </style>

    </head>

    <body>

    </body>

    </html>

    ```


    # How to Create External Style Sheet


    For usages where you wish to use the same style for the complete webpage or a
    number of webpages, the best approach is to use an external style sheet.


    This external style sheet can be linked to the HTML page in the following manner:


    ```html

    <!DOCTYPE html>

    <html xmlns=''http://www.w3.org/1999/xhtml''>

    <head>

    <title></title>

    <link rel=''stylesheet'' type=''text/css'' href=''style.css''>

    </head>

    <body>

    </body>

    </html>

    ```


    # Specificity and Cascading


    Now that you know how to apply styles to specific elements, let us move on to
    implementing styles to more specific sections like the first line of the paragraph.
    In order to style elements that cannot be classified on the basis of name, content
    or is not a part of the DOM tree can be styled using pseudo-classes. The available
    pseudo-classes include:


    - :visited

    - :link

    - :hover

    - :active

    - :focus

    - :nth-last-child(n)

    - :not

    - :only-child

    - :nth-child(formula)

    - :lang(language)

    - :first-of-type

    - :only-of-type


    If you want to access information of the DOM tree that is not accessible otherwise,
    you can use pseudo-elements. Pseudo-elements include:


    - ::first-letter

    - ::first-line

    - ::after

    - ::before

