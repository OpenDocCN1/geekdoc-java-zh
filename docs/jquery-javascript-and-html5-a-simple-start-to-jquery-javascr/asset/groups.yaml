    This chapter discusses Websql and IndexedDB, which are relational constructs for
    data storage. However, they cannot be used for storing files. Therefore, FileSystem
    API is used for this purpose. The chapter ends with a discussion on how you can
    make your website offline-friendly using HTTP Cache.


    # Web SQL


    Web SQL is a relational database and its most recent implementations are created
    on SQLLite. However, it is important to mention that this database constrict is
    no longer supported by W3C yet it is still supported by many browsers.


