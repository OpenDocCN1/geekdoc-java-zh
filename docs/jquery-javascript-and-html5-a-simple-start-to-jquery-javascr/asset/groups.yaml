    \ the element using the indexer. For example, arrName[1] = ‘Danny’; assigns the\
    \ value ‘Danny’ to the second element of the array.\n\n# DOM objects\n\nThe primary\
    \ objects that you need to access while building an application, are the DOM objects\
    \ associated with it. This access is necessary for you to control and get notified\
    \ events that are occurring on the webpage.\n\nThe DOM is a representation of\
