    # CHAPTER 1: INTRODUCTION


    If there is one application development framework that can be termed as comprehensive,
    then HTML5 wins the bid hands down. Although, the specification for HTML5 is not
    yet complete, most modern web browsers support the popular features on device,
    which range from a Smartphone to a desktop. What that means is that you just have
    to write one application and it will run on your devices without any interoperability
    issues.


    There is no doubt about the fact that HTML5 is the future of web application development
    and if you wish to remain in the league, you need to think futuristically and
    equip yourself to deal the technological challenges that the future is about to
    throw at you. The scope of HTML5 is evident from the fact that most of the major
    players of the industry are setting their eyes on this technology and giving in
    full support to the same.


    If the multi-faceted functionality and high-on features of HTML5 intrigue you
    and you want to start writing your own applications right away, but you do not
    know how and where to begin, then this book is just for you. This book covers
    everything that you shall require to create working applications with the help
    of HTML, JavaScript/JQuery and CSS. However, it is not a reference guide. We hope
    to give you practical knowledge so that you can get to development as quickly
    as possible.


    This book is a perfect start-up guide and covers all the basic facets of HTML5,
    JavaScript and CSS development. It covers everything from the very basics to all
    that you shall require in your trust with this framework. The first three chapters
    introduce you to these three technologies, giving you some ground to start with.


    # CHAPTER 2: BASICS OF HTML5


    HTML (Hyper Text Markup Language) is a language used for creating web pages. In
    fact, this language has been in use since the first webpage was made. However,
    the functionality has evolved as newer and better versions of the language were
    introduced. The language is known to have originated from SGML (Standard Generalized
    Markup Language), which was earlier used for document publishing. HTML has inherited
    the concept of formatting features and their syntax from SGML.


    One of the most interesting and beneficial facets of HTML usage, as far as browsers
    are concerned, is that browsers support both backward as well as forward compatibility.
    While backward compatibility is usually easy to achieve, forward compatibility
    is tricky as the problem domain, in this case, is infinitely large. However, in
    order to implement this, browsers were designed to ignore tags that it did not
    recognize.


    For years, HTML remained all that was wanted. However, with time, people felt
    the need for more, which was catalyzed by the presence of another technology called
    XML (eXtensible Markup Language). Although, XML shares a lot of similarities with
    HTML, there exist many fundamental differences between the two. Firstly, XML requires
    tag matching in the sense that for every starting tag, a closing tag must inevitably
    exist. Besides this, XML allows you to create your own tags as it does not possess
    a fixed set of tags like HTML.


    The tags used in XML are meta-tags or tags that describe the data that is included
    between the starting and closing tag. In order to ensure the validity of the XML
    document, a technology called XSD (XML Schema Definition) is used. However, this
    technology cannot be used for validating HTML documents because HTML documents
    lack a well-defined structure.


    The W3C (World Wide Web Consortium) introduced XHTML as an attempt to fix the
    flaws of HTML. According to the XHTML specification, HTML documents were to follow
    stricter rules.


    # Semantic Markup


    The fundamental feature of HTML5 is that it provides meaning to the content. Instead
    of just using divs for layout, HTML5 introduces semantic tags like <header>, <footer>,
    <section>, <article>, and <nav>. This helps browsers and search engines understand
    the structure and purpose of the web content.


    # HTML5 Elements


    In HTML, an element is simply a beginning tag, content, and a closing tag. Therefore,
    when you write:


    ```html

    <div>

    ```


    ```html

    <b>This is my world!</b>

    ```


    ```

    </div>

    ```


    In this example, the div contains bold text. It is important to state that HTML5
    is not case sensitive. Therefore, regardless of whether you write <B> or <b>,
    the browser will consider them same. However, the use of lowercase for tags is
    recommended by W3C standards.


    # Working with Elements


    HTML5 defines more than 100 elements. These elements, with their definitions are
    provided in Appendix.


    # How to add attributes to elements?


    Additional data can be added to the beginning tag in the form of attributes. An
    attribute can be generally represented as name="value". The value for the attribute
    is enclosed within quotes. There is no restriction on the number of attributes
    that can be added to an element. Example:


    ```html

    <div id="main" class="mainContent"></div>

    ```


    Here, id and class are attributes where id uniquely identifies the element and
    class specifies the CSS style to which this div belongs.


    # Boolean Attributes


    Several types of attributes can be used. One of the most commonly used types is
    Boolean attribute. The Boolean attribute can take a value from the allowable set
    of values. Some possible values include:


    - Checked

    - Disabled

    - Selected

    - Readonly


    There are two ways to indicate the value of a Boolean attribute.


    ```html

    <input type="checkbox" name="vegetable" value="Broccoli" checked>

    <input type="checkbox" name="vegetable" value="Broccoli" checked="checked">

    ```


    In the first case, the value is not given and is assumed. Although, the latter
    seems like a redundant form, it is the more preferred form, particularly if you
    are using jQuery.


    # Global Attribute Reference


    There is a set of named attributes available in HTML5, which can be used with
    any element. Examples of these attributes include accesskey, spellcheck and draggable,
    in addition to several others.


    # Void Elements


    Some elements do not have to contain content under any circumstance. These elements
    include <link>, <br> and <img>, in addition to many others.


    # Self-closing Tags


    If you are using an element that does not contain any content, then you can use
    a self closing tag. An example of this tag is <br/>.

