    # 第 1 章：引言


    如果有一个应用开发框架可以被称为全面的，那么 HTML5 毫无疑问地胜出了。尽管 HTML5 的规范尚未完善，但大多数现代网络浏览器都支持在设备上运行这些流行功能，设备范围从智能手机到桌面电脑。这意味着你只需要编写一个应用程序，它就可以在你的设备上运行而不会出现任何互操作性问题。


    无疑，HTML5 是 Web 应用开发的未来，如果你想留在这一行列中，你就需要具有前瞻性思维，并装备自己以应对未来即将向你提出的技术挑战。HTML5 的范围显而易见，因为行业的大多数主要参与者都在关注这项技术并给予了全力支持。


    如果 HTML5 的多功能性和高阶特性吸引了你，并且你想立即开始编写自己的应用程序，但又不知道如何开始以及从何处开始，那么这本书就是为你为你准备的。这本书涵盖了你借助
    HTML、JavaScript/JQuery 和 CSS 创建运行良好的应用程序的所有内容。然而，它并不是一本参考指南。我们希望为你提供实用的知识，以便你尽早开始开发。


    这本书是一份完美的入门指南，涵盖了 HTML5、JavaScript 和 CSS 开发的所有基本方面。它涵盖了从最基础的到你信任该框架时所需的一切内容。前三章向你介绍了这三种技术，为你提供了一个起点基础。


    # 第 2 章：HTML5 基础


    HTML（超文本标记语言）是一种用于创建网页的语言。事实上，自从第一个网页创建以来，这种语言一直被使用。然而，随着更新、更好版本的引入，其功能也在不断进化。已知该语言起源于
    SGML（标准通用标记语言），SGML 早期被用于文档出版。HTML 从 SGML 那处继承了格式功能概念及其语法。


    对于浏览器而言，HTML 使用的最有趣且最有益的方面之一是，浏览器同时支持向后兼容和向前兼容。虽然向后兼容通常很容易实现，但向前兼容却很棘手，因为在在这种情况下，其问题领域是无限大的。然而，为了实现这一点，浏览器被设计为忽略它们不识别的标签。


    多年来，HTML 一一直是人们的全部。但随着时间的推移，人们觉得需要更多，这是由于另一种被称为 XML（可扩展标记语言）的技术出现而催化的。尽管 XML 与
    HTML 有许多相似之处，但两者之间存在许多根本性的区别。首先，XML 要求标签匹配，这意味着对于每一个起始标签，必须存在一个闭合标签。此外，XML 允许你创建自己的标签，因为它不像
    HTML 那样拥有一固定的标签集。


    XML 中使用的标签是元标签，或描述位于起始标签和闭合标签之间数据的标签。为了确保 XML 文档的有效性，使用名为 XSD（XML 架构定义）的技术。然而，这项技术无法用于验证
    HTML 文档，因为 HTML 文档缺乏定义良好的结构。


    W3C（世界网联盟）引入了 XHTML 来尝试修复 HTML 的缺陷。根据 XHTML 规范，HTML 文档应遵循更严格的规则。


    # 语义化标记


    HTML5 的基本特性是它为内容提供了意义。HTML5 不仅仅使用 div 进行布局，还引入了语义化标签，如 `<header>`、`<footer>``<section>`、`<article>`
    和 `<nav>`。这有助于浏览器和搜索引擎理解网页内容的结构和目的。


    # HTML5 元素


    在 HTML 中，一个元素简单来说就是起始标签、内容和一个闭合标签。因此，当你写时：


    ```html

    <div>

    ```


    ```html

    <b>This is my world!</b>

    ```


    ```

    </>

    ```


    在这个示例中，div 包含了粗体文本。需要说明的是，HTML5 不区分大小写的。因此，无论你写 `<B>` 还是 `<b>`，浏览器都会认为它们是相同的。然而，W3C
    建议使用小写标签。


    # 元素操作


    HTML5 定义了超过 100 个元素。这些元素的定义在附录中提供。


    # 如何为元素添加属性？


    额外数据可以以属性的形式添加到起始标签中。属性通常表示为 `name="value"`。属性的值包含在引号内。对于向元素添加的属性数量没有限制。例如：


    ```html

    <div id="main" class="mainContent"></>

    ```


    在这里，id 和 class 是属性，其中 id 唯一标识元素，class 指定该 div 所属的 CSS 样式。


    # 布尔属性


    可以使用多种类型的属性。最常用的类型之一是布尔属性。布尔属性可以从允许的值集中取值。一些可能的值包括：


    - Checked

    - Disabled

    - Selected

    - Readonly


    有两种方式来指示布尔属性的值。


    ```html

    <input type="checkbox" name="vegetable" value="Broccoli" checked>

    <input type="checkbox" name="vegetable" value="Broccoli" checked="checked">

    ```


    在第一种情况下没有给出值并是假设的。尽管后者看起来是冗余的形式，但它是更优的形式，特别是当你使用 jQuery 时。


    # 全局属性引用


    HTML5 提供了一组命名属性，可以与任何元素一起。这些属性的示例包括 accesskey、spellcheck 和 draggable，以及其他几个。


    # 空元素


    某些元素在任何情况下都不包含内容。这些元素包括 `<link>`、`<br>` 和 `<img>`，以及许多其他。


    # 自闭合标签


    如果你使用一个不包含任何内容的元素，那么可以使用自闭合标签。这种标签的示例是 `<br/>`。


