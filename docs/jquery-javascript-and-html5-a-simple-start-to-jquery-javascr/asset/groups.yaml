    \ `break` 语句。\n2. 如果你不指定条件，或者指定了一个始终为真的条件，循环将无限运行。\n\n# 错误处理\n\n异常预计会在你代码的几处发生。因此，最好实现一种可以帮助你处理这些异常并避免崩溃的机制。\n\
    \n异常可以被描述为非法操作或任何意外且不寻的情况。异常的示例包括未经授权的内存访问。\n\n你可以通过在执行任何操作之前验证变量的值，在自己的层面进行异常处理。例如，在执行除法之前，建议检查分母的值是否为零。任何涉及除以零的操作都会抛出除以零异常。\n\
