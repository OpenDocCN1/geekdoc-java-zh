    - shift\n\n移除并返回第一个值。如果数组为空，则返回 undefined。\n\n- slice\n\n此方法需要两个参数：起始索引和结束索引。将创建一个新数组，其元素与位于索引（起始索引）和（结束索引\
    \ – 1）处的元素元素相同。\n\n- sort\n\n此方法对元素进行排序并修改原始数组。\n\n- splice\n\n此方法在指定的数组中删除并添加元素。该方法接受的参数为：起始索引（系统应从此处开始删除元素的索引）、要删除和添加的元素数量。如果传递的元素数量为\
    \ 0，则不删除任何元素。相反，如果该值大于数组的大小，则从起始索引到数组结束的所有元素都将被删除。\n\n- toString\n\n此方法会创建一个字符串，它是数组中所有元素用逗号分隔的连接字符串。\n\
    \n- unshift\n\n此方法在数组的第一个位置添加一个元素，并返回修改后的长度值。\n\n- valueOf\n\n此方法返回一个字符串，它是包含数组中所有值的逗号分隔连接字符串。\n\
    \n注意：\n\n+ 1. 在处理函数时，你可以传递整个数组（使用数组名）或数组的特定元素（使用数组名[索引]）。\n\n+ 2. 可以通过索引访问元素来修改数组元素。例如，arrName[1]\
    \ = ‘Danny’；将值 ‘Danny’ 分配给数组的第二个元素。\n\n# DOM 对象\n\n在构建应用程序时，你需要访问的主要对象是与它关联的 DOM\
    \ 对象。这种访问对于你控制并获取网页上发生的事件通知是必要的。\n\nDOM 是对象层次结构的表示。可以使用内置的 document 变量访问这些对象。该变量引用\
    \ DOM 并执行搜索，可能会返回一个活跃的（active）或静态的（static）NodeList。活跃 NodeList 包含一个不断变化的元素列表，而静态\
    \ NodeList 包含不随时间变化的元素。由于获取静态 NodeList 耗时较长，建议选择适用于活跃 NodeList 的搜索方法。\n\nDOM 可用的搜索方法包括：\n\
    \n- getElementById\n\n此方法返回具有指定 ID 的第一个元素的引用。\n\n- getElementsByTagName\n\n此方法返回具有指定标签名称的活跃\
    \ NodeList。\n\n- getElementsByName\n\n此方法返回具有指定名称的活跃 NodeList。这是单选项按钮（option）的首选方法。\n\
    \n- getElementsByClassName\n\n此方法返回具有指定类名的活跃 NodeList。然而，此方法不支持 Internet Explorer\
    \ 8 及更早版本。\n\n- querySelector\n\n此方法接受 CSS 选择器作为参数并返回第一个匹配元素。然而，此方法不支持 Internet\
    \ Explorer 7 及更早版本。\n\n- querySelectorAll\n\n此方法接受 CSS 选择器作为参数并返回所有匹配元素。因此，它返回一个静态\
    \ NodeList。然而，此方法不支持 Internet Explorer 7 及更早版本。\n\n# 事件\n\n如果你将 JavaScript 比作引擎，那么事件就是提供所需的火花。事件发生在两种情况下。第一类事件是在用户交互期间发生的事件。用户可能会点击图像或输入文本。所有这些都被归为事件。此外，系统状态的变化也被视为事件。例如，如果视频开始或停止，就说发生了一个事件。DOM\
    \ 允许你捕获事件并执行相应的代码。\n\n在 JavaScript 中，事件基于发布-订阅机制。在创建对象时，开发者可以发布与该对象相关的事件。此外，每当使用该对象时，都可以向其添加事件处理器。事件处理器会通知订阅的事件事件已触发。此通知包含了有关事件的信息，如鼠标位置和按键按下，以及其他与事件相关的多个细节。\n\
    \n捕获事件：\n\n可能会出现某些情况，事件绑定到按钮点击，而该点击可能位于超链接内部。在这种情况下，元素存在嵌套。因此，当事件触发时，它沿着 DOM 层次结构向下传递。这个过程被称为事件捕获。然而，一旦事件到达元素，该事件就会沿着层次结构向上冒泡。这个过程被称为事件冒泡。事件跨越层次结构的移动为开发者提供了根据需要订阅或取消传播的机会。\n\
    \n订阅事件：\n\n可以使用函数 `addEventListener` 进行订阅过程。该函数需要三个参数：事件、为该事件需要调用的函数，以及一个决定函数是否在捕获或冒泡过程中调用的布尔值（true\
    \ – 捕获，false – 冒泡）。大多数情况下，此值被设置为 false。正如 W3C 标准提到的，这是订阅的首选方法。\n\n示例代码：\n\n```\n\
    var btn = document.getElementById('btnDownload');\nbtn.addEventListener('click',\
    \ initiateDownload, false);\n```\n\n然而，也存在其他方法，包括为 html 标签提供在线订阅。这会将事件订阅到冒泡过程中。使用这种方法的优点是它是最老且最受接受的方法，无论你使用哪种浏览器。请查看下方标签以了解如何实现。\n\
    \n```html\n<button id='btnDownload' onclick='initiateDownload();'>Download</button>\n\
    ```\n\n你也可以使用使用 JavaScript 订阅事件的传统订阅过程。\n\n```javascript\nvar btn = document.getElementById('btnDownload');\n\
    btn.onclick = initiateDownload;\n```\n\n取消订阅：\n\n可以使用函数 `removeEventListener`\
    \ 取消订阅，它接受与 `addEventListener` 相同的参数set。对于上一个示例中使用的 btn 变量，可以通过方式实现：\n\n```javascript\n\
    var btn = document.getElementById('btnDownload');\nbtn.removeEventListener('click',\
    \ initiateDownload, false);\n```\n\n如何取消传播？\n\n使用函数 `stopPropagation` 来执行此操作。可以通过以下方式实现：\n\
    \n```javascript\nvar btn = document.getElementById('btnDownload');\nbtn.addEventListener('click',\
    \ initiateDownload, false);\n\nfunction initiateDownload(e) {\n  //download\n\
    \  e.stopPropagation();\n}\n```\n\n如何阻止默认操作？\n\n可以通过以下方式使用函数 `preventDefault`\
    \ 实现：\n\n```javascript\nvar hyperlink = document.getElementById('linkSave');\n\
    hyper.addEventListener('click', saveData, false);\n\nfunction saveData(e) {\n\
    \  //save data\n  e.preventDefault();\n}\n```\n\nJavaScript 还提供了 *this* 关键字，如果你希望频繁访问触发事件的元素，可以使用它。\n\
    \n# 窗口事件\n\n当前浏览器窗口由 window 变量表示，它是 Window 对象的实例。以下事件与该对象关联：\n\n- afterprint\n\
    - beforeonload\n- beforeprint\n- error\n- blur\n- haschange\n- load\n- message\n\
    - focus\n- online\n- offline\n- pageshow\n- pagehide\n- redo\n- popstate\n- storage\n\
    - resize\n- unload\n- undo\n\n# 表单事件\n\n在 HTML 表单内部发生的的动作会触发以下事件：\n\n- change\n\
    - blur\n- focus\n- contextmenu\n- forminput\n- formchange\n\n"
