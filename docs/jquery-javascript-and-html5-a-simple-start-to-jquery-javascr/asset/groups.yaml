    I.


    # Unordered Lists


    This type of a list is declared using the <ul> element and there is no numbering
    of elements in this case. The elements of the lists are simply represented as
    bullet points.


    # Description Lists


    This type of a list is declared using the <dl> element. Using this element, you
    can give a description containing zero or more terms. Besides this, the elements
    of the list are declared using the <dt> element, which specifies the term, and
    <dd>, which gives a description of the term.


    # Custom Lists


    The developer can make use of CSS styles to create custom lists. In this case,
    a different style rule can be created for each level of a nested list.


    # Working with Tables


    Another format for arranging and presenting data in webpages is tables. Tables
    are declared using the <table> element and represents data in a rows-columns format.
    The cells of the tables are defined using the <tr> and <td> elements. While <tr>
    is used for rows, <td> is used for columns.


    Despite that fact HTML5 tables are one of the most powerful constructs available
    to the developer, it is important to understand how and where tables can be most
    appropriately used. Here are the reasons why tables should not be used:


    +   - The table created for a web page is not rendered until the </table> tag
    is read. On the other hand, if the same construct is created using the <div> element,
    the content will be rendered as it is.'
