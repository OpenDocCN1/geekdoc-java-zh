- md: "\nFor example,\n\n```\n'Red' != 'Blue' && 5 > 1 = 'true'\n```\n\n```\n'Red'\
    \ != 'Blue' && 5 < 1 = 'false'\n```\n\n```\n'Red' == 'Blue' && 5 < 1 = 'false'\n\
    ```\n\nFor conditional operators, JavaScript uses short-circuit evaluation. In\
    \ other words, if the value of the first condition is computed to be 'false',\
    \ the system does not evaluate the other condition and directly presents the result.\n\
    \n## Writing Code in JavaScript\n\nAny statement followed by a semicolon is referred\
    \ to as a statement. This statement may or not produce a value unlike expressions,\
    \ which must inadvertently produce a value.\n\n## Variables\n\nManipulation of\
    \ data is performed with the help of variables. Data is stored in the memory and\
    \ a named reference to this memory location is called a variable. Any identifier\
    \ is declared as a variable by preceding it with a keyword *var*. A sample declaration\
    \ of a variable is:\n\n```\nvar result;\n```\n\nThis statement declares a variable\
    \ *result*. You may also define the variable as you declare it using a statement\
    \ like this:\n\n```\nvar result = 0;\n```\n\nor\n\n```\nvar result = 23*4+6;\n\
    ```\n\nCertain rules have to be followed while naming variables. These rules are\
    \ as follows:\n\n- A variable name can be a combination of numbers and characters.\n\
    - A variable name cannot start with a number.\n- The only special characters allowed\
    \ in variable names is underscore (_) and dollar sign($).\n- There should not\
    \ be any whitespace in the variable name. For example, 'result value' is not allowed.\n\
    - JavaScript keywords are reserved and cannot be used.\n\nPlease note that JavaScript,\
    \ unlike HTML is case sensitve. Therefore VAL and val are two different variables.\
    \ Also, it is recommended that the variable name should be such that it describes\
    \ the purpose for which it is being used. For example, if we name a variable result,\
    \ it is evident that this variable will contain the result value computed by the\
    \ code.\n\nAnother convention used in JavaScript is to name variables such that\
    \ the first letter of the variable name is lowercase. However, every subsequent\
    \ word in name starts with a capital letter. An example of this is the variable\
    \ name, arrayResult. Besides, the use of underscore and dollar sign is discouraged.\
    \ However, they are used in jQuery objects.\n\n## Environment\n\nA complete set\
    \ of variables and the values they contain form what is called the environment.\
    \ Therefore, whenever you load a new webpage in the browser, you are creating\
    \ a new environment. If you take the example of Windows 8, it creates an environment\
    \ when an application starts and the same is destroyed when the ends.\n\n## Functions\n\
    \nA set of statements that solve a purpose are referred to as a function. The\
    \ purpose of using functions is code reuse. If your program uses functionality\
    \ multiple times in the program, then it is implemented as a function, which can\
    \ be called as and when required. Since, a function is to be called from within\
    \ the code, parameters can be sent to the function from the code. Upon execution,\
    \ the function returns a value to the calling function. The syntax for function\
    \ declaration and definition is as follows:\n\n```\nfunction multiply(a, b){\n\
    \nreturn a*b;\n}\n```\n\nThe name of the function must must always be preceded\
    \ with the keyword function. The variables a and b are parameters passed into\
    \ the function and the function return the value obtained by computing a*b. This\
    \ is a simple function, but you can implement complex and large function depending\
    \ upon the functionality desired.\n\nNow that you have implemented the function,\
    \ you must be wondering as to how the function is called. Here is an example:\n\
    \n```\nvar x=2;\n\nvar y=5\n\nvar c=multiply(x, y);\n```\n\nHere, x and y are\
    \ arguments that the function multiply will receive parameters.\n\nJavaScript\
    \ is a loosely typed language. What that means is if you pass more arguments to\
    \ a function than it is expecting, the system simply uses the first n arguments\
    \ required and discards the rest. The advantage of this functionality is that\
    \ you can use already implemented functions and pass the extra argument to scale\
    \ the function and add functionality to it. On the other hand, you will not be\
    \ able to get any indication of error if you unintentionally pass the wrong number\
    \ of arguments.\n\nJavaScript also provides some built-in functions for interacting\
    \ with the user. These functions are as follows:\n\n- alert\n\nThis function raises\
    \ an alert with a message and the system resumes operation after the user clicks\
    \ on the OK button. Sample implementation:\n\n```\nalert('Alert');\n```\n\n- prompt\n\
    \nThis function displays a dialog box with a message and a text field for user\
    \ input. Sample implementation:\n\n```\nvar result = prompt('Enter some text:');\n\
