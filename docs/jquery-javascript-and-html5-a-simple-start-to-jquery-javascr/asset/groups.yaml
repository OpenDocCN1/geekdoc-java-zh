    # Web Servers


    Originally, web servers were designed to receive and process requests and send
    the results back to the browser using HTTP. Initially, when the web pages were
    simple, such web servers were able to process a good number of requests per unit
    time. There were no states involved as sending and receiving requests were as
    simple as opening a connection, transferring data and closing the connection.


    The new age web servers are much more equipped that these simple web servers.
    The web servers of today implement what is called the ‘keep alive’ features, which
    ensures that the connection remains open for a definite period of time in which
    subsequent requests by the same browser to the server can be entertained.


    # Web Browsers


    The web browser is a desktop application, which displays web pages and manages
    user interactions between the webpages and the server. The communication between
    the web servers and pages is established using technologies like AJAX and Asynchronous
    JavaScript.


