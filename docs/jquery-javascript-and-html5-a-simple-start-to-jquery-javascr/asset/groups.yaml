    \ standard.\n\nSample Code:\n\n```\nvar btn = document.getElementById('btnDownload');\n\
    btn.addEventListener('click', initiateDownload, false);\n```\n\nHowever, other\
    \ methods also exist, which include giving an online subscription to the html\
    \ tag. This subscribes the event to the bubble process. The advantage of using\
    \ this method is that it is the oldest and most accepted method, regardless of\
    \ which browser you are using. Please see the tag below to understand how this\
    \ can be done.\n\n```html\n<button id='btnDownload' onclick='initiateDownload();'>Download</button>\n\
    ```\n\nYou can also use the traditional subscription process that uses JavaScript\
    \ for subscribing the event.\n\n```javascript\nvar btn = document.getElementById('btnDownload');\n\
    btn.onclick = initiateDownload;\n```\n\nUnsubscribing:\n\nEvents can be unsubscribed\
    \ using the function, removeEventListener, which takes the same set of parameters\
    \ as addEventListener. For the btn variable used in the previous example, this\
    \ can be done in the following manner:\n\n```javascript\nvar btn = document.getElementById('btnDownload');\n\
    btn.removeEventListener('click', initiateDownload, false);\n```\n\nHow to cancel\
    \ propagation?\n\nThe function, stopPropagation, is used for performing this operation.\
    \ This can be done in the following manner:\n\n```javascript\nvar btn = document.getElementById('btnDownload');\n\
    btn.addEventListener('click', initiateDownload, false);\n\nfunction initiateDownload(e)\
