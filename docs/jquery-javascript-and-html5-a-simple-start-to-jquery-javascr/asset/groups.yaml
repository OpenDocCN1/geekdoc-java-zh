    \n## 使用 Web 服务\n\n典型网站场景最大的缺点之一是，即使新页面与之前的页面相同，HTML 页面也会重绘。这会导致你浪费带宽和资源。这一缺点可以通过\
    \ Web 服务来解决，Web 服务用于发送和接收数据，其优点是 HTML 页面不需要重绘。用于发送请求的技术是 AJAX（异步 JavaScript 和\
    \ XML）。这种技术允许你异步执行数据发送操作。\n\n在继续之前，了解 Web 服务的基础知识以及如何使用它们至关重要。客户端需要定期与 Web 服务器进行通信，这种通信通过\
    \ Web 服务来实现。在这种情况下，客户端可以是任何使用 Web 服务的机器，也可以是 Web 服务本身。因此，无论客户端是什么，都需要创建并向 Web\
    \ 服务发送请求，并接收和解析响应。\n\n你一定听过“集结合”（mashups）这个词，它用于描述将多个 Web 服务组合在一起的应用程序。存在两大类 Web\
    \ 服务：任意 Web 服务（arbitrary web services）和 REST（表述状态转移）。在第一种情况下，操作集是任意的，而在第二种情况下，存在一个统一的操作集。\n\
    \n## 表述状态转移 (REST)\n\n该框架使用标准的 HTTP 操作，这些操作映射到它的创建、删除、更新和检索操作。此外，REST 不关注与消息的交互。相反，它的交互关注于无状态资源。这可能就是\
    \ REST 用于用于创建整洁 URL 的原因。REST URL 的示例包括 httplocalhost:8080/Customers/2（用于删除客户）和\
    \ http://localhost:8080/Vehicles?VIN=XYZ12（用于通过 GET 方法传递参数来检索特定车辆的信息）。\n\n某些防火墙可能不允许使用\
    \ POST 和 GET 方法。因此，建议在 QueryString 中使用“动”（verb）。URL 的示例如下：\n\nhttp://localhost:8080/Vehicles?verb=DELETE&VIN=XYZ987\n\
    \nHTTP 协议还允许你使用 HTTPS 实现安全。REST 提供了许多优势，如连接简单、操作快速和资源消耗少。然而，许多开发者倾向于使用 JSON（JavaScript\
    \ 对象表示），因为其体积紧凑。此外，REST 只支持 GET 和 POST，这限制了它的功能，因此，一些开发者切换到了 RESTFUL。\n\n## 任意\
    \ Web 服务\n\n这类 Web 服务也被称为“大型 Web 服务”。此类服务的示例是 WCF（Windows 通信框架）。任意 Web 服务通过不将操作仅映射到协议的某些方面来扩展其操作领域。结果是，它们提供了更多功能，包括许多安全机制和消息路由。\n\
    \n这类 Web 服务具有一种典型的接口格式，客户端可以使用它来读取和解析信息。因此，客户端可以立即调用服务。常见的 API 格式是 Web 服务描述语言（WSDL）。对于任意\
    \ Web 服务，客户端必须借助 SOAP（简单对象访问协议）消息来组装其请求。这种 Web 服务不使用 HTTP 协议，而是使用 TCP。\n\n## 如何使用\
    \ Node.js 创建 RESTful Web 服务\n\n在之前提到的示例中，samplePackage 可以暴露为 Web 服务。可以在该包上使用 GET\
    \ 方法，并将操作作为参数传递。该包良好的 RESTful 实现可能像这样：\n\n```\nhttp://localhost:8080/samplePackage?operation=add&x=1&y=5\n\
    ```\n\n## 如何使用 AJAX 调用 Web 服务\n\n可以使用 AJAX 异步调用 Web 服务，AJAX 实际上是 JavaScript。AJAX\
    \ 不是向服务器发送调用并重绘 HTML 文档，而是直接回调服务器。在这种情况下，屏幕不会重绘。下面给出了示例实现：\n\n可以使用以下代码创建一个 MyPage.html：\n\
    \n```html\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n\
    <title></title>\n<script type=\"text/javascript\" src=\"scripts/jquery-1.8.2.min.js\"\
    ></script>\n</head>\n<body>\n<form id=\"myForm\">\n输入 X 的值:<input type=\"text\"\
    \ id=\"x\" /><br />\n输入 Y 的值:<input type=\"text\" id=\"y\" /><br />\n结果: <span\
    \ id=\"finalResult\"></span><br />\n<button id=\"btnAdd\">数字相加</button>\n</form>\n\
    <script type=\"text/javascript\" src=\"scripts/default.js\"></script>\n</body>\n\
    </html>\n```\n\n## 如何使用 XMLHttpRequest\n\n实际执行 AJAX 用的对象是 XMLHttpRequest，它可以用于发送/接收\
    \ XML 和其他类型的数据。该对象可以使用以下方式使用：\n\n```javascript\nvar xmlhttp=new XMLHttpRequest();\n\
    xmlhttp.open(\"GET\",\"add?x=50&y=1\",false);\nxmlhttp.send();\nvar xmlDoc=xmlhttp.response;\n\
    ```\n\n第一行创建对象，第二行设置使用带有 QueryString 的 GET 方法，使用“false”表示操作必须异步执行。下一行发送请求，最后一行将响应设置给变量，稍后可以进行读取和解析。\n\
    \n然而，生成的输出是 JSON 而不是默认的（XML），因此，default.js 文件必须更改为：\n\n```javascript\n$(document).ready(function\
