    current HTML document. Therefore, in a way, this element creates nested browsers
    as multiple web page are loaded in the same window. These are implemented using
    the <iframe> element. Nested browsing contexts can be navigated using:


    +   * window.parent – This WindowProxy object represents the parent context.

    * window.top – This WindowProxy object represents the top-level browsing context

