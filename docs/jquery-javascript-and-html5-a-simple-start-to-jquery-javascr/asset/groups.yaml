    \ `false`。\n\n# 实现代码循环\n\n循环是任何编程语言中重要且常用的结构。当你需要执行给定次数的同一组指令时，会面临几种情况。为了实现这种场景，必须使用循环。JavaScript\
    \ 中提供的循环结构包括 `for`、`while` 和 `do-while`。\n\n`while` 循环包含一个条件，只要条件保持为真，循环就会继续执行。`do-while`\
    \ 循环是 `while` 循环的修改版。如果 `while` 中的条件为假，则循环将不会执行。相反，即使 `while` 条件为假，`do-while`\
    \ 循环至少执行一次。\n\n# while 循环的语法：\n\n```\nwhile(condition)\n{\n  //code\n}\n```\n\n\
    # do-while 循环的语法：\n\n```\ndo\n{\n  //code\n}\nwhile(condition);\n```\n\nJavaScript\
