    ## 如何添加 Expanda 属性


    你作为作者定义的任何属性都称为 expanda 属性。你可以为这个自定义属性命名，并在需要时为其分配一个值。


    ## 如何添加注释


    可以使用 `!` 和两个连字符 `-` 来添加注释。添加注释的语法如下：


    ```

    <!--text -->

    ```


    你也可以使用以下语法添加条件注释：


    ```

    <!--[if lte IE 7]><html class="no-js ie6" lang="en"><![endif]-->

    ```


    此注释用于判断正在使用的浏览器是否比 IE7 发布更早的版本。


    ## 如何创建 HTML 文档


    HTML 文档可以简单地描述为一个包含元数据、内容和结构的框架。


    HTML 文档必须以标签 `<!DOCTYPE html>` 开始。在 HTML5 中，该声明指示浏览器应该以无怪异模式（no-quirks mode）或
    HTML5 兼容模式运行。


    下一个标签应该是 `<html>`。该元素内部包含了 `<head>` 和 `<body>` 元素。`<head>` 元素可以包含 HTML 文档的元数据，这些元数据是使用
    `<meta>` 标签声明和定义的。`<head>` 元素还包含 `<title>` 元素，其具有以下作用：


    - 搜索引擎使用

    - - 此内容显示在浏览器工具栏中

    - 为页面提供默认名称


    `<body>` 元素包含了任何要显示在 HTML 文档上的其他信息。


    下面提供了一个 HTML 文档示例：


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <meta charset="utf-8" />

    <title>TITLE OF DOC</title>

    </head>

    <body>

    CONTENT

    </body>

    </html>

    ```


    注意：特殊字符 ''›'' 或 ''<'' 是 HTML 语法的一部分，可以使用它们的名称或数字（实体）在 HTML 文档中使用。它们的用法语法为：


    `&entity_name` 或 `&entity_number`


    附录包含了要使用的实体名称和数字对照表。


    - 1. 使用制表符、换行符和空格创建的空白会被 HTML 归一化单个空格。因此，如果你想使用多个空格，必须使用不换行空格字符。例如，如果你想显示 10 mph
    使得 10 和 mph 之间不被换行符分隔，你可以写 10 &nbsp;mph。


    ## 如何嵌入内容


    现在你已经知道如何用你的内容创建 HTML 文档，你可能想从其他源向文档嵌入内容。这些内容可以是来自另一个 HTML 文档的文本或 Flash 应用。


    ## 内联框架


    内联框架用于在当前 HTML 文档的内容中嵌入 HTML 文档。因此，在某种意义上，该元素创建了嵌套浏览器，因为多个网页加载在同一个窗口中。这些是通过使用
    `<iframe>` 元素实现的。可以使用以下方式导航嵌套浏览上下文：


    - window.parent – 此 WindowProxy 对象代表父上下文。

    - window.top – 此 WindowProxy 对象代表顶层浏览上下文。

    - window.frameElement – 这代表浏览上下文容器，如果没有上下文容器，则返回 null。


    `<iframe>` 元素的语法如下：


    ```html

    <iframe src="name"></</iframe>

    ```


    在这里，属性 `name` 定义了浏览上下文的名称。该名称可以是任何字符串，如 ‘sample.html’。然而，名称不应以下划线开头，因为以下划线开头的名称被留给特殊键名，如
    _blank。


    ## 沙箱 (Sandboxing)


    沙箱用于避免在你的 HTML 文档中引入弹出窗口或其他恶意软件。为了实现这一点，使用了属性 `sandbox`。你可以按照以下方式使用该属性：


    ```html

    <iframe sandbox="keywords" src="name"></</iframe>

    ```


    当你使用沙箱时，会对被调用的上下文实施若干限制。这些限制包括禁用表单、脚本、插件以及自身以外的任何框架。你可以使用等关键词强制系统覆盖这些限制：


    - allow-same-origin

    - allow-scripts

    - allow-forms

    - allow-top-navigation


    可以使用空格将多个关键字隔开。


    ## 无缝嵌入


    `seamless` 属性可以在 `<iframe>` 元素中用于嵌入内容。


    ```html

    <iframe seamless src="name"></</iframe>

    ```


    ```html

    <iframe seamless="" src="name"></</iframe>

    ```


    ```html

    <iframe seamless="name"></</iframe>>

    ```


    ## 超链接


    超链接可以链接外部和内部位置。使用 `<a>` 元素来实现此功能。


    - 蓝色 - 未访问的链接

    - 紫色 - 已访问的链接

    - 红色 - 激活链接


    外部链接的语法：


    ```html

    <a href="address">Text</a>

    ```


    内部链接的语法：


    ```html

    <a href="#id">Text</a>

    ```


    `target` 属性用于指定链接应该在何打开：


    - _blank

    - _parent

    - _self

    - _top

    - _frame


    超链接还可以使用以下语法发送电子邮件：


    ```html

    <a href="mailto:email address">Text</a>

    ```


    ## 嵌入图像


    `<img>` 元素用于向 HTML 文档添加图像。`<img>` 标签是一个空元素（void element），不需要闭合标签。该元素所需的标签是 `src`，它指定了存储图像的绝对或相对地址。可以与
    `<img>` 标签一起使用的另一个属性是 `alt`，它指定了图像不可用时必须显示的文本。


    ```html

    <img src="address" target="alternative text">

    ```


    需要注意的是，你只提供了图像的引用，而没有将它们嵌入到 HTML 文档中。允许的图像格式有 jpeg、png 和 gif。


    ## 如何创建图像映射


    `<map>` 元素可以创建可点击的图像映射。为了在映射和图像之间建立链接，你必须为映射设置名称，并在 `<img>` 标签的 `usemap` 属性中使用该名称。


    映射的区域由 `<area>` 元素定义。这是一个自闭标签，用于定义映射的区域。映射的区域可以使用 `shape`、`href`、`alt` 和 `coords`
    属性来设置。


    `shape` 属性可以给出值 poly、circle、rect 或 default。默认值将区域设置为图像的大小。`href` 和 `alt` 属性的使用方式与
    `<a>` 元素相同。最后，`coords` 属性根据所选形状按以下方式定义：


    - poly - x₁, y₁, x₂, y₂, ..., xₙ, yₙ

    - circle - x, y, radius

    - rect - x₁, y₁, x², y₂


    对于多边形，起始和结束坐标应该是相同的。如果在此方面存在差异，则添加一个闭合值。


    示例：


    ```html

    <img src="worldmap.gif" width="145" height="126" alt="World Map" usemap="#country"
    />


    <map name="country">


    <area shape="circle" coords="105,50,30" href="China.html" alt="China" />


    <area shape="default" href="InvalidCountry.html" alt="Please Try Again" />


    </map>

    ```


