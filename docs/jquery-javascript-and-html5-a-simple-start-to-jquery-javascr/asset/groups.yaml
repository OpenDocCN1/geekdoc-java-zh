    x\" /><br />\nEnter Value of Y:<input type=\"text\" id=\"y\" /><br />\nResult:\
    \ <span id=\"finalResult\"></span><br />\n<button id=\"btnAdd\">Add the Numbers</button>\n\
    </form>\n<script type=\"text/javascript\" src=\"scripts/default.js\"></script>\n\
    </body>\n</html>\n```\n\n## How to Use XMLHttpRequest\n\nThe object that actually\
    \ makes an AJAX call is XMLHttpRequest, which can be used for sending/receiving\
