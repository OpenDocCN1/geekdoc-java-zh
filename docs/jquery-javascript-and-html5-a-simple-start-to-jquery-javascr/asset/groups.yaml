    \n## 表单验证\n\n了解 应用程序所有安全问题的根源在于用户数据是有益的。当你决定向用户数据和交互开放应用程序时，你就让你的应用程序容易受到安全威胁。因此，你需要在处理接收到的任何数据之前对其验证，以防止任何问题的出现。验证可以在浏览器端或服务器端进行。但是推荐使用服务器端验证，因为浏览器级别的验证很容易被操纵。\n\
