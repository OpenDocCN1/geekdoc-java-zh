    </tr>\n<tr>\n<td>Alex</td>\n<td>1989</td>\n</tr>\n</table>\n```\n\nThe table created\
    \ above will look like:\n\n| Frank | 1978 |\n| David | 1967 |\n| Alex | 1989 |\n\
    \nAs you observe the table, you must have realized that the table is not complete\
