    \ operation?\n\nThis can be done by using the function, preventDefault, in the\
    \ following manner:\n\n```javascript\nvar hyperlink = document.getElementById('linkSave');\n\
    hyper.addEventListener('click', saveData, false);\n\nfunction saveData(e) {\n\
    \  //save data\n  e.preventDefault();\n}\n```\n\nJavaScript also provides the\
    \ *this* keyword, which can be used if you wish to access the event causing element,\
