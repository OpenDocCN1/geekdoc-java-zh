    # # Chapter 9: WebSocket Communications


    There are scenarios that may require the establishment of two-way communication
    between the client and the server. A sample application that requires this form
    of communication is a chat application. This chapter gives an elaborative study
    of how web socket communication can be established and used.


    **Communicating by using WebSocket**


    Websocket communications are established using the WebSocket protocol, which uses
    the TCP connection for establishing a full-duplex communication pathway. The protocol
    has been standardized by the IETF (RFC 6455) and the working draft of the WebSocket
    API is in W3C.


    This technology has replaced the concept of long polling. In this case, the client
    sends a request and keeps waiting for a response until a response is received.
    The benefit of this'
  - '[PAGE 113]


    approach is that the connection remains open and as and when the data is available,
    it is immediately sent. However, the connection may be timed out and a re-establishment
    of be required.


    # Understanding WebSocket Protocol


    The WebSocket protocol allows bi-directional connection establishment and is designed
    for implementation for web servers and clients. This technology only interacts
    with the handshake and is interpreted as a transition from the http to WebSocket.
    The frame of this protocol has no headers and an overhead of 2 bytes. It is a
    lightweight technology and its high performance allows communication of live content
    and games.


