    \ that do not change over time. Since the retrieval of the static NodeList takes\
    \ longer, it is advisable to choose search methods that work with active NodeList.\n\
    \nThe search methods available for DOM include:\n\n- getElementById\n\nThis method\
    \ returns a reference to the first element that has the specified ID.\n\n- getElementsByTagName\n\
    \nThis method returns the active NodeList, which has the specified tag name.\n\
    \n- getElementsByName\n\nThis method returns the active NodeList, which has the\
    \ specified name. This is a preferred method for option buttons.\n\n- getElementsByClassName\n\
    \nThis method returns the active NodeList, which has the specified class name.\
    \ However, this method is not supported by Internet Explorer version 8 and earlier.\n\
    \n- querySelector\n\nThis method accepts CSS selector as parameter and return\
    \ the first matched element. However, this method is not supported by Internet\
    \ Explorer version 7 and earlier.\n\n- querySelectorAll\n\nThis method accepts\
    \ CSS selector as parameter and return all the matched elements. Therefore, it\
    \ returns a static NodeList. However, this method is not supported by Internet\
    \ Explorer version 7 and earlier.\n\n# Events\n\nIf you look at JavaScript as\
    \ an engine, then events are what give it the required spark. Events can occur\
    \ in two situations. The first type of events are those that occur during user\
    \ interactions. A user may click an image or enter text. All these are classified\
    \ as events. Besides this, changes in state of the system are also considered\
    \ an event. For instance, if a video starts or stops, an event is said to have\
    \ occurred. The DOM allows you to capture events and execute code for the same.\n\
    \nIn JavaScript events are based on the publish-subscribe methodology. Upon creation\
    \ of an object, the developer can publish the events that are related to this\
    \ object. Moreover, event handlers can be added to this object whenever it is\
    \ used. The event handler notifies the subscribed events that the event has been\
    \ triggered. This notification includes information about the event like location\
    \ of the mouse and key-presses, in addition to several other details relevant\
    \ to the event.\n\nCapturing events:\n\nThere may be situations when an event\
    \ may be attached to a button click, which may lie inside a hyperlink. In this\
    \ situation, there is nesting of elements. Therefore, the event, when triggered,\
    \ is passed down the DOM hierarchy. This process is called event capturing. However,\
    \ once the event has reached the element, this event is bubbled up the hierarchy.\
    \ This process is called event bubbling. This movement of the event across the\
    \ hierarchy gives the developer an opportunity to subscribe or cancel the propagation,\
    \ on need basis.\n\nSubscribing to event:\n\nThe function, addEventListener, can\
    \ be used for the subscription process. This function requires three arguments,\
