    # Variables


    Manipulation of data is performed with the help of variables. Data is stored in
    the memory and a named reference to this memory location is called a variable.
    Any identifier is declared as a variable by preceding it with a keyword *var*.
    A sample declaration of a variable is:


    ```

    var result;

    ```


