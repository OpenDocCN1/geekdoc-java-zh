    \nconsole.log('Listening on: ' + port + 'port');\n```\n\n6. You can now run the\
    \ application in a similar manner as you did for the previous example.\n\n## Working\
    \ with web services\n\nOne of the biggest drawbacks of a typical website scenario\
    \ is that the HTML page is repainted even if the new page is the same as the previous\
    \ page. This causes you to lose bandwidth and resources. This drawback can be\
    \ addressed using web services, which can be used for sending and receiving data,\
    \ with the benefit that the HTML page is not repainted. The technology used for\
    \ sending requests is AJAX or Asynchronous JavaScript and XML. This technology\
    \ allow you to perform the data sending operation asynchronously.\n\nBefore moving\
    \ any further, it is important to know the basics of web services and how they\
    \ can be used. A client needs to communicate with the web server on a regular\
    \ basis and this communication is facilitated by the web service. In this case,\
    \ the client can be anyone from a machine using the web service to the web service\
    \ itself. Therefore, the client, regardless what it is, needs to create and send\
    \ a request to the web service, and receive and parse the responses.\n\nYou must\
    \ have heard of the term mashups, which is a term used to describe applications\
    \ that pierce together web services. Two main classes of web services exist, which\
    \ are arbitrary web services and REST or representational state transfer. While\
    \ the set of operations are arbitrary in the first case, there exists a uniform\
    \ operations set in the second.\n\n## Representational State Transfer (REST)\n\
    \nThis framework uses the standard HTTP operations, which are mapped to its create,\
    \ delete, update and retrieve operations. Moreover, REST does not focus on interacting\
    \ with messages. Instead, its interactions are focused towards stateless resources.\
    \ This is perhaps the reason REST concept is concept for creation of clean URLs.\
    \ Examples of REST URLs include http://localhost:8080/Customers/2, which deletes\
    \ a customer and http://localhost:8080/Vehicles?VIN=XYZ12, which is used to retrieve\
    \ the information about a vehicle for which a parameter is passed using GET method.\n\
    \nSome firewalls may not allow the use of POST and GET methods. Therefore, it\
    \ is advisable to use 'verb' in the QueryString. An example of how the URL will\
    \ look like is:\n\nhttp://localhost:8080/Vehicles?verb=DELETE&VIN=XYZ987\n\nThe\
    \ HTTP protocol also allows you to implement security using the HTTPS REST provides\
    \ several benefits like easy connection, faster operation and lesser consumption\
    \ of resources. However, many developers prefer to use JSON or (JavaScript Object\
    \ Notation) because it is compact in size. Besides this, REST only supports GET\
    \ and POST, which restricts its capabilities, Therefore, some developers switch\
    \ to RESTFUL.\n\n## Arbitrary Web Services\n\nThis type of web services is also\
    \ referred to as big web services. An example of such services is WCF or Windows\
    \ Communication Foundation. Arbitrary web services expand their realm of operations\
    \ by not mapping their operations to only aspects of the protocol. As a result,\
    \ they provide more functionality, which include many security mechanisms and\
    \ message routing.\n\nThis type of web services possess a typical interface format,\
    \ which can be used by the client for reading and parsing information. As a result,\
    \ the client can make calls to the service immediately. A common API format is\
    \ the Web Services Description Language (WSDL). In case of arbitrary web services,\
    \ the client must assemble its request with the help of a SOAP (Simple Object\
    \ Access Protocol) message. This web service does not use the HTTP protocol and\
    \ instead uses the TCP.\n\n## How to Create RESTful Web Service using Node.js\n\
    \nIn the example mentioned previously, the samplePackage can be exposed as web\
    \ service.\nThe GET method can be used on the package and the operation is passed\
    \ as a parameter. A good RESTful implementation of this package can look something\
    \ like this:\n\n```\nhttp://localhost:8080/samplePackage?operation=add&x=1&y=5\n\
    ```\n\n## How to Use AJAX to Call Web Service\n\nWeb services can be called asynchronously\
    \ using AJAX, which is in actuality a JavaScript. Instead of making a call to\
    \ the server and repainting the HTML document, AJAX just calls back to the server.\
    \ In this case, the screen is not repainted. A sample implementation is given\
