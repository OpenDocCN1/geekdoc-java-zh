    \  var xmlhttp = new XMLHttpRequest();\n  xmlhttp.open(\"GET\", \"add?x=\" + x\
    \ + \"&y=\" + y, false);\n  xmlhttp.send();\n  var jsonObject = JSON.parse(xmlhttp.response);\n\
    \  result.innerHTML = jsonObject.result;\n}\n```\n\nThe code extracts the x and\
