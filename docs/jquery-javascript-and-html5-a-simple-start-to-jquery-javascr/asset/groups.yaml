    # Form Validation


    It is beneficial to understand that the root of all security issues in web application
    is user data. The moment you decide to open your application to user data and
    interactions, you are making your application vulnerable to security threats.
    Therefore, you need to validate any data that you receive before processing it
    to prevent any issues from cropping up. Validation can be provided at the browser
    or server end. However, server side validation is recommended as browser-level
    validation can be easily manipulated.


    The simplest form of validation that you can implement is using the required attribute
    in the <select> element. You can set this attribute in the following manner:'
