- md: "\n# Switch\n\nMultiple else ifs can be implemented using this construct. The\
    \ execution overhead is high for this conditional programming construct as conditions\
    \ are sequentially checked for validity. As an alternative, another keyword, switch,\
    \ is available, which implements multiple conditions in the form of a jump table.\
    \ Therefore, the execution overhead for switch is less than that of if-else if.\n\
    \nSample implementation:\n\n```\nvar userChoice = prompt('Choose an alphabet:\
    \ a, b, c', 'e');\n\nswitch (userChoice) {\n\ncase 'a':\nalert('a chosen\\n');\n\
    break;\n\ncase 'b':\nalert('b chosen\\n');\nbreak;\n\ncase 'c':\nalert('c chosen\\\
    n');\nbreak;\n\ndefault:\nalert('None of the alphabets chosen\\n');\nbreak;\n\
    }\n```\n\nThe switch construct matches that value entered by the user with the\
    \ values presented in the cases. If a matching value is found, the case is executed.\
    \ However, in case, none of the case values match the entered input, the default\
    \ case is executed. Besides this, you can also use conditions in case values and\
    \ the case for which the condition holds true is executed.\n\nIf you do not use\
    \ the break statement after the code of a case, all the cases following the matching\
    \ case will be executed. For example, if the user enters ‘b' for the above example\
    \ and there are no break statements after the case code, then the output will\
    \ be:\n\nb chosen\nc chosen\nNone of the alphabets chosen\n\nAlso, it is a good\
    \ practice to use a break statement in the default case as well.\n\nNote:\n\n\
    If you wish to determine if a keyword has been assigned any value or not, you\
    \ can use the following code:\n\n```\nif(c)\n{\n//code\n}\n```\n\n```\nelse\n\
    {\n//code\n}\n```\n\nIf the variable c has been assigned a not-null value, then\
    \ the if condition is true and the corresponding code is executed. On the other\
    \ hand, if the value of variable c is undefined or null, the code within the else\
    \ construct is executed.\n\nNote:\n\nThe value of the following conditions will\
    \ always be true:\n\n```\n\"\" == 0\nnull == undefined\n'123' == 123\nfalse ==\
    \ 0;\n```\n\nPlease note that JavaScript converts the type of the variable concerned\
    \ for compatibility comparisons.\n\nHowever, if you want to compare both the value\
    \ and type of two variables, JavaScript provides another set of operators, ===\
    \ and !==. When the comparisons for the values mentioned in the above example\
    \ are done using this operator, the resultant will always be false.\n\n# Implementing\
    \ Code Loops\n\nLooping is an important and commonly used construct of any programming\
    \ language. You will be faced by several situations when you need to perform the\
    \ same set of instructions, a given number of times. In order to implement this\
    \ scenario, loops have to be used. Loop constructs available in JavaScript include\
    \ for, while and do-while.\n\nThe while loop includes a condition and as long\
    \ as the condition remains true, the loop continues to execute. The do-while loop\
    \ is a modification of the while loop. If the condition in the while is false,\
    \ the loop will not execute at all. On the other hand, even if the while condition\
    \ is false, the do-while loop executes at least once.\n\n# Syntax for while loop:\n\
    \n```\nwhile(condition)\n{\n  //code\n}\n```\n\n# Syntax for do-while loop:\n\n\
    ```\ndo\n{\n  //code\n}\nwhile(condition);\n```\n\nThe last type of loop available\
    \ in JavaScript is for loop. The for loop allows you to initialize the looping\
    \ variable, check for condition and modify the looping variable in the same statement.\n\
    \n# Syntax:\n\n```\nfor(initialize; condition; modify)\n{\n  //code\n}\n```\n\n\
    Sample code:\n\n```\nfor(i=0; i<10; i=i+1)\n{\n  //code\n}\n```\n\nThis loop will\
    \ run 10 times.\n\nNote:\n\n1. If at any point in time, you wish the loop to break,\
    \ you can use the break statement.\n2. If you do not specify a condition or specify\
    \ a condition that is always true, the loop will run infinitely.\n\n# Error Handling\n\
    \nExceptions are expected to occur at several points in your code. Therefore,\
    \ it is best to implement a mechanism that can help you deal with these exceptions\
    \ and avoid crashing.\n\nAn exception can be described as an illegal operation\
    \ or any condition that is unexpected and not ordinary. A few examples of exceptions\
    \ include unauthorized memory access.\n\nYou can perform exception handling at\
    \ your own level by validating the values of variables before performing any operations.\
    \ For instance, before performing division, it is advisable to check if the value\
    \ of the denominator is equal to zero. Any operation that involves division of\
    \ a number by zero raises the divide-by-zero exception.\n\nHowever, there are\
    \ other situations that cannot be handled in this manner. For instance, if the\
    \ network connection breaks abruptly, you cannot do anything to pre-emptively\
    \ handle the situation. Therefore, for situations like these, try, catch and finally\
    \ keywords are used.\n\nThe code that is expected to throw an exception is put\
    \ inside the try block. This exception, upon its occurrence, is caught by the\
    \ catch block, which executes code that is supposed to be executed immediately\
    \ after an exception is caught. The catch may be followed by the finally block,\
    \ which performs the final cleanup. This block is executed after the execution\
    \ of try and catch blocks.\n\nSyntax:\n\n```\ntry\n{\n//code\n}\ncatch(exception\
    \ name)\n{\n//code\n}\nfinally\n{\n//code\n}\n```\n\n# Working with Objects\n\n\
    JavaScript allows user access to a number of objects. One of these objects is\
    \ an array. This section discusses all the basics related to handling of objects.\n\
    \n# Arrays\n\nA collection of similar objects that are sequenced contiguously\
    \ are referred to as an array. This array is given a name and each element can\
    \ be accessed using the index. Let arrName[] be an array. An array can be created\
    \ using the following methods:\n\n- Insertion of Items Using Indexer: An array\
    \ can be created using the new keyword and then, elements can be added into the\
    \ array by assigning values to independent elements. The new keyword creates an\
    \ instance of the Array using the constructor. Sample implementation:\n```\nvar\
    \ arrName = new Array();\narrName[0] = 'Jack';\narrName[1] = 'Alex';\n```\n- Condensed\
    \ Array: The second type of implementation also uses the new keyword. However,\
    \ in this case, the values are assigned to the elements as arguments to the constructor\
    \ of the Array object. Sample implementation:\n```\nvar arrName = new Array('Jack',\
    \ 'Alex');\n```\n- Literal Array: In this type of array definition, values are\
    \ provided within the square brackets. Sample implementation:\n```\nvar arrName\
    \ = ['Jack', 'Alex'];\n```\n\nThe advantage of using the first type of definition\
    \ is that it allows you to assign values to the elements anywhere in the code.\
    \ On the other hand, the second and third type of implementation require you to\
    \ have the exact list of elements with you beforehand.\n\nThere are some properties\
    \ associated with all object. The one property that can come in handy to you is\
    \ length, which is a read-only value and when called return the number of elements\
    \ present in the array. You can use this property in loops and conditions.\n\n\
    Objects can also have their own functions. These functions are called methods.\
    \ The methods available for Array include:\n\n- concat: Returns an array, which\
    \ is the concatenation of the two arrays supplied to it.\n- indexOf: Finds the\
    \ location of the element concerned in the array and returns the index of the\
    \ same.\n- join: This method concatenates all the values present in the array.\
    \ However, these values are separated by a comma by default. You can specify a\
    \ delimiter of your choice as well.\n- lastIndexOf: This method works similarly\
    \ as indexOf. However, it performs the search for the last element of the array.\
    \ Therefore, it returns the index of the last element that matches the specified\
    \ criterion.\n- pop: Removes the last element and returns its value.\n- push\n"
  mdcn: "\n\n# switch\n\n可以使用此结构实现多个 `else if`。由于条件是按顺序检查其有效性的，因此这种条件编程结构的执行开销较高。作为一种替代方案，可以使用另一个关键字\
    \ `switch`，它以跳转表（jump table）的形式实现多个条件。因此，`switch 的执行开销小于 `if-else if`。\n\n示例实现：\n\
    \n```\nvar userChoice = prompt('Choose an alphabet: a, b, c', 'e');\n\nswitch\
