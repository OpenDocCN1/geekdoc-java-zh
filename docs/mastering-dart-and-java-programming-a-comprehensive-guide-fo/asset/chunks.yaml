    \ {\n  if (i == 5) {\n    break; // 当 i 为 5 时退出循环。\n  }\n  print(i);\n}\n```\n\
    \n在这个示例中，循环会在 `i` 等于 5 时终止。\n\n#### 2. `continue`\n\n`continue` 语句用于跳过循环的当前迭代并进入下一次迭代。\n\
    \n```dart\nfor (int i = 1; i <= 5; i++) {\n  if (i == 3) {\n    continue; // 当\
    \ i 为 3 时跳过迭代。\n  }\n  print(i);\n}\n```\n\n在这个示例中，循环跳过了打印数字 3 并继续迭代。\n\n## 结论\n\
    \n控制流和循环是每个 Dart 程序员工具箱中不可缺的工具。条件语句（如 `if`、`else` 和 `else if`）允许你做出决策并选择性地执行代码。循环包括\
    \ `for`、`while` 和 `do-while`）让你能够重复任务并迭代执行操作。\n\n在你继续 Dart 编程之旅时，你会经常遇到需要控制代码流和重复操作的场景。掌握这些基础概念至关重要。\n\
    \n"
