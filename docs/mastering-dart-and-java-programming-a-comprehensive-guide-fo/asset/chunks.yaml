    \  print(x);      // 访问变量 x。\n}\n\nvoid main() {\n  int a = 3;\n  int b = 7;\n\
    \  printNumbers(a, b); // 使用参数 a 和 b 调用函数。\n  print(a);            // 从 main 函数访问变量\
