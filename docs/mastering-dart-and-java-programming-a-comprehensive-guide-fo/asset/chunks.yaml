    \ Woof!\n  }\n}\n```\n\n在这个示例中，我们使用 `as` 运算符将 `animal` 对象强制转换为 `Dog`。由于 `animal`\
    \ 对象确实是 `Dog` 的实例，因此转换成功，我们可以在 `dog` 变量上调用 `bark` 方法。\n\n---\n\n# 第 7 章：在 Dart\
    \ 中操作集合\n\n在本章中，我们将探索 Dart 集合的世界。集合是用于存储和操作一组值的重要数据结构，例如列表（lists）、集合（sets）和映射（maps）。\n\
    \n### 列表 (Lists)\n\n列表是有序值的集合。Dart 提供了多种方法来操作列表。\n\n#### 创建列表\n\n你可以通过列表字面量来创建列表：\n\
    \n```dart\nvar fruits = ['apple', 'banana', 'cherry'];\n```\n\n或者使用构造函数：\n\n```dart\n\
    var colors = List<String>.filled(3, 'red');\n```\n\n#### 访问列表元素\n\n你可以通过索引访问列表中的元素：\n\
    \n```dart\nvar fruits = ['apple', 'banana', 'cherry'];\nprint(fruits[0]); // 输出:\
    \ apple\nprint(fruits[1]); // 输出: banana\n```\n\n#### 修改列表\n\n列表是可变的，你可以在创建后更改元素。\n\
    \n```dart\nvar fruits = ['apple', 'banana', 'cherry'];\nfruits[1] = 'orange';\
    \ // 将 banana 改为 orange\nfruits[2] = 'grape'; // 将 cherry 改为 grape\n```\n\n####\
    \ 添加元素\n\n你可以向列表中添加新元素：\n\n```dart\nvar fruits = ['apple', 'banana', 'cherry'];\n\
    fruits.add('date'); // 在末尾添加元素\nfruits.insert(1, 'mango'); // 在索引 1 处插入元素\nfruits.addAll(['kiwi',\
    \ 'pear']); // 在末尾添加一组元素\n```\n\n#### 移除元素\n\n你可以从列表中移除元素：\n\n```dart\nvar fruits\
    \ = ['apple', 'banana', 'cherry'];\nfruits.remove('banana'); // 指定的指定的元素\nfruits.removeAt(0);\
    \ // 删除索引为 0 的元素\nfruits.removeLast(); // 删除并返回最后一个元素\n```\n"
