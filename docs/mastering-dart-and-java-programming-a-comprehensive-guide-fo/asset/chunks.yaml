    \n## 函数作用域\n\nDart 中的函数有自己的作用域，这意味着在函数内部声明的变量在函数外部是不可见的。这被称为变量作用域，它可以防止命名冲突并保持代码结构整洁。\n\
    \n考虑这个示例：\n\n```dart\nvoid main() {\n  int x = 10; // 这个变量在 main 函数的作用域内。\n  void\
