    \  int sum = math.add(3, 5);\n  print(\"Sum: $sum\"); // 输出: 8\n\n  int squared\
    \ = MathUtils.square(4);\n  print(\"Square: $squared\"); // 输出: 16\n}\n```\n\n\
    在这个示例中：\n- `MathUtils` 类定义了一个实例方法 `add` 和一个静态方法 `square`。\n- 在 `main` 函数中，我们创建了\
