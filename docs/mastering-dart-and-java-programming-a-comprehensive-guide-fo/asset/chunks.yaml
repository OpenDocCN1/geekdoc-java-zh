    fruits[2] = 'grape'; // Changing 'cherry' to 'grape'\n```\n\nIn this example,\
    \ we modify the `fruits` list by assigning new values to specific indices.\n\n\
    ### Adding and Removing Elements\n\nDart provides several methods for adding and\
    \ removing elements from lists:\n\n- **Adding Elements**:\n- `add(element)`: Appends\
    \ an element to the end of the list.\n- `insert(index, element)`: Inserts an element\
    \ at the specified index.\n- `addAll(iterable)`: Appends all elements of the iterable\
    \ to the end of the list.\n- **Removing Elements**:\n- `remove(element)`: Removes\
    \ the first occurrence of the element from the list.\n- `removeAt(index)`: Removes\
    \ the element at the specified index.\n- `removeLast()`: Removes and returns the\
    \ last element of the list.\n- `removeWhere(predicate)`: Removes elements that\
    \ satisfy the given predicate.\n- `clear()`: Removes all elements from the list.\n\
    \n```dart\nvar numbers = [1, 2, 3];\n// Adding elements.\nnumbers.add(4); // [1,\
