    \ 属性。\n\n### 访问对象属性\n\n你可以使用点（`.`）符号访问对象的属性（特性）。这允许你读取和修改对象的状态。\n\n```dart\nclass\
    \ Person {\n  String name;\n  int age;\n  Person(this.name, this.age);\n}\n\n\
    void main() {\n  // 创建一个 Person 对象。\n  Person person = Person(\"Alice\", 30);\n\
    \n  // 访问并修改对象属性。\n  print(\"Name: ${person.name}, Age: ${person.age}\");\n  person.age\
    \ = 31; // 修改年龄属性。\n  print(\"Updated Age: ${person.age}\");\n}\n```\n\n在这个示例中，我们创建了一个\
    \ `Person` 对象并访问了它的 `name` 和 `age` 属性。我们还修改了 `age` 属性来更新年龄。\n\n## 继承\n\n继承是 OOP\
    \ 中的一个基本概念，允许你基于现有类（父类或基类）创建一个新类（子类或派生类）。子类继承父类的属性和方法，还可以拥有自己的属性和方法。\n\n### 创建子类\n\
    \n在 Dart 中创建子类时，使用 `extends` 关键字后跟类名。子类可以重写（提供自己的实现）从父类继承的方法。\n\n以下是继承的示例：\n\n\
    ```dart\n// 父类（基类）。\nclass Animal {\n  String name;\n  Animal(this.name);\n  void\
    \ speak() {\n    print(\"$name makes a sound\");\n  }\n}\n\n// 子类（派生类）。\nclass\
    \ Dog extends Animal {\n  Dog(String name) : super(name); // 调用父类构造函数。\n\n  //\
    \ 重写 speak 方法。\n  @override\n  void speak() {\n    print(\"$name barks\");\n \
    \ }\n}\n\nvoid main() {\n  // 创建类和子类的对象。\n  Animal animal = Animal(\"Generic Animal\"\
    );\n  Dog dog = Dog(\"Buddy\");\n\n  animal.speak(); // Outputs: Generic Animal\
    \ makes a sound\n  dog.speak();    // Outputs: Buddy barks\n}\n```\n\n"
