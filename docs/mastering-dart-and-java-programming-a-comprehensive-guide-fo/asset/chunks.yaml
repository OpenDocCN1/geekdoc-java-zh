    \ // [1, 5, 2, 3, 4, 6, 7]\n\n// Removing elements.\nnumbers.remove(3); // [1,\
    \ 5, 2, 4, 6, 7]\nnumbers.removeAt(1); // [1, 2, 4, 6, 7]\nnumbers.removeLast();\
    \ // [1, 2, 4, 6]\n```\n"
