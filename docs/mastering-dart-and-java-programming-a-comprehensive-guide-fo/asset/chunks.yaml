    \ `a` 和 `b` 仅在 `printNumbers` 函数内部有效，在该函数内部声明的变量在 `main` 函数无效。\n\n## Dart 中的方法\n\
    \n### 什么是方法？\n\n在 Dart 中，方法是与对象或类相关的函数。方法定义了对象的行为，并允许你执行特定于对象的操作。方法是面向对象编程 (OOP)的基本概念，并在定义类行为方面起着核心作用。\n\
    \n以下是类方法的基本语法：\n\n```dart\nreturnType methodName(parameters) {\n  // 带有指令的方法体。\n\
    \  // 可选返回指定 returnType 类型的值。\n}\n```\n\n### 创建和使用方法\n\n要在 Dart 中创建和使用方法，你通常在类内部定义它们。类是创建对象的蓝图，而方法定义了这些对象做什么。\n\
    \n这是一个带有方法的简单 Dart 类示例：\n\n```dart\nclass Dog {\n  String name;\n  // 初始化狗名的构造函数。\n\
    \  Dog(this.name);\n  // 汪叫的方法。\n  void bark() {\n    print(\"$name says Woof!\"\
    );\n  }\n}\n\nvoid main() {\n  // 创建一个 Dog 对象并调用它的 bark 方法。\n  Dog myDog = Dog(\"\
    Buddy\");\n  myDog.bark(); // 输出: Buddy says Woof!\n}\n```\n\n在这个示例中：\n- 我们定义了一个\
    \ `Dog` 类，它包含一个接受狗的名字作为参数的构造函数。该类还有一个名为 `bark` 的方法，它可以打印信息。\n- 在 `main` 函数中，我们创建了一个\
    \ `Dog` 对象并调用它的 `bark` 方法。\n\n### 实例方法与静态方法\n\n在 Dart 中，方法有两种类型：实例方法和静态方法。\n\n\
    - **实例方法**：这些方法与实例（对象）相关。它们可以访问和修改实例属性。\n- **静态方法**：静态方法不绑定实例，而是与类本身相关。它们无法访问特定的实例属性。\n\
    \n以下是一个演示两者的示例：\n\n```dart\nclass MathUtils {\n  // 添加两个数字的实例方法。\n  int add(int\
    \ a, int b) {\n    return a + b;\n  }\n  // 计算数字平方的静态方法。\n  static int square(int\
