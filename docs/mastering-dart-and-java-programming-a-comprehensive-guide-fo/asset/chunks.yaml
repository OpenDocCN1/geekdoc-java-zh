    #### **5\. List**


    The `List` data type represents an ordered collection of values. Lists can contain
    elements of the same or different data types. For example:


    ```dart


    List<int> numbers = [1, 2, 3, 4, 5]; // A list of integers.


    List<String> fruits = ["apple", "banana", "cherry"]; // A list of strings.


    ```


    #### **6\. Map**


    The `Map` data type represents a collection of key-value pairs, also known as
    dictionaries or associative arrays. Each key is associated with a value. For example:


    ```dart


    Map<String, int> ages = {"Alice": 25, "Bob": 30, "Carol": 35}; // A map with string
    keys and integer values.


    ```


    ### Variable Naming Rules


    When naming variables in Dart, you must follow certain rules:


    - Variable names must start with a letter or an underscore (`_`).


    - Variable names can contain letters, numbers, and underscores.


    - Variable names are case-sensitive (`age` and `Age` are different variables).


    - Variable names cannot be Dart keywords or reserved words (e.g., `if`, `else`,
    `int`).


    It''s good practice to choose descriptive and meaningful variable names that convey
    the purpose of the variable. This enhances code readability and makes it easier
    for you and others to understand the code.


    ## Variable Scope


    Variables in Dart have a scope, which defines where in your code the variable
    is accessible. There are two main types of variable scope in Dart:


    ### **1\. Local Variables**


    Local variables are declared within a specific block of code, such as within a
    function or a code block enclosed by curly braces `{}`. They are only accessible
    within that block. Once the block is exited, the local variable is no longer accessible.


    ```dart


    void main() {


    int x = 10; // x is a local variable accessible within the main function.


    print(x); // Outputs: 10


    }


    ```


    Attempting to access `x` outside of the `main` function would result in an error
    because `x` is not in scope.


    ### **2\. Global Variables**


    Global variables, on the other hand, are declared outside of any function or code
    block and are accessible throughout the entire Dart file. They have a broader
    scope and can be used in multiple functions.


    ```dart


    int globalVar = 5; // globalVar is a global variable.


    void main() {


    print(globalVar); // Outputs: 5


    updateGlobalVar(); // Calls a function that modifies globalVar.


    print(globalVar); // Outputs: 10


    }


    void updateGlobalVar() {


    globalVar = 10; // Modifies the global variable.


    }


    ```


    While global variables provide flexibility, it''s essential to use them judiciously,
    as they can lead to unexpected behavior and make your code harder to maintain.
    Local variables are preferred when possible because they encapsulate data within
    specific functions or code blocks.


    ## Constants


    In addition to variables, Dart supports constants, which are values that cannot
    be changed once assigned. Constants are declared using the `final` or `const`
    keyword, depending on whether the value is determined at runtime or compile-time.


    ### **1\. `final` Keyword**


    The `final` keyword is used to declare a variable as a runtime constant. This
    means that the value of a `final` variable can be determined at runtime but cannot
    be changed once assigned.


    ```dart


    final int finalVar = 100; // A final variable with a runtime-determined value.


    ```


    ### **2\. `const` Keyword**


    The `const` keyword is used to declare a variable as a compile-time constant.
    This means that the value of a `const` variable must be known at compile-time
    and cannot be changed.


    ```dart


    const double pi = 3.14159; // A compile-time constant variable.


    ```


    Constants are useful for storing values that should not change during program
    execution, such as mathematical constants or configuration settings. They can
    also be used to optimize performance in some cases, as the values are known at
    compile-time.


    ## Type Inference


    While Dart is a statically typed language, it also supports type inference, which
    allows you to omit the explicit declaration of a variable''s data type in certain
    situations. The Dart compiler can infer the data type based on the initial value
    you provide.


    ```dart


    var age = 25; // Dart infers that age is of type int.


    var name = "John"; // Dart infers that name is of type String.


    ```


    Using type inference can make your code more concise while still benefiting from
    strong typing. However, it''s essential to strike a balance between clarity and
    brevity. Explicitly specifying data types can make your code more self-documenting
    and easier for others to understand.


    ## Conclusion


    In this chapter, we''ve


    explored the foundational concepts of variables and data types in Dart. Variables
    are containers for holding data, and Dart provides various data types for different
    kinds of information. We''ve discussed the rules for declaring variables, naming
    conventions, and the scope of variables. Additionally, we''ve covered constants
    and how to use them for storing values that should not change during program execution.


    Understanding variables and data types is a critical step in your Dart programming
    journey. As you continue to explore Dart in the following chapters, you''ll use
    these fundamental concepts to create more complex programs, manipulate data, and
    build applications that solve real-world problems. Stay tuned for hands-on examples
    and practical exercises that will solidify your understanding of Dart''s capabilities.


