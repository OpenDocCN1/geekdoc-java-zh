    ### Variable Naming Rules


    Both Java and Python have specific rules for variable naming:


    - Variable names can contain letters (a-z, A-Z), digits (0-9), and underscores
    (_).


    - The first character of a variable name cannot be a digit.


    - Variable names are case-sensitive, meaning `age`, `Age`, and `AGE` are considered
    different variables.


    ## Section 3: Type Conversion and Casting


    ### Type Conversion in Java


    Java provides automatic type conversion for compatible data types, known as widening
    conversion. For example, converting an `int` to a `double`:


    ```java


    int number = 10;


    double result = number; // Automatic conversion from int to double


    ```


    However, explicit type conversion, known as casting, is required when converting
    from a larger data type to a smaller data type to avoid data loss:


    ```java


    double largeNumber = 1234.56;


    int smallNumber = (int) largeNumber; // Casting from double to int


    ```


    ### Type Conversion in Python


    Python also performs automatic type conversion, but it is referred to as "type
    coercion." For example, converting an `int` to a `float`:


    ```python


    number = 10


    result = float(number) # Automatic conversion from int to float


    ```


    Similarly, explicit type conversion is used when converting between different
    data types:


    ```python


    large_number = 1234.56


    small_number = int(large_number) # Casting from float to int


    ```


    ## Section 4: Type Checking and Type Conversion Functions


    ### Type Checking in Java


    In Java, you can check the data type of a variable using the `instanceof` operator.
    It returns `true` if the variable is an instance of the specified data type, otherwise
    `false`.


    ```java


    public class Main {


    public static void main(String[] args) {


    int number = 10;


    double salary = 45000.50;


    System.out.println(number instanceof Integer); // Output: true


    System.out.println(salary instanceof Double); // Output: true


    }


    }


    ```


    ### Type Checking in Python


    Python provides the `type()` function to check the data type of a variable:


    ```python


    number = 10


    salary = 45000.50


    print(type(number)) # Output: <class ''int''>


    print(type(salary)) # Output: <class ''float''>


    ```


    ### Type Conversion Functions in Python


    Python offers built-in functions to explicitly convert variables between different
    data types:


    - `int()`: Converts a value to an integer.


    - `float()`: Converts a value to a floating-point number.


    - `str()`: Converts a value to a string.


    - `bool()`: Converts a value to a boolean.


