    \ 12 章：使用 Java 进行 GUI 开发\n\n图形用户界面（GUI）在现代软件应用中起着至关重要的作用，为用户与程序的交互提供了一种直观且易于使用的方式。Java\
    \ 通过 Swing 和 JavaFX 库提供了强大的 GUI 开发能力。在本章中，我们将探索 Java GUI 开发的基础，涵盖 Swing 和 JavaFX，并提供实用示例来演示如何创建交互性且视觉吸引力用户界面。\n\
    \n## 第 1 节：Java GUI 开发简介\n\n### 什么是 GUI 开发？\n\nGUI 开发涉及为软件应用程序创建图形界面，使用户能够通过视觉元素与程序进行交互。\n\
    \n### Java GUI 库\n\nJava 提供了两个主要的 GUI 开发库：Swing 和 JavaFX。Swing 是较旧的库，而 JavaFX\
    \ 是较新且更现代的。\n\n## 第 2 节：Swing GUI 开发\n\n### Swing 简介\n\nSwing 是 Java 基础类（JFC）的一部分，自\
    \ Java 早期以来一直存在。它提供了一系列组件和工具用于构建桌面应用程序。\n\n字体 创建一个简单的 Swing \n\n**示例：HelloWorldSwing.java**\n\
