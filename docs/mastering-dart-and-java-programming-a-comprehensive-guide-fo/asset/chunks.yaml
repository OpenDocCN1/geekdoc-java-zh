    # **Chapter 13: Database Connectivity with JDBC**


    Database connectivity is a crucial aspect of modern software applications, allowing
    programs to interact with relational databases to store, retrieve, and manipulate
    data. Java Database Connectivity (JDBC) is a standard Java API that enables Java
    applications to connect to and interact with various relational databases. In
    this chapter, we will explore the fundamentals of JDBC, including establishing
    database connections, executing queries, and performing database operations, with
    practical examples to demonstrate how to work with databases in Java applications.


    ## Section 1: Introduction to JDBC


    ### What is JDBC?


    JDBC stands for Java Database Connectivity, and it is a standard Java API that
    provides a set of classes and interfaces for connecting to relational databases
    and executing SQL queries.


    ### JDBC Architecture


    JDBC follows a layered architecture, including the following components:


    1\. JDBC API: Contains interfaces and classes to interact with databases.


    2\. JDBC Driver Manager: Manages database drivers and handles connections.


    3\. JDBC Driver: Implements the low-level communication with specific databases.


    ## Section 2: Connecting to the Database


    ### Loading JDBC Driver


    Before connecting to a database, you need to load the appropriate JDBC driver
    using `Class.forName()`.


    **Example:**


    ```java


    import java.sql.*;


    public class DBConnectionExample {


    public static void main(String[] args) {


    try {


    Class.forName("com.mysql.jdbc.Driver");


    System.out.println("JDBC Driver loaded successfully!");


    } catch (ClassNotFoundException e) {


    System.out.println("Failed to load JDBC Driver: " + e.getMessage());


    }


    }


    }


    ```


    ### Establishing Database Connection


    After loading the JDBC driver, you can establish a connection to the database
    using `DriverManager.getConnection()`.


    **Example:**


    ```java


    import java.sql.*;


    public class DBConnectionExample {


    public static void main(String[] args) {


    String url = "jdbc:mysql://localhost:3306/mydatabase";


    String username = "myusername";


    String password = "mypassword";


    try {


    Connection connection = DriverManager.getConnection(url, username, password);


    System.out.println("Database connection established successfully!");


    } catch (SQLException e) {


    System.out.println("Failed to establish database connection: " + e.getMessage());


    }


    }


    }


    ```


    ## Section 3: Executing SQL Queries


    ### Executing Statements


    Once the database connection is established, you can create a `Statement` object
    to execute SQL queries.


    **Example:**


    ```java


    import java.sql.*;


    public class SQLQueryExample {


    public static void main(String[] args) {


    String url = "jdbc:mysql://localhost:3306/mydatabase";


    String username = "myusername";


    String password = "mypassword";


    try {


    Connection connection = DriverManager.getConnection(url, username, password);


    Statement statement = connection.createStatement();


    String sql = "SELECT * FROM employees";


    ResultSet resultSet = statement.executeQuery(sql);


    while (resultSet.next()) {


    String name = resultSet.getString("name");


    int age = resultSet.getInt("age");


    System.out.println("Name: " + name + ", Age: " + age);


    }


    statement.close();


    connection.close();


    } catch (SQLException e) {


    System.out.println("Error executing SQL query: " + e.getMessage());


    }


    }


    }


    ```


    ### Prepared Statements


    Prepared statements are a more efficient way to execute SQL queries, especially
    for parameterized queries.


    **Example:**


    ```java


    import java.sql.*;


    public class PreparedStatementExample {


    public static void main(String[] args) {


    String url = "jdbc:mysql://localhost:3306/mydatabase";


    String username = "myusername";


    String password = "mypassword";


    try {


    Connection connection = DriverManager.getConnection(url, username, password);


    String sql = "INSERT INTO employees (name, age) VALUES (?, ?)";


    PreparedStatement statement = connection.prepareStatement(sql);


    statement.setString(1, "John");


    statement.setInt(2, 30);


    statement.executeUpdate();


    statement.setString(1, "Alice");


    statement.setInt(2, 28);


    statement.executeUpdate();


    statement.close();


    connection.close();


    } catch (SQLException e) {


    System.out.println("Error executing prepared statement: " + e.getMessage());


    }


    }


    }


    ```


    ## Section 4: Database Operations


    ### Inserting Data


    To insert data into a database, you can use an SQL `INSERT` statement.


    **Example:**


    ```java


    import java.sql.*;


    public class InsertDataExample {


    public static void main(String[] args) {


    String url = "jdbc:mysql://localhost:3306/mydatabase";


    String username = "myusername";


    String password = "mypassword";


    try {


    Connection connection = DriverManager.getConnection(url, username, password);


    Statement statement = connection.createStatement();


    String sql = "INSERT INTO employees (name, age) VALUES (''John'', 30)";


    int rowsAffected = statement.executeUpdate(sql);


    System.out.println(rowsAffected + " row(s) inserted.");


    statement.close();


    connection.close();


    } catch (SQLException e) {


    System.out.println("Error inserting data: " + e.getMessage());


    }


    }


    }


    ```


    ### Updating Data


    To update existing data in a database, you can use an SQL `UPDATE` statement.


    **Example:**


    ```java


    import java.sql.*;


    public class UpdateDataExample {


    public static void main(String[] args) {


    String url = "jdbc:mysql://localhost:3306/mydatabase";


    String username = "myusername";


    String password = "mypassword";


    try {


    Connection connection = DriverManager.getConnection(url, username, password);


    Statement statement = connection.createStatement();


    String sql = "UPDATE employees SET age = 31 WHERE name = ''John''";


    int rowsAffected = statement.executeUpdate(sql);


    System.out.println(rowsAffected + " row(s) updated.");


    statement.close();


    connection.close();


    } catch (SQLException e) {


    System.out.println("Error updating data: " + e.getMessage());


    }


    }


    }


    ```


    ### Deleting Data


    To delete data from a database, you can use an SQL `DELETE` statement.


    **Example:**


    ```java


    import java.sql.*;


    public class DeleteDataExample {


    public static void main(String[] args) {


    String url = "jdbc:mysql://localhost:3306/mydatabase";


    String username = "myusername";


    String password = "mypassword";


    try {


    Connection connection = DriverManager.getConnection(url, username, password);


    Statement statement = connection.createStatement();


    String sql = "DELETE FROM employees WHERE name = ''John''";


    int rowsAffected = statement.executeUpdate(sql);


    System.out.println(rowsAffected + " row(s) deleted.");


    statement.close();


    connection.close();


    } catch (SQLException e) {


    System.out.println("Error deleting data: " + e.getMessage());


    }


    }


