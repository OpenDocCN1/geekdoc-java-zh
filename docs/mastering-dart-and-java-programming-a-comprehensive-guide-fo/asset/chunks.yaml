    2. 将 TAR 文件解压到你选择的目录。

    3. 将 Dart SDK 的 `bin` 目录添加到系统的 `PATH` 环境变量中。这一步对于从终端运行 Dart 命令是必要的。


    ## 验证你的安装


    安装 Dart SDK 后，必须验证所有内容都已正确设置。打开你的命令提示符或终端并运行以下命令：

