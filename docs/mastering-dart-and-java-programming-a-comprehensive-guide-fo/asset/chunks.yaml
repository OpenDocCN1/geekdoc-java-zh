    ```dart\nvar fruits = ['apple', 'banana', 'cherry'];\n// Accessing elements by\
    \ index.\nvar firstFruit = fruits[0];\nvar secondFruit = fruits[1];\nvar lastFruit\
    \ = fruits[fruits.length - 1];\n```\n\nIn this example, we access elements in\
    \ the `fruits` list by index. `fruits[0]` retrieves the first element, `fruits[1]`\
    \ retrieves the second element, and `fruits[length -1]` retrieves the last element.\n\
    \n### Modifying Lists\n\nLists in Dart are mutable, meaning you can change their\
