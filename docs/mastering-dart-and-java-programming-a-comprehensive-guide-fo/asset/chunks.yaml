    \ // 从外部作用域访问变量 x。\n  }\n  innerFunction();\n  print(y); // 错误：变量 y 在此处不在作用域内。\n\
    }\n```\n\n在这个示例中，变量 `x` 声明在 `main` 函数的作用域内，在 `main` 函数和 `innerFunction` 中都可以访问。然而，变量\
    \ `y` 声明在 `innerFunction` 的作用域内，在 `main` 函数中无法访问。\n\n## 函数参数与变量\n\n理解函数参数与函数内部声明的变量之间的区别至关重要。函数参数是调用函数时传递给函数的值的占位符。它们的作用域限于函数体，且仅在函数内部可用。另一方面，在函数内部声明的变量与参数是分开的，并且有自己的作用域。\n\
    \n这是一个说明这种区别的示例：\n\n```dart\nvoid printNumbers(int a, int b) {\n  int x = a +\
