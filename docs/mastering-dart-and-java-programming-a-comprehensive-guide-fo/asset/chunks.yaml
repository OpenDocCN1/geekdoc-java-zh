- fmt: "\nIn this example, we demonstrate two ways to iterate over the `fruits` map\
    \ and print its key-value pairs.\n\n# Chapter 8: Error Handling and Exceptions\
    \ in Dart\n\nIn this chapter, we'll explore the world of error handling and exceptions\
    \ in Dart. Errors are a common part of software development, and understanding\
    \ how to handle them gracefully is crucial for building robust and reliable applications.\
    \ Dart provides a comprehensive exception handling mechanism to help you identify,\
    \ handle, and recover from errors effectively.\n\n## Understanding Errors and\
    \ Exceptions\n\n### What Are Errors and Exceptions?\n\nIn programming, errors\
    \ are unexpected events or conditions that occur during the execution of a program\
    \ and disrupt its normal flow. these errors can be caused by various factors,\
    \ such as invalid inputs, hardware failures, or issues in the code itself. Handling\
    \ errors is essential to prevent crashes and ensure that the program can continue\
    \ running even when problems arise.\n\nExceptions, on the other hand, are a specific\
    \ type of error that occurs when the program encounters an exceptional condition\
    \ that cannot be handled by normal program flow. Exceptions are raised by the\
    \ program and can be caught and handled by the developer to prevent the program\
    \ from terminating abruptly.\n\n### Dart's Exception Hierarchy\n\nDart has a rich\
    \ exception hierarchy that categorizes exceptions based on their type and origin.\
    \ At the top of the hierarchy is the `Error` class, which represents the most\
    \ general form of runtime errors. Below `Error`, there are several built-in exception\
    \ classes, such as `Exception`, `FormatException`, and `StateError`, each serving\
    \ a specific purpose.\n\nHere are some common exception classes in Dart:\n\n-\
    \ `Exception`: the base class for all exceptions that do not represent errors.\n\
    - `FormatException`: Raised when a string cannot be parsed, such as converting\
    \ a string to a numeric type.\n- `StateError`: Indicates an invalid state in the\
    \ program.\n- `TypeError`: Raised when an operation is performed on an object\
    \ of incompatible type.\n- `RangeError`: Indicates that an index or value is out\
    \ of range.\n- `AssertionError`: Raised when assertion fails.\n\nBy using the\
    \ appropriate exception classes, you can categorize errors and handle them.\n\n\
    ## Handling Exceptions\n\n### The `try`, `catch`, and `finally` Blocks\n\nDart\
    \ provides a structured way to handle exceptions using `try`, `catch`, and `finally`\
    \ blocks.\n\n- The `try` block contains the code that may raise an exception.\n\
    - The `catch` block is used to catch and handle exceptions.\n- The `finally` block\
    \ contains code regardless of whether an exception was thrown.\n\nHere is the\
    \ basic syntax of exception handling in Dart:\n\n```dart\ntry {\n  // Code that\
    \ may raise an exception.\n} catch (exception) {\n  // Code to handle the exception.\n\
    } finally {\n  // Code that runs regardless of an exception thrown.\n}\n```\n\n\
    Let's look at an example:\n\n```dart\nvoid main() {\n  try {\n    var result =\
    \ 10 / 0; // Attempting to divide by zero.\n    print(\"Result: $result\");\n\
    \  } catch (e) {\n    print(\"Error: $e\");\n  } finally {\n    print(\"Execution\
    \ completed.\");\n  }\n}\n```\n\nIn this example, the `try` block contains the\
    \ operation which will raise an exception because division by zero is not allowed.\
    \ The `catch` block catches the exception, and the `finally` block always executes,\
    \ ensuring the program continues to run.\n\n### Catching Specific Exceptions\n\
    \nYou can catch specific types of exceptions by specifying the exception type\
    \ in the `catch` block. This allows you to handle different types of exceptions\
    \ differently.\n\n```dart\nvoid main() {\n  try {\n    var result = 10 / 0; //\
