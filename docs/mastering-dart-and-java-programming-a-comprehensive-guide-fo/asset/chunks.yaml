    \ Java GUI 开发的基础知识，包括 Swing 和 JavaFX、如何创建简单的 GUI 应用程序、处理用户事件以及用于排列组件的布局。掌握了这些知识，你就可以为\
    \ Java 程序构建复杂且易于使用的 GUI，从而增强用户体验和可用性。\n\n# 第 13 章：使用 JDBC 进行数据库连接\n\n数据库连接是现代软件应用程序的关键方面，它允许程序与关系型数据库进行交互，以存储、检索和操作数据。Java\
    \ 数据库连接（JDBC）是一种标准的 Java API，允许 Java 应用程序连接并交互各种关系型数据库。在本章中，我们将探索 `JDBC` 的基础知识，包括建立数据库连接、执行查询和执行数据库操作，并通过实际示例演示如何在\
    \ Java 应用程序中使用数据库。\n\n## 第一节节：JDBC 简介\n\n### 什么是 JDBC？\n\nJDBC 是 Java Database\
    \ Connectivity（Java 数据库连接）的缩写，是一个标准的 Java API，提供了一系列类和接口，用于连接关系型数据库并执行 SQL 查询。\n\
    \n### JDBC 架构\n\nJDBC 遵循分层架构，包括以下组件：\n\n1. `JDBC API`：包含与数据库交互的接口和类。\n2. `JDBC\
    \ Driver Manager`：管理数据库驱动程序并处理连接。\n3. `JDBC Driver`：实现与特定数据库的底层通信。\n\n## 第二节：连接数据库\n\
    \n### 加载 JDBC 驱动程序\n\n在连接数据库之前，你需要使用 `Class.forName()` 加载相应的 JDBC 驱动程序。\n\n**示例：**\n\
    \n```java\nimport java.sql.*;\n\npublic class DBConnectionExample {\n    public\
    \ static void main(String[] args) {\n        try {\n            Class.forName(\"\
    com.mysql.jdbc.Driver\");\n            System.out.println(\"JDBC Driver loaded\
    \ successfully!\");\n        } catch (ClassNotFoundException e) {\n          \
    \  System.out.println(\"Failed to load JDBC Driver: \" + e.getMessage());\n  \
    \      }\n    }\n}\n```\n\n### 建立数据库连接\n\n加载 JDBC 驱动程序后，你可以使用 `DriverManager.getConnection()`\
    \ 建立到数据库的连接。\n\n**示例：**\n\n```java\nimport java.sql.*;\n\npublic class DBConnectionExample\
    \ {\n    public static void main(String[] args) {\n        String url = \"jdbc:mysql://localhost:3306/mydatabase\"\
    ;\n        String username = \"myusername\";\n        String password = \"mypassword\"\
    ;\n        try {\n            Connection connection = DriverManager.getConnection(url,\
    \ username, password);\n            System.out.println(\"Database connection established\
    \ successfully!\");\n        } catch (SQLException e) {\n            System.out.println(\"\
    Failed to establish database connection: \" + e.getMessage());\n        }\n  \
    \  }\n}\n```\n\n## 第三节：执行 SQL 查询\n\n### 执行语句\n\n一旦建立了数据库连接，你就可以创建一个 `Statement`\
    \ 对象来执行 SQL 查询。\n\n**示例：**\n\n```java\nimport java.sql.*;\n\npublic class SQLQueryExample\
    \ {\n    public static void main(String[] args) {\n        String url = \"jdbc:mysql://localhost:3306/mydatabase\"\
    ;\n        String username = \"myusername\";\n        String password = \"mypassword\"\
    ;\n        try {\n            Connection connection = DriverManager.getConnection(url,\
    \ username, password);\n            Statement statement = connection.createStatement();\n\
    \            String sql = \"SELECT * FROM employees\";\n            ResultSet\
    \ resultSet = statement.executeQuery(sql);\n            while (resultSet.next())\
    \ {\n                String name = resultSet.getString(\"name\");\n          \
    \      int age = resultSet.getInt(\"age\");\n                System.out.println(\"\
    Name: \" + name + \", Age: \" + age);\n            }\n            statement.close();\n\
    \            connection.close();\n        } catch (SQLException e) {\n       \
    \     System.out.println(\"Error executing SQL query: \" + e.getMessage());\n\
    \        }\n    }\n}\n```\n\n### 预编译语句 (Prepared Statements)\n\n预编译语句是执行 SQL 查询的一种高效方法，特别是对于参数化查询。\n\
    \n**示例：**\n\n```java\nimport java.sql.*;\n\npublic class PreparedStatementExample\
    \ {\n    public static void main(String[] args) {\n        String url = \"jdbc:mysql://localhost:3306/mydatabase\"\
    ;\n        String username = \"myusername\";\n        String password = \"mypassword\"\
    ;\n        try {\n            Connection connection = DriverManager.getConnection(url,\
    \ username, password);\n            String sql = \"INSERT INTO employees (name,\
    \ age) VALUES (?, ?)\";\n            PreparedStatement statement = connection.prepareStatement(sql);\n\
    \            statement.setString(1, \"John\");\n            statement.setInt(2,\
    \ 30);\n            statement.executeUpdate();\n            statement.setString(1,\
    \ \"Alice\");\n            statement.setInt(2, 28);\n            statement.executeUpdate();\n\
    \            statement.close();\n            connection.close();\n        } catch\
    \ (SQLException e) {\n            System.out.println(\"Error executing prepared\
    \ statement: \" + e.getMessage());\n        }\n    }\n}\n```\n\n## 第四节：数据库操作\n\
    \n### 插入数据\n\n要向数据库中插入数据，你可以使用 SQL `INSERT` 语句。\n\n**示例：**\n\n```java\nimport\
    \ java.sql.*;\n\npublic class InsertDataExample {\n    public static void main(String[]\
    \ args) {\n        String url = \"jdbc:mysql://localhost:3306/mydatabase\";\n\
    \        String username = \"myusername\";\n        String password = \"mypassword\"\
    ;\n        try {\n            Connection connection = DriverManager.getConnection(url,\
    \ username, password);\n            Statement statement = connection.createStatement();\n\
    \            String sql = \"INSERT INTO employees (name, age) VALUES ('John',\
    \ 30)\";\n            int rowsAffected = statement.executeUpdate(sql);\n     \
    \       System.out.println(rowsAffected + \" row(s) inserted.\");\n          \
    \  statement.close();\n            connection.close();\n        } catch (SQLException\
    \ e) {\n            System.out.println(\"Error inserting data: \" + e.getMessage());\n\
    \        }\n    }\n}\n```\n\n### 更新数据\n\n要更新数据库中的现有数据，你可以使用 SQL `UPDATE` 语句。\n\
    \n**示例：**\n\n```java\nimport java.sql.*;\n\npublic class UpdateDataExample {\n\
    \    public static void main(String[] args) {\n        String url = \"jdbc:mysql://localhost:3306/mydatabase\"\
    ;\n        String username = \"myusername\";\n        String password = \"mypassword\"\
    ;\n        try {\n            Connection connection = DriverManager.getConnection(url,\
    \ username, password);\n            Statement statement = connection.createStatement();\n\
    \            String sql = \"UPDATE employees SET age = 31 WHERE name = 'John'\"\
    ;\n            int rowsAffected = statement.executeUpdate(sql);\n            System.out.println(rowsAffected\
    \ + \" row(s) updated.\");\n            statement.close();\n            connection.close();\n\
    \        } catch (SQLException e) {\n            System.out.println(\"Error updating\
    \ data: \" + e.getMessage());\n        }\n    }\n}\n```\n\n### 删除数据\n\n要从数据库中删除数据，你可以使用\
    \ SQL `DELETE` 语句。\n\n**示例：**\n\n```java\nimport java.sql.*;\n\npublic class DeleteDataExample\
    \ {\n    public static void main(String[] args) {\n        String url = \"jdbc:mysql://localhost:3306/mydatabase\"\
    ;\n        String username = \"myusername\";\n        String password = \"mypassword\"\
    ;\n        try {\n            Connection connection = DriverManager.getConnection(url,\
    \ username, password);\n            Statement statement = connection.createStatement();\n\
    \            String sql = \"DELETE FROM employees WHERE name = 'John'\";\n   \
    \         int rowsAffected = statement.executeUpdate(sql);\n            System.out.println(rowsAffected\
    \ + \" row(s) deleted.\");\n            statement.close();\n            connection.close();\n\
    \        } catch (SQLException e) {\n            System.out.println(\"Error deleting\
    \ data: \" + e.getMessage());\n        }\n    }\n}\n```\n\n"
