    In this example, we have a superclass `Animal` with a `name` property and a `speak`
    method. The `Dog` class is a subclass of `Animal` and overrides the `speak` method
    to provide its own implementation. When we create objects of both classes and
    call the `speak` method, each object exhibits its own behavior.


    ### Constructors in Subclasses


    Subclasses can have their own constructors, and they can also call the constructor
    of the superclass using the `super` keyword. This allows you to initialize both
    the properties inherited from the superclass and the subclass-specific properties.


    ```dart


    class Vehicle {


    String brand;


    Vehicle(this.brand);


    void drive() {


    print("$brand is moving");


    }


    }


    class Car extends Vehicle {


    int doors;


    Car(String brand, this.doors) : super(brand); // Call the superclass constructor.


    void honk() {


    print("Honk honk!");


    }


    }


    void main() {


    // Create objects of the superclass and subclass.


    Vehicle vehicle = Vehicle("Generic Vehicle");


    Car car = Car("Toyota", 4);


    // Call methods on both objects.


    vehicle.drive(); // Outputs: Generic Vehicle is moving


    car.drive();     // Outputs: Toyota is moving


    car.honk();      // Outputs: Honk honk!


    }


    ```


    In this example, the `Car` class is a subclass of `Vehicle` and has its own property
    `doors`. The `Car` class calls the constructor of the superclass `Vehicle` using
    `super(brand)` to initialize the `brand` property inherited from `Vehicle`.


    ### The `super` Keyword


    The `super` keyword in Dart is used to refer to the superclass or to call methods
    and constructors from the superclass. It allows subclasses to access and utilize
    the properties and behaviors of their superclass.


    In the previous examples, we used `super` to call the constructor of the superclass
    to ensure that properties inherited from the superclass were properly initialized.


    ### Overriding Methods


    Subclasses can override (provide their own implementation for) methods inherited
    from the superclass. To override a method, you use the `@override` annotation
    before the method declaration in the subclass.


    ```dart


    class Shape {


    double area() {


    return 0.0; // Default implementation for all shapes.


    }


    }


    class Circle extends Shape {


    double radius;


    Circle(this.radius);


    @override


    double area() {


    return 3.14 * radius * radius;


    }


    }


    class Square extends Shape {


    double side;


    Square(this.side);


    @override


    double area() {


    return side * side;


    }


    }


    void main() {


    // Create objects of different shapes.


    Circle circle = Circle(5.0);


    Square square = Square(4.0);


    // Calculate and print the areas of the shapes.


    print("Circle Area: ${circle.area()}"); // Outputs: Circle Area: 78.5


    print("Square Area: ${square.area()}"); // Outputs: Square Area: 16.0


    }


    ```


    In this example, we have a `Shape` superclass with a default `area` method that
    returns `0.0`. The `Circle` and `Square` subclasses override the `area` method
    to provide their own implementations for calculating the area of circles and squares.


    ### The `is` and `as` Operators


    Dart provides two operators, `is` and `as`, for working with classes and type
    checking:


    - **`is` Operator**: The `is` operator checks whether an object is an instance
    of a particular class or implements a specific interface. It returns `true` if
    the object is an instance of the specified class or implements the interface;
    otherwise, it returns `false`.


    ```dart


    class Animal {}


    class Dog extends Animal {}


    void main() {


    Animal animal = Dog();


    if (animal is Dog) {


    print("It''s a Dog!");


    } else {


    print("It''s not a Dog.");


    }


    }


    ```


    In this example, we use the `is` operator to check if the `animal` object is an
    instance of the `Dog` class, and it prints "It''s a Dog!" because the `animal`
    object is indeed an instance of `Dog`.


    - **`as` Operator**: The `as` operator is used for type casting. It allows you
    to treat an object as an instance of a specified class or interface. If the object
    is not of the specified type, it returns `null`.


    ```dart


    class Animal {}


    class Dog extends Animal {


    void bark() {


    print("Woof!");


    }


    }


    void main() {


    Animal animal = Dog();


    Dog dog = animal as Dog;


    if (dog != null) {


    dog.bark(); // Outputs: Woof!


    }


    }


    ```


    In this example, we use the `as` operator to cast the `animal` object as a `Dog`.
    Since the `animal` object is indeed an instance of `Dog`, the cast is successful,
    and we can call the `bark` method on the `dog` variable.


    # # Chapter 7: Working with Collections in Dart


    In this chapter, we''ll explore the world of collections in Dart. Collections
    are essential data structures used to store and manipulate groups of values, such
    as lists, sets, and maps. Dart provides a rich set of collection classes and powerful
    features for working with data efficiently.


    ## Lists


    A list is an ordered collection of values, also known as elements, where each
    element is identified by an index. Lists in Dart are similar to arrays in other
    programming languages.


    ### Creating Lists


    In Dart, you can create a list using the `List` class or by using list literals,
    denoted by square brackets `[]`. List literals are the most common way to create
    lists.


    ```dart


    // Using list literals.


    var fruits = [''apple'', ''banana'', ''cherry''];


    // Using the List class constructor.


    var colors = List<String>.filled(3, ''red'');


    ```


    In this example, we create two lists: `fruits` and `colors`. The `fruits` list
    uses list literals, while the `colors` list is created using the `List` class
    constructor, specifying the type of the elements (`String`) and the initial size
    (3), with all elements initialized to `''red''`.


    ### Accessing List Elements


    You can access elements in a list by using their index. List indices start at
    0 for the first element and go up to `length - 1` for the last element.


    ```dart


    var fruits = [''apple'', ''banana'', ''cherry''];


    // Accessing elements by index.


    var firstFruit = fruits[0];    // ''apple''


    var secondFruit = fruits[1];   // ''banana''


    var lastFruit = fruits[fruits.length - 1]; // ''cherry''


    ```


    In this example, we access elements in the `fruits` list by index. `fruits[0]`
    retrieves the first element, `fruits[1]` retrieves the second element, and `fruits[fruits.length
    - 1]` retrieves the last element.


    ### Modifying Lists


    Lists in Dart are mutable, meaning you can change their elements after creation.
    You can assign a new value to an element using its index.


    ```dart


    var fruits = [''apple'', ''banana'', ''cherry''];


    // Modifying elements by index.


    fruits[1] = ''orange''; // Changing ''banana'' to ''orange''


    fruits[2] = ''grape'';  // Changing ''cherry'' to ''grape''


    ```


    In this example, we modify the `fruits` list by assigning new values to specific
    elements using their indices.


    ### Adding and Removing Elements


    Dart provides several methods for adding and removing elements from lists:


    - **Adding Elements**:


    - `add(element)`: Appends an element to the end of the list.


    - `insert(index, element)`: Inserts an element at the specified index.


    - `addAll(iterable)`: Appends all elements of the iterable to the end of the list.


    - **Removing Elements**:


    - `remove(element)`: Removes the first occurrence of the element from the list.


    - `removeAt(index)`: Removes the element at the specified index.


    - `removeLast()`: Removes and returns the last element of the list.


    - `removeWhere(predicate)`: Removes elements that satisfy the given predicate.


    - `clear()`: Removes all elements from the list.


    ```dart


    var numbers = [1, 2, 3];


    // Adding elements.


    numbers.add(4);          // [1, 2, 3, 4]


    numbers.insert(1, 5);    // [1, 5, 2, 3, 4]


    numbers.addAll([6, 7]);  // [1, 5, 2, 3, 4, 6, 7]


    // Removing elements.


    numbers.remove(3);            // [1, 5, 2, 4, 6, 7]


    numbers.removeAt(1);          // [1, 2, 4, 6, 7]


    numbers.removeLast();         // [1, 2, 4, 6]'
