    fruits['orange'] = 2.5;\n\n// Updating an existing entry.\nfruits['banana'] =\
    \ 1.2;\n\n// Removing an entry.\nfruits.remove('cherry');\n```\n\nIn this example,\
    \ we modify the `fruits` map by adding a new entry for `'orange'`, updating the\
    \ price of `'banana'`, and removing the entry for `'cherry'`.\n\n#### Iterating\
    \ Over Maps\n\nYou can iterate over the key-value pairs of a map using loops or\
    \ higher-order functions like `forEach`.\n\n```dart\nvar fruits = {\n  'apple':\
    \ 2.0,\n  'banana': 1.5,\n  'cherry': 3.0,\n};\n\n// Using a for-in loop.\nfor\
    \ (var entry in fruits.entries) {\n  var key = entry.key;\n  var value = entry.value;\n\
    \  print('$key: $value');\n}\n\n// Using forEach method.\nfruits.forEach((key,\
