    ### Inversion of Control (IoC)


    Inversion of Control is a design principle where control of object instantiation
    and management is shifted to a container (like Spring).


    ### Spring Boot


    Spring Boot is a subproject of Spring that simplifies the process of setting up
    and configuring Spring applications.


    **Example:**


    ```java


    // A simple Spring Boot application


    import org.springframework.boot.SpringApplication;


    import org.springframework.boot.autoconfigure.SpringBootApplication;


    @SpringBootApplication


    public class MyApplication {


    public static void main(String[] args) {


    SpringApplication.run(MyApplication.class, args);


    }


    }


    ```


    ## Section 3: Hibernate ORM


    ### Introduction to Hibernate


    Hibernate is an Object-Relational Mapping (ORM) framework that simplifies database
    interactions by mapping Java objects to database tables.


    ### Entity Classes


    Entity classes in Hibernate represent database tables, and each instance of an
    entity represents a row in the table.


    **Example:**


    ```java


    import javax.persistence.*;


    @Entity


    @Table(name = "employees")


    public class Employee {


    @Id


    @GeneratedValue(strategy = GenerationType.IDENTITY)


    private Long id;


    private String name;


    private int age;


    // Getters and setters


    }


    ```


    ### Session and Transaction Management


    Hibernate manages the interaction between Java objects and the database through
    sessions and transactions.


    **Example:**


    ```java


    Session session = sessionFactory.openSession();


    Transaction tx = session.beginTransaction();


    Employee employee = new Employee();


    employee.setName("John");


    employee.setAge(30);


    session.save(employee);


    tx.commit();


    session.close();


    ```


    ## Section 4: Apache Maven


    ### Introduction to Apache Maven


    Apache Maven is a build automation and dependency management tool for Java projects.


    ### Project Structure and pom.xml


    Maven follows a standard project structure, and all project configurations are
    managed in the `pom.xml` file.


    **Example: pom.xml**


    ```xml


    <project xmlns="http://maven.apache.org/POM/4.0.0"


    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"


    xsi:schemaLocation="http://maven.apache.org/POM/4.0.0


    http://maven.apache.org/xsd/maven-4.0.0.xsd">


    <modelVersion>4.0.0</modelVersion>


    <groupId>com.example</groupId>


    <artifactId>my-project</artifactId>


    <version>1.0-SNAPSHOT</version>


    <dependencies>


    <dependency>


    <groupId>org.springframework</groupId>


    <artifactId>spring-core</artifactId>


    <version>5.3.8</version>


    </dependency>


    </dependencies>


    </project>


    ```


    ### Maven Build Lifecycle


    Maven follows a build lifecycle with predefined phases like `compile`, `test`,
    `package`, `install`, etc.


    **Example:**


    ```bash


    # To compile the project


    mvn compile


    # To run tests


    mvn test


    # To create a JAR file


    mvn package


    # To install the JAR in the local Maven repository


    mvn install


    ```


    ## Section 5: Advanced Techniques


    ### Multithreading


    Java provides built-in support for multithreading, allowing concurrent execution
    of tasks.


    **Example:**


    ```java


    public class ThreadExample {


    public static void main(String[] args) {


    Thread thread1 = new Thread(() -> {


    for (int i = 0; i < 5; i++) {


    System.out.println("Thread 1 - Count: " + i);


    }


    });


    Thread thread2 = new Thread(() -> {


    for (int i = 0; i < 5; i++) {


    System.out.println("Thread 2 - Count: " + i);


    }


    });


    thread1.start();


    thread2.start();


    }


    }


    ```


    ### Java 8 Streams


    Java 8 introduced streams, which enable functional-style operations on collections.


    **Example:**


    ```java


    import java.util.Arrays;


    import java.util.List;


    public class StreamExample {


    public static void main(String[] args) {


    List<Integer> numbers = Arrays.asList(1, 2, 3, 4, 5);


    // Filtering and mapping using streams


    numbers.stream()


    .filter(n -> n % 2 == 0)


    .map(n -> n * n)


    .forEach(System.out::println);


    }


    }


    ```


    ### Annotations


    Annotations allow developers to add metadata and apply behavior to classes, methods,
    and fields.


    **Example:**


    ```java


    @Retention(RetentionPolicy.RUNTIME)


    @Target(ElementType.METHOD)


    public @interface Loggable {


    }


    ```


    ## Conclusion


    Java frameworks and advanced techniques provide powerful tools to enhance the
    development process, improve code quality, and build complex applications. In
    this chapter, we explored some of the most popular Java frameworks, including
    Spring and Hibernate, as well as essential tools like Apache Maven. Additionally,
    we covered advanced techniques like multithreading, Java 8 streams, and annotations.
    Armed with this knowledge, you can efficiently develop Java applications, leverage
    existing libraries, and apply best practices to create robust and scalable software
    solutions.


    HAPPY CODING


    THANK YOU

