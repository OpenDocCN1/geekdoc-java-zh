    ## Dart 中的集成测试


    集成测试涉及测试应用程序不同部分或单元之间的交互。对于 Flutter ，Dart 提供了使用 `flutter_test` 包编写集成测试的工具。


    ### 编写集成测试


    要为 Flutter 应用创建 Dart 集成测试，请遵循以下步骤：


    1. 在你的测试文件中导入 `package:flutter_test/flutter_test.dart` 包。


