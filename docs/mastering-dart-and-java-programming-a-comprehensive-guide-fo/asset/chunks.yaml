    ### Function Scope


    Functions in Dart have their own scope, which means that variables declared within
    a function are not accessible outside of that function. This is known as variable
    scope, and it helps prevent naming conflicts and keeps your code organized.


    Consider this example:


    ```dart


    void main() {


    int x = 10; // This variable is in the scope of the main function.


    void innerFunction() {


    int y = 5; // This variable is in the scope of the innerFunction.


    print(x); // Accessing the variable x from the outer scope.


    }


    innerFunction();


    print(y); // Error: The variable y is not in scope here.


    }


    ```


    In this example, the variable `x` is declared in the `main` function''s scope
    and is accessible both in the `main` function and the `innerFunction`. However,
    the variable `y` is declared in the `innerFunction`''s scope and is not accessible
    in the `main` function.


    ### Function Parameters vs. Variables


    It''s important to understand the difference between function parameters and variables
    declared within a function. Function parameters are placeholders for values passed
    to the function when calling it. They have a scope limited to the function''s
    body and are accessible only within the function. On the other hand, variables
    declared within a function are separate from parameters and have their own scope.


    Here''s an example illustrating the distinction:


    ```dart


    void printNumbers(int a, int b) {


    int x = a + b; // Variable x is declared within the function.


    print(a);     // Accessing parameter a.


    print(b);     // Accessing parameter b.


    print(x);     // Accessing variable x.


    }


    void main() {


    int a = 3;


    int b = 7;


    printNumbers(a, b); // Call the function with arguments a and b.


    print(a);           // Accessing variable a from the main function.


    print(b);           // Accessing variable b from the main function.


    print(x);           // Error: Variable x is not in scope here.


    }


    ```


    In this example, `a` and `b` are function parameters, and `x` is a variable declared
    within the `printNumbers` function. The parameters `a` and `b` are accessible
    only within the `printNumbers` function, while the variables declared within that
    function are not accessible in the `main` function.


    ## Methods in Dart


    ### What are Methods?


    In Dart, a method is a function that is associated with an object or class. Methods
    define the behavior of objects and allow you to perform actions specific to those
    objects. Methods are a fundamental concept in object-oriented programming (OOP)
    and play a central role in defining the behavior of classes.


    Here''s the basic syntax of a method within a


    class:


    ```dart


    returnType methodName(parameters) {


    // Method body with instructions.


    // Optionally, return a value of the specified returnType.


    }


    ```


    ### Creating and Using Methods


    To create and use methods in Dart, you typically define them within a class. A
    class is a blueprint for creating objects, and methods define what those objects
    can do.


    Here''s an example of a simple Dart class with a method:


    ```dart


    class Dog {


    String name;


    // Constructor to initialize the dog''s name.


    Dog(this.name);


    // Method to bark.


    void bark() {


    print("$name says Woof!");


    }


    }


    void main() {


    // Create a Dog object and call its bark method.


    Dog myDog = Dog("Buddy");


    myDog.bark(); // Outputs: Buddy says Woof!


    }


    ```


    In this example:


    - We define a class `Dog` with a constructor that takes the dog''s name as a parameter.
    The class also has a method called `bark`, which prints a message with the dog''s
    name.


    - In the `main` function, we create a `Dog` object named `myDog` and call its
    `bark` method. This results in the message "Buddy says Woof!" being printed to
    the console.


    ### Instance Methods vs. Static Methods


    In Dart, there are two types of methods: instance methods and static methods.


    - **Instance Methods**: These methods are associated with instances (objects)
    of a class. They can access and modify the instance''s properties (attributes)
    and are often used to define the behavior of objects.


    - **Static Methods**: Static methods are not tied to a specific instance but are
    associated with the class itself. They cannot access instance-specific properties
    but can perform tasks that are related to the class as a whole.


    Here''s an example that demonstrates both instance and static methods:


    ```dart


    class MathUtils {


    // Instance method to add two numbers.


    int add(int a, int b) {


    return a + b;


    }


    // Static method to compute the square of a number.


    static int square(int x) {


    return x * x;


    }


    }


    void main() {


    MathUtils math = MathUtils();


    int sum = math.add(3, 5);


    print("Sum: $sum"); // Outputs: Sum: 8


    int squared = MathUtils.square(4);


    print("Square: $squared"); // Outputs: Square: 16


    }


    ```


    In this example:


    - The `MathUtils` class defines an instance method `add` for adding two numbers
    and a static method `square` for computing the square of a number.


    - In the `main` function, we create an instance of the `MathUtils` class and use
    the instance method `add` to add two numbers (`3` and `5`). We also use the static
    method `square` to compute the square of `4`. Both methods serve different purposes:
    `add` operates on instances with specific values, while `square` is a general
    utility method that doesn''t require an instance.


    ### The `this` Keyword


    In Dart, the `this` keyword refers to the current instance of an object within
    a method or constructor. It allows you to access instance variables and call other
    instance methods.


    Here''s an example illustrating the use of `this`:


    ```dart


    class Circle {


    double radius;


    Circle(this.radius);


    // Method to calculate the area of the circle.


    double calculateArea() {


    return 3.14 * this.radius * this.radius;


    }


    }


    void main() {


    Circle myCircle = Circle(5.0);


    double area = myCircle.calculateArea();


    print("The area of the circle is $area square units.");


    }


    ```


    In this example:


    - We define a `Circle` class with a constructor that initializes the `radius`
    property.


    - The `calculateArea` method uses `this` to access the `radius` property of the
    current instance when calculating the area of the circle.


    - In the `main` function, we create a `Circle` object and call its `calculateArea`
    method, which uses `this` to access the `radius` property of that specific circle
    instance.


    ### Method Chaining


    Method chaining is a technique in Dart (and many other programming languages)
    that allows you to call multiple methods on an object in a single line. This can
    lead to more concise and readable code.


    Here''s an example of method chaining:


    ```dart


    class StringBuilder {


    String _value = "";


    StringBuilder add(String text) {


    _value += text;


    return this; // Return the current instance for chaining.


