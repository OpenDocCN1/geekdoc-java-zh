  trans: "\n\n在本示例中，我们演示了两种遍历 `fruits` 映射并打印其键值对的方法。\n\n# 第 8 章：Dart 中的错误处理与异常\n\n\
    在本章中，我们将探索 Dart 中错误处理和异常的世界。错误是软件开发中的常见部分，理解如何优雅地处理它们对于构建健壮可靠的应用程序至关重要。Dart 提供了全面的异常处理机制，帮助你有效地识别、处理和从错误中恢复。\n\
    \n## 理解错误与异常\n\n### 什么是错误和异常\n\n在编程中，错误是程序执行过程中发生的中断其正常流程的意外事件或条件。这些错误可能由多种因素引起，例如无效输入、硬件故障或代码本身的问题。处理错误对于防止崩溃并确保程序在出现问题时能够继续运行至关重要。\n\
    \n另一方面，异常是当程序遇到正常流程无法处理的异常情况时发生的特定错误。异常由程序抛出，可以由开发者捕获并处理，以防止程序意外终止。\n\n### Dart\
    \ 的异常层次\n\nDart 拥有丰富的异常层次结构，根据类型和来源对异常进行分类。层次结构的顶端是 `Error` 类，它代表最通用形式的运行时错误。在\
    \ `Error` 之下，有几个内置异常类，如 `Exception`、`FormatException` 和 `StateError`，每个类都有特定的用途。\n\
    \n以下是 Dart 中一些常见的异常类：\n\n- `Exception`: 所有不表示错误的异常的基类。\n- `FormatException`:当字符串无法解析时抛出，例如将字符串转换为数值类型。\n\
    - `StateError`:表示程序中存在无效状态。\n- `TypeError`:当对不兼容类型的对象执行操作时抛出。\n- `RangeError`:表示索引或值超出范围。\n\
    - `AssertionError`:当断言失败时抛出。\n\n通过使用适当的异常类，你可以对错误进行分类并处理它们。\n\n## 处理异常\n\n###\
    \ `try`、`catch` 和 `finally` 块\n\nDart 提供了一种 `try`、`catch` 和 `finally` 块来结构化处理异常。\n\
    \n- `try` 块包含可能抛出异常的代码。\n- `catch` 块用于捕获和处理异常。\n- `finally` 块无论是否抛出异常都包含将执行的代码。\n\
    \n以下是 Dart 异常处理的基本语法：\n\n```dart\ntry {\n  // 可能抛出异常的代码。\n} catch (exception)\
    \ {\n  // 处理异常的代码。\n} finally {\n  // 无论是否抛出异常都会运行的代码。\n}\n```\n\n让我们来看一个示例：\n\
    \n```dart\nvoid main() {\n  try {\n    var result = 10 / 0; // 尝试除以零。\n    print(\"\
    Result: $result\");\n  } catch (e) {\n    print(\"Error: $e\");\n  } finally {\n\
    \    print(\"Execution completed.\");\n  }\n}\n```\n\n在本示例中，`try` 块包含一个将抛出异常的操作，因为除以零是不允许的。`catch`\
    \ 块捕获了该异常，而 `finally` 块始终执行，确保程序继续运行。\n\n### 捕获特定异常\n\n你可以通过在 `catch` 块中指定异常类型来捕获特定异常。这允许你以不同的方式处理不同类型的异常。\n\
    \n```dart\nvoid main() {\n  try {\n    var result = 10 / 0; // 尝试除以零。\n    print(\"\
    Result: $result\");\n  } on DivisionByZero {\n    print(\"Cannot divide by zero.\"\
    );\n  } catch (e) {\n    print(\"Error: $e\");\n  } finally {\n    print(\"Execution\
    \ completed.\");\n  }\n}\n```\n\n在修改后的示例中，我们使用 `on DivisionByZero` 来捕获特定的异常类型。这样，我们可以提供更信息丰富的错误消息。\n\
    \n### 重新抛出异常\n\n有时，你可能想捕获异常，执行某些操作，然后重新抛出该异常以将其进一步传播到调用栈顶部。Dart 允许你在 `catch` 块中使用\
    \ `rethrow` 关键字重新抛出异常。\n\n```dart\nvoid validateAge(int age) {\n  try {\n    if\
    \ (age < 0) {\n      throw FormatException(\"年龄不能为负数.\");\n    }\n  } catch (e)\
    \ {\n    print(\"Validation failed: $e\");\n    rethrow; // 重新抛出异常。\n  }\n}\n\n\
    void main() {\n  try {\n    validateAge(-5); // 调用一个抛出异常的函数。\n  } catch (e) {\n\
    \    print(\"Error: $e\");\n  }\n}\n```\n\n在本示例中，`validateAge` 函数检查提供的年龄是否为负数，如果是，则抛出\
    \ `FormatException`。`catch` 块中的 `rethrow` 语句允许异常传播到调用代码，保留原始异常信息。\n\n### 自定义异常\n\
    \n除了内置异常外，Dart 允许你通过扩展 `Exception` 类或其子类来创建自定义异常。当你需要在应用程序中表示特定的错误条件时，自定义异常是非常有用的。\n\
    \n```dart\nclass CustomException implements Exception {\n  final String message;\n\
    \  CustomException(this.message);\n\n  @override\n  String toString() => message;\n\
    }\n\nvoid main() {\n  try {\n    throw CustomException(\"这是一个自定义异常.\");\n  } catch\
    \ (e) {\n    print(\"Caught custom exception: $e\");\n  }\n}\n```\n\n在本示例中，我们定义了一个实现\
    \ `Exception` 的 `CustomException` 类。我们提供了一个接受消息的构造函数，并重写了 `toString` 方法以便打印异常时返回消息。自定义异常允许你为应用程序创建有意义且信息丰富的错误消息。\n\
    \n## 异常传播\n\n当 Dart 程序中抛出异常时，它会开始寻找可以处理它的 `catch` 块。如果当前函数没有匹配的异常类型的 `catch` 块，异常将向上调用栈传播，直到找到最近的\
    \ `try-catch` 块。如果没有找到合适的 `catch` 块，程序将由于未处理的异常而终止。\n\n```dart\nvoid innerFunction()\
    \ {\n  throw Exception(\"innerFunction 中发生了错误.\");\n}\n\nvoid outerFunction()\
    \ {\n  try {\n    innerFunction();\n  } catch (e) {\n    print(\"在 outerFunction\
    \ 中捕获到异常: $e\");\n  }\n}\n\nvoid main() {\n  outerFunction();\n}\n```\n\n在本示例中，异常在\
    \ `innerFunction` 中抛出，但在 `outerFunction` 的 `catch` 块中被捕获处理。这防止了程序因未处理的异常而终止。\n\
    \n## 断言\n\n断言是一种检查程序执行过程中某些条件是否成立的方法。Dart 提供了两种断言：\n\n- `assert` 语句用于断言条件为真。如果条件为假，它将抛出\
    \ `AssertionError`。它通常用于调试和开发，在生产代码中会被移除。\n\n```dart\nvoid divide(int a, int b)\
    \ {\n  assert(b != 0, \"不允许除以零.\");\n  print(\"Result: ${a / b}\");\n}\n\nvoid\
    \ main() {\n  divide(10, 0); // 在调试模式下抛出 AssertionError。\n}\n```\n\n## 总结\n\n\
    集合是 Dart 编程中的基础，允许你高效地存储、操作和组织数据。在本章中，我们探索了列表（List）、集合（Set）和映射（Map），这些是 Dart 中主要的集合类型。我们学习了如何在这些集合中创建、修改、访问和遍历元素，以及对集合执行各种操作以及集合集合操作。理解这些集合类型及其操作对于构建复杂的\
    \ Dart 应用程序至关重要。\n\n"
