    ## 第 4 节：布局管理\n\n### 布局管理简介\n\nJava 中的布局管理器有助于在容器内排列组件，确保适当调整大小调整和定位。\n\n### Swing\
    \ 布局管理器\n\nSwing 提供了各种布局管理器，包括 `FlowLayout`、`BorderLayout`、`GridLayout` 等。\n\n\
    ### JavaFX 布局管理\n\nJavaFX 提供了布局窗，如 `StackPane`、`HBox`、`VBox`、`BorderPane` 等，用于控制组件排列。\n\
