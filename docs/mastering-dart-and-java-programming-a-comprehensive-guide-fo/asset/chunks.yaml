    \    }\n}\n```\n\n### JavaFX 组件\n\nJavaFX 提供了广泛组件，包括布局、控件、图表、媒体等。\n\n### JavaFX\
    \ 中的事件处理\n\nJavaFX 使用与 Swing 的事件处理器来处理用户交互。\n\n**示例：ButtonClickExampleJavaFX.java**\n\
    \n```java\nimport javafx.application.Application;\nimport javafx.scene.Scene;\n\
