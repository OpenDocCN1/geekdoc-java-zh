    # Paint Styles in Java2D


    # Paint Styles: Overview


    When you fill a Shape, the current Paint attribute of the Graphics2D object is
    used. This can be a Colour (solid colour), a GradientPaint (gradient fill gradually
    combining two colours), a TexturePaint (tiled image), or a new version of Paint
    that you write yourself. Use setPaint and getPaint to change and retrieve the
    Paint settings. Note that setPaint and getPaint supersede the setColor and getColor
    methods that were used in Graphics.


    # Paint Classes


    Arguments to the Graphics2D setPaint method (and return values of getPaint) must
    implement the Paint interface.


    Here are the major built-in Paint classes:


    +   - Colour: Has the same constants (Colour. red, Colour. yellow, etc.) as the
    AWT version, plus some extra constructors'
