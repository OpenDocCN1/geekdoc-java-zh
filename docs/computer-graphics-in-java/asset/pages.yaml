  md: 'has three phosphor colour dots at each pixel position. One phosphor dot emits
    a red light, another emits a green light, and the third emits a blue light. This
    type of CRT has three electron guns, for each colour dot and a shadow-mask grid
    just behind the phosphor-coated screen. We obtain colour variations in a shadow-mask
    CRT by varying the intensity levels of the three electron beams. By turning off
    the red and green guns, we get only the colour coming from the blue phosphor.
    A white area is the result of activating all three dots with equal intensity.


    # Direct-View StorageTubes


    An alternative method for maintaining a screen image is to store the picture information
    inside the CRT instead of refreshing the screen. A direct-view storage tube (DVST)
    stores the picture information as a charge distribution just behind the phosphor-coated
    screen. Two electron guns are used in a DVST. One, the primary gun, is used to
    store the picture; second, the flood gun, maintains the picture display. A DVST
    monitor has both disadvantages and advantages compared to the refresh CRT. Because
    no refreshing is needed, very complex pictures can be displayed at very high resolutions
    without flicker.


    The disadvantages of DVST systems are that they ordinarily not display colour
    and that selected parts of a picture cannot be erased. The entire screen must
    be erased and the modified picture redrawn. The erasing and redrawing process
    can take several seconds for a complex picture.


    # Flat-Panel Displays


    The term flat-panel display refers to a class of video devices'
