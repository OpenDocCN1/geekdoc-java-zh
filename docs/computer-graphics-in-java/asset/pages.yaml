  md: '# Computer Graphics in Java


    a 3D model is to take a simple object, called a primitive, and extend or “grow”
    it into a shape that can be refined and detailed. Primitives can be anything from
    a single point (called a vertex), a two-dimensional line (an edge), a curve (a
    spline), to three dimensional objects (faces or polygons). Using the specific
    features of your chosen 3D software, each one of these primitives can be manipulated
    to produce an object. When you create a model in 3D, you''ll usually learn one
    method to create your model, and go back to it time again when you need to create
    new models. There are three basic methods you can use to create a 3D model, and
    3D artists who should understand how to create a model using each technique.


    +   * Spline or Patch Modelling: A spline is a curve in 3D space defined by at
    least two control points. The most common splines used in 3D art are bezier curves
    and NURBS (the software Maya has a strong NURBS foundation.) Using splines to
    create a model is perhaps the oldest, most traditional form of 3D modelling available.
    A cage of splines is created to form a “skeleton” of the object you want to create.
    The software can then create a patch of polygons to extend between two splines,
    forming a 3D skin around the shape. Spine modelling is not used often these days
    for character creation, due to how long it takes to create good models. The models
    that are produced usually aren''t useful for animation without a lot of modification.
    Spline modelling is used primarily for the creation of hard objects, like cars,
    buildings, and furniture.'
