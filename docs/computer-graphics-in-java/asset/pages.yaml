  md: '# Displaying graphics on a component


    Now that you have a Canvas (an area to display graphics on) how do you actually
    display those graphics? With the paint() method of the Frame class. The paint()
    method takes one attribute-an instance of the Graphics class. The Graphics class
    contain methods which are used for displaying graphics. The Graphics class lets
    a component draw on itself.


    Syntax:


    ```

    public void paint(Graphics g)//methods for drawing graphics

    ;

    ```


    # Drawing Lines


    To draw lines, the drawLine() method of the Graphics class is used. This method
    takes four numeric attributes-the first two indicating the x/y starting point
    of the line, the last two indicating the x/y ending point of the line.


    Example:


    ```

    public void paint(Graphics g)//draw a line starting at point 10, 10 and ending
    at point 50, 50. g. drawLine(10, 10, 50, 50); }

    ```


    # Drawing Rectangles


    To draw rectangles, the drawRect() method is used. This method takes four numeric
    attributes-the first two indicating the x/y starting point of the rectangle, the
    last two indicating the width and height of the rectangle.


    Example:


    ```

    Public void paint(Graphics g)//draw a rectangle starting at 100, 100 width a width
    and height of 80 g. drawRect(100, 100, 80, 80); }

    ```'
