  md: '# The CRT


    The basic arrangement of CRT. At the narrow end of a sealed conical glass tube
    is an electron gun that emits a high velocity, finely focused beam of electrons.
    The other end, the face of the CRT, is more or less flat and is coated on the
    inside with phosphor, which glows when the electron beam strikes it. The energy
    of the beam can be controlled so as to vary the intensity of light output and
    when necessary to cut off the light altogether. A yoke or system of electromagnetic
    coils is mounted on the outside of the tube at the base of the neck: it deflects
    the electron beam to different parts of the tube face when currents pass through
    the coils. The light output of the CRT''s phosphor falls off rapidly after the
    electron beam has passed by and a steady picture is maintained by tracing it out
    rapidly and repeatedly; generally this refresh process is performed at least 30
    times a second.


    # Electron Gun


    Electron gun makes use of electrostatic fields to focus and accelerate the electron
    beam. A field is generated when two surfaces are raised to different potentials;
    electrons within the field tend to travel towards the surface with the more positive
    potential. The force attracting the electron is directly proportional to the field
    potential.


    The purpose of the electron gun in the CRT is to produce an electron beam with
    the following properties:


    +   * It must be accurately focused so that it produces a sharp spot of light
    where it strikes the phosphor.

    * It must have high velocity, since, the brightness of the image depends on the
    velocity of the electron beam.'
