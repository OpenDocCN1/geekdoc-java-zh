  md: "# Computer Graphics in Java\n\nBufferedImage and a Rectangle2D as arguments.\
    \ The BufferedImage specifies what to draw, the Rectangle2D specifies where the\
    \ tiling starts. Creating a BufferedImage to hold custom drawing is relatively\
    \ straightforward: call the BufferedImage constructor with a width, a height,\
    \ and a type of BufferedImage. TYPE_INT_RGB, then call createGraphics on that\
    \ to get a Graphics2D with which to draw. It is a bit harder to create one from\
    \ an image file. First load an Image from an image file, then create an empty\
    \ BufferedImage using the Image width and height, then get the Graphics2D via\
    \ createGraphics, then draw the Image onto the BufferedImage.\n\nNote, however,\
    \ as of JDK1.2beta4, tiled images fail when using conjunction with rotation transformations.\n\
    \n# Tiled Images as File Patterns: Example Code\n\n```\nTiledImages.java\nimport\
