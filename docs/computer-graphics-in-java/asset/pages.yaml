  md: '# The GFillable, GResizable, and GScalable Interfaces


    You have probably noticed that several of the examples you''ve already seen in
    this tutorial include methods that do not appear. For example, the FeltBoard programme
    includes calls to a setFilled method to mark the rectangle and oval as filled
    rather than outlined. It appears that the GOb class does not include a setFilled
    method, which is indeed the case.


    As the caption makes clear, the methods listed in that table are the ones that
    are common to every GObject subclass. While it is always possible to set the location
    of a graphical object, it is only possible to fill that if the idea of “filling”
    makes sense for that class.


    Filling is easily defined for geometrical shapes such as ovals, rectangles, polygons,
    and arcs, but it is not clear what it might fill a line, an image, or a label.
    Since there are subclasses that cannot give a meaningful interpretation to setFilled,
    that method is not defined at the GObject level but is instead implemented only
    for those subclasses for which filling is defined.


    At the same time, it is important to define the setFilled method so that it works
    the same way for any class that implements it. If setFilled, for example, worked
    differently in the GRect and GOval classes, trying to keep track of the different
    styles would inevitably cause confusion. To ensure that the model for filled shapes
    remains consistent, the methods that support filling are defined in an interface
    called GFillable, which specifies the behaviour of an fillable object. In addition
    to the setFilled method that you have already seen, the GFillable interface defines
    an isFilled method that tests whether the object is filled, a setFillColor method
