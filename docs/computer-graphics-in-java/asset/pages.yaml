    bears a lot of resemblance to traditional sculpting. In box modelling, one starts
    with a primitive (usually a cube) and begins adding detail by "slicing" the cube
    into pieces and extending faces of the cube to gradually create the form you''re
    after. People use box modelling to create the basic shape of the model. Once practised,
    the technique is very quick to get acceptable results. The downside is that the
    technique requires a lot of tweaking of the model along the way. Also, it is difficult
