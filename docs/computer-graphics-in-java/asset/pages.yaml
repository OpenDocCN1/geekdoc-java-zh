  md: '# 1


    # # Introduction to Computer Graphics in Java


    Although computer graphics is a vast field that encompasses almost any graphical
    aspect, we are mainly interested in the generation of images of 3-dimensional
    scenes. Computer imagery has applications for film special effects, simulation
    and training, games, medical imagery, flying logos. Computer graphics relies on
    an internal model of the scene, that is, a mathematical representation suitable
    for graphical computations. The model describes the 3D shapes, layout and materials
    of the scene.


    This 3D representation then has to be projected to compute a 2D image from a given
    viewpoint, this is the rendering step. Rendering involves projecting the objects
    (perspective), handling visibility (which parts of objects are hidden) and computing
    their appearance and lighting interactions. Finally, for animated sequence, the
    motion of objects has to be specified. We will not discuss animation in this document.'
  merge: -1
