- img_proc: true
  md: 'Each DBMS has its own functions for getting information about table layouts
    and database features. JDBC provides the interface DatabaseMetaData, which a driver
    writer must implement so that its methods return information about the driver
    and/or DBMS for which the driver is written. For example, a large number of methods
    return whether or not the driver supports a particular functionality. This interface
    gives users tools a standardised way to get metadata.


    In general, developers writing tools and drivers are the ones most likely to be
    concerned with metadata.'
