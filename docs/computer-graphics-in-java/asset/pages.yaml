    # Random-scan Systems


    The organization of a simple random-scan system. An application Programme is input
    and stored in the system memory along a graphics package. Graphics commands in
    the application Programme are translated by the graphics package into a display
    file stored in the system memory. This display file is then accessed by the display
    processor to refresh the screen. The display processor cycles through each command
    in the display file Programme once during every refresh cycle. Sometimes the display
    processor in a random-scan system is referred to as a display processing or a
    graphics controller.


    Lines are defined by the values for their co-ordinate endpoints, and these input
    co-ordinate values are converted to x and y deflection voltages. A scene is then
    drawn one line at a time by positioning the beam to fill in the line between specified
    endpoints.'
