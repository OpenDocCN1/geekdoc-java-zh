  md: "# Introduction to Java2D\n\nIn Java 1. 2, the paintComponent method is supplied\
    \ with a Graphics2D object (a subclass of Graphics), which contains a much richer\
    \ set of drawing operations. It includes pen widths, dashed lines, image and gradient\
    \ colour fill patterns, the use of arbitrary local fonts, a floating point coordinate\
    \ system, and a number of coordinate transformation operations. However, to maintain\
    \ compatibility with Swing in Java 1.1, the declared type of the paint argument\
    \ is Graphics, so you have to cast it to Graphics2D before using it.\n\nJava 1.\
