  md: '# Representing Numbers


    Focusing on numbers, all numbers can be represented by the positional notation
    system. The $b$-ary positional representation system uses the position of digits
    ranging from 0 to $b-1$ to denote a number. The quantity $b$ is known as the $base$
    of the system. Mathematically, positional systems represent the positive integer
    $n$ as


    $\Delta d_k, d_k \in \{0, \dots, b-1\$\$

    $$n = \sum_{k=0}^{\infty} (d_k b^k)$$


    and succinctly express $n$ in base-$b$ as $n_b=d_N d_{N-1}\dots d_0$. The number
    25 in base 10 equals $2 \times 10^1 + 5 \times 10^0$, so that the $digits$ representing
    this number are $d_1=5, d_1=2$, and all other $d_k$ equal zero. This number in
    $binary$ (base 2) equals 11001 $(1 \times 2^4 + 1 \times 2^3 + 0 \times 2^2 +
    0 \times 2^1 + 1 \times 2^0)$ and in hexadecimal (base 16). Fractions between
    zero and one are represented the same way.


    $\Delta d_k, d_k \in \{0, \dots, b-1\$\$

    $$f = \sum_{k=-\infty}^{-1} (d_k b^k)$$


    All numbers can be represented by their sign, integer and fractional parts. Complex
    numbers can be thought of as two real numbers that obey special rules to manipulate
    them.


    Humans use base 10, commonly assumed to be due to having ten fingers. Digital
    computers use the base 2 or $binary$ number representation, each digit of which
    is known as a $bit$ ($binary$ digit).'
