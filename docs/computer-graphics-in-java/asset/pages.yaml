  md: 'that have reduced volume, weight and power requirements compared to a CRT.
    Flat panel displays into two categories: emissive displays and non-emissive displays.
    The emissive displays are devices that convert electrical energy into light. Plasma
    panels, thin-film electroluminescent displays, and light emitting diodes are examples
    of emissive displays. Non-emissive displays use optical effects to convert sunlight
    or light from some other source into graphics patterns. The most important example
    of a non-emissive flat-panel display is a liquid crystal device.


    Plasma panels also called gas-discharge displays are constructed by filling the
    region between two glass plates with a mixture of gases that usually includes
    neon. A series of vertical conducting ribbons is placed on one glass panel, and
    a set of horizontal ribbons is built into the other glass panel. Firing voltages
    applied to a pair of horizontal and vertical conductors cause the gas at the intersection
    of the two conductors to break down into glowing plasma of electrons and ions.
    Picture definition is stored in a refresh buffer, and the firing voltages are
    applied to refresh the pixel positions 60 times per second. One disadvantage of
    plasma panels has been that they were strictly monochromatic devices, but systems
    have been developed that are now capable of displaying colour and grayscale.


