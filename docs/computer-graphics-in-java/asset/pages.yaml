  md: '# Computer Graphics in Java


    pen colour or pattern (via setPaint, as discussed in the previous section), Java2D
    permits you to set the pen thickness and dashing pattern, and to specify the line
    segments end and are joined together. You do this by creating a BasicStroke object,
    then telling the Graphics2D object to use it via the setStroke method.


    # Stroke Attributes


    Arguments to setStroke must implement the Stroke interface, and the BasicStroke
    class is the sole builtin class that implements Stroke.


    Here are the BasicStroke constructors:


    +   - BasicStroke(): Creates a BasicStroke with a pen width of 1, 0, the default
    style of CAP_SQUARE, and the default join style of JOIN_MITER. See the following
    examples of pen widths and cap/join styles. Stroke(float penWidth): Uses the specified
    pen width and the default cap/join styles (CAP_SQUARE and JOIN_MITER).

    - BasicStroke(float penWidth, int capStyle, int joinStyle): Uses the specified
    pen width, cap style, and join style. The cap style can be one of CAP_SQUARE (make
    a square cap that extends the pen end by half pen width—this is the default),
    CAP_BUT (cut off segment exactly at end point—use this for dashed lines), or CAP_ROUND
    (make a circular cap centered on the end point, with a diameter of the pen width).
    The join style can be one of JOIN_MITER (extend outside edges of lines until they
    meet—this is the default, JOIN_BEVEL (connect corners of outlines with straight
    line), or JOIN_ROUND (round off corner with circle with diameter equal to the
    pen width).'
