  md: '# Computer Graphics in Java


    before computers could render them in real-time. Today, 3D models are used in
    a wide variety of fields. The medical industry uses detailed models of organs.
    The movie industry uses them as characters and objects for animated and real-life
    motion pictures.


    The video game industry uses them as assets for computer and video games. The
    science sector uses them as highly detailed models of chemical compounds. The
    architecture industry uses them to demonstrate proposed buildings and landscapes
    through Software Architectural Models. The engineering community uses them as
    designs of new devices, vehicles and structures as well as a host of other users.
    In recent decades the earth science community has started to construct 3D geological
    models as a standard practice.


    # Representation


    Almost all 3D models can be divided into two categories.


    +   - Solid - These models define the volume of the object they represent (like
    a rock). These are more realistic, but more difficult to build. Solid models are
    mostly used for nonsimual simulations such as medical and engineering simulations,
    for CAD and specialized visual applications such as ray tracing and constructive
    solid geometry

    - Shell/boundary - these models represent the surface, e.g. the boundary of the
    object, not its volume (like an infinites thin eggshell). These are easier to
    work with than solid models. Almost all visual models used in games and film are
    shell models.'
