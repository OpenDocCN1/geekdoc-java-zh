    say "I have a 1 GHz computer," you mean that your computer takes 1 nanosecond
    to perform each step. That is incredibly fast! A "step" does not, unfortunately,
    necessarily mean a computation like an addition; computers break computations
    down into several stages, which means that the clock speed need not express the
    computational speed. Computational speed is expressed in units of instructions/second
    (Mips). Your 1 GHz computer (clock speed) may have a computational speed of 200
    Mips.


