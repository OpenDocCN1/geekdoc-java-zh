    # 3D Modeling


    In 3D computer graphics, 3D modeling (also known as meshing) is the process of
    developing a mathematical representation of any three-dimensional surface of object
    (either inanimate or living) via specialized software. The product is called a
    3D model. It can be displayed as a two-dimensional image through a process called
    3D rendering or used in a computer simulation of physical phenomena. The model
    can also be physically created using 3D Printing devices. Models may be created
    automatically or manually. The manual modeling process of preparing geometric
    data for 3D computer graphics is similar to plastic arts such as sculpting.


    # Models


    3D models represent a 3D object using a collection of points in 3D space, connected
    by various geometric entities such as triangles, curved surfaces, etc. Being a
    collection of data (points and other information), 3D models can be created by
    hand, algorithmically (procedural modeling), or scanned. 3D models are widely
    used anywhere in 3D graphics. Actually, their use predates the widespread use
    of 3D graphics on personal computers. Many computer games used pre-rendered images
    of 3D models as sprites'
  merge: -1
