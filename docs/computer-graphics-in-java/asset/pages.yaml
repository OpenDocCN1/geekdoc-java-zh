    with, poly modelling is perhaps the most effective and precise technique. In poly
    modelling, one creates a 3D mesh point-by-point, face-by-face. Often one will
    start out with a single quad (a 3D object consisting of 4 points) and extrude
    an edge of the quad, creating a second quad attached to the first. The 3D model
