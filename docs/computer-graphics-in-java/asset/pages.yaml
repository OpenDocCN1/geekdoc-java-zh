    # The GPoint, GDimension, and GRectangle Classes


    Although it is usually possible to specify individual values for coordinate values,
    it is often convenient to encapsulate an x and y coordinate as a point, a width
    and a height value as a composite indication of the dimensions of an object, or
    all four values as the bounding rectangle for a figure. Because the coordinates
    are stored as doubles in the acm.graphics package, using Java''s integer-based
    Point, Dimension, and Rectangle classes would entail a loss of precision. To avoid
    this problem the acm.graphics package exports the classes GPoint, GDimension,
    and GRectangle, which have the same semantics as their standard counterparts except
    for the fact that their coordinates are doubles.


    As an example, the declaration GDimension goldenSize = new GDimension(100, 100
    / PHI); introduces the variable goldenSize and initializes it to a GDimension
    object with internal width and height fields are'
