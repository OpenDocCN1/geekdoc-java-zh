  md: '# Computer Graphics in Java


    set to 0 and the y register is set to ymax. The value stored in the frame buffer
    for this pixel position is then retrieved and used to set the intensity of the
    CRT beam. Then the x register is incremented by 1, and the process repeated for
    the next pixel on the top scan line. This procedure is repeated for each pixel
    along the scan line. After the last pixel on the top scan line has been processed,
    the x register is reset to 0 and the y register is decremented by 1. Pixels along
    this scan line are then processed in turn, and the procedure is repeated for each
    successive scan line. After cycling through all pixels along the bottom scan (y
    = 0), the video controller resets the registers to the first position on the top
    scan line and the refresh process starts over.


    # Raster-scan Display Processor


    The organization of raster system containing a separate display processor, sometimes
    referred to as a graphics controller or display co-processor. The purpose of the
    display processor is to free the CPU from the graphics chores. In addition to
    the system memory, a separate display processor memory area can also be provided.
    A major task of the display processor is digitizing a picture definition given
    in an application Programme into a set of pixel-intensity values for storage in
    the frame buffer. This digitization process is called scan conversion.


    Characters can be defined with rectangular grids. The array size for character
    grids can vary from about 5 by 7 to 9 by 12 or more for higher quality displays.
    Display processors are typically designed to interface with interactive input
    devices such as mouse.'
