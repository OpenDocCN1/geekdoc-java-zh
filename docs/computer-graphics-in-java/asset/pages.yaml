  md: '# The Stages of 3D Work


    The following are the main stages of creating a 3D work:


    +   * Create objects;

    * Place objects in relation to each other in scene;

    * Place light sources;

    * Place the camera or observer;

    * Add textures to objects;

    * Add atmospheric effects;

    * Render to produce a final image or animation movie.


    The exact order of this sequence is partly up to you and partly a function of
    the software that you are using. For instance, some software separates the creation
    of objects and placing them in the scene (as in Lightwave), others combine this
    into one step (as in Bryce). Likewise, sometimes the textures are placed on objects
    when you create them.


    But they can also be added at the scene creation stage. Each person gradually
    finds their own order of working that suits their needs and needs of the specific
    project. For projects involving many people there may be different order, or indeed
    some stages may be performed in parallel, than for projects where you are doing
    the whole thing. The order of steps can affect the performance of your software.
    The sequence given tends to produce the least delays with most software, for reasons
    that will become clear as we progress through this series.


    Creating objects and placing them in the scene is often called ‘modelling’. This
    is because in creating an object and then a scene we are building a ‘model’ of
    it in the computer. Some software separates the modelling function from the rest
    of the software by splitting the process into two'
