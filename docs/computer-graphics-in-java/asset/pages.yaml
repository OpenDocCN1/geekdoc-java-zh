    memory which is used to hold the pixels is called "Frame Buffer". The memory is
    usually scanned and displayed by direct memory access that is special hardware
    independent of the central processor.


    # Raster Display


    A raster display refresh system includes a charge coupled device (CCD) circulating
    refresh memory for maintaining a display of information on a cathode tube (CRT)
    screen. The X and Y address of picture elements to be changed are stored in raster
    scan sequence in a small random access memory (RAM). Whenever a picture element
    address in the data register equals the X and Y address of the scanning beam of
    the CRT, a corresponding new picture element stored in the RAM is substituted
    for the old picture element signal previously circulating the CCD refresh memory.'
