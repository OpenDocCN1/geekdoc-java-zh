    # A Relational Database Overview


    A database is a means of storing information in such a way that information can
    be retrieved from it. In simplest terms, a relational database is one that presents
    information in tables with rows and columns. A table is referred to as a relation
    in the sense that it is a collection of objects of the same type (rows). Data
    in a table can be related to common keys or concepts, and the ability to retrieve
    related data from a table is the basis for the term relational database. A Database
    Management System (DBMS) handles the way data is stored, maintained, and retrieved.
    In the case of a relational database, a Relational Database Management System
    (RDBMS) performs these tasks. DBMS as used in this book is a general term that
    includes RDBMS.


    # Integrity Rules


    Relational tables follow certain integrity rules to ensure that the data they
    contain stay accurate and are always accessible. First, the rows in a relational
    table should all be distinct. If there are duplicate rows, there can be problems
    resolving which two possible selections. For most DBMS, the user can specify that
    duplicate rows are not allowed, and if that is done, the DBMS will prevent the
    addition of any rows that duplicate an existing row.


    A second integrity rule of the traditional relational model is that column values
    must not be repeating groups or arrays. A third aspect of data integrity involves
    the concept of a null value. A database takes care of situations where data may
    not be available by using a null value to indicate that a value is missing. It
    does not equate to a blank or zero. A blank is considered equal to another blank,
    a zero is equal to another zero, but two null values are not considered equal.


