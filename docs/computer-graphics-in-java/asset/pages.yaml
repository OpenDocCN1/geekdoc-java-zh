    # Raster-scan Systems


    Interactive raster graphics systems typically employ several processing units.
    In addition to the central processing unit, a special-purpose processor, called
    the video controller or display controller is used to control the operation of
    the display device. The video controller accesses the frame buffer to refresh
    the screen. In addition to the video controller, more sophisticated raster systems
    employ other processors as co-processors and accelerators to implement various
    graphics operations.


    # Video Controller


    Frame buffer locations, and the corresponding screen positions, are referenced
    in Cartesian-coordinates. For many graphics monitors, the co-ordinate origin is
    defined at the lower left screen corner. The screen surface is then represented
    as the first quadrant of a two-dimensional system, with positive x values increasing
    to the right and positive y values increasing from bottom to top. Scan lines are
    then labelled from ymax at the top of the screen to 0 at the bottom. Along each
    scan line, screen pixel positions are labelled from 0 to x. Two registers are
    used to store the co-ordinates of the screen pixels. Initially, the x register
    is'
