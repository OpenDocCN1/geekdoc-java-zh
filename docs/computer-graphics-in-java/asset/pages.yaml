    You can also perform more complex transformations (e. g. , creating a mirror image
    by flipping around a line) by directly manipulating the underlying arrays that
    control the transformations. This is a bit more complicated to envision than the
    basic transformation, rotation, scaling, and shear transformations.


    The idea is that a new point ($x_2, y_2$) can be derived from an original point
    ($x_1, y_1$) as follows:


    +   $[ x_2 ] = [ m_{00} \ m_{01} \ m_{02} ] [ x_1 ] = [ m_{00}x_1 + m_{01}y_1
    + m_{02} ]

    $[ y_2 ] = [ m_{10} \ m_{11} \ m_{12} ] [ y_1 ] = [ m_{10}x_1 + m_{11}y_1 + m_{12}
    ]

    $[ 1 ] = [ 0 \ 0 \ 1 ] [ 1 ] $


    Note that you can only supply six of the nine values in the transformation array
    (the $m_{xx}$ values). The bottom row is fixed at $[ 0 \ 0 \ 1 ]$ to guarantee
    that the transformations preserve “straightness” and “parallelness” of lines.
    There are several ways of supplying this array to the AffineTransform constructor.
