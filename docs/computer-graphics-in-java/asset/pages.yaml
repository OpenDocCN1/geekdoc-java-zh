  md: '# Objects


    When you look at the world around you, what do you see? You see objects. In programming,
    objects are nothing more than representations of things. It''s actually pretty
    simple. The world around you is a representation of stuff. You look at something,
    and you can probably tell me its characteristics. It''s an object. It may be more
    specific than that, it might be a car object or a keyboard object, but it is still
    an object. Java has a slightly different definition but it is almost identical
    to a real-life object.


    Objects are key to understanding object-oriented technology. Look around right
    now and you''ll find many examples of real-world objects: your dog, your desk,
    your television, your bicycle.


    Real-world objects share two characteristics: They all have state and behaviour.
    Dogs have state (name, colour, breed, hungry) and behaviour (barking, fetching,
    wagging tail). Bicycles also have state (current gear, current pedal cadence,
    current speed) and behaviour (changing gear, changing pedal cadence, applying
    brakes). Identifying the state and behaviour for real-world objects is a great
    way to begin thinking in terms of object-oriented programming.


    Take a minute right now to observe the real-world objects that are in your immediate
    area. For each object that you see, ask yourself two questions: “What possible
    states can this object be?” and “What possible behaviour can this object perform?”.
    Make sure to write down your observations. As you do, you''ll notice that real-world
    objects vary in complexity; your desktop lamp may have only two possible states
    (on and off) and two possible behaviours (turn on, turn off), but your desktop
    right might have additional states (on, off, current volume, current station)
    and'
