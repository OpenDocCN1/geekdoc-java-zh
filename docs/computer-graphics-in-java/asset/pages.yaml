  md: '# Output Devices


    # Printers


    Printers produce output by either impact or non--impact methods. Impact printers
    press formed character faces against an inked ribbon onto the paper. A line printer
    is an example of an impact device, with the the typefaces mounted on bands, chains,
    drums or wheels. Non--impact printers and plotters use laser techniques, ink-jet
    sprays, xerographic processes, electrostatic methods and electro thermal methods
    to get images onto the paper.


    Character impact printers often have a dot-matrix print head containing a rectangular
    array of protruding pins, with the number of pins depending on the quality of
    the printer. Individual characters or graphics patterns are obtained by retracting
    certain pins so that the remaining pins form the pattern to be printed.


    In a laser device, a laser beam creates a change distribution on a rotating drum
    coated with a photoelectric material. Toner is applied to the drum and then transferred
    to paper. Ink-jet methods produce output by squirting ink in horizontal rows across
    a roll of paper wrapped on a drum. The electrically charged ink stream is deflected
    by an electric field to produce dot-matrix patterns.


    An electrostatic device places a negative charge on the paper, one complete row
    at a time along the length of the paper. Then the paper is exposed to a toner.
    The toner is positively charged and so it is attracted to the negatively charged
    areas, where it adheres to produce the specified output.'
