    # JDBC Architecture


    Two-tier and Three-tier Processing Models


    The JDBC API supports both two-tier and three-tier processing models for database
    access.

    In the two-tier model, a Java applet or application talks directly to the data
    source. This requires a JDBC driver to communicate with the particular data source
    being accessed. A user’s machine commands are delivered to the database or other
    data source, and the results of these statements are sent back to the user. The
    data source may be located on another machine to which the user is connected via
    a network.


    This is referred to as a client/server configuration, with the user''s machine
    as the client, and the machine housing the data source as the server. The network
    can be an intranet, which, for example, connects employees within a corporation,
    or it can be the Internet.


    ![](img/107463c19b4ffc51589c69c46a514236_192_0.png)


    Fig. Two-tier Architecture for Data Access.


    In the three-tier model, commands are sent to a “middle tier” of services, which
    then sends the commands to the data source. The data source processes the commands
    and sends the results back to the middle tier, which then sends them to the user.
