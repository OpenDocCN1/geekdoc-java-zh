    commands have been processed, the system cycles back to the first line command
    in the list.


    # Colour CRT Monitors


    A CRT monitor displays colour pictures by using a combination of phosphors that
    emit different-coloured light. By combining the emitted light from the different
    phosphors, a range of colours can be generated. The two basic techniques for producing
    colour displays with a CRT are the *beam-penetration method* and the *shadow-mask
    method*.


    The beam-penetration method for displaying colour pictures has been used with
    random-scan monitors. Two layers of phosphor, usually red and green are coated
    onto the inside of the CRT screen, and the displayed colour depends on how far
    the electron beam penetrates into the phosphor layers. A beam of slow electrons
    excites only the outer layer. A beam of very fast electrons penetrates through
    the layer and excites the inner green layer. At intermediate beam speeds, combinations
    of red and green light are emitted to show two additional colours, orange and
    yellow. The speed of the electrons and hence the screen colour at any point is
    controlled by the beam-acceleration voltage. Four colours are possible, and the
    quality of pictures is not as good as with other methods.


    Shadow-mask methods are commonly used in raster-scan systems because they produce
    a much wider range of colours than the beam-penetration method. A shadow-mask
    CRT'
