  md: '# Descriptions of the Individual Shape Classes


    So far, this tutorial has looked only at methods that apply to all GObjects, along
    with a few interfaces that define methods shared by some subset of the GObject
    hierarchy. The most important classes in that hierarchy are the shape classes
    that appear. The sections that follow provide additional background on each of
    the shape classes and include several simple examples that illustrate their use.


    As you go through the descriptions of the individual shape classes, you are likely
    to conclude that some of them are designed in ways that are less than ideal for
    introductory students. In the abstract, this conclusion is almost certainly correct.


    For practical reasons that look beyond the introductory course, the Java Task
    Force decided to implement the shape classes so that they match their counterparts
    in Java''s standard Graphicsclass.


    In particular, the set of shape classes corresponds precisely to the facilities
    that the Graphics class offers for drawing geometrical shapes, text strings, and
    images. Moreover, the constructors for each class take the same parameters and
    have the same semantics as the corresponding method in the Graphics class. Thus,
    the GArc constructor—which is arguably the most counterintuitive in many ways—has
    the structure it does, not because we thought that structure was perfect, but
    because that is the structure used by the drawArc method in the Graphics class.
    By keeping the semantics consistent with its Java counterpart, the acm.graphicpackage
    makes it easier for students to move on to the standard packages as they learn
    more about programming.


