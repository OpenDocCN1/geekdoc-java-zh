  md: '# The Evolution of Computer Graphics


    CGI was first used in movies in 1973, in the science fiction film, *Westworld*.
    The film was the story of a society in which humans and robots were integrated,
    working and living together. Its sequel, *Futureworld* (1976) featured the first
    use of 3D wireframe imagery. The third film ever to use this technology was *Star
    Wars* (1977), designing the Death Star and the targeting computers in the X-wings
    and the Millenium Falcon, Han Solo’s ship. Later, on *The Black Hole* (1979) used
    raster wire-frame model rendering to create a black onscreen. That same year,
    James Cameron''s *Alien* used the raster wireframe model to render the image of
    navigation monitors in the scene where the spaceship follows a beacon for landing
    guidance.


    Long before this, computer engineers at MIT and Cornell were in the midst of creating
    the very basics that eventually enabled these filmmakers to utilize computer animation
    technology. It all began in 1963.


    # 1960s


    +   - 1963: Ivan Sutherland presented his Ph. D. dissertation, an interactive
    design on a vector graphics display monitor with a light pen input device called
    Sketchpad. This instance is often credited as the event that marks the beginning
    of computer graphics.

    - Jack Breshen develops a system of drawing lines and circles on a raster device,
    and Steve Coons introduces parametric surfaces and computer-aided geometric design
    concepts.

    - Arthur Appel at IBM introduces hidden surface and shadow algorithms.'
