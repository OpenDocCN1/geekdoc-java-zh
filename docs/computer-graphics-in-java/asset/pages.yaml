  md: '# Changing the Location of a GObject


    The next three methods offer several techniques for changing the location of a
    graphical object. The setColor(x, y) method sets the location to an absolute coordinate
    position on the screen. For example, in the FeltBoard example, executing the statement
    `rect.setLocation(0, 0);` would move the rectangle to the origin in the upper
    left corner of the window.


    The move(dx, dy) method, by contrast, makes it possible to move an object relative
    to its current location. The effect of this call is to shift the location of the
    object by a specified number of pixels along each axis coordinate. For example,
    the statement `oval.move(10, 0);` would move the 10 pixels to the right. The dx
    and dy values can be negative. `rect.move(0, -25);` would move the rectangle 25
    pixels upward.


    The movePolar(r, theta) method is useful in applications in which you need to
    move a graphical object in a particular direction. The name of the method comes
    from the concept of polar coordinates in mathematics, in which a displacement
    is defined by a distance r and an angle theta. Just as it is in traditional geometry,
    the angle theta is measured in degrees counterclockwise from the +x axis. Thus,
    the statement `movePolar(10, 45);` would move the rectangle 10 pixels along a
    line in the 45° direction, which is northeast.


