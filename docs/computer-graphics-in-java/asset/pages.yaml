  md: '# Computer Graphics in Java


    A transaction is a set of one or more SQL statements that make up a logical unit
    of work. A transaction ends with either a commit or a rollback, depending on whether
    there are any problems with data consistency or data concurrency. The commit statement
    makes permanent the changes resulting from the SQL statements in the transaction,
    and the rollback statement undoes all changes from the SQL statements in the transaction.


    A lock is a mechanism that prohibits two transactions from manipulating the same
    data at the same time. For example, a table lock prevents a table from being dropped
    if there is an uncommitted transaction on that table. In some DBMSs, a table lock
    also locks all of the rows in a table. A row lock prevents two transactions from
    modifying the same row, or it prevents one transaction from selecting a row while
    another transaction is still modifying it.


    # Stored Procedures


    A stored procedure is a group of SQL statements that can be called by name. In
    other words, it is executable code, a mini-programme, that performs a particular
    task that can be invoked the same way one can call a function or method. Traditionally,
    stored procedures have been written in a DBMS-specific programming language.


    The latest generation of database products allows stored procedures to be written
    using the Java programming language and the JDBC API. Stored procedures written
    in the Java programming language are portable bytecode between DBMSs. Once a stored
    procedure is written, it can be used and reused because a DBMS that supports stored
    procedures will, as its name implies, store it in the database.'
