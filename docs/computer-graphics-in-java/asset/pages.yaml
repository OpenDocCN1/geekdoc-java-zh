  md: '# Computer Graphics in Java


    By attributing state (current speed, current pedal cadence, and current gear)
    and providing methods for changing that state, the object remains in control of
    how the outside world is allowed to use it. For example, the bicycle only has
    6 gears, a method to change gears could reject any value that is less than 1 or
    greater than 6.


    Bundling code into individual software objects provides a number of benefits,
    including:


    +   - Modularity: The source code for an object can be written and maintained
    independently of the source code for other objects. Once created, an object can
    be easily passed around the system.


    +   - Information-hiding: By interacting only with an object’s methods, the details
    of its internal implementation remain hidden from the outside world.


    +   - Code re-use: If an object already exists (perhaps written by another software
    developer), you can use that object in your programme. This allows specialists
    to implement/test/debug complex, task-specific objects, which you can then trust
    to run in your own code.


    +   - Pluggability and Debugging Ease: If a particular object turns out to be
    problematic, you can simply remove it from your application and plug in a different
    object as its replacement. This is analogous to fixing mechanical problems in
    the real world. If a bolt breaks, you replace it, not the entire machine.


