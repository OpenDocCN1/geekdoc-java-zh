  md: '# Computer Graphics in Java


    The processor itself is divided into three components that carry out the various
    functions that the computer is capable of performing. The first component of the
    processor is the controller. The controller acts as a foreman that oversees the
    tasks of the processor. The controller looks at the next instruction to be executed
    and assigns the sub-tasks that must be accomplished to carry out that instruction
    to the other components of the processor.


    Another component of the processor is the Arithmetic-Logic Unit (ALU). This unit
    is the part of the processor which performs the mathematical computations and
    logical tasks that we expect a computer to be able to do. Addition, subtraction,
    comparison, etc., are all carried out by the ALU.


    The last component of the processor is a collection of one or more registers.
    Registers are special memory cells in the processor where information is temporarily
    stored during various stages of a computation. The currently executing instruction,
    for example, resides in a register called the Instruction Register. Since modern
    processors can execute millions of instructions per second it is expected that
    information would not stay in a register for more than a few millions of a second.


    A computer memory system is accessed (or read) by specifying the location (called
    an address) of the memory cell. The memory system then responds by producing a
    copy of the contents of that cell. The original value of the cell is not changed
    by this process. This is sometimes called a non-destructive read.


    A typical computer might be organized as indicated in the following diagram:


    A computer memory system is changed (or written) by specifying the location of
    the memory cell together with the new value for that cell. The previous value
    stored in the cell is replaced by the new value. This is sometimes called a destructive
    write.'
