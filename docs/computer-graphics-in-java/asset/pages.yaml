    A programme is simply a list of unambiguous instructions meant to be followed
    mechanically by a computer. A computer is built to carry out instructions that
    are written in a very simple type of language called machine language. Each type
    of computer has its own machine language, and the computer can execute a programme
    only if the programme is expressed in that language. (It can execute programmes
    written in other languages if they are first translated into machine language.
    )


    When the CPU executes a programme, that programme is stored in the computer''s
    main memory (also called the RAM or random access memory). In addition to the
