  md: '# Computer Graphics in Java


    These locations are numbered, and the sequence number of a location is called
    its address.


    An address provides a way of picking out one particular piece of information among
    the millions stored in memory. When the CPU needs to access the programme instruction
    or data in a particular location, it sends the address of that information as
    a signal to the memory; the memory responds by sending back the data contained
    in the specified location. The CPU can also store information in memory by specifying
    the information to be stored and the address of the location where it is to be
    stored.


    On the level of machine language, the operation of the CPU is fairly straightforward
    (although it is very complicated in detail). The CPU executes a programme that
    is stored as a sequence of machine language instructions in main memory. It does
    this by repeatedly reading, or fetching, an instruction from memory and then carrying
    out, or executing, that instruction. This process-fetch an instruction, execute
    it, fetch another instruction, execute it, and so on forever is called the fetch-and-execute
    cycle.


    The details of the fetch-and-execute cycle are not terribly important, but there
    are a few basic things you should know. The CPU contains a few internal registers,
    which are small memory units capable of holding a single number or machine language
    instruction. The CPU uses one of these registers – the programme counter, or PC
    – to keep track of where it is in the programme it is executing.


    The PC stores the address of the next instruction that the CPU should execute.
    At the beginning of each fetch-and-execute cycle, the CPU checks the PC to see
    which instruction it should fetch. During the course of the fetch-and-execute
    cycle, the number in the PC is updated to indicate the instruction that is'
