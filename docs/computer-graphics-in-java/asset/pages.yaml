- img_proc: true
  md: "The following code is an example of how to create a very simple stored procedure\
    \ using the Java programming language. Note that the stored procedure is just\
    \ a static Java method that contains normal Java JDBC code. It accepts two input\
    \ parameters and uses them to change an employee's car number.\n\nDo not worry\
    \ if you do not understand the example at this point. The code example below is\
    \ presented only to illustrate what a stored procedure looks like. You will learn\
    \ how to tcode it following.\n\n```\nimport java.sql.*;\npublic class UpdateCar\
    \ {\n    public static void UpdateCarNum(int carno, int empno)\n    throws SQLException\
    \ {\n        Connection con = null;\n        PreparedStatement pstmt = null;\n\
    \        try {\n            con = DriverManager.getConnection(\n             \
    \   \"jdbc:default:connection\");\n            pstmt = con.prepareStatement(\n\
    \                \"UPDATE EMPLOYEES \" +\n                \"SET CAR_NUMBER = ?\
    \ \" +\n                \"WHERE EMPLOYEE_NUMBER = ?\");\n            pstmt.setInt(1,\
    \ carno);\n            pstmt.setInt(2, empno);\n            pstmt.executeUpdate();\n\
    \        }\n        finally {\n            if (pstmt != null) pstmt.close();\n\
    \        }\n    }\n```\n\n# Metadata\n\nDatabases store user data, and they also\
    \ store information about the database itself. Most DBMs have a set of system\
    \ tables, which list tables in the database, column names in each table, primary\
    \ keys, foreign keys, stored procedures, and so forth."
