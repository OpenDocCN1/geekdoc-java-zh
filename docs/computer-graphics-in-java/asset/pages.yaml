  md: '# Filling a Rectangle


    By default a rectangle will have no colour on the inside (it will just look like
    a box). You can use the fillRect() method to fill a rectangle. The fillRect()
    method has four numeric attributes indicating the x/y starting position to begin
    filling and the height and width. Set these values the same as you did for the
    drawRect() method to properly fill the rectangle.


    # Example:


    ```

    public void paint(Graphics g) //draw a rectangle starting at 100, 100 width and
    height of 80 g. drawRect(100, 100, 80, 80); g.fillRect(100, 100, 80, 80);

    ```


    # Something''s Missing. . .


    The rectangle is filled, but we didn''t set a colour for it! To do this, we will
    use the setColor() method.

    g. setColor(Colour. orange);


    # Drawing Ovals


    To draw ovals, the drawOval() method is used. This method takes four numeric attributes-the
    first indicating the x/y starting point of the oval, the last two indicating the
    width and height of the oval. An oval with the fillOval method which also takes
    four numeric attributes indicating the starting position to begin filling and
    the height and width. Set these values the same as you did for the drawOval()
    method to properly fill the oval.


    # Example:


    ```

    public void paint(Graphics g) g. setColor(Colour. gray);////draw an oval starting
    at 20, 20 with a width and height of 100 and fill g. drawOval(20, 20, 100, 100);
    g. fillOval(20, 20, 100, 100);

    ```'
