  md: 'behaviour (turn on, turn off, increase volume, decrease volume, seek, scan,
    and tune). You may also notice that some objects, in turn, will also contain other
    objects. These real-world observations all translate into the world of object-oriented
    programming.


    ![](img/107463c19b4ffc51589c69c46a514236_104_0.png)


    Fig. A Software Object.


    Software objects are conceptually similar to real-world objects: they too consist
    of state and related behaviour. An object stores its state in fields (variables
    in some programming languages) and exposes its behaviour through methods (functions
    in some programming languages). Methods operate on an object''s internal state
    and serve as the primary mechanism for object-to-object communication. Hiding
    internal state and requiring all interaction to be performed through an object’s
    methods is known as data encapsulation—a fundamental principle of object-oriented
    programming.

    Consider a bicycle, for example:


