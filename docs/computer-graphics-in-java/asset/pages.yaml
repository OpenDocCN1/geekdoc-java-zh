  md: '# Computer Graphics in Java


    A public static field or method can be accessed from outside the class using either
    the usual notation:

    `class-object.field-or-method-name`

    or using the class name instead of name of the class object:

    `class-name.field-or-method-name`


    For example, if the numLists field is public, and there is a variable L of type
    List, the numLists field can be accessed using either L. numLists or List. numLists.
    Similarly, if the List class includes a public static method PrintNumLists() or
    a static method can be called using either L. PrintNumLists() or List.NumLists().
    The preferred way to access a static field or method is using the class name (not
    using a class object). This is because it makes clear that the field being accessed
    is static.


    # Final Fields and Methods


    +   - Fields and methods can also be declared final. A final method cannot be
    overridden in a subclass. A final field is like a constant: once it has been given
    a value, it cannot be assigned to again. For example, the constructor function
    for the List class initialises the “items” field to an array of size 10. It would
    probably be better to use a constant for the initial size of the array.


    Only a single copy of the constant is needed for the whole class, one for every
    class instance, so it would be appropriate to make the field static as well as
    final:

    `private static final int INITIAL_SIZE = 10;`


    The assignment statement in the constructor function would change

    `items = new Object[INITIAL_SIZE];'
