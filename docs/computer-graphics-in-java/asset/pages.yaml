  md: '# Computer Graphics in Java


    Because the appearance of an object depends largely on the exterior of the object,
    boundary representations are common in computer graphics. Two dimensional surfaces
    are a good analogy for the objects used in graphics, though quite often these
    objects are non-manifold. Since surfaces are not finite, a discrete digital approximation
    is required: polygonal meshes (and to a lesser subdivision surfaces) are by far
    the most common representation, although pointbased representations have been
    gaining popularity in recent years. Level sets are a useful representation for
    deforming surfaces which undergo many topological changes such as fluids. The
    process of transforming representations of objects, such as the middle point coordinate
    of a sphere and a point on its circumference into a polygon representation of
    a sphere, is called tessellation. This step is used in polygon-based rendering,
    where objects are broken down from abstract representations (“primitives”) such
    as spheres, cones etc., to so-called meshes, which are nets of interconnected
    triangles. Meshes of triangles (instead of e.g. squares) are popular as they have
    proven to be easy to render using skyline rendering. Polygon representations are
    not used in all rendering techniques, and in these cases the tessellation step
    is not included in the transition from abstract representation to rendered scene.


    # Modeling Processes


    There are five popular ways to represent a model:


