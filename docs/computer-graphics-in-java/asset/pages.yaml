    # Static Fields and Methods


    +   * Fields and methods can be declared static (this is true in C++, too). If
    a field is static, there is only one copy for the entire class, rather than one
    copy for each instance of the class. (In fact, there is a copy of the field even
    if there are no instances of the class )


    For example, we could add the following field to the List class:

    static int numLists = 0;

    And the following statement to the List constructor:


    Now every time a new List object is created, the numLists variable is incremented;
    so maintains a count of the total number of Lists created during programme execution.
    Every instance of a List could access this variable (could both read it and write
    into it), and they would all be accessing the same variable, not their own individual
    copies. A method should be static when it does not access any of the non-static
    fields of the class, and does not call any non-static methods. (In fact, a static
    method cannot access non-static fields or call non-static methods. ) Methods that
    would be “free” functions in C++ (i. e., not members of any class) should be static
    methods in Java. Also, methods that are logically associated with a particular
    class, but that only manipulate the class’s static fields should be static.


    For example, if we wanted a function to print the current value of the numLists
    field defined above, that function should be defined as a static method of the
    List class.'
