    # Keeping Oriented in 3D


    In 3D software the convention is to use a set of three coordinates, x, y and z.
    Co-ordinates can be absolute or relative. Absolute coordinates apply to the entire
    world that we are creating in the computer. Everything is specified relative to
    a universal origin, the centre of your digital universe, with coordinates of 0.0.0.
    Positive x values may lie to the right, negative ones to the left. Positive y
    values may be up and negative ones down from the origin. Positive z may be in
    front of and negative ones behind the origin. Absolute coordinates are used to
    position objects in our scene, to place cameras and lights, etc. Relative coordinates
    have their origin somewhere than the world origin. For instance, creating an object
    made up of many parts it may be more convenient to think in terms of positions
    relative to what you wish to consider the centre of the object.


    How the software works can have an impact on how easy it is to keep oriented.
    Some Programmes, like Bryce, display only one window, so you only have view of
    your objects/ scene at a time. Other Programmes, like Vue d''Esprit or Lightwave,
    by default give you four views: a front, left and top view plus the view through
    the main camera. This last solution is generally preferred but does tend to work
    best when you are using a large, high-resolution screen. This is why most of the
    consumer level Programmes use the one view approach, assuming home users have
    small screens, whilst professional software takes the four-view approach.


