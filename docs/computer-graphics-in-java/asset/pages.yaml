  md: 'Computer Graphics in Java


    +   - Means must be provided to control the flow of electrons so that the intensity
    of the trace of the beam can be controlled.


    Electrons are generated by a cathode heated by an electric filament. Surrounding
    the cathode is a cylindrical metal control grid, with a hole at one end that allows
    electrons to escape. The control grid is kept at a lower potential than the cathode,
    creating an electrostatic field that directs the electrons through a point source;
    this simplifies the subsequent focusing process. By altering the control grid
    potential, we can modify the rate of flow of electrons, or beam current and can
    thus control the brightness of the image; we can even cut off the flow of electrons
    altogether. Focusing is achieved by a focusing structure, used to focus finely
    and highly concentrated at the precise moment at which it strikes the phosphor.
    An accelerating structure is generally combined with the focusing structure. It
    consists of two metal plates mounted perpendicular to the beam axis with holes
    at their centres through which the beam can pass. The two plates are maintained
    at a sufficiently high relative potential to accelerate the beam to the necessary
    velocity; accelerating potentials of several thousand volts are not uncommon.
    The resulting gun structure has the advantage that it can be built as a single
    physical unit and mounted inside the CRT envelope. Other types of gun exist, whose
    focusing is performed by a coil mounted outside the tube; this is called electromagnetic
    focusing.


