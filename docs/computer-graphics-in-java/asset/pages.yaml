  md: '# Coordinate Transformations in Java2D


    Java2D allows you to easily translate, rotate, scale, or shear the coordinate
    system. This is very convenient: it is often much easier to move the coordinate
    system than to calculate new coordinates for each of your points. Besides, for
    some data structures like strings there is no other way to get rotated or stretched
    versions. The meanings of translate, rotate, and scale are clear: to move, to
    spin, or to stretch/shrink evenly in the x and/or y direction. Shear means to
    stretch unevenly: an x shear moves points to the right based on how far they are
    from the y axis; y shear moves points down based on how far they are from the
    x axis.


    The easiest way to picture what is happening is to imagine the person doing the
    drawing has a picture frame that he lays down on top of a sheet of paper. The
    drawer always sits at the bottom of the frame. To apply a translation, you move
    the frame (moving the drawer with it), and do the drawing in the new location.
    You then move the frame back to its original location, and what you now see is
    the final result. Similarly, for a rotation, you spin the frame (and the drawing),
    draw, then spin back to see the result. Similarly for scaling and shears; modify
    the frame without touching the underlying sheet of paper, draw, then reverse the
    process to see the final result.


    An outside observer watching this process would see the frame move in the direction
    specified by the transformation, but see the sheet of paper stay fixed. This is
    illustrated in the second column in the diagram below. The dotted rectangle represents
    the frame, while the gray rectangle represents the sheet of paper. On the other
    hand, to the person doing the drawing it would appear that the sheet of paper
    moved in the opposite way from that specified in'
