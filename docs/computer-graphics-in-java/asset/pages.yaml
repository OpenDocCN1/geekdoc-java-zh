    # The GMath Class


    Computing the coordinates of a graphical design can sometimes require the use
    of simple trigonometric functions. Although functions like sin and cos are defined
    in Java''s standard Math class, students find them confusing in graphical applications
    because of inconsistencies in the way angles are represented. In Java''s graphics
    libraries, angles are measured in degrees; in the Math class, angles must be given
    in radians. To minimize the confusion associated with this inconsistency of representation,
    the acm.graphics package includes a class called GMath, which exports the methods.
    Most of these methods are simply degree-based versions of the standard trigonometric
    functions, but the distance, angle, and round methods are also worth noting.


