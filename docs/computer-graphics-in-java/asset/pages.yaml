    # Raster-scan Displays


    The most common type of graphics monitor employing a CRT is the raster scan display.
    In a raster-scan system, the electron beam is swept across the screen, one row
    from top to bottom. As the electron beam moves across each row, the beam intensity
    is turned on and off to create a pattern of illuminated spots. Picture definition
    is stored in a memory area called the refresh buffer or frame buffer. This memory
    area holds the set of intensity values for all the screen points. Stored intensity
    values are retrieved from the refresh buffer and painted on the screen one row
    at a time.


    Each screen point is referred to as a pixel or pel (picture element). The capability
    of a raster-scan system to store intensity information for each screen point makes
    it well suited for the realistic display of screens. Home televisions and printers
    are examples of other systems using raster-scan methods.


    Intensity range for pixel positions depends on the capability of the raster system.
    In a simple black and white system, each screen point is either on or off, so
    only one bit per pixel is needed to control the intensity of screen positions.
    Here 1 indicates that the electron beam is to be turned on at that position, and
