    # Using Local Fonts in Java2D


    # Local Fonts: Overview


    You can use the same logical font names as Java 1. 1, namely Serif (e. g. Times),
    SansSerif (e. g. Helvetica or Arial), Monospaced (e. g. Courier), Dialog, and
    DialogInput. You can also use arbitrary local fonts if you first look up the entire
    list, which may take a few seconds.


    ```

    Lookup the fonts via the getAvailableFontFamilyNames and getAllFonts methods GraphicsEnvironment.
    E. g. :

    GraphicsEnvironment env = getGraphicsEnvironment();

    Then env.getAvailableFontFamilyNames();

    env. getAllFonts(); // Much slower!

    ```


    Despite a misleading description in the API, trying to use an available local
    font in JDK 1.2 without first looking up the fonts as above gives the same result
    as asking for an unavailable font: a default font instead. Note that getAllFonts
    returns an array of Font objects that you can use like any other Font, but is
    much slower. If all you need to do is let Java to make all local fonts available,
    always use getAvailableFontNames. The best approach would be to loop down get
    Available Font Names, checking for your name, having several backup names to use
    if the first choice is not available. If you pass an unavailable family name to
    the Font constructor, a default font (SansSerif) will be used.


