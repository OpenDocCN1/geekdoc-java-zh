  md: '# Syntax


    This word has already been used in this book, but you have likely already heard
    it before. It has its own definition in regards to languages that people speak
    and write. However, it is a little different for programming. A programming language''s
    syntax is basically the rules that define how different symbols work, and what
    they do when used together in certain ways.


    Java uses symbols like brackets, curly brackets, variables, and different things.
    You can think of syntax kind of like the grammar rules that a programming language
    follows. You need to use certain symbols, in certain ways, and then position things
    properly. If you fail to use proper syntax, Java will not be able to understand
    what you are trying to do. This will lead to errors when you run your applications.


    Using correct syntax is something that you should learn early on. Always make
    sure that you enter coding correctly, and check that your syntax is right.'
  merge: -1
