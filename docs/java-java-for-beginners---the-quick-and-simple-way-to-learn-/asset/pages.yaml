  md: '# Introduction


    If you are at least slightly interested in programming, you have probably heard
    about Java. It is a language for programming that follows in the style of C and
    C++. These are also very common languages, so anyone who already has experience
    with them, should feel comfortable picking up with Java.

    However, there are some important differences with these language, which will
    be discussed in the next chapter.'
  merge: -1
