  md: '# What Will This Book Teach You?


    There is a lot to learn in the world of programming, and many languages have similarities.
    As mentioned, if you are already familiar with another language, you should find
    it easier to get started with Java. However, for everyone else, there are some
    basics to learn in the beginning. They might seem quite unusual at first, but
    you need to build a firm understanding of the basics, before you can start to
    create your own applications.


    While this book is helpful to beginners, it is also a great resource for people
    who already know a little about computer use, and possibly even programming.


    If you are serious about learning computer programming, please understand that
    it is not easy. You will need to learn a lot of technical terms, and it will take
    a long time before you start to fully understand the basics of programming.'
