  md: '# Object Orientation


    Inherently, Java is an object-oriented language. Programs made using using it
    will be comprised of objects. These are elements of programs that are representative
    of abstract concepts, or real objects.


    Here are the two fundamental characteristics of an object:


    +   - An object has its own *behavior*. This means that it is capable of carrying
    out specific tasks, which are known as *methods*. For example, if an object is
    representing a vehicle within an application, its methods might include include
    starting, driving, stopping, and crashing. Sometimes a method just allows the
    user access to the data of the object, such as its title.

    - They also have their own *state*, which is basically data. For example, if an
    object is representing a book, it might have data about the author, title, and
    publisher of that book.'
  merge: -1
  pgno: 11
