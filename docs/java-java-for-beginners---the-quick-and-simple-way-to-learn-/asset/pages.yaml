  md: '# Java API


    Actually learning Java is fairly simple, because there are just 50 different keywords
    within the language. However, there is a library that contain thousands of different
    classes. In addition to this, there is a far greater number of methods for use
    in programs. The contents of a library is what gives Java a range of different
    functions. Without a library, Java would not be able to have its functionality,
    so it is as integral to Java as the language itself. The library of classes is
    known as the Java API. You are not limited to just one library wanted either.
    There are many options, and they have a range of purposes. Suppose that wanted
    to create a certain genre of game, for example. You could probably find a special
    library that was created to make that task easier. In this way, you can basically
    acquire a customized environment to work in, so you don''t have to build everything
    from the ground, up.


    Before you start to panic, understand that there is no need to learn the Java
    API entirely. Programmers typically only learn smaller parts of it entirely. If
    someone needs to use some classes that they are not comfortable with, it is easy
    to look up more details about them.'
  merge: -1
