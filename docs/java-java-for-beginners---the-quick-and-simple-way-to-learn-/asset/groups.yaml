- md: "\n# List That Can Store Anything, and Not Only Ints\n\n```java\n/**\n * A class\
    \ to provide a simple list.\n * List resizes automatically. Used to illustrate\n\
    \ * various design and implementation details of\n * a class in Java.\n *\n *\
    \ @author scottim\n *\n */\npublic class GenericList{\n    // class constant for\
    \ default size\n    private static final int DEFAULT_CAP = 10;\n\n    //instance\
    \ variables\n    // iValues store the elements of the list and\n    // may have\
    \ extra capacity\n    private Object[] iValues;\n    private int iSize;\n\n/**\n\
    \ * Default add method. Add x to the end of this List.\n * Size of the list goes\
    \ up by 1.\n * @param x The value to add to the end of this list.\n */\npublic\
    \ void add(Object x){\n    insert(iSize, x);\n}\n\npublic Object get(int pos){\n\
    \    return iValues[pos];\n}\n```\n\n```java\n/**\n* Insert obj at position pos.\n\
    * post: get(pos)= x, size()= old size() + 1\n* @param 0 <= pos <= size\n* @param\
    \ obj The element to add.\n*/\npublic void insert(int pos, Object obj){\n    ensureCapacity();\n\
    \    for(int i = iSize; i > pos; i--){\n        iValues[i] = iValues[i - 1];\n\
    \    }\n    iValues[pos] = obj;\n    iSize++;\n}\n\npublic Object remove(int pos){\n\
    \    Object removedValue = iValues[pos];\n    for(int i = pos; i < iSize - 1;\
    \ i++) {\n        iValues[i] = iValues[i + 1];\n    }\n    iValues[iSize - 1]\
    \ = null;\n    iSize--;\n    return removedValue;\n}\n```\n\n```java\nprivate\
    \ void ensureCapacity(){\n    // is there extra capacity available?\n    // if\
    \ not, resize\n    if(iSize == iValues.length)\n        resize();\n}\n```\n\n\
    ```java\npublic int size(){\n    return iSize;\n}\n```\n\n```java\n// resize internal\
    \ storage container by a factor of 2\nprivate void resize() {\n    Object[] temp\
    \ = new Object[iValues.length * 2];\n    System.arraycopy(iValues, 0, temp, 0,\
    \ iValues.length);\n    iValues = temp;\n}\n```\n\n```java\n/**\n * Return a String\
    \ version of this list. Size and\n * elements included.\n */\npublic String toString(){\n\
    \    // we could make this more efficient by using a StringBuilder.\n    // See\
    \ alternative version\n    String result = \"size: \" + iSize + \", elements:\
    \ [\";\n    for(int i = 0; i < iSize - 1; i++)\n        result += iValues[i].toString()\
    \ + \", \";\n    if(iSize > 0)\n        result += iValues[iSize - 1];\n    result\
    \ += \"]\";\n    return result;\n}\n```\n\n```java\n// Would not really have this\
    \ and toString available\n// both included just for testing\npublic String toStringUsingStringBuffer(){\n\
    \    StringBuilder result = new StringBuilder();\n    result.append(\"size: \"\
    );\n    result.append(iSize);\n    result.append(\", elements: [\");\n    for(int\
    \ i = 0; i < iSize - 1; i++) {\n        result.append(iValues[i]);\n    }\n  \
    \  result.append(\", \");\n    if(iSize > 0) {\n        result.append(iValues[iSize\
    \ - 1]);\n    }\n    result.append(\"]\");\n    return result.toString();\n}\n\
    ```\n\n```java\n/**\n* Default constructor. Creates an empty list.\n*/\npublic\
    \ GenericList(){\n    //redirect to single int constructor\n    this(DEFAULT_CAP);\n\
    \    //other statements could go here\n}\n```\n\n```java\n/**\n* Constructor to\
    \ allow user of class to specify\n* initial capacity in case they intend to add\
    \ a lot\n* of elements to new list. Creates an empty list.\n* @param initialCap\
    \ > 0\n*/\npublic GenericList(int initialCap) {\n    assert initialCap > 0 : \"\
    Violation of precondition. GenericListVer1(initialCap):\"\n    + \"initialCap\
    \ must be greater than 0. Value of initialCap: \" + initialCap;\n    iValues =\
    \ new Object[initialCap];\n    iSize = 0;\n}\n```\n\n```java\n/**\n* Return true\
    \ if this IntList is equal to other.<\n* pre: none\n* @param other The object\
    \ to compare to this\n* @return true if other is a non null, IntList object\n\
    * that is the same size as this IntList and has the\n* same elements in the same\
    \ order, false otherwise.\n*/\npublic boolean equals(Object other){\n    boolean\
    \ result;\n    if(other == null)\n        // we know this is not null so can't\
    \ be equal\n        result = false;\n    else if(this == other)\n        // quick\
    \ check if this and other refer to same IntList object\n        result = true;\n\
    \    else if(this.getClass() != other.getClass())\n        // other is not an\
    \ IntList they can't be equal\n        result = false;\n    else {\n        //\
    \ other is an IntList\n        GenericList otherList = (GenericList)other;\n \
    \       result = this.size() == otherList.size();\n        int i = 0;\n      \
    \  while(result && i < iSize){\n            result = this.iValues[i].equals(otherList[i]);\n\
    \            i++;\n        }\n    }\n    return result;\n}\n```\n\n# Writing Ints\
    \ onto File\nsample code to write 100 random ints to a file, 1 per line\n\n```java\n\
    import java.io.PrintStream;\nimport java.io.IOException;\nimport java.io.File;\n\
    \nimport java.util.Random;\n\npublic class WriteToFile {\n    public static void\
    \ main(String[] args) {\n        try {\n            PrintStream writer = new PrintStream(new\
    \ File(\"randInts.txt\"));\n            Random r = new Random();\n           \
    \ final int LIMIT = 100;\n            for (int i = 0; i < LIMIT; i++) {\n    \
    \            writer.println(r.nextInt());\n            }\n            writer.close();\n\
    \        } catch (IOException e) {\n        }\n    }\n}\n```\n\n# Word Counting\
    \ Code\n\n```java\nimport java.io.File;\nimport java.io.IOException;\nimport java.util.Map;\n\
    import java.util.Scanner;\nimport java.util.TreeMap;\n\npublic class SimpleWordCounter\
    \ {\n\n    public static void main(String[] args) {\n        try {\n         \
    \   File f = new File(\"ciaFactBook2008.txt\");\n            Scanner sc;\n   \
    \         sc = new Scanner(f);\n            // sc.useDelimiter(\"[^a-zA-Z']+\n\
    \            Map<String, Integer> wordCount = new TreeMap<>();\n            while(sc.hasNext()){\n\
    \                String word = sc.next();\n                wordCount.put(word,\
    \ wordCount.getOrDefault(word, 0) + 1);\n            }\n            System.out.println(wordCount.size());\n\
    \        } catch(IOException e) {\n            System.out.println(\"Unable to\
    \ read from file.\");\n        }\n    }\n}\n```\n\n# Using Scanner Class to Read\
    \ Ints From File\n\n```java\nimport java.util.Scanner;\n\npublic class ScannerAndKeyboard\n\
    {\n    public static void main(String[] args)\n    {\n        Scanner s = new\
    \ Scanner(System.in);\n        System.out.print(\"Enter your name: \" );\n   \
    \     String name = s.nextLine();\n        System.out.println(\" Hello \" + name\
    \ + \"!\");\n    }\n}\n```\n\nJAVA\nFREE Books and Relevant Information Brought\
