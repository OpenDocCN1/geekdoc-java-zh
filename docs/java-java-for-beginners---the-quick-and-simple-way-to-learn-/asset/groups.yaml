    \    iValues[iSize - 1] = null;\n    iSize--;\n    return removedValue;\n}\n```\n\
    \n```java\nprivate void ensureCapacity(){\n    // 是否有额外的可用容量？\n    // 如果没有，则调整大小\n\
    \    if(iSize == iValues.length)\n        resize();\n}\n```\n\n```java\npublic\
