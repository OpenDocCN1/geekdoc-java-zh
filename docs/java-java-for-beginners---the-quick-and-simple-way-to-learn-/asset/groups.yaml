    why you did certain things, so creating comments is always important. They are
    also helpful when other programmers need to work with code that you create, so
    they can easily find their way around, and understand everything.


    There are three different types of comments, and they each work a little differently:


    ```

    /** your documentation */

    ```


    The compiler will ignore everything between the /** and */ but the comment will
    be considered a “doc comment”. This is short for documentation comment. All doc
    comments can be compiled with an automated tool later, making it easy to create
    a reference document.


    ```

    // text

    ```


    Everything on the line after the // will be ignored by the compiler.


    ```

    /* your comment */

    ```


    When you use this type of comment, everything withing the /*/ and */ will be ignored
    by your compiler.'
  - '[PAGE 42]


    # Your Main Method


    Finally, take a look at the line that actually tells your application what your
    HelloWorldApp class does:


    ```

    System.out.println("Hello World!");

    ```


    The System class comes from Java’s fundamental library. It simply tells it to
    print “Hello World!” as standard output. This is why, when you run your application,
    it prints these words on the screen.'
  - '[PAGE 43]


    # More Definitions'
  - '[PAGE 44]


    # Objects


    You have already dealt with objects, and learned a little about them. Now that
    you have completed a practical exercise in coding, it is time to look at some
    more theory about objects, and what they do. In Java, objects are essential, as
    if it is an object-oriented language. It''s not the only language that works in
    this way, but this is one of the most popular features of Java.


    To get a better understanding of objects, look around you right now. You can probably
    see many different objects, from the computer that you are using, to your chair,
    your dog, and even other people near you. Consider a dog as if it were an object
    its own state (name, breed, color), as well as behavior (wagging its tail, sleeping,
    barking). To get a better understanding of how objects work in Java, try thinking
    of different real-world objects in terms of their state, and their behavior.


    An object''s state is kept inside a field.


    Pay careful attention here, because this is one of the things that makes object-oriented
    languages so unique. An object''s behavior is exposed through a method. These
    methods are guided by the state of an object, and tell it to act with other objects.
    Objects in Java work with internal states, which other objects cannot directly
    access them. This is called data encapsulation.


    Think about a dog as an object in Java again. While that object has certain behaviors
    (methods), which let you observe and interact with the dog, you are not aware
    of its internal state. You cannot change the dogs internal state directly, unless
    you deal with its outside behavior.'
  - '[PAGE 45]


    This type of programming has some great advantages over coding that isn''t object-oriented:


    +   * **Inbuilt hiding.** Other objects only interact with the methods (behaviors)
    of an object, so the internal state can remain hidden.

    * **Modular.** Objects can be coded and worked on outside of a larger piece of
    code (application). After an object is finished, it can then be introduced to
    the source code, where it can interact with other objects.

    * **Debugging and plugability.** If you find that an object isn''t working properly,
    it is easy to remove for debugging. Plugging in a different object is then simple,
    to see if that will work better. In this way, programmers only need to replace
    objects, instead of fixing entire applications.

    * **Re-using Code.** If someone has already created a certain object that is appropriate
    for another application, it''s easy to re-use it.'
  - '[PAGE 46]


    # Classes


    You have also looked at classes, and even worked with one in your own application.
    Take a look into them more deeply, to find out what they are really about. Think
    about the real world that you live in again. There are plenty of different objects
    that are the same type. For example, there are many different cars in the world.
    Even those that are the same model, will have differences.


    All cars are essentially the same kind of object, with the same basic components,
    even when there are variations. You can think of one car as a particular *instance
    of a class of objects*, called cars. You can think of a class as a kind of basic
    plan for an object.'
  - '[PAGE 47]


    # Inheritance


    Many objects are different, but they often have a certain number of things in
    common with other objects. Think about cars again, and the many different models
    and types that are out in the world. They all have a number of the same characteristics
    at any point in time, such as a current speed, the gear they are in, and an amount
    of petrol in their engine.


    All of those cars will have certain features that are different from some other
    cars. These include the number of seats they have, the type of engine, and the
    legal class of car that they are.


    In object-oriented languages like Java, a class can inherit other behaviors and
    states from different classes. The class of car could become truck, bus, or van.
    The general class of car would then be considered a superclass for these other
    classes. A class can have just one superclass, which can in turn have many subclasses
    as you would like.


    If you want to make a subclass (truck) for your superclass (car), you can use
    the following syntax:


    ```

    class Car extends truck {


    // you would place your code for defining a truck here

    }

    ```


    This would tell your code that truck contains the same methods and fields as car.
    However, it would allow you to create new features that make a truck different
    from a car.


    When you are making a new superclass, be sure that you write documentation notes
    to describe any new behavior and state that you give it. This is important, because
    you will not be able to see this information in the source files of your subclasses.'
