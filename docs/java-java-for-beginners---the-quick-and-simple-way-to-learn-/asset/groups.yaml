    # Introduction


    If you are at least slightly interested in programming, you have probably heard
    about Java. It is a language for programming that follows in the style of C and
    C++. These are also very common languages, so anyone who already has experience
    with them, should feel comfortable picking up with Java.


    However, there are some important differences with these language, which will
    be discussed in the next chapter.


    # What Will This Book Teach You?


    There is a lot to learn in the world of programming, and many languages have similarities.
    As mentioned, if you are already familiar with another language, you should find
    it easier to get started with Java. However, for everyone else, there are some
    basics to learn in the beginning. They might seem quite unusual at first, but
    you need to build a firm understanding of the basics, before you can start to
    create your own applications.


    While this book is helpful to beginners, it is also a great resource for people
    who already know a little about computer use, and possibly even programming.


    If you are serious about learning computer programming, please understand that
    it is not easy. You will need to learn a lot of technical terms, and it will take
    a long time before you start to fully understand the basics of programming.


    # A Brief History of Java


    Java was first made in 1991, so it is fairly new in comparison to some languages.
    Working at Sun Microsystems, James Gosling and his team started to make Java.
    It was originally made to work with home appliances, such as microwaves, which
    needed to include their own computer processors.


    The new Java language had to work with a range of different computer processors.
    This was because it needed to be compatible with a variety of appliance types.
    Netscape Incorporated released a version of its Netscape Internet browser in 1995.
    They made the browser to be compatible with Java applications.


    As for the name "Java", it was named by its creator. In the beginning, it was
    called "Oak". However, it was soon found out that there was already a programming
    language with that name. After quite some time trying to think of a suitable name
    to replace Oak, Gosling''s team of developers decided to take a break and grab
    some coffee. Since java is another term for the popular beverage, it gave them
    the idea for a new name for their programming language.


    In 2010, Sun Microsystems was acquired by a software company called Oracle. They
    have since then continued to develop Java and related products.


    People often think of Java as a programming language that is just for Internet
    applications. However, it is actually intended for a variety of purposes, for
    use on many different platforms. That is one of the things that make it so popular,
    to those who understand its power.


    # The Popularity of Java


    One of the reasons that Java is so popular, is that it''s *so popular*. Basically,
    it is one of the most commonly used programming languages in the world. Many programmers
    have had some experience with Java at one point or another in their careers. If
    you are thinking about getting into programming, but you cannot decide which language
    to learn first, Java is a recommended choice for you.


    Since Java is particularly popular at the moment, it is a great choice for people
    who rely on freelance programmers and consultants. Finding someone to help maintain
    your code in the future will be pretty easy. This takes away some of the worries
    about creating coding that will be accessible into the future. That type of ubiquity
    is very appealing to a lot of people, especially those outsourcing programming
    work for businesses.


    As well as being popular, Java is great because it is easy to use for cross-platform
    applications. That means it can be used to create programming for a variety of
    different operating systems and platforms. Java is dominant on the server’s side
    of a system.


    Take a look at some of the different things that Java can do, and why it is a
    great programming language to learn:


    # Platform Independence


    This is a key reason for Java being so popular. Platform independence refers to
    its ability to run on a range of different computers. If you have a system that
    is able to run an appropriate JRE (Java Runtime Environment), it will be capable
    of running Java applications. This includes Windows, Mac, Linux, Unix, computer
    mainframes, and even many mobile devices.


    # Java API


    Actually learning Java is fairly simple, because there are just 50 different keywords
    within the language. However, there is a library that contain thousands of different
    classes. In addition to this, there is a far greater number of methods for use
    in programs. The contents of a library is what gives Java a range of different
    functions. Without a library, Java would not be able to have its functionality,
    so it is as integral to Java as the language itself. The library of classes is
    known as the Java API. You are not limited to just one library wanted either.
    There are many options, and they have a range of purposes. Suppose that wanted
    to create a certain genre of game, for example. You could probably find a special
    library that was created to make that task easier. In this way, you can basically
    acquire a customized environment to work in, so you don''t have to build everything
    from the ground, up.


    Before you start to panic, understand that there is no need to learn the Java
    API entirely. Programmers typically only learn smaller parts of it. If someone
    needs to use some classes that they are not comfortable with, it is easy to look
    up more details about them.


    # Object Orientation


    Inherently, Java is an object-oriented language. Programs made using it will be
    comprised of objects. These are elements of programs that are representative of
    abstract concepts, or real objects.


    Here are the two fundamental characteristics of an object:


    - An object has its own *behavior*. This means that it is capable of carrying
    out specific tasks, which are known as methods. For example, if an object is representing
    a vehicle within an application, its methods might include starting, driving,
    stopping, and crashing. Sometimes a method just allows the user access to the
    data of the object, such as its title. own- They also have their own *state*,
    which is basically data. For example, if an object is representing a book, it
    might have data about the author, title, and publisher of that book.

    '
