    \   if(iSize > 0) {\n        result.append(iValues[iSize - 1]);\n    }\n    result.append(\"\
    ]\");\n    return result.toString();\n}\n```\n\n```java\n/**\n* 默认构造函数。创建一个空列表。\n\
    \ */\npublic GenericList(){\n    // 重定向到单整数构造函数\n    this(DEFAULT_CAP);\n    //\
    \ 其他语句可以放在这里\n}\n```\n\n```java\n/**\n* 构造函数，允许类的用户指定\n * 初始容量，以防他们向新列表添加\n *\
    \ 许多元素。创建一个空列表。\n * @param initialCap > 0\n */\npublic GenericList(int initialCap)\
