    \ in its raw form. It stands to reason that to write and edit pieces of code (which\
    \ is text), you will need a text editor. You are probably familiar with word processors,\
    \ which can also create text. However, those are great for making formatted text,\
    \ including letters, reports, books, etc. You will need to work with plain, unformatted\
    \ text, so something like Word will not be acceptable.\n\nThere are a lot of text\
    \ editors for writing your code, including one that you have probably used already,\
    \ called Notepad, which comes with Windows. These are small and often free, although\
    \ there are some commercial text editors that cost money to buy.\n\nWhile you\
    \ can use a very basic text editor like Notepad, it will be much easier to use\
    \ something with more features. A text editor that is made specifically for coding\
    \ will be most useful for programming. Here are some good features to look for\
    \ in a text editor:\n\n- Highlighting of syntax in your code.\n- Shortcuts to\
    \ making running and compiling your programs easier.\n- Helpful completion of\
    \ codes.\n- Previews of your programs.\n- Many other useful functions to make\
    \ your work easier.\n\nWhile it is considered a little more “old school” these\
    \ days, many programmers still use a simple text editor. It allows them to work\
    \ with a range of different programming languages, without swapping the software\
    \ that they are using. As mentioned above, however, some terms are general\n\n\
    ## Learning the Lingo (Acronyms)\n\nBefore you can understand Java, you will come\
    \ across some acronyms. Don't worry about trying to memorize them just yet. Here\
    \ are some terms that are important as you start Java. You will see these terms\
    \ often.\n\n- CPU - Central Processing Unit: This is the “brains” of a computer.\
    \ It contains the control unit.\n- CRT - Cathode Ray Tube: This is a monitor that\
    \ uses an electron beam to excite phosphor dots.\n- ALU - Arithmetic Logic Unit:\
    \ This is the part of the CPU that processes mathematical equations.\n- LAN -\
    \ Local Area Network: This is a series of connected computers that can share their\
    \ storage. Unlike the Internet, it is local, within buildings, schools, and even\
