    \ void resize() {\n    Object[] temp = new Object[iValues.length * 2];\n    System.arraycopy(iValues,\
    \ 0, temp, 0, iValues.length);\n    iValues = temp;\n}\n```\n\n```java\n/**\n\
    \ * 返回此列表的字符串版本。包含大小和\n * 元素。\n */\npublic String toString(){\n    // 我们可以使用 StringBuilder\
