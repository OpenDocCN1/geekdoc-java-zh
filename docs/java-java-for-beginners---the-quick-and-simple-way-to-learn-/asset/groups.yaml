    \n例如，当你选择名称 `HelloWorldApp` 时，它与输入 `hellellowapp` 是不同的。\n\n接下来，你将保存你的新程序。点击 **File\
    \ > Save**。\n\n## 将源编译为 .class 文件\n\n你现在将运行你的第一个应用程序。在 Netbeans 主菜单中，点击 **Run\
    \ >**\n\n## 构建项目 (Hello World App)。\n\n输出窗口不会在源代码编辑器下方显示构建后的代码。你应该能够看到打印出的“Hello\
    \ World!”。但重要的是，你应该看到“BUILD SUCCESSFUL”字样。如果是，你就刚刚创建了第一个成功的应用程序。\n\n如果你看到“BUILD\
    \ FAILED”字样怎么办？你的代码可能存在某种语法错误。别担心，因为使用专门的 IDE（如 Netbeans）处理此类错误会容易得多。错误将显示在你的输出窗口中，并以超链接的形式显示。如果你想找到错误来源，双击该超链接。这将方便你修改错误。之后，你可以再次运行项目，并查看是否解决了问题。\n\
    \n在导航窗口中，你点击 **Files** 选项卡，然后展开 `Hello World App > build > classes > hellapp`。这是为你的项目生成的类文件。\n\
    \n一旦你构建了项目，并确认没有问题，你就可以正式运行它了。在主菜单中，点击 **Run > Run Main Project**。\n\n程序将在你的输出窗口中打印文本“Hello\
    \ World!”，以及其他构建脚本输出。\n\n你刚刚运行了你的第一个程序。恭喜你！\n\n## Hello World! 是如何工作的\n\n你应该理解\
    \ Hello World 应用程序做了什么，但可能急于知道它是如何工作的。再次看看你使用的那些代码：\n\n```\nclass HelloWorldApp\
    \ {\n    System.out.println(\"Hello World!\"); // 显示字符串。\n}\n```\n\n你的应用程序由三个基本部分组成，分别是：\n\
    \n- 你的 `HelloWorldApp` 类。\n- 源代码中的注释。\n- 你的主方法（main method）。\n\n这些解释将让你对你的代码有一个初步的了解。然而，可能需要一些时间你才能真正理解它是怎么的。\n\
    \n## 你的 HelloWorldApp 类\n\n看这一行：\n\n```\nclass HelloWorldApp\n```\n\n这创建了一个类定义，告诉代码后续代码应使用哪个类。随后的花括号将包含你想要用于该特定类的代码。这以后可能会变得复杂得多，但现在你只需要学习基础知识。\n\
    \n## 源代码中的注释\n\n看看你代码中 `//` 之后写的文本。那是注释，编译器将完全忽略它。它们仅供程序员阅读。你可能觉得不需要在代码中添加注释，因为你已经知道为什么要做某些事情。请记住，很多代码会变得非常长且复杂。很容易迷失方向，或者忘记为什么要做某些事情，所以创建注释总是重要的。当其他程序员需要处理你创建的代码时，注释也很有帮助，这样他们可以轻松地找到路并理解一切。\n\
    \n有三种不同类型的注释，它们的作用方式略有不同：\n\n```\n/** 你的文档 */\n```\n\n编译器将忽略 `/**` 和 `*/` 之间的所有内容，但该注释将被视为“文档注释”（doc\
    \ comment）。它是 documentation comment 的缩写。所有的文档注释以后可以使用自动化工具编译，从而创建参考文档。\n\n```\n\
    // 文本\n```\n\n`//` 之后整行的所有内容都会被编译器忽略。\n\n```\n/* 你的注释 */\n```\n\n当你使用这种类型的注释时，`/*`\
    \ 和 `*/` 之间的所有内容都将被你的编译器忽略。\n\n## 你的主方法\n\n最后，看看这一行实际上告诉你的应用程序 `HelloWorldApp`\
    \ 类作用的代码：\n\n```\nSystem.out.println(\"Hello World!\");\n```\n\n`System` 类来自 Java\
    \ 的基础库。它只是告诉系统将“Hello World!”作为标准输出。这就是为什么当你运行应用程序时，屏幕上会打印这些词。\n\n##更多定义\n\n##\
