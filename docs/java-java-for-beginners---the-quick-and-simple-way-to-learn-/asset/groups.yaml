    # 引言


    如果你对编程至少有一点点兴趣，那么你可能听说过 Java。它是一种遵循 C 和 C++ 风格的编程语言。这些也是非常常见的语言，因此任何已经拥有这些语言经验的人，在学习
    Java 时都会感到很从容。


    然而，这些语言之间存在一些重要的区别，将在下一章中讨论。


    # 本书将教你什么？


    编程世界有很多需要学习的内容，而且许多语言之间都有相似之处。正如所提到的，如果你已经熟悉另一种语言，你会发现开始学习 Java 会变得更容易。然而，对于其他人来说，在开始时需要学习一些基础知识。这些起初看起来可能非常寻常，但在开始创建自己的应用程序之前，你需要对基础知识建立稳固的理解。


    虽然这本书对初学者很有帮助，但对于已经熟悉计算机使用、甚至可能懂编程的人来说，也是一个极佳的资源。


    如果你认真地学习计算机编程，请理解这并不容易。你将学习许多技术术语，并且需要很长时间才能完全理解编程的基础。


    # Java 简史


    Java 诞生于 1991 年，所以与某些语言相比，它相当新。在太阳微系统公司（Sun Microsystems）工作期间，詹姆斯·高林（James Gosling）和他的团队开始开发
    Java。它最初的设计是为了用于家用电器，例如微波炉，这些设备需要包含自己的计算机处理器。


    新的 Java 语言必须与各种不同的计算机处理器配合。这是因为它需要兼容各种类型的电器。网景公司（Netscape Incorporated）于 1995
    年发布了其 Netscape 浏览器的版本。他们让浏览器兼容 Java 应用程序。


    至于“Java”这个名字，是由它的创造者命名的。最初，它被称为“Oak”（橡树）。但很快发现已经有一个同名的编程语言了。在花长时间尝试一个合适的名称来代替
    Oak 之后，高林的开发团队决定休息一下，去喝杯咖啡。由于 java 是这种流行饮料的另一种术呼，这为他们为编程语言起一个新名字提供了灵感。


    2010 年，太阳微系统被一家名为甲骨文（Oracle）的软件公司收购。从那时起，他们继续开发 Java 及相关产品。


    人们经常认为 Java 是一种仅用于互联网应用程序的编程语言。然而，它实际上旨在用于各种目的，运行在许多不同的平台上。这就是为什么那些了解其力量的人认为它是如此流行的原因之一。


    # Java 的流行程度


    Java 如此流行的原因之一，是因为它*太流行了*。基本上，它是世界上最常用的编程语言之一。许多程序员在职业生涯的某个阶段都过过 Java 的经验。如果你正在考虑进入编程领域，但无法决定先学哪种语言，Java
    是你的你的推荐选择。


    由于 Java 目前特别流行，因此对于那些依赖自由职业程序员和顾问的人来说，它是一个很棒的选择。未来找人帮助维护你的代码将非常容易。这消除了对创建未来仍可访问的代码的一些顾虑。这种无处不在对许多人非常有吸引力，特别是那些为企业外包编程工作的人。


    除了流行之外，Java 还非常棒，因为它对于跨平台应用程序易于使用。这意味着它可以为各种不同的操作系统和平台创建程序。Java 在系统的服务器端占据主导地位。


    看看 Java 可以做的一些不同事情，以及为什么它是一门非常值得学习的编程语言：


    # 平台无关性


    这是 Java 如此流行的关键原因之一。平台无关性指的是它在系列不同计算机上运行的能力。如果你有一个能够运行适当 JRE（Java 运行环境）的系统，它就能运行
    Java 应用程序。这包括 Windows、Mac、Linux、Unix、计算机主机，甚至是许多移动设备。


    # Java API


    实际上学习 Java 非常简单，因为该语言中只有 50 个不同的关键字。然而，有一个包含成千上万不同类的库。此外，用于程序的方法数量要多得多。库的内容赋予了
    Java 各种功能。没有库，Java 将无法拥有其功能，因此它和语言本身一样重要。这个类库被称为 Java API。你并不局限于某一个库。


    在开始恐慌之前，请理解没有必要学习整个 Java API。程序员通常只学习它的小部分。如果有人需要使用一些不熟悉的类，很容易查到它们的详细信息。


    # 面向对象


    Java 本质上面向对象的语言。使用它编写的程序将由对象组成。这些是代表抽象概念或真实对象的程序元素。


    对象有两个基本特征：


    - 对象有自己的*行为*。这意味着它能够执行特定的任务，这些任务被称为方法。例如，如果一个对象代表应用程序中的一个车辆，它的方法可能包括启动、行驶、停止和碰撞。-
    它们还有自己的*状态*，基本上就是数据。例如，如果一个对象代表一本书，它可能有关于作者、标题和出版者的数据。


    '
