    # INTRODUCTION


    # What is an Applet?


    According to Sun "An applet is a small program that is intended to be run on its
    own


    # Four definitions of applet:


    +   * A small application

    * A secure program that runs inside a web browser

    * A subclass of java.applet.Applet

    * An instance of a subclass of java.applet.Applet


    # The APPLET HTML Tag


    Applets are embedded in web pages using the <APPLET> and </APPLET> tags. The <APPLET>
    tag is similar to the <IMG> tag.


    +   * The CODE attribute of <APPLET> tag tells the browser where to look for the
    compiled .class file. It is relative to the location of the source document.

    * The CODEBASE attribute is a URL that points at the directory where the .class'
  - '[PAGE 9]


    file is. The CODE attribute is the name of the .class file itself. For instance
    if on the HTML page of the previous section you had written


    ```

    <APPLET

    CODE="TestApplet.class"

    CODEBASE="classes"

    WIDTH=200 HEIGHT=200

    </APPLET>

    ```


    then the browser would have tried to find TestApplet.class in the classes directory
    in the same directory as the HTML page that included the applet. On the other
    hand if you had written


    ```

    <APPLET

    CODE="TestApplet.class"

    CODEBASE="http://www.foo.bar/classes"

    WIDTH=200

    HEIGHT=200

    </APPLET>

    ```


    then the browser would try to retrieve the applet from http://www.foo.bar/classes/TestApplet.class
    regardless of where the HTML page was.


    In short the applet viewer will try to retrieve the applet from the URL given
    by the formula (CODEBASE + "/" + code). Once this URL is formed all the usual
    rules of relative and absolute URLs apply.


    You can leave off .class extension and just use the class name in the CODE attribute.
    For example,


    ```

    <APPLET CODE="TestApplet"

    CODEBASE="http://www.foo.bar/classes"

    WIDTH=200

    HEIGHT=200

    </APPLET>

    ```


