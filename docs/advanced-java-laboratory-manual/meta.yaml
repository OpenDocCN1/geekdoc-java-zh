  mdcn: "\n\n例如，在购物车应用程序中，客户端通过多次请求不断向购物车添加物品。每当发出请求时，服务器都应该识别客户端购物车中要添加的物品。在这种情况下，需要进行会话跟踪（session\
    \ tracking）。\n\n解决方案是，当客户端发送请求时，每次都通过提供唯一标识符来介绍自己。实现这一点有五方法。\n\n## 会话跟踪方法：\n\n\
