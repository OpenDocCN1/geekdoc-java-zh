    # Session


    A session is a conversation between the server and a client. A conversation consists
    of series of continuous request and response.


    When there is a series of continuous request and response from a same client to
    a server, the server cannot identify from which client it is getting requests.
    Because HTTP is a stateless protocol.


    When there is a need to maintain the conversational state, session tracking is
    needed.'
