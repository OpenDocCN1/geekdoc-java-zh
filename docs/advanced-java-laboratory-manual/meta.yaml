  md: '# Graphics Objects


    In Java all drawing takes place via a Graphics object. This is an instance of
    the class java.awt.Graphics. Initially the Graphics object you use will be the
    one passed as an argument to an applet''s paint() method.


    Each Graphics object has its own coordinate system, and all the methods of Graphics
    including those for drawing Lines, rectangles, circles, polygons and more. Drawing
    in Java starts with particular Graphics object. You get access to the Graphics
    object through the paint(Graphics g) method of your applet. Each draw method will
    call like g,drawString("Hello World", 0, 50) where g is the particular Graphics
    object with you''re drawing.


