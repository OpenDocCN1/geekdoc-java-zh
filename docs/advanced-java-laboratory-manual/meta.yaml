    The TextField class implements a single-line text-entry area, usually called an
    edit

    control. Text fields allow the user to enter strings and to edit the text using
    the arrow keys,

    cut and paste keys, and mouse selections. TextField is a subclass of TextComponent.

    TextField defines the following constructors:


    +   - TextField();


    +   - TextField(int numChars);


    +   - TextField(String str);


    +   - TextField(String str, int numChars);


    The first version creates a default text field. The second form creates a text
    field that is

    numChars characters wide. The third form initializes the text field with the string

    contained in str. The fourth form initializes a text field and sets its width.
    TextField (and

    its superclass TextComponent) provides several methods that allow us to utilize
    a text

    field. In order to obtain the string currently contained in the text field, we
    can use getText(

    ). For setting the text, we call setText( ). These methods are as follows:


    +   - String getText( );


    +   - void setText(String str);


    Here, str is the new string. The user can select a portion of the text in a text
    field. Also,

    we can select a portion of text under program control by using select( ). Our
    program

    out obtain the currently selected text by calling the getText( ). These methods
    are

    shown here:


    +   - String getSelectedText( );


    +   - void select(int start, int endIndex);


    The getSelectedText( ) returns the selected text. The select( ) method selects
    the

    characters starting at startIndex and ending at endIndex-1. We can control whether
    the

    contents of a text field can be modified by the user by calling setEditable( ).
    We can

    determine editability by calling setEditable( ). These methods are shown here:


    +   - boolean isEditable();


    +   - void setEditable(boolean canEdit);


    The isEditable( ) returns true if the text may be changed and false if not. In

    setEditable( ), if canEdit is true, the text may be changed. It is altered.

    There may be times when we want the user to enter text that is not displayed,

    by callingEchoChar( ). This method specifies a single character that the TextField
