  md: 'For example, in a shopping cart application client keeps on adding items into
    his cart using multiple requests. Every we request is made, the server should
    identify in client''s cart the item is to be added. In this scenario, there is
    a certain need for session tracking.


    Solution is, when a client makes a request it should introduce itself by providing
    unique identifier every time. There are five different methods to achieve this.


    # Session tracking methods:


    +   1. User authorization

    2. Hidden fields

    3. URL rewriting

    4. Cookies

    5. Session tracking API


    # Cookies


    Also known as browser cookies or tracking cookies, cookies are small, often encrypted
    text files, located in browser directories. They are used by web developers to
    help users navigate their websites efficiently and perform certain functions.
    Due to their core role of enhancing/enhancing usability or site processes, disabling
    cookies may prevent users from using certain websites.


    Cookies are created when a user''s browser loads a particular website. The website
    sends information to the browser which then creates a text file. Every time the
    user goes back to the same website, the browser retrieves and sends this file
    to the website''s server. Computer cookies are created not just by the user who
    is browsing but also by other websites that run ads, widgets, or other elements
    on the page being loaded. These cookies regulate how the ads appear or how the
    widgets and other elements function on the page.


    # Cookie Class


    In JSP cookie is the object of the class javax.servlet.Cookie. This class is used
    to create a cookie, a small amount of information sent by a servlet to a Web browser,
    saved by the browser, and later sent back to the server. A cookie''s value can
    uniquely identify a client, so cookies are commonly used for session management.
    A cookie has a name, a single value, and other attributes such as a comment, path
    and domain qualifiers, a maximum age, and a version number.


    The getCookies() method of the request object returns an array of Cookie objects.
    Cookies can be constructed using the following code:


    ```

    Cookie(java.lang.String name, java.lang.String value)

