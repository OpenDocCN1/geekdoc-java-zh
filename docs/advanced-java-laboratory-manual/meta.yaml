    to be embedded into static content.


    The JSP syntax adds additional XML-like, called JSP actions, to be used to invoke
    built-functionality. Additionally, the technology allows for the creation of JSP
    tag libraries that act as extensions to the standard HTML or XML tags.


    Tag libraries provide a platform independent way of extending the capabilities
    of a Web server.


    JSPs are compiled into Java Servlets by a JSP compiler. A JSP compiler may generate
    a servlet in Java code that is then compiled by the Java compiler, or it may generate
    byte code for the servlet directly.


    JSP technology enables Web developers and designers to rapidly develop and easily
    maintain, information-rich, dynamic Web pages that leverage existing business
    systems. As part of the Java technology family, JSP technology enables rapid development
    of Web-based applications that are platform independent.


    JSP technology separates the user interface from content generation, enabling'
  - '[PAGE 129]


    designers to change the overall page layout without altering the underlying dynamic
    content


