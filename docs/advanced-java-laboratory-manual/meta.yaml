    \ Label(\"Name: \", Label.RIGHT); passp = new Label(\"Password: \", Label.RIGHT);\
    \ name = new TextField(12);\n    pass = new TextField(8); pass.echoChar('?');\
    \ add(namep);\n    add(pass);\n}\n\n## TextArea (文本区域)\n\n有时单行文本输入是不够的。为了处理这些情况，AWT\
    \ 了一个名为 TextArea 的多行编辑器。以下是构造函数：\n\n- TextArea();\n- TextArea(int numChars);\n\
    - TextArea(String str);\n- TextArea(String str, int numChars);\n- TextArea(String\
    \ str, int numChars, int sBars);\n\n在这里，`numChars` 指定了文本区域的高度（行数），`numChars` 指定了宽度。初始文本可以通过\
    \ `str` 指定。在第五种形式中，我们可以指定要拥有的滚动条。`sBars` 必须是以下值之一：\n\n- SCROLLBARS_BOTH\n- SCROLLBARS_NONE\n\
    - SCROLLBARS_HORIZONTAL_ONLY\n- SCROLLBARS_VERTICAL_ONLY\n\nTextArea 是 TextComponent\
    \ 的子类。因此，它支持在前节中描述的 `getText()`、`setText()`、`isEditable()` 和 `setEditable()` 方法。TextArea\
    \ 增加了以下方法：\n\n- void append(String str);\n- void insert(String str, int index);\n\
