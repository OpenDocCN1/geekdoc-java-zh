    \ 是 TextComponent 的子类。\n\nTextField 定义了以下构造函数：\n\n- TextField();\n- TextField(int\
    \ numChars);\n- TextField(String str);\n- TextField(String str, int numChars);\n\
    \n第一个版本创建一个默认文本字段。第二种形式创建一个宽度为 `numChars` 个字符的文本字段。第三种形式用 `str` 包含的字符串初始化文本字段。第四种形式初始化文本字段并设置其宽度。TextField（及其父类\
    \ TextComponent）提供了几个方法允许我们利用文本字段。要获取文本字段中当前包含的字符串，我们可以使用 `getText()`。要设置文本，我们调用\
    \ `setText()`。这些方法如下：\n\n- String getText();\n- void setText(String str);\n\n\
    在这里，`str` 是新字符串。用户可以选择文本字段中的部分文本。此外，我们也可以通过 `select()` 在程序控制下选择部分文本。我们的程序可以通过调用\
    \ `getText()` 获取当前选中的文本。这些方法显示在这里：\n\n- String getSelectedText();\n- void select(int\
    \ start, int endIndex);\n\n`getSelectedText()` 返回选中的文本。`select()` 方法选择从 `startIndex`\
    \ 开始到 `endIndex-1` 结束的字符。我们可以通过调用 `setEditable()` 控制用户是否可以修改文本字段的内容。通过调用 `setEditable()`\
    \ 判断是否编辑。这些方法显示在这里：\n\n- boolean isEditable();\n- void setEditable(boolean canEdit);\n\
    \n如果文本可以更改，则 `isEditable()` 返回 `true`，否则返回 `false`。在 `setEditable()` 中，如果 `canEdit`\
    \ 为 `true`，则可以更改文本。它会被修改。有时我们可能通过调用 `echoChar()` 让用户输入不显示的文本。此方法指定了输入时显示的字符。这些方法如下：\n\
    \n```\nvoid echoChar(char ch);\nboolean echoCharSet();\nchar getEchoChar();\n\
    ```\n\n在这里，`ch` 指定了回显字符。\n\n### 示例：使用 TextField\n\n```\n//TextFieldDemo.java\n\
