  md: '# Ovals and Circles


    Java has methods to draw outlined and filled ovals. As you''d probably guess these
    methods are called drawOval() and fillOval() respectively. As you might not guess
    they take identical arguments to drawRect() and fillRect(), i.e.


    ```

    public void drawOval(int left, int top, int width, int height)

    public void fillOval(int left, int top, int width, int height)

    ```


    Instead of the dimensions of the oval itself, the dimensions of the smallest rectangle
    which can enclose the oval are specified. The oval is drawn as large as it can
    be to touch the rectangle''s edges at its centers. This picture may help:


