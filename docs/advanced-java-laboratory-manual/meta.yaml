    ```\n\nThe import statements direct the Java compiler to include the java.applet.Applet\
    \ and java.awt.Graphics classes in the compilation. The import statement allows\
    \ these classes to be referenced in the source code using the simple class name\
    \ (i.e. Applet) instead of the fully qualified class name (i.e. java.applet.Applet).\n\
    \nThe Applet provides the framework for the host application to display and control\
    \ the lifecycle of the applet. The Applet class is an Abstract Windowing Toolkit\
    \ (AWT) Component, which provides the applet with the capability to display a\
    \ graphical user interface (GUI) and respond to user events.\n\n## Executing Applet\
    \ directly using Appletviewer\n\n## TestApplet.java\n\n```java\nimport java.applet.*;\n\
    import java.awt.*;\n/*\n<APPLET code=\"TestApplet.class\" width=350 height=200></APPLET>\n\
    */\npublic class TestApplet extends Applet\n{\n  public void paint (Graphics g)\n\
    {\n  g.drawString(\"Welcome to Applet\",20,40);\n}\n}\n```\n\n## The Basic Applet\
    \ Life Cycle\n\n- 1. The browser reads the HTML page and finds any <APPLET> tags.\n\
    2. The browser parses the <APPLET> tag to find the CODE and possibly CODEBASE\
    \ attribute.\n3. The browser downloads the .class file for the applet from the\
    \ URL found in the last step.\n4. The browser converts the raw bytes downloaded\
    \ into a Java class, that is a java.lang.Object.\n5. The browser instantiates\
    \ the applet class to form an applet object. This requires the applet to have\
    \ a nargs constructor.\n6. The browser calls the applet's init() method.\n7. The\
    \ browser calls the applet's start() method.\n8. While the applet is running,\
    \ the browser passes any events intended for the applet, e.g. mouse clicks, key\
    \ presses, etc., to the applet's handleEvent method. Update events are used to\
    \ tell the applet that it needs to repaint itself.\n9. The browser calls the applet's\
    \ stop() method.\n10. The browser calls the applet's destroy() method.\n\nAll\
    \ applets have the four methods:\n\n```java\npublic void init();\npublic void\
    \ start();\npublic void stop();\npublic void destroy();\n```\n\n## Simple Methods\
    \ to Design Applet\n\n| Method | Description |\n| :--- | :--- |\n| void setBackground(Color\
    \ colorname) | To set the background of an applet window. |\n| void setForeground(Color\
    \ colorname) | To set the foreground color of an applet window. |\n| Color getBackground\
    \ ( ) | To obtain the current settings for the background color |\n| Color getForeground\
    \ ( ) | To obtain the current settings for the foreground color |\n| Applet getApplet\
    \ ( String name ) | To obtain the applet specified by name from the current applet\
    \ context. |\n| Void showStatus(String status ) | To display the status message\
    \ in the status bar of applet window |\n| URL getDocumentBase ( ) | To obtain\
    \ the directory of the current browser page. |\n| URL getCodeBase() | To obtain\
    \ the directory from which the applet's class file was loaded |\n\nExample:\n\n\
    ```java\nimport java.applet.*;\nimport java.awt.*;\nimport java.net.*;\n/*\n<applet\
    \ code=AppletMethods height=300 width=400>\n<param name=first value=\"KDP\">\n\
    </applet>\n*/\npublic class AppletMethods extends Applet\n{\n    String arg;\n\
    \    public void start()\n    {\n        arg=getParameter(\"first\");\n    }\n\
    \    public void paint(Graphics g)\n    {\n      setBackground(Color.black);\n\
    \      setForeground(Color.white);\n      URL codename=getCodeBase();\n      URL\
    \ document=getDocumentBase();\n      g.drawString(\"String = Welcome to KDP\"\
    ,30,40);\n      g.drawString(\"Parameter Value = \"+arg,30,70);\n      g.drawString(\"\
    Class name = \"+codename.toString(),30,100);\n      g.drawString(\"DocumentBase\
    \ = \"+document.toString(),30,130);\n    }\n}\n```\n\nOutput:\n\n## Passing Parameters\
    \ to Applets\n\nParameters are passed to applets in NAME=VALUE pairs in <PARAM>\
    \ tags between the opening and closing APPLET tags. Inside the applet, you read\
    \ the values passed through the PARAM tags with the getParameter() method of the\
    \ java.applet.Applet class.\n\n```html\n<param name = parameter_name value = parameter_value>\n\
    ```\n\nComplete syntax for the APPLET tag including Param Tag\n\n```html\n<APPLET\n\
    \  CODEBASE = codebaseURL\n  CODE = appletFile\n  ALT = alternateText\n  NAME\
    \ = appletInstanceName\n  WIDTH = pixels HEIGHT = pixels\n  ALIGN = alignment\n\
    >\n<PARAM NAME = appletAttribute1 VALUE = value>\n<PARAM NAME = appletAttribute2\
    \ VALUE = value>\n...\nalternateHTML\n</APPLET>\n```\n\nExample Applet with parameters\n\
    \n```java\n/*\n * AppletWithPara.java\n *\n */\nimport java.applet.*;\nimport\
    \ java.awt.*;\n/*\n<applet code=AppletWithPara width=200 height=150>\n<param name=author\
    \ value=\"J.B.Patel\">\n<param name=age value=\"27\">\n<param name=designation\
    \ value=\"Lecturer\">\n<param name=institute value=\"SSPC Visnagar\">\n</applet>\n\
    \ */\npublic class AppletWithPara extends java.applet.Applet\n{\n  public void\
    \ paint (Graphics gp)\n  {\n    String au=getParameter(\"author\");\n    String\
    \ ag=getParameter(\"age\");\n    String desg=getParameter(\"designation\");\n\
    \    String inst=getParameter(\"institute\");\n    gp.drawString(\"Author\":+au,20,40);\n\
    \    gp.drawString(\"Age\":+ag,20,70);\n    gp.drawString(\"Designation\":+desg,20,100);\n\
    \    gp.drawString(\"Institute\":+inst,20,130);\n    showStatus(\"Parameter methods\"\
    );\n  }\n}\n```\n\nOutput:\n\n![](img/82c0971c9988652186bbdfa7c6f97adb_15_0.png)\n\
    \n## The Coordinate System\n\nJava uses the standard, two-dimensional, computer\
    \ graphics coordinate system. The first visible pixel in the upper left-hand corner\
    \ of the applet canvas is (0, 0). Coordinates increase to the right and down.\n\
    \n## Graphics Objects\n\nIn Java all drawing takes place via a Graphics object.\
    \ This is an instance of the class java.awt.Graphics. Initially the Graphics object\
    \ you use will be the one passed as an argument to an applet's paint() method.\n\
    \nEach Graphics object has its own coordinate system, and all the methods of Graphics\
    \ including those for drawing Lines, rectangles, circles, polygons and more. Drawing\
    \ in Java starts with particular Graphics object. You get access to the Graphics\
    \ object through the paint(Graphics g) method of your applet.\n\nCommon used methods\
    \ of Graphics are as follows:\n\n| Method | Description |\n| :--- | :--- |\n|\
    \ draw ( String s, int x, int y ) | To output a string to an applet at specified\
    \ position. It is called from update( ) or paint( ). |\n| drawChars ( char c ],\
    \ int start_index, num_of_char, int x, int y ) | To output characters of array\
    \ to an applet at specified location. |\n| drawChars ( byte c ], int start_index,\
    \ num_of_char, int x, int y ) | To output characters of byte's array to an applet\
    \ at specified location. |\n| drawLine (int x1, int y1, int x2, int y2); | To\
