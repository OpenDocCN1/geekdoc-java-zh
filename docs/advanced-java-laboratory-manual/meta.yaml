    \n也称为浏览器 Cookie 或跟踪 Cookie，是位于浏览器目录中的小型、通常经过加密的文本文件。Web 开发人员使用它们来帮助用户高效地浏览网站并执行某些功能。由于\
    \ Cookie 在增强可用性或网站流程中的核心作用，禁用 Cookie 可能导致用户无法使用某些网站。\n\n当用户的浏览器加载特定网站时就会创建 Cookie。网站将信息发送给浏览器，浏览器随后创建一个文本文件。每当用户返回同一个网站时，浏览器都会检索并将文件发送到网站服务器。计算机\
    \ Cookie 不仅由浏览的用户创建，还由在加载页面上运行广告、小部件或其他元素的其他网站创建。这些 Cookie 规范了广告显示的方式或小部件和其他元素在页面上的运行方式。\n\
    \n## Cookie 类\n\n在 JSP 中，cookie 是 `javax.servlet.Cookie` 类的对象。该类用于创建 Cookie，Cookie\
    \ 是 servlet 发送到 Web 浏览器的少量信息，由浏览器保存，稍后发送回服务器。Cookie 的值可以唯一标识客户端，因此 Cookie 常用于会话管理。一个\
    \ Cookie 包含名称、单个值以及其他属性，如注释、路径和域限定符、最大生存期和版本号。\n\n请求对象的 `getCookies()` 方法返回 `Cookie`\
