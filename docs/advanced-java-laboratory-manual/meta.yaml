    \nFig. Text components hierarchy\n\n## TextField\n\nThe TextField class implements\
    \ a single-line text-entry area, usually called an edit control. Text fields allow\
    \ the user to enter strings and to edit the text using the arrow keys, cut and\
    \ paste keys, and mouse selections. TextField is a subclass of TextComponent.\n\
    \nTextField defines the following constructors:\n\n- TextField();\n- TextField(int\
    \ numChars);\n- TextField(String str);\n- TextField(String str, int numChars);\n\
    \nThe first version creates a default text field. The second form creates a text\
    \ field that is numChars characters wide. The third form initializes the text\
    \ field with the string contained in str. The fourth form initializes a text field\
    \ and sets its width. TextField (and its superclass TextComponent) provides several\
    \ methods that allow us to utilize a text field. In order to obtain the string\
    \ currently contained in the text field, we can use getText(). For setting the\
    \ text, we call setText(). These methods are as follows:\n\n- String getText();\n\
    - void setText(String str);\n\nHere, str is the new string. The user can select\
    \ a portion of the text in a text field. Also, we can select a portion of text\
    \ under program control by using select(). Our program can obtain the currently\
    \ selected text by calling the getText(). These methods are shown here:\n\n- String\
    \ getSelectedText();\n- void select(int start, int endIndex);\n\nThe getSelectedText()\
    \ returns the selected text. The select() method selects the characters starting\
    \ at startIndex and ending at endIndex-1. We can control whether the contents\
    \ of a text field can be modified by the user by calling setEditable(). We can\
    \ determine editability by calling setEditable(). These methods are shown here:\n\
    \n- boolean isEditable();\n- void setEditable(boolean canEdit);\n\nThe isEditable()\
    \ returns true if the text may be changed and false if not. In setEditable(),\
    \ if canEdit is true, the text may be changed. It is altered. There may be times\
    \ when we want the user to enter text that is not displayed, by calling echoChar().\
    \ This method specifies a single character that the TextField will display when\
    \ characters are entered (thus, actual characters typed will not be shown). We\
    \ can check a text field to see if it is in this mode with the echoCharIsSet()\
    \ method and can retrieve the echo character by calling the getEchoChar() method.\
    \ These methods are as follows:\n\n```\nvoid setEchoChar(char ch);\nboolean echoCharIsSet();\n\
    char getEchoChar();\n```\n\nHere, ch specifies the character to be echoed.\n\n\
    ### Example: Using TextField\n\n```\n//TextFieldDemo.java\nimport java.awt.*;\n\
    import java.applet.*;\n/*\n<applet code=\"TextFieldDemo\" width=380 height=150>\n\
    </applet>\n*/\npublic class TextFieldDemo extends Applet\n{\n    TextField name,\
    \ pass;\n    public void init()\n    {\n        Label namep = new Label(\"Name:\
    \ \", Label.RIGHT); passp = new Label(\"Password: \", Label.RIGHT); name = new\
    \ TextField(12);\n        pass = new TextField(8); pass.setEchoChar('?'); add(namep);\n\
    \        add(passp); add(name); add(pass);\n    }\n}\n```\n\nOutput:\n\n## TextArea\n\
    \nSometimes a single line of text input is not enough for a given task. To handle\
    \ these situations, AWT includes a multiline editor called TextArea. Following\
    \ are the constructors:\n\n- TextArea();\n- TextArea(int numChars);\n- TextArea(String\
    \ str);\n- TextArea(String str, int numChars);\n- TextArea(String str, int numChars,\
    \ int sBars);\n\nHere, numLines specifies the height, in lines, of the text area,\
    \ and numChars specifies its width. Initial text can be specified by str. In the\
    \ fifth form we can specify the scroll bars we control to have. sBars must be\
    \ one of these values:\n\n- SCROLLBARS_BOTH\n- SCROLLBARS_NONE\n- SCROLLBARS_HORIZON_ONLY\n\
    - SCROLLBARS_VERTICAL_ONLY\n\nTextArea is a subclass of TextComponent. Therefore,\
    \ it supports the getText(), setText(), isEditable(), and setEditable() methods\
    \ described in the preceding section. TextArea adds the following methods:\n\n\
    - void append(String str);\n- void insert(String str, int index);\n- void replaceRange(String\
    \ str, int startIndex, int endIndex);\n\nThe append() method appends the string\
    \ specified by str to the end of the current text. The insert() method inserts\
    \ the string passed as str at the specified index. In order to replace text, we\
    \ call replaceRange(). It replaces the characters from startIndex to endIndex–1,\
    \ with the replacement text passed in str. Text areas are almost self-contained\
    \ controls.\n\n### Example: Using TextArea Control\n\n```\n//TextAreaDemo.java\n\
    import java.awt.*;\nimport java.applet.*;\n/*\n<applet code=\"TextAreaDemo\" width=300\
