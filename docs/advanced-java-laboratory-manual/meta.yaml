    # INTRODUCTION


    Servlets: For development of web bas components Servlets are the Java language
    technology for extending and enhancing Web servers. Servlets provide a component-based,
    platform-independent method for building Web-based applications, without the performance
    limitations of CGI programs. And unlike proprietary extension mechanisms (such
    as the Netscape Server API or Apache modules), servlets are server- and platform-independent.
    This leaves you to select a "best of breed" strategy for your servers, platforms,
    and tools. Servlets have access to the entire family of Java APIs, including the
    JDBC API to access enterprise databases. Servlets can also access a library of
    HTTP-specific calls and receive all the benefits of the mature language, including
    portability, performance, reusability, and crash protection.


    Today servlets are a popular choice for building interactive Web applications.
    Thirdparty servlet containers are available for Apache Web Server, Microsoft IIS,
    and others. Servlet containers are usually a component of Web and application
    servers, such as BEA WebLogic Application Server, IBM WebSphere, Sun Java System
    Web Server, Sun Java System Application Server, and others.


