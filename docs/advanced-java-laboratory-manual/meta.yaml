- md: "\n# Layout Managers\n\nAll of the components that we have shown so far have\
    \ been positioned by the default layout manager. A layout manager automatically\
    \ arranges our controls within a window by using some type of algorithm.\n\nEach\
    \ Container has a layout manager associated with it. A layout manager is an instance\
    \ of any class that implements the LayoutManager interface. The layout manager\
    \ is set by the setLayout() method. If no call to setLayout() is made, then the\
    \ default layout manager is used. Whenever a container is resized (or sized for\
    \ the first time), the layout manager is used to position each of the components\
    \ within.\n\n![](img/82c0971c9988652186bbdfa7c6f97adb_67_0.png)\n\nFig. Layout\
    \ Managers at work\n\nThe setLayout() method has the following general form:\n\
    `void setLayout(LayoutManager layoutObj);`\n\nHere, layoutObj is a reference to\
    \ the desired layout manager. If we wish to disable the layout manager and position\
    \ components manually, pass null for layoutObj. If we need to determine the shape\
    \ and position of each component manually, using the setBounds() method defined\
    \ by Component.\n\nEach layout manager keeps track of a list of components that\
    \ are stored by their names. The layout manager is notified each time we add a\
    \ component to a container.\n\nWhenever the container needs to be resized, the\
    \ layout manager is consulted via its minimumLayoutSize() and preferredLayoutSize()\
    \ methods. Each component that is being managed by a layout manager calls getPreferredSize()\
    \ and getMinimumSize() methods. These return the preferred and minimum size required\
    \ to display each component. Java has several predefined LayoutManager classes,\
    \ several of which are described next. We can use the layout manager that best\
    \ fits our application.\n\n## FlowLayout\n\nFlowLayout is the default layout manager.\
    \ Components are laid out from the upper-left corner, left to right and top to\
    \ bottom. When no more components fit on a line, the next one appears on the next\
    \ line. A small space is left between each component, above and below, as well\
    \ as left and right. Here are the constructors for FlowLayout:\n\n- FlowLayout();\n\
    - FlowLayout(int how);\n- FlowLayout(int how, int horz, int vert);\n\nThe first\
    \ form creates the default layout, which centers components and leaves pixels\
    \ of space between each component. The second form lets us specify how each line\
    \ is aligned. Valid values for how are as follows:\n\n- FlowLayout.LEFT\n- FlowLayout.CENTER\n\
    - FlowLayout.RIGHT\n\nThese values specify left, center, and right alignment,\
    \ respectively. The third form allows us to specify the horizontal and vertical\
    \ space between components in horz and vert, respectively. Here is a version of\
    \ the CheckboxDemo applet earlier, modified that it uses left-aligned flow layout.\n\
    \n```java\n// FlowLayoutDemo.java\nimport java.awt.*;\nimport java.awt.applet.*;\n\
    /*\n<applet code=\"FlowLayoutDemo\" width=400 height=200>\n</applet>\n*/\npublic\
    \ class FlowLayoutDemo extends Applet\n{\n  String msg = \"\";\n  Checkbox Win98,\
    \ winNT, solaris, mac;\n\n  public void init()\n  {\n  Win98 = new Checkbox(\"\
    Windows 98/XP\", null, true);\n  winNT = new Checkbox(\"Windows NT/2000\");\n\
    \  solaris = new Checkbox(\"Solaris\");\n  mac = new Checkbox(\"MacOS\");\n  setLayout(new\
    \ FlowLayout(FlowLayout.CENTER));\n  add(Win98); add(winNT); add(solaris); add(mac);\n\
    \  }\n\n  public void paint(Graphics g)\n  {\n  }\n}\n```\n\nOutput:\n\n## BorderLayout\n\
    \nThe BorderLayout class implements a common layout style for top-level windows.\
    \ It has four narrow, fixed-width components at the edges and one large area in\
    \ the center. The four sides are referred to as north, south, east, and west.\
    \ The middle area is called the center. Here are the constructors defined by BorderLayout:\n\
    \n- BorderLayout();\n- BorderLayout(int horz, int vert);\n\nThe first form creates\
    \ a default border layout. The second allows us to specify the horizontal and\
    \ vertical space between components in horz and vert, respectively. BorderLayout\
    \ defines the following constants that specify the regions:\n\n- BorderLayout.CENTER\n\
    - BorderLayout.SOUTH\n- BorderLayout.EAST\n- BorderLayout.WEST\n- BorderLayout.NORTH\n\
    \nWhen adding components, we will use these constants with the following form\
    \ of add(), which is defined by Container:\n\n```java\nvoid add(Component compObj,\
    \ Object region);\n```\n\nHere, compObj is the component to be added, and region\
    \ specifies where the component will be added. Here is an example of a BorderLayout\
    \ with a component in each layout area:\n\n```java\n// BorderLayoutDemo.java\n\
    import java.awt.*; import java.applet.*;\n/*\n<applet code=\"BorderLayoutDemo\"\
    \ width=400 height=200>\n</applet>\n*/\npublic class BorderLayoutDemo extends\
    \ Applet\n{\n    public void init() {\n        setLayout(new BorderLayout(\"This\
    \ is across the top.\"), BorderLayout.NORTH);\n        add(new Button(\"The footer\
    \ message might go here.\"), BorderLayout.SOUTH);\n        add(new Button(\"Right\"\
    ), BorderLayout.EAST);\n        add(new Button(\"Left\"), BorderLayout.WEST);\n\
    \        String msg = \"The reasonable man adapts \" + \"himself to the world:\\\
