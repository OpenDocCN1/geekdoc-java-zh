    \        else if(r) c.setBackground(Color.RED);\n        else if(g) c.setBackground(Color.GREEN);\n\
    \        else if(b) c.setBackground(Color.BLUE);\n        else c.setBackground(Color.WHITE);\n\
    \    }\n}\n```\n\n"
