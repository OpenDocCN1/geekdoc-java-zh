    # Layout Managers


    All of the components that we have shown so far have been positioned by the default
    layout manager. A layout manager automatically arranges our controls within a
    window by using some type of algorithm.


    Each Container has a layout manager associated with it. A layout manager is an
    instance of any class that implements the LayoutManager interface. The layout
    manager is set by the setLayout() method. If no call to setLayout() is made, then
    the default layout manager is used. Whenever a container is resized (or sized
    for the first time), the layout manager is used to position each of the components
    within.


    ![](img/82c0971c9988652186bbdfa7c6f97adb_67_0.png)


    Fig. Layout Managers at work


    The setLayout() method has the following general form:

    void setLayout(LayoutManager layoutObj);


    Here, layoutObj is a reference to the desired layout manager. If we wish to disable
    the layout manager and position components manually, pass null for layoutObj.
    If we need to determine the shape and position of each component manually, using
    the setBounds() method defined by Component.


    Each layout manager keeps track of a list of components that are stored by their
    names. The layout manager is notified each time we add a component to a container.'
  - "[PAGE 68]\n\nWhenever the container needs to be resized, the layout manager is\
    \ consulted via its minimumLayoutSize() and preferredLayoutSize() methods. Each\
    \ component that is being managed by a layout manager calls getPreferredSize()\
    \ and getMinimumSize() methods. These return the preferred and minimum size required\
    \ to display each component. Java has several predefined LayoutManager classes,\
    \ several of which are described next. We can use the layout manager that best\
    \ fits our application.\n\n# # FlowLayout\n\nFlowLayout is the default layout\
    \ manager. Components are laid out from the upper-left corner, left to right and\
    \ top to bottom. When no more components fit on a line, the next one appears on\
    \ the next line. A small space is left between each component, above and below,\
    \ as well as left and right. Here are the constructors for FlowLayout:\n\n+  \
    \ * FlowLayout();\n* FlowLayout(int how);\n* FlowLayout(int how, int horz, int\
    \ vert);\n\nThe first form creates the default layout, which centers components\
    \ and leaves pixels of space between each component. The second form lets us specify\
    \ how each line is aligned. Valid values for how are as follows:\n\n+   * FlowLayout.LEFT\n\
    * FlowLayout.CENTER\n* FlowLayout.RIGHT\n\nThese values specify left, center,\
    \ and right alignment, respectively. The third form allows us to specify the horizontal\
    \ and vertical space between components in horz and vert, respectively. Here is\
    \ a version of the CheckboxDemo applet earlier, modified that it uses left-aligned\
    \ flow layout.\n\n```\n// FlowLayoutDemo.java\nimport java.awt.*;\nimport java.awt.applet.*;\n\
    /*\n<applet code=\"FlowLayoutDemo\" width=400 height=200>\n</applet>\n*/\npublic\
    \ class FlowLayoutDemo extends Applet\n{\n  String msg = \"\"\n  Checkbox Win98,\
    \ winNT, solaris, mac;\n```"
