    # TextArea


    Sometimes a single line of text input is not enough for a given task. To handle
    these situations, the AWT includes a simple multiline editor called TextArea.
    Following are the constructors for TextArea:


    +   - TextArea();

    - TextArea(int numLines, int numChars);

    - TextArea(String str);

    - TextArea(String str, int numLines, int numChars);

    - TextArea(String str, int numLines, int numChars, int sBars);


    Here, numLines specifies the height, in lines, of the text area, and numChars
    specifies its width, in characters. Initial text can be specified by str. In the
    fifth form we can specify the scroll bars that we control to have. sBars must
    be one of these values:


    +   - SCROLLBARS_BOTH

    - SCROLLBARS_NONE

    - SCROLLBARS_HORIZON_ONLY

    - SCROLLBARS_VERTICAL_ONLY


    TextArea is a subclass of TextComponent. Therefore, it supports the getText(),
    setText(), select( ), isEditable( ), and setEditable( ) methods described in the
    preceding section. TextArea adds the following methods:


    +   - void append(String str);

    - void insert(String str, int index);

    - void replaceRange(String str, int startIndex, int endIndex);


    The append( ) method appends the string specified by str to the end of the current
    text. The insert( ) method inserts the string passed as str at the specified index.
    In order to replace text, we call replaceRange( ). It replaces the characters
    from startIndex to endIndex–1, with the replacement text passed in str. Text areas
    are almost self-contained controls.'
