  md: "Whenever the container needs to be resized, the layout manager is consulted\
    \ via its minimumLayoutSize() and preferredLayoutSize() methods. Each component\
    \ that is being managed by a layout manager calls getPreferredSize() and getMinimumSize()\
    \ methods. These return the preferred and minimum size required to display each\
    \ component. Java has several predefined LayoutManager classes, several of which\
    \ are described next. We can use the layout manager that best fits our application.\n\
    \n# # FlowLayout\n\nFlowLayout is the default layout manager. Components are laid\
    \ out from the upper-left corner, left to right and top to bottom. When no more\
    \ components fit on a line, the next one appears on the next line. A small space\
    \ is left between each component, above and below, as well as left and right.\
    \ Here are the constructors for FlowLayout:\n\n+   * FlowLayout();\n* FlowLayout(int\
    \ how);\n* FlowLayout(int how, int horz, int vert);\n\nThe first form creates\
    \ the default layout, which centers components and leaves pixels of space between\
    \ each component. The second form lets us specify how each line is aligned. Valid\
    \ values for how are as follows:\n\n+   * FlowLayout.LEFT\n* FlowLayout.CENTER\n\
    * FlowLayout.RIGHT\n\nThese values specify left, center, and right alignment,\
    \ respectively. The third form allows us to specify the horizontal and vertical\
    \ space between components in horz and vert, respectively. Here is a version of\
    \ the CheckboxDemo applet earlier, modified that it uses left-aligned flow layout.\n\
    \n```\n// FlowLayoutDemo.java\nimport java.awt.*;\nimport java.awt.applet.*;\n\
    /*\n<applet code=\"FlowLayoutDemo\" width=400 height=200>\n</applet>\n*/\npublic\
    \ class FlowLayoutDemo extends Applet\n{\n  String msg = \"\"\n  Checkbox Win98,\
    \ winNT, solaris, mac;\n```"
