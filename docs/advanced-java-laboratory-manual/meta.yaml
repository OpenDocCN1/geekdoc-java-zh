- md: "\n# Advanced JAVA Laboratory Manual\n\n![](img/82c0971c9988652186bbdfa7c6f97adb_0_0.png)\n\
    \nGayatri Patel\n\n# Table of Contents\n\nAdvanced JAVA Laboratory Manual\n\n\
    * Unit 1\n    * Introduction\n    - Practical 1: Write an applet that draws a\
    \ circle. The dimension of the applet should be 500 x 300 pixels. The circle should\
    \ be centered in the applet and have a radius of 100 pixels. Display your name\
    \ centered in a circle. (USING DRAWOval() method)\n    - Practical 2: Draw ten\
    \ red circles in a vertical column in the center of the applet.\n    - Practical\
    \ 3: Built an applet that displays a horizontal rectangle in its center. Let the\
    \ rectangle fill with color from left to right.\n    - Practical 4: Write an applet\
    \ that displays the position of the mouse at the upper left corner of the applet\
    \ when it is dragged or moved. Draw a 10x10 pixel rectangle with black at the\
    \ current mouse position.\n    - Practical 5: Write an applet that contains one\
    \ button. Initialize the label on the button to “start”, when the user presses\
    \ the button change the label between these two values each time the button is\
    \ pressed.\n    - Practical 6: Write an applet that uses the mouse listener, which\
    \ overrides only two methods which are mousePressed and mouseReleased.\n* Unit\
    \ 2\n    * Introduction\n    - Practical 7: Write a program that has only one\
    \ button in the frame, clicking on the button cycles through the colors: red->green->blue->and\
    \ so on. One color change per click. (use getBackground() method to get the current\
    \ color)\n    - Practical 8: Write an applet that contains three checkboxes and\
    \ 30 x30 pixel canvases. The three checkboxes should be labeled “Red\", \"Green\"\
    , \"Blue\". The selection of the checkbox determines the color of the canvases.\
    \ For example, if the user selects both “Red” and “Blue\", the canvases can be\
    \ purple.\n    - Practical 9: Create an application that displays a frame with\
    \ a menubar. When a user selects any menu or menu item, display selection on a\
    \ text area in the center of the frame.\n    - Practical 10: Write an applet that\
    \ draws two sets of ever-decreasing rectangles one in outline form and one filled\
    \ alternately in black and white. Exercise:\n* Unit 3\n    * Introduction\n  \
    \  - Practical 11: Write a database application that uses any JDBC driver.\n \
    \   - Practical 12: Develop a UI that performs the following SQL operations: 1)\
    \ Insert 2) Delete 3) Update.\n    - Practical 13: Write a program to present\
    \ a set of choice for user to select a product & display the price of product.\
    \ Exercise:\n* Unit 4\n    * Introduction\n    - Practical 14: Write a simple\
    \ servlet program which maintains a counter for the number of times it has been\
    \ accessed since IT'S loading; initialize the counter using deployment descriptor.\n\
    \    - Practical 15: Create a form processing servlet which demonstrates use of\
    \ cookies.\n    - Practical 16: Create a form processing servlet which demonstrates\
    \ use of sessions.\n* Unit 5\n    * Introduction\n    - Practical 17: WRITE a\
    \ simple JSP program for user Registration & then control will be transfer it\
    \ into second page.\n    - Practical 18: Write a simple JSP program for user login\
    \ form with static & dynamic database.\n    - Practical 19: Write a JSP program\
    \ to display the grade of a student by accepting the marks of five subjects.\n\
    \n# ADVANCED JAVA LABORATORY MANUAL\n\nBy Gayatri Patel\n\n# Advanced JAVA Laboratory\
    \ Manual\n\n# Unit 1\n\n# Introduction\n\n* Practical 1: Write an applet that\
    \ draws a circle. The dimension of the applet should be 500 x 300 pixels. The\
    \ circle should be centered in the applet and have a radius of 100 pixels. Display\
    \ your name centered in a circle. (USING DRAWOval() method)\n* Practical 2: Draw\
    \ ten red circles in a vertical column in the center of the applet.\n* Practical\
    \ 3: Built an applet that displays a horizontal rectangle in its center. Let the\
    \ rectangle fill with color from left to right.\n* Practical 4: Write an applet\
    \ that displays the position of the mouse at the upper left corner of the applet\
    \ when it is dragged or moved. Draw a 10x10 rectangle filled with black at the\
    \ current mouse position.\n* Practical 5: Write an applet that contains one button.\
    \ Initialize the label on the button to “start”, when the user presses the button\
    \ change the label between two values each time the button is pressed.\n* Practical\
    \ 6: Write an applet that uses the mouse listener, which overrides two methods\
    \ which are mousePressed and mouseReleased.\n\n# Exercise:\n\n# Unit 2\n\n# Introduction\n\
    \n* Practical 7: Write a program that has only one button in the frame, clicking\
    \ on the button cycles through the colors: red->green->blue-->and so on. One color\
    \ change each click. (use getBackground() to get the current color)\n* Practical\
    \ 8: Write an applet that contains three check boxes and 30 x 30 pixel canvas.\
    \ The three check boxes should be labeled “Red,”Green,”Blue”. The selection of\
    \ the check boxes determines the color of the canvas. For example, if the user\
    \ selects “Red” and “Blue”, the canvas should be purple.\n* Practical 9: Create\
    \ an application that displays a frame with a menubar. When a user selects any\
    \ menu or menu item, display that selection on a text area in the center of the\
    \ frame.\n* Practical 10: Write an applet that draws two sets of ever-decreasing\
    \ rectangles one in outline form and one filled alternately in black and white.\n\
    \n# Unit 3\n\n# Introduction\n\n* Practical 11: Write a database application that\
    \ uses any JDBC driver.\n* Practical 12: Develop a UI that performs the following\
    \ SQL operations: 1) Insert 2) Delete 3) Update.\n* Practical 13: Write a program\
    \ to present a set of choice for user to select a product & display the price\
    \ of product.\n\n# Unit 4\n\n# Introduction\n\n* Practical 14: Write a simple\
    \ servlet program which maintains a counter for the number of times it has been\
    \ accessed since IT'S loading; initialize the counter using deployment descriptor.\n\
    * Practical 15: Create a form processing servlet which demonstrates use of cookies.\n\
    * Practical 16: Create a form processing servlet which demonstrates use of sessions.\n\
    \n# Unit 5\n\n# Introduction\n\n* Practical 17: WRITE a simple JSP program for\
    \ user Registration & then control will be transfer it into second page.\n* Practical\
    \ 18: Write a simple JSP program for user login form with static & dynamic database.\n\
    * Practical 19: Write a JSP program to display the grade of a student by accepting\
    \ the marks of five subjects.\n\n# UNIT 1\n\n# GENERAL OBJECTIVES\n\nAfter performing\
    \ this practical student will be able to:\n\n* Learn about Applet\n* Develop an\
    \ Applet in JAVA\n* Execute Applet using AppViewer\n* Execute Applet in Web Browser\n\
    * Learn how to use Graphics\n\n# LEARNING OUTCOMES\n\n* Explain & Practice Drawing\
    \ Applications.\n\n# ASSUMPTIONS\n\n* Oracle JDK installed\n* Editor Like notepad\
    \ available for development\n* Environment variables like JAVA_Home, Path, Classpath\
    \ are configured.\n\n# INTRODUCTION\n\n# What is an Applet?\n\nAccording to Sun\
    \ \"An applet is a small program that is intended to run on its\n\n# Four definitions\
    \ of applet:\n\n* A small application\n* A secure program that runs inside a web\
    \ browser\n* A subclass of java.applet.Applet\n* An instance of a subclass of\
    \ java.applet.Applet\n\n# The APPLET HTML Tag\n\nApplets are embedded in web pages\
    \ using the <APPLET> and </APPLET> tags. The <APPLET> tag is similar to the <IMG>\
    \ tag.\n\n* The CODE attribute of <APPLET> tag tells the browser where to look\
    \ for the .class file. It is relative to the location of the source document.\n\
    * The CODEBASE attribute is a URL that points at the directory where the .class\
    \ file is. For instance if on the HTML page of the previous section you had written\n\
    \n```\n<APPLET\nCODE=\"TestApplet.class\"\nCODEBASE=\"classes\"\nWIDTH=200 HEIGHT=200\n\
    </APPLET>\n```\n\nthen the browser would have tried to find TestApplet.class in\
    \ the classes directory in the same directory as the HTML page that included the\
    \ applet. On the other hand if you had written\n\n```\n<APPLET\nCODE=\"TestApplet.class\"\
    \nCODEBASE=\"http://www.foo.bar/classes\"\nWIDTH=200\nHEIGHT=200\n</APPLET>\n\
    ```\n\nthen the browser would try to retrieve the applet from http://www.foo.bar/classes/TestApplet.class\
    \ regardless of where the HTML page was.\n\nIn short the applet viewer will try\
    \ to retrieve the applet from the URL given by the formula (CODEBASE + \"/\" +\
    \ code). Once this URL is formed all the usual rules of relative and absolute\
    \ URLs apply.\n\nYou can leave off .class extension and just use the class name\
    \ in the CODE attribute. For example,\n\n```\n<APPLET CODE=\"TestApplet\"\nCODEBASE=\"\
    http://www.foo.bar/classes\"\nWIDTH=200\nHEIGHT=200\n</APPLET>\n```\n\n# Executing\
    \ Applet using Web Browser\n\nTestApplet.java\n"
  mdcn: "\n\n# 高级 JAVA 实验手册\n\n![](img/82c0971c9988652186bbdfa7c6f97adb_0_0.png)\n\
    \nGayatri Patel\n\n# 目录\n\n高级 JAVA 实验手册\n\n* 第 1 元\n    * 简介\n    - 实验 1：编写一个绘制圆的\
    \ applet。该 applet 的尺寸应为 500 x 300 像素。圆应在 applet 中居中，半径为 100 像素。在圆内居中显示你的名字。（使用\
    \ `drawOval()` 方法）\n    - 实验 2：在 applet 的中心垂直绘制一列十个红圆。\n    - 实验 3：构建一个 applet，在其中心显示一个水平矩形。让矩形从左到右填充颜色。\n\
    \    - 实验 4：编写一个 applet，当鼠标被拖动或移动时，在 applet 的左上角显示鼠标的位置。在当前鼠标位置画一个 10x10 像素的黑色矩形。\n\
    \    - 实验 5：编写一个包含一个按钮的 applet。初始化按钮标签为“start”，当用户按下按钮时，每次按下按钮时在这两个值之间切换标签。\n\
    \    - 实验 6：编写一个使用鼠标监听器（mouse listener）的 applet，仅重写 `mousePressed` 和 `mouseReleased`\
    \ 方法。\n* 第 2 元\n    * 简介\n    - 实验 7：编写一个框架（frame）中只有一个按钮的程序，点击按钮循环切换颜色：红->绿->蓝……以此此类推。每次切换一种颜色。（使用\
    \ `getBackground()` 方法获取当前颜色）\n    - 实验 8：编写一个包含三个复选框和 30x30 像素画布的 applet。三个复选框的标签应为“红”、“绿”、“蓝”。复选框的选择决定画布的颜色。例如，如果用户同时选择“红”和“蓝”，画布可以是紫色。\n\
    \    - 实验 9：创建一个显示带有菜单栏（menubar）框架的应用程序。当用户选择任何菜单或菜单项时，在框架中心的文本区域中显示该选择内容。\n \
    \   - 实验 10：编写一个 applet，绘制两组逐渐减小的矩形，一组为轮廓形式，另一组交替填充黑色和白色。练习：\n* 第 3 元\n    * 简介\n\
    \    - 实验 11：编写一个使用任何 JDBC 驱动数据库应用程序。\n    - 实验 12：开发一个执行以下 SQL 操作的 UI：1) 插入 2)\
    \ 删除 3) 更新。\n    - 实验 13：编写一个程序，为用户提供一组选择以选择产品并显示产品价格。练习：\n* 第 4 元\n    * 简介\n\
    \    - 实验 14：编写一个简单的 servlet 程序，维护自加载以来访问次数的计数器；使用部署描述符（deployment descriptor）初始化计数器。\n\
    \    - 实验 15：创建一个演示 cookie 使用的表单处理 servlet。\n    - 实验 16：创建一个演示 session 使用的表单处理\
    \ servlet。\n* 第 5 元\n    * 简介\n    - 实验 17：编写一个简单的用户注册 JSP 程序，然后将控制转移到第二个页面。\n\
    \    - 实验 18：编写一个带有静态和动态数据库的简单用户登录表单 JSP 程序。\n    - 实验 19：编写一个 JSP 程序通过接受五门学科的分数显示学生的成绩。\n\
    \n# 高级 JAVA 实验手册\n\n作者：Gayatri Patel\n\n# 第 1 元\n\n# 简介\n\n* 实验 1：编写一个绘制圆的 applet。该\
    \ applet 的尺寸应为 500 x 300 像素。圆应在 applet 中居中，半径为 100 像素。在圆内居中显示你的名字。（使用 `drawOval()`\
    \ 方法）\n* 实验 2：在 applet 的中心垂直绘制一列十个红圆。\n* 实验 3：构建一个 applet，在其中心显示一个水平矩形。让矩形从左到右填充颜色。\n\
    * 实验 4：编写一个 applet，当鼠标被拖动或移动时，在 applet 的左上角显示鼠标的位置。在当前鼠标位置画一个 10x10 像素的黑色矩形。\n\
    * 实验 5：编写一个包含一个按钮的 applet。初始化按钮标签为“start”，当用户按下按钮时，每次按下按钮时在这两个值之间切换标签。\n* 实验 6：编写一个使用鼠标监听器的\
    \ applet，仅重写 `mousePressed` 和 `mouseReleased` 方法。\n\n# 练习：\n\n# 第 2 元\n\n# 简介\
    \ \n\n* 实验 7：编写一个框架中只有一个按钮的程序，点击按钮循环切换颜色：红->绿->蓝……以此此类推。每次切换一种颜色。（使用 `getBackground()`\
    \ 获取当前颜色）\n* 实验 8：编写一个包含三个复选框和 30x30 像素画布的 applet。三个复选框的标签应为“红”、“绿”、“蓝”。复选框的选择决定画布的颜色。例如，如果用户选择“红”和“蓝”，画布应该是紫色。\n\
    * 实验 9：创建一个显示带有菜单栏框架的应用程序。当用户选择任何菜单或菜单项时，在框架中心的文本区域中显示该选择内容。\n* 实验 10：编写一个 applet，绘制两组逐渐减小的矩形，一组为轮廓形式，另一组交替填充黑色和白色。\n\
    \n# 第 3 元\n\n# 简介 \n\n* 实验 11：编写一个使用任何 JDBC 驱动数据库应用程序。\n* 实验 12：开发一个执行以下 SQL 操作的\
    \ UI：1) 插入 2) 删除 3) 更新。\n* 实验 13：编写一个程序，为用户提供一组选择以选择产品并显示产品价格。\n\n# 第 4 元\n\n\
    # 简介 \n\n* 实验 14：编写一个简单的 servlet 程序，维护自加载以来访问次数的计数器；使用部署描述符初始化计数器。\n* 实验 15：创建一个演示\
    \ cookie 使用的表单处理 servlet。\n* 实验 16：创建一个演示 session 使用的表单处理 servlet。\n\n# 第 5 元\n\
    \n# 简介 \n\n* 实验 17：编写一个简单的用户注册 JSP 程序，然后将控制转移到第二个页面。\n* 实验 18：编写一个带有静态和动态数据库的简单用户登录表单\
    \ JSP 程序。\n* 实验 19：编写一个 JSP 程序通过接受五门学科的分数显示学生的成绩。\n\n# 第一单元\n\n# 目标\n\n在完成本单元后，学生将能够：\n\
    * 学习 applet\n* 在 Java 中开发 applet\n* 使用 Applet 运行 applet\n* 在 浏览器中运行 applet\n*\
    \ 学习使用 Graphics\n\n# 学习成果\n\n* 理解图形应用程序。\n\n# 假设\n\n* 已安装 Oracle JDK\n* 有可用的编辑器进行开发\n\
    * 环境变量如 JAVA_Home, Path, Classpath 已配置\n\n# 简介\n\n# 什么是 applet？\n\n根据 Sun 的定义，“applet\
    \ 是一种旨在运行的小型程序”。\n\n# Applet 的四种定义：\n\n* 一种小型应用程序\n* 在 浏览器内部运行的安全程序\n* `java.applet.Applet`\
    \ 的子类\n* `java.applet.Applet` 的实例\n\n# APPLET HTML 标签\n\nApplet 使用 `<APPLET>`\
    \ 和 `</APPLET>` 标签嵌入到网页中。`<APPLET>` 标签类似于 `<img>` 标签。\n\n* `<APPLET>` 标签的 `CODE`\
    \ 属性告诉浏览器去哪里查找 .class 文件。它相对于源文档的位置。\n* `CODEBASE` 属性是一个指向 .class 文件所在目录的 URL。例如，如果在上一节的\
    \ HTML 页面中编写：\n\n```html\n<APPLET CODE=\"TestApplet.class\"\nCODEBASE=\"classes\"\
    \nWIDTH=200 HEIGHT=200\n</APPLET>\n```\n\n那么浏览器将尝试在与包含该 applet 的 HTML 页面相同的目录下\
    \ classes 目录中查找 TestApplet.class。相反，如果你写了：\n\n```html\n<APPLET CODE=\"TestApplet.class\"\
    \nCODEBASE=\"http://www.foo.bar/classes\"\nWIDTH=200\nHEIGHT=200\n</APPLET>\n\
    ```\n\n那么无论 HTML 页面在哪里，浏览器都会尝试从 http://www.foo.bar/classes 获取 TestApplet.class。\n\
    \n总之，applet 查看将根据公式 `(CODEBASE + \"/\" + code)` 给出的 URL 获取 applet。一旦形成该 URL，所有的相对路径和绝对\
    \ URL 规则均适用。\n\n你可以在 `CODE` 属性中省略 .class 扩展，直接使用类名。例如：\n\n```html\n<APPLET CODE=\"\
    TestApplet\"\nCODEBASE=\"http://www.foo.bar/classes\"\nWIDTH=200\nHEIGHT=200\n\
    </APPLET>\n```\n\n# 使用 浏览器运行 applet\n\nTestApplet.java\n\n"
