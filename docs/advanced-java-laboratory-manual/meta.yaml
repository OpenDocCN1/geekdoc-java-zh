    | Color Obtained | Red Value | Green Value | Blue Value |

    |---|---|---|--|

    | White | 255 | 255 | 255 |

    | Black | 0 | 0 | 0 |

    | Light Gray | 192 | 192 | 192 |

    | Dark Gray | 128 | 128 | 128 |

    | Red | 255 | 0 | 0 |

    | Green | 0 | 255 | 0 |

    | Blue | 0 | 0 | 255 |

    | Yellow | 255 | 255 | 0 |

    | Purple | 255 | 0 | 255 |


    Table of RGB values of common colors


    You create new colors using the same RGB triples that you use to set background
    colors on web pages. However you use decimal numbers instead of the hex values
    used by the bgcolor tag. For example medium gray is Color(127, 127, 127). Pure
    white is Color(255, 255, 255). Pure red is Color(255, 0, 0) and so on. With any
    variable you should give your colors descriptive names. For instance


    ```

    Color medGray = new Color(127, 127, 127);

    ```'
