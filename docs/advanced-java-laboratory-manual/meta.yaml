  md: '# Lists


    The List class provides a compact, multiple-choice, scrolling selection list.
    The List object can be constructed to show any number of choices in the visible
    Window. It can also be created to allow multiple selections. List provides these
    constructors:


    ```

    List();

    List(int numRows);

    List(int numRows, boolean multipleSelect);

    ```


    The first version creates a List control that allows only one item to be selected
    at any one time. In the second form, the value of numRows specifies the number
    of entries in the list that will always be visible (others can be scrolled into
    view). In the third form, if multipleSelect is true, the user may select two or
    more items at a time. If it is false, then only one item may be selected. For
    adding a selection to the list, we can call add(). It has the following two forms:


    ```

    void add(String name);

    void add(String name, int index);

    ```


    Here, name is the name of the item added to the list. The first form adds items
    to the end of the list. The second form adds the item at the index specified by
    index.


    For lists that allow multiple selection, we must use getSelectedItems() or getSelectedIndices(),
    shown here, to determine the current selections:


    ```

    String[] getSelectedItems();

    int[] getSelectedIndices();

    ```


    The getSelectedItems() returns an array containing the names of the currently
    selected items. getSelectedIndices() returns an array containing the indexes of
    the currently selected items. In order to obtain the number of items in the list,
    call getItemCount(). We can set the currently selected item using the select()
    method with a zero-based integer index. These methods are shown here:


    ```

    int getItemCount();

    void select(int index);

    ```'
