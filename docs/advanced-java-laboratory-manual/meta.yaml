    \ width, int height ) | To draw a rectangle at specific location |\n| fillRect\
    \ ( int x, int y, int width, int height ) | To fill color in rectangle |\n| drawArc\
    \ ( int x, int y, int width, int height, int arcwidth, int archect ) | To draw\
    \ an Arc |\n| fillArc ( int x, int y, int width, int height, int arcwidth, int\
    \ archect ) | To fill color in Arc. |\n| setFont ( Font f ) | To set the font\
    \ f |\n\n## Drawing Lines\n\nDrawing straight lines with Java is easy. Just call\n\
    \n- g.drawLine(x1, y1, x2, y2)\nwhere (x1, y1) and (x2, y2) are the endpoints\
    \ of your lines and g is the Graphics\nyou're drawing with.\n\nThis program draws\
    \ a line diagonally across the applet.\n\n```java\nimport java.applet.*;\nimport\
    \ java.awt.*;\n\npublic class SimpleLine extends Applet {\n\n  public void paint(Graphics\
    \ g) {\n    g.drawLine(0, 0, this.getSize().width, this.getSize().height);\n \
    \ }\n}\n```\n"
