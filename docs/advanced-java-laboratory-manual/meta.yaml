  mdcn: "\n\n# 布局管理器 (Layout Managers)\n\n我们目前为止展示的所有组件都是由默认布局管理器进行定位的。布局管理器通过使用某种算法在窗口内自动排列我们的控件。\n\
    \n每个容器（Container）都关联着一个布局管理器。布局管理器是实现了 `LayoutManager` 接口的类的实例。布局管理器通过 `setLayout()`\
    \ 方法进行设置。如果没有调用 `setLayout()`，则使用默认布局管理器。每当容器大小发生变化时（或第一次调整大小时），系统都会使用布局管理器对其中的每个组件进行定位。\n\
    \n![](img/82c0971c9988652186bbdfa7c6f97adb_67_0.png)\n\n图 布局管理器的工作原理\n\n`setLayout()`\
    \ 方法具有以下通用形式：\n`void setLayout(LayoutManager layoutObj);`\n\n在这里，`layoutObj` 是指向所需布局管理器的引用。如果我们想禁用布局管理器并手动定位组件，请为\
    \ `layoutObj` 传递 `null`。如果我们需要手动确定每个组件的形状和位置，可以使用 `Component` 定义 `setBounds()`\
    \ 方法。\n\n每个布局管理器都维护一个按名称存储的组件列表。每当我们向容器添加组件时，布局管理器都会收到通知。\n\n每当容器需要调整大小时，系统会通过其\
    \ `minimumLayoutSize()` 和 `preferredLayoutSize()` 方法咨询布局管理器。每个被布局管理器管理的组件都会调用\
    \ `getPreferredSize()` 和 `getMinimumSize()` 方法。这些方法返回显示每个组件所需的理想尺寸和最小尺寸。Java 有几个预定义的\
    \ `LayoutManager` 类，其中几个将在下文中介绍。我们可以使用最适合我们应用程序的布局管理器。\n\n## 布局布局 (FlowLayout)\n\
    \n`FlowLayout` 是默认的布局管理器。组件从左上角开始，从左到右、从上到排列。当一行无法容纳更多组件时，下一个组件将出现在下一行。每个组件的上方、下方以及左右之间都会留出小小的空间。以下是\
    \ `FlowLayout` 的构造函数：\n\n- FlowLayout();\n- FlowLayout(int how);\n- FlowLayout(int\
    \ how, int horz, int vert);\n\n第一种形式创建默认布局，它将组件居中并在组件之间留出像素空间。第二种形式允许我们指定每行的对齐方式。`how`\
    \ 的有效值如下：\n\n- FlowLayout.LEFT\n- FlowLayout.CENTER\n- FlowLayout.RIGHT\n\n这些值分别指定左对齐、居中和右对齐。第三种形式允许我们分别通过\
    \ `horz` 和 `vert` 指定组件之间的水平空间和垂直空间。以下是之前的 `CheckboxDemo` Applet 的修改版本，它使用了左对齐的流式布局。\n\
    \n```java\n// FlowLayoutDemo.java\nimport java.awt.*;\nimport java.awt.applet.*;\n\
    /*\n<applet code=\"FlowLayoutDemo\" width=400 height=200>\n</applet>\n*/\npublic\
    \ class FlowLayoutDemo extends Applet\n{\n  String msg = \"\";\n  Checkbox Win98,\
    \ winNT, solaris, mac;\n\n  public void init()\n  {\n  Win98 = new Checkbox(\"\
    Windows 98/XP\", null, true);\n  winNT = new Checkbox(\"Windows NT/2000\");\n\
    \  solaris = new Checkbox(\"Solaris\");\n  mac = new Checkbox(\"MacOS\");\n  setLayout(new\
    \ FlowLayout(FlowLayout.CENTER));\n  add(Win98); add(winNT); add(solaris); add(mac);\n\
    \  }\n\n  public void paint(Graphics g)\n  {\n  }\n}\n```\n\n输出：\n\n## 边界布局 (BorderLayout)\n\
    \n`BorderLayout` 类为顶层窗口实现了一种常用的布局样式。它在边缘有四个窄的固定宽度组件，在中心有一个大区域。四边分别被称为北（north）、南（south）、东（east）和西（west）。中间区域被称为中心（center）。以下是\
    \ `BorderLayout` 定义的构造函数：\n\n- BorderLayout();\n- BorderLayout(int horz, int vert);\n\
    \n第一种形式创建默认的边界布局。第二种形式允许我们分别通过 `horz` 和 `vert` 指定组件之间的水平空间和垂直空间。`BorderLayout`\
    \ 定义了以下常量来指定区域：\n\n- BorderLayout.CENTER\n- BorderLayout.SOUTH\n- BorderLayout.EAST\n\
    - BorderLayout.WEST\n- BorderLayout.NORTH\n\n在添加组件时，我们将使用这些常量配合以下 `add()` 方法的形式，该方法由\
    \ `Container` 定义：\n\n```java\nvoid add(Component compObj, Object region);\n```\n\
    \n在这里，`compObj` 是要添加的组件，`region` 指定组件添加的位置。以下是一个每个布局区域都包含组件的 `BorderLayout` 示例：\n\
    \n```java\n// BorderLayoutDemo.java\nimport java.awt.*; import java.applet.*;\n\
    /*\n<applet code=\"BorderLayoutDemo\" width=400 height=200>\n</applet>\n*/\npublic\
    \ class BorderLayoutDemo extends Applet\n{\n    public void init() {\n       \
    \ setLayout(new BorderLayout(\"This is across the top.\"), BorderLayout.NORTH);\n\
    \        add(new Button(\"The footer message might go here.\"), BorderLayout.SOUTH);\n\
    \        add(new Button(\"Right\"), BorderLayout.EAST);\n        add(new Button(\"\
    Left\"), BorderLayout.WEST);\n        String msg = \"The reasonable man adapts\
    \ \" + \"himself to the world:\\n\" + \n\"the unreasonable one persists in \\\
    n\" + \"trying to adapt the world to himself.\\n\" + \n\"Therefore all progress\
    \ depends \" + \n\"on the unreasonable man.\\n\\n\" + \n\" - George Bernard Shaw\"\
    ;\n        add(new TextArea(msg));\n    }\n}\n```\n\n## 实验 7：编写一个只有一个按钮的程序，点击按钮循环切换颜色：红->绿->蓝（使用\
    \ GETBACKGROUND() 方法获取当前颜色）\n\n### 具体目标\n\n在完成本次实验后，学生将能够：\n\n- 使用 `Button` 控件用\
    \ Java 开发 AWT 程序。\n- 学习如何使用 `ActionListener` 接口处理按钮事件。\n\n### 学习成果\n\n- 解释并练习按钮事件。\n\
    \n### 假设条件\n\n- 已安装 Oracle JDK\n- 可用于开发的编辑器，如记事本或 Jcreator\n- 环境变量 `JAVA_Home`、`Path`、`Classpath`\
    \ 已配置好。\n\n### 代码\n\n```java\nimport java.awt.*;\nimport java.applet.*;\nimport\
    \ java.awt.event.*;\nimport java.lang.String;\n\nclass ChangeColor extends Applet\
    \ implements ActionListener {\n    Button b1;\n    public void init() {\n    \
    \    b1=new Button(\"Change Color\");\n        add(b1);\n        b1.addActionListener(this);\n\
    \    }\n    public void actionPerformed(ActionEvent e) {\n        if(e.getSource()==b1)\
    \ {\n            String s;\n            s=b1.getBackground();\n            if(s==\"\
    Change Color\") {\n                this.setBackground(Color.RED);\n          \
    \      b1.setLabel(\"Green\");\n            }\n            if(s==\"Green\") {\n\
    \                this.setBackground(Color.GREEN);\n                b1.setLabel(\"\
    Blue\");\n            }\n            if(s==\"Blue\") {\n                this.setBackground(Color.BLUE);\n\
    \                b1.setLabel(\"Change Color\");\n            }\n        }\n  \
    \  }\n}\n```\n\n```java\npublic class ColorPickerDemo extends Frame {\n    public\
    \ static void main(String [] args) {\n        Frame f = new Frame(\"Color Demo\"\
    );\n        ChangeColor c = new ChangeColor();\n        c.init();\n        f.add(c);\n\
    \        f.pack();\n        f.show();\n    }\n}\n```\n\n## 实验 8：编写一个包含三个复选框和 30x30\
    \ 像素画布的 Applet。三个复选框标记为“红”、“绿”、“蓝”。复选框的选择决定画布的颜色。例如，如果用户同时选择了“红”和“蓝”，画布应该是紫色。\n\
    \n### 具体目标\n\n在完成本次实验后，学生将能够：\n\n- 使用 `Checkbox` 和 `Canvas` 控件用 Java 开发 AWT 程序。\n\
    - 学习如何使用 `ItemListener` 接口处理复选框事件。\n\n### 学习成果\n\n- 解释并练习复选框事件。\n\n### 假设条件\n\n\
    - 已安装 Oracle JDK\n- 可用于编辑器，如记事本或 Jcreator\n- 环境变量 `JAVA_Home`、`Path`、`Classpath`\
    \ 已配置好。\n\n### 代码\n\n```java\nimport java.awt.*;\nimport java.applet.*;\nimport\
    \ java.awt.event.*;\nimport java.lang.String;\n\npublic class CanvasColorDemo\
    \ extends Applet implements ItemListener\n{\n    Checkbox ch1,ch2,ch3;\n    Canvas\
    \ c=new Canvas();\n    public void init()\n    {\n        setLayout(new GridLayout(1,4));\n\
    \n        ch1=new Checkbox(\"RED\",false);\n        ch2=new Checkbox(\"GREEN\"\
    ,false);\n        ch3=new Checkbox(\"BLUE\",false);\n        add(ch1);\n     \
    \   add(ch2);\n        add(ch3);\n        add(c);\n        ch1.addItemListener(this);\n\
    \        ch2.addItemListener(this);\n        ch3.addItemListener(this);\n    }\n\
    \    public void itemState(ItemEvent e) {\n        int r = 0, g = 0, b = 0;\n\
    \        if(ch1.getState()) r = 1;\n        if(ch2.getState()) g = 1;\n      \
    \  if(ch3.getState()) b = 1;\n\n        if(r && g && b) c.setBackground(Color.MAGENTA);\n\
    \        else if(r && g) c.setBackground(Color.YELLOW);\n        else if(r &&\
