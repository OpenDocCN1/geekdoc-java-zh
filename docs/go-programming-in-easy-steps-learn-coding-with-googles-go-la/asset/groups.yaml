    将程序保存在“logic”目录中，然后运行程序以查看逻辑评估的结果\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_68_0.png)\n\
    \n比较 false && false 返回 false 而不是 true – 证明了“错错没错并不等于对”的格言。\n"
