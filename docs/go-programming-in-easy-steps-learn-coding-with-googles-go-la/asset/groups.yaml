- md: "\n# Split Strings\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_209_0.png)\n\n\
    The Go standard library strings package provides several functions that allow\
    \ a specified string to be separated into substrings. These functions treat the\
    \ string like an array in which each element contains a character or a space.\n\
    \nFrequently, you may want to separate a space-separated sentence into an array\
    \ of substrings that are each individual words. The strings package conveniently\
    \ provides a Fields() function that will perform this task. This function requires\
    \ the string sentence as its sole argument, and will return an array of substrings\
    \ containing each individual word from that.\n\nThe strings package has a Split()\
    \ function that requires two arguments to specify a string and a separator. This\
    \ function will return an array of substrings that exist between occurrences of\
    \ the specified separator. For example, when the string is a space-separated sentence\
    \ and the separator is a space character, the Split() function will return an\
    \ array of words within that sentence.\n\nThe strings package also has a SplitN()\
    \ function that works just like the Split() but accepts a third argument to specify\
    \ how many substrings to return. Subsequent occurrences of the specified separator\
    \ will simply be returned in the final substring if the specified number of substrings\
    \ exceeds the number of separators. For example, when the string is a space-separated\
    \ sentence, the separator is a space character, and only two substrings are specified,\
    \ the SplitN() function will return a substring containing the first word in the\
    \ sentence and a substring containing the entire remainder of that sentence including\
    \ spaces.\n\nIt is important to recognize that the Fields(), the Split(), and\
    \ the SplitN() functions discard the specified separator and only include the\
    \ characters around the separator in the returned substrings. There, however,\
    \ two further functions that allow you to also include the separators in the returned\
    \ substrings.\n\nThe strings package's SplitAfter() function works like the Split()\
    \ function, but includes the separator in the returned substrings. Similarly,\
    \ the strings package's SplitAfterN() function works like the SplitN() function,\
    \ but includes the separator in the returned substrings.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_210_0.png)\n\
    \nData is often stored as Comma-Separated Values in CSV files, which can be usefully\
    \ split into individual values.\n\n- Begin importing the Go standard library strings\
    \ package\n```go\nimport \"fmt\"\n\"strings\"\n```\n```src\\split\\main.go\n```\n\
    \n- Start the main function by initializing a string variable\nstr := \"I can,\
    \ and, I will.\",\n\n- Next, add statements to parse a description and substrings\
    \ of the variable string to a listing function\nlist(\"Fields\", strings.Fields(str\
    \ ))\n\n```go\nlist(\"Split\", strings.Split(str, \" \"))\nlist(\"SplitN\", strings.SplitN(str,\
    \ \" \", 2))\n```\n\n```go\nlist(\"SplitAfter\", strings.SplitAfter(str, \" \"\
    ))\nlist(\"SplitAfterN\", strings.SplitAfterN(str, \" \", 2))\n```\n\n- After\
    \ the main function, add the function to list the description and all substrings\
    \ upon each call\n```go\nfunc list(desc string, subs []string) {\n    fmt.Print(\"\
    \\n\", desc, \": \")\n    for _, v := range subs {\n        fmt.Printf(\"[%v]\"\
    , v)\n    }\n}\n```\n\nSave the program file in a \"split\" directory, then run\
    \ the program to see the substrings\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_211_0.png)\n\
    \nOnly split methods that contain the word “After” in their name will retain the\
    \ separators.\n\n# Find Characters\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_212_0.png)\n\
    \nThe Go standard library strings package provides several functions that allow\
    \ a specified string to be searched to find a specified character or substring\
    \ (pattern). These functions treat the string as an array in which each element\
    \ contains a character or a space.\n\nThe strings package has a Contains() function\
    \ that requires two arguments to specify a string and a pattern to find. This\
    \ function will simply return true or false to indicate the result of a (case-sensitive)\
    \ search. For example, to search for a “Pro” pattern:\n\n```go\nstrings.Contains(\"\
    Go Programming in easy steps\", \"Pro\")\n```\n\nThe strings package has an Index()\
    \ function that requires two arguments to specify a string and a pattern to find.\
    \ This function will return an integer that is the index position of the first\
    \ instance of the pattern in the searched string if the search succeeds, otherwise\
    \ it will return -1 when the search fails.\n\nThe strings package’s Count() function\
    \ requires two arguments to specify a string and a pattern to find. You can use\
    \ this function to discover how many non-overlapping instances of a pattern occur\
    \ in a searched string. If the pattern is an empty string, this function will\
    \ normally return 1 plus the number of characters in the searched string. This\
    \ allows you to determine the number of characters in the searched string by deducting\
    \ 1 from the returned integer.\n\nThe strings package’s HasPrefix() function requires\
    \ two arguments to specify a string and a pattern to find. This function will\
    \ return true or false to indicate whether the searched string begins with the\
    \ specified pattern.\n\nSimilarly, the strings package’s HasSuffix() function\
    \ requires two arguments to specify a string and a pattern to find, and will return\
    \ true or false to indicate whether the searched string ends with the specified\
    \ pattern.\n\nYou can modify a searched string by replacing a pattern with a replacement\
    \ using strings' Replace() function. This requires four arguments to specify the\
    \ string, the pattern to find, the replacement substring, and an integer denoting\
    \ the number of instances to replace. If you want to replace all instances of\
    \ the pattern, simply specify -1 as the number.\n\nThe strings.Index() function\
    \ stops when it finds the first instance of the pattern in the searched string.\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_213_0.png)\n\n- Begin importing the\
    \ Go standard library strings package into a program\n```go\nimport (\n  \"fmt\"\
