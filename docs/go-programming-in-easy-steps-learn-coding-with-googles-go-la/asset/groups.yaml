    \ `true` 情况下继续。\n-   `for` 关键字可以完全省略测试表达式以创建无限循环。\n-   可以在无限循环体体内测试条件，并使用 `break`\
    \ 关键字结束循环。\n-   `break` 关键字用于终止循环，而 `continue` 关键字可用于跳过单次迭代。\n-   循环可以是嵌套的，使得内层循环在外层循环的每次迭代中执行一系列迭代。\n\
    -   通常不建议使用 `goto` 关键字，但它可以合法地用于退出嵌套循环。\n\n# 5\n\n# 产生函数\n\n本章演示了如何将语句封装在函数内部，以便每当\
    \ Go 程序调用该函数时都能执行它们。\n\n-   创建基础函数\n-   添加参数\n-   传递引用\n-   返回值\n-   递归调用\n- \
    \  匿名封装\n-   传递函数\n-   处理错误\n-   分离文件\n-   总结\n\n# 创建基础函数\n\n本书中的之前的示例使用了强制性的\
    \ `main()` 函数以及 Go 标准库中包含的函数，例如 “fmt” 包中的 `fmt.Println()` 函数。然而，大多数 Go 程序包含许多自定义函数，可以在程序执行期间根据需要进行调用。\n\
    \n函数块仅包含一组语句，每当该函数被调用时就会被执行。一旦函数语句执行完毕，程序流将从函数调用后的直接点继续恢复。这种模块化在 Go 编程中非常有用，可以隔离一组根据需要重复调用的代码序列。\n\
    \n要在 Go 程序中添加自定义函数，必须使用 `func` 关键字进行声明，后紧跟一个你选择的名称——遵循与变量名相同的命名规范。\n\n| 命名规则 |\
    \ 示例 |\n| --- | --- |\n| 不能是 Go 关键字 | default |\n| 不能包含算术运算符 | a+b*c |\n| 不能包含标点符号字符\
    \ | %$@! |\n| 不能包含任何空格 | no spaces |\n| 必须以字母开头 | msg |\n| 可以在其他地方包含数字 | good1\
    \ |\n| 可以包含混合大小写 | camelCase |\n\n在选择函数名时，它应该描述函数的用途，但要保持简洁。函数名后紧跟 `()` 括号和一个\
    \ `{` 左大括号，都在同一行上。这一行通常被称为“签名”。要执行的语句包含在函数体内，函数体以 `}` 右大括号结束。可以通过指定其名称来调用函数。\n\
    \n函数名应以小字母开头，除非该函数已导出——参见此处\n\n-   1. 创建一个函数，每次被调用时只需打印一条消息\n```go\nfunc first()\
    \ {\n    msg := \"Hello from function!\"\n    fmt.Println(msg)\n}\n```\n\n-  \
    \ 2. 创建另一个函数，每次被调用时只需打印乘法结果\n```go\nfunc sqFive() {\n    fmt.Println(\"5 = 25\"\
    )\n}\n```\n\n-   3. 接下来，添加一个 main 函数，开头是一个调用该函数的语句\n```go\nfunc main() {\n   \
    \ first()\n    sqFive()\n}\n```\n\n将程序文件保存到 \"funcs\" 目录，然后运行程序查看输出\n\n```bash\n\
    Go Terminal\nC:\\Users\\mike_\\go\\src>go run funcs\nHello from function!\n5 =\
