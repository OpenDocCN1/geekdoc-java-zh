    \ then run the program to see the values stored within array elements\n\nYou can\
    \ replace the variable name i with a blank identifier if you don't need the index\
    \ number in the loop – see here.\n\n# Slice Arrays\n\nArrays are sequences whose\
    \ elements contain data of the same type, but are of a fixed length so are not\
    \ versatile. Frankly, Go provides a slice type that represents an underlying array\
    \ and whose length can be changed.\n\nTo understand the slice type it is important\
    \ to recognize that a slice does not contain any elements, but is merely a reference\
    \ to an actual array. The slice type contains only three components:\n\n-   Ptr\
    \ (pointer) a pointer to the first element in the array accessible by the slice\
    \ (not necessarily the first array element).\n-   Len (length) the total number\
    \ of elements in the slice.\n-   Cap (capacity) the number of elements between\
    \ the pointer and the last element.\n\nFor example, a slice of weekdays from an\
    \ array of names:\n\n| | Ptr = 0 | Len = 5 | Cap = 7 |\n|---|---|---|---|\n| Length\
    \ | | | |\n| Array | Mon Tue Wed Thu Fri Sat Sun | | | |\n\nA slice can be created\
    \ in Go programming by assigning an array to a variable that specifies index numbers\
    \ of a desired lower and upper boundary. These are specified around a : character\
    \ between [] brackets. The number to the left of the colon specifies the index\
    \ number of the starting element – which the slice will reference. The number\
    \ to the right of the colon specifies the index number of the upper boundary –\
    \ to slice all elements up to, but not including, the upper boundary. An assignment\
    \ for the example above would look like this:\n\n```go\nweekdays := days[0 : 5]\n\
    ```\n\nOptionally, you can omit either of the numbers that specify the upper and\
    \ lower boundaries to use the default values. The default value for the lower\
    \ boundary is 0 (zero) and the default value for the upper boundary is the total\
    \ number of elements in the array.\n\nSlices are important in Go programming and\
    \ are seen much more frequently than the array type, but it's important to understand\
    \ that they are references to underlying arrays.\n\nYou can reveal the length\
    \ of a slice using the built-in len() function, as arrays, but you can also check\
    \ the capacity of a slice using a built-in cap() function. Comparing the pointer\
    \ value of a slice with the memory address of the array element it points to confirms\
    \ that the slice is indeed a pointer reference.\n\n-   First, create an array\
    \ of seven elements\n```go\ndays := [ 7 ]string{\"Mon\",\"Tue\",\"Wed\",\"Thu\"\
    ,\"Fri\",\"Sat\",\"Sun\"}\n```\n\n```\nsrc\\slice\\main.go\n```\n\n-   Create\
    \ a slice that represents the final two array elements\n```go\nweekend := days[5\
    \ : ]\n```\n\n-   Now, add statements to display the slice contents and type\n\
    ```go\nfmt.Printf(\"Slice weekend: %v\\n\", weekend)\nfmt.Printf(\"Type weekend:\
    \ %T \\n\", weekend)\n```\n\n-   4 Add statements to display the slice length\
    \ and capacity\n```go\nfmt.Printf(\"Length weekend: %v\\n\", len(weekend))\nfmt.Printf(\"\
    Capacity weekend: %v\\n\", cap(weekend))\n```\n\n-   5 Finally, add statements\
    \ to confirm that the slice is a reference pointing to an underlying array element\n\
    ```go\nfmt.Printf(\"Pointer weekend: %p\\n\", weekend)\nfmt.Printf(\"Address days[0]:\
    \ %p\\n\", &days[5])\n```\n\n-   6 Save the program file in a \"slice\" directory,\
    \ then run the program to see the features of a slice\n\nSee that the type of\
    \ a slice is described by empty [] square brackets followed by the type each element\
    \ may contain.\n\n# Make Slices\n\nA slice [] can be created in the same way as\
    \ an array, except without specifying any number of elements between [] square\
    \ brackets, and can be initialized with a \"slice literal\", using this syntax:\n\
    \n```go\nsliceName := []dataType { value, value, value }\n```\n\nYou can also\
    \ create an empty slice using a built-in make() function, whose arguments specify\
    \ the slice type, slice length, and (optionally) the slice capacity. Values can\
    \ be assigned to individual elements, like this:\n\n```go\nfruitSlice := make([\
    \ string, 3 )\nfruitSlice[0 ] = \"Apple\"\nfruitSlice[1 ] = \"Banana\"\nfruitSlice[2\
    \ ] = \"Cherry\"\n```\n\nIn this case, Go will internally create an underlying\
    \ array of the appropriate length and capacity. You can add elements to a slice\
    \ using a built-in append() function. This requires at least two arguments that\
    \ specify the name of the slice and one or more element value. The function returns\
    \ a new slice containing one or more additional elements, like this:\n\n```go\n\
    fruitSlice = append(fruitSlice, \"Damson\")\n```\n\nMost importantly, when the\
    \ length of the enlarged slice exceeds the capacity of the underlying array, Go\
    \ will automatically increase the capacity of the underlying array to accommodate\
    \ the elements.\n\nThere is also a built-in copy() function that allows you to\
    \ copy one slice into another. This requires two arguments that specify the name\
    \ of the slice to copy into, and the name of the slice to copy from. It is useful\
    \ to create an empty slice of the same length as the source slice, then copy content\
    \ into it.\n"
