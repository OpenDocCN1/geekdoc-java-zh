  - '[PAGE 279]


    # Summary


    +   * Parallelism when two tasks are performed simultaneously.

    * Concurrency is the separation of program code into separate tasks that could
    potentially be performed simultaneously.

    * Goroutines provide the ability for lines of code to be executed concurrently.

    * A goroutine is created by inserting the go keyword before an ordinary function
    call or method call.

    * The Go standard library sync package provides a WaitGroup type that can wait
    for multiple goroutines to finish.

    * A WaitGroup has an Add() incrementing method, a Done() decrementing method,
    and a Wait() blocking method.

    * When passing a WaitGroup as an argument to a function, it must be passed as
    a pointer.

    * A Go channel is like a pipe through which the program can send and receive messages.

    * A channel is created by specifying the chan keyword and a data type as arguments
    to the built-in make() function.

    * Deadlock is a fatal error when the program cannot proceed.

    * The built-in close() function can explicitly close a channel.

    * Adding a buffer size argument to the make() function enables multiple items
    to be sent as a queue to a channel.

    * A select statement block can be used to simultaneously listen for messages from
    multiple channels.

    * Enclosing a select statement block within an infinite for loop allows a program
    to continuously listen for channel messages.

    * Channels connect goroutines in a pipeline that sends and receives messages to
    synchronize the goroutines.'
