    \n# 商标\n\n所有商标均归其相应所有。\n\n# 目录\n\n# 1 入门\n\n- 认识 Go 语言\n- 安装 Go 工具\n- 创建 Go 工作空间\n\
    - 编写 Go 程序\n- 运行 Go 程序\n- 格式化和注释代码\n- 探索 VS Code 编辑器\n- 总结\n\n# 2 存储值\n\n- 创建程序变量\n\
    - 显示变量值\n- 转换数据类型\n- 固定常量值\n- 指向存储的值\n- 总结\n\n# 3 执行操作\n\n- 算术运算\n- 赋值值\n- 进行比较\n\
    - 评估逻辑\n- 位操作\n- 理解优先级\n- 总结\n\n# 4 控制流\n\n- 测试条件\n- switch 分支\n- 多次循环\n- 当为真时循环\n\
    - 跳出循环\n- 跳转到标签\n- 总结\n\n# 5 生成函数\n\n- 创建基础函数\n- 添加参数\n- 传递引用\n- 返回值\n- 递归调用\n\
    - 匿名闭包\n- 错误\n- 总结\n\n# 6 结构\n\n- 分组数据\n- 附加方法\n- 嵌入结构体\n- 封装功能\n- 组合元素\n- 满足接口\n\
    - 总结\n\n# 7 创建数组\n\n- 创建基础数组\n- 遍历元素\n- 切片\n- 切片\n- 与数组对比\n- 映射值\n- 总结\n\n# 8\
    \ 处理时间\n\n- 获取时间\n- 设置时间\n- 格式化时间\n- 识别时间\n- 总结\n\n# 9 管理数据\n\n- 统一字符串\n- 分割字符串\n\
    - 获取字符\n- 转换字符串\n- 计算\n- 总结\n\n# 10 处理输入\n\n- 获取用户输入\n- 缓冲区\n- 命令行\n- 读取文件\n-\
    \ 使用文件\n- 总结\n\n# 11 运用并发\n\n- 获取协程\n- 等待\n- 创建通道\n- 使用通道\n- 同步协程\n- 使用线程池\n-\
    \ 总结\n\n# 12 响应\n\n- 监听请求\n- 处理请求\n- 服务\n- 静态页面\n- 动态响应\n- 总结\n\n# 13 如何使用本书\n\
    \n为了方便，书中所有的示例源代码都以 ZIP 压缩包提供。你可以通过以下简易步骤获取此包：\n\n1. 访问 www.ineasteps.com 并导航到\
    \ Free Resources\n2. 接下来在 easy steps 中找到 Go Programming，然后点击 Downloads\n3. 现在将包解压到电脑的\
    \ GOPATH 目录\n\n> 如果你没有实现图中所示的结果，只需将你的代码与示例进行对比，找出错误所在。\n\n# 获取源代码\n\n为了方便，书中所有的的示例源代码都以\
    \ ZIP 压缩包提供。你可以通过以下简易步骤获取此包：\n\n1. 访问 www.ineasteps.com 并导航到 Free Resources\n\
    2. 接下来在 easy steps 中找到 Go Programming，然后点击 Downloads\n3. 现在将包解压到电脑的 GOPATH 目录\n\
    \n# 1 入门\n\n欢迎来到 Go 语言编程的世界。本章将介绍该语言并创建一个运行第一个程序的工作空间。\n\n- 认识 Go 语言\n- 安装 Go\
    \ 工具\n- 创建 Go 工作空间\n- 编写 Go 程序\n- 运行 程序 程序\n- 格式化和注释代码\n- 探索 VS Code 编辑器\n- 总结\n\
    \n# 认识 Go 语言\n\nGo 是一种免费开源编程语言，由 Robert Griesemer、Rob Pike 和 Ken Thompson 创建（他们以开发\
    \ Unix 操作系统而闻名）。Google 在 2012 年 3 月发布了 Go 语言的 1.0 版本，从那时以后获得了广泛关注。\n\nGo 程序以纯文本形式编写，然后通过\
    \ Go 编译器编译成机器码，生成可执行文件。\n\n```go\npackage main\n\nimport \"fmt\"\n\nfunc main()\
    \ {\n\t// 我的第一个程序\n\tfmt.Println(\"Hello World!\")\n}\n```\n\n在设置 Go 的过程中，你将在名为\
    \ GOPATH 的位置中创建目录，如下侧示例代码所示：\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_7_0.png)\n\
    \nsrc/main.go\n\nGo 编程语言的目标是具有良好的表达力、快速、高效、可靠且易于编写。某些编程语言（如 C 或 C++）快速且可靠但不简单。相反，其他编程语言（如\
    \ Java 或 Python）易于编写但效率不高。\n\nGo 在很多方面与 C 相似，但它远不止于此，因为它吸收了许多其他编程语言的优点，同时避免了导致复杂或不可靠的特性。\n\
    \n最重要的是，Go 引入了利用“协程 (goroutines)”和“通道 (channels)”利用多核 CPU 处理进行并发的能力。这为计算机同时处理几件事提供了可能。\n\
    \n尽管 Go 语言没有像面向对象编程（OOP）语言那样的类结构，但它的功能提供了某种程度的封装、继承和多态——\n\n"
