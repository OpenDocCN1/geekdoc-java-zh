    \ `fileServer := http.FileServer( dir )`\n\n- 现在，注册所有 HTTP 请求的处理程序\n`http.Handle(\"\
    /\", fileServer )`\n\n- 保存更新后的程序文件，然后启动 Web 服务器并访问 `localhost:8000/index.html`（或直接访问\
    \ `localhost:8000`）来查看静态索引网页。\n\n你需要将根文件目录的路径修改为它在你自己系统上的位置。\n\n## 记录接收到的数据\n\n\
    成功交付静态表单索引网页后，程序现在可以提供一个提交数据的表单页面。\n\n`http.Request` 对象有一个 `ParseForm()` 方法，它可以填充\
    \ `http.Request.Form` 以包含提交的表单输入值。然后，可以通过指定表单输入名称作为 `http.Request.FormValue()`\
