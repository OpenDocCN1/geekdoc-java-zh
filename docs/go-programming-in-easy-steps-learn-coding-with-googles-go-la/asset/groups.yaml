    - `%s` for strings

    - `%d` for integers

    - `%f` for floating-point numbers

    - `%c` for characters

    - `%t` for booleans

    - `%p` for memory addresses

    - `%v` for the default format

    - `%T` for the type information


    You can also specify the width and padding of the output. For example, `%7d` will
