    \n# 遍历元素\n\n循环和数组是完美的搭档。可以使用循环来为空数组中的每个元素填充值，并可以遍历数组中的每个元素以引用所存储的值。\n\n传统的递增 `for`\
    \ 循环可以将初始计数器变量的值设置为零，并将该变量放在数组变量的 [] 方括号内，以随着循环的进行表示每个元素的索引号。\n\nGo 有一个内置的 `len()`\
    \ 函数，它接受数组变量作为参数，并返回一个表示数组包含元素数量的整数。这可以用于传统的 `for` 循环，在达到数组的最后一个元素时退出循环。\n\n-\
    \   创建一个包含五个元素的空整数数组\n\n```\nvar arr [ 5]int\n```\n\n-   接下来，添加语句来确认数组大小\n```go\n\
    fmt.Println(\"No. of Elements:\", len(arr ))\n```\n\n-   现在，添加一个循环来填充每个元素\n```go\n\
    for i := 0; i <len(arr); i++ {\n  arr[i] = i*i\n}\n```\n\n然后，添加一个循环来引用每个数组元素的值\n\
    ```go\nfor i := 0; i < len(arr); i++ {\n  fmt.Printf(\"Index: %v Value: %v\\n\"\
    , arr[i])\n}\n```\n\n将程序文件保存在\"elems\"目录中，然后运行程序以查看存储在数组元素中的值\n\n```\nGo Terminal\n\
