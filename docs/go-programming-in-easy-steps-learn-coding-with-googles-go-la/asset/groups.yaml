    \nGo 编程中常用的逻辑运算符列下表所示：\n\n| 运算符 | 操作 |\n| --- | --- |\n| && | 逻辑与 |\n| || | 逻辑或\
    \ |\n| ! | 逻辑非 |\n\n&& 逻辑与运算符比较两个操作数，如果两个值都为 true，则返回 true；否则，&& 运算符将返回 false。这用于满足条件的条件分支。\n\
    \n与 && 逻辑与运算符需要两个操作数都为 true 不同，|| 逻辑或运算符只要一个操作数为 true 就会返回 true。然而，如果两个操作数都不 true，||\
    \ 逻辑或运算符将返回 false。\n\n! 逻辑非运算符是一个一元运算符，用于单个操作数。它返回给定操作数的反，所以如果变量值为 true，!a 的值就是\
