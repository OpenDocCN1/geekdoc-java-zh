  - '[PAGE 224]


    # Round Decimals


    The Go standard library math package provides a number of useful functions for
    rounding a decimal value to a near integer. These functions are listed in the
    table below, together with a brief description of each one:


    | Function | Returns |

    |---|---|

    | math.Floor( x ) | The greatest integer less than x |

    | math.Ceil( x ) | The least integer greater than x |

    | math.Round( x ) | The nearest integer to x |

    | math.Trunc( x ) | The integer part of x |


    If you want to reduce a long floating-point value to just two decimal places,
    first multiply the floating-point value by 100, then use math.Round() to remove
    any remaining decimal places, then divide by 100 to return two decimal places.


    Procedures that multiply, operate, then divide can be written as individual steps,
    or in parentheses can be used to determine the order in a single succinct expression.
    For example, commuting a long floating point value in a variable named “num” can
    be written as:


    ```

    num = num * 100

    num = math.Round(num )

    num = num / 100

    ```


    or alternatively as:


    ```

    num = math.Round( num * 100 ) / 100

    ```


    The Go programming language has a strong type system that unlike other'
- md: '

    programming languages, does not support type conversion (a.k.a. "casting") implicitly.
    You can, however, perform explicit type conversion between compatible data types,
    such as float64 and int types using the syntax dataType( value ) to convert a
    value to another data type. In converting a floating-point value to an integer,
    the value is truncated, losing the decimal places.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_225_0.png)


    The math.Round( ) function will round up from the mid-point, so math.Round( 7.5
    ) returns 8, not 7.


    - 1. Begin by importing the Go standard library math package into a program

    import (

    "fmt"

    "math"

    )


    ![](img/fa565c410b0509c58bcab29ed0b49de9_225_1.png)


    src/round/main.go


    - 2. Initialize a floating-point variable and display its value

    var pi float64 = math.Pi

    fmt.Println("Pi:", pi)


    - 3. Next, display nearest integers to the floating-point value

    fmt.Println("Floor:", math.Floor(pi))

    fmt.Println("Ceiling:", math.Ceil(pi))

    fmt.Println("Round:", math.Round(pi))

    fmt.Println("Truncated:", math.Trunc(pi))


    - 4. Now, reduce the floating-point value to two places

    fmt.Println("InShort Pi:", math.Round(pi * 100) / 100)


    - 5. Finally, initialize another floating-point variable and cast its value to
    an integer variable

    var e1 float64 = math.E

    fmt.Printf("In: %v %T \n", e1, e1)

    var e2 int = int(e1)

    fmt.Printf("Cast: %v %T \n", e2, e2)


    - 6. Save the program file in a "round" directory, then run the program to see
    the rounded decimals


