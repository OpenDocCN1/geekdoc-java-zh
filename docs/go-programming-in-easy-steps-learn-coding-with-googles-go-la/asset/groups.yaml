    \ 8000\")\n  http.ListenAndServe(\":8000\", nil)\n}\n```\n\n- Save the program\
    \ file in a \"server\" directory, then run the program to start the web server\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_283_0.png)\n\nLocal system addresses\
    \ are referenced via the loopback network interface using the hostname localhost.\
    \ This normally resolves to the IP address 127.0.0.1.\n\n```\nGo Terminal - go\
    \ run server\nC:\\Users\\mike\\>go run server\nStarting web server on port 8000\n\
    ```\n\n- If a firewall security warning appears, confirm that you wish to allow\
