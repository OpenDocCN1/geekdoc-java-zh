    \ the steps:\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_7_0.png)\n\nsrc/hello/main.go\n\
    \n# Grab the Source Code\n\nFor convenience, the source code files from all examples\
    \ featured in this book are available in a single ZIP archive. You can obtain\
    \ this archive by following these easy steps:\n\n1. Browse to www.ineasteps.com\
    \ then navigate to Free Resources and choose the Downloads section\n2. Next, find\
    \ GO Programming in easy steps in the list, then click on the hyperlink entitled\
    \ All Code to download the ZIP archive\n3. Now, extract the archive contents to\
    \ the GOPATH/src-directory on your computer\n\n> If you don't achieve the result\
    \ illustrated in any example, simply compare your code to that in the example\
    \ files you have downloaded to discover where you went wrong.\n\n# 1 Get Started\n\
    \nWelcome to the exciting world of programming with Go. This chapter introduces\
    \ the language and creates a workspace where you can run your first program.\n\
    \n- Meet the Go Language\n- Install the Go Tools\n- Create the Go Workspace\n\
    - Write a Go Program\n- Run a Go Program\n- Format and Comment Code\n- Explore\
    \ the VS Code Editor\n- Summary\n\n# Meet the Go Language\n\nGo is a free open-source\
    \ programming language created at Google by Robert Griesemer, Rob Pike, and Ken\
    \ Thompson – best known for development of the Unix operating system. Google released\
    \ version 1.0 of the Go language (“golang”) in March 2012, since when it has gained\
    \ widespread popularity.\n\nGo programs are written in plain text, then compiled\
    \ into machine code by the Go compiler to produce an executable binary version.\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_10_0.png)\n\nThe aims of the Go programming\
    \ language are to be expressive, fast, efficient, reliable, and simple to write.\
    \ Some programming languages, such as C or C++, are fast and reliable but not\
    \ simple. Conversely, other programming languages such as Java or Python are simple\
    \ to write but not efficient.\n\nGo is similar to the C programming in many ways,\
    \ and is sometimes referred to as a “C-like language” or “C for the 21st century”.\
    \ But Go is much more than that, as it adopts good ideas from many other programming\
    \ languages, yet avoids features that lead to complexity or unreliability.\n\n\
    Perhaps most importantly, Go introduces the ability to take advantage of multi-core\
    \ CPU processing for concurrency using “goroutines” and “channels”. This provides\
    \ the potential for the computer to deal with several things at the same time.\n\
    \nAlthough the Go language does not have the class structures found in Object\
    \ Oriented Programming (OOP) languages, such as C++ or Java, its features provide\
    \ some degree of encapsulation, inheritance, and polymorphism – the\n"
  mdcn: "\n\n# Mike McGrath\nGo 编程\n\n探索 Google 的 Go 语言 (golang)\n\n# 简易步骤教程\n\n通俗易懂的语言\n\
    易于跟随\n全图解说\n\n全彩色版\n\nGO\n通过 Google 的 Go 语言学习编程\n- 循序渐式的示例程序\n- 易于遵循的风格\n- 彩色标记的步骤\n\
    - 存储值\n- 执行操作\n- 管理数据\n- 运行协程 (routines)\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_0_0.png)\n\
    \n# Go 语言基础\n\n* 下方的表格包含了 Go 编程语言的所有 25 个关键字以及用于创建 Go 程序中组件的声明语法。\n* 关键字具有特殊含义，因此**不可**用于\
    \ Go 程序代码中的条目命名。\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_1_0.png)\n\n| 关键字\
    \ | | | | | |\n|---|---|---|---|---|\n| break | default | func | interface | select\
    \ |\n| case | defer | go | map | struct |\n| chan | else | goto | package | switch\
    \ |\n| const | fallthrough | if | range | type |\n| continue | | import | return\
    \ | var |\n\n| 组件语法 |\n|---|---|\n| 变量 (推断) | `var variableName dataType = value`\
    \ <br> `variableName := value` |\n| 常量 | `const constantName = value` |\n| 数组\
    \ | `var arrayName []dataType` |\n| 切片 | `sliceName := make([]dataType, nElements)`\
    \ |\n| 映射 | `mapName := make(map dataType, value dataType)` |\n| 通道 | `channelName\
    \ := make(chan dataType)` |\n| 结构体 | `type struct struct { \\n field dataType\
    \ }` |\n| 函数 | `func functionName(paramName dataType) return dataType { \\n return\
    \ returnValue }` |\n| 接口 | `type interfaceName interface { \\n methodName return\
    \ dataType }` |\n\nMike McGrath\n\n# GO 编程\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_2_0.png)\n\
