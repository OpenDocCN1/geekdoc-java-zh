    \nGo 标准库中的 `net` 包包含一个 `http` 包，它提供了可以方便创建 Web 服务器的实用程序。通过导入 `net/http` 包，可以在程序程序这些实用程序。\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_282_0.png)\n\n`http.ListenAndServe()`\
    \ 函数允许程序启动并运行一个 Web 服务器。它需要两个参数来指定一个 TCP 网络地址字符串和一个请求处理器。地址字符串指定了 Web 服务器应该监听传入请求的端口号。端口号在字符串中必须以\
    \ `:` 冒号前缀——例如，使用“8000”来监听本地端口 8000 的传入请求。通常通过将第二个参数指定为 `nil` 来使用默认处理器。\n\n`http.ListenAndServe()`\
    \ 函数始终返回一个非空错误，并永久阻塞。这意味着调用此函数之后的代码行将永远不会执行。Web 服务器将继续监听传入的请求直到程序终止。\n\n- 首先在程序中导入\
    \ Go 标准库的 `net/http` 包\n```go\nimport (\n  \"fmt\"\n  \"net/http\"\n)\n```\n\n\
    ```\nsrc\\server\\main.go\n```\n\n- 接下来，添加一个 `main` 函数，它将输出启动消息并启动一个监听系统本地端口 8000\
    \ 的 Web 服务器\n```go\nfunc main() {\n  // 在此处插入语句。\n  fmt.Println(\"Starting web\
    \ server on port 8000\")\n  http.ListenAndServe(\":8000\", nil)\n}\n```\n\n- 将程序文件保存在\
    \ \"server\" 目录中，然后运行程序启动 Web 服务器\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_283_0.png)\n\
    \n本地系统地址通过回环网络接口并使用主机名 `localhost` 进行引用。这通常解析为 IP 地址 127.0.0.1。\n\n```\nGo Terminal\
    \ - go run server\nC:\\Users\\mike\\>go run server\nStarting web server on port\
    \ 8000\n```\n\n- 如果出现防火墙安全警告，请确认你希望允许 Web 服务器访问\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_284_0.png)\n\
    \n- 5 现在，启动 浏览器并访问 `localhost:8000`，查看 Web 服务器回复的默认消息\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_284_1.png)\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_284_2.png)\n\n你可以按 `Ctrl + C` 终止运行中的程序。\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_284_3.png)\n\nWeb 服务器尚不知道如何响应，但本章将开发该程序以实现响应。\n\
    \n## 处理请求\n\n为了让 Go Web 服务器处理传入的请求，程序需要注册“路由处理器”，以指定如何响应特定请求。\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_285_0.png)\n\
    \n`net/http` 包提供了一个 `http.HandleFunc()` 函数，它可以注册路由处理器。该函数需要两个参数：一个描述要监听路径的字符串模式，以及一个将被调用提供带有\
