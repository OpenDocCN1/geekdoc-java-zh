    ![](img/fa565c410b0509c58bcab29ed0b49de9_65_0.png)\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_65_1.png)\n\
    \n注意这里是如何在一个语句中初始化多个变量的。\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_62_0.png)\n\
