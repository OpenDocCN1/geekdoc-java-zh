    # Slices Versus Arrays


    An array contains a sequence of values, whereas a slice contains a reference to
    a sequence of values. This is an important distinction in Go programming that
    applies to many of its types. Most significantly, when passing a type to a function,
    those types that are value-based will receive a copy of the original, whereas
    those that are references will point to the actual original. in order for the
    function to operate on an original value, you therefore need to use pointers when
    passing value-based types to a function, but no pointers are needed when passing
    references.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_175_0.png)


    | Values | References |

    | --- | --- |

    | int | slice |

    | float64 | map |

    | string | channel |

    | bool | pointer |

    | struct | function |

    | array | method |


    Use pointers to change original values from within a function.


    No need to change original values from within a function.


    Another distinction between arrays and slices concerns "variadic" functions that
    can be called with any number of arguments. You cannot pass array element values
    to a variadic function unless you first "convert" the array to a slice by copying
    the array element values into slices.


    You can create a variadic function simply by prefixing the final parameter''s
    data type with the - wildcard operator in the function signature, using this syntax:


    ```

    tunc funcName ( paramName...dataType )

    ```


    Variadic functions can be called in the usual way, enclosing a comma-separated
    list of arguments within () parentheses.'
