    # Understand Precedence


    Operator precedence defines the order in which the Go compiler evaluates expressions.
    In the expression 6 + 7 * 3 the order of precedence determines whether the addition
    or the multiplication is completed first.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_73_0.png)


    The table below lists operator precedence in decreasing order, where operators
    on higher rows have precedence over those on lower rows, their operations get
    completed first. Binary operators on the same row have equal precedence but the
    order of completion is determined by their left-to-right order, so that operations
    on the left get completed first.


    | Precedence Level | Operator |

    |---|---|

    | 5 | * / % >> & |

    | 4 | + - ^ |

    | 3 | == != < <= >= |

    | 2 | && |

    | 1 | || |


    The ++ increment operator and -- decrement operator form statements in Go programming,
    rather than appear in expressions, so they are not included in the precedence
    level above.


    You can force the compiler to ignore the default precedence levels by enclosing
    parts of an expression with parentheses, to force the compiler to evaluate innermost
    parts of the expression first. For example, in the expression 6 + 7 * 3 the *
    multiplication operator has, by default, a higher level of precedence than the
    + addition operator, so the multiplication operation is performed first as 7 *
    3 = 21 then the addition 21 + 6 = 27. You may prefer to'
