  mdcn: "\n\nform.html\n\n服务器将测试 POST 方法；查找值（lookup value）将识别表单处理函数；Language（语言）值将识别提交的值。\n\
    \n## 交付静态页面\n\nGo 标准库 `net/http` 包提供了三个函数，允许 Web 服务器通过指定的文件系统内容轻松地响应所有 HTTP 请求。\n\
    \n首先，将根文件目录的路径作为 `http.Dir()` 函数的参数指定。它返回一个 `Dir` 类型，然后该类型被作为 `http.FileServer()`\
