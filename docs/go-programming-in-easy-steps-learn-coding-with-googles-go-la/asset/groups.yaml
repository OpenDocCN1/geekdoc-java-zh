  - "[PAGE 270]\n\n# Select Channels\n\nWhen multiple goroutines send messages to\
    \ channels at different times, the program may block progress while waiting to\
    \ receive messages from the slower channels. Go provides a solution to this blocking\
    \ action by simultaneously listening for messages from multiple channels in a\
    \ select statement block. This has similar syntax to the switch statement described\
    \ here, but a select statement blocks until one of its case statements finds a\
    \ match. When a match is found, the statements associated with that case statement\
    \ get executed. This ability to combine goroutines and channels is a powerful\
    \ feature of the Go programming language.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_270_0.png)\n\
    \nTo continuously listen for channel messages, a select statement can be enclosed\
    \ inside an infinite for loop. The loop can be exited by including a case statement\
    \ with an associated statement that will break out of the loop to an outer label.\n\
    \nThe Go standard library time package provides a useful After() function that\
    \ can be used to create a \"timeout\" to limit execution time of the listening\
    \ loop. This requires a duration period as its argument, and returns a channel\
    \ of the time.Time type – that will be the future time after the duration beyond\
    \ the current time. Testing for when the current times match the timeout channel\
    \ with a case statement can be used to exit a listening loop.\n\n+   Begin by\
    \ importing the Go standard library time package, to wait for goroutines and to\
    \ create a timeout\n\n```\nimport (\n  \"fmt\"\n  \"time\"\n)\n```"
