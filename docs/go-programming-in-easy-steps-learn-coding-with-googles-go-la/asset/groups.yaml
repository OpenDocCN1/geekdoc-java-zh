    # Attach Methods


    ![](img/fa565c410b0509c58bcab29ed0b49de9_138_0.png)


    In Go programming, functions can be attached to structs by adding a “receiver”
    to the function signature, which specifies a parameter name and the struct name
    as its type:


    ```

    func (paramName structName) funcName()

    ```


    A function that is attached to a struct is referred to as a “method” of that struct.
    The method can be specified as a value receiver, which operates on a copy of the
    struct, or as a pointer receiver that operates on the original struct fields:


    ```

    func (paramName *structName) funcName()

    ```


    This ability enables structs to represent real-world objects that have attributes
    and behaviors:


    +   - Attributes describe the features that an object has.

    - Behaviors describe actions that an object can perform.


    For example, a car might be described with attributes of “blue” and “coupe”, along
    with an “accelerate” behavior.


    These features could be represented in Go programming with a car struct containing
    field properties of color and body, along with an attached accelerate() method.'
