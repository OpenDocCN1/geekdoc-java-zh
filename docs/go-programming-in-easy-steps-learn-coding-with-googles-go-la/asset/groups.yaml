    A custom layout can specify the components in any order to suit different locales
    – for example, for appropriate date formatting.


    The time package also includes a predefined Kitchen constant that you can use
    as a time layout format. This will display the time in a 12-hour format and append
    "AM" or "PM" as appropriate.


    Additionally, the time components can be formatted to be displayed in a 24-hour
    format that will automatically prefix single-digit hours with a zero by specifying
    "15:04".


    Both 12-hour format and 24-hour format will automatically prefix single-digit
    minutes with a zero.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_191_0.png)


    ANSIC refers to the American National Standards Institute standard date/time format
    for the C programming language. RFC 3339 refers to the Request For Comment date/time
    document of the Internet Engineering Taskforce (IETF).


