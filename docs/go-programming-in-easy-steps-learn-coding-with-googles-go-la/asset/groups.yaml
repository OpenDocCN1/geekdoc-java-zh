    \nsrc\\main.go\n\n- Next, at the start of the main function, insert a statement\
    \ to register a route handler\n```go\nhttp.HandleFunc(\"/hello\", helloHandler)\n\
    ```\n\n- Now, after the main function, add the handler function that will write\
    \ two strings as response\n```go\nfunc helloHandler(w http.ResponseWriter, r *http.Request)\
    \ {\n  io.WriteString(w, \"Response from the helloHandler!\\n\")\n  io.WriteString(w,\
    \ \"URL.Path = \" + r.URL.Path)\n}\n```\n\n- Save the updated file in the \"server\"\
    \ directory, then run the program to start the web server\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_286_1.png)\n\
