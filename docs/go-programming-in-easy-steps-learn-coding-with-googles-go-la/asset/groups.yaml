    \nThe web server does not yet know how to respond, but this chapter will develop\
    \ the program to enable responses.\n\n## Handle a Request\n\nIn order for a Go\
    \ web server to handle incoming requests, the program needs to register “route\
    \ handlers” that specify how to respond to particular requests.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_285_0.png)\n\
    \nThe net/http package provides an http.HandleFunc() function that will register\
    \ a route handler. This function requires two arguments to specify a string pattern\
    \ describing the path to listen for, and the name of the function that will be\
    \ called to provide a response with a / forward slash character – for example,\
    \ “hello”. This specifies that the web server should listen for incoming requests\
    \ in our example from localhost:8000/hello.\n\nA request handler function will,\
    \ by default, always has parameters for an http.ResponseWriter object, to write\
    \ a response to the request, and a pointer to an http.Request object containing\
    \ information about the request – for example, its URL.Path contains the string\
    \ specified to the http.HandleFunc() function. Typically, the http.ResponseWriter\
    \ object is simply given the name w, and the http.Request object pointer is given\
    \ the name r.\n\nThe http.ResponseWriter object has a Write() method that accepts\
    \ a byte slice argument of characters to be sent in a response. The characters\
    \ can be converted into a string, like:\n\n```go\nw.Write( []byte(\"response string\"\
    ) )\n```\n\nIt is, however, more convenient to pass a string to the http.ResponseWriter\
    \ object using a WriteString() function contained in the Go standard library io\
