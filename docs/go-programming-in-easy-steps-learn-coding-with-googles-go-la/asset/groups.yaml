    # # Summary


    +   - The Go standard library net/http package provides utilities to create a
    web server.

    - The http.ListenAndServe() function specifies an address at which to listen,
    and the name of a request handler.

    - A web server program must register route handlers that specify how to respond
    to particular requests.

    - The http.HandleFunc() function specifies a route to listen for, and the name
    of a function that will handle that request.

    - A request handler function signature always has parameters for an http.ResponseWriter
    and an http.Request object.

    - An http.ResponseWriter object has a Write() method that can accept a []byte
    slice to send in a response.

    - The io package provides a WriteString() function that can pass a string to an
    http.ResponseWriter object for a response.

    - Files can be added to a web server program to be delivered to the browser in
    response to its requests.

    - The http.Dir() function nominates a root file system path.

    - The http.FileServer() function returns a handler for the contents of the file
    system specified as its argument.

    - The http.Handle() function specifies a route and the name of a handler for requests
    made to the nominated file system.

    - The http.Request.ParseForm() method populates an http.Request.Form object with
    submitted data.

    - The http.Request.Method object contains the value assigned to the HTML form’s
    method attribute.

    - The http.Error() function can use an http.ResponseWriter object to send an error
    message and status to the browser.'
