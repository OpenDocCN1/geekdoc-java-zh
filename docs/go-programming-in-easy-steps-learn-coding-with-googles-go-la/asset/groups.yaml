    \ `default` 语句，用于指定在任何 `case` 语句中未找到匹配项时要执行的代码。因此，`switch` 语句的语法通常如下：\n\n```\n\
    switch test-value {\n  case match-value :\n    statements-to-execute-when-matched\n\
