    ## 创建程序变量


    ![](img/fa565c410b0509c58bcab29ed0b49de9_36_0.png)


    变量是 Go 程序中的一种容器，可以在计算机内存中其中存储一个数据值。存储的值可以使用变量名进行引用，并通过分配新值来更改。程序员可以为变量选择任何名称，只要它符合下面列出的命名规则即可：


    | 命名规则 | 示例 |

    | :--- | :--- |

    | **不能**是 Go 关键字 | default |

    | **不能**包含算术运算符 | a+b*c |

    | **不能**包含标点符号 | %$#! |

    | **不能**包含任何空格 | no spaces |

    | **必须**以字母开头 | msg |

    | **可以**包含数字 | good1 |

    | **可以**包含混合大小写 | camelCase |


    变量名应该是简洁的，并且始终以小写字母开头 —— 除非变量需要被其他包访问（稍后会详细介绍）。为变量选择有意义的名称是一个良好的习惯，可以使程序更容易理解。在程序中创建变量只需要使用
    `var` 关键字对其进行“声明”。变量声明的语法如下：


    ```

    var variableNameDataType

    ```


    `var` 关键字后面跟着一个空格，然后是选定的变量名，然后是该变量允许存储的数据类型。通常，这将是相反页描述的五种数据类型之一。可以在单次声明中以逗号分隔列表的形式创建多个相同数据类型的变量，如下：


    ```

    var variableName1, variableName2, variableName3 dataType

    ```


    ![](img/fa565c410b0509c58bcab29ed0b49de9_37_0.png)


    Go 关键字列在本书内封的表格中。


    ![](img/fa565c410b0509c58bcab29ed0b49de9_37_1.png)


    变量名对大小写敏感。Go 中的基本数据类型列在下表中：


    | 数据类型 | 描述 | 示例 |

    | :--- | :--- | :--- |

    | string | 字符串 | "Hello!" |

    | int | 整数 | 100 |

    | float64 | 浮点数 | 123.456 |

    | byte | 单字节 | ''A'' |

    | bool | 布尔值 | true |

    | p | 内存地址 | 0x22FF34 |

    | v | 默认格式的值 | (以上任意一种) |

    | T | 数据类型 | int |


    变量声明的语法如下：

    ```

    var variableNameDataType

    ```


    `var` 关键字后面跟着一个空格，然后是选定的变量名，然后是该变量允许存储的数据类型。通常，这将是相反页描述的五种数据类型之一。可以在单次声明中以逗号分隔列表的形式创建多个相同数据类型的变量，如下：


    ```

    var variableName1, variableName2, variableName3 dataType

    ```


    变量也可以同时声明并初始化而不指定类型。在这种情况下，你使用 `:=` 操作符从值推断类型：


    ```

    msg := "Hello!"

    ```


    更改变量的值使用赋值运算符 `=`：


    ```

    msg = "New value"

    ```


    常量是设置后无法的值。使用 `const` 关键字声明它们：


    ```

    const Pi = 3.14159

    ```


    使用 `fmt` 包来显示变量的值。`Println()` 和 `Printf()` 函数是常用的：


    ```

    fmt.Println(msg)

    fmt.Printf("Value: %d\n", num)

    ```


    `Printf()` 函数使用动词（verbs）来格式化输出。常用的动词包括：


    - `%s` 字符串

    - `%d` 整数

    - `%f` 浮点数

    - `%c` 字符

    - `%t` 布尔值

    - `%p` 内存地址

    - `%v` 默认格式

    - `%T` 类型


    你还可以指定输出的宽度和填充。例如，`%7d` 将整数格式化为占据七个位置，并在必要时填充空格。


    ## 显示变量值


