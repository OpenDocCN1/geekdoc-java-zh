    # Summary


    +   - A variable stores data that can be referenced via the variable’s given name,
    and its value can be changed.


    +   - An explicit variable declaration uses the var keyword and states the type
    of data that variable can contain.


    +   - An implicit variable declaration can be made inside a function body using
    the := operator to infer the type.


    +   - Go is a statically typed language in which a variable can ever contain data
    of the type specified in its declaration.


    +   - The fmt.Printf() function can use format specifiers, variable names and
    newline sequences to format output.


    +   - The strconv.Atoi() function returns the int data type equivalent of a string
    value within its parentheses, and a second value that will be nil or an error
    message.


    +   - The strconv.Itoa() function returns the string data type equivalent of an
    int value specified within its parentheses.


    +   - The strconv.ParseFloat() function returns the float64 data type equivalent
    of a string value specified within its parentheses, and a second value that will
    be nil or an error message.


    +   - When a variable of the byte data type is assigned a character, it stores
    the ASCII character code number of that character.


    +   - Casting between numeric data types states the required type followed by
    parentheses containing the value to be converted.


    +   - A constant declaration uses the const keyword, and must be initialized with
    the fixed value it will contain.


    +   - A pointer variable can store the memory address of another variable, and
    can access the value stored at that address.


    +   - The asterisk operator prefixes the data type in a pointer variable declaration
    to indicate that variable will be a pointer.'
