    # Make Comparisons


    ![](img/fa565c410b0509c58bcab29ed0b49de9_63_0.png)


    The operators that are commonly used in Go programming to compare two numerical
    values are listed in the table below:


    | Operator | Comparative Test |

    | --- | --- |

    | == | Equality |

    | != | Inequality |

    | > | Greater than |

    | < | Less than |

    | >= | Greater than or equal to |

    | <= | Less than or equal to |


    The == equality operator compares two operands and will return true if both are
    equal in value, otherwise the == operator will return false. If both are the same
    number they are equal, or if both are characters their ASCII code values are compared
    numerically.


    Conversely, the != inequality returns true if two operands are not equal, using
    the same rules as the == equality operator, otherwise it returns false. Equality
    and inequality operators are useful in testing the state of two variables to perform
    conditional branching in a program.


    The > “greater than” operator compares two operands and will return true if the
    first is greater in value than the second, or it will return false if it is equal
    or in value. The < “less than” operator makes the same comparison but returns
    true if the first operand is in value than the second, otherwise it returns false.
    Typically, a > “greater than” or “less than” operator is used to test the value
    of an iteration counter in a loop structure.'
