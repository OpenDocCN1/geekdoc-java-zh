    \n你可以在《In Easy Steps》系列中发现更多编程语言书籍——包括 C、C++、C#、Java 和 Python。访问 www.ineassteps.com\
    \ 了解更多信息。\n\n有这么多编程语言供你选择，你可能会疑惑为什么应该选择学习 Go 语言——以下是 Go 提供的的一些优势：\n\n## 简单语法\n\
    \nGo 语言像 Python 一样简洁。它写起来像 Python 一样简单，但像 C++ 一样高效。这让你能够编写易于阅读和维护的代码。\n\n## 编译型语言\n\
    \nGo 源代码被编译为二进制机器码，计算机可以直接读取，而不是在每次程序运行时都进行解释。这使得你编写的 Go 程序运行速度比比 Python 或 PHP\
    \ 等解释型语言编写的程序更快。\n\n## Go 编译器\n\nGo 编译器非常快，并提供了额外的益处，例如代码优化和错误检查——它可以检测代码中未使用的变量、代码所需的缺失导入以及拼写错误或无效代码。Go\
    \ 编译器还可以为其他操作系统生成可执行二进制文件。这让你能够将源代码编译并运行在多台机器上。\n\n## 并发\n\nGo 语言通过 goroutines（协程）和\
    \ channels（通道）为并发提供了原生支持。这让你能够编写可以同时执行多个任务的多线程程序。\n\n## 垃圾回收\n\n自动内存管理是 Go 语言的一个特性。它的垃圾回收器与程序并发运行。这让你编写程序代码时无需担心内存泄漏。\n\
    \n## 静态类型\n\nGo 是一种静态类型语言，其中变量被显式声明为特定的固定类型。这使得能够在开发过程中早期发现错误。\n\n随着你对 Go 语言经验的增加，你可能会发现其他优势，但现在是时候开始了……\n\
    \n## 安装 Go 工具\n\n要开始 Go 语言编程，你必须先在 PC 上安装 Go 工具。这些工具允许你构建、运行和测试用 Go 语言编写的程序。Go\
    \ 工具随许多实用的标准标准包提供，你可以将它们导入自己的程序中。Go 语言安装程序适用于 Windows、macOS 和 Linux。\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_13_0.png)\n\
    \n- 打开浏览器并访问 https://golang.org，然后为你的系统下载合适的安装程序\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_13_1.png)\n\
    \n- 下载完成后，运行安装程序启动“Go 编程语言安装向导”\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_13_2.png)\n\
    \n- 3 点击 Next（下一步）继续，然后接受许可条款\n\n- 4 接受建议的安装文件夹（Windows 上为 C:\\Go），然后点击 Install（安装）完成安装\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_14_0.png)\n\nWindows Go 安装程序会自动将 Go\
    \ 添加到你的系统路径，以便在命令行提示符中使用 Go 工具。\n\n- 5 为了测试安装是否成功，首先打开 Terminal（终端）窗口——在 Windows\
    \ 系统上同时按下 WinKey + R，打开“Run”对话框，然后输入 cmd 打开“Command Prompt”（命令行提示符）窗口\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_14_1.png)\n\
    \n- 6 在命令行提示符处，输入命令 go 然后按回车查看 Go 工具命令列表\n\n## 命令行提示符\n\n```\nC:\\Users\\mike_go\n\
    env\nGo 是用于管理 Go 源代码的工具。\n用法:\n  go <command> [arguments]\n\n命令有：\n  bug     \
    \       启动 bug 报告\n  build         编译包和依赖项\n  clean          删除对象和缓存文件\n  doc\
    \            为符号生成文档\n  env            打印环境信息\n  fix            更新包到新版本\n  fmt\
    \            运行 goofmt（重新格式）包\n  generate       通过获取源码生成 Go\n  get           \
    \ 向当前模块添加依赖项并安装它们\n                 编译安装包和依赖项\n  list           列出包和模块\n  mod\
    \            模块维护\n  run            编译并运行 Go 程序\n  test           运行指定的工具\n  tool\
    \           运行 Go 版本\n  vet            报告命令中可能的错误。\n\n使用 \"go help <command>\"\
    \ 获取更多详细信息。\n```\n\n额外的帮助主题：\n\n```\nbuildmod      在 Go 和 C 之间构建\ncache      \
    \    编译和测试缓存\nenvironment    环境变量\nfiletype       文件类型\ngo.mod         the go.mod\
    \ 文件\ngoproath        GOPATH 环境变量\ngopath-get    旧版 GOPATH go get\ngoproxy   \
    \     模块代理协议\nimportpath     导入路径语法\ntypacket       模块语法\n```\n"
