    \nThe time.Kitchen constant is equivalent to a \"format\" of specifying a layout\
    \ format of \"15:04PM\".\n\n## Set Date and Time\n\nYou can create your own Time\
    \ data types using the Date() function of the Go standard library time package.\
    \ This requires eight arguments to specify (in this order) a year, a month, a\
    \ day number, an hour, a minute, a second, a nanosecond, and a location.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_193_0.png)\n\
    \nAll arguments are specified as integer values except for the month and location.\n\
    \nThe month can be specified using one of the time package predefined-name month\
    \ constants for January-December, for example, time.January.\n\nThe location can\
    \ be specified using one of the time package predefined location constants like\
    \ time.UTC, for Universal Time Coordinated or time.Local, for your system clock.\n\
    \nThe date fields in any Time data can be modified using the AddDate() method\
    \ of the Go standard library time package to specify three arguments for year,\
    \ month, and day. Positive values will advance the date, and negative values will\
    \ retard the date. For example, time.AddDate(1, 0, 0) will advance the date one\
    \ year.\n\nSimilarly, the time package’s Add() method can be used to specify a\
    \ single duration by which to modify a date/time. This value can be an int64 value\
    \ representing a number of nanoseconds by which to modify the date/time. More\
    \ conveniently, you can use constants time.Hour, time.Minute, time.Second, or\
    \ time.Millisecond to modify individual time fields of a Time data type. For example,\
    \ time.Add(10 * time.Hour ) will advance the time 10 hours.\n\nYou can also create\
    \ your own Time data types from a string using the Parse() function of the Go\
    \ standard library time package. This requires two arguments to specify a layout\
    \ and a date/time string. Usefully, this function returns two values, which are\
    \ a Time data type and an error. If the function returns a Time data type, the\
    \ error value will be nil, otherwise it will be an error message.\n\nThe layout\
    \ should only use values from the Go reference string:\n\nMon Jan 2 15:04:05 2006\
    \ MST\n\nUnless a time zone offset value is specified in the date/time string\
