- md: "\n## Delay Time\n\nThe Go standard library time package provides a Sleep()\
    \ function that allows you to delay progress of a program by a specified duration\
    \ period. The duration is supplied as an argument to the Sleep() function, and\
    \ can be expressed as a multiplication of a time package constant. For example,\
    \ 5 * time.Second expresses a duration of five seconds.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_200_0.png)\n\
    \nThe Go standard library time package also provides three methods that compare\
    \ an instance of the Time data type with another time specified as their argument.\
    \ These methods will each return a boolean true or false value according to the\
    \ result of the time comparison:\n\n| Method | Returns |\n| :--- | :--- |\n| Before(\
    \ time ) | A boolean true value if the instance time is earlier than its argument\
    \ time |\n| After( time ) | A boolean true value if the instance time is later\
    \ than its argument time |\n| Equal( time ) | A boolean true value if the instance\
    \ time and argument time represent the same instant even in different time zones\
    \ |\n\nIf you would like to see the difference between two instances of the Time\
    \ data type, you can use a Sub() method of a time instance to specify another\
    \ time as its argument. This method will return the elapsed duration between the\
    \ two instances as an int64 data value of nanosecond precision.\n\nIt is often\
    \ preferable to present duration periods with less than nanosecond precision,\
    \ so the Go standard library time package includes a Round() method to specify\
    \ more concise precision. This method requires one argument to determine your\
    \ preferred rounding behavior. Typically, the argument is supplied as one of the\
    \ time package constants. For example, calling the method with Round(time.Millisecond)\
