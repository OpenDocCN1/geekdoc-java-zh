    \ `css` 目录中，多个图像位于 `img` 目录中。整个服务器程序现在如下：\n\n```\nC:\\Users\\wiki_go\\src\\server\n\
    main.go\nhtml\n  favicon.ico\n  form.html\n  index.html\ncss\n  style.css\nimg\n\
    \  logo.png\n  power.png\n```\n（注：978-184078-812-9, 978-184078-840-2, 978-184078-873-0,\
