    ## Compose Elements\n\nThe second cornerstone of object-oriented programming is\
    \ that of inheritance, in which an object derived from another object will inherit\
    \ the features of the base object. This code reuse is made possible in Go programming\
    \ by “composition”. This is simply the technique of embedding one struct inside\
    \ another to instantly provide various elements to the second struct. For example,\
    \ a “dog” struct might embed a “animal” struct whose fields and attached methods\
    \ become instantly available to the “dog”.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_148_0.png)\n\
    \nStrictly speaking, the fields and attached methods are not actually inherited\
