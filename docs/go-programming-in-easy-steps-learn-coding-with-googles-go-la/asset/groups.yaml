- md: "\nGo programs can be written in a plain text editor, such as Windows' Notepad\
    \ app. It's useful to have a desktop shortcut that opens a text editor in your\
    \ \"src\" directory folder. Repeat the steps on this page, but in Step 7 enter\
    \ **notepad** as the location and **Go Editor** as the name, to create another\
    \ useful desktop shortcut.\n\n# Write a Go Program\n\nAll Go programs start as\
    \ plain text files that are later compiled into actual executable programs. This\
    \ means that Go programs can be written in any plain text editor, such as the\
    \ Windows’ Notepad app or the Nano app on Linux.\n\nFollow these steps to create\
    \ a simple Go program that will output the traditional first program greeting:\n\
    \n- Create a sub-directory named \"hello\" in your \"src\" folder\n\n```goGo Terminal\n\
    C:\\Users\\mike_go\\src>mkdir hello\nC:\\Users\\mike_go\\src>\n```\n\n- Open a\
    \ plain text editor, like Notepad, and type this code exactly as it is listed\
    \ to begin a program\npackage main\n\n- Two lines below, insert this code exactly\
    \ as it is listed\nimport \"fmt\"\n\n- Two further lines below, precisely add\
    \ this code\nfunc main() {\n\nfmt.Println(\"Hello World!\")\n\nSave the file in\
    \ the “hello” folder, and name it main.go – the complete program should now look\
    \ exactly like this:\n\n```\nmain.go - Notepad\nFile Edit Format View Help\npackage\
    \ main\nimport \"fmt\"\nfunc main() {\n    fmt.Println(\"Hello World!\")\n}\n\
    ```\n\nCapital P and lowercase L in fmt.Println.\n\nThe arrangement of files within\
    \ folders is important in Go. Each main file, and any related files, must be placed\
    \ in a uniquely named folder to create a package – so here the package is named\
    \ “hello”.\n\nThe separate parts of the program code on the opposite page can\
    \ be examined individually to understand each part more clearly:\n\n# The Package\
    \ Declaration\n\npackage main\n\nThe package type is declared following the package\
    \ keyword. All Go program code is contained in packages. You may declare your\
    \ own type for a package that will be a shared library, but you must declare the\
    \ package “main” if you want the code to be compiled into an executable program.\n\
    \n# The Import Declaration\n\nimport \"fmt\"\n\nThe keyword import is used to\
    \ import one, or more, packages into this package to make their features available\
    \ to this program. The package “fmt” comes from the Go standard library that is\
    \ included in your Go installation. It provides the fmt.Println() function that\
    \ is used to output text in this program. Note that the package name must be enclosed\
    \ in double quote characters. When importing multiple packages, the list of package\
    \ names must be enclosed within parentheses and each name must appear on its own\
    \ line, like this:\n\n```go\nimport (\n  \"fmt\"\n  \"strings\"\n)\n```\n\n# The\
    \ Function Declaration\n\n```\nfunc main() {\n  fmt.Println(\"Hello World!\")\n\
    }\n```\n\nThe function name follows the func { opening curly bracket on the same\
    \ line. The function body contains statements that are the actual instructions\
    \ to perform program tasks. The function body end with } closing curly bracket.\
    \ Function names must be unique, but each Go program must have a function named\
    \ “main” as this is the starting point of all Go programs.\n\nThe package name\
    \ and package type are two separate items – here the package is named hello, but\
    \ the type is main.\n\nYou can find the Go standard library packages in the \"\
    src\" directory of your GOPOT location – for example, at C:\\Go\\src. Additionally,\
    \ you can learn about each package from the official documentation at https://golang.org/pkg\
    \ – an invaluable resource.\n\n# Run a Go Program\n\nGo program code is compiled\
    \ and executed using the Go tools. During development, an error-free Go program\
    \ can be compiled and run by the **go run** tool. This is useful, but if you want\
    \ to create an executable binary version that can be executed repeatedly, you\
    \ can use the **go build** tool.\n\n- 1. Open a Command Prompt or Terminal window\
    \ in your \"src\" folder\n- 2. Enter the command **go run hello** to run the program\
    \ – it should output the greeting\n```\nGo Terminal\nC:\\Users\\mike_go\\src>go\
    \ run hello\nHello world!\nC:\\Users\\mike_go\\src>\n```\n- 3. Next, enter the\
    \ command **go build hello** to make an executable binary version of the program\
    \ – it should add an executable file in your \"src” folder\n- 4. Now, enter the\
    \ command **hello** on Windows, or ./hello on Linux or macOS – it should output\
    \ the traditional greeting twice\n\n```\nC:\\Users\\mike_go\\src>go build hello\n\
    C:\\Users\\mike_go\\src>hello\nHello world!\nC:\\Users\\mike_go\\src>hello\nHello\
    \ world!\nC:\\Users\\mike_go\\src>\n```\n\nOn Windows systems the binary file\
    \ is given the extension .exe, so the file built is hello.exe.\n\n# Format and\
    \ Comment Code\n\nIt is good practice to always ensure your Go source code is\
    \ properly formatted by the go fmt tool before running a program.\n\nIt is also\
    \ good practice to include explanatory comments in your source code so it can\
    \ be easily understood by others, and by yourself when revisiting the code. Single-line\
    \ comments can be added after a // sequence – everything on the line after //.\
    \ Multi-line comments can be added between /* and */ sequences – this is useful\
    \ to “comment-out” blocks of code, to hide it from the compiler during development.\n\
    \n- 1. Edit the code in hello.go to add a comment and unnecessary tab spacing\
    \ (bad formatting)\n```\nmain.go - Notepad\nFile Edit Format View\n// My First\
    \ Go Program: Output a greeting.\n\npackage main\nimport\n\t\"fmt\"\nfunc main()\
    \ {\n\tfmt.Println(\"Hello World!\")\n}\n```\n- 2. Now, at a prompt, enter the\
    \ command go fmt hello then reopen the source code file to see correct formatting\n\
    \nComments should not be “nested”, one inside another.\n\nThe go fmt tool provides\
    \ some simple error checking. For example, omit a final double quote the line\
    \ and it will provide the line number and position where the error occurs and\
    \ provide the nature of the error as “string literal not terminated”.\n\n# Explore\
    \ VS Code Editor\n\nAlthough you can create Go programs just fine with a command\
    \ prompt and plain text editor, many developers prefer to use a specialized code\
    \ editor app. These offer useful additional features such as syntax highlighting,\
    \ auto-indentation, bracket-matching and code debugging. Perhaps the free code\
    \ editor is the Visual Studio Code (“VS Code”) app from Microsoft. It’s available\
    \ for download at https://code.visualstudio.com/download in Windows, Linux and\
    \ macOS.\n\nWhen you download and install VS Code, you have only got the code\
    \ editor framework. VS Code can actually support many different programming and\
    \ scripting languages, so you have to install an appropriate extension for the\
    \ one you want to code with.\n\n- 1. Download and install VS Code\n- 2. To open\
    \ the “Extensions Marketplace” sidebar, first click View, Appearance, Show Activity\
    \ Bar, then click the Extensions button on the Activity Bar\n\n# Go for Visual\
    \ Studio Code\n\nNext, type \"go\" into the search box to find the VS Code extension\
