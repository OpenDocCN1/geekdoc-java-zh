    \ to represent a zero value for many types. Here, it simply indicates that there\
    \ was no error. The syntax of a function that handles errors might, therefore,\
    \ look like:\n\n```go\nfunc funcName ( paramName type ) ( returnType, error )\
    \ {\n\tif condition != true {\n\t\treturn -1 , errorValue\n\t}\n\treturn returnValue,\
    \ nil\n}\n```\n\nThe \"fmt\" package that provides the fmt.Println() and fmt.Printf()\
