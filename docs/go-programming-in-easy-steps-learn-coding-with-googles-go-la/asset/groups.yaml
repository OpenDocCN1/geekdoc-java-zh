- md: "\n## Call Recursively\n\nStatements within custom functions can freely call\
    \ other custom functions just as readily as they can call standard Go library\
    \ functions like fmt.Printf(). Additionally, functions can call themselves “recursively”.\
    \ As with loops, it is important that recursive function calls must modify a tested\
    \ expression to avoid continuous execution – so the function will exit at some\
    \ point.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_114_0.png)\n\nRecursive function\
    \ calls can be used to emulate loop structures, such as the countdown example\
    \ here:\n\n- Create a function that requires an integer argument and makes recursive\
    \ calls until that value is decremented to zero\n\n```go\nif num < 1 {\n    fmt.Println(\"\
    Lift Off!\")\n} else {\n    fmt.Println(\"Countdown\", num)\n    num--\n    countDn(num)\n\
    }\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_114_1.png)\n\nsrc\\recur\\\
    main.go\n\n- Add a main function that contains a statement to call the function\
    \ above\n\n```go\nfunc main() {\n    countDn(10)\n}\n```\n\nSave the program file\
    \ in a “recur” directory, then run the program to see recursive function calls\
    \ emulate a loop\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_115_0.png)\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_115_1.png)\n\
    \nRecursive function calls are useful to resolve mathematical problems, such as\
    \ the calculation of the factorial of a given number. The factorial is the multiplication\
    \ of all integers from the given number to one – e.g. the factorial of 3 is 3\
    \ (2*1).\n\n- Create a function that requires an integer argument and will return\
    \ one integer value upon each call\n\n```go\nfunc facto(num int) int {\n    //\
    \ Statements to be inserted here.\n}\n```\n\nsrc\\facto\\main.go\n\n- Next, insert\
    \ a statement to return one (1) when the argument value is decremented to (0)\n\
    \n```go\nif num == 0 {\n    return 1\n}\n```\n\n- Then, insert a final statement\
    \ to recursively call the function, multiply all numbers in the sequence\n\n```go\n\
    return num * facto(num - 1)\n```\n\n- Add a main function that contains a statement\
    \ to print out factorials\n\n```go\nfunc main() {\n    for i := 1; i < 7; i++\
    \ {\n        fmt.Println(\"Factorial\", i, \"=\", facto(i))\n    }\n}\n```\n\n\
    - Save the program file in a \"facto\" directory, run the program to see a factorial\
    \ sequence\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_116_0.png)\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_116_1.png)\n\
    \nRecursive functions are useful, but not very efficient. This example calls facto()\
    \ 7 times to generate this sequence of factorials!\n\n## Anonymous Functions\n\
    \nThe Go programming language has support for “first class functions”. This allows\
    \ functions to be assigned to variables, passed as arguments to other functions,\
    \ and returned from functions.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_118_0.png)\n\
    \nAn anonymous function is simply a function definition that does not contain\
    \ a name. This is useful to create a function inline without having to name it.\
    \ Anonymous functions are also known as “function literals”. Like other functions,\
    \ these can contain a parameter list, return type list, and can return multiple\
    \ values. You can create a self-invoking anonymous function by appending the ()\
    \ operator at the end of the function definition, like this:\n\n```go\nfunc()\
    \ { fmt.Println(\"Function Literal\") }()()\n```\n\nAdditionally, an anonymous\
    \ function can be assigned to a variable, then called by appending the () operator\
    \ after the variable name, like this:\n\n```go\nfn := func() { fmt.Println(\"\
    Function Literal\") }\nfn()\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_118_1.png)\n\
    \nSelf-invoking function expressions execute their statements one only.\n\n##\
    \ Closures\n\nPerhaps the most useful purpose of anonymous functions is for the\
    \ creation of “closures”. A closure is a function nested inside an outer function\
    \ that retains access to variables declared in the outer function. The outer function\
    \ can return an anonymous function that retains access to the variables but, crucially,\
    \ the variables are not accessible from anywhere else in the program code. This\
    \ is a form of encapsulation that protects the data stored in variables as the\
    \ returned anonymous function “closes” over them.\n\nThe closure can be made self-invoking\
    \ for assignment to a variable by appending the () operator after the end of the\
    \ outer function. The anonymous inner function can then be called by appending\
    \ the () operator after the variable name – can access the persistent value in\
    \ the outer function.\n\nIt can be difficult to grasp the concept of closures,\
    \ as it would seem that the variable in the outer function should be destroyed\
    \ when the self-invoking function has completed execution.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_119_0.png)\n\
    \nDon't worry if you can't immediately understand how closures work. They can\
    \ seem mystical at first, but will become clearer with experience. You can continue\
    \ on and come back to this technique later.\n\n- Begin a main function by assigning\
    \ an anonymous function to a variable\n\n```go\nfunc main() {\n    area := func(length,\
    \ width int) int {\n        return length * width\n    }\n}\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_120_0.png)\n\
    \n## anon/main.go\n\n- Next, insert statements to display the anonymous function's\
    \ type and two returned values\n\n```go\nfmt.Printf(\"area Type: %T \\n\", area)\n\
    fmt.Println(\"Area 1:\", area(10, 4))\nfmt.Println(\"Area 2:\", area(12, 5))\n\
    ```\n\n- Now, insert statements to assign an anonymous self-invoking closure function\
    \ to a variable\n\n```go\ncounter := func() func() int {\n    num := 0\n    return\
    \ func() int {\n        num++\n        return num\n    }\n}\n```\n\n- Finally,\
    \ insert statements to display the closure function's type and three returned\
    \ values\n\n```go\nfmt.Printf(\"counter type: %T \\n\", counter)\nfmt.Println(\"\
    Count:\", counter())\nfmt.Println(\"Count:\", counter())\nfmt.Println(\"Count:\"\
    , counter())\n```\n\n- Save the program file in an \"anon\" directory, then run\
    \ the program to see the function types and returned values\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_120_1.png)\n\
    \n## Pass Functions\n\nNotice that the outer function must state its return type\
    \ as func() int because it will return an integer value.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_121_0.png)\n\
    \n## Programmer-defined Function Types\n\nYou can declare a custom function type\
    \ using the type keyword, followed by a name of your choice, and a function signature.\
    \ For example:\n\n```go\ntype adder func(int, int)\n```\n\nVariables then be created\
    \ as “instances” of the function type, with a matching signature. The function\
    \ can be called in the usual way.\n\n## Higher-order Functions\n\nPassing functions\
    \ to other functions allows actions to be modified without repeating lines of\
    \ code. Any function that accepts functions as arguments, or any function that\
    \ returns one or more functions, is regarded as a “higher-order” function.\n\n\
    - Declare a main function by declaring a custom function type that has a signature\
    \ requiring two integer arguments and an integer return type\n\n```go\nfunc main()\
    \ {\ntype adder func(int, int)\n```\n\nsrc/listypemin.go\n\n- Next, insert a statement\
    \ to define a function (instance) of the custom type – with a matching signature\n\
    \n```go\nvar add = func(a int, b int) int {\n    return a + b\n}\n```\n\n- Now,\
    \ insert a statement that calls the function (instance)\n\n```go\nfmt.Println(\"\
    Added:\", add(6, 2))\n```\n\n// Steps to be inserted here.\n\nAfter the main function,\
    \ begin a higher-order function that will receive and return a function of the\
    \ same signature as the custom type\n\n```go\nfunc dub(twice func(int, int) int)\
    \ func(int, int) int {\n    fmt.Println(\"Doubled:\", twice(6, 2) * 2)\n    return\
    \ nil\n}\n```\n\n- Now, insert statements to define and return a function, of\
    \ the same signature, to the caller\n\n```go\ndiv := func(a int, b int) int {\n\
    \    return (a + b) / 2\n}\n```\n\nBack in the main function, insert a statement\
    \ to pass the function (instance) to the higher-order function, and assign that\
    \ function’s returned function to a variable\n\n```go\ndiv := dub(add)\n```\n\n\
    - Now, insert a statement that calls the returned function\n\n```go\nfmt.Println(\"\
    Divided:\", div(6, 2))\n```\n"
  mdcn: "\n\n## 递归调用\n\n自定义函数内部语句可以自由地调用其他自定义函数，就像调用 `fmt.Printf()` 等标准 Go 函数一样简单。此外，函数可以“递归地”调用自己。与循环一样，重要的是递归函数调用必须修改被测试的表达式，以避免持续执行——这样函数会在某个点退出。\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_114_0.png)\n\n递归函数调用可以用于模拟循环结构，例如这里的倒计时示例：\n\
    \n- 创建一个需要整数参数的函数，并不断进行递归调用，直到该值递减到零\n\n```go\nif num < 1 {\n    fmt.Println(\"\
    Lift Off!\")\n} else {\n    fmt.Println(\"Countdown\", num)\n    num--\n    countDn(num)\n\
    }\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_114_1.png)\n\nsrc\\recur\\\
    main.go\n\n- 添加一个 main 函数，其中包含一个调用上述函数的语句\n\n```go\nfunc main() {\n    countDn(10)\n\
    }\n```\n\n将程序文件保存到“recur”目录中，然后运行程序查看递归函数调用模拟循环\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_115_0.png)\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_115_1.png)\n\n递归函数调用对于解决数学问题，例如计算给定数的阶乘。阶乘是从给定数字到1\
    \ 的所有整数的乘积——例如，3 的阶乘是 3 (2*1)。\n\n- 创建一个需要整数参数的函数，并在每次调用时返回一个整数值\n\n```go\nfunc\
    \ facto(num int) int {\n    // 在此处插入语句。\n}\n```\n\nsrc\\facto\\main.go\n\n- 接下来，插入一个语句，当参数值递减到\
    \ (0) 时返回一个 (1)\n\n```go\nif num == 0 {\n    return 1\n}\n```\n\n- 然后，插入一个最终语句来递归调用函数，乘以序列中的所有数字\n\
    \n```go\nreturn num * facto(num - 1)\n```\n\n- 添加一个 main 函数，其中包含一个打印阶乘的语句\n\n\
    ```go\nfunc main() {\n    for i := 1; i < 7; i++ {\n        fmt.Println(\"Factorial\"\
    , i, \"=\", facto(i))\n    }\n}\n```\n\n- 将程序文件保存到 \"facto\" 目录中，运行程序查看阶乘序列\n\n\
    ![](img/fa565c410b0509c58bcab29ed0b49de9_116_0.png)\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_116_1.png)\n\
    \n递归函数很有用，但效率并不高。这个示例调用了 7 次 facto() 为了生成这个阶乘序列！\n\n## 匿名函数\n\nGo 编程语言支持“一等函数”。这允许将函数赋值给变量、作为参数传递给其他函数，并从函数返回。\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_118_0.png)\n\n匿名函数简单来说是不包含名称的函数定义。这对于内联创建函数而无需命名非常有用。匿名函数也称为“函数字面量”。像其他函数一样，这些可以包含参数列表、返回类型列表，并返回多个值。你可以通过在函数定义末尾附加\
    \ `()` 运算符来创建一个自执行的匿名函数，如下：\n\n```go\nfunc() { fmt.Println(\"Function Literal\"\
    ) }()()\n```\n\n此外，匿名函数可以赋值给变量，通过在变量名后附加 `()` 运算符来调用，如下：\n\n```go\nfn := func()\
    \ { fmt.Println(\"Function Literal\") }\nfn()\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_118_1.png)\n\
