- md: "\n}\nWhen one or more expressions evaluated by an if test statement are found\
    \ to be false, the statements in its following curly brackets are not executed\
    \ and the program proceeds to subsequent code. It is often preferable to extend\
    \ an if statement by appending an else statement specifying statements within\
    \ curly brackets to be executed when the expressions evaluated by the if statement\
    \ are found to be false, with this syntax:\n\n```\nif test-expression {\n    statements-to-execute-when-the-condition-is-true\n\
    } else {\n    statements-to-execute-when-the-condition-is-false\n}\n```\n\nThis\
    \ is a fundamental programming technique that offers the program two directions\
    \ in which to proceed, depending on the result of the evaluation, and is known\
    \ as “conditional branching”.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_79_0.png)\n\
    \nThe test expression and opening { curly bracket must appear on the same line\
    \ as the if keyword.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_79_1.png)\n\n\
    The else keyword and opening { curly bracket must appear on the same line as the\
    \ } closing curly bracket of the previous block of statements.\n\n-   Begin a\
    \ main function with a statement that tests whether two characters are matching\n\
    ```\nfunc main() {\n    if 'A' == 'A' {\n        fmt.Println(\"\\nCharacters Match\"\
    )\n    }\n    // Statements to be inserted here.\n}\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_80_0.png)\n\
    \nsrc\\else\\main.go\n\n-   2. Next, in the main function, insert nested statements\
