    \ true，否则返回 false。通常，> “大于”或 < “小于”运算符用于测试循环结构中迭代计数器的值。\n\n在 > “大于”运算符或 < “小于”运算符后添加\
    \ = 赋值运算符，可以使它们在两个操作数的值完全相等时也返回 true。\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_64_0.png)\n\
    \n比较运算符也被称为“关系运算符”。\n\n- 在你的“src”文件夹内创建一个名为“comp”的目录\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_64_1.png)\n\
