    \ Response\n- Summary\n\n## Listen for Requests\n\nThe Go standard library net\
    \ package contains an http package that provides utilities that make it easy to\
    \ create a web server. These utilities can be made available to your program by\
    \ importing the net/http package.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_282_0.png)\n\
    \nThe http.ListenAndServe() function enables the program to start a web server\
    \ running. It requires two arguments to specify a TCP network address string and\
    \ a request handler. The address string specifies a port number to which the web\
    \ server should listen for incoming requests. The port number must be prefixed\
    \ by a : colon character within the string – for example, “8000” to listen for\
    \ incoming requests on local port 8000. The default handler is typically used\
    \ by specifying a nil second argument.\n\nThe http.ListenAndServe() function always\
    \ returns a non-nil error, blocks forever. This means that lines of code below\
    \ the call to this function will never be executed. The web server will continue\
    \ to listen for incoming requests until the program gets terminated.\n\n- Begin\
    \ by importing the Go standard library net/http package into a program\n```go\n\
    import (\n  \"fmt\"\n  \"net/http\"\n)\n```\n\n```\nsrc\\server\\main.go\n```\n\
