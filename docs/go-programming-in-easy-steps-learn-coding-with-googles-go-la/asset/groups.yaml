    # Generate Randoms


    The Go standard library math package contains a rand package that provides functions
    to generate pseudo-random numbers. You can make this available to your program
    by importing math/rand.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_227_0.png)


    The rand.Intn() function returns a random number from zero up to the number specified
    as its argument. The rand.Perm() function returns a sequence of integers, from
    zero up to the number specified as its argument, in a pseudo-random order.


    The randomizing pattern is based upon a default “seed” that will return the same
    pseudo-random order each time the program runs. This may be what you want, but
    often it is preferable to generate a different order each time the program runs.
    To make this happen, you must specify a custom seed as an integer argument to
    a rand.Seed() function that will be unique each time the program runs. It is convenient
    to use the current system time for this purpose by calling the time.Now() function
    and extracting the integer count of elapsed nanoseconds since the Epoch using
    the Time data type UnixNano() method. This value will be different each time the
    program runs, so specifying this integer as the argument to the rand.Seed() function
    will ensure a different pseudo-random order is generated each time the program
    runs.


    - The Go standard library math/rand package into a program, along with the time
    package to set a random seed and the strconv package to convert random numbers


    ```go

    import ("fmt"

    "math/rand"

    "strconv"

    "time")

    ```


