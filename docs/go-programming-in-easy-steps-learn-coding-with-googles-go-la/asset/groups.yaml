    \ the error, and lets you handle the error using the familiar Go language constructs.\n\
    \nTo handle a possible error, the function signature must include a Go built-in\
    \ error return type. Traditionally, this is the final return value in the list\
    \ of return values.\n\n```go\nfunc funcName ( paramName type ) ( returnType, error\
    \ )\n```\n\nIn place of the expected return value in the function body, the function\
    \ can return a trivial value, such as -1, together with the returned error value.\n\
    \nIf an error does not arise, the function can return the expected return value,\
