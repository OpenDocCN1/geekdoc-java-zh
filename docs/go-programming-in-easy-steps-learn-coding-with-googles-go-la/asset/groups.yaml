- md: "\n# Juggle Bits\n\nIn computer terms, each byte comprises eight bits that can\
    \ each contain a 1 or a 0 to store a binary number, representing decimal values\
    \ from 0 to 255. Each bit contributes a decimal component only when it contains\
    \ a 1. Components are designated right-to-left from the “Least Significant Bit”\
    \ (LSB) to the “Most Significant Bit” (MSB). The binary number in the bit pattern\
    \ below 00110110 represents the decimal number 50 (2+16+32):\n\n| Bit No. | 8\
    \ MSB | 7 | 6 | 5 | 4 | 3 | 2 | 1 LSB |\n|---|---|---|---|---|---|---|---|---|\n\
    | Decimal | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |\n| Binary | 0 | 0 | 1 | 1 | 0\
    \ | 0 | 1 | 0 |\n\nIt is possible to manipulate individual parts of a byte using\
    \ the Go “bitwise” operators listed below:\n\n| Operator | Name | Example Operation\
    \ |\n|---|---|---|\n| & | AND | 0011 & 0101 = 0001 |\n| | | OR | 0011 | 0101 =\
    \ 0111 |\n| ^ | XOR | 0011 ^ 0101 = 0110 |\n| ^ | NOT | ^0101 = 1010 |\n| &^ |\
    \ AND NOT | 0011 &^ 0101 = 0010 |\n| << | Shift left | 0010 << 2 = 1000 |\n| >>\
    \ | Shift right | 1000 >> 2 = 0010 |\n\nBy far the most common use of bitwise\
    \ operators is to manipulate a compact “bit field” representing a set of boolean\
    \ “flags”. This is a much efficient use of memory than storing boolean flag values\
    \ in separate variables – a byte data type of just one byte can hold a bit field\
    \ of flags, one per bit, whereas eight separate byte variables would require eight\
    \ whole bytes of memory.\n\nMany Go programmers never use bitwise operators but\
    \ it is useful to understand what they are and how they may be used.\n\nEach half\
    \ of a byte is known as a “nibble” (4 bits). The binary numbers in the examples\
    \ in the table describe values stored in a nibble.\n\n- Create a directory named\
    \ “bits” inside your “src” folder\n\nsrc\\bits\\main.go\n\n- Begin a main.go program\
    \ with package and import declarations\n```go\npackage main\nimport \"fmt\"\n\
    ```\n\n- Add a main function that declares and initializes one variable comprising\
    \ eight bits\n```go\nfunc main() {\nvar flags byte = 10 // Binary 1010 (1x8 0x4\
    \ 1x2 0x1)\n// Statements to be inserted here.\n}\n```\n\n- In the main function,\
    \ insert statements to output all the bit flag settings\n```go\nfmt.Printf(\"\
    Flag #1:%v \\n\", (flags & 1) > 0)\nfmt.Printf(\"Flag #2:%v \\n\", (flags & 2)\
    \ > 0)\nfmt.Printf(\"Flag #3:%v \\n\", (flags & 4) > 0)\nfmt.Printf(\"Flag #4:%v\
    \ \\n\", (flags & 8) > 0)\n```\n\n- Next, insert a statement to display the decimal\
    \ value representing this pattern\n```go\nfmt.Printf(\"Flag Value: %08b \\t%v\
    \ \\n\", flags, flags)\n```\n\n- Now, insert statements to shift the \"on\" bit\
    \ flags one bit to the right and output the decimal value of the new pattern\n\
    ```go\nflags = flags >> 1\nfmt.Printf(\"New Value: %08b \\t%v \\n\", flags, flags)\n\
    ```\n\n- Save the program file in the \"bits\" directory, then run the program\
    \ to see the bit flags\n\nLarger bit fields with more bit flags can be created\
    \ using a variable with more memory – an int data type is 32 bits wide on a 32-bit\
    \ system and 64 bits wide on a 64-bit system. The %b format specifier is used\
    \ here to output the binary value in each.\n\n# Understand Precedence\n\nOperator\
    \ precedence defines the order in which the Go compiler evaluates expressions.\
    \ In the expression 6 + 7 * 3 the order of precedence determines whether the addition\
    \ or multiplication is completed first. The table below lists operator precedence\
    \ in decreasing order, where operators on higher rows have precedence over those\
    \ on lower rows. Operators on the same row have equal precedence but the order\
    \ of completion is determined by their left-to-right order, so that operations\
    \ on the left get completed first.\n\n| Precedence Level | Operator |\n|---|---|\n\
    | 5 | * / % |\n| 4 | + - |\n| 3 | == != <= |\n| 2 | && >= |\n| 1 | || |\n\nIncrement\
    \ operator and decrement operator form statements in Go programming, rather than\
    \ appear in expressions, so they are not included in the precedence level above.\
    \ You can force the compiler to ignore default levels by enclosing parts of an\
    \ expression with parentheses, to force the compiler to evaluate innermost parts\
    \ first. For example, in the expression 6 + 7 * 3 the multiplication operator\
    \ has, by default, a higher level of precedence than + addition operator, so the\
    \ multiplication operation is performed first as addition. You may prefer to have\
    \ the addition operation performed first, so you can force the compiler to do\
    \ that by adding parentheses to the expression as (6 + 7) * 3. Now the evaluation\
    \ of the expression is 6 + 7 = 3.\n\n- Create a directory named “force” inside\
    \ your “src” folder\n\n- Begin a main.go program with package and import declarations\n\
    ```go\npackage main\nimport \"fmt\"\n```\n\n- Add a main function that declares\
    \ and initializes a variable by evaluating an expression and displays its value\n\
    ```go\nfunc main() {\nsum := 2 * 3 + 4\nfmt.Printf(\"Default Order: %v\\n\", sum)\n\
    // Statements to be inserted here.\n}\n```\n\n- In the main function, insert statements\
    \ to display the value of evaluating a modified expression\n```go\nsum := 2 *\
    \ ((3 + 4) - 5)\nfmt.Printf(\"Forced Order: %v\\n\", sum)\n```\n\n- Next, insert\
    \ statement to display the value of evaluating another expression\n```go\nsum\
    \ = 7 % 3 * 2\nfmt.Printf(\"Default Order: %v\\n\", sum)\n```\n\n- Now, insert\
    \ statements to display the value of evaluating modified expression\n```go\nsum\
    \ = 7 % (3 * 2)\nfmt.Printf(\"Forced Order: %v\\n\", sum)\n```\n\n- Save the program\
    \ file in the “force” directory, then run the program to see the different outcomes\n\
    \n```\nC:\\Users\\mike_\\go\\src>go run force\nDefault Order: 3\nForced Order:\
    \ 4\n\nDefault Order: 2\nForced Order: 1\n\nC:\\Users\\mike_\\go\\src>>\n```\n\
    \nUse parentheses in your expressions to avoid unexpected results.\n\n# Summary\n\
    \n- Arithmetical operators can form expressions with two operands for addition\
