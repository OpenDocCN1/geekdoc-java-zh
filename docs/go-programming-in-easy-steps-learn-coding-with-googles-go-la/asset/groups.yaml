    \n# Loop Times (循环次数)\n\n循环是程序中自动重复的代码。循环内所有语句的完整执行被称为“迭代”，或“通过”。循环的长度由循环内的条件测试控制。当测试表达式发现为\
    \ `true` 时，循环将继续——直到测试表达式发现为 `false`，此时循环结束，不再执行语句。\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_86_0.png)\n\
    \n在 Go 编程中，有多种构建循环的方法但都使用 `for` 关键字。最常见的循环语句包含三个部分——初始化器、单个测试表达式和增器，语法如下：\n\n\
