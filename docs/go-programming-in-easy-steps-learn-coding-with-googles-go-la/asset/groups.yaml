    \n![](img/fa565c410b0509c58bcab29ed0b49de9_253_1.png)\n\nThe _ blank identifier\
    \ represents the info type that is not used in this program.\n\n# Summary\n\n\
    - The Go standard library fmt package provides Scan(), ScanIn(), and Scanf() functions\
    \ to read from standard input.\n- The Scan(), ScanIn(), and Scanf() functions\
    \ each return two values of the number of items scanned and any read error.\n\
    - If no error is encountered when reading from standard input, the returned error\
    \ value will be nil.\n- The Go standard library bufio package provides a Scanner\
    \ type, which is a memory buffer for data streams.\n- A Scanner has a Scan() method\
    \ to read input, a Text() method to return text, and an Err() method to return\
    \ errors.\n- The Go standard library strings package provides a Fields() function\
    \ that can split a string into individual words.\n- The Go standard library os\
    \ package provides an Args slice, which stores command-line argument values in\
    \ elements.\n- The Go standard library flag package has String(), Int(), and Bool()\
    \ functions that specify a flag name, default value, and a help message.\n- The\
    \ flag package's Parse() function applies the user's values to a flag.\n- The\
    \ Go standard library io package contains an ioutil package that provides a ReadFile()\
    \ function to read an entire file.\n- The Go standard library os package has Open(),\
    \ Read(), Seek(), and Close() methods to process a file's content.\n- The Close()\
    \ method can be called with the defer keyword to close a file later, after all\
    \ file operations complete.\n- The Go standard library io/ioutil package provides\
    \ a TempFile() function to create temporary files.\n- The TempFile() function\
    \ returns an os.File type that has Name(), Write(), WriteString(), and Close()\
    \ methods to add content to a temporary file.\n- The os.Remove() function can\
    \ delete files, and the os.Stat() function can examine file information.\n\n#\
    \ 11\n\n# Employ Concurrency\n\nThis chapter demonstrates how to use goroutines\
    \ and channels to perform concurrent execution of tasks in Go programs.\n\n- Create\
    \ Goroutines\n- Keep Waiting\n- Make Channels\n- Buffer Channels\n- Select Channels\n\
    - Synchronize Goroutines\n- Use Worker Pools\n- Summary\n\n# Create Goroutines\n\
    \nGo programs, like those written in other programming languages, generally execute\
    \ their code line-by-line in a sequential manner. But Go programming also supports\
    \ “goroutines” that provide the ability for lines of code to be executed concurrently,\
    \ side-by-side. This is a big reason why many people choose Go programming.\n\n\
    ![](img/fa565c410b0509c58bcab29ed0b49de9_257_0.png)\n\nConcurrency provides the\
    \ potential to take advantage of multi-core processors, but it is important to\
    \ distinguish the difference between concurrency and parallelism:\n\n- Parallelism\
    \ is when two tasks are performed at exactly the same time. For example, on a\
    \ multi-core processor when one core is performing a task and another core is\
    \ performing a different task – simultaneously. This, however, is difficult to\
    \ achieve with program code that is executed line-by-line.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_257_1.png)\n\
    \n- Concurrency is the separation of program code into independently-executing\
    \ tasks that could potentially run simultaneously and produce a correct final\
    \ result. So a concurrent program is one that can be parallelized. Goroutines\
    \ provide this ability in Go program code.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_257_2.png)\n\
    \n# Parallel\n\n# Concurrent\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_258_0.png)\n\
