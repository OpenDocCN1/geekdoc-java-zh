    # Fix Constant Values


    If you want to store a fixed value that will never change during the execution
    of your program, you should declare it using the const keyword, rather than the
    var keyword. This prevents accidental (or mischievous) attempts to assign a different
    value. The compiler will display a “cannot assign to” message if your code tries
    to assign a new value to a constant.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_46_0.png)


    Unlike variable declarations, a constant declaration must be initialized with
    its fixed value in the declaration, like this:


    ```

    const oneMillion = 1000000

    ```


