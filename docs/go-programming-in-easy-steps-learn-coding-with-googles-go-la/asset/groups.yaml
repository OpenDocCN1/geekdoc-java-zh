    using the type keyword, followed by a type name of your choice, and a function
    signature. For example, a custom function named “adder” that must receive two
    integer arguments and return one integer argument, and like this:


    ```

    type adder func(int, int) int

    ```


    Variables then be created as “instances” of the custom function type, and can
    be assigned a function definition – whose signature must match that in the custom
    function type declaration. The function (instance) can be called in the usual
    way.


    # Higher-order Functions


    Regular functions that receive value or reference arguments, and return these
    types to the caller, are called “first-order” functions. But functions can also
    be passed as arguments to other functions, and functions can return functions
    to the caller. Any function that accepts functions as arguments, or any function
    that returns one or more functions, is regarded as a “higher-order” function.


    Passing functions to other functions allows actions to be modified without repeating
    lines of code.


