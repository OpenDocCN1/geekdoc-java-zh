    C:\\Users\\mike\\go\\src>\n```\n\n数组索引从零开始，所以这里的最后一个第五个元素的索引号为 4。\n\nGo 提供了了一些可以使用数组的特殊功能。首先，当使用数组字面量声明数组变量时，你可以使用\
    \ `...` 通配符运算符将元素数量设置为数组字面量中值的数量：\n\n```go\narr := [...] int(10, 20, 30) // len(arr)\
    \ == 3.\n```\n\n你甚至可以通过陈述每个值的索引号来指定应该存储哪个元素值，如下：\n\n```go\narr := [...] int(2:\
    \ 10, 0: 20, 1: 30) // arr == [20, 30, 10].\n```\n\n其次，你可以使用 `range` 关键字来遍历数组并返回每个元素的索引号和值。\n\
