- md: "\nform.html\n\nThe POST method will be tested by the server; the lookup value\
    \ will identify a form handler function; and the Language value will identify\
    \ the submitted value.\n\n## Deliver a Static Page\n\nThe Go standard library\
    \ net/http package provides three functions that allow a web server to easily\
    \ respond to all HTTP requests with the contents of a nominated file system.\n\
    \nThe path of the root file directory is first specified as the argument to an\
    \ http.Dir() function. This returns a Dir type that is then specified as the argument\
    \ to an http.FileServer() function. This, in turn, returns a handler to respond\
    \ to all HTTP requests with contents from the nominated root file directory.\n\
    \nFinally, an http.Handle() function is used to register the handler. This requires\
    \ two arguments to specify a route pattern and the handler’s name. Typically,\
    \ the pattern “” is used as the first argument – to match all request paths.\n\
    \nThe web browser can now request any document by name from within the nominated\
    \ root file directory. If the file name is omitted from the request, the server\
    \ will automatically seek a document named index.html to deliver to the browser.\n\
    \n- At the start of the main function, insert a statement to nominate the root\
    \ directory of files to serve `dir := http.Dir(`\n\n```\n\"C:/Users/mike_/go/src/server/htdocs\"\
    )\n```\n\n- Next, create a request handler for that file system `fileServer :=\
    \ http.FileServer( dir )`\n\n- Now, register the handler for all HTTP requests\n\
    `http.Handle(\"/\", fileServer )`\n\n- Save the updated program file, then start\
    \ the web server and visit localhost:8000/index.html (or simply visit localhost:8000)\
    \ to see a static index web page\n\nYou will need to edit the path to the root\
    \ file directory to its location on your own system.\n\n## Log Received Data\n\
    \nHaving successfully delivered a static form index web page, the program can\
    \ now supply a form page for the submission of data.\n\nThe http.Request object\
    \ has a ParseForm() method that populates an http.Request.Form with submitted\
    \ form input values. A submitted value can then be retrieved by specifying the\
    \ form input name as an argument to http.Request.FormValue() method.\n\nThere\
    \ is also an http.Request.Method object containing the value assigned to the form’s\
    \ HTML method attribute. The “POST” method is preferred for the submission of\
    \ data.\n\nIf a form submission cannot be parsed, or if the form is using the\
    \ wrong submission method, an error message can be sent to the browser by the\
