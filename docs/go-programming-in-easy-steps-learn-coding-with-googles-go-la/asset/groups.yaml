    # Summary


    +   * The `if` keyword performs a basic conditional test to evaluate a given expression
    for a boolean value of `true` or `false`.


    +   * The `else` keyword can be used to provide alternative statements to execute
    when an `if` statement finds an expression to `false`.


    +   * Offering a program alternative directions in which to proceed following
    an evaluation is known as “conditional branching”.


    +   * Conditional branching performed by multiple `else` statements can often
    be performed more efficiently by a `switch` statement.


    +   * The statements within a `switch` block must each appear on a separate line
    below the `case` statement.


    +   * Optionally, a `switch` block may contain a `default` statement specifying
    statements to execute when no match is found.


    +   * The `for` keyword can specify an initializer, a test-expression, and an
    incrementer, to control a loop.


    +   * The `for` keyword can simply specify a test expression to determine whether
    a loop should continue while `true`.


    +   * The `for` keyword can entirely omit the test-expression to create an infinite
    loop.


    +   * A condition can be tested within the body of an infinite loop to end the
    loop with the `break` keyword.


    +   * The `break` keyword can be used to terminate a loop, whereas the `continue`
    keyword can be used to skip a single iteration.


    +   * Loops may be nested so that inner loops perform a sequence of iterations
    upon each iteration of their outer loop.


    +   * Use of the `goto` keyword is generally not recommended, but it can legitimately
    be used to exit from nested loops.'
