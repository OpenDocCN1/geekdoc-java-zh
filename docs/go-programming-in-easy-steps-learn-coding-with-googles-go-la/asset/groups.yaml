    \n```\n\n- 接下来，在 `main` 函数中，使用一个路由注册表单处理程序，该路由将识别赋值给表单 HTML `action` 的名称 `http.HandleFunc(\"\
    /lookup\", formHandler)`\n\nGo 为每个 HTTP 状态提供了常量，例如带有 `http.StatusOK` 的 200。完整列表请参见\
    \ golang.org/pkg/net/http 上的文档。\n\n- 在 `main` 函数之后，开始表单处理程序，并带有检查提交方法的验证\n```go\n\
