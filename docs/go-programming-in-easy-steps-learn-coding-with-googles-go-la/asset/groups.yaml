    \ the program to see the channel messages\n\nAn unlabeled break statement would\
    \ only break out of the select statement – allowing the for loop to continue!\
    \ A labeled break statement breaks out of the select statement and the infinite\
    \ for loop.\n\n# Synchronize Goroutines\n\nThe blocking action of unbuffered channels,\
    \ where the sending action blocks a sending goroutine until another goroutine\
    \ receives the delivery on the channel, causes the sending and receiving goroutines\
    \ to synchronize. In fact, unbuffered channels are sometimes referred to as “synchronous\
    \ channels”.\n\nChannels can, therefore, be used to connect goroutines together\
    \ in a “pipeline”, in which an item sent from one goroutine is the item received\
    \ by another goroutine. Each goroutine in the pipeline will wait until the channel\
    \ has been “drained” before sending the next item along the pipeline.\n\nBy default,\
    \ channels can both send and receive, but when you pass a channel to a goroutine\
    \ you can specify in the function parameter whether the channel may only send\
    \ items, or only receive items. A send-only channel is specified in the parameter\
    \ by prefixing the chan keyword with the <- arrow operator, like this:\n\n```go\n\
    func funcName (paramName) <-chan dataType\n```\n\nConversely, a receive-only channel\
    \ is specified in the parameter by suffixing the chan keyword with the <- arrow\
    \ operator, like this:\n\n```go\nfunc funcName (paramName chan<- dataType) \n\
    ```\n\nSpecifying a single permissible direction is recommended to reduce the\
    \ possibility of bugs in your programs.\n\n- Begin a main function by creating\
    \ two unbuffered channels for integer items\n```go\nnums := make(chan int)\nsqs\
    \ := make(chan int)\n```\n\nsrc\\synchronize\\main.go\n\nNext, add a goroutine\
    \ call that passes one channel, which will begin a pipeline\n```go\ngo count(nums)\n\
    ```\n\nNow, add a goroutine call that passes two channels, which will continue\
    \ the pipeline\n```go\ngo square(nums, sqs)\n```\n\nAfter the main function, add\
    \ the first called function, with a receiver-only channel to which it will send\
    \ 10 individual integers one-by-one when the pipeline is clear\n\n```go\nfunc\
    \ count(nums chan<- int) {\n    for i := 1; i <= 10; i++ {\n        nums <- i\n\
    \    }\n    close(nums)\n}\n```\n\nAdd the second called function with a send-only\
    \ channel, and a receive-only channel to which it will send 10 individual results\
    \ one-by-one when the pipeline is clear\n\n```go\nfunc square(nums chan int, sqrs\
    \ chan<- int) {\n    for i := 1; i <= 10; i++ {\n        num := <-nums\n     \
    \   sqrs <- num * num\n    }\n    close(sqrs)\n}\n```\n\nNow, back in the main\
    \ function, add a loop to receive the results at the end of the pipeline\n\n```go\n\
    for i := 1; i <= 10; i++ {\n    num := <-sqrs\n    fmt.Printf(\"%v x %v = %v\\\
    n\", i, i, num)\n}\n```\n\nSave the program file in a \"synchronize\" directory,\
    \ then run the program to see the pipeline results\n\nIf the sender knows no further\
    \ values will be sent to the receiving channel, it can safely close that channel.\n\
    \n# Use Worker Pools\n\nIf your program has a queue of tasks to perform where\
    \ the order in which the results are produced is not important, you can employ\
    \ a “worker pool” – using goroutines and channels.\n\nA worker pool lets you send\
    \ tasks from multiple calls to a goroutine that completes each task in a random\
    \ order determined by the Go scheduler. You can use a WaitGroup to wait for the\
    \ multiple goroutines to complete, or simply send results to drain the channel\
    \ and ensure that all goroutines have finished.\n\n- Begin by importing the Go\
    \ standard library package, to delay a worker goroutine\n```go\nimport (\n  \"\
    fmt\"\n  \"time\"\n)\n```\n\nsrc\\workers\\main.go\n\nNext, in the main function,\
    \ initialize totalJobs variable, and create two buffered channels of the total\
    \ size\n```go\nnumJobs := 10\njobs := make(chan int, numJobs)\nresults := make(chan\
    \ int, numJobs)\n```\n\nNow, add three worker goroutine calls that each pass an\
    \ ID and the two channels\n```go\ngo worker(1, jobs, results)\ngo worker(2, jobs,\
    \ results)\ngo worker(3, jobs, results)\n```\n\nSend an integer for each of 10\
    \ jobs, close that channel to indicate that all the jobs are in the queue\n```go\n\
    for i := 1; i <= numJobs; i++ {\n    jobs <- i\n}\n```\n\nAfter the main function,\
    \ add the worker function that accepts the worker ID, a receive-only channel from\
    \ which to receive the job numbers, and a send-only channel to which it will send\
    \ 10 results\n```go\nfunc worker(id int, jobs <-chan int, results chan<- int)\
    \ {\n    for job := range jobs {\n        fmt.Print(\"Worker \", id, \" ran Job\
    \ \", job)\n        fmt.Printf(\"%v %v\\n\", job, job)\n        time.Sleep(1 *\
    \ time.Second)\n        results <- job\n    }\n}\n```\n\nNow, back in the main\
    \ function, add a loop to collect the results and ensure that all the workers\
    \ have completed\n```go\nfor i := 1; i <= numJobs; i++ {\n    <-results\n}\nclose(results)\n\
    ```\n\nSave the program file in a “workers” directory, then run the program to\
    \ see the worker pool results\n\n```\nC:\\Users\\mike\\_go run workers\nworker\
    \ 3 ran Job 1 ...1 x 1 = 1\nworker 2 ran Job 3 ...3 x 3 = 9\nworker 1 ran Job\
    \ 2 ...2 x 2 = 4\nworker 1 ran Job 4 ...4 x 4 = 16\nworker 2 ran Job 6 ...6 x\
    \ 6 = 36\nworker 3 ran Job 5 ...5 x 5 = 25\nworker 1 ran Job 7 ...7 x 7 = 49\n\
    worker 2 ran Job 8 ...8 x 8 = 64\nworker 3 ran Job 9 ...9 x 9 = 81\nworker 2 ran\
    \ Job 10 ...10 x 10 = 100\nC:\\Users\\mike\\_go>\n```\n\nThe 1-second delay in\
    \ this example merely simulates the time taken to perform a more lengthy task.\n\
    \n“Worker Pools” are also known as “Thread Pools”. They can result in better performance\
    \ as they don’t need to create a new thread for each task.\n\n# Summary\n\n- Parallelism\
    \ when two tasks are performed simultaneously.\n- Concurrency is the separation\
    \ of program code into separate tasks that could potentially be performed simultaneously.\n\
    - Goroutines provide the ability for lines of code to be executed concurrently.\n\
    - A goroutine is created by inserting the go keyword before an ordinary function\
    \ call or method call.\n- The Go standard library sync package provides a WaitGroup\
    \ type that can wait for multiple goroutines to finish.\n- A WaitGroup has an\
    \ Add() incrementing method, a Done() decrementing method, and a Wait() blocking\
    \ method.\n- When passing a WaitGroup as an argument to a function, it must be\
    \ passed as a pointer.\n- A Go channel is like a pipe through which the program\
    \ can send and receive messages.\n- A channel is created by specifying the chan\
    \ keyword and a data type as arguments to the built-in make() function.\n- Deadlock\
    \ is a fatal error when the program cannot proceed.\n- The built-in close() function\
    \ can explicitly close a channel.\n"
