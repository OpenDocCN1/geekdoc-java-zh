    # Create the Go Workspace


    When you install Go, the installer sets a number of Go environment variables.
    For example, the directory (folder) location of the Go tools is stored in a GOROOT
    environment variable – by default, at C:\Go on a Windows PC, and at /usr/local/go
    on Linux and macOS.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_17_0.png)


    The installer also sets a GOPATH environment variable for the location of your
    workspace. By default, this is a directory named “go” within your home directory.
    For example, on a Windows PC its path is C:\Users\username\go, on Linux systems
    its path is /home/username/go, and on macOS it’s at /Users/username/go – but the
    installer doesn’t actually create any directories.


    To create the workspace, you can simply add a directory named “go” in your home
    directory. You must then add sub-directories named “bin”, “pkg” and “src” within
    the workspace – all your Programs can be created inside the “src” directory.


    It''s useful to have a shortcut on your desktop that will open a command-line
    in this sub-directory to easily run your programs.


    +   1. On a Windows PC, open a Command Prompt window, as described here, or open
    a Terminal window


    +   2. Enter the command go env GOPATH to see the current workspace location


    ```

    C:\WINDOWS\system32\cmd.exe

    C:\Users\mike\>go env GOPATH

    C:\Users\mike\_go

    ```'
