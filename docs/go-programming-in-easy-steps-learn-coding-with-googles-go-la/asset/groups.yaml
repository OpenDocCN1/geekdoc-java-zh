  - '[PAGE 166]


    # Loop Through Elements


    Loops and arrays are perfect partners. A loop can be used to fill each element
    in an empty array with a value, and can iterate through each element in an array
    to reference the stored values.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_166_0.png)


    A traditional incrementing for loop can set an initial counter variable value
    at zero, and place that variable within an array variable’s [] square brackets
    to represent the index number of each element as the loop proceeds.


    Go has a built-in len() function that accepts an array variable as its argument,
    and returns an integer that is the number of elements contained in the array.
    This can be used in a traditional for loop to exit the loop when it reaches the
