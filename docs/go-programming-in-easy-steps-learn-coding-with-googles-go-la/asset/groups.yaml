    ## Summary


    - Go programs are plain text files that get compiled into machine code to produce
    an executable binary version.

    - The Go tools allow you to build, run, and test programs written in the Go programming
    language.

    - The Go installation includes standard packages of useful, trusted code that
    you can import into programs.

    - The command-line go command displays a list of the Go tool commands.

    - The GOROOT environment variable stores the location on your system where the
    Go installation is located.

    - The GOPATH environment variable stores the location on your system where your
    Go workspace is located.

    - The Go workspace is a directory "go", containing sub-directories named "src",
    "bin", and "pkg".

    - The name of a Go package is that of the directory containing the Go source code
    files.

    - A Go package declaration specifies its type, and must be specified as package
    main to be compiled into an executable.

    - An import declaration quotes the name of any packages whose features are to
    be made available to the program.

    - A function declaration contains the func keyword followed by the function name,
    () parentheses, and {} curly brackets.

    - All Go programs must have a function named "main" as the entry point into the
    program.

    - The Go run command compiles and runs a program.

    - The Go build command compiles a program and produces an executable binary file
    that can be distributed.

    - The go fmt command should be used to correctly format the source code of a Go
    package.

    - VS Code offers features such as syntax highlighting, auto-indentation, bracket-matching,
    and code debugging.


    ## 2 Store Values


    This chapter demonstrates how to store, retrieve, and manipulate various types
    of data using variable containers in Go programs.


    - Create Program Variables

    - Display Variable Values

    - Convert Data Types

    - Fix Constant Values

    - Point to Stored Values

    - Summary


    ## Create Program Variables


    ![](img/fa565c410b0509c58bcab29ed0b49de9_36_0.png)


    A variable is a container in a Go program in which a data value can be stored
    inside the computer''s memory. The stored value can be referenced using the variable''s
    name and changed by assigning a new value. The programmer can choose any name
    for a variable providing it adheres to the naming convention rules listed below:


    | Naming Rule | Example |

    | :--- | :--- |

    | CANNOT be a Go keyword | default |

    | CANNOT contain arithmetic operators | a+b*c |

    | CANNOT contain punctuation characters | %$#! |

    | CANNOT contain any spaces | no spaces |

    | MUST start with a letter | msg |

    | CAN contain numbers | good1 |

    | CAN contain mixed case | camelCase |


    Variable names should be concise and always begin with a lowercase letter – unless
    the variable is to be accessible to other packages (more on this later). It is
    good practice to choose meaningful names for variables to make the program more
    easily understood. To create a variable in the program simply requires it to be
    “declared” using the `var` keyword. A variable declaration has this syntax:


    ```

    var variableNameDataType

    ```


    The `var` keyword is followed by a space then the chosen variable name, then the
    type of data this variable will be allowed to store. Typically, this will be one
    of the five data types described on the opposite page. Multiple variables of the
    same data type can be created in a single declaration as a comma-separated list,
    like this:


    ```

    var variableName1, variableName2, variableName3 dataType

    ```


    ![](img/fa565c410b0509c58bcab29ed0b49de9_37_0.png)


    Go keywords are listed in the table on the inner front cover of this book.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_37_1.png)


    Variable names are case-sensitive. The basic data types in Go are listed in the
    table below:


    | Data Type | Description | Example |

    | :--- | :--- | :--- |

    | string | A string of characters | "Hello!" |

    | int | An integer | 100 |

    | float64 | A floating-point number | 123.456 |

    | byte | A single byte | ''A'' |

    | bool | A boolean value | true |

    | p | A memory address | 0x22FF34 |

    | v | The value in default format | (any of above) |

    | T | The data type | int |


    A variable declaration has this syntax:

    ```

    var variableNameDataType

    ```


    The `var` keyword is followed by a space then the chosen variable name, then the
    type of data this variable will be allowed to store. Typically, this will be one
    of the five data types described on the opposite page. Multiple variables of the
    same data type can be created in a single declaration as a comma-separated list,
    like this:


    ```

    var variableName1, variableName2, variableName3 dataType

    ```


    A variable can also be declared and initialized at the same time without specifying
    the type. In this case, you use the `:=` operator which infers the type from the
    value:


    ```

    msg := "Hello World!"

    ```


    To change the value of a variable, use the assignment operator (`=`):


    ```go

    msg = "New value"

    ```


    Constants are values that cannot be changed after they are set. Use the `const`
    keyword to declare them:


    ```go

    const Pi = 3.14159

    ```


    To display the value of a variable, use the `fmt` package. The `Println()` and
    `Printf()` functions are commonly used:


    ```go

    fmt.Println(msg)

    fmt.Printf("Value: %d\n", num)

    ```


    The `Printf()` function uses "verbs" to format the output. Common verbs include:


    - `%s` for strings

    - `%d` for integers

    - `%f` for floating-point numbers

    - `%c` for characters

    - `%t` for booleans

    - `%p` for memory addresses

    - `%v` for the default format

    - `%T` for the type information


    You can also specify the width and padding of the output. For example, `%7d` will
    format an integer to occupy at least seven spaces, padding with spaces if necessary.


    ## Display Variable Values


    ![](img/fa565c410b0509c58bcab29ed0b49de9_39_0.png)


    The value of a variable can be displayed using the `fmt` package. The `Println()`
    and `Printf()` functions are commonly used:


    ```go

    fmt.Println(msg)

