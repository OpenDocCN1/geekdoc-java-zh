    # Summary


    +   - Multiple related items of data can be grouped together in a Go struct type.

    - { } curly brackets of a struct contain a list of name and type pairs that are
    fields defining what the struct will contain.

    - An instance of a struct can be created as a variable declared with the name
    of the struct as its type.

    - An individual field of a struct can be initialized by assigning a value to the
    struct

    - An instance of a struct can be created and initialized by assigning a struct
    literal to a variable name.

    - A function can be attached to a struct by adding a receiver, which specifies
    the struct name to the function signature.

    - A function attached to a struct is referred to as the method.

    - A method can be a value receiver, operating on a copy of the struct, or a pointer
    receiver operating on the original fields.

    - A struct can represent the attributes and behaviors of real-world objects by
    its field properties and attached methods.

    - A struct can be embedded inside another struct as an anonymous field, so its
    fields can be directly addressed.

    - The three cornerstones of object-oriented programming are encapsulation, inheritance,
    and polymorphism.

    - Encapsulation in Go relies upon data-hiding in packages where only capitalized
    items will be exported.

    - Inheritance in Go relies upon composition where embedded structs provide fields
    and methods to the embedding struct.

    - Polymorphism in Go relies upon its interface type, which only contains a list
    of method signatures.

