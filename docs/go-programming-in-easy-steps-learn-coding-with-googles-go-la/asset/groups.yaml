    Any individual element’s value can be referenced using the array name followed
    by square brackets containing the element numbers for each index. For example,
    the first element of the second index:


    ```

    arrayName[ 0 ] [1]

    ```


    +   Create an empty array of three elements that can each only contain string
    values

    ```

    var cars [ 3 ]string

    ```


    ![](img/fa565c410b0509c58bcab29ed0b49de9_164_0.png)


    +   Next, add statements to initialize each array element

    cars[0] = "BMW"

    cars[1] = "Ford"

    cars[2] = "Opel"


    +   Now, declare and initialize a two-dimensional array

    coords := [ 2 [ 3 ]int { 1, 2, 3 }, { 4, 5, 6 }


    +   Then, add statements to display output containing stored array values

    fmt.Println("Cars:", cars )

    fmt.Println("Second Car:", cars[1])

    fmt.Println("X1,Y1:", coords[0][0])

    fmt.Println("X2,Y3:", coords[1][2])


    ![](img/fa565c410b0509c58bcab29ed0b49de9_164_1.png)


