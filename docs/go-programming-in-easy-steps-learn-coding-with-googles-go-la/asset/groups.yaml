  - '[PAGE 11]


    three cornerstones of OOP.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_11_0.png)


    The Go gopher – the iconic mascot of the Go programming language.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_11_1.png)


    You can discover many more programming language books in the In Easy Steps series
    – including C, C++, C#, Java, and Python. Visit www.ineassteps.com to find out
    more.


    With so many programming languages to choose from, you may be wondering why you
    should choose to learn Go programming – so here are some of the advantages that
    Go offers:


    # Simple Syntax


    The Go language is concise, like Python. It''s as simple to write as Python but
    is more efficient, like C++. This enables you to write code that is easy to read
    and maintain.


    # Compiled Language


    The Go source code is compiled to binary machine code that can be read directly
    by the computer, instead of being interpreted every time a program runs. This
    enables the Go programs you write to run faster than programs written for interpreted
    languages, like Python or PHP.


    # The Go Compiler


    The Go compiler is fast and provides additional benefits, such as code optimization
    and error checking – it can detect unused variables in your code,'
  - '[PAGE 12]


    missing imports that your code requires, and mistyped or invalid code. The Go
    compiler can also generate executable binaries for other operating systems. This
    enables you to compile your source code to run on multiple machines.


    # Concurrency


    The Go language provides inherent support for concurrency with goroutines and
    channels. This enables you to write multi-threaded programs that could perform
    multiple tasks at the same time.


    # Garbage Collection


    Automatic memory management is a key feature of the Go language. Its garbage collector
    runs concurrently with the program. This enables you to write program code without
    any concern for memory leakage.


    # Static Typing


    Go is a statically typed language in which variables are explicitly declared to
    be of a particular fixed type. This enables errors to be caught early in the development
    process.


    You may well recognize other advantages as you gain experience with the Go language,
    but right now it''s to time to get started...'
