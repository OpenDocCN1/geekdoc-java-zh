    An array index is zero-based, so the final fifth element here is index number\
    \ 4.\n\nGo provides a couple of special features that you can use with arrays.\
    \ Firstly, when declaring an array variable with an array literal, you can use\
    \ the ... wildcard operator to set the number of elements equal to the number\
