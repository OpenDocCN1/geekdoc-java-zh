    \n# Loop Several Times\n\nA loop is a piece of code in a program that automatically\
    \ repeats. One complete execution of all statements within a loop is called an\
    \ “iteration”, or a “pass”. The length of a loop is controlled by a conditional\
    \ test made within the loop. While the tested expression is found to be true,\
    \ the loop will continue – until the tested expression is found to be false, at\
    \ which point the loop ends.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_86_0.png)\n\
    \nIn Go programming, there are several ways to construct a loop but they all use\
    \ the for keyword. The most common type of loop statement begins with three components\
    \ – an initializer, a single test expression, and an incrementer, with this syntax:\n\
    \n```\nfor initializer ; test-expression ; incrementer {\n  statements-to-executed\n\
    }\n```\n\nThe initializer is used to set a starting value for a counter for the\
    \ number of iterations to be made by the loop. An variable is used for this purpose\
    \ and is traditionally named “i”.\n\nUpon each iteration of the loop, the test-expression\
    \ is evaluated, and that iteration will only continue while this expression is\
    \ true. When the expression becomes false, the loop ends immediately without executing\
    \ the statements again. With every iteration the counter is incremented then the\
    \ statements are executed.\n\nLoops can be nested, one within another, to allow\
    \ complete execution of all iterations of an inner nested loop on each iteration\
    \ of the outer loop. A second integer variable is used to count the iterations\
    \ of the inner loop, and is traditionally named “j”. Should that inner loop also\
    \ contain a nested loop, its counter is traditionally named “k”, and the syntax\
    \ looks like this:\n\n```\nfor initializer ; test-expression ; incrementer {\n\
    \    statements-to-executed\n    for initializer ; test-expression ; incrementer\
    \ {\n        statements-to-executed\n        for initializer ; test-expression\
    \ ; incrementer {\n            statements-to-executed\n        }\n    }\n}\n```\n\
    \n\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_87_0.png)\n\nNesting loops beyond\
    \ three levels is uncommon and is probably best avoided.\n\n-   Begin a main function\
