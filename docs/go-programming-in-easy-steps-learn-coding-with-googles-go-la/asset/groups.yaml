    # Slice Arrays


    Arrays are sequences whose elements each contain data of the same type, but are
    of a fixed length so are not very versatile. Fortunately, Go provides a slice
    type that represents an underlying array and whose length can be changed.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_169_0.png)


    To understand the slice type it is important to recognize that a slice does not
    contain any elements itself, but is merely a reference to an actual array. The
    slice type contains only three components:


    +   - Ptr (pointer) a pointer to the first element in the array accessible by
    the slice (not necessarily the first array element).

    - Len (length) the total number of elements in the slice.

    - Cap (capacity) the number of elements between the element referenced by the
    pointer and the last array element.


    For example, a slice of weekdays from an array of day names:


    | Ptr = 0 | Len = 5 | Cap = 7 |

    |---|---|---|

    | Length |

    | Array days | Mon Tue Wed Thu Fri Sat Sun |

    | Capacity |


    A slice can be created in Go programming by assigning an array to a variable that
    specifies element index numbers of a desired lower and upper boundary. These are
    specified around a : colon character between [] square brackets. The number to
    the left of the colon specifies the index number of the starting element to slice
    – which the slice pointer will reference. The number to the'
  - '[PAGE 170]


    right of the colon specifies the index number of the upper boundary – to slice
    all elements up to, but not including, the upper boundary element. An assignment
    for the example depicted above would look like this:


    weekdays := days[0 : 5]


    Optionally, you can omit either of the numbers that specify the upper and lower
    boundaries to use the default values. The default value for the lower boundary
    is 0 (zero) and the default value for the upper boundary is the total number of
    elements in the array.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_170_0.png)


    Slices are important in Go programming and are seen much more frequently than
    the array type, but it''s important to understand that they are references to
    underlying arrays.


    You can reveal the length of a slice using the built-in len() function, as arrays,
    but you can also check the capacity of a slice using a built-in cap() function.
    Comparing the pointer value of a slice with the memory address of the array element
    to it points, confirms that the slice is indeed a pointer reference.


