    # Summary


    +   - A function block contains a group of statements that get executed whenever
    that function is called.


    +   - A function can be declared using the func keyword followed by a name that
    adheres to the Go naming conventions.


    +   - A function declaration contains {} parentheses, followed by {} curly brackets
    to surround the statements to be executed.


    +   - The parentheses in a function declaration may contain a parameters list
    that specifies the type of each parameter.


    +   - Arguments passed to a function are, by default, passed by value – a copy
    of the original value.


    +   - Pointer arguments passed to a function are a reference to a memory address
    that is the location of the original value.


    +   - The return keyword allows one, or more, values to be returned to the caller
    after a function has executed its statements.


    +   - If a function returns values to the caller, each return type must be listed
    after the parameter list in the function declaration.


    +   - A function can call itself recursively to emulate a loop structure, but
    must test a condition to exit at some point.


    +   - Go supports first class classes that can be assigned to variables, passed
    as arguments, and returned from functions.


    +   - An anonymous function has no name and can be made self-invoking by appending
    the () operator after the block.


    +   - A closure is a function nested an outer function that retains access to
    variables declared in the outer function.


    +   - The type keyword followed by a name and function signature can be used to
    create a custom function type.


    +   - Passing functions to other functions allows actions to be modified without
    repeating existing lines of code.'
- md: "\n- Go programming allows you to handle errors that arise in functions by returning\
    \ separate values.\n- Only imported functions and variables whose names begin\
    \ with a capital letter will be accessible to the importing file.\n\n# 6\n\n#\
    \ Build Structures\n\n*This chapter demonstrates how data and functions can be\
    \ contained in a \"struct\" that can represent object-oriented programming in\
    \ the Go language.*\n\n- Group Data\n- Attach Methods\n- Embed Structs\n- Encapsulate\
    \ Features\n- Compose Elements\n- Satisfy Interfaces\n- Embed Interfaces\n- Summary\n\
    \n## Group Data\n\nMultiple related items of any data type can be grouped together\
    \ in a Go language \"struct\" (structure) type. This is useful to create records,\
    \ similar to those you might find in a database.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_134_0.png)\n\
    \nA struct is created using the type keyword, followed by a name of your choice,\
    \ and the struct followed by { } curly brackets. The curly brackets contain a\
    \ list of variable name and data type pairs on individual lines. These are known\
    \ as the \"fields\" of the struct and define what the struct will contain, with\
    \ this syntax:\n\n```\ntype structName struct {\n    fieldName dataType\n    fieldName\
    \ dataType\n}\n```\n\nHaving defined a struct type, instances of the struct can\
    \ be created as variables declared with the name of the struct as their type:\n\
    \n```go\nvar instanceName structName\n```\n\nIndividual fields of a struct are\
    \ addressed by appending the field name to the struct name using dot-suffixing.\
    \ Data can be assigned to individual fields of the struct instance in several\
    \ ways. Firstly, you can assign values to individual fields, like this:\n\n```\n\
    instanceName.fieldName = value\ninstanceName.fieldName = value\n```\n\nAlternatively,\
    \ you can initialize all fields in a single statement that assigns a \"struct\
    \ literal\" to an instance, like this:\n\n```\ninstanceName = structName{value,\
    \ value}\n```\n\nUsing this technique requires the values to be listed in the\
    \ same order as the fields in the struct, but you can include field names in the\
    \ struct so the values may appear in any order, like this:\n\n```\ninstanceName\
    \ = structName{fieldName: value, fieldName: value}\n```\n\nAdditionally, you can\
    \ create a struct instance and initialize all its fields in a single statement\
    \ that assigns a \"struct literal\" to a variable, like:\n\n```go\ninstanceName\
    \ := structName{fieldName: value, fieldName: value}\n```\n\nEmpty fields in a\
    \ struct get a zero value by default.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_135_0.png)\n\
    \nYou can think of a struct as a template whose instances are copies that can\
    \ hold actual data.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_135_1.png)\n\n\
    Although these two statements are similar, notice that the := operator is used\
    \ only when creating an instance and initializing the struct fields in a single\
    \ statement.\n\nStart a program by creating a struct type\n\n```go\ntype employee\
    \ struct {\n  id int\n  name string\n  dept string\n}\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_136_0.png)\n\
    \nsrc\\group\\main.go\n\nNext, begin the main function by creating an instance\
    \ of the struct type\n\n```go\nvar coder employee\n```\n\nNow, assign values to\
    \ each field of the struct instance\n\n```go\ncoder.id = 1\ncoder.name = \"Alice\"\
    \ncoder.dept = \"IT\"\n```\n\nCreate a second instance of the struct, which initializes\
    \ each field of the struct using a struct literal and field names\n\n```go\nclerk\
    \ := employee{name: \"Burt\", dept: \"Payroll\", id: 2}\n```\n\nAdd statements\
    \ to display all values in each struct\n\n```go\nfmt.Println(coder)\nfmt.Println(clerk)\n\
    ```\n\nFinally, add statements to display individual field values in a string\n\
    \n```go\nfmt.Printf(\"%v works in %v\\n\", coder.name, coder.dept)\nfmt.Printf(\"\
    %v works in %v\\n\", clerk.name, clerk.dept)\n```\n\nSave the program file in\
    \ a \"group\" directory, then run the program to see the struct values\n\n```\n\
    Go Terminal\nC:\\Users\\mike_go\\src> run group\nAlice works in IT\nBurt works\
    \ in Payroll\nC:\\Users\\mike_go\\src>\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_137_0.png)\n\
    \nNote that the statement in Step 4 does not assign field values in the same order\
    \ the fields are listed in the struct, but using field names ensures that values\
    \ get assigned to the correct field.\n\n## Attach Methods\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_138_0.png)\n\
    \nIn Go programming, functions can be attached to structs by adding a \"receiver\"\
    \ to the function signature, which specifies a parameter name and the struct name\
    \ as its type:\n\n```go\nfunc (paramName structName) funcName()\n```\n\nA function\
    \ that is attached to a struct is referred to as a \"method\" of that struct.\
    \ The method can be specified as a value receiver, which operates on a copy of\
    \ the struct, or as a pointer receiver that operates on the original struct fields:\n\
    \n```go\nfunc (paramName *structName) funcName()\n```\n\nThis ability enables\
    \ structs to represent real-world objects that have attributes and behaviors:\n\
    \n- Attributes describe the features that an object has.\n- Behaviors describe\
    \ actions that an object can perform.\n\nFor example, a car might be described\
    \ with attributes of \"blue\" and \"coupe\", along with an \"accelerate\" behavior.\n\
    \nThese features could be represented in Go programming with a car struct containing\
    \ field properties of color and body, along with an attached accelerate() method.\n\
    \nObjects are created in Go programming by defining a struct as a template from\
    \ different copies, or \"instances\", can be made.\n\nEach instance of the struct\
    \ can be customized by assigning attribute values and behaviors to describe that\
    \ object. Unlike some other programming languages, Go does not have classes, but\
    \ can represent objects using structs instead.\n\n1 Start a program by creating\
    \ a struct type\n\n```go\ntype car struct {\n  color string\n  body string\n}\n\
    ```\n\nsrc\\method\\main.go\n\n2 Next, attach a method to the struct type\n\n\
    ```go\nfunc (c car) accelerate() string {\n  return \"accelerating--->\"\n}\n\
    ```\n\n3 Now, begin the main function by creating two instances of the struct\
    \ type\n\n```go\nporsche := car{color: \"blue\", body: \"coupe\"}\nbentley :=\
    \ car{color: \"green\", body: \"saloon\"}\n```\n\n4 Add statements to display\
    \ all values in each struct\n\n```go\nfmt.Println(porsche)\nfmt.Println(bentley)\n\
    ```\n\n5 Finally, add statements to display individual field values\n\n```go\n\
    fmt.Println(porsche.color)\nfmt.Println(bentley.color)\n```\n\n6 Save the program\
    \ file in \"method\" directory, then run the program to see the struct values\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_140_0.png)\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_140_1.png)\n\
    \nWhen you call a method, Go automatically handles the conversion between values\
    \ and pointers, so the receiver here could be *car if you wanted to modify the\
    \ original fields.\n\n## Embed Structs\n\nAs a struct field is declared simply\
    \ with a name and type, and a struct is a type, Go programming allows you to embed\
    \ one struct within another by declaring a field to be of struct type.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_141_0.png)\n\
    \n```\ntype Name struct{\n    embeddedStructName\n}\n```\n\nThis is useful to\
    \ build structures that efficiently use structs whose purpose can be varied. For\
    \ example, take a struct that simply stores X and Y coordinates:\n\n```go\ntype\
    \ coords struct {\n    x, y int\n}\n```\n\nThis might be used to store a location\
    \ on a chart, the corner point of a rectangle, or perhaps the center point in\
    \ a circle when embedded in another struct, like this:\n\n```go\ntype circle struct\
    \ {\n    radius int\n    center coords\n}\n```\n\nNow, when an instance of the\
    \ circle is created, the fields of the embedded struct can be addressed by chaining\
    \ together the struct names and field names, like this:\n\n# instanceName.embeddedStructName.fieldName\n\
    instanceName.embeddedStructName.fieldName\n\nThis is acceptable, but not very\
    \ convenient as it's quite lengthy. Fortunately, Go provides a solution to this\
    \ problem by supporting \"anonymous fields\" in structs. These are simply fields\
    \ that specify the name of another struct as a field, without stating a field\
    \ name:\n\n```go\ntype circle struct {\n  radius int\n  coords\n}\n```\n\nThe\
    \ advantage of this is that it allows you to shorten the code required to address\
    \ the fields of an embedded struct:\n\n# instanceName.fieldName\ninstanceName.fieldName\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_142_0.png)\n\nAn anonymous field must\
    \ be of a named type, or be a pointer to a named type.\n\n1 Start a program by\
    \ creating two struct types\n\n```go\n   type coords struct {\n    x, y int\n\
    \   }\n\n   type circle struct {\n    radius int\n    coords\n   }\n```\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_142_1.png)\n"
  mdcn: "\n\n- Go 语言允许你通过返回多个值来处理函数中出现的错误。\n- 只有首字母大写的已导入函数和变量才能被导入的文件访问。\n\n# 6\n\
    \n# 构建结构\n\n*本章将演示如何将数据和函数包含在“struct”（结构体）中，可以在 Go 中表示面向对象的编程。*\n\n- 分组数据\n- 附加方法\n\
    - 嵌套结构体\n- 封装特性\n- 组合元素\n- 实现接口\n- 嵌入接口\n- 总结\n\n## 分组数据\n\n任何数据类型的多个相关项都可以组合在\
    \ Go 语言的“struct”结构类型中。这对于创建类似于你在数据库中找到的记录非常有用。\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_134_0.png)\n\
    \n使用 `type` 关键字创建结构，后面跟上你选择的名称，然后是结构和 `{ }` 大括号。大括号包含每行一个变量名和数据类型对。这些被称为结构体的“字段”（fields），定义了结构将包含的内容，语法如下：\n\
    \n```\ntype structName struct {\n    fieldName dataType\n    fieldName dataType\n\
    }\n```\n\n定义结构体类型后，可以使用以结构名称作为类型声明的变量来创建结构体实例：\n\n```go\nvar instanceName structName\n\
