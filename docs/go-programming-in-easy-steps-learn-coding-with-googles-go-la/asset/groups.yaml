    \ | switch |\n| const | fallthrough | if | range | type |\n| continue | | import\
    \ | return | var |\n\n| Component Syntax |\n|---|---|\n| Variable (Inferred) |\
    \ `var variableName dataType = value` <br> `variableName := value` |\n| Constant\
    \ | `const constantName = value` |\n| Array | `var arrayName []dataType` |\n|\
    \ Slice | `sliceName := make([]dataType, nElements)` |\n| Map | `mapName := make(map\
    \ dataType, value dataType)` |\n| Channel | `channelName := make(chan dataType)`\
