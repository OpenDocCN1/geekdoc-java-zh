    ![](img/fa565c410b0509c58bcab29ed0b49de9_56_0.png)


    The arithmetic operators commonly used in Go programs are listed in the table
    below, together with the operation they perform:


    | Operator | Operation |

    | --- | --- |

    | + | Addition |

    | - | Subtraction |

    | * | Multiplication |

    | / | Division |

