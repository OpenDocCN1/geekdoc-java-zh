  md: "# Group Data\n\nMultiple related items of any data type can be grouped together\
    \ in a Go language \"struct\" (structure) type. This is useful to create records,\
    \ similar to those you might find in a database.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_134_0.png)\n\
    \nA struct is created using the type keyword, followed by a name of your choice,\
    \ and the struct followed by { } curly brackets. The curly brackets contain a\
    \ list of variable name and data type pairs on individual lines. These are known\
    \ as the \"fields\" of the struct and define what the struct will contain, with\
    \ this syntax:\n\n```\ntype structName struct {\n    fieldName dataType\n    fieldName\
    \ dataType\n}\n```\n\nHaving defined a struct type, instances of the struct can\
    \ be created as variables declared with the name of the struct as their type:\n\
    \n```\nvar instanceName structName\n```\n\nIndividual fields of a struct are addressed\
    \ by appending the field name to the struct name using dot-suffixing. Data can\
    \ be assigned to individual fields of the struct instance in several ways. Firstly,\
    \ you can assign values to individual fields, like this:\n\n```\ninstanceName.fieldName\
    \ = value\ninstanceName.fieldName = value\n```"
