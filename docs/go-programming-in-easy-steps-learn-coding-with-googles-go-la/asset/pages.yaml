  md: '# Use Temporary Files


    It is sometimes useful to create a temporary file on the user''s system in which
    to store data during the execution of a Go program. The Go standard library io
    package has the ioutil package containing a TempFile() function for this purpose.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_251_0.png)


    The TempFile() function returns an os.File type, and an error message or nil if
    the file gets created. This function requires two arguments to specify the directory
    in which to create the file and a filename pattern. You can specify the directory
    as a path, or as an “” empty string if you are happy to create the temporary file
    in the system''s default directory for temporary files. You specify the file name
    pattern simply as a name to which a generated random string will be appended.
    If the pattern includes a * wildcard character, the generated string will replace
    that character.


    When the TempFile() function successfully creates a temporary file, it automatically
    opens that file to read and write. The returned file type has a Name() method
    with which to reference its path, including the pattern and random string file
    name. You can employ its Write() and WriteString() methods to add text content,
    and use its Close() method when processing is complete. As with other files, the
    temporary file''s content can be read using the ioutil.ReadFile() function.


    You can delete a temporary file when it is no longer required by specifying its
    name as the argument to the os.Remove() function. You can also examine the temporary
    file (and other files) by specifying a file name as the argument to the os.Stat()
    function. This returns an info type, plus an error message or nil.


