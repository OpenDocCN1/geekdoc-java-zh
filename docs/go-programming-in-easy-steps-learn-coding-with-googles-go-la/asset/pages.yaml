    | Keywords | | | |

    |---|---|---|---||

    | break | default | func | interface | select |

    | case | defer | go | map | struct |

    | chan | else | goto | package | switch |

    | const | fallthrough | if | range | type |

    | continue | | import | return | var |


    | Component Syntax |

    |---|---|

    | Variable (Inferred) | var variableName dataType = value

    variableName := value |

    | Constant | const constantName = value |

    | Array | var arrayName []dataType |

    | Slice | sliceName := make([]dataType, nElements) |

    | Map | mapName := make(map dataType, value dataType) |

    | Channel | channelName := make(chan dataType) |

    | Struct | type struct struct {

    field dataType

    }|

    | Function | func functionName(paramName dataType) return dataType {

    return returnValue

    }|

    | Interface | type interfaceName interface {

    methodName return dataType

    }|'
