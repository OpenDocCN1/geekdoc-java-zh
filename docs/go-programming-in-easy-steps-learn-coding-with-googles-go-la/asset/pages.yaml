  md: "Alternatively, you can initialize all fields in a single statement that assigns\
    \ a “struct literal” to an instance, like this:\n\n```\ninstanceName = structName\
    \ { value, value }\n```\n\nUsing this technique requires the values to be listed\
    \ in the same order as the fields in the struct, but you can include field names\
    \ in the struct literal so the values may appear in any order, like this:\n\n\
    ```\ninstanceName = structName { fieldName : value, fieldName : value }\n```\n\
    \nAdditionally, you can create a struct instance and initialize all its fields\
    \ in a single statement that assigns a “struct literal” to a variable, like this:\n\
    \n```\ninstanceName := structName { fieldName : value, fieldName : value }\n```\n\
