  md: "# Closures\n\nPerhaps the most useful purpose of anonymous functions is for\
    \ the creation of “closures”. A closure is a function nested inside an outer function\
    \ that retains access to variables declared in the outer function. The outer function\
    \ can return an anonymous function that retains access to the variables but, crucially,\
    \ the variables are not accessible from anywhere else in the program code. This\
    \ is a form of encapsulation that protects the data stored in variables as the\
    \ returned anonymous function “closes” over them.\n\nThe closure can be made self-invoking\
    \ for assignment to a variable by appending the () call operator after the end\
    \ of the outer function definition. The anonymous inner function can then be called\
    \ by appending the () call operator after the variable name – and can access the\
    \ persistent value in the outer function.\n\nIt can be difficult to grasp the\
    \ concept of closures, as it would seem that the variable in the outer function\
    \ should be destroyed when the self-invoking function has completed execution.\n\
    \n![](img/fa565c410b0509c58bcab29ed0b49de9_119_0.png)\n\nDon't worry if you can't\
    \ immediately understand how closures work. They can seem mystical at first, but\
    \ will become clearer with experience. You can continue on and come back to this\
    \ technique later.\n\n+   Begin a main function by assigning an anonymous function\
    \ to a variable\n\n```\nfunc main() {\n\tarearea := func(length, width int) int\
    \ {\n\t\treturn length * width\n}\n}\n```"
