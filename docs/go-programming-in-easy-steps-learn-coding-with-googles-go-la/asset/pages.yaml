  md: '# Summary


    +   The Go standard library time package contains functions to create Time data
    types comprising date, time, and zone fields.


    +   A Time data type is not a string, but can be converted to a string using its
    String().


    +   The time.Now() function returns the current date, time, and zone from the
    system time at the current locale.


    +   Date components can be extracted from a Time data type using its Year(), Month(),
    Day(), and Weekday() methods.


    +   The Date(), ISOWeek(), and YearDay() methods return date values that can be
    easily assigned to variables.


    +   Time components can be extracted from a Time data type using Hour(), Minute(),
    Second(), and Nanosecond() methods.


    +   The Clock(), Unix(), and UnixNano() methods return time values that can be
    easily assigned to variables.


    +   The Format() method takes a layout string or predefined constant as its argument
    to format dates and times.


    +   The Go reference string for date/time layouts is Mon Jan 2 15:04:05 2006 MST


