  md: '# Make Channels


    Goroutines allow code to be executed concurrently in an independent

    manner, but you can enable goroutines to communicate with each other by

    the use of "channels".


    ![](img/fa565c410b0509c58bcab29ed0b49de9_264_0.png)


    A Go channel is like a pipe through which you can send a message or receive

    a message. It is important to recognize that the sending and receiving actions

    are "blocking" operations – when sending a message, the channel will wait

    until the receiver is ready to accept the message, and when receiving a

    message, the channel will wait until the sender actually delivers the message.


    Channels are created by specifying the chan keyword and a data type as

    arguments to the built-in make() function, like this:


    ```

    channelName := make(chan dataType)

    ```


    You can send a value to the channel using an <- arrow operator to direct a

    value into the channel, with this syntax:


    ```

    channelName <- message

    ```


    Conversely, you can receive a value from a channel using the <- arrow

    operator to direct a value into a variable, with this syntax:


    ```

    variableName <- channelName

    ```


    It is important to ensure that a receiver is not waiting for a message that

    will never arrive. This would cause a fatal error called "deadlock" – where

    the program can never proceed. To avoid this situation, the sender can

    sspecify the channel name as an argument to a built-in close() function to

    explicitly close the channel when it will not send any more messages.'
