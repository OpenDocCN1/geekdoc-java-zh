  md: '# Write Files


    The Go standard library io package contains an ioutil (input/ output utility)
    package that provides functions to write text files. You make this available to
    your program by importing io/ioutil.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_247_0.png)


    The ioutil package''s WriteFile() function takes three arguments to specify the
    path to the file to be written, a byte slice of text characters to be written,
    and the numerical file permissions of that file. This function returns an error
    message if the attempt to write file fails, or an error value of nil if the file
    gets successfully written.


    For finer control when writing text files, you can use the os package''s OpenFile()
    function. This requires three arguments to specify the path of the file to be
    written, a flag specifying the operation type, and the numerical file permissions
    of that file. The flags specifying the operation type are os package constants.
    For example: os.O_RDWR to read and write, os.O_APPEND to append text, or os.O_CREATE
    to create a new file if none exists.


    The OpenFile() function returns an os.File type and any read error. The file type
    has Write() and Close() methods that allow you to process the text file''s content.


    The Write() method returns a byte slice containing the text to be written. This
    method returns the number of bytes read and any read error.


    The Close() method can be called with the defer keyword immediately after opening
    a file, to close the file at the end of the enclosing function after the file
    operations complete.


