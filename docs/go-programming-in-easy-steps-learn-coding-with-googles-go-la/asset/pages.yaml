  md: '# # Run a Go Program


    Go program code is compiled and executed using the Go tools. During program development,
    an error-free Go program can be compiled and run by the **go run** tool. This
    is useful, but if you want to create an executable binary version that can be
    executed repeatedly and distributed, you can use the **go build** tool.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_25_0.png)


    +   1. Open a Command Prompt or Terminal window in your Go “src” folder


    +   2. Enter the command **go run hello** to run the program [here](# – it should
    output the greeting


    ```

    Go Terminal

    :\Users\mike_go\src>go run hello

    Hello world!

    C:\Users\mike_go\src>

    ```


    +   3. Next, enter the command **go build hello** to make an executable binary
    version of the program [here](#) – it should add an executable file in your “src”
    folder


    +   4. Now, twice enter the command **hello** on Windows, or ./hello** on Linux
    or macOS – it should output the traditional greeting two times'
