  md: '# Create a Basic Array


    An array is a variable that can store multiple items of data – unlike a regular
    variable, which can only store one piece of data. The pieces of data are stored
    sequentially in array “elements” that are numbered, starting at zero. So, the
    first value is stored in element zero, the second value is stored in element one,
    and so on.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_162_0.png)


    An empty array can be declared using the var keyword followed by a name of your
    choice, followed by [] square brackets surrounding an integer specifying the number
    of required elements. These must then be followed by the data type the elements
    can contain. The syntax of the declaration looks like this:


    ```

    var arrayName [ nElements ] dataType

    ```


    Values can then be individually assigned to each available element by stating
    the element number in square brackets:


    ```

    arrayName [ elementNumber ] = value

    ```


    Alternatively, an array can be declared and initialized with values by stating
    values for each element in an “array literal” – a comma-separated list, grouped
    within braces:


    ```

    arrayName := [ nElements ] dataType { value, value, value }

    ```


    Any individual element’s value can be referenced using the array name followed
    by square brackets containing the element number. For example, to reference the
    value within the first element:


    ```

    arrayName [ 0 ]

    ```'
