    Previous examples in this book have used the obligatory main() function and functions
    contained in the Go standard library, such as the fmt.Println() function in the
    “fmt” package. However, most Go programs contain a number of custom functions,
    which can be called as required during the execution of the program.


    ![](img/fa565c410b0509c58bcab29ed0b49de9_102_0.png)


    A function block simply contains a group of statements that get executed whenever
    that function is called. Once the function statements have been executed, program
    flow resumes at the point directly following the function call. This modularity
    is very useful in Go programming to isolate set sequences of code that can be
    called repeatedly as required.


    To add a custom function into a Go program it must be declared using the func
    keyword, followed by a name of your choice – adhering to the same naming conventions
    used for variable names.


    | Naming Rule | Example |

    | --- | --- |

    | CANNOT be a Go keyword | default |

    | CANNOT contain arithmetic operators | a+b*c |

    | CANNOT contain punctuation characters | %$@! |

    | CANNOT contain any spaces | no spaces |

    | MUST start with a letter | msg |

    | CAN contain numbers elsewhere | good1 |

    | CAN contain mixed case | camelCase |


    When choosing a function name it should describe the purpose of the function but
    be concise. The function name is followed by () parentheses and an { opening curly
    bracket, all on the same line. This line is often referred to'
