  md: "# Format and Comment Code\n\nIt is good practice to always ensure your Go source\
    \ code is properly formatted by the go fmt tool before running a program.\n\n\
    ![](img/fa565c410b0509c58bcab29ed0b49de9_27_0.png)\n\nIt is also good practice\
    \ to include explanatory comments in your source code so it can be easily understood\
    \ by others, and by yourself when revisiting the code later. Single-line comments\
    \ can be added after a // character sequence – everything on the line after //\
    \ and character sequences – Multi-line comments can be added between /* and */\
    \ character sequences – this is useful to “comment-out” blocks of code, to hide\
    \ it from the compiler during development.\n\n+   1 Edit the code in hello.go\
    \ here to add a comment, and unnecessary tab spacing (bad formatting)\n\n```\n\
    main.go - Notepad\nFile Edit Format View [ ] [X]\n// My First Go Program: Output\
    \ a greeting.\n\npackage main\nimport\n\t\"fmt\"\nfunc main() {\n\tfmt.Println(\"\
    Hello World!\")\n}\n```\n\n+   2 Now, at a prompt, enter the command go fmt hello\
    \ then reopen the source code file to see correct formatting"
