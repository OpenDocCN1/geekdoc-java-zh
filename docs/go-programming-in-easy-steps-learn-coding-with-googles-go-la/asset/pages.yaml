  md: "# # Map Keys and Values\n\nMultiple items of data can be stored with associated\
    \ keys in a hash table, so that you can reference a stored value via its associated\
    \ key. In Go programming, this data structure is called a “map”, but other programming\
    \ languages call this an associative array or dictionary.\n\n![](img/fa565c410b0509c58bcab29ed0b49de9_178_0.png)\n\
    \nAll keys in a map must be unique and be of the same data type. All values in\
    \ a map must be of the same data type, but not necessarily be of the same data\
    \ type as the keys.\n\nA map can be created using the var and map keywords, and\
    \ by specifying the key and value data types using this syntax:\n\n```\nvar mapName\
    \ = map [ keyDataType ] valueDataType\n```\n\nIndividual key/value pairs can then\
    \ be assigned to the map, like this:\n\n```\nmapName [ “keyName” ] = value\n```\n\
    \nAlternatively, you can use the built-in make() function to create a map:\n\n\
    ```\nmapName := make( map keyDataType valueDataType )\n```\n\nFurthermore, you\
    \ can create and initialize a map by assigning a “map literal” with this syntax:\n\
    \n```\nmapName := map [ keyDataType ] valueDataType {\n    key : value, key :\
