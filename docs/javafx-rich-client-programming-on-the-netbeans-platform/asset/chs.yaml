  ### 创建能力模块\n让我们首先创建一个能力。由于能力被视为潜在的应用程序范围定义，我们将 `CalendarCapability` 放在一个模块（名为 `Capabilities`）中，并将其包设为公共。\n\
  1. 在 `FamilyTreeApp` 项目中选择 `Modules` 节点，右键点击并从上下文菜单中选择“New...”。NetBeans 显示新项目的“Name\
