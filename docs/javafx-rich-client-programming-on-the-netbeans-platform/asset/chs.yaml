  \ false;\n        }\n    }\n}\n```\n\n\n\n\n# 使用自定义验证器\n\n现在我们已经为第一个面板实现了使用 Validation\
  \ API 的验证，我们可以对第二个和第三个面板应用类似的更改。然而，在这种情况下，我们必须通过向导面板方法 `readSettings()` 为范围验证器设置最小值，因为这个最小值依赖于上一个面板的数字。\n\
  \n我们还必须能够在当用户点击“后退”按钮、更改上一个数字并返回第二个和第三个面板时，更改最小范围。\n\n内置验证器的通用模型使得它们是不可不可的。换句话说，一旦你设置了验证器的参数，就无法更改它们。虽然某些人可能认为这并不理想，但可变状态验证器要复杂得多。这些验证器简单（顾名如此）且易于使用。\n\
  \n解决不可变验证器限制的方案是创建一个自定义验证器。要实现这一点，需要实现 `Validator` 接口并重写 `validate()` 方法。通过自定义验证器，我们可以将验证委托给验证时创建的标准范围验证器，从而实现动态范围验证。\n\
  \n既然有了创建自定义验证器的充分理由，让我们现在就动手实现吧。Listing 12.14 显示了 `CustomRangeValidator`，这是一个允许你修改验证器最小和最大范围值的验证器。\n\
  \n两个 setter 方法配置了验证器的范围。在 `validate()` 方法中，我们创建了一个数字范围验证器（使用内置静态方法 `numberRange()`），并带有范围参数\
  \ `minVal` 和 `maxVal`。然后，我们使用新创建的委托验证器调用 `validate()`。\n\nListing 12.14 CustomRangeValidator\
  \ 点击此处查看代码图片\n\n```java\npublic class CustomRangeValidator implements Validator<String>\
  \ {\n    private Integer minVal = new Integer(0);\n    private Integer maxVal= new\
  \ Integer(0);\n\n    public void setMaxVal(Integer maxVal) {\n        this.maxVal\
  \ = maxVal;\n    }\n\n    public void setMinVal(Integer minVal) {\n        this.minVal\
  \ = minVal;\n    }\n\n    @Override\n    public boolean validate(Problems prblms,\
  \ String string, String t) {\n        Validator<String> rangeDelegate =\n      \
  \      Validators.numberRange(minVal, maxVal);\n        return rangeDelegate.validate(prblms,\
  \ string, t);\n    }\n}\n```\n\nListing 12.15 显示了视觉面板相应的更改。注意，我们为 `CustomRangeValidator`\
  \ 创建了一个新的类变量 `customrange`。公共方法 `setMinRange()` 配置了最小范围值。添加到 `ValidationGroup` 中的验证器列表是相同的，只是我们使用了自定义范围验证器而不是内置的范围验证器。\n\
  \n我们还定义了一个公共方法 `updateValidation()`，允许向导面板检查来自 `readSettings()` 的验证。这对于确保在通过“后退”按钮更改上一个面板的值时行为正确是必要的。\n\
