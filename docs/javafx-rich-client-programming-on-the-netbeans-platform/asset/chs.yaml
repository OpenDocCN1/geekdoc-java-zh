  \ `Person`并通过 `Update` 按钮保存更改。你可以取消任何窗口的停靠、调整大小或最大化，然后重新停靠。你可以使用顶层 `Window` 菜单打开或关闭任何窗口。此外，由于程序是模块化的并使用\
  \ `Lookup` API 来发现服务提供和模块间通信，该应用程序设计良好且松耦合。![](img/image3367.jpg)\n图 5.28 窗口未停靠（浮动）运行的\
  \ FamilyTreeApp\n\n## 再次观察 Lookup\n\n模块 `PersonViewer` 中的 `TreeSelectionListener`（第\
  \ [229] 页的[代码段 5.9]）与模块 `PersonEditor` 中的 `LookupListener`（第 [239] 页的[代码段 5.17]）之间的握手，是处理编辑选中的\
  \ `Person` 对象以及在用户选择根节点时清空表单用例的一种简单解决方案。然而，`PersonEditorTopComponent` 依赖于 `PersonViewerTopComponent`，在调用\
  \ `findTopComponent()` 方法时必须知道 `PersonViewerTopComponent` 的 `preferredID` 字符串。\n\
  \n## 跟踪全局选择\n\n一种更通用的解决方案允许我们跟踪 `Global Selection Lookup`，即当前拥有焦点的 `TopComponent`\
  \ 的 `Lookup`。当你在 `PersonViewer` 窗口中进行选择时，`PersonViewerTopComponent` 获得焦点，其 `Lookup`\
  \ 内容在 `Global Selection Lookup` 中可用。你通过以下方式访问该 `Lookup`：\n\n```java\nprivate Lookup.Result<Person>\
  \ lookupResult = null;\n\n// ... // 监听 Global Selection Lookup 中的 Person 对象\n\n\
  lookupResult = Utilities.actionsGlobalContext()\n            .lookupResult (Person.class);\n\
  \nlookupResult.addLookupListener(lookupListener);\n```\n\n现在，每当 `Person` 对象被添加到或从\
  \ `Global Selection Lookup` 中移除，`LookupListener` (`lookupListener`) 就会被调用。这消除了对\
  \ `PersonViewerTopComponent` 名称的依赖。\n\n这里只有一个问题。当用户点击 `PersonEditorTopComponent`\
  \ 的表单内部开始编辑时，表单会清空，因为 `Person` 对象不再位于 `Global Selection Lookup` 中。由于 `PersonEditorTopComponent`\
  \ 拥有焦点，它的（空的）`Lookup` 现在变成了 `Global Selection Lookup`。\n\n解决此问题的方法之一是在 `PersonEditorTopComponent`\
  \ 拥有焦点时忽略 `Global Selection Lookup`。以下是修改后的 `LookupListener`，如[代码段 5.18]所示。如[8 章]所述，`TopComponent`\
  \ 注册表跟踪应用程序的 `TopComponents`。注册表通过 `getActivated()` 方法返回拥有焦点的 `TopComponent`。如果拥有焦点的\
  \ `TopComponent` 是 `PersonEditorTopComponent`（即），则忽略结果的变化。\n\n代码段 5.18 忽略自身 TopComponent\
  \ 的 LookupListener\n\n```java\n// 用于检测 PersonViewer's Lookup 变化的 LookupListener\n\
  \nLookupListener lookupListener = (LookupEvent le) -> checkLookup(); \n\nprivate\
  \ void checkLookup() {\n    Collection<? extends Person> allPeople = lookupResult.allInstances();\n\
  \    // 确保拥有焦点的 TopComponent 不是这一个\n    TopComponent tc = TopComponent.getRegistry().getActivated();\n\
  \    if (tc != null && tc.equals(this)) {\n        logger.log(Level.FINER, \"PersonEditorTopComponent\
  \ has focus.\");\n        return;\n    }\n    if (!allPeople.isEmpty()) {\n    \
  \    thePerson = allPeople.iterator().next();\n        logger.log(Level.FINE, \"\
  {0} selected\", thePerson);\n        updateForm();\n    } else {\n        logger.log(Level.FINE,\
  \ \"No selection\");\n        clearForm();\n    }\n}\n```\n\n[代码段 5.19] 显示了修改后的\
  \ `componentOpened()` 代码，它现在使用更通用的 `Global Selection Lookup` 而不是 `PersonViewerTopComponent`\
  \ 的 `Lookup`。\n\n代码段 5.19 方法 componentOpened()\n\n```java\n@Override\npublic void\
  \ componentOpened() {\n    ftm = Lookup.getDefault().lookup(FamilyTreeManager.class);\n\
  \    if (ftm == null) {\n        logger.log(Level.SEVERE, \"Cannot get FamilyTreeManager\
  \ object\");\n        LifecycleManager.getDefault().exit();\n    }\n    configureListeners();\n\
  \    lookupResult = Utilities.actionsGlobalContext()\n                .lookupResult\
  \ (Person.class);\n    lookupResult.addLookupListener(lookupListener);\n    checkLookup();\n\
  }\n```\n\n\n\n我们刚刚触及了 `Lookup API` 的冰角。在接下来的章节中，你将看到如何结合全局选择查找（Global Selection\
  \ Lookup）与 `Nodes API` 一来处理对象选择。请关注！\n\n## 5.8 模块生命周期注解\n\n`Module System API` 允许你构建具有特定方法的类，这些方法会在应用程序启动和关闭时被调用。你使用\
  \ `@OnStart` 注解用于启动过程，使用 `@OnStop` 用于关闭过程。注意，这些 `Runnables` 是在后台线程中执行的。如果你需要执行 UI\
  \ 代码，必须处于 `EDT` 中。（示例请参见第 539 页的“自定义登录对话框””。）如果模块需要在 UI 初始化后调用代码，`Window System`\
  \ 包含了 `@OnShowing` 注解。（请参见第 374 页的“使用 @OnShowing”。）\n\n让我们通过将 `FamilyTreeManager`\
  \ 的数据初始化从 `TopComponent` 移动到这些在应用程序启动期间调用的特殊类之一，向你展示如何使用 `@OnStart`。我们将在模块 `FamilyTreeModel`\
  \ 自己的私有包中构建此启动代码，这样在添加或移除 `TopComponent` 模块时，就不必担心在哪里初始化测试数据。我们还将添加带有 `@OnStop`\
  \ 注解的关闭代码，向你展示如何自定义你的模块或应用程序的关闭过程。\n\n### 使用 @OnStart\n\n要在模块 `FamilyTreeModel`\
  \ 中安装启动代码，我们定义一个实现 `Runnable` 且带有 `@OnStart` 注解的类。系统会在启动期间尽可能的调用此类 `Runnable` 的\
  \ `run()` 方法。如果有多个模块拥有 `@OnStart` `Runnable`，系统将并行运行它们，以尽可能缩短应用程序的启动时间。以下步骤创建模块的\
  \ `@OnStart` `Runnable`。在这里，我们将 `@OnStart` `Runnable` 添加到私有包中的 `FamilyTreeModel`\
  \ 模块中。\n\n1. `@OnStart` 注解依赖于 `Module System API`，`Lookup` 需要 `Lookup API`，而 `LifecycleManager`\
  \ 需要 `Utilities API`。将所有这些依赖添加到 `FamilyTreeModel` 模块中。（选择 `Libraries` 节点，右键点击，并在从菜单中选择\
  \ `Add Module Dependency . . .`。在 `Add Module Dependencies` 对话框中，从模块列表中选择 `Lookup\
  \ API`、`Module System API` 和 `Utilities API`。点击 `OK`。）\n2. 在 `FamilyTreeModel` 项目的\
  \ `Source Packages` 节点中，右键点击包名，并在 `com.asgteach.familytree.model` 下添加一个名为 `data`\
  \ 的新包。\n3. 右键点击包 `data` 并选择 `New | Java Class . . .`。\n4. NetBeans 显示 `New Java\
  \ Class` 对话框。对于 `Class Name`，指定 `DataInstaller`（任何名称均可）并点击 `Finish`。NetBeans 将 `DataInstaller.java`\
  \ 添加到包 `com.asgteach.familytree.model.data` 中。\n5. 向 `DataInstaller.java` 添加以下代码以用测试数据初始化\
  \ `FamilyTreeManager`。`run()` 方法在启动期间被调用。Listing 5.20 显示了添加的代码。\n\nListing 5.20\
