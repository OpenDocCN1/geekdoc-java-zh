  \ `InstanceContent`。Listing 9.14 显示了这些更改。我们还重写了 `getActions()`，以便 `GenderNode` 上下菜单也包含\
  \ `Calendar` 操作。请注意，此 `CalendarCapability` 的实现是为 `GenderNode` 定制的。\n\n#### Listing\
