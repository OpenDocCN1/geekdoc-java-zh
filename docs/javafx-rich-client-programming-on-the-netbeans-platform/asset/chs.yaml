  \ private static final Logger logger = Logger.getLogger(\n                     \
  \                        DataRemover.class.getName());\n\n    @Override\n    public\
  \ void run() {\n        FamilyTreeManager ftm = Lookup.getDefault().lookup(\n  \
  \                                           FamilyTreeManager.class);\n        if\
  \ (ftm != null) {\n            ftm.getAllPeople().stream().forEach((p) -> {\n  \
  \              logger.log(Level.INFO, \"Removing {0}.\", p);\n                ftm.deletePerson(p);\n\
  \            });\n        }\n    }\n}\n```\n\n\n\n\n# 5.9 我们目前了解的\n\n我们构建的——也就是你构建的——应用程序在很多方面都做得很好。我们将应用程序的功能分为了松耦合的模块。我们的模型（`Person`\
  \ 和 `FamilyTreeManager`）位于其独立模块的公共包中。其他三个模块声明了对此 `FamilyTreeModel` 模块的依赖。此外，我们在单独模块中作为服务提供了\
  \ `FamilyTreeManager` 的实现。通过 `Lookups` 和服务提供者，我们可以在不更改客户端代码的情况下轻松提供备用实现。\n\n我们在独立的窗口中显示应用程序的产物：`PersonViewer`\
  \ 窗口显示 `Person` 对象的树形视图，`PersonEditor` 窗口为编辑 `Person` 数据提供 UI 控制。这两个模块之间没有直接依赖关系。这是模块化\
  \ NetBeans Platform 应用程序的一个良好示例。`TopComponents` 使用 NetBeans Platform 窗口系统，而 `Lookup`\
  \ 为服务提供者和模块间通信提供了松耦合的架构。\n\n但让我们批判性地审视一下目前完成的内容，至少是为了指出我们应用程序中某些（尚未）完全符合“NetBeans\
  \ Platform”做法方式的功能。我们还想提醒你，我们希望通过在本章及之前章节中所做工作的基础上，逐步引入 NetBeans Platform。\n\n以下是我们目前构建的应用程序尚未完成的简要总结：\n\
  \n*   `Update` 按钮没有使用 NetBeans Platform action 框架。虽然按钮事件处理器是迁移 Swing 程序的方便方法，但 NetBeans\
  \ Platform 应用程序使用顶层菜单栏、工具栏，可能还有右键上下文敏感菜单来执行保存 `Person` 数据等操作。我们在第 9 章中介绍 action\
  \ 框架。\n*   NetBeans Platform 包含一个用于显示层级数据的表示层：`Nodes` API。将你的模型数据封装在节点中可以让你为可选的可视对象添加不同的行为。重要的是，节点也拥有\
  \ `Lookup`。你已经学习了如何将对象添加到 `TopComponent` 的 `Lookup` 中。同样，你可以将对象添加到节点的 `Lookup` 中，包括允许你动态实现节点特定行为的能力。我们在第\
  \ 7 章中讨论了节点。\n*   `Explorer Views` 使用节点显示你的模型数据。NetBeans Platform 拥有多个可交换的 `Explorer\
  \ Views`，因为它们都与节点协同工作。我们同样在第 7 章中讨论了 `Explorer Views`。\n*   使用选择来“打开”`Person` 编辑并不是典型的用户体验。通过刻意的动作（例如双击、上下文菜单中的选择，或者菜单或工具栏中的选择）来打开目标更好。我们将在第\
  \ 9 章介绍 Action 框架时讨论这一常见用例。\n*   最后，在下一章中，我们将向你展示如何向窗口添加 JavaFX 内容，以利用该 UI 带来的改进。\n\
  \n## 5.10 关键点总结\n\n在本章中，你通过从第 2 章迁移 Swing 应用程序构建了你的第一个 NetBeans Platform 应用程序。在此过程中，你学习了\
  \ NetBeans Platform 的两个重要特性：模块化和 `Lookup`。\n\n以下是本章的要点：\n\n*   NetBeans Platform\
  \ 提供了一个包含 `Runtime Container` 和模块系统的执行环境。\n*   `Runtime Container` 负责加载应用程序中的模块和类，提供\
  \ `Main` 方法并执行你的应用程序。\n*   `Modules` 是 NetBeans Platform 的基本构建块。模块是一个带有相关类和元数据的\
  \ `JAR` 文件，元数据描述了模块的依赖和公共包。\n*   只有当代码位于公共包中，且模块专门声明对包含该公共包模块的依赖时，才能访问其他模块的代码。这强制了模块之间的松耦合并防止了意外依赖。`Runtime\
  \ Container` 强制执行声明的依赖。\n*   NetBeans Platform 应用程序包含默认模块，提供（其他特性）菜单和工具栏框架、窗口系统、模块系统以及模块间通信。\n\
  *   迁移 Swing 应用程序时，将每个主要的 UI 区域放在其自己的窗口和模块中。这仅是一条指南；让你的应用程序的 GUI 和逻辑决定如何模块化你的应用程序。\n\
  *   `TopComponents` 使用 NetBeans Platform 窗口系统的窗口。\n*   将服务接口放在公共包中，以便其他模块可以访问。\n\
  *   使用 `@ServiceProvider` 注解创建服务提供者实现。你通常将服务提供者放在它们自己的模块中。\n*   `Lookup` API 维护了一个应用程序范围内可用服务提供者的目录（`Global\
  \ Lookup`）。使用静态方法 `Lookup.getDefault().lookup()` 来发现服务提供者。使用 `Lookup` 发现服务提供者是类型安全的并保持你的代码松耦合。\n\
  *   使用 `Lookup` API 在模块间共享对象。一个模块可以将对象放入 `Lookup`，另一个模块可以访问 `Lookup` 中指定类型的对象。\n\
  *   `TopComponents` 实现 `Lookup.Provider`。使用 `InstanceContent` 创建一个用于可以添加或删除的对象的容器。使用\
  \ `AbstractLookup` 创建 `Lookup` 的默认实现。\n*   `TopComponent` 方法 `associateLookup()`\
  \ 将一个 `Lookup` 指定为 `TopComponent` 的 `Lookup`。\n*   使用 `TopComponent` 方法 `getLookup()`\
  \ 获取 `TopComponent` 的 `Lookup`。使用 `WindowManager` 方法 `findTopComponent()` 使用 `TopComponent`\
  \ 的 `preferredID` 字符串获取 `TopComponent` 引用。\n*   `LookupListener` 的事件处理器以类型安全响应一个或多个\
  \ `Lookups` 的变化。在 `FamilyTreeApp` 中，我们使用 `Lookups` 和 `LookupListener` 使选中的 `Person`\
  \ 对象对 `PersonEditor` 模块可访问（无需模块依赖）。\n*   `Global Selection Lookup` 提供具有焦点的 `TopComponent`\
  \ 的 `Lookup`。你可以监听 `Global Selection Lookup` 中特定对象的添加或移除（无需创建特定 `TopComponents`\
  \ 的依赖）。\n*   使用 `@OnStart` 和 `@OnStop` 注解实现应用程序中的启动或关闭代码。\n\n接下来是什么？\n现在让我们重新回到\
  \ JavaFX，看看如何在 NetBeans Platform 应用程序中利用 JavaFX UI 的改进功能。\n\n# 6 JavaFX 集成\n\n在本章中，我们将探索如何在\
  \ NetBeans Platform 应用程序中使用 JavaFX。我们将创建一个带有 JavaFX 内容单窗口 NetBeans Platform 应用程序。这将向你展示向\
  \ NetBeans Platform 应用程序添加 JavaFX 的所需步骤。\n\n接下来，我们将从第 4 章迁移一个 JavaFX 程序。我们将展示如何构建遵循第\
  \ 5 章](#part0012.xhtml)指南的多窗口 NetBeans Platform 应用程序，利用相同的 NetBeans Platform 特性。这包括应用程序的模块化、使用服务提供者、创建公共包以及依赖\
  \ `Lookups` 和更改事件来保持应用程序松耦合。此示例的讨论假设你已经阅读了第 5 章。\n\n我们还将向你展示可以将 JavaFX UI 代码与 Swing\
  \ UI 分离的策略。\n\n你将学习\n*   将 JavaFX 集成到 NetBeans Platform 应用程序。\n*   在 Swing UI 中添加\
  \ JavaFX 内容。\n*   在 NetBeans Platform 应用程序上下文中使用 `FXML` 和类类构建 JavaFX。\n*   使用 `Lookup`\
  \ 发现服务提供者并在模块间共享对象。\n*   在 `TopComponent` 窗口及其嵌入的 JavaFX 场景之间通信。\n\n## 6.1 JavaFX\
  \ 和 NetBeans Platform\n\n让我们从迁移第 3 章的示例开始，即下载中的 `RectangleCSSApp` 项目。单窗口 JavaFX\
  \ 应用程序在“Creating a JavaFX FXML Application”第 93 页、“CSS Files”第 98 页以及“Animation”第\
  \ 100 页中描述。\n\n从 Java 8 开始，JavaFX 被完全集成到 JDK 中。图 6.1 显示了应用程序在旋转矩形和文本的过渡期间运行。记住，该程序使用\
  \ `FXML` 来描述场景图并使用关联的类来指定事件处理器。主程序调用 `FXML Loader` 来实例化场景图中的元素。\n\n```\n图 6.1 Rectangle\
  \ 随动画旋转\n```\n\n图 6.2 显示此程序作为带有矩形和文本元素的 NetBeans Platform 应用程序运行。虽然相似，但 NetBeans\
  \ Platform 应用程序具有顶层菜单和工具栏、完全浮动/停靠的可缩窗口以及打开和关闭窗口的能力。\n\n```\n图 6.2 FXDemoApp NetBeans\
  \ Platform 运行\n```\n\n以下是构建带有 JavaFX 内容的 NetBeans Platform 应用程序的通用步骤：\n\n1.  创建一个\
  \ NetBeans Platform 应用程序。\n2.  创建一个模块。\n3.  向模块添加一个窗口（`TopComponent`）。\n4.  使用 Swing\
  \ `JFXPanel` 向 `TopComponent` 添加 JavaFX 内容。\n\n最后一步具有灵活性。例如，你可以将 JavaFX 元素直接添加到\
  \ `TopComponent` 类的 `JFXPanel` 中。或者，你可以使用带有类类的 `FXML`。`FXML` 方法有几个优势：\n\n*   你可以使用\
  \ `Scene Builder` 和 `FXML` 来构建和编辑你的场景图。\n*   `FXML`（无论是否使用 `Scene Builder`）都能帮助你更好地可视化场景图。`FXML`\
  \ 也让编辑场景图元素变得更容易，因为你不需要用 Java API 配置它们。\n*   JavaFX 代码与 `TopComponent` 的 Swing 代码分离并隔离。由于你在同一个应用程序中集成了两个\
  \ GUI API，使用 `FXML` 会使你的代码更易读和维护。\n*   如果你已经有一个 `FXML` 文档和类类，将此代码迁移到 NetBeans 模块是非常直接的。\n\
  \n由于这些原因，我们将使用 `FXML` 方法。\n\n### Java 8 和 JavaFX 8 增强\n\n从 Java 8 开始，JavaFX 已完全集成到\
  \ JDK 中，JavaFX 运行时包含在标准类路径中。这意味着你不需要对 NetBeans 应用程序执行任何特殊操作来访问 JavaFX 类。在 Java 8\
  \ 之前，你必须执行以下步骤：\n\n1.  为 JavaFX 运行时 JAR 文件 `jfxrt.jar` 创建包装器，并将其添加到 NetBeans 项目中。包装器是一个带有公共包的\
  \ NetBeans 模块。\n2.  对包含 JavaFX 的任何模块声明依赖。\n\n我们在第 12 章（“Prepare to Use the Library”第\
  \ 578 页）中展示如何向 NetBeans Platform 项目添加包装器。\n\n让我们通过创建一个 NetBeans Platform 应用程序开始我们的\
  \ JavaFX 集成。\n\n#### 创建 NetBeans Platform 应用程序\n\n按照以下步骤在 NetBeans IDE 中创建你的 NetBeans\
  \ Platform 应用程序：\n\n1.  从 NetBeans IDE 顶层菜单选择 `File | New | Project`。NetBeans `New\
