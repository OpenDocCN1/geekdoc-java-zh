  . . .\n}\n```\n\n### 集成 JavaFX 图表\n\n在带有 JavaFX 图表的 NetBeans Platform 应用程序中，你可以按照第\
  \ 6 章 描述的描述所示（请参见第 250 页的“JavaFX 与 NetBeans 平台”）配置 JavaFX 内容。我们的应用程序为每个图表都有一个模块，为布局提供了最大的灵活性。每个模块包含一个窗口（`TopComponent`）、FXML\
  \ 标记和 JavaFX 控制器。所有 JavaFX 控制器都具有相同的结构，我们将在下节使用 `Line` 示例进行讨论。JavaFX 控制器，我们将以 `StackPane`\
  \ 所示的方式配置 JavaFX 内容。\n\n#### 图表模块\n创建一个名为 `Chart - Line` 的新模块并将其添加到 JavaFX。\n\n\
  #### FXML\n将 `linechart.fxml` 文件添加到 `Chart - Line` 模块中，如所示。列表 15.6 `linechart.fxml`点击此处查看代码图像\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<?import java.lang.*?>\n<?import\
  \ java.util.*?>\n<?import javafx.geometry.*?>\n<?import javafx.scene.*?>\n<?import\
  \ javafx.scene.control.*?>\n<?import javafx.scene.layout.*?>\n<?import javafx.scene.chart.*?>\n\
  <StackPane id=\"StackPane\" fx:id=\"stackpane\"\n    xmlns:fx=\"http://javafx.com/fxml\"\
  \n    fx:controller=\"org.smartphone.chart.LineController\">\n  <LineChart fx:id=\"\
  chart\" >\n    <xAxis>\n        <CategoryAxis fx:id=\"xAxis\"/>\n    </xAxis>\n\
  \    <yAxis>\n        <NumberAxis fx:id=\"yAxis\"/>\n    </yAxis>\n  </LineChart>\n\
  </StackPane>\n```\n\n#### 图表控制器\n列表 15.7 显示了图表控制器代码。所有图表控制器都有 `@FXML` 注解来标识 FXML\
  \ 文件控件。全局查找返回 `TableDataModel` 服务提供者（`tableModel` 字段）以访问数据。JavaFX 控制器配置每个图表（见下节）并定义了一个返回\
  \ JavaFX 图快照的 `getImage()` 方法。\n\n```java\npublic class ChartController implements\
  \ Initializable {\n    @FXML\n    private StackPane stackpane;\n    @FXML\n    private\
  \ CategoryAxis xAxis;\n    @FXML\n    private NumberAxis yAxis;\n    @FXML\n   \
  \ private LineChart<String, Number> chart;\n    private ObservableList<XYChart.Series<String,\
  \ Number>> lcData;\n    private MyTableDataModel tableModel;\n    private static\
  \ final Logger logger = Logger.getLogger(ChartController.class.getName());\n\n \
  \   @Override\n    public void initialize(URL url, ResourceBundle rb) {\n      \
  \  createChart();\n    }\n\n    private void createChart() {\n        tableModel\
  \ = Lookup.getDefault().lookup(MyTableDataModel.class);\n        if (tableModel\
  \ == null) {\n            logger.log(Level.SEVERE, \"Cannot get TableModel object\"\
  );\n            LifecycleManager.getDefault().exit();\n        }\n        . . .\
  \ 使用 tableModel 数据设置 JavaFX 图表的代码 . .\n    }\n\n    public BufferedImage getImage()\
  \ {\n        // 必须在 JavaFX 线程中执行\n        SnapshotParameters params = new SnapshotParameters();\n\
  \        Image jfximage = stackpane.snapshot(params, null);\n        return SwingFXUtils.fromFXImage(jfximage,\
  \ null);\n    }\n}\n```\n\n\n\n\n\n# 图表\n\n## 添加 LineChartTopComponent\n\n在 `Chart\
  \ - Line` 模块中添加一个 `LineChartTopComponent` 窗口，如 Listing 15.8 所示。构造函数使用 `JFXPanel`\
  \ 来初始化场景图中的 JavaFX 内容。通过加载 `FXML` 并实例化 JavaFX 控制器类，在 JavaFX 线程上构建 JavaFX 内容。\n\n\
  单行代码即为该窗口提供了打印功能，该功能将 `print.printable` 属性设置为 `true`。`InstanceContent`（参见第 225 页的“作为对象存储库查找”）允许您向\
  \ `TopComponent` 的 `Lookup` 添加对象。我们将使用 `InstanceContent` 来实现保存图表的功能。\n\nListing\
  \ 15.8 `LineChartTopComponent.java` 点击此处查看代码图像\n\n* *\n\n```java\n@ConvertAsProperties(\n\
  \    dtd = \"-//org.smartphone.chart.line//LineChart//EN\",\n    autostore = false)\n\
  @TopComponent.Description(\n    preferredID = \"LineChartTopComponent\",\n    //iconBase=\"\
  SET/PATH/TO/ICON/HERE\",\n    persistenceType = TopComponent.PERSISTENCE_ALWAYS)\n\
  @TopComponent.Registration(mode = \"properties\", openAtStartup = true)\n@ActionID(category\
  \ = \"Window\",\n         id = \"org.smartphone.chart.line.LineChartTopComponent\"\
