  ## 15.4 为 JavaFX 图表添加行为\n\n图的所有的所有部分都是 JavaFX 节点。这意味着你可以附加鼠标事件处理器、设置效果，并让图表节点参与过渡动画。在本节中，我们添加了一个过渡来动画选中的饼图扇形。在扇形动画期间，一个显示该扇形占总百分比的标签将淡入。我们还添加了一个原地编辑器，它会在选定的饼图扇形上点击右键时调用。到目前为止，所有的\
  \ JavaFX 图表都是只读的。\n\n\n\n\n```java\ndataItem.getNode().addEventHandler(\n    MouseEvent.MOUSE_CLICKED,\
  \ (MouseEvent t) -> {\n        . . . event handler code . . .\n    });\n```\n\n\
  让我们应用这些概念为 PieChart 窗口添加新功能。\n\n## 添加 PieChart 功能\n\n我们从 `piechart.fxml` 开始，这是 PieChart\
