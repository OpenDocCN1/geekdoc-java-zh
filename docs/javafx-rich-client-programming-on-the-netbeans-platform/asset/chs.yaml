  \ Views)\n\n资源视图提供了节点层级的视图，如第 292 页的图 7.1 所示。并不是所有的资源视图都是互用的，但它们都与节点一起。资源视图对于不同的展示布局非常有用。两种通用的资源视图是\
  \ `BeanTreeView`（用于我们的 TopComponent 中）和 `OutlineView`。它们都提供了一个可展开的节点树结构。我们在表 7.1\
  \ 中简要描述了资源视图，并在本节中提供了这些详细示例。\n\n### 快速搜索 (Quick Search)\n\n资源视图内置了快速搜索功能。要查看此功能，在带有资源视图的窗口中开始输入，会出现一个文本字段。资源视图会选择匹配文本的“下一个”节点。图\
  \ 7.16 显示了这种行为。当你在 `BeanTreeView` 中输入文本“Bar”时，你会看到 Bart 节点被高亮。在详情窗口中（参见第 327 页的“详情视图”），快速搜索适用于窗口中获得焦点的任何部分。\n\
  \n### BeanTreeView\n\n`BeanTreeView` 将节点层级显示为所有节点的树。这是我们在示例中使用的资源视图，可能是最广泛使用的资源视图。`BeanTreeView`\
  \ 使用指向右侧的三角形表示未展开节点，指向下方表示已展开（或已打开）的节点。非叶子节点的默认操作（双击激活）是在其展开和未展开状态之间切换。\n\n### OutlineView\n\
  \n`OutlineView` 是一种强大的资源视图，它以表格形式显示节点层级。默认配置与 `BeanTreeView` 类似。在我们的示例中，你会在图 7.17\
  \ 中看到显示的内容，只有单列（标题为“People”）。代码列表 7.18 显示了在 `GenderTopComponent` 中创建此视图的代码。\n\n\
