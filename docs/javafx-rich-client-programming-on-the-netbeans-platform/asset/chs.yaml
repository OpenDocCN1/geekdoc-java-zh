  \ 5.22 `PersonViewerTopComponent.java` 设计视图\n\n你仍然需要为 `PersonViewerTopComponent.java`\
  \ 添加配置代码。部分代码可以直接从 `PersonJFrame.java` 复制过来。在这样做之前，是时候解释 `Lookup API` 如何让你发现并使用服务提供者了。我们还将向你展示\
  \ Lookup 如何允许模块之间进行通信。\n\n### Lookup API\n\nLookup 是 NetBeans  最强大的功能之一。Lookup 可以是应用范围内的（称为`全局查找`），也可以附加到应用程序内的对象上。例如，所有的\
  \ `TopComponents` 都有一个 `Lookup`。让我们看看如何使用 `Lookups` 来利用松耦合的通信策略。\n\n在上一节中，我们使用了注解\
  \ `@ServiceProvider` 在应用程序的全局查找中注册了一个服务提供者。`Lookup` 是一个映射表，其键为类类型，值为类类型实例。`Lookup`\
  \ 允许模块通过查询对象的 `Lookup` 相互通信。它们也是类型安全的。你可以使用 `Lookups` 来发现服务提供者，你也可以发现任意对象——而不只是服务提供者。在配置\
  \ `FamilyTreeApp` 应用程序时，你将看到这两种类型 Lookup 的示例。\n\n### 作为服务提供者的 Lookup\n\n在使用 `Lookup`\
  \ 之前，你必须以某种方式获取它。维护所有服务提供者的全局查找可以通过静态方法 `Lookup.getDefault()` 访问。使用 `lookup()` 方法来发现特定服务接口的服务提供者。对于\
  \ `FamilyTreeApp` 应用程序，你需要一个接口 `FamilyTreeManager` 的服务提供者。以下是获取该服务提供者的方法。点击此处查看代码图像\n\
  \n```java\nFamilyTreeManager ftm = Lookup.getDefault().lookup(FamilyTreeManager.class);\n\
  \nif (ftm == null) {\n    logger.log(Level.SEVERE, \"Cannot get FamilyTreeManager\
  \ object\");\n    LifecycleManager.getDefault().exit();\n}\n\n// do something with\
  \ ftm\n```\n\n注意，此代码假设服务提供者已在处通过 `@ServiceProvider` 注解注册。如果成功返回，`ftm` 持有由 `Lookup\
  \ API` 提供的 `FamilyTreeManagerImpl` 实例引用。此客户端代码对 `FamilyTreeManagerImpl` 模块没有依赖。事实上，你以后可以提供另一个实现，而无需更改此客户端代码。我们只需要对\
  \ `FamilyTreeModel` 模块有依赖，该模块包含了接口 `FamilyTreeManager`。\n\n#### Lookup 提示\n\n你应当检查\
  \ `lookup()` 方法的返回值是否为 `null`。在本示例中，如果返回值为 `null`，我们使用 NetBeans 平台的 `LifecycleManager`\
  \ 方法 `exit()` 退出应用程序。\n\n\n\n\n\n# 将 Lookup 作为对象仓库\n\n你已经看到 `Lookup` 如何帮助你发现并获取服务提供者的实例。在\
  \ `FamilyTreeApp` 应用中，当用户在 `JTree` UI 控制中选择不同的节点时，我们还需要一种方法将选中的 `Person` 对象传递给 `PersonEditor`。在该程序的\
  \ Swing 版本中，`TreeSelectionListener` 直接更新 Swing UI 控件（参见第 60 页上的 Listing 2.19）。\n\
  \n然而，在 NetBeans Platform 应用中，`PersonEditor` 代码及其 UI 控件位于它们独立的模块中。`PersonViewer`\
  \ 模块（包含 `JTree` 组件）必须以某种方式将其选择的内容提供给 `PersonEditor` 模块。此外，我们希望维护一种松耦合的架构，因此不希望让任何一个模块依赖于另一个。使用\
  \ Lookups 就是答案。\n\nLookups 被描述为一种数据结构或“物品的包”。重要的是，`Lookups` 帮助共享对象，使得其他模块可以发现并访问这个物品包。同样，就像用于服务提供者的\
  \ `Lookups` 一样，共享对象的 `Lookups` 将类类型作为键、实例作为值集合的对象存储在 map 中。此外，`Lookups` 是可观测的。这意味着你可以为\
  \ `Lookup` 发现的结果附加监听器。当一个类或 `TopComponent` 向其 `Lookup` 中放入不同的内容时，你可以监听此变化，并在 `Lookup`\
  \ 监听器的事件处理程序中获取新对象（或对象）。这正是 `PersonViewerTopComponent` 如何让用户的树选择对象对任何感兴趣的模块可见的方法。当前的树选择被放置在\
  \ `TopComponent` 的 `Lookup` 中。事实证明，`TopComponents` 已经拥有一个 `Lookup`，并且 `TopComponents`\
  \ 实现了 `Lookup.Provider`，该接口允许其他通过 `getLookup()` 方法请求其 `Lookup`。\n\n以下是向 `TopComponent`\
  \ 的 `Lookup` 添加和删除内容所需的步骤。\n\n1. 首先，使用便利类 `InstanceContent` 创建内容持有者。\n   ```java\n\
  \   private final InstanceContent instanceContent = new InstanceContent();\n   ```\n\
  2. 接下来，创建一个 `Lookup` 来持有 `InstanceContent`，并将此 `Lookup` 与 `TopComponent` 的 `Lookup`\
  \ 关联。这允许你使用 `TopComponent` 的 `Lookup.Provider` 方法 `getLookup()` 来访问该 `Lookup`。类\
  \ `AbstractLookup` 扩展了 `Lookup` 并提供了在 `Lookup` 中存储类类型对的默认方法。你通常将此代码放在 `TopComponent`\
  \ 的构造函数中。\n   ```java\n   public PersonViewerTopComponent() {\n       // . .\n \
  \      associateLookup(new AbstractLookup(instanceContent));\n   }\n   ```\n3. 现在你可以在\
  \ `instanceContent` 中添加、删除或搜索特定类型的对象。例如，在 `TreeSelectionListener` 中，使用 `InstanceContent`\
  \ 方法 `set()` 添加选中项。\n   ```java\n   // 将人员放入此 TopComponent 的 Lookup\n   instanceContent.set(Collections.singleton(person),\
  \ null);\n   ```\n   同样，如果你想从 `Lookup` 中移除此 `Person` 对象，可以先查找它然后移除，如下所示。（当用户选择顶级节点“People”时，`PersonViewer\
  \ TopComponent` 会从 `Lookup` 中移除 `Person` 对象）。\n   ```java\n   // 在此 TopComponent\
  \ 的 Lookup 中查找人员对象\n   // 如果存在则移除\n   Person person = getLookup().lookup(Person.class);\n\
  \   if (person != null) {\n       instanceContent.remove(person);\n   }\n   ```\n\
  \nNetBeans Platform 提供了对 `TopComponent` 的 `Lookup` 内容敏感的额外功能。我们将在 第 10 章 中更详细探讨这些内容（参见第\
  \ 488 页上的“实现更新”）。\n\n### 配置 TopComponent\n\n在了解 Lookups 之后，让我们完成 `PersonViewer TopComponent`\
  \ 的配置。我们将添加类变量、配置构造函数代码，并在 `TopComponent` 的生命周期方法中添加代码。我们还将编写一个 `TreeSelectionListener`（将选中的\
  \ `Person` 放入 `TopComponent` 的 `Lookup` 中）和一个 `PropertyChangeListener`（当 `Person`\
  \ 对象发生变化时更新显示的对象）。这些监听器方法与你已经在程序的 Swing 版本中见过的方法相似。但在这里，我们将利用促进模块化和松耦合的 NetBeans\
  \ Platform 功能。我们将从顶部（类变量）开始添加这些代码。当源码处于中间状态时，你会遇到编译错误，但在完成后这些错误都将被修复。\n\n## 配置类变量和构造函数\n\
  \n1. 向 `PersonViewerTopComponent.java` 中添加以下类变量和构造函数代码（如 Listing 5.7 中的**粗体**所示）。这些相同的类变量也用于该程序的\
  \ Swing 版本，除了 `treeModel` 和 `instanceContent`。我们之前描述过 `instanceContent`。`treeModel`\
  \ 提供了对 `JTree` 的访问，并允许你自动展开 JTree。我们将在稍后的 Listing 5.11 中显示这段代码。\n\n```java\npublic\
