  \ `TopComponent` 的 `Lookup` 关联。由于 `TopComponent` 在构造函数中调用了控制器方法（此处为控制器方法 `getInstanceContent()`），它必须等待\
  \ `createScene()` 方法完成，该方法负责构建场景图并实例化控制器。我们使用并发库 `CountDownLatch` 进行等待。此外，`TopComponent.associateLookup()`\
  \ 方法必须在 Swing 的 EDT 上调用。列表 6.14 显示了这段代码。在 EDT 上调用控制器方法 `getInstanceContent()` 是安全的，因为它没有访问或修改\
  \ JavaFX 场景图。列表 6.14 `PersonFXViewerTopComponent`\n\n```java\npackage com.gteach.familytree.personviewer;\n\
