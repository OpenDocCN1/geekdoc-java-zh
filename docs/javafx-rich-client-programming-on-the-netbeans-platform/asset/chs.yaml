  \ Chart API 是数据可视化应用程序的一个重要特性。幸运的是，你可以轻松地将 JavaFX 图表集成到你的 NetBeans Platform 应用程序中。根据你的数据特征和所需的可视化类型，你可以选择一个或多个图表。在\
  \ SmartPhone Data 应用中，我们使用了相同数据的所有图表，以展示每个图表的可视优势。\n\n你会发现 JavaFX 图表非常易用。尽管图表具有高度配置性，但默认设置已符合大多数需求。你还可以通过自定义\
  \ CSS 样式更改任何图表的外观。让我们先概述 JavaFX Chart API。\n\n## JavaFX 图表概览\n\n图 15.5 显示了 JavaFX\
  \ 图类的层次结构。抽象类 `Chart` 继承自 `Node`、`Parent` 和 `Region`，因此继承了这些父类的所有特性，包括动画、效果和 CSS\
  \ 样式。除了 `Pie Chart` 外，所有图表都有 `XY` 轴。![](img/image9405.jpg)图 15.5 JavaFX 图类层次结构\n\
  \n`Chart` 是所有图表的基类，定义了每个图表的标题、图例和内容。图表内容由 `Chart` 的特定子类填充。例如，图 15.6 显示了一个 `Line\
  \ Chart`，它负责创建图表内容。在这个示例中，内容包括带有标签的 `X` 轴、带有标签的 `Y` 轴以及绘制的线条和刻度![](img/image9410.jpg)图\
  \ 15.6 图表的组成\n\n### 图属性\n\n表 15.1 列出了所有图表的公共属性。注意，这些 JavaFX 属性可以参与绑定表达式。通常，你唯一需要设置的属性是\
  \ `title` 属性。![](img/image9417.jpg)表 15.1 所有图表的公共属性\n\n默认情况下，图表会对数据变化执行动画。例如，在图\
  \ 15.6 中，如果 2008 年某个系列中的 `LineChart` 值发生变化，当数据点移动到新的绘制位置，线条角度会移动。同样，在 `PieChart`\
  \ 中，新值会影响整个扇形布局。内容不会从头重绘，而是所有扇形随着其相对形状调整适应新值而动态调整大小。你可以通过将 `animated` 属性设置为 `false`\
  \ 来禁用此功能。\n\n如表 15.1 所示，你还可以配置图例位置、标题及其位置以及图例是否可见。`legend` 属性本身受保护，并由图表子类进行配置。\n\
  \n## XY Charts\n\n`XYChart` 抽象类是所有双轴图表的基类，负责绘制轴和绘图内容。`XYChart` 的子类显示在第 760 页的[图\
  \ 15.5]中。`XYChart` 类的属性包括控制网格线的可见性，以及交替列和行是否有可见的填充。对于 `XYChart` 最重要的属性是 `data`，其类型如下。\n\
  \n点击此处查看代码图片\n```\nObjectProperty<ObservableList<XYChart.Series<X,Y>>>\n```\n\n\
  图表的数据存储在 `ObservableList` 中（参见第 148 页的“可观测集合”）。列表类型为 `XYChart.Series<X,Y>`，它是命名的数据项系列（XYCharts\
  \ 操作的是列表列表）。数据项类型为 `XYChart.Data<X,Y>`，其中泛型 `X` 代表 `X` 轴类型，`Y` 代表 `Y` 轴类型。数据项还包含一个额外值（`extraValue`\
  \ 属性），可以按子类图所需的任何方式使用。\n\n例如，第 760 页的[图 15.6]中的 `LineChart` 有六个系列（Nokia、RIM、Apple、HTC、Samsung\
  \ 和 Others），它们的名称显示在图表的图例中。每个系列有四个数据点，每个数据点都有代表年份的 `String` 类型 `X` 值和一个代表百万单位销售额的\
  \ `Number` 类型 `Y` 值。（你可以查阅第 750 页的[代码 15.2]中的原始数据）。\n\n```java\nObservableList<XYChart.Series<X,Y>>\n\
  ```\n\n数据项类型为 `XYChart.Data<X,Y>`，其中泛型 `X` 代表 `X` 轴类型，`Y` 代表 `Y` 轴类型。数据项还包含一个额外值（`extraValue`\
  \ 属性），可以按子类图所需的任何方式使用。例如，第 760 页的[图 15.6]中的 `LineChart` 有六个系列（Nokia、RIM、Apple、HTC、Samsung\
  \ 和 Others），它们的名称显示在图表的图例中。每个系列有四个数据点，每个数据点都有代表年份的 `String` 类型 `X` 值和一个代表百万单位销售额的\
  \ `Number` 类型 `Y` 值。\n\n\n\n\n\n```css\n{\n    -fx-stroke-width: 10px;\n    -fx-effect:\
