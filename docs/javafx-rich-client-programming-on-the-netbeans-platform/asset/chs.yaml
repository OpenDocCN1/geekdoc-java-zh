  \            // middlenameProp\n            // lastnameProp\n            // suffixProp\n\
  \            setNames.put(firstnameProp);\n            setNames.put(middlenameProp);\n\
  \            setNames.put(lastnameProp);\n            setNames.put(suffixProp);\n\
  \            // 为性别创建只读属性支持\n            Property<Person.Gender> genderProp = new\
  \ PropertySupport\n                .ReadOnly<Person.Gender>(\n                \"\
  gender\",\n                Person.Gender.class,\n                \"gender\",\n \
  \               \"The person's gender\") {\n                    @Override\n    \
  \                public Person.Gender getValue() throws IllegalAccessException,\
  \ InvocationException {\n                        return person.getGender();\n  \
  \                  }\n            // 为备注使用读写属性支持（保持不变）\n            Property<String>\
  \ notesProp = new PropertySupport\n                .Reflection<String>(person, String.class,\
  \ \"notes\");\n            infoSet.put(genderProp);\n            infoSet.put(notesProp);\
  \ // 为 id 创建只读属性支持（setter 为 null）\n            Property<Long> idProp = new PropertySupport.Reflection<Long>(\n\
  \                person, Long.class, \"getId\", null);\n            readOnlySet.put(idProp);\n\
  \        } catch (NoSuchMethodException ex) {\n            ErrorManager.getDefault();\n\
  \        }\n        return sheet;\n    }\n```\n\n### 修改 GenderTopComponent 中的 OutlineView\n\
  \n修改 `GenderTopComponent` 构造函数，使 `OutlineView` 配置了属性列 `Notes`，如[Listing 7.26]所示。\n\
  \n```java\npublic GenderTopComponent() {\n    initComponents();\n    setName(Bundle.CTL_GenderTopComponent());\n\
  \    setToolTipText(Bundle.HINT_GenderTopComponent());\n    OutlineView view = new\
  \ OutlineView(\"People\");\n    view.setPropertyColumns(\n        \"notes\", \"\
  Notes\"\n    );\n    add(view, BorderLayout.CENTER);\n    associateLookup(ExplorerUtils.createLookup(em,\
  \ this.getActionMap()));\n    em.setRootContext(new RootNode());\n    for (Node\
  \ node : em.getRootContext().getChildren().getNodes()) {\n        view.expandNode(node);\n\
  \    }\n    // 默认打开 Properties 窗口\n    TopComponent tc = WindowManager.getDefault()\n\
  \        .findTopComponent(\"properties\");\n    if (tc != null) {\n        tc.open();\n\
  \    }\n}\n```\n\n\n\n\n\n### 为您的应用程序添加功能\n\n现在我们准备好为应用程序添加一个全新的功能——一个跟踪用户选择的 `SelectionHistory`\
  \ 窗口。这个概念非常直观：通过监听 `Global Selection Lookup`，新模块将显示用户选择的动态列表。为了实现这一点，我们将为应用程序添加一个新模块。\n\
  \n## 创建模块 `SelectionHistory`\n\n添加一个新模块以实现 `SelectionHistory` 窗口。\n\n1. 在 `FamilyTreeApp`\
  \ 项目中选择 `Modules` 节点，右键点击，并在右键菜单中选择 `Add New . . .`。NetBeans 会显示 `New Project` 向导的\
  \ `Name` 和 `Location` 对话框。\n2. 为 `Project Name` 指定 `SelectionHistory`，并接受其余字段的默认值。点击\
  \ `Next`。\n3. NetBeans 显示 `Basic Module Configuration` 对话框。为 `Code Name Base` 指定\
  \ `com.asgteach.familytree.selectionhistory`，并接受其余字段的默认值。点击 `Finish`。NetBeans 在\
  \ `FamilyTreeApp` 应用程序中创建项目 `SelectionHistory`。\n4. 展开项目 `SelectionHistory`，右键点击\
  \ `Libraries` 节点，并在右键菜单中选择 `Add Module Dependency`。\n5. 从模块列表中选择 `Nodes API` 并点击\
  \ `OK`。\n\n## 创建并配置 `SelectionHistoryTopComponent`\n\n`SelectionHistory` 模块需要一个\
  \ `TopComponent` 来显示其内容。\n\n1. 在 `Projects` 视图中，展开项目 `SelectionHistory` 的 `Source`\
  \ 节点，右键点击节点 `com.asgteach.familytree.selectionhistory`。从其右键菜单中选择 `New | Window .\
  \ . .`。\n2. NetBeans 显示 `New Window` 向导的 `Basic Settings` 对话。在 `Window Position`\
  \ 下拉菜单中选择 `output` 并勾选 `Open on Application Start`。点击 `Next`。（这将窗口位于编辑器下方。）\n3.\
  \ NetBeans 显示 `Name`、`Icon` 和 `Location` 对话框。为 `Class Name Prefix` 指定 `SelectionHistory`，留空\
  \ `Icon` 字段，并接受其余字段的默认值。点击 `Finish`。\n\nNetBeans 创建 `SelectionHistoryTopComponent`\
  \ 类并在 `Design` 视图中打开它。创建一个 `BorderLayout` 并添加一个 `TextArea` 组件。\n\n1. 在 `Design`\
  \ 视图中，在 `Navigator` 窗口中选择 `TopComponent`。\n2. 右键点击并在右键菜单中选择 `Set Layout | BorderLayout`。\n\
  3. 在 `Swing Controls` 面板中选择 `TextArea` 并将其添加到 `TopComponent` `Design` 视图的中心。这将同时添加一个\
  \ `JScrollPane` 和一个 `JTextArea`。\n4. 选择 `TextArea`，并在 `Properties` 窗口的 `Code` 标签下，将属性\
  \ `Variable Name` 改为 `displayTextArea`。\n5. 切换到 `Source` 视图并向 `TopComponent` 添加代码，如\
  \ [Listing 7.27] 和此处所示。\n\n添加类字段 `result` 以存储 `Global Selection Lookup` 的结果。在 `componentOpened()`\
  \ 方法中，请求 `Node.class` 对象的 `Lookup`，并将 `TopComponent` 作为 `Lookup listener` 添加。\n\n\
  在 `componentClosed()` 方法中，移除 `TopComponent` 作为 `Lookup listener`。\n\n实现 `resultChanged()`\
  \ `Lookup listener`，当 `Node.class` 对象被添加到或从 `Global Selection Lookup` 中移除时触发该方法。我们将\
  \ `Lookup` 内容存储在 `nodes` 中。如果列表不为空，我们将显示名称写入 `TextArea` 组件和状态栏（使用 `StatusDisplay.getDefault().setStatus()`）。请注意，如果用户选择了多个节点，这些节点都将被包含在\
  \ `SelectionHistory` 窗口中。此实现监听所有节点对象，包括 `RootNode`、`GenderNode` 和 `PersonNode`。如果您想将选择历史限制为\
  \ `Person` 对象，则改为监听 `Person.class`。由于 `PersonNode` 对象在它们的 `Lookup` 中携带 `Person`\
  \ 对象，因此当用户选择一个或多个 `Person` 节点时，`SelectionHistory` `Lookup listener` 就会触发。\n\n###\
  \ Listing 7.27 监听 Global Selection Lookup 的更改\n\n```\npublic final class SelectionHistoryTopComponent\
  \ extends TopComponent\n        implements LookupListener {\n\n    private Lookup.Result<Node>\
  \ result;\n\n. . . unchanged code omitted . . .\n\n    @Override\n    public void\
  \ componentOpened() {\n        result = Utilities.actionsGlobalContext().lookupResult(Node.class);\n\
  \        result.addLookupListener(this);\n    }\n\n    @Override\n    public void\
  \ componentClosed() {\n        result.removeLookupListener(this);\n    }\n\n   \
  \ @Override\n    public void resultChanged(LookupEvent le) {\n        Collection<?\
  \ extends Node> nodes = result.allInstances();\n        // 如果有选择时才获取\n        //\
  \ 否则保持选择不变！\n        if (!nodes.isEmpty()) {\n            StringBuilder status =\
  \ new StringBuilder();\n            StringBuilder sb = new StringBuilder(\"\\n\"\
  );\n            for (Node node : nodes) {\n                sb.append(\" [\").append(node.getDisplayName()).append(\"\
  ] \");\n                status.append(\" [\").append(node.getDisplayName()).append(\"\
  ] \");\n            }\n            StatusDisplayer.getDefault().setStatusText(status.toString());\n\
  \            displayTextArea.setText(sb.insert(0,\n                displayTextArea.getText()).toString());\n\
  \        }\n    }\n\n}\n```\n\n\n\n\n通过这种设计，`SelectionHistory` 模块并不依赖 `FamilyTreeModel`\
  \ 模块或 `GenderViewer` 模块。添加 `SelectionHistory` 模块也不会影响这些任何一个模块（除了占用应用程序窗口框架的空间之外）。然而，`SelectionHistory`\
  \ 模块为我们的应用程序增加了独特的功能。同样，移除此模块也不会影响剩余的模块。这说明了模块化系统的主要优势之一：你可以在不修改系统其他部分的情况下为应用程序添加或删除功能！\n\
  \n## 7.5 要点总结\n当你使用 `Nodes`、`Explorer Views` 和 `Explorer Manager` 时，NetBeans Platform\
  \ 提供了一个灵活的系统来显示你的业务数据。这些组件共同处理选择事件，并允许用户动态展开和折叠层次数据树。以下是本章的要点：\n\n* `Nodes`、`Explorer\
  \ Views` 和 `Explorer Manager` 可以从模型-视图-控制器（MVC）模式的理解。`Nodes` 是 `Model`，`Explorer\
  \ Views` 是 `View`，而 `Explorer Manager` 是 `Controller`。\n* `Nodes` 封装了业务对象并为显示创建了层级结构。\n\
  * `Nodes` 拥有一个 `Lookup` 并将其封装的业务对象放入 `Lookup` 中。\n* `AbstractNode` 提供了 `Node` 类的通用实现。\n\
  * 要构建节点层级结构，请创建一个根节点以及为根节点的子节点创建一个 `ChildFactory`。`ChildFactory` 负责创建它的 `Child`\
  \ 节点，除非节点是叶子节点，否则这些节点也将拥有一个 `ChildFactory`。叶子节点的子容器被标记为 `Children.Leaf`。\n* `Nodes`\
  \ 拥有名称、显示名称、图标以及可选的 HTML 显示代码。\n* `Nodes` 支持 Java 事件模型。当发生更改节点的事件时，会调用 `NodeListener`\
  \ 事件处理器，例如子节点的添加、删除或重新排序，以及节点名称、显示名称、图标或工具提示的更改。`PropertyChangeListener` 事件处理器会在节点的底层的属性支持对象发生变化时被调用。\n\
  * 要在 `TopComponent` 中显示节点层级结构，请实现 `ExplorerManager.Provider`，实例化 `Explorer Manager`\
  \ 和 `Explorer View`，并将 `Explorer Manager` 的根上下文设置为你的节点层级结构的根节点。\n* `BeanNode` 是\
  \ `Node` 类的另一种实现，它为其封装的业务对象提供了属性支持。该属性支持被标准的 NetBeans Platform 属性窗口以及 `PropertySheetView`\
  \ 组件和 `OutlineView` Explorer View 使用。\n* 或者，你也可以创建自己的属性表（property sheet），它为其封装的业务对象提供属性支持。自定义属性表与\
  \ `Properties` 窗口、`PropertySheetView` 和 `OutlineView` Explorer View 兼容。\n* 使用 `FilterNode`\
  \ 为节点层级结构创建替代显示。`FilterNode` 充当原始节点的代理。节点是否被选中显示由 `FilterNode.Children` 的实现控制。\n\
  * 所有的 `Explorer Views` 都与 `Nodes` 工作并提供不同类型的呈现。`BeanTreeView` 和 `OutlineView` 都是基于树的组件。其他选项包括\
  \ `ContextTreeView` 和 `ListView`，用于实现主详情窗口。\n* `Explorer Views` 为选择提供了 `Quick Search`（快速搜索）功能，通过在视图窗口中输入文本启用。\n\
  * 为你的应用程序添加功能（例如 `Selection History` 窗口）可以通过创建一个新模块并将其添加到应用程序中来实现。因为 NetBeans Platform\
  \ 应用程序是模块化的，此类添加的功能通常不需要修改现有模块。\n\n# 8. NetBeans Platform 窗口系统\n典型的桌面应用程序需要由窗口系统管理的顶层容器。我们使用“窗口系统”一词时指的是什么？首先，窗口系统包含一个窗口管理器，响应用户操作，如拖动、取消分离、选择或最小化窗口以管理工作空间。其次，窗口系统应该包含一种持久化机制，以便用户不需要每次重启应用程序时都进行配置。第三，窗口系统应该提供一种指定应用程序窗口布局的方法以及一种分组以实现共同行为的方法。最后，通过窗口系统，你应该能够创建应用程序的多个视角（perspectives），以便为不同的窗口配置分配角色。在本章中，你将探索\
  \ NetBeans Platform 窗口系统。显著的是，本章包含了许多各种窗口以及对这些窗口操作的示例。然而，这些窗口大部分没有任何重要内容。在本章中，我们关注的是窗口管理——打开、关闭、窗口布局、分组、浮动、最大化和调整大小。在你探索窗口系统本身之后，后续章节将基于之前介绍的示例向你展示如何操作窗口内容。NetBeans\
  \ Platform 有一种强大的选择机制，窗口系统也参与其中。例如，当用户选择一个窗口时，所选窗口的 `Lookup` 中的对象为行为提供了全局上下文。我们在第\
  \ 225 页的“作为对象仓库的 Lookup”和第 240 页的“跟踪全局选择”中引入了 `Lookup` 和选择。我们在第 421 页的“Actions 和\
  \ Lookup”中进一步探索 `Lookup`。\n\n**你将学到**\n* 理解窗口系统。\n* 探索 `TopComponent` 基础和持久化。\n\
  * 创建非单例 `TopComponents`。\n* 理解窗口系统生命周期。\n* 使用窗口组。\n* 结合窗口布局角色。\n\n### 8.1 窗口框架概述\n\
  `Swing` 或 `JavaFX` 都不提供框架。开发者当然可以自己构建系统，但创建一个这样一个系统需要巨大的精力。从必须提供这种“轮子”的任务中解脱出来，开发者可以专注于业务逻辑。我们将从\
  \ NetBeans Platform 窗口系统的一些术语开始。\n\n### 窗口布局\n让我们使用 NetBeans IDE 本身来检查框架。图 8.1 显示了\
  \ NetBeans IDE 内部典型的窗口布局。应用程序框架包括顶层菜单栏和工具栏，这些不属于窗口系统。\n\n框架的其余部分是窗口布局。在这里，一个主编辑器窗口被辅助窗口包围。在示例中，主编辑器窗口有三个处于\
  \ `Design` 视图。`Palette` 和 `Properties` 窗口（位于右侧）帮助用户为 GUI 选择或添加组件。`Navigator` 窗口（左下角）显示设计元素的层次视图。\n\
  \n当你点击 `Source` 按钮并切换视图查看源代码时，`Palette` 和 `Properties` 窗口会自动关闭，为 Java 源代码编辑器留出更大的区域，如图\
  \ 8.2 所示。`Palette` 和 `Properties` 窗口与 `Design` 视图形成一个窗口组。这意味着这三个窗口会自动打开和关闭。（注意，`Navigator`\
  \ 窗口不会关闭，但其内容在切换时会更改。）\n\n左侧是管理器区域，当前包含三个窗口。`Projects` 窗口可见并为每个打开的 NetBeans 项目提供文件信息。你可以通过点击标签使其他窗口可见（图\
  \ 8.2 中的 `Files` 和 `Services` 窗口）。所有三个窗口占据同一个区域（模式）。\n\n`Output` 和 `Tasks` 窗口出现在编辑器下方。最后，单行状态栏（不是窗口）占据应用程序的最底部。图\
  \ 8.3 显示了编辑器窗口的详细视图，该窗口当前包含一个 Java 源文件，并处于 `Design` 视图（GUI 表单编辑器）。MultiView 按钮允许用户在同一文件或数据的多个视图之间进行切换。\n\
  \n\n\n\n### MultiView 窗口\n\nMultiView 窗口与编辑器窗口配合使用，我们将在第 14 章中介绍（请参见第 697 页的“使用\
  \ MultiView 窗口”）。\n\n\n\n\n窗口标签（Window tabs）允许用户在同一区域（模式）中选择不同的窗口。编辑器区域的窗口选择控件允许用户在所有窗口标签均不可见时，在标签之间循环切换。设计视图控件专门用于\
  \ GUI 表单编辑器。\n\n## 窗口模式\n应用程序窗口的位置行为由其窗口位置或“模式”定义，模式是窗口的容器。NetBeans 平台窗口系统（NetBeans\
  \ Platform Window System）定义了可以在应用程序中使用的标准模式。图 8.4 显示了这些标准模式及其相对位置。\n\n![](img/image4607.jpg)\n\
  图 8.4 窗口系统默认模式\n\n窗口模式有三种：编辑器（editor，通常用于存放文档）、视图（view）和滑动（sliding）。编辑器模式是默认模式，并提供特殊行为，如图\
  \ 8.3 所示的窗口选择控件。默认情况下，编辑器模式始终占据窗口框至少部分。编辑器模式窗口不能最小化。滑动模式是存放最小化窗口的容器。视图模式持有辅助窗口，通常放置在主编辑器模式窗口周围。\n\
  \n窗口系统通过 XML 配置文件配置标准（非滑动）模式。你可以使用这些配置文件创建自己的模式或修改标准模式。我们将在第 387 页的“窗口布局”中向你展示做法。\n\
  \n## TopComponents\nNetBeans 平台窗口系统管理扩展 `TopComponent` 类的窗口。`TopComponent` 继扩展自\
  \ `JComponent`（一个基于 Swing 的容器）。通过 `TopComponent`，所有应用程序窗口会自动集成到窗口系统中。也就是说，它们由 NetBeans\
  \ 平台窗口管理器管理，并支持丰富的窗口操作。\n\n## 窗口操作\n停靠（Docking）、浮动（floating）、滑动（sliding）、移动（moving）、打开和关闭是\
  \ NetBeans 平台窗口系统提供的许多窗口操作之一。通过拖放，你可以移动窗口并自定义窗口布局。点击窗口上的标签并将其拖到新位置。图 8.5 和图 8.6\
  \ 显示了示例应用程序中窗口布局的前后变化。在这里，我们将资源管理器（Explorer）窗口移动到与属性（Properties）窗口相同的位置。\n\n![](img/image4617.jpg)\n\
  图 8.5 之前：资源管理器窗口、人员窗口和属性窗口\n\n在开发期间，除非你对应用程序进行清理和重新构建，否则重新配置将在应用程序多次重启之间自动保存。\n\n\
  ![](img/image4622.jpg)\n图 8.6 之后：人员窗口与资源管理器窗口及属性窗口共享同一模式\n\n在窗口标签内部点击右键会显示用于额外窗口操作的上下文菜单。你也可以通过顶层菜单窗口\
  \ | 配置窗口（Window | Configure Window）访问上下文菜单。以下是可用选项。注意，窗口操作的准确结果取决于应用程序当前的窗口布局。\n\
  \n*   **浮动 (Float)**：将窗口从主窗口框中分离。这让你能够独立于应用程序移动窗口。你可以浮动单个窗口或窗口组。一旦浮动窗口，你就可以对其进行停靠（重新附加）、调整大小、最大化、移动或关闭。浮动在使用多个显示器时尤为有用。图\
  \ 8.7 显示了从主窗口框分离的浮动窗口。\n![](img/image4628.jpg)\n    图 8.7 浮动窗口\n*   **最小化 (Minimize)**：隐藏窗口或窗口组，在边缘创建一个标签。这会将窗口放入边缘的滑动模式之一。你无法最小化编辑器窗口。通过悬停在此标签上可以查看窗口。你可以通过停靠它或点击侧边栏中的恢复全部按钮来恢复窗口或窗口组。图\
  \ 8.8 显示了两个最小化的窗口：资源管理器窗口和属性窗口。可以通过鼠标悬停在其标签上临时查看。\n    ![](img/image634.jpg)\n \
  \   图 8.8 查看最小化窗口\n*   **停靠 (Dock)**：重新附加浮动窗口或窗口组。它还可以恢复最小化的窗口。\n*   **最大化 (Maximize)**：这是一个切换。如果窗口是停靠的，最大化使其占据整个窗口框。其他窗口将沿边缘最小化，但状态栏仍然可见。如果窗口是浮动的，最大化使其占据整个显示器（顶部菜单除外）。取消选择时，窗口恢复到之前的大小。要将最大化的浮动窗口恢复到停靠大小，请重新停靠。你也可以双击窗口标签来切换最大化操作。\n\
  *   **关闭 (Close)**：从窗口框移除窗口或窗口组。根据应用程序，可能会提示保存未保存的数据。\n*   **大小 (Size)**：显示所选窗口的尺寸。\n\
  *   **克隆 (Clone)**：复制窗口及其内容。也就是说，你在第一个中做的任何操作都会在第二个中重复。\n*   **新建标签组 (New Tab Group)**：为文档创建一个单独区域。\n\
  *   **折叠标签组 (Collapse Tab Group)**：将两个或文档合并为一个标签。\n*   **重置 (Reset)**：从顶层将窗口恢复到默认设置。\n\
  \n### 限制窗口系统的行为\n你可以通过以下方式限制窗口系统的行为：\n1. 选择你的 NetBeans 应用程序节点，右键点击并选择 Branding。\n\
  2. 当 Branding 对话框出现时，选择 Window 标签。默认选中了所有行为。取消你想要移除的行为并点击 OK。图 8.9。\n\n![](img/image4654.jpg)\n\
  图 8.9 限制窗口系统\n\n### 单独限制窗口\n你也可以在“新建”向导中通过选择特定限制来限制单个窗口的行为，如第 354 页的图 8.14 所示，或者通过\
  \ `TopComponent` 构造函数中的客户端属性实现。选项详情参见第 363 页的“TopComponent Properties”。\n\n## 窗口切换\n\
  在 NetBeans 应用程序中，最多有一个窗口是活跃（拥有焦点）。你可以使用组合键 `CTRL-TAB` 循环遍历所有打开的窗口以选择不同的打开窗口，如图 8.10\
  \ 所示。\n\n![](img/image4662.jpg)\n图 8.10 使用 CTRL-TAB 切换活动窗口\n\n## 标签自定义\n你可以在工具/选项（Windows）或\
  \ NetBeans 偏好对话框（Mac OS X）下的杂项/窗口（Miscellaneous/Windows）中配置编辑器标签位置，如图 8.11 所示。选择所需的标签位置单选按钮和/或多行复选框。（注意，多行选项在\
  \ Mac 环境下不提供多行行为。）\n\n![](img/image4668.jpg)\n图 8.11 配置标签位置和多行标签\n\n## 窗口管理器\nNetBeans\
  \ 平台窗口系统包含一个管理器，用于跟踪应用程序的窗口、模式、窗口组和角色。提供自己的窗口管理器是可能的，但大多数应用程序开发者使用标准窗口管理器。表 8.1\
  \ 列出了查找模式、TopComponents、TopComponentGroups 和已打开的 TopComponents 的几种有用方法。\n\n![](img/image4676.jpg)\n\
  表 8.1 窗口管理器实用方法\n\n## 8.2 TopComponent 基础\n让我们从最基本的单元——`TopComponent` 开始探索 NetBeans\
  \ 平台窗口系统。你在第 343 页的图 8.1 中看到的每个窗口都是 `TopComponent`。事实上，你应用程序中的任何窗口都是 `TopComponent`（对话框和向导视觉面板除外）。在最形式的形式，`TopComponent`\
  \ 的创建简单且易于使用，因为管理它的大部分工作都由 NetBeans 平台窗口管理器处理。\n\n\n\n\n\n### 构建示例\n\n要构建本章节及其他章节的示例，请创建一个名为\
  \ `WindowSystemApp` 的新 NetBeans 应用程序。然后创建一个名为 `PersonEditor` 的新 NetBeans 模块，如图图\
  \ 8.12 所示![](img/image4686.jpg)图 8.12 WindowSystemApp 示例应用程序和 PersonEditor 模块\n\n\
  使用 `New Window` 向导按照以下步骤创建一个 `TopComponent`。\n\n1. 选择目标模块的源码包（在示例中为 `com.asgteach.personeditor`），右键点击并选择\
  \ `New | Other`。\n2. `New File` 向导会显示 `Choose File Type` 对话框。在 `Categories` 下选择\
  \ `Module Development`，在 `File Type` 下选择 `Window`。点击 `Next`，如图图 8.13 所示![](img/image4698.jpg)图\
  \ 8.13 使用 New Window 向导创建新的 TopComponent\n`New Window` 向导接下来需要窗口的基本特征详细信息。`Window\
  \ Position` 指其模式；从下拉选择中选择可用模式。`Redefine` 按钮允许你创建新模式并自定义布局设计。我们将在本章稍后的部分检查模式和布局设计。\n\
  其余选项允许你指定窗口的行为。你可以选择禁用任意数量的标准功能，例如窗口是否可以最大化、是否允许滑动以及对话框中列出的其他行为。我们将在第 363 页的“TopComponent\
  \ Client Properties”中详细讨论这些功能。\n3. 对于 `Window Position`，选择 `mode editor`。当你选择 `editor`\
  \ 时，涉及动的选项将被禁用，因为 `editor` 模式的窗口不能滑动（最小化）。\n4. 对于其余选项，除了 `Open on Application Start`\
  \ 之外，取消所有项目的勾选，该项应勾选，如图图 8.14 所示![](img/image4706.jpg)图 8.14 指定 TopComponent 的基本设置\n\
  5. `New Window` 向导会显示 `Name`、`Icon` 和 `Location` 对话框。为 `Name` 指定 `Person`。对于 `Icon`，可选地提供一个合适的\
  \ 16 x 16 GIF 或 PNG 图形。确保 `Project` 为 `PersonEditor` 且 `Package` 为 `com.asgteach.personeditor`。点击\
  \ `Finish`，如图图 8.15 所示![](img/image4712.jpg)图 8.15 命名你的 TopComponent 并可选地提供图标\n\n\
  **TopComponent 提示**\n图标并不限于 16 x 16 的图形，但较大的格式不符合组件标签页和菜单项的大小限制。请使用本书下载包中找到的文件 `personIcon.png`。\n\
  \n当向导完成时，一个新的 GUI 组件文件 `PersonTopComponent.java` 会出现在你模块的项目窗口中。该文件将在 `Form Design`\
  \ 编辑器中打开。\n现在运行 `WindowSystemApp`，你将看到一个名为 `Person` 的单窗口应用程序（标签页上有一个图标），如图图 8.16\
  \ 所示![](img/image4724.jpg)图 8.16 运行中的 WindowSystemApp 显示 PersonTopComponent 窗口\n\
  打开顶层 `Window` 菜单，你可以在可以打开的列表中看到 `Person` 窗口（带有其图标）。![](img/image4724.jpg)图 8.16（注：此处图片描述可能重复）\n\
  注意，如果你现在从 `Window` 菜单中选择 `Person`，什么都不会发生，因为 `Person` 窗口已经打开了。默认情况下，`New Window`\
  \ 向导创建一个 `TopComponent` 单例；也就是说，在任何时间最多存在一个类型的窗口。\n关闭 `Person` 窗口。现在从 `Window` 菜单中选择\
  \ `Person`，你会看到 `Person` 窗口在窗口框中重新打开。\n\n### TopComponent Java 代码\n返回 `PersonTopComponent.java`get\
  \ `Source` 视图中打开代码（选择 Java 编辑器顶部的 `Source` 按钮）。Listing 8.1 显示了为此 `TopComponent`\
  \ 创建的 Java 源码的第一部分，包含了配置窗口的注解。请注意，这是 `New Window` 向导生成的默认代码。我们将在下文中详细描述这些注解。\n\n\
  **TopComponent 提示**\n`New Window` 向导创建一个单例 `TopComponent`，且注解假设它是单例 `TopComponent`。要创建非单例的\
  \ `TopComponent`，请参见第 364 页的“Creating Non-Singleton TopComponents”。\n\n### Listing\
  \ 8.1 PersonTopComponent.java—第一部分（注解）\n点击此处查看代码\n\n```java\nimport org.netbeans.api.settings.ConvertAsProperties;\n\
  import org.openide.awt.ActionID;\nimport org.openide.awt.ActionReference;\nimport\
  \ org.openide.util.NbBundle;\nimport org.openide.windows.TopComponent;\n\n@ConvertAsProperties(dtd\
  \ = \"-//com.asgteach.personeditor//Person//EN\",\nautostore = false)\n@TopComponent.Description(preferredID\
  \ = \"PersonTopComponent\",\niconBase = \"com/asgteach/personeditor/personIcon.png\"\
  ,\npersistenceType = TopComponent.PERSISTENCE_ALWAYS)\n@TopComponent.Registration(mode\
  \ = \"editor\", openAtStartup = true)\n@ActionID(category = \"Window\",\n    id\
  \ = \"com.asgteach/personeditor.PersonTopComponent\")\n@ActionReference(path = \"\
  Menu/Window\", position = 333)\n@TopComponent.OpenActionRegistration(displayName\
  \ = \"#CTL_PersonAction\",\npreferredID = \"PersonTopComponent\")\n@Messages({\n\
      \"CTL_PersonAction=Person\",\n    \"CTL_PersonTopComponent=Person Window\",\n\
      \"HINT_PersonTopComponent=This is a Person window\"\n})\npublic final class\
  \ PersonTopComponent extends TopComponent {\n. . . class code, see Listing 8.2 .\
  \ . .\n}\n```\n\n\n\n\n\n新窗口向导提供的注解用于配置窗口。这包括指定其持久化属性、将窗口分配到某种模式、提供 ID，以及创建并注册用于打开窗口的动作。此配置假设\
  \ `TopComponent` 是单例。\n\n### @ConvertAsProperties\n`@ConvertAsProperties` 注解指定 `TopComponent`\
  \ 支持持久化 `TopComponent` 设置。元素 `dtd` 标识文档类型定义 (DTD)，且必须是唯一的命名空间。（你不需要定义 DTD。）通过此注解，你为\
  \ `readProperties()` 和 `writeProperties()` 方法提供代码（新窗口向导会生成这些方法）。使用这些读取/写入方法来持久化与此\
  \ `TopComponent` 关联的自定义设置。你应该持久化所需的信息，以便在重启时能够正确地重建你的组件。\n\n窗口管理器会在应用程序关闭时调用 `writeProperties()`，并在应用程序重启时调用\
  \ `readProperties()`。使用 `ConvertAsProperties` 时，请确保将 `TopComponent.Description`\
  \ 元素的 `persistenceType` 设置为 `TopComponent.PERSISTENCE_ALWAYS` 或 `TopComponent.PERSISTENCE_ONLY_OPENED`（下文将讨论）。\n\
  \n### @TopComponent.Description\n`@TopComponent.Description` 注解包含要素元素 `preferredID`\
  \ 以及可选元素 `iconBase` 和 `persistenceType`。在窗口管理器中，你可以使用 `preferredID` 查找或识别 `TopComponent`。元素\
  \ `preferredID` (`String`) 设置 `TopComponent` 的 ID。元素 `iconBase` (`String`) 提供了 `TopComponent`\
  \ 图标的路径名。该图形应为 16x16 像素的 PNG 或 GIF 文件。元素 `persistenceType` (`int`) 指定了 `TopComponent`\
  \ 的持久化行为。\n\n如果你希望在每次重启后都保持持久化——即使窗口从未被打开过——请使用 `TopComponent.PERSISTENCE_ALWAYS`。这是默认设置，应仅用于单例\
  \ `TopComponents`。如果你不希望任何持久化，请使用 `TopComponent.PERSISTENCE_NEVER`。使用此设置时，你应该删除注解\
  \ `@ConvertAsProperties` 以及 `readProperties()` 和 `writeProperties()` 方法。最后，使用 `TopComponent.PERSISTENCE_ONLY_OPENED`\
  \ 在窗口打开时跨越重启持久化 `TopComponent` 设置。`TopComponent` 不应动态更改其持久化设置。\n\n### @TopComponent.Registration\n\
  `@TopComponent.Registration` 注解通过元素 `mode` (`String`) 和 `openAtStartup` (`boolean`)\
  \ 将 `TopComponent` 注册到现有的某种窗口模式中。可选元素 `position` (`int`) 指定窗口在模式内的相对位置。也就是说，如果有多个\
  \ `TopComponent` 在同一模式下打开，则使用元素 `position` 来控制窗口在模式内的布局。位置值越小，窗口越靠左。元素 `roles` (`String[]`)\
  \ 提供了一个用逗号分隔的角色列表。\n\n### @ActionID\n`ActionID` 和 `ActionReference` 注解并非 `TopComponents`\
  \ 特有，但它们是允许你在应用程序中定义动作的注解。在这种情况下，定义的动作是打开窗口。`TopComponent.OpenActionRegistration`\
  \ 注解也与打开窗口的动作有关。如果你不想通过顶层菜单栏打开窗口，请从你的 `TopComponent` Java 代码中移除这些注解。`ActionID` 注解要求元素\
  \ `category`（“Window”）和 `id`，后者在类别内应是唯一的。\n\n### @ActionReference\n`@ActionReference`\
  \ 注解使用元素 `path` 和可选元素 `position` 分配由 `@ActionID` 标识的动作。元素 `path` 被新窗口向导设置为 `\"Menu/Window\"\
  `，这意味着顶层菜单栏的窗口菜单。其他可能性是 `\"Toolbar/Edit\"` 或 `\"Shortcuts\"`，带有 `name=\"key_sequence\"\
  ` 指定键盘快捷键（例如）。元素 `position` 指菜单项在指定窗口或工具栏中的位置。你还可以通过可选元素 `separatorBefore` 和 `separatorAfter`\
  \ 指定菜单项分隔符。\n\n### @TopComponent.OpenActionRegistration\n`@TopComponent.OpenActionRegistration`\
  \ 注解配合 `@ActionID` 和 `@TopComponent.Description` 使用，创建一个打开窗口的动作。要素元素 `displayName`\
  \ 是显示的动作名称（菜单项），可选元素 `preferredID` 应与 `@TopComponent.Description` 中的 `preferredID`\
  \ 元素匹配。\n\n### @Messages\n当你有需要向用户显示的文本时，请使用 `@Messages` 注解。这确保了你的应用程序可以进行国际化和本地化。对于\
  \ `TopComponent`，`@Messages` 用于菜单项文本、窗口显示名称以及工具提示文本。你可以根据需要对这些进行自定义。\n\n***\n\n\
  **TopComponent Tip**\n如果你对 `TopComponent` 做了配置更改，在运行应用程序之前执行“全部清理”（Clean All）和“全部生成”（Build\
  \ All），因为生成过程会生成组件配置文件。这确保了你的组件配置正确。或者，也可以从文件窗口删除应用程序目录下的 `build/testuserdir/config`\
  \ 目录。\n\n***\n\n[Listing 8.2] 显示了 `TopComponent` 剩余生成的 Java 代码，下文将讨论。\nListing 8.2\
  \ `PersonTopComponent.java`——第二部分 (TopComponent Java 代码)\n\n```java. . . annotations\
  \ omitted, see Listing 8.1 . . .\n\npublic final class PersonTopComponent extends\
  \ TopComponent {\n\n    public PersonTopComponent() {\n        initComponents();\n\
  \        setName(Bundle.CTL_PersonComponent());\n        setToolTipText(Bundle.HINT_PersonComponent());\n\
  \    }\n\n    private void initComponents() {\n        . . code omitted .\n    }\n\
  \n    @Override\n    public void componentOpened() {\n        // TODO 在组件打开时添加自定义代码\n\
  \    }\n\n    @Override\n    public void componentClosed() {\n        // TODO 在组件关闭时添加自定义代码\n\
  \    }\n\n    void writeProperties(java.util.Properties p) {\n        // 建议从初始版本开始对设置进行版本控制，正如\
  \ http://wiki.apidesign.org/wiki/PropertyFiles 所\n        p.setProperty(\"version\"\
  , \"1.0\");\n        // TODO 存储你的设置\n    }\n\n    void readProperties(java.util.Properties\
  \ p) {\n        String version = p.getProperty(\"version\");\n        // TODO 根据版本读取你的设置\n\
  \    }\n\n}\n```\n\n\n\n\n注意，`TopComponent` 具有公共的默认构造函数，这样系统就可以创建 `TopComponent`\
  \ 实例。使用 Matisse 设计编辑器创建的任何 GUI 组件都会生成 `initComponents()` 方法。此代码无法在 Java 编辑器中编辑，但你可以使用\
  \ GUI 组件调板和属性窗口配置组件并提供其他自定义代码。\n\n`componentOpened()` 和 `componentClosed()` 方法是\
  \ `TopComponent` 的生命周期方法。它们的常见用途是在 `componentOpened()` 中添加事件监听器，并在 `componentClosed()`\
  \ 中移除它们。其他生命周期方法还有 `componentActivated()`、`componentDeactivated()`、`componentHidden()`\
  \ 和 `componentShowing()`。我们将在第 [369] 页的“窗口系统生命周期管理”中详细讨论这些方法。最后，`readProperties()`\
  \ 和 `writeProperties()` 方法根据其配置的持久化类型（下文将讨论）对你的窗口设置进行持久化。\n\n## 窗口头部动画通知\n\n`TopComponent`\
  \ 的窗口头部（其页签）包含一个可选图标和窗口显示名称。你可以通过 `TopComponent` 方法 `makeBusy(true)` 显示一个动画通知，表示窗口当前正在忙（例如，正在加载窗口内容）。使用\
  \ `makeBusy(false)` 关闭动画通知。图 8.17 显示了一个头部带有动画“等待”图图标的 `TopComponent`。\n\n![](img/image4786.jpg)\n\
  图 8.17 TopComponent 动画通知出现在其窗口页签中\n\n## 8.3 TopComponent 持久化\n\n注解控制你的 `TopComponent`\
  \ 的持久化行为。对于单例 `TopComponents`，请定义注解 `@ConvertAsProperties` 并将持久化类型设置为 `PERSISTENCE_ALWAYS`\
  \ 或 `PERSISTENCE_ONLY_OPENED` 之一，这在第 [357] 页的“@ConvertAsProperties”和“@TopComponent.Description”中有所讨论。\n\
  \n通过持久化，NetBeans Platform 会保存你的窗口配置（其大小、模式以及窗口是否打开）。你还可以通过 `writeProperties()` 和\
  \ `readProperties()` 方法持久化特定于你的 `TopComponent` 实例的额外 `String` 数据。\n\n为了演示，让我们在 `PersonTopComponent`\
  \ 中添加标签和文本字段，并持久化 `textfield` 中输入的文本。现在用户在 `textfield` 中输入的任何 `String` 都将跨越重启进行持久化。图\
  \ 8.18 显示了组件设计视图中添加的 `JLabel` 和 `JTextField`。\n\n![](img/image4793.jpg)\n图 8.18\
  \ PersonTopComponent 设计视图\n\n`JTextField` 的文本（变量名为 `nameTextField`）被作为属性 \"name\"\
  \ 持久化并在随后恢复，如代码列表 8.3 所示。添加的代码已加粗显示。\n\n代码列表 8.3 方法 `writeProperties()` 和 `readProperties()`\n\
  点击此处查看代码图片\n\n* * *\n\n```\npublic final class PersonTopComponent extends TopComponent\
  \ {\n\n. . . omitted code . . .    void writeProperties(java.util.Properties p)\
  \ {\n\n        // 建议从初始版本开始对设置进行版本控制如下\n\n        // http://wiki.apidesign.org/wiki/PropertyFiles\n\
  \        p.setProperty(\"version\", \"1.0\");\n        p.setProperty(\"name\", nameTextField.getText());\n\
  \    }\n\n    void readProperties(java.util.Properties p) {\n        String version\
  \ = p.getProperty(\"version\");\n        nameTextField.setText(p.getProperty(\"\
  name\"));\n    }\n}\n```\n\n* * *\n\n现在在重启时，`textfield` 不再是空白，而是包含用户之前输入的 `String`，如图\
  \ 8.19 所示。\n\n![](img/image4808.jpg)\n图 8.19 PersonTopComponent 设计视图\n\n* * *\n\n\
  ### TopComponent 提示\n注意，`writeProperties()` 和 `readProperties()` 方法操作的是 `java.util.Properties`\
  \ 流。属性列表中的每个键及其对应的值都是 `String`。\n\n* * *\n\n## NetBeans 将用户数据存储在哪里？\n\nNetBeans\
  \ 将组件数据存储在应用程序的用户配置系统的 `config/Windows2Local/Components` 目录下。对于我们的应用程序，窗口系统会创建 XML\
  \ 文件 `PersonTopComponent.settings`。代码列表 8.4 显示了其内容。在这里，属性 \"name\" 的值为 \"Smith\"\
  。\n\n代码列表 8.4 `TopComponent.settings`\n点击此处查看图片\n\n* * *\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE properties PUBLIC \"-//Sun//DTD Properties-1.0//EN\
  \ \"http://www.sun.com/dtd/properties.dtd\">\n<properties>\n<property name=\"version\"\
  \ value=\"1.0\"/>\n<property name=\"name\" value=\"\"/>\n</properties>\n```\n\n\
  * * *\n\n在开发期间，配置数据生成并存储在项目的 `build/testuserdir/config/Windows2Local/Components`\
  \ 中。然而，当你打包应用程序时，该用户目录取决于操作系统和发布方法。在使用 zip 分发的 Mac OS 上，位于 `User_Home/Library/Application\
  \ Support`。在使用 zip 分发的 Windows 系统上，它位于……我们将在第 17 章中详细讨论品牌和应用程序发布。\n\n## 8.4 TopComponent\
  \ 客户端属性\n\n当你使用新窗口向导时，可以选择适用于该窗口的行为限制。这会在窗口的 `TopComponent` 构造函数中生成客户端属性设置，如列表 8.5\
  \ 所示。你之后可以编辑 `TopComponent` 构造函数并添加或删除任何属性设置。\n\n代码列表 8.5 TopComponent 客户端属性设置\n\
  点击此处查看代码图片\n\n* * *\n\n```java\npublic final class LimitedTopComponent extends TopComponent\
  \ {\n\n    public LimitedTopComponent() {\n        initComponents();\n        setName(Bundle.CTL_LimitedTopComponent());\n\
  \        setToolTipText(Bundle.HINT_LimitedTopComponent());\n        putClientProperty(TopComponent.PROP_CLOSING_DISABLED,\
  \ Boolean.TRUE);\n        putClientProperty(TopComponent.PROP_DRAGGING_DISABLED,\
  \ Boolean.TRUE);\n        putClientProperty(TopComponent.PROP_MAXIMIZATION_DISABLED,\
  \ Boolean.TRUE);\n        putClientProperty(TopComponent.PROP_SLIDING_DISABLED,\
  \ Boolean.TRUE);\n        putClientProperty(TopComponent.PROP_UNDOCKING_DISABLED,\
  \ Boolean.TRUE);\n        putClientProperty(TopComponent.PROP_KEEP_PREFERRED_SIZE_WHEN_SLIDED_IN,\
  \ Boolean.TRUE);\n    }\n}\n```\n\n* * *\n\n\n\n\n表 8.2 描述了这些可配置的 `TopComponent`\
  \ 行为。(OEBPS/image4835.jpg)\n表 8.2 可配置的 TopComponent 行为\n\n## 8.5 创建非单例 TopComponents\n\
  \n默认情况下，“新窗口”（New Window）向导会创建一个 `TopComponent` 单例，且该向导生成的注解也假设 `TopComponent` 是单例的。然而，应用程序需要非单例的\
  \ `TopComponents` 是非常常见的情况。\n\n非单例 `TopComponents` 的一个常见用例是某种编辑器窗口，用户可以在其中打开一个文件或领域对象进行编辑。在这种情况下，用户通常会选择领域对象（或文件），右键点击，并从上下文菜单中选择\
  \ `Open`（打开）。或者，用户也可以双击领域对象（或文件），让选中的对象在编辑器中打开。\n\n然而，为了恰当说明这一用例，我们需要几个我们尚未讨论过的\
  \ NetBeans Platform 特性，例如条件启用的 `Actions`。因此，现在让我们先通过简单的示例向你展示如何创建非单例窗口。（关于在编辑器中打开领域对象的完善示例，请参阅\
  \ 第 10 章 中第 488 页 的“实现更新”。）\n\n让我们继续使用 `PersonEditor` 模块中包含 `PersonTopComponent`\
  \ 的 `WindowSystemApp` 示例。在上一节中，我们创建了一个单例 `TopComponent`。代码列表 8.6 显示了创建非单例 `TopComponent`\
  \ 的更改。当你决定创建一个非单例 `TopComponent` 时，你还必须选择一种持久化行为。你有两个选择：\n\n1. 在注解 `@TopComponent.Description`\
  \ 中指定 `PERSISTENCE_NEVER`。在这种情况下，移除注解 `@ConvertAsProperties` 以及方法 `writeProperties()`\
  \ 和 `readProperties()`。使用这种持久化类型，你的窗口设置将不会跨重启保存。\n2. 在注解 `@TopComponent.Description`\
  \ 中指定 `PERSISTENCE_ONLY_OPENED`。通过此设置，你保留注解 `@ConvertAsProperties` 以及方法 `writeProperties()`\
  \ 和 `readProperties()`。只有在应用程序关闭时处于打开的窗口会被保存并在重启后恢复。这意味着如果窗口在应用程序关闭之前被关闭，即使它之前被持久化了，它也不会在下次重启时出现。\n\
  \n***\n\n**TopComponent 提示**\n千万不要为非单例 `TopComponents` 指定 `PERSISTENCE_ALWAYS`。否则，曾经创建的每个\
  \ `TopComponent` 实例将在关闭时被持久化，即使相关的领域对象或文件已被删除。保存的窗口随时间推移而积累，浪费磁盘空间并减慢启动速度。\n\n***\n\
  \n在代码列表 8.6 中，我们指定了 `PERSISTENCE_ONLY_OPENED`，因此保留了注解 `@ConvertAsProperties` 以及方法\
  \ `writeProperties()` 和 `readProperties()`。\n\n列表 8.6 `PersonTopComponent.java`——非单例窗口\
  \ 点击此处查看代码图片\n\n***\n\n```java\n@ConvertAsProperties(dtd = \"-//com.asgteach.personeditor//Person//EN\"\
  ,\n   autostore = false)\n@TopComponent.Description(preferredID = \"PersonTopComponent\"\
  ,\n   iconBase = \"com/asgteach/personeditor/personIcon.png\",\npersistenceType\
  \ = TopComponent.PERSISTENCE_ONLY_OPENED)\n@TopComponent.Registration(mode = \"\
  editor\", openAtStartup = false)\n@ActionID(category = \"Window\",\n   id = \"com.asgteach.personeditor.PersonTopComponent\"\
  )\n@ActionReference(path = \"Menu/Window\", position = 333)\n@TopComponent.OpenActionRegistration(displayName\
  \ = \"#CTL_PersonAction\"\n//,preferredID = \"PersonTopComponent\"\n       )\n@Messages({\n\
  \   \"CTL_PersonAction=Person\",\n   \"CTL_PersonTopComponent=Person Window\",\n\
  \   \"HINT_PersonTopComponent=This is a Person window\"\n})\npublic final class\
  \ PersonTopComponent extends TopComponent {\n. . . code omitted . . .\n}\n```\n\n\
  ***\n\n注意，我们将注解 `@TopComponent.Registration` 中的属性 `openAtStartup` 更改为 `false`。你通常会指定此设置，因为非单例\
  \ `TopComponent` 通常与特定的领域对象或文件操作一起打开。在代码列表 8.6](#part0015.xhtml...Uw18771)中，我们还保留了创建“窗口”菜单项以及打开窗口的操作的注解。我们这样做是为了让你轻松地打开多个\
  \ `PersonTopComponent` 窗口，而无需编写专门来打开窗口的代码。但是，为了启用打开多个窗口，你必须从注解 `@TopComponent.OpenActionRegistration`\
  \ 中移除属性 `preferredID`。\n\n图 8.20 显示了运行带有三个打开的 `PersonTopComponent` 窗口的非单例 `WindowSystemApp`。每个窗口都有不同的文本框值，这些值可以跨重启保存。当应用程序重启时，不仅相同的窗口会打开，而且它们具有之前指定的文本框内容。然而，一旦关闭某个窗口，其数据将不会被持久化，该窗口在下次重启时不会打开。(OEBPS/image4862.jpg)\n\
  \n由于 `PersonTopComponent` 不再是单例 `TopComponent`，窗口系统如何持久化每个窗口的数据？回顾一下，`PersonTopComponent`\
  \ 的持久化数据存储在 `Application/build/testuserdir/config/Windows2Local/Components/PersonTopComponent.settings`\
  \ 中，使用 `TopComponent` 的 `preferredID` 生成 XML `.settings` 文件。对于同一个 `TopComponent`\
  \ 的多个实例，持久化数据存储在 `PersonTopComponent_1.settings`、`PersonTopComponent_2.settings`\
  \ 等等。\n\n###现在让我们向你展示如何在自己的代码中打开非单例 `TopComponent`；也就是说，不是从顶部的窗口菜单。首先，移除注解 `@ActionID`、`@ActionReference`\
  \ 和 `@TopComponent.OpenActionRegistration`，这些都支持顶部窗口菜单中的打开操作。代码列表 8.7 显示了移除这些注解后的\
  \ `PersonTopComponent` 代码。\n\n列表 8.7 `PersonTopComponent.java`——已移除打开注解 点击此处查看代码图片\n\
