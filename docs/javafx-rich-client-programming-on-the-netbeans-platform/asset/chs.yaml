  \ 方法 `notify()` 会显示并阻塞对话框，并返回关闭它的用户输入。如果你需要对话框在用户点击一个或多个选项按钮后保持打开，那么你必须提供一个带有 `actionPerformed()`\
  \ 方法的 `ActionListener` 来处理用户输入。我们在第 539 页的“自定义登录对话框”章节和第 544 页的“[整合”章节向你展示这种技术。\n\
  \n* * *\n\n### NotifyDescriptor.InputLine\n\n使用 `NotifyDescriptor.InputLine` 创建提示用户输入的对话框。图\
