  \ 7.12 属性弹出窗口\n\n### FilterNode\n\n`FilterNode` 允许你使用任意标准来过滤节点层级。你通过创建一个委托节点（可能具有特殊行为）和一个标准（根据该标准决定原始层级的节点是否被包含）来创建一个过滤后的节点层级。通常情况下，你通过重写原始节点中也存在的方法来实现特化。例如，如果你希望过滤后的节点具有特殊的显示方式，可以像我们在示例中做的那样，重写\
  \ `getDisplayName()` 或 `getHtmlDisplayName()`。\n\n请注意，当使用 `FilterNode` 时，你并没有“替换”原始节点或原始层级。原始层级保持完好，过滤后的层级仅影响哪些节点被包含。\n\
  \n例如，图 7.13 显示了带有过滤节点层级的性别（Gender）窗口。你在提供的文本字段中输入搜索字符串，然后按 `<Return>`即可显示名称包含该搜索字符串（忽略大小写）的节点。过滤后的层级在显示名称中使用*斜体*而不是粗体。要返回到“未过滤”的节点层级，你需要使用空搜索字符串![](img/image4308.jpg)图\
  \ 7.13 显示过滤后的节点层级\n\n`FilterNode` 是“委托”节点。一个特殊的 `Children` 类继承自 `FilterNode.Children`\
  \ 以创建验收标准。在我们的示例中，我们使用一个布尔类型的 `accept()` 方法来实现决策逻辑。让我们向你展示如何实现图 7.13 所示的过滤节点层级。\n\
