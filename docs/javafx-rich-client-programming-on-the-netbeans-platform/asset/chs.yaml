  \ 432 页上的 图 9.16）。要构建允许用户选择多个节点的上下文感知操作，你需要在“新建操作”向导中选择相应的单选按钮。然后，向导会在操作类中生成一个对应类型的\
  \ `List`。如果你在创建上下文感知操作后决定用户可以选择多个节点，可以通过将上下文类型转换为 `List` 来轻松修改操作类，如 Listing 9.13\
  \ 所示（请将其与第 434 页的 Listing 9.8 中的单选版本进行对比）。\n\n#### Listing 9.13 NodeCalendarAction.java—选择多个节点\n\
  \n```java\n... Annotations Unchanged ...\nfinal class NodeCalendarAction implements\
  \ ActionListener {\n    private final List<CalendarCapability> context;\n    public\
  \ NodeCalendarAction(List<CalendarCapability> context) {\n        this.context =\
  \ context;\n    }\n    @Override\n    public void actionPerformed(ActionEvent ev)\
  \ {\n        for (CalendarCapability calendarCapability : context) {\n         \
  \   calendarCapability.doCalendar();\n        }\n    }\n}\n```\n\n现在，当你选择多个 `PersonNodes`\
  \ 时，`Calendar` 操作将变为启用，如 图 9.20 所示。在此示例中，调用该操作会导致为每个节点显示一系列对话框。当每个对话框被关闭时，下一个将会出现。图\
  \ 9.20 日历操作允许用户选择多个 PersonNodes\n\n为了强调能力的灵活性和威力，让我们通过向 `GenderNode` 的 `Lookup`\
