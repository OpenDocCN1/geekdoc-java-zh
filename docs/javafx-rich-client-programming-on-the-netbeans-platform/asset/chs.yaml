  \            Validators.REQUIRE_VALID_INTEGER,\n            Validators.NEGATIVE_NUMBER,\n\
  \            Validators.numberRange(0, MAX_SEQUENCE_NUMBER-2));\n        firstNumber.getDocument().addDocumentListener(new\
  \ DocumentListener() {\n            @Override\n            public void insertUpdate(DocumentEvent\
  \ e) {\n                checkValidation();\n            }\n            @Override\n\
  \            public void removeUpdate(DocumentEvent e) {\n                checkValidation();\n\
  \            }\n            @Override\n            public void changedUpdate(DocumentEvent\
  \ e) {\n                checkValidation();\n            }\n            private void\
