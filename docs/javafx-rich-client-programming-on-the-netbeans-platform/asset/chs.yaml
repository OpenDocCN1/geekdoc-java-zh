  \ 10.19 在后台线程中更新 Person\n\n## 10.4 关键点总结本章向你展示了如何应用能力（capabilities）和动作（actions）来实现\
  \ NetBeans Platform 应用程序的 CRUD 操作。你还将学习如何为持久化存储实现数据库，并使用并发来保持应用程序的响应性。以下是本章的关键点：\n\
  \n*   向 `Lookup`（节点或任何对象）添加能力是自定义动作的有效方法。能力和 `Lookup` 在调用能力方法的对象与拥有该能力的对象之间提供了松耦合。\n\
  *   读取操作在 CRUD 应用程序中构建节点层次结构。\n*   NetBeans Platform 系统 `DeleteAction` 允许你挂钩到预配置的“编辑”菜单中的“删除”。若要对节点使用“删除”，请重写该节点的\
  \ `canDestroy()` 和 `destroy()` 方法。\n*   在节点的 `getActions()` 方法中添加 `DeleteAction`，以便将“删除”包含在节点的右键菜单中。\n\
  *   使用 `NewType` 和 `NewAction` 配置创建操作。重写节点的 `getNewTypes()` 方法并包含一个 `NewType` 的实现。你还可以为顶层菜单和工具栏注册创建动作。\n\
  *   通过打开/编辑动作实现更新操作。打开一个适合对领域对象更改的编辑器。非单例的 `TopComponent` 允许并发打开多个编辑器。\n*   对于更新，使用\
  \ `AbstractSavable` 来启用和禁用“保存”和“全部保存”菜单项以及工具栏图标。重写 `TopComponent` 方法 `canClose()`\
  \ 以检查在关闭编辑器之前是否应该保存未保存的更改。\n*   实现 `AbstractSavable` 以提供保存操作。\n*   检测已打开的领域对象已被删除并优雅地关闭编辑器。\n\
  *   当服务提供程序执行数据库操作时，迁移到数据库实现是非常直接的。\n*   为应用程序所需的库 JAR 文件创建库封装模块（Library Wrapper\
  \ Modules）。这会将库集成到 NetBeans 模块系统中。\n*   `JavaDB` 提供了一个内置在 NetBeans Platform 中的数据库。\n\
  *   `EclipseLink` 提供了 Java Persistence API (`JPA`) 的实现，用于与底层数据库接口。\n*   创建或使用 NetBeans\
  \ 生成实体类和持久化单元，定义应用程序的 JPA/数据库属性。\n*   为了保持 NetBeans Platform 应用程序的响应性，使用 `SwingWorker`\
  \ 和 `Nodes` API 的异步模式在后台执行数据库访问。\n*   使用进度指示器提供反馈。\n\n## 11 对话框\n在应用程序的某些时刻，你需要显示对话框来与用户通信。NetBeans\
  \ Platform 有了一系列对话框：简单消息、是/否确认、确定/取消。在本章中，我们将探索所有这些。\n\n## 你将学到\n*   创建标准对话框。\n\
  *   处理用户响应。\n*   自定义标准对话框。\n\n## 11.1 对话框概述\nNetBeans Platform 提供了若干类帮助你创建、显示和配置对话框。要使用该框架，请在你的模块中指定依赖项。\n\
  \n*   `Dialogs` 类类似于 `JOptionPane`，但它们提供了以下功能：\n    *   `Dialogs` 自动在可视区域居中。\n \
  \   *   你可以使用 `ESC` 键关闭对话框。\n*   `NotifyDescriptor` 提供了标准的界面。\n*   你可以自定义任何对话框，但很多时候没有必要自定义。\n\
  *   你可以选择地提供自己的面板。\n\n## 11.2 标准对话框\n让我们首先查看最简单形式的标准对话框。`NotifyDescriptor` 包含了几个定义特定类型对话框的子类。\n\
  \n`NotifyDescriptor.Message` 用于传递消息，如图 11.1 图 11.1 标准信息对话框\n\n列表 11.1 创建了图 11.1;\n\
  DialogDisplayer.getDefault().notify(nd); // 显示并阻塞\n```\n\n`NotifyDescriptor.Message`\
  \ 的变体包括警告消息和错误消息。图 11.2 显示了一个警告消息。\n\n![](img/image6813.jpg)图 11.2 标准警告对话框\n\n列表\
