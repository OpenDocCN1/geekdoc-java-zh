  \ `Menu` 文件夹。）\n\n`Layer` 文件由四个主要标签组成：`<filesystem>`, `<folder>`, `<file>` 和 `<attr>`。\n\
  \n* `<filesystem>` 标签定义了整个文件系统，并与磁盘上的实际文件系统合并，特别是 `SystemFileSystem`。你可以使用文件系统 API\
  \ 类 `FileUtil` 来访问根目录。（我们将在本章稍后部分演示如何操作。）\n* `<folder>` 标签定义文件系统中的文件夹（即目录）。这些通过文件系统\
  \ API 类 `FileObject` 访问，且 `isFolder()` 方法对文件夹返回 `true`。\n* `<file>` 标签引用一个文件，也可以通过\
  \ `FileObject` 类访问。在这种情况下，`isFolder()` 返回 `false`。\n* `<attr>` 标签定义属性，即通过 `String`\
  \ 名称标识的任意对象。通过之前显示的 `FileObject.getAttribute(name)` 访问属性（请参见第 637 页的 `FileObject\
  \ Attributes`）。有关显示 getter 和 setter 的示例，请参阅第 645 页的 Listing 13.10 和第 647 页的 Listing\
  \ 13.1。Listing 13.15 生成 Layer 中的“Actions”点击此处查看图片\n\n* *\n\n```xml\n<filesystem>\n\
  \  <folder name=\"Actions\">\n    <folder name=\"Tools\">\n      <file name=\"com-asgteach-appuserfile-ConfigFileAction.instance\"\
  >\n        <!--com.asgteach.appconfigfile.ConfigFileAction-->\n        <attr value=\"\
  com.asgteach.appconfigfile.Bundle#CTL_ConfigFile\" name=\"displayName\"/>\n    \
  \    <attr value=\"org.openide.awt.Actions.alwaysEnabled\" name=\"instanceCreate\"\
  />\n        <attr value=\"com.asgteach.appconfigfile.ConfigFileAction\" name=\"\
  delegate\"/>\n        <attr value=\"com/asgteach/appconfigfile/Favorites.png\" name=\"\
  iconBase\"/>\n        <attr value=\"false\" name=\"noIconInMenu\"/>\n      </file>\n\
  \    </folder>\n  </folder>\n  <folder name=\"Toolbars\">\n    <folder name=\"File\"\
  >\n      <file name=\"com-asgteach-appuserfile-ConfigFileAction.shadow\">\n    \
