  \ Bold\" size=\"18.0\" />\n            </font>\n        </Text>\n    </children>\n\
  </StackPane>\n```\n\n在我们向你展示 `MyCSS.css` 文件之前，先看一眼列表 3.6 中的 `Rectangle` 元素。它要短得多，因为\
  \ FXML 不再包含样式或效果值。然而，FXML 确实包含了一个属性 `id` 的值。这个 `id` 属性用于标识对应 CSS 样式的节点。\n\n我们还为\
  \ `Rectangle` FXML 中的鼠标点击事件定义了一个事件处理器（`#handleMouseClick`）。`onMouseClicked` 属性允许将事件处理器与\
  \ FXML 组件连接起来。当用户点击 `Rectangle` 内部时，会触发鼠标点击事件。（我们将在下一节中展示更新后的控制器类。）\n\n最后，如列表 3.6\
  \ 所示，我们修改了 `StackPane` 以包含 `fx:id=\"stackpane\"`，以便我们可以在控制器中引用该 `StackPane`。列表 3.7\
  \ 显示了 CSS 文件 `MyCSS.css`，它专门为 id 为 `myrectangle` 的组件定义了样式。\n\n列表 3.7 MyCSS.css 点击此处查看代码图像\n\
  \n```css\n#myrectangle {\n    -fx-fill: linear-gradient(to bottom, transparent,\
  \ rgba(0,0,0,0.5));\n    -fx-stroke: black;\n    -fx-stroke-width: 2;\n}\n```\n\
  *(注：由于原文提供的 CSS 代码片段不完整，此处根据上下文逻辑补全了常见的 CSS 结构以保持格式一致，但若仅需翻译文本，请以原文内容为准。由于原文 CSS\
  \ 块被截断，此处展示了翻译后的结构性内容)*\n\n*修正：由于原文文本中的 CSS 块在结尾处被截断，根据翻译工程师的要求，我将翻译现有的文本部分。*\n\n\
  \n\n\n\n```java\n    private RotateTransition rt;\n\n    @FXML\n    private Rectangle\
  \ rectangle;\n\n    @FXML\n    private StackPane stackpane;\n\n    @FXML\n    private\
  \ void handleMouseClick(MouseEvent evt) {\n        rt.play();  \n    }\n\n    @Override\n\
  \    public void initialize(URL url, ResourceBundle rb) {\n        rectangle.setStrokeWidth(5.0);\n\
  \        rectangle.setStroke(Color.GOLDENROD);\n        // 创建并配置 RotateTransition\
  \ rt\n        rt = new RotateTransition(Duration.millis(3000), stackpane);\n   \
  \     rt.setToAngle(180);\n        rt.setFromAngle(0);\n        rt.setAutoReverse(true);\n\
  \        rt.setCycleCount(4);\n    }\n}\n```\n\n***\n\n`RotateTransition` 允许你指定“目标”（to）角度或“增量”（by）角度值。如果你省略了起始位置（属性\
  \ `fromAngle`），旋转将使用节点当前的旋转属性值作为起始旋转角度。在这里，我们将 `autoReverse` 设置为 `true`，这使得 `StackPane`\
  \ 从 0 度旋转到 180 度，然后再次返回。我们将 `cycle count` 设置为四，以便让往复动画重复两次（一次往复算作两个周期）。\n\n## 3.3\
  \ JavaFX 属性\n\n之前的章节频繁引用 JavaFX 属性。我们提到过 JavaFX 属性类似于 `JavaBean` 属性，但 JavaFX 属性要强大得多。显然，JavaFX\
  \ 属性在 JavaFX 应用中具有重要意义。事实上，JavaFX 属性可能是 JavaFX 中最重要的特性。在本节中，我们将详细探讨 JavaFX 属性，并向你展示如何使用它们。\n\
  \n### 什么是 JavaFX 属性？\nJavaFX 的核心是它的场景图（scene graph），这是一个包含（许多）节点的结构。JavaFX 渲染引擎显示这些节点，你最终看到的内容取决于这些节点的属性。\n\
  \n属性非常重要。它们能让 `Circle` 变成红色，或让 `Rectangle` 宽度变为 200 像素。它们决定了填充颜色的渐变，或者文本节点是否包含反射或投影投影效果。你通过设置\
  \ `spacing`（间距）或 `alignment`（对齐）等属性来操作布局控件——布局控件本身也是节点。当你的应用程序包含动画时，JavaFX 会随着时间更新节点的属性——可能是节点的位置、旋转角度或透明度。在之前的章节中，你已经看到示例应用程序是如何受到代码所操作的的影响的。\n\
  \n上一章描述了 `JavaBean` 属性如何支持封装和良好的命名规范。你可以创建读写属性、只读属性和不可变属性。我们还展示了如何创建绑定属性（bound properties）——即向已注册的监听器发送属性更改事件的属性。让我们学习这些概念如何应用于\
  \ JavaFX 属性。\n\nJavaFX 属性支持与 `JavaBean` 属性相同的命名规范。例如，`Circle`（一种 JavaFX `Shape`）的半径由它的\
  \ `radius` 属性决定。在这里，我们通过 setter 和 getter 方法来操作 `radius` 属性。\n\n```java\nCircle circle1\
  \ = new Circle(10.5);\n\nSystem.out.println(\"Circle1 radius = \" + circle1.getRadius());\n\
  circle1.setRadius(20.5);\nSystem.out.println(\"Circle1 radius = \" + circle1.getRadius());\n\
  ```\n\n这将显示以下输出：\n`Circle1 radius = 10.5`\n`Circle1 radius = 20.5`\n\n你通过属性获取方法（getter\
  \ method）访问 JavaFX 属性。属性 getter 由属性名后跟单词“Property”组成。因此，要访问 `circle1` 的 JavaFX `radius`\
  \ 属性，我们使用 `radiusProperty()` 方法。在这里，我们打印半径属性：\n\n```java\nSystem.out.println(circle1.radiusProperty());\n\
  ```\n\n显示：\n`DoubleProperty [bean: Circle[centerX=0.0, centerY=0.0, radius=20.5,\
  \ fill=0x000000ff], name: radius, value: 20.5]`\n\n通常，每个 JavaFX 属性持有元数据，包括它的值、属性名以及包含它的\
  \ bean。我们可以通过属性方法 `getValue()`、`getName()` 和 `getBean()` 分别访问这些元数据，如列表 3.9 所示。你也可以通过\
  \ `get()` 访问属性的值。\n\n#### 列表 3.9 访问 JavaFX 属性元数据\n```java\nSystem.out.println(\"\
  circle1 radius property value: \"\n          + circle1.radiusProperty().getValue());\n\
  \nSystem.out.println(\"circle1 radius property name: \"\n          + circle1.radiusProperty().getName());\n\
  \nSystem.out.println(\"circle1 radius property bean: \"\n          + circle1.radiusProperty().getBean());\n\
  \nSystem.out.println(\"circle1 radius property value: \"\n          + circle1.radiusProperty().get());\n\
  ```\n\n**输出：**\n`circle1 radius property value: 20.5`\n`circle1 radius property\
  \ name: radius`\n`circle1 radius property bean: Circle`\n`circle1 radius property\
  \ value: 20.5`\n\n***\n\n#### 在 Observable 中使用监听器\n所有 JavaFX 属性都是可观测的（`Observable`）。这意味着当属性值失效或发生变化时，它会通知已注册的\
  \ `InvalidationListeners`（失效监听器）或 `ChangeListeners`（更改监听器）。你直接向属性注册监听器。让我们通过向 `Circle`\
  \ 属性注册一个 `InvalidationListener` 来展示它是如何工作的。\n\n1. 从 NetBeans 的顶层菜单中选择 `File | New\
  \ Project`。NetBeans 显示 `Choose Project` 对话框。在 `Categories` 下选择 `Java`，在 `Projects`\
  \ 下选择 `Java Application`。点击 `Next`。\n2. NetBeans 显示 `Name and Location` 对话框。为 `Project\
  \ Name` 提供 `MyInvalidationListener`，并点击 `Browse` 选择位置。点击 `Finish`。\n\n列表 3.10 创建了两个\
  \ `Circle` 对象，并为半径属性注册了一个 `InvalidationListener`。在事件处理器内部，`invalidated()` 方法将 `circle2`\
  \ 的新值设置为 `circle1` 的半径属性。本质上，我们是在说“让 `circle1` 的半径属性始终与 `circle2` 的半径属性相同”。\n\n\
  当当前值不再有效时，注册的 `InvalidationListener` 会收到通知。失效事件提供可观测值（observable value），即包含元数据的\
  \ JavaFX 属性。如果你不需要访问旧值，监听失效事件而不是更改事件（下将讨论）会更高效。你也可以使用 lambda 表达式来代替列表 3.10 中的匿名内部类。在这里，为了清晰起见，我们保留了带有\
  \ `invalidated()` 方法的 `InvalidationListener`。在本章的后后部分，我们将向你展示如何使用 lambda 表达式。\n\n\
  #### 列表 3.10 注册 JavaFX InvalidationListener\n```java\npackage myinvalidationlistener;\n\
  \nimport javafx.beans.InvalidationListener;\nimport javafx.beans.Observable;\nimport\
  \ javafx.scene.shape.Circle;\n\npublic class MyInvalidationListener {\n\n    public\
  \ static void main(String[] args) { // 定义一些圆\n        Circle circle1 = new Circle(10.5);\n\
  \        Circle circle2 = new Circle(15.5); // 为 circle2 的半径属性添加失效监听器\n        circle2.radiusProperty().addListener(new\
  \ InvalidationListener() {\n\n            @Override\n```\n\n\n\n\n\n```java\npublic\
  \ void invalidated(Observable o) {\n    System.out.println(\"Invalidation detected\
  \ for \" + o);\n    circle1.setRadius(circle2.getRadius());\n}\n});\nSystem.out.println(\"\
  Circle1: \" + circle1.getRadius());\nSystem.out.println(\"Circle2: \" + circle2.getRadius());\n\
  circle2.setRadius(20.5);\nSystem.out.println(\"Circle1: \" + circle1.getRadius());\n\
  System.out.println(\"Circle2: \" + circle2.getRadius());\n}\n}\n```\n\n* * *\n\n\
  Output:\n\nCircle1: 10.5\nCircle2: 15.5\nInvalidation detected for DoubleProperty\
  \ [bean: Circle[centerX=0.0, centerY=0.0, radius=20.5, fill=0x000000ff], name: radius,\
  \ value: 20.5]\nCircle1: 20.5\nCircle2: 20.5\n\n* * *\n\n输出显示了两个圆的半径值（10.5 和 15.5）、失效事件处理器的输出以及两个圆更新后的半径属性。`getRadius()`\
  \ 方法显示半径属性的值。你也可以使用 `radiusProperty().get()` 或 `radiusProperty().getValue()`，但传统命名的\
  \ `getRadius()` 更为熟悉且效率更高。请注意，在 `InvalidationListeners` 中，你必须将非泛型的 `Observable o`\
  \ 强制转换为 `ObservableValue<Number>`，以便在事件处理程序中访问新值。点击此处查看代码图像\n\n```java\nSystem.out.println(\"\
  new value = \" + ((ObservableValue<Number>) o).getValue().doubleValue());\n```\n\
  \n使用 ChangeListeners\n\nListing 3.11 显示了相同的程序，但为 `circle2` 的半径属性挂载了 `ChangeListener`\
  \ 而不是 `InvalidationListener`（项目 `MyChangeListener`）。`ChangeListener` 是泛型的，你只需重写\
  \ `changed()` 方法。事件处理程序的签名包含了泛型可观测值 (`ov`)、可观测值的旧值 (`oldValue`) 以及可观测值的新值 (`newValue`)。新旧值是属性值（此处为\
  \ `Number` 对象），且不包含 JavaFX 属性元数据。在 `changed()` 方法内部，我们使用 `setRadius(newValue.doubleValue())`\
  \ 方法设置 `circle1` 的半径属性。由于 `ChangeListeners` 是泛型的，你可以无需类型转换即可访问事件处理器的参数。Listing 3.11\
  \ 注册 JavaFX 属性更改 ChangeListener 点击此处查看代码图像\n\n* * *\n\n```java\npackage mychangelistener;\n\
  \nimport javafx.beans.value.ChangeListener;\nimport javafx.beans.value.ObservableValue;\n\
  import javafx.scene.shape.Circle;\n\npublic class MyChangeListener  {\n\n    public\
  \ static void main(String[] args) { // 定义一些圆\n        final Circle circle1 = new\
  \ Circle(10.5);\n        final Circle circle2 = new Circle(15.5); // 使用更改监听器跟踪 circle2\
  \ 半径属性的变化\n\n        circle2.radiusProperty().addListener(new ChangeListener<Number>()\
  \ {\n            @Override\n            public void changed(ObservableValue<? extends\
  \ Number> ov,\n                                Number oldValue, Number newValue)\
  \ {\n                System.out.println(\"Change detected for \" + ov);\n      \
  \          circle1.setRadius(newValue.doubleValue());\n            }\n        });\n\
  \n        System.out.println(\"Circle1: \" + circle1.getRadius());\n        System.out.println(\"\
  Circle2: \" + circle2.getRadius());\n        circle2.setRadius(20.5);\n        System.out.println(\"\
  Circle1: \" + circle1.getRadius());\n        System.out.println(\"Circle2: \" +\
  \ circle2.getRadius());\n    }\n}\n```\n\n* * *\n\nOutput:\n\nCircle1: 10.5\nCircle2:\
  \ 15.5\nChange detected for DoubleProperty [bean: Circle[centerX=0.0, centerY=0.0,\
  \ radius=20.5, fill=0x000000ff], name: radius, value: 20.5]\nCircle1: 20.5\nCircle2:\
  \ 20.5\n\n* * *\n\n`ChangeListener` 的输出与第 [106]页 #part0010.xhtml_qMBfnXb5SheAX34J3qw_Uw18430)\
  \ 的 [Listing 3.10 中的 `InvalidationListener` 输出类似。第 [108]页 #part0010.xhtml_qMBfnX5SheAX34J3qw_Uw19886)\
  \ 的 [Listing 3.11。由于 `ChangeListener` 是泛型的，因此不需要类型转换。\n\n### 绑定\n\n绑定是 JavaFX 中一种强大的特性，允许简洁定义属性之间的依赖关系，由于\
  \ JavaFX 属性是可观测的，它们可以参与绑定表达式。绑定意味着你指定一个属性依赖于另一个属性。\n\n#### 单向绑定\n\n要将一个 JavaFX 属性绑定到另一个属性，请对\
  \ JavaFX 属性使用 `bind()` 方法。点击此处查看代码图像\n```java\ncircle1.radiusProperty().bind(circle2.radiusProperty());\n\
  ```\n该绑定表达式表示 `circle1` 的半径将始终与 `circle2` 的半径值相同。我们说 `circle1` 的半径属性依赖于 `circle2`\
  \ 的属性。这种绑定是单向的；当 `circle2` 的属性变化时，`circle1` 的半径属性会更新，反之则。\n\n绑定表达式包含了隐式赋值。也就是说当我们把\
  \ `circle1` 的半径属性绑定到 `circle2` 的半径属性时，在调用 `bind()` 方法时就会更新 `circle1` 的半径。\n\n当你绑定一个属性后，无法通过\
  \ setter 方法更改该属性的值。点击此处查看代码图像\n```java\ncircle1.setRadius(someValue); // 不能这样做\n\
  ```\n\n绑定存在一些限制。尝试定义循环绑定会导致栈溢出。尝试设置已绑定属性会导致运行时异常。点击此处查看代码图像\n```text\njava.lang.RuntimeException:\
  \ A bound value cannot be set.\n```\n\n现在向你展示一个带有绑定的示例程序。Listing 3.12 定义了两个圆对象 `circle1`\
  \ 和 `circle2`。这次，我们没有使用跟踪 `circle2` 变化并更新 `circle1` 的 `InvalidationListener` 或 `ChangeListener`，而是将\
  \ `circle1` 的半径属性绑定到 `circle2` 的半径属性。Listing 3.12 单向绑定—MyBind.java 点击此处查看代码图像\n\n\
  ```java\npackage asgteach.bindings;\n\nimport javafx.scene.shape.Circle;\n\npublic\
  \ class MyBind {\n\n    public static void main(String[] args) {\n```\n\n\n\n\n\n\
  ```java\nCircle circle1 = new Circle(10.5);\nCircle circle2 = new Circle(15.5);\n\
  System.out.println(\"Circle1: \" + circle1.getRadius());\nSystem.out.println(\"\
  Circle2: \" + circle2.getRadius());\n// 将 circle1 半径绑定到 circle2 半径\ncircle1.radiusProperty().bind(circle2.radiusProperty());\n\
  if (circle1.radiusProperty().isBound()) {\n    System.out.println(\"Circle1 radiusProperty\
  \ is bound\");\n}\n// 现在半径属性是相同的\nSystem.out.println(\"Circle1: \" + circle1.getRadius());\n\
  System.out.println(\"Circle2: \" + circle2.getRadius());\n// 现在两个半径属性都会同步更新\ncircle2.setRadius(20.5);\n\
  System.out.println(\"Circle1: \" + circle1.getRadius());\nSystem.out.println(\"\
  Circle2: \" + circle2.getRadius());\n// circle1 半径不再绑定到 circle2 半径\ncircle1.radiusProperty().unbind();\n\
  if (!circle1.radiusProperty().isBound()) {\n    System.out.println(\"Circle1 radiusProperty\
  \ is unbound\");\n}\n// 现在半径属性不再相同\ncircle2.setRadius(30.5);\nSystem.out.println(\"\
  Circle1: \" + circle1.getRadius());\nSystem.out.println(\"Circle2: \" + circle2.getRadius());\n\
  ```\n\n**输出：**\n```\nCircle1: 10.5\nCircle2: 15.5\nCircle1 radiusProperty is bound\n\
  Circle1: 15.5\nCircle2: 15.5\nCircle1: 20.5\nCircle2: 20.5\nCircle1 radiusProperty\
  \ is unbound\nCircle1: 20.5\nCircle2: 30.5\n```\n\n在这个示例中，`Circle` 对象被不同的值初始化并显示出来。然后，我们把\
  \ `circle1` 的半径属性绑定到 `circle2` 的半径属性，并再次显示半径值。通过 `bind` 的隐式赋值，圆形的半径值现在是相同的（15.5）。当\
  \ setter 将 `circle2` 的半径更改为 `20.5` 时，`circle1` 的半径也会随之更新。`isBound()` 方法检查 JavaFX\
  \ 属性是否已绑定，而 `unbind()` 方法移除 JavaFX 属性上的绑定。注意，在解绑 `circle1` 的半径属性后，更新 `circle2` 的半径将不再影响\
  \ `circle1` 的半径。\n\n#### 双向绑定 (Bidirectional Binding)\n双向绑定允许你指定一个两个 JavaFX 属性的绑定，这两个属性会双向更新。每当任何一个属性发生变化时，另一个属性都会更新。注意，两个属性的\
  \ setter 在双向绑定下始终有效（毕竟你必须以某种方式更新值）。双向绑定特别适用于保持 UI 视图组件与模型数据的同步。如果模型发生变化，视图会自动刷新；如果用户在表单中输入新数据，模型就会更新。\n\
  \n#### 双向绑定不是对称的\n最初，两个属性都会获取 `bindBidirectional()` 方法参数中指定的属性的值。因此，双向绑定不是对称的；你指定的绑定顺序会影响被绑定属性的初始值。\n\
  \n[列表 3.13] 显示了如何使用 JavaFX 属性方法 `bindBidirectional()`。在对象 `circle1` 和 `circle2`\
  \ 的半径属性被绑定后，两个属性都获取了值 15.5（`circle2` 半径属性的值），且其中任何一个的变化都会更新另一个。注意，setter 会更新半径属性的值。你也可以使用\
  \ `unbindBidirectional()` 方法解绑这些属性。\n\n**列表 3.13 双向绑定—MyBidirectional.java**\n```java\n\
  package egach.bindings;\nimport javafx.scene.shape.Circle;\n\npublic class MyBidirectional\
  \ {\n    public static void main(String[] args) {\n        Circle circle1 = new\
  \ Circle(10.5);\n        Circle circle2 = new Circle(15.5);\n        // circle1\
  \ 采纳 circle2 的值\n        circle1.radiusProperty().bindBidirectional(circle2.radiusProperty());\n\
  \        System.out.println(\"Circle1: \" + circle1.getRadius());\n        System.out.println(\"\
  Circle2: \" + circle2.getRadius());\n        circle2.setRadius(20.5);\n        //\
  \ 现在两个圆都是 20.5\n        System.out.println(\"Circle1: \" + circle1.getRadius());\n\
  \        System.out.println(\"Circle2: \" + circle2.getRadius());\n        circle1.setRadius(30.5);\n\
  \        // 现在两个圆都是 30.5\n        System.out.println(\"Circle1: \" + circle1.getRadius());\n\
  \        System.out.println(\"Circle2: \" + circle2.getRadius());\n        circle1.radiusProperty().unbindBidirectional(circle2.radiusProperty());\n\
  \    }\n}\n```\n\n**输出：**\n```\nCircle1: 15.5\nCircle2: 15.5\nCircle1: 20.5\nCircle2:\
  \ 20.5\nCircle1: 30.5\nCircle2: 30.5\n```\n\n### 流式 API 与绑定 API (Fluent API and\
  \ Bindings API)\n`bind()` 与相同类型的 JavaFX 属性配合良好。你将一个属性绑定到第二个属性。当第二个属性改变时，第一个属性的值就会更新。然而，在许多情况下，一个属性的值依赖于你必须以某种方式处理的另一个属性。或者，当多个属性发生变化时，某个属性的值可能需要更新。JavaFX\
  \ 提供了一个流式 API（Fluent API），帮助你为这些复杂的关系构建绑定表达式。流式 API 包含了常用算术操作的方法，如 `add()`、`subtract()`、`divide()`\
  \ 和 `multiply()`，布尔表达式 `negate()`，以及转换为字符串的 `asString()`。你可以在绑定表达式中使用这些流式 API 方法。它们的参数是其他属性或非\
  \ JavaFX 属性属性值。这里有一个示例，它使用华氏度标签的绑定表达式中的转换公式，同时显示摄氏度和华氏转换的温度。\n\n```java\n// 假设你有一个“温度”对象\n\
  Temperature myTemperature = new Temperature(0); // 创建两个标签\nLabel labelF = new Label();\n\
  Label labelC = new Label(); // 将 labelC 的 textProperty 绑定到 温度 的 celsiusProperty\n\
  labelC.textProperty().bind(myTemperature.celsiusProperty().asString()\n    .concat(\"\
  \ C\")); // 将 labelF 的 textProperty 绑定到 温度 的 celsiusProperty\n// 使用 F = 9/5 C +\
  \ 32\nlabelF.textProperty().bind(myTemperature.celsiusProperty().multiply(9)\n \
  \   .divide(5).add(32)\n    .asString().concat(\" F\"));\n```\n\n绑定的另一个常见用途是根据某些条件启用或禁用控件。在这里，我们根据动画的状态绑定按钮的禁用属性（disableProperty）。如果动画正在运行，按钮将被禁用。\n\
  \n```java\n// 将按钮的 disableProperty 绑定到 myTransition 是否运行\nstartButton.disableProperty().bind(myTransition.statusProperty()\n\
  \    .isEqualTo(Animation.Status.RUNNING));\n```\n\n绑定 API 为构建绑定表达式提供了额外的灵活性。`Bindings`\
  \ 类拥有静态方法，允许你操作可观察值。例如，这里是如何使用 Bindings API 实现华氏温度转换的。\n\n```java\nlabelF.textProperty().bind(\n\
  \    Bindings.format(\" %1.1f F\",\n        Bindings.add(\n            Bindings.divide(\n\
  \                Bindings.multiply(9, myTemperature.celsiusProperty()),\n      \
  \          5),\n            32)));\n```\n\n\n\n\n\n由于 `Bindings API` 要求你“从内向外”构建表达式，因此该表达式可能没有\
  \ `Fluent API` 那么易读。然而，`Bindings` 方法非常有用，特别是对于格式化绑定表达式的结果。上述 `Bindings.format()`\
  \ 为你提供了与 `java.util.Formatter` 相同的灵活性来创建格式化字符串。你还可以将 `Bindings API` 与 `Fluent API`\
  \ 结合使用。\n\n让我们来看另一个使用 `Fluent API` 的示例。图 3.16 显示了一个带有 `Rectangle` 的应用程序。当你调整窗口大，`Rectangle`\
  \ 会增大或缩小。`Rectangle` 的透明度也会随着窗口调整而改变。随着窗口变大，矩形变得越来越不透明，使其看起来更亮，因为通过低透明度矩形看到的深色背景减少了。\n\
  \n![](img/image1953.jpg)\n图 3.16 矩形的尺寸和填充颜色随窗口缩放而变化\n\n代码列表 3.14 显示了该应用程序的代码（项目\
  \ `MyFluentBind`）。构造函数创建阴影、堆栈面板和矩形，设置器则对它们进行配置。为了提供矩形的动态缩放，我们将矩形的 `widthProperty`\
  \ 绑定到场景的 `widthProperty` 除以二。同样，我们将矩形的 `heightProperty` 绑定到场景的 `heightProperty`\
  \ 除以二。（除以二可以保持矩形在窗口居中。）\n\n矩形的 `opacity` 稍微复杂一点。`opacityProperty` 是一个 0 到 1 之间的\
  \ `double` 值，1 表示完全不透明，0 表示完全透明（不可见）。因此，我们任意地将场景的 `height` 和 `width` 相加并除以 1000，以保持透明度在\
  \ 0 到 1 的目标范围内。这使得透明度随着矩形的缩放而变化。\n\n代码列表 3.14 Fluent API—MyFluentBind.java\n点击此处查看代码图片\n\
  \n```java\npackage asgteach.bindings;\n\nimport javafx.application.Application;\n\
  import javafx.geometry.Pos;\nimport javafx.scene.Scene;\nimport javafx.scene.effect.DropShadow;\n\
  import javafx.scene.layout.StackPane;\nimport javafx.scene.paint.Color;\nimport\
  \ javafx.scene.shape.Rectangle;\nimport javafx.stage.Stage;\n\npublic class MyFluentBind\
  \ extends Application {\n\n    @Override\n    public void start(Stage stage) {\n\
  \        DropShadow dropShadow = new DropShadow(10.0, Color.rgb(150, 50, 50, .688));\n\
  \        dropShadow.setOffsetX(4);\n        dropShadow.setOffsetY(6);\n        StackPane\
  \ stackPane = new StackPane();\n        stackPane.setAlignment(Pos.CENTER);\n  \
  \      stackPane.setEffect(dropShadow);\n        Rectangle rectangle = new Rectangle(100,\
  \ 50, Color.LEMONCHIFFON);\n        rectangle.setArcWidth(30);\n        rectangle.setArcHeight(30);\n\
  \        stackPane.getChildren().add(rectangle);\n        Scene scene = new Scene(stackPane,\
  \ 400, 200, Color.LIGHTSKYBLUE);\n        stage.setTitle(\"Fluent Binding\");\n\
  \        rectangle.widthProperty().bind(scene.widthProperty().divide(2));\n    \
  \    rectangle.heightProperty().bind(scene.heightProperty().divide(2));\n      \
  \  rectangle.opacityProperty().bind(\n            scene.widthProperty().add(scene.heightProperty())\n\
  \            .divide(1000));\n        stage.setScene(scene);\n        stage.show();\n\
  \    }\n\n    public static void main(String[] args) {\n        launch();\n    }\n\
  }\n```\n\n### 自定义绑定\n\n当 `Fluent API` 或 `Bindings API` 不适用于你的应用程序时，你可以创建一个自定义绑定对象。通过自定义绑定，你指定指定两个项：\n\
  - JavaFX 属性依赖项\n- 如何计算所需的值\n\n让我们重写之前的示例并创建一个自定义绑定对象。首先，这里是之前介绍的矩形 `opacityProperty`\
  \ 的绑定表达式。\n\n```java\nrectangle.opacityProperty().bind(\n    scene.widthProperty().add(scene.heightProperty())\n\
  \    .divide(1000));\n```\n\n该绑定包含两个 JavaFX 属性依赖：场景的 `width` 和 `height`。接下来，确定如何使用此绑定表达式计算值。在不使用\
  \ `Fluent API` 或 `Bindings API` 的情况下，计算（结果为 `double`）如下：\n\n```java\ndouble myComputedValue\
  \ = (scene.getWidth() + scene.getHeight()) / 1000;\n```\n\n也就是说，透明度的值是一个 `double`，它是场景宽度和高度之和除以\
  \ 1000 的结果。对于此示例，自定义绑定对象的类型是 `DoubleBinding`。你在对象的匿名构造函数中使用 `super.bind()` 将 JavaFX\
  \ 属性依赖项作为参数指定。重写的 `computeValue()` 方法返回所需的值（在这里是 `double`）。每当列出的依赖项中任何一个发生变化时，`computeValue()`\
  \ 方法就会被调用。我们的自定义绑定看起来如下所示：\n\n```java\nDoubleBinding opacityBinding = new DoubleBinding()\
  \ {\n    {\n        // 使用 super.bind() 指定依赖项\n        super.bind(scene.widthProperty(),\
  \ scene.heightProperty());\n    }\n    @Override\n    protected double computeValue()\
  \ {\n        // 返回计算值\n        return (scene.getWidth() + scene.getHeight()) / 1000;\n\
  \    }\n};\n```\n\n对于 `StringBinding`，`computeValue()` 返回一个 `String`。对于 `IntegerBinding`，`computeValue()`\
  \ 返回一个整数，依此类推。要为 `Rectangle` 的 `opacityProperty` 指定此自定义绑定，请使用：\n\n```java\nrectangle.opacityProperty().bind(opacityBinding);\n\
  ```\n\n现在让我们向你展示另一个自定义绑定示例。图 3.17 显示了一个类似的 JavaFX 应用程序，其中矩形的尺寸和透明度随着窗口缩放而变化。这次，我们确保透明度永远不会大于\
  \ 1.0，并在矩形内部的文本节点中显示透明度。文本经过了格式化，并在值前面包含了“opacity = ”。\n\n![](img/image1996.jpg)\n\
  图 3.17 矩形在 Text 组件中显示其变化的透明度\n\n代码列表 3.15 显示了该程序的代码（项目 `MyCustomBind`）。相同的代码创建了与上一个示例相同的投影、矩形和堆栈面板。矩形的\
  \ `height` 和 `width` 属性使用了相同的 `Fluent API` 绑定表达式。现在 `computeValue()` 方法为透明度返回一个\
  \ `double`，并确保其值不大于 1.0。文本标签的 `textProperty` 将自定义绑定对象 `opacityBinding` 与 `Bindings.format()`\
  \ 方法结合，以提供所需的文本格式化。\n\n代码列表 3.15 自定义绑定示例—MyCustomBind.java\n点击此处查看代码图片\n\n```java\n\
  public class MyCustomBind extends Application {\n    @Override\n    public void\
  \ start(Stage stage) {\n        // ... 省略了构建 Rectangle、StackPane 和 DropShadow 的代码\
  \ ...\n        Text text = new Text();\n        text.setFont(Font.font(\"Tahoma\"\
  , FontWeight.BOLD, 18));\n        stackPane.getChildren().addAll(rectangle, text);\n\
  \        final Scene scene = new Scene(stackPane, 400, 200, Color.LIGHTSKYBLUE);\n\
  \        stage.setTitle(\"Custom Binding\");\n        rectangle.widthProperty().bind(scene.widthProperty().divide(2));\n\
  \        rectangle.heightProperty().bind(scene.heightProperty().divide(2));\n  \
  \      DoubleBinding opacityBinding = new DoubleBinding() {\n            {\n   \
  \             // 使用 super.bind() 列出依赖项\n                super.bind(scene.widthProperty(),\
  \ scene.heightProperty());\n            }\n            @Override\n            protected\
  \ double computeValue() {\n                // 返回计算值\n                double opacity\
  \ = (scene.getWidth() + scene.getHeight()) / 1000;\n                return (opacity\
  \ > 1.0) ? 1.0 : opacity;\n            }\n        };\n        rectangle.opacityProperty().bind(opacityBinding);\n\
  \        text.textProperty().bind((Bindings.format(\n```\n\n\n\n\n```java\n\"opacity\
  \ = %.2f\", opacityBinding)));\n\nstage.setScene(scene);\n\nstage.show();\n\n} public\
  \ static void main(String[] args) {\n\n    launch();\n\n}\n\n}\n```\n\n## 带泛型的 ObjectBinding\n\
  \n如何创建返回非标准类型计算值的绑定对象？在这种情况下，请使用带泛型的 `ObjectBinding`。例如，列表 3.16 显示了一个自定义绑定定义，它根据\
  \ `Rectangle` 的 `fill` 属性返回更深的 `Color`。该绑定对象的类型为 `ObjectBinding<Color>`，`computeValue()`\
  \ 的返回类型为 `Color`。（此处需要进行类型转换，因为 `Shape` 的 `fill` 属性是一个 `Paint` 对象，可以是 `Color`、`ImagePattern`、`LinearGradient`\
  \ 或 `RadialGradient`。）\n\n### 列表 3.16 带泛型的 ObjectBinding\n\n```java\nObjectBinding<Color>\
  \ colorBinding = new ObjectBinding<Color>() {\n    {\n        super.bind(rectangle.fillProperty());\n\
  \    }\n    @Override\n    protected Color computeValue() {\n        if (rectangle.getFill()\
  \ instanceof Color) {\n            return ((Color)rectangle.getFill()).darker();\n\
  \        } else {\n            return Color.GRAY;\n        }\n    }\n};\n```\n\n\
  ## 3.4 整合应用\n\n本章的最后一个示例应用了你学到的关于属性、绑定、更改监听器和布局控件的知识，创建一个模拟单辆赛车赛道的程序。当赛车沿着赛道行驶时，每当赛车通过起点，圈数器就会更新一次。图\
  \ 3.18 显示了该程序在两个时间点的运行情况。\n\n这个示例整合了本章中的几个重要概念：绑定属性以在程序运行时保持值值同步；使用更改监听器跟踪属性的变化；以及编写控制程序执行的按钮事件处理程序。我们还将向你展示如何在\
  \ `Group` 中组织节点，以便在保持布局整体定位的同时，保持项目在其相对坐标位置。我们已经向你展示了一个 `RotateTransition` 示例；现在我们将向你展示如何使用\
  \ `PathTransition` 来处理赛道。\n\n程序包含一个启动/暂停按钮，用于启动和暂停动画。一旦启动，加速和减速按钮将改变赛车的行驶速率。当动画暂停时（如左侧图所示），启动/暂停按钮显示“启动”，减速/加速按钮被禁用。当动画正在运行时（右侧图），启动/暂停按钮显示“暂停”，减速/加速按钮被启用。\n\
  \n我们将使用 `PathTransition` 实现动画，这是一种高级 `Transition`，用于沿节点沿 JavaFX `Path` 制作动画。`Path`\
  \ 是一个由多个 `Path` 元素组成的 `Shape`，其中每个元素可以是几种几何对象中的任意一种，例如 `LineTo`、`ArcTo`、`QuadraticCurveTo`\
  \ 和 `CubicCurveTo`。在我们的示例中，我们通过组合 `Path` 元素 `MoveTo`（起点）、`ArcTo`、`LineTo` 和 `ClosePath`（一种特殊的\
  \ `Path` 元素，它提供了一条从当前 `Path` 元素点到起点的 `LineTo` 连）来构建了一个椭圆形赛道。\n\n我们的赛车是一个圆矩形 `Rectangle`，一个\
  \ `Text` 节点显示当前的圈数。我们使用 `FXML` 实现此示例。关联的控制器类定义了按钮的操作事件处理程序、绑定以及 `PathTransition`。图\
  \ 3.19 显示了场景图结构。顶层节点是 `VBox`，它使其子节点（一个 `StackPane` 和一个 `HBox`）垂直对齐并居中。`StackPane`\
  \ 也让其子节点 `Group` 和 `Text` 节点居中。`Group` 反而由 `Path`、赛道的 `Line` 和赛车（`Rectangle`）组成。这三个节点使用\
  \ `Group` 的本地系统进行相对布局。`HBox` 保持其子节点的水平对齐。如果你调整 JavaFX 窗口的大小，这些组件将保持居中。列表 3.17 显示了\
  \ `VBox`、`StackPane`、`Text` 和 `HBox` 节点的 FXML 标记（接下来我们将展示其他节点）。图 3.19 中的场景图与 `Track.fxml`\
  \ 中所示 FXML 元素匹配。顶节点 `VBox` 通过 `fx:controller` 指定了控制器类。注意，我们还为 `Text` 节点提供了 `fx:id=\"\
  text\"` 属性。这使得 `Controller` 类能够在 Java 代码中访问 `Text` 对象。\n\n### 列表 3.17 Track.fxml\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<?import java.lang.*?>\n<?import\
  \ java.util.*?>\n<?import javafx.scene.*?>\n<?import javafx.scene.control.*?>\n\
  <?import javafx.scene.layout.*?>\n<?import javafx.scene.shape.*?>\n<?import javafx.scene.text.*?>\n\
  <?import javafx.scene.effect.*?>\n<VBox id=\"VBox\" prefHeight=\"300\" prefWidth=\"\
  400\" spacing=\"20\"\n    alignment=\"CENTER\" style=\"-fx-background-color: lightblue;\"\
  \n    xmlns:fx=\"http://javafx.com/fxml\"\n    fx:controller=\"racetrackapp.RaceTrackController\"\
  >\n    <children>\n        <StackPane>\n            <children>\n               \
  \ <Group>\n                    <children>\n                        (见列表 3.18)\n\
  \                    </children>\n                </Group>\n                <Text\
  \ fx:id=\"text\" >\n                    <font><Font=\"Verdana\" size=\"16\" /></font>\n\
  \                    <effect><Reflection /></effect>\n                </Text>\n\
  \            </children>\n        </StackPane>\n        <HBox spacing=\"20\" alignment=\"\
  CENTER\" >\n            (见列表 3.19)\n        </HBox>\n    </children>\n</VBox>\n\
  ```\n\n### 列表 3.18\n\n列表 3.18 显示了 `Group` 子节点的 FXML：`Path`、`Line` 和 `Rectangle`\
  \ 节点。`Path` 节点包含了形成椭圆形 `RaceTrack` 的元素：`MoveTo`、`ArcTo`、`LineTo` 和 `ClosePath`。`Line`\
  \ 节点标记了起线。`Rectangle` 节点代表“赛车”。`Path` 和 `Rectangle` 节点也具有用于控制器的 `fx:id` 属性。`Path`\
  \ 和 `Line` 节点定义了一个 `Shadow` 效果。\n\n```xml\n<Group>\n    <children>\n        <Path\
  \ fx:id=\"path\" stroke=\"DARKGOLDENROD\n              strokeWidth=\"15\" fill=\"\
  orange\" >\n            <effect>\n                <DropShadow fx:id=\"dropshadow\"\
  \ radius=\"10\"\n                           offsetX=\"5\" offsetY=\"5\" color=\"\
  GRAY\" />\n            </effect>\n            <elements>\n                <MoveTo\
  \ x=\"0\" y=\"0\" />\n                <ArcTo radiusX=\"100\" radiusY=\"50\" sweepFlag=\"\
  true\" x=\"270\" y=\"0\" />\n                <LineTo x=\"270\" y=\"50\" />\n   \
  \             <ArcTo radiusX=\"100\" radiusY=\"50\" sweepFlag=\"true\" x=\"0\" y=\"\
  50\" />\n                <ClosePath />\n            </elements>\n        </Path>\n\
  \        <Line startX=\"-25\" startY=\"0\" endX=\"10\" endY=\"0\" strokeWidth=\"\
  4\"\n              stroke=\"BLUE\" strokeLineCap=\"ROUND\" effect=\"$dropshadow\"\
  \ />\n        <Rectangle fx:id=\"rectangle\" x=\"-15\" y=\"0\" width=\"35\" height=\"\
  20\"\n                   fill=\"YELLOW\" arcWidth=\"10\" arcHeight=\"10\"\n    \
  \               stroke=\"BLACK\" rotate=\"90\" />\n    </children>\n</Group>\n```\n\
  \n\n\n\n\nListing 3.19 显示了出现在 `HBox` 布局窗格中的三个 `Button` 节点的 FXML 代码。这三个按钮都包含了 `fx:id`\
  \ 属性，因为它们参与了 `Controller` 类中的绑定表达式。`onAction` 属性指定了为每个按钮定义的事件处理程序。这些事件处理器控制着 `PathTransition`\
  \ 的动画。`startPauseButton` 配置了属性 `prefWidth`。这使得按钮在文本于“Start”（开始）和“Pause”（暂停）之间切换时，能够保持恒定的尺寸。\n\
  \n#### 列表 3.19 HBox 和 Button 节点\n```xml\n<HBox spacing=\"20\" alignment=\"CENTER\"\
  >\n    <Button fx:id=\"slowerButton\" onAction=\"#slowerAction\" />\n    <Button\
  \ fx:id=\"startPauseButton\" prefWidth=\"80\" onAction=\"#startPauseAction\" />\n\
  \    <Button fx:id=\"fasterButton\" onAction=\"#fasterAction\" />\n</HBox>\n```\n\
  \n现在 UI 已经用 FXML 完全描述，让我们检查 Controller 类——`RaceTrackController`，如 Listing 3.20 到\
  \ Listing 3.23 所示。`@FXML` 注解标记了 FXML 中 `Controller` 类需要访问的每个变量。请记住，FXML Loader 负责实例化这些对象，因此你不会看到创建它们的\
  \ Java 代码。\n\n`initialize()` 方法在 FXML Loader 实例化场景图对象后调用。在这里我们执行额外的场景图配置。具体来说，我们实例化了\
  \ `PathTransition`（负责让“汽车”沿着 `RaceTrack` 路径移动的动画对象）。此高级动画适用于一个节点（这里是 `Rectangle`）。`orientation`\
  \ 属性（`OrientationType.ORTHOGONAL_TO_TANGENT`）确保矩形沿路径移动时保持正确的方向。我们设置了持续时间、循环次数和插值器，并将循环次数设置为\
  \ `INDEFINITE`（无限）。动画速率通过 `Interpolator.LINEAR` 保持不变。\n\n#### 列表 3.20 RaceTrackController.java\n\
  ```java\npackage racetrackfxapp;\n\nimport java.net.URL;\nimport java.util.ResourceBundle;\n\
  import javafx.animation.Animation;\nimport javafx.animation.Interpolator;\nimport\
  \ javafx.animation.PathTransition;\nimport javafx.beans.binding.When;\nimport javafx.beans.property.IntegerProperty;\n\
  import javafx.beans.property.SimpleIntegerProperty;\nimport javafx.beans.value.ObservableValue;\n\
  import javafx.event.ActionEvent;\nimport javafx.fxml.FXML;\nimport javafx.fxml.Initializable;\n\
  import javafx.scene.control.Button;\nimport javafx.scene.shape.Path;\nimport javafx.scene.shape.Rectangle;\n\
  import javafx.scene.text.Text;\nimport javafx.util.Duration;\n\npublic class RaceTrackController\
  \ implements Initializable {\n\n    // 在 FXML 中定义的对象\n    @FXML\n    private Rectangle\
  \ rectangle;\n\n    @FXML\n    private Path path;\n\n    @FXML\n    private Text\
  \ text;\n\n    @FXML\n    private Button startPauseButton;\n\n    @FXML\n    private\
  \ Button slowerButton;\n\n    @FXML\n    private Button fasterButton;\n\n    private\
  \ PathTransition pathTransition;\n\n    @Override\n    public void initialize(URL\
  \ url, ResourceBundle rb) {\n        // 创建 PathTransition\n        pathTransition\
  \ = new PathTransition(Duration.seconds(6), path, rectangle);\n        pathTransition.setOrientation(PathTransition.OrientationType.ORTHOGONAL_TO_TANGENT);\n\
  \        pathTransition.setCycleCount(Animation.INDEFINITE);\n        pathTransition.setInterpolator(Interpolator.LINEAR);\n\
  \        // . . .\n        // 列表 3.21 显示了 initialize() 方法中的额外代码\n    }\n}\n```\n\
  \nListing 3.21 显示了 `initialize` 是如何工作的。在这里，我们通过实例化 `SimpleIntegerProperty` 创建了一个\
  \ JavaFX 属性。我们需要 JavaFX 属性是因为我们在绑定中使用了它。\n\n```java\n// 我们通过观察旧值大于新值来计算圈数\nfinal\
  \ IntegerProperty lapProperty = new SimpleIntegerProperty(0);\npathTransition.currentTimeProperty().addListener((ObservableValue<?\
  \ extends Duration> oldValue, Duration newValue) -> {\n    if (oldValue.greaterThan(newValue))\
  \ {\n        lapProperty.set(lapProperty.get() + 1);\n    }\n});\n\n// 将文本的属性绑定到\
  \ lapProperty 并进行格式化\ntext.textProperty().bind(lapProperty.asString(\"Lap Counter:\
  \ %s\"));\n```\n\n`Start/Pause` 按钮允许你开始和暂停动画，如 Listing 3.22 所示。处理器之前的 `@FXML` 注解使\
  \ FXML Loader 将 `Start/Pause` 按钮的 `onAction` 属性与正确的处理器连接起来。这在用户点击按钮时会调用该处理器。如果动画正在运行，`pause()`\
  \ 会暂停它。否则，动画当前处于暂停状态，`play()` 方法将从当前点开始或继续播放动画。按钮的文本通过 `When` 对象进行控制，它是三元绑定表达式的起点。`When`\
  \ 类接收一个布尔条件，如果条件为真，则返回 `then()` 方法中的值；如果为假，则返回 `otherwise()` 方法中的值。对于 `Start/Pause`\
  \ 按钮，如果动画正在运行，我们将文本设置为“Pause”；否则，将其设置为“Start”。\n\n#### 列表 3.22 Start/Pause 按钮\n\
  ```java\n@FXML\nprivate void startPauseAction(ActionEvent event) {\n    if (pathTransition.getStatus()\
  \ == Animation.Status.RUNNING) {\n        pathTransition.pause();\n    } else {\n\
  \        pathTransition.play();\n    }\n}\n\n// . .\nstartPauseButton.textProperty().bind(\n\
  \    new When(pathTransition.statusProperty()\n        .isEqualTo(Animation.Status.RUNNING))\n\
  \    .then(\"Pause\").otherwise(\"Start\")\n);\n```\n\n\n\n\n\n[Listing 3.23] 显示了较快/较慢按钮的处理器代码。两个按钮的动作事件处理程序（使用\
  \ `@FXML` 注释以将其连接到 FXML 文件中定义的相应 `Buttons`）均会操作动画的速率（rate）属性。我们指定了最大速率为 `7.0`（默认速率的七倍），最小速率为\
  \ `.3`。用户每点击一次较快或较慢的按钮，速率就会向上或向下变化 `.3`。我们通过访问过渡的 `currentRate` 属性来设置新速率。`printf()`\
  \ 语句允许您看到每次点击按钮时改变的速率。\n\n当动画未运行时，较快/较慢按钮将被禁用。这是通过检查动画状态的绑定表达式实现的。最后，控制器设置了较快/较慢按钮的文本。\n\
  \n### 列表 3.23 较快与较慢的按钮\n\n```java\n// 用于控制过渡速率变化的常量\nfinal double maxRate = 7.0;\n\
  final double minRate = .3;\nfinal double rateDelta = .3;\n\n@FXML\nprivate void\
  \ slowerAction(ActionEvent event) {\n    double currentRate = pathTransition.getRate();\n\
  \    if (currentRate <= minRate) {\n        return;\n    }\n    pathTransition.setRate(currentRate\
  \ - rateDelta);\n    System.out.printf(\"slower rate = %.2f\\n\", pathTransition.getRate());\n\
  }\n\n@FXML\nprivate void fasterAction(ActionEvent event) {\n    double currentRate\
  \ = pathTransition.getRate();\n    if (currentRate >= maxRate) {\n        return;\n\
  \    }\n    pathTransition.setRate(currentRate + rateDelta);\n    System.out.printf(\"\
  faster rate = %.2f\\n\", pathTransition.getRate());\n}\n\n// ...\n\nfasterButton.disableProperty().bind(pathTransition.statusProperty()\n\
  \    .isNotEqualTo(Animation.Status.RUNNING));\nslowerButton.disableProperty().bind(pathTransition.statusProperty()\n\
  \    .isNotEqualTo(Animation.Status.RUNNING));\n\nfasterButton.setText(\" >> \"\
  );\nslowerButton.setText(\" << \");\n```\n\n\n\n\n此示例的一个关键点是，`JavaFX` 属性和绑定（bindings）让你能够编写更少的代码。如果不使用绑定来启用和禁用按钮，你需要创建一个更改监听器（change\
  \ listener），将其附加到动画的 `status` 属性上，并编写一个更新按钮 `disable` 属性的事件处理器。你可能还需要一个类似的更改监听器来控制启动/暂停按钮的\
  \ `text` 属性。与配置此类属性依赖关系的监听器相比，绑定表达式（包括自定义绑定对象）要简洁得多，且更不容易出错。\n\n然而，在某些情况下你仍然需要 `ChangeListener`\
  \ 或 `InvalidationListener`，正如我们在示例中展示的，用于实现圈数计数。\n\n此示例还展示了 `FXML` 标记如何帮助你可视化你正在构建的场景图（scene\
  \ graph）结构。与仅使用 `Java APIs` 相比，使用 `FXML` 使得修改场景图变得更加容易。我们也仅使用 API 构建了此示例（参见书中的下载项目\
  \ `RaceTrack` 项目）。我们鼓励你对比这两个项目。我们认为你会发现 `FXML` 版本更容易理解。\n\n## 3.5 关键点总结\n\n本章介绍了\
  \ `JavaFX` 并向你展示了如何编写显示和操作场景图对象的 `JavaFX` 程序。以下是本章的要点：\n\n- `JavaFX` 提供了丰富的图形用户界面。它的分层场景图让你能够轻松配置丰富的内容，并提供如渐变、投影投影和反射等视觉效果的效果。\n\
  - `JavaFX` 图形利用硬件加速图形能力进行渲染，其动画性能良好。\n- 你可以将 `JavaFX` 内容嵌入到 `Swing` 面板中。这让你可以在不抛弃\
  \ `Swing` 应用程序的情况下使用 `JavaFX`。（参见书中第 259 页的“JFXPanel 的魔力”。）\n- 与 `Swing` 一，`JavaFX`\
  \ 使用单线程执行环境。\n- 你使用 `Java APIs` 和/或 `FXML` 标记结合控制器类来创建 `JavaFX` 内容。\n- `FXML` 是一种\
  \ XML 标记语言，允许你指定场景图内容。`FXML` 的分层形式让你比使用 `Java APIs` 更容易地可视化场景图结构。`FXML` 还有帮助你将视觉内容与控制器代码（如事件处理器）分离。\n\
  - 你使用转换为正确类型的属性名和值来配置 `FXML` 场景图节点。\n- `FXML` 控制器类允许你提供 `JavaFX`节点初始化代码、动态内容和事件处理器。\n\
  - `CSS` 允许你对 `JavaFX` 节点进行样式。你可以单独配置节点上的 `style` 属性，也可以提供样式表来为整个应用程序设置样式。\n- 你可以在主程序或\
  \ `FXML` 标记中指定 `CSS` 文件。\n- `JavaFX` 提供了高层过渡效果，让你能够指定许多常见的动画。这包括移动、旋转、淡入或淡出、缩放、填充或描边属性的颜色变化以及沿路径移动。\n\
  - `JavaFX` 属性是 `JavaFX` 中的一项重要特性。`JavaFX` 属性是可观察的，并提供了与 `JavaBeans` 属性类似的命名规范。\n\
  - `JavaFX` 属性可以是可读写、只读或不可变的。\n- 你可以向任何 `JavaFX` 属性附加 `ChangeListener` 或 `InvalidationListener`。\n\
  - 绑定比监听器更简洁且更不容易出错。绑定是一种保持应用程序变量同步的强大机制。\n- 你可以在 `JavaFX` 属性之间创建绑定，以指定一个属性对另一个属性的依赖关系。绑定可以是单向或双向的。\n\
  - 使用 `Fluent API` 和 `Bindings API` 使用一个或多个属性指定更复杂的绑定表达式。\n- 你可以创建自定义绑定对象，指定属性依赖关系以及如何计算绑定的返回值。\n\
  \n### 接下来做什么？\n\n通过对 `JavaFX` 的介绍，你现在已经准备好学习如何在桌面应用程序中有效使用 `JavaFX` 了。接这些示例的方法将与我们之前展示的示例类似。\n\
  \n# 4. 使用 JavaFX\n\n通过对 `JavaFX` 的介绍，你现在已经准备好学习如何在桌面应用程序中有效使用 `JavaFX` 了。接这些示例的方法将与我们之前展示的示例类似。\n\
  \n## 4.1 创建 JavaFX 属性\n\n上一章展示了 `JavaFX` 属性的实际应用。现在让我们看看如何在类中创建 `JavaFX` 属性。\n\n\
  ## 你将学习\n\n- 创建 `JavaFX` 属性。\n- 使用 `ChangeListener` 集合。\n- 探索 `Scene Builder` 并创建\
  \ `JavaFX`。\n- 将 `JavaFX` 事件集成到 `JavaFX` 应用程序中。\n\n\n\n\n```java\n    public void\
  \ setFirstname(String firstname) {\n        this.firstname.set(firstname);\n   \
  \ }\n    public final StringProperty firstnameProperty() {\n        return firstname;\n\
  \    }\n// . . code omitted for other properties . . .}\n```\n\n### 带有懒求值的 JavaFX\
  \ 属性\n\n在讨论 `Person` 类的其他 JavaFX 属性之前，让我们向你展示另一种实现 JavaFX 属性 `firstname` 的方法。假设你有一个包含许多\
  \ JavaFX 属性的 JavaFX Bean，并且你的应用程序创建了许多此类对象。每个 JavaFX 属性本身都是 `Object`，因此创建的对象的数量可能会变得很大。（例如，JavaFX\
  \ 节点层次由包含许多 JavaFX 属性的类组成，JavaFX 应用程序可能会创建许多场景图节点。）\n\n另一种实现方式是在挂载监听器或在绑定表达式中使用该属性时，延迟创建\
  \ JavaFX 属性。换句话说，在用户调用 `firstnameProperty()` 方法之前，JavaFX 属性不会被创建。仅仅更改属性的值并不会创建 JavaFX\
  \ 属性。为了实现这种懒性实例化，你创建一个影子字段（shadow field）来存储值，直到需要 JavaFX 属性。`Listing 4.2` 展示了这种方法。\n\
  \nsetter 和 getter 在在使用 JavaFX 属性之前会确保它不为空。否则，你将使用影子字段 `_firstname` 获取和设置值。方法 `firstnameProperty()`\
  \ 会在 JavaFX 属性尚不存在时创建它。因此，JavaFX 属性只有在调用 `firstnameProperty()` 方法时才会被创建。\n\n**Listing\
  \ 4.2 Person JavaFX 属性 firstname——另一种实现方式**\n\n```java\n    private StringProperty\
  \ firstname;\n    private String _firstname = \"\"; // 影子字段\n    public String getFirstname()\
  \ {\n        return (firstname != null) ? firstname.get() : _firstname;\n    }\n\
  \    public void setFirstname(String newFirstname) {\n        if (firstname != null)\
  \ {\n            firstname.set(newFirstname);\n        } else {\n            _firstname\
  \ = newFirstname;\n        }\n    }\n    public final StringProperty firstnameProperty()\
  \ {\n        if (firstname == null) {\n            firstname = new SimpleStringProperty(this,\
  \ \"firstname\", _firstname);\n        }\n        return firstname;\n    }\n```\n\
  \n当你的模型类有大量属性时，请考虑使用这种另一种实现方式。我们没有在 `Person` 类中使用懒求值，因为 `Person` 包含一个需要急进 JavaFX\
  \ 属性求值的计算属性。参见第 135 页的“计算属性”。\n\n### 对象属性\n\nJavaFX 为原始属性类型和 `String` 类提供了属性实现。你已经见过用于抽象\
  \ `StringProperty` 的 `SimpleStringProperty`。还有用于抽象 `IntegerProperty` 的 `SimpleIntegerProperty`、用于抽象\
  \ `DoubleProperty` 的 `SimpleDoubleProperty` 等。对于其他类型，使用带有泛型的 `SimpleObjectProperty`。例如，使用\
  \ `SimpleObjectProperty<Color>` 作为抽象 `ObjectProperty<Color>`。\n\n`Listing 4.3` 展示了如何使用\
  \ `SimpleObjectProperty<Person.Gender>` 和 `ObjectProperty<Person.Gender>` 实现 `Person`\
  \ 的性别属性，该属性封装了一个 `Person.Gender` 值。在这里，我们使用了在第 132 页 `Listing 4.1` 中为属性 `firstname`\
  \ 展示的非懒性实现。构造函数设置了对容器 Bean（`this`）、属性名称（`\"gender\"`）和初始值（`Gender.UNKNOWN`）的引用。setter\
  \ 和 getter 将调用转发给 JavaFX 属性的 setter 和 getter。`genderProperty()` 方法在用户需要创建绑定表达式或挂载监听器时返回\
  \ JavaFX 属性。\n\n**Listing 4.3 Person JavaFX 属性 gender**\n\n```java\n. . .\n    public\
  \ enum Gender {\n        ALE, FEMALE, UNKNOWN\n    }\n    private final ObjectProperty<Person.Gender>\
  \ gender = new SimpleObjectProperty<>(this, \"gender\", Gender.UNKNOWN);\n    public\
  \ Person.Gender getGender() {\n        return gender.get();\n    }\n    public void\
  \ setGender(Person.Gender gender) {\n        gender.set(gender);\n    }\n    public\
  \ final ObjectProperty<Person.Gender> genderProperty() {\n        return gender;\n\
  \    }\n```\n\n### 不变属性\n\n记得我们 `Person` 类中的属性 `id` 是不可变的。在这种情况下，没有必要创建 JavaFX 属性。JavaFX\
  \ 属性专门设计用于跟踪属性值的变化，而这在不可变对象上是不可能的。你可以轻松地使用不可变属性的值来更新另一个属性。这里有一个示例，将标签的文本设置为 `id`\
  \ 属性的值：\n\n```java\nmyLabel.setText(Person.getId());\n```\n\n如果你有一个依赖于 `id` 属性值的属性，你仍然可以在带有\
  \ Fluent API 的绑定表达式中使用 `getId()`。尽管观察不可变属性没有意义，但你仍然可以为属性 `id` 提供一个 JavaFX 属性实现（为了完整性）。在这种情况下，你应该使用第\
  \ 133 页 `Listing 4.2` 中描述的“懒性创建”方法。\n\n### 计算属性\n\n`Listing 4.4` 展示了第 2 章中 `Person`\
  \ 方法 `toString()` 的实现。它返回一个格式良好的字符串，该取决于 `firstname`、`middlename` 和 `suffix` 属性，并且在值为空时排除它们。\n\
  \n**Listing 4.4 用于 Person 的常规 JavaBean toString 方法**\n\n```java\n@Override\npublic\
  \ String toString() {\n    StringBuilder sb = new StringBuilder();\n    if (!firstname.isEmpty())\
  \ {\n        sb.append(firstname);\n    }\n    if (!middlename.isEmpty()) {\n  \
  \      sb.append(\" \").append(middlename);\n    }\n    if (!lastname.isEmpty())\
  \ {\n        sb.append(\" \").append(lastname);\n    }\n    if (!suffix.isEmpty())\
  \ {\n        sb.append(\" \").append(suffix);\n    }\n    return sb.toString();\n\
  }\n```\n\n让我们在 JavaFX 中创建一个只读属性，根据这些相同的属性计算其值。像 `toString()` 一样，我们将使用 `StringBuilder`\
  \ 来构建一个格式良好的字符串，并且仅在值为空时不包含它们。我们将此计算 `StringProperty` 称为 `fullname`。由于我们希望 `getFullName()`\
  \ 方法始终返回最新的值，因此我们创建一个自定义绑定，以保持属性 `fullname` 与其依赖的其他属性保持同步。`Listing 4.5` 展示了这个自定义绑定对象。\n\
  \n使用 `super.bind()`，匿名构造函数设置了属性依赖：`firstname`、`middlename`、`lastname` 和 `suffix`。`computeValue()`\
  \ 方法构建字符串，其看起来与 `Listing 4.4` 中的 `toString()` 实现非常相似。\n\n**Listing 4.5 用于属性 fullname\
  \ 的自定义绑定对象**\n\n```java\npublic class Person implements Serializable {\n. . .\n\
  \    private final StringBinding fullNameBinding = new StringBinding() {\n     \
  \   {\n            super.bind(firstname, middlename, lastname, suffix);\n      \
  \  }\n        @Override\n        protected String computeValue() {\n           \
  \ StringBuilder sb = new StringBuilder();\n            if (!firstname.get().isEmpty())\
  \ {\n                sb.append(firstname.get());\n            }\n            //\
  \ ... rest of code\n```\n\n\n\n\n\n```java\nif (!middlename.get().isEmpty()) {\n\
  \    sb.append(\" \").append(middlename.get());\n}\nif (!lastname.get().isEmpty())\
  \ {\n    sb.append(\" \").append(lastname.get());\n}\nif (!suffix.get().isEmpty())\
  \ {\n    sb.append(\" \").append(suffix.get());\n}\nreturn sb.toString();\n}\n};\n\
  }\n```\n\n***\n\n## 属性实现\n\n[Listing 4.6] 显示了我们对属性 `fullname` 的实现。请注意，它是完全可见的，其值可以发生变化，但没有\
  \ setter（Setter）。我们为方法 `fullnameProperty()` 返回一个 `ReadOnlyStringProperty`。这防止了属性的使用者更改其值。JavaFX\
  \ 提供了实现只读 JavaFX 属性的包装类。当你使用包装类时，会创建两个属性：一个是只读的，另一个可以修改。包装类会为你保持这些属性的同步性。\n\n[Listing\
  \ 4.6] 显示了设置 `fullname` 属性绑定的 `Person` 构造函数。通过此绑定，对属性 `firstname`、`middlename`、`lastname`\
  \ 或 `suffix` 的任何更改都会更新属性 `fullname`。如果用户绑定到属性 `fullname`，更改也将传播到用户的绑定中。现在 `toString()`\
