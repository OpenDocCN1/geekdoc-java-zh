  图 2.17 更新 JTree\n\n`JTree` 正确显示底层 `Person` 模型的方法可能是本章最重要的收获。`JTree` 组件更新其模型是因为我们定义了一个监听\
  \ `FamilyTreeManager` 变化的属性更改器。虽然我们可以在列表 2.20 中在 `Update` 按钮事件处理器中放置 `JTree` 模型更新代码，这是错误的！为什么？因为\
  \ `JTree` 模型不应与 `Update` 按钮耦合。`Person` 对象是如何被修改的（通过 `Update` 按钮或其他尚未定义的动作）不应该是相关的。\n\
  \n事实上，当你开始使用 NetBeans 平台时，你会发现一个独立执行的模块可以修改数据，而另一个模块可以反映这些变化。编辑代码不知道显示代码，反之亦然。这使得修改编辑代码（例如将\
  \ `Update` 按钮替换为 `Save` 菜单项）不会影响显示代码。因此，属性更改事件是无连接对象之间通信的强大机制。\n\n在这里，`Update` 按钮和\
  \ `JTree` 模型都依赖于 `FamilyTreeManager`，但它们之间并不相互依赖。列表 2.21 展示了 `FamilyTreeManager`\
  \ 的属性更改器。该方法从 `PropertyChangeEvent` 获取更新的 `Person` 对象，并在 `JTree` 模型中搜索目标节点。`setUserObject()`\
  \ 方法更新 `JTree` 模型，`nodeChanged()` 方法通知 `JTree` 模型哪个节点已更新，以便 `JTree` 组件可以刷新自身。\n\n\
  不仅 `Update` 按钮事件处理器没有更新 `JTree` 模型的代码，列表 2.21 中的属性更改器也没有处理任何为 `Update` 按钮提供 `Person`\
  \ 新属性值的组件（文本字段、单选按钮和文本区域）。如你所见，事件处理器有助于保持代码松松耦合。\n\n列表 2.21 FamilyTreeManager 的\
  \ PropertyChangeListener\n点击此处查看代码图像\n\n```java\nprivate final PropertyChangeListener\
  \ familyTreeListener =\n    (PropertyChangeEvent evt) -> {\n        if (evt.getNewValue()\
  \ != null && evt.getPropertyName().equals(\n```\n\n\n\n\n\n```java\nif (FamilyTreeManager.PROP_PERSON_UPDATED))\
  \ {\n    Person person = (Person) evt.getNewValue();\n    DefaultTreeModel model\
  \ = (DefaultTreeModel) personTree.getModel();\n    for (int i = 0; i < model.getChildCount(top);\
  \ i++) {\n        DefaultMutableTreeNode node = (DefaultMutableTreeNode)\n     \
  \       model.getChild(top, i);\n        if (person.equals(node.getUserObject()))\
  \ {\n            node.setUserObject(person);\n            // Let the model know\
  \ we made a change\n            model.nodeChanged(node);\n            logger.log(Level.FINE,\
  \ \"Node updated: {0}\", node);\n            break;\n        }\n    }\n}\n```\n\n\
  ## 2.4 改进用户体验 \n\n我们在上一节中展示的应用程序非常基础。当用户选择不同的 `Person` 节点时，即使用户没有对 `Person` 进行任何实际编辑，`Update`（更新）按钮也会变为启用。此外，如果用户选择了根节点（“People”），之前选中的\
  \ `Person` 仍然出现在编辑面板中。\n\n在本节中，我们将对用户界面进行改进，并在过程中发现 Swing GUI 及其组件的更多实用功能。我们将对应用程序进行以下更改：\n\
  \n- 只有在用户对编辑面板中显示的 `Person` 进行至少一次编辑后，才启用 `Update` 按钮。（如果你没有进行任何编辑，为什么要更新 `Person`\
  \ 呢？）\n- 用户点击 `Update` 按钮保存更改后，禁用 `Update` 按钮（直到用户进行进一步编辑为止）。\n- 如果用户在 `JTree` 组件中选择了不同的\
  \ `Person`，则禁用 `Update` 按钮（即使对当前显示的 `Person` 进行了更改）。\n- 如果用户选择了根节点，清空编辑表单并禁用 `Update`\
  \ 按钮。这将为用户提供预期的反馈。\n\n图 2.18 显示了用户首次从 `JTree` 组件中选择 `Person` 时的编辑面板（此处用户选择了 Bart\
