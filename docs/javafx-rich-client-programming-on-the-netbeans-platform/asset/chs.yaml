  \ node =\n```\n\n\n\n\n\n```java\n(DefaultMutableTreeNode) model.getChild(top, i);\n\
  \nif (person.equals(node.getUserObject())) {\n    node.setUserObject(person);\n\
  \    // 让模型知道我们做了更改\n    model.nodeChanged(node);\n    logger.log(Level.FINE, \"\
  Node updated: {0}\", node);\n    break;\n}\n```\n\n### 2. 向 `PersonViewerTopComponent`\
  \ 中添加 `TreeSelectionListener`\n\n向 `PersonViewerTopComponent` 中添加 `TreeSelectionListener`\
  \ 以响应所选 `JTree` 节点的更改，如 代码清单 5.9 所示。注意，在这段代码中，我们检查所选的 `JTree` 节点是否为叶子节点，这意味着用户选择了\
  \ `Person`。如果所选节点不是叶子节点，我们从 `Lookup` 中移除之前添加的 `Person` 对象（如果存在）。这使我们能够在未选择 `Person`\
  \ 对象时实现清空 `PersonEditor` 表单的功能。在下一节描述 `PersonEditorTopComponent` 模块时，我们将向您展示检测空\
  \ `Lookup` 结果的代码。\n\n**代码清单 5.9 `TreeSelectionListener` 使用 `TopComponent` 的 `Lookup`**\n\
  \n```java\n// JTree 的 TreeSelectionListener\nprivate final TreeSelectionListener\
  \ treeSelectionListener = (TreeSelectionEvent e) -> {\n    DefaultMutableTreeNode\
  \ node = (DefaultMutableTreeNode)\n            personTree.getLastSelectedPathComponent();\n\
