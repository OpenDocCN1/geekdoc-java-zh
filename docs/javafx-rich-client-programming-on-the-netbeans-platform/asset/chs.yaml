  \n每个图表都强调相同数据的不同方面。在本节中，我们将总结 JavaFX 图表的特性。首先，让我们根据已的图表、系列和数据项知识构建图表。我们将从折线图（Line\
  \ Chart）开始。除非另有说明，所有图表的构建方式都按照我们在后续章节中对折线图的描述。\n\n## 折线图\n\n折线图（参见第 760 页 的 图 15.6\
  \ 和 图 15.8））通过绘制绘制的数据系列向你展示比较趋势。由于图表会绘制连接绘图点的线条，因此你可以视觉化单个系列内部的趋势，并在存在多个系列时视觉化比较趋势。随时间绘制股票价格是折线图的一个常见应用场景。\n\
  \n代码列表 15.10 展示了如何构建 `LineChart` 的数据。`LineChartController` 类配置并设置了折线图的数据。\n\n首先，`xAxis`、`yAxis`、`chart`\
  \ 和 `lcData` 字段的声明显示 `chart` 是一个 `LineChart`，其 X 轴值为 `String`，Y 轴值为 `Number`。因此，`xAxis`\
  \ 字段是 `CategoryAxis` 类型（String 标签），`yAxis` 是 `NumberAxis` 类型（Number 值）。`lcData`\
  \ `LineChart` 数据字段类型为 `ObservableList<XYChart.Series<String, Number>>`。\n\n`createLineChart()`\
  \ 方法配置了 `LineChart`。我们添加到 `MyTableDataModel` 抽象类的方法定义了轴的标签和描述性值。X 轴是一个 `CategoryAxis`，带有一个包含类别名称\
  \ `Strings` 的观测列表。这些是 `MyTableDataModel` 的列名（String 形式的年份）。X 轴标签根据 `MyTableDataModel`\
  \ 的名称描述设置。\n\nY 轴也有标签。由于 Y 轴是 `NumberAxis` 类型，我们设置了刻度单位（tick unit）。最后，我们通过 `getLineChartData()`\
  \ 方法设置图表的标题及其数据（参见第 766 页 的 代码列表 15.11）。\n\n### 代码列表 15.10 LineChartController.java—配置折线图\n\
  \n```java\npublic class LineChartController implements Initializable {\n\n    @FXML\n\
  \    private StackPane stackpane;\n\n    @FXML\n    private CategoryAxis xAxis;\n\
  \n    @FXML\n    private NumberAxis yAxis;\n\n    @FXML\n    private LineChart<String,\
  \ Number> chart;\n\n    private ObservableList<XYChart.Series<String, Number>> lcData;\n\
  \n    private MyTableDataModel tableModel;\n\n    private static final Logger logger\
  \ = Logger.getLogger(\n            LineChartController.class.getName());\n\n   \
  \ @Override\n    public void initialize(URL url, ResourceBundle rb) {\n        createLineChart();\n\
  \    }\n\n    private void createLineChart() {\n        tableModel = Lookup.getDefault().lookup(MyTableDataModel.class);\n\
  \        if (tableModel == null) {\n            logger.log(Level.SEVERE, \"Cannot\
  \ get TableModel\");\n            LifecycleManager.getDefault().exit();\n      \
  \  }\n        xAxis.setCategories(FXCollections.observableArrayList(\n         \
  \   tableModel.getColumnNames()));\n        xAxis.setLabel(tableModel.getNameDescription());\n\
  \        yAxis.setTickUnit(tableModel.getTickUnit());\n        yAxis.setLabel(tableModel.getDataDescription());\n\
  \        chart.setTitle(tableModel.getTitle());\n        chart.setData(getLineChartData());\n\
  \        // 为 tableModel 添加 TableListener，参见第 767 页的代码列表 15.12\n    }\n}\n```\n\n\
  ***\n\n[代码列表 15.11partpart022...)] 展示了 `getLineChartData()` 方法，该方法构建了一个包含观测集合，该集合包含表中每一行的\
  \ `XYChart.Series`。表格模型 `getColumnName()` 方法返回列名（String 形式的年份）。\n\n```java\npublic\
  \ class LineChartController implements Initializable {\n    // ...\n    private\
  \ ObservableList<XYChart.Series<String, Number>> lcData;\n\n    public ObservableList<XYChart.Series<String,\
  \ Number>> getLineChartData() {\n        if (lcData == null) {\n            lcData\
  \ = FXCollections.observableArrayList();\n            for (int row = 0; row < tableModel.RowCount();\
  \ row++) {\n                XYChart.Series<String, Number> series = new XYChart.Series<>();\n\
  \                series.setName(tableModel.getCategoryName(row));\n            \
  \    for (int column = 0; column < tableModel.getColumnCount(); column++) {\n  \
  \                  series.getData().add(new XYChart.Data<>(\n                  \
  \          tableModel.getColumnName(column),\n                            (Number)\
  \ tableModel.getValueAt(row, column)));\n                }\n                lcData.add(series);\n\
  \            }\n        }\n        return lcData;\n    }\n}\n```\n\n***\n\n[代码列表\
  \ 15.12partpart022...)] 展示了我们添加到 `tableModel` 字段的 `TableModelListener`。由于 `tableModel`\
  \ 继承了 `TableModel`，它提供了添加监听器的支持。处理器获取更改值的行和列，并从事件中获取新值。在 JavaFX 线程中，处理器获取对应于更改行的系列，并通过\
  \ `setYValue()` 更新相应的数据。\n\n```java\npublic class LineChartController implements\
  \ Initializable {\n    // ...\n    private void createLineChart() {\n        //\
  \ ...\n        // 设置响应表格事件\n        // 这是一个 Swing 事件，因此我们必须使用 Platform.runLater()\
  \ 更新 JavaFX 组件\n        tableModel.addTableModel((TableModelEvent e) -> {\n    \
  \        if (e.getType() == TableModelEvent.UPDATE) {\n                final int\
  \ row = e.getFirstRow();\n                final int column = e.getColumn();\n  \
  \              final Number value = (Number)((MyTableDataModel)e.getSource()).getValueAt(row,\
  \ column);\n                Platform.runLater(() -> {\n                    XYChart.Series<String,\
  \ Number> s = chart.getData().get(row);\n                    LineChart.Data<String,\
  \ Number> data = s.getData().get(column);\n                    data.setYValue(value);\n\
  \                });\n            }\n        });\n    }\n}\n```\n\n\n\n\n# 散点图\n\
  \n图 15.9 显示了 SDA 的散点图（也称为 XY 图表）。散点图擅长显示大量数据集，并可能显示 X 轴和 Y 轴值之间的相关性。对于智能手机销售数据，我们看到销售年份与销售数量之间存在轻微的正相关。也就是说，每年的销售量越来越大。\n\
  \n![](img/image9504.jpg)\n### 图 15.9 散点图\n\n使用智能手机销售数据构建散点图的方法与构建折线图完全相同。首先，为散点图创建一个模块并创建一个窗口（`ScatterChartTopComponent`）。接下来，添加\
  \ `scatterchart.fxml` FXML 文件和 JavaFX 控制器类 `ScatterChartController.java`。在 `scatterchart.fxml`\
  \ 中，使用 `<ScatterChart>` 元素作为图表控件。JavaFX 控制器类负责构建数据并配置图表。代码与上一节所示折线图代码相同，只是你使用 `ScatterChart`\
  \ 代替 `LineChart`。你可以通过 CSS 样式更改散点图符号，具体参见第 763 页上的“图表样式”。\n\n# 柱状图\n\nJavaFX 柱状图是一种为数值绘制条形的\
  \ XY 图表。柱状图有助于可视化随时间的变化。你还可以比较每个时间范围内的多个序列。水平柱状图当视线从左到右跟随图表时，强调了最大值。垂直柱状图则强调了随时间的变化。\n\
  \n在 JavaFX `BarChart` 中，条形的方向取决于哪一个轴是 `CategoryAxis`（分类轴），哪一个轴是 `NumberAxis`（数值轴）。在图\
  \ 15.10 中，左侧的图表是垂直柱状图，将 X 轴定义为 `CategoryAxis`，Y 轴定义为 `NumberAxis`。右侧的图表是水平柱状图，交换了数值轴和分类轴。\n\
  \n![](img/image9515.jpg)\n### 图 15.10 垂直和水平柱状图\n\n构建垂直柱状图并定义 `TableModelListener`\
