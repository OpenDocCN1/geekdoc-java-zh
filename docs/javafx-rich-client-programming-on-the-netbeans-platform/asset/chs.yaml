  让我们整合本章涵盖的概念，并构建一个如[图 7.25]所示的 `FamilyTreeApp` 版本。在这个版本中，我们将除 `notes` 属性外的所有 `PersonNode`\
  \ 属性设置为只读。我们配置 `Properties` 窗口以便编辑，并使用 `OutlineView` 作为我们的 `Explorer View`，为 `notes`\
  \ 属性定义一个列。\n\n![](img/image4475.jpg)图 7.25 带有新 SelectionHistory 窗口的 FamilyTreeApp\n\
  \n`FamilyTreeApp` 还包含一个新的 Selection History 窗口，该窗口会在用户进行选择（并更改 `Global Selection\
  \ Lookup`）时更新。这允许你维护所选节点的历史。此外，我们会在应用程序状态栏中显示用户的当前选择，它保留一两秒后会被清除。新窗口在自己的模块中实现，因此可以添加或移除。此外，如果你为应用程序配置了\
  \ `Plugin Manager`，应用程序的用户就可以动态卸载或重新安装此模块（有关如何配置 `Plugin Manager` 以及如何动态安装模块的说明，请参见第\
