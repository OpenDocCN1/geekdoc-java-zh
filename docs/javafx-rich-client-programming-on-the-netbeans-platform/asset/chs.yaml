  \n\n\n## 4.8 关键点总结\n\n本章探索了在桌面应用中使用 JavaFX 的方法，在这些应用中，用户可以看到模型数据并对数据进行更改。我们讨论了如何使用\
  \ JavaFX 属性创建模型类以及使用可观察集合。我们展示了构建 UI 的典型 JavaFX 控件，如 `TreeView`、`TextField`、`RadioButton`、`Label`、`TextArea`\
  \ 和 `Button`。我们创建了监听来响应变化，并使用绑定表达式保持模型数据与 UI 控件同步。最后，我们展示了如何使用 JavaFX 创建后台任务，并注意线程安全以及仅在\
  \ `JavaFX Application Thread` 上更新场景图。\n\n以下是本章的要点：\n\n* JavaFX 为抽象的 JavaFX 属性类提供了实现，这些类封装了类型的值。例如，`SimpleStringProperty`\
  \ 实现了 `StringProperty` 并封装了 `String` 值，`SimpleIntegerProperty` 实现了 `IntegerProperty`\
  \ 并封装了 `Integer`，依此类推。\n* 使用 `SimpleObjectProperty<T>` 提供 JavaFX 属性的实现，该属性封装了类型为\
  \ `T` 的 `Object`。我们使用 `SimpleObjectProperty<Person.Gender>` 创建了一个封装了 `Person.Gender`\
  \ 枚举值的 JavaFX 属性。\n* 考虑实现具有延迟求值的 JavaFX 属性。这种策略可以防止在附加监听器或应用绑定之前对 JavaFX 属性进行实例化。\n\
  * 不可变的值不需要 JavaFX 属性实现。\n* JavaFX 计算属性使用绑定表达式来保持计算值与它依赖的属性保持同步。\n* JavaFX 提供了只读属性包装器以实现\
  \ JavaFX 只读属性。当你使用包装类时，会创建两个同步的属性。其中一个是公开的且只读的；另一个可以被修改，并封装在模型类中。\n* 当你创建一个只读的 JavaFX\
  \ 属性时，为该只读属性和获取方法（getter）暴露公共方法，但不暴露设置（setter）。\n* 当模型类拥有 JavaFX 属性时，使用绑定来保持模型和\
  \ UI 同步。\n* JavaFX 提供了可观察集合。`FXCollections` 类包含了静态方法，返回与 `java.util.Collections`\
  \ 中提供的相同集合类型的可观察版本。\n* 可观察集合允许你通过在集合上附加变化监听器和失效监听器来响应变化。`InvalidationListener` 是类型中立的，而\
  \ `ChangeListener` 类型取决于底层集合的类型。\n* 我们在 `FamilyTreeManager` 中使用 `ObservableMap<Long,\
  \ Person>` 来维护 `Person` 项集合。\n* `MapChangeListener` 允许你响应可观察映射的变化。你可以判断变化是添加、更新还是删除，并且可以访问旧值和新值。\n\
  * Scene Builder 是一个生成 `FXML` 的独立应用程序。你可以通过拖放操作在设计区域放置控件，并使用右键菜单和属性表配置控件。\n* JavaFX\
  \ 控件会生成一个或多个事件，你可以监听这些事件并使用事件处理程序进行响应。\n* 你可以为 `TreeView` 模型的选择属性附加一个 `ChangeListener`\
  \ 以监听选择变化。\n* 使用双向绑定来保持 UI 和模型对象的同步。\n* JavaFX 是单线程 UI。将长时间运行的任务放在后台线程中，以保持 UI 的响应性。\n\
  * JavaFX `Tasks` 允许你在后台线程中执行耗时代码并安全地更新 UI。后台任务包括状态属性，你可以安全地将其与 UI 控件变量绑定。\n* 通常情况下，你不应该在后台线程中更新可观察值。\n\
  * 要通过后台任务发布部分结果，请使用线程安全的 `Task` 方法 `updateValue()`，或者将任何对公共属性或场景图的更新封装在 `Runnable`\
  \ 中并使用 `Platform.runLater()` 执行。\n\n# 5. 模块化简介\n\n在涵盖了 Swing 的基础知识后，是时候探索 NetBeans\
  \ Platform 应用架构了。在本章中，你将学习如何构建一个使用 NetBeans Platform 窗口系统的模块化应用，并利用 NetBeans Platform\
  \ 技术保持模块之间的松耦合。\n\n## 你将学到\n\n* 理解 NetBeans 模块系统。\n* 创建一个 NetBeans Platform 应用并向其添加模块。\n\
  * 将 Swing 应用迁移到 NetBeans Platform。\n* 为 NetBeans Platform 应用创建窗口。\n* 使用 `Lookup`\
  \ 发现服务提供者。\n* 使用 `Lookup` 在模块之间共享对象。\n\n## 5.1 模块化架构\n\n尽管第 2 章中的应用非常基础，但它们遵循了松耦合的设计。也就是说，更改模型数据的用户事件会产生属性更改事件，并让感兴趣的订阅者做出响应。同样，当用户选择不同的\
  \ `Person` 进行编辑时，选择监听器会让订阅者知道用户选择了一个新对象。这些机制将事件处理代码与属性更改和选择事件隔离开。然而，我们在第 2 章中展示的应用本身是单体结构的，我们使用\
  \ Java 类的可见性来封装功能。当你向此类应用添加更多功能时，隔离应用程序的不同部分将变得困难，且依赖关系会变得更加错综。\n\nNetBeans Platform\
  \ 不仅提供了广泛的功能（窗口系统、动作框架、菜单栏和工具栏等），NetBeans Platform 还为你的应用提供了一个架构框架。也就是说，NetBeans\
  \ Platform 提供了一个支持名为 `Runtime Container`（运行时容器）模块系统的执行环境。`Runtime Container` 由加载和执行你的应用所需的最小模块组成。\n\
  \n### 模块\n\n模块是 NetBeans Platform 的基本构建块。模块是功能相关的类的集合，它们存储在 `JAR` 文件中，并附带元数据。元数据为\
  \ `Runtime Container` 提供有关模块的信息，例如模块名称、版本信息、依赖关系以及它的公共包列表（如果有）。\n\nNetBeans Platform\
  \ 运行时容器强制模块的封装。这使得应用程序保持了独立性。当你向此类应用添加更多功能时，隔离应用程序的不同部分将变得困难，且依赖关系会变得更加错综。\n\n（注：此处原文存在重复段落，根据指令“不要重复输出原文”及“翻译内容”逻辑，译文已按逻辑整合，去除了重复的描述性描述。以下为后续的要点翻译：）\n\
