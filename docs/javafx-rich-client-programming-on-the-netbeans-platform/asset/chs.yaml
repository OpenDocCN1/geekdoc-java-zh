  \ 10.6 新建人员操作创建一个新人员\n\n## 实现更新\n\n当用户在编辑器中打开选定的 `PersonNode`、进行更改并点击“保存”或“全部保存”菜单项时，会触发\
  \ `Update` 函数。对于更新，`AbstractSavable` 会启用或禁用“保存”和“全部保存”菜单项。我们使用 `Openable` 来实现在编辑器中打开\
  \ `Person`。[第 [473] 页的图 10.2 显示了用户在 `PersonEditor` 中进行更改后，“保存”/“全部保存”菜单项以及“全部保存”图标变为启用状态。[图\
  \ 10.7 显示了内置的“显示已打开文档列表”功能，它显示了当前打开的 `PersonEditor TopComponents` 列表。(OEBPS/image6356.jpg)图\
  \ 10.7 内置的显示已打开文档列表\n\n实现更新需要对应用程序进行几处不同的修改，但这些修改都遵循 NetBeans Platform Action 框架中的已知指南。结果是一个内聚且协作的功能。以下是更改的摘要：\n\
  \n- 创建新模块以存放 `EditorManager` 服务提供者接口并将其包设为公共。\n- 实现 `EditorManager` 服务提供者并添加到 `PersonEditor`\
  \ 模块中。（`PersonEditorTopComponent` 已经包含在 `PersonEditor` 模块中了。）\n- 使用标准的 NetBeans\
  \ Platform 上下文 `Openable` 实现打开编辑器。在 `PersonNode` 中放置 `Openable` 的实现。该 `Openable`\
  \ 实现将查找 `EditorManager` 服务提供者，并获取且打开所选 `PersonNode` 的编辑器。\n- 创建 `OpenAction` 为上下文为\
  \ `Openable` 的上下文感知操作。将 `OpenAction` 设置为 `PersonNode` 的首选操作。这使得双击即可在编辑器中打开节点的 `Person`。\n\
  - 每个 `Person` 都有自己的自己的 `PersonEditor`（一个 `TopComponent`），它与该 `Person` 永久关联。`EditorManager`\
  \ 会查找该 `TopComponent` 或根据需要创建它，并带焦点打开 `TopComponent`。\n- 在编辑器中，检测用户何时对领域对象（`Person`）进行更改，并在编辑器的\
  \ `Lookup` 中放置 `AbstractSavable` 的实现。这将启用工具栏中的“全部保存”以及文件菜单中的“保存”和“全部保存”。\n- 使用 `FamilyTreeManager`\
  \ 属性更改监听器来检测正在编辑的 `Person` 是否被删除。当发生删除时，注销编辑器（`TopComponent`）并将其关闭。\n- 编辑器重写 `canClose()`\
  \ 方法，如果存在未保存的更改，则提示用户关闭。\n\n让我们从 `EditorManager` 服务及其实现开始。\n\n### 创建并配置模块 EditorManager\n\
  \n1. 展开 `FamilyTreeApp`，右键点击 `Modules` 节点，并从上下文菜单中选择 `Add New...`。\n2. NetBeans\
  \ 显示“添加新模块名称和位置”对话框。对于项目名称（Project Name），请指定 `EditorManager`。接受其余字段的默认值并点击下一步。\n\
  3. 在“基本模块配置”对话框中，为代码名称基（Code Name Base）指定 `com.asgteach.familytree.editor.manager`。接受其余字段的默认值并点击完成。\n\
  \nNetBeans 创建了项目 `EditorManager`。现在设置依赖。\n\n1. 展开项目 `EditorManager`，右键点击 `Libraries`\
