  \ 选择项目目录。接受其余字段的默认值。点击 `Finish`。\n\n```\n图 6.4 New Name 和 Location 对话框\n```\n\n\
  NetBeans 创建了一个没有添加用户模块的基础 NetBeans Platform 应用程序。图 6.5 显示了新创建的 `FXDemoApp` 应用程序的项目视图。\n\
  \n```\n图 6.5 FXDemoApp 项目视图\n```\n\n### 创建 NetBeans 模块\n\n你现在为应用程序窗口创建一个模块。\n\n\
