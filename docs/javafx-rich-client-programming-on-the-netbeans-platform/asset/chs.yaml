  \ 5 章中描述的架构优势。\n\n## 6.4 关键点总结\n\n在上一章中，你学习了如何构建设计良好、松耦合的 NetBeans Platform 应用程序，这种应用程序是模块化的，并使用\
  \ `Lookup` API 来发现服务提供者和模块间通信。在本章中，我们使用相同的特性（模块和 `Lookup`）来构建包含 JavaFX 内容的 NetBeans\
  \ Platform 应用程序。在这里，我们专注于 JavaFX 的集成问题。特别是，我们讨论了 Swing EDT 与 JavaFX 线程之间的交互、在 `JFXPanel`\
  \ 组件中嵌入 JavaFX 的机制，以及 Swing `TopComponent` 代码与 JavaFX 场景图之间的通信策略。\n\n以下是本章的关键点：\n\
  \n* 你通过向 Swing `JFXPanel` 控件添加场景图，将 JavaFX 内容嵌入到 NetBeans Platform 应用程序中。\n* 你将\
  \ JavaFX 内容放置在 `TopComponent`（窗口）中。\n* 仅需少量修改，即可将 `FXML` 文档和控制器类复制到带有 `TopComponent`\
  \ 的 NetBeans 模块中。\n* `TopComponent` 构造函数实例化 `JFXPanel` 组件，然后调用 `FXML Loader` 构建场景图。\n\
  * `JFXPanel` 隐式地初始化 JavaFX 运行时。\n* 使用 `Platform.setExplicitExit(false)` 防止在最后一个带有\
  \ JavaFX 内容的窗口关闭时 JavaFX 运行时退出。\n* `TopComponent` 将创建 JavaFX 内容的代码封装在 `Runnable`\
  \ 中，并使用 `Platform.runLater()` 调用其执行。\n* 访问或操纵 JavaFX 场景图的代码必须在 JavaFX 线程上执行。\n*\
  \ 创建 JavaFX 场景图的 `TopComponent` 代码类似于 JavaFX 应用程序中 `start()` 方法中的代码。\n* `JFXPanel`\
  \ 透明地将所有输入和焦点事件转发给 JavaFX 运行时。\n* `SwingNode` 是一个 JavaFX 控件，允许你将 Swing 内容安装到 JavaFX\
  \ 场景图中。\n* `TopComponent` 与嵌入的 JavaFX 场景图内容之间的通信策略可以特征为：自包含的、单向、带等待的单向和双向。\n* 当\
  \ `TopComponent` 必须访问或修改 JavaFX 场景图时，在 JavaFX 控制器类中提供公共方法。\n* 当 `TopComponent` 必须等待\
  \ JavaFX 控制器方法完成时，使用 `Concurrency` 库中的 `CountDownLatch`。\n* 提供选择事件的 JavaFX 窗口会将选中的项放入\
  \ `Lookup` 容器（`InstanceContent`）中，然后由 `TopComponent` 发布。\n* 启用了 JavaFX 的 NetBeans\
  \ Platform 应用程序使用服务提供者、监听器和监听事件来提供模块化且松耦合的设计。这与你在仅基于 Swing 窗口的 NetBeans Platform\
  \ 应用程序中使用的方法相同。\n\n## 7. 节点与资源管理器视图\n\n大多数应用程序都需要用户从窗口显示的许多对象中选择对象。幸运的是，NetBeans\
  \ Platform 允许你轻松地组织业务对象、在窗口中显示它们并对其进行操作。在本章中，你将学习如何使用 `Nodes` API 来组织业务对象。你还将学习如何使用\
  \ `Explorer Views` 来显示对象，并使用 `Explorer Manager` 控制该过程。\n\n## 你将学到\n* 创建反映业务对象结构的节点层次结构。\n\
  * 利用节点属性支持、`Properties` 窗口和其他组件来显示和编辑业务对象属性。\n* 使用户选择在 `Global Selection Lookup`\
  \ 中可用。\n* 使用 `FilterNode` 创建节点层次结构的备状态。\n* 根据演示需求选择并使用适当的 `Explorer View`。\n* 以表格形式显示业务数据，并将对象属性作为列。\n\
  * 创建一个 `Selection History` 模块，显示用户选择的历史列表。\n\n### 7.1 NetBeans 模型-视图-控制器\n\n在第 5\
  \ 章中（参见第 244 页的“我们目前知道什么”），我们曾建议 `Nodes` API 使业务对象的选择管理和显示变得更容易、更灵活。在本章中，我们将通过引入\
  \ `Nodes` API、`Explorer Views` 和 `TopComponent` 的 `Explorer Manager` 来展示这一点。\n\n\
  NetBeans 节点封装了业务对象。在模型-视图-控制器模式的背景下，节点是模型。节点具有层次结构，顶部有一个根节点，每个节点都包含一个子容器。叶节点的子容器具有特殊标记\
  \ `Children.LEAF`。为了显示节点层次结构，NetBeans 提供了几种 `Explorer Views`，它们是作为模型的 Swing 组件。一个或多个\
  \ `Explorer View` 组件构成了视图。NetBeans 还有一个 `Explorer Manager` 作为控制器来操作视图和模型。图 7.1 显示了这三个组件之间的关系。(OEBPS/image004.jpg)图\
  \ 7.1 用于显示的 NetBeans 模型-视图-控制器\n\n你并不直接将 `Explorer Views` 连接到 `Explorer Manager`。相反，你将\
  \ `Explorer Manager` 的根节点（称为 `Root Context`）设置为节点层次结构的根节点。`Explorer Views` 通过搜索组件树找到实现\
  \ `ExplorerManager` 的组件来访问 `Explorer Manager`。`Explorer Views` 使用此提供者访问 `Explorer\
  \ Manager` 及其层次结构。你不需要为此编写任何代码。所有 `Explorer Views` 共享以下行为：\n\n* 显示节点层次结构。\n* 响应用户选择。\n\
  * 响应节点层次结构的变化。\n* 通过搜索组件树找到实现 `ExplorerManager` 的组件（即它们的控制器 `Explorer Manager`）。\n\
  \n为什么这种设计对 NetBeans 开发者意义重大？\n* 由于所有 `Explorer Views` 使用相同的模型（节点），你的节点层次结构适用于所有它们。这意味着如果你想将树形视图改为图标视图，只需更改\
  \ `Explorer View` 组件（一两行代码）。\n* 你可以使用相同的 `Explorer Manager` 对相同的节点层次结构使用多个 `Explorer\
  \ View`。这允许你用不同的视图显示同一个层次结构。\n* 通过一行代码，你可以告诉 `Explorer Manager` 将所有选择（单选或多选）放入 `TopComponent`\
  \ 的 `Lookup` 中。\n\n在本章中，我们将展示如何使用 `Explorer Manager`、`Explorer Views` 和 `Nodes API`\
  \ 来呈现和管理层次数据。我们将提供多个示例来显示不同的节点类型以及 `Explorer Views`。例如，图 7.2 显示了用户完成 Person 更新后的\
  \ `FamilyTreeApp`。此版本的应用程序基于第 5 章。然而，左窗口使用 `Nodes` API 而不是 Swing `JTree` 组件来显示数据。`Person\
  \ Editor` 模块未做任何更改。(OEBPS/image020.jpg)图 7.2 使用 Nodes 和 Explorer Views 运行的 FamilyTreeApp\n\
  \n### 7.2 节点\n\n让我们从 `Nodes` API 开始。节点封装业务对象并创建层次结构。它们为业务对象提供了可配置的显示。节点有一个持有封装对象的\
  \ `Lookup`。节点还有 `context`，即一组可以动态启用和禁用的 `Actions`。通过其 `Lookup`，节点具有动态可配置的功能。在本章中，我们将限于构建节点层次结构并描述节点如何与\
  \ `Explorer Manager` 和 `Explorer Views` 交互。我们在第 9 章中讨论 `Action` 框架和功能。\n\n`Nodes\
  \ API` 提供了父类 `Node` 的多种实现。`AbstractNode`非抽象）提供了 `Node` 类的通用实现。`BeanNode` 使用反射为其封装的对象提供\
  \ JavaBean 属性支持。使用 `BeanNode` 时，你会启用其他组件功能，允许你检查和修改封装的对象。`IndexedNode` 允许对数据列表进行排序，尽管你用\
  \ `AbstractNode` 和 `BeanNode` 实现列表排序和重排。`FilterNode` 与已创建的节点层次结构配合使用，帮助根据一个或多个标准显示节点子集。在本章中，我们将展示如何使用\
  \ `AbstractNode`、`BeanNode` 和 `FilterNode`。我们在第 14 章中讨论 `DataNode`（参见第 677 页的“使用\
  \ DataNode 和 Lookup”）。图 7.3 显示了 `Node` 类的层次结构。(OEBPS/image4029.jpg)图 7.3 NetBeans\
  \ 节点层次结构\n\n所有节点都包含一个类为 `Node.Children` 的子容器。当你创建一个节点时，也指定如何创建它的子节点。如果节点是叶节点（无子节点），你使用特殊标记\
  \ `Children.LEAF`。`Nodes API` 包含了创建子节点的若干选项。但推荐的方法是扩展 `ChildFactory<T>`，其中 `T` 是你封装的业务对象的类型。这意味着当你创建一个带有子节点的节点时，你提供一个\
  \ `ChildFactory`。节点还支持 Java 事件模型并触发更改事件。节点支持 `NodeListener` 和 `PropertyChangeListener`。`NodeListener`\
  \ 支持节点本身的变化，如节点销毁、子节点添加、删除、重排序以及名称、显示名称和短描述的更改。`PropertyChangeListener` 支持节点属性集的变化（我们将在本章稍后讨论）。当节点层次结构因添加或删除子节点而变化时，监听这些\
  \ `Explorer Views` 会做出响应并更新视图。这一切都在后台静默进行，但当更新需要某些操作时，你可以自己监听事件。我们将在构建多级层次结构时进一步讨论节点事件。\n\
  \n### 构建节点层次结构\n\n让我们展示如何通过替换第 5 章](#part0012.xhtml)中 `FamilyTreeApp` 应用程序中的 `PersonViewer`\
  \ 模块来构建单级节点层次结构（参见图 5.3，位于第 202 页）。在本示例中，我们将创建一个显示来自 `FamilyTreeManager` 的 `Person`\
  \ 对象的窗口。新模块将使用节点和 `Explorer Views`，如图 7.2 所示。你再次看到构建应用程序时使用模块的优势。\n\n#### 创建 GenderViewer\
  \ 模块\n\n按照以下步骤从 `FamilyTreeApp` 应用程序中移除 `PersonViewer` 模块并创建一个模块。\n1. 在项目视图中，展开\
  \ `FamilyTreeApp | Modules` 节点。右键点击 `PersonViewer` 模块。\n2. 从右键菜单中选择 `Remove`。这将从应用程序中移除\
  \ `PersonViewer` 模块。\n\n\n\n\n\n## 模块的优势\n有趣的是，`FamilyTreeApp` 在没有 `PersonViewer`\
  \ 模块的情况下运行，尽管 `PersonEditor` 窗口没有任何显示或编辑的内容。\n\n1. 在 `FamilyTreeApp` 项目中选择 `Modules`\
  \ 节点，右键点击并从上下文菜单中选择 `Add New . .`。NetBeans 显示 `New Project` 向导的 `Name` 和 `Location`\
  \ 对框。\n2. 对于 `Project Name`，指定 `GenderViewer` 并接受其余字段的默认值。点击 `Next`。\n3. NetBeans\
  \ 显示 `Basic Module Configuration` 对框。为 `Code Name Base` 指定 `com.asgteach.familytree.genderviewer`\
  \ 并接受其余字段的默认值。点击 `Finish`。NetBeans 在 `FamilyTreeApp` 中创建项目 `GenderViewer`。\n\n##\
  \ 创建 TopComponent\n`GenderViewer` 模块需要一个 `TopComponent` 来显示其内容。\n\n1. 在 `Projects`\
  \ 视图中，展开项目 `GenderViewer` 的 `Source` 节点并右键点击节点 `com.asgteach.familytree.genderviewer`。从其上下文菜单中选择\
  \ `New | Window . .`。\n2. NetBeans 显示 `New Window` 向导的 `Basic Settings` 对框。在 `Window\
  \ Position` 下拉菜单选择 `explorer` 并勾选 `Open on Application Start`。点击 `Next`。\n3. NetBeans\
  \ 显示 `Name`、`Icon` 和 `Location` 对框。为 `Class Name Prefix` 指定 `Gender`，留空 `Icon` 字段并接受其余字段的默认值。点击\
  \ `Finish`。NetBeans 创建 `GenderTopComponent` 类并在 `Design` 视图中打开它。\n\n## 创建供 TopComponent\
  \ 使用的 BorderLayout\n1. 在 `Design` 视图中，在 `Navigator` 窗口中选择 `TopComponent`。\n2. 右键点击并在上下文菜单中选择\
  \ `Set Layout | BorderLayout`，如图 7.4 所示![](img/image4058.jpg)图 7.4 将 `TopComponent`\
  \ 的布局设置为 `BorderLayout`\n\n## 创建 PersonNode 类\n现在让我们创建构建节点层次级所需的 Java 类。图 7.5 显示了\
  \ `Gender` 窗口（分离状态），其中在根节点 `People` 下出现了 `Person` 节点。在这里我们在人的名字前面显示特殊符号以表示性别。我们使用\
  \ `|` 表示 `Gender.MALE`，用 `*` 表示 `Gender.FEMALE`，用 `?` 表示 `Gender.UNKNOWN`![](img/image4065.jpg)图\
  \ 7.5 带有性别符号的节点层次级\n\n为了让 `Gender` 窗口访问 NetBeans `Nodes API` 以及 `Explorer` 和 `Property\
  \ Sheet API`，你需要设置依赖项。你还需要对 `FamilyTreeModel` 模块设置依赖，以便访问 `Person` 和 `FamilyTreeManager`。\n\
  \n1. 在 NetBeans `Projects` 视图中，右键点击 `GenderViewer` 项目的 `Libraries` 节点。在上下文菜单中选择\
  \ `Add Module Dependency`。\n2. NetBeans 显示 `Add Module Dependency` 对框。选择模块 `Explorer`、`Property\
  \ Sheet API`、`FamilyTreeModel` 和 `Nodes API`。点击 `OK`。NetBeans 为这些模块添加依赖项，并将库添加到\
  \ `GenderViewer` 模块的 `Libraries` 节点中。\n\n现在让我们从底部开始构建 `Gender` 窗口节点层次级的节点类。也就是说，我们首先构建类\
  \ `PersonNode`，这是一个扩展了 `AbstractNode` 并实现 `PropertyChangeListener` 的节点。这是一个封装 `Person`\
  \ 对象的叶子节点，其子节点类型指定为 `Children.LEAF`。Listing 7.1 显示了 `PersonNode.java`。Listing 7.1\
  \ `PersonNode.java` 点击此处查看代码图片\n\n* * *\n\n```java\n@NbBundle.Messages({\n    \"\
  HINT_PersonNode=Person\"\n})\n\npublic class PersonNode extends AbstractNode\n \
  \           implements PropertyChangeListener {\n\n    public PersonNode(Person\
  \ person) {\n        super(Children.LEAF, Lookups.singleton(person));\n        setIconBaseWithExtension(\n\
  \            \"com/asgteach/familytree/genderviewer/resources/personIcon.png\");\n\
  \        setName(String.valueOf(person.getId()));\n        setDisplayName(person.toString());\n\
  \        setShortDescription(Bundle.HINT_PersonNode());\n    }\n\n    @Override\n\
  \    public String getHtmlDisplayName() {\n        Person person = getLookup().lookup(Person.class);\n\
  \        StringBuilder sb = new StringBuilder();\n        if (person == null) {\n\
  \            return null;\n        }\n        sb.append(\"<font color='#5588FF'><b>\"\
  );\n        switch (person.getGender()) {\n            case MALE:\n            \
  \    sb.append(\"| \");\n                break;\n            case FEMALE:\n    \
  \            sb.append(\"* \");\n                break;\n            case UNKNOWN:\n\
  \                sb.append(\"? \");\n                break;\n        }\n       \
  \ sb.append(person.toString()).append(\"</b></font>\");\n        return sb.toString();\n\
  \    }\n\n    @Override\n    public void propertyChange(PropertyChangeEvent evt)\
  \ {\n        fireDisplayNameChange(null, getDisplayName());\n    }\n}\n```\n\n\n\
  \n\n\n`PersonNode` 构造函数接收一个 `Person` 对象。调用 `super()` 会为子节点指定 `Children.LEAF`，并为\
  \ `Person` 对象提供一个 `Lookup`。`Explorer Manager` 使用节点的 `Lookup` 来管理选择行为。（节点实现了 `Lookup.Provider`。）\n\
  \n构造函数通过 `setIconBaseWithExtension()` 设置节点的图标。这不仅会加载图标文件 `personIcon.png`、`personIconOpen.png`、`personIcon32.png`\
  \ 和 `personIconOpen32.png`（如果这些文件存在）。（以 32 结尾的图标文件比标准的 16 x 16 图标文件更大。）包含 `Open`\
  \ 字样的图标会在节点被打开（或展开）时使用。如果这些额外的图标文件不存在，NetBeans 将使用同一个一种图标文件并将其应用于节点的所有状态。如果你不提供图标文件，NetBeans\
  \ 将使用通用的“文档”（document）图标。\n\n`setName()` 方法为节点提供一个名称。通常情况下，你不会在设置名称后更改节点的名称。在这里，我们将\
  \ `Person getId()` 方法转换为 `String`。节点还有一个易于人类阅读的显示名称（通过 `setDisplayName()` 设置）。`Explorer\
  \ Views` 使用此名称（以及节点的图标）来显示节点。此外，如果提供了方法，`Explorer View` 会调用节点的 `getHtmlDisplayName()`\
  \ 方法。正如其名所示，你可以使用 HTML 代码子集来更改字体颜色和样式。在这里，我们使用了蓝色字体并指定了**加粗**（`<b>`），并还提供了性别符号。\n\
  \n`setShortDescription()` 方法设置节点的工具提示（tooltip）。\n\n当被封装的 `Person` 对象发生变化时，属性更改监听器会被触发，从而在事件处理程序中触发\
  \ `fireDisplayNameChange()` 方法。（我们在 `PersonChildFactory` 类中为 `Person` 对象添加了监听器，该类请见代码段格\
  \ 7.2。）\n\n为什么我们要显式地触发显示名称更改事件，而不是直接通过 `setDisplayName()` 方法更新名称呢？这个问题的答案反映了属性更改事件通用工作机制的一种微妙之处。\n\
  \n如果旧值和新值均不为空且相等，则不会触发属性更改事件。在这里，我们强制触发一个 `NodeListener` 属性更改事件，以便视图能够正确更新节点的显示名称。当你更改\
  \ `Person` 对象的性别而不改变任何其他影响名称的 `Person` 属性时，`setDisplayName()` 方法不会触发属性更改事件。`getDisplayName()`\
  \ 方法仅依赖于 `Person toString()` 方法。然而，`getHtmlDisplayName()` 依赖于 `Person gender` 属性。因此，当仅性别属性发生变化时，`displayNameChange`\
  \ 事件会强制 `Explorer View` 刷新节点已更改（HTML）显示名称。\n\n## 为 Person 创建 ChildFactory\n\n接下来，我们指定如何创建\
  \ `PersonNodes` 集合。要做到这一点，我们需要扩展 `ChildFactory<Person>` 并提供构建节点的代码。在这里，我们需要访问 `FamilyTreeManager`\
  \ 来获取 `Person` 对象列表。\n\n1. 在 `Source Packages` 下 `GenderViewer` 模块的包名上点击右键，从上下文菜单中选择\
  \ `New | Java Class`。提供名称 `PersonChildFactory`。\n2. NetBeans 创建该类并在 Java 编辑器中打开。修改该类使其继承\
  \ `ChildFactory<Person>`。修复导入（Imports）。\n3. 使用左栏的 NetBeans 提示，并此类选择 `Implement all\
  \ abstract methods`。NetBeans 会生成保护方法 `createKeys()`。\n4. 你还重写了保护方法 `createNodeForKey()`。使用\
  \ IDE 的 `Insert Code` 上下文菜单为此方法创建一个存根方法（stub）。\n\n代码段格 7.2 显示了 `PersonChildFactory`\
  \ 类的代码。\n代码列表 7.2 `PersonChildFactory.java`\n点击此处查看代码图片\n\n```java\npublic class\
  \ PersonChildFactory extends ChildFactory<Person> {\n\n    private final FamilyTreeManager\
  \ ftm;\n\n    private static final Logger logger = Logger.getLogger(\n         \
  \                      PersonChildFactory.class.getName()); \n    public PersonChildFactory()\
  \ {\n\n        this.ftm = Lookup.getDefault().lookup(FamilyTreeManager.class);\n\
  \        if (ftm == null) {\n            logger.log(Level.SEVERE, \"Cannot get FamilyTreeManager\
  \ object\");            \n            LifecycleManager.getDefault().exit();\n  \
  \      }\n        ftm.addPropertyChangeListener(familyTreeListener);\n    }\n\n\
  \    @Override\n    protected boolean createKeys(List<Person> list) {\n        list.addAll(ftm.getAllPeople());\n\
  \        logger.log(Level.FINER, \"createKeys called: {0}\", ftm.getAllPeople());\n\
  \        return true;\n    }\n\n    @Override\n    protected Node createNodeForKey(Person\
  \ key) {\n        logger.log(Level.FINER, \"createNodeForKey: {0}\", key);\n   \
  \     PersonNode node = new PersonNode(key);\n        key.addPropertyChangeListener(WeakListeners.propertyChange(node,\
  \ key));\n        return node;\n    } // 用于 FamilyTreeManager 的 PropertyChangeListener\n\
  \n    private final PropertyChangeListener familyTreeListener =\n              \
  \                  (PropertyChangeEvent evt) -> {\n\n        if (evt.getPropertyName().equals(FamilyTreeManager.PROP_PERSON_UPDATED)\n\
  \                && evt.getNewValue() != null) {\n            this.refresh(true);\n\
  \        }\n\n    };\n}\n```\n\n\n\n\n在构造函数中，我们使用 `Global Lookup`（全局查找）获取 `FamilyTreeManager`\
  \ 服务提供者的引用，并添加属性更改监听器。请记住，`FamilyTreeManager` 服务提供者在更新底层的 `Person` 对象存储器时会触发属性更改事件。\n\
  \n`createKeys()` 方法指定了工厂如何获取其创建的子节点的业务对象。在这里，我们调用熟悉的 `getAllPeople()` 方法，将 `Person`\
  \ 对象的列表添加到方法的 `List<Person>` 列表中。返回值 `true` 表示列表已完整。若要通过多次调用 `createKeys()` 来构建列表，则在列表完成之前一直返回\
  \ `false`。当业务对象列表非常极大且你希望分块返回数据时，这非常有用。\n\n`createNodeForKey()` 方法根据提供的 `Person`\
  \ 参数构建每个子节点（在此处为 `PersonNode`）。我们使用 NetBeans 平台工具方法 `WeakListeners.propertyChange()`\
  \ 为封装的 `Person` 对象添加属性更改监听器，如下文所示。\n\n点击此处查看代码图像\n\n```\nkey.addPropertyChangeListener(WeakListeners.propertyChange(node,\
  \ key));\n```\n\n“弱”引用监听器让 `Person` 对象弱引用 `PersonNode`（后者的生命周期可能比 `Person` 对象短）。这种技术避免了内存泄漏，因为该监听器永远不会被显式地移除。请注意，当\
  \ `Explorer View` 显示其内容且节点动态展开时，节点系统会为你调用这些方法。\n\n`PersonChildFactory` 属性更改监听器会对\
  \ `FamilyTreeManager` 的变化做出响应。当用户点击 `PersonEditor` UI 上的“Update”按钮时，编辑过的 `Person`\
  \ 对象将更新到 `FamilyTreeManager` 中。这会触发属性更改监听器，进而调用 `refresh()`。\n\n`refresh()` 方法非常强大且高效。当底层数据的更改影响到节点层次结构时，`refresh()`\
  \ 方法（以及监听的 Explorer View）会处理这些变化。我们的简单层次结构结构永远不会改变，因此实际上不需要调用 `refresh()`。然而，如果\
  \ `FamilyTreeManager` 的更新导致节点层次结构的重排序或重构，则调用 `refresh()` 就变得必要。我们将在下一节向你展示这种行为。\n\
  \n### 创建根节点\n\n构建此节点层次结构类的最后一步是创建根节点类。在这种情况下，根节点的工作是使用 `ChildFactory` 来指定如何构建其子节点。注意，你并不直接创建节点（你不需要调用\
  \ `createKeys()` 或 `createNodeForKey()` 方法）。相反，`Nodes API` 结合 `Explorer Manager`\
  \ 和 `Explorer Views` 会按需构建节点层次结构。列表 7.3 显示了 `RootNode` 类的代码，它也扩展了 `AbstractNode`。列表\
  \ 7.3 `RootNode.java`\n\n点击此处查看代码图像\n\n* * *\n\n```\n@NbBundle.Messages({\n    \"\
  HINT_RootNode=Show all people\",\n    \"LBL_RootNode=People\"\n})\n\npublic class\
  \ RootNode extends AbstractNode {\n    public RootNode() {\n        super(Children.create(new\
  \ PersonChildFactory(), false));\n        setIconBaseWithExtension(\n          \
  \  \"com/asgteach/familytree/genderviewer/resources/personIcon.png\");\n       \
  \ setDisplayName(Bundle.LBL_RootNode());\n        setShortDescription(Bundle.HINT_RootNode());\n\
  \    }\n}\n```\n\n构造函数调用带有 `PersonChildFactory` 实例和布尔值 `false` 的 `super()`，这会同步构建节点。布尔值\
  \ `true` 则告诉节点系统在后台线程构建子节点。当构建节点层次结构需要耗耗时的调用时，这可以保持 UI 的响应性。我们的根节点使用了与 `PersonNode`\
  \ 相同的图标。如果你运行应用程序，将看到图标在展开和折叠根节点时是如何变化的。\n\n### 显示节点层次结构\n\n在定义了节点层次结构后，让我们向你展示如何在\
  \ `TopComponent` 中显示节点。这需要一些胶接代码来连接模型-视图-控制器（MVC）元素的三个部分，如第 [292] 页](#part0014.xhtml_qMBfnXb5SheAX34J3qw_Uw18790)\
  \ 所示的 图 7.1 所示。\n\n- 使 `TopComponent` 类实现 `ExplorerManager.Provider` 并实例化 `ExplorerManager`\
  \ 类字段。\n- 覆盖抽象方法 `getExplorerManager()` 并返回 `ExplorerManager` 对象。\n- 选择一个合适的 `Explorer\
  \ View` 并将其添加到 `TopComponent` 中。在这里，我们使用 `BeanTreeView`。若要使用另一种 `Explorer View`，请替换其类名，例如\
  \ `OutlineView`。其他部分将正常工作。\n- 使用 `ExplorerUtils.createLookup()` 创建一个包含所选节点及其 `Lookup`\
  \ 的新 `Lookup`。将 `TopComponent` 的 `Lookup` 与此新的 `Explorer Manager Lookup` 关联。这会将\
  \ `Explorer View` 的选中节点放入 `TopComponent` 的 `Lookup` 中。其他监听 `Global Selection Lookup`\
  \ 变化的模块可以访问这些对象，如“跟踪全局选择”中描述。\n\n`ActionMap` 存储了与节点相关的动作。将 `EntityManager` 的根设置为你的节点层次结构。在\
  \ `componentOpened()` 中激活它，并在 `componentClosed()` 中取消激活。这消除了窗口关闭时的任何 `EntityManager`\
  \ 处理过程。列表 7.4 列出了显示节点层次结构的 `TopComponent` 代码。我们将在本章稍晚部分介绍替代 `Explorer Views`。\n\n\
  \n\n\n\n# 多级节点层次结构\n\n我们的节点层次结构包含一个根节点，其有一个子节点列表。这些子节点都是叶子节点，因此该层次结构只有两级：根节点及其子节点。在更复杂的示例中，节点层次结构可以是许多级。事实上，节点层次结构可以是无限的。由于子节点是按需创建的，你可以扩展可能无限的层次结构，直到耗尽资源。\n\
  \n让我们回顾创建表示节点层次结构所需的类的过程，如图 7.6 所示。每当你创建一个节点类时，都要指定该节点是叶子节点还是具有子节点。如果它具有子节点，你就可以需要构建一个特定于该类型子节点的\
  \ `ChildFactory`。该子节点反过来可能也有自己的 `ChildFactory`（取决于业务数据的结构，很可能是不同的 `ChildFactory`）。\n\
  \n![](img/image4150.jpg)\n图 7.6 节点与 ChildFactory 的关系\n\n让我们修改节点结构，并为男性、女性和未知创建一组性别（Gender）节点。在每个性别节点下，你将看到与其父性别节点匹配的相应\
  \ `Person`。图 7.7 显示了我们运行应用程序中这种更复杂的节点层次结构。我们还对 `PersonNode` 的显示名称进行了颜色编码，并使用了与之前相同的性别符号。\n\
  \n![](img/image4156.jpg)\n图 7.7 使用更复杂的节点层次结构\n\n再次，让我们从底向上构建所需的节点类。\n\n## PersonNode\
