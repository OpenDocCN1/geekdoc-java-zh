  \ `textfield` 数据。图 8.23 显示了一个运行示例![](img/image4900.jpg)图 8.23 带有打开 PersonTopComponent\
  \ 按钮的 WindowSystemApp\n\n## 8.6 窗口系统生命周期管理\n\n让我们通过查看 `TopComponent` 生命周期周期方法来继续对窗口系统的探索。表\
  \ 8.3 列出了这些生命周期方法，你可以在 `TopComponent` Java 代码中重写这些方法![](img/image4907.jpg)表 8.3\
  \ TopComponent 生命周期周期方法\n\n`New Window` 向导生成了 `componentOpened()` 和 `componentClosed()`\
  \ 方法。你通常在此处放置初始化/清理代码（例如，包含添加和移除事件监听器的代码）。\n\n`canClose()` 方法在窗口关闭之前被调用。这是一个检查窗口是否可以关闭的方便代码位置。例如，如果你的窗口是一个编辑器，并且对文件或领域对象进行了更改但尚未保存，你可以在此处向用户确认关闭，并根据用户的响应返回\
  \ `true` 或 `false`。\n\n如你所见，NetBeans 平台窗口系统区分了激活（activation）与隐藏/显示（hidden/showing）。当窗口拥有焦点时，窗口处于被激活状态。你可以通过选择另一个窗口来取消激活窗口。当同一个窗口容器中有多个窗口时，可以通过在相同模式下选择另一个窗口来隐藏窗口。\n\
  \n让我们对这些方法进行实验。在相同的 `WindowSystemApp` 应用程序中如下修改 `PersonTopComponent`：\n\n1. 在 Java\
  \ 编辑器中打开 `PersonTopComponent` 并选择 `Source` 以操作 Java 代码。\n2. 将光标置于方法 `componentClosed()`\
  \ 之后，右键点击并选择 `Insert Code . . .`。\n3. 当弹出菜单出现时，选择 `Generate Override Method . .\
  \ .`。\n4. 出现一个对话框，让你选择要重写的方法。选择方法 `canClose()`、`componentActivated()`、`componentDeactivated()`、`componentHidden()`\
  \ 和 `componentShowing()`，如图图 8.24 所示![](img/image4920.jpg)图 8.24 为 PersonTopComponent\
  \ 生成指定的重写方法\n5. 点击 `Generate`。NetBeans 将为你选择的方法生成 Stub 方法。\n6. 为这些方法以及 `componentOpened()`\
  \ 和 `componentClosed()` 方法提供代码，如图列表 8.9 所示。注意我们保留了对这些方法 super 的调用。\n\n```java\n\
  @Override\npublic void componentOpened() {\n    super.componentOpened();\n    System.out.println(nameTextField.getText()\
  \ + \" opened\");\n}\n\n@Override\npublic void componentClosed() {\n    super.componentClosed();\n\
  \    System.out.println(nameTextField.getText() + \" closed\");\n}\n\n@Override\n\
  public boolean canClose() {\n    return !nameTextField.getText().toLowerCase().endsWith(\"\
  guru\");\n}\n\n@Override\npublic void componentActivated() {\n    super.componentActivated();\n\
  \    System.out.println(nameTextField.getText() + \" activated\");\n}\n\n@Override\n\
  public void componentDeactivated() {\n    super.componentDeactivated();\n    System.out.println(nameTextField.getText()\
  \ + \" deactivated\");\n}\n\n@Override\npublic void componentHidden() {\n    super.componentHidden();\n\
  \    System.out.println(nameTextField.getText() + \" hidden\");\n}\n\n@Override\n\
  public void componentShowing() {\n    super.componentShowing();\n    System.out.println(nameTextField.getText()\
  \ + \" showing\");\n}\n```\n\n7. 清理所有（Clean All）；然后运行（Run）。通过运行应用程序进行实验，并检查 NetBeans\
  \ IDE 输出，`System.out.println` 语句的结果将出现在那里。例如，打开多个 Person 窗口并提供名称 Amy、Bob 和 Charlie。图\
  \ 8.25 显示了带有 Amy 的可见 Person 窗口的应用程序![](img/image4939.jpg)图 8.25 带有 TopComponent\
  \ 生命周期方法的 WindowSystemApp\n\n\n\n\n\n# Bob 激活了窗口管理器\n\n现在让我们向你展示一些操作 `TopComponents`\
  \ 的窗口管理器方法。按照以下步骤为 `OpenTopComponent` 添加第二个按钮。此按钮允许用户关闭在编辑器模式下显示的顶层 `Person` 窗口。\n\
  \n1. 在设计视图（Design view）中打开 `OpenTopComponent`，并放入一个标签为 `Close Top Person Window`\
  \ 的第二个 `JButton` 组件，如图图 8.26 所示![](img/image4953.jpg)图 8.26 带有第二个 `JButton` 组件的\
  \ OpenTopComponent 设计视图\n2. 选择该按钮。在属性（Properties）窗口中，点击 `Code` 标签。这将打开按钮的 `Code\
  \ Generation`（代码生成）选项卡。\n3. 将按钮的 `Variable Name`（变量名）更改为 `closeTopPersonButton`。\n\
  4. 现在双击按钮，这将创建方法 `closeTopPersonButtonActionPerformed()`。你现在已切换到 `OpenTopComponent`\
  \ 的源代码视图（Source view）。\n5. 为方法 `closeTopPersonButtonActionPerformed()` 提供以下代码，如图列表\
  \ 8.10 所示。列表 8.10 方法 `closeTopPersonButtonActionPerformed`点击此处查看代码图片\n\n```java\n\
  private void closeTopPersonButtonActionPerformed(\n                        java.awt.event.ActionEvent\
  \ evt) {\n\n    WindowManager wm = WindowManager.getDefault();\n\n    Mode editorMode\
  \ = wm.findMode(\"editor\");\n    for (TopComponent tc : wm.getOpenedTopComponents(editorMode))\
  \ {\n        System.out.println(\"found \" + tc.getName());\n        if (tc.isShowing()\
  \ ) {\n            if (tc instanceof PersonTopComponent) {\n                tc.close();\n\
  \            }\n            break;\n        }\n    }\n}\n```\n\n让我们讨论一下 `closeTopPersonButtonActionPerformed()`\
  \ 方法是如何关闭顶层 `Person` 窗口的。第一步是通过调用静态 `WindowManager` 方法 `getDefault()` 获取 `WindowManager`\
  \ 实例。使用窗口管理器，方法 `findMode()` 返回 `editor` 模式对象。下一步是调用 `getOpenedTopComponents()`，它提供了该模式下所有已打开的\
  \ `TopComponents` 列表。`for` 循环寻找 `isShowing()` 为 `true` 的 `TopComponent`。当我们找到它时，关闭该\
  \ `TopComponent` 并退出循环。注意，该方法还检查了正在显示的组件是否确实是 `PersonTopComponent`。在这里进行一些防御性编程并不是坏主意，以防我们以后向编辑器窗口位置添加另一个（不同的）`TopComponent`。\n\
  \n现在再次运行应用程序 `WindowSystemApp`，并确保你已经打开了几个 `Person` 窗口。点击 `Close Top Person Window`\
  \ 按钮。你会看到顶层的 `Person` 窗口关闭了。图 8.27 显示了一个示例运行结果![](img/image4971.jpg)图 8.27 带有关闭顶层\
  \ Person 窗口按钮的 WindowSystemApp\n\n# 使用 @OnShowing\n\n类似于模块系统 API 的 `@OnStart` 和\
  \ `@OnStop` 注解（参见第 242 页的“模块生命周期注解”），窗口系统 API 提供了 `@OnShowing` 注解。你将 `@OnShowing`\
  \ 注解放置在一个实现了 `Runnable` 接口并具有默认构造函数的类上。你实现的 `run()` 方法会在窗口显示时被调用。注意，`OnShowing`\
  \ `Runnable` 会在 EDT（事件派发线程）上执行。\n\n让我们为 `WindowSystemApp` 添加一个带有 `@OnShowing` 的\
  \ `Runnable`。该 `Runnable` 显示一个用户可以用 `Cancel` 或 `OK` 关闭的自定义对话框，如图图 8.28 所示![](img/image478.jpg)图\
  \ 8.28 使用 @OnShowing 显示对话框\n\n以下是步骤：\n1. 构建一个自定义面板对话框（参见第 533 页的“Dialogs”）。在 `PersonEditor`\
  \ 模块中，右键点击 `Source Packages` 包并选择 `New | Other`。在 `Choose File Type` 对话框中，在 `Categories`\
  \ 下选择 `GUI`，在 `File Types` 下选择 `JPanel`。\n2. 在 `Name` 和 `Location` 对话框中，为 `Class\
  \ Name` 指定 `Money`。\n3. NetBeans 使用 Matisse 设计器创建一个新的 `Money` 类。添加一个 `Label` 组件，并为\
  \ `icon` 属性指定 `coins.png`（或任何 `.gif` 格式的文件）。\n4. 我们我们将标准的 `Dialogplayer`，因此对 `Dialogs`\
  \ API 添加一个模块依赖。在 `PersonEditor` 模块中，选择 `Libraries` 节点，右键点击并选择 `Add Dependency`。在\
  \ `Add Module Dependencies` 对话框中，选择 `Dialogs API`。\n5. 在同一包中，创建一个名为 `ShowMeMoney`\
  \ 的 Java 文件。实现 `Runnable`，提供 `@OnShowing` 注解并实现 `run()` 方法，如图列表 8.11 所示。在这里我们创建并显示了一个自定义对话框。对话框会在用户关闭前保持阻塞。\n\
  \n```java\npackage com.asgteach.personeditor;\n\n. . . imports omitted .\n\n@OnShowing\n\
  public final class ShowMeMoney implements Runnable {\n    private final Money money\
  \ = new Money();\n\n    @Override\n    public void run() {\n        DialogDescriptor\
  \ dd = new DialogDescriptor(money, \"Here is the Money\");\n        DialogDisplayer.getDefault().notify(dd);\n\
  \    }\n}\n```\n\n## 8.7 TopComponent 模式\n\n`TopComponent` 模式定义了窗口布局中的位置。这些位置基本上是窗口容器。NetBeans\
  \ Platform 定义了一些默认模式，其布局如图图 8.29 所示。然而，这种布局是流动的。当你关闭一个窗口时，窗口管理器通常会扩展其他窗口以填充窗口框。\n\
  \n### 布局提示\n\n注意此布局在编辑器模式下包含了不同的 `TopComponent`：`Editor Left` 和 `Editor Right`。你通过\
  \ `@TopComponent.Registration` 注解中的 `position` 元素来控制同一模式下不同窗口的相对位置，如“TopComponent.Registration”所述，位于第\
  \ 358 页。\n\n\n\n\n\n你还可以使用窗口框上的缩放手来调整整个窗口的大小、调整单个窗口的大小，或者通过拖放窗口来更改窗口布局。每种模式都会影响整体窗口布局的解析方式。共有三种基本模式类型：`editor`、`view`\
  \ 和 `sliding`。每个窗口布局都有一个类型为 `editor` 的位置，即使在没有打开编辑器窗口也是如此。当你调整窗口框大时，空的编辑器区域始终存在。（如果你需要移除编辑器区域，请参阅第\
  \ 395 页上的“只读窗口布局”！）\n\n![](img/image5003.jpg)图 8.29 TopComponent 默认模式\n\n让我们来探索这些模式吧。首先，我们创建一个名为\
  \ `MyMode` 的新窗口。将其设置为单例（默认值），并将其分配给应用程序 `WindowSystemApp` 中的资源管理器窗口位置。接下来，我们在窗口\
  \ `OpenTopComponent` 中定义另一个按钮，用于让窗口 `MyMode` 在所有标准模式之间循环，在每种模式下重新停靠窗口，并用旧新新模式更新状态行。`MyModeTopComponent`\
  \ 还会根据当前模式更新其自身的标签组件。\n\n你可能已经知道如何做到这一点。如果是的话，请按照这些步骤操作。如果没有，请将这些步骤作为指南，为此应用程序添加\
  \ `Change Mode` 功能。\n\n1. 使用我们在本章中构建的 `WindowSystemApp` 创建并配置一个新的 `TopComponent`（使用\
  \ `New | Window`）。\n2. 指定 `Window Position` 为 `explorer`，选择 `Open on Application\
  \ Start`，并将 `Class Name Prefix` 指定为 `MyMode`。\n3. NetBeans 在设计视图中弹出新的 `TopComponent`。在\
  \ UI 中添加一个 `JLabel` 组件。在属性窗口中选择 `Code` 选项页，并将属性 `Variable Name` 更改为 `title`。\n4.\
  \ 在属性窗口中选择 `Properties` 选项页，并将属性 `text` 设置为 `MyMode` 作为占位符。图 8.30 显示了设计视图中配置好的 `MyModeTopComponent`。![](img/image5014.jpg)图\
  \ 8.30 MyModeTopComponent 设计视图\n5. 选择 `Source` 按钮在 Java 编辑器中打开 `MyModeTopComponent`。\n\
  6. 在文件内部右键点击并选择 `Insert Code`，重写方法 `componentActivated()`。选择 `Generate` 插入生成的代码。\n\
  7. 如代码列表 8.12 中加粗所示，向方法 `componentActivated()` 中添加代码。请注意，我们使用系统 `Window Manager`\
  \ 来查找此 `TopComponent` 的模式，并将其标签（变量名 `title`）文本设置为模式名称。\n\n此添加的代码更新了 `MyModeTopComponent`\
  \ 的标签以显示当前模式。正如你接将在代码列表 8.13 中所看到的，实现 `TopComponent` 模式更改的代码同时调用了 `open()` 和 `requestActive()`。窗口管理器随后调用\
  \ `componentActivated()`，使得该方法成为更新标签的逻辑位置。\n\n代码列表 8.12 MyModeTopComponent 方法 `componentActivated()`点击此处查看代码图像\n\
  \n```java\n@Override\nprotected void componentActivated() {\n    super.componentActivated();\n\
  \    WindowManager wm = WindowManager.getDefault();\n    title.setText(wm.findMode(this).getName());\n\
  }\n```\n\n现在让我们在 `OpenTopComponent` 中添加另一个按钮来更改 `MyModeTopComponent` 的模式。按照以下步骤操作。\n\
  \n1. 在设计视图中打开 `OpenTopComponent` 并放置一个标签为 `Change Mode` 的第三个 `JButton` 组件，如图 8.31\
  \ 所示。![](img/image5030.jpg)图 8.31 带有 Change Mode 按钮的 OpenTopComponent 设计视图\n2. 选择该按钮。在属性窗口中点击\
  \ `Code` 选项页。这将打开按钮的 `Code Generation` 选项页。\n3. 将按钮的 `Variable Name` 更改为 `changeModeButton`。\n\
  4. 现在双击按钮，创建方法 `changeModeButtonActionPerformed()`。这将你切换到 `OpenTopComponent` 的 `Source`\
  \ 视图。\n5. 为方法 `changeModeButtonActionPerformed()` 提供以下代码，如代码列表 8.13 所示。\n\n代码列表\
  \ 8.13 方法 `changeModeButtonActionPerformed()`点击此处查看代码图像\n\n```java\nprivate void\
  \ changeModeButtonActionPerformed(java.awt.event.ActionEvent evt) {\n    WindowManager\
  \ wm = WindowManager.getDefault();\n    TopComponent tc = wm.findTopComponent(\"\
  MyModeTop\");\n    if (tc != null) {\n        Mode currentMode = wm.findMode(tc);\n\
  \        Set<? extends Mode> modes = wm.getModes();\n        Mode[] modeArray =\
  \ modes.toArray(new Mode[modes.size()]);\n        for (int i = 0; i < modeArray.length;\
  \ i++) {\n            // find mode\n            if (currentMode == modeArray[i])\
  \ {\n                nextModeIndex = i + 1;\n                if (nextModeIndex ==\
  \ modeArray.length) {\n                    nextModeIndex = 0;\n                }\n\
  \                break;\n            }\n        }\n        Mode nextMode = modeArray[nextModeIndex];\n\
  \        String nextModeName = nextMode.getName();\n        String currentModeName\
  \ = currentMode.getName(); nextMode.dockInto(tc);\n        tc.open();\n        tc.requestActive();\n\
  \        StatusDisplayer.getDefault().setStatusText(\"Docking from \" + currentModeName\
  \ + \" into \" + nextModeName);\n    }\n}\n```\n\n\n\n\n\n方法 `changeModeButtonActionPerformed()`\
  \ 通过调用静态 `WindowManager` 方法 `getDefault()` 获取一个 `WindowManager` 实例。使用该窗口管理器，我们找到了\
  \ `TopComponent` “MyModeTopComponent”（其首选 `preferredID`）以及该 `TopComponent` 的模式。然后，我们获取系统当前所有模式的集合，并将集合转换为数组。接着，该方法搜索数组以找到当前模式，并使用下一个索引值将\
  \ `TopComponent` 分配给下一个模式。如果我们到达数组末尾，则循环回到数组开头。\n\n确定了当前模式和下一个模式后，下一步是将 `TopComponent`\
  \ 停靠到下一个模式中，打开它，并调用 `TopComponent` 方法 `requestActive()`。这是你通过程序打开窗口时通常会调用的方法序列。`open()`\
  \ 方法打开窗口（如果尚未打开），`requestActive()` 在窗口隐藏时将其置于顶层，或在窗口最小化时显示该窗口（适用于滑动模式）。\n\n由于我们调用了\
  \ `requestActive()`，窗口管理器会调用 `MyModeTopComponent` 方法 `componentActivated()`，该方法会更新该组件的标签以显示当前模式（请参见第\
  \ 379 页的 代码清单 8.12）。最后，我们使用 NetBeans Platform 标准 `StatusDisplayer` 实例在状态栏中显示旧新模式。\n\
  \n图 8.32 显示应用程序正在运行。在这里，`MyModeTopComponent` 停靠在输出模式。它的标签显示“output”，状态栏显示“Docking\
  \ from bottomSlidingSide into output。”![](img/image5052.jpg)图 8.32 窗口系统模式演示\n\n\
  ## 8.8 窗口组\n\n窗口组允许你指定一组打开和关闭的 `TopComponents`。如果你曾经使用 NetBeans IDE 设计过 GUI 组件（例如\
  \ `TopComponent`），你对这个用例就熟悉了。当 `TopComponent` 在设计视图（Design view）中打开时，你会看到相关的辅助窗口打开，包括组件调色板、`TopComponent`\
  \ 属性窗口和 `TopComponent` 导航窗口。一旦你切换到源码模式（Source mode），组件调色板和属性窗口就会消失，导航窗口的内容将变为关联\
  \ Java 源代码而非视觉组件。因此，你拥有了一个设计模式窗口组，它与 `TopComponent` 的设计模式同步打开和关闭。图 8.33 显示了 NetBeans\
  \ IDE 中 `PersonTopComponent.java` 的设计视图以及相关的调色板（Palette）和属性（Properties）窗口。切换到 `PersonTopComponent.java`\
  \ 的源码视图将关闭这些窗口。(OEBPS/image5058.jpg)图 8.33 调色板和属性窗口形成 TopComponent 组\n\n然而，窗口组的打开和关闭行为更为微妙。如果一个属于窗口组的\
  \ `TopComponent` 在组上一次打开时被用户特意关闭了，那么在组下一次打开时它不会再次打开。同样，如果窗口在组打开时已经是打开状态，那么属于该窗口组的\
  \ `TopComponent` 在组下一次关闭时也不会被关闭。\n\n为了进一步自定义窗口组 `TopComponent` 的行为，你可以指定在组打开或关闭时，专门排除某个特定的\
  \ `TopComponent` 的打开或关闭（或两者）。\n\n消息是，你可以轻松地在 NetBeans Platform 应用程序中使用此窗口组功能。一旦你创建了组成窗口组的\
  \ `TopComponents`，就可以在模块中指定 XML 配置，通用步骤如下所示：\n\n1. 创建窗口系统组定义文件（`.wsgrp`）来定义窗口组。\n\
  2. 为窗口组中的每个 `TopComponent` 创建 `Wstcgrp.xml` 文件。\n3. 将组配置信息添加到模块的 `layer.xml` 文件中。如果\
  \ `layer.xml` 文件不存在，使用“New | Layer File”向导创建它。\n4. 添加用于打开和关闭窗口组的 Java 代码。\n\n我们将在下一节展示一个示例。\n\
  \n### 窗口组示例\n\n让我们从上一节的应用程序 `WindowSystemApp` 开始（在第 381 页的 图 8.32 中运行）。该应用程序有一个非单例的\
  \ `PersonTopComponent`，它通过“Open Person Window”按钮打开。你可以通过窗口内置的关闭按钮或“Close Top Person\
  \ Window”按钮关闭窗口。\n\n当 `PersonTopComponent` 窗口变为可见时，会打开两个 `TopComponent` 辅助窗口，并在窗口隐藏或关闭时关闭它们。图\
  \ 8.34 显示应用程序正在运行，此时有两个 `PersonTopComponent` 窗口处于打开状态，而不相关的隐藏 `MyMode` 窗口则停靠在编辑器模式中。你会看到\
  \ `PersonProperty` 和 `PersonOutput` 窗口已打开。(OEBPS/image5074.jpg)图 8.34 PersonProperty\
  \ 和 PersonOutput 窗口组成组\n\n当可见的 `PersonTopComponent` 关闭或被隐藏时，`MyMode` 在编辑器模式变为可见，`PersonProperty`\
  \ 和 `PersonOutput` 窗口关闭。结果所示 图 8.35。(OEBPS/image5079.jpg)图 8.35 TopComponent 关闭时窗口组\n\
  \n以下是将窗口组添加到 WindowSystemApp 的步骤：\n\n1. 在模块 `PersonEditor` 中使用“New | Window”向导创建两个\
  \ `TopComponents`。为 `TopComponent` 和 `OutputComponent` 选择窗口位置（window position）。取消勾选“Open\
  \ on Application”。这会生成 `PersonTopComponent.java` 和 `OutputComponent.java`。\n2. 在相同的源码包中创建\
  \ `persongroup.wsgrp`。右键点击包并选择“New | Empty File”。在对话框中指定文件名为 `persongroup.wsgrp`。项目为\
  \ `PersonEditor`，文件夹为 `src/com/asgteach/personeditor`。\n3. 为 `persongroup.wsgrp`\
  \ 提供以下 XML，如 代码清单 8.14 所示。\n\n代码清单 8.14 persongroup 点击查看代码\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE group PUBLIC \"-//NetBeans//DTD Group Properties\
  \ 2.0//EN\" \"http://www.netbeans.org/dtds/group-properties2_0.dtd\">\n<group version=\"\
  2.0\">\n  <name unique=\"persongroup\" />\n  <state opened=\"false\" />\n</group>\n\
  ```\n\n属性 `unique` 必须与文件名大小敏感。属性 `opened=\"false\"` 指定应用程序启动时不打开。\n4. 为组中的每个窗口创建一个窗口系统\
  \ TopComponent 组配置文件。使用“New | Empty File”并指定文件名为 `PersonTopComponentWstcgrp.xml`（再次，名称大小敏感）。代码清单\
  \ 8.15 显示了该文件的 XML 配置。\n\n代码清单 8.15 PersonTopComponentWstcgrp 点击查看代码\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE tc-group PUBLIC \"-//NetBeans//DTD\
  \ Top Component in Group Properties 2.0//EN\" \"http://www.netbeans.org/dtds/tc-group2_0.dtd\"\
  >\n<tc-group version=\"2.0\">\n  <module name=\"com.asgteach.personeditor\" spec=\"\
  1.0\"/>\n  <tc-id id=\"PersonPropertyTopComponent\" />\n  <open-close-behavior open=\"\
  true\" close=\"true\" />\n</tc-group>\n```\n\n\n\n\n\n窗口系统 `TopComponent` 组配置文件指定了包含\
  \ `TopComponent` 的模块、`TopComponent` ID（其 `preferredID`）以及该 `TopComponent` 的打开和关闭默认行为（通常这两者都被设置为\
  \ true）。5. 重复此步骤，为 `PersonOutputTopComponent` 创建窗口系统 `TopComponent` 组配置文件，如列表 8.16\
  \ 所示。\n\n列表 8.16 `PersonOutputTopComponentWstcgrp.xml` 点击此处查看代码图像\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE tc-group PUBLIC \"-//NetBeans//DTD\
  \ Top Component in Group Properties 2.0//EN\" \"http://www.netbeans.org/dtds/tc-group2_0.dtd\"\
  >\n<tc-group version=\"2.0\">\n    <module name=\"com.asgteach.personeditor\" spec=\"\
  1.0\"/>\n    <tc-id id=\"PersonOutputTopComponent\" />\n    <open-close-behavior\
  \ open=\"true\" close=\"true\" />\n</tc-group>\n```\n\n注意，这些文件相同之处在于元素 `<tc-id>`，它与每个\
  \ `TopComponent` 的 `preferredID` 相匹配。6. 为此模块创建一个层文件（Layer File）。使用 `New | XML Layer\
  \ . . . .`（如果你的模块已经有了层文件，则编辑现有的 `layer.xml` 文件）。\n\n### XML 层文件\n通常你不需要模块层文件，因为\
  \ Java 注解可以帮助你指定许多配置选项。在构建过程中，NetBeans 会为你生成 `layer.xml` 文件。如果你在模块中定义了层文件（在此你将通过使用窗口组这样做），构建过程将在生成应用程序主\
  \ `layer.xml` 文件时，会将此配置信息与任何注解进行处理并合并。\n\n7. 在 `layer.xml` 中添加以下 XML 配置，如列表 8.17\
  \ 所示。\n\n列表 8.17 `layer.xml` 点击此处查看代码图像\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<!DOCTYPE filesystem PUBLIC \"-//NetBeans//DTD Filesystem 1.2//EN\" \"\
  http://www.netbeans.org/dtds/filesystem-1_2.dtd\">\n<filesystem>\n    <folder name=\"\
  Windows2\">\n        <folder name=\"Groups\">\n            <file name=\"persongroup.wsgrp\"\
  \ url=\"persongroup.wsgrp\"/>\n            <folder name=\"persongroup\">\n     \
  \           <file name=\"PersonOutputTopComponent.wstcgrp\" url=\"PersonOutputTopComponentWstcgrp.xml\"\
  />\n                <file name=\"PersonPropertyTopComponent.wstcgrp\" url=\"PersonPropertyTopComponentWstcgrp.xml\"\
  />\n            </folder>\n        </folder>\n    </folder>\n</filesystem>\n```\n\
  \n该层文件注册了 `persongroup` 窗口组并指定了 `TopComponent` 配置文件。如果你在上一步中创建了新的 `layer.xml` 文件，请复制[列表\
  \ 8.17]所示的全部 XML 代码。如果你的模块已经有一个包含 `Windows2` 文件夹的层文件，请将 `Groups` 文件夹添加到 `Windows2`\
  \ 文件夹中，保持其他子文件夹不变。\n\n8. 最后步骤是添加 Java 代码来打开和关闭 `persongroup` 窗口组。在我们之前的描述中，我们在 `PersonTopComponent`\
  \ 可见时打开窗口组，并在 `PersonTopComponent` 关闭或隐藏时关闭窗口组。因此，我们必须将打开窗口组的代码添加到 `PersonTopComponent`\
  \ 的生命周期方法 `componentShowing()` 中，如列表 8.18 所示。\n\n列表 8.18 `PersonTopComponent componentShowing()`\
  \ 方法 点击此处查看代码图像\n\n```java\n@Override\nprotected void componentShowing() {\n   \
  \ super.componentShowing();\n    TopComponentGroup personGroup = WindowManager.getDefault().findTopComponent(\"\
  persongroup\");\n    if (personGroup != null) {\n        personGroup.open();\n \
  \   }\n}\n```\n\n窗口管理器找到 `TopComponentGroup` `persongroup`，如果找到，则打开该组，从而打开 `PersonPropertyTopComponent`\
  \ 和 `PersonOutputTopComponent`。\n\n9. 现在是棘手的部分。由于不同的 `PersonTopComponent` 生命周期方法之间的执行顺序，简单地在\
  \ `componentHidden()` 中关闭组不会产生预期的行为。换句话说，如果打开窗口的方法 `componentShowing()` 在关闭窗口的方法\
  \ `componentHidden()` 之前调用，则组会被错误关闭。为了处理这种情况，我们使用窗口管理器 `TopComponent` 注册表来查找所有打开的组件。如果其中一个是可见的\
  \ `PersonTopComponent`（`isShowing()` 为 true），我们返回且不关闭窗口组。如果没有可见的 `PersonTopComponent`（即使有一个已打开），我们就可以安全地关闭窗口组。[列表\
  \ 8.19]显示了相关代码。\n\n```java\n@Override\nprotected void componentHidden() {\n    super.componentHidden();\n\
  \    WindowManager wm = WindowManager.getDefault();\n    TopComponentGroup personGroup\
  \ = wm.findTopComponent(\"persongroup\");\n    for (TopComponent tc : wm.getRegistry().getOpened())\
  \ {\n        if (tc.isShowing() && tc instanceof PersonTopComponent) {\n       \
  \     return;\n        }\n    }\n    if (personGroup != null) {\n        personGroup.close();\n\
  \    }\n}\n```\n\n列表 8.19 `PersonTopComponent componentHidden()` 方法 点击此处查看代码图像\n\
  \n\n\n\n\n### 测试窗口组行为\n\n你现在已准备好充分测试新的 persongroup 窗口组的行为。在运行应用程序之前，请务必执行“全部清理”（Clean\
  \ All）。在创建几个 `PersonTopComponent` 窗口后，使用“更改模式”（Change Mode）按钮将窗口 `MyMode` 移动到编辑器位置。尝试激活和隐藏几个窗口，观察根据\
  \ `PersonTopComponent` 是否可见，persongroup 窗口组如何正确地打开和关闭。\n\n你也可以将（拖放）一个 `PersonTopComponent`\
  \ 移动到另一个窗口位置。只要 `PersonTopComponent` 是可见的，persongroup 窗口组就会保持打开状态。\n\n当你关闭 persongroup\
  \ 窗口组中的其中一个窗口时，当窗口组下次打开时，该关闭的窗口将保持关闭状态。同样，如果你在组关闭时打开了 persongroup 窗口组中的某一个窗口（例如使用顶部菜单\
  \ Windows | PersonOutput），那么当窗口组下次关闭时，该打开的窗口将保持打开状态。\n\n## 8.9 窗口布局\n\n你对 NetBeans\
  \ Platform 应用程序有一个很棒的想法，但你不想使用任何标准的窗口系统模式（参见第 377 页的图 8.29）。相反，你想创建自己的自定义窗口布局，并可能指定一个或多个新的窗口位置（模式）。\n\
  \n在之前的 NetBeans Platform 中，创建一个新模式需要自定义模块的 Layer 文件。你还需要创建一个模式配置文件，这是一个扩展名为 `wsmode`\
  \ 的 XML 文件。此外，对于普通的 NetBeans Platform 开发者来说，确定 `wsmode`元素的设置（尤其是约束和路径元素）具有挑战性。尽管如此，\
  \ NetBeans 现在有了一个“窗口布局”（Layout of Windows）向导来帮助自定义窗口布局。在本节中，我们希望消除创建自定义窗口布局的某些神秘感和挑战。\n\
  \n让我们首先展示一下 NetBeans 窗口布局向导，我们将用它为新应用程序创建一个自定义布局。此窗口布局看起来将像图 8.36 所示的应用程序。在这里你看到三个窗口：`TopBanner`（位于模式\
  \ `topbanner`）、`LeftSide` 和 `RightSide`。\n\n![](img/image5146.jpg)\n图 8.36 应用程序\
  \ ModeApp 的自定义窗口布局\n\n`TopBanner` 窗口跨越整个窗口框架，占据垂直空间的 25% 左右。剩余区域水平划分为两个区域。`leftside`\
  \ 模式占用约 30%，`rightside` 占据剩余的 70%。\n\n`rightside` 模式类型为 `editor`，而 `topbanner` 和\
  \ `leftside` 模式类型为 `view`。你可以区分这些类型，因为 `editor` 类型的模式在顶部有一条较色的线，并在窗口区域的右上有额外的窗口控制按钮。此外，窗口系统处理编辑器区域的方式与处理\
  \ view 类型模式不同。即使你的应用程序中没有打开任何窗口，仍留有一个较小的编辑器区域，当你调整应用程序大小时，它会增大。根据你自己的窗口布局，你可能需要隐藏空的编辑器区域。我们将在本节稍后部分展示如何操作。\n\
  \n以下是步骤。为了跟随操作，请创建一个名为 `ModeApp` 的新 NetBeans Platform 应用程序并创建一个名为 `Modes1` 的新模块。我们将使用模块\
  \ `Modes1` 创建自定义布局。第一步是运行窗口布局向导，如下：\n\n1. 展开项目 `Modes1` 并选择包名 `com.asgteach.modes1`，右键点击并选择\
  \ New | Other。\n2. NetBeans 显示新文件（New File）对话框。在类别（Categories）中选择 `Module Development`，在文件类型（File\
  \ Types）中选择 `Layout of Windows`。如图 8.37 所示点击 Next。\n![](img/image5155.jpg)\n图 8.37\
  \ 窗口布局向导\n3. 窗口布局向导会告知你它将在特殊模式下启动你的应用程序，以便你调整窗口布局。如图 8.38 所示点击 Next。\n![](img/image5160.jpg)\n\
  图 8.38 窗口布局向导——启动你的应用程序\n4. 你的应用程序启动并显示具有定义的默认模式的窗口布局。\n5. 点击新模式图标（应用程序标题下方的左上角）。编辑器位置将创建一个表示模式的新窗口。\n\
  6. 将此窗口移动到应用程序的顶部。调整窗口，直到红色引导线显示出一个横跨整个应用程序框架的水平窗口。在提供的文本框中指定新模式名称为 `topbanner`。\n\
  7. 删除编辑器模式外的所有剩余非最小化模式。\n8. 现在创建一个新模式，并将其放置在编辑器模式的左侧。NetBeans 将区域一分为两半。将左侧此新模式重命名为\
  \ `leftside`。\n9. 将编辑器模式重命名为 `rightside`。调整 `leftside` 和 `rightside` 的大小，使其相对比例约为\
  \ 30-70%。图 8.39 显示了具有 `topbanner`、`leftside` 和 `rightside` 模式的新窗口布局。\n![](img/image517.jpg)\n\
