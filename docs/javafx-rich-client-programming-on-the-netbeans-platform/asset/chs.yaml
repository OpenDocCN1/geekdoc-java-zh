  \            MoveUpAction.get(MoveUpAction.class),\n            MoveDownAction.get(MoveDownAction.class)\n\
  \        };\n    }\n}\n```\n\n\n\n\n\n# 实现拖放功能\n\n拖放与剪切、复制和粘贴密切相关，并共享一些支持代码。我们将首先查看拖放，因为这些操作不需要菜单项。拖放手势执行了等同于剪切和粘贴的操作，但不需要使用菜单项。你可以选择单个或多个\
  \ `PersonNodes`。投放的目标是一个 `GroupNode`，它的职责是接收被投放的对象（或多个对象）。图 9.25 显示了三个 `PersonNodes`\
  \ 被拖动到 `GroupNode` Sad 中，目标位置由灰色矩形轮廓指示。当用户释放鼠标时，节点会被放置到新位置并从原始位置移除。![](img/image5942.jpg)图\
  \ 9.25 将一个或多个 `PersonNodes` 拖放到 `GroupNode`\n\n拖放需要构建一个包含所传输数据的 `Transferable` 对象，以及与该\
  \ `Transferable` 相关的元数据（例如传输是剪切还是复制）。`Transferable` 数据必须是可序列化的。Swing/AWT 提供了 Transferable\
  \ 支持（许多 Swing 组件都支持拖放）。NetBeans 平台提供了一个扩展的 `Transferable` 对象，称为 `ExTransferable`，它可以与节点配合。\n\
  \n通过在 `Transferable` 上设置 `DataFlavor` 来维护数据完整性。`DataFlavor` 封装了关于传输数据的元数据。这允许投放目标接受支持的\
  \ `DataFlavor`（拒绝不支持的类型）并正确提取数据。Swing 支持标准的 `DataFlavors`，例如图像（`imageFlavor`）、字符串（`stringFlavor`）和\
  \ `java.io.File` 对象列表（`javaFileList`）。在本例中为 `Person` 对象创建一个新的 `DataFlavor`。\n\n\
  以下是在 `Group` 窗口中实现拖放的步骤。请注意，你不需要在节点的 `getActions()` 方法中配置任何用于拖放的操作。\n\n1.  为 `Person`\
  \ 创建一个新的 `DataFlavor`（`PersonFlavor`），如列表 9.22 所示。将此类添加到 `FamilyTreeModel` 模块的 `public`\
  \ 包中，以便我们可以从多个模块访问它（我们在稍后的示例中访问了它——参见第 458 页的“窗口间拖拖放”）。\n\n列表 9.22 `PersonFlavor.java`点击此处查看代码图像\n\
  \n```java\npublic class PersonFlavor extends DataFlavor {\n    public static final\
  \ DataFlavor PERSON_FLAVOR = new PersonFlavor();\n    public PersonFlavor() {\n\
  \        super(Person.class, \"Person\");\n    }\n}\n```\n\n2.  在 `PersonNode` 中重写\
  \ `clipboardCut()` 方法，该方法构建一个带有 `PersonFlavor` 的 `ExTransferable` 并将其添加到应用程序剪贴板。在\
  \ `ExTransferable` 对象中放入 `ExTransferable.Single` 并重写 `getData()` 方法以返回此节点中的 `Person`\
  \ 对象。你还必须重写节点的 `canDestroy()`、`canCut()` 和 `destroy()` 方法，因为这些方法在拖放手势期间会被调用。列表 9.23\
  \ 显示了这些方法。注意，`destroy()` 方法会从底层模型中移除封装的 `Person` 对象（见列表 9.15 位于第 446 页中的 `PersonModel`），然后触发由\
  \ `PersonChildFactory` 处理的状态更改事件（见列表 9.18 位于第 449 页）。\n\n列表 9.23 `PersonNode—实现拖放功能`点击此处查看代码图像\n\
  \n```java\npublic class PersonNode extends AbstractNode {\n    . ...\n    @Override\n\
  \    public Transferable clipboardCut() throws IOException {\n        ExTransferable\
  \ extrans = ExTransferable.create(super.clipboardCut());\n        extrans.put(new\
  \ ExTransferable.Single(PersonFlavor.PERSON_FLAVOR) {\n            @Override\n \
  \           protected Person getData() {\n                return getLookup().lookup(Person.class);\n\
  \            }\n        });\n        return extrans;\n    }\n    @Override\n   \
  \ public boolean canCut() {\n        return true; // 可以剪切此项\n    }\n    @Override\n\
  \    public boolean canDestroy() {\n        return true; // 可以销毁此项\n    }\n    @Override\n\
  \    public void destroy() throws IOException {\n        personModel.remove(getLookup());\n\
  \    }\n```\n\n3.  在 `GroupNode` 中，重写 `getDropType()` 方法，如列表 9.23 所示（注：此处原文引用可能可能有误，根据上下文应为上文逻辑）。该方法接收来自剪切、复制或拖动的\
  \ `Transferable`，如果是支持的类型，则创建一个 `PasteType`。`Person` 对象从 `Transferable` 中被提取并添加到\
  \ `personmodel` 中。如果传输是剪切或拖放，原始节点将被销毁。`personModel` 触发一个由 `PersonChildFactory` 处理的状态，随后\
  \ `refresh()` 构建新的 `Person` 。\n\n。\n\n列表 9.24 `GroupNode—实现拖放功能`点击此处查看代码图像\n\n```java\n\
  public class GroupNode extends AbstractNode {\n    . ...\n    // 为了支持拖放目标，以及粘贴/复制操作\n\
  \    @Override\n    public PasteType getDropType(Transferable t, int index) {\n\
  \        if (t.isDataSupported(PersonFlavor.PERSON_FLAVOR)) {\n            return\
  \ new PasteType() {\n                @Override\n                public Transferable\
  \ paste() throws IOException {\n                    try {\n                    \
  \    personModel.add((Person) t.getTransferData(PersonFlavor.PERSON_FLAVOR));\n\
  \                        final Node node = NodeTransfer.node(t, NodeTransfer.DND_MOVE\
  \ + NodeTransfer.CLIPBOARD_CUT);\n                        // 仅在移动或剪切时销毁原始节点\n  \
  \                      if (node != null) {\n                            node.destroy();\n\
  \                        }\n                    } catch (UnsupportedFlavorException\
  \ ex) {\n                        logger.log(Level.WARNING, null, ex);\n        \
  \            }\n                    return null;\n                }\n          \
  \  };\n        }\n        return null;\n    }\n}\n```\n\n# 实现剪切、复制、删除\n\n`PersonNode`\
  \ 支持剪切、复制和删除项（参见图 9.24 位于第 446 页）。此外，图 9.26 显示了顶部编辑菜单。`PersonNode` 支持剪切、复制和删除菜单，`GroupNode`\
  \ 支持粘贴（在对 `PersonNode` 执行剪切或复制操作后）。图 9.23 位于第 445 页显示了 `GroupNode` 的粘贴右键菜单。）\n\n\
  图 9.26 编辑菜单操作：剪切、复制、粘贴及条件启用\n\n按照以下步骤实现这些编辑操作。\n\n1.  将复制、剪切、粘贴和删除操作放入 `TopComponent`\
  \ 的 `ActionMap` 中，如列表 9.25 所示。这将在编辑菜单中启用这些操作（如果选中的节点支持这些操作）。\n\n列表 9.25 `GroupTopComponent—实现编辑菜单操作`点击此处查看代码图像\n\
  \n```java\npublic final class GroupTopComponent extends TopComponent\n    implements\
  \ ExplorerManager.Provider {\n    private final ExplorerManager em = new ExplorerManager();\n\
  \n    public GroupTopComponent() {\n        initComponents();\n        setName(Bundle.CTL_GroupTopComponent());\n\
  \    }\n}\n```\n\n\n\n\n```java\nsetToolTipText(Bundle.HINT_GroupTopComponent());\n\
  \n. . .\n\nActionMap map = getActionMap();\nmap.put(DefaultEditorKit.copyAction,\
  \ ExplorerUtils.actionCopy(em));\nmap.put(DefaultEditorKit.cutAction, ExplorerUtils.actionCut(em));\n\
  map.put(DefaultEditorKit.pasteAction, ExplorerUtils.actionPaste(em));\nmap.put(\"\
  delete\", ExplorerUtils.actionDelete(em, true));\nassociateLookup(ExplorerUtils.createLookup(em,\
  \ map));\n}\n\n. . .\n}\n```\n\n### 2. PersonNode 实现\n\n在 `PersonNode` 中，在 `getActions()`\
