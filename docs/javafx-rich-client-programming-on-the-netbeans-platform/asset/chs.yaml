  personColumn\" />\n    </columns>\n</TableView>\n```\n\n### Listing 4.36 `ProcessAllTask`\n\
  \n[Listing 4.36] 显示了此示例的 `ProcessAllTask`。这次我们扩展了使用泛型 `ObservableList<Person>` 定义的\
  \ `Task`。此外，我们使用 `ReadOnlyObjectWrapper` 创建了一个只读的 JavaFX 属性，并提供了两个公共方法来访问该属性：`getPartialResults()`\
  \ 和 `partialResultsProperty()`。你会发现 `ProcessAllTask` 在 JavaFX 线程上维护此只读属性，使得更新 UI\
  \ 线程的代码对其访问是安全的。方法 `call()` 在后台线程上被调用。它处理构造函数传递的 `Person` 对象列表。当它向观察列表添加 `Person`\
  \ 对象时，它会调用 `Platform.runLater()`。\n\n```java\nprivate class ProcessAllTask extends\
  \ Task<ObservableList<Person>> {\n    private final ObservableList<Person> processList;\n\
  \    private final ReadOnlyObjectWrapper<ObservableList<Person>> partialResults\
  \ =\n            new ReadOnlyObjectWrapper<>(this, \"partialResults\",\n       \
  \             FXCollections.observableArrayList(new ArrayList<>()));\n\n    public\
  \ final ObservableList getPartialResults() {\n        return partialResults.get();\n\
  \    }\n\n    public final ReadOnlyObjectProperty<ObservableList<Person>> partialResultsProperty()\
  \ {\n        return partialResults.getReadOnlyProperty();\n    }\n\n    public ProcessAllTask(final\
  \ ObservableList<Person> processList) {\n        this.processList = processList;\n\
  \    }\n\n    @Override\n    protected ObservableList<Person> call() throws Exception\
  \ {\n        logger.log(Level.FINE, \"Begin processing\");\n        final int taskCount\
  \ = processList.size();\n        logger.log(Level.FINE, \"processing list: {0}\"\
  , processList);\n        int taskProgress = 0;\n        for (final Person person\
  \ : processList) {\n            if (isCancelled()) {\n                break;\n \
  \           }\n            // 对 person 进行处理\n            logger.log(Level.FINE,\
  \ \"processing: {0}\", person);\n            doProcess(person);\n            //\
  \ 在 FX 线程上更新属性\n            Platform.runLater(() -> {\n                partialResults.get().add(person);\n\
  \            });\n            updateProgress(100 * (++taskProgress) / taskCount,\
  \ 100);\n            Thread.sleep(500);\n        }\n        return partialResults.get();\n\
  \    }\n\n    // 在后台线程上调用\n    private void doProcess(Person p) {\n        p.setFirstname(p.getFirstname().toUpperCase());\n\
  \        p.setMiddlename(p.getMiddlename().toUpperCase());\n    }\n}\n```\n\n\n\n\
