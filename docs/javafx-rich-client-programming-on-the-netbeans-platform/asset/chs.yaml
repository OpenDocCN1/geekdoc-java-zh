  \ Collections)\n\n到目前为止的示例仅处理可观察变量。JavaFX 还拥有可观察集合，允许你在添加、删除或更新集合时观察到变化。你通过向这些集合附载更改监听器（change\
  \ listeners）或失效监听器（invalidation listeners）来响应变化。\n\n值得注意的是，集合通过使用项的 `equals()` 方法来发送更改事件。如果你用另一个项目替换当前项目，如果这两个项目相等，则不会触发更改事件。因此，我们需要确保一个修改过的\
  \ `Person` 对象（可能仅更新了 `notes` 属性或 `middlename` 属性）能够生成更改事件。（这就是为什么 `Person` 类的 `equals()`\
  \ 方法会验证所有 `Person` 属性是否相等，见第 138 页的列表 4.7）。\n\n列表 4.12 显示了用 JavaFX 集合实现的 `FamilyTreeManager`\
  \ 类。我们使用静态方法 `observableHashMap()` 创建了一个可观察映射。`FXCollections` 提供了静态方法，可以返回与 `java.util.Collections`\
  \ 相同集合类型的可观察版本。\n\n`FamilyTreeManager` 将方法 `addPerson()`、`updatePerson()` 和 `deletePerson()`\
  \ 转发给底层的可观察映射。方法 `getAllPeople()` 使用函数式操作返回一个包含来自可观察映射的 `Person` 项副本的 `ArrayList`（更多信息请参阅第\
  \ 39 页的“函数式数据结构”）。为了尽可能封装 `FamilyTreeManager` 的实现，我们提供了 `addListener()` 和 `removeListener()`\
  \ 方法，并将它们转发给底层的可观察映射。列表 4.12 FamilyTreeManager—使用 ObservableMap。\n\n* *\n\n```java\n\
  package com.asgteach.familytree.model;\n\nimport javafx.collections.FXCollections;\n\
  import javafx.collections.ObservableMap;\n\npublic class FamilyTreeManager {\n\n\
  \    private final ObservableMap<Long, Person> observableMap =\n               \
  \             FXCollections.observableHashMap();\n\n    private static FamilyTreeManager\
  \ instance = null;\n\nprotected FamilyTreeManager() {\n        // 单例类：防止直接实例化\n\
  \    } public static FamilyTreeManager getInstance() {\n        if (instance ==\
  \ null) {\n            instance = new FamilyTreeManager();\n        }\n        return\
  \ instance;\n    }    public void addListener(\n                MapChangeListener<?\
  \ super Long, ? super Person> ml) {\n        observableMap.addListener(ml);\n  \
  \  }\n\n    public void removeListener(\n                MapChangeListener<? super\
  \ Long, ? super Person> ml) {\n        observableMap.removeListener(ml);\n    }\n\
  \n    public void addListener(InvalidationListener il) {\n        observableMap.addListener(il);\n\
  \    }\n\n    public void removeListener(InvalidationListener il) {\n        observableMap.removeListener(il);\n\
  \    }\n\n    public void addPerson(Person p) {\n        Person person = new Person(p);\n\
  \        observableMap.put(person.getId(), person);\n    }\n\n    public void updatePerson(Person\
  \ p) {\n        Person person = new Person(p);\n        observableMap.put(person.getId(),\
  \ person);\n    }\n\n    public void deletePerson(Person p) {\n        observableMap.remove(p.getId());\n\
  \    }\n\n    public List<Person> getAllPeople() {\n        List<Person> copyList\
  \ = new ArrayList<>();\n        observableMap.values().stream().forEach((p) ->\n\
  \            copyList.add(new Person(p)));\n        return copyList;\n    }\n}\n\
  ```\n\n* *\n\n让我们向你展示如何在程序 `PersonFXCoarse` 中使用 `FamilyTreeManager`。由于此程序没有创建 JavaFX\
  \ 场景图，我们按照以下步骤创建一个标准的 Java ：\n\n1. 从 NetBeans 顶部菜单选择 `File | New Project`。在 Categories\
  \ 下选择 `Java`，在 Projects 下选择 `Java Application`。\n2. NetBeans 显示 Name and Location\
  \ 对话框。为 Project Name 指定 `PersonFXCoarse`，并接受其余字段的默认值，如图 4.6 所示。完成。\n\n图 4.6 New\
  \ Java Application，Name and Location 对话框\n3. 创建包 `com.asgteach.familytree.model`\
  \ 并添加文件 `Person.java`（见第 142 页的列表 4.8）和 `FamilyTreeManager.java`（见第 149 页的列表 4.12）。\n\
  \n主程序类 `PersonFXCoarse.java` 显示在列表 4.13 中。该程序通过 `FamilyTreeManager` 操作 `Person`\
  \ 对象。\n\n在获取单例 `FamilyTreeManager` 对象后，我们附载了监听器 `mapChangeListener`。程序随后创建了 `Person`\
  \ 对象并通过 `addPerson()` 将它们添加到 `FamilyTreeManager`。因为我们附载了更改监听器，`addPerson()` 会生成更改事件。为了测试可观察映射的行为，程序再次调用\
  \ `addPerson()` 添加 `marge`，此时不会触发更改事件。\n\n接下来，程序修改两个 `Person` 对象并调用 `updatePerson()`\
  \ 方法。我们再次观察到了更改事件。最后，两次 `deletePerson()` 移除 `marge`。第一次删除生成更改事件，第二次删除则没有。列表 4.13\
  \ PersonFXCoarse—ObservableMap 的行为。\n\n* *\n\n\n\n\n\n[Listing 4.14] 显示了该程序的 `MapChangeListener`。更改事件（类型为\
  \ `MapChangeListener.Change<Long, Person>`）包含了布尔方法 `wasAdded()` 和 `wasRemoved()`。当\
  \ map 更新时，这两个方法都会返回 `true`。你可以通过 `getValueAdded()` 访问新值，通过 `getValueRemoved()` 访问被删除或替换的值。当添加对象时，方法\
  \ `getValueRemoved()` 返回 `null`；当删除对象时，方法 `getValueAdded()` 返回 `null`。方法 `getMap()`\
  \ 返回更新后的 map。\n\n**Listing 4.14 用于 FamilyTreeManager 的 MapChangeListener**\n\n```java\n\
  // MapChangeListener<Long, Person> for FamilyTreeManager\nprivate static final MapChangeListener<Long,\
  \ Person> mapChangeListener =\n    (change) -> {\n      if (change.wasAdded() &&\
  \ change.wasRemoved()) {\n        System.out.println(\"\\tUPDATED\");\n      } else\
  \ if (change.wasAdded()) {\n        System.out.println(\"\\tADDED\");\n      } else\
  \ if (change.wasRemoved()) {\n        System.out.println(\"\\tREMOVED\");\n    \
  \  }\n      System.out.println(\"\\tmap = \" + change.getMap());\n      System.out.println(\"\
  \\t\\t\" + change.getValueAdded()\n          + \" was added [\" + change.getKey()\
  \ + \"].\");\n      System.out.println(\"\\t\\t\" + change.getValueRemoved()\n \
  \         + \" was removed [\" + change.getKey() + \"].\");\n    };\n```\n\n[Listing\
  \ 4.15] 显示了运行程序 `PersonFXAppCoarse` 后控制台输出。通过跟踪更改，你可以看到 `Person homer` 被添加、`Person\
  \ marge` 被添加、`Person homer` 被更新、`Person marge` 被更新，最后 `Person marge` 被删除。注意，对 `Person\
  \ marge` 的第二次添加以及 `Person marge` 的第二次删除并没有被观察到。\n\n**Listing 4.15 程序 PersonFXAppCoarse\
  \ 输出**\n\n```text\nADDED\nmap = {0=Homer Simpson}\n  Homer Simpson was added [0].\n\
