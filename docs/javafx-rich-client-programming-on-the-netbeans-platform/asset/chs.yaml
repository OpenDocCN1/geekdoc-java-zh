  \n\n\n\n\nListing 14.24 显示了 JavaFX 控制器类 `FtrVisualFXController.java` 的部分。注解 `@FXML`\
  \ 标识了来自 FXML 文件的字段 `mypane`。控制器将使用 `mypane` 将节点添加到 JavaFX 场景图中的。控制器还通过 `SwingPropertyChangeSupport`\
  \ 添加了属性更改支持，以便让属性更改事件在 EDT（事件派发线程）上触发。`public static Strings` 定义了用于属性更改支持的监控属性名称。事件处理器\
  \ `nodeOnMousePressedHandler` 和 `nodeOnMouseDraggedHandler` 实现了节点拖拽（移动操作），并使用 `orgSceneX`、`orgSceneY`、`orgTranslateX`\
  \ 和 `orgTranslateY` 字段来维护节点拖拽。\n\n###  14.24 FtrVisualFXController—字段与鼠标拖拽\n\n```java\n\
  public class FtrVisualFXController implements Initializable {\n\n    @FXML\n   \
  \ private FlowPane mypane;\n\n    private SwingPropertyChangeSupport propChangeSupport\
  \ = null;\n    private final SequentialTransition seqTran = new SequentialTransition();\n\
  \    public static final String PROP_DOCUMENT_UPDATED = \"DocumentUpdated\";\n \
  \   public static final String PROP_DOCELEMENT_REMOVED = \"DocElementRemoved\";\n\
  \    private double orgSceneX;\n    private double orgSceneY;\n    private double\
  \ orgTranslateX;\n    private double orgTranslateY;\n    private static final Logger\
  \ logger = Logger.getLogger(FtrVisualFXController.class.getName());\n\n    @Override\n\
  \    public void initialize(URL url, ResourceBundle rb) {\n        propChangeSupport\
  \ = new SwingPropertyChangeSupport(this, true);\n        mypane.getStyleClass().add(\"\
  ftr-pane\");\n    }\n\n    EventHandler<MouseEvent> nodeOnMousePressedEventHandler\
  \ = ((event) -> {\n        if (event.getButton().equals(MouseButton.PRIMARY)) {\n\
  \            orgSceneX = event.getSceneX();\n            orgSceneY = event.getSceneY();\n\
  \            orgTranslateX = ((Node) (event.getSource())).getTranslateX();\n   \
  \         orgTranslateY = ((Node) (event.getSource())).getTranslateY();\n      \
  \  }\n    });\n\n    EventHandler<MouseEvent> nodeOnMouseDraggedEventHandler = ((event)\
  \ -> {\n        if (event.getButton().equals(MouseButton.PRIMARY)) {\n         \
  \   double offsetX = event.getSceneX() - orgSceneX;\n            double offsetY\
  \ = event.getSceneY() - orgSceneY;\n            double newTranslateX = orgTranslateX\
  \ + offsetX;\n            double newTranslateY = orgTranslateY + offsetY;\n    \
  \        ((Node) (event.getSource())).setTranslateX(newTranslateX);\n          \
  \  ((Node) (event.getSource())).setTranslateY(newTranslateY);\n        }\n    });\n\
  \    // ...\n}\n```\n\n现在让我们来看看 `MultiView` 元素类调调用的公共方法。Listing 14.25 显示了 `doFadeIn()`\
  \ 方法（播放顺序的 `FadeTransitions`）、`refresh()` 方法和 `clear()` 方法。`refresh()` 方法接收一个 `String`\
  \ 参数，并为 `String` 中的每个非空行构建一个多节点元素。该多节点元素包含一个包含 `Rectangle` 和 `Text` 元素的 `StackPane`\
  \ 布局控件。还有一个隐藏的 `TextField` 控件，当用户双击 `StackPane` 时，它会变得可见。这提供了就地编辑器。`TextField` 事件处理器会调用\
  \ `updateDocument()` 方法，该方法处理用户编辑并触发属性事件。\n\n让我们指出几个 JavaFX 编码要点：\n- `seqTran` 是一个\
  \ `SequentialTransition`。它每次配合每个 `StackPane FadeTransition` 都会被清除并重建，透明度从 0 渐入到\
  \ 1。\n- `MultiView` 元素类在 `component()` 方法中调用 `clear()`，该方法会清除 `FlowPane` 布局控件。这确保了\
  \ JavaFX 内容在用户切换到 VisualFX 视图时不会闪烁，而是平滑地淡入。\n- `Rectangle` 的宽度由 `Text` 控件的边界决定，因此每个\
  \ `Rectangle` 的宽度仅为足以适应 `Text` 节点。\n- 隐藏 `TextField` 的宽度绑定到 `Rectangle` 的宽度。这使得\
  \ `TextField` 在变得可见时能够恰好覆盖在 `Rectangle` 之上。\n- 当用户使用 `Return` 键完成编辑时，会调用 `TextField`\
  \ 事件处理器。该处理器替换 `Text` 元素中的新文本，使 `TextField` 再次隐藏，调整 `Rectangle` 的宽度，并调用 `updateDocument()`\
  \ 方法。\n- `updateDocument()` 方法处理 JavaFX 节点层次结构，并将新文本插入到底层 `String` 的相应位置。`fireProperty()`\
  \ 方法让编辑后的 `String` 对监听的 `MultiView` 类可用。\n\n### 14.25 FtrVisualFXController—从字符串构建内容\n\
  \n```java\npublic class FtrVisualFXController implements Initializable {\n    //\
