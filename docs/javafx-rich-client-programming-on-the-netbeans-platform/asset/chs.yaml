  \ 方法使用全局查找（Global Lookup）访问 `CustomerStore` 的服务提供者。如果客户不存在，`CustomerStore` 方法 `findCustomer()`\
  \ 将返回 `null`。`setIsNewCustomer()` 方法向 `PizzaWizardIterator` 触发属性更改事件，该迭代器通过调整面板的\
  \ `ArrayList` 响应。\n\n**列表 12.27 IdentifyCustomerController.java—新客户？** 点击此处查看代码图片\n\
