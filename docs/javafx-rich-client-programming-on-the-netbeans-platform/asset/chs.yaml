  [Listing 9.35] 显示了至关重要的 `getDropType()` 方法。该方法返回一个 `PasteType` 并重写 `paste()` 方法，该方法执行了多个步骤。首先，`paste()`\
  \ 方法提取传输的节点并禁止来自同一层级结构内的拖动手势。接下来，该方法提取 `Person` 对象，创建一个 `RemovePersonNode`，将 `TrashNode`\
  \ 作为 `NodeListener` 添加，并将新节点添加到 `TrashNode` 的层级结构中。最后，该方法调用 `enableEmptyAction()`\
  \ 方法（参见 [Listing 9.34]）并从原始层级结构中删除传输的节点。\n\n`TrashNode` 实现了 `NodeListener`，这需要重写五个方法。我们只对破坏节点的事件感兴趣，这些由\
  \ `nodeDestroyed()` 方法处理。该方法移除作为监听器的 `TrashNode`，并且如果子节点计数现在为零，则禁用 `EmptyTrashAction`。\n\
  \n### Listing 9.35 TrashNode.java—处理拖入\n\n```java\npublic class TrashNode extends\
  \ AbstractNode implements NodeListener {\n\n    . . .\n\n    @Override\n    public\
  \ PasteType getDropType(Transferable t, int action, int index) {\n        if (t.isDataFlavorSupported(PersonFlavor.PERSON_FLAVOR))\
  \ {\n            return new PasteType() {\n                @Override\n         \
  \       public Transferable paste() throws IOException {\n                    final\
  \ Node node = NodeTransfer.node(\n                        t, NodeTransfer.DND_MOVE\
  \ + NodeTransfer.CLIPBOARD_CUT);\n                    if (node != null && !TrashNode.this.equals(\n\
  \                                    node.getParentNode())) {\n                \
  \        try {\n                            final Person person = ((Person) t.getTransferData(\n\
  \                                    PersonFlavor.PERSON_FLAVOR));\n           \
  \                 Node newNode = new RemovePersonNode(person);\n               \
  \             newNode.addNodeListener(TrashNode.this);\n                       \
  \     getChildren().add(new Node[]{newNode});\n                            // we\
  \ have at least one RemovePersonNode\n                            enableEmptyAction();\n\
  \                            if ((action & DnDConstants.ACTION_MOVE) != 0) {\n \
  \                               node.destroy();\n                            }\n\
  \                        } catch (UnsupportedException ex) {\n                 \
  \           logger.log(Level.WARNING, ex);\n                        }\n        \
  \            }\n                    return null;\n                }\n          \
  \  };\n        }\n        return null;\n    }\n\n    @Override\n    public void\
  \ childrenAdded(NodeEvent nme) {}\n    @Override\n    public void childrenRemoved(NodeEvent\
  \ nme) {}\n    @Override\n    public void childrenReordered(NodeReorderEvent nre)\
  \ {}\n    @Override\n    public void nodeDestroyed(NodeEvent ne) {\n        ne.getNode().removeNodeListener(this);\n\
  \        if (getChildren().getNodesCount() == 0) {\n            clearEmptyAction();\n\
  \        }\n    }\n    @Override\n    public void propertyChange(PropertyChangeEvent\
  \ evt) {}\n}\n```\n\n## 为子节点添加拖动支持\n\n为了向 Group 窗口提供拖动支持，请重写 `RemovePersonNode`\
  \ 中的 `canCut()`、`canDestroy()`、`destroy()` 和 `clipboardCut()` 方法，如 [Listing 9.36]\
  \ 所示。`clipboardCut()` 方法与我们在 `PersonNode` 中使用的相同（参见第 454 页的 [Listing 9.23]）。`destroy()`\
  \ 方法会触发节点被破坏事件，`TrashNode` 会监听该事件。\n\n### Listing 9.36 RemovePersonNode.java—处理拖动\n\
  \n```java\npublic class RemovePersonNode extends AbstractNode {\n\n    . . .\n\n\
  \    @Override\n    public boolean canCut() {\n        return true;\n    }\n\n \
  \   @Override\n    public boolean canDestroy() {\n        return true;\n    }\n\n\
  \    @Override\n    public void destroy() throws IOException {\n        getParentNode().getChildren().remove(new\
  \ Node[] { this } );\n        fireNodeDestroyed();\n    }\n\n    @Override\n   \
  \ public Transferable clipboardCut() throws IOException {\n        ExTransferable\
  \ extrans = ExTransferable.create(super.clipboardCut());\n        extrans.put(new\
  \ ExTransferable.Single(PersonFlavor.PERSON_FLAVOR) {\n            @Override\n \
  \           protected Person getData() {\n                return getLookup().lookup(Person.class);\n\
  \            }\n        });\n        return extrans;\n    }\n}\n```\n\n\n\n\n\n\
  # 9.5 关键点总结\n\n本章将向你展示如何接入 NetBeans Platform 动作（Action）框架。你将学习如何创建始终启用的动作，以及取决于应用程序状态的动作。我们引入了“能力”（capabilities）的概念，以及如何通过动态地添加和移除它们来创建松耦合的行为。最后，我们将向你展示如何使用标准的\
  \ NetBeans Platform 编辑动作，在资源管理器视图（Explorer View）中使用剪切、复制、粘贴、上移、下移、删除以及拖放操作来处理节点。\n\
  \n以下是本章的关键点：\n\n* NetBeans Platform 的 `New Action` 向导允许你通过注解注册动作。\n* 这些注解配置了顶层菜单（`Menu`）和工具栏（Toolbar`），还配置了动作的显示名称、图标、快捷键序列和动作类。\n\
  * 在应用程序的任何状态下都可以被选中的动作是始终启用动作（always-enabled action）。这些动作不依赖于用户选择的对象，也不依赖于对象、数据或文件的可用性。\n\
  * NetBeans Platform 动作实现了 `ActionListener` 并重写了 `actionPerformed()` 方法。\n* `TopComponent`\
  \ 的 `ActionMap` 将键与已注册的回调动作关联起来。\n* 回调动作根据哪个组件拥有焦点来执行不同的功能。具有回退实现（fallback implementation）的回调动作始终启用的。如果聚焦的\
  \ `TopComponent` 没有在自己的 `ActionMap` 中提供自己的实现，则会调用回退实现。\n* 没有回退实现的回调动作仅在拥有焦点的 `TopComponent`\
  \ 在其 `ActionMap` 中具有实现时才会被启用。\n* 当特定上下文（`Cookie` 类）通过全局选择查找（Global Selection Lookup）可用时，上下文感知动作（Context-aware\
  \ actions）会被启用。\n* 在 `New Action` 向导中指定 `Conditionally Enabled`（条件启用）以创建上下文感知动作。\n\
  * 能力（capability）是动作上下文的实现，可以从对象的 `Lookup` 中动态地添加和移除。能力促进了松耦合，因为无关的实体可以查找能力并调用它，而无需了解其实现细节。\n\
  * NetBeans Platform 使用能力模式来实现 `Save`（保存）和 `Save All`（全部保存）动作。\n* 你可以为单个或多个节点选择配置上下文感知动作。\n\
  * 动作类别（Action categories）允许你对动作进行分类并将其包含在节点的右菜单中。\n* 要将动作添加到节点的右菜单，需要重写 `getActions()`\
  \ 方法并包含动作路径。\n* 要为节点启用上下文感知动作，需要在节点的 `Lookup` 中包含该动作上下文的实现。\n* 重写 `getPreferredAction()`\
  \ 方法来设置节点的首选动作。该动作会在双击节点时被触发。\n* 通过在节点的 `Lookup` 中添加 `Index.Support` 的实现来实现节点重排序。通常情况下，你提供一个模型来维护子节点的顺序。在节点的\
  \ `getActions()` 方法中包含 `ReorderAction`。\n* 当父节点支持重排序时，在子节点的右菜单中包含 `MoveUpAction`\
  \ 和 `MoveDownAction`。\n* 通过配置具有支持的 `DataFlavor` 的 `ExTransferable` 对象来实现拖放。在目标节点中重写\
  \ `getDropType()` 方法，并在可拖动对象中重写 `clipboardCut()`、`canCut()`、`canDestroy()` 和 `destroy()`\
  \ 方法。\n* 在源节点中使用 `clipboardCut()` 和 `clipboardCopy()` 实现 `Cut`（剪切）、`Copy`（复制）和 `Paste`（粘贴），并在目标节点中创建\
  \ `createPasteTypes()` 和 `getDropType()`。\n* 拖放动作（以及剪切/复制和粘贴）可以在窗口之间生效，因为 `ExTransferable`\
  \ 对象包含了接收节点接受或拒绝传输对象所需的所有信息。\n\n# 10. 构建 CRUD \n\n`FamilyTreeApp` 应用程序到目前已经发生了巨大的演变。第\
  \ 2 章展示了一个松耦合的 Swing 应用程序，允许你更新 `Person` 对象。第 5 章向你展示了如何将此示例程序转换为模块化的 NetBeans Platform\
  \ 应用程序。第 7 章通过节点和资源管理器视图改进了该应用程序。而第 9 章引入了动作框架和能力。\n\n在有了这些组件之后，我们现在可以将 `FamilyTreeApp`\
  \ 应用程序转换为一个完整的基于 CRUD 的系统。为了这一增强，我们将使用能力和动作框架来实现，并提供一个后端数据库进行持久化。最后，我们通过异步访问数据库来确保应用程序保持响应性。\n\
  \n## 你将学习到\n\n* 应用能力和动作框架来创建上下文感知动作。\n* 使用 NetBeans Platform 的 `DeleteAction` 和\
  \ `NewAction` 进行删除和对象创建。\n* 为应用程序节点构建右菜单。\n* 集成 `Save` 和 `Save All` 菜单项以及 `Save\
  \ All` 工具栏图标。\n* 利用 `@ServiceProvider` 提供备选的服务实现。\n* 使用 `DerbyClient`（JavaDB 数据库）和\
  \ `EclipseLink`（JPA）提供持久化。\n* 使用 `Nodes API` 异步构建节点层次结构。\n* 使用 `SwingWorker` 实现长时间任务。\n\
  \n## 10.1 创建-读取-更新-删除应用程序\n\n既然我们已经在第 9 章中讨论了 NetBeans Platform 动作框架提供的动作类型，现在我们可以向你展示如何创建一个\
  \ CRUD 类型的应用程序。CRUD 是数据库类型应用程序中“创建-读取-更新-删除”的常用缩写。虽然 `FamilyTreeApp` 还不是一个数据库应用程序（我们只是在\
  \ `HashMap` 中存储 `Person` 对象），但 NetBeans Platform 提供的松耦合设计方法允许我们轻松迁移到数据库实现。\n\n我们将使用能力来实现基于\
  \ CRUD 的应用程序功能，并在适当的地方使用 NetBeans Platform 提供的上下文。我们从一个包含 `Person Viewer` 窗口的 `FamilyTreeApp`\
  \ 版本开始（由模块 `PersonViewer` 实现）。该窗口使用资源管理器视图和节点来显示由 `FamilyTreeManager` 服务提供提供的 `Person`\
  \ 对象层次结构。\n\n示例应用程序还包含了你之前过的 `PersonEditor` 模块。然而，我们修改了这个模块以移除 `Update` 按钮。取而代之的是，使用\
  \ NetBeans Platform 的 `Openable` 和 `AbstractSavable` 能力进行编辑。当用户在 `PersonEditor`\
  \ 中打开一个 `Person` 时，该 `Person` 对象将获得一个专用的 `PersonEditor` 窗口。因此，用户可以拥有多个 `PersonEditor`\
  \ 窗口。\n\n图 10.1 显示旧应用程序以及 CRUD 开发的起点。\n图 10.2 显示了基于 CRUD 的版本。在开始之前，让我们指出新版本中的几个功能。首先，你会看到打开了三个三个\
  \ PersonEditor` 窗口，并且编辑器中没有 `Update` 按钮。取而代之的是，当编辑 `Person` 时，工具栏上的 `Save All` 图标变为可用。这些\
  \ UI 动作会将更改保存到底层存储。根节点（标记为 People）有两个右菜单项：`Refresh` 和 `Add New Person`。`Refresh`\
  \ 为我们的 CRUD 提供读取功能，`Add New Person`（工具栏和文件菜单均可用）提供创建功能。`PersonNode` 拥有 `Open` 和\
  \ `Delete` 右菜单项。`Delete` 用于单个或多个选择，但 `Open` 仅适用于单个选择。此外，NetBeans Platform 标准 `Delete`\
  \ 菜单项（位于编辑菜单）在选中一个或多个 `PersonNodes` 时启用。`Open`（以及 Save 和 Save All）为我们的 CRUD 提供更新功能，`Delete`\
  \ 提供删除功能。\n\n我们将详细展示每个 CRUD 实现。让我们从描述需要的能力开始。\n\n### 定义能力\n\n我们定义了四个能力（Java 接口），并将它们添加到能力模块的公共包中，如下：\n\
  \n* `RefreshCapability`——执行读取\n* `RemovablePersonCapability`——执行删除\n* `CreatablePersonCapability`——执行创建\n\
  * `SavablePersonCapability`——执行更新\n\n列表 10.1 显示了这些接口（存储在能力模块的类文件中）。它们在相应的上下文中实现和使用，无论是在\
  \ `PersonNode` 中、在 `PersonCapability` 对象中，还是在 `RootNode` 中。这些接口为了将来迁移到数据库实现而抛出 `IOException`。\n\
  \n\n\n\n\n```java\npublic interface RefreshCapability {\n    public void refresh()\
  \ throws IOException;\n}\n\npublic interface RemovablePersonCapability {\n    public\
  \ void remove(Person person) throws IOException;\n}\n\npublic interface CreatablePersonCapability\
  \ {\n    public void create(Person person) throws IOException;\n}\n\npublic interface\
  \ SavablePersonCapability {\n    public void save(Person person) throws IOException;\n\
  }\n```\n\n我们还需要两个 NetBeans 平台定义的能力：\n* `Openable`——在 `PersonEditor` 中打开 `Person`\n\
  * `AbstractSavable`——启用 NetBeans 平台的“保存”和“全部保存”UI 元素\n\n实现 `ReadRefreshCapability`\
  \ 在我们的 CRUD 应用中实现了 `Read` 接口。首先，`RootNode` 右键菜单使用感知上下文的 `Refresh` 操作，它会重新构建 `Person\
  \ Viewer` 窗口的节点层次结构。[图 10.3] 显示了根节点菜单中的 `RefreshAction`。\n\n![](img/image6202.jpg)\n\
  图 10.3 RootNode 刷新操作重建了节点层次结构\n\n其次，`PersonChildFactory` 类使用 `RefreshCapability`\
  \ 从 `FamilyTreeManager` 读取 `Person` 对象。我们将向你展示这两种“刷新”能力，从根节点的 `RefreshAction` 开始。\n\
  \n### 创建感知上下文的操作\n\n在 `FamilyTreeActions` 模块中，使用 `New Action` 向向创建一个根据条件启用的名为 `RefreshAction`\
  \ 的操作，并为 `Cookie` 类使用 `RefreshCapability`。将该操作放在 `RootNode` 类别中，不要选择任何 `Toolbar`\
  \ 或 `Menu` UI 注册。将其显示名称设置为“Refresh”。（可选地，若要在工具栏上的图标或顶级菜单菜单项中注册此操作，请在 `RefreshAction`\
  \ 类中提供额外的注解，如第 432 页“创建感知上下文的操作”所述。）\n\n在 NetBeans 创建类 `RefreshAction.java` 后，实现\
  \ `actionPerformed()` 方法以使用 `RefreshCapability`，如列表 [10.2] 所示。\n列表 10.2 `RefreshAction.java`\n\
  \n```java\n@ActionID(\n    category = \"RootNode\",\n    id = \"com.asgteach.familytree.actions.RefreshAction\"\
  \n)\n@ActionRegistration(\n    displayName = \"#CTL_RefreshAction\"\n)\n@Messages(\"\
  CTL_RefreshAction=Refresh\")\npublic final class RefreshAction implements ActionListener\n\
  {\n    private final RefreshCapability context;\n\n    public RefreshAction(RefreshCapability\
  \ context) {\n        this.context = context;\n    }\n\n    @Override\n    public\
  \ void actionPerformed(ActionEvent e) {\n        try {\n            context.refresh();\n\
  \        } catch (IOException ex) {\n            Exceptions.printStackTrace(ex);\n\
  \        }\n    }\n}\n```\n\n### 实现该能力\n\n在 `RootNode` 中实现 `RefreshCapability`，并将\
  \ `RefreshAction`（路径为 \"Actions/RootNode\"）放入 `getActions()` 方法中。注意，我们使用 `InstanceContent`\
  \ 向节点的 `Lookup` 中添加对象，如第 9 章所示（参见第 436 页的“在 PersonNode 中实现 CalendarCapability”）。[列表\
  \ 10.3] 显示了 `RootNode` 的更改。\n\n通过向节点的 `Lookup` 添加 `RefreshCapability` 的实现，我们启用了节点右键菜单中的\
  \ `RefreshAction`。对 `refresh()` 的调用通过 `RefreshAction` 的 `actionPerformed()` 方法发生（列表\
  \ [10.2]）。\n列表 10.3 `RootNode.java`\n\n```java\n@Messages({\n    \"HINT_RootNode=Show\
  \ all people\",\n    \"LBL_RootNode=People\"\n})\npublic class RootNode extends\
  \ AbstractNode {\n    private final InstanceContent instanceContent;\n\n    public\
  \ RootNode() {\n        this(new InstanceContent());\n    }\n\n    private RootNode(InstanceContent\
  \ ic) {\n        super(Children.create(new PersonChildFactory(), false),\n     \
  \         new AbstractLookup(ic));\n        instanceContent = ic;\n        setIconWithExtension(\"\
  com/asgteach/familytree/personviewer/personIcon.png\");\n        setDisplayName(Bundle.LBL_RootNode());\n\
  \        setShortDescription(Bundle.HINT_RootNode());\n        instanceContent.add(new\
  \ RefreshCapability() {\n            @Override\n            public void refresh()\
  \ throws IOException {\n                setChildren(Children.create(new PersonChildFactory(),\
  \ false));\n            }\n        });\n    }\n\n    @SuppressWarnings(\"unchecked\"\
  )\n    @Override\n    public Action[] getActions(boolean context) {\n        List<Action>\
  \ actions = new ArrayList<>(Arrays.asList(\n              super.getActions(context)));\n\
  \        actions.addAll(Utilities.actionsForPath(\"Actions/RootNode\"));\n     \
  \   return actions.toArray(new Action[actions.size()]);\n    }\n}\n```\n\n### 使用弱监听器\n\
  \n由于 `Refresh` 每次都会重建节点层次结构，`PersonChildFactory` 和 `PersonNode` 应该使用 `WeakListeners`。这确保了被替换的节点和\
  \ `ChildFactory` 对象被正确垃圾回收。（我们在第 300 页的“为 Person 创建 ChildFactory”中讨论了 `WeakListeners`）。\n\
  \n### 在 ChildFactory 中使用刷新\n\n[列表 10.4] 显示了 `PersonCapability.java`，这是一个拥有自身 `Lookup`\
  \ 的对象。我们在 `PersonCapability` 的 `Lookup` 中存储了与 `FamilyTreeManager` 程序交互的各种能力。有助于集中实现，但它们也可以被自定义。在这里，我们实现了\
  \ `RefreshCapability`。注意 `RefreshCapability` 并不对应一个操作，但我们直接调用该能力来构建子节点（参见第 479 页列表\
  \ 10.5 中的 `createKeys()` 方法）。`PersonCapability` 包含属性 `personList`，用于从 `FamilyTreeManager`\
  \ 读取的 `Person` 对象列表。\n列表 10.4 `PersonCapability.java`\n\n```java\npublic final class\
  \ PersonCapability implements Lookup.Provider {\n    private final Lookup lookup;\n\
  \    private final InstanceContent instanceContent = new InstanceContent();\n  \
  \  private static final Logger logger = Logger.getLogger(\n          PersonCapability.class.getName());\n\
  \    private final List<Person> personList = new ArrayList<>();\n    private FamilyTreeManager\
  \ ftm = null;\n\n    public PersonCapability() {\n        lookup = new AbstractLookup(instanceContent);\n\
  \        ftm = Lookup.getDefault().lookup(FamilyTreeManager.class);\n        if\
  \ (ftm == null) {\n            logger.log(Level.SEVERE, \"Cannot get FamilyTree\
  \ object\");\n            LifecycleManager.exit();\n        }\n        instanceContent.add(new\
  \ RefreshCapability() {\n            @Override\n            public void refresh()\
  \ throws IOException {\n                if (ftm != null) {\n                   \
  \ personList.clear();\n                    personList.addAll(ftm.getAllPeople());\n\
  \                } else {\n                    logger.log(Level.SEVERE, \"Cannot\
  \ get FamilyTreeManager\");\n                }\n            }\n        });\n   \
  \     // ... other capabilities can be added ...\n    }\n\n    public List<Person>\
  \ getPersonList() {\n        return personList;\n    }\n\n    @Override\n    public\
  \ Lookup getLookup() {\n        return lookup;\n    }\n}\n```\n\n\n\n\n我们修改了 `PersonChildFactory`\
  \ 以实例化 `PersonCapability`，查找 `RefreshCapability`，并在其 `createKeys()` 方法中使用该能力，如列表\
  \ 10.5 所示。另请，`PersonChildFactory` 有一个属性变化监听器。当底层数据存储添加或删除 `Person` 对象时，该监听器会调用自己的\
  \ `refresh()` 方法来根据需要重建子节点。\n\n列表 10.5 `PersonChildFactory` 点击此处查看代码图片\n\n* *\n\n\
  ```java\npublic class PersonChildFactory extends ChildFactory<Person> {\n\n    private\
  \ static final Logger logger = Logger.getLogger(\n                        PersonChildFactory.class.getName());\n\
  \    private final PersonCapability personCapability = new PersonCapability();\n\
  \    private FamilyTreeManager ftm = null;\n\n    public PersonChildFactory() {\n\
  \        ftm = Lookup.getDefault().lookup(FamilyTreeManager.class);\n        if\
  \ (ftm == null) {\n            logger.log(Level.SEVERE, \"Cannot get FamilyTreeManager\
  \ object\");\n            LifecycleManager.getDefault().exit();\n        } else\
  \ {\n            ftm.addPropertyChangeListener(\n                    WeakListeners.propertyChange(familytreelistener,\
  \ ftm));\n        }\n    }\n\n    @Override\n    protected boolean createKeys(List<Person>\
  \ list) {\n        RefreshCapability refreshCapability =\n                    personCapability.getLookup().lookup(RefreshCapability.class);\n\
  \        if (refreshCapability != null) {\n            try {\n                refreshCapability.refresh();\n\
  \                list.addAll(personCapability.getPersonList());\n              \
  \  logger.log(Level.FINER, \"createKeys called: {0}\", list);\n            } catch\
  \ (IOException ex) {\n                logger.log(Level.WARNING, null, ex);\n   \
  \         }\n        }\n        return true;\n    }\n\n    @Override\n    protected\
  \ Node createNodeForKey(Person key) {\n        logger.log(Level.FINER, \"createNodeForKey:\
  \ {0}\", key);\n        PersonNode node = new PersonNode(key);\n        return node;\n\
  \    }\n\n    // PropertyChangeListener for FamilyTreeManager\n    private final\
  \ PropertyChangeListener familytreelistener =\n                                \
  \            (PropertyChangeEvent evt) -> {\n        if (evt.getPropertyName().equals(FamilyTreeManager.PROP_PERSON_ADDED)\n\
  \                || evt.getPropertyName().equals(FamilyTreeManager.PROP_PERSON_DESTROYED))\
  \ {\n            this.refresh(true);\n        }\n    };\n}\n```\n\n* *\n\n实现删除：系统\
