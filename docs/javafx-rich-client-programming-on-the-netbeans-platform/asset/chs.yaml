  \    }\n    }\n}\n```\n\n### 9.4 窗口间的拖放\n\n上一节中的 Group 窗口说明了在同一窗口内发生的拖放。你也可以在不同的窗口之间拖放对象，因为\
  \ `Transferable` 对象包含了接收节点接受传输对象所需的所有必要信息。\n\n#### 垃圾桶窗口动作\n\n让我们在上一节的基础上实现一种拖放操作：用户将节点拖入一个特殊的“垃圾桶（Trash）”窗口中以便稍后删除。用户可以从这个垃圾桶容器中检索节点并返回到\
  \ Group 窗口，或者清空垃圾桶进行最终删除。我们还从 `PersonNode` 上下文菜单中移除之前实现的 `Delete` 动作。我们将通过创建一个名为\
  \ `Trash` 的新模块来实现这个“花哨删除”功能。图 9.27 显示了垃圾桶窗口，它有一个空的垃圾桶图标、一个禁用的“清空垃圾桶”菜单项，且 Trash\
  \ 节点下没有任何节点。(OEBPS/image6009.jpg) 图 9.27 垃圾桶是空的，清空垃圾桶菜单项已禁用\n\n与之相反，图 9.28 显示垃圾桶窗口中有节点，垃圾桶图标为“满的”，“清空垃圾桶”菜单项处于激活状态。(OEBPS/image6015.jpg)\
  \ 图 9.28 垃圾桶为空，清空垃圾桶菜单项已激活\n\n#### 基础层次结构\n\n让我们从根节点（`TrashNode`）、其子类（`PersonNodeContainer`）以及封装\
