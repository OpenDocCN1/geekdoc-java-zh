  \ 中并使用 `Platform.runLater()` 执行。\n\n# 5. 模块化简介\n\n在涵盖了 Swing 的基础知识后，是时候探索 NetBeans\
  \ Platform 应用架构了。在本章中，你将学习如何构建一个使用 NetBeans Platform 窗口系统的模块化应用，并利用 NetBeans Platform\
  \ 技术保持模块之间的松耦合。\n\n## 你将学到\n\n* 理解 NetBeans 模块系统。\n* 创建一个 NetBeans Platform 应用并向其添加模块。\n\
  * 将 Swing 应用迁移到 NetBeans Platform。\n* 为 NetBeans Platform 应用创建窗口。\n* 使用 `Lookup`\
  \ 发现服务提供者。\n* 使用 `Lookup` 在模块之间共享对象。\n\n## 5.1 模块化架构\n\n尽管第 2 章中的应用非常基础，但它们遵循了松耦合的设计。也就是说，更改模型数据的用户事件会产生属性更改事件，并让感兴趣的订阅者做出响应。同样，当用户选择不同的\
  \ `Person` 进行编辑时，选择监听器会让订阅者知道用户选择了一个新对象。这些机制将事件处理代码与属性更改和选择事件隔离开。然而，我们在第 2 章中展示的应用本身是单体结构的，我们使用\
  \ Java 类的可见性来封装功能。当你向此类应用添加更多功能时，隔离应用程序的不同部分将变得困难，且依赖关系会变得更加错综。\n\nNetBeans Platform\
  \ 不仅提供了广泛的功能（窗口系统、动作框架、菜单栏和工具栏等），NetBeans Platform 还为你的应用提供了一个架构框架。也就是说，NetBeans\
  \ Platform 提供了一个支持名为 `Runtime Container`（运行时容器）模块系统的执行环境。`Runtime Container` 由加载和执行你的应用所需的最小模块组成。\n\
  \n### 模块\n\n模块是 NetBeans Platform 的基本构建块。模块是功能相关的类的集合，它们存储在 `JAR` 文件中，并附带元数据。元数据为\
  \ `Runtime Container` 提供有关模块的信息，例如模块名称、版本信息、依赖关系以及它的公共包列表（如果有）。\n\nNetBeans Platform\
  \ 运行时容器强制模块的封装。这使得应用程序保持了独立性。为了使用或访问另一个模块（例如模块 B），必须满足以下条件（如图 5.1 所示）：\n\n1. 你必须将模块\
  \ A 放在公共包中并分配版本号。\n2. 模块 B 必须依赖模块 A。\n\n### NetBeans Platform 运行时容器\n\n运行时容器由以下模块组成，如图\
  \ 5.2 所示：\n\n* `Bootstrap` —— 初始化并加载运行时容器。\n* `Startup` —— 包含启动应用所需的模块。\n* `Module\
  \ System` —— 管理模块及其文件系统。\n* `Utilities` —— 提供通用工具类。\n* `File System` —— 提供文件系统支持。\n\
  * `Lookup` —— 用于查找模块的机制。\n\n为了向你展示 NetBeans Platform 的功能，我们将迁移第 2 章中的 Swing 应用。NetBeans\
  \ Platform 提供了丰富的功能（窗口系统、动作框架等），并为应用提供了架构框架。通过 `NetBeans Platform`，我们可以看到如何模块化应用（如图\
  \ 5.3 所示）：\n\n* 窗口和工具栏功能。\n* 模块的独立性。\n* `FamilyTreeManager` 在模块中的实现。\n* 模块之间的版本控制。\n\
  * 依赖关系声明（在 `project.properties` 中所示）。\n\n我们将通过 NetBeans Platform 迁移应用，并描述其对应的模块化功能。\n\
  \n## 5.2 创建 NetBeans Platform 应用\n\nNetBeans Platform 应用项目由一个或多个模块的顶层结构组成。当你使用新项目向导创建\
  \ NetBeans Platform 应用时，应用包含了 `Runtime Container`。该应用还包含支持窗口系统、动作等的额外模块。\n\n按照以下步骤在\
  \ NetBeans IDE 中创建 NetBeans Platform 应用（如图 5.4 所示）：\n\n1. 从 NetBeans IDE 顶部菜单栏，选择\
  \ `File | New Project`。NetBeans 新项目向导弹出 `Choose Project` 对话。\n2. 在 `Categories`\
