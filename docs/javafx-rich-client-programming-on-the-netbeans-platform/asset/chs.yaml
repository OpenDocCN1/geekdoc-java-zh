  \n## 实体类和 JavaFX 属性\n\nRESTful 服务向导生成 `Company` 和 `Salesdata` 实体类。这些是带有 Java Persistence\
  \ API (JPA) 注解的普通 Java 对象（POJO）。默认情况下，向导会对 POJO 的类字段进行注解。因此，JPA 使用类字段将实体状态与数据库同步。\n\
  \n尽管 JPA 不感知 JavaFX 属性，但你可以在实体类中实现 JavaFX 属性并仍然保持与 JPA 的兼容性。与其使用类字段来同步实体状态，不如告诉\
  \ JPA 使用 Java 属性的 getter 和 setter。要做到这一点，将注解从类字段移动到属性 getter。由于实体类必须定义一致的 JPA 访问方式，一旦你将注解移动到属性\
  \ getter，你就可以使用 JavaFX 属性。\n\n图 16.5 显示了 `Salesdata.java` 的这些修改。对 `Company.java`\
  \ 实体类进行类似的修改。图 16.6 显示你可以混合类字段或 JavaFX 属性。图 16.8 一旦你将注解移动到属性 getter，你就可以使用属性 getter\
