  \ Simpson was added [1].\n  null was removed [1].\nUPDATED\nmap = {0=Homer Chester\
  \ Simpson Junior, 1=Marge Simpson}\n  Homer Chester Simpson Junior was added [0].\n\
  \  Homer Simpson was removed [0].\nUPDATED\nmap = {0=Homer Chester Simpson Junior,\
  \ 1=Marge Louise Bouvier-Simpson}\n  Marge Louise Bouvier-Simpson was added [1].\n\
  \  Marge Simpson was removed [1].\nREMOVED\nmap = {0=Homer Chester Simpson Junior}\n\
  \  null was added [1].\n  Marge Louise Bouvier-Simpson was removed [1].\n```\n\n\
  ## 4.4 JavaFX Applications\n\n我们现在准备好使用 JavaFX 属性和可观察集合使用 `Person` 和 `FamilyTreeManager`\
  \ 类来构建 JavaFX 应用程序。这是[第 2 章]中介绍的 Swing 程序的 JavaFX 等效实现（63 页“改进用户体验”部分描述 `PersonSwingAppEnhancedUI`\
  \ 程序）。在这个 JavaFX 示例中，我们使用 JavaFX `TreeView` 控件在应用程序的左侧显示来自 `FamilyTreeManager` 的\
  \ `Person` 对象。用户通过右侧的表单编辑选中的 `Person` 对象。只有当用户使用 UI 控件进行修改时，Update 按钮才会启用。当用户点击\
  \ `TreeView` 的顶部（根）节点时，Person 编辑表单会被清空。\n\n[Figure 4.7] 显示了该应用程序的 JavaFX 版本（项目 `PersonFXMLAppEnhancedUI`），此时用户正在对\
  \ `Person Lisa Simpson` 进行编辑。\n\n**Figure 4.7 程序 PersonFXMLAppEnhancedUI：编辑 Person\
  \ Lisa Simpson**\n\n### Program Structure\n\n使用 NetBeans IDE 创建一个新的 JavaFX FXML\
  \ 应用程序，如前文所述（参见第 139 页的“创建一个 JavaFX FXML Application”）。[Figure 4.8] 显示了该应用程序的项目结构。与你过的\
  \ Swing 程序一样，`FamilyTreeManager` 和 `Person` 的源文件位于 `com.aste.familytree` 中。由于应用程序是为\
  \ FXML 结构化的，你会看到三个源文件：`PersonFXML.fxml`、控制器类 `PersonFXMLController` 以及主应用程序 `PersonFXMLApp`，它们都在\
  \ `personfxml` 包下。\n\n在我们检查 FXML 和类之前，让我们先看 [Listing 4.16] 所示的主应用程序代码。在这里你看到了现在熟悉的代码，它们从\
  \ FXML 文件读取并加载场景图，并配置和显示阶段（JavaFX 应用程序的主窗口）。\n\n**Listing 4.16 PersonFXML JavaFX\
  \ Application**\n\n```java\npackage personfxmlapp;\n\nimport javafx.application.Application;\n\
  import javafx.fxml.FXMLLoader;\nimport javafx.scene.Parent;\nimport javafx.scene.Scene;\n\
  import javafx.stage.Stage;\n\npublic class PersonFXMLApp extends Application {\n\
  \    @Override\n    public void start(Stage stage) throws Exception {\n        Parent\
  \ root = FXMLLoader.load(getClass().getResource(\"PersonFXML.fxml\"));\n       \
  \ Scene scene = new Scene(root);\n        stage.setTitle(\"Person FX Application\"\
  );\n        stage.setScene(scene);\n        stage.show();\n    } public static void\
  \ main(String[] args) {\n        launch(args);\n    }\n}\n```\n\n\n\n\n\n# Scene\
  \ Builder 与 FXML\n\n到目前为止，我们通过手动编辑 FXML 并配置所需的 JavaFX 控件属性来构建 FXML 标记。这对于简单的 `JavaFX`\
  \ 场景图非常好。然而，添加的控件越多，这种方法就变得越困难。如果有一个可视化编辑器来帮助你布局并为你生成 FXML 标记，将会好得多。\n\nScene Builder\
  \ 是一个独立的应用程序，让你创建 `JavaFX` 场景。类似于 Swing Form 设计器，你可以通过拖放将控件放置在设计区域，并使用右键菜单和属性表来配置控件。Scene\
  \ Builder 用 `JavaFX` 编写的，因此你拥有一些良好的 UI 图形来帮助创建应用程序的设计。\n\n一旦下载并安装了 Scene Builder，`NetBeans`\
  \ 在你打开 FXML 文件（通过打开或双击）时会自动启动它。如果你不想让 Scene Builder 编辑你的 FXML，只需用 `Edit` 打开 FXML\
  \ 文件即可。你可以在 `www.oracle.com` 免费下载 Scene Builder。[图 4.9] 显示了 Scene Builder 布局布局器，你可以在那里视觉化地放置和定位控件。在这里你可以看到用于\
  \ `PersonFXMLAppEnhancedUI` 应用程序的控件。请注意，标签 `First` 对应的文本字段被高亮了。\n\n![](img/image2432.jpg)\n\
  图 4.9 Scene Builder 布局设计器\n\n[图 4.10] 显示了 Scene Builder 层结构，它显示了场景图的可展开/折叠树，以及允许你检查和配置设计中控件的\
  \ Inspector。设计视图中高亮的同一文本字段在层次结构中也被高亮了。\n\n![](img/image2437.jpg)\n图 4.10 Scene Builder\
  \ 层结构和检查器控件\n\n检查器分为三类：属性（已折叠）、布局（当前显示）和代码（在此视图中未显示）。检查器对于指定控制器类中的 FXML 引用以及配置其他节点属性非常有用。\n\
  \n[图 4.11] 显示了 Scene Builder 库选择器。你使用库选择器向布局设计中添加基本控件、弹出控件、容器、菜单内容、形状、图表和杂项项目。库选择器具有搜索机制，可以帮助你快速找到并选择所需的组件。\n\
  \n![](img/image2444.jpg)\n图 4.11 用于搜索和选择 JavaFX 控件的 Scene Builder 库\n\nFXML 文件与其控制器类之间存在绑定。Scene\
  \ Builder 读取指定的控制器类，并在下拉菜单中提供在控制器类中标记为 `@FXML` 注解的引用。Scene Builder 不会修改控制器类。\n\n\
  然而，你可以使用 FXML 文件的 `Make Controller` 菜单项将控制器代码与 FXML 编辑同步。在 Scene Builder 中保存 FXML\
  \ 文件后，在 `NetBeans` 中选择 `Make Controller` 菜单项。`NetBeans` 将在控制器类中添加或删除带有 `@FXML` 注解的字段和方法。随着你使用\
  \ Scene Builder 的经验增加，你将发现适合自己的工作流。\n\n记住，Scene Builder 生成的是 FXML 代码，而不是 Java。让我们看看为示例应用程序生成的\
  \ Scene Builder 版 FXML，如 [列表 4.17] 所示。首先，你会发现 Scene Builder 生成的 FXML 可读性极高。其次，Scene\
  \ Builder 偏好布局容器 `AnchorPane`，它让你指定包含的子元素在窗口缩放时应如何表现。\n\n应用程序的主窗口使用一个包含 `SplitPane`\
  \ 控件的 `AnchorPane`。`SplitPane`（分为左侧和右侧）每一侧都有 `AnchorPane`。`TreeView` 控件位于左侧，右侧持有用于编辑\
  \ `Person` 的表单。这包含一个带有多个 `HBox` 控件的 `VBox`（每个标签和文本字段一个）、一个持有单选按钮的 `HBox`、一个用于备注的区域以及一个\
  \ `Update` 按钮。\n\n`SplitPane` 控件的 `background` 属性配置了线性渐变。`TreeView` 控件配置了特定大小（属性\
  \ `prefHeight` 和 `prefWidth`），而 `AnchorPane` 设置动态调整 `TreeView` 的大小以保持其配置的锚点。\n\n\
  每个单选按钮属于同一个切换组（提供选择时的互斥行为），其操作事件引用方法 `genderSelectionAction()`，该方法定义在控制器类中。请注意，第一个单选按钮创建了切换组，但第二个和第三个单选按钮使用符号\
  \ `toggleGroup=\"$genderToggleGroup\"` 来引用已创建的切换组。\n\n每个文本字段和关联标签出现在 `HBox` 中。文本字段具有\
  \ `fx:id`（以便控制器类可以引用它）以及用于 `handleKeyAction()` 事件处理器的 `onKeyReleased` 事件引用，该处理器定义在控制器类中。\n\
  \n文本区域的配置与文本字段类似，具有 `fx:id` 和 `onKeyReleased` 事件引用。你会发现（从第 2 章的 Swing 应用程序中）这些事件处理器会检测用户何时编辑属性并随后启用\
  \ `Update` 按钮。最后，`Update` 按钮具有文本“Update”、一个 `fx:id` 引用以及用于 `updateButton()` 事件处理程序的操作事件。\n\
