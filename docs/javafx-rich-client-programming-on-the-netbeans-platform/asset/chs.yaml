  \            personMap.put(person.getId(), person);\n        }\n        this.propChangeSupport.firePropertyChange(PROP_PERSON_UPDATED,\
  \ null, person);\n    }\n\n    public void deletePerson(Person p) {\n        Person\
  \ person;\n        synchronized (this) {\n```\n（注：原文提供的代码块在 deletePerson 处截断，已按要求原样输出）\n\
  \n\n\n\n```java\nperson = personMap.remove(p.getId());\n\nif (person == null) {\n\
  \    return;\n}\n\n}\n\nthis.propChangeSupport.firePropertyChange(\n    PROP_PERSON_DESTROYED,\
  \ null, person);\n}\n\npublic synchronized List<Person> getAllPeople() {\n    List<Person>\
  \ copyList = new ArrayList<>();\n    personMap.values().forEach(p -> copyList.add(new\
  \ Person(p)));\n    return copyList;\n}\n```\n\n# 添加监听器与线程安全\n\n线程安全中的一个常见错误是将引用\
  \ `this` 作为参数传递给构造函数内部的方法。这会导致“this”引用的泄露，因为在构造函数返回之前，该引用尚未完全初始化。有多种技术可以解决这个问题。例如，在\
  \ `FamilyTreeManager` 类中，静态工厂方法 `getInstance()` 会首先调用构造函数。然后它将返回的引用（实例）提供给 `PropertyChangeSupport`\
  \ 实例化，如下所示。在我们的 Swing 应用程序中，我们使用静态的 `newInstance()` 方法调用 `PersonJFrame` 构造函数，并在构造函数完全初始化后设置监听器。\n\
  \n```java\n// thread safe\ninstance = new FamilyTreeManager();\ninstance.propChangeSupport\
  \ = new PropertyChangeSupport(instance);\n```\n\n同样，列表 2.31 显示了 `PersonSwingApp`\
  \ 的代码，这是一个安全配置监听器的 Swing 程序。\n\n### 列表 2.31 PersonSwingApp 类 PersonJFrame\n\n```java\n\
  public class PersonJFrame extends javax.swing.JFrame {\n    // ...\n    private\
  \ PersonJFrame() { // 函数\n        // 配置 Logger\n        // ... 省省略代码 ...\n     \
  \   buildData();\n        initComponents();\n        personTree.getSelection().setMode(TreeSelectionModel.SINGLE_TREE_SELECTION);\n\
  \        createNodes(top);\n    }\n\n    private void configureListeners() {\n \
  \       // 监听器在构造函数之后注册\n        // 为了线程安全\n        ftm.addPropertyChangeListener(familyTreeListener);\n\
  \        personTree.addSelectionListener(treeSelectionListener);\n        updateButton.addActionListener(updateListener);\n\
  \    }\n\n    public static PersonJFrame newInstance() {\n        PersonJFrame pjf\
  \ = new PersonJFrame(); // 调用构造函数\n        pjf.configureListeners(); // 安全地配置监听器\n\
  \        return pjf;\n    }\n    // ... 省略代码 ...\n}\n```\n\n另一种添加监听器的线程安全技术是回调方法；即调用者在对象构造后调用的方法。例如，在\
  \ NetBeans Platform 中，你通常在 `TopComponent` 生命周期周期方法 `componentOpened()` 中添加监听器，并在方法\
  \ `componentClosed()` 中移除监听器。\n\n## Swing 中的并发\n\n由于你在 Swing 应用程序中通常创建后台任务来执行长时间耗时的任务，Swing\
  \ 提供了几个静态方法来管理线程，这些方法都可以通过 `SwingUtilities` 调用：\n\n- `invokeLater(Runnable doRun)`：在\
  \ EDT 上异步执行 `doRun.run()`。这发生在所有待处理的 AWT/Swing 事件处理之后。\n- `invokeAndWait(Runnable\
  \ doRun)`：在 EDT 上同步执行 `doRun.run()`。此调用会阻塞，直到所有待处理的 AWT 事件处理完毕且 `doRun.run()` 返回。使用此方法时要非常小心，因为阻塞可能会导致死锁。\n\
  - `isEventDispatchThread()`：如果当前线程是事件分发线程，则返回 true。当你需要在 EDT 上执行代码但你可能正在后台线程执行时，使用此方法。\n\
  \n## 2.6 Swing 后台任务\n\n现在让我们关注 Swing 应用程序中执行可能长时间耗时的任务的后台线程。由于 Swing 使用单线程模型，事件处理程序执行得快非常重要。当事件处理程序正在执行时（始终在\
  \ EDT 上），EDT 不会处理随后的用户输入。如果事件处理程序导致了长时间耗时的任务，UI 将临时冻结，因为在任务完成之前无法处理用户输入。项目 `PersonSwingAppMultiThread`\
  \ 取了我们的示例 Swing 应用程序并在后台线程中执行 Update 按钮。\n\n### 引入 SwingWorker\n\n长时间耗时的任务应该在后台线程运行。Swing\
  \ 提供了一个用于启动后台线程的辅助类 `SwingWorker`。列表 2.32 显示如何使用 `SwingWorker` 在后台线程保存更新后的 `Person`\
  \ 对象。\n\n### 测试后台线程\n\n为了模拟长时间耗时的任务，我们将在 `doInBackground()` 中使用 `Thread.sleep()`。这种技术有助于测试长时间的后台线程如何影响你的应用程序。\n\
  \n列表 2.32 显示了修改后的 Update 按钮事件处理程序，它在 EDT 上调用。在离开 EDT 之前，你执行任何更新 GUI 组件的代码。在这里，我们调用了\
  \ `updateModel()`，它将 `Person`（模型）对象与 Swing 组件文本字段、单选按钮和文本区域同步。然后我们创建了一个 `Person`\
  \ 对象的副本。\n\n### 并发小提示\n\n创建 `Person` 的副本对于正确行为至关重要。如果后台线程中没有副本，当用户在 `JTree` 组件中选择不同的\
  \ `Person`，可能会保存错误的 `Person` 对象。通常情况下，不要在先创建副本的情况下在后台线程中访问可变类字段。\n\n泛型类 `SwingWorker`\
  \ 提供两个泛型类型。第一个类型（`Person`）是方法 `doInBackground()` 和 `get()` 的返回类型。当后台任务完成后，可以通过 `get()`\
  \ 访问 `doInBackground()` 返回的对象。第二个泛型应用于定期发布的值。这对于长时间耗时的任务发布部分结果非常有用。在这里，我们使用 `Void`，因为我们没有发布部分结果。在\
  \ `doInBackground()` 内部放入应该在后台线程执行的代码。在这里，我们调用 `ftm.updatePerson()` 将修改后的 `Person`\
  \ 对象保存到 `FamilyTreeManager` 中。\n\n### 并发与属性更改事件\n\n回方法 `updatePerson()` 向 `FamilyTreeManager`\
  \ 属性更改监听器发送属性更改事件。由于我们在后台线程中调用 `updatePerson()`，我们使用 `SwingPropertyChangeSupport`\
  \ 在 EDT 上触发属性更改事件。\n\n\n\n\n要启动后台线程，请调用 `SwingWorker` 的 `execute()` 方法。这会调度线程执行并立即返回。我们还重写了\
  \ `done()` 方法，该方法会在后台任务完成后在 EDT（事件派发线程）上调用。此方法是你放置更新或刷新 GUI 代码的地方。`get()` 方法会阻塞直到后台任务完成。然而，如果你在\
  \ `done()` 方法中调用 `get()`，则不会发生阻塞，因为后台任务已经完成。\n\n列表 2.32 程序 PersonSwingAppMultiThread—使用\
  \ SwingWorker 点击此处查看代码图像\n\n```java\n// Update 按钮的 ActionListener\nprivate final\
  \ ActionListener updateListener = (ActionEvent e) -> {\n    // 首先从 UI 更新模型\n   \
  \ updateModel();\n    // 为后台线程拷贝 Person 对象\n    final Person person = new Person(thePerson);\n\
  \    SwingWorker<Person, Void> worker = new SwingWorker<Person, Void>() {\n    \
  \    @Override\n        public Person doInBackground() {\n            // 模拟耗时运行过程\n\
  \            try {\n                Thread.sleep(3000);\n            } catch (InterruptedException\
  \ e) {\n                logger.log(Level.WARNING, null, e);\n            }\n   \
  \         // 在后台线程保存\n            logger.log(Level.FINE, \"calling ftm for person\
  \ {0}\", person);\n            ftm.updatePerson(person);\n            // 仅当在后台线程结束后\n\
  \            // 需要访问 person 时返回；否则返回 null\n            return person;\n        }\n\
  \        // 后台线程 own 后调用\n        @Override\n        protected void done() {\n \
  \           try {\n                if (!isCancelled()) {\n                    logger.log(Level.FINE,\
  \ \"Done! Saving person {0}\", get());\n                }\n            } catch (InterruptedException\
  \ | ExecutionException ex) {\n                Logger.getLogger(PersonJFrame.class.getName())\n\
  \                    .log(Level.SEVERE, null, ex);\n            }\n        }\n \
  \   };\n    // 启动后台线程\n    worker.execute();\n};\n```\n\n### SwingWorker 提示\n`SwingWorker`\
  \ 设计为执行一次。多次执行同一个 `SwingWorker` 对象没有效果；它不会导致再次调用 `doInBackground()` 方法。\n\n通过在后台线程中更新家族谱树，我们新的\
  \ `PersonSwingAppMultiThread` 允许你在更新运行期间与用户界面进行交互。例如，现在可以在 `JTree` 中选择不同的 `Person`\
  \ 对象，编辑编辑面板中显示的 `Person`，甚至更新一个新编辑的 `Person` 对象（方法 `Thread.sleep()` 有助于测试这些场景）。\n\
  \n### 监控 SwingWorker 状态\n`SwingWorker` 提供了几个回调方法来监控后台任务。你可以通过 `publish()` 提供中间结果，通过\
  \ `setProgress()` 提供任务进度，并使用 `process()` 安全地更新 GUI。本节将展示如何使用这些方法。\n\n为了说明这一点，让我们在应用程序中添加一个“全部处理”（Process\
  \ All）按钮，该按钮将对 `FamilyTreeManager` 中的 `Person` 对象集合执行后台任务。我们将向你展示如何发布部分结果，并与进度条对部分完成情况进行同步。\n\
  \n#### 应用程序 PersonSwingApp\n`SwingWorker` 包含一个“全部处理”按钮、一个进度条和一个状态文本区域。处理过程将每个 `Person`\
  \ 的名称（拷贝）转换为全大写。图 2.19 显示了新用户界面的外观，“全部处理”按钮、进度条和状态文本区域都位于 `JTree` 下方。（OEBPS/image1480.jpg）\n\
  \n图 2.19 将后台任务整合进 GUI\n\n#### JProgressBar\n我们使用 Swing 表单设计器在表单上放置进度条。默认构造函数将最小值设置为\
  \ 0，最大值设置为 100，水平方向，且没有指示完成百分比的进度字符串。`setProgress()` 方法更新进度。你也可以使用 `setIndeterminate(true)`\
  \ 方法使用进度条反映不确定长度的任务。\n\n```java\nprivate javax.swing.JProgressBar progressBar;\n\
  progressBar = new javax.swing.JProgressBar();\n// ...\n// 将进度重置为 0\nprogressBar.setProgress(0);\n\
  // ...\n// currentProgress 是当前值，maxProgress 是完成值\n// 将 currentProgress 转换为百分比以匹配\
  \ progressBar 的范围 0 到 100\nprogressBar.setProgress(100 * currentProgress / maxProgress);\n\
  ```\n\n### 内置进度指示\nNetBeans Platform 为在后台线程中执行的操作提供了一个易用的进度指示器。这意味着你不需要自己创建进度条并将其添加到\
  \ Swing 表单中。（示例请参见第 518 页的“进度指示器](#part0017.xhtml_qMBfnX5SheAX34Jqw_Uw20539)”。）\n\
  \n图 2.20 显示了正在运行的“全部处理”后台任务。部分结果显示在文本区域，进度条显示任务已完成 60%。执行期间，“全部处理”按钮被禁用，以防止同时运行多个“全部处理”后台任务。（OEBPS/image1495.jpg）\n\
  \n图 2.20 显示后台任务的部分结果\n\n列表 2.33](#part0009.xhtml_qMBfnX5SheAX34Jqw_Uw20945) 显示了“全部处理”监听器。与上一个示例一样，我们首先在\
  \ EDT 上配置 GUI。在这里，我们禁用了“全部处理”按钮，配置进度条，并从 `FamilyTreeManager` 获取 `Person` 对象集合。\n\
  \n在此示例中，`SwingWorker` 的第一个泛型是 `Collection<Person>`。该类型指定了 `doInBackground()` 和 `get()`\
  \ 方法的返回类型。第二个泛型（`Person`）指定了发布的部分结果类型。`doInBackground()` 逐个处理列表并使用 `publish()` 发布处理过的\
  \ `Person` 对象。`publish()` 使参数对 `process()` 方法可用，该方法在 EDT 上调用。这使得可以使用部分结果安全地更新 GUI。`doInBackground()`\
  \ 调用 `setProgress()`，从而向监听器触发属性更改事件。我们定义了一个属性更改监听；属性更改事件更新进度条。（属性更改事件在 EDT 上调用，因此你可以安全地更新\
  \ GUI。）\n\n```java\n// 全部处理按钮的 ActionListener\nprivate final ActionListener processAllListener\
  \ = (ActionEvent e) -> {\n    // 从 ftm 获取列表\n    final Collection<Person> processList\
  \ = ftm.getAllPeople();\n    processAllButton.setEnabled(false);\n    progressBar.setValue(0);\n\
  \    progressBar.setStringPainted(true);\n    logger.log(Level.FINE, \"Process All\
  \ requested for {0}\", processList);\n    SwingWorker<Collection<Person>, Person>\
  \ worker = new SwingWorker<Collection<Person>, Person>() {\n        final int count\
  \ = processList.size();\n        @Override\n        protected Collection<Person>\
  \ doInBackground() {\n            // ... 实现\n        }\n    };\n};\n```\n\n\n\n\n\
  ```java\npublic Collection<Person> doInBackground() {\n    int i = 0;\n    for (Person\
  \ person : processList) {\n        try {\n            // do something with each\
  \ person\n            doProcess(person);\n            logger.log(Level.FINE, \"\
  Processing person {0}\", person);\n            publish(person);   // make available\
  \ to process()\n            setProgress(100 * (++i) / count);\n            // simulate\
  \ a long-running task\n            Thread.sleep(500);\n        } catch (InterruptedException\
  \ e) {\n            logger.log(Level.WARNING, null, e);\n        }\n    }\n    return\
  \ processList;\n}\n\nprivate void doProcess(Person p) {\n    p.setFirstname(p.getFirstname().toUpperCase());\n\
  \    p.setMiddlename(p.getMiddlename().toUpperCase());\n    p.setLastname(p.getLastname().toUpperCase());\n\
  \    p.setSuffix(p.getSuffix().toUpperCase());\n}\n\n@Override\nprotected void done()\
  \ {\n    try {\n        if (!isCancelled()) {\n            logger.log(Level.FINE,\
  \ \"Done! processing all {0}\", get());\n        }\n    } catch (InterruptedException\
  \ | ExecutionException ex) {\n        Logger.getLogger(Person.class.getName()).log(Level.SEVERE,\
  \ null, ex);\n    }\n    // reset any GUI\n    progressBar.setValue(0);\n    progressBar.setStringPainted(false);\n\
  \    statusTextArea.setText(\"\");\n    processAllButton.setEnabled(true);\n}\n\n\
  @Override\nprotected void process(List<Person> chunks) {\n    chunks.stream().forEach((p)\
  \ -> {\n        statusTextArea.append(p + \"\\n\");\n    });\n}\n\nworker.addPropertyChangeListener((PropertyChangeEvent\
  \ evt) -> {\n    if (\"progress\".equals(evt.getPropertyName())) {\n        progressBar.setValue((Integer)\
  \ evt.getNewValue());\n    }\n});\n\nworker.execute();\n```\n\n\n\n\n## 2.7 关键点总结\n\
  \n本章涵盖了 Swing 和 NetBeans Platform 应用中反复使用的基本概念。该方法通过构建具有 JavaBeans 属性和属性更改支持的模型对象，鼓励采用松耦合的设计。以下是本章的要点：\n\
  \n- 使用 `JavaBeans` 和 `JavaBean` 属性存储模型数据。\n- 为可读属性提供 getter 方法，为可写属性提供 setter 方法。\n\
  - 为绑定属性（bound properties）提供属性更改支持。\n- 为模型对象提供 `toString()`、`equals()` 和 `hashCode()`\
  \ 的实现。\n- 为粗粒度属性更改支持模型提供一个单例“管理器”类。\n- 为了减少样板代码，对函数式接口使用 lambda 表达式，例如事件监听器和 `Runnable`。\n\
  - `Swing` 是一个成熟的 GUI 框架，采用单线程模型。`Swing` 组件不是线程安全的，必须在事件分发线程（EDT）上访问。\n- 使用 `SwingUtilities.invokeLater()`\
  \ 在 `EDT` 上执行代码。\n- NetBeans IDE 表单设计器可以帮助你通过在表单上拖放来设计和配置 `Swing` 组件。\n- 从表单设计器的\
  \ `Swing Component Palette` 中选择 `Swing` 组件。\n- Java 拥有标准的日志记录机制，可以帮助你配置显示在控制台上的消息。你还可以将消息记录到其他位置，例如文件。\n\
  - 使用 `JTextField` 进行单行文本编辑，使用 `JTextArea` 进行多行文本编辑。\n- 使用 `JLabel` 显示文本标签，使用 `JButton`\
  \ 表示图形动作，使用 `JRadioButton` 表示互斥选择。\n- `Swing JTree` 组件允许你显示层次结构数据并提供用户选择事件。\n- `Swing`\
  \ 组件生成一个或多个特定事件，你可以监听这些事件并用相应的事件处理器进行响应。\n- 为特定事件（属性更改事件、树选择事件、动作事件）编写监听器和事件处理器，有助于你的应用程序保持松耦合。\n\
  - 使用 `DocumentListeners` 探测基于文本的 `Swing` 组件的编辑事件。\n- `JRadioButtons` 在选择发生变化时生成动作事件。\n\
  - 在后台线程中执行可能耗时的任务。使用辅助类 `SwingWorker` 创建后台线程，并管理后台线程与 `EDT` 之间的通信。\n- 在构建多线程应用程序时，注意可以并发访问的可变对象，并以线程安全的方式使用它们。\n\
  \n## 接下来？\n\n也许你已经注意到，我们在 `Swing` 示例程序中没有实现添加或删除 `Persons` 的用户操作。一旦你有了一个具有多个动作的\
  \ `Swing` 桌面应用程序，你通常会想要使用带有菜单项的菜单栏。我们还没有向这些程序中添加此功能，因为这正是 NetBeans Platform 提供的许多特性之一：内置菜单栏、工具栏和动作框架。\n\
  \n我们将在接下来的章节中探索如何实现这一切以及更多。但首先，让我们稍微绕路，查看一下新的 Java GUI：`JavaFX`。\n\n# 3. JavaFX\
  \ 简介\n\n`Swing` 已经存在很长时间了，一些非常强大的应用程序和框架是用这个库编写的。其中一个强大的应用程序之一是 NetBeans IDE，而一个强大的框架之一是\
  \ NetBeans Platform。然而，尽管这些应用程序和框架基于 `Swing`，并不意味着你不能或不应该使用 `JavaFX`。事实上，我们希望书中的材料能帮助你将\
  \ `JavaFX` 整合到你的 NetBeans Platform 应用中，从而创建出既性能良好又精美的丰富客户端应用程序。\n\n我们将从对 `JavaFX`\
  \ 的简单、温和的介绍开始。但请放心，我们在本章中会加快进度。显然，我们无法在这里涵盖你关于 `JavaFX` 所需要的所有知识，但就像上一章对 `Swing`\
  \ 的介绍一样，我们希望提供足够的内容，让你能够舒适地阅读和在桌面应用程序中使用 `JavaFX` 代码。\n\n在本章中，你将学习 `JavaFX` 的基础知识、其结构以及\
  \ `JavaFX` 构建 GUI 的哲学。你将学习不同的编码风格，并发现最适合你和你的开发团队的风格。在下一章中，我们将为你展示 `JavaFX` 如何融入桌面应用程序开发世界。我们还为在\
  \ NetBeans Platform 中使用 `JavaFX` 奠定基础。\n\n## 你将学习\n\n- 了解 `JavaFX` 基础知识。\n- 构建 `JavaFX`\
  \ 程序并使用 `JavaFX` API。\n- 构建带有形状、控件和布局的场景图。\n- 使用 `FXML` 和控制器类。\n- 将 `CSS` 文件整合到你的\
  \ `JavaFX` 设计中。\n- 应用 `JavaFX` 动画和事件处理。\n- 了解 `JavaFX` 属性、可观察、`InvalidationListeners`\
  \ 和 `ChangeListener`。\n- 理解并应用 `JavaFX` 绑定。\n\n## 3.1 什么是 JavaFX？\n\n如果 NetBeans\
  \ Platform 使用 `Swing` 编写其 GUI，而我已经熟悉 `Swing`，为什么我还要学习和使用 `JavaFX` 呢？这是一个很好的问题。以下是几个原因：\n\
  \n- `JavaFX` 提供了丰富的图形用户界面。虽然你确实可以用 `Swing` 提供丰富的内容，但 `JavaFX` 具有专门为动画、2D 和 3D 几何、图表、特殊特效、颜色渐变、图形控件以及媒体（包括音频、视频和图像）轻松操作设计的结构和\
  \ API。底是：使用 `JavaFX` 创建丰富的内容比使用 `Swing` 和 `Java2D` 得多。\n- `JavaFX` 图形渲染利用了硬件加速能力。这使得图形渲染和动画性能良好。\n\
  - 你可以使用 `JFXPanel` 将 `JavaFX` 内容嵌入到 `Swing` 面板中。这种特殊 `Swing` 组件的魔力允许你创建复杂的 NetBeans\
  \ Platform 应用，并在应用程序窗口中包含 `JavaFX` 丰富内容。此外，你可以在不丢弃现有 `Swing` 程序的情况下开始使用 `JavaFX`。\n\
  \n### 历史简介\n\n`JavaFX` 起于构建在 Java 之上的声明式脚本语言（`JavaFX Script`）。虽然开发者喜欢声明式脚本的便利，但将\
  \ `JavaFX Script` 与现有的 `Swing` 应用集成非常困难。此外，`JavaFX Script` 需要学习新语言。\n\n`JavaFX 2.0`\
  \ 于 2011 发布，基于 `Java` API。随着 Java 7，`JavaFX` 被包含在标准发行中，从 Java 8 开始（`JavaFX 8` 包含了\
  \ 3D 能力），所有的 `JavaFX` 库（`JAR` 文件）都包含在标准类路径中。这意味着下载 Java 开发工具包（`JDK`）时，`JavaFX` 现在已经是\
  \ Java 的一部分了。\n\n虽然你完全可以在 `Swing` 程序中使用 `JavaFX` API，但 `JavaFX` 还提供了 `FXML` 这种声明式语言，用于描述\
  \ UI。你也可以使用 `Scene Builder` 来设计 UI，这 使得 `JavaFX` 变得更加简单。我们将在本章介绍 `Scene Builder`。\n\
  \n### 场景图的隐喻\n\n`JavaFX` 场景图允许你显示层次结构数据并提供用户选择事件。\n\n\n\n\n\n```java\nrectangle.setArcWidth(30);\n\
  rectangle.setArcHeight(30);\nrectangle.setEffect(new DropShadow(10, 5, 5, Color.GRAY));\n\
  ```\n这段代码示例创建了一个宽度为 200、高度为 100 且颜色为 `Color.CORNSILK` 的 `Rectangle`。setter 方法配置了\
  \ `arcWidth` 和 `arcHeight` 属性（赋予矩形圆角外观），并添加了灰色的阴影效果。同样，我们创建了一个初始化为文本“My Rectangle”的\
  \ `Text` 对象。setter 方法分别使用 `Font` 和 `Reflection` 对象配置了 `Text` 的字体和效果属性。点击此处查看代码图像\n\
  \n```java\nText text = new Text(\"My Rectangle\");\ntext.setFont(new Font(\"Verdana\
  \ Bold\", 18));\ntext.setEffect(new Reflection());\n```\n布局控件用于顶层节点的是 `StackPane`。在这里我们使用了\
  \ `StackPane` 的默认配置，它会使其子节点居中，并指定了首选的高度和宽度。注意，当你调整窗口大小时，`StackPane` 会保持其子节点居中。你可以使用\
  \ `getChildren().add()` 向布局控件（一个 `Pane`）添加单个节点，或使用 `getChildren().addAll()` 添加多个节点，如下所示。（`getChildren()`\
  \ 方法返回一个 JavaFX `Collection$`）。点击此处查看代码图像\n\n```java\nStackPane stackPane = new\
  \ StackPane();\nstackPane.setPrefHeight(200);\nstackPane.setPrefWidth(400);\nstackPane.getChildren().addAll(rectangle,\
  \ text);\n```\n由于矩形是先被添加到 `StackPane` 的，因此它显示在文本节点之后，而文本节点在最上方。按相反顺序添加这些节点将导致文本节点隐藏在矩形后面。JavaFX\
  \ 还有其他布局控件，包括 `HBox`（水平框）、`VBox`（垂直框）、`GridPane`、`FlowPane`、`AnchorPane` 等。\n\n\
  ***\n\n### Import 和 JavaFX\n请确保为任何 import 语句指定正确的包名。某些 JavaFX 类（如 `Rectangle`）与其\
  \ AWT 或 Swing 对应类具有相同的名称。所有 JavaFX 类都是包 `javafx.*` 的一部分。\n\n***\n\nListing 3.1 显示了程序\
  \ `MyRectangleApp` 的完整源码。列表 3.1 `MyRectangleApp.java` 点击此处查看代码图像\n\n```java\npackage\
  \ myrectangleapp;\n\nimport javafx.application.Application;\nimport javafx.scene.Scene;\n\
  import javafx.scene.effect.DropShadow;\nimport javafx.scene.layout.StackPane;\n\
  import javafx.scene.paint.Color;\nimport javafx.scene.shape.Rectangle;\nimport javafx.scene.text.Font;\n\
  import javafx.scene.text.Text;\nimport javafx.stage.Stage;\n\npublic class MyRectangleApp\
  \ extends Application {\n    @Override\n    public void start(Stage primaryStage)\
  \ {\n        Rectangle rectangle = new Rectangle(200, 100, Color.CORNSILK);\n  \
  \      rectangle.setArcWidth(30);\n        rectangle.setArcHeight(30);\n       \
  \ rectangle.setEffect(new DropShadow(10, 5, 5, Color.GRAY));\n        \n       \
  \ Text text = new Text(\"My Rectangle\");\n        text.setFont(new Font(\"Verdana\
  \ Bold\", 18));\n        text.setEffect(new Reflection());\n        \n        StackPane\
  \ stackPane = new StackPane();\n        stackPane.setPrefHeight(200);\n        stackPane.setPrefWidth(400);\n\
  \        stackPane.getChildren().addAll(rectangle, text);\n        \n        final\
  \ Scene scene = new Scene(stackPane, Color.LIGHTBLUE);\n        primaryStage.setTitle(\"\
  My Rectangle App\");\n        primaryStage.setScene(scene);\n        primaryStage.show();\n\
  \    }\n    // 当从 NetBeans 运行 JavaFX 时会调用 main()\n    // 但通过 JavaFX 部署（打包）启动时会被忽略\n\
  \    public static void main(String[] args) {\n        launch(args);\n    }\n}\n\
  ```\n\n***\n\n2。当你构建并运行 JavaFX 项目时，NetBeans IDE 会为你打包 JavaFX 应用程序。你也可以使用命令行工具 `javafxpackager`（位于\
  \ JavaFX SDK 的 `bin` 目录）来手动打包 JavaFX 应用程序。图 3.7 描述了 `MyRectangleApp` 的场景。Stage 是顶层窗口，由\
  \ JavaFX `Platform` 创建。在示例中，`StackPane` 是根节点，其子节点包括 `rectangle` 和 `text` 节点。\n\n\
  ### 应用线性渐变\n我们的示例还没有结束。图 3.8 显示了在相同程序中为矩形上添加了线性渐变的结果。最初，我们使用填充色 `Color.CORNSILK`\
  \ 构建了矩形。现在让我们使用 CSS 用线性渐变来配置矩形的填充，该渐变从浅橙色逐渐变为深橙色，如图 3.8 所示。\n\n为了创建线性渐变，我们使用 `setStyle()`\
  \ 方法应用 CSS。此 CSS 指定了 `-fx-fill`，它是 `Shape` 填充属性的 JavaFX 特定 CSS 样式。\n\n```java\n\
  rectangle.setStyle(\"-fx-fill: \" +\n    \"linear-gradient(#ffd65b,#e68400),\" +\n\
  \    \"linear-gradient(#ffef84,#f2ba44),\" +\n    \"linear-gradient(#ffea6a,#efaa22),\"\
  \ +\n    \"linear-gradient(#ffe657 0%,#f8c202 50%,#eea10b 100%),\" +\n    \"linear-gradient(from\
  \ 0% 0% to 15% 50%, \" +\n    \"rgba(255,255,255,0.9), rgba(255,255,255,0));\");\n\
  ```\n该样式定义了五个线性渐变元素 33。我们从 Jasper Potts 发布在 [fxexperience.com](http://fxexperience.com)（2011\
  \ 年 12 月 20 日）上的“Shiny Orange”样式中借用了这种极其的五部分线性渐变。\n\n### JavaFX 和 CSS\n还有其他方法可以将\
  \ CSS 应用到节点。最常见的方法之一导入 CSS 文件。事实上，所有 JavaFX 控件都有标准样式，你可以在运行时 JAR 文件 `jfxrt.jar`\
  \ 中访问它们。JavaFX 8 的默认 JavaFX CSS 样式是 `Modena`，位于 `modena.css` 文件。稍后我们将展示如何向你的 JavaFX\
  \ 场景应用 CSS 文件。\n\n\n\n\n使用 CSS 对节点进行样式设置是一项重要功能，它允许图形设计师参与程序外观的定制。你可以替换 JavaFX 默认\
  \ CSS 文件中的任何或所有样式，并在默认样式之上添加自己的样式。\n\n### 创建 JavaFX FXML 应用程序\n\nJavaFX 中一个非常有用的结构化工具是使用\
  \ FXML 指定 JavaFX 场景图节点。FXML 是一种 XML 标记语言，非常契合场景图的层次级结构。FXML 帮助你将场景图结构可视化，并使得修改变得更加容易，而如果使用\
  \ Java 代码，这些修改可能会非常繁琐。\n\nFXML 通常需要三个文件：程序的主 Java 文件、FXML 文件以及一个用于 FXML 文件的 Java\
  \ 控制器类。主 Java 类使用 FXML Loader 来创建 `Stage` 和 `Scene`。FXML Loader 读取 FXML 文件并构建场景图。控制器类提供了\
  \ JavaFX 节点初始化代码，并通过程序方式访问场景图以创建动态内容或处理事件。\n\n让我们重新制作之前的应用程序，并向你展示如何使用 FXML。你可以按照以下步骤使用\
  \ NetBeans IDE 创建 JavaFX FXML 应用程序：\n\n1. 从顶层菜单中，选择 `File`（文件） | `New Project`（新建项目）。NetBeans\
  \ 显示 `Choose Project`（选择项目）对话框。在 `Categories`（分类）下，选择 `JavaFX`，在 `Projects`（项目）下，选择\
  \ `JavaFX FXML Application`，如图图 3.9 *图 3.9 创建 JavaFX FXML 应用程序项目*\n2. NetBeans 显示\
  \ `Name`（名称）和 `Location`（位置）对话框。项目名称输入 `MyRectangleFXApp`，点击 `Browse`（浏览）选择的位置，并为\
  \ FXML 文档指定指定 `MyRectangleFX`，如图图 3.10 *图 3.10 指定项目和 FXML 文件名*\n\nNetBeans 创建了一个包含三个源文件的项目：`MyRectangleFXApp.java`（主程序）、`MyRectangleFX.fxml`（FXML\
  \ 文档）和 `MyRectangleFXController.java`（控制器类）。列表 3.2 显示了新主程序的结构。注意，FXML Loader 读取了\
  \ FXML 文件 `MyRectangleFX.fxml` 并构建了场景图。\n\n*列表 3.2 MyRectangleFXApp.java 点击此处查看代码图片*\n\
  \n```java\npackage myrectanglefxapp;\n\nimport javafx.application.Application;\n\
  \nimport javafx.fxml.FXMLLoader;\nimport javafx.scene.Parent;\nimport javafx.scene.Scene;\n\
  import javafx.scene.paint.Color;\nimport javafx.stage.Stage;\n\npublic class MyRectangleFXApp\
  \ extends Application {\n\n    @Override\n    public void start(Stage stage) throws\
  \ Exception {\n        Parent root = FXMLLoader.load(getClass().getResource(\n \
  \                           \"MyRectangleFX.fxml\"));\n        Scene scene = new\
  \ Scene(root, Color.LIGHTBLUE);\n        stage.setScene(scene);\n        stage.show();\n\
  \    }\n\n    public static void main(String[] args) {\n        launch(args);\n\
  \    }\n}\n```\n\n图 3.11 显示了 JavaFX FXML 应用程序的结构。执行从主程序开始，它调用 FXML Loader。FXML Loader\
  \ 解析 FXML 文档，实例化对象并构建场景图。构建场景图后，FXML Loader 实例化控制器类并调用控制器的 `initialize()` 方法。![](img/image1700.jpg)\
  \ *图 3.11 JavaFX FXML 应用程序的结构*\n\n现在让我们来看看这个应用程序的 FXML 标记，如图列表 3.3 所示。每个 FXML 文件都与一个控制器类关联，通过\
  \ `fx:controller` 属性指定。通过 XML 标记，你可以看到 FXML 的结构与第 92 页上图 3.7 所示的层次级布局相匹配（即从根节点 `StackPane`\
  \ 开始）。`StackPane` 是顶节点，其子节点是 `Rectangle` 和 `Text` 节点。`Rectangle` 的属性通过属性名称配置，这些名称会被转换为正确的类型。`style`\
  \ 属性匹配我们之前显示的 `-fx-fill`（幸运的是，你可以跨行编写字符串）。`Rectangle` 和 `Text` 元素都配置了效果。`Rectangle`\
  \ 具有阴影，`Text` 具有反射。你在 FXML 文件指定的每个元素都会被实例化。因此，你不需要编写创建 `StackPane`、`Text`、`DropShadow`\
  \ 或 `Reflection` 对象的 Java 代码。FXML Loader 会为你创建这些对象。\n\n*列表 3.3 MyRectangleFX.fxml\
  \ 点击此处查看代码图片*\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<?import java.lang.*?>\n\
  <?import java.util.*?>\n<?import javafx.scene.*?>\n<?import javafx.scene.control.*?>\n\
  <?import javafx.scene.layout.*?>\n<?import javafx.scene.shape.*?>\n<?import javafx.scene.text.*?>\n\
  <?import javafx.scene.effect.*?>\n<StackPane id=\"StackPane\" prefHeight=\"200\"\
  \ prefWidth=\"400\"\n    xmlns:fx=\"http://javafx.com/fxml\"\n    fx:controller=\"\
  myrectanglefx.MyRectangleController\">\n    <children>\n        <Rectangle fx:id=\"\
  rectangle\" width=\"200\" height=\"100\"\n            arcWidth=\"30\" arcHeight=\"\
  30\"\n            style=\"-fx-fill: linear-gradient(#ffd65b, #e68400),\n       \
  \                       linear-gradient(#ffd65b, #e68400),\n                   \
  \           linear-gradient(#ffd65b, #e68400),\n                              linear-gradient(#ffd65b,\
  \ #e68400),\n                              linear-gradient(#ffd65b, #e68400),\n\
  \                              linear-gradient(#ffd65b, #e68400),\n            \
  \                  linear-gradient(#ffd65b, #e68400),\n                        \
  \      linear-gradient(#ffd65b, #e68400),\n                              linear-gradient(#ffd65b,\
  \ #e68400),\n                              linear-gradient(#ffd65b, #e68400),\n\
  \                              linear-gradient(#ffd65b, #e68400),\n            \
  \                  linear-gradient(#ffd65b, #e68400),\n                        \
  \      linear-gradient(#ffd65b, #e68400),\n                              linear-gradient(#ffd65b,\
  \ #e68400),\n                              linear-gradient(#ffd65b, #e68400),\n\
  \                              linear-gradient(#ffd65b, #e68400),\n            \
  \                  linear-gradient(#ffd65b, #e68400),\n                        \
  \      linear-gradient(#ffd65b, #e68400),\n                              linear-gradient(#ffd65b,\
  \ #e68400),\n                              linear-gradient(#ffd65b, #e68400),\n\
  \                              linear-gradient(#ffd65b, #e68400),\n            \
  \                  linear-gradient(#ffd65b, #e68400),\n                        \
  \      linear-gradient(#ffd65b, #e68400),\n                              linear-gradient(#ffd65b,\
  \ #e68400),\n                              linear-gradient(#ffd65b, #e68400),\n\
  \                              linear-gradient(#ffd65b, #e68400),\n            \
  \                  linear-gradient(#ffd65b, #e68400),\n                        \
  \      linear-gradient(#ffd65b, #e68400),\n                              linear-gradient(#ffd65b,\
  \ #e68400),\n                              linear-gradient(#ffd65b, #e68400),\n\
  \                              linear-gradient(#ffd65b, #e68400),\n            \
  \                  linear-gradient(#ffd65b, #e68400),\n                        \
  \      linear-gradient(#ffd65b, #e68400),\n                              linear-gradient(#ffd65b,\
  \ #e68400),\n                              linear-gradient(#ffd65b, #e68400));\"\
  \ >\n            <effect>\n                <DropShadow color=\"GRAY\" offsetX=\"\
  5.0\" offsetY=\"5.0\" />\n            </effect>\n        </Rectangle>\n        <Text\
  \ text=\"My Rectangle\">\n            <effect>\n                <Reflection />\n\
  \            </effect>\n            <font>\n                <Font name=\"Verdana\
  \ Bold\" size=\"18.0\" />\n            </font>\n        </Text>\n    </children>\n\
  </StackPane>\n```\n\n要从控制器类访问 FXML 元素，请为它们指定 `fx:id` 标签。在这里，我们为 `Rectangle` 元素分配了\
  \ `fx:id=\"rectangle\"`。这引用了你在控制器类中声明的变量。\n\n## FXML 与控制器类\n\n将控制器类命名为与 FXML 文件相同的名称并在结尾加上\
  \ `Controller`。这并非强制要求，但有助于识别 FXML 文件与其控制器类之间的关系。\n\n现在让我们向你展示控制器类。列表 3.4 显示了 `MyRectangleFXController.java`\
  \ 的源码。`FXML` 注解将 `rectangle` 标记为 FXML 定义的对象。`initialize()` 方法在场景图构建后被调用，通常包含任何必要的初始化代码。在这里我们配置了两个\
  \ Rectangle 属性：`strokeWidth` 和 `stroke`。虽然我们可以在 FXML 文件中配置这些属性，但列表 3.4 展示了你如何在控制器类中访问\
  \ FXML 定义的元素。\n\n*列表 3.4 MyRectangleFXController.java 点击此处查看代码图片*\n\n```java\npackage\
  \ myrectanglefxapp;\n\nimport java.net.URL;\nimport java.util.ResourceBundle;\n\
  import javafx.fxml.FXML;\nimport javafx.fxml.Initializable;\nimport javafx.scene.paint.Color;\n\
  import javafx.scene.shape.Rectangle;\n\npublic class MyRectangleFXController implements\
  \ Initializable {\n\n    @FXML\n    private Rectangle rectangle;\n\n    @Override\n\
  \    public void initialize(URL url, ResourceBundle rb) {\n        rectangle.setStrokeWidth(5.0);\n\
  \        rectangle.setStroke(Color.GOLDENROD);\n    }\n}\n```\n\n\n\n控制器类还包含了事件处理器（当我们向你展示动画时，我们会添加一个事件处理器）。图\
  \ 3.12 显示了 `MyRectangleFXApp` 运行，并配置了矩形的 `stroke`（描边）和 `strokeWidth`（描边宽度）属性。![](img/image1737.jpg)图\
  \ 3.12 矩形自定义的 stroke 和 strokeWidth 属性。\n\n### CSS 文件\n\n与其在 FXML 文件中指定长得惊人的线性渐变样式（参见第\
  \ 96 页的代码列表 3.3），让我们将这段代码隐藏在 CSS 文件中并将其应用于场景图。\n\n你可以直接在 FXML 文件中或在主程序中指定 CSS 文件。要在主程序中指定\
  \ CSS 文件，请添加对 `scene.getStylesheets()` 的调用，如列表 3.5 所示。\n\n列表 3.5 在主程序中添加 CSS 样式表点击此处查看代码图像\n\
