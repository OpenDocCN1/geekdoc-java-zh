  \ 8.40 所示，仅选择你创建的新模式。点击 Next。\n![](img/image593.jpg)\n图 8.40 窗口布局——找到模式\n12. NetBeans\
  \ 显示创建的文件列表。在这里看到每个模式的 `layer.xml` 和 `wsmode.xml` 文件。如图 8.41 所示点击 Finish。\n![](img/image599.jpg)\n\
  图 8.41 窗口布局——更改的文件\n\n你现在可以通过创建 `TopComponents` 并选择新窗口来使用这些新模式。然而，让我们先查看配置文件。通过熟悉这些文件，你可以在不重新运行窗口布局向导的情况下调整窗口设计并可能添加新模式。\n\
  \n**窗口布局提示**：注意，尽管在图 8.40 中没有选择任何默认模式，但默认模式仍然存在于系统中。如果你计划使用任何默认模式，并希望其布局符合你在窗口布局向导中指定的自定义布局，你应该勾选这些默认模式以及你创建的任何模式。\n\
  \n\n\n\n\n</folder>\n</folder>\n</filesystem>\n\n模式定义文件指定了模式的配置。带有属性 `unique` 的元素\
  \ `name` 必须与 `layer.xml` 中列出的 `mode.wsmode` 文件匹配。带有属性 `type` 的元素 `kind` 值为 `\"view\"\
  `、`\"editor\"` 或 `\"sliding\"`。（属性值 `\"sliding\"` 指最小化模式）。带有属性 `type` 的元素 `state`\
  \ 值为 `\"joined\"`（意味着停靠在主窗口框架内，而不是 `\"separated\"`），而元素 `constraints` 则决定了模式中的窗口相对于其他已打开窗口和模式的尺寸大小。\n\
  \n`constraints` 元素提供一个或多个 `path` 元素，用于递归地划分窗口框架。当属性 `orientation` 为 `\"vertical\"\
  ` 时，区域被划分为行（单元格从上到下定义）。当属性 `orientation` 为 `\"horizontal\"` 时，区域被划分为列（单元格从左到右定义）。属性\
  \ `number` 指定了该模式在划分区域中的相对位置，`0` 表示最顶部或最左侧，最大的数字表示最底部或最右侧。\n\n如果你使用如 `0`、`20`、`40`\
  \ 这样的数字，另一个模块提供程序可以指定出现在任何已定义模式之间的模式。对于特定模式，属性 `weight` 指定了每个窗口在框架内给定单元格中应消耗的相对大小。如果所有模式的权重均为\
  \ `.5`，那么它们将占据相同的空间，即使窗口框架调整大小也是如此。简单的窗口布局包含单个框架，其 `constraints` 元素是空的。\n\n列表 8.21\
  \ 显示了 `topbanner` 的模式定义文件。在这里，模式 `topbanner` 指定了位于位置 `0` 的一个 `path` 元素（这将始终是划分单元格中的第一个槽）。该模式消耗垂直空间的\
  \ 25%。它不会在水平方向上共享（划分）空间；因此它将占据整个水平空间以提供横幅效果。你应该将元素 `empty-behavior` 属性 `permanent`\
  \ 设置为 `\"true\"`。否则，如果该模式为空（例如因为你浮动了一个窗口），窗口系统将动态删除该模式。\n\n列表 8.21 topbannerWsmode.xml\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<mode version=\"2.4\">\n \
  \   <name unique=\"topbanner\"/>\n    <kind type=\"view\"/>\n    <state type=\"\
  joined\"/>\n    <constraints>\n        <path orientation=\"vertical\" number=\"\
  0\" weight=\"0.25\"/>\n    </constraints>\n    <bounds x=\"0\" y=\"0\" width=\"\
  0\" height=\"0\"/>\n    <frame state=\"0\"/>\n    <empty-behavior permanent=\"true\"\
  />\n</mode>\n```\n\n列表 8.22 显示了模式 `leftside` 的模式定义文件。它指定了水平划分（意味着列）、位置数字 `0`（最左侧）和权重\
  \ `.3`。\n\n列表 8.22 leftsideWsmode.xml\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<mode version=\"2.4\">\n    <name unique=\"leftside\"/>\n    <kind type=\"\
  view\"/>\n    <state type=\"joined\"/>\n    <constraints>\n        <path orientation=\"\
  horizontal\" number=\"0\" weight=\"0.3\"/>\n    </constraints>\n    <bounds x=\"\
  0\" y=\"0\" width=\"0\" height=\"0\"/>\n    <frame state=\"0\"/>\n    <empty-behavior\
  \ permanent=\"true\"/>\n</mode>\n```\n\n列表 8.23 同样指定了水平划分，使用位置数字 `1` 和权重 `.7`。因此它将位于上一个模式的右侧并占据大约\
  \ `.7` 的空间。模式 `rightside` 的类型为 `\"editor\"`，而另外两个类型为 `\"view\"`。\n\n列表 8.23 rightsideWsmode.xml\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<mode version=\"2.4\">\n \
  \   <name unique=\"rightside\"/>\n    <kind type=\"editor\"/>\n    <state type=\"\
  joined\"/>\n    <constraints>\n        <path orientation=\"horizontal\" number=\"\
  1\" weight=\"0.7\"/>\n    </constraints>\n    <bounds x=\"0\" y=\"0\" width=\"0\"\
  \ height=\"0\"/>\n    <frame state=\"0\"/>\n    <empty-behavior permanent=\"true\"\
  />\n</mode>\n```\n\n\n\n\n\n### 创建 TopComponents\n\n让我们通过创建 `TopComponents` 来测试新的窗口布局，为每个新模式各创建一个。\n\
