  0\" GridPane.rowIndex=\"0\">\n    <columns>\n        <TableColumn fx:id=\"colCompany\"\
  \ text=\"%company\" sortable=\"false\" minWidth=\"150\" />\n        <TableColumn\
  \ fx:id=\"colYear\" text=\"%year\" sortable=\"false\" minWidth=\"150\" />\n    \
  \    <TableColumn fx:id=\"colUnitsSold\" text=\"%unitsSold\" editable=\"true\" sortable=\"\
  false\" minWidth=\"175\" />\n    </columns>\n</TableView>\n</GridPane>\n</center>\n\
  <bottom>\n    <GridPane alignment=\"center\" hgap=\"10\" vgap=\"15\">\n        <padding>\n\
