  图 7.8 启动时的性别窗口（左）和展开后的窗口（右）\n\n## 程序化展开节点\n\n你可以通过点击 UI 中的“打开”句柄来展开节点（[图 7.8] 左侧窗口显示的小三角形）。资源管理器视图（Explorer\
  \ Views，基于树）有两种展开节点层级的方法：`expandNode(Node node)` 和 `expandAll()`。仅在你确定节点层级的大小时才使用\
  \ `expandAll()` 方法。要让节点层级在启动时展开性别节点，请将[列表 7.10]中的代码添加到 `GenderTopComponent` 构造函数的末尾。\n\
  \n### 列表 7.10 展开性别节点\n\n```java\npublic GenderTopComponent() {\n    . . .\n    //\
  \ 展开第二层节点\n    for (Node node : em.getRootContext().getChildren().getNodes()) {\n\
  \        view.expandNode(node);\n    }\n}\n```\n\n在这里，我们通过资源管理器的根上下文访问性别节点，并使用资源管理器视图展开它们。\n\
  \n## 使用 BeanNode\n\n### 选择与编辑\n\n对于在编辑器中显示业务对象，选择并不是典型的用户场景。更好的方法是打开带有上下文感知菜单项的编辑器。在本节，我们将从应用程序中移除\
  \ `PersonEditor` 模块，并使用属性编辑器对业务对象进行更改。在[第 9 章]中，我们将向你如何使用编辑器实现“打开”或“编辑”操作。\n\nNetBeans\
  \ 应用程序包含一个属性窗口，你可以通过主菜单的 `Window | IDE Tools | Properties` 打开它。由于该窗口挂钩到全局选择（Global\
  \ Selection），每当你在性别窗口中选择不同的节点时，每个选择都会出现在属性窗口中。属性窗口显示节点（使用其显示名称）及其工具提示（如果存在）。属性窗口还在默认的属性表编辑器中显示节点的属性。如[图\
  \ 7.9] 所示，当你在性别窗口中选择不同的节点时，没有属性需要显示。![](img/image4227.jpg)\n图 7.9 属性窗口\n\n当 `PersonNode`\
  \ 继承 `BeanNode` 而不是 `AbstractNode` 时，人的属性会出现在属性窗口中。此外，所有可写属性都可以在 `BeanNode` 的默认属性表中进行修改。让我们移除\
  \ `PersonEditor` 模块（模块不是很好吗？）并使用属性窗口来更新人员对象。我们将在程序启动时打开属性窗口，并将性别窗口移动到空出的编辑器位置。这些更改非常直观：\n\
  \n1. 从 `FamilyTreeApp` 应用程序中移除 `PersonEditor` 模块。选择 Modules 节点，右键点击，并从右键菜单中选择 Remove（移除）。\n\
  2. 在 `GenderTopComponent.java` 中，将 `@TopComponent.Registration` 注解的窗口位置（模式）更改为“editor”（移除\
  \ `PersonEditor` 模块空空了编辑器位置，因此我们将 `GenderTopComponent` 放入这个中心位置）。\n3. 添加在启动时打开属性窗口的代码。\n\
  \n这些更改在[列表 7.11]中所示。\n\n### 列表 7.11 GenderTopComponent 更改\n\n```java\n@TopComponent.Registration(mode\
  \ = \"editor\", openAtStartup = true)\n\n. . . 省略未更改的代码 . . .\n\npublic final class\
  \ GenderTopComponent extends TopComponent\n        implements ExplorerManager.Provider\
  \ {\n    private final ExplorerManager em = new ExplorerManager();\n    public GenderTopComponent()\
  \ {\n        initComponents();\n        setName(Bundle.CTL_GenderTopComponent());\n\
  \        setToolTipText(Bundle.HINT_GenderTopComponent());\n        BeanTreeView\
  \ view = new BeanTreeView();\n        add(view, BorderLayout.CENTER);\n        associateLookup(ExplorerUtils.createLookup(em,\
  \ this.getActionMap()));\n        em.setRootContext(new RootNode());\n        //\
  \ 展开第二层节点\n        for (Node node : em.getRootContext().getChildren().getNodes())\
  \ {\n            view.expandNode(node);\n        }\n        // 默认打开属性窗口\n      \
  \  TopComponent tc = WindowManager.getDefault()\n                              \
  \ .findTopComponent(\"properties\");\n        if (tc != null) {\n            tc.open();\n\
  \        }\n    }\n. . .\n```\n\n[列表 7.12] 显示了修改后的 `PersonNode`。注意，我们将 `Person`\
  \ 对象传递给 `BeanNode` 构造函数，并为 `PersonNode` 构造函数添加 `throws` 子句。`BeanNode` 使用内省机制确定对象的属性，并自动为你对象中的每个属性生成属性支持。我们还修改了\
  \ `PersonNode` 属性监听器，以便在用户使用属性窗口更新人员时更新 `FamilyTreeManager`。`ChildFactory` 的事件处理器将像以前一样更新节点。\n\
  \n### 列表 7.12 PersonNode 继承 BeanNode\n\n```java\n@NbBundle({\n    \"INT_PersonNode=Person\"\
  \n})\npublic class PersonNode extends BeanNode<Person>\n        implements PropertyChangeListener\
  \ {\n    public PersonNode(Person person) throws IntrospectionException {\n    \
  \    super(person, Children.LEAF, Lookups.singleton(person));\n        setIconWithExtension(\"\
  com/each/tree/genderview/resources/person.png\");\n        setName(String.valueOf(person.getId()));\n\
  \        setDisplayName(person.toString());\n        setShortDescription(Bundle.INT_PersonNode());\n\
  \    }\n    . . . 省略未更改的代码 . . .\n    private final PropertyChangeListener propListener\
  \ = (ChangeEvent evt) -> {\n        Person person = (Person) evt.getSource();\n\
  \        FamilyTreeManager ftm = Lookup.getDefault().lookup(FamilyTreeManager.class);\n\
  \        if (ftm == null) {\n            logger.log(Level.SEVERE, \"Cannot get FamilyTreeManager\"\
  );\n            LifecycleManager.getDefault().exit();\n        } else {\n      \
  \      ftm.updatePerson(person);\n            fireDisplayNameChange(null, getDisplayName());\n\
  \        }\n    };\n}\n```\n\n继承 `BeanNode` 也会影响 `ChildFactory` 代码。[列表 7.13] 显示了修改后的\
  \ `PersonChildFactory` 类。由于构造函数中有 `throws` 子句，`createNodeForKey()` 方法现在必须将 `PersonNode`\
  \ 的实例化放在 `try/catch` 块中。\n\n### 列表 7.13 使用 BeanNode 的 ChildFactory\n\n```java\n\
  public class PersonChildFactory extends ChildFactory<Person> {\n    . . . 省略未更改的代码\
  \ . . .\n    @Override\n    protected Node createNodeForKey(Person key) {\n    \
  \    logger.log(Level.FINER, \"createNodeForKey: {0}\", key);\n        PersonNode\
  \ node = null;\n        try {\n            node = new PersonNode(key);\n       \
  \     key.addPropertyChangeListener(WeakListeners.propertyChange(node, key));\n\
  \        } catch (IntrospectionException ex) {\n            logger.log(Level.WARNING,\
  \ \"IntrospectionException: {0}\", ex);\n        }\n        return node;\n    }\n\
  }\n```\n\n\n\n\n\n图 7.10 显示了使用 `BeanNode<Person>` 作为 `PersonNode` 超类的 `FamilyTreeApp`\
  \ ，以及它对属性（Properties）窗口的影响。由于属性更改监听器，在属性窗口中进行的更新会被写入 `FamilyTreeManager`，并反映在左窗口的\
  \ `Gender` 节点层级中。![](img/image4261.jpg)图 7.10 使用 BeanNode 的默认属性窗口\n\nBeanNode 提示\n\
  当你想要尝试节点的属性支持时，`BeanNode` 是一个很好的选择，因为它会自动提供属性支持。然而，`BeanNode` 具有一些开销，因为它在你创建的每个节点上都会使用反射来构建属性支持。另一种方法是构建自己的属性支持，这将让你拥有更多控制权。\n\
  \n### 创建你自己的属性表\n\n现在，你可以编辑选中的 `Person` 并对封装的 `Person` 对象进行更改。然而，使用 `BeanNode` 的标准属性窗口并不特别友好。属性按字母顺序出现，而不是根据用途进行分组。当你想要对属性窗口的呈现进行更多控制时，可以创建你自己的属性表。\n\
  \n#### 什么是属性表？\n\n属性表持有（你选择的）节点封装对象的属性。你将属性放入属性集（Sets）。此外，你可以指定一个或多个集合显示在不同的标签页下。你还可以将某些属性指定为只读。\n\
  \n图 7.11 显示了运行中的 `FamilyTreeApp`。在左窗口中，你可以看到按性别排列的节点层级。在右窗口中，你可以看到一个可编辑的属性窗口。出现了两个属性集。第一个位于标题\
  \ `Names` 下，包含 `Person` 属性 `firstname`、`middlename`、`lastname` 和 `suffix`。第二个集合位于标题\
  \ `Additional Information` 下，包含 `gender` 和 `notes` 属性![](img/image4276.jpg)图 7.11\
  \ 使用自定义属性表\n\n第二个标签（`Id Info`）包含第三个属性集，其中包含只读的 `id` 属性。这种安排相比默认的 `BeanNode` 展示了巨大的改进。\n\
  \n要为节点的封装对象创建自定义属性表，请重写 `createSheet()` 方法并返回一个 `Sheet` 对象。在此方法内部，创建一个 `Sheet` 并将对象的属性划分为\
  \ `Sets`。创建这些集合，为它们配置显示名称，并将它们添加到 `Sheet` 中。最后，为你想要包含在集合中的每个属性创建 `PropertySupport`\
  \ 对象，并将支持对象添加到相应的集合中。列表 7.14 显示了我们如何构建在 图 7.11 中显示的属性表。注意，使用自定义属性表时，`PersonNode`\
  \ 自 `AbstractNode` 而不是 `BeanNode`。列表 7.14 创建属性表\n\n点击此处查看代码图像\n\n```java\npublic\
  \ class PersonNode extends AbstractNode implements PropertyChangeListener {\n\n\
  \    private static final Logger logger = Logger.getLogger(\n                  \
  \      PersonNode.class.getName());\n\n    public PersonNode(Person person) {\n\
  \        super(Children.LEAF, Lookups.singleton(person));\n        setIconBaseWithExtension(\n\
  \            \"com/asgteach/familytree/genderviewer/resources/personIcon.png\");\n\
  \        setName(String.valueOf(person.getId()));\n        setDisplayName(person.toString());\n\
  \        setShortDescription(Bundle.HINT_PersonNode());\n    }\n\n    . . . unchanged\
  \ code omitted . . .\n\n    @Override\n    protected Sheet createSheet() {\n   \
  \     Sheet sheet = Sheet.createDefault();\n        Person person = getLookup().lookup(Person.class);\n\
  \        // 为名字创建一个属性集（名、中间名、姓、后缀）\n        Sheet.Set setNames = Sheet.createPropertiesSet();\n\
  \        setNames.setDisplayName(\"Names\");\n        // 为只读 id 创建属性集\n        Sheet.Set\
  \ readOnlySet = new Sheet.Set();\n        readOnlySet.setDisplayName(\"Identification\"\
  );\n        // 将其放在单独的标签页下\n        readOnlySet.setValue(\"tabName\", \" Id Info\
  \ \"); // 为性别和备注创建一个属性集\n        Sheet.Set infoSet = new Sheet.Set();\n        infoSet.setName(\"\
  Additional Information\"); sheet.put(setNames);\n        sheet.put(infoSet);\n \
  \       sheet.put(readOnlySet); \n        try {\n            // 属性支持\n         \
  \   Property<String> firstnameProp = new PropertySupport\n                .Reflection(person,\
  \ String.class, \"firstname\");\n            Property<String> middlenameProp = new\
  \ PropertySupport\n                .Reflection(person, String.class, \"middlename\"\
  );\n            Property<String> lastnameProp = new PropertySupport\n          \
