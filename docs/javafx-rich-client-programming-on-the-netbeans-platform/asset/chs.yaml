  \n\n\n# 其他图表的特殊行为\n\n除了饼图添加的动画和编辑功能外，我们还为`气泡图`（选中的气泡使用 `ScaleTransition` 旋转）和`柱状图`（选中的柱体会淡入显示柱体幅值的标签）添加了行为。由于我们在访问图表节点和基于鼠标点击事件构建过渡动画时使用了相同的技术，我们让读者自行查阅书籍下载包中的相关代码。\n\
  \n## 15.5 保存图表\n\nSDA 应用还包含了将任何 JavaFX 图表窗口保存为 PNG 文件的功能。此功能使用了 NetBeans Platform\
  \ 的条件启用操作（action）以及在集成 JavaFX 时讨论的通信策略（参见第 261 页的“[通信策略]”）。\n\n图 15.18 显示了工具栏上的“保存图表”图标以及顶级“文件”菜单下的“保存图表”菜单项。当任何\
  \ JavaFX 图表窗口获得焦点时，这些图标和菜单项会被启用。保存的图对应于具有焦点的特定窗口。选择非 JavaFX 图表窗口（例如`TableDataEditor`窗口）将禁用“保存图表”菜单选项。\n\
  \n![](img/image9735.jpg)\n图 15.18 保存图表\n\n选择“保存图表”图标或菜单项将显示一个文件选择器对话框，其中包含要保存的图表窗口名称。例如![图\
  \ 15.19](img/#part0022.xhtml_qMBfnXb5SheAX34J3qw_Uw19095) 显示了`LineChart`窗口的文件选择器。文件选择器允许用户选择目标\
  \ PNG 文件的所在文件夹和文件名，以便将其保存到磁盘。\n\n![](img/image9740.jpg)\n图 15.19 调用 FileChooser\
  \ 窗口\n\n以下是实现“保存图表”功能的步骤摘要：\n\n- 创建一个名为 `ChartUtilities` 的模块，包名为 `org.smartphone.chart.utilities`。将其包设为公有，以便其他模块可以对该模块设置依赖。\n\
  - 创建 `ChartSaveCapability`并将此接口添加到 `ChartUtilities` 公有包中。\n- 创建条件启用操作 `ChartSaveAction`，并为它的\
  \ `Cookie` 类指定 `ChartSaveCapability`。\n- 使用上下文 `ChartSaveCapability` 实现 `ChartSaveAction`。\n\
  - 在每个带有 JavaFX 图表的模块中，向 `TopComponent` 的 `Lookup` 添加 `ChartSaveCapability` 的实现。调用\
  \ JavaFX 控制器方法 `getImage()` 获取 JavaFX 场景图的 `BufferedImage`。在 Swing `TopComponent`\
  \ 和 JavaFX 控制器之间使用适当的通信策略。\n\n`ChartSaveCapability`列表 15.27 显示了 `ChartUtilities`\
  \ 公有包中的 `ChartSaveCapability` 接口。\n列表 15.27 `ChartSaveCapability.java`\n点击此处查看代码图像\n\
  \n```java\npackage org.smartphone.chart.utilities;\n\nimport java.awt.image.BufferedImage;\n\
  \npublic interface ChartSaveCapability {\n    public String getChartName();\n  \
  \  public BufferedImage getImage();\n}\n```\n\n### ChartSaveAction\n\n在模块 `ChartUtilities`\
  \ 中，添加一个名为 `ChartSaveAction` 的新条件启用操作。使用 `ChartSaveCapability` 作为操作的 `Cookie` 类（关于上下文感知操作的讨论，请参见第\
  \ 428 页的“[上下文感知操作]”）。按照如列表 15.28 所示实现 `actionPerformed()` 方法。\n\n`ChartSaveAction`\
  \ 类包含注解，用于在工具栏和顶级菜单系统中配置该操作。`ChartSaveAction` 构造函数将 `ChartSaveCapability` 定义为其上下文。该上下文通过选中的\
  \ `TopComponent` 通过“全局选择查找”（Global Selection Lookup）提供。\n\n要保存 PNG 文件，`actionPerformed()`\
  \ 方法调用上下文 `getChartName()` 方法获取图表名称，调用 `getImage()` 方法获取 `BufferedImage`。`FileChooserBuilder`（接下来将讨论）提供了一个允许用户选择文件的弹出对话框。保存图表操作会在文件不存在时创建该文件，并在文件已存在时提示是否可以重写。`DialogDisplayer`\
  \ 和 `NotifyDescriptor` 都配置了这些额外的弹出对话框（详细信息请参阅第 11 章 使用 `Dialogs` API 说明）。\n\n列表\
  \ 15.28 `ChartSaveAction.java`\n点击此处查看代码图像\n\n```java\n@ActionID(\n    category\
  \ = \"File\",\n    id = \"org.smartphone.chart.utilities.ChartSaveAction\"\n)\n\
  @ActionRegistration(\n    iconBase = \"org/smartphone/chart/utilities/saveChartIcon.png\"\
  ,\n    displayName = \"#CTL_SaveAction\"\n)\n@ActionReferences({\n    @ActionReference(path\
  \ = \"File\", position = 130),\n    @ActionReference(path = \"Toolbars\", position\
  \ = 20)\n})\n@Messages({\n    \"CTL_SaveAction=Save Chart\",\n    \"{0} - window\"\
  ,\n    \"MSG_SaveFailed=Could not write to file {0}\",\n    \"{0} - filename\",\n\
  \    \"MSG_Overwrite=File {0} exists. Overwrite?\"\n})\nfinal class ChartSaveAction\
  \ implements ActionListener {\n    private final ChartSaveCapability context;\n\
  \    private static final Logger logger = Logger.getLogger(ChartSaveAction.class.getName());\n\
  \n    public ChartSaveAction(ChartSaveCapability context) {\n        this.context\
  \ = context;\n    }\n\n    @Override\n    public void actionPerformed(ActionEvent\
  \ ev) {\n        // 使用 FileChooser 获取用户提供的文件\n        String title = \"Save \" +\
  \ context.getChartName() + \" to File\";\n        File f = new FileChooserBuilder(ChartSaveAction.class).setTitle(title).showSaveDialog();\n\
  \        if (f != null) {\n            if (!f.getAbsolutePath().endsWith(\".png\"\
  )) {\n                f = new File(f.getAbsolutePath() + \".png\");\n          \
  \  }\n            try {\n                if (!f.exists()) {\n                  \
  \  // 文件不存在；创建它\n                    if (!f.createNewFile()) {\n               \
  \         DialogDisplayer.getDefault().notify(\n                            new\
  \ NotifyDescriptor.Message(\n                                Bundle.MSG_SaveFailed(f.getName())));\n\
  \                        );\n                        return;\n                 \
  \   }\n                } else {\n                    // 文件已存在；询问是否可以重写\n       \
  \             Object choose = DialogDisplayer.getDefault().notify(\n           \
  \             new NotifyDescriptor.Confirmation(\n                            Bundle.MSG_Overwrite(f.getName()))\n\
  \                    );\n                    if (NotifyDescriptor.CANCEL_OPTION.equals(choose))\
  \ {\n                        return;\n                    }\n                }\n\
  \                // 需要 AbsoluteFile()，否则在 Windows 上可能会不同\n                BufferedImage\
  \ image = context.getImage();\n                if (image != null) {\n          \
  \          ImageIO.write(image, \"png\", f.getAbsoluteFile());\n               \
  \     logger.log(Level.INFO, \"Image saved to file {0}\", f.getName());\n      \
  \          } else {\n                    logger.log(Level.WARNING, \"Could not get\
  \ Image from {0}\", context.getChartName());\n                }\n            } catch\
  \ (IOException ioe) {\n                ioe.printStackTrace();\n            }\n \
  \       }\n    }\n}\n```\n\n\n\n\n# FileChooserBuilder\n\n`FileChooserBuilder` 是文件系统\
  \ API 中的一个工具类，用于与 `JFileChooser` 配合使用。一个方便的功能是能够记住给定文件最后使用的目录。你向构造函数传递一个字符串键或一个类类型（在这里我们使用\
  \ `ChartSaveAction` 类类型）。该键用于从之前任何具有相同键的调用中查找最近使用的目录。\n\n`FileChooserBuilder` 使用“构建器”（Builder）模式结构化（例如\
  \ `StringBuilder`），因此可以通过链式调用来简化文件选择器的设置。我们使用 `setTitle()` 方法（为对话框提供标题），并使用 `showSaveDialog()`\
  \ 来完成配置，该方法将用户选择的文件作为 `File` 对象的返回。其他显示对话框的方法包括 `showOpenDialog()`（它也返回 `File`）和\
  \ `showMultiOpenDialog()`（后者返回一个 `File[]` 数组并允许用户选择多个文件）。如果用户点击了取消或在未选择 OK 的情况下关闭了对话框，则任何显示对话框方法的返回值都为\
  \ `null`。\n\n# BufferedImage\n\n`BufferedImage` 是 AWT `Image` 类的子类，而 `ImageIO` 是一个包含静态便利方法的类，用于编码和解码图像数据。以下语句将\
  \ `BufferedImage`（JavaFX 场景图的编码）写入到 PNG 格式的文件中。\n\n```java\nBufferedImage image\
  \ = context.getImage();\n\n. . .\n\nImageIO.write(image, \"png\", f.getAbsoluteFile());\n\
  ```\n\n# 实现 ChartSaveCapability\n\n每个带有 JavaFX 图表 `TopComponent` 的模块都对 `ChartUtilities`\
  \ 模块设置了依赖，并实现了 `ChartSaveCapability`。列表 15.29 显示了我们如何为 `LineChartTopComponent` 这样做。其他\
  \ JavaFX 图表模块也相同的方式实现 `ChartSaveCapability`。\n\n首先，我们使用 `InstanceContent` 和 `AbstractLookup`\
  \ 将对象添加到 `TopComponent` 的 `Lookup` 中。当 `TopComponent` 焦点时，这些对象会被暴露给全局选择查找（Global\
  \ Selection Lookup）。然后，我们将 `ChartSaveCapability` 的实现添加到 `TopComponent` 的 `Lookup`\
  \ 中。\n\n`ChartSaveCapability` 的实现需要重写两个方法。`getChartName()` 方法返回“LineChart”。`getImage()`\
  \ 方法调用 JavaFX 控制器的 `getImage()` 方法。在这里，我们必须使用倒计时器（countdown latch）等待 `getImage()`\
  \ 方法执行完成，因为 `TopComponent` 在 JavaFX 线程上调用了此方法。当方法执行完毕后，我们将 `BufferedImage` 对象返回给调用者。\n\
  \n## 列表 15.29 LineChartTopComponent.java—实现 ChartSaveCapability\n\n```java\npublic\
  \ final class LineChartTopComponent extends TopComponent {\n\n    private static\
  \ JFXPanel chartFxPanel;\n\n    private LineChartController controller;\n\n    private\
  \ BufferedImage image = null;\n\n    private final InstanceContent content = new\
  \ InstanceContent();\n\n    public LineChartTopComponent() {\n        initComponents();\n\
  \        setName(Bundle.CTL_LineChartTopComponent());\n        setToolTipText(Bundle.HINT_LineChartTopComponent());\n\
  \        // 将我们的查找与系统的其他部分关联，以便\n        // 保存图表动作访问图像\n        associateLookup(new\
  \ AbstractLookup(content));\n        setLayout(new BorderLayout());\n        //\
  \ 为 TopComponent 打印动作：\n        putClientProperty(\"print.printable\", true);\n\
  \        init();\n        content.add(new ChartSaveCapabilityImpl());\n    }\n\n\
  \    . . .\n\n    private class ChartSaveCapabilityImpl implements ChartSaveCapability\
  \ {\n\n        @Override\n        public String getChartName() {\n            return\
  \ Bundle.CTL_LineChartAction();\n        }\n\n        @Override\n        public\
  \ BufferedImage getImage() {\n            if (controller == null) {\n          \
  \      return null;\n            }\n            final CountDownLatch latch = new\
  \ CountDownLatch(1);\n            Platform.runLater(() -> {\n                //\
  \ 从控制器获取 JavaFX 图像\n                // 必须在 JavaFX 线程中执行\n                try {\n\
  \                    image = controller.getImage();\n                } finally {\n\
  \                    latch.countDown();\n                }\n            });\n  \
  \          try {\n                latch.await();\n                return image;\n\
  \            } catch (InterruptedException ex) {\n                Exceptions.printStackTrace(ex);\n\
  \                return null;\n            }\n        }\n    }\n}\n```\n\n\n\n\n\
  \n# 15.6 要点总结\n\n本章探讨了 JavaFX Charts API，它让你允许你在 NetBeans Platform 应用程序中对数据进行可视化。本章展示了如何在模块化系统的语文中使用所有\
  \ JavaFX 图表。以下是本章的要点：\n\n*   NetBeans Platform 非常适合带有 JavaFX 图表的数据的可视化应用。NetBeans\
  \ Platform 的模块化架构结合 JavaFX 图表的灵活性，创建了极具吸引力的图表类应用程序。\n*   SmartPhone Data 应用展示了智能手机公司过去四年的销售数据，并使用\
  \ JavaFX 图表将这些数据可视化。每个图表都在一个独立的模块中进行配置。该应用程序将 JavaFX 图表与 Swing `JTable` 展示集成在一起。\n\
  *   SmartPhone Data 应用使用 `Global Lookup`（全局查找）来访问图表数据。这为获取替代数据源提供了灵活性。\n*   应用程序扩展了\
  \ `Swing AbstractTableModel`，以提供适用于 JavaFX 图表的额外方法。\n*   每个图表模块包含一个用于显示的 `TopComponent`、一个用于\
  \ JavaFX 控件的 `FXML` 文件以及一个 JavaFX 控制器类。\n*   图表模块使用了第 6 章中讨论的通信策略，以确保 Swing EDT\
  \ 和 JavaFX 应用程序线程得到适当的管理。\n*   JavaFX 控制器类负责构建图表内容、图例和标题。\n*   JavaFX 控制器类通过场景图的根节点\
  \ `snapshot()` 方法提供图表窗口的快照。该方法返回一个 `JavaFX Image` 对象。然后使用静态方法 `SwingFXUtils.fromFXImage()`\
  \ 将 `JavaFX Image` 转换为 `BufferedImage`。\n*   JavaFX 控制器类实现了 `TableModelListener`，用于响应所显示数据的更改。默认情况下，JavaFX\
  \ 图表通过动画更新其渲染的图表显示。\n*   `JavaFX Chart` 类层次结构包含一个抽象的 `Chart` 父类、一个用于所有双轴图表的抽象 `XYChart`\
  \ 类，以及一个 `PieChart` 类。`XYCharts` 包含了 `BarChart`、`AreaChart`、`LineChart`、`ScatterChart`、`StackedBarChart`、`StackedAreaChart`\
  \ 和 `BubbleChart`。\n*   所有 `XYCharts` 都包含一个 `X Axis` 和一个 `Y Axis`，它们可以是 `NumberAxis`（数值）或\
  \ `CategoryAxis`（字符串）。`BubbleCharts` 要求两个轴都是 `NumberAxis` 类型。\n*   `XYCharts` 的数据类型是\
  \ `Series` 的 `ObservableList`。每个 `Series` 而言又是数据项的 `ObservableList`。数据项是一个 `XYChart.Data<X,\
  \ Y>` 泛型类型，其中 `X` 对应 X 轴类型（数字或字符串），`Y` 对应 Y 轴类型（数字或字符串）。\n*   `BubbleChart` 使用数据项的\
  \ `extraValue` 属性来设置渲染气泡的半径。\n*   图表的显示部分部分是 JavaFX 节点。你可以向这些节点添加效果、动画和事件处理程序。\n\
  *   图表使用 CSS 进行样式设置，你可以提供自己的特定于图表的样式类。\n*   `LineChart`、`ScatterChart`、`AreaChart`、`BarChart`、`StackedBarChart`\
  \ 和 `StackedAreaChart` 的配置方式均相同。\n*   通过切换 X 轴和 Y 轴的类型，可以将垂直的 `BarChart` 转换为水平的\
  \ `BarChart`。\n*   `PieChart` 的数据是 `PieChart.Data` 项的 `ObservableList`。每个数据项代表整体的一部分，并包含一个\
  \ `name` StringProperty 和一个 `pieValue` DoubleProperty。\n*   SmartPhone Data 应用允许用户在\
  \ `PieChart` 窗口中使用 JavaFX `ComboBox` 控件选择年份。选中的年份对应于 `TableModel` 中的一列。\n*   SmartPhone\
  \ Data 应用包含了为饼图扇形添加的动画效果，以及一个用于更改所选饼图扇形数值的就地编辑器。\n*   每个图表窗口都实现了一个 `ChartSaveCapability`\
  \ 并将其安装在 `TopComponent Lookup` 中。这使得当其中一个图表窗口获得焦点时，可以启用“保存图表”菜单项。“保存图表”功能可以将所选的图表窗口保存为\
  \ `PNG` 文件。\n\n# 16. 使用 Web 服务\n\nRESTful Web 服务是一种常用技术，允许远程客户端与服务进行交互。在本章中，我们将向你展示创建和测试\
  \ RESTful Web 步骤，以及如何在 NetBeans Platform 应用程序中构建 RESTful Web 服务客户端。由于 Web 服务应该在后台线程中访问，我们将展示你如何构建几个\
  \ `JavaFX Service` 对象来处理多线程。\n\n我们将使用 JavaFX `TableView` 控件构建集成 JavaFX 的内容，并再次查看\
  \ JavaFX `LineChart`。我们还将向你展示如何向 JPA 实体类添加 JavaFX 属性。\n\n## 你将学到\n\n*   从数据库创建 RESTful\
  \ Web 服务。\n*   向 JPA 实体类添加 JavaFX 属性。\n*   创建一个用于测试的 Java 应用程序 RESTful Web 服务客户端。\n\
  *   在 NetBeans Platform 模块中配置 `Jersey` 客户端。\n*   使用 `JavaFX Service` 类来处理可重用的后台任务。\n\
  *   创建作为 Web 服务客户端的 JavaFX 集成模块。\n\n## 16.1 RESTful Web 服务与 NetBeans Platform\n\n\
