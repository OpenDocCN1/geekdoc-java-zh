  \        Platform.setImplicitExit(false);\n        Platform.runLater(() -> createScene());\n\
  \    }\n    private void createScene() {\n        try {\n            Parent root\
  \ = FXMLLoader.load(getClass().getResource(\n                                \"\
  MyRectangleFX.fxml\"));\n            Scene scene = new Scene(root, Color.LIGHTBLUE);\n\
  \            fxPanel.setScene(scene);\n        } catch (IOException ex) {\n    \
  \        Exceptions.printStackTrace(ex);\n        }\n    }\n. . . unchanged code\
  \ omitted . . .\n}\n```\n\n在 NetBeans Platform 的 `TopComponent` 中创建 JavaFX 内容需要如列表\
  \ 6.3 所示的几个操作，此处有进一步描述：\n\n* 创建一个 Swing `BorderLayout` 组件并将其添加到 `TopComponent` 的布局中。`BorderLayout`\
  \ 将保持调整大小的行为，与顶层 JavaFX `Stage`（窗口框）一致。\n\n### 添加 JavaFX 内容的提示\n如果你忘记了 `setLayout(new\
  \ BorderLayout())` 语句，你将无法在 NetBeans Platform 窗口中看到任何 JavaFX 内容。\n\n* 实例化 `JFXPanel`\
  \ 组件并通过 `Border.CENTER` 将其添加到 `TopComponent` 的布局中。这可以保持 JavaFX 内容在窗口中居中。\n* 当第一个\
  \ `JFXPanel` 对象被创建时，它会隐式地初始化 JavaFX 运行时（JavaFX 应用程序线程）。当最后一个 `JFXPanel` 被销毁时，JavaFX\
  \ 运行时将退出。通过 `Platform.setExplicitExit(false)`，在最后一个 JavaFX 内容窗口关闭后，JavaFX 应用程序线程不会退出。\n\
  * 将创建 JavaFX 内容的代码封装在 `runnable` 中（或使用 lambda 表达式），并使用 `Platform.runLater()` 调用它。`TopComponent`\
  \ 代码执行在 Swing EDT 上，而创建和操作场景图的 JavaFX 代码必须在 JavaFX 应用程序线程上执行 1。\n* 如第 3 章所述，JDK\
  \ 8 提供了实验性支持，可以将 EDT 和 JavaFX 应用程序线程 (FXT) 变为同一个线程。目前这并不是默认设置。要运行单 EDT-FXT ，请提供\
  \ VM 选项 `-Djavafx.embed.singleThread=true`。由于此功能是实验性的，我们将向你展示如何在不同的线程中使用 JavaFX\
  \ 和 Swing。\n* `createScene()` 中的代码类似于 JavaFX 应用程序 `start()` 方法中的代码（例如，如列表 3.2 所示）。\n\
  * 在这两个方法中，你都调用 `FXLoader` 来加载场景并创建且设置场景的根节点。`start()` 方法设置 `Stage` 的场景，而 `createScene()`\
  \ 则设置 `JFXPanel` 组件中的场景。通过这些修改，`FXDemoApp` 已准备好运行。请注意，在矩形内点击鼠标触发的动画效果与纯 JavaFX 应用程序完全相同。另注意，除了更改包名外，我们对\
  \ FXML 或控制器类均未进行任何修改！\n\n### JFXPanel 的魔力\n`JFXPanel` 组件是一个 Swing `Component`，专门用于将\
  \ JavaFX 内容嵌入到 Swing 应用程序中。`JFXPanel` 会在你为你启动 JavaFX 运行时。它还透明地将所有输入（鼠标、键盘）和焦点事件转发给\
  \ JavaFX 运行时。这种对用户输入的透明处理允许 `FXDemoApp` 应用程序以较于迁移的 JavaFX 程序最少的改动运行。\n\nJFXPanel\
  \ 组件允许 Swing 和 JavaFX 并运行。因此，你必须关注从 Swing 中操作 Swing 组件的代码。在 JavaFX 环境下操作 Swing 组件，需要将代码封装在\
  \ `runnable` 中并使用 `SwingUtilities.invokeLater()`（lambda 表达式有助于此处）。\n\n```java\n\
  SwingUtilities.invokeLater(() -> {\n    // Swing UI\n});\n```\n\n相反，要从 Swing 中操作\
  \ JavaFX UI，需要将代码封装在 `runnable` 并调用 `Platform.runLater()`。\n\n```java\nPlatform.runLater(()\
  \ -> {\n    // JavaFX UI\n});\n```\n\n然而，通信需求可能更加复杂。在下一节中，我们将从架构角度研究 Swing 和 JavaFX\
  \ 之间的通信。\n\n### SwingNode\n`SwingNode` 是 `JFXPanel` 的对应物，允许将 Swing 内容安装到 JavaFX\
  \ 场景中。使用 `SwingNode` 时你需要注意 EDT/JavaFX 线程问题。由于 `SwingNode` 是 JavaFX 的一部分，你可以像操作其他\
  \ JavaFX 节点一样实例化并操作它。但在安装 Swing 内容时必须在 EDT 上执行。\n\n让我们展示如何在演示应用程序 `FXDemoApp` 中配合\
  \ Swing `JButton` 组件使用 `SwingNode`。列表 6.4 显示了带有 `SwingNode` 的修改后的 FXML 文件。我们设置 `fx:id`\
  \ 属性以便在类中访问 `SwingNode`，`translateY` 属性将 `SwingNode` 放置在文本上方。列表 6.4 `MyRectangleFX.fxml`——添加\
  \ SwingNode 点击此处查看代码图像\n\n```xml\n<StackPane id=\"StackPane\" fx:id=\"stackpane\"\
  \n           xmlns:fx=\"http://javafx.com/fxml\"\n           fx:controller=\"com.asgteach.fxdemomodule.MyRectangleFXController\"\
  >\n    <stylesheets>\n        <URL value=\"@MyCSS.css\" />\n    </stylesheets>\n\
  \    <children>\n        . . . unchanged code omitted . . .\n        <SwingNode\
  \ fx:id=\"swingNode\" translateY=\"-30\"  />\n    </children>\n</StackPane>\n```\n\
  \n列表 6.5 向你展示如何通过 `SwingUtilities.invokeLater()` 将 Swing 内容安装到 `SwingNode` 中。我们为\
  \ `clickButton` `JButton` 组件添加了 Swing `ActionListener`。事件处理程序在 EDT 上调用。然而，由于我们在处理程序中操作了\
  \ JavaFX 场景，随后必须使用 `Platform.runLater()`。列表 6.5 `MyRectangleFXController.java`——使用\
  \ SwingNode 点击此处查看代码图像\n\n```java\npublic class MyRectangleFXController implements\
  \ Initializable {\n    @FXML\n    private Rectangle rectangle;\n    @FXML\n    private\
  \ StackPane stackpane;\n    @FXML\n    private SwingNode swingNode;\n}\n```\n\n\n\
  \n\n```java\n    private RotateTransition rt;\n\n    private JButton clickButton;\n\
  \n    @Override\n    public void initialize(URL url, ResourceBundle rb) {\n    \
  \    . . . unchanged code omitted\n        createAndSetSwingContent(swingNode);\n\
  \    }\n\n    private void createAndSetSwingContent(final SwingNode swingNode) {\n\
  \        SwingUtilities.invokeLater(() -> {\n            swingNode.setContent(clickButton\
  \ = new JButton(\"Click me!\"));\n            clickButton.addActionListener((ActionEvent\
  \ e) -> {\n                Platform.runLater(() -> rt.play());\n            });\n\
  \        });\n    }\n}\n```\n\n图 6.12 显示了旋转的 `Rectangle`、`Text` 和 `SwingNode`，它们在用户点击\
  \ `Swing` `JButton` 时被激活。22。`SwingNode` 是向 JavaFX 场景图添加自定义 `Swing` 组件的极佳方法。然而，我们建议将\
  \ JavaFX 和 `Swing` 尽可能保持隔离。请参见本页上的“通信策略”章节进行讨论。!![](img/image3634.jpg)图 6.12 在 JavaFX\
  \ 场景图中使用 `SwingNode`\n\n## 6.2 通信策略\n\n根据你的 NetBeans Platform 应用程序的不同，`TopComponent`（它紧密集成到\
  \ NetBeans Platform 框架和窗口系统中）与 JavaFX 场景图及控制器代码之间的通信会有各种要求。最简单的应用程序在 `TopComponent`\
  \ 和 `JavaFX` 代码之间不需要任何通信。在这种情况下，`JFXPanel` 会透明地将所有输入和焦点事件转发到场景图。带有 JavaFX 内容的 NetBeans\
  \ Platform 窗口表现类似于一个独立的 JavaFX 程序。`FXDemoApp` 程序及其 `FXDemoTopComponent` 就是这种情况。正如第\
  \ 258 页上的列表 6.3 所示，`TopComponent` 调用 `FXML Loader` 并构建场景图，然后像一个发条玩具一样，让 JavaFX 代码直接“运行”。\n\
  \n然而，为了利用 NetBeans Platform API，你需要更灵活的结构。`TopComponent` 对场景图的任何操作都应该是受控、刻意的且文档良好的。JavaFX\
  \ 控制器类中的公共方法（由你编写）提供了这种访问。因此，`TopComponent` 需要访问控制器的实例。\n\n同样，为了保持隔离性，控制器类不应调用其\
  \ `TopComponent` 类中的任何方法。相反，来自 JavaFX 环境的任何通信都通过 JavaFX 控制器生成的属性变化事件（property change\
  \ events）来实现。正如我们在第 2 章中所看到的（参见第 59 页的“事件处理器与松散耦合”），事件处理器提供了一种通信状态变化和维护松散耦合的强大机制。我们希望\
  \ JavaFX 代码尽可能地独立于其 `TopComponent`。\n\n因此，核心目标是让 JavaFX 场景图及其控制器应该是封装的，如图 6.13 所示。`TopComponent`\
  \ 直接与 NetBeans Platform 框架通信并由 NetBeans Platform 窗口系统管理。`TopComponent` 调用 `FXML\
  \ Loader` 并构建场景图。`FXML Loader` 实例化控制器类。对场景图的任何进一步操作都通过控制器的公共方法进行。![](img/image3644.jpg)图\
  \ 6.13 TopComponent 中的 JavaFX 通信图\n\n我们可以对带有 JavaFX 内容的 `TopComponent` 及其通信需求进行如下表征：\n\
  \n-   **自包含事件**——发生在 JavaFX 场景图中的所有事件都是自包含的，不需要与 `TopComponent` 通信。例如，在 `FXDemoApp`\
  \ 中，用户产生鼠标点击事件，触发旋转过渡。由于处理器在控制器类中，因此不需要进一步的通信。\n-   **单向**——`TopComponent` 必须发起场景图的变化（可能是由于用户选择了某个项目）。任何影响场景图的操作必须在\
  \ JavaFX 线程上发生。因此，`TopComponent` 必须调用 `Platform()`\n-   **双向通信**——除了由 `TopComponent`\
  \ 操作场景图外，JavaFX 环境还将状态传回给 `TopComponent`。在这种情况下，发送给监听器的 `PropertyChange` 事件提供了一种可行的方法。\n\
  \n\n\n\n\n下一节将使用这些通信策略将另一个 JavaFX 应用程序移植到 NetBeans 平台。\n\n# 6.3 与 NetBeans 平台集成\n\
  \n现在，让我们将一个更典型的桌面应用程序的 JavaFX 程序转换为 NetBeans 平台。我们将移植项目 `PersonFXMLAppEnhancedUI`，它是我们在\
  \ 第 5 章 中转换为 NetBeans 平台的 Swing 应用程序的 JavaFX 版本。（项目 `PersonFXMLAppEnhancedUI` 在\
  \ 第 4 章 中有详细描述。请参阅第 153 页 上的“JavaFX Applications”）。构建此应用程序时，我们将使用之前过的 NetBeans 平台功能。这包括将应用程序拆分为模块、使用\
