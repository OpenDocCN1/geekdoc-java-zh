  \ JTextPanel`。列表 13.10 显示了如何向窗口写入带有颜色编码的 `String` 消息，以及如何使用 `FileChangeListener`\
  \ 显示我们正在监控的完整层级结构。\n\n`appendToDisplay()` 方法将带有 `Color` 属性的 `String` 写入 `JTextPanel`\
  \ 显示区域。我们临时地将文本面板设为可编辑，并设置定义文本颜色、字体样式和对齐方式的属性。我们将光标位置置于末尾，将 `String` 参数添加到 `Text\
  \ Panel` 中，并将 `Text Panel` 恢复为不可编辑状态。\n\n`updateDisplay()` 方法在 `componentOpened()`\
  \ 以及 `FileChangeListener` 接收到文件更改事件时被调用。该方法带有 `root` 调用 `displayFiles()`（随后该方法会对整个层级结构递归调用自身），以便层级结构中的每个文件和文件夹都写入窗口的\
  \ `Text Panel`。`displayFiles()` 方法通过获取归文件的根节点并递归显示其内容来处理归文件（这展示了 `FileObject` 和\
  \ `FileSystem` 抽象的力量）。\n\n`displayFiles()` 方法带有 `FileObject` 参数被调用。如果 `FileObject`\
  \ 具有 `Color` 属性，则使用该颜色来写入 `FileObject` 的路径名。如果不存在 `Color` 属性，则使用默认的 `Color.DARK_GRAY`\
  \ 颜色值。请记住，`FileObject` 的属性存储在 NetBeans Platform 应用程序的用户目录中。当用户重新运行 `FileSystemApp`\
  \ 应用程序时，这些属性会持久存在。\n\n列表 13.10 ChangeDetectorTopComponent——更新文本面板\n\n```java\nprivate\
  \ void appendToDisplay(String msg, Color c) {\n    display.setEditable(true);\n\
  \    StyleContext sc = StyleContext.getDefaultStyleContext();\n    AttributeSet\
  \ attrset = sc.addAttribute(SimpleAttributeSet.EMPTY,\n            StyleConstants.Foreground,\
