  ### 创建并安装回调动作执行器\n\n接下来，我们将在 Gender 窗口中定义一个 Refresh 回调动作版本，该动作会在窗口获得焦点时被调用。请记住，当\
  \ `TopComponent` 获得焦点时，它的 `ActionMap` 位于全局选择查找（Global Selection Lookup）中，任何定义的动作都将变为可用。\n\
  \n刷新动作已经注册在我们的应用程序中。Listing 9.5 展示了如何将“MyCoolRefreshAction”的实现安装到 `Gender` `TopComponent`\
  \ 的 `ActionMap` 中。在 NetBeans Platform 文档中，回调动作实现被称为动作“执行器”（performer）。注意，要调用 `TopComponent`\
  \ 版本的 `RefreshAction`，需要三个步骤：\n\n1. 在 `TopComponent` 的 `Lookup` 中包含 `ActionMap`。这是通过\
  \ Listing 9.5 所示的 `associateLookup()` 方法实现的。\n2. 将动作及其键添加到 `TopComponent` 的 `ActionMap`\
  \ 中，如 `getActionMap().put()` 语句所示。该键必须与动作的 key 属性匹配。\n3. 运行应用程序时，`Gender` 窗口必须获得焦点才能调用其版本的\
  \ `RefreshAction`。\n\nListing 9.5 `GenderTopComponent.java`—安装“MyCoolRefreshAction”点击此处查看代码图像\n\
  \n* * *\n\n```java\npublic final class GenderTopComponent extends TopComponent\n\
  \        implements ExplorerManager.Provider {\n\n    private final ExplorerManager\
  \ em = new ExplorerManager();\n\npublic GenderTopComponent() {\n    initComponents();\n\
  \    setName(Bundle.CTL_TopComponent());\n    TreeView view = new TreeView();\n\
  \    add(view, BorderLayout.CENTER);\n    associateLookup(em, this.getActionMap());\n\
  \    em.setRoot(new RootNode());\n    for (Node node : em.getRootContext().getChildren())\
  \ {\n        view.expand(node);\n    }\n    getActionMap().put(\"MyCoolRefreshAction\"\
  , new AbstractAction() {\n        @Override\n        public void actionPerformed(ActionEvent\
  \ e) {\n            em.setRoot(new RootNode()); // Rebuild hierarchy\n        }\n\
  \    });\n}\n```\n\n* * *\n\n一旦 `AbstractAction` 的实现通过键 `MyCoolRefreshAction` 安装在\
  \ `Gender` `TopComponent` 的 `ActionMap` 中，并且 `Gender` `TopComponent` 获得焦点，就会执行本地的\
  \ `actionPerformed()`。在这里，安装的实现重建视图视图（实例化 RootNode）。如果另一个窗口获得焦点，该实现也会执行。\n\n有时，回调动作拥有回退实现可能没有意义。在这种情况下，如果聚焦的组件中安装了实现，则菜单中的动作应该启用。要移除回退，请修改\
  \ `RefreshAction` 类，如 Listing 9.6 所示。以下是步骤：\n\n1. 在类内部定义一个 `public static final\
  \ String`，其值与键相同。\n2. 从 `@ActionRegistration` 注解中移除 key 属性。\n3. 将动作注解移动到类内部，以便它们作用于静态\
  \ `String`。\n4. 移除 `ActionListener` 实现。\n\n通过这些更改，刷新动作仍然注册在顶层菜单和工具栏中，但现在没有回退实现了。Listing\
  \ 9.6 `RefreshAction.java`—移除回退点击此处查看代码图像\n\n* * *\n\n```java\n@Messages({\n   \
  \ \"CTL_RefreshAction=Refresh\",\n    \"CTL_RefreshTitle=Refresh Action\"\n})\n\
  public final class RefreshAction {\n\n    @ActionID(\n        category = \"File\"\
  ,\n        id = \"com.asgteach.familytree.actions.RefreshAction\"\n    )\n    @ActionRegistration(\n\
  \        iconBase = \"com/asgteach/familytree/actions/refresh-icon.png\",\n    \
  \    displayName = \"#CTL_RefreshAction\"\n    )\n    @ActionReferences({\n    \
  \    @ActionReference(path = \"Menu/File\", position = 1300),\n        @ActionReference(path\
  \ = \"Toolbars/File\", position = 500),\n        @ActionReference(path = \"Shortcuts\"\
  , name = \"M-R\")\n    })\n\n    public static final String REFRESH_ACTION = \"\
  MyCoolRefreshAction\";\n}\n```\n\n\n\n\n由于没有回退实现，`Refresh` 操作仅在 `Gender` 窗口具有焦点时才启用。否则，`Refresh`\
  \ 在工具栏以及 `File` 菜单下都将被禁用，如图图 9.13 所示![](img/image5655.jpg)图 9.13 Refresh 操作被禁用。\n\
  \n## 上下文感知操作\n之前的示例向您展示了如何注册一个始终启用的操作（`Calendar` 操作）以及一个在对其注册的 `TopComponent` 具有焦点时才启用的回调操作（`Refresh`\
  \ 操作）。现在，让我们向您展示如何创建一个感知语境的操作。该操作会观察特定类型的当前选择，如果存在给定类型的实例，则启用自身。当操作的上下文位于所选实体的 `Lookup`\
  \ 中时，上下文感知操作就会启用。通常，所选实体是一个或多个节点，但也可以是一个 `TopComponent`。\n\n### NetBeans 平台能力模式\n\
  NetBeans 平台中的节点具有上下文菜单和 `Lookups`。NetBeans 平台根据节点 `getActions()` 方法提供的操作列表构建节点的上下文菜单。此外，节点的\
  \ `Lookup` 持有各种“上下文”对象，当这些对象存在于所选节点中时，会启用相应的操作。因此，我们使用节点的 `Lookup` 来安装能力（Capabilities）。在\
  \ NetBeans 平台中，能力通常由 Java 接口或抽象类描述，并通过添加到对象 `Lookup` 中的接口实现类或具体类来实现。这种安排让对象能够动态地配置其自身执行操作的能力，例如重新加载、存储（保存）、打开和删除。能力鼓励了松耦合，因为不无关的实体可以“查找”某种能力并调用它（如果存在），而无需获知其实现的详细信息。这与\
  \ `Global Lookup` 类似，后者使服务提供者对感兴趣的实体变为可用。\n\n例如，NetBeans IDE 使用了这种能力模式。在 Java 编辑器中，工具栏上的\
  \ `Save All` 图标在您首次对源代码进行更改时会启用。这究竟是如何发生的？\n当编辑器检测到源代码的编辑时，它会向其 `Lookup` 中添加 `AbstractSavable`\
  \ 的实现。Action 框架会监听 `Global Lookup` 中是否存在 `AbstractSavable` 对象。当检测到时，`LookupListener`\
  \ 事件处理程序会启用工具栏上的 `Save All` 图标以及 `File` 菜单中的 `Save` 和 `Save All` 菜单项。当您点击这些菜单项之一时，将调用\
  \ `AbstractSavable` 的 `handleSave()` 方法。您的文件被保存，`AbstractSavable` 从 Java 编辑器的 `Lookup`\
  \ 中移除，这些菜单项将再次被禁用。33。我们向您展示如何使用第 10 章中的 `FamilyTreeApp` 完成这一切。请参见第 [488] 页上的“[实现更新”。我们在本章稍后的部分还提供了一个动态启用能力的示例。请参见第\
  \ [465] 页上的“为根节点添加丢弃支持”。\n\n相同的原理适用于节点选择。当您选择一个节点，且其 `Lookup` 中包含与已注册操作上下文对应的能力时，与该能力关联的操作就会被启用（可用）。让我们向您展示如何通过不同版本的\
  \ `Calendar` 操作来实现此功能。\n\n### 实现上下文感知操作\n以下是我们将如何创建一个上下文感知操作并将其与 `GenderTopComponent`\
  \ 中的 `PersonNodes` 使用的概述。\n*   从应用程序中移除始终启用的 `CalendarAction`。\n*   创建一个新的能力模块（Capabilities\
  \ module）和一个 `CalendarCapability` 接口。将其包设为公共（public），以便其他模块可以对该模块设置依赖。\n*   使用“New\
  \ Action”向导创建一个新的条件条件启用操作。将此操作命名为 `Calendar`，并使用上下文 `CalendarCapability` 实现该操作。\n\
  *   修改模块 `GenderViewer` 中的 `PersonNode`。实现 `CalendarCapability` 并将其添加到 `PersonNode`\
  \ 的 `Lookup` 中。复用 `CalendarPanel` 表单和图标。\n*   配置 `PersonNode` 的操作列表，使其上下文菜单包含 `Calendar`\
