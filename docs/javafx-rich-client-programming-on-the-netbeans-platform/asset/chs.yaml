  \ `PropertyChangeListener` 来响应来自 `FamilyTreeManager` 的更改，以及 `TreeSelectionListener`\
  \ 来响应用户的选择。\n\n1. 向 `PersonViewerTopComponent` 添加 `PropertyChangeListener` 代码以监听来自\
