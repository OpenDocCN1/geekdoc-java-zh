  \ if (!text.isEmpty()) {\n        sb.append(text);\n        sb.append(\"\\n\");\n\
  \    }\n}\n// 在文档中查找新字符串的起始位置\n\nint startPosition = 0;\nfor (Node node : mypane.getChildren())\
  \ {\n    if (node instanceof StackPane) {\n        StackPane sp = (StackPane) node;\n\
