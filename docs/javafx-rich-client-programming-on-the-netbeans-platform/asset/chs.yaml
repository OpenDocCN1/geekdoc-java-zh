  \ `FamilyTreeManagerImpl` 类提供了一个 `HashMap` 来管理 `Person` 对象，并在 `Person` 对象被添加、更新或删除时触发属性更改事件。客户端可以通过\
  \ `addPropertyChangeListener()` 方法成为监听器，并通过 `removePropertyChangeListener()` 方法移除其监听器身份。这与你在该程序的\
  \ Swing 版本中看到的行为相同。注解 `@ServiceProvider` 将该类的实例存放在应用程序的全局查找（Global Lookup）中，以便其他模块可以找到并使用它。这为我们的应用程序自动提供了一个单例对象，因此我们不再需要提供创建单例的代码。当我们为模块\
  \ `PersonViewer` 和 `PersonEditor` 添加代码时，将向你展示展示客户端模块如何查找和使用此服务。\n\n### 全局查找 (Global\
  \ Lookup)\n全局查找是应用程序范围内的仓库，用于模块发现和提供服务。这允许服务接口（`FamilyTreeManager`）与服务提供者（`FamilyTreeManagerImpl`）分离。因此，客户端模块可以在不感知或依赖其实现的情况下使用服务。这支持了模块之间的松耦合。\n\
  \n### 注解 @ServiceProvider\n`@ServiceProvider` 允许你将一个实现注册为接口的服务提供者。服务接口也被称为该接口模块的扩展点（在这里是\
  \ `FamilyTreeModel`）。标记了 `@ServiceProvider` 的类必须实现其所提供服务的接口。此外，该类必须是公共的，并且包含一个公共无参构造函数（或者像\
  \ `FamilyTreeManagerImpl` 那样没有构造函数）。使用此服务的模块不声明对提供者模块（`FamilyTreeManagerImpl`）的依赖。相反，客户端声明对包含服务接口的模块（`FamilyTreeModel`）的依赖。我们将更详细地讨论\
  \ Lookup API。\n\n## 5.6 配置选择窗口\n`FamilyTreeApp`（见图 5.3）有两个窗口。左侧窗口提供 `Person` 对象的列表，我们在\
