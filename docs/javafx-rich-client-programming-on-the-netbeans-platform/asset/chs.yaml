  \n## 8.11 关键点总结\n\nNetBeans Platform 窗口系统为桌面应用程序提供了标准的窗口功能。这包括拖放式重新配置和窗口缩放、停靠、最大化、最小化、打开和关闭。窗口系统还提供了以下关键特性：\n\
  \n* 开发者通过扩展类 `TopComponent` 来创建窗口，允许窗口自动集成到 NetBeans Platform 窗口系统中。\n*   `TopComponent`\
  \ 的默认配置提供了一个唯一的单例窗口、应用程序重启之间的持久化，以及一个用于打开窗口的注册操作（action）。\n*   模式（Modes）定义了窗口容器，并在用户运行应用程序或调整和重新配置窗口框时，指定窗口的相对大小和位置。\n\
  *   窗口系统提供了默认模式，你也可以定义新模式。\n*   `TopComponent` 在某种模式下打开。如果未定义 `TopComponent` 的模式或未分配模式，窗口系统将在编辑器模式下打开\
  \ `TopComponent`。\n* 模式有三种类型：编辑器（editor）、视图（view）和滑动（sliding）。编辑器模式类型持有不可最小化的文档窗口。视图类型模式通常持有辅助窗口。最小化的窗口被放入滑动模式中。\n\
  *   窗口系统定义了 `TopComponent` 注解，用于指定窗口的配置。这包括分配的模式、持久化类型、标题和工具提示文本，以及打开操作的注册。\n* \
  \  `TopComponents` 有三种持久化选项：`PERSISTENCE_ALWAYS`、`PERSISTENCE_ONLY_OPENED` 和 `PERSISTENCE_NEVER`。你还可以通过实现\
  \ `writeProperties()` 和 `readProperties()` 方法为你的 `TopComponent` 持久化字符串数据。\n*   通过移除注解\
  \ `@TopComponent.OpenActionRegistration` 中的元素 `preferredID` 来创建非单例的 `TopComponents`。对于非单例的\
  \ `TopComponents`，使用持久化类型 `PERSISTENCE_NEVER` 或 `PERSISTENCE_ONLY_OPENED`。\n*  \
  \ 重写 `TopComponent` 方法以自定义 `TopComponent` 生命周期中某些时间点的行为。这包括组件的打开、关闭、激活、取消激活、隐藏和显示。你还可以重写方法\
  \ `canClose()` 来动态允许或禁止 `TopComponent` 关闭。\n*   在 `TopComponent` 的构造函数中设置客户端属性以自定义（即限制）窗口的行为。\n\
  *   窗口管理器提供了实用窗口操作的编程访问，例如查找打开的窗口、查找模式、查找 `TopComponent` 组、设置角色以及访问当前 `TopComponent`\
  \ 注册表。通过访问 `TopComponent` 实例或 `Mode` 实例，你可以打开、关闭、激活或隐藏 `TopComponent`并将 `TopComponent`\
  \ 停靠到不同的模式中。\n*   窗口组（Window groups）允许你指定一组打开和关闭的 `TopComponents`。通过窗口系统组定义文件（.wsgrp）以及组中每个\
  \ `TopComponent` 的窗口系统 `TopComponent` 组文件来指定和配置组。\n*   NetBeans IDE 提供了“窗口布局”向导，用于为应用程序自定义窗口布局。该向导允许你定义新模式、重新定义标准模式或重命名标准模式。\n\
  *   你可以根据角色定义不同的窗口布局，并指定属于某些角色的 `TopComponents`。窗口管理器跟踪你定义的角色并持久化独立的 `Windows2`，对于你使用的任何角色。\n\
  *   `TopComponents` 在没有任何角色配置时也可以打开。\n*   通过窗口管理器方法 `setRole()` 切换角色，使用 `null` 角色。\n\
  \n# 9. Action 框架\n\n操作（Actions）在应用程序中执行工作，用户通过选择菜单项、点击工具栏按钮或使用快捷键启动这些工作。NetBeans\
  \ Platform 提供了一个用于启动操作的框架。该框架还可以根据选择上下文动态启用和禁用操作。在本章中，我们将向你展示如何接入 NetBeans Action\
  \ 框架、创建自己的操作并复用平台提供的标准操作。我们还将在模块化应用程序的过程中引入上下文操作。\n\n## 你将学习\n*   创建始终启用的、回调的和条件触发的操作。\n\
  *   使用注解注册操作。\n*   配置 `TopComponent` 的 `ActionMap` 和节点的上下文菜单。\n*   使用能力（capabilities）动态启用和禁用操作。\n\
  *   实现拖放、删除、复制、粘贴和节点重排序操作。\n*   实现窗口间的拖放行为。\n\n\n\n\n## 菜单系统配置\n\nNetBeans Platform\
  \ 骨架应用程序包含默认的顶层菜单栏和带有图标的工具栏。请参阅第 659 页上的“移除层配置项”来了解如何配置（或隐藏）默认的菜单和工具栏框架。此外，第 444\
  \ 页上的“编辑节点层级”展示了如何实现一些预配置的菜单项，例如复制、剪切、粘贴等。\n\n## 始终可用的操作\n\n我们将应用程序任何状态下都可以选择的操作称为始终可用的操作。例如，在\
  \ NetBeans IDE 顶部菜单栏的 `NetBeans` 菜单项下，“关于 NetBeans”和“退出 NetBeans”都是始终启用的菜单项。这些操作执行时不依赖于对象、数据或文件的可用性。它们也不依赖于用户在应用程序任何窗口中选择的项目或项目。\n\
  \n让我们向您展示如何通过向我们的 `FamilyTreeApp` 应用程序添加名为 `Calendar` 的操作来创建一个始终可用的操作。我们将从第 7 章中之前创建的应用程序开始（参见第\
  \ 314 页上的“创建你自己的属性表”）。此新操作将弹出一个包含图像、文本以及取消和确定按钮的自定义对话框。图 9.1 展示了了它的外观。11。本章的图标来自\
  \ [`www.visualpharm.com`](http://www.visualpharm.com)。![](img/image5491.jpg)图 9.1\
  \ 在 FamilyTreeApp 应用程序中调用 Calendar 操作\n\n### 添加始终可用的操作\n\n按照以下步骤向应用程序添加始终可用的操作。\n\
  \n1. 创建一个名为 `FamilyTreeActions` 的新模块，代码名为 `base com.asgteach.familytree.actions`（或使用已有的模块）。\n\
  2. 展开 `Source Packages` 节点，右键点击包名，并在右键菜单中选择 `New | Action . .`，如图 9.2 所示![](img/image5500.jpg)图\
