  \nDialog API 允许你使用 `DialogDescriptor` 类创建自定义对话框，该类是 `NotifyDescriptor` 的扩展。`DialogDescriptor`\
  \ 提供了多个构造函数，让你能够构建自定义对话框。`DialogDescriptor` 的主要优势在于你可以指定额外的功能，例如上下文帮助、按钮监听器、按钮对齐方式和按钮文本。你还可以构建自己的内部面板显示在对话框中，这样对话框的视图就可以包含你需要的任何组件集。\n\
  \n如果你构建了自定义的内部面板，你还需要用于访问用户输入的公共方法。让我们构建一个简单的自定义对话框，询问一个人的名字和姓氏。稍后我们将通过错误检查来增强此对话框。\n\
  \n图 11.7 显示了一个“人员信息”对话框。我们已经为对话框配置了标题（人员信息）、一条通知线以及“取消”和“确定”选项按钮。\n\n![](img/image6909.jpg)\n\
  图 11.7 具有自定义视图的对话框\n\n对于内部面板，我们将使用一个自定义的 `JPanel` 组件，它包含两个标签（名字和姓氏）、两个文本字段和一个图标，如图\
  \ 11.8 所示。要创建此表单，请右键点击你的模块包，并选择 `New | JPanel Form`。将类命名为 `CustomPersonPanel`。NetBeans\
  \ 会 Matisse 表单设计器中创建一个带有顶层 `JPanel` 的新 Java 类。现在添加标签、文本字段和图标。（使用带有合适图像的 `JLabel`\
  \ 组件作为图标。）\n\n![](img/image6915.jpg)\n图 11.8 带有标签、文本字段和图标的 JPanel 设计视图\n\n***\n\n\
  **对话框提示**：请注意，你不需要将标题、通知线或选项按钮添加到 `JPanel` 中。你通过 `DialogDescriptor` 来配置这些对话框构件。\n\
