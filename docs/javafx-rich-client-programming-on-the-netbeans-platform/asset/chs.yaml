  \n***\n\n### equals() 和 hashCode\n\n请注意，如果你有一个只读的 JavaFX 属性，其值是在内部维护而非计算的，那么你将使用相同的只读方法。如果属性不是计算出来的，你就不需要绑定它的值。\n\
  \n之前的版本 `Person` 类基于 `equals()` 和 `hashCode()` 仅依赖于属性 `id`（参见第 24 页的 [2.3]），这允许你对可能具有不同姓名但\
  \ `id` 相同的对象使用 `equals()`。我们将采取不同的方法，并确保如果两个 `Person` 对象的所有属性都相等，则这两个 `Person` 对象就相等。我们进行此更改是为了利用\
  \ JavaFX 可观察类，我们将在下一节中讨论它们。\n\n[Listing 4.7] 显示了 `Person` 类更新后的 `equals()` 和 `hashCode()`\
  \ 方法。计算属性 `fullname` 包含了它所有的依赖属性，因此我们只需要包含属性 `id`、`notes` 和 `gender`。\n\n### 列表\
  \ 4.7 Person equals() 和 hashCode [点击此处查看代码图片]\n\n```java\npublic class Person implements\
  \ Serializable {\n    // ... 省略代码 ...\n    @Override\n    public int hashCode()\
  \ {\n        int hash = 3;\n        hash = 31 * hash + Long.hashCode(id);\n    \
  \    hash = 31 * hash + notes.hashCode();\n        hash = 31 * hash + gender.hashCode();\n\
