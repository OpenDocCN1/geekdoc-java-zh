  \ `TableView` 控件，如 [Listing 4.35] 所示。\n\n### Listing 4.35 为 FXML 添加控件\n\n```xml\n\
  <HBox id=\"HBox\" alignment=\"CENTER\" layoutX=\"7.0\" layoutY=\"153.0\" spacing=\"\
