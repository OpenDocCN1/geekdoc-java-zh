  部署并运行向导。注意，仅使用 Java 注解，你就可以调用我们的基础版向导，通过 `Menu | Tools` 访问，如图 12.7 所示。\n\n### 调用数字序列\n\
  最初，向导显示第一个面板，如图 12.8 所示。当然，此时还没有任何组件，你只会看到 NetBeans 定义的标准元素：标题、步骤列表、此面板的标题（Step\
  \ #1）以及控制按钮：：`Help`、`Next`、`Finish`、`Cancel`。\n\n### 新序列向导：面板 1\nHelp（帮助）未启用，因为我们没有配置任何；Back（上一步）未启用，因为这是第一个面板；Finish（完成）未启用，因为还有两个面板需要处理。有趣的是，Next（下一步）是可用的，因为向导的默认行为是有效状态，允许用户继续进入下一个面板。\n\
  \n选择 Next，向导显示第二个面板。面板标题现在显示为 Step #2（在步骤列表下方也加粗显示了）。Back 按钮现在变为可用，但 Finish 仍处于禁用状态。再次选择\
  \ Next，Step #3 出现，这是最后一个也是第三个面板。Finish 按钮现在变为可用。选择 Finish。此时此地，向导已完成，控制权返回到 `actionPerformed()`\
  \ 方法，所示：\n```java\nif (DialogDisplayer.getDefault().notify(wiz) == WizardDescriptor.FINISH_OPTION)\
  \ {\n    // do something\n}\n```\n`actionPerformed()` 方法收集向导获取的所有数据（目前还没有数据！）并执行其任务（无论任务是什么）。这些都很好，但我们的数字序列向导应该做得更多。接下来让我们构建一个简单的\
  \ GUI，向你展示每个面板的向导如何从用户那里收集信息。\n\n### 2.3 向导输入\n我们的向导非常简单。它提示输入一组三个数字，其取值并不重要。在第一个版本中，我们并不验证输入是否为数字。\n\
  \n对于三个视觉面板中的每一个，请使用 NetBeans 表单设计器为每个面板添加一个标签（label）和一个文本框（textField）。将 `JTextField`\
  \ 组件分别命名为 `firstNumber`、`secondNumber` 和 `thirdNumber`。图 12.9 显示了第一个视觉面板的表单设计器。\n\
  \n#### 使用表单设计器向视觉面板添加组件\n现在，再次运行应用程序并选择菜单 `Tools | Number Sequence`。你会在每个面板中看到一个字段，可以在其中提供数字。此时，还没有代码来读取该值或判断输入是否为数字。\n\
  \n接下来，让我们读取每个值，并在 `actionPerformed()` 方法中使用 NetBeans 平台提供的预定义信息对话框（Information dialog）显示数字序列（参见第\
  \ 527 页的“标准对话框”）。这一重要的第一步展示了如何读取用户输入并使数据在 `actionPerformed()` 方法中可访问。对每个面板执行以下步骤：\n\
  1. 为你想保存的每个值创建一个属性名称。这将是面板类中的一个 `public static final String`。\n2. 创建一个 `public`\
  \ get 方法（getter）以从每个视觉面板访问用户输入。\n3. 将每个属性值存储在 `WizardDescriptor` 中，以使数据在 `actionPerformed()`\
  \ 方法中可访问。\n\n列表 12.2 显示了 `NumberVisualPanel1.java` 的更改，并已**加粗**显示。你将在 `NumberVisualPanel2.java`\
  \ 和 `NumberVisualPanel3.java` 中进行类似的的更改。\n1. 定义 `public static final String PROP_FIRST_NUMBER`。\n\
  2. 定义 `public method getFirstNumber()` 以返回 `JTextField` 组件的文本值。\n\n#### NumberVisualPanel1.java\n\
  ```java\npublic final class NumberVisualPanel1 extends JPanel {\n    // 为我们要收集的每条数据创建属性名称\n\
  \    public static final String PROP_FIRST_NUMBER = \"firstNumber\";\n\n    public\
  \ NumberVisualPanel1() {\n        initComponents();\n    }\n\n    @Override\n  \
  \  public String getName() {\n        return \"Step #1\";\n    }\n\n    public String\
  \ getFirstNumber() {\n        return firstNumber.getText();\n    }\n\n    // 生成的代码\n\
  \    // ... 变量声明 - 不要修改\n    private javax.swing.JTextField firstNumber;\n    private\
  \ javax.swing.JLabel jLabel1;\n    // 变量结束\n}\n```\n\n* * *\n\n现在，在向导面板内部，使用 `storeSettings()`\
  \ 方法保存属性值。将其存储在 `WizardDescriptor` 的属性缓存中。列表 12.3 显示了 `NumberVisualPanel1.java`\
  \ 的 `storeSettings()` 方法。\n\n当向导面板步骤结束时，WizardDescriptor 调用 `storeSettings()`。这就是将值存储在\
  \ `WizardDescriptor` 属性缓存的地方。通过 `WizardDescriptor` 属性缓存，你可以在任何向导面板和向导操作类之间共享数据。\n\
  \n同样，WizardDescriptor 在向导面板步骤开始时调用 `readSettings()`。这就是你从 `WizardDescriptor` 属性缓存中读取属性的地方。你也可以在\
