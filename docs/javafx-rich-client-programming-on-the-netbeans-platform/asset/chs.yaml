  \ // 显示并阻塞\n            }\n        });\n    }\n\n    @SuppressWarnings(\"unchecked\"\
  )\n    @Override\n    public Action[] getActions(boolean context) {\n        List<Action>\
  \ nodeActions = new ArrayList<>(\n            Arrays.asList(super.getActions(context)));\n\
  \        // 添加分隔符\n        nodeActions.add(null);\n        nodeActions.addAll(Utilities.actionsForPath(\"\
  Actions/Nodes\"));\n        return nodeActions.toArray(new Action[nodeActions.size()]);\n\
  \    }\n}\n```\n\n\n\n\n\n图 9.21 显示，我们可以同时选择 `PersonNodes` 和 `GenderNodes` 并调用 `Calendar`\
  \ 操作，该操作将根据所选上下文执行。![](img/image5836.jpg)图 9.21 为 GenderNodes 和 PersonNodes 实现的\
  \ Calendar 操作\n\n## 9.3 编辑节点层级结构\n\n应用程序可能需要通过拖放以及剪切、复制、粘贴和删除来修改节点层级结构。你可能还需要对节点组内的节点进行重新排序。NetBeans\
  \ 平台提供了这些任务的操作和支持。要使用这些操作，你需要提供支持代码，将其钩到 `Action` 框架和 `Explorer View/node hierarchy`。44。此示例改编自\
  \ Geertjan Wielenga ([`blogs.oracle.com/geertjan/entry/node_cut_copy_paste_delete`](https://blogs.oracle.com/geertjan/entry/node_cut_copy_paste_delete))\
  \ 和 Toni Epple ([`netbeans.dzone.com/nb-how-to-drag-drop-with-nodes-api`](http://netbeans.dzone.com/nb-how-to-drag-drop-with-nodes-api))\
  \ 博客文章和文章。\n\n让我们创建一个新的节点层级结构，使用户可以在三个组（通过 `GroupNode` 实现）内移动并重新排序 `PersonNodes`。我们将这些组命名为\
  \ Happy（快乐）、Sad（悲）和 Undecided（未决定）。我们将使用 `FamilyTreeManager` 中的 Simpson 家族，并允许用户进行\
  \ `Cut`（剪切）、`Copy`（复制）、`Paste`（粘贴）、`Delete`（删除）、`Drag and Drop`（拖放），以及 `Reorder`（重排序）、`Move\
  \ Up`向上移动）和 `Move Down`向下移动）。在本节中，我们将展示如何实现所有这些操作。\n\n### 组窗口节点操作\n\n让我们先看看组窗口及其节点结构。图\
  \ 9.22 显示了初始状态下的 `FamilyTreeApp`。它包含一个单一窗口（组窗口），其中包含我们来自 Simpson 家族的最喜 `Person`\
  \ 对象组。所有家庭成员都出现在 Group Undecided 之下。你可以使用 `Copy/Paste`、`Cut/Paste` 或 `Drag and Drop`\
  \ 在三个组（Happy、Sad 和 Undecided）之间移动一个或多个 `Person` 对象，将 `Person` 对象放在不同的组中或在同一组内移动。此外，你还可以对任何组进行重新排序![](img/image5847.jpg)图\
  \ 9.22 组节点允许你对人员进行重新分类\n\n`Group` 节点包含上下文菜单项 `Change Order ...`（更改顺序...），所示图 9.23。`Change\
  \ Order` 会弹出一个独立的对话框，并让你使用 `Move Up` 和 `Move Down` 按钮重新排列该组。你可以通过 `OK` 接受更改或 `Cancel`\
  \ 退出对话框![](img/image5853.jpg)图 9.23 组节点允许你重新排序并接收粘贴\n\n图 9.24 显示了选中的节点 Bart Simpson\
  \ 及其上下文菜单，其中包含 `Cut`、`Copy`、`Delete`、`Move Up` 和 `Move Down`。`Move Up` 和 `Move Down`\
  \ 操作会在组内移动选中的节点![](img/image5859.jpg)图 9.24 Person 节点允许你剪切、复制、删除或向上/向下移动\n\n###\
  \ 基础节点层级结构\n\n让我们先检查节点层级结构。从图 9.24 中你可以看到标记为 `People` 的根节点、中间 `GroupNodes`（Happy、Sad\
  \ 和 Undecided）以及带有封装的 Simpson 家族 `Person` 对象的熟悉的 `PersonNodes`。\n\n由于具有重新排序能力，我们创建了一个模型类（`PersonModel`）来操作\
  \ `GroupNode` 内部的 `Person` 对象列表。每个 `GroupNode`、`PersonChildFactory` 以及所有 `PersonNodes`\
  \ 都保留对该模型的引用。Listing 9.15 显示了 `PersonModel` 类，它为每个 `GroupNode` 维护一个 `Person` 对象的数组列表。模型还提供了添加、删除和重新排序对象的方法，以及更改支持。\n\
  \nListing 9.15 PersonModel—维护 GroupNode 的列表\n\n```java\npublic class PersonModel\
  \ {\n    private final List<Person> persons;\n    private final ChangeSupport cs\
  \ = new ChangeSupport(this);\n    public PersonModel(List<Person> persons) {\n \
  \       this.persons = new ArrayList<>(persons);\n    }\n    public List<? extends\
  \ Person> getPersons() {\n        return persons;\n    }\n\n    public void add(Person\
  \ p) {\n        persons.add(p);\n    }\n    public void remove(Person p) {\n   \
  \     persons.remove(p);\n    }\n    public void reorder(int[] indexOrder) {\n \
  \       Person[] reordered = new Person[indexOrder.length];\n        for (int i\
  \ = 0; i < indexOrder.length; i++) {\n            Person p = persons.get(i);\n \
  \           reordered[i] = p; // 注意：此处原文中 j 应为 i\n        }\n        persons.clear();\n\
  \        persons.addAll(reordered);\n    }\n    public void addChangeListener(ChangeListener\
  \ l) {\n        cs.add(l);\n    }\n    public void removeChangeListener(ChangeListener\
  \ l) {\n        cs.remove(l);\n    }\n}\n```\n\n层级结构由 `GroupChildFactory` 构建，它创建每个\
  \ `GroupNode`。`GroupNode` 转向通过 `PersonChildFactory` 构建 `PersonNodes`。以下是这些类的职责：\n\
  \n- `GroupChildFactory` 为每个 `GroupNode` 实例化 `PersonModel`，所示 Listing 9.16。它在构建层级结构时将\
  \ Simpson 家族放在 GroupNode Undecided。否则，它构建一个空模型。\n\n```java\npublic class GroupChildFactory\
  \ extends ChildFactory<PersonGroup> {\n    private static final Logger logger =\
  \ Logger.getLogger(GroupChildFactory.class.getName());\n    private FamilyTreeManager\
  \ ftm;\n    private final List<Person> people = new ArrayList<>();\n    GroupChildFactory()\
  \ {\n        ftm = Lookup.getDefault().lookup(FamilyTreeManager.class);\n      \
  \  if (ftm == null) {\n            logger.log(Level.SEVERE, \"Cannot get FamilyTreeManager\"\
  );\n            LifecycleManager.getDefault().exit();\n        }\n        people.addAll(ftm.getAllPeople());\n\
  \    }\n    @Override\n    protected boolean createKeys(List<PersonGroup> list)\
  \ {\n        list.addAll(Arrays.asList(GroupNode.PersonGroup.values()));\n     \
  \   return true;\n    }\n    @Override\n    protected Node createNodeForKey(PersonGroup\
  \ key) {\n        // 将所有人放在 UNDECID 组\n        if (key.equals(PersonGroup.UNDECIDED))\
  \ {\n            return new GroupNode(key, new PersonModel(people));\n        }\n\
  \        return new GroupNode(key, new PersonModel());\n    }\n}\n```\n\n- `GroupNode`\
  \ 是 Happy、Sad 或 Undecided 之一，并在构造函数中接收其 `PersonModel`，所示 Listing 9.17。构造函数将此引用传递给它的\
  \ `Children` 类（`PersonChildFactory`）。\n\n```java\n@NbBundle.Messages({\n    \"HINT_GroupNode=Group\
  \ Node\"\n})\npublic class GroupNode extends AbstractNode {\n    private static\
  \ final Logger logger = Logger.getLogger(GroupNode.class.getName());\n    private\
  \ final PersonModel personModel;\n    private final InstanceContent instanceContent;\n\
  \    public enum PersonGroup {\n        HAPPY, SAD, UNDECIDED\n    }\n    public\
  \ GroupNode(PersonGroup group, final PersonModel personModel) {\n        this(group,\
  \ personModel, new InstanceContent());\n    }\n    private GroupNode(PersonGroup\
  \ group, final PersonModel personModel, InstanceContent ic) {\n        super(Children.create(new\
  \ PersonChildFactory(personModel), false),\n              new AbstractLookup(ic));\n\
  \        this.instanceContent = ic;\n        this.personModel = personModel;\n \
  \       this.instanceContent.add(group);\n        setGroupStuff(group);\n    }\n\
  \n    private void setGroupStuff(PersonGroup group) {\n```\n\n\n\n\n\n```java\n\
  StringBuilder sb = new StringBuilder();\n\nStringBuilder iconString = new StringBuilder(\n\
  \            \"com/asgteach/familytree/groupviewer/resources/\");\nswitch (group)\
  \ {\n    case HAPPY:\n        sb.append(\"Happy\");\n        iconString.append(\"\
  happy.png\");\n        break;\n    case SAD:\n        sb.append(\"Sad\");\n    \
  \    iconString.append(\"sad.png\");\n        break;\n    case UNDECIDED:\n    \
  \    sb.append(\"Undecided\");\n        iconString.append(\"undecided.png\");\n\
  \        break;\n}\nsetName(sb.toString());\nsetDisplayName(sb.toString());\nsetIconBaseWithExtension(iconString.toString());\n\
  }\n```\n\n* * *\n\n* `PersonChildFactory` ([Listing 9.18]) 继承自 `ChildFactory.Detachable<Person>`，它提供了生命周期方法\
  \ `addNotify()` 和 `removeNotify()`。在这里，`PersonChildFactory` 将自己作为监听器添加/移除到 `PersonModel`\
  \ 对象。`PersonChildFactory` 在构造函数中接收 `PersonModel` 的引用，并是模型的“守护者”，通过调用 `refresh()`\
  \ 方法来响应变化。Listing 9.18 `PersonChildFactory.java`\n\n* * *\n\n```java\npublic class\
  \ PersonChildFactory extends ChildFactory.Detachable<Person>\n        implements\
  \ ChangeListener {\n    private final PersonModel personModel;\n\n    public PersonChildFactory(final\
  \ PersonModel personModel) {\n        this.personModel = personModel;\n    } @Override\n\
  \    protected boolean createKeys(List<Person> list) {\n        list.addAll(personModel.getPersons());\n\
  \        return true;\n    } @Override\n    protected Node createNodeForKey(Person\
  \ key) {\n        PersonNode node = new PersonNode(key, personModel);\n        return\
  \ node;\n    }    // 在第一次调用 createKeys() 之前立即调用。\n    @Override\n    protected void\
  \ addNotify() {\n        personModel.addChangeListener(this);\n    }\n    // 当此子工厂不再被使用时调用，\n\
  \    // 用于释放资源、分离监听器等。\n    @Override\n    protected void removeNotify() {\n   \
  \     personModel.removeChangeListener(this);\n    }\n    @Override\n    public\
  \ void stateChanged(ChangeEvent e) {\n        refresh(false);\n    }\n}\n```\n\n\
