  \ 包中。![](img/image1112.jpg)\n图 2.13 PersonSwingApp 项目结构\n\n在我们开始向你介绍各种方法和变量之前，让我们先看看主类\
  \ `PersonJFrame` 的整体程序结构，如列表 2.12 所示。该类继承自 `JFrame`，这是一个顶层 Swing 窗口。\n\n接下来，我们定义了字段或类变量。变量\
  \ `top` 是一个 `DefaultMutableTreeNode`，它是 JTree 模型数据的根。变量 `ftm` 是 `FamilyTreeManager`\
