  \        if (custStore != null) {\n            customer = custStore.findCustomer(customerName);\n\
  \            wizard.putProperty(PROP_CUSTOMER, customer);\n            setIsNewCustomer(customer\
  \ == null);\n        }\n    }\n}\n```\n\n* * *\n\n# 构建披萨面板 (BuildPizza Panel)\n\n\
  `BuildPizza` 步骤也会影响向导的步骤顺序。`BuildPizzaController` 类收集创建 `PizzaOrder` 对象所需的输入。由于所有输入选择都是复选框或单选按钮，因此不需要进行验证。然而，`BuildPizzaController`\
  \ 必须确定披萨是自取还是配送。如果是配送，则下一个面板是 `DeliveryInformation`（送货信息）；否则，下一个面板是 `ConfirmOrder`（确认订单）。\n\
  \n这里我们可以采取两种方法，每种实现产生的向导行为略有不同。我们将展示这两种方法。\n\n第一方法是让 `BuildPizzaController` 实现 `WizardDescriptor.ValidatingPanel`\
