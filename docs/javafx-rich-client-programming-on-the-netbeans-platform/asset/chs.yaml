  </SplitPane>\n</children>\n</AnchorPane>\n```\n\n# JavaFX 控件\n\n在检查控制器类之前，让我们先看看\
  \ JavaFX 控件的部分层级结构，如图所示图 4.12 和图 4.13。`Node` 继承 `Object`，`Parent` 继承 `Node`，而 `Control`\
  \ 继承 `Parent`。我们没有在应用程序中使用大部分这些控件，但这些图可以让你看到 `TextField`、`Label`、`TextArea`、`RadioButton`、`Button`\
  \ 和 `TreeView` 控件是如何放入 JavaFX `Control` 类层级中的。\n\n![](img/image2472.jpg)图 4.12 JavaFX\
  \ 控件层级（部分）！\n![](img/image2476.jpg)图 4.13 JavaFX 控件层级（部分）\n\n`Labeled` 是 `Label`、`CheckBox`\
  \ 以及其他按钮控件的父类。图 4.13 中的许多控件是通用的，其中 `<T>` 表示控件内包含的项目类型。JavaFX 控件通过其 JavaFX 属性进行操作，你可以在这些属性上附加监听器，或在绑定表达式中使用它们。在这一节中，我们将为你展示使用控件绑定属性和附加监听器的示例。\n\
  \n让我们看看我们在 JavaFX 应用程序中使用的一些控件。\n\n## Label\n类似于 Swing 的 `JLabel`，`Label` 持有不可编辑的文本。`Label`\
  \ 可以显示文本、图像或两者都有。如果文本无法适应标签，标签将使用省略号表示被截断的文本。在我们的示例中，我们在 FXML 中定义了所有的 `Label` 控件，不需要在控制器类中引用它们。以下如何在\
  \ Java 代码中创建 `Label` 的方法。点击此处查看代码图像\n\n```java\nLabel mylabel = new Label(\"First\"\
  );\n```\n\n### TextField\n`TextField` 控件允许用户编辑单行文本。我们为所有文本框定义了按键释放处理程序，并在文本框与其对应的\
  \ `Person` 属性之间配置了双向绑定。在这里，编辑由 `person` 的 `firstname` 属性的文本框绑定。点击此处查看代码图像\n\n```java\n\
  firstnameTextField.textProperty().bindBidirectional(person.firstnameProperty());\n\
  ```\n由于绑定是双向的，`TextField` 控件中 `text` 属性的变化或 `Person` 对象中 `firstname` 属性的变化都会更新相应的属性。\n\
  \n### TextArea\n我们使用 `TextArea` 控件来编辑 `Person` 属性。`TextArea` 控件允许用户编辑多行文本。与 `TextField`\
  \ 类似，我们配置了按键释放处理器并指定了双向绑定。这是我们用于 `TextArea` 的绑定表达式。点击此处查看代码图像\n\n```java\nnotesTextArea.textProperty().bindBidirectional(person.notesProperty());\n\
  ```\n`TextArea` 还有一个内置的上下文菜单可以帮助你编辑文本，如图 4.14 所示![](img/image2497.jpg)图 4.14 TextArea\
  \ 内置上下文菜单\n\n### RadioButton\n`RadioButton` 是一个 `Labeled` 控件，类似于 Swing 的 `RadioButton`。当单选按钮必须互斥时，你需要指定一个\
  \ `toggle group`（切换组）。以下是设置切换组并为其添加三个单选按钮的 FXML。对于每个单选按钮，我们指定了 `fx:id` 引用和方法 `genderSelectionAction()`，这是在控制器类中实现的事件处理程序。点击此处查看代码图像\n\
  \n```xml\n<RadioButton fx:id=\"maleRadioButton\" onAction=\"#genderSelectionAction\"\
  \ text=\"Male\">\n    <toggleGroup>\n        <ToggleGroup fx:id=\"genderToggleGroup\"\
  \ />\n    </toggleGroup>\n</RadioButton>\n<RadioButton fx:id=\"femaleRadioButton\"\
  \ onAction=\"#genderSelectionAction\" text=\"Female\" toggleGroup=\"$genderToggleGroup\"\
  \ />\n<RadioButton fx:id=\"unknownRadioButton\" onAction=\"#genderSelectionAction\"\
  \ text=\"Unknown\" toggleGroup=\"$genderToggleGroup\" />\n```\n\n### Button\n`Button`\
  \ 是一个 `Labeled` 控件，点击时会呈现“按下”的图形，如果配置了，会调用动作处理程序。以下是用于定义 Update 按钮的 FXML。点击此处查看代码图像\n\
  \n```xml\n<Button fx:id=\"updateButton\" layoutX=\"14.0\" layoutY=\"280.0\" onAction=\"\
  #updateButtonAction\" text=\"Update\" />\n```\n属性 `fx:id` 是类中的引用名称。方法 `updateButtonAction()`\
  \ 是控制器类中定义的动作处理器。\n\n### TreeView\n`TreeView` 控件呈现可以展开和折叠的项目层级显示。以下是用于定义 `TreeView`\
  \ 控件的 FXML。配置 `AnchorPane` 设置允许 `TreeView` 随其容器布局的调整而调整大小。点击此处查看代码图像\n\n```xml\n\
  <TreeView fx:id=\"personTreeView\" prefHeight=\"289.0\" prefWidth=\"225.0\" AnchorPane.bottomAnchor=\"\
  23.0\" AnchorPane.leftAnchor=\"23.0\" AnchorPane.rightAnchor=\"23.0\" AnchorPane.topAnchor=\"\
  14.0\" />\n```\n项目通过 `TreeItem<Person>` 显示，我们在控制器类中构建它们。首先，我们创建一个“People”根节点，然后构建其余的\
  \ `TreeItem` 对象。接下来，我们使用 `setRoot()` 设置 `TreeView` 的根节点，并指定初始展开根节点。`FamilyTreeManager`\
  \ 方法 `getAllPeople()` 返回列表，我们用它来构建 `TreeView` 的 `TreeItems`。点击此处查看代码图像\n\n```java\n\
  TreeItem<Person> rootNode = new TreeItem<>(new Person(\"People\", \"\", Person.Gender.UNKNOWN));\
  \ // 填充 TreeView \nftm.getAllPeople().stream().forEach((p) -> {\n    rootNode.getChildren().add(new\
  \ TreeItem<>(p));\n});\npersonTreeView.setRoot(rootNode);\n```\n\n\n\n\n\n```java\n\
  personTreeView.getRoot().setExpanded(true);\n```\n\n### JavaFX Controller 类\n\n\
  回想一下，应用程序允许用户从左侧的 `TreeView` UI 控件选择 `Person` 项（请参见第 154 页上的 图 4.7）。当选了某个 `Person`\
  \ 时，该 `Person` 就会显示在右侧的 `Person` 表单编辑器中。在用户编辑 `Person` 之前，`Update` 按钮保持禁用状态。\n\n\
  编辑完成后，用户通过点击 `Update` 按钮用新值更新应用程序中的 `Person`。`FamilyTreeManager` 会更新应用程序，`TreeView`\
  \ 将显示刚刚编辑过的 `Person` 项的新值（如果有）。用户也可以选择顶层节点（根节点），在这种情况下，`Person` 表单编辑器将清空且 `Update`\
  \ 按钮被禁用。如果用户在不保存更改的情况下选择了一个新项，则在 `Person` 表单编辑器中进行的任何编辑都将丢失。\n\n现在让我们来看控制器类。该类提供了\
  \ `initialize()` 方法来配置场景图。控制器类还负责定义事件处理器、更改监听器以及实现我们描述的行为的其他支持代码。\n\nListing 4.18\
  \ 显示了控制器的声明部分，在其中我们定义了在 FXML 文件中创建并在类类中访问的任何对象。回想一下，FXML 加载器负责实例化这些对象，因此你不会看到任何创建它们的代码。\n\
  \n我们还创建了一个 `Logger` 对象（关于描述信息，请参阅第 51 页的“Java 日志设施”）和一个 `FamilyTreeManager` 实例。这里还有几个类变量。\n\
  \n- 变量 `thePerson` 存储来自 `TreeView` 控件当前选中的 `Person`。\n- 变量 `genderBinding` 是一个自定义绑定对象，它保持\
  \ `Person` 的性别属性与表单编辑器同步。\n- `changeOK` 布尔值跟踪应用程序何时应该监听用户编辑。\n- `BooleanProperty\
  \ enableUpdateProperty`（一个 JavaFX 属性）通过绑定控制 `Update` 按钮的禁用属性。\n\n***\n\n**提示**：我们也可以手动控制\
  \ `Update` 按钮的禁用属性。然而，拥有一个单独的属性允许我们稍后配置不同的构件或控件，特别是当我们不再使用 `Update` 按钮时。\n\n***\n\
  \n#### Listing 4.18 PersonFXMLController—控制器类 点击此处查看代码图像\n\n```java\npublic class\
