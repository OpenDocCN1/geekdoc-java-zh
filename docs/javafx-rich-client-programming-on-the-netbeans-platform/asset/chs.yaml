  ```\n\n#### 配置 TopComponent 生命周期方法\n\n`TopComponent` 的生命周期方法 `componentOpened()`\
  \ 允许你在 `TopComponent` 打开时对其进行配置。`PersonEditorTopComponent` 需要访问 `FamilyTreeManager`\
  \ 服务提供者，我们通过应用程序的全局查找（Global Lookup）来获取它。这段代码与我们在 `PersonViewerTopComponent` 中使用的代码相同。注意，我们获取的是同一个实例，因为\
  \ `Lookup` 为服务提供者返回单例。\n\n在我们调用方法 `configureListeners()` 后，获取了 `PersonViewerTopComponent`\
  \ 的 `Lookup`。正如静态方法 `Lookup.getDefault()` 提供默认 `Lookup` 一样，我们使用 `WindowManager.getDefault()`\
  \ 获取默认的窗口管理器（WindowManager）。窗口管理器管理应用程序所有的 `TopComponents`。我们可以使用 `WindowManager`\
  \ 方法 `findTopComponent()` 找到特定的 `TopComponent`。（参见 表 8.1，第 352 页上的“窗口管理器用用方法”以获取对用用窗口管理器方法的描述。）参数“PersonViewerTopComponent”是\
  \ `TopComponent` 的 `preferredID` 属性，如第 222 页上 列表 5.6 中 `TopComponent` 注解所示。\n\n\
  通过对 `TopComponent` 的引用，我们使用方法 `getLookup()` 获取其 `Lookup`，并在其 `Lookup.Result` 上注册一个\
  \ `LookupListener`。每当 `PersonViewerTopComponent` 的 `Lookup` 因添加或删除 `Person.class`\
  \ 对象而发生变化时，`LookupListener` 的 `resultChanged()` 方法就会被调用。\n\n为什么我们在 `componentOpened()`\
  \ 中调用 `checkLookup()` 方法？用户可以关闭 `PersonEditor` 窗口。当窗口重新打开时，你希望确保 `PersonViewer`\
  \ 中当前选中的任何内容也出现在编辑器中。由于用户在 `PersonEditor` 窗口关闭期间可以进行选择更改，因此有必要在 `componentOpened()`\
  \ 中调用 `checkLookup()` 方法，而不是等待 `LookupListener` 事件来更新 `PersonEditor` 窗口。\n\n方法 `componentClosed()`\
  \ 负责移除 `LookupListener`。\n\n- 将以下代码添加到 `TopComponent` 生命周期方法 `componentOpened()`\
  \ 和 `componentClosed()` 中，如 列表 5.16 所示。\n\n列表 5.16 TopComponent `componentOpened()`\
  \ 和 `componentClosed()` 点击此处查看代码图片\n\n```java\n    @Override\n    public void componentOpened()\
  \ {\n        ftm = Lookup.getDefault().lookup(FamilyTreeManager.class);\n      \
  \  if (ftm == null) {\n            logger.log(Level.SEVERE, \"Cannot get FamilyTreeManager\
  \ object\");\n            LifecycleManager.getDefault().exit();\n        }\n   \
  \     configureListeners();\n        // 监听 PersonViewerTopComponent Lookup 中的 Person\
  \ 对象\n        TopComponent tc = WindowManager.getDefault().findTopComponent(\n \
  \               \"PersonViewerTopComponent\");\n        if (tc != null) {\n    \
  \        lookupResult = tc.getLookup().lookup(Person.class);\n            checkLookup();\n\
  \            lookupResult.addLookupListener(lookupListener);\n        }\n    }\n\
  \    @Override\n    public void componentClosed() {\n        lookupResult.removeLookupListener(lookupListener);\n\
  \    }\n```\n\n`LookupListener` 列表 5.17 显示了 `LookupListener` 的代码。`Lookup.Result`\
  \ 方法 `allInstances()` 返回当前 `Lookup` 中的 `Person` 对象集合。回想在 `TreeSelectionListener`\
