  \       if (!processed) {\n            XYChart.Data<String, Number> datum = new\
  \ XYChart.Data(\n                    sales.getSalesyear(), sales.getUnitsInmillions());\n\
  \            series.getData().add(datum);\n        }\n    }\n}\n```\n\n\n\n\n\n\
  # 16.5 关键点总结\n\n本章向你展示如何在 NetBeans Platform 应用程序中使用 RESTful Web 服务。以下是本章的关键点：\n\n\
  * 你可以使用 NetBeans IDE 的“从数据库创建 RESTful 服务”向导从从中创建 RESTful Web 服务。这会生成 Web 服务、实体类和数据库持久化单元。\n\
  * 你可以通过移动生成的注解，为 JPA 实体类添加 JavaFX 属性支持。这种方法使用访问器方法而非类字段来同步实体类与数据库。JavaFX 属性替换了类字段。访问器方法随后使用\
  \ JavaFX 属性来获取和设置数据。\n* 当你部署实现 Web 服务的应用程序时，你可以使用 NetBeans IDE 测试 RESTful Web 服务。\n\
  * Java 应用程序 Web 服务客户端可以帮助你正确为 RESTful Web 服务客户端配置库。\n* NetBeans IDE 向导可以为 NetBeans\
  \ Platform 模块生成 RESTful Web 服务客户端。然后你可以为该模块添加所需的库。\n* 添加封装的 JAR 包（Wrapped JARs）允许你在不创建封装库模块的情况下向模块中添加库。\n\
  * `SmartPhoneDataApp` 包含一个 `PhoneDataWebService` 模块，其中包含了 Jersey 客户端、实体类和服务提供者接口。\n\
  * 我们的应用程序包含两个窗口：带有 JavaFX `TableView` 控件的 `TableView` 窗口和一个带有 JavaFX `LineChart`\
  \ 的 `LineChart` 窗口。两个窗口都通过 RESTful 客户端访问数据。\n* JavaFX `Service` 类允许你构建可重用的 `Worker`\
  \ 对象，这些对象在后台线程中管理自己的执行。\n* `Service` 对象让你能够在 JavaFX 线程上安全地访问设置对象和返回对象。Service 对象适用于\
  \ RESTful Web 服务客户端。\n* JavaFX `TableView` 是一个通用控件，具有用于表格化数据可视化的 `TableColumns`。使用\
  \ `setCellValueFactory()` 方法来配置 `TableColumns`。\n* 使用 `TextFieldTableCell` 配置 `TableColumn`\
  \ 以创建一个用于编辑的 `TextField` 组件。使用 `setOnEditCommit()` 方法配置事件处理器来处理编辑。\n* `TableView`\
  \ 控件支持 `ObservableList`。使用带有比较器的 `SortedList` 进行排序，并使用带有过滤谓词的 `FilteredList` 进行过滤。\n\
  * 在配置 JavaFX 图表时，请在创建 `XYChart.Data` 对象之前对数据进行排序。这使得图表的绘制点以一致的顺序出现。\n\n# 17 品牌化、分发与国际化\n\
  \nNetBeans Platform 应用程序应该经过定制，以适应分发者和应用程序的用户。通过定制启动界面、应用程序标题和文本，你可以控制应用程序的外观和实用性。\n\
  \n本章向你展示如何对你的应用程序进行品牌化，使其能够正确反映应用程序的功能及其用户群体。你将学习如何配置应用程序的动态更新、创建分发文件，并为国际用户构建本地化版本。\n\
  \n## 你将学习到\n* 定制应用程序名称和标题。\n* 在应用程序标题中提供版本号。\n* 定制启动界面。\n* 定制资源包（Resource Bundles）中的文本。\n\
  * 启用你的应用程序的更新。\n* 构建更新中心。\n* 为你的应用程序创建分发文件。\n* 对你的应用程序进行国际化和本地化。\n\n## 17.1 什么是品牌化？\n\
  \n品牌化允许你通过显示名称、启动界面和用户看到的文本来定制你的应用程序。你还可以自定义资源包或修改窗口系统行为。（有关对窗口系统行为的修改，请参阅第 349\
  \ 页的“限制窗口系统的行为”）。\n\n在本节中，我们将向你展示如何修改应用程序的显示名称（其标题）以及顶级菜单栏中的名称。你还将学习如何定制应用程序的“品牌名称”并更改启动界面。\n\
  \n图 17.1 显示了来自第 5 章的运行应用程序。默认情况下，应用程序的品牌名称出现在顶级菜单（`familytreeapp`）。应用程序标题（`FamilyTreeApp`）出现在顶部的\
  \ `JFrame` 标题栏中，并带有构建号。让我们先向你展示如何更改项目名称、应用程序标题和品牌名称。\n\n![](img/image10361.jpg)\n\
  图 17.1 运行中的 FamilyTreeApp\n\n### 使用品牌菜单\n\n以下是使用项目的品牌菜单更改项目名称和应用程序标题的步骤。\n\n1. 在“项目（Projects）”窗口中右键点击项目名称，从右键菜单中选择“品牌（Branding）\
  \ . .”。NetBeans 显示品牌对话框，并选中“Basic”选项卡。\n2. 在“应用程序标题（Application Title）”文本框中提供另一个标题，如图\
  \ 17.2 所示。此菜单项会更改标题和项目名称。（注意，项目的目录名称不会更改。）\n\n![](img/image10369.jpg)\n图 17.2 品牌：用于更改应用程序标题的\
  \ Basic 对话框。\n3. 点击确定接受名称更改并重新运行应用程序。\n\n应用程序的标题和项目名称发生了变化，但品牌名称没有变化，它仍保持为 `familytreeapp`，如图\
  \ 17.3 所示。\n\n![](img/image10375.jpg)\n图 17.3 运行中的 MyTreeApp\n\n### 重命名品牌令牌（Branding\
  \ Token）\n\n使用以下步骤定制品牌令牌。\n\n1. 在“项目（Projects）”视图中，选择应用程序项目名称，右键点击并从右键菜单中选择“属性（Properties）”。在“项目属性”对话框中，选择“类别（Categories）”下的“应用程序（Application）”。\n\
  2. 将“品牌名称（Branding Name）”属性更改为 `familytreeapp` 并点击确定，如图 17.4 所示。\n\n![](img/image10383.jpg)\n\
  图 17.4 项目属性对话框，Application 类别\n图 17.5 显示 MyTreeApp 运行，顶级标题已更改为 `familytreeapp`。\n\
  \n![](img/image10388.jpg)\n图 17.5 顶级标题已更改\n\n当你修改应用程序的标题和品牌名称时，这将影响应用程序的项目属性文件（`project.properties`）和\
  \ NetBeans Platform 配置（`platform.properties`）。在项目属性文件中，`app.title`属性设置为 `FamilyTreeApp`。`app.name`属性为\
  \ `${branding.token}`。\n\n```properties\napp.name=${branding.token}\napp.title=FamilyTreeApp\n\
  ```\n\n`platform.properties` 文件定义了属性 `branding.token`如下：\n\n```properties\nbranding.token=familytreeapp\n\
  ```\n\n#### 品牌令牌提示\n注意，品牌令牌用于内部代码使用，而非面向用户。\n\n#### 令牌规则\n你可以更改品牌令牌，但它必须以小写字母开头并排除特殊字符。以下是\
  \ `branding.token` 名称的规则：\n1. 允许使用小写字母、数字和 `_`字符（下划线）。\n2. 品牌令牌必须以小写字母开头。\n3. `_`\
  \ 字符（下划线）后至少要有一个小写字母。\n\n如果你提供了非法的名称，品牌令牌对话框会提示你。\n\n\n\n\n\n`app.title=${app.name}`\
  \ [图 17.6] 显示了应用程序正在运行，其应用程序名称和标题均设置为 MyFamilyTreeApp（混合大小写）。[图 17.6] 还显示了 Mac OS\
  \ X 的强制退出应用程序列表，其中应用程序名为 MyFamilyTreeApp。![](img/image10412.jpg)图 17.6 正在运行的 MyFamilyTreeApp\
  \ 和强制退出应用程序（Mac OS X）\n\n## 自定义应用程序标题\n\n默认情况下，NetBeans 会在你的应用程序标题中包含 NetBeans IDE\
  \ 的构建版本。你可能更希望在标题中包含应用程序的版本号，而不是 NetBeans IDE 的构建版本。实现此目的的方法是修改应用程序 `Important Files`\
  \ 文件夹中的 `Build Script`。以下是具体步骤。\n\n1. 在 `Projects` 视图中，展开应用程序项目下的 `Important Files`\
  \ 节点。\n2. 向 `project.properties` 文件添加 `app.version` 属性。将其设置为应用程序所需的版本号。在这里，如[列表\
  \ 17.1] 所示，我们使用了 `3.2`。\n\n### 列表 17.1 项目属性—添加 app.version 属性\n\n```\napp.name=MyFamilyTreeApp\n\
  app.title=${app.name}\napp.version=3.2\nmodules=\\\n    ${project.com.asgteach.familytree.model}:\\\
  \n    ${project.com.asgteach.familytree.personviewer}:\\\n    ${project.com.asgteach.familtree.personeditor}:\\\
  \n    ${project.com.asgteach.familytree.manager.impl}\nproject.com.asgteach.familtree.personeditor=PersonEditor\n\
  project.com.asgteach.familytree.manager.impl=FamilyTreeManagerImpl\nproject.com.asgteach.familytree.model=FamilyTreeModel\n\
  project.com.asgteach.familytree.personviewer=PersonViewer\n```\n\n3. 双击 `Build Script`\
  \ 节点，将 `build.xml` 文件调入 XML 编辑器中。（`Build Script` 允许你对 NetBeans IDE 提供的基于 ANT 的构建系统进行更改）。\n\
  4. 添加如[列表 17.2]中加粗所示的 XML 代码。该构建脚本改编自 Tonny Kohar 的博客，地址为 [http://blogs.kiyut.com/tonny/2007/08/06/netbeans-platform-branding-and-version-info/]。\n\
  \n### 列表 17.2 构建脚本—在标题中显示应用程序构建信息\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n<!-- 你可以自由编辑此文件。 -->\n<!-- 查看 NetBeans 平台中的 harness/README -->\n<!-- 关于你可以做的一些的信息（例如，要覆盖的目标）。\
  \ -->\n<!-- 如果你删除此文件并重新打开项目，它将被重新创建。 -->\n<project name=\"FamilyTreeApp\" basedir=\"\
  .\">\n    <description>构建模块套 FamilyTreeApp。</description>\n    <!-- 覆盖 build 以添加更新的标识\
  \ -->\n    <target name=\"build\" depends=\"build-brand,suite.build\"/>\n    <target\
  \ name=\"build-brand\" depends=\"-init\">\n        <propertyfile\n            file=\"\
  ${basedir}/branding/core/core.jar/org/netbeans/core/startup/Bundle.properties\"\n\
  \            comment=\"Updated by build script\">\n            <entry key=\"currentVersion\"\
  \ value=\"${app.title} ${app.version} \" />\n        </propertyfile>\n        <propertyfile\n\
  \            file=\"${basedir}/branding/modules/org-netbeans-core-windows.jar/org/netbeans/core/windows/view/ui/Bundle.properties\"\
  \n            comment=\"Updated by build script\">\n            <entry key=\"CTL_MainWindow_Title\"\
  \ value=\"${app.title} ${app.version}\" />\n            <entry key=\"CTL_MainWindow_Title_No_Project\"\
  \ value=\"${app.title} ${app.version}\" />\n        </propertyfile>\n    </target>\n\
  \    <import file=\"nbproject/build-impl.xml\"/>\n</project>\n```\n\n\n\n\n图 17.7\
  \ 显示了与应用程序标题一起显示的自定义版本号![](img/image10435.jpg)图 17.7 在应用程序标题中显示自定义版本号\n\n## 品牌标识与资源包\n\
  现在让我们向您展示如何从应用程序标题中移除版本和构建信息。（如果您已经在 列表 17.1 和 列表 17.2 中添加了代码，您应先将其移除。）22。注意，您可以使用这些步骤修改任何\
  \ NetBeans Platform 模块中的菜单或对话框文本。\n\n1. 弹出品牌标识（Branding）对话框。\n2. 点击资源包（Resource\
  \ Bundles）选项卡。\n3. 在搜索窗口中，指定搜索字符串为 `MainWindow_Title`。NetBeans 显示两个项目，如 图 17.8 所示![](img/image10445.jpg)图\
  \ 17.8 更改您的应用程序标题的显示方式\n4. 对于这两个项目，右键点击属性条目并选择“Add to Branding”（添加到品牌标识）。NetBeans\
  \ 显示一个编辑对话框。移除 `{0}` 参数占位符，这将从标题中删除构建号。点击 OK 接受更改。在品牌标识对话框中，点击 OK 完成过程。\n5. 在文件（Files）视图中，如\
  \ 图 17.9 所示，展开品牌标识文件夹，并在编辑器中打开修改后的 `.properties` 文件![](img/image10452.jpg)图 17.9\
  \ 修改后的 Bundle.properties 文件\n\n通过此更改，您的应用程序 `JFrame` 将包含一个不带任何版本信息的标题。\n\n## 自定义启动界面\n\
  除非您提供自己的启动界面，否则应用程序将显示标准的 NetBeans Platform 启动界面。我们为 FamilyTreeApp 应用程序创建了一个自定义\
  \ PNG 启动界面。以下是将此自定义启动界面整合到应用程序的方法。\n\n1. 在项目（Projects）视图中，右键点击应用程序名称并从右键菜单中选择“Branding\
  \ . . .”。\n2. 选择启动界面（Splash Screen）选项卡并点击“Browse”（浏览）选择 `.gif` 或 `.png` 图形文件。\n\
  3. 调整进度条的颜色和位置，以及运行文本的大小、颜色和位置。图 17.10 显示了带有启动界面可调选项的对话框![](img/image10462.jpg)图\
  \ 17.10 自定义启动界面\n4. 点击 OK 接受设置。\n\n当您自定义启动界面时，NetBeans 会向项目属性文件添加以下条目。\n点击此处查看代码图像\n\
  ```\napp.icon=branding/core/core.jar/org/netbeans/core/startup/frame48.gif\n```\n\
  \n## 移除启动界面\n在应用程序的项目属性文件中添加以下行，以消除应用程序中的启动界面。\n```\nrun.args.extra=--nosplash\n\
  ```\n\n## 17.2 应用程序更新\n发布的应用程序会发生两个重要事件：发布和更新。您可以为您的 NetBeans Platform 应用程序生成安装程序，并为您的应用程序配置动态更新。然而，要使更新生效，您必须在应用程序中包含两个模块。安装这些模块后，用户可以通过访问更新中心（Update\
  \ Center）或单独安装下载的模块来更新应用程序。我们将先讨论应用程序更新，然后在下一节中介绍创建应用程序安装程序。为了向您展示这些功能，我们将使用在 第\
  \ 7 章中创建的 FamilyTreeApp（参见第 332 页上的“创建选择历史功能”）。\n\n### 启用您的应用程序更新\n要让用户动态更新您的 NetBeans\
  \ Platform 应用程序，您必须在平台集群中包含 `AutoUpdate Services` 和 `AutoUpdate UI` 模块，如下所示。\n\n\
  1. 在项目窗口中，右键点击 `FamilyTreeApp` 并从菜单中选择“Properties”（属性）。NetBeans 显示项目属性窗口。\n2. 在“Categories”（类别）下，选择“Libraries”（库）。在“Nodes”（节点）下，向下并展开平台集群。\n\
  3. 选择模块 `AutoUpdate Services` 和 `AutoUpdate UI`，如 图 17.11 所示。点击 OK![](img/image10480.jpg)图\
  \ 17.11 为 FamilyTreeApp 添加自动更新服务和 UI\n4. 运行 `FamilyTreeApp`。（注意，您必须执行“Clean and\
  \ Build”才能看到“Plugins”（插件）菜单。）您现在可以通过顶级菜单 `Tools | Plugins` 访问插件管理器。\n\n### 创建更新中心\n\
  本节向您展示如何为您的应用程序创建更新中心并通过应用程序的插件管理器激活它。更新中心由一个 `updates.xml` 文件和您的应用程序所有模块的最新版本组成。事实上，NetBeans\
  \ 会通过您的应用程序菜单为您构建这些文件。\n\n对于 FamilyTreeApp，按照以下步骤创建更新中心：\n* 在 NetBeans 的项目视图中，右键点击\
  \ `FamilyTreeApp` 项目并从菜单中选择“Package As | NBMs”。NetBeans 创建 `build/updates` 目录并包含\
  \ `updates.xml` 文件和您的应用程序 `NBM` 文件，如 图 17.12 所示![](img/image10491.jpg)图 17.12 创建中心\n\
  \n这是更新中心所需的内容。更新中心位于公共访问的 URL 或本地文件系统的目录（用于测试或本地使用）。在这里我们使用本地文件系统。现在您需要在应用程序内部配置更新中心。按照以下步骤操作：\n\
  1. 从顶级菜单选择 `Tools | Plugins`。NetBeans 显示插件管理器。\n2. 在插件管理器中，选择“Settings”（设置）。点击“Add”（添加）添加更新中心。\n\
  3. 在更新中心自定义器中，提供更新中心名称和 URL。可以使用之前步骤通过 `file://` 创建的 `updates` 目录位置，如 图 17.13 所示（或带有文件的适当\
  \ URL）。点击 OK![](img/image10501.jpg)图 17.13 更新中心自定义器\n\n图 17.14 显示了新自定义的 FamilyTreeApp\
  \ 更新中心。注意插件管理器现在“Installed”（已安装）选项卡下显示了六个插件![](img/image10507.jpg)图 17.14 自定义 FamilyTreeApp\
  \ 更新中心\n\n在应用程序中配置插件管理器后，现在让我们向您展示如何动态删除插件以及重新安装插件的几种选项。\n\n### 动态卸载模块（插件）\n让我们从\
  \ FamilyTreeApp 中移除 `SelectionHistory` 模块。回想第 7 章，FamilyTreeApp 在未安装此模块（插件）的情况下运行良好。要移除插件，运行\
  \ FamilyTreeApp 并按照以下步骤操作。\n\n1. 从顶级菜单选择 `Tools | Plugins`。NetBeans 打开插件管理器。\n2.\
  \ 选择“Installed”选项卡。在列表中选择插件 `SelectionHistory` 并点击“Uninstall”（卸载），如 图 17.15 所示![](img/image10517.jpg)图\
  \ 17.15 卸载插件\n3. NetBeans 开始插件卸载过程，如 图 17.16 所示。点击“Uninstall”。OEBPS/image10523.jpg)图\
  \ 17.16 插件卸载过程\n4. NetBeans 从 FamilyTreeApp 中移除 `SelectionHistory` 模块。您可以选择现在或稍后重启应用程序。点击\
  \ Finish（完成），如 图 17.17 所示![](img/image10528.jpg)图 17.17 现在重启或完成卸载过程\n\n### 向应用程序添加模块\n\
  您可以通过应用程序的更新中心或安装下载的 NetBeans 模块 (NBM) 向应用程序添加模块。两种选项都需要带有插件管理器的应用程序。让我们首先向您展示如何通过向\
  \ FamilyTreeApp 添加 `SelectionHistory` 模块来向运行的应用程序添加新的 NBM。这种情况适用于您已下载了 NBM 文件并现在希望在运行的应用程序中安装它。您使用插件管理器，但不需要访问更新中心。\n\
  \n### 创建模块 NBM\n要将 `SelectionHistory` 模块作为 NBM 添加到运行的应用程序中，您必须首先创建 NBM 文件（如果以前没有创建过）并以某种方式发送给用户。\n\
  \n1. 在项目视图中，右键点击项目 `SelectionHistory` 并从菜单中选择“Create NBM”（创建 NBM）。\n2. Net 构建模块并将\
  \ NBM 文件放置在 `modules build` 目录下，命名为 `com-asgteach-familytree-selectionhistory.nbm`。您可以使用文件窗口查看\
  \ NBM，如 图 17.18 所示![](img/image10539.jpg)图 17.18 为 SelectionHistory 模块创建 NBM\n\n\
  ### 安装下载的 NBM\n现在让按照以下步骤将模块添加到 FamilyTreeApp。\n\n1. 运行 FamilyTreeApp，从顶部菜单选择 `Tools\
  \ | Plugins`。NetBeans 打开插件管理器。\n2. 选择“Downloaded”选项卡，然后点击“Add Plugins . .”（添加插件），如\
  \ 图 17.19 所示![](img/image10548.jpg)图 17.19 为应用程序添加插件\n3. NetBeans 显示文件窗口。浏览包含 NBM\
  \ 的目录（在这里我们浏览到 `SelectionHistory` 项目下的 `build` 目录）并选择 NBM 文件，如 图 17.20 所示![](img/image10553.jpg)图\
  \ 17.20 选择 NBM 文件\n4. NetBeans 在“Downloaded”窗口中显示插件。选择插件 `SelectionHistory` 并点击“Install”（安装），如\
  \ 图 17.21 所示![](img/image10558.jpg)图 17.21 安装 SelectionHistory\n5. NetBeans 启动安装程序，引导您完成向\
  \ FamilyTreeApp 安装 NBM 的步骤，包括许可协议。安装完成后，点击 Finish（完成），然后关闭插件管理器。当插件管理器关闭，您将看到 SelectionHistory\
  \ 窗口在应用程序中打开。\n\n## 17.3 应用程序发布\nNetBeans IDE 允许您创建供用户安装应用程序的发布文件。您可以创建一个与 Windows、Linux、Mac\
  \ OS X 或 Solaris 兼容的安装程序。在创建发布的过程中，您可以包含一份自定义的许可协议。\n\n\n\n\n\n# 启用插件管理器\n\n在为您的应用程序创建发行版本之前，如果您想通过更新中心或单个\
  \ `NBM` 文件提供更新，则必须启用 `Plugin Manager`，具体见第 857 页的“启用应用程序的更新”描述。\n\n# 创建安装程序\n\n\
  默认情况下，NetBeans 假设您想创建一个与您的开发系统兼容的 `Installer`。要为其他系统创建安装程序，请使用如下 `Properties` 菜单。\n\
  \n1. 右点击 `FamilyTreeApp` 应用程序项目，从上下文菜单中选择 `Properties`。在 `Categories` 下，选择 `Installer`，如图\
  \ 17.23 所示。![](img/image10585.jpg)图 17.23 选择安装程序目标\n2. 选项包括 `Windows`、`Linux`、`Mac\
  \ OS X` 和 `Solaris`。勾选所有适用项。\n3. 对于应用程序许可（License），从下拉菜单中选择适用于您的应用程序选项，如图 17.24\
  \ 所示。如果您想提供自己的许可，选择 `Select license file . .`，并通过 `File Chooser` 选择一个包含许可文本的文本文件。该许可文本将在应用程序安装期间被使用。![](img/image10591.jpg)图\
  \ 17.24 选择安装程序目标\n4. 如果想减小安装程序的大小，请指定 `Use pack200 compression`。\n5. 点击 `OK` 设置\
  \ `Installer` 属性。\n6. 要创建安装程序，右点击项目 `FamilyTreeApp` 并从上下文菜单中选择 `Package as ... |\
  \ Installers`。NetBeans 会为指定的每个目标在应用程序的 `dist` 目录中构建安装程序（如图 17.25 所示），如下。![](img/image10598.jpg)图\
  \ 17.25 安装程序创建在项目的 dist 目录中\n\n点击此处查看代码图像\n适用于 [windows linux macosx] 的安装程序可用\n\n\
  ```\nat <full path>/FamilyTreeApp/dist\n```\n\n## 安装程序提示 创建安装程序可能需要很长时间。请在 NetBeans\
  \ IDE 的 Output 窗口中监控此。\n\n# 安装应用程序\n\n让我们向您展示在 Mac 安装过程。其他目标系统具有相似的安装过程。\n\n在 Mac\
  \ 上，一旦双击 `.zip` 或 `.tgz` 文件，您将看到一个可执行的 `Installer`。当您运行 `Installer` 时，`Installer`\
  \ 向导将引导您完成安装。图 17.26 显示了第一个面板。点击 `Next` 继续进入后续面板，这些面板包括 `License Agreement`、安装目录和图标创建，以及一个概括安装特性的摘要面板。![](img/image10614.jpg)图\
  \ 17.26 运行安装程序向导\n\n图 17.27 显示了安装完成后最后一个面板。您可以选择在点击 `Finish` 结束 `Installer` 向导时可选启动应用程序。![](img/image10619.jpg)图\
  \ 17.27 安装完成面板\n\n## 自定义安装程序图像\n\n默认的 `Installer` 使用标准图像用于 `Installer` 向导。您可以通过修改位于\
  \ NetBeans 安装目录下的标准 NetBeans 安装 (`nbi`) 层级结构中找到的图像文件来自定义这些图像，该目录位于 `<Your NetBeans\
  \ Installation>/harness/nbi`。[表 17.1 显示了标准 `Installer` 向导中使用的图像及其位置。您可以用自己的文件替换这些文件。重新生成\
  \ `Installer` 后，您将看到新图像。![](img/image10626.jpg)表 17.1 默认安装图像的位置和名称\n\n# 17.4 应用程序国际化\n\
  \n应用程序国际化是为一个或多个区域配置应用程序。国际化包括目标语言翻译以及外观的本地化，例如数字格式化和货币符号。国际化是一个大的话题，但通过一个示例，您将很好地理解这些问题。\n\
  \n我们对上一章介绍的 `SmartPhoneDataApp` 国际化，并针对英语、西班牙语和葡萄牙语对应用程序进行了本地化。（关于此应用程序的描述，请参见第\
  \ 800 页的“RESTful Web Services and the NetBeans Platform”。）33。图 17.28 显示了 TableView\
  \ 窗口。图 17.29 显示了 LineChart 窗口。![](img/image0636.jpg)图 17.28 TableView 窗口\n\n## 国际化与\
  \ Java\n\nJava 和 NetBeans 一直支持国际化。您可以在以下 URL 找到帮助的文档：\n- `http://docs.oracle.com/javase/tutorial/i8n/`—国际化学习\n\
  - `http://docs.oracle.com/javase/7/technotes/guides/intl/`—国际化技术指南\n- `http://bits.netbeans.org/dev/javadoc/org-openide-modules/doc-files/i18n-branding.html`—NetBeans\
  \ 国际化与品牌指南\n\n## 国际化与 NetBeans 平台\n\n让我们描述如何对您的应用程序进行国际化，并提供 `SmartPhoneDataApp`\
  \ 的示例。通常过程包括以下步骤：\n1. 识别所有需要本地化的文本并分配一个在包内唯一的键。\n2. 在特定语言属性文件中提供这些文本的翻译。\n3. 使用\
  \ `@Messages` 注解（下文所述）定义文本的键值属性。\n4. 为模块提供本地化的 JAR 文件（将在节讨论）。\n\n## Messages 注解\n\
  \nNetBeans 平台提供了 `@Messages` 注解来隔离本地化文本。您将所有的键值字符串直接放在 Java 源文件中。此注解会生成 `Bundle.properties`\
  \ 文件并根据消息键创建静态方法。键在同一包内必须唯一。您可以在 Java 文件中拥有多个 `@Messages` 注解。例如，当您创建一个 `TopComponent`\
  \ 时，NetBeans 会为您生成一个初始的 `@Messages` 注解。\n\n```java\n@Messages({\n    \"HINT_TableViewTopComponent=This\
  \ is a TableView window\",\n    \"CTL_TableViewAction=TableView\",\n    \"CTL_TableViewTopComponent=TableView\
  \ Window\"\n})\n...\n\nsetName(Bundle.CTL_TableViewTopComponent());\nsetToolTipText(Bundle.HINT_TableViewTopComponent());\n\
  ```\n\n`@Messages` 注解生成的静态方法如下：\n- 在您的模块的 `build/classes-generated/your_package_name`\
  \ 中生成一个带有静态方法的 `Bundle.java` 文件。\n\n```java\npackage com.asgteach.coretableview;\n\
  \n/** {@link com.asgteach.coretableview} 的本地化字符串。 */\n@javax.annotation.Generated(value=\n\
  \    \"org.netbeans.modules.openide.util.NbBundleProcessor\")\nclass Bundle {\n\n\
  \    /**\n     * @return <i>TableView</i>\n     */\n\n```\n\n\n\n\n\n```java\n/**\n\
  \ * @see TableViewTopComponent\n */\nstatic String CTL_TableViewAction() {\n   \
  \ return org.openide.util.NbBundle.getMessage(Bundle.class,\n                  \
  \  \"CTL_TableViewAction\");\n}\n\n/**\n * @return TableView Window\n * @see TableViewTopComponent\n\
  \ */\nstatic String CTL_TableViewTopComponent() {\n    return org.openide.util.NbBundle.getMessage(Bundle.class,\n\
  \                    \"CTL_TableViewTopComponent\");\n}\n\n. . .\n}\n```\n\n此文件会在你保存\
  \ Java 源文件时进行更新，为你提供带有本地化字符串的静态方法提供编辑时的源码检查。这种编辑时的源码检查可以避免运行时的出现 `MissingResourceException`\
  \ 错误。\n* 构建系统随后会编译你的 Java 类（包括 `Bundle.java`），并在 `build/classes/your_package_name`\
  \ 目录下生成正确的 `Bundle.properties` 文件。（资源属性文件由类加载器加载。）\n* 在 `@Messages` 注解中配置的键值对将为该包创建默认消息程序包。在国际化应用程序时，你可以根据需要构建备选的\
  \ `Bundle.properties` 文件，如下所示。\n* 要为其他区域创建消息程序包，请为支持的每种区域创建 `Bundle_xx.properties`\
  \ 文件。使用两个字符的语言代码或带有分隔符的四个字符组合 `language_region` 代码。例如，支持葡萄牙语的属性文件使用后缀 `_pt`，而针对巴西的葡萄牙语后缀为\
  \ `pt_BR`，如下：`Bundle_pt.properties`、`Bundle_pt_BR.properties`。\n* 当用户运行你的应用程序时，将应用用户的默认\
  \ `Locale`。如果用户的 `Locale` 与提供的任何 `.properties` 文件都不匹配，则应用默认的消息程序包。\n\n### 数字格式化\n\
  \nJava 的 `NumberFormat` 类支持 `Locales`。因此，如果你的应用程序显示数字数字，你可以使用 `NumberFormat` 结合默认区域对其进行格式化。例如，在[Listing\
  \ 17.3]所示的 `SmartPhoneDataApp` 中的 `DecimalFormat` 类实例化了一个带有默认 `Locale` 的 `NumberFormat`\
  \ 对象。`toString()` 方法调用 `NumberFormat.format()` 方法进行区域敏感的格式化。同样，`fromString()` 方法接受用于就地编辑器的特定区域的小数位和数字分隔符。注意，在第\
  \ 869 页[Figure 17.28]所示的西班牙语和葡萄牙语 `TableView` 窗口中，小数点分隔符都是逗号。\n\n#### Listing 17.3\
  \ DecimalFormat.java\n```java\nprivate class DecimalConverter extends StringConverter<BigDecimal>\
  \ {\n    NumberFormat nf = NumberFormat.getInstance(Locale.getDefault());\n\n  \
  \  public DecimalConverter() {\n        nf.setMaximumFractionDigits(2);\n      \
  \  nf.setMinimumFractionDigits(1);\n    }\n\n    @Override\n    public String toString(BigDecimal\
  \ t) {\n        try {\n            return nf.format(t);\n        } catch (Exception\
  \ e) {\n            return null;\n        }\n    }\n\n    @Override\n    public\
  \ BigDecimal fromString(String string) {\n        try {\n            Number newValue\
  \ = nf.parse(string);\n            BigDecimal result = new BigDecimal(newValue.doubleValue());\n\
  \            return result.setScale(2, BigDecimal.ROUND_HALF_EVEN);\n        } catch\
  \ (ParseException e) {\n            return null;\n        }\n    }\n}\n```\n\n###\
  \ 属性编辑\n\n`@Messages` 注解生成默认的 `Bundle.properties` 文件。要支持额外的区域，你必须为每个支持的区域创建 `Bundle.properties`\
  \ 文件。你可以单独编辑这些文件，也可以一起编辑。[Figure 17.30]显示了 NetBeans IDE 对 `en`、`es` 和 `pt_BR` 的\
  \ `Bundle.properties` 文件的同步编辑能力。默认语言是空的，因为这些字符串是由 `@Messages` 注解生成的。\n\n### 国际化与\
  \ JavaFX\n\n`SmartphoneDataApp` 窗口包含 JavaFX 内容。在构建 JavaFX 场景时，你可以指定一个 `ResourceBundle`，通常在\
  \ `TopComponent` 代码中。JavaFX 控制器类使用 `@Messages` 静态方法，并可以使用 `@Messages` 注解定义额外的键值对。[Listing\
  \ 17.4]显示了如何调用 `FXMLLoader` 为 `TopComponent` 代码中由 `TableView.fxml` 描述的场景图设置资源。\n\
  \n#### Listing 17.4 TableViewTopComponent.java—Initializing ResourceBundle\n```java\n\
  final class TableViewTopComponent extends TopComponent {\n    private static JFXPanel\
  \ fxPanel;\n    private TableViewController controller;\n    private final ResourceBundle\
  \ resources;\n\n    public TableViewTopComponent() {\n        initComponents();\n\
  \        resources = ResourceBundle.getBundle(\"com.asgteach.coretableview.Bundle\"\
  , Locale.getDefault());\n        setName(Bundle.CTL_TableViewTopComponent());\n\
  \        setToolTipText(Bundle.HINT_TableViewTopComponent());\n        setLayout(new\
  \ BorderLayout());\n        init();\n    }\n\n    public void init() {\n       \
  \ fxPanel = new JFXPanel();\n        add(fxPanel, BorderLayout.CENTER);\n      \
  \  Platform.setImplicitExit(false);\n        Platform.runLater(() -> createScene());\n\
  \    }\n\n    private void createScene() {\n        try {\n            URL location\
  \ = getClass().getResource(\"TableView.fxml\");\n            FXMLLoader fxmlLoader\
  \ = new FXMLLoader();\n            fxmlLoader.setResources(resources);\n       \
  \     fxmlLoader.setLocation(location);\n            fxmlLoader.setBuilderFactory(new\
  \ JavaFXBuilderFactory());\n            Parent root = (Parent) fxmlLoader.load(location.openStream());\n\
  \            fxPanel.setScene(new Scene(root));\n            controller = (TableViewController)\
  \ fxmlLoader.get();\n        } catch (IOException e) {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n通过 `Bundle.properties` 文件，你可以像[Figure 17.30]所示那样使用\
  \ `%key` 记法。这里是定义 `TableView` 及其列的 FXML 部分：\n\n```xml\n<TableView fx:id=\"table\"\
  \ editable=\"true\" GridPane.columnIndex=\"0\" GridPane.rowIndex=\"0\">\n    <columns>\n\
  \        <TableColumn fx:id=\"colCompany\" text=\"%company\" sortable=\"false\"\
  \ minWidth=\"150\" />\n        <TableColumn fx:id=\"colYear\" text=\"%year\" sortable=\"\
  false\" minWidth=\"150\" />\n        <TableColumn fx:id=\"colUnitsSold\" text=\"\
  %unitsSold\" editable=\"true\" sortable=\"false\" minWidth=\"175\" />\n    </columns>\n\
  </TableView>\n```\n\n注意，然而`%key` 跳过了对有效键的编译时检查。在使用不存在的键时，你会得到如下异常：\n```\nSEVERE\
  \ [org.openide.util.Exceptions]\njavafx.fxml.LoadException: Resource \"blahblah\"\
  \ not found.\n```\n\n为了保留 `@Messages` 的编译时安全防护，请将 FXML 文本属性初始化移动到控制器代码，如下所示。在这里我们调用\
  \ `setText()` 方法并传入对应键的 `Bundle` 静态方法：\n\n```java\n@Override\n```\n\n\n\n\n\n```java\n\
  public void initialize(final URL url, final ResourceBundle resources) {\n    . .\
  \ .\n    colCompany.setText(Bundle.company());\n    colYear.setText(Bundle.year());\n\
  \    colUnitsSold.setText(Bundle.unitsSold());\n    . . .\n}\n```\n\n### 测试目标区域设置\n\
  \n通过在应用程序的 `project.properties` 文件中定义带有目标区域 `run.args.extra` 属性，可以针对不同的区域测试您的应用程序，如列表\
  \ 17.6 所示。在这里，默认区域语言更改为 `pt_BR`（巴西葡萄牙语）。`project.properties` 文件显示于 NetBeans Platform\
  \ 应用程序项目项目视图中的 `Important Files` 节点下。\n\n列表 17.6 应用程序的 `project.properties` 文件 点击此处查看代码图像\n\
  \n```\napp.name=${branding.token}\napp.title=SmartPhoneDataApp\n# 若要测试新的区域，请取消下面行的注释\n\
  # 并指定您的目标区域\nrun.args.extra=run.args.extra=-J-Duser.language=pt -J-Duser.region=BR\n\
  modules=\\\n    ${project.com.asgteach.coretableview}:\\\n    ${project.com.asgteach.phonedata.webservice}:\\\
  \n    ${project.com.asgteach.linechart}:\\\n    ${project.com.asgteach.phonedatashareimpl}\n\
  project.com.asgteach.coretableview=CoreTableView\nproject.com.asgteach.linechart=LineChart\n\
  project.com.asgteach.phonedata.webservice=PhoneDataWebService\nproject.com.asgteach.phonedatashareimpl=PhoneDataShareImpl\n\
  ```\n\n\n\n\n\n# NetBeans Platform 国际化\n\n前面的步骤展示了如何对应用程序中提供的文本进行国际化/本地化。然而，由于你是在\
  \ NetBeans Platform 之上构建，仍然存在菜单、工具提示、错误消息和其他源自 NetBeans Platform 模块的文本。这些内容将保持为英文，除非你提供了包含本地化属性包的\
  \ JAR 文件。Geertjan Wielenga 为这种本地化方法提供了指导。\n\nNetBeans IDE（因此以及 NetBeans Platform）支持以下语言：\n\
  * 巴西葡萄语（区域设置 `pt_BR`）\n* 俄语（区域设置 `ru`）\n* 日语（区域设置 `ja`）\n* 简体中文（区域设置 `zh_CN`）\n\n\
  在 NetBeans IDE 下载页面（`https://netbeans.org/downloads/`）上指定这些语言之一，你可以安装 IDE 的国际版本。（此版本也包含英语）。安装了国际版本后，你可以在自己的\
  \ NetBeans Platform 应用程序中使用本地化的 JAR 文件。以下是添加巴西葡萄语支持的步骤。我们将继续使用本章描述的 `SmartPhoneDataApp`。\n\
  \n1. 下载并安装 NetBeans IDE 的国际版本。\n2. 在国际版本的 IDE 中打开 `SmartPhoneDataApp`。\n3. 在应用程序的\
  \ `project.properties` 文件中指定目标区域以便测试，如第 `876` 页的 `Listing 17.6` 所示。\n4. 使用国际版本的\
  \ NetBeans IDE 运行应用程序。你会看到 NetBeans Platform 模块显示巴西葡萄语。\n\n## 创建本地化应用程序包\n\n之前的步骤使用来自\
  \ NetBeans IDE 国际版本的本地化包测试了应用程序。接下来的步骤对于在 NetBeans IDE 环境之外作为独立应用程序运行你的的本地化版本是必要的。\n\
  \n为此，你必须将 NetBeans 分发版中的本地化 JAR 文件（包含在 IDE 的国际版本中）复制到你的应用程序中。此外，为了创建本地化支持模块化结构，请为每个目标区域创建一个模块。例如，以下是添加巴西葡萄语支持的步骤。\n\
  \n1. 在 `SmartPhoneDataApp` 中创建一个名为 `Locale_PT_BR` 的新模块，代码名为 `com.asgteach.localeptbr`。\n\
  2. 切换到文件视图（File view），并在顶层创建以下文件夹。这些文件夹将与 `nbproject` 和 `src` 处于同一级：\n    * `release/core/locale`\n\
  \    * `release/lib/locale`\n    * `release/modules/locale`\n3. 现在浏览到 NetBeans IDE\
  \ 安装目录并找到 `platform/core/locale`、`platform/lib/locale` 和 `platform/modules/locale`\
  \ 文件夹。对于巴西葡萄语支持，将所有以 `pt_BR.jar` 结尾的 JAR 文件复制到 `release` 目录下 `Locale_PT_BR` 模块中相应的文件夹中，如图\
  \ 17.31 所示（`release/modules/locale` 下的 JAR 文件列表已截断）。\n\n![](img/image10747.jpg)\n\
  图 17.31 为 NetBeans Platform 添加本地化属性包\n4. 对于每个支持的语言，创建一个包含这些发布文件夹的模块，用于存放上述步骤中的 NetBeans\
  \ Platform locale JAR 文件。\n\n使用这种模块化方法，用户可以动态添加或删除 NetBeans Platform 模块的语言支持（参见第\
  \ `860` 页的“动态卸载模块（插件）”和第 `861` 页的“向应用程序添加模块”）。\n\n`Figure 17.32` 显示了具有葡萄语本地化顶级菜单和\
  \ NetBeans Platform 模块本地化包菜单项目的 `SmartPhoneDataApp`。\n\n![](img/image10755.jpg)\n\
  图 17.32 具有本地化 NetBeans Platform 模块的 SmartPhoneDataApp\n\n注意，你的应用程序可能不需要完整的 locale\
  \ JAR 文件。然而，例如巴西葡萄语的整个 JAR 文件组并不占用多少空间。\n\n## 其他语言的本地化支持\n\n除了此处介绍的信息外，NetBeans.org\
  \ 创建了一个 NetBeans 本地化项目。请参见 Geertjan Wielenga 发表的博客文章：`https://blogs.oracle.com/geertjan/entry/lightweight_process_for_translating_netbeans`。\n\
  \n尽管 NetBeans IDE 为 NetBeans 官方支持的语言提供了本地化包，但你可能希望支持其他语言。坦率地说，由 Tim Veenstra 领导的\
  \ Sense 团队发布了额外语言的翻译。这些本地化 JAR 来自 NetBeans Platform。\n\n现在让我们访问该项目以支持西班牙语。以下是使用模块化方法的步骤：\n\
  \n1. 在 `SmartPhoneDataApp` 中创建一个名为 `Locale_ES` 的新模块，代码名为 `com.asgteach.localees`。\n\
  2. 切换到文件视图，并创建与为葡萄语时相同的顶层文件夹：`release/core/locale`、`release/lib/locale` 和 `release/modules/locale`。\n\
  3. 访问 `https://java.net/projects/nb-library-wrappers/sources/core/show/lib-platform`\
  \ 下载你目标语言所需的 JAR。对于西班牙语，下载以 `_es` 结尾的 JAR 文件。或者，检出整个项目以访问所有文件。\n4. 填充 `Locale_ES`\
  \ 模块中的 locale 文件夹，如图 17.33 所示（`modules/locale` 下的 JAR 文件列表已截断）。\n\n![](img/image10772.jpg)\n\
  图 17.33 向 Locale_ES 模块添加本地化 JAR 文件\n\n`Figure 17.34` 显示了具有西班牙语本地化顶级菜单和菜单项目的 `SmartPhoneDataApp`。\n\
  \n![](img/image10778.jpg)\n图 17.34 具有本地化 NetBeans Platform 模块的 SmartPhoneDataApp\n\
  \n## 自定义资源包\n\n你添加到模块 locale 目录的 JAR 文件是资源包（Resource Bundles）。如果翻译不完整或你想修改特定的翻译，可以对它们进行自定义。\n\
  \n例如，在我们获得的西班牙语版本中，`Figure 17.34` 显示“查看”（Ver）菜单下的“仅显示编辑器”（Show Only Editor）菜单项没有翻译。以下是修复此遗漏的方法。\n\
  \n1. 在 `SmartPhoneDataApp` 项目视图中，右键点击应用程序名称并在从菜单中选择 `Branding...`。\n2. 选择国际化资源包（Internationalization\
  \ Resource Bundles）选项卡，并选择要修改的区域。在这里，我们指定西班牙语的区域 `es`。\n3. 使用搜索字段查找目标文本，如图 17.35\
  \ 所示（此处，我们搜索“Only Editor”）。\n\n![](img/image10788.jpg)\n图 17.35 选择目标区域并提供搜索字符串\n\
  \n\n\n\n\n### 搜索技巧\n如果目标搜索字符串是带有加速键的菜单项（如我们的示例所示），请在搜索时在加速字母前包含一个取和符号 `&`。或者，尝试限制搜索词范围。\n\
  \n\n\n\n## 4. 右键点击目标文本并选择**添加到品牌 (Add to Branding)**。在对话框中，提供翻译后的文本并点击**确定 (OK)**。NetBeans\
  \ 会更改与 `es` 资源包关联的值，如图 17.36 所示。点击**确定**关闭品牌对话框。\n\n![](img/image10798.jpg)\n图 17.36\
  \ 对所选的键值对进行修改\n\n## 5. **Files** 视图显示 NetBeans 在 `branding/modules` 文件夹下创建了文件 `Bundle_es.properties`（展开\
  \ JAR 文件下的目录层次结构）。图 17.37 显示了编辑器中的目录层次结构和对应的 `.properties` 文件。\n\n![](img/image10803.jpg)\n\
  图 17.37 添加到品牌创建了 `Bundle_es.properties` 文件\n\n现在，当你重新运行 `SmartPhoneDataApp` 时，**仅显示编辑器\
  \ (Show Only Editor)** 菜单项具有西班牙语翻译，如图 17.38 所示。\n\n![](img/image10808.jpg)\n图 17.38\
  \ 包含本地化菜单项的 SmartPhoneDataApp\n\n## 17.5 重点总结\n\n本章介绍了如何对应用程序进行品牌化、为用户提供发布文件和更新，以及对应用程序进行国际化和本地化。以下是本章的关键点：\n\
  \n*   **品牌 (Branding)** 允许自定义应用程序名称、标题、启动界面以及应用程序资源包中的任何文本。\n*   使用**品牌 (Branding)**\
  \ 对话框更改应用程序标题。\n*   使用**属性 (Properties)** 对话框更改应用程序的品牌名称。品牌名称主要供内部使用，对其格式有限制。\n\
  *   在应用程序的**项目属性 (Project Properties)** 文件中修改 `app.name` 属性，以自定义应用程序在顶级菜单和操作系统任务管理器中显示的名称。\n\
  *   你可以自定义应用程序标题，以包含你自己的版本号（而不是 NetBeans IDE 的构建版本号）。你也可以从标题中删除任何版本信息。\n*   使用**品牌\
  \ (Branding)** 对话框自定义应用程序的启动界面。你还可以修改进度条的显示方式以及运行文本的位置、字体大小和颜色。\n*   为了让用户能够动态更新\
  \ NetBeans Platform 应用程序，请包含**自动更新服务 (AutoUpdate Services)** 和**自动更新 UI (AutoUpdate\
  \ UI)** 模块。\n*   使用应用程序的**打包为 NBMs (Package As | NBMs)** 菜单为**更新中心 (Update Center)**\
  \ 创建内容。\n*   使用**插件管理器 (Plugin Manager)** 为你的应用程序配置**更新中心 (Update Center)**。\n*\
  \   使用**插件管理器 (Plugin Manager)** 动态安装和卸载应用程序中的模块。\n*   你可以创建发布文件以便户安装你的应用程序。NetBeans\
  \ 支持 Windows、Linux、Mac OS X 和 Solaris。\n*   你可以通过提供自己的**许可协议 (License Agreement)**\
  \ 和安装程序图像来自定义安装程序。\n*   应用程序国际化意味着为一个或多个区域（locales）配置应用程序。\n*   应用程序国际化的第一步是隔离其文本。\n\
  *   NetBeans Platform 的 `@Messages` 注解为存储在资源包中的键值属性提供编辑时检查。\n*   Java 的 `NumberFormat`\
  \ 类对区域敏感，你的应用程序中使用的任何数字都可以本地化。\n*   NetBeans IDE 允许同时编辑多个 `.properties` 文件。\n* \
  \  你可以轻松地将 JavaFX 代码国际化。我们建议使用 `@Messages` 注解以保留键值属性的编辑时检查。\n*   向应用程序的**项目属性 (Project\
  \ Properties)** 文件中添加 `-J-Duser.language` 和 `-J-Duser.region` 属性以测试目标区域。\n*   NetBeans\
  \ Platform 正式支持英语、巴西葡萄语、俄语、日语和简体中文。下载国际版 IDE 以访问这些区域的本地化 JAR 文件并将其添加到应用程序中。\n* \
  \  你可以访问 `AgroSense` 社区项目，该项目支持其他语言的包本地化。参见 java.net 上的 NetBeans 本地化项目，描述位于 [https://blogs.oracle.com/geertjan/entry/lightweight_process_for_translating_netbeans]。\n\
  *   使用**品牌 (Branding)** 对话框中的**国际化资源包 (Internationalization Resource Bundles)**\
  \ 选项卡自定义应用程序中的任何本地化 JAR 文件。\n\n## 索引\n（为了简洁，省略了索引内容）\n\n"
