  \ 12.34 显示进度条——已完成 40%\n\nWizardDescriptor.BackgroundInstantiatingIterator``BackgroundInstantiatingIterator`\
  \ 也是 `AsynchronousInstantiatingIterator` 的子接口，你必须重写相同的方法。对于此迭代器，`WizardDescriptor`\
  \ 会关闭向导（当成功完成时），然后在后台线程中调用 `instantiate()` 方法。由于控制权返回给了调用者方法，因此当向导完成时，实例化的对象是不可用的。当使用\
  \ `BackgroundInstantiatingIterator` 时，你负责为用户处理 GUI 反馈和进度，并捕获在 `instantiate()` 方法中抛出的任何异常。`BackgroundInstantiatingIterator`\
  \ 适用于运行时间较长的实例化，或者不希望向导保持打开的情况。\n\n## 12.10 关键点总结\n\n引导用户通过多个步骤创建一个或多个构制品的流程被称为向导。NetBeans\
  \ 平台提供了一个多类框架，允许你为应用程序构建向导。向导框架具有以下特性：\n\n* 参与向导的类包括 `WizardDescriptor`、向导面板类（每个步骤一个）、视觉面板类、向导迭代器以及向导操作类。\n\
  * 向导中的每个步骤都包含一个视觉组件和一个控制器（向导面板）。向导面板创建其视觉面板，获取用户输入并更新面板状态。\n* 向导由 `WizardDescriptor`\
  \ 控制。`WizardDescriptor` 负责在向导中逐步步进（使用迭代器）、维护状态并更新视觉组件的按钮（帮助、上一步、下一步、取消和完成）。\n* `WizardDescriptor`\
  \ 在每个步骤的开始时调用向导面板方法 `readSettings()`，以便向导面板可以从 `WizardDescriptor` 读取状态并配置该步骤的视觉面板。\n\
  * `WizardDescriptor` 在每个步骤结束时调用向导面板方法 `storeSettings()`，以便向导面板可以将状态存储到 `WizardDescriptor`\
  \ 中。\n* 当向导的步骤顺序和数量固定时，使用 `Static` 步骤序列。当用户输入影响步骤的顺序或数量时，使用 `Dynamic` 步骤序列。\n* 使用标准的\
  \ `DialogDisplayer` 方法 `notify()` 来启动向导。返回值 `WizardDescriptor.FINISH_OPTION` 表示向导正常完成。\n\
  * 在视觉面板中创建公共的 getter 方法以获取用户输入。\n* 在视觉面板中使用监听器来响应用户输入的变化。向导面板变为属性更改监听器，以响应用户输入的变化。\n\
  * 通常情况下，向导面板实现用户输入验证，并通知 `WizardDescriptor` 当前面板有效性的发生变化。\n* 使用 `WizardDescriptor`\
  \ 属性缓存来存储状态，并与其他面板协调输入。\n* `Simple Validation API` 提供了适用于视觉面板输入的验证器。这减少了向导导面板中繁琐且冗余的验证代码。\n\
  * 如果向导面板可以提前结束，请实现接口 `WizardDescriptor.FinishablePanel` 并重写方法 `isFinishPanel()`。当面板的可完成状态发生变化时，向导面板必须触发状态更改事件以通知\
  \ `WizardDescriptor`。\n* 要异步验证用户输入，请在向导面板实现接口 `WizardDescriptor.AsynchronousValidatingPanel`。重写在主线程中访问的\
  \ `prepareValidation()` 方法以及在后台线程中调用的 `validate()` 方法。`WizardDescriptor` 在用户点击“下一步”后调用这些方法。在异步验证期间，“取消”按钮处于激活状态。\n\
  * 当面板之间的验证运行时间不长时，同步验证是恰当的。实现接口 `WizardDescriptor.ValidatingPanel` 并重写方法 `validate()`。\n\
  * 动态序列向导包含一个 `Wizard Iterator` 类，允许你控制向导序列。\n* 当用户输入导致向导序列变化时，使用属性更改事件从向导面板与 `Wizard\
  \ Iterator` 进通信。\n* 向导框架包含了几个实例化迭代器。在用户完成向导后，`WizardDescriptor` 会调用方法 `instantiate()`，根据获取的输入创建一个或多个构制品。\n\
  * 根据你使用的实例化迭代器，`WizardDescriptor` 会以同步、异步、带有 `ProgressBar` 的异步或作为后台任务的方式调用 `instantiate()`\
  \ 方法。\n\n# 13. 文件系统\n\nNetBeans 平台文件系统 API 为标准 Java 文件提供了一种抽象。通过文件系统 API，你可以执行所有预期的文件操作，如创建、重命名和删除文件及文件夹。你可以使用\
  \ `IOStreams` 读写文件并使用方便方法进行读取。此外，NetBeans 平台通过为文件和文件夹提供属性增强了这种抽象。你还可以使用 `FileChangeListeners`\
  \ 监控文件系统层级的变化。\n\n本章将通过几个示例探索文件系统 API。你还将学习 `Layer` 文件、它如何影响你应用程序的配置数据，以及如何访问和贡献这些配置信息。\n\
  \n## 你将学习到\n* 使用文件系统 API 类 `FileSystem`、`FileObject` 和 `FileUtil` 探索面向文件的操作。\n*\
  \ 使用文件属性来存储有关文件和文件夹的信息。\n* 使用 `FileChangeListener` 监控文件和文件夹的变化。\n* 使用 `Output` 窗口显示状态信息。\n\
  * 在你的 NetBeans 平台应用程序中包含 `Favorites` 窗口以便在 UI 中访问本地文件系统。\n* 在模块中安装并访问文件。\n* 创建并修改模块的\
  \ `Layer` 文件。\n* 以程序方式访问 `SystemFileSystem`。\n\n## 13.1 文件系统 API\n\n到目前为止，我们构建的应用程序将数据持久化在数据库或内存中。第\
  \ 10 章 开发的 `FamilyTree` 应用程序使用创建、读取、更新和删除的 CRUD 操作让用户操作数据。然而，该应用程序没有执行任何文件级操作。\n\
  \n在本章中，我们将检查文件系统 API，它允许操作磁盘、ZIP 文件或 XML 文件中的文件和文件夹。首先，我们将通过一个创建并操作本地文件系统文件夹和文件的应用程序来探索文件系统\
  \ API。接下来，我们将向你展示如何使用文件系统 API 的 `FileChangeListener` 监控文件。你还将学习如何在 NetBeans 应用程序中包含文件以及如何通过程序访问它们。最后，我们将检查\
  \ `Layer` 文件，它是 NetBeans 应用程序 `FileSystem` 的网关，并向你展示如何访问此文件。在构建这些示例的过程中，你还将学习使用\
  \ `Favorites` 窗口并将信息写入 `Output` 窗口。\n\n## 13.2 文件系统 API 概述\n\n让我们从文件系统 API 的概述开始，这是\
  \ NetBeans 用于操作文件和目录的 API。NetBeans 平台文件系统 API 为虚拟文件提供了支持。这些文件（或文件夹）可能位于磁盘、内存、JAR\
  \ 或 ZIP 文件、远程服务器上，甚至作为 XML 文档中的元素。文件系统 API 通过三个主要类提供了这种抽象：`FileSystem`（`FileObjects`\
  \ 的层级集合）、`FileObject`（`java.io.File` 的抽象）以及 FileUtil（一个具有许多操作 `FileSystem`、`FileObjects`\
  \ 以及标准 `java.io.File` 的工具类）。\n\n`FileSystem` 是 `FileObjects` 的集合，例如你的计算机文件系统或单个\
  \ JAR 文件。`FileSystem` 是层级的并有一个根。FileSystem 抽象允许从不同的物理源查看数据。\n\n`FileObject` 代表 `FileSystem`\
  \ 中的文件或目录（文件夹）。`FileObject` 必须存在于 `FileSystem` 中（类似于 `java.io.File`），并具有 MIME 类型（决定如何处理文件），但与\
  \ `FileObject` 关联的数据只是原始数据（在下一章检查数据 API 时，MIME 类型将变得清晰）。如果 `FileObject` 代表文件夹，你可以删除、创建或获取其“子节点”（子文件夹或文件）。你使用\
  \ `InputStream` 读取 `FileObjects` 并使用 `OutputStream` 写入它们。你还可以使用方便方法 `asBytes()`\
  \ 读取 `FileObjects`，或者在文本文件的情况下使用 `asLines()` 和 `asText()`。\n\n`FileObject` 还包含了属性的支持。属性是使用\
  \ `String` 标识的任意对象，可以通过 getter 和 setter 访问。文件系统 API 根据 `FileObject` 的路径在应用程序用户目录的名为\
  \ `attributes.xml` 的 XML 文件中存储这些 `String`/对象对。\n\n通过 `FileChangeListener`，文件系统 API\
  \ 支持文件创建、文件夹创建、重命名、文件修改、删除或属性更改等事件的通知。你可以使用 FileUtil 向 `java.io.File` 对象添加 `FileChangeListener`。你还可以向文件夹添加递归监听器，接收所提供文件夹下的所有文件和文件夹的变化事件。根据层级的大小和底层文件系统的性质，递归监听器处理事件的开销可能很大。从\
  \ JDK 7 开始，Java 还通过 `java.nio.FileSystem`、`Path` 和 `WatchServices` 支持文件更改事件。在这里，我们注册一个\
  \ `WatchService` 来监听关键事件。这是一个底层机制，对于考虑底层操作系统的差异是必要的。相比之下，NetBeans 平台能够提供事件监听通知，因为\
  \ NetBeans 平台文件系统 API 提供了传统 Java `File` 类之上的抽象。通常，事件通知适用于应用程序内部发生的文件系统修改。应用程序外部修改的事件通知可能不会被你的程序接收。\n\
  \n### 探索 FileSystem API\n\n`FileSystem`、`FileObject` 和 `FileUtil` 都包含操作文件的方法。让我们通过构建一个执行文件操作并在\
  \ `Output` 窗口显示信息的 NetBeans 平台应用程序来探索这些几个方法，所示图 13.1。这种文件系统探索通过名为 Explore File Actions\
  \ 的操作激活，添加到工具栏和顶部工具菜单。![](img/image7968.jpg)图 13.1 探索文件系统 API\n\n`Explore File Actions`\
  \ 菜单项执行多个操作。首先，操作在用户的本地文件系统中创建一个和一个文本文件。接下来，操作向文件写入文本并读回文本。最后，操作重命名文本文件并将其删除。在此过程中，该操作在\
  \ `Output` 窗口中显示每一步。\n\n构建这些应用程序需要以下步骤：\n* 创建一个名为 `FileSystemApp` 的 NetBeans 平台应用程序。\n\
  * 创建一个名为 `FSExploration` 的模块。\n* 为顶部工具菜单和工具栏创建并注册新操作。\n* 为文件系统 API、I/O API 以及 Lookup\
  \ API 添加依赖。\n\n### 创建 NetBeans 应用程序\n\n以下是创建 `FileSystemApp` 和模块的步骤：\n1. 使用 NetBeans\
  \ 向导创建一个名为 `FileSystemApp` 的应用程序。\n2. 创建 `FSExploration` 模块，如图 13.2 所示。![](img/image794.jpg)图\
  \ 13.2 应用程序和模块\n\n### 添加操作\n\n在顶部工具菜单和工具栏中创建并注册新操作。\n1. 菜单项\n2. 这种文件系统探索通过一个名为 Explore\
  \ File Actions 的操作激活，我们添加到工具栏和顶部工具菜单。\n\n\n\n\n\n```java\n@ActionID(\n    category\
  \ = \"Tools\",\n    id = \"com.asgteach.fsexploration.ExploreFileAction\"\n)\n@ActionRegistration(\n\
  \    iconBase = \"com/asgteach/fsexploration/ExploreFS.png\",\n    displayName =\
  \ \"#CTL_ExploreFileAction\"\n)\n@ActionReferences({\n    @ActionReference(path\
  \ = \"Menu/Tools\", position = 0, separatorAfter = 50),\n    @ActionReference(path\
  \ = \"Toolbars/File\", position = 300)\n})\n@Messages({\n    \"CTL_ExploreFileAction=Explore\
  \ File Actions\",\n    \"CTL_FileActionTab=Explore File Actions\"\n})\npublic final\
  \ class ExploreFileAction implements ActionListener {\n    private final InputOutput\
  \ io;\n    private final OutputWriter writer;\n\n    public ExploreFileAction()\
  \ {\n        io = IOProvider.getDefault().getIO(Bundle.CTL_FileActionTab(), false);\n\
  \        writer = io.getOut();\n    }\n\n    private void displayMessage(String\
  \ msg) {\n        writer.println(msg);\n    }\n\n    @Override\n    public void\
  \ actionPerformed(ActionEvent e) {\n        // TODO implement action body\n    }\n\
  }\n```\n\n现在，让我们通过重写的 `actionPerformed()` 方法，来了解“探索文件”菜单项所执行的不同文件操作活动。我们将分章节讨论其实现代码。\n\
  \n### 清空并选择输出窗口\n\n每当用户调用“探索文件”菜单项时，我们都会清除输出窗口并选中其标签卡。（由于输出窗口可以在多个执行多个任务的模块之间共享，因此使用\
  \ `io.select()` 选择标签卡可以让与此 `InputOutput` 对象关联的内容可见。）列表 13.2 显示了这段代码。请注意，`reset()`\
  \ 方法（在输出窗口的 `OutputWriter` 上调用）需要捕获 `IOException`。\n\n列表 13.2 方法 actionPerformed—清空并选择输出窗口\n\
  \n```java\n@Override\npublic void actionPerformed(ActionEvent e) {\n    try {\n\
  \        writer.reset();             // 每次清除窗口\n    } catch (IOException ex) {\n\
  \        Exceptions.printStackTrace(ex);\n        return;\n    }\n    io.select();\
  \                 // 选择此标签卡\n    displayMessage(\"Exploring NetBeans Platform FileObjects:\"\
  );\n    // ...\n}\n```\n\n### 创建文件夹\n\n在文件系统 API 中，目录被称为“文件夹”（folders），因此我们将使用这一术语。我们首先调用系统属性来查找用户的家目录，并为其下方的子文件夹创建一个标准的\
  \ Java `java.io.File` 对象。然而，创建 `File` 对象并不意味着目标文件夹 `FamilyTreeData` 一定存在。\n\n接下来，我们使用\
  \ `FileUtil.ToFileObject()` 方法从文件创建一个 `FileObject`。如果文件夹不存在，`FileUtil` 方法将返回 `null`。然后，我们使用\
  \ `FileUtil.createFolder()` 方法创建文件夹。列表 13.3 显示了这段代码。\n\n列表 13.3 方法 actionPerformed—创建文件夹\n\
  \n```java\n@Override\npublic void actionPerformed(ActionEvent e) {\n    // ...\n\
  \    // 在用户主目录查找\n    String home = System.getProperty(\"user.home\");\n    File\
  \ dir = new File(home + \"/FamilyData\");\n    FileObject myfolder = FileUtil.toFileObject(dir);\n\
  \    if (myfolder == null) {\n        displayMessage(\"Creating folder \" + dir.getPath());\n\
  \        try {\n            // 创建文件夹\n            myfolder = FileUtil.createFolder(dir);\n\
  \        } catch (IOException ex) {\n            Exceptions.printStackTrace(ex);\n\
  \        }\n    }\n    // ...\n}\n```\n\n### 在文件夹中获取或创建文件\n\n下一步是检查 `myfile.txt`\
  \ 是否存在，如果不存在则创建它，如列表 13.4 所示。在这里，我们使用了父文件夹 `FileObject` 实例中的方法。`myfolder` 可以通过 `getFileObject()`\
  \ 方法返回单个条目，我们在此处用它来检查 `myfolder` 是否包含我们的目标文件。你也可以通过 `getChildren()` 方法将文件夹的子项作为\
  \ `FileObjects` 数组返回。与之前一样，返回 `null` 值表示文件不存在。在这种情况下，我们使用 `FileObject` 方法 `createData()`\
  \ 在 `myfolder` 文件夹中创建文件。（`createData()` 方法用于创建一个文件，而 `createFolder()` 方法创建一个文件夹。）\n\
  \n以下是几个返回文件名和/或路径的 `FileObject` 方法：\n- `getPath()`—返回 `FileObject` 的完整路径。\n- `getName()`—获取不包含扩展名的文件或文件夹名。\n\
  - `getExt()`—获取文件或文件夹的扩展名。\n- `getNameExt()`—获取包含扩展名的文件或文件夹名。\n\n列表 13.4 方法 actionPerformed—创建文件\n\
  \n```java\n@Override\npublic void actionPerformed(ActionEvent e) {\n    // ...\n\
  \    if (myfolder != null) {\n        displayMessage(\"Using folder \" + myfolder.getPath());\n\
  \        // 此文件夹中是否存在名为 myfile.txt 的文件\n        FileObject myfile = myfolder.getFileObject(\"\
  myfile.txt\");\n        if (myfile == null) {\n            // 没有，创建文件\n        \
  \    displayMessage(\"Creating file \" + myfolder.getPath() + \"/myfile.txt\");\n\
  \            try {\n                // 创建文件\n                myfile = myfolder.createData(\"\
  myfile.txt\");\n            } catch (IOException ex) {\n                displayMessage(\"\
  Can't create file \" + myfolder.getPath() + \"/myfile.txt\");\n                Exceptions.printStackTrace(ex);\n\
  \            }\n        }\n    }\n    // ...\n}\n```\n\n### 写入和读取文件\n\n我们已经创建了一个文本文件。现在让我们向其中写入一些文本，将其读取回并显示在输出窗口中。列表\
  \ 13.5 显示了这段代码。首先确保 `myfile` 不为 `null`，并检查是否可以使用 `canWrite()` 方法进行操作。接下来，我们使用 try-with-resources\
  \ 语句从文件的输出流获取 `PrintWriter`。使用 try-with-resources，`PrintWriter` 会自动关闭，因此我们不需要在 `finally`\
  \ 块中调用 `close()`。try-with-resources 语句是在 JDK 7 中引入的。我们使用 `println()` 方法向文件写入三行文本，然后读取。`FileObject`\
  \ 提供了以下方便的读取方法（所有方法都会抛出 `IOException`）：\n- `asLines()`—逐行读取完整文本并返回 `List<String>`。\n\
  - `asLines(String encoding)`—使用指定的编码逐行读取完整文本并返回 `List<String>`。\n- `asText()`—读取完整文本并返回\
  \ `String`。\n- `asText(String encoding)`—使用指定的编码读取完整文本并返回 `String`。\n- `asBytes()`—读取文件并返回字节数组。\n\
  \n 列表 13.5 方法 actionPerformed—写入和读取文件\n\n```java\n@Override\npublic void actionPerformed(ActionEvent\
  \ e) {\n    // ...\n    if (myfile != null) {\n        // 向文件写入一些文本\n        if\
  \ (myfile.canWrite()) {\n            displayMessage(\"can write \" + myfile.getPath());\n\
  \            try (PrintWriter output = new PrintWriter(myfile.getOutputStream()))\
  \ {\n                output.println(\"This is some text\");\n            }\n   \
  \     }\n    }\n}\n```\n\n\n\n\n```java\nfor (int i = 0; i < 2; i++) {\n    output.println(\"\
  Line number \" + (i + 2));\n}\ndisplayMessage(\"Text written to file \" + myfile.getNameExt());\n\
  } catch (IOException ex) {\n    displayMessage(\"Warning: problems writing file\
  \ \" + myfile.getNameExt());\n    Exceptions.printStackTrace(ex);\n}\n}\n```\n\n\
  \n\n\n## 文件系统 API 有用方法\n\n[Table 13.1] 提供了 `FileObject` 可用方法列表。（这是一个部分列表。鼓励读者访问文件系统\
  \ API 文档以获取完整列表。）在此表中，`fo` 代表 `FileObject`（文件或文件夹），`folder` 代表 `FileObject` 文件夹。\n\
  \n![](img/image8084.jpg)\n表 13.1 使用 `FileObject` 的文件系统 API 有用方法\n\n[Table 13.2]\
  \ 提供了实用类 `FileUtil` 可用方法的部分列表。这些都是静态方法。在此表中，`fo` 代表 `FileObject`（文件或文件夹），`file`\
  \ 代表 `java.io.File`，`folder` 代表 `FileObject` 文件夹。\n\n![](img/image8090.jpg)\n表 13.2\
  \ 使用 `FileUtil` 的文件系统 API 有用方法\n\n## 13.3 监控文件更改\n\nNetBeans 平台文件系统 API 的巨大优势之一是你可以为\
  \ `FileObjects` 绑定 `FileChangeListeners`。你还可以为目录树中的文件夹绑定递归的 `FileChangeListeners`。在本节中，我们将为上一节中构建的\
  \ `FileSystemApp` 添加一个新模块，向你展示如何监控文件系统的更改。\n\n### FileObject 属性\n\n对于此文件监控，我们将使用\
  \ `FileObject` 属性功能，它允许将任意对象与 `FileObjects` 关联。这些属性在应用程序重启后仍然存在，并存储在应用程序的用户目录下（也就是说，它们并不存储在文件中）。在开发过程中，当你执行项目的清理（Clean）时，存储序列化属性的\
  \ `attributes.xml` 文件会被删除。\n\n我们在本节中还会引入 `Favorites` 窗口。当你在应用程序包含平台集群（platform cluster）中的\
  \ `Favorites` 模块时即可启用此功能。以下是创建和配置此新模块的步骤摘要：\n\n- 从平台集群包含 `Favorites` 和 `Templates`\
  \ 模块。（`Templates` 模块允许你从 `Favorites` 窗口创建空文件和文件夹。）\n- 为 `FileSystemApp` 应用程序添加新模块\
  \ `ChangeDetector`。\n- 为 `ChangeDetector` 模块添加一个新窗口（`TopComponent`）。\n- 为 `ChangeDetector`\
  \ 模块添加对文件系统 API 和 I/O API 的依赖。\n- 实现 `TopComponent` 代码，以显示本地磁盘上用户文件系统的部分。显示使用 `FileObject`\
  \ 的属性来指示该文件最近的修改。`TopComponent` 使用 `FileChangeListener` 将事件通知消息报告到输出窗口中的新标签页，并刷新\
  \ `TopComponent` 的显示。\n\n[Figure 13.5] 显示了该应用程序运行时，左侧是 `Favorites` 窗口，编辑器位置是 `ChangeDetector`\
  \ 窗口。输出窗口出现在下方，带有两个标签页：之前构建的 `Explore File Actions` 标签和一个名为 `Watch Directory` 的新标签页。\n\
  \n![](img/image8106.jpg)\n图 13.5 带有 `ChangeDetector` 窗口的 `FileSystemApp`。\n\n该应用程序报告从用户目录下的\
  \ `FamilyTreeData` 目录开始的文件系统的任何更改。在调用上一节的 `Explore File Actions` 菜单项后，`Watch Directory`\
  \ 输出窗口将创建、重命名和删除文本文件的更改。\n\n让我们为你展示如何构建这些窗口，从 `Favorites` 窗口开始。\n\n### Favorites\
  \ 窗口\n\n`Favorites` 窗口允许你查看本地文件系统中的文件，并创建新的空文件和文件夹（当你也添加了 `Templates` 模块时）。\n\n\
  一旦安装了 `Favorites` 模块，顶层窗口菜单中会出现一个操作，以资源管理器模式打开 `Favorites` 窗口。按照以下步骤在 `FileSystemApp`\
  \ 应用程序包含 `Favorites` 和 `Templates` 模块：\n\n1. 在 Projects 视图中右键点击项目 `FileSystemApp`，并在右键菜单中选择\
  \ `Properties`。\n2. 在 `Categories` 下，选择 `Libraries`。NetBeans 列出了所有按集群组织 get 平台模块。在\
  \ cluster platform 下，选择模块 `Favorites` 和 `Templates`。点击 OK。\n\n![](img/image8117.jpg)\n\
  图 13.6 在 cluster platform 中选择 `Favorites` 和 `Templates` 模块。\n\n3. 现在运行 `FileSystemApp`\
  \ 应用程序。当应用程序启动时，打开顶层 `Window` 菜单并选择 `Favorites`。这会在资源视图中打开 `Favorites` 窗口。\n\n![](img/image8123.jpg)\n\
  图 13.7 选择菜单项 `Favorites` 以打开 `Favorites` 窗口。\n\n4. 展开顶层目录（本地文件系统上的主目录）。你可以选择性地将文件夹添加到\
  \ `Favorites` 窗口或从其移除。\n5. 尝试不同的文件操作。在选定的文件夹中使用右键点击 `New | All Templates` 创建新文件夹。在\
  \ `Choose Template` 对话框中，展开 `Other` 并选择 `Folder`。点击 Next。提供新的 `Folder Name` 并点击\
  \ `Finish`。\n6. 使用 `New | All Templates` 创建一个新的空文件。现在展开 `Other`，选择 `Empty File`\
  \ 并点击 `Next`。在 `New Object Name` 对话框中提供文件名。如果扩展名被识别并对应于文本文件（例如 `.txt` 或 `.xml`），NetBeans\
