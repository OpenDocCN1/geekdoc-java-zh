  \n* * *\n\n### 重新排序与索引 Index.Support\n\n你可以通过两种方式重新排序组。你可以选择 `GroupNode` 的 `Change\
  \ Order` ... 菜单项（参见 `Figure 9.23`），或者选择 `PersonNode` 的右键菜单 `Move Up` 或 `Move Down`（参见\
  \ `Figure 9.24`）。以下是用 `GroupNode` 和 `PersonNode` 实现重排序的步骤：\n\n1. 在 `GroupNode` 中，在\
  \ `getActions()` 方法中包含 `ReorderAction`，如 `Listing 9.20` 所示。这将菜单项 `Change Order`\
  \ ... 放入 `GroupNode` 的右键菜单中。\n2. 为 `GroupNode` 的 `Lookup` 添加 `Index.Support` 的实现，覆盖\
  \ `getNodes()`、`getNodeCount()` 和 `reorder()` 方法，如 `Listing 9.20` 所示。这将启用 `Change\
  \ Order` ... 菜单项。`reorder()` 方法操作模型（`PersonModel`）。Listing 9.20 `GroupNode.java—Index.Support\
  \ Implementation`\n\n```java\npublic class GroupNode extends AbstractNode {\n  \
  \  ...\n    private GroupNode(PersonGroup group, final PersonModel personModel,\n\
  \                      InstanceContent ic) {\n        super(Children.create(new\
  \ PersonChildFactory(personModel), false),\n              new AbstractLookup(ic));\n\
  \        ...\n        // 一个实现 Index.Support 的支持类。\n        // 该类必须在 Node 的 Lookup\
  \ 中，以支持\n        // Reorder 操作以及子节点的向上和向下移动操作。\n        instance.add(new Index.Support()\
  \ {\n            @Override\n            public Node[] getNodes() {\n           \
  \     return getChildren(true);\n            }\n            @Override\n        \
  \    public int getNodeCount() {\n                return getNodes().length;\n  \
  \          }\n            // reorder\n            @Override\n            public\
  \ void reorder(int orderIndex) {\n                personModel.reorder(orderIndex);\n\
  \            }\n        });\n    }\n    @Override\n    public Action[] getActions(boolean\
  \ context) {\n        return new Action[]{\n            ReorderAction.get(ReorderAction.class),\n\
  \            PasteAction.get(PasteAction.class)\n        };\n    }\n}\n```\n\n*\
  \ * *\n\n3. `PersonNode` 在其 `getActions()` 方法中包含 `MoveUpAction` 和 `MoveDownAction`，如\
