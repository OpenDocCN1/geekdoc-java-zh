  \ 实现包含了 `call()` 方法。如果 `call()` 方法返回 `true`，则系统将继续关闭。如果你没有提供 `@OnStop` `Callable`，则会被授予许可。如果关闭获得批准，所有注册的\
  \ `@OnStop` `Runnables` 都将被调用以执行任何模块或系统清理。`Runnables` 并行调用，并在关闭完成之前执行。例如，在 `DataInstaller`\
  \ 相同的模块和包中添加名为 `DataRemover` 的类。Listing 5.21 显示了应用程序退出时从 `FamilyTreeManager` 存储中移除测试数据的代码。（并没有实际操作，但你可以看到\
  \ `@OnStop` `Runnables` 的形式。）\n\nListing 5.21 FamilyTreeModel—DataRemover 类\n点击此处查看代码图片\n\
  \n* *\n\n```java\npackage com.asgteach.familytree.model.data;\n\n. . . imports omitted\
