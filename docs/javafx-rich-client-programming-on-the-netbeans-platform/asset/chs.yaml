  \ NotifyDescriptor 消息类型\n\n`NotifyDescriptor.Confirmation`\n\n在继续之前确认或验证操作是应用程序中的常见需求。标准的确认对话框使用“问题”标题，并提供“是”、“否”和“取消”按钮选项。你可以检查用户的响应（以及\
  \ `NotifyDescriptor.CLOSED_OPTION`）并做出做出反应。图 11.4 显示了标准的确认对话框。![](img/image6841.jpg)图\
