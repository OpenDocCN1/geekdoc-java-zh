  7. 现在双击该按钮，这将创建方法 `openPersonButtonActionPerformed()`（该方法将在用户点击按钮时被调用）。NetBeans\
  \ 现在会切换到 `OpenTopComponent` 的 `Source` 视图。\n8. 为方法 `openPersonButtonActionPerformed()`\
