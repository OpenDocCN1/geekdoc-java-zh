  \ 12.33 OrderPizza 向导完成\n\n## 12.9 向导实例化迭代器\n\n当你选择“动态步骤序列”（Dynamic Step Sequence）来构建向导时（正如我们在上一节中所做的那），NetBeans\
  \ 为你提供了一个实现了 `WizardDescriptor.Iterator<WizardDescriptor>` 的 `WizardIterator` 类。正如你在\
  \ `PizzaWizardIterator` 中看到的，该类提供了迭代器方法并构建了你的向导面板对象的 `ArrayList`。属性监听器会根据用户输入按需调整面板序列。\n\
  \nNetBeans 平台提供了此标准迭代器类的替代方案，允许你在向导完成时构建目标产物。让我们讨论这些实例化迭代器，并向你展示它们是如何工作的。\n\n> 提示：即使你没有动态更改向导步骤序列，可能也想要使用实例化迭代器之一。在这种情况下，在“新建向导”向导中选择动态步骤序列，并将\
  \ `WizardDescriptor.Iterator` 替换在本节中讨论的实例化迭代器之一。\n\n\n\n\n\n### WizardDescriptor.InstantiatingIterator\n\
  \n所有的迭代器类都是 `WizardDescriptor.InstantiatingIterator` 的替代方案，该类继承自 `WizardDescriptor.Iterator`。要使用它们，请将代码中的\
  \ `WizardDescriptor.Iterator` 替换为替代类之一，并重写必要的方法。\n\n所有实例化迭代器类都包含 `instantiate()`\
  \ 方法，它允许迭代器类从向导过程中构建构制品。`WizardDescriptor` 在向导成功完成后调用 `instantiate()`，并且（在大多数情况下）阻塞向导直到该方法完成。\n\
  \n在 `instantiate()` 内部，你构建（实例化）向导应该创建的任何对象。一个典型的用例是 NetBeans IDE 中的“新项目”（New Project）向导。在这里，IDE\
  \ 会根据项目类型和用户提供的输入在目标用户目录中创建许多文件和目录。\n\n当调用方法以 `WizardDescriptor.FINISH_OPTION` 状态完成向导时，`instantiate()`\
  \ 已经执行。你可以通过 `WizardDescriptor` 方法 `getInstantiatedObjects()` 访问实例化的对象。\n\n如果 `instantiate()`\
  \ 因任何原因失败，你应该抛出 `IOException`。在这种情况下，`WizardDescriptor` 会保持向导打开，用户有机会更改面板输入。在用户点击“完成”（Finish）后会再次调用\
  \ `instantiate()` 方法。失败的原因通常超出普通验证，但包括实例化期间创建文件或目录时的错误等。\n\n`initialize()` 方法允许你初始化迭代器所需的任何对象。这里的一个典型用例是存储\
  \ `WizardDescriptor` 对象，以便迭代器在 `instantiate()` 中可以访问 `WizardDescriptor` 的属性缓存。\n\
  \n`uninitialize()` 方法执行取消任务。当向导因所有关闭选项关闭时（而不仅仅是 `FINISH_OPTION`），将调用此方法。\n\n表 12.4\
  \ 列出了当您在使用 `WizardDescriptor.InstantiatingIterator` 时需要重写的这些额外方法。\n\n![](img/image7871.jpg)\n\
  **表 12.4 WizardDescriptor.InstantiatingIterator 方法**\n\n### WizardDescriptor.AsynchronousInstantiatingIterator\n\
  \n`AsynchronousInstantiatingIterator` 是 `InstantiatingIterator` 的子接口。它具有相同的方法，但\
  \ `instantiate()` 方法是在事件分发线程（EDT）之外调用的。然而，向导仍然保持打开状态，这意味着你可以像上面那样通过在 `instantiate()`\
  \ 中抛出 `IOException` 来处理错误。注意，在 `instantiate()` 运行时，用户无法取消或关闭向导。\n\n### WizardDescriptor.ProgressInstantiatingIterator\n\
  \n`ProgressInstantiatingIterator` 是 `AsynchronousInstantiatingIterator` 的子接口。它定义了带有\
  \ `ProgressHandle` 参数的 `instantiate()` 方法。要使用此迭代器，你必须添加 Progress API 的依赖。`WizardDescriptor`\
  \ 会实例化 `ProgressHandle` 对象，但 `instantiate()` 方法必须启动、更新并完成进度条。与 `AsynchronousInstantiatingIterator`\
  \ 一样，`instantiate()` 方法是在 EDT 线程之外调用的。让我们修改 `PizzaWizard` 以使用 `ProgressInstantiatingIterator`。以下是步骤：\n\
  \n1. 在模块 `New Pizza` 中添加对 Progress API 的新依赖。\n2. 使 `PizzaWizardIterator` 实现 `WizardDescriptor.ProgressInstantiatingIterator`，并让\
  \ NetBeans 为 `instantiate()`、`instantiate(ProgressHandle)`、`initialize()` 和 `uninitialize()`\
  \ 生成方法。\n3. 为这些方法提供实现，如代码列表 12.31 所示。注意 `PizzaWizardIterator` 除新方法外均保持不变。\n\n我们在\
  \ `initialize()` 方法中初始化私有类字段 `wizard`。这使我们能够访问 `WizardDescriptor` 的属性缓存，以便我们可以检索用户提供的所需输入。\n\
  \n`instantiate(ProgressHandle)` 执行了之前在 `Order Pizza actionPerformed()` 方法中执行的工作。我们从属性缓存获取\
  \ `Customer` 和 `PizzaOrder` 对象，构建披萨，将 `Customer` 存储在 `CustomerStore` 中，并在 `instantiate()`\
  \ 方法的返回对象返回 `PizzaOrder`。\n\n我们使用 `Thread.sleep()` 模拟长时间运行的过程，并使用 `ProgressHandle`\
  \ 方法 `progress()` 定期更新进度条。\n\n如果客户是“JoeCriminal”，我们抛出 `IOException`。`WizardDescriptor`\
  \ 会捕获此并将焦点返回向导，以便用户纠正任何问题。当用户点击“完成”时，`WizardDescriptor` 会再次调用 `instantiate()`。\n\
  \n最后，我们重写 `instantiate()` 以防止 `WizardDescriptor` 调用无参数的版本，因为在使用 `ProgressInstantiatingIterator`\
  \ 时不应调用该版本。\n\n**代码列表 12.31 PizzaWizardIterator—使用进度条**\n\n```java\npublic final\
  \ class PizzaWizardIterator implements\n        WizardDescriptor.ProgressInstantiatingIterator<WizardDescriptor>,\n\
  \        PropertyChangeListener {\n\n    private int index;\n    private List<WizardDescriptor.Panel<WizardDescriptor>>\
  \ panels;\n    private WizardDescriptor wizard = null;\n\n. . . 省省略未的代码 . . .\n\n\
  @Override\n    public Set<PizzaOrder> instantiate(ProgressHandle ph) throws IOException\
  \ {\n        Set<PizzaOrder> pizzaSet = new HashSet<>();\n        PizzaOrder p =\
  \ (PizzaOrder) wizard.getProperty(\n            BuildPizzaController.PROP_PIZZA_ORDER);\n\
  \        pizzaSet.add(p);\n        Customer customer = (Customer) this.wizard.getProperty(\n\
  \            IdentifyCustomerController.PROP_CUSTOMER);\n        // 模拟长时间运行的多步骤任务：\n\
  \        ph.start(5);\n        try {\n            ph.progress(\"Storing customer\
  \  \" + customer.getName(), 1);\n            Thread.sleep(1500);\n            if\
  \ (customer.getName().contains(\"JoeCriminal\")) {\n                throw new IOException(\"\
  \ Cannot sell to JoeCriminal\");\n            }\n            CustomerStore custStore\
  \ = Lookup().lookup(CustomerStore.class);\n            if (custStore != null) {\n\
  \                custStore.store(customer);\n            }\n            ph.progress(\"\
  Building \" + p.getSize() + \" pizza\", 2);\n            Thread.sleep(2000);\n \
  \           ph.progress(\"Place \" + p.getToppings().toString(), 3);\n         \
  \   Thread.sleep(2000);\n            ph.progress(\"Cooking pizza\", 4);\n      \
  \      Thread.sleep(2000);\n            ph.progress(\"Ready!\", 5);\n          \
  \  Thread.sleep(2000);\n        } catch (InterruptedException e) {\n           \
  \ Exceptions.printStackTrace(e);\n        }\n        ph.finish();\n        return\
  \ pizzaSet;\n    }\n\n    @Override\n    public Set instantiate() {\n        assert\
  \ false : \"This method cannot be called if the class implements WizardDescriptor.ProgressInstantiatingIterator.\"\
  ;\n        return null;\n    }\n\n    @Override\n    public void initialize(WizardDescriptor\
  \ wd) {\n        this.wizard = wd;\n    }\n\n    @Override\n    public void uninitialize(WizardDescriptor\
  \ wd) {\n        this.panels = null;\n        this.wizard = null;\n    }\n}\n```\n\
  \n4. 修改 `Order Pizza` 方法 `actionPerformed()`，如代码列表 12.32 所示。注意 `DialogDisplayer`\
  \ 方法 `notify()` 会阻塞直到用户成功完成且向导方法 `instantiate()` 完成。这允许你通过 `WizardDescriptor` 方法\
  \ `getInstantiatedObjects()` 访问在 `instantiate()` 方法中创建的任何对象\n\n**代码列表 12.32 OrderAction\
