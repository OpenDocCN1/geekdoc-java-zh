  \ XML 元素提供颜色编码、语法检查、Schema 代码补全、格式化，以及你可能从一个复杂的 XML 编辑器中期望的许多操作。以下是将 XML 编辑器添加到我们的应用程序的步骤。\n\
  \n1. 在 `Projects`（项目）视图中，右键点击应用程序名称 (`FamilyTreeApp`）并选择 `Properties`（属性）。\n2. NetBeans\
  \ 显示 `Project Properties`（项目属性）对话框。选择类别 `Libraries`（库）。\n3. NetBeans 显示构成 NetBeans\
  \ 平台的各种集群中可用的所有模块。\n4. 在 `Platform Modules`（平台模块）窗口中，展开节点 `ide`，如第 733 页上的 图 14.26\
  \ 所示。(OEBPS/image9129.jpg)图 14.26 添加 XML 文本编辑支持的模块\n5. 选择 表 14.1 列出的 `ide` 集群中的模块。这些模块将在你的应用程序中配置一个具有颜色编码、格式化和\
  \ XML 验证的完整、高级的 XML 编辑器。(OEBPS/image9134.jpg)![](img/image9138.jpg) 表 14.1 XML 编辑模块\n\
  \n在包含 XML 编辑器模块并安装了新的 `FileType` 后，你现在可以在你的应用程序中编辑 `FamilyTree` XML 文件了。\n\n## 添加上下文相关操作\n\
