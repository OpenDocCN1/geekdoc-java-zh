  \ Color.LIGHTBLUE);\n        scene.getStylesheets().add(\"myrectanglefxapp/MyCSS.css\"\
  );\n        stage.setScene(scene);\n        stage.show();\n    }\n\n    public static\
  \ void main(String[] args) {\n        launch(args);\n    }\n}\n```\n\n在 FXML 中指定样式表也是可能的，如列表\
  \ 3.6 所示。注意，你必须包含 `java.net.*` 来定义元素 URL。\n\n列表 3.6 MyRectangleFX.fxml—添加样式表点击此处查看代码图像\n\
