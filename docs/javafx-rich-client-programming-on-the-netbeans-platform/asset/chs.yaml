  \n首先，我们查找 `PhoneDataShare` 的服务提供提供者（Service Provider）。这是我们调用 Web 服务调用以访问数据并在用户编辑表格时更新持久化存储的方法。\n\
  \n接下来，我们使用 `setCellValueFactory()` 方法配置 `TableColumns` 以配置所有三列。对于 `Units Sold`（销售量）列，我们调用\
  \ `setCellFactory()` 方法创建一个用于编辑的 `TextField` 控件。我们还定义了一个转换器，在编辑期间在 `BigDecimal`\
  \ 和 `String` 之间转换值。\n\n`onEditCommit()` 事件处理器（为 `Units Sold` 列定义）会更新表格中已编辑的数据，并调用\
  \ `PhoneDataShare` 服务提供者的 `updateSales()` 方法。该方法最终会使用新数据调用之前定义的 JavaFX Service 以及\
  \ `ProgressIndicator` 控件（`progress`）。更新后的 `Salesdata` 值可以通过 `CellEditEvent` 对象 `t`\
  \ 获取。如果从 `String` 到 `BigDecimal` 的类型转换失败，转换器将返回 `null`。在这种情况下，处理器将保持旧数据完 way 并显示错误消息。\n\
  \n```java\n@Override\npublic void initialize(final URL url, ResourceBundle resources)\
  \ {\n    share = Lookup.getDefault().lookup(PhoneDataShare.class);\n    if (share\
  \ == null) {\n        logger.log(Level.SEVERE, \"Cannot get PhoneData object\");\n\
  \        LifecycleManager.getDefault().exit();\n    }\n    // 配置列\n    colCompany.setCellValueFactory((TableColumn.DataFeatures<Salesdata,\
  \ String> p) -> p.getValue().getId().nameProperty());\n    colYear.setCellValueFactory(new\
  \ PropertyFactory<Salesdata, String>(\"year\"));\n    colUnitsSold.setCellValueFactory((TableColumn.DataFeatures<Salesdata,\
  \ BigDecimal> cell) -> cell.getValue().inmillionsProperty());\n    colUnitsSold.setCellFactory(TextFieldTableCell.forColumn<Salesdata,\
  \ BigDecimal>(new DecimalConverter()));\n    // 为 UnitsSold 列配置编辑\n    colUnitsSold.setOnEditCommit((TableColumn.CellEditEvent<Salesdata,\
  \ BigDecimal> t) -> {\n        // 如果新值为 null，则使用旧值\n        BigDecimal bd;\n   \
  \     if (t.getNewValue() != null) { // 有效值\n            bd = t.getNewValue();\n\
  \            t.getRowValue().setUnitsinmillions(bd);\n            displayMessage.setText(\"\
  \");\n            displayMessage.setStyle(\"-fx-text-fill: black;\");\n        \
  \    share.updateSales(t.getRowValue(), progress);\n        } else { // 转换失败\n \
  \           bd = t.getOldValue();\n            t.getRowValue().setUnitsinmillions(bd);\n\
  \            // 强制刷新\n            t.getTable().setVisible(false);\n            t.getTable().setVisible(true);\n\
  \            displayMessage.setStyle(\"-fx-text-fill: red;\");\n            displayMessage.setText(Bundle.salesAmountFormat());\n\
  \        }\n    });\n}\n```\n\n#### 列表 16.14 TableViewController—initialize() 方法部分\
  \ II\n\n列表 16.14 显示了你如何过滤和排序 `TableView` 控件中显示的 `ObservableList`。\n\n\n\n\n```java\n\
  // 定义排序的比较器\ncomparatorSalesdata = (Salesdata o1, Salesdata o2) -> {\n    // 先比较公司名称，然后比较年份\n\
  \    int result = o1.getCompanyid().getCompanyname().compareToIgnoreCase(\n    \
  \        o2.getCompanyid().getCompanyname());\n    if (result == 0) {\n        return\
  \ o1.getSalesyear().compareTo(o2.getSalesyear());\n    }\n    return result;\n};\n\
  \n// 当底层数据发生变化时，重置过滤和排序\nshare.theDataProperty().addListener(\n    (ListChangeListener.Change<?\
  \ extends Salesdata> change) -> {\n        filteredData = new FilteredList<>(\n\
  \                share.theDataProperty().get(), salesdata -> {\n            // 数据发生变化时重新应用过滤器\n\
  \            String newValue = filterText.getText();\n            // 如果过滤文本为空，则显示所有数据\n\
  \            if (newValue == null || newValue.isEmpty()) {\n                   \
  \ return true;\n            }\n            // 将公司名称和年份与过滤文本进行比较\n            String\
  \ lowerCaseFilter = newValue.toLowerCase();\n            if (salesdata.getCompanyid().getCompanyname().toLowerCase()\n\
  \                    .contains(lowerCaseFilter)) {\n                return true;\
  \ // 过滤器匹配公司\n            } else if (salesdata.getSalesyear().contains(lowerCaseFilter))\
  \ {\n                return true; // 过滤器匹配销售年份\n            }\n            return\
  \ false; // 不匹配\n        });\n        sortedData = new SortedList<>(filteredData);\n\
  \        sortedData.setComparator(comparatorSalesdata);\n        tableview.setItems(sortedData);\n\
  \    });\n    // 当用户提供过滤文本时，重新应用过滤器\n    filterText.textProperty().addListener(\n\
  \        (observable, oldValue, newValue) -> {\n            filteredData.setPredicate(salesdata\
  \ -> {\n                // 如果过滤文本为空，则显示所有数据。\n                if (newValue == null\
  \ || newValue.isEmpty()) {\n                    return true;\n                }\n\
  \                // 将公司名称和年份与过滤文本进行比较。\n                String lowerCaseFilter =\
  \ newValue.toLowerCase();\n                if (salesdata.getCompanyid().getCompanyname().toLowerCase()\n\
  \                        .contains(lowerCaseFilter)) {\n                    return\
  \ true;\n                } else if (salesdata.getSalesyear().contains(lowerCaseFilter))\
  \ {\n                    return true;\n                }\n                return\
  \ false;\n            });\n        });\n```\n\n`Listing 16.15` 显示了 `DecimalConverter`，它在\
  \ `TableColumn` 的就编辑器中对 `String` 和 `BigDecimal` 执行转换。你重写了 `toString()` 和 `fromString()`\
  \ 方法。`NumberFormat` 类对区域设置敏感，因为我们通过 `getInstance()` 方法中调用了 `Locale.getDefault()`。\n\
  \nListing 16.15 TableViewController—DecimalConverter\n\n```java\nprivate class DecimalConverter\
  \ extends StringConverter<BigDecimal> {\n    NumberFormat nf = NumberFormat.getInstance(Locale.getDefault());\n\
  \n    public DecimalConverter() {\n        nf.setMaximumFractionDigits(2);\n   \
  \     nf.setMinimumFractionDigits(1);\n    }\n    @Override\n    public String toString(BigDecimal\
  \ t) {\n        try {\n            return nf.format(t);\n        } catch (Exception\
  \ e) {\n            return null;\n        }\n    }\n    @Override\n    public BigDecimal\
  \ fromString(String string) {\n        try {\n            Number newValue = nf.parse(string);\n\
  \            BigDecimal result = new BigDecimal(newValue.doubleValue());\n     \
  \       return result.setScale(2, BigDecimal.ROUND_HALF_EVEN);\n        } catch\
  \ (ParseException e) {\n            return null;\n        }\n    }\n}\n```\n\n###\
