  \n# 探索系统文件系统\n\n让我们应用学到的关于 Layer 文件和文件系统 API 的知识，将系统文件系统的内容显示在输出（Output）窗口。我们将包含所有文件和文件夹，并根据\
  \ `FileObject` 类型对它们进行颜色编码（文件夹为橙色，文件为蓝色）。此外，我们将显示任何定义了属性文件的属性。图 13.20 显示了该程序的运行情况![](img/image8396.jpg)\n\
  \n图 13.20 显示系统文件系统\n\n以下是显示系统文件系统内容的步骤摘要：\n* 为 `FileSystemApp` 添加一个名为 `FileSystemViewer`\
  \ 的新模块。\n* 在工具栏和顶级菜单 `Tools` 下创建一个名为 `View System FileSystem`（查看系统文件系统）的动作（Action）。\n\
  * 为文件系统 API、Lookup API 和 I/O API 添加依赖项。\n* 实现该动作。\n\n### 创建模块 FileSystemViewer\n\
  \n使用以下步骤在 `FileSystemApp` 应用中创建模块 `FileSystemViewer`：\n1. 展开项目 `FileSystemApp`，选择\
  \ `Modules` 节点，右键点击并选择 `New . . . .`。\n2. NetBeans 启动 `New Module Project` 向导。在\
  \ `Name and Location` 对话框中，指定 Project Name 为 `FileSystemViewer`，其余字段接受默认值。点击 Next。\n\
  3. NetBeans 显示 `Basic Module Configuration` 对话框。指定 Code Name Base 为 `com.asgteach.filesystem.viewer`，其余字段接受默认值并点击\
  \ Finish。NetBeans 在应用 `FileSystemApp` 中创建模块 `FileSystemViewer`。\n\n### 创建 View System\
  \ FileSystem 动作\n\n使用以下步骤在模块 `FileSystemViewer` 中注册一个新动作：\n1. 在模块 `FileSystemViewer`\
  \ 中，展开 `Source Packages` 并右键点击包名。从右键菜单中选择 `New | Action`。\n2. NetBeans 启动 `New Action`\
  \ 向导。在 `Action Type` 对话框中，选择 `Always Enabled` 并点击 Next。\n3. 在 `GUI Registration`\
  \ 对话框中，选择 `Category Tools`。勾选 `Global Menu Item` 框。指定 `Menu Tools` 的位置为 `Here -\
  \ Tools`，以及 `Separator After`。勾选 `Global Toolbar Button` 框。指定 `Toolbar File` 和 `Position\
  \ Config File - Here - Save All`。点击 Next。\n4. NetBeans 显示 `Name, Icon, and Location`\
  \ 对话框。指定 Class Name 为 `ViewSysFSAction`。Display Name 为 `View System File System`。点击\
  \ `Browse` 按钮并找到图标文件 `fileSysIcon.png`。点击 Finish。NetBeans 创建 `ViewSysFSAction.java`\
  \ 并图标文件复制到模块的源包中。\n\n### 添加模块依赖\n\n为文件系统 API（用于文件动作）、Lookup API（某些 `FileObject`\
  \ 操作）和 I/O API（用于将内容写入输出窗口）添加模块依赖。\n\n### 实现动作\n\n我们分两部分展示 `ViewSysFSAction` 的实现。Listing\
  \ 13.17 包含了动作的注册注解以及配置输出窗口的代码。此代码类似于第 629 页上的 Listing 13.1（详细描述请参见第 628 页的“The Output\
  \ Window”）。\n\nListing 13.17 ViewSysFSAction—注册注解\n点击此处查看代码图片\n\n* * *\n\n```\n\
  @ActionID(\n    category = \"Tools\",\n    id = \"com.asgteach.filesystem.viewer.ViewSysFSAction\"\
  \n)\n@ActionRegistration(\n    iconBase = \"com/asgteach/filesystem/viewer/fileSysIcon.png\"\
  ,\n    displayName = \"#CTL_ViewSysFSAction\"\n)\n@ActionReferences({\n    @ActionReference(path\
  \ = \"Menu/Tools\", position = -100,\n                     separatorAfter = -50),\n\
  \    @ActionReference(path = \"Toolbars/File\", position = 375)\n})\n@Messages(\"\
  CTL_ViewSysFSAction=View System FileSystem\")\npublic final class ViewSysFSAction\
  \ implements ActionListener {\n    private final InputOutput io;\n    private final\
  \ OutputWriter writer;\n    public ViewSysFSAction() {\n        io = IOProvider.getDefault().getIO(\n\
  \                     Bundle.CTL_ViewSysFSAction(), false);\n        writer = io.getOut();\n\
  \    }\n}\n```\n\n* * *\n\nListing 13.18 显示了 `actionPerformed()` 方法的实现。静态方法 `FileUtil.getConfigRoot()`\
  \ 返回文件系统的根文件夹。我们然后选择 FileSystem 标签并清空输出窗口。通过调用递归的 `displayChildren()` 方法传入 FileSystem\
  \ 根文件夹（`root`）来显示文件系统。根路径是应用项目 `build/user/dir/config` 中的文件夹。注意，某些配置信息在 NetBeans\
  \ 分发版中，在我们的系统中如下：`Applications/NetBeans/NetBeans 8.app/Contents/Resources/NetBeans/platform/config/Modules`\
  \ 以及相对于默认系统（Default System）。如果 `displayChildren()` 的参数是文件夹，则 `getChildren()` 方法返回的每个子项随后将作为\
  \ `displayChildren()` 方法的参数使用。如果 `displayChildren()` 的参数是文件，则使用不同的颜色进行显示。对每个文件调用\
  \ `getAttributes()` 方法并用颜色显示每个属性名称。\n\nListing 13.18 ViewSysFSAction—actionPerformed()\
  \ 方法\n\n```\n@Override\npublic void actionPerformed(ActionEvent e) {\n    FileObject\
  \ root = FileUtil.getConfigRoot();\n    // 输出窗口中创建了 \"FileSystem\" 标签\n    io.select();\
  \ // 选择 FileSystem 标签\n    try {\n        writer.reset(); // 清空输出窗口\n        displayChildren(root);\n\
  \    } catch (IOException ex) {\n        Exceptions.printStackTrace(ex);\n    }\
  \ finally {\n        writer.flush();\n        writer.close();\n    }\n}\n\nprivate\
  \ void displayChildren(FileObject fo) throws IOException {\n    if (fo.isFolder())\
  \ { // 显示文件夹（橙色）\n        writeMsg(FileUtil.getFileDisplayName(fo), Color.ORANGE);\n\
  \        for (FileObject childFileObject : fo.getChildren()) {\n            displayChildren(childFileObject);\n\
  \        }\n    } else { // 显示文件（蓝色）\n        writeMsg(FileUtil.getFileDisplayName(fo),\
  \ Color.BLUE);\n        Enumeration<String> attrNames = fo.getAttributes();\n  \
  \      while (attrNames.hasMoreElements()) {\n            // 显示属性（洋红色）\n       \
  \     writeMsg(\"Attribute \" + attrNames.nextElement(), Color.MAGENTA);\n     \
  \   }\n    }\n}\n\nprivate void writeMsg(String str, Color color) {\n    try {\n\
  \        if (IOColorLines.isSupported(io)) {\n            IOColorLines.println(io,\
  \ str, color);\n        } else {\n            writer.println(str);\n        }\n\
  \    } catch (IOException ex) {\n        Exceptions.printStackTrace(ex);\n    }\n\
  }\n```\n\n\n\n\n## 使用 Layer 文件进行模块间通信\n\n你已经看到过如何使用 `Lookup` API 进行模块间通信。一个模块可以实现一个供其他模块使用的的服务提供者。客户端模块必须声明依赖于定义接口的模块，而不需要依赖提供实现的模块。你还使用\
  \ `Lookup` 来管理选择和上下文敏感性。该系统有助于创建一个由松散耦合模块组成的应用程序。\n\n文件系统提供了另一种模块间通信的方式。通过使用 `Layer`\
  \ 文件，模块可以注册另一个模块可以使用文件夹和文件。这些文件夹和文件会影响系统文件系统，并可以通过访问它们来构建任意数量的应用程序构件。\n\n让我们展示一个示例。在这里，我们将修改在之前一个章节中构建的\
  \ `FamilyTreeApp`（参见第 501 页的“**在数据库上使用 CRUD 操作**”），并使用 `Layer` 文件提供自定义的应用程序标题。图\
  \ 13.21 显示了运行中的应用程序。使用 `JPA` 和 `JavaDB` 实现 `FamilyTreeManager` 的模块还提供了用于自定义标题的文本，以标识其持久化策略。![](img/image8449.jpg)图\
  \ 13.21 通过 Layer 文件自定义应用程序标题\n\n然而，实际自定义标题的模块并不依赖于提供自定义文本的模块。相反，这些信息是通过文件系统访问的。\n\
  \n以下是构建此自定义标题的步骤：\n\n1. 在 NetBeans IDE 中打开 `FamilyTreeApp` 应用程序。展开 `FamilyTreeModel`\
  \ 项目。\n2. 为 `FileSystem` API 和 `WindowSystem` API 添加模块依赖。\n3. 在 `Source Packages\
  \ | com.asgteach.familytree.model.data` 下，编辑 `Installer.java` 文件。该 Java 类被标记有 `@OnStart`\
  \ 注解，用于提供在应用程序启动和模块加载时执行的代码（参见第 242 页的“**使用 @OnStart**”）。\n4. 在 `run()` 方法中添加代码以读取文件系统并可能自定义应用程序标题，如\
  \ 列表 13.19 所示。注意，我们必须使用 `invokeWhenUIReady()` 方法，因为修改 UI 的代码必须在 EDT 上运行。我们检查了 `null`\
  \ 以防目标文件夹或属性不存在。\n\n代码列表 13.19 `Installer.java`——读取系统文件系统以自定义\n\n```java\n@OnStart\n\
  public final class Installer implements Runnable {\n    . . .\n    @Override\n \
  \   public void run() {\n        FamilyTreeManager ftm = Lookup.getDefault().lookup(FamilyTreeManager.class);\n\
  \        . . .\n        // 从系统读取配置\n        FileObject root = FileUtil.getConfig();\n\
  \        FileObject persistetype = root.getFileObject(\"PersistenceType\");\n  \
  \      if (persistetype != null) {\n            final String persistenceTypeName\
  \ = persistetype.getAttribute(\"pTypeName\").toString();\n            if (persistenceTypeName\
  \ != null) {\n                WindowManager.getDefault().invokeWhenUIReady(() ->\
  \ {\n                    WindowManager.getDefault().getMainWindow().getTitle()\n\
  \                    + \" Using \" + persistenceTypeName);\n                });\n\
  \            }\n        }\n    }\n}\n```\n\n5. 按照第 656 页的“创建 Layer File”中的步骤，为 `FamilyTreeManagerJPA`\
  \ 模块创建一个 `Layer` 文件。该模块是使用 `JPA` 和 `JavaDB` 提供 `FamilyTreeManager` 实现的模块。\n6. 向文件系统添加文件夹和属性，如\
  \ 列表 13.20 所示。\n\n代码列表 13.20 `Layer.xml`——添加应用程序配置\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"UTF-8\"?>\n<!DOCTYPE filesystem PUBLIC \"-//NetBeans//DTD Filesystem\
  \ 1.2//EN\" \"http://www.netbeans.org/dtds/filesystem-1_2.dtd\">\n<filesystem>\n\
  \    <folder name=\"PersistenceType\">\n        <attr name=\"pTypeName\" stringvalue=\"\
  JPA + JavaDB\" />\n    </folder>\n</filesystem>\n```\n\n\n\n\n当你运行 `FamilyTreeApp`\
  \ 时，你将看到如图 13.21 所示的自定义应用程序标题。另一个提供不同持久化策略的模块也可以提供自己的“PersistenceType”文件夹和属性，并同样地影响应用程序标题。\n\
  \n##13.6 关键点总结\n本章向你展示了如何使用 `NetBeans Platform File System API`。你学习了如何在本地文件系统中创建文件夹和文件，如何读取和写入文件，以及如何重命名和删除文件及文件夹。你学习了如何使用\
  \ `FileObject` 属性，并使用 `FileChangeListener` 监控文件系统层级、文件夹或文件内部的变化。你学习了如何将文件包含在 NetBeans\
  \ Platform 应用程序中并使用 `File System API` 访问它们。此外，你还了解了 `System FileSystem` 和 `Layer`\
  \ 文件，它们定义了 NetBeans Platform 应用程序的完整配置数据。你看到了如何通过模块的 `Layer` 文件中创建文件夹、文件和属性来定制你的应用程序。\n\
  \n以下是本章的要点：\n- `NetBeans Platform File System API` 允许你操作文件夹和文件。\n- `FileSystem`\
  \ 是 `FileObjects` 的集合。该集合是分级结构并有一个根。`FileSystem` 抽象允许你以相同的方式查看来自物理不同源的数据。\n- `FileObject`\
  \ 代表文件或文件夹，它是标准 Java `File` 之上的抽象。`FileObject` 支持文件的创建、删除、读取、写入，以及通过 getter 方法和\
  \ setter 方法访问属性。\n- 代表文件夹的 `FileObjects` 允许你创建子文件夹和文件。`FileObjects` 还允许你访问其包含的文件和文件夹（子节点）。\n\
  - 删除 `FileObject` 文件夹将执行递归删除。\n- `FileUtil` 提供了操作 `FileObjects` 的静态方法。\n- 可以为 `FileObject`（文件夹或文件）添加\
  \ `FileChangeListener` 并监控文件和文件夹的变化。你还可以为目录树中的文件夹添加递归的 `FileChangeListener`。\n-\
  \ `FileChangeListener` 接收针对文件夹创建、文件创建、文件（或文件夹）更改、文件（或文件夹）删除、文件（或文件夹）重命名以及文件（或文件夹）属性更改的事件。`FileChangeListener`\
  \ 中有六个方法可以重写。或者，你可以使用 `FileChangeAdapter` 器类只重写你需要的方法。\n- `Output` 窗口是一个预定义的 `TopComponent`，支持多个标签页。该窗口对于报告不同模块的状态非常方便。\n\
  - `Favorites` 窗口允许你查看本地文件系统中的文件。要向 NetBeans Platform 应用程序添加 `Favorites` 窗口，请从平台集群（cluster）中包含\
  \ `Favorites` 模块。\n- 将 `Templates` 模块添加到你的 NetBeans Platform 应用程序中，让用户从 `Favorites`\
  \ 窗口创建空文件和文件夹。\n- 在模块的顶层目录中创建文件夹 `release`，以便在 NetBeans 应用程序中安装一个或多个文件。\n- 使用 `InstalledFileLocator`\
  \ 的 `locate()` 或 `locateAll()` 方法访问已安装的文件。这些方法也能处理本地化文件。\n- 在 NetBeans IDE 中作为 `PlugIn`\
  \ 安装模块，请创建一个 `NBM` 文件并使用 `Tools` 菜单下的 `PlugIns` 菜单安装它。\n- `Layer` 文件是你的 NetBeans\
  \ Platform 应用程序配置数据的网关。这些配置数据以分级文件系统的写入磁盘，称为 `System FileSystem`。\n- 一个模块最多可以贡献一个\
  \ `Layer` 文件。当你的应用程序运行时，每个模块的 `Layer` 文件会被读取并合并成一个全应用范围 `Layer` 文件。\n- 通常情况下，你通过注解向生成的\
  \ `Layer` 文件贡献内容。这些注解注册了服务、操作、`TopComponents`、菜单项、工具栏内容和按键绑定。\n- 你可以创建一个 `Layer`\
  \ 文件并在 `Projects` 视图中上下文中查看它。\n- 要移除标准的 NetBeans Platform 操作、菜单项和工具栏条目，请在模块的 `Layer`\
  \ 文件的条目后添加后缀 `_hidden`。\n- 或者，使用 `Projects` 视图中的右键菜单 `delete` 移除 `Layer` 文件中的项。随后使用右键菜单\
  \ `restore` 恢复任何被隐藏的项。\n- 你可以使用 `FileUtil.getConfigRoot()` 程序地访问应用程序的 `System FileSystem`。该方法返回一个代表\
  \ `System FileSystem` 根的 `FileObject`。\n- 通过让一个模块在其 `Layer` 文件中注册另一个模块可以访问的文件夹和/或文件，以松耦合的方式定制应用程序。\n\
  \n##14. 数据系统\n本章探讨了 `Data System API`，它是文件和节点之间重要的桥梁。你将学习如何创建被 NetBeans Platform\
  \ 识别的文件类型，并学习如何同时使用 `File System API` 和 `Data System API` 操作这些文件类型。`DataObject`\
  \ 和 `DataNode` 是 `Data System API` 中的主要类。这些重要的类允许你管理 NetBeans Platform 应用程序中的文件。\n\
  \n`MultiView` 编辑器允许用户查看同一个文件的不同视图，通常是一个基于文本的视图和一个 `Visual` 可视觉视图。你将学习如何使用 `DataObjects`\
  \ 构建一个 `MultiView` 编辑器。`Visual` 视图创建一个 `Swing JPanel`，允许你添加 `Swing` 组件、`Visual Library\
  \ API` 控件（灵活的图形组件）或 `JavaFX` 内容。\n\n并不是所有 NetBeans Platform 应用程序都需要使用 `Data System\
  \ API`。如果你不需要在你的应用程序中集成新类型的文件，那么你可能不需要它。\n\n## 你将学习\n- 使用 `File System`、`Data System`\
  \ 和 `Nodes` API 理解文件、`FileObject`、`DataObject` 和 `node` 对象之间的关系。\n- 创建新的文件类型并注册其\
  \ MIME 类型、`DataLoader`、文件模板和 `MultiView` 元素。\n- 基于文本 MIME 类型创建一个 `MultiView` 编辑器。学习在多个视图之间同步底层文档。\n\
  - 使用 `Visual Library` 和 `JavaFX` 构建 `DataObjects` 的节点层级结构。\n- 创建带有根元素的 XML 文件类型。\n\
  - 使用 `NetBeans Platform XML` 类解析 XML 文件。\n- 将 `NetBeans Platform XML editor` 集接到\
  \ NetBeans Platform 应用程序中。\n- 为特定的文件类型创建条件可用的操作。\n- 为特定的 `MultiView` 窗口创建条件可用的操作。\n\
  \n##14.1 Data System 概述\n`NetBeans Platform File System API` 允许你处理文件。你已经见过如何为文件添加属性或使用\
  \ `FileChangeListener` 监控变化。相比之下，`Data System API` 是文件和节点之间的胶水。`DataObject` 和 `DataNode`\
  \ 是 `Data System API` 中的主要类。`Data System API` 允许你管理文件。\n\n`FileObject` 拥有 MIME 类型。已注册的\
  \ `Dataers` 对应 MIME 类型并为文件创建 `DataObject`。`FileObject` 的 MIME 类型由 MIME 解析器决定。MIME\
  \ 解析器注册在模块的 `Services/MIMesolver` 文件夹中。通常 MIME 解析器使用文件的扩展名来确定其 MIME 类型。对于 XML 文件，MIME\
  \ 解析器还会查看其根元素。当你创建新的文件类型时，新文件类型向导会注册 MIME 解析器、`DataLoader`、文件模板和 `DataObject`。\n\
  \n`FileObject, DataObject, Node`\n现在让我们看看如何程序地访问这些相关对象。为了演示，我们将访问一个名为 `myfile.txt`\
  \ 的文件。扩展名为 `.txt` 的文件是未知 MIME 类型，被视为通用文本文件。当你打开 `Favorites` 窗口时，`myfile.txt`（如果存在）将以通用文档图标显示。\n\
  \n\n\n\n```java\n    private final InputOutput io;\n    private final OutputWriter\
  \ writer;\n    private static final String FILENAME = \"myfile.txt\";\n\n    public\
  \ FileManipulations() {\n        io = IOProvider.getDefault().getIO(Bundle.CTL_FileManipulations(),\
  \ false);\n        writer = io.getOut();\n    }\n\n    private void displayMessage(String\
  \ msg) {\n        writer.println(msg);\n    }\n\n    // Example code manipulating\
  \ FileObject, DataObject, and Node\n    try {\n        . . .\n        [See Listing\
  \ 14.2, Listing 14.3, Listing 14.4, Listing 14.5, and Listing 14.6 ]\n        .\
  \ . .\n    } catch (IOException ex) {\n        Exceptions.printStackTrace(ex);\n\
  \    }\n```\n\n### FileObject 的 MIME 类型与查找\n\n让我们从作为 `FileObject` 访问文件 `myfile.txt`\
  \ 开始。我们使用其父级 `FileObject` 文件夹的 `getFileObject()` 方法，如 Listing 14.2 所示。调用 `getMIMEType()`\
  \ 返回“content/unknown”。`FileObjects` 拥有一个 `Lookup`（查找器），我们通过它来打开文件。在这里，我们查找 `Openable`\
  \ 的实现，如果找到，则调用其 `open()` 方法在 NetBeans  的纯文本编辑器中打开文件。\n\nListing 14.2 FileObjects\
  \ 拥有 MIME 类型和查找 点击查看代码图像\n\n```java\n    . . .\n    // 此文件夹中是否存在名为 myfile.txt 的文件？\n\
  \    FileObject myfile = myfolder.getFileObject(FILENAME);\n    . . .\n    // 显示\
  \ FileObject 拥有 MIME 类型\n    displayMessage(myfile.getNameExt() + \" MIME Type:\
  \ \" + myfile.getMIMEType());\n    // 显示 FileObject 拥有查找\n    Openable open_impl\
  \ = myfile.getLookup().lookup(Openable.class);\n    if (open_impl != null) {\n \
  \       displayMessage(\"Openable found in fileobject\");\n        // 打开文件（这会在纯文本编辑器中打开文件）\n\
  \        open_impl.open();\n    }\n```\n\n**输出窗口**\n```\nmyfile.txt MIME Type: content/unknown\n\
  Openable found in fileobject\n```\n\n### DataObject 工厂与 DataObject 查找\n\n`DataLoader`\
  \ 允许你访问 `FileObject` 的 `DataObject`。`DataLoaders` 是 `DataObjects` 的工厂并注册在你的应用程序中。你使用静态方法\
  \ `DataObject.find()` 来访问 `FileObject` 的 `DataObject`，如 Listing 14.3 所示。`DataObjects`\
  \ 也拥有 `Lookups`。Listing 14.3 显示了打开此 `DataObject` 所代表文件的等效代码。与之前一样，我们调用 `Openable`\
  \ 方法 `open()`。如果文件已经打开，纯文本编辑器窗口将获得焦点。\n\nListing 14.3 工厂创建 DataObject；DataObjects\
  \ 拥有查找 点击查看代码图像\n\n```java\n    . . .\n    // 查找与文件关联的 DataObject\n    // 使用静态 DataObject\
  \ 方法 find()\n    DataObject dob = DataObject.find(myfile);\n    if (dob != null)\
  \ {\n        displayMessage(\"Found DataObject \" + dob.getName() + \" for \" +\
  \ myfile.getNameExt());\n        // 显示 DataObject 也拥有查找\n        open_impl = dob.getLookup().lookup(Openable.class);\n\
  \        if (open_impl != null) {\n            displayMessage(\"Openable found in\
  \ dataobject\");\n            // 如果已打开，则聚焦于编辑器\n            open_impl.open();\n\
  \        }\n        . . .\n    }\n```\n\n**输出窗口**\n```\nFound DataObject myfile.txt\
  \ for myfile.txt\nOpenable found in dataobject\n```\n\n### 从 DataObjects 访问 FileObjects\n\
  \n在许多情况下，多个 `FileObjects` 可以与一个 `DataObject` 相关。然而，一个 `FileObject` 被指定为主文件，你通过 `DataObject.getPrimaryFile()`\
  \ 方法访问它。Listing 14.4 显示了如何从 `DataObject` 访问 `FileObject` 并使用 `asLines()` 读取文件内容。\n\
  \nListing 14.4 从 DataObject 获取 FileObject 并读取内容 点击查看代码图像\n\n```java\n    . . .\n\
  \    // 从 DataObject 获取 FileObject\n    FileObject myfob = dob.getPrimaryFile();\n\
  \    if (myfob != null) {\n        displayMessage(\"Got FileObject \" + myfob.getNameExt()\
  \ + \" from DataObject\");\n        displayMessage(\"Display Contents:\");\n   \
  \     // 使用 FileObject 读取内容\n        for (String line : myfob.asLines()) {\n   \
  \         displayMessage(line);\n        }\n    }\n```\n\n**输出窗口**\n```\nGot FileObject\
  \ myfile.txt from DataObject\nDisplay Contents:\ntesting\none\ntwo\n```\n\n### DataObjects\
  \ 与 Nodes\n\n你已经见过 NetBeans  的收藏（Favorites）窗口如何在资源管理器视图（Explorer View）中显示来自本地文件系统的文件和文件夹。正如你从\
  \ 第 7 章所推测的（详情参见第 295 页的“构建节点层级结构”），资源管理器视图中的每个文件夹和文件都是一个节点（node）。`Node` 是你的数据的表示，代表一个\
  \ `DataObject`，而 `DataObject` 反而封装了一个 `FileObject`，代表磁盘上的文件。\n\n`Nodes` 不仅提供了人类友好的视图，还提供了存储在在其\
  \ `Lookup` 中的操作和能力的右键菜单。你已经对节点很熟悉，但一个名为 `DataNode` 的 `AbstractNode` 专用子类封装了 `DataObjects`（参见图\
  \ 7.3）。\n\n`DataObjects` 创建节点层级结构。你调用 `getNodeDelegate()` 方法返回返回 `Node`。有了节点，你现在可以访问熟悉的对象：动作、图标，当然还有……\n\
  \n```java\n    . . .\n    // 获取代表 DataObject 的节点\n    Node node = dob.getNodeDelegate();\n\
  \    if (node != null) {\n        displayMessage(\"Node is: \" + node.displayName());\n\
  \        // 查看节点是否有图标（图像）\n        Image image = node.getIcon(BeanInfo.COLOR_16x6);\n\
  \        if (image != null) {\n            displayMessage(\"Got the Node's Icon\
  \ \" + image.toString());\n        }\n        // 获取节点的上下文菜单动作\n        displayMessage(\"\
  -------Context Actions-------\");\n        for (Action action : node.getActions(true))\
  \ {\n            if (action == null) {\n                // 分隔符\n               \
  \ displayMessage(\"-------\");\n            } else {\n                displayMessage(\"\
  Action \" + action.toString());\n            }\n        }\n    }\n```\n\n**输出窗口**\n\
  ```\nNode is: myfile.txt\nGot the Node's Icon BufferedImage@89304b: type = 3 DirectColorModel:\
  \ rmask=ff0000 gmask=ff00 bmask=ff amask=ff000000 IntegerInterleavedRaster: width\
  \ = 16 height = 16 #Bands = 4 xOff = 0 yOff = 0 dataOffset[0] 0\n-------Context\
  \ Actions-------\n...（输出已截断）\n```\n\n### 使用 DataNode 和 Lookup\n\n现在反过来，向你展示如何从节点获取\
  \ `DataObject`。要直接使用节点，你必须将节点强制转换为 `DataNode` 并调用 `getDataObject()` 方法。然而，更简洁的方法是使用节点的\
  \ `Lookup` 并通过类型安全的 `lookup()` 方法获取其 `DataObject`。Listing 14.6 显示了这两种方法。\n\n```java\n\
  \    // 从 DataNode 获取 DataObject（繁琐）\n    if (node instanceof DataNode) {\n    \
  \    // 强制转换为 DataNode\n        DataNode dataNode = (DataNode) node;\n    }\n```\n\
  \n\n\n\n\n```java\ndisplayMessage(\"Node is a DataNode: \" + dataNode.getDisplayName());\n\
  \nDataObject mydob = dataNode.getDataObject();\n\nif (mydob != null) {\n    displayMessage(\"\
  Got the DataObject from the DataNode: \" + mydob.getName());\n}\n\n// Better to\
  \ use Lookup (type-safe)\n\nDataObject dob2 = node.getLookup().lookup(DataObject.class);\n\
  if (dob2 != null) {\n    displayMessage(\"Got the DataObject from the Node's Lookup:\
  \ \" + dob2.getName());\n}\n```\n\n### Output Window\n\n```\nNode is a DataNode:\
  \ myfile.txt\nGot the DataObject from the DataNode: myfile.txt\nGot the DataObject\
  \ from the Node's Lookup: myfile.txt\n```\n\n\n\n\n\n# 14.2 创建新文件类型\n\n现在你已经学习了\
  \ `FileObject`、`DataObject` 和 `DataNode`，让我们来构建一个带有新文件类型的应用程序，并在应用程序中注册该文件类型。本示例向你展示如何在\
  \ NetBeans Platform 应用程序的上下文中操作 `FileObjects`、`DataObjects` 以及节点。你将学习如何在程序中处理特定类型的文件。通过“新建文件类型（New\
  \ File Type）”向导，你可以定义一个 MIME 类型并注册一个 `DataLoader`，它会在需要时创建必要的 `DataObjects`。该向导还会注册一个“文件模板（File\
  \ Template）”。当用户创建此类型的新型文件时，应用程序就会应用该`File Template`。\n\n图 14.2 显示了应用程序的运行情况。你可以看到左侧的收藏夹（Favorites）窗口包含了几个扩展名为\
  \ `ftr`（新文件类型）的文件，这些文件通过特殊图标识别。打开一个 `FTR` 文件会在 `MultiView` 窗口的纯文本编辑器中打开文件，该窗口有两个标记为\
  \ `Text` 和 `Visual` 的标签。目前，我们只处理 `Text` 窗口。我们将在下一节讨论如何为 `Visual` 标签添加功能（参见第 697\
  \ 页的“使用 MultiView 窗口”）。\n\n![](img/image8602.jpg)\n图 14.2 定义了带有 familytree (ftr)\
  \ 文件的 FileTypeApp\n\n当用户展开文件（点击收藏夹窗口中的展开图标）时，会根据内容出现额外的节点。当用户编辑文件并保存新版本时，收藏夹窗口将与新内容保持同步。这个相当简单的示例让你看到文件、`FileObject`、`DataObject`、`DataNode`\
  \ 和节点之间的关系。\n\n由于收藏夹窗口处理文件的显示，因此这种新文件类型具有与普通文件相关的预期行为。复制、删除和重命名等操作默认已实现。在包含 `Templates`\
  \ 模块的情况下，你还可以创建新的 `FTR` 文件、新的空文件和新文件夹。我们还为这种新文件类型提供了一个上下文敏感的操作，用于显示有关文件的信息。\n\n\
  以下构建此应用程序并创建新文件类型的步骤总结。11。另一种或者，你也可以在 NetBeans Platform 应用程序之外构建一个 NetBeans 模块。此类模块运行在\
  \ NetBeans IDE 的版本中，让你能够访问 IDE 的所有面向文件的功能和编辑器。在这里，我们展示如何构建一个非 IDE 的应用程序，并仅包含你所需的\
  \ NetBeans 模块。\n\n*   创建一个名为 `FileTypeApp` 的新 NetBeans Platform 应用程序。\n*   创建一个名为\
  \ `FamilyTreeSupport` 的新模块并将其添加到 `FileTypeApp` 应用程序中。\n*   将 `Favorites` 和 `Templates`\
  \ 模块添加到 `FileTypeApp` 应用程序中。\n*   在 `FamilyTreeSupport` 模块中，创建一个基于扩展名 `ftr` 或 `FTR`\
  \ (familytree) 的新文件类型。\n*   创建一个新的 `FTR` 文件并打开编辑。\n*   为 `familytree` 文件添加自定义上下文敏感操作。\n\
  *   根据内容提供子节点。这些节点会在用户在 `Explorer View` 窗口中展开文件节点时显示。响应编辑更改，以便收藏夹窗口与文件的编辑后的内容保持同步。\n\
