  }\n```\n\n我们的 Swing 应用（称为 `PersonSwingAppEnhancedUI`）现在有了良好的响应式 UI，并且只有在保存更改到底层模型有意义时，Update\
  \ 按钮才会启用。\n\n## 2.5 并发与线程安全\n\n在演示 Swing 如何处理并发以及对我们的 Swing 应用进行修改以支持后台线程执行之前，让我们先讨论并发和线程安全。某些线程安全问题由于在多线程环境中使用\
  \ Swing（Swing 不是线程安全的）而导致，另一些是在未使用 Swing 时也适的基本并发原则。让我们现在讨论这些问题。在我们准备好应用程序在多线程环境中安全运行后，我们将修改代码，使\
  \ Update 按钮事件处理器在后台线程中运行。\n\n### 线程安全对象\n\n如果你的执行环境是多线程，那么你需要使用线程安全的对象。关于线程安全的一个优秀参考文献是\
  \ Brian Goetz 编写的 *Java Concurrency in Practice*（Add-Wesley, 2006）以及 Joshua Bloch\
  \ 编写的 *Effective Java*（Add-Wesley, 2008）。\n\n线程安全可以通过多种方式实现。例如，你可以使用不可变对象，或者线程安全的可变对象。你也可以通过包含在调用帧内或单个线程中的对象来实现线程安全（这是\
  \ Swing 的工作方式）。`Person` 和 `FamilyTreeManager` 在多线程环境中使用它们都需要经过仔细检查。让我们从 `Person`\
  \ 开始，它是一个可变对象。为了实现 `Person` 的线程安全，我们将使用线程包含（thread containment）。也就是说，我们只在 EDT（事件派发线程）中调用\
  \ `Person` 对象的 setter 方法。任何在后台线程使用的 `Person` 对象都将是独占拷贝。我们在描述更新操作时向你展示这段代码，该操作现在将在后台线程上执行。\n\
  \n让我们讨论使 `FamilyTreeManager` 类线程安全的所需的更改。\n\n### SwingPropertySupport\n\n由于我们有一个多线程的\
  \ Swing 应用，我们希望属性更改在 EDT 上触发（因为它们的事件处理器会访问 Swing 组件）。为了实现这一点，我们将 `PropertyChangeSupport`\
  \ 替换为 `SwingPropertySupport`，并在调用其构造函数时将第二个参数设置为 `true`。通过此修改，`SwingPropertySupport`\
  \ 确保属性更改在 EDT 上触发。我们在 `FamilyTreeManager` 类中使用 `SwingPropertySupport`。\n\n### ConcurrentHashMap\n\
  \n我们使用线程安全的 `ConcurrentHashMap` 代替 `HashMap`（HashMap 不是线程安全的）。接下来，我们在静态方法 `getInstance()`\
  \ 上使用 `synchronized`。（由于 `getInstance()` 是静态的，锁是在类级别上的）。该方法需要同步，因为它包含了检查和设置操作（check\
  \ and set），这不是原子的。\n\n### 同步方法\n\n我们为三个 `FamilyTreeManager` 修改方法提供了同步支持：`addPerson()`、`updatePerson()`\
  \ 和 `deletePerson()`。`fireProperty()` 方法位于同步块之外，因为我们使用了 `SwingPropertySupport`，它会在\
  \ Swing 的 EDT 上触发属性更改事件。`getAll()` 方法也是同步的。它对映射执行深拷贝，创建一个 `ArrayList` 并返回给调用者。列表\
  \ 2.30 以**粗体**显示了对类 `FamilyTreeManager` 类的更改。列表 2.30 线程安全的 FamilyTreeManager 点击查看代码图像\n\
  \n```java\npublic class FamilyTreeManager {\n    private final ConcurrentMap<Long,\
  \ Person> personMap = new ConcurrentHashMap<>();\n    // PropertyChangeSupport 和\
  \ SwingPropertyChangeSupport 是线程安全的\n    private SwingPropertyChangeSupport propChangeSupport\
  \ = null;\n    // FamilyTreeManager 属性更改名称\n    public static final String PROP_PERSON_DESTROYED\
  \ = \"removePerson\";\n    public static final String PROP_PERSON_ADDED = \"addPerson\"\
  ;\n    public static final String PROP_PERSON_UPDATED = \"updatePerson\";\n    private\
  \ static FamilyTreeManager instance = null;\n\n    protected FamilyTreeManager()\
  \ {\n        // 仅仅用于防止实例化\n    }\n    // 线程安全的懒加载\n    public synchronized static\
