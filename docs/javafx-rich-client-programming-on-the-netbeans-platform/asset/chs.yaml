  ```\n\n日志记录设施，特别是在大型复杂的应用程序中，有助于在调试和测试阶段生成相关信息的输出。在程序开发的后期，你可以移除这些输出，因为它们通常会干扰控制台，并且对用户来说可能没有意义。通过为日志输出分配不同的级别，你可以控制哪些日志记录显示在控制台上。此外，你还可以将日志重定向到文件、过滤记录并格式化日志记录。Table\
  \ 2.1 显示了从从高到低的日志级别。默认情况下，标准日志设施将所有级别为 `INFO` 及其以上的日志消息发送到控制台。因此，任何调试类型的日志消息都应该处于\
  \ `CONFIG` 或更低级别。![](img/image1167.jpg)\n\n**表 2.1 Java 日志级别**\n\n要查看级别低于 `INFO`\
  \ 标准阈值的日志消息，你需要同时设置日志级别和日志处理程序（handler）级别。你还可以添加额外的处理程序。例如，日志 API 提供了一个 `FileHandler`，它可以将日志消息发送到文件。\n\
  \n我们的示例应用程序在构造函数中配置了两个处理程序，如 Listing 2.16 所示。一个处理程序（`handler`）将 `FINE` 或以上的日志消息定向到控制台。第二个处理程序（`fileHandler`）将日志消息写入默认文件（用户主目录下的\
  \ `javaN.log`）。\n\n### Listing 2.16 Java 日志与处理程序配置 点击此处查看代码图像\n\n```java\npublic\
  \ class PersonJFrame extends javax.swing.JFrame {\n    . . . 其他类变量 . . .\n\n   \
  \ private PersonJFrame() {\n        // 配置 Logger：将其级别设置为 FINE\n        // (默认阈值级别为\
  \ CONFIG)\n        logger.setLevel(Level.FINE);\n        // 定义一个处理程序在控制台上上显示消息\n\
  \        // 设置级别为 FINE\n        Handler handler = new ConsoleHandler();\n      \
  \  handler.setLevel(Level.FINE);\n        logger.addHandler(handler);\n        //\
  \ 定义第二个处理程序将消息写入文件\n        try {\n            FileHandler fileHandler = new FileHandler();\n\
  \            // 记录到用户主目录下的 javaN.log\n            fileHandler.setLevel(Level.FINE);\n\
  \            logger.addHandler(fileHandler);\n            logger.log(Level.FINE,\
  \ \"Created File Handler\");\n        } catch (IOException | SecurityException ex)\
  \ {\n            logger.log(Level.SEVERE, \"Couldn't create FileHandler\", ex);\n\
  \        }\n        . . . 代码省略 . .\n    }\n}\n```\n\n你还可以使用参数构建日志消息。在这里 `{0}` 是此日志中变量\
