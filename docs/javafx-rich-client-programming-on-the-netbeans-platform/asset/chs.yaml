  \ . . .\n\n***\n\n## 16.4 NetBeans Platform 应用程序中的 RESTful Web 服务\n\n现在让我们向你展示如何构建一个消费我们两个\
  \ RESTful Web 服务的 NetBeans Platform 应用程序。你将通过以下步骤创建此应用程序：\n\n1. 构建名为 `SmartPhoneDataApp`\
  \ 的新 NetBeans Platform 应用程序，以及一个名为 `PhoneDataWebService` 的 RESTful Web 服务客户端新模块。\n\
  2. 使用 NetBeans IDE 生成 RESTful Web 服务客户端并将 JAR 文件添加到模块中。创建一个 `@OnStart` Runnable\
  \ 来测试客户端。\n3. 创建 JavaFX 服务以便在后台线程中调用 RESTful Web 服务客户端。创建一个服务提供者（service provider），以便其他模块访问这些服务。\n\
  4. 构建一个使用 `TableView` 显示数据的新模块。允许用户编辑销量。\n5. 构建一个使用 `LineChart` 显示数据的新模块。\n\n##\
  \ 创建 NetBeans Platform 应用程序和模块\n\n首先，我们来创建应用程序和 `PhoneDataWebService` 模块。\n\n1.\
  \ 使用 NetBeans Platform 向导创建一个名为 `SmartPhoneDataApp` 的新应用程序。\n2. 创建一个模块并命名为 `com.phonedata.webservice`。\n\
  \n### 生成 RESTful Web 服务\n\n使用 NetBeans IDE 生成 RESTful 客户端的操作如下：\n\n1. 展开 `PhoneDataWebService`\
  \ | `Source Packages`，右键点击并选择 `New | RESTful Client`。\n2. 按照相同的步骤完成向导（参见 `Add RESTful\
  \ Client`），将 RESTful 客户端添加到 `PhoneDataWebService` 模块中。图 16.16` 显示了带有 `CompanyClient.java`\
  \ 和 `SalesdataClient.java` 的项目。注意，必须手动添加 JAR 文件以解决错误。\n\n### 将库添加到模块\n\n按照 `表 16.1`\
  \ 所示将 JAR 文件添加到 `PhoneDataWebService` 模块。\n\n1. 右键点击模块并选择 `Properties` 然后是 `Libraries`。\n\
  2. 在对话框中，选择 `Wrapped JARs` 标签并点击 `Add JAR`。你可以一次添加多个 JAR 文件。图 16.17` 显示了多个 JAR。\n\
  3. 点击 `OK` 完成过程。这些 JAR 文件可能并不位于列出的位置，而且随着这些库的新发布，版本号肯定会发生。（在 Mac OS 上，为包含 NetBeans\
  \ 应用程序的目录创建符号链接，以便从 NetBeans 对话框中查看目录内容。）\n\n### 向模块添加库与包装库模块的区别\n\n注意，我们在这里直接将库添加到模块，而不是创建包装库模块（参见\
  \ `Create Wrapped Libraries`，位于 502 页）。包装库模块允许其他模块对这些库添加依赖。所添加库的包不会暴露，因此只能被特定模块使用（在这里是\
  \ `PhoneDataWebService` 模块）。通常情况下，请使用包装库模块。但当你确定库将仅被单个模块使用时，可以直接添加它们。这可以避免在应用程序中充斥额外的模块。\n\
  \n\n\n\n\n[图 16.18] 显示了添加所需的 JAR 文件后的 `PhoneDataWebService` 模块。现在，你可以修复 `CompanyJerseyClient.java`\
  \ 和 `SalesdataJerseyClient.java` 文件中的导入，任何源代码错误都应该得到解决。\n\n### 创建用于测试的 `@OnStart`\
  \ Runnable\n你已经准备好测试应用程序了。以下是创建用于测试的 Java 类的步骤。\n\n1. 在 `PhoneDataWebService` 模块中，添加对\
  \ Module System API 的模块依赖。\n2. 在 `PhoneDataWebService` 的 `Source Packages`（源包）节点下，创建一个名为\
  \ `com.asgteach.phonedata.entities` 的新 Java 包。\n3. 从 `SmartPhoneDataServer` Web\
  \ 应用程序中复制并重构 | 粘贴类 `Salesdata.java` 和 `Company.java`（你可以忽略与 `@Entity` 注解相关的警告警告）。\n\
  4. 创建一个名为 `ClientTest.java` 的新 Java 类，该类实现了 `Runnable` 接口。添加 `@OnStart` 注解并如代码列表\
  \ 16.4 所示实现 `run()` 方法。包含来自 `SmartPhoneClient` 项目 `main()` 方法的代码（第 814 页的代码列表 16.2）。\n\
  \n#### 代码列表 16.4 ClientTest—run() 方法\n```java\npackage com.asgteach.phonedata.webservice;\n\
  \nimport com.asgteach.phonedata.entities.Company;\nimport com.asgteach.phonedata.entities.Salesdata;\n\
  import java.util.List;\nimport javax.ws.rs.core.GenericType;\nimport javax.ws.rs.core.Response;\n\
  import org.openide.modules.OnStart;\n\n@OnStart\npublic final class ClientTest implements\
