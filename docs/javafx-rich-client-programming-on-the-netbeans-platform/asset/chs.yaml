  }\n```\n\n# 事件处理器与松散耦合\n\n现在我们已经描述了模型数据和视图（Swing 组件），让我们来看看程序是如何相互交互的。根据用户交互，我们有三种不同类型的事件和三个处理这些事件的事件处理器。\n\
  \n我们的程序启动时，`JTree` 组件处于折叠状态（只显示顶层节点 `[People](https://example.org)），且 `Update`（更新）按钮是禁用的。当用户展开\
