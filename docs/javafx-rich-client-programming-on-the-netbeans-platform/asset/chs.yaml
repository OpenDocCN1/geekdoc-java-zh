  \ Static Step Sequence，这是步骤的总数。对于 Dynamic Step Sequence，指定你的向导所需的最多不同面板数量，即使向导的某次执行使用的面板较少。\n\
  \n注意，当你完成此对话框时，如果有错误或缺失，向导会提供反馈。当输入无误时，Next 按钮将变为可用。再次选择 Next。\n\n向导现在显示最后一个面板：Name\
  \ and Location（名称和位置），如图图 12.5 所示。为 Class Name Prefix 指定 Number。确保所选的 Project 为\
  \ `Sequence` 且包名与所选项目匹配。NetBeans 会显示向导为你的 New Number Sequence 向导创建的文件。注意，Finish\
  \ 按钮现在已启用。点击 Finish，向导即完成。\n\n![](img/image7175.jpg)\n图 12.5 创建向导：指定名称和位置\n\n**向导提示：**\
  \ 我们不会在本文示例中重命名类，但通常你会为你的向导和视觉面板类提供更具意义的名字。要做到这一点，在 Projects 窗口中选择 Java 源文件，并在 NetBeans\
  \ 主菜单中点击 Refactor | Rename（重构|重命名）（或选择 Java 源文件并使用快捷键序列 `Control-R`）。\n\n你现在有了一个由三个视觉面板、三个向导控制器和一个向导操作类组成的简易向导。NetBeans\
  \ 已为你创建了这七个文件，如图图 12.6 所示。\n\n![](img/185.jpg)\n图 12.6 三面板向导中的文件\n\n对于你在向导对话框中指定的每个面板，NetBeans\
  \ 会创建一个视觉面板（用于构建界面）和一个向导面板（用于验证输入）。NetBeans 创建一个操作类（用于启动向导并构建目标产物）。视觉面板扩展自 `JPanel`。你可以使用\
  \ `JFX` 集成 JavaFX 内容。Reference Application 有带有 JavaFX 内容的向导示例。参见第 414 页上的 FamilyTree（5AX3Jqw_807)。\n\
  \nNetBeans Platform 为该项目设置了以下模块依赖：\n- `Dialogs API`: 处理对话框\n- `UI API`: 各种 UI 任务\n\
  - `Utilities API`: 各种基础定义\n\n### 注册向导操作\n\n为了调用这个新创建的向导，你必须注册该向导操作，使其出现在菜单或工具栏中（或两者兼有）。在这里，我们通过提供以下操作注解在\
  \ Tools 菜单下注册 Sequence 操作，如 Listing 12.1 所示。修改的代码为粗体；其余部分由 NetBeans 生成。第 9 章讨论了操作以及如何注册它们（参见“始终启用的操作”）。当你检查这段代码时，注意\
  \ `actionPerformed()` 实例化了一个 `ArrayList` 来存放向导面板。\n\n**向导提示：** `WizardDescriptor`\
  \ 是 `DialogDescriptor` 的子类。与 `DialogDescriptor` 和 `NotifyDescriptor` 类一样，你显示向导并使用\
  \ `notify()` 阻塞应用程序。我们在第 11 章中详细讨论对话框。\n\n\n\n\n\n```java\nList<WizardDescriptor.Panel<WizardDescriptor>>\
  \ panels =\n    new ArrayList<WizardDescriptor.Panel<WizardDescriptor>>();\npanels.add(new\
