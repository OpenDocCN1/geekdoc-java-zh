  \n\n\n# 14.4 创建基于 XML 的文件类型\n\n现在让我们向你展示如何创建一个带有新 XML 文件类型的应用程序。这是一个具有预期 XML 扩展名的\
  \ XML 文件，但具有一个包含特定命名空间的唯一根元素。新文件类型（New File Type）向导会注册一个 `MIME Resolver`，用于识别具有特定命名空间的\
  \ XML 文件根元素。我们将这种 MIME 类型命名为 `text/familytree+xml`（即具有命名空间 `familytree` 的基于文本的 XML\
  \ 文件）。\n\n新文件类型向导会注册该文件类型，指定 `MIME resolver`，并注册一个识别该文件类型的 `DataLoader`。我们还为这种新文件类型提供了一个图标。与之前的示例类似，新文件类型向导为该文件类型创建一个模板，注册该模板并生成一个\
  \ `DataObject`。该向导还会创建一个骨架 `MultiView` 编辑器。\n\n通过 XML 文件类型，你可以整合 NetBeans Platform\
  \ XML 编辑器丰富的编辑功能，包括格式化、Schema 代码补全和 XML 验证。你通过在应用程序中包含来自 NetBeans Platform ide 类的所需的模块来启用此丰富的\
  \ XML 编辑器。我们将在本节的后面部分向你展示如何实现这一点。图 14.21 和图 14.22 显示了该应用程序的运行。在我们构建此应用程序之前，让我们指出几个功能。\n\
  \n![](img/image9022.jpg)\n### 图 14.21 定义了特殊 XML 文件的 FamilyTreeApp\n\n* 收藏（Favorites）窗口中显示的名为\
  \ `SimpsonFamilyTree.xml` 的 XML 文件有一个特殊的图标，我们分配给这种特定的 XML 文件类型。\n* 该文件在 XML 编辑器中打开，编辑器提供了颜色编码的\
  \ XML 元素编辑，并在编辑器顶部有一个工具栏，用于 XML 验证等操作。XML 验证过程显示在输出窗口中，位于编辑器窗口下方。\n* 当你右键点击 `SimpsonFamilyTree.xml`\
  \ 文件时，会出现一个右键菜单，包含预期的操作，如 `Open`（打开）、`Cut`（剪切）、`Copy`（拷贝）、`Delete`（删除）、`Rename`（重命名）等。这些操作在创建新文件类型时会自动包含进去。\n\
  * 右键菜单还包含菜单项 `Show XML Structure`（显示 XML 结构），这是专门为我们的新文件类型构建的自定义操作。该操作解析 XML 文件并在输出窗口中显示\
  \ XML 元素和属性，如图 14.22 所示。\n\n![](img/image9030.jpg)\n### 图 14.22 FamilyTree XML 文件操作显示了关于文件信息\n\
  \n* `MultiView` 编辑器包含两个视图。源（Source）视图是标准的 NetBeans Platform XML 编辑器。`VisualFX` 视图显示\
  \ XML 文件的 JavaFX 视图，仅显示内容而不编辑。然而，它会反映对源视图所所的任何编辑。\n* 你可以展开收藏窗口中的文件节点，每个子节点都会显示 `<person>`\
  \ 元素标签的属性和值。\n* 与之前的示例一样，当你编辑文件时，`Save All`（全部保存）图标以及 `Save All` 和 `Save`（保存）菜单项是启用的。保存更改后，收藏窗口会显示更改。当你在源和\
  \ `VisualFX` 视图之间切换时，窗口始终显示文件的当前编辑状态。\n\n注意，你可以选择性将此模块创建为 NetBeans IDE 插件，并在你的应用程序中使用\
  \ NetBeans IDE 的完整功能。然而，我们向你展示的是如何创建一个独立的 NetBeans Platform 应用程序。这需要你手动添加提供 XML\
  \ 文件编辑支持的模块。要将其创建为 NetBeans IDE 插件，不要创建 NetBeans Platform Application 项目。相反，为 `PersonFileType`\
  \ 模块创建一个 Module 项目并运行（Run）该模块。这将该模块安装到特定版本的 NetBeans IDE 中。\n\n以下是使用 XML 文件类型构建\
  \ `FamilyTreeApp` 应用程序的步骤总结。我们将在稍后的部分为 XML 编辑器添加一个自定义的 `VisualFX` 视图：\n\n* 创建名为\
  \ `FamilyTreeApp` 的 NetBeans Platform 应用程序。\n* 创建名为 `PersonFileType` 的模块。\n* 为应用程序添加\
  \ `Favorites`（收藏）和 `Template`（模板）模块。\n* 创建并注册名为 `FamilyTree` 的新基于 XML 文件类型。\n* 添加代码为\
  \ `FamilyTree` `DataNodes` 创建子节点。\n* 添加 NetBeans IDE XML 编辑器支持。\n* 为所有 `FamilyTree`\
  \ XML 文件添加名为 `Show XML Structure` 的右键菜单操作。\n\n## 创建 NetBeans Platform 应用程序和模块\n\n\
  以下是创建应用程序并添加 `PersonFileType` 模块的步骤。\n\n1. 使用 NetBeans Platform New Project 向导创建一个名为\
  \ `FamilyTreeApp` 的新应用程序。\n2. 创建一个模块并添加到 `FamilyTreeApp` 应用程序。将模块命名为 `PersonFileType`\
  \ 并提供包名 `com.asgteach.familytree.personfiletype`。应用程序和模块如图 14.23 中的项目（Projects）视图所示。\n\
