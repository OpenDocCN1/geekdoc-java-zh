  \n## 11.5 自定义对话框\n\n在上一节中，你看到了登录过程的构建；即一个请求用户名和密码的对话框，并在用户成功完成对话框之前会阻塞应用程序。我们可以使用\
  \ `@OnStart` 注解配合 `Runnable` 来创建并显示对话框。正如第 242 页的“模块生命周期注解””中讨论的那样，`@OnStart` `Runnable`\
  \ 在初始化期间在后台线程中执行。正如你很快看到的，我们通过使用 `Displayer.notifyLater()` 方法让对话框在 EDT 中显示。\n\n\
  让我们先检查对话框，然后向你展示如何创建、显示和处理登录对话框。图 11.11 显示了一个自定义的登录对话框。与之前一样，我们创建了一个包含两个 `JLabels`、一个用于姓名的\
  \ `JTextField` 和一个用于密码的 `JPasswordField` 的内部面板。(OEBPS/image9996.jpg)\n\n图 11.11\
  \ 带有名称、密码和图标的登录对话框\n\n对话框本身包含一个标题（“Please Login”）以及 Cancel 和 OK 按钮。与上一节不同，不需要对用户输入进行错误处理。一旦用户点击\
  \ OK，登录过程就会验证用户。如果身份验证过程成功，对话框关闭，应用程序运行。如果用户取消或关闭对话框，应用程序将退出。如果登录失败，对话框不会关闭。在这种情况下，登录过程会显示适当的错误消息，用户尝试重新登录。因此，此登录过程必须仔细控制用户关闭或退出对话框的能力。任何未成功登录的提前关闭都意味着应用程序退出。图\
  \ 11.12 显示了一个错误的登录场景。(OEBPS/image7004.jpg)\n\n图 11.12 身份验证失败时的登录对话框\n\n列表 11.12\
  \ 显示登录对话框的内部面板 `LoginPanel.java`。类 `LoginPanel` 继承自 `JPanel` 并定义了提供对话框用户界面的 Swing\
  \ 组件。`LoginPanel` 还包含用于访问用户提供的凭据的公共方法 `getUserName()` 和 `getPassword()`。\n\n11.12\
  \ LoginPanel——自定义登录 JPanel 点击此处查看代码图像\n\n\n\n\n我们将使用模块系统 API 的 `@OnStart` 注解结合 `Runnable`\
  \ 来创建一个在应用程序初始化过程中实例化的类。我们将创建、显示和处理此登录对话框的代码放在 `Runnable` 的 `run()` 方法中。（有关关于 `@OnStart`\
  \ 的更多信息，请参阅第 242 页上的“模块生命周期注解””。）我们通过以下步骤将 `@OnStart` `Runnable` 添加到 Dialogs 模块的主源包中。\n\
  \n1. `@OnStart` 注解需要依赖于模块系统 API。在 Dialogs 模块中，选择 `Libraries` 节点，右键点击并从上下文菜单中选择 `Add\
  \ Module Dependency . .`（添加模块依赖）。在 `Add Module Dependencies` 对话框中，选择 `Module System\
  \ API` 并点击 `OK`。\n2. 右键点击 `com.asgteach.dialogs` 包并选择 `New | Java Class . . . .`（新建\
  \ | Java 类）。\n3. NetBeans 显示 `New Java Class` 对话框。对于 `Class Name`，指定 `LoginInstaller`\
  \ 并点击 `Finish`。NetBeans 将文件 `LoginInstaller.java` 添加到包 `com.asgteach.dialogs` 中。\n\
  \nListing 11.13 显示了 `LoginInstaller` 类的代码，描述如下：\n\n* 为 `LoginInstaller` 添加 `@OnStart`\
  \ 注解，实现 `Runnable` 并重写 `run()` 方法。\n* 实例化包含对话框用户输入组件的内部面板。\n* 实现 `login()` 方法，该方法确定登录是否成功。在实际应用中，您将访问数据库或其他手段验证用户凭据。在这里，如果用户名和密码相同，`login()`\
  \ 方法返回 `true`。\n* 使用 `@Messages` 创建应用程序文本和错误消息。\n* 在 `run()` 方法内部，使用 `DialogDescriptor`\
  \ 创建对话框。在构造函数中指定内部面板和对话框标题，将对话框设为模态（这将阻塞应用程序直到对话框完成），并指定按钮 `ActionListener`（一种 Lambda\
  \ 表达式，下文所述）。您需要一个 `ActionListener` 是因为您将使用 `notifyLater()` 而不是 `notify()` 显示对话框，且用户响应无法从返回值中获取。\n\
  * 配置对话框。调用带有空数组的 `setClosingOptions()` 方法可以防止对话框在用户点击 `OK` 后关闭。否则，任何输入（无论是否有效）跟随\
  \ `OK` 都会关闭对话框。`createNotificationLineSupport()` 方法提供了一种在登录失败时向用户提供反馈的方法。\n* 配置属性更改监听器（另一个\
  \ Lambda 表达式）。监听 `DialogDescriptor.CLOSED_OPTION` 的出现并退出应用程序（此处应为“防止”）。这可以防止用户通过关闭对话框来绕过登录程序。\n\
  * 在 `ActionEventListener` 中处理与对话框的用户交互。如果用户取消，则退出应用程序。否则，用户点击 `OK`。从对话框面板中读取值并判断登录是否成功。\n\
  \    * 如果登录成功，重新启用正常的关闭选项，以便对话框关闭（随后应用程序启动）。\n    * 如果登录失败，显示错误消息。由于关闭选项被禁用，对话框保持打开状态，用户可以尝试再次登录。\n\
  * 使用 `DialogDisplayer.notifyLater()` 显示对话框。对话框将在 NetBeans Platform 启动界面后在 EDT 中显示，并阻塞应用程序直到用户完成成功登录。\n\
  \nListing 11.13 LoginInstaller.java—处理登录 点击此处查看代码图像\n\n```java\n@OnStart\npublic\
  \ class LoginInstaller implements Runnable {\n\n    private final LoginPanel panel\
  \ = new LoginPanel();\n\n    private DialogDescriptor dd = null;\n\n    // 存根方法：判断用户名和密码\n\
  \    // 是否相同，相同则登录成功！\n    private boolean login (String username, String password)\
  \ {\n        return username.equals(password) && !username.isEmpty();\n    }\n\n\
  \    @Messages({\n        \"LoginTitle=Please Login\",\n        \"LoginError=Incorrect\
  \ user name or password\"\n    })\n    @Override\n    public void run() {\n    \
  \    // @Onstart 默认在后台线程运行\n        // 在这里我们使用 notifyLater 安全地显示对话框。\n        //\
  \ 使用 LoginPanel 和 LoginTitle 创建对话框，将其设为模态，\n        // 并指定监听器\n        dd = new\
  \ DialogDescriptor(panel, Bundle.LoginTitle(), true,\n            (ActionEvent ae)\
  \ -> {\n                // 我们需要监听正在使用的按钮按下\n                // 使用 notifyLater 来显示对话框\n\
  \                if (ae.getSource() == DialogDescriptor.CANCEL_OPTION) {\n     \
  \               // 再见\n                    System.out.println(\"Canceled!\");\n\
  \                    LifecycleManager.getDefault().exit();\n                } else\
  \ {\n                    // 检查登录\n                    if (login(panel.getUserName(),\
  \ panel.getPassword())) {\n                        // 使用 null 启用所有关闭对话框的选项\n   \
  \                     // （这是溯溯，所以对话框将关闭\n                        // 应用程序将出现）\n \
  \                       dd.setClosingOptions(null);\n                    } else\
  \ {\n                        // 登录失败，重试\n                        dd.getNotificationLineSupport().setErrorMessage(\n\
  \                            Bundle.LoginError());\n                    }\n    \
  \            }\n            });\n\n        // 指定空数组防止任何选项关闭对话框\n        dd.setClosingOptions(new\
  \ Object[]{});\n        dd.createNotificationLineSupport();\n\n        // 定义属性监听器以防对话框被关闭\n\
  \        dd.addPropertyChangeListener((PropertyChangeEvent pce) -> {\n         \
  \   // 寻找 CLOSED_OPTION\n            if (pce.getPropertyName().equals(DialogDescriptor.PROP_VALUE)\n\
  \                && pce.getNewValue() == DialogDescriptor.CLOSED_OPTION) {\n   \
  \             // 再见\n                System.out.println(\"Closed!\");\n        \
  \        LifecycleManager.getDefault().exit();\n            }\n        });\n\n \
  \       // notifyLater 将在 EDT 中显示对话框\n        DialogDisplayer.getDefault().notifyLater(dd);\n\
  \    }\n}\n```\n\n\n\n\n# 11.6 综合运用\n\n现在你已经学习了对话框的基础知识，特别是 `Login` 对话框，我们将调整应用\
