  \ 15.11] 显示了 SDA 的面积图。面积图与折线图相似。然而，面积会对连接数据点的线条下方区域进行填充。请记住，每条线代表一个命名系列。由于面积图会创建重叠的填充区域，降低透明度可以使被遮挡的区域可见。\n\
  \n![](img/image9537.jpg)\n图 15.11 面积图\n\n你构建手机销售数据面积图的方法与折线图完全相同。为面积图创建一个模块并创建一个窗口（`AreaChartTopComponent`）。接下来，添加\
  \ `areachart.fxml` FXML 文件和 JavaFX 控制器类 `AreaChartController.java`。\n\n# 堆叠面积图 (Stacked\
  \ Area Chart)\n\n堆叠面积图 [图 15.12] 显示了 SDA 的堆叠面积图。如其名，堆叠面积图将绘制的区域堆叠在一起，而不是从 0 开始绘制每个系列的\
  \ Y 值。此图表能够更直观地提供每个时间段总量的变化。堆叠面积图还强调了每个命名系列的相对形状，显示了系列随时间的变化。例如，诺基亚和 RIM 系列具有相对“平坦”的形状，而其余四个系列具有“扩张”的形状。\n\
  \n![](img/image9545.jpg)\n图 15.12 堆叠面积图\n\n你构建堆叠面积图的方法与折线图完全相同。在这里，X 轴是 `CategoryAxis`，Y\
  \ 轴是 `NumberAxis`。为堆叠面积图创建一个模块并创建一个窗口（`StackedAreaChartTopComponent`）。接下来，添加 `stackedareachart.fxml`\
  \ FXML 文件和 JavaFX 控制器类 `StackedAreaChartController.java`。\n\n# 堆叠柱状图 (Stacked Bar\
  \ Chart)\n\n堆叠柱状图 [图 15.13] 显示了 SDA 的堆叠柱状图。堆叠柱状图将每个系列的条形堆叠在一起，而不是从 0 开始相邻渲染条形。这强调了每个时间段总量的变化。在[图\
  \ 15.13]中，你可以看到每个条形比上一个时间段的条形大，表明总销售额明显增长。\n\n![](img/image9552.jpg)\n图 15.13 堆叠柱状图\n\
  \n你构建堆叠柱状图的方法与折线图完全相同。同样，X 轴是 `CategoryAxis`，Y 轴是 `NumberAxis`。为堆叠柱状图创建一个模块并创建一个窗口（`StackedBarChartTopComponent`）。添加\
  \ `stackedbarchart.fxml` FXML 文件和 JavaFX 控制器类 `StackedBarChartController.java`。\n\
  \n# 气泡图 (Bubble Chart)\n\n气泡图 [图 15.14] 显示了 SDA 的气泡图，它同时利用绘制的“气泡”的相对大小和位置来可视化数据项的值。通过气泡图，你可以选择提供第三个数据值（除\
  \ X 和 Y 点值外）来指示气泡的半径。在这里，我们配置此额外值以显示数据项相对于该时间段总量的相对百分比。因此，较大的气泡表示该时间段有更大的市场份额，较小的气泡代表较小的市场份额。如果不提供额外值，所有气泡的大小都相同。请注意，当你调整气泡图大小时，绘制的气泡的相对大小是恒定的。然而，当你扩大或缩小图表的垂直或水平轴时，气泡的形状可能会发生变化。\n\
  \n![](img/image9561.jpg)\n图 15.14 气泡图\n\nBubbleCharts 不使用 `CategoryAxis`。X 轴和 Y\
  \ 轴类型均为 `NumberAxis`。为了让图表更具视觉吸引力，我们为 X 轴年份值提供了一个字符串格式化器。由于两个轴使用 `NumberAxis` 类型，图表、观察列表和数据项的泛型均指定为\
  \ `Number`。\n\n现在让我们展示配置图表并构建图表数据的 `BubbleChartController` 类。我们还展示了 X 轴的自定义格式化程序和\
  \ `TableModelListener` 代码，因为这些与你目前看到的 XY 图表略有不同。\n\n列表 15.15 显示了 `@FXML` 声明和 `createBubbleChartData()`\
