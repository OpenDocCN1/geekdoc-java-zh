  }\n```\n\n\n\n\n\n`MapChangeListenerFamilyTreeManager` 方法 `updatePerson()` 使用新的\
  \ `Person` 数据更新 `FamilyTreeManager` 的可观察映射（map）。由于我们为 `FamilyTreeManager` 的可观察映射绑定了一个监听器，当发生更新时，监听器的事件处理程序会被调用。该事件处理方法包含了新值。更改监听器会替换\
  \ `TreeView` 中对应于此新值的 `Person`。注意，我们现在必须使用 `getId()` 来比较 `Person` 对象。`Person` 方法\
  \ `equals()` 将无法不起作用，因为该方法会比较所有的 `Person` 属性。列表 4.25 显示了代码。\n\n### 列表 4.25 针对 FamilyTreeManager\
  \ Map 的 MapChangeListener 点击查看代码图像\n\n```java\n// 当底层 FamilyTreeManager 变化时触发 MapChangeListener\n\
  private final MapChangeListener<Long, Person> familyTreeListener =\n    (change)\
  \ -> {\n        if (change.getValueAdded() != null) {\n            logger.log(Level.FINE,\
  \ \"changed value = {0}\", change.getValueAdded());\n            // 找到匹配的 treeitem\
  \ 并替换它\n            for (TreeItem<Person> node : personTreeView.getRoot().getChildren())\
  \ {\n                if (change.getKey().equals(node.getValue().getId())) {\n  \
  \                  // 更新会在 getValueAdded() 中返回新值\n                    node.setValue(change.getValueAdded());\n\
  \                    return;\n                }\n            }\n        }\n    };\n\
  ```\n\n上述更改监听器使用 `TreeView` 方法 `getRoot().getChildren()` 来遍历 `TreeView` 中的项。`MapChangeListener`\
  \ 更改事件包含方法 `getKey()`（被更改的 `Person` 对象的键）、`getValueAdded()`（被添加的 `Person` 对象）和 `getValueRemoved()`（被移除的\
  \ `Person` 对象）。当一个对象被替换时，`getValueAdded()` 是新值，而 `getValueRemoved()` 是旧值。在这里，我们没有访问旧值，但在尝试执行替换之前，我们会确保新值非空。\n\
  \n## 关于松耦合的说明\n请注意，这个小型 JavaFX 应用程序遵循了我们在 Swing 示例应用程序中描述的相同的松耦合原则（参见第 59 页的“事件处理器与松耦合”）。具体来说，`TreeView`\
  \ UI 控制没有从 Update 按钮事件处理器访问，尽管按钮事件处理器知道显示在 `TreeView` 中的 `Person` 对象即将发生。此外，`FamilyTreeManager`\
  \ 和 `Person` 是纯模型对象，对任何 UI 控制均没有依赖关系。\n\nJavaFX 双向绑定提供了一种方便的方法，使模型对象（此处为 `Person`）与允许用户更改模型属性的\
  \ UI 控制保持同步。`PersonFXMLAppEnhancedUI` 提供了 Swing 程序 `PersonSwingAppEnchancedUI` 的功能等实现。\n\
  \n## 4.5 并发与线程安全\nJavaFX 像 Swing 一样是单线程 GUI。对场景图的所有更改必须在 JavaFX 应用程序线程上进行。这意味着，如果你有一个长时间运行的后台任务，你应该在单独的线程中执行该任务，以保持\
  \ UI 的响应性。第 73 页的“Swing 后台任务”向你展示如何使用辅助类 `SwingWorker` 在 Swing 中实现。让我们将这些并发和线程安全的原则应用于我们的\
  \ JavaFX 示例。\n\n### JavaFX 中的并发\n`JavaFX Platform` 类有几个静态方法可以帮助处理多线程应用程序：`runLater()`\
  \ 和 `isFXApplicationThread()`。\n\n#### Platform.runLater()\n静态方法 `runLater()` 提交一个\
  \ `Runnable` 在未来的未指定时间执行。这类似于 `SwingUtilities.invokeLater()`，其中其他已调度的 UI 事件可能会先发生。从后台线程使用\
  \ `runLater()` 执行更新 JavaFX 场景图的代码。\n\n#### Platform.isFXApplicationThread()\n静态方法\
  \ `isFXApplicationThread()` 如果调用线程是 JavaFX 应用程序线程，则返回 `true`。当你想要执行更新 JavaFX 场景图的代码且可能不在后台线程时，请使用此方法。\n\
  \n### 可观察属性与线程安全\nJavaFX 的一个通用线程安全问题是，你不应该在后台线程中更新绑定到场景图属性或影响场景图属性的可观察值。可观察值包括你可以绑定的\
  \ JavaFX 属性，以及你可以为其附加监听器的属性。然而，通过监听器，你可以采取措施，并将更新场景图的代码放置在 `runLater()` 中。但是，通过绑定时，如果属性更改影响了场景图，你必须确保更新在\
  \ JavaFX 应用程序线程上发生。对于 `Person` 及其许多可以绑定到 JavaFX UI 控制的 JavaFX 属性，我们通过包含性（containment）来确保线程安全。也就是说，我们只在\
  \ JavaFX 应用程序线程中更新 `Person` 对象。此外，当我们在后台线程中使用 `Person` 对象时，我们总是会创建一个线程安全的本地副本。\n\
  \n让 JavaFX 版本的 `FamilyTreeManager` 变得是有趣的。首先，调用者可以向可观察映射附加更改监听器。如果修改发生在后台线程，则更改事件将在后台线程触发。在\
  \ Swing 版本中，我们通过 `PropertySupport` 解决这个问题。该辅助类配置支持在 EDT 上触发属性事件。在 JavaFX 中，我们将采取相反的方法处理\
  \ `FamilyTreeManager` 代码。也就是说，我们将负担交给调用者，并要求监听器在 JavaFX 应用程序线程上处理更改。我们检查方法是否在 JavaFX\
  \ 应用程序线程上调用，并通过调用 `runLater()` 处理更改。这确保了场景图的任何更改都在 JavaFX 应用程序线程上执行。列表 4.26 显示了\
  \ `Person` 类中修改后的 `MapChangeListener` 方法。\n\n### 列表 4.26 修改后的 MapChangeListener\
  \ 点击查看代码图像\n\n```java\n// 当底层 FamilyTreeManager 变化时触发 MapChangeListener\n// 检查是否在\
  \ FXT，如果不是调用 Platform.runLater()\nprivate final MapChangeListener<Long, Person>\
  \ familyTreeListener =\n    (change) -> {\n        if (Platform.isFxApplicationThread())\
  \ {\n            logger.log(Level.FINE, \"Is JavaFX Application Thread\");\n   \
  \         updateTree(change);\n        } else {\n            logger.log(Level.FINE,\
  \ \"Is BACKGROUND Thread\");\n            Platform.runLater(()-> updateTree(change));\n\
  \        }\n    };\n\nprivate void updateTree(MapChangeListener.Change<? extends\
  \ Long, ? extends Person> change) {\n    if (change.getValueAdded() != null) {\n\
  \        // 找到匹配的 treeitem 并替换它\n        for (TreeItem<Person> node : personTreeView.getRoot().getChildren())\
  \ {\n                if (change.getKey().equals(node.getValue().getId())) {\n  \
  \                  // 更新会在 getValueAdded() 中返回新值\n                    node.setValue(change.getValueAdded());\n\
  \                    return;\n                }\n            }\n        }\n    }\n\
  }\n```\n\n\n\n\n\n[Listing 4.27] 展示了线程安全的 JavaFX 版本 `FamilyTreeManager`，它遵循了我们在[第\
  \ 2 章]的 Swing 版本中展示的许多步骤。可观察映射使用 `ConcurrentHashMap` 作为其底层集合。`getInstance()` 方法以及\
  \ `add` 和 `remove` 监听器方法也经过了同步处理。\n\n在对映射进行更改的方法中，我们首先对 `Person` 进行拷贝。`getAllPeople()`\
  \ 方法在填充列表时，也会对每个 `Person` 项进行拷贝。这些方法都是同步的。\n\nListing 4.27 线程安全的 FamilyTreeManager\n\
  [点击此处查看代码图像]\n\n```java\npackage com.asgteach.familytree.model;\n\nimport java.util.ArrayList;\n\
  import java.util.List;\nimport java.util.concurrent.ConcurrentHashMap;\n\nimport\
  \ javafx.beans.InvalidationListener;\nimport javafx.collections.FXCollections;\n\
  import javafx.collections.MapChangeListener;\nimport javafx.collections.ObservableMap;\n\
  \npublic class FamilyTreeManager {\n    private final ObservableMap<Long, Person>\
  \ observableMap =\n            FXCollections.observableMap(new ConcurrentHashMap<Long,\
  \ Person>());\n\n    private static FamilyTreeManager instance = null;\n\n    protected\
  \ FamilyTreeManager() { } // 安全的懒初始化\n\n    public synchronized static FamilyTreeManager\
  \ getInstance() {\n        if (instance == null) {\n            instance = new FamilyTreeManager();\n\
  \        }\n        return instance;\n    }\n\n    public synchronized void addListener(\n\
  \            MapChangeListener<? super Long, ? super Person> ml) {\n        observableMap.addListener(ml);\n\
  \    }\n\n    public synchronized void removeListener(\n            MapChangeListener<?\
  \ super Long, ? super Person> ml) {\n        observableMap.removeListener(ml);\n\
  \    }\n\n    public synchronized void addListener(InvalidationListener il) {\n\
  \        observableMap.addListener(il);\n    }\n\n    public synchronized void removeListener(InvalidationListener\
  \ il) {\n        observableMap.removeListener(il);\n    }\n\n    public synchronized\
  \ void addPerson(Person p) {\n        final Person person = new Person(p);\n   \
  \     observableMap.put(person.getId(), person);\n    }\n\n    public void updatePerson(Person\
  \ p) {\n        // both addPerson and updatePerson use observableMap.put()\n   \
  \     addPerson(p);\n    }\n\n    public synchronized void deletePerson(Person p)\
  \ {\n        final Person person = new Person(p);\n        observableMap.remove(person.getId());\n\
  \    }\n\n    public synchronized List<Person> getAllPeople() {\n        List<Person>\
  \ copyList = new ArrayList<>();\n        observableMap.values().stream().forEach((p)\n\
  \                -> copyList.add(new Person(p)));\n        return copyList;\n  \
  \  }\n}\n```\n\n## 4.6 JavaFX 后台任务\n\nJavaFX 有一个并发包 `javafx.concurrent`，其中的类允许你创建后台任务并安全地监控任务的进度、状态和结果。JavaFX\
  \ 并发包包含两个主要的类：`Task` 和 `Service`，它们都实现了 `Worker` 接口。`Task` 是不可重用的，但 `Service` 可以。让我们检查一下\
  \ `Task` 类并学习如何在后台线程中调用它。\n\n### Worker 和 Task\n`Task` 和 `Service` 类都实现了 `Worker`\
  \ 接口，并具有通用的 JavaFX 属性和定义良好的生命周期。我们在示例中只使用了 `Task`，但 `Service` 同样实现了 `Worker` 并共享这一生命周期和属性。`Task`\
  \ 对象的生命周期由 `Worker.State` 值定义。`Worker` 始终从 `READY` 状态开始其生命周期。然后它过渡到 `SCHEDULED`\
  \ 然后是 `RUNNING`。它会保持在 `RUNNING` 状态，直到完成或被取消。完成后，状态将变为 `SUCCEEDED`、`FAILED` 或 `CANCELLED`\
  \ 之一。\n\n### Worker.State 值\n`Task` 对象维护了几个只读的 JavaFX 属性，你可以从 JavaFX 线程安全地观察这些属性。这些属性允许你监控任务的状态，并在成功完成后访问一个值，或者在任务运行时访问任务的进度。\n\
  \n### 只读的 JavaFX 属性\n`Task` 必须提供 `call()` 方法，该方法在后台线程中调用。`call()` 返回其泛型类型的值。此外，你可以定义对应\
  \ `Task` 各种完成状态的回调方法，以便根据 `Task` 的结果处理结果。`Task` 类还提供了几个可以从任何线程调用的方法来更新 `Task` 属性。请注意，更新可能不会立即发生，多次更新调用可能会被合并以减少事件通知。\n\
  \n### 线程安全的 Task 方法\n在对 JavaFX `Task` 有了通用描述后，让我们修改上一节中的 JavaFX FamilyTree 应用程序，创建一个后台任务来更新\
  \ `FamilyTreeManager` 中编辑过的 `Person` 。我们将此程序称为 `PersonFXMLMultiThread`。由于程序在后台任务中更新\
  \ `FamilyTreeManager` 中的 `Person`，我们将在场景图中添加一个进度指示器以显示工作已完成。图 4.15 显示了该程序运行添加的进度指示器。\n\
  \n### 程序 PersonFXMLMultiThread：在后台线程中更新 Person 数据\nJavaFX 进度指示器控件是一个圆形显示器，反映完成的百分比（使用饼形填充表示部分完成）或用于不确定任务的旋转虚线圆形图形。默认构造函数会创建一个不确定状态的指示器。要创建一个显示完成百分比的进度指示器，请在构造函数中（或\
  \ FXML 标记中）为 `progress` 属性指定起始值。通常，进度指示器仅在后台任务执行期间可见。当任务完成后，指示器将再次变为隐藏。在此应用程序中，我们通过绑定来控制进度指示器的可见性。\n\
  \n为了让进度指示器反映任务进度，将进度指示器的 `progress` 属性绑定到后台任务的状态。例如，以下代码创建了一个反映名为 `myTask` 的后台任务完成情况的指示器。在任务执行期间，根据需要调用\
  \ `updateProgress()` 方法。该方法在 JavaFX 线程中更新任务的 `progress`、`workDone` 和 `totalWork`\
  \ 属性，允许你安全地绑定到 `progress` 属性。\n\n```java\nProgressIndicator myProgressIndicator\
  \ = new ProgressIndicator(0.0);\n...\n// 开始后台任务\n...\nTask<Void> myTask = new Task<Void>()\
  \ { ... };\nmyProgressIndicator.progressProperty().bind(myTask.progressProperty());\n\
  new Thread(myTask).start(); // 完成后台任务\n```\n\n[Listing 4.28] 显示了在场景图中更新 FXML 文件。我们使用了默认构造函数，它将进度指示器配置为不确定状态。\n\
  \n```xml\n<children>\n    ...\n    <Button fx:id=\"updateButton\" layoutX=\"14.0\"\
  \ layoutY=\"280.0\"\n            onAction=\"#updateButtonAction\" text=\"Update\"\
  \ />\n    <ProgressIndicator fx:id=\"updateProgressIndicator\" layoutX=\"117.0\"\
  \n            layoutY=\"272.0\" />\n</children>\n...\n```\n\n\n\n\n实现后台任务所需的大多数更改都在\
  \ `Controller` 类中。首先，列表 4.29 显示了对类声明和 `initialize()` 方法进行的更改。我们为进度指示器提供了 `@FXML`\
  \ 注解以控制其可见性。我们还添加了一个 `IntegerProperty` 计数器（`backgroundActive`），用于反映当前活跃的后台任务数量。我们使用\
  \ Fluent API 方法 `greaterThan(0)` 将进度指示器的可见性绑定到该属性上。由于我们在后台任务开始时递增属性 `backgroundActive`，并在任务完成时递减它，因此进度指示器仅在后台任务激活状态时才保持可见。\n\
  \n### 整数计数器与线程安全\n注意，我们始终在 `JavaFX Application Thread` 上访问属性 `backgroundActive`。这意味着我们可以安全地更新并绑定到该属性。\n\
  \n### 列表 4.29 Controller 类的更改：声明和 initialize() 点击此处查看代码图像\n\n```java\n    @FXML\n\
  \    private Button updateButton;\n    @FXML\n    private ProgressIndicator updateProgressIndicator;\n\
  \    private static final Logger logger = Logger.getLogger(\n                PersonFXMLController.class.getName());\n\
  \    private final FamilyTreeManager ftm = FamilyTreeManager.getInstance();\n  \
  \  private Person thePerson = null;\n    private ObjectBinding<Person.Gender> genderBinding;\n\
  \    private boolean changeOK = false;\n    private BooleanProperty enableUpdateProperty;\n\
  \    private IntegerProperty backgroundActive = new SimpleIntegerProperty(0);\n\
  \    ...\n    @Override\n    public void initialize(URL url, ResourceBundle rb)\
  \ {\n        ...\n        updateProgressIndicator.visibleProperty()\n          \
  \                       .bind(backgroundActive.greaterThan(0));\n        ...\n \
  \   }\n```\n\n当然，巨大的变化发生在 Update 按钮的事件处理器方法 `updateButtonAction()` 中，该方法在列表 4.30\
  \ 所示。在启动 `Task` 之前，事件处理器必须在 `JavaFX Application Thread` 上配置几个变量。首先，事件处理器对类字段 `thePerson`\
  \ 创建一个本地拷贝。如果在任务完成之前再次点击 Update 按钮，随后的任务将拥有其自己的 `Person` 对象的拷贝。其次，我们禁用了 Update 按钮（直到对此\
  \ `Person` 或另一个 `Person` 进行进一步编辑）。第三，我们递增了 `backgroundActive` 属性。由于我们使用了不确定的进度指示器，`Task`\
  \ 需要执行的工作很少。它实现了 `call()` 方法来调用 `FamilyTreeManager updatePerson()` 方法。我们为成功完成（`setOnSucceeded`）和失败完成（`setOnFailed`）创建了回调方法。这些方法在\
  \ `Task` 完成后始终在 `JavaFX Application Thread` 上调用，因此你可以在这里执行场景图的修改。我们递减属性 `backgroundActive`。由于存在绑定，如果\
  \ `backgroundActive` 的新值小于 1，这将使进度指示器变为可见。在完全定义 `Task` 后，我们通过点击此处查看代码图像 `new Thread(updateTask).start();`\
  \ 启动后台线程。注意，与 Swing 示例一样，我们通过在后台线程（在 `call()` 方法中）包含对 `Thread.sleep()` 的调用，人为地使其成为长时间运行的任务。`call()`\
  \ 返回更新后的 `Person` 对象，我们在 `onSucceeded` 属性的方法中访问它。`onFailed` 属性的方法则访问 `Exception`\
  \ 对象（可能为 null）。\n\n### 列表 4.30 方法 updateButtonAction() 点击此处查看代码图像\n\n```java\n \
  \   @FXML\n    private void updateButtonAction(ActionEvent event) {\n        //\
  \ 在后台线程上更新家族树管理器\n        final Person person = new Person(thePerson);\n       \
  \ enableUpdateProperty.set(false);\n        backgroundActive.set(backgroundActive.get()\
  \ + 1);\n        Task<Person> updateTask = new Task<Person>() {\n            @Override\n\
  \            protected Person call() throws Exception {\n                Thread.sleep(100);\
  \ // test\n                ftm.updatePerson(person);\n                return person;\n\
  \            }\n        };\n        updateTask.setOnSucceeded(t -> {\n         \
  \   backgroundActive.set(backgroundActive.get() - 1);\n            logger.log(Level.FINE,\
  \ \"Update finished: {0}\", t.getValue());\n            logger.log(Level.FINE, \"\
  tasksInBackground = {0}\", backgroundActive.get());\n        });\n        updateTask.setOnFailed(t\
  \ -> {\n            backgroundActive.set(backgroundActive.get() - 1);\n        \
  \    logger.log(Level.WARNING, \"Update failed {0}\",\n                t.Exception()\
  \ != null ? t.Exception() : \"Unknown failure\");\n            logger.log(Level.FINE,\
  \ \"tasksInBackground = {0}\", backgroundActive.get());\n        });\n        new\
  \ Thread(updateTask).start();\n    }\n```\n\n为了向你展示这一切是如何工作的，让我们运行应用程序 `PersonFXMLAppMultiThread`\
  \ 并编辑 `Person Bart`。这里是当我们点击 Update 按钮保存更改时产生的日志消息。所示，`MapChangeListener` 事件处理器在后台线程上被调用（参见第\
  \ 174 页 的 列表 4.26）。点击此处查看代码图像\n```text\n04, 2013 10:05:35 personfxmlapp.PersonFXMLController\
  \ lambda$6\nFINE: selected person = Bart Simpson\n04, 2013 10:06:08 personfxmlapp.PersonFXMLController\
  \ lambda$4\nFINE: Is BACKGROUND Thread\n04, 2013 10:06:08 personfxmlapp.PersonFXMLController\
  \ updateTree\nFINE: changed value = Bart Seymour Simpson\n04, 2013 10:06:08 personfxmlapp.PersonFXMLController\
  \ lambda$1\n```\n\n\n\n\n# 更新任务完成：Bart Seymour Simpson 4.7 监控后台任务\n\n现在，让我们向您展示几个示例，它们可以向主\
  \ JavaFX 线程提供定期或部分结果。这些示例程序允许用户启动一个后台任务，将 `FamilyTreeManager` 中的 `Person` 项转换为全大写。当转换完成时，UI\
  \ 会显示每个 `Person`，标签会显示当前正在处理的 `Person`。这些示例都向您展示了如何在执行后台任务期间安全地更新 JavaFX UI。\n\n\
  我们讨论了若干种从后台任务向主 JavaFX 线程提供部分结果的方法，接如下所示：\n\n*   **程序 PersonFXMLAppFXWorker**：`AppFXWorker`\
  \ 调用了线程安全的方法 `updateValue()` 来提供中间结果或部分结果。我们使用与任务的 `valueProperty()` 绑定来安全地更新 UI。\n\
  *   **程序 PersonFXMLAppFXWorker2**：定义了一个只读属性，并在后台任务执行期间（安全地）更新此属性。当任务更新可观测集合时，这种方法非常方便。该程序展示了配合\
  \ `TableView` 等控件使用可观测集合是多么简单。\n*   **程序 PersonFXMLAppFXWorker3**：在后台任务执行期间（安全地）更新\
  \ JavaFX 场景图。当长时间运行的后台任务产生用于创建 UI 节点的数据时，这种方法非常有用。\n\n让我们向您展示这些方法中的每一个。\n\n### 使用方法\
  \ updateValue()\n\n图 4.16 显示了应用程序 `PersonFXMLAppFXWorker` 正在运行。请注意，当后台任务运行时 UI 处于激活状态，用户可以并发选择并编辑\
  \ `Person` 项。在这里，您可以看到正在运行大大写转换任务，以及正在将 `Person` 更新到 `FamilyTreeManager` 的后台任务。（大大写转换不会保存大大写的\
  \ `Person` 项；它只是在做重复性工作！）\n\n![](img/image2730.jpg)\n**图 4.16 PersonFXMLAppFXWorker：运行后台任务，并在\
  \ UI 中显示部分结果**\n\n在检查后台任务代码之前，让我们先向您展示我们添加到 JavaFX 场景图中的 UI 控件。\n\n### ProgressBar\n\
  进度条提供了一个水平条，和进度指示器一样，它也可以是不定的。然而，在这个示例中，我们使用一个通过更新其 `progress` 属性来指示完成百分比的进度条。`progress`\
  \ 属性是一个介于 0（0% 完成）和 1（100% 完成）之间的 `double` 值。\n\n我们在场景图中添加了文本区域、标签、进度条和按钮。列表 4.31\
  \ 显示了 Scene Builder 生成的用于添加这些 UI 控件的 FXML 标记。`Process All` 按钮和进度条由 `HBox` 布局控件维护，用于水平放置。`Label`\
  \ 和 `TextArea` 放置在 `HBox` 组件的上方和下方。\n\n**列表 4.31 为 FXML 添加控件**\n```xml\n<HBox id=\"\
  HBox\" alignment=\"CENTER\" layoutX=\"7.0\" layoutY=\"176.0\" spacing=\"5.0\">\n\
  \    <children>\n        <Button fx:id=\"processAllButton\" onAction=\"#processAllButtonAction\"\
  \ text=\"Process All\" />\n        <ProgressBar fx:id=\"progressBar\" prefWidth=\"\
  161.0\" progress=\"0.0\" />\n    </children>\n</HBox>\n<TextArea fx:id=\"statusTextArea\"\
  \ editable=\"false\" layoutX=\"7.0\" layoutY=\"208.0\" prefHeight=\"106.0\" prefWidth=\"\
  257.0\" wrapText=\"true\" />\n<Label fx:id=\"statusMessage\" layoutX=\"7.0\" layoutY=\"\
  147.0\" />\n```\n\n* * *\n\n## 安全地更新 UI\n\n表 4.3 位于第 178 页，列出了您可以从后台线程安全调用的 `Task`\
  \ 方法。这些方法在 JavaFX 线程上使 `Task` 更新相应的 JavaFX 属性。这允许您安全地将 UI 控件绑定到这些属性的任何一个，或在绑定表达式中使用。您将看到我们在\
  \ `call()` 中调用了 `updateMessage()`、`updateProgress()` 和 `updateValue()`，以保持 `Task`\
  \ 属性与任务进度同步。\n\n### 扩展 Task\n\n我们之前的示例直接使用了类 `Task`。在这里，我们扩展了 `Task` 以封装几个类变量，如列表\
  \ 4.32 所示。类 `ProcessAllTask` 扩展了 `Task`，并泛型为 `<String>`。这意味着方法 `call()` 返回 `String`，方法\
  \ `getValue()` 返回 `String`，`valueProperty()` 返回一个只读的 `String` JavaFX 属性，方法 `updateValue()`\
  \ 需要一个 `String` 参数。在这里，`String` 属性 `value` 存储了转换为大写字母的名字。\n\n`ProcessAllTask` 构造函数接收\
  \ `ObservableList<Person>` 并将其存储在 `ProcessAllTask` 类变量 `processList` 中（注：原文此处变量名为\
  \ `processAll` 但代码中为 `processList`，翻译遵循代码逻辑）。\n\n**列表 4.32 ProcessAllTask**\n```java\n\
  private class ProcessAllTask extends Task<String> {\n    private ObservableList<Person>\
  \ processList;\n    private final StringBuilder buildList = new StringBuilder();\n\
  \n    public ProcessAllTask(final ObservableList<Person> processList) {\n      \
  \  this.processList = processList;\n    }\n\n    @Override\n    protected String\
  \ call() throws Exception {\n        logger.log(Level.FINE, \"Begin processing\"\
  );\n        final int taskCount = processList.size();\n        logger.log(Level.FINE,\
  \ \"processing list: {0}\", processList);\n        int taskProgress = 0;\n     \
  \   for (final Person person : processList) {\n            if (isCancelled()) {\n\
  \                break;\n            }\n            // 对每个 person 做处理\n        \
  \    updateMessage(\"Processing \" + person);\n            logger.log(Level.FINE,\
  \ \"processing: {0}\", person);\n            doProcess(person);\n            buildList.append(person.toString()).append(\"\
  \\n\");\n            // 使用新的 buildList 更新值属性\n            updateValue(buildList.toString());\n\
  \            updateProgress(100 * (++taskProgress) / taskCount, 100);\n        \
  \    Thread.sleep(500);\n        }\n        // 返回最终构建的 String 结果\n        return\
  \ buildList.toString();\n    }\n\n    // 在后台线程调用\n    private void doProcess(Person\
  \ p) {\n        p.setFirstname(p.getFirstname().toUpperCase());\n        p.setMiddlename(p.getMiddlename().toUpperCase());\n\
  \        p.setLastname(p.getLastname().toUpperCase());\n        p.setSuffix(p.getSuffix().toUpperCase());\n\
  \    }\n}\n```\n* * *\n\n\n\n\n\n[Listing 4.33] 显示了“全部处理”按钮的事件处理程序，该程序启动了后台任务。处理程序通过一个\
  \ `Person` 项列表实例化了 `ProcessAllTask`。然后，它在 UI 控件与被监控的 `ProcessAllTask` 属性之间建立了绑定。事件处理器还创建了回调方法，这些方法会在后台任务完成（无论成功、失败还是取消）时在\
  \ JavaFX 线程上调用。最后，事件处理器在一个新的后台线程中启动任务。\n\n事件处理器通过将 UI 控件进度条绑定到任务的 `progress` 属性来建立绑定。它还将\
  \ UI Label 控件绑定到任务的 `message` 属性，该属性显示当前正在处理的 `Person`。最后，事件处理器将 UI TextArea 控件绑定到任务的\
  \ `value` 属性。\n\n回调方法记录了 `Task` 的结果并重置了 UI 控件（接下来显示了 `resetUI()` 方法）。\n\n### Listing\
  \ 4.33 方法 `processAllButtonAction()`\n\n```java\n@FXML\nprivate void processAllButtonAction(ActionEvent\
  \ event) {\n    logger.log(Level.FINE, \"Process All Button\");\n    // 一次只运行一个任务，因此禁用按钮\n\
  \    processAllButton.setDisable(true);\n    // 使用列表创建任务\n    final ProcessAllTask\
  \ processTask = new ProcessAllTask(\n            FXCollections.observableArrayList(ftm.getAllPeople()));\n\
  \    // 配置 UI\n    progressBar.progressProperty().bind(processTask.progressProperty());\n\
  \    statusMessage.textProperty().bind(processTask.messageProperty());\n    statusTextArea.textProperty().bind(processTask.valueProperty());\n\
  \    // 设置成功和失败的句柄程序\n    processTask.setOnSucceeded(t -> {\n        logger.log(Level.FINE,\
  \ \"Process All task finished: {0}\",\n                t.getSource().getValue());\n\
  \        resetUI();\n    });\n    processTask.setOnFailed(t -> {\n        // t.getSource().getException()\
  \ 可能为 null\n        logger.log(Level.WARNING, \"Update task failed {0}\",\n    \
  \            t.getSource().getException() != null\n                ? t.getSource().getException()\n\
  \                : \"Unknown failure\");\n        resetUI();\n    });\n    processTask.setOnCancelled(t\
  \ -> {\n        logger.log(Level.FINE, \"Process All task cancelled.\");\n     \
  \   resetUI();\n    });\n    // 在后台线程中启动任务\n    new Thread(processTask).start();\n\
  }\n```\n\n### Listing 4.34 方法 `resetUI()`\n\n[Listing 4.34] 显示了如何重置 UI。注意，在重置它们的属性之前，我们必须解绑\
  \ UI 控件。`resetUI()` 还重新启用了“全部处理”按钮。\n\n```java\n// 重置 UI\nprivate void resetUI()\
  \ {\n    statusTextArea.textProperty().unbind();\n    statusTextArea.setText(\"\"\
  );\n    progressBar.progressProperty().unbind();\n    progressBar.setProgress(0);\n\
  \    statusMessage.textProperty().unbind();\n    statusMessage.setText(\"\");\n\
