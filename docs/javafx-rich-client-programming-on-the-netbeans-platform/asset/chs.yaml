  \ `GroupNode` 添加的 `Index.Support` 以及 `PersonNode` 在组中的当前位置启用。Listing 9.21 `PersonNode—实现\
  \ MoveUp 和 MoveDown`\n\n* * *\n\n```java\npublic class PersonNode extends AbstractNode\
  \ {\n    ...\n    @Override\n    public Action[] getActions(boolean context) {\n\
  \        return new Action[]{\n            CutAction.get(CutAction.class),\n   \
