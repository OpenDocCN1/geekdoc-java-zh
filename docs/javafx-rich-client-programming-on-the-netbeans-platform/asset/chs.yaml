  \             }\n                    }\n                }\n            }\n     \
  \   }\n    }\n}\n}\n```\n\n\n\n\n\n# 创建工具栏操作以向视图添加小组件\n\n`FTR` 编辑器的视觉视图允许用户编辑小组件的文本标签并删除小组件（通过将其标签设置为空字符串）。现在，让我们为应用程序的工具栏和顶层“文件”菜单添加一个操作，允许用户向视图添加小组件（并在文档中添加新行文本）。该操作将是条件启用的，仅在视觉视图拥有焦点（激活状态）时才可用。\n\
  \n我们知道上下文是由 `Global Lookup`（全局查找）的内容的。因此，让我们创建一个新的能力，并向 `FamilyTreeVisualElement`\
  \ 的 `Lookup` 添加一个实现。我们还创建一个条件启用的操作，用于调用该能力中的特定方法。步骤如下：\n\n* 创建一个名为 `Droppable` 的新能力，包含抽象方法\
  \ `drop()`。\n* 创建一个新的条件启用的 `Add Name`（添加名称）操作，用于调用 `drop()` 方法。\n* 使用构建 `LabelWidget`\
  \ 的代码实现 `Droppable`。将此实现添加到 `FamilyTreeVisualElement` 的 `Lookup` 中。\n\n图 14.18 显示了\
  \ `FileTypeApp` 的运行情况。只有当 `FTR` 编辑器的视觉视图拥有焦点时，`Add Name` 操作才会启用。点击工具栏中的 `Add Name`\
  \ 图标后，该操作会显示对话框提示输入名称。当用户提供名称并点击 OK 时，一个新的 `LabelWidget` 将出现在视觉视图的底部。随后 `Save All`（保存全部）图标将变为可用。\n\
  \n![](img/image8873.jpg)\n图 14.18 调用 Add Name 操作\n\n以下是具体步骤。\n\n1. 在模块 `FamilyTreeSupport`\
  \ 中添加 Java 接口 `Droppable`，如列表 14.17\n\n```java\npublic interface Droppable {\n \
  \   public void drop(String text);\n}\n```\n\n2. 在模块 `FamilyTreeSupport` 中添加一个新的名为\
  \ `AddNameAction` 的条件启用操作，它向用户请求文本 `String` 并使用该文本调用 `drop()` 方法。指定 `Droppable`\
  \ 为 `Cookie Class`（上下文）。列表 14.18\n\n```java\n@ActionID(\n    category = \"Edit\"\
