  FINE: Node updated: Bart Simpson\n```\n\n\n\n\n## 使用 Swing 组件\n\n关于 Swing 组件及其所有\
  \ API 的讨论将满一整本书。我们这里的目标是让您熟悉一些常用的组件（特别是出现在我们示例程序中的组件）。Swing 还有布局组件，用于处理窗口内组件的排列布局。然而，使用\
  \ Swing 表单设计器的优势在于，你可以使用拖放式编辑器来排列你的组件。\n\n图 2.14 显示了 Swing 组件的部分类层次结构。请注意，大多数组件都继承自\
  \ `JComponent`，它包含了许多控制外观的方法，例如字体、背景颜色、前景颜色、边框和透明度。\n\n![](img/image1201.jpg)图 2.14\
  \ Swing 组件层次结构（部分）\n\n### JLabel\n我们的程序使用 `JLabel` 组件来持有静态文本，并使用 `JTextField` 组件来编辑文本。\n\
  \n`JLabel` 持有用户不编辑的文本，尽管你可以通过程序更改文本。以下是定义一个显示“First.”的 `JLabel` 的代码。点击此处查看代码图像\n\
  \n```java\njavax.swing.JLabel jLabel1 = new javax.swing.JLabel();\njLabel1.setText(\"\
  First\");\n```\n\n`JLabel` 组件可以比上述代码所示的更为复杂。你可以在标签上同时使用图像（图标）和文本，使用 HTML 格式化标签文本，并使用\
  \ `JComponent` 方法 `setFont()`、`setForeground()`、`setBorder()`、`setOpaque()` 和 `setBackground()`\
  \ 配置它们的外观。你还可以将标签与另一个组件（例如 `JTextField`）连接起来，让关联组件影响标签的外观。为了此目的，使用方法 `setLabelFor()`\
  \ 将标签与另一个组件关联。\n\n我们使用 `JLabel` 在我们的 Swing 应用中显示静态文本，如第 42 页的 图 2.6 所示。\n\n### JTextField\n\
  `JTextField` 允许用户在单行字段内编辑文本。使用方法 `setText()` 写入文本字段的文本，使用 `getText()` 读取其内容。如果用户按下\
  \ Enter 或 Return 键，`JTextField` 会生成一个 `Action` 事件。`JTextField` 的底层模型是 `Document`，它允许你监听插入、删除和替换编辑操作。然而，对于我们目前的示例，我们不响应任何事件，仅使用\
  \ `getText()` 和 `setText()` 来保持我们的模型数据与文本字段同步。\n\n以下是文本字段的代码，它持有 `Person` 属性 `firstname`\
  \ 并从一个 `Person` 对象（`thePerson`）设置其值。点击此处查看代码图像\n\n```java\nJTextField firstTextField\
  \ = new javax.swing.JTextField();\nfirstTextField.setText(thePerson.getFirstname());\n\
  ```\n\n这里是从文本字段更新 `Person` 对象（`thePerson`）的代码。点击此处查看代码图像\n\n```java\nthePerson.setFirstname(firstTextField.getText());\n\
  ```\n\n### JTextArea\n虽然 `JTextField`getget 单行输入很有用，但 `JTextArea` 允许你提供多行输入。我们使用\
  \ `JTextArea` 来编辑 `Person` 的 `notes` 属性，并让用户提供多行输入。与 `JTextField` 类似，使用 `setText()`\
  \ 文本，使用 `getText()` 读取文本区域的文本。点击此处查看代码图像\n\n```java\nJTextArea notesTextArea = new\
  \ javax.swing.JTextArea(); // 在文本区域设置文本\nnotesTextArea.setText(thePerson.getNotes());\
  \ // 从文本区域获取文本\nthePerson.setNotes(notesTextArea.getText());\n```\n\n### JRadioButton\n\
  `JRadioButtons` 提供一个开启/关闭的切换。一起放置在单选按钮组中的单选按钮提供互斥行为。这意味着一次只能选择一个单选按钮。当你选择另一个单选按钮时，同一组中的其他单选按钮会自动变为“关闭”。我们使用这种互斥行为来确定人的性别。该值只能是男、女或未知之一。\n\
  \n以下是定义三个性别单选按钮、性别单选按钮组以及初始化它们的代码。`ButtonGroup` 组件为单选按钮组件提供了互斥行为。点击此处查看代码图像\n\n\
  ```java\n// Define the ButtonGroup\nButtonGroup genderButtonGroup = new javax.swing.ButtonGroup();\
  \ // Define the 三个 JRadioButtons\nJRadioButton maleButton = new javax.swing.JRadioButton();\n\
  JRadioButton femaleButton = new javax.swing.JRadioButton();\nJRadioButton unknownButton\
  \ = new javax.swing.JRadioButton(); // Add the radiobuttons to the ButtonGroup\n\
  genderButtonGroup.add(maleButton);\nmaleButton.setText(\"Male\"); \ngenderButtonGroup.add(femaleButton);\n\
  femaleButton.setText(\"Female\"); \ngenderButtonGroup.add(unknownButton);\nunknownButton.setText(\"\
  Unknown\");\n```\n\n`setSelected()` 和 `isSelected()` 方法设置并查询 `JRadioButton`。在这里，我们从\
  \ `Person` 对象的性别属性设置单选按钮。点击此处查看代码图像\n\n```java\nif (thePerson.getGender().equals(\"\
  Male\")) {\n    maleButton.setSelected(true);\n} else if (thePerson.getGender().equals(\"\
  Female\")) {\n    femaleButton.setSelected(true);\n} else if (thePerson.getGender().equals(\"\
  Unknown\")) {\n    unknownButton.setSelected(true);\n}\n```\n\n### JButton\n`JButton`\
  \ 组件在用户点击按钮时提供一个图形。你可以创建带有文本或图标（或两者）的按钮。按钮可以启用和禁用，你通常会定义一个动作处理器。我们在示例中使用 Update\
  \ 按钮。点击此处查看代码图像\n\n```java\n// Create a JButton with text \"Update\"\nJButton updateButton\
  \ = new JButton(\"Update\"); // we begin with the disabled\nupdateButton.setEnabled(false);\
  \ // later we enable the button\nupdateButton.setEnabled(true); // define an action\
  \ handler\nupdateButton.addActionListener((ActionEvent e) -> {\n    // do something\n\
  });\n```\n\n### JTree\n`JTree` 组件显示层次信息。`JTree` 提供了展开树节点的句。树显示来自模型的数据。我们在示例中使用默认模型，它由一个根节点和子节点组成。子节点可以有子节点，也可以是“叶”节点。我们示例中的层次结构非常简单。顶部节点是一个字符串（People”）带有五个子节点，这些都是叶节点。每个子节点都是一个\
  \ `Person` 对象。`JTree` 使用对象的 `toString()` 方法进行显示。以下是构建 `JTree` 模型和 `JTree` 的代码。点击此处查看代码图像\n\
  \n```java\n// Define the top node\nDefaultMutableTreeNode top = new DefaultMutableTreeNode(\"\
  People\"); // Create the JTree with node top\nJTree personTree = new JTree(top);\
  \ // Set the selection model to single (即,不是多选)\npersonTree.getSelectionModel().setSelectionMode(TreeSelectionModel.SINGLE_TREE_SELECTION);\
  \ // Build the JTree model using FamilyTreeManager getAllPeople()\nftm.getAllPeople().forEach(p\
  \ -> top.add(new DefaultMutableTreeNode(p)));\n```\n\n这是访问所选节点的方法点击此处查看代码图像](#part0069.xhtml)\n\
  \n```java\n// Get the selected node\nDefaultMutableTreeNode node = (DefaultMutableTreeNode)\
  \ personTree.getLastSelectedPathComponent();\n```\n\n你可以通过 `getUserObject()` 方法访问节点中的对象。在这里，我们检查所选节点是否是“叶”节点，因为所有的\
  \ `Person` 对象（在我们示例中）都存储在叶节点中。点击此处查看代码图像\n\n```java\nif (node == null) {\n    //\
  \ 没有节点被选中\n} else if (node.isLeaf()) {\n    // 它是一个子节点，所以我们知道它是一个 Person 对象\n  \
