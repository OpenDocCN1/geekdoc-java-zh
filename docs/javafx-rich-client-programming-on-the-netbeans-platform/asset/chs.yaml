  \ 数据库服务器并执行 `FamilyTreeApp`。首次运行应用程序，持久化单元（Persistence Unit）会生成数据库表。`FamilyTreeModel`\
  \ 的 `OnStart` 类会创建示例数据（参见第 242 页的“使用 OnStart”）。\n\n在用户做出更改后运行的 `FamilyTreeApp`（添加了人物\
  \ Abraham Simpson 并更新了多条记录）。我们之前实现的完整 CRUD 操作像以前一样工作，只是现在数据存储在数据库中。\n\n### 查看数据库\n\
  运行应用程序后，你可以在 NetBeans IDE 的 `Services` 窗口中查看数据库结构。展开 `Databases` 节点，右键点击数据库 `jdbc:derby://localhost:1527/personftm`\
  \ [`PERSONFTM` 上的 `personftm`]，并选择 `Connect`。连接后，展开 `PERSONFTM` | `Tables` | `PERSON`\
  \ 以查看数据库列。\n\n你还可以查看数据。在 `Services` 窗口中，右键点击表 `PERSON`，并从右键菜单中选择 `View Data`。执行\
  \ SQL 后，你会在 IDE 的窗口中看到显示的数据。\n\n\n\n\n\n当你在调用 `ChildFactory` 并将异步标志置为 `true` 时，工厂的\
  \ `createKeys()` 和 `refresh()` 方法将在后台线程中执行（`refresh()` 方法的布尔标志会被忽略）。在 `PersonChildFactory`\
  \ 中不需要进行其他更改即可实现这种并发性。\n\n### 进度指示器\n\n你可以在 `PersonChildFactory` 的 `createKeys()`\
