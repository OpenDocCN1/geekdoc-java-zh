  \     Person person = (Person) node.getUserObject();\n        logger.log(Level.INFO,\
  \ \"{0} selected\", person);\n        // 将人放入此 TopComponent 的 Lookup 中\n       \
  \ instanceContent.set(Collections.singleton(person), null);\n    } else {\n    \
  \    logger.log(Level.INFO, \"{0} selected\", node.getUserObject());\n        Person\
  \ person = getLookup().lookup(Person.class);\n        if (person != null) {\n  \
  \          instanceContent.remove(person);\n        }\n    }\n};\n```\n\n#### InstanceContent\
  \ 提示\n注意在 代码清单 5.9 中，方法 `instanceContent.set()` 将 `Lookup` 重置为单例 `Person` 对象。要移除\
  \ `Lookup` 中当前的 `Person` 对象，请使用 `lookup(Person.class)` 找到 `Person` 对象并使用 `instanceContent.remove()`\
  \ 将其移除。\n\n#### 配置 `TopComponent` 生命周期方法\n\n配置 `TopComponent` 生命周期周期方法 `componentOpened()`\
  \ 和 `componentClosed()`，如 代码清单 5.10 所示。（您通常在 `componentOpened()` 方法中添加监听器，并在 `componentClosed()`\
  \ 方法中移除它们。`TopComponent` 生命周期方法在第 369 页的“窗口系统生命周期管理”中有讨论。）\n\n在 `componentOpened()`\
  \ 方法中，如前所述，使用应用程序的 `Global Lookup` 获取服务提供者 `FamilyTreeManager` 的实例。然后，使用之前在 Swing\
  \ 应用版本见过的代码，调用 `buildData()` 来实例化多个 `Person` 对象并向 `FamilyTreeManager` 服务提供者注册属性更改监听器。`createNodes()`\
  \ 构建 `JTree` 数据结构。我们还为 `JTree personTree` 注册了树选择监听器。`componentClosed()` 则移除已注册的监听器。\n\
  \n**代码清单 5.10 `TopComponent` `componentOpened()` 和 `componentClosed()`**\n\n```java\n\
  @Override\npublic void componentOpened() {\n    ftm = Lookup.getDefault().lookup(FamilyTreeManager.class);\n\
  \    if (ftm == null) {\n        logger.log(Level.SEVERE, \"Cannot get FamilyTreeManager\"\
  );\n        Lifecycle.getDefault().exit();\n    }\n    buildData();\n    ftm.addPropertyChangeListener(treeListener);\n\
  \    personTree.getSelectionModel().setSelectionMode(TreeSelectionModel.SINGLE_SELECTION);\n\
  \    createNodes();\n    personTree.addTreeListener(treeListener);\n}\n\n@Override\n\
  public void componentClosed() {\n    personTree.removeTreeListener(treeListener);\n\
  \    ftm.removePropertyChangeListener(treeListener);\n}\n```\n\n#### 辅助方法\n添加 `buildData()`\
  \ 和 `createNodes()` 的代码，如 代码清单 5.11 所示。注意 `buildData()` 与 `Person.java` 中保持不变，但\
  \ `createNodes()` 现在包含了额外的代码，通过 `scrollToVisible()` 展开 `JTree`。由于此方法需要一个 `TreePath`\
  \ 参数，我们使用 `treeModel` 来获取路径。`treeModel` 定义在 代码清单 5.7 中。\n\n```java\nprivate void\
  \ buildData() {\n    ftm.addPerson(new Person(\"Homer\", \"Simpson\", Gender.MALE));\n\
  \    ftm.addPerson(new Person(\"Marge\", \"Simpson\", Gender.FEMALE));\n    ftm.addPerson(new\
  \ Person(\"Bart\", \"Simpson\", Gender.MALE));\n    ftm.addPerson(new Person(\"\
  Lisa\", \"Simpson\", Gender.FEMALE));\n    ftm.addPerson(new Person(\"Maggie\",\
  \ \"Simpson\", Gender.FEMALE));\n    logger.log(Level.FINE, ftm.getAllPeople().toString());\n\
  }\n\nprivate void createNodes() {\n    ftm.getAllPeople().stream().forEach((p) ->\
