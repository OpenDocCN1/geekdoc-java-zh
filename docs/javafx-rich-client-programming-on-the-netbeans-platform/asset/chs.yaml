  \ 12.21 自定义数字范围验证器\n\n## 12.6 提前结束选项\n\nNetBeans Platform 向导程序允许为用户提供一个提前结束向导的选项。然而，提前结束始终是一个选项，而不是强制要求。用户仍然可以通过选择“下一步”（Next）继续进入下一个面板。\n\
  \n这种区别非常重要。如果你想创建一个动态用例，即用户根据其选择处理不同的面板，或者向导因为用户的选择而提前结束，那么在创建向导时，请选择“动态向导步骤序列”（Dynamic\
