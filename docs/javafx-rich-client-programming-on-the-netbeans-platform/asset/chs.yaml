  \ 点击工具栏中的日历操作\n\n## 2. 操作与查找（Actions and Lookup）\n\n`TopComponents` 和节点都拥有持有对象的查找（Lookups）。这些对象使得菜单项（或工具栏图标）能够专门适用于聚焦的\
  \ `TopComponent` 或选中的节点。你会看到全局查找（Global Lookup）的内容会影响用户可以选择的操作。\n\n### 回调操作（Callback\
  \ Actions）\n\n回调操作是全局操作，根据哪个组件拥有焦点而具有不同的行为。它们通过键注册，你通过在 `ActionMap` 中安装它们来配置 `TopComponents`。`ActionMap`\
  \ 是 `TopComponent` 继承自 `JComponent` 的，它提供了键与 `Action` 对象之间的映射。你可以使用 `TopComponent’s\
  \ ActionMap` 为你的 `TopComponent` 启用 NetBeans Platform 操作（如剪切、粘贴）。\n\n此外，回调操作可以有一个“回退”实现，当\
  \ `TopComponent’s ActionMap` 中没有对应版本时会调用该实现。在这种情况下，操作始终是用的，因为在聚焦窗口没有版本的情况下会访问回退版本。让我们通过如下更改回调操作的配置来演示并探索其行为：\n\
  \n1. 首先，注册一个带有回退实现的 `Refresh` 回调操作。由于回调操作具有回退实现，因此它是始终启用的。\n2. 接下来，在 `Gender TopComponent\
  \ 的 ActionMap` 中安装此回调操作的一个版本。当 `Gender TopComponent` 聚焦时，执行此本地安装的实现。否则，执行回退实现。\n\
  3. 最后，移除回退实现，你会发现只有当 `Gender TopComponent` 聚焦时，`Refresh` 回调操作才可用。\n\n## 创建回退操作（Fallback\
  \ Action）\n\n图 9.10 显示了应用程序中启用的 Refresh 菜单。执行 `Refresh` 操作会弹出显示“This is the Fallback”的对话框。![](img/image590.jpg)图\
