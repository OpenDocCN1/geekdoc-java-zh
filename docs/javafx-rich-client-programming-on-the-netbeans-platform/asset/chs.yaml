  \ 包中。\n4. 在设计视图中打开 `CalendarPanel.java`（点击 `Design` 标签）。确保其 `JLabel` 组件的变量名为 `myLabel`。重置图标属性，以便其使用资源包中的\
  \ `calendar64.png` 文件。\n5. 在 Java 编辑器中打开 `CalendarPanel.java`（点击 `Source` 标签）。在类中添加\
  \ `setText()` 公有方法，如列表 9.9 所示。\n\n列表 9.9 `CalendarPanel.java`点击此处查看代码图片\n\n```java\n\
  public class CalendarPanel extends javax.swing.JPanel {\n    ...\n    public void\
  \ setText(String text) {\n        myLabel.setText(text);\n    }\n}\n```\n\n## 在\
  \ PersonNode 中实现 CalendarCapability\n需要若干修改才能使 `PersonNode` 拥有 `CalendarCapability`。此前，`PersonNode`\
  \ 的 `Lookup` 包含一个对象（`Person`），这是在构造函数中设置的。现在，我们希望在 `Lookup` 中添加 `CalendarCapability`\
  \ 的实现。由于 `InstanceContent` 允许动态地向 `Lookup` 添加和删除对象，我们在构造函数中使用 `instanceContent.add()`\
  \ 添加了一个匿名类。其中，我们实例化 `CalendarPanel` 并调用 `setText()` 方法，将对象的名称显示在对话框中。最后，我们重写 `getActions()`\
  \ 方法将日历操作包含在节点菜单中。列表 9.10 显示了这些修改。\n\n列表 9.10 `PersonNode.java—配置操作`点击此处查看图片\n\n\
  ```java\n@Messages({\n    \"HINT_PersonNode=Person\",\n    \"CTL_CalendarTitle=Calendar\
  \ Action\"\n})\npublic class PersonNode extends AbstractNode implements PropertyChangeListener\
  \ {\n    private static final Logger logger = Logger.getLogger(PersonNode.class.getName());\n\
  \    private final InstanceContent instanceContent;\n\n    public PersonNode(Person\
  \ person) {\n        this(person, new InstanceContent());\n    }\n    private PersonNode(Person\
  \ person, InstanceContent ic) {\n        super(Children.LEAF, new AbstractLookup(ic));\n\
  \        instanceContent = ic;\n        instanceContent.add(person);\n        setIconBaseWithExtension(\"\
  com/asgteach/familytree/genderviewer/resources/personIcon.png\");\n        setName(String.valueOf(person.getId()));\n\
  \        setDisplayName(person.toString());\n        setShortDescription(Bundle.HINT_PersonNode());\n\
  \        // 向此节点添加日历能力\n        instanceContent.add(new CalendarCapability() {\n\
  \            @Override\n            public void doCalendar() {\n               \
  \ CalendarPanel panel = new CalendarPanel();\n                panel.setText(\"<html>Calendar\
  \ Action applied to<p/>\" + person + \"</html>\");\n                DialogDescriptor\
  \ dd = new DialogDescriptor(panel, Bundle.CTL_CalendarTitle());\n              \
  \  DialogDisplayer.getDefault().notify(dd); // 显示 & 阻塞\n            }\n        });\n\
  \    }\n\n    @SuppressWarnings(\"unchecked\")\n    @Override\n    public Action[]\
  \ getActions(boolean context) {\n        List<Action> personActions = new ArrayList<>(Arrays.asList(super.getActions(context)));\n\
  \        // 添加分隔符\n        personActions.add(null);\n        personActions.addAll(Utilities.actionsForPath(\"\
  Actions/Nodes\"));\n        return personActions.toArray(new Action[0]);\n    }\n\
  }\n```\n\n\n\n\n```java\nreturn personActions.toArray(\n    new Action[personActions.size()]);\n\
  \    }\n}\n```\n\n我们添加到 `PersonNode` 中的代码提供了两个不同的功能：\n\n*   其一，在 `PersonNode` 的\
  \ `Lookup` 中添加 `CalendarCapability` 实现，允许在用户选择该节点时启用 `Calendar` 动作。\n*   其二，重写 `getActions()`\
  \ 方法并在 `PersonNode` 的动作列表中包含 `Calendar` 动作，可以使 `Calendar` 显示在 `PersonNode` 的右键菜单中。\n\
  \n如果你没有将 `CalendarCapability` 上下文放入节点的 `Lookup` 中，但仍然重写了 `getActions()`，那么该动作将永远不会启用，但它仍会以禁用状态显示在节点的右键菜单中。相反，如果你将上下文放在了\
  \ `Lookup` 中，但没有重写 `getActions()` 方法，则当用户选择该节点时，`Calendar` 将在 `File` 菜单和工具栏中启用，但它不会出现在节点的右键菜单中。\n\
  \n图 9.19 显示了带有 `PersonNode` 右键菜单且工具栏启用 `Calendar` 动作图标的应用程序。![](img/image5779.jpg)\n\
  图 9.19 PersonNode 右键菜单现在包含了 Calendar 动作\n\n### 配置节点的首选动作\n\n双击节点会调用节点的首选动作。要设置节点的首选动作，请重写\
  \ `getPreferredAction()` 方法并返回一个动作。要使 `Calendar` 动作成为 `PersonNode` 的首选动作，我们返回路径\
  \ `\"Actions/Nodes,\"` 中的第一个（也是唯一的）动作，如列表 9.11 所示。\n\n列表 9.11 PersonNode.java—getPreferredAction()\
  \ 方法点击查看代码图片\n\n```java\n@SuppressWarnings(\"unchecked\")\n@Override\npublic Action\
  \ getPreferredAction() {\n    List<Action> personActions = (List<Action>) Utilities.actionsForPath(\n\
  \        \"Actions/Nodes\");\n    if (!personActions.isEmpty()) {\n        return\
  \ personActions.get(0);\n    } else {\n        return super.getPreferredAction();\n\
  \    }\n}\n```\n\n请注意，你可以重或不重写 `getActions()` 来重写 `getPreferredAction()`。如果你不重写\
  \ `getActions()`，节点的右键菜单将不包含 `Calendar` 动作，但你仍然可以通过双击调用 `Calendar` 动作。\n\n### 层文件\
  \ (Layer File)\n\nNetBeans Platform 的层文件是我们讨论窗口组的一部分（参见第 8 章] 第 382 页，“窗口组示例](#part0015.xhtml_toc197_Window_Group_Example)”）。在历史上，你通过编辑模块的层文件来注册动作，层文件是配置\
  \ NetBeans Platform 应用程序的 XML 文件。NetBeans Platform 的构建过程仍然会解析模块的层文件（如果存在），并为应用程序生成单一的\
  \ `layer.xml` 文件。\n\n现在，模块大部分可以通过注解进行配置，通常不需要对每个模块的层文件进行直接编辑。然而，在底层，层文件仍然存在，检查它们可能会很有帮助。例如，在注册动作时，你分配给动作的类别会影响它的“路径”（在应用程序虚拟文件系统中的位置）。\n\
  \n列表 9.12 显示了 `FamilyTreeActions` 模块生成的层文件。该层文件包含了我们示例中的 `NodeCalendarAction` 和\
  \ `RefreshAction` 的注册信息。你可以如下所示在应用程序构建目录的 File 视图中查看模块的层文件：\n\n点击查看代码图片\n`build/cluster/modules/module-name.jar/META-INF/generated-layer.xml`\n\
  其中 `module-name.jar` 是基于模块代码基命名的 jar 包。并非所有模块都有生成的层文件。\n\n通过查看层文件，你可以看到每个动作类别都有自己的文件夹（在这里你看到了“Nodes”文件夹和“File”文件夹）。同样，顶层\
  \ `Menu` 也有它自己的文件夹（“Menu”），以及工具栏（“Toolbars”）。此层文件包含了在此模块中定义的动作的注册信息。其他模块提供它们自己的层文件和动作注册（如果有的话）。上下文相关的\
  \ `NodeCalendar` 动作仅针对单个节点注册（\"EXACTLY_ONE\"）。有关层文件的更多详细信息，请参见第 [64 页，“文件系统 API](#part020.xhtml_qMBfnXb5SheAX34J3qw_Uw18271)”。\n\
