  \n到此时，我们构建了一个使用 `hashmap` 作为数据存储的 `FamilyTreeApp`。对于我们这个简单的示例（没有关系的 `Person` 对象），`hashmap`\
  \ 提供了一个能够说明许多 NetBeans 平台特性的足够解决方案。然而，当你的应用程序需要持久化数据存储时，这并不是一个可行的方案。在我们移动到下一步（包括使用数据库）时，NetBeans\
  \ 平台通过以下几种方式帮助我们完成迁移：\n\n- 数据库 CRUD 操作是由 `FamilyTreeManager` 执行的“黑盒”操作。\n- 由于 `FamilyTreeManager`\
  \ 已经是一个服务提供者，我们可以轻松地替换为一个使用数据库的新提供者。\n\n在本节中，我们将向你展示如何使用 `JavaDB` 和 `JPA` 实现 `FamilyTreeManager`。`JavaDB`\
  \ 是 NetBeans IDE 内置的数据库。`JPA`（Java 持久化 API）为基于持久化的应用程序提供了中间件。注意，任何 `JPA` 和数据库软件在这里都适用。我们使用\
  \ `JavaDB` 和 `EclipseLink` 是因为它们随 NetBeans IDE 和 JDK 一起发布。\n\n在使用数据库（或 Web 服务）时，必须确保应用程序保持响应能力。解决方案是在后台执行可能耗长时间运行的代码。我们在第\
  \ 2 章（参见第 73 页的“Swing 后台任务”）和第 4 章（参见第 176 页的“JavaFX 后台任务”）中奠定了这种方法的基础。在下一节中，我们将为应用程序添加并发处理以保持\
  \ UI 响应。\n\n我们将是将 `FamilyTreeApp` 应用程序迁移到数据库的方法：\n\n- 为数据库和 `JPA` 软件创建包装库（Wrapped\
  \ libraries）。包装库是 NetBeans 平台模块，包含配置了公共包的 `JAR` 文件。\n- 启动 `JavaDB` 内置数据库服务器并创建一个数据库来存储应用程序数据。\n\
  - 创建一个模块来持有持久化单元（persistence unit）、实体类以及 `FamilyTreeManager` 服务提供者，以执行 `JPA`/数据库操作。\n\
  - 为数据库中的每个表创建一个对应的实体类（在本示例中只有一个）。\n- 创建一个持久化单元来描述用于 `JPA` 的实体类、数据库和表生成策略。\n- 实现一个使用\
  \ `JPA` 的 `FamilyTreeManager` 服务提供者。\n- 修改 `Person.java`，使其不再自动递增 `id` 属性，而是获取数据库生成的\
  \ `id`。\n\n`FamilyTreeApp` 用于 CRUD 操作的改进无需进一步修改即可使用（得益于 NetBeans 平台的模块系统和服务提供者机制）。\n\
  \n### 创建包装库\n\nNetBeans 平台允许你通过创建名为库模块（Library Modules）或包装库的模块在应用程序中使用外部库。包装库是包含\
  \ `JAR` 文件（即外部库存档）的模块。`JAR` 包是公开的，以便其他模块根据需要设置依赖。你可以将多个 `JAR` 文件封装在一个模块中。\n\n为了实现数据库功能，我们将创建包装库。第一个库包含\
  \ `JavaDB` 连接软件（`Derby Client` `JAR` 文件）。第二个库包含提供 `JPA` 的 `EclipseLink` `JAR` 文件。这些库文件在\
  \ NetBeans IDE 分发包中可用。\n\n#### Derby Client 模块\n\n首先，如下所示创建 `Derby Client` 模块：\n\
  \n1. 选择 `FamilyTreeApp` 节点，右键点击并选择 `Add Library`。NetBeans 启动新库向导并显示 `Select Library`\
  \ 对话框。\n2. 点击 `Browse` 按钮，导航到 NetBeans Glassfish 子目录 `javadb/lib`，并选择 `derbyclient.jar`，如图\
  \ 10.10 所示。在 `Select Library` 对话框中点击 `Select` 然后点击 `Next`。\n![OEBPS/image617.jpg]\
  \ 图 10.10 在库模块中选择 derbyclient.jar\n3. 在 `Name` 和 `Location` 对话框中，为项目名称指定 `DerbyClient`，接受其他字段的默认值并点击\
  \ `Next`，如图 10.11 所示。\n![OEBPS/image623.jpg] 图 10.11 为项目名称指定 DerbyClient\n4. 在 `Basic\
  \ Module Configuration` 对话框中，为代码基指定 `org.apache.derby`，接受其他字段的默认值并点击 `Finish`，如图\
  \ 10.12 所示。\n![OEBPS/image629.jpg] 图 10.12 为库模块配置代码基\n\nNetBeans 会创建一个名为 `DerbyClient`\
  \ 的新模块并将其所有包公开。\n\n### EclipseLink 模块\n\n按照相同的步骤创建名为 `EclipseLink` 的第二个包装库。`EclipseLink`\
  \ 库由四个 `JAR` 文件组成，位于 NetBeans IDE 分发包的 `NetBeans/java/modules/ext/eclipink`（具体位置取决于操作系统和\
  \ NetBeans 版本）。需要的 `JAR` 文件如下（xx 代表不同的版本号）。在 `JAR` 文件选择对话框中，通过 Control-Click 可以选择多个\
  \ `JAR` 文件。\n\n```\neclipselink-xx.jar\njavax.persistence_xx.jar\norg.eclipse.persistence.jpa.jpql_xx.jar\n\
  ```\n\n\n\n\n\n`org.eclipse.persistence.jpa.modelgen_xx.jar` 选择上述所有的 JAR 文件。使用项目名称\
  \ `EclipseLink` 和代码名称基 `org.eclipselink`。两个库封装模块（`DerbyClient` 和 `EclipseLink`）将如图\
  \ 10.13 所示显示在展开了 `Libraries` 节点的项目视图中。![](img/image6540.jpg)图 10.13 DerbyClient\
  \ 和 EclipseLink 封装库模块\n\n## JavaDB 服务器与数据库\nNetBeans IDE 自带有一个完整的 SQL 数据库。要使用它，你必须按照如下方式启动\
  \ `JavaDB Server`：\n\n* 在 NetBeans IDE 的 `Services` 选项卡中，展开 `Databases` 节点，右键点击\
  \ `JavaDB` 并从上下文菜单中选择 `Start Server`。\n* 在 IDE 的 `Output` 窗口中，你将看到一个 `JavaDB Data\
  \ Process` 标签页，输出内容所示。\n\n```\nTue Feb 18 16:02:47 PST 2014 : Apache Derby Network\
  \ Server - 10.8.1.2 -\n(1095077) started and ready to accept connections on port\
  \ 1527\n```\n\n**JavaDB 服务器提示**：注意，在应用程序添加此数据库功能后，运行 `FamilyTreeApp` 之前必须启动 `JavaDB\
  \ Server`。\n\n* *\n\n### 创建数据库\n在 `JavaDB Server` 运行时，你现在可以创建一个存储由 `FamilyTreeApp`\
  \ 管理的数据数据库。\n\n1. 在 `Services` 窗口中，右键点击 `JavaDB` 并从上下文菜单中选择 `Create Database ...`。\n\
  2. NetBeans 显示一个 `Create Java DB Database` 对话框。为所有字段（数据库名称、用户名、密码和确认密码）指定 `personftm`，如图\
  \ 10.14 所示。![](img/image6560.jpg)图 10.14 创建 Java DB 数据库\n3. 你现在会在 `JavaDB` 下（展开它）看到列出的\
  \ `personftm` 以及一个 `JDBC-Derby URL`。你可以连接到此数据库，但它还没有任何表或结构。你将通过定义持久化单元和实体类来提供结构。\n\
  \n### 实现 FamilyTreeManager\n创建一个新模块来实现一个使用 JPA 的 `FamilyTreeManager`。\n\n### 创建新模块并添加依赖\n\
  1. 在 `FamilyTreeApp` 中，右键点击 `Modules` 节点并从上下文菜单中选择 `Add New...`。\n2. 将项目名称设置为 `FamilyTreeManagerJPA`，其代码名称基设置为\
  \ `com.asgteach.familytree.manager.jpa`。\n3. 此模块需要一些依赖项。右键点击 `Libraries` 节点并在上下文菜单中选择\
  \ `Add Module Dependencies...`。\n4. 为模块 `DerbyClient`、`EclipseLink`、`FamilyTreeModel`、`Lookup\
  \ API` 和 `Utilities API` 设置依赖并点击 OK。\n\n### 创建实体类\nJPA 使用实体类来持久化数据。我们的实体类将与你见过的\
  \ `Person` 类非常相似，但带有定义了其持久化行为的注解。我们将实体类（`PersonEntity`）隔离在在此模块中，并保留 `Person` 作为全应用程序范围的域对象，它不是一个持久化实体。\n\
  \n按照如下方式创建类：\n1. 右键点击 `FamilyTreeManagerJPA` 包名，并从上下文菜单中选择 `New | Java Class`。\n\
  2. 指定类名为 `PersonEntity`。提供代码，如列表 10.21 所示。\n\n关于这个 JPA 实体类，有几点重要的特性值得讨论：\n* `PersonEntity`\
  \ 使用 `@Entity` 将该类指定为 JPA 实体类。\n* 可选注解 `@Table` 指定了它的表名（否则，JPA 使用类名 `PersonEntity`\
  \ 作为表名）。\n* 注解 `@Id` 和 `@GeneratedValue` 指定字段 `id` 是主键，且其值是自动生成的。（这将要求我们移除 `Person`\
  \ 类中的自增代码。）\n* 注解 `@Version` 用于 JPA 跟踪对实体的修改，并映射到表中的名为 `VERSION` 的列。\n* `PersonEntity`\
  \ 属性（`firstname`、`middlename`、`lastname`、`suffix`、`gender` 和 `notes`）映射到数据库中同名的列。\n\
  \n列表 10.21 `PersonEntity.java`\n\n```java\n@Entity\n@Table(name=\"Person\")\npublic\
  \ class PersonEntity implements Serializable {\n    private static final long serialVersionUID\
  \ = 1L;\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.AUTO)\n    private\
  \ Long id;\n\n    @Version\n    private int version;\n    private String firstname\
  \ = \"\";\n    private String middlename = \"\";\n    private String lastname =\
  \ \"Unknown\";\n    private String suffix = \"\";\n    private Person.Gender gender\
  \ = Person.Gender.UNKNOWN;\n    private String notes = \"\";\n\n    public PersonEntity()\
  \ {\n    }\n\n    public synchronized String getFirstname() {\n        return firstname;\n\
  \    }\n\n    public synchronized void setname(String firstname) {\n        this.firstname\
  \ = firstname;\n    }\n\n    public synchronized String getLastname() {\n      \
  \  return lastname;\n    }\n\n    public synchronized void setname(String lastname)\
  \ {\n        this.lastname = lastname;\n    }\n\n    public synchronized String\
  \ getMiddlename() {\n        return middlename;\n    }\n\n    public synchronized\
  \ void setMiddlename(String middlename) {\n        this.middlename = middlename;\n\
  \    }\n\n    public synchronized String getNotes() {\n        return notes;\n \
  \   }\n\n    public synchronized void setNotes(String notes) {\n        this.notes\
  \ = notes;\n    }\n\n    public synchronized Person.Gender getGender() {\n     \
  \   return gender;\n    }\n\n    public synchronized void setGender(Person.Gender\
  \ gender) {\n        this.gender = gender;\n    }\n\n    public synchronized String\
  \ getSuffix() {\n        return suffix;\n    }\n\n    public synchronized void setSuffix(String\
  \ suffix) {\n        this.suffix = suffix;\n    }\n\n    public synchronized Long\
  \ getId() {\n        return id;\n    }\n\n    @Override\n    public boolean equals(Object\
  \ o) {\n        if (o == null) {\n            return false;\n        }\n       \
  \ if (getClass() != o.getClass()) {\n            return false;\n        }\n    \
  \    return this.getId().equals(((PersonEntity) o).getId());\n    }\n\n    @Override\n\
  \    public int hashCode() {\n        int hash = 7;\n        hash = 97 * hash +\
  \ (this.id != null ? this.id.hashCode() : 0);\n        return hash;\n    }\n\n \
  \   @Override\n    public String toString() {\n        StringBuilder sb = new StringBuilder();\n\
  \        sb.append(\"[\").append(getId()).append(\"] \");\n        if (!this.getFirstname().isEmpty())\
  \ {\n            sb.append(this.getFirstname());\n        }\n        if (!this.getMiddlename().isEmpty())\
  \ {\n            sb.append(\" \").append(this.getMiddlename());\n        }\n   \
  \     if (!this.getLastname().isEmpty()) {\n            sb.append(\" \").append(this.getLastname());\n\
  \        }\n        if (!this.getSuffix().isEmpty()) {\n            sb.append(\"\
  \ \").append(this.getSuffix());\n        }\n        return sb.toString();\n    }\n\
  }\n```\n\n## 创建持久化单元\n有了实体类和数据库后，你现在可以为此模块创建一个持久化单元。持久化单元由名为 `persistence.xml` 的\
  \ XML 文件描述。将其添加到 `FamilyTreeManagerJPA` 模块的 `META-INF` 中。[列表 10.22](# 显示了一个示例的 `persistence.xml`\
  \ 文件。持久化单元有一个名称（`PersonFTMPU`）并指定了持久化提供者（`org.eclipse.persistence.jpa.PersistenceProvider`）。持久化单元还描述了如何连接到数据库（此处使用\
  \ `JDBC/Derby`）以及（重要的）表生成策略。在这里我们指定了 `drop-and-create-tables`，它每次都会创建数据库表（删除任何数据）。如果你希望在程序执行之间保留数据，请将生成策略更改为\
  \ `create-tables`（仅在需要时创建表）或 `none`（不执行表生成）。\n\n**表生成策略**：注意，如果你将生成策略从 `drop-and-create-tables`\
  \ 更改，你需要移除 `FamilyTreeModel` 的 `Installer` 类中测试数据的生成，该类每次都会创建辛普森家族测试数据。\n\n* *\n\
  \n\n\n\n\n你也可以将 EclipseLink 的默认日志级别更改为 `FINE`，以便查看持久化程序更详细的日志输出。（警告：`FINE` 会产生大量消息。）\n\
  \n### Listing 10.22 persistence.xml\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<persistence version=\"2.0\" xmlns=\"http://java.sun.com/xml/ns/persistence\"\
  \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n   xsi:schemaLocation=\n\
  \   \"http://java.sun.com/xml/ns/persistence\n   http://java.sun.com/xml/ns/persistence/persistence_2_0.xsd\"\
  >\n  <persistence-unit name=\"PersonFTMPU\" transaction-type=\"RESOURCE_LOCAL\"\
  >\n    <provider>org.eclipse.persistence.jpa.PersistenceProvider</provider>\n  \
  \  <class>com.asgteach.familytree.manager.jpa.PersonEntity</class>\n    <properties>\n\
  \      <property name=\"driverClass\" value=\"org.apache.derby.jdbc.ClientDriver\"\
  />\n      <!--      <property name=\"eclipselink.logging.level\" value=\"FINE\"\
  />-->\n      <property name=\"javax.persistence.jdbc.url\"\n              value=\"\
  jdbc:derby://localhost:1527/personftm\"/>\n      <property name=\"javax.persistence.jdbc.user\"\
  \ value=\"personftm\"/>\n      <property name=\"javax.persistence.jdbc.driver\"\n\
  \              value=\"org.apache.derby.jdbc.ClientDriver\"/>\n      <property name=\"\
  javax.persistence.jdbc.password\" value=\"personftm\"/>\n      <property name=\"\
  eclipselink.ddl-generation\"\n                               value=\"drop-and-create-tables\"\
  />\n    </properties>\n  </persistence-unit>\n</persistence>\n```\n\n### 数据库配置选项\n\
  你也可以选择使用现有的数据库。在这种情况下，NetBeans IDE 可以为你生成实体类和持久化单元（Persistence Unit）。要此操作，请创建一个\
  \ Java Class Library 项目。然后，从顶层菜单选择 `File` | `New File`。在对话框中指定类别为 `Persistence`，然后从\
  \ `Database` 中选择 `Entity Classes`。这将根据你提供的数据库连接创建所需的实体类和持久化单元。一旦拥有这些文件，你就可以它们复制到\
  \ NetBeans Platform 应用程序的模块中。\n\n### 创建新的 FamilyTreeManager 服务提供者\n现在是时候创建一个实现 `FamilyTreeManager`\
  \ 的新类了。将此类命名为 `FamilyTreeManagerJPA` 并使其成为 `FamilyTreeManager` 的服务提供者（使用 `@ServiceProvider`）。属性\
  \ `supersedes` 指定该实现优于原始的 `FamilyTreeManager` 服务提供者。（你也可以从应用程序中移除模块 `FamilyTreeManagerImpl`。）\n\
  \n静态初始化器初始化 `EntityManagerFactory` 并创建 `EntityManager`。如果 JavaDB 数据库未运行，创建 `EntityManager`\
  \ 将失败。与类 `FamilyTreeManagerImpl` 类似，该实现现在 `Person` 对象更新、添加和删除时提供属性更改支持。我们使用 `SwingPropertyChangeSupport`\
  \ 是为了让属性更改事件在 EDT（事件调度线程）上触发。\n\n私有方法 `buildPerson()` 创建一个带有数据库生成的 id 属性的 `Person`\
  \ 对象。（模块 `FamilyTreeModel` 中的 `Person` 类现在需要一个新的构造函数）。这替换了 hashmap 版本中 `Person`\
  \ 类使用的自动递增 id。使用 JPA，你通过 `EntityManager` 执行数据库操作，它提供了数据库管理功能。`Listing 10.23` 显示类\
  \ `FamilyTreeManagerJPA.java`。\n\n### Listing 10.23 FamilyTreeManagerJPA.java\n\n\
  ```java\n@ServiceProvider\n(service = com.asgteach.familytree.model.FamilyTreeManager.class,\n\
  \   supersedes = {\n       \"com.asgteach.familytree.manager.impl.FamilyTreeManagerImpl\"\
  })\npublic class FamilyTreeManagerJPA implements FamilyTreeManager {\n// SwingPropertyChangeSupport\
  \ 是线程安全的\n  // true 意味着在 EDT 上触发属性更改事件\n  private SwingPropertyChangeSupport propChangeSupport\
  \ = null;\n  private static final EntityManagerFactory EMF;\n\n  private static\
  \ final Logger logger = Logger.getLogger(\n              FamilyTreeManagerJPA.class.getName());\n\
  \  static {\n      try {\n          EMF = Persistence.createEntityManagerFactory(\"\
  PersonFTMPU\");\n          logger.log(Level.INFO, \"Entity Manager Factory Created.\"\
  );\n          // 创建/关闭实体管理器以确保 JavaDB Server 正在运行\n          // 如果 JavaDB Server\
  \ 未运行，则将失败\n          EntityManager em = EMF.createEntityManager();\n          em.close();\n\
  \      } catch (Throwable ex) {\n          logger.log(Level.SEVERE, \"Make sure\
  \ the JavaDB Server has been started.\", ex);\n          throw new ExceptionInitializerError(ex);\n\
  \      }\n  }\n  private PropertyChangeSupport getPropertyChangeSupport() {\n  \
  \    if (this.propChangeSupport == null) {\n          this.propChangeSupport = new\
  \ SwingPropertyChangeSupport(this, true);\n      }\n      return this.propChangeSupport;\n\
  \  }\n  @Override\n  public void addPropertyChangeListener(ChangeListener listener)\
  \ {\n      getPropertyChangeSupport().addChangeListener(listener);\n  }\n  @Override\n\
  \  public void removePropertyChangeListener(ChangeListener listener) {\n      getPropertyChangeSupport().removeChangeListener(listener);\n\
  \  }\n  private Person buildPerson(PersonEntity pe) {\n      Person person = new\
  \ Person(pe.getId());\n      person.setFirstname(pe.getFirstname());\n      person.setGender(pe.getGender());\n\
  \      person.setLastname(pe.getLastname());\n      person.setMiddlename(pe.getMiddlename());\n\
  \      person.setSuffix(pe.getSuffix());\n      person.setNotes(pe.getNotes());\n\
  \      return person;\n  }\n  @Override\n  public void addPerson(final Person newPerson)\
  \ {\n      EntityManager em = EMF.createEntityManager();\n      try {\n        \
  \  em.getTransaction().begin();\n          PersonEntity person = new PersonEntity();\n\
  \          person.setFirstname(newPerson.getFirstname());\n          person.setLastname(newPerson.getLastname());\n\
  \          person.setGender(newPerson.getGender());\n          person.setMiddlename(newPerson.getMiddlename());\n\
  \          person.setSuffix(newPerson.getSuffix());\n          person.setNotes(newPerson.getNotes());\n\
  \          em.persist(person);\n          em.getTransaction().commit();\n      \
  \    logger.log(Level.INFO, \"New Person: {0} successfully added.\", newPerson);\n\
  \          getPropertyChangeSupport().firePropertyChange(\n              FamilyTreeManager.PROP_PERSON_ADDED,\
  \ null, buildPerson(person));\n      } catch (Exception ex) {\n          logger.log(Level.SEVERE,\
  \ null, ex);\n      } finally {\n          em.close();\n      }\n  }\n  @Override\n\
  \  public void updatePerson(final Person p) {\n      EntityManager em = EMF.createEntityManager();\n\
  \      try {\n          em.getTransaction().begin();\n          PersonEntity target\
  \ = em.find(PersonEntity.class, p.getId());\n          if (target != null) {\n \
  \             target.setFirstname(p.getFirstname());\n              target.setGender(p.getGender());\n\
  \              target.setLastname(p.getLastname());\n              target.setMiddlename(p.getMiddlename());\n\
  \              target.setSuffix(p.getSuffix());\n              target.setNotes(p.getNotes());\n\
  \              em.merge(target);\n              em.getTransaction().commit();\n\
  \              logger.log(Level.FINE, \"Person {0} successfully updated.\", p);\n\
  \              getPropertyChangeSupport().firePropertyChange(\n                \
  \  FamilyTreeManager.PROP_PERSON_UPDATED, null, buildPerson(target));\n        \
  \  } else {\n              logger.log(Level.WARNING, \"No entity for Person {0}.\"\
  , p);\n          }\n      } catch (Exception ex) {\n          logger.log(Level.SEVERE,\
  \ null, ex);\n      } finally {\n          em.close();\n      }\n  }\n  @Override\n\
  \  public void removePerson(final Person p) {\n      EntityManager em = EMF.createEntityManager();\n\
  \      try {\n          em.getTransaction().begin();\n          PersonEntity target\
  \ = em.find(PersonEntity.class, p.getId());\n          if (target != null) {\n \
  \             em.remove(target);\n              em.getTransaction().commit();\n\
  \              logger.log(Level.INFO, \"Person {0} successfully removed.\", p);\n\
  \              getPropertyChangeSupport().firePropertyChange(\n                \
  \  FamilyTreeManager.PROP_PERSON_REMOVED, null, buildPerson(target));\n        \
  \  } else {\n              logger.log(Level.WARNING, \"No entity for Person {0}.\"\
  , p);\n          }\n      } catch (Exception ex) {\n          logger.log(Level.SEVERE,\
  \ null, ex);\n      } finally {\n          em.close();\n      }\n  }\n}\n```\n\n\
  \n\n\n\n```java\npublic void deletePerson(Person p) {\n    EntityManager em = EMF.createEntityManager();\n\
  \    try {\n        em.getTransaction().begin();\n        PersonEntity target =\
  \ em.find(PersonEntity.class, p.getId());\n        if (target != null) {\n     \
  \       em.remove(target);\n            em.getTransaction().commit();\n        \
  \    logger.log(Level.FINE, \"Person {0} successfully removed.\", p);\n        \
  \    getPropertyChangeSupport().firePropertyChange(\n                FamilyTreeManager.PROP_PERSON_DESTROYED,\
  \ null, p);\n        } else {\n            logger.log(Level.WARNING, \"No entity\
  \ for Person {0}.\", p);\n        }\n    } catch (Exception ex) {\n        logger.log(Level.SEVERE,\
  \ null, ex);\n    } finally {\n        em.close();\n    }\n}\n\n@SuppressWarnings(\"\
  unchecked\")\n@Override\npublic List<Person> getAllPeople() {\n    EntityManager\
  \ em = EMF.createEntityManager();\n    try {\n        List<Person> people = Collections.synchronizedList(\n\
  \            new ArrayList<>());\n        em.getTransaction().begin();\n       \
  \ Query q = em.createQuery(\n            \"select p from PersonEntity p order by\
  \ p.lastname asc, p.firstname asc\");\n        List<PersonEntity> results = (List<PersonEntity>)\
  \ q.getResultList();\n        if (results != null && results.size() > 0) {\n   \
  \         results.stream().forEach((pe) -> {\n                people.add(buildPerson(pe));\n\
  \            });\n        }\n        em.getTransaction().commit();\n        return\
  \ Collections.unmodifiableList(people);\n    } catch (Exception ex) {\n        logger.log(Level.SEVERE,\
  \ null, ex);\n        return null;\n    } finally {\n        em.close();\n    }\n\
  }\n```\n\n### 更新 Person 类\n更新 `Person` 将显示修改后的 `Person` 类。新的构造函数使用了数据库生成的 `id`。\n\
