  # 配置 JavaFX 控制器\n\n在应用程序的 NetBeans 版本中，`Controller` 类具有以下职责：\n- 从 `Global Lookup`\
  \ 获取 `FamilyTreeManager` 实例以便在 `TreeView` 控件中显示 `Person` 对象。\n- 实现监听器以响应 `FamilyTreeManager`\
  \ 的变化。\n- 实现 `TreeSelectionListener` 并发布当前 `Selection`。\n\nListing 6.11 显示控制器的类变量和\
  \ `initialize()` 方法，我们在这些方法中使用 `FamilyTreeManager` 填充 `TreeView` 控件。我们实例化 `InstanceContent`\
  \ 对象，它将包含 `Person`。`TopComponent` 在其 `Lookup` 中发布 `InstanceContent` 的内容，如“Lookup\
  \ as Object”第 225 页所示。我们使用类变量 `selectedPerson` 跟踪选中的 `Person`。`Global Lookup` 返回一个\
  \ `FamilyTreeManager` 实例，我们将其赋值给类变量 `ftm`。\n\nListing 6.11 `PersonFXViewerController.java`—类变量和\
  \ `initialize()`\n```java\npublic class PersonFXViewerController implements Initializable\
