  \ NetBeans IDE 的 `Output` 窗口中，应该出现如第 816 页代码列表 16.3 所示的测试输出。现在你已经有一个可以工作的 NetBeans\
  \ Platform 客户端模块，可以添加集成 JavaFX 内容的 JavaFX 服务和窗口。\n\n### 概述\n[图 16.19] 显示了 `SmartPhoneDataApp`\
  \ 中的模块。`PhoneDataWebService` 模块包含实体类和 RESTful Web 客户端。该模块还包含一个名为 `PhoneDataShare`\
  \ 的 Java 接口，定义了其他模块如何访问手机数据。在下一节中，你将向此模块添加 JavaFX 服务。这些类在后台线程中访问 RESTful 服务。\n\n\
  `TableView` 模块实现了 JavaFX `TableView` 窗口（见第 801 页的图 6.1），`LineChart` 模块实现了 JavaFX\
  \ `LineChart` 窗口。最后，`@ServiceProvider` 模块实现了 `PhoneDataShare` 接口。\n\n### 使用 JavaFX\
  \ 服务\n第 4 章描述了 JavaFX `Worker` 接口，它允许你创建后台任务和服务（见第 176 页的“JavaFX 后台任务”）。在这里，我们将使用\
  \ `Service` 类来创建 `Worker` 接口的可重用实现，用于后台执行。记住 `Service`（类似于 `Task`）能够感知 JavaFX 应用程序线程。因此，所有\
  \ `Service` 方法和状态必须从 JavaFX 应用程序线程调用。但是，你最初可以从任何线程配置并启动服务。`Service` 包含了与 `Task`\
  \ 相同的 `Worker.State` 值（见第 176 页的表 4.1）以及 Worker JavaFX 属性和 Task 更新方法（见第 177 页的表\
  \ 4.2 和第 178 页的表 4.3）。\n\n让我们先展示如何定义 `Service`。然后我们将向你使用它的代码。代码列表 16.5 显示了 `GetPhoneSalesService`\
  \ 类，它扩展了 `Service`。在这里，`Service` 的泛型为 `ObservableList<Salesdata>`，这也是 `Service`\
  \ 成功完成时的返回类型。当你扩展 `Service` 时，必须重写 `protected createTask()` 方法。该方法构建一个 `Task` 对象并重写\
  \ `call()` 方法。在这里，`call()` 调用了 `SalesdataClient` RESTful 客户端中的 `findAll_XML()` 方法。\n\
  \n#### 代码列表 16.5 GetPhoneSalesService.java\n```java\npublic class GetPhoneSalesService\
  \ extends Service<ObservableList<Salesdata>> {\n    private static Logger logger\
  \ = Logger.getLogger(GetPhoneSalesService.class.getName());\n    private ObservableList<Salesdata>\
  \ salesdata = FXCollections.observableArrayList();\n\n    @Override\n    protected\
  \ Task<ObservableList<Salesdata>> createTask() {\n        return new Task<ObservableList<Salesdata>>()\
  \ {\n            private final SalesdataClient client1 = new SalesdataClient();\n\
  \n            @Override\n            protected ObservableList<Salesdata> call()\
  \ throws Exception {\n                logger.log(Level.INFO, \"GetPhoneSalesTask\
  \ called.\");\n                Response response = client1.findAll_XML(Response.class);\n\
  \                GenericType<List<Salesdata>> genericType = new GenericType<List<Salesdata>>()\
  \ {};\n                int status = response.getStatus();\n                if (status\
  \ != Response.Status.OK.getStatusCode()) {\n                    logger.log(Level.WARNING,\
  \ \"Bad status {0}\", response.getStatusInfo().getReasonPhrase());\n           \
  \         throw new Exception(\"Bad status: \" + status + \" for web service call\"\
  );\n                }\n                // 从 Web 服务返回 SalesData 的 ArrayList\n   \
  \             List<Salesdata> data = (response.readEntity(genericType));\n     \
  \           salesdata = FXCollections.observableArrayList(data);\n             \
  \   return salesdata;\n            }\n        };\n    }\n}\n```\n\n\n\n\n# UseService\
  \ 示例\n\n列表 16.6 显示了如何使用此服务。`UseService` 类实例化了 `GetSmartPhoneSalesService` 服务（`salesService`），并定义了一个带有可选\
  \ `ProgressIndicator` 控制的公共方法 `refreshData()`。`refreshData()` 方法随后调用私有方法 `getDataInBackground()`。在该方法内部，启动了\
  \ `salesService` 服务。请注意，每次服务完成后，都必须重置服务，以便重用该服务。\n\n`UseService` 还定义了两个事件处理器：`setOnSucceeded()`\
  \ 和 `setOnFailed()`。`setOnSucceeded()` 事件处理器通过 `t.getSource().getValue()` 访问底层 `Task`\
  \ 的返回对象，其中 `t` 是 `WorkerStateEvent`。注意，事件处理器运行在 JavaFX 线程中。因此，我们可以安全地更新视觉控件（例如 `ProgressIndicator`）并安全地操作\
  \ JavaFX 属性。在这里，`setOnSucceeded()` 事件处理器设置了 `underlyingData` `ListProperty`。JavaFX\
  \ `TableView` 控件可以安全地绑定到此属性。\n\n## 列表 16.6 UseService 示例\n\n```java\npublic class\
  \ UseService {\n\n    private final ListProperty<Salesdata> underlyingData = new\n\
  \            SimpleListProperty<Salesdata>(FXCollections.observableArrayList());\n\
  \n    private final GetSmartPhoneSalesService salesService = new\n            GetSmartPhoneSalesService();\n\
  \n    public void refreshData(ProgressIndicator progressIndicator) {\n        getDataInBackground(progressIndicator);\n\
  \    }\n\n    @SuppressWarnings(\"unchecked\")\n    private void getDataInBackground(ProgressIndicator\
  \ progressIndicator) {\n        // 此服务可以被多次调用\n        salesService.setOnSucceeded((WorkerStateEvent\
  \ t) -> {\n                    logger.log(Level.INFO, \"sales data Done.\");\n \
  \                   if (progressIndicator != null) {\n                        progressIndicator.setVisible(false);\n\
  \                    }\n                    underlyingData.set((ObservableList<Salesdata>)\n\
  \                                t.getSource().getValue());\n                });\n\
  \        salesService.setOnFailed((WorkerStateEvent t) -> {\n                  \
  \  if (progressIndicator != null) {\n                        progressIndicator.setVisible(false);\n\
  \                    }\n                    logger.log(Level.WARNING, \"Failed:\
  \ Read Salesdata\");\n        });\n        // 只有在准备就绪时才启动服务\n        if (salesService.getState()\
  \ == Worker.State.SUCCEEDED) {\n            salesService.reset();\n        }\n \
  \       if (salesService.getState() == Worker.State.READY) {\n            if (progressIndicator\
  \ != null) {\n                progressIndicator.setVisible(true);\n            }\n\
  \            salesService.start();\n        }\n    }\n}\n```\n\n## 向模块添加 JavaFX\
  \ 服务类\n\n以下是将 JavaFX 服务类添加到 `PhoneWebService` 模块的步骤：\n\n1.  在 `PhoneWebService`\
  \ 中创建一个名为 `com.each.services` 的新 Java 包，并添加以下服务类：\n    - `GetSmartPhoneSalesService.java`：一个通过\
  \ RESTful Web 客户端访问智能手机销售数据的服务。\n    - `GetCompanyDataService.java`：一个通过 RESTful\
  \ Web 服务访问手机公司的服务。\n    - `UpdateItemService.java`：一个通过 RESTful Web 服务更新单个 `Salesdata`\
  \ 项目的服务。\n2.  将 `com.each.services` 包设为公共（public）。列表 16.5 显示了 `GetSmartPhoneSalesService`\
  \ 的代码。使用类似的方法，列表 16.7 显示了 `GetCompanyDataService.java`。在这里，`Task` 的 `call()` 方法调用了\
  \ RESTful Java 客户端 `CompanyClient` 的 `findAll_XML()` 方法。\n\n```java\npublic class\
  \ GetCompanyDataService extends Service<ObservableList<Company>> {\n    private\
  \ static Logger logger =\n            Logger.getLogger(GetCompanyDataService.class.getName());\n\
  \    @Override\n    protected Task<ObservableList<Company>> createTask() {\n   \
  \     return new Task<ObservableList<Company>>() {\n            private final CompanyClient\
  \ client1 =\n                    new CompanyClient();\n            @Override\n \
  \           protected ObservableList<Company> call() throws Exception {\n      \
  \          Response response = client1.findAll_XML(Response.class);\n          \
  \      GenericType<List<Company>> genericType =\n                    new GenericType<List<Company>>()\
  \ {};\n                int status = response.getStatus();\n                if (status\
  \ != Response.Status.OK.getStatusCode()) {\n                    logger.log(Level.WARNING,\
  \ \"Bad status {0}\",\n                            response.getStatusInfo().getReasonPhrase());\n\
  \                    throw new Exception(\"Bad status: \" + status\n           \
  \                 + \" for web service call\");\n                }\n           \
  \     // Returns an ArrayList from the web service\n                List<Company>\
  \ data = response.Entity(genericType);\n                ObservableList<Company>\
  \ companyList =\n                    FXCollections.observableArrayList(data);\n\
  \                return companyList;\n            }\n        };\n    }\n}\n```\n\
  \n## 列表 16.8 UpdateItemService\n\n列表 16.8 显示了 `UpdateItemService` 的代码，它使用存储在 `salesdata`\
  \ 类中的数据调用 `Salesdata` Web 服务（更新）。`createTask()` 方法在 JavaFX 线程访问 `salesdata` 变量。`call()`\
  \ 方法调用 `SalesdataClient` 的 `edit_XML()` 方法。为了重用此服务，调用者在调用 `UpdateItemService.start()`\
  \ 方法之前，会调用 `setSalesdata()` 并传入新数据。\n\n```java\npublic class UpdateItemService extends\
  \ Service<Salesdata> {\n    Salesdata salesdata;\n    public Salesdata getSalesdata()\
  \ {\n        return salesdata;\n    }\n    public void setSalesdata(Salesdata salesdata)\
  \ {\n        this.salesdata = salesdata;\n    }\n    @Override\n    protected Task<Salesdata>\
  \ createTask() {\n        final Salesdata _salesdata = getSalesdata();\n       \
  \ return new Task<Salesdata>() {\n            private final SalesdataClient client1\
  \ =\n                    new SalesdataClient();\n            @Override\n       \
  \     protected Salesdata call() throws Exception {\n                client1.edit_XML(_salesdata,\n\
  \                        _salesdata.getSalesid().toString());\n                return\
  \ _salesdata;\n            }\n        };\n    }\n}\n```\n\n\n\n\n\n# 实现 RESTful\
  \ 客户端服务提供\n\n`SmartPhoneDataApp` 中的窗口使用 `TableView` 控件和 JavaFX `Line Chart` 显示数据。这些模块使用\
  \ `Service Provider` 来访问数据。在本节中，你将执行配置此 Service Provider 的步骤。\n\n* 在 `PhoneDataWebService`\
  \ 模块中创建包 `com.asgteach.phonedata.share` 并将包设为公共（public）。\n* 在包 `com.asgteach.phonedata.share`\
  \ 中创建 `PhoneDataShare` 接口。\n* 创建 `PhoneDataShareImpl` 模块。添加对 `PhoneDataWebService`\
  \ 模块和 `Lookup API` 的依赖。\n* 创建类 `PhoneDataShareImpl` 并实现 `PhoneDataShare`。\n\n列表\
  \ 16.9 显示了 `PhoneDataShare` 接口，你将其添加到 `PhoneDataWebService` 模块中。\n\n`refreshData()`\
  \ 和 `updateSales()` 方法包含一个 `ProgressIndicator` 控件。这在后台任务正在执行时让用户了解状态非常有用。注意，调用者在不使用\
  \ `ProgressIndicator` 时可以提供 `null` 值。因此，实现代码必须检查 `null` 值的 `ProgressIndicator`。\n\
  \n#### 列表 16.9 PhoneDataShare 接口\n```java\npublic interface PhoneDataShare {\n\n\
  \    // Salesdata\n    public abstract ListProperty<Salesdata> theDataProperty();\n\
  \n    // Company\n    public abstract ListProperty<Company> companyNamesProperty();\n\
  \n    // year as a String\n    public abstract ListProperty<String> categoryListProperty();\n\
  \    public abstract String getDataDescription();\n    public abstract String getNameDescription();\n\
  \    public abstract String getTitle();\n    public abstract double getTickUnit();\n\
  \    public abstract void refreshData(ProgressIndicator progressIndicator);\n  \
  \  public abstract void updateSales(Salesdata salesdata,\n              ProgressIndicator\
  \ progressIndicator);\n}\n```\n\n列表 16.10 显示了 `PhoneDataShareImpl` 类，你将其添加到 `PhoneDataShareImpl`\
  \ 模块中。该类创建了几个 JavaFX `ListProperty` 对象来管理 `Salesdata`、`Company`  way 和 `Category`\
  \ 名称的 `ObservableLists`。该类还实例化了我们在上一节中描述的 JavaFX `Service` 类：`GetSmartPhoneSalesService`、`GetCompanyDataService`\
  \ 和 `UpdateSalesItemService`。这些服务操作 `ListProperty` 对象。\n\n#### 列表 16.10 PhoneDataShareImpl—实现\
  \ PhoneDataShare\n```java\n@ServiceProvider(service = PhoneDataShare.class)\npublic\
  \ class PhoneDataShareImpl implements PhoneDataShare {\n    private final ListProperty<Salesdata>\
  \ underlyingData = new\n            SimpleListProperty<>(FXCollections.observableArrayList());\n\
  \n    private final ListProperty<Company> companyDataNames = new\n            SimpleListProperty<>(FXCollections.observableArrayList());\n\
  \n    private final ListProperty<String> categoryDataNames = new\n            SimpleListProperty<>(FXCollections.observableArrayList());\n\
  \n    private static final String dataDescription = \"Units Sold in Millions\";\n\
  \    private final String nameDescription = \"Year\";\n    private final String\
  \ title = \"Smart Phone Sales\";\n    private final GetSmartPhoneSalesService salesService\
  \ =\n            new GetSmartPhoneSalesService();\n\n    private final GetCompanyDataService\
  \ companyService =\n            new GetCompanyDataService();\n\n    private final\
  \ UpdateSalesItemService update = new UpdateSalesItemService();\n    private static\
  \ final Logger logger =\n            Logger.getLogger(PhoneDataShareImpl.class.getName());\n\
  \n    public PhoneDataShareImpl() {\n        getDataInBackground(null);\n      \
  \  getCompanyDataInBackground();\n    }\n\n    @Override\n    public ListProperty<Company>\
  \ companyNamesProperty() {\n        return companyDataNames;\n    }\n\n    @Override\n\
  \    public ListProperty<String> categoryListProperty() {\n        return categoryDataNames;\n\
  \    }\n\n    @Override\n    public String getDataDescription() {\n        return\
  \ dataDescription;\n    }\n\n    @Override\n    public String getNameDescription()\
  \ {\n        return nameDescription;\n    }\n\n    @Override\n    public String\
  \ getTitle() {\n        return title;\n    }\n\n    @Override\n    public double\
  \ getTickUnit() {\n        return 100;\n    }\n\n    @Override\n    public void\
  \ refreshData(ProgressIndicator progressIndicator) {\n        getDataInBackground(progressIndicator);\n\
  \    }\n\n    @Override\n    public void updateSales(Salesdata salesdata,\n    \
  \        ProgressIndicator progressIndicator) {\n        updateSalesDataInBackground(salesdata,\
  \ progressIndicator);\n    }\n\n    @Override\n    public ListProperty<Salesdata>\
  \ theDataProperty() {\n        return underlyingData;\n    }\n\n    @SuppressWarnings(\"\
  unchecked\")\n    private void getCompanyDataInBackground() {\n        // 此服务只被调用一次\n\
  \        companyService.setOnSucceeded((WorkerStateEvent t) -> {\n            companyDataNames.set((ObservableList<Company>)\
  \ t.getSource().getValue());\n        });\n        companyService.setOnFailed((WorkerStateEvent\
  \ t) -> {\n            logger.log(Level.WARNING, \"Failed: Read Company data.\"\
  );\n        });\n        companyService.start();\n    }\n\n    private void updateSalesDataInBackground(final\
  \ Salesdata newSalesdata,\n            ProgressIndicator progress) {\n        //\
  \ 此服务可以被多次调用\n        update.setOnSucceeded((WorkerStateEvent t) -> {\n        \
  \    if (progress != null) {\n                progress.setVisible(false);\n    \
  \        }\n            // 这会导致两个独立的更改事件：先删除，后添加\n            underlyingData.remove(newSalesdata);\n\
  \            underlyingData.add(newSalesdata);\n        });\n        update.setOnFailed((WorkerStateEvent\
  \ t) -> {\n            logger.log(Level.WARNING, \"Failed: Sales UPDATED for {0}\"\
  ,\n                newSalesdata.getId().getName());\n            if (progress !=\
  \ null) {\n                progress.setVisible(false);\n            }\n        });\n\
  \        // 仅当服务就绪时才启动\n        if (update.getState() == Worker.State.SUCCEEDED)\
  \ {\n            update.reset();\n        }\n        if (update.getState() == Worker.State.READY)\
  \ {\n            if (progress != null) {\n                progress.setVisible(true);\n\
  \            }\n            update.setSalesdata(newSalesdata);\n            update.start();\n\
  \        }\n    }\n\n    @SuppressWarnings(\"unchecked\")\n    private void getDataInBackground(ProgressIndicator\
  \ progressIndicator) {\n        // 此服务可以被多次调用\n        salesService.setOnSucceeded((WorkerStateEvent\
  \ t) -> {\n            if (progressIndicator != null) {\n                progressIndicator.setVisible(false);\n\
  \            }\n            underlyingData.set((ObservableList<Salesdata>) t.getSource().getValue());\n\
  \            for (Salesdata sales : underlyingData.get()) {\n                if\
  \ (!categoryDataNames.contains(sales.getSalesyear())) {\n                    categoryDataNames.add(sales.getSalesyear());\n\
  \                }\n            }\n        });\n        salesService.setOnFailed((WorkerStateEvent\
  \ t) -> {\n            if (progressIndicator != null) {\n                progressIndicator.setVisible(false);\n\
  \            }\n            logger.log(Level.WARNING, \"Failed: Read Salesdata\"\
  );\n        });\n        // 仅当服务就绪时才启动\n        if (salesService.getState() == Worker.State.SUCCEEDED)\
  \ {\n            salesService.reset();\n        }\n        if (salesService.getState()\
  \ == Worker.State.READY) {\n            if (progressIndicator != null) {\n     \
  \           progressIndicator.setVisible(true);\n            }\n            salesService.start();\n\
  \        }\n    }\n}\n```\n\n\n\n\n`Services` 与 JavaFX `ListProperty` 对象之间存在着一种微妙的关系。当客户端查找\
  \ `PhoneDataShare` 时，`PhoneDataShareImpl` 构造函数代码（由于该类是单例，会被调用一次）会调用 `getDataInBackground()`\
  \ 方法。由于该方法在后台线程调用网络服务，数据可能尚未安装到 `getDataProperty()` 方法返回的 `ListProperty` 对象中。然而，由于我们使用了\
  \ JavaFX 属性，当 `ListProperty` 发生时，客户端将通过绑定表达式或监听器收到通知。在接下来的章节中，我们将为您展示如何使用 JavaFX\
  \ UI 代码来实现。\n\n## JavaFX TableView\n\n`SmartPhoneDataApp` 包含一个由 `CoreTableView`\
  \ 模块实现的 `TableView` 窗口（应用程序模块图请参见第 822 页图 16.19）。以下是构建该模块将遵循的步骤总结：\n\n- 创建代码名为 `com.asgteach.coretableview`\
  \ 的模块 `CoreTableView`。\n- 在资源管理器位置向该模块添加一个新窗口（`TopComponent`），命名为 `TableView`。这将创建文件\
  \ `TableViewTopComponent.java`。\n- 设置对 `PhoneDataWebService` 模块和 `Lookup API` 的依赖。\n\
  - 该模块包含集成 JavaFX 内容，您可以使用 `FXML` 和 JavaFX 对其进行结构化。添加文件 `TableView.fxml` 的 FXML 标记及其文件\
  \ `TableViewController.java` 的控制器类。\n\n让我们先探索 JavaFX `TableView` 控件，然后详细检查 `TableView.fxml`\
  \ 和 `TableViewController.java` 文件。\n\n### JavaFX TableView 控件\n\n图 16.20 显示了 `TableView`\
  \ 窗口，它包含一个 JavaFX `TableView` 控件、一个标题、一个用于过滤数据的 `TextField` 控件以及一个用于刷新数据的 `Button`\
  \ 控件。\n\nJavaFX `TableView` 控件是表格数据的通用可视化工具。至少，您需要用 `ObservableList` 实例化该控件。`ObservableList`\
  \ 的泛型类型与 `TableView` 的泛型类型匹配。例如，以下代码实例化了一个 `Salesdata` 对象的 `TableView`，并调用 `setItems()`\
  \ 方法设置其数据。注意，当 `ObservableList` 中的数据发生变化时，`TableView` 会自动更新。\n\n```java\nTableView<Salesdata>\
  \ tableview = new TableView<>();\nObservableList<Salesdat> theList = getTheListSomeHow();\n\
  tableview.setItems(theList);\n```\n\n要在 `TableView` 控件中定义列，请使用 `TableColumn` 类。如果数据匹配\
  \ `TableView` 泛型类型中的 JavaFX 属性，则 `TableColumn` 配置将非常直观。例如，在这里我们为年份数据定义了一个 `String`\
  \ 类型的 TableColumn，并将标题设置为“Year”。我们使用 `setCellValueFactory()` 方法指定值来自 `salesyear`\
  \ 属性。\n\n```java\nTableColumn<Salesdata, String> colYear = new TableColumn<>(\"\
  Year\");\ncolYear.setCellValueFactory(\n    new PropertyValueFactory<Salesdata,\
  \ String>(\"salesyear\"));\n```\n\n`Company` 列要复杂一些，因为公司名称不是直接属性。相反，我们在 JavaFX `Callback`\
  \ 结构中通过 `getCompanynameProperty()` 方法从 `companyid` 属性获取公司名称，如下：\n\n```java\nTableColumn<Salesdata,\
  \ String> colCompany = new TableColumn<>(\"Company\");\ncolCompany.setCellValueFactory(new\
  \ Callback<CellDataFeatures<Salesdata, String>, ObservableValue<String>>() {\n \
  \   @Override\n    public ObservableValue<String> call(CellDataFeatures<Salesdata,\
  \ String> p) {\n        // p.getValue() 返回该行的 Salesdata 实例\n        return p.getValue().getCompanyid().companynameProperty();\n\
  \    }\n});\n```\n\n由于 `Callback` 是一个函数接口，我们可以使用 Lambda 表达式，如下（返回语句是隐含的）：\n\n```java\n\
  colCompany.setCellValueFactory((TableColumn.CellDataFeatures<Salesdata, String>\
  \ p) ->\n    p.getValue().getCompanyid().companynameProperty());\n```\n\n同样地，我们在\
  \ JavaFX `Callback` 中通过 `unitsmillions` 属性定义 `BigDecimal` 类型的 `colUnitsSold`，如下：\n\
  \n```java\nTableColumn<Salesdata, BigDecimal> colUnitsSold = new TableColumn<>(\"\
  Units Sold\");\ncolUnitsSold.setCellValueFactory((TableColumn.CellDataFeatures<Salesdata,\
  \ BigDecimal> p) ->\n    p.getValue().getCompanyid().unitsmillionsProperty());\n\
  \ntableview.getColumns().setAll(colCompany, colYear, colUnitsSold);\n```\n\n\n\n\
