  \ 切换到新角色\n                            wm.setRole(thisUser.getRole());\n        \
  \                    // ...\n                        }\n                    }\n\
  \                }\n            });\n    }\n}\n```\n\n\n\n\n\n```java\n        \
  \    Bundle.LoginError());\n\n      }\n    }\n    }\n  });\n    // Allow Cancel\
  \ to close the dialog, but OK should not\n    dd.setClosingOptions(new Object[]{DialogDescriptor.CANCEL_OPTION});\n\
  \    dd.createNotificationLineSupport();\n    DialogDisplayer.getDefault().notify(dd);\
  \      // display and block\n  }\n}\n```\n\n### ChangeRole 类\n\n`ChangeRole` 类通过\
  \ Java 注解 `@ActionID`、`@ActionRegistration` 和 `@ActionReferences` 注册了一个始终开启的操作。`ChangeRole`\
  \ 类实现了 `ActionListener` 并重写了 `actionPerformed()` 方法，该方法在用户选择更改角色（Change Role）菜单项时被调用。\n\
  \n注意，这里有两个 `actionPerformed()` 方法。外层的 `actionPerformed()` 方法实例化了 `LoginPanel` 和带有\
  \ `DialogDescriptor` 的对话框。内部的 `actionPerformed()` 属于 `DialogDescriptor` 构造函数中的 `ActionListener`。当\
  \ `DialogDescriptor` 方法 `notify()` 返回时，对话框已经关闭。`ActionListener` 允许你在不关闭对话框的情况下处理用户输入。更改角色对话框必须保持开启状态，直到我们验证\
  \ `UserRole` 凭据。如果凭据无效，对话框将保持开启，用户可以重试。\n\nListing 11.15 中的代码与第 545 页上 `RoleLogin`\
  \ 类中的应用程序登录代码 Listing 11.14 有微妙不同。在 Listing 11.15 中，我们允许用户取消或关闭对话框，但明确禁止 OK 关闭对话框。然而，在\
  \ `RoleLogin` 对话框中，我们检测到关闭和取消操作并退出应用程序。\n\n### 11.7 关键点总结\n\nDialogs API 提供了帮助你创建、显示和从对话框获取输入的类。你需要指定对\
  \ Dialogs API 的依赖以便在应用程序中使用对话框。可以使用标准对话框和通知，也可以对其进行自定义。以下是 Dialogs API 的主要特性：\n\n\
  * `NotifyDescriptor` 提供了若干标准对话框。`NotifyDescriptor.Message` 提供一个带有文本和 OK 按钮的消息对话框。\n\
  *  `NotifyDescriptor.WARNING_MESSAGE` 提供一个带有文本、OK 按钮和警告图标的警告对话框。\n* `NotifyDescriptor.ERROR_MESSAGE`\
  \ 提供一个带有文本、OK 按钮和错误图标的错误对话框。\n* `NotifyDescriptor.Confirmation` 提供一个带有文本和 Cancel（取消）、No（否）、Yes（是）按钮的提问对话框。\n\
  * `NotifyDescriptor.InputLine` 提供一个提示用户输入并带有 Cancel 和 OK 按钮的对话框。你可以在构造函数中包含提示信息和对话框标题。使用\
  \ `getInputText()` 方法读取用户输入。\n* 你可以为任何类型的对话框配置选项按钮。\n* 使用 `DialogDisplayer.get_Default()`\
  \ 获取 NetBeans 平台默认的 `DialogDisplayer`。\n* `DialogDisplayer` 方法 `notify()` 显示模态对话框（消息框）并阻塞直到对话框关闭。\n\
  * 使用 `DialogDescriptor` 自定义对话框，它是一个扩展自 `NotifyDescriptor` 的类。`DialogDescriptor`\
  \ 在处理按钮点击和阻止关闭方面提供了灵活性。你还可以自定义按钮的对齐方式和按钮文本。\n* 通过提供自己的内部面板来自定义对话框的组件。\n* `DialogDisplayer`\
  \ 方法 `notifyLater()` 显示模态对话框，并可以从任何线程调用。这非常有用，例如使用 `Runnable` 类和 `@Onstart` 注解实现登录对话框。通过\
  \ `notifyLater()` 方法，你可以在 `DialogDescriptor` 构造函数中配置 `ActionListener` 来监听并处理用户按钮事件。\n\
  * 要实现登录对话框，请在带有 `@OnStart` 的 `Runnable` 类中重写 `run()` 方法。通过实现 `PropertyChangeListener`\
  \ 和 `ActionListener` 的对话框，你可以阻塞应用程序直到用户提供必要的登录凭据。\n\n### 12 向导 (Wizards)\n\n桌面应用程序中的一个常见场景是收集用户输入以构建对象——例如，新客户、文件、家族树事件或数字序列。当构建过程包含多个步骤和多个选项时，你需要一个精心设计的流程来引导用户完成这些步骤。这种提供系列输入面板的流程被称为向导（wizard）。\n\
  \nNetBeans 平台向导是一个多类框架，允许你构建此类过程。该向导框架允许开发者指定用户输入的图形化组件、验证输入、存储每个面板的状态，并动态操纵向导的步骤顺序。当向导完成时，你的应用程序就可以访问经过验证的用户提供的输入，从而构建目标产物（如文件）。\n\
  \n**你将学习到**\n* 创建和配置向导。\n* 注册向导操作。\n* 存储和检索向导属性。\n* 验证向导输入。\n* 使用简单验证 API（Simple\
  \ Validation API）。\n* 执行异步验证。\n* 使用动态序列向导。\n* 将进度条集成到向导。\n\n## 12.1 向导概述\n\n图 12.1\
  \ 显示具有三个步骤的 NetBeans 平台向导的通用架构。`WizardDescriptor` 类是主控制器，控制向导面板，而面板反过来控制每个步骤。此处未显示向导操作类，它启动向导并创建\
  \ `WizardDescriptor`。\n\n#### 我们的数字向导\n\n图 12.1 中的三步骤向导被称为 `Number`。该向导引导用户通过步骤创建数字序列。每个向导面板控制特定的步骤并创建自己的视觉面板。面板类扩展自\
  \ `JPanel` 并持有输入所需的界面组件。\n\n为了与 `WizardDescriptor` 工作，向导面板类需要重写 `WizardDescriptor`\
  \ 用的 `WizardDescriptor.Panel` 方法。表 12.1 列出了这些方法。\n\n##### 表 12.1 WizardDescriptor.Panel\
  \ 方法\n\n`WizardDescriptor` 有三个主要职责：\n1. `WizardDescriptor` 遍历向导面板集合，当用户点击“下一步”（Next）或“完成”（Finish）时进入下一个面板。\n\
  2. `WizardDescriptor` 存储向导面板所需的属性。它分别在每个步骤的开始和结束调用向导面板方法 `readSettings()` 和 `storeSettings()`。\n\
  3. `WizardDescriptor` 响应来自向导面板类的更改事件。通常，这些事件信号 `isValid()` 和 `isFinishPanel()` 方法的变化，但\
  \ `WizardDescriptor` 也会响应步骤顺序的变化。根据这些方法的返回值，`WizardDescriptor` 会启用或禁用当前视觉面板上的“下一步”和/或“完成”按钮。\n\
  \n**向导提示**：如果向导面板始终有效，`isValid()` 将返回 true，此时无需从向导面板触发更改事件。然而，如果向导面板的有效性取决于用户输入，则向导面板必须实现\
  \ `addChangeListener()` 和 `removeChangeListener()`，并向其 `ChangeListeners` 触发状态更改事件。这将\
  \ `WizardDescriptor` 调用 `isValid()` 并随后启用或禁用“下一步”。第 565 页的“[向导验证”将向你展示如何操作。\n\n\n\
  \n\n\n`WizardTipMethod isFinishPanel()` 定义在类 `WizardDescriptor.FinishablePanel`\
  \ 中，用于动态启用“完成（Finish）”按钮的面板。请参见第 587 页上的“提前结束选项”以获取该选项的示例。\n\n你可以从图 12.1 中看到，每个向导面板类都与其他向导面板类完全独立。向导面板创建它控制的视觉面板，从视觉面板组件中获取用户数据，并提供验证。向导面板还使用\
  \ `WizardDescriptor` 来存储状态数据。其他向导面板和向导的操作事件处理器可以访问这些数据以构建目标产物。现在让我们来看数字（Number）示例，向你展示这些向导面板如何与视觉面板协调工作，并让\
  \ `WizardDescriptor` 执行其职责。\n\n### 12.2 向导向导\n\nNetBeans IDE 提供了一个向导向导——即一个帮助你创建向导的向导。现在我们为名为“新数字序列（New\
  \ Number Sequence）”的功能创建一个向导。这个示例向导通过三个独立的步骤向用户请求一个三数字序列。\n\n### 构建示例\n\n要构建此示例，创建一个名为\
  \ `WizardExample` 的新 NetBeans Platform 应用程序。然后创建一个名为 `Sequence` 的新 NetBeans 模块，如图图\
  \ 12.2 所示。\n\n![](img/image7149.jpg)\n图 12.2 `WizardExample` 和 `Sequence` 模块\n\n\
  创建一个新向导，选择目标模块（在我们的示例中为 `Sequence`）。右键点击并选择 New | Other（新建|其他）。从图 12.3 开始。在你执行每个步骤时，注意你与之交互的面板。向导的标题为“New\
  \ File（新文件）”，步骤列在左侧。主面板请求信息。\n\n![](img/image7157.jpg)\n图 12.3 创建向导：选择文件类型\n\n###\
  \ 一个简易的向导\n\n在图 12.3 中，在 Categories（类别）下指定 Module Development（模块开发），在 File Types（文件类型）下指定\
  \ Wizard（向导）。在你完成这些选择后，Next（下一步）按钮将变为可用，而 Help（帮助）、Back（上一步）和 Finish（完成）按钮将都被禁用。\n\
  \n点击 Next（下一步）后，向导将进入下一个面板。在这里你可以看到 Registration Type（注册类型，自定义或新文件）、Wizard Step\
  \ Sequence（向导步骤序列，静态或动态）以及 Number of Wizard Panels（向导面板数量）。选择 Custom（自定义）、Static（静态）和\
  \ 3，如图图 12.4 所示。\n\n![](img/image7165.jpg)\n图 12.4 创建向导：指定向导类型\n\n在本章中，你将使用 Registration\
  \ Type Custom，这是一种为应用程序创建任意产物（例如领域对象或带有多个文件的目录结构）的向导注册类型。New File 注册适用于使用文件类型模板创建文件的向导。\n\
  \nWizard Step Sequence 提供了两个选项。Static（静态）意味着你的向导始终以相同的顺序使用相同的步骤。Dynamic（动态）允许你的向导更改步骤的顺序和数量。我们将在本书稍后的部分向你展示一个\
