  \ `main()` 中的代码，并解释为什么在 `main()` 中通过单线程启动我们的应用程序。\n\n### 单线程模型\nSwing 对象不是线程安全的。线程安全性通过在单线程（称为事件分发线程，简称\
  \ EDT）中执行 Swing 相关操作来实现。因此，所有 GUI 操作必须在 EDT 中进行。通常情况下，组件在 EDT 中被访问和更新。为了帮助你在 EDT\
  \ 中工作，Swing 有一个实用程序方法 `invokeLater()`，它保证其 `run()` 方法在 EDT 中执行。这如列表 2.13 所示（在这里可以使用\
  \ Lambda 表达式，因为 `Runnable` 是函数式接口）。\n\n注意，初始线程（即创建并开始执行你应用程序的线程）并不是 EDT。上面的 Lambda\
  \ 表达式实例化 `PersonJFrame` 对象并通过静态 `newInstance()` 方法使其窗口可见。我们在这里使用 `newInstance()`\
  \ 工厂方法，以便稍后以线程安全的方式配置监听器。列表 2.14 显示了构造函数以及 `configureListeners()` 和 `newInstance()`\
  \ 方法的代码。`configureListeners()` 在构造函数返回后由 `newInstance()` 调用。\n\n\n\n...[/content]`\
