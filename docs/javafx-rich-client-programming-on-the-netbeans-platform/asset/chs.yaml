  \ = \"FamilyTreeTemplate.ftr\")\n\npackage com.asgteach.familytreesupport;\n\nimport\
  \ org.netbeans.api.templates.TemplateRegistration;\n```\n\n当你构建模块时，所有的注册信息都包含在模块的\
  \ `generated-layer.xml` 文件中。生成的 Layer 文件通过 `<folder>`、`<file>` 和 `<attr>` 标签注册 FamilyTree\
  \ FTR 文件类型，这些标签指定了通过系统文件系统（System FileSystem）提供的配置信息（参见“Layer 文件和系统文件系统”，位于第 654\
  \ 页）。\n\n主要的根文件夹名称包括：`editors`，用于注册基于文本的 `x-familytree` 类型文件的 MultiView 编辑器；`Services/MIMEResolvers`，用于描述\
  \ `FamilyTreeDataObject` 的 MIME 解析器；`loaders`，用于处理 `text/x-familytree` 文件的动作和工厂；以及\
  \ `Templates`，用于注册 `FamilyTreeTemplate.ftr` 以创建此类类型的新文件。\n\n### 创建并编辑新的 FTR 文件\n\
  \n定义好 `FamilyTree` 文件类型后，让我们运行应用程序并按照以下步骤创建一个新的 FTR 文件。\n\n1. 运行 `FileTypeApp` 并打开“收藏（Favorites）”窗口。\n\
  2. 从“收藏”窗口中选择一个文件夹，右键点击并选择 `New | All Templates`。应用程序将显示“选择模板”对话框。选择 `FamilyTreeTemplate.ftr`，如图\
  \ 14.6 所示。点击“下一步”。\n![](img/image8714.jpg)图 14.6 选择模板对话框\n3. 应用程序现在显示“新对象名称”对话框。为新文件指定一个名称，如图\
  \ 14.7 所示。点击“完成”。\n![](img/image8720.jpg)图 14.7 新对象名称对话框\n4. 图 14.8 显示了“收藏”窗口中创建的新文件（`SimpsonFamilyTree.ftr`），并在\
  \ FamilyTree MultiView 编辑器中打开。\n![](img/image8726.jpg)图 14.8 编辑文件 SimpsonFamilyTree.ftr\n\
  5. 编辑文件并提供 Simpson 家族的姓名，如图 14.9 所示。注意，当你编辑文件时，“全部保存”图标会被启用。当你点击“全部保存”图标时，更改将保存到\
  \ `SimpsonFamilyTree.ftr` 文件中。\n![](img/image8737.jpg)图 14.10 添加到文件右键菜单的获取信息操作\n\
  \n注意，文件的右键菜单还包括典型的文件类型操作，如`打开（Open）`、`剪切（Cut）`、`复制（Copy）`、`删除（Delete）`、`重命名（Rename）`、`工具（Tools）`、`属性（Properties）`以及`添加到收藏（Add\
  \ to Favorites）`（因为我们使用了“收藏”窗口）。\n\n按照以下步骤为 `text/x-familytree` 文件类型添加此上下文敏感操作：\n\
  \n1. 在 `FamilyTreeSupport` 模块的“源包”中，右键点击包名并选择 `New | Action`。\n2. 在“操作类型”对话框中，选择“条件启用（Conditionally\
  \ Enabled）”。对于 Cookie 类，指定 `FamilyTreeDataObject`，这是该文件类型的 DataObject 类型。选择单选按钮`用户选择一个节点（User\
  \ Selects One Node）`并点击“下一步”，如图 14.11 所示。\n![](img/image8745.jpg)图 14.11 新操作类型对话框\n\
  3. 图 14.12 显示了 GUI 注册对话框。在顶层菜单的 `File` 下以及该特定文件类型的右键菜单中均注册该操作。\n\n\n\n\n`actionPerformed()`\
  \ 方法从 `DataObject` 上文中获取 `FileObject`。通过 `FileObject`，我们可以显示文件名、扩展名、MIME 类型、字节长度、行数、最后修改数据以及文件的完整路径。标准的\
  \ `NotifyDescriptor` 和 `DialogDisplayer` 会弹出一个信息对话框，并阻塞程序，直到用户将其关闭。（关于 `NotifyDescriptor`\
  \ 对话框的更多信息，请参阅第 527 页的“NotifyDescriptor.Message”。）\n\n### 根据内容提供子节点\n\n当用户打开 `FTR`\
  \ 文件时，`FamilyTreeDataObject`（参见第 685 页的 Listing 14.8）会实例化 `MultiView` 编辑器。生成的代码不包含重载的\
  \ `createNodeDelegate()` 方法。相反，`FamilyTreeDataObject` 依赖于继承自 `DataObject` 的默认实现。`createNodeDelegate()`\
  \ 方法返回一个节点（通常为 `DataNode`），用于在资源视图中表示此 `DataObject`。默认方法设置图标和显示名称，并将 `DataObject`\
  \ 添加到节点的 `Lookup` 中。\n\n要自定义此默认行为，请重写 `createNodeDelegate()` 方法。在本例中，我们创建了一个子节点列表，为\
  \ `FTR` 文本文件中的每一行创建一个节点。当用户展开文件节点时，收藏夹窗口会自动显示这些子节点（参见第 697 页的 Figure 14.14）。当用户编辑并保存文件更改时，收藏夹窗口也必须同步更新。\n\
  \n![](img/image8775.jpg)\n图 14.14 FileTypeApp 同步收藏夹窗口和文本编辑器\n\n如前所示，`ChildFactory`\
  \ 创建子节点（针对 `Person` 对象，参见第 300 页的 Listing 7.2）。Listing 14.13 显示了重写的 `createNodeDelegate()`\
  \ 方法，它同样使用私有类 `FamilyTreeChildFactory` 来创建子节点。注意，`FamilyTreeDataObject` 在 `DataNode`\
  \ 构造函数和 `FamilyTreeChildFactory` 构造函数中都被包含 (this)。\n\n`FamilyTreeChildFactory` 有三个任务：\n\
  \n-   向底层的 `FileObject` 添加 `FileChangeListener`，并在接收到文件更改事件时刷新其数据。这确保了当用户编辑 `FTR`\
  \ 文件时收藏夹窗口保持同步。在这里，我们使用 `FileChangeAdapter` 类，因为我们只关心文件更改事件。（我们将在第 636 页的“监控文件更改”中讨论\
  \ `FileChangeListeners`。）`refresh()` 方法根据需要重建子节点层次结构。\n-   在 `createKeys()` 方法中，解析文件，并将一个基于\
  \ `String` 的键添加到其底层的键列表中。（空行会被忽略。）\n-   在 `createNodeForKey()` 方法中，根据 `String` 键（文本行）创建一个\
  \ `AbstractNode`，并使用 `personIcon.png` 图作为图标。\n\n我们将在 第 7 章 中详细讨论节点、`ChildFactory`\
  \ 以及创建节点层次结构（参见第 295 页的“构建节点层次结构”）。\n\nListing 14.13 FamilyTreeDataObject 和 FamilyTreeChildFactory\n\
  点击此处查看代码图像\n\n```java\npublic class FamilyTreeDataObject extends MultiDataObject\
  \ {\n\n    . . .\n\n    @Override\n    protected Node createNodeDelegate() {\n \
  \       return new DataNode(this, Children.create(\n                new FamilyTreeChildFactory(this),\
  \ true), getLookup());\n    }\n\n    private static class FamilyTreeChildFactory\
  \ extends ChildFactory<String> {\n        private final FileObject fileObject;\n\
  \        public FamilyTreeChildFactory(FamilyTreeDataObject dataObject) {\n    \
  \        fileObject = dataObject.getPrimaryFile();\n            fileObject.addChangeListener(new\
  \ FileChangeAdapter() {\n                @Override\n                public voidChanged(FileEvent\
  \ fe) {\n                    refresh(true);\n                }\n            });\n\
  \        }\n\n        @Override\n        protected boolean createKeys(List<String>\
  \ list) {\n            // create a String for each line in the file\n          \
  \  try {\n                // skip blank lines\n                for (String line\
  \ : fileObject.asLines()) {\n                    if (!line.isEmpty()) {\n      \
  \                  list.add(line);\n                    }\n                }\n \
  \           } catch (IOException ex) {\n                Exceptions.printStackTrace(ex);\n\
  \            }\n            return true;\n        }\n\n        @Override\n     \
  \   protected Node createNodeForKey(String key) {\n            AbstractNode childNode\
  \ = new AbstractNode(Children.LEAF);\n            childNode.setDisplayName(key);\n\
  \            childNode.setIconBaseWithExtension(\"com/asgteach/familytreesupport/personIcon.png\"\
  );\n            return childNode;\n        }\n    }\n}\n```\n\n\n\n\n这些更改带来了两项增强。首先，“收藏夹”（Favorites）窗口会带有节点显示每一行文本。其次，当你编辑一个\
  \ FTR 文件并保存它时（点击顶层工具栏中的 `Save All`），“收藏夹”窗口将使用新的文件内容刷新，如 图 14.14 所示。\n\nNetBeans\
  \ 默认文本编辑器会在用户创建并保存更改时，在 `TopComponent` 的 `Lookup` 中处理 `Savable` 的安装和后续移除。（有关使用 `Savable`\
  \ 的示例，请参见第 500 页的“Implement Openable and SavablePersonCapability””。）\n\n## 14.3\
  \ 使用 MultiView 窗口\n\n`FamilyTreeDataObject` 包含了对 `MultiView` 窗口的支持。`MultiView` 编辑器是一个包含多个嵌入窗口的\
  \ `TopComponent`，这些窗口被称为 `MultiViewElement`。可以通过工具栏中的按钮对 `MultiViewElements` 进行选择，从而允许切换视图。\n\
  \n我们的 `FileTypeApp` 有一个标记为 `Text` 的窗口，显示一个纯文本编辑器。该编辑器完全由 NetBeans Platform 提供。另一个标记为\
  \ `Visual` 的窗口目前是空的（空白）。\n\n现在为我们的文件添加一个 `Visual` 视图，以便用户可以在文本编辑器和 `Visual` 视图之间切换。当用户在\
  \ `Visual` 视图中进行编辑时，这些更改将出现在 `Text` 视图中，反之亦然。因此，两个视图访问相同的底层文档模型，该模型会在用户编辑文件时进行同步。通过任何一个视图进行的更改都会启用\
  \ `Save All` 工具栏图标，并在保存后，“收藏夹”窗口将显示更新后的内容。\n\n图 14.15 显示了 `FileTypeApp` 在 FTR 编辑器的\
  \ `Visual` 视图中打开了文件 `SimpsonFamilyTree.ftr`。`Visual` 视图使用 NetBeans Platform 的 `Visual\
  \ Library` 来为 FTR 文件中的每一行创建对应的可移动小部件。在张截图中，用户正在编辑元素 `Bart`。更改尚未保存到文件中（因此“收藏夹”窗口尚未更新），且\
  \ `Save All` 图标已启用，反映了对底层模型的修改。\n\n![](img/image8801.jpg)\n图 14.15 使用 `FileTypeApp`\
  \ 的 Visual 视图进行编辑\n\n用户可以随时选择编辑器工具栏中的 `Text` 按钮来激活该文件的 `Text` 视图，如 图 14.16 所示。在这里，你看到的是来自底层文档模型的编辑后的内容。\n\
  \n![](img/image8806.jpg)\n图 14.16 保持 Text 和 Visual 视图同步\n\n当用户点击任意 `Save All` 图标或\
  \ `File | Save` 菜单项时，“收藏夹”窗口将显示保存的内容，如 图 14.17 所示。此时 `Save All` 图标将被禁用。\n\n![](img/image8811.jpg)\n\
  图 14.17 保存会刷新收藏夹窗口\n\n现在让我们向你展示如何使用 `Visual Library` 创建视觉元素，并保持多个视图之间底层文档模型的一致。\n\
  \n### 使用 Visual Library\n\n`Visual Library` 的完整描述超出了本书的范围，但我们可以提供一个简要的概述来帮助上手。正如其名称所示，`Visual\
  \ Library` 允许你创建具有可选、可移动和可更改图形组件的视图，这些组件被称为 `widgets`。当你使用 `Visual Library` 构建视图时，你实际上是在构建了一个\
  \ `Scene`，它是一个由小部件树结构组成的特殊小部件。`Scene` 是根元素，并创建一个与 Swing 兼容的 `JComponent` 视图，你可以将其添加到\
  \ Swing 组件中。\n\n为小部件创建操作，请使用 `ActionFactory` 并使用方法 `addAction()`其添加到小部件中。某些 `ActionFactory`\
  \ 方法需要提供者（例如 `EditAction`）。其他操作具有默认提供者（例如 `MoveAction`）。在应用程序中，我们同时添加了 `MoveAction`\
  \ 和内联编辑器操作，使用了 `TextFieldInplaceEditor` 的实现。\n\n小部件可以作为其他小部件的容器，并具有布局。我们的示例使用了 `LayoutWidget`（一种具有布局并持有其他小部件的透明小部件）和\
  \ `LabelWidget`（显示文本的小部件）。\n\n默认的 NetBeans Platform 应用程序不包含 `Visual Library API`\
  \ 模块。因此，在设置该模块依赖之前，你必须先将该模块包含在应用程序构建中。步骤如下：\n\n1. 在 `Projects` 视图中，右键点击 `FileTypeApp`\
  \ 项目，从键菜单中选择 `Properties`。\n2. 在 `Project Properties` 对话框的 `Categories` 下，选择 `Libraries`。\n\
  3. 在 `Platform Modules` 列表中，滚动并展开 `cluster platform`。\n4. 滚动到平台集群的末尾，选择 `Visual\
  \ Library API` 并点击 `OK`。\n\n现在你可以这样设置该模块依赖：\n\n1. 在 `Projects` 视图中，展开项目 `FamilyTreeSupport`，右键点击\
  \ `Libraries` 节点，并从键菜单中选择 `Add Module Dependency . .`。\n2. 在模块列表中，滚动到末尾，选择 `Visual\
  \ Library API` 并点击 `OK`。\n\n### 构建 Scene 并添加 Widgets\n\n现在让我们回到 `FamilyTreeVisualElement.java`，并为文件中的每行文本构建一个带有小部件的\
  \ `Scene`。这需要一组基于从 FTR 打开的文档的 `LabelWidgets`（每个每个非空文本行一个）。\n\n```java\n* * *\n@Messages(\"\
  LBL_FamilyTree_VISUAL\")\npublic final class FamilyTreeVisualElement extends JPanel\
  \ implements MultiViewElement {\n\n    private final FamilyTreeDataObject ftDataObject;\n\
  \    private final JBar toolbar = new JToolBar();\n    private transient MultiViewCallback\
  \ callback;\n    private final LayerWidget layer;\n    private EditorCookie editCookie\
  \ = null;\n    private StyledDocument doc = null;\n    private final Scene scene\
  \ = new Scene();\n    private final Border border = BorderFactory.createRoundedBorder(10,\
  \ 10, Color.yellow, Color.gray);\n    private static final Logger logger = Logger.getLogger(FamilyTreeVisualElement.class.getName());\n\
  \n    public FamilyTreeVisualElement(Lookup lkp) {\n        ftDataObject = lkp.lookup(FamilyTreeDataObject.class);\n\
  \        assert ftDataObject != null;\n        initComponents();\n        setLayout(new\
  \ BorderLayout());\n        layer = new LayerWidget(scene);\n        scene.addChild(layer);\n\
  \        add(new JScrollPane(scene.createView()));\n    }\n    // ...\n}\n* * *\n\
  ```\n\n\n\n\n与 `TopComponents` 类似，`MultiViewElements` 实现了重写的生命周期方法，允许你控制 `MultiViewElement`\
  \ 如何初始化和刷新的。在这里，我们使用 `componentShowing()` 方法从打开的文档初始化 `Scene` 中的小部件。每当用户切换视图时，都会调用\
  \ `componentShowing()` 方法，应用程序启动并显示此视图时也会调用。（有关这些生命周期方法的描述，请参阅第 369 页的“窗口系统生命周期管理”。）我们使用\
  \ `DataObject` 的 `EditorCookie`（来自 `Lookup`）来确保编辑器已打开且文档已初始化。\n\n打开 `FTR` 文件默认会在纯文本编辑器中打开该文件。此打开操作会初始化底层文档，使其可以通过\
  \ `EditorCookie.getDocument()` 方法获取。然而，如果应用程序上次退出时 `FTR` 文件是在 `Visual` 视图中打开的，那么该视觉元素会先打开，此时文档尚未初始化。`componentShowing()`\
  \ 方法确保了在这种场景下文档被正确初始化。\n\n`refreshLines()` 方法解析文档并为每一行创建一个 `LabelWidget`（忽略空行）。由于用户每次从\
  \ `Text` 视图切换到 `Visual` 视图时都会调用 `componentShowing()` 方法，因此 `Scene` 始终显示当前编辑的文档。\n\
  \n`makeWidget()` 方法构建一个 `LabelWidget`（一个显示文本的小部件）并设置其位置、边框和文本标签。该方法还为小部件配置了两个动作：`EditAction`（允许用户编辑小部件标签）和\
  \ `MoveAction`（允许用户在 `Scene` 中移动小部件）。`MoveAction` 有一个从 `ActionFactory` 获取的默认提供程序。对于\
  \ `EditAction`，我们配置了一个 `Provider`，如下所示。列表 14.15 显示了 `componentShowing()`、`refreshLines()`\
  \ 和 `makeWidget()` 方法的代码。\n\n### 列表 14.15 FamilyTreeVisualElement—添加小部件\n点击此处查看代码图像\n\
  \n* * *\n\n```java\npublic final class FamilyTreeVisualElement extends JPanel\n\
  implements MultiViewElement {\n\n. . .\n\n    @Override\n    public void componentShowing()\
  \ {\n        editCookie = ftDataObject.getLookup().lookup(EditorCookie.class);\n\
  \        if (editCookie != null) {\n            doc = editCookie.getDocument();\n\
  \            if (doc == null) {\n                editCookie.open();            \
  \          // open\n                try {\n                    doc = editCookie.openDocument();\
  \      // get document\n                } catch (IOException ex) {\n           \
  \         Exceptions.printStackTrace(ex);\n                    return;\n       \
  \         }\n            }\n            refreshLines();\n        }\n    }\n    private\
  \ void refreshLines() {\n        layer.removeChildren();\n        try {\n      \
  \      String docString = doc.getText(0, doc.getLength());\n            int i =\
  \ 1;\n            for (String text : docString.split(\"\\n\")) {\n             \
  \   if (!text.isEmpty()) {\n                    LabelWidget widget = makeWidget(text,\n\
  \                    new Point(20, 40 * i++));\n                    layer.addChild(widget);\n\
  \                }\n            }\n            scene.validate();\n        } catch\
  \ (BadLocationException ex) {\n            Exceptions.printStackTrace(ex);\n   \
  \     }\n    }\n    private LabelWidget makeWidget(String text, Point point) {\n\
  \        LabelWidget widget = new LabelWidget(scene, text);\n        widget.getActions().addAction(editorAction);\n\
  \        widget.getActions().addAction(ActionFactory.createMoveAction());\n    \
  \    widget.setPreferredLocation(point);\n        widget.setBorder(border);\n  \
  \      return widget;\n    }\n. . .\n}\n```\n\n* * *\n\n`makeWidget()` 方法为 `LabelWidget`\
  \ 添加了 `TextFieldInplaceEditor`。列表 14.16 显示了实现此内联编辑器的代码，它需要 `isEnabled()`、`getText()`\
  \ 和 `setText()` 方法。`setText()` 方法会同时更新 `LabelWidget` 和底层文档。NetBeans 提供的纯文本编辑器接收\
  \ `DocumentListener` 事件，并通过向 `TopComponent` 的 `Lookup` 中添加 `Savable` 实现来做出响应。这反过来可以使用工具栏的“全部保存”图标。如果用户切换视图，`Text`\
  \ 视图将显示更新后的文本。\n\n`updateDocument()` 方法对底层文档执行实际更新。由于我们是从非空行创建小部件，我们对文档进行了处理以移除任何多余的换行符。这确保了在更新文本时提供了正确的位置。如果用户将小部件的标签设置为空字符串，该方法将通过调用\
  \ `refreshLines()`（之前显示过）从场景中移除该小部件。\n\n列表 14.16 FamilyTreeVisualElement—实现 LabelWidget\
  \ 编辑\n点击此处查看代码图像\n\n* * *\n\n```java\n    private final WidgetAction editorAction\
  \ =\n        ActionFactory.createInplaceEditorAction(new LabelTextFieldEditor());\n\
  \    private class LabelTextFieldEditor implements TextFieldInplaceEditor {\n@Override\n\
  \    public boolean isEnabled(Widget widget) {\n        return true;\n    } @Override\n\
  \    public String getText(Widget widget) {\n        return ((LabelWidget) widget).getLabel();\n\
  \    }    @Override\n    public void setText(Widget widget, String text) {\n   \
  \     LabelWidget lw = (LabelWidget) widget;\n        String oldText = lw.getLabel();\n\
  \        lw.setLabel(text);\n        updateDocument(lw, oldText.length());\n   \
  \ }\n    private void updateDocument(LabelWidget labelWidget, int oldText) {\n \
  \       if (editCookie != null) {\n            doc = editCookie.getDocument();\n\
  \            if (doc != null) {\n                try {\n                    // 标准化文件--移除额外的行\n\
  \                    String docString = doc.getText(0, doc.getLength());\n     \
  \               StringBuilder sb = new StringBuilder();\n                    for\
  \ (String text : docString.split(\"\\n\")) {\n                        if (!text.isEmpty())\
  \ {\n                            sb.append(text);\n                            sb.append(\"\
  \\n\");\n                        }\n                    }\n                    //\
  \ 替换为标准化的文本\n                    doc.remove(0, doc.getLength());\n             \
  \       doc.insertString(0, sb.toString(), null);\n                    // 在文档中查找新字符串的\n\
  \                    // 起位置\n                    int startPosition = 0;\n      \
  \              for (Widget widget : layer.getChildren()) {\n                   \
  \     if (widget instanceof LabelWidget) {\n                            LabelWidget\
  \ lw = ((LabelWidget) widget);\n                            if (lw.equals(labelWidget))\
