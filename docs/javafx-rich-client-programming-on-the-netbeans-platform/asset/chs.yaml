  \ 8.45 显示空编辑器区域已经增大。![](img/image5300.jpg)图 8.45 带有四个自定义模式和空编辑器区域的窗口布局。\n\n### 隐藏空编辑器区域\n\
  \n按照以下步骤隐藏空编辑器区域。你将添加一个 `@OnStart` `Runnable`（参见第 242 页上的“Using @OnStart”）。注意，你仍然可以在编辑器区域中打开窗口，但如果编辑器区域是空的，其他窗口将完全填充该空间。\n\
  \n1. `@OnStart` 注解需要对 Module System API 的依赖。在 `Modes2` 模块的 Libraries 节点上，右键点击并从上下文菜单中选择\
  \ `Add Module Dependency . ..`。在 `Add Module Dependencies` 对话框中，从模块列表中选择 `Module\
  \ System API`。点击 OK。\n2. 在 `Modes2` 模块中，右键点击包名 `com.asgteach.modes2`，从从菜单中选择 `New\
  \ | Java Class . ..`。\n3. NetBeans 显示 New Java Class 对话框。对于 `Class Name`，指定 `Installer`（任何名称均可）并点击\
  \ Finish。\n4. NetBeans 添加了 `Installer.java` 类。让 `Installer` 类实现 `Runnable`，添加 `@OnStart`\
  \ 注解并实现 `run()` 方法，如 Listing 8.28 所示。\n\nListing 8.28 `Installer.java`——提供模块生命周期方法点击此处查看代码图像\n\
  \n```\npackage com.asgteach.modes2;\n\nimport org.openide.modules.OnStart;\n\n@OnStart\n\
  public class Installer implements Runnable {\n\n    @Override\n    public void run()\
  \ {\n        System.setProperty(\"netbeans.winsys.hideEmptyDocArea\", \"true\");\n\
  \    }\n}\n```\n\n\n\n\n5. 或者，你也可以在模块的 `platform.properties` 文件（位于 `Modes2/Important\
  \ Files/Project Properties`）中配置以下运行时参数。\n\n```\nrun.args.extra=-J-Dnetbeans.winsys.hideEmptyDocArea=true\n\
  ```\n\n现在，当你再次运行应用程序 `ModeApp2` 时，将不再看到空白文档区域，即使在调整大大也是如此（如第 396 页上的图 8.43 所示）。\n\
  \n### 没有任何模式是孤岛\n\n一旦你开始尝试自己的模式（modes），你就会发现系统的窗口布局取决于所有正在使用的模式之间的相互作用，以及用户在调整窗口框大小或重新定位、浮动、打开和关闭窗口时的操作行为。事实上，没有任何模式是孤立于这种行为之外。在尝试自己的窗口布局时，以下额外的策略提示可能对你有帮助：\n\
  \n1. 首先使用“窗口布局”（Layout of Windows）向导。如果有必要，通过调整生成的 `wsmode` 文件来微调你的窗口布局。\n2. 尽可能简化\
  \ `constraints` 元素。\n3. 确保 `empty-behavior` 属性 `permanent` 被设置为 `\"true\"`。\n4.\
  \ 我们发现，为窗口布局创建所有新模式比将新模式与默认模式混合要容易。如果你确实混合了模式，请保留你使用的任何默认模式的模式定义文件（在“窗口布局”向导的“找到模式”对话框中检查它们）。\n\
  5. 通过将窗口拖到新位置并调整大小来实验窗口布局。当你关闭应用程序时，最近的窗口布局将保留在应用程序目录下的 `build/testuserdir/config/Windows2Local/Modes`\
  \ 。\n\n## 8.10 窗口布局角色\n\nNetBeans 平台允许你根据角色（roles）定义不同的窗口布局。一个常见的用例为应用程序提供基于角色的视角。窗口管理器（WindowManager）会跟踪你定义的角色，并为你使用的每个角色在应用程序目录的\
  \ `build/testuserdir/config` 下持久一个独立的 `Windows2Local` 层级结构。\n\n角色通过调用 `WindowManager`\
  \ 方法 `setRole(\"ModeName\")` 产生。`TopComponent` 可以被限制在一个或多个命名角色中。否则，任何 `TopComponent`\
  \ 都可以出现在任何角色中。\n\n如果一个 `TopComponent` 被分配了一个或多个角色，则只有当其中一个角色激活状态时，该 `TopComponent`\
  \ 才会打开。如果一个 `TopComponent` 没有分配任何角色，则它可以以任何角色打开。\n\n当应用程序启动时，默认角色生效。你可以通过调用带有参数\
  \ `null` 的 `WindowManager setRole()` 方法来切换到默认角色。如果你想让应用程序以特定的（非默认）角色启动，请在标记了 `@OnStart`\
  \ 注解的 `Runnable` 中调用 `WindowManager` 方法 `setRole(\"MyRole\")`。\n\n通常情况下，当用户操作窗口框、调整窗口大小或调用其他窗口操作时，窗口系统会在应用程序关闭时保存这些更改。当使用角色时，窗口系统会为每个角色单独保存窗口布局。因此，用户在某个角色中对窗口布局所做的更改不会影响其他任何角色的窗口布局。\n\
  \n让我们向你展示一个名为 `RoleExample` 的应用程序基于角色的示例。该应用程序有三个角色：默认角色、`User` 和 `Admin`。`User`\
  \ 和 `Admin` 角色分别分配了专门针对这些角色的 `TopComponent`。当你运行应用程序且 `User` 角色激活时，你会看到一组组件。同样，当你在\
  \ `Admin` 角色激活时运行应用程序时，你会看到一组不同的组件。\n\n`RoleExample` 还有一个 `LoginTopComponent`，它没有被分配任何角色。这意味着\
  \ `LoginTopComponent` 可以在默认角色下打开，并在新角色激活时仍保持打开状态。\n\n`LoginTopComponent` 充当门卫员，向用户请求用户名和密码。当用户点击登录按钮时，事件处理程序会查找用户名和密码以找到该用户名对应的角色。然后根据用户名将角色更改为\
  \ `User` 或 `Admin`。如果登录失败，则不会发生角色切换。\n\n图 8.46 显示了 `RoleExample` 应用程序在默认角色激活时运行的情况。有一个打开的窗口（`LoginTopComponent`），其中填写了用户名和密码字段。事实证明，Joe\
  \ 在我们的数据存储中角色为 `User`。\n\n![](img/image5338.jpg)\n图 8.46 具有默认窗口布局（未设置角色）的 RoleExample\
  \ 应用程序\n\n点击登录按钮且 Joe 的凭据检查通过后，应用程序调用 `WindowManager` 方法 `setRole(\"User\")`。`LoginTopComponent`\
  \ 保持打开，你会看到两个额外的窗口：`UserExplorer` 和 `UserEditor`，如图 8.47 所示。这两个 `TopComponents`\
  \ 被分配了角色 `User`。\n\n![](img/image5344.jpg)\n图 8.47 具有 User 角色的 RoleExample 应用程序\n\
  \n如果此时 Joe 调整了窗口框，更改将在应用程序切换角色或关闭时持久化。默认角色和 `Admin` 角色不受 Joe 窗口操作的影响。\n\n由于 `LoginTopComponent`\
  \ 是打开的，另一个用户可以登录。假设我们有一个角色为 `Admin` 的第二个用户 Mer。当 Mer 登录时，应用程序切换到 `Admin` 角色，如图 8.48\
  \ 所示。\n\n![](img/image5350.jpg)\n图 8.48 具有 Admin 角色的 RoleExample 应用程序如果用户任何时候在登录窗口提供了无效信息，应用程序将切换到默认角色。这将恢复到你在图\
  \ 8.46 第 402 页所示的布局，所有其他 `TopComponents` 都是关闭的。\n\n## RoleExample 应用程序与基于角色的 TopComponent\n\
