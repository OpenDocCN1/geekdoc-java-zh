  ## 12.7 异步验证 (Asynchronous Validation)\n\n你到为止看到的示例包含了不需要花费过多时间的验证——即视觉面板对图形用户组件中的文档更改做出响应。这反过来向向导面板触发属性更改事件，从而重新验证输入。然而，如果验证需要较长时间的过程（例如\
  \ Web 服务调用或数据库访问）会发生什么？在这种情况下，你不希望阻塞用户界面（并阻止用户点击 `Cancel` 按钮）。相反，你在用户点击 `Next` 按钮后提供异步验证。这意味着在验证完成之前，`WizardDescriptor`\
  \ 不会进入下一个面板，但 `Cancel` 按钮仍然处于激活状态。\n\n让我们通过一个稍为刻意的示例来展示如何实现异步验证。假设新的数字序列必须以一个唯一的数字开始；即以前未用作初始数字的数字。在我们的案例中，假设此检查可能需要一些时间，因此我们想要异步执行验证。\n\
  \n以下是在示例中实现异步验证将遵循的通用步骤：\n\n1. 通过提供一个独立的模块（`SequenceStore`）来模拟数据库调用，该模块存储每个初始序列数字，并允许客户端验证新数字序列的方法。因此，我们必须创建此新模块，将其\
  \ API 包设为公共，并将该模块作为依赖添加到 `Sequence` 模块中。\n2. 我们在视觉面板中添加一个带有公共方法 `setStatus()` 的\
  \ `JLabel` 组件，并让向导面板可以访问 `JTextField` 组件（数字输入组件）。（这只是为了给用户提供视觉反馈。）\n3. 向导面板实现 `WizardDescriptor.AsynchronousValidatingPanel<WizardDescriptor>`\
  \ 而不是 `WizardDescriptor.Panel<WizardDescriptor>`。在示例中，我们对 `NumberWizardPanel` 进行了此更改。\n\
  4. 重写 `prepareValidation()` 方法，该方法被同步调用并执行对视觉面板的任何验证访问。注意，异步验证方法不应访问视觉面板中的组件。\n\
  5. 重写 `validate()` 方法。该方法在单独线程中被调用。如果验证失败，抛出 `WizardValidationException`（当然了！）。`WizardDescriptor`\
  \ 会处理 `WizardValidationException`，显示提供的错误消息，并阻止用户进入下一个面板。\n6. 在向导完成后，在 `SequenceStore`\
  \ 模块中存储初始序列数字。\n\n* *\n\n**向导提示 (Wizard Tip)**\n另一种选项是在面板之间的验证不具有时间关键性时执行同步验证。要实现这一点，实现接口\
  \ `WizardDescriptor.ValidatingPanel<WizardDescriptor>` 并重写 `validate()` 方法，`WizardDescriptor`\
  \ 会同步调用该方法。请参见 Listing 12.28。\n\n* *\n\n让我们在 `WizardExample` 中创建一个新模块来开始异步验证。调用\
  \ `SequenceStore` 模块。在 `SequenceStore` 中，在 `com.gteach.sequore.api` 包中创建接口 `NumberStore`，并如\
  \ `Listing 12.21` 所示提供 `store()` 和 `isUnique()` 方法。\n\n\n\n\n\n现在请关注 `NumberWizardPanel1`，这是一个提供异步验证的（参见\
  \ Listing 12.24）向导面板。首先，向 `Lookup` API 和模块 `SequenceStore` 添加依赖，以便访问 `NumberStore`\
  \ 的服务提供程序。注意，我们在这里仍然对用户输入进行验证，以输入是一个有效的非负数。在验证成功且用户点击“下一步”（Next）后，`WizardDescriptor`\
  \ 通过调用 `prepareValidation()` 然后调用 `validate()` 来启动异步验证。这些方法是 `WizardDescriptor.AsynchronousValidatingPanel`\
  \ 接口要求的，我们在 `NumberWizardPanel1` 中提供了它们的实现。\n\n`prepareValidation()` 方法执行验证所需的任何\
  \ GUI 相关功能。在这里，我们向视觉化面板写入状态消息，并获取 `JTextField` 组件的引用。该组件对于 `WizardValidationException`\
  \ 是必要的。\n\n`validate()` 方法在单独线程中执行实际的数字序列验证。首先，我们通过全局查找（Global Lookup）获取 `NumberStore`\
