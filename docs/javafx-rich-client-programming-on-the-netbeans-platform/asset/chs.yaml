  \        }\n    }\n}\n```\n\n### 实现 FileChangeListener\n\n`FileChangeListener` 接口有六个方法需要重写，如表\
  \ 13.3 所示（如果没有必要处理 `FileChangeListener` 中的所有事件，可以使用 `FileChangeAdapter` 适配器类）。\n\
  \n表 13.3 FileChangeListener 方法\n\n列表 13.1 显示了 `FileChangeListener` 的实现。对于每个方法（除了空的\
  \ `fileAttributeChanged()` 方法外），我们将事件名称和受影响的文件写入输出窗口，并更新 `TopComponent` 中的层级结构。我们还会在受影响的\
  \ `FileObject` 中设置了一个属性，对事件进行颜色编码（该属性由第 645 页列表 13.10 中所示的 `displayFiles()` 方法读取）。\n\
  \n绿色对应新文件夹，橙色对应新文件，蓝色对应更改的文件或文件夹，洋色对应重命名的文件或文件夹。删除事件没有设置属性，因为该文件夹或文件将不再显示在层级结构中。\n\
  \n列表 13.1 ChangeDetectorTopComponent—FileChangeListener\n\n```java\nprivate final\
  \ FileChangeListener fcl = new FileChangeListener() {\n    @Override\n    public\
  \ void fileFolderCreated(FileEvent fe) {\n        displayMessage(\"文件文件夹创建: \" +\
  \ fe.getFile().getPath());\n        try {\n            fe.getFile().setAttribute(FO_MODIFICATION_COLOR,\
  \ Color.GREEN);\n            updateDisplay();\n        } catch (IOException ex)\
  \ {\n            Exceptions.printStackTrace(ex);\n        }\n    }\n\n    @Override\n\
  \    public void fileDataCreated(FileEvent fe) {\n        displayMessage(\"文件数据（文件）创建:\
  \ \"\n                + fe.getFile().getPath());\n        try {\n            fe.getFile().setAttribute(FO_MODIFICATION_COLOR,\
  \ Color.ORANGE);\n            updateDisplay();\n        } catch (IOException ex)\
  \ {\n            Exceptions.printStackTrace(ex);\n        }\n    }\n\n    @Override\n\
  \    public void fileChanged(FileEvent fe) {\n        displayMessage(\"文件更改: \"\
  \ + fe.getFile().getPath());\n        try {\n            fe.getFile().setAttribute(FO_MODIFICATION_COLOR,\
  \ Color.BLUE);\n            updateDisplay();\n        } catch (IOException ex) {\n\
  \            Exceptions.printStackTrace(ex);\n        }\n    }\n\n    @Override\n\
  \    public void fileDeleted(FileEvent fe) {\n        displayMessage(\"文件/文件夹删除:\
  \ \" + fe.getFile().getPath());\n        updateDisplay();\n    }\n\n    @Override\n\
  \    public void fileRenamed(FileRenameEvent fre) {\n        displayMessage(\"文件重命名:\
  \ \" + fre.getFile().getPath());\n        try {\n            fre.getFile().setAttribute(FO_MODIFICATION_COLOR,\
  \ Color.MAGENTA);\n            updateDisplay();\n        } catch (IOException ex)\
  \ {\n            Exceptions.printStackTrace(ex);\n        }\n    }\n\n    @Override\n\
  \    public void fileAttributeChanged(FileAttributeEvent fae) { }\n};\n```\n\n\n\
