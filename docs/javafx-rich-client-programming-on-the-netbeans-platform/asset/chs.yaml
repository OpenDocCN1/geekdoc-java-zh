  \ 和 `Nodes API`。点击 OK 添加这些依赖项。\n\n为 `EditorManager` 服务提供者创建 Java 接口，如下：\n\n1. 在项目\
  \ `EditorManager` 中，展开 `Source Packages`，右键点击包名，并选择 `New | Java Interface....`。\n\
