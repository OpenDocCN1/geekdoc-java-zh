  \ 内容的 Visual（视觉）视图。我们将提供与之前为你展示的 Visual 视图相同的功能。这个 VisualFX 视图包括所有视图之间的底层文档同步、就地编辑器、视觉元素的鼠标拖拽，以及添加元素的工具栏操作。此外，当用户切换到\
  \ VisualFX 视图时，会播放淡入过渡动画。由于我们使用了 JavaFX，因此使用 CSS 对元素进行样式化。\n\n[图 14.19] 显示了运行中的应用程序。MultiView\
  \ 窗口现在有三个视图：Text（文本）、Visual（视觉）以及所示的 VisualFX 视图。用户正在编辑文档，工具栏上的“全部保存”图标已启用。与你已经见过的\
  \ MultiView 窗口行为类似，在 VisualFX 视图中进行的更改会出现在 Text 和 Visual 视图中。在其他每个视图中进行的编辑同样会影响\
  \ VisualFX 视图。\n\n![](img/image8908.jpg)\n图 14.19 显示 JavaFX 内容的 VisualFX 视图\n\n\
  这里的关键策略是应用[第 6 章]中将 JavaFX 内容与 NetBeans Platform 应用集成的方法。我们使用 `FXML` 进行布局，并使用 `FXML`\
  \ 控制器类来管理和隔离 JavaFX 内容。VisualFX 视图使用了所有三种通信策略：自包含事件、单向通信和双向通信（参见第 261 页的“通信策略”）。特别需要注意的是，请注意\
  \ `FXML` 控制器类中的属性更改支持，会将用户发起的底层文档更改传回给外层的 MultiView 元素。我们将在展示如何构建 VisualFX 视图时解释所有这些内容。\n\
  \n[图 14.20] 显示当用户点击 VisualFX 按钮时 FileTypeApp 应用程序的状态。文本元素一个接一个淡入。此外，请注意工具栏上的“添加名称”图标在\
  \ Visual 和 VisualFX 视图中都是启用的。\n\n![](img/image8915.jpg)\n图 14.20 正在淡入的 VisualFX\
  \ 视图\n\n以下是将 VisualFX 视图添加到 FTR MultiView 编辑器中所需的步骤摘要：\n\n-   通过重构复制 `FamilyTreeVisualElement.java`\
  \ 创建 `FamilyTreeVisualFXElement.java` Java 文件。\n-   为 JavaFX 内容创建文件 `FtrVisual.fxml`、`FtrVisualController.java`\
  \ 和 `FtrCSS.css`。\n-   配置 `FamilyTreeVisualFXElement` 以构建 JavaFX 场景图并存储对 JavaFX\
  \ 控制器的引用。在 `componentShowing()` 生命周期方法中以及接收到属性更改事件时构建 JavaFX 内容。在 `componentHidden()`\
  \ 生命周期方法中清空 JavaFX 内容。当用户切换到 VisualFX 视图时，启动淡入过渡。\n-   配置 JavaFX 控制器类。添加一个 `public\
  \ refresh()` 方法，根据底层文档构建 JavaFX 场景图。包含用于移动元素的鼠标拖拽处理程序。包含一个打开就地编辑器的双击鼠标事件。当用户编辑名称时触发属性更改事件。添加一个播放淡入过渡动画的\
  \ `public doFadeIn()` 方法，以及一个清空 JavaFX 内容的 `public clear()` 方法。\n\n### 添加 FamilyTreeVisualFXElement.java\n\
  \n1.  在模块 `FamilyTreeSupport` | Source Packages 中，右键点击 `FamilyTreeVisualElement.java`\
  \ 并从右键菜单中选择 `Copy`（复制）。\n2.  选择包名，右键点击并选择 `Paste`（粘贴）。在右键菜单中选择 `Refactor Copy`（重构复制）。在对话框中，指定\
  \ `FamilyTreeVisualFXElement` 为新的 Java 类名。\n\n你将进行更改以构建 JavaFX Scene 并实例化 JavaFX\
  \ 控制器类。首先，创建 JavaFX 相关的文件。\n\n### 创建 JavaFX FXML、控制器类和 CSS 文件\n\n向 `FamilyTreeSupport`\
  \ 模块添加文件 `FtrVisualFX.fxml`、`FtrVisualFXController.java` 和 `FtrCSS.css`。我们将在修改了\
  \ MultiView 元素文件 `FamilyTreeVisualFXElement.java` 后配置这些文件。要创建 FXML 和 JavaFX 控制器文件，请在\
  \ NetBeans IDE 中构建一个新的 JavaFX FXML 项目，并将生成的 FXML 文档和 FXML 控制器类复制到 `FamilyTreeSupport`\
  \ 源包中。\n\n### 配置 FamilyTreeVisualFXElement.java\n\n`FamilyTreeVisualFXElement` 的结构与你已经见过的\
  \ MultiView 元素相似。在这里，我们构建了 JavaFX 场景并存储对 JavaFX 控制器类的引用。为了安全地存储引用，我们使用倒数锁来等待 `createScene()`\
  \ 方法完成。\n\n与上一节一样，我们还实现了 `Droppable` 并将其添加到此元素的 `Lookup` 中。该实现将提供的 `String` 追加到文档末尾，然后调用控制器的\
  \ `refresh()` 方法（使用 `Platform.runlater()` 在 JavaFX 线程上执行）。\n\n[代码列表 14.20] 显示了注册\
  \ MultiView 元素、配置带有 `InstanceContent` 和 `AbstractLookup` 的代理 `Lookup`、将 `Droppable`\
  \ 添加到 `Lookup` 以及创建 JavaFX 内容的代码。\n\n代码列表 14.20 FamilyTreeVisualFXElement—初始化 JavaFX\
  \ 内容\n\n```java\n@MultiViewElement.Registration(\n    displayName = \"#LBL_FamilyTreeFX_VISUAL\"\
  ,\n    iconBase = \"com/asgteach/familytreesupport/check.png\",\n    mimeType =\
  \ \"text/x-familytree\",\n    persistenceType = TopComponent.PERSISTENCE_NEVER,\n\
  \    preferredID = \"FamilyTreeVisual\",\n    position = 200\n)\n@Messages(\"LBL_FamilyTree_VISUAL=VisualFX\"\
  )\nfinal class FamilyTreeFXElement extends JPanel implements MultiViewElement, PropertyChangeListener\
  \ {\n    private final FamilyDataObject fd;\n    private final JBar toolbar = new\
  \ JBar();\n    private transient MultiViewCallback callback;\n    private ProxyLookup\
  \ proxyLookup = null;\n    private final InstanceContent instanceContent = new InstanceContent();\n\
  \    private EditorCookie editCookie = null;\n    private StyledDocument doc = null;\n\
  \    private static JPanel fxPanel;\n    private FtrController controller;\n   \
  \ private static final Logger logger = Logger.getLogger(FamilyTreeFXElement.class.getName());\n\
  \n    public FamilyTreeFXElement(Lookup lkp) {\n        proxyLookup = new ProxyLookup(lkp,\
  \ AbstractLookup(instanceContent));\n        fd = lkp.lookup(FamilyDataObject.class);\n\
  \        assert fd != null;\n        initComponents();\n        setLayout(new BorderLayout());\n\
  \        init();\n        instanceContent.add(new Droppable() {\n            @Override\n\
  \            public void drop(String text) {\n                // add the text to\
  \ the end of the document, then refresh()\n                if (doc != null) {\n\
  \                    try {\n                        if (!(doc.getText(doc.getLength(),\
  \ 1).endsWith(\"\\n\"))) {\n                            doc.insertString(doc.getLength(),\
  \ \"\\n\", null);\n                        }\n                        doc.insertString(doc.getLength(),\
  \ text + \"\\n\", null);\n                        String docString = doc.getText(0,\
  \ doc.getLength());\n                        Platform.runLater(() -> controller.refresh(docString));\n\
  \                    } catch (BadLocationException ex) {\n                     \
  \   Exceptions.printStackTrace(ex);\n                    }\n                }\n\
  \            }\n        });\n    }\n\n    private void init() {\n        fxPanel\
  \ = new JFXPanel();\n        add(fxPanel, BorderLayout.CENTER);\n        Platform.setImplicitExit(false);\n\
  \        // need to wait for this to complete so that we can\n        // safely\
  \ add ourselves as a property change listener\n        final CountDownLatch latch\
  \ = new CountDownLatch(1);\n    }\n}\n```\n\n\n\n\n```java\nPlatform.runLater(()\
  \ -> {\n    try {\n        createScene();\n    } finally {\n        latch.countDown();\n\
  \    }\n});\ntry {\n    latch.await();\n} catch (InterruptedException ex) {\n  \
  \  logger.log(Level.WARNING, null, ex);\n}\n}\n\nprivate void createScene() {\n\
  \    try {\n        URL location = getClass().getResource(\"FtrVisualFX.fxml\");\n\
  \        FXMLLoader fxmlLoader = new FXMLLoader();\n        fxmlLoader.setLocation(location);\n\
  \        fxmlLoader.setBuilderFactory(new JavaFXBuilderFactory());\n        Parent\
  \ root = (Parent) fxmlLoader.load(location.openStream());\n        javafx.scene.Scene\
  \ scene = new javafx.scene.Scene(root);\n        fxPanel.setScene(scene);\n    \
  \    controller = (FtrVisualFXController) fxmlLoader.getController();\n    } catch\
  \ (IOException ex) {\n        Exceptions.printStackTrace(ex);\n    }\n}\n. . .\n\
  }\n```\n\n* * *\n\nListing 14.21 显示了 `FamilyTreeVisualFXElement` 的生命周期方法和属性更改事件处理器。`componentOpened()`\
  \ 方法将类作为属性更改监听器添加到 JavaFX 控制器类中，而 `componentClosed()` 方法则移除该监听器。`componentShowing()`\
  \ 方法（当用户选择 VisualFX 标签以使此元素可见时调用）从 `DataObjectCookie` 获取底层文档。`refresh()` 方法将 JavaFX\
  \ 内容与文档的当前状态同步。`doFadeIn()` 方法通过顺序的 `FadeTransition` 使单个 JavaFX 场景图元素淡入。一个倒计时计数器（countdown\
  \ latch）确保了此方法在 `refresh()` 完成后执行。`propertyChange()` 方法在用户更改 JavaFX 场景图中的文本时被调用。此事件处理器接收更新后的\
  \ `String` 并用此值替换底层文档。更新后的文档会在 NetBeans 提供的文本编辑器中被检测到，编辑器通过在其 `Lookup` 中放置 `Savable`\
  \ 做出响应。`propertyChange()` 事件处理器在处理文档更改后刷新 JavaFX 内容。Listing 14.21 `FamilyTreeVisualFXElement`—生命周期与属性更改\
  \ 点击此处查看代码图像\n\n* * *\n\n```java\npublic final class FamilyTreeVisualFXElement extends\
  \ JPanel\n        implements MultiViewElement, PropertyChangeListener {\n. . .\n\
  \n    @Override\n    public void componentOpened() {\n        // 需要倒计时计数器以确保\n \
  \       // 控制被正确初始化\n        controller.addPropertyChangeListener(this);\n    }\n\
  \n    @Override\n    public void componentClosed() {\n        controller.removePropertyChangeListener(this);\n\
  \    }\n\n    @Override\n    public void componentShowing() {\n        editCookie\
  \ = ftDataObject.getLookup().lookup(EditorCookie.class);\n        if (editCookie\
  \ != null) {\n            doc = editCookie.getDocument();\n            if (doc ==\
  \ null) {\n                editCookie.open(); // open\n                try {\n \
  \                   doc = editCookie.openDocument(); // 获取文档\n                }\
  \ catch (IOException ex) {\n                    Exceptions.printStackTrace(ex);\n\
  \                    return;\n                }\n            }\n            try\
  \ {\n                String docString = doc.getText(0, doc.getLength());\n     \
  \           final CountDownLatch latch = new CountDownLatch(1);\n              \
  \  Platform.runLater(() -> {\n                    try {\n                      \
  \  controller.refresh(docString);\n                    } finally {\n           \
  \             latch.countDown();\n                    }\n                });\n \
  \               try {\n                    latch.await();\n                    //\
  \ 等待 refresh() 完成后再调用淡入效果\n                    Platform.runLater(() -> controller.doFadeIn());\n\
  \                } catch (InterruptedException ex) {\n                    logger.log(Level.WARNING,\
  \ null, ex);\n                }\n            } catch (BadLocationException ex) {\n\
  \                Exceptions.printStackTrace(ex);\n            }\n        }\n   \
  \ }\n\n    @Override\n    public void componentHidden() {\n        Platform.runLater(()\
  \ -> controller.clear());\n    }\n\n    @Override\n    public void propertyChange(ChangeEvent\
  \ evt) {\n        // 控制器发生了更改；我们必须\n        // 处理底层文档并刷新 JavaFX 场景\n        if (evt.getPropertyName().equals(FtrVisualFXController.PROP_ELEMENT_MOVED)\
  \ ||\n            evt.getPropertyName().equals(FtrVisualFXController.PROP_DOCUMENT_UPDATED))\
  \ {\n            // 更新文档\n            if (doc != null) {\n                try {\n\
  \                    doc.remove(0, doc.getLength());\n                    doc.insertString(0,\
  \ (String) evt.getNewValue(), null);\n                    Platform.runLater(() ->\n\
  \                        controller.refresh((String) evt.getNewValue()));\n    \
  \            } catch (BadLocationException ex) {\n                    Exceptions.printStackTrace(ex);\n\
  \                }\n            }\n        }\n    }\n}\n```\n\n* * *\n\n### 配置 FXML、CSS\
