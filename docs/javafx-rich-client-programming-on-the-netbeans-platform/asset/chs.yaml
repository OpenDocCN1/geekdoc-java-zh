  \n## 12.8 动态序列\n\n在 NetBeans Platform 向导中，你执行的步骤并不总是相同的。一个面板的用户输入可能会影响看到的下一个面板。处理这种情况，你需要一个具有动态步骤序列的向导。为了说明，让我们创建一个示例向导，引导用户通过多个步骤订购披萨。在第一步中，用户提供姓名。如果是新客户，下一个面板会询问额外的客户详情。对于老客户，用户将跳过新客户面板直接进入订购披萨。在这里客户选择披萨尺寸和配料，以及是自提还是外送。如果用户选择外送，下一步将请求地址、电话号码和信用卡号码。如果用户选择自提，用户将跳过配送信息面板直接进入订单确认面板。注意，此向导有五个步骤，但根据输入，用户会看到三个、四个或五个步骤。图\
  \ 12.26 显示了一个描述此披萨订购流程的活动图。(OEBPS/image7688.jpg)图 12.26 PizzaWizard 活动图图 12.27 显示了\
  \ PizzaWizard 应用程序。该应用程序由两个模块组成：`Customer` 提供使用 map 的极简单客户存储机制，`NewPizza` 是包含 `OrderPizza`\
  \ 向导的模块。(OEBPS/image7694.jpg)图 12.27 PizzaWizard 应用程序和 NewPizza 模块\n\n\n\n\n\n###\
  \ PizzaWizard 示例应用程序\n\n为了演示如何创建一个动态步骤的向导（step wizard），我们将仅展示每个视觉面板和向导面板的部分代码。您可以在书籍的下载包中获取\
  \ PizzaWizard 示例应用程序的完整源代码。\n\n***\n\n在此应用程序中，视觉面板和向导面板类与我们之前在展示“新数字序列”向导时展示的代码非常相似。也就是说，视觉面板由收集输入的图形化组件组成。如果输入需要验证，视觉面板会设置监听器来检测用户输入的变化并触发属性更改事件。向导面板成为视觉面板的属性监听器，并在输入变化时进行验证。验证状态的变化会让向导面板向监听的\
  \ `WizardDescriptor` 触发状态更改事件。随后，`WizardDescriptor` 调用向导面板的 `isValid()` 方法并相应地更新“下一步”（Next）和/或“完成”（Finish）按钮。\n\
  \n如果用户选择“下一步”，`WizardDescriptor`增加面板集合的索引值。如果用户选择“上一步”（Back），`WizardDescriptor`\
  \ 减少面板集合的索引值。\n\n在构建动态步骤向导时，NetBeans Platform 提供了一个 `WizardIterator` 类，该类包含了迭代方法：`current()`（提供当前面板）、`hasNext()`（如果有更多面板则返回\
  \ true）、`hasPrevious()`（如果有之前的面板则返回 true）、`nextPanel()`（增加面板索引号）和 `previousPanel()`（减少面板索引号）。`WizardDescriptor`\
  \ 通过这些方法来执行整个向导流程。`WizardIterator` 维护一个面板的 `ArrayList`，并从该 `ArrayList` 中动态添加或删除面板（即步骤）。它还维护一个独立的\
  \ `String` 数组来存储每个步骤的名称。与 NetBeans Platform 向导的行为一致，当 `WizardIterator` 收到来自某个向导面板的属性更改事件时，它会调整面板\
  \ `ArrayList`。当 `WizardIterator` 对面板 `ArrayList` 进行调整时，它会通知 `WizardDescriptor`。随后，`WizardDescriptor`\
  \ 执行调整（例如在用户点击“下一步”时显示不同的面板）。\n\n### 构建动态步骤向导\n\n让我们从动态 Pizza 向导开始。首先，通过选择目标模块（本例中为\
  \ `NewPizza`）、右键点击并选择 `New | Other` 来启动向导。在类别（Categories）中选择 `Module Development`，并在文件类型（File\
  \ Type）中选择 `Wizard`。点击“下一步”。\n\nNetBeans 显示向导类型（Wizard Type）面板。对于注册类型（Registration\
  \ Type），选择 `Custom`；对于向导步骤序列（Wizard Step Sequence），选择 `Dynamic`；向导面板数量（Number of\
  \ Wizard Panels）指定 `5`。\n\n***\n\n**向导提示**\n当您为步骤序列选择 `Dynamic` 时，面板数量是您的向导所需的面板数量，即使给定的序列使用的面板较少。如果您以后发现需要更多步骤，可以手动添加更多视觉面板和向导面板类。\n\
  \n***\n\n点击“下一步”。指定类名前缀（Class Name Prefix，`Pizza`）并验证项目和包名称是否正确。点击“完成”。\n\n与之前一样，NetBeans\
  \ 为每个面板创建两个类（一个视图和一个控制器）。由于您选择了动态步骤序列，NetBeans 还会创建一个 `WizardIterator` 类。重命名（重构）视觉类和向导类，并为它们赋予意义的类名。请注意，NetBeans\
  \ 不会创建调用向导的动作类（action class），但它提供了用于构建您自己的动作类的代码（带注释）。\n\n***\n\n**向导提示**\n在指定动态步骤序列时，不要给视觉和向导面板类带有步骤数字的名字，因为数字将是不一致的。相反，为这些类赋予描述性名称，正如我们在表\
  \ 12.3 中做的那样。注意，每个类名对应第 599 页图 12.26 中的一个活动。\n\n***\n\n![](img/image7723.jpg)\n\
  **表 12.3 为 NewPizza 向导类提供意义的名称**\n\n现在让我们向您展示带有示例输入的 OrderPizza 向导。我们将用通用术语描述每个面板，并展示每个视觉面板和向导面板的部分代码。\n\
  \n向导从 `IdentifyCustomer` 面板开始。该面板询问客户名称。视觉面板实现 `DocumentListener` 以检测名称文本框的变化。向导面板监听属性更改事件以确保文本框为空。`IdentifyCustomer`\
  \ 向导面板实现了 `AsynchronousValidatingPanel`。因此，当用户点击“下一步”时，向导面板会验证提供的名称代表的是新客户还是老客户。如果是老客户，则跳过后续步骤。否则，用户将进入“新客户”（New\
  \ Customer）面板。\n\n![](img/image7730.jpg)\n**图 12.28 OrderPizza 向导中的 IdentifyCustomer\
  \ 面板**\n\n“新客户”面板询问电话号码（名称从上一个面板填充）。同样，电话文本框组件上的 `DocumentListener` 会在输入更改时通知“新客户”向导面板。向导面板提供验证以确保文本框为空。\n\
  \n![](img/image7736.jpg)\n**图 12.29 OrderPizza 向导中的 NewCustomer 面板**\n\n点击“下一步”后，`WizardDescriptor`\
  \ 进入 `Size and Toppings`（尺寸与配料）面板（BuildPizza 步骤）。\n\n`Size and Toppings` 面板没有验证，但视觉面板根据尺寸、配料和配送选择更新“总计”（Total）。因此，`BuildPizza`\
  \ 视觉面板拥有各种组件的监听器，但它不会触发属性事件。相反，它只是更新 `Total`。如果用户选择“配送”（Delivery），向导将进入“配送信息”（Delivery\
  \ Information）面板。“选择自取”（Pickup）选项将跳过此步骤并直接进入“订单确认”（Order Confirmation）步骤。\n\n![](img/image7742.jpg)\n\
  **图 12.30 OrderPizza 向导中的 BuildPizza 面板**\n\n`Delivery Information` 面板向用户请求地址、电话和信用卡信息。再次，此面板使用\
  \ `DocumentListeners` 监控输入并在输入更改时向监听的向导面板触发属性事件。验证仅确保文本框为空。更真实的应用程序可能会提供电话和信用卡号验证，并确保地址在披萨店的范围内。\n\
  \n![](img/image7747.jpg)\n**图 12.31 OrderPizza 向导中的 DeliveryInformation 面板**\n\n\
  最后一个面板是“订单确认”（Order Confirmation）。当用户勾选“订单确认”（Order Is Confirmed）复选框时，“完成”按钮被启用。`ConfirmOrder`\
  \ 视觉面板监听复选框的变化并触发属性更改事件。如果勾选，向导面板认为该面板有效。通常，当用户点击“上一步”并返回时，面板组件设置会保持。在这种情况下，复选框每次都会重置，强制用户重新确认订单。\n\
  \n![](img/image7752.jpg)\n**图 12.32 OrderPizza 向导中的 ConfirmOrder 面板**\n\n***\n\n\
  **向导提示**\n使用向导面板的 `readSettings()` 方法重置组件的值。`WizardDescriptor` 在显示视觉面板之前调用此方法。\n\
  \n```java\n@Override\npublic void readSettings(WizardDescriptor wiz) {\n    . .\
  \ .\n    // 每次重置 confirmCheckBox 组件\n    getComponent().getConfirmCheckBox().setSelected(false);\n\
  }\n```\n\n\n\n\n### PizzaWizardIterator\n\n现在让我们检查 `PizzaWizardIterator`，如代码列表 12.26`，它构建了一个包含每个步骤名称的\
  \ `steps` `String` 数组。所有步骤名称都显示在每个面板的左侧。我们将这段代码从 `getPanels()` 方法中提取出来，以便在步骤序列更改时单独调用它。\n\
  4. 实现方法 `addChangeListener()` 和 `removeChangeListener()`，以便在步骤序列发生变化时通知 `WizardDescriptor`。\n\
  5. 实现方法 `propertyChange()`。如果源事件属性名称为 `IdentifyCustomerController.PROP_IS_NEW_CUSTOMER`，则我们添加或移除\
  \ `NewCustomer` 面板。如果源事件属性名称为 `BuildPizzaController.PROP_IS_PICKUP`，则我们添加或移除 `DeliveryInformation`\
  \ 面板。请注意，`add()` 方法对 `DeliveryInformation` 面板使用了相对位置定点（它将始终是倒数第二个面板）。因此，当你向列表中添加元素时，无论当前集合中已包含哪些面板，`ArrayList`\
  \ 都能保持一致性。\n6. 实现方法 `fireChangeEvent()`。这让 `WizardDescriptor` 知道序列列表已发生变化。\n\n代码列表\
  \ 12.26 `PizzaWizardIterator.java`——控制向导的步骤点击此处此处查看代码图像\n\n```java\npublic final\
  \ class PizzaWizardIterator implements\n        WizardDescriptor.Iterator<WizardDescriptor>,\n\
  \        PropertyChangeListener {\n    private int index;\n    private List<WizardDescriptor.Panel<WizardDescriptor>>\
  \ panels; // 为面板设置变量名，以便根据需要添加/移除它们\n    IdentifyCustomerController icc = new IdentifyCustomerController();\n\
  \    NewCustomerController ncc = new NewCustomerController();\n    BuildPizzaController\
  \ bpc = new BuildPizzaController();\n    DeliveryInfoController delic = new DeliveryInfoController();\n\
  \    ConfirmOrderController confoc = new ConfirmOrderController();\n\n    private\
  \ List<WizardDescriptor.Panel<WizardDescriptor>> getPanels() {\n        if (panels\
  \ == null) {\n            panels = new ArrayList<WizardDescriptor.Panel<WizardDescriptor>>();\n\
  \            panels.add(icc);\n            panels.add(ncc);\n            panels.add(bpc);\n\
  \            panels.add(delic);\n            panels.add(confoc);\n            //成为\
  \ IdentifyCustomerController 和\n            // BuildPizzaController 的 ChangeListener\n\
  \            icc.addPropertyChangeListener(this);\n            bpc.addPropertyChangeListener(this);\
  \              \n            updateSteps();\n        }\n        return panels;\n\
  \    }\n\n    private void updateSteps() {\n        String[] steps = new String[panels.size()];\n\
  \        for (int i = 0; i < panels.size(); i++) {\n            Component c = panels.get(i).getComponent();\n\
  \            // 默认步骤名称为面板的组件名称\n            steps[i] = c.getName();\n          \
  \  if (c instanceof JComponent) { // 假设为 Swing 组件\n                JComponent jc\
  \ = (JComponent) c;\n                jc.putClientProperty(WizardDescriptor.PROP_CONTENT_INDEX,\
  \ i);\n                jc.putClientProperty(WizardDescriptor.PROP_CONTENT_DATA,\
  \ steps);\n                jc.putClientProperty(WizardDescriptor.PROP_AUTO_WIZARD_STYLE,\
  \ true);\n                jc.putClientProperty(WizardDescriptor.PROP_CONTENT_DISPLAYED,\
  \ true);\n                jc.putClientProperty(WizardDescriptor.PROP_CONTENT_NUMBERED,\
  \ true);\n            }\n        }\n    }\n\n    @Override\n    public WizardDescriptor.Panel<WizardDescriptor>\
  \ current() {\n        return getPanels().get(index);\n    }\n\n    @Override\n\
  \    public String name() {\n        return index + 1 + \" out of \" + getPanels().size();\n\
  \    }\n\n    @Override\n    public boolean hasNext() {\n        return index <\
  \ getPanels().size() - 1;\n    }\n\n    @Override\n    public boolean hasPrevious()\
  \ {\n        return index > 0;\n    }\n\n    @Override\n    public void nextPanel()\
  \ {\n        if (!hasNext()) {\n            throw new NoSuchElementException();\n\
  \        }\n        index++;\n    }\n\n    @Override\n    public void previousPanel()\
  \ {\n        if (!hasPrevious()) {\n            throw new NoSuchElementException();\n\
  \        }\n        index--;\n    }\n\n    private final EventListener listeners\
  \ = new EventListenerList();\n\n    @Override\n    public void addChangeListener(ChangeListener\
  \ l) {\n        listeners.add(ChangeListener.class, l);\n    }\n\n    @Override\n\
  \    public void removeChangeListener(ChangeListener l) {\n        listeners.remove(ChangeListener.class,\
  \ l);\n    }\n\n    @Override\n    public void propertyChange(PropertyChangeEvent\
  \ pce) {\n        if (pce.getPropertyName().equals(IdentifyCustomerController.PROP_IS_NEW_CUSTOMER))\
  \ {\n            if (icc.isIsNewCustomer()) {\n                panels.add(1, ncc);\n\
  \            } else {\n                panels.remove(ncc);\n            }\n    \
  \        updateSteps();\n            fireChangeEvent(this, 0, 1);\n        } else\
  \ if (pce.getPropertyName().equals(BuildPizzaController.PROP_IS_PICKUP)) {\n   \
  \         if (bpc.isIsPickup()) {\n                panels.remove(delic);\n     \
  \       } else {\n                panels.add(panels.size() - 1, delic);\n      \
  \      }\n            updateSteps();\n            fireChangeEvent(this, 0, 1);\n\
  \        }\n    }\n\n    protected final fireChangeEvent(Object source, int oldState,\
  \ int newState) {\n        if (oldState != newState) {\n            ChangeEvent\
  \ ev = new ChangeEvent(source);\n            for (ChangeListener listener : listeners.getListeners(ChangeListener.class))\
  \ {\n                listener.stateChanged(ev);\n            }\n        }\n    }\n\
  }\n```\n\n\n\n\n\n# 识别客户面板 (IdentifyCustomer Panel)\n\n`IdentifyCustomer` 面板会动态更改步骤顺序。让我们来看看此控制器类是如何参与步骤顺序变化的。\n\
  \n类 `IdentifyCustomerController` 实现 `WizardDescriptor.AsynchronousValidatingPanel`。当用户点击“下一步”（Next）时，`validate()`\
  \ 方法将判断提供的客户名称代表老客户还是新客户。由于这会影响顺序，`validate()` 方法会向 `PizzaWizardIterator` 发送属性更改事件。\n\
