  \ 实现添加到 `FamilyTreeVisualElement` 的 `Lookup` 中，可以在视觉视图拥有焦点时启用应用程序工具栏中的 `AddNameAction`。`drop()`\
  \ 方法将提供的文本插入底层文档，并调用 `refreshLines()` 来重建视图。（列表 14.15 位于第 702 页显示 `refreshLines()`\
  \ 方法。）\n\n**列表 14.19 FamilyTreeVisualElement—实现 Droppable**\n点击此处查看代码图片\n\n```java\n\
