  \n如果能减少这些验证代码该有多么好？幸运的是，有一个通用的验证库专门用于此类类型的输入验证。该库由 NetBeans 闻闻的 Tim Boudreau 创建，名为\
  \ `Simple Validation API`，它是开源的并包含在 NetBeans 的分发包中。在本节中，我们将向你展示如何在 NetBeans Platform\
  \ 应用程序中使用该验证库。作为一个示例，我们将在“新数字序列”（New Number Sequence）向导中使用该库。\n\n## 准备使用验证库\n\n\
  要在 NetBeans Platform 应用程序中使用 `Simple Validation API`，你需要为 `JAR` 文件创建一个库包装器。当你将 `JAR`\
  \ 文件添加到应用程序时，NetBeans 会为你完成操作，步骤如下：\n\n1. 在 Projects（项目）窗口中，选择应用程序 `WizardExample`，右键点击并选择\
  \ `Add Existing Library . . .`（添加现有库）。\n2. 在 Select Library（选择库）对话框中，点击 `Browse`（浏览）。导航到\
  \ `NetBeans/ide/modules/ext/ValidationAPI.jar` 并点击 `Select`。回到 Select Library 对话框，如图\
  \ 12.18 所示，点击 `Next`。(OEBPS/image7446.jpg) 图 12.18 创建新的库包装器模块项目。\n3. 在 Name and\
  \ Location（名称和位置）对话框中，确保项目名称和目录位置正确，并点击 `Next`，如图 12.19 所示。(OEBPS/image7451.jpg)\
  \ 图 12.19 名称和位置对话框。\n4. 在 Basic Module Configuration（基本模块配置）对话框中提供一个 `Code Name\
  \ Base`（代码名称基），点击 `Finish`（完成）。NetBeans 会创建模块 `ValidationAPI` 并将其添加到你的项目中，如图 12.20\
  \ 所示。(OEBPS/image7457.jpg) 图 12.20 模块 `ValidationAPI` 是一个封装过的 `JAR` 文件。\n5. 在模块\
  \ `Sequence` 中添加对 `Validation API` 的新依赖。现在你可以在此模块中使用该库了。\n\n按照以下步骤扩展 Swing 组件调板：\n\
  \n1. 在 NetBeans IDE 中，确保组件设计调板（design palette）已打开。在设计调板内部右键点击，从上下文菜单中选择 `Palette\
  \ Manager`（调板管理器）。\n2. 选择按钮 `Add from JAR`（从 JAR 添加），并浏览到相同的 `ValidationAPI.jar`。点击\
  \ `Next`。\n3. 从组件列表中选择 `ValidationPanel` 并点击 `Next`。\n4. 选择 `Swing Containers`（Swing\
  \ 容器）并点击 `Finish`。这会将 `Validation Panel` 组件添加到调板中的 `Swing Containers` 类别下。通过此扩展，你可以将\
  \ `Validation Panels` 拖放到 Swing UI 中。\n\n## 使用 Simple Validation API 库\n\n要使用该验证库，你必须向你的\
  \ Swing UI 添加 `Validation Panel` 组件。`Validation Panels` 允许你指定哪些验证器适用于哪些输入组件。它们还提供了一种显示错误消息的方便方法。通常，你会使用\
  \ `Validation Panels` 来验证 `JTextField` 组件的输入。\n\n表 12.2 显示了来自验证库的十个实用的验证器（还有更多）。当你为特定组件指定一个或多个验证器时，验证将按照你添加它们的顺序进行。例如，要对整数输入进行验证，你可以将\
  \ `REQUIRE_NON_EMPTY_STRING`、`NO_WHITESPACE` 和 `REQUIRE_VALID_INTEGER` 链在一起。注意，顺序很重要。每个验证器都会被调用，直到发生问题或列表耗尽。首先检查空字符串可以让用户的错误信息更清晰。(OEBPS/image7471.jpg)\
  \ 表 12.2 十个实用的验证器。\n\n在这些验证器不适用的情况下，你可以构建自定义验证器。稍后我们将向你如何这样做。\n\n让我们从为第一个视觉面板 `NumberVisualPanel1`\
  \ 中的 `firstNumber` 字段添加验证开始。\n\n1. 在设计（Design）视图中打开 `NumberVisualPanel1`。\n2. 从调板中选择\
  \ `ValidationPanel` 并将其拖放到 `JTextField` 下方的视觉面板上。这添加了组件 `validationPanel1`。\n3.\
  \ 进入源码（Source）视图，并将列表 12.12 所示的代码添加到 `NumberVisualPanel1.java` 中。验证配置从 `validationPanel1`\
  \ 开始。从 `validationPanel1` 我们首先获取一个 `ValidationGroup` 对象。然后我们为验证分配目标组件并添加验证器。在这里，我们添加验证器来验证输入不为空、不包含空格、是一个有效的整数并且是非负数。我们还确保整数在指定的最小值和最大值之间。\n\
  \n我们修改了 `firstNumber` 的 `DocumentListener`，以调用 `checkValidation()` 方法，该方法包含了对 `group.validateAll()`\
  \ 的调用。我们还重写了 `isValid()`，以便 `NumberPanel1` 知道输入是否有效。当输入变化时，我们仍会触发事件。列表 12.12 添加到\
  \ NumberVisual1 点击此处查看图像 所示：\n\n```java\npublic final class NumberVisual1 extends\
