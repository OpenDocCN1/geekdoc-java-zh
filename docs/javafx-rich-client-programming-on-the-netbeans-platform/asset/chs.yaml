  \ API，它提供了 Nodes API 和 File System API 之间的握手支持。以下是本章的要点：\n\n*   `DataObject` 类封装了一个\
  \ `FileObject` 并创建一个节点，允许您在 `Explorer View`（资源管理器视图）中可视化文件。\n*   `DataObject` 的节点可能表示一个多级节点层次结构，其中子节点取决于文件的内容。\n\
  *   `FileObjects` 注册了 MIME 类型和 `DataLoaders`，后者是创建 `DataObjects` 的工厂。\n*   `DataObjects`\
  \ 拥有一个 `Lookup`，用于持有与文件关联的能力（例如编辑器）。\n*   当创建一个新的文件类型时，`New File Type`（新建文件类型）向导会为该文件类型注册\
  \ MIME 类型解析器、`DataLoader`、文件模板和 `DataObject` 子类型。\n*   在 `New File Type` 向导中，使用\
  \ `MultiView` 复选框生成一个与文件类型关联的 `MultiView` 编辑器。`MultiView` 窗口是一个包含多个窗口的 `TopComponent`，可以通过工具栏按钮进行选择。默认是\
  \ `Source`（用于文本编辑器）和 `Visual`（用于基于 Swing JComponent 的视图）。\n*   `MultiViewElements`\
  \ 具有类似于 `TopComponent` 生命周期的生命周期方法。您通过重写这些方法来控制视图的初始化和刷新。\n*   `New File Type` 向导会创建一个默认模板，在创建该类型的新类型文件时生成内容。您可以自定义该模板。\n\
  *   使用与文件关联的 `DataObject` 类型用于 `Cookie Class`，以创建一个与文件类型关联的条件启用操作。若要将该操作包含在文件的 `Explorer\
  \ View` 上键菜单中，请勾选 `File Type Context Menu Item` 复选框并指定其 MIME 类型。\n*   重写 `DataObject`\
  \ 的 `createNodeDelegate()` 方法以提供自定义的节点层次结构。安装 `FileChangeListener` 以保持节点层次结构与底层文件同步。\n\
  *   使用 `Swing`、`Visual Library` 或 `JavaFX` 为 `MultiView` 视觉窗口创建内容。\n*   通过对任何编辑更新底层文档来保持视图同步。您通过\
  \ `DataObject` 的 `EditorCookie` 访问文档，该 Cookie 通过其 `Lookup`get。\n*   `Visual Library`\
  \ 允许您构建具有可选、可移动和可修改图形组件（称为 `widgets`）的 `Scenes`。`Scene` 是根元素，并创建一个 Swing 兼容的 `JComponent`\
  \ 视图，您可以将其添加到 `Swing JPanel` 中。\n*   为组件添加操作以提供新行为，例如编辑内容。\n*   要添加一个当特定视觉元素获得焦点时启用的操作，请创建一个能力并将其添加到视觉元素的\
  \ `Lookup` 中。该条件启用操作依赖于此能力。使用 `InstanceContent`、`AbstractLookup` 和 `ProxyLookup`\
  \ 正确配置视觉元素的 `Lookup`。\n*   要构建带有 `JavaFX` 内容的视觉元素，请使用保持 `JavaFX` 和 `Swing` 代码松耦合的集成策略。\n\
  *   `Swing` 视觉元素与 `JavaFX` 控制器之间的单向通信会在 `JavaFX Application Thread` 上调用公共 JavaFX\
  \ 控制器方法。使用属性更改事件将 `JavaFX` 场景图中由用户发起的更改传回视觉元素。\n*   带有特定根元素创建新的 XML 文件类型。\n*   `NetBeans\
  \ Platform` 包含一个功能完整的 XML 编辑器。要在您的 `NetBeans Platform` 应用程序中使用它，请包含来自 `ide cluster`\
  \ 的模块。\n*   使用 `NetBeans Platform XMLUtil` 类操作 XML 内容。`XMLUtil.parse()` 方法从 XML\
  \ 文件构建 DOM 文档。\n*   通过解析文件并获取特定标签名称的 DOM `NodeList` 根据 XML 内容构建节点层次结构。\n\n# 15 JavaFX\
  \ 图表\n\n在 `JavaFX` 之前，`Swing` 开发者必须依赖第三方库的图表组件。现在 `JavaFX` 已经是 JDK 的一部分，开发者可以使用\
  \ `JavaFX Charts API` 在应用程序中实现数据可视化。通过 `NetBeans Platform`，您既可以拥有 `JavaFX` 图表的美感，又拥有复杂框架的架构优势，让您能够构建集成\
  \ `JavaFX` 和 `Swing` 内容应用程序。\n\n本章将向您展示如何结合 `NetBeans Platform` 使用 `JavaFX Charts\
  \ API`。您将学习如何创建模块化、松耦合的应用程序，在单独窗口中以各种图表类型显示数据。您还将学习如何应用 `JavaFX` 特性（如动画、特效和事件处理）来增强您的应用程序。\n\
  \n### 您将学习到\n\n*   在 `NetBeans Platform` 应用程序中使用 `JavaFX` 图表。\n*   构建显示图表数据的模块。\n\
  *   构建具有多个图表窗口的 `NetBeans Platform` 应用程序，保持图表模块和数据的松耦合。\n*   为模块创建服务提供程序，以便从 `Global\
  \ Services Lookup` 访问图表数据。\n*   探索每个 `JavaFX` 图表。\n*   使用 CSS 为 `JavaFX` 图表建模。\n\
  *   为图表或图表内的单个显示元素添加特效、动画和事件处理器。\n*   在 `Swing JTable` 或 `JavaFX` 图表窗口中启用数据编辑，并将这些数据更改到整个应用程序。\n\
  *   使用绑定（binding）保持 `JavaFX` 控件同步。\n*   创建一个适用于 `JavaFX` 图表窗口的 `NetBeans Platform`\
  \ 条件启用操作。\n*   将图表窗口（或任何带有 `JavaFX` 内容的窗口）保存为 PNG 格式文件。\n*   打印 `TopComponent` 窗口。\n\
  \n## 15.1 JavaFX 图表与 NetBeans Platform\n\n让我们首先在 `NetBeans Platform` 应用程序的背景下展示\
  \ `JavaFX` 图表。`JavaFX Chart` 包提供了八种不同的图表来可视化数据。我们的示例 `SmartPhone Data` 应用程序提供了过去四内智能手机公司的销售数据。每家公司的数据由表格中的行表示，每年的数据对应表格的列。\n\
  \n在讨论 `JavaFX` 如何处理图表数据之前，让我们描述该应用程序及其功能。\n\n图 15.1 显示了运行中的 `SmartPhone Data` 应用程序（称为\
  \ SDA）。共有十个窗口。九个窗口包含 `JavaFX` 图表，第十个窗口以表格形式显示原始数据。您可以编辑表格中的数据，编辑内容将传播到其他图表窗口。当您更改\
  \ `JavaFX` 图表数据时，图表使用动画重绘其内容。这些更改还可以重新定位图例并缩放图表。\n\n(OEBPS/image9251.jpg) 图 15.1\
  \ SmartPhone Data 应用程序：使用 JavaFX 图表。\n\n图 15.1 可视图表窗口包括左侧的饼图（Pie Chart）、中间的柱状图（Bar\
  \ Chart）和右侧的折线图（Line Chart）。\n\n`JavaFX` 图表被渲染为场景中的节点。这意味着您可以为图表应用特效和动画。图 15.2 显示了两个饼图示例。左侧窗口描绘了一个选中的扇区正在向外动画。选中扇区的百分比显示在动画淡入的标签中。右窗口显示了一个显示选中扇区值的\
  \ `JavaFX TextField`。当点击饼区事件时，TextField 出现。当用户提供新数字时，更改更新其他图表和表格。\n\n(OEBPS/image9257.jpg)\
  \ 图 15.2 具有动画扇区和编辑能力的饼图。\n\n图 15.3 显示了另一组窗口，包括左侧的水平柱状图（Bar Chart）、中间的气泡图（Bubble\
  \ Chart）和右上角的面积图（Area Chart）。\n\n(OEBPS/image9262.jpg) 图 15.3 具有不同图表的 SmartPhone\
  \ Data 应用程序。用户可以在 `TableDataEditor` 窗口或饼图窗口编辑原始数据。用户还可以通过 `Reload Data` 按钮恢复原始数据、打印图表窗口或将任何图表保存到磁盘。\n\
  \n### 概述\n\n`SDA` 被组织为模块，每个图表在一个模块中。`TableDataEditor` 位于自己的模块。每个模块通过 `Global Lookup`\
  \ 使用 `Swing AbstractTableModel` 的自定义版本（`MyTableDataModel`）访问数据。要处理不同的数据集，可以扩展 `MyTableDataModel`\
  \ 并包含自己的数据。`MyTableDataModel` 的不同服务提供程序可以从其他源（例如 Web 服务或数据库）获取数据。\n\n图 15.4 显示了\
  \ `SDA` 中模块之间的关系。\n\n(OEBPS/image9269.jpg) 图 15.4 SmartPhone Data 应用程序组织\n\n`TableDataAPI`\
  \ 模块暴露了 `MyTableDataModel`，其他模块通过 `Global Lookup` 访问该特殊的 `TableModel` 类。`TableDataEditor`\
  \ 显示一个表格形式的数据窗口。每个图表模块通过 `Global Lookup` 获取 `MyTableDataModel` 的服务提供程序来访问数据。`JavaFX`\
  \ 图表模块都使用 `FXML` 用于控件以及构建图表数据的 JavaFX 控制器类。当数据发生变化时，模型实现触发 `Swing TableEvent`，允许注册的监听器做出响应。每个\
  \ JavaFX 控制器类实现 `TableModelListener` 以响应用户对表格数据的编辑。\n\n### 构建 SmartPhone Data 的步骤\n\
  \n让我们总结构建 `SmartPhone Data`应用程序所需的步骤。总结的应用程序结构向您展示了 `NetBeans Platform` 应用程序如何有效使用\
  \ `JavaFX` 图表控件来实现可视化。我们将在整个章节中详细讨论各个模块。\n\n*   创建一个名为 `SmartPhoneDataApp` 的新 `NetBeans\
  \ Platform` 应用程序。\n*   创建一个 `TableDataAPI` 模块并将其添加到 `SmartPhoneDataApp` 应用程序中。创建抽象\
  \ Java 类 `MyTableDataModel` 以扩展 `AbstractTableModel`。将 `MyTableDataModel` 所在的包公开，以便其他模块向\
  \ `TableDataAPI` 模块添加模块依赖。\n*   创建一个 `SmartPhoneDataImpl` 模块并设置对 `TableDataAPI`\
  \ 模块的模块依赖。创建一个扩展 `MyTableDataModel` 的具体 Java 类 `SmartPhoneDataImpl`。安装数据并为 `AbstractTableModel`\
  \ 和 `MyTableDataModel` 中的方法提供实现。将 `SmartPhoneDataImpl` 注册为 `MyTableDataModel` 的\
  \ `@ServiceProvider`。\n*   创建一个 `TableDataEditor` 模块并设置对 `TableDataAPI` 模块的模块依赖。创建一个\
  \ `TopComponent` 窗口。添加 `JTable` 和 `Reload Data` 按钮。使用 `Global Lookup` 初始化 `JTable`\
  \ 以访问数据。\n*   为每个图表创建模块。包括垂直和水平显示的柱状图模块。设置对 `TableDataAPI` 模块的模块依赖。为每个模块创建 `TopComponent`\
  \ 窗口、FXML 文件和对应的 JavaFX 控制器类。使用 `Global Lookup` 初始化 `JavaFX` 控件。启用 `TopComponent`\
  \ 的打印功能。\n*   根据喜好为 JavaFX 控制器类添加特殊行为。我们将讨论添加到 `PieChart` 模块的功能。\n*   创建一个 `ChartUtilities`\
  \ 模块并添加一个条件启用操作，将选中的图表窗口保存到磁盘文件。在每个 `TopComponent` 中实现 `ChartSaveCapability` 以提供保存图表的支持代码。\n\
  \n\n\n\n\n```java\npublic abstract class MyTableDataModel extends AbstractTableModel\
  \ {\n\n    public abstract Object[][] getOriginalData();\n    public abstract double\
  \ getTickUnit();\n    public abstract List<String> getColumnNames();\n    public\
  \ abstract List<String> getCategoryNames();\n    public abstract int getCategoryCount();\n\
  \    public abstract String getCategoryName(int row);\n    public abstract String\
  \ getDataDescription();\n    public abstract String getNameDescription();\n    public\
  \ abstract String getTitle();\n}\n```\n\n列表 15.2 显示了 `SmartPhoneDataImpl` 类，它提供了\
  \ `MyTableDataModel` 抽象类的具体扩展。我们在 `SmartPhoneDataImpl` 模块中安装了该类，并将该类注册为 `MyTableDataModel`\
  \ 的服务提供者。`names` 和 `categories` `String` 数组为数据列和类别名称提供了标签。同样，`dataDescription` 和\
  \ `nameDescription` `Strings` 提供了图例标签。`title` `String` 提供了标题文本。实际数据是一个供 `TableModel`\
  \ 使用的二维 `Object` 数组。`clone()` 方法对原始数据进行深拷贝，以备以后检索。\n\n`SmartPhoneDataImpl` 类实现了\
  \ `MyTableDataModel` 中的 `public` 方法（参见列表 15.1）以及 `AbstractTableModel` 需的方法。`isCellEditable()`\
  \ 方法返回 `true`，允许用户更新。`setValueAt()` 方法更新数据并触发表格单元格更新事件。（`AbstractTableModel` 类处理了监听器的注册和事件分发。）由于数据是为\
  \ Swing `TableModel` 配置的，Swing `JTable` 组件可以直接使用此类。然而，JavaFX 图表需要提取数据并将其注入到所需的 JavaFX\
  \ 图表观察集合中。手机销售数据来源：2008 年：Gartner（2009 年 3 月）；2009 年：Tomi Ahonen（2010 年 4 月）；2010\
  \ 年和 2011 年：IDC（2012 年 2 月）。\n\n列表 15.2 SmartPhoneDataImpl.java\n\n```java\n@ServiceProvider(service\
  \ = MyTableDataModel.class)\npublic class SmartPhoneDataImpl extends MyTableDataModel\
  \ {\n\n    private final String[] names = {\"2008\", \"2009\", \"2010\", \"2011\"\
  };\n    private final String[] categories = {\"Nokia\", \"RIM\", \"Apple\", \"HTC\"\
  , \"Samsung\", \"Others\"};\n    private final String dataDescription = \"Units\
  \ Sold in Millions\";\n    private final String nameDescription = \"Year\";\n  \
  \  private final String title = \"Smart Phone Sales\";\n    private final Object[][]\
  \ data = {\n        // Sources:\n        // 2008: Gartner (March 2009)\n       \
  \ // 2009: Tomi Ahonen (April 2010)\n        // 2010, 2011: IDC (February 2012)\n\
  \        // Nokia\n        {61.0, 68.0, 100.1, 77.3},\n        // ResearchInMotion\n\
  \        {23.1, 37.0, 48.8, 51.1},\n        // Apple\n        {11.4, 25.0, 47.5,\
  \ 93.2},\n        // HTC\n        {5.9, 9.0, 21.7, 43.5},\n        // Samsung\n\
  \        {4.0, 7.0, 22.9, 94.0},\n        // Others\n        {33.9, 30.0, 63.7,\
  \ 132.3}\n    };\n\n    private final Object[][] orig = clone(data); // provide\
  \ deep copy semantics\n\n    private static Object[][] clone(Object[][] g) {\n \
  \       Object[][] newArray = new Object[g.length][];\n        for (int i = 0; i\
  \ < g.length; i++) {\n            newArray[i] = new Object[g[i].length];\n     \
  \       System.arraycopy(g[i], 0, newArray[i], 0, g[i].length);\n        }\n   \
  \     return newArray;\n    }\n\n    @Override\n    public final Object[][] getOriginalData()\
  \ {\n        return orig;\n    }\n\n    @Override\n    public double getTickUnit()\
  \ {\n        return 1000;\n    }\n\n    @Override\n    public List<String> getColumnNames()\
  \ {\n        return Arrays.asList(names); // Add for Category Names\n    }\n\n \
  \   @Override\n    public List<String> getCategoryNames() {\n        return Arrays.asList(categories);\n\
  \    }\n\n    @Override\n    public int getCategoryCount() {\n        return getRowCount();\n\
  \    }\n\n    @Override\n    public String getCategoryName(int row) {\n        return\
  \ categories[row];\n    }\n\n    @Override\n    public String getDataDescription()\
  \ {\n        return dataDescription;\n    }\n\n    @Override\n    public String\
  \ getNameDescription() {\n        return nameDescription;\n    }\n\n    @Override\n\
  \    public String getTitle() {\n        return title;\n    }\n\n    @Override\n\
  \    public int getRowCount() {\n        return data.length;\n    }\n\n    @Override\n\
  \    public int getColumnCount() {\n        return names.length;\n    }\n\n    @Override\n\
  \    public Object getValueAt(int row, int column) {\n        return data[row][column];\n\
  \    }\n\n    @Override\n    public String getColumnName(int column) {\n       \
  \ return names[column];\n    }\n\n    @Override\n    public Class<?> getColumnClass(int\
  \ columnIndex) {\n        return getValueAt(0, columnIndex).getClass();\n    }\n\
  \n    @Override\n    public boolean isCellEditable(int row, int column) {\n    \
  \    return true;\n    }\n\n    @Override\n    public void setValueAt(Object value,\
  \ int row, int column) {\n        if (value instanceof Double) {\n            data[row][column]\
  \ = (Double) value;\n        }\n        fireTableCellUpdated(row, column);\n   \
  \ }\n}\n```\n\n### 与 Swing JTable 交互\n\n`TableDataEditor` 模块包含一个在输出模式下配置的 `TopComponent`。该窗口出现在右下角，如第\
  \ 745 页图 15.1 所示。`TopComponent` 包含一个显示原始数据的 Swing `JTable` 和一个 `Data Reload`（重载数据）按钮，用于从克隆数组恢复原始数据值。\n\
  \n列表 15.3 显示了 `TableEditorTopComponent` 类的 `TopComponent` 注册和初始化代码。构造函数从全局查找（Global\
