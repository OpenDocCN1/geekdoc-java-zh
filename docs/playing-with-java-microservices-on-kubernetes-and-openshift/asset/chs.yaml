  \ `Services` 中实现的操作作为 REST Web 服务暴露出来。\n\n在 Spring 框架中，可以使用 `RestController` 实现\
  \ REST Web 服务。\n\n工具类 `Web`：\n\n```java\npublic class Web {\n    public static final\
  \ String API = \"/api\";\n}\n```\n\n### 典型的 RestController: CartResource\n\n`CartResource`\
  \ 将如下：\n\n```java\n@RequiredArgsConstructor <1>\n@RestController <2>\n@RequestMapping(API\
  \ + \"/carts\") <2>\npublic class CartResource {\n\n    private final CartService\
  \ cartService;\n\n    @GetMapping\n    public List<CartDto> findAll() { <3>\n  \
  \      return this.cartService.findAll();\n    }\n\n    @GetMapping(\"/active\"\
  )\n    public List<CartDto> findAllActiveCarts() {\n        return this.cartService.findAllActiveCarts();\n\
  \    }\n\n    @GetMapping(\"/customer/{id}\")\n    public CartDto getActiveCartForCustomer(@PathVariable(\"\
  id\") Long customerId) {\n        return this.cartService.getActiveCart(customerId);\n\
  \    }\n\n    @GetMapping(\"/{id}\")\n    public CartDto findById(@PathVariable\
  \ Long id) {\n        return this.cartService.findById(id);\n    }\n\n    @PostMapping(\"\
  /customer/{id}\")\n    public CartDto create(@PathVariable(\"id\") Long customerId)\
  \ {\n        return this.cartService.create(customerId);\n    }\n\n    @DeleteMapping(\"\
  /{id}\")\n    public void delete(@PathVariable Long id) {\n        this.cartService.delete(id);\n\
  \    }\n\n}\n```\n\n1. Lombok 注解用于生成 `Required-Args-Constructor`。我们使用它来 get 依赖注入。\n\
  2. `@RestController` 和 `@RequestMapping(\"/api/carts\")` 用于将 `CartResource` 类声明为可以通过\
  \ `http://SERVER_URL:SERVER_PORT/api/carts` 访问的 REST Web 服务。\n3. 我们返回 `CartDto`\
  \ 对象作为 REST Web 服务的响应，因此当调用时，Spring Boot 将使用 Jackson 将该对象序列化为 JSON。\n\n在此 `RestController`\
  \ 中，我们声明了：\n\n* 列出所有 `Carts`：对 `/api/carts` 执行 `HTTP GET`。\n* 列出活跃的 `Cart`s：对 `/api/carts/active`\
  \ 执行 `HTTP GET`。\n* 列出特定客户的活跃 `Cart`：对 `/api/carts/customer/{id}` 执行 `HTTP GET`，其中\
  \ `{id}` 是客户 ID 的占位符。\n* 列出某个 `Cart` 的所有详情：对 `api/carts/{id}` 执行 `HTTP GET`，其中 `{id}`\
  \ 是购物车 ID 的占位符。\n* 为某个给定的 `Customer` 创建新的 `Cart`：对 `/api/carts/customer/{id}` 执行\
  \ `HTTP POST`，其中 `{id}` 是客户 ID 的占位符。\n* 删除一个 `Cart`：对 `/api/carts/{id}` 执行 `HTTP\
  \ DELETE`，其中 `{id}`。\n\n这些操作将使用 `SWAGGER` API 框架进行描述。API 说明将自动生成。我们稍后会讨论这一点。\n\n\
