  \n我们的微服务正在使用 **Spring Boot Actuator** 库来暴露运行应用程序的操作信息（健康状况、指标等）。\n\n**Spring Boot\
  \ Actuator** 暴露了一些实用的端点，其中一个是 `/health` 端点，它在**正常**时返回 `UP`，在出现问题时返回 `DOWN`。\n\n\
  Kubernetes 已经有了处理操作信息的思路。Kubernetes 有两种探针 `ReadinessProbe` 和 `LivenessProbe`：\n\n\
  *   `ReadinessProbe` 用于判断容器是否准备好处理流量。当所有的容器都就绪时，Pod 才被认为就绪。该信号的一个用途是控制哪些 Pod 用于后端。当\
  \ Pod 不就绪时，它将从 Service 中移除。\n\n*   `LivenessProbe` 用于判断何时重启容器。例如，存活探针可以检测死锁，即应用程序正在运行但无法进展。在这种状态下重启容器有助于提高应用的可用性。\n\
  \n存活和就绪探针是确保应用程序在 Kubernetes 集群中保持健康的良好方法。\n\n**当 Actuator 进入 Kubernetes 领地时发生了什么变化？**\n\
  \n解决方案是将存活和就绪探针与 Actuator 的 `health` 端点配对。这将保证我们的 Spring Boot/Cloud 应用与 Kubernetes\
  \ 集群之间高度的一致性。\n\n\n\n\n\n此任务由我们强大的 `f8mp` 插件自动完成：在生成 `deployment.yaml` 文件时，生成器会添加指向应用程序中扫描属性的\
  \ Kubernetes 存活（liveness）和就绪（readiness）探测。当生成器检测到 `spring-boot-starter-actuator`\
  \ 依赖时，f8mp 增强器将为 Spring Boot 添加 Kubernetes 就绪和存活探测。\n\n如果我们检查由 `f8mp` 插件生成的 Kubernetes\
  \ 资源描述符，可以看到其中包含了就绪和存活探测：\n\n```\napiVersion: extensions/v1beta1\nkind: Deployment\n\
  ...\nspec:\n...\n  template:\n...\n    spec:\n      containers:\n      - env:\n\
  \        ...\n        livenessProbe:\n          httpGet:\n            path: /actuator/health\n\
  \            port: 8080\n            scheme: HTTP\n          initialDelaySeconds:\
  \ 180\n        ...\n        readinessProbe:\n          httpGet:\n            path:\
  \ /actuator/health\n            port: 8080\n            scheme: HTTP\n         \
  \ initialDelaySeconds: 10\n...\n```\n\n`target/classes/META-INF/fabric8/kubernetes/deployment.yml`\n\
  \n太棒了！让我们进入下一个模式！\n\n## API 网关 (API Gateway)\n\nAPI 网关是一个编程面层，它位于 API 之前，作为一组定义微服务的单一入口。\n\
  \n在实现 API 网关时，我们使用了 **Spring Cloud Netflix Zuul**。但哪种 Kubernetes 功能可以替代它呢？\n\nKubernetes\
  \ Ingress 管理对集群内服务的外部访问（通常是 HTTP）。Ingress 可以提供负载均衡、SSL 终端终止和基于域名的虚拟托管。\n\n![](img/app-container-pod-svc-ingress.png)\n\
  \n### 使用 Ingress 暴露服务\n\nIngress 是规则的集合，允许入站连接到达集群服务。它可以配置为服务提供外部可访问的 URL、进行流量负载均衡、终止\
  \ SSL、提供基于域名的虚拟托管等。用户通过向 API 服务器 POST Ingress 资源来请求 Ingress。Ingress 控制器负责实现 Ingress，通常通过负载均衡器实现，但它也可以配置您的边缘路由器或额外的前端，以帮助以高可用（HA）的方式处理流量。\n\
  \n让我们把 Api 网关引入 Kubernetes ：\n\n### 第 1 步：删除旧的 ApiGateway 微服务\n\n正如我们处理 Eureka 和\
  \ Config Server 时所做的，我们将完全删除 ApiGateway 微服务 :D Kubernetes 已经提供了我们可以利用的 Ingress 资源来实现\
  \ API 网关模式。\n\n### 第 2 步：创建 ApiGateway Ingress\n\n我们的 Ingress 将指向我们的 3 个微服务：\n\n\
  *   `ProductService`\n*   `OrderService`\n*   `CustomerService`\n\n我们需要为 ingress\
  \ 准备一个域名；假设我们已经有了 `myboutique.io` 域名。\n\n我们的 Ingress 描述符将如下：\n\n```\napiVersion:\
  \ extensions/v1beta1\nkind: Ingress\nmetadata:\n  name: api-gateway\n  annotations:\n\
  \    nginx.ingress.kubernetes.io/rewrite-target: /\nspec:\n  backend:\n    serviceName:\
  \ default-http-backend\n    servicePort: 80\n  rules:\n  - host: myboutique.io\n\
  \    http:\n      paths:\n      - path: /product\n        backend:\n          serviceName:\
  \ product-service\n          servicePort: 8080\n      - path: /order\n        backend:\n\
  \          serviceName: order-service\n          servicePort: 8080\n      - path:\
  \ /customer\n        backend:\n          serviceName: customer-service\n       \
  \   servicePort: 8080\n```\n\n只需将此内容保存到 `api-gateway-ingress.yml`，创建资源只需执行：\n\n\
  ```\nkubectl create -f api-gateway-ingress.yml\n```\n\n完成！Ingress 已成功创建！\n\n## 分布式追踪\
  \ (Distributed Tracing)\n\n在这一部分，我们需要将之前的独立 Zipkin 实例移动到 Kubernetes 集群，并更新配置，使微服务指向托管在\
  \ Kubernetes 上的 Zipkin，而不是旧的 `localhost:9411`。\n\n### 第 1 步：将 Zipkin 部署到 Kubernetes\n\
  \nZipkin 有官方的 Docker 镜像：`openzipkin/zipkin`，我们将将其部署到 Kubernetes：\n\n```\nkubectl\
  \ create deployment zipkin --image=openzipkin/zipkin\n```\n\n然后，在创建 `Deployment`\
  \ 后，我们需要使用 `Service` 将其暴露，该 Service 将作为 Zipkin 的 `hostname`：\n\n```\nkubectl expose\
  \ deployment zipkin --type=LoadBalancer --port 9411\n```\n\n现在，所有转发到名为 `zipkin`\
  \ 的主名的请求将被负载均衡到可用的 Zipkin `Pod`。\n\n### 第 2 步：将 Sleuth 追踪转发到 Zipkin\n\n我们需要提到：\n\
  \n```\nspring:\n  application:\n    name: order-service\n  sleuth:\n    sampler:\n\
  \      probability: 1\n  zipkin:\n    baseUrl: http://zipkin/\n...\n```\n\n`spring.zipkin.baseUrl`\
  \ 指向 Kubernetes `zipkin`。\n\n就此！！一切都会运行得非常完美！ :)\n\n# 第 14 章：OpenShift 入门\n\n##\
  \ 引言\n\nOpenShift 是一种容器应用程序平台，它将 Docker 和 Kubernetes 引入企业。\n\n![](img/ocp-logo.png)\n\
  \nOpenShift Container Platform 图标\n\nOpenShift 为本地、公有云或托管的应用提供基于容器的软件部署和管理。OpenShift\
  \ 在 Kubernetes 之上增加了以操作为中心的工具，以实现快速开发、易于部署和长期维护。\n\n这是我看到的关于 OpenShift 的文献定义，它们并没有清晰定义\
  \ OpenShift 是什么？\n\n我将 OpenShift 定义为由 RedHat 构建的 **PaaS**，其核心主要基于 Docker，由 Kubernetes\
  \ 提供编排，运行在 Red Hat Linux 上。您可以在公有云、私有云或混合云上获取，甚至获得托管版本。OpenShift 旨在简化应用程序。\n\n##\
  \ 什么是 OpenShift？\n\nOpenShift 主要基于 Kubernetes。此外，OpenShift Container Platform 版本指示了包含其中的\
  \ Kubernetes 版本。例如，OCP v3.9 基于 Kubernetes v1.9，OCP v3.11 基于 v1.11 以此类推……这个细节显示了\
  \ OpenShift 多么依赖 Kubernetes。个人而言，我喜欢将 OpenShift 视为带有额外组件的自定义 Kubernetes 版本。\n\n\
  ![](img/ocp-version.png)\n\n基于 Kubernetes 版本的 OCP 版本\n\nOpenShift Container Platform\
  \ 是一个付费产品，可以安装在您的基础设施上，包含您所订阅的 Red Hat 付费支持，并在您的集群增长时需要续费甚至升级。\n\nOpenShift 有一个免费的开源版本称为\
  \ **OKD**。它包含了商业产品的大部分功能，但您无法获得 Red Hat 的支持。\n\nOpenShift 自带容器镜像注册表，用于在本地存储我们在集群中使用的\
  \ Docker 镜像。该注册表将持有付费订阅中包含的所有 Red Hat 认证镜像。在 **OKD** 安装中我们也有这个注册表，但没有 Red Hat 认证的\
  \ Docker 镜像。\n\nOpenShift 还拥有自己的命令行界面 `openshift-cli` 以及自己的 Web 仪表板（而不是 Kubernetes\
  \ Dashboard UI）\n\n![](img/oc-dashboard.png)\n\nOCP 板\n\n### 在本地运行 OpenShift\n\n\
  在我们的教程中，我们不会构建真实的 OpenShift 集群。我们将使用 **Minishift**。\n\nMinishift 是一个让在本地运行 OpenShift\
  \ 变得简单的工具。Minishift 在笔记本电脑的虚拟机中运行单节点 OpenShift 集群，适用于想要尝试 OpenShift 或对其进行开发的用户。\n\
  \n\n\n\n\nMinishift 安装请：[`github.com/minishift/minishift`](https://github.com/minishift/minishift)\n\
  \n安装完成后，启动 Minishift：\n\n```\nminishift start\n```\n\n`minishift start` 命令会创建一个名为\
  \ `minishift` 的 `kubectl context`。该上下文包含了与你的 minishift 集群通信的配置。\n\nMinishift 会自动将此上下文设置为默认值，但如果你将来需要切换回它，请运行：\n\
  \n```bash\nkubectl config use-context minishift\n```\n\n访问 OpenShift Web 控制台：\n\n\
  ```\nminishift dashboard\n```\n\n首先，将在默认浏览器中打开登录界面：\n\n![](img/okd-login.png)\n\
  OKD 登录界面\n\n接下来，将在默认浏览器中打开仪表板：\n\n![](img/okd-dashboard.png)\nOpenShift Web 控制台\
  \ - 又称为 OpenShift Dashboard\n\n可以使用 `minishift stop` 命令停止你的集群。该命令会关闭 Minishift 虚拟机，但会保留所有的集群状态和数据。重新启动集群将将其恢复到之前的状态。\n\
  \n可以使用 `minishift delete` 命令删除你的集群。该命令会关闭并删除 minishift 虚拟机。不会保留任何数据或状态。\n\n### 免费\
  \ OpenShift 集群\n\n`OpenShift Online` 是 `Red Hat` 的公共云应用部署和托管平台。你可以按需访问 `OpenShift`\
  \ 来构建、部署和管理可扩展的容器化应用程序，这些应用由 `Red Hat` 运营并支持。\n\nRed Hat 提供了一个专用于个人学习和实验的 `OpenShift\
  \ Online Starter Plan`。\n\n`新的个人计划` 特性包括：\n\n* 美国西部（俄勒冈）集群/区域\n* 为你的应用程序提供 `2GiB\
  \ 内存`\n* 为你的应用程序提供 `2GiB 持久存储`\n* 社区支持\n* `60 天有效期`\n\n要获取免费集群，你可以访问 [`manage.openshift.com`](https://manage.openshift.com)\
  \ 然后点击 `注册 OpenShift Online`。\n\n![](img/ocp-online.png)\nOpenShift Online 登录界面\n\
  \n创建账户并请求创建免费集群后，它将列在 `Active Subscriptions`（活动订阅）中：\n\n![](img/ocp-online-subscriptions.png)\n\
  OpenShift Online - Active Subscriptions\n\n访问集群只需点击 `Open Web Console`（打开 Web 控制台）：\n\
  \n![](img/ocp-online-catalog.png)\nOpenShift Online Dashboard\n\n要使用 `openshift-cli`\
  \ 访问 OpenShift Online 集群，我们需要通过仪表板上生成的身份验证令牌，只需两步：\n\n![](img/ocp-online-login-cmd.png)\n\
  第一步 - 进入帮助菜单中的 `Command Line Tools`（命令行工具）\n\n接下来..\n\n![](img/ocp-online-generate-token.png)\n\
  第二步 - 点击 `Copy` 按钮将验证命令复制到剪贴板\n\n因此，只需将命令粘贴到你的 `Terminal`（终端）中，即可在新集群中完成身份验证。命令如下：\n\
  \n```\noc login https://api.starter-us-west-2.openshift.com --token=28dEwxbGcM5xnHnmF3S5LYjUR-7\n\
  ```\n\n`默认`情况下，我们位于 `OpenShift Default Project`（OpenShift 默认项目）。因此，我们需要创建一个新的 `Project`（项目）：\n\
