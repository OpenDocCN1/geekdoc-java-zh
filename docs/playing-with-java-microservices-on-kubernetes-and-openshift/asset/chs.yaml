  \ nullable = false)\n    private String country;\n}\n```\n\n`Address` 类将被用作 `Embeddable`\
  \ 类。与实体类不同，嵌入类（Embeddable classes）用于表示实体的状态，但它们没有自己的持久化标识。嵌入类的实例与其所有实体共享标识。嵌入类仅作为另一个实体的状态存在。\n\
