  \ Logo\n\n## 实现精品店 (Boutique)\n\n现在，我们将开始实现我们的应用程序。我们将使用组成典型 Spring 应用的层来拆分实现。\n\
  \n![](img/app-layers.jpg)\n\n### 应用层\n\n* `Persistence Layer`（持久层）持有 `Entities`（实体）、`Repositories`（仓库）和相关类。\n\
  * `Services Layer`（服务层）持有 `Services`（服务）、`Configuration`（配置）、`Batches`（批处理）等。\n\
  * `Web Layer`（Web 层）持有 Web 服务端点。\n\n#### 项目骨架\n\n开始吧！我们将开始使用由 Pivotal Software,\
  \ Inc. 的 Spring Framework 团队提供的强大功能和选项。\n\n为了避免在创建新项目并启动它时遇到困难部分，Spring 团队创建了 `Spring\
  \ Initializr` 项目。\n\nSpring Initializr 是一个非常有用的项目，可以轻松生成基础的 Spring Boot 项目结构。你可以选择项目是基于\
  \ `Maven` 还是 `Gradle`，使用 `Java`、`Kotlin` 还是 `Groovy`，并选择你想使用的 Spring Boot 版本。\n\n\
  可以使用以下方式使用 Initializr：\n\n* 使用基于 Web 的界面 [`start.spring.io`](http://start.spring.io)\n\
  * 使用 `Spring Tool Suite` 或其他 IDE 如 `NetBeans` & `IntelliJ`\n* 使用 `Spring Boot CLI`\n\
  \nSpring Initializr 让你能够添加所需的内核依赖，如 `JDBC` 驱动程序或 `Spring Boot Starters`。\n\n对于我们的\
  \ Spring Boot 项目，我们将选择这些 `Dependencies`（依赖）：\n\n* `JPA`\n* `Actuator`\n* `H2`\n\
  * `Web`\n* `Lombok`\n\n![](img/spring-initializr.png)\n\nSpring Initializr - 启动我的精品店\n\
  \n### 这些依赖项是什么？\n\n* `JPA`：支持 `Java Persistence API`，包括 `spring-data-jpa`、`spring-orm`\
  \ 和 `Hibernate`。\n* `Actuator`：生产级功能，帮助你监控和管理应用程序。\n* `H2`：非常流行的内存数据库，在 `Spring\
  \ Boot` 中有很好的集成。\n* `Rest Repositories`：通过 `spring-data-rest-webmvc` 通过 REST 暴露\
  \ `Spring Data` 仓库。\n* `Rest Repositories HAL Browser`：在浏览器中浏览 `Spring Data REST`\
  \ 仓库。\n\n一旦创建了空项目，我们将开始构建单体层。我们将从 `Persistence Layer` 开始。\n\n### 创建持久层\n\n如果我们回顾类图（[链接到类图]），我们有：\n\
  \n* `Address`\n* `Cart`\n* `Category`\n* `Customer`\n* `Order`\n* `OrderItem`\n\
  * `Payment`\n* `Product`\n* `Review`\n\n对于列表中的每个 `entity`（实体），我们将创建：\n\n* 一个 `JPA\
  \ Entity`（JPA 实体）\n* 一个 `Spring Data JPA Repository`（Spring Data JPA 仓库）\n\n我们的实体将共享一些始终常用的属性，如‘id’、“创建日期”等。这些属性将集中在\
  \ `AbstractEntity` 类中，我们的实体将“继承”该类。\n\n`AbstractEntity` 看起来如下：\n\n```\n@Getter <1>\n\
  @Setter <1>\n@MappedSuperclass <2>\n@EntityListeners(AuditingEntityListener.class)\
  \ <3>\npublic abstract class AbstractEntity implements Serializable {\n\n    private\
  \ static final long serialVersionUID = 1L;\n\n    @Id\n    @GeneratedValue(strategy\
  \ = GenerationType.AUTO)\n    private Long id;\n\n    @CreatedDate <4>\n    @Column(name\
  \ = \"created_date\", nullable = false)\n    @JsonIgnore\n    private Instant createdDate\
  \ = Instant.now();\n\n    @LastModifiedDate <4>\n    @Column(name = \"last_modified_date\"\
  )\n    @JsonIgnore\n    private Instant lastModifiedDate = Instant.now();\n}\n```\n\
  \n1. 使用 Lombok 注解为 `AbstractEntity` 类生成 getter 和 setter。\n2. 注解基类，其属性将能够继承。\n3.\
  \ 在 Spring Data JPA 中激活审计（Auditing）。\n4. 注解的字段将自动填充。\n\n### Cart\n\n```\n@Data <1>\n\
  @NoArgsConstructor <2>\n@AllArgsConstructor <3>\n@EqualsHashCode(callSuper = false)\
  \ <4>\n@Entity <5>\n@Table(name = \"cart\") <5>\npublic class Cart extends AbstractEntity\
  \ {\n\n    private static final long serialVersionUID = 1L;\n\n    @OneToOne\n \
  \   @JoinColumn(unique = true)\n    private Order order;\n\n    @ManyToOne\n   \
  \ private Customer customer;\n\n    @NotNull <6>\n    @Enumerated(EnumType.STRING)\n\
  \    private CartStatus status;\n\n    public Cart(Customer customer) {\n      \
  \  this.customer = customer;\n        this.status = CartStatus.NEW;\n    }\n}\n\
  ```\n\n1. Lombok 注解生成所有字段的 getter、实用的 `toString` 方法以及非临时字段的 hashCode 和 equals 实现。\n\
  2. Lombok 注解生成无参构造函数。\n3. Lombok 注解生成全参构造函数。全参构造函数为类中的每个字段都需要一个参数。\n4. 不调用父类的 `equals`\
  \ 和 `hashCode`。\n5. 这是一个 `@Entity`，其对应的 `@Table` 将命名为 `cart`。\n6. 验证注解，用于控制数据的完整性。\n\
  \n```java\n@Repository <1>\npublic interface CartRepository extends JpaRepository<Cart,\
  \ Long> <2> {\n    List<Cart> findByStatus(CartStatus status); <3>\n    List<Cart>\
  \ findByStatusAndCustomerId(CartStatus status, Long customerId); <3>\n}\n```\n\n\
  1. 表示注解类是一个“Repository”，最初由领域驱动设计（Evans, 2003）定义为“一种封装存储、检索和搜索行为的机制”。\n2. Repository\
  \ 的 JPA 特定扩展。这将允许 Spring Data 找到此接口并自动为其创建实现。\n3. 这些方法使用 Spring Data 查询构建器机制实现查询。\n\
  \n### CartStatus\n\n```java\npublic enum CartStatus {\n    NEW, CANCELED, CONFIRMED;\n\
  }\n```\n\n### Address\n\n`Address` 类看起来如下：\n\n\n\n\n\n```java\n@Data\n@AllArgsConstructor\n\
  @EqualsAndHashCode(callSuper = false)\n@Embeddable\npublic class Address {\n\n \
  \   @Column(name = \"address_1\")\n    private String address1;\n\n    @Column(name\
  \ = \"address_2\")\n    private String address2;\n\n    @Column(name = \"city\"\
  )\n    private String city;\n\n    @NotNull\n    @Size(max = 10)\n    @Column(name\
  \ = \"postcode\", length = 10, nullable = false)\n    private String postcode;\n\
