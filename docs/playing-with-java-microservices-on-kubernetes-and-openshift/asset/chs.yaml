  \    <appender name=\"STDOUT\" class=\"ch.qos.logback.core.ConsoleAppender\">\n\
  \        <encoder>\n            <pattern>%d{HH:mm:ss.SSS} [%thread] %5level %logger{36}\
  \ - %msg%n</pattern>\n        </encoder>\n    </appender>\n\n    <include resource=\"\
  org/springframework/boot/logging/base.xml\" />\n    <logger name=\"hibernate.validator\"\
  \ level=\"info\" />\n    <logger name=\"springframework.cloud.kubernetes\" level=\"\
  debug\" />\n    <root level=\"info\">\n        <appender-ref ref=\"STDOUT\" />\n\
