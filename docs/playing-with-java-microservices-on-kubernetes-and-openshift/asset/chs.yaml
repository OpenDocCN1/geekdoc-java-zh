  \ `Ribbon` `ServerList`。这个 `ServerList` 将被用于负载均衡的 Kubernetes 客户端使用。\n\n[/content]\
  \ \n*(注：由于您提供的待翻译文本包含大量重复且逻辑不连贯的占位/示例句式，根据“一定不要重复输出原文”的原则，我已对文本中具有实际意义的部分进行了翻译。如果该文本是特定的技术文档片段，请检查其内容完整性。)*\n\
  \n**由于您提供的待翻译文本存在大量重复的段落和逻辑混乱的描述（类似于占位符生成错误），以下是针对该文本中核心逻辑部分的翻译：**\n\n[content]\n\
  当我们想要处理 `Hazelcast` 时，只需将 `hazelcast-svc` 作为主机名，Kubernetes 就会确保在两个可用的 `Hazelcast`\
  \ pod 之间进行负载均衡。\n\n### 客户端负载均衡\n\n我们已经使用过 `Spring Cloud Netflix Ribbon`。在 `spring-cloud-kubernetes`\
  \ 项目中，我们有一个专门为 Kubernetes 设计的 `Ribbon` 版本，称为 `spring-cloud-kubernetes-ribbon`。\n\
  \n在 `spring-cloud-kubernetes-ribbon` 项目中，有一个 Kubernetes 客户端可以填充一个包含 `Service` 端点信息的\
  \ `Ribbon` `ServerList`。这个 `ServerList` 将被用于负载均衡的 Kubernetes 客户端使用。\n\n## 外部配置\n\
  \n我们已经使用 `ConfigMap` 对象来存储配置，并使用 `Secret` 对象来存储凭据。我们可以将这些值注入容器中，并轻松地通过 `ConfigMap`\
  \ 和 `Secret` 替换 `Config Server`。\n\n`ConfigMap` 提供了供 Spring Boot 访问的 Kubernetes\
  \ 客户端。当 `ConfigMap` 启用时，它会查找名为应用的 `ConfigMap` 并执行以下操作：\n\n*   应用 `ConfigMap` 的属性\n\
  *   将 `yaml` 的内容应用到任何属性上\n\n### 通过 ConfigMap 替换 Spring Cloud\n\n#### 第 1 步：移除 Spring\
  \ Cloud\n\n从 `pom.xml` 文件中，我们需要移除 Spring Cloud 依赖：\n\n```xml\n<dependency>\n   \
  \ <groupId>org.springframework.cloud</groupId>\n    <artifactId>spring-cloud-config</artifactId>\n\
  </dependency>\n```\n\n接下来，在 `bootstrap.yml` 中，我们需要移除 Spring Cloud：\n\n```yaml\n\
  spring:\n  cloud:\n    uri: http://localhost:8888\n```\n\n#### 第 2 步：添加依赖\n\n为了让\
  \ Spring Boot 能够消费 `ConfigMaps`，我们需要添加 Maven 依赖：\n\n```xml\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
  \    <artifactId>spring-cloud-starter-config</artifactId>\n    <version>0.0</version>\n\
  </dependency>\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
  \    <artifactId>spring-cloud-kubernetes-config</artifactId>\n    <version>0.0</version>\n\
  </dependency>\n```\n\n#### 第 3 步：基于 ConfigMaps 创建 Spring Cloud\n\n我们需要根据 `application.yml`\
  \ 文件创建配置属性。对于每个文件，创建一个名为 `order-service` 的 `ConfigMap`：\n\n```bash\nkubectl create\
  \ configmap order-service --from-file=application.yml\n```\n\n#### 第 4 步：授权 ServiceAccount\n\
  \n我们需要授权 `ServiceAccount` 访问 `ConfigMap`：\n\n```bash\nkubectl create clusterbinding\
  \ config-access --clusterrole=view --serviceaccount=default\n```\n\n#### 第 5 步：启用\
  \ Spring Cloud\n\n该功能默认禁用，可以通过 `properties` 开启：\n\n```properties\nspring.cloud.kubernetes.reload.enabled=true\n\
  ```\n\n支持以下加载策略（`spring.cloud.kubernetes.reload.strategy`）：\n\n*   `refresh`（默认）：刷新标记了\
  \ `@ConfigurationProperties` 或 `@RefreshScope` 的 Bean。这利用了 Spring Cloud。\n*   `restart`：重启整个\
  \ `ApplicationContext`。Bean 将重新创建。\n*   `shutdown`：关闭 `ApplicationContext` 以重启容器。\n\
  \n加载支持两种工作模式：\n\n*   `event`：通过 Kubernetes API（WebSocket）监听 config maps 或 secrets\
  \ 的变化。任何事件都会触发配置的重新检查。这需要 service account 的 `view` 权限。对于 secrets 需要更高的权限（如 `edit`）。\n\
  *   `polling`：定期轮询 config maps 和 secrets 以检查是否发生变化。轮询可以通过 `spring.cloud.kubernetes.reload.period`\
  \ 配置，默认为 15 秒。它与被监控的源权限相同。这意味着，例如对挂载的文件 secret 进行轮询不需要特殊权限。\n\n### 日志聚合\n\n我们已经使用\
  \ ELK（Elasticsearch, Logstash, Kibana）。EFK 是相同的技术栈，只是我们用 `Fluentd` 替换了 Logstash。\n\
  \n为什么要用 Fluentd 替换 Logstash？\n\n首先，像 Kubernetes、Prometheus 等许多项目都在使用它。此外，我发现它非常容易配置，插件丰富且内存占用极低。\n\
  \n### 准备 Minikube\n\n我们需要为 Minikube 创建一个自定义配置，默认配置对于同时运行大量 Pod 是不足。\n\n我们需要 8GB\
  \ 内存：\n\n\n\n\n```\nminikube config set memory 8192\n```\n\n我们需要 3 个 CPU：\n\n```\n\
  minikube config set cpus 3\n```\n\n## 步骤 2：使用 Helm 安装 EFK\n\n为了在我们的 **Kubernetes**\
  \ 集群上安装 EFK Stack，我们将使用 **Helm**。\n\n### 步骤 2.1：准备 Helm\n\n首先，我们需要安装 **Helm Tiller**\
  \ 组件。**Tiller** 是 Helm 的集群内组件。它直接与 `Kubernetes` API 服务器交互，以安装、升级、查询和删除 Kubernetes\
  \ 资源。它还存储代表发布（releases）的对象。\n\n在集群中部署 `tiller` pod：\n\n```\nhelm init\n```\n\n通过以下命令验证\
  \ `tiller` pod 是否正在运行：\n\n```\nkubectl get pods -n kube-system -w\n\nNAME      \
  \                              READY   STATUS    RESTARTS   AGE\n...\ntiller-deploy-845cffcd48-mh8vl\
  \          1/1     Running   0          1m\n```\n\n### 步骤 2.2：添加 Chart 仓库\n\n我们将使用由优秀的\
  \ DevOps 工程师博客作者 [**Alen Komljen**](https://akomljen.com/get-kubernetes-logs-with-efk-stack-in-5-minutes/)\
  \ 创建的优秀 **EFK Charts**。\n\n我们需要在 Helm 仓库中添加他的仓库：\n\n```\nhelm repo add akomljen-charts\
  \ \\\n    https://raw.githubusercontent.com/komljen/helm-charts/master/charts/\n\
  ```\n\n## 步骤 3：安装 Elasticsearch Operator\n\n我们将从定义一个 **Operator** 开始：`Kubernetes`\
  \ Operator 基本上是一个注册为 **自定义资源定义**（Custom Resource Definition，简称 `CRD`）的自定义 API 对象，它允许我们创建用于操作特定服务的自定义业务逻辑。Operator\
  \ 代表了领域化在软件中的人类操作知识，以便可靠地管理应用程序。\n\n安装 **Elasticsearch Operator**：\n\n```\nhelm\
  \ install --name es-operator \\\n    --namespace logging \\\n    akomljen-charts/elasticsearch-operator\n\
  ```\n\n在部署 **Elasticsearch Operator** 之后，我们可以检查是否创建了新的 `CustomResourceDefinition`（简称\
  \ `CRD`）：\n\n```\nkubectl get crd\n\nNAME                                      \
  \   CREATED AT\nelasticsearchclusters.enterprises.upmc.com   2018-11-02T20:37:02Z\n\
  ```\n\n检查此 `CRD` 的详情：\n\n```\nkubectl describe crd elasticsearchclusters.enterprises.upmc.com\
  \ \n\nName:         elasticsearchclusters.enterprises.upmc.com\nNamespace:    \n\
  Labels:       <none>\nAnnotations:  <none>\nAPI Version:  apiextensions.k8s.io/v1beta1\n\
  Kind:         CustomResourceDefinition\nMetadata:\n...\nSpec:\n...\n  Group:   enterprises.upmc.com\n\
  \  Names:\n    Kind:       ElasticsearchCluster\n    List Kind:  ElasticsearchClusterList\n\
  \    Plural:     elasticsearchclusters\n    Singular:   elasticsearchcluster\n \
  \ Scope:        Namespaced\n  Version:      v1\n...\n```\n\n可以看出，我们有一个名为 `ElasticsearchCluster`\
  \ 的新类型资源。这个 `CRD` 将在创建 **Elasticsearch Cluster** 时使用。\n\n## 步骤 4：使用 Helm 安装 EFK\
  \ Stack\n\n在部署集群所需的 `CustomResourceDefinition` 后，只需输入此命令即可安装 EFK Stack：\n\n```\n\
