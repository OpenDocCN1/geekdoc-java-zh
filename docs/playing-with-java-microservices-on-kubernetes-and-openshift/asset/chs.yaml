  ### 服务发现与注册\n\nKubernetes 提供了强大的服务发现功能。我们可以利用这些功能来摆弃 `Eureka` :D 是的！我们可以让 Kubernetes\
  \ 确保发现我们的微服务。\n\n酷！！这太棒了！但我们已经讨论了很多 Kubernetes 组件，我们可以用哪一个来实现服务发现呢？\n\n答案是：`Services`！没错！让我给你们讲讲故事：\n\
  \n在这一章的第一部分，我们已经看到了如何在 Kubernetes 中运行 Spring Boot 应用。\n\n我们的 `application` 运行在 `Kubernetes\
  \ Pod` 内部的 `Docker Container` 中。我们的容器化应用程序需要与不同 Pod 中的其他应用程序通信，例如 `Hazelcast` 缓存引擎或数据库。如接图所示：\n\
  \n![](img/app-container-pod.png)\n\n在 Pod 容器中运行应用程序 数据库实例可能会由于任何原因崩溃或重启……如果我们有 `eureka`，我们可以在新实例出现后继续运行……呵呵！Kubernetes\
  \ Service 正在做同样的事情！`db-svc` 对象指向数据库 Pod - 当一个新的数据库 Pod 被创建时，它会自动注册到集群数据中，作为一个属于被\
  \ `db-svc` 跟踪的 pod。\n\n`db-svc` 服务使用选择器 `app=sample-app` 跟踪数据库 Pod。当我们把微服务作为容器部署时，通过将它们暴露为\
  \ `Service`，我们的 Pod 就能被轻松跟踪。在我们的微服务中，我们将继续使用它们的 `Service Name` 调用远程微服务，然后 Kubernetes\
  \ 嵌入的 DNS 服务器将解析 Pod 相同命名空间下的 `Service Name`。因此，我们不需要 Eureka 或任何库或配置。\n\nKubernetes\
  \ 有一个名为 `kube-dns` 的特殊 pod，它运行在 `kube-system` 命名空间中。该 pod 是负责解析 Kubernetes 集群中服务名称的组件。\n\
  \n### 启用 Kubernetes 发现库\n\n####  1 ：移除 Eureka Client 依赖\n\n我们已经提到将不再使用 `Eureka`，因此不再需要\
  \ `Eureka Client` 依赖：\n\n```\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
  \    <artifactId>spring-cloud-starter-netflix-eureka-client</artifactId>\n</dependency>\n\
  ```\n\n####  2 ：添加 Kubernetes 发现库\n\n`Spring Cloud Kubernetes` 库包含一个名为 `Spring Cloud\
  \ Kubernetes Discovery` 的库：该库允许我们通过名称查询 Kubernetes `Service`s。\n\n```\n<dependency>\n\
  \    <groupId>org.springframework.cloud</groupId>\n    <artifactId>spring-cloud-kubernetes-discovery</artifactId>\n\
  </dependency>\n```\n\n####  3 ：定义 Kubernetes 服务\n\n某些 `Spring Cloud` 组件将使用 `DiscoveryClient`\
  \ 获取有关服务的信息。为了让其工作，我们需要确保 `Service` 的名称与 `application.name` 一致。为此，我们需要在 `f8mp` 中添加此配置：\n\
  \n```\n<plugin>\n    <groupId>io.fabric8</groupId>\n    <artifactId>fabric8-maven-plugin</artifactId>\n\
  \    <version>3.5.41</version>\n    <configuration>\n        <enricher>\n      \
  \      <config>\n                <fmp-service>\n                    <name>${project.name}</name>\n\
  \                </fmp-service>\n            </config>\n        </enricher>\n  \
  \  </configuration>\n    ...\n</plugin>\n```\n\n我们将 `${project.name}` 的值设置为 `enricher.fmp-service.name`。这个\
  \ `${text}` 标签将被解析并替换。\n\n接下来，我们需要使用 Maven 项目名称定义 `application.name`；为了实现此点，我们需要在\
  \ Maven 构型中添加此配置：\n\n```xml\n <build>\n    <resources>\n        <resource>\n   \
  \         <directory>src/main/resources</directory>\n            <filtering>true</filtering>\n\
  \            <includes>\n                <include>application.properties</include>\n\
  \            </includes>\n        </resource>\n    </resources>\n    <plugins>\n\
  \ ...\n</build>\n```\n\n并在 `application.properties` 文件中，我们将定义：\n\n```\nspring.application.name=@project.name@\n\
  ```\n\n*   好的，但这些在做什么？\n\n*   保持冷静！D 这里我们要求 Maven 在构建应用程序时解析 `src/main/resources`\
  \ 中的文件；在这里，Maven 解析器将识别 `@project.name@` 模式并将其替换为 `pom.xml` 中定义的 `project.name`。\n\
  \n现在我们确定 `application.name` 和 Kubernetes `Service` 的名称值相同，即 Maven 项目名称。\n\n### 负载均衡\n\
  \n我们之前使用 `Zuul`、`Eureka` 和 `Ribbon` 在微服务调用中实现负载均衡，但当我们进入 Kubernetes 世界时，还有必要保留它们吗？！\
  \ :)\n\n例如，在之前的架构中，*Hazelcast* 缓存作为两个实例运行在两个不同的 Pod 中。\n\n### 服务端负载均衡\n\nKubernetes\
  \ 通过在 `Service` 概念中包含负载均衡功能已经实现了这一点。又是吗？是的！又是！`Service` 提供了一个单一接触点，调用将在此进行负载均衡并重定向到合适的\
  \ pod。我们只需向 `Service` 发起 REST 调用，Kubernetes 就会将请求重定向到相关的 `Pod`。\n\n\n\n\n当我们想要处理\
  \ `Hazelcast` 时，只需将 `hazelcast-svc` 作为主机名，Kubernetes 就会确保在两个可用的 `Hazelcast` pod\
  \ 之间进行负载均衡。\n\n## 客户端端负载均衡\n\n我们已经使用过 `Spring Cloud Netflix Ribbon`。在 `spring-cloud-kubernetes`\
