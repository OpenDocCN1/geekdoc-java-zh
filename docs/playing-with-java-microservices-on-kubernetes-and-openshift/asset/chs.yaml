  \    <dependency>\n         <groupId>org.projectlombok</groupId>\n         <artifactId>lombok</artifactId>\n\
  \      </dependency>\n      <dependency>\n         <groupId>io.springfox</groupId>\n\
  \         <artifactId>springfox-swagger-ui</artifactId>\n         <version>2.9.2</version>\n\
  \      </dependency>\n      <dependency>\n         <groupId>io.springfox</groupId>\n\
  \         <artifactId>springfox-swagger2</artifactId>\n         <version>2.9.2</version>\n\
  \      </dependency>\n      <dependency>\n         <groupId>com.h2database</groupId>\n\
  \         <artifactId>h2</artifactId>\n         <scope>runtime</scope>\n      </dependency>\n\
  \   </dependencies>\n   <build>\n      <plugins>\n         <plugin>\n          \
  \  <groupId>org.springframework.boot</groupId>\n            <artifactId>spring-boot-maven-plugin</artifactId>\n\
  \         </plugin>\n      </plugins>\n   </build>\n</project>\n```\n\n在 `Build`\
  \ 部分，我们正在使用 `spring-boot-maven-plugin` 来构建项目，或者使用命令：`mvn spring-boot:run` 运行应用程序。\n\
  \n### 哪种包类型：WAR vs JAR\n\n我们必须首先定义 WAR 和 JAR 之间的区别。WAR 代表 **W**eb Application **AR**chive（Web\
  \ 归档文件），部署在 Tomcat 或 Jetty 等 Servlet 容器上。JAR 代表 **J**ava **AR**chive（Java 归档文件），它将包含一个嵌入的容器（如\
  \ Tomcat）。这是部署应用程序的两种完全不同的方式。Spring 团队推荐 **JAR** 包类型。\n\nPivotal 的 Spring 开发者倡官\
  \ Josh Long 总是说：“制作 JAR 而不是 WAR”。这一建议是基于 JAR 包类型的许多事实。\n\n### 构建 JAR\n\n要构建项目，只需在命令行中运行\
  \ `mvn package`，如下：\n\n```\n[INFO] Scanning for projects...\n[INFO]\n[INFO] ---------------------<\
  \ com.targa.labs:myboutique >----------------------\n[INFO] Building myboutique\
  \ 0.0.1-SNAPSHOT\n[INFO] --------------------------------[ jar ]---------------------------------\n\
  [INFO]\n[INFO] --- maven-resources-plugin:3.0.1:resources (default-resources) @\
  \ myboutique ---\n[INFO] Using 'UTF-8' encoding to copy filtered resources.\n[INFO]\
  \ Copying 1 resource\n[INFO] Copying 0 resource\n[INFO]\n[INFO] --- maven-compiler-plugin:3.7.0:compile\
  \ (default-compile) @ myboutique ---\n[INFO] Nothing to compile - all classes are\
  \ up to date\n[INFO]\n[INFO] --- maven-resources-plugin:3.0.1:testResources (default-testResources)\
  \ @ myboutique ---\n[INFO] Using 'UTF-8' encoding to copy filtered resources.\n\
  [INFO] skip non existing resourceDirectory /Users/n.lamouchi/Desktop/myboutique/src/test/resources\n\
  [INFO]\n[INFO] --- maven-compiler-plugin:3.7.0:testCompile (default-testCompile)\
  \ @ myboutique ---\n[INFO] Changes detected - recompiling the module!\n[INFO]\n\
  [INFO] --- maven-surefire-plugin:2.21.0:test (default-test) @ myboutique ---\n[INFO]\n\
  [INFO] --- maven-jar-plugin:3.0.2:jar (default-jar) @ myboutique ---\n[INFO] Building\
  \ myboutique 0.0.1-SNAPSHOT\n[INFO] --------------------------------[ jar ]---------------------------------\n\
  ```\n\n### 构建 WAR 如果\n\n为了能够构建 WAR，我们需要将打包类型从 JAR 转换为 WAR。\n\n#### 步骤 1：添加初始化类\n\
  \n在我们的应用程序中，我们使用 JAR 作为包类型，只需要如下主类：\n\n```java\npackage com.targa.labs.myboutique;\n\
  \nimport org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.SpringBootApplication;\n\
  import springfox.documentation.swagger2.annotations.EnableSwagger2;\n\n@EnableSwagger2\n\
  @SpringBootApplication\npublic class MyboutiqueApplication {\n    public static\
  \ void main(String[] args) {\n        SpringApplication.run(MyboutiqueApplication.class,\
  \ args);\n    }\n}\n```\n\n为了部署 WAR，我们需要添加另一个配置 Web 应用程序的类。我们将添加名为 `ServletInitializer`\
  \ 的新类，如下：\n\n```java\npackage com.targa.labs.myboutique.configuration;\n\nimport\
  \ com.targa.labs.myboutique.MyboutiqueApplication;\nimport org.springframework.boot.builder.SpringApplicationBuilder;\n\
  import org.springframework.boot.web.servlet.support.SpringBootServletInitializer;\n\
  \npublic class ServletInitializer extends SpringBootServletInitializer {\n    @Override\n\
  \    protected SpringApplicationBuilder configure(SpringApplicationBuilder application)\
  \ {\n        return application.sources(MyboutiqueApplication.class);\n    }\n}\n\
  ```\n\n我们将主应用程序类 `MyboutiqueApplication.class` 作为 `sources` 方法的参数。\n\n#### 步骤 2：从\
  \ WAR 中排除嵌入式容器\n\n在我们的 `pom.xml` 中，Spring Boot Starter Web 依赖项声明了 Tomcat 依赖。由于应用程序将部署在\
  \ Tomcat 服务器中，我们需要更改该依赖以表示其将由外部提供。\n\n```xml\n<dependency>\n\t<groupId>org.springframework.boot</groupId>\n\
  \t<artifactId>spring-boot-starter-tomcat</artifactId>\n\t<scope>provided</scope>\n\
  </dependency>\n```\n\n#### 步骤 3：在 `pom.xml` 中将包类型更改为 war\n\n\n\n\n\n```xml\n<groupId>com.targa.labs</groupId>\n\
  <artifactId>myboutique</artifactId>\n<version>0.0.1-SNAPSHOT</version>\n<packaging>jar</packaging>\n\
  ```\n\n## 第 4 步：打包你的应用程序\n\n完成这些更改后，你现在可以打包你的应用程序了。\n\n```bash\nmvn package\n```\n\
  \n如果你现在查看 `/target` 文件夹，你应该能看到 war 文件。你现在可以该文件并部署到你的 servlet 容器中。\n\n## 部署单体应用\n\
  \n### 部署 JAR\n\n除了使用 `java -jar` 运行 Spring Boot 应用程序外，还可以为 Unix 系统创建完全可执行的应用程序。完全可执行的\
  \ jar 可以像任何其他可执行二进制文件一样执行，也可以注册到 `init.d` 或 `systemd`。这使得在常见的生产环境中安装和管理 Spring Boot\
  \ 应用变得非常简单。\n\n要使用 Maven 创建一个`完全可执行`的 jar，请使用以下插件配置：\n\n```xml\n<plugin>\n\t<groupId>org.springframework.boot</groupId>\n\
  \t<artifactId>spring-boot-maven-plugin</artifactId>\n\t<configuration>\n\t\t<executable>true</executable>\n\
  \t</configuration>\n</plugin>\n```\n\n然后你可以通过输入 `./myboutique-0.0.1-SNAPSHOT.jar`\
  \ 来运行你的应用程序。包含 jar 的目录被用作应用程序的工作目录。\n\n### 部署 WAR\n\n为了让我们的 WAR 文件在 `Tomcat` 中部署并运行，我们需要完成以下步骤：\n\
  \n1. 下载 `Apache Tomcat` 并将其解压到 `tomcat` 文件夹中。\n2. 将我们的 WAR 文件从 `target/myboutique.war`\
  \ 复制到 `tomcat/webapps/*` 文件夹。\n3. 从终端导航到 `tomcat/bin` 文件夹并执行：\n    1. `catalina.bat\
  \ run`（Windows 上）\n    2. `catalina.sh run`（基于 Unix 的系统）\n4. 我们的应用程序将可以通过 `http://localhost:8080/myboutique/`\
  \ 访问。\n\n# 第二部分：微服务时代\n\n# 第 5 章：微服务架构模式\n\n## 单体架构\n\n### 什么是单体架构？\n\n`monolith`\
  \ 一词最初被古希腊人用来描述单个如山般的巨大石块。虽然今天这个词的使用范围更广，但核心思想保持不变——单体软件产品是一个单一、不可分割的单元，通常会增长到非常大。\n\
  \n在典型的客户端-服务器架构中，单体产品运行在服务器上，由它处理 HTTP 请求、执行逻辑并与数据库交互。它包含一个单一的可执行文件，负责执行应用程序的所有服务端功能。\n\
  \n例如，在 `MyBoutique` 中，为了更新产品页面的行为，开发者将访问相同的代码库，这与添加新的客户服务功能或更改 `Cart` 功能是相同的。在单体中，一切都从同一个地方进行管理和提供。单体软件产品的大小和简单性既是它们的优点也是它们的缺点。\n\
  \n我们的应用程序是作为一个单一单元、单一代码库构建的。这个服务端应用程序将处理 HTTP 请求，执行某些特定领域的逻辑，从数据库检索并更新数据，并处理发送到\
  \ `REST Client` 的负载。它是一个单体——一个单一的逻辑执行文件。要对系统进行任何更改，我们必须重新构建并部署应用程序的更新版本。\n\n单体应用程序的主要优点是其结构简单。一种独特、简单且易于部署和扩展的应用程序。\n\
  \n要部署单体应用，只需要处理一个文件或目录。这使得部署变得非常直接。由于整个应用程序的代码库都在一个地方，只需要配置一个环境来构建和部署软件。在大多数情况下，这意味着花费更少的时间来思考如何将应用程序部署并交付给终端用户。\n\
  \n单体应用是启动新软件项目的便利方式，对服务器或云环境的设置关注最小。虽然复杂度可能会随着时间的推移而增加，但对代码库的适当管理有助于在单体应用的整个生命周期内保持生产力。\n\
  \n单体应用程序往往随着时间的推移变得越来越臃肿。如果不密切关注代码的编写和维护，单体可能会变得非常脆弱。当你的产品出现新挑战和需求时，这会放大你业务面临的每一个困难。\n\
  \n在开发方面，单体应用可能会阻碍灵活性。正如之前提到的，单体应用程序高度紧耦合，随着产品的演变，可能会变成复杂的代码网。因此，随着时间的推移，开发者管理可能会变得极其困难。\n\
  \n> “构建一个运行良好的复杂系统的方法，是从运行良好的简单系统构建的。”\n\n> * Kevin Kelly\n\n此外，每个开发者通常只理解单体应用的一部分，这意味着很少有开发者可以解释应用程序的全部。这在小型或中型应用中可能是可能的，但在大型应用中是永远不可能的。由于单体必须作为一个单元进行开发和部署，因此很难将开发工作分解到独立的团队中。每次代码更改都必须仔细协调，这会减慢开发速度。\n\
  \n这种情况对于新开发者来说可能有点困难，他们不希望处理一个多年演变而的海量代码库。结果就是花费更多时间在寻找正确的代码行上，并确保它没有副作用。因此，用于编写真正改进应用程序的新功能的时间就更少了。\n\
  \n习惯现代开发环境的开发者可能会对单体的僵化性感到失望，单体通常局限于原始的遗留技术栈。在单体中采用新技术可能意味着重写整个应用程序，这是一项耗资且耗时的工程，而且并不总是这样做。\n\
  \n单体应用之所以流行，是因为它们比替代方案——微服务更容易构建。\n\n## 微服务架构\n\n### 什么是微服务架构？\n\n虽然单体是一个单一的大单元，但微服务架构使用较小的、模块化的代码单元，这些单元可以独立于产品的其他组件进行部署。\n\
  \n> “简单比复杂更难。你必须努力让你的思维变得清晰，以便使其变得简单。”\n\n> * Steve Jobs\n\n微服务架构允许大型应用程序拆分为较小的、松耦合的服务。它带来了许多益处：\n\
  \n1. 我们有一个使用单体架构开发的电子商务应用程序，随着时间的推移，它增长了许多新功能。现在我们的代码库变得巨大，加入我们团队的人也很少。对于他们来说，上手现有应用程序非常困难，因为应用程序的各个组件之间没有清晰的划分。微服务允许我们将应用程序视为较小的、松耦合的组件，任何人都可以在短时间内上手现有应用程序，而且向代码库中添加新的修复也不会太困难。\n\
  2. 想象一下今天是`黑五`，我们将获得巨大的流量。由于某种原因，我们的 `Product Catalog` 被高频请求。这将影响整个应用程序，并导致整个应用程序崩溃。如果是在微服务架构中发生同样的情况，我们不会遇到这种故障，因为它是独立运行多个服务的，即使其中一个服务崩溃，也不会影响其他服务。\n\
  \n\n\n\n\n### 3. 我们是一群开发者，在理解应用代码库方面花费了大量时间。我们在为产品添加新功能（例如产品搜索引擎）时感到很痛苦。为了让终端用户看到这些功能，你必须重新部署整个应用程序。而且我们还要处理许多此类功能，想想每次部署需要花费的时间。因此，如果我们的应用程序非常巨大，将花费大量的精力和时间，这无疑会导致生产力的损失。没有人喜欢等待代码更改结果出现。在微服务架构中，我们将尝试使每个服务的代码库尽可能得小，这样在构建、部署等方面就不会花费过多的时间。\n\
  \n### 4. 如今，我们面临着巨大的流量，但没有出现任何故障，服务器运行正常。假设我们需要扩展应用程序的某些组件，例如 `Product Catalog`（产品目录）。在单体架构中，我们无法单独扩展某个组件。但在微服务架构中，我们可以通过动态增加节点数量来单独扩展任何组件。\n\
  \n### 5. 明天，我们想要迁移到新的框架或技术栈。由于单体应用随着时间的推移变得巨大且复杂，升级它非常困难。在微服务架构中实现这一点并不困难，因为组件是微小且灵活的。\n\
  \n这就是微服务架构让我们的生活变得简单的方式。有多种策略可以帮助我们把应用程序拆分为小型服务，例如通过领域驱动设计进行拆解、通过业务能力拆解等。\n\n##\
  \ 什么是真正的微服务？\n\n微服务（Microservice），也称为服务（service），通常实现一组独特的功能或功能，例如订单管理、客户管理等。每个微服务都是一个微型应用程序，它有自己的业务逻辑以及边界，例如\
  \ `REST` 网页服务。某些微服务会暴露 `API`，供其他微服务或应用程序客户端调用。其他微服务则可能实现 Web UI。\n\n现在，应用程序的每个功能区域都由其自己的微服务实现。此外，Web\
  \ 应用程序被拆分成了一组更小的 Web 应用程序。\n\n每个后端服务通常暴露一个 `REST API`，大多数服务消费由其他服务提供的 `APIs`。UI\
  \ 服务调用其他服务以渲染网页。服务还可能使用基于消息的异步通信。\n\n某些 `REST APIs` 也会暴露给客户端应用，客户端无法直接访问后端服务。相反，通信由一个被称为\
  \ `API Gateway`（API 网关）的中间层进行调。`API Gateway` 负责负载均衡、缓存、访问控制、`API metering`（API 计量）和监控等任务。\n\
  \n微服务架构模式显著影响了应用程序与数据库之间的关系。与其与其他服务共享单个数据库模式，每个服务都有自己的数据库模式。一方面，这种方法与企业级数据模型的理念相违背。此外，它经常会导致某些数据的重复。然而，如果你想从微服务中受益，为每个服务配备一个数据库模式是至关重要的，因为这确保了松耦合。\n\
  \n每个服务都有自己的数据库。此外，服务可以使用最适合其需求的数据库类型，即所谓的多语言持久化架构（polyglot persistence architecture）。\n\
  \n从表面上看，微服务架构模式与 `SOA` 相似。在这两种方法中，架构由一组服务组成。然而，理解微服务架构模式的一种方式是，它是去掉了商业化以及 Web 服务规范（`WS`）和企业服务总线（`ESB`）感知负担的\
  \ `SOA`。基于微服务的应用程序倾向于简单、轻量级的协议（如 `REST`），而不是沉重的协议。它们还非常避免使用 `ESBs`，而是而是在微服务内部实现类似\
  \ `ESB` 的功能。微服务架构模式还拒绝了 `SOA` 的其他部分，例如规范模式（canonical schema）的概念。\n\n## 切换\n\n那么，是否可能从单体架构切换到微服务而不需要从零开始？这值得吗？Netflix、Amazon\
  \ 和 Twitter 等大公司都从单体转向微服务，并且没有返回的打算。\n\n架构的更改可以分阶段进行。基本上，是从你的单体应用程序中一个接一个提取微服务，直到完成。一个良好的架构选择可以让你的应用程序和组织变得更好。如果你正在考虑切换，将在接下来的章节中获得一份极佳的迁移指南。\n\
  \n# 第 6 章：拆分单体：轰击领域\n\n我们已经定义了什么是微服务以及这种架构解决了什么问题。我们还列出了采用微服务架构的许多优势。但我如何将我的单体应用程序迁移到微服务架构呢？我们如何应用这种模式？如何在不重写整个应用程序的情况下拆分单体？\n\
  \n我们将使用领域驱动设计（Domain-Driven Design）作为拆分单体的方法。领域驱动设计（`DDD`）是一种简化软件建模和设计的软件开发方法。\n\
  \n## 什么是领域驱动设计？\n\n领域驱动设计有很多优势：\n\n*   关注核心业务领域和业务逻辑。\n*   确保设计基于领域模型的最佳方式。\n* \
  \  技术团队与业务团队之间紧密协作的方式。\n\n为了理解领域驱动设计，我们需要解释并定义许多概念。\n\n### ### 上下文（Context）\n\n\
  形成事件、陈述或思想的设定的情境，并根据此可以对其进行完全理解。\n\n### ### 领域（Domain）\n\n用户应用程序的主题区域就是软件的领域。\n\n\
  ### ### 模型（Model）\n\n一种抽象系统，描述了领域的选方面，并可用于解决与该领域相关的问题。\n\n### ### 通用语言（Ubiquitous\
  \ Language）\n\n项目内部通信的共同语言。正如我们所看到的，设计模型是软件设计者、领域专家和开发者共同努力的结果；因此，它需要一种共同语言来进行交流。`DDD`\
  \ 要求必须使用通用语言。领域模型在图表、描述、演示、演讲和会议中使用通用语言。\n\n### ### 战略设计（Strategic Design）\n\n领域驱动设计解决业务方向背后的策略，而不只是技术方面。它有助于定义内部关系和预警反馈系统。在技术方面，战略设计通过为实现服务体系架构提供动机来保护每个业务服务。\n\
  \n为了维护领域模型的完整性，可以遵循多种原则，这些原则如下：\n\n#### #### 边界上下文（Bounded context）\n\n当你有不同的子模型时，当所有子模型结合在一起时，代码很难维护。你需要一个可以分配给单个团队的小模型。你可能需要收集相关的元素并对其分组。上下文通过应用这些条件，保持并维护为其子模型定义的领域术语含义。\n\
  \n这些领域术语定义了创建上下文边界的模型范围。\n\n\n\n\n边界上下文（Bounded context）看起来与你在上一节中学习的模块（module）非常相似。事实上，模块是边界上下文的一部分，边界上下文定义了子模型发生并开发的逻辑框架。而模块则组织了领域模型（domain\
  \ model）的元素，并体现在设计文档和代码中。\n\n现在，让我们来看一下我们一直在使用的餐桌预订示例。当你开始设计系统时，你会看到客人会访问应用程序，并针对选定的餐厅、日期和时间请求预订座位。然后，有一个后端系统会将预订信息通知餐厅；同样，餐厅也会更新其系统中的座位预订情况，因为餐厅也可以自己进行订座。所以，当你观察系统的细节时，你可以看到三个领域模型：\n\
  \n- 产品（Product）模型\n- 订单（Order）模型\n- 客户（Customer）模型\n\n![](img/6-myboutique-domain-models.png)\n\
  \n### MyBoutique 模型\n\n它们有自己的边界上下文，你需要确保它们之间的接口运行良好。\n\n## 轰炸 La Boutique（Bombarding\
  \ La Boutique）\n\n拆分应用程序将分多个步骤完成。\n\n### 代码库（Codebase）\n\n我们将开始为每个边界上下文创建包，然后将相关类移动到其中。在\
  \ NetBeans（以及其他 IDE）中，我们可以通过几次点击轻松地移动和重构代码。在移动代码的过程中，你可能会发现一些之前漏掉的新边界上下文。\n\n此时，保证我们的重构没有破坏应用程序的唯一方法就是\
  \ `TESTS`（测试）！！\n\n在小型代码库（如我们的应用程序）中进行重构和移动代码非常容易，只需要几分钟甚至几个小时。但在处理大型应用程序时，这将会变得非常困难，并需要几周或几个月。在拆分第一个服务之前，你可能不需要将所有代码分类到领域导向的包中，事实上，将精力集中在一个地方可能更有价值。这不需要采用“大爆炸式”的方法。这是一种可以一点一点、逐天完成的事情，而且我们有很多工具可以用来跟踪进度。\n\
  \n我们可以使用像 `Stan4j` 和 `Structure101` 这样的结构分析工具。\n\n## 与与公共（Dependencies and Commons）\n\
  \n当我们将部分代码移动到相应的包时，会遇到一些公共类（DTO 或工具类）……这些常用的类必须移动到专用的 `COMMONS` 包中。\n\n结构分析工具在此时非常有用。\n\
  \n接下来，我们将讨论领域拆分中最重要的元素：实体（Entities）和关系（Relationships）。\n\n## 实体（Entities）\n\n到为止，我们一直将代码分组为代表边界上下文的包；我们希望对数据库访问代码也这样做。\n\
  \n对于我们的数据库访问代码，我们已经为每个 `Entity` 准备了一个 `Repository`（仓库）。\n\n实体之间的关系向我们展示了表的外键关系，这是数据库级别的约束。\n\
  \n所有这一切都能帮助你理解表之间的耦合，这些耦合可能会跨越最终形成服务边界的范围。但我们如何切断这些联系呢？如果同一个表被多个不同的边界上下文使用，该怎么办？处理这类问题并不容易，而且有很多答案，但它是可行的。\n\
  \n回到一些具体的示例，让我们再次考虑我们的 Boutique。我们已经识别了三个边界上下文，并希望将它们变为三个独立的、相互交互的服务。我们将查看我们可能面临的问题以及潜在的解决方案。\n\
  \n### 示例：打破外键关系\n\n在我们的应用程序中，我们将产品信息存储在一个专门的表中，该表由 ORM 进行映射和管理。\n\n`OrderItem` 对象存储在它专门的表中，包含被订产品的引用和相应的订购数量。`OrderItem`\
  \ 表中的 `Product` 记录引用由外键约束组成。\n\n那么我们如何打破这种关系呢？嗯，我们需要在两个地方进行更改。首先，我们需要停止 Order 代码访问\
  \ Product 表，因为这张表属于 Product 边界上下文，一旦 Product 和 Order 成为各自独立的服务，我们就不希望发生数据库级别的集成。解决这个问题最快的方法是，与其让\
  \ Order 代码直接访问 Product 表，不如通过 Product 服务中的 API 调用暴露数据，供 Order 代码进行调用。这个 API 调用将是我们在网络上进行的远程调用的前奏，如图\
  \ 5-3 所示。\n\n![](img/5-post-removal-fk.png)\n\n移除外键关系后\n图 5-3. 移除外键关系后\n\n我们现在有两个数据库调用而不是一个，因为这两个服务是分离的，而在单体架构中我们只有一个调用。所以你现在一定在考虑性能问题了？！我可以告诉你的是，额外的调用会花费一些额外时间，但不会太巨大。你可以在拆分之前测试性能，这样在进行更改时你就就有清晰的可见度了。\n\
  \n但是外键关系呢？嗯，我们完全丢失了这种关系。这变成了一个现在需要在我们的结果服务中管理的约束，而不是在数据库级别管理。这可能意味着我们需要在服务之间实现我们自己的一致性检查，或者触发操作来清理相关数据。是否需要这样做通常不是技术人员可以做出的决择。例如，如果我们的\
  \ Order 服务包含一个 Product ID 列表，如果某个 Product 被删除而订单现在引用了一个无效的 Product ID，会发生什么？我们应该允许吗？如果允许，那么在显示订单时该如何表示呢？如果不允许，我们又如何检查这没有被违反呢？这些问题需要由定义系统行为方式的人来解答。\n\
  \n## 重构数据库（Refactoring Databases）\n\n### 拆分阶段\n\n我们使用边界上下文来定义数据库的拆分计划。\n\n由于任何重构必须分步骤进行，从一个数据库架构的单体应用迁移到多个各自拥有架构的服务时，不会发生大爆炸效应。我们建议你先拆分架构但保持服务在一起，然后再将应用程序代码拆分为微服务。\n\
  \n![](img/5-db-refactoring.png)\n\n服务分离阶段\n图 5-9. 服务分离阶段\n\n有了独立的数据库架构，我们可能会增加执行单个操作的数据库调用次数。以前我们可能通过单个\
  \ `SELECT` 语句获取所有需要的数据，现在我们可能需要从两个位置取回数据并在内存中进行连接。此外，当我们移动到两个架构时，会破坏事务完整性，这可能对我们的应用程序产生重大影响；我们将在讨论这一点。通过拆分架构但保持应用程序代码在一起，我们为自己提供了撤销更改或继续调整的能力，而不会影响我们服务的消费者。\n\
  \n## 事务边界（Transactional Boundaries）\n\n事务是非常有用的。它们允许我们说：*这些事件要么一起发生，要么一个都不发生*。当我们向数据库插入数据时，事务非常有用；它们允许我们一次更新多个表，同时知道如果发生任何错误，一切都将回滚，确保我们的数据不会进入不稳定状态。简单来说，事务允许我们将多个不同的活动组合在一起，使系统从一个一致状态移动到另一个一致状态。\n\
  \n\n\n事务不仅适用于数据库，尽管我们最常在数据库语文中使用它们。例如，消息中间件（Message brokers）长期以来一直允许你在事务内发布和接收消息。\n\
  \n在单体架构（monolithic schema）中，我们所有的创建或更新操作可能都在单一的事务边界内完成。当我们拆分数据库时，我们就失去了由单一事务所提供的安全性。\n\
  \n在我们现有的单体架构中，在单个事务内插入记录是在单个事务中完成的。\n\n但如果我们已经将其拆分为两个独立的架构，我们就丢失了这种事务安全性。我们现在跨越了许多分离的事务边界。如果其中一次插入失败，我们可以清晰地停止一切，使我们处于一致状态。但如果向第一个表的插入成功了，而向第二个表的插入失败了，会发生什么呢？\n\
  \n### 稍后重试\n\n在第一个表中完成插入这一事实对我们来说可能足够了，我们可能决定在以后某一天重试对第二个表的插入。我们可以将这部分操作放入队列或日志文件中，并在稍后重试。对于某些类型的操作来说，这样做是合理的，但我们必须假设重试可以解决问题。\n\
  \n在很多方面，这是所谓的**最终一致性**（eventual consistency）的另一种形式。与其使用事务边界来确保系统在事务完成时处于一致状态，我们不如接受系统会在未来的某个时间点自己进入到一致状态。这种方法对于可能运行时间很长的业务操作特别有用。\n\
  \n### 取消整个操作\n\n另一个选项是拒绝整个操作。在这种情况下，我们必须将系统恢复到一致状态。第二个表很容易处理，因为该插入失败了，但第一个表中已经有一个提交的事务。我们需要撤销这个事务。我们需要做的是发布一个**补偿事务**（compensating\
  \ transaction），启动一个新的事务来回滚刚刚发生的事情。对于我们来说，这可能简单地发布一个 `DELETE` 语句来删除在第一个表中插入的记录。然后，我们还需要通过\
  \ UI 反馈操作已失败。我们的应用程序可以在单体系统中处理这两个方面，但当我们拆分应用程序代码时，就必须考虑能做什么。处理补偿事务的逻辑是存在于客户服务、订单服务中，还是其他地方？\n\
  \n但如果我们的补偿事务失败了呢？这完全是有可能的。在这种情况下，你可能重试补偿事务，或者允许某些后台进程稍后清理不一致性。这可能仅仅是管理员人员可以访问的维护界面，或者一个自动化过程。\n\
  \n现在想一下，如果我们想要一致的不是一个或两个操作，而是三个、四个或五个，会发生什么？为每种失败模式处理补偿事务变得非常难以理解，更不用说实现了。\n\n###\
  \ 分布式事务\n\n手动编排补偿事务的替代方案是使用**分布式事务**。分布式事务试图在内部跨越多个事务，并使用某种称为**事务管理器**（transaction\
  \ manager）的整体控制过程来协调底层系统正在执行的各种事务。就像普通事务一样，分布式事务试图确保所有内容保持在一致状态，但在这种情况下，它试图在运行不同进程的多个不同系统中实现这一点，这些系统通常跨越网络边界进行通信。\n\
  \n处理分布式事务最常见的算法——特别是短生命周期事务，例如处理我们的客户订单时——是使用**两阶段提交**（two-phase commit）。在两阶段提交中，首先是投票阶段。在这个阶段中，分布式事务中的每个参与者（在此语文中也称为组\
  \ cohort）都会告诉事务管理器它认为本地事务是否可以进行。如果事务管理器收到了所有参与者的“是”票，它就会告诉他们全部继续并执行提交。只要有一个“否”票，事务管理器就足够向所有方发送回滚。\n\
  \n这种方法依赖于所有方停止，直到中央协调过程告诉他们继续。这意味着我们容易受到中断的影响。如果事务管理器宕机，挂起的事务将永远不会完成。如果某个组在投票期间未响应，一切都会阻塞。还有一种情况是如果投票后提交失败了。该算法中隐含着这样一个假设，即这种情况不会发生：如果一个组在投票期间说“是”，那么我们必须假设它会提交。组需要一种方法在某时间点让这个提交生效。这意味着这种算法并不是万无一失的——相反，它只是试图捕获大多数失败情况。\n\
  \n这种协调过程也意味着锁；也就是说，挂起的事务可以持有资源上的锁。资源上的锁会导致竞争，使得系统扩展变得困难得多，特别是在分布式系统的背景下。\n\n分布式事务已经针对特定的技术栈实现了实现，例如\
  \ Java 的事务 API（Transaction API），允许数据库和消息队列等异构资源都参与同一个总的事务。各种算法很难正确实现，因此我建议你不要尝试创建自己的。相反，如果这看起来像是你想要采取的路线，请对此主题进行大量研究，并看看是否可以使用现有的实现。\n\
  \n### 那么怎么办？\n\n所有这些解决方案都增加了复杂度。正如你所看到的，分布式事务很难正确实现，并且实际上会抑制扩展。通过补偿重试逻辑最终收敛的系统可能难以推理，并且可能需要其他补偿行为来修复数据中的不一致性。\n\
  \n当你遇到当前在单个事务内发生的业务操作时，问问自己是否真的需要这样做。它们可以在不同的、本地事务中发生，并依赖最终一致性的概念吗？这些系统构建和扩展起来要容易得多（我们将在第\
  \ 11 章中对此讨论）。\n\n如果你确实遇到了一个真的、非常想要保持一致的状态，请尽一切努力避免从一开始就将其拆分。努力努力吧。如果你真的需要进行拆分，请考虑从纯技术视角（例如数据库事务）转换出来，并实际上创建一个具体的概念来表示事务本身。这为你提供了一个手柄或钩子，可以在其上运行其他操作（如补偿事务），并提供监控和管理系统中这些更复杂概念的方法。例如，你可能会创建一个\
  \ `in-process-order`（进程内订单）的概念，这为你集中处理处理订单的所有逻辑提供了一个自然的位置。\n\n## 总结\n\n我们通过关注**边界上下文**（Bounded\
  \ Contexts）来分解系统，这是一种渐进式的方法。通过擅长发现这些边界并努力降低从一开始拆分服务的成本，我们可以继续扩展和演进我们的系统，以满足未来的任何需求。\n\
  \n\n\n现在我们将对代码进行拆分，使用我们在上一个章节中定义的切分线。\n\n## 将边界上下文（Bounded Contexts）应用于 Java 包\n\
  \n我们的类已经根据**组件类型**进行了分类，例如 `Repository`、`Service` 等。\n\n我们将每个组件移动到一个新的包中，该包将包含**边界上下文**（Bounded\
  \ Context）的名称。\n\n组件的名称实际上具有以下格式：\n\n![](img/7-old-format.png)\n组件的实际命名格式\n\n所以，在重构之后，名称变为：\n\
  \n![](img/7-new-format.png)\n组件的新命名格式\n\n在重命名所有组件后，我们将得到如下所示的项目树：\n\n![](img/7-project-structure.png)\n\
  以边界上下文作为包的项目结构\n\n等一下！等一下！`commons` 和 `configuration` 包的内容是什么？\n\n### commons 包的诞生\n\
  \n我没告诉过你们吗？呃，好的 :) 我确定我们说过，通用组件必须收集到一个专门的 `commons` 包中，该包将由所有的 **BC**（边界上下文）共享。好吧，给你们看看我的\
  \ `commons` 包里有什么：\n\n![](img/7-commons-content.png)\nCommons 包内容\n\n噢噢！这个 `dto`\
  \ 包是怎么什么？我们不是说过组件必须移动到它们对应的**边界上下文**吗？\n\n所以，如果 `Payment` 类专门属于 `Order` **BC**，那么\
  \ `PaymentDTO` 类必须自动位于 `order` 包中，而不是 `commons`。那么，为什么我们的 `DTO` 却没有遵循这条建议呢？我们在开玩笑吗？\n\
  \n答案显然是否定的！我们没有在开玩笑。我是**故意**这么做的，而不是由于失误。原因非常简单：\n\n当我们谈论微服务时，我们说在拆分之后，我们的微服务将相互通信。所以，让我们想象这种情况：`Order`\
  \ 想要通过给定的 Product ID 从 `Product` 微服务获取一个 `Product`。`Product` 中的 REST API 将返回一个 `ProductDTO`\
  \ 对象，该对象由 `Product` 记录的数据填充，并将被序列化为 JSON 返回给请求的服务（即 `Order`）。但如果它的格式对它来说是未知的，它如何处理接收到的\
  \ JSON 呢？答案是*它无法处理*，当 `ProductDTO` 仅存储在 `Product` 微服务中。\n\n另一个想法是在两个服务中都存储 `DTO`\
  \ 类，但这个想法对我来说是不够高效的，因为它会导致重复代码需要处理。想象一下我们需要更新 `DTO` 类的情况，在这种情况下我们将做两次相同的工作……\n\n\
  所以我发现的最好的主意是将 `DTO` 存储在 `commons` 中。这个解决方案将使共享和升级变得非常简单。\n\n除了 `dto` 包之外，我们还找到了一个\
  \ `domain` 包。\n\n什么？通用区域的领域（Domain）？\n\n不，它并不真的是一个领域，它只包含 **AbstractEntity** 类，这是一个通用类，作为每个\
  \ **BC** 中所有 `Entity` 类的父类。由于实体属于领域，我认为放置通用的 **AbstractEntity** 最合适的地方是 `commons.domain`\
  \ 包。\n\n最后，还有一个 `utils` 包，它将托管**工具**（Utility）类，例如，我们实际上有一个包含**常量**的 `Class` 类，看起来像这样：\n\
  \n```\npublic class Web {\n    public static final String API = \"/api\";\n}\n```\n\
  \n### configuration 包的诞生\n\n我们的微服务将是独立的 **Spring Boot** 应用。这些应用有许多非功能性需求，如激活 **Swagger**\
  \ 控制台、日志等。这些需求将由存储在 `configuration` 包中的组件来填充。所以到目前为止，我们只有一个 **SwaggerConfiguration**\
  \ 类。\n\n## 定位并打破 BC 关系\n\n### 定位 BC 关系\n\n这一步旨在打破**边界上下文**之间的依赖关系。为了能够打破它们，我们首先需要找到这些依赖关系。有很多方法可以找到它们，例如查看类图、源代码等。在上一个章节中，我们讨论了可以帮助我们突出单体应用中块之间依赖关系的工具。\n\
  \n我主要使用 **STAN**（又名 STAN4J），这是一个强大的 Java 结构分析工具。**STAN** 支持一组经过仔细选择的指标，适用于涵盖结构质量的最重要方面。它特别关注了视化依赖分析，这是结构分析的关键。\n\
  \n**STAN** 有两种变体：\n\n1. 作为 Windows 和 Mac OS 的独立应用程序，目标用户是通常不使用 IDE 的架构师和项目经理。\n\
  2. 作为 Eclipse 集成开发环境（IDE）的扩展，允许开发者快速探索他们想要的任何代码块的结构。\n\n是的！你说得对！我们将使用第二种选择：我安装了一个全新的\
  \ Eclipse IDE，并按照 [`stan4j.com/download/ide/`](http://stan4j.com/download/ide/)\
  \ 中的描述安装了插件。\n\n我们的单体是一个基于 Maven 的项目，因此它可以很容易地导入 Eclipse IDE。完成导入后，只需：\n\n1. 右键点击项目\n\
  2. 运行（Run As） > Maven Build\n3. 如果你已有 Maven 配置，请选择它\n4. 在 Goals（Goals）中，只需输入：`clean\
  \ install -DskipTests` 并运行\n5. 完成！\n\n接下来，对我们的项目进行结构分析：\n\n1. 右键点击项目\n2. 运行（Run\
  \ As） > Structure Analysis\n3. 嘿！结构图在这里！\n\n![](img/7-before-order-product.png)\n\
  使用 STAN 进行首次结构分析\n\n### 打破 BC 关系\n\n现在，我们将打破边界上下文之间的关系。我们可以从实体之间的关系开始。通常关系在表之间更为有效。在这里实体类被视为关系表（JPA\
  \ 概念），因此实体类之间的关系如下：\n\n* 多对关系\n* 一对多关系\n* 一一关系\n* 多对多关系\n\n更准确地说，我们不会打破属于同一个 **BC**\
  \ 的实体之间的关系，我们将打破跨 **BC** 的关系。例如，我们有 `OrderItem`（属于 `Order Context`）和 `Product`（属于\
  \ `Product Context`）之间的关系。\n\n在 Java 中，这种关系表示为：\n\n```\npublic class OrderItem extends\
  \ AbstractEntity {\n    @NotNull\n    @Column(name = \"quantity\", nullable = false)\n\
  \    private Long quantity;\n\n    @ManyToOne\n    private Product product;\n\n\
  \    @ManyToOne\n    private Order order;\n}\n```\n\n标记 `product` 字段的 `@ManyToOne`\
  \ 是这里的目标。\n\n如何打破关系？这，将块：\n\n```\n@ManyToOne\nprivate Product product;\n```\n\n\
  改为：\n\n```\nprivate Long productId;\n```\n\n好的，我们为什么选择 **Long** 类型来替换 **Product**\
  \ 类型？这很简单！**Long** 是 **Product** ID 的类型。\n\n太棒了！我们需要在 `Product` 类中执行相同的操作，如果 `OrderItem`\
  \ 和 `Product` 之间的关系是双向关系。\n\n好的 :) 当我们尝试构建项目（使用 `mvn clean install`）时，我们将得到编译错误。这是显而易见的，因为我们修改了\
  \ `OrderItem`，使用该类的许多组件必须意识到这些修改。在这里，是 `OrderItemService` 出了问题。\n\n让我们看看 `OrderItemService`\
  \ 类中带有错误的块，第一个是：\n\n\n\n\n\n```java\npublic OrderItemDto create(OrderItemDto orderItemDto)\
  \ {\n    log.debug(\"Request to create OrderItem : {}\", orderItemDto);\n\n    Order\
  \ order = this.orderRepository\n                        .findById(orderItemDto.getOrderId())\n\
  \                        .orElseThrow(() -> new IllegalStateException(\"The Order\
  \ does not exist!\"));\n\n    Product product = this.productRepository\n       \
  \                 .findById(orderItemDto.getProductId())\n                     \
  \   .orElseThrow(() -> new IllegalStateException(\"The Product does not exist!\"\
  ));\n    return mapToDto(\n        this.orderItemRepository.save(\n            new\
  \ OrderItem(\n                    orderItemDto.getQuantity(),\n                \
  \    product, \n                    order\n            )));\n}\n```\n\n在这里我们看到从\
  \ `ProductRepository` 获取了一个 `Product` 实例，并将其传递给 `OrderItem` 的构造函数。\n\n由于我们在 `OrderItem`\
  \ 类中不再有 `Product` 字段，而是将其更改为 `Product ID`，我们需要将 ID 传递给 `OrderItem` 构造函数，而不是 `Product`。\n\
  \n但我们已经说过，在 `Order` 边界上下文（Bounded Context）中将不再有 `Product` 对象了。那么我们之前如何谈论处理 `Product`\
  \ 和 `ProductRepository` 类呢？\n\n你忘记了吗？在 `Order` 边界上下文的作用范围内，我们有 `commons` 模块，它包含了\
  \ `ProductDTO`，我们可以免费使用 :D\n\n对于 `ProductRepository`，这显而易见，它将被一个 REST Client 取代，该客户端将从\
  \ `Product` 微服务收集 `Product` 数据并在需要时填充已知的 `ProductDTO` 对象。但在这里，我们只需要 `Product ID`\
  \ 来创建 `OrderItem` 实例。因此在这种情况下，我们不需要获取 Product 记录。\n\n第二个区块是将 `OrderItem` 映射到 `OrderItemDto`\
  \ 的方法：\n\n```java\npublic static OrderItemDto mapToDto(OrderItem orderItem) {\n\
  \    if (orderItem != null) {\n        return new OrderItemDto(\n              \
  \  orderItem.getId(),\n                orderItem.getQuantity(),\n              \
  \  orderItem.getProduct().getId(),\n                orderItem.getOrder().getId()\n\
  \        );\n    }\n    return null;\n}\n```\n\n该方法中必须删除 `Product` 的引用，因为它已经从 `OrderItem`\
  \ 类中删除了。我们不再拥有产品作为成员，但在 `OrderItem` 类中拥有 Product ID。因此，行 `orderItem.getProduct().getId()`\
  \ 必须更改为 `orderItem.getProductId()`。\n\n生成的 `OrderItemService` 将如下所示：\n\n```java\n\
  @RequiredArgsConstructor\n@Slf4j\n@Service\n@Transactional\npublic class OrderItemService\
  \ {\n\n    private final OrderItemRepository orderItemRepository;\n    private final\
  \ OrderRepository orderRepository;\n\n    public List<OrderItemDto> findAll() {\n\
  \        log.debug(\"Request to get all OrderItems\");\n        return this.orderItemRepository.findAll()\n\
  \                .stream()\n                .map(OrderItemService::mapToDto)\n \
  \               .collect(Collectors.toList());\n    }\n\n    @Transactional(readOnly\
  \ = true)\n    public OrderItemDto findById(Long id) {\n        log.debug(\"Request\
  \ to get OrderItem : {}\", id);\n        return this.orderItemRepository\n     \
  \               .findById(id).map(OrderItemService::mapToDto).orElse(null);\n  \
  \  }\n\n    public OrderItemDto create(OrderItemDto orderItemDto) {\n        log.debug(\"\
  Request to create OrderItem : {}\", orderItemDto);\n        Order order = this.orderRepository\n\
  \                            .findById(orderItemDto.getOrderId())\n            \
  \                .orElseThrow(() -> new IllegalStateException(\"The Order does not\
  \ exist!\"));\n\n        return mapToDto(\n                this.orderItemRepository.save(\n\
  \                        new OrderItem(\n                                orderItemDto.getQuantity(),\n\
  \                                orderItemDto.getProductId(),\n                \
  \                order\n                        )));\n    }\n\n    public void delete(Long\
  \ id) {\n        log.debug(\"Request to delete OrderItem : {}\", id);\n        this.orderItemRepository.deleteById(id);\n\
  \    }\n\n    public static OrderItemDto mapToDto(OrderItem orderItem) {\n     \
  \   if (orderItem != null) {\n            return new OrderItemDto(\n           \
  \         orderItem.getId(),\n                    orderItem.getQuantity(),\n   \
  \                 orderItem.getProductId(),\n                    orderItem.getOrder().getId()\n\
  \            );\n        }\n        return null;\n    }\n}\n```\n\n在这次重构之后，我们可以使用我们强大的工具\
  \ `STAN` 来检查我们的修改如何改变了项目的结构：\n\n![](img/7-stan-after-breaking-order-product.png)\n\
  \n切断 Order 和 Product 关系后的项目结构\n\n在生成的架构图中，你可以看到 `product` 和 `order` 包之间不再有链接了。太棒了！！\n\
  \n在同一个架构图中，我们可以看到 `customer` 和 `order` 包之间存在着紧密的关系。让我们在它们两个包中也执行相同的工作。\n\n经过一些检查，需要进行的修改如下：\n\
  \n1.  在 `customer` 包中：\n    a. Cart: `private Order order;` 将更改为 `private Long orderId;`\n\
  \    b. CartService: `Order` 引用将被更改为 `OrderDto`\n\n2.  在 `order` 包中：\n    a. Order:\
  \ `private Cart cart;` 将更改为 `private Long cartId;`\n    b. OrderService: `Cart`\
  \ 引用将被更改为 `CartDto`\n\n在完成这些修改后，我们仍然在 `CartService` 中有一个 `OrderService` 引用。正如我们所所述，这个\
  \ `OrderService` 将被一个 REST Client 取代，用于调用 `Order` 微服务暴露的 API。你可以在分析结构之前注释掉引用 `OrderService`\
  \ 的行。\n\n![](img/7-stan-after-full-break.png)\n\nBC 完全切断后的项目结构\n\n太棒了！我们完成了迁移之旅中最重的任务之一！\n\
  \n# 第 8 章：解决微服务的关注点和模式\n\n## 引言\n\n当我们处理架构和设计时，我们会立即开始考虑配方和模式。这些设计模式对于构建云端可靠、可扩展且安全的应用程序有用。\n\
  \n## 云模式\n\n我们将处理这些模式：\n\n*   外部化配置\n*   服务发现与注册\n*   断路器\n*   每个服务数据库\n*   API\
  \ 网关\n*   CQRS\n*   事件溯源\n*   日志聚合\n*   分布式追踪\n*   审计日志\n*   应用程序指标\n*   健康检查 API\n\
  \n### 服务发现与注册\n\n#### 背景与问题\n\n在微服务世界中，服务注册与发现起着重要作用，因为我们很可能运行多个服务实例，并且我们需要一种机制在不硬编码主机名或端口号的情况下调用其他服务。\n\
  \n\n\n\n在单体应用中，组件之间的调用是通过语言级别的调用完成的。但在微服务架构中，服务之间通常需要使用 `HTTP/REST`（或其他）调用来相互通信。为了发送请求，服务需要知道给定的服务实例的网络位置（IP\
  \ 地址和端口）。正如我们在前面的章节中提到的，由于许多因素（例如，不同的部署频率等），微服务的网络位置是动态分配的。此外，一个服务可能有多个实例，而且这些实例可能会因为自动扩缩容、故障等原因而发生动态变化。\n\
  \n因此，我们必须实现一种机制，使得给定服务的客户端能够向动态变化的服务实例集发送请求。\n\n服务的客户端如何发现服务实例的位置？服务的客户端如何感知服务的可用实例？\n\
  \n#### 解决方案\n\n我们可以创建一个服务注册中心（service registry），它是一个存储可用服务实例的数据库。其工作原理如下：\n\n- 当微服务实例启动时，将其网络位置注册到服务注册中心。\n\
  - 当微服务实例终止时，将其网络位置从服务注册中心移除。\n- 微服务实例的可用性通常通过心跳机制定期刷新。\n\n这种模式有两种变体：\n\n- **客户端发现模式（Client-side\
  \ Discovery pattern）**：请求服务（客户端）负责寻找可用服务实例的网络位置。客户端查询服务注册中心，然后使用某些 `load-balancing`（负载均衡）算法选择一个可用服务实例并发送请求。这种机制遵循\
  \ `client-side discovery pattern`。\n- **服务端发现模式（Server-side Discovery pattern）**：`server-side\
  \ discovery pattern` 建议客户端通过 `load balancer`（负载均衡器）向服务发送请求。负载均衡器负责查询服务注册并将每个请求转发到可用服务实例。因此，如果我们想遵循这种模式，我们需要拥有（或实现）上述\
  \ `load balancer`。\n\n## 外部化配置\n\n#### 背景与问题\n\n应用通常会使用一个或多个基础设施（消息中间件和数据库服务器等）以及第三方服务（支付网关、电子邮件和即时消息等）。这些服务需要配置信息（例如凭据）才能使用。这些配置信息存储在随应用一同部署的文件中。\n\
  \n在某些情况下，可以通过编辑这些文件来在应用部署后更改其行为。然而，配置的更改需要重新部署应用，这通常会导致不可接受的停机时间和和其他管理开销。\n\n本地配置文件也将配置限制在单个应用程序中，但有时在多个应用程序之间共享配置设置是有用的。例如，数据库连接字符串或相关应用程序集使用的队列和存储的\
  \ URL。\n\n我们的单体应用被拆分为许多微服务。所有这些微服务都需要以前提供给单体应用的配置信息。假设我们需要更新数据库 URL。此任务需要在所有微服务中完成。如果我们忘记在某处进行更新，可能会导致在部署期间不同实例使用不同的配置设置。\n\
  \n#### 解决方案\n\n将所有应用配置外部化，包括数据库凭据和网络位置。例如，我们可以将配置信息存储在外部，并提供一个接口，用于快速高效地读取和更新配置设置。我们可以将此配置存储称为\
  \ `Configuration Server`（配置服务器）。\n\n当微服务启动时，它从给定的 `Configuration Server` 读取配置。\n\
  \n## 电路器\n\n#### 背景与问题\n\n微服务主要使用 `HTTP REST` 请求进行通信。当一个微服务同步调用另一个服务时，始终存在另一个服务不可用、无法访问或高延迟导致其本质上无法使用的风险。失败的调用可能会资源耗尽，从而使调用服务无法处理其他请求。一个服务的故障可能会级联到整个应用程序中的其他服务。\n\
  \n#### 解决方案\n\n请求微服务应该通过代理调用远程服务，该代理的工作机制类似于电路断路器。当连续失败次数超过阈值时，断路器会跳闸，在超时期间，所有调用远程服务的尝试都将立即失败。超时过期后，断路器允许有限数量的测试请求通过。如果这些请求成功，断路器将恢复正常运行。否则，如果发生故障，超时期将重新开始。\n\
  \n断路器模式由 `Michael Nygard` 在他的著作《Release It!》中推广，它可以防止应用程序反复尝试执行可能失败的操作。它允许程序在不等待故障修复、或在未确定故障是长期存在的情况下浪费\
  \ CPU 周期的情况下继续运行。断路器模式还允许应用程序检测故障是否已解决。如果问题似乎已得到修复，应用程序就可以尝试调用该操作。\n\n## 每个服务一个数据库\n\
  \n#### 背景与问题\n\n在微服务架构世界中，服务必须是松耦合的，以便它们能够独立地进行开发、部署和扩展。\n\n大多数服务需要在某种数据库中持久化数据。在我们的应用中，`Order\
  \ Service`（订单服务）存储订单信息，`Customer Service`（客户服务）存储客户信息。微服务应用中的数据库架构是怎样的？\n\n####\
  \ 解决方案\n\n将每个微服务的持久化数据对该服务私有，并仅通过其 API 访问。\n\n服务的数据库实际上是该服务实现的一部分。其他服务无法直接访问它。\n\
  \n有几种不同的方法可以保持服务的持久化数据私有。你不需要为每个服务配置数据库服务器。例如，如果你使用关系型数据库，选项有：\n\n- `Private-tables-per-service`（每个服务私有表）——每个服务拥有一组表，只能由该服务访问\n\
  - `Schema-per-service`（每个服务一个模式）——每个服务都有一个该服务私有的数据库模式\n- `Database-server-per-service`（每个服务一个数据库服务器）——每个服务都有自己的数据库服务器。\n\
  \n`Private-tables-per-service` 和 `Schema-per-service` 的开销最低。每个服务一个模式非常有吸引力，因为它使得所有权更加清晰。某些高吞吐服务可能需要自己的数据库服务器。\n\
  \n创建强制这种模块化的边界是一个好主意。例如，你可以为每个服务分配不同的数据库用户 ID，并使用数据库访问控制机制（如授权）。如果没有某种强制封装的边界，开发者总是会被诱绕过服务的\
  \ API 直接访问其数据。\n\n## API 网关\n\n#### 背景与问题\n\n对于我们的精品店，假设我们正在实现产品详情页。假设我们需要开发多个版本的产品详情用户界面：\n\
  \n- 针对桌面和移动浏览器的 HTML5/JavaScript 版 UI —— HTML 由服务器端 Web 应用生成\n- 原生 Android 和 iPhone\
  \ 客户端 —— 这些客户端通过 `REST APIs` 与服务器交互\n\n此外，`MyBboutique` 必须通过 `REST API` 暴露产品详情以供第三方应用程序使用。\n\
  \n\n\n\n产品详情 UI 可以显示许多关于产品的信息。例如：\n\n* 产品的基本信息，如名称、描述、价格等。\n* 您对该产品的购买历史\n* 可用性\n\
  * 购买选项\n* 与此产品经常一起购买的其他物品\n* 购买此产品的客户购买的其他物品\n* 客户评论\n\n由于 `MyBoutique` 遵循微服务架构模式，产品数据分布在多个服务中：\n\
  \n* `Product Service` - 产品的基本信息，如名称、描述、价格、客户评论、产品可用性等\n* `Order service` - 产品的购买历史..\n\
  * `Customer service` - 客户、购物车..\n\n因此，显示产品详情的代码需要从所有这些服务获取信息。\n\n基于微服务的应用程序的客户端是如何访问各个服务的？\n\
  \n解决方案\n\n实现一个 API 网关（API gateway），它作为所有客户端的单一入口点。API 网关通过两种方式之一处理请求。某些请求被简单地代理/路由到相应的服务。其他请求则通过分发（fanning\
  \ out）到多个服务来处理。\n\nAPI 网关并不是提供一种一律的型的 API，而是为每个客户端暴露不同的 API。API 网关还可能实现安全功能，例如，验证客户端是否有权执行该请求。\n\
  \n### CQRS\n\n背景与问题\n\n在传统的数据管理系统中，命令（对数据的更新）和查询（对数据的请求）在单个数据存储的同一组实体上执行。这些实体可以是关系型数据库（如\
  \ `SQL Server`）中一个或多个表中的行子集。\n\n通常在这些系统中，所有的创建、读取、更新和删除（`CRUD`）操作都应用于实体的同一种表示形式。例如，代表客户的数据传输对象（`DTO`）由数据访问层（`DAL`）从数据存储中检索并显示在屏幕上。用户更新\
  \ `DTO` 的某些字段（可能通过数据绑定），然后由 `DAL` 将该 `DTO` 保存回数据存储中。同一个 `DTO` 同时用于读操作和写操作。\n\n当仅对数据操作中应用了有限的业务逻辑时，传统的\
  \ `CRUD` 设计运行良好。开发工具提供的脚手架机制（Scaffold mechanisms）可以快速地创建数据访问代码，然后根据需要对其进行自定义。\n\n\
  然而，传统的 `CRUD` 方法具有一些缺点：\n\n* 它通常意味着数据的读表示和写表示之间存在不匹配，例如额外的列或属性，即使它们不是操作的一部分，也必须被正确更新。\n\
  * 在协作领域中，当多个参与者并行操作同一组数据且记录在数据存储中被锁定时，存在数据竞争的风险。或者在使用乐观锁时，由于并发更新导致更新冲突。随着系统复杂性和吞吐量的增长，这些风险会增加。此外，由于对数据存储和数据访问层的负载，以及检索信息所需查询的复杂性，传统方法会对性能产生负面影响。\n\
  * 它会使安全和权限管理变得复杂，因为每个实体都受到读写操作的影响，这可能会导致数据在错误的上下文中暴露。\n\n解决方案\n\n命令查询责任分离（`CQRS`）是一种模式，它通过分离接口将读取数据的操作（查询）与更新数据的操作（命令）隔离开。这意味着用于查询和更新的数据模型是不同的。这些模型可以因此被隔离。\n\
  \n与基于 `CRUD` 的系统中使用的单一数据模型相比，基于 `CQRS` 的系统中为数据使用独立的查询和更新模型简化了设计和实现。然而，一个缺点是，与 `CRUD`\
  \ 设计不同，`CQRS` 代码无法使用脚手架机制自动生成。\n\n读取数据的查询模型和写入数据的更新模型可以访问同一个物理存储，也许通过使用 `SQL` 视图或即时生成投影（projections）。\n\
  \n读存储可以是写存储的只读副本，或者读、写存储具有完全不同的结构。使用读存储的多个只读副本可以极大地提高查询性能和应用程序 UI 的响应速度，特别是在只读副本位于应用程序实例近位置的分布式场景下。\n\
  \n### 事件溯源 (Event sourcing)\n\n背景与问题\n\n大多数应用程序都处理数据，典型方法是应用程序通过在用户操作数据时更新它来维护数据的当前状态。例如，在传统的创建、读取、更新和删除（`CRUD`）模型中，典型的数据处理过程是从存储中读取数据，对其进行某些修改，并使用新值更新数据的当前状态——通常通过使用锁定数据的事务来实现。\n\
  \n`CRUD` 方法具有一些局限性：\n\n* `CRUD` 系统直接对数据存储执行更新操作，由于其所需的处理开销，可能会减慢性能和响应速度，并限制扩展性。\n\
  * 在具有许多并发用户的协作领域中，数据更新冲突更有可能发生，因为更新操作发生在单条数据上。\n* 除非有额外的审计机制在单独的日志中记录每个操作的细节，否则将会丢失历史。\n\
  \n解决方案\n\n事件溯（`Event Sourcing`）模式定义了一种处理数据操作的方法，该方法由事件序列驱动，每个事件都记录在只追加存储（append-only\
  \ store）中。应用程序代码向事件存储发送一系列事件，这些事件命令式地描述了数据上发生的每个动作，并在事件存储中对其进行持久化。每个事件代表了数据的一组变化（例如\
  \ `AddedItemToOrder`）。\n\n事件被持久化在事件存储中，该存储器作为关于数据当前状态的系统记录（权威数据源）。事件存储通常发布这些事件，以便消费者可以收到通知并在需要时进行处理。例如，消费者可以启动任务，将事件中的操作应用到其他系统，或执行完成该操作所需的任何其他关联操作。注意，生成事件的应用程序代码与订阅事件的系统是解耦的。\n\
  \n事件存储发布的事件的典型用途是在应用程序更改实体时维护实体的物化视图，并与外部系统集成。例如，一个系统可以维护所有客户订单的物化视图，用于填充 UI 的部分。当应用程序添加新订单、在订单中添加或删除项目以及添加运输信息时，描述这些变化的事件可以被处理并用于更新物化视图。\n\
  \n此外，在任何时间点，应用程序都可以读取事件历史，并通过回放和消费与该实体相关的所有事件来物化该实体的当前状态。这可以在处理请求时按需发生以物化领域对象，或者通过计划任务执行，以便将实体状态存储为物化视图以支持表示层。\n\
  \n### 日志聚合 (Log aggregation)\n\n背景与问题\n\n在微服务架构中，我们的应用程序由运行在不同服务器和位置的多个服务和服务实例组成。请求经常跨越多个服务实例。\n\
  \n\n\n\n\n当我们使用单体架构时，应用程序会生成一个日志流，这些日志通常存储在一个日志文件/目录中。现在，每个服务实例都会生成它自己的日志文件。\n\n\
  当日志被拆分后，如何理解应用程序的行为并排故障问题呢？\n\n#### 解决方案\n\n使用集中式日志服务来聚合每个服务实例的日志。当日志聚合后，用户可以对其进行搜索和分析。他们还可以配置告报，当日志中出现特定消息时触发告报。\n\
  \n## 分布式追踪\n\n#### 背景与问题\n\n在微服务架构中，请求往往跨越多个服务。每个服务通过执行一个或多个操作来处理请求，例如数据库查询、发布消息等。\n\
  \n当请求失败时，如何理解其行为并排故障问题？\n\n#### 解决方案\n\n对服务进行代码埋点，以：\n\n*   为每个外部请求分配一个唯一的外部 `Request\
  \ ID`\n*   将外部 `Request ID` 传递给所有参与处理该请求的服务\n*   在所有日志消息中包含外部 `Request ID`\n*  \
  \ 在集中式服务中记录处理外部请求时所执行的请求和操作信息（例如开始时间、结束时间）\n\n### 审计日志\n\n#### 背景与问题\n\n在微服务架构中，除了日志系统外，我们还需要对服务及其运行情况有更高的可见性。\n\
  \n如何理解用户和应用程序的行为并排故障问题？\n\n#### 解决方案\n\n例如，我们可以在数据库或某些专门的专用日志系统中记录用户活动。\n\n### 应用指标\n\
  \n#### 背景与问题\n\n在微服务架构中，除了我们已有的指标外，我们还需要对服务和正在发生的情况有更高的可见性。\n\n如何理解并描述应用程序的行为？\n\
  \n#### 解决方案\n\n推荐的解决方案是建立一个集中式的指标服务，收集并存储每个服务操作的决策支持统计数据。微服务可以将它们的指标信息推送到指标服务。另一方面，指标服务也可以从微服务拉取指标。\n\
  \n## 健康检查 API\n\n#### 背景与问题\n\n监控 Web 应用和后端是一是一良好的实践，通常也是业务需求，以确保它们可用且运行正常。然而，监控运行在云端的服务比监控本地服务更困难。许多因素会影响应用程序，例如网络延迟、底层计算和存储系统的性能与可用性，以及它们之间的网络带宽。由于任何这些因素，服务可能会完全或部分故障。因此，你必须定期验证服务是否运行正常，以确保所需的可用性。\n\
  \n#### 解决方案\n\n通过向应用程序上的端点发送请求来实现健康检查监控。应用程序应该执行必要的检查，并返回其状态指示。\n\n健康监控检查通常结合了两个因素：\n\
  \n*   应用程序或服务在响应健康验证端点请求时执行的检查（如果有）。\n*   执行健康验证检查的工具或框架对结果进行的分析。\n\n响应码表示应用程序的状态，可选表示它所使用的任何组件或服务。延迟或响应时间检查由监控工具或框架执行。\n\
  \n### 服务间的安全：访问令牌 (Access Token)\n\n#### 背景与问题\n\n在微服务架构并使用 API 网关模式的情况下。应用程序由许多服务组成。API\
  \ 网关是请求的单一入口。\n\n#### 解决方案\n\nAPI 网关对请求进行验证并转发给服务。API 网关是请求的单一入口。\n\n服务之间如何通信？\n\
  \n## 下一步？\n\n现在我们已经拆分了单体架构并发现了一些实用的模式，我们可以开始构建它们。\n\n# 第 9 章：实现模式\n\n## 引言\n\n现在，我们已经拆分了单体架构并发现了一些实用的模式，我们可以开始构建它们。为了在架构中实现这些模式，我们将使用一些方便操作的库。**Spring\
  \ Cloud** 提供了许多我们可以使用的生产就绪组件。\n\n## 外部化配置\n\n在这一步，我们需要一个集中式的配置存储。**Spring Cloud**\
  \ 支持对连接到它的应用程序进行配置配置管理。应用程序将在启动时从服务器的文件系统或 Git 仓库检索其属性。\n\n### 第 1 步：生成 Config Server\
  \ 项目\n\n我们将创建一个 `config-server`：一个使用 [Initializr](https://start.spring.io/) 的新 Spring\
  \ Boot 应用，我们需要添加以下依赖：\n\n*   Config Server\n*   Actuator\n\n### 第 2 步：定义 Config\
  \ Server 的属性\n\n在资源文件夹下的 `config-server/src/main/resources/application.yml` 文件中我们需要添加以下属性：\n\
  \n```\nserver:\n  port: 8888\n\nspring:\n  profiles:\n    active: native\n  application:\n\
  \    name: config-server\n  cloud:\n    config:\n      server:\n        native:\n\
  \          search-locations: classpath:/configurations\n```\n\n1.  专用于 Config Server\
  \ 的端口。\n2.  Config Server 中的 `native` 配置配置文件从本地类路径或文件系统加载配置文件，不使用 Git。\n3.  应用程序名称\
  \ - 该服务将用此名称被其他服务识别。\n4.  存储配置文件的目录。\n\n### 第 3 步：创建集中式配置\n\n我们需要将集中式配置文件存放在 **Config\
  \ Server** 的 `src/main/resources/configurations/` 文件夹下。属性文件的命名必须与使用它的应用程序相同，但我们会在需要时陆续添加特定文件。到目前，我们只需创建一个属性文件（位于\
  \ `config-server` 的 `src/main/resources/configurations/` 中的 `application.yml`），它是全局的，其属性继承到我们稍后添加的所有特定属性文件中。在主属性文件中，我们将定义其他服务所在的位置，并告诉\
  \ **Cloud Config** 不要覆盖在特定微服务中设置的系统属性：\n\n```yaml\nname:\n  value: nebrass\nspring:\n\
  \  cloud:\n    config:\n      override-system-properties: false\n```\n\n### 第 4\
  \ 步：启用 Config Server 引擎\n\n\n\n\n\n`Spring Initializr` 已经为 Spring Boot 应用创建了主类。为了让我们的应用程序成为\
  \ `Config Server`（配置中心），除了 `@SpringBootApplication` 注解外，我们只需要给主类加上 `@EnableConfigServer`\
  \ 注解。\n\n```\n@EnableConfigServer\n@SpringBootApplication\npublic class ConfigserverApplication\
  \ {\n\n    public static void main(String[] args) {\n        SpringApplication.run(ConfigserverApplication.class,\
  \ args);\n    }\n}\n```\n\n`ConfigserverApplication.java`\n\n### 第 5 ：运行它！\n\n我们的\
  \ `Config Server` 已准备就绪。只需运行主方法，您就可以使用应用名称和 spring-profile 名称作为路径参数来访问配置：\n\n[`localhost:8888/APP/PROFILE`](http://localhost:8888/APP/PROFILE)。\n\
  \n要获取全局配置，可以使用任何不存在的应用名称和任何 profile 名称。如果存在适用于给定应用和 profile 的文件，它将与全局属性合并。\n\n![](img/9-config-server-global.png)\n\
  \n使用不存在的应用名称和 profile 获取全局配置\n\n### 第 6 ：Spring Cloud Config Client\n\n我们的微服务将作为\
  \ `Config Server` 的客户端。为了实现这一点，我们需要在服务的 `pom.xml` 中添加 Config Client starter 依赖：\n\
  \n```\n<dependency>\n   <groupId>org.springframework.cloud</groupId>\n   <artifactId>spring-cloud-starter-config</artifactId>\n\
  </dependency>\n```\n\n而且，我们还需要告诉服务去哪里寻找 `Config Server`。为了做到这一点，我们需要定义 `spring.cloud.config.uri`\
  \ 属性。\n\n当我们谈论定义应用属性时，我首先想到的的是在 `application.properties` 或 `application.yml` 文件中定义它们。但在处理\
  \ Spring Cloud 且您的应用程序配置存储在远程配置服务器（如我们案例中的 `Config Server`）时，情况就不一样了，我们使用 `bootstrap.yml`\
  \ 或 `bootstrap.properties` 文件。\n\n这个文件到底是什么？在 `application.yml` 中存储属性与在 `bootstrap.yml`\
  \ 中存储属性有什么区别？\n\nSpring Cloud 应用通过创建一个 `bootstrap` 上下文（启动上下文）来运行，它是主应用程序的父上下文。默认情况下，它负责从外部源加载配置属性，并解密本地外部配置文件中的属性。\n\
  \n注意，`bootstrap.yml` 或 `bootstrap.properties` 文件通常包含启动配置。它通常包含两个属性：\n\n* 配置服务器的位置\
  \ (`spring.cloud.config.uri`)\n* 应用名称 (`spring.application.name`)\n\n启动时，`Spring\
  \ Cloud Config Client` 会携带应用名称向 `Config Server` 发起 HTTP 请求并取回其配置。\n\n`application.yml`\
  \ 或 `application.properties` 文件包含标准的应用配置——通常是默认配置，因为在启动过程中获取的任何配置将覆盖在此处定义的配置。\n\n\
  因此，在我们案例中，对于给定的微服务，`bootstrap.yml` 的内容如下：\n\n```\nspring:\n  cloud:\n    config:\n\
  \      uri: http://localhost:8888\n  application:\n    name: microservice-name\n\
  ```\n\n`bootstrap.yml`\n\n如果我们对某些属性有一些默认值，我们可以在 `application.properties` 或 `application.yml`\
  \ 文件中定义它们。\n\n### 服务发现与注册\n\n对于服务发现模式（Service Discovery Pattern），我们将使用 `Eureka`，它是\
  \ `Spring Cloud Netflix` 项目的一个组件。\n\n`Eureka` 类似于注册中心，我们可以在这里找到想要访问的服务。我们的微服务实例将注册到\
  \ Eureka 实例，并带有它们的主机、端口和其他元数据。如果任何其他服务需要与某个微服务通信，它只需要向 Eureka 请求位置以建立连接即可。\n\n它是如何工作的？客户端必须向\
  \ Eureka 注册自己。之后，它们必须通过定期发送心跳包来更新状态。如果某个 Eureka 客户端的心跳包丢失，Eureka 服务器将其注册表中的该实例标记为“DOWN”。在客户端正常关闭时，它必须发送取消请求以从从注册表中移除。要查找其他服务，客户端必须获取注册表。为了能够获得服务状态的可视化反馈，Eureka\
  \ 自带了一个非常实用的仪表板。\n\n`Eureka` 由微服务组成：\n\n* 服务注册中心 (`Eureka Server`)\n* 一个在注册中心进行注册的\
  \ REST 服务 (`Eureka Client`)\n\n### 第 1 步：生成 Eureka Server 项目骨架\n\n我们将创建 `discovery-service`：使用\
  \ [Spring Initializr](https://start.spring.io/) 创建一个新的 Spring Boot 应用，我们需要添加以下依赖：\n\
  \n* Eureka Server\n* Actuator\n* Config Client <== Config Client 是用于从 `Config Server`\
  \ 获取配置必需的。\n\n### 第 2 步：定义 Eureka Server 的属性\n\n`Eureka Server` 的 `bootstrap.yml`\
  \ 内容为：\n\n```\nspring:\n  cloud:\n    config:\n      uri: http://localhost:8888\
  \ <1>\n  application:\n    name: discovery-service <2>\n```\n\n`discovery-service/src/main/resources/bootstrap.yml`\n\
  \n1. 我们的应用程序需要从 `Config Server` 获取配置，因此我们的服务需要 Config Server 的 uri。\n2. 应用名称——服务将使用该名称被其他服务识别。\n\
  \n### 第 3 步：创建 Eureka Server 的主配置\n\nservice-discovery 的主配置文件必须在 Config Server 上创建，其名称值为\
  \ `spring.application.name`。\n\n在第 2 步中，我们将 `discovery-service` 定义为应用名称。因此，存储在 `Config\
  \ Server` 的主文件将如下：\n\n```\nserver:\n  port: 8761 <1>\n\neureka:\n  instance:\n \
  \   hostname: localhost <2>\n  client:\n    registerWithEureka: false <3>\n    fetchRegistry:\
  \ false <3>\n    serviceUrl:\n      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/\n\
  ```\n\n`config-server/src/main/resources/configurations/discovery-service.yml`\n\
  \n1. Eureka Server 端口\n2. Eureka Server 主机名\n3. Eureka Server 不需要注册或获取，因为它本身。\n\n\
  ### 第 4 ：启用 Eureka Server\n\n`Spring Initializr` 已经为 Spring Boot 应用创建了主类。为了让我们的应用程序成为\
  \ Eureka Server，除了 `@SpringBootApplication` 注解外，我们只需要给主类加上 `@EnableEurekaServer`\
  \ 注解。\n\n```\n@EnableEurekaServer\n@SpringBootApplication\npublic class EurekaApplication\
  \ {\n\n\tpublic static void main(String[] args) {\n\t\tSpringApplication.run(EurekaApplication.class,\
  \ args);\n\t}\n}\n```\n\n`EurekaApplication.java`\n\n### 第 5 ：更新 Config Server 的全局\
  \ application.yml\n\n现在我们有一个所有服务都需要知道的服务中心。\n\n因此，此步骤的目的是将 Eureka 的属性添加到 Config\
  \ Server 的全局 `application.yml` 中。\n\n```\neureka:\n  instance:\n    hostname: localhost\n\
  \  client:\n    service-url:\n      defaultZone: http://localhost:8761/eureka/\n\
  \nname:\n  value: nebrass\n\nspring:\n  cloud:\n    config:\n      override-system-properties:\
  \ false\n```\n\n`config-server/src/main/resources/configurations/application.yml`\n\
  \n### 第 6：运行它！\n\n我们的 `Eureka Server` 已准备就绪。但它只有在重启 Config Server 之后才能启动，这样新插入的\
  \ `service-discovery.yml` 才会生效。\n\n启动 `Eureka Server` 后，您可以访问它的仪表板，前往 [`localhost:8761/`](http://localhost:8761/)。\n\
  \n![](img/9-eureka-dashboard.png)\n\nEureka Server Dashboard\n\n\n\n\n要查看全局属性如何在\
  \ `service-discovery` 的特定属性中进行合并，请访问 [`localhost:8888/service-discovery/PROFILE`](http://localhost:8888/service-discovery/PROFILE)。\n\
  \n![](img/9-service-discovery-properties.png)\n\nservice-discovery 生成的属性\n\n###\
  \ 第 7 步：使用 Ribbon 实现客户端负载均衡\n\n在 `Order Service` 中，正如我们在`第 7 章` 中提到的，将使用 REST 调用而不是旧单体架构中的语言级调用来与\
  \ `Product Service` 通信。REST 调用将使用 Spring 的 `RestTemplate` 组件。\n\n`RestTemplate`\
  \ 需要 REST 资源的 `URL` 作为输入。`URL` 中一个非常重要的元素是服务的 `HOST` 和 `PORT`，这些值是动态变化的，且不能保证是静态的。但是，每当服务获得新的\
  \ IP 地址（由于故障、重启甚至是该服务新实例的到达）时，`Eureka Server` 总是能感知到这些变化，并告诉我们给定服务所在的位置。\n\n在这一步，我们可以利用注册中心提供的一项强大功能：将\
  \ `Service Name` 解析为其 `Network Location`。\n\n我们可以通过 `@LoadBalanced` 注解将 `RestTemplate`\
  \ 注册为一个 `Spring Bean`。带有 `@LoadBalanced` 注解的 `RestTemplate` 内部会使用 `Ribbon LoadBalancer`\
  \ 来解析 `Service Name`，并使用可用实例之一调用 REST 端点。\n\n```\n@Configuration\npublic class ServiceConfiguration\
  \ {\n\n    @Bean\n    @LoadBalanced\n    public RestTemplate restTemplate() {\n\
  \        return new RestTemplate();\n    }\n\n}\n```\n\n`ServiceConfiguration.java`\n\
  \n`Ribbon` 是一个客户端负载均衡器，可以让你对 HTTP 和 TCP 客户端的行为进行大量的控制。它带有 `Eureka Client` Starter\
  \ 开发包。\n\n通过这种自动的服务注册和发现机制，我们不需要担心运行了多少个实例，以及它们的主机名和端口等。\n\n## 分布式追踪\n\n为了更好地理解正在发生的情况，我们需要能够在请求通过多个协作的微服务时对其进行追踪，并测量参与响应请求的每个微服务中的处理时间。\n\
  \n一个请求的追踪事件必须被收集、分组并以易于理解的方式呈现。这正是 Zipkin 的作用所在！\n\n分布式追踪将所有单个服务调用连接起来，并通过唯一生成的\
  \ ID 将它们与业务请求关联起来。\n\n我们将使用 `Spring Cloud Sleuth` 和 `Zipkin`：\n\n* `Spring Cloud\
  \ Sleuth` – 作为 `Spring Cloud 项目` 的可用库。它允许通过为每次调用添加 trace ID 以及在应用程序请求点添加 span ID，来追踪后续微服务的进度。\n\
  * `Zipkin` – 分布式追踪系统，帮助收集在独立服务之间传播的每个请求的时间数据。它有一个简单的管理控制，我们可以在那里找到后续服务生成的计时统计数据的可视化。\n\
  \n### 第 1 步：获取 Zipkin Server\n\n最快的方法是获取最新的发布版本作为自包含的可执行 jar 包：\n\n```\ncurl -sSL\
  \ https://zipkin.io/quickstart.sh | bash -s\njava -jar zipkin.jar\n```\n\n你将看到一个\
  \ Spring Boot 应用程序日志 :) 是的！`Zipkin Server` 是基于 `Spring Boot` 的应用程序。当它启动时，你会看到：\n\
  \n```\n... INFO [ main] o.s.b.w.e.u.UndertowServletWebServer: Undertow started on\
  \ port(s) 9411 (http) ...\n... INFO [ main] z.s.ZipkinServer                   \
  \ : Started ZipkinServer in 4.196 seconds ...\n```\n\n一旦服务器运行，你可以通过以下地址的 `Zipkin\
  \ UI` 查看追踪：\n\n```\nhttp://localhost:9411/zipkin/\n```\n\n### 第 2 步：列出要添加到我们微服务的依赖项\n\
  \n在创建微服务时，为了实现分布式追踪，我们需要添加 `Sleuth` 和 `Zipkin Client` 依赖。\n\n#### Sleuth\n\n我们有一个用于\
  \ `Sleuth` 的 Spring Cloud Starter 项目，需要添加到 `pom.xml` 中的 Maven 依赖是：\n\n```\n<dependency>\n\
  \    <groupId>org.springframework.cloud</groupId>\n    <artifactId>spring-cloud-starter-sleuth</artifactId>\n\
  </dependency>\n```\n\n一旦你添加了 `Sleuth` starter 并启动服务，你可以在日志中看到类似的内容：\n\n```\n2018-07-30\
  \ .. INFO [product-service,c01f99,c01f99,true] 18582 .. ProductController..\n```\n\
  \nSleuth 在日志中包含了来自日志框架 `MDC`（映射诊断上下文）特征的模式 `[appname,traceId,spanId,exportable]`。\n\
  \n该模式由相应的参数组成：\n\n* `appname`: 记录 `span` 的应用程序名称。\n* `traceId`: 包含该 `span` 的延迟图\
  \ ID。\n* `spanId`: 特定操作的 ID。\n* `exportable`: 日志是否应该导出到 Zipkin - 如果没有 Zipkin Client\
  \ 依赖，此 `exportable` 将始终为 `false`。\n\n#### Zipkin Client\n\n我们有一个用于 `Zipkin` 的 Spring\
  \ Cloud Starter 项目，需要添加到 `pom.xml` 中的 Maven 依赖是：\n\n```\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
  \    <artifactId>spring-cloud-starter-zipkin</artifactId>\n</dependency>\n```\n\n\
  并且我们需要全局属性中添加以下项：\n\n```\nspring:\n  sleuth:\n    sampler:\n      probability: 1\n\
  ```\n\n这意味着 100% 的追踪信息将导出到 `Zipkin`。\n\n一旦 `Zipkin` starter 在类路径中，当你启动服务时，它会将追踪发送到\
  \ `Zipkin Server`。\n\n但是 `Zipkin Client` 如何定位我们的 `Zipkin Server` 呢？\n\n答案很简单，`Zipkin\
  \ Client` 默认指向 `localhost:9411`（即 `Zipkin Server` 的 URL）。你可以通过定义新属性 `spring.zipkin.baseUrl`\
  \ 来更改服务的位置。\n\n一旦添加了这些依赖，当微服务通信时，在 [`localhost:9411/zipkin/`](http://localhost:9411/zipkin/)\
  \ 的 `Zipkin Dashboard` 上，我们可以看到这样的：\n\n![](img/9-zipkin-example.png)\n\nZipkin Dashboard\n\
  \n我知道你在搜索这些值。别担心，我做了一个小示例来生成这些追踪，以便有一个 `Zipkin Dashboard` 的示例。稍后会有真实的追踪，现在只是列出每个模式使用的组件\n\
  \n## 健康检查 API\n\n对于这种模式，我们有一个现成的优秀库：`Spring Boot Actuator`：`Spring Boot Actuator`\
  \ 提供了多个端点用于监控和与应用程序交互。它通过提供内置端点来实现，你也可以构建自己的端点。\n\n要在项目中使用 Actuator，只需在 `pom.xml`\
  \ 中添加 Maven 依赖：\n\n```\n<dependency>\n    <groupId>org.springframework.boot</groupId>\n\
  \    <artifactId>spring-boot-starter-actuator</artifactId>\n</dependency>\n```\n\
  \n就这些！！如果你启动应用程序并访问 [`localhost:8080/actuator/`](http://localhost:8080/actuator/)，你将看到暴露的\
  \ `Actuator` 端点的概述：\n\n![](img/9-actuator-demo.png)\n\n暴露的 Actuator 端点概述\n\n## 熔断器\n\
  \n`Spring Cloud Netflix` 栈有一个可以帮助我们轻松实现 `Circuit Breaker` 模式的库：它是 `Hystrix`。\n\n\
  ### 第 1 步：向项目添加 Maven 依赖\n\n需要添加到我们每个微服务 `pom.xml` 中的 Maven 依赖为：\n\n```\n<dependency>\n\
  \    <groupId>org.springframework.cloud</groupId>\n    <artifactId>spring-cloud-starter-netflix-hystrix</artifactId>\n\
  </dependency>\n```\n\n### 第 2 步：启用断路器\n\n\n\n\n\n为了启用熔断器（Circuit Breaker），我们需要在微服务的主类（Main\
  \ Class）上添加 `@EnableCircuitBreaker` 注解：\n\n```\n@EnableCircuitBreaker\n@SpringBootApplication\n\
  public class OrderServiceApplication {\n\n    public static void main(String[] args)\
  \ {\n        SpringApplication.run(CatalogServiceApplication.class, args);\n   \
  \ }\n}\n```\n\n`OrderServiceApplication.java`\n\n### 步骤 3：应用超时和降级方法\n\n在我的业务场景中，某些情况下需要`订单服务（Order\
  \ Service）`调用`产品服务（Product Service）`来获取特定产品 ID 的信息。\n\n在`订单服务`中，正如我们在`第 7 章`中提到的，将使用\
  \ Spring 的 `RestTemplate` 组件通过 REST 调用与`产品服务`进行通信。\n\n推荐的实践之一是将调用 `RestTemplate`\
  \ 组件的方法封装在同一个类中；该类将作为`远程`服务的`本地客户端（local client）`\n\n在`订单服务`中，`ProductServiceClient`\
  \ 看起来如下：\n\n```\n@Slf4j\n@Service\npublic class ProductServiceClient {\n\n    private\
  \ final RestTemplate restTemplate;\n\n    public ProductServiceClient(RestTemplate\
  \ restTemplate) {\n        this.restTemplate = restTemplate;\n    }\n\n    @HystrixCommand(fallbackMethod\
  \ = \"getDefaultProductById\") <1>\n    public Optional<ProductDto> getProductById(Long\
  \ productId) {\n        ResponseEntity<ProductDto> productResponse = restTemplate\n\
  \                .getForEntity(\"http://product-service/api/product/{id}\", <2>\n\
  \                        ProductDto.class,\n                        productId);\n\
  \n        if (productResponse.getStatusCode() == HttpStatus.OK) {\n            return\
  \ Optional.ofNullable(productResponse.getBody());\n        } else {\n          \
  \  log.error(\"Unable to get product with ID: \" + productId\n                 \
  \   + \", StatusCode: \" + productResponse.getStatusCode());\n            return\
  \ Optional.empty();\n        }\n    }\n\n    Optional<ProductDto> getDefaultProductById(Long\
  \ productId) { <3>\n        log.info(\"Returning default ProductById for product\
  \ Id: \" + productId);\n\n        ProductDto productDto = new ProductDto();\n  \
  \      productDto.setId(productId);\n        productDto.setName(\"UNKNOWN\");\n\
  \        productDto.setDescription(\"NONE\");\n\n        return Optional.ofNullable(productDto);\n\
  \    }\n\n}\n```\n\n`ProductServiceClient.java`\n\n1. 我们对进行 REST 用的方法添加了 `@HystrixCommand`\
  \ 注解，这样如果它在规定时间内没有收到响应，调用将超时并触发配置的降级方法。降级方法应该定义在同一个类中，并具有相同的签名。\n2. `Eureka Client`\
  \ 将将 `product-service` 解析为可用实例的地址。\n3. 在降级方法 `getDefaultProductById()` 中，我们创建了一个带有请求\
  \ `productId` 的空 `ProductDTO`。\n\n### 步骤 4：在 Actuator 端点中启用 Hystrix Stream\n\n为了能够监控熔断器（Circuit\
  \ Breakers），我们需要在 `Actuator Endpoint` 中启用 `Hystrix Stream`。这可以通过向每个启用了 `Hystrix`\
  \ 的微服务中添加此属性来实现，该属性位于 `Config Server` 中的配置文件中。\n\n例如；我们的 `order-service.yml` 配置文件将如下所示：\n\
  \n```\nserver:\n    port: 9990\n\nmanagement:\n  endpoints:\n    web:\n      exposure:\n\
  \        include: \"*\"\n```\n\n`config-server/src/main/resources/configurations/order-service.yml`\n\
  \n该属性实际上启用并暴露了所有可用的 `Actuator` 端点，我们强大的 `Hystrix` 端点也将包含其中。\n\n### 步骤 5：使用 Hystrix\
  \ Dashboard 监控熔断器\n\n一旦我们为 `Order-Service` 添加了 Hystrix 启动，我们就可以通过 `Actuator` 端点\
  \ [`http://localhost:9990/actuator/hystrix.stream`](http://localhost:9990/actuator/hystrix.stream)\
  \ 以事件流的形式获取熔断状态，因为我们的 `Order-Service` 运行在 9990 端口。\n\n`Spring Cloud` 还提供了一个很好的仪表板来监控\
  \ `Hystrix commands` 的状态。\n\n让我们创建一个带有 `Eureka Discovery`（又名 `Eureka Client`）、`Config\
  \ Client` 和 `Hystrix Dashboard` 启动器的 Spring Boot 应用程序：\n\n```\n<dependency>\n  \
  \  <groupId>org.springframework.cloud</groupId>\n    <artifactId>spring-cloud-starter-netflix-eureka-client</artifactId>\n\
  </dependency>\n<dependency>\n    <groupId>org.springframework.cloud</groupId>\n\
  \    <artifactId>spring-cloud-starter-config</artifactId>\n</dependency>\n<dependency>\n\
  \    <groupId>org.springframework.cloud</groupId>\n    <artifactId>spring-cloud-starter-netflix-hystrix-dashboard</artifactId>\n\
  </dependency>\n```\n\n接下来，我们需要在主类上添加 `@EnableHystrixDashboard` 注解。\n\n```\n@EnableHystrixDashboard\n\
  @SpringBootApplication\npublic class HystrixDashboardApplication {\n\tpublic static\
  \ void main(String[] args) {\n\t\tSpringApplication.run(HystrixDashboardApplication.class,\
  \ args);\n\t}\n}\n```\n\n`HystrixDashboardApplication.java`\n\n我们 `Hystrix Dashboard`\
  \ 应用程序的配置文件是：\n\n```\nserver:\n    port: 8988\n```\n\n`config-server/src/main/resources/configurations/hystrix-dashboard.yml`\n\
  \n运行我们的 `Hystrix Dashboard`，然后访问 [`http://localhost:8988/hystrix`](http://localhost:8988/hystrix)\
  \ 查看仪表板：\n\n![9-dashboard]\n\nHystrix Dashboard\n\n现在在 Hystrix 首页输入 `http://localhost:9990/actuator/hystrix.stream`\
  \ 作为流 URL，并将 Order Service 作为标题，然后点击 Monitor 按钮。\n\n现在调用 `order-service`，你可以看到熔断状态以及调用成功和失败的次数等。\n\
  \n![9-hystrix-order-service]\n\n订单服务的 Hystrix 示例\n\n## API 网关 (API Gateway)\n\n\
  `API 网关`（即边缘服务）是客户端的单一入口。API 网关以两种方式处理请求：某些请求被直接代理到相应的服务；其他请求通过分发到多个服务来处理。\n\n我们将使用\
  \ `Spring Cloud Netflix Zuul` 项目。该工具提供了微服务中常用的路由机制，用于在单一 facade 后隐藏多个服务。\n\n###\
  \ 步骤 1：生成 API 网关项目\n\n我们将创建 `gateway-service`：使用 [Spring Initializr](https://start.spring.io/)\
  \ 创建一个新的 Spring Boot 应用程序，我们需要添加以下依赖：\n\n* Zuul\n* Config Client\n* Eureka Discovery\n\
  * Sleuth\n* Actuator\n\n`Zuul` 提供三个基础组件：路由（routes）、谓词（predicates）和过滤器（filters）。\n\
  \n* **Route** 是网关的基本单元。包含目标 URI 以及定义的谓词和过滤器列表。\n* **Predicate** 负责匹配传入 HTTP 请求的任何内容，如头或参数。\n\
  * **Filter** 可以在发送前后修改请求和响应。\n\n所有这些组件都可以通过属性进行设置。因此，我们需要在配置服务器创建 `gateway-service.yml`\
  \ 并定义路由。\n\n### 步骤 2：启用 Zuul 功能\n\n接下来，我们需要在主类上添加 `@EnableZuulProxy` 注解。\n\n```\n\
  @EnableZuulProxy\n@SpringBootApplication\npublic class ApiGatewayApplication {\n\
  \n\tpublic static void main(String[] args) {\n\t\tSpringApplication.run(ApiGatewayApplication.class,\
  \ args);\n\t}\n}\n```\n\n`ApiGatewayApplication.java`\n\n### 步骤 3：定义路由规则\n\n我们需要定义路由。为了让\
  \ `order-service` 在我们的网关通过 `/order/**` 路径可用，我们需要定义一个匹配该 `path` 并对应 `serviceID` 的路由，因为它已注册在\
  \ **Eureka** 中。\n\n\n\n\n```yaml\nserver:\n  port: 8222\nzuul:\n  routes:\n    order:\n\
  \      path: /order/**\n      serviceId: order-service\n    product:\n      path:\
  \ /product/**\n      serviceId: product-service\n    customer:\n      path: /customer/**\n\
  \      serviceId: customer-service\n```\n\n`config-server/src/main/resources/configurations/gateway-service.yml`\n\
  \n### 步骤 4：使用 Swagger2 在网关上启用 API 规范\n\n当微服务启用了 `Swagger` 时，它会在路径 `/v2/api-docs`\
  \ 下暴露 `Swagger API` 文档。\n\n这里的思路是在 `API Gateway` 上部署一个 `Swagger2 UI`，用于聚合由启用了 swagger\
  \ 的微服务暴露的 `Swagger Resources`。为了实现这一点，我们需要在 `gateway-service` 内部实现 `SwaggerResourcesProvider`\
  \ 接口。这个 `Bean` 负责聚合微服务的 Swagger 资源的位置。\n\n从 `ZuulRoutes` 获取所需位置的 `SwaggerResourcesProvider`\
  \ 实现如下：\n\n```java\n@Configuration\npublic class ProxyApi {\n\n    private final\
  \ ZuulProperties zuulProperties;\n\n    public ProxyApi(ZuulProperties zuulProperties)\
  \ {\n        this.zuulProperties = zuulProperties;\n    }\n\n    @Primary\n    @Bean\n\
  \    public SwaggerResourcesProvider swaggerResourcesProvider() {\n        return\
  \ () -> {\n            List<SwaggerResource> resources = new ArrayList<>();\n  \
  \          zuulProperties.getRoutes()\n                    .values()\n         \
  \           .forEach(route -> resources.add(createSwaggerResource(route)));\n  \
  \          return resources;\n        };\n    }\n\n    private SwaggerResource createSwaggerResource(ZuulRoute\
  \ route) {\n        SwaggerResource swaggerResource = new SwaggerResource();\n \
  \       swaggerResource.setName(route.getServiceId());\n        swaggerResource.setLocation(\"\
  /\" + route.getId() + \"/v2/api-docs\");\n        swaggerResource.setSwaggerVersion(\"\
  2.0\");\n        return swaggerResource;\n    }\n}\n```\n\n`ProxyApi.java`\n\n###\
  \ 步骤 5：运行它！\n\n现在，我们示例微服务的 Swagger UI 将以下地址可用：\n\n```\nhttp://localhost:8060/swagger-ui.html\n\
  ```\n\n## 日志聚合与分析\n\n对于日志聚合，我们将使用著名的 ELK 栈。那么，什么是 ELK Stack 呢？“ELK” 是三个开源项目的缩写：Elasticsearch、Logstash\
  \ 和 Kibana。\n\n![](img/9-elk-stack.png)\n\nELK 栈图标\n\n*   `Elasticsearch` 是一个搜索和分析引擎。\n\
  *   `Logstash` 是一个服务器端的数据处理流水线，它可以同时从多个源摄取数据、进行转换，然后将其发送到类似 Elasticsearch 的“存储”中。\n\
  *   `Kibana` 允许用户使用图表和图形可视化 Elasticsearch 中的数据。\n\n这些工具结合在一起最常用于分布式系统的日志集中收集和分析。ELK\
  \ 栈之所以流行，是因为它满足了日志分析领域的需求。\n\n我们在微服务中使用 ELK 的用例如下：\n\n![](img/9-elk-spring-cloud.png)\n\
  \n我们微服务架构中 ELK 栈的用例\n\n我们所有的微服务都将其各自的日志推送到 `Logstash`，由它使用 `Elasticsearch` 对其进行索引。索引后的日志稍后可以被\
  \ `Kibana`get。\n\n我们的微服务将使用 `Logback`：它是市场上最流行的日志框架之一。`Logback` 比 `Log4j` 更快的实现，提供了更多的配置选项，并在归档旧日志文件方面更加灵活。\n\
  \nLogback 架构由三个类组成：`Logger`、`Appender` 和 `Layout`。\n\n*   `Logger` 是日志消息的上下文。这是应用程序交互以创建日志消息的类。\n\
  *   `Appender` 将日志消息放置在最终目的地。一个 `Logger` 可以有多个 `Appender`。我们通常认为 `Appenders` 是附着于文本文件，但\
  \ `Logback` 要比此强大得多。\n*   `Layout` 为输出准备消息。`Logback` 支持创建自定义类来格式化消息，并为现有的类提供了健壮的配置选项。\n\
  \n### 步骤 1：安装 Elasticsearch\n\n*   从 [`www.elastic.co/downloads/elasticsearch`](https://www.elastic.co/downloads/elasticsearch)\
  \ 下载 `Elasticsearch` 压缩包。\n\n```bash\nwget https://artifacts.elastic.co/downloads/elasticsearch/elasticsearch-6.3.2.zip\n\
  ```\n\n*   解压（unzip）\n\n```bash\nunzip elasticsearch-6.3.2.zip\n```\n\n*   运行它！\n\
  \n```bash\ncd elasticsearch-6.3.2\n./bin/elasticsearch\n```\n\n启动后，你可以通过 [`localhost:9200`](http://localhost:9200)\
  \ 访问 Elasticsearch。\n\n你将得到类似的内容：\n\n![](img/9-elasticsearch-9200.png)\n\nElasticsearch\
  \ 索引页\n\n### 步骤 2：安装 Kibana\n\n*   从 [`www.elastic.co/downloads/Kibana`](https://www.elastic.co/downloads/Kibana)\
  \ 下载适用于你操作系统（我的情况下是 OS X）的相应 `Kibana` 发行版。\n\n```bash\nwget https://artifacts.elastic.co/downloads/kibana/kibana-6.3.2-darwin-x86_64.tar.gz\n\
  ```\n\n*   解压存档\n\n```bash\ntar xvzf kibana-6.3.2-darwin-x86_64.tar.gz\n```\n\n\
  *   运行它！\n\n```bash\ncd elasticsearch-6.3.2\n./bin/elasticsearch\n```\n\n\n\n\n\
  ```xml\n<dependency>\n    <groupId>net.logstash.logback</groupId>\n    <artifactId>logstash-logback-encoder</artifactId>\n\
  \    <version>5.1</version>\n</dependency>\n<dependency>\n    <groupId>ch.qos.logback</groupId>\n\
  \    <artifactId>logback-core</artifactId>\n</dependency>\n<dependency>\n    <groupId>ch.qos.logback</groupId>\n\
  \    <artifactId>logback-classic</artifactId>\n</dependency>\n```\n\n*   `logstash-logback-encoder`:\
  \ 提供了 logback 编码器、布局和适配器（enders），用于以 JSON 格式记录日志。\n\n*   `logback-core` + `logback-classic`:\
  \ 它们可以被视为大幅改进的 `log4j` 版本。此外，`logback-classic` 原生实现了 `SLF4J API`，你可以轻松地在 logback\
  \ 和其他日志框架（如 `log4j` 或 `java.util.logging`）之间进行切换。\n\n## 为我们的微服务添加 Logback 配置文件\n\
  \n在向微服务添加 `Maven` 依赖项后，我们需要添加一个 `LogbackConfiguration` 文件：\n\n```java\n@Configuration\n\
  public class LogbackConfiguration {\n\n    private static final String LOGSTASH_APPENDER_NAME\
  \ = \"LOGSTASH\";\n    private static final String ASYNC_LOGSTASH_APPENDER_NAME\
  \ = \"ASYNC_LOGSTASH\";\n\n    private final Logger LOG = LoggerFactory.getLogger(LoggingConfiguration.class);\n\
  \    private final LoggerContext CONTEXT = (LoggerContext) LoggerFactory.getILoggerFactory();\n\
  \n    private final String appName;\n    private final String logstashHost;\n  \
  \  private final Integer logstashPort;\n    private final Integer logstashQueueSize;\n\
  \n    public LogbackConfiguration(\n            @Value(\"${spring.application.name}\"\
  ) String appName,\n            @Value(\"${logstash.host}\") String logstashHost,\n\
  \            @Value(\"${logstash.port}\") Integer logstashPort,\n            @Value(\"\
  ${logstash.queue-size}\") Integer logstashQueueSize) {\n\n        this.appName =\
  \ appName;\n        this.logstashHost = logstashHost;\n        this.logstashPort\
  \ = logstashPort;\n        this.logstashQueueSize = logstashQueueSize;\n\n     \
  \   addLogstashAppender(CONTEXT);\n    }\n\n    private void addLogstashAppender(LoggerContext\
  \ context) {\n        LOG.info(\"Initializing Logstash logging\");\n\n        LogstashTcpSocketAppender\
  \ logstashAppender = new LogstashTcpSocketAppender();\n        logstashAppender.setName(LOGSTASH_APPENDER_NAME);\n\
  \        logstashAppender.setContext(context);\n        String customFields = \"\
  {\\\"servicename\\\":\\\"\" + this.appName + \"\\\"}\";\n\n        //更多文档请访问：https://github.com/logstash/logstash-logback-encoder\n\
  \        LogstashEncoder logstashEncoder = new LogstashEncoder();\n\n        //\
  \ 设置 Logstash appender 配置\n        logstashEncoder.setCustomFields(customFields);\n\
  \        logstashAppender.addDestinations(\n                new InetSocketAddress(this.logstashHost,\
  \ this.logstashPort)\n        );\n\n        ShortenedThrowableConverter throwableConverter\
  \ = new ShortenedThrowableConverter();\n        throwableConverter.setRootCauseFirst(true);\n\
  \        logstashEncoder.setThrowableConverter(throwableConverter);\n        logstashEncoder.setCustomFields(customFields);\n\
  \n        logstashAppender.setEncoder(logstashEncoder);\n        logstashAppender.start();\n\
  \n        // 为了性能，将 appender 封装在 Async appender 中\n        AsyncAppender asyncLogstashAppender\
  \ = new AsyncAppender();\n        asyncLogstashAppender.setContext(context);\n \
  \       asyncLogstashAppender.setName(ASYNC_LOGSTASH_APPENDER_NAME);\n        asyncLogstashAppender.setQueueSize(this.logstashQueueSize);\n\
  \        asyncLogstashAppender.addAppender(logstashAppender);\n        asyncLogstashAppender.start();\n\
  \n        context.getLogger(\"ROOT\").addAppender(asyncLogstashAppender);\n    }\n\
  }\n```\n\nLogbackConfiguration.java\n\n1.  从应用程序配置属性中注入值 - 这些值可以从本地属性或 `Config Server`\
  \ 加载。\n\n2.  创建一个 `LogstashTcpSocketAppender`，它将日志发送到我们的 `Logstash` 服务器。\n\n3. \
  \ 在日志事件负载中发送自定义字段，其中包含 `servicename` - 该字段将使我们能够知道事件是从哪个微服务接收的。\n\n4.  为了性能目的，将\
  \ appender 封装在 Async appender 中。\n\n5.  在根日志器中注册 appender 的封装。\n\n### 步骤 5：将 Logstash\
  \ 属性添加到 Config Server\n\n上一步中注入的 `logstash.host`、`logstash.port` 和 `logstash.queue-size`\
