  ```bash\nkubectl apply -f install/kubernetes/istio-demo.yaml\n```\n\n### 验证安装\n\n\
  为了确保 Istio 组件已正确安装，需要安装这些 Kubernetes 服务：`istio-pilot`, `istio-ingressgateway`, `istio-policy`,\
  \ `istio-telemetry`, `prometheus`, `istio-galley` 以及（可选的）`istio-sidecar-injector`：\n\
  \n```bash\nkubectl get svc -n istio-system\n... (此处省略表格内容，以保持格式清晰)\n```\n\n对于已列出的\
  \ Kubernetes 服务，我们将找到对应的 Pods：\n\n```bash\nkubectl get pods -n istio-system\n...\
  \ (此处省略 Pod 列表)\n```\n\n\n\n\n-   手动使用 `Istioctl-CLI` 工具：手动注入会修改控制器配置，例如 `deployment`。它通过修改\
  \ pod 模板 spec 来，使得该 deployment 的所有 pod 在创建时都带有注入的 sidecar。添加、更新或删除 sidecar 需要修改整个\
  \ deployment。\n\n### 自动 Sidecar 注入\n\n要启用自动 sidecar 注入（Automatic Sidecar Inject），只需为\
  \ Kubernetes 命名空间添加 `istio-injection` 标签即可：例如在 `default` 命名空间中启用它：\n\n```\nkubectl\
  \ label namespace default istio-injection=enabled --overwrite\n```\n\n现在，当创建一个 pod\
  \ 时，Envoy sidecar 会自动注入到其中。\n\n### 手动 Sidecar 注入\n\n使用集群内配置将 sidecar 注入到 deployment\
  \ 中。<1>\n\n```\nistioctl kube-inject -f samples/bookinfo/platform/kube/bookinfo.yaml\
  \ \\\n            --output bookinfo-injected.yaml\n\nkubectl apply -f bookinfo-injected.yaml\n\
  ```\n\n这两个命令可以通过一条命令完成：\n\n```bash\nkubectl create -f <(istioctl kube-inject -f\
  \ samples/bookinfo/platform/kube/bookinfo.yaml)\n```\n\n或者使用：\n\n```bash\nistioctl\
  \ kube-inject -f samples/bookinfo/platform/kube/bookinfo.yaml | kubectl apply -f\
  \ -\n```\n\n这些命令会将 Istio Envoy sidecar 注入到 Kubernetes `Deployment` 对象中。\n\n对于 `details-v1`\
  \ 微服务的示例 `Deployment`，如下所示：\n\n```yaml\napiVersion: extensions/v1beta1\nkind: Deployment\n\
  metadata:\n  name: details-v1\nspec:\n  replicas: 1\n  template:\n    metadata:\n\
  \      labels:\n        app: details\n        version: v1\n    spec:\n      containers:\n\
  \      - name: details\n        image: istio/examples-bookinfo-details-v1:1.8.0\n\
  \        imagePullPolicy: IfNotPresent\n        ports:\n        - containerPort:\
  \ 9080\n```\n\n注入 Istio 之前的示例 Deployment\n\n注入 Istio 后的 `Deployment` 看起来如下：\n\n\
  ```yaml\napiVersion: extensions/v1beta1\nkind: Deployment\nmetadata:\n  creationTimestamp:\
  \ null\n   name: details-v1\nspec:\n   replicas: 1\n  strategy: {}\n   template:\n\
  \     metadata:\n      annotations:\n        sidecar.istio.io/status: '...'\n  \
