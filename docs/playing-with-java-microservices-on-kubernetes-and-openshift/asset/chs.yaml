  \n### 序图\n\n一次经典购物之旅的序图如下：\n\n![](img/customer-sequence-diagram.jpg)\n\n客户的序图\n\n\
  ## 为应用程序编码\n\n在完善了一些 UML 部分之后，我们就可以开始为应用程序编写代码。\n\n但在动手编码之前，让我们列出我们将要使用的技术栈。\n\n\
  ### 介绍技术栈\n\n在本书中，我们只实现电子商务应用程序的后端，因此我们的技术栈将是：\n\n- Java `1.8+`\n- Maven `3.0+`\n\
  - Spring Boot `2.x`\n\n#### Java 8\n\nJava Standard Edition 8 是一个重大特性版本，于 2014 年\
  \ 3 月 18 日发布。\n\nJava 8 引入了：\n\n- Lambda 表达式\n- 方法引用\n- 默认方法（接口方法）\n- 新的 Stream\
  \ API\n- Optional\n- 新的日期/时间 API\n- Nashorn，新的 JavaScript 引擎\n- 移除永久代（Permanent\
  \ Generation）\n- 以及许多其他特性……\n\n是的，你可能想我们为什么使用 Java 8 而不是 Java 9 甚至 10？选择 Java 8\
  \ 是因为它与我们要处理的框架和库兼容性最好的版本。\n\n#### Maven\n\n我们将基于[官方网站](http://maven.apache.org)\
  \ 对 Maven 的正式介绍：\n\nMaven 是一个意丁语单词，意为“知识的积累器”，最初是为了尝试简化 Jakarta Turbine 项目中的构建过程而启动。有几个项目，每个项目都有自己的\
  \ Ant 构建文件，且它们都略有不同，JAR 包被提交到 CVS。我们想要一种标准的方式来构建项目，清晰定义项目的组成部分，一种发布项目信息的方法以及在多个项目之间共享\
  \ JAR 包的方法。\n\n结果是一个现在用于构建和管理任何 Java 项目的工具。我们希望我们创建的东西能让 Java 开发者的日常工作变得更简单，并通常有助于理解任何\
  \ Java 项目。\n\nMaven 的主要目标是让开发者能在尽可能短的时间理解开发工作的完整状态。为了实现这一目标，Maven 尝试解决以下几个领域的问题：\n\
  \n* 使构建过程变得简单\n* 提供统一的构建系统\n* 提供高质量的项目信息\n* 提供开发最佳实践指南\n* 允许无缝迁移到新功能\n\n![](img/maven-logo.png)\n\
  \nApache Maven Logo\n\n#### Spring Boot\n\nSpring Boot 能够轻松创建可以“直接运行”的独立生产级 Spring\
  \ 应用。我们对 Spring 平台和第三方库有自己的观点，因此你可以以最少的麻烦开始。大多数 Spring Boot 应用程序很少需要 Spring 配置。\n\
  \n特性：\n\n* 创建独立的 Spring 应用\n* 直接嵌入 Tomcat、Jetty 或 Undertow（无需部署 WAR 文件）\n* 提供有见地的“启动器”\
  \ POM 来简化你的 Maven 配置\n* 尽可能地自动配置 Spring\n* 提供生产就绪的功能，如指标、健康检查和外部配置\n* 绝对不生成代码，也不需要\
  \ XML 配置\n\n\n\n\nSpring Boot 遵循“约定优于配置”的范式。Spring Boot 替换了所有基于 XML 的配置，并为使用 Spring\
  \ Framework 提供了注解（Annotations）。你可以很快使用极少的注解启动应用程序。这对开发者非常有帮助，对团队生产力将产生极大的积极影响。\n\
  \n![](img/2-spring-logo.png)\n\n由 Pivotal 提供的 Spring\n\n## NetBeans IDE\n\nApache\
