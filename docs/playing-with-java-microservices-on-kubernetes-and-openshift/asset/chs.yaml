  软件应用程序面临的主要风险是运行时更新，这些更新可能会破坏应用程序。例如，`OS` 的更新可能包含许多更新，包括可能因不兼容更新而影响运行应用程序的库。\n\n\
  通常情况下，同一台主机上还会有其他软件（数据库、代理等）与我们的应用程序共存。它们都共享相同的 `OS` 和库。因此，即使某个更新没有直接导致应用程序崩溃，也可能导致其他任何服务发生崩溃。\n\
  \n尽管这些更新具有风险，但考虑到它们在安全和稳定性方面的优势（通过更新中提供的 Bug 修复和功能增强），我们无法拒绝它们。但是，我们可以对应用程序及其环境进行一些测试，以查看更新是否会导致回归。如果我们的应用程序非常巨大，这项任务可能会非常繁重。\n\
  \n# 解决方案：容器与容器化\n\n**别难心！！** 有一种解决方案，我们可以使用 `containers`，它是单个操作系统内部的一种隔离分区。它们提供了与虚拟机许多许多的益处，例如安全性、存储和网络隔离，而所需的硬件资源要少得多。`Containers`\
  \ 非常棒，因为它们的启动和终止速度更快。\n\n`Containerization` 允许对资源利用进行隔离和跟踪。这种隔离保护了我们的应用程序免受与主机 `OS`\
  \ 更新相关的许多风险。\n\n![](img/10-vm-vs-container.png)\n\n## 容器 vs 虚拟机\n\n容器对开发者和系统管理员都有许多益处。\n\
  \n*   **一致的环境：** 容器让开发者能够创建与其它应用程序隔离的可预测环境。容器还可以包含应用程序所需的软件依赖项，例如特定版本的编程语言运行时环境和其他软件库。从开发者的角度来看，无论应用程序最终部署在何处，这一切都保证是一致的。这转化为了生产力：开发者和\
  \ IT Ops 团队花费更少的时间调试和诊断环境差异，花费更多的时间为用户交付新功能。这意味着 Bug 更少，因为开发者现在可以在开发和测试环境中做出假设，并确定这些假设在生产环境中会成立。\n\
  *   **随处运行：** 容器几乎可以在任何地方运行，极大地简化了开发和部署：在 Linux、Windows 和 Mac 操作系统上；在虚拟机或裸机上；在开发者的机器或本地数据中心；当然，还有公有云中。无论你想在何处运行软件，都可以容器。\n\
  *   **隔离：** 容器在 OS 级别虚拟化 CPU、内存、存储和网络资源，为开发者提供了一个逻辑上与其他应用程序隔离的沙箱化 OS 视图。\n\n最后，容器促进了微服务开发方法，因为它们提供了一个轻量且可靠的环境来创建和运行服务，这些服务可以部署到生产或开发环境，而无需多机器环境的复杂性。\n\
  \n有许多容器格式可用。Docker 是一种流行的开源容器格式。\n\n## 介绍 Docker\n\n### 什么是 Docker？\n\nDocker 是一个供开发者和系统管理员使用容器**开发、部署和运行**应用程序的平台。使用\
  \ Linux 容器部署应用程序被称为容器化化。\n\n![](img/docker-logo.png)\n\nDocker 标志\n\n容器化变得越来越流行，是因为容器具有：\n\
  \n*   **灵活性：** 即使是最复杂的应用程序也可以容器化。\n*   **轻量级：** 容器利用并共享宿主机内核。\n*   **可交换性：** 你可以随时部署更新和升级。\n\
  *   **可移植性：** 你可以在本地构建、部署到云端并在任何地方运行。\n*   **可扩展性：** 你可以增加并自动分发容器副本。\n*   **可堆叠性：**\
  \ 你可以垂直且随时堆叠服务。\n\n### 镜像与容器\n\n容器是通过运行镜像来启动的。一个 `image` 是一个可执行包，包含了运行应用程序所需的所有内容——代码、运行时、库、环境变量和配置文件。\n\
  \n一个 `container` 是镜像的运行时实例——即镜像在内存中执行时变成的样子（即带有状态的镜像或用户进程）。你可以使用 `docker ps` 命令查看正在运行的容器列表，就像在\
  \ Linux 中做的一样。\n\n## 安装与首次上手\n\n### 安装\n\n为了开始玩玩 Docker，我们需要安装 Docker。你可以从此 URL\
  \ 获取与你的平台兼容的版本：[`docs.docker.com/install/`](https://docs.docker.com/install/)；\n\
  \n但当你进入该页面时，你发现发现有两个版本：`Docker CE` 和 `Docker EE`；那么，你需要的是哪一个呢？\n\n*   **Docker CE：**\
  \ Docker 社区版适合想要开始使用 Docker 并尝试容器化应用程序的开发者和小团队。Docker CE 有三种类型的更新通道：`stable`、`test`\
  \ 和 `nightly`：\n    *   **Stable（稳定版）：**为你提供通用的最新发布版本。\n    *   **Test（测试版）：**提供在正式发布前准备测试的预览版本。\n\
  \    *   **Nightly（夜间版）：**为你提供下一次大版本开发中的最新构建版本。\n*   **Docker EE：** Docker 企业版专为在生产环境中大规模规模构建、交付和运行业务关键应用程序的企业级开发和\
  \ IT 团队设计。Docker EE 经过集成、认证和支持，为企业提供行业内最安全的容器平台。\n\n安装 Docker 非常简单，不需要教程就能完成 :)\n\
  \n安装后，为了检查 `Docker` 是否已安装，例如我们可以从通过运行 `docker version` 命令来检查安装的版本：\n\n```\nClient:\
  \ <2>\n Version:           18.06.0-ce\n API version:       1.38\n Go version:  \
  \      go1.10.3\n Git commit:        0ffa825\n Built:             Wed Jul 18 19:05:26\n\
  \ OS/Arch:           darwin/amd64\n Experimental:      false\n\nServer: <1>\n Engine:\n\
  \  Version:          18.06.0-ce\n  API version:      1.38 (minimum version 1.12)\n\
  \  Go version:        go1.10.3\n  Git commit:        0ffa825\n  Built:         \
  \   Wed Jul 18 19:13:46 2018\n  OS/Arch:          linux/64\n Experimental:     true\n\
  ```\n\n1.  `Docker daemon` 监听 `Docker API` 请求并管理 Docker 对象。守护进程还可以与其他守护进程通信以管理 Docker\
  \ 服务。\n2.  `Docker client` 是 Docker 用户与 Docker 交互的主要方式。当运行运行命令时，客户端会将这些命令发送给 `Docker\
  \ daemon`，由它执行。docker 命令使用 `Docker API`。Docker 客户端可以与多个 Docker daemon 通信。\n\nDocker\
  \ 使用 `client-server` 架构。Docker 客户端与 `Docker daemon` (`dockerd`) 通信，后者负责构建、运行和分发\
  \ Docker 容器的重量工作。`Docker client and daemon` 可以在同一系统中运行，也可以将 Docker 客户端连接到远程 Docker\
  \ daemon。Docker 客户端和守护使用 REST API 通过 UNIX 套接字或网络接口进行通信。\n\n### 运行你的第一个容器\n\n我们将从运行\
  \ `hello-world` 镜像开始：\n\n```\ndocker run hello-world\n```\n\n```\nUnable to find\
  \ image 'hello-world:latest' locally\nlatest: Pulling from library/hello-world\n\
  9db2ca6ccae0: Pull complete\nDigest: sha256:4b8ff392a12ed9ea17784bd3c9a8b1fa3299cac44aca35a85c90c5e3c7afacdc\n\
  Status: Downloaded newer image for hello-world:latest\n\nHello from Docker!\nThis\
  \ message shows...\n```\n\n为了生成此消息，Docker 执行了以下步骤：\n\n1.  Docker 客户端连接了 Docker daemon。\n\
  \n\n\n\n2. Docker 进程从 Docker Hub 拉取了“hello-world”镜像。\n\n3. Docker 进程基于该镜像创建了一个新容器，运行了生成你正在阅读的输出的可执行文件。\n\
  \n4. Docker 进程将该输出流到 Docker 客户端，将其发送到你的终端。\n\n列出本地存在的 Docker 镜像：\n\n```\ndocker\
  \ image ls\n```\n\n```\nREPOSITORY          TAG         IMAGE ID            CREATED\
  \             SIZE\nhello-world         latest      2cb0d9787c4d        4 weeks\
  \ ago         1.85kB\n```\n\n列出所有 Docker 容器：\n\n```\ndocker container ls --all\n\
  ```\n\n```\nCONTAINER ID<1>  IMAGE          COMMAND     CREATED           STATUS\
  \                        NAMES<2>\n54f4984ed6a8     hello-world    \"/hello\"  \
  \  20 seconds ago    Exited (0) 9 seconds ago      suzyland\n```\n\n1. `Container\
  \ ID` 是一个随机生成的 HEX 值，用于识别 `Container`（容器）。\n2. 我们在这里获得的 `Container Name`（容器名称）是\
  \ Docker 进程为我们生成的随机字符串名称，因为我们没有手动指定它。\n\n## Docker 架构\n\nDocker 采用客户端服务器架构。Docker\
  \ 客户端与 Docker 进程通信，由进程负责构建、运行和分发你的 Docker 容器等重量工作。Docker 客户端和进程可以运行在同一个系统中，你可以将\
  \ Docker 客户端连接到远程 Docker 进程。Docker 客户端和进程通过 REST API、UNIX Socket 或网络接口进行通信。\n\n\
  ![](img/docker-architecture.png)\n\nDocker 生态系统架构图 - Docker 官方文档\n\n### Docker 进程\n\
  \nDocker 进程 `dockerd` 监听 Docker API 请求并管理镜像、容器、网络和卷等 Docker 对象。进程还可以与其他进程通信，以管理\
  \ Docker 服务。\n\n### Docker 客户端\n\nDocker 客户端 `docker` 是许多 Docker 用户与 Docker 交互的主要要方式。当你使用\
  \ `docker run` 等命令时，客户端会将这些命令发送给 `dockerd`，由它执行。`docker` 命令使用 Docker API。Docker\
  \ 客户端可以与多个进程通信。\n\n### Docker 注册表\n\nDocker 注册表存储 Docker 镜像。Docker Hub 和 Docker\
  \ Cloud 是任何人都可以使用的公共注册表，Docker 配置为默认在 Docker Hub 上查找镜像。你甚至可以运行自己的私有注册表。如果你使用 Docker\
  \ DataCenter (DDC)，它包含了 Docker Trusted Registry (DTR)。\n\n当你使用 `docker pull` 或 `docker\
  \ run` 命令时，所需的镜像将从你配置的注册表中拉取。当你使用 `docker push` 命令时，你的镜像会被推送到配置的注册表中。\n\n### Docker\
  \ 对象\n\n当你使用 Docker 时，你正在创建和使用镜像、容器、网络、卷、插件和其他对象。本节是对其中一些对象的简要概述。\n\n#### 镜像\n\n\
  镜像是一个只读模板，其中包含创建 Docker 容器的指令。镜像通常基于另一个镜像，并带有一些额外的自定义。例如，你可以构建一个基于 `ubuntu` 镜像的镜像，但安装了\
  \ Apache Web 服务器和你的应用程序，以及运行你的应用程序所需的配置细节。\n\n你可以创建自己的镜像，也可能只使用他人发布在注册表中的镜像。要构建自己的镜像，你需要创建一个\
  \ `Dockerfile`，使用简单的语法来定义创建和运行镜像所需的步骤。`Dockerfile` 中的每条指令都会在镜像中创建一个层。当你更改 `Dockerfile`\
  \ 并重新构建镜像时，只有发生变化的层会被重新构建。这与其他虚拟化技术相比，是镜像如此轻量、快速且快速的原因之一。\n\n#### 容器\n\n容器是镜像的可运行实例。你可以使用\
  \ Docker API 或 CLI 创建、启动、停止、移动或删除容器。你可以将容器连接到一个或多个网络，为其附加存储，甚至基于其当前状态创建一个新镜像。\n\n\
  默认情况下，容器与其他容器及其宿主机之间保持着较好的隔离性。你可以控制容器的网络、存储或其他底层子系统与其他容器或宿主机之间的隔离程度。\n\n容器由其镜像定义，同时也由你在创建或启动它时提供的任何配置选项定义。当容器被移除时，任何未存储在持久化存储中的状态更改都会消失。\n\
  \n### Docker Machine\n\nDocker Machine 是一个让你在虚拟主机上安装 Docker Engine，并使用 `docker-machine`\
  \ 命令管理这些主机的工具。你可以使用 Machine 在本地的 Mac 或 Windows 机器上、公司网络中、数据中心内或 Azure、AWS 或 Digital\
  \ Ocean 等云提供商上创建 Docker 主机。\n\n通过 `docker-machine` 命令，你可以启动、检查、停止和重启托管的主机，升级 Docker\
  \ 客户端和进程，并配置 Docker 客户端连接到你的主机。\n\n将 Machine CLI 指向一个正在运行的托管主机，你就可以直接在该宿主机上运行 `docker`\
  \ 命令。例如，运行 `docker-machine env default` 指向一个名为 `default` 的主机，按照屏幕上的指令完成 `env` 设置，然后运行\
  \ `docker ps`、`docker run hello-world` 等。\n\n### 我为什么应该使用它？\n\nDocker Machine 允许你在各种版本的\
  \ Linux 上配置多个远程 Docker 主机。\n\n此外，Machine 允许你像上一个主题描述的那样在旧 Mac 或 Windows 系统上运行 Docker。\n\
  \nDocker Machine 有以下两个主要的用场景：\n\n#### 在旧机器上使用 Docker\n\n我有一台旧的桌面系统，想在 Mac 或 Windows\
  \ 上运行 Docker：\n\n如果你主要在不符合新版 Docker for Mac 和 Docker for Windows 要求的旧笔记本或台电脑上工作，那么你需要\
  \ Docker Machine 在本地运行 Docker Engine。在 Mac 或 Windows 机器上安装 Docker Machine 工具箱会配置带有\
  \ Docker Engine 的本地虚拟机，并提供连接它以及运行 docker 命令的能力。\n\n#### 部署远程 Docker 实例\n\nDocker\
  \ Engine 在 Linux 系统上原生运行。如果你有一台 Linux 机器作为主系统，并想运行 docker 命令，你只需要下载并安装 Docker Engine。然而，如果你想以高效的方式在网络、云端甚至本地部署多个\
  \ Docker 主机，你需要 Docker Machine。\n\n无论你的主系统是 Mac、Windows 还是 Linux，你可以在其上安装 Docker\
  \ Machine 并使用 docker-machine 命令管理大量的 Docker 主机。每个托管的主机（machine）都是 Docker 主机和配置好的客户端的组合。\n\
  \n\n\n\n`Dockerfile` 定义了容器内部环境的运行内容。在该环境内部，对网络接口和磁盘驱动器等资源的访问是虚拟化的，且该环境与你系统的其余部分隔离，因此你需要将端口映射到外部世界，并明确指定你想要“复制到”该环境的文件。然而，在完成这些操作后，你可以预期在\
  \ във `Dockerfile` 中定义的应用构建在任何运行它的地方表现都完全一致。\n\n## `Dockerfile`\n\n创建一个空目录。进入（`cd`）该新目录，创建一个名为\
  \ `Dockerfile` 的文件，将以下内容复制并粘贴到该文件中，然后保存。请注意解释你新新 Dockerfile 中每条语句的注释。\n\n```bash\n\
  # 使用 OpenJDK 运行时作为父镜像\nFROM openjdk:8-jre-alpine\n\n# 添加维护者信息\nLABEL maintainer=\"\
  lnibrass@gmail.com\"\n\n# 定义环境变量\nENV SPRING_OUTPUT_ANSI_ENABLED=ALWAYS \\\n   \
  \ JAVA_OPTS=\"\"\n\n# 设置工作目录为 /app\nWORKDIR /app\n\n# 将可执行文件复制到容器的 /app \nADD *.jar\
  \ app.jar\n\n# 让容器外部的世界可以使用 8080 端口\nEXPOSE 8080\n\n# 当容器启动时运行 app.jar\nCMD [\"\
  java\", \"-Djava.security.egd=file:/dev/./urandom\", \"-jar\", \"/app/app.jar\"\
  ]\n```\n\n此 `Dockerfile` 了一个我们尚未创建的 `app.jar`。该文件是我们示例应用程序的可执行 JAR 包。\n\n### 创建示例应用程序\n\
  \n我们将创建一个 `sample-app`：一个使用 [Spring Initializr](https://start.spring.io/) 的新 Spring\
  \ Boot 应用，我们需要添加以下依赖项：\n\n* Web\n* Actuator\n\n然后，我们将在主类中创建一个 Hello World RestController：\n\
  \n```java\n@RestController\n@SpringBootApplication\npublic class SampleAppApplication\
  \ {\n\n    public static void main(String[] args) {\n        SpringApplication.run(SampleAppApplication.class,\
  \ args);\n    }\n\n    @GetMapping(\"/hello\")\n    public String sayHello() {\n\
  \        return \"Hello World!\";\n    }\n}\n```\n\n当我们使用 `mvn clean install` 编译此应用时，我们的\
  \ JAR 包将出现在 `target` 文件夹中。\n\n接下来，我们将在 JAR 文件所在的相同文件夹中创建 `Dockerfile`。我们需要这样做以便让\
  \ `ADD` 命令能够访问 JAR 文件。在 `target` 文件夹中运行此命令将只显示当前文件夹下的文件：\n\n```bash\nls -p | grep\
  \ -v /\n\nDockerfile\nsample-app-0.0.1-SNAPSHOT.jar\nsample-app-0.0.1-SNAPSHOT.jar.original\n\
  ```\n\n现在我们已经验证了 `Dockerfile` 和 JAR 包在在一起，现在我们需要构建 Docker 镜像：\n\n现在运行构建命令。这将创建一个\
  \ Docker 镜像，我们将使用 `-t` 对其进行标记，以便它有一个有意义的名字：\n\n```bash\ndocker build -t greatest-hello\
  \ .\n```\n\n你将看到镜像构建日志：\n\n```\nSending build context to Docker daemon  17.57MB\n\
  Step 1/7 : FROM openjdk:8-jre-alpine <1>\n8-jre-alpine: Pulling from library/openjdk\
  \ <1>\n8e3ba11ec2a2: Pull complete  <1>\n311ad0da4533: Pull complete  <1>\n391a6a6b3651:\
  \ Pull complete  <1>\nDigest: sha256:1bed44170948277881d88481ecbd07317eb7bae385560a9dd597bbfe02782766\
  \ <1>\nStatus: Downloaded newer image for openjdk:8-jre-alpine <1>\n ---> ccfb0c83b2fe\
  \ <1>\nStep 2/7 : LABEL maintainer=\"lnibrass@gmail.com\"\n ---> Running in 0fe56f45fda0\
  \ \nRemoving intermediate container 0fe56f45fda0\n ---> 6768f6729824 <2>\nStep 3/7\
  \ : ENV SPRING_OUTPUT_ANSI_ENABLED=ALWAYS     JAVA_OPTS=\"\"\n ---> Running in 302927709e3a\
  \ \nRemoving intermediate container 302927709e3a\n ---> c270becb4a05 <2>\nStep 4/7\
  \ : WORKDIR /app\n ---> Running in 8229163b4d00 \nRemoving intermediate container\
  \ 8229163b4d00\n ---> 695621f3f97a <2>\nStep 5/7 : ADD *.jar app.jar\n ---> 5f9306b5b25a\
  \ \nStep 6/7 : EXPOSE 8080\n ---> Running in 2163da2c6d60\nRemoving intermediate\
  \ container 2163da2c6d60\n ---> f18ed4e056b4 <2>\nStep 7/7 : CMD [\"java\", \"-Djava.security.egd=file:/dev/./urandom\"\
  , \"-jar\", \"/app/app.jar\"]\n ---> Running in b481d6bb1665\nRemoving intermediate\
  \ container b481d6bb1665\n```\n\n\n\n\n将本地镜像与注册表上的仓库关联的符号为 `username/repository:tag`。标签是可选的，但建议使用，因为它是注册表用来为\
  \ Docker 镜像提供版本的机制。根据上下文为仓库和标签赋予有意义的名字，例如 `get-started:part2`。这会将镜像放入 `get-started`\
  \ 仓库并将其标记为 `part2`。\n\n现在，将所有操作整合在一起以标记镜像。运行 `docker tag image` 并输入你的 `username`、`repository`\
  \ 和 `tag` 名称，以便镜像上传到你的目标位置地该命令的语法为：\n\n```\ndocker tag image username/repository:tag\n\
  ```\n\n例如：\n\n```\ndocker tag greatest-hello nebrass/docker-get-started:v2\n```\n\
  \n运行命令：`docker image ls` 查看你新打标签的镜像：\n\n```\ndocker image ls\n\nREPOSITORY     \
  \              TAG                 IMAGE ID            CREATED             SIZE\n\
  greatest-hello               latest              668aa1b9b522        43 minutes\
  \ ago      101MB\nnebrass/docker-get-started   v2                  668aa1b9b527\
  \        43 minutes ago      101MB\nopenjdk                      8-jre-alpine  \
  \      ccfb0c83b2fe        4 weeks ago         83MB\n```\n\n### 发布镜像\n\n将你打了标签的镜像上传到仓库：\n\
  \n```\ndocker push username/repository:tag\n```\n\n完成后，此上传的结果将公开可用。如果你登录了 Docker\
  \ Hub，你会在那里看到这个新镜像，以及它的拉取命令。\n\n我们将推送标记了标签的 `nebrass/docker-get-started:v2` 镜像：\n\
  \n```\ndocker push nebrass/docker-get-started:v2\n\nThe push refers to repository\
  \ [docker.io/nebrass/docker-get-started]\n87233a64097d: Pushed \nb8becc4abdd9: Pushed\
  \ \n8bc7bbcd76b6: Mounted from library/openjdk \n73046094a9b8: Mounted from library/openjdk\
  \ \nv2: digest: sha256:9b4c21e8445987396935342185868337df9cffbf11ac0500d40972f221f88d9e\
  \ size: 1365\n```\n\n### 从远程仓库拉取并运行镜像\n\n从现在起，你可以使用 `docker run` 并通过此命令在任何机器上运行你的应用：\n\
  \n```\ndocker run -p 28080:8080 username/repository:tag\n```\n\n如果镜像在本地机器上不可用，Docker\
  \ 将会从仓库中拉取它。\n\n```\ndocker run -p 28080:8080 nebrass/docker-get-started:v2\n\n\
  Unable to find image 'nebrass/docker-get-started:v2' locally\nv2: Pulling from nebrass/docker-get-started\n\
  8e3ba11ec2a2: Pull complete \n311ad0da4533: Pull complete \ne290204e3b0c: Pull complete\
  \ \n4e78951b0f63: Pull complete \nDigest: sha256:9b4c21e8445987396935342185868337df9cffbf11ac0500d40972f221f88d9e\n\
  Status: Downloaded newer image for nebrass/docker-get-started:v2\n...\n```\n\n无论\
  \ `docker run` 在何处执行，它都会拉取你的镜像以及 `openjdk` 和所有依赖项，并运行你的代码。它们都作为一个整洁的小包一起传输，你不需要在主机上安装任何东西让\
  \ Docker 运行它。\n\n### 自动化 Docker 镜像构建\n\n嘿！如你所见，我们将 `Dockerfile` 文件放在 `target/` 文件夹中，以便靠近我们的可执行\
  \ JAR 文件。但每当我们执行一次 `mvn clean install` 时，该文件夹都会被删除。\n\n解决方案是将 `Dockerfile` 放在项目目录的根目录下，我们需要编辑\
  \ `Dockerfile` 中的 `ADD` 命令以包含 `target` 文件夹：\n\n```\nADD target/*.jar app.jar\n```\n\
  \n在开发过程中，我们会多次编辑和构建应用程序。`IDE`（Eclipse, NetBeans, IntelliJ 等）中的 `Maven` 集成只需点击一下即可完成构建，甚至自动完成。\n\
  \n我们的 `Docker Image` 也需要更新，但如果手动重新构建，这将非常繁重，如果我们在每次更新应用程序时都需要在 `Docker Container`\
  \ 中测试 JAR，那么这会非常费力。\n\n希望我们可以使用 `Maven` 自动化此过程，我们有很多可用插件可以实现这一点。\n\n#### Spotify\
  \ Maven plugin\n\nSpotify 有一个名为 `Dockerfile-maven-plugin` 的 Maven 插件，可以帮助 Docker\
  \ 与 Maven 的无缝集成。\n\n`Dockerfile-maven-plugin` 要求 `Dockerfile` 放置在项目根目录下。\n\n要使用它，你需要将插件添加到\
  \ `pom.xml` 文件中 `build` 部分的 `plugins` 中：\n\n```\n<plugin>\n    <groupId>com.spotify</groupId>\n\
  \    <artifactId>dockerfile-maven-plugin</artifactId>\n    <version>1.4.3</version>\n\
  \    <configuration>\n        <repository>nebrass/${project.artifactId}</repository>\n\
  \        <tag>${project.version}</tag>\n    </configuration>\n    <executions>\n\
  \        <execution>\n            <id>default</id>\n            <phase>install</phase>\n\
  \            <goals>\n                <goal>build</goal>\n                <goal>push</goal>\n\
  \            </goals>\n        </execution>\n    </executions>\n</plugin>\n```\n\
  \n#### GoogleContainerTools Jib\n\nJib 是一个为 Java 提供的快速且简单的容器镜像构建器。它不需要你编写 Dockerfile\
  \ 或安装 docker。Jib 以 **Maven** 和 **Gradle** 插件的形式提供，且配置简单。\n\n```xml\n<plugin>\n \
  \   <groupId>com.google.cloud.tools</groupId>\n    <artifactId>jib-maven-plugin</artifactId>\n\
  \    <version>0.9.10</version>\n    <configuration>\n        <to>\n            <image>nebrass/${project.artifactId}:${project.version}</image>\n\
  \        </to>\n    </configuration>\n</plugin>\n```\n\n`<image>` 标签指定了仓库名称、镜像名称和镜像标签。你可以将镜像仓库作为前缀指定在镜像名称中：\n\
  \n*   `gcr.io`\n*   `aws_account_id.dkr.ecr.region.amazonaws.com`\n*   `registry.hub.docker.com`\n\
  \n从私有仓库推送/拉取需要授权凭据。这些凭据可以通过 Docker 凭据助手获取或在 Maven 设置中定义。如果你没有显式定义凭据，Jib 将尝试使用 Docker\
  \ 配置中定义的凭据或推断常见的凭据助手。\n\n**构建镜像**\n\n使用以下命令将容器镜像构建到容器镜像仓库：\n\n```\nmvn compile jib:build\n\
  ```\n\n随后的构建比初始构建快得多。\n\n**构建到 Docker 守护进程**\n\nJib 可以直接将你的镜像构建到 Docker 守护进程。这使用了\
  \ docker 命令行工具，并要求你的 `PATH` 中有 **Docker**。\n\n```\nmvn compile jib:dockerBuild\n\
  ```\n\n\n\n服务（Services）实际上就是“生产环境中的容器”。服务只运行一个镜像，但它规范化了该镜像运行的方式——它应该使用哪些端口、应该运行多少个容器副本以确保服务拥有所需的容量等。扩展服务会更改运行该软件的容器实例数量，在此过程中为服务分配更多的计算资源。\n\
  \n幸运的是，使用 Docker 平台定义、运行和扩展服务非常简单——只需编写一个 `docker-compose.yml` 文件即可。\n\n## 你的第一个\
  \ docker-compose.yml 文件\n\n`docker-compose.yml` 文件是一个 YAML 文件，用于定义 Docker 容器在生产环境中的行为。\n\
  \n将此文件保存为 `docker-compose.yml` 到任意位置。请确保你已将第 2 部分中创建的镜像推送到仓库，并用 `username/repo:tag`\
  \ 替换为你的镜像详情来更新此 `.yml` 文件。\n\n```\nversion: \"3\"\nservices:\n  web:\n    # replace\
  \ username/repo:tag with your name and image details\n    image: username/repo:tag\n\
  \    deploy:\n      replicas: 5\n      resources:\n        limits:\n          cpus:\
  \ \"0.1\"\n          memory: 50M\n      restart_policy:\n        condition: on-failure\n\
  \    ports:\n      - \"28080:8080\"\n    networks:\n      - webnet\nnetworks:\n\
  \  webnet:\n```\n\n### docker-compose.yml 文件示例\n\n此 `docker-compose.yml` 文件告诉 Docker\
  \ 执行以下操作：\n\n* 从仓库拉取我们在第 2 步中上传的镜像。\n* 运行 5 个该镜像的实例作为名为 `web` 的服务，限制每个实例最多使用 10%\
  \ 的 CPU（跨越所有核心）和 50MB 内存。\n* 如果某个容器失败，立即重启。\n* 将主机的端口 28080 映射到 web 的 8080 端口。\n\
  * 指令 `web` 容器通过名为 `webnet` 的负载均衡网络共享 8080 端口。\n* 使用默认设置定义 `webnet` 网络（这是一个负载均衡的叠加网络）。\n\
  \n## 运行你的新负载均衡应用\n\n在可以使用 `docker stack deploy` 命令之前，我们首先运行：\n\n```\ndocker swarm\
  \ init\n```\n\n现在让我们运行它。你需要给你的应用起一个名字。在这里，设置为 getstartedlab：\n\n```\ndocker stack\
  \ deploy -c docker-compose.yml getstartedlab\n```\n\n我们的单服务堆栈正在一个主机上运行我们部署镜像的 5\
  \ 个容器实例。让我们调查一下。\n\n获取我们应用程序中该服务的服务 ID：\n\n```\ndocker service ls\n\nID        \
  \    NAME               MODE        REPLICAS  IMAGE                          PORTS\n\
  voz48hmxjg3g  getstartedlab_web  replicated  5/5       nebrass/docker-get-started:v2\
  \  *:28080->8080/tcp\n```\n\n查找 `web` 服务的输出，前面带有你的应用名称。如果你命名的名称与示例所示，则名称为 `getstartedlab_web`。列表中还列出了服务\
  \ ID，以及副本数量、镜像名称和暴露的端口。\n\n运行在服务中的单个容器被称为 `task`（任务）。任务具有唯一的 ID，按数字递增，直到你在 `docker-compose.yml`\
  \ 中定义的 `replicas` 数量。列出你服务的任务：\n\n```\ndocker service ps getstartedlab_web\n```\n\
  \n如果你只是列出系统上所有的容器，任务也会出现，尽管这没有按服务进行过滤：\n\n```\ndocker container ls -q\n```\n\n##\
  \ 扩展应用\n\n你可以通过更改 `docker-compose.yml` 中的 `replicas` 值、保存更改并重新运行 `docker stack deploy`\
  \ 命令来扩展应用：\n\n```\ndocker stack deploy -c docker-compose.yml getstartedlab\n```\n\
  \nDocker 执行的是原地更新，无需先拆除堆栈或杀死任何容器。\n\n现在，重新运行 `docker container ls -q` 查看重新配置的部署实例。如果你扩展了副本，就会启动更多的任务，因此也是更多的容器。\n\
  \n## 移除应用和集群\n\n从 docker 堆栈中移除应用：\n\n```\ndocker stack rm getstartedlab\n```\n\n\
  移除集群：\n\n```\ndocker swarm leave --force\n```\n\n使用 Docker 搭建和扩展你的应用就是如此简单。你已经在学习如何在生产环境中运行容器方面迈出了巨大的一步。接下去，你将学习如何在\
  \ Docker 机器集群上作为真正的 swarm 模式运行此应用。\n\n## 将我们的微服务容器化\n\n现在我们已经开始使用 Docker，我们需要将微服务容器化。我们需要添加\
  \ `Jib Maven Plugin`：\n\n```\n<plugin>\n    <groupId>com.google.cloud.tools</groupId>\n\
  \    <artifactId>jib-maven-plugin</artifactId>\n    <version>0.9.10</version>\n\
  \    <configuration>\n        <to>\n            <image>nebrass/${project.artifactId}:${project.version}</image>\n\
  \        </to>\n    </configuration>\n</plugin>\n```\n\n我们需要构建 Docker 镜像：\n\n```\n\
  mvn compile jib:dockerBuild\n```\n\n构建 Docker 镜像后，只需执行 `docker images` 你就会得到：\n\n\
  ```\nREPOSITORY                 TAG                 IMAGE ID            CREATED\
  \             SIZE\n\nREPOSITORY                  TAG                 IMAGE ID \
  \           CREATED             SIZE\n```\n\n\n\n\n```bash\n$ docker inspect -f\
  \ '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' config-server\n\n172.17.0.2\n\
  ```\n\n因此命令看起来如下：\n\n```bash\ndocker run -d \\\n  -e SPRING_CLOUD_CONFIG_URI=http://172.17.0.2:8888\
  \ \\\n  -p 8761:8761 nebrass/eureka:0.0.1-SNAPSHOT\n```\n\n这种方法可行，但并不理想。容器的 IP 会不断变化，而我们不可能每次都去检查\
  \ IP。这是一项繁重的任务，而且效率低下。\n\n我们亲爱的 Docker 为我们提供了许多极了生态系统性能和生产力的极棒功能，例如 `Container Links`（容器链接）。\n\
  \n`Container Links` 创建环境变量，允许容器之间相互通信。在运行新容器或编辑现有容器时，你可以显式指定容器链接。\n\n因此我们可以在命令中使用\
  \ `link`s：\n\n```bash\ndocker run --name eureka \\\n    --link config-server \\\
  \ <1>\n    -d -e SPRING_CLOUD_CONFIG_URI=http://config-server:8888 \\ <2>\n    -p\
  \ 8761:8761 nebrass/eureka:0.0.1-SNAPSHOT\n```\n\n1. 等于编写 `--link config-server=config-server`：使得\
  \ `config-server` 容器的信息（例如 IP 地址）对我们的 `eureka` 容器可用。\n2. `SPRING_CLOUD_CONFIG_URI`\
  \ 属性指向一个名为 `config-server` 的主机，该主机将被解析为 Config Server 容器的 IP 地址。这是通过链接机制实现的。\n\n\
  ### API Gateway (API 网关)\n\n```bash\ndocker run --name api-gateway \\\n    --link\
  \ config-server \\\n    -d -e SPRING_CLOUD_CONFIG_URI=http://config-server:8888\
  \ \\\n    -p 8222:8222 nebrass/api-gateway:0.0.1-SNAPSHOT\n```\n\n### Zipkin\n\n\
  ```bash\ndocker run --name zipkin -d -p 9411:9411 openzipkin/zipkin\n```\n\n###\
  \ Hystrix-dashboard\n\n```bash\ndocker run --name hystrix-dashboard \\\n    --link\
  \ config-server \\\n    -d -e SPRING_CLOUD_CONFIG_URI=http://config-server:8888\
  \ \\\n    -p 8988:8988 nebrass/hystrix-dashboard:0.0.1-SNAPSHOT\n```\n\n对于 `Product-Service`、`Order-Service`\
  \ 和 `Customer-Service`，我们需要像处理 `Config Server` 那样传递 `Zipkin Server 容器 IP 地址`。\n\n\
  ### Product Service (产品服务)\n\n```bash\ndocker run --name product-service \\\n  \
  \  --link config-server \\\n    --link zipkin \\\n    -d -e SPRING_CLOUD_CONFIG_URI=http://config-server:8888\
  \ \\\n    -e SPRING_ZIPKIN_BASE-URL=http://zipkin:9411/ \\\n    -p 9990:9990 nebrass/product-service:0.0.1-SNAPSHOT\n\
  ```\n\n### Order Service (订单服务)\n\n```bash\ndocker run --name order-service \\\n\
  \    --link config-server \\\n    --link zipkin \\\n    -d -e SPRING_CLOUD_CONFIG_URI=http://config-server:8888\
  \ \\\n    -e SPRING_ZIPKIN_BASE-URL=http://zipkin:9411/ \\\n    -p 9991:9991 nebrass/order-service:0.0.1-SNAPSHOT\n\
  ```\n\n### Customer Service (客户服务)\n\n```bash\ndocker run --name customer-service\
  \ \\\n    --link config-server \\\n    --link zipkin \\\n    -d -e SPRING_CLOUD_CONFIG_URI=http://config-server:8888\
  \ \\\n    -e SPRING_ZIPKIN_BASE-URL=http://zipkin:9411/ \\\n    -p 9992:9992 nebrass/customer-service:0.0.1-SNAPSHOT\n\
  ```\n\n但是……\n\n* 如果其中某一个容器失败了怎么办？\n* 如果某个监控程序崩溃或某个容器变得不可用怎么办？\n\n事情变得复杂起来（管理服务器、管理容器状态……​）。\n\
  \n在下一章中，将引入编排系统，它提供了许多功能，如计算、网络、存储基础设施的编排……​\n\n# 第 12 章 Kubernetes 入门\n\n为了部署我们的（如此庞大、如此巨大的）应用程序，我们将使用\
  \ `Docker`。我们将把代码部署在容器中，以便我们可以享受 `Docker` 提供的强大功能。\n\n`Docker` 已成为开发和运行容器化应用的标准。\n\
  \n这太棒了！使用 `Docker` 非常简单，特别是在开发阶段。在同一台服务器（`docker-machine`）上部署容器很简单，但当你开始将许多容器部署到许多服务器时，事情就会变得复杂（管理服务器、管理容器状态……​）。\n\
  \n编排系统出现了，它能够代表用户工作负载提供如计算、网络和存储基础设施编排等许多功能：\n\n* 调度：根据资源需求、亲性性等许多因素将容器匹配到机器上……​\n\
  * 复制\n* 故障处理\n* 等等……​\n\n对于我们的教程，我们将选择容器编排的之星 `Kubernetes`。\n\n## 什么是 Kubernetes？\n\
  \n`Kubernetes`（也称为 `K8s`）是 Google 出的一个开源项目。\n\n### Kubernetes 架构\n\n`Kubernetes`\
  \ 设计包含两个部分：\n\n* **主节点 (Master Nodes)**：控制平面。包含 `API Server`、`Scheduler`、`Controller\
  \ Manager` 和数据存储 `Etcd`。\n* **工作节点 (Worker Nodes)**：能够运行 `POD` 的单个主机或虚拟机。它们由主节点管理。\n\
  \n让我们查看主节点内部：\n\n* API Server：通过 REST API 允许主节点与所有客户端（如工作节点）进行通信。\n* `Scheduler`：策略丰富的、感知拓扑的函数，为新创建的\
  \ `POD` 分配节点。\n* `Controller Manager`：带有 Kubernetes 循环的守护进程。控制循环是系统的持续监听器。\n* `Etcd`：用于持久化集群状态的强一致高可用键值存储。\n\
  \n那么，工作节点呢？\n\n* `Kubelet`：运行在每个节点上的代理。它确保容器在 `POD` 中运行。\n* Kube-Proxy：通过维护主机网络规则来实现\
  \ Kubernetes 服务抽象。\n\n> **提示**\n>\n> 我们使用的容器运行时是 `Docker`。Kubernetes 兼容许多其他运行时，如\
  \ `Cri-o`、`Rkt` 等​\n\n### Kubernetes 核心概念\n\nK8s 生态系统涵盖许多概念和组件。我们将简要介绍它们。\n\n####\
  \ kubectl\n\n`kubectl` 是用于针对 Kubernetes 集群运行命令的命令行界面。\n\n#### 集群 (Cluster)\n\n将资源（CPU、内存、磁盘……​）聚合为可用池的集合。\n\
  \n#### 命名空间 (Namespace)\n\n逻辑分区功能允许一个 Kubernetes 集群被多个用户、团队或拥有多个应用程序的用户使用，而无需担心产生意外交互。每个用户、团队或应用程序都存在于\
  \ `Namespace` 中，与集群中的其他用户隔离，并像是唯一用户一样进行运行。\n\n列出所有命名空间：`kubectl get namespace` 或\
  \ `kubectl get ns`\n\n#### 标签 (Label)\n\n用于标识和选择相关对象集的键值对。标签具有严格的语法和字符集。\n\n####\
  \ 注解 (Annotation)\n\n包含非标识信息或元数据的键值对。注解没有标签的语法限制。\n\n选择器使用标签过滤或选择对象。支持基于等式的（=, ==,\
  \ !=）或简单的键值匹配选择器。\n\n**注解、标签和选择器的用例。**\n\n\n\n\n\n```\napiVersion: apps/v1\nkind:\
  \ Deployment\nmetadata:\n  name: nginx-deployment\n  annotations:\n    description:\
  \ \"nginx frontend\"\n  labels:\n    app: nginx\nspec:\n  replicas: 3\n  selector:\n\
  \    matchLabels:\n      app: nginx\n  template:\n    metadata:\n      labels:\n\
  \        app: nginx\n    spec:\n      containers:\n      - name: nginx\n       \
  \ image: nginx:1.7.9\n        ports:\n        - containerPort: 80\n```\n\n### Pod\n\
  \n它是 Kubernetes 的基本工作单元。代表了一组共享资源（如 IP 地址和存储）的容器集合。\n\n**Pod 示例。**\n\n```\napiVersion:\
  \ v1\nkind: Pod\nmetadata:\n  name: myapp-pod\n  labels:\n    app: myapp\nspec:\n\
  \  containers:\n  - name: myapp-container\n    image: busybox\n    command: ['sh',\
  \ '-c', 'echo Hello Kubernetes! && sleep 3600']\n```\n\n列出所有 Pod：`kubectl get pod`\
  \ 或 `kubectl get po`\n\n### ReplicationController\n\n一个用于定义旨在水平扩展的 Pod 的框架。复制控制器包含一个需要被复制的\
  \ Pod 定义，从它创建的 Pod 可以被调度到不同的节点。\n\n**ReplicationController 示例。**\n\n```\napiVersion:\
  \ v1\nkind: ReplicationController\nmetadata:\n  name: nginx\nspec:\n  replicas:\
  \ 3\n  selector:\n    app: nginx\n  template:\n    metadata:\n      name: nginx\n\
  \      labels:\n        app: nginx\n    spec:\n      containers:\n      - name:\
  \ nginx\n        image: nginx\n        ports:\n        - containerPort: 80\n```\n\
  \n列出所有 ReplicationController：`kubectl get replicationcontroller` 或 `kubectl get\
  \ rc`\n\n### ReplicaSet\n\nReplicationController 的升级版本，支持基于集合的选择器。\n\n**ReplicaSet\
  \ 示例。**\n\n```\napiVersion: apps/v1\nkind: ReplicaSet\nmetadata:\n  name: frontend\n\
  \  labels:\n    app: guestbook\n    tier: frontend\nspec:\n  replicas: 3\n  selector:\n\
  \    matchLabels:\n      tier: frontend\n    matchExpressions:\n      - {key: tier,\
  \ operator: In, values: [frontend]}\n  template:\n    metadata:\n      labels:\n\
  \        app: guestbook\n        tier: frontend\n    spec:\n      containers:\n\
  \      - name: php-redis\n        image: gcr.io/google_samples/gb-frontend:v3\n\
  \        env:\n        - name: GET_HOSTS_FROM\n          value: dns\n        ports:\n\
  \        - containerPort: 80\n```\n\n列出所有 ReplicaSet：`kubectl get replicaset` 或\
  \ `kubectl get rs`\n\n### Deployment\n\n包含一个 Pod 模板和副本 replicas 字段。Kubernetes 会确保实际状态（副本数量、Pod\
  \ 模板）始终匹配期望状态。当你更新一个 Deployment 时，它将执行“滚动更新”。\n\n**Deployment 示例。**\n\n```\napiVersion:\
  \ apps/v1\nkind: Deployment\nmetadata:\n  name: nginx-deployment\n  labels:\n  \
  \  app: nginx\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n      app: nginx\n\
  \  template:\n    metadata:\n      labels:\n        app: nginx\n    spec:\n    \
  \  containers:\n      - name: nginx\n        image: nginx:1.7.9\n        ports:\n\
  \        - containerPort: 80\n```\n\n列出所有 Deployment：`kubectl get deployment`\n\n\
  ### StatefulSet\n\n一种旨在管理必须持久化或维护状态的 Pod 的控制器。包括主机、网络和存储在内的 Pod 将被持久化。\n\n**StatefulSet\
  \ 示例。**\n\n```\napiVersion: apps/v1\nkind: StatefulSet\nmetadata:\n  name: web\n\
  spec:\n  selector:\n    matchLabels:\n      app: nginx\n  serviceName: \"nginx\"\
  \n  replicas: 3\n  template:\n    metadata:\n      labels:\n        app: nginx\n\
  \    spec:\n      terminationGracePeriodSeconds: 10\n      containers:\n      -\
  \ name: nginx\n        image: k8s.gcr.io/nginx-slim:0.8\n        ports:\n      \
  \  - containerPort: 80\n          name: web\n        volumeMounts:\n        - name:\
  \ www\n          mountPath: /usr/share/nginx/html\n  volumeClaimTemplates:\n  -\
  \ metadata:\n      name: www\n    spec:\n      accessModes: [ \"ReadWriteOnce\"\
  \ ]\n      storageClassName: \"my-storage-class\"\n      resources:\n        requests:\n\
  \          storage: 1Gi\n```\n\n列出所有 StatefulSets：`kubectl get statefulset`\n\n\
  ### DaemonSet\n\n确保特定 pod 的实例在集群中的所有（或选定的）节点上运行。\n\n**DaemonSet 示例。**\n\n```\napiVersion:\
  \ apps/v1\nkind: DaemonSet\nmetadata:\n  name: fluentd-elasticsearch\n  namespace:\
  \ kube-system\n  labels:\n    k8s-app: fluentd-logging\nspec:\n  selector:\n   \
  \ matchLabels:\n      name: fluentd-elasticsearch\n  template:\n    metadata:\n\
  \      labels:\n        name: fluentd-elasticsearch\n    spec:\n      tolerations:\n\
  \      - key: node-role.kubernetes.io/master\n        effect: NoSchedule\n     \
  \ containers:\n      - name: fluentd-elasticsearch\n        image: gcr.io/google-containers/fluentd-elasticsearch:1.20\n\
  \      terminationGracePeriodSeconds: 30\n```\n\n列出所有 DaemonSets：`kubectl get daemonset`\
  \ 或 `kubectl get ds`\n\n### Service\n\n定义一个单一的 IP/端口组合，为一组 Pod 提供访问。它使用标签选择器将 Pod\
  \ 组和端口映射到集群唯一的虚拟 IP。\n\n**Service 示例。**\n\n```\napiVersion: v1\nkind: Service\n\
  metadata:\n  name: my-nginx\n  labels:\n    run: my-nginx\nspec:\n  ports:\n  -\
  \ port: 80\n    protocol: TCP\n  selector:\n    run: my-nginx\n```\n\n列出所有 Service：`kubectl\
  \ get service` 或 `kubectl get svc`\n\n### Ingress\n\nIngress 控制器是将集群服务（通常是 http）暴露到外部的主要方法。这些是负载均衡器或路由器，通常提供\
  \ SSL 终止、基于名称的虚拟托管等……\n\n**Ingress 示例。**\n\n```\napiVersion: extensions/v1beta1\n\
  kind: Ingress\nmetadata:\n  name: test-ingress\n  annotations:\n    nginx.ingress.io/rewrite-target:\
  \ /\nspec:\n  rules:\n  - http:\n      paths:\n      - path: /\n        backend:\n\
  \          service:\n            name: test\n              port:\n             \
  \   number: 80\n```\n\n列出所有 Ingress：`kubectl get ingress`\n\n### Volume\n\n绑定 Pod\
  \ 的存储，供一个或多个容器消费。\n\n### PersistentVolume\n\nPersistentVolume (PV) 代表存储资源。PV 通常连接到后端存储资源\
  \ NFS、GCEDisk 或 RBD，其生命周期与 Pod 独立。\n\n列出所有 PersistentVolumes：`kubectl get persistentvolume`\
  \ 或 `kubectl get pv`\n\n### PersistentVolumeClaim\n\nPersistentVolumeClaim (PVC)\
  \ 是满足要求的存储请求。通常与动态供给存储一起。\n\n列出所有 PersistentVolumeClaims：`kubectl get persistentvolumeclaim`\
  \ 或 `kubectl get pvc`\n\n### StorageClass\n\n存储资源的抽象。这些包含提供者、提供者配置参数以及 PV 回收策略。\n\
  \n列出所有 StorageClasses：`kubectl get storageclass` 或 `kubectl get sc`\n\n### Job\n\
  \nJob 控制器确保一个多个 Pod 执行并成功终止。它将一直执行直到满足完成和/并行条件。\n\n列出所有 Jobs：`kubectl get job`\n\
  \n### CronJob\n\nJob 控制器的扩展，提供了一种按 cron Schedule 执行任务的方法。\n\n列出所有 CronJobs：`kubectl\
  \ get cronjob`\n\n### ConfigMap\n\n存储在 Kubernetes 内部的外部化数据，可以作为命令行参数、环境变量或通过文件卷挂载注入。实现外部配置存储模式的理想选择。\n\
  \n列出所有 ConfigMaps：`kubectl get configmap` 或 `kubectl get cm`\n\n### Secret\n\n功能与\
  \ ConfigMaps 相同，但以 base64 编码存储并在静态时进行加密（如果已配置）。\n\n列出所有 Secrets：`kubectl get secret`\n\
  \n 本地运行 Kubernetes\n\n在教程中，我们不会构建真实的 Kubernetes 集群。我们将使用 **Minikube**。\n\nMinikube\
  \ 是一个让你方便在本地运行 Kubernetes 的工具。Minikube 在你笔记本电脑的虚拟机中运行一个单节点 Kubernetes 集群，为想要尝试 Kubernetes\
  \ 或日常与其进行开发的用户提供服务。\n\n关于 Minikube 安装，请访问：[`github.com/kubernetes/minikube`](https://github.com/kubernetes/minikube)\n\
  \n安装后，启动 Minikube：\n\n```\nminikube start\n```\n\n\n\n\n\n`minikube start` 命令创建了一个名为\
  \ `minikube` 的 `kubectl context`。该上下文包含了与你的 minikube 集群通信的配置。\n\nMinikube 会自动将此上下文设置为默认，但如果你将来需要切换回它，请运行：\n\
  \n```\nkubectl config use-context minikube\n```\n\n访问 Kubernetes Dashboard：\n\n\
  ```\nminikube console\n```\n\nDashboard 将在你的默认浏览器中打开：\n\n![](img/k8s-dashboard.png)\n\
  \n## Kubernetes Dashboard (Web 界面)\n\n可以使用 `minikube stop` 命令来停止你的集群。该命令会关闭 minikube\
  \ 虚拟机，但会保留所有的集群状态和数据。重新启动集群将使其恢复到之前的状态。\n\n可以使用 `minikube delete` 命令来删除你的集群。该命令会关闭并删除\
  \ minikube 虚拟机。将不会保留任何数据或状态。\n\n# 第 13 章：Kubernetes 风格\n\n现在我们想要从 H2 迁移到 PostgreSQL。因此，我们必须配置应用程序以使用它，在\
  \ `application.properties` 文件中列出 JDBC 驱动程序、url、用户名、密码等属性，并在 `pom.xml` 中添加 PostgreSQL\
  \ JDBC 驱动。\n\n## 发现 Kubernetes 风格\n\n首先，我们通过向 `pom.xml` 添加此依赖开始：\n\n```\n<dependency>\n\
  \    <groupId>org.postgresql</groupId>\n    <artifactId>postgresql</artifactId>\n\
  \    <scope>runtime</scope>\n</dependency>\n```\n\n接下来，我们对 `application.properties`\
  \ 进行一些修改：\n\n```\nspring.datasource.driver-class-name=org.postgresql.Driver\nspring.jpa.hibernate.ddl-auto=create\n\
  spring.datasource.url=jdbc:postgresql://${POSTGRES_SERVICE}:5432/${POSTGRES_DB_NAME}\n\
  spring.datasource.username=${POSTGRES_DB_USER}\nspring.datasource.password=${POSTGRES_DB_PASSWORD}\n\
  ```\n\n我们使用了环境变量属性占位符：\n\n- `POSTGRES_SERVICE` : PostgreSQL 服务器的主机\n- `POSTGRES_DB_NAME`\
  \ : PostgreSQL 数据库\n- `POSTGRES_DB_USER` : PostgreSQL 用户名\n- `POSTGRES_DB_PASSWORD`\
  \ : PostgreSQL 密码\n\n我们将从 Kubernetes 的 ConfigMap 和 Secret 对象中提取这些值。\n\n### 创建 ConfigMap\n\
  \n我们需要创建 ConfigMap：\n\n```\nkubectl create configmap postgres-config \\\n    --from-literal=postgres.service.name=postgresql\
  \ \\\n    --from-literal=postgres.db.name=boutique\n```\n\n我们可以检查已创建的 ConfigMap：\n\
  \n```\nkubectl get cm postgres-config -o json\n```\n\n输出将如下：\n\n```\n{\n    \"apiVersion\"\
  : \"v1\",\n    \"data\": {\n        \"postgres.db.name\": \"boutique\",\n      \
  \  \"postgres.service.name\": \"postgresql\"\n    },\n    \"kind\": \"ConfigMap\"\
  ,\n    \"metadata\": {\n        \"creationTimestamp\": \"2018-03-25T16:42:39Z\"\
  ,\n        \"name\": \"postgres-config\",\n        \"namespace\": \"default\",\n\
  \        \"resourceVersion\": \"195\",\n        \"selfLink\": \"/api/v1/namespaces/default/configmaps/postgres-config\"\
  ,\n        \"uid\": \"87d7481c-304b-11e8-889d-080027a8a37c\"\n    }\n}\n```\n\n\
  ### 创建 Secret\n\n接下来我们创建 Secret：\n\n```\nkubectl create secret generic db-security\
  \ \\\n    --from-literal=db.user.name=nebrass \\\n    --from-literal=db.user.password=password\n\
  ```\n\n我们可以检查已创建的 Secret：\n\n```\nkubectl get secret db-security -o json\n```\n\n\
  输出将如下：\n\n```\n{\n    \"apiVersion\": \"v1\",\n    \"data\": {\n        \"db.user.name\"\
  : \"bmVicmFzcw==\",\n        \"db.user.password\": \"cGFzc3dvcmQ=\"\n    },\n  \
  \  \"kind\": \"Secret\",\n    \"metadata\": {\n        \"creationTimestamp\": \"\
  2018-03-25T16:56:36Z\",\n        \"name\": \"db-security\",\n        \"namespace\"\
  : \"default\",\n        \"resourceVersion\": \"714\",\n        \"selfLink\": \"\
  /api/v1/namespaces/default/secrets/db-security\",\n        \"uid\": \"7ac96df3-304d-11e8-889d-080027a8a37c\"\
  \n    },\n    \"type\": \"Opaque\"\n}\n```\n\n- 凭据采用 base64 编码。这是为了防止密钥意外泄露给查看人员或被存储在终端日志中。\n\
  - 从 Kubernetes 的角度来看，此 Secret 的内容是非结构化的：它可以包含任意的键值对。\n\n### 将 PostgreSQL 部署到 Kubernetes\n\
  \n由于配置是集中存储在 Kubernetes 集群中的，我们可以在 Spring Boot 应用程序和我们现在创建的 PostgreSQL 服务之间共享它们。\n\
  \n我已经准备好了 PostgreSQL 资源文件，位于 `src/main/assets/` 中。该 YAML 文件包含一个 Deployment 和 Service\
  \ 资源。\n\n我们从 ConfigMap 和 Secret 中加载了属性。\n\n`postgres.yml` 的内容：\n\n```\napiVersion:\
  \ extensions/v1\nkind: Deployment\nmetadata:\n  name: postgres\n  namespace: default\n\
  spec:\n  replicas: 1\n  template:\n    metadata:\n      labels:\n        app: postgres\n\
  \    spec:\n      containers:\n      - name: postgres\n        image: postgres:9.6\n\
  \        env:\n        - name: POSTGRES_SERVICE\n          valueFrom:\n        \
  \    configMapKeyRef:\n              name: postgres-config\n              key: postgres.service.name\n\
  \        - name: POSTGRES_DB_NAME\n          valueFrom:\n            configMapKeyRef:\n\
  \              name: postgres-config\n              key: postgres.db.name\n    \
  \    - name: POSTGRES_DB_USER\n          valueFrom:\n            secretKeyRef:\n\
  \              name: db-security\n              key: db.user.name\n        - name:\
  \ POSTGRES_DB_PASSWORD\n          valueFrom:\n            secretKeyRef:\n      \
  \        name: db-security\n              key: db.user.password\n        ports:\n\
  \        - containerPort: 5432\n        volumeMounts:\n        - name: data\n  \
  \        mountPath: /var/lib/postgresql\n      volumes:\n      - name: data\n  \
  \      emptyDir: {}\n---\napiVersion: v1\nkind: Service\nmetadata:\n  name: postgres\n\
  \  namespace: default\nspec:\n  selector:\n    app: postgres\n  ports:\n  - port:\
  \ 5432\n```\n\n将此资源文件应用到 Kubernetes，我们可以执行：\n\n```\nkubectl create -f src/main/assets/postgres.yml\n\
  ```\n\n输出将是：\n\n```\ndeployment \"postgresql\" created\nservice \"postgresql\" created\n\
  ```\n\n我们可以检查已创建的 Deployment：\n\n```\nkubectl get deployment postgresql -o json\n\
  ```\n\n输出将如下：\n\n```\n{\n    \"apiVersion\": \"extensions/v11\",\n    \"kind\":\
  \ \"Deployment\",\n    \"metadata\": {\n        \"annotations\": {\n           \
  \ \"deployment.kubernetes.io/revision\": \"1\"\n        },\n        \"creationTimestamp\"\
  : \"2018-03-25T17:04:03Z\",\n        \"generation\": 1,\n        \"labels\": {\n\
  \            \"app\": \"postgresql\"\n        },\n        \"name\": \"postgresql\"\
  ,\n        \"namespace\": \"default\",\n        \"resourceVersion\": \"1025\",\n\
  \        \"selfLink\": \"/apis/extensions/v1beta1/namespaces/default/deployments/postgresql\"\
  ,\n        \"uid\": \"84fa2f1a-304e-11e8-889d-080027a8a37c\"\n    },\n    \"spec\"\
  : {\n        ...\n    },\n    \"status\": {\n        \"availableReplicas\": 1,\n\
  \        \"conditions\": [\n            {\n                \"lastTransitionTime\"\
  : \"2018-03-25T17:04:03Z\",\n                \"lastUpdateTime\": \"2018-03-25T17:04:03Z\"\
  ,\n                \"message\": \"Deployment has minimum availability.\",\n    \
  \            \"reason\": \"MinimumReplicasAvailable\",\n                \"status\"\
  : \"True\",\n                \"type\": \"Available\"\n            }\n        ],\n\
  \        \"observedGeneration\": 1,\n        \"readyReplicas\": 1,\n        \"replicas\"\
  : 1,\n        \"updatedReplicas\": 1\n    }\n}\n```\n\n我们可以检查已创建的 Service：\n\n```\n\
  kubectl get service postgresql -o json\n```\n\n\n\n\n\n```json\n{\n    \"apiVersion\"\
  : \"v1\",\n    \"kind\": \"Service\",\n    \"metadata\": {\n        \"creationTimestamp\"\
  : \"2018-03-25T17:04:03Z\",\n        \"name\": \"postgresql\",\n        \"namespace\"\
  : \"default\",\n        \"resourceVersion\": \"1000\",\n        \"selfLink\": \"\
  /api/v1/namespaces/default/services/postgresql\",\n        \"uid\": \"84fd14fa-304e-11e8-889d-080027a8a37c\"\
  \n    },\n    \"spec\": {\n        \"clusterIP\": \"10.104.62.217\",\n        \"\
  ports\": [\n            {\n                \"port\": 5432,\n                \"protocol\"\
  : \"TCP\",\n                \"targetPort\": 5432\n            }\n        ],\n  \
  \      \"selector\": {\n            \"app\": \"postgresql\"\n        },\n      \
  \  \"sessionAffinity\": \"None\",\n        \"type\": \"ClusterIP\"\n    },\n   \
  \ \"status\": {\n        \"loadBalancer\": {}\n    }\n}\n```\n\n在此输出结果中，有一个很有意思的地方：端口（port）和目标端口（target\
  \ port）：\n\n*   该服务将使用的端口\n*   服务将流量转发到的容器端口\n\n我们已经在 `spring.datasource.url` 属性中提到了\
  \ `port`。\n\n*   如果我们使用 Kubernetes 的强大功能来动态解析这个端口，你觉得怎么样？\n*   好的，但怎么做呢？ :)\n\n\
  创建这些资源后，生效的属性将如下：\n\n```\nspring.datasource.driver-class-name=org.postgresql.Driver\n\
  spring.jpa.hibernate.ddl-auto=create\nspring.datasource.url=jdbc:postgresql://postgresql:5432/boutique\n\
  spring.datasource.username=nebrass\nspring.datasource.password=password\n```\n\n\
  Datasource URL 指向一个名为 `postgresql` 的主机。主机名到 IP 的解析是由 Kubernetes 完成的。\n\n如果我们检查 `postgresql`\
  \ 服务：\n\n```bash\nkubectl get svc postgresql\n\nNAME         TYPE        CLUSTER-IP\
  \       EXTERNAL-IP   PORT(S)    AGE\npostgresql   ClusterIP   10.111.244.143  \
  \ <none>        5432/TCP   1h\n```\n\nKubernetes 中还有另一个酷功能，我们可以获取与服务本身相关的数据。例如，我们可以获取与此服务相关的端口。\n\
  \n例如：\n\n*   `${postgresql.service.host}` 将被解析为 `10.111.244.143`。\n*   `${postgresql.service.port}`\
  \ 将被解析为 `5432`。\n\n我们可以做得更好 ) 我们可以将环境变量合并到非常强大的占位符中，这些占位符会被 Kubernetes 解析。它们将变成：\n\
  \n*   `${postgresql.service.host}` 可以写为 `${${POSTGRES_SERVICE}.service.host}`\n\
  *   `${postgresql.service.port}` 可以写为 `${${POSTGRES_SERVICE}.service.port}`\n\n\
  通过这种方式，内部占位符将由 `ConfigMap` 提供的环境变量解析，而外部占位符将由 Kubernetes 解析。\n\n生成的 `application.properties`\
  \ 看起来如下：\n\n```\nspring.datasource.driver-class-name=org.postgresql.Driver\nspring.jpa.hibernate.ddl-auto=create\n\
  spring.datasource.url=jdbc:postgresql://${${POSTGRES_SERVICE}.service.host}\\\n\
  :${${POSTGRES_SERVICE}.service.port}/${POSTGRES_DB_NAME}\nspring.datasource.username=${POSTGRES_DB_USER}\n\
  spring.datasource.password=${POSTGRES_DB_PASSWORD}\n```\n\n现在，我们是 ConfigMap 的成瘾者\
  \ :) 我们将把 `application.properties` 托管在 Kubernetes 的 `ConfigMap` 中。要做到这一点，只需：\n\n\
  ```bash\nkubectl create configmap app-config\n    --from-file=src/main/resources/application.properties\n\
  ```\n\n现在有了 `application.properties`，我们的 Spring Boot 应用该如何使用它们呢？\n\n答案非常简单：使用 **Spring\
  \ Cloud Kubernetes** 插件。\n\n### 什么是 Spring Cloud Kubernetes\n\nSpring Cloud Kubernetes\
  \ 插件实现了 Kubernetes 和 Spring Boot 之间的集成。它通过 Kubernetes API 访问 `ConfigMap` 的配置数据。\n\
  \n它让 Kubernetes `ConfigMap` 直接集成到 Spring Boot 外部化配置机制变得非常简单，使得 Kubernetes `ConfigMaps`\
  \ 可以作为 Spring Boot 配置的备用属性源。\n\n要启用插件的强大功能：\n\n1.  添加 Maven 依赖：\n\n    在 `pom.xml`\
  \ 中添加此依赖：\n\n    ```xml\n     <dependency>\n         <groupId>io.fabric8</groupId>\n\
  \         <artifactId>spring-cloud-starter-kubernetes</artifactId>\n         <version>0.1.6</version>\n\
  \     </dependency>\n    ```\n\n2.  创建启动文件：\n\n    在 `src/main/resources` 下创建一个新文件\
  \ `bootstrap.properties`：\n\n    ```properties\n     spring.application.name=${project.artifactId}\n\
  \     spring.cloud.kubernetes.config.name=app-config\n    ```\n\n    *   `${project.artifactId}`\
  \ 将由 `maven-resources-plugin` 解析并填充，你可以在此教程 Github 仓库中托管的示例项目的 `pom.xml` 中找到它。\n\
  \    *   我们存储极好的 `application.properties` 的 `ConfigMap` 名称。\n\n这就搞定了！Spring Cloud\
  \ 已经正确集成到我们的应用。\n\n### 部署到 Kubernetes\n\n我们将尽量保持简短简单。根据定义，Kubernetes 是一个容器编排解决方案。因此部署应用到\
  \ Kubernetes 意味着：\n\n*   容器化应用：创建镜像。\n*   准备部署资源（Deployment, ReplicaSet 等）。\n* \
  \  部署容器到 Kubernetes。\n\n这些步骤可能需要一些时间完成，即使我们尝试自动化，仍然很费时间。由于这些任务很重，我们需要一些工具来简化。\n\n\
  强大的工具出现了：**Fabric8-Maven-Plugin**。\n\n#### Fabric8 Logo\n\nFabric8-Maven-Plugin\
  \ 是构建和部署 Kubernetes Kubernetes Java 应用的一站式解决方案。它将你的 Java 应用带到 Kubernetes 和 OpenShift。它提供了\
  \ Maven 集成。它专注于三个任务：\n\n*   构建 Docker 镜像\n*   创建 OpenShift 和 Kubernetes 资源\n*  \
  \ 在 Kubernetes 上部署应用\n\n该插件将完成所有任务！它可以非常灵活地配置，并支持多种配置模型创建：\n\n*   **零配置**：适用于快速上手。\n\
  *   **内联配置**：插件配置中的 XML 语法。\n*   **外部配置**：部署描述符模板，由插件进行增强。\n*   **Docker Compose\
  \ 配置**：提供 Docker Compose 文件并在 Kubernetes 集群上启动 docker compose 部署。\n\n要在你的项目中启用 *fabric8-maven-plugin*，只需在\
  \ `pom.xml` 的 plugins 部分添加以下内容：\n\n```xml\n<plugin>\n  <groupId>io.fabric8</groupId>\n\
  \  <artifactId>fabric8-maven-plugin</artifactId>\n  <version>3.5.41</version>\n\
  </plugin>\n```\n\n现在，为了使用 *fabric8-maven-plugin* 进行构建或部署，请确保你的 Kubernetes 集群已运行。*fabric8-maven-plugin*\
  \ 支持丰富的目标，以提供顺畅的 Java 开发者体验。你可以将这些目标分类如下：\n\n*   构建目标用于创建和管理 Kubernetes 构建产物（如 Docker\
  \ 镜像）。\n    *   `fabric8:build`：构建 Docker 镜像\n    *   `fabric8:resource`：创建 Kubernetes\
  \ 资源描述符\n    *   `fabric8:push`：将 Docker 镜像推送到仓库\n    *   `fabric8:apply`：将资源应用到运行中的集群\n\
  *   开发目标用于将资源描述符部署到开发集群。\n    *   `fabric8:run`：在前台运行完整的开发工作周期 `fabric8:resource`\
  \ → `fabric8:build` → `fabric8:apply`。\n\n\n\n\n\n- `fabric8:deploy`: 在创建并构建应用后，将资源描述符部署到集群。与\
  \ `fabric8:run` 相同，区别是它在后台运行。\n- `fabric8:undeploy`: 从集群中卸载并移除资源描述符。\n- `fabric8:watch`:\
  \ 监听构建和重启。\n\n如果你想将这些目标集成到 Maven 生命周期阶段中，可以轻松地做到：\n\n```\n<plugin>\n  <groupId>io.fabric8</groupId>\n\
  \  <artifactId>fabric8-maven-plugin</artifactId>\n  <version>3.5.41</version>\n\
  \  <!-- 此代码块将 fabric8:resource 和 fabric8:build 连接到生命周期阶段 -->\n  <executions>\n \
  \   <execution>\n       <id>fmp</id>\n       <goals>\n         <goal>resource</goal>\n\
  \         <goal>build</goal>\n       </goals>\n    </execution>\n  </executions>\n\
  </plugin>\n```\n\n> **注意**\n> 为了偷懒起见 :p 我将把 `fabric8-maven-plugin` 简称为 `f8mp`。\n\
