  \n### 创建服务层\n\n现在我们创建了实体，我们将创建服务。\n\n**Spring 应用**中的 `service` 是一个封装了业务逻辑的组件。它也是**持久化**层和**Web**\
  \ 层之间的胶胶剂。\n\n到目前为止，我们还没有讨论任何*业务逻辑*，只有 *CRUD* 操作。我们将在服务中实现这些 *CRUD* 操作。是的！这显而易见，我们将为每个`实体`\
  \ 创建一个 `service`。\n\n#### 典型服务：CartService\n\n`CartService` 如下：\n\n\n\n\n\n```\n\
  @RequiredArgsConstructor <1>\n@Slf4j <2>\n@Service <3>\n@Transactional <4>\npublic\
  \ class CartService {\n\n    private final CartRepository cartRepository; <5>\n\
  \    private final CustomerRepository customerRepository; <5>\n    private final\
  \ OrderService orderService; <5>\n\n    public List<CartDto> findAll() {\n     \
  \   log.debug(\"Request to get all Carts\");\n        return this.cartRepository.findAll()\n\
  \                .stream()\n                .map(CartService::mapToDto)\n      \
  \          .collect(Collectors.toList());\n    }\n\n    public List<CartDto> findAllActiveCarts()\
  \ {\n        return this.cartRepository.findByStatus(CartStatus.NEW)\n         \
  \       .stream()\n                .map(CartService::mapToDto)\n               \
  \ .collect(Collectors.toList());\n    }\n\n    public CartDto create(Long customerId)\
  \ {\n        if (this.getActiveCart(customerId) == null) {\n            Customer\
  \ customer = this.customerRepository.findById(customerId)\n                    .orElseThrow(()\
  \ -> new IllegalStateException(\"The Customer does not exist!\"));\n\n         \
  \   Cart cart = new Cart(\n                    null,\n                    customer,\n\
  \                    CartStatus.NEW\n            );\n            Order order = this.orderService.create(cart);\n\
  \            cart.setOrder(order);\n\n            return mapToDto(this.cartRepository.save(cart));\n\
  \        } else {\n            throw new IllegalStateException(\"There is already\
  \ an active cart\");\n        }\n    }\n\n    @Transactional(readOnly = true)\n\
  \    public CartDto findById(Long id) {\n        log.debug(\"Request to get Cart\
  \ : {}\", id);\n        return this.cartRepository.findById(id).map(CartService::mapToDto).orElse(null);\n\
  \    }\n\n    public void delete(Long id) {\n        log.debug(\"Request to delete\
  \ Cart : {}\", id);\n        Cart cart = this.cartRepository.findById(id)\n    \
  \            .orElseThrow(() -> new IllegalStateException(\"Cannot find cart with\
  \ id \" + id));\n\n        cart.setStatus(CartStatus.CANCELED);\n\n        this.cartRepository.save(cart);\n\
  \    }\n\n    public CartDto getActiveCart(Long customerId) {\n        List<Cart>\
  \ carts = this.cartRepository\n                .findByStatusAndCustomerId(CartStatus.NEW,\
  \ customerId);\n        if (carts != null) {\n\n            if (carts.size() ==\
  \ 1) {\n                return mapToDto(carts.get(0));\n            }\n        \
  \    if (carts.size() > 1) {\n                throw new IllegalStateException(\"\
  Many active carts detected !!!\");\n            }\n        }\n\n        return null;\n\
  \    }\n\n    public static CartDto mapToDto(Cart cart) {\n        if (cart != null)\
  \ {\n            return new CartDto(\n                    cart.getId(),\n      \
  \              cart.getOrder().getId(),\n                    CustomerService.mapToDto(cart.getCustomer()),\n\
  \                    cart.getStatus().name()\n            );\n        }\n      \
  \  return null;\n    }\n}\n```\n\n1. `@RequiredArgsConstructor` 注解用于生成一个包含必要参数的构造函数。必要参数是指\
  \ `final` 字段以及带有 `@NonNull` 等约束的字段。\n\n2. `@Slf4j` 注解用于在类中生成 `logger`。使用时，你将拥有一个初始化为类名的\
  \ `static final log` 字段，并可以使用它来编写日志语句。\n\n3. 表示被注解的类是一个 `Service`，它最初由**领域驱动设计**\
  \ (Evans, 2003) 定义为“一种作为接口提供的操作，它在模型中独立存在，没有封装的状态”。\n\n4. Spring 的 `@Transactional`\
  \ 注解用于定义事务边界。\n\n5. 我们使用**构造器注入**在 `Service` 中注入了 `Repository`，而不是使用**字段**注入或 **setter**\
  \ 注入。用于注入的构造函数是通过 Lombok 生成的。\n\n而 `CartDto` 类如下所示：\n\n```\n@Data\n@AllArgsConstructor\n\
  public class CartDto {\n    private Long id;\n    private Long orderId;\n    private\
  \ CustomerDto customerDto;\n    private String status;\n}\n```\n\n### AddressService\n\
