  kind: Gateway\nmetadata:\n  name: bookinfo-gateway\nspec:\n  selector:\n    istio:\
  \ ingressgateway # 使用 istio 默认控制器\n  servers:\n  - port:\n      number: 80\n   \
  \   name: http\n      protocol: HTTP\n    hosts:\n    - \"*\"\n```\n\n# 示例 BookInfo\
  \ Gateway\n\n`VirtualService` 定义了控制请求在 Istio 服务网格内路由的规则。例如，`VirtualService` 可以将请求路由到服务的不同版本，或者路由到与请求完全不同的服务。请求可以根据请求的源和目的、`HTTP`\
  \ 路径和头部字段，以及与单个服务版本相关的权重进行路由。\n\n`VirtualService` 配置如下：\n\n```yaml\napiVersion:\
  \ networking.istio.io/v1alpha3\nkind: VirtualService\nmetadata:\n  name: bookinfo\n\
  spec:\n  hosts:\n  - \"*\"\n  gateways:\n  - bookinfo-gateway\n  http:\n  - match:\n\
  \    - uri:\n        exact: /productpage\n    - uri:\n        exact: /login\n  \
  \  - uri:\n        exact: /logout\n    - uri:\n        prefix: /api/v1/products\n\
  \    route:\n    - destination:\n        host: productpage\n        port:\n    \
  \      number: 9080\n```\n\n# 示例 BookInfo VirtualService\n\n让我们来创建 `Istio Gateway`\
  \ 和 `VirtualService`：\n\n```bash\nkubectl apply -f samples/bookinfo/networking/bookinfo-gateway.yaml\n\
  ```\n\n确认 gateway 已经创建：\n\n```bash\nkubectl get gateway\n\nNAME               AGE\n\
  bookinfo-gateway   59m\n```\n\n让我们导出 `INGRESS_HOST`、`INGRESS_PORT` 和 `GATEWAY_URL`：\n\
  \n```bash\nexport INGRESS_HOST=$(minikube ip)\n\nexport INGRESS_PORT=$(kubectl -n\
  \ istio-system get service istio-ingressgateway \\\n                    -o jsonpath='{.spec.ports[?(@.name==\"\
  http2\")].nodePort}')\n\nexport GATEWAY_URL=$INGRESS_HOST:$INGRESS_PORT\n```\n\n\
  测试 Gateway：\n\n```bash\ncurl -o /dev/null -s -w \"%{http_code}\\n\" http://$GATEWAY_URL/productpage\n\
  ```\n\n你的响应码必须是 `200`。\n\n你也可以将浏览器指向 `http://$GATEWAY_URL/productpage` 来查看 Bookinfo\
  \ 网页。如果你多次刷新页面，你应该能看到 `productpage` 中显示不同版本的评论，它们以轮询方式（红星、黑星、无星）呈现，这是因为我们目前还没有使用\
  \ Istio 来控制版本路由。\n\n![](img/bookinfo-sample-productpage.png)\n\nBookInfo 示例 productpage\n\
  \n如果我们多次刷新网页，将获得不同版本的 `reviews` 结构：一个版本有红星级（我们在截图中看到的那个），另一个版本有黑星级，第三个版本没有星级。这是由于在我们的示例\
  \ `BookInfo` 应用中部署了三个版本的 `reviews` 微服务。\n\n你可以验证 `reviews` 微服务的三个版本的可用性：\n\n```bash\n\
  kubectl get pods -l app=reviews\n\nNAME                          READY   STATUS\
  \    RESTARTS   AGE\nreviews-v1-699587b49b-v44wr   2/2     Running   0         \
  \ 5h31m\nreviews-v2-cc7cd59cc-rgc86    2/2     Running   0          5h31m\nreviews-v3-6fbcf56df8-wndtz\
  \   2/2     Running   0          5h31m\n```\n\n我们在刷新时之所以获得不同版本的 `reviews` 结构，是因为\
  \ Istio 默认使用 `Round Robin`（轮询）调度来分发负载服务的访问。Istio 的强大功能之一是将流量路由到服务的特定版本，甚至可以使用请求的切片分发。\n\
  \n在接下来的步骤中，我们将看到如何根据版本路由流量。\n\n### 目标规则 (Destination Rules)\n\n在可以使用 Istio 控制 `Bookinfo`\
  \ 版本路由之前，我们需要定义应用程序的可用版本，称为 `subsets`。这些 `subsets` 定义在一个名为 `DestinationRule` 的 Istio\
  \ 对象中。显示版本的选择可以根据为每个版本定义的标准（头部、URL 等）来决定。我们可以利用这些标准的灵活性来执行蓝绿部署、A/B 测试和金丝雀发布。\n\n\
  ```yaml\napiVersion: networking.istio.io/v1alpha3\nkind: DestinationRule\nmetadata:\n\
  \  name: productpage\nspec:\n  host: productpage <1>\n  subsets:\n  - name: v1 <2>\n\
  \    labels:\n      version: v1 <2>\n```\n\n1. 我们将路由流量的 Kubernetes 服务名称。\n2. `subset`\
  \ 元素名称。\n3. `subset` 元素版本。\n\n我们将使用示例 `destination-rule-all.yaml` 为 Bookinfo 服务创建默认目标规则：\n\
  \n```yaml\napiVersion: networking.istio.io/v1alpha3\nkind: DestinationRule\nmetadata:\n\
  \  name: productpage\nspec:\n  host: productpage\n  subsets:\n  - name: v1\n   \
  \ labels:\n      version: v1\n---\napiVersion: networking.istio.io/v1alpha3\nkind:\
  \ DestinationRule\nmetadata:\n  name: reviews\nspec:\n  host: reviews\n  subsets:\n\
  \  - name: v1\n    labels:\n      version: v1\n  - name: v2\n    labels:\n     \
  \ version: v2\n  - name: v3\n    labels:\n      version: v3\n```\n\n\n\n要测试新的 `VirtualService`，只需点击\
  \ `Sign` 按钮并使用 `jason` 作为用户名、任意值作为密码登录。现在，我们将看到 `reviews:v2`。如果你注销，我们将返回 `reviews:v1`：\n\
  \n![](img/bookinfo-sample-productpage-reviews-v2.png)\n\n当用户为 jason 时带有 reviews-v2\
  \ 的产品页\n\n接下来，我们将查看如何将流量从一个微服务的版本逐渐迁移到另一个版本。在示例中，我们将 50% 的流量发送到 `reviews:v1`，50%\
  \ 的流量发送到 `reviews:v3`：\n\n```\nkubectl apply -f samples/bookinfo/networking/virtual-service-reviews-50-v3.yaml\n\
  ```\n\n让我们验证新 `VirtualService` 的内容：\n\n```\nkubectl get virtualservice reviews -o\
  \ yaml\n```\n\n`subset` 被设置为 50% 的流量流向 `v1`，50% 的流量流向 `v3`：\n\n```yaml\nspec:\n\
  \  hosts:\n  - reviews\n  http:\n  - route:\n    - destination:\n        host: reviews\n\
  \        subset: v1\n      weight: 50\n    - destination:\n        host: reviews\n\
  \        subset: v3\n      weight: 50\n```\n\n现在尝试多次重新加载页面，你将看到不同的 `reviews:v1`\
  \ 和 `reviews:v3`。\n\n## 可观测性\n\n### 分布式追踪 (Distributed Tracing)\n\n#### Hello Jaeger\n\
  \n要访问 `Jaeger Dashboard`，请建立从本地端口 `16686` 到 `Tracing` 实例的端口转发：\n\n```\nkubectl port-forward\
  \ -n istio-system \\\n  $(kubectl get pod -n istio-system -l app=jaeger -o jsonpath='{.items[0].metadata.name}')\
  \ \\\n  16686:16686\n```\n\n在你的浏览器中，访问 [`127.0.0.1:16686`](http://127.0.0.1:16686)\n\
  \n从 `Services` 菜单中选择 `productpage` 服务。\n\n滚动到底部并点击 `Find Traces` 按钮查看轨迹：\n\n![](img/jaeger-dashboard-traces.png)\n\
  \nJaeger Dashboard - 轨迹\n\n如果你点击某个轨迹，你应该看到更多详情。页面看起来应该像这样：\n\n![](img/jaeger-dashboard-spans.png)\n\
  \nJaeger Dashboard - 轨迹详情\n\n当调用 `/productpage` 时，会调用许多 BookInfo 服务。这些服务对应 `spans`，而页面调用本身对应\
  \ `trace`。\n\n尽管 Istio 代理能够自动发送 spans，但它们需要一些提示来将整个 trace 连接起来。应用程序需要传播适当 HTTP 头部，以便当代理发送\
  \ span 信息时，这些 spans 能够正确关联到单个 trace 中。\n\n为了实现这一点，应用程序需要从传入的请求到任何发出的请求收集并传播以下头部：\n\
  \n* `x-request-id`\n* `x-b3-traceid`\n* `x-b3-spanid`\n* `x-b3-parentspanid`\n*\
  \ `x-b3-sampled`\n* `x-b3-flags`\n* `x-ot-span-context`\n\n#### 轨迹采样 (Trace sampling)\n\
  \n当使用上述 Bookinfo 示例应用程序时，每次访问 `/productpage` 你都会在 Jaeger 仪表板中看到对应的轨迹。这种采样率（在 Bookinfo\
  \ 示例中为 100%）适用于测试或低流量网格，这就是它被用作演示安装的默认值。\n\n在其他配置中，Istio 默认每 100 个请求生成 1 个 trace\
  \ spans（采样率为 1%）。\n\n要控制轨迹采样的百分比：在运行中的网格中，编辑 `istio-pilot` 部署并按照以下步骤更改环境变量：\n\n\
  1. 运行以下命令以加载部署配置文件并打开你的文本编辑器：\n\n```\nkubectl -n istio-system edit deploy istio-pilot\n\
  ```\n\n2. 找到 `PILOT_TRACE_SAMPLING` 环境变量，并将值更改为：你所需的百分比。\n\n在这两种情况下，有效值范围为 0.0 到\
  \ 100.0，精度为 0.01。\n\n### Grafana\n\nIstio 中的 `Grafana` 插件是一个预配置的 `Grafana` 实例。\n\
  \n基础镜像（`grafana/grafana:5.0.4`）经过修改，启动时同时带有一个 `Prometheus` 数据源并安装了 `Istio Dashboard`。`Istio`\
  \ 尤其是 `Mixer` 的基础安装文件带有全局（用于每个服务）指标的默认配置。`Istio Dashboard` 设计用于与默认 Istio 指标配置以及\
  \ `Prometheus` 后端配合使用。\n\n建立从本地端口 3000 到 `Grafana` 实例的端口转发：\n\n```\nkubectl -n istio-system\
  \ port-forward \\\n  $(kubectl get pod -n istio-system -l app=grafana -o jsonpath='{.items[0].metadata.name}')\
  \ \\\n  3000:3000\n```\n\n访问 `http://localhost:3000` 并导航到 `Istio Mesh  Dashboard`：\n\
  \n![](img/istio-grafana.png)\n\nIstio - Grafana 仪表板\n\n### Prometheus\n\nMixer 带有一个内置的\
  \ `Prometheus` 适配器，用于暴露指标。`Prometheus` 服务器提供了 Istio 指标的持久化存储和查询机制。要访问 `Prometheus`\
  \ 仪表板，请建立从本地端口 9090 到 `Prometheus` 实例的端口转发：\n\n```\nkubectl -n istio-system port-forward\
  \ \\\n  $(kubectl get pod -n istio-system -l app=prometheus -o jsonpath='{.items[0].metadata.name}')\
  \ \\\n  9090:9090\n```\n\n访问 [`localhost:9090/graph`](http://localhost:9090/graph)，并在\
  \ `Expression` 输入框中输入 `istio_request_byte_count`。点击 `Execute`：\n\n![](img/istio-prometheus.png)\n\
  \nIstio - Prometheus 仪表板\n\n### 服务图 (Service Graph)\n\n`ServiceGraph` 服务提供了生成和可视化网格内服务图的功能。它暴露了以下接口：\n\
  \n* `/force/forcegraph.html` 如上，这是一个交互式的 D.js 可视化。\n* `/dotviz` 是静态的 Graphviz 可视化。\n\
  * `/dotgraph` 提供 DOT 序列化。\n* `/d3graph` 提供用于 D3 可视化的 JSON 序列化。\n* `/graph` 提供通用的\
  \ JSON 序列化。\n\n要访问 `Service Graph` 仪表板，请建立从本地端口 8088 到 `Service Graph` 实例的端口转发：\n\
  \n```\nkubectl -n istio-system port-forward \\\n  $(kubectl get pod -n istio-system\
  \ -l app=servicegraph -o jsonpath='{.items[0].metadata.name}') \\\n  8088:8088\n\
  ```\n\n访问 [`localhost:8088/dotviz`](http://localhost:8088/dotviz)：\n\n![](img/istio-dataviz.png)\n\
  \n服务 Graphviz 可视化\n\n`ServiceGraph` 示例构建在 `Prometheus` 查询之上，并取决于标准的 Istio 指标配置。\n\
  \n## 结论\n\n就是这些！我们介绍了 Istio 服务网格的主要概念和组件。这个介绍性章节只是关于 Istio 的安装和核心概念。正如我们在流量管理章节中看到的，有无限的场景和用例你想涵盖，例如故障注入、控制入站和出站流量、断路器等。\n\
  \n我们没有机会涵盖 Istio 的安全功能，因为这需要很多章节来完成。\n\n请保持关注，我将编写关于 Istio 更多强大功能的简短文章！\n\n# 赠 2:\
  \ 服务网格：Linkerd\n\n很快完成 :)\n"
