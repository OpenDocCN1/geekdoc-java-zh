  ## OpenShift 与 Kubernetes 的区别\n\n正如我们已经所说的，OpenShift 是基于 Kubernetes 的。那么，OpenShift\
  \ 额外提供了哪些部分？\n\n### OpenShift Web 控制台\n\nOpenShift 提供了一个全新的 Web 控制台，使用 `Patternfly`\
  \ 框架进行设计和样式化。\n\n![](img/patternfly-sample.png)\n使用 Patternfly 构建的 Web Dashboard\
  \ 示例\n\n`OpenShift Web Console` 是一个基于 `NodeJS` 并使用 `AngularJS`（实际上是 `1.5.11`）编写的\
  \ Web 应用程序，提供了许多优秀功能，\n\n例如 `推送通知` 和 `实时用户体验`。这些功能在流行的 `Kubernetes Dashboard` (Web\
  \ UI) 项目中并不存在。\n\n### 集成容器镜像仓库与 ImageStreams\n\nOpenShift 提供了一个名为 `OpenShift Container\
  \ Registry` (OCR) 的集成容器镜像仓库，它添加了按需自动配置新镜像仓库的能力。这为用户的应用程序构建提供了一个内置位置，用于推送生成的镜像。\n\
  \n每当新镜像推送到 OCR 时，仓库会通知 OpenShift 新镜像的存在，并传递所有关于它的信息，例如命名空间、名称和镜像元数据。OpenShift 的不同部分会对新镜像做出响应，创建新的构建和部署。\n\
  \n在此领域，OpenShift 还引入了一个新概念：`Image Stream`（镜像流）。\n\n`Image Stream` 包含 `Image Stream`\
  \ 规范中指定的任何镜像的所有元数据信息。需要注意的是，`Image Stream` 不包含实际的镜像数据。它最终指向外部仓库（如 registry.access.redhat.com、hub.docker.com\
  \ 等）或指向 OpenShift 的集成仓库。\n\n### 原生 CI/CD 工厂\n\n在设计 OpenShift 时，Red Hat 想要创建一个企业级的解决方案，以帮助团队提高生产力和效率。因此，Red\
  \ Hat 引入了许多优秀新功能，如 CI/CD 工厂和 Pipeline 构建策略。\n\nPipeline 构建策略允许开发者定义一个 Jenkins 流水线供\
  \ Jenkins 插件执行。构建可以像任何其他构建类型一样，由 OpenShift 平台启动、监控和管理。\n\nPipeline 工作流定义在 Jenkinsfile\
  \ 中，可以嵌入在构建配置中，也可以在 Git 仓库中提供。\n\n当项目第一次使用 Pipeline 策略定义构建配置时，OpenShift 平台会实例化 Jenkins\
  \ 服务器来执行流水线。该项目中随后的 Pipeline 构建配置将共享此 Jenkins 服务器。\n\n### 日志与监控\n\nOpenShift 提供了开箱即用的聚合日志（Aggregated\
  \ Logging）功能。在安装 OpenShift 期间，客户可以选择安装 Elasticsearch、Fluentd 和 Kibana (EFK) 进行日志聚合，安装程序将自动处理构建和配置\
  \ EFK。\n\n运行指标的聚合和展示可以在 OpenShift 中开箱即用安装并配置。与日志聚合功能类似，OpenShift 安装过程提供了一种部署指标以监控应用程序和\
  \ OpenShift 自身的简单方法。从 OpenShift 3.7 开始，客户可以在 `Hawkular metrics` 或 `Prometheus` 之间进行选择。\n\
  \n### 版本控制集成\n\nOpenShift 平台利用了托管在内部（如内部 Git 服务器）或外部（例如 GitHub、Bitbucket 等）的现有源码控制管理（SCM）系统。目前，OpenShift\
  \ 平台仅支持 Git 解决方案。\n\nSCM 集成与构建紧密耦合，主要点如下：\n\n* 使用仓库创建 `BuildConfig`，允许在 OpenShift\
  \ 平台内部构建你的应用程序。你可以手动创建 `BuildConfig`，也可以让 OpenShift 平台通过检查你的仓库自动创建。\n\n* 当仓库更改时触发构建。\n\
  \n### 安全\n\n在处理安全方面，OpenShift 有许多优秀功能。\n\n首先，OpenShift 默认不允许以 `Root` 用户运行容器。这种机制旨在防止启用\
  \ Root 权限的容器被破解时保护集群不受恶意访问。这种机制在 Kubernetes 中可以轻松启用，但 OpenShift 开箱即用了这一优秀功能。\n\n\
  同样，RBAC 在 OpenShift 集群中永久启用。这在 Kubernetes 中也可以轻松启用。\n\n\n\n最后一部分是身份验证与授权模型。OpenShift\
  \ 容器平台和 `Kubernetes` API 对凭据的用户进行身份验证，然后根据其角色进行授权。开发者和管理员可以通过多种方式进行身份验证，主要是 `OAuth`\
  \ 令牌和 SSL 证书授权。\n\n开发者（系统的客户端）通常通过像 `oc` 这样的客户端程序调用 `REST API`，或通过浏览器访问 Web 控制台，并在大多数通信中使用\
  \ `OAuth` 密文令牌。基础设施组件（如 `nodes`）使用系统生成的客户端证书，这些证书包含了它们的身份标识信息。运行在容器中的基础设施组件则使用与其服务账户（service\
  \ account）关联的令牌来连接到 `API`。\n\n授权在 OpenShift 容器平台的策略引擎中处理，该引擎定义了如 `create pod` 或\
  \ `list services` 等操作，并将它们分组为策略文档中的角色（roles）。通过用户或组标识符将角色绑定到用户或组。当用户或服务账户尝试执行操作时，策略引擎会在允许其继续之前，检查分配给用户的一个或多个角色（例如，`cluster\
  \ administrator` 或当前项目的 `administrator`）。\n\n由于运行在集群上的每个容器都与一个服务账户相关，因此可以将密钥（secrets）关联到这些服务账户，并将其自动递送到容器中。这使得基础设施能够管理用于拉取推送镜像、构建以及部署组件的密钥，同时也允许代码代码利用这些密钥。\n\
  \n这使得权限管理变得更容易，并可以带来额外的功能，例如 `EFK` 中的功能——你只能看到你有权访问的命名空间（namespaces）/项目的日志。\n\n\
  # OpenShift 有什么变化？\n\nOpenShift 基于 `Kubernetes`。因此，OpenShift 能够处理几乎所有的 `Kubernetes`\
  \ 资源。\n\nOpenShift 和 `Kubernetes` 都处理资源的概念。让我们先定义什么是资源，然后看看每个解决方案所提供的差异。`pod` 是资源的一个示例，包含大量的配置，例如它运行哪些镜像、暴露哪些端口等。你如何部署一个应用程序也是一种资源。\n\
  \n`Kubernetes` 资源本质上是一组关于如何处理它的规范。一个资源由两个元素组成：\n\n*   一个 `name`\n*   一个 `type`\n\
  \n`Kubernetes` 和 OpenShift 通过运行在 `Master Nodes` 上的 `API service` 的 `REST API` 执行\
  \ `CRUD` 操作来管理集群。\n\n### 常见的 Kubernetes 和 OpenShift 资源\n\n1.  `Pods`\n2.  `Namespaces`:\
  \ 在 OpenShift 中我们称之为 `Projects` - 唯一的区别是 `projects` 比 `Kubernetes` `namespaces`\
  \ 拥有安全注解。\n3.  `Deployment Config`\n4.  `Services`\n5.  `Routes`\n6.  `Persistent\
  \ Volumes` & `Persistent Volume Claims`\n7.  `ConfigMaps` & `Secrets`\n\n### OpenShift\
  \ 特有资源\n\n1.  `Images`: 例如 `Docker image`...\n2.  `Image Streams`: 镜像流用于自动执行某些操作，例如当创建新镜像（例如用于该部署的底镜像的新版本）时，更新部署。\n\
  3.  `Templates`: `template` 描述了一组对象，这些对象可以被参数化并处理，以生成供 OpenShift 创建的列表列表。`template`\
  \ 可以被处理以创建你在项目内有权限创建的任何内容，例如服务、构建配置和部署配置。`template` 还可以定义一组标签，应用于模板中定义的每个对象。\n4.\
  \  `Build Config`: `build configuration` 描述单个的构建定义以及何时应该创建新构建的一系列触发器。`Build configurations`\
  \ 由 `BuildConfig` 定义，它是一个 `REST object`，可以用于 `POST` 请求到 `API server` 以创建一个新实例。\n\
  5.  `Routes`: 相同于 `Kubernetes Ingress` - 从历史上看，它是 `Kubernetes` 引入 `Ingresses` 之前的设计。\n\
  \n# 第 15 章：OpenShift 风格\n\n## 引言\n\n在上一章中，我们回顾了 OpenShift 的特性，并已经提到 OpenShift 主要基于\
  \ `Kubernetes`。在本章中，我们将发现当为 OpenShift 开发微服务而不是 `Kubernetes` 时会有变化？\n\n## 什么是 OpenShift\
  \ 风格？\n\nOpenShift 是一个类似于 `Kubernetes` 的平台。正如我们在上一章提到的，它与 `Kubernetes` 共享许多共同资源。\n\
  \n### Route 代替 Ingress\n\n`Kubernetes` 中的 `Ingress` 对象旨在向 `Kubernetes` 平台发出信号，表明\
  \ `Service` 需要被外部访问，并包含了所需的配置，如外部可达的 URL、SSL 等。\n\n对于 OpenShift，红帽在 `Kubernetes\
  \ 引入 ingress 对象之前`就有必要让 `Service` 外部访问，并创建了一个名为 `Route` 的概念来实现相同的目的，同时具有额外的功能，如在多个后端之间分流、粘性会话（sticky\
  \ sessions）等。\n\n在 OpenShift 上创建 `Route` 对象时，它会被内置的 `HAProxy` 负载均衡器获取，以便暴露请求的服务并根据给定的配置使其外部可用。值得提到，尽管\
  \ OpenShift 提供了基于 `HAProxy` 的内置负载均衡器，但它具有可插架构，允许管理员将其替换为 `NGINX`（以及 `NGINX Plus`）或外部负载均衡器（如\
  \ `F5 BIG-IP`）。\n\n此时你可能在想这很令人困惑！应该使用标准的 `Kubernetes ingress` 对象还是使用 OpenShift 的\
  \ `routes`？如果你已经有了使用 `route` 对象的应用程序怎么办？如果你正在部署一个针对 `Kubernetes ingress` 设计的应用程序怎么办？\n\
  \n别担心！自从红帽 OpenShift 3.10 发布以来，`ingress` 对象与 `route` 对象一起被支持。OpenShift `ingress`\
  \ 实现的设计是监控 `ingress` 对象并创建一个或多个 `routes` 以满足条件。如果你更改了 `ingress` 对象，红帽 OpenShift\
  \ `ingress controller` 会同步并应用到生成的 `route` 对象。这些随后会被内置的 `HAProxy` 负载均衡器获取。\n\n`Ingress`\
  \ 和 `Route` 虽然相似，但在成熟度和功能上存在差异。如果你打算在多个 `Kubernetes` 发行版上部署应用程序，`Ingress` 可能是一个很好的选择，尽管你仍然需要处理每个\
  \ `Kubernetes` 发行版提供的复杂路由功能（如 `HTTP` 和 `TLS` 重加密）。对于所有其他应用程序，可能会遇到 `Ingress` 未提供的功能场景。下表总结了\
  \ `Kubernetes Ingress` 和红帽 OpenShift `Routes` 之间的差异。\n\n### 构建应用程序\n\n在 Kubernetes\
  \ 世界中，我们部署已经在集群可用的容器仓库中构建好的容器。我们已经这样做了。为了向 `Kubernetes` 部署 Spring Boot/Cloud 应用，我们：\n\
  \n*   构建打包 Spring Boot/Cloud 应用的 `WAR`\n*   构建持有 `WAR` 包的 `Docker image`\n*   将\
  \ `Docker image` 推送到 `Docker Hub Registry`\n*   创建 `Kubernetes Deployment` 对象，该对象拉取\
  \ `Docker image` 并在集群上创建 `Docker Container`\n\n在 OpenShift 中，红帽思考了一种新的构建机制称为 `Source-to-Image\
  \ (S2I)`。\n\n`Source-to-Image (S2I)` 是一个用于构建可复的 Docker 格式容器镜像的工具。它通过将源代码注入容器镜像并组装来产生就绪镜像。新镜像包含了基础镜像（构建器）和构建的源码，可以使用\
  \ `docker run` 命令运行。`S2I` 支持增量构建，可以重用之前下载的依赖项、之前构建的制品等。\n\n`S2I` 的优势包括：\n\n\n\n\n\
  \n* **镜像灵活性**：`S2I` 脚本可以编写用于将应用程序注入到几乎任何现有的 Docker 格式容器镜像中，利用现有的生态系统。请注意，目前 `S2I`\
  \ 依赖 `tar` 来注入应用程序源码，因此镜像需要能够处理 tar 包内容。\n* **速度**：通过 `S2I`，组装过程可以执行大量复杂操作，而无需每一步都创建一个新层，从而实现快速处理。此外，`S2I`\
  \ 脚本可以编写为重用存储在之前的应用镜像版本中的制品，而不是每次运行构建时都下载或构建它们。\n* **可补丁性**：如果底层镜像由于安全问题需要打补丁，`S2I`\
  \ 允许你一致地重新构建应用程序。\n* **运营效率**：通过限制构建操作而不是像 `Dockerfile` 那样允许任意操作，PaaS  way 人员可以避免对构建系统的无意或刻意的滥用。\n\
  * **运营安全**：构建任意的 `Dockerfile` 会导致主机系统面临 root 权限提升风险。恶意用户可以利用这一点，因为整个 Docker 构建过程都是以具有\
  \ Docker 权限的用户身份运行的。`S2I` 限制了以 root 用户执行的操作，并可以非 root 用户运行脚本。\n* **用户效率**：`S2I`\
  \ 防止开发者在应用构建期间执行任意的 `yum install` 类型操作，这可能会降低开发速度。\n* **生态系统**：`S2I` 鼓励建立共享的镜像生态系统，你可以在其中利用应用程序的最佳实践。\n\
  * **可重现性**：生成的镜像可以包含所有输入，包括构建工具和依赖的特定版本。这确保了镜像可以被精确重现。\n\n### 持续集成与部署\n\n#### OpenShift\
  \ Pipelines\n\nOpenShift Pipelines 使你能够控制在 OpenShift 上构建、部署和提升你的应用程序。通过结合使用 `Jenkins\
  \ Pipeline Build Strategy`、`Jenkinsfiles` 和 `OpenShift Domain Specific Language`（`DSL`，由\
  \ `OpenShift Jenkins Client Plug-in` 提供），你可以为任何场景创建高级构建、测试、部署和提升流水线。\n\n##### OpenShift\
  \ Jenkins Client Plug-in\n\n必须在 Jenkins 主节点上安装 `OpenShift Jenkins Client Plug-in`，这样\
  \ `OpenShift DSL` 才能在应用程序的 `JenkinsFile` 中可用。在使用 `OpenShift Jenkins image` 时，该插件默认会被安装并启用。\n\
  \n有关安装和配置此插件的更多信息，请参阅 `Configuring Pipeline Execution`。\n\n##### OpenShift DSL\n\
  \n`OpenShift Jenkins Client Plug-in` 提供了一个流式风格的 `DSL`，用于从 Jenkins 节点与 `OpenShift\
  \ API` 通信。`OpenShift DSL` 基于 `Groovy` 语法，并提供了控制应用程序生命周期的方法，如 `create`、`build`、`deploy`\
  \ 和 `delete`。\n\n`API` 的完整详情嵌入在运行中的 Jenkins 实例插件在线文档中。要找到它：\n\n* 创建一个新的 `Pipeline\
  \ Item`。\n* 点击 DSL 文本区域下方的 `Pipeline Syntax`。\n* 从左侧导航菜单中，点击 `Global Variables Reference`。\n\
  \n##### Jenkins Pipeline Strategy\n\n为了利用项目中的 OpenShift Pipelines，你必须使用 `Jenkins\
  \ Pipeline Build Strategy`。该策略默认使用源码仓库根目录下的 `jenkinsfile`，但也提供了以下配置选项：\n\n* `BuildConfig`\
  \ 中的内联 `jenkinsfile` 字段。\n* `BuildConfig` 中的 `jenkinsfilePath` 字段，该字段引用相对于源码 `contextDir`\
  \ 的要使用的 `jenkinsfile` 位置。\n\n##### Jenkinsfile\n\n`jenkinsfile` 利用标准的 `groovy` 语言语法，允许对应用程序的配置、构建和部署进行细粒度的控制。\n\
  \n`jenkinsfile` 可以通过以下方式之一提供：\n\n* 位于源代码仓库中的文件。\n* 通过 `jenkinsfile` 字段作为构建配置的一部分嵌入。\n\
  \n当使用第一种选项时，`jenkinsfile` 必须包含在应用程序源码仓库的以下位置之一：\n\n* 仓库根目录下的名为 `jenkinsfile` 的文件。\n\
  * 仓库源码 `contextDir` 根目录下名为 `jenkinsfile` 的文件。\n* 通过 `BuildConfig` 中 `JenkinsPiplineStrategy`\
  \ 部分的 `jenkinsfilePath` 字段指定的文件，如果提供了，则相对于源码 `contextDir`，否则默认为仓库根目录。\n\n`jenkinsfile`\
  \ 在 Jenkins 节点 pod（pod）上执行，如果你打算使用 `OpenShift DSL`，则该 pod 必须可用 OpenShift Client\
  \ 二进制文件。\n\n#### Jenkins\n\nOpenShift Container Platform 提供了一个用于运行 Jenkins 的容器镜像。该镜像提供\
  \ Jenkins 服务器实例，可用于设置持续测试、集成和交付的基本流程。\n\n该镜像还包含一个示例 Jenkins 任务，它可以触发在 OpenShift\
  \ Container Platform 中定义的 `BuildConfig` 的新构建，测试该构建的输出，并在构建成功后对输出重新打标签，以指示构建已准备好投入生产。\n\
  \n##### 使用 Jenkins 作为 Source-To-Image 构建器\n\n若要自定义官方的 OpenShift Container Platform\
  \ Jenkins 镜像，你有两个选项：\n\n* 使用 Docker 分层。\n* 将镜像作为 Source-To-Image 构建器（此处有描述）。\n\n\
  你可以使用 `S2I` 拷贝自定义的 Jenkins Job 定义、额外插件，或用你自己的、自定义配置替换所提供的 `config.xml` 文件。\n\n#####\
  \ 使用 Jenkins Kubernetes 插件运行任务\n\n官方 OpenShift Container Platform Jenkins 镜像包含了预装的\
  \ Kubernetes 插件，允许 Jenkins 节点在多个容器宿主机上动态置配。\n\n要使用 Kubernetes 插件，OpenShift Container\
  \ Platform 提供了三个适用于作为 Jenkins 节点的镜像：`Base`、`Maven` 和 `Node.js` 镜像。\n\n第一个是 Jenkins\
  \ 节点的基础镜像：\n\n* 它拉取了必要的工具（无头 Java、Jenkins JNLP 客户端）以及实用的工具（包括 `git`、`tar`、`zip`\
  \ 和 `nss` 等）。\n* 它将 JNLP 代理建立为入口点。\n* 它包含了 `oc` 客户端，用于在 Jenkins 任务内部调用命令行操作，并且\n\
  * 它提供了针对 CentOS 和 RHEL 镜像的 Dockerfile。\n\n还提供了两个扩展基础镜像的镜像：\n\n* Maven\n* Node.js\n\
  \nMaven 和 Node.js 节点镜像都在 Jenkins Platform 镜像的 Kubernetes 插件配置中配置为 Kubernetes Pod\
  \ 模板。该配置包含了每个镜像的标签，这些标签可以应用于任何 Jenkins 任务的“限制此项目可以运行的范围”设置中。如果应用了标签，给定任务的执行将在运行相应节点镜像的\
  \ OpenShift Container Platform pod 中完成。\n\nMaven 和 Node.js Jenkins 节点镜像提供了针对 CentOS\
  \ 和 RHEL 的 Dockerfile，你可以在构建新节点镜像时引用这些文件。另请注意 `contrib` 和 `contrib/bin` 子目录。它们允许为镜像插入配置文件和可执行脚本。\n\
  \nJenkins 镜像还为 Kubernetes 插件的节点镜像提供了自动发现和自动配置功能。Jenkins 镜像会在其运行的项目所在的现有镜像流中搜索这些镜像。该搜索专门查找标签\
  \ `role` 设置为 `jenkins-slave` 的镜像流。\n\n\n\n\n\n当它找到带有此标签的镜像流时，它会生成相应的 Kubernetes\
  \ 插件配置，以便你可以将 Jenkins 任务分配到运行该镜像流提供的容器镜像的 pod 中。\n\n注意：此扫描仅在 Jenkins 主节点启动时执行一次。如果你标记了额外的镜像流，则需要重启\
  \ Jenkins 主节点以获取额外的镜像。\n\n## OpenShift Container Platform Pipeline 插件\nJenkins 镜像的预装插件列表包含一个辅助创建在针对\
  \ OpenShift Container Platform 服务器上运行的 CI/CD 工作流的插件。它提供了一系列构建步骤、构建后操作以及 SCM 风格的轮询，这些等同于对\
  \ OpenShift Container Platform 服务器及其托管的 API 构件的管理和操作。\n\n除了可以通过 Jenkins 经典的“自由风格”（freestyle）任务访问外，从\
  \ OpenShift Container Platform Pipeline 插件 `1.0.14` 版本开始，构建步骤还可以通过 Jenkins Pipeline\
  \ 插件提供的 DSL 扩展点供 Jenkins Pipeline 任务使用。OpenShift Jenkins Pipeline 构建策略示例说明了如何使用该插件步骤的\
  \ DSL 版本版本。\n\nJenkins 镜像中预配置的示例 Jenkins 任务使用了 OpenShift Container Platform Pipeline\
  \ 插件，并作为在 Jenkins 中为 OpenShift Container Platform 创建 CI/CD 流的示例。\n\n## OpenShift\
  \ Container Platform Client 插件\n通过与 OpenShift Pipeline 插件用户合作获得的经验，结合 Jenkins 和\
  \ OpenShift 的快速演进，为如何从 Jenkins 任务集成 OpenShift Container Platform 提供了宝贵的见解。\n\n因此，新的实验性\
  \ Jenkins OpenShift Client 插件现在作为技术预览提供，并包含在 `docker.io/openshift/jenkins-1-centos7:latest`\
  \ 和 `docker.io/openshift/jenkins-2-centos7:latest` 的 OpenShift Jenkins 镜像中。该插件也可以从\
  \ Jenkins 更新中心获取。OpenShift Client 插件最终将取代 OpenShift Pipeline 插件，成为从 Jenkins 任务集成\
  \ OpenShift 的工具。OpenShift Client 插件提供：\n\n*   用于 Jenkins Pipeline 的流式 语法\n*   使用并暴露\
  \ `oc` 命令可用的任何选项\n*   与 Jenkins 凭据和集群集成\n*   对经典 Jenkins 自由风格任务的持续支持\n\n## OpenShift\
  \ Container Platform Sync 插件\n为了便于 Jenkins 与 OpenShift Container Platform 之间集成的\
  \ OpenShift Container Platform Pipeline 构建策略，OpenShift Sync 插件会监控 OpenShift Container\
  \ Platform 的 API 服务器，查找采用 Pipeline 策略的 `BuildConfigs` 和 `Builds` 的更新，并创建 Jenkins\
  \ Pipeline 项目（当创建 `BuildConfig` 时）或在生成的项目中启动任务（当启动 `Build` 时）。\n\n## 结论\n\n### 迁移\
  \ OpenShift 值得吗？\n我从许多同事、客户甚至我我自己那里得到过这个问题……实际上，我认为 Kubernetes 可以完成 95% 项目所需的所有工作……当然，在某些情况下，对\
  \ OpenShift 的需求是合理的。\n\n### 我在什么时候需要 OpenShift？\n简而言之，如果符合以下情况，选择 OpenShift 更好：\n\
  \n*   你需要来自 Red Hat 的技术/商业支持\n*   你需要一个 Kubernetes 中不存在的更高效的安全层\n*   你需要一个更简单的 Kubernetes\
  \ 版本\n*   你已经处于 Red Hat 合规的环境中（RHEL 或 CentOS 服务器、OpenStack 等……）\n\n### OpenShift\
  \ 真的重要吗？\n我认为 OpenShift 是一个非常棒的产品，但 3.x 版本在安装和升级方面有很多问题和困难。我相信执行这些操作的预算是巨大的，这是在选择解决方案时需要考虑的严肃点。\n\
  \n在 Red Hat 收购 CoreOS 之后，OpenShift 将采用 CoreOS Tectonic 中可用的一些优秀特性，例如一键更新机制。这在 4.x\
  \ 版本中将是一个很好的特性。\n\n### 我可以使用 Kubernetes 完成工作吗？\n是的！当然可以！Kubernetes 是一把瑞士军刀 :) 你可以利用从容器编排器所需的所有强大功能。确实，某些需求将非常难以启用和配置，例如集群的安全概念。但对于解决方案来说，这仍然是可以实现的目标。\n\
  \n我个人建议使用原生 Kubernetes 并利用它的所有功能。OpenShift 仍然是一个很好的选择，但你必须对 OpenShift 的所有沉重任务和要求谨慎。\n\
  \n# 第四部分：结论\n\n# 第十六章：结论\n\n## 开发\n开发微服务已变成一种艺术 :) 你正在从一个相当糟糕的旧单体应用开始绘制一幅全新的应用程序组件蓝图。\n\
  \n这些开发需要以迭代的方式完成……一步之发生巨大变化带来的大效应在 99% 的情况下都是失败的。\n\n你可以逐步拆分单体应用，每一步定义一个边界上下文，正如我们之前做的那样。这种方法是非常安全的迁移路径，被证明是高效的。\n\
  \n## Fabric8 Maven 插件\n我将永远感谢这个出色的插件。自从发现它以来，它帮助我节省了大量工作和时间。我记得第一次发现它时花了一个通晚上尝试这个插件。\n\
  \nRed Hat Fabric8 团队在插件的演进方面付出了巨大努力。我期待 4.x 版本。我希望这个优秀助手的未来版本能带来更好的性能和更多强大的功能。\n\
  \n## 部署\n将微服务部署为容器是最有效、最强大的交付方式。Kubernetes 提供了许多方法和插件让生活变得简单。例如，我们可以谈谈 `Jenkins-X`：它是适用于\
  \ Kubernetes 上现代应用的 CI/CD 解决方案。\n\n`Jenkins-X` 具有许多强大的功能：\n\n*   自动化 CI 和 CD：不需要深入了解\
  \ Jenkins Pipeline 的内部，Jenkins X 将为你的项目默认生成实现完整 CI 和 CD 的优秀流水线。\n*   应用程序、环境和推广：每个团队获得一组环境。Jenkins\
  \ X 然后通过 GitOps 自动管理环境以及新版本应用程序在环境之间的晋升。\n*   拉取请求预览环境：Jenkins X 会为你的 Pull Request\
  \ 启动预览环境，以便你在更改合并到 master 分支之前获得快速反馈。\n*   问题和拉取请求的反馈：Jenkins X 会自动对你的 Commit、Issue\
  \ 和 Pull Request 进行评论，反馈代码是否已准备好预览、是否已晋升到环境或是否自动生成了用于升级版本的 Pull Request。\n\n这些强大的功能是通过对\
  \ Kubernetes API 的极佳的集成和支持实现的：\n\n![](img/jx-arch.png)\n\nJenkins-X 架构 - 摘自官方文档的图表\n\
  \n## 终结\n非常感谢你花时间阅读这本书！我希望我能够表达出我在 Kubernetes 和 OpenShift 上实践微服务的想法和配方。\n\n如果你对我提供的任何章节需要更多解释，或者对任何你感兴趣的其他主题有需求，我将随时待命。\n\
  \n现在，我们将开始奖励章节 :) 第一个将关于 Istio 服务网格 ;)\n\n感谢你对本书的关注！下书见！\n\n\n\n\n在本书中，我们将介绍基于 `Kubernetes`\
  \ 和 `OpenShift` 的微服务架构。正如我们在本书 `第二部分` 前几个章节中所看到的，微服务架构中最重大的变化之一是应用程序组件之间的通信。在`单体应用`中，它是`程序化调用`，而在微服务架构中，它们变成了`REST\
  \ 调用`。当我们说`REST 调用`时，首先想到的是：`网络`，以及它所有的优势和陷阱。\n\n如果我们回溯书中示例应用的全局架构：\n\n![](img/10-final-microservices-architecture.png)\n\
  \n# 全局架构大图\n\n你可以看到基础设施服务（如 `Hystrix Dashboard`、`EFK`、`Config Server`、`Tracing Server`\
  \ 等）也可以通过`Network` 访问。\n\n在构建微服务时，我们在单体应用中熟悉的部署、监控、安全以及许多实践正在发生变化。作为开发者，我们对使用微服务感到非常开心。但运维团队并不与我们分享这种快乐\
  \ :D，因为这种架构模型给他们带来了更多的限制。\n\n对于开发和运维双方，解决这些繁重任务的绝佳解决方案是`服务网格`（Service Mesh）。\n\n\
  # 什么是服务网格？\n\n服务网格是一种新的架构范式，它直接在计算集群内部为基于容器的微服务应用提供流量管理、安全和可观测性等服务。服务网格通过由 API 控制的软件组件提供监控、扩展性和高可用服务，而不是使用离散的硬件设备。这种灵活的框架减少了与现代解构应用相关的运维复杂性。\n\
  \n云原生应用和容器的出现，产生了需要服务网格来交付负载均衡等关键应用服务的需求。相比之下，尝试在每个位置和每个服务器上放置并配置物理硬件负载均衡器是极具挑战性且昂贵的。\n\
  \n`服务网格`是微服务之间的胶水，它添加了额外的功能，例如：\n\n* 服务发现\n* 路由和流量配置\n* 加密和身份验证/授权\n* 指标和监控\n* 以及更多..\n\
  \n这些能力允许开发者专注于业务逻辑，而不会被这些基础设施能力所困扰。\n\n`服务网格`诞生于容器和云原生应用的黄金时代。因此，它的设计初衷主要是为了跨部署平台工作。\n\
  \n`服务网格`在容器旁边提供一系列`网络代理`。每个`代理`都作为容器之间交互的`网关`。`代理`接受连接并将负载分散到`服务网格`中可以处理请求的适当下游容器。\n\
  \n一个`中央控制器`负责编排这些连接。虽然服务流量直接在代理之间流动，但`控制平面`（control plane）知道每一次交互。`控制器`交付`访问控制策略`并`收集性能指标`。`控制器`还与\
  \ `Kubernetes` 和 `Mesos` 等平台集成，这些是用于自动化部署和管理`容器化应用`的开源系统。\n\n在具有活动服务网格的环境中，对微服务的请求看起来如下：\n\
  \n![](img/service-mesh-architecture.png)\n\n## 服务网格架构\n\n两个主要组件：\n\n* 数据面包含微服务实例、侧边器代理（sidecar\
  \ proxies）以及它们之间的交互。它拦截所有入站和出站网络流量。\n* 控制面处理诸等任务，如创建新实例、终止不健康或需要的实例、监控、集成监控与管理、实现应用范围的策略以及优雅地关闭整个应用程序。控制平面通常包含或设计为连接到应用程序接口、命令行界面和用于管理应用程序的图形用户界面。\n\
  \n# 为什么我们需要服务网格？\n\n`服务网格`为企业带来了许多好处：\n\n* 更快的应用开发、测试和部署。\n* 更高效、更快速的应用更新。\n* 位于容器集群旁边的轻量级解构代理数据层，在管理网络服务的交付方面非常有用且高效。\n\
  * 更少的样板代码，提供许多服务所需的工作量更少。\n\n我们的微服务需要一系列服务，如负载均衡、流量管理、路由、健康监控、应用监控、安全功能和策略、服务和用户身份验证、防止入侵和\
  \ DDoS 攻击、支持应用程序的优雅升级以及错误处理等 :)) `服务网格`将作为集成在平台（如 `Kubernetes`）中的服务交付所有服务。\n\n#\
  \ 结论\n\n微服务架构的设计是为了使应用的开发和部署变得快速且可靠。`服务网格`的出现是为了帮助开发和运维团队提高效率，并以更容易的方式实现目标。\n\n\
  这就是关于`服务网格`是什么的理论部分和介绍。\n\n在接下来的章节中，我们将测试一些`服务网格`的实现。实际上，我计划编写关于 `Istio` 和 `Linkerd`\
  \ 的内容。如果你需要关于其他产品的教程，请随时通过 `lnibrass@gmail.com` 与我联系。\n\n# 奖励 1：服务网格：Istio\n\n##\
  \ 什么是 Istio？\n\n`Google` 将 `Istio` 作为一个用于连接、监控和保护微服务的开放平台提出。\n\n`Istio` 是一种服务网格实现，提供了许多云原生能力，如：\n\
  \n* 流量管理：服务发现、负载均衡、故障恢复、A/B 测试、金丝雀发布等..\n* 可观测性：请求追踪、指标、监控、审计、日志等..\n* 安全：ACLs、访问控制、速率限制、端到端身份验证等..\n\
  \n`Istio` 在不更改任何运行在同一 `Kubernetes` 集群上的微服务代码的情况下，交付了所有这些出色的功能。\n\n在我们案例中，当我们编写微服务时已经实现了这些许多功能和能力。如果我们从一开始就有\
  \ `Istio`，我们可以通过将所有这些能力委托给 `Istio` 来节省大量的精力和时间。\n\n### Istio 架构\n\n`Istio` 服务网格由两部分组成：\n\
  \n* 数据面负责建立、保护和控制通过服务网格传输的流量。指示数据面如何行为的管理组件被称为`控制平面`。\n* 控制平面是网格的大脑，并为操作员提供 API\
  \ 以操作网络行为。\n\n![](img/istio-service-mesh-architecture.png)\n\n### Istio 组件\n\n从\
  \ `Istio 架构`图中，我们可以看到位于生态系统不同区域的不同组件：\n\n#### Envoy\n\n每个微服务一个侧边器代理，用于处理集群内服务之间以及从服务到外部服务的入站/出站流量。代理形成了一个`安全的微服务网格`，提供了丰富的功能，如发现、丰富的第\
  \ 7 层路由、断路器、策略执行以及遥测记录/报告功能。\n\nEnvoy 以侧边器的形式部署在相关微服务的同一个 Kubernetes Pod 中。这种部署允许\
  \ Istio 能够提取出关于流量行为的大量信号作为属性。Istio 随后可以在 Mixer 中使用这些属性执行策略决策，并将它们发送到监控系统，以提供有关整个网格行为的信息。\n\
  \n#### Mixer\n\n\n\n\n# Mixer 组件\n\nMixer 是一个核心组件，代理和微服务利用它来执行策略，如授权、速率限制、配额、身份验证、请求追踪和遥测数据收集。\n\
  \nMixer 包含一个灵活的插件模型。该模型使 Istio 能够与各种主机环境和基础设施后端接口。因此，Istio 将 Envoy 代理和 Istio 管理的服务从这些细节中抽象出来。\n\
  \n## Pilot\n\nPilot 为 Envoy sidecar 提供服务发现，并为智能路由提供流量管理能力（例如 A/B 测试、金丝发布等），以及弹性能力（超时、重试、断路器等）。\n\
  \nPilot 将控制流量行为的高级路由规则转换为 Envoy 特有的配置，并在运行时将它们传播到 sidecar。Pilot 抽象了特定平台的服务发现机制，并将其合成为一个标准格式，任何符合\
  \ Envoy 数据平面 API 的 sidecar 都可以消费该格式。这种松耦合允许 Istio 运行在 Kubernetes、Consul 或 Nomad\
  \ 等多个环境中，同时保持相同的流量管理操作界面。\n\n## Citadel\n\nCitadel 通过内置的身份和凭据管理，提供强有的服务间以及终端用户身份验证。你可以使用\
  \ Citadel 升级服务网中的未加密流量。通过 Citadel，操作人员可以基于服务身份而非网络控制来执行策略。从 0.5 版本开始，你可以使用 Istio\
  \ 的授权功能来控制谁可以访问你的服务。\n\n## Galley\n\nGalley 代表其他 Istio 控制平面组件验证用户编写的 Istio API 配置。随着时间的推移，Galley\
  \ 将接管作为 Istio 顶层配置接入、处理和分发组件的角色。它将负责将其他 Istio 组件从底层平台（例如 Kubernetes）获取用户配置的细节中隔离离开。\n\
  \n# 开始使用 Istio\n\n### 要求\n\n我们将在 `Kubernetes` 上玩 `Istio`。为了测试该解决方案，你需要像常一样在你的机器上运行一个\
  \ `Minikube`。\n\n本章的示例将运行在 `Minikube` `v0.35.0` 上，并带有自定义配置：`4 CPU 与 8GB 内存`。\n\n\
  ### 获取并安装 Istio\n\n要开始下载并安装 Istio，只需输入以下命令：\n\n```bash\ncurl -L https://git.io/getLatestIstio\
  \ | sh -\n```\n\n命令执行完成后，你将看到类似下面的消息：\n\n```bash\nAdd /Users/n.lamouchi/istio-1.0.6/bin\
  \ to your path; e.g copy paste in your shell and/or ~/.profile:\n\nexport PATH=\"\
  $PATH:/Users/n.lamouchi/istio-1.0.6/bin\"\n```\n\n此命令将 Istio 二进制文件路径添加到本地变量 `PATH`\
  \ 中（如控制所示）。\n\n接下来，我们将移动 Istio 包目录：\n\n```bash\ncd istio-1.0.6/\n```\n\n第一步，你必须安装\
  \ Istio 的自定义资源定义（CRD）：\n\n```bash\nkubectl apply -f install/kubernetes/helm/istio/templates/crds.yaml\n\
  ```\n\n接下来，我们需要安装 Istio 的核心组件。我们有四种不同的方法来实现：\n\n* **选项 1**：安装 sidecar 之间**没有**双向\
  \ TLS 认证的 Istio\n* **选项 2**：安装带有默认双向 TLS 认证的 Istio\n* **选项 3**：使用 Helm 渲染 Kubernetes\
  \ manifest 并使用 kubectl 部署\n* **选项 4**：使用 Helm 和 Tiller 管理 Istio 部署\n\n在本教程中，我们将使用\
  \ `选项 1`：\n\n要安装 Istio：\n\n```bash\nkubectl apply -f install/kubernetes/istio-demo.yaml\n\
  ```\n\n### 验证安装\n\n为了确保 Istio 组件已正确安装，需要安装这些 Kubernetes 服务：`istio-pilot`、`istio-ingressgateway`、`istio-policy`、`istio-telemetry`、`prometheus`、`istio-galley`\
