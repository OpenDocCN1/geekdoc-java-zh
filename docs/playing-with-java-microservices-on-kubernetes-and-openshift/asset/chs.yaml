  \n`Swagger 2` 是一个用于描述和记录 RESTful API 的开源项目。`Swagger 2` 与语言无关，并且可以扩展到 HTTP 之外的新技术和协议。当前版本定义了一组\
  \ HTML、JavaScript 和 CSS 资源，用于从符合 `Swagger` 的 API 动态生成文档。这些文件由 `Swagger UI` 项目打包，以便在浏览器中显示\
  \ API。除了渲染文档，`Swagger UI` 还允许其他 API 开发者或消费者与 API 资源交互，而无需具备任何实现逻辑。\n\n`Swagger 2`\
  \ 规范（被称为 `OpenAPI` 规范）有多种实现。我们将在项目中使用 `Springfox` 实现。\n\n`Springfox` 实现了 API 文档的自动化生成。`Springfox`\
  \ 的原理是在运行时检查应用程序，根据 Spring 配置、类结构和各种编译时 Java 注解来推断 API 语义。\n\n为了在我们的项目中启用 Swagger\
  \ 功能，我们将：\n\n*   添加 Maven 依赖\n*   添加 Java 配置\n\n让我们行动起来吧！\n\n#### Maven 依赖\n\n我们需要在\
  \ `pom.xml` 文件中添加一些 Maven 依赖：\n\n```xml\n<dependency>\n    <groupId>io.springfox</groupId>\n\
  \    <artifactId>springfox-swagger-ui</artifactId>\n    <version>2.9.0</version>\n\
  </dependency>\n<dependency>\n    <groupId>io.springfox</groupId>\n    <artifactId>springfox-swagger2</artifactId>\n\
  \    <version>2.9.0</version>\n</dependency>\n```\n\n#### Java 配置\n\n对于 Java 配置，我们需要创建一个\
  \ `Spring` `@Bean` 来在应用程序上下文中配置 `Swagger`：\n\n```java\n@Configuration\npublic class\
  \ SwaggerConfiguration {\n\n    @Bean\n    public Docket productApi() {\n      \
  \  return new Docket(DocumentationType.SWAGGER_2).select()\n                .apis(RequestHandlerSelectors.any())\n\
  \                .paths(PathSelectors.any())\n                .build();\n    }\n\
  }\n```\n\n此外，我们还需要 SpringBootApplication 主类中添加 `@EnableSwagger2` 注解：\n\n```java\n\
  @EnableSwagger2\n@SpringBootApplication\npublic class MyboutiqueApplication {\n\n\
  \    public static void main(String[] args) {\n        SpringApplication.run(MyboutiqueApplication.class,\
  \ args);\n    }\n}\n```\n\n#### Hello World Swagger !\n\n运行 Spring Boot 应用程序，只需运行：`mvn\
  \ spring-boot:run`\n\n应用程序将在 8080 端口运行。\n\n我们现在可以享受游戏了：要访问 Swagger UI，只需访问 `http://localhost:8080/swagger-ui.html`\n\
  \n![](img/2-swagger.png)\n\nSwagger UI\n\n# 第 3 章：升级单体应用\n\n## 重构数据库\n\n现在我们想从 `H2\
  \ Database` 迁移到 `PostgreSQL`。因此，我们必须通过在 `application.properties` 文件中指定 JDBC 驱动程序、url、用户名、密码等属性来配置应用程序使用它，并在\
  \ `pom.xml` 中添加 `PostgreSQL JDBC Driver`。\n\n首先，我们从在 `pom.xml` 中将 `H2 Driver` 依赖替换为\
  \ `PostgreSQL Driver` 依赖开始：\n\n```xml\n<dependency>\n    <groupId>org.postgresql</groupId>\n\
  \    <artifactId>postgresql</artifactId>\n    <scope>runtime</scope>\n</dependency>\n\
  ```\n\n接下来，我们对 `application.properties` 进行一些修改：\n\n```properties\nspring.datasource.driver-class-name=org.postgresql.Driver\n\
  spring.jpa.hibernate.ddl-auto=create\nspring.datasource.url=jdbc:postgresql://localhost:5432/demo\n\
  spring.datasource.username=developer\nspring.datasource.password=p4SSW0rd\n```\n\
  \n1. 数据源指向本地 **PostgreSQL** 实例，数据库名为 `demo`。\n2. **PostgreSQL** 实例的用户名和密码。\n\n现在，如果你重启\
  \ Spring Boot 应用程序，将使用 `PostgreSQL` 实例而不是嵌入式 `H2` 实例。\n\n# 第 4 章：构建与部署单体应用\n\nSpring\
  \ Boot 可以轻松创建独立的 Java Web  JAR 或 WAR 文件。但通常在生产环境中已经存在服务器。那么在这种情况下，我们如何构建和部署应用程序？我们的应用程序如何与其他已存在的应用程序一起运行？\n\
  \n## 构建单体\n\n在我们的技术栈中，对于 Spring Boot 应用程序，我们使用 Maven 作为支持依赖管理的构建系统。\n\nMaven 帮助管理构建、文档、报告、依赖、软件配置管理\
  \ (SCM)、发布和发行。许多集成开发环境 (IDE) 都提供了 Maven 插件或附加组件，从而允许在 IDE 内部编译项目。\n\n一旦你学会了几个核心概念，使用\
  \ Maven 就非常简单。每个项目包含一个名为 POM（项目对象模型）的文件，它只是包含项目细节的 XML 文件。其中一些细节可能包括项目名称、版本、包类型、依赖、Maven\
  \ 插件等。\n\n在此阶段，我们的 `pom.xml` 文件可能如下所示：\n\n\n\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<project xmlns=\"http://maven.apache.org/POM/4.0.0\" \n         xmlns:xsi=\"\
  http://www.w3.org/2001/XMLSchema-instance\" \n         xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0\n\
  http://maven.apache.org/xsd/maven-4.0.0.xsd\">\n\n   <modelVersion>4.0.0</modelVersion>\n\
  \   <groupId>com.targa.labs</groupId>\n   <artifactId>myboutique</artifactId>\n\
