    and each time the size of the problem is halved. You are done when the element
    is found or the problem is trivial. Binary search is an example of a general solving
    technique, commonly called divide and conquer.


    Given a problem P is the technique: P is divided into a number of sub-problems
    P1, P2, ..., Pk, each of which is simpler than the original problem P. The sub-problems
    are solved and a number of sub-solutions are obtained. Finally, the partial solutions
    are combined to solve the original problem.'
