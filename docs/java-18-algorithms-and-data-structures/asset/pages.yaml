    FOREWORD


    # FOREWORD


    The current book is the eighth in this series of books on software development
    in Java. The book requires basic knowledge about Java and system development and
    here especially knowledge of the principles of object oriented programming as
    presented in the books Java 3 and Java 4. The book focuses on algorithms and several
    classic algorithms, but in conjunction with algorithms, the primary goal is to
    introduce algorithm analysis, and then allowing the reader to be able to compare
    and evaluate the complexity of algorithms with each other. In addition, the book
    treats the classic data structures such as lists and trees and shows how data
    structures can be implemented in Java. In addition to the implementation of many
    of the classic data structures and discussing the applied algorithms, the book
    introduces several programming techniques that are useful/necessary to work as
    a professional software developer.


    As the title says this series of books deals with software development, and the
    goal is to teach the reader how to develop applications in Java. It can be learned
    by reading about the subject and by studying sample programs, but most importantly
    by yourself to do and write your own programs from scratch. An important part
    of the books is exercises and problems, where the reader has to write programs
    that correspond to the substance being treated in the text. All books in the series
    are built around the skeleton and will consist of text and examples and exercises
    and problems that are placed in the text where they naturally belongs. The difference
    between exercises and problems is that the exercises largely deal with repetitions
    of the substance that is presented in the text, and furthermore it is relatively
    accurate what to do. Problems are in number more loosely described, and are typically
    a little bigger and there is rarely any clear solution. These books are to be
    read from start to finish, but the many examples including exercises and problems
    play a central role, and it is important that the reader predict in detail studying
    the code to the many examples and also solves the exercises and problems or possibly
    just studying the recommended solutions.


    All books end with one or two larger sample programs, which focus primarily on
    process and an explanation of how the program is written. On the other hand these
    code only to a limited extent – if at all – and the reader should study the finished
    program code while testing the program. In addition to show the development of
    programs that are larger than the examples, which otherwise is presented, the
    aid of the concluding examples is also to show program examples from varying fields
    of application.


    Most books also include an appendix dealing with a subject that would not be treated
    in the books. It may be issues on the installation of software or other topics
    in computer'
