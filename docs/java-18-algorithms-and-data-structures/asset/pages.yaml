    # ALGORITHM ANALYSIS


    basically about CPU time and memory, which are two resources that are always limited.
    In principle, you can equip the machine with a faster CPU and increase the machine''s
    memory, but whatever can solve the problem of an inefficient algorithm. However,
    modern machines have so much memory that too little memory is a rarity (at least
    as long as you talk about a regular PC), and often you perceive the CPU as a more
    restrictive resource. For the algorithms, the focus is primarily on writing algorithms
    that utilize the CPU as well as possible, that is the same that the algorithm
    and the program being executed as quickly as possible. It is said that the algorithm
    must have optimal time complexity.


    If you have written a program you can measure its time complexity by a clock and
    thus find out how long it takes to perform an algorithm and it certainly has interest
    in practice and if nothing else is in connection with it. However, one should
    be aware that such timing depends on the machine that performs the algorithm and
    in many contexts it is more interesting to assess the overall nature of the algorithm
    and associate a functional expression with an algorithm that may in one way or
    another characterize its efficiency — among things, because you to a much greater
    degree are able to compare algorithms with each other.


    # 3.1 THE COMPLEXITY OF LINEAR SEARCH


    To show what algorithm analysis is about, I will look at linear search, as an
    algorithm discussed above. But best, the element that is searched for is found
    at the first comparison. If so, the execution time — also called its time complexity
    — is independent of the size of the array. It is said that the algorithm has a
    best complexity that is constant. The best time complexity does not depend on
    which array is searched and is the same every time. One writes that the best time
    complexity is O(1), that read “big o of I”.


    At the worst case, you compare with all elements in the array, and if the array
    has N elements, you must perform N operations where an operation consists in comparing
    the element with the element in a particular place in this case. the execution
    time depends on the array size, so that the execution time grows as a linear function
    (and hence the algorithm''s name). It is said that the worst time complexity depends
    linearly on the array size, O(N) — read “big o of N”. It expresses that the worst
    execution time behaves as a linear function of the array''s length.


    If you do not know what elements the array contains, you ought to search halfway
    through the array — you cannot know the element that you are looking for to be
    searched at the beginning or end — and if you have an array with N elements, you
    must expect to perform vN operations. It is still a linear function of the array
    size (with a smaller increase), and the algorithm therefore has an average time
    complexity that is O(N).


