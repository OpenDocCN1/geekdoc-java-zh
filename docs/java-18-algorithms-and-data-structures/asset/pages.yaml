    # 4.4 SHELL SORT


    The next algorithm is called shell sort. It is characterized by being far more
    effective than the above algorithms, having constant memory complexity, but also
    being more difficult both to implement and review.


    The idea is to divide the array into a number of sub-arrays called segments. Each
    of these segments is then sorted by one of the above methods, utilizing its effectiveness
    on small arrays. Once that is done, the process is repeated, but this time with
    fewer and larger segments, and here, utilizing a method like insertion sort is
    effective if the array is already almost sorted. The process repeats until there
    is one segment. The first problem is to select the number of segments that are
    determined by the following sequence:


    ```

    $a_k = \begin{cases} 0 & k=0 \ 2a_{k-1} + 1 & k>0 \end{cases}$

    ```


    that is 1, 3, 7, 15, 31, 63, 127, ... Note that


    ```

    $a_k = 2a_{k-1} + 1 \Leftrightarrow a_{k-1} = \frac{1}{2}(a_k - 1)$

    ```


    and thus it is easy to determine the number of segments for the next iteration.
    Also note that the sequence is essentially doubling, and thus it is a sequence
    that grows fast.


    If there are $n$ elements to be sorted, the number of segments is the largest
    value from the sequence that is less or equal to $n$. For example, if there are
    $a$ segments, the segments are defined as:


    +   0th segment: $t[0], t[a], t[2a], t[3a], ...$

    1st segment: $t[1], t[a+1], t[2a+1], t[3a+1], ...$

    ith segment: $t[i], t[a+i], t[2a+i], t[3a+i], ...$

    $(a-1)$th segment: $t[a-1], t[2a-1], t[3a-1], t[4a-1], ...$


    If there are $k$ elements in the $i$th segment, then


    ```

    $(k-1)a+1 \leq n \Rightarrow k \leq \frac{n-1}{a} +1$

    ```


    The above segments are sorted for insertion sort. In practice, it may be a bit
    complex, as the segment does not consist of continuous elements, so you need to
    control the indexing. In the next repeat, the number of segments is set to $(a-1)/2$,
    which is the previous item in the above sequence, and the repeat continues until
    the number of segments 0.'
