    THE CONCEPT OF ALGORITHMS


    # 2.2 RECURSION


    Among other things, within mathematics, it is very to define formulas and definitions
    recursively, where a formula is expressed by itself. You can define a difference
    series with difference d as follows:


    ```

    a_n = \left(\begin{array} a & n = 1 \ a_{n-1} + d & n > 1 \end{array}\right)

    ```


    Another example is the formula for factorial


    ```

    n! = \left(\begin{array} 1 & n = 0 \ n(n-1) & n > 0 \end{array}\right)

    ```


    where the term is just expressed by itself: If you know (n-1)! you can also decide
    n!, and when 0! is known, one can decide 1! and then you can decide 2! and then
    again 3! etc.


    If you want to write an algorithm that can determine n!, You can immediately apply
    the following formula:


    ```

    if (n == 0) return 1

    return n * Factorial(n - 1);

    ```


    Note that the algorithm is a direct rewriting of the mathematical definition,
    and the crucial thing is that the algorithm is written by itself – the algorithm
    calls itself, and an algorithm that calls itself is called recursive algorithm.


    In Java, an algorithm is written as a method, and a method can, for example, call
    another method, and easily. Thus, Java supports recursion, and the algorithm can
    therefore be implemented directly as follows:


    ```

    // n must be none negative

    public static long factorial(int n)

    {

    return n == 0 ? 1 : n * factorial(n - 1);

    }

    ```


    Recursive algorithms are often simpler than a corresponding non-recursive algorithm
    (also called an iterative algorithm) solving the same problem, but it is often
    more difficult to find out where a recursive algorithm is correct. In this case,
    however, it is easy because the algorithm is merely a copy of the mathematical
    definition.


    It is also possible (easy) to implement the algorithm to determine the factorial
    without the use of recursion – thus as an iterative algorithm:'
