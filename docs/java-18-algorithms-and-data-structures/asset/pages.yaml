    It corresponds exactly a square time complexity. In the middle the least element
    must be moved n/2 passes that give the same complexity. The algorithm therefore
    has an average time complexity on O(n²). In return, the algorithm only uses memory
    for some simple variables, so its memory complexity is O(1).


