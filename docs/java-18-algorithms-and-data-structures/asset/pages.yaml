    usually override together with equals() (overrides one of them and not the other
    gives a warning), and the only requirement is if two objects are equal(), they
    must also have the same hash code. Conversely, the reverse is not a requirement,
    and you may have two objects that have the same hash code but not equal().


    hashCode() is a hash function, and the result is that each type in Java has its
    own hash function, but for custom types it is left to the programmer to implement
    the function so you get a good hash function with value semantics. For most classes,
    including the class String, it is done, and it is not necessary to do any further.
    For example, hashCode() for Integer returns the number itself, hashCode() of a
    Long returns a XOR of the top 32 bits with the last 32 bits. If n is a Long, the
    hash code is determined as:


    ```

    (int) ^ (n >> 32)

    ```


    Then there is the collision problem. In general, there will be more keys than
    there are places in the array that will contain the objects. Therefore, collision
    will always occur in practice. The whole idea of hashing is that by key you can
    find the location of an object with constant time complexity. To succeed, there
    be few collisions and short collision chains. It is therefore part of implementing
    a collection using hashing to solve the collision problem. I want to mention four
    ways.


    The first one is using an overlay area. To the data structure, a list of the objects
    resulted in a collision is linked. This solution means that you can insert objects
    into the data structure with constant time complexity, collision or not. If you
    add a new object and it is a collision, the object is added to the overlay area,
    and both operations have constant time complexity, the time of the total operation
    is constant. The disadvantage is of growth in access of an element in the data
    structure. Basically, the location is calculated, and if you do not find the object
    with the correct key, you search the overlay area. If there are many collisions,
    the number of objects in the overlay area can be large, and the access time for
    an element will have linear time complexity. It is simple to solve the collision
    problem using an overlay area, but conversely the access time can be long. However,
    it is worth paying attention to the technique, as it is actually a modified form
    that you typically use in practice.


    Another simple way is to use the next available space, a method that is also called
    linear probing. If an object is to be inserted and the result is a collision,
    you check the next position and if this position is available, place the element
    there. If it is not available, try'
