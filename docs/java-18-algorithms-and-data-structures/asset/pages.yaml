    # Sorting


    As the example, I will look at sorting an array, and more precisely, I will look
    at the sorting of the elements in an array of N elements in ascending order. It
    is a classic problem and there are many algorithms to solve the problem. In the
    next chapter, I will specially look at sorting algorithms, while I here just want
    to show an example called bubble sort. The algorithm is very simple. You pass
    through the array and compare the elements in pairs (each element with its successor).
    If you meet two elements that are incorrectly arranged – one is larger than the
    other – then you swap them. This process is repeated until you have completed
    an iteration interchange. At that time, the array is sorted – then there are no
    element that are larger than the successor.


