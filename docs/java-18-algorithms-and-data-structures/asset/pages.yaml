    The above suggests what it takes to implement insertion into an AVL tree. You
    insert the item in the usual way, after which you go back to investigate whether
    an imbalance exists in the parent for the sub-tree into which the new node is
    inserted, and if one of the four rotations, as described above, is performed after
    which the balance is restored. This procedure continues until you reach the root,
