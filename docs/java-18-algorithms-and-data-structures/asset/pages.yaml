    # 3.4 DEFINITION OF COMPLEXITIES


    In this section, I would like to define the concept of complexity a little more
    formally.


    Let an algorithm be given where the execution time depends on a positive integer
    N and

    so that the execution time can be described by a function T(N). If also F(N) is
    a function

    of N, it is said that the algorithm''s complexity is O (F(N)) if there is a constant
    c and

    p positive integer so


    T(N) ≤ cF(N) N ≥ N₀


    It expresses that for large values of N, the execution time is not worse than
    constant times

    (N). Saying a bit differently, the function F(N) defines an upper limit for how
    wrong it

    may be.


    It should be added that there are other complexity measures “big o”, but I will
    be

    happy with that, as it is primarily the one you encounter in.


    There are no specific requirements for the function F(N), but in practice it typically

    be one of the following functions, where the logarithm function (usually) is the
    2-number

    logarithm and the sequence describing how fast the functions grows for large values
    of N:


    +   - Constant whose graph is a horizontal line

    - log(N) The logarithm function graph is flat curve

    - log²(N) The square of the logarithm function

    - √N The square root function

    - N A linear function, whose graph is a growing straight line

    - Nlog(N) N times the logarithm function whose graph grows much smaller than N²

    - N² Square function whose graph is a parabola

    - N³ The cubic function whose graph is a very fast growing function

    - 2N The exponential function


