  md: '# JAVA 18: ALGORITHMS AND DATA


    # ALGORITHM ANALYSIS


    At the third comparison, the interval is halved again, so that you now have to
    searched among


    $$\frac{N}{2} = \frac{N}{4} = \frac{N}{2^2}$ elements


    Then you proceed so that each repeat the length of the interval is halved, and
    by that $k$th comparison, the interval length is


    $$\frac{N}{2^{k-1}}$


    The loop therefore stops when


    $$\frac{N}{2^{k-1}} < 1 \Rightarrow N < 2^{k-1} \Rightarrow \log(N) < \log(2^{k-1})
    \Rightarrow \log(N) < k - 1 \Rightarrow \log(N) + 1 < k$


    where the logarithm function is the 2-number logarithm. That is, in worst case,
    the algorithm stops after $log(N)$ comparisons, and the worst time complexity
    for binary search is therefore $O(\log(N))$.


    The complexity is somewhat more difficult to calculate and includes summation
    of a number of weighted averages, but it may appear to be $O(\log(N))$ and thus
    the same as the worst complexity. The result for binary search is as follows:


    +   - best time complexity: $O(1)$

    - average time complexity: $O(\log(N))$

    - worst time complexity: $O(\log(N))$


