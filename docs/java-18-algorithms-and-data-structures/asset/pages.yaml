    matrices. I only implemented matrix multiplication in its classic form so there
    is room for improvements. There are other algorithms for matrix multiplication,
    which have even better time complexity, but they have theoretical import.


    Similar to the above, the implementation of the class Matrix is quite simple and
    only uses simple algorithms. The same applies to the two classes RowVector and
    ColVector, which do not need further comments.


    Back there is class SquareMatrix, and it is immediately more complex. The reason
    for the class is that particular matrix operations only make sense for square
    matrices, and it is primarily about calculating the determinant of a matrix, as
    well as determining the inverse of a matrix. Both of these operations are complex,
    which is also reflected by the code. There are several ways to implement these
    operations, but overall, the basic defines solutions with poor performance, especially
    because the definition of the determinant is recursive. However there is to use
    LU decomposition and although I do not want to describe the algorithm here, the
    procedure is as follows:


    If you have a square matrix, you have to switch to two rows without affecting
    the determinant, but where you are multiplying the result with (−1)ⁿ n is the
    number of exchanges. It is also allowed to subtract a multiple of one row from
    another, thus reducing a square matrix A to an upper triangle matrix U and a matrix
    where all coordinates below the diagonal are 0. The determinant can then be determined
    as the product of all coordinates in the diagonal, but multiplied by the above
    sign. This results in many calculations and will therefore introduce significant
    uncertainties to the results, and it can be partially corrected by all the time
    coordinates in the row with the highest value 0. This corresponds to fact that
    during the process, a permutation of the rows respecting implicit substitutions
    is determined. When subtracting a multiple of a different row from a row, use
    a scale that is determined by the number of subtracts from being assigned to 0
    at a particular space and all these can be scaled in a lower triangle matrix L,
    which has 0 in. For the two matrices L and U, then A = L *. The two matrices are
    assembled in a common matrix LU = L + U. The process is called LU decomposition
    and is a relatively complex process with a complexity that is O(N³).


