    the same size, they get a complexity that O(N³). There are actually algorithms
    that do better, and one of them is the Strassen algorithm that has a complexity
    around O(N².⁷). Firstly, the algorithm is not quite simple to implement, and second,
    it only works for square matrices, and for performance is gaining attention, you
    need to work with very large matrices, before implementing the algorithm, maybe
