    HASHING


    Suppose you want to further insert the object


    7900, Nykobing


    The element should be placed in place 6, but it is busy and we are talking about
    a collision. There are two objects with different keys, which by the hash function
    determines the same location in the table. You can therefore conclude that there
    are two basic challenges to implement hashing of an array:


    +   1. A hash function must be defined in a way that distributes the keys across
    the array.

    2. There must be a solution to the collision problem.


    In terms of the hash function, it is in principle a question about that you have
    an array of a given size $n$ and a collection of objects of one kind or another.
    If you have an object $obj$, the hash function $f$ must from the object $obj$
    calculate an $int f(obj)$ which is called the hash value or the hash code. You
    can then determine the object''s index in the array as $i = f(obj) \bmod n$, which
    just specifies a value within the array boundaries.


    The function $f$ must of course be effective, but otherwise the most important
    feature is that the indices are widely distributed across the array. If this is
    not the case, the objects clump into one or more locations in the array, which
    means that parts of the array will not be used and the risk of collisions will
    increase.


    There are many examples of good hash functions defined for numbers and strings,
    and they will typically work by looking at the individual characters as above
    with the zip code example and for numerical values by some form of calculation.
    Often the key is a string, or strings are included in the key. A hash function
    that works on a string needs to convert a string to an integer, which typically
    takes place using the numerical codes for the individual characters. The calculation
    could, for example, take place as:


    $n$ denotes the number of characters in the string and $s_i$ is the character
    code for the character on position $i$. Then


    ```

    $$\sum_{i=0}^{n-1} s_i * 31^{n-1-i}$

    ```


    is an example of a hash function that calculates the hash code for a string. If,
    for a given string, modulus is taken with the array length, the string is converted
    to an array index. The above hash function is simple to implement (and understand
    – the 31 because it is a prime) and it is the function used in Java. I have shown
    the function here as an example, and that it''s easy to write a hash function
    that works on strings.


