    # 3 ALGORITHM ANALYSIS


    Once you have written an algorithm, there are two outstanding issues


    +   1. to argue that the algorithm is correct and solve the current task

    2. to evaluate the efficiency of the algorithm with regard to resource consumption


    Both can be done more or less formally. For example, with regard to the correctness
    of algorithms, mathematical evidence often be used in the form of a proof by induction,
    but in other contexts, a more informal argumentation can explain the correctness
    of the algorithm. The same goes for analyses of the algorithms efficiency. In
    the following, I will show both approaches, but I would primarily focus on informal
    reasoning because it provides a practical approach to the problems and better
    is a tool that can be used in the daily but also because a formal mathematical
    argumentation can easily become complex. However, it should be noted that there
    is a significant risk that the informal reasoning leads to incorrect results.


    An analysis of the complexity of an algorithm relates to the algorithm''s consumption
    of the machine''s resources, and generally the goal is to minimizing resource
    consumption. It''s


