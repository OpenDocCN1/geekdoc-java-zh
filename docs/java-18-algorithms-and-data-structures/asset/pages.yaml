    \ a, int\nb, int k)\n\n```\n{\n  T t = arr[k];\n  swap(arr, k, b);\n  int j =\
    \ a;\n  for (int i = a; i < b; ++i) {\n    if (arr[i].compareTo(t) < 0) {\n  \
