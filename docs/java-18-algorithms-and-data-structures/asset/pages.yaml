    Another and often more difficult problem than argue for the complexity of algorithms
    is to verify the correctness of an algorithm. Course, it is, equally important
    as it does not make sense to write algorithms that do not give the correct result.
    In the vast majority of cases, one will argue for the correctness of an algorithm
    by means of informal argumentation, in which you by speech (or writing) explains
    how the algorithm works. After the algorithm is written, you will test it and
    apply the test results as an argument for the correctness of the algorithm. It''s
    not always easy, and it''s especially difficult to get all cases with not overlook
    boundaries, where the algorithm may not take into account.


    However, you can also attack the correctness of algorithms more formally, and
    simply give a mathematical proof of the correctness of the algorithm. The following
    is a brief introduction to the subject – it''s just a hint of what to do. Partly
    because it is a relatively theoretical subject, and partly because the practical
    application is not so great.


    An algorithm is correct if its method used with pre-conditions gives the desired
    result with post-conditions. In addition, an algorithm must always stop after
    a final number of steps. The latter can be a problem if the algorithm contains
    an iteration, and in general, argumentation for the correctness of algorithms
    is only interesting if the algorithm contains iterations. In the examples that
    I''ve seen so far, it''s fairly easy to figure out that the algorithms are correct
