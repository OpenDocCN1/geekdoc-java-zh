    It shows what the purpose of rotations is, to restore the balance of an unbalanced
    tree. Therefore, you can implement the insertion of elements as in the regular
    binary search tree, however followed by a return where you test for each node
    on the path to the new node if the AVL condition is met and not performing a rotation.
    It sounds simple, and it is, in principle, but there are more cases than the above
    example suggests, and this is where the other rotations come into play.


    The algorithm is as follows:


    +   1. You insert the new element in the same way as in the general binary search
    tree.

    2. You go back in the tree until you reach the root.

    3. If you get to an unbalance, restore the balance using a rotation.


    Initially, you should note that the insertion naturally results in a binary search
    tree. Once you have entered the new node, it is only in the nodes that are on
    its way where there may be an unbalance as only the heights of their sub-trees
    have changed.


