    # 5.1 A BUFFER


    To start somewhere, I will write a class Buffer, which is a class I have already
    looked at in connection with generic data types in the book Java 4.


    All collection classes are a form of container class which can contain a number
    of objects of a getype. Internally, the classes can differ as to how they represent
    or store the objects, also with regard to their capacity, and whether a collection
    has a fixed size or, in principle, is unlimited and grows with the number of elements
    filled in it. The meaning is that the user of a particular collection class should
    not have (or need to have) knowledge of these details, but a particular class
    must be known by its methods and hence the features it provides. Therefore, you
    sometimes also talk about an abstract data type or ADT. In this section, I want
    to look at a collection Buffer, which is, in fact, nothing but a wrapper of an
    array, its features, and what it''s like and what applications it has is determined
    by the type''s methods and properties. A buffer is characterized by three features:


    +   1. It has a method add(), so you can add an object to the buffer — so you
    can insert elements into the buffer.

    2. It has a method remove(), so you can remove the oldest element in the buffer.

    3. The buffer has a final size and thus a capacity that cannot be expanded.


    A buffer can therefore be illustrated as follows:


