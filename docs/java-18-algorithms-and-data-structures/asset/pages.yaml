    The algorithm consists of two loops inside each other. The length of the inner
    loop is always

    N-1, and it performs N-1 operations. The question is how many times the outermost

    loop is performed.


    If the array has already been sorted, the inner loop does not change, and the
    outer loop

    is only executed once. The algorithm will therefore perform N-1 + I = N operations,
    and

    therefore it has the best time complexity, is O(N), which is, a linear time complexity.


    When the inner loop is passed, the elements are compared in pairs, and in a comparison

    where the left-hand element is larger than the right, the largest moves a place
    to the right,

    and the smallest of the two elements a place to the left. The smallest element
    will therefore

    move to the left each pass unless it is in the first place. It will be in place
    after

    more than N-1 iterations. The next smallest moves a place to the left unless

    it is already in place or the smallest is to the left of it, but it only happens,

    so N-1 iterations is also the smallest element in place. It also applies to the
    third

    least, which also moves a place to the left unless it is in place, or the smallest
    or second

    least is to the left of it, but it only happens twice, and the element will then
    highest

    N-2 places, and the element will be in place after no than N-1 iterations of the

    inner loop. This argument holds for all array elements. As it requires an additional
    pass

    to find out that no exchanges have been made, the algorithm will in the worst
    case perform


    ```

    N(N - 1) + 1 = N^2 - N + 1

    ```


    operations. For large values of N you can ignore the constant 1, and the same
    applies to

    the part N, because N^2 for large values of N are much greater than N. The worst
    time

    complexity is this


