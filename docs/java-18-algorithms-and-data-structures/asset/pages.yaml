    # 6.5 A QUEUE


    A stack is a data structure or abstract data type that can be manipulated by two
    operations push() and pop(). It is a LIFO structure (Last In First Out), as the
    element removed from the stack with pop() is the last element on the stack. A
    data structure that is very similar to a stack is a queue, but it is a FIFO structure
    (First In First Out). You can think of a queue as a sequence of objects with references


    | 2 | 3 | 5 | 7 | 11 | 13 | 17 | 19 |

    | head | | | | | | | tail |


    head indicates the start of the queue while tail ends it. This is exactly the
    same as what I above have called a buffer and a class like Buffer<T> is a queue,
    and the difference is, among other things, that the operations are called something
    else:


    +   1. enqueue() inserts an element at the end of the queue – after the element
    tail points to

    2. dequeue() removes the first or oldest element in the queue – the element head
    points to


    Also, a queue can be implemented as a Buffer<T>. Doing so, the queue has a capacity,
    by setting the size of the buffer when it is created. It is not always advisable
    or desirable that the queue has a fixed size, and if not, it is difficult to implement
    the queue using an array, but the above operations using a linked list, allowing
    you to expand the queue as needed, such that both insertion and deletion have
    constant complexity. A queue can be defined as:


    ```

    public interface IQueue<T>

    {

    public void enqueue(T elem); // add an element to the queue

    public T dequeue(); // remove the first element

    public T peek(); // return the first element in the queue

    public void clear(); // remove all elements in the queue

    public int getSize(); // return the number of elements

    public boolean isEmpty(); // test whether the queue is empty

    }

    ```


    Note that the interface does not define the iterator pattern, for which there
    is no particular reason, but because that basically is not the idea that you should
    be to traverse the elements in a queue. Thus, it is a matter of whether it should
    be possible and Java’s implementation makes it possible.'
