  md: 'JAVA 18: ALGORITHMS AND DATA

    STRUCTURES: SOFTWARE DEVELOPMENT

    ALGORITHM ANALYSIS


    The above functions are typical, but there may be others.


    Above I have everywhere described complexities of functions in 1 variable, but
    an algorithm and its time complexity of course depend on several parameters. It
    does not significantly change the definitions, but just think that $N$ can consist
    of several values.


    In practice, it can be quite difficult to deduce and argue for the complexity
    of an algorithm, and it will often require a lot of mathematics. However, there
    are some guidelines that can help.


    +   If an algorithm does not contain loops, its execution time will usually be
    independent of the parameters of the algorithm and its complexity is constant.
    It is a $O(1)$ algorithm. You must be careful, however, because the algorithm
    can call a method that does not have constant time complexity. Algorithms with
    constant time complexity are considered to be optimal in many contexts

    If an algorithm contains a single loop and a single pass of this loop, then its
    complexity will be $O(N)$. There are many algorithms that have this complexity
    and in many contexts they will be considered as algorithms.

    If an algorithm has two loops inside each other and if one is repeated $N$ times
    and the other repeats $M$ times, the complexity will typically be $O(MN)$. If
    specifically $M = N$ (what is often the case) the complexity will be $O(N^2)$.

    Another common situation is (think of binary search) that you have a loop and
    for each pass of the loop length of the loop is halved. If so, time complexity
    will be $O(\log(N))$.


    You should be careful about the rules as they can give a false picture, primarily
    because methods/algorithms call use other methods that have a time complexity
    that is not constant, but conversely, the rules may be useful for quickly assessing
    a complexity of an algorithm. For example, think of an algorithm that has three
    nested loops, all of which are equal length. Such an algorithm will have the complexity
    $O(N^3)$, and in the vast majority of cases it will be a complexity that makes
    the algorithm unavailable for practical purposes.


