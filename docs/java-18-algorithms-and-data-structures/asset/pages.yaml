    \nIf you perform a LU decomposition, it is simple to determine the determinant,\
    \ as it is just the product of the coordinates in the diagonal. In fact, an LU\
    \ decomposition consists of solving n equations with n variables and thus to solve\
    \ a matrix equation Ax = b, where x and b are column vectors. The class SquareMatrix\
    \ therefore also has a method solve() that can be used to solve such equation.\
    \ In fact, it is not so much for solving equations, because the matrix can be\
    \ immediately used to determine the inverse. If v(i) denotes a column vector,\
    \ with a 1 on the ith place and the rest of the matrices 0, you can determine\
    \ the ith column in the matrix as the solution to A * x = v(i) and with using\
    \ the method solve().\n\nThe class SquareMatrix is defined as follows:\n\n```\n\
    public class SquareMatrix extends SquareMatrix\n{\n    private SquareMatrix LU\
    \ = null; // the decomposed matrix\n    private int[] perm; // the permutations\n\
    \    private boolean odd = false; // the sign of the determinant\n```\n\nThe meaning\
    \ of the three variables is that if you first a LU decomposition, it is not necessary\
    \ to do it every time you determine the inverse, solve a linear equation or determine\
    \ the determinant. To not invalidate the LU matrix if the current matrix is changed,\
    \ what the SquareMatrix also does.\n\n# 12.1 A TEST PROGRAM\n\nAfter I have written\
