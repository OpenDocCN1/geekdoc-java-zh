  md: '![](img/c51e118bfd5e98129bcc4f8937eeba18_137_0.png)


    Suppose you want to search for $G$. You starts in the root, and $G$ is smaller
    than $K$, you must look in the left sub-tree to $K$. Since $G$ is larger than
    $D$, you should look in the right sub-tree to $D$. Since $G$ is smaller than $H$,
    you has to look for the left sub-tree to $H$. Hereafter, the element has been
    found. The principle is, therefore, that you start in the root, and is that the
    element you are looking for, you are done. Otherwise, repeat the search, but either
    in the left or right sub-tree. This continues until you find the element or reach
    an empty tree. As binary search, the principle is that the number of elements
    to be searched is halved every time, so it is an $O(\log (N))$ algorithm — assuming
    that the tree is reasonably balanced.


    Inserting a new element goes a bit same way. You start at the root and find out
    the new element to be inserted into the left or right sub-tree. If you have reached
    an empty sub-tree, you caninsert the element as a new child node. Otherwise, repeat
    the process. Again, you look down the tree until you find the node that the new
    node has to be a successor to, and insertion thereafter also be implemented as
    an $O(\log (N))$ algorithm. For example, if you must insert $J$ in the above tree,
    you get the tree below. The procedure is


    +   1. start in K

    2. go to D

    3. go to H

    4. insert J as a right child to H


    and the last operation corresponds to that the right sub-tree to $H$ is empty,
    the new element is inserted as a new leaf node to $H$.'
