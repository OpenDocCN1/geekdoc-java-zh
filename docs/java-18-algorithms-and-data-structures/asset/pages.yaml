    \ ANALYSIS\n\nthat algorithms are correct, you can associate statements (also\
    \ called assertions) to specific locations in the algorithm. They express statements\
    \ that must be true at those places and can be used to argue for the correctness\
    \ of an algorithm. Assertions in principle occur anywhere in the algorithm, but\
    \ they are typically used in selections and iterations where they are most interested,\
    \ and they are in this context called for invariants. At the power raising algorithm,\
    \ you can introduce the following invariant:\n\n```\n// Pre: n > 0 og p = 0\n\
    // Post: returner n opløftet i p'te\ntokens(n, p)\n{\n  r = 1\n  while (p > 0)\
    \ // Inv: r*n^p = n^p'\n    r = r * n\n    p = p - 1\n  }\nreturn r\n```\n\nHere\
    \ is\n\nInv: r*n^p = n^p'\n\nan invariant of the iteration, which must be met\
    \ immediately before the iteration is performed and immediately after the iteration\
    \ is performed. p' means the value of the parameter p as it was before the algorithm\
    \ started (that is the value transferred to the algorithm). It is said that the\
    \ invariant is valid if it is true when the condition of the iteration is checked,\
    \ that, before and after each iteration. Assume for a moment that that is the\
    \ case. When the iteration stops, p = 0 and the invariant say that\n\n```\nr =\
    \ rn^0 = n^p'\n```\n\nand since the algorithm returns r, it just means that the\
    \ algorithm is correct. To prove that the algorithm is correct is reduced to show\
    \ that the invariant is preserved for each iteration. Typically, it is shown by\
    \ induction:\n\nWhen the loop starts is r = 1 and p = p', so the invariant is\
    \ met from the beginning and after the first iteration, r = n and p = p'-1 so\n\
    \n```\nr * n^p = n * n^{p'-1} = n^p'\n```\n\nand the invariant is met. That is,\
    \ the start of the induction is correct."
