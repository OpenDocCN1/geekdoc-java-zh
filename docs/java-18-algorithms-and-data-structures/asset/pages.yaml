  md: "# JAVA 18: ALGORITHMS AND DATA STRUCTURES: SOFTWARE DEVELOPMENT THE CONCEPT\
    \ OF ALGORITHMS\n\nwhere each time adds 3. It can also be expressed that the difference\
    \ between a number\\and the previous number is constant (hence the name):\n\n\
    ```\n$a_k - a_{k-1} = d$\n```\n\nIf so, you may have a difference series with\
    \ the difference $d$. As other examples of\ndifference series are:\n\n+   - 5,\
    \ 8, 11, 14, 17, 20, 23, ..., 2 + 3n, ....\n- 2, 4, 6, 8, 10, 12, ..., 2n, ....\n\
    - 1, 2, 3, 4, 5, 6, ..., n, ....\n\nwhere the first difference is 3, the second\
    \ difference 2 and the last difference 1.\n\nThe goal is to write an algorithm\
    \ that can determine the sum of the numbers in a\ndifference series. To do that,\
    \ you must know three things:\n\n+   - the first number $a$ (where the series\
    \ starts)\n- the difference $d$ (how much you have to step forward to get to the\
    \ next number)\n- how many numbers $n$, that should be included in the sum\n\n\
    The algorithm can then be written as follows:\n\n```\nfor (1 to n)\n{\n  adder\
    \ a to sum\n  adder d to a\n}\n```\n\nAgain, it's a simple algorithm, and it's\
    \ easy to figure out that it gives the correct result:\neeach repeat, the sum\
    \ is increased by the next number in the difference series, and $a$ is\nchanged\
    \ to reference the next number. It's easy to write the algorithm as a static method\n\
    in Java:\n\n```\npublic static long sum(int a, int d, int n)\n{\n  long s = 0;\n\
    \  for (int i = 0; i < n; ++i)\n{\n    s += a;\n    a += d;\n  }\n  return s;\n\
    }\n```\n\nDownload free eBooks at bookboom.com"
