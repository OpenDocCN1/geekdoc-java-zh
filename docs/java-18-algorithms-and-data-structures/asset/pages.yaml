    An extension of creating a new array and copying the content of the old array
    to the new array. This copy has linear time complexity, as it consists of a loop
    over an array and has the array N elements, the copy requires approximate N operations.
    Suppose an array contains N elements. If you then perform the following operations:


    ```

    for (int i = N; i < 2 * N; i++) array[i] = x;

    ```


    the first assignment will require N operations as the array is expanded, while
    each of the N-1 operations has constant time complexity as they do not require
    the array to be expanded. The average complexity of these N operations is


    ```

    N + N - 1

    ~N

    ```


    That is, that the add() operation in the average has constant time complexity
    and the end of the whole idea of an ArrayList, that it is highly effective to
    add elements to the end of the list and the list automatically is expanded without
    involving the user. However, the price is use of memory.


    Above I have described how ArrayList is expanded by doubling the array, but it
    is not a requirement, and several implementations use another factor. The result,
    is that constant time complexity of the method add(), and the choice is a weighing
    of performance in relation to memory consumption.


