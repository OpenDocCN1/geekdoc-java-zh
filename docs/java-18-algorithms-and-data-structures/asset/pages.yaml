    \ largest common divisor of n and m.\n// n and m must both be greater than 0\n\
    public static long gcdl(long m, long n)\n{\n    return n >= m ? gcdl(n, m) : gcdl(m,\
    \ n);\n}\n\nprivate static long gcdl(long n, long m)\n{\n    if (m == 0) return\
