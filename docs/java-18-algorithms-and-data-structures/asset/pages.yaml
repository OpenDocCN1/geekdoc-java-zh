    # 5.2 ARRAYLIST


    In practice, the most commonly used collection class is an ArrayList and in this
    section 1 show how this class is implemented and why it is highly effective.


    Internally, an ArrayList is an array with a given number of elements, and the
    elements are stored in places from index 0 and forward. An ArrayList defines an
    arrangement of the elements based on their location or number/index. An ArrayList
    cannot have holes. That is, if the list contains an element at n, there are also
    elements at the places 0, 1, 2, ..., n-1. An ArrayList may be empty if it contains
    no elements at all. You can think of an ArrayList as a data structure, that is
