    # THE CONCEPT OF ALGORITHMS


    # 2.3 SEARCH


    A classic issue is searching an element in an array. If you do not know anything
    about how the array''s elements are sorted, you cannot do much more than search
    linearly, that is, start from the beginning and pass through the array start to
    finish and compare each element with what is searched for . The process can be
    expressed in the following algorithm where you search in an array arr after an
    element elem:


    ```

    loop (over all elements element in arr)

    {

    if (element == elem) element is found

    }

    element is not found

    ```


    Note how the algorithm works by searching the entire array. If you find the element,
    you are done and the algorithm can terminate with a message that the element is
    found. If you get through the loop, it''s because the element is not there and
    you can end up with a message that it does not exist. In the worst case, you must
    visit all elements to find out that an element is not available.


