    gets linear complexity, and the whole idea of a binary tree is thus lost. Therefore,
    it is necessary to make a few changes that ensure the tree does not work out as
    illustrated above. The tree must be balanced and therefore insertion and deletion
    must be done in such a way that the tree after the operation is balanced. I want
    to show two approaches that define a specialized search tree, which is called
    an AVL tree, a red-black tree, where I first (in space consideration) will treat
    a red-black tree in the next book. But first a few more definitions.

    A binary tree, where all levels are filled up, is called a full binary tree.


