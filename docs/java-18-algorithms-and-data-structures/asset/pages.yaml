    be perceived as 0. This would provide greater flexibility, but there would be
    situations that result in unintended results. Similarly, I assume that addition
    and subtraction of two matrices require that both matrices have the same number
    of rows and columns and that multiplication of two matrices requires that the
    first has the same number of columns as the other rows.


