    ![](img/c51e118bfd5e98129bcc4f8937eeba18_145_0.png)


    A binary tree is called balanced if it applies to any node that the difference
    between the number of nodes in the left sub-tree and the number of nodes in the
    right-sub tree is at most 1:


    ![](img/c51e118bfd5e98129bcc4f8937eeba18_145_1.png)


    In order for the operations on a binary search tree to have logarithmic complexity,
    the tree must be balanced or at least fairly balanced, and in the next section
    I would like to show a balanced binary tree. The idea is to insert (and delete)
    elements as described by the binary search tree. The result may then be a binary
    tree that is not balanced, and the task is to restore the balance using special
    operations, called rotations.'
