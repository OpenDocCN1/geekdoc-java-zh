    In mathematics, a vector is an array where the elements (usually) are real numbers,
    and you can perform different computational operations, such as adding two vectors,
    which simply adding the elements in two arrays in pairs for place. You can also
    determine the scalar product of two vectors, which is a real number. A similar
    term is a matrix that is nothing but a 2-dimensional array, and where the elements,
    like a vector, are real numbers. For matrices, a number of calculation rules apply,
    such as the addition of matrices, and you can (under certain conditions) multiply
    two matrices where the result is a matrix. One of the classic tasks in programming
    is to write classes that represent vectors and the most common operations on these
    data structures, and there are many different solutions in the form of math libraries,
    and the subject of this chapter is to show another example of such a library.
    Perhaps it''s not so much to do with collections, but it''s data structures, and
    algorithms play a crucial role. The goal with this last example is addressing
    this issue, more than the practical application. The solution will additionally
