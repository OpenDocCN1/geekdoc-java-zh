  md: "# JAVA 18: ALGORITHMS AND DATA\nSTRUCTURES: SOFTWARE DEVELOPMENT TREES\n\n\
    It is limited what operations can be performed on a generally binary tree, indeed,\
    \ it is limited what you can use a binary tree for addition to being as the base\
    \ class for other binary trees with more structure. I will mention four operations\
    \ that are assigned to a generally binary tree. The first is an operation that\
    \ determines the height of the tree. Above, I have defined the height of the tree\
    \ as the largest depth of tree leaf nodes, and correspondingly, the above binary\
    \ tree has the height 4. Specifically, the height of an empty binary tree is calculated\
    \ as -1 and you then determine the height as follows\n\n```\ngetHeight(\n  if\
    \ (the tree is empty) return -1\n  return 1 + max(getHeight(the left subtree),\
    \ getHeight(the right subtree))\n)\n```\n\nThus, the height of the tree can be\
    \ determined by means of a recursive algorithm. Note that the algorithm gives\
    \ the correct result – the result 0 if the tree consists of a single node.\n\n\
    The other three concerns the traversing of a binary tree, which is an operation\
    \ through which all the elements of the tree are traversed and visits (processed)\
    \ in one order or another. Traditionally there are three ways called in-order,\
    \ pre-order and post-order. An in-order traverse works as follows. You start in\
    \ the root and then you proceed recursively according to the following pattern:\n\
    \n+   1. traverses the left sub-tree (as long as it's not empty)\n2. perform the\
    \ operation on the root\n3. traverses the right sub-tree (as long as it is not\
    \ empty)\n\nThis means that in the above tree you handle the elements in the following\
    \ order:\n\nB D G H K P S V X Y\n\nA pre-order traverse uses the same recursive\
    \ approach\n\n+   1. perform the operation on the root\n2. traverse the left sub-tree\
    \ (as long as it is not empty)\n3. traverse the right sub-tree (as long as it\
    \ is not empty)\n\nK D B H G S P V Y X"
