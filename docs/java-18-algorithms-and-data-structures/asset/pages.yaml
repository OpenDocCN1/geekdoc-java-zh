  md: '# 9 HASHING


    A collection class is a container of objects, and there are primarily two things
    that separate collection classes:


    +   1. what services the class makes available, and thus what the users can do
    with the class

    2. how the objects are internally stored and organized


    The latter is only an internal class property, and it is basically the intention
    that users should not need (to be aware of) it. Users need to know the complexity
    of the individual methods, but whatever else happens, it is left to who implements
    the class to take care of.


    Until this place I have mentioned two ways to store objects. It happens either
    by means of an array or by linking the elements together with references or pointers.
    Both ways have their pros and cons, and the choice will depend on the characteristics
    that collection want to have. In, it is the only two ways you have to store objects,
    but in both cases it is possible to organize the objects appropriately, which
    is important for class'' methods. For example, an ArrayList stores the objects
    in an array, but is organized in such a way that they are stored from the start
    and to a last element. The ArrayList has an internal counter which uses to keep
    track of where the last element is.


    What characterizes an array as a container is that each object is located on a
    particular index, and with this index in hand you have direct access to the element
    with constant complexity. An array is a highly efficient container, but it is
    up to the user (the collection class) to decide which index to use to find a particular
    element. The problem with it is that many contexts (most) it is not very appropriate
    to refer to a particular object via a numerical index that directly corresponds
    to the physical location, but it would be better to find an object by example,
    a name (key), but without it should be in the form of a search. The solution to
    that problem may be hashing.


    Technically, a hashed structure is an array of objects that identify the individual
    objects using a key rather than an index. The idea is that the key is converted
    to an index, which indicates where in the array the object is located. It is this
    conversion that is called hashing. That is, when finding an object in the array,
    it does not happen with searching, but by calculating where the object is and
    by this operation that constant time complexity.


