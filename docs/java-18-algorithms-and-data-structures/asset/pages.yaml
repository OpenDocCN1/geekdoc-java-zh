    # #6 LINKED LISTS


    A linked list is a collection that, like an ArrayList, can contain any number
    of objects organized in a particular order. It is a sequential structure where
    new elements are placed by directly or indirectly specifying the new element''s
    predecessor or successor, or where you can traverse the list and process the objects
    in the order they inserted. For example, you can choose the list from start to
    finish. A linked list is an alternative to an array or an ArrayList. (and an ArrayList)
    is a coherent data structure in the machine''s memory:


    ```

    DataType[] t = new DataType[n];

    ```


    ![](img/c51e118bfd5e98129bcc4f8937eeba18_104_0.png)


    and it is characterized by direct access to its elements via an index, that, you
    can refer to the ith element as t[i]. An array gives direct access to the individual
    elements, which means that it is a very efficient data structure. For a linked
    list, the conditions are opposite. A linked list consists of a reference that
    refers to the list''s start and each element in the list has a reference to the
    next element:


    ```

    ListNode start = new ListNode();

    ```


    ![](img/c51e118bfd5e98129bcc4f8937eeba18_104_1.png)


    You can add new items to the list at any time or remove an existing item, so the
    list can grow or decrease as needed. On the other hand, to refer to a specific
    item in the list, you must start at start and search the list until you find the
    element. You must note that unlike an array (and an ArrayList), a linked list
    is not a coherent structure, and relative to an array, it''s exactly its pros
    and cons.


    Lists can be organized in practice in many ways, and below are discussed methods
    of structuring lists and the associated algorithms that are used. The list illustrated
    above is an example of a single linked list.


