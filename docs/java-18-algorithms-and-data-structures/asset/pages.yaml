  md: "JAVA 18: ALGORITHMS AND DATA\nSTRUCTURES: SOFTWARE DEVELOPMENT TREES\n\n# 7.2\
    \ BINARY SEARCH TREES\n\nA binary search tree is a binary tree with an additional\
    \ condition: For any node, its element is larger than all elements in the left\
    \ sub-tree and less than all elements in the right sub-tree. If you consider the\
    \ above example (beginning of section 8.1) of a binary tree, it is actually a\
    \ binary search tree. In order to place elements in a binary search tree, the\
    \ elements must be able to be arranged, and with Java terms, they should be comparable.\
    \ I assume that all elements in a binary search tree must be different, and in\
    \ fact I have requested it in the definition. It is not necessary and you can\
    \ indent the tree as follows: For any node, its element is greater or equal to\
    \ all elements in the left sub and less than all elements in the right sub (or:\
    \ for any node its element is larger than all elements in the left sub and less\
    \ or equal to the implementation is primarily a matter on some places to use less\
    \ or equal to instead of less than. However, in most practical applications, you\
    \ are interested in search trees where an element may only occur once.\n\nThe\
    \ binary search tree is defined as:\n\n```\npublic interface ISearchTree<T extends\
    \ Comparable<T>> extends IBinTree<T> {\n    public T getMin(); // returns the\
    \ first element\n    public T getMax(); // returns the last element\n    public\
    \ boolean insert(T elem); // inserts elem in the tree\n    public boolean remove(T\
    \ elem); // removes elem from the tree\n}\n```\n\nA binary tree is balanced if\
    \ it applies to any node that the left and right sub-tree \"almost\" has the same\
    \ height. The task is to write a class SearchTree<T>, which inherits ABTree<T>\
    \ and implements the above methods, including the abstract method contains() from\
    \ the base class. If the tree is reasonably balanced, all of these methods can\
    \ be implemented with logarithmic time complexity, and is exactly the goal of\
    \ a binary tree. How to ensure that binary search tree is properly balanced is\
    \ another question and is the subject of the next section, but if you think that\
    \ the elements are added in random order, a binary search tree will often be quite\
    \ well-balanced.\n\nConsider the binary tree again:"
