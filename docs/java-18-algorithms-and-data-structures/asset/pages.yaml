    # 6.2 DOUBLE LINKED LISTS


    The above single linked list has its uses and is characterized by that it has
    a simple implementation, but you chose to implement a double linked list, where
    each node not only keeps track of the successor, but also the predecessor. By
    giving the individual nodes a reference to the predecessor, you will also be able
    to search backward, for example, to the start of the list and traverse the list
    in the opposite direction. It is advantageous for many tasks, and some methods
    can actually be implemented more easily, but the price is that the individual
    nodes must contain an additional reference:


