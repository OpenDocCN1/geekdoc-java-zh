    \n## 4.3 插入排序\n\n上述算法的一个变体称为插入排序。假设数组被分为已排序的左部分和未排序的右部分。然后你取右部分的第一个元素，并与左部分的元素交换，直到新元素就位——此时左部分将是排序的。继续操作直到完成。从开始假设左部分始终是有排序的。如果示例如上：\n\
    \n| 11 | 5 | 19 | 3 | 13 | 2 | 7 | 17 |\n\n那么你从一个仅包含元素 11 的左部分开始，因此它是排序的。我们必须将\
    \ 5 插入左部分的正确位置：\n\n| 5 | 11 | 19 | 3 | 13 | 2 | 7 | 17 |\n\n现在左部分包含两个元素，且左部分是排序的。下一步，必须将\
    \ 19 插入正确位置：\n\n| 5 | 11 | 19 | 3 | 13 | 2 | 7 | 17 |\n\n但很简单，什么都不会发生。现在 3 必须插入左数组的正确位置，因此，这意味着左数组中的所有元素都必须移动：\n\
    \n| 3 | 5 | 11 | 19 | 13 | 2 | 7 | 17 |\n\n下一次，13 将就位，只需要一次交换：\n\n| 3 | 5 | 11\
    \ | 13 | 19 | 2 | 7 | 17 |\n\n如果你继续，最终将得到一个排序后的数组。该算法可以实现为：\n\n```java\npublic\
    \ static <T extends Comparable<T>> void insertionSort(T[] t) {\n    for (int i\
    \ = 1; i < t.length; i++) {\n        boolean ok = false;\n        for (int j =\
    \ i; j > 0 && !ok; --j)\n            if (t[j].compareTo(t[j - 1]) < 0) swap(t,\
    \ j, j - 1); else ok = true;\n    }\n}\n```\n\n该算法除了是选择排序的变体外没有太大区别，很明显它具有相同的特征。然而，插入排序适用于几乎有序的数组，因为元素在几次交换后就会就位。\n\
    \n上述排序算法主要具有理论意义，有助于理解排序是如何进行的以及如何编写排序算法。在接下来的，我将展示另外三种有效得多（另一方面更复杂）因此具有更大实际价值的排序方法，但所有排序算法都有一个共同点，即关于遍历数组和交换元素。区别主要在于你实现得有多么“聪明”。\n\
    \n上述算法的平均时间复杂度均为 O(n²)，对于较大的 n 值（大数组），这些算法效率太低，甚至可以说毫无用处。然而，在实践中你不应该完全拒绝这些算法，因为前面提到的它们实现简单，而且应用于小数组时实际上非常有效。\n\
    \n![](img/c51e118bfd5e98129bcc4f8937eeba18_78_0.png)\n\n## 4.4 壳排序\n\n下一个算法称为插入排序。它的特点是远比上述算法有效，具有恒定的内存，但实现更困难。其思想是将数组分为若干子数组。然后对这些段中的每一段进行排序。完成后，重复该过程，但这次使用的段数更少，直到数组已经排序。假设后续数组如下：\n\
    \n| 41 | 11 | 29 | 37 | 2 | 7 | 17 | 31 | 5 | 19 | 13 |\n\n由于有 14 个元素，因此有 7 个段（序列中的下一个数字）：\n\
    \n$a_k = \\begin{cases} 0 & k=0 \\\\ a_{k-1} + 1 & k>0 \\end{cases}$\n\n各段的内容为：\n\
    \n- 第 0 段：41\n- 第 1 段：11, 31\n- 第 2 段：29, 5\n- 第 3 段：37, 19\n- 第 4 段：2, 13\n-\
    \ 第 5 段：7, 23\n- 第 6 段：17\n\n每个段都经过了排序，这很容易，因为在这种情况下每个段只有 2 个元素：\n\n| 17 | 11\
    \ | 5 | 37 | 2 | 7 | 41 | 31 | 29 | 19 | 43 | 13 |\n\n注意实际上有两个地方被替换了。还要注意大数字向右移动而小数字向左移动。下一次将有3\
    \ 个段：\n\n$(7 - 1)/2 = 3$\n\n- 第 0 段：17, 3, 7, 29, 13\n- 第 1 段：11, 37, 41, 19,\
    \ 23\n- 第 2 段：5, 2, 31, 43\n\n注意这些段是部分有序的。它们现在已经完全排序，结果如下：\n\n| 3 | 11 | 2 | 7\
    \ | 19 | 5 | 13 | 23 | 31 | 17 | 37 | 43 | 29 | 41 |\n\n下一次只有一个段，且它是排序的：\n\n|\
    \ 2 | 3 | 5 | 7 | 11 | 13 | 17 | 19 | 29 | 31 | 37 | 41 | 43 |\n\n"
