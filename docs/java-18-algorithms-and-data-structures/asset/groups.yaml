    \ are 19 numbers instead\n53 19 47 43 23 37 71 11 29 54 41 17 2 31 13\nThen there\
    \ are seven numbers that are less than 19 and 23, and there are seven numbers\
    \ that are larger. There are two options for the median. In practice, you will\
    \ often choose the average, but when I look at arrays with integers, I want the\
    \ result to be one of the numbers and if the number of elements is equal, I choose\
    \ the least. I will now look at an algorithm that can determine the median of\
    \ an array with integers. In fact, it is not necessarily simple. However, there\
    \ is a very direct solution where you simply use:\n\n```\npublic static <T extends\
    \ Comparable<T>> median(T[] arr) {\n    Arrays.sort(arr);\n    return arr[(arr.length\
    \ - 1) / 2];\n}\n```\n\nThe algorithm is based on sorting, and as will be seen\
    \ in the next chapter, it is possible to write an algorithm with $O(N \\log N)$\
    \ time complexity, and it also applies to the sorting method used by the framework.\
    \ However, the above algorithm to determine the median therefore has a time complexity\
