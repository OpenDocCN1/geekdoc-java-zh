    \ as it is not empty)\n- perform the operation on the root\n\nIt is also possible\
    \ to define other traverse sequences, but the above are the most commonly used.\
    \ As an example, you can sometimes level order traversing, where you treat the\
    \ elements on the same level from left to right.\n"
  mdcn: "\n\n# 树\n\n树是一种按分级结构组织对象的集合，例如：\n\n![](img/c51e118bfd5e98129bcc4f8937eeba18_127_0.png)\n\
    \n这是一个包含 11 个对象的树。字母没有意义，但我可以引用这些单独的对象。据说树由节点组成，每个节点包含一个对象，在这种情况下有 11 个节点。其中一个节点起着特殊作用，是数据结构的入口，在这种情况下，它是节点\
    \ A。该节点被称为树的*根节点*。为了让对象形成树，从根节点到任何其他节点都必须有一条唯一的路径。任何不同根节点的节点都有唯一的前驱节点，称为其父节点。例如，E\
    \ 的父节点是 A，而 I 的父节点是 E。这种关系在图中通过从一个节点到另一个节点的线所示，每个节点都有从根节点到该节点的唯一路径。可以用道路作为例子：\n\
    \n- [ A, D ]\n- [ A, D, H ]\n- [ A, B, G ]\n- [ E, J, K ]\n\n其中第一个是从 A 到 D 的路径，下一个是从\
    \ A 到 H 的路径，第三个是从 A 到 G 的路径，最后一个是从 E 到 K 的路径。道路中线的数量被称为道路长度（或路径长度）。注意第一条路径的长度为\
    \ 1，而另外三个的长度为 2。注意，从根节点到节点的路径，也可以表示为每个节点的特征是作为某个子树的根。例如，B 是一个 3 节点子树的根。注意，树可以是特殊的空。\n\
    \n关于树，还有许多其他定义。一个给定的节点可能有若干个直接后继节点。例如，E 有两个直接后继节点，即 I 和 J。它们也是 E 的子节点，人们说 I 和\
    \ J 是兄弟节点。同样，根节点有 4 个子节点（B, C, D, E），它们都是兄弟节点。某些节点没有子节点，例如适用于 H 和 K。这样的节点被称为叶子节点。每个节点还关联一个度，定义为子节点的数量。因此，根节点的度为\
    \ 4，D 的度为 1。叶子节点的特征是度为 0。树的度是指树中所有节点中的最大度。因此，上面的树的度为 4。每个节点都有一个高度，即从根节点到该节点的路径长度。因此，B\
    \ 的高度为 1，K 的高度为 3。树的高度是指树中所有叶子节点中的最大高度，上面的树深度为 3。有时你用深度（depth）代替层级（level）来说。特别地，认为空树的高度为\
    \ -1，而有根节点的树的高度为 0。树有几个简单规则，如果节点 N 有父节点 P，那么：\n\n$Depth(N) = Depth(P) + 1$\n\n\
    有时说从一个节点到其后继节点的线被称为边。每个节点（根节点外）都有唯一的前驱节点（从父节点到节点有一条唯一的线），你可以观察到，具有 $n$ 个节点的树的边数为\
    \ $n-1$。\n\n树在实践中出现在许多场景中，正如那个广为人知的例子，你可以考虑硬盘上的文件系统，其中文件存储在组织成树状的文件夹中。其他例子包括零件列表，例如，XML\
    \ 文档的元素也是组织成树的。问题是如何将树实现为一个集合类，这并不容易。实现上述描述的通用树实际上是困难的，我们将在后续章节中讨论。\n\n# 7.1 二叉树\n\
    \n二叉树是一种度不超过 2 的树。这意味着对于一个节点，其子节点的数量不超过 2。例如，下面所示是一棵具有 10 个节点的二叉树：\n\n![](img/c51e118bfd5e98129bcc4f8937eeba18_129_0.png)\n\
    \n二叉树的特征是它是空的，或者由一个根和两个左右子树组成，例如，S 是一个子树的根，同样也适用于 V。注意，树有 4 个叶子节点，且从根到 X 的路径为\
