    \ other node. Any, node different from root has a unique predecessor, which is\
    \ called its parent. For example, E has parent A while I has the parent E. This\
    \ context is illustrated in the figure with lines from one node to another, and\
    \ each node has a unique path from the root to the node. As examples of roads\
    \ can be mentioned:\n\n- [ A, D ]\n- [ A, D, H ]\n- [ A, B, G ]\n- [ E, J, K ]\n\
    \nwhere the first is a path from A to D, the next one path from A to H, the third\
    \ one path from A to G and the last one from E to K. The number of lines in a\
    \ road is called the road length (or path length). Note the first path has the\
    \ length 1, while the other three have the length 2. Note that the path from the\
    \ root to a node, one can also express that each node is characterized by being\
    \ root in a sub-tree. For example B is root in a 3-node sub-tree. Note that a\
    \ tree can be specially empty.\n\nThere are many other definitions attached to\
    \ a tree. A given node may have a number of direct successors. For example, E\
    \ has two direct successors, which are I and J. They are also child nodes to E,\
    \ and one say that I and J are siblings. Similarly, the root has 4 child nodes\
    \ (B, C, D, E), and they are all siblings. Some nodes have no child nodes. They\
    \ apply, for example, to H and K. Such nodes are called leaf nodes. For each node\
    \ is also associated a degree that defined as the number of children. Thus, the\
    \ root has grade 4 D has grade 1. That a leaf node is characterized by having\
    \ degree 0. As the degree of the tree you understand the greatest degree of all\
    \ the nodes in the tree. Thus, the above tree has degree 4. For each node there\
    \ is a height which is the length of the path from the root to that node. Thus,\
    \ B has the height 1 K has the height 3. As the height of the tree you understand\
    \ the largest height of all the leaf nodes in the tree and the above tree have\
    \ the depth 3. Sometimes you speak instead of depth and level and you say. In\
    \ particular, it is said that an empty tree has the height -1, whereas a tree\
    \ that has the root has the height 0. There are several simple rules for trees,\
    \ and if a node N has parent P, then\n\n$Depth(N) = Depth(P) + 1$\n\nSometimes\
    \ it is said the line from one node to a successor is an edge. Each node (apart\
    \ from the root) has a unique predecessor (there is a unique line from the parent\
    \ to the node), you can observe that the number of edges in a tree with n nodes\
    \ is n-1.\n\nTrees occurs in practice in a list of contexts, and as the perhaps\
    \ well-known example, one can think of the file system on a hard disk where the\
    \ files are stored in folders organized as a tree. Other examples include a parts\
    \ list, and for example, the elements of an XML document are also organized as\
    \ a tree. The question is how to implement a tree as a collection class and it\
    \ is not quite easy. To implement a general tree as described above is actually\
    \ difficult and it is dealt first in the next book. However, there are several\
    \ special trees, called binary trees, and it is the subject of this chapter, describing\
    \ their main characteristics as well as demonstrating how they can be implemented\
    \ in Java.\n\n# 7.1 BINARY TREES\n\nA binary tree is a tree of no more than degree\
    \ 2. That means that for a given node, the number of child nodes can not exceed\
    \ 2. As an example, below is shown a binary tree with 10 nodes:\n\n![](img/c51e118bfd5e98129bcc4f8937eeba18_129_0.png)\n\
    \nA binary tree is characterized in it that is either empty or consists of a root\
    \ and two sub-trees called the left and right sub-tree respectively, and where\
    \ each sub-tree is a binary tree (and may be in particular empty). Example, S\
    \ is root in a sub-tree, and the same applies to V. Note that the tree has 4 leaf\
    \ nodes and that the height of the tree is 4 (the path from K to X is 4). Above\
    \ the tree is drawn as if there is an order of its elements, but in a generally\
    \ binary tree it is not the case.\n\nIt is limited what operations can be performed\
    \ on a generally binary tree, indeed, it is limited what you can use a binary\
    \ tree for addition to being as the base class for other binary trees with more\
    \ structure. I will mention four operations that are assigned to a generally binary\
    \ tree. The first is an operation that determines the height of the tree. Above,\
    \ I have defined the height of the tree as the largest depth of tree leaf nodes,\
    \ and correspondingly, the above binary tree has the height 4. Specifically, the\
    \ height of an empty binary tree is calculated as -1 and you then determine the\
    \ height as follows\n\n```\ngetHeight(\n  if (the tree is empty) return -1\n \
    \ return 1 + max(getHeight(the left), getHeight(the right))\n)\n```\n\nThe other\
    \ three concerns the traversing of a tree, which is an operation through which\
    \ all elements are traversed. Traditionally there are three ways called in-order,\
    \ pre-order and post-order. An in-order traverse works as follows. You start in\
    \ the root and then proceed recursively according to the following:\n\n- traverses\
