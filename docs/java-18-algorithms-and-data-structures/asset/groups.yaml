    \ = 1$ 且 $p = n$，因此不变式从开始就满足；在第一次迭代后，$r = n$ 且 $p = n-1$，因此不变式依然满足。也就是说，归纳的起点是正确的。\n\
    \n假设不变式成立，即 $rn^p = n''$。令 $r'$ 和 $p'$ 为下次迭代后 $r$ 和 $p$ 的新值。即 $r'' = r'$ 且 $p''\
    \ = p-1$，那么最后的等式是由假设推导出的。因此，证明了不变式在下次迭代后依然适用，可以得出算法是正确的。如果你观察与循环相关的不变式概念，它是循环中每次迭代之前和之后都为真的陈述：\n\
    \n```java\nwhile(B) // I\n```\n\n由于循环只要条件 $B$ 为真就会迭代，那么在循环完成后，你可以得出结论：\n\n```java\n\
    I \\wedge \\neg B\n```\n\n并且 $p = 0 \\wedge rn^p = n'$，然后 $r = rn^0 = n'$。另一个，在欧几里得算法中，可以将不变式表述如下：\n\
    \n- Pre: $n > 0, m > 0$\n- Post: $n = gcd(n,m)$\n\n```java\nint gcd(int n, int\
    \ m) {\n  while (m != n) // Inv: gcd(n,m) = gcd(n',m')\n    if (n > m) n = n -\
    \ m;\n    else m = m - n;\n  return n;\n}\n```\n\n上面，在演示算法时，我已经解释了算法何时停止以及不变式何时成立。因此，当算法停止时，你拥有\
    \ $n = m \\wedge gcd(n,m) = gcd(n',m')$，然后该方法返回 $n = gcd(n',m')$，这就是所需的结果。\n\n\
    ## 4 排序\n\n在本章中，我将提到一组用于对集合排序的算法，作为集合的示例，我将在各处使用数组。我将查看以下算法：\n\n| 算法 | 复杂度 |\n\
    | :--- | :--- |\n| 冒泡排序 | $O(N^2)$ |\n| 选择排序 | $O(N^2)$ |\n| 插入排序 | $O(N^2)$ |\n\
    | 壳排序 | $O(N(\\log N)^2)$ |\n| 合并排序 | $O(N\\log N)$ |\n| 快速排序 | $O(N\\log N)$\
    \ |\n\n从它们的时间复杂度可以看出，它们在效率上有很大差异。在实践中，最后两种使用最广泛。\n\nimg/c51e118bfde98129bcc4f8937eeba18_72_0.png\n\
    \n### 4.1 冒泡排序\n\n我已经提到过这个算法了，所以下面的内容有些重复，但首先简单介绍一下冒泡排序是如何工作的（以及如何实现）。如果你有一个数组：\n\
    \n| 11 | 5 | 19 | 3 | 13 | 2 | 7 | 17 |\n\n那么你从后向往前遍历数组。对于每一轮，你执行一个从开始到箭头所指位置的内部循环。如果在在此迭代中遇到一个比其后续元素大的项，就交换它们。将\
    \ 11 与 5 交换，19 与 3 交换，然后与 13，然后与 2，最后与 17 交换：\n\n| 5 | 11 | 3 | 13 | 2 | 7 | 17\
    \ | 19 |\n\n这是向正确方向的一步，19 现在到位了。因此，在下一次迭代中，你只需要看剩下的 7 个位置：\n\n| 5 | 11 | 3 | 13\
    \ | 2 | 7 | 17 | 19 |\n\n现在，最大的元素到达最后一个位置——重复此过程直到数组有序。该算法用 Java 编写如下：\n\n```java\n\
    public static <T extends Comparable<T>> void bubbleSort(T[] arr) {\n  boolean\
    \ ok = false;\n  for (int i = arr.length - 1; i > 0; --i) {\n    ok = true;\n\
    \    for (int j = 0; j < i; j++) {\n      if (arr[j].compareTo(arr[j + 1]) > 0)\
    \ {\n        T temp = arr[j];\n        arr[j] = arr[j + 1];\n        arr[j + 1]\
    \ = temp;\n        ok = false;\n      }\n    }\n    if (ok) break;\n  }\n}\n```\n\
    \n注意，首先如果数组从开始就是有序的，第一轮就不会发生任何交换，算法就会停止。这是因为 `ok` 标志保持为 `true`。最坏情况是最小元素在开头。在这种情况下，数组需要\
    \ n 次传递（内部循环必须执行 n 次），产生复杂度 O(n²)。平均情况也是 O(n²)。当数组已经有序时，最好情况是 O(n)。\n\n### 4.2\
    \ 选择排序\n\n另一种排序方法称为选择排序。在这里遍历数组并找到最小元素的索引。一旦完成，就替换第一个元素。再次遍历数组，但只传递 n-1 个元素——排除第一个：\n\
    \n```java\npublic static <T extends Comparable<T>> void selectionSort(T[] arr)\
    \ {\n  for (int i = 0; i < arr.length - 1; i++) {\n    int min = i;\n    for (int\
    \ j = i + 1; j < arr.length; j++) {\n      if (arr[j].compareTo(arr[min]) < 0)\
    \ {\n        min = j;\n      }\n    }\n    T temp = arr[i];\n    arr[i] = arr[min];\n\
    \    arr[min] = temp;\n  }\n}\n```\n\n"
