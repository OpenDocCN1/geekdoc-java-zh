    THE CONCEPT OF ALGORITHMS\n\nAn algorithm that determines a cross sum can be written\n\
    \n```\nwhile (n < 10)\n{\n    n = the sum of the digits in n\n}\n```\n\nand the\
    \ problem is therefore reduced to determine the sum of the digits in an integer:\n\
    \n```\n// Returns the cross sum of digits in n, when n is not negative.\npublic\
    \ static int crossSum(long n)\n{\n    while (n > 9) n = digitSum(n);\n    return\
    \ (int)n;\n}\n```\n\n```\npublic static int digitSum(long n)\n{\n    if (n ==\
