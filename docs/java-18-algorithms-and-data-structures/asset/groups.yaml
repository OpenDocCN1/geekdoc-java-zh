    \ = ad and m = bd hence n = (n - m) + m = (a + b)d. That is, d is divisor in both\
    \ m and n. You can conclude\n\n```\nif n >= m is gcd(n,m) = gcd(n,m)\n```\n\n\
    From this, it can be concluded that the loop in the above algorithm does not change\
    \ the largest common divisor of n and m and because the algorithm stops, it is\
    \ correct.\n\nBeing able to determine the largest common divisor of two integers\
