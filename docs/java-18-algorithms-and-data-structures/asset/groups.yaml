    \ Now it is also not necessary, and instead you attach a factor to each node,\
    \ which you then adjust for all nodes while looking down it. The class DoubleNode<T>\
    \ does not have such a factor, so the problem can be solved by placing a parent\
    \ pointer to each node. It takes little extra space, but the class AVLTree<T>\
    \ has the following inner class:\n\n```java\nprivate class AVLNode<T> extends\
    \ DoubleNode<T>\n{\n    public AVLNode<T> parent;\n    private int height = 1;\n\
    }\n```\n\n![](img/c51e118bfd5e98129bcc4f8937eeba18_159_0.png)\n\n# JAVA 18: ALGORITHMS\
