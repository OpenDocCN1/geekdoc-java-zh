    # PROBLEM 5: RADIX-SORT


    Radix-sort is a sorting method that can be used to sort strings of the same length
    (think of the sorting of keys) and which principle has linear time complexity.
    Suppose, for example, that you have 3-character keys that consist of digits, and
    an example might be the following:


    ```

