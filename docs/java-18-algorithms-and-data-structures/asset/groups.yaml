    \n```\npublic static <T extends Comparable<T>> median(T[] arr) {\n    T[] tmp\
    \ = Arrays.copyOf(arr, arr.length);\n    Arrays.sort(tmp);\n    return tmp[(tmp.length\
    \ - 1) / 2];\n}\n```\n\nIt solves the problem, but now the algorithm has a memory\
    \ complexity which is $O(N)$. You can also use a more direct route. Determining\
    \ the median is actually a special case of a more general problem, which consists\
    \ in determining the $k$th number in an array, that is, a method that determines\
    \ the least number, the second smallest, the third and so on. If you have an array\
    \ of 15 or 16 elements, and if you want to determine the median, you must determine\
    \ the 7th smallest number in both cases. I want to start with a method that divides\
    \ the elements of an array into two parts, where all elements to the left are\
    \ less than the dividing point, while all elements to the right are greater than\
    \ the dividing point. The result is a partition of an array where the lower index\
    \ is $a$ while the right index is $b$. The dividing point is determined by the\
    \ index $k$:\n\n![](img/c51e118bfd5e98129bcc4f8937eeba18_62_0.png)\n\n```\npublic\
    \ static <T extends Comparable<T>> int partition(T[] arr, int a, int b, int k)\
    \ {\n    T t = arr[k];\n    swap(arr, k, b);\n    int j = a;\n    for (int i =\
    \ a; i < b; i++) {\n        if (arr[i].compareTo(t) < 0) {\n            swap(arr,\
    \ j, i);\n            ++j;\n        }\n    }\n    swap(arr, b, j);\n    return\
    \ j;\n}\n```\n\n```\nprivate static <T> swap(T[] arr, int i, int j) {\n    if\
    \ (i != j) {\n        T t = arr[i];\n        arr[i] = arr[j];\n        arr[j]\
    \ = t;\n    }\n}\n```\n\nThe algorithm is simple, but it works as follows:\n\n\
    1. The partition element is saved in a variable *t*, and it is replaced with the\
    \ value in the last place.\n2. The index *j* is set to point after the end of\
    \ the left part (from the beginning — the elements that are smaller than the partition\
    \ element).\n3. The sub array is passed through. If you find an element that is\
    \ smaller than the partition element, this element is added to the left part.\n\
    4. The last partition element is put into place.\n\nThe partition element is also\
    \ called a pivot point, and after the method is completed, the pivot point *t*\
    \ will be located in the correct place, and all elements to the left of *t* are\
    \ less than *t*, while all elements to the right of *t* are greater than (or equal\
    \ to) *t*. Note that the method returns the index for the pivot point. Also note\
