    \nInsertion and deletion of elements takes place in principle the same way as\
    \ for a single linked list, but there are now several references to keep track\
    \ of. For example, a method insertAfter() can be described as follows:\n\n1. Find\
    \ the node current, which the new element must follow\n2. create a new node that\
    \ points back to current and forward on current's successor\n3. current's successor\
    \ must point back to the new node\n4. current should point forward to the new\
    \ node\n\nYou should consider whether the implementation also work if the element\
    \ is inserted after the last element, which will often be a special case. Similarly,\
    \ you can describe a method insertBefore(). A method to delete a node is the most\
    \ complex and can be described as something like the following:\n\n1. Find the\
    \ node current, which contains the item to be deleted\n2. The successor to current\
    \ must point back to the predecessor to current\n3. The predecessor to current\
    \ must point forward on the successor to current\n\nWhen deletion is more complex\
    \ than insertion, it is deletion of both the first and the last element will be\
    \ a special cases. In addition, it should be noted that deleting an element may\
    \ result in an empty list.\n\nTo implement a double-linked list, start with a\
