    The idea is to create a queue for each character that can occur, and in this case
    it is 10. Next, you pass the array so you place the numbers in the queues for
    the last digit, after which the numbers are moved back to the array by removing
    all elements from the queues. Then you repeat the process, but you place the numbers
    in the queues after the next last digit and continue until all digit positions
    are used. Then the array is sorted. With the above example, 3 iterations must
    be used (the key length is 3) and after the 1st iteration is:


    ```

    Queue 0

    Queue 1 681 311

