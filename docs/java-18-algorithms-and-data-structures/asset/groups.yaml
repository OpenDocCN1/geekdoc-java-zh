    ```\n\nIf you try the method, you will probably be that it takes 0 seconds. Then\
    \ to make N larger, and you will find that eventually the algorithm takes a very\
    \ long time to finally stop completely. The lesson is that for small values of\
    \ N, the algorithm is quite effective, but for large values it is unusable.\n\n\
    ## 3.4 DEFINITION OF COMPLEXITIES \n\nIn this section, I would like to define\
    \ the concept of complexity a little more formally.\n\nLet an algorithm be given\
    \ where the execution time depends on a positive integer N and so that the execution\
    \ time can be described by a function T(N). If also F(N) is a function of N, it\
    \ is said that the algorithm's complexity is O (F(N)) if there is a constant c\
    \ and p positive integer so\n\nT(N) ≤ cF(N) N ≥ N₀\n\nIt expresses that for large\
    \ values of N, the execution time is not worse than constant times (N). Saying\
    \ a bit differently, the function F(N) defines an upper limit for how wrong it\
    \ may be.\n\nIt should be added that there are other complexity measures “big\
    \ o”, but I will be happy with that, as it is primarily the one you encounter\
    \ in.\n\nThere are no specific requirements for the function F(N), but in practice\
    \ it typically be one of the following functions, where the logarithm function\
    \ (usually) is the 2-number logarithm and the sequence describing how fast the\
    \ functions grows for large values of N:\n\n- Constant whose graph is a horizontal\
    \ line\n- log(N) The logarithm function graph is flat curve\n- log²(N) The square\
    \ of the logarithm function\n- √N The square root function\n- N A linear function,\
    \ whose graph is a growing straight line\n- Nlog(N) N times the logarithm function\
    \ whose graph grows much smaller than N²\n- N² Square function whose graph is\
    \ a parabola\n- N³ The cubic function whose graph is a very fast growing function\n\
    - 2N The exponential function\n\nThe above functions are typical, but there may\
    \ be others.\n\nAbove I have everywhere described complexities of functions in\
    \ 1 variable, but an algorithm and its time complexity of course depend on several\
    \ parameters. It does not significantly change the definitions, but just think\
    \ that $N$ can consist of several values.\n\nIn practice, it can be quite difficult\
    \ to deduce and argue for the complexity of an algorithm, and it will often require\
    \ a lot of mathematics. However, there are some guidelines that can help.\n\n\
    - If an algorithm does not contain loops, its execution time will usually be independent\
    \ of the parameters of the algorithm and its complexity is constant. It is a $O(1)$\
    \ algorithm. You must be careful, however, because the algorithm can call a method\
    \ that does not have constant time complexity. Algorithms with constant time complexity\
    \ are considered to be optimal in many contexts.\n- If an algorithm contains a\
    \ single loop and a single pass of this loop, then its complexity will be $O(N)$.\
    \ There are many algorithms that have this complexity and in many contexts they\
    \ will be considered as algorithms.\n- If an algorithm has two loops inside each\
    \ other and if one is repeated $N$ times and the other repeats $M$ times, the\
    \ complexity will typically be $O(MN)$. If specifically $M = N$ (what is often\
    \ the case) the complexity will be $O(N^2)$.\n- Another common situation is (think\
    \ of binary search) that you have a loop and for each pass of the loop length\
    \ of the loop is halved. If so, time complexity will be $O(\\log(N))$.\n\nYou\
    \ should be careful about the rules as they can give a false picture, primarily\
    \ because methods/algorithms call use other methods that have a time complexity\
    \ that is not constant, but conversely, the rules may be useful for quickly assessing\
    \ a complexity of an algorithm. For example, think of an algorithm that has three\
    \ nested loops, all of which are equal length. Such an algorithm will have the\
    \ complexity $O(N^3)$, and in the vast majority of cases it will be a complexity\
    \ that makes the algorithm unavailable for practical purposes.\n\n## 3.5 MERGE\n\
    \nGiven two arrays $table1$ and $table2$, both of which are sorted in ascending\
    \ order, understands by merge the two arrays combined to an array that contains\
    \ all elements in both $table1$ and $table2$ sorted in ascending order.\n\nIf\
    \ table1 has M elements and table2 has N elements, you can write an algorithm\
    \ as follows:\n\n```java\ni = j = k = 0\nwhile (i < M and j < N)\n{\n  if (table1[i]\
    \ < M)\n  {\n    table3[k] = table1[i]\n    ++i\n  }\n  else\n  {\n    table3[k]\
    \ = table2[j]\n    ++j\n  }\n  ++k\n}\nwhile (i < M)\n{\n  table3[k] = table1[i]\n\
    \  ++i\n  ++k\n}\n```\n\n![](img/c51e118bfd5e98129bcc4f8937eeba18_56_0.png)\n\n\
    ```java\nwhile (j < N)\n{\n  table3[k] = table2[j]\n  ++j\n  ++k\n}\nreturn table3\n\
    ```\n\nThe principle is that you have a pointer i pointing to the next element\
    \ of table1 that has to be moved to the result array, a pointer j pointing to\
    \ the next element in table2 to be moved to the result array and a pointer k as\
    \ to the place in the result array where the next element is to be placed. As\
    \ long as the two pointers i and j point to, you move the least of the two elements\
    \ that pointers point to. This continues until one of the two pointers does not\
    \ point to anything – that is, all elements in one array are moved and will be\
    \ in the result array placed in ascending order. Then, the remaining elements\
    \ of the two arrays must be moved, but there is only one of the two where there\
    \ are elements left, so only one of the two loops is performing. A step in the\
    \ algorithm can be illustrated as follows, where the next element to move is 8:\n\
    \n| 2 | 3 | 5 | 7 | 11 | 13 | 17 | 19 |\n|---|---|---|---|---|---|---|---|\n|\
    \ | 2 | 4 | 8 | 16 | 32 | | |\n\nThe algorithm can be easily implemented in Java\
    \ as follows:\n\n```java\nfor (; i < t1.length && j < t2.length; ++k)\n  if (t1[i].compareTo(t2[j])\
    \ < 0) t1[i++] else t[k] = t2[j++];\nfor (; i < t1.length; ++k) t[k] = t1[i++];\n\
    for (; j < t2.length; ++k) t[k] = t2[j++];\nreturn t;\n```\n\nBe a test method:\n\
    \n```java\nprivate static void test16()\n{\n    Integer[] arr1 = { 2, 3, 5, 7,\
    \ 11, 13, 17, 19 };\n    Integer[] arr2 = { 1, 2, 4, 8, 16, 32 };\n    Comparable[]\
    \ arr3 = Tools.merge(arr1, arr2);\n    Tools.sweep(Arrays.List(arr3), t -> System.out.print(t\
    \ + \" \"));\n    System.out.println();\n}\n```\n\nHere you should in particular\
    \ note that of type inference, the merge() method returns an array of the\n\n\
    ## 3.6 TIME COMPLEXITY IN PRACTICE\n\nComplexity calculations may seem theoretical,\
    \ but they actually play a major role in practice. You hear often about programs\
    \ where users complain that they are running slow. There may be several reasons,\
    \ but the most frequent is unfortunately algorithms with poor time complexity.\
    \ It is therefore important to be able to evaluate its algorithms with regard\
    \ to the use of time and time complexities as a measure of the algorithm's efficiency\
    \ and as a tool for comparing algorithms and making the right choices.\n\nIn practice,\
    \ it can be difficult (comprehensive) to determine the time complexity of algorithms,\
    \ but you get well with the above informal guidelines and a good deal of practice.\
    \ Thus, it is a fixed part of writing an algorithm that you relies on its time\
    \ complexity.\n"
  mdcn: "\n\nJAVA 18: 算法与数据结构：软件开发\n\n算法分析\n\n```java\nsw.start();\nbubbleSort(table);\n\
    sw.stop();\nSystem.out.println(sw.getSeconds());\n```\n\n如果你尝试这个方法，可能会发现它耗时 0\
    \ 秒。然后通过增大 N 的值，你会发现算法最终需要很长的时间才能完全停止。教训告诉我们，对于较小的 N 值，该算法是相当有效的，但对于较大的 N 值，它是不可用的。\n\
    \n## 3.4 复杂度的定义\n\n在本节中，我想更正式地定义一下“复杂度”这个概念。\n\n假设有一个算法，其执行时间取决于一个正整数 $N$，且执行时间可以用函数\
    \ $T(N)$ 来描述。如果 $F(N)$ 也是一个关于 $N$ 的函数，如果存在常数 $c$ 和正整数 $p$，使得\n\n该算法的复杂度为 $O(F(N))$，当：\n\
    \nT(N) \\leq cF(N) N \\geq N_0$\n\n这表示对于较大的 $N$ 值，执行时间不会坏于常数乘以 $(N)$。换句话说，函数 $F(N)$\
    \ 定义了其可能出现错误的程度上限。\n\n应该补充的是，还有其他的复杂度度量（如“大O表示”），但我认为这个已经足够了，因为这是你最常遇到的那种。\n\n\
    对函数 $F(N)$ 没有特殊要求，但在实践中，它通常是以下函数之一，其中对数函数（通常）是以 2 为底的对数，该序列描述了函数在大 $N$ 值下的增长速度：\n\
    \n- 常数：其图象为水平线\n- $\\log(N)$ 对数函数：图像为平缓曲线\n- $\\log^2(N)$ 对数函数的平方\n- $\\sqrt{N}$\
    \ 平根函数\n- $N$ 线性函数：其图像为增长的直线\n- $N\\log(N)$ $N$ 乘以对数函数：其图像增长速度远小于 $N^2$\n- $N^2$\
    \ 平方函数：图像为抛物线\n- $N^3$ 立方函数：其图像是一个增长极快的函数\n- $2^N$ 指数函数\n\n上述函数是典型的，但可能还有其他。\n\
    \n上面我随处描述了单变量函数的复杂度，但算法及其时间复杂度显然取决于多个参数。这并不会显著地改变定义，只需认为 $N$ 可以由几个值组成即可。\n\n在实践中，推导和论证算法的复杂度可能是相当困难的，通常需要大量的数学知识。然而，有一些指南可以提供帮助。\n\
    \n- 如果一个算法不包含循环，它的执行时间通常与算法的参数无关，其复杂度是常数。这是一个 $O(1)$ 算法。但你必须小心，因为算法可能会调用一个没有常数时间复杂度的方法。在许多情况下，常数时间复杂的算法被认为是最优的\n\
    - 如果一个算法包含一个循环且该循环运行一次，那么它的复杂度将是 $O(N)$。有很多算法具有这种复杂度，在许多情况下，它们被视为良好的算法。\n- 如果一个算法包含两个嵌套循环，其中一个重复\
    \ $N$ 次，另一个重复 $M$ 次，复杂度通常为 $O(MN)$。如果特别地 $M = N$（通常如此），复杂度将是 $O(N^2)$。\n- 另一种常见情况是（考虑二分查找），你有一个循环，并且每次循环时循环的长度减半。如果是这样，时间复杂度将是\
    \ $O(\\log(N))$。\n\n你应该对这些规则保持小心，因为它们可能会给出错误的结论，主要是方法/算法调用会使用其他时间复杂度不是常数的方法，但相反，这些规则可能有助于快速评估算法的复杂度。例如，考虑一个具有三个嵌套循环且长度都相等的算法。这种算法的复杂度为\
    \ $O(N^3)$，在绝大多数情况下，这种复杂度会使算法无法用于实际目的。\n\n## 3.5 合并 (MERGE)\n\n给定两个数组 $table1$\
    \ 和 $table2$，且它们都按升序排序，所谓的“合并”是指将这两个数组合并成一个数组，该数组包含 $table1$ 和 $table2$ 中的所有元素，并按升序排列。\n\
    \n如果 $table1$ 有 $M$ 个元素，$table2$ 有 $N$ 个元素，你可以写如下的算法：\n\n```java\ni = j = k =\
    \ 0\nwhile (i < M and j < N)\n{\n  if (table1[i] < M)\n  {\n    table3[k] = table1[i]\n\
    \    ++i\n  }\n  else\n  {\n    table3[k] = table2[j]\n    ++j\n  }\n  ++k\n}\n\
    while (i < M)\n{\n  table3[k] = table1[i]\n  ++i\n  ++k\n}\n```\n\n![](img/c51e118bfd5e98129bcc4f8937eeba18_56_0.png)\n\
    \n```java\nwhile (j < N)\n{\n  table3[k] = table2[j]\n  ++j\n  ++k\n}\nreturn\
    \ table3\n```\n\n其原理是：你有一个指针 $i$ 指向 $table1$ 中需要移动到结果数组的下一个元素，指针 $j$ 指向 $table2$\
    \ 中需要移动到结果数组的下一个元素，指针 $k$ 指向结果数组中放置下一个元素的位置。只要指针 $i$ 和 $j$ 有指向，你就移动这两个指针所指元素中较小的一个。这种持续持续直到其中一个指针不再指向任何内容——即一个数组中的所有元素都已移动并按升序位于结果数组中。然后，两个数组中剩余的元素必须移动，但只有其中一个数组还有剩余元素，所以两个循环中只有一个在执行。算法中的一步可以如下所示，其中下一个移动的元素是\
    \ 8：\n\n| 2 | 3 | 5 | 7 | 11 | 13 | 17 | 19 |\n|---|---|---|---|---|---|---|---|\n\
    | | 2 | 4 | 8 | 16 | 32 | | |\n\n该算法在 Java 中可以简单实现如下：\n\n```java\nfor (; i < t1.length\
    \ && j < t2.length; ++k)\n  if (t1[i].compareTo(t2[j]) < 0) t1[i++] else t[k]\
    \ = t2[j++];\nfor (; i < t1.length; ++k) t[k] = t1[i++];\nfor (; j < t2.length;\
    \ ++k) t[k] = t2[j++];\nreturn t;\n```\n\n编写一个测试方法：\n\n```java\nprivate static\
    \ void test16()\n{\n    Integer[] arr1 = { 2, 3, 5, 7, 11, 13, 17, 19 };\n   \
    \ Integer[] arr2 = { 1, 2, 4, 8, 16, 32 };\n    Comparable[] arr3 = Tools.merge(arr1,\
    \ arr2);\n    Tools.sweep(Arrays.List(arr3), t -> System.out.print(t + \" \"));\n\
    \    System.out.println();\n}\n```\n\n在这里你应该特别注意，由于类型推断，merge() 方法返回一个类型\n\n"
