    \ element with another. There are many algorithms that works completely after\
    \ the same template:\n\n- determine the largest element in an array\n- determine\
    \ the sum of elements in an array\n- print all elements in an array\n\nand the\
    \ difference is solely what to do with the individual elements or whether it is\
    \ necessary to pass through all the elements, the iteration can be completed before\
    \ reaching all the way (with linear search). An algorithm of the above nature\
    \ is sometimes called a sweep algorithm, which means it “sweeps” over the array\
    \ elements. In the next chapter I will look at the efficiency of algorithms, and\
    \ it will see that all sweep algorithms have the same efficiency, and in practice\
    \ they are considered to be effective. If a sweep algorithm works on an array\
    \ of a given size, the algorithm typically needs to do something with each element,\
    \ and in principle it should perform the same number of operations as there are\
    \ elements in the array. It is said that the complexity of the algorithm depends\
    \ linearly on the array size.\n\nSometimes sweep is called for an algorithm template\
    \ similar to that it is a common template for an entire family of algorithms.\
    \ The template is simple and is just a loop over a collection:\n\n```java\nfor\
    \ (e in collection)\n{\n  action(e)\n}\n```\n\nUsing Java’s functional interfaces,\
    \ you can write some general algorithms for sweep over a collection. For example,\
    \ the following method performs a sweep over a collection values, where the last\
    \ parameter is an operation to be performed on the individual elements:\n\n```java\n\
    public static <T> void sweep(Iterable<T> values, Consumer<T> action)\n{\n  for\
    \ (T t : values) action.accept(t);\n}\n```\n\nThe algorithm can be expanded with\
    \ a parameter ok, which indicates which elements to be processed:\n\n```java\n\
    public static <T> void sweep(Iterable<T> values, Predicate<T> ok,\nConsumer<T>\
    \ action)\n{\n  for (T t : values) if (ok.test(t)) action.accept(t);\n}\n```\n\
