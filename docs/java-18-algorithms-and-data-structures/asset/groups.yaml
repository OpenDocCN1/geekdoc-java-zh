    \ n = (qa + b)/d and d is divisor in both m and n. Thus it can be concluded that\
    \ d is divisor in n and m if only if d is divisor in both m and n % m\n\nand hence\
    \ again that\n\n```\ngcd(n,m) = gcd(m,n%m)\n```\n\nwhen n >= m. You can write\
    \ an improved version of Euclid’s algorithm as follows:\n\n```java\n// Returns\
