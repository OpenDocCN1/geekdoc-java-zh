    \ m;\n        if (arr[m].compareTo(elem) < 0) return binSearch(arr, elem, m +\
    \ 1, b);\n        return binSearch(arr, elem, a, m - 1);\n    }\n```\n\nA recursive\
    \ method requires two additional parameters to define the range to be searched\
    \ for. Otherwise, there is not much to explain and it is just the above algorithm\
    \ written in Java.\n\n![](img/c51e118bfd5e98129bcc4f8937eeba18_26_0.png)"
