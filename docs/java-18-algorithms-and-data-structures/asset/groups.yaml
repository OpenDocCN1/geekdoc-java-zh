  mdcn: "\n\n# JAVA 18: 算法与数据结构：软件开发\n\n递归调用的次数会爆炸式增长，因为每次调用都会导致 2 次新调用，而其中每一个调用会再次产生\
    \ 2 次新调用，以此类推。\n\n问题不在于递归本身有什么错，而仅仅是因为在这种情况下递归不是解决方案。它也是一个例子，说明你应该始终考虑递归方法，因为很难发现其后果。你应该编写上述方法，因此它应该是迭代的，这也很容易实现，而且当你测试这些算法时，两种算法效率之间的差异将非常直观。\n\
    \n```java\npublic static long fibo(int n)\n{\n  if (n < 2) return n;\n  long f1\
    \ = 0;\n  long f2 = 1;\n  while (n-- > 1)\n    {\n      long f3 = f1 + f2;\n \
    \     f1 = f2;\n      f2 = f3;\n    }\n  return f2;\n}\n```\n\n`Algorithms` 项目有两个测试方法——`test04()`\
    \ 和 `test05()`——它们测试斐波波契数的算法。\n\n因此，斐波那契数是另一个例子，证明算法可以用多种方式编写，而且绝不是最明显的那个就是最好的。顺便提一下，最后一个迭代解决方案中使用的方法被称为动态规划，这是我将在该系列的下一书中讨论的话题。\n\
    \n## 2.5 欧几里得算法\n\n最老的算法之一是欧几里得算法，它确定两个正整数的最大公约数。这是一个非常简单的算法。如果 $n$ 和 $m$ 是正整数，我用\
    \ $gcd(m, n)$ 表示它们的最大公约数。例如，考虑数字 30 和 42，它们的最大公约数是 6。即 $gcd(30, 42) = 6$。\n\n\
    该算法的思想是：\n\n```\n重复{\n  如果 m 和 n 相等则是最大公约数\n  否则从较大的数中减去较小的数\n}\n```\n\n在这种情况下，算法并不容易想出来。首先，并不清楚算法是否会停止；其次，很难看出它是否给了正确的结果。\n\
    \n如果你观察循环的单次迭代，有两种情况：\n\n- 两个数字相同，你就完成了（两个相同数字的最大公约数自然是数字本身）\n- 两个数字中的一个比之前小，但不是\
    \ 0\n\n最后一种情况不能无限重复下去，早晚这两个数字会变得相同。也就是说算法停止了。\n\n![](img/c51e118bfd5e98129bcc4f8937eeba18_29_0.png)\n\
    \n# JAVA 18: 算法与数据结构：软件开发 算法的概念\n\n为了证明算法是正确的，假设例如 $n \\ge m$。如果 $d$ 是同时是 $m$\
    \ 和 $n$ 的因因子，则存在正数 $a$ 和 $b$，使得 $n = ad$ 且 $m = bd$，因此 $n - m = (a - b)d$。这意味着\
    \ $d$ 也是 $m$ 和 $n - m$ 的因因子。假设 $d$ 是同时是 $m$ 和 $n - m$ 的因因子。存在正数 $a$ 和 $b$，使得 $n\
    \ - m = ad$ 且 $m = bd$，因此 $n = (n - m) + m = (a + b)d$。这意味着 $d$ 同时是 $m$ 和 $n$\
    \ 的因因子。你可以得出：\n\n```\nif n >= m is gcd(n,m) = gcd(n,m)\n```\n\n从此可以得出，上述算法中的循环没有改变\
    \ $n$ 和 $m$ 的最大公约数，并且算法会停止，因此它是正确的。\n\n能够确定两个整数的最大公约数是有有趣的，尽管上述形式的欧几里得算法（由于效率问题）不是最明显的，但该算法作为解决非平凡问题的算法仍然是有趣的，并且作为一个非常简单的例子，以及一个无法一眼看出它解决了\
    \ Java 中编写的算法的例子：\n\n```java\npublic static long gcd(long m, long n) {\n    if\
    \ (m == 0) return n;\n    if (n == 0) return m;\n    while (n != m) if (n > m)\
    \ n -= m; else m -= n;\n    return n;\n}\n```\n\n上面，我说明了参数应该是正数。如果 $a > 0$ 是同时是\
    \ $a$ 和 0 的因因子，那么 $gcd(a, 0) = a$。也就是说，在参数为 0 的情况下，最大公约数也有意义。算法从一个特殊情况开始，其前提条件是参数不应为负。\n\
    \n上述算法的问题是迭代可能太多。如果其中一个数字很大（`max int`）而另一个数字很小（1），你会有很多迭代。\n\n"
