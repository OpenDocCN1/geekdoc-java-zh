    # 3.9 CORRECTNESS OF ALGORITHMS


    Another and often more difficult problem than argue for the complexity of algorithms
    is to verify the correctness of an algorithm. Course, it is, equally important
    as it does not make sense to write algorithms that do not give the correct result.
    In the vast majority of cases, one will argue for the correctness of an algorithm
    by means of informal argumentation, in which you by speech (or writing) explains
    how the algorithm works. After the algorithm is written, you will test it and
    apply the test results as an argument for the correctness of the algorithm. It''s
    not always easy, and it''s especially difficult to get all cases with not overlook
    boundaries, where the algorithm may not take into account.


    However, you can also attack the correctness of algorithms more formally, and
    simply give a mathematical proof of the correctness of the algorithm. The following
    is a brief introduction to the subject – it''s just a hint of what to do. Partly
    because it is a relatively theoretical subject, and partly because the practical
    application is not so great.


    An algorithm is correct if its method used with pre-conditions gives the desired
    result with post-conditions. In addition, an algorithm must always stop after
    a final number of steps. The latter can be a problem if the algorithm contains
    an iteration, and in general, argumentation for the correctness of algorithms
    is only interesting if the algorithm contains iterations. In the examples that
    I''ve seen so far, it''s fairly easy to figure out that the algorithms are correct
    – maybe apart from Euclid''s algorithm. To more formally prove'
- md: "\n## JAVA 18: ALGORITHMS AND DATA STRUCTURES: SOFTWARE DEVELOPMENT ALGORITHM\
    \ ANALYSIS\n\nthat algorithms are correct, you can associate statements (also\
    \ called assertions) to specific locations in the algorithm. They express statements\
    \ that must be true at those places and can be used to argue for the correctness\
    \ of an algorithm. Assertions in principle occur anywhere in the algorithm, but\
    \ they are typically used in selections and iterations where they are most interested,\
    \ and they are in this context called for invariants. At the power raising algorithm,\
    \ you can introduce the following invariant:\n\n```java\n// Pre: n > 0 and p =\
    \ 0\n// Post: return n^p\ntokens(int n, int p) {\n  int r = 1;\n  while (p > 0)\
    \ // Inv: r*n^p = n^p\n    r = r * n;\n    p = p - 1;\n  }\n  return r;\n}\n```\n\
    \nHere is `Inv: r*n^p = n^p`, an invariant of the iteration, which must be met\
    \ immediately before the iteration is performed and immediately after the iteration\
    \ is performed. $p'$ means the value of the parameter $p$ as it was before (that\
    \ is the value transferred to the algorithm). It is said that the invariant is\
    \ valid if the condition of the iteration is true before and after each iteration.\
    \ To prove that the algorithm is correct is reduced to show that the invariant\
    \ is preserved for each iteration. Typically, it is shown by induction: when the\
    \ loop starts $r = 1$ and $p = n$ so the invariant is met from the beginning and\
    \ after the first iteration $r = n$ and $p = n-1$ so the invariant is met. That\
    \ is, the start of the induction is correct.\n\nAssume that the invariant holds,\
    \ is to say that $rn^p = n''$. Let $r'$ and $p'$ be the new values of $r$ and\
    \ $p$ after the next iteration. That is $r'' = r'$ and $p'' = p-1$, then the last\
    \ equals are derived from the assumption. Thus, it is shown that invariant applies\
    \ after the next iteration, and it can be concluded that algorithm correct. If\
    \ you look at the concept of invariant in connection with a loop, it is a statement\
    \ that is true both before and after each iteration in the loop:\n\n```java\n\
    while(B) // I\n```\n\nAs the loop is iterating as long as the condition $B$ is\
    \ true, then after the loop is completed, you can conclude that:\n\n```java\n\
    I \\wedge \\neg B\n```\n\nand $p = 0 \\wedge rn^p = n'$ and then $r = rn^0 = n'$.\
    \ As another, in Euclid's algorithm one can express an invariant as follows:\n\
    \n- Pre: $n > 0, m > 0$\n- Post: $n = gcd(n,m)$\n\n```java\nint gcd(int n, int\
    \ m) {\n  while (m != n) // Inv: gcd(n,m) = gcd(n',m')\n    if (n > m) n = n -\
    \ m;\n    else m = m - n;\n  return n;\n}\n```\n\nAbove, during the presentation\
    \ of the algorithm, I have explained that the algorithm stops and that the invariant\
    \ holds. Therefore, when the algorithm stops, you have $n = m \\wedge gcd(n,m)\
    \ = gcd(n',m')$ and then the method returns $n = gcd(n',m')$, which is the desired\
    \ result.\n\n## 4 SORTING\n\nIn this chapter I will mention a family of algorithms\
    \ that are used to sort a collection of objects, and as an example of a collection\
    \ I will use an array everywhere. I will look at the following algorithms:\n\n\
    | Algorithm | Complexity |\n| :--- | :--- |\n| Bubble sort | $O(N^2)$ |\n| Selection\
    \ sort | $O(N^2)$ |\n| Insertion sort | $O(N^2)$ |\n| Shell sort | $O(N(\\log\
    \ N)^2)$ |\n| Merge sort | $O(N\\log N)$ |\n| Quick sort | $O(N\\log N)$ |\n\n\
    and you can see from their time complexities, they differ a lot in terms of efficiency.\
    \ In practice, the last two are the most widely used.\n\nimg/c51e118bfde98129bcc4f8937eeba18_72_0.png\n\
    \n### 4.1 BUBBLE SORT\n\nI've already mentioned this algorithm, so the following\
    \ is a bit of a repeat, but first a little bit about how bubble sort works (and\
    \ can be implemented). If you have an array:\n\n| 11 | 5 | 19 | 3 | 13 | 2 | 7\
    \ | 17 |\n\nthen you run over the array from the back to the start. For each pass,\
    \ you perform an inner loop that runs from start to the place where the arrow\
    \ points. If you meet an item greater than its successor in this iteration, they\
    \ are replaced. That change 11 with 5, 19 change with 3, and then with 13, then\
    \ with 2, and finally with 17:\n\n| 5 | 11 | 3 | 13 | 2 | 7 | 17 | 19 |\n\nIt\
    \ is a step in the right direction, and 19 is now in place. Therefore, in the\
    \ next iteration you should only look at the 7 places and the:\n\n| 5 | 11 | 3\
    \ | 13 | 2 | 7 | 17 | 19 |\n\nNow, the largest element reaches the last place\
    \ – the process is repeated until the array is sorted. The algorithm can be written\
    \ in Java as follows:\n\n```java\npublic static <T extends Comparable<T>> void\
    \ bubbleSort(T[] arr) {\n  boolean ok = false;\n  for (int i = arr.length - 1;\
    \ i > 0; --i) {\n    ok = true;\n    for (int j = 0; j < i; j++) {\n      if (arr[j].compareTo(arr[j\
    \ + 1]) > 0) {\n        T temp = arr[j];\n        arr[j] = arr[j + 1];\n     \
    \   arr[j + 1] = temp;\n        ok = false;\n      }\n    }\n    if (ok) break;\n\
    \  }\n}\n```\n\nNote, first that if the array is sorted from the start, there\
    \ are no exchanges in the first pass and the algorithm stops. This is because\
    \ the `ok` flag remains true. The worst case is when the smallest element is at\
    \ the start. In this situation, the array requires n passes (the inner loop must\
    \ be performed n times), which gives a complexity O(n²). The average case is also\
    \ O(n²). The best case is O(n) when the array is already sorted.\n\n### 4.2 SELECTION\
    \ SORT\n\nAnother sorting method is called selection sort. Here the array is traversed\
    \ and the index is found on the smallest. Once that has happened, the first element\
    \ is replaced. The array is traversed again, but only the n-1 elements are passed\
    \ — the first one:\n\n```java\npublic static <T extends Comparable<T>> void selectionSort(T[]\
    \ arr) {\n  for (int i = 0; i < arr.length - 1; i++) {\n    int min = i;\n   \
    \ for (int j = i + 1; j < arr.length; j++) {\n      if (arr[j].compareTo(arr[min])\
    \ < 0) {\n        min = j;\n      }\n    }\n    T temp = arr[i];\n    arr[i] =\
    \ arr[min];\n    arr[min] = temp;\n  }\n}\n```\n"
