- md: "\n# TREES\n\nA tree is a collection that organizes objects in a hierarchical\
    \ structure, for example:\n\n![](img/c51e118bfd5e98129bcc4f8937eeba18_127_0.png)\n\
    \nthat is a tree with 11 objects. The letters mean nothing but I can refer to\
    \ the individual objects. It is said that a tree consists of nodes, where each\
    \ node contains an object, and in this case there are 11 nodes. One of these nodes\
    \ plays a special role and is the entrance to the data structure, and in this\
