    and finally the array is sorted:


    | 10 | 11 | 12 | 15 | 19 | 23 | 25 | 29 | 33 | 35 | 41 | 45 | 55 | 56 |


    The method is called for *quick sort*. Its complexity depends on how lucky you
    are with the selection of the elements used to divide the arrays each time. If
    you are lucky, and this means the problem is divided into two problems each time,
    the length of the sub-problems is halved each time, which is proportional to $\log
    n$. Each time, the entire array must be passed through to divide the problem,
    and the result is that quick sort has the best complexity of $O(nlog n)$. If the
    array is already sorted, the use of the first element as pivot point makes the
    left part almost becomes empty and the number of times to divide is $n$. The result
    is a worst complexity of $O(n^2)$, thus the same as the simple sorting methods.
    Assuming that the sorting of the array from the start is random, there is reason
    to believe that the division results in sub-problems, which approximate of the
    same size, and it is possible to show that the mean complexity is $O(nlog(n))$.


