    # JAVA 18：算法与数据结构：软件开发哈希


    # 如果你进一步添加 6000, Kolding，由于冲突的结果，它也必须放置在 6 位置。然后尝试放置 7，然后放置 8，直到在位置 9 处找到一个空闲空间。线性探测法的优点部分在于其原理易于实现，并且不需要为覆盖数组准备任何额外的数据结构。另一方面，它也有显著的缺点。如果数组几乎填满，冲突可能会在找到空闲空间之前导致多次搜索，访问特定元素也是如此。另一个问题是很难在数据结构中删除对象，因为这会在冲突链中产生“空洞”。因此，删除操作必须通过标记一个已删除的对象来实现，而不是在物理上移除元素并释放空间。这必须与某种形式的哈希结合，并重新组织数据结构，从而释放被删除对象所占的空间。


    对线性探测的研究还表明，该方法倾向于形成簇，即键指向一组索引，而另一些索引组则很少被使用。这是很遗憾的，因为它意味着增加了冲突次数。然而，可以使用二次探测法（square
    probing）来改进该方法。其原理与线性探测相同，冲突的结果存储在与主对象相同的数组中。区别在于，位置不是通过不断获取下一个选取的，而是通过从以下序列获取索引：


    ```

    i = (h + k^2) mod n k=0,1,2,3,...

    ```


    其中 h 是主索引哈希（键中的哈希值），n 是数组大小。也就是说，如果发生冲突（空间 h 忙碌），尝试 h+1，然后放置 h+4，然后是 h+9，依此类推。研究表明，二次探测比线性探测更好，且不会导致许多冲突，但显而易见的是上述索引可以找到空闲空间，即使数组没有填满且没有进入环形。可以证明，如果数组大小是一个质数，且填充率（数组使用的比例）不超过
    50%，二次探测将始终提供解决方案。二次探测法远好于线性探测，相反，它们存在的问题也是相同的，特别是移除元素的问题可能会导致冲突链中产生空洞。最后，二次探测的实现并不十分简单。


    如上所述，你可以使用覆盖数组来解决冲突问题。一种非常自然的改进是为数组中的每个位置绑定一个覆盖。通过这种方式，每个元素都有自己的冲突链，这使得链自然会变短，如果你有一个良好的哈希函数来均匀地分布对象，那么中间所有的冲突将是相等的。这听起来可能是一个昂贵的解决方案，因为数组中的每个空间都必须与列表（或类似结构）关联，事实如此，与二次探测相比，这种解决方案需要额外的内存，但简单易于实现的优点抵消了这一点。在
    Java 中，你拥有像 `HashSet<T>` 和 `HashMap<K, T>` 这样的集合类，它们基于哈希。它们解决了冲突问题，因为每个位置都有自己的冲突链。


    哈希结构内部是一个数组，因此它具有容量。如果你保存的对象超过了它的容量，结果将不可避免地产生冲突。相反，显然，如果数组中的所有位置都可用，冲突发生的概率就很小。因此，问题在于，数组必须填满到什么程度冲突才会成为问题，也就是说，填充率必须是多少。无论如何，如果填充率超过给定值，就有扩展数组的容量。在这里，我看到与
    `ArrayList` 相关，你可以使用翻倍法，这样如果填充率超过最大设置，你就可以增加数组的容量。然而，这不仅仅创建一个新数组并复制旧数组的问题，因为需要对所有对象进行重新哈希，因为数组的大小包含索引计算中。这意味着在哈希结构的情况下，你无法对顺序做任何假设。


