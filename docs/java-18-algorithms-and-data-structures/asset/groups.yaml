    \ m; else m -= n;\n    return n;\n}\n```\n\nAbove, I have stated that the arguments\
    \ should be positive. If a > 0 is a divisor in both a 0 and that gcd(a, 0) = a.\
    \ That is, the largest common divisor also makes sense in the case where the arguments\
