    JAVA 18：算法与数据结构：软件开发堆


    # 8 堆 (HEAP)


    堆在某种程度上类似于栈（stack）和队列（queue），因此你基本上可以执行以下两种操作：


    - 1. `add()`：向数据结构中添加一个元素

    - 2. `remove()`：返回并移除数据结构中的最小元素


    由此可以立即推导出，堆是一个**有序的数据结构**，因此它的元素是可以比较的。


    堆可以组织为二叉树，并需要满足以下两个额外特征：


    - 1. 它是一棵完全二叉树（complete binary tree）。

    - 2. 任何节点的值都小于或等于其子节点。


    ![](img/c51e118bfd5e98129bcc4f8937eeba18_162_0.png)


    # JAVA 18：算法与数据结构：软件开发堆


    例如，以下数据被组织成一个堆：


    ![](img/c51e118bfd5e98129bcc4f8937eeba18_163_0.png)


    特别注意，对于所有节点，其子节点要么为空（null），要么其值大于（父）节点。它也是一棵完全二叉树，因为第 1 层是满的，而第 2 层是从左侧填充。例如，如果
    47 是 31 的右孩子，那么它将不是一棵完全二叉树。


    堆以这种方式像二叉树一样组织元素，有时我们也称之为二叉堆（binary heap）。


    如果你想向堆中插入一个新元素，可以通过一个新节点扩展树：


    ![](img/c51e118bfd5e98129bcc4f8937eeba18_163_1.png)


    注意，它仍然是一棵完全树。你现在从名为 *current* 的新节点开始在树中向上移动。对于每一步，你查看父节点 `parent`。如果它大于要插入的新元素，则交换
    `parent` 与 *current* 的值，即 *current* 向上移动一层。当 `parent` 的值小于或等于新值时，过程停止。


    新值存储在 *current* 指向的地方。例如，假设新元素是 19。在元素移动并将 19 插入到 *current* 后，图片所示：


    ![](img/c51e118bfd5e98129bcc4f8937eeba18_164_0.png)


    下面是如果你也插入元素 7，堆的样子：


    ![](img/c51e118bfd5e98129bcc4f8937eeba18_164_1.png)


    注意，当然，较低层可能会被填满，你就有了一棵满二叉树。如果是这种情况，且你想插入另一个元素，树将增加另一层，但它仍然是一棵完全树，你必须从左侧开始，为上一层最左的节点创建一个新的叶子节点。此外注意，插入新节点后，你必须向上查找树以找到新元素必须放置的节点。在坏的情况下，你必须回到根节点，但如果你找到了，新元素必须小于根节点，因此也小于根节点的节点，该元素就可以作为新根节点插入。这意味着最坏情况下你必须回到根节点，这意味着插入新元素的时间复杂度为
    $O(\log (N))$。


    # JAVA 18：算法与数据结构：软件开发堆


    向堆中插入元素的结果如所示，最小元素始终位于根节点，因此实现 `remove()` 非常简单，因为它只需要返回根节点的值。然而，问题在于要确保移除根节点后树仍然是一个堆，这需要一个类似于插入的过程。


    在上面的示例中，`remove()` 返回 7，值为 59 的节点将消失。你从根节点开始移动到最小孩子，这里是 13。由于它小于 59，它移动到了根节点。你现在重复这个过程并找到
    13 的最小孩子，即 17。由于它小于 59，17 向上移动一个位置（父节点指向的地方）：


    ![](img/c51e118bfd5e98129bcc4f8937eeba18_165_0.png)


    由于 *current*（值为 17 的节点）没有孩子，将 59 放在该处：


    ![](img/c51e118bfd5e98129bcc4f8937eeba18_166_0.png)


    结果仍然是一个堆：它是一棵完全二叉树，每个节点的值都小于或等于其子节点。删除时，你从根节点开始向下移动，直到找到元素必须插入的位置。在坏的情况下，你必须回到根节点，时间复杂度为
    $O(\log (N))$。堆还有其他其他操作：


    - `add()`：添加一个新元素

    - `clear()`：删除所有元素

    - `getSize()`：返回元素数量

    - `peek()`：返回最小元素


    '
