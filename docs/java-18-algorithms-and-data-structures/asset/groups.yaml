    {\n  int getHeight = prev == null ? 0 : ((AVLNode<T>)prev).height;\n  int rightHeight\
    \ = next == null ? 0 : ((AVLNode<T>)next).height;\n  return getHeight - rightHeight;\n\
    }\n```\n\n```java\npublic int updateHeight()\n{\n  int left = prev == null ? 0\
    \ : ((AVLNode<T>)prev).height;\n  int rightHeight = next == null ? 0 : ((AVLNode<T>)next).height;\n\
    \  if (left > rightHeight) height = left + 1;\n  else height = rightHeight + 1;\n\
    \  return height;\n}\n```\n\nThe class has a factor variable height, and you will\
