    probing is partly that the principle is easy to implement and that there is no
    need for any extra data structure for the overlay array. On the other hand, there
    are also significant disadvantages. If the array is almost filled, a collision
    can lead to many searches before finding a free space, and the same is true of
    access a particular element. Another problem is that it is difficult to delete
    an object in the data structure as it creates holes in the collision chains. Deletion
    must therefore be implemented by marking an object that has been deleted without
    physically removing the element and releasing the space. It must then be combined
    with a form of hashing, and reorganizing the data structure and thus releasing
    the places used for deleted objects.


    Studies of linear probing have also shown that the method tends to form clusters,
    where the keys refer to groups of indices while there are other groups of indices
    rarely used. Its is unfortunate as it means to increase the number of collisions.
    However, one can improve the method by using square probing instead. The principle
    is the same as linear probing, where results in collisions are stored in the same
    array as the primary objects. The difference is that the places are not chosen
    by constantly taking the next one, but by taking the indices from the following
    sequence:


    ```

    i = (h + k^2) mod n k=0,1,2,3,...

    ```


    where h is the primary index hash (the hash value in the key) and n is the array
    size. That is, if there is a collision (space h is busy), try h+1, then place
    h+4, then h+9 and so on. Studies show that square probing is better than linear
    probing and does not lead to many collisions, but it is obvious that the above
    indices find a free space, even if the array is not full and does not go into
    a ring. One can show that if the array is a prime number, and the fill rate (proportion
    of array used) does not exceed 50%, quadratic probing will always provide a solution.
