    \ SORTING\n\nand it is actually a partially quick sort. Quick sort is generally\
    \ a good sorting method, and it is even the method used most frequently in practice.\
    \ As mentioned above, effectiveness depends depends how lucky you are with the\
    \ selection of sub-arrays. If the array is already sorted or almost sorted, the\
    \ selection of the first element (or the last element) as a pivot point is unfortunate,\
    \ the result is an O(n²) algorithm. The problem is actually worse than that, on\
    \ a large array, there will be a sudden overflow due to the recursive reimplementation.\
    \ You can therefore be interested in whether you can do better and to handle that\
    \ case where the array is almost sorted. A simple strategy is each time selecting\
    \ the middle element as a pivot element. It solves the problem of almost sorted\
    \ arrays, but of course it does not provide a guarantee as to is so unfortunate\
    \ that you can split up to two different intervals each time. However, the strategy\
    \ of choosing the middle element gives a much less probability of unlucky division\
    \ of the array. Ideally, you should choose the median as a pivot point, but the\
    \ problem is that it is difficult to determine the median, so you go no another\
    \ way to choose the median of the first, middle and last element (the same way\
    \ that I have previously described in connection with a method that determines\
    \ the median). It provides a significant improvement of quick sort.\n\nQuick sort\
    \ is usually implemented recursively, where the array is split up, as described\
    \ above, after you sort each part separately – recursively with quick sort:\n\n\
    ```\npublic static <T extends Comparable<T>> void quickSort(T[] t)\n{\n    quickSort(t,\
    \ 0, t.length - 1);\n}\n\nprivate static <T extends Comparable<T>> void quickSort(T[]\
    \ arr, int a, int b)\n{\n    if (a < b)\n    {\n        int p = partition(arr,\
    \ a, b, pivot(arr, a, b));\n        quickSort(arr, a, p - 1);\n        quickSort(arr,\
    \ p + 1, b);\n    }\n}\n```\n\nHere are partition() and pivot() the same methods\
