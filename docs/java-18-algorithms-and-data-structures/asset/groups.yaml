    \ and, in practice, it may be of great importance if you choose one or the other\
    \ version of an algorithm.\n\nThe test method test06() in the project Algorithms\
    \ tests the last of the largest common divisor algorithms.\n\n## 2.6 SUM OF DIGITS\n\
    \nIn the book Java 1, I looked at the calculation of the cross sum for a number,\
