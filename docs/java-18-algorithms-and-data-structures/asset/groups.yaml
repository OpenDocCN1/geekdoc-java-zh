    \ `p` 是受限制的。\n\n该算法的公式化方式使其与数据类型无关，但很容易将算法转换为 Java，并在特定类型上工作。这是一个非常简单的算法，但它表达了一种当\
    \ `p` 为非负整数且 `n` 为定义了乘法的类型（数字）时可以使用的方法。因此，该算法部分地独立于特定的数据类型。例如，如果你在 Java 中为整数实现它，可以写成：\n\
    \n```\n// 假设 p 不为负数\npublic static long power(long n, int p)\n{\n    long u =\
    \ 1;\n    for (; p > 0; --p) u *= n;\n    return u;\n}\n```\n\n在这里，利用了特定语言中的不同构造允许以更简单的方式表达算法，这当然是理应当的。\n\
    \n你应该注意，算法有输入参数，这些是算法运行的值。在这些参数上附带前提条件的情况下，我在算法前面用注释指出。相反，你也可以在前提条件未满足时使用 `raise\
    \ exception` 方法，这取决于你选择哪一种方法。如果你只是发布一个注释，它就是你要求用户遵守的契约；如果用户遵守了，编写算法的人就保证它给出正确的结果，而如果在使用不符合前提条件的情况下使用算法，程序员则不保证任何结果。你谈论的是契约编程，方法的调用者负责遵守前提条件。契约编程简化了代码，而使用异常处理可以帮助用户始终以正确的前提条件执行方法，但作为回报，算法必须测试前提条件是否满足。\n\
    \n上述算法的实现适用于 `long` 类型的值（参数 `n`）。如果算法还必须为 `double` 类型的值实现，人们通常会写一个方法的重写版本，如果我这里有时间，该方法测试了前提条件：\n\
    \n- 通过一个迭代 `p` 次的循环计算 `x` 的 p 次方。\n- @param x 用于幂计算的数字\n- @param p 指数\n\n# JAVA\
    \ 18: 算法与数据结构：软件开发 算法的概念\n\n```\n* @return x 的 p 次方\n* @throws Exception 如果 p\
    \ 为负数则抛出异常\npublic static double power(double x, int p) throws Exception {\n \
    \   if (p < 0) throw new Exception(\"指数不能为负数\");\n    double y = 1;\n    for (;\
    \ p > 0; --p) y *= x;\n    return y;\n}\n```\n\n在编写输入参数为简单类型的算法时，取决于程序员是否重写算法方法以确保必要的重写。在这种情况下，这是一个运行在数字上的算法，你通常需要为不同的数字类型编写重写方法，但在其他语境下，会有运行在类类型上的算法，在这里我经常会把算法写成泛型方法。请注意，这种做法在\
    \ Java 中被广泛使用。\n\n在算法的审查中（如上），我将不仅关注算法本身（即如何解决问题），还将关注算法如何在 Java 中实现。\n\n## 2.1\
    \ 算法示例\n\n下文继续关于什么是算法的讨论，以及如何使用非正式语言来公式化算法。此外，我将给出经典算法的示例。\n\n关于使用非正式语言或编程语言来编写算法，选择上并不。。像\
    \ Java 这样的现代编程语言是自自文档的，因此你通常可以像使用非正式伪代码一样，在语言本身中轻松地公式化算法。事实上，用非正式语言公式化的算法往往比用编程语言编写的相应算法长，如果是这样，当然用非正式地描述算法就没有意义了。如果你精通你的语言，你会使用该语言的术语进行同样良好的思考和公式化，许多人避免了非正式地描述算法。然而，在本书中，我想使用一些非正式语言，因为我认为至少在复杂算法中，忽略编程语言的细节而而关注算法中最重要的步骤是值得的。另一方面，你应该避免让非正式算法变得过于详细和直白，从而将非正式语言作为问题分解的技巧。你应该避免编写非正式算法，那实际上是用英语编写的程序。\n\
    \n# 算法的概念\n\n基本上，一个算法包含四个内容：\n\n- 序列：按照在算法中编写顺序执行的一系列命令/指令\n- 条件：根据某个条件执行一个或多个操作\n\
    - 循环：只要满足条件，就执行一个或多个操作\n- 执行子算法：当前算法启动另一个算法时\n\n## 差分数列\n\n通过差分数列，你应该理解一组数字\n\n\
    $a_1, a_2, a_3, \\dots, a_n$\n\n其特征是你始终通过加上相同的数字在行中向前移动，例如\n\n\n\n4, 7, 10, 13,\
    \ 16, 19, ...\n\n![](img/c51e118bfd5e98129bcc4f8937eeba18_14_0.png)\n\n每次加上 3。也可以表示为一个数字与前一个数字之间的差是常数（因此得名）：\n\
    \n```\n$a_k - a_{k-1} = d$\n```\n\n如果是这样，你可能有一个公差为 $d$ 的差分数列。差分数列的其他示例如：\n\n-\
    \ 5, 8, 11, 14, 17, 20, 23, ..., 2 + 3n, ....\n- 2, 4, 6, 8, 10, 12, ..., 2n,\
    \ ....\n- 1, 4, 6, 8, 10, 12, ..., ....\n\n如果是这样，你可能有一个公差为 $d$ 的差分数列。\n\n目标是计算差分数列的求和。为了这一点，你需要知道三件事：\n\
    \n- 首项 $a$ （从哪里）\n- 公差 $d$ （增加多少）\n- 项数 $n$ （有多少个数）\n\n该算法可以写为：\n\n```\nfor (1\
    \ to n)\n{\n  adder a to sum\n  adder d to a\n}\n```\n\n"
