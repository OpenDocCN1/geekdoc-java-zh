    # JAVA 18: ALGORITHMS AND DATA STRUCTURES: SOFTWARE DEVELOPMENT


    # FOREWORD


    The current book is the eighth in this series of books on software development
    in Java. The book requires basic knowledge about Java and system development and
    here especially knowledge of the principles of object oriented programming as
    presented in the books Java 3 and Java 4. The book focuses on algorithms and several
    classic algorithms, but in conjunction with algorithms, the primary goal is to
    introduce algorithm analysis, and then allowing the reader to be able to compare
    and evaluate the complexity of algorithms with each other. In addition, the book
    treats the classic data structures such as lists and trees and shows how data
    structures can be implemented in Java. In addition to the implementation of many
    of the classic data structures and discussing the applied algorithms, the book
    introduces several programming techniques that are useful/necessary to work as
    a professional software developer.


    As the title says this series of books deals with software development, and the
    goal is to teach the reader how to develop applications in Java. It can be learned
    by reading about the subject and by studying sample programs, but most importantly
    by yourself to do and write your own programs from scratch. An important part
    of the books is exercises and problems, where the reader has to write programs
    that correspond to the substance being treated in the text. All books in the series
    are built around the skeleton and will consist of text.


    # JAVA 18: ALGORITHMS AND DATA STRUCTURES: SOFTWARE DEVELOPMENT


    The programming language is, as mentioned Java, and besides the books use the
    following products:


    - NetBeans as IDE for application development

    - MySQL to the extent there is a need for a database server (from the book Java
    6 onwards)

    - GlassFish as a web server and application server (from the book Java 11 onwards)

    - Android Studio, that is a tool to development of mobile phones


    It is products that are free of charge and to install, and there is even talk
    about products, where the installation is progressing all by it without major
    efforts and challenges. In addition, there are on the well detailed installation
    instructions for all the products. The products are available on Windows and Linux,
    and therefore plays no special role if you use Linux or Windows.


    All sample programs are developed and tested on machines running Linux. In fact,
    it plays no major role, as both Java and other products work in exactly the same
    way whether the platform is one or the other. Some places will be in the books
    where you could see that the platform is Linux, and this applies primarily commands
    concerning the file system. Otherwise it has no meaning to the reader that programs
    are developed on a Linux machine, and they can immediately run under Windows unless
    a program refers to the file system where it may be necessary to change the name
    of a file.


    Finally a little about what the books are not. It is not "how to write" or for
    that matter reference manuals in Java, but it is the title books on software development.
    It is my hope that the reader when reading the books and through the many examples
    can find inspiration for how to write good programs, but also can be used as a
    source collection with a number of examples of solutions to concrete everyday
    programming problems that you regularly face as a software developer.

