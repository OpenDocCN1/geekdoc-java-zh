    # 2.7 PRIME NUMBERS\n\nAs another example, the following algorithm determines\
    \ whether a number is a prime number(also an algorithm that I've shown before):\n\
    \n```\nif n is 2, 3, 5 or 7 n is a prime\nif n is less than 11 or if n is even\
    \ n is not a prime\nk = 3\nwhile (k is less than or equal the square root of n)\n\
    {\n    if k divides then n n is not a prime\n    k += 2\n}\nn is a prime\n```\n\
    \nNote that the algorithm begins by processing a special case. You often see algorithms\
    \ that works today. When the special case is gone – here if the number is small\
    \ or even – you can address the general case. To find out if a number is prime,\
    \ try to find a number less than the current number that goes up. If you can,\
    \ it's not a prime, but if there is no number going up, it is prime. Due to the\
    \ special cases, it is enough to try the odd numbers (2 is the only prime). If\
    \ a divisor and the number can be written as a product n = ab, then one of the\
    \ numbers a and b will be less (or equal) to the square root of n and it is enough\
    \ to try all numbers less than or to the square root of n. The algorithm can now\
    \ be written in Java follows:\n\n```\n// Returns true if n is a prime and else\
    \ false.\npublic static boolean isPrime(long n)\n{\n    if (n == 2 || n % 3 ==\
    \ 0 || n == 5 || n == 7) return true;\n    if (n < 11 || n % 2 == 0) return false;\n\
    \    for (long k = 3, m = (long)Math.sqrt(n) + 1; k <= m; k += 2)\n        if\
    \ (n % k == 0) return false;\n    }\n    return true;\n}\n```\n\nThealgorithm\
    \ is effective, but to determine whether a number is a prime number, many divisions\
    \ are relatively required, and too large numbers, the algorithm takes a long time.\
    \ To test if an integer is a prime, accurately has a lot of practical interest,\
