    \ to the previous node\n    private DoubleNode<T> next; // pointer to the next\
    \ node\n\n    DoubleNode()\n    {\n    }\n\n    DoubleNode(T element, DoubleNode<T>\
    \ prev, DoubleNode<T> next)\n    {\n        this.element = element;\n        this.prev\
    \ = prev;\n        this.next = next;\n    }\n\n    public T getElement()\n   \
    \ {\n        return element;\n    }\n\n    public void setElement(T element)\n\
    \    {\n        this.element = element;\n    }\n\n    public DoubleNode<T> getPrev()\n\
    \    {\n        return prev;\n    }\n\n    void setPrev(DoubleNode<T> prev)\n\
    \    {\n        this.prev = prev;\n    }\n\n    public DoubleNode<T> getNext()\n\
    \    {\n        return next;\n    }\n\n    void setNext(DoubleNode<T> next) {\n\
    \        this.next = next;\n    }\n}\n```\n\n```java\npublic interface IDoubleList<T>\
    \ extends Iterable<T> {\n    public DoubleNode<T> getFirst();\n    public DoubleNode<T>\
    \ getLast();\n    public boolean isEmpty();\n    public int getSize();\n    public\
    \ void insertFirst(T elem);\n    public void insertLast(T elem);\n    public void\
    \ insertAfter(DoubleNode<T> current, T elem);\n    public void insertBefore(DoubleNode<T>\
    \ current, T elem);\n    public T removeFirst();\n}\n```\n\n![](img/c51e118bfd5e98129bcc4f8937eeba18_114_0.png)\n\
