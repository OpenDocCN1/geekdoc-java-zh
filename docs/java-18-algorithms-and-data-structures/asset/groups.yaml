- md: "\n## JAVA 18: ALGORITHMS AND DATA\n## INTRODUCTION\n\nADT stands for abstract\
    \ data types (as you can also think of generic collections), and this book primarily\
    \ deals with how classical collections such as lists, maps, etc. can be implemented\
    \ in java. Instead of collections, I would like in this book to talk about data\
    \ structures. Data structures must be implemented to be effective and therefore\
    \ algorithms play an important role, and the following will focus on both data\
    \ structures and algorithms.\n\nYou often hear that programming is difficult to\
    \ learn, which is also correct. At least there are many who give up, but it is\
    \ because many do not find programming is so exciting than it is difficult, and\
    \ in fact it has become easier than it has been. It has become easier with the\
    \ emergence of new programming languages, which can ease the work as you have\
    \ to write less, and partly results in more robust programs, because the languages\
    \ provide a much toolbox available than was previously the case. Conversely, the\
    \ requirements for the programs to be created have grown correspondingly, and\
    \ from the programmers, the challenges are the same, to be able to write a good\
    \ algorithm to solve a specific problem. All programs are not equally good written\
    \ and there are lots of examples of programs that are ineffective and solve certain\
    \ tasks in an inappropriate way and often the problem is that there has been no\
    \ focus on the algorithm, but to a much greater extent the developers have had\
    \ focus on getting the task solved without questioning of how the task was solved.\
    \ Therefore, algorithms are a key issue in programming.\n\nIn fact, I should have\
    \ started my history of programming with algorithms, as that is what is all about.\
    \ One should be good at algorithms to be a good programmer, but it does not work\
    \ alone and another thing is motivation, the desire to work with programming and\
    \ software development. You can learn about algorithms and methods, but you cannot\
    \ write finished programs that can run on a machine without having a programming\
    \ language. Therefore, most entries to the programming and software development\
    \ start with the language, and you quickly get ready to write completed programs.\
    \ Most people want to quickly \"put your fingers on the keys\" and write programs\
    \ that make something interesting.\n\nAs mentioned, a data structure is just another\
    \ name for a collection class. In addition to algorithms, the aim of the following\
    \ is to explain the classic classes, but also to implement them as finished classes\
    \ written in Java. You can ask why you do not need to do that, when they already\
    \ exist as finished and tested classes, and there are two reasons for that. Firstly,\
    \ it is important to know how classes are made, so that you know how the classes'\
    \ methods works in principle and have the characteristics that the documentation\
    \ describes. Only with that knowledge available you are in practice to make the\
    \ right choices and choose the collection class that best suits the algorithm\
    \ to be written. Another reason for dealing with the implementation of classical\
    \ collection classes, I also want to mention that studying these implementations\
    \ introduces some techniques and methods that are important for practical programming.\
    \ It is thus important to emphasize that it is not the goal of writing a new collection\
    \ API and collection classes that will replace the classes that come as part of\
    \ Java, but the goal is to explain how these classes are in principle implemented\
    \ and by doing so, apply some techniques that are useful/necessary to master as\
    \ a professional developer.\n\nSince many of the data structures and also the\
    \ examples that will illustrate the applications of both algorithms and data structures\
    \ make up a lot, I have included a part of the code in the text of the book. In\
    \ order to get the most out of it, therefore, like the other books in this series,\
    \ it is important that you also study the finished programs, and especially how\
    \ the data structures are implemented in Java. The most important algorithms and\
    \ data structures have been added to a class library called palib, and this library\
    \ is used by the book's examples.\n\nThe book is generally divided into two parts,\
    \ the first part deals with algorithms, while the other part deals with data structures,\
    \ but since the implementation of data structures is just about algorithms, one\
    \ can also think of the entire book as a book on algorithms.\n\nThe goal of the\
    \ first part about algorithms (the next 4 chapters) is to provide examples of\
    \ some classic algorithms, including special algorithms for search and sorting.\
    \ In addition, an introduction is given to ensure how an algorithm is correct\
    \ and gives the right result, as well as an introduction to how to evaluate the\
    \ effectiveness of algorithms in relation to each other.\n\nThe second part of\
    \ the book comprises 5 chapters and deals with data structures and collection\
    \ classes, the most important of which is the implementation of lists and trees\
    \ and in connection therewith a variety of algorithms. The implementation of some\
    \ of these data structures is both complex and comprehensive, and the book primarily\
    \ describes the principles, while the code must be searched in the book's source\
    \ files.\n\nThe source code, like the other books, contains a number of examples,\
    \ but the largest part is implementations of algorithms and data structures collected\
    \ in the class library called palib, and most of the examples use this library.\
    \ The same goes for most of the book's exercises and tasks.\n\n## THE CONCEPT\
    \ OF ALGORITHMS\n\nAn algorithm is a method that describes how to solve a problem\
    \ through a final number of steps, and an algorithm is a solution that – usually\
    \ from an input – solves a specific problem. Algorithms are formulated in an algorithm\
    \ language where they can be expressed in a short and accurate way. A programming\
    \ language is an example of an algorithm language, but it may be easier to use\
    \ a simpler language to be free from the many details of the programming language.\
    \ In addition, algorithms have a common nature in which a whole family of algorithms\
    \ can be described from a template. In addition to the programming language Java,\
    \ this book does not use a formal algorithm language, but instead algorithms are\
    \ sometimes described informally in a middle between common language and Java\
    \ program code. In the following, I will typically describe algorithms informally\
    \ using a common language and subsequently finished algorithms in Java.\n\nAs\
    \ an example of an algorithm, I will look at an algorithm that raises a number\
    \ $n$ in the power of $p$ – thus calculating $n^p$. This task (algorithm) can\
    \ be described as follows:\n\n```\nu = 1\nwhile (p > 0)\n{\n  u = u * n\n  --\n\
    }\nreturn u\n```\n\nThe above is the informal version where the algorithm partially\
    \ is written in Java, but I have not fully complied with the syntax of the language.\
    \ The aim is to describe the solution method, without having to deal with the\
    \ many details of the programming language, and if you know a little about programming\
    \ and Java, it is easy to understand what the above algorithm is doing.\n\nFor\
    \ all algorithms, you have to answer two questions:\n\n- do it solve that task\
    \ – is the algorithm correct?\n- how good is the algorithm?\n\nIf $p$ is of course\
    \ a requirement, while the other is a matter of quality.\n\nIf $p$ is negative,\
    \ the algorithm gives result 1 (the loop will not be executed), which is incorrect.\
    \ If $p$ is 0, the result is 1, which is correct. If $p$ is positive, the loop\
    \ is performed, and for every iteration $p$ is decremented with 1 and the loop\
    \ will be exactly repeated $p$ times. For each repeat, $u$ is multiplied by $n$\
    \ and $u$ from start is 1, the value of $u$ – when the loop stops – is $n$ multiplied\
    \ by itself $p$ times and thus has the value $n^p$. That is that the algorithm\
    \ gives the correct result, assuming that $p$ is not negative. We see that $p\
    \ \\ge 0$ is a precondition.\n\nWith regard to the quality of the algorithm, it\
    \ is a goal that the algorithm should use as few resources as possible:\n\n- that\
