    ![](img/c51e118bfd5e98129bcc4f8937eeba18_29_0.png)\n\n# JAVA 18: ALGORITHMS AND\
    \ DATA STRUCTURES: SOFTWARE DEVELOPMENT THE CONCEPT OF ALGORITHMS\n\nTo show that\
