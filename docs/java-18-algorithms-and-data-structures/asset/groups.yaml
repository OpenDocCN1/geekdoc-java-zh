  mdcn: "\n\n# JAVA 18: 算法与数据结构：软件开发\n\n## 排序\n\n```java\nstatic boolean binSearch(int\
    \ []tal, int a, int b, int x) {\n  // 如果问题是简单的，则解为空\n  if (b < a) return false;\n\
    \  // 分治问题\n  int m = (a + b) / 2;\n  // 解决第一个子问题\n  if (x == tal[m]) return true;\n\
    \  // 解决并处理其他问题\n  return x < tal[m] ? binSearch(tal, a, m-1, b, x);\n}\n```\n\
    \n此外，归并排序是分治法模板编写的算法示例。待排序数组被划分为更小的数组，直到排序变得简单（当数组只有一个元素时）。子数组通过合并来组合。工作量在于合并，而将数组划分为子数组只是恰当移动索引的问题。\n\
    \n我想展示另一种基于分治法的排序方法。假设你需要对以下数组进行排序：\n\n![](img/c51e118bfd5e98129bcc4f8937eeba18_87_0.png)\n\
    \n| 23 | 12 | 45 | 33 | 55 | 11 | 19 | 56 | 41 | 29 | 33 | 15 | 10 | 25 | 35 |\n\
    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| k | i | |\
    \ | | | | | | | | | | | j | |\n\n该方法是选择一个元素（例如第一个），然后围绕该元素划分数组：只要第 $i$ 个元素小于第\
    \ $k$ 个元素，就向右移动一步；只要第 $i$ 个元素大于第 $k$ 个元素，就向左移动一步：\n\n| 23 | 12 | 45 | 33 | 55\
    \ | 11 | 19 | 56 | 41 | 29 | 33 | 15 | 10 | 25 | 35 |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n\
    | k | i | | | | | | | | | | | | | j | |\n\n现在交换第 $i$ 个元素和第 $j$ 个元素：\n\n| 23 |\
    \ 12 | 10 | 33 | 55 | 11 | 19 | 56 | 41 | 29 | 33 | 15 | 45 | 25 | 35 | | |\n\
    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n| k | i\
    \ | | | | | | | | | | | | j | | | |\n\n$i$ 和 $j$ 再次根据相同的规则移动：\n\n| 23 | 12 | 10\
    \ | 33 | 55 | 11 | 19 | 56 | 41 | 29 | 33 | 15 | 45 | 25 | 35 | | |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n\
    | k | i | | | | | | | | | | | | j | | | |\n\n并交换第 $i$ 个元素和第 $j$ 个元素：\n\n| 23 |\
    \ 12 | 10 | 15 | 55 | 11 | 19 | 56 | 41 | 29 | 33 | 34 | 45 | 25 | 35 | | |\n\
    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n\
    | k | i | | | | | | | | | | | j | | | | | |\n\n$i$ 和 $j$ 再次移动：\n\n| 23 | 12 |\
    \ 10 | 15 | 55 | 11 | 19 | 56 | 41 | 29 | 33 | 34 | 45 | 25 | 35 | | |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n\
    | k | i | | | | | | | | j | | | | | | | | |\n\n然后交换元素：\n\n![](img/c51e118bfd5e98129bcc4f8937eeba18_89_0.png)\n\
    \n$i$ 和 $j$ 再次移动，仍遵循相同的规则，但当 $j$ 小于 $i$ 时停止：\n\n![](img/c51e118bfd5e98129bcc4f8937eeba18_89_1.png)\n\
    \n最后交换第 $k$ 个元素和第 $j$ 个元素：\n\n![](img/c51e118bfd5e98129bcc4f8937eeba18_89_2.png)\n\
    \n数组尚未排序，但 23 左侧的所有数字都小于 23，而 23 右侧的所有数字都大于 23。也就是说，23 处于正确的位置。问题也被分分成了两个较小的子问题，即对数组的左部分和右部分进行排序。如果你按照相同的原则划分左部分，你需要围绕\
    \ 11 进行划分：\n\n![](img/c51e118bfd5e98129bcc4f8937eeba18_89_3.png)\n\n一旦完成，11 就到位了，你得到了两个子数组，其中左侧只有一个元素——这是一个简单的问题——右侧有三个元素。在这三个元素上重复该方法，但由于该子数组已经排序，所以什么都不会发生。现在原始数组的右部分也必须按照相同的原则排序：\n\
    \n![](img/c51e118bfd5e98129bcc4f8937eeba18_89_4.png)\n\n最终数组排序如下：\n\n| 10 | 11\
    \ | 12 | 15 | 23 | 25 | 29 | 33 | 41 | 45 | 55 | 56 |\n\n*快速排序*。它的复杂度取决于你选择基元的运气。如果你运气好，问题每次被分为两个子问题，子问题的长度减半，这与\
    \ $\\log n$ 成比例。如果数组已经排序，使用第一个元素作为基元会导致左部分几乎为空，划分次数为 $n$，结果的复杂度最坏为 $O(n^2)$，与简单排序方法相同。假设数组是随机的，划分出的子问题大小相近，平均复杂度为\
    \ $O(n \\log n)$。快速排序背后的思想是确定数组中的第 $k$ 小元素：\n\n![](img/c51e118bfd5e98129bcc4f8937eeba18_90_0.png)\n\
    \n快速排序通常是实践中常用的良好的排序方法。如上所述，其递归实现如下：\n\n```java\npublic static <T extends Comparable<T>>\
    \ void quickSort(T[] t) {\n    quickSort(t, 0, t.length - 1);\n}\n\nprivate static\
    \ <T extends Comparable<T>> void quickSort(T[] arr, int a, int b) {\n    if (a\
    \ < b) {\n        int p = partition(arr, a, b);\n        quickSort(arr, a, p -\
    \ 1);\n        quickSort(arr, p + 1, b);\n    }\n}\n```\n\n## 问题 2：排序方法\n\n在这个任务中，你应该测试本章讨论的排序方法并检查它们是否排序正确。首先，你必须创建一个随机数组并测试排序需要多长时间。结果如下：\n\
