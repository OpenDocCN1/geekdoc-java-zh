    # JAVA 18：算法与数据结构：软件开发


    # 算法分析


    基本上关于 CPU 时间和内存，这两者是始终受限的资源。从原则上讲，你可以为机器配备更快的 CPU 并增加机器的内存，但无论如何这无法解决算法低效的问题。然而，现代机器拥有如此多的内存，以至于内存太少是一件稀事（至少当你谈论普通个人电脑时），而且你通常认为
    CPU 是一个更具限制性的资源。对于算法而言，重点主要在于编写能够尽可能利用 CPU 的算法，也就是说让算法和执行的程序运行越快越好。人们说，算法必须具有最优的时间复杂度。


    如果你写了一个程序，你可以通过时钟来测量它的时间复杂度，从而发现执行一个算法需要多长时间，这在实践中显然是有意义的，至少与之相关。然而，人们应该意识到，这种计时取决于执行算法的机器，而且在许多语境下，评估算法的整体性质并与算法关联一个函数表达式（该表达式可以以某种方式或另一种方式表征其效率）更有趣——至少在这方面，因为你能够以更大程度上对算法之间进行比较。


    # 3.1 线性搜索的复杂度


    为了展示算法分析的意义，我将查看上面讨论过的算法——线性搜索。但最好的情况下，搜索的元素在第一次比较时就被找到了。如果是这样，执行时间——也称为其时间复杂度——与数组的大小无关。人们说该算法的最佳复杂度是常数。最佳时间复杂度不取决于搜索的是哪个数组，而且每次都是相同的。我们写作最佳时间复杂度为
    O(1)，读作“big o of I”。


    在最坏情况下，你会与数组中的所有元素进行比较，如果数组有 N 个元素，你必须执行 N 次操作，其中一次操作是将元素与该情况下某个特定位置的元素进行比较。执行时间取决于数组的大小，因此执行时间随线性函数增长（从而也是该算法名称的由来）。人们说最坏时间复杂度与数组大小呈线性关系，即
    O(N) —— 读作“big o of N”。它表示最坏执行时间表现为数组长度的线性函数。


    如果你不知道数组中包含哪些元素，你应该搜索数组的一半——你无法知道你正在寻找的元素是在开头还是末尾——如果你有一个有 N 个元素的数组，你必须预计执行 vN
    操作。这仍然是数组大小的线性函数（增长较小），因此算法的平均时间复杂度为 O(N)。


    上述是对算法时间复杂度的分析，得出了三种复杂度：


    - 最佳时间复杂度：O(1)

    - 平均时间复杂度：O(N)

    - 最坏时间复杂度：O(N)


    需要注意的是，复杂度衡量并没有规定关于算法执行时间的具体数字，以及执行相应程序需要多长时间，它只是告诉你算法如何作为一个或多个输入参数（这里是数组大小）的函数表现。复杂度衡量可以用于比较算法，并确定解决某个问题的算法是否优于另一个算法。


    算法的执行时间自然取决于上述分析之外的其它因素。例如，时间被用于传输参数和创建变量，但所有这些都是具有恒定时间量且不取决于数组的大小。它不会改变算法对于不同输入参数大小时行为的总体原理。还有影响执行时间的环境条件，这些是由执行算法的计算机决定的。在这里，有
    CPU、总线和内存芯片，但这些都是非常具体的联系，与当前算法无关，也没有可以用于比较算法的关系。


    具体来说，上述分析显示，在某些情况下，执行算法的成本更高，取决于算法的性质。


    # 3.2 二分搜索的复杂度


    算法是一种解决问题的方法。如果你不知道数组中包含哪些元素，你应该搜索数组的一半——你无法知道你正在寻找的元素是在开头还是末尾——如果你有一个有 N 个元素的数组，你必须预计执行
    vN 操作。这仍然是数组大小的线性函数（增长较小），因此算法的平均时间复杂度为 O(N)。


    上述是对算法时间复杂度的分析，得出了三种复杂度：


    - 最佳时间复杂度：O(1)

    - 平均时间复杂度：O(N)

    - 最坏时间复杂度：O(N)


    需要注意的是，复杂度衡量并没有规定关于算法执行时间的具体数字，以及执行相应程序需要多长时间，它只是告诉你算法如何作为一个或多个输入参数（这里是数组大小）的函数表现。复杂度衡量可以用于比较算法，并确定解决某个问题的算法是否优于另一个算法。


    '
