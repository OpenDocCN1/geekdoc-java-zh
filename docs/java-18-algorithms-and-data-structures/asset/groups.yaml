    # JAVA 18：算法与数据结构：软件开发


    # 前言


    本书是 Java 软件开发系列丛中的第八本。本书要求具备 Java 和系统开发的基础知识，特别是掌握如《Java 3》和《Java 4》中所述的面向对象编程原理。本书重点关注算法和几种经典算法，但结合算法，首要目标是介绍算法分析，并让读者能够比较和评估算法。此外，书中介绍了列表和树等经典数据结构，并展示了如何在
    Java 中实现它们。


    正如标题所示，该系列书籍涉及软件开发，目标是教读者如何使用 Java 开发。书中的一个重要部分是练习和问题，读者需要根据书中内容编写程序。该系列书籍围绕核心内容构建，并由文本组成。


    # JAVA 18：算法与数据结构：软件开发


    编程语言如前所述为 Java，此外书中还使用了以下产品：


    - NetBeans：用于应用程序开发的 IDE

    - MySQL：在需要数据库服务器时（从 Java 6 版开始）

    - GlassFish：作为 Web 服务器和应用服务器（从 Java 11 版开始）

    - Android Studio：用于手机开发的工具


    这些产品都是免费且可安装的，书中还讨论了这些产品，如何在没有重大困难和挑战的情况下完成安装。此外，书中为所有产品提供了详细的安装说明。这些产品支持 Windows
    和 Linux，因此无论你使用哪种系统，都没有特殊要求。


    所有示例程序都在运行 Linux 的机器上开发和测试。事实上，这并没有什么重大影响，因为 Java 和其他产品在上述两个平台上的工作方式是完全相同的。书中某些地方可能会显示平台是
    Linux，这主要适用于涉及文件系统的命令。否则，对于读者来说，程序在 Linux 机器上开发并没有意义，除非程序引用文件系统（此时在 Windows 下可能需要更改文件名），否则它们可以直接运行。


    最后简要说明这些书籍不是什么。它们不是“如何编写”的教程，也不是 Java 的参考手册，而是如其名所示的关于软件开发的书籍。我希望读者在阅读书籍并学习许多示例时能够获得编写良好程序的灵感，同时也可以作为解决方案集合，提供许多作为软件开发人员经常面对的具体日常编程问题的示例。


