    如果我们使用链法，数组将变成一个链表的数组。当发生冲突时，我们只需将新对象添加到该索引的列表即可。这实现简单，但如果列表变长，性能可能会变差。


    如果我们使用开放寻法，我们在数组中寻找另一个空槽。一种常用方法是线性探测，即检查下一个槽位（index+1, index+2, 等），直到找到空槽为止。另一种方法是二次探测，它使用二次序列来寻找下一个槽位。还有双重哈希，它使用第二个哈希函数来确定步长。


    冲突解决的选择取决于数据的特征和应用程序的性能需求。例如，当内存不紧张时，通常倾向于链法；而如果数组不是太满，开放寻法可能更缓存缓存。


