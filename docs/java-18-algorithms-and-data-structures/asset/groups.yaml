    \n- 1. `enqueue()` 在队列末尾插入元素——在 `tail` 指向的元素之后\n- 2. `dequeue()` 移除队列中的第一个或最旧的元素——`head`\
    \ 指向的元素\n\n此外，队列可以实现为 `Buffer<T>`。这样做，队列在创建时通过设置缓冲区的大小就具有一个容量。队列并不总是建议或希望具有固定大小，如果不是，那么使用数组实现队列将很困难，但使用链表进行上述操作允许你根据需要扩展队列，使得插入和删除都具有常数复杂度。队列可以定义为：\n\
