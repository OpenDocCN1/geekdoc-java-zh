  md: "\nRemoval also requires checking the boundary case where there is but a single\
    \ element in the circular linked-list. Then we must clear the list entirely.\n\
    \n# Listing 2.8: Remove from a Circular Linked-List\n\n```\nNode circular_remove(Node\
    \ head, Node target) {\n  if (null == head\n  || (head == target && head.next\
    \ == target)) {\n    return null;\n  }\n  Node next = target.next;\n  target.data\
    \ = next.data;\n  target.next = next.next;\n  return target;\n}\n```\n\n## 2.4\
    \ Doubly linked-lists\n\nDoubly linked-lists are lists in which each node has\
    \ both a reference to the next element in the list as well as the previous element\
    \ in the list. A simple doubly linked-list has a head with null as its prev member,\
    \ and a tail with null its next member. Doubly linked-lists can also be circular,\
    \ with single element lists having both the head and tail referencing the same\
    \ node. In the following examples we implement circular doubly linked-lists.\n\
    \nThe constructor for a doubly linked-list is only a simple modification of a\
    \ simple linked-list Node where a prev member variable is added.\n\n# Listing\
    \ 2.9: Doubly Linked-List Node\n\n```\nDllNode {\n  DllNode prev;\n  DllNode next;\n\
    \  int data;\n}\n\nDNode(int data) {\n  this(null, null, data);\n}\n\nDllNode(DllNode\
    \ prev, DllNode next, int data) {\n  this.prev = prev == null ? this : prev;\n\
    \  this.next = next == null ? this : next;\n  this.data = data;\n}\n```\n\nInserting\
    \ and removing from a circular doubly linked-list integrates inserting into a\
    \ standard linked-list and the semantics of a circular linked-list. The implementation\
    \ below pushes the list forward and inserts a new head. This is done by first\
    \ setting the next and prev members appropriately, and then correcting the list\
    \ structure before returning.\n\n# Listing 2.10: Insert into a Doubly Linked-List\n\
    \n```\nDllNode insert(DllNode head, int data) {\n  if (null == head) {\n    return\
    \ new DllNode(data);\n  }\n  DllNode insertion =\n  new DllNode(head.prev, head,\
    \ data);\n  insertion.prev.next = insertion;\n  insertion.next.prev = insertion;\n\
    \  return insertion;\n}\n```\n\nThe find operation for a doubly linked-list is\
    \ identical to that of the find operation for a circular linked-list, aside from\
    \ the parameter and return type. The previous code will operate on doubly linked-lists\
    \ with only modification.\n\n# Listing 2.11: Find in a Doubly Linked-List\n\n\
    ```\nDllNode find(DllNode head, int value) {\n  DllNode current = head;\n  while\
    \ (null != current\n  && current.data != value) {\n    current = current.next;\n\
    \    if (current.data == head.data) {\n      return null;\n    }\n  }\n  return\
    \ current;\n}\n```\n\nRemoval from a circular doubly linked-list is simpler than\
    \ that of a simple linked-list. This is because each node of doubly linked-list\
    \ has a reference to its previous element. This makes splicing a node out of a\
    \ doubly linked-list trivial, where in a simple linked-list we needed to remove\
    \ the next node and swap data values.\n\n# Listing 2.12: Remove from a Doubly\
    \ Linked-List\n\n```\nDllNode remove(DllNode head, DllNode target) {\n  if (head.next\
    \ == head\n  && head == target) {\n    return null;\n  }\n  target.prev.next =\
    \ target.next;\n  target.next.prev = target.prev;\n  if (head == target) {\n \
    \   head = target.next;\n  }\n  return head;\n}\n```\n\n## 2.5 Selection\n\nSince\
    \ a linked-list is unordered and does not support random access, the question\
    \ of finding the value at interesting positions within the list requires clever\
    \ solutions. These are called selection problems. To begin, consider finding the\
    \ middle element of a linked-list. A straightforward method is to count the number\
    \ of elements and then scan for the element at that index.\n\n# Listing 2.13:\
    \ Find the Midpoint of a Linked-List by Counting\n\n```\nNode mid_by_counting(Node\
    \ head) {\n  if (null == head) {\n    return head;\n  }\n  Node trailing = head;\n\
    \  int size = 0;\n  while (null != head) {\n    size++;\n    head = head.next;\n\
    \  }\n  int mid = size / 2;\n  while (mid-- != 0) {\n    trailing = trailing.next;\n\
    \  }\n  return trailing;\n}\n```\n\nThis operation obviously requires one and\
    \ a half scans of the list. But we can do better. Consider what happens when we\
    \ move two indices through the list in tandem. Concretely, we move one node at\
    \ a time and another at a time. When the first index is at x, the second reference\
    \ is at position 2x. So when the second node reaches the end, the first reference\
    \ is at the midpoint. Indeed, we can do this with a single scan.\n\n# Listing\
    \ 2.14: Find the Midpoint of Linked-List\n\n```\nNode mid(Node head) {\n  Node\
    \ trailing = head;\n  while (null != head) {\n    head = head.next;\n    if (null\
    \ != head) {\n      head = head.next;\n    }\n    trailing = trailing.next;\n\
    \  }\n  return trailing;\n}\n```\n\nThis trick can be generalized to find any\
    \ element at some fraction of the length. So for any k we can find the element\
    \ at position length/k. But often the question is finding the element at position\
    \ k from the end. We can find the node at position k from the end of the list\
    \ by modifying the trick above to move two references in tandem, but start with\
    \ k.\n\n# Listing 2.15: Find the Node k from the End\n\n```\nNode kth_from_end(Node\
    \ head, int k) {\n  Node trailing = head;\n  while (k > 0 && null != head) {\n\
    \    head = head.next;\n  }\n  while (null != head.next) {\n    trailing = trailing.next;\n\
    \  }\n  return trailing;\n}\n```\n\n## 2.6 Modifications\n\nAlong selection, lack\
    \ of random access gives rise to a number of problems that ask for modifications\
    \ of a list. The most basic is the removal of all nodes matching a value. The\
    \ only modification required of the remove method is to maintain the current scan\
    \ position to continue iterating after a node has been removed. Maintaining a\
    \ trailing reference and removing nodes that match the value can accomplish this.\
    \ In this approach, care must be taken to remove all nodes that match the value,\
    \ else successive matches will not be handled correctly. In the implementation,\
    \ successive matches are handled by the while loop below.\n\n# Listing 2.16: Remove\
    \ Values from a Linked-List\n\n```\nNode remove_values(Node head, int value) {\n\
    \  while (head != null && head.data == value) {\n    head = head.next;\n  }\n\
    \  if (head == null) {\n    return null;\n  }\n  Node current = head;\n  while\
    \ (null != current.next) {\n    if (current.next.data == value) {\n      current.next\
    \ = current.next.next;\n    }\n    current = current.next;\n  }\n  return head;\n\
    }\n```\n\nOnly a bit more complex is the issue of reversing the order of the nodes\
    \ in a linked-list. In a linked-list, this can be done without constructing a\
    \ new list by maintaining the current scan position while simultaneously modifying\
    \ the node scanned. As the algorithm iterates over the list, it is reversing the\
    \ successor-predecessor relationships. After full iteration, the list is reversed.\n\
    \n# Listing 2.17: Reverse a Linked-List\n\n```\nreverse(Node head) {\n  Node prev\
    \ = null;\n  while (null != head) {\n    Node temp = head.next;\n    head.next\
    \ = prev;\n    prev = head;\n    head = temp;\n  }\n  return prev;\n}\n```\n\n\
    Reversing a circular doubly linked-list can be done with the same technique. As\
    \ is usual with circular linked-lists we must keep track of the terminal condition.\n\
    \n# Listing 2.18: Reverse a Doubly Linked-List\n\n```\nreverse(DllNode head) {\n\
    \  if (null == head) {\n    return null;\n  }\n  if (head.next == head.prev) {\n\
    \    return head;\n  }\n  DllNode tail = head;\n  do {\n    DllNode temp = tail.next;\n\
    \    tail.next = tail.prev;\n    tail.prev = temp;\n    tail = temp;\n  } while\
    \ (tail.data != head.data);\n  return head;\n}\n```\n\n## 2.7 Multiple lists\n\
    \nMany problems require working with multiple lists simultaneously.\n\nAbove,\
    \ we saw how we can find the midpoint of a list by moving two references in tandem.\
    \ Using the same idea we can solve the problem of comparing two lists with a single\
    \ pass over each. Comparison is only difficult in that there is no random access.\
    \ We use multiple references, for each list in question.\n\nWe first check that\
    \ lists are either empty or not empty. Afterward, we take it in turns to compare\
    \ each element.\n\n# Listing 2.19: Compare Linked-Lists\n\n```\nboolean equals(Node\
    \ x, Node y) {\n  while (null != x && null != y) {\n    if (x.data != y.data)\
    \ {\n      return false;\n    }\n    x = x.next;\n    y = y.next;\n  }\n  return\
    \ null;\n}\n```\n\nThe listing above compares two lists, but can easily be generalized\
    \ to compare an arbitrary number simultaneously.\n\nThe other common operation\
    \ on multiple-lists is merging, in which two or more lists become one. Since linked-lists\
    \ are dynamically bound, merging two linked-lists can be done without the allocation\
    \ of any new memory. A naive method to merge is to append one list to another\
    \ by iteratively walking one list and inserting each node into the other. This\
    \ method requires as many writes as there are elements in the list.\n\nWe can\
    \ do better. We only append one list to another, as in the listing below. Appending\
    \ in this manner is a single write operation, although one list must be read to\
    \ the end.\n\n# Listing 2.20: Merge Two Linked-Lists\n\n```\nNode merge(Node h1,\
    \ Node h2) {\n  if (null == h1 || null == h2) {\n    return (null != h1) ? h1\
    \ : h2;\n  }\n  Node head = h1;\n  while (null != h1.next) {\n    h1 = h1.next;\n\
    \  }\n  h1.next = h2;\n}\n```\n"
  mdcn: "\n删除操作还需要检查循环链表中只有一个元素的边界情况。这时，我们必须清空整个列表。\n\n# 列表 2.8: 从循环链表中删除\n\n```\n\
    Node circular_remove(Node head, Node target) {\n  if (null == head\n  || (head\
    \ == target && head.next == target)) {\n    return null;\n  }\n  Node next = target.next;\n\
    \  target.data = next.data;\n  target.next = next.next;\n  return target;\n}\n\
    ```\n\n## 2.4 双向链表\n\n双向链表是每个节点都包含指向列表中下一个元素和上一个元素引用的列表。简单的双向链表有一个 `prev` 成员为\
    \ `null` 的头部和一个 `next` 成员为 `null` 的尾部。双向链表也可以是循环的，单元素列表的头尾指向同一个节点。在下面的示例中，我们实现了循环双向链表。\n\
    \n双向链表的构造函数是对简单链表 Node 的简单修改，增加了一个 `prev` 成员变量。\n\n# 列表 2.9: 双向链表节点\n\n```\nDllNode\
    \ {\n  DllNode prev;\n  DllNode next;\n  int data;\n}\n\nDNode(int data) {\n \
    \ this(null, null, data);\n}\n\nDllNode(DllNode prev, DllNode next, int data)\
    \ {\n  this.prev = prev == null ? this : prev;\n  this.next = next == null ? this\
    \ : next;\n  this.data = data;\n}\n```\n\n在循环双向链表中进行插入和删除，是将标准链表的插入操作与循环链表的语义结合了起来。下面的实现将列表向前推并插入一个新的头部。这是通过首先适当地设置\
    \ `next` 和 `prev` 成员，然后在返回之前修正列表结构来实现。\n\n# 列表 2.10: 向双向链表插入\n\n```\nDllNode insert(DllNode\
    \ head, int data) {\n  if (null == head) {\n    return new DllNode(data);\n  }\n\
    \  DllNode insertion =\n  new DllNode(head.prev, head, data);\n  insertion.prev.next\
    \ = insertion;\n  insertion.next.prev = insertion;\n  return insertion;\n}\n```\n\
    \n双向链表的 `find` 操作与循环链表的 `find` 操作相同，仅参数和返回类型不同。之前的代码仅需修改即可运行在双向链表上。\n\n# 列表 2.11:\
    \ 在双向链表中查找\n\n```\nDllNode find(DllNode head, int value) {\n  DllNode current\
    \ = head;\n  while (null != current\n  && current.data != value) {\n    current\
    \ = current.next;\n    if (current.data == head.data) {\n      return null;\n\
    \    }\n  }\n  return current;\n}\n```\n\n从循环双向链表中删除元素比简单链表更简单。这是因为双向链表的每个节点都有指向其前一个元素的引用。这使得从双向链表中剔出一个节点变得轻而易举，而在简单链表中，我们需要删除下一个节点并交换数据值。\n\
    \n# 列表 2.12: 从双向链表中删除\n\n```\nDllNode remove(DllNode head, DllNode target) {\n\
    \  if (head.next == head\n  && head == target) {\n    return null;\n  }\n  target.prev.next\
    \ = target.next;\n  target.next.prev = target.prev;\n  if (head == target) {\n\
    \    head = target.next;\n  }\n  return head;\n}\n```\n\n## 2.5 选择\n\n由于链表是无序的且不支持随机访问，在列表中查找特定位置的值需要巧妙的解决方案。这些被称为选择问题。首先，考虑寻找链表的中点。一种直接的方法是统计元素的个数，然后扫描到该索引位置。\n\
    \n# 列表 2.13: 通过计数查找链表中点\n\n```\nNode mid_by_counting(Node head) {\n  if (null\
    \ == head) {\n    return head;\n  }\n  Node trailing = head;\n  int size = 0;\n\
    \  while (null != head) {\n    size++;\n    head = head.next;\n  }\n  int mid\
    \ = size / 2;\n  while (mid-- != 0) {\n    trailing = trailing.next;\n  }\n  return\
    \ trailing;\n}\n```\n\n这种操作显然需要对列表进行半扫描。但我们可以做得更好。考虑当我们同步移动两个索引时的情况。具体来说，我们每次移动一个节点，同时移动另一个。当第一个索引位于\
    \ `x` 时，第二个引用位于 `2x` 位置。因此，当第二个引用到达末尾时，第一个引用位于中点。实际上我们可以通过一次扫描来实现。\n\n# 列表 2.14:\
    \ 查找链表中点\n\n```\nNode mid(Node head) {\n  Node trailing = head;\n  while (null\
    \ != head) {\n    head = head.next;\n    if (null != head) {\n      head = head.next;\n\
    \    }\n    trailing = trailing.next;\n  }\n  return trailing;\n}\n```\n\n这个技巧可以推广到查找长度任意比例的元素。因此，对于任何\
    \ `k`，我们可以找到 `length/k` 位置的元素。但通常的问题是找到倒数第 `k` 个元素。我们可以通过修改上面的技巧（同步移动两个引用但从 `k`\
    \ 开始）来找到列表倒数第 `k` 个节点。\n\n# 列表 2.15: 找到倒数第 k 个节点\n\n```\nNode kth_from_end(Node\
    \ head, int k) {\n  Node trailing = head;\n  while (k > 0 && null != head) {\n\
    \    head = head.next;\n  }\n  while (null != head.next) {\n    trailing = trailing.next;\n\
    \  }\n  return trailing;\n}\n```\n\n## 2.6 修改\n\n与选择类似，缺乏随机访问产生许多修改列表的问题。最基本的是删除所有匹配值的节点。`remove`\
    \ 方法唯一需要的修改是在删除节点后维护当前的扫描位置以继续迭代。维护一个尾部引用并删除匹配值的节点可以实现这一点。在这种方法中，必须注意删除所有匹配值的节点，否则连续匹配将无法正确处理。在下面的实现中，连续匹配通过\
    \ `while` 循环进行处理。\n\n# 列表 2.16: 从链表中删除值\n\n```\nNode remove_values(Node head,\
    \ int value) {\n  while (head != null && head.data == value) {\n    head = head.next;\n\
    \  }\n  if (head == null) {\n    return null;\n  }\n  Node current = head;\n \
    \ while (null != current.next) {\n    if (current.next.data == value) {\n    \
    \  current.next = current.next.next;\n    }\n    current = current.next;\n  }\n\
    \  return head;\n}\n```\n\n稍微复杂一点的是反转链表节点顺序的问题。在链表中，可以通过维护当前扫描位置的同时修改被扫描节点来实现，无需构建新列表。当算法遍历列表时，它正在反转后继-前驱关系。在完全迭代后，列表被反转了。\n\
    \n# 列表 2.17: 反转链表\n\n```\nreverse(Node head) {\n  Node prev = null;\n  while (null\
    \ != head) {\n    Node temp = head.next;\n    head.next = prev;\n    prev = head;\n\
    \    head = temp;\n  }\n  return prev;\n}\n```\n\n反转循环双向链表可以使用相同的技术实现。像循环链表一样，我们必须跟踪终止条件。\n\
    \n# 列表 2.18: 反转双向链表\n\n```\nreverse(DllNode head) {\n  if (null == head) {\n \
    \   return null;\n  }\n  if (head.next == head.prev) {\n    return head;\n  }\n\
    \  DllNode tail = head;\n  do {\n    DllNode temp = tail.next;\n    tail.next\
    \ = tail.prev;\n    tail.prev = temp;\n    tail = temp;\n  } while (tail.data\
    \ != head.data);\n  return head;\n}\n```\n\n## 2.7 多列表\n\n许多问题需要同时处理多个列表。\n\n\
    上面我们看到了如何通过同步移动两个引用来找到列表的中点。使用相同的思路，我们可以通过对每个列表进行一次遍历来解决两个列表的问题。比较的困难在于不支持随机访问。我们为每个相关的列表使用多个引用。\n\
    \n我们首先检查列表为空或非空。之后，我们轮流比较每个元素。\n\n# 列表 2.19: 比较链表\n\n```\nboolean equals(Node\
    \ x, Node y) {\n  while (null != x && null != y) {\n    if (x.data != y.data)\
