    # # Chapter 1

    The Technical Interview


    For both sides of an interview there is an art. The art is at its best when, at
    the end of an hour, both parties leave the interview feeling they have spent a
    productive hour. For the interviewer, it is asking a challenging but tractable
    question and working with the candidate to find an optimal solution. It is making
    the candidate feel welcome, valued, and excited to be offered an opportunity to
    work alongside others who have a passion for technology. And it is being comfortable
    in the decision to give the candidate a hire or no hire.


    But of course the candidate has a more complicated role. Even so it is simple
    to state what must be done; one must be friendly, straightforward, and know your
    fundamentals. There is not much else you can do to prepare for an interview.


    The main purpose of this book is to provide a refresher for the fundamentals of
    programming that come up in technical interviews. We do this by presenting interview
    questions that have been asked in the field, and answering them in as much completeness
    will be required by any technical interview. We strive to provide a number of
    solutions to each question, in order that the reader can understand the difference
    between a bad and good solution.


    # ## 1.1 An overview


    There is no secret recipe to acing an interview or solving a programming problem.
    And if you know your foundations, in the course of a tech career everyone will
    come across that interviewer who is annoyed at having interview, suffering from
