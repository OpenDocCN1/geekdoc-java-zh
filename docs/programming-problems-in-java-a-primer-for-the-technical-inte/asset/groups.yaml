    First restate the problem. You should look for ambiguity, and if found continue
    by proposing changes or asking for clarification. Ambiguity comes in many forms,
    so be on the lookout for undefined behavior and corner cases.


    Second, make sure you understand the corner cases and you''ve defined away as
    much ambiguity as possible. Do a few test cases with the interviewer. Write down
    the input and expected output, and leave these on the board to refer back later.
    These cases will be useful during sketching and testing.


    Third, sketch the program on the board. Do not take the whole board, because you
    will need to write the next code. But you want to have something to refer back
    to when you present your solution. Your sketch should be enough to show what you''ll
    need to write for your main processing path and what helper functions you''ll
    need to write. Your sketch should also be complete enough to gauge the asymptotic
    run of your algorithm.


    Fourth, write the program correctly. It cannot be said - you are best off to do
    it the first time. Many candidates ask if they can skip error checking, boundary
    conditions, or helpers that they believe are not core to the problem at hand.
    Do not do this. To see simply compare two candidates, one in which after writing
    the prototype the candidate automatically begins checking for null and buffer
    length, and another in which the candidate waves his hand and says he will do
    normal error and bounds later. All else being equal, the first candidate is the
    better interview. And that is because he showed he could do it the first time.


    Fifth and lastly, run your test cases from the second step through the interviewer
    how you test, and also lets you see your own writing with fresh eyes. Perhaps
    you changed a variable name, missed a boundary case, or improperly changed a helper
    function prototype. By stepping through your test cases these problems will be
    avoided. And that is it. Restate the problem, write down some test cases, sketch
    your approach, write the program, and test it. This should sound familiar, because
    it''s no coincidence that interviewing and every day programming have the same
    workflow.


    Working through programming problems is much more enjoyable than talking strategies
    on how to approach them, so let''s begin. First up is a review of the fundamentals
    of programming.'
