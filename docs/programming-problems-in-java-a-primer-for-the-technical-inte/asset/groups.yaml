    queue.add(id);\nancestry.add(id);\nwhile (!queue.isEmpty()) {\nList<Integer> parents\
    \ = data.get(queue.poll());\nif (null == parents) {\ncontinue;\n}\nfor (int parent\
    \ : parents) {\nif (!ancestry.contains(parent)) {\nancestry.add(parent);\nqueue.add(parent);\n\
    }\n}\n}\n}\n}\n```\n\n如果这些集合的交集非空，那么我们就可以确定这些人之间是有关系的。将所有内容整合在一起，问题的解决方案如下。\n\n\
