    \ `null` 的树。\n\n二叉搜索树是一种在父节点和子节点之间保持排序的二叉树。顺序不变性是：每当节点有左或右子节点时，`node.value > left.value`\
    \ 且 `node.value <= right.value`。对于每个节点，二叉搜索树都是平衡的，即左子树和右子树的深度差最多为一。下面讨论的大多数复杂度界限仅适用于平衡的二叉搜索树。\n\
    \n在本节中，我们将关注涉及二叉搜索树的操作和算法。我们进一步假设二叉搜索树是平衡的。最后，我们假设下述树操作负责内存管理，但调用者负责更新根节点。\n\n\
    ## 3.2 操作\n\n二叉搜索树的基本操作是插入、查找和删除。在接下来，我们还将查看 `find_parent` 和 `find_successor`\
    \ 操作，因为我们将看到它们是删除操作必要的先驱工作。\n\n### 3.2.1 插入\n\n二叉搜索树的插入是一个对数时间的操作。这是因为为了维持顺序不变性，插入需要通过搜索来识别树中的哪个节点将成为插入节点的父节点。在通过\
    \ `find` 操作确定了父节点后，只需要常数次操作即可完成插入。\n\n列表 3.2: 插入二叉搜索树\n\n```java\nNode insert(Node\
    \ root, int val) {\n  if (null == root) {\n    return new Node(val);\n  }\n  if\
    \ (val < root.value) {\n    root.left = insert(root.left, val);\n  } else {\n\
    \    root.right = insert(root.right, val);\n  }\n  return root;\n}\n```\n（注：由于原文此后出现严重乱码，已根据标准算法逻辑修复代码并翻译描述）\n\
    \n### 3.2.2 查找\n\n二叉搜索树的查找效率源于其对数时间复杂度。操作通常是递归的。\n\n列表 3.3: 在二叉搜索树中查找\n\n```java\n\
    Node find(Node root, int val) {\n  if (null == root || root.value == val) {\n\
    \    return root;\n  }\n  if (val < root.value) {\n    return find(root.left,\
    \ val);\n  } else {\n    return find(root.right, val);\n  }\n}\n```\n\n### 3.2.3\
    \ 删除\n\n与插入类似，从二叉搜索树中删除需要考虑多种情况。为了仔细地编写删除算法，我们首先定义两个辅助函数 `find_parent` 和 `find_successor`。\n\
    \n列表 3.4: 在二叉搜索树中查找父节点\n\n```java\nNode find_parent(Node root, Node target) {\n\
    \  if (root == target) {\n    return null;\n  }\n  while (root != null) {\n  \
    \  if (target.value < root.value) {\n      if (root.left == target) {\n      \
    \  return root;\n      }\n      root = root.left;\n    } else {\n      if (root.right\
    \ == target) {\n        return root;\n      }\n      root = root.right;\n    }\n\
    \  }\n  return null;\n}\n```\n\n列表 3.5: 在二叉搜索树中查找后继节点\n\n```java\nNode find_successor(Node\
    \ root) {\n  Node successor = root.right;\n  if (successor != null) {\n    while\
    \ (successor.left != null) {\n      successor = successor.left;\n    }\n  }\n\
    \  return successor;\n}\n```\n从二叉搜索树中删除节点需要考虑不同的情况以维持顺序不变性。删除叶子节点是简单的，因为它没有需要释放的子节点。如果节点只有一个子节点，那么该子节点可以替换该节点。在节点具有两个节点的最后情况下，我们希望用其后继节点的值来替换该节点。这样做可以保持节点位置的顺序不变性。然后，我们需要递归地删除后继节点以避免出现重复节点。总之，这提供了以下算法。\n\
    \n## 列表 3.6: 从二叉搜索树中删除节点\n\n```java\nNode remove(Node root, Node target) {\n \
    \ if (null == root) {\n    return null;\n  }\n  if (null != target.left && null\
    \ != target.right) {\n    Node next = find_successor(root);\n    int data = next.value;\n\
    \    remove(root, next);\n    target.value = data;\n    return root;\n  }\n  //\
    \ ... 其余删除逻辑\n}\n```\n"
