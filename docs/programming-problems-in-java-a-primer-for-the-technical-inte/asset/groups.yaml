    \ of Visitor .\n\n# Listing 8.8: Dependency graph\n\n```\nclass TopologicalSortVisitor\
    \ implements Visitor {\n    private List<Node> list;\n\nTopologicalSortVisitor(List<Node>\
    \ list) {\n    this.list = list;\n}\n\npublic void visit(Node node) {\n    list.add(node);\n\
    }\n\nvoid topological_sort(Node origin, List<Node> list) {\n    Visitor visit\
    \ = new TopologicalSortVisitor(list);\n    dfs(origin, visit);\n    Collections.reverse(list);\n\
    }\n```\n\nIt is worth noting that this problem is a specialization of the general\
    \ problem of topologically sorting nodes in a directed graph, and has many other\
