    \n## 8.3 深度搜索\n\n深度搜索是一种以使用栈来维护遍历边界为特征的图遍历算法。我们将其缩写为 `dfs`。深度搜索与广度搜索之间有许多差异，深度搜索尝试发现最长路径，此外，在\
