  mdcn: "\n\n## 3.3 树的属性\n\n树的算法依赖于树的许多属性。例如树的大小、深度以及它是否平衡。下面我们提供了计算二叉树常见属性的算法。\n\n\
    ### 3.3.1 大小 (Size)\n\n二叉树的大小是其节点的数量。注意，从任何节点开始，以该节点为根的子树的大小大于其子节点根的子树大小之和。我们可以递归地计算二叉树的大小。\n\
    \n列表 3.7：二叉树的大小\n\n```java\nint size(Node root) {\n  if (null == root) {\n   \
    \ return 0;\n  }\n  return 1 + size(root.left) + size(root.right);\n}\n```\n\n\
    作为一个练习，请考虑如何在不使用递归的情况下计算二叉树的大小。在另一种替代方案中，我们可以在遍历树的同时计算节点数。\n\n列表 3.8：迭代法计算二叉树的大小\n\
    \n```java\nint size_iterative(Node root) {\n  if (null == root) {\n    return\
    \ 0;\n  }\n  int count = 0;\n  Queue<Node> q = new LinkedList<Node>();\n  q.add(root);\n\
    \  while (!q.isEmpty()) {\n    Node front = q.poll();\n    count++;\n    if (null\
    \ != front.left) {\n      q.add(front.left);\n    }\n    if (null != front.right)\
    \ {\n      q.add(front.right);\n    }\n  }\n  return count;\n}\n```\n\n上面使用的遍历被称为广度优先（breadth\
    \ first）。我们稍将在更通用的设置下研究它。\n\n### 3.3.2 深度 (Depth)\n\n二叉树的深度是从根节点到叶子节点的最长简单路径的长度。节点的深度比该节点最深子树的深度大，因此有一个直接的递归解决方案。\n\
    \n列表 3.9：二叉树的深度\n\n```java\nint depth(Node root) {\n  if (null == root) {\n  \
    \  return 0;\n  }\n  return 1 + Math.max(depth(root.left),\n      depth(root.right));\n\
    }\n```\n\n让我们考虑一个迭代解决方案。我们将再次遍历树，但这次是反复到叶子节点。为了确定在深度优先枚举中我们是向左还是向右分支，我们在集合中跟踪已访问的节点。在算法的任何点，栈都包含从根节点到栈顶节点的路径，因此当前深度等于栈的大小。任何叶子节点的最大深度等于二叉搜索树的深度。\n\
    \n列表 3.10：迭代法计算二叉树的深度\n\n```java\nint depth_iterative(Node root) {\n  if (null\
    \ == root) {\n    return 0;\n  }\n  int max_depth = 0;\n  Set<Node> visited =\
    \ new HashSet<Node>();\n  Stack<Node> s = new Stack<Node>();\n  s.push(root);\n\
    \  while (!s.isEmpty()) {\n    Node top = s.peek();\n    if (null != top.left\
    \ && !visited.contains(top.left)) {\n      s.push(top.left);\n    } else if (null\
    \ != top.right && !visited.contains(top.right)) {\n      s.push(top.right);\n\
    \    } else {\n      visited.add(top);\n      max_depth = Math.max(max_depth,\
    \ s.size());\n      s.pop();\n    }\n  }\n  return max_depth;\n}\n```\n\n上面使用的遍历被称为深度优先遍历（depth\
    \ first traversal）。与广度优先遍历一样，我们将在更通用的设置下研究它。\n\n### 3.3.3 平衡 (Balance)\n\n如果对于每个节点，其左右子树的深度差最多为1，则二叉树是平衡的。要确定二叉树是否平衡，必须评估每个子树是否平衡。朴素的方法需要多次计算深度。\n\
    \n列表 3.11：朴素判断二叉树平衡\n\n```java\nboolean balanced(Node root) {\n  if (null == root)\
    \ {\n    return true;\n  }\n  if (!balanced(root.left) || !balanced(root.right))\
    \ {\n    return false;\n  }\n  int left_depth = depth(root.left);\n  int right_depth\
    \ = depth(root.right);\n  return Math.abs(left_depth - right_depth) <= 1;\n}\n\
    ```\n\n然而，这种解决方案是浪费的。我们重复地计算深度，在不平衡的树中这是一个平方级解决方案。线性解决方案需要返回深度的同时判断左右子树是否平衡。\n\
    \n列表 3.12：判断二叉树是否平衡\n\n```java\nboolean balanced_depth(Node root, int[] depth)\
    \ {\n  if (null == root) {\n    depth[0] = 0;\n    return true;\n  }\n  int[]\
    \ left = new int[1];\n  int[] right = new int[1];\n  if (!balanced_depth(root.left,\
    \ left)) {\n    return false;\n  }\n  if (!balanced_depth(root.right, right))\
    \ {\n    return false;\n  }\n  depth[0] = 1 + Math.max(left[0], right[0]);\n \
    \ if (Math.abs(left[0] - right[0]) > 1) {\n    return false;\n  }\n  return true;\n\
    }\n\nboolean balanced(Node root) {\n  int[] depth = new int[1];\n  return balanced_depth(root,\
    \ depth);\n}\n```\n\n在这个解决方案中，我们使用辅助方法进行递归深度计算。注意由于 Java 不允许基本类型引用，我们将整数封装在 int[]\
    \ 中以传递引用。\n\n### 3.3.4 祖先 (Ancestry)\n\n二叉树中节点的祖先是从根节点到节点的路径。树的一个数学属性是树中任何两个节点之间有好一条简单路径。二叉搜索树中的祖先计算非常高效。我们只需要存储查找操作使用的路径。\n\
    \n列表 3.13：从根到节点的路径\n\n```java\nboolean find_path(Node root, List<Node> path) {\n\
    \  if (root == null) {\n    return true;\n  }\n  while (null != root && (path.isEmpty()\
    \ || path.get(path.size() - 1) != target)) {\n    path.add(root);\n    if (target\
    \ < root.value) {\n      root = root.left;\n    } else {\n      root = root.right;\n\
    \    }\n  }\n  if (path.get(path.size() - 1) == target) {\n    return true;\n\
    \  } else {\n    path.clear();\n    return false;\n  }\n}\n```\n\n注意在这个解决方案中，我们提供给调用者比需要更多的信息。如果在树中找到了节点，则返回\
    \ true。当我们返回 false 时，提供的路径是该节点如果插入二叉搜索树时的祖先。二叉树中的祖先需要更多的计算，但可以通过深度优先搜索完成。\n\n\
    ### 3.3.5 最近公共祖先 (Lowest common ancestor)\n\n二叉树中两个节点的最近公共祖先是从根到每个节点路径上的最后一个公共节点。可以通过我们之前的\
    \ find_path 实现找到该节点。在计算出从根到节点的路径后，比较两条路径的分叉点。\n\n列表 3.14：从路径到根的最近公共祖先\n\n```java\n\
    lca_from_path(Node root, Node x, Node y) {\n  List<Node> x_path = new ArrayList<Node>();\n\
    \  List<Node> y_path = new ArrayList<Node>();\n  find_path(root, x, y_path);\n\
    \  Node lca = null;\n  Iterator<Node> x_path_iterator = x_path.iterator();\n \
    \ Iterator<Node> y_path_iterator = y_path.iterator();\n  Node current_x, current_y;\n\
    \  while (x_path_iterator.hasNext() && y_path_iterator.hasNext()) {\n    current_x\
    \ = x_path_iterator.next();\n    current_y = y_path_iterator.next();\n    if (current_x\
    \ != current_y) {\n      break;\n    }\n    lca = current_x;\n  }\n  return lca;\n\
    }\n```\n\n这种解决方案适用于二叉树，但在二叉搜索树中，有一种不需要预先生成从根到节点的任何路径的解决方案。如果我们同时考虑路径，节点将位于目标节点的左或右子节点中。这一观察导致了一个递归解决方案。\n\
    \n列表 3.15：递归法最近祖先\n\n```java\nlca_recursive(Node root, Node x, Node y) {\n  if\
    \ (root.value == x.value || root.value == y.value) {\n    return root;\n  }\n\
    \  if (x.value < root.value && y.value >= root.value) {\n    return lca_recursive(root.left,\
    \ x, y);\n  }\n  return lca_recursive(root.right, x, y);\n}\n```\n\n该问题的迭代解决方案比大小或路径的迭代解决方案简单。由于确定最近公共祖先不需要保持状态，我们不需要辅助队列或栈。\n\
    \n列表 3.16：迭代法最近公共祖先\n\n```java\nNode lca_iterative(Node root, Node x, Node y)\
    \ {\n  if (null != x && null != y && x.value > y.value) {\n    Node temp = y;\n\
    \    y = x;\n    x = temp;\n  }\n  while (null != root && root.value != x.value\
    \ && root.value != y.value && (y.value < root.value && x.value >= root.value))\
    \ {\n    if (y.value < root.value) {\n      root = root.left;\n    } else {\n\
    \      root = root.right;\n    }\n  }\n  return root;\n}\n```\n\n"
