    ## 6.6 实现最近最使用缓存\n\n缓存（Cache）是一种用于减少从远程存储检索数据的数据结构。元素的子集存储在本地，检索时首先查找本地，然后查找远程。缓存是有界的，且仅存储远程存储可用数据的子集。由于由于原因，它们必须实现驱逐策略。最近最使用（MRU）缓存是驱逐最久未使用元素的缓存。在本小节中，我们解决实现\
    \ MRU 缓存的问题。\n\nMRU 缓存必须高效地支持检索和优先级更新。为了实现这种数据类型，我们使用了已经访问过的两个容器的组合。我们使用内置的 `HashMap`\
    \ 实现进行查找，并使用双向链表维护优先级。\n\n为了方便在链表中进行检索，用于检索的哈希表存储了指向链表节点的引用。链表通过节点的顺序存储缓存中每个条目的优先级。链表的头部始终包含最近访问的项，尾部将是最久访问的项。为了保持正确性，每当元素被使用时，必须更新缓存。\n\
    \n我们缓存中使用的结构在下面的定义中。\n\n## 列表 6.19: 最近最使用缓存\n\n```\nclass MruCache {\n    private\
    \ LinkedList<Item> list;\n    private Map<String, Item> table;\n    private int\
    \ bound;\n\n    MruCache(int bound) {\n        list = new LinkedList<Item>();\n\
    \        table = new HashMap<String, Item>();\n        this.bound = bound;\n \
    \   }\n}\n```\n\nMRU 缓存还实现了两个方法：`find` 和 `store`。`find` 方法使用哈希表从缓存中快速检索项。当 `find`\
    \ 获取项时，该项被访问且必须更新优先级。为了在不分配新内存的情况下更新优先级，我们将项在链表中的位置移动到头部。\n\n## 列表 6.20: 最近最使用缓存中的检索\n\
    \n```\nItem find(String key) {\n  Item item = table.get(key);\n  if (null != item)\
    \ {\n    list.moveToFirst(item);\n    return item;\n  }\n  return null;\n}\n```\n\
    \n当检索失败时，我们执行 `store`。`store` 方法带有驱逐策略添加。如果缓存是有界的，则移除最久使用的项。\n\n## 列表 6.21: 最近最使用缓存中的访问\n\
    \n```\nvoid store(Item item) {\n    list.addFirst(item);\n    table.put(item.key,\
    \ item);\n    if (list.size() > bound) {\n        list.removeLast();\n    }\n\
    }\n```\n\n让我们考虑这种实现的运行时间。`find` 方法的操作是哈希查找和将节点移动到头部。这些都是常数时间。通过此，我们得到了高效的 MRU\
    \ 缓存实现。\n\n"
