  mdcn: "\n堆操作：insert、find_max、remove_max 和 increase_key。每个操作都针对满足堆属性的二叉树节点。因此，我们从堆化（heapify）操作开始，它可以从\
    \ List 原地初始化一个二叉堆。\n\n## 5.2.1 初始化\n\n从 List 初始化二叉堆涉及二叉树的逻辑表示以及对元素进行重新排序，以满足堆属性。我们首先描述用于表示堆的二叉树结构。\n\
    \n二叉树结构通过将 List 中条目的的索引与完全二叉树中节点的左序位置相对应来实现。List 的索引 0 对应二叉树的根。对于 List 中位置为 $i$\
    \ 的节点，其左孩子位于 $2 \\times i + 1$ 位置，右孩子位于 $2 \\times i + 2$ 位置。拥有一个计算这些索引的方法将很有用。\n\
    \n列表 5.1：堆的子节点索引\n\n```\nint lchild_index(int index) {\n  return (index * 2) +\
    \ 1;\n}\n```\n\n```\nint rchild_index(int index) {\n  return (index * 2) + 2;\n\
    }\n```\n\n注意，在该方案下，下一个可用的叶子节点是堆尾之后的最右侧元素。索引 $i$ 节点的父节点位于 $(i - 1)/2$。整数除法实现了向下取整。\n\
    \n列表 5.2：堆的父节点索引\n\n```\nint parent_index(int index) {\n  return (index != 0)\
    \ ? (index - 1) / 2 : 0;\n}\n```\n\n创建堆从 List 索引 0 处的单个元素开始。这个单一的子数组平凡地满足了堆属性。下一个操作是迭代地从\
    \ List 中添加元素，并保持堆属性。具体而言，新元素首先作为叶子节点添加。之后，如果违反了堆属性，则反复交换父子对。当算法终止时，堆的最大值位于第一个索引处，且满足堆属性。\n\
    \n列表 5.3：堆的创建\n\n```\nheapify(List<Integer> array) {\n  for (int i = 0; i < array.size();\
    \ i++) {\n    int parent = parent_index(i);\n    while (i != parent && array.get(parent)\
    \ < array.get(i)) {\n      int temp = array.get(i);\n      array.set(i, array.get(parent));\n\
    \      array.set(parent, temp);\n      i = parent;\n      parent = parent_index(i);\n\
    \    }\n  }\n}\n```\n\n虽然二叉堆不是最优高效的堆结构，但二叉堆可以原地构建，而不需要为树分配内存。不使用辅助对象所节省的时间通常超过了使用未针对最坏情况优化的实现所带来的缺点。\n\
    \n## 5.2.2 插入\n\n向二叉堆中插入新值从将该值作为树中的下一个叶子节点开始。之后，像创建堆时一样更新父子关系以满足堆属性。插入操作需要 List\
    \ 动态调整大小，因此不是一个原地操作。\n\n列表 5.4：插入堆\n\n```\nvoid insert(List<Integer> heap, int\
    \ value) {\n  heap.add(value);\n  int index = heap.size() - 1;\n  int parent =\
    \ parent_index(index);\n  while (index != 0 && heap.get(index) > heap.get(parent))\
    \ {\n    int temp = heap.get(index);\n    heap.set(index, heap.get(parent));\n\
    \    heap.set(parent, temp);\n    index = parent;\n    parent = parent_index(index);\n\
    \  }\n}\n```\n\n## 5.2.3 查找最大元素 \n\n在二叉堆中，find_max 操作只需要返回 List 的第一个索引。该操作的正确性由堆属性保证。\n\
    \n列表 5.5：在堆中查找最大值\n\n```\nint find_max(List<Integer> heap) {\n  return heap.get(0);\n\
    }\n```\n\n## 5.2.4 移除最大元素 \n\n移除最大值除了替换初始位置的值外，还必须完成两个目标。首先，它必须将第二个最小值提升到第一个位置。这样做会导致树发生转动，并可能对堆的结构产生级联影响。其次，必须维护树结构和父子关系。\n\
    \n以下序列可以了这两个要求：首先将堆的根值替换为最后一个叶子节点的值，然后将数组调整为较小的大小。这维持了树结构并从数组中移除了最大元素。我们需要修复堆属性。在这一操作中，通过在违反堆属性时反复交换父子对来维护堆属性。\n\
    \n列表 5.6：从堆中移除最大值\n\n```cpp\nvoid remove_max(List<Integer> heap) {\n  heap.set(0,\
    \ heap.get(heap.size() - 1));\n  heap.remove(heap.size() - 1);\n  int i = 0;\n\
    \  while (i < heap.size()) {\n    int parent = parent_index(i);\n    if (i !=\
    \ parent && heap.get(parent) < heap.get(i)) {\n      int temp = heap.get(i);\n\
    \      heap.set(i, heap.get(parent));\n      heap.set(parent, temp);\n      i\
    \ = parent;\n    } else {\n      break;\n    }\n  }\n}\n```\n\n5.2.5 增加键\n\n当键在堆中增加时，堆属性可能不再满足。通过在违反堆属性时反复交换父子对来维护堆属性。在这一操作中，堆属性通过迭代交换父子对来维护。由于不需要使用辅助对象，我们可能需要向上修复堆属性。这是通过迭代完成的。\n\
    \n列表 5.7：在堆中增加键\n\n```\nvoid increase_key(List<Integer> heap, int index, int value)\
    \ {\n  heap.set(index, value);\n  int parent = parent_index(index);\n  while (index\
    \ != 0 && heap.get(parent) < heap.get(index)) {\n    int temp = heap.get(index);\n\
    \    heap.set(index, heap.get(parent));\n    heap.set(parent, temp);\n    index\
    \ = parent;\n    parent = parent_index(index);\n  }\n}\n```\n\n解决问题在很大程度上取决于正确的数据结构，也取决于算法。考虑整数的幂。我们将定义以下类来表示数值和幂。\n\
    \n列表 5.8：数值项\n\n```java\nclass ValueTerm<V, T> {\n  public V value;\n  public\
    \ T term;\n  public ValueTerm(V value, T term) {\n    this.value = value;\n  \
    \  this.term = term;\n  }\n}\n```\n\n枚举幂可以通过优先级队列来解决。\n\n列表 5.9：幂的枚举\n\n```java\n\
    void enumerate_powers(Set<Integer> set, int num_powers, List<Integer> out) {\n\
    \  PriorityQueue<ValueTerm<Integer, Integer>> heap = new PriorityQueue<>(\n  \
    \  new Comparator<ValueTerm<Integer, Integer>>() {\n      public int compare(ValueTerm<Integer,\
    \ Integer> a, ValueTerm<Integer, Integer> b) {\n        return a.value - b.value;\n\
    \      }\n    });\n  for (Integer value : set) {\n    heap.add(new ValueTerm<Integer,\
    \ Integer>(1, value));\n  }\n  int value = 0;\n  while (0 != num_powers && 0 !=\
    \ heap.size()) {\n    ValueTerm<Integer, Integer> entry = heap.poll();\n    if\
