    \ array.length; i++) {\n    array[i] = heap.poll();\n  }\n}\n```\n\n由于构建堆和移除最大值不需要外部内存，因此堆排序是一种就地算法。由于堆创建可能会打乱元素的相对位置，堆排序不是稳定排序。最后，从我们对就地\
