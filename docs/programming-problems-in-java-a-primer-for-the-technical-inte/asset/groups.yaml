    }\n```\n\nThe listing above is not efficient, it requires a full bfs traversal\
    \ of the ancestry of one individual before beginning the second. Since the number\
    \ of parents grows exponentially in a full family tree, the set of ancestors has\
    \ the possibility of being extremely large. There are many ways to overcome this\
    \ problem, such as a level traversal of the ancestry graph.\n\n## 8.3 Depth first\
    \ search\n\nDepth search is a graph traversal algorithm characterized by its use\
    \ of a stack to maintain the frontier of traversal. We abbreviate it as dfs. There\
    \ are many important differences between depth search attempts to discover the\
    \ longest path, while breadth search iterates through a frontier of equidistant\
    \ nodes. Further, for every vertex visited in depth search the stack maintains\
    \ a path from node to the root of the graph. In dfs, the order of traversal history\
    \ is lost when the next node is visited.\n\nAs with bfs, an implementation of\
    \ dfs requires maintaining a list of vertices that have been visited. There are\
    \ implicitly two such lists. The nodes on the stack will have their children visited,\
    \ and the nodes visited will never again be elements of the stack.\n\n> Listing\
    \ 8.7: Depth First Search\n\n```\nvoid dfs(Node origin, Visitor visit) {\nSet<Node>\
    \ queued = new HashSet<Node>();\nStack<Node> stack = new Stack<Node>();\nstack.push(origin);\n\
