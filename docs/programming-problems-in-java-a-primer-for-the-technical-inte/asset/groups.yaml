  - "[PAGE 96]\n\n# Chapter 9\nSelection\n\nSelection is the last type of search we\
    \ investigate.\n\nIn programming, we define the median of an array in terms of\
    \ the sorted order of the array. The median of an array of $n$ values is the value\
    \ of the element at index $n/2$ in sorted order. That is if an array of values\
    \ is ordered, the median is the value of the middle element. Although this definition\
    \ is not the same as the statistical median, it is commonly useful in programming.\n\
    \nSelection is a generalization of the problem of finding the median. Concretely,\
    \ selection is the problem of finding the $k^{th}$ median of an array $A$ of $n$\
    \ elements. That is the element $x$ such that there are at least $k-1$ elements\
    \ in $A$ which are less than or equal to $x$, and $n-k$ elements of $A$ greater\
    \ than or equal to x\n\nAs is often the case with algorithms, it is just as easy\
    \ to handle the general case of selection as it is to handle the specific case\
    \ of finding the median. In the following we will see that doing so not harm run\
    \ efficiency. It is just as efficient to find the element in the $k^{th}$ position\
    \ of a sorted array as it is to find the median of an array when the values in\
    \ the array can be unbounded.\n\nIn this section we will provide a progression\
    \ of solutions for the problem of selection. We begin with selection through sorting,\
    \ which is a simple but inefficient solution to the problem. We then look at a\
    \ randomized selection algorithm, and improve it to deterministic bounds. We then\
    \ conclude with a selection algorithm designed to operate over large data sets,\
    \ a problem commonly asked at Google and Microsoft.\n\n# 9.1 Selection through\
    \ sort\n\nThe simplest approach to selection is to pre-sort the array, and return\
    \ the element that resides in the $k^{th}$position. Using the built-in Arrayssort\
    \ utility function, the method is simple to implement.\n\n+   Selection 9.1: Selection\
    \ by Sorting\n\n```\nint select(int[] array, int k) {\n  Arrays.sort(array);\n\
    \  return array[k];\n}\n```\n\nAn implementation of the median from this method\
    \ is simple. Recall both arrays are 0-indexed and, from our definition above,\
    \ that we want the rightmost of two middle elements."
  - "[PAGE 97]\n\n# Listing 9.2: Median by Sorting\n\n```\nint median(int[] array)\
    \ {\n    return select(array, (array.length - 1) / 2);\n}\n```\n\nThis method\
    \ always returns the correct answer, and it is hard to improve in terms of brevity.\
    \ However it requires the full sort order. This turns out to be inefficient, as\
    \ selection doesn't require the full sort order. Instead we only need to know\
    \ whether or not there are k smaller elements in the array. In order to improve\
    \ the run time, we first look at the problem of finding a proper pivot for which\
    \ to partition indent pre-sorting.\n\n# 9.2 The pivot and partition operation\n\
    \nIn binary search, we were able to cut the search space in half by knowing that\
    \ every element with an index lower than the probe's was smaller than the probe,\
    \ and every element with an index higher than the probe's was larger than the\
    \ probe. Finding a good pivot element will allow similar narrowing of the search\
    \ space in selection.\n\nThis is achieved by pivoting an array on an element that\
    \ is close to the median. Given a value and an array, the pivot operation leaves\
    \ the array in a state where every element of the array smaller than the pivot\
    \ it precedes, and every element in the array larger than the pivot succeeds it.\n\
    \nThere are many methods of implementing a partition on an array. One could use\
    \ a list and push back larger values and push front smaller values.\n\nThe following\
    \ listing partitions the sub-array defined by the offset and length on the value\
    \ provided. The algorithm used initializes the array with the pivot element in\
    \ the first position. It enumerates the array from right to left. When an entry\
    \ with value less than the pivot is detected, the tail of the array is shifted\
    \ to the right of the pivot. A smaller value is stored in the empty location created\
    \ by the shift.\n\nThe return value is an index into the array. Every element\
    \ of the array which is greater or equal to the pivot has a lower index than the\
    \ return value. Every element that is greater than the pivot value has an index\
    \ no less than the return value.\n\n# Listing 9.3: Partition on an Element\n\n\
    ```\nint partition(int[] array,\n    int pos,\n    int offset,\n    int length)\
