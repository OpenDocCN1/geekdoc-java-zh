    to the Node.


    A graph is connected if for any pair of vertices $a$ and $z$ in the graph, there
    is a list of vertices starting with $a$ and ending with $z$ which every adjacent
    pair in the list are neighbors. Such a list is called a *path*. A simple path
    is one that does not intersect itself. A cycle in a graph is a list of nodes starting
    and ending with the same node in which every adjacent pair in the list are neighbors.
    Trees are connected graphs that do not contain cycles. This allows traversal algorithms
    to not need to worry about infinite loops. However in graph traversals special
    care must be taken to ensure we do not double back and be caught in an infinite
    loop.


