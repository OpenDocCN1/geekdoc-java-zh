    # # Chapter 5

    Heaps


    In this chapter we examine the heap structure. The heap, also known as a priority
    queue, has applications in graph algorithms, caching, and sorting. We begin by
    discussing multiple variations of the heap. We then examine an implementation
    of standard operations of the binary heap. And finally, we look at a number of
    interview problems that can be solved by clever applications of a heap.


    # ## 5.1 Definition


    A heap is an abstract data structure similar to a binary search tree. Like a binary
    tree, a heap is a collection of nodes that have a data member value and at most
    two child nodes. The differentiating property is that nodes in heap satisfy the
    heap property. The heap property is held when p.value ≥ n.value for each child
    n of parent p . A heap that satisfies this property is called a max heap. A min
    heap satisfies the heap property where a parent''s data value never exceeds any
    child''s data value. Note that the root of a min heap has the smallest value in
    the data structure, and the root of a max heap has the largest value in the data
    structure.


    The heap operations are insert, find_max, remove_max, and increase_key . The names
    are self-descriptive of the operations. By maintaining the invariant, the find_max
    operation runs in constant time.


    Heaps have a number of variants with different worst running time for other operations.
    The Brodal heap is a complex collection of algorithms that obtains optimal worst
    case time for heap operations. The Brodal heap has constant time implementation
    insert, find_max, and increase_key . For remove_max, we use the Brodal variant
    to obtain a logarithmic run time.


    A second variant is the Fibonacci heap. The Fibonacci heap is named because it
    creates and maintains a forest of trees where the number of children of the root
    nodes are bounded below by Fibonacci constants. The relationship between the trees
    maintains the heap property. The Fibonacci heap achieves amortized asymptotically
    optimal bounds on running time for the heap operations. This is a trade-off between
    complexity of implementation and efficiency.


    A simpler variant is the binary heap. In the binary heap, there is a single binary
    tree structure. The tree structure is always balanced, and grows by insertion
    in level order. While the binary heap is simple to implement and understand, it
    does not achieve the asymptotic efficiency of the other variants. Namely, find_max
    takes constant time and remove_max achieves logarithmic time, while other operations
    in a binary heap have at least logarithmic time lower bounds.


    Throughout this section we will take a closer look at the binary heap.


