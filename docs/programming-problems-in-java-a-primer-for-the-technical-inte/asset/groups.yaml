    \n跟踪并修改 `bfs` 以在访问节点时提供状态信息是一种强大的技术，有许多其他用途。\n\n## 8.2.2 来自家谱数据的祖先关系\n\n这道面试题要求候选人判断两个人之间是否存在关系。我们可以将每个人视为一个节点。每个节点最多有两个父母。问题被设定为拥有不完整的家谱数据，即每个人的完整祖先可能不可知。这导致了可能可能不连通的图。\n\
    \n为了解决这个问题，我们首先将领域表示为有向图。每个人都是一个节点，键是人的标识符。每个节点都与代表父母的另外两个节点相邻。边从孩子指向父母。我们使用一个从孩子到父母\
    \ ID 的 `Map` 来表示图。\n\n要判断两个人之间是否存在关系，我们首先使用 `bfs` 计算每个人的完整祖先。由于我们处理的是用 `Map` 表示的图，`bfs`\
    \ 需要修改以理解这种表示方法。`visit` 函数简单地将父母添加到实例中。在下面的列表中，我们内联了 `visit` 函数，而不是将其作为参数传递。\n\
    \n列表 8.5: 来自家谱数据的祖先关系\n\n```\nvoid find_ancestry(\nMap<Integer, List<Integer>>\
