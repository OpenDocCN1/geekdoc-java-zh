  mdcn: "\n该思路是在当我们首次将节点加入队列时更新其距离。这样做需要跟踪节点探索的状态。`get_distance` 方法将未访问节点的距离设置为无穷大。当第一次遇到一个节点时，所有子节点都被赋予了与父节点相等的距离。由于\
    \ `bfs` 按距离访问每个节点，因此父节点的距离总会在遇到子节点之前被设置。将其转换为代码，我们得到如下列表。\n\n# 列表 8.4: 最短路径距离\n\
    \n```\nclass DistanceVisitor implements Visitor {\n    private Map<Node, Integer>\
    \ distances;\n\n    DistanceVisitor(Map<Node, Integer> distances) {\n        this.distances\
    \ = distances;\n    }\n\n    public void visit(Node node) {\n        if (distances.isEmpty())\
