    \ Every level is contiguous, and levels are visited in turn.\n\nListing 4.5: Level\
    \ Order Traversal\n\n```java\nvoid level_traversal(Node root) {\n  if (null ==\
    \ root) {\n    return;\n  }\n  Queue<Node> queue = new LinkedList<Node>();\n \
    \ queue.add(root);\n  while (!queue.isEmpty()) {\n    Node node = queue.poll();\n\
    \    if (node != node.left) {\n      queue.add(node.left);\n    }\n    if (node\
    \ != node.right) {\n      queue.add(node.right);\n    }\n    System.out.println(node.value);\n\
    \  }\n}\n```\n\nAnother name for this enumeration is breadth-first traversal.\
    \ And we've shown breadth-first on a binary tree is exactly level order.\n\nA\
    \ common modification to the question is to separate the levels with a token,\
    \ such as a newline. In order to accomplish this, we can seed the queue with a\
    \ level end token such as null or a special symbol like LEVEL_TOKEN. When we encounter\
    \ this token again we know that the current level has fully enumerated. If the\
    \ token is then enqueued again, it will be placed at the end of the level which\
    \ was just enqueued. With this trick, we can complete the solution using LEVEL_TOKEN\
    \ as our level separation token.\n\nListing 4.6: Level Order Tra with Separation\
    \ Tokens\n\n```java\nstatic final Node LEVEL_TOKEN = new Node(null);\n\nvoid level_traversal_with_separation_token(\n\
    \  Node root) {\n  if (null == root) {\n    return;\n  }\n  Queue<Node> queue\
    \ = new LinkedList<Node>();\n  queue.add(root);\n  queue.add(LEVEL_TOKEN);\n \
    \ while (!queue.isEmpty()) {\n    Node node = queue.poll();\n    if (LEVEL_TOKEN\
    \ == node) {\n      if (!queue.isEmpty()) {\n        System.out.println(\"END\
    \ LEVEL\");\n      }\n      queue.add(LEVEL_TOKEN);\n      continue;\n    }\n\
    \    if (node != node.left) {\n      queue.add(node.left);\n    }\n    if (node\
    \ != node.right) {\n      queue.add(node.right);\n    }\n    System.out.println(node.value);\n\
    \  }\n}\n```\n\n## 4.6 Largest rectangle under a histogram\n\nA histogram is a\
    \ graphical representation of data in which sequential entries along the x-axis\
    \ are associated with a height in the y-axis. These values are plotted as rectangles\
    \ of equal width with height equal to the y-value. An advanced question is to\
    \ calculate the area of the largest rectangle under the histogram.\n\nSince the\
    \ histogram is composed of rectangles, we see that every maximal rectangle is\
    \ bounded by the height of some entry. The width of every maximal rectangle under\
    \ the histogram is the number of other contiguous but at least as tall. So we\
    \ are looking for rectangles bounded by entries: an entry that defines the height,\
    \ the first contiguous entry, and the last contiguous entry. We begin by defining\
    \ a histogram as a class with x and y coordinates.\n\nListing 4.7: Definition\
    \ of Histogram\n\n```java\nclass HistogramEntry {\n  int x;\n  int y;\n\n  HistogramEntry(int\
    \ x, int y) {\n    this.x = x;\n    this.y = y;\n  }\n}\n```\n\nA naive solution\
    \ starts by enumerating all pairs of histogram entries $\\alpha$ and $\\beta$.\
    \ It calculates the minimum height between $\\alpha$ and $\\beta$ by iteratively\
    \ checking of those values. The area is then computed and a running max is tracked.\
    \ However, this solution is cubic!\n\nUsing a stack, we can find a solution that\
    \ solves the problem in a single pass. The stack maintains a collection of all\
    \ 'open' rectangles. The solution takes it in turn to inspect each of the histogram\
    \ from left right. When the height of histogram entries is increasing, an open\
    \ rectangle is added to the stack, specified by its $x$ and $y$ coordinates. When\
    \ the height of histogram entry decreases, all open entries with height larger\
    \ than the current value must be closed. The area of an open entry is its height\
    \ multiplied by width. After the last entry has been visited, a final pass must\
    \ close all open entries.\n\nListing 4.8: Largest Rectangle Under Histogram\n\n\
    ```java\nint largest_area(List<HistogramEntry> histogram) {\n  int max_area =\
    \ 0;\n  int current_pos = 0;\n  int last_closed_pos = 0;\n  Stack<HistogramEntry>\
    \ open_entries = new Stack<HistogramEntry>();\n  for (HistogramEntry entry : histogram)\
    \ {\n    current_pos = entry.x;\n    last_closed_pos = entry.x;\n    while (!open_entries.isEmpty()\
    \ && open_entries.peek().y >= entry.y) {\n      HistogramEntry top = open_entries.pop();\n\
    \      last_closed_pos = top.x;\n      int area = top.y * (current_pos - (top.x\
    \ - 1));\n      max_area = Math.max(max_area, area);\n    }\n    open_entries.push(new\
    \ HistogramEntry(last_closed_pos, entry.y));\n    current_pos++;\n  }\n  while\
    \ (!open_entries.isEmpty()) {\n    HistogramEntry top = open_entries.pop();\n\
    \    int area = top.y * ((current_pos - 1) - (top.x - 1));\n    max_area = Math.max(max_area,\
    \ area);\n  }\n  return max_area;\n}\n```\n\nIn this solution, it is clear that\
    \ every rectangle is only considered once. This means that every entry in the\
    \ histogram has been pushed once and popped once, and so we have achieved a linear\
    \ time algorithm. This is a dramatic improvement over the naive cubic solution.\n\
    \n# Chapter 5: Heaps\n\nIn this chapter we examine the heap structure. The heap,\
    \ also known as a priority queue, has applications in graph algorithms, caching,\
    \ and sorting. We begin by discussing multiple variations of the heap. We then\
    \ examine an implementation of standard operations of the binary heap. And finally,\
    \ we look at a number of interview problems that can be solved by clever applications\
    \ of a heap.\n\n## 5.1 Definition\n\nA heap is an abstract data structure similar\
    \ to a binary search tree. Like a binary tree, a heap is a collection of nodes\
    \ that have a data member value and at most two child nodes. The differentiating\
    \ property is that nodes in heap satisfy the heap property. The heap property\
    \ is held when $p.value \\ge n.value$ for each child $n$ of parent $p$. A heap\
    \ that satisfies this property is called a max heap. A min heap satisfies the\
    \ heap property where a parent's data value never exceeds any child's data value.\
    \ Note that the root of a min heap has the smallest value in the data structure,\
    \ and the root of a max heap has the largest value in the data structure.\n\n\
    The heap operations are insert, find_max, remove_max, and increase_key. The names\
    \ are self-descriptive of the operations. By maintaining the invariant, the find_max\
    \ operation runs in constant time.\n\nHeaps have a number of variants with different\
    \ worst running time for other operations. The Brodal heap is a complex collection\
    \ of algorithms that obtains optimal worst case time for heap operations. The\
    \ Brodal heap has constant time implementation insert, find_max, and increase_key.\
    \ For remove_max, we use the Brodal variant to obtain a logarithmic run time.\n\
    \nA second variant is the Fibonacci heap. The Fibonacci heap is named because\
    \ it creates and maintains a forest of trees where the number of children of the\
    \ root nodes are bounded below by Fibonacci constants. The relationship between\
    \ the trees maintains the heap property. The Fibonacci heap achieves amortized\
    \ asymptotically optimal bounds on running time for the heap operations. This\
    \ is a trade-off between complexity of implementation and efficiency.\n\nA simpler\
    \ variant is the binary heap. In the binary heap, there is a single binary tree\
    \ structure. The tree structure is always balanced, and grows by insertion in\
    \ level order. While the binary heap is simple to implement and understand, it\
    \ does not achieve the asymptotic efficiency of the other variants. Namely, find_max\
    \ takes constant time and remove_max achieves logarithmic time, while other operations\
    \ in a binary heap have at least logarithmic time lower bounds.\n\n## 5.2 Operations\n\
