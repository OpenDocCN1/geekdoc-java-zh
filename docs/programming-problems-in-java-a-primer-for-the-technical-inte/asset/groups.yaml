    \ However, we provide an iterative stack implementation to show the similarity\
    \ with bfs. Notice that aside from using a stack instead of queue the code is\
    \ similar. However, surprisingly different behavior results from such a small\
    \ change from bfs.\n\n### 8.3.1 Determine execution order of a task\n\nGiven a\
    \ graphical representation of sub-processes of a large task, where each node in\
    \ the graph represents a sub-process. The children of a node depend on the completion\
    \ of their parent. The problem is to determine an execution order for all the\
    \ processes in which no process is started before its parents have completed.\
    \ For this problem the directed graph is special in that it has no cycles, and\
    \ is called a directed acyclic graph. If it had cycles, then no sequential execution\
    \ order would exist.\n\nThis problem of determining sequential execution order\
    \ can be solved by dfs. Suppose the origin is a node that has no incoming edges.\
    \ If we begin dfs from this node, there are no cycles and we will eventually reach\
    \ a node that has no children. This node represents a process that is dependent\
    \ upon the entire contents of the stack during dfs. We save this to the back of\
    \ a list holding the reverse of execution order.\n\nWe continue in this until\
    \ every node is visited and added to the list. If the graph has not fully traversed\
    \ but dfs has an empty stack, we choose the next node from the graph with no incoming\
    \ edges and iterate.\n\nWhen this process completes, the list contains the reverse\
    \ of the execution order. Reversing the list, we then have execution order.\n\n\
    The following listing implements the determination of execution order of the graph\
    \ starting with origin . In this listing we assume there is one node with no incoming\
