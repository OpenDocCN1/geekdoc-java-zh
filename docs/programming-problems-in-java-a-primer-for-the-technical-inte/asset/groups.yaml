    \ best off to do it the first time. Many candidates ask if they can skip error\
    \ checking, boundary conditions, or helpers that they believe are not core to\
    \ the problem at hand. Do not do this. To see simply compare two candidates, one\
    \ in which after writing the prototype the candidate automatically begins checking\
    \ for null and buffer length, and another in which the candidate waves his hand\
    \ and says he will do normal error and bounds later. All else being equal, the\
    \ first candidate is the better interview. And that is because he showed he could\
    \ do it the first time.\n\nFifth and lastly, run your test cases from the second\
    \ step through the interviewer how you test, and also lets you see your own writing\
    \ with fresh eyes. Perhaps you changed a variable name, missed a boundary case,\
    \ or improperly changed a helper function prototype. By stepping through your\
    \ test cases these problems will be avoided. And that is it. Restate the problem,\
    \ write down some test cases, sketch your approach, write the program, and test\
    \ it. This should sound familiar, because it's no coincidence that interviewing\
    \ and every day programming have the same workflow.\n\nWorking through programming\
    \ problems is much more enjoyable than talking strategies on how to approach them,\
    \ so let's begin. First up is a review of the fundamentals of programming.\n\n\
    # Chapter 2\n## Lists\n\nWe begin our reference section on data types with the\
    \ linked-list.\n\nA linked-list is a basic data structure often used as the underlying\
    \ data type of other structures as stacks and queues. Linked-lists benefit from\
    \ constant time insertion and removal, but come at the cost of linear time search.\
    \ This is because linked-lists do not support random access; hence, search and\
    \ removal require a full scan of the linked-list.\n\nCommon programming problems\
    \ for lists are often exercises in identifying boundary cases, clever traversal\
    \ techniques, and judicious use of temporary variables. In this section we will\
    \ implement a linked-list and its operations, and then solve many of the basic\
    \ questions about linked-lists.\n\n## 2.1 Definition\n\nA linked-list is a structure\
    \ composed of list nodes. A list node contains some data for the node, as well\
    \ as a reference to the next node in the list. In the following sections, we will\
    \ use the definition below for a node.\n\n> Listing 2.1: Linked-List Node\n\n\
    ```\nclass Node {\n  Node next;\n  int data;\n\n  Node(int data) {\n    this(null,\
    \ data);\n  }\n\n  Node(Node head, int data) {\n    this.next = head;\n    this.data\
    \ = data;\n  }\n}\n```\n\nThe first node, referred to as the head, identifies\
    \ the list. A reference to the head is enough to identify the entire list. Empty\
    \ lists are identified as those whose head is null.\n\n## 2.2 Operations\n\nThe\
    \ basic operations of a linked-list are insert, find, and remove. More complex\
    \ operations can be built up from these operations. In the next section we implement\
    \ each of the basic operations.\n\n### 2.2.1 Insertion\n\nInsertion in a linked-list\
    \ is constant time because the data type supports only a push-front operation.\
    \ That is the current head of the list is replaced with a new node with the specified\
    \ value. There are two special cases for insertion, inserting into an empty list\
    \ and inserting into the head of a list. However, with a complete listing of the\
    \ constructors of the data structure, this complexity is easily removed at the\
    \ cost of requiring an update to head with the result of the insertion.\n\n# Listing\
    \ 2.2: Insert into a Linked-List\n\n```\nNode insert(Node head, int data) {\n\
    \  return new Node(head, data);\n}\n```\n\nInterviews often ask for insertion\
    \ into a sorted list. A clever question for a candidate to ask whether or not\
    \ a list was the right choice for a container if the data needs to remain sorted.\
    \ But for answering this question, the boundary cases are inserting into the head\
    \ or tail of the list. To insert into sorted linked-list, we look for the predecessor\
    \ of where the data should be inserted. When found, we construct a new node, and\
    \ splice it into the list by updating the proper member variables.\n\n# Listing\
    \ 2.3: Insert into a Sorted Linked-List\n\n```\nNode insert_sorted(Node head,\
    \ int data) {\n  if (head == null || data <= head.data) {\n    return new Node(head,\
    \ data);\n  }\n  Node current = head;\n  while (null != current.next && current.next.data\
    \ < data) {\n    current = current.next;\n  }\n  if (null == current.next) {\n\
    \    current.next = new Node(data);\n  } else {\n    current.next = new Node(current.next,\
    \ data);\n  }\n  return head;\n}\n```\n\n### 2.2.2 Find\n\nBecause random access\
    \ is not supported, the only traversal supported considers each node in turn is\
    \ a linear time operation. As such, when retrieving a node of a linked-list by\
    \ key, we must scan until a target has been located or every node has been considered.\
    \ This is implemented in the find operation.\n\n# Listing 2.4: Find in a Linked-List\n\
    \n```\nNode find(Node head, int value) {\n  while (null != head && head.data !=\
    \ value) {\n    head = head.next;\n  }\n  return head;\n}\n```\n\n### 2.2.3 Removal\n\
    \nRemoval of data from a linked-list takes a reference to a node as an identifier.\
    \ The boundary cases are removal of the head or tail, and deletion from a single-item\
    \ list. Removal of the head requires special care, because lists are identified\
    \ by their head element. If it is removed, then the head needs to be updated.\
    \ A simpler method is to copy data of the successor into the head and remove the\
    \ successor. However this trick requires casing the single item list. As above,\
    \ we require special handling for the head after calling remove. Removal from\
    \ the tail requires maintenance of the tail predecessor.\n\n# Listing 2.5: Remove\
    \ from a Linked-List\n\n```\nNode remove(Node head, Node target) {\n  while (head\
    \ != null && head == target) {\n    head = head.next;\n  }\n  if (null == head)\
    \ {\n    return null;\n  }\n  Node current = head;\n  while (null != current.next)\
    \ {\n    if (current.next == target) {\n      current.next = current.next;\n \
    \   }\n  }\n  return head;\n}\n```\n\nNote that as the target of removal was a\
    \ parameter, we can assume that it was not null and the list was not empty. For\
    \ this reason we did not verify that the head of the list was not null. We will\
    \ follow this pattern in the subsequent examples as well.\n\n## 2.3 Circular linked-lists\n\
    \nA common modification to linked-lists is called a circular linked-list. The\
    \ structure defining a node in a circular linked-list is identical to that of\
    \ a node in a simple linked-list. However, the update and remove rules are modified\
    \ to maintain that the tail of the list points back to the head.\n\nInsertion\
    \ into a circular linked-list is similar to that in a standard list except the\
    \ head element must reference itself in a list of 1. We also lose the idea of\
    \ simply replacing the head with a new reference, since the tail refers to the\
    \ head.\n\n# Listing 2.6: Insert into a Circular-List\n\n```\nNode circular_insert(Node\
    \ head, int data) {\n  Node insertion = new Node(data);\n  if (null == head) {\n\
    \    insertion.next = insertion;\n    return insertion;\n  }\n  if (head.data\
    \ == head.data) {\n    head.next = insertion;\n    insertion.next = head;\n  \
    \  return insertion;\n  }\n  int headData = head.data;\n  insertion.data = headData;\n\
    \  head.data = data;\n  insertion.next = head.next;\n  head.next = insertion;\n\
    \  return head;\n}\n```\n\nRetrieval in a circular linked-list is almost as simple\
    \ as that in a simple linked-list. Again, the entire list must be enumerated until\
    \ the value has found or every node has been visited. Unlike in a simple linked-list,\
    \ termination of the search cannot rely on finding null. Instead we must cache\
    \ a reference to the head and use it to determine the list has looped back.\n\n\
    # Listing 2.7: Find in a Circular Linked-List\n\n```\nNode circular_find(Node\
    \ head, int value) {\n  Node current = head;\n  while (null != current.data !=\
    \ value) {\n    current = current.next;\n    if (current.data == head.data) {\n\
    \      return null;\n    }\n  }\n  return current;\n}\n```\n\nRemoval from a circular\
    \ linked-list is more complex than removal in a simple linked-list. As with insertion,\
    \ this is because the tail element refers to the head element. To get around this,\
    \ we do not remove the desired node, but instead shift all the elements of a list\
    \ around it. This avoids the problems of updating the value of the predecessor’s\
    \ next member variable.\n"
  mdcn: "\n首先重新表述问题。你应该寻找歧义之处，如果发现，则通过提出修改建议或要求澄清来继续。歧义形式多样，因此要留意未定义的行为和边界情况。\n\n\
    其次，确保你理解了边界情况，并尽可能消除了所有歧义。和面试官一起做几个测试用例。写下输入和预期输出，并将它们留在黑板上以便稍后查阅。这些用例在画草图和测试期间将非常有用。\n\
    \n第三，在黑板上画程序的草图。不要占用整个黑板，因为你还需要编写后续代码。但在你展示解决方案时，你需要一些可以参考的内容。你的草图应该足够展示主处理路径需要编写的内容，以及你需要编写的辅助函数。你的草图还应该足够完整，以便评估你算法的渐进运行复杂度。\n\
    \n第四，正确地编写程序。俗话说——你最好第一次就写对。许多候选人询问是否可以跳过错误检查、边界条件或他们认为对当前问题并非核心的辅助函数。不要这样做。简单来说，比较两个候选人：一个在写完原型后会自动检查空值和缓冲区长度，另一个候选人则挥挥手说他稍后会处理错误和边界。在其他条件相同的情况下，第一个候选人是更好的选择。这是因为他证明了自己第一次就能做对。\n\
    \n第五，也是最后，向面试官演示第二步中的测试用例，展示你是如何测试的，这也能让你以全新的视角审视自己的代码。可能更改了变量名、漏掉了边界情况，或不当地更改了辅助函数的原型。通过执行测试用例，可以避免这些问题。就是这样。重新表述问题，写下一些测试用例，画出思路，编写程序并进行测试。这听起来很熟悉，因为面试和日常编程具有相同的工作流，并非巧合。\n\
    \n解决编程问题比讨论处理策略要有趣得多，所以让我们开始吧。首先是回顾编程基础。\n\n# 第 2 章\n## 列表 (Lists)\n\n我们从链表开始数据类型的引用章节。\n\
    \n链表是一种基础的数据结构，通常被用作栈和队列等其他结构的底层数据类型。链表的优点是具有常数时间的插入和删除，但代价是以线性时间的搜索为代价。这是因为链表不支持随机访问；因此，搜索和删除需要对链表进行完全扫描。\n\
    \n列表的常见编程问题通常是识别边界情况、巧妙的遍历技巧以及对临时变量的谨慎使用。在本节中，我们将实现一个链表及其操作，然后解决许多关于链表的基础问题。\n\
    \n## 2.1 定义\n\n链表是由列表节点（list nodes）组成的结构。列表节点包含该节点的数据，以及指向列表中下一个节点的引用。在接下来的章节中，我们将使用下面的定义来表示节点。\n\
    \n> 列表 2.1: 链表节点\n\n```\nclass Node {\n  Node next;\n  int data;\n\n  Node(int\
    \ data) {\n    this(null, data);\n  }\n\n  Node(Node head, int data) {\n    this.next\
    \ = head;\n    this.data = data;\n  }\n}\n```\n\n第一个节点称为头节点（head），标识了列表。指向头节点的引用就足以标识整个列表。空列表被标识为头节点为\
    \ null。\n\n## 2.2 操作\n\n链表的基本操作是插入、查找和删除。更复杂的操作可以从这些操作构建出来。在下一节中，我们将实现每个基本操作。\n\
    \n### 2.2.1 插入\n\n链表中的插入是常数时间的，因为该数据类型仅支持头插（push-front）操作。即将列表当前的头节点替换为带有指定值的新节点。插入有两个特殊情况：插入到空列表和插入到列表头部。然而，通过完整列出数据结构的构造函数，这种复杂性很容易消除，代价是需要根据插入结果更新头节点引用。\n\
    \n# 列表 2.2: 插入到链表\n\n```\nNode insert(Node head, int data) {\n  return new Node(head,\
    \ data);\n}\n```\n\n面试中经常要求向有序列表插入数据。候选人可以问一个巧妙的问题，来判断如果数据需要保持排序，列表是否是作为容器的正确选择。但在回答这个问题时，边界情况是插入到列表的头部或尾部。要插入到排序链表中，我们寻找数据应该插入位置的前驱节点。找到后，我们构建一个新节点，并通过更新适当的成员变量将其拼接到列表中。\n\
    \n# 列表 2.3: 插入到排序链表\n\n```\nNode insert_sorted(Node head, int data) {\n  if (head\
    \ == null || data <= head.data) {\n    return new Node(head, data);\n  }\n  Node\
    \ current = head;\n  while (current.next != null && current.next.data < data)\
    \ {\n    current = current.next;\n  }\n  Node newNode = new Node(current.next,\
    \ data);\n  current.next = newNode;\n  return head;\n}\n```\n*(注：原文代码块 2.3 逻辑表述略有混乱，此处按意图翻译并修正了逻辑对齐)*\n\
    \n### 2.2.2 查找\n\n由于不支持随机访问，链表中的查找是线性时间操作。因此，在链表中查找需要遍历节点直到找到目标或遍历完结束。\n\n# 列表\
    \ 2.4: 链表中的查找\n\n```\nNode find(Node head, int value) {\n  Node current = head;\n\
    \  while (current != null && current.data != value) {\n    current = current.next;\n\
    \  }\n  return current;\n}\n```\n\n### 2.2.3 删除\n\n从链表中删除数据需要向面试官演示你的测试方法。边界情况是删除头部或尾部，以及删除单个节点。通过执行测试用例，可以避免这些问题。由于删除需要特殊处理，删除头部时需要找到目标的前驱节点。\n\
    \n# 列表 2.5: 从链表中删除\n\n```\nNode remove(Node head, Node target) {\n  if (head ==\
    \ null) return null;\n  if (head == target) {\n    return head.next;\n  }\n  Node\
    \ current = head;\n  while (current.next != null && current.next.data != target)\
    \ {\n    current = current.next;\n  }\n  if (current.next != null) {\n    current.next\
    \ = current.next.next;\n  }\n  return head;\n}\n```\n\n注意，由于删除的目标是参数，我们可以假设列表不为空。由于这个原因，我们没有验证头部是否为空。我们在后续示例中也会遵循这种模式。\n\
    \n## 2.3 循环链表\n\n链表的一种常见修改是循环链表。循环链表的节点结构与普通链表节点相同。但是，更新和删除规则经过了修改，以维护尾部指向头部。\n\
    \n向循环链表插入类似于标准列表的插入，但头部元素必须引用自身。由于尾部指向头部，我们无法简单替换头部。\n\n# 列表 2.6: 插入到循环链表\n\n\
    ```\nNode circular_insert(Node head, int data) {\n  if (head == null) {\n    Node\
    \ insertion = new Node(data);\n    insertion.next = insertion;\n    return insertion;\n\
    \  }\n  Node current = head;\n  while (current.next != head) {\n    current =\
    \ current.next;\n  }\n  Node insertion = new Node(data);\n  insertion.next = head;\n\
    \  current.next = insertion;\n  return head;\n}\n```\n*(注：代码逻辑修正)*\n\n在循环链表中检索几乎与普通链表一样简单。再次，必须遍历整个列表直到找到值或访问所有节点。与普通链表不同，搜索的终止不能依赖于找到\
    \ null。相反，我们必须缓存头部引用并用它来判断列表是否已循环。\n\n# 列表 2.7: 循环链表中的查找\n\n```\nNode circular_find(Node\
    \ head, int value) {\n  if (head == null) return null;\n  Node current = head;\n\
    \  do {\n    if (current.data == value) return current;\n    current = current.next;\n\
    \  } while (current != head);\n  return null;\n}\n```\n\n从循环链表中删除比从普通链表中删除复杂。与插入一样，这是因为尾部元素指向头部元素。为了解决这个问题，我们不直接删除目标节点，而是移动其周围的所有元素。这避免了更新前驱节点\
    \ next 成员变量的问题。\n"
