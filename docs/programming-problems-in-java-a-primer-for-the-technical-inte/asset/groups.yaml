  mdcn: "\n受限的偏移量集合。父变量有两个作用：它用于判断某个位置是否已经入队，并用于路径的重建。最后，注意 `PriorityQueue` 类的用法，我们向构造函数传递了一个自定义的\
    \ `Comparator`，按距离对元素进行排序。虽然这个问题的解决方案比大多数问题都要长，但其基本框架与 BFS 和 DFS 相似。\n\n# 第 9\
    \ 章\n选择\n\n选择算法是我们研究的最后一种搜索类型。\n\n在编程中，我们根据数组的排序顺序来定义数组的中位数。一个包含 $n$ 个值的数组的中位数，是排序后索引为\
