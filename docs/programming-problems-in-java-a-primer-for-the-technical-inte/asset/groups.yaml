    \n## 10.6 大数据排序\n\nGoogle 一个非常喜欢的面试题是：仅使用 100MB 内存对 4GB 数据进行排序。虽然具体的数值限制可能会变化，但关键见解是使用合并排序完成大规模数据的排序。\n\
    \n这是一个关于分区和合并的练习。首先，应该对较小边界数据中的每个连续子数组使用快速排序进行排序。这样做速度快、就地，并且只需要常数量的额外内存。之后，使用合并排序对这些子数组进行合并。下面提供了合并操作的示例实现。\n\
