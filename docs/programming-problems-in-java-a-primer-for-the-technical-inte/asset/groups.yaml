    \ benefit from constant time insertion and removal, but come at the cost of linear\
    \ time search. This is because linked-lists do not support random access; hence,\
    \ search and removal require a full scan of the linked-list.\n\nCommon programming\
    \ problems for lists are often exercises in identifying boundary cases, clever\
    \ traversal techniques, and judicious use of temporary variables. In this section\
    \ we will implement a linked-list and its operations, and then solve many of the\
    \ basic questions about linked-lists.\n\n# ## 2.1 Definition\n\nA linked-list\
    \ is a structure composed of list nodes. A list node contains some data for the\
    \ node, as well as a reference to the next node in the list. In the following\
    \ sections, we will use the definition below for a node.\n\n> Listing 2.1: Linked-List\
    \ Node\n\n```\nclass Node {\n  Node next;\n  int data;\n\nNode(int data) {\n \
    \ this(null, data);\n}\n\nNode(Node head, int data) {\n  this.next = head;\n \
    \ this.data = data;\n}\n```\n\nThe first node, referred to as the head, identifies\
    \ the list. A reference to the head is enough to identify the entire list. Empty\
    \ lists are identified as those whose head is null.\n\n# ## 2.2 Operations\n\n\
    The basic operations of a linked-list are insert , find , and remove . More complex\
    \ operations can be built up from these operations. In the next section we implement\
    \ each of the basic operations.\n\n# ### 2.2.1 Insertion\n\nInsertion in a linked-list\
    \ is constant time because the data type supports only a push-front"
