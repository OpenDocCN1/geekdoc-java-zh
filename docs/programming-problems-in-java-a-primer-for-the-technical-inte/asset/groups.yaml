    \n# 第10章 排序\n\n排序是编程中的一项基础任务\n\n所有最优排序算法在无界数据上的最坏情况运行时间均为 $n \\log n$。插入排序通常用于小型数据集，但它具有二次级的最坏运行时间。除非问题有明确限制使其变得高效，否则应避免使用它。否则，你在面试中唯一应该提供的二次级排序算法就是快速排序。即使是朴素的快速排序实现，你也应该解释在它的基础实现中，其期望运行时间为\
    \ $n \\log n$，但通过巧妙的基准选择，可以使其具有确定性的 $n \\log n$ 运行时间。\n\n在本章中，我们将实现五种排序算法并讨论它们的优缺点。这些算法是插入排序、堆排序、快速排序、基数排序和合并排序。\n\
    \n# 10.1 插入排序\n\n插入排序是一种低效的排序，但对于小数据或仅与排序顺序有微小偏差的数据集是有效的。\n\n插入排序通过迭代将数组中的每个元素插入到排序子数组对应位置来工作。标准实现包含一个外循环和一个内循环。外循环从前往后访问数组的每个值，留下一个排序的子数组。内循环通过从后往前扫描，在排序子数组中搜索该值的位置。在搜索过程中，排序子数组的一部分会向右移动一位，并将该值插入到留出的位置。\n\
    \n> 列表 10.1：插入排序\n\n```\nvoid insertion_sort(int[] array) {\n  for (int i = 1;\
    \ i < array.length; i++) {\n    int val = array[i];\n    for (int j = i - 1; j\
    \ >= 0 && array[j] > val; j--) {\n      int tmp = array[j];\n      array[j] =\
    \ array[j + 1];\n      array[j + 1] = tmp;\n    }\n  }\n}\n```\n\n可见，插入排序是一种就地算法，因为它不需要从堆中分配内存。插入排序也是稳定排序，因为该算法维护了元素的相对顺序。最后，由于只需要索引和一个临时值，插入排序需要常数级空间。\n\
    \n主要的缺点是插入排序具有二次级的最坏情况表现。我们的下一个算法将克服这一缺点。\n\n# 10.2 堆排序\n\n堆排序使用优先级队列来实现排序的最优最坏情况运行时间。\n\
    堆排序的操作如下：我们使用 `PriorityQueue` 创建一个堆。之后，迭代地移除最大值，并将其存储在数组末尾部分排序子数组的正确位置。回想起创建一个堆是\
    \ $O(n)$ 操作，而从堆中移除第一个元素是对数级的操作（且数组中的每个元素执行一次），我们可以看到堆排序是最优的。\n\n列表 10.2：堆排序\n\n\
    ```\nvoid heap_sort(int[] array) {\n  PriorityQueue<Integer> heap =\n new PriorityQueue<Integer>(array.length);\n\
