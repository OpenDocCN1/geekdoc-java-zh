    \ 30 年中成为微软面试题的原因。\n\n## 第3 章\n\n## 树\n\n我们将通过讨论二叉搜索树继续对数据类型进行复习。\n\n作为一种数据结构，二叉树克服了链表检索效率低下的缺点。然而，检索的对数运行时间的代价是插入和删除时间从常数时间增加到了对数时间。二叉树操作的算法编写起来也比链表的对应算法更复杂。例如，对于链表使用迭代的操作，二叉树上的操作可能依赖于递归。在本节中，我们将回顾二叉搜索树的基本操作，并开始解决更复杂的面试题。\n\
