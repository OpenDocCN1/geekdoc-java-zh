  md: '# Chapter 8

    Graphical Search


    We have already considered search over a binary search tree, now we consider search
    over general graphs. The most common graphical search algorithms are breadth first
    search and depth first search. In the following sections, we will look at basic
    implementation of each graph. Afterwards we will solve programming problems with
    these search techniques.


    # 8.1 Definition of a graph


    Listing 8.1: Graph Node


    ```

    class Node {

    int value;

    List<Node> neighbors;


    Node(int value, List<Node> neighbors) {

    this.value = value;

    this.neighbors = neighbors;

    }

    ```


    Each node has a value stored. The edges originating at a node are stored in the
    List member neighbors . As such, neighbors contains the list of all vertices adjacent
    to the Node.


    A graph is connected if for any pair of vertices $a$ and $z$ in the graph, there
    is a list of vertices starting with $a$ and ending with $z$ which every adjacent
    pair in the list are neighbors. Such a list is called a *path*. A simple path
    is one that does not intersect itself. A cycle in a graph is a list of nodes starting
    and ending with the same node in which every adjacent pair in the list are neighbors.
    Trees are connected graphs that do not contain cycles. This allows traversal algorithms
    to not need to worry about infinite loops. However in graph traversals special
    care must be taken to ensure we do not double back and be caught in an infinite
    loop.


    # 8.2 Breadth first search


    With breadth first search, abbreviated $bfs$, we study our first graph search
    algorithm. $bfs$'
