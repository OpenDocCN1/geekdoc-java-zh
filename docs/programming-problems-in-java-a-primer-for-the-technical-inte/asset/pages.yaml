  md: "A common programming question is to implement a queue using a stack. The goal\
    \ is to show equivalence the power of the two elementary data types.\n\nThe key\
    \ to solving this problem is to understand that stacks and queues are opposite\
    \ in terms of their access, and there is no mechanism by which a single stack\
    \ alone can implement a queue. The solution is to use two stacks to reverse the\
    \ data.\n\nIn the solution below we have two stacks called in-stack and out-stack.\
    \ The in-stack allows for enqueue in constant time. Each queue operation is translated\
    \ into a stack operation.\n\nTo support first-in-out, when the dequeue operation\
    \ is taken we must be able to reach the bottom of the in-stack. To do this, we\
    \ need only empty the in-stack to the outstack Notice the element last starts\
    \ on top of in-stack, and after the transfer it is on the bottom of out-stack.\
    \ The top of out-stack was the first, so popping this element provides us with\
    \ a queue. The private method transfer consolidates the logic for the data transfer\
    \ between the two stacks.\n\n# List 4.3: Implement Queue from a Stack\n\n```\n\
    class QueueFromStack {\n    private Stack<Integer> instack;\n    private Stack<Integer>\
    \ outstack;\n\n    QueueFromStack() {\n        instack = new Stack<Integer>();\n\
    \        outstack = new Stack<Integer>();\n    }\n\n    void push(int data) {\n\
    \        instack.push(data);\n    }\n\n    Integer front() {\n        if (outstack.empty()\
    \ && instack.empty()) {\n            return null;\n        }\n        transfer();\n\
    \        return outstack.peek();\n    }\n\n    Integer pop() {\n        if (outstack.empty()\
    \ && instack.empty()) {\n            return null;\n        }\n        transfer();\n\
    \        return outstack.pop();\n    }\n\n    private void transfer() {\n    \
    \    if (outstack.empty()) {\n            while (!instack.isEmpty()) {\n     \
    \           outstack.push(instack.pop());\n            }\n        }\n}\n```"
