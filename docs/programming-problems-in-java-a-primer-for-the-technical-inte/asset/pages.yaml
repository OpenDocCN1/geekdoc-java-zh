  md: '# Preface


    This book is based on Programming Problems, by BradleyGreen. I was extremely interested
    and excited when he approached me writing the Java version of the book. Java ''s
    popularity and similarity with C / C++ make it ideal for learning and reviewing
    algorithms.


    Even though I studied computer science in undergrad, I spent my summers in a research
    lab rather than interning at different companies. I didn''t have any experience
    with the technical job interview until the year before graduating. As such, I
    needed to spend more time than that of my peers preparing for job interviews.
    The interview process was grueling in it, but I got the hang of it time. Fortunately,
    I obtained several offers for both software engineering and consulting positions,
    and I decided to start my tech career in consulting where I obtained a breadth
    of software experience. I also enjoyed witnessing and participating in both the
    engineering and business parts of the industry.


    Later I wanted to work on larger scale engineering problems, and so I decided
    to look for a new opportunity. Having already been through the interview process
    before, preparing for interviews the second time went faster. After interviewing
    a few companies, I decided to go to Facebook for my next adventure.


    This book is my attempt at producing the study guide which would have greatly
    benefited my friends, colleagues, and I when preparing for interviews. It is intended
    not only for new employees but also seasoned engineers who need a refresher for
    the technical interview.


    Like any profession, interview skills are extremely important. This most definitely
    applies to the software field as well. Oftimes I have seen candidates who underperform
    on their interview loop because of their lack of preparation. The algorithms,
    knowledge, and other skills learned while preparing for interviews have also been
    applicable to my job. For example, the process of starting with test cases, brainstorming
    ideas, and iterating on a solution is a common way of approaching day-to-day work.
    Having gone through the process of preparing for interviews and having been through
    multiple loops myself, I am also able to do a better job of interviewing other
    engineers.


    Like the original, this book is intended to be a refresher for experienced engineers
    and a handbook for college students and new candidates. In future editions, this
    book will be compiled into a bibliography. For the moment, I beg your forgiveness
    for not knowing how many of the techniques used here were first discovered. I
    have done my best to ensure the code runs with Java 1.7 and passes some basic
    test cases. While the latest version of Java is Java 1.8 which was released recently,
    I specifically chose not to write this book in Java 1.8 to better illustrate concepts.


    # .1 Structure of the book


    There are three main areas that I hope to cover in this work: data structures,
    searching and'
  merge: -1
  img_proc: true
- pgno: 5
  md: 'sorting, and advanced algorithms. The latter section of the text is broken
    up into algorithms on strings, numbers, and sequences. As the scope of this work
    grew, it became clear that the work should be divided into two volumes. The first
    volume provides a discussion of programming problems covering elementary data,
    abstract data types, searching and sorting. The second volume covers advanced
    programming problems such as spatial partitioning, substructuring searching, parsing,
    and sampling.


    The chapter is the same within both. Each chapter is a self-contained study guide
    on a specific topic. Where necessary, I''ve consumed basic algorithms from prior
    chapters. I attempted to frame it so complexity increases throughout the chapter.
    The introductory material is simply refresher for anyone in the industry; middle
    sections contain interesting problems and revelations, and the finale an interesting
    and complex problem. I hope that these give the reader some pleasure before continuing
    on to the discussion of the answer.


    # .2 Programming in Java


    Though not as ubiquitous as C or C++, Java is relatively common in industry. It
    is not uncommon these days to find undergraduate and graduate school computer
    science courses primarily in Java. Java is an object-oriented language whose syntax
    is quite similar to that of C and C++. While not the emphasis of this book, some-oriented
    concepts will be sprinkled throughout this book - as they are useful concepts
    every software engineer should be aware of. Given this, I feel this book will
    be useful for developers not familiar with or to work in a Java environment.


    In places, I have not written well-optimized Java , favoring constructs that better
    portray the concept at hand and are easier to understand. Where it helps make
    code cleaner, I have encapsulated broader concepts and data structures within
    classes and/or functions. In general, I have tried to keep the code as readable
    as possible. I also use Java standard utility functions and classes including
    arrays, lists, maps, and hashes freely.


    # .3 Acknowledgements – Bradley Green


    I want to thank my parents R.G. and K.G., for without them I would have never
    gotten this far.


    I also want to thank J. Melvin for a thorough reading, and his helpful comments.
    The editors of Wikipedia made research extremely efficient, and there is not enough
    that I can thank them for their contribution. And finally, I am grateful to E.M.H.
    for suggesting this book and her reminder that it should have been completed long
    ago.


    # .4 Acknowledgements – James Wong


    I would like to thank my parents, Man W. Wong and Jade Ma, for their love and
    support throughout these years. I also want to thank Michael Chong for designing
    the cover of this book.


    Last but not least, I want to thank Bradley Green for mentoring me and giving
    me the opportunity to write this book with Him.'
