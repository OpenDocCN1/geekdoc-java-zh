  md: "# 2.7 Multiple lists\n\nMany problems require working with multiple lists simultaneously.\n\
    \nAbove, we saw how we can find the midpoint of a list by moving two references\
    \ in tandem. Using the same idea we can solve the problem of comparing two lists\
    \ with a single pass over each. Comparison is only difficult in that there is\
    \ no random access. We use multiple references, for each list in question.\n\n\
    We first check that lists are either empty or not empty. Afterward, we take it\
    \ in turns to compare each element.\n\nListing 2.19: Compare Linked-Lists\n\n\
    ```\nboolean equals(Node x, Node y) {\n  while (null != x && null != y) {\n  \
    \  if (x.data != y.data) {\n      return false;\n    }\n    x = x.next;\n    y\
    \ = y.next;\n  }\n  return null;\n}\n```\n\nThe listing above compares two lists,\
    \ but can easily be generalized to compare an arbitrary number simultaneously.\n\
    \nThe other common operation on multiple linked-lists is merging, in which two\
    \ or more lists become one. Since linked-lists are dynamically bound, merging\
    \ two linked-lists can be done without the allocation of any new memory. A naive\
    \ method to merge is to append one list to another by iteratively walking one\
    \ list and inserting each node into the other. This method requires as many writes\
    \ as there are elements in the list.\n\nWe can do better. We only append one list\
    \ to another, as in the listing below. Appending in this manner is a single write\
    \ operation, although one list must be read to the end.\n\nListing 2.20: Merge\
    \ Two Linked-Lists\n\n```\nNode merge(Node h1, Node h2) {\n  if (null == h1 ||\
