    \ overall data. If the median is not an element of one list, search must continue\
    \ on the next array. As we can see, this question has both a selection problem\
    \ and a binary search problem.\n\nIn the listings in this section we provide a\
    \ solution for finding the median of an arbitrary number of arrays. We first search\
    \ the first array, and failing to find the median value next is searched.\n\n\
    For clarity we separate out number of initialization and ancillary functions.\n\
    \nAs binary search over multiple lists, a set of bounds for search must be associated\
    \ with each list. To accomplish this, we define a class that holds a reference\
