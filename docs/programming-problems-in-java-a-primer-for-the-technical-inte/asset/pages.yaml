  md: "# # Chapter 2\nLists\n\nWe begin our reference section on data types with the\
    \ linked-list.\n\nA linked-list is a basic data structure often used as the underlying\
    \ data type of other structures as stacks and queues. Linked-lists benefit from\
    \ constant time insertion and removal, but come at the cost of linear time search.\
    \ This is because linked-lists do not support random access; hence, search and\
    \ removal require a full scan of the linked-list.\n\nCommon programming problems\
    \ for lists are often exercises in identifying boundary cases, clever traversal\
    \ techniques, and judicious use of temporary variables. In this section we will\
    \ implement a linked-list and its operations, and then solve many of the basic\
    \ questions about linked-lists.\n\n# ## 2.1 Definition\n\nA linked-list is a structure\
    \ composed of list nodes. A list node contains some data for the node, as well\
    \ as a reference to the next node in the list. In the following sections, we will\
    \ use the definition below for a node.\n\n> Listing 2.1: Linked-List Node\n\n\
    ```\nclass Node {\n  Node next;\n  int data;\n\nNode(int data) {\n  this(null,\
    \ data);\n}\n\nNode(Node head, int data) {\n  this.next = head;\n  this.data =\
    \ data;\n}\n```\n\nThe first node, referred to as the head, identifies the list.\
    \ A reference to the head is enough to identify the entire list. Empty lists are\
    \ identified as those whose head is null.\n\n# ## 2.2 Operations\n\nThe basic\
    \ operations of a linked-list are insert , find , and remove . More complex operations\
    \ can be built up from these operations. In the next section we implement each\
    \ of the basic operations.\n\n# ### 2.2.1 Insertion\n\nInsertion in a linked-list\
    \ is constant time because the data type supports only a push-front"
  merge: -1
  img_proc: true
- pgno: 14
  md: "operation. That is the current head of the list is replaced with a new node\
    \ with the specified value. There are two special cases for insertion, inserting\
    \ into an empty list and inserting into the head of a list. However, with a complete\
    \ listing of the constructors of the data structure, this complexity is easily\
    \ removed at the cost of requiring an update to head with the result of the insertion.\n\
    \n# Listing 2.2: Insert into a Linked-List\n\n```\nNode insert(Node head, int\
    \ data) {\n  return new Node(head, data);\n}\n```\n\nInterviews often ask for\
    \ insertion into a sorted list. A clever question for a candidate to ask whether\
    \ or not a list was the right choice for a container if the data needs to remain\
    \ sorted. But for answering this question, the boundary cases are inserting into\
    \ the head or tail of the list. To insert into sorted linked-list, we look for\
    \ the predecessor of where the data should be inserted. When found, we construct\
    \ a new node, and splice it into the list by updating the proper member variables.\n\
    \n# Listing 2.3: Insert into a Sorted Linked-List\n\n```\nNode insert_sorted(Node\
    \ head, int data) {\nIf (head == null || data <= head.data) {\n  return new Node(head,\
    \ data);\n}\nNode current = head;\nwhile (null != current.next\n  && current.next.data\
    \ < data) {\n  current = current.next;\n}\nIf (null == current.next) {\n  current.next\
    \ = new Node(data);\n} else {\n  current.next = new Node(current.next, data);\n\
    }\nreturn head;\n}\n```\n\n# 2.2.2 Find\n\nBecause random access is not supported,\
    \ the only traversal supported considers each node in turn is a linear time operation.\
    \ As such, when retrieving a node of a linked-list by key, we must scan until\
    \ a target has been located or every node has been considered. This is implemented\
    \ in the find operation.\n\n# Listing 2.4: Find in a Linked-List"
  merge: -1
  img_proc: true
- pgno: 15
  md: "```\nNode find(Node head, int value) {\nwhile (null != head && head.data !=\
    \ value) {\n  head = head.next;\n}\n  return head;\n}\n```\n\n# 2.2.3 Removal\n\
    \nRemoval of data from a linked-list takes a reference to a node as an identifier.\
    \ The boundary cases are removal of the head or tail, and deletion from a single-item\
    \ list. Removal of the head requires special care, because lists are identified\
    \ by their head element. If it is removed, then the head needs to be updated.\
    \ A simpler method is to copy data of the successor into the head and remove the\
    \ successor. However this trick requires casing the single item list. As above,\
    \ we require special handling for the head after calling remove. Removal from\
    \ the tail requires maintenance of the tail predecessor.\n\nListing 2.5: Remove\
    \ from a Linked-List\n\n```\nNode remove(Node head, Node target) {\nwhile (head\
    \ != null && head == target) {\n  head = head.next;\n}\nif (null == head) {\n\
    \  return null;\n}\nNode current = head;\nwhile (null != current.next) {\n  if\
    \ (current.next == target) {\n    current.next = current.next;\n  }\n}\nreturn\
    \ head;\n}\n```\n\n> Note that as the target of removal was a parameter, we can\
    \ assume that it was not null and the list was not empty. For this reason we did\
    \ not verify that the head of the list was not null . We will follow this pattern\
    \ in the subsequent examples as well.\n\n# 2.3 Circular linked-lists\n\nA common\
    \ modification to linked-lists is called a circular linked-list. The structure\
    \ defining a node in a circular linked-list is identical to that of a node in\
    \ a simple linked-list. However, the update and remove rules are modified to maintain\
    \ that the tail of the list points back to the head.\n\nInsertion into a circular\
    \ linked-list is similar to that in a standard list except the head element must\
    \ reference itself in a list of length 1. We also lose the idea of simply replacing"
  merge: -1
  img_proc: true
- pgno: 16
  md: "the head with a new reference, since the tail refers to the head.\n\n# Listing\
    \ 2.6: Insert into a Circular Linked-List\n\n```\nNode circular_insert(Node head,\
    \ int data) {\n  Node insertion = new Node(data);\n  if (null == head) {\n   \
    \ insertion.next = insertion;\n    return insertion;\n  }\n  if (head.data ==\
    \ head.data) {\n    head.next = insertion;\n    insertion.next = head;\n    return\
    \ insertion;\n  }\n  int headData = head.data;\n  insertion.data = headData;\n\
    \  head.data = data;\n  insertion.next = head.next;\n  head.next = insertion;\n\
    \  return head;\n}\n```\n\nRetrieval in a circular linked-list is almost as simple\
    \ as that in a simple linked-list. Again, the entire list must be enumerated until\
    \ the value has found or every node has been visited. Unlike in a simple linked-list,\
    \ termination of the search cannot rely on finding null . Instead we must cache\
    \ a reference to the head and use it to determine the list has looped back.\n\n\
    # Listing 2.7: Find in a Circular Linked-List\n\n```\nNode circular_find(Node\
    \ head, int value) {\n  Node current = head;\n  while (null != current.data !=\
    \ value) {\n    current = current.next;\n    if (current.data == head.data) {\n\
    \      return null;\n    }\n  }\n  return current;\n```\n\nRemoval from a circular\
    \ linked-list is more complex than removal in a simple linked-list. As with insertion,\
    \ this is because the tail element refers to the head element. To get around this,\
    \ we do not remove the desired node, but instead shift all the elements of a list\
    \ around it. This avoids the problems of updating the value of the predecessor’s\
    \ next member variable."
  merge: -1
  img_proc: true
- pgno: 17
  md: "Removal also requires checking the boundary case where there is but a single\
    \ element in the circular linked-list. Then we must clear the list entirely.\n\
    \n# Listing 2.8: Remove from a Circular Linked-List\n\n```\nNode circular_remove(Node\
    \ head, Node target) {\n  if (null == head\n  || (head == target && head.next\
    \ == target)) {\n    return null;\n  }\n  Node next = target.next;\n  target.data\
    \ = next.data;\n  target.next = next.next;\n  return target;\n}}\n```\n\n# 2.4\
    \ Doubly linked-lists\n\nDoubly linked-lists are lists in which each node has\
    \ both a reference to the next element in the list as well as the previous element\
    \ in the list. A simple doubly linked-list has a head with null as its prev member,\
    \ and a tail with null its next member. Doubly linked-lists can also be circular,\
