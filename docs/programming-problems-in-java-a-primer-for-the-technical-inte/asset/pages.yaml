    \ change. However, we see that if the lower bound is ever equal to the target\
    \ after an update it must be pointing to the leftmost entry. Our final solution\
    \ is then a modified binary search.\n\n+   List 7.2: Binary Search to Find Leftmost\
    \ Target\n\n```\nint find_leftmost(int[] array, int key) {\n  int upper = array.length\
    \ - 1;\n  while (lower <= upper && array[lower] != key) {\n    int mid = lower\
