  md: "Suppose we are given maze represented by a square n × n matrix defined as a\
    \ GameBoard We are given a start position and an end position. The question is\
    \ to write a function that produces a path through the maze.\n\nTo begin we refer\
    \ to each position in the maze as coordinates, and a passable function determines\
    \ whether or not a given node is passable. Only positions above, below, left,\
    \ and right are neighbors. Neighbors that are passable are adjacent to a position\
    \ in the board.\n\nNow to solve the problem efficiently with A· search, we would\
    \ like to visit each node in order of its distance from the exit of the maze.\
    \ The hope is that positions closer to the exit will have shorter paths to the\
    \ exit.\n\nHowever, if we knew the actual distance could solve the problem by\
    \ traversing from the exit to the start. Instead we use the heuristic that we\
    \ want to visit the next node that is closest to the exit of the maze where distance\
    \ is measured as if there is always a path directly from the node to the exit.\
    \ To apply A· search, we will define a function which calculates the shortest\
    \ distance between a position in the maze and the exit. While many metrics are\
    \ available, we use Manhattan distance as our maze distance.\n\n# Listing 8.14:\
    \ Admissible Maze Distance Heuristic\n\n```\nint distance(Position begin, Position\
    \ end) {\n  return Math.abs(begin.x - end.x)\n  + Math.abs(begin.y - end.y);\n\
    }\n```\n\nLet us also define the following object to represent a position in the\
    \ maze and the distance between it and the exit.\n\n# Listing 8.15: Definition\
    \ of DistancePosition\n\n```\nclass DistancePosition {\n  int distance;\n  Position\
    \ position;\n\n  DistancePosition(int distance,\n    Position position) {\n  \
    \  this.distance = distance;\n    this.position = position;\n  }\n}\n```\n\nIn\
    \ solving the maze, we being at the start and continue with dfs by iteratively\
    \ constructing a path. However we use a priority queue instead of stack, where\
    \ the distance heuristic the priority of a node. Nodes are considered in lowest\
    \ priority value first. When the path reaches the exit, the path through the maze\
    \ is reconstructed and the function terminates. If no solution exists, we return\
    \ an empty path."
