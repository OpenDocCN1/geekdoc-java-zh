    ```\n\nThe most famous interview question regarding lists is the identification\
    \ of self-loops in a list. On first thought, the idea is simply to collect the\
    \ nodes until we find two that are identical. Any candidate will jump on the hash\
    \ table solution. The reason is hash tables have constant time access, and collision\
    \ detection is a basic problem in that data type. If any collisions are found,\
    \ one is guaranteed to be the head of the loop. However, since the question posed\
    \ as a decision problem, we are doing too much work. This solution requires the\
    \ allocation of new memory at least large as the number of nodes in a list. A\
    \ better option is a modification of our solution to the selection problem.\n\n\
    Consider what happens when we try to find the midpoint of a circularly linked-list.\
    \ Instead of terminating, eventually the lead reference will catch up to the tail\
    \ reference. So if ever the lead and trailing references coincide, we know there\
    \ is a loop. But if the lead reference finds the terminating null , then we know\
    \ there is no loop. We can turn this insight into a solution to the problem of\
    \ identifying self-loops in a linked-list.\n\n# Listing 2.23: Find Loops in a\
    \ Linked-List\n\n```\nboolean detect_loop(Node head) {\n    if (null == head)\
    \ {\n        return false;\n    }\n    Node trailing = head;\n    Node leading\
