  md: "the idea is to update the distance of a node when we first add it to the queue.\
    \ Doing so will require keeping track of the state of node exploration. The get_distance\
    \ method sets distance of unvisited nodes to infinity. When a node is first encountered,\
    \ all the children are given distance equal to the distance of the parent one.\
    \ Since bfs visits each node in its distance, a parent's distance will always\
    \ be set before a child is encountered. Translating this into code, we have the\
    \ following listing.\n\n# Listing 8.4: Shortest Path Distances\n\n```\nclass DistanceVisitor\
    \ implements Visitor {\n    private Map<Node, Integer> distances;\n\n    DistanceVisitor(Map<Node,\
    \ Integer> distances) {\n        this.distances = distances;\n    }\n\n    public\
    \ void visit(Node node) {\n        if (distances.isEmpty()) {\n            distances.put(node,\
    \ 0);\n        }\n        for (Node neighbor : node.neighbors) {\n           \
    \ int vertexDistance = distance(distances, node);\n            int neighborDistance\
    \ = distance(distances, neighbor);\n            distances.put(neighbor, Math.min(neighborDistance,\
    \ 1 + vertexDistance));\n        }\n    }\n\n    private int distance(Map<Node,\
    \ Integer> distances, Node vertex) {\n        Integer distance = distances.get(vertex);\n\
    \        if (null == distance) {\n            return Integer.MAX_VALUE;\n    \
    \    }\n        return distance;\n    }\n\n    public void find_distances(Node\
    \ origin, Map<Node, Integer> distances) {\n        DistanceVisitor visitor = new\
    \ DistanceVisitor(distances);\n        bfs(origin, visit);\n    }\n}\n```\n\n\
    At completion of the algorithm, the parameter distances maps nodes to their shortest\
    \ path distances to the origin."
