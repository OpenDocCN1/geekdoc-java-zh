  md: "# Chapter 7\nBinary Search\n\nSearching and sorting are the fundamental operations\
    \ of computer programming, and in the next few chapters we examine each in detail.\
    \ There are three search techniques that every programmer should memorize. These\
    \ are binary search, breadth first search, and depth first search. Binary search\
    \ can be used for any sorted, random access data structure. Breadth first search\
    \ and depth first search are graph search algorithms useful for finding minimum\
    \ distance between nodes and detecting cycles. Before sorting, we will look at\
    \ basic implementations and programming problems related to each of the search\
    \ algorithms.\n\nWe begin with binary search.\n\n# 7.1 Binary search\n\nBinary\
    \ search is fundamental, and it should be known by rote as it is often asked as\
    \ a gating or sequencing question. It is one of the algorithms we learn, and influences\
    \ many data structures we use in programming. It is also one for the first applications\
    \ of branch and bound, in that the update rule divides the search space in half.\n\
    \nThe following is an implementation of binary search for searching an integer\
    \ array. The result of the search is the location of the element with the specified\
    \ key.\n\nListing 7.1: Binary Search\n\n```\nint find(int[] array, int key) {\n\
    \  int lower = 0;\n  int upper = array.length - 1;\n  while (lower < upper) {\n\
    \    int mid = lower + (upper - lower) / 2;\n    if (key == array[mid]) {\n  \
    \    return mid;\n    } else if (key < array[mid]) {\n      upper = mid - 1;\n\
    \    } else {\n      lower = mid + 1;\n    }\n  }\n  return lower;\n}\n```\n\n\
    A few details of this implementation require further discussion. First, the function\
    \ above returns the position of the entry or the point at which the algorithm\
    \ was searching when it determined the key is not present. We will see this definition\
    \ is useful in the sequel.\n\nSecond, if we did not find an entry, we know that\
    \ key != array[mid], and so we do not need to consider mid. So we can set lower\
    \ and upper one past mid in the appropriate"
