    \n# 3.3.3 Balance\n\nA binary tree is balanced if for every node the difference\
    \ between the depth of its left and right sub-trees is at most one. To determine\
    \ whether or not a binary tree is balanced we must evaluate whether or every sub-tree\
    \ is balanced. Doing so naively would require multiple calculations of depth.\n\
    \nListing 3.11: Determine if a Binary Tree is Balanced Naive\n\n```\nboolean balanced_naive(Node\
    \ root) {\n  if (null == root) {\n    return true;\n  }\n  if (!balanced(root.left)\n\
