    \ of a tree is that there is exactly one simple path between any two nodes in\
    \ a tree. The calculation of ancestry in a binary search tree is extremely efficient.\
    \ We need only store the search path used in the find operation.\n\nListing 3.13:\
    \ Find Path from Root to Node\n\n```\nboolean find_path(Node root,\n  List<Node>\
    \ path) {\n  if (target == null) {\n    return true;\n  }\n  while (null != root\n\
    \  && (path.isEmpty()\n  || path.get(path.size() - 1) != target)) {\n    path.add(root);\n\
    \    if (target < root.value) {\n      root = root.left;\n    } else {\n     \
    \ root = root.right;\n    }\n  }\n  if (path.get(path.size() - 1) == target) {\n\
