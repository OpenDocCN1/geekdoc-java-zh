- pgno: 108
  md: "# Chapter 10 Sorting\n\nSorting is a fundamental task in programming\n\nAll\
    \ optimal sorts have worst case run times of n log n over unbounded data. Insertion\
    \ sort is often used for small data sets, but it has quadratic worst case running\
    \ time. It should be avoided unless the problem is explicitly constrained so that\
    \ it is efficient. Otherwise the only quadratic sort algorithm you should ever\
    \ give in an interview is quick sort. And even with a naive quick sort implementation,\
    \ you should be able to explain that in its basic implementation it has n log(n)\
    \ running time in expectation, but can be made to have deterministic n log(n)\
    \ running time with a clever choice of pivots.\n\nIn this chapter we will implement\
    \ five sorting algorithms and discuss their comparative merits. These algorithms\
    \ are insertion sort, heap sort, quick sort, radix sort, and merge sort.\n\n#\
    \ 10.1 Insertion sort\n\nInsertion sort is an inefficient sort that is practical\
    \ for small data or data sets with only a small perturbation from sorted order.\n\
    \nInsertion sort works by iteratively inserting each element of an array into\
    \ its position in a sorted sub-array. A standard implementation has an outer loop\
    \ and an inner loop. The outer loop visits each value of an array from front to\
    \ back, leaving behind a sorted sub-array. The inner loop searches for the position\
    \ of the value in the sorted sub-array by scanning from back to front. During\
    \ this search a portion of the sorted sub-array is shifted right one position,\
    \ and the value is inserted into the vacated position.\n\n> Listing 10.1: Insertion\
    \ Sort\n\n```\nvoid insertion_sort(int[] array) {\nfor (int i = 1; i < array.length;\
    \ i++) {\n  int val = array[i];\n  for (int j = i - 1; j >= 0 && array[j] > val;\
    \ j--) {\n    int tmp = array[j];\n    array[j] = array[j + 1];\n    array[j +\
    \ 1] = tmp;\n  }\nnnn}\n```"
  merge: -1
  img_proc: true
- pgno: 109
  md: "As can be seen, insertion sort is an in-place algorithm as it does not require\
    \ allocation of memory from the heap. Insertion sort is also a stable sort, as\
    \ the algorithm maintains the relative order of elements. Lastly, as only the\
    \ indices and a temporary value are required insertion sort requires constant\
    \ space.\n\nThe main drawback is that insertion sort has quadratic worst case\
    \ behavior. Our next algorithm overcomes this drawback.\n\n# 10.2 Heap sort\n\n\
    Heap sort uses a priority queue to achieve optimal worst case running time for\
    \ a sort.\nHeap-sort operates as follows. We create a heap using the PriorityQueue\
    \ . After, max-values are iteratively removed and stored in their proper location\
    \ in a partially sorted sub-array at the tail end of the array. Recalling that\
    \ creating a heap is order n operation and removing the first element in a heap\
    \ is a logarithmic time operation called once for each element in the array, we\
    \ can see that heap sort is an optimal\n\nListing 10.2: Heap Sort\n\n```\nvoid\
    \ heap_sort(int[] array) {\n  PriorityQueue<Integer> heap =\n  new PriorityQueue<Integer>(array.length);\n\
    \  for (int value : array) {\n    heap.add(value);\n  }\n  for (int i = 0; i <\
    \ array.length; i++) {\n    array[i] = heap.poll();\n  }\n}\n```\n\nSince building\
    \ the heap and removing the max require no external memory, heap sort is an in-place\
    \ algorithm. Since the heap creation may shuffle the relative locations of elements,\
    \ heap-sort is not a stable sort. And lastly, from our implementation of the inplace\
    \ heapify method we can see that heap sort uses constant space.\n\n# 10.3 Quick\
    \ sort\n\nQuick sort is a divide and conquer algorithm that, like selection, partitions\
    \ the data on a properly chosen pivot and recursively operates on the sub-arrays.\n\
    \nWith a random pivot selection, quick sort provides expected optimal time. However\
    \ the worst case run time is quadratic. This is overcome by choosing a pivot element\
    \ that is near the median of the array. The implementation of median-of-3 provided\
    \ in the section on selection would guarantee optimal worst case behavior. Instead,\
    \ we use the linear nth_element pivot selection method presented earlier which\
    \ is modified and reimplemented for convenience. Using nth_element will increase\
    \ effective run time, but the worst case asymptotic bound remains unaffected."
