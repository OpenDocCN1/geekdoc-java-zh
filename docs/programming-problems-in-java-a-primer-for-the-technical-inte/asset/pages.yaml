  md: '# # Chapter 6

    Hash Tables


    Hash tables are important data structures whose efficiency and flexibility allow
    them to be used in almost any kind of search problem.


    A large part of being computer programming is able to evaluate a problem and design
    the proper data structure to address it. As the popularity of higher-level languages
    grows, and more candidates default to the hash table. Because of their flexibility,
    hash tables can lead to a correct, but inefficient solution. They can be equally
    effective in finding duplicates in a linked-list, counting the elements in the
    stream, and searching a pre-generated list. But hash tables have drawbacks. They
    cannot be easily enumerated by key or value. It takes work to guarantee a proper
    hash function has been chosen for a data set, as collisions in the search space
    can degrade lookup tremendously. Also there is memory overhead to use a hash table
    as a key-value map, and dynamic resizing can occur at any insert.


    In this section we cover the material that every candidate should know regarding
    hash tables. We discuss the three important features of hash table implementation;
    the hash function, collision resolution, and dynamic resizing. And finally conclude
    with a number of applications of hash tables that have been asked as interview
    questions.


    # ## 6.1 The hash function


    A hash function maps a large domain to a smaller range of values. For instance,
    a simple hash function can map the set of all strings to the integers between
    0 and 31. The hash of a data structure is computed by calling a hash function
    on a specified element of the data structure called key. The hash value of a variable
    is the result of evaluating the hash function on that variable''s key.


    Hash functions require a number of properties to guarantee correctness and efficiency
    of a hash table.


    A hash function must be deterministic in every data structure with the same key
    must have the same hash value. Otherwise retrieval from a hash table is impossible.


    A hash function should guarantee that the domain is nearly uniformly distributed
    across the range. That means the probability that two elements, chosen at random,
    have identical hash values is n'' when the range is of size n. In this way, that
    hash function minimizes the chance of false positives. A collision is when two
    distinct elements have equal hash values.


    Finally, a hash function must be efficiently computed across the domain. It is
    common for a hash function to take constant time on elements of the domain.


    Hash functions may have other properties, but they find use in only special purposes.
    For instance a hash function can be tolerant of unimportant features of a key,
    such as capitalization, to provide normalized hashing. A hash function can be
    continuous, in that small changes to a key result in small changes to its hash
    value. This guarantees locality of'
