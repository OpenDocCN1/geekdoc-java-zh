    \ question that can be solved with slight modification of binary search is the\
    \ problem of finding the leftmost occurrence of a target value n in a sorted array.\
    \ Modifying both the update rules and the exit criteria of the previous implementation\
    \ of binary search can solve this question.\n\nWhile previous implementation of\
    \ the binary search algorithm provides an incomplete answer, does it provide information\
    \ on the location of the target. We should immediately see that we find an index\
    \ that matches the target value, we could scan linearly until we find the leftmost\
    \ element with the target value. While this provides a correct solution, the run\
