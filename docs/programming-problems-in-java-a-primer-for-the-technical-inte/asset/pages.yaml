  md: "# Chapter 9\nSelection\n\nSelection is the last type of search we investigate.\n\
    \nIn programming, we define the median of an array in terms of the sorted order\
    \ of the array. The median of an array of $n$ values is the value of the element\
    \ at index $n/2$ in sorted order. That is if an array of values is ordered, the\
    \ median is the value of the middle element. Although this definition is not the\
    \ same as the statistical median, it is commonly useful in programming.\n\nSelection\
    \ is a generalization of the problem of finding the median. Concretely, selection\
    \ is the problem of finding the $k^{th}$ median of an array $A$ of $n$ elements.\
    \ That is the element $x$ such that there are at least $k-1$ elements in $A$ which\
    \ are less than or equal to $x$, and $n-k$ elements of $A$ greater than or equal\
    \ to x\n\nAs is often the case with algorithms, it is just as easy to handle the\
    \ general case of selection as it is to handle the specific case of finding the\
    \ median. In the following we will see that doing so not harm run efficiency.\
    \ It is just as efficient to find the element in the $k^{th}$ position of a sorted\
    \ array as it is to find the median of an array when the values in the array can\
    \ be unbounded.\n\nIn this section we will provide a progression of solutions\
    \ for the problem of selection. We begin with selection through sorting, which\
    \ is a simple but inefficient solution to the problem. We then look at a randomized\
    \ selection algorithm, and improve it to deterministic bounds. We then conclude\
    \ with a selection algorithm designed to operate over large data sets, a problem\
    \ commonly asked at Google and Microsoft.\n\n# 9.1 Selection through sort\n\n\
    The simplest approach to selection is to pre-sort the array, and return the element\
    \ that resides in the $k^{th}$position. Using the built-in Arrayssort utility\
    \ function, the method is simple to implement.\n\n+   Selection 9.1: Selection\
    \ by Sorting\n\n```\nint select(int[] array, int k) {\n  Arrays.sort(array);\n\
    \  return array[k];\n}\n```\n\nAn implementation of the median from this method\
    \ is simple. Recall both arrays are 0-indexed and, from our definition above,\
    \ that we want the rightmost of two middle elements."
