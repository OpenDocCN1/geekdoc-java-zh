    \ with a sub-matrix bounded by M[p,q] on the top left and M[s,t] on the bottom\
    \ right. We calculate a middle row i = (p + s)/2, and search this row to find\
    \ the column which separates the sub-matrix into four sub-matrices. The column\
    \ j that achieves this is the first entry M[i,j] in row i that is greater than\
    \ or equal to the value. Consider the separation of the matrix into four sub-matrices\
    \ bounded by row i and column j. The key cannot appear in the top left sub-matrix\
    \ because it is larger than M[i-1,j-1]. Further the key cannot appear in the bottom\
    \ right sub-matrix because it is smaller than M[i,j]. Hence we only look at the\
    \ remaining two sub-matrices: the upper right and lower left. We have narrowed\
    \ the search down to half the original domain.\n\n# Listing 7.12: Binary Search\
    \ in Young Tableau\n\n```\nboolean recursive_find(Matrix m,\n    int key,\n  \
    \  Coordinate lower,\n    Coordinate upper,\n    Coordinate out) {\n    if (lower.x\
    \ > upper.x)\n        if (lower.y > upper.y)\n            if (m.getRow() <= Math.max(lower.x,\
    \ upper.x))\n                if (m.getCols() <= Math.max(lower.y, upper.y))\n\
    \                    return true;\n    return false;\n```"
