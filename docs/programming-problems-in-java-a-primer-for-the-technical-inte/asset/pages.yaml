  md: "Traversals are useful in serializing a tree to a list of values, and every\
    \ specific type of traversal produces a deterministic list of a general binary\
    \ tree. Even if that list contains only two values, we can reconstruct multiple\
    \ traversals from an in-order traversal. The reason is that the traversal does\
    \ not specify which element is the root. In the case the list contains 3 or more\
    \ values, pre-order and post-order have ambiguity. Pre-order traversals are ambiguous\
    \ as to whether or not the second element is a right or left child of the root.\
    \ Post-order traversals are ambiguous as to whether or not the second to last\
    \ element is a right or left child of the root. Thus, no single traversal is enough\
    \ to reconstruct a binary tree. This leads us to the next problem.\n\n# 3.4.2\
    \ Reconstructing a tree from a traversal\n\nWe show how to reconstruct a binary\
    \ tree given two distinct traversals. The key to solving this problem is recognizing\
    \ the root from one traversal, and then dividing the traversals into left and\
    \ right sub-trees using the other. In the following, we provide an algorithm for\
    \ tree reconstruction from an in-order traversal and a pre-order traversal.\n\n\
    In a pre-order traversal, the first element is always the root of the next sub-tree.\
    \ The ambiguity is whether the next value is a left or right child of the root.\
    \ In the in-order traversal, given an index in the traversal, all values to the\
    \ left are in the left sub-tree and all values to the right are in the right sub-tree.\
    \ In the solution below, we first extract the root from the pre-order traversal.\
    \ We then find the index of this value in the in-order traversal. If the value\
    \ does not appear at the beginning of the in-order traversal there is a left sub-tree.\
    \ If it does not appear at the end, there is a right sub-tree. In either case\
    \ we extract from each the subsequences corresponding to a sub-tree, and recurse.\n\
    \n> Listing 3.20: Reconstruction of a Binary Tree\n\n```\nNode reconstruct_tree(List<Integer>\
    \ inorder,\n    List<Integer> preorder) {\n    Node = null;\n    int inorder_pos;\n\
    \    int preorder_pos;\n    List<Integer> left_preorder;\n    List<Integer> right_preorder;\n\
    \    List<Integer> left_inorder;\n    List<Integer> right_inorder;\n    if ((preorder.size()\
    \ != 0) (\n        node = preorder.get(0);\n        inorder_pos = inorder.indexOf(preorder.get(0));\n\
    \        left_inorder = inorder.subList(0, inorder_pos);\n        right_inorder\
    \ = inorder.subList(inorder_pos + 1, inorder.size());\n        preorder_pos =\
    \ left_inorder.size();\n        left_preorder = preorder.subList(1,\n        preorder_pos\
    \ + 1);\n```"
