  md: "# Listing 6.19: Most Recently Used Cache\n\n```\nclass MruCache {\n    private\
    \ LinkedList<Item> list;\n    private Map<String, Item> table;\n    private int\
    \ bound;\n\n    MruCache(int bound) {\n        list = new LinkedList<Item>();\n\
    \        table = new HashMap<String, Item>();\n        this.bound = bound;\n \
    \   }\n}\n```\n\nThe MRU cache also implements two methods, find and store . The\
    \ find method uses the hash table for quick retrieval of items from the cache.\
    \ When find retrieves an item, that item is accessed and the priority must be\
    \ updated. To update the priority without allocating new memory, we move the location\
    \ of the item's node within the linked-list to the head.\n\n# Listing 6.20: Retrieval\
    \ in Most Recently Used Cache\n\n```\nItem find(String key) {\n    Item item =\
    \ table.get(key);\n    if (null != item) {\n        list.remove(item);\n     \
    \   list.offerFirst(item);\n        return item;\n    }\n    return null;\n}\n\
    ```\n\nWhen local retrieval fails, a method must call the remote store. The item\
    \ retrieved is then saved to the cache by the store function. It is within store\
    \ that the eviction policy is implemented. The item stored is prepended to the\
    \ front of the list, and the hash table is updated with the item's key value.\
    \ If the cache is above capacity after the item is added, the least recently used\
    \ item is removed. This item is found at the tail of the list. When removed from\
    \ the priority queue, the item must also be removed from the hash table.\n\n#\
    \ Listing 6.21: Access Recording in Most Recently Used Cache\n\n```\nvoid store(Item\
    \ item) {\n    list.push(item);\n    table.put(item.key, item);\n    if (list.size()\
    \ > bound) {\n        table.remove(list.getLast().key);\n        list.removeLast();\n\
    \    }\n}\n```"
