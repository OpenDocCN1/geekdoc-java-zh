  md: "# Chapter 3\n\n# Trees\n\nWe continue our review of data types with a discussion\
    \ on binary search trees.\n\nAs a data structure, the binary tree overcomes the\
    \ inefficiencies of retrieval in a linked-list. However, the logarithmic runtime\
    \ for retrieval times differ at the cost of increasing the time for insertion\
    \ and deletion from constant to logarithmic time. Algorithms for binary tree operations\
    \ are also more complex to write than the analogous algorithms for linked-lists.\
    \ For instance, for operations where a linked-list used iteration, the operation\
    \ on a binary tree may rely upon recursion. In this section we will review the\
    \ basic operations on binary search trees, and begin to solve more complex interview\
    \ questions.\n\n# 3.1 Definition\n\nA binary tree is composed of tree nodes. Tree\
    \ nodes consist of a data member variable and the address of two other nodes.\
    \ These other nodes are called children, and are distinguished as *left* and *right*.\n\
    \n> Listing 3.1: Binary Tree Node\n\n```\nclass Node {\n  int value;\nNode left;\n\
    Node right;\n\nNode(int value) {\n  this.value = value;\n}\n```\n\nAs was the\
    \ case with a linked-list, a binary tree is a referred to by a reference to a\
    \ designated node. This node is called the *root*. Empty trees are those whose\
    \ root is null.\n\nA binary search tree is a binary tree that maintains a sort\
    \ order between the parent and children nodes. The order invariant is whenever\
    \ a node has a left or right child, node.value > left.value and node.value <=\
    \ right.value . A binary search tree is balanced for every node, the depth of\
    \ the sub-trees from the left child and right child differ by most one. Most of\
    \ the complexity bounds discussed below hold only for balanced binary search trees\n\
    \nIn this section, we will focus our attention on operations and algorithms concerning\
    \ binary search trees. We further assume that the binary search trees are balanced.\
    \ Finally, as we assume that the tree operations below are responsible for memory\
    \ management but the caller is responsible for updating the root.\n\n# 3.2 Operations"
