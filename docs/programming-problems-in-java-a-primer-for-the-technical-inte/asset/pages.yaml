  md: "starts from an origin and visits all reachable nodes in a graph in order of\
    \ their distance from the origin. The number of edges from the origin measures\
    \ distance. bfs is characterized by the use of a queue to maintain the order in\
    \ which nodes are visited. The queue contains the known frontier of the search,\
    \ which are all nodes that are known to exist but have not yet been visited.\n\
    \nAs mentioned above, graphs can have cycles between the nodes. To avoid doubling\
    \ back while traversing the graph, bfs must keep track of all visited nodes and\
    \ not add nodes multiple times to the queue. To do this, we use a Set to track\
    \ our history.\n\nAs with tree traversal, bfs is usually required to do more than\
    \ simply pop every node from the queue. Often bfs is implemented to take a general\
    \ visit function that is called each time a node is examined. We achieve this\
    \ by implementing the following Visitor interface.\n\n# Listing 8.2: Visitor Interface\n\
    \n```\ninterface Visitor {\n  public void visit(Node node);\n}\n```\n\nUsing the\
    \ Node class defined previously, we can list an implementation of bfs with a parameter\
    \ called visit.\n\n# Listing 8.3: Breadth First Search\n\n```\nbfs(Node origin,\
    \ Visitor visit) {\n  Set<Node> queued = new HashSet<Node>();\n  Queue<Node> queue\
    \ = new LinkedList<Node>();\n  queue.add(origin);\n  while (!queue.isEmpty())\
    \ {\n    Node current = queue.poll();\n    visit.visit(current);\n    for (Node\
    \ neighbor : current.neighbors) {\n      if (!queued.contains(neighbor)) {\n \
    \       queued.add(current);\n        queue.add(neighbor);\n      }\n    }\n \
    \ }\n}\n```\n\nAs we will see, it is the visit function that makes bfs powerful.\n\
    \n# 8.2.1 Find the distance between nodes in a graph\n\nSince bfs visits each\
    \ node in order of its distance from the origin, it can be used to solve the problem\
    \ of finding the minimum distance from an origin to all other nodes in a graph.\
    \ In doing so we implement a special case of Dijkstra's algorithm for the case\
    \ all"
