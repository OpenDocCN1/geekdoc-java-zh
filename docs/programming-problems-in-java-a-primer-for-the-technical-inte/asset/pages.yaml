    # 8.2.2 Ancestry from genealogical data


    This interview question asks a candidate to determine if two people are related.
    We can treat each person as a node. Every node has at most two parents. The question
    is framed as having incomplete genealogical data, that is, the full ancestry of
    each individual may not be known. This gives rise to graphs that may not be connected.


    To solve this problem, we first represent the domain as a directed graph. Each
    person is a node, with the key being an identifier for person. Every node is adjacent
    to two other nodes representing parents. Edges are oriented from child to parent.
    We use a Map from child to parent ids to represent the graph.


    To determine whether or not two individuals are related, we first use bfs to calculate
    the full ancestry of each individual. Since we are dealing with a graph represented
    in a Map, bfs will need to be modified to understand this representation. The
    visit function simply adds parents to an instance. In the listing below, we inline
    the visit function instead of passing it as a parameter.


    Listing 8.5: Ancestry from Genealogical Data


    ```

    void find_ancestry(

    Map<Integer, List<Integer>> data,

    int id,

    Set<Integer> ancestry) {

    Queue<Integer> queue = new LinkedList<Integer>();

    queue.add(id);

    ancestry.add(id);

    while (!queue.isEmpty()) {

    List<Integer> parents = data.get(queue.poll());

    if (null == parents) {

    continue;

    }

    for (int parent : parents) {

    if (!ancestry.contains(parent)) {

    ancestry.add(parent);

    queue.add(parent);

    }

    }

    }

    }

    ```


    If the intersection of these sets is non-empty, then we are assured that the individuals
    are related. Putting this all together, the solution to the problem is given below.


    Listing 8.6: Decide if Two People Are Related'
