- fmt: '

    Information Technology industry has been growing rapidly and there is a strong
    need for differently abled or physically challenged engineers to take a step forward
    and say what is wrong on the web pages they access in day-to-day life! When I
    met a friend, who has Group 2 Low vision on both eyes, he expressed his hard feelings
    on accessing a career website since he could not navigate to expected section
    of the web page using his mobile voice over. Similarly, another friend who is
    short could not understand ATM bank machine voice over to navigate to next screen
    when there is only limited text has been read from the voice recorder and It was
    difficult for him to see what is there displayed on ATM machine screen. This is
    extremely difficult for a normal tester to find these bugs whereas engineers with
    similar disabilities could easily catch these defects and log them part of ‘accessibility
    defects lists’ hence there is a growing need to look for testers with disabilities
    in recent times.


    When I gave a demo of selenium based automated accessibility tests to group of
    engineers in Central London, United Kingdom, few among the audiences were actually
    attended the session to hire engineers for their software teams! Main challenge
    in finding right resource for accessibility testing is awareness of Web Content
    Accessibility Guidelines (WCAG) standards among software testers. Even though
    WCAG has been documented with great examples on websites, there is no much experienced
    project engineers on the ground to explain on the implementation. This book has
    been written in order to explain few accessibility test implementation possibilities
    on manual and automated testing. `JavaScript` has been used on automation test
    framework to showcase test examples throughout this book since `NodeJS` ecosystem
    is growing with various ‘wonderful’ test automation tools such as `webdriverio`,
    `backstopJS` and `cucumberjs`; Few examples are provided in java programming but
    the focus is more on ‘accessibility test’ rather than ‘automated test.’ If readers
    interested to learn more on automation test code examples, it is highly advisable
    to read my previous writings on ‘Software Automation Testing Secrets Revealed
    part 1 and 2.’


    ## 1.1 Future of Manual Testing


    There are debates across the IT industry that the manual testing is going to go
    away and automation testing is going to take over most of the jobs! This is a
    true nature of future toward more test automation but manual testers knowing accessibility
    testing are expected to remain niche resources in near future!


    Having compliant to international standards such as `WCAG` or `section 508` is
    one of the mandatory needs for large customer facing organizations. When accessibility
    requirements are to be met, there is a strong need to hire manual testers who
    have great exposure toward accessibility and testing of such accessibility needs.


    When automation testing tools such as `selenium` and `UFT` are in great demand,
    market also looking for manual testing who got exposures to `JAWS` or `NVDA` based
    accessibility testing.


    Users with disability are more often using voice assistance such as `JAWS` or
    `NVDA` kind of tools to access the websites or applications on desktop in order
    to hear the voice from the respective websites. When using mobile phones, `talkback`
    is one of the famous options to hear the voice for the usage of particular website
    and access any applications from mobile.


    There is a strong reason that not all the accessibility testing can be automated
    using tools such as `selenium`! Reason being, the experience of accessibility
    testing is really important when accessing the target application under test (AUT).
    This would explore more accessibility problems rather than relying on automated
    brainless tools to perform the actions for the test users.


    ## 1.2 How to Experience or Learn Accessibility Testing?


    If you are interested to learn accessibility testing, it is as simple as searching
    ‘NVDA’ in Google and installing it on your desktop in order to start using it
    for every other keyboard movement on the website or AUT where accessibility needs
    to be verified!


    Readers are recommended to watch a video related to `NVDA` with title ‘NVDA: The
    free software empowering blind people world-wide’ on YouTube URL: `https://youtube.com/watch?v=Ks7AwV_uxO0`


    Once using `NVDA` or `JAWS` in desktop, kindly requesting readers to avoid using
    mouse or reduce the usage of mouse at least on the target AUT in order to verify
    the nature of the application.


    ## 1.3 Accessibility Testing


    Users with disabilities such as visually impaired or ‘physically challenged’ (term
    used in this section as ‘special users’) are required accessible web applications
    for ease of use. This has been suggested as part of Web Content Accessibility
    Guidelines (known as ‘WCAG’)/General Services Administration Section 508 Standards
    (known as ‘Section 508’) in detail. Providing proper text for each section of
    the page and facilitating best user experience on the web pages are very important
    while providing accessibility features to web applications.


    Note: Vision impairment has classification specified by Centers of Disease Control
    and Prevention (CDC) and it is not the only primary reason for performing accessibility
    tests on applications. Accessibility ensures the special users with disabilities
    can access the same web pages what normal user’s access.


    Some leading causes to visual impairment:


    * Uncorrected refractive errors

    * Cataract

    * Diabetic retinopathy

    * Corneal opacity

    * Trachoma

    * Macular degeneration (age based)

    * Glaucoma


    There is a common myth in accessibility testing is that the testing performed
    mainly for the customers having visual impairments. But it is not the only need
    to perform accessibility testing since following types of impairments are to be
    considered while testing:


    * Auditory

    * Speech

    * Visual

    * Cognitive

    * Neurological

    * Physical


    Case study: Web access of `www.dementiablog.org` for patients with neurological
    disorders such as Alzheimer’s disease, and so on.


    Website has been validated using `Total Validator Pro` and holding down `CTRL`
    and `–` will increase or decrease the font size of the page respectively and this
    information has been provided at: `www.dementiablog.org/accessibility/`


    ### 1.3.1 How to Know When Accessibility Testing Is Required for the Application?


    If the application is customer facing in any possible way, it is advisable to
    perform accessibility testing to get the application adhere to `WCAG`/Section
    508` standards.


    ### 1.3.2 How the Testing Has Been Done to Verify that the Web Applications Are
    Developed with Those Special Users in Mind?


    Web pages are tested by the way how differently abled customers access the pages
    using assistive technologies as `JAWS`, `NVDA`, `ZoomText`, `Windows Magnifier`,
    `Web Accessibility Toolkit`.


    ## 1.4 JAWS Assistive Technology

