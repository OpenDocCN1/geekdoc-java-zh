    Severity: Severity 2* (for A and AA types of defects); Severity 3 (for AAA types
    of defects)


    *Classification: 1: Extremely Critical; 5: Least Impact


    Accessibility Standard: It is important to mention in the defect on what accessibility
    standards (WCAG/Secton508) has not been met by the web application and respective
    references of the standards impacted.


    Acceptance Criteria: Impacted acceptance criteria of the user stories are to be
    updated in this section. This would help to make the related user stories to be
    updated as BLOCKED or move to respective status. This is also another reason why
    the user stories should be updated with accessibility standards related acceptance
    criteria during user story design. This would help in testing accessibility early
    in the life cycle.


