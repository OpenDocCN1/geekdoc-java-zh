  trans: '


    JAWS（授权版）是全球范围内视障人士广泛使用的知名工具！大约 90% 的网页可访问特殊残障用户使用 JAWS 来读出网页内容并与应用程序进行交互。如果残障用户想要登录网页，桌面电脑上安装了
    JAWS，它会随着 Internet Explorer 网页登录页一同启动（因为 JAWS 仅与 IE 浏览器版本兼容良好）。因此，当按下键盘 `TAB`、`DOWN`
    或 `UP` 箭头键时，JAWS 会读出登录页面内容并方便用户导航。如果用户想在 Firefox 中打开网页，最好是使用另一种名为 `NVDA`（开源）的工具，它的读取效果与
    IE 下的 `JAWS` 类似。如果用户想在 Chrome 中打开网页，`NVDA` 效果更好，但使用 Firefox  `NVDA` 是最佳选择。


    ### 1.5 JAWS 安装


    Freedom Scientific (2008) JAWS 屏幕阅读软件 [网络博客] 获取自 [`freedomscientific.com/Downloads/JAWS`](https://freedomscientific.com/Downloads/JAWS)


    注意：一旦 `JAWS` 在电脑上安装并打开，它可能会阻止打开 Google Chrome 或任何其他浏览器（Internet Explorer 除外）；同样，已打开的
    Chrome 浏览器会自动关闭，因为 `JAWS` 正在开启读取屏幕。因此，建议在使用 `JAWS` 时将 Internet Explorer 作为网页应用的优浏览器。如果
    `JAWS` 18 在 Windows 10 系统上安装时报错，请尝试安装旧版本，如 `JAWS` 16。


    ### 1.6 测试网页上的链接


    如果特定网页上提供了用于导航到不同页面（在新窗口中）的链接，导航到该链接时读出的内容应类似于：


    ### 1.7 可点击链接打开新窗口


    当 `JAWS` 在导航到链接时读出此内容，将帮助残障用户理解按下键盘 `ENTER` 键（或点击链接）将打开新窗口，且光标或焦点将移动到新窗口！


    **开发者注意事项：**


    HTML 属性：特定对象的 `href` 属性有助于 `JAWS`/`NVDA` 将该对象读为可点击状态。因此，在 `title` 或 `aria-label`
    上提供正确的文本有助于为残障用户提供更好的无障碍体验。


    ### 1.8 链接旁的内容


    如果焦点位于链接上，残障用户按下键盘上的 `DOWN` 键可以移动到页面上这些链接下方的内容。由于大多数残障用户依赖键盘（而非鼠标），因此当使用键盘按键导航时，页面必须按预期工作。


    **开发者注意事项：**


    每个对象的 `Title`、`aria-label` 或 `class` 已被 `JAWS`/`NVDA` 工具读出，因此为每个对象 `aria-label`
    更新清晰且相关的文本有助于提供更好的无障碍体验。


    ### 1.9 列表链接


    `JAWS` 用户对键盘快捷键非常熟悉，例如列表链接功能（`INSERT+F7`）。这些相同的快捷键在 `NVDA` 中同样适用。在网页上按下 `Insert+F7`
    会打开 `JAWS` 的新窗口并列出该网页上所有可能的链接。因此，用户可以选择特定链接并从列表链接中按下 `ACTIVATE` 键，从而对该链接执行点击动作。


    ### 1.10 颜色对比度验证


    当视障用户访问网页时，他们倾向于使用如 `Zoomtext` 之类的工具，将页面内容放大至高达 300%。


    验证网页内对象的颜色对比度非常重要，`WCAG`（针对欧盟）Section 508（针对美国）已指示在普通模式下满足 `4.5:1` 的颜色对比度比例，并在放大模式下满足
    `3:1` 的比例！


    **QA（质量保证）注意：**


    如果一张图片在普通模式下的颜色对比度为 `4.3:1`，但在 300% 放大下符合 `3:1` 比例，这是否意味着存在缺陷？


    是的。这是一个缺陷，因为它没有满足普通模式下 `4.5:1` 的最小比例。


    如果一张图片在普通模式下的颜色对比度为 `5:1`，但在 250% 放大下符合 `3:1` 比例，这是否意味着存在缺陷？


    不是。


    如果图片在网页视图中出现在页面 `top left`，但在移动视图下放大到 300% 时变为 `top center`，这是否意味着存在缺陷？


    这实际上取决于规范。如果有规范规定放大 250% 后将页面转换为移动视图，那么必须在用户故事（或规范）中说明对图片的预期以及它出现的位置。


    原因：移动视图较短，用户无法以与网页视图相同的尺寸查看网页。


    ### 1.11 顺序正确的标题


    当残障用户打开网页时，必须读出 URL，并且用户的每次 `TAB` 键都应按顺序引导至标题，如 `Header 1`、`Header 2` 等。


    示例：如果页面阅读器（如 `JAWS`）在从 `H1` 导航后读出 `H3`，这在维护 HTML 属性方面是不正确的。


    **案例研究：** Mark 因患糖尿病性视网膜病变导致视力障碍，他正在进行常规在线购物，并使用杂食品零售商的在线门户网站将 15 件产品加入购物车。当他决定付款时，他想交叉检查购物车中的物品列表，他借助
    `NVDA` 和键盘操作导航到购物车图标，并成功按了 `ENTER` 键，引导他进入了购物车页面。当页面加载后，`NVDA` 一次性读出了整个页面内容，他通过列表链接功能导航到特定产品。不幸的是，他无法通过
    `TAB` 键导航到产品（使用 `INSERT+F7`）。


    **解决方案：** 为购物车添加链接或标题（2 级或 3 级）会让 Mark 的生活变得轻松！


    **测试范围：** 如果购物车代码因添加链接或标题而发生更改，则必须跨桌面、平板电脑和移动设备进行测试。


    ### 1.12 构建无障碍测试手动测试用例


    建议测试用例侧重于涵盖 `WCAG` 2.0 的四项原则：感知（Perceivable）、可操作（Operable）、理解（Understandable）和健壮（Robust），并在测试场景中涵盖
    `A`、`AA` 和 `AAA` 等成功标准。


    将无障碍测试集成到敏捷测试项目中。


    当一个用户故事开发完成并在敏捷看板的 `TO DO` 列表中等待时，必须由业务分析师/测试人员对无障碍测试范围进行评估。


    书中讨论的迭代周期：


    ```

    BACKLOG > BLOCKED > TO DO > STORY KICK OFF > IN DESIGN > IN DEVELOPMENT > READY
    FOR TEST > IN TEST > DONE

    ```


    如果故事已移至 `Story kick off` 会议，必须与参与的开发者和利益者者分析并讨论相关的 `WCAG`/Section 508 指南，以便无障碍测试输入进入
    `验收标准` 列表！


    **良好示例：**


    如果用户故事是作为敏捷项目的一部分开发链接，验收标准可以包含以下要点：


    - 必须满足 WCAG 2.4.4（链接含义）成功标准。


    **错误示例：**


    验收标准：‘必须验证列表链接’


    原因：


    当链接被开发后，QA 必须使用 `JAWS` 导航到链接并理解在 Internet Explorer 中读出的内容；同样，在 Firefox 中使用 `NVDA`
    进行类似的测试。


    同样，QA 使用列表链接验证新开发的链接是否出现在列表中，选择它并按下 `Activate` 键是否真的点击了该链接。


    最后，悬停在链接上并查看悬停时显示了什么文本（HTML 属性：对象的 `title` 将被显示为 `hover over text`）。


    在移动设备上：


    启用语音设置导航到链接并收听读出的文本。


    因此，仅测试列表链接并不能证明测试是完整的！


