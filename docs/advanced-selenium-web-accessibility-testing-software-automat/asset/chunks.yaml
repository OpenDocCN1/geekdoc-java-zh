  trans: "\n无障碍相关的缺陷会导致残障用户遭受痛苦和不便；诸如色彩对比度差等缺陷会给低视残障用户带来更大的痛苦，并对其视力造成进一步损害；进行无障碍测试不仅是我们的职责，防止任何电子设备出现无障碍缺陷也是我们的首要责任，这有助于帮助残障用户获得良好的体验！\n\
    \n对于领先组织而言，创建与无障碍测试相关的业务分析、设计、开发和测试工作是“极其”重要的，‘高度”建议招聘残障用户参与无障碍测试培训并测试 Web 应用程序以发现缺陷，尽早测试并在无无障碍缺陷的情况下发布将具有更大的优势！对功能测试专业人员进行无障碍培训将帮助他们掌握\
    \ Web 无障碍标准，执行无障碍测试任务，并减少每次产品发布时的缺陷！\n\n作为一名领先的软件测试行业专家，我最近几天接触了世界领先的“无障碍测试员”以及他们的课程。在接受了\
    \ Chandrashekar Korlahalli（CBK 先生）和 Yamini Gupta 的无障碍测试培训后，我一直在进行测试用例设计、缺陷重测、缺陷优先级排序以及无障碍测试相关的代码分析。Manoj\
    \ Kumar（来自 Applitools）在 2017 年通过他的“自动化无障碍测试”网络直播课程启发了数千名观众，这使我开始实验无障碍自动化测试。在完成几次无障碍测试用例的手动执行后，我可以使用\
    \ `webdriverio`、`cucumber` 和 `gulp` 等工具编写自动化测试，并通过 `Jenkins` 流水线等持续集成/持续交付（CI/CD）解决方案运行这些自动化测试。衷心感谢阅读本书的读者。我诚恳请求是，如果还没有计划，请在测试任务中开始实施无障碍测试，以防止出现更多无障碍缺陷。我的愿景是通过我的公众意识讲座和此本书的发布，在全球范围内面向客户的软件项目中实施无障碍测试，从而为各种残障的客户创造一个公平的世界！\n\
    \n这本书可以送给“计算机科学”或“软件工程”专业的学生，帮助他们学习并在 IT 行业寻找工作！\n\n这本书也可以送给帮助视障和其他残障人士的慈善机构，以便他们将其分发给残障人士，让他们学习并在无障碍测试领域获得工作机会！如果组织招聘符合条件的残障候选人，将对他们及时测试并发现无障碍缺陷提供极大帮助！为了增加残障用户的就业能力，通过慈善机构和非营利组织为注册用户组织“无障碍测试”培训课程是一个很棒的主意，因此组织可以联系慈善机构来对接接受过培训的用户进行招聘。\n\
    \n希望你喜欢这本书，请不要忘记在 Amazon 等在线零售商网站上对这本书提供带有详细评论的反馈。\n\n我承诺通过这本书为残障用户创造一个更好的世界——希望在您的帮助下，通过强大的无障碍测试覆盖，将技术触角延伸至这些特殊用户！\n\
    \n## 缩写\n\n| AC | Acceptance Criteria | 验收标准 |\n| :--- | :--- |\n| AUT | Application\
