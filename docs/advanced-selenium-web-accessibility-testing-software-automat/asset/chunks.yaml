    #### 4.3 Achecker 在线工具](#contents.xhtml_c4.3)


    访问 achecker.ca 网站并输入网站以检查任何无障碍问题。例如，请输入 [`github.com`](https://github.com) 并按回车（在网页
    URL 下方）。


    这将几秒钟内根据 WCAG 标准提供网站的已知问题列表。此工具将帮助检查单页的无障碍问题；


