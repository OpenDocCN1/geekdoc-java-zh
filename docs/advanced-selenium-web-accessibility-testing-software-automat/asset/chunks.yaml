- fmt: '

    Early test automation on agile testing: `Pa11y`/`Axe`/`Total Validator`/`Fire
    eyes` can be used to scan the whole page when the full page of some part of the
    page has been developed! So, the respective ‘user story’ has to be tested (when
    it is moved from ‘In Development’ to ‘Ready for Test’) with `Pa11y` to scan the
    page and provide errors, warnings and recommendations.


    **Challenge**: `Pa11y` helps in scanning particular page when URL has been provided.
    If the application is to be scanned after login or authentication, `pa11y` won’t
    help as of today.


    **Solution1**: it has to be scripted part of another tool called `pa11y-ci` hence
    the login part taken care of java program and then scanning particular page after
    authentication can be instructed on code level.


    **Solution2 (Preferable)**: `AXE` can navigate to particular page and scan the
    elements against `WCAG` /`Section 508` standards after authentication.


    ## 1.12.1 Example of a Test Case in Good Format


    **Test Case Name**: `01_NFT_Accessibility_FFXNVDA_Verify_Google_Search`.


    **Test Description**: `H44` and `H32` `WCAG` standards are verified on the web
    page [www.google.com](http://www.google.com) using Firefox and `NVDA`.


    **Pre-requisite**: Install `NVDA` (open source) and Firefox quantum `58.0.2` on
    the Windows 10.


    **Test Step 1**: Open `NVDA` on a Windows 10 operating system and use earphone
    to hear the voice provided by `NVDA`.


    **Expected Result 1**: `NVDA` should be opened successfully and contents read
    out clearly by `NVDA` to user.


    **Test Step 2**: Open Firefox Quantum (version `58.0.2` (64-bit)) on a Windows
    10 operating system.


    **Expected Result 2**: Firefox should be opened successfully.


    **Test Step 3**: Launch [www.google.com](http://www.google.com) website.


    **Expected Result 3**: Google search page should be opened and URL should be read
    successfully by `NVDA`.


    **Test Step 4**: Navigate from URL to text box using `TAB` key of keyboard on
    the Google search page.


    **Expected Result 4**: `NVDA` should read the details of the text box.


    **Test Step 5**: Enter text within the text box.


    **Expected Result 5**: Text entered on the text box should be read out clearly.


    **Test Step 6**: Press `TAB` key to navigate to Search Button.


    **Expected Result 6**: Submit button should be read clearly.


    **Test Step 7**: Press `ENTER` on the Search button.


    **Expected Result**: `NVDA` should read the search results clearly.


    ## 1.12.2 Bad Test Case


    **Test Case Name**: `01_NFT_Accessibility_IEXNVDA_Verify_Google_Search`.


    **Test Description**: `H44` and `H32` `WCAG` standards are verified on the web
    page [www.google.com](http://www.google.com) using Internet Explorer 11 and `NVDA`.


    **Reason**:

    `NVDA` doesn’t go well with Internet Explorer hence it is advisable to use `JAWS`
    for this test case to verify accessibility on Internet Explorer.


    ***


    # CHAPTER 2


    ## Shift Left Testing


    Performing software testing during agile sprint-based developments and moving
    testing activities to early stages of development is a best practice and trend
    across testing industry from the year 2017.


    ### 2.1 Early Shift Left Quality Assurance


    Stages of Agile sprint-based development are split across six stages to describe
    examples in this book. Every sprint varies from two weeks to four weeks based
    on team decisions but majority of the sprint-based teams follow similar phases
    of development in their teams hence following stages are provided to explain how
    best accessibility testing can be tested early in life cycle?


    - **TO DO**: Analyze the level of accessibility testing needs for the story when
    it listed under ‘TODO’ list.

    - **STORY KICK OFF**: Discuss the types of accessibility testing needed and update
    `WCAG`/`Section 508` classifications (to be tested) on acceptance criteria of
    the user story (by BA/testers).

    - **IN DESIGN**: Design in line with `WCAG`/`Section 508` standards (developers/design
    engineers); Design accessibility test combinations (testers).

    - **IN DEVELOPMENT**: Develop the `html` properties to facilitate better accessibility
    and perform local tests in development boxes using `JAWS` or `NVDA` (by developers);
    Develop manual accessibility test cases(testers).

    - **READY FOR TEST**: QAs Scan the page using `Pa11y` (if it is single page accessible
    by URL) or `AXE` (if the page is located after authentication or after multiple
    page navigations/actions). Once scanned provide the scan report and discuss along
    with developers to remove false positives identified during page scan. Once issues
    resolved at this stage, the application under test (`AUT`) is actually ready for
    test execution hence move forward to ‘IN TEST.’

    - **IN TEST**: Execute the manual accessibility test cases using `JAWS`, `NVDA`,
    `Zoomtext` and other tools to validate the accessibility of the `AUT`. Once manual
    test cases executed and test failures(defects) are fixed, automate the subset
    (up to 30 percent) of tests using `webdriverio` for ‘Automated Accessibility Tests’
    to run as part of regression tests. So, QA need not have to rerun the manual test
    case on the particular story when automated tests run and identify defects as
    part of CI/CD pipeline! Once manual test execution completed/automated tests are
    created and executed at least once/defects are fixed, prove the test evidence
    by discussing with Business Analyst, Product Owners and Developers Hence Scrum
    Master or Business Analyst or Product Owner can move the user story to DONE (based
    on Definition of Done (DoD) and Responsibilities within).


    ### 2.2 Accessibility Testing in Agile Projects


    When projects are developed completely in agile methodology, it is advisable to
    start implementing accessibility tests early in life cycle. Following are some
    of the examples that proves the step by step move of accessibility tests from
    right most end to left most end.


    **Step 1**: Test the `AUT` during ‘In Test Phase’:


    | Backlog | To Do | Story Kick-off | In Design | In Development | In Test | Done
    |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | | | | | | Manual Accessibility Testing | |


    **Advantages**:

    - `AUT` can be developed fast and deployed for testing.

    - `AUT` is available for accessibility testing and defects can be raised to track
    those accessibility issues.

    - `AUT` can be redeployed after fixing majority of accessibility testing issues
    identified part of testing process.


    **Disadvantages**:

    - `AUT` is not scanned by tools as `axe` or `Pa11y` earlier in life cycle and
    this cause list of defects which are getting introduced during ‘In Test.’

    - Performing retesting of accessibility during ‘In Test’ after defect fixes are
    highly manual, time consuming and tedious process.

    - If there are design issues (such as header 1 missing or sequence of information
    is incorrect due to complex design, and so on) can be retained part of code since
    the design phase has been crossed already.

    - Story living part of ‘In Test’ can be longer than usual due to list of defects
    raised related to accessibility.


    **Step 2**: Scan `AUT` during ‘In Development Phase’ and test the `AUT` during
    ‘In Test Phase’:


    | Backlog | To Do | Story Kick-off | In Design | In Development | In Test | Done
    |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | | | | | Accessibility Scanning | |

