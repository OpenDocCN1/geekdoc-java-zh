    ### My Grand Mother

    For teaching me important lessons including the strong need of accessibility for
    everyone.


    ## Abstract

    If you are searching a topic on Google or buying a product online, web accessibility
    is a basic need! If a web page is better accessible through mouse and complex
    to navigate with keyboard are extremely difficult for users with disabilities.
    Web Accessibility Testing is a most important testing practice for customer facing
    web applications.


    This book explains about the steps to write manual accessibility tests and convert
    them into automated selenium-based accessibility tests to run part of regression
    test packs. `WCAG` and Section 508 guidelines are considered across the book while
    explaining the test design steps.


    Software testers with accessibility testing knowledge are most wanted for large
    organizations since the need to do manual and automated accessibility testing
    is growing rapidly! This book best illustrated the types of accessibility testing
    with test cases and code examples.


    ## KeyWords

    selenium testing; accessibility testing; web accessibility; pa11y; manual testing;
    automation testing; visual testing; `WCAG`; automated accessibility testing; non-functional
    testing


