    [Accessibility Certifications](#contents.xhtml_c16)


    Two types of certifications available for professionals to prove their ­proficiency
    in accessibility from International Association of Accessibility Professionals
    and preparation instructions can be referred at:


    [https://accessibilityassociation.org/certification](https://accessibilityassociation.org/certification)


    Websites adhere to accessibility standards can apply to WebAIM in order to receive
    site certification and more details are available at:


    [https://webaim.org/services/certification/](https://webaim.org/services/certification/)


