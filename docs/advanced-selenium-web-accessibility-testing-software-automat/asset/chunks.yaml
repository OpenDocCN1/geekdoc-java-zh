    ## 使用 Taurus 和 Selenium 进行并发测试


    Taurus 是运行 selenium 自动化测试并行或并发测试的最佳工具之一。这意味着它可以使用自动化测试脚本（最初为自动化测试编写的脚本）来运行性能测试。


    在运行“并发测试”时，可能会发现任何缺陷，例如区域未对齐、对象问题、禁用的文本框或隐藏区域，这些缺陷在功能测试期间通常无法发现的。


