    # CHAPTER 18: Accessibility Testing During “Design” Stage


    Designing for yourself or your clients-accessibility is mandatory! All three elements
    should be focused to comply with accessibility standards:


    *   Design

    *   Development

    *   Content


    ### Testing applications to serve users with vestibular disorder.


    It is highly recommended to test applications and verify animations with following
    checklists: Allowing users to turn animation or flash content off?


    *   Application doesn’t rely fully on animation?

    *   Application built with logical start and end states?

    *   Avoid using motion and tried using dissolve transitions?


    If answered YES for all the aforementioned questions, then the test is pass for
    accessibility tests during design stage.


    ## 18.1 Designing the Application to Serve Customers with ‘Color Blind’


    Assume that the website selling bed sheet in three different colors Red, White,
    and Blue; While displaying the colors on the product page, bed sheet image has
    been displayed followed by three colors in squares with radio buttons.


    What is the potential defect?


    If multiple colors are provided on the page, it will be easy to choose the right
    color for normal user but all colors look same for users with color blindness.


    **Recommendation:** Colors should be associated with texts next to it about the
    respective color names to let users with disability to listen and understand color
    differences.


    ## 18.2 Designing and Testing Applications with Animation and Motion Sensitive


    User animations responsibly to avoid accessibility issues and make sure application
    doesn’t rely on animations; Pattern-sensitive users find it difficult when applications
    using flash!


    ### 18.2.1 Testing Focus Indicators on Web Pages


    When users having diseases such as Arthritis, they don’t use mouse most of the
    times and rely on keyboards in accessing web applications. Also, cursor movement’s
    changes when every keyboard action has been changed. So, indicating where the
    focus on the web page is very important and very useful if the user has partial
    visibility.


    Better code design to improve keyboard actions: Assume that the sections on web
    page are provided with following html:


    ```html

    <div onclick="clickIt()">

    ```


    While users are trying to access the section using mouse, it is possible to click
    on web components but not possible to select the items using keyboard. So it is
    highly advisable to get the code altered to:


    ```html

    <div href="#link" onclick="clickIt()">

    ```


    ### 18.2.2 How to Avoid Keyboard Traps?


    Assuming that customer filling a registration form on the web page and keeping
    the tax number as empty when this field is a mandatory field and there is an error
    message stating that the user should enter tax number before navigating to other
    sections of the page. When user try to press `TAB` or `SHIFT+TAB` using keyboard,
    it is not letting user to navigate away from this text box. If user is using mouse,
    it is possible to click on other text boxes by mouse click event but not possible
    to move anywhere using keyboard. Issue: User is completely trapped in this situation
    and the defect is known as ‘keyboard trap.’


    **Fix:** It is highly recommended to define tabbing patterns by designers and
    get it shared to developers and testers hence keyboard traps can be easily identified
    and prevented in the code.


    ### 18.2.3 Touch-Friendly Interfaces


    Assuming when user goes idle for some time, page displays ‘Tap anywhere to continue’
    is displayed on a web page while accessing from laptop and user clicks on any
    location of the web page and the page gets activated again. If the same page is
    accessed by users using assistive technologies such as JAWS or NVDA, how will
    a user can click or Tap anywhere on the page to continue?


    **Solution:** Instead ‘Tap anywhere to continue’ it should be a button (such as
    ‘Click Here’ or ‘Continue’) with link associated hence user can choose this by
    Listed Links of JAWS or NVDA.


