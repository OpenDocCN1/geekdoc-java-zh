    信息技术行业一直在快速发展，迫切需要残障人士或身体受限的工程师向前一步，指出他们在日常生活中访问的网页中存在的问题！当我遇到一位双眼 2 级低视的朋友时，他表达了由于无法使用移动端旁读（voice
    over）导航到网页的预期部分，在访问职业网站时的挫败感。同样，另一位身材矮小的朋友在录音器仅读取了有限文本的情况下，无法理解 ATM 银行机的旁读以导航到下一个屏幕，而且很难看清
    ATM 屏幕上的显示内容。对于普通测试人员来说，发现这些 bug 极其困难，而具有相似残障的工程师可以轻松发现这些缺陷并将其记录在“无障碍缺陷列表”中，因此，近期对残障人士测试员的需求日益增长。


    当我向英国伦敦中心的一组工程师演示基于 `selenium` 的自动化无障碍测试时，观众中有几个人实际上参加了会议，目的是为了给他们的软件团队招聘工程师！寻找无障碍测试合适资源的主要挑战，是软件测试人员对《网页内容无障碍访问指南》（WCAG）标准的认知。尽管
    WCAG 已经在网站上记录了大量示例，但基层并没有足够的经验项目工程师来解释如何实施。本书的编写目的是为了解释手动测试和自动化测试中几种无障碍测试的实现可能性。自动化测试框架使用了
    `JavaScript` 来在全书中展示测试示例，因为 `NodeJS` 生态正在随着各种“奇妙”的测试自动化工具（如 `webdriverio`、`backstopJS`
    和 `cucumberjs`）而增长；书中也提供了一些 Java 编程示例，但重点更多在于“无障碍测试”而非“自动化测试”。如果读者想学习更多自动化测试代码示例，强烈建议阅读我之前关于《软件自动化测试秘密揭秘第
    1 和第 2 部分》的著作。


    ## 1.1 手动测试的未来


    IT 行业内部存在争论，认为手动测试将消失，自动化测试将接管大部分工作！这是未来走向更多测试自动化的真实趋势，但了解无障碍测试的手动测试员预计在不久的将来将作为小众资源存在！


    符合 `WCAG` 或 `section 508` 等国际标准是大型面向客户组织的强制性需求之一。当需要满足无障碍要求时，迫切需要聘用对无障碍有丰富经验、并能进行此类无障碍需求测试的手动测试员。


    当 `selenium` 和 `UFT` 等自动化测试工具需求巨大时，市场也在寻找具有 `JAWS` 或 `NVDA` 无障碍测试经验的手动测试员。


    残障用户经常使用如 `JAWS` 或 `NVDA` 等语音辅助工具访问桌面端的网站或应用程序，以便听到来自网站的声音。当使用手机时，`talkback` 是听取特定网站语音和从移动端访问任何应用程序的知名选项之一。


    并不是所有的无障碍测试都能使用 `selenium` 等工具实现自动化！这是一个充分的原因。因为，在访问被测试应用程序（AUT）时，无障碍测试的经验至关重要。与其依赖自动化的无脑工具为测试用户执行操作，这可以探索更多的无障碍问题。


    ## 1.2 如何体验或学习无障碍测试？


    如果你对学习无障碍测试感兴趣，只需在 Google 上搜索“NVDA”并将其安装在桌面上，即可开始使用它对网站或需要验证无障碍需求的 AUT 进行每一次键盘移动操作！


    推荐读者在 YouTube 上观看标题为“NVDA: The free software empowering blind people world-wide”的
    `NVDA` 相关视频，URL：`https://youtube.com/watch?v=Ks7AwV_uxO0`


    在桌面端使用 `NVDA` 或 `JAWS` 时，请读者避免使用鼠标，或至少在目标 AUT 上减少对鼠标的使用，以验证应用程序的特性。


    ## 1.3 无障碍测试


    视障或“身体受限”（本节中使用该术语称为“特殊用户”）等残障用户需要无障碍网页应用程序以方便使用。这已作为《网页内容无障碍访问指南》（简称“WCAG”）/通用服务管理局第
    508 条（简称“Section 508”）的一部分详细提出。在为网页应用程序提供无障碍功能时，为页面的每个部分提供适当的并在网页上提供最佳用户体验是非常重要的。


    注意：视力障碍有疾病控制与预防中心（CDC）指定的分类，它并不是对应用程序进行无障碍测试的唯一主要原因。无障碍确保了残障特殊用户可以访问与普通用户相同的网页。


    导致视力障碍的主要原因：


    * 未矫正的屈光不正

    * 白内障

    * 糖尿病视网膜病变

    * 角膜混浊

    * 胎形眼

    * 黄斑变性（与年龄相关）

    * 青光眼


    无障碍测试中有一个常见的误区，认为测试主要是为了视力障碍客户执行的。但并不是执行无障碍测试的唯一需求，因为在测试时还必须考虑以下类型的障碍：


    * 听力

    * 言语

    * 视觉

    * 认知

    * 神经

    * 物理


    案例研究：患阿尔茨海默病等神经系统障碍患者对 `www.dementiablog.org` 的网页访问。


    该网站已使用 `Total Validator Pro` 经过验证，按住 `CTRL` 和 `–` 将分别增加或减少页面字体大小，此信息已提供：`www.dementiablog.org/accessibility/`


    ### 1.3.1 如何判断应用程序何时需要无障碍测试？


    如果应用程序以任何可能的方式面向客户，建议进行无障碍测试，以确保应用程序符合 `WCAG`/Section 508 标准。


    ### 1.3.2 如何通过测试来验证网页应用程序是考虑到这些特殊用户开发的？


    通过残障客户使用 `JAWS`、`NVDA`、`ZoomText`、`Windows Magnifier`、`Web Accessibility Toolkit`
    等辅助技术访问网页的方式进行测试。


    ## 1.4 JAWS 辅助技术


    '
- fmt: '

    JAWS(licensed) is a famous tool used by visually challenged users across the world!
    Approximately 90 percent of web accessible special users are using JAWS to read
    out the web contents to interact with the applications. If a special user wants
    to login to a web page, JAWS is installed on the desktop and launched along with
    web login page using Internet Explorer (since JAWS works well with IE browser
    versions only). So, JAWS read out the login page contents when pressing keyboard
    `TAB`, `DOWN` or `UP` arrows and facilitating user navigation. If user want to
    open a web page in Firefox, it is preferable to use another tool known as `NVDA`
    (open source) which reads similar to `JAWS` for IE. If user wants a web page to
    open in chrome, `NVDA` works better but using Firefox for `NVDA` is most preferable.


    ### 1.5 JAWS Installation


    Freedom Scientific (2008) JAWS Screen Reading Software [Web log post] Retrieved
    from [https://freedomscientific.com/Downloads/JAWS](https://freedomscientific.com/Downloads/JAWS)


    Note: Once `JAWS` has been installed and opened on the computer, it may prevent
    opening Google chrome or any other browser (except Internet Explorer); Similarly
    opened chrome browsers will get closed automatically since `JAWS` is opened for
    reading the screen. So, it is advisable to use Internet Explorer as preferred
    browser for web applications while using `JAWS`. If `JAWS` 18 throws error in
    installation with Windows 10 operating system, try installing older version such
    as `JAWS` 16.


    ### 1.6 Testing Links on the Web Pages


    If there is a link provided on particular web page to navigate to different page
    (in a new window), navigating to this link should read something similar to:


    ### 1.7 Clickable Link Opens a New Window


    When `JAWS` read this content while navigating to the link will help special user
    to understand pressing `ENTER` using keyboard (or clicking on the link) leads
    to opening a new window and cursor or focus moves to new window!


    **Notes to developers:**


    HTML property: `href` of a particular object facilitates `JAWS`/`NVDA` to read
    out the object as clickable. So, providing right text on `title` or `aria-label`
    fill facilitate a better accessibility to special users.


    ### 1.8 Contents Next to Links


    If the focus is on the links, special users press `DOWN` key from keyboard to
    move to contents below those links on a given page. Since most of the special
    users rely on keyboard (not mouse) the page has to work as expected when navigating
    using keys from keyboard.


    **Notes to developers:**


    `Title`, `aria-label` or `class` of each object has been read out by `JAWS`/`NVDA`
    tools hence updating clear and relevant texts on `aria-label` for each object
    facilitate a better accessibility.


    ### 1.9 Listed Links


    `JAWS` users are familiar with keyboard shortcuts such as listed links functionality
    (`INSERT+F7`). These same keyboard shortcuts work in `NVDA` as well. Pressing
    on `Insert+F7` on a web page opens a new window of `JAWS` and listing all possible
    links of the web page. So, user can select particular link and press `ACTIVATE`
    key from listed links which in turn perform click action on the link.


    ### 1.10 Color Contrast Verification


    When visually impaired users access the web page, they prefer tools such as `Zoomtext`
    which zooms the page contents up-to 300 percent.


    Verifying color contrast of objects within the web page is important and meeting
    `4.5:1` ratio of color contrast in normal mode and meeting `3:1` ratio in zoomed
    mode has been instructed by `WCAG` (for EU)/Section 508 (for USA)!


    **Note to QA:**


    If an image got color contrast of `4.3:1` in normal mode but it does match `3:1`
    ratio in 300 percent zoom, does that mean a defect or not?


    Yes. It is a defect since it is not meeting minimum of `4.5:1` ratio in normal
    mode.


    If an image got color contrast of `5:1` in normal mode but it does match `3:1`
    ratio in 250 percent zoom, does that mean a defect or not?


    No


    If an image appears on `top left` of the page during web view but changes to `top
    center` when zoomed to 300 percent in mobile view, does that mean a defect or
    not?


    It depends on the specification really. If there is a specification to convert
    the page to mobile view after 250 percent zoom, it has to be instructed on the
    user story (of specification) on what to expect for the image and where it appears?


    Reason: Mobile views are short and user can’t see the web page in the same size
    of web view.


    ### 1.11 Headers in Order


    When special user opens a web page, URL has to be read and every `TAB` from user
    should leads to headers in order such as `Header 1`, `Header 2`, and so on.


    Example: If the page reader (such as `JAWS`) reads of `H3` after navigating from
    `H1` which is incorrect to maintain HTML properties.


    **Case study:** Mark has poor vision due to diabetic retinopathy and he is doing
    regular online shopping and added 15 products to the shopping cart using online
    portal of grocery retailer. When he decided to pay for the products, he wanted
    to cross check the list of items on the shopping cart and he navigated to shopping
    cart icon with the help of `NVDA` and keyboard actions, he managed to press `ENTER`
    which directed him to land in shopping cart page. When the page has been loaded,
    `NVDA` read the whole page contents in one go and he is trying to navigate to
    each product he wanted to read specifically. Unfortunately, the products are listed
    on the page as texts and he is unable to navigate to each product using `TAB`
    key or Listed Links option (using `INSERT+F7`).


    **Solution:** Adding each product as a link on shopping cart or alternatively
    adding each product as header (`2` or `3` based on the page hierarchy) would have
    made the life easy for Mark!


    **Testing Scope:** If the shopping cart code has been altered by adding links
    or headers for products, that has to be tested across desktop, tablet and mobile
    devices to make sure the navigation is consistent and appropriate.


    ### 1.12 Constructing Manual Test Cases for Accessibility Testing


    Test cases are suggested to focus on covering four principles of `WCAG` 2.0: Perceivable,
    Operable, Understandable, and Robust within test steps or test scenario level.
    Importantly, it has to cover success criteria such as `A`, `AA`, and `AAA` on
    Expected results.


    Integrating accessibility testing part of agile testing projects.


    When there is a user story developed and awaiting on sprint board (in `TO DO`
    list), this has to be evaluated by business analyst/testers for accessibility
    testing scope.


    Sprint Cycle discussed in this book:


    ```

    BACKLOG > BLOCKED > TO DO > STORY KICK OFF > IN DESIGN > IN DEVELOPMENT > READY
    FOR TEST > IN TEST > DONE

    ```


    If the story has been moved to `Story kick off` meetings, relevant `WCAG`/Section
    508 guidelines has to be analyzed and discussed along with developers and stakeholders
    involved in the story kick off hence the accessibility test inputs goes to `Acceptance
    Criteria` list!


    **Good Example:**


    If the user story is to develop a link as part of the agile project, the acceptance
    criteria can include following point:


    -WCAG 2.4.4(Link Purpose) success criteria has to be met.


    **Bad Example:**


    Acceptance Criteria: ‘Listed links has to be verified’


    Reason:


    When a link is developed, QA has to use `JAWS` to navigate to link and understand
    what has been read out within Internet Explorer; Similar test has to be conducted
    on `NVDA` using Firefox.


    Similarly, QA use Listed Links to verify if the newly developed link appeared
    on the list and selecting it and pressing `Activate` actually clicking on the
    link or not.


    Finally hover over the link and see what text has been appeared on the hover over
    text (html property: `title` of the object would have been displayed as `hover
    over text`).


    In Mobile devices:


    Enable voice settings to navigate to link and listen to the text has been read
    out.


    Hence testing only listed links would not prove a complete test!

