    While testing web applications, if testers find complex content which are hard
    to read, they should raise this to Business Analysts part of accessibility testing.
    Developers should avoid complex texts and make it simple to read and understand
    the content on the web page. If the content is complex in nature and hard to read
    and understand the purpose of it, it may not be considered as defect since developers
    develop the page exactly how it has been instructed from user stories or requirements
    documents. In such cases, these clarifications can be raised as ‘Issue’ or ‘Recommendations’
    of defect tracking system to get clear instructions on how to make it better.


    ## 9.1 Example: Input Assistance on a Login Page


    If a user is trying to login on a web page with user id and password, error messages
    and instructions should be displayed to users at right time. If user entered user
    id and left the password text box blank, the error message should be appropriate
    and suggest user to fill password to continue login. Similarly, pressing `TAB`
    key using keyboard should assist users to navigate from user id text box to password
    text box navigations. If user want to navigate backwards using `Shift+Tab` key,
    there should be clear navigation instruction provided to users through audio.
    Pressing `Shift+Tab` from password field, should reach `user id` field and speech
    assistance should read details about user id field to user. If user entered invalid
    user id and password and clicked on login button should be provided with valid
    error message to re-enter valid user id and password details. When user is provided
    with error message on screen but failed to read out using speech over, it is an
    accessibility defect since users with assistive technology such as `JAWS` or `NVDA`
    will not know what kind of error has occurred during the login process. Following
    test case is one good example to validate this login process:


    ```

    1.19.1_NFT_Accessibility_FFXNVDA_Verify_School_Student_Assingment_website_login

    ```


    **Test Description:** Following WCAG standards are verified on the web page using
    Firefox and NVDA while login to the web page.


    ### 3.3.3 Error Suggestion


    ### 9.1.1 Reference


    W3C 2016. “Input Assistance: Understanding Guideline 3.3.” Web Log Post. Retrieved
    from [https://w3.org/TR/UNDERSTANDING-WCAG20/minimize-error-suggestions.html](https://w3.org/TR/UNDERSTANDING-WCAG20/minimize-error-suggestions.html)


    **Pre-requisite:** Install `NVDA` (open source) and `Firefox quantum 58.0.2` on
    the Windows 10


    **Test Step 1:** Open `NVDA` on a Windows 10 operating system and use earphone
    to hear the voice provided by `NVDA`


    **Expected Result 1:** `NVDA` should be opened successfully and contents read
    out clearly by `NVDA` to user.


    **Test Step 2:** Open `Firefox Quantum` (version `58.0.2` (64-bit)) on a Windows
    10 operating system


    **Expected Result 2:** `Firefox` should be opened successfully.


    **Test Step 3:** Launch Student Assignment website login portal


    **Expected Result 3:** Students login page should be opened and URL should be
    read successfully by `NVDA`


    **Test Step 4:** Press `TAB` key to navigate to user id field to enter valid user
    id and press `TAB` key again to enter invalid password and enter another `TAB`
    key to navigate to Login button and press `Enter`


    **Expected Result 4:** `NVDA` should read out about the same error message displayed
    on the screen which should be understandable and valid error message to correct
    the password entered.


    ## CHAPTER 10


    ### Testing WCAG Accessibility Standard—Robust


    When readers reading a content from web application using `JAWS`, the content
    should be reliable enough to provide details of sections and reader should have
    similar experience when using `NVDA` and mobile device-voice over mode!


    **Case study:** Hema is 15 years old and affected by `Dyslexia`, common learning
    difficulty with reading, writing and spelling. She login to her school online
    account to access assignments and read the assignments list using `NVDA` audio
    and ‘speech viewer’ options. While reading the assignments section, she pressed
    `INSERT+F7` keyboard actions to see listed links of entire page in which assignments
    listed as links and she navigate to each link where she needs to attend them and
    complete for a particular week. The student online application has undergone software
    upgrade and visually no change to the assignments page. It is clearly visible
    when using from computer but ‘Listed Links’ from `NVDA` display and read URLs
    of link rather than providing details about the link in text format. If she accesses
    the same page from mobile, voice over of mobile reads the links clearly from mobile
    view. But she could not download relevant assignments from mobile hence she depends
    on laptop device to download and access her assignments. What is the exact defect
    on the application or is there an accessibility defect on the page or not?


    **Defect:** Each link of assignments within assignments page are not updated with
    `title` within HTML properties. Every link on web page are provided with `href`
    which acts as a link to target page to proceed on opening the assignments. If
    html has been provided with `title` for each link, it displays that relevant information
    of title part of ‘Listed Links’ whereas links developed without `title` result
    in displaying just URLs from `href` of html properties hence the bug is on html
    DOM properties of the student web application.


    **Suggested Fix:** Add `title` for each link of the web page which should be unique
    and consistent for each link. If there are two assignments with same name, `title`
    of each assignment should be unique, meaningful such as ‘assignment 1’ and ‘assignment
    2’, and so on.


    ## 10.1 Importance of Name, Role, Value on Public Websites


    All form elements, text boxes, links, buttons, images and other components of
    the web page should be available with name, roles (such as button, link or text
    box, and so on) and value within html properties.


    **Example:**


    Updating html properties such as `title`, `aria-label` would help in providing
    best experience while accessing the page with assistive technologies such as `JAWS`,
    `NVDA`, and so on.


    More examples are available at: [https://w3.org/TR/WCAG20-TECHS/ARIA16.html](https://w3.org/TR/WCAG20-TECHS/ARIA16.html)


    Sample Test Case on Student Assignment Webpage for WCAG-Robust Guidelines


    ## 10.2 Test Case for NVDA


    ```

    1.19.1_NFT_Accessibility_FFXNVDA_Verify_School_Student_Assingment_website

    ```


    **Test Description:** Following WCAG standards are verified on the web page using
    Firefox and `NVDA`


    ### 4.1.2 Name Role Value


    ### 10.2.1 Reference


    W3C 2016. “Name, Role, Value: Understanding SC 4.1.2.” Web Log Post. Retrieved
    from [https://w3.org/WAI/WCAG21/quickref/?versions=2.0&showtechniques=412#name-role-value](https://w3.org/WAI/WCAG21/quickref/?versions=2.0&showtechniques=412#name-role-value)


    **Pre-requisite:** Install `NVDA` (open source) and `Firefox quantum 58.0.2` on
    the Windows 10


    **Test Step 1:** Open `NVDA` on a Windows 10 operating system and use earphone
    to hear the voice provided by `NVDA`


    **Expected Result 1:** `NVDA` should be opened successfully and contents read
    out clearly by `NVDA` to user.


    **Test Step 2:** Open `Firefox Quantum` (version `58.0.2` (64-bit)) on a Windows
    10 operating system


    **Expected Result 2:** `Firefox` should be opened successfully.


    **Test Step 3:** Launch Student Assignment website


    **Expected Result 3:** Students page should be opened and URL should be read successfully
    by `NVDA`


    **Test Step 4:** Navigate from URL to assignments tab using `TAB` key and press
    `ENTER` of keyboard on the students’ main page


    **Expected Result 4:** Navigated to Assignments page and `NVDA` should read the
    details of the links, text boxes and any images should be read with the text alternatives.


    **Test Step 5:** Press `INSERT+F7` key to navigate to the listed links


    **Expected Result 5:** Listed Links should be displayed with complete links available
    on the page with details about each link with clear information.

