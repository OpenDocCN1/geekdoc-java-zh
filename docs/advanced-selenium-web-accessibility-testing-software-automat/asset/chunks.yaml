    ### 3.2 Accessibility Test Coverage Checklist-Story Kick-Off Stage](#contents.xhtml_c3.2)


    | Questions/Checklist for the User Storiesduring ‘Kick Off’ or ‘To-Do’ stage |
    Mandatory (M)/Optional (O) |

    | :--- | :--- |

    | Has Acceptance Criteria (AC) section updated with ‘Accessibility Guideline’
    number to be fulfilled?Ex: `WCAG 1.1.1` has to be met | M |

    | Each acceptance criteria of accessibility have been assigned to respective developer
    or tester? | O |

    | AC: Accessibility code scan (using `AXE` or `PA11Y`) to be performed by developer?
    | O |

    | AC: Accessibility Test Cases should be designed and completed before story moved
    to ‘Test’ | M |

    | AC: Automated accessibility tests are to be designed once manual testing is
    completed | O |

    | AC: Outcome of test execution as Recommendations/Issues/Defects | O |

    | Definition of Done: Definition of Accessibility Defect Severity 1,2,3 | M |

    | Definition of Done: Defining when to complete accessibility test execution |
    M |

    | Definition of Done: Procedure to ‘Defer’ Accessibility Defects to fix it or
    consider it in the future fixes and steps to raise ‘Waivers’ | M |


    ### 3.3 Accessibility Test Coverage Checklist-Design Stage](#contents.xhtml_c3.3)


    | Questions/Checklist for the User Stories in Design Stage | Mandatory (M)/Optional
    (O) |

    | :--- | :--- |

    | There should not be any ‘keyboard traps’ on any of the sections part of user
    story; In order to avoid keyboard traps, designers are suggested to provide navigation
    flow of forms to developers | M |

    | Application should not fully rely on animation. Animation content should be
    available with text alternatives | M |

    | Application should be built with logical start and end states? | M |

    | If application use motion, avoid using motion and try using dissolve transitions
    | M |

    | Color selections should be associated with text alternatives | M |

    | If application contains flash or animation or video kind of audio/video components,
    used simulation spectacles to test the application?Example: Vision Simulation
    Spectacles for:• Cataracts and Low Acuity• Tunnel Vision• Tunnel Vision and Low
    Acuity• Hemianopia• Diabetic Eye Disease• Macular DegenerationReference[http://optimalowvision.co.uk/product.cfm?prod=474&dept=479](http://www.optimalowvision.co.uk/product.cfm?prod=474&dept=479)
    | O |

    | If focus indicators and links are available on web application, has the application
    been tested using hand magnifiers? | O |

    | Are these questions answered by designers?• What is the overall purpose of this
    visual?• What is the best way to convey that?• Which parts of visual is decorative
    and need text alternative?• Which parts of images are functional images such as
    left, right arrows which needs text alternative? | M |

    | Audio descriptions are provided to media part of applications? Will that help
    deaf audiences to read and understand about the video? | M |

    | Every form fields such as check boxes and radio boxes are provided with a `<label>`?
    | M |

    | If application contains placeholders (such as Date of Birth field with grey
    colored texts as DDMMYYYY which disappear when the field is focused), has this
    placeholder designed to display below, above or right-hand side of the field rather
    than hiding it when focused? | M |


    ### 3.4 Keyboard Shortcut Versus Test Case Coverage Matrix](#contents.xhtml_c3.4)


    Test cases are to be mapped against each keyboard shortcuts supported by assistive
    technologies such as `JAWS` and `NVDA`.


    `JAWS` keyboard shortcuts can be found at: [https://webaim.org/resources/shortcuts/jaws](https://webaim.org/resources/shortcuts/jaws)


    `NVDA` keyboard shortcuts can be found at: [https://webaim.org/resources/shortcuts/nvda](https://webaim.org/resources/shortcuts/nvda)


    ### 3.5 Seven Accessibility Requirements Considerations for Better Test Coverage](#contents.xhtml_c3.5)


    While testing web applications or documents it is highly advisable to consider
    following areas of testing and generate test cases:


    1. Structure

    2. Figures

    3. Hyperlinks

    4. Lists

    5. Columns

    6. Color and Contrast

    7. Tables


    If testers can map their test cases to all these seven areas of web application
    or document, it would feasible to catch handful of defects in test case steps.
    The next step is to update test cases to cover maximum possibilities to validate
    these seven areas within the `AUT`.


    Reference


    U.S. Access Board. 2017\. “Comparison Table of WCAG 2.0 to Existing 508 Standards.”
    Web Log Post. Retrieved from [https://access-board.gov/guidelines-and-standards/communications-and-it/about-the-ict-refresh/background/comparison-table-of-wcag2-to-existing-508-standards](https://www.access-board.gov/guidelines-and-standards/communications-and-it/about-the-ict-refresh/background/comparison-table-of-wcag2-to-existing-508-standards)


    # CHAPTER 4](#contents.xhtml_c4)


    * * *


    ### Tools Installation](#contents.xhtml_c4)


    #### 4.1 Axe Core](#contents.xhtml_c4.1)


    Installation


    GitHub 2018\. “Accessibility Engine for Web Testing.” Reference [https://github.com/dequelabs/axe-core](https://github.com/dequelabs/axe-core)


    Update `package.json` file:


    ![Image](images/F001.jpg)

    Figure 4.1. `package.json` file opened from Webstorm.


    Install from terminal:


    ```bash

    npm install axe-core --save-dev

    ```


    ![Image](images/F002.png)

    Figure 4.2. Terminal of Webstorm after installation of axe core.


    #### 4.2 Axe Plugin for Google Chrome](#contents.xhtml_c4.2)


    Search in [www.google.com](http://www.google.com) for axe plugin which can be
    used along with Chrome:


    ![Image](images/F003.png)

    Figure 4.3. Google search on Axe plugin.


    Click on ‘Add to Chrome’ to add this plugin to Chrome:


    ![Image](images/F004.png)

    Figure 4.4. Axe Plugin for Chrome.


    When a page needs to be scanned, please click on `F12` (or `Fn+F12`) to open developer
    tools to navigate to axe tab:


    ![Image](images/F005.jpg)

    Figure 4.5. Press F12 from Google Chrome to see axe as a tab.


    Click Analyse button on the axe tab:


    ```bash

    analyze

    ```


    ![Image](images/F006.png)

    Figure 4.6. Axe Chrome plugin provides violation list.


    #### 4.3 Achecker Tool Online](#contents.xhtml_c4.3)


    Visit achecker.ca website and please enter the website to check any accessibility
    issues. For example, please enter [https://github.com](https://github.com) and
    press enter (under web page URL).


    This will provide list of known issues from the website based on WCAG standards
    in few seconds. This tool will help to check accessibility issues on a single
    page;


    ![Image](images/F007.jpg)

    Figure 4.7. Achecker website to scan the web page.


    Recommendation:


    If the same accessibility issues to be checked after login page or a page which
    gets visible after a scenario, it is advisable to try scanning ‘axe’ plugin.

