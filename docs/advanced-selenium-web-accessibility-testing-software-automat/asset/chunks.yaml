    ## 3.1 测试覆盖指南和模板


    需求追溯矩阵的设计用于将测试脚本/用例映射到相应的测试需求，以理解任何覆盖缺口，从而确保了需求追溯性。


    同样，需求和无障碍标准被映射到测试用例，以了解是否遗漏了任何相关的无障碍标准和需求！


