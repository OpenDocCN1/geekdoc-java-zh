    ## CHAPTER 14


    ## Frequency of Accessibility Testing


    The most important question on non-functional testing (known as NFT) is, how frequent
    those NFT tests are to be executed during the lifetime of the web application?
    Once web applications are designed as per accessibility standards, those changes
    are going to be there in the application for rest of the application’s life hence
    do they need to tested frequently to check if those standards are met or not?


    Answer:


    | During ‘User Story’ Testing | During ‘Functional’ Testing | During ‘Regression’
    Testing |

    | :--- | :--- | :--- |

    | Accessibility testing is required to prove early accessibility standard verification
    | Accessibility testing has to be performed manually using screen reading software
    such as JAWS, NVDA, and so on | Automate the accessibility tests by capturing
    html properties (related to accessibility tests) using selenium-webdriverio in
    JavaScript and run these automated regression tests part of ‘regression testing’
    cycle |


    ### 14.1 Test Planning on Accessibility Testing-Frequently Asked Questions


    There is a small change request in my web application to replace an existing image
    with new image with background color change. Does this require a fresh cycle of
    accessibility testing?


    Subset of accessibility tests related to color contrast analyzer need to be included
    part of test planning.


    Web application has gone through an interface change and no code affected from
    front end layer—Does this require an accessibility testing cycle?


    No (since GUI is not impacted part of the change)


    Web application has been revamped with latest HTML5 technology and entire pages
    are tested individually when developed part of sprint includes accessibility code
    scan. Does this require an accessibility testing cycle?


    Yes. Axe based code scan is basically html scanner to find any issues on overall
    properties. But accessibility behavior has to be tested part of manual and automated
    test cycle.


    ## CHAPTER 15


    ## Defect Classification


    Every defect raised during test execution need clear inputs for stakeholders to
    understand and evaluate them. If there are accessibility related defects it is
    highly recommended to follow some of the standards within defect fields mentioned
    as:


    - Defect Type: A or AA or AAA

    - Priority: High/Medium (for A and AA types of defects; mostly priority decided
    based on stakeholder’ inputs to select either high or medium), Low (for AAA types
    of defects)

    - Severity: Severity 2 (for A and AA types of defects); Severity 3 (for AAA types
    of defects)

    - Classification: 1: Extremely Critical; 5: Least Impact

    - Accessibility Standard: It is important to mention in the defect what accessibility
    standards (`WCAG/Section508`) has not been met by the web application and respective
    references of the standards.

    - Acceptance Criteria: Impacted acceptance criteria of the user stories are to
    be updated in this section. This would help to make the related user stories to
    be updated as BLOCKED or move to respective status. This is also another reason
    why the user stories should be updated with accessibility standards related acceptance
    criteria during user story design. This would help in testing accessibility early
    in the life cycle.


    ## CHAPTER 16


    ## Accessibility Certifications


    Two types of certifications available for professionals to prove their proficiency
    in accessibility from International Association of Accessibility Professionals
    and preparation instructions can be referred at: [https://accessibilityassociation.org/certification](https://accessibilityassociation.org/certification)


    Websites adhere to accessibility standards can apply to WebAIM to receive site
    certification and more details are available at: [https://webaim.org/services/certification/](https://webaim.org/services/certification/)


