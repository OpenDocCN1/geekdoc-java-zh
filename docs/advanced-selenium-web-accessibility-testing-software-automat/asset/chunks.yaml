    在测试 Web 应用时，如果测试人员发现难以阅读的复杂内容，应将此提交给可访问性测试部分的业务分析师（BA）。开发者应避免使用复杂的文本，并使网页上的内容易于阅读和理解。如果内容本身很复杂且难以阅读和理解其目的，则可能不被视为缺陷，因为开发者是完全按照用户故事或需求文档中的指示开发页面的。在这种情况下，可以在缺陷跟踪系统中以“问题”（Issue）或“建议”（Recommendations）的形式提出这些说明，以获得关于如何改进的明确指示。


    ## 9.1 示例：登录页上的输入辅助


    如果用户尝试在 Web 页面上使用用户 ID 和密码登录，应在正确的时间向用户显示错误信息和说明。如果用户输入了用户 ID 但留空了密码框，显示的错误信息应该是恰，并提示用户填写密码以继续登录。同样，使用键盘按
    `TAB` 键应帮助用户从用户 ID 文本框导航到密码文本框。如果用户想使用 `Shift+Tab` 键向后导航，应通过音频向用户提供清晰的导航说明。从密码字段按下
    `Shift+Tab` 应到达 `user id` 字段，语音辅助应为用户读取有关用户 ID 字段的详情。如果用户输入了无效的用户 ID 和密码并点击登录按钮，应提供有效的错误信息，要求重新输入有效的用户
    ID 和密码详情。当用户在屏幕上收到错误信息但未能通过语音读出时，这属于可访问性缺陷，因为使用 `JAWS` 或 `NVDA` 等辅助技术的用户将不知道在登录过程中发生了什么种错误。以下测试用例是验证此登录过程的一个良好示例：


    ```

    1.19.1_NFT_Accessibility_FFXNVDA_Verify_School_Student_Assingment_website_login

    ```


    **测试描述：** 在登录页面时，使用 Firefox 和 NVDA 验证网页是否符合 WCAG 标准。


    ### 3.3.3 错误建议


    ### 9.1.1 引用


    W3C 2016. “Input Assistance: Understanding Guideline 3.3.” Web Log Post. 获取自 [`w3.org/TR/UNDERSTANDING-WCAG20/minimize-error-suggestions.html`](https://w3.org/TR/UNDERSTANDING-WCAG20/minimize-error-suggestions.html)


    **前提条件：** 在 Windows 10 上安装 `NVDA`（开源）和 `Firefox quantum 58.0.2`。


    **测试步骤 1：** 在 Windows 10 操作系统上打开 `NVDA` 并使用耳机听 `NVDA` 提供的语音。


    **预期结果 1：** `NVDA` 应成功打开，`NVDA` 应向用户清晰地读取内容。


    **测试步骤 2：** 在 Windows 10 操作系统上打开 `Firefox Quantum`（版本 `58.0.2` (64-bit)）。


    **预期结果 2：** `Firefox` 应成功打开。


    **测试步骤 3：** 启动 Student Assignment 登录门户。


    **预期结果 3：** 学生登录页面应打开，`NVDA` 应成功读取 URL。


    **测试步骤 4：** 按 `TAB` 键导航到用户 ID 字段输入有效的用户 ID，再次按 `TAB` 键输入无效密码，再按一次 `TAB` 键导航到登录按钮并按
    `Enter`。


    **预期结果 4：** `NVDA` 应读出屏幕上显示的相同错误信息，该信息应是易理解且有效的，用于纠正所输入的密码。


    ## 第 10 章


    ### 测试 WCAG 可访问性标准——健壮性 (Robust)


    当阅读器使用 `JAWS` 读取 Web 应用中的内容时，内容应足够可靠以提供各个部分的详情，且阅读器在使用 `NVDA` 和移动设备语音辅助模式时应具有类似的体验！


    **案例研究：** Hema 年 15 岁，受阅读障碍（`Dyslexia`）的影响，这是一种常见的阅读、写写和拼写学习困难。她登录自己的学校在线账户访问作业，并使用
    `NVDA` 音频和“语音查看器”选项阅读作业列表。在阅读作业部分时，她按下键盘操作 `INSERT+F7` 以查看整个页面列出的链接，作业以链接形式列出，她导航到每个需要处理并完成特定周任务的链接。该学生在线应用程序经过了软件升级，作业页面在视觉上没有变化。使用电脑时可以清晰看到，但
    `NVDA` 的“列出链接”显示并读取的是链接的 URL，而不是以文本格式提供链接详情。如果她从移动端访问相同页面，移动端的语音辅助会从移动端视图清晰地读取链接。但她无法从移动端下载相关作业，因此她依赖笔记本电脑来下载和访问作业。应用程序本身是否存在确切缺陷，或者页面上是否存在可访问性缺陷？


    **缺陷：** 作业页面内作业的每个链接都未在 HTML 属性中更新 `title`。网页上的每个链接都提供了 `href`，它作为指向目标页面的链接以继续打开作业。如果
    HTML 为每个链接提供了 `title`，它将显示该“列出链接”中 `title` 部分的相关信息，而未开发 `title` 的链接会导致仅显示来自 html
    属性中 `href` 的 URL，因此 Bug 存在于学生 Web 应用程序的 html DOM 属性。


    **建议修复：** 为网页上的每个链接添加 `title`，且每个链接的 `title` 应该是唯一且一致的。如果有两个同名的作业，每个作业的 `title`
    应该是唯一且有意义的，例如“assignment 1”和“assignment 2”等。


    **建议修复：** 为网页上的每个链接添加 `title`，且每个链接的 `title` 应该是唯一且一致的。


    ## 10.1 公共网站上的名称、角色、值


    所有表单元素、文本框、链接、按钮和其他组件都应在 html 属性中提供名称、角色和值。


    **示例：** 更新 html 属性如 `title`、`aria-label` 有助于在使用 `JAWS`、`NVDA` 等辅助技术时提供最佳体验。更多示例请参见：[`w3.org/TR/WCAG20-TECHS/ARIA16.html`](https://w3.org/TR/WCAG20-TECHS/ARIA16.html)


    作业页面的 WCAG 指南测试用例


    ## 10.2 针对 NVDA 的测试用例


    ```

    1.19.1_NFT_Accessibility_FFXNVDA_Verify_School_Student_Assingment_website

    ```


    **测试描述：** 在登录页面时，使用 Firefox 和 NVDA 验证网页是否符合 WCAG 标准。


    ### 4.1.2 名称、角色、值


    ### 10.2.1 引用


    W3C 2016. “Name, Role, Value: Understanding SC 4.1.2.” Web Log Post. 获取自 [`w3.org/WAI/WCAG21/quickref/?versions=2.0&showtechniques=412`](https://w3.org/WAI/WCAG21/quickref/?versions=2.0&showtechniques=412)


    **前提条件：** 在 Windows 10 上安装 `NVDA`（开源）和 `Firefox quantum 58.0.2`。


    **测试步骤 1：** 在 Windows 10 操作系统上打开 `NVDA` 并使用耳机听 `NVDA` 提供的语音。


    **预期结果 1：** `NVDA` 应成功打开，`NVDA` 应向用户清晰地读取内容。


    **测试步骤 2：** 在 Windows 10 操作系统上打开 `Firefox Quantum`（版本 `58.0.2` (64-bit)）。


    **预期结果 2：** `Firefox` 应成功打开。


    **测试步骤 3：** 启动 Student Assignment 网站。


    **预期结果 3：** 学生页面应打开，`NVDA` 应成功读取 URL。


    **测试步骤 4：** 使用 `TAB` 键从 URL 导航到作业标签页，并在学生主页上按键盘 `ENTER`。


    **预期结果 4：** 导航到作业页面，`NVDA` 应读取链接、文本框的详情，任何图像应通过替代文本读取。


    **测试步骤 5：** 按 `INSERT+F7` 键导航到列出的链接。


    **预期结果 5：** 列出链接应显示页面上所有完整链接，并提供每个链接的详情和清晰信息。


