  trans: '


    敏捷测试中的早期测试自动化：当页面的某个部分已开发完成完整页面时，可以使用 `Pa11y`/`Axe`/`Total Validator`/`Fire eyes`
    来扫描整个页面！因此，当相应的“用户故事”（user story）从“开发中”移动到“准备就绪”时，必须使用 `Pa11y` 扫描页面并提供错误、警告和建议。


    **挑战**：在提供 URL 的情况下，`Pa11y` 有助于扫描特定页面。如果应用需要在登录或身份验证后进行扫描，到目前为止，`pa11y` 无法提供帮助。


    **解决方案 1**：必须将其脚本化为名为 `pa11y-ci` 的另一个工具的一部分，因此登录部分由 Java 程序处理，然后在代码层面指令其在身份验证后扫描特定页面。


    **解决方案 2（优先）**：`AXE` 可以在身份验证后导航到特定页面，并根据 `WCAG` /`Section 508` 标准扫描元素。


    ## 1.12.1 良好格式的测试用例示例


    **测试用例名称**：`01_NFT_Accessibility_FFXNVDA_Verify_Google_Search`。


    **测试描述**：使用 Firefox 和 `NVDA` 在网页 [www.google.com](http://www.google.com) 上验证 `H44`
    和 `H32` `WCAG` 标准。


    **前提条件**：在 Windows 10 上安装 `NVDA`（开源）和 Firefox quantum `58.0.2`。


    **测试步骤 1**：在 Windows 10 操作系统上打开 `NVDA`，并使用耳机听取 `NVDA` 提供的语音。


    **预期结果 1**：`NVDA`应成功打开，且 `NVDA` 向用户清晰地读出内容。


    **测试步骤 2**：在 Windows 10 操作系统上打开 Firefox Quantum（版本 `58.0.2` (64 位)）。


    **预期结果 2**：Firefox 应成功打开。


    **测试步骤 3**：启动 [www.google.com](http://www.google.com) 网站。


    **预期结果 3**：Google 搜索页面应打开，并由 `NVDA` 成功读出 URL。


    **测试步骤 4**：在 Google 搜索页面上使用键盘上的 `TAB` 键从 URL 导航到文本框。


    **预期结果 4**：`NVDA` 应读出文本框的详情。


    **测试步骤 5**：在文本框内输入文本。


    **预期结果 5**：文本框内输入的文本应被清晰地读出。


    **测试步骤 6**：按 `TAB` 键导航到搜索按钮。


    **预期结果 6**：提交按钮应清晰地读出。


    **测试步骤 7**：在搜索按钮上按 `ENTER`。


    **预期结果**：`NVDA` 应清晰地读出搜索结果。


    ## 1.12.2 糟糕的测试用例


    **测试用例名称**：`01_NFT_Accessibility_IEXNVDA_Verify_Google_Search`。


    **测试描述**：使用 Internet Explorer 11 和 `NVDA` 在网页 [www.google.com](http://www.google.com)
    上验证 `H44` 和 `H32` `WCAG` 标准。


    **原因**：

    `NVDA` 与 Internet Explorer 兼容性不佳，因此建议在此测试用例中使用 `JAWS` 来验证 Internet Explorer 上的可访问性。


    ***


    # 第 2 章


    ## 左移测试 (Shift Left Testing)


    在敏捷冲刺驱动的开发期间执行软件测试，并将测试活动移动到开发的早期阶段，是 2017 年以来测试行业的最佳实践和趋势。


    ### 2.1 早期左移质量保证


    敏捷冲刺开发的阶段被分为六个阶段，以描述书中的示例。每个冲刺根据团队决定从两周到四周不等，但大多数基于冲刺的团队在他们的团队中遵循相似的开发阶段，因此提供了以下阶段来解释如何能在生命周期早期进行最佳的无障碍测试？**


    -   **待办 (TO DO)**：当故事被列在“待办”列表时，分析其对无障碍测试的需求水平。

    -   **故事启动 (STORY KICK OFF)**：讨论需要的无障碍测试类型，并在用户故事的验收标准中（由 BA/测试人员完成）更新 `WCAG`/`Section
    508` 分类（待测试）。

    -   **设计中 (IN DESIGN)**：根据 `WCAG`/`Section 508` 标准进行设计（开发人员/设计工程师）；设计无障碍测试组合（测试人员完成）。

    -   **开发中 (IN DEVELOPMENT)**：开发 `html` 属性以促进更好的无障碍性，并在开发箱中使用 `JAWS` 或 `NVDA` 进行本地测试（开发人员完成）；开发手动无障碍测试用例（测试人员完成）。

    -   **准备就绪 (READY FOR TEST)**：QA 使用 `Pa11y` 扫描页面（如果是可以通过 URL 访问的单页）或使用 `AXE`（如果页面位于身份验证或多次页面导航/操作之后）。扫描完成后，提供扫描报告并与开发者讨论以消除页面扫描期间识别的误报。一旦在此阶段解决了问题，被测应用
    (`AUT`) 实际上已准备好执行测试，因此移动到“测试中”。

    -   **测试中 (IN TEST)**：使用 `JAWS`、`NVDA`、`Zoomtext` 等工具执行手动无障碍测试用例，以验证 `AUT` 的无障碍性。一旦手动测试用例执行且测试失败（缺陷）被修复，使用
    `webdriverio` 对测试集（最多 30%）进行自动化，以便“自动化无障碍测试”作为回归测试的一部分运行。因此，QA 不需要在使用自动化测试运行时对特定故事重新运行手动测试用例。


    ### 2.2 敏捷项目中的无障碍测试


    当项目完全按照敏捷方法论开发时，建议在生命周期早期开始实施无障碍测试。以下是证明测试从右端向左端逐步移动的一些示例。


    **步骤 1**：在“测试中”阶段测试 `AUT`：


    | 待办列表 | 待办 | 故事启动 | 设计中 | 开发中 | 测试中 | 完成 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | | | | | | 手动无障碍测试 | |


    **优点**：

    -   `AUT` 可以快速开发并部署测试。

    -   `AUT` 可用于无障碍测试，并提出缺陷以跟踪这些无障碍问题。

    -   在修复测试过程中发现的大部分无障碍测试问题后，可以重新部署 `AUT`。


    **缺点**：

    -   `AUT` 在生命周期早期未通过 `axe` 或 `Pa11y` 工具扫描，这导致在“测试中”阶段引入缺陷。

    -   在“测试中”阶段在缺陷修复后进行无障碍重测试是一个高度手动化、耗时且枯燥的过程。

    -   如果存在设计问题（例如缺少标题或由于复杂设计导致信息顺序错误等），由于设计阶段已经过去，这些可能会留在代码中。

    -   由于提出了与无障碍相关的缺陷，故事留在“测试中”的时间可能会比通常长。


