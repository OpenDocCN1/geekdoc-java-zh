    ## 摘要

    如果您在 Google 上搜索主题或在线购买产品，Web 无障碍性是一项基本需求！如果一个网页可以通过鼠标访问，但使用键盘导航非常复杂，对于残障用户来说是非常困难的。Web
    无障碍测试是面向客户的 Web 应用最重要的测试实践之一。


    本书解释了编写手动无障碍测试的步骤，并将其转换为基于 Selenium 的自动化无障碍测试，以作为回归测试包的一部分。在解释测试设计步骤时，书中参考了 `WCAG`
    和第 508 条指南。


    由于手动和自动化无障碍测试的需求日益增长，具备无障碍测试知识的软件测试人员在大型组织中最受欢迎。本书通过测试用例和代码示例最好地说明了各种无障碍测试的类型。


