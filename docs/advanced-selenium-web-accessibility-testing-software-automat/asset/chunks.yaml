- fmt: '

    Special users with disabilities trying to access a particular web page to book
    tickets or submit insurance claims or any regular online activities needed full
    support of keyboards while using web pages and assuming that majority of those
    users do not use mouse to access the web applications. When the web pages don’t
    support or partially work with keyboard leave such special users in challenging
    condition. There are keyboards designed specific to their needs and available
    in the market; When users access screen readers and keyboards, there are in a
    position to listen to the information what available on the web application and
    perform navigations, actions and events using their keyboards. For example, users
    reading a web page of `google.com` to perform search on particular information
    regularly using a device such as desktop or laptop with access to keyboard and
    mouse; Users with disabilities use screen reading software’s such as `JAWS/NVDA`
    and launch the browsers using keyboard keystrokes and type the website what intended
    and it is read out by such software to users hence users with disabilities basically
    hear the information from the page and press keyboard for keystrokes such as `Tab`,
    `Shift + Tab` (lead to navigate backwards), `Left`, `Right`, `Up` or `Down` arrows,
    and so on.


    ## 5.1 Testing Approach


    During functional/regression testing, web applications are tested against user
    stories in agile projects where as projects in waterfall model or V model are
    facilitated with requirement specifications or formal requirement documents to
    test against.


    During accessibility testing, requirements are evaluated against accessibility
    standards such as `WCAG` or `Section 508` standards and tested by keeping both
    (requirements and accessibility standards) as base references.


    ## 5.2 Browser Compatibility


    During functional tests, widely used browsers of customer scope are identified
    and targeted as a scope for compatibility testing such as `Internet Explorer`,
    `Safari`, `Firefox`, `Chrome`, and so on. During accessibility testing, those
    customer preferred browsers are validated using respective ‘compatible’ screen
    reading software’s which are used by the users with disabilities. Until 2017,
    `JAWS` has been widely used by users with disabilities and it is highly compatible
    to `Internet Explorer` browser. Similarly, some of the users with disabilities
    prefer to use `NVDA` as a screen reading software and it is highly compatible
    to `Firefox` browser. When web browsers are used from hand held devices such as
    mobile or tablets, respective `android` or `iOS` applications are facilitated
    with voice over facilities hence it has to tested using physical devices in order
    to understand how the web pages has been read by those voice reading applications
    when used from mobile or tablets.


    ## CHAPTER 6


    ## Testing WCAG Accessibility Standard—Perceivable


    Web pages provide high capability to users to understand the information in every
    section leads to attracting more customers and better comfort when person with
    disability accessing the pages.


    ## 6.1 Non-text Content Testing


    When there is an image on the web page or any graphics other than texts are to
    be presented with text alternative since visually impaired users may not see the
    non-text contents and they will be in a position to understand it only when there
    is any text alternative.


    ## 6.2 Sample Test on Github.com for Non-text Content Verification


    Test Case Name: `1.1.1_1.3_NFT_Accessibility_FFXNVDA_Verify_Github_website`


    Test Description: Following `WCAG` standards are verified on the web page `www.github.com`

