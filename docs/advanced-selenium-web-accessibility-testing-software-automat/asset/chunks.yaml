    | | | 更新“验收标准”以匹配相关的 WCAG 或 Section 508 标准，并在计算“故事点”时考虑无障碍性 | 将设计与无障碍标准匹配 | 无障碍扫描
    | 手动无障碍测试的子集 | 开始编写“自动化”无障碍测试脚本 | 剩余的手动无障碍测试全集，完成“自动化”无障碍测试脚本的编写 | | |


    ## 优势


    - 在设计 `AUT` 时，可以考虑到标题的对齐或信息的顺序。

    - 在生命周期的早期，可以使用 `axe` 或 `Pa11y` 等工具对 `AUT` 进行扫描。

    - `AUT` 可以快速开发并进行扫描，以识别并修复任何与无障碍相关的问题（例如颜色对比度错误），通过第一部分测试的帮助来识别并快速修复早期缺陷，并确保其部署进行测试，从而在
    `Test` 阶段防止这些无障碍测试问题，因此预计缺陷会极少。

    - 在修复了测试过程中识别的大多数无障碍测试问题（应用后扫描和开发阶段的测试）后，可以重新部署 `AUT` 进行重测和回归测试。

    - 自动化无障碍测试将作为持续集成和交付流水线的一部分，验证任何无障碍问题。

    - 在完成首轮手动无障碍验证和确认后，无需重复进行任何手动无障碍测试。


    ## 劣势


    - 不适用


    ## 常见问题解答 (FAQs)


    ### 2.2.1 我们可以完全跳过无障碍测试中的手动部分吗？


    这是一个错误的方法，因为体验不同残障用户使用真实应用程序的方式非常重要，因此至少需要进行一次手动测试。


    ### 2.2.2 使用 `axe` 或 `Pa11y` 扫描 `AUT` 是测试人员的责任吗？


    测试人员的职责是建议需要扫描的内容，并帮助开发人员从 `axe`、`pa11y` 或其他工具集抛出的完整违规列表中理解哪些是有效的问题。


    ### 22.2.3 我们可以要求开发人员进行这项手动测试吗？


    不建议这样做。


    ### 2.2.4 我们可以建议测试人员在“`In Test`”阶段之前编写自动化无障碍测试吗？


    只有当测试人员具有根据无障碍标准测试应用程序的经验，并且无无障碍验证步骤是之前冲刺的一部分时，才可行。但只有在第一轮手动无障碍测试成功完成并完成所有缺陷修复和重测后，才能实现自动化。原因是，手动测试为这些自动化无障碍测试提供更广泛的覆盖范围提供了思路。


    ### 2.2.5 如果使用 `axe` 扫描页面，是否可以认为无障碍测试已完成？


    不不——这只是启动无障碍验证的方法之一。在执行完完整的手动无障碍测试，并开发某些测试的自动化测试脚本（这些测试是通过手动测试的）之前，无障碍测试并不算开始。因此，这些测试可以在
    `CI/CD` 流水线上定期运行，以证明无障碍性作为每次代码更改的一部分得到了验证。


    # 第 3 章：测试覆盖


    通过测试用例覆盖（编写）所有测试需求以确保测试覆盖达到 100%（也称为“需求追溯性”）是验证和确认被测试应用程序（称为 `AUT`）中每个可能的可测试项的最佳实践。


    当测试人员规划无障碍测试时，`WCAG` 和 `Section 508` 是主要的指南，通过查看每项需求来匹配需求或测试用例覆盖的基础。类似于“需求追溯性指标”，可以存在“指南追溯性指标”，以将多个测试用例与每项需求和
    `WCAG` 指南匹配，以证明测试完全覆盖。


