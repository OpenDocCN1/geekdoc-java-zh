    [Foreword](#contents.xhtml_word)


    “Web is for everyone.”


    As software engineers we are responsible to make a web inclusive for everyone,
    and everywhere by keeping accessibility design in mind. We are now in a world
    of agile and quick/point releases without compromising the quality of products.
    Ensuring an application is defect free in terms of accessibility is equally important
    as ensuring the same in terms of functionality. Testing application through a
    differently-abled person’s ­perspective will be tough without proper knowledge
    on what is accessibility testing, and how it can be carried out using WCAG standards.
    Accessibility testing is one of the hot topics in the market and going to be the
    most wanted skill in future.


    Narayanan has taken a brave step to explain and illustrate what is accessibility
    testing, and how it can be done ‘right’ using different manual as well as automation
    tools of choice.


    Narayanan is a great author, and an excellent story teller which has been proven
    already through his publications and presentations. He has articulated accessibility
    and its needs along with the testing techniques so well in this book. This will
    definitely help the quality engineers and beginners who wish to step into the
    world of accessibility testing.


    I know Narayanan for many years, and his contributions to testing community is
    highly remarkable. I would like to take this opportunity to thank Narayanan for
    all his effort to make the testing community better through his knowledge sharing
    and congratulations for the book release. Looking forward to seeing many such
    brilliant works from him!


    Happy Learning!


    Aparna Gopalakrishnan,


    Technical Lead,


    Wipro Technologies


    [Acknowledgment](#contents.xhtml_a1)


    Chandrashekar Korlahalli, Wipro Digital


    Yamini Gupta, Wipro Digital


    [CHAPTER 1](#contents.xhtml_c1)


    * * *


    [Introduction: Accessibility Tester—A Great Futuristic Manual Testing Role](#contents.xhtml_c1)


    Web accessibility is an art of building the website for users with disabilities
    such as physical, vision, cognitive, and hearing disabilities. Remember that everyone
    of us will become disabled and need better accessibility in some way, sometime,
    in our lives naturally!


    Approximately 1.3 billion people are affected by some form of visual impairment
    as per World Health Organization report, ‘Blindness and vision impairment’ dated
    11 October 2018\. Internet has changed people’s life and most of the daily work
    has been heavily relying on websites for day-to-day activities such as accommodation
    arrangements, travel, food, and other basic necessities. Though websites are built
    with customer needs in mind, not all the websites are accessible for users with
    disabilities! Accessibility defects are very important and hard to replicate by
    testers who are not experienced such situations in their life.'
