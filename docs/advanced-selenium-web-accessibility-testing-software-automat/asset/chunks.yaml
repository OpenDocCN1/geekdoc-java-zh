    If there is a section of reports such as charts as interactive elements to show
    statistics and graphs, it will be complex for users with vision impairment to
    understand the meanings of the reports.


    **Solution:** Table based report should be provided as an alternative to the Chart
    based reports hence, users with vision impairment can choose table to read and
    understand the reports.


    ### 18.2.5 Form Fields Labeling


    When a form provided with `user id`, `password` text boxes and `login-button`,
    it is always recommended to provide label for `user id` and `password` text boxes
    which would help users with disability to read the labels through assistive technologies
    such as `NVDA` and `JAWS` to understand the purpose of it.


    ### 18.2.6 Placeholder


    If the application has form fields to fill in, `placeholder` suggests what format
    the text or details are to be entered. For an example. Data of Birth field displaying
    `DDMMYYYY` and while user click on the field the `placeholder` disappears. It
    is different from label and disappears when the field has been focused. It is
    usually in lighter color and will be difficult for low vision user to read it.


    **Recommendation:**


    Make it readable for low vision reader with proper text color and rather than
    getting it disappearing while clicking or focusing on the field, try keeping the
    `placeholder` below the field when focused; So the `placeholder` won’t disappear
    when focus is moved to respective field and user with vision impairment can understand
    better with placeholder to enter right details on the text box.


    # CHAPTER 19


    ## Accessibility Code Scan Using AXE Part of Automated Tests


    Scanning a page using `axe` plugin is really good when there are static pages
    testing required. But most of the web testing scope needed solutions to test dynamic
    pages such as verify page three after successful login! If there are 800+ automated
    tests in which 150+ dynamic pages are to be scanned, it is not feasible to scan
    the pages and review them manually within the sprint schedule! Hence it is highly
    recommended to use `axe` part of automated test pack by implementing such as in
    the following.


    ### 19.1 JavaScript Programming Based Axe Scan Example


    **Pre-requisites:**


    After setting up the basic `NodeJS` based framework, please install `selenium`
    and `axe` using the following steps:


    Install `selenium` using the following command:


    ![Image](images/Image_067_.jpg)![Image](images/Image_066_.jpg)


    ### 19.2 Java Programming Based Axe Scan Example


    **Pre-requisites:**


    `axe.min.js` is a minified version of original `axe` scanning script and it is
    available part of API packages from `https://github.com/dequelabs/axe-selenium-java/tree/develop/src/test/resources`


    **Sample code:**


    ![Image](images/Image_064_.jpg)![Image](images/Image_065_.jpg)


    **Code explanation for each section:**


    1. This is the class file in which `axe` scan functions are initiated using `axe`
    scripts provided from git-hub repositories.

    2. Test is initiated in order to write the accessibility results later after scan
    completion.

    3. After taking `axe.min.js` from GitHub projects such as `axe-selenium-java`,
    place it in the project path and update the section with right location hence
    test can pick the file part of `axeCodeScanCode`.

    4. Regular browser initiation part of `selenium` with path of `chrome` browser
    driver. If `Internet Explorer` or `Firefox` or any other browser needs to be used,
    kindly update this section with right browser driver details from your automated
    test repository.

    5. This part of the code scans the page for any accessibility violations.

    6. `Axe` based accessibility reports are generated part of this script. Not every
    violation turns out to be a defect. This report has to be reviewed along with
    developers to understand how many are to be considered to review further for code
    fix.


    # CHAPTER 20


    ## Accessibility Testing on Error Messages


    This is one of the important sections of accessibility testing on verifying error
    messages and proving that users with disability can understand on what exactly
    gone wrong?


    Following examples provide clear description of important test scenarios to be
    covered part of error messages testing.


    ### 20.1 Placement of the Error Messages


    Assuming that the web application contains list of fields and user entered incorrect
    text as ‘a$b’ on ‘city of birth’ field hence there is an error message displayed
    on top of the web page on bold red color font with the following words and focus
    moves to error message after pressing ‘Tab’ from ‘City of Birth’ text box:


    #### 20.1.1 “Error: Please Enter Right Text on the Field”


    What is the problem in this error message with respect to accessibility?


    - **Issue1:** Error message is not explaining about particular text field ‘city
    of birth’

    - **Issue2:** Error message is not placed near to ‘City of Birth’ text field hence
    user has to find a way to navigate back to this text field

    - **Issue3:** Focus goes to error message hence user lost the navigation flow
    from field to top of the page and user has to navigate to field after several
    steps to reach ‘City of Birth’ to enter right text.


    Location of error messages, current focus and respective fields to remove errors.


    Assuming that the user story or requirements says to verify right error message;
    When user enter incorrect text in ‘City of Birth’ field and press ‘Tab’ that leads
    to display error message next to field at right hand side but the focus lost rather
    than going back to `City of Birth` field.


    What is the problem in this error message with respect to accessibility?


    - **Issue1:** Focus is lost rather than getting the focus to next field and bringing
    the focus back to `City of Birth` field.

    - **Issue2:** Error message has been displayed as per user story or requirement
    but the focus is not discussed in detail in the requirement hence it is not a
    valid defect to raise.


    **Recommendation:** Designer and developer related to this user story has to be
    involved while discussing the `Issue2` focus issue and raise this focus issue
    as an `Accessibility Recommendation` and get the user story updated on `Acceptance
    Criteria` to validate the focus;


    - Verify that the error icon is highly recommended to be placed next to error
    message or the relevant field.

    - Language of error messages should be plain and simple and readable for users
    with disability to understand to fix the error in right field.

    - Color of error messages should be consistent and clearly visible to users with
    right font size.

    - After error messages displayed on the page, please make sure the focus is not
    lost and user is navigated to appropriate locations as expected; If this is not
    detailed in user story, please discuss with teams to get the story updated with
    right focus.


    # Conclusion


    Accessibility testing is one of the emerging testing practices and it is expected
    to be a niche software engineering job in the next ten years’ time since approximately
    1 in 5 users generally need some sort of accessibility while using computer and
    handheld devices.


    Though it is possible to automate selected accessibility tests such as keyboard
    navigations, it is advised to automated after few runs of manual test execution
    to observe and understand user experience on the web application with the help
    of accessibility test cases.


    “No future for manual testing” is a clear myth! Accessibility is expected to be
    the next generation manual testing and we all have to be proud of such knowledge
    and experience to perform accessibility testing and prevent defects to provide
    (disabled) users a ‘best in class’ experience.

