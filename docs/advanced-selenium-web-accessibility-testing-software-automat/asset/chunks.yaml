    如果报告部分包含图表等交互式元素来显示统计数据和图表，对于视觉障碍用户来说，理解报告的含义将非常复杂。


    **解决方案：** 应提供基于表格的报告作为基于图表的报告的替代方案，因此，视觉障碍用户可以选择表格来阅读和理解报告。


    ### 18.2.5 表单字段标签


    当提供的表单包含 `user id`、`password` 文本框和 `login-button` 时，始终建议为 `user id` 和 `password`
    文本框提供标签，这将帮助残障用户通过 `NVDA` 和 `JAWS` 等辅助技术读取标签，并理解其用途。


    ### 18.2.6 占位符 (Placeholder)


    如果应用程序中有需要填写的表单字段，`placeholder` 提示了要输入的文本或细节的格式。例如，出生日期字段显示 `DDMMYYYY`，当用户点击该字段时，`placeholder`
    就会消失。它与标签不同，在字段获得焦点时消失。它通常颜色较浅，低视力用户难以阅读。


    **建议：**


    使用适当的文本颜色使低视力阅读者易读，与其在点击或获取字段焦点时消失，不如尝试在获取焦点时将 `placeholder` 保留在字段下方；这样当焦点移动到相应字段时，`placeholder`
    就不会消失，视觉障碍用户可以根据占位符更好地理解如何在文本框中输入正确详情。


    # 第 19 章


    ## 使用自动化测试中的 AXE 进行辅助代码扫描


    使用 `axe` 插件扫描页面在需要测试静态页面时效果非常好。但大多数 Web 测试范围需要解决方案来测试动态页面，例如在成功登录后验证第三页页面！如果有
    800 多个自动化测试，其中有 150 多个动态页面需要扫描，那么在冲刺计划周期内手动扫描并审查这些页面是不可行的！因此，强烈建议通过如下实现方式来使用自动化测试包中的
    `axe` 部分。


    ### 19.1 基于 JavaScript 编程的 Axe 扫描示例


    **先决条件：**


    在搭建好基于 `NodeJS` 的框架后，请按照以下步骤安装 `selenium` 和 `axe`：


    使用以下命令安装 `selenium`：


    ![Image](img/Image_067_.jpg)![Image](img/Image_066_.jpg)


    ### 19.2 基于 Java 编程的 Axe 扫描示例


    **先决条件：**


    `axe.min.js` 是原始 `axe` 扫描脚本的压缩版本，它是从 `https://github.com/dequelabs/axe-selenium-java/tree/develop/src/test/resources`
    的 API 包提供的。


    **示例代码：**


    ![Image](img/Image_064_.jpg)![Image](img/Image_065_.jpg)


    **每个部分的代码解释：**


    1. 这是类文件，其中使用 GitHub 仓库提供的 `axe` 脚本初始化 `axe` 扫描函数。

    2. 初始化测试以便在扫描完成后编写辅助功能测试结果。

    3. 从 `axe-selenium-java` 等 GitHub 项目中获取 `axe.min.js`，将其放置在项目路径中并更新该部分以正确的路径，以便测试可以获取
    `axeCodeScanCode` 部分的文件。

    4. `selenium` 的常规浏览器启动部分，带有 `chrome` 浏览器驱动程序的路径。如果需要使用 `Internet Explorer` 或 `Firefox`
    或任何其他浏览器，请用您自动化测试库中正确的浏览器驱动程序详情更新此部分。

    5. 这部分代码扫描页面是否存在任何辅助功能违规情况。

    6. 此脚本将生成基于 `Axe` 的辅助功能报告。并不是每个违规都是缺陷。此报告必须与开发者一起审查，以理解有多少个需要进一步审查以进行代码修复。


    # 第 20 章


    ## 错误信息的辅助功能测试


    这是辅助功能测试中的重要章节之一，用于验证错误信息并证明残障用户能够理解到底发生了什么问题？


    以下示例提供了错误信息测试中涵盖的重要测试场景的清晰描述。


    ### 20.1 错误信息的放置


    假设 Web 应用程序包含一个字段列表，用户在“出生城市”字段中输入了错误文本‘a$b’，因此网页顶部会以加粗红色字体显示错误消息，内容如下字所示，并且在从“出生城市”文本框按下
    ‘Tab’ 键后，焦点移动到错误消息：


    #### 20.1.1 “错误：请在字段上输入正确的文本”


    此错误消息在辅助功能方面存在什么问题？


    - **问题 1：** 错误消息没有解释特定的文本字段‘出生城市’。

    - **问题 2：** 错误消息没有放置在‘出生城市’文本字段附近，因此用户必须找到导航回此文本字段的方法。

    - **问题 3：** 焦点到了错误消息，导致用户丢失了从字段到页面顶部的导航流，用户必须经过几个步骤导航到“出生城市”字段以输入正确文本。


    错误消息的位置、当前焦点以及要消除错误的相应字段。


    假设用户故事或需求要求验证正确的错误信息；当用户在‘出生城市’字段中输入错误文本并按下‘Tab’键时，这会导致字段右侧显示错误消息，但焦点丢失了，而不是返回到`出生城市`字段。


    此错误消息在辅助功能方面存在什么问题？


    - **问题 1：** 焦点丢失了，而不是获取下一个字段焦点并将焦点带回 `出生城市` 字段。

    - **问题 2：** 错误消息已根据用户故事或需求显示，但需求中未详细讨论焦点问题，因此这不是一个可以提交的缺陷。


    **建议：** 与此用户故事相关的设计师和开发者必须在讨论 `问题 2` 焦点问题时参与，并将此焦点问题作为`辅助功能建议`提出，更新用户故事中的`验收标准`以验证焦点；


    - 验证错误图标强烈建议放置在错误消息或相关字段旁边。

    - 错误信息的语言应该是平实易懂的，便于残障用户阅读以便在正确的字段中修复错误。

    - 错误信息的颜色应保持一致，并对于合适的字体大小的用户清晰可见。

    - 在页面上显示错误消息后，请确保焦点不会丢失，并且用户按预期导航到相应位置；如果这未在用户故事中详细说明，请与团队讨论以根据正确的焦点更新故事。


    # 结论


    辅助功能测试是新兴的测试实践之一，预计在未来十年内它将成为一项小众软件工程工作，因为大约每 5 个人用户中就有 1 个人在使用计算机和手持设备时通常需要某种辅助功能支持。


    虽然可以自动化某些辅助功能测试（如键盘导航），但建议在执行几次手动测试后进行自动化，以便通过辅助功能测试用例观察并理解 Web 应用程序的用户体验。


    “手动测试没有未来”是一个明显的迷言！辅助功能预计将成为下一代手动测试，我们都必须为这些知识和经验感到自豪，以执行辅助功能测试并防止缺陷，为（残障）用户提供“顶级”体验。


