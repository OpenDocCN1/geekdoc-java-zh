    # 10.3 JAWS 测试用例 (#contents.xhtml_c1.3)


    ## 1.19.2_NFT_Accessibility_IEXJAWS_Verify_School_Student_Assingment_website


    **测试描述：** 使用 Internet Explorer11 或 Microsoft Edge 配合 JAWS 验证网页上符合 WCAG 标准的情况。


    ### 4.1.2 名称、角色、值 (Name Role Value)


    #### 10.3.1 参考

    W3C 2016. “Name, Role, Value: Understanding SC 4.1.2.” Web 日志. 获取自 [`w.org/WAI/WCAG21/quickref/?versions=2.0&showtechniques=412#name-role-value`](https://w.org/WAI/WCAG21/quickref/?versions=2.0&showtechniques=412#name-role-value)


    **前提条件：** 在 Windows 10 上安装 JAWS（已授权）以及 Internet Explorer11 或 Microsoft Edge。


    **测试步骤 1：** 在 Windows 10 操作系统上打开 JAWS，并使用耳机听 JAWS 提供的语音。

    **预期结果 1：** JAWS 应成功打开，并 JAWS 向用户清晰地读出内容。


    **测试步骤 2：** 在 Windows 10 操作系统上打开 Internet Explorer11 或 Microsoft Edge。

    **预期结果 2：** Internet Explorer11 或 Microsoft Edge 应成功打开。


    **测试步骤 3：** 启动学生作业（Student Assignment）网站。

    **预期结果 3：** 学生页面应打开，且 JAWS 应成功读出 URL。


    **测试步骤 4：** 在学生主页使用 `TAB` 键从 URL 导航到作业（assignments）标签页，并按下键盘上的 `ENTER` 键。

    **预期结果 4：** 已导航到作业页面，JAWS 应读出链接详情、文本框，任何图像应带有其替代文本被读出。


    **测试步骤 5：** 按 `INSERT+F7` 键导航到列出的链接。

    **预期结果 5：** 应显示列出的链接，页面上显示完整的链接，并提供关于每个链接的清晰详细信息。


    # 第 11 章 (#contents.xhtml_c11)


    ***


    # 测试 WCAG 无障碍标准——可操作性 (Operable)


    特殊用户使用快捷键访问网页，大部分导航通过键盘完成，而鼠标访问极少。通过考虑键盘，应验证用户对网页的导航以避免任何键盘陷阱，从而确保 `Tab`、`Shift
    Tab` 或方向键按正确的顺序流动，以获得更好的用户体验。


    键盘陷阱的“A 级”（高优先级）缺陷示例：


    用户从 URL 按 `TAB` 导航到标题 1，而从标题 1 按 `TAB` 却回到了 URL，而不是导航到页面的其他部分！因此，用户在获得鼠标访问权限或通过关闭电脑关闭应用程序之前，无法进行任何其他操作。


