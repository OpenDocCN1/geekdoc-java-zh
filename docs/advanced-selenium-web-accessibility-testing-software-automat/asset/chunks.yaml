    ### 3.2 无障碍性测试覆盖清单 - 故事启动阶段](#contents.xhtml_c3.2)


    | 在“启动 (Kick Off)”或“待办 (To-Do)”阶段针对用户故事的问题/检查清单 | 强制 (M) /可选 (O) |

    | :--- | :--- |

    | 验收标准 (AC) 部分是否已更新需要完成的“无障碍性指南”编号？例如：必须满足 `WCAG 1.1.1` | M |

    | 每项无障碍性验收标准是否已分配给相应的开发者或测试人员？ | O |

    | AC：是否由开发者执行（使用 `AXE` 或 `PA11Y`）无障碍性代码扫描？ | O |

    | AC：在故事移至“测试 (Test)”之前，应设计并完成无障碍性测试用例 | M |

    | AC：在手动测试完成后，应设计自动化无障碍性测试 | O |

    | AC：测试执行结果应为建议/问题/缺陷的形式 | O |

    | 完成定义 (Definition of Done)：无障碍性缺陷级别 1、2、3 的定义 | M |

    | 完成定义 (Definition of Done)：定义何时完成无障碍性测试执行 | M |

    | 完成定义 (Definition of Done)：“推迟”无障碍性缺陷以待修复或在未来的修复中考虑的程序，以及提交“豁免 (Waivers)”的步骤
    | M |


    ### 3.3 无障碍性测试覆盖清单 - 设计阶段](#contents.xhtml_c3.3)


    | 设计阶段用户故事的问题/检查清单 | 强制 (M) /可选 (O) |

    | :--- | :--- |

    | 用户故事涉及的任何部分都不应有任何“键盘陷阱”；为了避免键盘陷阱，建议设计师为开发者提供表单的导航流 | M |

    | 应用不应完全依赖动画。动画内容应提供文本替代方案 | M |

    | 应用是否具有逻辑的开始和结束状态构建？ | M |

    | 如果应用使用了运动，请避免使用运动并尝试使用溶解过渡效果 | M |

    | 颜色选择应与文本替代方案相关 | M |

    | 如果应用包含闪烁、动画或视频类的音频视频组件，是否使用了模拟眼镜来测试应用？例如：针对以下情况的模拟眼镜：• 白内障和视力低下；• 隧道视野；• 隧道视野和视力低下；•
    半盲；• 糖尿病视网膜病变；• 黄斑变性。参考[`optimalowvision.co.uk/product.cfm?prod=474&dept=479`](http://www.optimalowvision.co.uk/product.cfm?prod=474&dept=479)
    | O |

    | 如果 Web 应用上有焦点指示器和链接，是否使用手持放大镜进行了测试？ | O |

    | 设计师是否回答了这些问题？• 此视觉效果的整体目的是什么？• 传达最佳方式是什么？• 视觉效果的哪些部分是装饰性的需要文本替代方案？• 图像的哪些部分是功能性图像（如左右箭头），需要文本替代方案？
    | M |

    | 应用的媒体部分是否提供了音频描述？这是否能帮助听障观众阅读和理解视频？ | M |

    | 每个表单字段（如复选框和单选框）是否都提供了 `<label>`？ | M |

    | 如果应用包含占位符（例如日期字段中灰色文本的 DDMMYYYY，在获得焦点时消失），该占位符是否设计为显示在字段下方、上方或右侧，而不是在获得焦点时隐藏？
    | M |


    ### 3.4 键盘快捷键与测试用例覆盖矩阵](#contents.xhtml_c3.4)


    测试用例应与 `JAWS` 和 `NVDA` 等辅助技术支持的每个键盘快捷键进行映射。


    `JAWS` 快捷键可以在此处找到：[`webaim.org/resources/shortcuts/jaws`](https://webaim.org/resources/shortcuts/jaws)


    `NVDA` 快捷键可以在此处找到：[`webaim.org/resources/shortcuts/nvda`](https://webaim.org/resources/shortcuts/nvda)


    ### 3.5 为了更好的测试覆盖的七项无障碍性需求考虑](#contents.xhtml_c3.5)


    在测试 Web 应用或文档时，强烈建议考虑以下测试领域并生成测试用例：


    1. 结构

    2. 图片

    3. 超链接

    4. 列表

    5. 列

    6. 颜色与对比度

    7. 表格


    如果测试人员将将测试用例映射到 Web 应用或文档的这七个领域，那么在测试用例步骤中发现一些缺陷是可行的。下一步是更新测试用例，以尽可能涵盖在 `AUT`（测试对象）内验证这七个领域。


    参考


    U.S. Access Board. 2017\. “WCAG 2.0 与现有 508 标准的对比表。” Web 博客。获取自 [`access-board.gov/guidelines-and-standards/communications-and-it/about-the-ict-refresh/background/comparison-table-of-wcag2-to-existing-508-standards`](https://www.access-board.gov/guidelines-and-standards/communications-and-it/about-the-ict-refresh/background/comparison-table-of-wcag2-to-existing-508-standards)


