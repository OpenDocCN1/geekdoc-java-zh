    ## CHAPTER 13


    ## Concurrency Testing Using Taurus and Selenium


    Taurus is one of the best tools to run parallel or concurrent tests of selenium
    automated tests. Meaning, it can be used to run performance tests using automated
    test scripts (which are originally written for automated testing).


    While running ‘concurrent tests,’ it is possible to find any defects such as misalignment
    of sections, object issues, disabled text boxes or hidden sections which are normally
    not possible to discover during functional testing.


