    `ENTER` of keyboard on the students’ main page.

    **Expected Result 4:** Navigated to Assignments page and JAWS should read the
    details of the links, text boxes and any images should be read with the text alternatives.


    **Test Step 5:** Press `INSERT+F7` key to navigate to the listed links.

    **Expected Result 5:** Listed Links should be displayed with complete links available
    on the page with details about each link with clear information.


    # CHAPTER 11 (#contents.xhtml_c11)


    ***


    # Testing WCAG Accessibility Standard—Operable


    Special users access the web pages using keyboard shortcuts and most of the navigation
    are performed with keyboards and mouse access has been extremely minimal. By keeping
    keyboard in mind, user navigation of the web pages should be verified to avoid
    any keyboard traps hence `Tab`, `Shift Tab` or arrow keys flow in proper sequence
    for better user experience.


    Sample ‘A level’ (High Priority) defect on Keyboard Trap:


    User press `TAB` from URL to navigate to header 1 and pressing `TAB` from header
    1 goes back to URL rather than navigating to other sections of the page! So, user
    cannot proceed on any other operation until they get access to mouse or closing
    the application by switching off computer.


