    \ tests. Manoj Kumar (from applitools) has inspired thousands of audiences through\
    \ his web live session on ‘Automated Accessibility Testing’ during the year 2017\
    \ and that has led me to experiment automated tests on accessibility. After completing\
    \ few manual test executions of accessibility test cases, I could write automated\
    \ tests using tools such as `webdriverio`, `cucumber` and `gulp` and run those\
    \ automated tests through Continuous Integration/Continuous Delivery (CI/CD) solutions\
    \ such as `Jenkins` pipeline. My sincere thanks to audience for reading this book.\
    \ My humble request is to start implementing accessibility testing in the testing\
