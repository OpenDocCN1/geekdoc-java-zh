    [Testing WCAG Accessibility Standard—Distinguishable](#contents.xhtml_c8)


    When the web pages are provided with multiple colors, it may not be understood
    by users with medical conditions such as the following.


    Some medical conditions related to colors: Color blindness, Achromatopsia, Heterochromia,
    Synesthesia, Monochromacy, Dichromacy, ­Tritanopia, Color Monochromacy.


    Since special users will not be in a position to access the colors in proper way,
    it has to be handled fair on the web pages with expected color contrast (so partially
    blind users can view and understand) and text resize options (so special user
    can resize text up to 200 percent without using any additional tools), and so
    on.


    Usage of ‘Web Accessibility Toolbar’


    Web accessibility toolbar (WAT) provide color contrast analyzer when installed
    and used from internet explorer. This can be used to validate the colors of each
    object and respective contrast of the colors in normal mode and zoomed mode. As
    per the WCAG standards, 4.5:1 is the suggested minimum color contrast in normal
    mode and 3:1 when zoomed.


    Installation:


