    # CHAPTER 12 (#contents.xhtml_c12)


    ***


    # Visual Regression Tests Using BackstopJS


    Images, texts, tables and alignment of sections needs to be displayed with high
    quality foreground and background colors to be viewed.


    ## 12.1 Why Performing ‘Visual Regression’ Is a Solution for Testing Accessibility?
    (#contents.xhtml_c12.1)


    Fixed width designs lead into issues when web browser viewed in different sizes.
    Especially testing the web page in different view ports (height, width) help to
    understand how the page displays when reduced to mobile view, tablet view and
    desktop views. If there are fixed width designs, shrinking the page to small mobile
    view leading the users to use ‘horizontal bar’ which is extremely difficult for
    users with low vision (to find horizontal bar and drag it to see remaining part
    of the web pages); Hence performing visual regression tests will help in reviewing
    web pages in sizes.


    **Pre-requisites:**


    *   Highly recommended to use a selenium-based JavaScript framework such as, [https://github.com/john-doherty/selenium-cucumber-js](https://github.com/john-doherty/selenium-cucumber-js);
    After cloning this framework to local machine, please install npm modules using
    commands from GitHub page.

    *   Once framework has been cloned and installed, update `package.json` with latest
    backstopjs version such as `3.8.5`; Follow further instructions at : [https://github.com/garris/BackstopJS](https://github.com/garris/BackstopJS)

    *   Perform `npm install -g backstopjs` to install BackstopJS to the repository.


    ## 12.2 Create Configuration File for BackstopJS (#contents.xhtml_c12.2)


    Page sizes of the website can be described in following a JSON file for BackstopJS.
    In order to get JSON file creation, `backstop init` command has to be performed
    on terminal:


    ```bash

    backstop init

    ```


    After backstop init command, following json file should have been created on the
    main project level.

