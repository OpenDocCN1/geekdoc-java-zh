    hear the voice provided by JAWS.

    **Expected Result 1:** JAWS should be opened successfully and contents read out
    clearly by JAWS to user.


    **Test Step 2:** Open Internet Explorer11 or Microsoft Edge on a Windows 10 operating
    system.

