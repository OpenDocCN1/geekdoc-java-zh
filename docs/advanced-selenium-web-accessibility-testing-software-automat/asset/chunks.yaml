    残障特殊用户在尝试访问特定网页以进行订票、提交保险理赔或任何常规在线活动时，在使用网页期间需要键盘的全方位支持，且假设大多数此类用户并不使用鼠标访问 Web
    应用程序。当网页不支持或部分支持键盘时，会使这些特殊用户处于挑战性境地。市面上有一种专门针对他们需求设计的键盘；当用户通过访问屏幕阅读器和键盘时，他们能够听到
    Web 应用程序上的可用信息，并使用键盘执行导航、操作和事件。例如，用户在阅读 `google.com` 网页以对特定信息进行搜索时，通常使用带有键盘和鼠标的台式机或笔记本电脑等设备；残障用户使用诸如
    `JAWS/NVDA` 等屏幕阅读软件，通过键盘按键启动浏览器并输入想要访问的网址，此类软件会将内容读给用户听，因此残障用户基本上能听到页面上的信息，并通过按下键盘键如
    `Tab`、`Shift + Tab`（用于后向导航）、`Left`、`Right`、`Up` 或 `Down` 方向键等进行操作。


    ## 5.1 测试方法


    在功能/回归测试期间，敏捷项目中的 Web 应用程序会根据用户故事进行测试，而瀑布模型或 V 模型项目则通过需求规格书或正式需求文档来辅助测试。


    在无障碍测试期间，会根据 `WCAG` 或 `Section 508` 等无障碍标准对需求进行评估，并将两者（需求和无障碍标准）作为基准参考进行测试。


    ## 5.2 浏览器兼容性


    在功能测试期间，会确定客户范围内广泛使用的浏览器作为兼容性测试范围，例如 `Internet Explorer`、`Safari`、`Firefox`、`Chrome`
    等。在无障碍测试期间，将使用残障用户使用的相应“兼容”屏幕阅读软件对这些客户偏好的浏览器进行验证。直到 2017 年，`JAWS` 被残障用户广泛使用，并且与
    `Internet Explorer` 浏览器高度兼容。同样，一些残障用户偏偏好使用 `NVDA` 作为屏幕阅读软件，它与 `Firefox` 浏览器高度兼容。当从手机或平板电脑等手持设备使用浏览器时，相应的
    `android` 或 `iOS` 应用程序提供了语音功能，因此必须使用物理设备进行测试，以了解当从手机或平板电脑使用时，这些网页是如何被语音读取应用程序读取的。


    ## 第 6 章


    ## 测试 WCAG 无障碍标准——可感知性


    网页为用户理解每个部分的信息提供了强大的能力，能够吸引更多客户，并让残障人士在访问页面时感到更加舒适。


    ## 6.1 非文本内容测试


    当网页上存在图像或任何除文本以外的图形时，必须提供文本替代，因为视觉障碍用户可能无法看到非文本内容，只有在存在文本替代时他们才能理解这些内容。


    ## 6.2 Github.com 非文本内容验证测试用例


    测试用例名称：`1.1.1_1.3_NFT_Accessibility_FFXNVDA_Verify_Github_website`


    测试描述：在网页 `www.github.com` 上验证符合 `WCAG` 标准的内容

