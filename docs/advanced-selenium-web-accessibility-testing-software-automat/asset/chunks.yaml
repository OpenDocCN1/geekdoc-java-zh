    ## FAQs


    ### 2.2.1 Can We Completely Skip Manual Testing Part of Accessibility?


    It is a wrong approach since experiencing the way how the real application has
    been used by differently abled users are very important hence manual testing needs
    to be done at least once.


    ### 2.2.2 Is It Tester’s Responsibility to Scan the `AUT` Using `axe` or `Pa11y`?


    It is tester’s role to suggest what needs to be scanned and help developers to
    understand what are some of the valid issues from the complete list of violation
    thrown by tools such as `axe`, `pa11y`, or other toolsets.


    ### 2.2.3 Can We Request Developers to Do This Manual Testing?


    It is not advisable.


    ### 2.2.4 Can We Suggest Testers to Write Automated Accessibility Tests Before
    ‘In Test` Phase?


    It is possible only when the tester has been experienced testing the application
    for accessibility standards and automated accessibility verification steps part
    of earlier sprints. But it is possible to automate only when first round of manual
    accessibility testing has been completed successfully with complete defect fixes
    and retests. Reason being, manual tests open up the idea to provide broader coverage
    to those automated accessibility tests.


    ### 2.2.5 If Page Is Scanned Using `axe`, Is It Considered that Accessibility
    Testing Complete?


    No-it is just one of the ways to initiate accessibility validations but accessibility
    testing is not started until performed a full round of manual accessibility testing
    followed by automated test script development of some tests (which are tested
    manually) hence these tests can run in `CI/CD` pipeline regularly to prove that
    the accessibility is validated as part of every code change.


    # CHAPTER 3: Test Coverage


    Covering(writing) all the test requirements through test cases to make sure that
    test coverage is 100 percent (also known as ‘Requirement Traceability’) is a best
    practice to verify and validate every possible testable item in Application Under
    Test (known as ‘AUT’).


    When testers planning for accessibility testing, `WCAG` and `Section 508` are
    the primary guidelines to match the need or the base for the test cases coverage
    by looking at each requirement. Similar to ‘Requirement Traceability Metrics,’
    there can be a ‘Guidelines Traceability Metrics’ to match multiple test cases
    to each requirement and `WCAG` guidelines to prove complete test coverage.


