    \ webdriverio 的测试。使用这些步骤定义将减少测试设计和测试执行时间，因此预定义的步骤有助于尽早实现无障碍验证，而不是从头开始构建整个框架！\n\
    \n克隆以下项目，并将此仓库中的步骤定义文件和支持文件放入目标仓库，或在空文件夹结构内开始编写测试：\n\n[`github.com/webdriverio/cucumber-boilerplate`](https://github.com/webdriverio/cucumber-boilerplate)\n\
    \n按照 GitHub `cucumber-boilerplate` 框架的指示，删除以下文件：\n\n*   `.travis.yml`\n*   `jest.json`\n\
    *   `wdio.BUILD.conf.js`\n\n从以下位置删除示例 demo features：\n\n*   `/src/features` 目录\n\
    \n执行以下两个 node 安装以立即准备好框架！\n\n```\nnpm install yarn\nyarn install\n```\n\n### 测试：从链接到\
    \ UserID 文本框的 Tab \n\n残障人士主要依靠使用键盘和 tab 事件到达他们想要移动的地方！特别是，一系列 `Tab` 事件将他们带到 github.com\
    \ 上的用户 id 文本框。在几次 tab 之后有一个业务链接，下一个 tab 即可到达 user id 字段，因此我们的下一个测试是确保从业务链接处按 `TAB`\
    \ 键应该让用户到达 user id 字段！\n\n特性文件（Feature file）：\n\n![Image](img/Image_057_.jpg)\n\
    \n![Image](img/F038_CDC.png)\n\n图 17.2. 测试文件。\n\n![Image](img/F039_CDC.jpg)\n\n\
    图 17.3. Github 网站。\n\n![Image](img/Image_058_.jpg)\n\n注意：遵循页面以获取更多键盘操作，例如 `KeyA`\
    \ 代表字母 A 等等：https://w3c.github.io/webdriver/#keyboard-actions\n\n在 `webstormIDE`\
    \ 的终端中使用以下命令运行此测试：\n\n![Image](img/Image_059_.jpg)\n\n编写一个测试，以确保在 user id 字段输入文本后文本框不为空：\n\
    \n![Image](img/Image_060_.jpg)\n\n在 [www.google.com](http://www.google.com) 上使用各种快捷键的类似示例：\n\
    \n![Image](img/Image_061_.jpg)![Image](img/Image_062_.jpg)\n\n# 第 18 章：“设计”阶段的无障碍测试\n\
    \n为你自己或你的客户进行设计——无障碍是强制性的！必须关注以下三个元素以符合无障碍标准：\n\n*   设计\n*   开发\n*   内容\n\n###\
    \ 测试服务于前庭功能障碍用户的应用程序。\n\n强烈建议使用以下清单测试应用程序并验证动画：是否允许用户关闭动画或闪烁内容？\n\n*   应用程序是否不完全依赖动画？\n\
    *   应用程序是否具有逻辑的开始和结束状态？\n*   是否避免使用运动并尝试使用溶解（dissolve）过渡？\n\n如果上述所有问题的回答均为“是”，则设计阶段的无障碍测试通过。\n\
    \n## 18.1 为服务于“色盲”客户设计应用程序\n\n假设该网站销售三种不同颜色的床单：红色、白色和蓝色；在产品页面上显示颜色时，先显示床单图像，然后是三个带有单选按钮的颜色块。\n\
    \n潜在的缺陷是什么？\n\n如果页面上提供了多种颜色，对于普通用户选择正确的颜色很容易，但对于色盲用户来说，所有颜色看起来都一样。\n\n**建议：**\
    \ 颜色应与旁边的文本关联，说明相应的颜色名称，以便残障用户能够听并理解颜色差异。\n\n## 18.2 设计和测试对动画和运动敏感的应用程序\n\n负责地使用动画以避免无障碍问题，并确保应用程序不依赖动画；模式敏感型用户在应用程序使用闪烁时会感到困难！\n\
    \n### 18.2.1 测试网页上的焦点指示器\n\n当用户患有关节炎等疾病时，他们大多数时候不使用鼠标，而是依靠键盘访问 Web 应用程序。此外，每次键盘操作改变时，光标移动也会改变。因此，指示网页上的焦点位置非常重要，如果用户有部分视力受损，这非常有用。\n\
    \n改进键盘操作的更好代码设计：假设网页上的部分提供了以下 html：\n\n```html\n<div onclick=\"clickIt()\">\n\
    ```\n\n当用户尝试使用鼠标访问该部分时，可能可以点击 Web 组件，但无法使用键盘选择这些项目。因此，强烈建议将代码修改为：\n\n```html\n\
    <div href=\"#link\" onclick=\"clickIt()\">\n```\n\n### 18.2.2 如何避免键盘陷阱（Keyboard\
    \ Traps）？\n\n假设客户正在网页上填写注册表单，并且当该字段为必填字段时，将税号留为空，并且有一条错误消息说明用户在导航到页面其他部分之前应输入税号。当用户尝试使用键盘按\
    \ `TAB` 或 `SHIFT+TAB` 时，无法让用户离开此文本框。如果用户使用鼠标，可以通过鼠标点击事件点击其他文本框，但无法使用键盘移动到任何地方。问题：用户完全被困在这种情境中，这种缺陷被称为“键盘陷阱”。\n\
    \n**修复：** 强烈建议由设计师定义标签页模式并共享给开发人员和测试人员，以便在代码中轻松识别并防止键盘陷阱。\n\n### 18.2.3 触摸友好型界面\n\
    \n假设用户闲置一段时间后，从笔记本电脑访问网页时，页面显示“点击任何地方继续”，用户点击网页的任何位置后页面将再次激活。如果使用 JAWS 或 NVDA\
    \ 等辅助技术的用户访问同一页面，用户将如何点击或触摸页面上的任何地方来继续？\n\n**解决方案：** 不要使用“点击任何地方继续”，而应该是一个按钮（例如“点击此处”或“继续”），并关联链接，以便用户可以通过\
    \ JAWS 或 NVDA 的链接列表进行选择。\n\n"
