    # Chapter 4: What is Java Virtual Machine?\n\n![Intelligenza Artificiale, Cervello,\
    \ Pensare, Controllo](image_rsrc3YF3.jpg)\n\nA virtual machine is software that\
    \ emulates a physical machine. In traditional programming languages, code is compiled\
    \ into machine language for a specific platform. In Java, code is compiled into\
    \ a virtual machine language called `bytecode`. The `JVM` acts as an intermediary\
    \ between `bytecode` and the underlying physical machine. Every platform that\
    \ supports Java has its own implementation of the `JVM`. Java applications are\
    \ portable because every `JVM` adheres to a standard interface.\n\nThe distribution\
    \ package of the `JVM` and standard libraries is called the Java Runtime Environment\
    \ (`JRE`). The distribution package of the `JRE` and development tools, such as\
    \ the compiler and debugger, is called the Java Development Kit (`JDK`).\n\nGoing\
    \ back to the initial problem that we introduced earlier (i.e. making a compute\
    \ `add 1 + 1`), now we have a set of instructions (i.e. your algorithm) to solve\
    \ the problem, the next thing you need to do is to translate that into instructions\
    \ that a computer can understand. Remember that a computer doesn’t speak English\
    \ or any other human language. As it was explained earlier, you need to translate\
    \ all those instructions to a series of binary signals. But doing all that translation\
    \ work will take up a lot of your time. Remember that each character is composed\
    \ of at least 8 bits. After that you need to string them up into actual instructions\
    \ to access computer memory and then do a math operations etc.—in short it’s a\
    \ huge mess. No one wants to deal with that.\n\nSo, you speak a different language\
    \ and the computer speaks a different one. Well, how are you going to get both\
    \ parties to meet halfway? That is where programming languages like Java come\
    \ in. Think of a programming language as a go-between language that both computers\
    \ and also human beings can understand—well so to speak, we’ll clarify the details\
    \ behind that in a little bit.\n\nThe goal here is to make the computer understand\
    \ your instructions. There are two phases that will happen before you can accomplish\
    \ that. The first step is to write your algorithm using a programming language.\
    \ Yes, a go between language between you and the machine. Well, computers still\
    \ can’t completely understand all the stuff that you will write even though it\
    \ is already in Java code. And that is where step 2 comes in (2 steps remember?)—your\
    \ Java code will then be processed by a program called a `compiler`. As it was\
    \ explained earlier when we covered the components of the Java platform, a `compiler`\
    \ is a program or app that translates your programming code into machine readable\
    \ instructions (aka instructions that your computer can understand).\n\nThere\
    \ are actually a few more things that will happen in the background like a pre-compiling\
    \ step as well as accessing Java libraries (mentioned earlier), then there is\
    \ the actual translation into binary codes via an `assembler`, and more lines\
    \ of code added to your original code that you wrote. Again, all of that happens\
    \ in the background. As a Java programmer you shouldn’t worry about that because\
    \ the Java platform was developed to handle all of that. It’s fun to know and\
    \ maybe when your programming skills have leveled up then you can go into the\
    \ low level programming details yourself.\n\nNow there is one last bit of preliminary\
    \ info that you should know about before we can dive right into writing your Java\
    \ programming code. And that is the Java Virtual Machine. There is a recurring\
    \ problem about the different types of hardware and software that are available\
    \ in different devices today. The hardware and software components of a smart\
    \ phone will behave differently compared to that of your car or maybe your laptop.\
    \ To make things more complicated, the combination of different processor chips,\
    \ different operating systems, and different arrays of electrical components will\
    \ mean different ways to compile (or translate) the code you have written. You\
    \ need to make machine code specific to the platform of the device that you are\
    \ programming.\n\nSo, what is the Java Virtual Machine or `JVM`? It is a program\
    \ or application that is designed to run computer programs on any device or machine.\
    \ It was quite a revolutionary program when it was released in 1995 and it is\
    \ still a huge innovation today. It solved the dilemma that was described earlier.\
    \ Think of the `JVM` as a kind of virtual computer inside your computer. It actually\
    \ has two main functions.\n\nThe first one is to run any program on any device\
    \ and on any operating system or software. This is summarized in the principle\
    \ of “write once, run anywhere” – you’ll hear that a lot and other programming\
    \ rules of thumb as you gain more experience. The other function is allocating\
    \ memory space—and it is very good at managing a computer’s memory. The `JVM`\
    \ is loaded on a computer’s memory (`RAM`). It is independent, which means it\
    \ can run on any device that has support for Java—well, almost every device supports\
    \ Java today. It doesn’t produce code for each type of machine, chip, and software\
    \ combination out there. That is just impossible. And even if you tried it would\
    \ make Java way too large a system since you have to accommodate every type of\
    \ hardware, software, and operating system there is.\n\nSo, how does the `JVM`\
    \ do it? It produces its own unique code format called `bytecode`. Take note that\
    \ unlike other programming languages, when your Java source code is compiled it\
    \ isn’t directly translated or converted into machine readable language—well,\
    \ again because the goal is not to make a specific type of code that can run on\
    \ only one platform. The Java `bytecode` produced by a `compiler` is a set of\
    \ instructions that are in machine language. `Bytecode` will run on any computer\
    \ that has `JVM` installed in it. This also means that `JVM` runs not just Java\
    \ code and Java programs, it can also run programs written in other languages\
    \ as well—all that is needed is for those to be understood.\n\n## Writing Your\
    \ First Java Code\n\nBefore you can write and run any Java program on your computer\
    \ you need to install it first. To install the Java Runtime Environment (`JRE`)\
    \ (i.e. the entire Java system with `JVM`, the Java libraries, and all the other\
    \ files), you need to go to the official corporate website by `https://www.oracle.com/javase/index.html`.\
    \ Instructions on how to download `JRE` will be provided in those pages as well.\
    \ Now, your computer might prompt you that don’t have Java (the system that runs\
    \ programs) installed on your computer, then you can download it by `https://java.com/en/download/help/download.xml`.\
    \ Note: `JRE` is what you need to write Java programs, but your computer will\
    \ need to install the actual Java system so that it can run programs. Note that\
    \ the link provided above is for Windows operating systems. If you need to install\
    \ Java for other operating systems like Mac OS, Linux, and others, you should\
    \ go here instead `https://java.com/en/download/manual.jsp`. If for some reason\
    \ those links don’t work or you are taken to a different page, then just Google\
    \ “JRE download” and then click on the link that has `http://www.oracle.com`.\n\
    \n### Required Tools\n\nFor now all you need is a text editor to write your first\
    \ Java program. You can use any text editor that comes with your system (e.g.\
    \ `Notepad` if you’re using Windows). You can also use `Notepad++` if you want\
    \ something that has more programming support. However, if you want to develop\
    \ applications, test your programming code, and have tools that will make programming\
    \ in Java a lot easier, then you will need a program called `IDE`, which stands\
    \ for integrated development environment. And `IDE` is an app that comes with\
    \ pretty all the facilities and tools a programmer needs.\n\n### IDE Features\n\
    \nAn `IDE` usually comes with features like autocomplete and text highlighting.\
    \ It can also be used in the building of executable files. Your Java code is usually\
    \ saved as a `.java` file. A `compiler` will then process that file and return\
    \ a `.class` file, which is a file that you can run to test how your Java code\
    \ works.\n\n### Debug\n\nDebugging is another important feature of `IDEs`. Debugging\
    \ refers to location and removal of programming errors on your Java source code.\
    \ No one expects you to be perfect but programming errors will prevent your code\
    \ from running. `IDEs` have debugging tools to help you spot the errors quickly\
    \ so that you can edit them ASAP.\n\n## Best IDEs for Java Programming\n\nThere\
    \ are numerous `IDEs` that you can use for Java programming. We can’t hope to\
    \ name them all so we’ll just go over the top 3 `IDEs`.\n\n1. NetBeans\n`NetBeans`\
    \ was first released back in 1997 and it can run on different operating systems\
    \ like Windows, Solaris, Mac OS, and Linux. `NetBeans` is actually the official\
    \ `IDE` for Java 8. Just like Java, `NetBeans` is open source – that means it\
    \ is free to download and use. It features semantic and syntactic highlighting.\
    \ It also allows you to refactor your source code (i.e. rewriting code making\
    \ it more efficient without actually causing any programming problems). Refactoring\
    \ is done either to improve the performance of a program or to update it to the\
    \ latest standards. In other words you are giving an old program an upgrade or\
    \ update.\n\n2. IntelliJ IDEA\n`IntelliJ IDEA` was first released back in January\
    \ of 2001. It runs on Windows, Mac OS, and Linux. This `IDE` comes in 2 different\
    \ editions. The first one is the proprietary aka the commercial version (i.e.\
    \ the one you have to pay for) and the other one is the Apache 2 Licensed edition.\
    \ This is the `IDE` for really serious programmers—we suggest that you use this\
    \ integrated development environment after you have gained a lot of experience\
    \ programming in Java. You can call this the deep dive `IDE`. Two of the unique\
    \ and powerful features of `IntelliJ IDEA` include flow analysis and cross language\
    \ refactoring. It also provides support for other `JVM` based languages—yes there\
    \ are other programming languages that also use `JVM`.\n\n3. Eclipse\n`Eclipse`\
    \ is another advanced integrated development environment. In fact, this one is\
    \ solely dedicated and specialized for the development of Java programs. Well,\
    \ it also supports other programming languages as well, which makes it a very\
    \ powerful tool. In case you have reached the point of being able to combine different\
    \ programs written in different programming languages then you might want to consider\
    \ getting this `IDE`. If you are a beginner then that will be some time in the\
    \ future. Now there are two versions of `Eclipse`. There is a cloud version of\
    \ this `IDE` which is called `Eclipse Che` and there is the good old desktop version,\
    \ which you can download on your computer. Both of these versions come with an\
    \ entire suite of tools, apps, and plugins that make programming work a whole\
    \ lot easier. It even comes with its own custom `compiler`. This `IDE` is loaded\
    \ with a lot of useful features. For instance, if you want to focus on developing\
    \ plugins for programs that have already been written, `Eclipse` has a Plugin\
    \ Environment. It has all the tools you need to create and improve plugins.\n\n\
    ## Chapter 5: Basic structure of a Java Program\n\n![Bordo, Elettronica, Colcolato,\
    \ Ingegneria Elettrica](image_rsrc3YG.jpg)\n\n### Package\n\nOn the first line,\
    \ we have the statement `package helloworld;`. This statement tells the compiler\
    \ that the Java file we wrote belongs to the `helloworld` package. A `package`\
    \ is simply a grouping of related classes and interfaces. When we write `package\
    \ helloworld;` at the top of our file, we are asking the compiler to include this\
    \ file in the `helloworld` package. The compiler will then create a folder named\
    \ `helloworld`. Files that belong to the same package are stored in the same folder.\
    \ If you navigate to your `BeansProjects` folder now, you’ll find a folder named\
    \ `HelloWorld`. The `BeansProject` folder is normally located in your `Documents`\
    \ folder. If you can’t find this folder, try searching for it using your computer’s\
    \ search function. Within the `HelloWorld` folder, you’ll find a `src` folder\
    \ that contains the `helloworld` folder. In addition to packages created by us,\
    \ Java also comes with a large number of pre-created packages that we can use\
    \ in our programs. For instance, code for input and output is bundled in the `java.io`\
    \ package while code for implementing components of a graphical interface (like\
    \ buttons, menus, etc) is bundled in the `java.awt` package. To use these pre-written\
    \ packages, we need to import them into our programs. We’ll learn how to do that\
    \ at a later time.\n\n### The main() Method\n\nWithin the `HelloWorld` class,\
    \ we have the `main()` method which starts on line 5 and ends on line 8. The `main()`\
    \ method is the entry point of all Java applications. Whenever a Java application\
    \ is started, the `main()` method is the first method to be called. Notice the\
    \ words `String[] args` inside the parenthesis of our `main()` method? This means\
    \ the `main()` method can take in an array of strings as input. In our example,\
    \ the `main()` method contains two lines of code.\n\n```\npublic static void main\
    \ (String[] args) {\n    // Print the words Hello World on the screen\n    System.out.println(\"\
