    \ [Runtime errors]\n- [Logical error]\n- [Warnings in C programming]\n\n## INTRODUCTION\n\
    \nThe history of Java dates back to 1991 when programmers Patrick Haughton, Mike\
    \ Sheridan, and James Gosling thought of a programming language that could best\
    \ be used for the development of Digital TV. However, it was deemed to be way\
    \ ahead of its own time, and thus, they redeveloped it based on the C+ and C++\
    \ platforms to make it easier and more economical to use.\n\nWith the redevelopment\
    \ also came the core principles of Java, which are:\n- It has to be portable—or\
    \ that it should work on as many platforms as possible, without any of them not\
    \ working as well as the other;\n- It should be safe and secure to use—and definitely\
    \ well;\n- People should feel connected to it as little time as possible, which\
    \ means that they should be working with words that are somehow familiar to them,\
    \ and even though it looks complex at first, sooner or later, they have to realize\
    \ it actually works;\n- It should be dynamic, should work in threads, and could\
    \ be modified when needed, and it should perform with precision.\n\nAs you can\
    \ see, these core principles give you the feeling that programmers real made Java\
    \ for the people—so they can enjoy more programs without having to buy too many\
    \ devices. In 1995, Sun Microsystems finally released Java 1.0—the first inception\
    \ of Java, which had amazing security, no-cost runtimes, and file access across\
    \ all networks. Over the years, more Java releases had been made, and ever since\
    \ 2006, Java started to be available through GNU, General Public License—meaning\
    \ it is now a free, open-source programming language. This stemmed from the public\
    \ outcry that happened once some of its contents were made private and only available\
    \ for a fee, which definitely does not resonate with its core. Start reading this\
    \ book now and you'll learn more about Java in no time!\n\n## Chapter 1: What\
    \ is Java?\n\nJava is a programming language that is built by Sun Microsystems,\
    \ which was later taken over by Oracle Corporation. It is designed to run on any\
    \ operating system that supports Java. This is what made the language so popular,\
    \ because the developer just had to write the program once, the program could\
    \ then run on any operating system without the need for the programmer to change\
    \ the code. Most of the modern applications built around the world are made from\
    \ the Java language. Most of the server side and business logic of major applications\
    \ are built on the Java language. During the entire course of this book you will\
    \ learn how to write programs such as the one above, and also learn advanced concepts\
    \ that will enable you to start writing complete applications. Some of the design\
    \ goals for Java are mentioned below:\n\n(Note: The provided text then continues\
    \ with \"Other design goals are discussed next\")\n\n### 1.1 Strong Type Checking\n\
    \nJava is a strong type language. Every variable that is defined needs to be attached\
    \ to a data type. You don’t need to understand the complete program for now, but\
    \ let’s just have a quick look at 2 lines of the code.\n\n```\nint i=5;\n```\n\
    \nHere we are defining something known as a variable, which is used to hold a\
    \ value. The value that can be stored depends on the data type. In this example\
    \ we are saying that `i` is of the type `int` or `Integer`, which is a number\
    \ data.\n\n### Array Bounds Checking\n\nAt runtime, Java will check whether the\
    \ array has the required number of values. If one tries to access a value which\
    \ is outside the bounds of the array, an exception will be thrown. You don’t need\
    \ to understand the complete program for now, but let’s just have a quick look\
    \ at the following lines of the code.\n\n```java\nint[] array1 = new int[2];\n\
    ```\n\nHere we are declaring an array, which is a set of integer values. The value\
    \ of `2` means that we can only store two values in the array.\n\n```java\narray1[0]\
    \ = 1;\narray1[1] = 2;\narray1[2] = 3;\n```\n\nWith this code we can see that\
    \ we are assigning 3 values to the array. When you run this program, you will\
    \ get an error because the program will see that the array has gone out of its\
    \ maximum allowable bounds of two. You will get the below error at runtime.\n\n\
    ```\nException in thread \"main\" java.lang.ArrayIndexOutOfBoundsException: 2\
    \ at HelloWorld.main(HelloWorld.java:8)\n```\n\n## Chapter 2: Why Java is important?\n\
    \nNext, Java has syntax and features that resemble other programming languages\
    \ like C and C++. If you have any prior programming experience, you will find\
    \ learning Java a breeze. Even if you are totally new to programming, you can\
    \ rest assured that Java is designed to be a relatively easy language to learn.\
    \ Most programmers find it easier to learn Java than say, C or C++.\n\nJava is\
    \ also designed to be platform independent. As mentioned earlier, Java code is\
    \ compiled into bytecode first, which can be run on any machine that has the Java\
    \ Virtual Machine. Hence with Java, you can write the code once and run it anywhere\
    \ you want. Next, Java is an object-oriented programming (OOP) language. Object-oriented\
    \ programming is an approach to programming that breaks a programming problem\
    \ into objects that interact with each other. We’ll be looking at various object-oriented\
    \ programming concepts in this book. Once you master Java, you will be familiar\
    \ with these concepts. This will make it easier for you to master other object-oriented\
    \ programming languages in future.\n\n### Basic Tips\n\nHow has java become so\
    \ successful? Java is such a widespread language for many reasons, and it owes\
    \ a lot around the key principles it was designed around. One of the first principles\
    \ of Java is its ease of use. (Note: The provided text ends here).\n"
