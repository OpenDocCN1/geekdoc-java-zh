    \ 第 7 章：数据类型和变量\n\n当然，使用 Java 的关键原因之一是它对面向对象编程的关注。面向对象编程或 `OOP` 是一种编程语言，允许程序代码围绕数据而不是函数进行组织（被称为过程化编程）。这些“数据簇”被组织成名为\
    \ `objects`（对象）的东西，因此有了面向对象编程的称名。这些对象是由名为 `classes`（类）的东西创建的，这里的理解是指类是对象的类型。`class`\
    \ 的属性是创建对象的原始数据：这些是描述符，例如它所拥有的值。第二个标准是对象的 `method`（方法）。这个 `method` 是行为。`JVM` 加载到计算机的内存（`RAM`）中。它是独立的，这意味着它可以运行在任何支持\
    \ Java 的设备上——呃，今天几乎每个设备都支持 Java。它不会为现有的每种机器、芯片和软件组合生成代码。那是不可能的。即使你尝试这样做，也会让 Java\
    \ 变成一个极其庞大的系统，因为你必须容纳所有类型的硬件、软件和操作系统。\n\n所以，`JVM` 是如何做到的？它产生自己独特的代码格式，称为 `bytecode`。注意，与其他编程语言不同，当你的\
    \ Java 源代码被编译时，它并没有被直接翻译或转换为机器可读语言——呃，再次是因为目标不是创建一种只能在一个平台上运行的特定类型代码。由 `compiler`\
    \ 产生的 Java `bytecode` 是一组机器语言的指令。`Bytecode` 将在任何安装了 `JVM` 的计算机上运行。这也这意味着 `JVM`\
    \ 不仅运行 Java 代码，还可以运行其他语言编写的代码——这一切都是为了被理解。\n\n## 编写你的第一个 Java 代码\n\n在你的计算机上编写和运行任何\
    \ Java 程序之前，你首先需要安装它。为了安装 Java 运行环境 (`JRE`)（即带有 `JVM`、Java 库以及其他文件的系统），你需要访问官方网站\
    \ `https://www.oracle.com/javase/index.html`。如何下载 `JRE` 的说明也会在这些页面提供。现在，你的计算机可能会提示没有安装\
    \ Java（运行程序的系统），然后你可以通过 `https://java.com/en/download/help.xml` 下载它。`JRE` 是你编写\
    \ Java 程序所需要的。如果你需要为 Mac OS、Linux 等其他操作系统安装 Java，由于某种原因这些链接无效，你应该去这里 `https://java.com/en/download/manual.jsp`。\n\
    \n### 需要的工具\n\n现在你只需要一个文本编辑器来编写第一个 Java 程序。你可以使用系统自带的任何文本编辑器（例如，如果你使用 Windows，可以使用\
    \ `Notepad`）。如果你想要更多支持，可以使用 `Notepad++`。然而，如果你想开发应用程序、测试你的编程代码并拥有让 Java 编程变得容易许多工具，你需要一个名为\
    \ `IDE` 的程序，代表集成开发环境。`IDE` 是一个带有程序员所需的所有设施和工具的应用程序。\n\n### IDE 特性\n\n`IDE` 通常带有自动完成和文本高亮功能。它还可以用于可执行文件的构建。你的\
    \ Java 代码通常保存为 `.java` 文件。一个 `compiler` 将处理该文件并返回一个 `.class` 文件，这是一个你可以运行以测试 Java\
    \ 代码的文件。\n\n### 调试\n\n调试是 `IDE` 的另一个重要功能。调试指的是对 Java 源代码定位并移除编程错误。没有人期望你是完美的，但编程错误会阻止你的代码运行。`IDE`\
    \ 拥有调试工具帮助你快速发现错误以便你可以尽快编辑它们。\n\n## Java 编程的最佳 IDE\n\n有很多 `IDE` 可以用于 Java 编程。我们无法列出所有，所以我们将介绍前三个\
    \ `IDE`。\n\n1. NetBeans\n`NetBeans` 最初于 1997 年发布，可以在 Windows、Solaris、Mac OS 和\
    \ Linux 等操作系统上运行。`NetBeans` 实际上是 Java 8 的官方 `IDE`。和 Java 一样，`NetBeans` 是开源的这意味着它是免费下载使用的。它具有语义和语法高亮。它还允许你重构源代码（即重写代码而不引起任何编程问题）。重构是为了提高性能或将其更新到最新标准。换句话说，你正在对旧程序进行升级或更新。\n\
    \n2. IntelliJ IDEA\n`IntelliJ IDEA` 最初于 2001 年 1 月发布。它在 Windows、Mac OS 和 Linux\
    \ 上运行。这个 `IDE` 有两个不同的版本。第一个是专有的，即商业版本（即你需要付费的那个），另一个是 Apache 2 许可版本。这是给真正严肃的程序员的\
    \ `IDE`——我们建议你在获得大量 Java 编程经验后使用这个集成开发环境。你可以称之为深度 `IDE`。`IntelliJ IDEA` 的两个独特且强大的功能包括流分析和跨语言重构。它还支持其他基于\
    \ `JVM` 的语言——是的，还有其他使用 `JVM` 的编程语言。\n\n3. Eclipse\n`Eclipse` 是另一个高级集成开发环境。事实上，这一个专门用于\
    \ Java 程序的开发。呃，它也支持其他编程语言，这使其成为一个非常强大的工具。如果你已经达到了能够组合不同编程语言编写的程序的程度，那么你可能考虑获取这个\
    \ `IDE`。如果你是一个学者，那是未来的事情。现在有两个版本的 `Eclipse`。有一个这个 `IDE` 的云版本，称为 `Eclipse Che`，还有一个老式的桌面版本，你可以在你的计算机上下载它。这两个版本都带有一整套工具、应用程序和插件，让编程工作变得容易得多。它甚至带有自己的自定义\
    \ `compiler`。这个 `IDE` 加载了许多有用功能。例如，如果你想专注于为已编写的程序开发插件，`Eclipse` 有一个插件环境。它拥有创建和改进插件所需工具。\n\
