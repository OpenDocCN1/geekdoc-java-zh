  trans: "\n你已经熟悉前两个了——`public` 和 `private`。当变量被声明为 `public` 时，它可以在你正在编写的程序的任何地方使用。相比之下，当它是\
    \ `private` 时，它在实例化它的类体之外的任何地方都无法被看到或访问。\n\n让我们其他两个访问控制修饰符。\n\n列表中的下一个是 `protected`\
    \ —— 当你想要创建库（libs）时它非常有用。当一个变量是 `protected` 时，意味着它只能在实例化该 Java 构造的包内被可见——注意，这也包含了所有的子类。\n\
    \n另一方面，`default` 访问控制修饰符在未指定另外三个修饰符时由使用。在这种模式下，变量可以在程序员实例化它的包或类中被访问。然而，请注意，该变量仅在类的主体内可访问，在它的子类中不可用。\n\
    \n请注意，你也可以在方法内部创建对象，并适用通常规则——对象或变量只能在创建它的方法体内被访问。\n\n关于你在方法内部创建的变量，还有另一个重要点需要记住——它只能指定一个关键字：`final`。你将不允许在方法体内创建\
    \ `default`、`protected`、`public` 甚至 `private` 变量。这基本上就是信息在代码中隐藏的方式，如果你观察的话，它有助于数据抽象和封装。\n\
    \n## 封装？信息隐藏？它们之间有什么区别？\n\n乍一看，封装与数据或信息隐藏似乎是相同的，但这两个术语之间确实存在细微的。现在，Nat Pryce 和\
    \ Steve Freeman 对这两个术语做出了非常准确的区分，尽管你可能读到其他作者交替使用这些术语。\n\n我们在这里使用 Freeman 和 Pryce\
    \ 的描述来区分 Java 编程中这两个概念的差异。让我们从信息隐藏开始，因为我们是从那里结束的。\n\n### 信息隐藏\n你已经可以判断“信息隐藏”的意思了。它仅仅意味着信息被隐藏了。程序执行的实际功能和过程被隐藏了。\n\
    \n但是，目的是什么？为什么要向程序员隐藏内部运行机制？忽略低层细节是为了让你（程序员）能够关注更重要的事情。这也是 Java 中数据被抽象的原因。你可以创建类、对象以及程序的其他元素；你甚至可以将对象从一个程序导入到另一个程序，而无需担心该对象是如何运作的细节。\n\
    \n这就像开车。你只需要知道当你把钥匙插入锁孔并启动汽车时，它就会启动。你不需要担心是什么让它启动的，下面的电线是如何连接的，汽油去哪里，引擎如何燃烧汽油等等。你只需要启动汽车并安全驾驶。\n\
    \n### 封装\n另一方面，封装允许用户控制对象对类的其他部分影响的变化量。“封装”（encapsulate）一词的意思是将一切封闭在一个单一单元中。这意味着，由于\
    \ Java 编程系统的设计，一个独立单元之间将不会有预期的依赖。记住，Java 编程环境中的对象旨在是独立的，而且没有全局变量可以引用。\n\n## 抽象\n\
    抽象简单指的是隐藏对象不必要的细节并只显示相关细节的过程。另一方面，封装意味着将对象的状态和方法绑定在一起。这种绑定最终创建了所谓的 `class`（类）（我们稍后会介绍）。最后，消息传递指的是对象与其他对象交互的能力。\n\
    \n另一方面，高级编程语言具有更高层次的抽象，这意味着代码在计算机可以使用它之前，会通过一个名为 `compiler`（编译器）的程序，它充当计算机的翻译器。这种抽象程度通常到了编程语言已经具有类似于英语（一种全球语言）的语法的程度。\n\
    \n`compiler` 承担了高级语言和机器之间翻译器的角色。这允许程序员以一种更自然的方式编写他们的程序，因为它允许编码者使用更“自然”的语言，而高级语言允许某些功能自动化，使编码者的生活变得简单得多。然而，这里的权衡是代码必须通过\
    \ `compiler`，这会导致程序运行和执行的时间更长，而且与低级语言相比，计算机通常会使用更多内存。这些高级语言中包含了更广为人知的语言，如 `Python`、`C++`\
    \ 以及我们今天的话题 `Java`。\n\n## 第 16 章：Java 面试题\n\n### Java 编程语言\n- 什么是 `WORA` 原则？它有什么好处？\n\
    - Java 应用如何在多个平台上运行？\n- `JRE` 和 `JDK` 的区别是什么？\n- 过程化编程和面向对象编程的区别是什么？\n\n### 面向对象编程（第一部分）\n\
    - `class`（类）和 `object`（对象）的区别是什么？\n- 当 `object` 第一次实例化时会发生什么？\n- 原始类型和 `object`\
    \ 的区别是什么？\n- 自动装箱（autoboxing）和拆箱（unboxing）的区别是什么？\n- 什么是数组？\n- `String` 和普通对象有什么区别？\n\
    - `StringBuilder` 和 `StringBuffer` 的区别是什么？\n- `enums`（枚举）在包 default`default？\n\
    \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
    \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
    \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n - `static`\
    \  `？\n\n   \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n   方法方法的作用？\n- 什么是递归方法？\n\
    - 什么是 `final` 关键字的作用？\n- 为什么 `static` 方法不能访问非静态字段？\n- 什么是 `volatile` 关键字的作用？\n\
    - 什么是 `synchronize` 关键字对代码块的保证？\n- 内置并发数据结构有哪些？\n- 什么是执行器框架（executor framework）？\n\
    - 什么是 `ThreadLocal` 变量？\n- 什么是原子变量？\n\n### 内存管理\n- `JVM` 如何划分 `heap`（堆）？\n- 垃圾收集的标准算法是什么？\n\
    - 什么是内存泄漏？如何识别它们？\n- 引用的四种类型是什么？\n- 什么是 `ReferenceQueue`？\n- 为什么 `finalize()`\
    \ 方法不可？\n\n### Java 数据库连接\n- 什么是 `JDBC`？\n- 获取 `Connection` 对象的两种方法是什么？\n- `Statements`\
    \ 的三种类型是什么？\n- 什么是 `ResultSet`？\n- 什么是 SQL 注入攻击？如何防止？\n- 对象关系映射的优缺点是什么？\n- 什么是\
    \ `Hibernate`？\n\n### Web 应用\n- 什么是 servlet 容器？\n- 什么是 Web 应用？\n- 什么是 `WAR` 文件？\n\
    - 什么是 `web.xml` 文件？\n- `Servlet` 和 `HttpServlet` 的区别是什么？\n- `Servlet` 和 `JSP`\
    \ 的区别是什么？\n- 什么是 servlet 过滤器？\n- 什么是模型-视图-控制器模式？\n\n### Web 服务\n- 什么是面向服务的架构？\n\
    - 什么是 Web 服务？\n- `SOAP` Web 服务和 `REST` Web 服务的区别是什么？\n- `JAX-WS` 和 `JAX-RS` 的区别是什么？\n\
    - 哪些框架有助于 Java Web 服务的发展？\n\n### 算法\n- 什么是大 O 表示？常见的例子有哪些？\n- 什么是二分查找？它的性能如何？\n\
    - 什么是插入排序？它的性能如何？\n- 什么是合并排序？它的性能如何？\n- 什么是快速排序？它的性能如何？\n- 什么是 timsort？它的性能如何？\n\
    \n### Java 集合框架\n- `ArrayList` 和 `LinkedList` 的区别是什么？\n- `HashMap` 如何工作？\n- 如果键的\
    \ `hashCode()` 或 `equals()` 方法错误会发生什么？\n- `stack`（栈）和 `queue`（队列）的区别是什么？\n- 二叉搜索树、红黑树和\
    \ `heap` 的区别是什么？\n- `HashSet`、`LinkedHashSet` 和 `TreeSet` 的区别是什么？\n- 快速失败（fail-fast）迭代器和安全失败（fail-safe）迭代器的区别是什么？\n\
    \n### Streams\n- 什么是 `Stream API` 以及为什么它用？\n- 中间操作和终端操作的区别是什么？\n- 为什么中间操作的顺序很重要？\n\
    - 并行流（parallel streams）和顺序流的区别是什么？\n\n### Java 时间\n- Java 时间的尺度是什么？\n- `LocalDateTime`\
    \ 和 `ZonedDateTime` 的区别是什么？\n- `Instant`、`OffsetDateTime` 和 `ZonedDateTime` 的区别是什么？\n\
    - `Period` 和 `Duration` 的区别是什么？\n\n### 重要接口\n- 什么是 `Autocable` 接口？\n- 什么是 `Comparable`\
    \ 接口？\n- 什么是 `Comparator` 接口？\n- 什么是 `Iterable` 接口？\n- 什么是 `Runnable` 接口？\n- 什么是\
    \ `Callable` 接口？\n- 什么是 `Serializable` 接口？\n- 什么是函数接口？常见的函数接口有哪些？\n\n### 创建型模式\n\
    - 什么是 `builder` 模式？它有什么用？\n- 什么是 `factory` 模式？它有什么用？\n- 什么是 `abstract factory`\
    \ 模式？它有什么用？\n- 什么是 `prototype` 模式？它有什么用？\n- 什么是 `singleton` 模式？它有什么用？\n\n### 结构型模式\n\
    - 什么是 `adapter` 模式？它有什么用？\n- 什么是 `composite` 模式？它有什么用？\n- 什么是 `decorator` 模式？它有什么用？\n\
    - 什么是 `facade` 模式？它有什么用？\n- 什么是 `flyweight` 模式？它有什么用？\n\n### 行为型模式\n- 什么是 `command`\
    \ 模式？它有什么用？\n- 什么是 `observer` 模式？它有什么用？\n- 什么是 `strategy` 模式？它有什么用？\n- 什么是 `visitor`\
    \ 模式？它有什么用？\n- 什么是 `null object` 模式？它有什么用？\n\n### 反射\n- 什么是反射？什么是内省（introspection）？\n\
    - 什么是 `Class` 对象？\n- 什么是 `Field` 对象？\n- 什么是 `Method` 对象？\n- 反射的优缺点是什么？\n\n###\
    \ 依赖注入\n- 什么是控制反转（inversion of control）？\n- 服务定位（service locator）和注入的区别是什么？\n\
    - 构造器注入和 setter 注入的区别是什么？\n- `Spring` 容器的不同方式有哪些？\n\n### 面向切面编程\n- 核心关注点（core\
    \ concern）和交叉关注点（cross-cutting concern）的区别是什么？\n- 什么是面向切面编程？\n- 什么是接口代理？\n- 运行时织入（runtime\
    \ weaving）和二进制织入（binary weaving）的区别是什么？\n- 什么是 `AspectJ` 库？\n\n### 单元测试\n- 什么是测试驱动开发（test-driven\
    \ development）？它有什么好处？\n- 什么是单元测试？\n- 什么是 `JUnit`？\n- 什么是 mock 对象？\n\n### 编程题\n\
    - 如何写一个计算某个数的阶乘的方法？\n- 如何判断字符串是否是回文？\n- 给一行，如何验证括号是否平衡？\n- 给出一个从 100 中缺失的无序列表，如何确定缺失的数字？\n\
    \n### 个人问题\n- 能介绍一下你自己和你的经验吗？\n- 能介绍一下你做过的任何副作用项目吗？\n- 能介绍一次你解决特别挑战问题的经历吗？\n-\
    \ 能介绍一次你与同事解决意见的经历吗？\n- 你之前的环境是怎样的？\n- 你为什么想在我们公司工作？\n- 你为什么要离开现在的工作？\n- 你最大的缺点是什么？最大的优点是什么？\n\
    \n## 第 17 章：Java 语言和术语\n\n### 绝对文件名\n绝对文件名是具有从文件系统顶部或根目录提供的完整路径的文件，例如 `c:\\Java\\\
    bin\\javac.exe`。\n\n### 抽象\n抽象是对复杂情况的简单表示。基本上，抽象隐藏了代码或程序的运行，只显示其功能。OOP 设计围绕在建模现实对象时寻找一个抽象级别。太高会导致捕获的细节不足；太低则可能导致程序变得复杂且难以理解。\n\
    \n### 抽象方法\n抽象方法是头部包含关键字 `abstract` 的方法。抽象方法没有方法体。在接口内部设计的任何方法都被认为是抽象的，没有例外。抽象方法的体定义在抽象类的子类中，或者如果类实现了该接口，则定义在该类中。\n\
    \n### 抽象窗口工具包\n`AWT`（Abstract Windowing Toolkit）包含一组类，旨在让创建带有 GUI（图形用户界面）的应用程序变得简单。你会在\
    \ `java.awt` 包组中找到它们，包含的类有按钮、窗口、帧、文本区域等。\n\n### 访问方法\n访问方法专门设计用于提供类私有属性访问的方法。根据\
    \ Java 约定，访问方法以 `get` 加上属性名作为前缀。例如，为了访问名为 `speed` 的属性，访问方法为 `getSpeed()`。当属性被设置为\
    \ `private` 时，除非使用修改器方法（mutator method），否则外部类无法修改该值。我们可以使用访问方法对私有属性值提供特定访问，并阻止其他类中的对象访问私有属性——为了实现这一点，需要使用正确的可见性。\n\
    \n### Actor\n见 `client`。\n\n### 实际参数\n这是从方法外部传递到内部的参数值。当方法被调用时，值（实际参数）将被复制到形式参数中。\n\
    \n### 实际参数\n见 `actual argument`。\n\n### 地址空间\n这是程序运行的内存区域。\n\n### Agent\n见 `server`。\n\
    \n### 聚合\n聚合是一种 OOP 概念，其中一个对象至少有一个从属对象组成其状态。当该对象不再存在或被毁时，从属对象也是。聚合被称为 HAS-A 关系，继承是\
    \ IS-A 关系。\n\n### 别名\n别名是对对象的多个引用。\n\n### 匿名数组\n匿名数组是没有标识符的数组。例如：`int[] rainfall\
    \ = new int[]{10, 8, 9, 5, 3, 2, 0};`\n\n### 数组\n数组是固定大小的对象，可以持有声明类型的项目。例如，`int`\
    \ 数组将持有 `int` 项。\n\n### 数组初始化\n数组初始化用于初始化数组。例如：\n```java\nint[] pair = {4, 2};\n\
    ```\n等同于以下语句：\n```java\nint[] pair;\npair = new int[2];\npair[0] = 4;\npair[1]\
    \ = 2;\n```\n\n### 汇编器\n汇编器用于将汇编语言编写的程序转换为指定指令集的二进制形式。\n\n### 汇编语言\n汇编语言是符号语言，非常接近中央处理器（CPU）指令集。汇编器（上述）是将程序转换为二进制的翻译程序。\n\
    \n### 赋值\n赋值运算符是等号（=`），用于将表达式的值存储到变量；例如，`variable = expression`。在赋值之前必须评估运算符的右侧。赋值本身可以用于表达式。这个示例赋值语句将零存入两个变量中——`x\
    \ = y = 0`。\n\n### 赋值语句\n赋值语句是包含赋值运算符的语句。\n\n### 属性\n属性是实例变量的特定用途。类实例中的属性值定义了该特定实例当前的状态。类定义可以通过要求给定属性或属性不取特定值来对有效实例施加约束。例如，如果属性持有类的考试结果，它不应该有负值。属性可以使用修改器方法和访问方法进行操作。\n\
    \n### 基础情况\n基础情况是通过递归方法时采取的非递归路径。\n\n### 基础类型\n基础类型指示数组中的项类型，即数组的定义类型。例如：\n```java\n\
    int[] numbers;\n```\nnumbers 的基础类型为 `int`。如果基础情况是类类型，它将指示数组可以存储对象的最低上类型。例如：\n\
    ```java\nShip[] berths;\n```\n`berths` 中可以存储的所有都是 `Ship` 类的实例。如果数组的基础类型是 `Object`，它可能被用来描述任何类。\n\
    \n### API\n见 `application programming interface`。\n\n### 追加模式\n追加模式是文件写入的一种模式，当文件打开时保留内容且新内容被添加。\n\
    \n### Applet\nApplet 是小型 Java 程序，基于 Applet 类。它们被用于提供页面上的活动内容，它们具有许多限制。\n\n###\
    \ 匿名类\n匿名类是没有类名的类。例如：\n```java\nbutton.addActionListener(new ActionListener(){\n\
    \    public void actionPerformed(ActionEvent e){\n        System.exit(0);\n  \
    \  }\n});\n```\n\n### 匿名对象\n（此处内容重复或缺失，根据原文逻辑已处理）\n"
- fmt: "\n# Chapter 1: What is the C language?\n\nThis book is a comprehensive introduction\
    \ to C language with in-depth examples. It is often misunderstood that C has lost\
    \ its popularity due to the entrance of modern programming languages such as `Java`\
    \ and `Python`. However, a lot of beginners don't understand that `C` is still\
    \ extensively used to develop compilers and operating systems. A lot of advanced\
    \ programming concepts used in C language are still considered a pathway to understanding\
    \ programming in a better way. This chapter introduces various important characteristics\
    \ of C language in detail. We recommend you to use an operating system of your\
    \ choice to experiment with the programs introduced in this book. Let us go!\n\
    \n## History of C\n\nIt is mandatory to discuss the history of a programming language\
    \ before starting to discuss its specific components, principles, and philosophy.\
    \ In the 1970s when the programming industry was very small and when there were\
    \ very few effective programming languages, `C` was invented in the Bell labs\
    \ by Denis Ritchie. He developed `C` language to use it for the development of\
    \ the `UNIX` operating system that Bell labs corporation is trying to build. Almost\
    \ all the components of the `UNIX` system are extensively written using the `C`\
    \ programming language. A lot of graphical user functionalities were also implemented\
    \ with the help of the `C` language. Luckily, `UNIX` has become very popular in\
    \ the technological landscape and has given `C` its required popularity. With\
    \ the initial success of `C` language, Denis Ritchie and Bell labs started to\
    \ distribute `C` language within different operating systems. One of the famous\
    \ operating systems that came equipped with `C` language in the old times is `IBM\
    \ PC`. A lot of the computer-related industries started to implement their code\
    \ while developing `C` programming applications. So, within a very little time,\
    \ `C` has evolved into one of the most popular middle-level languages. Even after\
    \ 50 years after its invention, `C` is still considered one of the most important\
    \ middle-level languages that the world has ever seen. It is still widely used\
    \ to develop system programming applications and artificial intelligence applications\
    \ that deal with hardware equipment such as Robotics and Electric cars.\n\n##\
    \ Why is it so special?\n\nFirst of all, understand that `C` language is considered\
    \ bad for developing modern web and mobile applications. There are several modern\
    \ programming languages such as `Java`, `Php` to serve this purpose. `C` language\
    \ programming is exclusively used in real-world system applications where we need\
    \ to work with the hardware at a low level. Modern programming languages have\
    \ very fewer libraries for this sort of implementation and practically very bad\
    \ programmatical structure that can make them nearly impossible to effectively\
    \ interact with the lower-level components of the hardware. Whereas, `C` can interact\
    \ with hardware components very effectively due to the syntactical structure and\
    \ programmatical process flows it follows. This is the reason why still `C` is\
    \ considered best to create new operating systems and compilers.\n\n## Features\
    \ of C language\n\nEven though `C` deals with low-level hardware resources it\
    \ is often considered as a middle-level language because it integrates itself\
    \ with various high-level programming language capabilities such as neat syntax\
    \ and organizing structures. `C` language is also known widely because it is used\
    \ as an entry-level teaching resource in various universities such as `Harvard`,\
    \ `Stanford`, and `Princeton`, etc., At the initial stages of the development\
    \ of `C` language, it has become difficult for programmers to develop systematic\
    \ updates for the programming language due to a lot of companies creating different\
    \ libraries and features that can be added to the language. Due to this reason,\
    \ International standard organization (`ISO`) started to declare individual library\
    \ functions for the `C` programming language. All the programmers are suggested\
    \ to use this respective format for better results. You can find out the latest\
    \ guidelines from the official C language website.\n\nHere are some of the essential\
    \ features of the C language:\n\n1. **Portable**: `C` language is considered extremely\
    \ portable and can be executed in any operating system. Previously, it is developed\
    \ to be run on `MS-DOS` systems. But with the explosion of windows, Mac and Linux\
    \ operating systems `C` has expanded its ability to support different operating\
    \ systems. A lot of third-party software developers also have developed tens of\
    \ compilers to run `C` language programs effectively.\n2. **Light**: `C` language\
    \ is often considered lighter than the other high-level programming languages\
    \ that have occupied the mainstream industry today. Even `C++`, the successor\
    \ of `C` language implements more lines of code than the `C`. The reason for the\
    \ lightweight features of `C` is due to its effective syntax principles. A lot\
    \ of modern programming languages such as `Java`, `Scala` are forced to use complex\
    \ boiler code syntax to run applications on various platforms. `C`, on the other\
    \ hand, uses simple and strict syntax that makes the language a light-weight programming\
    \ entity.\n3. **Functional programming**: The most important difference between\
    \ `C` and other high-level languages is that it supports functional programming.\
    \ It uses procedures to complete a task in a repetitive mode. Other high-level\
    \ languages use the object-oriented paradigm to implement different features in\
    \ the software. Functional programming is often considered effective to develop\
    \ system-level applications. However, with the latest updates, we can also implement\
    \ the object-oriented paradigm in `C` language. After thorough checks we have\
    \ done we are not completely satisfied with the object-oriented programming features\
    \ that `C` language offers. We recommend you to learn `Python` or `Java` if you\
    \ are keen to develop applications in the object-oriented paradigm. If you are\
    \ comfortable with a simple, effective paradigm then we suggest you try procedural\
    \ programming that `C` provides.\n4. **Extensible**: One of the important features\
    \ of the `C` language is that it can be expanded accordingly to utilize our purposes.\
    \ A lot of space communication facilities such as `NASA` use this functionality\
    \ to develop their libraries that can be used to interact with their hardware\
    \ machines and rockets. This advantage of adding our own functions to the default\
    \ library is very useful when you are developing your operating systems that are\
    \ similar to `Windows` or `Mac`.\n5. **Usage of pointers**: A pointer is an advanced\
    \ feature that is available in `C` language to point out the hardware value of\
    \ a variable. Pointers can be used to point to a memory location and can be used\
    \ in the logical implementation of complex features in the program. Very few programming\
    \ languages use pointers to represent storage location values. Even though having\
    \ its disadvantages pointers are still a valuable source to implement complex\
    \ features in the software.\n6. **Huge library of functions**: `C` provides a\
    \ large library of system functions. All these functions serve a purpose and can\
    \ be used for developing high-level applications. We will be discussing different\
    \ functions and string manipulation in detail in the later chapters. Apart from\
    \ these features, `C` language is also an open-source resource and is free to\
    \ use. With this, we have completed a brief introduction to the C language. This\
    \ chapter acts as an introduction to C language by experts. In the next chapter,\
    \ which is a continuation of the concepts we will discuss various advantages and\
    \ applications.\n\n# History of C continued\n\nIt is mandatory to discuss the\
    \ history of a programming language before starting to discuss its specific components,\
    \ principles, and philosophy. In the 1970s when the programming industry was very\
    \ small and when there were very few effective programming languages, `C` was\
    \ invented in the Bell labs by Denis Ritchie. He developed `C` language to use\
    \ it for the development of the `UNIX` operating system that Bell labs corporation\
    \ is trying to build. Almost all the components of the `UNIX` system are extensively\
    \ written using the `C` programming language. A lot of graphical user functionalities\
    \ were also implemented with the help of the `C` language. Luckily, `UNIX` has\
    \ become very popular in the technological landscape and has given `C` its required\
    \ popularity. With the initial success of `C` language, Denis Ritchie and Bell\
    \ labs started to distribute `C` language within different operating systems.\
    \ One of the famous operating systems that came equipped with `C` language in\
    \ the old times is `IBM PC`. A lot of the computer-related industries started\
    \ to implement their code while developing `C` programming applications. So, within\
    \ a very little time, `C` has evolved into one of the most popular middle-level\
    \ languages. Even after 50 years after its invention, `C` is still considered\
    \ one of the most important middle-level languages that the world has ever seen.\
    \ It is still widely used to develop system programming applications and artificial\
    \ intelligence applications that deal with hardware equipment such as Robotics\
    \ and Electric cars.\n\n# Chapter 2: Why C language is important?\n\nFirst of\
    \ all, understand that `C` language is considered bad for developing modern web\
    \ and mobile applications. There are several modern programming languages such\
    \ as `Java`, `Php` to serve this purpose. `C` language programming is exclusively\
    \ used in real-world system applications where we need to work with the hardware\
    \ at a low level. Modern programming languages have very fewer libraries for this\
    \ sort of implementation and practically very bad programmatical structure that\
    \ can make them nearly impossible to effectively interact with the lower-level\
    \ components of the hardware. Whereas, `C` can interact with hardware components\
    \ very effectively due to the syntactical structure and programmatical process\
    \ flows it follows. This is the reason why still `C` is considered best to create\
    \ new operating systems and compilers.\n\n## Why is it so special?\n\n1. **They\
    \ are fast**: The important advantage of `C` is it can deal directly with hardware\
    \ resources. A lot of other programming languages offer abundant features but\
    \ they cannot beat the faster processing time that `C` offers.\n2. **It is portable**:\
    \ Portability is one of the main reasons for success of `C`. Back in those days,\
    \ assembly languages have made portability a distant difficulty and often forced\
    \ programmers to create multiple versions of code to deploy on different devices.\
    \ However, `C` started to offer advanced customizations that can help us run the\
    \ program on any platform with the help of supportive compiler.\n3. **Modularity**:\
    \ `C` language offers you to store snippets of your code in the form of modular\
    \ entities. These are like user made functions that can be imported whenever they\
    \ are needed. These are more related to packages in Java. Modularity are extensible\
    \ and can solve a lot of problems that programmers facing.\n4. **A statically\
    \ typed language**: There is a lot of argument in programming circles between\
    \ static and dynamic languages related to which is effective. The difference between\
    \ dynamic and statically typed languages is that during compile time, statically\
    \ typed languages show errors in a much faster. `C` is a statically typed language\
    \ and performs at a faster rate due to this feature. However we don't deny the\
    \ fact that dynamically typed languages provide much better features during the\
    \ compilation process.\n5. **A learning resource**: `C` language apart from holding\
    \ a lot of advantages can help you understand programming in depth. A lot of modern\
    \ programming languages are dynamic and will not provide you a way to learn and\
    \ adapt the programming philosophy that paved a path for a technological revolution.\
    \ However, `C`, on the other hand, provides a lot of significant information that\
    \ can help you understand the working process of computers. This is the sole reason\
    \ why `C` is extensively used as a primary programming language for various graduate\
    \ courses in topmost universities.\n6. **Important to understand other languages**:\
    \ `C` is a learning pathway to understand different programming languages such\
    \ as `Python`, `C++`, and `C#`. A lot of compilers, interpreters and IDEs of these\
    \ famous programming languages are developed using `C`. Learning about `C` can\
    \ help you understand the programmatical syntax structure of other high-level\
    \ languages.\n\n## Applications of the C language\n\nAs said before, `C` is a\
    \ system-level language that can be extensively used to develop system-level applications.\
    \ Here are some of them:\n\n1. **To develop compilers**: A lot of compiler technologies\
    \ are built upon `C`. Compilers are an essential component that is necessary to\
    \ run a software or an application. Also, compilers are required to understand\
    \ the hardware architecture before compiling the program. This is the reason why\
    \ `C` programming language is highly adaptable for developing compilers and its\
    \ add-on applications. It can also be used to develop interpreters and assemblers.\n\
    2. **To create operating systems**: Operating systems are an easy interface that\
    \ serves as a mediator between the user and the computer. A lot of operating systems\
    \ use `C` as a primary language due to its extensibility and fast processing nature.\
    \ `Linux`, a famous open-source operating system used `C` to develop its most\
    \ important component `kernel`.\n3. **System-based applications**: A lot of devices/applications\
    \ that are linked with hardware resources use `C` to develop applications. For\
    \ example, Tesla cars use `C` language to communicate between its components.\
    \ Robotics, a future technology also focuses on much about complex `C` programming\
    \ concepts.\n\n## What are some downsides?\n\nLike other programming languages,\
    \ `C` is also not perfect in some cases. This section is provided for you to understand\
    \ what `C` cannot offer for the programmers.\n\n1. **It Doesn't support object-oriented\
    \ paradigm**: All of the programmers knew that the Object-oriented programming\
    \ paradigm is one of the most important and widely used programming paradigms.\
    \ However, `C` doesn't support OOP's and solely focuses on procedural programming\
    \ with the help of functions. A lot of institutions, services use packaging structure\
    \ to distribute files between their employees. So, due to the procedural nature\
    \ of the `C` programming language, it is often not considered as a primary development\
    \ language for projects that require a huge number of contributors.\n2. **Not\
    \ everything can be done with C**: `C` is not a multi-use language. It cannot\
    \ be useful for web and mobile application development unlike other high-level\
    \ languages.\n\n# Chapter 3: What is a Program?\n\nFrom 1950s computers have slowly\
    \ occupied and lead the technological revolution. At the initial stages, it is\
    \ considered extremely difficult to just do numerical calculations. Magnetic cards\
    \ are used as input and output devices and they almost occupied a whole room.\
    \ However, with time computer scientists have made this problem away. Nowadays,\
    \ we can find computers in the size of wrists with gigabytes of memory. The success\
    \ of computers is mainly due to programs that are used to make software. Programming\
    \ languages are developed to create meaningful programs. In this chapter, we will\
    \ in detail discuss the importance of programs and how they work.\n\n## is programming?\n\
    \nComputers are a lot different from humans. They are not neurally active and\
    \ doesn't consist of any emotions that humans possess. Computers mostly rely on\
    \ instructions. The only reason why computers have become better than humans is\
    \ that they do tasks effectively without any time. However, we can consider computers\
    \ as dumb machines. If they are not provided with a solution to the problem beforehand,\
    \ they can't solve it. Even after twenty years of tremendous research robotics\
    \ is not a successful field because it is difficult to make machines that take\
    \ decisions by themselves. In the early stages of computer development, people\
    \ used to use instruction sets to complete tasks. These instructions sets are\
    \ allowed to use only for scientific and military purposes. Several multinational\
    \ companies started to experiment with their employees to create a whole new way\
    \ to pass instructions to computers. All dreamt of an easy way to make things\
    \ out.\n\n## is a Program?\n\nProgramming languages use Programs to give varied\
    \ instructions to the computing machines. From a mathematical perspective, the\
    \ process of giving step-by-step instructions is called an algorithm. A lot of\
    \ statistical concepts in mathematics too use algorithms to solve a problem. An\
    \ algorithm is not only a step-by-step procedure but a way that is proven to be\
    \ effective. In programming, we use programs to create a logical instruction that\
    \ can make us solve a specific problem as quickly and effectively as possible.\
    \ Experienced programmers try to create programs that are in less code length\
    \ and which consumes fewer resources. It is not important to create a working\
    \ code, but it is also important to create code that is feasible and which effectively\
    \ understands the resources that are available to it.\n\n## What is the difference\
    \ between Algorithm & program?\n\nAlgorithm and program are closely interlinked.\
    \ When a programmer is trying to solve a problem, he first finds a logical and\
    \ provable way to complete it. He monitors the inputs and outputs that are available\
    \ and creates a step-by-step procedure to solve it. This is called an algorithm\
    \ from a theoretical basis. However, computers can't understand human language.\
    \ They use the binary system to understand instructions. This is the reason why\
    \ we need to represent our algorithm in a way such that computers can understand.\
    \ This process is technically known as programming. Programming uses a set of\
    \ programs to make the computer understand what needs to be done.\n\n## are the\
