    ## 第 8 章：Java 数据结构与算法

    ![Steinzeitcomputer, Calcolatore, Monumento, Betonrechner](img/image_rsrc3YR.jpg)


    为了更清楚这一点，假设有一个类叫做“Human”（人类）。这个“类”将拥有身高、体重、性别、种族等属性。“human”类还可以拥有“跑步”、“行走”、“说话”等方法。这些理论组件构成了“human”类，它是对象的蓝图。既然类已经定义好了，程序员如果愿意，可以使用“human”类作为蓝图创建一个对象。他们可以调用类
    `Human` 并“填充”它的属性，赋予它特定的身高、体重、性别和种族。


    此外，对象已经内置了这些函数，如“跑步”、“行走”和“说话”，因此在从“Human”类创建对象（例如命名为“Mike”的对象）时，它已经包含了跑步、行走和说话的功能，不需要程序员再次编写这些特定函数，因为它们在创建的对象中是“固有”的。简而言之，这就是面向对象编程的意义：一种编程方式，允许程序员利用预定义的类，以便更方便地描述它们，并使用它们的内部或内置函数来操作它们。


    假设读者不是编程的新手，并且已经通过 C 或或其他过程化倾向较强的语言接触过编程世界，那么下一个逻辑问题将是：为什么要用面向对象编程呢？嗯，它的主要优势之一是从长远来看，它节省了时间。在简单的算法和程序中，过程化编程通常快得多且更直接；程序员不需要构建和定义一个类，并根据该类创建对象，他们只需要声明必要的变量并编写函数，然后创建算法来解决他们需要代码处理的问题。


    然而，当涉及到更复杂的程序、需要更复杂的解决方案时，这就是面向对象编程开始大放异彩、也是它开始展现实力的地方。在许多程序中，会有许多“对象”或数据簇必须组合在一起，并且程序员将以某种方式处理它们。这正是“类”要解决的问题。他们不需要为每个数据簇声明一组新变量，只需利用预制的“类”并创建一个新的“对象”。让我们看看这在实践中是如何运作的。如果一个程序员用过程化的方式编写象棋游戏，那么他们必须手动描述每个棋子：所有的
    16 个兵、四个马、四个车、两个皇后和两个国王。此外，他们还必须编写允许每个棋子按自己的方式移动的函数。然而，如果程序员使用面向对象编程，而不需要编写兵、四个马、四个车、两个皇后、两个国王，他们只需要编写六个类：每个类描述棋板上的一个棋子。程序员现在可以简单地在每个类中包含移动函数，并用属性描述位置：它是皇的兵还是黑皇的兵，这些都可以通过“兵”类的“属性”部分插入。而不是编写
    30 个簇。


