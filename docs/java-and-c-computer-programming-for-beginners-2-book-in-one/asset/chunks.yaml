    ## Chapter 11: Java Web Development

    ## What are Java Web Applications?

    Java web applications are, quite simply, web apps built using Java. But, much
    more than that, they are applications that generate web pages that are fully interactive,
    each containing different markup language types, such XML, HTML, and so on, along
    with dynamic content. Typically, a Java web application will be made up of web
    components that modify data temporarily store the data, interact with web services
    and with databases and will render content as requested by the application users.
    Some of the components are JSP – JavaServer Pages, JavaBeans and servlets. Many
    of the tasks that are required for the development of web applications can be
    somewhat repetitive or they may require huge amounts of boilerplate code. We can
    use web frameworks to take away some of the overhead that goes with the common
    development activities, for example, many of the frameworks include useful libraries
    that help you with page templating, session management and they often promote
    the reuse of code.


    ## What is Java EE?

    Java Enterprise Edition (Java EE) is one of the most used platforms and contains
    a range of coordinated technologies that take some the complexity and cost out
    of the development of server-tier applications, making it easier to deploy and
    manage. Java EE builds on Java SE and gives us a full set of development APIs
    that help us run-side applications that are fully secure, portable, and reliable.
    Some of the basic components include:

    - EJB (Enterprise JavaBeans) – fully managed server-side architecture for enclosing
    application logic. With EJB technology we can rapidly develop Java-based applications
    that are distributed, secure, transactional in a simplified way.

    - JPA (Java Persistence API) – a framework that provides ORM (Object-Relational
    Mapping) for data management capabilities within applications built using Java.


    ## Ajax with JavaScript

    JavaScript is used mainly in the client-side user interfaces in web applications
    and is an object-oriented language. Ajax, stands for Asynchronous JavaScript and
    XML, is a technique that provides the ability for web pages to change without
    having to refresh the page each time. JavaScript toolkits can easily be used to
    implement components enabled by Ajax, along with their functionality, into web
    page.


    ## Practicalities of Developing Web Applications

    Now it’s time to get practical because that’s the only way to learn how to build
    a web application. The first place to start is in setting up environment so you
    can follow along. The software and resources you will need are:

    - The NetBeans IDE – v 7.2 onwards, Java EE

    - Java Development Kit – v 7 onwards

    - Glassfish Server Open Edition – v 4 onwards

    - Tomcat Servlet container v 7 onwards

    - Oracle Web Logic Server – v 10 onwards

    If you opt for the Java EE version, you can easily install both the Glassfish
    and Apache servlet containers.


    ### Set Your Project

    Once you have downloaded everything from above, you can follow this tutorial.
    Start by opening the NetBeans IDE. Click File > New Project in the main menu or
    click `CTRL+SHIFT+N` if you prefer to use keyboard shortcuts. Now click on Categories
    and choose Java Web Projects > Web Application > Next. Go to the text box for
    Project Name and call it HelloWeb. Decide the Project Location – it can be any
    directory on your system. For this tutorial we will be referring the directory
    as `$PROJECTHOME`. This is an optional step – check the box beside Use Dedicated
    Folder for Storing Libraries and decide where the libraries folder will go. Click
    on Next and a panel for the Server and Settings will open. Choose which Java EE
    version you are going to use with the application Next, choose which server you
    will use for deployment of your application. Note that you will only see those
    servers that are registered with the NetBeans IDE. Also note the Context Path
    (on server) changes to `/HelloWeb/` - this is indicative of the name you provided
    earlier. Click on Finish. NetBeans IDE will now create a project folder called
    `$PROJECTHOME/HelloWeb`. If you go to the Files window in NetBeans or press `CTRL+2`,
    you can see the file structure for this project; go to the Projects window, or
    press `CTRL+1` and you can see the logical structure. This project folder is where
    all of your metadata and source will go for this project. HelloWeb will open directly
    in NetBeans IDE while the Welcome page, which is index.jsp, will open in the main
    window in the Source Editor. Note – The NetBeans IDE may generate the default
    welcome page as `index.html` but this will depend on which server and which version
    of the Java EE you chose when the project was created. You have two choices –
    follow this tutorial using the `index.html` file or go to the New File wizard
    and create an `index.jsp` file – if you choose the latter, make sure you delete
    `index.html` to avoid confusion.


