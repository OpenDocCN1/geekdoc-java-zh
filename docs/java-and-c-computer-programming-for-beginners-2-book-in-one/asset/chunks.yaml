    \ [ctime]\n- [本地时间]\n- [gmtime]\n- [mktime]\n- [第 13 章：变量]\n- [什么是变量?]\n- [如何赋值变量?]\n\
    - [为什么需要数据类型?]\n- [创建变量的规则]\n- [数字]\n- [int]\n- [float]\n- [double]\n- [字符]\n\
    - [字符串]\n- [布尔数据类型]\n- [第 14 章：指针]\n- [什么是指针?]\n- [如何声明指针?]\n- [指针的优点]\n- [空指针]\n\
    - [如何在函数中使用指针?]\n- [如何使用指针数组?]\n- [第 15 章：双指针]\n- [什么是双指针?]\n- [声明双指针]\n- [理解双指针]\n\
    - [第 16 章：创建 C 程序]\n- [如何创建 C 程序?]\n- [第 17 章：C 编程中的常见错误]\n- [什么是错误?]\n- [C 语言中的错误]\n\
    - [语法错误]\n- [运行时错误]\n- [逻辑错误]\n- [C 编程中的警告]\n\n## 引言\n\nJava 的历史可以溯到 1991 年，当时程序员\
    \ Patrick Haughton、Mike Sheridan 和 James Gosling 设想了一种最适用于数字电视开发的编程语言。然而，它被认为超前时代，因此他们基于\
    \ C 和 C++ 平台重新开发了它，使其更易用、更具效益。\n\n随着重新开发，Java 的核心原则也之诞生：\n- 它必须是可移植的——或者说应该在尽可能多的平台上运行，且没有哪个平台的效果不如其他；\n\
    - 它在使用时应该是安全可靠的——而且非常好用；\n- 人们与之接触的时间应该尽可能少，这意味着他们应该使用一些熟悉的单词，尽管起初看起来很复杂，但早晚他们都会意识到它是真正有效的；\n\
    - 它应该是动态的，应该在线程中工作，并在需要时可以修改，并且执行应该精确。\n\n如你所见，这些核心原则让你感觉程序员确实为人们制作了 Java——这样他们就可以享受更多的程序，而无需购买太多的设备。1995\
    \ 年，Sun Microsystems 最后发布了 Java 1.0——Java 的首次诞生，它具有惊人的安全性、免费的运行时以及跨网络的文件访问能力。多年来，Java\
    \ 发布了更多版本，自 2006 年以来，Java 开始通过 GNU 通用许可许可证可用——这意味着它现在是一种免费的开源编程语言。这源于一旦某些内容变为私有且仅收费后引发的公众抗议，这显然与其核心理念背道而驰。现在开始阅读这本书，你很快就能学会更多\
    \ Java！\n\n## 第 1 章：什么是 Java?\n\nJava 是一种由 Sun Microsystems 构建的编程语言，后来被 Oracle\
    \ 公司收购。它被设计为运行在任何支持 Java 的操作系统上。这使得该语言如此受欢迎，因为开发者只需要编写一次程序，程序就可以运行在任何操作系统上，而不需要程序员更改代码。世界上大部分的现代应用程序都是用\
    \ Java 语言制作的。大型程序的服务器端和业务逻辑都是构建在 Java 语言之上的。在本书的范围内，你将学习如何编写像上面那样的程序，学习让你能够开始编写完整应用程序的高级概念。下面提到了\
    \ Java 的一些设计目标：\n\n（注：提供的文本随后继续写道“接下来将讨论其他设计目标”）\n\n### 1.1 强类型检查\n\nJava 是一种强类型语言。定义的每个变量都需要关联到一个数据类型。你不需要理解整个程序，但让我们快速看看这几行代码。\n\
    \n```\nint i=5;\n```\n\n在这里我们定义了一个名为变量的东西，它用于存储值。`i` 存储的值取决于其数据类型。\n\n### 数组边界检查\n\
    \n在运行时，Java 会检查数组是否具有足够的值。如果尝试访问数组边界之外的值，将抛出一个异常。你不需要理解整个程序，但让我们快速看看以下几行代码。\n\n\
    ```java\nint[] array1 = new int[2];\n```\n\n在这里我们声明了一个数组，是一组整数值。`2` 的值意味着我们只能在数组中存储两个值。\n\
    \n```java\narray1[0] = 1;\narray1[1] = 2;\narray1[2] = 3;\n```\n\n通过这段代码我们可以看到正在给数组赋值三个值。当你运行此程序时，将得到一个错误，因为程序会发现已经超出了允许的最大边界（二）。你将在运行时遇到以下错误。\n\
    \n```\nException in thread \"main\" java.lang.ArrayIndexOutOfBoundsException:\
    \ 2 at HelloWorld.main(HelloWorld.java:8)\n```\n\n## 第 2 章：为什么 Java 很重要？\n\n接下来，Java\
    \ 的语法和特征类似于 C 和 C++ 等编程语言。如果你有任何编程经验，你会发现学习 Java 是轻而易举。即使你对编程完全陌生，也可以放心，Java 设计成是一种相对容易学习的语言。大多数程序员认为学习\
    \ Java 比学习 C 或 C++ 更容易。\n\nJava 还被设计为平台无关。正如前面提到的，Java 代码首先被编译成字节码，然后在任何带有 Java\
    \ 虚拟机的机器上运行。因此通过 Java，你只需要编写一次程序，程序就可以运行在任何操作系统上，而不需要程序员更改代码。世界上大部分的现代应用程序都是用\
    \ Java 语言制作的。大多数应用程序的服务器端和业务逻辑都是构建在 Java 语言上的。在本书中，你将学习如何编写像上面的程序，还将学习让你能够开始编写完整应用程序的高级概念。下面提到了\
    \ Java 的一些设计目标：\n\n（注：提供的文本随后继续道“接下来将讨论其他设计目标”）\n\n### 基础技巧\n\nJava 如此成功有很多原因，这在很大程度上归于其设计时的核心原则。\n\
    \n- 它必须是可移植的——或者说它应该在尽可能多的平台上运行，且没有哪个平台的效果不如其他；\n- 它在使用时应该是安全可靠的——而且非常好用；\n- 人们与之接触的时间应该尽可能少，这意味着他们应该使用一些熟悉的单词，尽管起初看起来很复杂，但早晚他们都会意识到它是真正有效的；\n\
    - 它应该是动态的，应该在线程中工作，并在需要时可以修改，并且执行应该精确。\n\n如你所见，这些核心原则让你感觉程序员确实为人们制作了 Java——这样他们就可以享受更多的程序，而无需购买太多的设备。1995\
    \ 年，Sun Microsystems 最后发布了 Java 1.0——Java 的首次诞生，它具有惊人的安全性、免费的运行时以及跨网络的文件访问。多年来，Java\
    \ 发布了更多版本，自 2006 年以来，Java 开始通过 GNU 通用许可证可用——这意味着它现在是一种免费的开源编程语言。这源于一旦某些内容变为私有且仅收费后引发的公众抗议，这显然与其核心理念背道而驰。现在开始阅读这本书，你很快就能学会更多\
    \ Java！\n\n## 第 1 章：什么是 Java?\n\nJava 是一种由 Sun Microsystems 构建的编程语言，后来被 Oracle\
    \ 公司收购。它被设计为运行在任何支持 Java 的操作系统上。这正是该语言如此受欢迎的原因，因为开发者只需要编写一次程序，程序就可以运行在任何操作系统上，而不需要程序员更改代码。世界上大部分的现代应用程序都是用\
    \ Java 语言制作的。大多数应用程序的服务器端和业务逻辑都是构建在 Java 语言上的。在本书的范围内，你将学习如何编写像上面那样的程序，还将学习让你能够开始编写完整应用程序的高级概念。下面提到了\
    \ Java 的一些设计目标：\n\n（注：提供的文本随后继续道“接下来将讨论其他设计目标”）\n\n### 1.1 强类型检查\n\nJava 是一种强类型语言。定义的每个变量都需要关联到一个数据类型。你不需要理解整个程序，但让我们快速看看这几行代码。\n\
    \n```java\nint i=5;\n```\n\n在这里我们定义了一个名为变量的东西，它用于存储值。`i` 存储的值取决于 `int` 或 `Integer`，是一个数字。\n\
    \n### 数组边界检查\n\n在运行时，Java 会检查数组是否具有足够的值。如果尝试访问数组边界之外的值，将抛出一个异常。你不需要理解整个程序，但让我们快速看看以下几行代码。\n\
    \n```java\nint[] array1 = new int[2];\n```\n\n在这里我们声明了一个数组，是一组整数值。`2` 的值意味着我们只能在数组中存储两个值。\n\
    \n```java\narray1[0] = 1;\narray1[1] = 2;\narray1[2] = 3;\n```\n\n通过这段代码我们可以看到正在给数组赋值三个值。当你运行此程序时，将得到一个错误，因为程序会发现已经超出了允许的最大边界（二）。你将在运行时遇到以下错误。\n\
    \n```\nException in thread \"main\" java.lang.ArrayIndexOutOfBoundsException:\
    \ 2 at HelloWorld.main(HelloWorld.java:8)\n```\n\n## 第 2 章：为什么 Java 很重要？\n\n接下来，Java\
    \ 的语法和特征类似于 C 和 C++ 等编程语言。如果你有任何编程经验，你会发现学习 Java 是轻而易举。即使你对编程完全陌生，可以放心，Java 设计成是一种相对容易学习的语言。大多数程序员认为学习\
    \ Java 比学习 C 或 C++ 更容易。\n\n"
