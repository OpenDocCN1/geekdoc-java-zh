  trans: "\n这条注释跨越了两行。*/如果你查看上面的注释，你会注意到它以 `/*` 开头，但以 `*/` 结尾。此外，如果你查看之前的图片（图 8），你会注意到有些注释以单个正斜杠和两个星号（`/**`）开头，但以一个星号和一个正斜杠结束；这被称为\
    \ Javadoc 注释。\n\n# 第 4 章：什么是 Java 虚拟机？\n\n![Intelligenza Artificiale, Cervello,\
    \ Pensare, Controllo](img/image_rsrc3YF3.jpg)\n\n虚拟机是一种模拟物理机器的软件。在传统编程语言中，代码被编译成针对特定平台的机器语言。在\
    \ Java 中，代码被编译成一种称为 `bytecode`（字节码）的虚拟机语言。`JVM`充当了 `bytecode` 和底层物理机器之间的媒介。每个支持\
    \ Java 的平台都有它们自己的 `JVM` 实现。Java 应用程序是可移植的，因为每个 `JVM` 都遵循标准接口。\n\n`JVM` 和标准库的发行包称为\
    \ Java 运行环境 (`JRE`)。`JRE` 的发行包以及开发工具（如编译器和调试器）称为 Java 开发工具包 (`JDK`)。\n\n回到我们之前引入的初始问题（即让计算\
    \ `add 1 + 1`），现在我们有了一组指令（即你的算法）来解决这个问题，接下来你需要做是将这些指令翻译成计算机可以理解的指令。记住，计算机不说英语或任何其他人类语言。正如之前解释过的，你需要将所有这些指令翻译成一系列二进制信号。但完成所有的翻译工作将花费你大量的时间。记住，每个字符至少由\
    \ 8 位组成。之后，你需要将它们连接成实际的指令来访问计算机内存，然后进行数学运算等——简而言之，这是一片混乱。没有人想处理那些。\n\n所以，你说一种语言，而计算机说的是另一种语言。那么，你打算如何让双方在中间点会合呢？这就是\
    \ Java 等编程语言大显身的地方。将编程语言看作是计算机和人类都能理解的中间语言——呃，可以这么说，我们稍后会澄清这背后的细节。\n\n这里的目标是让计算机理解你的指令。在实现这一点之前，会发生两个阶段。第一步是使用编程语言编写你的算法。是的，一种你和机器之间的中间语言。但是，尽管已经是\
    \ Java 代码，计算机仍然无法完全理解你写的所有内容。这就是第 2 步（记得是 2 步？）——你的 Java 代码将由一个名为 `compiler`（编译器）的程序处理。正如之前我们在介绍\
    \ Java 平台组件时解释的那样，`compiler` 是一个将你的编程代码翻译成机器可读指令（即你的计算机可以理解的指令）的程序或应用程序。\n\n实际上，后台还会发生几其他事情，例如预编译步骤以及访问\
    \ Java 库（之前提到的），然后通过 `assembler`（汇编器）将代码翻译成二进制代码，并在你编写的原始代码中添加更多行代码。再次，这一切都是在后台发生的。作为一名\
    \ Java 程序员，你不必担心这些，因为 Java 平台的设计就是为了处理所有这些内容。了解这些是很有趣的，也许当你的编程水平提高后，你就可以自己进入底层编程的细节了。\n\
    \n现在在我们直接开始编写 Java 编程代码之前，你应该了解最后一点预备信息。那就是 Java 虚拟机。关于今天不同设备中提供的不同硬件和软件，有一个反复出现的问题。智能手机的硬件和软件组件的行为与你的汽车或笔记本电脑不同。为了让情况变得更复杂，不同的处理器芯片、不同的操作系统以及不同的电气元件阵列意味着编译（或翻译）你所写代码有不同的方式。你需要让机器码针对你正在编程的设备平台。\n\
    \n那么，什么是 Java 虚拟机或 `JVM`？它是一个设计用于在任何设备或机器上运行计算机程序的程序或应用程序。它在 1995 年发布时是一项极具革命性的程序，直到今天仍然是一项巨大的创新。它解决了之前描述的困境。将\
    \ `JVM` 想象成计算机内部的一种虚拟计算机。它实际上有两个主要功能。\n\n第一个是在任何设备、任何操作系统或软件上运行任何程序。这被总结为“编写一次，随处运行”的原则——随着经验的增加，你会经常听到这句话以及其他的编程经验法则。另一个功能是分配内存空间——它非常擅长管理计算机内存。`JVM`\
    \ 加载到计算机内存（`RAM`）中。它是独立的，这意味着它可以运行在任何支持 Java 的设备上——呃，今天几乎每个设备都支持 Java。它不会为现有的每种机器、芯片和软件组合生成代码。那是不可能的。即使你尝试这样做，也会让\
    \ Java 变成一个极其庞大的系统，因为你必须容纳所有类型的硬件、软件和操作系统。\n\n那么，`JVM` 是如何做到的？它产生自己独特的代码格式，称为\
    \ `bytecode`。注意，与其他编程语言不同，当你的 Java 源代码被编译时，它并没有被直接翻译或转换为机器可读语言——呃，再次是因为目标不是创建一种只能在一个平台上运行的特定类型代码。由\
    \ `compiler` 产生的 Java `bytecode` 是一组机器语言的指令。`Bytecode` 将在任何安装了 `JVM` 的计算机上运行。这也这意味着\
    \ `JVM` 不仅运行 Java 代码，还可以运行其他语言编写的代码——这一切都是为了被理解。\n\n## 编写你的第一个 Java 代码\n\n在你的计算机上编写和运行任何\
    \ Java 程序之前，你首先需要安装它。为了安装 Java 运行环境 (`JRE`)（即带有 `JVM`、Java 库以及其他文件的系统），你需要访问官方网站。\n\
    \n### 包\n\n在第一行，我们有语句 `package helloworld;`。这条语句告诉编译器我们写的文件属于 `helloworld` 包。`package`\
    \ 只是相关类和接口的组合。当我们在文件顶部写 `package helloworld;` 时，我们是在要求编译器包含 `helloworld` 包。属于同一个包的文件存储在同一个文件夹中。如果你导航到你的\
    \ `Projects` 文件夹，你会发现一个名为 `HelloWorld` 的文件夹。`HelloWorld` 文件夹通常位于你的 `Documents`\
    \ 文件夹中。如果你找不到这个文件夹，尝试使用计算机的搜索功能。在 `HelloWorld` 文件夹中，你会找到一个 `src` 文件夹。除了我们创建的包之外，Java\
    \ 还提供了许多可以在程序使用的预创建包。例如，用于输入输出的代码在 `java.io` 包中，而实现图形界面（如按钮、菜单等）的代码在 `java.awt`\
    \ 包中。为了使用这些预写包，我们将稍后学习。\n\n### main() 方法\n\n在 `HelloWorld` 类中，我们有 `main()` 方法，它从第\
    \ 5 行开始到第 8 行结束。`main()` 方法是所有 Java 应用程序的入口。每当 Java 应用程序启动时，第一个被调用的 `main()` 方法。注意\
    \ `main()` 方法中的 `String[] args` 吗？这意味着 `main()` 方法可以接收字符串数组作为输入。在示例中，`main()`\
    \ 方法包含了两行代码。\n\n```\npublic static void main (String[] args) {\n    // 在屏幕上打印\
    \ Hello World\n    System.out.println(\"Hello World\");\n}\n```\n\n### 第 6 章：Java\
    \ 代码结构\n\n在图中，你应该注意到包名在前。此外，你应该注意分号是行的结束。分号是非常重要的，如果你漏掉了它，程序将无法编译。\n\n```\npackage\
    \ firstproject;\n\npublic class FirstProject {\n}\n```\n\n你可以在代码开头使用左括号，并使用右括号结束代码\
    \ `{这是一个代码段示例}`。然而，你应该注意左括号和右括号之间的任何内容都是代码段。此外，类的左括号和右括号之间的内容实际上是一个代码段。这意味着：\n\
    \n```\npublic static void main (String[] args) {}\n```\n\n比其他任何都重要的是 `main` 这个词。为什么？因为每当任何\
    \ Java 程序启动时，它首先寻找名为 `main` 的方法。简单来说，方法是代码的一部分。程序执行括号内的代码作为 `main` 的一部分。如果你的代码没有\
    \ `main` 方法，你会在 Java 程序中收到错误消息。然而，由于这是程序的程序的入口，你不太可能漏掉它。代码的 `public` 部分（蓝色部分）简单意味着该方法在类之外是可见的。另一方面，`static`\
    \ 意味着不需要创建新对象，而 `void` 意味着没有返回值，命令就此结束。\n\n## 如何在 Linux、Windows 和 Mac 上下载安装 Java\n\
