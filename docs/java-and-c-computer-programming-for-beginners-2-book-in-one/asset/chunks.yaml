    language.In the next chapter, we will discuss in detail about variables in depth.Let
    us go!Chapter 13: Variables![Portatile, Mano, Scrivere, Binario, Codice Binario](image_rsrc3Z2.jpg)Variables
    are one of the important components of any programming language.They store values
    and are often used in functions, structures, and templates. It is always recommended
    to learn about variables in depth before starting to create complex programs.
    In this chapter, we will discuss variables with various examples.Follow along!What
    are the variables?It is important to understand the historical significance of
    memory management before understanding variables. Before the invention of programming
    languages, all the memory is managed using the binary sequences.Everything is
    needed to be done in the hardcoded away. All of the significant memory locations
    are stored using a specific memory address in the computer.However, with time
    these hardcoded methods are proven to be ineffective.A lot of high-level programming
    languages started to use variables which are a symbolic representation of the
    memory locations.How are the variables assigned?First of all, remember that to
    create variables you need to define data types. These are also used for assigning
    literal constants. Data types are an easy way to distinguish the variables.Why
    are data types necessary?Imagine that you need to create a program that takes
    only characters as input values. It is not feasible to use strings that take up
    storage memory. Data types are used for faster memory processing and effective
    storage management. There are different types of data types such as integers,
    floating-point numbers and double. Data types can also be used to store pointers
    that store the variable address. We will learn about pointers in-depth in the
    upcoming chapters.Rules for creating variablesVariables are defined using certain
    preconceived instructions. They are often started using an underscore. However,
    remember that variables are not case sensitive. so, both upper case and lower-case
    letters can be used to create variables.Note: Reserved keywords cannot be used
    as the name of variables. There are more than 60 default reserved keywords in
    the C programming language that cannot be used as identifiers.You can find out
    the reserved keyword list from the official website.Tip:Make variable names simple.
    It is not feasible to use complex long names to declare variables. You can, of
    course, do it but it is not a good programming practice.Here are some of the good
    variable declaration examples:ramdas_UsaRandisHere are some of the bad variable
    declaration examples:1serythisisalongvariablename*gdhdpointerIn the next section,
    we will in detail discuss data types that are essential for the variables.a) NumbersNumbers
    are the most important data entity that is used in programming. All the mathematical
    equations and algorithms require integral constants to solve the specific problem.
    Cprogramming uses various data types to declare numerical variables.i) intThis
    is the most common data variable that is used to declare numerical variables.
    int cannot store decimal values and is said to occupy till ten digits. It stores
    a few bytes of data whenever a variable is declared. While implementing the printing
    statements, %n can be used to print the variables with the int data type.You can
    also use %x and %o to print the stored values in different formats such as octal
    and hexadecimal. Usually, int data type occupies 32 bytes of storage in the memory.ii)
    floatFloating-point numbers are used to represent decimal and scientific notations.
    It can occupy up to 64 digits and can be used while developing complex scientific
    applications. A lot of exponential problems and modulus calculations can be done
    with the help of floating-point literal.When printing the output statements %f
    is used as a notation.iii) doubleDouble is the advanced expansion of floating-point
    literals. In double both negative and positive decimal notations can be used.
    They can extend up to 128 digits. You can use %f or % e to print the double literals
    as an output.b) CharactersAfter numbers, the most important data types should
    be of characters and strings. Almost all applications rely on characters to communicate
    with the users. Here are the character datatypes that C programming language offers.i)
    characterCharacters are single literal expressions that can be used in a program.
    They are usually used to input responses from the user while running the program.
    Characters occupy very less memory storage and are considered good for the allocation
    of program resources.%c is usually used to designate the output of characters
    in the programming languages.ii) StringsStrings are the advanced implementation
    of character expressions. In the real world, it is not feasible to just use characters
    for expressing entities. Strings are one of the often-used data types while developing
    computer programs.%s is usually used to designate strings in the programming languages.c)
    Boolean data typesProgramming is a logical process where the computer should often
    decide between the choices that are given to it. Sometimes they may be random
    but they are usually followed by a logical equivalence. All the conditional and
    loop statements depend on Boolean data types.Usually, there are only two Boolean
    data types that are true and false.There are defined by the identifier _Bool.
    Bool variables can change the understanding of the program execution process.Here
    is an example:if (x >3){_Bool = true;printf(" Enter the condition here")}In the
    above example of a C program, the program is executed only when the logical statement
    is true. If it doesn''t satisfy the logical statement then the program will end
    and give compilation errors.Boolean data types are essential for a lot of logical
    programs and software.With this, we have completed a brief explanation about variables
    and data types.Variable declaration and assignment can be thoroughly understood
    only when you practice coding a lot of programs.We recommend you to look at different
    open source projects to understand the importance of variables. In the next chapter,
    we will learn about pointers in depth.Follow along!Chapter 14: Pointers![Computer,
    Portatile, Tech](image_rsrc3ZB.jpg)This chapter is a clear introduction to one
    of the most controversial and most discussed features of C language that is pointers.
    No other programming languages provide pointers as a feature in their index.The
    extremely low-level interaction with the hardware resources is one of the reasons
    why pointers have become a reality in the C programming language.In this chapter,
    we will give a short introduction to pointers with several examples.Follow along
    to know more about it.What are the pointers?First of all, to understand the concept
    of pointers we need to let you understand the process of indirection in computing
    and in real life. Let us imagine that you are the manager of a book store.A customer
    approaches you and asks for a book that is not available in the book store. So,
    what will you do next? You will inform the wholesale book supplier to get the
    book for your customer.That wholesale supplier you contacted will reach out to
    other book suppliers to give it to you.So, if you look at this example carefully
    you ''the manager'' just acted as a medium to deliver the book for your customer.
    You did not directly go to the book supplier to get that desired book.This process
    of mediating things to complete a task is known as indirection. Pointers in C
    follows the same mechanism. They provide access to the data value you are searching
    for.Just like how indirection reduces cost fares for the manager of the book store,
    pointers help programmers to strategically manage resources.In the next section,
    we will in detail discuss declaring a pointer with examples. Follow along!How
    to declare pointers?First of all, you need to create a variable that can be used
    to declare pointer variables.Here is the variable:int sample = 34;As soon as you
    declare a variable it is declared a storage location in the system. You can check
    it using the ampersand symbol ''&''.For example:&sample;Output:0dfd656The memory
    location will always be in a hexadecimal format.In the next section, you need
    to declare a variable that can act as a pointer.All you need to do is add an asterisk
    in front of the identifier name to declare it as a pointer.Here is the format:int
    *data_pointerThe above statement roughly states that a pointer of an integer data
    type with the name data_pointer is created. After the pointer is declared you
    can use it to point out to other variables.In the next step, we will use this
    pointer to store the first variable location that we have created. This will make
    you understand the importance of pointers in memory allocation statements.Here
    is the format:data_pointer = &sampleNow, whenever you call the pointer, you will
    get the output as the storage location of the sample variable.Output:0dfd656You
    can also use an asterisk as an indirection operator to denote all the variables
    that a pointer holds.Here is the format:*data_pointerOutput:sampleWith this, we
    have completed a brief explanation about the declaration about the pointers.In
    the next section, we will in detail discuss some of the advantages that pointers
    possess in the C programming language.Follow along!Advantages of pointers1)    
    With the help of pointers, you can create a more optimized code. For example,
    if you use static buffers to enclose a large list of values instead of pointers,
    they may lead to buffer flow errors. However, with the usage of pointers, memory
    allocation works perfectly and makes you create more complex programs.2)     Pointers
    are an essential component that needs to be used while dealing with multidimensional
    arrays that hold a lot of elements. Pointers are also extensively used to create
    data structures such as heaps, graphs, and trees.3)     Dynamic memory allocation
    is very essential if you have fewer computing resources. Pointers are the only
    way to maintain an equilibrium between the resources available. If not of pointers,
    C programming language will become clumsy and may need to deal with a lot of run-time
    errors before starting the execution of the program.4)     They are very useful
    when you are trying to do repetitive tasks such as refreshing an element or for
    sorting algorithms.Null pointersNull pointers are a special type of pointers where
    they are pointed out to a null value. Null pointers are used when they are not
    allowed to produce any return values.Here is an example:int *pointer = NULL;Now,
    whenever you call the pointer in a function you will get a null value as a result.How
    to use pointers in Functions?Pointers and functions can be used cumulatively to
    produce results. Pointers can use functions as return statements and values. Whereas,
    functions can also use points as their function parameters and arguments.Here
    is how you can use a pointer as a function argument:functionname(data_pointer)When
    the logical equivalence statements are written they take the data_pointer argument
    as a pointer.You can use this argument in the function body as:void main(){functionname
    int *data_point;}When the pointer is called it displays the storage location as
    the output result.Remember that by changing the function arguments using a pointer
    you can change the instances of the pointer but you cannot change the actual storage
    location of the variable that you are dealing with.Pointers along with functions
    can be used for faster results in software.Using this method, you can easily exchange
    values between two variables.Here is the program:main(){variable1 = data_pointervaraible2
    = *data_pointerresult = &variable2varaiabe2 = *varaible1}When the results are
    produced you will find out that the values of the variables have been exchanged.How
    to use pointers for arrays?Arrays can also use pointers to deal with complex multi-dimensional
    operations. They are used in both one-dimensional and two-dimensional arrays.Here
    is a program:main(){int variable[] = data_pointer&varaible[] = *data_pointer*data_pointer
    = int variable[]}In the above program, pointers are pointed out to arrays. They
    are very useful if you are dealing with a huge chunk of data.With this, we have
    completed a brief introduction to pointers.In the next chapter, we will with examples
    give a brief description of double pointers.Follow along to know more about it
