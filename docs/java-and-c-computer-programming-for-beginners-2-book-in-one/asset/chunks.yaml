    # 运算符概述


    * 逻辑运算符

    * 位运算符

    * 关系运算符

    * 算术运算符


    ## 基础概念


    与其他计算机语言一样，Java 有一组预定义的额外运算符，用于处理某些特定场景。在学习 Java 编程语言（或任何编程语言）时，在开始之前，你必须理解五个基本概念。这五个基本概念包括：


    1. 变量

    2. 数据结构

    3. 控制结构

    4. 语法

    5. 工具


    每个概念都将在初学者水平进行彻底解释，以确保它们被理解。


    ## 分隔符


    它们不适用于高级抽象：请注意，许多程序利用了低级结构，而这些结构主要用于低级抽象。这些编程语言的常用方法是关注机器——即如何让计算机执行某些事情，而不是这些功能如何帮助解决用户的问题。这些语言处理的是微的细节，这已经超出了高级抽象的范围，而这是我们今天看到的更常见的方法。在低级抽象中，数据结构和算法是分开的，而在高级抽象中，它们被视为一个整体。


    ## 字面量


    当提到 Java 中的字面量时，指的是以人类可读的形式出现的固定值。我们可以说数字 `200` 是一个字面量。大多数情况下，字面可以是常量。字面量在程序中很重要。事实上，大多数
    Java 程序都使用了字面量。我们在书中已经讨论过的某些程序也使用了字面量。


    Java 中的字面量涵盖各种原始数据类型。每个字面量的显示方式由其类型决定。正如之前提到的，我们将字符常量括在单引号中，例如 `''c''` 和 `''%''`。我们在整数中定义字面量时，不涉及小数部分。例如，`12`
    和 `-30` 是整数字面量。浮点字面量应该包含小数点和小数部分。`12.389` 是一个浮点字面量。Java 进一步允许对浮点字面量使用科学计数法。整数字面量包含
    `int` 值，任何人可以使用 `short`、`byte` 和 `char` 变量对其进行初始化。


    ## 注释


    当发生这种情况时，我们称之为注释。在程序的运行阶段，注释是无关紧的。这意味着你可以使用注释功能来说明或解释你创建的代码想要实现的目标。你可以通过输入两个斜杠然后跟上注释来实现。这里是一个示例：


    ```java

    //在此处放置你的单行注释

    ```


    你可以通过执行以下任一种操作拥有多行注释：


    ```java

    //我们将把

    // 注释分成两行

    /*

    ```

