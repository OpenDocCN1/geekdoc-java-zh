    ### 运算符概述


    - 逻辑运算符

    - 位运算运算符

    - 关系运算符

    - 算术运算符


    与其他计算机语言一样，Java 也定义了一系列额外的运算符，以处理某些特定的场景。在学习 Java 编程语言（或者说学习任何编程语言）时，在开始之前，你必须理解五个基本概念。这五个基本概念包括：


    1. 变量

    2. 数据结构

    3. 控制结构

    4. 语法

    5. 工具


    每一个概念都将从初学者水平进行彻底解释，以确保它们能够被理解。


    ### 核心概念


    #### 分隔符

    它们不适用于高级抽象：请注意，许多程序使用了低级结构，这些结构主要用于低级抽象。这些编程语言的通常方法是它们关注机器——即如何让计算机去做某些事情，而不是这些函数如何帮助解决用户的问题。这些语言处理的是微小的细节，这已经超出了高级抽象的范围，而高级抽象是我们今天看到的常见方法。在低级抽象中，数据结构和算法是分开的，而在高级抽象中，它们被视为一个整体。


    #### 字面量

    当提到 Java 中的字面量时，我们指的是以人类可读的形式出现的固定值。我们可以说数字 `200` 是一个字面量。大多数时候，字面量可以是常量。字面量在程序中非常重要。事实上，大多数
    Java 程序都会使用字面量。我们在书中讨论过的一些程序使用了字面量。Java 中的字面量适用于各种原始数据类型。


    每个字面量的显示方式由其类型决定。正如之前提到的，我们将字符常量括在单引号中，例如 `''c''` 和 `''%''`。我们在定义整数字面量时不时不涉及小数部分。例如，`12`
    和 `-30` 是整数字面量。浮点字面量应该包含小数点和小数部分。`12.389` 是浮点字面量。Java 进一步允许对浮点字面量使用科学计数法。整数字面量包含
    `int` 值，任何人可以使用 `short`、`byte` 和 `char` 变量对其进行初始化。


    #### 注释

    当发生这种情况时，我们称之为注释。在程序的运行阶段，注释是无关紧的。这意味着你可以使用注释功能来说明或解释你正在创建的代码想要实现的目标。你可以通过输入两个斜杠然后是注释来实现这一点。


    这是一个示例：

    ```

    //在此处放置你的单行注释

    ```

    你可以通过采取以下任一操作拥有多行注释：

    ```java

    // 我们将把

    // 注释分成两行

    ```

    或者

    ```java

    /*

    这是一个多行注释

    */

    ```


