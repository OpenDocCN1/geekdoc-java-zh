    if a variable “has a value of”, you would need to use a pair of equals signs. This
    time, we have used the NOT operator in front of the variable called user.The NOT
    operator is indicated by the use of an exclamation mark, just one, and it will
    be placed in front of the variable that you are trying to test.This operator tests
    for negation, which means that it is testing for the opposite of the actual value.  Switch
    Statements    Another way of controlling flow is to use a switch statement. This
    provides you with the option of testing for a range of values for the variables
    and can be used in place of complicated, long IF … ELSE statements. Start with
    the word “switch” and then a set of parentheses. The variable you are checking
    is placed between the switch parentheses and is followed by a set of curly brackets. The
    rest of the switch statement goes in between the curly brackets. Chapter 14: Java
    GUI ProgrammingAssuming that the reader is not a total newbie to programming,
    and has been introduced to the world of programming using C or another procedural
    – heavy language, the next logical question would be: why even use object – oriented
    programming?Well, one of its main advantages is that in the long run, it saves
    time.How to build a small game with JavaProcedural programming is usually much
    quicker and more straightforward in simpler algorithms and programs; rather than
    having to construct and define a class, and create an object based on that class,
    all the programmer really has to do is to simply declare the necessary variables
    and write the functions, and create the algorithm in order to solve the problem
    that they need the code to address.However, when it comes to more complex programs,
    needing more complex solutions, this is where object – oriented programming begins
    to shine, and this is where it starts to show its strength. In a lot of programs,
    there will be times that there will be a number of “objects” or data clusters
    that have to be grouped together, and that the programmer will be treating in
    a certain way.This is what “classes” are meant to address. Instead of declaring
    a new set of variables per data cluster, they can simply draw on a pre – made
    “class” and create a new “object”. Let’s see how this would work in practice.Each
    piece also has different methods of moving, depending on what piece they are.If
    a programmer were to code a chess game in procedural fashion, then they would
    have to manually describe each and every piece, all sixteen pawns, four bishops
    and four knights, four rooks, two queens, and two kings.In addition, they will
    have to write the functions that allow each piece to move in its own separate
    way.However, if the programmer makes use of object - oriented programming, instead
    of having to code sixteen pawns, four bishops, four knights, four rooks, two queens,
    two kings, they simply have to code six classes: one class to describe each piece
    on the board.The programmer can now simply include the movement functions within
    each class, and have the attributes describe their position: whether they’re white
    king’s pawn, or black queen’s pawn, these are all things that can be inserted
    through the “attributes” portion of the “pawn” class. Instead of thirty – two
    clusters of code, the programmer only has to do six.Now it’s much easier, much
    shorter, and also much more elegant.Chapter 15: Object Oriented Programming![Lavoro,
    Digitando, Computer, Notebook, Programmazione](image_rsrc3YY.jpg)We’re not going
    to tackle all the complex coding of object-oriented programming right now.We’re
    just going to be dealing with the raw concepts at heart: classes and objects.
    In order to understand these, we must first discuss classes.This will make some
    of the things that we said earlier – like object wrappers – make more sense.What
    is a class?The utility of classes comes from the fact that sometimes you need
    more complex structures than what the code automatically gives you.This occurs
    rarely in languages like JavaScript. Object-oriented programming is about this
    abstraction at its core: the ability to take smaller concepts and then integrate
    them into bigger structures that utilize these concepts.A better way to think
    about it is to try to imagine a dog.All dogs have features in common; for example,
    they have 2 eyes, 4 legs, and a wagging tail.They can also bark. However, there
    can be a lot of variance, too.For example, dogs can have separate breeds and other
    things which set them apart, like their size or weight.However, there are still
    unifying concepts and properties that apply to all dogs, regardless their breed,
    size, and weight, which are properties they all have in common.These can be portrayed
    as individual data members of a larger structure. This structure can be referred
    to as a dog .These individual data members are called the properties of the dog
    class.Each class can also have standard functions, like bark or wagTail , which
    are common among all instances of the class.A singular instance of a class is
    referred to as an object.Each object has its own name and can be treated as its
    own variable. So, if you define a class dog , you can create a dog variable known
    as myDog or any other standard variable name.Then, access the properties and alter
    them however you wish.This standardization and abstraction are the major appeals
    of object-oriented programming.Therefore, whenever something is referred to as
    an object , it means that a class was constructed which consists of smaller data
    types and pieces of data that all make up the bigger concept that is represented
    both through the object and through its constituent class.With that, we’ve worked
    through the bulk of the stuff that you need to know as an new JavaScript programmer.These
    are the foundations of all the knowledge you gained from this book, and it’s important
    that you understand all these before continuing.Java encapsulationInformation
    hiding is one of the key features of the Java programming language and object
    oriented programming. You have already been introduced to this concept in part
    we covered concepts on data abstraction. Simply put, an object in Java will usually
    hide how it implements its own functionality.Now, in order to do that, you will
    have to make use of access control modifiers. Here are four of them:


    *   Public


    *   Private


    *   Protected


    *   Default'
