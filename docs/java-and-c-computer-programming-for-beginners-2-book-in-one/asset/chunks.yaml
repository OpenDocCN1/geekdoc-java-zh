    *create );printf(" Let us display double pointer = %f\n", **double);}Output:Value
    of variable = GOLDPointer entity: 2s737Double pointer entity: 0x776When you look
    at the programming code, you will understand how double pointers are created.In
    the next chapter, we will learn about creating a C program using an IDE.Follow
    along!Chapter 16: Creating a C program![Informatica, Intelligenza Artificiale,
    Cervello](image_rsrc3ZD.jpg)In the previous chapters of this book, you have learned
    about various components that make up an effective program.This chapter is a brief
    one that explains you a step by step instruction to create a C program in an integrated
    development environment.This short chapter will let you understand the basic process
    of the C programming procedure.How to create a C program?Step 1:First of all,
    you need to download your favorable IDE from the official website. In this chapter,
    we will use the NetBeans IDE to run the C program that we are going to create.Step
    2:After installing the NetBeans IDE open it from the menu and create a new C file
    from the create menu in the bottom tray of the system. Make sure the extension
    of the file is .C. If not, the program will not get compiled by the IDEStep 3:Now,
    enter the given program in the IDE// Program to check whether a number is even
    or odd#include<stdio.h>// This is called a pre processing libraryvoid main(){int  sample
    = 6;if( sample /2 )printf(" This is an even number'');elseprint(" This is an odd
    number'');}Step 4:After entering the following C program in the IDE save it from
    the options on the menu. After saving it you are now already to compile it in
    the NetBeans IDE. Use the compile button from the menu. You can use F3 to compile.Step
    5:The compilation procedure will start and will show success if there are no errors.
    However, if there are any errors in the program they will be shown up in sequential
    order.Step 6:After compiling and if there are no errors you can click the Run
    (F5) button to display the output. You can also debug the code while it is running.This
    is the normal procedure to create, compile and run a C program in an IDE.In the
    next chapter, we will discuss dealing with errors in detail.Let us go!Chapter
    17: Common errors in C programming![Matrix, Rete, Scambio Di Dati, Networking,
    Virus](image_rsrc3ZE.jpg)In the previous chapters of this book, we have discussed
    various components and lexical syntax that can help us create an effective programming
    code.That particular effective program is then compiled to run in any operating
    system. However, the compiler will check the whole programming code and decide
    whether it is good by itself to run or not.If there are any errors related to
    syntax, function or run-time the program will terminate immediately and show the
    reasons for the error.As a programmer, it is an essential skill to have sufficient
    information about the types of errors you are going to deal with.If you can''t
    understand the complexity of error you have encountered then it is very difficult
    to create effective code. So, to make you aware of the essential information of
    the types of errors available in C language we provided this chapter.Learn carefully
    and try to use google if you ever face any error.Clearing errors is the best way
    to learn to program.Let us go!What is an error?Usually, programs expect a certain
    numerical, analytical or logical result to the program they have compiled. If
    you are unable to get the desired result for your program then it is called an
    error. Remember that a bug is not an error.A bug is a programmatical mistake that
    will let exploiters take advantage of it. Usually, bad programming principles
    cause an error.Errors are made by programmers because of a mistake in syntax or
    because of not following basic programming rules of that particular language.For
    example, you can''t use reserved keywords as a variable in C programming language,
    So, if you use ''for'' keyword in a variable then it will show you a syntax error.
    [ for is a reserved keyword]Errors in CC programming language is famously known
    for its unique way of representing error syntaxes in the output results. Unlike
    other high-level programming languages, C is said to be strict with case sensitive
    letters and whitespaces.It is naturally a difficult language to learn because
    it strictly follows all the guidelines.In this section, we will in detail explain
    the different errors that are available in C programming language.Follow along!a)
    Syntax errorThe syntax is like grammar to a programming language. Without exact
    precise statements, the compiler will not allow you to proceed further.In layman
    terms, syntax errors appear in C language when there is a mistake related to the
    syntax of the program. For example, wrong variable names and data types can cause
    syntax errors.Different programming languages use different syntax rules. So,
    if you are new to any programming language, we suggest you learn in-depth about
    different syntactical rules that the language uses. It is often easy to debug
    syntax errors because the compiler shows the exact code line for you.All you need
    to do is use the correct syntax in the place of incorrect syntax to make the program
    work.Here is an example:int a= 5.7493;Output:Syntax error. You can''t proceed
    furtherThe above example ended up with a syntax error because the variable is
    declared as an int data type value but is given a floating-point literal.b) Runtime
    errorsRuntime errors appear when a programmer does a mistake in the program operations
    that needs to be committed. In simple terms, runtime errors appear when the errors
    are related to the technical analysis of the program.For example, if you call
    a function that is not yet created it gives a run time error. Run time errors
    are a little bit difficult to clear off because of the ambiguity they possess.Some
    of the example of run time errors:1) Making bad and undefined calculations is
    a classic use case. For example, dividing a number by zero is a good way to understand
    it. When you divide any number by zero it is of undefined format. A computer doesn''t
    know how to represent or output the result that doesn''t exist. So, it displays
    runtime errors during the compilation process.2) A lot of file management operations
    often end up with run time errors. For example, opening a file that is not yet
    even created is not possible. So, an ambiguity is created and a run time error
    will be displayed.3) A lot of complex programs also face run time errors when
    all the memory is allocated to the program. For example, buffer overflows can
    cause a run time error.Here is an example:int a=3;a/0;Output:Runtime error --
    You cannot divide a variable with zeroc)Logical errorProgramming is a lexical
    language that uses different identifiers and literals to complete tasks with a
    computer. Programming logics are incomplete without logical statements and expressions.
    For example, OR AND NOT all are considered as logical operators that can be used
    to compare expressions and statements.Logical equivalence statements are also
    often prone to errors due to the ambiguity they create in the programming languages.Logical
    errors are often difficult to notice because they will not completely stop the
    compilation process but will give faulty results. They are like machine learning
    applications to say in layman terms.Here is an example:int a=+b;Here an unnecessary
    assignment operator is used resulting in faulty execution of the program.Warnings
    in C programmingWarnings are different from errors in the programming language.
    Warnings will not stop the execution of the program. They act as signals that
    inform you about the ineffectiveness of the program.Compilers suspect that the
    code you have written is not good in terms of execution. So, when you detect a
    warning while executing the written code, we suggest you make some changes and
    re-execute it.Here is an example:Warning -- This may need more resourcesWith this,
    we have completed a brief explanation about errors and warnings in the C programming
    language.As said before, even experienced programmers face errors while dealing
    with programming code. So, always make sure that you feel challenging whenever
    you see a programming error.Before ending this book, here are some tips to improve
    your C programming skills exponentially:1) Register yourself with GitHub and start
    reading various open-source code available. Good code can be written only when
    you are aware of the good code that has been written already.2) Start contributing
    to open-source projects. Always start with simple projects and extend your skills
    by involving complex projects with a lot of contributors.3) Don''t feel low when
    you face errors. Clear your doubts with the help of forums such as Stack Overflow.With
    this, we have completed a brief explanation about errors in this chapter and thus
    we are in the end parts of our book.We have discussed a good number of topics
    related to C programming in this book.All the best!ConclusionGlad that you have
    reached the end of this book. I hope you have enjoyed the content provided in
    the book as much we loved making this book.What to do next?As you have completed
    a complex and thorough book that deals with C programming it is now a huge test
    for you to apply your programming skills on real time projects. There are a lot
    of open-source projects that are waiting for a contribution. Remember that reading
    a lot of C language code will also help you understand the programming logics
    that C possesses.That''s it! Thanks for purchasing this book again and All the
    best!'
