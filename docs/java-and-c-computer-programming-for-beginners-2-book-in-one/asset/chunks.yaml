    Operators such as `+`, `-`, `*`, and `/` all perform the same function just like
    the rest of other languages. We have seen that JavaScript has the ability to work
    with numbers. Hence it also has the ability to work with the operators that can
    be used with the number data type. Let’s look at each of the operators in more
    detail.


    ## Arithmetic Operators

    These are operators that are used to work with numbers. The most common operators
    are shown below, followed by an example of how it can be applied. With this program,
    the output is as follows:


    JavaScript Program

    The first value is 5

    The second value is 10

    Addition operator = 15

    Subtraction operator = 5

    Multiply operator = 50

    Division operator = 5

    Increment operator = 6

    Decrement operator = 5

    Modulus operator = 5


    ## Assignment operators

    These are operators that are used to determine the value of conditions based on
    the value of the operands. The relational operators possible in JavaScript are
    given below. If a condition evaluates to true, then a value of 1 is returned,
    otherwise a value of 0 is returned. With this program, the output is as follows:


    JavaScript Program

    The first value is 5

    The second value is 10

    Are the numbers equal = false

    Are the numbers not equal = true

    Is x less than y = true

    Is x greater than y = false

    Is x greater than or equal y = false

    Is x less than or equal y = true


    ## Logical Operators

    These are operators that are used to determine the value of conditions based on
    the value of the operands, where the operands are Boolean values. The logical
    operators possible in JavaScript are given below. With this program, the output
    is as follows:


    JavaScript Program

    The first value is true

    The second value is true

    The third value is false

    x AND y = true

    y AND z = false

    z AND x = false

    z AND z = false


    The table below shows the logical operators based on the value of the operands
    for the OR operator. With this program, the output is as follows:


    JavaScript Program

    The first value is true

    The second value is true

    The third value is false

    x OR y = true

    y OR z = true

    z OR x = true

    z OR z = false


    The following table shows the logical operators based on the value of the operands
    for the NOT operator.


    ## Assignment Operators

    These are operators that are used to make assignment operations easier. The assignment
    operators possible in JavaScript are given below. Now let’s look at how we can
    implement these operators in further detail. With this program, the output is
    as follows:


    JavaScript Program

    The first value is 5

    The second value is 6

    The value of i+j is 11

    The value of i+=j is 11

    The value of i-=j is 5

    The value of i*=j is 30

    The value of i/=j is 5

    The value of i%=j is 5


    ## Bitwise Operators

    These are operators that are used to make bit operations on operands. With this
    program, the output is as follows:


    JavaScript Program

    The first value is 5

    The second value is 6

    The value of x AND y is 4

    The value of x OR y is 7

    The value of NOT x is -6

    The value of x XOR y is 3

    The value of Zero fill left shift is 10

