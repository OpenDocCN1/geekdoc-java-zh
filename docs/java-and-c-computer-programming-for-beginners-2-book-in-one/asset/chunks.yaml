    # Operators Overview


    * Logical operator

    * Bitwise operator

    * Relational operator

    * Arithmetic operator


    ## Basic Concepts


    Like other computer languages, Java has a defined list of additional operators
    to take care of certain specific scenarios. When it comes to learning JAVA programming
    language, or any programming language for the matter, there are five basic concepts
    you must understand before you get started. These five basic concepts include:


    1. Variables

    2. Data Structures

    3. Control Structures

    4. Syntax

    5. Tools


    Each of these concepts will be thoroughly explained on a beginner’s level to ensure
    that they are understood.


    ## Separators


    They are not suitable for high-level abstraction: note that a lot of these programs
    make use of low-level constructs which are primarily used for low-level abstraction.
    The usual approach with these programming languages is that they focus on the
    machine – how to make a computer do something rather than how these functions
    can help solve the issues of a user. These languages deal with the minute details,
    which is already beyond the scope of high-level abstraction, which is the more
    common approach that we see today. In low-level abstraction, data structures and
    algorithms are taken separately whereas these are taken as a whole in high-level
    abstraction.


    ## Literals


    When it comes to literals in Java, we mean the fixed values which appear in the
    form in which human beings can read. We can say the number `200` is a literal.
    Most of the time, literals can be constants. Literals are important in a program.
    In fact, most Java programs use literals. Some of the programs we have already
    discussed in this book use literals.


    Literals in Java can fall on various primitive data types. The manner in which
    every literal is shown is determined by its type. Like it was mentioned some time
    back, we enclose character constants in single quotes such as `''c''` and `''%''`
    . We define literals in integers without involving the fractional part. For instance,
    `12` and `-30` are integer literals. A floating point literal should contain the
    decimal point plus the fractional part. `12.389` is a floating literal. Java further
    permits for one to apply the scientific notation for the floating point literals.
    Integer literals contain `int` value and anyone can initialize them with a variable
    of `short`, `byte`, and `char`.


    ## Comments


    When this occurs, we call the grey’s comments. In the running stages of the program,
    the grey’s (comments) are moot. This is to mean that you can use the comment feature
    to state or explain what the code you are creating wants to achieve. You can achieve
    this by typing two slashes and then the comment. Here is a sample:


    ```java

    //Place your single line comment here

    ```


    You can have more than one comment line by doing either of the following:


    ```java

    //We are going to

    // spread the comments into two

    /*

    ```

