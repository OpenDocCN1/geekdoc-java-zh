  trans: "\n\n此注释跨越了两行。*/如果你查看上面的注释，你会发现它以 `/*` 开头，但以 `*/` 结尾。此外，如果你查看之前的图像（图 8），你会注意到有些注释以单个正斜杠和两个星号（`/**`）开头，但以一个星号和一个正斜杠结束；这被称为\
    \ Javadoc 注释。\n\n## 什么是变量\n\n另一方面，变量是一个包含特定数据类型及其已赋值或接收到的值的“对象”。它之所以被称为变量，是因为其中的值可以根据其在代码中的用处、程序员如何声明其值、甚至程序用户选择如何与其交互而发生变化。简而言之，变量是数据类型的存储单元。访问变量允许程序员方便地标记和调用手头的存储值。\n\
    \n## Java 中的变量类型\n\nJava 要求程序员使用声明语句，即使用用于声明变量并通过指定特定数据类型和名称来定义它们的代码行。Java 处理变量有种特殊方式，即将变量定义为包含特定类型和值信息的容器，这不像像\
    \ `python` 等语言只需要声明变量且变量可以动态更改其类型；Java 变量是静态的，一旦声明后就会保留其类型。\n\n```java\nint number\
    \ = 20;\nboolean completed = true;\nstring hello = \"Hello World!\";\n```\n\n\
    声明中的语法在之前的示例可见，变量类型在前，然后是变量名，最后是值。同样注意，声明语句可以在一行中由多个声明组成，如下例：\n\n```java\nint\
    \ number = 20, boolean completed = true, string hello = \"Hello World!\";\n```\n\
    \nJava 变量可以在开始时不赋任何值；在这些情况下，Java 选择为这些变量声明一个特定的默认值，例如：\n\n```java\nbyte a;\nshort\
    \ num;\nboolean answer;\n```\n\n将分别产生值 0、0 和 false。更完整的默认值列表如下：`byte`、`short`、`int`\
    \ 和 `long` 数据类型都将产生默认值 0，而 `float` 和 `double` 数据类型将具有默认值 0.0，`char` 数据类型将产生 ‘\\\
    u0000’ 值，`string` 或任何其他对象将具有 `null` 默认值，所有 `Booleans` 将以 `false` 默认值开始。\n\n在 Java\
    \ 中，变量在声明时是静态的，这意味着程序员必须定义变量将包含的数据类型。为了说明，如果我们想使用变量 `num` 来存储一个数字，我们必须先声明变量：`int\
    \ num`，然后才能赋值，例如 `num = 10`。上述过程通常被称为并指称为“赋值语句”，其中值被分配给程序员声明的变量。然而，Java（实际上是是大多数编程语言）工作方式的一个显著特点是，在赋值语句中（如我们的示例\
    \ `num = 10` 所示），存储的实际值是等号右侧的值，即值 10，而 `num` 仅仅是调用该存储值的“标记”。这就是为什么许多 Java 程序员倾向于使用“获取（getting）”一个值的术语，而不是“赋值（assigning）”，尽管在大多数情况下，它们可以互换使用，且在某些少数情况之外，功能也基本相同。但请注意，一旦值被分配给变量，就需要执行函数来使该变量内部的数据更改其数据类型。\n\
    \n## 变量命名\n\n创建变量是一项简单的任务，特别是考虑到 Java 程序员往往根据数据类型或变量将要存储的内容来创建和命名它们。然而，在命名这些变量时有几条规则，否则\
    \ Java 将无法识别并导致错误信息。关于变量名的主要限制是它不应以特殊字符（如下划线）或数字开头。但是变量名可以由字母、数字甚至下划线等字符组成，只要下划线不在开头即可。不能使用其他字符，例如\
    \ `#` 甚至空格，因为这些特殊字符在 Java 中有不同的用途，因此在变量名中不会被识别。\n\n虽然这些是主要规则，以下是命名变量的一些提示：\n-\
    \ 变量名应该是描述性的，因为在较长的代码中，很难想起 \"x\" 是做什么的。使用像 `count` 或 `output` 这样的变量名比使用通用的 `x`\
    \ 或 `y` 更容易记忆，并有助于避免混淆。\n- 除了描述性之外，如果变量名保持较短，变量也将更容易使用。虽然像 `banking_information_account_records`\
    \ 这样的变量名非常有描述性，但在程序中需要反复输入它会非常疲惫，而且较长的变量名增加拼写错误的概率，这将导致代码错误，产生运行时错误或代码未按预期运行，或者运行了但在过程中引入了错误。\n\
    - 同样注意，Java 变量一直采用全小写字母，虽然对大小写没有限制，但保持小写可以简化问题，因为漏掉大写可能会导致变量无法被识别，因为 Java 将大写字母读取为完全不同的小写字符。\n\
    \n## Java 原生类型\n\n## 方法命名规范\n\n我们将回顾命名规范，因为你将使用成员方法。Java 编程中的方法执行操作，它们还接收调用者提供的任何参数，并向调用者返回操作结果。以下是声明方法的语法：\n\
    \n```java\n[访问修饰符] 返回类型 方法([参数]) {\n    // 方法体\n}\n```\n\n在为方法命名时有几个规则需要记住：方法名总是动词或动词短语（这意味着可以使用多个单词来命名）。方法名的第一个单词应该是小写字母，其余单词应遵循驼峰命名法（camel\
    \ case）。例如：`methodName()`。现在，你应该记住动词用于方法名，而名词用于变量名，并表示某种属性。这是一个用于计算圆面积的示例代码：\n\
    \n```java\npublic double computeArea() {\n    return radius * Math.PI;\n}\n```\n\
    \n## 在代码中使用构造函数\n\n我们将介绍一些与面向对象编程相关的额外细节。正如前面所述，构造函数看起来像方法，你完全可以视为 Java 中的特殊方法。然而，构造函数在许多方面仍然与方法不同。使用\
    \ `new` 关键字或运算符来创建构造函数的实例并进行初始化。以下是使用 `Employee` 类初始化它的示例：\n\n```java\nEmployee\
    \ rate1 = new Employee();\nEmployee rate2 = new Employee(0);\n```\n\n构造函数返回 `void`——这意味着它没有返回类型。你不能在构造函数的体内部放置返回语句，因为会被编译器标记为错误。调用构造函数的唯一方法是通过使用\
    \ `new` 语句。我们已经给了你几种调用构造函数的方法。最后的区别是构造函数不能被继承。回到上面的示例——第一行包含 `Employee()` 的被称为默认构造。你可以看到，它没有参数。默认构造的作用是将成员变量初始化为特定值。在上面的示例中，成员变量\
    \ `rate1` 被初始化为默认状态。\n\n构造函数也可以重载吗？是的，可以。构造函数的行为类似于方法，这意味着你可以像重载方法一样重载构造函数。以下是重载构造函数的示例，我们使用\
    \ `Employee` 类并使用不同的参数进行重载：\n\n```java\nEmployee()\nEmployee(int r)\nEmployee(int\
    \ r, String b)\n```\n\n## 如何初始化变量\n\n现在我们知道如何声明变量，并且知道可用的各种变量类型，下一步是学习如何使用这些变量。表达式是\
    \ Java 程序中最常用的构建块，通常用于产生新值，尽管在某些情况下表达式用于给变量分配一个新值。通常，表达式由值、变量、运算符和方法调用组成。\n\n\
    有些表达式不产生结果，而是影响另一个变量。一个示例是根据操作变量值的表达式：没有输出新值，也没有对新值的真实“赋值”，而是所谓的副作用导致了变量值的改变。在我们之前的示例程序中，例如打印\
    \ \"Hello World\" 的程序，我们将原始值引入了 `print` 函数，这被称为“硬编码（hard coding）”输出。然而，此时我们应该尝试结合学到的变量知识。变量的操作方式与原始值相同，因为它们只是引用计算机之前存储的值，因此程序员可以使用变量名代替值。为了演示这一点，让我们记住之前的\
    \ \"Hello World\" 程序：\n\n```java\nprint(\"Hello World\");\ninput(\"\\n\\nPlease\
    \ the return key to close this window.\");\n```\n\n现在，不再对 \"Hello World\" 字符串进行编码，我们可以简单地将其声明为一个变量并让程序输出该变量。最终看起来应该是：\n\
    \n```java\nString string = \"Hello World\";\nprint(string);\ninput(\"\\n\\nPlease\
    \ the return key to close this window.\");\n```\n\n这应该产生与之前程序相同的结果，看起来类似于：\nHello\
    \ World\n请按回车键关闭此窗口。\n\n## 代码修改的变量\n\n读者可能会想，为什么在这种情况下我们还要使用变量，因为这让代码变得更长。在非常短的代码中，例如经典的\
    \ \"Hello World\"，使用变量确实会让它变长，但为了演示如何用它们缩短代码，让我们使用另一个代码显示变量的用处。对于这段代码，我们将尝试打印几个乘法表值。在代码中我们将使用几次迭代和循环，将在以后解释。\n\
    \n```java\nint num = 9;\nbyte count = 0;\nwhile (counter < 10) {\n    print(num\
    \ + \" * \");\n    print(counter + \"= \");\n    print(num * counter + \"\\n\"\
    );\n    counter = counter + 1;\n}\n```\n\n这段基础代码片段将输出 `num` 变量中直到乘以九的乘法表。在这个程序中，我们要整合一个所谓的\
    \ `while` 条件和一个迭代函数。然而，如果我们拆解所提供的代码组件，`while` 条件告诉 Java 继续迭代其下方的代码，直到条件不成立。由于\
    \ `count` 被初始化为 0，并且代码每次运行时，`count` 变量都会增加 1，循环将运行十次。代码看起来应该是这样的：\n9 * 0 = 0\n\
    9 * 1 = 9\n9 * 2 = 18\n9 * 3 = 27\n9 * 4 = 36\n9 * 5 = 45\n9 * 6 = 54\n9 * 7 =\
    \ 63\n9 * 8 = 72\n9 * 9 = 81\n\n"
