    ## 比较与逻辑运算符


    *   `>` - 大于

    *   `<` - 小于

    *   `>=` - 大于等于

    *   `<=` - 小于等于


    这里还有四个你可以使用的运算符：


    *   `&&` - 与（AND）

    *   `||` - 或（OR）

    *   `==` - 等于

    *   `!` - 非（NOT）


    第一个，即两个 & 符号，用于同时测试两个或多个条件。我们正在检查用户的年龄是否大于 18 岁且小于 40 岁——记住，我们检查的是名为 `user` 的变量。第一个条件是“大于
    18”，第二个条件是“小于 40”。在这两个条件之间，我们使用了与逻辑运算符，因此整行代码的意思是：如果 `user` 大于 18 且 `user` 小于
    40。现在运行程序并再次测试；在运行之前，你应该已经能猜出将打印什么了。`user` 变量的值为 21，因此 `else if` 大括号之间的消息将显示在输出窗口中。


    ### 嵌套 IF 语句

    看看大括号的位置——如果一组大括号放错位置或漏掉一个，代码将无法运行。嵌套 IF 语句可能有点复杂，但实际上，你所做的只是缩小选择范围。


    ### 布尔值

    与其使用 `int`、`double` 或 `string`，你只需要输入 `boolean`（小写 b），并在变量名之后分配一个 `TRUE` 或 `FALSE`
    值。注意，我们使用单个等号作为赋值运算符。如果你想查看一个变量是否“等于”某个值，你需要使用双等号。这次，我们在名为 `user` 的变量前面使用了非（NOT）运算符。非运算符通过使用感叹号
    `!` 表示（仅此一个），它将置于在你尝试测试的变量之前。该运算符测试否定情况，意味着它测试的是实际值的反方向值。


    ### Switch 语句

    另一种控制程序流的方法是使用 `switch` 语句。它为你提供了测试变量范围值的选项，并可以用来替代复杂的长 IF … ELSE 语句。以 `switch`
    单词开始，然后跟一组括号。你正在检查的变量放在 switch 括号之间，后面紧跟着一组大括号。`switch` 语句的其余部分放在大括号之间。


    ## 第 14 章：Java GUI 编程

    假设读者不是编程的完全新手，并且已经通过 C 或或其他重过程逻辑的语言进入了编程世界，那么下一个逻辑问题将是：为什么要使用面向对象的编程呢？嗯，它的主要优势之一是从长远来看，它可以节省时间。


    ### 如何用 Java 构建小型游戏

    在简单的算法和程序中，过程式编程通常要快得多且更直观；不需要构造和定义一个 `class` 并根据该 `class` 创建一个 `object`，程序员真正需要做的只是声明必要的变量并编写函数，然后创建算法来解决代码需要处理的问题。


    然而，当涉及到更复杂的程序、需要更复杂的解决方案时，面向对象的编程就开始大放异彩，并展现它的实力。在许多程序中，会有许多“对象”或数据簇必须被组合在一起，程序员将以特定的方式处理它们。这正是“类”要解决的问题。他们不需要为每个数据簇声明一组新变量，只需直接调用预先定义的“类”并创建一个新的“对象”。让我们看看这在实践中是如何运作的。


    每个棋子都有不同的移动方法，取决于它们是什么种棋子。如果程序员用过程式的方法来编写象棋游戏，那么他们必须手动描述每一个棋子：16 个兵、4 个主教、4 个马、4
    个车、两个皇后两个国王。此外，他们必须编写允许每个棋子以其独立方式移动的函数。然而，如果程序员利用面向对象编程，就不需要编写 16 个兵、4 个主教、4 个马、4
    个车、两个皇后两个国王，他们只需要编写六个类：每个类描述棋盘上的一个棋子。


    程序员现在可以简单地将移动函数包含在每个类中，并用属性描述它们的位置：它们是白王兵还是黑后兵，这些都可以通过“兵”类的“属性”部分插入。程序员不需要写 32
    组代码，只需要写 6 组。现在这变得简单得多、短得多，而且更加优雅。


    ## 第 15 章：面向对象编程

    ![Lavoro, Digitando, Computer, Notebook, Programmazione](img/image_rsrc3YY.jpg)

    我们现在不会处理面向对象编程的所有复杂编码。我们只需要处理核心的概念：类和对象。为了理解这些，我们必须首先讨论类。这将让我们之前说的某些内容——例如对象包装器——更有意义。


    ### 什么是类？

    类的实用性在于，有时你需要的比代码自动提供的更复杂的结构。


