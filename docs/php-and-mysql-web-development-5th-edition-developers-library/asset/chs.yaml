  价格是 $12.34\";\n$new_text = preg_replace(\"/\\$(\\d+\\.\\d{2})/\", \"USD \\1\", $text);\n\
  ```\n\n## 第 5 章：代码重用和编写函数\n\n### 包含和要求文件\n\n使用 `include` 或 `require` 来包含其他 PHP 文件。\n\
  \n```php\ninclude 'header.php';\nrequire 'config.php'; // 如果文件未找到，将抛出致命错误\nrequire_once\
  \ 'functions.php'; // 只包含一次\n```\n\n### 定义和调用函数\n\n```php\nfunction greet($name)\
  \ {\n  return \"Hello, \" . $name . \"!\";\n}\n\necho greet(\"Alice\"); // \"Hello,\
  \ Alice!\"\n```\n\n### 作用域和 `global`\n\n函数内的变量具有局部作用域。使用 `global` 关键字访问全局变量。\n\n\
  ```php\n$x = 10;\nfunction myFunction() {\n  global $x;\n  echo $x; // 10\n}\n```\n\
  \n### 返回值\n\n```php\nfunction square($num) {\n  return $num * $num;\n}\n\n$result\
  \ = square(5); // 25\n```\n\n### 匿名函数（闭包）\n\n```php\n$greet = function($name) {\n\
  \  return \"Hello, \" . $name;\n};\n\necho $greet(\"Bob\");\n```\n\n## 第 6 章：面向对象的\
  \ PHP\n\n### 定义类\n\n```php\nclass Car {\n  public $color;\n  public $model;\n\n\
  \  public function __construct($color, $model) {\n    $this->color = $color;\n \
  \   $this->model = $model;\n  }\n\n  public function drive() {\n    echo \"驾驶一辆\
  \ \" . $this->color . \" \" . $this->model;\n  }\n}\n```\n\n### 创建对象（实例）\n\n```php\n\
  $myCar = new Car(\"red\", \"Tesla\");\n$myCar->drive(); // \"驾驶一辆红色 Tesla\"\n```\n\
  \n### 访问修饰符\n\n- `public`：可从任何地方访问。\n- `protected`：可在类及其子类内访问。\n- `private`：仅可在类内访问。\n\
  \n```php\nclass Person {\n  private $secret;\n  protected $id;\n  public $name;\n\
  \n  public function __construct($name, $id, $secret) {\n    $this->name = $name;\n\
  \    $this->id = $id;\n    $this->secret = $secret;\n  }\n}\n```\n\n### 继承\n\n```php\n\
  class ElectricCar extends Car {\n  public function drive() {\n    echo \"驾驶一辆安静的\
  \ \" . $this->color . \" \" . $this->model;\n  }\n}\n```\n\n### 接口\n\n```php\ninterface\
  \ Loggable {\n  public function logMessage($message);\n}\n\nclass User implements\
  \ Loggable {\n  public function logMessage($message) {\n    echo \"用户：\" . $message;\n\
  \  }\n}\n```\n\n## 第 7 章：错误和异常处理\n\n### 异常\n\n```php\ntry {\n  $result = 10 / 0;\n\
  } catch (Exception $e) {\n  echo \"错误：\" . $e->getMessage();\n} finally {\n  echo\
  \ \"这部分总会执行。\";\n}\n```\n\n### 自定义异常\n\n```php\nclass InvalidAgeException extends\
  \ Exception {}\n\nfunction checkAge($age) {\n  if ($age < 18) {\n    throw new InvalidAgeException(\"\
  年龄必须为 18 岁或以上。\");\n  }\n  return true;\n}\n\ntry {\n  checkAge(15);\n} catch (InvalidAgeException\
  \ $e) {\n  echo $e->getMessage();\n}\n```\n\n## 第 8 章：设计您的 Web 数据库\n\n### 数据库简介\n\
  \n数据库是结构化数据的有组织集合。关系数据库（如 MySQL）将数据存储在表中。\n\n### 数据库设计原则\n\n- **规范化**：减少数据冗余。\n\
  - **主键**：每条记录的唯一标识符。\n- **外键**：将表链接在一起。\n\n## 第 9 章：创建您的 Web 数据库\n\n### 使用 SQL 创建数据库和表\n\
  \n```sql\nCREATE DATABASE my_database;\nUSE my_database;\n\nCREATE TABLE users (\n\
  \  id INT AUTO_INCREMENT PRIMARY KEY,\n  name VARCHAR(50) NOT NULL,\n  email VARCHAR(100)\
  \ NOT NULL UNIQUE\n);\n```\n\n### 数据库用户和权限\n\n```sql\nCREATE USER 'webuser'@'localhost'\
  \ IDENTIFIED BY 'password';\nGRANT SELECT, INSERT, UPDATE, DELETE ON my_database.*\
  \ TO 'webuser'@'localhost';\nFLUSH PRIVILEGES;\n```\n\n## 第 10 章：使用您的 MySQL 数据库\n\
  \n### SQL 查询\n\n#### SELECT\n\n```sql\nSELECT * FROM users;\nSELECT name, email\
  \ FROM users WHERE id = 1;\n```\n\n#### INSERT\n\n```sql\nINSERT INTO users (name,\
  \ email) VALUES ('Alice', 'alice@example.com');\n```\n\n#### UPDATE\n\n```sql\n\
  UPDATE users SET name = 'Alice Smith' WHERE id = 1;\n```\n\n#### DELETE\n\n```sql\n\
  DELETE FROM users WHERE id = 1;\n```\n\n## 第 11 章：通过 Web 使用 PHP 访问您的 MySQL 数据库\n\
  \n### 使用 `mysqli` 和 PDO 连接\n\n#### `mysqli` 示例\n\n```php\n$db = new mysqli(\"localhost\"\
  , \"webuser\", \"password\", \"my_database\");\nif ($db->connect_error) die(\"连接失败\"\
  );\n\n$query = \"SELECT * FROM users\";\n$result = $db->query($query);\n\nwhile\
  \ ($row = $result->fetch_assoc()) {\n  echo $row['name'];\n}\n```\n\n#### PDO 示例\n\
  \n```php\ntry {\n  $db = new PDO(\"mysql:host=localhost;dbname=my_database\", \"\
  webuser\", \"password\");\n  $db->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);\n\
  \n  $stmt = $db->prepare(\"SELECT * FROM users WHERE id = :id\");\n  $stmt->bindParam(':id',\
  \ $userId);\n  $stmt->execute();\n  $result = $stmt->fetch(PDO::FETCH_ASSOC);\n\
  } catch (PDOException $e) {\n  echo \"错误：\" . $e->getMessage();\n}\n```\n\n## 第\
  \ 12 章：高级 MySQL 管理\n\n### 优化\n\n- 在 `WHERE` 子句中频繁使用的列上使用索引。\n- 使用 `EXPLAIN` 分析查询性能。\n\
  \n```sql\nEXPLAIN SELECT * FROM users WHERE email = 'test@example.com';\n```\n\n\
  ### 备份\n\n使用 `mysqldump` 创建备份。\n\n```bash\nmysqldump -u username -p database_name\
  \ > backup.sql\n```\n\n## 第 13 章：高级 MySQL 编程\n\n### 事务\n\n```php\n$db->begin_transaction();\n\
  try {\n  $db->query(\"UPDATE accounts SET balance = balance - 100 WHERE id = 1\"\
  );\n  $db->query(\"UPDATE accounts SET balance = balance + 100 WHERE id = 2\");\n\
  \  $db->commit();\n} catch (Exception $e) {\n  $db->rollBack();\n  echo \"事务失败：\"\
  \ . $e->getMessage();\n}\n```\n\n### 存储过程\n\n```sql\nDELIMITER //\nCREATE PROCEDURE\
  \ GetUser(IN userId INT)\nBEGIN\n  SELECT * FROM users WHERE id = userId;\nEND //\n\
  DELIMITER ;\n```\n\n## 第 14 章：Web 应用程序安全风险\n\n常见威胁包括 SQL 注入、跨站脚本（XSS）和跨站请求伪造（CSRF）。\n\
  \n## 第 15 章：构建安全的 Web 应用程序\n\n### 输入验证\n\n始终验证并清理用户输入。\n\n```php\n$email = filter_var($_POST['email'],\
  \ FILTER_SANITIZE_EMAIL);\n```\n\n### 预处理语句\n\n使用预处理语句防止 SQL 注入。\n\n```php\n$stmt\
  \ = $db->prepare(\"SELECT * FROM users WHERE email = ?\");\n$stmt->bind_param(\"\
  s\", $email);\n```\n\n### 输出转义\n\n转义输出以防止 XSS。\n\n```php\necho htmlspecialchars($userInput);\n\
  ```\n\n## 第 16 章：使用 PHP 实现身份验证方法\n\n### 会话\n\n```php\nsession_start();\n$_SESSION['username']\
