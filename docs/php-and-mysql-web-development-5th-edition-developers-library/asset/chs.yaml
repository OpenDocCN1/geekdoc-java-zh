- "# PHP 和 MySQL Web 开发（第5版）（开发者库）\n\n## 关于本电子书\n\nEPUB 是一种开放的行业标准电子书格式。然而，不同设备和应用程序对\
  \ EPUB 及其许多功能的支持程度不同。请使用您的设备或应用设置来根据您的喜好自定义显示效果。您可以自定义的设置通常包括字体、字号、单栏或双栏、横屏或竖屏模式，以及可以点击或触摸放大的插图。有关您的阅读设备或应用的设置和功能的更多信息，请访问设备制造商的网站。\n\
  \n许多书籍包含编程代码或配置示例。为了优化这些元素的显示效果，请在单栏横屏模式下查看电子书，并将字体大小调整为最小。除了以重流文本格式呈现代码和配置外，我们还包含了代码图像，模拟印刷书籍中的显示效果；因此，当重流格式可能会损害代码列表的显示时，您将看到一个“点击此处查看代码图像”的链接。点击链接即可查看保真代码图像。要返回之前查看的页面，请点击设备或应用上的“返回”按钮。\n\
  \n### 作者\n**Laura Thomson** 是 Mozilla 公司的工程总监。她曾担任 OmniTI 和 Tangled Web Design 的主管，并就职于\
  \ RMIT 大学和波士顿咨询集团。她拥有应用科学学士（计算机科学）和荣誉工程学士（计算机系统工程）学位。在空余时间里，她喜欢骑马、讨论自由开源软件以及睡觉。\n\
  \n**Luke Welling** 是一位软件工程师，经常在 OSCON、ZendCon、MySQLUC、PHPCon、OSDC 和 LinuxTag 等会议上就开源和\
  \ Web 开发主题进行演讲。他曾就职于 OmniTI、网络分析公司 `Hitwise.com`、数据库供应商 MySQL AB，并作为 Tangled Web\
  \ Design 的独立顾问工作。他曾在澳大利亚墨尔本的 RMIT 大学教授过计算机科学，并拥有应用科学学士（计算机科学）学位。在空余时间里，他正试图完善（或攻克）他的失症。\n\
  \n**Julie C. Meloni** 是一位住在华盛顿特区的软件开发经理兼技术顾问。她撰写了多本关于 Web 编程语言和数据库主题的书籍及文章，包括畅销书\
  \ *Sams Teach Yourself PHP, MySQL and Apache All in One*。\n\n**John Coggeshall**\
  \ 是 Internet Technology Solutions, LLC 的所有者——这为全球客户提供互联网和 PHP 咨询的公司，同时也是基于订阅的 WiFi\
  \ 网络 CoogleNet 的所有者。作为 Zend Technologies 全球服务团队的前高级成员，他从 1997 年开始接触 PHP，是四本已出版书籍和\
  \ 100 多篇 PHP 技术文章的作者。\n\n\n\n\n`Jennifer Kyrnin` 是一位作者兼网页设计师，自 1995 年来一直从事互联网工作。她的其他书籍包括*Sams\
  \ Teach Yourself Bootstrap in 24 Hours*、*Sams Teach Yourself Responsive Web Design\
  \ in 24 Hours*以及 *Sams Teach Yourself HTML5 Mobile Application Development in 24\
  \ Hours*。\n\n## 我们希望听听您的声音！\n\n作为本书的读者，`您`是我们最重要的评论家和反馈者。我们非常重视您的意见，并想知道我们哪里做得好，哪些地方可以做得更好，您希望我们出版哪些领域的内容，以及任何您愿意分享给我们的建议。\n\
  \n您可以通过电子邮件或直接写信的方式，告诉我们您对这本书的喜欢或不满意之处——以及我们可以做些什么来让我们的书籍变得更好。\n\n*请注意，我们无法帮助您解决与本书主题相关的技术问题，而且由于收到的邮件量巨大，我们可能无法回复每一条信息。*\n\
