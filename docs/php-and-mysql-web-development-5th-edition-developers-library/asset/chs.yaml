  \ 循环进行迭代\n\n### 开始之前：访问 PHP\n\n为了完成本章以及书中其余示例，你需要一个安装了 PHP 的 Web 服务器。为了从示例和案例研究中获得最大收益，你应该运行它们并尝试修改它们。要做到这一点，你需要一个可以实验的测试平台。\n\
  \n如果你的机器上没有安装 PHP，你需要从安装它开始，或者让你的系统管理员为你安装。你可以在附录 A “安装 Apache、PHP 和 MySQL”中找到相关操作说明。\n\
  \n### 创建示例应用程序：Bob 的汽车零件\n\n任何服务器端脚本语言最常见的应用之一就是处理 HTML 表单。你将通过为 Bob 的汽车零件（一家虚构的备配件公司）实现一个订单表单开始学习\
  \ PHP。你可以在光盘的 `chapter01` 目录中找到本章所有示例的所有代码。\n\n#### 创建订单表单\n\nBob 的 HTML 程序员为 Bob\
  \ 销售的零件设置了一个订单表单。这个简单的订单表单如图 1.1 所示，与你在浏览网页时可能看到的许多表单类似。Bob 希望能够知道客户订了什么，计算订单总价，并确定订单需要缴纳多少销售税。\n\
  \n![Image](img/01fig01.jpg)\n\n图 1.1 Bob 的初始订单表单仅记录产品和数量\n\n该表单的部分 HTML 代码如列表 1.1\
  \ 所示。\n\n列表 1.1 `orderform.html`**Bob 基础订单表单的 HTML**\n\n点击此处查看代码图像\n\n* * *\n\n\
  ```html\n<form action=\"processorder.php\" method=\"post\">\n  <table style=\"border:\
  \ 0px;\">\n    <tr style=\"background: #cccccc;\">\n      <td style=\"width: 150px;\
  \ text-align: center;\">Item</td>\n      <td style=\"width: 150px; text-align: center;\"\
  >Quantity</td>\n    </tr>\n    <tr>\n      <td>Tires</td>\n      <td></td>\n   \
  \ </tr>\n    <tr>\n      <td>Oil</td>\n      <td></td>\n    </tr>\n    <tr>\n  \
  \    <td>Spark Plugs</td>\n      <td></td>\n    </tr>\n    <tr>\n      <td colspan=\"\
  2\" style=\"text-align: center;\"><input type=\"submit\" value=\"Submit\"></td>\n\
  \    </tr>\n  </table>\n</form>\n```\n\n注意 `action` 属性设置为将处理订单的脚本名称（你接下来将编写它）。通常，表单指定的\
  \ `method` 将是 `get`（附加在 URL 末尾）或 `post`（作为单独的消息发送）。\n\n还要注意表单字段名称：`tireqty`、`oilqty`\
  \ 和 `sparkqty`。你将在 PHP 脚本中再次使用这些名称。如果你使用的名称反映了输入的数据，你的 PHP 程序员生活将变得更容易。你应该考虑采用字段标准，以便网站上的所有字段使用相同的格式。\n\
  \n#### 处理表单\n\n为了处理表单，你需要创建 `form` 标签中 `action` 属性提到的脚本 `processorder.php`。打开你的文本编辑器并创建此文件。然后输入以下代码：\n\
  \n点击此处查看代码图像\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n    <title>Bob's Auto\
  \ Parts - Order Results</title>\n  </head>\n  <body>\n    <h1>Bob's Auto Parts</h1>\n\
  \    <h2>Order Results</h2>\n  </body>\n</html>\n```\n\n注意你目前为止输入的所有内容都是纯 HTML。现在是时候给脚本添加一些\
  \ PHP 代码了。\n\n### 在 HTML 中嵌入 PHP\n\n在你文件的 `<h2>` 标题下，添加以下行：\n\n```php\n<?php\necho\
  \ '<p>Order processed.</p>';\n?>\n```\n\n保存文件，并通过填写 Bob 的表单并点击提交订单按钮，在浏览器中加载它。你应该看到类似于图\
  \ 1.2 所示的输出。\n\n![Image](img/01fig02.jpg)\n\n图 1.2 传递给 PHP `echo` 构造的文本输出到浏览器\n\n\
  注意你编写的 PHP 代码嵌入在一个看起来正常的 HTML 文件中。尝试从浏览器查看源代码。你应该看到这段代码 `<!DOCTYPE html>`。\n\n\n\
  \n\n\n<body>\n  <h1>Bob 的汽车零件</h1>\n  <h2>订单结果</h2>\n  <p>订单已处理。</p>\n</body>\n\n\
  原始的 PHP 代码是不可见的，因为 PHP 解释器已经运行了该脚本并将其替换为脚本的输出结果。这意味着通过 PHP，你可以生成可以在任何浏览器中查看的整洁 HTML；换句话说，用户的浏览器不需要理解\
  \ PHP。\n\n这个示例简明扼要地说明了服务器端脚本的概念。PHP 已经在 Web 服务器上经过了解释并执行，这与 `JavaScript` 以及其他在用户机器的\
  \ 浏览器内进行解释和执行的客户端技术是有不同的。\n\n你现在在该文件中拥的代码由四种文本组成：\n\n![Image](img/squ.jpg) HTML\n\
  \n![Image](img/squ.jpg) PHP 标签\n\n![Image](img/squ.jpg) PHP 语句\n\n![Image](img/squ.jpg)\
  \ 空格符\n\n你还可以添加注释。\n\n示例中的大部分行都只是普通的 HTML。\n\n### PHP 标签\n\n前一个示例中的 PHP 代码以 `<?php`\
  \ 开始，以 `?>` 结束。这与所有 HTML 标签相似，因为它们都以小于符号（`<`）开头并以大于符号（`>`）结束。这些符号（`<?php` 和 `?>`）被称为\
  \ `PHP 标签`。它们告诉 Web 服务器 PHP 代码从哪里开始结束。标签之间的任何文本都被解释为 PHP。标签之外的任何文本都被视为普通的 HTML。PHP\
  \ 标签允许你跳出 HTML 模式。\n\n实际上有两种 PHP 标签的样式；以下每个代码段都是等价的：\n\n![Image](img/squ.jpg) XML\
  \ 样式\n\n```php\n<?php echo '<p>Order processed.</p>'; ?>\n```\n\n这是我们在书中使用的标签样式；它是被首选的\
  \ PHP 标签样式。服务器管理员无法关闭它，因此你可以保证它在所有服务器上都是可用的，如果你正在编写可能在不同安装环境中使用的应用程序，这一点尤为重要。这种标签样式可以与扩展标记语言\
  \ (XML) 文档配合。通常情况下，我们建议你使用这种标签样式。\n\n![Image](img/squ.jpg) 短样式\n\n```php\n<? echo\
  \ '<p>Order processed.</p>'; ?>\n```\n\n这种标签样式是最简单的，并遵循标准通用标记语言 (SGML) 处理指令的样式。要使用这种类型的标签——它是输入最短的——你需要在你的配置文件中启用\
  \ `short_open_tag` 设置，或者在编译 PHP 时启用短标签。你可以在附录 A 中找到更多关于如何使用这种标签样式的信息。我们不建议在你计划分发的代码中使用这种样式。它在许多环境中将无法工作，因为它不再是默认启用的。\n\
  \n### PHP 语句\n\n你通过在起始和结束标签之间包含 PHP 语句来告诉 PHP 解释器要做什么。前一个示例只使用了一种类型的语句：\n\n```php\n\
  echo '<p>Order processed.</p>';\n```\n\n正如你可能猜到的那样，使用 `echo` 结构有一个非常简单的结果：它将打印（或回）传递给它的字符串到浏览器。在图\
  \ 1.2 中，你可以看到结果是浏览器窗口中出现了文本 `Order processed.`。\n\n注意 `echo` 语句末尾有一个分号。在 PHP 中，分号分隔语句，就像英语中的句号分隔句子一样。如果你以前用过\
  \ C 或 Java，你将熟悉这种使用分号的方式。\n\n漏掉分号是一个常见的且易发的语法错误。然而，发现并纠正它同样容易。\n\n### 空格符\n\n如换行符（回车）、空格和制表符等间隔字符被称为\
  \ `whitespace`。正如你可能已经知道的，浏览器忽略 HTML 中的空白符，PHP 引擎也是如此。考虑这两个 HTML 片段：\n\n点击此处查看代码图像\n\
  \n```html\n<h1>Welcome to Bob's Auto Parts!</h1><p>What would you like to order\
  \ today?</p>\n```\n\n以及\n\n点击此处查看代码图像\n\n```html\n<h1>Welcome          to Bob's\n\
  \nAuto Parts!</h1>\n<p>What would you like\nto order today?</p>\n```\n\n这两个 HTML\
  \ 代码产生相同的输出，因为它们在浏览器看来是相同的。但是，你完全并且被鼓励在 HTML 中明智地使用空白符来作为人类的辅助——以增强你的 HTML 代码的可读性。PHP\
  \ 也是如此。你不需要在 PHP 语句之间有任何空白符，但如果你将每个语句放在单独的一行，代码会变得更易读。例如，\n\n```php\necho 'hello\
  \ ';\necho 'world';\n```\n\n以及\n\n```php\necho 'hello ';echo 'world';\n```\n\n它们是等价的，但第一个版本更容易读。\n\
  \n### 注释\n\n注释就是其名：代码中的注释是给阅读代码的人的笔记。注释可以用来解释脚本的用途、谁编写了它、为什么要这样写、最后一次修改是什么时候等。通常你可以在除了最简单的\
  \ PHP 脚本之外的所有地方找到注释。\n\nPHP 解释器忽略注释中的任何文本。从本质上说，PHP 解析器会跳过注释，使其等同于空白符。\n\nPHP 支持\
  \ C、C++ 和 shell 脚本风格的注释。\n\n以下是 C 风格的多行注释，可能出现在脚本的开头：\n\n点击此处查看代码图像\n\n```php\n\
  /* Author: Bob Smith\n   Last modified: April 10\n   This script processes orders.\n\
  */\n```\n\n多行注释以 `/*` 开始并以 `*/` 结束。与 C 一样，多行注释不能嵌套。\n\n你也可以使用单行注释，可以是 C++ 风格：\n\n\
  点击此处查看代码图像\n\n```php\necho '<p>Order processed.</p>'; // Start order\n```\n\n或者是\
  \ shell 脚本风格：\n\n点击此处查看代码图像\n\n```php\necho '<p>Order processed.</p>'; # Start order\n\
  ```\n\n在这两种样式中，注释符号（`#` 或 `//`）之后直到行尾或结束标签之前都是注释。\n\n在下面的代码中，标签之前的文本 `here is a\
  \ comment` 是注释的一部分。标签之后的文本 `here is not` 将被视为 HTML，因为它在标签之外：\n\n点击此处查看代码图像\n\n```\n\
  // here is a comment ?> is not\n```\n\n### 添加动态内容\n\n到目前为止，你还没有用 PHP 做过任何无法用纯 HTML\
  \ 完成的事。\n\n使用服务器端脚本语言的主要原因是为了能够为网站提供动态内容。这是一项重要的应用，因为根据用户需求或时间变化的内容会吸引访问回到网站。PHP\
  \ 允许你轻松实现这一点。\n\n让我们从一个简单的示例开始。将 `processorder.php` 中的 PHP 替换为以下代码：\n\n```php\n\
  <?php\n  echo \"<p>Order processed at \";\n  echo date('H:i, jS F');\n  echo \"\
  </p>\";\n?>\n```\n\n你也可以使用连接运算符（`.`）将其写在一行内，如点击此处查看代码图像\n\n```php\n<?php\n  echo\
  \ \"<p>Order processed at \".date('H:i, jS F').\"</p>\";\n?>\n```\n\n在此代码中，PHP 内置的\
  \ `date()` 函数告诉客户处理订单的日期和时间。每次运行脚本时这些信息都会不同。运行一次脚本的结果如图 1.3 所示。\n\n![Image](img/01fig03.jpg)\n\
  \n图 1.3 PHP 的 `date()` 函数返回格式化的日期字符串\n\n#### 调用函数\n\n看对 `date()` 的调用。这是函数调用采用的通用形式。PHP\
  \ 拥有丰富的函数库，可以在开发 Web 应用程序时可以使用。许多函数需要传递一些数据并返回一些数据。\n\n现在再次看这个函数调用：\n\n```php\n\
  date('H:i, jS F')\n```\n\n\n\n\n\n注意，它向圆括号内的函数传递了一个字符串（文本数据）。括号内的元素被称为函数的 `argument`（实参）或\
  \ `parameter`（形）。这些参数是函数在输出某些特定结果时所使用的输入数据。\n\n### 使用 `date()` 函数\n\n`date()` 函数期望你传递给它的参数是一个格式字符串，代表你希望的输出样式。字符串中的每个字母都代表日期和时间的一个部分。`H`\
  \ 是 24 小时制的小时，在需要时前导零；`i` 是分钟，在需要时前导零；`j` 是不带前导零的月份几号；`S` 代表序数后缀（在此例中为 th），而 `F`\
  \ 是月份的全称。\n\n***\n\n注意\n\n如果 `date()` 向你发出了关于未设置时区的警告，你应该在你的 `php.ini` 文件中添加 `date.timezone`\
  \ 设置。关于此点的更多信息，可以在附录 A 中的示例 `php.ini` 文件中找到。\n\n***\n\n要查看 `date()` 支持的格式完整列表，请参阅第\
  \ 19 章，“管理日期和时间”。\n\n### 访问表单变量\n\n使用订单表的目的是收集客户订单。在 PHP 中获取客户输入内容的详情非常容易，但具体方法取决于你使用的\
  \ PHP 版本以及 `php.ini` 文件中的一个设置。\n\n#### 表单变量\n\n在你的 PHP 脚本中，你可以将每个表单字段作为一个 PHP 变量来访问，其变量名与表单字段名相关。你可以识别\
  \ PHP 中的变量名，因为它们都以美元符号（`$`）开头。（忘记美元符号是一个常见的编程错误。）\n\n根据你的 PHP 版本和设置，你可以以不同的方式通过变量访问表单数据。在较新版本的\
  \ PHP 中，这些方法除一种外的所有方法都已弃用，因此如果你过去用过 PHP，请注意这一点已经发生了变化。\n\n你可以通过以下方式访问字段 `tireqty`\
  \ 的内容：\n\n```\n$_POST['tireqty']\n```\n\n`$_POST` 是一个数组，包含通过 HTTP POST 请求提交的数据——也就是说表单方法被设置为\
  \ POST。有三个这样的数组可能包含表单数据：`$_POST`、`$_GET` 和 `$_REQUEST`。其中一个 `$_GET` 或 `$_POST` 数组持有所有表单变量的详情。使用哪个数组取决于提交表单的方法是\
  \ `GET` 还是 `POST`。此外，通过 `$_REQUEST` 还可以获取通过 `GET` 或 `POST` 提交的所有数据的组合。\n\n如果通过 `POST`\
  \ 方法提交表单，在 `tireqty` 框中输入的数据将存储在 `$_POST['tireqty']` 中。如果通过 `GET` 提交，数据将在 `$_GET['tireqty']`\
  \ 中。无论哪种情况，数据也可以可用 `$_REQUEST['tireqty']`。\n\n这些数组是一些 `superglobal`（全局）数组。当我们在本章后面讨论变量作用域时，将再次回到全局变量。\n\
  \n让我们来看创建一个易用变量副本的示例。\n\n要将一个变量的值复制到另一个变量，你需要使用赋值运算符，在 PHP 中是等号（=）。以下语句创建一个名为 `$tireqty`\
  \ 的新变量，并将 `$_POST['tireqty']` 的内容复制到新变量中：\n\n```php\n$tireqty = $_POST['tireqty'];\n\
  ```\n\n将以下代码块放在处理脚本的开头。本书中处理表单数据的所有其他脚本在开头都包含类似的代码块。由于此代码不会产生任何输出，将其放在 `<html>`\
  \ 和其他启动页面的 HTML 标签上方或下方没有区别。我们通常将此类代码块放在脚本开头，以便查找。\n\n点击此处查看代码图像\n\n```php\n<?php\n\
  \  // 创建短变量名\n  $tireqty = $_POST['tireqty'];\n  $oilqty = $_POST['oilqty'];\n \
  \ $sparkqty = $_POST['sparkqty'];\n?>\n```\n\n这段代码创建了三个新变量——`$tireqty`、`$oilqty`\
  \ 和 `$sparkqty`，并将它们设置为包含通过表单 `POST` 方法发送的数据。\n\n你可以通过以下操作将这些变量的值输出到浏览器：\n\n```php\n\
  echo $tireqty.' tires<br />';\n```\n\n然而，不建议这种方法。\n\n在此阶段，你还没有检查变量内容以确保每个表单字段中都输入了合理的数据。尝试故意输入错误的数据并观察会发生什么。在你读完本章其余部分后，你可能想尝试向此脚本添加一些数据验证。\n\
  \n直接从用户处获取数据并这样输出到浏览器，从安全角度来看是非常极具风险的做法。我们不建议这种方法。你应该过滤输入数据。我们将在第 4 章，“字符串处理与正则表达式](#ch04.html_ch04)”中开始介绍输入过滤，并在第\
  \ 14 章，“Web 应用安全风险](#ch14.html_ch14)”中深入讨论安全性。\n\n目前，只需知道在通过 `htmlspecialchars()`\
  \ 之后将用户数据 echo 到浏览器即可。为了让脚本显示某些内容，在 PHP 脚本中添加以下行：\n\n点击此处查看代码图像\n\n```php\necho\
  \ '<p>Your order is as follows:>';\necho htmlspecialchars($tireqty).'tires<br />';\n\
  echo htmlspecialchars($oilqty).'bottles of oil<br />';\necho htmlspecialchars($sparkqty).'spark\
  \ plugs<br />';\n```\n\n现在如果你在浏览器中加载此文件，输出应该类似于图 1.4 所示。当然，实际值取决于你在表单中输入的内容。\n\n\
  ![图像](img/01fig04.jpg)\n\n图 1.4 processorder.php 中访问的表单变量\n\n### 字符串拼接\n\n在示例脚本中，`echo`\
  \ 打印每个表单字段的值，后面跟着说明文本。如果你查看 `echo` 语句，你会看到变量名和后续文本之间有一个点（.），如下：\n\n```php\necho\
  \ htmlspecialchars($tireqty).' tires<br />';\n```\n\n这个点是字符串拼接运算符，它将字符串（文本片段）组合在一起。当你使用\
  \ `echo` 输出到浏览器时，经常会使用它。通过这种方式，你可以避免编写多个 `echo` 命令。\n\n你也可以将简单的变量放在双引号字符串内部进行 echo（数组较为复杂，我们将在第\
  \ 4 章中讨论数组和字符串的结合）。考虑这个示例：\n\n```php\n$tireqty = htmlspecialchars($tireqty);\necho\
  \ \"$tireqty tires<br />\";\n```\n\n这与本节所示的第一条语句等效。两种格式都是有效的，使用哪种取决于个人喜好。这种在字符串内将变量替换为其内容的过程被称为*插值*（interpolation）。\n\
  \n注意，插值仅是双引号字符串的功能。你不能以这种方式在单引号字符串内放置变量名。运行以下代码行\n\n```php\necho '$tireqty tires<br\
  \ />';\n```\n\n仅仅向浏览器发送 `$tireqty tires<br />`。在双引号内，变量名会被替换为它的值。在单引号内，变量名或任何其他文本将原原封地发送。\n\
  \n\n\n\n\n示例脚本中每个 `echo` 语句中连接在一起的变量和字符串是不同类型的内容。变量是数据的符号。字符串本身就是数据。当我们在程序中使用这样一段原始数据时，我们称之为*字面量*（literal），以将它区别于*变量*（variable）。`$tireqty`\
  \ 是一个变量，是一个代表客户输入数据的符号。另一方面，`' tires<br />'` 是一个字面量。你可以直接按照字面意思理解它。嗯，几乎如此。还记得前一节中的第二个示例吗？PHP\
  \ 将字符串中的变量名 `$tireqty` 替换为存储在变量中的值。\n\n记住已经提到的两种类型的字符串：使用双引号的字符串和使用单引号的字符串。PHP 会尝试解析双引号括中的字符串，从而导致了前文所示的行为。单引号字符串被视为真正的字面量。\n\
  \n还有第三种指定字符串的方法，即使用 heredoc 语法（`<<<`），这对于 Perl 用户来说非常熟悉。Heredoc 语法允许你通过指定一个结束标记来整洁地指定长字符串，该标记将用于结束字符串。下面的示例创建了一个三行的字符串并将其输出：\n\
  \n```php\necho <<<theEnd\n\n  line 1\n\n  line 2\n\n  line 3\n\ntheEnd\n```\n\n\
  标记 `theEnd` 是完全任意的。它只需要保证不会出现在正文中即可。要关闭 heredoc 字符串，请在行开头放置结束标记。\n\nHeredoc 字符串会进行插值，就像双引号字符串一样。\n\
  \n### 理解标识符\n\n标识符（Identifiers）是变量名。（函数和类的名称也是标识符；我们将在第 5 章“重用代码和编写函数”以及第 6 章“面向对象的\
  \ PHP”中详细讨论函数和类）。你需要了解定义有效标识符的简单规则：\n\n- ![Image](img/squ.jpg) 标识符可以是任意长度，并由字母、数字和下划线组成。\n\
  \n- ![Image](img/squ.jpg) 标识符不能以数字开头。\n\n- ![Image](img/squ.jpg) 在 PHP 中，标识符是区分大小写的。`$tireqty`\
  \ 和 `$TireQty` 是不同的。交替使用它们是一种常见的编程错误。函数名是这一规则的例外：它们的名称可以使用任何大小写。\n\n- ![Image](img/squ.jpg)\
  \ 变量名可以与函数相同。然而，这种用法会引起混淆，应该避免。此外，你不能创建一个与另一个函数同名的函数。\n\n除了从 HTML 表单传递的变量外，你还可以声明并使用自己的变量。\n\
  \nPHP 的特性之一是它不需要在使用变量之前声明它们。当你第一次给变量赋值时，该变量就会被创建。详情请见下一节。\n\n你使用赋值运算符（=）给变量赋值，就像你将一个变量的值复制到另一个变量时一样。在\
  \ Bob 的网站上，你想计算订单的项目总数和应支付金额。你可以创建两个变量来存储这些数字。首先，你需要通过在 PHP 脚本底部添加这些行来将每个变量初始化为零。\n\
  \n```php\n$totalqty = 0;\n$totalamount = 0.00;\n```\n\n这两行中的每一行都创建了一个变量并为其分配了一个字面量值。你也可以将变量值赋值给变量，如示例所示：\n\
  \n```php\n$totalqty = 0;\n$totalamount = $totalqty;\n```\n\n### 检查变量类型\n\n变量的类型指的是存储其中的数据种类。PHP\
  \ 提供了一组数据类型。不同的数据可以存储在不同的数据类型中。\n\n#### PHP 数据类型\n\nPHP 支持以下基本数据类型：\n\n- ![Image](img/squ.jpg)\
  \ **整数 (Integer)**——用于整数\n\n- ![Image](img/squ.jpg) **浮点数 (Float)**（也称为 **double**）——用于实数\n\
  \n- ![Image](img/squ.jpg) **字符串 (String)**——用于字符字符串\n\n- ![Image](img/squ.jpg) **布尔值\
  \ (Boolean)**——用于 `true` 或 `false` 值\n\n- ![Image](img/squ.jpg) **数组 (Array)**——用于存储多个数据项（参见第\
  \ 3 章“使用数组””）\n\n- ![Image](img/squ.jpg) **对象 (Object)**——用于存储类的实例（参见第 6 章\n\n```php\n\
  $totalqty = 0;\n$totalamount = (float)$totalqty;\n```\n\n这句话意味着“将存储在 `$totalqty`\
  \ 中的值解释为浮点数，并将其存储在 `$totalamount` 中。” `$totalamount` 变量将是浮点类型。类型转换不会改变类型，因此 `$totalqty`\
  \ 保持为整数。\n\n你还可以使用内置函数来测试和设置类型，你将在以后学习。\n\n#### 变量变量\n\nPHP 提供了另一种类型的变量：变量变量。变量变量允许你动态地更改变量的名称。\n\
  \n你可以看到，PHP 在这个领域提供了很大的自由。所有语言都允许你更改变量的值，但很少有语言允许更改变量的名称。变量变量通过使用一个变量的值作为另一个变量的名称来工作。例如，你可以设置：\n\
  \n```php\n$varname = 'tireqty';\n```\n\n你现在可以使用 `$$varname` 代替 `$tireqty`。例如，你可以设置\
  \ `$tireqty` 的值为：\n\n```php\n$$varname = 5;\n```\n\n这等同于\n\n```php\n$tireqty = 5;\n\
  ```\n\n\n\n\n正如你之前看到的，你可以轻松地更改存储在变量中的值。你也可以声明常量。常量存储值的方式与变量相同，但它的值只设置一次，之后在脚本的其他任何地方无法更改。\n\
  \n在示例应用程序中，你可能将每个销售商品的价格存储为常量。你可以使用 `define` 函数来定义这些常量：\n\n```\ndefine('TIREPRICE',\
  \ 100);\ndefine('OILPRICE', 10);\ndefine('SPARKPRICE', 4);\n```\n\n现在将这些行代码添加到你的脚本中。现在你有了三个常量，可以用于计算客户订单的总额。\n\
  \n注意，常量的名称以大写形式出现。这种借自 C 语言的习惯让你一眼就能区分变量和常量。虽然强制遵循这种习惯，但它会让你的代码更易于阅读和维护。\n\n常量和变量之间一个重要的区别是，当你引用常量时，它的前面没有美元符号\
  \ `$`。如果你想使用常量的值，只需使用它的名称即可。例如，要使用刚刚创建的常量之一，你可以输入\n\n```\necho TIREPRICE;\n```\n\
  \n除了你定义的常量外，PHP 还设置了大量的内置常量。获取它们概览的一种简单方法是运行 `phpinfo()` 函数：\n\n```\nphpinfo();\n\
  ```\n\n该函数提供了 PHP 预定义变量和常量的列表，以及其他有用信息。我们将在学习过程中讨论其中一些。\n\n变量和可能的另一个区别是，常量只能存储布尔、整数、浮点数或字符串数据。这些类型统称为标量值（scalar\
  \ values）。\n\n### 理解变量作用域\n\n`scope`（作用域）指的是脚本内部特定变量可见的地方。PHP 中的六个基本作用域规则如下：\n\n\
  - ![Image](img/squ.jpg) 内置全局变量在脚本的任何地方都可见。\n- ![Image](img/squ.jpg) 常量一旦声明，始终全局可见；也就是说，它们可以在函数内部外部使用。\n\
  - ![Image](img/squ.jpg) 在脚本中声明的全局变量在整个脚本中可见，但*在函数内部不可见*。\n- ![Image](img/squ.jpg)\
  \ 函数内部声明为全局的变量引用同名的全局变量。\n- ![Image](img/squ.jpg) 在函数内部创建并声明为 `static` 的变量从函数外部不可见，但它们会在函数一次执行和下次执行之间保持值。（我们将在第\
  \ 5 章中详细解释这一概念。）\n- ![Image](img/squ.jpg) 在函数内部创建的变量是局部变量，并在函数终止时消失。\n\n数组 `$_GET`\
  \ 和 `$_POST` 以及其他特殊变量有它们的作用域规则。它们被称为*超级全局变量*（superglobals），可以在函数内部外的任何地方可见。\n\n\
  超级全局变量完整列表如下：\n\n- ![Image](img/squ.jpg) `$GLOBALS`——包含所有全局变量的数组（类似于 `global` 关键字，这允许你在函数内部访问全局变量——例如通过\
  \ `$GLOBALS['myvariable']`）。\n- ![Image](img/squ.jpg) `$_SERVER`——服务器环境变量数组。\n-\
  \ ![Image](img/squ.jpg) `$_GET`——通过 `GET` 方法传递给脚本的变量数组。\n- ![Image](img/squ.jpg)\
  \ `$_POST`——通过 `POST` 方法传递给脚本的变量数组。\n- ![Image](img/squ.jpg) `$_COOKIE`——cookie\
  \ 变量数组。\n- ![Image](img/squ.jpg) `$_FILES`——与文件上传相关的变量数组。\n- ![Image](img/squ.jpg)\
  \ `$_ENV`——环境变量数组。\n- ![Image](img/squ.jpg) `$_REQUEST`——包含所有用户输入的数组，包括 `$_GET`、`$_POST`\
  \ 和 `$_COOKIE` 的内容（但不包括 `$_FILES`）。\n- ![Image](img/squ.jpg) `$_SESSION`——会话变量数组。\n\
  \n在书中当变得需要时，我们会反复回到这些超级全局变量。\n\n在本章稍后讨论函数和类时，我们会详细地介绍作用域。目前，我们使用的所有变量默认都是全局变量。\n\
  \n### 使用运算符\n\n运算符是你用于通过对值和变量进行操作来操纵它们的符号。你需要使用其中一些运算符来计算客户订单的总额和税费。\n\n我们已经提到了两个运算符：赋值运算符（=`）和字符串连接运算符（`.`）。在接下来的章节中，我们将描述完整的列表。\n\
  \n通常情况下，运算符可以接受一个、两个或三个参数，大多数接收两个。例如，赋值运算符接收两个参数：`=` 符号左侧的存储位置和右侧的表达式。这些参数被称为*操作数*（operands）——即被操作的对象。\n\
  \n#### 算术运算符\n\n算术运算符非常直观；它们就是普通的数学运算符。PHP 的算术运算符如表 1.1\n\n表 1.1 **PHP 的算术运算符**\n\
  \n使用这些运算符中的每一个，你可以存储操作的结果，如下所示：\n\n```\n$result = $a + $b;\n```\n\n加法和减法的作用如你预期的那样。这些运算符的结果分别是加或减\
  \ `$a` 和 `$b` 变量的值。\n\n你还可以使用减法符号（`-）作为一元运算符——即接受一个参数的运算符——来表示负数，例如：\n\n```\n$a\
  \ = -1;\n```\n\n乘法和除法也如你预期的那样工作。注意使用 `*` 作为乘法运算符，以及使用 `/` 作为除法运算符。\n\n模运算符返回 `$a`\
  \ 变量除以 `$b` 变量的余。考虑这段代码片段：\n\n```\n$a = 27;\n$b = 10;\n$result = $a%$b;\n```\n\n\
  存储在 `$result` 变量中的值是 27 除以 10。\n\n你应该注意，算术运算符通常应用于整数或浮点数。如果你将它们应用于字符串，PHP 会尝试将字符串转换为数字。如果它包含\
  \ `e` 或 `E`，它将被读取为科学计数法并转换为浮点数；否则，将转换为整数。PHP 会在字符串开头寻找数字作为值。\n\n#### 字符串运算符\n\n\
  你已经看到并使用了唯一的字符串运算符。你可以使用字符串连接运算符连接两个字符串并生成结果，就像你使用加法运算符相两个数字一样：\n\n```\n$a = \"\
  Bob's \";\n$b = \"Auto Parts\";\n$result = $a.$b;\n```\n\n变量 `$result` 现在包含了字符串\
  \ `\"Bob's Auto Parts\"`。\n\n#### 赋值运算符\n\n你已经见过赋值运算符 `=`。始终将其称为赋值运算符，并将其读作“设置为”。例如，\n\
  \n```\n$totalqty = 0;\n```\n\n此行应该读作“`$totalqty` 设置为零”。我们将在本章稍后讨论比较运算符时解释原因，但如果你把它称为“等于”，你会感到困惑。\n\
  \n##### 赋值返回值\n\n使用赋值运算符会返回与其他运算符类似的整体值。如果你写\n\n```\n$a + $b\n```\n\n该表达式的值是 `$a`\
  \ 和 `$b` 变量相加的结果。同样，你可以写\n\n```\n$a = 0;\n```\n\n这个整个表达式的值为零。\n\n这种技术允许你形成如下表达式：\n\
  \n```\n$b = 6 + ($a = 5);\n```\n\n此行将 `$b` 变量的值设置为 11。这种行为通常适用于赋值：整个赋值语句的值是赋值给左侧操作数的值。\n\
  \n\n\n在计算表达式的值时，你可以使用括号来提高子表达式的优先级，如下所示。这种技术的工作原理与数学中完全相同。\n\n#### 复合赋值运算符\n\n除了简单的赋值之外，还有一组复合赋值运算符。其中每一个都是对变量执行另一种操作，并将结果重新赋值给该变量的简写形式。例如，\n\
  \n```php\n$a += 5;\n```\n\n这等同于编写以下代码：\n\n```php\n$a = $a + 5;\n```\n\n每个算术运算符和字符串拼接运算符都有对应的复合赋值运算符。所有复合赋值运算符及其影响摘要如表\
  \ 1.2 所示。\n\n![Image](img/01tab02.jpg)\n\n表 1.2 **PHP 的复合赋值运算符**\n\n#### 前置与后置递减\n\
  \n前置和后置增（`++`）及减（--`）运算符与 `+=` 和 `-=` 运算符类似，但有几点不同。\n\n所有的增运算符都有两个效果：增加值并进行赋值。考虑以下代码：\n\
  \n```php\n$a=4;\necho ++$a;\n```\n\n第二行使用了前置增运算符，这是因为 `++` 出现在 `$a` 之前。它的效果是先将 `$a`\
  \ 增加 1，然后返回增加后的值。在这种情况下，`$a` 增加到 5，然后返回并打印值 5。整个表达式的值为 5。（注意，存储在 `$a` 中的实际值被改变了：它不仅仅是返回了\
  \ `$a + 1`。）\n\n然而，如果 `++` 在在 `$a` 之后，那么你正在使用的是后置增运算符。它的效果不同。考虑以下代码：\n\n```php\n\
  $a=4;\necho $a++;\n```\n\n在这种情况下，效果是反反的。也就是说，首先返回并打印 `$a` 的值，然后对其进行递增。整个表达式的值为 4。这是将要打印的值。然而，在该语句执行后，`$a`\
  \ 的值是 5。\n\n正如你可能猜到的那样，`--`（减）运算符的行为也是类似的。不过，`$a` 的值是减少而不是增加。\n\n#### 引用运算符\n\n\
  引用运算符（`&`，取地址符）可以与赋值结合使用。通常，当一个变量赋值给另一个变量时，会创建第一个变量的副本并存储在内存的其他地方。例如，\n\n```php\n\
  $a = 5;\n$b = $a;\n```\n\n这些代码行创建了 `$a` 中值的第二个副本并存储在 `$b` 中。如果你随后更改 `$a` 的值，$b`\
  \ 将不会改变：\n\n```php\n$a = 7; // $b 仍为 5\n```\n\n你可以通过使用引用运算符避免创建副本。例如，\n\n点击此处查看代码\n\
  \n```php\n$a = 5;\n$b = &$a;\n$a = 7; // 现在 $a 和 $b 都是 7\n```\n\n引用可能有点复杂。记住，引用类似于别名，而不是指针。`$a`\
  \ 和 `$b` 都指向同一块内存。你可以通过如下方式取消其中一个的设置来改变这一点：\n\n```php\nunset($a);\n```\n\n取消不会改变\
  \ `$b` 的值 (7)，但会破坏 `$a` 与存储在内存中的值 7 之间的链接。\n\n#### 比较运算符\n\n比较运算符比较两个值。使用这些运算符的表达式根据比较结果返回逻辑值\
  \ `true`（真）或 `false`（假）。\n\n##### 等于运算符\n\n相等比较运算符（`==`，两个等号）允许你测试两个值是否相等。例如，你可能使用表达式\n\
  \n```php\n$a == $b\n```\n\n用来测试存储在 `$a` 和 `$b` 中的值是否相同。如果它们相等，此表达式返回的结果为 `true`；如果不相等，则为\
  \ `false`。\n\n你很容易将 `==` 与赋值运算符 `=` 混淆。使用错误的运算符可以正常运行而不会报错，但通常不会给你你想要的结果。通常情况下，非零值被求评为\
  \ `true`，零值被求评为 `false`。假设你如下所示初始化了两个变量：\n\n```php\n$a = 5;\n$b = 7;\n```\n\n如果你测试测试\
  \ `$a = $b`，结果将是 `true`。为什么？`$a = $b` 的值是赋值给左侧的值，在这个例中是 7。因为 7 是非零值，所以表达式求评为 `true`。如果你本打算测试\
  \ `$a == $b`（其求评为 `false`），那么你在代码中引入了一个逻辑错误，这个错误极其难以发现。始终检查你对这两个运算符的使用，并确保你使用的是想要使用的那个。\n\
  \n使用赋值运算符而不是相等比较运算符是一个很容易犯的错误，你可能在编程生涯中会犯很多次。\n\n##### 其他比较运算符\n\nPHP 还支持许多其他比较运算符。所有比较运算符的摘要如表\
  \ 1.3 所示。需要注意的是恒等运算符（`===`），它仅当两个操作数相等且类型相同时才返回 `true`。\n\n#### 逻辑运算符\n\n逻辑运算符组合条件的结果。例如，你可能使用如下所示的\
  \ AND 运算符，在 0 到 100 之间：\n\n```php\n$a >= 0 && $a <= 100\n```\n\nPHP 支持 AND、OR（异或）和\
  \ NOT。逻辑运算符的总结如表 1.4 所示。\n\n![Image](img/01tab04.jpg)\n\n表 1.4 **逻辑运算符**\n\n`and`\
  \ 和 `or` 运算符的优先级低于 `&&` 和 `||`。我们将在本章详细介绍优先级。\n\n#### 位运算符\n\n位运算符允许你将整数视为用于表示它的位序列。你可能在\
  \ PHP 中找不到位运算符的用途，但摘要如表 1.5 所示。\n\n![Image](img/01tab05.jpg)\n\n表 1.5 **PHP 的位运算符**\n\
  \n#### 其他运算符\n\n除了目前介绍过的运算符外，你还可以使用其他。\n\n逗号运算符（`,`）分隔函数参数或其他列表。它通常偶然使用。\n\n两个特殊运算符\
  \ `new` 和 `->` 分别用于实例化类和访问类成员。它们将在第 6 章](#ch06)中详细介绍。\n\n我们在这里简要讨论其他。\n\n##### 三元运算符\n\
  \n三元运算符（`?:`）采用以下形式：\n\n点击此处查看代码\n\n```php\n条件 ? 为真值 : 为假时的值\n```\n\n该运算符类似于 `if-else`\
  \ 语句的表达式版本，后者将在本章后续部分介绍。\n\n一个简单的例子是\n\n点击此处查看代码\n\n```php\n($grade >= 50 ? '通过'\
  \ : '失败')\n```\n\n此表达式将成绩评估为'通过'或'失败'。\n\n##### 错误抑制运算符\n\n错误抑制运算符（`@`）可以用任何任何前面——即任何产生错误或具有值的表达式。例如，\n\
  \n```php\n$a = @(57/0);\n```\n\n如果没有 `@` 运算符，这一行会产生除以零警告。如果包含了该运算符，错误将被抑制。\n\n如果你以此方式抑制警告，你需要编写一些错误处理代码来检查何时发生了警告。如果你在\
  \ `php.ini` 中启用了 PHP 的 `track_errors` 功能，错误信息将存储在全局变量 `$php_errormsg` 中。\n\n\n\n\
  ## 第 1 章：PHP 速成课程\n\nPHP 是一种广泛使用、开源、通用的脚本语言，特别适用于 Web 开发，并且可以嵌入到 HTML 中。\n\n###\
  \ 一个最小的 PHP 脚本\n\n让我们来看一个简单但完整的 PHP 脚本。在深入细节之前，先了解一下 PHP 的工作原理是个好主意。\n\n以下是我们这个最小\
  \ PHP 脚本的完整代码：\n\n```php\n<?php\necho \"Hello World\";\n?>\n```\n\n如果这是一个静态 HTML\
  \ 文件，它会包含相同的内容，但扩展名将是 `.html` 或 `.htm` 而不是 `.php`。当您在浏览器中查看此文件时，输出仅仅是一个带有 \"Hello\
  \ World\" 字样的空白页面。（注意：如果没有 HTML 标签，一些浏览器可能会显示空白页面。）\n\n这个例子中最重要的部分是 `echo` 语句。它告诉\
  \ PHP 输出 \"Hello World\"。分号（`;`）告诉 PHP 这是语句的结束，而 `<?php` 和 `?>` 标签告诉 PHP 将它们之间的所有内容解析为\
  \ PHP 代码。\n\n`.php` 扩展名不是必须的。您可以将 Web 服务器配置为将具有其他扩展名的文件解析为 PHP，但使用 `.php` 是标准做法。\n\
  \n### 将 PHP 嵌入 HTML\n\nPHP 经常直接嵌入到 HTML 文件中。服务器解析该文件，执行 PHP 代码，并将生成的 HTML 发送到客户端浏览器。\n\
  \n考虑以下示例，它根据一天中的时间生成动态问候语：\n\n```php\n<?php\nif (date('H') < 12) {\n  echo \"早上好\"\
  ;\n} elseif (date('H') < 18) {\n  echo \"下午好\";\n} else {\n  echo \"晚上好\";\n}\n\
  ?>\n```\n\n### 为 PHP 脚本添加注释\n\n注释对于记录代码非常有用。PHP 支持多种注释风格：\n\n```php\n// 这是一个单行注释\n\
  \n# 这也是一个单行注释\n\n/* 这是\n   一个多行\n   注释 */\n```\n\n### PHP 如何解释空白字符\n\nPHP 通常会忽略脚本中的额外空白字符（空格、制表符、换行符）。这意味着您可以格式化代码以使其更具可读性，而不会影响其运行。\n\
  \n### 语句终止符\n\nPHP 中的每个语句都必须以分号（`;`）结尾。这不是可选的。它告诉 PHP 一条语句在哪里结束，下一条从哪里开始。\n\n###\
  \ 引入变量\n\nPHP 中的变量以美元符号（`$`）为前缀。变量名以字母或下划线开头，后面可以跟任意数量的字母、数字或下划线。\n\n```php\n<?php\n\
  $name = \"Bob\"; // 将字符串 \"Bob\" 赋值给变量 $name\n$age = 30;     // 将整数 30 赋值给变量 $age\n\
  $tax_rate = 0.10; // 将浮点数 0.10 赋值给 $tax_rate\n?>\n```\n\n### 引入数组\n\n数组是一个可以保存多个值的变量。\n\
  \n```php\n<?php\n$products = array('Tires', 'Oil', 'Spark Plugs');\n// 或者，使用简写语法：\n\
  $products = ['Tires', 'Oil', 'Spark Plugs'];\n\necho $products[0]; // 输出 \"Tires\"\
  \n?>\n```\n\n### 变量类型\n\nPHP 是一种弱类型语言，这意味着您不需要声明变量的类型。PHP 根据分配给它的值来确定其类型。\n\n常见类型包括：\n\
  \n- `integer`（例如，`42`）\n- `float` 或 `double`（例如，`3.14`）\n- `string`（例如，`\"Hello\
  \ World\"`）\n- `boolean`（`true` 或 `false`）\n- `array`\n\n您可以使用 `gettype()` 等函数来检查变量的类型。\n\
  \n### PHP 常量\n\n常量是在脚本执行期间不能更改的简单值的标识符。它们使用 `define()` 函数定义。\n\n```php\n<?php\n\
  define('TIREPRICE', 100);\necho TIREPRICE; // 输出 100\n?>\n```\n\n### 创建一个简单的脚本\n\
  \n让我们将这些概念结合起来，创建一个计算订单总额的简单脚本。\n\n```php\n<?php\n$tireqty = 2;\n$oilqty = 1;\n\
  $sparkqty = 3;\n\n$tireprice = 100;\n$oilprice = 10;\n$sparkprice = 4;\n\n$totalamount\
  \ = ($tireqty * $tireprice) +\n               ($oilqty * $oilprice) +\n        \
  \       ($sparkqty * $sparkprice);\n\necho \"总额：\" . $totalamount;\n?>\n```\n\n\
  ### 访问表单变量\n\n在 Web 环境中，您经常需要获取从 HTML 表单提交的数据。PHP 提供了几个超全局数组用于此目的，例如 `$_POST`、`$_GET`\
  \ 和 `$_REQUEST`。\n\n假设您有一个提交到同一页面的 HTML 表单：\n\n```php\n<!-- HTML 表单 -->\n<form action=\"\
  process.php\" method=\"post\">\n  轮胎数量：<input type=\"text\" name=\"tireqty\" /><br\
  \ />\n  机油数量：<input type=\"text\" name=\"oilqty\" /><br />\n  火花塞数量：<input type=\"\
  text\" name=\"sparkqty\" /><br />\n  <input type=\"submit\" value=\"提交\" />\n</form>\n\
  ```\n\n在 `process.php` 中，您可以访问这些值：\n\n```php\n<?php\n$tireqty = $_POST['tireqty'];\n\
  $oilqty = $_POST['oilqty'];\n$sparkqty = $_POST['sparkqty'];\n\n// ... 继续计算总额\n\
  ?>\n```\n\n### 运算符\n\nPHP 支持多种运算符。\n\n#### 算术运算符\n\n```php\n$sum = 5 + 3; // 加法\n\
  $diff = 5 - 3; // 减法\n$prod = 5 * 3; // 乘法\n$quot = 5 / 3; // 除法\n$mod = 5 % 3;\
  \  // 取模（余数）\n```\n\n#### 字符串运算符\n\n连接运算符是一个句点（`.`）。\n\n```php\n$greeting = \"Hello\"\
  \ . \" \" . \"World\"; // $greeting 为 \"Hello World\"\n```\n\n#### 赋值运算符\n\n基本赋值运算符是\
  \ `=`。\n\n```php\n$a = 10; // $a 现在为 10\n$a += 5; // 等同于 $a = $a + 5; $a 现在为 15\n\
  ```\n\n#### 比较运算符\n\n```php\n$x == $y;   // 相等（值）\n$x === $y;  // 相同（值和类型）\n$x !=\
  \ $y;   // 不相等\n$x !== $y;  // 不相同\n$x < $y;    // 小于\n$x > $y;    // 大于\n```\n\n\
  #### 逻辑运算符\n\n```php\n$x && $y;  // 与\n$x || $y;  // 或\n! $x;      // 非\n```\n\n\
  ### 控制结构\n\n#### 条件语句\n\n##### `if` 语句\n\n```php\nif ($totalqty == 0) {\n  echo\
  \ \"您没有订购任何东西。\";\n}\n```\n\n##### `if...else` 语句\n\n```php\nif ($totalqty == 0)\
  \ {\n  echo \"您没有订购任何东西。\";\n} else {\n  echo \"您订购了 \" . $totalqty . \" 件物品。\"\
  ;\n}\n```\n\n##### `elseif` 语句\n\n```php\nif ($discount == 0) {\n  echo \"无折扣。\"\
  ;\n} elseif ($discount == 5) {\n  echo \"5% 折扣。\";\n} elseif ($discount == 10) {\n\
  \  echo \"10% 折扣。\";\n} else {\n  echo \"15% 折扣。\";\n}\n```\n\n##### `switch` 语句\n\
  \n```php\nswitch ($searchtype) {\n  case \"Title\":\n    echo \"按标题搜索\";\n    break;\n\
  \  case \"Author\":\n    echo \"按作者搜索\";\n    break;\n  default:\n    echo \"无效的搜索类型\"\
  ;\n    break;\n}\n```\n\n#### 循环结构\n\n##### `while` 循环\n\n```php\n$num = 1;\nwhile\
  \ ($num <= 5) {\n  echo $num . \"<br />\";\n  $num++;\n}\n```\n\n##### `for` 循环\n\
  \n```php\nfor ($i = 1; $i <= 5; $i++) {\n  echo $i . \"<br />\";\n}\n```\n\n#####\
  \ `foreach` 循环\n\n```php\n$colors = array(\"red\", \"green\", \"blue\");\nforeach\
  \ ($colors as $color) {\n  echo $color . \"<br />\";\n}\n```\n\n### 使用函数\n\nPHP\
  \ 有大量内置函数。您也可以定义自己的函数。\n\n#### 调用内置函数\n\n```php\n$length = strlen(\"Hello World\"\
  ); // $length 为 11\necho strtoupper(\"hello\"); // 输出 \"HELLO\"\necho number_format(1234.56,\
  \ 2); // 输出 \"1,234.56\"\n```\n\n#### 定义函数\n\n```php\nfunction add_tax($amount,\
  \ $tax_rate) {\n  return $amount * (1 + $tax_rate);\n}\n\n$total_with_tax = add_tax(100,\
  \ 0.10); // $total_with_tax 为 110\n```\n\n### 介绍 PHP 手册\n\nPHP 手册是一个宝贵的资源。它包含每个函数、语言构造和扩展的文档。您可以在\
  \ [`www.php.net/manual/zh/`](http://www.php.net/manual/zh/) 找到它。\n\n## 第 2 章：存储和检索数据\n\
  \n本章介绍与文件交互以及使用数据库来存储和检索数据。\n\n### 打开和关闭文件\n\n打开文件的主要函数是 `fopen()`。\n\n```php\n\
  $fp = fopen(\"/path/to/file.txt\", \"r\"); // 以读取模式打开\n```\n\n完成后，您必须使用 `fclose()`\
  \ 关闭文件：\n\n```php\nfclose($fp);\n```\n\n### 从文件读取\n\nPHP 提供了多个从文件读取的函数，例如 `fread()`、`fgets()`\
  \ 和 `file()`。\n\n```php\n// 将整个文件读入数组\n$lines = file(\"/path/to/file.txt\");\n\n\
  // 一次读取一行\n$line = fgets($fp);\n```\n\n### 写入文件\n\n使用 `fwrite()` 或 `fputs()` 将内容写入以写入模式打开的文件。\n\
  \n```php\n$fp = fopen(\"/path/to/log.txt\", \"a\"); // 以追加模式打开\nfwrite($fp, \"日志条目\\\
  n\");\nfclose($fp);\n```\n\n### 锁定文件\n\n为防止多个脚本写入同一文件时发生竞态条件，请使用 `flock()`。\n\n\
  ```php\nflock($fp, LOCK_EX); // 获取独占锁\n// ... 写入文件\nflock($fp, LOCK_UN); // 释放锁\n\
  ```\n\n### 与数据库（MySQL）交互\n\n与 MySQL 交互最常用的方法是使用 `mysqli` 扩展或 PDO。\n\n#### 使用 `mysqli`\
  \ 连接\n\n```php\n$db = new mysqli('localhost', 'username', 'password', 'database');\n\
  \nif ($db->connect_error) {\n  die(\"连接失败：\" . $db->connect_error);\n}\n```\n\n\
  #### 运行查询\n\n```php\n// 简单查询\n$result = $db->query(\"SELECT * FROM users\");\n\n\
  // 预处理语句（出于安全考虑推荐使用）\n$stmt = $db->prepare(\"SELECT * FROM users WHERE email = ?\"\
  );\n$stmt->bind_param(\"s\", $email);\n$stmt->execute();\n$result = $stmt->get_result();\n\
  ```\n\n#### 插入、更新和删除\n\n```php\n// 插入\n$db->query(\"INSERT INTO users (name, email)\
  \ VALUES ('John Doe', 'john@example.com')\");\n\n// 更新\n$db->query(\"UPDATE users\
  \ SET name = 'Jane Doe' WHERE id = 1\");\n\n// 删除\n$db->query(\"DELETE FROM users\
  \ WHERE id = 1\");\n```\n\n## 第 3 章：使用数组\n\n数组是 PHP 中必不可少的数据结构。\n\n### 创建数组\n\n\
  ```php\n$fruits = array(\"Apple\", \"Banana\", \"Orange\");\n// 简写\n$fruits = [\"\
  Apple\", \"Banana\", \"Orange\"];\n```\n\n### 访问数组\n\n```php\necho $fruits[0]; //\
  \ \"Apple\"\n```\n\n### 修改数组\n\n```php\n$fruits[] = \"Mango\"; // 添加到末尾\nunset($fruits[1]);\
  \ // 移除 \"Banana\"\n```\n\n### 多维数组\n\n```php\n$products = array(\n  array(\"Tires\"\
  , 100),\n  array(\"Oil\", 10),\n  array(\"Spark Plugs\", 4)\n);\necho $products[0][1];\
  \ // 100\n```\n\n### 数组函数\n\n```php\n$size = count($fruits); // 3\nsort($fruits);\
  \ // 按字母顺序排序\n$keys = array_keys($fruits); // 获取所有键\n```\n\n## 第 4 章：字符串操作和正则表达式\n\
  \n### 字符串函数\n\n```php\n$name = \"  Hello World  \";\n$trimmed = trim($name); //\
  \ \"Hello World\"\n$search = strpos($name, \"World\"); // 7\n$replaced = str_replace(\"\
  World\", \"PHP\", $name);\n```\n\n### 正则表达式\n\nPHP 使用 PCRE（与 Perl 兼容的正则表达式）。\n\n\
  ```php\n// 检查电子邮件模式\n$email = \"user@example.com\";\nif (preg_match(\"/^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\\\
