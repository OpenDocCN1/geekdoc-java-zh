  \ $error_message, 3, \"/var/log/php_errors.log\");\n```\n\n## 第 27 章：构建用户身份验证和个性化\n\
  \n### 用户注册和登录\n\n1. **注册**：哈希密码，存储用户数据。\n2. **登录**：验证密码哈希，创建会话。\n\n```php\n// 注册\n\
  $hash = password_hash($_POST['password'], PASSWORD_DEFAULT);\n$stmt = $db->prepare(\"\
  INSERT INTO users (name, email, password) VALUES (?, ?, ?)\");\n$stmt->bind_param(\"\
  sss\", $name, $email, $hash);\n$stmt->execute();\n\n// 登录\n$stmt = $db->prepare(\"\
  SELECT password FROM users WHERE email = ?\");\n$stmt->bind_param(\"s\", $email);\n\
  $stmt->execute();\n$result = $stmt->get_result();\n$user = $result->fetch_assoc();\n\
  \nif (password_verify($_POST['password'], $user['password'])) {\n  session_start();\n\
  \  $_SESSION['user_id'] = $user['id'];\n}\n```\n\n### 个性化\n\n使用会话或用户数据来定制内容。\n\n\
  ```php\nif (isset($_SESSION['user_id'])) {\n  echo \"欢迎回来，\" . getUserName($_SESSION['user_id']);\n\
  }\n```\n\n## 附录 A：安装 Apache、PHP 和 MySQL\n\n### 使用 XAMPP\n\n1. 从 [`www.apachefriends.org/`](https://www.apachefriends.org/)\
