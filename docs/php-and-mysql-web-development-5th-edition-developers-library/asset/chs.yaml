  2. 登录或创建一个新账户\n3. 输入 ISBN：`9780321833891`\n4. 回答问题作为购买证明\n\n网页版将出现在您账户页面的“数字购买”（Digital\
  \ Purchases）标签下。点击“启动”（Launch）链接即可访问\n\n## 引言\n\n欢迎阅读`PHP and MySQL Web Development`。在书中，您将发现从我们使用`PHP`\
  \ 和 `MySQL` 的经验中提取出的知识，这是世界上最重要且应用广泛的两个 Web 开发工具。\n\n本引言涵盖的关键主题：\n\n![Image](img/squ.jpg)\
  \ 为什么你应该读这本书\n![Image](img/squ.jpg) 使用本书你将能够实现什么\n![Image](img/squ.jpg) `PHP` 和\
  \ `MySQL` 是什么以及它们为什么很棒\n![Image](img/squ.jpg) `PHP` 和 `MySQL` 最新版本中发生了什么\n![Image](img/squ.jpg)\
  \ 本书的组织结构\n\n让我们开始吧。\n\n***\n\n注意\n访问我们的网站并在`[informit.com/register](http://informit.com/register)`\
  \ 注册本书，以便方便地访问本书可能提供的任何更新、下载或勘误。\n\n***\n\n### 为什么你应该读这本书\n\n本书将教你如何创建交互式 Web 应用程序，从简单的订单表单到复杂的安全的\
  \ Web 应用程序。此外，你将学习如何使用开源技术来实现它们。\n\n本书面向已经掌握了至少`HTML` 基础知识，并且在现代编程语言中进行过一些编程，但不一定为\
  \ Web 进行编程或使用过关系型数据库的读者。如果你是一个初学者，仍然会觉得这本书很有用，但消化它可能需要更长的时间。我们尝试不遗漏任何基础概念，但我们讲解的速度较快。本书的典型读者希望通过掌握`PHP`\
  \ 和 `MySQL` 来构建大型或商业性网站。你可能已经在使用另一种 Web 开发语言工作；如果是这样，这本书应该让你迅速进入状态。\n\n我们编写这本书的第一版是因为我们厌倦了寻找那些基本上只是函数参考手册的`PHP`书籍。这些书虽然有用，但当你的老板或客户说“帮我做一个购物车”时，它们就派不上用场了。在书中，我们尽力让每个示例都变得有用。你可以直接将许多代码示例用于你的网站，也可以在经过微小修改后使用许多其他。\n\
  \n### 你将从书中中学到什么\n\n阅读本书将使你能够构建真实的动态 Web 应用程序。如果你用纯`HTML`构建过网站，你就会意识到这种方法的局限性。纯`HTML`网站的静态内容只是静态的——除非你手动更新它，否则它保持不变。你的用户无法以任何意义的方式与网站进行交互。\n\
  \n使用像`PHP`这样的语言和像`MySQL`这样的数据库可以让你的网站变得动态：使其具有可定制性并包含实时信息。\n\n我们刻意将本书专注于真实应用，即使在介绍章节也是如此。我们从简单系统开始，逐步深入`PHP`和`MySQL`的部分。\n\
  \n我们讨论了与构建真实网站相关的安全和认证方面，并向你展示如何在`PHP` 和 `MySQL` 中实现这些方面。我们还通过讨论 `JavaScript`及其在应用程序开发中可以扮演的角色，介绍了整合前端和后端技术。\n\
  \n在本书的最后一部分，我们描述了如何处理真实项目，并带你完成以下项目的设计、规划和构建：\n\n![Image](img/squ.jpg) 用户认证与个性化\n\
  ![Image](img/squ.jpg) 网页邮箱\n![Image](img/squ.jpg) 社交媒体集成\n\n你可以直接使用这些项目中的任何一个，也可以根据你的需求对它们进行修改。我们选择它们是因为我们相信它们代表了程序员构建的一些常见的\
  \ Web 应用程序。如果你的需求不同，本书将帮助你在此过程中实现目标。\n\n### 什么是 PHP？\n\n`PHP` 是一种专门为 Web 设计的服务器端脚本语言。在`HTML`页面中，你可以嵌入`PHP`代码，这些代码会在每次访问页面时执行。你的`PHP`代码在\
  \ Web 服务器上解释，并生成访问者看到的`HTML`或其他输出。\n\n`PHP`诞生于 1994 年，最初是一个人 Rasmus Lerdorf 的作品。它被其他才华横溢的人采用并经历了多次重大重写，带来了我们今天看到的广泛且成熟的产品。根据\
  \ Google 的 Greg Michillie 在 2013 年 5 月的说法，`PHP`运行世界上四之三以上的网站，到 2016 年 7 月，这个数字已增长到\
  \ 82%以上。\n\n`PHP` 是一个开源项目，这意味着你可以获取源代码并自由地使用、修改和重新分发它。\n\n\n\n\n\nPHP 的主页位于 [`www.php.net`](http://www.php.net)。\n\
  \nZend Technologies 的主页位于 [`www.zend.com`](http://www.zend.com)。\n\n### 什么是 MySQL？\n\
  \nMySQL（读音为 `My-Ess-Que-Ell*）是一个非常快速、稳健的`关系型数据库管理系统 (RDBMS)`。数据库允许你高效地存储、搜索、排序和检索数据。MySQL\
  \ 服务器控制对数据的访问，以确保多个用户可以并发工作，提供快速访问，并确保只有授权用户才能获得访问权限。因此，MySQL 是一个多用户、多线程服务器。它使用标准的数据库查询语言`结构查询语言`（`SQL`）。MySQL\
  \ 自 1996 年起公开可用，但其开发历史可以追溯到 1979 年。它是世界上最流行的开源数据库，并多次获得《Linux Journal》杂志读者选择奖。\n\
  \nMySQL 采用双重许可方案。只要你愿意遵守该许可协议的条款，就可以可以在开源许可（`GPL`）下免费使用它。如果你想分发一个包含 MySQL 的非 GPL\
  \ 应用程序，可以购买商业许可。\n\n### 为什么使用 PHP 和 MySQL？\n\n在构建网站时，你可以使用许多不同的产品。\n\n你需要选择以下内容：\n\
  \n![Image](img/squ.jpg) 在哪里运行你的 Web 服务器：云端、虚拟专用服务器或实际硬件\n\n![Image](img/squ.jpg)\
  \ 操作系统\n\n![Image](img/squ.jpg) Web 服务器软件\n\n![Image](img/squ.jpg) 数据库管理系统或其他数据存储\n\
  \n![Image](img/squ.jpg) 编程语言或脚本语言\n\n你最终可能会得到一个具有多个数据存储的混合架构。这些选择中的某些依赖于其他选择。例如，并不是所有的操作系统都能运行在所有硬件上，并不是所有的\
  \ Web 服务器都支持所有的编程语言，以此此类推。\n\n在本书中，我们不过太关注硬件、操作系统或 Web 服务器软件。我们没有必要。PHP 和 MySQL\
  \ 的优秀特性之一是它们可以与任何主要的操作系统以及许多次要操作系统配合。\n\n大部分 PHP 代码可以写成在操作系统和 Web 服务器之间具有可移植性。有些\
  \ PHP 函数专门与文件系统相关且依赖于操作系统的，但这些在手册和本书中有明确的标记。\n\n无论你选择什么硬件、操作系统和 Web 服务器，我们相信你应该认真考虑使用\
  \ PHP 和 MySQL。\n\n### PHP 的一些优势\n\nPHP 的一些主要对手包括 Python、Ruby（使用 Rails 或其他）、Node.js、Perl、Microsoft\
  \ .NET 和 Java。\n\n与这些产品相比，PHP 有许多优势，包括以下：\n\n![Image](img/squ.jpg) 性能\n\n![Image](img/squ.jpg)\
  \ 可扩展性\n\n![Image](img/squ.jpg) 与许多不同数据库系统的接口\n\n![Image](img/squ.jpg) 针对许多常见 Web\
  \ 任务的库\n\n![Image](img/squ.jpg) 低成本\n\n![Image](img/squ.jpg) 易于学习和使用\n\n![Image](img/squ.jpg)\
  \ 强大的面向对象支持\n\n![Image](img/squ.jpg) 可移植性\n\n![Image](img/squ.jpg) 开发方法的灵活性\n\n\
  ![Image](img/squ.jpg) 源代码\n\n#### 性能\nPHP 非常快。使用 PHP 7 每天可以处理数百万次访问。\n\n#### 可扩展性\n\
  PHP 可以伸缩到最微的任务，也可以扩展到大型应用程序。\n\n#### 数据库集成\nPHP 连接到许多系统。除了 MySQL 外，你还可以连接到 PostgreSQL、MongoDB、MSSQL\
  \ 等。\n\n#### 内置库\n由于 PHP 是为 Web 设计的，它有许多内置函数用于执行与 Web 相关的任务以及处理 Cookie。\n\n####\
  \ 成本\nPHP 是免费的。你可以从 [`www.php.net`](http://www.php.net) 免费下载最新版本。\n\n#### 易于学习\n\
  PHP 的语法基于其他语言。如果你已经熟悉 C 或 Perl 或类 C 语言，你几乎可以立即投入生产。\n\n#### 面向对象支持\nPHP 5 版本具有设计良好的面向对象特性。如果你学习过\
  \ Java 或 C++ 编程，你将找到预期的特性，例如继承、私有属性和方法、抽象类和方法、接口、构造函数和析构函数。你甚至会发现一些不常用的特性，如迭代器和\
  \ trait（特征）。\n\n#### 可移植性\nPHP 支持许多操作系统。你可以在像 Linux 和 FreeBSD 这样的免费 UNIX 类操作系统、商业级\
  \ UNIX 版本、OS X 或不同版本的 Microsoft Windows 上编写 PHP 代码。编写良好的代码通常不需要修改即可运行。\n\n#### 开发方法的灵活性\n\
  PHP 允许你简单地实现简单任务，并同样轻松地适应使用模型-视图-控制器（`MVC`）等设计模式框架的大应用程序。\n\n#### 源代码\n你可以访问 PHP\
  \ 的源代码。与闭源产品不同，使用 PHP 如果你想修改某些内容或增加语言功能，可以自由这样做。你不需要等待厂商发布补丁。你也不需要担心厂商倒闭或决定停止支持某产品。\n\
  \n#### 支持和文档的可用性\n驱动 PHP 的 Zend Technologies（[`www.zend.com`](http://www.zend.com)）通过商业方式提供支持和相关软件来资助其\
  \ PHP 开发。PHP 文档和社区是成熟且丰富的资源，拥有大量可以共享的信息。\n\n### PHP 7 的新特性\n\n2015 年 12 月，期待已久的\
  \ PHP 7 发布发布。正如引言提到的，本书涵盖了 PHP 5.6 和 PHP 7，这可能会让你问“PHP 6 怎么了？” 简短的回答是：没有 PHP 6，也从未对公众发布过。曾有一个针对被称为“PHP\
  \ 6”的代码库的开发工作，但从未实现；当时有很多雄心勃勃的计划和随之而来的复杂问题，使得团队难以继续推进。PHP 7 不是 PHP 6，也不包含该开发工作的功能和代码；PHP\
  \ 7 是一个独立的版本，有自己的关注重点——特别是关注性能。\n\n\n\n\n\n在底层方面，`PHP 7` 包含了对其驱动引擎 `Zend Engine`\
  \ 的重构，这使得许多 Web 应用程序性能得到了显著提升——有时甚至超过 100%！虽然性能的提升和内存使用的减少是 `PHP 7` 发布的关键，但向后兼容性也是如此。事实上，引入的不向后兼容的语言变化相对较少。本书中会结合语境讨论这些变化，以确保这些章节在\
  \ `PHP 5.6` 或 `PHP 7` 下均具有可用性，因为商业网络托管提供商尚未广泛采用 `PHP 7`。\n\n## MySQL 的优势优势\n\n在关系型数据库领域，`MySQL`\
  \ 的主要对手是 `PostgreSQL`、`Microsoft SQL Server` 和 `Oracle`。在 Web 应用世界，也存在使用如 `MongoDB`\
  \ 等 NoSQL/非关系型数据库的日益增长的趋势。让我们来看看为什么 `MySQL` 在许多情况下仍然是一个很好的选择。\n\n`MySQL` 有许多优势，包括：\n\
  \n![Image](img/squ.jpg) 高性能\n![Image](img/squ.jpg) 低成本\n![Image](img/squ.jpg) 易配置、易学习\n\
  ![Image](img/squ.jpg) 可移植性\n![Image](img/squ.jpg) 源代码可用\n![Image](img/squ.jpg) 提供支持\n\
  \n下文将对这些优势进行更详细的讨论。\n\n#### 性能\n\n`MySQL` 无疑是非常快速的。你可以在 [`www.mysql.com/why-mysql/benchmarks/`](http://www.mysql.com/why-mysql/benchmarks/)\
  \ 查看开发者的基准测试页面。\n\n#### 低成本\n\n`MySQL`可以通过开源许可证免费获取，也可以通过商业许可证低成本获取。如果你想将 `MySQL`\
  \ 作为应用程序的一部分重新发行，且不想以开源许可为你的应用程序授权，则你需要一个许可证。如果你不打算分发你的应用程序（大多数 Web 应用都是如此），或者正在开发免费或开源软件，则不需要购买许可证。\n\
  \n#### 易用性\n\n大多数现代数据库都使用 `SQL`。如果你用过其他 `RDBMS`，那么适应这一个应该不会有困难。`MySQL` 也比许多同产品更容易设置和调优。\n\
  \n#### 可移植性\n\n`MySQL` 可以在许多不同的 `UNIX` 系统以及 `Microsoft Windows` 下使用。\n\n#### 源代码\n\
  \n与 `PHP` 一样，你可以获取并修改 `MySQL` 的源代码。这一点对于大多数用户在大多数时间里并不重要，但它为你提供了极大的安全感，确保了未来的连续性，并在紧急情况下提供了选择。\n\
  \n事实上，现在有几个 `MySQL` 的分支和即插可用替换供你考虑使用，包括由 `MySQL` 原始作者编写的 `MariaDB`，其中包括 Michael\
  \ ‘Monty’ Widenius ([`mariadb.org`](https://mariadb.org))。\n\n#### 支持可用性\n\n并非所有开源产品都有提供支持、培训、咨询和认证的母公司，但你可以从\
  \ `Oracle` 处获得所有这些（它通过收购 `Sun Microsystems` 获取了 `MySQL`，而后者此前收购了创始公司 `MySQL AB`）。\n\
  \n### MySQL (5.x) 有什么新？\n\n在编写时，`MySQL` 的当前版本是 `5.7`。\n\n在最近几个版本中添加到 `MySQL` 的特性包括：\n\
