    # 3.2 Appearances of Goodness and Errors about Character


    In III 8, 1116a15–1117a28, and EE III 1229a11–1230a33, Aristotle examines a variety
    of examples where agents are courageous strictly being not so. As we know, someone
    does not need to be virtuous to be able to perform virtuous actions, and virtuous
    actions are not always the result of virtue in the agent but can be the result
    of a variety of causes. In fact, non-virtuous agents can achieve noble outcomes
    in a variety of ways—sometimes by accident, sometimes coerced by external threats,
    or sometimes aiming at a further goal. When the result is accidental or when the
    agent is coerced, the actions do not count as voluntary in Aristotle’s terms.
    But there are also courageous speaking, although the agents fail to do them in
    the right way, or as the virtuous person would do them—i.eously. Because it is
    possible for non-virtuous agents to perform actions in many non-virtuous ways
    and on the grounds of a variety of capacities and tendencies from virtue, there
    is a swarm of pseudo-virtues, and we need to be extra careful when making character
    judgments. We can never be sure of whether an action is an expression of good
    or bad character by looking at its external features.


