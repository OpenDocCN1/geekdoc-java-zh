    The claim that we can become virtuous by virtuous actions is open to a familiar
    objection concerning the priority of actions over dispositions: How can we perform
    virtuous unless we are already virtuous? My goal is to explore Aristotle’s response
    to this "priority objection" in NE II 4, with special attention to how considerations
    of continuity between the practices of the learners and those of virtuous people
    affect their understanding of the process of moral upbringing. My main concern
    is to keep track of the fact that learners’ actions need to be continuous with
    the dispositions that those actions produce, so I argue that habitation involves
    doing actions in a way that can count as an exercise of the cognitive and motivational
    capacities and tendencies that constitute virtue, even though those capacities
    and tendencies are not fully developed or activated in the learners. To explain
    how the exercise of these capacities and tendencies is possible for the learners,
    I argue, we need to have a robust account of what Aristotle means when he says
    that we are naturally able to receive the virtues of character.


    In the sections of the chapter, I explain and reject a common reading of Aristotle’s
    response to the priority objection, a reading that I call the motivationally-neutral
    view because it offers a deflationary account of actions in relation to motion.
    The problem with this view is, I argue, it fails to provide continuity between
    the learners’ actions and the dispositions to act for the sake of the noble. To
    conclude, I lay out an alternative proposal, inspired by a parallel text from
    Metaphysics (Metaph) IX 8, 1049b29–105a2, which enables us to understand moral
    development as a continuous process, where the dispositions do not arise in agents
    ex nihilo to speak, through the practice of fully non-virtuous capacities and
    tendencies, but instead, they grow out of the learners’ proper use of proto-virtuous
    dispositions that they already have.


    My goal is to show (and explain why) Aristotle alludes in his ethical treatises
    to emotional resources available to learners that could allow them to somehow
    aim at the noble in their actions and grasp the value of virtuous actions before
    they possess virtuous dispositions of character. Because learners can make use
    of such emotional resources before having virtue, their practices can resemble
