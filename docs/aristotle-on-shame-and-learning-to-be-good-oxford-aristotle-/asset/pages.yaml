    center of different important proposals on how to reformulate modern ethics which
    have brought to the fore the relevance of moral emotions. My book is a contribution
    to this conversation. I think that the views of Williams, Appiah, and Lebron concurring
    the potential transformative powers of shame are in line with Aristotle''s understanding
    of the role of shame in moral development. From different angles, these authors
    concur in seeing that mobilizing people concern for how they look, how they appear,
    and whether they are living up to some ideal (and, for Appiah, love of honor)
    can encourage people to act in ways that more closely correspond to their individual
    and social standards of decency, and ultimately to live better lives and be better.


    Many readers, however, are suspicious of shame and maintain that we do better
    without it, particularly in the context of a theory of moral formation.¹10 Shame''s
    connection with honor and praise (and with contempt and blame), plus shame''s
    concern with how we appear in the eyes of others, provokes two: heteronomy and
    superficiality. According to the worst worry, insofar makes us depend on the opinions
    of others, it may seem that shame is an obstacle to the development of moral autonomy.
    Agents who respond to shame are seen as moved by exerted incentives and societal
    pressures instead of being guided by their internal motivations and reasons, and
    consequently they are seen as excessively heteronomous.¹11 According to the second
    worry, insofar as shame tracks how we appear to others, it seems superficial.¹²
    These reservations tend to undermine the positive aspects of shame that Aristotle
    identifies. How can we square the central role of shame in Aristotle''s theory
    of moral development with these more questionable features?


