  md: '# 186 CONCLUSION: SHAME, LOVE OF THE NOBLE, AND MORAL DEVELOPMENT


    from the Metaphysics is that learners are not blank slates, but instead are able
    to engage in the activities that are characteristic of a disposition precisely
    when they have already “something of” that disposition. In the specific case of
    virtue, what this means is that learners can properly engage in the relevant kinds
    of practices because they are able to fulfill sufficiently the relevant cognitive
    and motivational conditions. To see how this is possible, I have argued, we should
    turn our attention to the role of shame, as our early source of love of the noble
    and aversion for the shameful, in the process of becoming good.


    To make my case for shame, I have argued that shame should not be understood as
    mere fear of disapproval, or as a superficial tendency to find pleasure in the
    noble and in the shameful; it should be understood as the emotion that equips
    learners with the ability to identify noble actions and objects as noble, as well
    as the ability to place considerations about nobility and shamefulness at the
    center of their reasons for action. Our sense of shame not only equips us with
    restraining powers that help us avoid practical mistakes, but also plays a role
    in turning us towards the noble and providing a connection between our desire
    to be appreciated and our desire to be good. Thus, shame equips learners with
    the seeds of motivation-towards-the-noble and engagement in practical thinking
    that, when fully developed, constitute virtue of character.


    This defense of the centrality of shame in moral development does not imply a
    denial of the relevance of other important elements in moral progress, such as
    experience, thumos, or the initiation of the learners in non-appetitive aesthetic
    pleasures through music and imputation. Aristotle opens the possibility that the
    process of moral upbringing is made successful by a confluence of factors. Our
    study of the nature and developmental role of shame is shown that our sense of
    shame is a fundamental resource that needs to be oriented and cultivated from
    early age, since it distinguishes those who are able to make moral progress from
    those who cannot.


    The crucial point, is, that in the Aristotelian account of moral learning, shame
    does the important job of providing learners with an initial orientation towards
    the noble that enables them to perform virtuous actions in a way that is conducive
    to virtue; moreover, crucial that is that shame makes learners to alert to the
    fact that our sense of the noble is initially gained by others in our social environment
    and do. Shame, then, makes learners responsive to external reasons, without making
    them superficially concerned with others'' opinions. Because the ultimate goal
    of those with a well-oriented sense of shame is the noble, and not merely empty
    honor, learners who have shame and respond to considerations of praiseworth and
    blamewiness tend to rely on the moral guidance of those in their communities who
    can help them make progress; they do not simply accept all opinions uncritically.
