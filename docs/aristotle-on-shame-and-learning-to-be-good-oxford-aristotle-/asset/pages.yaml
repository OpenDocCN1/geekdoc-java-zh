  md: '# Conclusion: Shame, Love of the Noble, and Moral Development


    My goal in this book has to argue that, for Aristotle, one of the crucial conditions
    for successful habituation a proto-virtuous emotion and one of the fundamental
    elements in our becoming shame, that makes us receptive to considerations of nobility
    from our early days. Young learners who respond to shame and are receptive to
    blame are well equipped to make progress and become better through virtuous practice.
    Their responsiveness to shame, I have argued, makes them ready to perform virtuous
    actions in the right way, loving the noble and hating the shameful, reflecting
    on how their actions are expressions of their character, and being receptive to
    moral arguments; as a consequence, they are able to make continuous progress toward
    virtue.


    I began my inquiry with a potential problem in Aristotle''s account of moral development.
    This problem concerns the continuity between the actions of the learners and the
    virtuous dispositions that those actions are expected to produce. My analysis
    of Aristotle''s account of the learning-by-doing process in the first part of
    NE revealed that unless we somehow exercising the capacities for cognition, motivation,
    and stability that, when perfected, constitute virtue, our account of habituation
    would fail to exhibit the relevant sort of continuity.


    Our initial inquiry into the details of habituation in Chapter 1 pointed to a
    number of problems in contemporary readings of the Aristotelian account of moral
    upbringing. By assuming that we cannot attribute to the learner an orientation
    towards the noble, these readings tend to leave a gap between the learners'' actions
    and the dispositions that are meant to produce. In the central chapters of this
    book I have paved the way for an alternative account of moral development that
    enables us to bridge this gap by identifying shame as the proto-virtuous emotion
    that helps learners orient towards the noble; with this account, we are able to
    preserve Aristotle''s fundamental conception of moral development as learning-by-doing,
    while also honoring his principle that there should be continuity in the process.


    Inspired by Aristotle''s own model of learning-by-doing in Metaphysics IX 8, I
    have found and developed an alternative explanation of how learning can happen
    in the special case of character virtue. The central insight of model'
