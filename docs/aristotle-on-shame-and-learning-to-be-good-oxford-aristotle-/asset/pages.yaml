  md: '# INTRODUCTION 3


    like pride and guilt, as one of the self-conscious or self-reflective emotions.⁶
    self-reflectivity of shame is special, however, because it always includes a reference
    to the gaze of the other. Central to every episode of shame is the apprehension,
    imaginary or actual, of oneself being seen or exposed in a negative light, as
    being inadequate or failing in some way.⁷ shame is a response to the kind of exposure
    that leads to loss of esteem in the eyes of others, as when we fail to conform
    to social norms and ideals. The other-relatedness of shame is due to its direct
    connection to another common human status, respect, and recognition—a concern
    that is also behind our appreciation of honor, reputation, praise and being our
    aversion to contempt, despite, and blame. But shame is also a self-reflective
    response to the exposure (or potential exposure) of our failing to achieve goals
    and ideals that we ourselves think important and inseparable from what we are
    or what we aspire to be in life.


    The self-reflectivity of shame, then, directly involves self-evaluation, and is
    closely associated with self-esteem.⁸ Specifically, shame is an emotional response
    to a kind of unwanted exposure that directly affects our sense of self-worth by
    reminding us of the connection between who we are and who we seem to be through
    our actions and, in general, what is visible of us. This explains why shame is
    relevant to moral development—especially for someone who, as Aristotle, holds
    that we like to be good by doing good actions. If our sense of shame is appropriately
    cultivated, it will motivate us to avoid what is shameful and prideful instead
    to be more praiseworthy by turning us into our aspirations to be the best.


    From Bernard Williams'' Shame and Necessity (1993) to Anthony Appiah''s Honor
    Code: How Moral Revolutions Happen (2010), and Chris''''s The Color of Shame:
    Race and Justice in Our Time (2013), shame has been at the


    > ⁶ For the self-reflective or self-conscious character of shame see Taylor 1985;
    Tangney et al. 1995; Elster 1999; Calhoun 2004; Nussbaum 2004; Deonna 2012; and
    Thomason 2018.

    ⁷ The locus for the connection between shame and exposure is Sartre (Sartre 1956,
    Part 3, ch. 1). More recent discussions of the connection between shame and exposure
    are e.g. Williams 1993, who hold that "the root of shame lies in being exposed...
    in a demeaning situation: ...as a loss of power" (220); Velleman 2001, for the
    event which exposes shame are failures of pride and involuntary self-exposure
    (38). Shermin 2016 reminds us that the Greek etymology of aididos (shame), which
    is related to respect, gentleness, and modesty, involves both shame and exposure
    as to be ashamed to be caught out with your leg lift (128). For the connection
    between shame and failure see e.g. 1983 (following Piers 1953): shame is occasioned
    when one fails to achieve a goal or an ideal that is integral to one''s self [...]
    shame is felt over shortcomings, guilt over doing (225).

    ⁸ The evaluative aspect of shame is discussed by Taylor 1985 (who calls pride,
    shame, and guilt "emotions of self-exposure"); Tangney et al. 1995 and 2007 (who
    claim that shame, guilt, and embarrassment are "evoked by self-reflection and
    self-evaluation," 347); Elster 1999; Mannion 2002; Nussbaum 2004; Deonna et al.
    2012; and Thomason 2018 (who consider shame as "an experience of tension between
    one''s identity and one''s self-conception," 11). A classic defense of the connection
    between shame and self-esteem appears in Rawls 1971 (440–6), while Deigh 1983
    argues against the existence of such a connection.'
