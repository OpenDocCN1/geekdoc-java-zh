    Shame does not belong to virtuous people because it "occurs in connection with
    bad actions" (epi tou phaulois, 1128b22). Aristotle’s point is the kind of shameful
    actions that triggers feelings of shame should be no part of the behavioural repertoire
    of mature individuals; conversely, the kinds of failings in practical reasoning
    that lead to shameful actions are forgivable only in young people. Whenever a
    mature agent, with fixed habits of being and with fully formed deliberative counsels,
    commits or thinks about committing a shameful action, it is a clear that he is
    probably a lost cause as far as virtue is concerned.


    In response to this passage, some commentators (such as Irwin 1999 and Taylor
    2006) hold that Aristotle has no reason to deny that virtuous people could be
    "properly ashamed when [they] think even of the possibility of doing a bad action."14
    I think, that this response weakens Aristotle’s conception of virtue and neglects
    that a virtuous person always obeys the commands of her reason and has no temptations
    to act otherwise. It also fails to capture what I think the main role of shame
    is, namely to be alert to potential misalignments between the agent’s attitudes
    towards the pleasant, the advantageous, and the noble. Virtuous people do not
    need to be alert to the possibility that their sense of the pleasant or the advantageous
    might conflict with their sense of the noble, so they do not need shame even in
    the prospective sense.


    The next and final section of NE IV reminds us that virtuous people cannot truly
    consider the possibility of doing bad actions voluntarily, and as a consequence,
    they cannot have shame proactively.


