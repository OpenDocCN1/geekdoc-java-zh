    Aristotle often includes experience as one of the requirements for being a good
    member of the audience of ethical discussions. While NE I 3, 1095a2–11, and VI
    8, 1142a13–20 give slightly different answers, they present three main requirements
    for being receptive to ethical arguments: (a) “experience” (*emteria*); (b) a
    life “according to reason” (*kata logon*), as opposed to a life “according to
    passion” (*kata pathos); and (c) “conviction” (*pistis*) of at least some claims
    on practical matters. This class establishes that experience is an important element
    in our moral development.⁵³


    In fact, Aristotle often blames the NE for the lack of empiria in young people
    as an explanation for their inability to engage in arguments about ethical and
    political matters. For example, he claims that a young person is typically “inexperienced”
