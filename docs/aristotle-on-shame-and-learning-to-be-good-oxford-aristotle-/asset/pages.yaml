  md: '# 72 LEARNING THROUGH PLEASURE, PAIN, THE NOBLE, AND THE SHAMEFUL


    For Cooper, Burnye''s account fails to establish the proper order of priority
    between pleasure in the noble and grasping the noble: enjoying something as noble
    requires first having a previous minimal grasp of the noble. In Cooper''s terms,
    we cannot have the proper enjoyment of noble activities without first having awareness
    and experience of their nobility and fineness. For this reason, Cooper concludes
    that pleasure cannot be the basis for our initial grasp of the noble, or for our
    grasp of the goodness of virtue in general.


    # 2.5.2 Second Objection: Priority of Love over Pleasure


    A second concern is expressed by Broadie 1991, when she states that learners must
    have love for the nobility of virtuous actions if they are to find pleasure in
    such actions. She appeals to Aristotle''s claims in NE I 8 and III 10 in support
    of this: “to each person is pleasant who is said to be a lover of” (hekastō d''
    estin he pros hos legetai phioioptos, NE I 8, 109a8–9) and “each person delights
    in that which he is a lover (heterakos gar tout chairei, hou philetikos est, NE
    III 10, 111b29–30). These passages underscore that the agent needs to be in a
    certain condition to be able to find activities or objects concretely; the agent
    needs to be already addressed towards the relevant activities or objects if he
    is going to find them pleasant. In short, an agent''s condition of being a lover
    of X precedes, and does not follow from, that agent''s being able to take pleasure
    in X.


    Using this principle, Broadie concludes that Burnyat''s account reverses the relationship
    between pleasure and love of the noble: it is not, as Burnyat seems to defend,
    that learners have to come to “love [what is noble] because it is what is truly
    or by nature pleasant” (76), but rather learners come to find pleasure in the
    noble only once the noble is a proper object of love or desire for them.


    Burnyat must assume that there is a special pleasure in doing what one takes to
    be just; for the point is that we learn to pay our debts spontaneously by coming
    to, doing it, the handing over of banknotes. But on that assumption the agent''s
    pleasure presupposes, hence cannot be thought to explain, the love of just dealing
    that is characteristic of the virtue.


    > (122, note 46, my emphasis)


    Broadie agrees that what is at stake here is the explanatory link between practicing
    virtuous actions and appreciating the value of virtuous actions. Her point is
    that pleasure cannot provide that link, because the ability of an agent to take
    pleasure in virtuous activity presupposes that the agent already has a capacity,
    and maybe even a tendency, to value virtue and the noble—i.e. it presupposes that
    the agent already has the love of the noble.'
