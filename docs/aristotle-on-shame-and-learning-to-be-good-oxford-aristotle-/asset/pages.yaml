  md: '# THE MORAL UPBRINGING GAP AND SHAME AS THE BRIDGE TO VIRTUE


    they are already virtuous? If learners are already in such condition as to be
    able to do virtuously-performed actions, then they would have the kind of knowledge
    and motivational tendencies that traditionally belong to virtuous people. The
    answer is, I propose, that learners are not blank slates, but instead proto-virtuous
    resources that allow them to perform virtuous actions in the right way before
    having the relevant dispositions. Crucially, I argue, the emotion of shame is
    the key proto-virtuous resource for learners to be able to do virtuous actions
    at the right goal.


    Aristotle’s solution to the learning-by-doing in NE II 4 is cryptic, and as I
    show in Chapter 1, it has been read in many ways. Some interpretations take the
    actions of learners of virtue to be merely externally similar to those of virtuous
    people—this is sometimes called the “mechanical view,” according to which learners
    perform actions in an unthinking and almost automatic way. Many modern commentators
    recognize, is unsatisfactory because it fails to provide continuity between the
    actions of the learners and the dispositions that those actions produce. Specifically,
    it leaves us with the need to bridge the gap between the learners’ mechanically
    performed virtuous actions and such actions are supposed to produce—this is what
    I call “the moral upbringing.”


    To achieve continuity in the process of learning—i.e. to make the learners’ actions
    truly virtuous—it is required not only that the learners’ actions are virtuous
    (in the sense of being the right thing to do in the circumstances), but also that
    they are done in the right way, i.e. exercising the relevant capacities. The reason
    is that, the weaker the link between the manner in which the actions of learners
    are performed and the manner in which truly virtuous agents act, the more difficult
    it will be to understand how the repeated performance of the learners’ actions
