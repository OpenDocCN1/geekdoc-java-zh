    # The Mixed Nature of Shame


    # ## 5.1 Shame’s Many Faces


    Shame is an emotion that inspires opposite reactions. It has ardent defenders
    and detractors among authors both modern and ancient. Among modern authors, as
    we have seen, although acknowledge the benefits shame might bring, there is a
    clear consensus that shame can have a disastrous impact on our lives.¹1 Among
    ancient Greek authors, we also find signs of the ambivalence surrounding shame.
    In Plato, for example, they appear in the contrast between Protagoras, who treats
    shame as a core social emotion on par with justice, and Callicles, who attacks
    shame as a tool for social manipulation and submission. Another classical example
    is Euripides’ *Hippolytus*, where Phaedra struggles with the effects of opposed
    senses of shame, namely bad shame that is a kind of fear of conventional opinion
    leads to unrealistic social conformity, and a shame that is equivalent to self-respect.³
    For Aristotle, shame has a dual aspect, as we are about to see. But far from being
    a disadvantage, shame’s complex nature is precisely what makes it a crucial element
    in Aristotle’s conception of moral development.


    The goal of this chapter is to show that Aristotle emphasizes the peculiar nature
    of shame and offers explicit arguments to justify its intermediate character.
    By allowing their sense of shame to guide their actions, learners tread a middle
    path by merely following their affective tendencies and emotions on the one hand
    and acting from fully-formed virtuous dispositions on the other. In this way,
    we can make progress towards the virtues of shame.


