    # 3.1 Varieties of Pseudo-Virtue


    Why is the performance of courageous, temperate, or just actions sometimes not
    conducive to the development of the corresponding virtues? Merely doing the right
    things in the right circumstances is often not sufficient to become virtuous;
    instead, the repetition of courageous, temperate, or just actions turn people
    into well-mannered, practically savvy, or self-controlled. As we saw in Chapter
    1, Aristotle''s explanation is that the differences in the resulting characters
    depend precisely on how (poi) learners perform virtuous actions. People form good
    habits only when they do virtuous actions well. When virtuous actions are not
    performed, i.e. when they are not done virtuously, agents engage in what I call
    “pseudo-virtuous practices,” which result at pseudo-virtuous capacities and tendencies.
    The purpose of this chapter is to learn about the practices that generate true
    virtue by looking at a variety of failed cases where the practices are not sufficient
    to produce genuine dispositions and produce pseudo-virtuous instead.¹


    To become virtuous, learners cannot do virtuous actions by accident or when merely
    coerced by external forces. Their engagement in virtuous practices must be an
    exercise of their own deliberative capacities, their affective tendencies, and,
    in general, of their own agency. To count as an exercise towards virtue, these
    actions must be not only virtuous but also done in a way that is relevant close
    to how virtuous people act. That means, as argued in Chapters 1 and 2, learners
    perform virtuous actions not only with sufficient relevant knowledge, but also
    aiming at the relevant goal (the noble) and enjoying the actions for themselves.
    Although Aristotle gives us good reasons to reach this conclusion in NE II 4,
    1105a7–b12, he however does not offer criteria to distinguish between the ways
    of doing virtuous actions that are productive of genuine virtuous dispositions,
    or what I shall call “proto-virtuous


