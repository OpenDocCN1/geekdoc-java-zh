    #  1.6.1 Incorrect Conception of the Learners'' Actions as Not-Fully Virtuous


    The first problem with the motivational-neutral view is that it often leads commentators
    to weaken the sense in which the learners'' actions are said to be virtuous. Defenders
    of this view often (mistakenly) hold that Aristotle''s response to the priority
    objection consists in making a distinction between the *fully* virtuous actions
    of virtuous agents, and the *minimally* virtuous actions of the learners, who
    lack virtue motivation. Their view an action is either fully (or only) virtuous
    if it is done from a virtuous motive.³³⁴


    But the assumption that an action is less virtuous if it is not done from a virtuous
    motive is wrong, so the corresponding qualification of the learners'' actions,
    being just minimally or fully virtuous, must be wrong as well.

    In II 4, 1105a26–b12, Aristotle refers to the actions of the learners not only
    as actions done “in accordance with virtue (*kata aretas*) also as “just and temperate
    actions” (*ta…pragma dika kai sophrona*). Furthermore, Aristotle distinguishes
    the learners'' actions from the actions of virtuous agents by saying they are
    less virtuous, by saying that they are not performed “justly or temporarily (*diaikos
    srophôn*)—and, in sum, not virtuously. It follows, that the distinction in NE
    II 4 is between two ways of performing fully virtuous actions—i.e. (a) in accordance
    with virtue but not virtuously and (b) virtuous. Aristotle holds that the three
    requirements of knowledge, right choice, and stability are conditions that the
    agent has to meet if the virtuous action is to be performed virtuously, but not
    requirements for action in general, as is sometimes thought.³⁴ Thus, those who
    claim the actions of the learners are not fully virtuous for this reason (i.e.
    they do not fulfill the three mentioned requirements) are disregarding the terms
    of the distinction that Aristotle establishes in this passage.


