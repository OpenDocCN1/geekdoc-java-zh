    Central to Burneat''s account is that the pleasures of virtue to the virtuous
    activities themselves when those activities are properly done. In other words,
    the proper employment of a virtuous activity takes place when the activity is
    performed in the right way, which requires that the learner performs the action
    for its own sake, with the right appreciation of its nobility, as an exercise
    of some capacity or disposition that puts it to its noble object.


    Aristotle stresses that the pleasures of virtue are different from appetitive
    pleasures in virtue, when they are properly done. Aristotle raises this point
    about the intrinsic character of the pleasures of virtue in NE I 8, where he claims
    that virtuous life is pleasant “in itself” (kath’ hautun) and virtuous actions
    are pleasant “in themselves” (kath’ hautas), and he explains that virtuous life
    has no pleasure to be added to “like sort of ornament,” but pleasure is already
    “in” virtuous living (en heautöi):


    Their life is also in itself pleasant. For enjoying pleasure is something that
