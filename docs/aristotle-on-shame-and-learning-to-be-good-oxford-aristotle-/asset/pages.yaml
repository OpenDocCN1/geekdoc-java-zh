    lacks experience” (*neos de''apeiros ouk est*, NE VI 8, 1142a15), young people
    are not only unable to be practically wise (*phronimoi*) but are also incapable
    of listening to arguments about practical issues. Aristotle considers empiria
    to be a requirement for acquiring phronesis and for becoming receptive to arguments
    about the just and the noble.


