    # (a) Shame as Restraint


    Shame is praeworthy in young people because of its restraining function; it keeps
    them away from potential bad feelings and actions. Only young people ought need
    restraint for their passions, and only they should be guarded against wrong actions
    by shame. Those who are older should live according to reason and thus should
    never be tempted to do anything shameful:


    This passion is not becoming to every age, but only to youth. For we think young
    people should be prone to aidōs-shame because by passion and there-commit many
    errors, but are prone to aidōs-shame. and we praise young people who are prone
    to aisichún-shame, but an older person no one would praise for being prone to
    aisichūn-shame, since we think they should not cause aisichunē-shame.⁸ (NE IV
    9, 1128b15–21)


    Shame is good, then, insofar as “live by passion” (dia to pathei dsontās) can
    be “restrained” (kousthai) by it the many possible errors that their appetites
    and passions might lead them into. One thing that this claim suggests is that
    the person with shame has not yet fully shaped her appetites and passions to accord
    with her reason, and therefore she has to check them in. Since young people’s
    deliberative capacities are not fully formed and reason is not sufficiently authorative
    for them, shame plays the role of restraining the other passions in a way that
    is harmonious with reason—reason, that is, broadly understood to include the law,
    the advice of those with greater knowledge of practical matters, this is a perfectly
    good mechanism to have in place for young people, who require external guidance
    as they develop their deliberative capacities.


    Although the restraining function of shame could be taken as a sign that learners
    with aidōs live by passion,⁹ Aristotle’s claim actually has the opposite implication.
    The idea is that they obey their sense of aidōs are already prepared to check
    and direct the commands of their passions when they lead astray, and in this regard,
    cannot be said to live by passion alone, or at least not in usual sense


