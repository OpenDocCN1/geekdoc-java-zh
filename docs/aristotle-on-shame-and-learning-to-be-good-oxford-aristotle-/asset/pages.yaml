  md: '# 6 INTRODUCTION


    from a limited number of remarks on habituation and good upbringing.

    Moreover, although Aristotle devoting two long discussions to shame—at Nicomachean
    Ethics (NE) IV 9, 1128b10–35, and Rhet II 6, 1383b12–1385a15—both are incomplete
    and fragmentary, and fail to tell the details of how shame is an integral part
    of young people''s transition into moral agents.

    To build a more complete and unified account of the role of shame in moral development,
    we will have to look beyond these texts. Some of the crucial passages that help
    build a deeper story about shame are the discussions of moral development and
    the relationship between actions and dispositions at NE II 1–4 and Eudemian Ethics
    (EE) II i; the characterization of shame as one of the emotional praeworthy between
    extremes at NE II 7, 1108a30–35, and EE III 7, 1233b16–1234a44; the treatment
    of voluntariness and praise in NE III 1, 1099b30–1115a3, and EE II 6–11, 1222b15–1228a9;
    the discussions of the pseudo-character based on shame at NE III 8, 1116a15–29,
    and EE III 1, the final remarks on the ideal audience of ethical lessons at NE
    X 9, 1179b4–6, where Aristotle directly associates shame with receptivity to ethical
    arguments. As I will show, these passages offer sufficient textual evidence to
    establish shame''s relevance to the question of moral education in Aristotle and
    to make apparent how shame equips us with the necessary orientation for learning
    to be good.


    # 0.1 The “Moral Upbreeding Gap” and Shame as the Bridge to Virtue


    Let me start by presenting the problem that the proposal of shame as the protovertue
    of the learner is designed to solve. Aristotle offers an account in the NE of
    how we become good seems, at first sight, really straightforward. He famously
    claims that we become just, temperate, and courageous by performing just, temperate,
    and courageous actions, and in general, that we become virtuous agents by doing
    virtuous actions; I call this the learning-by-doing thesis. Aristotle also makes
    that virtuous actions performed virtuously, i.e. virtuous actions done in the
    right way or as the virtuous person does must, be performed both with knowledge
    and with a proper aim, which he expresses as “for the sake of the noble” (tou
    kalou heneka).¹⁵ The tension between these claims produces a serious difficulty:
    How can learners be expected to perform virtuous actions in the right way—and
    thereby learn virtue “by doing”—unless


    > ¹⁵ The claim that doing virtuous actions “for the sake of the noble” (tou kalou
    heneka) is characteristic of virtue (and virtuous) is expressed by Aristotle on
    numerous occasions throughout the discussion of the particular virtues in NE III
    6 to IV 8, 1115a6–1128b9. See Chapter 1, note 11 for a list of passages that Aristotle
    makes this claim.'
