    the problem but as the solution: learners become virtuous by acting from virtuous
    motives, or as Irwin puts it, by acting with “the motive of the virtuous person”.
    If, as I will argue in Section 1.7, Aristotle does not accept that a fully virtuous
    agent is a necessary condition for acting from a virtuous motive,²² then we say
    that his response to the priority objection in II 4 does not force him to renounce
    the claim that the virtuous actions of the learners involve virtuous motivation—in
    other words, Aristotle''s discussion in II 4 does not rule out that in their practice
    towards virtuous learners aim at noble accounts of their nobility.


    Let us now turn to some of the disadvantages of the motivationally-neutral view.


    # 1.6 What is Wrong with the Motivationally-Neutral Accounts?


    The motivationally-neutral conception of the learners'' actions, according to
    which the actions of learners are the right things to do in the circumstances
    but are lacking the right motivations, involves a number of difficulties. First,
    it leads some defenders of this view to claim erroneously, that the virtuous actions
    of the learners are not fully (or even truly) virtuous or good. Second, it is
    also in tension with the account of the actions of learners that we find in II
    9, 1109a24–b7, where Aristotle explains the relevance of the doctrine of the mean
    as a guide for acquiring virtue. Third, and most importantly, this conception
    opens a gap between the motivationally-neutral actions of the learners and the
    noble-oriented virtuous dispositions that those actions are expected to yield.


