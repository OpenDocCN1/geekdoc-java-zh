    # 1.4 Aristotle''s Response to the Priority Objection: General Lines


    In II 4 Aristotle offers his response to those who raise concerns about the priority
    of dispositions over actions. The priority objection is formulated as one that
    affects both the case of learning crafts or skills and of acquiring virtue:


    Someone might wonder, however, what we mean by saying becoming just requires just
    actions first, and becoming temperate requires temperate actions. For people do
    what is just and what is temperate, they are already just and temperate; similarly,
    if they do what is grammatical or musical, they are grammarians and musicians.⁴
    (NE II 4, 1105a17–27)


    Aristotle''s first move is to show that the objection is misguided in the case
    of the crafts. To this end, he argues with examples of people who do not possess
    a craft but are able to produce outcomes that are stereotypical of the craft—e.g.
    someone who does not know grammar but can build a correct sentence, someone who
    does not know music but can play a melody. This argument can also be applied to
    the case of the virtues: we are people who are not virtuous but are able to act
    ''according to the virtues''—such as when people produce outcomes that are stereotypical
    of the virtues by merely following the law, or acting from punishment, or by chance.²⁵
    This line of argument would be sufficient to respond to the priority objection,²⁶
    Aristotle does not stop here.


