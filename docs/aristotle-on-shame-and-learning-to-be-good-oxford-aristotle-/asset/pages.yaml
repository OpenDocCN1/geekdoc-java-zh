  md: '# PRAISEWORTHY SHAME AND YOUNG PEOPLE IN NE IV 9 161


    My present goal is to defend the two central passages on shame from the NE offer
    support for our account of shame as a kind of love of the noble and hatred of
    the shameful, informed and reinforced by the social practices of honors and reproaches,
    praise and blame. These texts, I argue, confirm a conception of shame as an emotion
    that or learners towards the noble and leads learners of virtue to attend in their
    actions to considerations beyond the resulting pleasantness or painfulness, or
    the gaining or losses.


    Sections 6.2 and 6.3 offer a detailed analysis of NE IV 9 and X 9 respectively,
    highlighting some of the features that contribute to the proto-virtuous character
    of shame. In particular, Section 6.2 focuses on Aristotle''s reasons for considering
    praiseworthy in young people, due to its restraining power and its relationship
    with potential moral error. Section 6.3 shows that those who obey their sense
    of shame fulfill the cognitive, motivational, and reliability requirements needed
    for performing virtuous actions in the right way. In NE 9 Aristotle clearly identifies
    those who have a sense of shame have the capacity for moral progress because they
    already something like the seeds of virtue, whereas people who merely act from
    fear of punishment do not. Section 6.4 presents a final defense of shame and contrasts
    the condition of shame-prone agents with the timid and the shameless.


    # 6.2 Praiseworthy Shame and Young People in NE IV 9


    So far I have argued that in NE IV 9 moral role of shame provides a solid explanation
    for why Aristotle accords such a peculiar character: shame is not a virtue, but
    an emotion, and yet it is praiseworthy because it guides young people along the
    path towards virtue. What are the grounds for the praiseworthyness of shame? Why
    do we praise those who feel shame appropriately? And when is shame appropriate?


    Let answer these questions by taking up the central tenets of NE IV 9 separately,
    following the order in which they appear in the text. (a) Shame is not a virtue.
    (b) Shame is more an emotion (pathos). (c) Shame is nonetheless a praiseworthy
    possession in young people, who are not yet virtuous, because (c1) it enables
    them to restrain their morally inappropriate passions, and (c2) it helps them
    deal with the practical errors they might commit of immaturity or inexperience.
    Shame is, however, (d) not praiseworthy in individuals. Our analysis will work
    towards developing a first explanation of (e) why shame is a proto-virtuous emotion,
    and why Aristotle nonetheless rejects the idea that shame could be a valuable
    possession in the old.'
