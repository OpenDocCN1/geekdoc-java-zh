    virtuous motives. My claim here is, however, that Aristotle does not hold that
    view, and the claim that only virtuous agents act with virtuous motives is erroneously
    attributed to him by some commentators (e.g. Ross 1959, 1994, and Irwin 1999,
    195, as quoted above in this section). Other commentators, are sympathetic to
    the possibility that learners can have virtuous motives—see e.g. Broadie 1991
