    good, and they translate it in terms of pleasure or gain. In contrast, those with
    shame not only have a conception of the noble as different from the merely pleasant
    and the merely advantageous, but they also have a sense that noble things are
    truly pleasant and superior to other pleasures or other benefits, so they give
    primacy to the noble in their practical lives.


    Of course, the conception of the noble held by those with a sense of shame must
    be different from the knowledge of the noble possessed by the virtuous person
    who has practical wisdom. Thus in relation to their grasp of the noble, the learners
    with shame find themselves in an intermediate position between virtuous people
    and those who obey appetitive pleasures and pains.


