  md: '# 184 SHAME AS THE PROTO-VIRTUE OF THE LEARNERS


    leads to a life of constant changes in one’s preferences and ideals and to a general
    lack of accountability. As a result, shameless individuals do not have reliability
    in their actions or integrity, and it is not clear that they have a character
    that is their and somehow guides their actions or decisions. On the other extreme,
    the “timid” or “shy” person (ho kataplex) puts too much weight on the opinions
    of others and is ashamed at most occasions, even when shame is not the right response.
    For this reason, timid or shy people are subject to the whims of others and clearly
    have a limited capacity for autonomy. In the case of shamelessness, timid individuals
    lack integrity and reliability in their actions, and they lack a character of
    their own that guides their actions.


    In contrast, young agents with a sense of shame, at least in the account that
    we have found in Aristotle, are mainly concerned with noble actions and noble
    outcomes insofar as they see those as reflection of their characters, and they
    rely on the opinions of others only insofar as those opinions can better orient
    them towards the noble or can confirm that they are on the right track.


    As a consequence, we can say that in the absence of virtue, being properly prone
    to shame is a necessary condition for doing and feeling in ways that preserve
    one’s true self-determination. As opposed to the shameless and the timid, who
    are respectively subject to the whims of self and others, shame-prone individuals
    are self-ruling and not heteronomous at least in the sense that, while they rely
    on other’s feedback and encouragement, they do so in a way that is consistent
    with a goal that they reliably pursue—a goal that gives stability and integrity
    to their decisions. Shame is precisely the emotion that guarantees that they aim
    at preserving their own agency even in the most extreme circumstances.'
