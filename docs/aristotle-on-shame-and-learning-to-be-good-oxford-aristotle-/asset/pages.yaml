    both Hector and Domedes are determined to risk death to avoid the reproaches they
    would receive if they acted otherwise. The system of honors and reproaches provides
    these heroes with a framework to think about the demands of practical situations,
    as praiseworthiness or blameworthiness of their actions is the central consideration
    in the deliberations. The social practices of praise and blame are precisely shaped
