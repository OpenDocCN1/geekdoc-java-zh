  md: '# INTRODUCTION 5


    autonomy. Rather, the attention to other people''s views explains why shame can
    help acquire the intellectual and affective maturity of autonomous moral agents,
    who live in a social context where giving and taking reasons for one''s behavior
    and choices is part of moral life.¹ Against the superficiality objection, I argue
    that shame''s connection with love of honor and responsiveness to praise and blame
    does not entail a superficial concern with appearance over reality. For Aristotle,
    love of honor and praise and blame are not just based on the joy of merely appearing
    to be good in the eyes of others, but on the joy of getting others to truly see
    virtue (or the potential for virtue) in oneself''s actions. Because of its self-reflective
    character, shame turns our attention to the intimate link that connects what we
    do, and how those things make us appear in our social world, with the kind of
    people we are (or will become). As a consequence, the aversion to what is shameful,
    and as the aspiration to shine in the eyes of others, are typically indicators
    that learners consider about the nobility or shamelessness of actions as a reflection
    of who they (or will become), and have a true interest in what is right.


    As Aristotle reminds us in Rhetoric (Rhet II, 1383b13–1385a15), the kinds of things
    that produce shame are those "due to bad character" (apo kakias, 1338b18) or those
    actions that are generally "signs" (semeia) of defective traits of character (1383b29–1384a4
    and 1384b17–).). By producing in aversion to displaying signs of bad character
    or, by making us alert to shame and its connection with true vice, shame makes
    us veer away from the kinds of actions that make us worse precisely because they
    make us worse (as opposed to veering away from actions on account of the mere
    fear of potential harms or unpleasant consequences that might follow). Consequently,
    shame puts learners on the right path towards true virtue. From moving learners
    to simply fake virtue until they acquire stable dispositions of character, shame
    makes learners genuinely value the noble, and how value is expressed in what they
    do and what they are.


    Although it is not controversial that shame plays a relevant role in Aristotle''s
    theory of ethical formation, the texts that explicitly support this claim are
    scarce and scattered throughout the ethical treatises, so any attempt to specify
    the role of shame must confront substantial obstacles. Aristotle himself does
    not provide us with a direct and detailed explanation of the process of moral
    development; rather, in his ethical treatises he offers a schematic account. Thus
    the reader is left to decipher the nature of the practices that lead learners
    to become virtuous agents


    > ¹ See e.g. Calhoun 2004 and Sher 2006 for insightful discussions of this. In
    agreement with these authors, Aristotle''s ethics is—as I argue in this book,
    and in Chapter 4 below—that responsiveness to shame equips learners with a sensitivity
    to blame (and praise) which is a clear expression of a concern with moral issues
    and an aspiration to getting things right.


    > ² Unless otherwise noted, all translations of passages from Aristotle''s Rhetoric
    are by Rhys Roberts (in Barnes 1984), sometimes substantially modified, and the
    Greek text used is Ross 1959.'
