  md: '# 2 INTRODUCTION


    virtue of those learning to be good (I call them “learnners”),⁴ as it is the emotion
    that equips learners with the seeds of virtue. Other emotions such as friendliness
    (philia), righteous indignation (nemesis), emulation (zelos), hope (elpis), and
    even spiritedness (thumos) may play important roles on the road to virtue. However,
    shame is the only one Aristotle associates with moral progress. The reason, as
    I argue, is that shame can move agents to perform good actions and avoid bad ones
    in ways that appropriately resemble not only the external behaviors of virtue,
    but also the orientation and receptivity to moral value characteristic of virtuous
    people.


    What, then, is shame, and how is it to be seen in our moral development? Although
    shame is not a virtue for Aristotle, it has three connected features that make
    it indispensable for the development of a good character: self-reflectivity, other-relatedness,
    and responsiveness to moral considerations beyond pleasures and gains. First,
    shame promotes our awareness of the connection between the inside and outside
    aspects of the self. Specifically, shame focuses on the intimate connection between
    praiseworth (or blamworthiness) of our actions and the praiseworth (or blamworthiness)
    of our character—it gets us to see our external behavior and, in general, how
    we seem to be, as a reflection of who we are. Secondly, shame makes us responsive
    to the moral opinions of others and enables us to listen to moral reasons. And
    finally, third, shame makes agents responsive to a kind of value beyond mere pleasure
    (hedone) and gain (kerdos). More precisely, shame makes agents responsive to the
    value of the kalon (noble, admirable, beautiful, or fine), which is the characteristic
    goal of virtue.s attention to considerations about honor (timé) and praise (epainos),
    and thus as I argue—turning our attention to considerations about the perceived
    nobility and praiseworth of our own actions and character, shame places young
    people on the path to becoming good.


    Beyond Aristotle, also in contemporary discussions shame is typically characterized
    as a self-reflective and other-related emotion. Shame tends to be,


    > ⁴This idea echoes the in Burnyat 1980 that is for Aristotle the semi-virtue
    of the learner (78). Deonna et al. 2012 also use the expression “semi-virtue”
    in their explanation of shame in contemporary terms (178). I prefer “proto-virtue”
    as it has the connotations of being a precursor of virtue, which I think is more
    accurate, as the Aristotelian point is that shame learns on towards virtue.


    > ⁵I will translate kalon for the most part as “noble,” but occasionally “admirable,”
    “beautiful,” or “fine,” or I will translate it as most appropriate to the context.
    See note 11 in Chapter 1, Section 1.2, below for the list of texts where Aristotle
    claims that virtuous actions “for the sake of the noble (tou kalou heneka)” is
    characteristic of virtue. Some relevant discussions of the notion of the kalon
    in Aristotle are Owens 1981; Rogers 1993; Cooper 1996; Richardson Lee 2006; Irwin
    2010; Kraut 2013; Crisp 2014.'
