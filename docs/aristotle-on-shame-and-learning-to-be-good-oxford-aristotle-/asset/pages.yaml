    # 6.3.3 Shame and the Proper Pleasures of the Noble


    The third positive aspect of shame that makes learners receptive to ethical arguments
    and prone to perform virtuous actions in the right way is the ability to enjoy
    the proper (true) pleasure of the noble. This, as we saw in Chapter 2, is a variety
    of pleasure that people without a sense of shame have not experienced. In our
    text, Aristotle says they “have not tasted” (ageustoi ontes) ensures these pleasures
    (1179b15-16).


    People with an adequate sense of shame are sensitive to pleasures and pains that
    are significantly different from those children and people without shame have
    access to the most part; moreover, they have an awareness that these pleasures
    are in some sense superior to others. For example, someone with a sense of shame
    will be able to find greater—or perhaps simply better—pleasure in giving half
    of her lunch to someone who needs it, rather than eating it all by herself. Or
    she will perhaps just worse—pain in watching something occur without intervening,
    than she would be hurt (and, in some extreme cases, killed) if she intervenes.
    The difference between these examples of pleasures and pains is not simply a difference
    in quantity but in kind. The kind of pleasures and pains to which the person with
    shame has access, i.e. the pleasures arising from noble activities and the pains
    arising from base ones, are of a different kind than those whose arise from obtaining
    or not obtaining the objects of our appetites.


    This new sort of pleasure—pleasure in the noble, which is an integral part of
    virtuous activity—is a shame that can make accessible to learners before they
    have virtue, but learners are able to reliably have only once they have gone through
    a certain transformation in their attitudes towards the noble. In the case of
    virtuous people these pleasures always accompany virtuous activity, people without
    shame are not aware of their existence (“have not tasted them”), and people with
    a sense of shame occupy a middle position insofar as they are at least appreciate
    them on occasion. As we saw in Chapter 2, these pleasures are a sign that learners
    are on the right track, and they serve for them as an encouragement to continue
    on their path towards virtue.


