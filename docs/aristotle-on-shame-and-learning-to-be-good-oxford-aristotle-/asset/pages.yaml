    # 3.2.1 Six Kinds of Pseudo-Courage


    In NE III 8, 1116a15–1117a28, and EE III 1, 1229a11–1230a33, Aristotle identifies
    six common causes for the appearances of courage: shame (aidōs), fear (phobos),
    experience (empeiria), spirit (thumos), hope (eupis), and ignorance (agnosia).
    Although those who also come on account of these cases are not virtuous, their
    external behavior is often indistinguishable from that of courageous people, which
    makes it difficult to assess from more observation. For example, when professional
    soldiers gracefully deal with the dangers of battle, people immediately tend to
    think that they are courageous; for Aristotle, speaking, if they are aware of
    the risk they face is quite low, it does not count as genuine courage. Similarly
    when soldiers risk their lives in battle out of fear of punishment, they might
    seem courageous to those who observe their behavior, but for Aristotle they do
    not count as courageous, no matter how much of a risk they run or how noble the
    results of their actions. Even soldiers who risk their lives in battle because
    it is noble to do so—or because it would be shameful to flee—will not count as
    courageous for Aristotle if they do not sufficiently reliable practical knowledge
    and instead have to rely on external guidance to determine whether the situation
    calls for such behavior.


