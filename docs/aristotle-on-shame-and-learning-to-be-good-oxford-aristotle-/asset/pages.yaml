    The passage on aidos opens with a clear statement about the status of this emotion
    in Aristotle’s moral psychology: “Aidos should not be described as a virtue”²
    (NE IV 9, 1128b10). As commentators have noted, when Aristotle argues aidos is
    not a virtue, he is speaking, at least partially, with a Greek tradition.³ Indeed,
    the conception of aidos can be traced back to the Homeric and Hesiodic poems,
    and it is most famously represented in Plato’s Protagoras, where Protagoras’s
    “Great Speech” (320c–322d) advances the view that aidos is one of the two virtues,
    together with dike (justice), sent by Zeus to elite humans to live in society.⁴
    In all these cases, the scope of aidos is broader than the scope of notion of
    shame, but the term maintains its connections with love of honor and aversion
    to reproach.


    Aristotle also sees aidos as a positive trait, he has important reasons to deviate
    from the traditional view that it is a virtue, because he has established a number
    of theoretical constraints on what counts as a virtue of character—constraints
    which do not leave room for Aristotle understands it. In Aristotle’s framework,
    as we have seen in Section 5.3 of the previous chapter, shame is in some of the
