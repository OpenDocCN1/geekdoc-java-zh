    the shameful, which allows them to produce value judgments in the right turns.
    They also have an attachment to the noble and the shameful, which enables them
    to be properly affected by the relevant features of their practical situations
    and in ways that are conducive to virtue. In other words, in these passages shame
    emerges as a genuine love of noble things and hatred of shameful allows young
    people to perform virtuous actions in the right way and make reliable progress
    towards virtue.


    Learners who are responsive to shame are in a much better condition than those
    who have no shame at all (the “shameless”) or those who have excessive shame (the
    “timid”), not only because they are able to do virtuous actions in the right way,
    but also because they can shape who they are (and who they become) through their
    own actions, and thus see their actions as expressions of themselves and opportunities
    for becoming better. Although they are not yet virtuous, these learners of virtue
    appreciate the value of noble activity and can guide their actions by a true interest
    in doing the right thing for their own sake.


    In conclusion, my interpretation provides a genuinely intermediate place for the
    learners of virtue with respect to both the cognitive and affective dimensions
    of moral development, and is thus better to explain the process of becoming virtuous
    without any gaps.'
