    The complications of the account appear in NE II 4, 1105a17–21, where Aristotle
    admits himself that the claim that virtue gave rise to a potential objection concerning
    the priority of actions over dispositions: How can learners perform virtuous actions
    unless they are already (ēd) virtuous? In other words, how can learners virtuous
    by doing virtuous actions, if one must be prior to doing virtuous actions? Aristotle
    responds to this priority objection by denying that having virtue is a requirement
    for all cases of doing virtuous actions. His strategy is to distinguish between
    (a) simply doing virtuous actions, i.e. doing actions that are “in accordance
