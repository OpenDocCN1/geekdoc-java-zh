    # 3.4.1 Hopeful Agents’ Main Features


    The most salient feature of hopeful individuals is that they tend to have an aggravated
    self-image that serves as the main source of their hope: they imagine that they
    are courageous, strong, and capable of dealing properly with dangerous situations—they
    believe that they are “the strongest and can suffer nothing” (kratist einai kai
    mêhen at pathein, ME 1117a13–14) — and this belief provides them with sufficient
    confidence to throw themselves into. Against their perception, they lack the conditions
    that would make them genuinely courageous. Their main failure is the lack of self-knowledge
    or self-awareness, which makes them embark upon dangerous ventures beyond their
    capabilities.


    In the terms used in the previous section, hopeful people’s failure is that they
    have an inadequate sense of their worth (axioma). As Gravlee 2000 puts it, “the
    belief in one’s own strength is not well grounded in this case, because it lies
    not in any skills or training that the agent may have, but rather in mere good
    fortune” (464). Later in NE IV 3 Aristotle claims that the hopeful agent is “foolish”
    or “vain” (elithos), as opposed to “properly proud” (megalopsucho), insofar as
