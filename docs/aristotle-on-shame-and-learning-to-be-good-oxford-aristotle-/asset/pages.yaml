    # 6.2.5 Shame is a Proto-Virtuous Pathos


    The account of shame in NE IV 9 is mostly negative, because the goal of the passage
    (or what we have of) is to establish a clear contrast between shame and virtue.
    However, Aristotle is also interested in the ways in which shame is a sui generis
    emotion and by doing that, he reveals some of its positive traits. On the one
    hand, having an active sense of shame allows agents to keep their emotions from
    leading them astray. On the other hand, agents with a well-oriented sense of shame
    experience shameful and base activities as painful, shame hinders wrongdoing—either
    by anticipation, or by confirmation of the painfulness of an action or way of
    being.


    Beyond these two mainly negative functions presented in NE IV 9, 1128b10–35, shame
    also has a positive role in the process of becoming good, which is stressed mainly
    in the text of NE X 9, 1179b-46. Shame’s most important feature for young people
    is that it introduces them to considerations of honor and dispute, and ultimately
    to considerations of nobility and shamelessness, thereby distancing agents from
    narrow considerations of pleasure and gain. Even when young people are morally
    imperfect, and struggle to improve their understanding they are already properly
    oriented towards the noble; they simply need adequate guidance to become good.
    In fact, shame provides the seeds for our initial love of the noble, and helps
    cultivate those by contributing to the alignment of the pleasant, the advantageous,
    and the noble for us. That is, acting from shame, learners can orient their values
    and goals like the virtuous person does.'
