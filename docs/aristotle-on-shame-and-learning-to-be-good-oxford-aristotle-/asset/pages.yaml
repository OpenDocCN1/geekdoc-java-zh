    In NE II 5, 1105b19–1106a13, and EE II 2, 1220b10–2, Aristotle explores the notion
    of virtue by looking at the distinction between dunameis (capacities), *pathē*
    (emotions), and hexeis (dispositions) of the soul. In both passages, he puts forward
    distinguishing features of virtue that differentiate from emotions or capacities,
    and he uses these features to conclude that virtues fall under the category of
    dispositions:


    +   (A) Only virtues are *praeworthy*, while emotions and capacities are not.
    (NE II 5, 1105b31–1106a28–9)

    (B) What matters for virtue is the way in which agents are related to emotions
    or actions, which emotions and capacities are defined simply by having them or
    not. (NE II 5, 1105b32–33b–34)

    (C) Virtues involve *prohairesis* (choice, delimited commitment),$^{35}$ while
    emotions and capacities do not. (NE II 5, 1106a2–4)

    (D) Emotions are about “being affected” or “moved” (*kineisthai*), while virtues
    are about “being disposed in a certain way” (*diakaistai pos*). (NE II 5, 1106a4–6;
    cf. EE II 2, 1220b14–15)

    (E) Virtues are acquired, while we have capacities by “nature” (*phusei*). (NE
    II 5,)

    (F) We have virtue “according to reason” (*kata logon*). (EE II 2, 1220b18–20)


