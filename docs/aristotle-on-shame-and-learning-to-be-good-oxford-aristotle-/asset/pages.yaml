  md: '# 0.3 Plan of the Book


    The first step in my argument is to examine the account of habituation as learning-by-doing
    in NE II 1–4, 110a14–105b18, the locus classicus of Aristotle’s account of how
    virtue is acquired through habits. In Chapter 1, “Becoming Virtuous by Doing Virtuous
    Actions,” I look at the details of the learning-by-doing thesis and propose a
    new way of thinking about the conditions that learners of virtue must meet for
    their habituation to be successful. The gist of my proposal is that there should
    be continuity between learners and virtuous agents. If the actions of the learners
    are to be conducive to virtue, then learners need to perform them in ways that
    appropriately resemble virtuous people. For that reason, learners cannot be blank
    slates, but should at least fulfill the requirements for knowledge, motivation,
    and stability that NE II 4 establishes as necessary for virtuous actions in the
    right way (i.e. virtuously). Becoming good, then, requires the proper exercise
    of both the cognitive and the affective tendencies that anticipate the learner
    in the way which virtuous agents think and feel.


    I argue that achieving the relevant continuity between the learners’ actions and
    the resulting positions, learners need to perform virtuous actions not just with
    sufficient awareness but also with the right motivation. This means that learners
    should be equipped with some initial affective tendencies that enable them to
    perform virtuous actions for the sake of the noble. Only then, I will, their actions
    be conducive to virtue.


    Chapter 2, “Learning through Pleasure, Pain, the Noble, and the Shameful,” offers
    a first step towards explaining how the learners’ motivational outlook is shaped
    in habituation. Specifically, in this chapter I explore the role that pleasures
    and pains play in the learners’ capacity to be attracted to the nobility of virtuous
    actions and to aim at the noble action before they are virtuous.


    In the view that I propose, moral development is not the acquisition of a taste
    for the new pleasures of the noble, but a reorienting and shaping of the alreadypresent
    capacity to enjoy nobility and be pleased by the shameful—a reorienting and shaping
    through which learners of virtue become better to appreciate the comparatively
    superior value of nobility over mere pleasure or gain. My main point is that that
    for the noble and the capacity to appreciate it is present in us from the start,
    just as the desire for pleasure and the desire for benefit. Moral upbringing is
    the process in which we learn to align those desires and tendencies correctly
    and to give priority to the noble over all other considerations.


    In Chapter 3, “Pseudo-Virtuous Practices, Pseudo-Virtuous Conditions,” I analyse
    a number of possible sources for our pre-habitated taste for the noble. My goal
    in this chapter is to find a natural condition that can equip learners with resources
    to be able to perform virtuous actions on account of their nobility.'
