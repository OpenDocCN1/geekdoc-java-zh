    A second positive aspect of shame underscored by this passage is that those who
    have shame are able to appreciate the true value of the noble and possess a basic
    grasp of the noble that opens their eyes to seeing the world in a different way.
    People without a sense of shame, in Aristotle’s words, a “conception” (ennoian)
    of “the noble and truly pleasant” (tou de kalou kai áleth, 1179b15). They are
