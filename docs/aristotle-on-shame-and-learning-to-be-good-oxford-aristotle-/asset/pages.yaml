    the lover of horses, but a spectacle to the lights of sights, but also in the
    same just as actions are pleasant to the lover of justice and, in virtuous actions
    to the lover of virtue. For most people their pleasures are in conflict with one
    another because these are not by nature, but the lovers of what is noble (tois
    de philakalois) find the things that are by nature pleasant; and virtuous actions
    are such, that these are pleasant for such people as well as in their own nature.
    Their life, therefore, has no further need of pleasure as a sort of ornament,
    but has pleasure in itself. For, besides what we have said, the person who does
    not reject pleasure in actions is not good; since no one would call just someone
    who did not acting justly, nor call liberal someone who did not enjoy liberal
    actions; similarly in all other cases. If this is virtue, virtuous actions must
