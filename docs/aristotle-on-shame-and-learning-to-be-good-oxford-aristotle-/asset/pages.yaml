  md: '# # Introduction


    Shame is a complex and multifaceted emotion and its contribution to our ethical
    lives is difficult to pin down. For some, shame is a valuable emotion that helps
    us to improve our character, motivating individuals and even communities to achieve
    higher moral standards. But shame is also often seen as a feeling we are better
    off without, insofar as it is a painful experience that can be used as a tool
    for social manipulation or oppression, and it can be paralyzing or even lead to
    selfdestructive behavior.¹ This ambivalence about shame is on display not only
    in contemporary discussions, but also in a good portion of the ancient Greek literature.
    In many ancient Greek texts, shame (aidos, auchune) appears to be used in at least
    two senses, including both good sense of shame as virtue, or at the very least
    as a stepping-stone to virtue, and a bad sense of shame as an oppressive emotion
    that unduly limits our agency.² In Aristotle''s ethical writings we also find
    both positive and negative aspects of shame: it is praeworthy in young people
    and crucial to moral development, and excessively dependent on what others think.
    My aim in this book is to show how Aristotle reconciles these conflicting aspects
    of shame in a single unified account, and to depict shame''s bad name by exploring
    Aristotle''s views on the nature of shame and its positive role in our early ethical
    lives.


    My central claim is that Aristotle is not just a helpful aid to learning to be
    good, but an essential part of that process. Shame is, the,


    > ¹ Contemporary philosophical discussions of shame often open with remarks about
    the multifaceted and ambivalent character of this emotion—e.g. Keyes 1998; Calhoun
    2004; Nussbaum 2004; Morski 2010; Deonna 2012; and Thomason 2018. Among contemporary
    authors who deal with shame, some underscore shame''s moral relevance and its
    potential to encourage moral improvement—e.g. Adreich 1939; Rawls 1971; 96⁷ “Self-Report,
    Excellences, and Shame” (440–66); Taylor 1985; Williams 1993; Singer 1999 (129–64);
    Calhoun 2004; Manion 2002; Arneson 2007; Morski 2010; Tanpoloski 2010; Appiah
    2010; Deonna 2013; Freib 2015; and Ramirez 2017.


    > ² An essential study of the complex character of shame in ancient Greek thought,
    from Homer to Aristotle, is Cairns 1993. See Von Erlich 1937; Fisher 1952; Williams
    1993; and Constant 2006 ch. 4 (91–110). North''s 1966 study of sophrosyne is also
    relevant.


    > ³ See Chapter 5, for a brief discussion of this distinction and the ways in
    which it has been attributed to Aristotle. Cairns 1993 offers a study of these
    two senses of shame in ancient Greek literature and provides numerous examples.


    Aristotle on Shame and Learning to Be Good. Maria Jimenez, Oxford University Press
    (2020). Maria Jimenez.

    DOI: 10.1093/oso/978018829683.000'
