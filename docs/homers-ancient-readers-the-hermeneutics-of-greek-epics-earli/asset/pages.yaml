    # JAMES I. PORTER


    # I


    ACCORDING to the scholia of Dionysius Thrax (the learned Alexandrian grammarian
    of the mid-second century B.C.), the first critical editors of Homer came into
    existence in the following way. Homer’s poems, scattered over time by floods,
    earthquakes, and fire, resurrected again, but in random quantities. It fell to
    Peisistratos to rescue the epics from almost certain oblivion. This he did, by
    instituting a reward for all scraps of Homer, which he doled equitably and we
    might say, mechanically. Remuneration was fixed at a per-line rate; nobody and
    no lines were turned away, not even if the duplicated lines previously turned
    in, and not even if, upon inspection, the lines had to contain plus-verses—however
    these may have crept into the text. Seventy-two experts (γραμμαματικό) were appointed
    to the task of individually (κατὰ δίων) resembling Homer’s poems, each according
    to his own lights and at a wage that befitted learned men and connoisseurs of
    poems (κριὶταῖς ποιήμάτων). The results (ἴδίων συνθέθέσεις, “individual recompositions”)
    were then judged competitively and judiciously—“with a view,” writes the scholist,
    “not to one-upsmanship, but to the truth, as only the name of art.” Aristarchus
