    Thessalonica,” along with the unauthorized anonymous publication "De orphische
    Papyrus von Derveni,” and the discussion in M. L. West, *The Orphic Poems*, 68–113.


    > ⁷ See the appropriate articles of J. Tate, “Plato and Allegorical Interpretation”
