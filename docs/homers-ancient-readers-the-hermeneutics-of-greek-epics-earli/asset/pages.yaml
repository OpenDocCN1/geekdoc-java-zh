  md: '# * CHAPTER SIX *


    # The Byzantines and Homer*


    # ROBERT BROWING


    BY THE TIME Constantine inaugurated his new capital on the Bosorus, the Homeric
    poems had been schoolbooks for at least eight centuries, since even Athenian schoolchildren
    learnt by heart the meaning of such obscure Homeric terms as ἀμήνήν κάρνη καὶ
    κύρμβα.¹¹ It may seem odd that children should be taught the art of reading from
    poems composed in a form of language which no one actually spoke or ever had spoken,
    but Greek society was not the only one that taught this. Because of the strangeness
    of their language, the Homeric poems were also, and of necessity, the object of
    close philological study in antiquity. Democritus (or may not) have written a
    treatise on Homeric glosses. And the impressive textual, grammatical, metrical,
    and lexico-graphic studies of the great Alexandrian scholars laid the foundation
    on which all European literary and philological studies have been built.


    The Iliad and the Odyssey were the earliest texts containing information on the
    Greek pantheon and the rituals of its worship, and hence they enjoyed the prestige
    of religious authority. As Greek religion became progressively moralized, the
    response to the critique of Xenophanes and others of the moral content of Homer
    was to see in the Homeric text a hidden meaning—an ἀλλαληγορία—that comprised
