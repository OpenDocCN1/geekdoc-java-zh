  md: '# INTRODUCTION


    history of the interpretation of the poems begins within the poems, and these
    earliest monuments in European literature have been interacting with ideas about
    their meaning for millennia.


    Nevertheless, among the Greeks, the interpretation of literary texts remained
    a sublimary activity until a relatively late date, or so the preserved body of
    texts would lead us to believe. The small number of exceptions, such as the Denver
    papyrus, and the discussion of the meaning of a poem by Simonides in Plato''s
    Protagoras (343–48), provide sufficient indication, however, that the interrogation
    of poetic texts and the formulation of competing claims about their meaning were
    very much a part of the intellectual life of the Greeks of the classical period.
    That passage in the Protagoras along with one in the Republic where Socrates rejects
    the educational use of poetry the Homeric poems “they''re allegorical or not”
    (ὅτὶ ἐν ὑποοις πετεμησν, οὅτε ἄνευ ὑποοίν 378d) has been widely cited as the claim
    that Plato was hostile to interpretation in general and to allegorical interpretation.⁷


    Plato''s position in the larger history of the interpretation of the Iliad and
    Odyssey remains problematic in spite of his overall hostility to the interpretation
    of poetry.⁸ In one of its aspects, that hostility is perhaps inevitable, the very
    nature of the Socratic enterprise as Plato presents it. The same passage in the
    Protagoras mentioned above (343–48) is the classicus.⁹ We are presented with a
    Socrates who rejects the discussion of the meaning of poetic texts on the basis
    that there is no elenchus, no viable procedure of testing and refutation, of individuals''¹⁰''
    claims about such questions. The corollary to this observation is that the interrogation
    of poetic texts is not a promising path to the truth, so that poetry joins etymology
    and the other discarded areas of inquiry aside one after another whose rejection
    is relatively easy for Socrates to bear—clearly one of the many paradoxes Plato
    wavers into the portrait of his teacher. It would have seen a very high price
    to most of his contemporaries.


