    the Stoa must in some sense have acted as mediator, the program of systematic
    interrogation of the Homeric poems alongside other sources of philosophical or
    theological truth enters the philosophical mainstream only in the second century
    CE.³⁰


    From that time, in "Pythagorean" or dogmatic Platonist circles the Iliad and Odyssey
    were associated with both the myths of the Platonic dialogues and with the wisdom
    of Pythagoras as well as which "alien wisdom" could be gleaned from the Brahmans,
    Jews, Magi, and Egyptians,⁴¹ new attitude toward Homer emerged that was to last
    as long as there were polytheist Greek thinkers. In the reading of the epics developed
    among the later Platonists, each breathes with a proliferation of levels of reference,
    all contributing to the cumulative force of, first, the poem as a whole, and second,
    the greater beyond the epics, the Troy tale itself. For readers such as Porphyry
    in the third century and Proclus in the first, the true subject of the Iliad and
    Odyssey was the fate of souls and the structure of the universe. The first poem
    recounted the descent of souls into this world of strife, represented on the screen
    of the fiction by the metaphor of war, a descent triggered by the powerful attraction
    of the "dryness" of the cosmos (Helen). The second return of one of those souls,
    plunged into the sea of matter and embroiled with the deities presiding over it,
    until he at last would achieve the state of "dryness" promised by Teiresias and
    finally free himself of all memory of the material universe.


    There is no doubt that this reading had competitors and adversaries, but to judge
    by the pattern of citations of Homer in the preserved literature—the philosophical
    literature in particular—late antiquity, or something like it was remarkably widespread.
    It is, in fact, for all its oddness, the one ancient reading of the poem that
    reaches us largely intact and well documented, and exercised a powerful attraction
    even in the Latin Middle Ages, when the Iliad and Odyssey were such were unknown.


