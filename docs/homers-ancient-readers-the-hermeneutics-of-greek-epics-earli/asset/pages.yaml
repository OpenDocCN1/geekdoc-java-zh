  md: '# * CHAPTER ONE *


    # Bard and Audience in Homer*


    # CHARLES SEGAL


    THE ATTEMPT to make Homer know everything, from farming to fight-ing, is like
    trying to make the sacred olive bough known as the εἰρε-στών hold apples and pears
    and other things too heavy for it. Such as is the comparison of Hipparchus, quoted
    on his poems by Strabo in defending Homer against Eratosthenes’ attacks as merely
    frivolous, fanciful entertainment (φυναγωγίας, Strabo 1.2.3). How-ever, the ancient
    skill are the arts of speech and persuasion, or what Strabo calls ρητορική φρήνης,
    “rhetorical skill,” best exemplified by Odys-ses in the Iliad (especially books
    2, 3, and 9: see Strabo 1.2.5). Homer shows the same knowledge of the other side
    of making songs and speeches—not just their creation but also their reception.
    This essay is a study, not of Homer’s readers but of Homer’s hearers—of what he
    thinks, or might think, of his audiences, actual and possible.


    The Homeric poems repeatedly depict ancient audiences listening to singers. The
    gods banqu on Olympus are entertained by Apollo and the Muses (II. 1.002f); grape
    pickers lighten their toil by joining the young boy who sings the “Linus song”
    (II. 18.56–72). In the former passage “banquet, Apollo’s “lovely lyre,” and “Muses”
    with their “beautiful voice” are joined together in a coordinate construc-tion
    as simultaneous attributes of divine happiness (1.601–04):


    > ὡς τῷ μέν πρόρόπον ἡμαρ ἕλιος καταδύντα δαιυντ, οὐδὲ δὲθυμ δαιτὸς εἰἴς

    οὐδὲν φορμμόγος περκαλλός, ἐν ἐχ᾿ ‘Ἀπολλων,",


