  md: '# INTRODUCTION


    It would be impossible to claim that we have in this book covered everything that
    is known of the ancient interpretive reading of Homer. There are countless critical
    assessments that reach us, often carrying some implied burden of interpretation.
    But there are in fact no surviving ancient readings that we can document as well
    as those presented here. Here we piece together some "other Homers"—for instance,
    "Homer the Educator," a composite figure who could be reassembled from all those
    authors who shaped their reading of the epics around the postulate that the primary
    goal of Homer was educational. Plutarch would be a primary source here, and the
    abundant evidence for understanding Homer would form a substantial basis for reconstructing
    such a reading. Moreover, the existence of a large interpretive community is demonstrated.
    There are very few dissenting voices to the proposition that Homer''s goals were
    educational, beyond the obscure Epicurean Philodemus, who seems to say, "Homer
    conversant with reality, but whether it was for the sake of education, I wonder."^41


    There are likewise critics who praise Homer and describe Homer at great length,
    and from the best of these—certain ''Longinus'' would be the first to mind—a reading
    might be extrapolated. But wonderful and as Longinus''s appreciation of the aesthetic
    qualities and imaginative scope of the text is, it does not in itself constitute
    an interpretive reading, nor is it committed to any specific position on the meaning
    of the text, such as all the comment on Homer from Roman poets and critics, who
    do we find in interpreting the poems. The sole exception be Macrobius, working
    again in the tradition of the later Platonists, whose Saturnalia the extensive
    discussion of Virgil ("your Mantuan Homer"^42) includes a good deal of interpretive
    material relating to Homer. But everything here fits into the larger category
    of Neoplatonist reading, with little that is distinctly conspicuous in the approach
    to Homer as background and precedent to Virgil.


