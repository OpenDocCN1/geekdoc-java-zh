    The curious point here is not the general tenor of Budé''s note the specific addition
    that he makes to ''Plutarch'': the offspring of a male only, Athena, rightly defeated
    the offspring of a female only, Ares. This is incorrect mythology: Ares was hardly
    a wise child, but he knew his own father. It does not come from pseudo-Plutarch.
    And Eustathius—whom Budé cites—says correctly that Athena was born of a male alone,
    ἐξ ἀνδρός μόνος, and of female as well [as a male], καὶ ἐκ γαικὸς. No manuscript
    of Eustathius would have dropped the ka, and Budé could have misconstrued the
