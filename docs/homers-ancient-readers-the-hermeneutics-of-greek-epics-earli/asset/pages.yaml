  md: '# INTRODUCTION


    its recalcitrant anonymity—the Homeric persona—was available for appropriation
    at such an early date that it would be presumumptuous to imagine that we know
    the text of any Homeric poem in a stage that predates of the earliest imitators
    and adaptors. The complexity of the interaction of archaic Greek poetic traditions
    is extraordinary.³ but what is most certain is that the Iliad and the Odyssey
    and its satellites constitute a pervasive presence throughout those traditions,
    constantly interacting with new poetic developments, constantly reread and adapted
    to new contexts. And of course the process continues beyond the archaic period,
    by way of these famous "chops" (τερεάχη) from Homer''s banquets" that Aeschylus
    served up on the Athenian stage, down through Apollonius Rhodius, Virgil, and
    beyond.


    I mention here to simply indicate why the present collection of essays is necessity
    limited to the discussion of the relatively manageable category of recoverable
    interpretive efforts of an explicit nature. The history of the interpretive rewriting
    and adaptation of the Homeric epics is roughly cohesive with that of Greek and
    then Latin literature and does not stop there. No essay is found here by Pindar,
    on the dramaticists, on Apollonius or Virgil, not because the contribution of
    those readers of Homer was unimportant in the evolution of the understanding of
    the epics, but because it was of a different nature from the contributions of
    interpreters who offered their acts of interpretation as ends in themselves (ends
    subordinated, of course, to the larger goal of the understanding of Homer) and
    not as a function of the creation of new works of literature.


    There are in fact surprisingly few readings of Homer preserved from antiquity.
    If we compare, for instance, Judaic tradition with Hellenic, the difference is
    immediately apparent—on the one hand, an entire literature of exegesis and commentary
    on authoritative archaic texts; on the other, what we might call a retic about
    interpretation. As Charles Segal''s introductory paper makes clear, however, a
    concern with the nature of audience response—the "reading" of the listeners the
    poems project as audience for heroic song—is to be traced to the epics themselves.


    > ³ The analysis of the phenomenon has taken numerous forms, ranging from the
    statistical (Richard Jankowski, Homer, Hesiod, and the Hymns) to the evocative
    of patterns of intertextual influence and competition (Pietro Pucco, Hesiod and
    the Language of Poetry and Odysseus Po-Intertextual Readings in the Odyssey and
    Iliad).


    > * By his own account, according to Athenaeus 8 347e.


    > ⁵ Gregory Nagy has recently brought new sophistication to the study of Pindar''s
    appropriation of Homer in Pindar''s Homer.'
