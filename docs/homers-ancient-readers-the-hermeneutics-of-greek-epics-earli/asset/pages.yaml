  md: '# INTRODUCTION


    Although it is manifestly not part of his program to offer a reading of Homer,
    Plato is the first author in whom we find an examination of a paradox of reading,
    coupled with a detailed critique of the epic tradition that extends from the level
    of an ontological aesthetics, by way of theology, to pedagogy. Needless to say,
    the Iliad and Odyssey are found on all levels, and it is left to the subsequent
    generation—that is, Aristotle—to redefine the terms on which the aesthetic object,
    and specifically the poetic text, may be recovered as a worthy object of philosophical
    inquiry.


    The contribution of Nicholas Richardson to this volume, “Aristotle’s Reading of
    Homer and his Background,” has by its very nature a vast, perhaps an impossible
    vast, to perform. It must bridge the gap between the audiences projected in the
    poems and readers of the third quarter of the fourth century. But although Aristotelian
    tradition itself claimed the first critic of Homer was his rival Sagarias, succeeded
    after Homer''s death by Xenophon of Colophon.¹⁰ and the less extravagant tradition
    that reached Porphyry Theogenes of whom we can date around 525, the “first to
    write on Homer,”¹¹ Aristotle remains the earliest author to devote to the explication
    of Homer book of whom we possess significant fragments. Because this book of Homeric
    Questions secured for Aristotle at the head of the tradition of Homer’s readers,
    as here defined, a look at just what it seems to have been useful.¹² We also pose
    at this point the question of continuity that has been claimed between the Homeric
