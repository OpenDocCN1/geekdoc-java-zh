    Like the Muses who inspire him, the poet of early Greece is a singer. His aim
    is to produce songs at more or less public occasions, ranging from a large panhellenic
    festival, as those at Delos and Mycale, to an affair of state such as Hieron''s
    inauguration of his newly founded city of Aetaea (commemorated in Pindar, Pythian
