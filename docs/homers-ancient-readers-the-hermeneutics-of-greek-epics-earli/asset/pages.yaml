    the encounters of Homer’s gods as favorable and unfavorable conjunctions of the
    stars named after him and asked Maestlin to date and describe them in modern,
    astronomically precise terms. Maestlin claimed to find the suggestion reasonable.
    He thought that an astrologer rather than an astronomer should do the necessary
    computation. He turned to his young protégé, who indeed served as provincial astrologer
    in Graz.


    Kepler replied by making fun of the whole enterprise. He urged Maestlin to take
    on the vast job of finding conjunctions and oppositions in Homer. “Why don’t you,”
    he asked, “read all of Homer, assign his story the firm chronological place which
    it still lacks, fix the individual colloquies to his calendar dates, do all the
    computations, and produce ephemerides for the whole twenty years?” He promised
    that if Maestlin would work out all these dates and planetary positions, he, Kepler,
