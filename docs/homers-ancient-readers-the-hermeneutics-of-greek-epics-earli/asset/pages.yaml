    In the end, the humanists'' reactions to ancient readings of Homer were far too
    complex to summed up neatly. Their intellectual project had many strands. They
    discovered the historical distance that really separated the Christian present
    from the pagan past. They reassured the spectral power, even the autonomy of classical
    poetry. But they also compiled meticulous, myth-by-myth compendium of traditional
    legacies. Their historical situation forced this range of approaches on them.
    Unlike the Alexandrian scholars, all, early modern humanists had to win their
    way gradually and with difficulty to a full knowledge of Greek literature and
    its history. Unlike the Alexandrians, most of them dealt with Homer in a variety
    of contexts: as a subject to be bored to by modern vernacular poets, and as a
    text to be safe for the classroom, as a model for imitation by a source for historical
    facts or philosophical doctrines. In many of these, it was natural to assume that
    allegories provided a trustworthy as well as useful means for deriving the right
    of sense out of Homer. Those who made this assumption when praising or teaching
    Homer to an audience of laypeople might quite different people consider when writing
    about textual or interpretive problems for an audience of scholars. Some individuals
    read Homer in radically at different times, as the logic of their situations and
    their own experience of Greek culture changed. And the potential for debate between
    individuals was considerable.


