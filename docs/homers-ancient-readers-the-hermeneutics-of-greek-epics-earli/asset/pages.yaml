    Certainly one collateral piece of evidence suggests as much. Budé’s copy of one
    of the most systematic of all Renaissance allegorical commentaries, Landino’s
    Disputations Camaldulenses (Florence, n.d.), is preservederved in la Bibliothèque
    Nationale (Rés. Z. 1059). Its margins summarize Landino''s explication of Virgil
    point by point, with single words, phrases, and occasional points held—all normally
    of interest and of often absent. But sometimes summary yields to dissent—even
    contradiction. Landino explains Mary is mental and incorruptible; Martha does
    hers with the senses, which men share with animals. That is why Mary is told that
    she has "the best part [optimum partem] shall not be taken away from her.". Budé’s
    marginal note reads, “grace noce optimam sed bonam legitur. que falso argumentaris”—In
    the Greek text the reading is ‘good,’ not ‘best.’ Their deduction is false [sig.
    c iii verso]. Elsewhere he questions Landino’s etymological explanation of the
    name Gerion as terrae litem: “but there is an eternal struggle of the earth, that,
    against the spirit." Budé in this preferred a less instructive and more accurate
    etymology: geryones enim scriptur γπηρῶ——“The spelling conflicts with this interpretation,
    since Ggeon is identified γπηρῶ [in Greek, from γπηρῶ], ‘sing’ [sig. h. verso].
    Even Landino’s allegories, in short, elicited a range of responses from Budé;
    no wonder that he did not accept the far more richly varied Homeric readings that
    he encountered in treatises, scholia, and commentaries.


    One striking feature of Budé’s response to Homer is ancient readers, then, is
    its immediacy. Like many of the great sixteenth-century historians, Budé won more
    respect than affection. His rather chilly formality emerges from the famous remark
    that he made to the servant who came to tell him, at his wife’s request, that
    their house was on fire: “Kindly inform your mistress that domestic matters are
    her affair.” His shifting and intimate responses to Homer’s gets a more flexible
    and responsive personality than the anecdote leads to expect. Do those of his
    marginal notes to pseudo-Plutarch and Homer, which take the form of Greek phrases
    or obeli but-with skilful caricatures of the faces of gloomy scholars. 47 And,
    more-interestingly still, do some of the curious sparks that the ancient readers
