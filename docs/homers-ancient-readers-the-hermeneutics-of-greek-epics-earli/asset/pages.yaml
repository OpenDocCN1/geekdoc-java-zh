    # The Neoplatonists and the Spiritualization of Homer


    # ROBERT LAMBERTON


    UP TO THIS POINT, the papers in this volume have dealt with readings of the Iliad
    and Odyssey in the major philosophical traditions of antiquity. Plato and the
    early Academy were conspicuously absent, for two reasons. First, although there
    were a great deal about Homer to be found in the dialogues of Plato, there is
    not what we could call a reading of the Iliad and Odyssey. The second reason illuminates
    the first. The stance of the dialogues towards Homer is relentlessly hostile—back-referenced
    to the “divine” Homer aside—and the reading and interpretation of poetic texts,
    and specifically of the Iliad and Odyssey, repeatedly and explicitly rejected
    as means of reaching truth. Given this orientation of the fundamental texts of
    the Platonic tradition—an orientation that constitutes the Platonic extension
    of the Presocratics'' reaction against the Homeric encyclopedia—it is surprising
    that the later pagan Platonists have so slantly violated the principles of their
    school to embrace the poetry ofHomer, along with other early hexameter poetry,
    as texts of extraordinary authority.


    That the later pagan Platonists should have a place here alongside the Peripatos
    and the Stoa is in itself something of a paradox. By contrast with those schools,
    they have suffered from the sort of opprobrium that breeds neglect. This was not
    true during the Renaissance, of course; and from the perspective of Ficino at
    the end of the fifteenth century, the extraordinarily well preserved writings
    of the Platonists of the Roman Empire, from Plotinus in the third century to Proclus
    in the fifth, and beyond, were essential keys to the meaning of the dialogues
    of Plato and to the secret doctrine they concealed. But the Enlightenment discredited
    those keys, exposed anachronisms, and surgically removed the accretions on the
    Platonic corpus with the goal of isolating and restoring the true thought of Plato,
    and putting Platonism (as distinct from Plato) in perspective.¹ Since the Enlightenment,
