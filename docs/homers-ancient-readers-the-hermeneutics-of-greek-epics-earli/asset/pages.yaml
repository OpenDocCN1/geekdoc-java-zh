  md: '# INTRODUCTION


    that has prevailed—a school of textual critics in Alexandria embarked on a fundamentally
    new and innovative attempt to recover the past in its own terms, a school that
    in some of its activities followed the intellectual lead of Aristotle and the
    Peripatos, and in Pergamum a competing school, dominated by the Stoa and hence
    inevitably committed to the by no means activity of allegorical interpretation.
    The allegorists, needless to say, were interested in recovering the past not in
    its own but in their own terms. This picture, as James Porter''s essay suggests,
    suffers from serious defects. He assembles the evidence we for Crates and paints
    the picture of a decidedly eccentric thinker, one who defies classification into
    any major school—and who, as Porter points out, is not even called a Stoic in
    the surviving literature before the tenth-century lexicon known as Suda.


    What emerges from these two innovative studies is a picture of the early Stoics
    as readers of Homer approached the poems in a manner unlike that of Strabo (who
