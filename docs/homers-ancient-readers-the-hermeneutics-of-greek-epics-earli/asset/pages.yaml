  md: '# INTRODUCTION


    existence of any larger contexts relevant to the understanding of texts. Once
    the text has been read on the level already described, it can be situated in a
    historical context (consisting largely of other texts, perhaps supplemented by
    archaeological information), and it can throw light on the thought of its author
    and on the history and values of his or her culture.


    There is certainly nothing intrinsically mistaken about this approach. With its
    long and august history, it can credibly be traced back in some of its aspects
    to the philological inquiries of Aristotle. But it is easily confused with something
    that emphatically is not, that is, a straightforward systematization—an elevation
    to the level of a science—of the acts of ordinary readers. In fact, the philological
    tradition has largely chosen to ignore the real and acute problems of reading
    and interpretation that all readers confront every day. The vast majority of readers
    dealing with texts in their own mother tongues, the vocabulary and syntax of which
    are burned into their nervous systems at a very deep level. They ask questions
    of texts that are very rarely the questions raised by the philological tradition.
    They pose problems of meaning in ways that differ from from posed by philologists.


    Each of the papers in this collection sets out to engage this problem, which the
    mainstream of scholarship has skirted. How did ancient readers deal with the Iliad
    and Odyssey, the authoritative texts standing at the beginning of Greek tradition?
    What demands did they make on them? What questions did they expect them to be
    able to yield answers? These lines of inquiry promise to throw light on two related
    issues. First, they clarify the position of the *Iliad* and *Odyssey* in the intellectual
    world of antiquity—a first chapter, to speak, in a history of the meaning of those
    poems that remains to be completed. Second, these essays throw light on the nature
    of reading itself and as such constitute a chapter in the history of reading.


    Only a small category of readers record their efforts, and not all of these do
    so in the form of explicit essays in interpretation or explicit claims about the
    meaning of texts. There is a much larger class of “readings” of Homer that reach
    us in the indirect form of rewrites, adaptations, and other modes of recycling
    Homeric material into new art. Indeed, this process starts early in the case of
