    by Jan Fredrik Kindstrand, Homer in der zweiten zeiten, Homer in der Neuheit von
    Dante by Goethe, and many other studies have traced and improved his classical
    genre. Exemplary among these are the two studies by Noemi Emmy, “Homère en France
    au xvi siècle” et Homère en France au siècle; Karl Simmons, Homer’s Original Genius:
    Eighteenth-Century Notions of the Early Greek Epic Studies that have emphasized
