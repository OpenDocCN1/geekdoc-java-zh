    reached once we recognize that a text might be called allegorical in a strong
    sense or in a weak sense.³ A text will be allegorical in a strong sense if its
    author composes with the intention of being interpreted allegically. Familiar
    examples of such texts are Dante’s *Divine Comedy*, Spenser’s *Faerie Queen*,
    and Bunyan’s *Pilgrim’s Progress*. Such texts require their reader to take them
    allegorically; they are composed as allegories. A text will be allegorical in
    a weak sense, irrespective of what its author intended, it invites interpretation
    in ways that go beyond its surface or so-called literal meaning. Examples include
    the stories of Pandora’s box in Hesiod and Adam and Eve in Genesis. Stories, as
    we read today seem to signify something general about the human condition which
    is quite other than their narrative content; but they are weak because, in these
    cases, the allegorizing is a contribution by us, the readers, and not something
