    evoking the memory of past events, brings a pleasurable forgetting of sorrows
    (Theogony 54f., 98–103).²³ Are we to see this therapeutic function of poetry put
    into practice by Homer''s Achilles? In the Odyssey song and narratives of the
    past belong to pleasure, not grief, and tears are the appropriate response to
    an after-dinner story or song.


    Giving pleasure, *τέρφος*, to his audience is obviously the Homeric first concert,
    but it is not only one. By the very fact of creating a fearful response of sadness,
    as we have seen, the Odyssey-poet also calls attention to the paradoxical pleasure
    that its tales of woe create.²⁴ In a culture where knowledge of the past is preserved
    largely through oral transmission, the bard also preserves the memory of earlier
    generations and the names of those who would otherwise be “invisible” in Hades,
    *ἀφαντο* or *αίστο*. What is what is heard on the lips of men, i.e., what the
    bard preserves in song.²⁵ Hence Homer can count on his audience''s interest in
    the catalogue of the Achaean princes and the cities they rule (II. 2.494–759).
    The generations of men are as fleeting as the growth of leaves, but Homer can
    give the generations of the Lycian Glaucus more than a seasonal life by incorporating
    him into his song (II. 6.145–211).


    In the *Odyssey* the first threat to the hero''s return is the destruction of
    memory: The Latos Eaters, the first people to be encountered beyond the familiar
    limits of Troy and the heroic world, would keep Odysseus and his men stranded
    in never-never land through amnesiac drug that would make them “forget their return”
    (*νόατου λάθσθαι*, Od. 9.97). The loss of the memory of his homeland in Circe''s
    bed will deprive him of his humanity just surely as her drugs deprive his comrades
    of their human form. The other side of that human identity is to be forgotten
    in the homeland that waits for him, to be carried off to unknown-known place “without
