    because to Medievalists and Modernists it has long been evident that the poems,
    translated into new cultural contexts, both transformed these contexts and were
    transformed by them. What these papers taken together demonstrate that this is
    a process that began very early in the history of the poems, and that the pattern
    of interaction of text and interpretation was already set by the Hellenistic period
    had had a pervasive impact on all subsequent perception of the meaning of the
    Iliad, the Odyssey, and the Troy tale.


    The papers assembled here were delivered in somewhat different form at a conference
    entitled Homer''s Ancient Readers held at Princeton University, Oct. 6–7, 1989.
    The conference was conceived as a comprehensive survey of all the ancient readers
    of the Iliad and Odyssey for which we have substantial evidence, as well as an
    overview of the influence of those readings, first in the Byzantine East and among
    many of the Renaissance in the West. The thoughtful and suggestive responses to
    individual sessions contributed by Georgia Nugent and Richard Martin, as well
    as a number of penetrating questions from the floor, both enriched the sections
    and in many instances proved useful to the participants as they revised their
    papers for publication. The remarks of David Armstrong and an anonymous reviewer
    whose advice was sought by the Magic Committee were likewise of tremendous value
    in the process of revising and editing the resultant volume. The project was formulated
    from the start to produce a volume of essays constituting a systematic introduction,
    mapping this neglected area of classical scholarship.


    All of the papers have been revised, and those covering the most systematic area
    (the Stoa) and the least explored area (the influence of the ancient interpreters
    on the Renaissance humanists) have been expanded. Thus, although the coverage
