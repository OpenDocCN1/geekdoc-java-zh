    With A. A. Long''s article in this collection, complemented by James I. Porter''s
    reassessment of Crates of Mallos, a new direction has suggested in the understanding
    of the interpretive activities of the Stoics. Careful attention to what sorts
    of interpretive moves are actually documented for the Stoa leads Long to question
    whether in fact the parodic picture we get from some passages in Cicero and from
    Plutarch and Galen is not more diatribe than description. That Stoics found phenomena,
    including the names and epithets of the gods, the objects of cult, myths, and
    the poetic texts that embodied these myths, seems clear, but if the same code
    could be said of intellectually respectable people in many cultures. What calls
    in question is whether they were, in the sense some of their critics seem to have
    claimed or in any sense at all.


    During the first half of the third century BCE, the systematic scientific and
    antiquarian study of the text of Homer (along with other archaic and classical
    Greek poetry) was found in Alexandria in the library of the Museum created by
    Ptolemy I. Our picture of the philosophical allegiances of the scholarly world
    of Hellenistic Greece has been influenced by the persistent criticism of the Stoa
    for misuse of ancient poetry. Along with any reassessment of the relationship
    of the Stoa to early poetry must go a corresponding reassessment of the intellectual
    environment of those earliest textual critics.


    The scholia of our medieval manuscripts of the Iliad and Odyssey, along with other
    evidence, make clear that, parallel to the work of the scholars of Alexandria,
    there was another center of textual criticism at Pergamum. The work of the Alexandrian
    Homer scholars culminates in that of Aristarchus the mid-second century, roughly
