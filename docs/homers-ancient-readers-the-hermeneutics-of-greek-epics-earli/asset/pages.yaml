    priestess, annoyed, says “Man, get away from our protectress of children, Homer
    asks which god she is sacrificing to. When told it is he utters anemporaneous
    prayer in verse: “Hear me, as I pray, Protectress of Children, grant that whom
    reject love and sex with young men, but let her delight in old men with grey brows
    whose strength has been blighted,”4⁸ Beside these verses Budé is not a summary
    but an expression of strong interest: a pointing hand and the words σημείῶσα ταΐτα
    τὰ ἔπῃ [note these verses]; The ancient anecdote evidently echoed his hopes—or
    fears?—about his own much younger wife, whom he married at the then ripe age of
    thirty-seven.


    This fresh and serious response to a text that now seems comic, I think, serve
    as a lesson. Budé did not need Paul Veyne to teach him to listen when the Greeks
    told stories about their heroes and traditions, however foolish an individual
    witness might seem. He knew that all branches of the ancient scholarly tradition
    had to be studied before any of them were cut off. He read Homer’s ancient readers
    with the care, the attention, and the willingness to argue that he brought to
    any other ancient text. And he found them in the same rewards and excitements
    that he found in the epics they dealt with. His approach, which most of his contemporaries
    shared, demands attention and respect. I wonder if it is merely a historian’s
    ignorance that leads me to suspect that it might repay imitation as well.


    > ⁴⁸ The translation is that of M. R. Lefkowitz, *The Lives of the Greek Poets*,
