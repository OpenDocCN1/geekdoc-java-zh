  md: '# INTRODUCTION


    Even if this egregious bit of physical allegory with its strongly Stoic flavor
    might be an intrusion into the fragmented corpus of Aristotelian readers of Homer,
    three of the other fragments also relate “solutions” we would call allegorical.
    In fact it points to an area where allegorical reading was to predominate in the
    later tradition. The first relates to the “marvel” (τέρατος) revealed by the snake
    in Aulis, and what troubled our of the Greeks here are, is the fact that unlike
    the remarkable of the snake was duly interpreted as prophetic by Calchas, the
    truly remarkable transformation of the snake into stone is left without comment.
    Aristotle provides the missing interpretation: The lithification of the snake
    represented the “slowness and toughness of the war” (fr. 145).²² The context demands
    that this element be a sign, a σημεῖον, and the interpretation offered a glaring
    omission. In another instance, the description of a supernatural object turns
    out to be characterized by an unexpected metonymy. Homer speaks of the head of
    Medina residing in Hades (Od. 11.634), but he has already located it in its traditional
    place on Athena’s aegis (Il. 5.741). Aristotle’s solution (fr. 153): “She never
    had the actual head of the Gorgon on her shield, . . . but rather the capacity
    to stun emanated from the Gorgon and affected those who looked upon her.”²³


