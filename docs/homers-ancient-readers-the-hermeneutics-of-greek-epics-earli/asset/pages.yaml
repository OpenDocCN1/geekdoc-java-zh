  md: '# * Introduction *


    # ROBERT LAMBERTON


    THE history of influence of Homer has been studied in a variety of ways, but the
    history of the meaning of the text, its interaction with perhaps hundreds generations
    of readers, has yet to be written.¹ The seven papers in this collection all contribute
    in one way or another to the project of second history.


    This is not to say that this project is without precedents. Some of the questions
    addressed here are not unfamiliar in the realm of the history of classical scholarship.
    There are, however, several points of difference between the way they are treated
    here and the way they have been treated in the past, notably by Rudolf Pfeiffer.²
    The philological tradition traced, and in which he situated himself, is based
    on a methodology approach to the problem of meaning is part explicit and in part
    implicit and largely unexamined. Its reductionist, as practical scientific inquiry
    tends to be. The meaning of a text is, for this, largely a matter of the meanings
    of words and the syntax of sentences. The first category of information is dealt
    with by lexicographers, the second by grammarians. When the reader knows the meanings
    of the words and understands the syntax of the sentence, that has yielded its
    meaning. This is not to say that the philological tradition has denied


    > ¹ For the ancient reception of Homer, even general discussion of the influence
    of the epics is lacking, though admitted the task would be so enormous that it
    would require writing a history of Greek and Latin literature from the perspective
