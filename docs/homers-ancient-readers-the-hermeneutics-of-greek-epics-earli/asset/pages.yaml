    It is clear, that with the rise of the Stoa status of interpretation changed.
    The preserved fragments of Zeno and Chrysippus frequently took positions on the
    meaning of myths, texts, and artifacts. It has long been an article of faith in
    the orthodoxy of classical scholarship that the Stoics were systematic allegorists
    of texts and that the rise of allegory to philosophical (and philological) respectability
    is to be laid at their door.^27 Several of the papers assembled laid the groundwork
    for the reassessment of this bit of received wisdom and threw new light on the
    status and scope of interpretive activities in the Stoa.

    Their adversaries and detractors accused the Stoics of willful reading and distortion
    of the meaning of early poetry cannot be disputed. Plato had adopted an adversarial
    position with regard to the "Homeric encyclopedia" and the Ionian philosophical
    tradition before him had been actively hostile (with the possible exception of
    the Pythagoreans). Aristotle certainly did not privilege Homeric accounts of things,
    except as a function of the age and attendant respectability of those accounts.
    But Stoics cited the poets and often looked at some utterances of Homer and Hesiod
    as having true value.

    This use of poetry seems, in fact, to have been a salient characteristic of the
    Stoa from the start, the just sort of characteristic that appealed, for instance,
