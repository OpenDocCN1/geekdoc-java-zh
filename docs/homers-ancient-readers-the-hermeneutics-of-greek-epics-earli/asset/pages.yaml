    The single tool, the single technique of Stoic interpretation that is most characteristic
    and most highly developed, is etiology. For both of our major anthologies of Stoic
    Allegoresis, Heraclitus'' Homeric Allegories and Cornutus''s is central and pervasive.
    Both of these collections of interpretive material are secondary, harnessing the
    interpretive theory and practice of earlier thinkers to specific goals—an introduction
    to the reading of Homer on the one hand, and an introduction to theology, or perhaps
