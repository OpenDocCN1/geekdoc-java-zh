    # WELL-KNOWN SORTING ALGORITHMS


    Sorting algorithms have a best case, average case, and worst case in terms of
    performance. Interestingly, sometimes an efficient algorithm (such as quick-sort)
    can perform the worst when a given array is already sorted.


    The following subsections contain code samples for the following well-known sort
    algorithms:


    +   * bubble sort

    * selection sort

    * insertion sort

    * merge sort

    * quicksort

    * bucket sort

    * Shell sort

    * Shell sort 108

    * heap sort

    * bucket sort

    * in-place sort

    * counting sort

    * radix sort


    If you want to explore sorting algorithms in more depth, perform an internet search
    for additional sorting algorithms.


    # Bubble Sort


    A bubble sort involves a nested loop whereby each element of an array is compared
    with the elements to the right of the given element. If an array element is less
    than the current element, the values are interchanged ("swapped"), which means
    the contents of the array will eventually be sorted from smallest to largest value.

    Here is an example:


    ```

    arr1 = np.array([40, 10, 30, 20]);

    Item = 40;

    Step 1: 40 > 10 so switch these elements:

    arr1 = np.array([10, 40, 30, 20]);

    Item = 40;

    Step 2: 40 > 30 so switch these elements:

    arr1 = np.array([10, 30, 40, 20]);

    Step 3: 40 > 20 so switch these elements:

    arr1 = np.array([10, 30, 20, 40]);

    ```'
