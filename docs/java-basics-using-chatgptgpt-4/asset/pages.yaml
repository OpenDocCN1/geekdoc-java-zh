    The key idea for this code sample involves two actions and a logical comparison,
    as listed here:


    +   1. Whenever a left parenthesis is encountered in the current string, this
    parenthesis is pushed onto a stack.


    +   2. Whenever a right parenthesis is encountered in the current string, we check
    the top of the stack to see if it equals the corresponding left parenthesis.


    +   3. If the comparison in #2 is true, we pop the top element of the stack.


    +   4. If the comparison in #2 is false, the string is unbalanced.


    Repeat the preceding sequence of steps until we reach the end of the string: if
    the stack is empty, the expression is balanced, otherwise the expression is unbalanced.


    For example, suppose we use the string my_expr is initialized as "()". The first
    character is “(”, which is a left parenthesis: step #1 tells us to push “(” onto
    our (initially empty) stack called myst. The next character in my_expr is ", which
    is a right parenthesis: step #2 in the previous list tells us to compare ")” with
    the element in the top of the stack, which is “(”. Since “(” and \)” constitute
    a balanced pair of parentheses, we pop “(” from the stack. We have also reached
    the end of my_expr, and we conclude that "()" is a balanced expression (which
    we knew).


    Now suppose that the string my_expr is initialized as "(()". The first character
    is “(”, which is a left parenthesis, and step #1 in the previous list tells us
