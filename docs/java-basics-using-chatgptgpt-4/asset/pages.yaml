    # WHAT IS COMBINATORICS?


    In simple terms, combinatorics involves finding formulas for counting the number
    of objects in a set. For example, how many different ways can books be ordered
    (i.e., displayed) on a bookshelf? The answer involves permutations, which in turn
    is a factorial value; in this case, the answer is 5! = 120.


    As a second example, suppose many different ways can you select three books from
    a shelf that contains five books? The answer to this question involves combinations.
    Keep in mind if you select three books labeled A, B, and C, then any permutation
    of these three books is considered the same (the set A, B, and C and the set B,
    A, and C are considered the same selection).


    As a third example, how many 5-digit binary numbers contain exactly three ones
    values? The answer to this question also involves calculating a combinatorial
    value. In case you''re wondering, the answer is C(5,3) = 5!/[3! *2!] = 10, provided
    that we allow for leading zeros. In fact, this is the answer to the preceding
    question about selecting different subsets of books.'
