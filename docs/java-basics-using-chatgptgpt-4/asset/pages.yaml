    # HOW DOES QUICKSORT WORK?


    The quicksort algorithm uses a divide-and-conquer approach to sort an array of
    elements. The key idea involves selecting an item in the list as the pivot item
    (which can be any item in the list) that is for partitioning the given list into
    two sublists and recursively sorting the two sublists.


    Due to the recursive nature of this algorithm, each recursion results in smaller
    sublists. Hence, the sublists eventually reach the base cases where the sublists
    have either 0 or 1 elements (which are obviously sorted).


    Another key point: one sublist contains values that are less than the pivot item,
    and the other sublist contains values that are greater than the pivot item.'
