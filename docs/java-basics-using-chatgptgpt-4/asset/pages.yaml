    # Reverse Prompts


    Another technique uses a reverse order: input prompts are answers and the response
    are the questions associated with the answers (similar to a popular game show).
    For example, given a French sentence, you might ask the model, "What English text
    might have resulted in this French translation?"


    # System Prompts Versus Agent Prompts


    The distinction between a system prompt and an agent prompt often comes up in
    the context of conversational AI systems and chatbot design.


    A system prompt is typically an initial message or cue given by the system to
    guide the user on what they can do or set expectations over the interaction. It
    serves as an introduction or a way to guide users on how to proceed. Here are
    some examples of system prompts:


    "Welcome to BotX! You can ask me about weather, news, or sports. How can I assist
    you today?"


    "Hello! For account details


    "Greetings! Type ''order'' to track your package or ''help'' for assistance.",


    By contrast, an agent prompt is a message generated by the AI model or agent in
    response to a user''s input during the course of an interaction. It’s a part of
    the back-and-forth exchange within the conversation. The agent prompt guides the
    user to provide more information, clarifies ambiguity, and nudges the user towards
    a specific action. Here are some examples of agent prompts:'
