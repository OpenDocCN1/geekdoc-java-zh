    # SHELL SORT


    The Shell sort (by Donald L. Shell) is similar to bubble sort: both algorithms
    compare pairs of elements and swap them if they are out of order. However, unlike
    bubble sort, Shell sort does not compare adjacent elements until the last iteration.
    It first compares elements that are widely separated, shrinking the size of the
    gap with each pass. In this way, it deals with elements that are significantly
    out of place early, reducing the amount of work that later passes must do.


    Listing 4.11 displays the contents of ShellSort.java that illustrates how to implement
    the Shell sort algorithm in Java.'
