    # Prompts and Completions


    A prompt is a text string that users provide to LLMs, and a completion is the
    text that users receive from LLMs. Prompts assist LLMs in completing a request
    (task), and they can vary in length. Although prompts can be any string, including
    a random string, the quality and structure of prompts affects the quality of completions.


    Think of prompts as a mechanism for giving “guidance” to LLMs, or even as a way
    to “coach” LLMs in providing desired answers. Keep in mind that the number of
    tokens in a prompt plus the number of tokens in the completion can be most 2,048
    tokens.


    # Types of Prompts


    The following bullet list contains well-known types of prompts for LLMs:


    +   - zero-shot prompts

    - one-shot prompts

    - few-shot prompts

    - instruction prompts


    A zero-shot prompt contains a description of a task, whereas a one-shot prompt
    consists of a single example for completing a task. As you can probably surmise,
    few-shot prompts consist of multiple examples (typically between 10 and 100).
    In all cases, a clear description of the task or tasks is recommended: more tasks
    provide GPT-3 with more information, which in turn can lead to accurate completions.


    T0 (for “zero-shot”) is an interesting LLM: although T0 is 16 times smaller (11GB)
    than GPT-3 (175GB), T0 has outperformed GPT-3 on language-related tasks. T0 can
    perform well on unseen NLP tasks (i.e., tasks that are new to T0) because it was
    trained on a dataset containing multiple tasks.


    The following set of links provide the Github repository for T0, a Web page for
    training T0 directly in a browser, and a 3GB version of T0, respectively: https://github.com/bigscience-workshop/t-zero


    As you can possibly, T0++ is based on T0, and it was trained with extra tasks
    beyond the set of tasks on which T0 was trained.'
