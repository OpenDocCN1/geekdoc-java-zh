    # TASK: SUBSETS CONTAINING A VALUE LARGER THAN K


    The complete description of the task is as follows: given a set of N numbers and
    a number k, find the number of subsets of N that contain at least one number that
    is larger than k. This counting is an example of a coding task that can easily
    solved as a combinatorial problem: you might be surprised to discover that the
    solution involves a single (and simple) line of code. Define the following set
    of variables:


    ```

    N = a set of numbers

    |N| = # elements in N (= n)

    NS = the non-empty subsets of N

    P(NS) = the number of non-empty subsets of N (= |NS|)

    M = the numbers (|n| | n < k) where n is an element of M

    |M| = # elements in M (= m)

    MS = the non-empty subsets of M

    P(MS) = the number of non-empty subsets of M (= |MS|)

    Q = subsets of N that contain at least one number

    larger than k

    ```


    Note that the set N is partitioned into sets Q and M, and the union of Q and M
    is N. In other words, a non-subset of N is either in Q or M, but not in both.
    Therefore, the solution to the task can be expressed as: |Q| = P(NS) - P(MS).


    Moreover, that no element in M can contain any number that is larger than k, which
    means (i.e., subset) M is an element of Q, and conversely, no element of Q is
    an element of M.


    Recall from a previous result in this chapter that a set contains elements, then
    the number of non-empty subsets is 2**m - 1. Here, the answer for this task is
    (2**m - 1) - (2**m - 1).


