  md: '# 58 * Java Basics Using ChatGPT/GPT-4


    You can generalize the previous question by asking how many 4-digit, 5-digit,
    and 6-digit numbers contain exactly 3s? The answer is the sum of these values
    (provided that leading zeros are permitted):


    C(4,3) + C(5,3) + C(6,3) = 4 + 10 + 20 = 34


    # Working With Permutations


    Consider the following task: given 6 books, how many ways can you display them
    side by side? The possibilities are listed here:


    +   - position #1: 6 choices

    - position #2: 5 choices

    - position #3: 4 choices

    - position #4: 3 choices

    - position #5: 2 choices

    - position #6: 1 choice


    The answer is 6x5x4x3x2x1 = 6! = 720. In general, if you have n books, n different
    ways that you can order them (i.e., display them side by side).


    # Working With Combinations


    Now let''s look at a slightly different question: how many ways can you select
    three books from six books? Here''s the first approximation:


    +   - position #1: 6 choices

    - position #2: 5 choices

    - position #3: 4 choices


    Since the number of books in any position is independent of the other positions,
    the first answer is 6x5x4 = 120. However, this answer is incorrect because it
    includes different orderings of three books, but the sequence of books (A,B,C)
    is the same as (B,A,C) and every recording of the letters A, B, and C.


    As a concrete example, suppose that the books are labeled book #1, book #2, ...,
    book #6, and suppose that you select book #1, book #2, and book #3. Here is a
    list of all the different orderings of three books:


    ```

    123

    132

    213

    231

    312

    321

    ```


    The number of different orderings of 3 books is 3x2x1 = 3! = 6. However, from
    the standpoint of purely selecting three books, we must treat all six orderings
    as the same. Hence the correct answer is 6x5x4/[3x2x1] = 120/6 = 20.'
