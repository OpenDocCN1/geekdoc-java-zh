    # Apple GPT


    In mid-2023 Apple announced Apple GPT, which is a competitor to ChatGPT from OpenAI.
    The actual release date was projected to be 2024. “Apple GPT” is the current name
    for a product that is intended to compete with Google Bard, OpenAI ChatGPT, and
    Microsoft Bing AI.


    In brief, the LLM PaLM-2 (discussed in the next section) powers Google Bard, and
    GPT-4 powers ChatGPT as well as Bing Chat, whereas PaLM powers Apple GPT. Ajax
    is from Google, and the name Ajax is a clear concatenation “Apple Jax” perhaps.


    # PaLM-2


    PaLM-2 is an acronym for pathways language model, and it is the successor to PaLM
    (circa 2022). PaLM-2 powers Bard and is also a direct competitor to GPT-4. By
    way of comparison, PaLM consists of 540B parameters, and it is plausible that
    PaLM-2 is a larger LLM (details of the latter are undisclosed).


    PaLM-2 provides four sub models called Gecko, Otter, Bison, and Unicorn (smallest
    to largest). PaLM-2 was trained in more than 100 languages, as well as programming
    languages such as Fortran. Moreover, PaLM-2 has been deployed to a plethora of
    Google products, including Gmail and YouTube.


    # Med-PaLM M


    In addition to the four sub models listed above, Med-PaLM2 (the successor to Med-PaLM)
    is an LLM that provides answers to medical questions, and it’s accessible here:
    http://sites.research.google/med-palm/


    The successor to Med-PaLM is Med-PaLM M, and details about this LLM are accessible
    here: https://arxiv.org/abs/2307.14334


    An article that provides a direct comparison of performance benchmarks for PaLM2
    and GPT-4 is accessible here: https://www.museof.com/google-palm-2-vs-openai-gpt-4/


    All told, PaLM-2 has a robust set of features and it’s definitely a significant
    competitor to GPT-4.


    # Claude 2


    Anthropic created the LLM Claude 2 that can not only answer queries about specific
    topics, but it also perform searches that involve multiple documents, summarize
    documents, create documents, and generate code.'
