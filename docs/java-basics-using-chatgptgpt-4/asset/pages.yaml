  md: 'ChatGPT and GPT-4 • 291


    part of 2023 Sam Altman (CEO of OpenAI) remarked that there were “no official
    plans” for GPT-5.


    However, during mid-2023 OpenAI filed a patent for GPT-5 in which there are some
    high-level details about the features of GPT-5. Some people have speculated that
    GPT-5 will be a more powerful version of GPT-4, and others suggesting that filing
    patent might be nothing more than securing the GPT-5 by OpenAI.


    Regardless of the motivation for filing a patent, there is a great deal of competition
    with GPT-4 from various companies. Therefore, it is highly plausible that OpenAI
    will release GPT-5, perhaps by the end of 2023. Regarding model sizes, recall
    that GPT-3 has 175b parameters, and speculate that GPT-4 is roughly 60 times larger
    than GPT-3. The same increase in scale for GPT-5 seems implausible because GPT-5
    would consist of 600 trillion parameters.


    Another possibility is that GPT-4 is based on MoE (mixture of experts) methodology
    that involves multiple components. For instance, GPT-4 could be a combination
    of 8 components, each of which involves 220 million parameters, and therefore
    GPT-4 would consist of 1.76 trillion parameters.


    Keep in mind that training LLMs such as GPT-4 is very costly and requires huge
    datasets for the pre-training step. Regardless of the eventual size of GPT-5,
    the training process could involve enormous costs.


