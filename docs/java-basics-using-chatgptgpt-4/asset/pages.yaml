  md: '# Java Version Numbers


    Up until Java 8, the numbering sequence had the form 1.x. Hence, Java 7 was also
    called Java 1.7, and Java 8 was called Java 8. However, this older naming convention
    has been dropped starting from Java 9. For example, if you type the command java
    -version and you have Java 13 installed on your machine, you will see something
    similar to the following output:


    ```

    java 13.0.1 2019-10-15

    Java (TM) SE Runtime Environment (build 13.0.1+9)

    Java HotSpot 64-Bit Server VM (build 13.0.1+9), mixed mode, sharing

    ```


    Aim for a solid grasp of Java 13, and then increase your knowledge by learning
    about new features that are available in versions after Java 13.


    # JRE Versus a JDK


    A JRE (Java Runtime Environment) enables you to launch Java code, which means
    that Java provides the java command-line tool. If you are on a Unix/Linux type
    of machine, type the following command:


    ```

    $ java

    ```


    The preceding command displays the following type of output:


    ```

    $ /usr/bin/java

    ```


    On the other hand, a JDK (Java Development Kit) enables you to compile and launch
    Java code. Although JRE and JDK were available as separate downloads until Java
    8, they have been merged: i.e., starting from Java 9, the Java download is the
    JDK with the JRE included.


    # Java Distributions


    There are various sites offering the Java JDK: the OpenJDK, OracleJDK, and AdoptJDK.
    The OpenJDK Project is the only site that contains the Java source code.


    Oracle provides OpenJDK, which is free to use for your Java applications. Updates
    for older versions are not supported: for example, as Java 12 were discontinued.
    Oracle also provides OracleJDK, which is free to use only during development:
    if you deploy your code to a production environment, you must pay a fee to Oracle
    (which will provide you with additional support).


    Starting from 2017, you can also use AdoptJDK, which was developed by various
    developers and vendors, and is freely available (just like OpenJDK).'
