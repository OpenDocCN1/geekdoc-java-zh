    execution, which is represented by “big O” notation. There are three types of
    time complexity: best case, average case, and worst case. Keep in mind that an
    algorithm with a very good “best case” performance can have a relatively poor
    worst case performance.


    Recall that O(n) means that an algorithm executes in linear time because its complexity
    is bounded above and below by a linear function. For example, if three algorithms
    require 2*n, 5*n, or n/2 operations, respectively, then all of them have O(n)
    complexity.


    Moreover, if the best, average, and worst time for a linear search is 1, n/2,
    and n operations, respectively, then those operations have O(1), O(n), and O(n),
    respectively. In general, if there are two solutions T1 and T2 for a given task
    T2 is more efficient than T1, T2 requires less time or less memory. For example,
    if T1 is an iterative solution for calculating Fibonacci numbers and T2 involves
    a recursive solution, then T1 is more efficient than T2 in terms of time, but
    T1 also requires an extra array to store intermediate values.


    The time-space trade-off refers to reducing either the amount of time or the amount
    of memory that is required for executing an algorithm, which involves choosing
    one of the following:


    +   - execute in time and less memory

    - execute in more time and less memory


    Although reducing both time and memory is desirable, it’s also a more challenging
    task. Another point to keep in mind is the following inequalities (logarithmic
    can be in any base that is greater than or equal to 2) for positive integer n
    > 1:


    O(log n) < O(n) < O(n*log n) < O(n^2)


    In addition, the following inequalities with powers of n, powers of 2, and factorial
    values are also true:


    O(n**2) < O(n**3) < O(2**n) < O(n!)


    If you are unsure about any of the preceding inequalities, perform an online search
    for tutorials that provide the necessary details.


