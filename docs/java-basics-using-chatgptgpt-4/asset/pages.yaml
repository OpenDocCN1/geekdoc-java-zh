    # WORKING WITH 2D ARRAYS


    A two-dimensional array in Java is a two-dimensional construct whose elements
    are homogeneous (i.e., mixed data types are not permitted). Given two arrays A
    and B, you can add or subtract them, provided that they have the same number of
    rows and columns.


    Multiplication works differently: if A is an mxn matrix you want to multiply (on
    the right of A) by B, B must be an nxm matrix. The rule for matrix multiplication
    is as follows: the number of columns of A must equal the number of rows of B.


    In addition, the transpose of matrix A is another matrix At that the rows and
    columns are interchanged. If A is an mxn matrix then At is an nxm matrix. The
    matrix A is symmetric if A = At. The matrix A is the identity matrix if the values
    in the main diagonal (upper left to lower right) are 1 and the other values are
    0. The matrix A is invertible if there is a matrix B such that A*B=B*A=I. Based
    on the earlier discussion regarding the product of two matrices, both A and B
    must be square matrices with the same number of rows and columns.


    Now that you understand some of the rudimentary operations with strings, the following
    subsections illustrate how to perform various tasks on matrices in Java.'
