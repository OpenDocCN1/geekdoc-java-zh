  md: "# 162 * Java Basics Using ChatGPT/GPT-4\n\nOnce again, a node in a doubly linked\
    \ list can be one of the following three types:\n\n+   1) the \"root\" node\n\
    2) an intermediate node\n3) the last node (no next element)\n\nOf course, when\
    \ a linked list is empty, the nodes in the preceding list are all None.\n\n# APPENDING\
    \ A NODE IN A DOUBLY LINKED LIST\n\nWhen you create a linked list, you must always\
    \ check if the root node is empty; if so, you create a root node, otherwise append\
    \ the new node to the last node. Let's translate the preceding sentence into pseudocode\
    \ that describes how to add an element to a linked list.\n\nLet ROOT be the root\
    \ node (initially NULL) of the linked list\nLet LAST be the last node (initially\
    \ NULL) of the linked list\nLet NEW be a new node with NEW->next = NULL AND NEW->prev\
    \ = NULL\n\n```\n# decide where to insert the new node:\nif (ROOT == NULL)\n{\n\
    \  ROOT = NEW;\n  ROOT->next = NULL;\n  ROOT->prev = NULL;\n\n  LAST = NEW;\n\
    \  LAST->next = NULL;\n  LAST->prev = NULL;\n}\nelse\n{\n  NEW->prev = LAST;\n\
    \  LAST->next = NEW;\n  NEW->next = NULL;\n  LAST = NEW;\n}\n```\n\nThe last node\
    \ in a doubly linked list always points to a null element.\n\n# Java Code for\
    \ Appending a Node\n\nListing 5.10 displays the contents of AppendDLNode.java\
    \ that illustrates a better way to create a linked list and append nodes to that\
    \ list."
