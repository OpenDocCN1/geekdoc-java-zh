    # # SEARCH AND SORT ALGORITHMS


    The first half of this chapter provides an introduction to some well-known search
    algorithms, followed by the second half that discusses various sorting algorithms.


    The first section of this chapter introduces search algorithms such as linear
    search and binary search, that you can use when searching for an item (which can
    be numeric or character-based) in an array. A linear search is inefficient requires
    an average of n/2 (which has complexity O[n]) comparisons to determine whether
    or not the search element is in the array, where n is the number of elements in
    the list or array.


    By contrast, a binary search requires O (log n) comparisons, which is vastly more
    efficient with larger sets of items. For example, if an array contains 1,024 items,
    most ten comparisons are required to find an element because 2**10 = 1024, so
    log(1024) = 10 (using base 2). However, a binary search algorithm requires a sorted
    list of items.


    The second part of this chapter discusses some well-known sorting algorithms,
    such as the bubble sort, selection sort, insertion sort, the merge sort, and the
    quicksort that you can perform on an array of items.


