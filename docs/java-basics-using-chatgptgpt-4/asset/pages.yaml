    # Prompt Templates


    Prompt templates are predefined formats or structures used to instruct a model
    or system to perform a specific task. They serve as a foundation for generating
    prompts, where certain parts of the template can be filled in or customized to
    produce a variety of specific prompts. By way of analogy, prompt templates are
    the counterpart to macros that you can define in some editors.


    Prompt templates are especially useful when working with language models, as they
    provide a consistent way to query the model across multiple tasks or data points.
    In particular, prompt templates can make it easier to:


    +   - ensure consistency when querying a model multiple times

    - facilitate batch processing or automation

    - reduce errors and variations in how questions are posed to the model


    For an example, suppose you''re working with an LLM and you want to translate
    English sentences into French. An associated prompt template could be the following:


    > “Translate the following English sentence into French: {sentence}"


    Note that {sentence} is a placeholder that you can replace with any English sentence.


    You can use the preceding template to generate specific prompts:


    +   - “Translate the following English sentence into French: ''Hello, how are
    you?’

    - “Translate the following English sentence into French: ''I love ice cream,’'
