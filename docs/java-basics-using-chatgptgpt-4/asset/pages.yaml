  md: '# Llama-2 Architecture Features


    This section contains a high-level list of some of the important distinguishing
    features of LlaMa-2, as shown here:


    +   - decoder-only LLM

    - better pretraining

    - improved model architecture

    - SwIGLU activation function

    - different positional embeddings

    - GQA (grouped query attention)

    - Ghost Attention (GAtt)

    - RLHF and PPO

    - BPE SentencePiece tokenizer

    - modified normalization step


    The majority of LLMs contain the layer normalization that is in the original transformer
    architecture. By contrast, LlaMa uses a simplified alternative that roots mean
    square layer normalization (as RMSNorm). RMSNorm has yielded improved results
    for training stability as well as for generalization.


    Although SwIGLU is computationally more expensive than the ReLU activation function
    part of the original transformer architecture, SwIGLU achieves better performance.


    Note that RLHF is discussed in Chapter 5, which also includes a brief description
    of TRPO and PPO. For a detailed description of how to fine tune Llama-2 on three
    tasks, navigate to the following link:


    https://www.anyscale.com/blog/fine-tuning-llama-2-a-comprehensive-case-study-for-tailoring-models-to-unique-applications


    # Fine Tuning LlaMa-2


    Although Llama-2 is an improvement over its predecessor LlaMa, you can improve
    the performance of Llama-2 by performing some fine tuning of this LLM.


    https://medium.com/@nurturza753/using-llama-2-0-faiss-and-langchain-for-question-answering-on-your-own-data-682241488476


    The following article shows how to fine tune Llama-2 in a Google Collaboratory
    notebook:


    https://towardsdatascience.com/fine-tune-your-own-llama-2-model-in-a-colab-notebook-df8b23d0a432


    The following article describes how to use MonsterAI (also discussed in the article)
    in order to fine tune Llama-2 in five steps:


    https://blog.monsterai.ai/how-to-fine-tune-llama-2-lm/'
