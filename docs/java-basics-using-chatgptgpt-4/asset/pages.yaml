    This covers the portion of the chapter pertaining to queues. The remainder of
    this chapter discusses the stack data structure, which is based on a LIFO (last-in-first-out)
    structure instead of a FIFO structure.


    # WHAT IS A STACK?


    In general terms, a stack consists of a collection of objects following the LIFO
    principle. By contrast, a stack follows the LIFO principle.


    As a simple example, consider an elevator that has one entrance: the last person
    who enters the elevator is the first who exits the elevator. Thus, the order in
    which people exit an elevator is the reverse of the order in which people enter
    an elevator.


    Another analogy that might help you understand the concept of a stack is the stack
    of plates in a cafeteria:


    +   - A plate can be added to the top of the stack if the stack is not full.

    - A plate can be removed from the stack if the stack is not empty.


    Based on the preceding observations, a stack has a maximum size MAX and a minimum
    size of 0.


    # Use Cases for Stacks


    The following list contains use applications and use cases for stack-based structures:


    +   - recursion

    - keeping track of function calls

    - evaluation of expressions

    - reversing characters

    - servicemen hardware interrupts

    - solving combinatorial problems using backtracking


    # Operations With Stacks


    Earlier in this chapter you saw Java methods to perform operations on queues;
    in an analogous fashion, we can define a stack in terms of the following methods:


    +   - isEmpty() returns True if the stack is empty

    - isFull() returns True if the stack is full'
