    30x29x28...x19/[12x11...x21]


    +   * 30x29x28...x19x18x17x16...x21 /[12x11...x21 * 18x17x16...x21]

    * 30!/[11! * 18!]


    The general formula for calculating the number of ways to select k books from
    n books is n!/[k! * (n-k)!], which is denoted by the term C(n, k). If we replace
    k by n-k in the preceding formula we get this result:


    ```

    n!/(n-k)! * (n-(n-k))! = n!/(n-k)! * k!) = C(n, k)

    ```


    Notice that the left side of the preceding snippet equals C(n, n-k), and therefore
    we have shown that C(n, n-k) = C(n, k).


    # THE NUMBER OF SUBSETS OF A FINITE SET


    In the preceding section, if we allow k to vary from 0 to n inclusive, we are
    effectively looking at all possible subsets of a set of n elements, and the number
    of such sets equals 2^n. We can derive the preceding result in two ways.


    Solution #1.


    The first way is the shortest explanation (and might seem clever hand waving)
    and it involves visualizing a row of n books. In order to find every possible
    subset of those books, we need only consider that there are two actions for the
    first position: either the book is selected or it is not


    Similarly, there are two actions for the second position: either the second book
    is selected or it is not. In fact, for every book in the set of n books there
    are the same two choices. Keeping in mind that the selection (or not) of a book
    in a given position is independent of the selection of the books in every other
    position, the number of possible choices equals:


    2x2...x2 (n times) = 2^n.


    Solution #2.


    Recall the following formulas from algebra:


    ```

    (x+y)^2 = x^2 + 2*x*y + y^2

    * C(2,0)*x^2 + C(2,1)*x*y + C(2,2)*y^2

    ```'
