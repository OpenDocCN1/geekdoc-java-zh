  md: 'Regarding primitive types: Java provides eight primitive data types that are
    keywords in the language:


    +   - byte: 8-bit signed two''s complement integer

    - short: 16-bit signed two''s complement integer

    - int: 32-bit signed two''s complement integer

    - long: 64-bit signed two''s complement integer

    - float: single-precision 32-bit IEEE 754 floating point

    - Boolean: either true or false

    - char: single 16-bit Unicode character


    In most cases, the code samples involving arithmetic calculations in this book
    use integers and floating-point numbers.


    # Java Comments


    Java supports one-line comments as well as multi-line comments, both of which
    are shown here:


    ```

    // this is a one-line comment

    * this is a multi-line comment

    * that uses a C-style syntax

    // and can include the one-line comment style

    */

    ```


    However, Java does not support nested comments (and neither does C++), so this
    is an error:


    ```

    * start of first comment /* start of second comment */ / end of first /* */

    ```


    Based on the earlier examples, the following syntax is correct for a comment:


    ```

    * start of first comment // start of second comment end of first /* */

    ```


    # Java Operators


    Java supports the usual set of arithmetic operators, (exponentiation has higher
    priority than multiplication * and division /, both of which have higher priority
    than addition + subtraction). In addition, Java supports the following operators:


    +   - arithmetic operators: +, -, *, /, ++, --

    - assignment operators: +=, -=, *=, /=, &=, =, <=, >=, ^=, and =\!

    - bitwise operators: &, |, ~, and ~

    - Boolean operations: and, or, not, and xor

    - logical operators: && ||, and !

    - relational operators: ==, !=, >, >=, < and ='
