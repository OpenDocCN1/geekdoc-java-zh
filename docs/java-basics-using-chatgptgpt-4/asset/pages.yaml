    # INFIX, PREFIX, AND POSTFIX NOTATIONS


    There are three well-known and useful techniques for representing arithmetic expressions:
    infix notation, prefix notation, and postfix notation.


    Infix notation involves specifying operators *between* their operands, which is
    the typical way we write arithmetic expressions (example: 3+4*5).


    Prefix notation (also called Polish notation) involves specifying operators *before*
    their operands. For example, the infix expression 3+4 has the sequence + 3 4 as
    its equivalent prefix expression.


    Postfix notation (also called reverse Polish notation) involves specifying operators
    *after* their operands, examples of which are here:


    ```

    4*5 becomes 4 5 *

    a*b - c*d becomes a b c d *

    a*b - (c + d) becomes a b c d +

    3+4*5 becomes 3 4 5 *

    ```


    You can use a stack to perform operations on postfix operations that involve pushing
    numeric (or variable) values onto a stack, and when a binary operator is found
    in the postfix expression, apply that operator to the top two elements from the
    stack and replace them with the resulting operation. As an example, let''s look
    at the contents of a stack that calculate the expression 3+4*5 whose postfix expression
    is


    +   Step 1: push 3

    3

    Step 2: push 4

    4

    3

    Step 3: push 5

    5

    4

    3

    Step 4: apply * to the two top elements of the stack

    20

    3'
