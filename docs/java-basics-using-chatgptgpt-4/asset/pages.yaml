    # Parsing Strings in Java


    Java supports command-line arguments, which enables you to launch programs from
    the command line with different command line values. Compare Java strings with
    the equals() method to determine whether or not the values are equal. Although
    some languages compare strings via "=", in Java the "=" only compares the two
    references (not the values) of two strings.


    Use the parseInt() method to (attempt to) convert a string to an integer:

    num = Integer.parseInt("1234");


    Use the substring() method to split a string with white space characters:

    String[] numArray = aString.split("\s+");


    The regular expression \s+ matches one or more occurrences of various white space
    characters, including "", "t", "r", and "n".


    The following code snippet reverses a Java string via the StringBuilder:

