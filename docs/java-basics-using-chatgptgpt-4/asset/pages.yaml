    This chapter introduces you to queues and stacks that were briefly introduced
    in Chapter 4 in the section pertaining to linear data structures.


    The first part of this chapter explains the concept of a queue, along with Java
    code samples that show you how to perform various operations on a queue. Some
    of the code samples also contain built-in functions for queues, such as isEmpty(),
    isFull(), push(), and dequeue().


    The second part of this chapter explains the concept of a stack, along with Java
    code samples that show you how to perform various operations on a stack. In addition,
    you will see code samples for finding the largest and smallest elements in a stack
    and reversing the contents of a stack.


    The final section contains three interesting tasks that illustrate the usefulness
    of a stack data structure. The first task determines whether or not a string consists
    of well-balanced round parentheses, square brackets, and curly braces. The second
    task parses an arithmetic expression that can perform addition, subtraction, multiplication,
    or division, as well as any combination of these four arithmetic operations. The
    third task converts infix notation to postfix notation.


    # WHAT IS A QUEUE?


    A queue consists of a collection of objects that uses the FIFO (first-in-first-out)
    rule for inserting and removing items. By way of analogy, consider a toll booth:
    the first vehicle arrives is the first vehicle to pay the necessary toll, and
    it''s also the first vehicle to exit the toll booth. Another analogy, consider
    customers standing in a line (which in fact is a queue) in a bank: the person
    at the front of the queue is the first person to approach an available teller.
    The “back” of the queue is the person at the end of the line (i.e., the last person).


    A queue has a maximum size MAX and a minimum size of 0. In fact, we can define
