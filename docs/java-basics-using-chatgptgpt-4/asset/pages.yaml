    # Poorly Worded Prompts


    When crafting prompts, it''s crucial to be as clear and specific as possible to
    guide the response in the desired direction. Ambiguous or vague prompts can lead
    to a wide range of responses, many of which might not be useful or relevant to
    the user’s actual intent.


    Moreover, poorly worded prompts are often vague, ambiguous, or too broad, and
    can lead to confusion, misunderstanding, or non-specific responses from AI models.
    Here’s a list of examples:


    “Tell me about that.”


    Problem: Too vague. What “thing” is being referred to?


    “Why did it happen?”


    Problem: No context. What event or situation is being described?


