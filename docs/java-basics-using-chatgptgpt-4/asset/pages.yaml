    # WHAT IS GENERATIVE AI?


    Generative AI refers to a subset of artificial intelligence models and techniques
    that are designed to generate new data samples that are similar in nature to a
    given set of input data. The goal is to produce content or data that wasn''t part
    of the original training set but is coherent, contextually relevant, and in the
    same style or structure.


    Generative AI stands apart in its ability to create and innovate, as opposed to
    merely analyzing or classifying. The advancements in this field have led to breakthroughs
    in creative domains and practical applications, making it a cutting-edge area
    of AI research and development.


    # Key Features of Generative AI


    The following bullet list contains key features of generative AI, followed by
    a brief description for each bullet item:


    +   - data generation

    - synthesis

    - learning distributions'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# 252 • Java Basics Using ChatGPT/GPT-4


    Data generation refers to the ability to create new data points that are not part
    of the training data but do resemble it. This can include text, images, music,
    videos, or any other form of data.


    Synthesis indicates that generative models can blend various inputs to generate
    outputs that incorporate features from each input, like merging the styles of
    two images.


    Learning distributions means that generative AI aim to learn the probability distribution
    of the training data so they can produce new samples from that distribution.


    # Popular Techniques in Generative AI


    Generative adversarial networks (GANs): GANs consist of two networks, a generator
    and a discriminator, that are trained simultaneously. The generator tries to produce
    fake data, while the discriminator tries to distinguish between real data and
    fake data. Over time, the generator gets better at producing realistic data.


    Variational autoencoders (VAEs): VAEs are probabilistic models that learn to encode
    and decode data in a manner such that the encoded representations can be used
    to generate new data samples.


    Recurrent neural networks (RNNs): RNNs are used primarily for sequence generation
    such as text or music.


    # What Makes Generative AI Different


    Creation versus classification: While traditional AI models aim to classify input
    data into predefined categories, generative models aim to create new data.


    Unsupervised Learning: Many generative models, especially GANs and VAEs, operate
    in an unsupervised manner, meaning they don''t require labeled data for training.


    Diverse outputs: Generative models can produce a wide variety of outputs based
    on learned distributions, making them ideal for tasks like art generation, style
    transfer, and more.


    Challenges: Generative AI poses unique challenges, such as mode collapse in GANs
    or ensuring the coherence of generated content.


    Furthermore, there are numerous areas that involve generative AI applications,
    some of which are listed in the following bullet list:


    +   - art and music Creation

    * data augmentation

    * style transfer

    * text generation

    * image synthesis'
