    A singly linked list is a collection of data elements, which are commonly called
    nodes. Nodes contain two things:


    +   - a value that is stored in the node

    - the location of the next node (called its successor)


    By way of analogy, think of a conga line of dances: each dancer is a node, and
    the dancer places his or her hands on the hips of another dancer: the latter dancer
    is the location of the next node.


    Unlike arrays, linked lists are dynamically created on an as-needed basis. Moreover,
    the preceding analogy makes the following point clear: there is a “last” node
    that does not have a node. Thus, the last node in a list has None as its successor
    (i.e., the next node).


    In general, a node in a singly linked list can be one of the three types:


    +   - “root” node

    - an intermediate node

    - the last node (no element)


    Of course, when a linked list is empty, the nodes in the preceding list are not
    initialized.


    # Tradeoffs for Linked Lists


    Every data structure has tradeoffs, which is to say, advantages and disadvantages.
    In particular, linked lists have the following advantages:


    +   - easy to append an element to a list

    - easy to insert an element to a list

    - easy to delete an element to a list

    - the number of items in the list is not required in advance


    Unlike arrays, the operations in the preceding bullet items do not require “shifting
    over” the elements of an array; only the pointers are updated.


    However, linked lists do have disadvantages:


    +   - more difficult (time-consuming) to search for an element

    - a larger amount of memory is required


    Thus, arrays work better when the number of elements is known in advance and there
    are no insertions or deletions (only updates), whereas linked lists work better
    when the number of data elements is not known in advance.


    Unlike arrays, the elements of a linked list can be stored in noncontiguous memory
    locations: the value of the next field provides the location of the next node
    in the linked list (except for the LAST node that has None as its next node).'
