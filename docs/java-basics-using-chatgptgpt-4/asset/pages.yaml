    # RECURSION AND COMBINATORICS


    This chapter introduces you to the concept of recursion, along with various Java
    code samples, and then an introduction to concepts in combinatorics, such as combination
    and permutations of objects.


    The first part of this chapter discusses recursion, which is the most significant
    part of the chapter. The code samples include finding the sum of arithmetic series
    (e.g., the numbers from 1 to n), calculating the sum of a geometric series, calculating
    factorial values, and calculating Fibonacci numbers. Except for the iterative
    solution to Fibonacci numbers, these code samples do not involve data structures.
    However, the examples provide a foundation for working with recursion.


    If you are new to recursion or if you need to struggle with algorithms that involve
    recursion, here is a suggestion: find some basic tasks that have iterative solutions
    and solve those tasks via recursive solutions. The effort in finding recursive
    solutions will provide some useful practice and assist you in becoming more comfortable
    with recursion.


    The second part of this chapter discusses combinatorics, such as permutations
    and combinations. Note that a thorough coverage of combinatorics can fill an entire
    undergraduate course in mathematics, whereas this chapter contains only some rudimentary
    concepts.


    If you are new to recursion, some of this material might be slightly daunting,
    but not be alarmed. Usually, several iterations of reading the material and code
    samples will lead to a better understanding of recursion.

    Alternatively, you can skip the material in this chapter until you encounter code
    samples later that involve recursion. Chapter 3 contains a code sample for binary
    search that uses recursion, and another code sample that uses an iterative approach,
    so you can skip the recursion-based example for now. However, if you plan to learn
    about trees, then you definitely need to learn about recursion, which is the basis
    for all the code samples in Chapter 5 that perform various tree-related examples.'
