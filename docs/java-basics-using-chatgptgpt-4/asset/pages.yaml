    # Linear Data Structures


    Linear data structures are data structures whose elements occur in sequential
    memory locations or are logically connected, as stacks and queues. As you will
    see in Chapter 6, stacks are last-in-first-out (LIFO) data structures, which means
    that the last element inserted is the first element removed. Moreover, operations
    are performed from one end of the stack. A real-life counterpart to a stack is
    an elevator that has a single entrance that is also the exit.


    In Chapter 7, you will learn about queues, which are FIFO data structures, which
    means the first element inserted is the first element removed. In contrast with
    a stack, insert operations are performed at the called “front” of the queue and
    delete operations are performed at the “rear” of the queue. A real-life counterpart
    to a queue is a line of people waiting to purchase tickets to a movie.


    # Nonlinear Data Structures


    Nonlinear data structures are data structures whose elements are not sequential,
    such as trees and graphs. As you will see in Chapter 7, trees have a single node
    called the root node that has no parent node, whereas every other node has exactly
    one parent node. Two nodes are related if there is an edge connecting the two
    nodes. In fact, the nodes in a tree have a hierarchical relationship. As you will
    see in Chapter 7, trees can have undirected edges, directed edges, and cycles.


    A graph is a generalization of a tree, and nodes in a graph can have multiple
    parent nodes. Moreover, a graph does not have a root node: instead, a graph can
    have a “source” and a “sink” that are somewhat analogous to a “start” node and
    an “end” node. This designation appears in graphs that represent transport'
