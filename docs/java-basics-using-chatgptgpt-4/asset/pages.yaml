    # TYPES OF DATA STRUCTURES


    This section introduces you to the concept of linear data structures (stacks and
    queues) and nonlinear data structures (trees and graphs), some of which are discussed
    in Chapters 5, 6, and 7. These chapters indicate the tasks for which those data
    structures are well suited (e.g., inserting new elements or finding existing elements).
