    +   - isEmpty() returns True if the queue is empty

    - isFull() returns True if the queue is full

    - queueSize() returns the number of elements in the stack

    - add(item) adds an element to the back of the queue if the queue is not full

    - dequeue() removes the front element of the queue if the queue is not empty


    In order to ensure that there is no underflow (empty) or overflow (full), we must
    always invoke isEmpty() before "popping" an item from the top of the front of
    a queue and always invoke isFull() before "pushing" (appending) an item as the
    last element of a queue.


    # Types of Queues


    The following list types of queues that can be created, most of which are extensions
    of a generic queue, followed by a brief description:


    +   - queue

    - circular queue

    - dequeue

    - priority queue


    A queue is a linear list that supports deletion from one end and insertion at
    the other end. A queue is a FIFO, just like a line of people waiting to enter
    a movie theater or a restaurant; the first person in line enters first, followed
    by the second person in line, and so forth. The term refers to adding an element
    to a queue, whereas dequeue refers to removing an element from a queue.


    A circular queue is a linear list with the following constraint: the last element
    in the queue "points" to the first element in the queue. A circular queue is also
    called a ring buffer. By way of analogy, a conga line is a queue: if the person
    at the front of the queue is "connected" to the last person in the conga line,
    a circular queue has been created.


    A dequeue is a linear list that is also a double ended queue in which insertions
    and deletions can be performed at both ends of the queue. In addition, there are
    two types of queues:


    +   - Input restricted means that insertions occur only at one end.

    - Output restricted means that deletions occur only at one end.


    A priority queue is a queue that allows for removing and inserting items in any
    position of the queue. For example, the scheduler of the operating system of your
    desktop and laptop uses a priority queue to schedule programs for execution. Consequently,
    a higher priority task is executed before a lower priority task.


    Moreover, after a priority queue is created, it''s possible for a higher priority
    task to arrive in this scenario, that new and higher priority task is inserted
