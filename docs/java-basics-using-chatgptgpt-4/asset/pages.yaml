    # Binary Search Walk-Through


    A binary search requires a sorted array and can be implemented via an iterative
    algorithm as well as a recursive solution. The key idea involves comparing the
    middle element of an array of sorted elements with a search element. If they are
    equal, then the item has been found; if the middle element is smaller than the
    search element, repeat the previous step with the right half of the array; if
    the middle element is larger than the search element, repeat the previous step
    with the left half of the array. Eventually the element will be found (if it appears
    in the array) or the repeated splitting of the array terminates when the subarray
    has a single element (i.e., no further splitting can be performed).


    Let''s perform a walk-through of a binary search that searches for an item in
    a sorted array of integers.


    Example #1: let item = 25 and arr = {10,20,25,40,100}, so the midpoint of the
    array is 3. Since arr[3] == item, the algorithm terminates successfully.


    Example #2: let item = 25 and arr = {1,5,10,15,20,25,40}, which means that the
    midpoint is 4.


    +   First iteration: arr[4] < item, we search the array [20,25]

    Second iteration: the midpoint is 1, and the corresponding value is 25.

    Third iteration: 25 and the array is the single element [25], which matches the
    item.


    Example #3: item = 25 and arr = [10, 20, 40, 100,150,400], so the midpoint is
    4.


    +   First iteration: arr[4] > 25, we search the array [10,20,25]

    Second iteration: the midpoint is 1, and the corresponding value is 20.

    Third iteration: 25 and the array is the single element [25], which matches the
    item.


    Example #4: item = 25 and arr = [1,5,10,15,20,30,40], so the midpoint is 4.


