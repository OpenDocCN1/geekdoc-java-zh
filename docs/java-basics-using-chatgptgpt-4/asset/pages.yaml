    GitHub Copilot is already known for its ability to generate blocks of code within
    the context of the program. In addition, Microsoft is developing Microsoft 365
    Copilot, however, the availability date has not been announced as of mid-2023.


    However, Microsoft has provided early demos that show some of the capabilities
    of Microsoft 365 Copilot, which includes automating tasks such as:


    +   - writing emails

    - summarizing meetings

    - making PowerPoint presentations


    Microsoft 365 Copilot can analyze data in Excel spreadsheets, insert AI-generated
    images in PowerPoint, and generate drafts of cover letters. Microsoft has also
    integrated Microsoft 365 Copilot into some of its existing products, such as Loop
    and OneNote.


    According to the following article, Microsoft intends to charge USD 30 per month
    for Office 365 Copilot:

    https://www.extremetech.com/extreme/microsoft-to-charge-30-per-month-for-powered-apps


    Copilot was released in 2022, which is described here:

    https://thakkarparth07.github.io/copilot-explorer/posts/copilot-internals


    The following article shows how to create a GPT-3 application that uses NextJS,
