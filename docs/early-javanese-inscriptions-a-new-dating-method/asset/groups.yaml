  - '[PAGE 19]


    time being set relative to this point, in terms of its distance East or West of
    Greenwich. Thus clock time in Paris is normally one hour ahead of London and Sydney
    clock time is normally ten hours ahead of London (daylight-saving apart).


    A similar procedure was used in Southeast Asia, whereby the “prime meridian” (the
    zero point for the reckoning) was taken to be Ujjain. In accordance with this
    convention we have plotted times in our diagrams by reference to some arbitrary
    point in Central Java. To the uninitiated this may appear to to be either pedantic
    or obtuse—until it is recognised that when a system has a fixed point (a “prime
    meridian”), then times for any other place East or West of it can easily be calculated
    by applying the time difference. This is standard procedure.


    If it desired to convert Ujjain time (at 75°E) to a time valid for, 110°E, it
    is merely required that 2 hrs 20 mins (or 5h50) be added to the Ujjain time. And
    one needs to remember always that a conversion from Ujjain time to clock time
    requires 6 hours be added to the clock. Thus nakṣatra Ārdrā is shown as ending
    at 0h 17 (Ujjain time). In clock time at 110°E this is


    0gh17 x 0.4 = 0 hrs 48 secs, plus 2 hrs 20 mins = 2 hrs 26 mins 48 secs, plus
    6:00 hours gives 8:27 a.m. (rounded upwards).¹


    A secondary point may be made here, which is that we are interested largely in
    the relative dispositions of the pañcānga elements, and these are not affected
    by geographic timedifference. No change in their relative positions would be effected
    by converting all times to Java Local Time.


    > ¹² The value 0.4 is merely shorthand for dividing by 60 (ghatika) and multiplying
    by 24 (hours).'
