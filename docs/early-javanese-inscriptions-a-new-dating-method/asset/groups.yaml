    Nakshatra 15: Swāti is a long way out of place. While we are not competent to
    decide whether there has been an editorial misreading, we point out that for 5
    waning of Bhadrawa nakshatra value of 15: Swāti is entirely and blatantly impossible.
    The point is easily made: nakshatra Swāti has a lower bound of 186° and the nakshatra
    actually indicates... was Rohini, which has an upper bound of 53°. Someone, at
    some stage, must have defined the nakshatra of date by first determining a numerical
    value for the current elongation of the moon from the sun. This longitudinal value
    would then be converted into a nakshatra value, simply by dividing by 12. It is
    most unlikely that the person doing the calculations would arrive at a numerical
    value of 185 plus when the true value was 53 minutes. Though error at source cannot
    be discounted, in the light of the overall competence of the calendrists, the
    balance of probability tells against it. We consider, further, that it is only
    our modern unfamiliarity with the nakshatra system (ancients of the highest importance
    in determining the auspiciousness of events) that has allowed discrepancies of
    this kind to go unobserved.


