    with astronomical 9 waning (15 plus 9). Our inscription, on the other hand, declares
    that karana is Bava, the first half of tithi 11 waning (no. 26.1).


    Since we appear to have an anomaly here, let us re-examine our procedure. Our
    provisional sun-moon distance of 286° is too small, since karana 26.1: Bava does
    not begin until the sun-moon distance is 301°.^11


    > ¹10 In considering South East Asian notation at large it is necessary to constantly
    on the alert as to whether the count begins at or whether it begins at one. There
    is also the question as to whether the count is inclusive or exclusive. Cf Western
    usage, where a French vacation might comprise ''quinze jours'' (fifteen days),
    and an English holiday would comprise a ''fortnight'' (fourteen nights).


    We can satisfy this constraint and still also satisfy the constraints that the
