    # THE EVIDENCE REVIEWED


    In this section, using Damais’ text, we give emphasis to the pañcacaṅga elements
    in the inscriptions, where they have a material bearing on how the inscription
    should (or might) be read.


    Note: In the interests of clarity we prefix the calendrical tithi value by a hash
    (#) and usually continue the count of the tithi on past 15 (Full Moon).


    It is preferable to note the two karaṇa of the first astronomical tithi 1 waxing
    as 1.1: kiṣtughna and 1.2: bava, whereby the karaṇa of astronomical tithi 1 waning
    become 16.1: vālava and 16.2: kaulava. It is then desirable to match this notation
    by calling tithi 1 waning, tithi 16, etc..


    Each inscription is accompanied by a computer-generated diagram, providing the
    opportunity to compare the data of the inscription’s text with the data derived
    from SurS. Readers are invited, in addition to consulting our comments, to make
    the diagrams speak for themselves as they require.


