    We note here the discrepancy between the 13 waxing of the text and the civil day
    #12 generated by the program. the astronomical 13th here completes itself by the
    civil day #12 is hardly more than a quarter elapsed: on this occasion the moon
    is fast on the civil calendar by an unusually large amount.


    It is possible that Javanese reckoning had a correction system in place, whereby
    intervals of this size (where three-quarters of the civil day #12 are are by the
    astronomical 14th) were not allowed to occur.


    A80: 828 p[u]nah śrawanamamāsa tithi aṣṭami kṛṣṇa pakṣa ha wa śū wāra.⁴


    Damais was forced to make the correction from wa to pa as the middle term of the
    three, in order to find a match with the given year.


