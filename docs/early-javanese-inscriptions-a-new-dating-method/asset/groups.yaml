    # THE LENGTH OF THE LUNAR MONTH


    With reference to the 29-day months (*), the chart indicates (extreme right) that
    there are sixteen years in which six of the months are so organised and that all
    the years containing an extra month fall into this class. The three other years
    have only 5 29-day months.


    Thus, in the whole cycle of 235 months, 124 months have 30 days in them and 111
    months have 29 days. This gives a total, in this cycle, of 6939 days.


    In the Indian system the only element that could be codified into a “rule” seems
    to be that there are never four successive months of the same type. For the rest,
    it is impossible to deduce a pattern in the distribution.


    We consider it likely that the Javanese system of reckoning bore a closer resemblance
    to the Mainland mode to the SurS mode. And though, on the evidence, we cannot
    deduce exactly what mode was, it seems very likely that the frequent one-day difference
    between SurS reckoning and Javanese reckoning may be imputed to using a more formalised
    method of distribution, perhaps along lines similar to the Mainland procedure.7


    > 5 Not even the apparent “rule” that if a year has an extra month will contain
    six 29-day months, not five, holds good. It is broken, for instance in saka 812.


    > 6 This can only be supposition, but it is strengthened by two factors: the clear
    evidence that Java did not replicate the SurS mode for adhikamsa (insertion of
    extra months); and the high probability that any exported calendrical system would
    be subject to simplifications of the kind demonstrable in the Mainland system.


    > 7 We do not isolate the frequent one-day difference to this factor alone: it
    has several other potential explanations, one of which can be invoked with any
    certainty at any time. The saving grace is that the difference bears a marked
    tendency to be confined to only one day. In the Indonesian data (for some reason)
    the difference also bears a marked tendency to be a lag not an excess. One anticipates
    that the day will be a Wednesday, if it is not a Wednesday it is more likely to
    be a Thursday than to a Tuesday.'
- md: '

    # APPENDIX V


    While it is true to say that there are various ways of making the lunar calendar
    keep pace with the solar calendar, it would be gross and inelegant to crowd all
    the necessary adjustments together in one place. Consequently in a mathematically
    influenced model it would be desirable to strike a balance between precise astronomical
    accuracy and arithmetic averaging.


    The expedient can be seen at work in the Mainland system, where the astronomical
    tithi (which even so was so closely observed for astrological purposes) might
    lag behind or accelerate past the calendar date by up to a day and a half—but
    always with a pendulum motion, back and forth.


    The obvious desirability of having the mathematical model maintain a more or less
    harmonious relation with its astronomical ancestor must have meant, we consider,
    that the solution provided to, or adopted by, Java had some family resemblance
    to the Mainland mode. But with one year, nineteen years, or fifty-seven years
    as the various scales of reckoning, one would need rather a good indigenous treatise
    or an extensive set of tables to recover all the details.


    # APPENDIX VI: WHAT DOES “RASI SIGNIFY?


    | rāshi | sign | longitude°) | time to rise (ghatika) |

    | :--- | :--- | :--- | :--- |

    | Meşa | Aries | 0-30 | 5 |

    | Vṛšabha | Taurus | 30-60 | 4 |

    | Mithuna | Gemini | 60-90 | 3 |

    | Karka | Cancer | 90-120 | 5 |

    | Simha | Leo | 120-150 | 6 |

    | Kanya | Virgo | 150-180 | 7 |

    | Tulā | Libra | 180-210 | 7 |

    | Vṛścika | Scorpio | 210-240 | 6 |

    | Dhanus | Sagittarius | 240-270 | 5 |

    | Makara | Capricorn | 270-300 | 3 |

    | Kumbha | Aquarius | 300-330 | 4 |

    | Mina | Pisces | 330-360 | 5 |


    In what seems to be a hierarchy of terms (or at least an orderly process of them)
    a full-dress inscription will begin with the śaka year, the lunar month, the tithi,
    and the weekday combination. This is followed by the nakṣatra, the yoga, and the
    karaṇa (usually in that order), with assorted jyotisa elements. On the occasions
    when the rāši is included, it shows a very strong tendency to be the last item
    before “irīka diwaśa ...”. We see no reason why it should come last, unless that
    position implies that it is a late addition to the process of terms⁸ or that it


    > ⁸ This view is endorsed by Casparis, Appendix II (p. 56), where of fifteen elements
    in the final, full-blown, version of a date the rāši is the second-last item to
    be added.


    was felt to be the last element in a chain of calculation.⁹ Since śaka year, the
    largest element, heads the procession, then the smallest element (lagna / muhūrtta
