    One important principle to be grasped is that the day next after Monday cannot
    ever be Wednesday; and Thursday, 29 March 882 AD cannot either Wednesday 29 March
    or Friday 29 March, it is possible for two lunar dates to fall on a particular
    Western date and yet be different. Two years earlier, for instance, 2880 was Caitra
    5 for the Thai, but it was only Tagu 14 for the Burmese. The difference in reckoning,
    of course, comes from a difference of opinion as to where the extra lunar months
    and days should be inserted in the calendar.


