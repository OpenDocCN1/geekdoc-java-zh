    ### (2) The wāra

    The wāra is the day of the week. In the Indonesian system, the days of the week
    are named after the seven planets or celestial bodies: Sunday (Soma), Monday (Sandra),
    Tuesday (Mangala), Wednesday (Budha), Thursday (Guru), Friday (Sukra), and Saturday
    (Sani). The wāra is often used alongside the other elements to fix the date within
    the lunar cycle.


    ### (3) The nakṣatra

    The nakṣatara is the lunar mansion. There are 27 nakṣatras in the traditional
    system, which represent the path of the moon through the zodiac. The nakṣatra
    of a given day is determined by the moon''s position relative to the stars.


