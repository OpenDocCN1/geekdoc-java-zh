    星宿名称 13: Hasta 距离 2: Barahani 远得离谱（147°）；而瑜伽 8: Dhṛti 距离 13: Vyātha 也有相当距离（67°）。


    要将这些差异解释为计算错误并不容易——这促使我们探索另外两个概念：(1) 在这一年（甚至在相邻的一年）存在某一天，其日期组合为 wa po bu，且星宿/瑜伽组合也是
    Hasta / Dhṛti；(2) 在 Śrāwaṇa 月存在某个时刻，无论日期组合如何，组合都是 Hasta / Dhṛti。然而，这两个问题的答案都是否定的。


    此外，虽然在某个时刻可能存在同时符合 wa po bu 和 Hasta / Dhṛti 的日子，但这样的日子绝不可能出现在 Śrāwaṇa 月。整个推算法系统决定，在
    Śrāwana 月，如果星宿是 13: Hasta，那么当时的瑜伽将位于 22: Sadhya 区域。


    由于我们的意图不仅是分析铭文文本，还要展示我们的方法论，而且我们认为自己无权仅凭断言得出观点，因此我们在此停顿，说明所涉及的原理。


