    ## 第三节


    ![](img/572e553b27bc57bad71f5952fb2a2e0f_35_0.png)


    在一个完美的世界里（即没有源头错误、误读，且印度计数法与爪哇计数法之间的差异已完全记录），我们总可以在图表中穿过一条垂直线，这条线与四条水平线在某一点相交，从而证明同步性。


    从这个角度来看，A68 是满意的，A69 在一天的第一个小时内保持稳定。但 A70 表现出相当大的不连续。


    当然，系统的本质使得五事元素之间发生差异性的滑动。在上面的三个图中，可以观察到第二条线（星宿线）逐渐向“左”滑动。但根据系统的本质，这种运动具有手风琴效应或之字形效应。“向左”的运动很快会被“向右”的运动补偿。而且在任何情况下，正确的元素（例如，在
    A70 的情况下，是 25: Purbabhadrapad 而不是 24: Śatbisaj）永远不会完全失去联系。


    深入探讨一下这个问题：Harṣana 的下限为 173° 20，并在此次（见图）于乌贾因的当地时间 4gh47 开始生效。此时月亮的经度为 323° 20.¹⁴。但由于时差，Harṣana
    直到中爪哇的 10gh36 才生效。


    - 14 此时的太阳经度显然与此时的月亮经度相加，得到定义瑜伽值的总和。


    现在反转方向，从中爪哇到乌贾因，而不是从乌贾因到中爪哇。在中爪哇的 4gh47（乌贾因的 58gh58），月亮的经度将达到 322° 左右，但这种差异仅略多于一度。


    从这一观察中可以得出，时差对月亮实际位置的影响很小；而且它它对五事元素的相对位置没有影响。你无法在不调整其他元素的情况下修改其中一个元素。


    换句话说，这意味着 A70 中 Śatabiṣaj 结束与 Harṣana 开始之间的间隙（总计 14gh00）是不可能通过考虑时差来弥补的。


    因此，试图使 A70 化的尝试仅剩下如下：(1) “Hastayoga”是一个虚无之音（vox nihili），而 Harṣanayoga 在此甚至在历法
    daśami śatabiṣaj śuklapakşa 开始之前就已经结束了；(3) 一个合格的天文学家不会对计算中小于 14gh00 的误差感到满意；(4)
    但使用包含四舍五入或平均值的表格的记录员不会认为 Śatabiṣaj 完全离谱。对于他来说，Śatabiṣaj 和 Purvābhadradapada 仅仅是他表格某一列中紧相邻的项目，而
    Harṣana 是正确的项目。


