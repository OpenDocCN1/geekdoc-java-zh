    Had he been able to investigate further, he could have added that on Aṣadha 10
    waning the nakṣatra would have been 4: Rohini, not 6: Ārdrā; and the yoga would
    have been 12: Dhruva, not 17: Vyatipāta.


    Aside: To demonstrate how rapidly clear argument can descend into supposition,
    we should spend a moment examining what alternatives are on offer here.


    Damais includes as one basis for his argument that because the text is a copy
    from the time of Majapahit, an error in the weekday is more likely than an error
    in the month.


    The implication here (or one of them) must be that it is less painful to posit
    a mistake or misreading of “su” as “bu” than it is to imagine a more gross clerical
    error in the name of the target month or (worst) a systematic slippage in the
    mode of reckoning. But this argument, of course, gains no or very little force
    from being attributed to a copy. It could equally apply to an unquestioned original.


    It must be noted that whereas Damais takes account of only one mistake (“bu” for
    “su”), he ignores the fact that if “su” is right, then the inscription’s “sinta”
    will be wrong.


    Another argument could be since “every school” must surely have known which combination
    belonged to wuku, once “su” was taken to be the right word, it would be presumed
    necessary to “correct” the wuku from “tolu” to “sinta”.


    But giving attention to the pañcañga elements puts a bound on speculation. Damais
    gave attention to one error (ignoring the wuku) and gave none to the additional
    consequences that would have followed from allowing “bu sinta” to stand, then
    the nakṣatra and the yoga would also have been killed out of filter. When they
    are taken into account, “bu” is wrong—and so is “sinta”.'
