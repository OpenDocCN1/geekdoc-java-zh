    française d’Extrême-Orient, 45 (1951), 3-41, 42-63; 46 (1952), 20-

    103; 47 (1955), 290; 49 (1958), 239.


    > ² 存在许多不同的历法，正如 Billard 的优秀著作 L’Astronomie Indienne, Paris, 1971 (Publications
    d’EEO, 83) 所示。它们在原型方面与 SurS 差异很大，

    关于闰法的结论。


    # 第一部分


    结果是可以被完全确定的。正是这种“五分历”（pañcaṅga）系统提供了一种进一步的：


    我们在此明确表示，我们并不主张或暗示 SurS “真正”存在于爪哇岛。相反的证据充分的。SurS 的闰法（其闰月方式）大部分时间局限于毗舍akha月（Vaiśakha）到卡提卡月（Kārttika）（含边界），而爪哇的闰法则跨越整个年份。当爪哇记录在特定的闰月表现出与
    SurS 不同的倾向时。


    因此，我们使用了一种双重机制：


    1) 我们采用 SurS 作为基准来评估爪哇记录，并将正负一天的误差（无论是加还是减）视为满意的匹配。这种匹配在两个方面都是满意的：(a) 它区分了微小的错位和严重的错误；(b)
    在没有本土著作可以参考的情况下，这是人们能达到的最佳结果，因为它可以：


    确定在爪哇岛对引入的计时系统进行了哪些修改。


    该经验法则的操作在附录 I 中解释，并在附录 II 中进行了详细说明。


    (2) 然而，当两个系统之间的差异达到一个农历时，我们引用了一项“经验法则”，该法则提供了一种合逻辑、有序且异常一致的解释，说明了爪哇闰法可能是如何运作的。


    > ³ Damais (4, 5) 指出他没有使用这种五分历系统。当他觉得有必要时，他修正了星期的读数，但他从未考虑过五分历可能提供的挑战，而它对星期系统中的日期提供了至少同样有力的检查，在原则上至少拥有同样要求的关注。Damian
    处理的是名称和数字的两个字母缩写，这些往往很难阅读。五分历系统列出了星宿月、宿日和时辰，从而为文本提供了更大的依据。


