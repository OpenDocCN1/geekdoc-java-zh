    14 天，月亮无法遍历九个星宿，发现 11: Pūrvaphaluni 和 3: Āyusam 的组合。反转方向看，可以说在 Waiśākha 9 盈期间，nakṣatra-yoga
    组合围绕 10: Māgha 和 11 Vṛiddhi（每个加减二）。在这里，可以遵循一条线索，即 11: P. Phalguni - Yoṇīdevatā
    Waiśākha 9 盈可能形成一个整体，但 3: Āyusam 必须被舍弃。然而，为了继续这项调查，需要来自组合的其他证据。从完全不同的角度分析数据，Damais
