    The Rule of Thumb implies an intercalation in the previous Waishākha, with SurS
    intercalating in the following Śravaṇa:


    | Java: | India: |

    |---|---|n| 1st Waiśākha | Vaiśākha |

    | 2nd Waiśākha | Jyeṣtha |

    | Jyeṣtha | Āşadha |

    | Aṣadha | 1st Śravaṇa (“adhika”) |

    | Śravaṇa | 2nd Śravaṇa (“nije”) |


    If (or some part of) it did indeed delay its intercalation until Śravaṇa, contrary
    to the prediction supplied by our Rule of Thumb, then Indian nije Śravaṇa would
    indeed equate with Javanese punah Śravaṇa, because Indian usage was to label the
    first, not the second, of the two months as the “extra.”²⁶


    > ² Differences in usage of this kind serve as what we might call “fingerprints”.
    In Thai usage, for instance, the doubled month is often called “1st Ashadha” and
    “2nd Ashadha”. But when the term “adhika Ashadha” is used instead, it applies
    to the second of the two months, not to the first. Similarly, while reference
    to the astronomical yoga can be regarded as in effect standard in the Indonesian
    apparatus, in the extensive Thai record, even that part of crowded with technical
    detail, the yoga appears less than 1% of the time.'
