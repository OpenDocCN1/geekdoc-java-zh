    由于我们没有关于爪哇人实践的可靠指南，我们可以求助于已得到全面理解的大陆做法进行比较。东南亚大陆地区确定农月长度的规则如下：


    - 奇数的月份 Caitra（凯特拉）、Jyestha（杰斯塔）、Sravana（沙罗瓦纳）……应为 29 天（每 57 年必须额外给 Jyestha 增加一天的情况除外²）。


    ¹ 在印度语境下，谈论“日历日”并不准确，但需要一个术语来区分组成农月的 30 个天文学农日（tithas）与由于存在更多被削减的（ksaya）农日和重复的（adhika）农日而导致的月份较少总数。这种区分是必要的，因为人们广泛认同爪哇人将“农日”一词应用于其天文学数值，而非民用（日历）天。如果某个月的天文学农日进展为
