    We have paid little attention in this study to the Ujjain - Java time difference,
    since it is rarely material to the argument. Here however, one notes that the
    Ujjain times for the astronomical tithi are increasingly bearing down upon 00gh00;
    they pass from 55gh 29 on waning, to 56gh32 at New Moon, to 58gh 48 on waxing.
    And when central Java is taken into account, the start of the tithi has already
    passed across the day following:


