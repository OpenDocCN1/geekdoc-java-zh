    calculations sometimes have to reach back a long way. By analogy, a very useful
    Western method of computing long intervals is known as the Julian Day system.
    Its inventor discovered in the end that the first amenable starting date for his
    system lay in 4713 BC.


    The reader will readily imagine that even a 70% match with the anomalous part
    of the record (its disjunction from SurS reckoning) cannot be achieved by mere
    coincidence, and the remaining question is why such a system should have been
    put in place.


    The answer is not far to seek. We know that the Indians regulated their calendar
    according to the immediate constraints offered by the calculated positions of
    the sun and the moon. We know, on the other hand, Mainland Southeast Asia regulated
    its calendar by confining the modifications required to the month of Asadha for
    extra months and the month of Jyeshatha for extra days. We do not know from text
    books how the Indonesians resolved the problem, but our Rule of Thumb presents
    an answer that cannot be far from the truth. The point, essentially, is that for
    luni-solar calendar to work over long periods, certain adjustments must be made
    to it; but there is more than one way of implementing them. The Indians chose
    to make the adjustments from day to day and month to month. The Southeast Asians
    chose to stock-pile them, as it were, and to isolate them to a single part of
    the years involved. Our strong impression is that the Indonesians also avoided
    instant modification based upon astronomical circumstance and employed a mathematical
    model that gave them a distribution pattern that stretched across the entire year.


    Perhaps the main thing to avoid in what the layman would regard as tampering with
    his calendar is some sudden and dramatic alteration. By analogy, we are well accustomed
    to See my study, The Calendrical Systems of Mainland South-East Asia, HdO III
    ix, Brill, 1995, section 7., daylight saving and to having 29 February every four
    years, but we would not have been well pleased to be told that this year the day
    next after 2 September will be 14 September, as happened in England in 1752.


    The Indian-based calendar that found its way into Mainland Southeast Asia shows
    signs of simplification. It seems reasonable to suppose that the different Indian
    system that found its way to Java was also simplified. On the Mainland the simplification
    was achieved by codifying the calculation procedures to the point where they could
    be applied by rote. The day-to-day astronomical minutiae averaged out. The Indians
    said “ever and ever we will take each day as it comes”. The Mainland said “in
    every period of 57 years we will have 25 lunar years with 354 days in them, 11
    with 355 days in them and 21 years with 384 days in them”. The frequency of this
    “tampering” felt all at the same rate as our Leap Years.


    We suggest that our model for Javanese intercalation exhibits just the kind of
    mathematical substitute for a technically more abstruse and complex form of reckoning
    as be demonstrated on the Mainland. It will have taken considerable expertise
    to frame the mathematical model, but once it was determined, it could be applied
    in Java in the same way as the simplifications adopted by the Mainland were operated.


    In the annotations that accompany the tables the lunar month is counted continuously,
    as is usual in this:

    Vaiśakha 25 = Vaiśakha 10 waning, etc.


    > 6 It is possible for an intercalation system to get somewhat out of hand. A
    recent (privately published) study of the Balinese calendar indicates that in
    1993 a change made to which of seventeen years should receive an extra month.
    The distribution principle is the same as was employed in Burma and Thailand,
    and the pattern used in Bali before 1993 is one that would have been operative
    in AD 486, and the pattern used after then was one that would have been operative
    after AD 1455, according to the cyclic shifts governing the implementation of
    the scheme. This disarray in the modern Balinese calendar clearly (and unfortunately)
    has no bearing upon the early Javanese calendar.


    The one-day difference between the inscriptions and one’s prediction continues
    to be an irritant. Our annotation “Vais. 25 [24] = 30 April”, for instance, indicates
    that the weekday combination (which has a secure, one-to-one, connection with
