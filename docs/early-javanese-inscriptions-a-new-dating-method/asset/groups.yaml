    For this to have been necessary the calendar must have been in some disarray—either
    that, or some social, religious, or political consideration was allowed to interfere.
    Indeed, there are accounts telling us, for instance, that King X was told that
    he would die in the year Y. Therefore he caused the year Y to be expunged.


