    The Rule of Thumb here implies an intercalation in Kārtika 963, whose effect would
    be to set the Javanese calendar month in arrears of SurS until the following Waiśāka.⁷⁹
    (The weekday combination and the planetary positions are of course not affected
    by the difference in the name of the month.) If we compare our Javanese reckoning
    with SurS reckoning and Thai reckoning, we find there were ten months during which
    the three groups were never in alignment:


    | Java | India | Thailand |

    |---|---|---||\| Asuji | Āvina | Āvina |

    | 1st Kārtika | Kārtika | Kārtika |

