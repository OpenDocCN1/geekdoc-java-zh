    Working, now, through the (any year) one finds that the combination 11: Pūrvaphalgunī
    and 3: Āyusammat cannot occur except in the region of 11 waxing in Mārgaśira or
    Poṣya. And reversing the direction of attack, one can say that in the region of
    Waiśākha 9 waxing the nakṣatra-yoga combination fluctuates around 10: Māgha and
    11 Vṛiddhi (each plus or minus two).


    Here, then, is a trail that can be followed, one which indicates that 11: P. Phalguni
    - Yoṇīdevatā , and Waiśākha 9 waxing might form a coherent grouping, but that
    3: Āyusmat has to be discarded.


    For this line of enquiry to continue, however, one would require some corroborating
    evidence to be forthcoming from the wāra combination. And analysing the data from
    an entirely different perspective, Damais considered that “ma ] ca” were possible
    readings, which would then determine in this case that the missing middle element
    was “ou / u”.


    Both Damais’ and our reading of the data therefore point to 20 April 929.


    We indicate here a further advantage in our methodology. At the start of a search
    for that date wāra had in this instance to be considered without evidential value.
    But when once a possible date had been determined without its assistance, the
    date arrived at provided a day-combination that corroborates Damais’ conjectural
    reading of it.


    We stress that the chain of argument can be fragile—that very little more in the
    way of degradation in the original would have placed the date beyond even conjectural
    recovery.


