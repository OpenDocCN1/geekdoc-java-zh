    ## APPENDIX V: THE LENGTH OF THE LUNAR MONTH


    The chart opposite indicates for the period *śaka* 789 to 807 which lunar months
    in SurSurS calculation contained only 29 calendar days (*) rather than 30:¹


    Since we have no reliable guide to Javanese practice, we may resort for comparison
    to the Mainland practice which is comprehensively understood. The rules in Mainland
    South-East Asia for determining the length of a lunar month were as follows:


    - the alternate months Caitra, Jyestha, Sravana .... shall have 29 days in them
    (except where an extra day must be given to Jyestha 11 times in 57 years.²)


    ¹ In an Indian context is not quite correct to talk of calendar days, but some
    term is needed to make a distinction between the 30 astronomical tithas that make
    up the lunar month and the lesser total in a month where there are more suppressed
    (ksaya) tithas and there are repeated (adhika) tithi. The distinction is needed
    because it is widely recognized as confusing, the Indonesians applied the term
    "tithi" not to the astronomical value of that but to the civil (calendar) days
    in their sequence. If the astronomical tithi in a given month happened to progress
    1-2-3, if the tithi progressed 3-4-5, then astronomical tithi 5 would also fall
    on civil 4. The table uses SurS reckoning, in those cases where the Indonesian
    record is with SurS and has an adhikamsa common with Mean reckoning.


    ² In this context "days" means civil periods of 24 hours commencing at midnight.
    For this reason the Thai location is, for example, "waxing three nights/waning
    five nights"


    ## THE LENGTH OF LUNAR MONTH


