    # 附录 III：星宿、宿与星座


    在对侧的表格中，我们将星宿（nakṣatras）、宿（yogas）和星座（rāši）进行比对。


    由于有 27 个星宿、27 个宿但只有 12 个星座，许多星宿和宿跨越了一个星座，因为它们兼具了多种属性，是不吉利的。例如，Mṛgaśiras 起于金牛座，因此是“土元素性”，但由于结束于双子座，它变成了“风元素性”。作为平衡，需要时他们也可以指出，当星宿或宿的跨度以角分表示时，该数值是吉利的
    80''。


    他们没有注意到，四个星宿周期和九个星座周期总和也是 108，这是另一个非常有力的数字。


