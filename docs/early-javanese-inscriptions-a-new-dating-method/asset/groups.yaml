    If the text of A88 is secure, therefore, it implies that Java did not simply adopt
    Indian thinking but calculated according to its own law.


    We observe in the translation of this inscription given by Barrett Jones our ref.
    n. 13 p. 26) the locution “babyamamandala” is rendered as “the path of the heavenly
    body was in the nakshatra [15]: Swāti”—a version clearly owing a lot to interpretation.
    The nakshatra in operation has already been named in the inscription as 13: Hasta.
    Consequently the “heavenly body” cannot be the moon. Impression of the actual
    astronomical situation reveals that at this date no “heavenly body” was in the
    region of Svāti (186°–200°). We are therefore obliged to conclude that complicated
    (and irrecoverable) rules governed how a mandala was determined at any given time.
    Indeed, we extend this conclusion by remarking that the compass-points of the
    four mandalas lie East, Southeast, West, and Northwest it is no means easy to
    envisage a conceptual model into which the system must surely have been an arbitrary
    mathematical construct, and it is one in which only half of the standard compass
    directions play a part.'
