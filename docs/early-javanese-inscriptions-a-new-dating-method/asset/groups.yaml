    # APPENDIX V


    While it is true to say that there are various ways of making the lunar calendar
    keep pace with the solar calendar, it would be gross and inelegant to crowd all
    the necessary adjustments together in one place. Consequently in a mathematically
    influenced model it would be desirable to strike a balance between precise astronomical
    accuracy and arithmetic averaging.


    The expedient can be seen at work in the Mainland system, where the astronomical
    tithi (which even so was so closely observed for astrological purposes) might
    lag behind or accelerate past the calendar date by up to a day and a half—but
    always with a pendulum motion, back and forth.


    The obvious desirability of having the mathematical model maintain a more or less
    harmonious relation with its astronomical ancestor must have meant, we consider,
    that the solution provided to, or adopted by, Java had some family resemblance
    to the Mainland mode. But with one year, nineteen years, or fifty-seven years
    as the various scales of reckoning, one would need rather a good indigenous treatise
    or an extensive set of tables to recover all the details.'
