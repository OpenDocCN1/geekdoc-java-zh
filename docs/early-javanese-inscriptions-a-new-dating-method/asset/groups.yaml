    # Punarvasū and the yoga: Shubha.


    We reiterate that differences of this kind are not large and that in default of
    theoretical treatises it is not possible to assign a clear cause to them. Since,
    however, cannot be accounted for merely by the difference in geographic longitude
    between India and Java, we suspect that other factors were in operation, among
    which the most likely would appear to be simplification or codification used to
    create “handy tables” that were employed by the non-experts.


    The actual calculated positions at the start of astronomical tithi 4 waning (civil
    3 waning) were 210° for the sun and 66° for the moon, giving them a separation
    of 216° (the start of karaṇa 19.1 and a yoga value of 276):


    | C | Y | Upsilon |

    |---|---|---|

    | | 66 | 210 276 |

    | 0 | 80-93 | 293-306, 360 |

    | punarvasu | | subha |


    At the start of the next day the values were 211° and 79°, respectively:


    | C | Y | Upsilon |

    |---|---|---|

    | | 79 | 211 290 |

    | 0 | 80-93 | 293-306, 360 |

    | punarvasu | | subha |


    Consequently, with a lunar motion of half a degree an hour, the yoga would begin
    to fall in Shubha in roughly another six hours; but by that token the sun-moon
    separation would be 231°, which would make the karaṇa 20:1 Kaulava, two places
    ahead of karaṇa 19.1 Bava.


    It seems to us dislocations of this type, which are common enough in the record,
    imply that despite the inter-relatedness of all the astronomical elements, there
    was no continuous chain of careful calculation employed, or rather that such a
    chain was broken down into reference tables, so that the dislocation, for instance,
    by Punaravāsū and Śubha on the one hand and karaṇa Bava on the other, could go
    well undetected.


