    计算有时需要追溯到很久以前。类比地，一种计算长时间间隔的非常有用的西方方法被称为儒勒纪日系统（Julian Day system）。其发明者最终发现，该系统第一个适用的起始日期是公元前
    4713 年。


    读者很容易想象到，即使与记录中的异常部分（即其与 SurS 计法的偏差）达到 70% 的匹配度，也不可能是纯属巧合的结果，剩下的问题是，为什么要建立这样一个系统。


    答案并不难寻找。我们知道，印度人根据太阳和月计算位置所提供的即时限制来调整他们的历法。另一方面，我们知道，大陆东南亚通过将所需的修改限制在阿沙哈月（Asadha）的闰月以及杰耶什哈塔月（Jyeshatha）的闰天上来调整其历法。我们从教科书中不知道印度尼西亚人是如何解决这一问题的，但我们的“经验法则”（Rule
    of Thumb）提供了一个可能接近事实的答案。本质上，为了让阴太阳历在长时间内有效运行，必须对其进行某些调整；但实施这些调整的方法不止一种。印度人选择按日、按月进行调整。东南亚人则选择将它们积蓄，并将它们隔离在涉及的年份范围内。我们的强烈印象是，印度尼西亚人也避免了基于天文状况的即时修改，而是采用了一种数学模型，提供了一个跨越全年的分布模式。


    也许在门外汉认为“篡改历法”的行为中，要避免的主要点是某种突然且剧烈的改变。类比地，我们已经习惯了我的《大陆东南亚历法体系》（The Calendrical
    Systems of Mainland South-East Asia, HdO III ix, Brill, 1995, section 7.）、夏令时以及每四年一次的2
    月 29 日，但如果有人告诉我们今年 9 月 2 日的第二天将是 9 月 14 日（正如 1752 年英国发生的那样），我们并不会高兴。


    进入大陆东南亚的基于印度的历法显示出了简化迹象。可以假设进入爪哇腊的另一个印度系统也被简化了。在大陆，这种简化是通过将计算程序法化实现的，以至于可以硬背地应用。每天的天文细微差别被平均掉了。印度人说“我们将永远顺应每一天”。大陆则说“在每个
    57 年的周期内，我们将 25 个 354 天的阴月，11 个 355 天的月和 21 个 384 天的月”。这种“篡改”的频率感觉与我们的闰年一样。


    我们认为，我们的爪哇插闰模型恰恰展示了一种数学替代方案，以替代在大陆上演示的技术更深奥、更复杂的计算形式。构建这个数学模型需要大量的专业知识，但一旦确定，它就可以在爪哇应用，就像大陆所采用的简化方法被运行一样。


    在随附表格的注释中，阴历月份是连续计算的，正如通常一样：

    Vaiśakha 25 = Vaiśakha 10 亏日，等。


    > 6 插闰系统可能会变得有些失控。最近对巴厘历法的一项（私人出版）研究表明，1993 年，对于十七年中的哪一年应该获得闰月的规定发生了变化。其分配原则与缅甸和泰国使用的相同，1993
    年之前巴厘使用的模式是一种在公元 486 年有效的模式，而此后使用的模式则是根据管理该方案实施的循环移动在公元 1455 年后有效的模式。现代巴厘历中的这种混乱显然（且遗憾地）对早期爪哇历法没有影响。


    铭文与预测之间的一天差异仍然是一个令人恼恼的问题。例如，我们的注释“Vais. 25 [24] = 4 月 30 日”表示星期日的组合（这与西方日期有可靠的一一对应关系）根据
    SurS 计法落在历法上的 Vaishākha 9 亏日 (24)，而不是第 10 亏日 (25)。


    我们再次指出，导致这一天差异的潜在原因有很多，要为其中任何一个实例分配特定的原因将是主观臆测的。我们认为在大多数情况下，指出这些差异比尝试将它们规范化更好。


