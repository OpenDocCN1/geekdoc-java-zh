    # SECTION THREE


    difference is smaller, as here, where one requires 17: Vyatipāta and not 20: Śiva
    to be in force, in such cases it is seldom possible to decide whether this is
    (a) original error in reckoning; (b) an original error in reading a set of tables,
    or (c) the result of a systematic difference in reckoning.


    In this present case, nonetheless, our opinion is as follows:

    even a systematic difference in reckoning would not produce a discrepancy of this
    magnitude (the distance between Śiva and Vyatipāta is 28%);

    it is unlikely that an "eye skip" in a set of tables would jump three places:
    Vyatipāta - Varīyas - Paragha - Śiva;

    the words Vyatipāta and Śiva presumably do not look like each other;

    the error is probably an initial calculation error.


