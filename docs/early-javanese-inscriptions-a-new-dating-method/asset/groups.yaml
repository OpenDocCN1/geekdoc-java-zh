    ⁹ We concede that the text does not specify Kārtika as an intercalary month, which
    might suggest that in fact the previous month, Asuji, was intercalary. The aim
    of the Rule of Thumb, however, is to generate seven extra months in every 228
    months by intervals of 32 or 33 months, and Phalguna in 960 and Kārtika in 963
    are indeed separated by 32 months.'
