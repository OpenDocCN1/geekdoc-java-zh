    In an investigation of this character it has to be assumed (at least initially)
    that no one item is less liable to mistake or corruption than another. Fortunately,
    however, the next principle to be invoked is that all the separate elements in
    a date (all of potentially equal status) must combine simultaneously together.


    Here the meant weekday combination has no evident value but the nakṣatra and the
    devatā do form a corroborative pair (or perhaps one should say, are not at odds
    with each other).


