    # SECTION ONE

    INTRODUCTORY


    The purpose of the following study is to examine the substantial

    series of articles by Louis-Charles Damais on the Indonesian

    inscriptional record, to see whether corrections, modifications,

    and improvements to the Javanese component of it are possible.


    The focus is upon Java since that material represents 72% of

    the whole in Damais'' study, and of the 23% that originates in Bali

    almost all of it is devoid of the astronomically-related data that it is our intention
    to examine.


    We intend to put the analysis of the record on a different

    footing by using the advantages in accuracy and speed of

    operation that a computer program provides. The computer

    program is based upon the Sūriyasiddhānta (henceforth “SurS”).


    It should be said at the outset that Damais'' findings are often

    secure, that he was highly astute, and that he was also quite

    properly tentative as to some of conclusions whose

    ambiguities or uncertainties in the original could not be cleared.


    Damais paid particular attention to the weekday system whose

    210-day structure can be determined with complete certainty,

    ependently of the inscriptional data. There is however, another

    system routinely in operation in the record, which is also


    > ¹ Louis-Charles Damais, “Études d’épigraphie indonésie”, Bulletin de

    l’Ecole française d’Extrême-Orient, 45 (1951), 3-41, 42-63; 46 (1952), 20-

    103; 47 (1955), 290; 49 (1958), 239.


    > ² There were many different canons, as demonstrated in

    Billard’s excellent study, L’Astronomie Indienne, Paris,

    1971 (Publications d’EEO, Vol. 83). None of them, differs

    widely from SurS as regards the prototype,

    as regards the results of intercalation.


