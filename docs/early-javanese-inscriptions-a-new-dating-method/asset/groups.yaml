    假设某文本指定了 nakṣatra [19:] Mūla，同时指定了 yoga [19:] Parigha，而实际上生效的 yoga 是 12: Dhruva。我们可以推测，正确的
    yoga 名称是某人的笔误。


    # 第三部分


    在这项研究中，我们很少关注乌贾杰普与爪哇的时间差，因为这对于论点来说并不重要。然而，人们注意到，乌贾杰普的天文 tithi 时间越来越趋近于 00gh00；它们从亏月时的
    55gh 29 变为新月时的 56gh32，再到盈月时的 58gh 48。当考虑到中爪哇岛时，tithi 的开始已经越过了第二天：


    | | 0''55 | 0''38 | 1''38 | 3''54 |

    |---|---|---|---|---|

    | 28.2 | 29 | 30 | 1 | |

    | Apr 2 13 waning | Apr 3 14 waning wu pa an | Apr 4 amavasya | Apr 5 1 wax |


    尽管如此，如果使用公历日期作为比较点（当然，星期几的组合附属于 4 月 3 日 (wu pa an)），karaṇa 28.2: Vanija 与它有一天的距离。简而言之，这里的错位并不是由于人们未能进行必要的调整造成的。


    在这种背景下，我们被迫做出的某些点在阐明时似乎是显而易见的——但在这样一个看似复杂且陌生的领域，不作明确说明将是轻率的。


