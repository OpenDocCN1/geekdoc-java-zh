    ## THE PANCHANGA SYSTEM


    The tithi, as we have indicated, represents the distance along the ecliptic currently
    separating the sun from the moon, when that distance is divided by 12.7. Here
    we should note, first of all, the calendrical date in the text of A116 is 10 waning
    (#25), but the karana named is the first half of tithi 11 waning:


    ```

    26:ekadasi krsna

    |----------------|

    KY 4032 Sravana #25

    ```


    There are enough cases of this kind to indicate that at least some regions the
    word "tithi" applies to the calendrical date, not the astronomical date. This
    may be somewhat confusing, but it is not untoward, in the sense that if you specify
    which half of the astronomical tithi is in force there is no constraint to specify
    which whole astronomical tithi is in force. On the other hand, there is a constraint
    to specify which calendrical tithi is in force, since the astronomical tithi and
    the calendrical tithi will differ for much of the time.8


    If we select the mid-point nakshatra Ārdrā (call it 73°)9 and the midpoint of
    Vyatipāta yoga (call it 220°), we obtain both a provisional value for the moon''s
    longitude (the mid-point of the nakshatra) and a provisional value for the joint
    latitudes of the sun and the moon (the mid-point of the yoga).


    > 7 De Casparis (p. 51) says that "the inscriptions seem to record the first karana,
    i.e. that is current at sunrise of the month [?read: day mentioned]. But on the
    contrary, there are cases where the karana named is one that was not in force
    at the start of the given day. With A126, for instance, karana 5:1: Bava is in
    force at sunrise, but the karana named is 6:1: Kaulava. (Cf. also A88, A128, A146,
    A152, A169).


    > 8 It is not possible to make rule out of this. In a significant number of cases
    there is a better fit between the inscription''s date and the astronomical tithi.
    See A68, A76, A80, A95, A105, A107, A115, A118, A120, A124, A135, A139, A151,
    A152, A161, A163, A175, A207.


    > 9 The true-point is 73° 20'', but for minutes of arc have been ignored.


    Consequently we also obtain an approximation for the longitude of the sun, i.e.
    by finding a value for the moon minus the nakṣatara:


    For the nakṣatva value and the yoga value to be simultaneously valid here, the
    sun must be in the region of 147°. The value may be somewhat more or less than
    that, depending on which part of the ranges actually applies, but clearly the
    sun cannot be, say, 300°.


    If we include the karana and the moon ahead of the sun at 73°. The moon is therefore
    distant from the sun by (360+73-147=) 286°. Divide this amount by 12, and the
    result will be 24:50 (the integer here is the tithi *current* and the fraction
    is sexagesimal). Since tithi number 24 is constituted by Taitila (24.1) and by
    Gara (24.2), we are in karana 24:2; Gara, the fractional part of the tithi is
    greater than 30.¹¹⁰


