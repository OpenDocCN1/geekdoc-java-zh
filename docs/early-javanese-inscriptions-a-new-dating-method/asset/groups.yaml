    Damais indicated that despite cyclic day combination being spelt out, there was
    no lunar date in this year that would match with it. The time of year being August
    – September, fixed upon the combinations wu ka ā (14 August 903) or wu ka ang
    (13 September 903).


    The choice between the two was then made to depend on whether or not an adhikamā
    (extra lunar month) had already been inserted. For reasons he does not declare
    (“que nous ne pouvons exposer ici”), he considered that there had indeed been
    an extra month, and so opted for the later of the two dates. ²²

    By our intercalation procedure the year was indeed intercalary:


    | Java: | India: |

    | --- | --- |

    | 1st Śrawaṇa | Śravaṇa |

    | 2nd Śrawaṇa | 1st Bhadrapada |

