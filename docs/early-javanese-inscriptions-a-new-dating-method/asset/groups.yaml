    ## SECTION TWO

    THE PANCANGA SYSTEM AS AN INSTRUMENT FOR JAVANESE DATING


    The five elements involved are (1) the wāra (weekday), (2) the nakṣatara (lunar
    mansion), (3) the tithi (lunar day), (4) the yoga (combined longitudes of the
    sun and the moon), and (5) the karaṇa (half a tithi). And though in his handbook
    Indonesian Chronology, J. G. de Casparis twice (pp. 18, 23) suggests that the
    Indian pañcāṅgā system did not hold in Indonesia,¹ this contention must be taken
    to apply to the Indonesian divination system. That it should not be applied to
    the dating system is evident, for instance, in the inscription Waharu IV (A116),
    where one finds the following:


    + 853 śrawaṇāmāsa [1] tithi daśamī kṛnapakṣā pā ka bu [2] wāra sita intaiśyatha
    haṛacāra [3] adranakṣatra śula-bhṛddavate baaruñyamandala [4] wyipatayogoga wawa
    [5] karaṇa yamaparwarwe śetamahuti singharṣi²


    All five pañcāṅga elements are here plainly specified. Indeed, there is an entire
    class of inscriptions that employ this style of presentation in their luni-solar
    dating.


    > ¹"There is no evidence that ... system was ever used in Indonesia, its place
    largely being taken by the three weekdays and the wuku" (Indonesian Chronology,
    Leiden, 1978, p. 23).


    > ² 47.181. The order of presentation in this, as is the case with Thai and Burmese
    dates, is highly conventionalised. One can almost guarantee, for instance that
    the words after -paksa will be the weekday abbreviations, and that the next pañcāṅga
    element will be the nakṣatra, the yoga, and the karaṇa. We have paid no attention
    to the "jyotisa elements "-astha,"-mandala," "-parwesa. They were investigated
    in some detail and with no little perseverance, but eluded all our attempts to
    account for them systematically.


    ## THE PANCHANGA SYSTEM


    Our first task is therefore to explain how this information can be used analytically.
    To put the matter, first of all, in general terms.


    If an inscription specifies what nakshatra (lunar mansion) is involved, the moon''s
    position in longitude can be deduced to within 13° or so; if it also specifies
    what (astronomical) yoga is involved, the sun''s position can be deduced within
    a reasonable margin; and if the karana is then specified, its value (which has
    only 6° of extension) can be used as a control or check upon the two other values.
    Clearly, then, it behoves us to understand how these three elements operate. And
    since the mathematical relationship between them is not abstruse, this is no great
    hardship.


    ### (1) The tithi

    The tithi is the most difficult element to grasp conceptually. Its function is
    to measure the angular separation of the moon from the sun at any one time, this
    distance in degrees being divided by 12, with the fractional amount being expressed
