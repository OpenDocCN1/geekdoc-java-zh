    In this section the coverage has been extended to include items whose dates are
    tolerably secure whether or not they contain Ganga data. The purpose here is to
    plot the inscriptions by śaka and lunar month in a grid of 19 years and has two
    sets of markers:


    - (1) dotted lines that link up the seven years in nineteen (plain text A-G) that
    are taken to be adhikamsa by SurS. The changes (if any) from one block to another
    may be determined by inspection. It will be observed that in 665 years covered,
    the intercalary month reaches beyond Karttika only twice (śaka 1077 and 1218).
    On the occasions where “adhika” is written out (e.g. śaka 814), it will be found
    that it is closely preceded by “kṣaya”, and these occurrences always fall after
    Kartika. This procedure is noticeably different from the practice in Mainland
    Asia, where the days of lunar month ignore the tithi on a particular day and simply
    alternate between 29 days in one month and 30 days in the next.


    - (2) In contrast, reconstruction of the Javanese system (bold face A-G) ranges
    across the entire year. The values in the extreme right-hand column give the total
    of months in the given cycle, together with the intervals between intercalations.
    Where a bold letter appears inside a box, it indicates that the position of the
    month has changed since the last cycle. No two shifts can be adjacent in the sequence,
    but more than one shift can occur in a given cycle (“B, D, F” in the cycle beginning
    śaka 808). The Javanese shift is always one lunar month backwards, and though
    the two systems move independently of each other (as they must, since they are
    based on different principles), the Javanese month never chances to fall later
    than the SurS month.


    Certain of the inscription numbers are entered in bold face. The intention here
    is to indicate where invoking our reconstruction (our “Rule of Thumb”), causes
    the inscription to fall into place. Thus, re śaka 804:


    “F .. A58 .. F:”


    This indicates that the subsidiary information in the inscription is used to determine
    a Western date, then the SurS equivalent falls one month later than the month
    given by the inscription. The two systems are not in phase. The “F” at Mṛgaśiras
