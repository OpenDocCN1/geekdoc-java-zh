    # Punarvasū 与瑜伽：Shubha（吉相）。


    我们重申，这类差异并不大，而且在缺乏理论著作的情况下，无法为其分配明确的原因。然而，由于这不能仅通过印度与爪哇之间之间的地理经度差异来解释，我们怀疑还有其他因素在起作用，其中最可能的为了供非专业人士使用的“简便表”而采用的简化或编典处理。


    在天文 tithi 4 亏月（民用 3 亏月）的开始时，实际的计算位置为太阳为 210°，月亮为 66°，它们之间的间隔为 216°（karaṇa 19.1
    的开始，yoga 值为 276）：


    | C | Y | Upsilon |

    |---|---|---|

    | | 66 | 210 276 |

    | 0 | 80-93 | 293-306, 360 |

    | punarvasu | | subha |


    在第二天开始时，数值分别为 211° 和 79°：


    | C | Y | Upsilon |

    |---|---|---|

    | | 79 | 211 290 |

    | 0 | 80-93 | 293-306, 360 |

    | punarvasu | | subha |


    因此，按照月球每小时半度的运动速度，yoga 大约在另一个六小时后开始进入 Shubha 状态；但根据此标准，日月之间的间隔将是 231°，这将使得 karaṇa
    20:1 Kaulava，比 karaṇa 19.1 Bava 领先两个位置。


    在我们看来，这类在记录中十分常见的错位意味着，尽管所有天文学元素之间存在相互关联，但并没有采用连续的精密计算链，或者说，这种链条被分成了参考表，以至于例如
    Punaravāsū 和 Śubha 与另一 karaṇa Bava 之间的错位可能完全没有被察觉。


    # A136: 944 ceteramā tithi caturdaśnapapakṣa wu pa ang wāra balsamuki kritīkāraṇanakṣatra
    dahanadawatā āyu[ś]m[ān]yoga wanijakākara.⁷²


