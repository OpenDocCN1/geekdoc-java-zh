    If the month is Śrāwaṇa, then on the 15th of that month the nakṣatra will be Śrāwaṇa—this
    being how the month gets its name. If, then, we have reached the 14th of the month,
    the moon cannot traverse nine nakṣatras finds that the combination 11: Pūrvaphalgunī
