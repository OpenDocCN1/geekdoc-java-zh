    These twenty-five instances E90 and A172 have to be discarded. This leaves four
    (A116, A157, A173, A188) that are ambiguous; six (A129, A160, A174, A177, A179,
    A183) that seem to point away from the lagna, and thirteen seem to point towards
    it.


    If therefore we feel at liberty to include the ambiguous instances in our count,
    we have a total of some 71% of the evidence suggesting that the references to
    the rā are intended to mark the lagna. This being so, one would read “mṛcchikharśīlag”
    in A139 with some conviction.


    We may here add that A17-18 (śaka 772 Āṣāhā 2 waxing) and A30 (śaka 793 Śravana
    4 waning) contain the phrase “hana yy umahna / hana umahna”, which is taken to
    mean “while (the sun or the moon) is in its own house”. In these cases this reference
    would of course to be the object’s longitude.


    De Casper maintains “calculation of the dates in which the expression shows that
    not the lunar mansion ... is meant the [month''s] zodiac sign ... which is Karka,
    Cancer (at 90° to 120°).¹ He implicitly discounts the possibility that the phrase
    could apply to the sun, whose mansion is Singha (at 120° to 150°). But as will
    be seen from A30, that possibility needs to be kept alive.


    ¹⁷ de Casperis, 1978, p.22.


    ## APPENDIX VI


    In the case of A17-18 the sun was at 81° and the moon was at 93°—which indeed
    places the moon in its mansion. But in the case of A30 (though the text is problematic)
    the moon is expressly said to be in “rewatinṣatra”, which runs from 346° to 360°—and
    is so far from Karka—whereas sun was indeed in rashi.


    The evidence is too slight to provide us a clear guide. The best that one can
    say is that one would expect “hana uyajna” to apply equally to the sun or to the
    moon, though not to planet since the Javanese system clearly takes the two “luminaries”.
    It is notable in South-East that the highly formulaic mode in which astronomical
    data is presented the reader is assumed to know, from position of an item, what
    its function is. And for that matter best known to themselves the Americans use
    “2 / 3 / 97 to mean 3 February (i.e. month / day). More rationally, “2 / 3 / 97”
    would mean 2 March (i.e. day / month). In short, to read the code, one needs to
    know in advance the system used operating it. And with the Javanese record, except
    for weekday and pañcaṅga systems, much remains a mystery. Luminary is a convenient
    term to adopt from English parlance, where it was used to distinguish the sun
    and the moon from the rest of “planets”. The use of “planet” as applied to the
    sun is of reflection or overlap from geocentric.


