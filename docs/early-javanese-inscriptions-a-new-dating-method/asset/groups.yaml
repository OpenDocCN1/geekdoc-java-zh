    of forcing the current intercalation back to Jyeṣtha as required.


    Interference with the calendar at such a level would be more likely to have religious
    or political objectives than astronomical ones.


    # APPENDIX I: A RULE OF THUMB FOR INTERCALATION


    We present here a procedure by which, with a remarkably good approximation, the
    position of intercalary months can be determined for the Javanese calendar, as
    that system is implemented in the inscriptions.


    It will be noted that the operative numbers in the procedure are 488 (item 3 below)
    and 65 (item 4 below). This is to say that whereas the distance between one intercalary
    month and another could be graphed as a straight line for much of the time, a
    long-term (488-month) and a shorter-term (65-month) adjustment has to be made
    to the regularity of the pattern, or else the distance between the intercalary
    months will rather rapidly become too great.


    Let KY be the target kaliug year and EP be the epoch (starting year) of the intercalation
    scheme. We have found that EP = 1033 gives a good fit to the inscrional data.


    - (1) Assume the target year is KY 4001.

    - (2) Compute the difference KY - EP, the number of years elapsed since epoch;
    4001 - 1033 = 2968 years.

    - (3) Multiply the number found in item 2 by 12 (to give months), and divide by
    488, keeping the remainder:


    > Without adjustment the interval would be rigidly fixed at 33 months, as it is
    required to lie in the region of 35 months.


    It is typical of the Southeast Asian way of implementing the kind of adjustment
    required here instead of having one operand that would occupy several decimal
    places, the calculation is broken down into two stages. The Mainland year, for
    instance, may be represented by comprising 365.25875 days, but in Mainland notation
    this is represented by 29207 as the multiplier and 800 as the divider.


    here 2968 * 12 / 488 = 72, remainder 480.


    - (4) Divide the remainder found in item 3 by 65 and keep its remainder:


    here 480 / 65 = 7, remainder 25.


    - (5) If the remainder found in item 4 is greater than 32, then subtract it from
    66; otherwise subtract it from 33:


    here 25 is less than 33, so we have 33 - 25 = 8.


    - (6) Inspect the remainder found in item 3. If it is greater than 455, then increase
    the number found in item 5 by one unit:


    here 480 is greater than 455 and hence plus 8 plus 1 = 9.


    - (7) (and only if) the number found in item 6 is less than 13, the year will
    be intercalary and the given number (here 9) will be the intercalary month on
    the following:


    1=Caitra

    2=Waiṣakha

    3=Jyeṣṭha

    4=Āṣāḍha

    5=Śrāwaṇa

    6=Bhadradawāda

    7=Asuji (Aświna)

    8=Kārttika

    9=Mārgaśira

    10=Poṣya

    11=Māgha

    12=Phālguṇa


    We observe that in general one effect of this procedure is that over time it will
    have a tendency to locate the intercalary months earlier in the year than they
    would fall in the SurS system. This is in accordance with the inscriptional data,
    where the discrepancies with SurS reckoning imply that Java has intercalated ahead
    of SurS.


    It will be found (Appendix II) that whereas position D changes in shaka 817 month
    3 (Jyeṣtha), position E changes 40 years and 8 months later, in śaka 857 month
    11 (Māgha). Similarly the change last occurring before 817 month 3 was at position
    E in 811 month 10 (Poṣya), which was 5 years and 5 months earlier.


    By this process, when a month is intercalary for the last time in a sequence (e.g.
    Waiśākha in 828), there are 65 years before it becomes intercalary again (Waiśākha
    in 893).


    Two effects of this distribution are that when a month ceases temporarily to be
    intercalary, it is always the month immediately preceding it that takes over the
    role; and when a change takes place, it can never be the month coming next in
    the 19-year sequence (e.g. at position C after position B) that will change.


    We can say in general terms, then, that the problem of causing the lunar calendar
    to keep pace with solar calendar can be approached in at least three ways: (1)
    by the Indian method of making an intercalation as soon as one falls; (2) by the
    Mainland method of determining which seven years among nineteen should be given
    an extra month, and always doubling the month of Ashadha in the appropriate year;
    (3) by what we conceive to have been the Javanese method of allowing an appropriate
    mathematical construct to determine the frequency.


