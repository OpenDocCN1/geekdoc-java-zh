  md: '# SECTION THREE


    ![](img/572e553b27bc57bad71f5952fb2a2e0f_35_0.png)


    In a perfect world (where there were no errors at source, misreadings, and the
    difference between Indian reckoning and Javanese reckoning was fully documented)
    it would always be possible to drive a vertical line through our diagrams, one
    that would intersect at some point with all four horizontal lines, thereby demonstrating
    simultaneity.


    A68 is satisfactory from this point of view and A69 sustains itself for about
    the first hour of the day. But A70 exhibits quite a large discontinuity.


    It is, of course, in the nature of the system that the pancanga elements will
    slide differentially relative to one another. In the three diagrams above one
    can observe line two, the naksatra line, progressively slipping “to the left”.
    But it is also in the nature of the system that this motion has a concertina,
    or zig-zag, effect. The motion “to the left” will soon be compensated by a motion
    “to the right”. And in any case the correct elements are selected (e.g. 25: Purbabhadrapad
    and not 24: Śatbisaj in the case of A70), will never entirely lose contact.


    To pursue this matter for a moment: Harṣana has a lower bound of 173° 20 and on
    this occasion (see diagram) begins to take effect at 4gh47 at Ujjain. The moon
    then had a longitude of 323° 20.¹⁴ But because of the time difference Harṣana
    did not come into force until 10gh36 in central Java.


    +   14 The sun''s longitude at this time is of course added to the moon''s longitude
    at this time, to get a total that defines the yoga value.'
