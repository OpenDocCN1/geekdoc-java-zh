  md: '# APPENDIX I


    months later, in śaka 857 month 11 (Māgha). Similarly the change last occurring
    before 817 month 3 was at position E in 811 month 10 (Poṣya), which was 5 years
    and 5 months earlier.

    By this process, when a month is intercalary for the last time in a sequence (e.g.
    Waiśākha in 828), there are 65 years before it becomes intercalary again (Waiśākha
    in 893).


    Two effects of this distribution are that when a month ceases temporarily to be
    intercalary, it is always the month immediately preceding it that takes over the
    role; and when a change takes place, it can never be the month coming next in
    the 19-year sequence (e.g. at position C after position B) that will next change.


    We can say in in general terms, then, that the problem of causing the lunar calendar
    to keep pace with the solar calendar can be approached in at least three ways:
    (1) by the Indian method of making an intercalation as soon as one falls due;
    (2) by the Mainland method of determining which seven years among nineteen should
    be given an extra month, and always doubling the month of Ashadha in the appropriate
    year; (3) by what we conceive to have been the Javanese method of allowing an
    appropriate mathematical construct to determine the frequency.'
