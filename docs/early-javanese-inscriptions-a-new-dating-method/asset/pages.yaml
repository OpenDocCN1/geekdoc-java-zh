  md: '# APPENDIX VII: MISTAKES IN THE PANCANGA ELEMENTS


    We see a strong indication that the values for the pañcaṅga part of the inscriptions
    began as a triad of numbers—call them T(ithi), N(akṣatara), and Y(oga)—these then
    being translated into the equivalent names by reference to tables or as supplied
    from memory.


    If we reverse the procedure by converting, say, “śatabhiśanaakṣatra” into N =
    24, it is easy to compare the values given by SurS with the values as read in
    the inscriptions.


    In A70, for instance, we find N24 (śatabhiṣaj). But for the Y value we are given
    “hasta”, which answers to N13 and not, of course, to Y13 (vyāhātha). The yoga’s
    numerical value is correct, but here the name picked up is that of the equivalent
    nakṣatra.


    In our notation here “5s” signifies 5 waxing and “5k” signifies 5 waning.


    Examples:


    +   **A70**: titi daśami sulakpakşa (T10) śatabhiśanaakṣatra (N24)... has(t)ayūga
    (Y13).

    SurS: T10, N24, Y13. The author has supplied the nakṣatra name for the yoga with
    the same number.


    +   **A106** tithi caturdasi śuklapakşa (T14) hastanakṣatra (N13) shobhyagayoga
    (Y4)

    SurS: T14, N22, Y 4.


    +   **A117** tithi śaṣṭami kṛṣṇa (? T6k) hastanakṣatra (N13) dhṛtiyoga (Y8)

    SurS: T6, N3, Y13.'
