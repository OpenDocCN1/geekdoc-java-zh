    Mesha 882 Mar 22 12''23"| Mar 23 2''49" Adhika Vaisakha

    Vṛshabha 882 Apr 22 8''30"|Apr 21 26''42" Nijo Vaisakha


    It will be seen that the sun entered rā Mēśa on March 22 and did not enter the
    following sign until April 22; whereas there was a True New Moon on March 23 and
    another one on April 21st—two New Moons with the sun in the same sign, determining
    that the Indian True lunar month was to be repeated. Because of a difference in
    reckoning, however, Java had already provided itself with an extra month in the
    previous Mārgaśira.⁸


    One important principle to be grasped is that the day next after Monday cannot
    ever be Wednesday; and Thursday, 29 March 882 AD cannot either Wednesday 29 March
    or Friday 29 March, it is possible for two lunar dates to fall on a particular
    Western date and yet be different. Two years earlier, for instance, 2880 was Caitra
    5 for the Thai, but it was only Tagu 14 for the Burmese. The difference in reckoning,
    of course, comes from a difference of opinion as to where the extra lunar months
    and days should be inserted in the calendar.


    Here, in A58, the calendrical reckoning is in arrears for reasons that can be
    accounted for; but the reckoning of the nakṣatra and the yoga are in advance of
    one''s prediction, for reasons that we cannot recover or as result of a minor
    error in reading the appropriate astronomical tables that one supposes the scribe
    had to assist him in his work. There are, indeed, a number of cases where it is
    plausible to conjecture that a wrong row or column, even a wrong page, has been
    consulted. There is also documentary evidence (again from Thailand and Burma that
    a form of averaging was used in the immensely tedious business of compiling long-term
    almanacs, so the tables are


