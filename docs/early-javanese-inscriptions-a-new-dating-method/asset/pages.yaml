  md: 'they would follow orderly sequence from one day to the next until it became
    necessary to decide whether there should be a total of 29 or 30 in the given month.
    In the Mainland system in a “normal” (non-intercalary) year the sequence alternates
    strictly between 29 and 30 days, to give 354 days in the normal lunar year. This
    strictness was combined with the equally invariant rule Āśāda was the only month
    that could be doubled. With more flexibility as to which months could be doubled,
    it is likely that the Javanese system might require adjacent months both have
    29 days or both to have 30 days from time to time—but on a distribution different
    from the one Indian reckoning might dictate. The consequence would be a temporary
    one-day dislocation from what one would predict. As always with minor dislocations
    of this kind, a subsequent compensating difference will pull the reckoning back
    into place.


