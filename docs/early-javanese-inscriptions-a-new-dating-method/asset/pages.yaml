    From this is follows (1) that the text’s vox nihili «śaṣṭami» does not represent
    an error that can easily be corrected; (2) that it takes little in the way of
    corruption or of degradation to put a text beyond recovery.


    If we now turn, on the other hand, to the match between the soli-lunar date of
    the text and its wuku combination (wa po bu), this situation is somewhat more
    tractable. Our Rule of Thumb reckoning and SurS lie close together here: the Rule
    of Thumb predicts an extra month in Jyṣtha and SurS locates an extra month in
    Śrāwana:⁵⁴


    | Java | India |

    | 1st Jyeṣtha | Jyeṣtha |

    | **2nd Jyeṣtha** Āṣāḍha |

    | Āṣāḍha | 1st Śrāwana |

    | **Śrāwana** | **2nd Śrāwana** |

    | Bhadrawāda | Bhādrapada |


    We observe that the Rule of Thumb predicts an ordinary Śrāwana at this point,
    whereas we know that SurS observed a nija Śrāwana at this same point.⁵⁵ From it
    follows that for both Java and the next lunar month is Bhādrapada and the two
    systems will be back in phase with each other.


