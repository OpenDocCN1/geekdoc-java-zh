  md: '# APPENDIX III: NAKSASATRAS, YOGAS, AND RASI


    In the table opposite we map the nakṣatras, the yogas and the rāši against each
    other.


    Since there are 27 nakṣatras, 27 yogas and only 12 rāši several nakṣatras and
    yogas spread across more than one rāši, giving the inauspicious since they partake
    of more than one nature. Mṛgaśiras, for instance, starts by being “earthy” since
    it originates in Taurus, but then it turns “airy” because it finishes in Gemini.
    As a counterbalance to this they could also point out, at need, when the extent
    of a nakṣatra or a yoga is expressed in minutes of arc, the value is an auspicious
    800''.


    It did not escape their notice, either, that four lots of nakṣatra cycles and
    nine lots of rāši cycles both give a total of 108, another very powerful number.'
