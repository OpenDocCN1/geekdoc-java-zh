    When the configuration is somewhat "splayed" as here, it is common to find that
    the yoga is the element most out of line. The overlap of 15: Vajra with 13: Hasta
    was slightly less than 3 hours.


    We have, as usual, no certain way of accounting for the one-day difference in
    the reckoning here, between civil Vaiśākha 11 waxing and nija Vaiśākha 10. One
    possible mechanism, however, might be where the doubled Indian month (1st Vaiśākha)
    was perforce allotted 30 days, but the normal Javanese month (Caitra) was allotted
    only 29 days, as follows:


    | Java: | India: |

    |---|---|

    | Caitra 29 | adhika Vaiśākha 29 |

    | Waiśākha 1 | adhika Vaiśākha 30 |

    | Vaiśākha 2 | nija Vaiśākha 1 |

    | on to | nija Vaiśākha 10 |


    Whatever the mechanism, the discrepancy in such cases amounts only to one day
    and cancels itself in due course.


