    These twenty-five instances E90 and A172 have to be discarded. This leaves four
    (A116, A157, A173, A188) that are ambiguous; six (A129, A160, A174, A177, A179,
    A183) that seem to point away from the lagna, and thirteen seem to point towards
    it.


    If therefore we feel at liberty to include the ambiguous instances in our count,
    we have a total of some 71% of the evidence suggesting that the references to
    the rā are intended to mark the lagna. This being so, one would read “mṛcchikharśīlag”
    in A139 with some conviction.


    We may here add that A17-18 (śaka 772 Āṣāhā 2 waxing) and A30 (śaka 793 Śravana
    4 waning) contain the phrase “hana yy umahna / hana umahna”, which is taken to
    mean “while (the sun or the moon) is in its own house”. In these cases this reference
    would of course to be the object’s longitude.


    De Casper maintains “calculation of the dates in which the expression shows that
    not the lunar mansion ... is meant the [month''s] zodiac sign ... which is Karka,
    Cancer (at 90° to 120°).¹ He implicitly discounts the possibility that the phrase
    could apply to the sun, whose mansion is Singha (at 120° to 150°). But as will
    be seen from A30, that possibility needs to be kept alive.


    > ¹⁷ de Casperis, 1978, p.22.'
