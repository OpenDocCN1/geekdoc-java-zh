  md: '# THE PANCANGA SYSTEM


    since the function of the tithi proper was in any case absorbed by the karaṇa.⁵


    (2) The wāra

    This element is merely the weekday, but in Indonesia that seven-day component
    was already built in to the system of 6-, 5-, 7-day “weeks” that form a cycle
    of 210 days, itself divided into 30 lots of 7, the “wuku”. By contrast, the Lao
    and Northern Thai (but not the Burmese) borrowed the Chinese system of using combinations
    of a 10-day sequence which was kept down to a cycle of 60 (rather than 120) by
    not allowing even elements in the two sets to pair with odd elements. Even so,
    since the weekday was also combined with this 60-cycle, the entire system took
    420 days to rotate, so that no combination could fall twice in a year. The Indonesian
    system, having only 210 days in its cycle, allows some combinations to occur twice
    in the year.


    (3) The nakṣatra

    Inscription A116, by saying that the nakṣatra is Ārdrā, requires that the celestial
    longitude of the moon should currently lie between 66° 40’ and 80°. In short,
    the moon’s nakṣatra is its current longitude, divided by 13° 20’. And where a
    precise longitude is not known, as, here, the nakṣatra indicates the range:


    | mid-point 73° | | | | |

    |---|---|---|---||

    | 90 | 180 | 270 | 360 |

    | | nakṣatra Ardra, number 6, located between 66°40'' and 80° 00'' | | |


    ⁵ The useful chart in de Casparis, p. 56, shows the karaṇa coming into after about
    900 AD.'
