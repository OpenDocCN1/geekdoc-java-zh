  md: '# SECTION THREE


    Here Java’s lunar month Māgha is answered by Phālguṇa in SurS reckoning, the month
    following. The question is therefore whether Indonesia has inserted an extra month
    ahead of SurS? Our Rule of Thumb fails the test:


    | Java: | India: |

    |---|---|

    | Māgha | Māgha |

    | 1st Phālguṇa | Phālguṇa |

    | 2nd Phālguṇa | Caitra |


    Here the two calendars are still in tandem in Māgha, whereas our desired sequence
    is


    | Java: | India: |

    |---|---|

    | 1st Māgha | Māgha |

    | 2nd Māgha | Phālguṇa |

    | Phālguṇa | Caitra |


    The text causes the extra month to fall one month earlier than the Rule of Thumb
    would predict. However, it would only require that our Rule of Thumb’s rigid sequence
    of 33-32-33 between intercalary months be modified to an interval of 33-32-32,
    and this date would fall into place.


    If we peruse an argument by analogy here, then we may note in the Thai system
    the extra days were inserted, theoretically, at the rate of 11 extra days in every
    57 years, i.e. at intervals that were widely spaced. But in a valuable record
    known as “Astrologers Diary” (Diari Hon), it is recorded for CS / saka 1094 under
    Jyestha 29—the lunar date on which indeed the extra days were inserted—that this
    year and the next have extra'
