    be well pleased with an error amounting to less than 14gh00 in the reckoning;
    (4) but a scribe using tables that contain rounding or averaging would not regard
    Śatabiṣaj as being wildly off-line. For him him Śatabiṣaj and Purvābhadradapada
    are simply immediately adjacent items in one of the columns in his almanac, and
    Harṣana is the appropriate item in another column. He would be hard pressed to
    detect in strict terms there was a 14gh interval separating the nakṣatra from
    the yoga.


