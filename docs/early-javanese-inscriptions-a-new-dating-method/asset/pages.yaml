  md: '# SECTION THREE


    We have paid little attention in this study to the Ujjain - Java time difference,
    since it is rarely material to the argument. Here however, one notes that the
    Ujjain times for the astronomical tithi are increasingly bearing down upon 00gh00;
    they pass from 55gh 29 on waning, to 56gh32 at New Moon, to 58gh 48 on waxing.
    And when central Java is taken into account, the start of the tithi has already
    passed across the day following:


    | | 0''55 | 0''38 | 1''38 | 3''54 |

    |---|---|---|---|---|

    | 28.2 | 29 | 30 | 1 | |

    | Apr 2 13 waning | Apr 3 14 waning wu pa an | Apr 4 amavasya | Apr 5 1 wax |


    Even so, if one uses the Western date as the point of comparison (to which, of
    course the weekday combination is attached to April 3rd (wu pa an), the karaṇa
    28.2: Vanija is one day distant from it. The dislocation here, in short, is not
    a function of one’s failing to make the necessary adjustments.


    Some points one constrained to make in this context appear blatantly obvious when
    they are spelt out—but in an area seemingly as complex and unfamiliar as this,
    it would be rash not to be explicit.


    > A137: 945 asijima tithi nawami śuklapaksa pa po wr wāra ... wiśarodevatā drttiyoga
    kolawakāraṇa.


    mistakenly using the correct numeric value for the nakşatra to determine an incorrect
    yoga name. Since cross-matching occurs several times in the Javanese corpus, it
    lends strength to our argument that the authors of the inscriptions (or their
    informants) relied upon Tables to provide them with their astronomical information.'
