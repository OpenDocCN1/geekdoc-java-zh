  md: '# SECTION TWO


    For the purposes of tabulating the positions of the sun and the moon in astronomical
    almanacs a uniform time of day was chosen. On the Southeast Asian Mainland the
    convention was to tabulate calendrical values for midnight (despite the fact that
    the civil weekday was considered to commence at the 6 a.m. following). And when
    these calendrical days were accumulated into calendrical months they alternated
    strictly (in ordinary years, years without intercalation in them) between 29 and
    30 days to give 354 days in a lunar year.


    By Indian reckoning, on the other hand, the prevailing convention was to tabulate
    lunar values (tithi) for dawn, at 6 a.m.¹ The astronomical tithi in force at dawn
    then defined the day of the lunar month, in its waxing and waning halves. Here,
    then, is a potential contradiction: there are always 30 tithi in the month, but
    in some months only 29 days are required. This presented no great problem, however.
    Tithi might be in force at 6 a.m. one day, whereas tithi n+1 might be completed
    before 6 a.m. the next day. It was therefore suppressed and the next day would
    be defined by tithi n+2.


    When it comes, in turn, to the Indonesian method there is some evidence that some
    groups applied the tithi directly to term the calendar day. As will be seen the
    Indonesians adopted the karaṇa, which is half a tithi proper. Suppose (as indeed
    it is) that karaṇa “gara” is the first half of astronomical tithi 7 waxing. Suppose
    further that a record specifies that the “tithi” concerned is tithi 6 waxing,
    not 7 waxing. This is either a contradiction in terms or an indication that “tithi”
    defines the calendar day and the karaṇa defines the equivalent astronomical “day”.
    There are too many records that exhibit this supposed discrepancy for one to read
    it as. It is preferable to conclude that for some groups the term “tithi” was
    reapplied—as well as it be,


    > From these base positions finer adjustments of course can be made as required.'
