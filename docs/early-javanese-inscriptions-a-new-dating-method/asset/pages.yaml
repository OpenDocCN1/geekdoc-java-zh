  md: '# THE PANCHANGA SYSTEM


    presentation in their luni-solar dating. Our first task is therefore to explain
    how this information can be used analytically. To put the matter, first of all,
    in general terms.


    If an inscription specifies what nakshatra (lunar mansion) is involved, the moon''s
    position in longitude can be deduced to within 13° or so; if it also specifies
    what (astronomical) yoga is involved, the sun''s position can be deduced within
    a reasonable margin; and if the karana is then specified, its value (which has
    only 6° of extension) can be used as a control or check upon the two other values.
    Clearly, then, it behoves us to understand how these three elements operate. And
    since the mathematical relationship between them is not abstruse, this is no great
    hardship.


    (1) The tithi

    The tithi is the most difficult element to grasp conceptually. Its function is
    to measure the angular separation of the moon from the sun at any one time, this
    distance in degrees being divided by 12, with the fractional amount being expressed
    sexagesimally. Thus, if the moon was found to be 62 degrees distant from the sun,
    this value would generate tithi 5:10, or ten parts of 60 into tithi 6 current.
    Now, since the moon cannot be separated from the sun along the ecliptic by more
    than 360°, the division by 12 entails that there will always be 30 astronomical
    lunar “days” in a lunar month, and since it is unlikely that a new tithi will
    be exactly at midnight or exactly at 6 a.m., there will always be a clear difference
    between the astronomical lunar day and the 24-hour (60-ghatika) calendrical day.


    > 3 Where numerical expressions are involved it is always necessary to examine
    whether the notation is in units elapsed or in current. For instance, in South
    Indian records where the year number is usually accompanied by a Jupiter-year,
    it is demonstrable that some groups give the year as a year current and gives
    the year as a year (Year n elapsed is year n+1 current.).'
