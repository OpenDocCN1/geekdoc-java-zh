    It will be observed that in the 665 years covered, the intercalary month reaches
    beyond Kārttika only twice (śaka 1077 and 1218).


    On the occasions where “adhika” is written out (e.g. śaka 814), it will be found
    that it is closely preceded by “kṣaya”, and these occurrences always fall after
    Kārttika. This special added month rapidly compensates for the suppressed month.
    This procedure is noticeably different from the practice in Mainland Southeast
    Asia, where the days of the calendrical lunar month ignore the value the tithi
    may have on a particular day and simply alternate between 29 days in one month
