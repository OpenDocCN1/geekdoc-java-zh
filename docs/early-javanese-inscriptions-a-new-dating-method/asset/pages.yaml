    would be only 8: Paula. It would be necessary to correct this lag, which could
    be achieved by doubling the month either in Mārgaśira or more urgently in Poṣya.
    We know that the primary task of luni-solar calendar is to cause the sun and the
    moon to keep pace with one another. But there is of course a secondary function,
    which is to cause the moon''s astronomical location (measured by the karana) to
    stay in touch with the lunar calendar (measured by the tithi).


