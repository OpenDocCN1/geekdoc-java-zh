  md: '# SECTION ONE


    recoverable with complete certainty. It is this “pañcaṅga” system that provides
    a further useful means of checking the inscriptions.³


    We state here, once for all, that we do not contend or imply that SurS reckoning
    was the system “really” in force in Java.⁴ There is clear evidence to the contrary.
    The intercalation system of SurS (its insertion of extra lunar months into its
    calendar) confines itself for most of the time to the months Vaiśakha to Kārttika
    (inclusive), whereas the Javanese intercalation system extends across the entire
    year. Where the Javanese record implies a difference from SurS as to the particular
    month that has to be doubled, it has a distinct tendency to insert the extra month
    sooner than SurS procedure would dictate.


    We have therefore used a two-fold mechanism:


    +   (1) we have adopted SurS as a benchmark by which to assess the early Javanese
    record, and regarded differences of up to one day, either plus or minus, providing
    a satisfactory match. The match is satisfactory in two respects: (a) it serves
    to distinguish between minor dislocation and gross error; (b) it is the best one
    can achieve in a situation where there is no indigenous treatise to


    > ³ Damais (4, 4-5) indicated that he did not make use of this pañcaṅga system.
    Where he feels obliged to do so, he emends the weekday reading, but he never takes
    account of what challenge to change the pañcaṅga system might provide, whereas
    it offers at least as strong a check on the date in the weekday system, and in
    principle has at least as strong a claim upon attention. Damian deals with 2-letter
    abbreviations of the names and numbers that are often hard to read. The pañcaṅga
    system spells out the months of nakṣatras, the yogas, and the karanas, thereby
    giving a greater purchase over the text.


    > ⁴ We are aware that reference to “Java” at large skirts issues of history, geography,
    and politics, to to say nothing of epigraphy and linguistics. We, however, are
    not competent to make distinctions at these levels, and maintain that the wuku
    system could not be subject to local variation and idiosyncrasy, so the astronomical
    computation system must have been stable across regions and over time.'
