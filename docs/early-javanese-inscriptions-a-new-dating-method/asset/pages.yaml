  md: 'Now reverse the direction, go from central Java to Ujjain, not from Ujjain
    to central Java. At 4gh47 in central Java (58gh58 at Ujjain) the moon will have
    reached 322° or so, but this is a difference of scarcely more than one degree.


    It follows from this observation that the time difference has very little effect
    on the actual position of the moon; and of course it has no effect on the relative
    positions of the pañcaṅga elements. You cannot modify one element among them without
    adjusting the other elements.


