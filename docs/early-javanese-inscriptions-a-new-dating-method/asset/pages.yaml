  md: '# APPENDIX VI


    In the case of A17-18 at the time the sun was at 81° and the moon was at 93°—which
    indeed places the moon in its mansion. But in the case of A30 (though the text
    is problematic) the moon is expressly said to be in “rewatinakṣatra”, which runs
    from 346° to 360°—and is so far removed from Karka—whereas sun was then indeed
    in rāshi Śha, i.e. in its mansion.


    The evidence is too slight to provide us a clear guide. The best that one can
    say is that one would expect “hana uyajna” to apply equally either to the sun
    or to the moon, though not to a planet since the Javanese system clearly takes
    the two “luminaries” most into account.18


    It is notable in South-East Asian documents that the highly formulaic mode in
    which astronomical data is presented the reader is assumed to know, from the position
    of an item, what its function is. And for that matter the constraint still applies


    For reasons best known to themselves the Americans use “2 / 3 / 97 to mean 3 February
    (i.e. month / day / year). More rationally, “2 / 3 / 97” would mean 2 March (i.e.
    day / month / year). In short, to read the code, one needs to know in advance
    the system used by the society operating it. And with the Javanese record, except
    for the weekday and pañcaṅga systems, much remains a mystery.


    > Luminary is a convenient term to adopt from English astrological parlance, where
    it was used to distinguish the sun and the moon from the rest of the “planets”.
    The use of “planet” as applied to the sun is of a course of reflection or hang-over
    from geocentric thinking.'
