  md: '* the alternate months Vaisakha, Ashadha, Bhadrapada ... shall have 30 days
    in them (and 7 times in 19 years the extra Ashadha will also have 30 days in it);


    * where a month is required to have only 29 days, it shall always be the waning
    half of the month that has only 14 days, 15 days. The waxing half of all months
    shall have 15 days in it.


    A run of three lots of 19 years will therefore total 20819 days (6940 + 6940 +
    6939 days).³ Theoretical rules for determining where the extra months and extra
    days should be built into the initial calculations for each given year, and insofar
    as any calendrical computation system can be described as “simple”, this one qualifies
    for that title.


    The more meticulous Indian system, on the other hand, works upon a foundation
    that is logically prior to these “rules”: there is, for instance, not a single
    month that does not at some stage or other have only 29 calendar days in it.


    In the chart label “A” marks those months that the first of the two months had
    only 29 days in it , whereas “A*” indicates that the first of the second of the
    two months was so treated. Months of type “*A* also occur.⁴


    > ³ The placement of the smaller total would depend upon which of the three sequences
    was thought to require only 3 extra days, not 4 extra days.


    > ⁴ The system is, of course, based upon calculation not observation, but it is
    nonetheless planetary behaviour that determines the distribution. In the Mainland
    equivalent (and, by supposition, the Indonesian equivalent) on the other hand,
    a second-phase manipulation of the data (a mathematical averaging) was put in
    place that makes the procedures more tractable. Both modes require a distinct
    level of expertise, but the “mathematical model removes a certain amount of tedium
    from the operations. More importantly, it also absolves the operator from needing
    any conception at a theoretical level of how to proceed.'
