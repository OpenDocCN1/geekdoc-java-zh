  md: '# APPENDIX II


    intercalations.² Where a bold letter appears inside a box, it indicates that the
    position of the month has changed since the last cycle. No two shifts can be adjacent
    in the sequence, but more than one shift can occur in a given cycle (“B, D, F”
    in the cycle beginning śaka 808). The Javanese shift is always one lunar month
    backwards, and though the two systems move independently of each other (as they
    must, since they are based on different principles), the Javanese month never
    chances to fall later than the SurS month.³


    Certain of the inscription numbers are themselves entered in bold face. The intention
    here is to indicate where invoking our reconstruction (our “Rule of Thumb”), causes
    the inscription to fall into place. Thus, re śaka 804:


    “F .. A58 .. F:


    This indicates that the subsidiary information in the inscription is used to determine
    a Western date, then the SurS equivalent falls one lunar month later than the
    month given by the inscription. The two systems are not in phase. The “F” at Mṛgaśiras
    803, however, indicates that Java intercalated at this point, so that until the
    “F” at Vaiśāka 804 the Javanese month name is one in arrears of the SurS month.
    A58 falls within the period when the two calendars were not in phase.


