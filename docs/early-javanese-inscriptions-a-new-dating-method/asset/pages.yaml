  md: '# SECTION THREE


    record would surely have been even worse than it is.


    Generating data for lay use was inescapably a highly tedious business, calling
    for rounding, averaging, and acceptable shortcuts in the production of charts
    or almanacs. When the scribes read these charts and almanacs, it is easy to imagine
    that placeerrors of plus or minus one would be easy to make; and one kind of error
    that one encounters the record tend to lie within these boundaries. On the other
    hand, errors of a larger dimension (e.g. atiganda for gaṇa; or vaidhrīti for dhriti)
    are clearly misreads calculation errors.


    We can, for once, insist upon a principle here. If the yoga ought to be “gaṇda”
    at 120°, a wild calculation error could let in any number of alternatives. But
    if the yoga actually let is in “atiganda” at 66°, this more likely to be a misreading
    than a calculation error of 54°¹⁶


