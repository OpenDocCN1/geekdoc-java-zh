  md: '# THE LENGTH OF THE LUNAR MONTH


    With reference to the 29-day months (*), the chart indicates (extreme right) that
    there are sixteen years in which six of the months are so organised and that all
    the years containing an extra month fall into this class. The three other years
    have only 5 29-day months.


    Thus, in the whole cycle of 235 months, 124 months have 30 days in them and 111
    months have 29 days. This gives a total, in this cycle, of 6939 days.


    In the Indian system the only element that could be codified into a “rule” seems
    to be that there are never four successive months of the same type. For the rest,
    it is impossible to deduce a pattern in the distribution.


    We consider it likely that the Javanese system of reckoning bore a closer resemblance
    to the Mainland mode to the SurS mode. And though, on the evidence, we cannot
    deduce exactly what mode was, it seems very likely that the frequent one-day difference
    between SurS reckoning and Javanese reckoning may be imputed to using a more formalised
    method of distribution, perhaps along lines similar to the Mainland procedure.7


    > 5 Not even the apparent “rule” that if a year has an extra month will contain
    six 29-day months, not five, holds good. It is broken, for instance in saka 812.


    > 6 This can only be supposition, but it is strengthened by two factors: the clear
    evidence that Java did not replicate the SurS mode for adhikamsa (insertion of
    extra months); and the high probability that any exported calendrical system would
    be subject to simplifications of the kind demonstrable in the Mainland system.


    > 7 We do not isolate the frequent one-day difference to this factor alone: it
    has several other potential explanations, one of which can be invoked with any
    certainty at any time. The saving grace is that the difference bears a marked
    tendency to be confined to only one day. In the Indonesian data (for some reason)
    the difference also bears a marked tendency to be a lag not an excess. One anticipates
    that the day will be a Wednesday, if it is not a Wednesday it is more likely to
    be a Thursday than to a Tuesday.'
