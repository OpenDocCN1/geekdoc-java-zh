    In the Thai and Burmese record there is a greater profusion of precise astronomical
    detail (solar and lunar positions correct down the nearest minute of arc) and
    a fully recoverable theoretical apparatus. There is no reason in principle to
    suppose that the Javanese astronomers were any less expert than their Mainland
    neighbours, one''s inability to match the Javanese record with an equal precision
    must be put down to the physical condition of the originals and to the lack of
