  md: '# SECTION TWO


    (4) The yoga

    By saying that the yoga is Vyatipāta, the inscription requires that if the moon’s
    present longitude is added to the sun’s present longitude, then the sum of the
    two values will lie within a segment of the ecliptic whose lower bound is 213°
    20'' and whose upper bound is 226° 40''.


    (mid-point 220°)

    0 90 180 270 360

    vyatipata yoga, number 17, located between 213°''20'' and 226° 40''


    The lower bound of each yoga expressed in minutes of arc is evenly divisible by
    800, i.e. by 13° 20'':⁶

    Even without computer assistance or detailed calculation, could therefore map
    the upper and lower bounds of the nakshatra and the yoga against one another to
    derive approximate positions for the sun and the moon at the given date. But with
    computer assistance, of course, no such approximation is necessary.


    Consider, too, that there is a (no. 6) called Atiganda but another (no. 10) called
    Ganda; there is a yoga (no. 8) called Dhṛti but another (no. 27) called Vaidhriti.
    If a given record the yoga was said to be one and found that only 7: Sukaraman,
    8: Dhṛti, 9: Śula could possibly be in play, this would be enough to determine
    that the reading “Vaihriti” should be amended.


    (5) The karapa

    This entity is a sub-unit, half the value of an astronomical “tithi”.


    +   ⁶ Note that 13 deg 20’ expressed as minutes of arc = 800; where the measure
    of 800 units is a major base of reckoning. Since 27 times 800’ = 360 degrees,
    one can see why the number of nakshatras adopted was 27 and not 28.'
