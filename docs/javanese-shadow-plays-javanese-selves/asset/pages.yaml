    does not proffer solutions to such problems. If conflicts between, say, loyalty
    to one''s kin and the pursuit of kakuwatan batin in asceticism arise in the course
    of some lakon, such conflicts never become central problems around which a performance
    is organized. When, for example, a relative of the Pandawa disappears mysteriously,
    as Arjuna in Senawang, and it turns out on his return that he was attaining great
    powers through asceticism, his new powers enable him to defeat the enemy that
    has put his relatives in jeopardy. The crisis is resolved, but not much stressed
    by the intrinsic tension between kinship solidarity, in Java, and responsibilities
    to batin, which are also found compelling.


    Actually, whatever issue motivated the first part of a performance—usually the
    topic discussion in the long opening scene—is often left unresolved or obscured
    later in the performance, receiving only cursory attention before the performance
    ends. What was critical from nine to midnight might be unimportant by three, when
    a new series of events is initiated. Form is inflexible, and content often constitutes
    a running series of events, rather than a cumulative one.


    Instead of searching for a core of meaning in a particular lakon, therefore, or
    in a particular rendering of it in performance, I think it more fruitful to examine
    repeating patterns in plot and character, and, too, in the reception of performances.
    I take this approach of wayang, as we demand great drama in the West, imposes
    demands upon it that are at best irrelevant, or worst fundamentally misleading.
    A few classical lakon (e.g., lakon about the origin of rice and the Murwakala
    lakon used in the ruawatan ritual) seem to be susceptible of closer analysis because
    they originate in Javanese myths. Such an analysis is not to the point here, however.
    Particular turns in plot must be considered, not in terms of a single lakon, but
    rather in the repertory of conventions that crop repeatedly. I will first discuss
    a few such conventions for the ways they reflect critical concerns of Javanese
    culture for which I have already commented: the self and status, encounter, and
    power. In these areas, wayang suggests alternatives to the ways they are in life,
    as it is experienced and/or as it is conceived. But it does not do


