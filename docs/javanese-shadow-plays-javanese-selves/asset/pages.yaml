    # Sabetan


    The manipulation of the puppets is called sabetan. Anyone new to wayang can only
    marvel at the variety and subtlety of effects a good dhalang can achieve in the
    manipulation of the leather puppets, which are joined only at the shoulder and
    elbow.5 Ingenuity and dexterity abound in the routines dhalang devise, especially
    in battle sequences, and audiences move with avid interest. The battle between
    a dhalang and a monster (usually the fanged monster, Buta Kakil), which takes
    place in virtually every performance sometime between two and three in the morning,
    provides a dhalang a special opportunity to display sabetan. In this battle, the
    monster threatens the knight with his sword increasingly frenetic efforts to win
    out the knight''s perfect self-control, the monster loses his kris to his opponent.
    The knight delivers the ultimate humiliation, stabbing the latter''s own kris,
    and the monster dies. A less spectacular but still critical aspect of dhalang''s
    sabetan is his ability to make each way move in a manner appropriate to his temperament,
    illustrating his refinement, ecstasy, impetuosity, or whatever. A fundamental
    rule of sabetan is that the dhalang must try never to let his hand cast a shadow
    upon the screen. Another way in which he must maintain the illusion of the puppets''
    independent motion is to hold them well away from the screen when picking them
    up or putting them down.


    While good sabetan is appreciated by an audience, it is considered among dhalang''s
    skills. The most popular dhalang in Java today, K1Nartosabdho, had only rudimentary
    sabetan for many years. His skill has improved in recent years, but even when
    it was judged inadequate by most aficionados, it did not prevent his attaining
    great popularity, thanks to his other talents.


