    and how one wishes to define one''s relation to them.


    The range of behavior characteristic of Javanese lurah is certainly not exhausted
    by the three headmen I have discussed. There exists in particular a very different
    kind of authority figure: the abrupt, energetic, direct, and unrefined one. In
    the Javanese arts, such figures are sometimes ridiculed, but they are often much
    loved and admired by the populace. In politics, the popularity of the Indonesian
    Communist Party in the early sixties stemmed from part in its leaders'' reputations
    for honesty, frankness, and willingness to appear openly hostile, qualities that
    contrast with the discretion and alliveness of refined behavior. More recently,
    military figures who have acted in a decisive and arrogant manner have no respect.
    People seem to feel that anyone can risk offending so many people and rousing
    such hostility must be spiritually strong. otherwise, he would feel revenge-takers.
    In the late sixties and early seventies, especially, the militaristic style, intimidating,
    manipulative, and displin (''disciplined''), was evident in soldiers and bureaucrats
    alike. I have concentrated attention on another conception of power, that exemplified
    by the respected elder, because political people try to normalize their political
    relations by falling back on safer methods. Some young people feel the need for
    more innovative leadership. Other people, recalling the excitement and then the
    terror of the sixties, want only that things be uneventful and calm (slamet, tentrem).
    Actually, the pressure on lurah to play the part of respected elder may be greater
    now, in the aftermath of the sixties, than it was ever before.


    By stressing that understanding of power that sees it in the unruffled harmony
    and prosperity of a village''s inhabitants, as demonstrated in the activity and
    directives of its leaders, villagers try to balance off their wants: to insulate
    themselves from political pressure while gaining by the power—spiritual, financial,
    or whatever—that political authority implies. They try to make of political authority
    a potent center, rather than a coercive agency.


    It is not that villagers want idle lurah. They want signs of development as new
