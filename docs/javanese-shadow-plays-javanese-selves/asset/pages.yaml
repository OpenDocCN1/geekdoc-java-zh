    At a certain point, the distinction between father and guru diminishes. When the
    father nears death. Possession of certain varieties of ngèlmmu, particularly magical
    formulas (aw-ay) that grant their user invulnerability, is believed to prolong
    a person’s death agon. The pain continues excruciatingly while the person longs
    for death but, too potent, cannot die. Some informants called this “God’s tortures,”
    punishment for having arrogated to oneself, through esoteric knowledge, powers
    rightfully exercised by God. An older person avoids such when he throws out (ngguwak)
    and casts into water (nglabuh) such ngèlmmu. Informants’ accounts of how to do
    this varied. Almost all agreed that a man could go to the banks of a river at
    night, give offerings to spirits, repeat the magic formula, and then announce—“I
