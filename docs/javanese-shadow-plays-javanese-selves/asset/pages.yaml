    and discipline, than the punawakans'' forthright expression of gut feelings. They
    enjoy, precisely because of their humble status, a freedom of action unique among
    all wayang figures. They escape social constraints not by centering poetry, as
    characters do when they are malih, but by abjuring all claims to status.


    The punakuan are all that is not caught up status and language. They can mock
    each other, argue, and have fight-fights. They can fight against their enemies
    using trickery, farming tools, and ever excrement. Sem often uses his great flatulence
    to lay an opponent low. They can sing and dance, beg for money, and express their
    fears. They do all these things because they need not protect their status. They
    have no status. They are dependents.


    The punakuan are also exempt from time and history. They are servants to all the
    heroes from the Ramayana through the Mahabharata. Whereas their masters are linked
    in long genealogies, the punakuan are virtually without genealogy. And very little
    happens to them. They are married, it is true, and a few lakon revolve about their
    own adventures. But one never sees their wives or children. They have no social
    context aside from each other and their masters. They are both thoroughly constrained,
    because they are servants, and virtually without constraint, because they have
    no status to protect. Perhaps the clearest indication of their lack of status
    is that they, alone among the figures in wayang, can be made to use any words
    at all, from Indonesian, even Dutch or English (fractured), whereas at all other
    times ahalang must be careful to avoid anachronistic and foreign usages.


    Representations of the punakuan evoke the casual, humorous interaction of Javanese
    youths, who need concern themselves with their dignity and obligations less than
    their elders. Such scenes, however, do not reflect a stage in a Javanese male''s
    social career. The complete dependence of the punakuan on their masters means
    that they enjoy a security Javanese society does not afford commoners today. They
