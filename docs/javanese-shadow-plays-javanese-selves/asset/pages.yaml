    # PATRONS, SPEECH, AND AUTHORITY


    Two issues converge in the subservience implicit in vows. One concerns patrons
    and clients, the other fathers and sons.

    In Java, people who without means have traditionally held the option of thriving
    in their lot with a person of superior wealth, status, and power. In doing so,
    they compromise claims to status they might have on their own. Any such claims
    they would then make have to be phrased in terms of their privileged relations
    with some powerful figure. When I spoke to Mas Sulis, Pak Lurah Karangan that
    he alone sharecropped Pak Lurah’s land. This turned out not to be true. Pak Lurah
    granted Mas Sulis more favors than any other person in the village, but a few
    other men worked of his salary lands (lunggah) at times. They, too, however, minimized
