  md: '# 6 INTRODUCTION


    dickering is occasionally protracted, but it must be done with discretion, since
    the relations between dhalang and their sponsors must never be thought to resemble
    those between buyers and sellers at the market. When an agreement has been reached,
    the dhalang is given some portion of the fee as a retainer. In this case, Ki Cerma
    was performing in the house of people living in a village near him. He agreed
    to a fee somewhat lower than his usual one because neighbors are expected to put
    relations above financial interests.


    Several days before the performance itself, in anticipation of the many guests
    who would come before and during the performance, relatives and neighbors gathered
    to help the sponsors in their preparations. Men first took the front off the house.
    The front of older-style Javanese houses consists of a long row of wooden doors.
    These are removed and the floor and roof extended to accommodate the gamelan and
    musicians when a performance is to be held, or simply to accommodate guests when
    a ritual celebration is held without any type of entertainment. Plated coconut
    palm leaves were put up to decorate the open sides of the performance area that
    extended into the yard, and mats were unrolled to cover the floor (In newer, Western
    houses, the wall is made of cement, and only the windows can be removed to permit
    casual spectators a view of the performance) Inside, the screen was set against
    two of the wooden posts that support the roof of a traditional style house, beneath
    the screen were banana trunk runners in the puppets were secured. Chairs were
    set up in the area behind the screen, closer to the inner section of the house,
    so that invited guests who came to see the performance would be able to watch
    it on, the more prestigious side, where shadows rather than the puppets were visible.
    Traditionally, and still in some villages near Jogja, there were not chairs but
    mats spreads on the floor below the screen, where invited guests sat.


    Behind the house, in the kitchen area, women had cooked enormous quantities of
    food to serve the many guests. People who came before or during the day of the
    ritual celebration to contribute money toward the costs of the event, as well
    as those who came to see the performance itself, were served snacks with tea,
    rice with sidedishes, and again snacks and tea. A small army of women prepared
    these refreshments, cooking day and night from long before as well as'
