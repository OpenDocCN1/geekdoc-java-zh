    A successful dhalang has a fairly stable group of players who accompany him whenever
    he performs. A less active one knows where to find musicians to call upon when
    needed. These usually include brothers, uncles, cousins, sons and/or nephews Traditionally,
    a dhalang''s musicians were members of his immediate family, both male and female,
    and his wife played the gender.(One reason a dhalang''s son was pressured to marry
    a dhalang''s daughter rather than a peasant''s was in order to avoid having to
    hire a gender player). More recently, though, the ponderous Victorianism that
    the Javanese think modern has led people to fix sexes among musicians inappropriate.
    The lamentable results are the elimination of all female players from village
    performances of wayang, and the proliferation of gamelan groups for bourgeois
    ladies, “ibu-ibu,” in town (I say lately traditional source of income, however
    minor, closed to them, while city ladies do not deserve the astonishing amounts
    of radio time given over their embarrassing attempts to pick out tunes on the
    most basic instruments of the gamelan). In any case, a wayang usually requires
    seven or eight musicians, and a very fancy performance would draw upon the talents
    of twenty or more.


    The dhalang control of his troupe is at once total and covert. The musicians must
    be responsive to a variety of subtle cues the dhalang gives them. The number and
    rhythm of raps he gives with a wooden mallet (cempala) at the outset indicate
    which of certain long musical compositions (gendinghang) will accompany the opening
    scene. At other points in the performance, the musicians must discern in some
    phrase the dhalang utters reference to the title of a gending he wishes to play.
    These allusions are sometimes obvious, at other times quite subtle, though most
    are fairly conventional.² Other signals, of which the dhalang gives with the heavy
    metal plates (keprak) he bangs with the mallet held between his toes, some with
    the mallet held in his hand, still others by singing a particular note, induce
    the musicians to play sections of set pieces (e.g., battle music), or to stop
    playing, on very short notice. The drummer may vary


