    that is, lakon that relate critical events in the two epics, the Ramayana and
    the Mahabharata, on which ways are based. Others are lakon carangan (from carang,
    “branch”), and still others karangan gnancar. The distinction between the last
    two categories is moot: I will refer to both as secondary lakon. The important
    contrast is between lakon that actually advance the action of the epic cycles,
    and those that depart from them without actually developing or contravening them.
