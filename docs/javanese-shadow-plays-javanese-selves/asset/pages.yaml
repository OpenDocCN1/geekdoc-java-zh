  md: '# INTRODUCTION II


    either side of the screen. Invited guests were served individual portions. Had
    the sponsors been wealthy, each guest would have received a little paper plate
    or even a cardboard box of snacks, but these sponsors had only modest means and
    served only the usual cylinders of sticky rice with a bit of spiced meat inside
    (lemper) and a little piece of cake. For the musicians, peanuts fried with garlic,
    flat cakes of coconut and rice, brilliant pink cupcakes, leper, and several other
    kinds of goodies were piled high and laid on the mats among the instruments for
    the musicians to snack on throughout the night. The dhalang ate nothing, drinking
    only occasional sips of tea from a glass to his right. He did smoke strongly flavored
