    ideological precepts and practical patterns of avoidance show distrust of the
    impulse to compromise one''s sovereignty in dependence upon or submission to a
    powerful figure. At the same time, such figures may resist people''s attempts
    to claim upon them. I have discussed the nature and workings of such ambivalence
    in relations between fathers and other family members, and between lurah and villagers.
    Kebatunan, all the beliefs that concern potency and the imperceptible world, present
    Javanese with alternative sources of assistance when special needs or aims arise,
    and these are the subject of this chapter. I will begin, however, by discussing
    popular notions about territorial spirits (dhanyang), since these epitome the
    conflicting Javanese reactions to power.


