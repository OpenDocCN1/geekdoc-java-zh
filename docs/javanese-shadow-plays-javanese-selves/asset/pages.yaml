    When sponsors invite a dhalang and his troupe to perform at a ritual celebration,
    the guests'' attention is further distracted away from the sponsors. The performance
    once again disassembles and enhances the sponsors'' aura of authority, as the
    sponsors seek to make the dhalang''s voice will win the guests'' voluntary, yet
    total, submission. Relations between the sponsors of a wayang and the dhalang
    who performs it, however, are complicated. Is their authority shared, or are they
    instead locked in competition? The status of dhalang in Javanese society has been
    mooted, and the problem reflects ambiguity about the status of a dhalang, relative
    particularly to his sponsors. Not surprisingly, estimations of his status vary
    according to the status of the informant. Above all, it is because the nature
    of a dhalang''s authority is so equivocal that such estimations of his status
    vary from something quite exalted to something close to that of the much-scorned
    musician.


    At the same time, the dhalang himself plays on contrasts between his total control
    and the dissimulation of his voice and person in his performance. The constraints
    he must observe and the criteria by which he is judged press him to exert his
    authority by disassembling himself, and in this way, the dhalang repeats the pattern
    of exerting power while disulating his authority. The diverse and even contradictory
    images of authority I have discussed in the previous chapters coalesce, in fact,
    in the particularly ambiguous and imposing figure of the dhalang.


