    # THE FAMILY


    Javanese conceive of the relationship between husband and wife in terms of his
    authority and her financial control. On the affective aspects of the relations
    between spouses, Javanese are far less romantic than Westerners. Passion is never
    thought really appropriate to marriage. To be gandrung (“mad with love”) implies
    instability and probable sorcery. Instead, tresna, an abiding devotion to Poerwadarm
    defines as “affection, generous feelings for another person (without desire)”
    would characterize the tie between husband and wife. Often, the affection seems
    real as strong as in any stable Western marriage. Nevertheless, the enormous warmth
    and solicitude that mark Javanese interaction with very small children contrast
    sharply with the restraint and even brusqueness that obtain spouses.


    Sexual activity is inhibited for as newlyweds live with one''s parents, and again
    as soon as there are children. Traditionally, newlyweds were supposed to wait
    forty days after the wedding before consumating their marriage. If the couple
