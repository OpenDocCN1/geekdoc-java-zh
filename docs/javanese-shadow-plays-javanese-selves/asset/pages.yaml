    # STATUS, POTENCY, AND WAYANG


    Issues of style, status, and potency underlie the relations between characters
    and many turns of plot in wayang. Time-honored opposi-tions in style and status
    distinguish the characters in wayang with even greater clarity than in social
    life. All characters are marked by distinct types of eyes and noses, degrees of
    distance between the feet, kinds of dress, and qualities of voice, all of which
    establish both the status and general temperament of any character.³ It is a system
    of pertinent opposition and the fact that it differs from other possibilities
    within a delimited range. And one trait tends to imply others. The pitch of a
    character’s voice, for example, depends on the angle of the tilt of his or her
    face, and the higher the puppet’s gaze, the higher is its voice. In this as other
    respects, the primary distinction is in degrees of refinement, and Javanese culture
    is weighted normatively toward what is refined (*alus*) over what is crude (*kasar*).


    Status, regardless of style, is also critical to interaction in wayang,


