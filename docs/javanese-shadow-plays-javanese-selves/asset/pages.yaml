    The dalang becomes the central figure at a ritual celebration from the time he
    starts performing until he stops eight or nine hours later. During this time,
    the sponsors recede discreetly into the background as an unseen crucial force.
    Yet if the dalang appears in some respects obvious, even flamboyant, in his performance,
    the active agent of an evasive authority, much about the dalang repeats the play
    of power both constraining and restrained, pervasive yet disassembled. Actually,
    more diversely and dynamically than in relations between dalang and sponsors,
    the links between the dalang and his troupe, the dalang and the wayang tradition,
    and the dalang and the audience play on degrees and kinds of authority. I will
    discuss each of these relations in turn, reserving the last-mentioned—the relations
    between the dalang and the audience—for the next chapter.


    # THE DHALANG AND THE TROUPE


    Before World War II, at least outside town, a wayang was a much less elaborate
    affair than it is today. The gamelan consisted of only a few instruments, and
    there was no female vocalist (pesindhèn). Classically, wayang was performed exclusively
    in *sléndro*, but recently it has become fashionable for a sponsor to rent a gamelan
    with both *sléndro* and *pelog* components. In that case, dalang then plays a
    few scenes in *pelog*, though most of a performance continues to be performed
    in *sléndro*. If the sponsors do not rent a pelog set, a fairly complete pelog
    set at least, is thought essential, and the absence of a *pesindhen* would strike
    everyone as aberrant.


