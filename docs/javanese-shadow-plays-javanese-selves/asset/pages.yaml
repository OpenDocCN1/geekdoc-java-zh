    tween classical verse and its readers. Traditionally, all Javanese literature
    was written in sung verse, called tembang. There exist several different tembang
    forms, each with a distinct name and each distinguished from the others by the
    number of lines to a verse, and the final vowel sound in each line. A Javanese
    reader traditionally read, that is to say, sang, aloud. Only rarely did anyone
    read literature in a speaking voice, and Javanese do not, as a rule, read silently.
    But readers choose to sing the tembang following vocal line they wish. Several
    well-known vocal lines exist for each type of tembang, and some among these are
    thought suitable for particular moods. But those decisions are left to the reader.
    A text indicates at most, at the beginning of a series of verses in a particular
    form, and the nature of the verse form that follows. Often it is instead left
    to the reader to discern the meter without benefit of such overt references. Having
    elected to sing a verse with a particular vocal line, readers also embell each
    phrase with variations or decorations (cengkok). Their use, again, is a matter
    of personal taste and skill. In public performance, singers will extend their
    rendering of a single verse with elaborate displays of their vocal technique Simpler,
    less highly worked versions of each tembang are thought more suitable to the reading
    of longer sections of classical texts. In either case, however, readers must be
    able to vary their reading with these graceful and well-executed additions.


    +   The art of reading in Java is in decline today, and it goes popular knowledge
    of Javanese literature. A few city still cultivate the performance of tembang.
    In villages, traditionally, tembang and the related kidung were sung by individual
    guests at a gathering of males (jagoan) for several nights after a woman gave
    birth, in order to protect mother and child from harm. Two developments have virtually
    erased this practice. The failure of the public schools to teach children script
    means many of the texts available to villagers are ineligible to most people under
    age forty. Furthermore, radios are numerous in villages, and at a jagongan holding
    a child''s birth, a radio blares while the men play cards.


    Young people may know them but they do not. In fact, there is a peculiar version
    of illiteracy in Indonesia today, concentrated among relatively highly educated
