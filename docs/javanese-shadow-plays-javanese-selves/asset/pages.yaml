    The dissimulation of exertion at the center, whether of kingdoms, of villages,
    or even of families, is necessary to maintain impressions of a respected figure''s
    power and prestige. It is in terms of this conception (of what might be called
    the dissembled center), that I wish to discuss the roles of the sponsors and the
    dalang at a ritual celebration. The important and problematic fact about these
    events is that they are occasions in which "center" is occupied by two such different
    kinds of central figures: the ritual''s sponsors and the dalang. Their simultaneous
    presence is made possible by their distinctly different comportment, the sponsors
    appearing reticent, the dalang in contrast commanding and even overbearing. This
    difference becomes particularly clear in the relations they enter into speech:
    the sponsors say nothing, whereas the dalang speaks all. The principles motivating
    their respective behaviors turn out to follow equally from Javanese ideas of power
    and its necessary disembembrance.


    A ritual celebration enables householders, as sponsors, to assume a position of
    importance and authority, though only temporarily and only within the limits of
    the ritual context itself. The notion of disulated power shapes the relations
    between the sponsors and their assistants and guests because it encourages the
    former to seek people''s attendance while minimizing impressions of their overt
    control over them. Principles of reciprocity assure cooperation between sponsors
    and assistants, but with their guests, sponsors have other intermediaries substitute
    for them. In particular, these people take on the sponsors'' voices. If the sponsors
    decide to hold a wayang, the dalang performs this function especially grandly.
    But he, too, simulates control over his troupe and the spectators, by means of
    the conventions of a wayang''s performance.


