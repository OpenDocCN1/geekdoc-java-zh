  md: '# ACKNOWLEDGMENTS


    As a general rule, Javanese say "thank you" (matur nuwun) only in impersonal situations:
    in very formal encounters, or in addressing groups. True gratitude and indebtedness
    cannot be reduced to stock phrases no matter how refined. In fact, to say "thank
    you" in Java can arouse disappointment, since it implies that such words can cancel
    the bonds between people that exchange relations set up. A student offers his
    teachers deference, and whatever material gifts he can muster. To his friends,
    he offers good company and the unspoken promise of support through thick and thin.
    But he never presumes the debt he owes could be paid, whether materially or by
    the expression of thanks.


    I have been fortunate to find friends among my teachers, and teachers among my
    friends. I wish to acknowledge the debts I owe all of them, without presuming
    that such debts could ever be cancelled.


    Benedict Anderson and James Siegel introduced me to the study of Indonesia, and
    since my first days as an undergraduate at Cornell I have benefited immeasurably
    from their insightful writings, from their classes, and from their advice and
    encouragement of my own work. Terence Turner and Victor Turner, in addition to
    James Siegel, were my first teachers in anthropology, and they imbued the field
    with the sense of excitement that it still holds for me—an inimestimable gift.


    I have turned to those teachers many times since leaving Cornell, but I have also
    benefited greatly from the advice and encouragement of other scholars I have met
    more recently. Alton Becker, Judith Becker, Donald Emmerson, Clifford Geertz,
    Hildred Geertz, Wendy O''Flaherty, Valerio Valeri, and Paul Wheatley all helped
    me formulate my ideas about Javanese culture, and to them I am deeply grateful.


    If my teachers in the United States have provided me with questions and skills,
    countless teachers in Java have provided me with the information, advice, and
    friendship that made living in Java such an enriching experience. Lest I appear
    unduly nostalgic, I should say that'
