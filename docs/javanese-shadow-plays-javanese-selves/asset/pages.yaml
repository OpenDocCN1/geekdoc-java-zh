    labor or resources. It does not necessarily its bearer to impinge upon others''
    lives beyond the context of encounter. The hierarchy of status relations may be
    an organization of sorts, but it is hardly an order of command, even if some lurah
    would like to make it.


    A person believed potent (a wong tuwa) repeats, at a lower level of the Javanese
    hierarchy, the idealized image of the exemplary king at the top of the Javanese
    hierarchy. In both cases, that of the king at court and that of a wong tuwa in
    a village, authority should impress himself upon others through disinterestedness,
    dignified bearing, and impressive aura of the person in a superior position. These
    qualities prove that that person possesses a great reserve of potency. And it
