  md: '# 262 CHAPTER IO


    social actors, and/or that (in what Geertz calls the symbolic action approach)
    convey specific meanings about the nature of the world. Geertz characterizes his
    own work on the “theatre state” in nineteenth-century Bali as a combination of
    the two, taking Balinese social life and expressive culture combined as a “dramatized
    statement of a distinct form of political theory” (1983:2929), a statement that
    not only asserts the theory but also draws people into its enactment.


    Adherents of the textual model, Geertz continues, treat text and action as comparable
    in that both have meanings that persist beyond the moment of speaking or doing:
    both become “inscribed.” Summarizing Paul Ricoeur’s understanding of inscription
    as the fixation of meaning, Geertz states.


    When we speak, our utterances fly as events like any other behavior; unless what
    we say is inscribed in writing (or other established recording process), it is
    as evanescent as we do. If it is inscribed, it of course passes . . . , but at
    least its meaning—said, the saying—to a degree and for a while remains. This too
    is not different for action in general: its meaning can persist in a way its actuality
    cannot. (C. Geertz 1983:31; cf. Ricoeur 1981)


    Geertz suggests that in taking the notion of text, we can make of our role as
    observers of social life something akin to that of translator, exegete, or incongographer,
    and he cites Becker’s work on wayang as an example worthy of emulation.


    Geertz’s succinct summary of these interpretive approaches helps to bring out
    the particular challenges and opportunities afforded by the study of a performing
    art. The value of such a study for cultural analysis stems from the fact that
    art form provides us indigenously generated representations of people’s lives
    while constituting a part of those lives. Both observed and lived, and both a
    representation of social life and an instance of it, a performance provides a
    commentary upon interaction and yet also exemplifies it. At the same time, analyzing
    a performing art should persuade us to examine any unwanted assumptions about
    the use of some metaphors might foster. It can do so because a performing art
    overturns the distinctions between “social life,” “performance,” and “text,” upon
    which such metaphors depend.


    To analyze a performing art as a form of interaction, and so a form'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# CONCLUSION 263


    or manifestation of social life, counters the more common practice of seeing social
    life as a kind of performance. When social life is likened to a performance, the
    latter tends to become a generic term, one actually possessed of relatively little
    explanatory power. Specifically, if we play on the notions of role, appearance,
    and scenario to analyze everyday life, if we are able to please Western understandings
    of a self as self-conscious actor, choosing among scripts and affecting roles.
    When an actual performance is analyzed in the context of social life, its explanatory
    power can prove much greater. Unable to say that a performance is “like a performance,”
    we must ask what a performance in a particular place actually looks like. This
    should en-ourage us to consider how “selves” are represented, therefore, and what
    is thought important or interesting about them and their actions. It should, furthermore,
    encourage us to think about the medium in which performance takes place. Since
    that means a form of interaction—between performance and spectator—but an obviously
    constructed one, it suggests focal issues in interaction more generally. By putting
    aside the dramaturgical model in favor of drama itself, we give up universalizing
    statements about self and role and take up the challenge to analyze specific conceptions
    of self and interaction.


    If the dramaturgical model turns tautological when applied to actual performances,
    the textual model proves particularly interesting and problematic when applied
    to a performing art. Ricoeur, as Geertz has noted, sees texts as fixing the “said
    of speaking,” thereby enabling the meanings of discourse to develop through time.
    Ricoeur compares this to what action, fleeting, develops meanings in the form
    of its consequences. A performance, however, is both text and action. As a result,
    Ricoeur’s distinction makes it possible to look for different kinds of meanings
    in performance, seen on the one hand as text and on the other as action. At the
    same time, however, a performance points up some of the difficulties in using
    a textual model that makes action comparable to texts.


    If a dramatic presentation is based on a script to which actors give voice, then
    the audience indeed receives a text, though in the form of speaking. This means
    that the process of interpretation has already been initiated by the actors and
    director. If drama in performance is a partially interpreted text, it is also
    a form of action, or really, of actions. There is the action taking place within
    the world of the play,'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# 264  CHAPTER IO


    and there is the action of staging the play in the world outside it. Asking the
    consequences of these two kinds of actions, in an effort to establish their significance,
    means on the one hand attending to the effects that action in the play has upon
    its characters, and on the other, attending to the effects that staging the play
    has upon its players, sponsors, and audience. We should, moreover, consider the
    relations between the two. Debate about the effects of violence in movies and
    television on the actions of spectators in the rest of life illustrates how problematic
    that issue can become.


    Yet when a performance proposes an interpretation of a text, by supplying appropriate
    gestures and tone, it emphasizes the status of speech and action as events, rather
    than in the forms by which they may be fixed. This suggests that interpreting
    a performance should proceed not from a meditation upon the text as fixed upon
    a page, but rather from the experience and/or memory of the performance, seen
    as an ephemeral event.


    The problem with Ricoeur''s account of action in general is that he exaggerates
    its fixity, in order to support his comparison of action with texts. We cannot
    recover an event with nearly the degree of confidence that we recover writing.
    As a result, we must modify the way we conceive of the meanings that in events,
    and ask whether our reliance on a textual model is suitable to something—whether
    a performance or any kind of action—that is experienced differently from reading,
    and is less subject to retrieval.


    Of course, the notion of text is often expanded beyond Ricoeur''s relatively restricted
    usage of it, as for example in Becker''s wide-ranging use of the term (1979),
    or, for that matter, Geertz''s (1973a). Yet as long as the concept of writing
    is taken as constitutive of texts, and by analogy, as we take the fixing or objectifying
    of action as constitutive of its meaning, we run the risk of separating meaning
    from event, and casting the latter as an unwanted luxe. Unlike a text, action
    is experienced only within specific contexts. In analyzing it, as a result, we
    must not lose sight of J. B. Thompson, paraphrasing Ricoeur, calls the “doing”
    of action, in too-hot pursuit of “the significance of what is done” (J. B. Thompson
    1981.15).


    A performance of wayang poses these problems particularly clearly. It is quite
    resistant to being made into a text. It is shaped by conven'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# CONCLUSION 265


    tion, but it is not scripted. Indeed, with the ambiguous exception of sung verse,
    the traditional arts in Java almost never take the form of written texts. Javanese
    seem unwilling to accept the impoverishment of language necessary to fix it upon
    the page, stripped as it then becomes of some of its tone and contextual meanings.
    That wayang lakon are presented in only three- or four-line summaries speaks the
    inadequacy of conveying in way beyond “what happens.” What matters in performance
    is what is proper to performance. The tone, manner, and style of movement and
    speech So more acutely than scripted drama, a performance of wayang emphasizes
    its own nature as an ephemeral event.


    How then can we talk about what a performance of wayang means? How could we, following
    Ricoeur, look for a text, and how could we look for the consequences of a performance
    as “meaningful action?” In response to the first query, if meaning remains inscribed
    in a text, then we should look to what is fixed about the tradition as a whole—the
    pothakan and the recurrent conventions of plot, as a kind of textual basis for
    every performance. A. L. Becker does just this, establishing some fixing of meaning
    in the ephemera of performance


    In addressing the second query, and if we take the meaning of action to lie in
    its consequences, and we can look for its meaning in the effects it has after
    it takes place. Javanese themselves believe that a performance becomes “inscribed
    in the world.” They believe that its consequences surpass the intentions of its
    agents, since a performance is thought capable of exerting mystical influence
    over its sponsors, spectators, and surroundings long after it takes place. They
    also believe that its importance surpasses its immediate context, as it redounds
    on the status of the sponsors and his troupe. Furthermore, since a performance
    as part of a ritual celebration draws many people into its workings, as providers
    of labor and/or as guests or spectators, it can have important ramifications in
    their social lives. For example, the extent of a neighbor’s financial support
    and labor will affect his or her relations with the sponsoring family for years
    to come. In all these ways, a performance of wayang fits Ricoeur’s description
    of “meaningful action considered as a text,” since its meanings persist after
    its occurrence.'
