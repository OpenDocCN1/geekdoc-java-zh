    This dispersion of authority among several figures fits the Javanese concern,
    really just an aspect of their understanding of idealized power, to maintain what
    might be termed personal sovereignty. This is a concern to demonstrate and assure
    one’s status by remaining impervious to external influence of any sort, including
    political influence. The higher people’s status, the more carefully they try—and
    the more frequently they manage—to avoid others’ control. The poor and low-status
    are less capable of resisting influence and constraints. Yet people of all estates,
    although they may attempt to tap others’ power, try to do so without incurring
    obligations to the sources of that power, because to be subject to obligations
    suggests that one’s status is insufficient to resist them.


