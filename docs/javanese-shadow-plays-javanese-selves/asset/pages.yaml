  md: 'Nevertheless, to insist upon the textual nature of a performance, or upon its
    consequences in the world, in order to determine its meaning, would be to restrict
    the nature of its significance. I have tried to demonstrate that the meaningfulness
    of a performance of wayang resides above all in the nature of the relations it
    establishes in the course of the performance itself. It is because meaning need
    not develop out of or after the event, because a performance of wayang need not
    be mulled over by rumination in exegetical yield its significance, that it provides
    such a rich source of insight into Javanese culture. What is said and done in
    a performance matter to Javanese, who make much of its moral instruction. More
    importantly, however, the “saying” and the “doing” of the performance implicate
    essential concerns in Javanese culture about the nature and effects of all interaction.
    It is because the relationship between dhal and spectator so deeply with other
    relationships in Javanese life that it exercises fascination for Javanese, and
    we must as a result not put that relationship aside as the incidental means for
    conveying a more enduring message. We must take it, as Javanese themselves take
    it, altogether seriously. Just as hermeneutics have gained insight into the nature
    of texts by pondering the act of reading, so we can gain insight into the nature
    of wayang kulit by pondering the act of watching, and by pondering the difference
    between that act and the act of reading.


    Watching a performance of wayang, I have tried to show, evokes Javanese understandings
    about the constitution of the self and appropriate modes of interaction. Essential
    to these ideas is the issue of power, as manifested in a concern with potency,
    status, and personal sovereignty, and as implemented in several different kinds
    of relationships in face-to-face encounter, in the family, in village politics,
    and in activities linked to healing, to ritual needs, to aesthetic pleasures,
    and to interpretive effects. The transposition of such core concerns into many
    different registers does not yield perfectly congruent patterns. Still, many of
    the same tensions, following as they do from certain contradictory impulses, reappear.


    What wayang does not resolve such contradictions appear in ideology and in life,
    and in that respect it does not instruct. An emphasis on meaning such as the exegete
    of texts might wish in a study of performances is misleading insofar as it holds
    up the promise of either a radical questioning or a proposed resolution to problems
    in the world of its spectators. Wayang certainly helps to'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# CONCLUSION 267


    propagate a particular view of the world. But it can do so above because to participate
    in the event of common a shadow play means to repeat patterns of interaction common
    to other domains of life. In this way it constitutes—return to Ricoeur’s terms
    for a moment—additional instances of “saying” and “doing,” rather than any isolation
    of the “said” or the “meaningful” in the rest of life


    I insist insist upon not to demean wayang kulit, but rather to point to its richness
    lies. Only when we release wayang from an obligation to convey explicit messages
    to its spectators can we recognize the range of associations implicit in attending
    any performance, or any part of one. Only when we treat the performance as an
    event, an experience of great evocative power rather than some elaborate heuristic
    device, we escape the intellectualist prejudices and expectations to be the study
    of texts, or for that matter, to many studies of ritual the latter, see as cognitively
    instructive or transformative experiences. (For a critique of the latter, see
    Scheffelin 1985). Some Javanese wayang as a vehicle for molding people’s ideals.
    Those political interests, however, have sought to produce a particular message,
    whether currently or in the past, have exaggerated the effectiveness of the turns
    of plot and dialogue to alter people’s attitudes and behavior, and they have neglected
    the greater significance of the medium itself.


    This is not to say that the wayang tradition is so oss or impervious to change.
    No doubt it has changed just as the world in which its performances take place
    has changed. I am myself inclined, for example, to see the recent popularity of
    highly conventionalized stories about wahyu wahyu account for sudden shifts in
    the world, very much a concern in a society where shifts have been many and dramatic
    since World War II. Highly stereotypical plots, at the same time, assure all present
    that—the course of the performance, the tenor of the audience’s response—is under
    control. Even if older dhalang, as I have mentioned, disparage the current profiling
    of wahyu stories, it is unclear differently stories that in earlier eras were
    actually performed. It is also unclear how the aristocracy’s greater patronage
    of the tradition in the past may have affected its contents. Unfortunately, it
    is very difficult to establish with any certainty what performances were like
    a century ago, or fifty years ago, or even thirty. Had we clearer records of a
    range of earlier performances, we could speak more confidently of the links'
  merge: -1
  pgno: 290
- img_proc: true
  md: '# 268  CHAPTER IO


    between the content of performances and their particular historical and political
    contexts. Yet I believe the format of the performance has changed relatively little,
    and the continuity of the medium is more important than changes in particular
    lakon: it is the medium more than the contents that resonates so deeply with other
    domains of the Javanese life.


    Those domains are many. In the Javanese family, the father''s role is glorified
    and constrained in such a way as to make his power at the same time unquestioned
    and largely exercised. Villagers who press their headman into particular molds
    seek to determine the nature and extent of his power over them in the same way.
    The disassembled center—king, ritual sponsor, or dhalang—reiterates paradoxical
    effectively but absent figures of authority that the father and head are pressed
    to become. Each of these figures should support and protect people, but in no
    way impinge on personal autonomy. The spectators who impose a conventional meaning
    upon performance way define their relationship with the art form and with the
    dhalang in a similarly identifying yet defensive way. Certainly, family members,
    villagers, and spectators all seek to gain certain benefits from the power that
    they destroy. The authority of the father, the influence and perhaps patronage
    of the lurah, the influence (berkah) and esoteric wisdom (ngelu) communicated
    by a dhalang in performance, are all judged at least beneficial. At the same time,
    however, submission to a powerful political authority, the pleasure afforded by
    a performance of wayang as entertainment is also great. The authority, and surrender
    of self-conscious control, such as the dhalang, constitute seductive and mistrusted
    alternatives to the personal sovereignty, clarity, and guardedness Javanese norms
    prescribe. Whether in political or aesthetic subject, dissimulation of a superior''s
    control mitigates the impression of a loss of personal control or autonomy. The
    disassembled self also gains a particular authority: a diffuse but idealized and
    highly respected position as agent both operating within and surpassing the world.
    The peculiar fascination of the dhalang Javanese culture stems from this fact:
    he is at once a disassembled authority, one whose power is great, non-coercive,
    and otherworldly, and a disassembled interpreter, one who mediates between an
    unreal but persuasive and distracting world, and our own.'
