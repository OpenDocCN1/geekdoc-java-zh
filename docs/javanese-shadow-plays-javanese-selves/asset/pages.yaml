    The resolution of this problem lies in considering an art form in light of the
    relationships its performance occasions. Those are many, they include those among
    performers, between performers and their sponsors, between sponsors and their
    guests, etc. Most important of all, however, are the relations between the artistic
    illusion itself and its audience, and implicit in these links, the relations between
    artist and spectator. These relations immediately suggest questions: what effect
    upon the audience is sought, what the nature of the spectators'' satisfaction
    is thought to be, and what reactions the performance elicits. Much of this material
    can be obtained from indigenous remarks, though perhaps as in casual remarks about
    particular performances as in more formal, generalized pronouncements. But commentary
    must be judged in view of what actually happens at performances, as well. How
    performers use the conventions of the art form, and what arouses the spectators''
    interest, approval, and/or censure. Commentary and practice do not necessarily
    coincide on any of these points, and may demand particularly careful consideration.


    To understand a performance as a relationship does not simply permit investigators
    to challenge commentary with observed reactions, however. It permits them, much
    more significantly, to integrate the art form with other kinds of relationships
    that obtain among the members of that culture. It is here that aesthetics, sociology,
    and ideology meet. In recurrent patterns in the mediation of self and other. My
    analysis of wayang develops out of this premise, that an art form constitutes
    a relationship, or a series of relationships, that can be compared with other
    (i.e., social and political) relations.


