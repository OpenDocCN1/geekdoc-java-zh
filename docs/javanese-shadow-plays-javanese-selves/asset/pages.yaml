    # THE DHALANG AND THE TRADITION


    Three general criteria applied when evaluating a dhalang are his genealogy, training,
    and his sensitivity to his audiences'' tastes. A dhalang should be able, in the
    opinion of many, to trace his genealogy back through several generations of dhalang,
    and I was struck by the ability of some dhalang to recount their genealogies back
    several generations further than others. Only dhalang in such long lines of descent
    are thought to be in possession of a great store of esoteric knowledge (ng padhalangan)
    necessary to make their performance truly effective. However, belief in the need
    for a genealogy is certainly declining. The Javanese conviction that genealogy
    distinguishes people in important ways, while still strong, nevertheless lacks
    all ideological support today, supplanted by the stress on aesthetic endeavors.
    Several of Java''s most contemporary dhalang have little or no genealogical connection
    to the major dhalang lines of Central Java.


    Schooling dhalang in a way similar to genealogy. Public schools, and more importantly
    the schools for dhalang at royal courts in Jogja and Solo, give dhalang a level
    of general learning thought important to their performance. The dhalang schools
    in Solo especially are considered the ideal places to study the classic Kawi vocabulary
    necessary for performance, and to learn the precise links among all the different
    way characters. Furthermore, these schools permitted something of a canon to be
    established, particularly in Solo, about the "correct" versions of many aspects
    of a performance, such as the long lines (suluk) the dhalang sings, the stories
    (lakon) he relates, and the gendheng the orchestra plays. (The prestige of Abrandho,
    the palace school for dhalang in Jogja, has never equaled that of the older Radya
    Pustaka school, and now the national Akademi Seni Karawati Indonesia, in Solo.
    As a result, Jogja'
