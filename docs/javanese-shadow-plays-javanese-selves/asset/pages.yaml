  md: '# INTRODUCTION


    about to be revealed. Only at this stage did many members of the audience leave
    off chatting and start paying much attention.


    Preparations for the performance had begun months prior to this long and stately
    opening. Most performances of wayang sponsored by private families (as opposed
    to put on by organizations, government offices, an entire village, etc.) are held
    in conjunction with some rite of passage. Weddings and circumisions are celebrated
    with a performance especially often, but other events, such as the birth of a
    child, a roof-raising, or the final ritual in a long series of funerary observations,
    can be appropriate times which to show a shadow play. The sponsors must first
    select an auspicious date on which to hold a ritual, in accord with rather complicated
    numerological calculations. They must then choose which dhalang wish to approach,
    and inquire, often through intermediaries, whether he can perform on that date
    and what his fee might be. A dhalang''s calendar and his fee both depend on the
    fame he enjoys, though the criteria by which he is judged diverse. Dhalang with
    strong voices and quick wits are very popular, very busy, and quite expensive
    to engage. Older dhalang who have lost their flexibility and power may nevertheless
    be valued due to their greater experience and wisdom. Ki Cerma''s age and the
    trials of his life had taken the sweetness from his singing voice, and he had
    also lost some of the energy that made him, a renowned performer much in demand.
    Nevertheless, he was still a respected dhalang, and he performed at least a few
    times each month during the dry season, when most performances are held.


    If a dhalang is free to perform on the evening spos, negotiation of a fee then
    ensues. The fee depends on several factors: whether the sponsors wish to engage
    only the dhalang plus one or two musicians, assembling the rest of the singers
    and musicians on their, or wish to let the dhalang bring with him; whether the
    sponsors will run puppets and screen from someone else, or will ask the dhalang
    to bring him on, whether the sponsors wish the dalang to perform only at night,
    or wish to have him or a person delegated by him perform during the day preceding
    the more important nighttime performance as well, and whether the sponsors can
    by virtue of some kinship, friendship, or other relationship with the dhalang
    expect special consideration when the dhalang names a fee.'
  merge: -1
