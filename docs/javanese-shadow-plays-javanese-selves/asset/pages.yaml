    # PLEASURE AND FOCUS IN JAVANESE MUSIC


    To attend a performance of wayang it combines what I have called sensual and political
    understandings of pleasure. Both are translated into a constant play on degrees
    of focus. The gamelan accompaniment to a performance illustrates this changing
    focus especially clearly, and since it plays an important role in the varying
    impressions of a performance of wayang makes upon its spectators, I will begin
    this discussion of wayang’s aesthetics by reference to its music.


    Gamelan integrates a great variety of musical lines in shifting degrees of oral
    clarity. Judith Becker points out that melodic line was not originally essential
    to the formulation of Javanese pieces (gendheng) (J. Becker 1979). Instead, principles
    of gong structure, in which sections of repeating cycles, underlie each gendheng''s
    organization. Sumarsam, it true, speaks of "inner melody" in Solanese gendheng
    (Sumarsam 1984). But although this melodic line is present to the mind of the
    players, no single instrument plays it. Judith Becker contrasts this Solanese
    tradition to the Javanese one, but the formal gong structure is more clearly evident.
    But in either tradition, as one goes through the series of different rhythms,
    from one gendheng to the next, the balungan or skeletal line (also referred to
    in English, somewhat obscureleading, as "nuclear melody") becomes first increasingly
    obscure, then increasingly clear. This is because of changes in "rhythm" (wrama),
    each of which indicates a different ratio of strokes on the instruments that play
    the skeletal line to strokes on instruments that employ. As one passes from wrama
    one to two or three to four, which is shifting gears, the strokes on the saron
    and slenthem become rarer. This permits the other "inner" or embellishing instruments—the
    gender, gambang, clempung, and rebab, each of which has a highly distinctive tonal
    quality—plus the female singer (pesindhen), to superimpose increasingly long and
    complex variations. The result is greater rural richness and less arial clarity.
    A wealth of enrichment takes precedence over any clear line. In Solo, especially,
    the embellishing instruments simply take over, playing such a variety of almost
    autonomous varia-'
