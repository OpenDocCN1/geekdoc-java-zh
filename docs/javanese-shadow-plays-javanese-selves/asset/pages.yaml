    This conception of wayang helps account for a curious but widely-held belief among
    Javanese that wayang was developed by the Muslim proselytizers (wali) who spread
    Islam in Java. Although accounts vary in specifics, the story runs that the then-Hindu
    or Buddhist animist Javanese were drawn to newly-built mosques by the sound of
    gamelan played inside. Once gathered were granted entry to the mosque on the condition
    that they repeat a few syllables. These were the Muslim confession of faith, and
    the naive populace, by repeating them, was unwittingly converted to Islam. Wayang
    performances were then held in order to teach the precepts of the new religion.
    Although it is often granted that wayang bebek (illustrated scroll narratives)
    existed before the advent of Islam, the origin of shadow puppets is attributed
    in this account to the Muslims. Some people add that the puppets are very highly
    stylized in defence against representing the human body. In some versions, wayang''s
    origin is not explained in this way, but its elaboration and perfection are nevertheless
    attributed to the Muslim wali.


    These accounts usually place no judgment upon such a manner of converting Java
    to Islam. If anything, people seem to admire the wiliness of the proselytizers,
    who knew how to play upon the Javanese taste for gamelan and performances to attain
    their ends. The point that remains that in these stories, gamelan and wayang become,
    in the hands of the sponsors of their performance, means to attract people, and
    then to subvert a crucial aspect of their identities, namely, their customs and
    beliefs.


