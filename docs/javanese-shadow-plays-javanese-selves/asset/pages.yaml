  md: '# I. LANGUAGE, POWER, AND ASCETICISM


    Formal Javanese encounter is remarkable. Among people who are not close kin or
    longtime associates, and to an extent even among them, face-to-face encounter
    requires that everyone take great care to behave in a manner appropriate to his
    or her relative status, no matter what the business at hand. Vocabulary, sentiment,
    gesture, timing—all must be adjusted carefully in view of the responses they are
    liable to arouse among the people present, and in view of one''s own social status
    relative to theirs. These issues matter in encounter everywhere, certainly, but
    in Java the degree to which they have been organized in a repertoire of vocabulary
    sets and conversational strategies is quite awesome. To interact in Javanese means
    to anticipate, gauge, adjust for, and at times presume upon—but never wittingly—the
    responses of one''s interlocutors.


    Yet a topic that occupies Javanese is ascetic exercise, and a striking fact about
    ascetic rigors is that they suggest obliviousness to others and to the world.
    Asceticism is a means, furthermore, to make oneself more impressive and less subject
    to external influence even in everyday affairs. This means among other things
    that a person who has accomplished many ascetic rigors is thought capable of controlling
    encounter in ways that other people cannot.


    Encounter and asceticism stand as two opposite but linked kinds of action. They
    are logical extremes in Javanese thinking about experience. Each of them, and
    the way people relate to each other, can clarify Javanese understandings of power.
    They enable us, as a result, to see how those understandings inform Javanese interaction
    in specific relationships, such as in the family, in political relations, and
    in the arts.


    # SOCIAL STATUS AND RELATIVE STATUS


    To appreciate the stakes in Javanese encounter, and to clarify the present discussion,
    it is worth making a somewhat arbitrary distinction between social status and
    relative status. I will take the former,'
  merge: -1
  pgno: 40
- img_proc: true
  md: '# 26  CHAPTER I


    social status, as an ongoing position of greater or lesser prominence in a group,
    determined largely by genealogy and control over labor and/or valued resources.
    Such control may be due to bureaucratic position, wealth, esoteric knowledge or
    skills, kinship ties, etc. What I will call relative status is the degree of deference
    a person elicits from his or her interlocutors in the course of any specific encounter.
    Social status is liable to shift only relatively, whereas relative status is entirely
    contingent upon who participates in a particular exchange. Of course, the two
    are intimately linked: social status determines in large measure the deference
    one evokes, and so one''s relative status, in any encounter, is contextual, ephemeral,
    and to some degree negotiable. Social status sets the limits within which the
    negotiation takes place, but it still leaves room for “discussion,” as people
    affirm, modify, or contest participants'' estimations of their relative status.
    Though social status certainly matters deeply to us all, Westerners and Javanese
    alike, nevertheless relative status—the degree of respect people elicit in any
    given encounter—arouses an intensity of interest among Javanese that Westerners,
    and some other Indonesians, may find surprising. The Javanese language provides
    the clearest means by which that is played out in counter.


    Social status in Java is defined fairly loosely. The aristocracy in court attends
    to the ranks of its members, according to the same system of “sinking status”
    Clifford Geertz described for Bali (C. Geertz 1980). Asccribed status, however,
    touches only a tiny fraction of the population. Instead, considerations of wealth,
    age, education, profession, and who one''s Kinsmen are determine, somewhat vaguely,
    a person’s status. Actually, there are few distinctions with which to categorize
    people beyond the gross labels of nobleman, civil servant, trader, laborer, or
    peasant.


