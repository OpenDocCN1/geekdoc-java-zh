  md: '# 8 INTRODUCTION


    gesture greeted by the female sponsor further inside the house. The men watch
    the performance briefly while eating a meal that they are served. The shadows
    barely show in the daylight, however, and the men take little interest in this
    entertainment. Within a half-hour or so they leave, along with the women they
    have escorted. They are replaced by other guests, who make equally brief visits.


    The evening performance matters much more than any daytime, although the stories
    are drawn from the same repertoire. (Occasionally sponsors request that the daytime
    and nighttime performances treat related stories, but more often the stories are
    not directly linked.) In this case, since there had been a daytime performance,
    the musicians rested and ate another meal during the hour or two it ended and
    before the evening performance began. Ki Cerma arrived during this period. In
    the past, a dalang arrived on foot, by a bicycle, or occasionally in a horse-drawn
    carriage. Now Ki Cerma rode up on an old German motorbike, bought long before
    in the flush of his early successes. Very wealthy dalang arrive in a car or minibus
    with several attendants ) sponsor couple greeted him and served the musicians
    a meal. At seven-thirty they joined the gamelan, and concert began. Often the
    dalang himself plays the drums during his concert, but Ki Cerma''s son Sigit,
    who had performed his father''s performance and a particularly skillful drummer,
    trained at the national music academy (Akademi Seni Kar-Indonesia) in Solo, drummed
    for the concert. He later went to accompany his father''s performance and was
    relieved last only at about thirty-thirty in the morning, when another younger
    brother took a turn at drumming.


    If the dalang is popular, people of all ages, though exclusively males, start
    gathering outside the house where the wayang will be held during the course of
    the concert, or even earlier. In the case of Java''s four or five most popular
    dalang, hundreds of people, sometimes well over a thousand, assemble, crowding
    together in whatever space the arrangement of houses nearby affords. Boys often
    climb trees to numbers that the trees collapse. Although Ki Cerma''s popularity
    was not so great, nevertheless on the paths and roads near the performance itinerant
    sellers up stalls and laid mats where people could buy refreshments or toys, or
    could gamble. In the yard, immediately behind the gamelan, people sat or squatted
    watching'
