  md: '# IO. CONCLUSION


    In contemporary anthropology, much is made of the ways in which meaning is constructed
    by a culture''s members. The interpretive act by which sense is asserted, such
    as in the interpretation of art or dreams or language, is a moment in which constructions
    of meaning become particularly clear. It seems therefore a particularly vital
    point at which to observe a culture''s workings. The meeting of individuals and
    events that interpretation implies is a reapplication of principles, occasionally
    a revision, rarely, in Java at least, a radical reconsideration of them. But in
    interpreting phenomena of whatever sort, people act upon fundamental understandings
    of their proper interaction with the world.


    I wish to suggest that interpretation is in itself a kind of interaction, one
    constrained by culturally given patterns and comparable to other kinds of social
    behavior. It is for this reason that I have treated Javanese interpretation as
    susceptible to analysis in terms similar to those I have brought to bear on Javanese
    social life and Javanese shadow plays. Since, however I have dared to construe
    the art form in ways at variance with consideration of traditional Javanese interpretations,
    I will conclude with how interpreting a non-Western art form challenges some of
    our own hermeneutic assumptions. If we are going to analyze the ways others approach
    interpretation, we must also be ready to question the ways we do. More specifically,
    in the present context we must ask whether the guidelines formulate in interpreting
    texts still hold when we look at a non-Western art form. Are our interpretive
    principles applicable to texts that are not of our making?


    Clifford Geertz, the most famous proponent of an interpretive approach in the
    social sciences, laying particular emphasis on the frequently invoked models of
    social life as performance and social life as text (C. Geertz 1983). Adherents
    of the dramaturgical model see in collective life publicly enacted performances
    that (in the case of Geertz calls the ritual theory approach) to resolve conflict
    among


    ![](img/0bd57f0e457466c5c2672e07261e2663_284_0.png)'
  merge: -1
  pgno: 284
