    When people speak, as dhalang speak at particularly great length, of the exemplary
    function of wayang, they justify the claim with reference to precisely these clear
    moral contrasts. The most commonly espoused view of wayang''s effect upon its
    audience describes it as inducement to righteous behavior. First of all, the dhalang
    makes certain characters elevating remarks on the virtues of filial piety, the
    need to speak with proper refinement, the importance of doing ascetic rigors,
    etc. In addition to these clearly didactic statements, a performance is also believed
    to transmit beneficial moral influence through its examples of good and evil actions
    and the fruits they reap. To most commentators, this obvious moral instruction
    is the real essence of wayang''s worth, the cause of its ceaseless appeal, and
    the indisputable justification for the whole tradition. Nuances in emotions and
    moral issues are sacrificed in such a reading of wayang, and exegesis reveals
    the meanings of lakon to a few sentences.


