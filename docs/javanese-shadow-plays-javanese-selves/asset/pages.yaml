    # Language and Relative Status


    People attend to relative status above all by attending to the manipulation of
    speech levels. These make virtually every utterance a comment on the relationship
    between speaker and interlocutor. Nothing one can be thought to have an essential
    meaning apart from how it is said, and as is doubt true everywhere, this depends
    on where, when, and to whom it is said. It is true, furthermore, that speakers
    of any language observe the same kinds of distinctions, such as formality and
    informality, circums and frankness, conventional and boldness, which distinguish
    Javanese speech levels. But in Javanese linguistic and gestural styles have intricately
    and subtly connotations of style are at all times present in people''s minds.
    As a result, speech levels and their corresponding gestures take over the rather
    vague categories of social structure leave off. They force speakers to make quite
    explicit their views of each other''s relative status.


    Basically, one can distinguish three speech levels in Javanese, defined by the
    use of several vocabulary sets. Ngoko, madya, and krama. Ngoko is the first language
    level a child learns to speak. It is considered by Javanese to be simple, straightforward-


