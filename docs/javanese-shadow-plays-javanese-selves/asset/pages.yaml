    # THE DHALANG’S PRESENCE


    In contrast to an actor in the modern Western theatre, whose every line of dialogue
    is set, a Javanese dalang enjoys considerable freedom. He is playwright and director,
    as well as actor, in each performance. Yet his "contribution" to the tradition,
    that is, his realization of it in performance, is always momentary. Even if a
    lakon dalang creates become standard one in the repertoire, his name becomes detached
    from within a generation. Although dalang, especially since the spread of radios
    and cassette tape recorders throughout Java, have become extremely famous and
    their voices are easily recognized by many people, it remains true that the constraints
    of the tradition, the figure of the dalang as a particular artist always to disappear.


    The importance of antawacana in evaluating a dalang''s presence epitomizes this
    effacement of the dalang''s presence. Antawacana, like sanggit, challenges a dalang
    to conform in accurate and entertaining a manner possible to preestablished norms.
