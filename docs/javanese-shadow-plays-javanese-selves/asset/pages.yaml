    Such difficulty in pronouncing anything, including "history," true stems from
    the fact that do so people surpass the limits of their own perception. Javanese
    are not necessarily skeptical, but there is no reason to commit themselves to
    statements that they feel no personal link. One doesn''t say another person''s
    stories aren''t true, one simply doesn''t say, just as one avoids lending money
