    # Seeking Wealth


    In contrast to asceticism, which is a version of sacrifice directed to God, Javanese
    conceive of another, monstrous form of sacrifice, in which one gains selfish by
    making secret deals with spirits. This Faustian practice is usually called “to
    seek wealth” (golek pasuguhan), and the spirits with which one trafficks are called
    intuk and buta yo.¹ A person goes to some special spot, usually in a cemetery,
    summons a spirit, and strikes a deal with it. In return for providing people with
    great wealth, the spirit will take the lives of their children and other kin.
    An alternative or additional effect is that people will become the spirit’s slaves
    after death and join the armies of Nyai R Kidul, the dread goddess of the South
    Sea. By Cerma explained, “They say the intuk hops on your shoulders and says,
    ‘Okay, I support you all years. Now you support me.’ Whereas one gains from ascetic
    exercise directly from God and therefore implies no one else’s loss, wealth gained
    from an intuk comes out of the hands of other people. If people come home from
    the market with less money than they thought they had, they realize that an intuk
    has snatched some of it and taken it to its clients. Any person who enjoys particularly
    good fortune, especially sudden good fortune, will be said to have gotten an intuk.
    Neighbors, By Cerma said, had whispered such things about her and her husband
    when Pak Cerma was such a successful dhalang in the early sixties, especially
    after the death of their five-year-old daughter. Having reported this in hurt
    and outrage, she went to state as as common knowledge that the people with a little
    store up the road enjoyed the services of a buta yo.


    To seek wealth (glek pasuguhan) perverts relations of exchange. In fact, it is
