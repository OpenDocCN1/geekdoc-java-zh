  md: '# INTRODUCTION: ON INTERPRETING A JAVANESE ART FORM


    **Ndhrog-dhog-dhog.**** The puppeteer rapped a heavy wooden mallet against the
    side of the puppet box to his left, starting a performance of the Javanese shadow
    play (wayang kulit). The great gong sounded and the Javanese orchestra arranged
    behind him began to play. A man in his early sixties, with the wide-set eyes and
    wide jaw characteristic of lowland Javanese, the puppeteer (dhalang) sat cross-legged
    in front of a white screen with a red border, a bright light suspended above his
    head. Banana-tree trunks, held by supports about a foot off the ground, ran along
    base of the screen. The portion of the screen directly in front of the dhalang
    was filled by a single puppet, called the *kayon*, an all-purpose prop shaped
    like an inverted cone. On it were depicted in brilliant colors an enormous tree,
    with monkeys and birds in its branches, monstrous heads on either side, and a
    gateway and pool below. A few inches to either side of the *kayon* began a row
    of puppets extending to the ends of the screen and beyond. Each of the dozens
    of flat leather puppets, intricately cut and elaborately painted, was secured
    to the banana trunks below the screen by means of a pointed grip made out of horn,
    which was jabbed into the trunks'' spongy flesh. The puppets were arranged in
    ascending size. Nearest the dhalang were small, delicate puppets depicting babies,
    women with demurely lowered faces, and some knights with half-closed eyes, bare
    chests, and narrow waists; more gods dressed in long gowns and turbans; larger,
    bolder males; then giants and monsters with huge round eyes, bared teeth, and
    paw-like hands completed the series on either side.


    As the orchestra, called the *gamelan*, began to play, the dhalang pulled the
    stem of the kayon out of the banana trunk with his right hand and gripping its
    tip with the fingers of his left, held it over his head while he murmured ritual
    spells to stave off danger. Then he twirled the two-foot high kayon, secured in
    the banana trunk to one side of the open area of the screen, and began to bring
    out puppets that would appear in the first scene. A prince, maidservants to attend
    him, and knights figured among these. Ki Cerma'
  merge: -1
