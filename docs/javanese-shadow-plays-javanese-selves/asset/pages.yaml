    People''s relations with signs in Java, the degree to which they are master of
    or subject to them, at once indicate and determine their potency. This assumption
    about the relationship between self and signs has important consequences for Javanese
    epistemology. Exegesis of wayang exemplifies these consequences, I will take it
    as a starting point for a more general discussion of Javanese interpretation.
    My point is that, like speech, an art form, a tract of ngelu, or a dream, all
    pose a challenge to a person''s autonomy, a challenge to which modes of interpretation
    are the defensive reaction. In interpreting such signs, a person seeks to control
    them, mastering and using—rather than falling subject to—their significance.


    # EXEGESIS AND THE STATUS OF WAYANG STORIES


    Indigenous commentary on wayang fits into the politics of meaning in Java because
    its reductiveness constitutes another defense against a performance''s impact:
    it indicates resistance to the performance in yet another register. At many points
    the epic cycle, error, oversight, and passion cause characters to become caught
