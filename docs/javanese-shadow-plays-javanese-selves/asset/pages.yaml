    Kéra basa constitute a system of linguistic glossing, the workings of which are
    less seriously arbitrary than the imposition of order upon the diverse quantities
    named in the bantah Parta déwa. Especially when intended seriously, kéra basa
    also illustrate the tendency to assert meaning by imposing associations on and
    among works quite arbitrarily. Some examples of kéra basa have already been provided.
    The device depends on dividing a word into syllables, fitting together other words
