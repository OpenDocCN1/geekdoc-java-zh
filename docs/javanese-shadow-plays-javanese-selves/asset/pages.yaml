    The king who exercises great power in his slightest gesture represents a recurrent
    image in Javanese culture, one that might be termed a dissembled center. As Anderson
    has pointed out, the conventionalized description of the good king endows him
    with such reconstructive power that subjects and foreigners alike submit voluntarily
    to his suzerainty, while enemies are easily defeated by the superior strength
    of his batin (Anderson 1972b). This ideal view makes the king strong, vital, and
    authoritative center, one toward all others, whether in allegiance, obedience,
    or helpless subjugation. The same image suggests the king''s necessary stasis.
    In contrast to a less powerful person, who must exert himself strenuously to attain
    any end, such a king need do very little. Should he need to exert himself obviously,
    he demonstrates a lack of potency. So his power must always be in a sense absent:
    evident in the condition of the kingdom but never demonstrated in coercive action.
    This is, of course, an ideal view, not a description of how kings in Javanese
    history have attained and kept the kingship. Yet the re


