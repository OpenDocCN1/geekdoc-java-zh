    Children retain the uncontested right to be picked up whenever they wish until
    a younger sibling is born. They are not pressured to learn walk, and once they
    can walk, they are not forced to walk when they prefer to be carried. It is said,
    in fact, that encouraging children to walk when they are not proficient at it
    will cause the legs to grow misshapen. If no younger sibling is born, children
    can continue to demand to be carried to the age of five or six. Nursing, in such
    cases, may continue until the age of four, and after a woman is no longer producing
    any milk, she may let her youngest child suck at her dry breast.


    Javanese babies are held constantly and supported even when they can walk because
    they must be prevented from falling or experiencing physicalarray. Emotionally,
    they must be protected from all shocks and strains. Babies'' general contentment,
    their resistance to disease and misfortune, and their ability to grow all depend
    on their being protected from any sort of upset, physical or emotional.


    One must attend carefully to babies'' wishes they are are in a sense being persuaded
    to remain in the family. Ngemong means to look after children, with the understanding
    that one must indulge and amuse them as well as keep an eye on them. When Javanese
    parents refer to a child who died young, they say that the child "didn''t want
    to be cared for" (ora gele dimong). The phrase is often said in some bewilderment;
    when the parents had done all they could to make the child content. Even though
    disease may have been the immediate cause of the child''s death, vulnerability
