    Assumptions about the self, power, and interaction practices inform two kinds
    of action—interpersonal encounter and ascetic practices—that stand as complementary
    opposites in Java These assumptions do not simply suffice the atmosphere, however,
    they must be learned and acted upon. They are never systematically taught, nor
    are they often explicitly articulated. Instead, they are learned and applied in
    specific contexts, and My purpose in this chapter is to show how young Javanese
    become familiar with these assumptions in the workings of Javanese families In
    the following three chapters, I will consider how people draw upon such understandings
    in diverse domains. of political authority, in the realm of village politics,
    that of mystical procedures, in curative and preventive practices, and of social
    status, in ritual celebrations. In all these domains, the ambiguous nature of
    the links between potency and power give rise to repeating patterns in the distribution,
    use, and manifestations of power.


    Javanese acquire basic understandings of self and power among family members.
    Differences between a father''s and a mother''s roles acquaint a child with different
    versions of power and the different responses they should evoke. In particular,
    the idealization of the father attributes to him great potency (kawatan batin),
    while effectively minimizing his control over other members of the household.
    To the degree therefore he fulfills the idealized Javanese version of masculine
    authority, a Javanese father protects his authority while relinquishing an active
    role in much of family life. The avoidance relations to characterize relationships
    particularly between fathers and sons are then model for the strategies by which
    Javanese deal with many figures of authority outside the family, seeking to gain
    by their potency resisting any influence over one''s own actions.


