    # PLEASURE AND FOCUS IN WAYANG


    Wayang plays on degrees of focus and attention in much the same way gamelan. In
    fact, shifts in the degree of musical focus in a series of gendheng parallel the
    dramatic progression within each of the three sections of a performance of wayang.
    As mentioned above, a different musical mode (pathet) is used in each section
    of a long-wayang. Every section begins with a formal discussion and ends in battle.¹⁵
    The structure of each these parts could be seen as a sort of attention a spectator
    gives. The initial scene opens in each case with a long, conventional description
    of the place, with a musical accompaniment that exploits the full range and subtlety
    of the gamelan orchestra. Conventional greetings among all characters follow.
    At this point, spectators either diffuse enjoyment to the music and the dhalang''s
    torrent of words, or pay no attention whatever, chatting with friends or, later
    in the evening, falling asleep. As the discussion among the characters becomes
    more specific, there is greater focus, and the spectators'' attention is captured.
    The key of interest aroused by whatever problem gives the lakon impetus impetus
    soon dispersed by the set pieces, such as the departure of the troops and the
    battles that conclude each section. These battles, while watched avidly, are curiously
    unvolving. They are often funny and are accompanied by a poundingly repetitive
    musical piece played by only the loudest of the gamelan instruments. They draw
    attention to the excitement of the moment and to the dhalang''s skill in manipulating
    the puppets, not to any overarching dramatic conflict The outcome of the battle
