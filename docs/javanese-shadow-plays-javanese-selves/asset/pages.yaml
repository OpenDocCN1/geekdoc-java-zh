    # Sanggit


    The third aspect of a dhalang''s skill, his sanggit, could be translated roughly
    with dramatic skill. It concerns, essentially, the way a dhalang mediates two
    constraints upon his performance, the required scenes (patokan) that structure
    every performance, and the story (lakon), which is the outline of the story he
    presents. The lakon may be traditional or it may be a dhalang''s invention. Sponsors
    may request a particular lakon at the time they engage a dhalang to perform, they
    may wait until the dhalang is about to perform before making the request, or they
    may defer to the dhalang''s own judgment. It is a point of pride among dhalang
    to be able to perform any lakon without reference to any notes or aids, though
    dhalang do often keep brief synopses of dozens or even hundreds of lakon at home.
    I was frequently astonished by the ability of some dhalang to recall a moment''s
    notice the complicated, interwoven lines of a great number of lakon, including
    the order of court scenes in which the performance would be organized But no matter
    what the lakon, the patokan can be altered only by the omission or inclusion of
    certain scenes, never by the wholesale revision of the performance''s shape.


