    CELEBRATIONS


    Javanese speak ritual celebrations as a realization of all they find distinctive
    and laudable in their own culture. The mutual assistance achieved among neighbors
    and kin, the dignity and refinement evin by sponsors, guests, and speakers, and
    the pleasure of the bustling scene, are all highly esteemed. Yet there is a paradox
    in the heart of these great events. Difficulties about status cooperation among
    non-kin, and often among kin, in most contexts in Java. Village work projects
    fall into disarray giving and following commands would arouse too many questions
    about relative status among potential participants. Status considerations certainly
    color every aspect of a ritual celebration, which is a unique dramatization of
    its sponsors'' status. Yet ritual celebrations organize labor and resources on
    a scale otherwise impossible in Javanese society. They can do so, despite tension,
    because assertions of status are consistently diminished through the dissimilarulation
    of the sponsors'' authority.


    To hold a large-scale ritual celebration (nduwé gawé) is an enormous undertaking,
    requiring weeks or even months of planning, and the higher the family''s status,
    the more elaborate and expensive the affair must be. Families demonstrate their
    status in the opulence of the decor, the food, and the entertainments. Above all,
    they prove their status in the number of people they manage to involve in the
    proceedings, whether as assistants in executing a great variety of tasks, or as
    guests who contribute money, foodstuffs, and their interested attendance to the
    affair. While great material resources must be available to the sponsors, more
    important are the human resources a family relies upon to ensure a successful—busy,
    noisy, and at the same time uneventful—celebration.


