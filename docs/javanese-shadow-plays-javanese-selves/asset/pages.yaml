    limits within which he works.


    # THE DALHANG’S SKILLS


    Both general expectations of a dhalang and certain more technical constraints
    set up conflicting demands, as I have said, that a dhalang can be both conservative
    and flexible, impervious to influence and sensitive to his audience’s wishes,
    “original” in performance and yet “re-spectful” of the tradition. Pressured to
    perform inventively and entertainingly, he nonetheless do so in a way that he
    will will leave no mark upon the tradition he transmits. The result makes him
    an active agent of the tradition, yet one who is, in theory at least, wholly transparent
    to it. In his relations to the constraints of the tradition, in fact, as well
    as in the circumstances of the performance as a whole, the dhal demonstrates especially
    vividly the paradox of effective but dissulated authority.


    The specific points on which a dhalang’s performance is judged can be reduced
    to four essentials: his dexterity and style in manipulating puppets, his musicianship
    and the beauty of his singing voice, his'
