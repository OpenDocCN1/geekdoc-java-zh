    rather that they consider respect rendered to be valuable as goods or services
    received. In language and gesture balances a system of exchanges and changes that
    will build up no completely one-sided relations of creditors and debtors. That
    a person of authority andor wealth would give gifts without stinting them only
    proper, considering his superiors dispose of the resource of style. The respect
    they proffer registers, validates, and in so doing contributes to the creation
