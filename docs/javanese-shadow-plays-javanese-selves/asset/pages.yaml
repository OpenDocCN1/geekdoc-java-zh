    words, would no longer be able to use the formula to its intended effect. (One
    goes to a river to do so that the formula will be carried downstream and into
    the southern sea, considered the home of many spirits.) But there are other means
    of ridding oneself of ngèlmmu. A man grown old and weak can call his favorite
    son over to him and teach him a formula. The son then use it, whereas father,
