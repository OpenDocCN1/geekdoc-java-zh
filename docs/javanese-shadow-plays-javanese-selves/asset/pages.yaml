  md: '# 4 INTRODUCTION


    held the stem of each puppet in one hand as he moved it across the screen, and
    with the other hand he grasped the two lighter grips, also made out of horn, connected
    to the puppets'' palms. The arms of shadow puppets are very long and jointed at
    the shoulders and elbows, but these are their only movable parts. The dhalang
    moved each puppet and manipulated its hands in a manner appropriate to its particular
    character and station, the maidservants moving with elegant grace, the knights
    with dignified resolve.


    A number of microphones, some of them flat ones that looked like old parts from
    a car, one flashy new one recently made in Japan, were fastened to the banana
    trunk in front of the dhalang. They were linked to loudspeakers inside and outside
    the house in which the performance was taking place, as Ki C began to speak, his
    voice flooded the scene. He spoke in a long, and heavily stylized stream of words,
    describing in an idealistic and conventional but rather obscure vocabulary the
    kingdom and court of Pringadani, in which the story opened. Throughout his narration,
    the gamelan played softly in the background. The dhalang timed his delivery to
    mesh with a series of strokes on the various gongs in the ensemble, and he occasionally
    interrupted his description with a few sung lines of Old Javanese poetry (suluk).
    The account ended as the dhalang identified the characters now assembled in formal
    audience with the prince.


    With great deliberateness, the prince of Pringgadani, Gathukkasa, exchanged greetings
    with each person present in turn. The order in which he did so, and the titles
    and degree of linguistic formality he used in each of these exchanges, were determined
    by the status of each of his interlocutors. An elder visiting from another kingdom
    received long, elaborate thanks and offers of refreshment. These greetings were
    graciously acknowledged by the guest, the refreshments modestly declined. Knights
    who were members of the prince''s own retinue then themselves expressed gratitude
    at their prince''s concern for their well-being, and they greeted the guest present
    at the royal audience.


    The exchange of greetings took several minutes to complete Following it, Prince
    Gathukkasa summoned his prime minister, Bajradenta, to come forward, in order
    to discuss a matter that was causing him great disarray. The dhalang now sang
    another suluk, after this half-hour or so of preliminaries, and the focal point
    of the story was'
