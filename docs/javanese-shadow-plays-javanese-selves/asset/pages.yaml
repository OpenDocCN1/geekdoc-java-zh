  md: '# INTRODUCTION 9


    the performance, though spectators on the sidelines stood. These people''s attempts
    to get a better view, plus the constant coming and going of spectators, often
    made it impossible for others to see the screen without standing up.


    At about nine, Ki Cerma rose, advanced toward the screen, and sat down cross-legged
    in front of it. He took puppets that he would use in the first scene out of the
    puppet box, and checked to see that another son, Harsa, who was sitting behind
    him ready to assist him, had taken out others that he would need later. Then he
    took up the wooden mallet and started the performance by rapping the side of the
    puppet box to his left.


    Many of the invited guests arrived after the performance had begun. They came
    on bicycles or motorbikes if they lived outside the hamlet where the sponsors''
    home was located. They had to make their way among the vendors and spectators
    to whose vehicles were parked, overseen by the neighborhood youths, who had numbered
    parking checks. Then they passed along a receiving line as they entered the sponsors''
    house. Some women accompany their husbands to evening ritual celebrations, most
    of the guests who came at this time were male. They were escorted to the area
    behind the screen by a relative or friend of the sponsors and shown a place to
    sit, its proximity to the screen depending on their social status. Women spectators—there
    are rarely few—sat further inside the house, behind the men. Invited guests struck
    up conversation among themselves, whether they had been previously acquainted
    or not. Few of them paid much attention to the performance until the dhalang sang
    the lines of the suluk indicating that the exposition of the plot was about to
    begin.


    The pace of the long opening scene quickened when Prince Gathukaka and his courtiers
    breached the issue at hand. Gathukaka revealed that his disarray was due to the
    disappearance of his father, Werkukara, one of the five virtuous Pandawa brothers.
    Gathukaka and his minister, Rajradendra, were still discussing this grave turn
    of events when the arrival of a priest (pandhita) caused a great stir at the court.
    The priest, named Begawan Durawicara (“Priest False Speech”), aroused great suspicion
    among some of the courtiers, but his assurances that he could find Gathukaka''s
    father impressed the prince, who entrusted all responsibility'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# INTRODUCTION


    for the kingdom to him. Durawicara informed Gathkutaka that all he needed to do
    to meet up with his father was to enter the magical pocket in him, the priest''s
    own, robes, while the sage did meditation. Gathkutaka and the priest then left
    the audience hall together, to the general dismay of the court.


    Once the long formal opening was past, most spectators listened to the dhalang
    as he took on puppet''s voice, and they watched more attentively as he moved each
    puppet''s hands as it spoke. The dispute between Durawicara and one of the courtiers
    doubtful of the veracity of his claims was typical of such opening scenes. Although
    the characters had to observe the constraints upon their acts and gestures that
    these figures argued heated, and the barely suppressed tension riveting the spectators''
    attention. To be able to make characters enter into arguments, countering their
    points of view convincingly, is considered a very valuable skill in dhalang.


    The shrewd and powerful Kresna, who is an incarnation of the god Wisnu, and his
    brother Baladeva arrived in Pringgadani to find the courtiers greatly distressed
    at their prince''s departure with Durawicara. Kresna entered the palace to learn
    more about the mysterious magic pocket only to find himself growing strangely
    and suddenly weaker, while the priest grew stronger. Gathkutaka entered Durawicara''s
    chambers and feared that he would now kill the prince. Durawicara invited his
    son, Lesmanagandrakumara, to come forth of his other pocket. When he did so, it
    was apparent that this son had taken the exact same form as Gathkutaka. His father
    told him that now the young man would be able to follow Gathkutaka''s wife, Pegiwa,
    in thinking that he was her husband, and he would be able at fulfill his long
    frustrated amorous desires for her.


    By now it was past evening in virtually all performances of wayang, the prime
    minister, Rajajaran, reviewed the royal troops in preparation for the battle that
    was sure to follow upon the recent, unsettling events. In this "departure of the
    troops" scene (budhalan), the dhalang displayed his singing voice in the lines
    of the suluk he sang, and he displayed his ability to manipulating the puppets
    and styles of movement of the different puppets. Among the guests and musicians
    there was also considerable movement, since by this time young people had begun
    distributing snacks and glasses of tea'
