    # THE LURAH AS A FIGURE OF AUTHORITY


    Javanese assume that officials are corrupt until proved otherwise, and they resent
    any interference in how they choose to run their own lives. At the same time,
    however, they are in no way comfortable with ideas of anarchy. The need for authority
    in order to maintain an even and untroubled social environment is never questioned.
    Those people who wield some form of power, whether spiritual, bureaucratic or
    material, are viewed as mainstays upon whom all de-'
