    More critical to Javanese than the historical veracity of wayang stories is their
    integrity: the way in which each important story links to others in the entire
    corpus. When I asked informants the difference between sejarah and cerita, many
    spoke of the former genealogy (saraslah), and the latter as elaboration or embellishment
    (kembangan). Kembangan vary, but genealogies must remain unaltered. The distinction
    underlies between principal and secondary lakon (lakon pokok and lakon carangan),
    but principal lakon already represent elaborations upon the basic genealogies.
    The point is that principal lakon must be internally consistent, their several
    strands contributing to the progression of the whole epic cycle. They must follow
    in order (urat). It is this inviability, and the impression of an inevitable progression,
    I believe, that the classical lakon pokok their power. Each enters into a cycle
    that moves like an unstoppable chain of associations until the end of the Brutayuda.


    The power of this chain is great. That principal lakon are all of a piece demonstrated
    to me whenever a dhalang began to tell me one of them. Once he started, he couldn''t
    stop. There is no point of resolution in these stories: each event leads to another,
    and that to another, the end of the whole cycle is reached. It is so there inhered
    in the mythical cycle a cycle to be played out until exhausted.(I became reluctant
    to ask any since Brutayuda lakon because I knew it would mean listening to everything
    that happens in the war after that.) It is perhaps reductive reasoning on my part,
    but the unvarying structure of performance (the pathokan) seems to me one way
    of breaking the chain, imposing a beginning and, more importantly, an end within
    this long and implacable series.


    Newer lakon, in contrast, are isolated units. The preference for new lakon that
    in no way advance the epic cycle represents a means of escape from the entangling
    stories of the whole corpus. Ignoring the issue of the historicity of the tradition
    further removes it from a person''s geographical and historical environment. And
    if the power and prestige of lakon depend on their irreversible drive toward a
    conclusion, anyway exegesis seems to consist in draining such energy from the
    tradition, in favor of its own speedy conclusion. The reduction of all lakon to
    a stereotypical account of individual development makes exegesis not an investigation
    but an imposition, of an invariant and so largely insignificant "meaning."'
