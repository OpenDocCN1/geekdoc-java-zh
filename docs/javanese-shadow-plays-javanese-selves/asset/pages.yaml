    lang the central figure, three topics that recur frequently are self, power, and
    language. To speak of interaction is to speak of selves. But mention of self immediately
    poses an essential problem in any-anthropological inquiry: How is the self understood
    in a particular culture? Since cultural assumptions about the self impinge fundamentally
    on all interpersonal relations, one must ask what the critical attributes of an
    individual''s identity are thought to be. In Java, the self is defined constantly
    in two ways: placed in the social hierarchy, and as in possession of a particular
    concentration of power. Hierarchy is constantly at issue in Javanese interaction,
    social status shapes interaction everywhere, but in Java its effects are quite
    precisely registered. The concept of concentrations of power, meanwhile, provides
    Javanese a way of conceiving, justifying, and at times even trying to alter, much
    about one''s social status.


    In referring to a person''s "concentration of power," I am alluding to Javanese
    ideas about a kind of spiritual energy that individuals possess in varying degrees,
    understandings that Moertono and Anderson have brilliantly analyzed (Moertono
    1968; Anderson 1972b). People''s actions, their speech, and their fortunes are
    all affected by the spiritual potency they wield, and by the potency others hold.
    Among those "others" are their parents and ancestors, political leaders, specialists
    in ritual and curing, and dhalang. Interaction with any of these figures always
    implies concern with potency: its concentration or dispersion, its attainment
    or loss, and its implementation or avoidance. In Wayang, not only are many of
    the incidents portrayed on the screen informed by an abiding interest in the possession
    and manifestations of potency, but so are the relations that a spectator enters
    into with the dhalang and the illusion that the dhalang creates.


    Potency is at issue in interaction, but it remains largely implicit. Speech in
    Java makes explicit the understandings of self and to potency which I have alluded.
    The Javanese language exhibits the most highly elaborated speech levels of any
