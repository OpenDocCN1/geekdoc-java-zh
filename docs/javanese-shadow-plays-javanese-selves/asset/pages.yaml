    # SHADOW PLAYS AND SOCIAL SCIENCE


    Javanese wayang is an eight-hour performance that draws on the energies of a great
    many people and fits into a larger event that can mobilize dozens or even hundreds
    more. It is by no means the only major art form in Java. On the contrary, Java
    offers a remarkable number and range of performing arts. These include village
    performances in which many go into trance, commercial folk drama, several courtly
    dance traditions, stand-up comics, singers of Indonesian, Javanese, and Islamic
    pop music, and many more. It is true that traditional performances are now nearly
    forgotten. Few the performances of topeng (dance with masks) or len mandra waranan
    (a performance in which players sing, but gesture a kneeling position) that take
    place in contemporary Java. But new forms crop up, and the Javanese taste for
    all forms of theatre show no sign of diminishing. In fact, theatre seems to pervade
    Javanese life. Whenever Westerners speak of polite Java, with their orchestrated
    conversations and choreographed gestures, they fall instantly into theatrical
    metaphors. In all the drama, the shadow play stands out as the preeminent art
    form in Java. It is the tradition that Javanese themselves consider the most important,
    the most prestigious to perform, and the most distinctly Javanese. Even Javanese
    who don''t care for wayang, and there are many such people, nevertheless speak
    of it as uniquely meaningful, or as they put it, “full." Its influence on other
    traditional art forms is great. Much of the court dance tradition consists not
    only of stories adapted from the shadow play tradition, but also of move-'
