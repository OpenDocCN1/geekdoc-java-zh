    This account of a pleasurable but seductive forgetfulness illuminates, as I will
    try to show, much about Javanese reactions to wayang in performance: what it is
    people savor, and what it they fear. Comments about wayang''s value stress the
    normative, didactic function of the art form, but reactions to performance indicate
    a more enticing, yet potentially disorienting, effectiveness. The unresolved nature
    of these reactions gives rise to the simultaneous resistance and fascination with
    wayang that Javanese entice, reactions that call to mind the seductive appeal
    of service at the royal court that Pak Cerma described.


    # WAYANG AND MEANING


    Before broaching the topic of how wayang pleases, or tempts, I must consider the
    topic of what wayang means. The content of a performance of wayang is obviously
    not conceived of a representation of life. The vagaries of its plots and the motivations
    of many of its characters may be familiar, it does not attempt, as most Western
    drama has attempted, to mirror and comment upon a reality outside itself. No doubt
    realism in Western drama is as much a convention as any other style. Yet wayang''s
    disregard for realism, in contrast to the West''s embrace of it, marks a critical
    difference between the two traditions.


    If drama in the West is thought ideally to focus on a particular problem or set
    of problems, and to make its form and content conform to the nature of some message,
    wayang engages in a much more fluid and analytically less focused relationship
    with the “real” world. It is a commentary on that world inasmuch as certain essential
    Javanese concerns—kinds of power, roles, and styles—motivate much of its content.
    But it exaggerates, distorts, or even contradicts much ideology without ever confronting
    those inconsistencies. Issues tend to arise and disperse in the course of a performance,
    often resolved only temporarily, or by some fortuitous shift in the plot. Fortuitousness
    is not insignificant, as A. L. Becker has made clear. Coincidence, he argues,
    has a power in Java that it lacks in Western aesthetics and thought (A. L. Becker
    1979). Although imperceptible forces operative in the world, however, it does
    not suggest any resolution of the conflicts that inevitably arise within an inconsistent,
    though normatively binding, ideology.'
