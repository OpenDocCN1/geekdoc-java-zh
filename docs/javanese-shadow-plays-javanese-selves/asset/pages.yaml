    means that the distinction between them is obscured. The Javanese tradition of
    tembang makes an author conform to highly formalized meters. In fact, Javanese
    literary genres are extremely conventional, so that language and manner of narration
    as well as meter are limited to a particular, quite restricted range. The author
    must conform to this tradition closely in composing a “new” text. A reader must
    conform to that finished text. The reader adds so much to the text, that addition
    is so essential a part of the transmission of the text, that the reader in a sense
    participates in creating the text—more so, or at least more obviously, I would
    claim, than silent readers of a Western text do in their reading. A Javanese text,
    that is never more than half-fused as long as it remains in its written form.
    Only as realized in a sung and embellished version does the text become fulfilled,
    and there are definite limits on how far the text can control the reader’s reading.


    However, each completion of the text is purely ephemeral: the reader beyond the
    moment of reading. The text, on the one hand, exerts only control over the reader.
    The reader, on the other, for all the authority he she enjoys over the text’s
    realization, leaves no trace. Author and reader are therefore co-participants
    in the text’s generation, while both are subject to quite strict, given form.
    The relative importance of author and reader in any particular reading depends
    on whether a highly embellished “concert” version of a tembang or a simpler reading
    takes place, the latter laying more emphasis on the sense of the words. The considerable
    constraints the tradition exerts upon both author and reader, however, means that
    any text and any performance represent variations within an all-embracing and
    deeply conservative tradition. These constraints stress both the authority of
    the text as a whole, in its permanent contingencies, and the transient peace of
