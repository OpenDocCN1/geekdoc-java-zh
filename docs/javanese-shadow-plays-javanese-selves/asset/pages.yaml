    and its signs are another essential aspect of the differentiation of characters.
    No matter what the lakon, the status and style of a character should be respected
    at all times. The structure of authority is quite straightforward. The gods have
    superior position and power to those of the knights (satriya) and servant-clowns
    (punakan), and within each of these sets there are further graduations according
    to rank and age. In support of the official hierarchy stands the official, unless
    unvinced, that superior status depends on superior accumulations of potency. As
    Anderson has pointed out, the loci classi for this notion of potency are, in stasis,
    the perfect kingdom with which every performance begins, and in action, the satriya''s
    fight against monsters at around 2:30 in the morning (Anderson 1972b.39). In the
    first case it is the noble qualities and mystical power of the king that cause
    all submit voluntarily to his sovereignty. In the second, it is the same store
    of kakuwan batin that makes the knight invulnerable to attack and fearsome in
    the efficacy of his counterblows.


    The hierarchical distinction of types of characters does not apply so clearly,
    to the two sets of cousins, the five Pandawa and the hundred Kurawa, who struggle
    for the kingdom of Ngastina forms the basis of most wayang performances. The tension
    that motivates the Mahabharata stems from the intricate and intertwining claims
    of the opposing cousins, each party having at least some justice on its side.
    The Javanese response to this complexity, however, at least the current one, is
    to simplify the issues and to distinguish the sides as far as possible. Differences
    in status among the cousins are fine, but contrasts in appearance and character
    receive great emphasis. No Kurawa has the form of a truly refined knight. All
    are large, or misshapen, or the least look straight ahead unashamedly. One has
    a speech defect, another a loud, another an Javanese accent. Their characters
    are unattractive; they are unscrupulous, selfish, often coarse, stupid, and/or
    rude. By depicting the Kurawa in these unflattering ways, dhal magnify the contrasts
    and minimize the connections between the Pandawa and the Kurawa.


    The division into good—righteous, attractive, admirable—and bad—devious, unattractive,
    unworthy—is so thorough in wayang as to rule out the analysis of character, motivation,
    and ethics on which Western drama is based. In fact, the aggregate of known traits
