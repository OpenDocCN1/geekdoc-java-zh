    Javanese is by no means hard and fast, but several informants spoke of sejarah
    as "what happened," and crita as "what people say." Whether or not wayang stories
    recount the history of Java is actually moot for Javanese. Many Javanese associate
    features of the landscape with stories and characters in wayang. The cave where
    the monkey brothers, Sugriwa and Subali, suddenly became enemies is located by
    some north of the village of Wates; the village of Dwarawati near Jatim is identified
    by some with Kresna''s kingdom of that name; and several different sites are claimed
    as the mountain on which Arjuna meditated slaying Niwatakawa. many people are
    skeptical of these identifications, particularly people who have heard, as many
    Javanese have heard, that the stories come originally from India. What is remarkable
    how little difference the issue of the stories'' historical veracity seems to
    make. Connections between the present and known world, the art form, and the past,
    matter little to Javanese appreciation of wayang.


    One reason people speak vaguely about the historicity of stories from a habitual
    reluctance to pass judgment upon the truthfulness of any statement. One man in
    Karanganom said that sejarah and crita are the same as wrong, because both consist
