    Aside from financial interests, children provide the focus of a Javanese marriage.
    Javanese say that the father provides for his family and makes all important decisions,
    whereas the mother nurtures the children. Just as importantly, a man exerts the
    authority that asserts and maintains the prestige, dignity, and influence of the
