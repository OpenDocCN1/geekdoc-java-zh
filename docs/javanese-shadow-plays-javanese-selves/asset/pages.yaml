    lack of interest in developing a specific problematic contravenes Western criteria
    for great drama—but that is beside the point. I remark upon the contrasts between
    Javanese performances and Western aesthetics not to criticize the former, but
    rather raise questions about the nature of Javanese aesthetics. The lack of a
    sustained problematic is interesting because it can be linked to a broader issue:
    the ways in which Javanese deliberately insulate themselves from the impact of
    wayang, both in their reactions to a performance and in their commentary upon
    the tradition.


