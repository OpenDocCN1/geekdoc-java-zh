    # NGËLMU  KÉRATA BASA


    Though wayang stories and ngëlmu threaten the unwary with a dispersal of self,
    external objects and knowledge are not necessarily pernicious. Just as powerful
    heirlooms (pusaka) exert an equivocal power, so any type of ngëlmu is an aid to
    those who know it provided its potency is adequate to it—provided, that is, that
    they can exercise freedom over it. Two kinds of wsdom much appreciated by Javanese,
    the displays of ngëlmu often includes in a performance and the device of kérata
    basa alluded to several times already, illustrate what such control consists of:
    the subjugation of phenomena by means of connections made from obvious sense.


    A dhalang can show his ngëlmu in performance in a variety of ways. The punawakan
    Petruk''s homiletic discourses on propriety and honesty are termed ngëlmu, as
    are much more esoteric accounts about the immaterial world. Many displays of ngëlmu
    repeat the correspondences with the cardinal points, colors, traits, etc., that
    are at a mainstay of the genre. Another favorite form is a bantah, which means
    literally “debate” but which is actually an exposition of any doctrine through
    a kind of catechism. Ki Anom Suroto gave the most impressive bantah of ngëlmu
    I have seen in his rendering of the classical bantah Parta dewa. In it, Pandhuta
    Durna tries to create a mysterious newcomer to Ngamarta, a certain Parta dewa,
    who has been given the throne by the sons of the Pandhawa the disappearance of
    their fathers. Durna challenges Parta dewa in a series of questions as to what
    is associated with the number of fingers on his hands. A countdown from ten to
    one, Parta dewa names the following: ten pengasaan (meaning unclear); nine watak
    (“character traits”); eight rules of properly conduct; seven gods; six types of
    water; five kinds of bayi (“wind”), “energy”; four kinds of windu (“eight-year
    cycles”); three types of light; two elements in any set of opposites; and one
    question, which he puts in turn to his challenger. This question leads to the
    exposition of five plus four eight more categories, and this non-classical section
    concludes with the manipulation of the figures to arrive at the magic date of
    17/8/45.'
