    There is a similar effort to distinguish fathers and sons in their respective
    stores of mystical knowledge (ngèlmu), consisting of magical formulas (ay-ay and
    rapal), arcane lore, and knowledge of various ascetic and mystical practices.
    Ngèlmu can be translated as "knowledge" or "wisdom." It contrasts with "science."
    The latter may be difficult and obscure, and it confines itself to the external
    world, as understood by subject and everyday relations of cause and effect. It
    is what one learns about school and what Westerners have such a knack for. Ngèlmu,
    on the contrary, deals with all manner of things not susceptible to obvious analysis:
    formulas, spirits, sorcery, asceticism, vows—in a word, that are tied to the operations
    of kakuwatan batin. A guru in his late teens may begin to develop an interest
    in ngèlmu in the form of invulnerability magic. As he achieves adult status, his
    interests also diversify. The great spiritual potency of an old man accounts for
    his ability to remember and deploy this esoterica. But people assured me that
    a man could not find a guru (a teacher of ngèlmu) in his father. The particular
    bond of respect and loyalty that ties a student to a guru, a highly idealized
    in Java, is distinguished from father and son. Javanese also realize a son''s
    relationship with his father when they insist on a son''s obligation to feast/respect
    his father, and to support him in his old age. But the conventional image of the
    young man gives guidance and strength through the teachings of a guru stands at
    a remove from family relations. In fact, the special status of the bond between
    guru and student, while likened normatively to that between father and son, differs
    from relation it fills in conscious and positive affective ties that are lacking
    among males within the family.


