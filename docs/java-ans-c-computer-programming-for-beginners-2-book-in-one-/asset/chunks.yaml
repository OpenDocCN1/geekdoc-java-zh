- fmt: "\nYou are already familiar with the first two – `public` and `private`. When\
    \ the variable is declared to be `public` then it can be anywhere in the program\
    \ you are writing. In contrast when it is `private` then it can’t be seen or accessed\
    \ anywhere else but in the body of the class where it has been instantiated.\n\
    \nLet’s move on to the other two access control modifiers. The next one on the\
    \ list is called `protected` – which is useful in case you want to create libs.\
    \ When a variable is `protected`, it means that it can only be seen within the\
    \ package where this Java construct has been instantiated – note that this also\
    \ includes all the subclasses. The `default` access control modifier, on the other\
    \ hand, is used by the variable when the other three aren’t specified. In this\
    \ mode, a variable can be accessed within package or class where it has been instantiated\
    \ by the programmer. However, do take note that the variable is only accessible\
    \ within the main body of the class and it is not available within its subclasses.\n\
    \nNote that you can also create an object within a method and the usual rules\
    \ apply – the object or variable can only be accessed within the body of the method\
    \ where it has been created. Here’s another important point that you should remember\
    \ about variables that you create within a method – it can only specify one keyword\
    \ for it: `final`. You will not be allowed to create a default, `protected`, `public`,\
    \ or even a `private` variable within the method body. And that is basically how\
    \ information is hidden in your code, which, if you observe, facilitates data\
    \ abstraction and encapsulation.\n\n## Encapsulation? Information Hiding? What’s\
    \ the Difference?\n\nIt would appear at first glance that encapsulation and data\
    \ or information hiding may look the same, but there is indeed a subtle difference\
    \ between these two terms. Now, Nat Pryce and Steve Freeman has made quite an\
    \ accurate distinction between these two although you may read from other authors\
    \ who use these terms interchangeably. We’ll use Freeman and Pryce’s descriptions\
    \ here to draw the difference between these two concepts in Java programming.\n\
    \nLet’s begin with information hiding since that is where we left off. You can\
    \ already judge what “information hiding” means. It simply means information is\
    \ concealed. The actual functions and procedures performed by the program are\
    \ concealed. But, for what purpose? Why are the inner workings kept hidden from\
    \ the programmer? The lower level details are ignored so that you, the programmer,\
    \ can focus on much more important things. That is also why data is abstracted\
    \ in Java. You can create classes, objects, and other elements of your program;\
    \ you can even import objects from one program to another without worrying about\
    \ the details on how that object does what it does.\n\nIt’s like driving a car.\
    \ All you need to know is that when you insert your key into the keyhole and start\
    \ the car, it will start. You don’t have to worry about what makes it start, how\
    \ the wires are connected underneath there, where the gas goes, how the engine\
    \ burns the gas, etc. All you need to worry about is starting the car and driving\
    \ safely.\n\nEncapsulation, on the other hand, allows the user to control the\
    \ amount of change in an object can affect the other parts of class. The term\
    \ “encapsulate” means to enclose everything in a singular cell. That means that\
    \ given the way the Java programming system is designed, there will be no expected\
    \ dependency from one independent cell to another. Remember that objects within\
    \ the Java programming environment are meant to be stand alone, and there are\
    \ no global variables to reference.\n\n## Abstraction\n\nAbstraction simply refers\
    \ to the process of hiding unnecessary details of an object and only showing the\
    \ ones that are relevant. Encapsulation on the other hand simply means the binding\
    \ of the states and the methods of an object together. This binding eventually\
    \ creates something called a class (we’ll cover that in a little bit). Finally,\
    \ message passing refers to the ability of objects to interact with other objects.\n\
    \nHigh-level programming languages, on the other hand, have a much higher level\
    \ of abstraction, meaning that code goes through a program called a compiler,\
    \ which acts as the computer’s translator, before the computer is able to use\
    \ it. This level of abstraction is usually to the point where the programming\
    \ language already has syntax similar to English, a global language. The compiler\
    \ assumes the role of the translator between the high–level language and the machine.\
    \ This allows the programmer to write their program in a more natural manner,\
    \ as it allows for the coder to use more \"natural\" language, and the higher–level\
    \ language allows for some functions to be automated, making life much easier\
    \ for the coder. The trade–off here however is that the code has to go through\
    \ a compiler, which will take lengthier for the program to run and execute, and\
    \ the computer will often use more memory as compared to a lower–level language.\
    \ Amongst these high-level languages are the more frequently–known ones, such\
    \ as Python, C++, and our topic for today, Java.\n\n## Chapter 16: Java Interview\
