    function.Why functions are used?Imagine programming with a lot of static code
    that does the same task. It is not feasible and consumes a lot of time for the
    programmers.This is the reason why functions are used to regulate the large code
    and maintain equity in the program.With the help of functions, we can divide the
    code into many modules and can easily check them with any available debugger.
    Functions are also to organize and maintain, unlike complex static code that can
    go on for an infinite distance.For example, if you want to create a stock investor
    program in the normal programming instance you need to create static input and
    output for every option that is displayed on the interface.However, in procedural
    programming with the help of functions, you can create options or menu instances
