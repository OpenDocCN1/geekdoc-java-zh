  trans: "\n\n此注释跨越了两行。*/如果你查看上面的注释，你会注意到它以 `/*` 开头，以 `*/` 结尾。此外，如果你查看前一张图片（图 8），你会注意到有些注释以单个正斜杠和两个星号（`/**`）开头，但以一个星号和一个正斜杠结束；这被称为\
    \ Javadoc 注释。\n\n### 什么是变量（Variables）\n另一方面，变量是一个包含特定数据类型及其被赋值或接收的值的“对象”。它之所以被称为变量，是因为其中包含的值可以根据它在代码中的用法、程序员如何声明其值，甚至程序用户选择如何与其进行交互而发生变化。简而言之，变量是数据类型的存储单元。访问变量允许程序员方便地标记并调用手头现的存储值。\n\
    \n### Java 中变量的类型\nJava 要求程序员使用声明语句，即用于声明变量并通过指定特定数据类型和名称来定义它们的代码行。Java 有一种处理变量的特殊方式，即将变量定义为包含特定类型和数值信息的容器，这与\
    \ Python 等某些语言不同，Python 只需要声明变量，变量就可以动态更改其类型；Java 变量是静态的，一旦声明，就会保留其类型。\n\n```\n\
    Int number = 20;\nBoolean completed = true;\nString hello = “Hello World!\";\n\
    ```\n\n声明的语法在之前的示例中可见，变量类型在前，然后是变量名，最后是值。同样注意，声明语句可以在一行中由多个声明，如下例所示：\n\n```\n\
    Int number = 20, Boolean completed = true, string hello = “Hello World!”;\n```\n\
    \nJava 变量可以在开始时不赋任何值进行声明；在这些情况下，Java 选择用特定的默认值声明这些变量，例如：\n\n```\nByte a;\nShort\
    \ num;\nBoolean answer;\n```\n\n结果将分别产生值 0、0 和 false。更完整的默认值列表如下：`byte`、`short`、`int`\
    \ 和 `long` 数据类型都将产生默认值 0，而 `float` 和 `double` 数据类型将具有默认值 0.0，`char` 数据类型将产生 ‘u\\\
    00000’值，`string` 或任何其他对象将具有 null 默认值，所有 `Boolean` 都将以 false 默认值开始。在 Java 中，变量在声明时是静态的，这意味着程序员必须定义变量将包含的数据类型。为了说明，如果我们想使用变量\
    \ `num` 来存储一个数字，我们必须先声明变量：`int num ` ，然后才能赋值，例如 `num = 10`。上述过程通常被称为“赋值语句”（assignment\
    \ statement），其中值根据程序员的声明被赋值给变量。\n\n然而，Java（事实上实际上是大多数编程语言）工作原理的一个显著特点是，在赋值语句中（例如我们的示例\
    \ `num = 10`），存储的实际值是等号右侧的值，即值 10，而 `num` 只是调用该存储存储的“标记”。这就是为什么许多 Java 程序员倾向于使用“获取”（getting）一个值的术语而不是“赋值”（assigning）的原因，尽管在大多数情况下，这两个词可以互换使用，且在某些少数情况之外，功能基本相同。然而，请注意，一旦值被赋值给变量，就需要执行函数才能使变量内部的数据更改其数据类型。\n\
    \n### 变量的命名\n创建变量是一项简单的任务，特别是考虑到 Java 程序员倾向于根据数据类型或变量将存储的内容来创建和命名它们。然而，在命名这些变量时有几个规则，否则\
    \ Java 将无法识别它并导致错误信息。变量名的主要限制是它不应以特殊字符（如下划线）或数字开头。但是，变量名可以是字母、数字等字符甚至是下划线，只要下划线不放在开头。不能使用其他字符，例如\
    \ `#` 甚至 `$`，因为这些特殊字符在 Java 中有不同的用途，因此在变量名中不会被识别。\n\n虽然这些是主要规则，但在命名变量时有一些提示：\n\
    - 变量名应该是具有描述性的，因为在较长的代码中，可能很难记住“x”是做什么用的。像“count”或“output”这样的变量名比使用通用的“x”或“y”更容易记忆，并将有助于避免混淆。\n\
    - 除了具有描述性外，如果变量名保持相对较短，变量将更容易使用。虽然像 `banking_information_account_records` 这样的变量名非常有描述性，但在程序中需要重复输入它会非常累，而且较长的变量名会增加拼写错误的概率，从而导致代码中的错误。\n\
    - 同样注意，Java 变量的习惯一直是写成全小写字母，虽然对大小写没有限制，但保持小写可以简化问题，因为漏掉大写可能会导致变量无法识别，因为 Java 将大写字母读取为与小写字母完全不同的字符。\n\
    \n### Java 原始类型（primitive types）\n### 方法命名规范（Method Naming Conventions）\n我们将重新回顾\
    \ Java 中的命名规范，因为你将使用成员方法。Java 编程中的方法执行操作，它们还接收调用者提供的任何参数，并且还可以向调用者返回操作结果。\n\n\
    以下是声明方法的语法：\n\n```\n[Access Control Modifier] Return Type methodName ([set of\
    \ parameters])\n{\n    // body of the method\n}\n```\n\n在你要编写的方法命名时，有几条规则需要记住：\n\
    - 方法名始终是动词或更具体地说是动词短语（这意味着你可以使用多个单词来命名它们）。\n- 方法名的第一个单词应该是全小写字母，其余单词应遵循驼峰命名法（camel\
    \ case）。这里有一个例子：`writeMethodNames()`。\n\n现在，你应该记住动词用于方法名，它们表示一种动作，而名词用于变量名，它们表示某种属性。\n\
    \n### 在代码中使用构造函数（Constructors）\n我们将介绍一些与面向对象编程相关的一些细节。如之前所述，构造函数看起来像方法，你完全可以考虑并将其视为\
    \ Java 中的一种特殊方法。然而，构造函数在几个方面仍然与方法不同。构造函数的名称将与类名相同。使用关键字或运算符 `new` 来创建构造函数的新实例并同时对其进行初始化。这里有一个使用\
    \ `Employee` 类以及各种初始化方法的示例：\n\n```\npayrate1 = new Employee();\npayrate2 = new\
    \ Employee(2.0);\npayrate3 = new Employee(3.0);\n```\n\n构造函数还会隐式地返回 `void` ——\
    \ 这意味着它没有返回类型。你不能在构造函数的体内放置返回语句，因为编译器将其标记为错误。调用构造函数的唯一方法是通过使用 `new` 语句。我们已经在上面的示例中为你提供了几种调用构造函数的方法。最后一个区别是构造函数不能被继承。回到上面提供的示例——第一行包含了\
    \ `Employee()`，它被称为默认构造函数。如你所示，它没有参数。默认构造函数的作用是将成员变量初始化为特定值。在上面的示例中，成员变量 `payrate1`\
    \ 被初始化为它的默认值。构造函数也可以被重载吗？是的，它们可以。\n\n[/content]\n\n`byte`、`short`、`int` 和 `long`\
    \ 数据类型都将产生默认值 0，而 `float` 和 `double` 数据类型将具有默认值 0.0，`char` 数据类型将产生 ‘u\\00000’值，`string`\
