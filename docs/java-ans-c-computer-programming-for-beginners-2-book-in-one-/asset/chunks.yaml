    # 第 4 章：什么是 Java 虚拟机？


    ![Intelligenza Artificiale, Cervello, Pensare, Controllo](img/image_rsrc3YF.jpg)


    虚拟机是一种模拟物理机器软件。在传统的编程语言中，代码被编译为特定平台的机器语言。在 Java 中，代码被编译为一种称为 `bytecode` 的虚拟机语言。`JVM`
    充当字节码和底层物理机器之间的中介。每个支持 Java 的平台都有其自己的 `JVM` 实现。Java 应用程序是可移植的，因为每个 `JVM` 都遵循一个标准接口。


    `JVM` 和标准库的发行包称为 Java 运行环境 (`JRE`)。`JRE` 及其开发工具（如编译器和调试器）的发行包称为 Java 开发工具包 (`JDK`)。


    回到我们之前介绍的初始问题（即让计算 `add 1 + 1`），现在我们有一组指令（即你的算法）来解决这个问题，你接下来需要做的是将它们翻译成计算机可以理解的指令。记住，计算机不说英语或任何其他人类语言。正如之前解释过的，你需要将所有指令翻译成一系列二进制信号。但完成所有翻译工作将花费你大量的时间。记住，每个字符至少由
    8 位组成。之后，你还需要将它们串成实际的指令来访问计算机内存，然后进行数学运算等——简而言之，这是一个巨大的混乱。没有人想处理那些事情。


    所以，你说一种语言，而计算机说另一种语言。那么，你如何让双方在中间点会合呢？这就是 Java 这样的编程语言大显用场的地方。将编程语言想象成计算机和人类都能理解的中间语言——嗯，可以这么说，我们稍后会澄清背后的细节。


    这里的目标是让计算机理解你的指令。在实现这一点之前，会发生两个阶段。第一步是使用编程语言编写你的算法。是的，一种你和机器之间的中间语言。嗯，尽管已经是 Java
    代码，计算机仍然无法完全理解你写的所有内容。这就是第 2 步之处（记住是两步）——你的 Java 代码将由一个名为 `compiler` 的程序进行处理。


    正如我们在介绍 Java 平台组件时解释的那样，`compiler` 是一个将你的编程代码翻译成机器可读指令（即你的计算机可以理解的指令）的程序或应用程序。实际上，后台还会发生一些事情，例如预编译步骤以及访问
    Java 库（之前提到的），然后通过 `assembler` 实际翻译成二进制代码，并向你写的原始代码中添加更多行代码。再次，这一切都是在后台发生的。作为一名
    Java 程序员，你不应该担心这些，因为 Java 平台是为了处理所有这些内容而开发的。了解这些很有趣，也许当你的编程技能提高后，你就可以自己去研究底层编程细节了。


    在我们直接开始编写 Java 编程代码之前，还有最后一点信息你需要了解。那就是 Java 虚拟机。关于今天不同设备中提供的不同硬件和软件，有一个反复出现的问题。手机的硬件软件组件的行为与你的汽车或笔记本电脑不同。更复杂的是，不同处理器芯片、不同操作系统和不同电气元件阵列的组合意味着编译（或翻译）你所编写代码的不同方式。你需要针对你正在编程的设备平台制作机器码。


    ## 那么，什么是 Java 虚拟机或 `JVM`？


    它是一个设计在任何设备或机器上运行计算机程序的程序或应用程序。它在 1995 年发布时是一个极具革命性的程序，直到今天它仍然是一个巨大的创新。它解决了之前描述的困境。将
    `JVM` 想象成计算机内部的一种虚拟计算机。它实际上有两个主要功能。


    第一个是在任何设备、任何操作系统或软件上运行任何程序。这被总结为“编写一次，到处运行”的原则——随着经验的增加，你会听到很多这句话以及其他的编程准则。另一个功能是分配内存空间——它非常擅长管理计算机内存。`JVM`
    加载到计算机的内存（`RAM`）中。它是独立的，这意味着它可以运行在任何支持 Java 的设备上——嗯，今天几乎每个设备都支持 Java。它不会为现有的每种机器、芯片和软件组合生成代码。那是不可能的。即使你尝试，也会让
    Java 变成一个庞大的系统，因为你必须适应所有类型的硬件、软件和操作系统。


    那么，`JVM` 是如何做到的？它产生自己独特的代码格式，称为 `bytecode`。注意，与其他编程语言不同，当你的 Java 源代码被编译时，它并不会直接翻译或转换为机器可读的语言——嗯，再次是因为目标不是创建一种只能在一个平台上运行的特定代码。由
    `compiler` 产生的 Java `bytecode` 是一组机器语言形式的指令。`Bytecode`将在任何安装了 `JVM` 的计算机上运行。这意味着
    `JVM` 不仅运行 Java 代码和 Java 程序，它还可以运行用其他语言编写的程序——只需要将其翻译（即编译）成字节码即可。


    ## 编写你的第一段 Java 代码


    在可以在你的计算机上编写和运行任何 Java 程序之前，你需要先安装它。要安装 Java 运行环境 (`JRE`)（即包含 `JVM`、Java 库和所有其他文件的整个
    Java 系统），你需要通过[点击此处](https://www.oracle.com/java/javase/index.html) 进入 Oracle
    官方网站。这些页面上还会提供如何下载 `JRE` 的说明。某些说明将包括禁用你的防火墙以及预期结果。现在，你的计算机可能会提示你电脑上没有安装 Java（运行
    Java 程序的系统），然后你可以通过[点击此处](https://www.oracle.com/java/help/download.xml) 下载。注意：`JRE`
    是你编写 Java 程序所需的，但你的计算机可能会提示你电脑上没有安装 Java（运行 Java 程序的系统），你可以通过[点击此处](https://www.oracle.com/java/help/download.xml)
    下载。如果某些链接不起作用或你被带到了不同的页面，只需搜索“JRE download”并点击 [www.oracle.com](http://www.oracle.com)
    上的链接。


    ### 必要的工具


    现在你需要一个文本编辑器来编写你的第一个 Java 程序。你可以使用系统自带的任何文本编辑器（例如，如果你使用的是 Windows，可以使用 `Notepad`）。如果你想要有更多编程支持，你也可以使用
    `Notepad++`。然而，如果你想开发应用程序、测试编程代码并拥有让 Java 编程变得容易许多工具，你需要一个名为 `IDE` 的程序（集成开发环境）。IDE
    是一个带有程序员所需的大部分设施和工具的应用程序。你的 Java 代码通常保存为 `.java` 文件。`compiler` 将处理该文件并返回一个 `.class`
    文件，这是一个你可以运行 Java 代码的文件。


    ### IDE 功能


    `IDE` 通常带有自动补全和文本高亮功能。它还可以用于构建执行文件。


    ### 调试 (DEBUGGING)


    调试是 `IDE` 的另一个重要功能。调试指的是定位和移除 Java 代码中的错误。没有人期望你是完美的，但编程错误会阻止你的代码运行。`IDE` 具有调试工具帮助你快速发现错误以便你编辑它们。


    ## 最佳的 Java IDE


    有很多可以用于 Java 编程的 `IDE`。我们无法列出所有的，所以我们将介绍前三个 `IDE`。


    1. **NetBeans**：`NetBeans` 发布于 1997 年，可以在 Windows、Solaris、Mac OS 和 Linux 等操作系统上运行。NetBeans
    实际上是 Java 的官方 `IDE`。就像 Java 一样，NetBeans 是开源的这意味着这意味着免费下载和使用的。它具有语义和语法高亮功能。它还允许你重构源代码（即使其更高效而不产生任何编程问题）。重构是为了提高程序的性能或更新到最新标准。

    2. **IntelliJ IDEA**：`IntelliJ IDEA` 发布于 2001 年 1 月。它运行在 Windows、Mac OS 和 Linux
    上。这个 `IDE` 有两个不同的版本。第一个是商业版（即你需要付费的版本），另一个是 Apache 许可版。这是为认真的程序员设计的 `IDE`——在你获得大量
    Java 编程经验后，我们建议使用这个集成开发环境 `IDE`。`IntelliJ IDEA` 的独特且强大的功能包括流分析和跨语言重构。

    3. **Eclipse**：`Eclipse` 是另一个集成开发环境。事实上，它是专门为 Java 程序的开发设计的。嗯，它也支持其他编程语言，使其成为一个非常强大的工具。如果你是一个初学者，那么以后你可能会考虑这个
    `IDE`。现在有两个 `Eclipse` 版本：一个是云版本称为 `Eclipse Che`，另一个是可以在计算机上下载的桌面版本。这两个版本都带有一整套工具、应用程序和插件，让编程工作变得容易许多。它甚至带有自定义的
    `compiler`。这个 `IDE` 包含了创建和改进插件所需。


    # 第 5 章：Java 程序的基本结构


    ![Bordo, Elettronica, Calcolatore, Ingegner Elettrica](img/image_rsrc3YG.jpg)


    ### 包 (Package)


    在第一行，我们有语句 `package helloworld;`。这个语句告诉编译器 Java 文件属于 `helloworld` 包。`package`
    只是类和接口的组合。当我们在文件顶部写 `package helloworld;` 时，我们要求编译器将此文件包含在 `helloworld` 包中。编译器将创建一个名为
    `helloworld` 的文件夹并将文件保存其中。属于同一个包的文件存储在同一个文件夹中。如果你导航到 `NetBeansProjects` 文件夹，你会找到一个名为
    `HelloWorld` 的文件夹。`HelloWorldProject` 文件夹通常位于你的 `Documents` 文件夹。如果你找不到这个文件夹，尝试使用计算机的搜索功能搜索它。在
    `HelloWorld` 文件夹中，你会找到一个包含 `helloworld` 文件夹的 `src` 文件夹。除了我们创建的包，Java 还提供了许多我们可以使用的预创建包。例如，输入输出代码封装在
    `java.io` 包中，而实现图形界面组件（如按钮、菜单等）的代码封装在 `java.awt` 包中。我们需要将这些包导入到程序中。我们以后会学习如何这样做。


    ### main() 方法


    `main()` 方法是所有 Java 应用程序的入口。每当 Java 应用程序启动时，`main()` 方法都是第一个被调用的方法。注意我们 `main()`
    方法括号内的 `String[] args` 单词？这意味着 `main()` 方法可以接受字符串数组作为输入。在我们的示例中，`main()` 方法包含两行代码。第一行
    `//Print the words Hello World on the screen` 被视为注释，会被编译器忽略。


    # 第 6 章：Java 代码结构


    在图中，你应该注意到包名在最。此外，你应该注意分号是结束行的行的符号。分号是重要的，如果你省略了它，程序将无法编译。


    ```java

    package firstproject;

    ```


    接下来是类名


    ```java

    public class FirstProject {}

    ```


    你可以在代码开始处使用左括号，并使用右括号结束代码 `{curly code segment}`。然而，你应该注意，左右括号内部的任何内容都是该代码段的一部分。此外，在左右括号内部的任何内容都是代码段。如下所示：


    ```java

    public static void main ( String[] args )

    ```


    比任何事情都重要的是单词 `main`。为什么？因为每当任何 Java 程序启动时，它首先寻找名为 `main` 的方法。简单来说，一个方法就是一段代码。程序随后执行大括号内的代码。如果你的代码中没有
    `main` 方法，可能会得到错误消息。然而，由于这是你程序的入口点，即使你是完美的，编程错误也会阻止你的代码运行。由于这种原因，你可能会漏掉它。代码的 `public`
    部分（即蓝色部分）意味着该方法在类之外是可见的。另一方面，`static` 意味着创建新对象是不必要的，而 `void` 意味着没有返回值，并且命令随之而来。


