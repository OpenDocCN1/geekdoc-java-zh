    What are variables\nA variable, on the other hand, is an \"object\" that contains\
    \ a specific data type and its assigned or received value. It is called a variable\
    \ because the value contained can change according to how it is used in the code,\
    \ how the coder can declare its value, or even how the user of the program chooses\
    \ to interact with it. A variable, in short, is a storage unit for a data type.\
    \ Having access to variables allow programmers to conveniently label and call\
    \ stored values at hand.\n\n### Types of variables in Java\nJava requires the\
    \ programmer to use declaration statements, lines of code used to declare variables\
    \ and define them by specifying the particular data type and name. Java has a\
    \ specific way of treating variables, by defining variables as containers that\
    \ contains a certain type and value of information, unlike some languages such\
    \ as python, which only requires a declaration of a variable, and the variable\
    \ can dynamically change its type; Java variables are static , which retain their\
    \ type once declared.\n\n```\nInt number = 20;\nBoolean completed = true;\nString\
    \ hello = “Hello World!\";\n```\n\nThe syntax in declaring is seen in the previous\
    \ examples, with the type of the variable coming first, then the name of the variable,\
    \ then the value. Note as well that the declaration statement can be composed\
    \ of multiple declarations in one line, as in the following example:\n\n```\n\
    Int number = 20, Boolean completed = true, string hello = “Hello World!”;\n```\n\
    \nJava variables can be declared without any value at the start; in cases such\
    \ as these, Java chooses to declare these variables with a particular default\
    \ value, for example:\n\n```\nByte a;\nShort num;\nBoolean answer;\n```\n\nWill\
    \ result in the values 0, 0, and false, respectively. A more complete list of\
    \ default values is as follows: the `byte`, `short`, `int`, and `long` data types\
    \ will all result in a default value of 0, while the `float` and `double` data\
    \ types will have a default 0.0 value, the `char` data type will result in ‘u\\\
    00000’ value, a `string` or any other object will have a null default value, and\
    \ all `Booleans` will begin with a false default value. In Java, variables are\
    \ static when declared, meaning that the programmer must define the data type\
    \ that the variable will be containing. To illustrate, if we wish to use a variable\
    \ `num` to store a number, we would first have to declare the variable: `int num\
    \ `, before we can assign a value, such as `num = 10`. The process above is usually\
    \ known as and referred to as an \"assignment statement\", where a value is assigned\
    \ to the variable as declared by the programmer.\n\nHowever, one prominent thing\
    \ about how Java, and in fact how most programming languages, works is that in\
    \ the assignment statement, such as in our example of `num = 10`, the actual value\
    \ stored is the one on the right side of the equals sign, the value of 10, and\
    \ `num` is just the \"marker\" to call that stored value. This is why there are\
    \ many Java programmers that tend to prefer the jargon of \"getting\" a value\
    \ rather than \"assigning\", though for the most part, they may be employed interchangeably,\
    \ and outside of some rare scenario, function mostly the same way. Note, however,\
    \ that once values have been assigned to variables, functions need to be carried\
    \ out in order for the data inside that variable to change its data type.\n\n\
    ### Naming a variable\nCreating variables is an easy task, especially given how\
    \ Java programmers tend to create and name them after the data type or the purpose\
    \ of what the variable will store. However, there are a few rules when it comes\
    \ to naming these variables, else Java will not recognize it and an error message\
    \ will result. The main restrictions around variable names are that it should\
    \ not begin with a special character such as an underscore or a number. However,\
    \ variable names can consist of characters such as letters and numbers, and even\
    \ an underscore, provided that the underscore is not placed at the start. No other\
    \ characters may be used, such as the `#` or even `$` as these special characters\
    \ have different uses in Java, and thus will not be recognized in a variable name.\n\
    \nWhile those are the major rules, here are some tips when it comes to naming\
    \ variables:\n- The variable name should be descriptive, as in longer codes it\
    \ may be difficult to recall just what \"x\" is for. Having a variable name such\
    \ as \"count\" or \"output\" is much easier to recall as compared to having a\
    \ generic \"x\" or \"y\" and will help in avoiding confusion.\n- In addition to\
    \ being descriptive, variables will also be easier to use if their names are kept\
    \ fairly short. While having a variable name such as `banking_information_account_records`\
    \ is very descriptive, typing it repeatedly as needed in the program will get\
    \ exhausting, and having longer variable names increase the chances of typographical\
    \ errors, which will lead to bugs in the code.\n- Note as well that it has always\
    \ been a practice for Java variables to be written in all lower – case letters,\
    \ and while there is no restriction on capitalization, keeping things in lowercase\
    \ simplifies things, as a missed capitalization may result in the variable not\
    \ being recognized, as Java reads an upper – case letter as an entirely different\
    \ character versus a lower – case letter.\n\n### Java primitive types\nMethod\
    \ Naming Conventions\nWe shall revisit the naming conventions in Java since you\
    \ will be using member methods. Methods in Java programming perform operations,\
    \ they also receive any argument provided by a caller, and it can also return\
    \ a result of an operation to a caller.\n\nHere’s the syntax for declaring a method:\n\
    \n```\n[Access Control Modifier] Return Type methodName ([set of parameters])\n\
    {\n    // body of the method\n}\n```\n\nHere are a few rules to remember when\
    \ you make the names for the methods you will write:\n- Method names are always\
    \ verbs or more specifically verb phrases (which means you can use multiple words\
    \ to name them).\n- The first word of the method name should all in lower case\
    \ letters while the rest of the words should follow camel case format. Here is\
    \ an example: `writeMethodNames()`.\n\nNow, you should remember that verbs are\
    \ used for method names, and they indicate an action while nouns are used for\
    \ variable names, and they denote a certain attribute.\n\n### Using Constructors\
    \ in Your Code\nWe’ll just over some some details as they relate to object oriented\
    \ programming. As stated earlier, a constructor will look like a method, and you\
    \ can certainly think of it and treat it like a special kind of method in Java.\
    \ However, a constructor will still be different from a method in several ways.\
    \ The name of a constructor will be the same as the class. Use the keyword or\
    \ operator `new` to create a new instance of the constructor and also to initialize\
    \ it. Here’s an example using the class `Employee` and variety of ways to initialize\
    \ it:\n\n```\npayrate1 = new Employee();\npayrate2 = new Employee(2.0);\npayrate3\
    \ = new Employee(3.0);\n```\n\nA constructor will also implicitly return `void`\
    \ – that simply means it doesn’t have a return type. You can’t put a return statement\
    \ inside the body of a constructor since it will be flagged by compilers as an\
    \ error. The only way you can invoke a constructor is via the use of the `new`\
    \ statement. We have already given you several ways how you can invoke constructors\
    \ in the samples above. One final difference is that constructors cannot be inherited.\
    \ Let’s go back to the examples provided above – the first line includes `Employee()`\
    \ which is called a default constructor. As you can see, it has no parameters.\
    \ The job of a default constructor is to simply initialize the member variables\
    \ to a specific value. In the example above, the member variable `payrate1` was\
    \ initialized to its default value. Can constructors be overloaded too? Yes, they\
    \ can. Constructors behave like methods too so that means you can overload a constructor\
    \ just the same way you overload a method. Here are a few examples on how you\
    \ can overload a constructor. We use the `Employee` class and overload it using\
    \ different parameters:\n\n```\nEmployee()\nEmployee(int r)\nEmployee(int r, String\
    \ b)\n```\n\n### How to initialize a variable\nNow that we know how to declare\
    \ variables, and we know the various types of variables that are available to\
    \ us, the next thing to do is to learn how to make use of these variables in something\
    \ called “expressions”. Expressions are the most used building blocks of a Java\
    \ program, generally meant to produce a new value as a result, though in some\
    \ cases expressions are used to assign a new value to a variable. Generally, expressions\
    \ are made up of things such as values, variables, operators, and method calls.\
    \ There are also some expressions that produce no result, but rather affect another\
    \ variable. One example would be an expression that changes the value of a variable\
    \ based on an operation: there is no new value output, and there is no true “assignment”\
    \ of a new value, but rather there is what is called a side effect that results\
    \ in a changed variable.\n\nIn our previous sample program above, such as the\
    \ \"Hello World\" printing program, we introduced raw values into the `print`\
    \ function, also known as \"hard coding\" the output. However, at this point,\
    \ we should try to incorporate what we learned about variables. Variables operate\
    \ the same way as raw values, as they simply reference a previously stored value\
    \ by the computer, and as such the programmer can just use the variable name instead\
    \ of the value. In order to demonstrate this, let us remember the previous \"\
    Hello World\" program:\n\n```\nprint (\"Hello World\")\ninput (\"n\\nPlease the\
    \ return key to close this window.\")\n```\n\nNow, instead of hard – coding the\
    \ \"Hello World\" string, we can simply declare it into a variable and have the\
    \ program output that variable. This should end up looking as:\n\n```\nString\
    \ = \"Hello World\"\nprint(string)\ninput (\"n\\nPlease the return key to close\
    \ this window.\")\n```\n\nThis should come out with the same result as the previous\
    \ program, looking something similar.\n\n Variables modified by code\nHowever,\
    \ the reader may be wondering why we even use a variable in this case, as it makes\
    \ our code even longer. In very short codes, such as the classic “Hello World”,\
    \ using variables does make it longer, but to demonstrate how they can be used\
    \ to shorten a code, let's use another code to show the usefulness of variables.\
    \ For this code, we will attempt to print out a few times table values. In this\
    \ code we will be using a few iterations and loops, which will be explained further\
    \ on.\n\n```\nInt num = 9;\nbyte count = 0;\nwhile (counter <10) {\n    print(num\
    \ \" * \")\n    print(counter \"= \")\n    print(num * counter \"\\n\")\n    counter\
    \ = counter + 1\n}\n```\n\nThis basic snippet of code will output the multiplication\
    \ table of whatever is in the `num` variable up until times nine. In this program\
    \ we are to be incorporating a so – called `while` condition and an iteration\
    \ function. However, if we break down the components of the code as provided,\
    \ the `while` condition tells Java to continue iterating the code beneath it until\
    \ the condition is not true. Since `count` was initialized at a value of 0, and\
    \ every time the code runs, the `count` variable will increase by one, the loop\
    \ will run for ten times. The code nested within the `while` condition tells Java\
    \ to print an equation of the number multiplied by `counter`, meaning that it\
    \ will print ten lines, from times zero to nine. The code should end up looking\
    \ like the following:\n\n9 * 0 = 0\n9 * 1 = 9\n9 * 2 = 18\n9 * 3 = 27\n9 * 4 =\
    \ 36\n9 * 5 = 45\n9 * 6 = 54\n9 * 7 = 63\n9 * 8 = 72\n9 * 9 = 81\n"
