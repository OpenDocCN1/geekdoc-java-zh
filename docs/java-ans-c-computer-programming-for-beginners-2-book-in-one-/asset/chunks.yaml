    ## 比较运算符


    *   `>` - 大于

    *   `<` - 小于

    *   `>= - 大于等于

    *   `<= - 小于等于


    这里还有四个你可以使用的：


    *   `&&` - 与 (AND)

    *   `||` - 或 (OR)

    *   `==` - 等于

    *   `!` - 非 (NOT)


    第一个，一对和符号，用于同时测试两个或多个条件。我们正在检查用户年龄是否大于 18 岁且小于 40 岁——记住，我们检查的是名为 `user` 变量的内容。第一个条件是“大于
    18”，第二个条件是“小于 40”。在这两个条件之间，我们使用了 `&&` 运算符，因此整行代码意思是：如果 `user` 大于 18 **且** `user`
    小于 40。


    现在运行程序并再次测试；在程序运行之前，你应该已经猜出将打印什么了。`user` 变量的值为 21，因此 `else if` 大括号之间的消息将显示在输出窗口中。


    ### 嵌套 IF 语句

    看大括号的位置——如果一组括号位置放错或漏掉一个，代码将无法运行。嵌套 IF 语句可能有点棘手，但实际上，你所做的只是缩小选择范围。


    ### 布尔值

    与其使用 `int`、`double` 或 `string`，你只需要输入 `boolean`（小写 b），并在变量名之后赋予它一个 `TRUE` 或 `FALSE`
    值。注意，我们使用单等号 `=` 作为赋值运算符。如果你想查看变量是否“等于”某个值，你需要使用一对等号。


    这次，我们在名为 `user` 的变量前面使用了 `!` 运算符。`!` 运算符通过使用单个感叹号来指示，它被放置于你尝试测试的变量之前。这个运算符测试取反，意味着它正在测试与实际值相反的结果。


    ### Switch 语句

    另一种控制流程流的方法是使用 `switch` 语句。它为你提供了测试变量范围值的选项，并可以用来替代复杂的、长长的 `IF … ELSE` 语句。以 `switch`
    单词开始，然后是一对括号。你正在检查的变量放在 `switch` 括号之间，后面跟着一组大括号。`switch` 语句的其余部分放在大括号之间。


    ## 第 14 章：Java GUI 编程

    假设读者不是编程的完全新手，并且已经通过 C 或或其他过程化倾向的语言进入了编程世界，那么下一个逻辑问题就是：为什么要使用面向对象编程呢？嗯，它的主要优势之一是从长远来看，它可以节省时间。


    ## 如何用 Java 构建一个小游戏

    在简单的算法和程序中，过程化编程通常更快、更直接；程序员不需要构造和定义一个 `class`，也不需要基于该 `class` 创建一个 `object`，他们真正需要做的只是声明必要的变量并编写
    `functions`，然后创建算法来解决代码需要处理的问题。


    然而，当涉及到更复杂的程序以及更复杂的解决方案时，这就是面向对象编程开始大放异彩并展现其其实实力的地方。在很多程序中，会有许多“对象”或数据簇必须分组在一起，并且程序员将以特定的方式处理它们。这正是“类”要解决的问题。程序员不需要为每个数据簇声明一组新变量，他们只需要调用预先定义的“类”并创建一个新的“对象”。让我们看看这在实践中是如何运作的。


    每个棋子都有不同的移动方法，取决于它们是什么种棋子。如果程序员用过程化的方式编写象棋游戏，那么他们就必须手动描述每一个棋子：所有的 16 个兵、4 个主教、4
    个马、4 个车、两个皇后和两个国王。此外，他们必须编写 `functions` 让每个棋子都能以其独立的方式移动。


    然而，如果程序员利用面向对象编程，而不是需要编写 16 个兵、4 个主教、4 个马、4 个车、两个皇后、两个国王，他们只需要编写六个 `classes`：每个类描述棋盘一个棋子。程序员现在可以简单地将移动函数包含在每个类中，并用属性描述它们的位置：它们是白王兵还是黑后兵，这些都是通过“兵”类的“属性”部分插入的内容。程序员不需要写
    32 组代码，只需要写 6 组。现在这变得容易得多、简短得多，而且更加优雅。


    ## 第 15 章：面向对象编程

    ![Lavoro, Digitando, Computer, Notebook, Programmazione](img/image_rsrc3YY.jpg)

    我们现在不会处理面向对象编程的所有复杂编码。我们只需要处理核心的原始概念：类和对象。为了理解这些，我们必须首先讨论类。这会让我们之前说的某些内容——比如对象包装器——更有意义。


    ### 什么是类？

    类的实用性源于：有时你需要的比代码自动提供的更复杂的结构。


