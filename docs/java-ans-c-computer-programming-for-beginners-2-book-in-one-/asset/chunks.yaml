    \n文本版权所有 © [Bill Norton] 版权所有。未经出版者书面许可，本指南任何部分不得以任何形式复制，批判性文章或评论中的简短引用除外。\n\n\
    ## 法律与免责声明\n\n本书包含的信息及其内容并不旨在取代或替代任何形式的医疗或专业建议；也不旨在替代可能需要的独立的医疗、财务、法律或其他专业建议或服务。本书中的内容和信息仅供教育和娱乐之用。\n\
    \n书中包含的内容和信息汇自被认为可靠的来源，根据作者的已知、信息和信念，这些信息是准确的。然而，作者无法保证其准确性和有效性，并对任何错误和/或遗漏承担责任。此外，本书将根据需要定期进行更改。在适当和/或必要的情况下，在使用书中任何建议的补救措施、技术或信息之前，您必须咨询专业人士（包括但不限于您的医生、律师、财务顾问或其他此类专业顾问）。\n\
    \n在使用书中所包含的内容和信息时，您同意使作者免受因应用书中提供的任何信息而导致的任何损害、成本和费用（包括可能产生的法律费用）。此免责声明适用于由于直接或间接使用和应用任何建议或信息而引起的任何损失、损害或伤害，无论是违约、侵权、过失、人身伤害、刑事意图还是任何其他诉讼理由。您同意接受使用书中提供的信息的所有风险。您同意通过继续阅读本书，在适当和/或必要的情况下，在使用书中任何建议的补救措施、技术或信息之前，您将咨询专业人士（包括但不限于您的医生、律师或财务顾问或所需的其他顾问）。\n\
    \n## 目录\n\n- [目录]\n- 引言\n- 第 1 章：什么是 Java？\n- 第 2 章：为什么 Java 很重要？\n- Java 标记\n\
    - 第 4 章：什么是 Java 虚拟机？\n- 第 6 章：Java 的代码结构\n- 如何在 Linux、Windows 和 Mac 上下载并安装 Java。\n\
    - 第 7 章：数据类型与变量\n- Java 标记\n- 关键字\n- 标识符\n- 运算符\n- 分隔符\n- 字面量\n- [注释]](#part0009.xhtml_a3NE)\n\
    - 什么是变量\n- Java 中的变量类型\n- 变量命名\n- Java 原生类型\n- 如何初始化变量\n- 算术运算符\n- 算术运算符\n- 赋值运算符\n\
    - 逻辑运算符\n- 赋值运算符\n- 位运算符运算符\n- 第 8 章：Java 数据结构与算法\n- 第 9 章：Java 数组\n- 第 11 章：Java\
    \ Web 开发\n- 使用 JavaScript 进行 Ajax 开发\n- 如何显示输出\n- 转换器\n- 格式化输出\n- 转义序列\n- 第 13\
    \ 章：控制流语句\n- IF 语句\n- IF … ELSE\n- IF … ELSE IF\n- 嵌套 IF 语句\n- 布尔值\n- Switch 语句\n\
    - 如何用 Java 构建小游戏\n- 第 15 章：面向对象编程\n- Java 封装\n- 抽象\n- 第 16 章：Java 面试题\n- 第 17\
    \ 章：Java 语言与术语\n\n## 引言\n\nJava 的历史可以追溯到 1991 年，当时 Haughton、Mike Sheridan 和 James\
    \ Gosling 想出一种最好用于数字电视开发的编程语言。然而，它被认为超于时代，因此他们基于 C 和 C++ 重新开发了它，使其更易使用。\n\n随着开发，Java\
    \ 也产生了一些核心原则，这些：\n- 它具有可移植性——即可以在尽可能多的平台上运行；\n- 它应该是安全且可靠的；\n- 人们应该尽可能地连接它，这意味着它对他们来说是熟悉的，尽管初看看起来很复杂，但迟早他们会理解；\n\
    - 它应该是动态的，可以在线程中工作，并根据需要进行修改，并且它应该精确执行。\n\n你可以看到，这些核心原则让人们可以享受使用而无需购买许多设备。1995\
    \ 年，Sun Microsystems 最终发布了 Java 1.0——Java 的诞生，它具有极高的安全性，并且跨网络访问。多年来，发布了更多版本，自\
    \ 2006 年以来，Java 通过 GNU 通用许可可用——意味着它现在是一种开源编程语言。它的部分内容是私有的且免费提供的，这符合其核心原则。现在开始阅读这本书，你将很快学到\
    \ Java！\n\n## 第 1 章：什么是 Java？\n\nJava 是一种由 Sun Microsystems 构建的语言，后来被 Oracle 公司收购。它被设计为可以在支持\
    \ Java 的任何操作系统上运行。这就是该语言如此流行的原因，因为开发者只需要编写一次程序，就可以在任何操作系统上运行。世界上大多数应用程序是用 Java\
    \ 编程语言构建的。大多数服务器端的业务逻辑也是基于 Java。\n\n在本书中，你将学习如何编写像上面的程序，还将学习让你能够开始编写的高级概念。以下是\
    \ Java 的一些设计目标：\n- 该语言旨在编写一次并在任何操作系统上运行。\n- 该语言应该对许多工程原则提供支持。\n- 该语言旨在用于开发适用于分布式环境的软件。可移植性是一个重要因素。这就是为什么\
    \ Java 能够在 Windows、Linux 和 MacOS 操作系统上运行的原因。国际化支持非常重要。Java 旨在用于编写托管和嵌入式系统的应用程序。\n\
    \n接下来讨论其他设计目标：\n\n### 1.1 强类型检查\n\n Java 是一种强类型语言。定义的每个变量都需要关联到一个数据类型。你现在不需要理解整个程序，但让我们快速看两行代码。\n\
    \n```java\nint i=5;\n```\n在这里，我们定义了一个被称为变量的东西，用于存储值。可以存储的值取决于数据类型。在这个例子中，我们说 `i`\
    \ 的类型是 `int` 或 Integer，这是一种数字数据。\n\n### 数组边界检查\n在运行时，Java 会检查数组是否具有所需数量的值。如果尝试访问数组边界之外的值，将抛出一个异常。你现在不需要理解整个程序，但让我们快速看以下代码。\n\
    \n```java\nint[] array1 = new int[2];\n```\n在这里我们声明了一个数组，它是一组整数值。`2` 的值意味着我们只能在数组中存储两个值。\n\
    \n```java\narray1[0] = 1;\narray1[1] = 2;\narray1[2] = 3;\n```\n通过这段代码我们可以看到我们正在向数组分配\
    \ 3 个值。当你运行这个程序时，你会得到错误，因为程序会发现数组已经超出了两个允许的最大边界。你将在运行时得到下面的错误。\n\n```\nException\
    \ in thread \"main\" java.lang.ArrayIndexOutOfBoundsException: 2\nat HelloWorld.main(HelloWorld.java:8)\n\
    ```\n\n## 第 2 章：为什么 Java 很重要？\n\n接下来，Java 的语法和特征类似于 C 和 C++ 等其他编程语言。如果你有任何之前的编程经验，你会发现学习\
    \ Java 是轻而易举。即使你对编程完全是新手，也可以放心，Java 被设计成一种相对容易学习的语言。大多数程序员发现学习 Java 比学习 C 或 C++\
    \ 更容易。\n\nJava 还被设计为与平台无关。正如前面提到的，Java 代码首先被编译成字节码，可以在任何带有 Java 虚拟机的机器上运行。因此，通过\
    \ Java，你可以编写一次代码并在任何你想运行的地方运行。\n\n"
