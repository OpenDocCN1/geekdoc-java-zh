    is used to display time in ASCII formatprintf( “ Here is the result: %f’, result)//
    We print out the result of the time function}Output:Here is the result:Sat Oct
    22 03:11:34 2020e) ctimeThis will change the local time of your region to the
    default Georgian calendar that is used by the programming environment.Here is
    the program:#include <time.h>// This is the standard time library that needs to
    be importedmain(){// Create a variable to store the resultfloat change;result
    = ctime (change);// This is the default georgian calendar timeprintf( “ Here is
    the result: %f’, result)// We print out the result of the time function}Output:Here
    is the result:22:12:23 changedf) Local timeThis will display according to the
    local time of your location. For example, PST time.Here is the program:#include
    <time.h>// This is the standard time library that needs to be importedmain(){//
    Create a variable to store the resultfloat time;result = local (time);// This
    is used to display the local timeprintf( “ Here is the result: %f’, result)//
    We print out the result of the time function}Output:Here is the result:12:12:32g)
    gmtimeThis is used to display the default UTC according to the ISO conventions.Here
    is the program:#include <time.h>// This is the standard time library that needs
    to be importedmain(){// Create a variable to store the resultfloat default;result
    = gm (default);// This is the clock function that displays UTC timeprintf( “ Here
    is the result: %f’, result)// We print out the result of the time function}Output:Here
    is the result:12:32:45h) mktimeThis format will display the week and month of
    the calendar in a good format.Here is the program:#include <time.h>// This is
    the standard time library that needs to be importedmain(){// Create a variable
    to store the resultfloat calendar;result = mktime (calendar);// This prints out
    the calendar in a good formatprintf( “ Here is the result: %f’, result)// We print
    out the result of the time function}Output:Here is the result:JULY 12 2020 THURSDAY
    22Hours:32Minutes: 23Second:32MillisecondsWith this, we have completed a comprehensive
    chapter that describes various time functions that are available in C programming
    language.In the next chapter, we will discuss in detail about variables in depth.Let
    us go!Chapter 13: Variables![Portatile, Mano, Scrivere, Binario, Codice Binario](image_rsrc3Z2.jpg)Variables
    are one of the important components of any programming language.They store values
    and are often used in functions, structures, and templates. It is always recommended
    to learn about variables in depth before starting to create complex programs.
    In this chapter, we will discuss variables with various examples.Follow along!What
    are the variables?It is important to understand the historical significance of
    memory management before understanding variables. Before the invention of programming
    languages, all the memory is managed using the binary sequences.Everything is
    needed to be done in the hardcoded away. All of the significant memory locations
    are stored using a specific memory address in the computer.However, with time
    these hardcoded methods are proven to be ineffective.A lot of high-level programming
    languages started to use variables which are a symbolic representation of the
    memory locations.How are the variables assigned?First of all, remember that to
    create variables you need to define data types. These are also used for assigning
    literal constants. Data types are an easy way to distinguish the variables.Why
    are data types necessary?Imagine that you need to create a program that takes
    only characters as input values. It is not feasible to use strings that take up
    storage memory. Data types are used for faster memory processing and effective
    storage management. There are different types of data types such as integers,
    floating-point numbers and double. Data types can also be used to store pointers
    that store the variable address. We will learn about pointers in-depth in the
    upcoming chapters.Rules for creating variablesVariables are defined using certain
    preconceived instructions. They are often started using an underscore. However,
    remember that variables are not case sensitive. so, both upper case and lower-case
    letters can be used to create variables.Note: Reserved keywords cannot be used
    as the name of variables. There are more than 60 default reserved keywords in
    the C programming language that cannot be used as identifiers.You can find out
    the reserved keyword list from the official website.Tip:Make variable names simple.
    It is not feasible to use complex long names to declare variables. You can, of
    course, do it but it is not a good programming practice.Here are some of the good
    variable declaration examples:ramdas_UsaRandisHere are some of the bad variable
    declaration examples:1serythisisalongvariablename*gdhdpointerIn the next section,
    we will in detail discuss data types that are essential for the variables.a) NumbersNumbers
    are the most important data entity that is used in programming. All the mathematical
    equations and algorithms require integral constants to solve the specific problem.
    Cprogramming uses various data types to declare numerical variables.i) intThis
    is the most common data variable that is used to declare numerical variables.
    int cannot store decimal values and is said to occupy till ten digits. It stores
    a few bytes of data whenever a variable is declared. While implementing the printing
    statements, %n can be used to print the variables with the int data type.You can
    also use %x and %o to print the stored values in different formats such as octal
    and hexadecimal. Usually, int data type occupies 32 bytes of storage in the memory.ii)
    floatFloating-point numbers are used to represent decimal and scientific notations.
    It can occupy up to 64 digits and can be used while developing complex scientific
    applications. A lot of exponential problems and modulus calculations can be done
    with the help of floating-point literal.When printing the output statements %f
    is used as a notation.iii) doubleDouble is the advanced expansion of floating-point
    literals. In double both negative and positive decimal notations can be used.
    They can extend up to 128 digits. You can use %f or % e to print the double literals
    as an output.b) CharactersAfter numbers, the most important data types should
    be of characters and strings. Almost all applications rely on characters to communicate
    with the users. Here are the character datatypes that C programming language offers.i)
    characterCharacters are single literal expressions that can be used in a program.
    They are usually used to input responses from the user while running the program.
    Characters occupy very less memory storage and are considered good for the allocation
    of program resources.%c is usually used to designate the output of characters
    in the programming languages.ii) StringsStrings are the advanced implementation
    of character expressions. In the real world, it is not feasible to just use characters
    for expressing entities. Strings are one of the often-used data types while developing
    computer programs.%s is usually used to designate strings in the programming languages.c)
    Boolean data typesProgramming is a logical process where the computer should often
    decide between the choices that are given to it. Sometimes they may be random
    but they are usually followed by a logical equivalence. All the conditional and
    loop statements depend on Boolean data types.Usually, there are only two Boolean
    data types that are true and false.There are defined by the identifier _Bool.
    Bool variables can change the understanding of the program execution process.Here
    is an example:if (x >3){_Bool = true;printf(" Enter the condition here")}In the
    above example of a C program, the program is executed only when the logical statement
    is true. If it doesn''t satisfy the logical statement then the program will end
    and give compilation errors.Boolean data types are essential for a lot of logical
    programs and software.With this, we have completed a brief explanation about variables
    and data types.Variable declaration and assignment can be thoroughly understood
    only when you practice coding a lot of programs.We recommend you to look at different
    open source projects to understand the importance of variables. In the next chapter,
    we will learn about pointers in depth.Follow along!Chapter 14: Pointers![Computer,
    Portatile, Tech](image_rsrc3ZB.jpg)This chapter is a clear introduction to one
    of the most controversial and most discussed features of C language that is pointers.
    No other programming languages provide pointers as a feature in their index.The
    extremely low-level interaction with the hardware resources is one of the reasons
    why pointers have become a reality in the C programming language.In this chapter,
    we will give a short introduction to pointers with several examples.Follow along
    to know more about it.What are the pointers?First of all, to understand the concept
    of pointers we need to let you understand the process of indirection in computing
    and in real life. Let us imagine that you are the manager of a book store.A customer
    approaches you and asks for a book that is not available in the book store. So,
    what will you do next? You will inform the wholesale book supplier to get the
    book for your customer.That wholesale supplier you contacted will reach out to
    other book suppliers to give it to you.So, if you look at this example carefully
    you ''the manager'' just acted as a medium to deliver the book for your customer.
    You did not directly go to the book supplier to get that desired book.This process
    of mediating things to complete a task is known as indirection. Pointers in C
    follows the same mechanism. They provide access to the data value you are searching
    for.Just like how indirection reduces cost fares for the manager of the book store,
    pointers help programmers to strategically manage resources.In the next section,
    we will in detail discuss declaring a pointer with examples. Follow along!How
    to declare pointers?First of all, you need to create a variable that can be used
    to declare pointer variables.Here is the variable:int sample = 34;As soon as you
    declare a variable it is declared a storage location in the system. You can check
    it using the ampersand symbol ''&''.For example:&sample;Output:0dfd656The memory
    location will always be in a hexadecimal format.In the next section, you need
    to declare a variable that can act as a pointer.All you need to do is add an asterisk
    in front of the identifier name to declare it as a pointer.Here is the format:int
    *data_pointerThe above statement roughly states that a pointer of an integer data
    type with the name data_pointer is created. After the pointer is declared you
    can use it to point out to other variables.In the next step, we will use this
    pointer to store the first variable location that we have created. This will make
    you understand the importance of pointers in memory allocation statements.Here
    is the format:data_pointer = &sampleNow, whenever you call the pointer, you will
    get the output as the storage location of the sample variable.Output:0dfd656You
    can also use an asterisk as an indirection operator to denote all the variables
    that a pointer holds.Here is the format:*data_pointerOutput:sampleWith this, we
    have completed a brief explanation about the declaration about the pointers.In
    the next section, we will in detail discuss some of the advantages that pointers
    possess in the C programming language.Follow along!Advantages of pointers1)    
    With the help of pointers, you can create a more optimized code. For example,
    if you use static buffers to enclose a large list of values instead of pointers,
    they may lead to buffer flow errors. However, with the usage of pointers, memory
    allocation works perfectly and makes you create more complex programs.2)     Pointers
    are an essential component that needs to be used while dealing with multidimensional
    arrays that hold a lot of elements. Pointers are also extensively used to create
    data structures such as heaps, graphs, and trees.3)     Dynamic memory allocation
    is very essential if you have fewer computing resources. Pointers are the only
    way to maintain an equilibrium between the resources available. If not of pointers,
    C programming language will become clumsy and may need to deal with a lot of run-time
    errors before starting the execution of the program.4)     They are very useful
    when you are trying to do repetitive tasks such as refreshing an element or for
    sorting algorithms.Null pointersNull pointers are a special type of pointers where
    they are pointed out to a null value. Null pointers are used when they are not
    allowed to produce any return values.Here is an example:int *pointer = NULL;Now,
    whenever you call the pointer in a function you will get a null value as a result.How
    to use pointers in Functions?Pointers and functions can be used cumulatively to
    produce results. Pointers can use functions as return statements and values. Whereas,
    functions can also use points as their function parameters and arguments.Here
    is how you can use a pointer as a function argument:functionname(data_pointer)When
    the logical equivalence statements are written they take the data_pointer argument
    as a pointer.You can use this argument in the function body as:void main(){functionname
    int *data_point;}When the pointer is called it displays the storage location as
    the output result.Remember that by changing the function arguments using a pointer
    you can change the instances of the pointer but you cannot change the actual storage
    location of the variable that you are dealing with.Pointers along with functions
    can be used for faster results in software.Using this method, you can easily exchange
    values between two variables.Here is the program:main(){variable1 = data_pointervaraible2
    = *data_pointerresult = &variable2varaiabe2 = *varaible1}When the results are
    produced you will find out that the values of the variables have been exchanged.How
    to use pointers for arrays?Arrays can also use pointers to deal with complex multi-dimensional
    operations. They are used in both one-dimensional and two-dimensional arrays.Here
    is a program:main(){int variable[] = data_pointer&varaible[] = *data_pointer*data_pointer
    = int variable[]}In the above program, pointers are pointed out to arrays. They
    are very useful if you are dealing with a huge chunk of data.With this, we have
    completed a brief introduction to pointers.In the next chapter, we will with examples
    give a brief description of double pointers.Follow along to know more about it
    in detail.Chapter 15: Dual pointers![Robot, Intelligenza Artificiale, Donna, In
    Avanti](image_rsrc3ZC.jpg)In the previous chapter, we have discussed pointers
    in detail. We have given you various examples to help you understand the impact
    of pointers in C programming.This chapter introduces a double pointer ( also called
    as Pointer to Pointer) in short with few examples.Follow along to understand about
    double pointers.Let us go!What is a double pointer?As discussed in the previous
    chapter pointers usually point out to the variable location they are assigned
    to and they are represented by an asterisk (*). Double pointers are a little bit
    advanced way to store address values.When a double pointer is created it is designed
    in a way such that it can store the location value of the first pointer that is
    been assigned with storage value.The double-pointer is represented with a double
    asterisk (**). You can further continue this concept with three, four and an infinite
    pointer to pointer sequences.Declaring a double-pointerDeclaring double pointers
    are quite similar to the declaration of pointers.All you need to do is add an
    extra asterisk alongside it. This is similar if you are implementing it in arrays
    or in structures.Here is the format:string **ptr;// A double pointer is createdUnderstanding
    Double pointersIn this section, we will help you understand double pointers in-depth
    with the help of an example below.Here is the program code:#include {Enter the
    libraries here}// This is an example for double pointerint main(){string value
    = "Gold";// Now we will create a pointerint *create;// Now we will create a double-pointerint
    **double;// Now will display the storage valuecreate = &value;// Now will display
    the storage of pointerdouble = &create;// We will just print out the resultprintf("Value
    of the variable = %d\n", var );printf(" Let us display pointer entity = %f\n",
    *create );printf(" Let us display double pointer = %f\n", **double);}Output:Value
    of variable = GOLDPointer entity: 2s737Double pointer entity: 0x776When you look
    at the programming code, you will understand how double pointers are created.In
    the next chapter, we will learn about creating a C program using an IDE.Follow
    along!Chapter 16: Creating a C program![Informatica, Intelligenza Artificiale,
    Cervello](image_rsrc3ZD.jpg)In the previous chapters of this book, you have learned
    about various components that make up an effective program.This chapter is a brief
    one that explains you a step by step instruction to create a C program in an integrated
    development environment.This short chapter will let you understand the basic process
    of the C programming procedure.How to create a C program?Step 1:First of all,
    you need to download your favorable IDE from the official website. In this chapter,
    we will use the NetBeans IDE to run the C program that we are going to create.Step
    2:After installing the NetBeans IDE open it from the menu and create a new C file
    from the create menu in the bottom tray of the system. Make sure the extension
    of the file is .C. If not, the program will not get compiled by the IDEStep 3:Now,
    enter the given program in the IDE// Program to check whether a number is even
    or odd#include<stdio.h>// This is called a pre processing libraryvoid main(){int  sample
    = 6;if( sample /2 )printf(" This is an even number'');elseprint(" This is an odd
    number'');}Step 4:After entering the following C program in the IDE save it from
    the options on the menu. After saving it you are now already to compile it in
    the NetBeans IDE. Use the compile button from the menu. You can use F3 to compile.Step
    5:The compilation procedure will start and will show success if there are no errors.
    However, if there are any errors in the program they will be shown up in sequential
    order.Step 6:After compiling and if there are no errors you can click the Run
    (F5) button to display the output. You can also debug the code while it is running.This
    is the normal procedure to create, compile and run a C program in an IDE.In the
    next chapter, we will discuss dealing with errors in detail.Let us go!Chapter
    17: Common errors in C programming![Matrix, Rete, Scambio Di Dati, Networking,
    Virus](image_rsrc3ZE.jpg)In the previous chapters of this book, we have discussed
    various components and lexical syntax that can help us create an effective programming
    code.That particular effective program is then compiled to run in any operating
    system. However, the compiler will check the whole programming code and decide
    whether it is good by itself to run or not.If there are any errors related to
    syntax, function or run-time the program will terminate immediately and show the
    reasons for the error.As a programmer, it is an essential skill to have sufficient
    information about the types of errors you are going to deal with.If you can''t
    understand the complexity of error you have encountered then it is very difficult
    to create effective code. So, to make you aware of the essential information of
    the types of errors available in C language we provided this chapter.Learn carefully
    and try to use google if you ever face any error.Clearing errors is the best way
    to learn to program.Let us go!What is an error?Usually, programs expect a certain
    numerical, analytical or logical result to the program they have compiled. If
    you are unable to get the desired result for your program then it is called an
    error. Remember that a bug is not an error.A bug is a programmatical mistake that
    will let exploiters take advantage of it. Usually, bad programming principles
    cause an error.Errors are made by programmers because of a mistake in syntax or
    because of not following basic programming rules of that particular language.For
    example, you can''t use reserved keywords as a variable in C programming language,
    So, if you use ''for'' keyword in a variable then it will show you a syntax error.
    [ for is a reserved keyword]Errors in CC programming language is famously known
    for its unique way of representing error syntaxes in the output results. Unlike
    other high-level programming languages, C is said to be strict with case sensitive
    letters and whitespaces.It is naturally a difficult language to learn because
    it strictly follows all the guidelines.In this section, we will in detail explain
    the different errors that are available in C programming language.Follow along!a)
    Syntax errorThe syntax is like grammar to a programming language. Without exact
    precise statements, the compiler will not allow you to proceed further.In layman
    terms, syntax errors appear in C language when there is a mistake related to the
    syntax of the program. For example, wrong variable names and data types can cause
    syntax errors.Different programming languages use different syntax rules. So,
    if you are new to any programming language, we suggest you learn in-depth about
    different syntactical rules that the language uses. It is often easy to debug
    syntax errors because the compiler shows the exact code line for you.All you need
    to do is use the correct syntax in the place of incorrect syntax to make the program
    work.Here is an example:int a= 5.7493;Output:Syntax error. You can''t proceed
    furtherThe above example ended up with a syntax error because the variable is
    declared as an int data type value but is given a floating-point literal.b) Runtime
    errorsRuntime errors appear when a programmer does a mistake in the program operations
    that needs to be committed. In simple terms, runtime errors appear when the errors
    are related to the technical analysis of the program.For example, if you call
    a function that is not yet created it gives a run time error. Run time errors
    are a little bit difficult to clear off because of the ambiguity they possess.Some
    of the example of run time errors:1) Making bad and undefined calculations is
    a classic use case. For example, dividing a number by zero is a good way to understand
    it. When you divide any number by zero it is of undefined format. A computer doesn''t
    know how to represent or output the result that doesn''t exist. So, it displays
    runtime errors during the compilation process.2) A lot of file management operations
    often end up with run time errors. For example, opening a file that is not yet
    even created is not possible. So, an ambiguity is created and a run time error
    will be displayed.3) A lot of complex programs also face run time errors when
    all the memory is allocated to the program. For example, buffer overflows can
    cause a run time error.Here is an example:int a=3;a/0;Output:Runtime error --
    You cannot divide a variable with zeroc)Logical errorProgramming is a lexical
    language that uses different identifiers and literals to complete tasks with a
    computer. Programming logics are incomplete without logical statements and expressions.
    For example, OR AND NOT all are considered as logical operators that can be used
    to compare expressions and statements.Logical equivalence statements are also
    often prone to errors due to the ambiguity they create in the programming languages.Logical
    errors are often difficult to notice because they will not completely stop the
    compilation process but will give faulty results. They are like machine learning
    applications to say in layman terms.Here is an example:int a=+b;Here an unnecessary
    assignment operator is used resulting in faulty execution of the program.Warnings
    in C programmingWarnings are different from errors in the programming language.
    Warnings will not stop the execution of the program. They act as signals that
    inform you about the ineffectiveness of the program.Compilers suspect that the
    code you have written is not good in terms of execution. So, when you detect a
    warning while executing the written code, we suggest you make some changes and
    re-execute it.Here is an example:Warning -- This may need more resourcesWith this,
    we have completed a brief explanation about errors and warnings in the C programming
    language.As said before, even experienced programmers face errors while dealing
    with programming code. So, always make sure that you feel challenging whenever
    you see a programming error.Before ending this book, here are some tips to improve
    your C programming skills exponentially:1) Register yourself with GitHub and start
    reading various open-source code available. Good code can be written only when
    you are aware of the good code that has been written already.2) Start contributing
    to open-source projects. Always start with simple projects and extend your skills
    by involving complex projects with a lot of contributors.3) Don''t feel low when
    you face errors. Clear your doubts with the help of forums such as Stack Overflow.With
    this, we have completed a brief explanation about errors in this chapter and thus
    we are in the end parts of our book.We have discussed a good number of topics
    related to C programming in this book.All the best!ConclusionGlad that you have
    reached the end of this book. I hope you have enjoyed the content provided in
    the book as much we loved making this book.What to do next?As you have completed
    a complex and thorough book that deals with C programming it is now a huge test
    for you to apply your programming skills on real time projects. There are a lot
    of open-source projects that are waiting for a contribution. Remember that reading
    a lot of C language code will also help you understand the programming logics
    that C possesses.That''s it! Thanks for purchasing this book again and All the
    best!'
