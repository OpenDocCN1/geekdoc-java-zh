    \ and objects. In order to understand these, we must first discuss classes. This\
    \ will make some of the things that we said earlier – like object wrappers – make\
    \ more sense.\n\n### What is a class?\nThe utility of classes comes from the fact\
    \ that sometimes you need more complex structures than what the code automatically\
    \ gives.\n"
