    \ command line:\n```bash\nGCC sample.c\n```\nWhen this particular format is entered\
    \ in the command line the compilation process will initiate and will show the\
    \ results if there are no errors.\n\n## Process of compiling programs\nThe compilation\
    \ is a complex process and involves different stages.\n\n1. **Stage 1: Checking\
    \ semantic nature**: In the first stage, compilers check every component of the\
    \ program. It checks whether or not the component is following the syntax. If\
    \ everything is right the process will proceed to the next stage. However, if\
    \ errors are encountered due to syntactical structures such as wrong parenthesis\
    \ or missing braces the program will abort.\n2. **Stage 2: Assembly language**:\
    \ In this stage, all the processed code will be analyzed and converted into assembly\
    \ language to be understood by the machine.\n3. **Stage 3: Linking the object\
    \ code**: In the previous stage of the compilation process, we have generated\
    \ an object code that can be understood by any computer. In this stage, we need\
    \ to link the generated code. Linkage of programs is also known as building.\n\
    4. **Stage 4: Loading the program**: In the last stage, all we need to do is enter\
    \ the `.out` to run the program.\n\nWhat happens after the compilation?\nAfter\
    \ the compilation process is completed the output will be displayed. If there\
    \ are any instances where the input should be entered the program will stop and\
    \ wait for the input.\n\n# Chapter 5: Writing your first C program\n\n![Calcol,\
    \ Mano, Contare, Macchina](image_rsrc3Z3.jpg) Programming is learned in a better\
