    // Here, you should enter the main program\nint main() {\n    printf(\" Christmas\
    \ is coming soon\")\n    // You can enter the return keyword here if needed\n\
    \    return;\n}\n```\nNow, in this section, we will explain about the different\
    \ components that are mentioned in detail. Note: Remember that in C language there\
    \ is no difference between upper and lower-case letters. Also, whitespaces are\
    \ allowed and you can start the program from any position on the line. However\
    \ it is recommended to follow design guidelines to create a readable programming\
    \ code. Always follow the guidelines that are designated by the International\
    \ standards organization (`ISO`).\n\n1. `#include <stdio.h>`: This is an easy\
    \ way to import a library and use the functions that are present in it in the\
    \ program. It is mandatory to include `<stdio.h>` in every C program because it\
    \ imports the major input and output functions as `printf` and `scanf`. This is\
    \ the format you need to use whenever you import a library to be used on the program\
    \ code. For example, `#include <math.h>` imports all the system math functions\
    \ and `#include<time.h>` includes all the system time functions. These are also\
    \ called as preprocessors in the programming terminology.\n2. `int main(void)`:\
    \ Here, the `main` is the program execution point that is often considered as\
    \ initial point for compilers. When a C program is compiled, the compiler first\
    \ checks the code that is present between the braces of the `main` function. Here\
    \ `int` represents the return type it is accustomed to. Also, remember that `void`\
