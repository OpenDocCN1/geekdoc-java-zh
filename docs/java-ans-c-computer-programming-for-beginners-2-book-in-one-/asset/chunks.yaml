  trans: "\n你已经熟悉了前两个——`public` 和 `private`。当变量被声明为 `public` 时，它可以出现在你编写的程序的任何地方。相比之下，当它被声明为\
    \ `private` 时，它在实例化它的类体之外的任何地方都无法可见或访问。\n\n让我们来看另外两个访问控制修饰符。列表中的下一个是 `protected`\
    \ —— 这在你想创建库（libs）时非常有用。当一个变量是 `protected` 时，意味着它在实例化该 Java 构造的包内是的——注意，这也包含了所有的子类。另一方面，`default`\
    \ 访问控制修饰符在未指定其他三个修饰符时被使用。在这种模式下，变量可以在程序员实例化它的包或类中被访问。但是，请注意，该变量仅在类的主体内是可用的，而在它的子类中是不可用的。\n\
    \n注意，你也可以在方法内部创建对象，通常规则适用——对象或变量只能在创建它的方法体内被访问。关于你在方法内部创建的变量，还有另一个你应该记住的重要点——它只能指定一个关键字：`final`。你将被允许在方法体内部创建默认的、`protected`、`public`\
    \ 甚至 `private` 变量。这基本上就是信息在代码中隐藏的方式，如果你观察的话，这有助于数据抽象和封装。\n\n## 封装？信息隐藏？它们之间有什么区别？\n\
    \n\n\n乍一看，封装与数据或信息隐藏可能看起来一样，但这两个术语之间确实存在细微的。现在，Nat Pryce 和 Steve Freeman 对这两个术语做出了非常准确的区分，尽管你可能从其他作者那里看到他们交叉使用这些术语。我们在这里使用\
    \ Freeman 和 Pryce 的描述来区分 Java 编程中这两个概念的区别。\n\n让我们从信息隐藏开始，因为这是我们上次停下的地方。你已经可以判断出“信息隐藏”意味着什么了。它仅仅意味着信息被隐藏了。程序执行的实际函数和过程被隐藏了。但是，为了什么目的？为什么要将内部运行机制对程序员隐藏？忽略低层细节是为了让你（作为程序员）能够专注于更重要的事情。这也是为什么在\
    \ Java 中要抽象数据。你可以创建类、对象以及程序的其他元素；你甚至可以将对象从一个程序导入到另一个程序，而无需担心该对象如何实现其功能的细节。\n\n\
    这就像开车。你只需要知道，当你把钥匙插入锁孔并启动汽车时，它就会启动。你不需要担心是什么让它启动的、下面的线路是如何连接的、汽油去哪里、引擎如何燃烧汽油等。你只需要担心启动汽车并安全驾驶。\n\
    \n另一方面，封装允许用户控制对象对类其他部分影响的变化量。“封装”一词意味着将所有内容封闭在一个单一的单元中。这意味着根据 Java 编程系统的设计方式，一个独立单元到另一个单元之间不会有预期的依赖。记住，Java\
    \ 编程环境中的对象应该是独立的，并且没有全局变量可以引用。\n\n## 抽象\n\n抽象简单指的是隐藏对象不必要的细节并只显示相关的细节。另一方面，封装简单意味着将对象的状态和方法绑定在一起。这种绑定最终创建了所谓的“类”（我们稍后会介绍）。最后，消息传递指的是对象与其他对象进行交互的能力。\n\
    \n另一方面，高级编程语言具有更高层次的抽象，这意味着代码在计算机能够使用它之前，会通过一个名为编译器的程序（编译器充当计算机的翻译员）。这种抽象水平通常到了编程语言已经具有类似于英语（一种全球语言）的语法的程度。编译器充当高级语言与机器之间的翻译员。这允许程序员以更自然的方式编写程序，因为它允许编码者使用更“自然”的语言，而高级语言允许某些功能实现自动化，使编码者的生活变得简单得多。然而，这里的权衡是代码必须经过编译器，这会导致程序运行和执行时间更长，而且与低级语言相比，计算机通常会消耗更多内存。这些高级语言中，包含了广为人知的语言，如\
    \ Python、C++ 以及我们今天的话题 Java。\n\n## 第 16 章：Java 面试题\n\n### Java 编程语言\n* 什么是 `WORA`\
    \ 原则？它有什么好处？\n* Java 应用程序如何在多个平台上运行？\n* `JRE` 和 `JDK` 之间的区别是什么？\n* 过程化编程和面向对象编程的区别是什么？\n\
    \n### 面向对象编程（第一部分）\n* `class`（类）和 `object`（对象）之间的区别是什么？\n* `object` 第一次实例化时发生了什么？\n\
    * 基本类型和 `object` 之间的区别是什么？\n* 自动装箱（autoboxing）和拆箱（unboxing）之间的区别是什么？\n* 什么是数组？\n\
    * `String` 与普通对象有什么不同？\n* `StringBuilder` 和 `StringBuffer` 之间的区别是什么？\n* 为什么枚举（enums）优于\
    \ `String` 或 `Integer` 常量？\n* 按包划分（package-by-package）和按类划分（class-by-class）的区别是什么？（注：原文为\
    \ package-by-class，推测为包与类的对比）\n\n### 面向对象编程（第二部分）\n（注：此处标题原文为 Object-Oriented\
    \ Programming (Part II)）\n* 方法声明和方法签名的区别是什么？\n* 什么是递归方法？\n* `final` 关键字的作用是什么？\n\
    * `static` 关键字的作用是什么？\n* `static` 方法无法访问非静态字段？\n* 访问修饰符的作用是什么？\n* 不同的类型？\n\n###\
    \ 超类（Superclass）\n* 浅拷贝和深拷贝的区别是什么？\n* 拷贝构造函数是什么？\n* 恒标识运算符和 `equals()` 方法的区别是什么？\n\
    * `hashCode()` 方法和 `equals()` 方法的关系是什么？\n* `finalize()` 方法为什么不可靠？\n\n### 组合与继承（Composition\
    \ & Inheritance）\n* 组合和继承的区别是什么？\n* 方法重写（overriding）和方法重载（overloading）的区别是什么？\n\
    * 如何决定使用组合还是继承？\n\n### 抽象类与接口（Abstract Classes & Interfaces）\n* `abstract class`（抽象类）和\
    \ `interface`（接口）的区别是什么？\n* 如何决定使用 `abstract class` 或 `interface`？\n* 为什么类不能既是\
    \ `final` 又是 `abstract` 的？\n* 泛型接口的作用是什么？\n* 什么是匿名类？\n* 什么是 lambda 表达式？\n\n###\
    \ 异常（Exceptions）\n* 什么是异常？\n* 检查异常（unchecked exception）和受检查异常（checked exception）的区别是什么？\n\
    * 如何决定使用非检查异常或检查异常？\n* `try/catch/finally` 块是如何工作的？\n* `try-with-resources` 语句是如何工作的？\n\
    \n### 泛型（Generics）\n* 编译错误和运行时错误的区别是什么？\n* 泛型的目的是什么？\n* 泛型通配符（wildcards）的不同类型有哪些？\n\
    * 类型擦除（type erasure）是什么？\n* 泛型的局限性有哪些？\n\n### 并发（Concurrency）\n* `Thread`（线程）的生命周期是什么？\n\
    * 资源同步（synchronization）为什么是必要的？\n* `synchronized` 静态和非静态方法的区别是什么？\n* 如果两个不同的线程同时访问同一个对象的\
    \ `synchronized non-static` 方法会发生什么？\n* 如果两个不同的线程同时访问同一个对象的 `synchronized static`\
    \ 方法和静态方法会发生什么？\n* `volatile` 关键字对变量保证了什么？\n* `synchronized` 块保证了什么？\n* 内置的并发数据结构有哪些？\n\
    * `executor`（执行器）框架是什么？\n* `ThreadLocal` 变量是什么？\n* 原子变量（atomic variables）是什么？\n\
    \n### 内存管理（Memory Management）\n* JVM 如何划分堆（`heap`）？\n* 什么是内存泄漏？如何识别它们？\n* 引用的四种不同类型有哪些？\n\
    * `ReferenceQueue` 是什么？\n* 为什么虚引用比 `finalize()` 方法更安全？\n\n### Java 数据库连接（Java\
    \ Database Connectivity）\n* 什么是 `JDBC`？\n* 获取 `Connection` 对象的两种方式是什么？\n* `Statements`（语句）的三种类型是什么？\n\
    * 什么是 `ResultSet`？\n* 什么是 SQL 注入攻击？如何防止它？\n* 对象关系映射（object-relational mapping）的优缺点是什么？\n\
    * `Hibernate` 是什么？\n\n### Web 应用（Web Applications）\n* 什么是 servlet 容器（servlet container）？\n\
    * 什么是 Web 应用？\n* 什么是 WAR 文件？\n* `web.xml` 文件是什么？\n* `Servlet` 和 `HttpServlet`\
    \ 的区别是什么？\n* `Servlet` 和 `JSP` 的区别是什么？\n* 什么是 servlet 过滤器（filter）？\n* 什么是模型-视图-控制器模式（model-view-controller-pattern）？\n\
    \n### Web 服务\n* 什么是面向服务的架构？\n* 什么是 Web 服务？\n* `SOAP` Web 服务和 `REST` Web 服务的区别是什么？\n\
    * `JAX-WS` 和 `JAX-RS` 的区别是什么？\n* 哪些有助于开发 Java 服务的框架？\n\n### 算法（Algorithms）\n*\
    \ 什么是大 O 表示法？常见的例子有哪些？\n* 什么是二分查找？它的性能如何？\n* 什么是插入排序？它的性能如何？\n* 什么是合并排序？它的性能如何？\n\
    * 什么是快速排序？它的性能如何？\n* 什么是时间排序（timsort）？它的性能如何？\n\n### Java 集合框架（Java Collections\
    \ Framework）\n* `ArrayList` 和 `LinkedList` 的区别是什么？\n* `HashMap` 是如何工作的？\n* 如果键的\
    \ `hashCode()` 或 `equals()` 方法错误会发生什么？\n* 栈（stack）和队列（queue）的区别是什么？\n* 二叉搜索树、红黑树和堆（`heap`）的区别是什么？\n\
    * `HashSet`、`LinkedHashSet` 和 `TreeSet` 的区别是什么？\n* 快速失败迭代器（fail-fast iterator）和安全失败迭代器（fail-safe\
    \ iterator）的区别是什么？\n\n### 流（Streams）\n* 什么是 `Stream API`？它为什么很有用？\n* 中间操作和终端操作的区别是什么？\n\
    * 为什么中间操作的顺序很重要？\n* 并行流（parallel streams）和顺序流（sequential streams）的区别是什么？\n\n###\
    \ Java 时间（Java Time）\n* 什么是 Java 时间尺度（Java Time-Scale）？\n* `LocalDateTime` 和 `ZonedDateTime`\
    \ 的区别是什么？\n* `Instant`、`OffsetDateTime` 和 `ZonedDateTime` 的区别是什么？\n* `Period`\
    \ 和 `Duration` 的区别是什么？\n\n### 重要接口（Important Interfaces）\n* `Autocloseable` 接口是什么？\n\
    * `Comparable` 接口是什么？\n* `Comparator` 接口是什么？\n* `Iterable` 接口是什么？\n* `Runnable`\
    \ 接口是什么？\n* `Callable` 接口是什么？\n* `Serializable` 接口是什么？\n* 什么是函数式接口（functional\
    \ interface）？常见的函数式接口有哪些？\n\n### 创建型模式（Creational Design Patterns）\n* 模式（builder\
    \ pattern）是什么？它有什么用？\n* 工厂模式（factory pattern）是什么？它有什么用？\n* 抽象工厂模式（abstract factory\
    \ pattern）是什么？它有什么用？\n* 原型模式（prototype pattern）是什么？它有什么用？\n* 单例模式（singleton pattern）是什么？它有什么用？\n\
    \n### 结构型模式（Structural Design Patterns）\n* 适配器模式（adapter pattern）是什么？它有什么用？\n\
    * 组合模式（composite pattern）是什么？它有什么用？\n* 装饰器模式（decorator pattern）是什么？它有什么用？\n* 外面模式（facade\
    \ pattern）是什么？它有什么用？\n* 权重模式（flyweight pattern）是什么？它有什么用？\n\n### 行为型模式（Behavioral\
    \ Design Patterns）\n* 命令模式（command pattern）是什么？它有什么用？\n* 观察者模式（observer pattern）是什么？它有什么用？\n\
    * 策略模式（strategy pattern）是什么？它有什么用？\n* 访问者模式（visitor pattern）是什么？它有什么用？\n* 空空对象模式（null\
    \ object pattern）是什么？它有什么用？\n\n### 反射（Reflection）\n* 什么是反射？\n* 什么是内省（introspection）？\n\
    * `Class` 对象是什么？\n* `Field`（字段）对象是什么？\n* `Method`（方法）对象是什么？\n\n### 依赖注入（Dependency\
    \ Injection）\n* 控制反转（inversion of control pattern）模式是什么？\n* 服务定位器（service locator）和注入（injection）的区别是什么？\n\
    * 构造器注入（constructor injection）和 setter 注入（setter injection）的区别是什么？\n* `Spring`\
    \ 容器的作用是什么？\n\n### 切面面向编程（Aspect-Oriented Programming）\n* 核心关注点（core concern）和交叉关注点（cross-cutting\
    \ concern）的区别是什么？\n* 什么是面向切面的编程？\n* 接口代理（interface proxy）和二进制织入（binary weaving）的区别是什么？\n\
    * `AspectJ` 库是什么？\n\n### 单元测试（Unit Testing）\n* 测试驱动开发（test-driven development）是什么？它有什么好处？\n\
    * 什么是单元测试（unit test）？\n* 固件（fixtures）是什么？\n* 模拟对象（mock objects）是什么？\n\n### 编程问题（Programming\
    \ Problems）\n* 你如何写一个计算阶乘（factorial）的方法？\n* 你如何判断一个字符串（string）是否是回文（palindrome）？\n\
    * 给定一行代码，你如何验证括号是否平衡？\n* 给定一个从 100 中缺失的无序列表，你如何确定它？\n\n### 个人问题（Personal Questions）\n\
    * 你能介绍一下你自己和你的经验吗？\n* 你能介绍一下你参与过的副作用项目吗？\n* 你能介绍一次你解决特别挑战性问题的经历吗？\n* 你能介绍一次你与同事解决分歧的经历吗？\n\
    * 你的开发环境是怎样的？\n* 你为什么对我们公司感兴趣？\n* 你为什么要离开上一份工作？\n* 你最大的弱点是什么？\n* 你最大的优势是什么？\n\n\
    ## 第 17 章：Java 语言与术语\n\n### 绝对文件名（Absolute filename）\n绝对文件名是带有从文件系统根提供的完整路径的文件，例如\
    \ `c:\\Java\\bin\\javac.exe`。\n\n### 抽象（Abstraction）\n抽象是对复杂情况的简单表示。从基本角度说，抽象隐藏了代码或程序的运行方式，只显示其功能。面向对象的设计通常围绕在建模现实对象时寻找合适的抽象级别。抽象过高会导致捕捉的信息不足；抽象过低则会导致程序创建变得复杂且难以理解其应当的状态。\n\
    \n### 抽象方法（Abstract method）\n抽象方法是头部包含保留关键字 `abstract` 的方法。抽象方法没有方法体。在接口（interface）内部设计的任何方法都被认为是抽象的，无例外。抽象方法的体定义在抽象类（abstract\
    \ class）子类中，或者如果一个类实现了该接口，则定义在该类中。\n\n### 抽象窗口工具包（Abstract Windowing Toolkit）\n\
    AWT 或 Abstract Windowing Toolkit 包含一组类，旨在让带有 GUI（图形用户界面）的应用程序更加简单。你将在 `java.awt`\
    \ 包组找到它们，包含的类有按钮、窗口、框架、文本区域等。\n\n### 访问方法（Accessor method）\n访问方法是专门设计用于访问类私有属性的方法。根据\
    \ Java 习惯，访问方法以 `get` 前缀，然后是属性名。例如，为了访问名为 `speed` 的属性，访问方法将是 `getSpeed()`。当属性被设置为\
    \ `private` 时，它在不使用修改器方法（mutator method）的情况下阻止外部类修改该值。我们可以使用访问方法对私有属性值提供特定访问，并阻止其他类的其他对象访问该私有属性——访问方法需要正确的可见性来实现这一点。\n\
    \n### 参与者（Actor）\n见客户端（client）。\n\n### 实参（Actual argument）\n这是从方法外部传递到方法内部参数的值。当方法被调用时，值（实参）将复制到对应的形式参数（formal\
    \ arguments）中。\n\n### 实参数（Actual parameter）\n见实参（actual argument）。\n\n### 地址空间（Address\
    \ space）\n这是程序运行的内存区域。\n\n### 代理（Agent）\n见服务器（server）。\n\n### 聚合（Aggregation）\n\
    这是一种 OOP 概念，其中一个对象由至少一个从属对象构成状态。这些从属对象在对象之外独立存在。当对象不再被使用而销毁时，从属对象也随之消失。聚合也被称为“拥有”（HAS-A）关系，这区别于继承的“是”（IS-A）关系。\n\
    \n### 别名（Aliases）\n别名是对一个对象的多个引用。任何对状态的变化都会被别名捕捉。\n\n### 匿名数组（Anonymous array）\n\
    匿名数组是一个没有标识符的数组，例如：\n```java\ny = new int[]{10, 8, 9, 5, 3, 2, 0};\n```\n数组初始化器用于初始化数组。\n\
    \n### 匿名类（Anonymous class）\n匿名类是一个没有类名的类，通常是作为方法的实现。例如：\n```java\nButton.addActionListener(new\
    \ ActionListener(){\n    public void actionPerformed(ActionEvent e){\n       \
    \ System.exit(0);\n    }\n});\n```\n\n"
- fmt: "\n# Chapter 1: What is the C language?\n\n![Tecnologia, Intelligenza Artificiale,\
    \ Cervello, Pensare](image_rsrc3YZ.jpg) \n\nThis book is a comprehensive introduction\
    \ to C language with in-depth examples. It is often misunderstood that C has lost\
    \ its popularity due to the entrance of modern programming languages such as `Java`\
    \ and `Python`. However, a lot of beginners don't understand that C is still extensively\
    \ used to develop compilers and operating systems. A lot of advanced programming\
    \ concepts used in C language are still considered a pathway to understanding\
    \ programming in a better way. This chapter introduces various important characteristics\
    \ of C language in detail. We recommend you to use an operating system of your\
    \ choice to experiment with the programs introduced in this book. Let us go!\n\
    \n## History of C\nIt is mandatory to discuss the history of a programming language\
    \ before starting to discuss its specific components, principles, and philosophy.\
    \ In the 1970s when the programming industry was very small and when there were\
    \ very few effective programming languages, C was invented in the Bell labs by\
    \ Denis Ritchie. He developed C language to use it for the development of the\
