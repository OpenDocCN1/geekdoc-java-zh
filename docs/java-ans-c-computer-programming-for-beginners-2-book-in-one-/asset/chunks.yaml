    \ flow is to use a `switch` statement. This provides you with the option of testing\
    \ for a range of values for the variables and can be used in place of complicated,\
    \ long `IF … ELSE` statements. Start with the word `switch` and then a set of\
    \ parentheses. The variable you are checking is placed between the switch parentheses\
    \ and is followed by a set of curly brackets. The rest of the `switch` statement\
    \ goes in between the curly brackets.\n\n## Chapter 14: Java GUI Programming\n\
