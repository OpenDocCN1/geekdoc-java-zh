    \ 6: Functions\n\n![Matematica, Calcolo, Pagare, Bruchrechnung, Aritmetica](image_rsrc3Z4.jpg)\
    \ Usually, in the programming languages, variables are used to store values. They\
    \ are designated with the help of data types and can be used across functions,\
    \ structures, and every other programming component.\n\n## What is a function?\n\
    Functions are generally used in the mathematical operations to repeat a calculation\
    \ or set of expressions. Computer programming languages adopted these functional\
    \ concepts to create and maintain certain instructions. A lot of programming languages\
    \ provide libraries that can be imported when they want to be used. For example,\
    \ in C programming language to use `printf` and `scanf` notations you need to\
    \ import `stdio.h`.\n\n## Why functions are used?\nImagine programming with a\
    \ lot of static code that does the same task. It is not feasible and consumes\
    \ a lot of time for the programmers. With the help of functions, we can divide\
    \ the code into many modules and can easily check them with any available debugger.\
    \ Functions are also to organize and maintain.\n\n## Advantages of functions\n\
    1. **Easy**: It is easy to maintain and debug the code.\n2. **Pathway to modules**:\
    \ Modules are an important component.\n3. **Save time**: Functions save a lot\
    \ of time.\n\n## How to define a function?\nFirst of all, remember that functions\
    \ have a unique name and reserved keywords cannot be used as function names. Here\
    \ is the format:\n```c\ndatatype name(Enter parameters here) {\n    // Enter logic\
    \ here\n}\n```\nHere, a datatype is the return value of the function.\n\n## What\
    \ is a parameter in the function?\nTo say in layman terms parameters are similar\
    \ to variables but for functions. Each of the parameters is individually declared\
    \ with a data type. Only variables declared in the parameters can be used in the\
    \ body.\n\n## How to call a function?\nA function is useless if it cannot be used.\
    \ Programming does not allow usage of functions just by their names. Here is the\
    \ format:\n```c\ndatatype function(Enter parameters here)\nsample = function(Enter\
    \ parameters here)\n```\n\n## What are the function arguments?\nArguments are\
    \ the values that functions take in the parameter part of the function.\n\n##\
    \ Functions with arguments\nIf a function has arguments there is no need to declare\
    \ variables again in the function body. When function arguments are declared you\
    \ need to call the functions with arguments. Here is an example:\n```c\nfunction\
    \ (int x, int y)\n```\n\n## Functions without arguments\nIf functions are not\
    \ declared or enclosed with arguments, they need to be called using a value or\
    \ reference.\n\n## Call by Value\nWhen call by value argument instance is used\
    \ you cannot change the parameter value again.\n```c\n#include<stdio.h>\nvoid\
    \ sample (float first, float second){\n    double result;\n    result=first;\n\
    \    first=second;\n    second=first;\n}\nmain (){\n    float first=100, second=200;\n\
    \    sample (first, second); // passing value to function\n}\n```\n\n## Call by\
    \ reference\nUsually, when a variable or literal is declared they are stored in\
    \ a memory location.\n```c\n#include<stdio.h>\nvoid sample (float first, float\
    \ second){\n    double result;\n    result=first;\n    first=second;\n    second=first;\n\
    }\nmain (){\n    result (&first, &second); // passing value\n}\n}\n\n## Recursive\
    \ functions\nRecursion is a function that repeats by itself.\n```c\n#include <stdio.h>\n\
    long int factorial(int variable) {\n    if (variable == 0 )\n        factorial\
    \ = 0\n    else\n        factorial = variable * (variable-1)\n    return factorial;\n\
    }\n```\n\n# Chapter 7: Operations\n\n![Imparare, Matematica, Bambino, Ragazza,\
    \ Formula, Fisica](image_rsrc3Z5.jpg)\n\n## Mathematical operations\nWe use operators\
    \ in C.\n\na) **Addition**: The addition is usually done with the help of the\
    \ `'+'` operator.\n```c\n#include <stdio.h>\nmain(){\n    int variable1 = 32;\n\
    \    int variable2 = 12;\n    int variable3 = variable1 + variable2;\n    // This\
