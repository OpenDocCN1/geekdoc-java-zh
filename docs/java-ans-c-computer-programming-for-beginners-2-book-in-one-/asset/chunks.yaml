    ## How to build a small game with Java\nProcedural programming is usually much\
    \ quicker and more straightforward in simpler algorithms and programs; rather\
    \ than having to construct and define a `class`, and create an `object` based\
    \ on that `class`, all the programmer really has to do is to simply declare the\
    \ necessary variables and write the `functions`, and create the algorithm in order\
    \ to solve the problem that they need the code to address.\n\nHowever, when it\
    \ comes to more complex programs, needing more complex solutions, this is where\
    \ object – oriented programming begins to shine, and this is where it starts to\
    \ show its strength. In a lot of programs, there will be times that there will\
    \ be a number of “objects” or data clusters that have to be grouped together,\
    \ and that the programmer will be treating in a certain way. This is what “classes”\
    \ are meant to address. Instead of declaring a new set of variables per data cluster,\
    \ they can simply draw on a pre – made “class” and create a new “object”. Let’s\
    \ see how this would work in practice.\n\nEach piece also has different methods\
    \ of moving, depending on what piece they are. If a programmer were to code a\
    \ chess game in procedural fashion, then they would have to manually describe\
    \ each and every piece, all sixteen pawns, four bishops and four knights, four\
    \ rooks, two queens, and two kings. In addition, they will have to write the `functions`\
    \ that allow each piece to move in its own separate way.\n\nHowever, if the programmer\
    \ makes use of object - oriented programming, instead of having to code sixteen\
    \ pawns, four bishops, four knights, four rooks, two queens, two kings, they simply\
    \ have to code six `classes`: one class to describe each piece on the board. The\
    \ programmer can now simply include the movement functions within each class,\
    \ and have the attributes describe their position: whether they’re white king’s\
    \ pawn, or black queen’s pawn, these are all things that can be inserted through\
    \ the “attributes” portion of the “pawn” class. Instead of thirty – two clusters\
    \ of code, the programmer only has to do six. Now it’s much easier, much shorter,\
