    \n# 第二章：为什么 C 语言很重要？\n\n![Codice Binario, Digitale, Sistema Binario, Binario](img/image_rsrc3Z.jpg)\
    \ 前一章介绍了 C 语言的重要性。本章进一步扩展了上一章介绍的概念。\n\n### 为什么 C 语言很重要？\n现在有很多编程语言，所有它们都有其用途。本节解释了一些证明\
    \ C 语言比其他高级语言更好的论据。我们并不否认事实，C 语言对于某些应用程序是最好的。\n\n1. **它们很快的**：C 语言的一个重要优势是它可以直接处理硬件。相对于高级语言，这种优势使得\
    \ C 成为一种快速处理的语言。在编译程序之前，编译器需要理解硬件架构。这就是为什么 C 编程语言非常适合开发编译器及其附加应用程序的原因。\n2. **它是可移植的**：可移植性是\
    \ C 早期成功的原因之一。过去，汇编语言使得可移植性变得困难，并强制程序员创建多个版本的代码部署在不同设备上。然而，C 开始提供高级定制，可以帮助我们在任何平台上运行程序。\n\
    3. **模块化**：C 语言允许你以模块化的形式存储代码片段。这些是模块化的且可扩展的。\n4. **静态类型语言**：在编程领域，静态和动态类型语言之间有很多论据是有效的。在编译期间，静态类型语言显示错误的速度更快。C\
    \ 是一种静态类型语言，由于这一特性，它的运行速度更快。我们并不否认事实，动态类型语言提供了更好的安全性特性。\n5. **学习资源**：C 语言拥有许多优势，可以帮助你深入理解编程。许多现代编程语言是动态的，不会为你提供学习和适应编程哲学的方法，而这为技术革命铺了道路。然而，另一方面提供了大量信息，可以帮助你理解计算机的运行过程。这就是为什么\
    \ C 被广泛作为顶级大学各种课程的主要语言的唯一原因。\n6. **理解其他语言的重要性**：C 是理解 `Python`、`C++` 和 `C#` 等不同编程语言的学习途径。许多编译器、解释器和\
    \ IDE 都是使用 C 开发的。学习 C 可以帮助你理解高级语言的语法结构。\n\n## C 语言的应用\n如前所述，C 是一门系统级语言，可以广泛用于开发系统级应用程序。以下是其中一些：\n\
    \n1. **开发编译器**：许多编译器技术都是基于 C 构建的。编译器是运行软件或应用程序必不可少的组件。此外，在编译程序之前，需要理解硬件架构。这就是为什么\
    \ C 编程语言非常适合开发编译器及其附加应用程序的原因。它也可以用于开发解释器和汇器。\n2. **创建操作系统**：操作系统是作为用户和计算机之间媒介的简单界面。许多操作系统由于其可扩展性和快速处理的特性使用\
    \ C 作为主要语言。`Linux` 一个著名的开源操作系统使用 C 开发了其最重要的组件 `kernel`。\n3. **基于系统的应用程序**：许多与硬件资源相关的设备/应用程序使用\
    \ C 开发应用程序。例如，特斯拉汽车使用 C 语言在组件之间进行通信。机器人作为未来技术，也关注复杂的 C 编程概念。\n\n### 它具有哪些缺点？\n\
    像其他编程语言一样，C 在某些情况下也不完美。本节是为了让你理解 C 无法为程序员提供什么。\n\n1. **它不支持面向对象范式**：所有程序员都知道面向对象编程范式是最重要且使用广泛的编程范式之一。然而，C\
    \ 不支持 OOP，仅通过函数专注于过程化编程。许多机构和服务使用包包结构在员工之间分发文件。因此，由于 C 编程语言的过程化本质，它通常不被视为需要大量贡献的项目的主要开发语言。\n\
    2. **不是所有事情都能用 C 完成**：C 不是一种多用途语言。与高级语言不同，它无法用于 Web 和移动应用程序开发。\n\n# 第三章：什么是程序？\n\
    \n![Tecnologia, Informatica, Computer](img/image_rsrc3Z1.jpg) 从 1950 年开始，计算机逐渐占据主导地位并导致了技术革命。在初始阶段，进行数值计算被认为极其困难。磁卡被用作输入输出设备，它们几乎占据了整个房间。然而，随着时间的推移，计算机科学家解决了这个问题。现在，我们可以找到具有\
    \ GB 内存的计算机。计算机的成功主要源于用于制作软件的程序。开发编程语言是为了创建有意义的程序。在本章中我们将详细讨论程序的重要性以及它们如何工作。\n\
    \n## 什么是编程？\n计算机与人类有很多不同。它们不是神经活跃的，不包含任何情感。计算机主要依靠指令。计算机比人类更好的原因之一是它们可以有效地执行任务，而不浪费任何时间。如果没有预先提供解决方案，它们就无法解决问题。在经过\
    \ 20 年的巨大研究后，机器人学并不是成功的领域，因为很难制造这类机器。在计算机开发的早期阶段，人们使用指令集来完成任务。汇编语言被允许用于科学和军事目的。许多跨国公司开始实验用一种向计算机传递指令的方法。在经过多年的伟大研究后，计算机科学家将编程的概念引入了技术世界。编程语言提供了一组可以帮助你创建程序的库。程序被视为算法的分析表示。\n\
    \n## 什么是程序？\n编程语言使用程序给机器提供各种指令。从数学角度来看，逐步提供指令被称为算法。许多统计学概念也使用算法来解决问题。算法不仅是逐步执行的程序，而且被证明是有效的。在编程中，我们使用程序来尽可能快速地解决特定问题。丰富的程序员尝试创建代码较短且消耗资源更少的程序。程序是机器可以理解的程序。\n\
    \n## 算法与程序的区别是什么？\n算法和程序是紧密相连的。当程序员试图解决问题时，首先寻找一种逻辑方法来完成它。它监控输入和输出并创建逐步执行的程序。这在理论基础上上被称为算法。然而，计算机无法理解人类语言。它们使用二进制系统来理解指令。C\
    \ 语言是我们需要以计算机可以理解的方式来表示算法。这个过程在技术上被称为编程。\n\n## 什么是编程语言？\n当编程的概念引入时，科学和计算社区非常活跃。他们开始开发许多指令集并使用它们开发程序。然而，在几个项目之后，程序员和计算意识到需要特定的平台来创建程序。像\
    \ `ABC`、`Pascal` 等编程语言被开发出来。\n\n## 如何编写？\n程序通常在操作系统中编写。例如，`Windows`。你可以使用 `vim`\
    \ 编辑器创建代码并保存到终端。使用与 `Mac` 相同的步骤。\n\n# 第四章：什么是编程过程？\n\n![Portatile, Mano, Scrivere,\
    \ Binario](img/image_rsrc3Z2.jpg) 为了深入理解 C 编程，学习默认编程过程很重要。与其他技术进步一样，编程语言也遵循严格的系统来让事情运行。在上章中，我们讨论了程序的基本结构。在本章中，我们将帮助理解编程语言的基本过程。\n\
    \n## 编程过程\n在尝试了解完整的编程过程之前，了解汇编语言是关重要的。在编程语言发明之前，汇编语言被广泛使用。汇编语言让程序员在更高水平上处理计算机。在汇编语言之前，计算机程序员使用二进制序列来完成非常简单的任务。即使是简单的乘法，第一代计算机也需要几分钟。很枯燥吧？然而，随着汇编语言的进入，情况变得更好。汇编语言使用特定的定义位置或名称来执行操作。因此，为了创建应用程序，程序员创建汇编器可以理解的汇编代码。最终，汇编语言的使用对程序员来说变得麻烦。汇编语言的失败主要是因为其缺乏可移植性。汇编程序代码只能在支持该指令集的机器上运行。在\
    \ FORTRAN 开发之后，程序员理解编程语言拥有的强大能力。编程语言是取决于机器的，可以在任何系统运行。\n\n## 什么是编译器？\n编译器是一个计算组件，它对你编写程序代码进行词法分析并提供结果。编译器对于运行创建的程序是本质的。编译器还将帮助你理解所犯的语法错误。\n\
    \n需要记住哪些重点？\n1. 始终记住文件名是必要的，有助于你的编译器判断处理的是否的文件。`C++` 编译器无法理解 C 编程代码，反之亦然。编译器是复杂的软件程序，只对它们旨在工作的语言有效。例如，你无法使用\
    \ `Eclipse` 创建 iOS 应用，因为 `Eclipse` 无法编译 iOS 应用。对于 C 程序，记住文件应该是 `.C` 文件格式。你可以使用文本编辑器\
    \ `vi` 编辑器或 `sublime` 编辑器创建程序文件。\n2. 编译过程使用一组指令启动或启用。命令行工具使用特定的语法命令启动编译过程，而集成开发环境如\
    \ `NetBeans` 使用图形用户界面启动编译过程。以下是命令行的格式：\n```bash\nGCC sample.c\n```\n当在命令行输入这种特定格式时，编译过程将启动并在无错误的情况下显示结果。\n\
    \n## 程序的编译过程\n编译是一个复杂的过程，涉及不同的阶段。\n\n1. **第一阶段：检查**：在第一阶段，编译器检查程序的每个组件。如果符合语法，过程将进入下一阶段。然而，如果遇到由于括号错误等语法错误，程序将终止。\n\
    2. **第二阶段：汇编**：在这个阶段，所有处理的代码将被分析并转换为机器可以理解的汇编语言。\n3. **第三阶段：链接**：在之前的编译过程中，我们生成了计算机可以理解的对象代码。程序的链接被称为构建。\n\
    4. **第四阶段：加载**：在最后一个阶段，我们需要做的是进入 `.out` 来运行程序。\n\n编译后发生了什么？\n编译完成后，输出将显示。如果有任何实例，程序将停止等待输入。\n\
    \n# 第五章：编写你的第一个程序\n\n![Calcol, Mano, Contare, Macchina](img/image_rsrc33.jpg)\
    \ 结合示例学习编程是更好的方法。本章是对 C 的全面介绍，我们提供了 C 示例并探索程序的组成。\n\n## 第一个 C 程序\n```c\n#include<stdio.h>\n\
    // 这里，你应该进入主程序\nint main() {\n    printf(\" Christmas is soon\")\n    // 如果需要，在这里输入\
    \ return 关键字\n    return;\n}\n```\n现在，在本节中，我们将详细解释上述的各个组件。注意：在 C 语言中没有大小写之分。此外，允许使用空格，你可以从行的任何位置开始程序。始终遵循国际标准组织\
    \ (`ISO`) 指定的指南。\n\n1. `#include <stdio.h>`：这是导入库并使用程序中的函数的简单方法。在每个 C 程序中必须包含\
    \ `<stdio.h>`，因为它是为了输入输出函数如 `printf` 和 `scanf`。每当使用库时都需要它。例如，`#include <math.h>`\
    \ 包含了所有数学函数，`#include<time.h>` 包含了所有时间函数。\n2. `int main(void)`：这里 `main` 是执行点，在编译\
    \ C 程序时通常被视为起点。这里 `int` 代表返回类型。此外，记住 `void` 表示 `main` 函数没有参数。遵循指令不要弄乱 `main` 函数中的逻辑代码很重要。\n\
    3. `printf(\" Christmas is soon\")`：这里 `printf` 是系统输出函数，可以在屏幕上打印引号之间的值。你也可以使用\
    \ `scanf` 扫描值。这些是 C 语言中的输入输出语句。程序编译时，“Christmas is soon\" 将在屏幕上显示。\n4. `return\
    \ value`：这是一个描述 `main` 函数产生的返回值的语句。通常是 `void` 或者有时是 `null` 格式。`Return` 是 C 语言提供的重要功能，可以帮助我们有效地维护资源。\n\
    \n## 编译和运行程序\n在本节中，我们将讨论任何 C 语言文件的编译命令。我们还会提供指令帮助你在没有运行时错误的情况下运行程序。\n\n### 编译程序\n\
    记住文件名并在命令行中使用以下格式。始终确保你在终端中与文件位于同一目录。\n```bash\n$ GCC {Name of the program file}\n\
    ```\n当在终端输入这种格式时，需要一些时间来编译。如果没有错误，则认为程序编译成功。然而，如果发生错误，程序将不会继续。\n\n### 运行程序\n编译程序后，现在是使用命令行指令运行程序了。高级编程环境如\
    \ `NetBeans` 在编译后会自动运行程序。然而，在命令行界面中，你需要输入以下命令：\n```bash\n./example.c\n```\n以下是输出：\n\
    \n### 注释\n在上面的示例中，你可能在程序中观察到跟随 `//` 符号备注。这些被称为注释。C 语言提供了两种类型的注释：\na) `//`：这些注释通常用于程序的中间。\n\
    b) `/* */`：这些被称为多行注释，通常用于程序的开头或结尾。\n\n### 变量\n变量用于存储值。这里是程序：\n```c\n#include<math.h>\n\
    int main() {\n    int variable1 = 23;\n    int variable2 = 45;\n    int variable3\
    \ = variable1 + variable2;\n    printf(\" First number as %d\\n\", variable1)\n\
    \    printf(\" Second number as %d\\n\", variable2)\n    printf(\" Third number\
    \ as %d\\n\", variable3)\n}\n```\n输出将：\nFirst number as 23\nSecond number as 45\n\
    Third number as 68\n\n### 新行\n在之前的程序中，你可能观察到 `\\n` 用于打印新行。这里是程序：\n```c\n#include<math.h>\n\
    int main() {\n    int variable1 = 67;\n    int variable2 = 78;\n    int variable3\
    \ = variable1 + variable2;\n    printf(\" First number as %d\\n\\n \", variable1)\n\
    \    printf(\"Second number as %d\\n\", variable2)\n    printf(\" Third number\
    \ as %d\\n\", variable3)\n}\n```\n输出将：\nFirst number as 67\nSecond number as 78\n\
    Third number as 145\n\n# 第六章：函数\n\n![Matematica, Calcolo, Pagare, Aritmetica](img/image_rsrc34.jpg)\
    \ 函数是用于存储表达式的有效方法。\n\n### 什么是函数？\n函数通常在数学操作中重复计算。编程语言采用了这些概念来让程序可以使用某些指令。\n\n\
    ### 为什么使用函数？\n有很多论据可以证明 C 语言比其他高级语言更好。通过函数，我们可以方便地组织代码。\n\n### 函数的优点\n1. **简单**：易于维护和调试代码。\n\
    2. **模块化**：模块是重要的部分。\n3. **节省时间**：函数节省了大量时间。\n\n### 运算符优先级\n赋值运算符用于声明或初始化。\n```c\n\
    variab = value;\n```\n\n### 比较运算符\na) **等于运算符** (`==`)\nb) **不等于运算符** (`!=`)\n\
    c) **大于和小于运算符**：`<`, `>=`\n\n### 逻辑运算符\na) **AND 运算符**：`&&` (或 AND)\nb) **OR 运算符**：`||`\
    \ (或 OR)\nc) **NOT 运算符**：`!` (或 NOT)\n\n# 第七章：操作\n\n![Imparare, Matematica, Bambino,\
    \ Ragazza, Formula, Fisica](img/image_rsrc35.jpg) 我们在 C 中使用运算符。\n\n### 数学运算\n\
    a) **加法**：加法通常通过 `+` 运算符完成。\n```c\n#include <stdio.h>\nmain(){\n    int variable1\
    \ = 32;\n    int variable2 = 12;\n    int variable3 = variable1 + variable2;\n\
    \    // 这里我们使用了 '+' 运算符\n    printf(\" This is the number %d\",variable3)\n}\n\
    ```\nb) **减法**：减法由 `-` 运算符表示。\n```c\n#include <stdio.h>\nmain(){\n    int variable1\
    \ = 32;\n    int variable2 = 12;\n    int variable3 = variable1 - variable2;\n\
    \    // 这里我们使用了 '-' 运算符\n    printf(\" This is the number %d\",variable3)\n}\n\
    ```\nc) **乘法**：运算符由 `*` 表示。\n```c\n#include <stdio.h>\nmain(){\n    int variable1\
    \ = 32;\n    int variable2 = 12;\n    int variable3 = variable1 * variable2;\n\
    \    // 这里我们使用了 '*' 运算符\n    printf(\" This is the number %d\",variable3)\n}\n\
    ```\nd) **除法**：运算符通常由 `/` 表示。\n```c\n#include <stdio.h>\nmain(){\n    int variable1\
    \ = 32;\n    int variable2 = 12;\n    int variable3 = variable1 / variable2;\n\
    \    // 这里我们使用了 '/' 运算符\n    printf(\" This is the number %d\",variable3)\n}\n\
    ```\n\n# 第八章：结构\n\n![Matematica, Calcolo, Pagare, Aritmetica](img/image_rsrc36.jpg)\
