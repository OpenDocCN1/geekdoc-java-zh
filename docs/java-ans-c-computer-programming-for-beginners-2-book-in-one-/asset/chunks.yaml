    \ is your biggest weakness?\n* What is your biggest strength?\n\n## Chapter 17:\
    \ Java Language and Terminology\n\n### Absolute filename\nAn absolute filename\
    \ is a filename with a full path that is provided from the top or the root of\
    \ the file system, or example `c:\\Java\\bin\\javac.exe`\n\n### Abstraction\n\
    Abstraction is a simple representation of a complex situation. In basic terms,\
    \ abstraction hides how a section of code or program works and shows only the\
    \ functionality of it. OOP design often revolves around finding an abstraction\
    \ level to work with when real-life objects are being modeled. Too high a level\
    \ and insufficient detail is capture; too low and you run the risk of a program\
    \ being complicated to create and difficult to understand that it should be.\n\
    \n### Abstract method\nAn abstract method is a method whose header contains the\
    \ reserved keyword `abstract`. Abstract methods do not have a method body. Any\
    \ method that has been designed inside an `interface` is considered abstract,\
    \ with no exceptions. An abstract method’s body is defined inside an `abstract\
    \ class` subclass or, if a class implements the interface, within that class.\n\
    \n### Abstract Windowing Toolkit\nThe `AWT`, or Abstract Windowing Toolkit, contains\
    \ a collection of classes that are designed to make creating applications with\
    \ GUIs (graphical user interface) much simpler. You will find these in the `java.awt`\
    \ group of packages and classes included are for buttons, windows, frames, text\
    \ areas and more.\n\n### Accessor method\nAn accessor method is a method that\
    \ has been designed specifically to provide access to a class-private attribute.\
    \ By Java convention, accessor methods are prefixed with `get` and then the attribute\
    \ name. For example, to gain access to an attribute called `speed`, the accessor\
    \ method would be `getSpeed()`. When attributes are set as `private`, it stops\
    \ objects from external classes from modifying the value unless a mutator method\
    \ is used. We can use accessor methods to provide specific access to the private\
    \ attribute values and to stop other objects in other classes from accessing the\
    \ private attribute – the correct visibility needs to be used for the accessor\
    \ to achieve this.\n\n### Actor\nSee client.\n\n### Actual argument\nThis is the\
    \ value of the argument passed from outside a method into a method. When the method\
    \ is called, the values (`actual argument`) will be copied to the formal arguments\
    \ that correspond to it. The actual argument type and the formal argument types\
    \ must be compatible with one another.\n\n### Actual parameter\nSee actual argument.\n\
    \n### Address space\nThis is the virtual memory area that a process runs in.\n\
    \n### Agent\nSee server.\n\n### Aggregation\nThis is an OOP concept, a type of\
    \ relationship where one object has at least one other subordinate object making\
    \ up its state. These subordinate objects don’t tend to have an independent existence\
    \ outside the object that contains them. When this object no longer has a reason\
    \ to exist, neither do its subordinates. For example, you may have a `GasStation`\
    \ object that has a few `pump` objects. Once the `GasStation` object is destroyed\
    \ or has no further use, the `pump` objects follow suit. Aggregation is also known\
    \ as a HAS-A relationship, distinguishing form inheritance which is an IS-A relationship.\n\
    \n### Aliases\nAliases are several references to one object. The object may receive\
    \ messages from any aliases and any change in state the results will be easily\
    \ detected by all.\n\n### Anonymous array\nThis is an array that has been created\
    \ with no identifier. Anonymous arrays tend to be created as actual arguments\
    \ like\n```java\nYearfall y = new int[]{10, 8, 9, 5, 3, 2, 0, 3, 8};\n```\n\n\
    ### Anonymous class\nAn anonymous class is one that does not have a class name.\
    \ This type of class is generally a subclass or interface implementation and normally\
    \ created as an actual argument or returned as result of a method. For example:\n\
    ```java\nButton.addActionListener(new ActionListener(){\n    public void actionPerformed(ActionEvent\
    \ e){\n        System.exit(0);\n    }\n});\n```\n\n### Anonymous object\nAn anonymous\
    \ object is an object created with no identifier. Usually, they are array elements,\
    \ results of methods. For example:\n```java\nPoint[] vertices = {new Point(0,0),new\
    \ Point(0,1),new Point(1,0)};\n```\n\n### API\nSee application\n\n### Append mode\n\
    Append mode is a mode of file writing in which the contents of a file are kept\
    \ and new content appended.\n\n### Applet\nAn applet is a small Java program based\
    \ on the Applet class. Mostly they are used for providing active content on web\
    \ page and have security restrictions that limit them what they do.\n\n### Application\n\
    Application is sometimes used synonymously for the word program but, as far as\
    \ Java is concerned, is the term used to describe programs that aren’t applets.\n\
    \n### Application interface (API)\nThe API is a set of definitions used for writing\
    \ a program. In Java, an API is a set of classes, packages and interfaces used\
    \ for creating complex applications without having to start from the bottom.\n\
    \n### Argument\nAn argument is the information or data passed to a method. Sometimes\
    \ arguments are called parameters. If a method expects an argument the method\
    \ header must have a declaration for every argument. The actual arguments are\
    \ copied to formal arguments.\n\n### Array\nAn array is an object of fixed size\
    \ that can hold at least zero items of the declared type. For example, an `int`\
    \ array will hold `int` items.\n\n### Array initializer\nAn array initializer\
    \ is used to initialize an array. It steps in to take the role of separation step\
    \ and the initialization. For example:\n```java\nint[] pair = {4, 2};\n```\nis\
    \ equivalent to the following four statements:\n```java\nint[] pair;\npair = new\
    \ int[2];\npair[0] = 4;\npair[1] = 2;\n```\n\n### Assembler\nAn assembler is a\
    \ program that is used for translating programs that are written in the assembly\
    \ language into a binary form of specified instruction set.\n\n### Assembly language\n\
    The assembly language is a symbolic one that corresponds very closely to a central\
    \ processing unit (CPU) instruction set. The assembler (above) is the translation\
    \ program that transforms the program into binary.\n\n### Assignment operator\n\
    The assignment operator is an equal sign (`=`) used for storing an expression’s\
    \ value into a variable; for example, `variable = expression`. The right side\
    \ of the operator must be evaluated before the assignment can be made. An assignment\
    \ may, on its own be used on an expression. This example assignment statement\
    \ will store a value of zero into both the variables – `x = y = 0`.\n\n### Assignment\
    \ statement\nAn assignment statement is a statement that contains the assignment\
    \ operator.\n\n### Attribute\nAn attribute is a specific use of instance variable.\
    \ The attribute values in one class instance are defining the current state of\
    \ that specific instance. Class definitions can impose constraints on the valid\
    \ instance states through a requirement that a given attribute or attributes do\
    \ not take particular values. For example, if an attribute holds exam results\
    \ for a class, it should not have negative values. An attribute may be manipulated\
    \ using mutator and accessor methods.\n\n### Base case\nA base case is a non-recursive\
    \ route taken through a recursive method.\n\n### Base type\nThe base type indicates\
    \ the item type in an array, i.e. the arrays’ defined type. For example:\n```java\n\
    int[] numbers;\n```\nNumbers have a base type of `int`. If the base case is the\
    \ type of class, it will be indicating lowest supertype of the objects that the\
    \ array can store. For example:\n```java\nShip[] berths;\n```\nAll that can be\
    \ stored in `births` are instances of the class `Ship`. If an array’s base type\
    \ is `Object`, it may be used for storing instances for any class.\n\n### Behavior\n\
    Class methods are what implement the behavior of a class. The behavior of a specific\
    \ object is a mixture of the class method definitions and the current state of\
    \ the specific object.\n\n### Big-endian\nA type of machine. One of the most common\
    \ differences between machines is how they store each byte of numerical data with\
    \ many bytes. A big-endian machine will store high-order bytes first, followed\
    \ by low-order bytes. Also see little-endian.\n\n### binary\nA binary is base\
    \ 2 number representation. With base 2 only 1 and 1 are used as digits and the\
    \ positions of the digits are representing successive powers of 2. Also see bit.\n\
    \n### Binary operator\nA binary operator is an operator that will take two operands.\
    \ Java has several binary operators, including some of the arithmetic.\n\n###\
    \ Binary search\nA binary search is a search that looks through sorted data where\
    \ the central position is looked at first. The search will then go to the left\
    \ or the right, eliminating the other side. This is repeated for each step until\
    \ all the data has been searched or located.\n\n### Bit\nA bit is a binary digit.\
    \ It can take only two values, 0 and 1. A bit is a basic block for building data\
    \ and programs. A computer will move data around on a regular basis in multiples\
    \ up of 8 bits.\n\n### Bit manipulation operator\nLike `&`, and `^`, are used\
    \ for manipulating bits inside data. The `<<`, `>>` and `>>>` shift operators\
    \ too.\n\n### Blank final variable\nA blank final variable is a final variable\
    \ that wasn’t initialized when it was declared. These variables need to be initialized\
    \ in one of two ways before it can be used – in every class constructor or instance\
    \ block.\n\n### Block\nA block is a section of code made up of declarations and\
    \ statements enclosed in a pair of opening and closing brackets `{}`. Both a class\
    \ body and method body are blocks. Blocks are also used for nested scope levels.\n\
    \n### Bookmark\nA bookmark is used by web browser as a way of remembering URL.\n\
    \n### Boolean\nBoolean is a primitive data type in Java. It has just possible\
    \ values – TRUE or FALSE.\n\n### Boolean expression\nA boolean expression is one\
    \ that results in boolean, i.e. TRUE or FALSE. The `&&` and `|` operators, among\
    \ others, will take boolean operand, producing boolean result. Relational operators\
    \ will take operands of different types and will also produce boolean result.\n\
    \n### Boot\nA computer “boots” up when you turn it on and the term is derived\
    \ from the phrase “pulling yourself up by your bootstraps”. When a computer is\
    \ first switched on it must load everything it needs from its disks before it\
    \ can be used but to do this is called bootstrap.\n\n### Bootstrap classes\nA\
    \ bootstrap class is part of the Java Platform API, like those from `java.io`\
    \ and `java.lang` packages.\n\n### Boundary error\nA boundary error is one that\
    \ happens as a result of mistake happening at the edge of a problem, such as indexing\
    \ off an array, loop termination and more. Boundary errors are very common logical\
    \ errors.\n\n### Bounded repetition\nBounded repetition is where statements in\
    \ the body of a loop get a certain number of times – the number of times is worked\
    \ out when the loop begins. Java does not have any control structure that will\
    \ guarantee repetition.\n\n### Bounds\nA bound is the limit of a collection or\
    \ array. In Java, a lower limit will always be zero and where arrays are concerned,\
    \ an upper bound will be one less than the array length and is fixed. When you\
    \ index outside a collection or bound, you will get `IndexOutOfBoundsException`\
    \ thrown.\n\n### Branch instruction\nA branch instruction will store address in\
    \ the counter for a program. The result is that the next instruction fetched may\
    \ not be the one that immediately follows the branch instruction and causes disruption\
    \ in the normal sequence of instruction execution. The result of this is conditional\
    \ instruction execution and repetition.\n\n### Break statement\nA `break` statement\
    \ is a statement for breaking out of a loop, a labeled block or `switch` statement.\
    \ In every case, control flow moves to the statement that immediately follows\
    \ the block containing the statement.\n\n### Bridging method\nA bridging method\
    \ is one that provides a bridge between methods in a public interface for a class\
    \ and the private implementation of that interface. Usually, bridging methods\
    \ are non-public in terms of visibility.\n\n### Byte\nA byte is, in computing\
    \ terms, eight data bits. In Java, it is also a primitive type with a size of\
    \ eight bits.\n\n### Bytecode\nThe Java compiler translates Java source files\
    \ into bytecode which is the instruction set of the JVM. All bytecode is stored\
    \ in a `.class` file.\n\n### CONCLUSION\nI would like to thank you for choosing\
    \ my guide on Java programming. As you can see, it is a simple yet complex language,\
    \ with so many different aspects to learn. By now you should have a good understanding\
    \ of the core concepts of Java programming and how to use it. Your next step is,\
    \ quite simply, practice. And keep on practicing. You cannot possibly read this\
    \ guide once and think that you know it all. I urge you to take your time going\
    \ through this; follow the tutorials carefully and don’t move on from any section\
    \ until you fully understand it and what it all means. To help you out, there\
    \ are several useful Java forums to be found online, full of people ready and\
    \ willing to help you out and point you in the right direction. There are also\
    \ loads of online courses, some free and some that you need to pay for, but all\
    \ of them are useful and can help you take your learning to the next level. Did\
    \ you enjoy this guide? I hope that it was all you wanted and more and it has\
    \ put you on the right path to getting your dream job!\n\n## C PROGRAMMING LANGUAGE\
    \ FOR BEGINNERS\nA step by step guide to learn C programming and series\nWill\
    \ Norton\n\n### Introduction\nProgramming has changed the world and is still ruling\
    \ the technological industry with wonders achieved that is often difficult to\
    \ imagine. Efficient programmers are scarce and industries are looking out for\
    \ fresh talent. A lot of programmers in the initial stage of the technological\
    \ revolution depended on badly written structured programming languages such as\
    \ Pascal, Haskel, Cobalt etc. They have serious issues with the syntical structure\
    \ and the way they define things. At this point, C has emerged as a logical and\
    \ effective programming language that can achieve what it intended to. A lot of\
    \ programmers at first found it very different from other languages they have\
    \ learned. But as time passed on C has become programmers favorite and is still\
    \ one of the most popular and beginners intended programming languages despite\
    \ competition from other high-level programming languages such as Java and Python.\
    \ Even now, if you have any programming background from other traditional programming\
    \ languages such as Java and Python, you will find it extremely hard to understand\
    \ the essence of language and create complex programs by yourself in C language.\n"
  raw: 'You are already familiar with the first two – public and private.When the
    variable is declared to be public then it can be anywhere in the program you are
    writing. In contrast when it is private then it can’t be seen or accessed anywhere
    else but in the body of the class where it has been instantiated.Let’s move on
    to the other two access control modifiers.The next one on the list is called “protected”
    – which is useful in case you want to create libs. When a variable is protected,
    it means that it can only be seen within the package where this Java construct
    has been instantiated – note that this also includes all the subclasses.The “default”
    access control modifier, on the other hand, is used by the variable when the other
    three aren’t specified. In this mode, a variable can be accessed within package
    or class where it has been instantiated by the programmer. However, do take note
    that the variable is only accessible within the main body of the class and it
    is not available within its subclasses.Note that you can also create an object
    within a method and the usual rules apply – the object or variable can only be
    accessed within the body of the method where it has been created.Here’s another
    important point that you should remember about variables that you create within
    a method – it can only specify one keyword for it: final.You will not be allowed
    to create a default, protected, public, or even a private variable within the
    method body. And that is basically how information is hidden in your code, which,
    if you observe, facilitates data abstraction and encapsulation.Encapsulation?
    Information Hiding? What’s the Difference? It would appear at first glance that
    encapsulation and data or information hiding may look the same, but there is indeed
    a subtle difference between these two terms.Now, Nat Pryce and Steve Freeman has
    made quite an accurate distinction between these two although you may read from
    other authors who use these terms interchangeably.We’ll use Freeman and Pryce’s
    descriptions here to draw the difference between these two concepts in Java programming.
    Let’s begin with information hiding since that is where we left off.You can already
    judge what “information hiding” means. It simply means information is concealed.
    The actual functions and procedures performed by the program are concealed.But,
    for what purpose? Why are the inner workings kept hidden from the programmer?The
    lower level details are ignored so that you, the programmer, can focus on much
    more important things. That is also why data is abstracted in Java.You can create
    classes, objects, and other elements of your program; you can even import objects
    from one program to another without worrying about the details on how that object
    does what it does.It’s like driving a car.All you need to know is that when you
    insert your key into the keyhole and start the car, it will start.You don’t have
    to worry about what makes it start, how the wires are connected underneath there,
    where the gas goes, how the engine burns the gas, etc.All you need to worry about
    is starting the car and driving safely.Encapsulation, on the other hand, allows
    the user to control the amount of change in an object can affect the other parts
    of class.The term “encapsulate” means to enclose everything in a singular cell.That
    means that given the way the Java programming system is designed, there will be
    no expected dependency from one independent cell to another.Remember that objects
    within the Java programming environment are meant to be stand alone, and there
    are no global variables to reference.AbstractionAbstraction simply refers to the
    process of hiding unnecessary details of an object and only showing the ones that
    are relevant. Encapsulation on the other hand simply means the binding of the
    states and the methods of an object together.This binding eventually creates something
    called a class (we’ll cover that in a little bit). Finally, message passing refers
    to the ability of objects to interact with other objects.High – level programming
    languages, on the other hand, have a much higher level of abstraction, meaning
    that code goes through a program called a compiler, which acts as the computer’s
    translator, before the computer is able to use it.This level of abstraction is
    usually to the point where the programming language already has syntax similar
    to English, a global language.The compiler assumes the role of the translator
    between the high – level language and the machine.This allows the programmer to
    write their program in a more natural manner, as it allows for the coder to use
    more "natural" language, and the higher – level language allows for some functions
    to be automated, making life much easier for the coder.The trade – off here however
    is that the code has to go through a compiler, which will take lengthier for the
    program to run and execute, and the computer will often use more memory as compared
    to a lower – level language. Amongst these high – level languages are the more
    frequently – known ones, such as Python, C++, and our topic for today, Java.Chapter
