    ## INTRODUCTION


    The history of Java dates back to 1991 when programmers Patrick Haughton, Mike
    Sheridan, and James Gosling thought of a programming language that could best
    be used for the development of Digital TV. However, it was deemed to be way ahead
    of its own time, and thus, they redeveloped it based on the C+ and C++ platforms
    to make it easier and more economical to use.


    With the redevelopment also came the core principles of Java, which are:

    - It has to be portable—or that it should work on as many platforms as possible,
    without any of them not working as well as the other;

    - It should be safe and secure to use—and definitely well;

    - People should feel connected to it in as little time as possible, which means
    that they should be working with words that are somehow familiar to them, and
    even though it looks complex at first, sooner or later, they have to realize that
    it actually works;

    - It should be dynamic, should work in threads, and could be modified when needed,
    and; it should perform with precision.


    As you can see, these core principles give you the feeling that programmers real
    made Java for the people—so they can enjoy using more without having to buy many
    devices. In 1995, Sun Microsystems finally released Java 1.0—the first inception
    of Java, which had amazing security, no-cost runtimes, and file access across
    all networks. Over the years, 7 more releases had been made, and ever since 2006,
    Java started to be available through GNU or General Public License—meaning it
    is now a free, open-source programming language. This is some of its contents
    were made private and only available for a fee, which definitely does not resonate
    with its core principles. Start reading this book now and you''ll learn more about
    Java in no time!


    ## Chapter 1: What is Java?


    Java is a programming language that is built by Sun Microsystems, which was later
    taken by Oracle Corporation. It is designed to run on any operating system that
    supports Java. This is what made the language so popular, because the developer
    just had to write the program once, and the program could then run on any operating
    system without the need for the programmer to change the code. Most of the modern
    applications built around the world are made from Java programming language. Most
    of the server side and business logic of major applications are built on Java.


    During the entire course of this book you will learn how to write programs such
    as the one above, and also learn advanced concepts that will enable you to start
    writing. Some of the design goals for Java are mentioned below:

    - The language is intended to be written once and have the ability to be run on
    any operating system.

    - The language should provide support for numerous engineering principles.

    - The language is intended to be used in developing software suitable for deployment
    in distributed environments. Portability is an important factor. This is why Java
    has the ability to run on Windows, Linux and the MacOS operating system. Support
    for internationalization is very important. Java is intended to be suitable for
    writing applications for both hosted and embedded systems.


    Other design goals are discussed next:


    ### 1.1 Strong Type Checking Java is a strong type language. Every variable that
    is defined needs to be attached to a data type. You don’t need to understand the
    complete program for now, but let’s have a quick look at 2 lines of the code.


    ```java

    int i=5;

    ```

    Here we are defining something known as a variable, which is used to hold a value.
    The value that can be stored depends on the data type. In this example we are
    saying that `i` is of the type `int` or Integer, which is a number data.


    ### Array Bounds Checking At runtime, Java will check whether the array has the
    required number of values. If one tries to access a value which is outside the
    bounds of the array, an exception will be thrown. You don’t need to understand
    the complete program for now, but let’s have a quick look at the following lines
    of the code.


    ```java

    int[] array1 = new int[2];

    ```

    Here we are declaring an array, which is a set of integer values. The value of
    `2` means that we can only store two values in the array.


    ```java

    array1[0] = 1;

    array1[1] = 2;

    array1[2] = 3;

    ```

    With this code we can see that we are assigning 3 values to the array. When you
    run this program, you will get an error because the program will see that the
    array has gone out of its maximum allowable bounds of two. You will get the below
    error at runtime.


    ```

    Exception in thread "main" java.lang.ArrayIndexOutOfBoundsException: 2

    at HelloWorld.main(HelloWorld.java:8)

    ```


    ## Chapter 2: Why Java is important?


    Next, Java has syntax and features that resemble other programming languages like
    C and C++. If you have any prior programming experience, you will find learning
    Java a breeze. Even if you are totally new to programming, you can rest assured
    that Java is designed to be a relatively easy language to learn. Most programmers
    find it easier to learn Java than say, C or C++.


    Java is also designed to be platform independent. As mentioned earlier, Java code
    is compiled into bytecode first, which can be run on any machine that has the
    Java Virtual Machine. Hence with Java, you can write the code once and run it
    anywhere you want.


    Next, Java is an object-oriented programming (OOP) language. Object-oriented programming
    is an approach to programming that breaks a programming problem into objects that
    interact with each other. We’ll be looking at various object-oriented programming
    concepts in this book. Once you master Java, you will be familiar with these concepts.
    This will make it easier for you to master other object-oriented programming languages
    in future.


    ### Basic Tips How has java become so successful? Java is such a widespread language
