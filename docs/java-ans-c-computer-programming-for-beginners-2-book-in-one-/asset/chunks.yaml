    short, is a storage unit for a data type. Having access to variables allow programmers
    to conveniently label and call stored values at hand. Types of variables in JavaJava
    requires the programmer to use declaration statements, lines of code used to declare
    variables and define them by specifying the particular data type and name.Java
    has a specific way of treating variables, by defining variables as containers
    that contains a certain type and value of information, unlike some languages such
    as python, which only requires a declaration of a variable, and the variable can
    dynamically change its type;Java variables are static , which retain their type
    once declared.Int number = 20;Boolean completed = true;String hello = “Hello World!”;The
    syntax in declaring is seen in the previous examples, with the type of the variable
    coming first, then the name of the variable, then the value.Note as well that
    the declaration statement can be composed of multiple declarations in one line,
    as in the following example:Int number = 20, Boolean completed = true, string
    hello = “Hello World!”;Java variables can be declared without any value at the
    start; in cases such as these, Java chooses to declare these variables with a
    particular default value, for example:Byte a;Short num;Boolean answer;Will result
    in the values 0, 0, and false, respectively.A more complete list of default values
    is as follows: the byte, short, int, and long data types will all result in a
    default value of 0, while the float and double data types will have a default
    0.0 value, the char data type will result in ‘u\0000’ value, a string or any other
    object will have a null default value, and all Booleans will begin with a false
    default value. In Java, variables are static when declared, meaning that the programmer
    must define the data type that the variable will be containing.To illustrate,
    if we wish to use a variable num to store a number, we would first have to declare
    the variable: "int num ", before we can assign a value, such as "num = 10".  The
    process above is usually known as and referred to as an "assignment statement",
    where a value is assigned to the variable as declared by the programmer.However,
    one prominent thing about how Java, and in fact how most programming languages,
    works is that in the assignment statement, such as in our example of num = 10,
    the actual value stored is the one on the right side of the equals sign, the value
    of 10, and num is just the "marker" to call that stored value.This is why there
    are many Java programmers that tend to prefer the jargon of "getting" a value
    rather than "assigning", though for the most part, they may be employed interchangeably,
    and outside of some rare scenario, function mostly the same way.Note, however,
    that once values have been assigned to variables, functions need to be carried
    out in order for the data inside that variable to change its data type. Naming
    a variableCreating variables is an easy task, especially given how Java programmers
    tend to create and name them after the data type or the purpose of what the variable
    will store.However, there are a few rules when it comes to naming these variables,
    else Java will not recognize it and an error message will result. The main restrictions
    around variable names are that it should not begin with a special character such
    as an underscore or a number.However, variable names can consist of characters
    such as letters and numbers, and even an underscore, provided that the underscore
    is not placed at the start.No other characters may be used, such as the # or even
    $, as these special characters have different uses in Java, and thus will not
    be recognized in a variable name.While those are the major rules, here are some
    tips when it comes to naming variables.The variable name should be descriptive,
    as in longer codes it may be difficult to recall just what "x" is for.Having a
    variable name such as "count" or "output" is much easier to recall as compared
    to having a generic "x" or "y" and will help in avoiding confusion.In addition
    to being descriptive, variables will also be easier to use if their names are
    kept fairly short.While having a variable name such as banking_information_account_records
    is very descriptive, typing it repeatedly as needed in the program will get exhausting,
    and having longer variable names increase the chances of typographical errors,
    which will lead to bugs in the code, resulting in a run - time error or the code
    not working as intended, or working, but introducing bugs along the way.Note as
    well that it has always been a practice for Java variables to be written in all
    lower – case letters, and while there is no restriction on capitalization, keeping
    things in lowercase simplifies things, as a missed capitalization may result in
    the variable not being recognized, as Java reads an upper – case letter as an
    entirely different character versus a lower – case letter.Java primitive typesMethod
    Naming ConventionsWe shall revisit the naming conventions in Java since you will
    be using member methods.Methods in Java programming perform operations, they also
    receive any argument provided by a caller, and it can also return a result of
    an operation to a caller.Here’s the syntax for declaring a method:[Access Control
    Modifier] Return Type methodName ([set of parameters]) {// body of the method......}Here
    are a few rules to remember when you make the names for the methods that you will
    write.Method names are always verbs or more specifically verb phrases (which means
    you can use multiple words to name them).The first word of the method name should
    all be in lower case letters while the rest of the words should follow a camel
    case format. Here is an example:writeMethodNamesThisWay( )Now, you should remember
    that verbs are used for method names, and they indicate an action while nouns
    are used for variable names, and they denote a certain attribute.Following the
    syntax for declaring a method and following the name conventions for this Java
    construct, here’s a sample code that can be used to compute the area of a circle.public
    double computeCircleArea() {return radius * radius * Math.PI;}Using Constructors
    in Your CodeWe’ll just go over some additional details as they relate to object
    oriented programming.As stated earlier, a constructor will look like a method,
    and you can certainly think of it and treat it like a special kind of method in
    Java programming.However, a constructor will still be different from a method
    in several ways. The name of a constructor will be the same as the class name.Use
    the keyword or operator “new” to create a new instance of the constructor and
    also to initialize it. Here’s an example using the class “Employee” and a variety
    of ways to initialize it in your code:Employee payrate1 = new Employee( );Employee
    payrate2 = new Employee(2.0);Employee payrate3 = new Employee(3.0, “regular”);A
    constructor will also implicitly return void – that simply means it doesn’t have
    a return type. You can’t put a return statement inside the body of a constructor
    since it will be flagged by compilers as an error.The only way you can invoke
    a constructor is via the use of the “new” statement. We have already given you
    several ways how you can invoke constructors in the samples above.One final difference
    is that constructors can’t be inherited. Let’s go back to the examples provided
    above – the first line includes “Employee( );” – that is called a default constructor.
    As you can see, it has no parameters whatsoever.The job of a default constructor
    is to simply initialize the member variables to a specific default value. In the
    example above, the member variable payrate1 was initialized to its default pay
    rate and employee status.Can constructors be overloaded too? Yes, they can. Constructors
    behave like methods too so that means you can overload a constructor just the
    same way you overload a method.Here are a few examples on how you can overload
    a constructor.We use the Employee class and overload it using different parameters.Employee(
    )Employee(int r)Employee(int r, String b)How to initialize a variableNow that
    we know how to declare variables, and we know the various types of variables that
    are available to us, the next thing to do is to learn how to make use of these
    variables, in something called “expressions”.Expressions are the most used building
    blocks of a Java program, generally meant to produce a new value as a result,
    though in some cases expressions are used to assign a new value to a variable.Generally,
    expressions are made up of things such as values, variables, operators, and method
    calls.There are also some expressions that produce no result, but rather affect
    another variable.One example would be an expression that changes the value of
    a variable based on an operation: there is no new value output, and there is no
    true “assignment” of a new value, but rather there is what is called a side effect
    that results in a changed variable value.In our previous sample program above,
    such as the "Hello World" printing program, we introduced raw values into the
    print function, also known as "hard coding" the output.However, at this point,
    we should try to incorporate what we have learned about variables.Variables operate
    much the same way as raw values, as they simply reference a previously stored
    value by the computer, and as such, the programmer can just use the variable name
    instead of the value.In order to demonstrate this, let us remember the previous
    "Hello World" program:print ("Hello World") ;input ("\n\nPlease press the return
    key to close this window.") ;Now, instead of hard – coding the "Hello World" string,
    we can simply declare it into a variable and have the program output that variable.This
    should end up looking as:String = "Hello World" ;print(string) ;input ("\n\nPlease
    press the return key to close this window.") ;This should come out with the same
    result as the previous program, looking something similar to:Hello WorldPlease
    press the return key to close this window.Variables modified by codeHowever, the
    reader may be wondering why we even use a variable in this case, as it makes our
    code even longer.In very short codes, such as the classic “Hello World”, using
    variables does make it longer, but to demonstrate how they can be used to shorten
    a code, let''s use another code to show the usefulness of variables.For this code,
    we will attempt to print out a few times table values. In this code we will be
    using a few iterations and loops, which will be explained further on.Int num =
    9;byte count = 0 ;while (counter <10) {print(num " * ") ;print(counter "= ") ;print(num
    * counter "\n") ;counter = counter + 1} ;This basic snippet of code will output
    the multiplication table of whatever is in the num variable up until times nine.
    In this program we are to be incorporating a so – called while condition and an
    iteration function.However, if we break down the components of the code as provided,
    the "while" condition tells Java to continue iterating the code beneath it until
    the condition is not true. Since count was initialized at a value of 0, and every
    time the code runs, the count variable will increase by one, the loop will run
    for ten times.The code nested within the "while" condition tells the Java program
    to print an equation of the number multiplied by the "counter" variable, meaning
    that it will print ten lines, from times zero to times nine.The code should end
    up looking like the following output:9 * 0 = 09 * 1 = 99 * 2 = 189 * 3 = 279 *
    4 = 369 * 5 = 459 * 6 = 549 * 7 = 639 * 8 = 729 * 9 = 81Now try and imagine how
    a more seasoned programmer would think of how to write an algorithm to create
    a similar table without having a variable that can be changed as the code runs.They
    would have to "hard – code" all the values and type all the numbers just to get
    a simple multiplication table. However, due to the power of variables, the coder
    can simply assign a basic starting value and their code should do the rest.Variables
    modified by user inputVariables can have a value declared by the programmer in
    the code, but the programmer can also have their variables as defined by the user.Remember
    that user input can be read by the Python code by the use of the input () function.They
    can do this while declaring the variable, or they may wish to have their user
    input a new value to an already – declared variable.Let''s see how this works
    using the previous multiplication table code:Int num = NextInt(input("Please enter
    a number from 0 – 9 to initialize the multiplication table.")) ;Int counter =
    0 ;while (counter<10){print(num " * ") ;print(counter "= ") ;print(num * counter
    "\n") ;counter = counter + 1 ;  }This code prints an initial line and waits for
    the user to input a number before the code will run.Note that the user can technically
    enter a character that is not a number, and this will result in an error.Furthermore,
    the input function in this case is limited to receiving a single character, so
    only a number from 0 – 9 can be used, as longer digits will not be read.The variable
    declaration is a nested function, ensuring that the user input will be converted
    into an integer, rather than having a character, allowing the code to use mathematical
    operations.Arithmetic operators![Palla, Http, Www, Crash, Amministratore, Informazioni](image_rsrc3YP.jpg)Arithmetic
    operators in Java include:'
