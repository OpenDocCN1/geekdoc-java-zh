    be looking at various object-oriented programming concepts in this book. Once
    you master Java, you will be familiar with these concepts. This will make it easier
    for you to master other object-oriented programming languages in future.Basic
    TipsHow has java become so successful? Java is such a widespread language for
    many reasons, and it owes a lot around the key principles it was designed around.
    One of the first principles of Java is its ease of use.The fundamentals of the
    Java programming language were adapted from C ++, another extremely popular higher
    – level programming language.However, though C ++ and its predecessors, C and
    C # are powerful languages, it tends to be rather complex in terms of syntax,
    and is not fully adapted for some of the purposes of Java, notably for internet
    technology integration.Java thus was able to base itself on C ++, and build on
    this powerful language’s fundamentals in order to provide a language that is also
    similarly powerful, but easier to use and better – suited for some specialized
    users.Java is also a very reliable programming language, intentionally build in
    order to reduce and even eliminate the possibilities of fatal errors that arise
    from programmer errors. This is why Java heavily relies on object – oriented programming
    principles, which allows the data and the manipulation of data to be packaged
    together, making Java more robust and reliable, as well as much more modular,
    allowing for code packages to be switched out and adapted as needed.In addition
    to the previous qualities of ease of use and reliability, given Java’s nature
    of initially being designed for mobile devices, it was designed to be able to
    provide a higher level of security and safety for its programming, as it was initially
    meant for mobile devices, which by their nature are meant to exchange data over
    networks, making data security of the utmost priority.Due to this, Java has become
    one of the most secure programming languages widely available today, making it
    a highly attractive option to those who wish to write programs that are less vulnerable
    to exploits.Also, though Java was initially intended for mobile devices, Java
    has developed into a relatively platform – independent programming language, something
    that works to its advantage, as programs written in Java tend to work no matter
    what machine is running the program.Java was written as a language that would
    be portable and work cross – platform, meaning that it doesn’t matter what operating
    system the machine has, what hardware the machine is running, or what device it’s
    running on.This has led to its adaptability and its widespread use around the
    world. Due to these core principles prioritized by the Sun Microsystems team that
    developed Java: Ease of Use, Reliability, Safety, Cross – platform adaptability,
    Java became and still remains one of the most popular and most widely used programming
    languages today.Why Java?Of course, one of the key reasons to use Java is its
    focus on Object – oriented programming.Object – oriented programming, or “OOP”
    is a type of programming language model which allows the program’s code to be
    organized around data, rather than functions and logic, which is known as procedural
    programming.These “data clusters” are organized into things called “objects”,
    hence the moniker of “object – oriented programming”.These objects are created
    by something called “classes”, understood here in the traditional sense of how
    classes are: types of objects, allowing the programmer to “classify” them according
    to two major criteria: attributes and methods.The attributes of a class are the
    raw data that will create the object: these are its descriptors, such as the values
    that it possesses, and other relevant data that will make up the object. The second
    criterion is the “method” of the object.This “method” is the behavior, or the
    logical sequences contained within the class, describing how it interacts or can
    be interacted with natively. Chapter 3: Basics of Java![Banner, Intestazione,
    Matematica, Formula, Fisica](image_rsrc3YE.jpg)Java tokensJava tokens are the
    values that are smaller than other integers.These numbers are going to fall between
    the value of -32768 and 32767. The code that I have been using is not going to
    work for shorts, instead I am going to need to use the short function so that
    I can make sure that the values are going to fall between the set limitations.  Large
    values are going to be stored inside of a double value along with floating point
    values.A double does not have to be used if I can use a floating point.As I am
    storing a floating variable. I am going to need to put a letter at the end of
    my value amount. This value should be f because it is a floating point number.  KeywordsIn
    Java, the Boolean type refers to false or true values. Java finds out if it is
    true or false using the reserved keywords. Therefore, an expression Boolean type
    will assume one of these values. An example to demonstrate include: There are
    a few things to note about this program.First, the println(), displays a boolean
    value.Secondly, the boolean values control the flow of an if statement.You don’t
    need to go the long way in writing the boolean type this way: if (b == true)  The
    result shown by the operator such as < is boolean.It is one of the reasons why
    we have the expression 11 > 8 showing the value true .In addition, the other pair
    of parentheses near the 11 > 8 is important since plus comes before the >. IdentifiersThe
    top layer of the diagram above is for the identifier or name. This top layer is
    the name you give to a class.The name should specifically identify and also describe
    the type of object as seen or experienced by the user.In simple terms, the name
    or identifier should identify the class. OperatorsJava has an extensive list of
    operator environment.If you are wondering what an operator is, you can look at
    it as a symbol which conveys a specific message to the compiler to carry out a
    logical or mathematical operation. In Java, you will interact with four classes
    of operators.The four classes include: '
