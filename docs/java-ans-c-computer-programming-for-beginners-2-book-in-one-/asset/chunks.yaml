    ## 第 8 章：Java 数据结构与算法

    ![Steinzeitcomputer, Calcolatore, Monumento, Betonrechner](img/image_rsrc3YR.jpg)


    为了更清楚这一点，假设有一个类 `Human`。这个 `class` 将具有身高、体重、性别、种族等属性。`human` 类还可以拥有 `run`、`walk`、`talk`
    等方法。这些理论组件构成了 `human` 类，它是对象的蓝图。现在类已经定义好了，程序员如果愿意，可以使用 `human` 类作为蓝图创建一个对象。他们可以调用类
    `Human` 并填充（populate）它的属性，赋予它特定的身高、体重、性别和种族。


    此外，对象已经具有内置函数，如 `run`、`walk` 和 `talk`，因此在创建对象时（例如从 `Human` 类创建一个名为 `Mike` 的对象），它包含了运行、行走和说话的功能，不需要程序员再次编写这些特定函数，因为它们在创建的对象中是“固有”的。简而言之，这就是面向对象编程的意义：一种编程方式，允许程序员利用预定义的类，从而更容易地描述它们并使用它们的内部或内置函数来操作它们。


    假设读者不是编程的完全新手，并且已经通过 C 或或其他面向过程的语言接触过编程世界，那么下一个逻辑问题就是：为什么要使用面向对象编程？嗯，它的主要优势之一是从长远来看，它可以节省时间。在更简单的算法和程序中，过程化编程通常更快、更直接；程序员不需要构建和定义类并根据该类创建对象，他们只需要简单地声明必要的变量并编写函数，并创建算法来解决代码需要处理的问题。


    然而，当涉及到更复杂的程序需要更复杂的解决方案时，这就是面向对象编程开始发挥异彩的地方，也是它展现实力的地方。在很多程序中，会有某些需要将多个“对象”或数据簇聚集在一起，程序员将以某种方式处理它们。这正是“类”要解决的问题。他们不需要为每个数据簇声明一组新变量，只需要利用预先制作的“类”并创建一个新的“对象”。让我们看看这在实践中是如何运作的。如果一个程序员用过程化的方式编写国际象棋游戏，他们将必须手动描述每个棋子：十六个兵、四个骑士马、四个车车、两个皇后和两个国王。但是，如果程序员使用面向对象编程，不需要编写十六个兵、四个骑士马、四个车车、两个皇后和两个国王，他们只需要编写六个类：每个类描述一个棋子。程序员现在可以简单地在每个类中包含移动函数，并用属性描述它们的位置：它们是白方的兵还是黑方的皇后兵，这些都可以通过“兵”类的“属性”部分进行插入。程序员不需要写三十个代码块，只需要写六个。现在这变得容易得多、更短，而且更加优雅。


    ## 第 9 章：数组

    ![Pensione, Scuola, Ricerca, Insegnamento](img/image_rsrc3YS.jpg)


    数组是元素的序列；每个元素必须与一个或多个位置相关。元素是内存位置组，每个位置存储一个数据项。索引是非负整数；在数组的情况下，它们用于标识具有特定索引的元素。你可以将两者之间的关系比作邮箱如何识别特定街道上的特定房屋。通常，一个元素将有一个索引，但有时会有多个。每个元素拥有的索引数量就是数组的维度。我们将从查看一维数组开始；稍后我们将转向多维数组。Java
    对数组有完全的支持。数组中的每个元素将占据相同的大小，具体大小取决于元素的数据类型。在此阶段还需要注意的是，数组中的每个元素都具有相同的数据类型。同样重要的是，你不能调整
    Java 数组的大小；它们是固定大小的，一旦创建就无法更改。如果你需要数组的大小不同，你需要创建一个正确大小的新数组，然后从第一个数组将所有需要的元素复制到新数组中。


    ### 一维数组

    一维数组是所有数组中最简单的。在这类数组中，一个元素与一个索引相关，数组用于在列表中存储数据项。我们可以使用三种单独的技术来创建一维数组：

    - 仅使用初始化器

    - 仅使用 `new` 关键字

    - 同时使用初始化器和 `new` 关键字


    #### 仅使用初始化器

    使用初始化器创建一维数组所需的语法是 `{expr, expr}`。这种语法告诉我们，一维数组是表达式的列表，每个表达式之间用逗号分隔，且位于大括号之间。所有表达式的求值类型必须是兼容的。例如，如果你有一个两个元素的
    `double` 类型一维数组，这两个元素都可以是 `double` 类型，或者只有其中一个可以是 `double` 类型，而另一个可以是整数或浮点数。


    #### 仅使用 `new` 关键字

    `new` 关键字用于分配内存并返回数组引用。语法是 `new type[int_expr]`。这告诉我们，一维数组是 `int`（整数）类型的序列。数组中的所有元素将被零，并解释如下：

    - `0`

    - `0L`

    - `0.0F`

    - `0.0`

    - `false`

    - `null`

    - `\u000`

    例如：`new char[4]`


    #### 使用初始化器和 `new` 关键字

    同时使用初始化器和 `new` 关键字创建数组的语法是上述两种分离方法的组合：`new type[] {expr, expr}`。因为我们可以通过查看逗号分隔的表达式列表来确定一维数组中有多少个元素，所以我们不需要必须在方括号内使用
    `int_expr`。例如：`new char[] {''J'', ''a'', ''v'', ''a''}`。注意的是，仅使用初始化器的语法与使用初始化器和
    `new` 关键字的语法之间没有区别。第一个（仅初始化器）被称为语法糖（syntactic sugar），这意味着这种语法更容易使用。


    #### 数组变量

    单独的一个一维数组是没用的。为了使其有意义，我们必须首先将其赋值给具有兼容类型的数组变量。我们可以通过两种方式这样做——直接或通过调用方法。以下示例显示了如何声明变量：

    ```

    type var_name[]

    ```

    两种类型都会存储一维数组的引用。你可以使用你喜欢的任何类型，但首选的是第一个。在这些示例中，有三个数组变量——`name1`、`name2` 和 `name3`。

    ```

    char[] chars = {''A''};

    ```

    方括号告诉 Java 每一个变量将存储一维数组的引用。关键字 `char` 指明元素必须是 `char` 类型，但只要 Java 可以将其转换为 `char`。例如，以下是完全正确的：

    ```

    char[] chars = {''A'', 10};

    ```

    然而，下一个示例是不正确的，因为它不符合 (0 到 65535) 的范围：

    ```

    char[] chars = {''A'', 80000};

    ```

    所有数组变量都有一个 `length` 属性。该属性将返回一维数组的长度，指示为 `int` 类型。例如：

    ```

    name1.length

    ```

    会返回值 4。通过指定数组变量，我们可以以此方式访问数组中的任何元素。不要忘记，Java 索引从 0 开始。看看这几个示例：

    ```

    char ch = names[0];

    names[1] = ''A'';

    ```

    如果指定了负索引，Java 将创建一个异常并抛出它。该异常是：

    ```

    java.lang.ArrayIndexOutOfBoundsException

    ```


    ## 第 10 章：Java 字符串

    字符串无非是字符序列，由 `null` 字符终止，表示字符串确实已结束。在 Java 中，字符串由 `string` 数据类型表示。让我们通过一个示例回顾如何在
    Java 中定义字符串。我们首先定义一个变量 `str` 为 `string` 类型。然后将“Hello World”赋值给 `str`。最后将其输出到控制台。通过此程序，输出如下：字符串的值是
    Hello World。Java 中有多种函数可以处理字符串。让我们详细查看它们。


    ### 4.1 Length 函数

    该函数用于返回字符串的长度。让我们看一个示例：我们使用 `length()` 方法获取字符串的长度。通过此程序，输出如下：字符串的长度是 11。


    ### 4.2 toLowerCase 函数

    该函数返回小写的字符串。让我们看一个简单的示例。通过此程序，输出如下：字符串的小写形式是 hello world


    ### 4.3 toUpperCase 函数

    该函数返回大写的字符串。让我们快速看一个示例。通过此程序，输出如下：字符串的大写形式是 HELLO WORLD


    ### 4.4 Contains 函数

    该函数用于检查另一个字符串是否存在，并返回 True 或 False。下面是一个示例。通过此程序，输出如下：字符串包含 Hello - True


    ### 4.5 endsWith 函数

    该函数可以检查字符串是否以特定的字符串值结尾。让我们看一个简单的示例。通过此程序，输出如下：字符串以 World - true


    ### 4.6 indexOf 函数

    该函数用于获取字符串中字符的索引。让我们看一个示例。通过此程序，输出如下：e 的索引值是 14


    ### 4.7 Replace 函数

    该函数用于替换原始字符串中的字符。让我们看一个示例。通过此程序，输出如下：字符串的值是 Hello Again


    ### 4.8 Substring 函数

    该函数用于从原始字符串中返回子字符串。让我们看一个快速示例。通过此程序，输出如下：字符串的值是 Hello

    如果值小于 0，意味着目标字符串位于值之前；如果值大于 0，意味着目标字符串位于值之后。如果值等于 0，则该实例在排序上与值相同。让我们看一个该函数的示例。通过此程序，输出如下：`compareTo`
    函数的输出是 0


    ## 第 11 章：Java Web 开发

    什么是 Java Web 应用程序？

    Java Web 简单来说就是使用 Java 构建的 Web 应用。但远不止于此，它们是生成交互网页的应用程序，包含不同的标记语言（如 XML、HTML 等）以及动态内容。通常，一个
    Java Web 应用程序由 Web 组件组成，这些组件修改临时存储的数据、与 Web 服务及数据库交互，并根据用户的请求渲染内容。某些组件是 JSP（JavaServer
    Pages）、JavaBeans 和 servlet。开发 Web 应用程序所需的许多任务可能是重复的，或者需要大量的模板代码。可以使用 Web 框架来消除常见开发活动中的开销，例如，许多框架包含了有库，可以帮助页面模板、会话管理并通常促进代码复用。


    什么是 Java EE？

    Java 企业（Java EE）是最广泛使用的平台之一，包含一系列协调技术，降低了服务器为中心的多层应用程序开发的复杂性和成本，使其更容易部署和管理。Java
    EE 基于 SE 为我们提供了一套完整的开发 API，帮助我们运行完全安全、可扩展、健壮可靠的服务器端应用程序。一些基本组件包括：

    - EJB（Enterprise JavaBeans）：用于封装应用程序逻辑的全托管服务器端架构。通过 EJB 技术，我们可以快速开发分布式、安全、以简化方式处理事务的
    Java 应用程序。

    - JPA（Java Persistence API）：为使用 Java 构建的应用内部的数据管理能力提供 ORM（对象关系映射）的框架。


    使用 JavaScript 开发 Ajax

    JavaScript 主要用于 Web 应用程序的客户端用户界面，是一种面向对象的语言。Ajax 代表异步 JavaScript 和 XML，这种技术允许
    Web 页面无需每次刷新即可进行更改。JavaScript 工具包可以轻松地将 Ajax 支持的组件及其功能实现到网页中。


    开发 Web 应用程序实践

    现在是时候进行实践了，因为这是构建 Web 应用程序的唯一真实方法。设置你的环境以便跟随。你需要的软件和资源有：

    - NetBeans IDE – v 7 以上，Java EE

    - Java Development Kit – v 7 以上

    - Glassfish Server Source Edition

    - Tomcat Servlet v 7 以上

    - Oracle Web Logic v 10 以上

    一旦你下载了所有内容，就可以按照本教程操作。设置你的项目：

    ```

    char ch = names[0];

    names[1] = ''A'';

    ```

    如果指定的负索引，Java 将创建一个异常并抛出它。该异常是：

    ```

    java.lang.ArrayIndexOutOfBoundsException

    ```

