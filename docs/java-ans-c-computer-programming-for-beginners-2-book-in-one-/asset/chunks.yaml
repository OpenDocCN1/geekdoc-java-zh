    \ will notice that it starts with `/*` but ends with `*/`. Additionally, if you\
    \ look at the previous image (figure 8) you will notice that there are comments\
    \ that begin with a single forward slash and two asterisks (`/**`) but end with\
    \ one asterisks and one forwards slash; this is called a Javadoc comment.\n\n\
    # Chapter 4: What is Java Virtual Machine?\n\n![Intelligenza Artificiale, Cervello,\
    \ Pensare, Controllo](image_rsrc3YF.jpg)\n\nA virtual machine is software that\
    \ emulates a physical machine. In traditional programming languages, code is compiled\
    \ into machine language for a specific platform. In Java, code is compiled into\
    \ a virtual machine language called `bytecode`. The `JVM` acts as an intermediary\
    \ between bytecode and the underlying physical machine. Every platform that supports\
    \ Java has its own implementation of the `JVM`. Java applications are portable\
    \ because every `JVM` adheres to a standard interface.\n\nThe distribution package\
    \ of the `JVM` and standard libraries is called the Java Runtime Environment (`JRE`).\
    \ The distribution package of the `JRE` and development tools, such as the compiler\
    \ and debugger, is called the Java Development Kit (`JDK`).\n\nGoing back to the\
    \ initial problem that we introduced earlier (i.e. making a compute `add 1 + 1`),\
    \ now we have a set of instructions (i.e. your algorithm) to solve the problem,\
    \ the next thing you need to do is to translate that into instructions that a\
    \ computer can understand. Remember that a computer doesn’t speak English or any\
    \ other human language. As it was explained earlier, you need to translate all\
    \ those instructions to a series of binary signals. But doing all that translation\
    \ work will take up a lot of your time. Remember that each character is composed\
    \ of at least 8 bits. After that you need to string them up into actual instructions\
    \ to access computer memory and then do a math operations etc.—in short it’s a\
    \ huge mess. No one wants to deal with that.\n\nSo, you speak a different language\
    \ and the computer speaks a different one. Well, how are you going to get both\
    \ parties to meet halfway? That is where programming languages like Java come\
    \ in. Think of a programming language as a go-between language that both computers\
    \ and also human beings can understand—well so to speak, we’ll clarify the details\
    \ behind that in a little bit.\n\nThe goal here is to make the computer understand\
    \ your instructions. There are two phases that will happen before you can accomplish\
    \ that. The first step is to write your algorithm using a programming language.\
    \ Yes, a go between language between you and the machine. Well, computers still\
    \ can’t completely understand all the stuff that you will write even though it\
    \ is already in Java code. And that is where step 2 comes in (2 steps remember?)—your\
    \ Java code will then be processed by a program called a `compiler`.\n\nAs it\
    \ was explained earlier when we covered the components of the Java platform, a\
    \ `compiler` is a program or app that translates your programming code into machine\
    \ readable instructions (aka instructions that your computer can understand).\
    \ There are actually a few more things that will happen in the background like\
    \ a pre-compiling step as well as accessing Java libraries (mentioned earlier),\
    \ then there is the actual translation into binary codes via an `assembler`, and\
    \ more lines of code added to your original code that you wrote. Again, all of\
    \ that happens in the background. As a Java programmer you shouldn’t worry about\
    \ that because the Java platform was developed to handle all of that. It’s fun\
    \ to know and maybe when your programming skills have leveled up then you can\
    \ go into the low level programming details yourself.\n\nNow there is one last\
    \ bit of preliminary info that you should know before we can dive right into writing\
    \ your Java programming code. And that is the Java Virtual Machine. There is a\
    \ recurring problem about the different types of hardware and software that are\
    \ available in different devices today. The hardware and software components of\
    \ a smart phone will behave differently compared to that of your car or maybe\
    \ your laptop. To make things more complicated, the combination of different processor\
    \ chips, different operating systems, and different arrays of electrical components\
    \ will mean different ways to compile (or translate) the code you have written.\
    \ You need to make machine code specific to the platform of the device that you\
    \ are programming.\n\n## So, what is the Java Virtual Machine or `JVM`?\n\nIt\
    \ is a program or application that is designed to run computer programs on any\
    \ device or machine. It was quite a revolutionary program when it was released\
    \ in 1995 and it is still a huge innovation today. It solved the dilemma that\
    \ was described earlier. Think of the `JVM` as a kind of virtual computer inside\
    \ your computer. It actually has two main functions.\n\nThe first one is to run\
    \ any program on any device and on any operating system or software. This is summarized\
    \ in the principle of “write once, run anywhere” – you’ll hear that a lot and\
    \ other programming rules of thumb as you gain more experience. The other function\
    \ is allocating memory space—and it is very good at managing a computer’s memory.\
    \ The `JVM` is loaded on a computer’s memory (`RAM`). It is independent, which\
    \ means it can run on any device that has support for Java—well, almost every\
    \ device supports Java today. It doesn’t produce code for each type of machine,\
    \ chip, and software combination out there. That is just impossible. And even\
    \ if you tried it would make Java way too large a system since you have to accommodate\
    \ every type of hardware, software, and operating system there is.\n\nSo, how\
    \ does the `JVM` do it? It produces its own unique code format called `bytecode`.\
    \ Take note that unlike other programming languages, when your Java source code\
    \ is compiled it isn’t directly translated or converted into machine readable\
    \ language—well, again because the goal is not to make a specific type of code\
    \ that can run on only one platform. The Java `bytecode` produced by a `compiler`\
    \ is a set of instructions that are in machine language. `Bytecode` will run on\
    \ any computer that has `JVM` installed in it. This also means that `JVM` runs\
    \ not just Java code and Java programs, it can also run programs written in other\
    \ languages as well—all that is needed is translated (aka compiled) into bytecode.\n\
    \n## Writing Your First Java Code\n\nBefore you can write and run any Java program\
    \ on your computer you need to install it first. To install the Java Runtime Environment\
    \ (`JRE`) (i.e. the entire Java system with `JVM`, the Java libraries, and all\
    \ the other files), you need to go to the official Oracle website by [clicking\
    \ here](https://www.oracle.com/java/javase/index.html). Instructions on how to\
    \ download `JRE` will be provided in those pages as well. Some of the instructions\
    \ will include disabling your firewall and what to expect. Now, your computer\
    \ might prompt you that don’t have Java (the system that runs Java programs) installed\
    \ on your computer, then you can download it by [clicking here](https://www.oracle.com/java/help/download.xml).\
    \ Note: `JRE` is what you need to write Java programs, but your computer will\
    \ need to install the actual Java system so that it can run Java programs. If\
    \ for some reason those links don’t work or you are taken to a different page,\
    \ then just Google “JRE download” and then click on the link that has [www.oracle.com](http://www.oracle.com)\
    \ on it.\n\n### Required Tools\n\nFor now all you need is a text editor to write\
    \ your first Java program. You can use any text editor that comes with your system\
    \ (e.g. `Notepad` if you’re using Windows). You can also use `Notepad++` if you\
    \ want something that has more programming support. However, if you want to develop\
    \ applications, test your programming code, and have tools that will make programming\
    \ in Java a lot easier, then you will need a program called an `IDE`, which stands\
    \ for integrated development environment. IDE is an app that comes with pretty\
    \ much all the facilities and tools a programmer needs. Your Java code is usually\
    \ saved as a `.java` file. A `compiler` will then process that file and return\
    \ a `.class` file, which is a file that you can run to test how your Java code\
    \ works.\n\n### IDE Features\n\nAn `IDE` usually comes with features like autocomplete\
    \ and text highlighting. It can also be used in the building of executable files.\n\
    \n### DEBUGGING\n\nDebugging is another important feature of `IDEs`. Debugging\
    \ refers to location and removal of programming errors on your Java source code.\
    \ No one expects you to be perfect but programming errors will prevent your code\
    \ from running. `IDEs` have debugging tools to help you spot the errors quickly\
    \ so that you can edit them ASAP.\n\n## Best IDEs for Java Programming\n\nThere\
    \ are numerous `IDEs` that you can use for Java programming. We can’t hope to\
    \ name them all so we’ll just go over the top 3 `IDEs`.\n\n1. **NetBeans**: `NetBeans`\
    \ was first released back in 1997 and it can run on different operating systems\
    \ like Windows, Solaris, Mac OS, and Linux. NetBeans is actually the official\
    \ `IDE` for Java 8. Just like Java, NetBeans is open source – that means it is\
    \ free to download and use. It features semantic and syntactic highlighting. It\
    \ also allows you to refactor your source code (i.e. rewriting code making it\
    \ more efficient without actually any programming problems). Refactoring is done\
    \ either to improve the performance of a program or to update it to the latest\
    \ standards. In other words you are giving an old program an upgrade or update.\n\
    2. **IntelliJ IDEA**: `IntelliJ IDEA` was first released back in January of 2001.\
    \ It runs on Windows, Mac OS, and Linux. This `IDE` comes in 2 different editions.\
    \ The first one is the proprietary aka the commercial version (i.e. the one you\
    \ have to pay for) and the other one is the Apache 2 Licensed edition. This is\
    \ the `IDE` for really serious programmers—we suggest that you use this integrated\
    \ development environment after you have gained a lot of experience programming\
    \ in Java. You can call this the deep dive `IDE`. Two of the unique and powerful\
    \ features of `IntelliJ IDEA` include flow analysis and cross language refactoring.\
    \ It also provides support for other `JVM` based languages—yes there are other\
    \ programming languages that also use `JVM`.\n3. **Eclipse**: `Eclipse` is another\
    \ advanced integrated development environment. In fact, this one is solely dedicated\
    \ and specialized for the development of Java programs. Well, it also supports\
    \ other programming languages as well, which makes it a very powerful tool. In\
    \ case you have reached the point of being able to combine different programs\
    \ written in different programming languages then you might want to consider getting\
    \ this `IDE`. If you are a beginner then that will be some time in the future.\
    \ Now there are two versions of `Eclipse`. There is a cloud version of this `IDE`\
    \ which is called `Eclipse Che` and there is the good old desktop version, which\
    \ you can download on your computer. Both of these versions come with an entire\
    \ suite of tools, apps, and plugins that make programming work a whole lot easier.\
    \ It even comes with its own custom `compiler`. This `IDE` is loaded with a lot\
    \ of useful features. For instance, if you want to focus on developing plugins\
    \ for programs that have already been written, `Eclipse` has a Plugin Environment.\
    \ It has all the tools you need to create and improve plugins.\n\n# Chapter 5:\
    \ Basic structure of a Java Program\n\n![Bordo, Elettronica, Calcolatore, Ingegner\
    \ Elettrica](image_rsrc3YG.jpg)\n\n### Package\n\nOn the first line, we have the\
    \ statement `package helloworld;`. This statement tells the compiler that the\
    \ Java file we belongs to `helloworld` package. A `package` is simply a grouping\
    \ of related classes and interfaces. When we write `package helloworld;` at the\
    \ top of our file, we are asking the compiler to include this file in `helloworld`\
    \ package. The compiler will then create a folder named `helloworld` and save\
    \ the file into that folder. Files that belong to the same package are stored\
    \ in the same folder. If you navigate to your `NetBeansProjects` folder you’ll\
    \ find a folder named `HelloWorld`. The `HelloWorldProject` folder is normally\
    \ located in your `Documents` folder. If you can’t find this folder try searching\
    \ for it using your computer’s search function. Within the `HelloWorld` folder\
    \ you’ll find a `src` folder that contains the `helloworld` folder. In addition\
    \ to packages created by us, Java also comes with a large number of pre-created\
    \ packages that we can use in our programs. For instance, code for input and output\
    \ is bundled in the `java.io` package while code for implementing components of\
    \ a graphical interface (like buttons, menus, etc) is bundled in the `java.awt`\
    \ package. To use these pre-written packages, we need to import them into our\
    \ programs. We’ll learn how to do that at a later time.\n\n### The main() Method\n\
    \nThe `main()` method is the entry point of all Java applications. Whenever a\
    \ Java application is started, the `main()` method is the first method to be called.\
    \ Notice the words `String[] args` inside the parenthesis of our `main()` method?\
    \ This means the `main()` method can take in an array of strings as input. In\
    \ our example, the `main()` method contains two lines of code. The first line\
    \ `//Print the words Hello World on the screen` is known as a comment and is ignored\
    \ by the compiler.\n\n# Chapter 6: Code structure of Java\n\nIn the figure, you\
    \ should notice the package name comes first. Additionally, you should note that\
    \ a semicolon is what ends the line. The semicolon is important and if you omit\
    \ it the program will not compile.\n\n```java\npackage firstproject;\n```\n\n\
    Next is the class name\n```java\npublic class FirstProject {}\n```\n\nYou can\
    \ use the left curly bracket at the start of a code, and use the right curly bracket\
    \ to end the code `{curly code segment}` you should however note that anything\
    \ that goes inside the left and right curly is part of the said code segment.\
    \ Additionally, anything inside both the left and right curly for the class is\
    \ in fact, a code segment. Here is what I mean:\n\n```java\npublic static void\
    \ main ( String[] args ) {}\n```\n\nMore important than anything else is the word\
    \ `main`. Why? Because each time any Java program boots up, it first looks for\
    \ the method bearing the name `main`. Simply put, a method is a piece of code.\
    \ The program then executes codes within the curly as part of the main. There\
    \ are possibilities that you will get an error message within the Java program\
    \ if your code does not have a `main` method. However, since this is the main\
    \ entry point for your program, there is little chance you will omit it. The `public`\
    \ part of the code (the blue part) simply means that the method is viewable outside\
    \ that class. On the other hand, `static` means that the creation of a new object\
    \ is not necessary while `void` means that there is not returnable value and the\
    \ command gets on with it.\n\n## How to download and install Java on Linux, Windows\
    \ and Mac\n\nCheck out the figure below. ![Description: 00010.jpeg](image_rsrc3YH.jpg)\n\
    Figure 10\n\nIn the NetBeans tool bar, you will notice a “green play” arrow; you\
    \ can use this to run a program. ![Description: 00011.jpeg](image_rsrc3YJ.jpg)\n\
    Figure 11\n\nYou can also run a program by navigating to your projects window.\
    \ This is especially effective in ensuring that the correct source code is running.\
    \ To do this, you need to click on your java source file contained in the project\
    \ window and then right click for options. Execute the run command. See figure\
    \ below. ![Description: 00012.jpeg](image_rsrc3YK.jpg)\nFigure 12\n\nIf you use\
    \ any of the program execution methods above on our code so far, you should get\
    \ something similar to figure13 below on the output window! ![Description: 00013.jpeg](image_rsrc3YM.jpg)\n\
    Figure 13\n\nIn figure 13 above, you can see that the first line is the run command.\
    \ The second is our code `My First Project`. If there is something you are not\
    \ sure of and like to run the code again you can simply press the green arrows\
    \ visible on figure 13.\n\n# Chapter 7: Data Types and Variables\n\n![Hacker,\
    \ Attacco, Maschera, Internet, Binario](image_rsrc3YN.jpg)\n\nOf course, one of\
    \ the key reasons to use Java is its focus on Object-oriented programming. Object\
    \ oriented programming, or `OOP` is a type of programming language which allows\
    \ the program’s code to be organized around data rather than functions which is\
    \ known as procedural programming. These `data clusters` are organized into things\
    \ called `objects`, hence the moniker of object oriented programming. These objects\
    \ are created by something called `classes`, understood here in the sense that\
    \ classes are types of objects. The attributes of a `class` are the raw data that\
    \ will create the object: these are its descriptors, such as the values it possesses.\
    \ The second criterion is the `method` of the object. This `method` is the behavior\
    \ or logical sequences contained within the class describing how it interacts\
    \ or can be interacted with. To make this clearer, say there is a class `Human`.\
    \ This `class` will have attributes such as height, gender, and race. The `human`\
    \ class can also have methods such as `run`, `walk`, and `talk`. These components\
    \ make up the `human` class. Now that the class has been defined, the programmer,\
    \ if they wish, can create an object using the `human` class as a blueprint. They\
    \ can invoke the class `Human` and `populate` its attributes giving it a specific\
    \ height, gender, and race. In addition, the object already has built-in functions\
    \ such as `run`, `walk`, and `talk`, so upon the creation of an object let’s say\
    \ named `Mike` from the `Human` class, it already contains the functions to run,\
    \ walk, and talk without need for the programmer to code those functions again,\
    \ as they are inherent in the created object.\n\nIn a nutshell, that is what Object\
    \ oriented programming is meant to be: a way of programming that allows the programmer\
    \ to draw on pre-defined classes so that it will be easier to describe and use\
    \ their internal functions to operate them. Assuming the reader is not a total\
    \ newbie and has been introduced to the world of programming using C or another\
    \ procedural heavy language, the next logical question would be: why use object\
    \ oriented programming? Well one of its main advantages is that in the long run\
    \ it saves time. Procedural programming is usually much quicker and more straightforward\
    \ in simpler algorithms and programs; rather than having to construct and define\
    \ a class and create an object based on that class, the programmer really has\
    \ to do is simply declare the necessary variables and write the functions and\
    \ create the algorithm in order to solve the problem they need the code to address.\
    \ However when it comes to more complex programs needing more complex solutions\
    \ this is where object oriented programming begins to shine and this is where\
    \ it starts to show its strength. In a lot of programs there will be times that\
    \ there will be a number of `objects` or data clusters that have to be grouped\
    \ together and the programmer will be treating in a certain way. This is what\
    \ `classes` are meant to address. Instead of declaring a new set of variables\
    \ per data cluster they can simply draw on a pre made `class` and create a new\
    \ `object`. Let’s see how this would work in practice. If a programmer were to\
    \ code a chess game in procedural fashion then they would have to manually describe\
    \ each and every piece all sixteen pawns four bishops and four knights four rooks\
    \ two queens and two kings. In addition deion they will have to write the functions\
    \ that allow each piece to move in its own separate way. However if the programmer\
    \ makes use of object oriented programming, instead of having to code sixteen\
    \ pawns, four bishops, four knights, four rooks, two queens, two kings, they simply\
    \ have to code six classes: one class to describe each piece on the board. The\
    \ programmer can now simply include the movement functions within each class and\
    \ have the attributes describe their position: whether they’re white king’s pawn\
    \ or black queen’s pawn these are all things that can be inserted through the\
    \ `attributes` portion of the `pawn` class. Instead of thirty two clusters of\
    \ code the programmer only has to do six. Now it’s much easier, much shorter and\
    \ also much more elegant.\n\n### Java tokens\n\nJava tokens are the values that\
    \ are smaller than other integers. These numbers are going to fall between the\
    \ value of -32768 and 32767. The code that I have been using is not going to work\
    \ for `shorts`, instead I am going to need to use the `short` function so that\
    \ I can make that the values are going to fall between the set limitations. Large\
    \ values are going to be stored inside of a `double` value along with floating\
    \ point values. A `double` does not have to be used if I can use a floating point.\
    \ As I am storing a floating variable I am going to need to put a letter at the\
    \ end of my value amount. This value should be `f` because it is a floating point\
    \ number.\n\n### Keywords\n\nIn Java, the `Boolean` type refers to false or true\
    \ values. Java finds out if it is true or false using the reserved keywords. Therefore,\
    \ an expression `Boolean` type will assume one of these values. An example to\
    \ demonstrate include:\n\n```java\nif (b == true) {\n    System.out.println(\"\
    True\");\n}\n```\n"
