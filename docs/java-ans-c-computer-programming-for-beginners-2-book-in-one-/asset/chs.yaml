- "# Java 与 C 计算机编程初学者指南：二合一学习 Java 和 C 编程、基础与代码的实用初学者指南\n\n\n\n![](img/image_rsrc3YB.jpg)\n\
  \n\n\n\n\n这是一本由 Will Norton 编写的学习 Java 和 C 编程、基础和代码的初学者实用指南。\n\n\n\n## 引言\n\nJava\
  \ 的历史可以追溯到 1991 年，当时 Haughton、Mike Sheridan 和 James Gosling 想出一种最好用于数字电视开发的编程语言。然而，它被认为超于时代，因此他们基于\
  \ C 和 C++ 重新开发了它，使其更易使用。\n\n随着开发，Java 也产生了一些核心原则，这些：\n- 它具有可移植性——即可以在尽可能多的平台上运行；\n\
  - 它应该是安全且可靠的；\n- 人们应该尽可能地连接它，这意味着它对他们来说是熟悉的，尽管初看看起来很复杂，但迟早他们会理解；\n- 它应该是动态的，可以在线程中工作，并根据需要进行修改，并且它应该精确执行。\n\
  \n你可以看到，这些核心原则让人们可以享受使用而无需购买许多设备。1995 年，Sun Microsystems 最终发布了 Java 1.0——Java 的诞生，它具有极高的安全性，并且跨网络访问。多年来，发布了更多版本，自\
  \ 2006 年以来，Java 通过 GNU 通用许可可用——意味着它现在是一种开源编程语言。它的部分内容是私有的且免费提供的，这符合其核心原则。现在开始阅读这本书，你将很快学到\
  \ Java！\n\n## 第 1 章：什么是 Java？\n\nJava 是一种由 Sun Microsystems 构建的语言，后来被 Oracle 公司收购。它被设计为可以在支持\
  \ Java 的任何操作系统上运行。这就是该语言如此流行的原因，因为开发者只需要编写一次程序，就可以在任何操作系统上运行。世界上大多数应用程序是用 Java 编程语言构建的。大多数服务器端的业务逻辑也是基于\
  \ Java。\n\n在本书中，你将学习如何编写像上面的程序，还将学习让你能够开始编写的高级概念。以下是 Java 的一些设计目标：\n- 该语言旨在编写一次并在任何操作系统上运行。\n\
  - 该语言应该对许多工程原则提供支持。\n- 该语言旨在用于开发适用于分布式环境的软件。可移植性是一个重要因素。这就是为什么 Java 能够在 Windows、Linux\
  \ 和 MacOS 操作系统上运行的原因。国际化支持非常重要。Java 旨在用于编写托管和嵌入式系统的应用程序。\n\n接下来讨论其他设计目标：\n\n###\
  \ 1.1 强类型检查\n\n Java 是一种强类型语言。定义的每个变量都需要关联到一个数据类型。你现在不需要理解整个程序，但让我们快速看两行代码。\n\n\
  ```java\nint i=5;\n```\n在这里，我们定义了一个被称为变量的东西，用于存储值。可以存储的值取决于数据类型。在这个例子中，我们说 `i` 的类型是\
  \ `int` 或 Integer，这是一种数字数据。\n\n### 数组边界检查\n在运行时，Java 会检查数组是否具有所需数量的值。如果尝试访问数组边界之外的值，将抛出一个异常。你现在不需要理解整个程序，但让我们快速看以下代码。\n\
  \n```java\nint[] array1 = new int[2];\n```\n在这里我们声明了一个数组，它是一组整数值。`2` 的值意味着我们只能在数组中存储两个值。\n\
  \n```java\narray1[0] = 1;\narray1[1] = 2;\narray1[2] = 3;\n```\n通过这段代码我们可以看到我们正在向数组分配\
  \ 3 个值。当你运行这个程序时，你会得到错误，因为程序会发现数组已经超出了两个允许的最大边界。你将在运行时得到下面的错误。\n\n```\nException\
  \ in thread \"main\" java.lang.ArrayIndexOutOfBoundsException: 2\nat HelloWorld.main(HelloWorld.java:8)\n\
  ```\n\n## 第 2 章：为什么 Java 很重要？\n\n接下来，Java 的语法和特征类似于 C 和 C++ 等其他编程语言。如果你有任何之前的编程经验，你会发现学习\
  \ Java 是轻而易举。即使你对编程完全是新手，也可以放心，Java 被设计成一种相对容易学习的语言。大多数程序员发现学习 Java 比学习 C 或 C++\
  \ 更容易。\n\nJava 还被设计为与平台无关。正如前面提到的，Java 代码首先被编译成字节码，可以在任何带有 Java 虚拟机的机器上运行。因此，通过\
  \ Java，你可以编写一次代码并在任何你想运行的地方运行。\n\n\n\n\n\n### 运算符概述\n\n- 逻辑运算符\n- 位运算符\n- 关系运算符\n\
  - 算术运算符\n\n#### 基础概念\n\n与其他计算机语言一样，Java 定义了一系列额外的运算符列表，用于处理某些特定场景。在学习 Java 编程语言（或任何编程语言）时，在开始之前你必须理解五个基本概念。这五个基本概念包括：\n\
  \n1. 变量\n2. 数据结构\n3. 控制结构\n4. 语法\n5. 工具\n\n每个概念都将从初学者水平进行彻底解释，以确保能够理解。\n\n#### 分隔符\n\
  \n它们不适用于高级抽象：请注意，许多程序使用了低级结构，这些结构主要用于低级抽象。这些编程语言的常用方法是关注机器——如何让计算机执行某些操作，而不是这些功能如何帮助解决用户的问题。这些语言处理微小的细节，这已经超出了高级抽象的范围，而高级抽象是我们今天常见的方法。在低级抽象中，数据结构和算法是分开的，而在高级抽象中，它们被视为一个整体。\n\
  \n#### 字面量\n\n提到 Java 中的字面量时，我们指的是以人类可读的形式出现的固定值。我们可以说数字 `200` 是一个字面量。大多数情况下，字面量可以是常量。字面量在程序中很重要。事实上，大多数\
  \ Java 程序都使用字面量。我们在书中已经讨论的一些程序也使用了字面量。Java 中的字面量可以属于各种原始数据类型。\n\n每个字面量的显示方式由其类型决定。正如之前提到的，我们将字符常量括在单引号中，例如\
  \ `'c'` 和 `'%’`。我们定义整数字面量时不包含小数部分。例如，`12` 和 `-30` 是整数字面量。\n\n浮点字面量应该包含小数点加小数部分。`12.389`\
  \ 是浮点字面量。Java 还允许对浮点字面量使用科学计数法。整数字面量包含 `int` 值，可以使用 `short`、`byte` 和 `char` 变量来初始化它们。\n\
  \n### 注释\n\n当这种情况发生时，我们称为注释。在程序的运行阶段，注释是无关的。这意味着你可以使用注释功能来说明或解释你创建的代码想要实现的目标。你可以通过输入两个斜杠然后写注释来实现。\n\
  \n```java\n//在此处放置你的单行注释\n```\n\n你可以通过以下任一种方式拥有多行注释：\n\n```java\n//我们将把\n//注释分成两行\n\
  ```\n\n或者\n\n```java\n/*\n```\n\n\n\n此注释跨越了两行。如果你查看上面的注释，你会注意到它以 `/*` 开头并以 `*/`\
  \ 结尾。此外，如果你查看前一张图片（图 8），你会注意到有些注释以单个正斜杠和两个星号（`/**`）开头，以一个星号和一个正斜杠（`*/`结尾；这被称为 Javadoc\
  \ 注释。\n\n# 第 4 章：什么是 Java 虚拟机？\n\n![Intelligenza Artificiale, Cervello, Pensare,\
  \ Controllo](img/image_rsrc3YF.jpg)\n\n虚拟机是一种模拟物理机器软件。在传统的编程语言中，代码被编译为特定平台的机器语言。在\
  \ Java 中，代码被编译为一种称为 `bytecode` 的虚拟机语言。`JVM` 充当字节码和底层物理机器之间的中介。每个支持 Java 的平台都有其自己的\
  \ `JVM` 实现。Java 应用程序是可移植的，因为每个 `JVM` 都遵循一个标准接口。\n\n`JVM` 和标准库的发行包称为 Java 运行环境 (`JRE`)。`JRE`\
  \ 及其开发工具（如编译器和调试器）的发行包称为 Java 开发工具包 (`JDK`)。\n\n回到我们之前介绍的初始问题（即让计算 `add 1 + 1`），现在我们有一组指令（即你的算法）来解决这个问题，你接下来需要做的是将它们翻译成计算机可以理解的指令。记住，计算机不说英语或任何其他人类语言。正如之前解释过的，你需要将所有指令翻译成一系列二进制信号。但完成所有翻译工作将花费你大量的时间。记住，每个字符至少由\
  \ 8 位组成。之后，你还需要将它们串成实际的指令来访问计算机内存，然后进行数学运算等——简而言之，这是一个巨大的混乱。没有人想处理那些事情。\n\n所以，你说一种语言，而计算机说另一种语言。那么，你如何让双方在中间点会合呢？这就是\
  \ Java 这样的编程语言大显用场的地方。将编程语言想象成计算机和人类都能理解的中间语言——嗯，可以这么说，我们稍后会澄清背后的细节。\n\n这里的目标是让计算机理解你的指令。在实现这一点之前，会发生两个阶段。第一步是使用编程语言编写你的算法。是的，一种你和机器之间的中间语言。嗯，尽管已经是\
  \ Java 代码，计算机仍然无法完全理解你写的所有内容。这就是第 2 步之处（记住是两步）——你的 Java 代码将由一个名为 `compiler` 的程序进行处理。\n\
  \n正如我们在介绍 Java 平台组件时解释的那样，`compiler` 是一个将你的编程代码翻译成机器可读指令（即你的计算机可以理解的指令）的程序或应用程序。实际上，后台还会发生一些事情，例如预编译步骤以及访问\
  \ Java 库（之前提到的），然后通过 `assembler` 实际翻译成二进制代码，并向你写的原始代码中添加更多行代码。再次，这一切都是在后台发生的。作为一名\
  \ Java 程序员，你不应该担心这些，因为 Java 平台是为了处理所有这些内容而开发的。了解这些很有趣，也许当你的编程技能提高后，你就可以自己去研究底层编程细节了。\n\
  \n在我们直接开始编写 Java 编程代码之前，还有最后一点信息你需要了解。那就是 Java 虚拟机。关于今天不同设备中提供的不同硬件和软件，有一个反复出现的问题。手机的硬件软件组件的行为与你的汽车或笔记本电脑不同。更复杂的是，不同处理器芯片、不同操作系统和不同电气元件阵列的组合意味着编译（或翻译）你所编写代码的不同方式。你需要针对你正在编程的设备平台制作机器码。\n\
  \n## 那么，什么是 Java 虚拟机或 `JVM`？\n\n它是一个设计在任何设备或机器上运行计算机程序的程序或应用程序。它在 1995 年发布时是一个极具革命性的程序，直到今天它仍然是一个巨大的创新。它解决了之前描述的困境。将\
  \ `JVM` 想象成计算机内部的一种虚拟计算机。它实际上有两个主要功能。\n\n第一个是在任何设备、任何操作系统或软件上运行任何程序。这被总结为“编写一次，到处运行”的原则——随着经验的增加，你会听到很多这句话以及其他的编程准则。另一个功能是分配内存空间——它非常擅长管理计算机内存。`JVM`\
  \ 加载到计算机的内存（`RAM`）中。它是独立的，这意味着它可以运行在任何支持 Java 的设备上——嗯，今天几乎每个设备都支持 Java。它不会为现有的每种机器、芯片和软件组合生成代码。那是不可能的。即使你尝试，也会让\
  \ Java 变成一个庞大的系统，因为你必须适应所有类型的硬件、软件和操作系统。\n\n那么，`JVM` 是如何做到的？它产生自己独特的代码格式，称为 `bytecode`。注意，与其他编程语言不同，当你的\
  \ Java 源代码被编译时，它并不会直接翻译或转换为机器可读的语言——嗯，再次是因为目标不是创建一种只能在一个平台上运行的特定代码。由 `compiler`\
  \ 产生的 Java `bytecode` 是一组机器语言形式的指令。`Bytecode`将在任何安装了 `JVM` 的计算机上运行。这意味着 `JVM` 不仅运行\
  \ Java 代码和 Java 程序，它还可以运行用其他语言编写的程序——只需要将其翻译（即编译）成字节码即可。\n\n## 编写你的第一段 Java 代码\n\
  \n在可以在你的计算机上编写和运行任何 Java 程序之前，你需要先安装它。要安装 Java 运行环境 (`JRE`)（即包含 `JVM`、Java 库和所有其他文件的整个\
  \ Java 系统），你需要通过[点击此处](https://www.oracle.com/java/javase/index.html) 进入 Oracle\
  \ 官方网站。这些页面上还会提供如何下载 `JRE` 的说明。某些说明将包括禁用你的防火墙以及预期结果。现在，你的计算机可能会提示你电脑上没有安装 Java（运行\
  \ Java 程序的系统），然后你可以通过[点击此处](https://www.oracle.com/java/help/download.xml) 下载。注意：`JRE`\
  \ 是你编写 Java 程序所需的，但你的计算机可能会提示你电脑上没有安装 Java（运行 Java 程序的系统），你可以通过[点击此处](https://www.oracle.com/java/help/download.xml)\
  \ 下载。如果某些链接不起作用或你被带到了不同的页面，只需搜索“JRE download”并点击 [www.oracle.com](http://www.oracle.com)\
  \ 上的链接。\n\n### 必要的工具\n\n现在你需要一个文本编辑器来编写你的第一个 Java 程序。你可以使用系统自带的任何文本编辑器（例如，如果你使用的是\
  \ Windows，可以使用 `Notepad`）。如果你想要有更多编程支持，你也可以使用 `Notepad++`。然而，如果你想开发应用程序、测试编程代码并拥有让\
  \ Java 编程变得容易许多工具，你需要一个名为 `IDE` 的程序（集成开发环境）。IDE 是一个带有程序员所需的大部分设施和工具的应用程序。你的 Java\
  \ 代码通常保存为 `.java` 文件。`compiler` 将处理该文件并返回一个 `.class` 文件，这是一个你可以运行 Java 代码的文件。\n\n\
  ### IDE 功能\n\n`IDE` 通常带有自动补全和文本高亮功能。它还可以用于构建执行文件。\n\n### 调试 (DEBUGGING)\n\n调试是 `IDE`\
  \ 的另一个重要功能。调试指的是定位和移除 Java 代码中的错误。没有人期望你是完美的，但编程错误会阻止你的代码运行。`IDE` 具有调试工具帮助你快速发现错误以便你编辑它们。\n\
  \n## 最佳的 Java IDE\n\n有很多可以用于 Java 编程的 `IDE`。我们无法列出所有的，所以我们将介绍前三个 `IDE`。\n\n1. **NetBeans**：`NetBeans`\
  \ 发布于 1997 年，可以在 Windows、Solaris、Mac OS 和 Linux 等操作系统上运行。NetBeans 实际上是 Java 的官方\
  \ `IDE`。就像 Java 一样，NetBeans 是开源的这意味着这意味着免费下载和使用的。它具有语义和语法高亮功能。它还允许你重构源代码（即使其更高效而不产生任何编程问题）。重构是为了提高程序的性能或更新到最新标准。\n\
  2. **IntelliJ IDEA**：`IntelliJ IDEA` 发布于 2001 年 1 月。它运行在 Windows、Mac OS 和 Linux\
  \ 上。这个 `IDE` 有两个不同的版本。第一个是商业版（即你需要付费的版本），另一个是 Apache 许可版。这是为认真的程序员设计的 `IDE`——在你获得大量\
  \ Java 编程经验后，我们建议使用这个集成开发环境 `IDE`。`IntelliJ IDEA` 的独特且强大的功能包括流分析和跨语言重构。\n3. **Eclipse**：`Eclipse`\
  \ 是另一个集成开发环境。事实上，它是专门为 Java 程序的开发设计的。嗯，它也支持其他编程语言，使其成为一个非常强大的工具。如果你是一个初学者，那么以后你可能会考虑这个\
  \ `IDE`。现在有两个 `Eclipse` 版本：一个是云版本称为 `Eclipse Che`，另一个是可以在计算机上下载的桌面版本。这两个版本都带有一整套工具、应用程序和插件，让编程工作变得容易许多。它甚至带有自定义的\
  \ `compiler`。这个 `IDE` 包含了创建和改进插件所需。\n\n## 第 5 章：Java 程序的基本结构\n\n![Bordo, Elettronica,\
  \ Calcolatore, Ingegner Elettrica](img/image_rsrc3YG.jpg)\n\n#### 包 (Package)\n\n\
  在第一行，我们有语句 `package helloworld;`。这个语句告诉编译器 Java 文件属于 `helloworld` 包。`package` 只是类和接口的组合。当我们在文件顶部写\
  \ `package helloworld;` 时，我们要求编译器将此文件包含在 `helloworld` 包中。编译器将创建一个名为 `helloworld`\
  \ 的文件夹并将文件保存其中。属于同一个包的文件存储在同一个文件夹中。如果你导航到 `NetBeansProjects` 文件夹，你会找到一个名为 `HelloWorld`\
  \ 的文件夹。`HelloWorldProject` 文件夹通常位于你的 `Documents` 文件夹。如果你找不到这个文件夹，尝试使用计算机的搜索功能搜索它。在\
  \ `HelloWorld` 文件夹中，你会找到一个包含 `helloworld` 文件夹的 `src` 文件夹。除了我们创建的包，Java 还提供了许多我们可以使用的预创建包。例如，输入输出代码封装在\
  \ `java.io` 包中，而实现图形界面组件（如按钮、菜单等）的代码封装在 `java.awt` 包中。我们需要将这些包导入到程序中。我们以后会学习如何这样做。\n\
  \n#### main() 方法\n\n`main()` 方法是所有 Java 应用程序的入口。每当 Java 应用程序启动时，`main()` 方法都是第一个被调用的方法。注意我们\
  \ `main()` 方法括号内的 `String[] args` 单词？这意味着 `main()` 方法可以接受字符串数组作为输入。在我们的示例中，`main()`\
  \ 方法包含两行代码。第一行 `//Print the words Hello World on the screen` 被视为注释，会被编译器忽略。\n\n\
  ## 第 6 章：Java 代码结构\n\n在图中，你应该注意到包名在最。此外，你应该注意分号是结束行的行的符号。分号是重要的，如果你省略了它，程序将无法编译。\n\
  \n```java\npackage firstproject;\n```\n\n接下来是类名\n\n```java\npublic class FirstProject\
  \ {}\n```\n\n你可以在代码开始处使用左括号，并使用右括号结束代码 `{curly code segment}`。然而，你应该注意，左右括号内部的任何内容都是该代码段的一部分。此外，在左右括号内部的任何内容都是代码段。如下所示：\n\
  \n```java\npublic static void main ( String[] args )\n```\n\n比任何事情都重要的是单词 `main`。为什么？因为每当任何\
  \ Java 程序启动时，它首先寻找名为 `main` 的方法。简单来说，一个方法就是一段代码。程序随后执行大括号内的代码。如果你的代码中没有 `main` 方法，可能会得到错误消息。然而，由于这是你程序的入口点，即使你是完美的，编程错误也会阻止你的代码运行。由于这种原因，你可能会漏掉它。代码的\
  \ `public` 部分（即蓝色部分）意味着该方法在类之外是可见的。另一方面，`static` 意味着创建新对象是不必要的，而 `void` 意味着没有返回值，并且命令随之而来。\n\
