  \ 语句的其余部分放在大括号之间。\n\n## 第 14 章：Java GUI 编程\n假设读者不是编程的完全新手，并且已经通过 C 或或其他过程化倾向的语言进入了编程世界，那么下一个逻辑问题就是：为什么要使用面向对象编程呢？嗯，它的主要优势之一是从长远来看，它可以节省时间。\n\
  \n## 如何用 Java 构建一个小游戏\n在简单的算法和程序中，过程化编程通常更快、更直接；程序员不需要构造和定义一个 `class`，也不需要基于该 `class`\
  \ 创建一个 `object`，他们真正需要做的只是声明必要的变量并编写 `functions`，然后创建算法来解决代码需要处理的问题。\n\n然而，当涉及到更复杂的程序以及更复杂的解决方案时，这就是面向对象编程开始大放异彩并展现其其实实力的地方。在很多程序中，会有许多“对象”或数据簇必须分组在一起，并且程序员将以特定的方式处理它们。这正是“类”要解决的问题。程序员不需要为每个数据簇声明一组新变量，他们只需要调用预先定义的“类”并创建一个新的“对象”。让我们看看这在实践中是如何运作的。\n\
  \n每个棋子都有不同的移动方法，取决于它们是什么种棋子。如果程序员用过程化的方式编写象棋游戏，那么他们就必须手动描述每一个棋子：所有的 16 个兵、4 个主教、4\
  \ 个马、4 个车、两个皇后和两个国王。此外，他们必须编写 `functions` 让每个棋子都能以其独立的方式移动。\n\n然而，如果程序员利用面向对象编程，而不是需要编写\
  \ 16 个兵、4 个主教、4 个马、4 个车、两个皇后、两个国王，他们只需要编写六个 `classes`：每个类描述棋盘一个棋子。程序员现在可以简单地将移动函数包含在每个类中，并用属性描述它们的位置：它们是白王兵还是黑后兵，这些都是通过“兵”类的“属性”部分插入的内容。程序员不需要写\
  \ 32 组代码，只需要写 6 组。现在这变得容易得多、简短得多，而且更加优雅。\n\n## 第 15 章：面向对象编程\n![Lavoro, Digitando,\
  \ Computer, Notebook, Programmazione](img/image_rsrc3YY.jpg)\n我们现在不会处理面向对象编程的所有复杂编码。我们只需要处理核心的原始概念：类和对象。为了理解这些，我们必须首先讨论类。这会让我们之前说的某些内容——比如对象包装器——更有意义。\n\
  \n### 什么是类？\n类的实用性源于：有时你需要的比代码自动提供的更复杂的结构。\n\n\n\n\n你已经熟悉了前两个——`public` 和 `private`。当变量被声明为\
  \ `public` 时，它可以出现在你编写的程序的任何地方。相比之下，当它被声明为 `private` 时，它在实例化它的类体之外的任何地方都无法可见或访问。\n\
  \n让我们来看另外两个访问控制修饰符。列表中的下一个是 `protected` —— 这在你想创建库（libs）时非常有用。当一个变量是 `protected`\
  \ 时，意味着它在实例化该 Java 构造的包内是的——注意，这也包含了所有的子类。另一方面，`default` 访问控制修饰符在未指定其他三个修饰符时被使用。在这种模式下，变量可以在程序员实例化它的包或类中被访问。但是，请注意，该变量仅在类的主体内是可用的，而在它的子类中是不可用的。\n\
  \n注意，你也可以在方法内部创建对象，通常规则适用——对象或变量只能在创建它的方法体内被访问。关于你在方法内部创建的变量，还有另一个你应该记住的重要点——它只能指定一个关键字：`final`。你将被允许在方法体内部创建默认的、`protected`、`public`\
  \ 甚至 `private` 变量。这基本上就是信息在代码中隐藏的方式，如果你观察的话，这有助于数据抽象和封装。\n\n### 封装？信息隐藏？它们之间有什么区别？\n\
  \n\n\n乍一看，封装与数据或信息隐藏可能看起来一样，但这两个术语之间确实存在细微的。现在，Nat Pryce 和 Steve Freeman 对这两个术语做出了非常准确的区分，尽管你可能从其他作者那里看到他们交叉使用这些术语。我们在这里使用\
  \ Freeman 和 Pryce 的描述来区分 Java 编程中这两个概念的区别。\n\n让我们从信息隐藏开始，因为这是我们上次停下的地方。你已经可以判断出“信息隐藏”意味着什么了。它仅仅意味着信息被隐藏了。程序执行的实际函数和过程被隐藏了。但是，为了什么目的？为什么要将内部运行机制对程序员隐藏？忽略低层细节是为了让你（作为程序员）能够专注于更重要的事情。这也是为什么在\
  \ Java 中要抽象数据。你可以创建类、对象以及程序的其他元素；你甚至可以将对象从一个程序导入到另一个程序，而无需担心该对象如何实现其功能的细节。\n\n这就像开车。你只需要知道，当你把钥匙插入锁孔并启动汽车时，它就会启动。你不需要担心是什么让它启动的、下面的线路是如何连接的、汽油去哪里、引擎如何燃烧汽油等。你只需要担心启动汽车并安全驾驶。\n\
  \n另一方面，封装允许用户控制对象对类其他部分影响的变化量。“封装”一词意味着将所有内容封闭在一个单一的单元中。这意味着根据 Java 编程系统的设计方式，一个独立单元到另一个单元之间不会有预期的依赖。记住，Java\
  \ 编程环境中的对象应该是独立的，并且没有全局变量可以引用。\n\n### 抽象\n\n抽象简单指的是隐藏对象不必要的细节并只显示相关的细节。另一方面，封装简单意味着将对象的状态和方法绑定在一起。这种绑定最终创建了所谓的“类”（我们稍后会介绍）。最后，消息传递指的是对象与其他对象进行交互的能力。\n\
  \n另一方面，高级编程语言具有更高层次的抽象，这意味着代码在计算机能够使用它之前，会通过一个名为编译器的程序（编译器充当计算机的翻译员）。这种抽象水平通常到了编程语言已经具有类似于英语（一种全球语言）的语法的程度。编译器充当高级语言与机器之间的翻译员。这允许程序员以更自然的方式编写程序，因为它允许编码者使用更“自然”的语言，而高级语言允许某些功能实现自动化，使编码者的生活变得简单得多。然而，这里的权衡是代码必须经过编译器，这会导致程序运行和执行时间更长，而且与低级语言相比，计算机通常会消耗更多内存。这些高级语言中，包含了广为人知的语言，如\
  \ Python、C++ 以及我们今天的话题 Java。\n\n## 第 16 章：Java 面试题\n\n### Java 编程语言\n* 什么是 `WORA`\
