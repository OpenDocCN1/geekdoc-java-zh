  \n### 绝对文件名（Absolute filename）\n绝对文件名是带有从文件系统根提供的完整路径的文件，例如 `c:\\Java\\bin\\javac.exe`。\n\
  \n### 抽象（Abstraction）\n抽象是对复杂情况的简单表示。从基本角度说，抽象隐藏了代码或程序的运行方式，只显示其功能。面向对象的设计通常围绕在建模现实对象时寻找合适的抽象级别。抽象过高会导致捕捉的信息不足；抽象过低则会导致程序创建变得复杂且难以理解其应当的状态。\n\
  \n### 抽象方法（Abstract method）\n抽象方法是头部包含保留关键字 `abstract` 的方法。抽象方法没有方法体。在接口（interface）内部设计的任何方法都被认为是抽象的，无例外。抽象方法的体定义在抽象类（abstract\
  \ class）子类中，或者如果一个类实现了该接口，则定义在该类中。\n\n### 抽象窗口工具包（Abstract Windowing Toolkit）\n\
  AWT 或 Abstract Windowing Toolkit 包含一组类，旨在让带有 GUI（图形用户界面）的应用程序更加简单。你将在 `java.awt`\
  \ 包组找到它们，包含的类有按钮、窗口、框架、文本区域等。\n\n### 访问方法（Accessor method）\n访问方法是专门设计用于访问类私有属性的方法。根据\
  \ Java 习惯，访问方法以 `get` 前缀，然后是属性名。例如，为了访问名为 `speed` 的属性，访问方法将是 `getSpeed()`。当属性被设置为\
  \ `private` 时，它在不使用修改器方法（mutator method）的情况下阻止外部类修改该值。我们可以使用访问方法对私有属性值提供特定访问，并阻止其他类的其他对象访问该私有属性——访问方法需要正确的可见性来实现这一点。\n\
  \n### 参与者（Actor）\n见客户端（client）。\n\n### 实参（Actual argument）\n这是从方法外部传递到方法内部参数的值。当方法被调用时，值（实参）将复制到对应的形式参数（formal\
  \ arguments）中。\n\n### 实参数（Actual parameter）\n见实参（actual argument）。\n\n### 地址空间（Address\
  \ space）\n这是程序运行的内存区域。\n\n### 代理（Agent）\n见服务器（server）。\n\n### 聚合（Aggregation）\n\
  这是一种 OOP 概念，其中一个对象由至少一个从属对象构成状态。这些从属对象在对象之外独立存在。当对象不再被使用而销毁时，从属对象也随之消失。聚合也被称为“拥有”（HAS-A）关系，这区别于继承的“是”（IS-A）关系。\n\
  \n### 别名（Aliases）\n别名是对一个对象的多个引用。任何对状态的变化都会被别名捕捉。\n\n### 匿名数组（Anonymous array）\n\
  匿名数组是一个没有标识符的数组，例如：\n```java\ny = new int[]{10, 8, 9, 5, 3, 2, 0};\n```\n数组初始化器用于初始化数组。\n\
  \n### 匿名类（Anonymous class）\n匿名类是一个没有类名的类，通常是作为方法的实现。例如：\n```java\nButton.addActionListener(new\
  \ ActionListener(){\n    public void actionPerformed(ActionEvent e){\n        System.exit(0);\n\
  \    }\n});\n```\n\n\n\n\n\n# 第一章：什么是 C 语言？\n\n![Tecnologia, Intelligenza Artificiale,\
  \ Cervello, Pensare](img/image_rsrc3YZ.jpg) \n\n这本书是对 C 语言的全面介绍，并配有深入示例。人们经常误认为，随着\
  \ `Java` 和 `Python` 等现代编程语言的出现，C 语言已经丧失了它的流行性。然而，许多初学者并不理解，C 语言仍然被广泛用于开发编译器和操作系统。在\
  \ C 语言中使用的许多高级编程概念仍然被认为是为了更好地理解编程的途径。本章将详细介绍 C 语言的各种重要特性。我们建议你使用自己选择的操作系统来尝试书中介绍的程序。让我们开始吧！\n\
  \n## C 语言的历史\n在开始讨论一种编程语言的具体组件、原理和哲学之前，讨论它的历史是必不可少的。20 世纪 70 年代，当编程行业还很小，且有效的编程语言寥寥无几时，丹尼斯·里奇（Denis\
  \ Ritchie）在贝尔实验室发明了 C 语言。他开发 C 语言是为了开发贝尔实验室正试图构建的 `UNIX` 操作系统。`UNIX` 系统的几乎所有组件都是使用\
  \ C 编程语言广泛编写的。许多图形用户功能也是在 C 语言的帮助下实现的。\n\n幸运的是，`UNIX` 在技术领域变得非常流行，并为 C 语言带来了必要的普及度。随着\
  \ C 语言的最初成功，丹尼斯·里奇和贝尔实验室开始在不同的操作系统中分发 C 语言。过去配备 C 语言的著名操作系统之一是 IBM PC。许多与计算机相关的行业在开发\
  \ C 编程应用程序时开始实现自己的代码。因此，在很短的时间内，C 语言已经演变为最流行的中间级语言之一。\n\n即使在发明 50 年后，C 语言仍然被认为是世界上见过的最重要的中间级语言之一。它仍然被广泛用于开发系统编程应用程序，以及处理机器人和电动汽车等硬件设备的人工智能应用程序。\n\
  \n### 为什么它如此特别？\n首先，要理解 C 语言被认为不适合开发现代 Web 和移动端应用程序。有诸如 `Java`、`Php` 等现代编程语言可以实现这一目的。C\
  \ 语言编程专门用于现实世界的系统应用，在这些应用中，我们需要从底层与硬件进行工作。现代编程语言对于此类实现提供的库非常少，且程序结构实际上非常糟糕，导致它们几乎无法与硬件的低层组件进行有效交互。而\
  \ C 由于其遵循的语法结构和程序处理流，可以非常有效地与硬件组件进行交互。这就是为什么 C 语言仍然被认为是创建新操作系统和编译器的最佳选择的原因。\n\n\
  ## C 语言的特性\n尽管 C 语言处理底层硬件资源，但它通常被认为是一门中间级语言，因为它集成了各种高级编程语言的能力，例如整洁的语法和组织结构。C 语言也因此广为人知，是因为它被用作哈佛、斯坦福、普林斯顿等大学的入门级教学资源。在\
  \ C 语言开发的初始阶段，由于许多公司创建了可以添加到语言中的不同库和功能，程序员很难为该语言开发系统性的更新。由于由于原因，国际标准组织 (`ISO`）开始为\
  \ C 编程语言宣布单个库函数。建议所有程序员使用相应的格式以获得更好的结果。你可以从 C 语言官方网站获取最新的指南。\n\n以下是 C 语言的一些基本特性：\n\
  \n1. **可移植性**：C 语言被认为具有极强的可移植性，可以在任何操作系统中执行。以前，它被开发为在 `MS-DOS` 系统上运行。但随着 Windows、Mac\
  \ 和 Linux 操作系统的爆发，C 语言扩展了支持不同操作系统的能力。许多第三方软件开发者也开发了数十种编译器来有效运行 C 语言程序。\n2. **轻量**：C\
  \ 语言通常被认为比今天占据主流行业的高级语言更轻量。即使是 C 语言的继承者 `C++` 实现的代码行也比 C 多。C 的轻量级特性的原因在于其有效的语法原理。许多现代编程语言如\
  \ `Java`、`Scala` 被强制使用复杂的模板代码语法来在各种平台上运行应用程序。而 C 使用简单且严格的语法，这使得该语言成为一个轻量级的编程实体。\n\
  3. **函数式编程**：C 与其他高级语言最重要的区别在于它支持函数式编程。它使用过程以重复模式完成任务。其他高级语言使用面向对象的范式来实现软件中的不同功能。函数式编程通常被认为开发系统级应用是有效的。然而，通过最新的更新，我们也可以在\
  \ C 语言中实现面向对象的范式。经过彻底检查后，我们对 C 语言提供的面向对象编程功能并不完全满意。如果你热于开发面向对象范式的应用，我们建议你学习 `Python`\
