  \ Maschera, Internet](img/image_rsrc3YN.jpg)\n\nJava token 是比其他整数小的值。这些数字将落在 -32768\
  \ 到 32767 的值之间。我一直使用的代码不适用于 `shorts`，相反，我将需要使用 `short` 函数，以确保值落在设定的限制范围内。大值将存储在\
  \ `double` 值中，并与浮点值一起。如果我可以使用浮点数，则不需要使用 `double`。当我存储一个浮点变量时，我需要在数值的末尾加上一个字母。这个值应该是\
  \ `f`，因为它是一个浮点数。\n\n简而言之，这就是面向对象编程的意义：一种编程方式，允许程序员使用预定义的类，以便更容易描述和使用它们的内部函数。当然，使用\
  \ Java 的主要原因之一是专注于面向对象编程。面向对象编程（或 `OOP`）是一种编程语言，允许程序的代码围绕数据而不是函数组织，这被称为过程化编程。这些数据被组织成被称为\
  \ `objects` 的东西，因此被称为面向对象编程。对象是由 `classes` 创建的。与其为每个数据簇声明一组变量，他们只需要使用预制好的 `class`\
  \ 并创建一个新的 `object`。`class` 的属性是原始数据，这些是它拥有的描述符。第二个标准是对象的 `method`。这种 `method` 是类内部描述如何交互的逻辑序列。为了更清楚，假设有一个\
  \ `Human` 类。这个 `class` 将具有身高、性别等属性。`human` 类还可以有 `run`、`walk` 和 `talk` 等方法。这些组件构成了\
  \ `human` 类。现在类已经定义了，程序员如果愿意，可以使用 `human` 类作为蓝图创建一个对象，并赋予特定的身高、性别和种类。调用 `Human`\
  \ 类。\n\n### Java token\n\nJava token 是比其他整数小的值。这些数字将落在 -32768 到 32767 的值之间。我一直使用的代码不适用于\
  \ `shorts`，相反，我将需要使用 `short` 函数，以确保值落在设定的限制范围内。大值将存储在 `double` 值中，并与浮点值一起。如果我可以使用浮点数，则不需要使用\
  \ `double`。当我存储一个浮点变量时，我需要在数值的末尾加上一个字母。这个值应该是 `f`，因为它是一个浮点数。\n\n\n\n\n### 运算符概述\n\
  \n* 逻辑运算符\n* 位运算运算符\n* 关系运算符\n* 算术运算符\n\n与其他计算机语言一样，Java 拥有一组定义的额外运算符，用于处理某些特定场景。在学习\
  \ Java 编程语言（或任何编程语言）时，在开始之前必须理解五个基本概念。这五个基本概念包括：\n\n1. 变量\n2. 数据结构\n3. 控制结构\n4.\
  \ 语法\n5. 工具\n\n每一个概念都将以初学者水平进行彻底解释，以确保它们被理解。\n\n#### 分隔符\n\n它们不适用于高层抽象：请注意，许多程序使用了低级构建结构，这些构建结构主要用于低级抽象。这些编程语言的常用方法是关注机器的——如何让计算机执行某些操作，而不是这些功能如何帮助解决用户的问题。这些语言处理的是微的细节，这已经超出了高层抽象的范围，而这是我们今天看到的更常见的方法。在低级抽象中，数据结构和算法是分开的，而在高层抽象中，它们被视为一个整体。\n\
  \n#### 字面量\n\n涉及到 Java 中的字面量时，我们指的是以人类可读的形式出现的固定值。我们可以说数字 `200` 是一个字面量。大多数时候，字面量可以是常量。字面量在程序中很重要。事实上，大多数\
  \ Java 程序都使用字面量。我们在书中已经讨论的一些程序使用了字面量。Java 中的字面量可以属于各种原始数据类型。\n\n每个字面量的显示方式由其类型决定。正如之前提到的，我们用单引号括字符常量，例如\
  \ `'c'` 和 `'%'`。我们定义的整数字面量不涉及小数部分。例如，`12` 和 `-30` 是整数字面量。浮点字面量应该包含小数点加小数部分。`12.389`\
  \ 是浮点字面量。Java 还允许对浮点字面量使用科学计数法。整数字面量包含 `int` 值，任何人都可以用 `short`、`byte` 和 `char` 变量对其进行初始化。\n\
  \n### 注释\n\n当这种情况发生时，我们称之为注释。在程序的运行阶段，注释是无关紧要的。这意味着你可以使用注释功能来说明或解释你正在创建的代码想要什么。你可以通过输入两个斜杠后跟注释来实现。这是一个示例：\n\
  \n```\n//在此处放置你的单行注释\n```\n\n你可以通过以下任一方式拥有多行注释：\n\n```java\n// 我们将把\n// 注释分成两行\n\
  ```\n\n或者\n\n```java\n/*\n多行注释\n*/\n```\n\n\n\n\n\n此注释跨越了两行。*/如果你查看上面的注释，你会注意到它以\
  \ `/*` 开头，以 `*/` 结尾。此外，如果你查看前一张图片（图 8），你会注意到有些注释以单个正斜杠和两个星号（`/**`）开头，但以一个星号和一个正斜杠结束；这被称为\
  \ Javadoc 注释。\n\n#### 什么是变量（Variables）\n另一方面，变量是一个包含特定数据类型及其被赋值或接收的值的“对象”。它之所以被称为变量，是因为其中包含的值可以根据它在代码中的用法、程序员如何声明其值，甚至程序用户选择如何与其进行交互而发生变化。简而言之，变量是数据类型的存储单元。访问变量允许程序员方便地标记并调用手头现的存储值。\n\
  \n#### Java 中变量的类型\nJava 要求程序员使用声明语句，即用于声明变量并通过指定特定数据类型和名称来定义它们的代码行。Java 有一种处理变量的特殊方式，即将变量定义为包含特定类型和数值信息的容器，这与\
  \ Python 等某些语言不同，Python 只需要声明变量，变量就可以动态更改其类型；Java 变量是静态的，一旦声明，就会保留其类型。\n\n```\n\
  Int number = 20;\nBoolean completed = true;\nString hello = “Hello World!\";\n```\n\
  \n声明的语法在之前的示例中可见，变量类型在前，然后是变量名，最后是值。同样注意，声明语句可以在一行中由多个声明，如下例所示：\n\n```\nInt number\
  \ = 20, Boolean completed = true, string hello = “Hello World!”;\n```\n\nJava 变量可以在开始时不赋任何值进行声明；在这些情况下，Java\
  \ 选择用特定的默认值声明这些变量，例如：\n\n```\nByte a;\nShort num;\nBoolean answer;\n```\n\n结果将分别产生值\
  \ 0、0 和 false。更完整的默认值列表如下：`byte`、`short`、`int` 和 `long` 数据类型都将产生默认值 0，而 `float`\
  \ 和 `double` 数据类型将具有默认值 0.0，`char` 数据类型将产生 ‘u\\00000’值，`string` 或任何其他对象将具有 null\
  \ 默认值，所有 `Boolean` 都将以 false 默认值开始。在 Java 中，变量在声明时是静态的，这意味着程序员必须定义变量将包含的数据类型。为了说明，如果我们想使用变量\
  \ `num` 来存储一个数字，我们必须先声明变量：`int num ` ，然后才能赋值，例如 `num = 10`。上述过程通常被称为“赋值语句”（assignment\
  \ statement），其中值根据程序员的声明被赋值给变量。\n\n然而，Java（事实上实际上是大多数编程语言）工作原理的一个显著特点是，在赋值语句中（例如我们的示例\
  \ `num = 10`），存储的实际值是等号右侧的值，即值 10，而 `num` 只是调用该存储存储的“标记”。这就是为什么许多 Java 程序员倾向于使用“获取”（getting）一个值的术语而不是“赋值”（assigning）的原因，尽管在大多数情况下，这两个词可以互换使用，且在某些少数情况之外，功能基本相同。然而，请注意，一旦值被赋值给变量，就需要执行函数才能使变量内部的数据更改其数据类型。\n\
  \n#### 变量的命名\n创建变量是一项简单的任务，特别是考虑到 Java 程序员倾向于根据数据类型或变量将存储的内容来创建和命名它们。然而，在命名这些变量时有几个规则，否则\
  \ Java 将无法识别它并导致错误信息。变量名的主要限制是它不应以特殊字符（如下划线）或数字开头。但是，变量名可以是字母、数字等字符甚至是下划线，只要下划线不放在开头。不能使用其他字符，例如\
  \ `#` 甚至 `$`，因为这些特殊字符在 Java 中有不同的用途，因此在变量名中不会被识别。\n\n虽然这些是主要规则，但在命名变量时有一些提示：\n-\
  \ 变量名应该是具有描述性的，因为在较长的代码中，可能很难记住“x”是做什么用的。像“count”或“output”这样的变量名比使用通用的“x”或“y”更容易记忆，并将有助于避免混淆。\n\
  - 除了具有描述性外，如果变量名保持相对较短，变量将更容易使用。虽然像 `banking_information_account_records` 这样的变量名非常有描述性，但在程序中需要重复输入它会非常累，而且较长的变量名会增加拼写错误的概率，从而导致代码中的错误。\n\
  - 同样注意，Java 变量的习惯一直是写成全小写字母，虽然对大小写没有限制，但保持小写可以简化问题，因为漏掉大写可能会导致变量无法识别，因为 Java 将大写字母读取为与小写字母完全不同的字符。\n\
  \n#### Java 原始类型（primitive types）\n#### 方法命名规范（Method Naming Conventions）\n我们将重新回顾\
  \ Java 中的命名规范，因为你将使用成员方法。Java 编程中的方法执行操作，它们还接收调用者提供的任何参数，并且还可以向调用者返回操作结果。\n\n以下是声明方法的语法：\n\
  \n```\n[Access Control Modifier] Return Type methodName ([set of parameters])\n\
  {\n    // body of the method\n}\n```\n\n在你要编写的方法命名时，有几条规则需要记住：\n- 方法名始终是动词或更具体地说是动词短语（这意味着你可以使用多个单词来命名它们）。\n\
  - 方法名的第一个单词应该是全小写字母，其余单词应遵循驼峰命名法（camel case）。这里有一个例子：`writeMethodNames()`。\n\n现在，你应该记住动词用于方法名，它们表示一种动作，而名词用于变量名，它们表示某种属性。\n\
