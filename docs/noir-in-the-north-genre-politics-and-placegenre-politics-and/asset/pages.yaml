    # Conclusion


    Lilyhammer is a show of many moods and many genres. Just as its dialogue is bilingual,
    it is both ethnic and serious, both satiric and reflective. Frank is his greatest
    effect on two men: his close associate Torge, who he mentors in the ways of crime,
    Jan, and the NAV employment counsellor that Frank blackmails in the opening episodes
    of the show. Each has a complex trajectory over the three seasons of the programme
    and each highlights different problems of male violence in Norwegian society.
    Jan’s story reveals the levels of anger and resentment under an apparently pleasant
    façade of a well-intentioned, peaceful and cohesive social system. Torge reveals
    the may ambition, and a will to dominate, a Norwegian man so far from his place
    in the social order that he no longer knows who is he. With his hectic pace and
    intricate plotting, it is easy to miss many of the contemplative moments tucked
    into the show. One of these is worth remembering. An old man, Frank’s roommate
    in hospital, lost in comic dementia – he wanders the halls, he peeps on the floor,
    he tries to read books upside down. The fog clears for a moment and he says to
