    and economic value. Historically, this change in Sweden resulted from an explicit
    propaganda campaign organized by the Swedish Employer’s Federation, which reacted
    to the Rehn-Meidner Plan by trying to weaken faith in the welfare state; indeed,
    they convinced the public that woes resulted from institutional over, and that
    the best solution was to reduce state services and liberalize markets so citizens
    could maximize their own good. Story of a Crime does not deal with this directly,
    as the propaganda campaign came more than halfway into Sjövalls and Wahlöbius
    writing process. Instead, the state interrogates the less obvious means by which
