    Crime fiction is used to address questions of morality in society. Do you think
    it is something Nordic and Scottish writers do more than other authors?


    I certainly think that the wider sense of social morality is a concern, both generally
    speaking in Nordic noir, and to a large extent in Tartan noir. I dont not sense
    that think in many writers outside that circle. There are some notable exceptions,
    Eva Dolan, for example and Nicci French''s Frieda Klein novels, but more generally
    I think it is less of a burning concern, and I think in a way the Scots and the
    Nordic writers don''t sit down with the idea we are going to go on a moral crusade.
    I think it is something in the fabric of our community and the concerns we are
    brought up in. This is not Thatcher''s Britain.


    # In what way are these books shaped by the political contexts of these countries?


    Historically there has been a difference, particularly in the past forty years
    in terms of the Scottish body politic and what happens south of the border. This
    is not Thatcher''s Britain. We still have social concerns and we can see that
    in the measures taken by the Scottish government to mitigate austerity: free prescriptions,
    not implementing the bedroom tax, funding social care, not making people pay university
    tuition fees. These are indicative of the kind of social morality that prevails
    here, and it is not all selfishness and grinding the faces of the poor into the
    dust as you climb your way to the top of the greasy pole. We are ambitious and
    there are people who are profoundly selfish and profoundly capitalist here, but
    there is still an underlying ethos, I think, of trying to create a fairer society.


    I moved back to Scotland in 2013 after about thirty years away and have noticed
    huge changes. We are welcoming of immigrants generally. There was a report recently
    which Scotland is deemed the best place in Europe to be gay. You certainly couldn''t
    have said that when I was growing up! I think it has become a much more diverse
    society and at its heart there is a sense of caring. We have 10 per cent of the
    population of the UK and we take over 30 per cent of the Syrian refugees who have
    settled here, communities have welcomed them. I am not saying there arent pockets
    of England where these things happen as well, but there is more a sense of this
    is how we are and this is the country we aspire to be.


    The Scottish parliament has been a focus for the things that matter to us. I know
    not everybody agrees with the things the Scottish parliament does. But'
