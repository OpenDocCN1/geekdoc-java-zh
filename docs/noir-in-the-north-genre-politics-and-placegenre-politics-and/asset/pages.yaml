  md: '# Contributors


    **Derek Greene** is Assistant Professor at the School of Computer Science, University
    College Dublin, and a Funded Investigator at the Science Foundation Ireland (SFI)
    Insight Centre for Data Analytics and the SFI VistaMilk Research Centre. He currently
    leads a research group which is focusing on developing algorithms for social network
    analysis and text mining.


    **Gunnthornor Gunnmundsdottir** is Professor of Comparative Literature at the
    University of Iceland. She has published widely on contemporary literature and
    life writing. Her most recent book is *Representations of Forgetting in Life Writing
    and Fiction* (2017).


    **Christinna Hazzard** is an Associate Lecturer in the Department of English and
    Cultural History at Liverpool John Moores University. She is currently preparing
    a monograph proposal for her doctoral thesis “Semi-Periphery Realism: Nation and
    Form on the Borders of Europe” and has an article forthcoming in a special issue
    of the Journal of Postcolonial Writing on the European peripheries.


    **Christopher James** is Assistant Professor of French at Bridgewater College
    (Virginia, USA) in the Department of Languages and Cultures. His research focuses
    on space in literature and film studies, as well as on memory studies. His dissertation
    concerned proper names in fiction as bearers of cultural memory, and most recently
    he guest edited a special issue of the *International Journal of Humanities Arts
    and Computing*, concerning the spatial humanities.


    **Delphine Letort** is a Professor of Academic Studies at Le Mans University.
    Her latest book is entitled *The Spike Lee Brand: Documentary Filmmaking* (2015).
    She has published numerous articles on film noir, film adaptation, African American
    cinema and documentaries.


    **Val Dermid** is a Scottish crime writer and known for a series of suspense novels
    featuring Dr Tony Hill. Her novels have been translated into forty languages.
    She received the Crime Writers'' Association Gold Dagger for Best Crime Novel
    of the Year in 1995 for *The Mermaids Singing*.


    **Gerard Meaney** is Professor of Cultural Theory and Director of the Centre for
    Cultural Analytics in University College Dublin’s School of English Drama and
    Film. She is the author of *Gender, Ireland and Cultural Change* (2010), Nora
    (2004), *(Un)like Subjects: Women, Theory, Fiction* (1993, 2012) and co-author
