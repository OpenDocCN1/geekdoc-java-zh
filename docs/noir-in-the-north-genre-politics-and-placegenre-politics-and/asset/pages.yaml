    Stefan–Veronica respectively, and the closely linked triangles of Stella–Sarah–Paul
    and Stella–Danielle–Sarah. It is a crucial aspect of social networks in crime
    fiction that they include the dead as well as the living, and the dead continue
    to connect the living. In this respect, contemporary crime drama has a considerable
    affinity with the traditions of gothic fiction, especially in its focus on liminal
    spaces. Emma Grey’s reading of Bron/Bron as borderline gothic fiction focuses
    on the use of liminality in the narrative:


    Liminality, as a key feature of Gothic texts, is generalised by narrative devices
    that cross thresholds and explore the notion of in/between spaces [...] the show
    explores liminality through the literal and allegorical bridges: the Øresund Bridge
    that gives its title and is the setting of much of the action; the relationship
    between protagonists Martin Rohde and Saga Norén, with Martin attempting to act
    as a bridge between the socially awkward Saga and the world; and finally through
    the show’s villain, the Bridge Killer/Truth Terrorist/ Jens Hansen acts as a bridge
    between Martin Rohde and his estranged son, August.


    This narrative unfolds in a liminal, complex territory plays differently in The
    Fall. Northern Ireland is a strangely indefinite territory: politically part of
    the UK, geographically part of the island of Ireland, with a scarcely visible,
    open order with the other Ireland. These external borders are vaguely alluded
    to in The Fall, but the traces of internal borders and barriers are quite visible.
    We follow Stella’s gaze as she observes the colourful street murals from her car
