    States was a new form of capitalism, in which the citizen''s private life was
    subject to decreased surveillance. This shift in the state''s attention to the
    sexual behaviour of its citizens did not induce a decrease in its overall activity,
    but rather a re-direction of its energies towards the population''s economic and
    material lives. Neoliberal and non-conservative ideals began to take hold of the
    political imagination and political institutions of the state. It was this new
    reality which tartan north and nordic confronted. New questions were asked; not
    how might we live with the damage that once-praised, and generally legitimate,
    welfare states were clearly inflicting on the vulnerable. As such, a new generation
    of anti-heroes were born: Mikael Blomkvist (of the Millennium Trilogy) and Harry
    Hole to become the morally good ''bad'' boys of the twenty-first century. Morality
    had gone through a seismic shift: no longer the presence of those representing
