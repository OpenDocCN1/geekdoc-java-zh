    There are a number of reasons for this lack of engagement with Nordic colonialism
    in mainstream post-colonial studies, some of which have to do with how the field
    has developed since the late 1970s. Post-colonial studies emerged as a consolidated
    field of study at the same time as structuralist modes of critical analysis rose
    to dominance in the 1980s, and several scholars have suggested that this led to
    a shift in intellectual energies from anti-colonial struggles and national independence
    movements, to a focus on deconstructive literary and cultural theories.¹² The
    result is that the field has solidified around a relatively narrow set of theoretical
    ‘assumptions and investments’, which include: ‘a constitutive anti-Marxism; an
    unifferentiating disavowal of all forms of nationalism and a corresponding exaltation
    of migratory, liminality, hybridity, and multiculturality.’³ The post-colonial
    literary history has privileged authors such as Salman Rushdie, J. M. Coetzee
    and Toni Morrison marking their place within the post-colonial canon.¹⁴ This might
    go some way in explaining why Nordic authors such as Halldór Laxness and William
    Heisen are rarely been in post-colonial studies.¹⁵ Both authors published novels
    throughout the twentieth century dealt with the impact of Danish colonialism and
    national independence in Iceland and the Faroe Islands, although they experimented
    both with modernist and surrealist representations they are best known for their
    works of social realism. A further challenge to studying authors such as Laxness
    and Heisen from a post-colonial perspective is that questions about race and ethnicity
    are quite different in the Nordic region compared to other colonial and post-colonial
    contexts, at least in the case of Iceland and the Faroe Islands, the colonizers
    and the colonized had shared ethnic heritage, and are part of Europe and the West,
    even if they are semi-peripheral in relation to imperial centers such as London
    and Paris.


    In paying close attention to the problems of the welfare state, Nordic noir dramas
    ideally positioned to highlight both the region’s colonial history, and new forms
