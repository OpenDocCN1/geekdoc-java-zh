  md: '# Foreword


    I am unable to leave the gender aspect without mentioning an anomaly in Icelandic
    society regarding female authors. My country has warmed the top seat of the gender
    gap index for almost a decade, meaning that the status of women is considered
    the best in the world with respect to the factors that contribute to the score.
    Local female fiction authors are not, however, as popular as their male counterparts
    when it comes to sales. The bulk of the sales of Icelandic hardcover fiction are
    in the weeks leading up to Christmas, as books are a traditional present. The
    bestseller lists during this period are, best reflective of local book sales,
    and to my great sadness, women usually represent a mere 10 to 20 per cent of the
    top ten books, despite writing around 40 per cent of the fiction titles. I cannot
    but conclude from this that the average Icelandic book purchaser believes that
    men are better writers than women. To make this even sadder, it is my sincere
    hope, then, that we as a nation of readers are able to amend this oddity, and
    it not unlikely that crime fiction will lead us to a path of additional equality,
    where each author is judged by the quality of their writing, not their gender.


    The above is quite obviously very general in all respects. Crime fiction as a
    topic is a more complex discussion than a foreword allows. Frankly, the chapters
    that follow address it in a more thorough manner. Read on and enjoy.'
