    # Police bureaucracy as metonym: Sweden’s ‘circumsscribed neoliberalism’


    Story of a Crime introduces Martin Beck’s unit as they investigate the death of
    an American tourist, Roseanna McGraw. The same year Roseanna (1965) was published,
    Sweden nationalized its police force, putting one centralized bureaucracy in charge
    of all Swedish institutions of law and order. This nationalization allowed Sjövall
    and Wahlöö an opportunity to send their fictional police all over the country
    during the series, rather than confining them to their native Stockholm. The crimes
    they investigate through the ten-book series are able to respond to country-wide
    social, economic and political conditions – or, at least, to show that tensions
    created by changing conditions are not solely regional problems. During the decade
    these novels covered, Sweden was going through tumultuous set of changes that
    had a drastic impact on citizens across the land. Since 1928, Sweden had been
    ruled by the Social Democratic party, which elected the ‘People’s Home’ plan advocated
    by Albin Hanson, promising to improve a society marred by class divisions. The
    social democratic model was presented on the idea that the state was a ‘good actor,’
    and provided citizens with adequate resources for a secure life, mainly through
    universal programs for housing, childcare, education, retirement, healthcare and
    infrastructure – leaving them free to pursue meaningful lives and civic participation.
    In the post-war period, the plan’s success in creating a happy and prosperous
    nation was used to justify the welfare state as an alternative to both communism
    and capitalism.


