    # KID STUFF: NORDIC NOIR, POLITICS AND QUALITY


    Andrew Nestingen


    The child is a key figure in Scandinavian crime fiction and Nordic noir.¹ This
    chapter argues that a shift has occurred in how the child is represented within
    this tradition. The child has shifted from a pre-dominantly political figure to
    a cultural-economic one. Nordic crime writers often depict the child as isolated
    because of neglect and systemic dysfunction, which leads to victimization, but
    also criminal violence perpetrated by children. This construction of the child
    called for political attention and change. Since the 2010s, the child has become
    a more mannered figure, shaped by the conventions of family melodrama, and so
    isolated and less vulnerable. The child becomes a figure that adds complexity
    to the personal relationships within Nordic noir. The semantics of childhood –
    Rousseauian innocence, vulnerability, joyfulness and curiosity – give access to
    affective and intellectual material that is engaging requires careful handling
    by its producers. Increasingly, the child’s relationships and transitional, or
    liminal identity, furnish dramatic potential and challenges for writers, filmmakers
    and television producers, who then become a source of ‘quality’ drama. The transformation
    is noteworthy from several angles, but the angle on which this chapter focuses
    the child’s relationship to the category of ‘Nordic noir’. The representation
    of the child is a definitive feature of the genre, insofar some of the cultural
    assumptions, expectations, emotional states and shared outlooks, that figure centrally
    in Nordic states. At the same time, the changes in its representation show how
    underpinning notions have changed in recent years, and in particular since the
    mid-2000s. The world of noir is conventionally a world of deceit, intrigue, cynicism,
    pervasive criminality and sexuality – a dark world, which rarely includes children.
    There is a relationship between the child and Nordic noir. In fact, the child
    figures prominently within it – lying at the heart of all seasons of Forbrydelsen
    (The Killing, 2007–11) and Bron/Bonden (The Bridge, 2011–18). As a definitive
    feature, the child originally figured as a metonymy of welfare-state dysfunction
    in Scandinavian crime fiction, but since the 2000s and the advent of Nordic noir,
    the child has come to define domestic space, serving to bring the complexity of
    family melodrama, and by extension ‘quality’, into the'
