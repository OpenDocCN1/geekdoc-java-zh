    # Quality


    The political representation of the child has increasingly intersected with an
    aesthetic of quality. Quality aesthetics make use of the child''s sublim within
    a representational system that is concerned with depicting broad areas of everyday
    life in a variegated and authentic way, generating moral and dramatic complexity.
    Quality, here is an aesthetic and a cultural-economic term, which television studies
    scholars since the 1980s have used to utilize production, textual form and audience
    address. Robert Thompson argues that quality TV is best defined by what it is.
    It is not “regular” TV.29 Against the genres and flow of conventional programming,
    quality TV offers narrative richness, more elaborate production values (reminiscent
    of cinema), long-form serialization, modification of conventional TV genres and
    better writing. Jane Jaeger argues in quality TV''s negation of TV, it has drawn
    extensively on European art cinema production values and writing practices, and
    the self-reflexivity and intertextuality of auteur cinema.


