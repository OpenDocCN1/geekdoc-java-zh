  md: '# 2 Noir in the North


    it as a response to the inevitable failure of optimistic social democracies to
    fundamentally alleviate human suffering, tread highlighted in several chapters
    of this volume. In its current usage, however, the term is not without its own
    contradictions and complications, as Gunnar Staales elucidates in the Coda to
    this volume and Björn Nordfjord addresses in detail in Chapter 11, where he points
    to the ‘whole-hearted adoption of the term by the scholarly community’ as somewhat
    surprising. Both Staales and Nordfjord are mainly concerned with the problematic
    use of the term ‘noir’, by the lumbering together of all crime fiction from many
    countries and cultures is without its problems either.


    The regional differences – social, cultural and literary – within the Nordic countries
    should not be underestimated, each having their own particular trajectory (as
    Kirsten Bergman and Nina Mužaka make clear in Chapter 14 on Swedish fiction and
    Chapter 15 on Norwegian might respectively), with certain transnational markers
    as the pan-Nordic influence of Maj Sjöwall and P Wahlööd, and the development
    of Nordic film and television. Denmark has a long tradition of high-quality film
    and television, which has also been influential in the other Nordic countries,
    and then further aided when Forbryderelsen (The Killing, 2007–12), broke the transnational
    barrier. The change from when it was unthinkable to show dubbed series on prime
    UK television, when Lars von Trier’s Rig (The Kingdom, 1994-97) was on BBC2 at
    11pm on Tuesday evenings in the late 1990s, should not be underestimated. With
    the advent of streaming services such as Netflix la casa del papel (Money Heist,
    2017-) and Belgian Beau Sejour (Hotel Beau Sejour, 2016-) successfully having
    instant global distribution. And although not exactly threatening Anglo-Saxon
    hegemony, these productions knock forcefully on its door, adding new languages,
    angles and traditions.


