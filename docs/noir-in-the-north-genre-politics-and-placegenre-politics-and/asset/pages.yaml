    The child''s ubiquity in contemporary Nordic noir contrasts with the figure''s
    relative absence in the history of crime fiction. The classical detective story
    is an urban world of adults, away from home, in which children are not present.
    Hardboiled crime fiction and classic film noir are veritable nocturam, and thus
    a place where children go. Scholars of film noir such as Vivian Sobchak and Sylvia
    Harvey have argued that children are definitive figures in noir by their absence.
    Sobchak writes: ‘children do not normally (or normally) find their way into these
    spaces [..] Women in these spaces are rarely nor men fathers’ Harvey writes: ‘It
    is the absence of normal family relations (of the network of relationships between
    mother–father–wife–husband) that forms one of the distinct parameters of film
    noir.’ Sobchak and Harvey argue that a feature of noir is the absence of children,
    as well as melodrama. So, too, the spy novel lacks children. It is built around
    bureaucracies, surveillance operations and peripatetic operatives.


    Children in crime fiction are hived off into their own sub-genre, the whodunit
    for young readers, The Hardy Boys Nancy Drew, The Boxcar Children, Encyclopedia
    Brown and so on. Here, it is the rational itself, whose prose is displayed by
    good sense, which stands in contrast to the typical depiction of children tending
    towards the irrational and gullible. When children appear in crime fiction, it
    is not unusual for this irrationality to be the basis of their inclusion. They
    become monstrous and uncanny because of their irrationality. As an example, consider
    Steven King’s It (1987), in which children’s fears materialize as a shape-shifting
    monster that targets them. Or in the Nordic realm, a good example is the fiction
    of Yrsa Sigurdardóttir, for example Sé grefur gróf (2006; My Soul to Take, 2009)
    and Égan þig (2010; I Remember You, 2012); in both children (or their ghosts)
    are perpetrators of violence and victims of it. Horror’s goal of terrorizing the
    reader allows for the inclusion of children, while crime fiction connects with
    rational understanding tends to keep them out.


    The police or legal procedural, in contrast, is a sub-genre of crime fiction in
    which children turn up sometimes, mostly as an embodiment of the domestic. Domestic
    scenes tend to involve the police detective or defence attorney home. Children
    are typically foils against which the characters of their parents can be developed,
    supplementing the parents’ development in professional lives. Children are not
    perpetrators or victims on their own, but innocent bystanders tucked into the
    intrigue. If children are present in crime fiction, readers’ expectations typically
    concern how children are insulated from the compromised world around them. US
    crime-fiction critic Janet Hutchings observes: ‘I don’t like to see crimes against
    children trivialised by the stuff of entertainment.'
