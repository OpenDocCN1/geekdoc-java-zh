  md: '# CONTRIBUTORS


    Kerstin Bergman is an affiliated researcher of comparative literature at Lund
    University, Sweden. She is an expert on Swedish crime fiction and Nordic noir,
    a literary critic and a member of the Swedish Academy of Crime Fiction. She is
    the author of Swedish Crime Fiction: The Making of Nordic Noir (2014), and numerous
    popular and scholarly articles on Swedish and international crime fiction (in
    English and Swedish). As an expert on crime fiction, a writer and lecturer, she
    runs CrimeGarden and blogs (in Swedish) about crime fiction at crimegarden.se.


    Giti Chandra is an affiliated scholar with the United Nations University. Gender
    Equality Studies and Training programme, at the University of Iceland. is the
    author of Narrating Violence, Constructing Collective Identities: To Witness these
    Wrongs Unspeakable (2009), and she is currently working on In Visible Texts: Hidden
    and Specacularised Violence in Colonial India and Africa. She has written and
    published issues of violence, the body, gender and collective identity formation.


    Mary Evans is currently a Leverhul Emeritus Professor in the Department of Gender
    Studies at the London School of Economics (LSE). Her work discussed feminist and
    sociological theory, and her most recent work is a study of contemporary European
    detective fiction, with Sarah Moore and Hazel Johnstone entitled Detecting the
    Social: Order and Disorder in Post-1970s Detective Fiction, published in 2019.


    Stacy Gillis is a Lecturer in Modern and Contemporary Literature at Newcastle
    University, UK. She is the editor of four books, including Feminism, Domesticity
    and Popular Culture (co-edited with Jaeho Hollows, 2009).


    Graeme Gilloch is Professor of Sociology at Lancaster University. He is the author
    of Myth and Metropolis: Walter Benjamin and the City (1995); Walter Benjamin:
    Critical Constellations: Our Companion of Misfortune (2015) and co-author (with
    Bülent Diken and Craig Hammond) of The Cinema of Nuri Bilge Ceylan (2018). His
    work focuses on critical social and cultural theory, with particular reference
    to the intersections of the city, visual culture and memory. His latest book (with
    Jaeho Kang) is Siegfried Krauer: Selected Writings on Media, Propaganda and Political
    Communication (2018).'
