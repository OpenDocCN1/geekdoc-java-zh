  md: '# CODA


    Gunnar Staalesen


    After having read all of these interesting chapters, I would not be surprised
    if

    you are are left with at least one question: does Nordic noir really exist? Is
    there a simple way to define it? Or is it only a way of marketing books from the
    same geographic area? To begin, I will try to answer two questions, the first
    one being: where is the North, from where ''Nordic'' is derived


    Normally, one would speak about the Scandinavian countries as one entity:

    Denmark, Norway and Sweden. These three countries have languages that are so close
    to each other that we can read books in all three languages without having them
    (though they are very often translated and published in the national language
    of all these countries). When we speak, we can understand each other easily, if
    we do not speak fast.


    Nevertheless, the three countries have a different history, Norway being governed
    by Denmark for 400 years, and in a union with Sweden for almost 100 years. Between
    1397 and 1905, Norway was not a free country (the reason, I am sure, of why the
    majority of the population in two referenda decided that Norway should not be
    a member of the European Union). Sweden and Denmark fought several wars, and some
    animosity can still be detected between representatives of these two countries.


    The other two countries that are usually called Finland and Iceland. They both
    have languages that are not comprehensible in the Scandinavian countries, though
    Iceland is closer to the original Norse language than the other Nordic. Iceland
    has a long history of being governed by (Norway) and Denmark. Icelanders still
    speak Danish in school and can speak directly to their Nordic brothers and sisters.
    A minority of Finnish are Swedish-speaking, but usually we have to use English,
    at least when talking with younger people from these countries.


    The history of Norway towards Denmark can be compared to that of Scotland and
    England. In my opinion, I could easily define Scotland as a Nordic country. I
    remember Ian Rankin once said that he felt more like a ''North Sea writer'' than
    a ''British'' one. Looking at writers Ann Clee in her Shetland series, Ian Rankin
    and other Scottish writers, it is possible to say'
  merge: -1
  pgno: 253
- img_proc: true
  md: 'the North should least include Scotland in the definition of Nordic, even if
    it lacks the geographic specialty of the Scandinavian countries, Iceland and Finland:
    the short Nordic summer nights and the long, dark nights of winter. And ‘dark’
    in French is, of course, ‘noir’.


    This leads us to the second question: what is ‘noir’? In my opinion, the original
    ‘Nordic noir’ is the Icelandic sagas, written mostly in the thirteenth and fourteenth
    centuries, Njál’s Saga as the famous. If one follows the literary links, there
    is a path going more or less directly from these sagas to the writing of American
    hardboiled writers Dashiell Hammett and Raymond Chandler. They have the most perfect
    one-liners. As we all know, the word ‘noir’ linked to crime fiction was given
    to writers like Hammett, Chandler and Horace McCoy, published by la Série noire
    of the French publisher Gallimard from 1945 onwards. The same expression was also
    used to describe American films based on the same material (The Big Sleep, The
    Maltese Falcon, Double Indemnity, etc.), i.e film noir. Originally, the meaning
    of the word was ‘hardboiled’. Agatha Christie, Conan Doyle were never looked upon
    as ‘noir’ writers, neither were Georges Simenon writing crime stories. The ‘noir’
    writers of Hammett, Chandler, Ross Macdonald, Mickey Spillane (which leaves a
    bad taste in the mouth), and several others, all of them Americans.


    Why the name ‘noir’ linked to Nordic writers, then? The big watershed in modern
    crime fiction happened when the novels of the Swedish couple Sjöwall and Wahlöö
    were published between 1965 and 1975, featuring the police inspector Martin Beck
    as the central character. What they did to combine very good crime novels with
    political criticism of the modern Swedish welfare society and the role of the
    police corps in that period. They wrote about police brutality, prejudice and
    corruption, and they did it in a way that not only opened the eyes of the writers
    in the other Nordic countries, but since they were translated into several languages,
    influenced writers in many other countries too.


    I have already mentioned Ian Rankin as a ‘North Sea writer’, and he has pointed
    to Sjöwall and Wahlöö as one of the sources of inspiration when he started his
    Rebus series. He writes in his own personal style, of course, but the relationship
    to the Swedish couple is easy to see when it comes to the use of political background
    in his novels. The same way of telling a story in the form of police procedures
    can be seen in most Scandinavian writers who followed, with Henning Mankell and
    Stieg Larson as the best-known Swedish successors. Even if his novels are based
    on a more thriller-like dramaturgy, the immensely Norwegian writer Jo Nesbo definitely
    writes a modern-day version of the Martin Beck novels, as do Jørn Lier Forst.


    In the wake of Sjöwall and Wahlöö, two generations of writers have followed. In
    Norway, John Michelet and I were among them, and after some years the interest
    in our books from other European countries grew. My books were'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'translated into English, German and Russian, as well as Danish and Swedish
    in the 1980s, I have been able to watch the development of what was later termed
    ''Nordic noir''. But Michelet and I were clearly inspired by Sjjöll and Wahlöö,
    and our first crime novels were police procedures. Then we changed to a more hardboiled
    style. Michelet let one of his police investigators, Vilhelm Thygesen, leave the
    force and work as a lawyer, freelancing as a kind of private detective, and I
    created my own version of the classic private eye, Vargas Veum.


    The first Carg Veum was an experiment, and I was not sure if it worked. Was it
    possible to transfer this American style of crime writing to Norway, forty years
    later? But no critic protested against this private detective story from Bergen
    in the 1970s, and the readers loved it. After finishing my third and last police
    procedure, in 1979, I wrote two in what was now going to be a long series: *Yours
    until Death*. Among I am one of the few who write in the direct tradition of Hammett,
    Chandler and Ross Macdonald: the ''crime noir''. Almost all of the other writers
    are writing in the police procedural style, and I agree with the critics who raise
    the question: can this really be called ''noir''?


    The world-famous literary detective was of course Holmes. He was a private detective,
    as Hercule Poirot and several other characters from the golden age of British
    crime literature. The Norwegian writer Stein River (a pseudonym for Sven Elstead)
    had two central detectives, the police inspector Knut Grubb and the private detective
    Asbjorn Krag, I would not call the stories about Knut Grubb ''police procedures''
    in the modern understanding of the word. In other words: the private detective
    dominated the genre from the beginning.


    Some critics have pointed back to *The Moonstone* (1868) by Willie Collins as
    an early novel describing police work at Scotland Yard. Later on, I would certainly
    count the 1930s Maisget novels by Georges Simenson as ''police novels'' with a
    realistic description of police work rather than a quest ''whodunit''. Nevertheless,
    it was in the 1950s that the shape of the modern ''police procedural'' became
    highly visible within the genre, with writers Hillary Waugh and Ed McCain on the
    front. Then, in 1965, Sjjöll and Wahlöö published their first book, and the rest
    is history.


    But is a ''police procedural'' really a ''noir'' novel? Not in the original use
    of the word ''noir'', but it seems today that it is more and more being used as
    synonym for all sorts of crime stories. One might say that it is the meaning of
    the word that has changed. In other words—writers as varied as Jo Nesbo and Camilla
    Läckberg, Karin Fossum and Stieg Larson, Henning Mankell and Å Nesser, Kjell Ola
    Dahl and Yrsa Sigurardóttir, Antti Tuomainen, Journ Lier and many others all represent
    so-called ''Nordic noir''. What they all have in common is that they are defined
    as crime writers and that they live and write in one of the Nordic countries.
    And that, if you ask me, is a rather loose definition.'
  merge: -1
  pgno: 255
- img_proc: true
  md: 'Final question: will the ‘Nordic noir’ wave endure? Why not? If the Nordic
