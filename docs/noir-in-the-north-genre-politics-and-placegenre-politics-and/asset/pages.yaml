  md: '# Conclusion


    ‘What about integration, multiculturalism and all that?’

    ‘Save it for the speeches’.


    Jørn Lier Horst, Closed for Winter


    Writing about the social and political seriousness of noir, Wanner concludes that
    it is ‘closely allied to the creation of protagonists marked by their alienation
    from conventional society – victims who suffer from powerlessness, immobilizing
    uncertainty; isolation; transgressors who defy a repressive, conformist society.’⁸¹
    Not all of the protagonists in Norwegian noir are dysfunctional, yet they are
    all painfully aware of the zeitgeist and economic and geopolitical factors influencing
    their private and professional lives. Constructs of individual and collective
    identity, serving as a generic marker, reveal a range of topics highly relevant
    for Norway as a hybridized society. Homogeneity is replaced by differences and
    inequalities at every step – financial circumstances, native languages, religious
    and cultural practices and skin tone – which allows the authors to explore the
    problems of xenophobia and racism. Murder as a disruption of order symbolizes
    a much more encompassing and widespread disruption in the community, also signalled
    by the inclusion of the Order. The police force, who should protect the community
    and solve the crimes, appear to be hindered by their poor treatment at the hands
    of the state, which is exemplified by funding cuts... the legal system is also
    deficient. Socio-political commentary in the frequently subversive subtext unmasks
    various forms of social and political injustices, endangeringNorwegian authors
    ‘to settle accounts with la raison détat (interests of the state) and its narratives,’
    through the process of recovering clauses that the official narrative has chosen
    to ignore.⁸² Just like neo-polar, which ‘paved the way for the roman noir to be
    considered as a significant cultural phenomenon,’ Norwegian noir appears to an
    intellectually discerning and politically active audience⁸³


    The construction of Norwegian noir characters, marked off as the Order and assigned
    a limited position through their deviance from established norms and expectations,
    both in rural and urban settings, proves to be important not only for the investigation
    of fictional crimes, but more importantly, for the current social and political
    issues that permeate the extrateual world as well. The authors of Norwegian noir
    peel off the facade of a deceptively idyllic, affluent, based homogenous Norwegian
    society, to reveal the stark reality of a multinational, though often claustrophobic,
    society ridden by much of the same illnesses as the rest of the globalized world,
