  md: '# Chapter 3


    # ADAPTING NORDIC NOIR: FROM FORBRYDELSEN TO THE KILLING


    Delphine Letort


    While film noir is originally associated with films made in 1940s America, signifying
    a trend of crime fiction that is characterized by noir aesthetics and archetypal
    characters (including the femme fatale, the private eye, the loser), the genre
    has infused the visuals of murder on both cinema and television screens across
    many countries. The aesthetics of film noir convey, according to Jon Tuska, a
    ‘darkling vision of the world, view from the underside, born of fundamental disillusionment
    perhaps, also invariably the result, no matter how timid, of a confrontation with
    nihilism.¹ This philosophical interpretation of the genre arises from an analysis
    of the gloomy atmosphere that permeates the bleak cityscape of film noir and its
    narrative of loss, and emphasizes the powerlessness of characters confronted with
    forces that they cannot master. Jean-Pierre Esqu argues that film noir originally
    expressed an existential crisis linked to the experience of modernity, symbolized
    by the growth of cities into megalopolises and the frantic development of capitalism
    into a globalized economy.¹ Scholars have noted the influence of European immigrant
    directors in the development of Hollywood noir (Billy Wilder, Edgar Ulmer, Robert
    Siodmak, Jacques Tourneur, etc.), although many of them have adapted American
    hardboiled novels and scripts by the likes of Raymond Chandler, James M. Cain,
    Cornell Woolrich and William Faulkner, among others.³ The noir aesthetic therefore
    seems to result from an encounter between artists from different countries – writers
    delved into the dark corners of crime and plumbed the depths of the criminal soul
    in their books, which filmmakers fleeingNazi Europe adapted for the screen through
    the lens of expression.⁴


    The appeal of noir goes beyond borders, thriving on the human, economic, cultural
    and political exchanges between Europe and the United States.³Film noir provides
    a source of inspiration and creation that has given rise to nostalgic neo-noir
    in the United States and in Europe, and Nordic noir provides further illustration
    of its enduring influence. Nordic noir has both absorbed the conventions of American
    film noir and contributed to rejuvenating the genre'
