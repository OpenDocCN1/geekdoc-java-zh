    an instrumental attitude towards nature has so far remained a part of hegemonic
    discourse in Iceland. Anne Bryndon argues that reason and rationality continue
    to be used as identity markers, marking what is seen as rational management of
    a non-sentient, raw material used as opposed to an aesthetic perceived as dangerously
