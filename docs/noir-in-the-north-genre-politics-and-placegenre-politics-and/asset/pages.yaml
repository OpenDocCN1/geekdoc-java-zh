  md: '# Chapter 11


    # WHAT’S IN A NAME? THE THORNY THREAD OF NORDIC NOIR


    Björn Nordfjörd


    The Nordic noir has been swiftly adopted and judged to be a fitting and appropriate
    term to describe and characterize Nordic crime fiction, film and television. A
    closer look at the case, however, reveals that the evidence used to support the
    term is unconvincing if not altogether lacking. In this chapter, I begin by addressing
    the adoption of the term ‘Nordic noir’, then trace the origin and specificity
    of the term ‘noir’ itself, before finally considering how applicable it is to
    the Nordic context.


    # The Crime Scene


    It is easy to understand why Nordic noir caught on so quickly for marketing purposes:
    noir has long been great for advertising and Nordic noir has a very catchy ring
    to it. After its emergence in 2010 it was quickly adopted as the go-to-term in
    marketing, production, mass media coverage and introductory books titles.¹ A little
    more surprising, however, was the equally well-hearted adoption of the term by
    the scholarly community: largely, I believe, because it is a very practical term
    as it does not distinguish between media (unlike ‘crime fiction/crime film’) and
    suggests a regional specificity (Nordic), without excluding Iceland and Finland
    (which Scandi noir does), while indicating a broader scope (noir). It is a more
    attractive, practical and inclusive term than Scandinavian crime fiction or its
    stiff-hands Scandi crime and Scandi noir. However, in rushing to adopt noir we
    ask ourselves whether Nordic crime fiction, film and television were really noir
    in the first place, and what the implications might be of critically appropriating
    it for our purposes. Certainly, some questions have been raised about how best
    to define Nordic noir, its specificity and comparisons made with the ‘original’
    American noir. An etymological study of the noir concept and its applicability
    to the Nordic region has not, however, has been conducted.'
