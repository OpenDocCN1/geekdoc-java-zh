  md: 'complexity of these works is also a challenge to many assumptions about how
    realism operates in crime narrative. It is striking that French, as an influential
    crime writer, argues that the crime genre explores national identity and ''big
    themes'' as well as capturing the culturally and historically specific context,
    as doing much than reflecting social reality. Like Robbins, she sees it as interrogating
    and engaging with multiple realities, forcing us to re-appraise our assumptions
    about those realities and our responses to them. Crime narrative is an artistic
    practice engaged with society, not just a social and cultural symptom.


    The application of social network analysis to The Bridge and The Fall illuminates
    engagement and mass contemporary Nordic noir and noir-influenced drama to the
    history of the genre. It also illuminates the extent to which crime fiction, occupies
    a central role in contemporary popular culture, has changing, complex, nuanced
    function in relation to the social imagery. There are significant differences
    in the way which international relationships are mapped in the border zones represented
    by Øresund Bridge and Belfast. The high degree of betweenness centrality to the
    villain from the start of The Fall and the invisibility of the avenging killer
    in the initial exposition of the social networks in Bron/Broen a clear difference
    between the Nordic and the Anglo-Irish narratives. Both Saga and Stella are strangers,
    limited figures but also guardians of the network and flow around the post-temporal
    borders of states and social relationships. In Bron/Broen, Saga, as both a woman
    and a detective, functions to explore change, assert difference and to reassure
    the audience that however strong the forces of violent disruption, someone is
    ultimately capable of holding the social plot together. In The Fall, despite Stella''s
    heroic efforts, intellect and aura of feminine power, darker forces dictate the
    plot. The possibility of meaningful resolution remains uncertain. Both Bron/Broen
    and The Fall offer the pleasures of the hunt through the labyrinth to identify
    the murderer, but in their conclusions both resist, in very different ways, the
    resolution of conflict and the restoration of order which might allow their viewers
    to escape into the certainty or the fantasy that knowledge can impose order on
    social relations and guarantee safety.


