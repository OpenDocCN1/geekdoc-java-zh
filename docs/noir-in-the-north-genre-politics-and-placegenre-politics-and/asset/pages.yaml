    More centrally, the show is itself a consumer of American popular culture. Its
    premise takes a character from The Sopranos and transplants him into Lilyhammer.
    The main character, Frank, is played by the American actor and musician Steven
    Vandt, who first and only, previously acting job was playing consigliere Silvio
    Dante on The Sopranos. Frank is only moderately distinguishable from Silvio; they
    both run nightclubs; the main difference is that when Silvio tends to suck, Frank
    has a brutal rivalry. In a big wig to fans of The Sopranos, Maureen Vanandt, who
    is married to Van Vandt in real life and played Silvio’s wife on the earlier show,
    plays Frank’s ex-wife and Tony Sirico, who played gangster Bruce Springsteen,
    Steven Vandt’s bandmate, is his other brother, a lugubrious hitman. There are
    multiple shared music cues and plot points across the two shows, and moreover,
    it is clear that characters within the show watched loved The Sopranos. In the
    third season, when Frank’s Norwegian crew gets to the United States, Torgeik takes
    great delight in playing the theme music from Sopranos as they drive the streets
    of New York City.


    The return of Sopranos, through the catching of Steven Vanandt, is more than an
    in-joke for fans of both shows. Frank is a snitch, someone who took revenge on
    his enemies by giving information to the FBI (Federal Bureau of Investigation).
    The threat of the turncoat haunts The Sopranos, and part of the show’s extended
    lament on the mid-century American masculinity is the rise of the snitch. Tony
    Soprano complains, ‘You know how many mobsters are selling screenplays and screwing
    everything up?’ The Mafia is premised on the idea of safety in numbers, of layers
    who ally each other and their bosses, sticking to the script when questioned by
    police. While much is made in Mafia stories about ‘omerta’ as a code of silence,
    it is also an to perpetuate a series of cover stories and fronts that shield criminal
    enterprise from view. Maintaining the web of lies, keeping everyone safe, rises
    to the level of honour in Mafia stories, the level of something that defines a
    man for life.


    The figure of the snitch threatens to destabilize the narrative of a Mafia story,
    just as the co-operating informants threaten to send their comrades to jail. The
    person who turns into a snitch has decided to transfer knowledge from the world
    of criminal enterprise to the world, in the American context, of the FBI task
    force. The snitch has capacity to alter both worlds – sending people to jail,
    getting agents promotions. Snitches are a force of volatility. If criminals are
    the authors of their crimes, and cops are the authors of the investigation, the
    snitch rivals both both their narratives. In most Mafia stories, the snitch is
    killed by the Mafia, even when they are a beloved member of the family. Rarely
    does the snitch survive (Goodfellows as a notable exception). Lilyhammer does
    something else with the snitch – it lets him live on, and imagines imagines a
    new world for him to conquer.'
