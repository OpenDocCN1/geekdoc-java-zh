    different movements agree on the entirely unacceptable nature of the contemporary
    state and conventional politics. Others point to emphasize here is the way in
    which history, always eager to repeat itself, might be seen to be doing so through
    the pages of crime fiction. In the 1930s, writers such as Dashiell Hammett and
    Raymond Chandler in the United States situated the very possibility of the pursuit
    of crime and any kind of justice achieved as entirely outside the state institutions
    of policing. Hammett himself worked as an employee of the Pinkerton National Detective
    Agency, founded by Alan Pinkerton in the middle of the nineteenth century. This
    organization was the place that many citizens turned for a competent investigation
    of crime because actual detectives and police forces could not catch criminals
    but had little interest in doing so.⁵ The absence of intelligence or integrity
    in the persons formally charged with policing led, inevitably, to the cult of
    the amateur on sides of the Atlantic. It was left to the fictional characters,
    for example, Miss Marple and Philip Marlowe, not to identify the criminal but
    to see the social justification for doing so. It took some time for police forces
    in any part of the world to become close to the guardians of public virtue and
    morality. In the United States, there has always been some ambiguity about whether
    this ever be achieved because many police forces have been abusive towards non-white
    citizens. The work of the journalist Jill Levy on the absence of formal investigation
    into the deaths of young African Americans in California, and the claims of the
    Black Lives campaign would suggest that the congruence of justice and formal policing
    structures still has some way to go.³ In her most recent work of fiction, Bluebird,
    Bluebird (2017) the African writer Attica Locke wrote:


    While looking into the cases of men and women, mostly black and Latino, decades,
    who had been wrongfully accused and often incarcerated for decades, the two investigators
    discovered a pattern: for every story about a black mother, sister, or wife crying
    over a man who was locked up for something he didn''t do, there was a black mother,
    sister, wife, husband, father or brother crying over the murder of a loved one
    for whom no-one was locked up. For black forces, injustice came from both sides
    of the law, a double-edged sword of heartache and pain.⁷


    This stands as a telling, and lasting, comment on the operation of the criminal
    justice system in the United States. But similar patterns, in which race and class
    impact on the likelihood of criminal prosecutions are found elsewhere.


    In raising this question about the ways in which different parts of the world
    have dealt with questions of morality and its presence or absence in those institutions
    most centrally concerned with it, we also see some of the larger ruptures between
    the ways in which different areas construct questions about the origin of evil
    and the breakdown of the idea of shared morality. There is still,'
