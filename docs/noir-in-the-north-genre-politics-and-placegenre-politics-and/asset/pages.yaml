  md: '# VAL MCDERMID ON NOIR IN THE NORTH


    Interview by Lorna Hill


    Scottish crime writer Val McDermid reflects on the notion of noir and nationality
    and the relationship between Nordic noir and Tartan noir. She consolidates her
    understanding of the genre, making the connections between noir and traditional
    histories and collective and cultural memory.


    # What does noir and nationality mean to you?


    There is definitive connective tissue between so-called Tartan noir and what is
    coming out of the Nordic countries. I think part of that is cultural. Historically,
    there has always been quite strong connectivity between the Nordic countries and
    Scotland, particularly Norway. Parts of Scotland used to belong to Norway so so
    has always been cultural connectivity. Whenever Scottish football teams get anywhere
    they end up playing the Faroe and the Iceland teams. There is something about
    the long dark nights and the old traditions of both the Nordic countries and the
    Scots of storytelling around the fire in the winter. When that stories were passed
    before we wrote them and put them into books. Those are things we have in common,
    so I imagine that over the years, the kind of trade and commerce that has gone
    over the North Sea, those stories have been exchanged. That interest in the darkness
    exists. And also, there is political sense Scotland has had for a long time, although,
    it wasn''t always as staunchly Labour in the past as people think it was, I think
    we''ve also had a strong sense of egalitarianism and social democracy and meritocracy
    here. You look back at Robert Burns'' writing, ''A Man''s a Man for a'' and that
    is the kind of Scottish political consciousness. I think that that is also something
    we feel more in tune with the moderate Nordic countries. There are all these historical
    and cultural connections and that is probably why there are tonal similarities
    in a lot of the work.'
