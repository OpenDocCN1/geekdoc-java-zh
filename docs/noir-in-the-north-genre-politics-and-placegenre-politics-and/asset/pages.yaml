    to its primary purpose as a marketing brand.¹⁶ This risk is, as Bruce Robbins
    has remarked in a recent essay, that the statism of Nordic noir, particularly
    left-wing in the Scandinavian crime genre, also offers an outlet for the ‘broader
    and deeper anti-statism’ constituent of the current neoliberal climate.¹⁷ It is
    with the political ambiguities of both postcolonial theory and Nordic noir in,
    that we turn to the close reading of *Borgen* and Trapped.'
