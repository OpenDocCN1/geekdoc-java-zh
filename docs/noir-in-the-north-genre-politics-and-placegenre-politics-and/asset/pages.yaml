  md: '# Contributors


    Maria Mulvany is a postdoctoral fellow at the University College Dublin Centre
    for Cultural Analytics. Her research interest gender and sexuality studies, the
    historical novel, diaries and crime fiction. She co-edited (with Geraldine Meaney
    and Karen Wade) a new multimedia edition of Joyce''s A Portrait of the Art as
    a Young Man (www.joyceportrait100.com).


    Nina Muždeka is an associate professor of Anglophone literatures at the University
    of Novi Sad, Serbia. Her research interests include contemporary literatures in
    English with particular focus on genre theory, gender theory, identity construction,
    transnational studies and global literature. She has published on contemporary
    British and American fiction, as well as in translation, in Australia, the USA,
    Finland, Croatia, Hungary, Romania, Montenegro and Serbia. Dr Muždeka is also
    the author of monographs on the issue of genre in Julian Barnes'' novels (2006)
    and magical realism in Angela Carter''s work (2017).


