  md: '# Interview: Val McDermid


    # What does the notion of Tartan mean to you?


    There are elements of Tartan noir that run through Scottish literary tradition;
    that idea of duality, the doppgänger you see right from the start in The Confessions
    of a justified Sinner, that then goes through Jekyll and Hyde and we make use
    of this, not just in one character who has two faces, but in the Sherlock Holmes
    and Watson kind of things. There is a lot of sense of people in their reverse
    in the stories. And then, there is sense of what Hugh MacDiarmid called “Caledonian
    antisyzygy” – the yoking of two opposing forces. So on the one hand you have Calvinism
    and Presbyterianism and all that dark, poor duty and that that you shouldn''t
    have fun, especially not on a Sunday, and set against that you all have the Gaelic
    tradition of dance and music and laughter and drink. So those two traditions pull
    us individually, as a society and that sets up a dynamic tension quite a lot of
    the time as well. The darkness of being in a country that has no say in its direction
    for 300 years, there are a lot of negatives and frustrations in that. But as someone
    pointed out to me quite recently, which I hadn''t thought before, is it the best
    minds in Scotland running the country that had the Scottish Enlightenment? We
    had the tremendous flourishing of Scottish inventiveness in the nineteenth century;
    Scotland when we built the empire with all the concomitant problems that it has
    historically for, but''s what we did. So all the energies that would be dissipated
    in the running country were set for other. So that is another aspect. What we
    also have in Tartan noir is black humour. The Scots have gallows humour and we
    also laugh in the face of disaster because we had lots of practice and not just
    with the football team. We are accustomed to things going horribly wrong. We are
    very much of the ‘if you don''t laugh you would just put your head in the gavers''
    school of philosophy. Really So that black humour runs like a thread through crime
