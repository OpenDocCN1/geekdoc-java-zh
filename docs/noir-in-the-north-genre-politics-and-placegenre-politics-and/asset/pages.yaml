  md: '# What about the connections between noir and the landscape?


    Scotland and the Nordic countries both share sparsely populated landscape. We
    have a few big cities and towns, but a lot of our landscape, like theirs, is empty
    and startlingly beautiful and changes quite dramatically with the seasons. I think
    it is fair to say in countries like this landscape holds a particular place in
    people''s heads. It is a backdrop to what they think when they think about their
    country. They think about their city or town, but they also think about the Highlands
    and the volcanoes in Iceland or the ice waters or waterfalls. They are just part
    of your consciousness, where you come from. I Scots go out into the wider country
    more than their English counterparts. It seems to me, having lived a long time
    in England also, that when the English go out into the country they go on quite
    manicured country walks, whereas we head off into the hillside and through the
    Machair there is a much greater sense of the wilderness, that you also feel in
    the Nordic countries. And, anything can happen in the wilderness.


    # What are the defining characteristics of noir for you?


    Right from the start, Maj Sjöll and Per Wahlöö (who pioneered modern Scandinavian
    crime fiction with their Martin Beck''s series in the 1960s and 1970s) had a political
    element and dimension where the novels used to make social points as well. They
    are not just about the crime, but the organic nature of the crime and what arises
    from the society that they are policing. They think also, mostly, have a powerful
    sense of teamwork among the detectives. I think they are bleaker than tartan noir.
    You don''t get many laughs in Scandi crime. There is less humour, but much very
    understanding of the social conditions that create the seedbed for the kind of
    crimes they are writing. They often have strong sense of community, the ones that
    are set outside the communities. Karin Fossum is a writer who has a penetrating
    eye for how small communities cohere and how they fall apart. Arnaldur Indriðason
    was the first Icelandic writer I read and was initially captivated by his portrait
    of Reykjavik and an Iceland that is the contrapal opposite to what the Icelandic
    tourist board would like to think of. We are not told about the crimes that Arnaldur
    writes in his books. I also like Asa Larsson. Again, there is that sense of getting
    out of the big city, but her books also have those tentacles that go back into
    city life as a well. Anne Holt I think most of the books and is also lesbian,
    but there is a sense of using the role of the outsider, in a very powerful way,
    in a character who absolutely confounds pity. You won''t feel pity for her, you
    will feel terrified of her.'
