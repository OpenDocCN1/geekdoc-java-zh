    of the Swedish welfare state on the surface of the increasingly neoliberal, capitalist
    society where class differences and segregation are snowballing, and where the
    real power is held by criminal networks.²⁶


    The bad guys, who the police heroes of the modern Swedish police thriller fight,
    tend to come mainly from the world of organized crime, a world that often has
    links to a corrupt upper class — something that was also common in the classic
    hardboiled novels.²⁷ Moreover, corrupt police colleagues and superiors turn out
    to be involved in the crimes with the criminals that the protagonists are fighting,
    and a distrust of high-ranking police officers and the security police, as well
    as people from the upper classes, are also carried over from the police procedural
    tradition originated in Sjöwall and Wahhlö''s leftist novels.²⁸


    More could be written about the new Swedish police thriller. What is clear after
    examining protagonists and crimes in this sample of the most notable contemporary
    police thriller authors, however, is that these novels are similar enough to be
    defined as a separate crime fiction sub-category on the Swedish crime scene today—characterized
    by plenty of action and violence, as well by very complex plots, protagonists
    and crimes. The new police thriller is a fascinating and multilayered crime fiction
    sub-category that simultaneously presents a rather depressing image of human beings
    and of modern Swedish society. Nevertheless, it is also a sub-genre that thrives
    among many of the important new developments in Swedish crime fiction of the 2010s.
    The authors discussed above are generally considered to be some of the most interesting
    and promising new writers on the Swedish crime fiction scene today, and they are
    now being translated, even though they are not well-known as the authors who started
    writing in the 1990s or early 2000s. Similar tendencies could also be found in
    crime fiction from the other Nordic countries, but so far it is only in Sweden
    that the new police thriller has developed such a strong and unified presence.


