    # Nordic noir and the politics of post-coloniality


    Drawing on a range of influences from Anglo-American noir to Scandinavian social
    realism, Nordic noir is best understood as a composite genre. The name reveals
    itself two distinct lineages: ‘Nordic’ designates geographical specificity and
    ‘noir’, an international aesthetic tradition. The term comes into to describe
    the recent titled crime dramas across the Nordic region, but has also come to
    encompass the longer tradition of Scandinavian fiction by authors such as Lisa
    Marklund, Henning Mackenk and Steig Larson from Sweden, Anne Holt and Karl Fossom
    from Norway, Peter Heeg and Leif Davies from Denmark, who have enjoyed international
    success with serialized and standalone novels, several adapted for film and TV,
    the 1990s. With such as *Borgen*, a political drama, and Arvingenge (*The Legacy*,
    2014–17), a family saga, also increasingly categorized as examples of Nordic noir,
    the term has stretched beyond the confines of the police procedural. Moving away
    from the traditional routes of crime fiction, Nordic noir has maintained the element
    of social and political critique, first introduced by Sjöllwall and Wahlöö in
    the Martin Beck series (1965–75), which has become a defining feature of the genre.
    It is social and political impetus of Nordic noir that makes it particularly interesting
    to think about how the colonial past and present are represented (or not represented)
    in popular culture, and for raising questions about the legacies of Danish rule
    in the North Atlantic.


    It is easy to assume that the culture of national self-criticism characteristic
    of Nordic noir results in an engagement with the region’s colonial history, however,
    this has not been the case. In her work on Danish colonial history and journalistic
    practice Elle Blagaard argues that Denmark’s involvement in colonialism and the
    slave trade have been so thoroughly ‘concealed in the social imaginary’, that
    ‘Danes have been able to blot out consciousness of those who helped to accumulate
    the wealth through colonialism’; wealth, which also adds, allowed Denmark to construct
    the modern welfare state.* A notable exception of where crime fiction has engaged
    in post-colonialism is Peter Heeg’s *Froken Springens fornemmelse for sne* (1992,
    *Miss Smillas'' Feeling for Snow*, 1993), in which Heeg offers a sustained critique
    of the Danish state’s involvement in colonialism and poor treatment of the Greenlandic
    population who reside in Denmark. However, the fact that critical reviews remain
    contemporary with the novel’s publication evaded Heeg’s critique of Danish colonialism
    almost entirely highlights, the ‘curious neglect’ of the nation’s colonial history
    within Danish society;¹⁰ Although there has been a recent increase in scholarly
    publications on Nordic colonialism (see'
