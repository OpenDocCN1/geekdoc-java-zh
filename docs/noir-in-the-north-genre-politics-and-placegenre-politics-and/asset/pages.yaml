    # The verdict


    Despite all of the above, some might still be inclined to ask what does it matter
    if we call Scandinavian police procedurals Nordic noir? In other words: what’s
    in a name? To begin, it is most illogical: as an exercise, imagine if we decided
    not to limit it to the Nordic region but call all procedurals noir – it would
    be nonsensical. One might just call everything noir police procedurals. Critics
    and scholars coined and developed the concept of noir for a reason – indeed primarily
    to distinguish the texts in question from such police narratives. The term ‘Nordic
    noir’ is therefore highly misleading and politically problematic. To call the
    procedurals Nordic noir is to give the texts an antisocial flair and stylistic
    sensibility that is completely at odds with their broad social and aesthetic conformity.
    Nordic noir’s primary crime is to appropriate a concept that developed to not
    only distinguish between outside noir and inside policy,


    The naming is guilty of a few other misdemeanours as well. It leaves an actual
    noir tradition, and one that importantly prefers the current Nordic noir phenomenon,
    in a conceptual wilderness. It should not surprise us that noir originated primarily
    in the big cities of California; Los Angeles and San Francisco, during the great
    upheaval and turmoil of the interwar era, with its relatively weak social institutions
    and rampant criminality, and that has emerged around the world primarily in places
    going through similar social upheaval and transformation.⁴ Conversely, it should
    not surprise us either that the Swedish police originated at the height of the
    welfare system with its strong social institutions and regulations, and general
    belief in the state as a safeguard for the well-being of its citizens. However,
    noir and the North need not be mutually exclusive. Indeed, while the procedural
    became the norm in Scandinavian crime fiction, there also dissenting voices that
    lay much closer to noir and hardboiled fiction. I have noted elsewhere, these
    Danish or Swedish and Icelandic or Icelandic that may very well have something
    to do with their marginality in the Nordic region.⁵ As The Story of Crime drew
    to a close, Norwegian author Gunnar Staalesen begins his series of private detective
    V Vum, drawing explicitly upon the hardboiled tradition, including the first-person
    narration and wise-cracking detective made famous by Chandler.⁶ Many of the Veum
    novels, unlike their better known Scandinavian counterparts, hold onto the separation
    between the main character and the police. Even more noir-like is the Finnish
    Vares series (2004–12) with its down-and-out private'
