  md: '# Chapter 1


    # INTRODUCTION: NOIR IN THE NORTH


    Gunnthorunn Gudmundsdottir and Gerardine Meaney


    # Transnational noir


    Crime fiction is both a distinctive genre and a global transmedia form. As is
    abundantly evident from the contributions to this volume, it is a dynamic and
    hybrid genre, deeply intertwined with the history of film and the novel, and is
    a mainstay of television production. A transnational form, is embedded in national
    cultures and canons, regularly ascribed conservative and even imperialist tendencies,
    constantly evolving in response to social change, local, national and transnational
    concerns. A noir sensibility has, by contrast, always associated with subversion
    and disturbance. While noir fiction, in the form of American writers like James
    M. Cain and Dashiel Hammett, preceded his cinematic form, the name comes from
    transatlantic film studies, specifically a French avant-garde reconstruction of
    American cinema which foregrounded its murky, discontented, scandalous edges.
    In its European context, noir was re-purposed not only as an interrogation of
    the dark underbelly of the American Dream, but of the human condition. In some
    ways, however, European influences were already there, as Delphine Letort draws
    attention to Chapter 3, with the "influence of European immigrant directors in
    the development of Hollywood noir [...]; among many of them have adopted American
    hard-boiled novels and scripts." Patrick Raynal, editor of Gallimard’s *Série
    noire*, proclaimed as late as 1995:


    If we can define noir writing and noir inspiration as a way of looking at the
    world, the dark, opaque, criminal side of the world, shot through with the intense
    feeling of fatality we carry within us due to the fact that the only thing we
    can know for certain is that we will inevitably die, then it can indeed be said
    that Oedipus Rex was the first noir.


    Raynal’s understanding of literary noir as part of the tradition of tragedy is
    in keeping with some of the earliest reception of "Nordic noir", which positioned'
  merge: -1
  pgno: 17
