    # Urban and organized criminality


    Many of the new police thriller stories, some of which have been recounted above,
    might seem a bit over the top – while the characters can sometimes seem almost
    a super-hero, surviving the most impossible situations—the settings, crimes and
    topics addressed in these novels generally constitute realistic portrayals of
    contemporary Sweden. It is always urban Sweden that is depicted, primarily cities
    like Stockholm and Malmö, and this is something that the police thriller has in
    common with the typical police procedures of the Sjöwall and Wahlhöd.²³ The crimes
    of the police thriller are also more similar to those of the urban tradition,
    and the protagonists of the new police thriller are mainly dealing with different
    types of organized crime, not with crimes that are primarily linked to the individual
    and as personal as the police sets in the countryside.²⁴


    In his crime novels, Jens Lapidus depicts how invisible power structure of organized
    crime lurking under the official surface of Stockholm, and he shows how all power,
    political as well as economic, lies in the hands of this underneath of society.
    In Lapidus novels it often seems as if the people who are officially in power
    – politicians, people in finance and business, as well as people working in the
    legal system – are just puppets, while the criminals are the ones pulling the
    strings.² The connections between the official and the criminal world are many
    and complicated in Lapidus'' novels, and major sections of society are shown to
    be corrupt, its officials driven by both greed and fear. In many ways this portrayal
    of contemporary Sweden is reminiscent of the United States in the classic American
    hardboiled novels by authors like Dashiell Hammett and Raymond Chandler, although
    there are some faint'
