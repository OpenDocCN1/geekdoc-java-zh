    # Tracing the evidence


    Much more than noir, crime fiction is an umbrella term. Although there is no consensus
    about the nature of sub-groups/sub-genres, the broad strokes are generally agreed
    upon. John Scags splits the field into mystery/detective fiction, the hardboiled
    movie, the police procedural, crime thriller (includes noir thriller) and historical
    crime fiction. More recently, Peter Messent divided it into classical detective
    fiction, hardboiled detective fiction, the police novel and transgressor narrative
    (which by means approximately the same as Scags'' noir, or what might be described
    as the James M. Cain arm of hardboiled fiction). Spy fiction and gangster literature
    are typically separate, as somewhat what related genres. The emerging with Edgar
    Allan Poe, crystallizing as a genre in English what we now call crime detective
    fiction, and then challenged or opposed by American hardboiled fiction during
    the interwar era, with the police procedural making a later arrival during the
    Naked City (1948) and Dragnet (1950). It is also well known that the noir itself
    was introduced in France to describe first translations of hardboiled American
    novels (from the covers of Série) and later direct and vision films of very some
    stories, giving us ''film noir''. As French cinephiles and film critics recognized,
    these films offered something of a counter-narrative to conventional and upbeat
    Hollywood entertainment in their focus, tough-talking and hard-hitting (and sometimes
    unlawful) private detectives, dangerous female fates, untamed passions, dark city
    settings, etc. As I will ultimately conclude, Scandinavian crime fiction, film
    and television share few of these attributes.


    In the 1946 essay ''A New Kind of Police Drama: The Criminal Adventure'', which
    heralds the idea of film noir, Nino Frank singles out four films that ever since
    have been central to the canon: The Maltese Falcon (1941), Double Indemnity (1944),
    Murder, My Sweet (1944) and Laura (1944). Frank sees these films as deviating
    from conventional crime films or the film equivalent of classical detective fiction.
    In fact, he says the films ''belong to that which we used to call the crime film,
    but would be best described from this point by a term such as criminal adventures
    or, better yet, as criminal psychology''.'
