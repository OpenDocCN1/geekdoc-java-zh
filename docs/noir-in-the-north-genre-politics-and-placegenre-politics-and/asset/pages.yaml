  md: '# FOREWORD


    Yrsa Sigurdóttir


    Ever since the appearance of crime fiction in the 1800s, novels that fall into
    this genre have been immensely popular with readers in most corners of the world.
    The reason behind this popularity is hard to pinpoint precisely, although numerous
    theories have been set forth. Crime novels are said to provide a safe thrill,
    that is easily turned off by putting the book down. They are also said to appeal
    to the human longing to know and understand everything. Before the reader is a
    puzzle of sorts, with the reader and the writer, an unspoken agreement that all
    will be cleared up at the end. This itself is not the only aspect that keeps readers
    turning the pages, the novel must also be well written and the characters engaging
    and relatable. It is at least obvious that if murder and mayhem are the only appeal,
    readers could get their fix from reading the news.


    Crime fiction are varied as the authors that write. Various genres exist: everything
    from what is referred to as cozy crime to psychological thrillers, and even cat
    noir, wherein a cat features prominently in the investigation. There is certainly
    something for everyone. A distinction is often made between crime novels and thrillers,
    a classification that in most part is dependent on the novel''s pacing. In a crime
    novel, the story often begins with the awful event, almost always a murder, and
    the reader is led through the pages, along the path of discovery until all is
    settled and the villain is unmasked and apprehended. This path can be littered
    with further bodies, but make no mistake, the reader is headed for the restoration
    of normality. In thrillers, however, the awful incident is about to happen. It
    is going to happen, or is it not going to happen? Usually it does.


    Unlike as it may be, the Nordic countries have somehow managed to become a powerhouse
    of the crime fiction market. Sweden, Norway, Denmark and Finland usually find
    themselves aligned-by-side at the top of lists as the most peaceful countries
    and the happiest countries. Yet their crime authors are regularly seen in the
    top spots of bestseller lists the world over. Despite many years foretelling the
    demise of this popularity, Nordic noir has not let go of its strong foothold,
    and there are no indications that it is losing ground. Much like in thrillers,
    the predicted doomsday occurrence will probably not take place.


    The popularity of Nordic noir is a prevalent topic in the crime fiction world.
    Nordic noir authors are more frequently asked for their views on the subject,'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'xiv


    # Foreword


    and they are asked where they get their ideas. And that is saying something. The
    reason why this question is so often posed is because there is no sole, definitive
    and correct answer. Taste, be it in literature, food or art, is very hard to pinpoint.
    It varies greatly between individuals, and furthermore, evolves and changes for
    reasons that are not always easily identifiable. Being said, the most commonly
    referred to aspects of Nordic noir that are said to influence its popularity is
    the sparse writing style, the focus on social issues, the inking of an underside
    to a seemingly perfect society, the well-drawn ''defective detective'' protagonist
    and the presence of snow. Yes, snow. Preferably selected with blood. But even
    snow is not present in every crime novel that comes out of the Nordic countries,
    much less of the others. If you randomly pick a Nordic noir novel off a bookshelf,
    however, you are more likely to find some, if not all, of these factors within
    its pages than you would if the book originated from other countries.


    With respect to the characteristics above, many of those asked to sway to the
    side of social commentary when it came to the popularity of Nordic crime fiction.
    It is of course not present in every novel written by Nordic crime author, but
    it is very often present, in a very apparent way or more subtly. The origin of
    its injection is no mystery. Anyone familiar with Nordic noir Sjjöwall and Per
    Wahlöö, heralded heralded as the first authors to utilize the crime novel as a
    vehicle for social criticism. They managed to entertain their readers and keep
    them while simultaneously raising their awareness of injustice or dangerous social
    trends. It is no wonder then, that the Nordic noir authors who followed them aspire
    to achieve the same. Some writers manage to do this very well, others not at all.
    As mentioned, the authors writing crime fiction, be it Nordic noir or other sub-genres,
    are an extremely diverse bunch. They come from various different countries, all
    age groups, all genders, levels of society and tend to have a much more varied
    educational background than authors in other branches of literature. This ensures
    that the genre presents an extremely broad horizon, which is possibly why it is
    thriving.


    When it comes to crime fiction female writers occupy much greater scale than other
    types of literature, aside from romance novels. Many of the widest read contemporary
    crime authors are female, and Agatha Christie is not only the most important author
    of golden age crime fiction, she is also the world''s bestselling author of all
    time. With the increased popularity of the psychological and domestic thriller,
    it is now more likely that an initiated author''s name is a male author, while
    until recently it was given that this author was a woman hoping to be perceived
    as a man by hiding their given name. Hopefully, in future, an author''s gender
    will be a non-issue and such initials will only be used to mask a very ''un-sellable'',
    complex or unappealing name, as all genders are just capable of writing quality
    crime fiction, and any other type of fiction come to that.'
