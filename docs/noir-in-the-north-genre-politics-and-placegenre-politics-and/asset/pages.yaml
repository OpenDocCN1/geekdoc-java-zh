    of political engagement and strong social commentary alongside the basic crime
    investigation plot in the form of police procedures. This holds true for other
    regional variants of Nordic noir as well. In Norwegian noir, the investigation
    of socio-political themes starts with a criminal act as a disruption of the established
    order. Writing about noir fiction in general, Cowart found that Every detective
    story concerns an encounter with vice, inherent or otherwise. The more inherent
    the vice, however is if for Nordic noir – and subsequently Norwegian noir – is
    the fact that vice is present in both the conspiracy and plotting at the highest
    levels of society and the state, and in actual representations of it, in the form
    of murders and violence, and that the narrative depicting this vice acts as a
    vehicle for authors'' socio-political commentary. This strategy allows for a simultaneous
    investigation into vice on both levels: where professional and amateur detectives
    uncover details of the murder(s) in question, they also reveal unlawful and unethical
    behaviour on a higher, more encompassing and influential level. By resolving the
    conundrum of the initial crime at a micro level of their investigation, the detectives
    also expose the perpetrators of crimes that have significantly greater consequences
    for the society and state as a whole. The process of solving the crime coincides
    with the process of rectifying social stories and re-establishing the social order,
    at least for the time being. Reifying lies the authors'' social – and often political
    – for the textual world clearly and poignantly corresponds to the extra-textual.
    Sjwall and Wallh denounced their Swedish welfare government as too capitalistic
    and failing to provide an adequate state-supported environment for its citizens.
    Norwegian noir shows that the threatened breakdown of a well-organized and dependable
    social welfare state and its egalitarian democracy, at the cross-section of the
    most favourable features of socialism and capitalism, further disrupts the safety
    and ease of society. By aiming to protect the marginalized and the poor, the Scandinavian
    welfare-state model is marked by the comprehensiveness of social security systems,
    institutionalized universal social rights, a high level of public support, and
    a high level of equality. With the advent of globalization in contemporary society,
    this model is tested.


