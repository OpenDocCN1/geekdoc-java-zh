    crime, which Marx would suggest a method of demanding citizens justify themselves
    as worthy of the state, rather than the other way around. In doing so, the series
    exposes latent fascist tendencies in the welfare state. It also reveals an important
    feature of these tendencies that make their tracking spirit difficult: they are
    not necessarily the result of precise or deliberate directives. Instead, they
    are the result of a gradual and uneven re-interpretation of welfare ideals through
    neoliberal logics.


