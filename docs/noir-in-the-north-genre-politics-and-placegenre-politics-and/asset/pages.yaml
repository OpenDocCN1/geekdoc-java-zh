    at the mercy of nature, it remains, to many Icelanders, a source of great pride
    to assert not only their dominance over it, but be able to turn it into a money-making
    resource. This attitude towards the northern landscape is neither new nor particular
    to Icelanders. As Davidson points out, the North as a source for treasure hunting
    is as old as other ideas about North, a fact that has received more international
    attention in recent years which have exposed the fragility of the North in the
