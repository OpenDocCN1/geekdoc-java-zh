  md: '# A changing crime fiction scene


    The urban tradition and the rural tradition of police novels were both thriving,
    as they still are, and constituted parallel paths in Swedish crime fiction success
    during the early 2000s. Nevertheless, following Stieg Larsson''s success with
    the Millennium trilogy, published from 2005 to 2007 (the English translation in
    2008-09), the Swedish crime fiction scene fundamentally changed. Inspired by Larsson''s
    success, authors realized that they could still be successful crime writers if
    they were not writing traditional police novels, which had previously been the
    norm and dominated the crime fiction genre in Sweden. The crime writers enjoyed
    their new ''freedom,'' Larsson''s elaborate playing with crime fiction sub-genres
    generated a veritable flood of new genre hybrids, as well as crime novels emanating
    from sub-genres other than the police procedural, and his Salazar creation inspired
    new types of detective characters. The police novel remained important, but became
    one of many genres.


    Some authors tried to follow the established genre patterns of specific crime
    fiction sub-genres closely. Representative examples would be Åke Edwardson with
    Möt i Isteena (Me in Isteena, 2011) and Martin Holmén’s Clinch (2015; Clinch,
    2016), two novels that revive the hardboiled crime novel from the first half of
    the twentieth century, and thus have a strong retro feel to them. Most authors,
    however, started to mix different crime sub-genres, including substantial components,
    picked up either from the psychological thriller or from the international/political
    thriller genre. The latter seemed particularly surprising in the Swedish context,
    where – with the exception of Jan Guillou’s Coque Rouge series from the 1980s
    – the political thriller had previously been an almost non-existent crime fiction
    sub-genre, not at all in modern Danish crime fiction for example, where the political
    thriller had been an important and very lived genre since the 1970s. However,
    the psychological thriller has been the sub-most influential to the new crime
    fiction genre hybrids in Sweden post Stieg Larsson. Actually, there are very few
    crime novels today of the last years, and inspired by international bestsellers
    Gillian Flynn’s Gone Girl (2012) and Paula Hawkins’ Girl on the Train (2015),
    ‘domestic noir’ novels by authors like Caroline Eriksson, Elisabeth Norebäck and
    many others, have also revived the more traditional form of the psychological
