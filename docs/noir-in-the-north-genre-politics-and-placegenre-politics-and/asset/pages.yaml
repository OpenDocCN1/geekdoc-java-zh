  md: '# Chapter 10


    # DARK NIGHTS AND MORAL DIVERSITY;

    RE-THINKING MORALITY IN NORDIC NOIR


    Mary Evans


    This chapter''s concern is morality, always a central theme of detective fiction.
    The particular focus here is the way in which that collective fiction known as
    Nordic noir has conceptualized morality. My argument is that in this fiction new
    lines are being drawn about moral boundaries, as Nordic noir has at its core highly
    critical views about the contemporary world. At the same time, it has to be said
    what Nordic noir has also done, as it has dramatically moved some of the goal
    posts of detective fiction, is to identify the very good and the very bad in original
    but important places, places that are very much of life in the Global North in
    the twenty-first century.


    It would, wrong to suppose that Nordic noir stands out as unrelated, and distant
    from, other contemporary forms of detective fiction. Indeed, Nordic noir has much
    in common with other forms of noir: particularly that of tartan and what we might
    see emerging as a distinctly English form of noir which can be called Historical
    noir. This implies, through the means of detective fiction, the recovery of those
    hidden aspects of the British Empire that mainstream British culture and politics
    has not encouraged people to examine too closely. It is only that the days of
    the British Empire have received consistent and public scrutiny, with ‘markers’
    of that empire, such as public statues, accruing increased criticism². Hiding
    the hidden, or what is not said, are central themes in crime fiction. From the
    earliest days of its genesis, crime fiction has recognized the potency of the
    need to hide; revelation is not to be feared, although theme has previously been
    applied more frequently to individual characters rather than historical events.
    Agatha Christie in particular was an early exponent of this former tradition.
    English writers of detective fiction are now seizing on this ‘hidden’ history.
    In this, writers encounter a British state that has maintained an energetic and
    often effective covering up of unacceptable evidence. A second point needs to
    be established here, in linking Nordic noir with other forms of noir, is its presentation
    of the growing social and political polarization within its'
  merge: -1
  pgno: 159
- img_proc: true
  md: 'own societies and much of Europe and the USA. This recognition of growing social
    inequality has become commonplace and standard across the political spectrum.³
    Equally important are the forms of political and social separation around material
    issues such as migration and unemployment, topics which are themselves translated
    into concerns about national and individual identity.


    So, Nordic noir has much in common with other detective fiction, it also has one,
    and in many ways exceptional characteristic. That feature is the actuation of
    the increase to increase the possible extent of the contexts for moral judgement.
    This is not to show that detective fiction has not always created a wide range
    of guilty, murderous individuals; a long line of writers created fiction from
    all over the world we have done, and continue to do this, but this is the shift
    from individual guilt to collective institutional and hegemonic cultural guilt.
    The latter is now named as the origin of murderous intent: motive does not come
    simply from the various entanglements of personal and family circumstances, but
    from an impersonal of increasingly coercive values and assumptions. This might
    be named as ‘normative orthodoxy’ or in other sociological terms. The point here
    is that this shift in responsibility for the origin of crime (in the case of detective
    fiction, murder) is to the collective and collect away from the individual psyche.
    But here again the collective intervenes: that psyche becomes murderous and endorsed
    by few forms of social norms. Anyone who has read Tana French or Stieg Larson
    or Jo Nesbo will probably recognize this thesis: the actuation of the view that
    institutions, be they of the property market or various aspects of the welfare
    state are themselves morally dubious. All these authors have written of corruption
    and more, the corrupting power of institutions and ideas. What emerges is that
    no do some form of the seven deadly sins inform and inspire crime (usually greed
    or envy) but that the very institutions of the world in which we live are morally
    suspect if not actually indefensible. It is a view which informed some of the
    work of the Swedish writers Maj Sjwall and Per Wahlöö, whose work was published
    in the 1970s, long before there was any identification of Nordic noir.¹ The difference
    here is that the central detective of Sjwall and Wahlöö’s novels, Martin Beck,
    was not an outsider, and that at least some of the public institutions with which
    he dealt remained positive.


    Yet, the view from the worlds of detection about the growing moral illegimacy
    of conventional institutions is also a view which is familiar to watchers of the
    real-life political scene. In the last five years the most important political
    movements in the USA have been the Tea Party and the Occupy movements, which across
    Europe there has a rise in the number of people supporting political parties on
    the right of the political spectrum. From very different parts of this spectrum,
    these groups of individuals have proposed that the very worlds within which we
    live have be re-made and re-thought. The most striking feature of politics is
    that this radically'
