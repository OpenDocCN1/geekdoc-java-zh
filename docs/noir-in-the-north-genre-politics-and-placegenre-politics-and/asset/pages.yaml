    # Complex protagonists on both sides of the line


    Anders de la Motte, a former police officer, made his debut as a crime game trilogy,
    a series that had much in common with Lapidus'' Stockholm Noir novels. What de
    la Motte one of the most important names of the new police thriller is, however,
    his second series, so far consists of the two novels MemoRandum (2014, MemoRandom,
    2015) and UltiMatum (2015, Ultimatum/The Silenced). The latter book received the
    Swedish crime of the year award from the Swedish Academy of Crime Fiction in 2015,
    while the former was nominated for the same prize – something that also speaks
    to the importance and status of this new sub-genre in Sweden.


    In de la Motte''s MemoRandum and UltiMatum we meet David Sarac, a police detective
    who is handler in the Intelligence Unit of the Stockholm Police Force. His job
    is to recruit and support informants who help the police fight organized crime.
    But when Sarac at the beginning of MemoRandom crashes his car into a wall, he
    wakes up in hospital with no memories of the last few years of his life, and more
    disturbingly, no memories of his most valuable informant, Janus, whom it becomes
    urgent to identify and re-connect. With no idea who he can trust, and that almost
    everybody around him – and perhaps himself – is corrupt in one way or another.
    The second novel, UltiMatum, starts with Sarac escaping from a psychiatric clinic,
    where he has been locked up after the events of the first novel. Soon his old
    colleagues are investigating the complicated murder of an unidentified man whose
    body has been cut to pieces. The story contains many unexpected twists, and spans
    everything from Stockholm''s criminal underground to the country''s highest political
    circles.


    Sarac is a typical protagonist of this type of police thriller. He works for the
    police, but often crosses the boundaries of the law. The main character of Anna
    Karolina''s police thrillers is a similarly representative example. In her first
    novel, Stöld av babian (2014; Savage Congress, 2016), her protagonist Amanda Paller
    has recently finished her police training and started working as'
