    \ or ascending order. When writing programs, you may combine ascending and descending\
    \ variables in a single `for` loop. In addition, an ascending variable can go\
    \ from 1 to 1024 because `for` loops support arithmetic operations (e.g. addition,\
    \ multiplication, etc.).\n\n**Important Note:** All of the parts of a `for` loop\
    \ are optional. You can create an infinite `for` loop by leaving blank spaces\
    \ on the syntax. Here’s an example:\n\n![](images/00026.jpeg)\n\nAt this point,\
    \ you’re ready to learn more about the different sections of the `for` loop.\n\
    \n### The Initialization\n\nA `for` loop can possess an initializing fragment:\n\
    \n```csharp\nfor (double sample = 1; …;   …)\n{\n    // You can use the “sample”\
    \ variable here.\n}\n// You can’t use the variable here.\n```\n\nC# programs execute\
    \ this fragment once, right before running the `for` loop. Often, programmers\
    \ use an initializing fragment to create a counter (also known as “loop variable”)\
    \ and assign its initial value. This counter is available and usable when inside\
    \ the loop’s body. C# allows you to declare multiple variables using a single\
    \ initializing fragment.\n\n### The Condition\n\nObviously, a `for` loop needs\
    \ a conditional expression. Here’s a sample:\n\n```csharp\nfor (double sample\
    \ = 1; sample < 5; …)\n{\n    // This is the loop’s body.\n}\n```\n\nComputer\
    \ programs evaluate the conditional expression before running the loop’s body.\
    \ If the result is “true”, the body of the loop will run; otherwise, the involved\
    \ program will jump to the statements written after the current loop.\n\n### The\
    \ Update Statement\n\nThis is the final part of a `for` loop. Basically, an update\
    \ statement updates the loop’s counter. Let’s use the code snippet given above:\n\
    \n```csharp\nfor (double sample = 10; sample > 1; sample--)\n{\n    // This is\
    \ the loop’s body.\n}\n```\n\nThe program executes this part after running the\
    \ loop’s body. Keep in mind that this statement updates the counter’s value.\n\
    \n### The Loop’s Body\n\nThis part consists of C# statements. It can utilize the\
    \ variables you declared in the loop’s initializing fragment. Check the example\
    \ below:\n\n```csharp\nfor (double sample = 10; sample > 1; sample--)\n{\n   \
    \ System.Console.WriteLine(sample);\n}\n```\n\n### The Continue Operator\n\nIn\
    \ some cases, you need to stop the active iteration without ending the loop itself.\
    \ You can accomplish this task using the C# operator called `continue`. The example\
    \ given below will illustrate how this operator works:\n\n![](images/00027.jpeg)\n\
    \nThis code computes the total of all the odd numbers within the range (1 to n),\
    \ which produce remainders when divided by 7.\n\n### The “Foreach” Loop\n\nJust\
    \ recently, C# introduced the concept of `foreach` loops (i.e. extended `for`\
    \ loops). This loop concept is also available in other programming languages such\
    \ as C, VB, C++, PHP, etc. With this programming tool, you can run all of the\
    \ elements of a list, array, or other groups of values. A `foreach` loop takes\
    \ all of the existing elements even in non-indexed data groups.\n\nWhen writing\
    \ this kind of loop, use the following syntax:\n\n```csharp\nforeach (type name_of_variable\
    \ in name_of_group)\n{\n    the_statements;\n}\n```\n\nAs you can see, this loop\
    \ is much simpler than a typical `for` loop. A `foreach` loop can help you scan\
    \ all of the objects inside a collection quickly. It’s no surprise that countless\
    \ programmers use this loop in writing their codes.\n\n### The Nested For Loop\n\
    \nC# allows you to place a `for` loop inside another `for` loop. The loop at the\
    \ innermost part of the code runs the most number of times. The one at the outermost\
    \ section, on the other hand, gets the least number of repetitions. You should\
    \ use the following syntax when “nesting” for loops:\n\n```csharp\nfor (initializing_fragment,\
    \ condition, update_statement)\n{\n    for (initializing_fragment, condition,\
    \ update_statement)\n    {\n        statements\n    }\n}\n```\n\nHere, the program\
    \ runs the initial `for` loop, executes its body, and triggers the nested loop.\
    \ The program will check the second loop’s condition and execute the codes inside\
    \ it until the evaluation becomes false. Then, the program will make the necessary\
    \ adjustments on the loops’ counters. The program will repeat the entire process\
    \ until all of the conditions evaluate to false.\n\n# Chapter 8: The Methods of\
    \ the C# Language\n\nThis chapter will focus on the C# methods. Here, you’ll learn\
