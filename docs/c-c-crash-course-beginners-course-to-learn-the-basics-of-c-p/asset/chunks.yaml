    Console.WriteLine(\"Hello!\");\n```\n\n### 它是如何工作的？\n\n学习编程语言的最佳方法是编写代码。这种方法将帮助你理解该语言。这个程序由三部分组成：\n\
    \n1. 类定义\n2. 方法定义\n3. 内容\n\n### 类定义\n\n根据计算机专家的意见，学习编程语言的最佳方法是编写代码。这种方法将帮助你理解该语言。这定义了类：\n\
    \n```csharp\nclass HelloCSharp\n{\n```\n\n### 方法定义\n\n根据计算机专家的意见，学习编程语言的最佳方法是编写代码。这种方法将帮助你理解该语言。语法如下：\n\
    \n```csharp\n    static void Main(string[] args)\n```\n\n### 方法的内容\n\n根据计算机专家的意见，学习编程语言的最佳方法是编写代码。这种方法将帮助你理解该语言。方法的内容为：\n\
    \n```csharp\n        Console.WriteLine(\"Hello, World!\");\n    }\n}\n```\n\n\
    ## 编写代码时需要记住的规则\n\n### C# – 一种大小写敏感的计算机语言\n\n这种语言对大小写敏感。这意味着在输入 C# 时，你需要注意字母的大小写。基本上，C#\
    \ 将 `power`、`Power` 和 `POWER` 视为三个不同的对象。\n\n### 使用正确的格式\n\n你需要在代码中添加制表符（tabs）、空格和换行符，以提高其可读性。这些被\
    \ C# 编译器忽略的字符为你的源代码提供了极佳结构。\n\n例如，你可以移除 `HelloCSharp` 代码中的换行符：\n\n```csharp\n\
    class HelloCSharp{static void Main(string[] args){Console.WriteLine(\"Hello, World!\"\
    );}}\n```\n\n或者，你可以移除其中的制表符：\n\n```csharp\nclass HelloCSharp\n{\nstatic void Main(string[]\
    \ args)\n{\nConsole.WriteLine(\"Hello, World!\");\n}\n}\n```\n\n## 如何正确格式化代码\n\
    \n在格式化源代码时，你需要遵循以下规则：\n\n- 你可以在类定义内部对方法进行缩进。C# 允许在格式化源代码时使用任意数量的制表符。\n- 你应该对方法的内容进行缩进。\n\
    - 将左大括号 `{` 放在它所属的类或方法下方。最好让它成为该行中的唯一字符。\n- 确保右大括号 `}` 与左大括号垂直对齐。\n- 类名应以大写字母开头。\n\
    - 变量名应以小写字母开头。\n\n"
