    *   The “else” keyword – This is a C# keyword that triggers the “else” clause.


    *   The else clause’s body – This is identical to the conditional statement’s
    body (see above).


    When working on an if-else statement, the computer program analyzes the value
    within the parentheses. The value needs to be Boolean (i.e. either true or false).
    If the value is “true”, the program will execute the conditional statement’s body
    and ignore the “else” clause. If the value is false, however, the program will
    run the else statement’s body. Analyze the following example:


    int a = 100;


    if (a != 50)


                  {


                  Console.WriteLine(“The variable is not equal to 50”);


                  }


    else


                  {


                  Console.WriteLine(“The variable is equal to 50”);


                  }


    }


    You can interpret this code as: if a != 50, the console will print: “The variable
    is not equal to 50”. On the other hand, if a = 50, the console will show: “The
    variable is equal to 50”. Since the variable named a holds 100, your command prompt
    will give you this:


    ![](images/00022.jpeg)


    Nested Statements


    In some cases, you need to write an “if” statement inside another “if” statement.
    Programmers refer to this process as “nesting”. That means you are “nesting” a
    conditional statement if you are writing it inside another conditional statement.


    Important Note: C# allows you to nest if-else statements. In this situation, each
    “else” clause points to the “if” clause that comes before it. This simple rule
    can help you analyze nested conditional statements, which can be extremely complex.


    According to expert programmers, you should not create more than three levels
    of nested statements. If you really need to use four or more conditional structures,
    export them to a different method (You’ll learn about methods later.).


    The code given below will show you how nested “if” statements work:


    int a = 10;


    int b = 20;


    if (a > b)


    {


                  Console.WriteLine(“a is greater than b”);


    }


    else


    {


                  if (a < b)


                  {


                                Console.WriteLine(“a is less than b”);


                  }


                  else


                  {


                                Console.WriteLine(“a is equal to b”);


                  }


    }


    The Switch-Case Statement


    Programmers use a switch-case statement in situations where the possible answers
    are numerous. Here’s the syntax of a switch-case statement:


    switch (selector)


    {


                  case first_integer:


                                statements;


                                break;


                  case second_integer:


                                statements;


                                break;


                                default:


                                              statements;


                                              break;


    }


    Basically, selectors are expressions that return usable values (i.e. values that
    you can compare or process). The “switch” keyword compares the selector’s value
    against the “cases”. If the value of the selector matches that of a case, the
    statements assigned to that case will run. If there’s no match, however, the program
    will execute the default statement/s (if any). That means the program will analyze
    the selector first before running any statement.


    Important Note: Make sure that the cases have unique values. If two or more cases
    share the same value, your program will produce undesirable results.


    As you can see, each case has a “break” clause. The “break” clause terminates
    the body of the case to which it belongs. C# requires you to add this clause to
    all of your switch statements.


    You don’t have to place the “default” part at the end of your switch-case statement.
    However, this position is recommended if you want to keep your codes readable.


    Chapter 7: The Loop Statements


    This chapter will teach you how to use loop statements. As a programmer, you’ll
    use a loop statement to run certain code blocks repeatedly. Loops play an important
    part in C# programming. Hence, you should study this material carefully as well
    if you want to master this language in 7 days.


    Loops – The Basics


    While creating programs, you often need to execute code sequences multiple times.
    Typing the same blocks of code several times can be extremely boring. Thus, you
    need to find a quick and simple way to repeat codes. Fortunately, the C# language
    supports loop statements.


    A loop is a tool that runs code fragments repeatedly. You can use it to run codes
    for a certain number of times or as long as a given condition is fulfilled. C#
    offers different types of loop statements. Let’s analyze each type in detail:


    The While Loop


    This is the simplest loop statement in C#. Its syntax is:


    while (the_assigned_condition)


    {


                  the_loop’s_body;


    }


    In this syntax, “the_assigned_condition” is an expression that produces a Boolean
    value. This condition dictates how many times the “body” will run. The “body”,
    on the other hand, is the statement (or group of statements) that you want to
    execute.


    The diagram given below will illustrate how while loops work:


    ![](images/00023.jpeg)


    When working on a “while” loop, a C# program checks the value of the Boolean expression.
    If the value is “true”, the program will run all of the statements within the
    loop’s body. Then, the program will check the Boolean expression to see its value.
    If the value is still true, the program will rerun the loop’s body and go back
    to the first step (i.e. check the expression’s value). This process will go on
    until the Boolean expression evaluates to false. Once this happens, the program
    will process the code blocks right after the loop.


    Important Note: Your C# program won’t run the while loop’s body if the Boolean
    expression is false. Thus, if the B00lean value is false when you launched the
    program, your in-loop statements will never be executed.


    The following example will illustrate how while loops work:


    int timer = 10;


    while (timer >= 0)


    {


    System.Console.WriteLine("Time remaining: " + timer);


    timer--;


    }


    If you will compile and execute this code, your command prompt will print this
    data:


    ![](images/00024.jpeg)


    The Break Operator


    You can use “break” (a C# operator) to exit a loop prematurely. Programmers use
    this operator if they don’t want to wait for the loop’s natural termination. Basically,
    a loop will end once it encounters a break operator. This situation forces the
    program to jump to the code fragments right after the loop.


    In C#, you can only use this operator inside the loop’s body. That means “break”
    will only work while the loop is running.


    The Do-While Loop


    A do-while loop is almost identical to a while loop. The only difference between
    these loops is that the former analyzes the Boolean value after running the loop’s
    body. Thus, you can rest assured that your codes will run at least once even if
    the Boolean expression is false. Here is the syntax of the do-while loop:


    do


    {


                  statements;


    } while (Boolean expression)


    Do-while loops work according to this pattern:


    ![](images/00025.jpeg)


    The program will execute all of the statements within the loop’s body. Then, it
    will check the condition (i.e. the Boolean expression). If the condition evaluates
    to true, the program will execute the loop’s body again and perform the “value
    inspection”. This process will go on until the condition becomes false. Thus,
    your codes might run forever if your assigned condition always evaluates to true.


    The For Loop


    In general, “for” loops are more complex than do-while and while loops. However,
    for loops can help you perform difficult tasks using fewer C# codes. The syntax
    of a “for” loop is:


    for (initializer; Boolean_expression; update)


    {


                  the_loop’s_body;


    }'
