    \ body.\n\nThe `counter` (i.e. the initial value assigned to the loop) serves\
    \ as a `for` loop’s most distinctive feature. In most cases, the counter’s value\
    \ increases until it reaches the final value (e.g. 1 to 10). Also, programmers\
    \ usually know how many times the `for` loop will iterate.\n\nYou may include\
