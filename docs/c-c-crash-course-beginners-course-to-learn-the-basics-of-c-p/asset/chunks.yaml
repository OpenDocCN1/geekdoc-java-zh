    \ this point, you need to know the processes that you can perform on an existing\
    \ method. These processes are:\n\n* `Declaration`: In this process, you will link\
    \ a method to a program. This process allows you to call the method in any part\
    \ of your program.\n* `Implementation`: This process involves entering codes to\
    \ complete a certain task. The codes involved here exist inside the method you’re\
    \ using.\n* `Invocation`: This is the process of calling a declared method. Here,\
    \ you’ll use the method to solve a problem or perform an action.\n\n### Method\
    \ Declarations\n\nIn C#, you need to declare methods inside a class. Additionally,\
    \ you’re not allowed to “nest” methods (i.e. write a method inside the body of\
    \ another method). The perfect example for this is `Main()`, the method you’ve\
    \ used multiple times. The code given below will illustrate this:\n\n```csharp\n\
    class DeclaringMethods\n{\n    static void Main()\n    {\n        System.Console.WriteLine(“Hi\
    \ C#!”);\n    }\n}\n```\n\n### The Syntax\n\nUse the following syntax when declaring\
    \ a method:\n\n`static data_type_of_the_result name_of_method (list_of_parameters)`\n"
  raw: 'A “for” loop has an initializer (i.e. the initial value of the counter), a
    Boolean expression, a C# statement that updates the counter, and the loop’s body.


    The “counter” (i.e. the initial value assigned to the loop) serves as a “for”
    loop’s most distinctive feature. In most cases, the counter’s value increases
    until it reaches the final value (e.g. 1 to 10). Also, programmers usually know
    how many times the “for” loop will iterate.


    You may include one or more variables in your “for” loops. These variables may
    move in descending or ascending order. When writing programs, you may combine
    ascending and descending variables in a single “for” loop. In addition, an ascending
    variable can go from 1 to 1024 because “for” loops support arithmetic operations
    (e.g. addition, multiplication, etc.).


    Important Note: All of the parts of a “for” loop are optional. You can create
    an infinite “for” loop by leaving blank spaces on the syntax. Here’s an example:


    ![](images/00026.jpeg)


    At this point, you’re ready to learn more about the different sections of the
    “for” loop.


    The Initialization


    A “for” loop can possess an initializing fragment:


    for (double sample = 1; …;   …)


    {


                  // You can use the “sample” variable here.


    }


                  // You can’t use the variable here.


    C# programs execute this fragment once, right before running the “for” loop. Often,
    programmers use an initializing fragment to create a counter (also known as “loop
    variable”) and assign its initial value. This counter is available and usable
    when inside the loop’s body. C# allows you to declare multiple variables using
    a single initializing fragment.


    The Condition


    Obviously, a “for” loop needs a conditional expression. Here’s a sample:


    for (double sample = 1; sample < 5; …)


    {


                  // This is the loop’s body.


    }


    Computer programs evaluate the conditional expression before running the loop’s
    body. If the result is “true”, the body of the loop will run; otherwise, the involved
    program will jump to the statements written after the current loop.


    The Update Statement


    This is the final part of a “for” loop. Basically, an update statement updates
    the loop’s counter. Let’s use the code snippet given above:


    for (double sample = 10; sample > 1; sample--)


    {


                  // This is the loop’s body.


    }


    The program executes this part after running the loop’s body. Keep in mind that
    this statement updates the counter’s value.


    The Loop’s Body


    This part consists of C# statements. It can utilize the variables you declared
    in the loop’s initializing fragment. Check the example below:


    for (double sample = 10; sample > 1; sample--)


    {


                  System.Console.WriteLine(sample);


    }


    The Continue Operator


    In some cases, you need to stop the active iteration without ending the loop itself.
    You can accomplish this task using the C# operator called “continue”. The example
    given below will illustrate how this operator works:


    ![](images/00027.jpeg)


    This code computes the total of all the odd numbers within the range (1 to n),
    which produce remainders when divided by 7.


    The “Foreach” Loop


    Just recently, C# introduced the concept of “foreach” loops (i.e. extended “for”
    loops). This loop concept is also available in other programming languages such
    as C, VB, C++, PHP, etc. With this programming tool, you can run all of the elements
    of a list, array, or other groups of values. A “foreach” loop takes all of the
    existing elements even in non-indexed data groups.


    When writing this kind of loop, use the following syntax:


    foreach (type name_of_variable in name_of_group)


    {


                  the_statements;


    }


    As you can see, this loop is much simpler than a typical “for” loop. A “foreach”
    loop can help you scan all of the objects inside a collection quickly. It’s no
    surprise that countless programmers use this loop in writing their codes.


    The Nested For Loop


    C# allows you to place a “for” loop inside another “for” loop. The loop at the
    innermost part of the code runs the most number of times. The one at the outermost
    section, on the other hand, gets the least number of repetitions. You should use
    the following syntax when “nesting” for loops:


    for (initializing_fragment, condition, update_statement)


    {


                  for (initializing_fragment, condition, update_statement)


                                {


                                statements


                                }


    }


    Here, the program runs the initial “for” loop, executes its body, and triggers
    the nested loop.  The program will check the second loop’s condition and execute
    the codes inside it until the evaluation becomes false. Then, the program will
    make the necessary adjustments on the loops’ counters. The program will repeat
    the entire process until all of the conditions evaluate to false.


    Chapter 8: The Methods of the C# Language


    This chapter will focus on the C# methods. Here, you’ll learn how to declare and
    utilize methods in your own programs. You need to memorize the lessons contained
    in this chapter if you want to be an effective C# programmer in just 7 days.


    Methods – The Basics


    For most programmers, methods are core aspects of any program. Methods can solve
    problems, accept user inputs (known as parameters), and produce results.


    Methods complete their tasks by representing the data conversions done by the
    program. Additionally, methods are the areas where the actual processes are completed.
    This is the main reason why C# programmers consider methods as the basic units
    of any computer program.


    The Benefits Offered by Methods


    In this section, you’ll discover the major benefits offered by C# methods. After
    reading this material,              you’ll know why you should use these tools
    in writing your programs.


    Better Structure and Code Readability


    Programming experts claim that you should use methods while writing computer programs.
    Methods, even the simplest ones, can improve the structure and readability of
    your C# codes.


    Here’s an important fact that you need to know: programmers spend 20% of their
    time on writing and checking their computer program. The remaining 80% is spent
    on maintaining and improving the software. Obviously, you’ll have an easy time
    working on your program if your codes are readable and well-structured.


    Prevention of Redundant Codes


    Methods can help you avoid redundant codes in your programs. Redundant or duplicated
    codes often produce undesirable results in computer applications.


    Better Code Repetition


    This benefit is closely related to the previous one. If your program needs to
    use a certain code fragment multiple times, it’s an excellent idea to transfer
    the said fragment into a C# method. You can invoke methods multiple times, which
    means you can repeat important codes without retyping them.


    Declaring, Implementing, and Invoking C# Methods


    At this point, you need to know the processes that you can perform on an existing
    method. These processes are:


    *   Declaration – In this process, you will link a method to a program. This process
    allows you to call the method in any part of your program.


    *   Implementation – This process involves entering codes to complete a certain
    task. The codes involved here exist inside the method you’re using.


    *   Invocation – This is the process of calling a declared method. Here, you’ll
    use the method to solve a problem or perform an action.


    Method Declarations


    In C#, you need to declare methods inside a class. Additionally, you’re not allowed
    to “nest” methods (i.e. write a method inside the body of another method). The
    perfect example for this is Main(), the method you’ve used multiple times. The
    code given below will illustrate this:


    class DeclaringMethods


    {


                  static void Main()


    {


                  System.Console.WriteLine(“Hi C#!”);


    }


    }


    The Syntax


    Use the following syntax when declaring a method:


    static data_type_of_the_result name_of_method (list_of_parameters)'
