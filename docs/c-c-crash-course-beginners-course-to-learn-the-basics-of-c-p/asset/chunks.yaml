    \ the command prompt, you’ll get the following message:\n\n![](images/00020.jpeg)\n\
    \n### The Console.Read Method\n\nThere are significant differences between `Console.Read`\
    \ and `Console.ReadLine`. First, `Console.Read` reads a single character only\
    \ while `Console.ReadLine` reads the entire expression. Second, `Console.Read`\
    \ returns a code rather than the accepted input. If you want to utilize the output\
    \ as an ordinary character, you should do one of these things:\n\n* Convert the\
    \ output into a character\n* Use the `Convert.ToChar` method on the result\n\n\
    **Important Note:** `Console.Read` will only read a character if the user hits\
    \ “Enter”. When the user presses this key, the program will transfer the input\
