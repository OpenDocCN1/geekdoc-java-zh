    ## The Basic Commands\n\nIn this section, you’ll learn about the basic commands\
    \ that you issue using the command prompt. You should study this material carefully\
    \ if you want to be a great C# programmer.\n\n### The Console Commands\n\n* `cd\
    \ name_of_directory` – This command allows you to change the active directory.\
    \ For instance, if you want to go to the Users folder inside C:, you need to issue\
    \ the following command: `cd C:\\Users`\n* `dir` – Use this command to view the\
    \ files inside the active directory.\n* `rmdir name_of_directory` – This command\
    \ allows you to delete a directory. For example, `rmdir Sample` deletes the directory\
    \ named “Sample”.\n* `mkdir name_of_directory` – With this command, you can create\
    \ a new directory inside the active directory. For instance, if you’re currently\
