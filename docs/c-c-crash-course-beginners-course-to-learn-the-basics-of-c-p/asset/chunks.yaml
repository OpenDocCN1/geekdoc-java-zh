  trans: "\nC# 程序并不直接读取数字。它们需要将输入视为字符串（即通过 `Console.ReadLine` 方法）并将它们转换为数字。将字符串转换为其他数据类型的过程被称为解析（parsing）。C#\
    \ 语言中的所有原始数据类型都支持这一过程。\n\n# 控制台输出\n\n本书的这部分将侧重于两个方法：`Console.WriteLine` 和 `Console.Write`。这两个方法都可以打印\
    \ C# 语言中的所有数据类型。这意味着你可以使用它们在用户的控制台上显示消息。\n\n以下代码段将教你这些方法是如何工作的：\n\n```cs\nConsole.WriteLine(“I\
    \ want to learn the C# programming language.”);\n\n// 这一行将打印括号内的字符串。\n\nConsole.WriteLine(100);\n\
    \n// 这一行将在用户的命令提示符上显示“100”。\n\nConsole.WriteLine(3.14);\n\n// 这一行将在用户的控制台上打印 double\
    \ 类型的值 3.14。\n```\n\n你可以使用 `Console.WriteLine` 方法在用户的屏幕上显示不同类型的数据。这是因为 `Console`\
    \ 类拥有每种数据类型的内置版本。\n\n`Console.WriteLine` 和 `Console.Write` 之间唯一的区别是，前者打印括号内的值并在控制台上添加一个换行符，而后者仅显示括号内的信息。因此，在代码中使用\
    \ `Console.WriteLine` 就像是在显示消息后按了“回车”键（即光标将移动到下一行）。\n\n# 字符串拼接\n\nC# 语言防止程序人员在字符串值上使用运算符。显然，你不能对实际单词进行算术运算（例如\
    \ fish – dog, power * humans, land / people 等）。然而，C# 允许你拼接多个字符串对象以生成一个新的字符串。你可以通过在字符串上使用\
    \ `+` 来实现。下面的示例将说明这一思想。\n\n```cs\nstring gadget = “smartphone”;\n\nstring example\
    \ = “I use my ” + gadget + “to access ” + “the internet.”;\n\nConsole.WriteLine(example);\n\
    ```\n\n如果你执行该代码，控制台将显示：\n\nI use my smartphone to access the internet.\n\n# 第\
    \ 6 章：C# 的条件语句\n\n本章将教你如何在 C# 代码中使用条件语句。基本上，条件语句是一个允许你根据所分配的条件来执行各种操作的代码块。请仔细阅读这些材料，因为它们包含了帮助你在\
    \ 7 天内掌握 C# 的价值信息。\n\n## 运算符\n\n在本节中，你将学习更多关于 C# 比较运算符的信息。这些运算符非常重要：它们可以帮助为你自己的条件语句设置条件。\n\
    \n## 比较运算符\n\nC# 具有不同的运算符，用于比较相同类型的值。这些运算符有：\n\n* `<`\n* `>`\n* `<=`\n* `>=`\n\
    * `!=`\n* `==`\n\n你可以使用上述运算符来比较 C# 表达式（例如，两个整数、两个变量、两个常量等）。在使用这些任何运算符时，结果将始终是一个布尔值（Boolean）。分析以下示例：\n\
    \n```cs\nint height = 170;\n\nConsole.WriteLine(height < 180); // 这将给你“true”。\n\
    \nstring gender = “Male”;\n\nConsole.WriteLine(gender == “Female”); // 这将给你“false”。\n\
    \ndouble valueofPi = 3.14;\n\nConsole.WriteLine(valueofPi > 100); // 这将给你“true”。\n\
    ```\n\n## 逻辑运算符\n\nC# 还支持一些逻辑运算符。程序人员使用这些运算符创建布尔语句（也称为“逻辑”语句）。让我们详细讨论每个逻辑运算符：\n\
    \n#### 与 (AND) 和 或 (OR) 运算符\n\n你只能在涉及布尔值的表达式上使用逻辑与（即 `&&`）和逻辑或（即 `||`）运算符。当两个操作数都为真时，逻辑与运算符将给你返回“true”。例如：\n\
    \n```cs\nbool sample = (1 < 2) && (10 == 10);\n```\n\n由于 1 小于 2 且 10 等于 10，该表达式将给你\
    \ true。由于逻辑与运算符在不执行不必要的分析的情况下提供快速结果，程序人员将其称为“短路运算符”。它首先检查语句的左部分。如果求值为“false”，操作将立即停止。由于其中一个操作数为假，表达式将不再为真。\n\
    \n另一方面，逻辑或（即 `||`）运算符在你的操作数中至少有一个求值为真时，将给你返回 true。例如：\n\n```cs\nbool sample =\
    \ ( 1 < 2) || (10 > 100);\n```\n\n这个示例将给你 true，因为左侧操作数为真。逻辑或运算符也是一个“短路运算符”，因为它即使在不检查整个\
    \ C# 语句的情况下也能给出结果。在当前示例中，逻辑或将不再分析第二个操作数，因为第一个操作数已经是真实的。因此，条件已经满足。\n\n#### 异或 (Exclusive\
    \ OR) 和 取反运算符\n\n异或（即 `^`）是一个全路执行运算符，因为它在给出结果之前需要检查两个操作数。只有当其中一个操作数求值为真时，它才会给你\
    \ true。因此，如果两个操作数都为真，你将得到 false。检查以下示例：\n\n```cs\nbool sample = (1 < 2) ^ (2 ==\
    \ 2);\n```\n\n由于两个表达式均为真，异或将给你 false。\n\n取反运算符（即 `!`）只是反转它所连接的布尔值。例如：\n\n```cs\n\
    bool sample = !(1 < 2);\n```\n\n1 小于 2。然而，由于 `!` 连接到该表达式，结果将被反转。\n\n# 语句\n\n现在你已经知道了如何使用比较运算符和逻辑运算符，该讨论条件语句了。这些语句是帮助你实现编程逻辑的强大工具。\n\
    \n## if 语句\n\nif 语句的语法如下：\n\n```cs\nif (条件表达式)\n{\n    if 语句体;\n}\n```\n\n如你所见，此语法有三个部分：\n\
    \n1. if 子——该部分标记了 if 语句的开始。\n2. 布尔表达式——该部分可以是逻辑表达式。与 C 不同，C# 不接受整数表达式。\n3. 语句体——你需要使用一对大括号封装此部分。C#\
    \ 允许在内部放置多个语句。\n\n当布尔表达式为真时，程序将运行语句体。如果求值为假，程序将忽略语句体并将控制权传递给后续代码。下面的示例将显示“if”语句是如何工作的：\n\
    \n```cs\nConsole.WriteLine(“请输入一个数字。”);\nint number1 = int.Parse(Console.ReadLine());\n\
    int number2 = 0;\n\nif (number1 > number2)\n{\n    Console.WriteLine(“C# 是一种优秀的语言。”);\n\
    }\n```\n\n此代码需要用户提供一个数字。如果用户的输入大于零，程序将在命令提示符上打印“C# 是一种优秀的语言。”\n\n注意：如果你的条件语句体只有单行，可以省略大括号。检查下面的示例：\n\
    \n```cs\nint x = 10;\n\nif (x > 0)\n    System.Console.WriteLine(“该变量持有一个正数。”);\n\
    ```\n\n## if-else 语句\n\n与其他编程语言一样，C# 支持“if-else”条件语句。在编写 if-else 语句时，你应该使用以下语法：\n\
    \n```cs\nif (布尔变量或表达式)\n{\n    条件语句体;\n}\nelse\n{\n    else 语句体;\n}\n```\n\n上述语法由以下部分组成：\n\
    \n* if 子——该部分开始了条件语句。\n* 布尔变量或表达式——该表达式的值决定了程序将使用的代码。\n"
- fmt: "\n*   The conditional statement’s body – This can be a single statement or\
    \ a group of statements. If you are using multiple statements, enclose them inside\
    \ a pair of curly braces.\n*   The `else` keyword – This is a C# keyword that\
    \ triggers the `else` clause.\n*   The `else` clause’s body – This is identical\
    \ to the conditional statement’s body (see above).\n\nWhen working on an `if-else`\
    \ statement, the computer program analyzes the value within the parentheses. The\
    \ value needs to be Boolean (i.e. either true or false). If the value is “true”,\
    \ the program will execute the conditional statement’s body and ignore the `else`\
    \ clause. If the value is false, however, the program will run the else statement’s\
    \ body. Analyze the following example:\n\n```csharp\nint a = 100;\n\nif (a !=\
    \ 50)\n{\n    Console.WriteLine(\"The variable is not equal to 50\");\n}\nelse\n\
    {\n    Console.WriteLine(\"The variable is equal to 50\");\n}\n```\n\nYou can\
    \ interpret this code as: if `a != 50`, the console will print: “The variable\
    \ is not equal to 50”. On the other hand, if `a = 50`, the console will show:\
    \ “The variable is equal to 50”. Since the variable named `a` holds 100, your\
    \ command prompt will give you this:\n\n![](images/00022.jpeg)\n\n## Nested Statements\n\
    \nIn some cases, you need to write an `if` statement inside another `if` statement.\
    \ Programmers refer to this process as “nesting”. That means you are “nesting”\
    \ a conditional statement if you are writing it inside another conditional statement.\n\
    \n**Important Note:** C# allows you to nest `if-else` statements. In this situation,\
    \ each `else` clause points to the `if` clause that comes before it. This simple\
    \ rule can help you analyze nested conditional statements, which can be extremely\
    \ complex.\n\nAccording to expert programmers, you should not create more than\
    \ three levels of nested statements. If you really need to use four or more conditional\
    \ structures, export them to a different method (You’ll learn about methods later.).\n\
    \nThe code given below will show you how nested `if` statements work:\n\n```csharp\n\
    int a = 10;\nint b = 20;\n\nif (a > b)\n{\n    Console.WriteLine(\"a is greater\
    \ than b\");\n}\nelse\n{\n    if (a < b)\n    {\n        Console.WriteLine(\"\
    a is less than b\");\n    }\n    else\n    {\n        Console.WriteLine(\"a is\
    \ equal to b\");\n    }\n}\n```\n\n## The Switch-Case Statement\n\nProgrammers\
    \ use a `switch-case` statement in situations where the possible answers are numerous.\
    \ Here’s the syntax of a `switch-case` statement:\n\n```csharp\nswitch (selector)\n\
    {\n    case first_integer:\n        statements;\n        break;\n    case second_integer:\n\
    \        statements;\n        break;\n    default:\n        statements;\n    \
    \    break;\n}\n```\n\nBasically, selectors are expressions that return usable\
    \ values (i.e. values you can compare or process). The `switch` keyword compares\
    \ the `selector`’s value against the `cases`. If the value of the `selector` matches\
    \ that of a `case`, the statements assigned to that case will run. If there’s\
    \ no match, however, the program will execute the `default` statement.\n\n**Important\
    \ Note:** Make sure that the `cases` have unique values. If two or more cases\
    \ share the same value, your program will produce undesirable results. As you\
    \ can see, each case has a `break` clause. The `break` clause terminates the case\
    \ to which it belongs. C# requires you to add this clause to all of your switch\
    \ statements. You don’t have to place the `default` part at the end of your switch-case\
    \ statement. However, this position is recommended if you want to keep your codes\
    \ readable.\n\n## Chapter 7: The Loop Statements\n\nThis chapter will teach you\
    \ how to use loop statements. As a programmer, you’ll use a loop statement to\
    \ run certain code blocks repeatedly. Loops play an important part in C# programming.\
    \ Hence, you should study this material carefully if you want to master this language.\n\
    \n### Loops – The Basics\n\nWhile creating programs, you often need to execute\
    \ code sequences multiple times. Typing the same blocks of code several times\
    \ can be extremely boring. Thus, you need to find a quick and simple way to repeat\
    \ codes. Fortunately, the C# language supports loop statements.\n\nA loop is a\
    \ tool that runs code repeatedly. You can use it to run codes for a certain number\
    \ of times or as long as a given condition is fulfilled. C# offers different types\
    \ of loop statements. Let’s analyze each type in detail:\n\n### The While Loop\n\
    \nThis is the simplest loop statement in C#. Its syntax is:\n\n```csharp\nwhile\
    \ (the_assigned_condition)\n{\n    the_loop’s_body\n}\n```\n\nIn this syntax,\
    \ `the_assigned_condition` is an expression that produces a Boolean value. This\
    \ condition dictates how many times the `body` will run. The `body`, on the other\
    \ hand, is the statement (or group of statements) that you want to execute.\n\n\
    The diagram given below will illustrate how while loops work:\n\n![](images/00023.jpeg)\n\
    \nWhen working on a `while` loop, a C# program checks the value of the Boolean\
    \ expression. If the value is “true”, the program will run all of the statements\
    \ within the loop’s body. Then, the program will check the Boolean expression\
    \ to see its value. If the value is still true, the program will rerun the loop’s\
    \ body and go back to the first step (i.e. check the expression’s value). This\
    \ process will go on until the Boolean expression evaluates to false. Once this\
    \ happens, the program will process the code blocks right after the loop.\n\n\
    **Important Note:** Your C# program won’t run the while loop’s body if the Boolean\
    \ expression is false. Thus, if the Boolean value is false when you launched the\
    \ program, your in-loop statements will never be executed.\n\nThe following example\
    \ will illustrate how while loops work:\n\n```csharp\nint timer = 10;\n\nwhile\
    \ (timer >= 0)\n{\n    System.Console.WriteLine(\"Time remaining: \" + timer);\n\
    \    timer--;\n}\n```\n\nIf you will compile and execute this code, your command\
    \ prompt will print this data:\n\n![](images/00024.jpeg)\n\n### The Break Operator\n\
    \nYou can use `break` (a C# operator) to exit a loop prematurely. Programmers\
    \ use this operator if they don’t want to wait for the loop’s natural termination.\
    \ Basically, a loop will end once it encounters a `break` operator. This situation\
    \ forces the program to jump to the code fragments right after the loop.\n\nIn\
    \ C#, you can only use this operator inside the loop’s body. That means `break`\
    \ will only work while the loop is running.\n\n### The Do-While Loop\n\nA `do-while`\
    \ loop is almost identical to a `while` loop. The only difference between these\
    \ loops is that the former analyzes the Boolean value after running the loop’s\
    \ body. Thus, you can rest assured that your codes will run at least once even\
    \ if the Boolean expression is false. Here is the syntax of the do-while loop:\n\
    \n```csharp\ndo\n{\n    statements\n} while (Boolean expression)\n```\n\nDo-while\
    \ loops work according to this pattern:\n\n![](images/00025.jpeg)\n\n### The For\
    \ Loop\n\nIn general, `for` loops are more complex than do-while and while loops.\
    \ However, `for` loops can help you perform difficult tasks using fewer C# codes.\
    \ The syntax of a `for` loop is:\n\n```csharp\nfor (initializer; Boolean_expression;\
    \ update)\n{\n    the_loop’s_body\n}\n```\n"
