    \ in the program’s stack. This address points to the location of the needed value.\
    \ Basically, a reference type assigns dynamic memory during its declaration. It\
    \ also frees up some memory once the program no longer needs it.\n\n# Literals\n\
    \nLiterals are the values specified in a program’s source code. The example given\
    \ below will illustrate this idea:\n\n```csharp\nbool isitdelicious = false;\n\
    short income = 22000;\nchar firstletter = ‘c’;\nbyte ten = 10;\nint prize = 250000;\n\
    ```\n\nIn this example, the literals are `false`, `22000`, `'c'`, `10` and `250000`.\
    \ These are values that you’ll add directly to the program’s code.\n\n## The Different\
    \ Kinds of Literals\n\nC# supports the following kinds of literals:\n\n* Real\n\
    * Integer\n* String\n* Character\n* Boolean\n\nLet’s discuss each of these literals\
    \ in detail:\n\n### Real\nA real literal has a sign (i.e. `+` or `-`), a suffix,\
    \ a prefix, and a decimal point. You should use this kind of literal for `double`,\
    \ `float`, and `decimal` values. C# allows you to write real literals in their\
    \ exponent form. Here are the suffixes that you can apply on real literals:\n\n\
    * `F` – This suffix represents `float` values.\n* `D` – Use this suffix to indicate\
    \ `double` values.\n* `M` – This letter indicates `decimal` values.\n* `E` – Use\
    \ this letter for exponential values. For instance, “e4” means you need to multiply\
    \ the integer by 104.\n\n### Integer\nAn integer literal consists of a prefix,\
    \ a suffix, a sign (i.e. `+` or `-`), and a set of digits. You can use prefixes\
    \ to add numbers in your code as decimals or hexadecimals. Here are the prefixes\
    \ and suffixes that you can use in C#:\n\n* `0X` (e.g. `0XA6F2`) – Use this prefix\
    \ to indicate a hexadecimal value.\n* `U` (e.g. `119U`) – This suffix represents\
    \ unsigned int (`uint`) or unsigned long (`ulong`) values.\n* `L` (e.g. `360L`)\
    \ – This suffix for “long” values.\n\n**Important Note:** C# will tag integer\
    \ literals as “int” if you won’t use any suffix. Also, the letters (i.e. `L`,\
    \ `U` and `X`) are not case-sensitive.\n\n### String\nUse this literal for string\
    \ values. Basically, a string literal is a set of characters placed within a pair\
    \ of double quotes (e.g. “sample”).\n\n**Important Note:** In the C# language,\
    \ you may use the “@” symbol to create quoted (or verbatim) strings. Programmers\
    \ use these strings for naming file paths.\n\n### Character\nA character literal\
    \ is a single character enclosed by a pair of single quotes (e.g. ‘z’). Use character\
    \ literals to set values that belong to the “char” type. Additionally, you may\
    \ write a character literal as:\n\n* a single character (e.g. ‘X’)\n* a code for\
    \ a special character (e.g. ‘\\u0067’)\n* an escape code (see below)\n\n**Escape\
    \ Codes** – These are special character sequences that add characters to your\
    \ source code. In general, the characters involved here cannot be added straight\
    \ to the program’s codes. C# prevents you from adding some characters straight\
    \ to your programs. Some of these characters are: tabs, newlines, backslashes,\
    \ quotation marks, etc. The following list will show you the most popular escape\
    \ codes in C#:\n\n* `\\\\` – Newline Character\n* `\\t` – Tab Character\n* `\\\
    ’` – Single Quotation Mark\n* `\\” – Double Quotation Mark\n\n### Boolean\nThere\
    \ are only two types of Boolean literals: `true` and `false`. You can only assign\
    \ one of these values when working with a “bool” (i.e. Boolean) variable. The\
    \ code snippet given below will show you how to declare a Boolean literal:\n\n\
    ```csharp\nbool answer = false;\n```\n\n# Chapter 3: The Operators of the C# Language\n\
    \nThis chapter will focus on the operators of C#. By reading this material, you’ll\
    \ know how these operators work and how you can use them in your source codes.\n\
    \n## Operators – The Basics\n\nOperators help you in processing objects and data\
    \ types. They accept inputs and operands to produce a result. The C# language\
    \ uses special characters (e.g. `.`, `+`, `^`, etc.) as operators. Also, C# codes\
    \ can take up to three different operands.\n\n## The Different Types of Operators\n\
    \nC# programmers divide operators into the following types:\n\n### Assignment\
    \ Operator\nIn C#, you need to use the equals sign (i.e. `=`) to assign values.\
    \ Here’s the syntax that you need to use when assigning a value:\n\n`name_of_operand\
    \ = expression, literal, or second_operand`\n\nHere are some examples:\n\n```csharp\n\
    int y = 99;\nstring hello = “Good morning.”;\nchar sample = ‘z’;\n```\n\n**Important\
    \ Note:** C# allows you to cascade (i.e. use several times within a single expression)\
    \ the assignment operator. That means you won’t have to enter multiple equals\
    \ signs if you are creating variables of the same data type. The examples given\
    \ below will illustrate this rule:\n\n```csharp\nint d = 1, e = 2, f = 3;\nstring\
    \ hi = “Good Morning.”, bye = “Farewell.”, thanks = “Thank you.”;\n```\n\n###\
    \ Logical Operators\nA logical (also known as “Boolean”) operator accepts and\
    \ returns Boolean values (i.e. `true` or `false`).\n\n* `&&` – Programmers refer\
    \ to this operator as “AND”. It will give `true` if both of operands are true.\n\
    * `^` – This is known as “Exclusive OR”. It will give true if one of operands.\n\
    * `||` – This is the “OR” operator. You will get true if at least one.\n* `!`\
    \ – This operator, known as “Negation”, reverses the operand.\n\nThe following\
    \ code will show how to use these:\n\n```csharp\nclass Test\n{\n    static void\
    \ Main()\n    {\n        bool x = true, y = false;\n        Console.WriteLine(x\
    \ && y);\n        Console.WriteLine(x || y);\n        Console.WriteLine(!x);\n\
    \        Console.WriteLine(x ^ y);\n    }\n}\n```\n\n### Arithmetic Operators\n\
    These operators help you in performing math. This category consists of the following:\n\
    \n* `+` – Use this operator to perform addition using two values.\n* `-` – This\
    \ operator allows you to perform subtraction. It deducts the value of the right\
    \ operand from that of the left.\n* `*` – With this operator, you can multiply\
    \ the values of operands.\n* `/` – Use this operator to divide numbers in C#.\
    \ Basically, `/` divides the value of the left-hand operand by the right-hand\
    \ operand.\n* `++` – This is known as the “increment operator”. It increases the\
    \ value of an operand by one. You may write it before or after the operand.\n\
    * `--` – This is the exact opposite of the increment operator. You can use it\
    \ to decrease an operand’s value by one. You may write it before or after the\
    \ operand you want to modify.\n\nThe code below will show you how operators work:\n\
    \n```csharp\nclass Test\n{\n    static void Main()\n    {\n        double d =\
    \ 100, e = 3;\n        Console.WriteLine(d + e);\n        Console.WriteLine(d\
    \ - e);\n        Console.WriteLine(d / e);\n        Console.WriteLine(d * e);\n\
    \        Console.WriteLine(++d);\n        Console.WriteLine(--e);\n    }\n}\n\
    ```\n\n## Binary Operators\nThese operators work on binary numbers. In the IT\
    \ world, all of the information is expressed as a sequence of zeros and ones.\
    \ That mean you need to master binary operators if you want to be a successful\
    \ programmer.\n"
