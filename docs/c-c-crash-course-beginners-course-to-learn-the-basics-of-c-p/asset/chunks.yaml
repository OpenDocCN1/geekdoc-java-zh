    You need to use `bool` (i.e. a C# keyword) to declare this data type. Boolean
    values can only be `true` or `false`. In the C# programming language, Boolean
    values are automatically set as `false`. Programmers use this data type to store
    the result/s of logical statements.


    # Characters


    This data type can store single characters. You need to use `char` (i.e. another
    C# keyword) to declare this type. Write your `char` values within a pair of apostrophes
    (e.g. “I”).


    # Objects


    Programmers regard objects as the most special type of data in the C# language.
    Basically, objects serves as the parent of other data types within `.NET`. This
    data type, which requires the `object` keyword during its declaration, may accept
    any value from other data types. You may think of objects as addresses that point
    to certain parts of your computer’s memory.


    # Real Type – Floating Points


    In the C# language, “real type” refers to the actual numbers you’ve learned in
    mathematics. A floating-point real data type can either be `float` or `double`.


    1. **Float** – Programmers call this subtype “single-precision real integer”.
    The default value of a float number is `0.0F` (the `f` at the end is not case-sensitive).
    The letter `f` indicates that the value is a `float`.

    2. **Double** – Programmers use the term “double-precision real integer” when
    referring to this subtype. Its default value is `0.0D` (i.e. the letter `d` at
    the end is not case-sensitive.). C# automatically tags real numbers as `double`
    so you don’t really need to add `d` at the end of the value.


    # Real Type – Decimals


    This programming language supports “decimal arithmetic”, a mathematical approach
    that uses decimal values to represent numbers. The main advantage of this approach
    is that it preserves its accuracy regardless of the values it works on.


    C# uses the `decimal` data type to represent this kind of real number. This data
    type is 128 bits long and is accurate up to the 29th decimal value. Because of
    its excellent accuracy, these are used by programmers for financial computations
    (e.g. payments, taxes, interest, etc.).


    # Integers


    This data type consists of 8 subtypes, which are:


    * **SBYTE** – An `sbyte` is a signed integer that is 8 bits long. That means it
    can contain up to 256 values (i.e. $2^8$). Additionally, sbytes can be either
    negative or positive.

    * **BYTE** – This subtype contains unsigned integers that are 8 bits long. It
    is almost identical to `sbyte`. The only difference is that `byte` can never be
    negative.

    * **SHORT** – These integers are signed and 16-bits long.

    * **USHORT** – These are signed integers whose length is 16 bits.

    * **INT** – This is probably the most popular data type in C#. Programmers use
    this data type because it is perfectly compatible with 32-bit processors and big
    enough for typical computations. It is a signed integer whose length is 32 bits.

    * **UINT** – This 32-bit integer is unsigned. Thus, it can only be positive.

    * **LONG** – This integer is 64 bits long. It can be either positive or negative.

    * **ULONG** – This is similar to “long” integers. The only difference is that
    `ulong` can only assume positive values.


    # Strings


    A string is a set or sequence of characters. C# requires you to use `string` (i.e.
    a keyword) when declaring values that belong to this data type. You have to write
    each string between a pair of quotation marks. This language allows you to perform
    various operations on strings (e.g. concatenation, character replacement, character
    search, etc.).


    # The Variables


    You can use a variable to store, retrieve, and modify changeable data. As a programmer,
    you need to use variables in storing and processing information.


    ## The Characteristics of a Variable


    A variable has the following characteristics:


    * Name (also known as “Identifier”)

    * Data Type

    * Value (i.e. the information you want to store).


    Variables are sections of computer memory that have a name. They store values
    and allow a computer program to access their contents. You may place a variable
    inside the stack (i.e. the working memory of your computer program) or within
    the program’s dynamic memory.


    `Characters`, `Booleans`, and `Integers` are known as value types since they keep
    their data within the program’s stack. On the other hand, `strings`, `arrays`,
    and `objects` are known as “reference types” because they don’t hold the values
    inside them. Instead, they serve as markers that point to the part of computer
    memory where the data is stored.


    ## How to Name a Variable


    You need to name your variables before using them. The variable’s name serves
    as an identifier: it helps the program in locating and specifying the variable.
    C# allows you to choose variable names freely. However, just like any other language,
    C# has some rules regarding variable names. These rules are as follows:


    * You may use an underscore (i.e. `_`), letters, and numbers to create a variable
    name.

    * You can’t use a number to start the name. Thus, `FirstSample` is valid while
    `1stSample` is not.

    * You can’t use C# keywords in naming your variables. This simple rule prevents
    compilation and runtime errors in your programs. If you really want to use keywords
    for your variables, you may begin the name using the `@` symbol (e.g. `@bool`,
    `@int`, `@char`, etc.).


    ## How to Declare a Variable


    You should declare a variable before using it. Here are the things you need to
    do when declaring a variable:


    1. Specify the variable’s data type (i.g. `char`)

    2. Specify the variable’s name (i.g. `sample`)

    3. Set the variable’s initial value. This step is completely optional.


    The format for variable declarations is:


    ```data_type name = initial_value;

    ```


    Here are some samples of valid declarations:


    ```

    int year = 2000;

    string;

    char

    ```

    Important Note: You need to end your each of your C# statements using a semicolon.
    If you’ll forget to add a single semicolon, your programs will generate undesirable
    andor unexpected results.


    ## How to Assign a Value


    Just like any other language, C# allows you to assign a value to a variable. This
    process, known as “value assignment”, requires you to use the equals sign. Programmers
    refer to this symbol as the assignment operator. Write the variable’s name on
    the left side of the operator. Then, specify the value you want to assign on the
    other side. Check the following examples:


    ```

    test = x;

    yourname = “John Doe”;

    ```


    ## How to Initialize a Variable


    In programming, “initialization” is the process of assigning a value to a new
    variable. Thus, you’ll set this “initial value” while declaring a variable.


    ### The Default Value of a Variable


    If you won’t assign any value for your variable, C# will perform an automated
    initialization (i.e. it will assign a default value to the empty variable). The
    following tables will show you the default value of each data type:


    ![](images/00015.jpeg)


    The code given below will show you how to declare variables and assign values:


    ```

    // This is an example

    byte years = 10;

    short days = 31;

    decimal pi = 3.14;

    bool isittasty = true;

    char sample = x;

    string animal = “dog”;

    ```

    Important Note: Lines that begin with two forward slashes (i.e. //) are “comments”.
    In programming, comments are descriptive text added to the code to improve its
    readability. Language compilers ignore these lines. Thus, comments won’t affect
    the functionality of your computer programs.


    # Values and References


    C# programmers divide data types into two categories: value types and reference
    types.


    A value type exists inside the execution stack of a program. Additionally, it
    holds the value stored by the programmer. The Value Type category consists of
    the `Booleans`, `Characters`, and `Integers`. The memory assigned to these data
    types becomes available once the program finishes its code execution. For instance,
    the variables within the `Main()` method of your program will be emptied once
    the program is closed.

