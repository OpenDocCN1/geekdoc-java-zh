  trans: "\n\n另一方面，引用类型在程序的栈中存储一个地址（即引用）。该地址指向所需值的位置。基本上，引用类型在声明时会分配动态内存。此外，当程序不再需要它时，它也会释放一些内存。\n\
    \n# 字面量 (Literals)\n\n字面量是程序源代码中指定的值。下面所给出的示例将阐明这一概念：\n\n```csharp\nbool isitdelicious\
    \ = false;\nshort income = 22000;\nchar firstletter = ‘c’;\nbyte ten = 10;\nint\
    \ prize = 250000;\n```\n\n在这个示例中，字面量是 `false`、`22000`、`'c'`、`10` 和 `250000`。这些是你直接添加到程序代码中的值。\n\
    \n## 字面量的不同类型\n\nC# 支持以下类型的字面量：\n\n* 实数 (Real)\n* 整数 (Integer)\n* 字符串 (String)\n\
    * 字符 (Character)\n* 布尔值 (Boolean)\n\n让我们详细讨论一下这些字面量：\n\n### 实数\n实数字面量有一个符号（即 `+`\
    \ 或 `-`）、一个后缀、前缀和一个小数点。你应该将这种字面量用于 `double`、`float` 和 `decimal` 值。C# 允许你以指数形式编写实数字面量。以下是你可以应用于实数字面量的后缀：\n\
    \n* `F` – 此后缀代表 `float` 值。\n* `D` – 使用此后缀指示 `double` 值。\n* `M` – 此字母表示 `decimal`\
    \ 值。\n* `E` – 使用此字母用于指数值。例如，“e4”意味着你需要将整数乘以 10⁴。\n\n### 整数\n整数字面量由一个前缀、后缀、一个符号（即\
    \ `+` 或 `-`）和一组数字组成。你可以使用前缀在代码中以十进制或十六进制的形式添加数字。以下是你可以在 C# 中使用的前缀和后缀：\n\n* `0X`（例如\
    \ `0XA6F2`）– 使用此前缀指示十六进制值。\n* `U`（例如 `119U`）– 此后缀代表无符号整数 (`uint`) 或无符号长整数 (`ulong`)\
    \ 值。\n* `L`（例如 `360L`）– 用于“长整型”（long）值的后缀。\n\n**重要说明：** 如果你不使用任何后缀，C# 将把整数字面量标记为“int”。此外，字母（即\
    \ `L`、`U` 和 `X`）不区分大小写。\n\n### 字符串\n使用此字面量用于字符串值。基本上，字符串字面量是置于一对双引号内的字符集（例如“sample”）。\n\
    \n**重要说明：** 在 C# 语言中，你可以使用“@”符号来创建带引号（或逐字）字符串。程序员使用这些字符串来命名文件路径。\n\n### 字符\n字符字面量是由一对单引号包围的单个字符（例如\
    \ ‘z’）。使用字符字面量来设置属于“char”类型的值。此外，你可以将字符字面量写为：\n\n* 单个字符（例如 ‘X’）\n* 特殊字符的代码（例如\
    \ ‘\\u0067’）\n* 转义序列（见下文）\n\n**转义序列 (Escape Codes)** – 这些是特殊的字符序列，向你的源代码中添加字符。通常，这里涉及的字符不能直接添加到程序代码中。C#\
    \ 防止你直接向程序添加某些字符。其中一些字符是：制表符、换行符、反斜杠、引号等。以下列表向你展示 C# 中常用的转义序列：\n\n* `\\\\` – 换行符\n\
    * `\\t` – 制表符\n* `\\’` – 单引号\n* `\\”` – 双引号\n\n### 布尔值\n布尔字面量只有两种类型：`true` 和 `false`。在处理“bool”（即布尔）变量时，你只能赋值这些值中的一个。下面给出的代码段将向你如何声明布尔字面量：\n\
    \n```csharp\nbool answer = false;\n```\n\n# 第 3 章：C# 语言的运算符\n\n本章将重点介绍 C# 的运算符。通过这些材料，你将了解这些运算符是如何工作的，以及你如何在源代码中使用它们。\n\
    \n## 运算符 – 基础\n\n运算符帮助你处理对象和数据类型。它们接受输入和操作数以产生结果。C# 语言使用特殊字符（例如 `.`、`+`、`^` 等）作为运算符。此外，C#\
    \ 代码可以接受最多三个不同的操作数。\n\n## 运算符的不同类型\n\nC# 程序员将运算符分为以下几类：\n\n### 赋值运算符\n在 C# 中，你需要使用等号（即\
    \ `=`）来赋值。以下是你赋值值时需要使用的语法：\n\n`操作数 _ 名称 = 表达式, 字面量, 或 第二 _ 操作数`\n\n这里是一些示例：\n\n\
    ```csharp\nint y = 99;\nstring hello = “Good morning.”;\nchar sample = ‘z’;\n\
    ```\n\n**重要说明：** C# 允许你级联赋值运算符（即在单个表达式中使用多次）。这意味着如果你正在创建相同数据类型的变量，你就不需要输入多个等号了。下面给出的示例将阐明这一规则：\n\
    \n```csharp\nint d = 1, e = 2, f = 3;\nstring hi = “Good.”;\n```\n\n### 逻辑运算符\n\
    逻辑运算符（也称为布尔运算符）接受并返回布尔值（即 `true` 或 `false`）。\n\n* `&&` – 程序员将此运算符称为“与”（AND）。当两个操作数都为真时，结果为真。\n\
    * `^` – 这被称为“异或”（Exclusive OR）。当操作数中只有一个为真时结果为真。\n* `||` – 这是“或”（OR）运算符。当至少有一个操作数为真时，结果为真。\n\
    * `!` – 此运算符称为取反（Negation），会反转操作数。\n\n以下代码向你展示如何使用这些：\n\n```csharp\nclass Test\n\
    {\n    static void Main()\n    {\n        bool x = true, y = false;\n        Console.WriteLine(x\
    \ && y);\n        Console.WriteLine(x || y);\n        Console.WriteLine(!x);\n\
    \        Console.WriteLine(x ^ y);\n    }\n}\n```\n\n### 算术运算符\n这些运算符帮助你执行数学。该类别包括：\n\
    \n* `+` – 使用此运算符对两个值进行加法。\n* `-` – 此运算符允许你执行减法。它从左侧的值减去右侧的值。\n* `*` – 通过此运算符，你可以相乘操作数的值。\n\
    * `/` – 使用此运算符在 C# 中进行除法。基本上，`/` 将左侧操作数的值除以右侧操作数。\n* `++` – 这被称为递增运算符。它将操作数的值增加\
    \ 1。你可以在操作数之前或之后编写它。\n* `--` – 这是递增运算符的相反。你可以使用它将操作数的值减少 1。你可以在想要修改的操作数之前或之后编写它。\n\
    \n下面的代码将向展示运算符是如何工作的：\n\n```csharp\nclass Test\n{\n    static void Main()\n  \
    \  {\n        double d = 100, e = 3;\n        Console.WriteLine(d + e);\n    \
    \    Console.WriteLine(d - e);\n        Console.WriteLine(d / e);\n        Console.WriteLine(d\
    \ * e);\n        Console.WriteLine(++d);\n        Console.WriteLine(--e);\n  \
    \  }\n}\n```\n\n## 二进制运算符\n这些运算符作用于二进制数字。在 IT 世界中，所有的信息都表示为 0 和 1 的序列。这意味着如果你想成为一名成功的程序员，你就必须掌握二进制运算符。\n\
    \n"
- fmt: "\nA binary operator works exactly like a logical one. Actually, you may think\
    \ that binary and logical operators use different inputs but conduct the same\
    \ processes. A logical operator uses `Boolean` values to produce results. A binary\
    \ operator, on the other hand, works on numbers presented as binary digits. Here\
    \ are the binary operators you’ll encounter while using C#:\n\n*   `&` – This\
    \ is called `Binary AND`. It indicates the position/s where both of the operands\
    \ have `1` .\n*   `^` – Programmers refer to this operator as `Binary Exclusive\
    \ OR`. It will place `1` in each position where the values are different.\n* \
    \  `|` – This is the `Binary OR` operator. It indicates the position/s where any\
    \ of the operands has `1` .\n*   `~` – This acts as the negation operator for\
    \ binary values. Just like `!`, it reverses the current value of a variable.\n\
    *   `<<` – This is the `Binary Left Shift` operator. It moves the bits of a binary\
    \ number to the left. This movement depends on the value that you’ll assign (e.g.\
    \ `4 << 1`, `4 << 3`, `4 << 2`, etc.).\n\n### Comparison Operators\n\nThese operators\
    \ allow you to compare the values inside two operands. Each of these operators\
    \ gives a `Boolean` value as the final output. Here are the comparison operators\
    \ of the C# language:\n\n*   `==` – This is the `Equality operator`. It checks\
    \ whether the two operands are equal (e.g. `x == y`)\n*   `>` – This operator\
    \ checks whether the left-hand operand’s value is greater than that of the right-hand\
    \ operand (e.g. `x > y`).\n*   `<` – This operator compares the values of the\
    \ two operands. It will give you `true` if the left-hand operand’s value is less\
    \ than that of the right-hand operand (e.g. `y < x`).\n*   `>=` – With this operator,\
    \ you can determine whether the value of the left-hand operand is greater than\
    \ or equal to that of the right-hand operand.\n*   `<=` – This operator will give\
    \ you `true` if the value of the left-hand operand is less than or equal to that\
    \ of the right-hand operand.\n*   `!=` – Use this operator to check the equality\
    \ of two operands. It will give you `true` if the values are not equal (e.g. `x\
    \ != y`).\n\n### Conditional Operator\n\nC# users refer to `?` as the conditional\
    \ operator. Basically, this operator uses the result of a `Boolean` expression\
    \ to determine which statement should be processed. This is called `ternary operator`\
    \ because it works on three operands. Here, the first value should be `Boolean`,\
    \ while the remaining values need to belong to the same data type (e.g. characters,\
    \ strings, numbers, etc.).\n\nThe syntax of this operator is:\n\n```\nfirst_operand\
    \ ? second_operand : third_operand;\n```\n\nHere’s how it works: If `first_operand`\
    \ is true, the program will work on `second_operand`. If `first_operand` is false,\
    \ however, the program will work on `third_operand`.\n\n# Chapter 4: Data Type\
    \ Conversion\n\nIn general, an operator works on arguments that belong to the\
    \ same type. However, the C# language offers a wide range of data types that you\
    \ can use for certain situations. To conduct any process on variables that belong\
    \ to different types, you should convert one of those variables first. In C#,\
    \ data type conversion can be implicit or explicit.\n\nEach C# expression has\
    \ a data type. This data type results from the literals, variables, values, and\
    \ structures used inside the expression. Basically, you might use an expression\
    \ whose type is incompatible for the situation. When this happens, you’ll get\
    \ one of these results:\n\n*   The program will give you a compile-time error.\n\
    *   The program will perform an automated conversion. That means the program will\
    \ get the right expression type.\n\nConverting an `s` type to `t` type allows\
    \ you to treat `s` as `t` while running your program. Sometimes, this process\
    \ requires the programmer to validate the type conversion. Check the examples\
    \ below:\n\n*   Converting `objects` to `strings` will need verification during\
    \ the program’s runtime. This verification ensures that you really want to use\
    \ the values as strings. \n*   Converting `string` values to `object` values doesn’t\
    \ need any validation. That’s because the `string` type is a branch of the `object`\
    \ type. You can convert strings to their `parent` class without losing data or\
    \ getting any error.\n*   You won’t have to perform verification while converting\
    \ `int` values to `long` values. The `long` data type covers all of the possible\
    \ values of the `int` type. That means the data can be transformed without any\
    \ error.\n*   Converting `double` values to `long` values involves validation.\
    \ You might experience loss of data, depending on the values you’re working on.\n\
    \n**Important Note:** C# has certain restrictions when it comes to changing data\
    \ types. Here are the possible type conversions supported by this language:\n\n\
    ### Explicit Conversion\n\nUse this conversion if there’s a chance of information\
    \ loss. For instance, you’ll experience information loss while converting floating-point\
    \ values to integer values (i.e. the fractional section will disappear). You might\
    \ also lose some data while converting a wide-range type to a narrow-range type\
    \ (e.g. `long-to-int` conversion, `double-to-float` conversion, etc.). To complete\
    \ this process, you need to use the `type` operator. Check the examples below:\n\
    \n```csharp\nclass Example\n{\n    static void Main()\n    {\n        double doubleValue\
    \ = 4.5;\n        Console.WriteLine((long)doubleValue);\n\n        long longValue\
    \ = 100;\n        Console.WriteLine((int)longValue);\n\n        float floatValue\
    \ = 3.14f;\n        Console.WriteLine((int)floatValue);\n\n        object obj\
    \ = \"Hello\";\n        Console.WriteLine((string)obj);\n    }\n}\n```\n"
