  trans: "\n\n`for` 循环包含一个初始化器（即计数器的初始值）、一个布尔表达式、一个更新计数器的 C# 语句以及循环体。\n\n`计数`（即分配给循环的初始值）是\
    \ `for` 循环最显著的特征。在大多数情况下，计数器的值会一直增加，直到达到最终值（例如从 1 到 10）。此外，程序员通常知道 `for` 循环将迭代多少次。\n\
    \n你可以在 `for` 循环中包含一个或多个变量。这些变量可以按降序或升序移动。在编写程序时，你可以在单个 `for` 循环中组合升序和降序变量。此外，升序变量可以从\
    \ 1 变为 1024，因为 `for` 循环支持算术运算（例如加法、乘法等）。\n\n**重要提示：** `for` 循环的所有部分都是可选的。你可以通过在语法中留空来创建一个无限的\
    \ `for` 循环。这是一个示例：\n\n![](img/00026.jpeg)\n\n至此，你准备好学习更多关于 `for` 循环的不同部分了。\n\n\
    ### 初始化\n\n一个 `for` 循环可以拥有初始化片段：\n\n```csharp\nfor (double sample = 1; …;   …)\n\
    {\n    // 你可以在这里使用“sample”变量。\n}\n// 你不能在这里使用该变量。\n```\n\nC# 程序在运行 `for` 循环之前执行一次此片段。程序员通常使用初始化片段来创建一个计数器（也称为“循环变量”）并分配其初始值。在循环体内部，该计数器是可用且可的。C#\
    \ 允许你使用单个初始化片段声明多个变量。\n\n### 条件\n\n显然，`for` 循环需要一个条件表达式。这是一个示例：\n\n```csharp\n\
    for (double sample = 1; sample < 5; …)\n{\n    // 这是循环体。\n}\n```\n\n计算机程序在运行循环体之前会评估条件表达式。如果结果为“true”，则运行循环体；否则，相关的程序将跳转到写在当前循环之后的语句。\n\
    \n### 更新语句\n\n这是 `for` 循环的最后部分。基本上，更新语句会更新循环的计数器。让我们使用上面的代码段：\n\n```csharp\nfor\
    \ (double sample = 10; sample > 1; sample--)\n{\n    // 这是循环体。\n}\n```\n\n程序在运行循环体后执行此部分。请记住，该语句更新了计数器的值。\n\
    \n### 循环体\n\n此部分由 C# 语句组成。它可以利用你在循环初始化片段中声明的变量。查看下例：\n\n```csharp\nfor (double\
    \ sample = 10; sample > 1; sample--)\n{\n    System.Console.WriteLine(sample);\n\
    }\n```\n\n### Continue 操作符\n\n在某些情况下，你需要停止当前的迭代而不结束循环本身。你可以使用 C# 中名为 `continue`\
    \ 的操作符完成此任务。下面的示例将说明该操作符如何工作：\n\n![](img/00027.jpeg)\n\n此代码计算范围（1 到 n）内所有除以 7\
    \ 且有余数的奇数总和。\n\n### “Foreach” 循环\n\nC# 最近引入了 `foreach` 循环的概念（即扩展的 `for` 循环）。这种循环概念也存在于\
    \ C、VB、C++、PHP 等其他编程语言。通过这个编程工具，你可以运行列表、数组或其他值组中的所有元素。`foreach` 循环即使在非索引数据组中也能获取所有现有元素。\n\
    \n在编写这种循环时，使用以下语法：\n\n```csharp\nforeach (type name_of_variable in name_of_group)\n\
    {\n    the_statements;\n}\n```\n\n如你所示，这种循环比典型的 `for` 循环简单得多。`foreach` 循环可以帮助你快速扫描集合内部所有的对象。无数程序员在编写代码时使用这种循环并不令人意外。\n\
    \n### 嵌套 for 循环\n\nC# 允许你将一个 `for` 循环放在另一个 `for` 循环内部。代码最内层的循环运行次数最多。而最外层的循环重复次数最少。在“嵌套”\
    \ for 循环时，你应该使用以下语法：\n\n```csharp\nfor (initializing_fragment, condition, update_statement)\n\
    {\n    for (initializing_fragment, condition, update_statement)\n    {\n     \
    \   statements\n    }\n}\n```\n\n在这里，程序运行初始的 `for` 循环，执行其循环体并触发嵌套循环。程序将检查第二个循环的条件并执行其内部的代码，直到评估变为\
    \ false。然后，程序将对循环计数器进行必要的调整。程序将重复整个过程，直到所有条件的评估均为 false。\n\n# 第 8 章：C# 语言的方法\n\
    \n本章将重点关注 C# 方法。在这里，你将学习如何在自己的程序中声明和利用方法。你需要记住这些课程才能成为一名高效的程序员。\n\n### 方法——基础\n\
    \n对于大多数程序员来说，方法是任何程序的核心方面。方法解决问题、接受用户输入（称为参数）并产生结果。\n\n### 方法提供的优势\n\n在本节中，你将发现方法提供的主要优势。阅读这些内容后，你将知道为什么在编写程序时要这些工具。\n\
    \n### 更好的结构和代码可读性\n\n编程专家认为编写程序时应该使用方法。即使是简单的方法也能提高代码的结构和可读性。如果代码易于阅读，你的工作将会变得轻松。\n\
    \n### 防止冗余代码\n\n方法可以帮助避免程序中的冗余代码。冗余或重复的代码通常会产生不良的结果。\n\n### 更好的代码重复\n\n这一优势与之前的密切相关。如果程序需要多次使用某些代码，将该片段转换为\
    \ C# 方法是一个极佳的主意。你可以多次调用方法，这意味着你可以重复使用重要代码。\n\n### 声明、实现和调用 C# 方法\n\n至此，你需要了解对现有方法可以执行的过程。这些过程包括：\n\
    \n* `声明`：在此过程中，你将方法链接到程序。此过程允许你在程序的任何部分调用该方法。\n* `实现`：此过程涉及完成特定任务的代码。相关的代码存在于你使用的方法内部。\n\
    * `调用`：这是调用已声明的方法。在这里，你使用方法来解决问题或执行操作。\n\n### 方法声明\n\n在 C# 中，你需要在类内部声明方法。此外，不允许“嵌套”方法（即在另一个方法的体内编写方法）。完美的例子是\
    \ `Main()`，你已经多次使用的方法。下面的代码说明了这一点：\n\n```csharp\nclass DeclaringMethods\n{\n \
    \   static void Main()\n    {\n        System.Console.WriteLine(“Hi C#!”);\n \
    \   }\n}\n```\n\n### 语法\n\n在声明方法时使用以下语法：\n\n`static data_type_of_the_result name_of_method\
    \ (list_of_parameters)`\n\n"
- fmt: "\nLet’s analyze this syntax using the `Main()` method (i.e. `static void Main()`).\
    \ `Main()` uses `void` as its return type since it doesn’t generate any result.\
    \ The word `Main` serves as its name. The parentheses, on the other hand, act\
    \ as containers for the parameters that the programmer will provide.\n\n**Important\
    \ Note**: You have to follow this syntax when writing a C# program. Don’t change\
    \ the placement of the method’s parts.\n\nC# doesn’t require you to include parameters\
    \ in your declarations. That means you can leave the parentheses empty (e.g. `Main()`).\n\
    \n## The Method’s Name\n\nYou need to indicate the method’s name during declarations,\
    \ invocations, or implementations. Here are the rules that you need to remember\
