    \ the example given below:\n\n![](images/00021.jpeg)\n\n## How to Read a Number\n"
  raw: 'Sometimes, the console serves as the most important tool for user-program
    interactions. For instance, you need to use the console when creating simple computer
    programs. These programs require you to focus on the problems that must be fixed.
    Beautiful GUIs (i.e. graphical user interface) and attractive outputs won’t help
    you with this task.


    You can also use the console to try a small code block before adding it to a complex
    program. Since the console is a simple tool, you can easily isolate the code block
    without pressing any button or seeing different screens. The console will give
    you the results that you need in just a few seconds.


    Accessing the Console


    The process of accessing the console depends on the OS you’re currently using.
    For instance, here are the steps you need to take if you are using a Windows computer:


    1.  Click on the Start button.


    2.  Click “Programs” and choose “Accessories”.


    3.  Click on the option that says “Command Prompt”.


    The console will display your home directory, which is represented by your username.
    In the example below, the username is SARAH:


    ![](images/00019.jpeg)


    Important Note: If you’re using Windows Vista, Windows 7, or Windows 8, you can
    launch the console by running a search for “cmd”.


    Additional Information About the Console


    The console is a black window that displays text-based information. It has a blinking
    cursor and shows character strings. As you can see, the cursor moves each time
    you type a character.


    A Windows program can be desktop-based, browser-based, internet-based, or console-based.
    A console-based program utilizes the console for input and output processes. Desktop-based
    programs, on the other hand, rely on their GUI for user-program interactions.
    This book focuses on console-based applications so you’ll be entering data using
    your keyboard and you will see the results within the command prompt.


    Certain console-based applications require the users to provide text, numbers,
    characters, etc. That means you’ll be using your keyboard often while working
    with a console-based program.


    The Basic Commands


    In this section, you’ll learn about the basic commands that you issue using the
    command prompt. You should study this material carefully if you want to be a great
    C# programmer.


    The Console Commands


    *   cd name_of_directory – This command allows you to change the active directory.
    For instance, if you want to go to the Users folder inside C:, you need to issue
    the following command:


    cd C:\Users


    *   dir – Use this command to view the files inside the active directory.


    *   rmdir name_of_directory – This command allows you to delete a directory. For
    example, rmdir Sample  deletes the directory named “Sample”.


    *   mkdir name_of_directory – With this command, you can create a new directory
    inside the active directory. For instance, if you’re currently in the Users directory,
    mkdir John will create a folder named “John” inside “Users”.


    *   type name_of_file – Use this command to view the content of an existing file.
    For instance, you may issue “type HelloCSharp.cs” to see the contents of that
    .cs file.


    Standard I/O


    The Standard I/O system is a mechanism developed for UNIX computers. This system
    involves special devices to accept input and produce output.


    If a program is waiting for the user to perform an action or provide information,
    the console will show a cursor. This means the system is in “waiting mode”.


    Input and Output


    Operating systems need to define the standard I/O mechanisms for user-program
    interactions. When launching a console-based application, the code at the program’s
    initialization block needs to work with I/O mechanisms assigned by the OS. This
    code allows the user to interact with the console-based program involved.


    Because of this code, the program can read the user’s input from “Console.In”
    (i.e. C#’s standard stream for inputs), send information to “Console.Out” (i.e.
    C#’s standard stream for outputs), and report problematic situations through “Console.Error”
    (i.e. C#’s standard stream for error messages).


    Important Note: You’ll learn about C# streams later in this book. This chapter
    will concentrate on the concepts and ideas related to C#’s I/O mechanisms.


    The I/O Devices


    Some programs accept non-keyboard inputs. For example, you can create a C# program
    that takes inputs from text files, barcode readers, microphones, and other data
    sources. A program can also send its output to the screen, to an external file,
    to a printer, etc.


    System.Console


    The class named System.Console has various methods and attributes that you can
    use to read, display, or format text-based information. Three of the most popular
    attributes of the System.Console class are related to entering and showing data.
    These attributes are: Console.In, Console.Out, and Console.Error.             


    These attributes help you in displaying data, reading information, and reporting
    error messages. C# allows you to use these attributes directly. However, you need
    to keep in mind that System.Console contains other methods and attributes that
    can help you with I/O operations.


    Important Note: The C# language allows you to modify the default streams of your
    programs. To do that, you need to use the following methods: Console.SetOut (for
    the Output stream), Console.SetIn (for the Input Stream), and Console.SetError
    (for the Error stream).


    The Console Input


    Programming languages have a system for entering information to the computer’s
    console. The C# language, in particular, uses an object called “Console.In” to
    control its input stream.


    Actually, you don’t have to use Console.In directly. The “Console” class offers
    two methods (i.e. Console.ReadLine and Console.Read) that work with Console.In.
    You can use these methods to read data from your command prompt.


    The Console.ReadLine Method


    This method offers simplicity and convenience for people who want to read data
    from their console. When you call this method, your program will stop and wait
    for the user’s input. Then, the user may enter a character or a string and hit
    “Enter”. By pressing the Enter key, the user informs the program that they have
    entered the needed input. The Console.ReadLine method will read the user’s input,
    hence the name.


    The code given below will show you how Console.ReadLine works:


    class Test


    {


                  static void Main()


                  {


                                System.Console.WriteLine("What is your first name?
    ");


                                string yourfirstName = System.Console.ReadLine();


                                System.Console.WriteLine("Please enter your last name?
    ");


                                string yourlastName = System.Console.ReadLine();


                                System.Console.WriteLine("Hi, {0} {1}!", yourfirstName,
    yourlastName);


    }


    }


    If you’ll enter “John” and “Smith” into the command prompt, you’ll get the following
    message:


    ![](images/00020.jpeg)


    The Console.Read Method


    There are significant differences between Console.Read and Console.ReadLine. First,
    Console.Read reads a single character only while Console.ReadLine reads the entire
    expression. Second, Console.Read returns a code rather than the accepted input.
    If you want to utilize the output as an ordinary character, you should do one
    of these things:


    *   Convert the output into a character


    *   Use the Convert.ToChar method on the result


    Important Note: Constant.Read will only read a character if the user hits “Enter”.
    When the user presses this key, the program will transfer the input to the standard
    string’s buffer and invoke the Console.Read method. Check the example given below:


    ![](images/00021.jpeg)


    How to Read a Number'
