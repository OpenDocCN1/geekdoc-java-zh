    有时，控制台是用户与程序交互时最重要的工具。例如，在创建简单的计算机程序时，你需要使用控制台。这些程序要求你关注必须解决的问题。美观 GUI（即图形用户界面）和吸引人的输出对你完成这项任务没有帮助。


    你还可以使用控制台在将小代码块添加到复杂程序之前对其进行尝试运行。由于控制台是一个简单的工具，你可以轻松地隔离代码块，而无需按下任何按钮或查看不同的屏幕。控制台可以在几秒钟内提供所需的结果。


    ## 访问控制台


    访问控制台的过程取决于你当前使用的操作系统。例如，如果你使用的是 Windows 电脑，需要执行以下步骤：


    1. 点击“开始”按钮。

    2. 点击“程序”并选择“辅助工具”。

    3. 点击名为“命令提示符”的选项。


    控制台将显示你的主目录，由你的用户名表示。在下面的示例中，用户名是 SARAH：


    ![](img/00019.jpeg)


    **注意：** 如果你使用的是 Windows Vista、Windows 7 或 Windows 8，可以通过搜索 `cmd` 来启动控制台。


    ## 关于控制台的附加信息


    控制台是一个显示文本信息的黑色窗口。它有一个闪烁的光标并显示字符字符串。如你所见，每当你输入一个字符时，光标就会移动。


    Windows 程序可以是基于桌面的、基于浏览器、基于互联网或基于控制台的。基于控制台的程序利用控制台进行输入输出过程。另一方面，基于桌面的程序依赖其 GUI
    进行用户与程序的交互。本书专注于基于控制台的应用程序，因此你将使用键盘输入数据并在命令提示符中查看结果。


    某些基于控制台的应用程序要求用户提供文本、数字、字符等。这意味着在处理基于控制台的程序时，你将经常使用键盘。


    ## 基本命令


    在本节中，你将学习使用命令提示符发出的基本命令。如果你想成为一名出色的 C# 程序员，应该仔细学习这些材料。


    ### 控制台命令


    * `cd name_of_directory` – 此命令允许你更改活动目录。例如，如果你想进入 C 盘下的 Users 文件夹，你需要输入以下命令：`cd
    C:\Users`

    * `dir` – 使用此命令查看活动目录中的文件。

    * `rmdir name_of_directory` – 此命令允许你删除目录。例如，`rmdir Sample` 会删除名为“Sample”的目录。

    * `mkdir name_of_directory` – 使用此命令，你可以在活动目录中创建新目录。例如，如果你当前在 Users 目录，`mkdir John`
    将在“Users”内部创建一个名为“John”的文件夹。

    * `type name_of_file` – 使用此命令查看现有文件的内容。例如，你可以输入 `type HelloCSharp.cs` 来查看该 `.cs`
    文件的内容。


    ## 标准输入输出 (I/O)


    标准输入输出系统是为 UNIX 计算机开发的机制。该系统涉及特殊设备以接受输入并产生输出。


    如果程序正在等待用户执行操作或提供信息，控制台将显示光标。这意味着系统处于“等待模式”。


    ### 输入与输出


    操作系统需要为用户与程序的交互定义标准输入输出机制。在启动基于控制台的应用程序时，程序初始化块中的代码需要与操作系统分配的 I/O 机制工作。这些代码允许用户与相关的控制台程序进行交互。


    由于这段代码的存在，程序可以从 `Console.In`（即 C# 的标准输入流）读取用户的输入，并将信息发送到 `Console.Out`。


    **注意：** 这里的代码在后续将讨论的 I/O 机制。

