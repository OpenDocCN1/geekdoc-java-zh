  trans: "\n让我们使用 `Main()` 方法（即 `static void Main()`）来分析这种语法。`Main()` 使用 `void` 作为返回类型，因为它不产生任何结果。`Main`\
    \ 单词作为它的名称。而另一方面，括号充当程序员将提供的参数的容器。\n\n**重要说明**：在编写 C# 程序时，你必须遵循这种语法。不要更改方法各个部分的位置。\n\
    \nC# 并不要求你在声明中包含参数。这意味着你可以让括号保持为空（例如 `Main()`）。\n\n## 方法名称\n\n在声明、调用或实现期间，你需要指定方法的名称。在为方法命名时，你需要记住以下规则：\n\
    \n- 确保首字母为大写字母。\n- 每个单词的起始字母都用大写字母开头（例如 `SampleMethod`、`NewMethod`、`MainLine`\
    \ 等）。\n- 使用动词和名词作为你方法的名称。\n\n**重要说明**：上述讨论的规则完全是可选的。如果你希望你的 C# 代码具有良好的结构和可读性，请遵循这些规则。\n\
    \n## 方法实现\n\n仅仅声明方法是不够的。如果你想让方法在程序中运行，你还需要实现你的方法。程序员在提到方法的实现时使用“体”（body）一词。\n\n\
    ### 方法体\n\n你会在大括号内找到方法体。此体由你想执行的命令、表达式和语句组成。因此，体是任何方法的重要组成部分。\n\n**重要说明**：记住在\
    \ C# 中你不能嵌套方法。不要在其他方法内部编写方法。\n\n## 方法调用\n\n基本上，这是运行方法体内部语句的过程。调用方法非常简单：你只需要指定它的名称，添加一对大括号，并使用分号结束该行。你应该使用的语法如下：\n\
    \n```\nname_of_method();\n```\n\n下面提供的示例代码将向你展示如何调用方法：\n\n```csharp\nclass Animals\n\
    {\n    static void Main()\n    {\n        Console.WriteLine(\"I love dogs.\");\n\
    \    }\n}\n```\n\n如果你编译并执行该代码，你的命令行提示将打印以下消息：\n\n`I love dogs.`\n\n## 你调用方法的地方\n\
    \nC# 允许你在以下区域调用方法：\n\n- 在程序的主方法内部（即 `Main()`）。\n- 在另一个方法内部。\n- 在方法自身的体内部。这种技术被称为“递归”。\n\
    \n## 结\n\n再次感谢你下载这本书！\n\n希望这本书能够帮助你在短短几天内就成为一名熟练的 C# 程序员。\n\n下一步是继续使用 C# 编写你自己的程序。\n\
    \n最后，如果你喜欢这本书，我想请你帮个忙，你是否愿意在 Amazon 上为这本书留个评价？我将不胜感激！\n\n感谢你并祝你好运！\n"
