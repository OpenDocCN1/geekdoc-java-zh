    or monetary loss due to the information herein, either directly or indirectly.


    Respective authors own all copyrights not held by the publisher.


    The information herein is offered for informational purposes solely, and is universal
    as so. The presentation of the information is without contract or any type of
    guarantee assurance.


    The trademarks that are used are without any consent, and the publication of the
    trademark is without permission or backing by the trademark owner. All trademarks
    and brands within this book are for clarifying purposes only and are the owned
    by the owners themselves, not affiliated with this document.


    Table of Contents


    Introduction


    Chapter 1: The Core Concepts of C#


    Chapter 2: The Data Types, Variables, and Literals of C#


    Chapter 3: The Operators of the C# Language


    Chapter 4: Data Type Conversion


    Chapter 5: The Console


    Chapter 6: The Conditional Statements of C#


    Chapter 7: The Loop Statements


    Chapter 8: The Methods of the C# Language


    Conclusion


    Chapter 1: The Core Concepts of C#


    According to computer experts, the best way to learn a programming language is
    by writing and analyzing codes. Thus, you’ll write an actual computer program
    before studying the language itself. This approach will help you to understand
    how C# works. Also, you’ll become familiar with the syntax and structures of this
    language.


    Your First Program


    Here’s the code that you need to type:


    ![](images/00001.jpeg)


    This program prints “Hello, C#!” onto your computer’s default output device. It’s
    still a “raw” program so you can’t run it yet. For now, let’s just analyze its
    structure. The next section will teach you how to compile and run programs using
    a command prompt and a programming environment.


    How Does It Work?


    This sample program consists of three parts:


    1.  The class definition;


    2.  The method definition; and


    3.  The method’s contents.


    Let’s discuss each part in detail:


    The Class Definition – The initial line of the program defines a class named HelloCSharp.
    The most basic class definition has two sections: (1) the word “class” and (2)
    the name of the new class. In this example, HelloCSharp serves as the class’s
    name. You’ll find the contents of this class inside the pair of braces (i.e. {
    }).


    The Method Definition – This part is located at the third line of the program.
    Here, you defined a method known as Main(). All C# programs use the main() method
    as their starting point. Here’s the syntax that you need to use:


    ![](images/00002.jpeg)


    As you can see, Main() needs to be void and static. The arguments (i.e. the part
    inside the parentheses) are completely optional. That means you can simplify the
    Main() function into:


    ![](images/00003.jpeg)


    Important Note: Your program won’t run if you’ll enter the Main() method incorrectly.


    The Method’s Contents – You’ll find the contents of any method after its name.
    In general, a pair of braces encloses those contents. The fifth line of the sample
    program uses an object (i.e. System.Console) and a method (i.e. WriteLine()) to
    display a message on your computer’s console. As mentioned earlier, the message
    is “Hello, C#!”


    Important Note: When working on Main(), you may arrange C# expressions and statements
    according to your preferences. You won’t get any error message even if you arrange
    those expressions and/or statements randomly. However, your completed program
    will run those entries according to their position inside the method’s body.


    The Rules You Need To Remember When Writing Codes


    C# – A Case-Sensitive Computer Language


    This language is case-sensitive. That means you need to be careful with letter
    capitalization when typing C# codes. Basically, C# treats “power”, “Power”, and
    POWER as three different objects.


    Important Note: You need to remember this rule. It applies to all of the elements
    of any C# program (e.g. variables, constants, classes, etc.).


    Use the Proper Format


    You need to add tabs, spaces, and newline characters to your code to improve its
    readability. These characters, which are ignored by the C# compiler, give an excellent
    structure to your source codes.


    For instance, you may remove the newline characters from the HelloCSharp code:


    ![](images/00004.jpeg)


    As an alternative, you may remove the tab characters from it:


    ![](images/00005.jpeg)


    The last two examples work fine in terms of compilation and program execution.
    However, they are difficult to analyze, modify, understand, and maintain.


    Important Note: Make sure that all of your programs have formatted codes. This
    way, you can guarantee the readability of your codes.


    How to Format Codes Properly


    Here are the rules that you need to follow when formatting your codes:


    *   You may indent methods within the class definition. C# allows you to use any
    number of tab characters (i.e. the character you’ll get after hitting the Tab
    key of your keyboard) when formatting source codes.


    *   You should indent the method’s contents within its own definition.


    *   Place the opening brace (i.e. {) right under the class or method to which
    it belongs. Also, it would be best if it will be the only character on its line.


    *   Make sure that the closing brace (i.e. }) is vertically aligned with the opening
    brace.


    *   The names of your class should begin with an uppercase letter.


    *   The names of your variables should start with a lowercase letter.'
