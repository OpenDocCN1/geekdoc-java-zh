    * 对象 (Objects)

    * 浮点型 (Floating-Point)

    * 小进制 (Decimals)

    * 整数 (Integers)

    * 字符串 (Strings)


    由于这些数据类型已预装在 C# 语言中，程序员将它们称为“原始类型”。让我们详细讨论每个数据类型：


