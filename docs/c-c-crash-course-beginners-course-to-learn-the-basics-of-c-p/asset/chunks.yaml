  trans: "\n\n*   条件语句的体 – 这可以是一个单独语句，也可以是一组语句。如果你使用多个语句，请将它们封装在花括号内部。\n*   `else`\
    \ 关键字 – 这是一个 C# 关键字，用于触发 `else` 子句。\n*   `else` 子句的体 – 这与条件语句的体完全相同（见上文）。\n\n\
    在处理 `if-else` 语句时，计算机程序会分析括号内的值。该值必须是布尔值（即 true 或 false）。如果该值为“true”，程序将执行条件语句的体并忽略\
    \ `else` 子句。然而，如果该值为 false，程序将运行 `else` 语句的体。请分析以下示例：\n\n```csharp\nint a = 100;\n\
    \nif (a != 50)\n{\n    Console.WriteLine(\"The variable is not equal to 50\");\n\
    }\nelse\n{\n    Console.WriteLine(\"The variable is equal to 50\");\n}\n```\n\n\
    你可以将此代码解释为：如果 `a != 50`，控制台将打印：“The variable is not equal to 50”。另一方面，如果 `a =\
    \ 50`，控制台将显示：“The variable is equal to 50”。由于变量 `a` 的持值为 100，你的命令提示符将给出以下内容：\n\
    \n![](img/00022.jpeg)\n\n## 嵌套语句\n\n在某些情况下，你需要在另一个 `if` 语句内部编写一个 `if` 语句。程序员将此过程称为“嵌套”。这意味着如果你在另一个条件语句内部编写它，那么你正在执行“嵌套”一个条件语句。\n\
    \n**重要提示：** C# 允许你嵌套 `if-else` 语句。在这种情况下，每个 `else` 子句都指向它之前的 `if` 子句。这个简单的规则可以帮助你分析嵌套条件语句，这些语句可能极其复杂。\n\
    \n根据专家程序员的建议，你不应该创建超过三层级的嵌套语句。如果你确实需要使用四个或更多条件结构，请将其导出到不同的方法中（你稍后会学习方法）。\n\n下面的代码将向你展示嵌套\
    \ `if` 语句是如何工作的：\n\n```csharp\nint a = 10;\nint b = 20;\n\nif (a > b)\n{\n   \
    \ Console.WriteLine(\"a is greater than b\");\n}\nelse\n{\n    if (a < b)\n  \
    \  {\n        Console.WriteLine(\"a is less than b\");\n    }\n    else\n    {\n\
    \        Console.WriteLine(\"a is equal to b\");\n    }\n}\n```\n\n## Switch-Case\
    \ 语句\n\n在可能的答案很多的情况下，程序员会使用 `switch-case` 语句。以下是 `switch-case` 语句的语法：\n\n```csharp\n\
    switch (selector)\n{\n    case first_integer:\n        statements;\n        break;\n\
    \    case second_integer:\n        statements;\n        break;\n    default:\n\
    \        statements;\n        break;\n}\n```\n\n基本上，选择器（selectors）是返回可用值的表达式（即你可以进行比较或处理的值）。`switch`\
    \ 关键字将 `selector` 的值与 `cases` 进行比较。如果 `selector` 的值与某个 `case` 匹配，则分配给该 case 的语句将运行。然而，如果没有匹配，程序将执行\
    \ `default` 语句。\n\n**重要提示：** 确保 `cases` 具有唯一的值。如果两个或多个 case 共享相同的值，你的程序将产生意外的结果。如所示，每个\
    \ case 都有一个 `break` 子句。`break` 子句终止它所属的 case。C# 要求你在所有的 switch 语句中添加此子句。你不需要将\
    \ `default` 部分放在 switch-case 语句的末尾。但是，如果你想保持代码的可读性，建议放在该位置。\n\n## 第 7 章：循环语句\n\
    \n本章将教你如何使用循环语句。作为一名程序员，你将使用循环语句反复运行某些代码块。循环在 C# 编程中起着重要作用。因此，如果你想掌握这种语言，应该仔细学习这些材料。\n\
    \n### 循环 – 基础\n\n在创建程序时，你通常需要多次执行代码序列。多次输入相同的代码块会非常无聊。因此，你需要找到一种快速简单的方法来重复代码。幸运的是，C#\
    \ 语言支持循环语句。\n\n循环是一个反复运行代码的工具。你可以用它运行特定次数的代码，或者只要满足给定条件一直运行。C# 提供了不同类型的循环语句。让我们详细分析每个类型：\n\
    \n### While 循环\n\n这是 C# 中最简单的循环语句。它的语法如下：\n\n```csharp\nwhile (the_assigned_condition)\n\
    {\n    the_loop’s_body\n}\n```\n\n在此语法中，`the_assigned_condition` 是一个产生布尔值的表达式。该条件决定了\
    \ `body` 运行的次数。而 `body` 是你想要执行的语句（或语句组）。\n\n给出的图表将说明 while 循环的工作原理：\n\n![](img/00023.jpeg)\n\
    \n在处理 `while` 循环时，C# 程序会检查布尔表达式的值。如果值为“true”，程序将运行循环体内的所有语句。然后，程序将再次检查布尔表达式以查看其值。如果值仍然为真，程序将再次运行循环体。\n\
    \n**重要提示：** 如果布尔值为 false，C# 程序将不会运行 while 体。因此，如果你在启动程序时布尔值为 false，你的循环内语句将不会执行。\n\
    \n以下示例将说明 while 循环的工作方式：\n\n```csharp\nint timer = 10;\n\nwhile (timer >= 0)\n\
    {\n    System.Console.WriteLine(\"Time remaining: \" + timer);\n    timer--;\n\
    }\n```\n\n如果你编译并执行此代码，你的命令提示符将显示以下内容：\n\n![](img/00024.jpeg)\n\n### Break 运算符\n\
    \n你可以使用 `break`（一个 C# 运算符）提前退出循环。当程序员不想等待循环自然结束时，他们会使用此运算符。基本上，循环一旦遇到 `break`\
    \ 运算符就会结束。这种情况强制程序跳转到循环后的代码片段。\n\n在 C# 中，你只能在循环体内部使用此运算符。这意味着 `break` 只有在循环运行时才有效。\n\
    \n### Do-While 循环\n\n`do-while` 循环与 `while` 循环几乎相同。这些循环之间的唯一区别在于前者在运行循环体之后分析布尔值。因此，你可以确定即使布尔表达式为\
    \ false，你的代码至少也会运行一次。以下是 do-while 循环的语法：\n\n```csharp\ndo\n{\n    statements\n\
    } while (Boolean expression)\n```\n\nDo-while 循环按照此模式工作：\n\n![](img/00025.jpeg)\n\
    \n"
