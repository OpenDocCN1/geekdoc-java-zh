    \ using Windows Vista, Windows 7, or Windows 8, you can launch the console by\
    \ running a search for `cmd`.\n\n## Additional Information About the Console\n\
    \nThe console is a black window that displays text-based information. It has a\
    \ blinking cursor and shows character strings. As you can see, the cursor moves\
    \ each time you type a character.\n\nA Windows program can be desktop-based, browser-based,\
    \ internet-based, or console-based. A console-based program utilizes the console\
    \ for input and output processes. Desktop-based programs, on the other hand, rely\
    \ on their GUI for user-program interactions. This book focuses on console-based\
    \ applications so you’ll be entering data using your keyboard and you will see\
    \ the results within the command prompt.\n\nCertain console-based applications\
    \ require the users to provide text, numbers, characters, etc. That means you’ll\
