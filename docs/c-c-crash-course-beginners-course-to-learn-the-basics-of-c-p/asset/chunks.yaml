    \ “Users”.\n* `type name_of_file` – Use this command to view the content of an\
    \ existing file. For instance, you may issue `type HelloCSharp.cs` to see the\
    \ contents of that `.cs` file.\n\n## Standard I/O\n\nThe Standard I/O system is\
    \ a mechanism developed for UNIX computers. This system involves special devices\
    \ to accept input and produce output.\n\nIf a program is waiting for the user\
    \ to perform an action or provide information, the console will show a cursor.\
    \ This means the system is in “waiting mode”.\n\n### Input and Output\n\nOperating\
    \ systems need to define the standard I/O mechanisms for user-program interactions.\
    \ When launching a console-based application, the code at the program’s initialization\
    \ block needs to work with I/O mechanisms assigned by the OS. This code allows\
    \ the user to interact with the console-based program involved.\n\nBecause of\
    \ this code, the program can read the user’s input from `Console.In` (i.e. C#’s\
    \ standard stream for inputs), send information to `Console.Out` (i.e. C#’s standard\
    \ stream for outputs), and report problematic situations through `Console.Error`\
    \ (i.e. C#’s standard stream for error messages).\n\n**Important Note:** You’ll\
    \ learn about C# streams later in this book. This chapter will concentrate on\
    \ the concepts and ideas related to C#’s I/O mechanisms.\n\n### The I/O Devices\n\
    \nSome programs accept non-keyboard inputs. For example, you can create a C# program\
    \ that takes inputs from text files, barcode readers, microphones, and other data\
    \ sources. A program can also send its output to the screen, to an external file,\
    \ to a printer, etc.\n\n## System.Console\n\nThe class named `System.Console`\
    \ has various methods and attributes you can use to read, display, or format text-based\
    \ information. Three of the most popular attributes of the `System.Console` class\
    \ are related to entering and showing data. These attributes are: `Console.In`,\
    \ `Console.Out`, and `Console.Error`.\n\nThese attributes help you in displaying\
    \ data, reading information, and reporting error messages. C# allows you to use\
    \ these attributes directly. However, you need to keep in mind that `System.Console`\
    \ contains other methods and attributes that can help you with I/O operations.\n\
    \n**Important Note:** The C# language allows you to modify the default streams\
    \ of your programs. To do that, you need to use the following methods: `Console.SetOut`\
    \ (for the Output stream), `Console.SetIn` (for the Input Stream), and `Console.SetError`\
    \ (for the Error stream).\n\n## The Console Input\n\nProgramming languages have\
