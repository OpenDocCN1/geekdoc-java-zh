    \ is a simple tool, you can easily isolate the code block without pressing any\
    \ button or seeing different screens. The console will give you the results that\
    \ you need in just a few seconds.\n\n## Accessing the Console\n\nThe process of\
    \ accessing the console depends on the OS you’re currently using. For instance,\
