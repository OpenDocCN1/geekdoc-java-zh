  raw: 'Let’s analyze this syntax using the Main() method (i.e. static void Main()).
    Main() uses “void” as its return type since it doesn’t generate any result. The
    word “Main” serves as its name. The parentheses, on the other hand, act as containers
    for the parameters that the programmer will provide.


    Important Note: You have to follow this syntax when writing a C# program. Don’t
    change the placement of the method’s parts.


    C# doesn’t require you to include parameters in your declarations. That means
    you can leave the parentheses empty (e.g. Main()).


    The Method’s Name


    You need to indicate the method’s name during declarations, invocations, or implementations.
    Here are the rules that you need to remember when naming your methods:


    *   Make sure that the initial letter is in uppercase.


    *   Begin each word with an uppercase letter (e.g. SampleMethod, NewMethod, MainLine,
    etc.).


    *   Use verbs and nouns as names of your methods.


    Important Note: The rules discussed above are completely optional. Follow these
    rules if you want to have excellent structure and readability in your C# codes.


    Method Implementations


    Declaring a method isn’t enough. You also need to implement your methods if you
    want them to run inside your programs. Programmers use the term “body” when referring
    to the implementation of a method.


    The Body


    You’ll find the method’s body inside a pair of curly braces. This body consists
    of commands, expressions, and statements that you want to execute. Thus, the body
    is an important part of any method.


    Important Note: Keep in mind that you cannot nest methods in C#. Don’t write methods
    inside other methods.


    Method Invocations


    Basically, this is the process of running the statements within the method’s body.
    Invoking a method is easy and simple: you just have to indicate its name, add
    a pair of curly braces, and terminate the line using a semicolon. Here’s the syntax
    that you should use:


    name_of_method();


    The sample code given below will show you how to invoke a method:


    class Animals


    {     static void Main()


    {


                  Console.WriteLine(“I love dogs.”);


    }


    }


    If you’ll compile and execute that code, your command prompt will print the following
    message:


    I love dogs.


    The Places Where You Can Invoke a Method


    C# allows you invoke methods in the following areas:


    *   Inside              the program’s main method (i.e. Main()).


    *   Inside another method.


    *   Inside the method’s own body. This technique is called “recursion”.


    Conclusion


    Thank you again for downloading this book! 


    I hope this book was able to help you become a skilled C# programmer in just a
    few days. 


    The next step is to continue writing your own programs using C#.


    Finally, if you enjoyed this book, then I’d like to ask you for a favor, would
    you be kind enough to leave a review for this book on Amazon? It’d be greatly
    appreciated!


    Thank you and good luck!'
