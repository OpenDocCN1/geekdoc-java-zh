    You are encouraged to spend the time reading the following description of how
    the program is designed and also to study the final result and including primary
    the program’s code and to test the program.


    ### The task


    Many private wine lovers has a substantially wine storage – perhaps several hundred
    bottles or more. It requires control, including to ensure that the wine is not
    too old, but also for the sake of historical data with information about prices,
    ratings, etc. These historical data are vital when buying the same wine again,
    but also to learn from experience and in general as documentation of purchase
    and consumption. There is thus not only a need to keep track of the current stock,
    but at least as much a need to store information about wines that are drunk and
    removed from the wine cellar.


    The wines are acquired from different Danish suppliers – including grocery stores,
    but there may also be stock entries either in the form of direct import (that
    is from holidays or trips to wine countries) or gifts. The wines are purchased
    at greatly varying prices, and especially in connection with gifts, the price
    can be 0 (or lack of). It is common in the business, the granting of large discounts
    (and, arguably, even unrealistically large similar to that the list prices is
    not real). The price, and thus the discount granted is often determined by whether
    you buy single bottles or boxes (of 6 or 12 bottles).


    The task is to write a program called `MyWines` that should be used to manage
    a private wine cellar. The program should be written in accordance with the following
    requirements/wishes.


    In general, it should be possible to record the following information about a
    wine:


    **Information on the supplier (where the wine is purchased or obtained):**


    * The supplier’s phone number

    * The supplier’s name (company name or other)

    * The supplier’s address

    * The supplier’s zip code

    * The supplier’s city

    * The supplier’s email address


    Which supplier information that actual should be recorded may vary, because a
    wine can be a gift or be imported from abroad.


    **Information about the wine (that is facts about the product):**


    * The wine’s name

    * The producer’s name

    * The wine’s type (white, red, rosé, sparkling, dessert, port)

    * The country where the wine is produced

    * The country’s code

    * Wine district (for example, Alsace, Barolo etc.)

    * The grapes used for the production of the wine and in what quantities

    * Classification if there is a classification (for example Chianti Classico Riserva
    DOCG)

    * The wine’s vintage

    * Alcohol percent

    * Size of the bootle/packing (in cl)


    **Information about the purchase:**


    * The date when the wine is purchased

    * Expiry date (date when the wine latest should be drunk)

    * The wine’s price without discount

    * Discount price

    * The number of bottles purchased

    * Quality (D = daily wine, H = house wine, Q = quality wine, C = cellar wine,
    X = cult wine)


    **The stock levels:**


    * Stock level (the current number of bottles)

    * Revised quality (D, H, Q, C, X)

    * Rating – an assessment consists of a date and a character from 0 to 100

    * A description of the wine as a text


    Every time there is used a bottle from the store, you have to register, which
    wine it is, how many bottles are taking and when.


    For both the supplier and the wine itself one can not expect that all the information
    is present, and the same goes for how long the wine can be saved, discount and
    classification when a new wine must be added to the store, and in general you
    should be aware that sometimes you only have the knowledge that you can get from
    the label on the bottle.


    The program should basically have the following features:


    1. Register/create new wines (purchase)

    2. Updates (consumption from the store and classifications)

    3. Search functions


    Because the work of records information about wines can be comprehensive (there
    may be many details), you should aim for a solution where you have to enter as
    little as possible, and where it is easy to get the data available, which is already
    in the system. On the whole, you should priority that the program is easy to use
    and it is important that the program is robust and react sensibly by improper
    operation.


    The program must have a search function where one can easily search wines from
    several criteria. You should aim for enhanced flexibility when searching, but
    conversely, the function should not be too complex. In connection with the search
    for wines, one should get:


    * an overview of the total wine purchases within a given period and if necessary
    with the possibility of demarcation on country or by other criteria

    * an overview of the total consumption within a given period and if necessary
    with the possibility of demarcation on country or by other criteria

    * an overview of a wine’s rating assessments over time (points)


    It is also a desire that the program has a feature where one quickly can get a
    list of the wines that have reached the expiration date, and possibly has exceeded
    the expiration date, but also wines that should be drunk within the next time.


    ### Database design


    I will start the development with design and implentation of the database. If
    I look at the above description of the task, the database should contain infomation
    about suppliers, and the analysis of the description results in two tables (se
    below). Basically, it is an address book, and here you will usually place the
    zip code and the city name in a table for zip codes, and then let `code` be a
    foreign key in the table `supplier`. Sometimes one can illustrate database tables
    with a figure as below, here indicates that there are two tables, and what columns
    these tables must have. If the name of a column is underlined it means that the
    column is a primary key. Which columns there should be, comes from the description
    of the task, but in practice the software developer through an analysis must contact
    the person who has proposed the task to clarify uncertainties, but also exactly
    to define the data types to be used. In this case, information about the supplier
    has been expanded with a new value, where it is possible to register a description
    of the supplier. On a figure as below the arrow shows, that the table `supplier`
    must have a foreign key to the table `zipcode`.


    ![](image/Image37780.jpg)


    The primary database table is a table `wine`, which should contain information
    about a particular wine, and thus a wine to be included in the cellar. This table
    would have among others the following columns:


    ![](image/Java_6_26-4-17_113.jpg)


    and here it is also agreed that it should be possible to register a description
    of a wine. A wine has to be identified by a surrogate key, and it is agreed that
    two wines are considered different, if they do not have the same production year.
    Furthermore, for each wine it must be possible to define


    * supplier

    * packing (bottle, bib, other)

    * producer

    * production country

    * district

    * classification

    * wine type

    * wine category


    Here are suppliers already described and the table wine must have a foreign key
    to the `supplier`. The 7 other informations is in principle text, but it has been
    decided to register the individual information in their own table. The argument
    is partly that several wines must be registered with the same value, and second,
    that it can be difficult to ensure that the same text is spelled the same way
    each time, and finally you have for packing and district to register an additional
    information which is respectively the packing’s volume and the district’s country.
    For the type of wine and wine categories the description of the task defines a
    natural primary key (one letter), but for the other 5 I has to choose a surrogate
    key. The design should therefore be extended with 7 other but simple tables (these
    tables are sometimes called dimension tables) and the table wine must have additional
    8 foreign keys.

    '
