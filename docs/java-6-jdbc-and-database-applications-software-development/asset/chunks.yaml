    # 6 Transactions


    When performing an SQL statement using either a `Statement` or `PreparedStatement`
    object, the database is immediately updated. Sometimes it is not appropriate,
    since you often have multiple SQL statements thart must be executed as a whole,
    where either all statements are executed correctly or everyone are ignored. In
    database contexts wee talks about a `transaction` that simply means that multiple
    SQL statements can be perceived as a whole. The following test method inserts
    three rows in the table `history`, where the three statements is performed as
    a transaction:


    ![](image/Java_6_26-4-17_47.jpg)


    First as before is in the usual way created a connection to the database, and
    the next statement says that there should be no `auto commit`. This means that
    subsequent SQL statements are not immediately been performed on the database (they
    are marked as statements that can be rolled back), and the effect will not appear
    before performing a `commit()`.


    The statement


    ![](image/Java_6_26-4-17_471.jpg)


    means that a transaction is starting. The next statement creates an `ArrayList`
    and is explained shortly. Next, is created a `PreparedStatement`, which represents
    a SQL command that inserts a row in the table `history`, but only insert values
    in the columns `name` and `title`. Then the method performs three calls of a method
    `insert()`, which inserts a row in the table. If it goes well, a `commit()` is
    performed, and the three insertions of rows are permanent inserted in the database.
    If, however, one of the three `insert()` raises a `SQLException`, the catch block
    is performed and executes a `rollback()`, which means that the database operations
    performed after the start of the transaction is rolled back and the database has
    the same condition as before the transaction was started.


    Then there is the method `insert()`:


    ![](image/Java_6_26-4-17_48.jpg)


    The method performs a call to a method that inserts the values for the parameters
    in `stmt`, and then the statement is executed. The primary key of the table `history`
    is an auto-generated `Integer`, and sometimes you need to know the `id` when a
    row is assigned. This can be done in several ways, but I’ve written a little method
    for this purpose:


    ![](image/Java_6_26-4-17_49.jpg)


    Here is `LAST_INSERT_ID()` a function in MySQL, which returns the last assigned
    auto-generated ID. These keys are in this example added to an `ArrayList` that
    is not used for anything, but it does in the next example, and here you must mainly
    observe how to grab an auto generated key.


    If one executes the above test method, the last INSERT fails, since there is no
    value for the column `name`, and in the database is defined that this column must
    have a value. That is, there is a rool back. If you open `MySQL Workbench`, you
    can easily convince yourself that the rows are not inserted.


    The example shows basically what there is to say about transactions, but there
    is also a possibility to define a `Savepoint`, which can be used to indicate that
    not all operations has to be rolled back. Consider the following test method,
    which is an extension of the above method:


    ![](image/Java_6_26-4-17_491.jpg)!(image/Java_6_26-4-17_50.jpg)


    The first part is basically the same as the method `test09()`, except that there
    is defined an additional `PreparedStatement` to a SQL UPDATE. Furthermore, there
    is defined a name for the last INSERT, such it will not fails. After the three
    `insert()` methods are performed, the test method performs a `commit()` and defines
    a `Savepoint`, indicating that up to this point of the transaction the statements
    are executed correct. Next, the method `update()` is executed for each of the
    three rows that are inserted in the table. The method updates the column `country`
    and it is here that I uses the keys that are stored in the list. Here are the
    first two `update()` done correctly, but the last one raises a `SQLException`
    when the column `country` only has room for two characters. The result is that
    control is transferred to the catch block, which perform a rollback, but when
    the `Savepoint` object is not `null`, one can conclude that the `Savepoint` is
    reached, and thus the INSERT statements are executed without error. Therefore
    is only rolled back from the `Savepoint`.


    ## 6.1 Batch updates


    As a last thing concerning JDBC and database operations, I will mention batch
    updates. If you have to perform many database operations – such as many INSERT
    statements – it may take a long time, if the program calls the database for each
    statement. You can then gather all operations in a batch, which is possible for
    a `Statement`, a `PreparedStatement` and a `CallableStatement`, and then performs
    all operations at once with a single connection. The following test method shows
    the syntax:


    ![](image/Java_6_26-4-17_51.jpg)!(image/Java_6_26-4-17_52.jpg)


    `createKings()` is a method that, in principle, is identical to `createPersons()`
    (it creates just some other `Person` objects). Inside the try block the method
    creates two `PreparedStatement` objects respectively a DELETE and an INSERT. Since
    it is not a requirement that JDBC supports batch updates, is is first tested whether
    that is the case, and if so a loop of all the objects in the list, add statements
    to delete the corresponding rows, if they exist, but instead of performing `executeUpdate()`
    is performed an `addBatch()`, which adds that database operations to a list of
    operations in the object `stmt1`. Subsequently, the same happens for all objects
    in the list, but this time as `stmt2` objects. So far, the database operations
    are not performed, but it happens eventually with the method `executeBatch()`.


