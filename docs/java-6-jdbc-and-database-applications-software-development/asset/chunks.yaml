    下面我将展示几个简单存储过程的示例，以及如何使用 MySQL Workbench 创建它们。在数据库中，右键点击点击 `Stored Procedures`
    并选择 `Create Stored Procedure`，MySQL Workbench 就会创建一个骨架：


    ![](img/Java_6_26-4-17_1821.jpg)


    然后你可以按照如下方式编写一个名为 `Hello` 的存储过程：


    ![](img/Java_6_26-4-17_1822.jpg)


    如果你接着点击 `Apply`，该存储过程就会被转换；如果没有错误，它会被存储在数据库中，并且 MySQL Workbench 将显示完成后的代码：


    ![](img/Java_6_26-4-17_183.jpg)


    首先发生的情况是，如果已经存在同名的存储过程，该过程将被删除。接下，定义一个标点符号，用于告知 MySQL 存储过程已结束。默认情况下它是美元符号 `$`。在存储过程转换并保存后，可以如下所示执行：


    ![](img/Java_6_26-4-17_1831.jpg)


    结果是存储过程在屏幕上打印出 `Hello World`。


    显然并不是一个特别有趣的存储过程，但它展示了其原理，即一个或多个 SQL 语句可以在一个公共名称下执行。除了查看更多示例外，基本上还有两点必须处理，即参数和程序逻辑。


    下方展示了一个存储过程示例，它用于计算页数大于等于 `a` 且小于等于 `b` 的书籍数量，其中 `a` 和 `b` 是输入参数。结果保存在输出参数 `c`
    中：


    ![](img/Java_6_26-4-17_1832.jpg)


    你应该注意存储过程是如何使用 `INTO` 运算符将结果存储在 `c` 中的。接内容显示了如何使用该存储过程计算页数大于等于 200 且小于等于 500 的书籍数量：


    ![](img/Java_6_26-4-17_184.jpg)


    还可以将参数定义为 `INOUT`。接的存储过程确定页码小于或等于参数 `t` 值的书籍平均页数：


    ![](img/Java_6_26-4-17_1841.jpg)


    该存储过程可以如下使用：


    ![](img/Java_6_26-4-17_1842.jpg)


    以下脚本创建一个只有一个表的数据库，该表只有一个列：


    ![](img/Java_6_26-4-17_185.jpg)


    我向该数据库添加了一个存储过程，该过程的作用是：如果参数 `n` 是质数且已不在表中，则将参数 `n` 的值添加到表中。该存储过程的结果存储在参数 `r`
    中：


    ![](img/Java_6_26-4-17_1851.jpg)


    下方是该存储过程的应用示例：


    ![](img/Java_6_26-4-17_1852.jpg)


    上述存储过程没有太大的实际意义，其目标仅仅是展示在存储过程中，你可以像在 Java 中那样使用程序逻辑。


    最后需要补充的是，关于存储过程还有很多可以说的，你可能还会拥有存储函数，但上述内容足以说明什么是存储过程了。


    '
