    \ the class *Mainiew* I have also written the following classes\n\n*   *mywines.tables.Wines*\n\
    \n*   *mywines.repositories.DB*\n\n*   *mywines.repositories.Repository*\n\nThe\
    \ class *Wines* is a simple model class to a *JTable*, and contains nothing new.\
    \ The class *DB* should represents a connection to a database and is written as\
    \ a singleton:\n\n![](image/Java_6_26-4-17_123.jpg)![](image/Java_6_26-4-17_124.jpg)\n\
    \nImmediately the class makes little sense, since it merely consists of variables\
    \ that contains parameters for the database, but the class must be used to solve\
    \ the problem that the database parameters are hard coded so they can be lifted\
    \ out of the program to a configuration file.\n\nThe class *Repository* is also\
    \ written as a singleton, and so far it has only a single method that can return\
    \ a *Wine* object for all rows in the table *wine*. However, it is the program’s\
    \ central class, and will includes all methods for database operations. It thus\
    \ becomes a very extensive class. Al SQL is hidden away in this class.\n\n###\
    \ The dimension tables\n\nAs a next step I want to write the code for the maintenance\
    \ the dimension tables, and thus all functions under the menu *The wines properties*.\
    \ All functions works in principle the same way, and I will as an eksemple look\
    \ at the *Maintenance of wine types*. If you click the menu item, the program\
    \ opens the following dialog box:\n\n![](image/Image37841.jpg)"
