    2.  *ResultSet.TYPE_SCROLL_INSENSITIVE*, that means, that the cursor kan move
    both back and forth, and that the *ResultSet* is not updated with changes that
    other users had to make to the database after this *ResulSet* is created


    3.  *ResultSet.TYPE_SCROLL_SENSITIVE*, which means the same as above, but with
    the difference that the resultset is updated with changes that other users had
    to make to the database after this *ResulSet* is created


    As default a *ResulSet* is readonly, but for the last of above two parameters
    there are two options


    1.  *ResultSet.CONCUR_READ_ONLY*, that creates a readonly *ResultSet* and is the
    default


    2.  *ResultSet.CONCUR_UPDATABLE*, which creates a *ResultSet*, that is updatable


    You can set the same parameters for *prepareStatement()* with the following syntax:


    ![](image/Java_6_26-4-17_23.jpg)


