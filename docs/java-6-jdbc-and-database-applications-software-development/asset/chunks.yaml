    ## 4.1 Update a ResultSet


    The following test method shows that one can update a resultset:


    ![](image/Java_6_26-4-17_251.jpg)![](image/Java_6_26-4-17_26.jpg)


    First, you notice that the creation of a *Statement* object that allows you to
    update a *ResultSet*. Next, all rows are extracted from the table *history*, and
    then the method *insert()* is called with the *ResultSet* as a parameter:


    ![](image/Java_6_26-4-17_261.jpg)


    This method adds a new row to the *ResultSet* object and assigns values to two
    of the columns. The last method writes the changes physically back to the database.
    If you do not want that, you can omit this statement, and the row is just inserted
    in the *ResultSet* object in memonry.


    After the new row is inserted, the test method set the cursor to the last row
    and the prints the row by a method *printRow()*. The next statement calls a method
    *update()*, which updates the row that the cursor points to:


    ![](image/Java_6_26-4-17_262.jpg)


    There is updated two columns, and again it’s the last statement, which writes
    the changes back to the database. The test method prints then the row again, so
    you can see that the changes are made, after which the row is updated once again.


    Next, the method performs an infinite *while* loop where it starts to execute
    a query on persons where the name starts with *Rolf*. There should only be 1\.
    If there is such a row (*res.next()* is true) the row is removed with the method
    *delete()*. If the row is not found a break is performed, and the loop stops.
    The goals is to show that the updates are physically in the database, so that
    in the next iteration, no rows are found. The method *delete()* is quite simple
    and deletes the row that the cursor points to:


    ![](image/Java_6_26-4-17_27.jpg)


    You should note that the test method’s *while* loop in case there are found a
    row calls the method *print()* with a SQL expression as a parameter. The objective
    is to show that the new row is available on request associated with another connection,
    and thus the row is physically stored in the database. If you performs the test
    method, the result could be:


    ![](image/Java_6_26-4-17_28.jpg)


    The test method also uses a method *printRow()*, which prints a row on the screen
    (the row that the cursor points to). The method requires no special explanation
    and is not shown here, but it is has a statement that is commented out:


    ![](image/Java_6_26-4-17_281.jpg)


    When it is commented out, it is simply because it does not work. The method should
    test whether a *ResultSet* has a row that is inserted, updated, or deleted, and
    where the changes are not yet written back to the database. Note specifically
    that when a row is deleted, there is nothing else, than the row is marked as deleted
    in the resultset, but it is not removed. These methods are described in the JDBC
    standard, but it is not the same as the supplier of the JDBC driver implements
    these methods and it does not apply to the JDBC driver for MySQL. The lesson is
    that whether the characteristics of the JDBC standard is implemented, depends
    on the specific driver, and thus of the database product used, but also the version
    of the driver.


    ## 4.2 Municipalities and zipcodes


    Following the above, I will show a more realistic example of a database application.
    The database is still *padata*, but I will expands it with four new tables. The
    first should be a table of Danish regions:


    | regnr | name |


    | 1081 | Region Nordjylland |


    | 1082 | Region Midtjylland |


    | 1083 | Region Syddanmark |


    | 1084 | Region Hovedstaden |


    | 1085 | Region Sjælland |


    and is thus a simple table with two columns and five rows. The next table is a
    table of Danish municipalities, where each municipality is recorded as


    1.  the municipality number (a unique number of 3 digits)


    2.  the municipality name


    3.  the region, that the municipalty belongs to


    4.  the municipality’s area in square kilometers


    5.  the municipality’s inhabitants


    6.  year of the municipality’s inhabitants


    The region is the region number, so there is a 1:n relation between municipalities
    and regions, such that each municipality is linked to a specific region.


    The third table is a table of Danish zip codes and is a simple table with two
    columns that contain respectively the code and the city name.


    A municipality uses several zip codes, and a specific zip code can actually be
    used by several municipalities, and such there is an m:n relation between municipalities
    and zip codes. Such a relationship is implemented with a table where a row connects
    a zip code and a  municipality.


