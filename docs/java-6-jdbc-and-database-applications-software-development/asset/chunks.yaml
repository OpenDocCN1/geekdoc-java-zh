    # 6 事务 (Transactions)


    在使用 `Statement` 或 `PreparedStatement` 对象执行 SQL 语句时，数据库会立即更新。有时这并不合适，因为你通常有多个 SQL
    语句必须作为一个整体执行，即要么所有语句都正确执行，要么全部被忽略。在数据库上下文中，我们谈论“事务”（transaction），简单来说就是意味着多个 SQL
    语句可以被视为一个整体。接下来的测试方法在 `history` 表中插入三行数据，其中这三个语句作为一个事务执行的：


    ![](img/Java_6_26-4-17_47.jpg)


    首先，像之前一样以通常的方式创建了数据库的连接，下一条语句表示不开启 `auto commit`（自动提交）。这意味着后续的 SQL 语句不会立即在数据库上执行（它们被标记为可以回滚的语句），并且效果在执行
    `commit()` 之前不会出现。


    语句


    ![](img/Java_6_26-4-17_471.jpg)


    意味着一个事务的开始。下一条语句创建了一个 `ArrayList`，并在稍后会进行说明。接着，创建了一个 `PreparedStatement`，它代表一个向
    `history` 表插入一行的 SQL 命令，但只在 `name` 和 `title` 列中插入值。然后，该方法执行了三次 `insert()` 方法调用，该方法会在表中插入一行。如果一切顺利，则执行
    `commit()`，这三次插入操作将被永久地写入数据库。然而，如果三个 `insert()` 中的任何一个抛出了 `SQLException`，则会执行
    `catch` 块并执行 `rollback()`，这意味着事务开始后执行的数据库操作将会被回滚，数据库将恢复到事务启动前的状态。


    然后是 `insert()` 方法：


    ![](img/Java_6_26-4-17_48.jpg)


    该方法调用了一个方法来为 `stmt` 中的参数插入值，然后执行该语句。`history` 表的主键是一个自动生成的 `Integer`，有时在分配某行时你需要知道该分配的
    `id`。这可以通过几种方式实现，但我为此目的专门写了一个小方法：


    ![](img/Java_6_26-4-17_49.jpg)


    这里是 `LAST_INSERT_ID()`，它是 MySQL 中的一个函数，用于返回最后分配的自动生成 ID。在这个示例中，这些键被添加到一个 `ArrayList`
    中，虽然它没有用于任何地方，但在下一个示例中用到了，在这里你主要需要观察如何获取自动生成的键。


    如果执行上述测试方法，最后一次 `INSERT` 将失败，因为 `name` 列没有值，而数据库定义该列必须有值。这意味着发生了了回滚。如果你打开 `MySQL
    Workbench`，可以很容易地确信这些行并没有被插入。


    该示例基本上说明了关于事务要说的内容，但也有定义 `Savepoint`（保存点）的可能性，可以用来指示并非所有操作都必须回滚。考虑以下测试方法，它是上述方法的扩展：


    ![](img/Java_6_26-4-17_491.jpg)!(image/Java_6_26-4-17_50.jpg)


    第一部分基本上与 `test09()` 方法相同，但定义了一个额外的用于 SQL UPDATE 的 `PreparedStatement`。此外，还为最后一次
    `INSERT` 定义了名称，使其不会失败。在执行完三次 `insert()` 方法后，测试方法执行了 `commit()` 并定义了一个 `Savepoint`，表示到事务的此为止语句执行是正确的。接下来，对表中插入的三行中的每一行都执行了
    `update()` 方法。该方法更新 `country` 列，我在这里使用了存储在列表中的键值。这里前两个 `update()` 执行得正确，但当 `country`
    列只能容纳两个字符时，最后一次抛出了 `SQLException`。结果是控制权转移到了 `catch` 块，执行了回滚，但当 `Savepoint` 对象不为
    `null` 时，可以得出已到达 `Savepoint` 的结论，因此 `INSERT` 语句执行成功。只回滚到 `Savepoint`。


    ## 6.1 批量更新 (Batch updates)


    关于 JDBC 和数据库操作的最后一点，我将提到批量更新。如果你必须执行许多数据库操作——例如许多 INSERT 语句——如果程序为每个语句调用一次数据库，可能会花费长时间。你可以将所有操作收集到一个批，这对于
    `Statement`、`PreparedStatement` 和 `CallableStatement` 都是可能的，然后通过单个连接一次执行所有操作。接下来的测试方法展示了语法：


    ![](img/Java_6_26-4-17_51.jpg)!(image/Java_6_26-4-17_52.jpg)


    `createKings()` 方法基本上与 `createPersons()` 相同（它只是创建其他的 `Person` 对象）。在 `try` 块内部，该方法创建了两个
    `PreparedStatement` 对象分别对应 DELETE 和 INSERT。由于 JDBC 不要求支持批量更新，因此首先测试是否支持，如果是，遍历列表中的所有对象，添加语句来删除相应的行（如果存在），但不是执行
    `executeUpdate()`，而是执行 `addBatch()`，这会将数据库操作添加到 `stmt1` 对象的操作列表中。随后，列表中的所有对象都执行相同的操作，但这次使用的是
    `stmt2` 对象。到此为止，数据库操作尚未执行，但最终通过 `executeBatch()` 方法执行。


    ### 练习 4


    以下行显示了七个国家的国家代码、所属洲代码、国家面积和人口规模数据：


    ![](img/Java_6_26-4-17_53.jpg)


    你必须编写一个程序，使用上述信息更新 `country` 表，要求如下：


    1. 必须通过批量更新完成

    2. 必须使用 `Statement` 对象而不是 `PreparedStatement` 对象


    注意，`addBatch()` 方法可以接受 SQL 表达式作为参数。


    在更新表后，你必须执行一个 SQL SELECT 语句，提取面积不为 `NULL` 的国家名称，并在屏幕上打印这些名称。


