    This chapter describes one of the most complex `Swing` components called `JTable`.
    In principle, it has not something with JDBC or databases to do, but the component
    is intended to display data organized in rows and columns, and therefore the component
    finds specific application to display the contents of database tables. This is
    the reason why it is referred to at this place.


    It is a very important component, it is very flexible with many options and customizations,
    but it is equally complex and it is not always so easily to figure out how it
    works. The class name is as mentioned `JTable`, and first of all it is important
    to note, that a `JTable` object does not contains data, but it can display data
    defined by a data model. The class uses several (actually many) helper classes
    that are commonly found in the package `javax.swing.table`.


    ## 7.1 The demo program


    I’ll start simple, and below shows a window with a `JTable` that shows some data
    laid out in a table with 6 columns and nine rows:


    ![](image/Image37559.jpg)


    The individual data elements are not important, but they show data about 9 books.
    If you run the program, you must observe the following:


    * You can change the window size. If you changes the height, so there is no room
    for the entire table, you get a scrollbar. If you changes the the width, the column
    widths are changed, but there is no scrollbar. However, the width of the two columns
    for ISBN and Pages do not change.


    * It is possible to select multiple rows by clicking with the mouse, and there
    are the usual features that apply in combination with Ctrl and Shift keys.


    * You can change the width of each column by dragging the divider between two
    column headers.


    * You can edit the contents of the individual cells. You opens a cell for editing
    by double-clicking with the mouse.


    There are so many attached functions to a `JTable`, and what is mentioned above
    is the default settings (except the two columns that have fixed width).


    The code is as follows:


    ```

    ![](image/Java_6_26-4-17_55.jpg)![](image/Java_6_26-4-17_56.jpg)

    ```


    In the beginning of the code is laid out the data to be displayed. The first array
    is the column headings, while the next two-dimensional array is the table’s data.
    You should note that the array’s data is of the type `Object`, and since some
    of the data are simple data types there are used auto boxing for objects to type
    `Integer` and `Boolean`. The table is created in the method `createTable()` where
    the two data structures (arrays) are sent as parameters to the constructor in
    `JTable` and the constructor will then based on these structures create a data
    model. Next is called the method `setColumnWidth()` for column 0 and column 4
    to define a fixed width for these columns. When looking at the syntax, there is
    not much mystery in it, but it is far from a typical application, and take the
    many opportunities for user interaction into account is clear that there is a
    part that must be learned.


    The class is part of a project called `JTableDemo` and when you run the program,
    you get the following window:


    ![](image/Image37567.jpg)


    and thus a window with 12 buttons. Each button opens a dialog box, showing an
    example of a `JTable`, and the upper left is the example mentioned above.


    ### The data model


    I will now look at the data model as a `JTable` displays the objects in a data
    model. In the previous example it was the constructor of the class `JTable` that
    created the model, but typically it happens otherwise. A data model is a class
    that inherits `AbstractTableModel`, and a model for the same data as above could
    be:


    ```

    ![](image/Java_6_26-4-17_58.jpg)![](image/Java_6_26-4-17_59.jpg)

    ```


    that in addition to the data definitions alone is overriden methods from the base
    class. In fact, only three of these methods are necessary (`getColumnCount()`,
    `getRowCount()` and `getValueAt()`) because the others have default implementations
    in `AbstractTableModel`. However `getColumnName()` is necessary to get the correct
    column names. The methods are generally simple, but you should note the method
    `isCellEditable()`, which in this case defines that only columns with index greater
    than 2 can be edited. Note also the method `getColumnClass()`, which returns the
    data type of each column. In general (as in the previous example), a JTable display
    the value of a datalement as a string in the form of `toString()`, but with the
    data type available, the cells will be rendered differently. For example the cells
    containing the numerical values show the content right justified, and as another
    example, a `Boolean` (the last column in this case) is displayed as a `JCheckBox`
    component.


    Below is a window showing a `JTable` on the basis of the above data model. The
    example should show two things:


    1. how to apply a data model

    2. how the selection of rows and columns in `JTable` works


    The first is very simple, while the selection of cells is a little more difficult
    to figure out.


    ![](image/Image37575.jpg)


    In addition to the table, the window has some radio buttons and checkboxes, so
    the user can specify how the selection of cells works. If you click in the table,
    it displays a message box that tells what is clicked:


    ![](image/Image37583.jpg)


    You are encouraged to run the program, so you get an idea of how the selection
    of cells works.


    The following method creates the table, and you must observe how to map the data
    model, which is done with a parameter to the constructor:


    ```

    ![](image/Java_6_26-4-17_61.jpg)

    ```


    The next statement is not really necessary, but it means that a `JTable` component-it
    could be important if the program uses drag and drop. The last two statements
    are related to event handlers, respectively selection of rows and columns, that
    among other things, opens a message box.


    The rest of the program code fills a part, but contains nothing new. A part of
    the code concerning the design of the user interface, where the components are
    laid out with `BoxLayout`. Moreover, there are event handlers for each of the
    6 buttons, and when the three check boxes is independent of each other, the program
    must implement a logic that controls when a check box must be selected.


    ### Edit cells


    As mentioned in the first example, you can immediately edit the contents of the
    cells (if permitted according to the data model, which means that in this case
    you not edit the contents of the first three columns). It is an example of a window
    with a `JTable` showing the same data model as in the previous example. Here you
    can edit a cell by double-clicking on it:


    ```

    ![](image/Image37590.jpg)

    ```


    and if you then leave the cell (for example by pressing `Enter`), you get a message
    box that tells that the cell is changed:


    ```

    ![](image/Image3798.jpg)

    ```


    The content of the cell should in this case (the model) be an integer, and if
    you enter something that is not an integer and press `Enter`, the cell will be
    selected, which shows that the content is illegal (see below).


    This is the standard error handling, but I show later, how you can control the
    editing of cells, and what should happens if you enter something illegal.


    With regard to the code there is not much to explain, and the most important is
    to show how to assign an event handler that captures changes to the table:


    ```

    ![](image/Image37607.jpg)![](image/Java_6_26-4-17_64.jpg)

    ```


    Here you particularly should note how to references the cell that is modified,
    including its content.


    As mentioned, you can associates an editor for editing the individual cells, as
    you do in the following way:

