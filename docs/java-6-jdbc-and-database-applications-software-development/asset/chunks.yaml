    SQL command *LOAD DATA INFILE*. It is a command that MySQL do not like, because
    it is not without risk, and you can, in principle, copy anything into the database.
    Therefore, you can not immediately execute the command from *MySQL Workbench*.
    To use the command to load the content of the file to a database, you has to place
    the file in a special directory that only root has access to:


