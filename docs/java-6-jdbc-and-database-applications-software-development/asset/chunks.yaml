  trans: '

    还需要一个用于购买的表：


    ![](img/Image37793.jpg)


    其中购买记录通过 `wine` 表的主键以及日期来标识。根据分析，决定同种葡萄酒在同一天内不能购买两次。如果同种葡萄酒可以在同一天内购买多次，则有必要使用代理键（surrogate
    key）来扩展表。


    同样，必须有一个用于存储葡萄酒消费信息的表：


    ![](img/Image37802.jpg)


    但在这里，决定使用代理键，以对应在同一天内多次消费同种葡萄酒的可能性。


    最后，必须有一个表来记录用户按 100 分制对葡萄酒的评分：


    ![](img/Image37809.jpg)


    这里同样假设每种特定的葡萄酒每天只有一次记录（同一天对某款葡萄酒只有一次评分）。


    经过这些考虑后，数据库的设计如图所示。


    项目中包含一个名为 `Wine.sql` 的脚本，用于创建数据库。我不会在这里展示该脚本，但除了名为 `cellar` 的数据库外，该脚本还初始化了以下四个表：


    * `zipcode`

    * `winetype`

    * `category`

    * `pack`


    ![](img/Image37816.jpg)


    ### 程序架构


    程序原则上应该能够维护上述数据库，为此，程序必须使用一些窗口和对话框，并且程序将由许多文件（类型）组成。作为一个开始，我创建了一个项目 `MyWines`
    并创建了以下包：


    ![](img/Image37826.jpg)


    * `mywines` 是 NetBeans 创建的默认包，应该只包含带有 `main()` 方法的类

    * `mywines.ctrls` 应包含所有对话框的控制器类

    * `mywines.models` 应用于模型类，本质上每个数据库表都对应一个模型类

    * `mywines.repositories` 应该包含带有 SQL 代码的类，以及从表中提取数据和更新表的代码

    * `mywines.tables` 属于用户界面层，由充当 `JTable` 组件数据模型的类组成

    * `mywines.views` 应该包含对话框


    此外，还添加了对我的类类库 `PaLib` 的引用，当我使用该库中的工具时会用到。


    ### 模型层


    我现在准备好开始开发程序了，将从模型层开始并编写第一个模型类，其中一个模型类应该对数据库表中的行建模。目前为止，我将集中在 `wine` 表及其引用的表上，并将编写以下模型类：


    * `Zipcode`

    * `Supplier`

    * `Producer`

    * `Category`

    * `Classification`

    * `Winetyper`

    * `Grape`

    * `Country`

    * `District`

    * `Packing`

    * `Wine`


    除了最后一个外，它们都是简单的类，仅在于它们所包含的字段。例如展示了建模 `distrct` 表的 `District` 类：


    ![](img/Java_6_26-4-17_118.jpg)![](img/Java_6_26-4-17_119.jpg)


    该类非常简单，因为它只包含类变量的 get 和 set 方法，但注意该类重写了 `equals()` 方法，如果数据库中对应的行具有相同的主键，则两个对象相等。还要注意，最初定义了一个
    `public` 常量 `NAME`，它表示数据库中为 `name` 列预留了多少字符（在数据库中类型为 `VARCHAR(50)`）。


    数据库应用程序的通常从编写这类模型类开始。当然可能会有变体，但基本上它们会为数据库表的列建模，而且这些类在开发过程后期通常还会被扩展。


    `wine` 类基本上设计方式相同，但占用的空间大得多，因为 `wine` 表有许多列。该类的开头如下：


    ```

    ![](img/Java_6_26-4-17_120.jpg)

    ```


    在这里你应该注意外键列是如何定义为对该模型类型对象的引用。也就是说，例如如果你考虑供应商，它不是一个 `String`（对应主键 `phone`），而是对一个
    `Supplier` 对象的引用。


    你还需要注意变量 `cuve`，它是一个包含 `Cuve` 类型对象的集合。数据库有一张 `cuve` 表，它是 `wine` 和 `grapes` 之间的关系表，定义了哪些葡萄属于某款葡萄酒。`Cuve`
    类对该表建模，但增加了一个用于葡萄名称的变量：


    ```

    ![](img/Java_6_26-4-17_1201.jpg)

    ```


    还有一个变量 `mark`，允许在集合中高亮（选择）对象。`wine` 类有一个对应的变量。你将看到这些变量在用户界面是如何被使用的。


    ### 主视图 (MainView)


    我将编写程序的 `MainView`，但首先我在 `MySQL Workbench` 中执行了以下脚本来创建：


    ```

    ![](img/Java_6_26-4-17_120.jpg)

    ```


    脚本名为 `Threines.sql`，目标是数据库包含可以显示在前端窗口的数据。当程序运行时，它应该显示：


    ```

    ![](img/Image37833.jpg)

    ```


    中间是 `JTable` 显示所有葡萄酒的概览，但之后应该只显示库存数量大于 0 的葡萄酒。带有复选框的列应用于选择要饮用的行。如果用户双击表格中的某款葡萄酒，程序应该打开一个带有该葡萄酒详细信息的对话框。菜单有以下功能：


    * 葡萄酒属性

    * 供应商管理

    * 生产者管理

    * 国家管理

    * 地区管理

    * 分类管理

    * 葡萄管理

    * 葡萄酒类型管理

    * 葡萄酒类别管理

    * 包装管理


    * 其他功能

    1. 高级搜索

    2. 购买

    3. 消费


    为了编写 `Mainiew` 类，我还写了以下类：


    * `mywines.tables.Wines`

    * `mywines.repositories.DB`

    * `mywines.repositories.Repository`


    `Wines` 类是 `JTable` 的简单模型类，没有任何新内容。`DB` 类代表与数据库的连接并以单例模式编写：


    ```

    ![](img/Java_6_26-4-17_123.jpg)![](img/Java_6_26-4-17_124.jpg)

    ```


    该类意义不大，因为它只包含了数据库参数的变量，但必须使用该类来解决数据库参数硬编码的问题，以便将其从程序中提取到配置文件。


    `Repository` 类也以单例模式编写，到目前为止它只有一个方法，可以返回 `wine` 表中所有行的 `Wine` 对象。然而，它是程序的中心类，并将包含所有数据库操作的方法。因此它将成为一个非常庞大的类。所有的
    SQL 都隐藏在这个类中。


    ### 维度表


    下一步我想编写维护维度表的代码，即位于 `葡萄酒属性` 菜单下的所有功能。所有功能原则上的工作方式相同，我将作为一个示例查看 `葡萄酒类型管理`。如果你点击菜单项，程序将打开以下对话框：


    ```

    ![](img/Image37841.jpg)

    ```

