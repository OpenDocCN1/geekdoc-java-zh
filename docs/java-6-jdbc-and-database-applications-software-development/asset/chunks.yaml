    2 extracts the *isbn*, *title*, *edition*, *year* and *pages*. That is the view
    of columns in the table book of all books published by Prentice Hall. When you
    then click *Apply,* MySQL Workbench creates the following view:


    ![](image/Java_6_26-4-17_1791.jpg)


    This view may then be used in the same way as the other tables, and for example
    you can write:


    ![](image/Java_6_26-4-17_1792.jpg)


    Indeed, one can also to some extent perform SQL INSERT, UPDATE and DELETE statements
    in a view. Consider as an example the following view, which extracts first and
    last names of all authors where the last name starts with a K:


    ![](image/Java_6_26-4-17_1793.jpg)


    If you then performs the statement


    ![](image/Java_6_26-4-17_1794.jpg)


    you will see that the view contains 8 rows. If you then performs the following
    statements:


    ![](image/Java_6_26-4-17_180.jpg)


    you will see that the view *knames* now has 9 rows. This means that after the
    table *author* is updated is also the view updated.


    Next, if you try:


    ![](image/Java_6_26-4-17_1801.jpg)


    you get an error where you are told that the parent table can not be updated.
    Of course it is not so strange, because there is not enough information (there
    is not an author number) to create a row in the *author* table. Consider the following
    view:


    ![](image/Java_6_26-4-17_1802.jpg)


    that this time defines a column to all columns in the *author* table. Perform
    now the statement:


    ![](image/Java_6_26-4-17_1803.jpg)


    and you will see that both the view and the original table is updated. This means
    that an update of the view also updates the parent table, but there are the following
    conditions:


    *   the SELECT statement may not use DISTINCT


    *   the SELECT statement may not contain functions


    *   the SELECT statement may not contain operators


    *   the SELECT statement may not use ORDER BY


    *   the SELECT statement can only use one table


    *   the SELECT statement’s WHERE part may not use a SELECT statement (se below)


    *   the SELECT statement may not use GROUP BY or HAVING


    *   the SELECT statement must include all columns from the parent table that is
    defined NOT NULL


    ### Inner SELECT statements


    It is possible to use an inner SELECT statement in a WHERE clause where an inner
    SELECT returns data that is used in the condition. An inner SELECT can be used
    both in a SELECT, INSERT, UPDATE and DELETE – typically associated with operators.
    A typical example is, using SELECT IN:


    ![](image/Java_6_26-4-17_1811.jpg)


    The result is *isbn* and *title* of all books published by either Prentice Hall
    or Addison Wesley. Of course one can achieve the same otherwise, but SELECT IN
    is easy to understand.


