    鼓励你花时间阅读以下关于程序设计的描述，并研究最终结果（主要包括程序代码）以及对程序进行测试。


    ### 任务


    许多私人葡萄酒爱好者拥有相当数量的葡萄酒储藏——也许有几百瓶甚至更多。这需要进行管理，包括确保葡萄酒没有过久，而且为了记录有关价格、评分等信息的历史数据。这些历史数据在再次购买同一款葡萄酒时至关重要，也有利于从经验中学习，并且总的来说作为购买和消费的记录。因此，不仅有跟踪当前库存的需求，同样也需要存储关于已饮用并从酒窖中移除的葡萄酒的信息。


    葡萄酒从不同的丹麦供应商处获得——包括杂货店，但也可能以直接进口的形式（即从假期或葡萄酒产地旅行带回）或礼品的形式入库。葡萄酒的购买价格差异很大，特别是作为礼物时，价格可能为
    0（或没有价格）。在行业中，给予巨大的折扣是很常见的（而且可以说，即使是类似于目目价格、不切实际的大额折扣也并非真实）。价格以及由此给予的折扣通常取决于你购买的是单瓶还是箱装（6
    瓶或 12 瓶）。


    任务是编写一个名为 `MyWines` 的程序，用于管理私人酒窖。该程序应按照以下要求/设想编写。


    通常情况下，能够记录有关葡萄酒的以下信息：


    **供应商信息（从何处购买或获得葡萄酒）：**


    * 供应商电话号码

    * 供应商名称（公司名称或其他）

    * 供应商地址

    * 供应商邮政编码

    * 供应商所在城市

    * 供应商电子邮箱地址


    实际应记录的供应商信息可能有所不同，因为葡萄酒可能是礼品，也可能是从国外进口的。


    **关于葡萄酒的信息（即关于产品的实）：**


    * 葡萄酒名称

    * 生产商名称

    * 葡萄酒类型（白、红、桃红、起泡、甜酒、波特）

    * 葡萄酒产国

    * 国家代码：* 酒庄区（例如阿尔萨斯、巴罗洛等）

    * 用于生产葡萄酒的葡萄品种及比例

    * 如果有分级划分（例如 Chianti Classico Riserva DOCG）

    * 葡萄酒年份

    * 酒精度数

    * 瓶装/包装大小（单位：cl）


    **关于购买的信息：**


    * 购买日期

    * 过期日期（最晚应饮用的日期）

    * 葡萄酒未折价

    * 折后价

    * 购买瓶数

    * 质量（D = 日常用，H = 家用，Q = 优质用，C = 酒窖用，X = 收藏用）


    **库存水平：**


    * 库存水平（当前瓶数）

    * 修订后的质量（D, H, Q, C, X）

    * 评分——评估由日期和一个 0 到 100 的字符组成

    * 葡萄酒的文本描述


    每当从商店中使用一瓶葡萄酒时，你必须记录是哪种葡萄酒、取了几瓶以及何时。对于供应商和葡萄酒本身，不能保证所有信息都存在；当向商店中添加新葡萄酒时，葡萄酒能保存多久、折扣和分级也是如此。通常情况下，你应该意识到有时你只能从瓶标签上获取知识。


    程序基本上应具备以下功能：


    1. 注册/创建新葡萄酒（购买）

    2. 更新（商店的消耗和分级）

    3. 搜索功能


    由于记录葡萄酒信息的工作可能非常详尽（可能有很多细节），你应该追求一种尽可能少输入的解决方案，并且易于获取系统中已有的数据。总而言之，你应该优先考虑程序的易用性，并且程序的稳健性以及对不当操作做出合理反应是非常重要的。


    程序必须有一个搜索功能，人们可以根据多个标准轻松搜索葡萄酒。你应该追求增强搜索的灵活性，但相反，该功能不应太复杂。在搜索葡萄酒时，人们应该获得：


    * 给定期间内葡萄酒总购买的概述，必要时可以按国家或其他标准进行划分

    * 给定期间内总消耗的概述，必要时可以按国家或其他标准进行划分

    * 葡萄酒随时间变化的评分评估概述（分值）


    还希望程序具有一个功能，可以快速获取已到期、可能已超过过期日期的葡萄酒列表，同时也包括应该在未来一段时间内饮用的葡萄酒列表。


    ### 数据库设计


    我将从数据库的设计和实现开始开发。如果查看上述任务描述，数据库应该包含有关供应商的信息，对描述的分析得了两张表（见下）。基本上，这是一份通讯录，通常你会将邮政编码和城市名称放在一个邮政编码表中，然后让
    `code` 成为 `supplier` 表中的外键。有时可以用下面的图形来说明数据库表，这里表示有两表，以及这些表必须具有哪些列。如果列名带有下划线，则意味着该列是主键。应该有哪些列取决于任务描述，但在实践中，软件开发人员必须通过分析联系任务方以澄清不确定性，并准确定义使用的数据类型。在这种情况下，供应商信息扩展了一个新值，可以在那里注册供应商的描述。如下所示的箭头表示
    `supplier` 表必须有一个指向 `zipcode` 表的外键。


    ![](img/Image37780.jpg)


    主表是 `wine` 表，它应该包含特定葡萄酒的信息，即要放入酒窖的葡萄酒。该表至少包含以下列：


    ![](img/Java_6_26-4-17_113.jpg)


    在这里也约定可以注册葡萄酒描述。葡萄酒必须通过代理键进行标识，并约定如果两款葡萄酒的年份不同，则被认为是不同的。此外，对于每种葡萄酒，必须定义


    * 供应商

    * 包装（瓶装、箱装、其他）

    * 生产商

    * 产地国

    * 酒庄区

    * 分级

    * 葡萄酒类型

    * 葡萄酒类别


    这里描述了供应商，`wine` 表必须有一个指向 `supplier` 表的外键。其他 7 项信息原则上是文本，但决定将这些信息注册在它们自己的表中。理由部分是由于几款葡萄酒必须注册相同的值，其次是很难确保每次拼写的文本都相同，最后对于包装和酒庄区，还需要注册额外信息，分别是包装容量和地区国家。对于葡萄酒类型和类别，任务描述定义了自然主键（一个字母），但对于其他
    5 个我必须选择代理键。因此，设计应该扩展 7 个其他简单的表（这些表有时被称为维度表），且 `wine` 表必须有额外的 8 个外键。


