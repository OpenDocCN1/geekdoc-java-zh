    The dialog box shows a `JTable` with all wine types and such the content of the
    table `winetype`, and at the bottom is defined a filter to the table. The two
    buttons are used to create a new wine type and to remove a filter. Double-Clicking
    on a line in the table, you get a dialog box where you can edit (and delete) a
    wine type, for example:


    ![](image/Image37848.jpg)


    It is the same dialog used if you create a new wine type.


    The menu item `The wines properties` has 9 functions, and for each of the 9 functions
    the following should hapoens:


    1. The class `Repository` must be extended with 4 new methods: a method that returns
    a list of objects corresponding to the content of the database table, a method
    that creates a new row in the database, a method that updates an existing row
    and a method that deletes an existing row.

    2. A class that is a data model for the `JTable` component.

    3. A class that is the dialog box with the `JTable` component.

    4. A class that is a controller for the dialog box to edit an object.

    5. A class that is the last dialog box.


    When the menu has 9 functions it means that the program may be expanded with 36
    new classes like the class `Repository` must be expanded with 36 new methods.
    It sounds like a lot and it is, but conversely note, that there is also talk about
    the program code to maintain 9 database tables, and finally you should note that
    the classes are generally simple, and the same applies to the methods in the class
    `Repository`.


    You should also note that the implementation is a form of a pattern for a program
    to maintain a database table, where you have a dialog box with a `JTable` and
    filter that displays the content of the database table, and where you can open
    a dialog to add or edit a row in the table. I like to do the job in this way,
    because it is clear when the table is changed, but there are other ways, and here
    it is particularly important to note that one can edit the contents of a `JTable`
    directly.


    ### The wine table


    Maintenance of the table `wine` follow the same pattern. That is, the `MainView`
    has a button to create a new wine, and if you double-click on a line in the table,
    you can edit the wine. In both cases the same dialog box is used, and in principle
    it means as above:


    * the class `Repository` must be expanded with 3 new features (the function that
    returns all wines have already been implemented)

    * to write a controller for the dialog

    * the dialog box itself must be written


    The difference is that this time it is a very complex dialog that has a number
    of other functions. If you double-click a wine in the main window, the result
    could be the window as shown below.


    The dialog box has to the left input fields for the information, that can be entered,
    while the right side is combo boxes to select a value from a dimension table.
    Everything should be self-explanatory except for the two `JTable` components for
    the grapes. The bottom shows a table with all the grapes in the database with
    an associated filter. The top is to the grapes used in this wine. If you in the
    lower `JTable` choose one or more grapes by placing a checkmark in the check box
    and click the `Add` button, these grapes are added to the upper `JTable` and therefore
    grapes that are part of the wine. In the upper `JTable` you can similarly set
    a checkmark in one or more check boxes, and if you clicks on `Remove`, the grapes
    are removed from the wine. The top `JTable` also has a column that is to the grape’s
    part in this wine if it is composed of several grapes. This column is edited by
    directly entering a value (in percent).


    At the top of the window there are 6 buttons. They are used to create an object
    of that kind and thus has the same function as the functions that can be selected
    from the menu. The meaning of these shortcuts is, that if you are about to create
    a new wine (or edit an existing wine), and you as such discovers that the wine
    is from a district which was not been created, that you can instantly create the
    district. These 6 functions are using the same dialog boxes that are created earlier
    for maintenance of dimension tables.


    At the bottom of the window are a further 8 buttons, and the meaning of the buttons
    `OK` and `Cancel` gives itself. The 6 other can only be activated if you are editing
    a wine, but not when you create a new wine. Their function are explained below.


    ![](image/Image37855.jpg)


    The button `Remove` is used til remove a wine. The function also removes all other
    information related to this wine.


    The button `Copy` is used to create a new wine with virtually the same data, but
    where the fields `year`, `drunk` and `units` is `null`. The reason is that the
    same wine in another year is considered as another wine, and then a new year can
    be created without to enter all the information again.


    The button `Point` opens a dialog box called `PointView` as shown below. The function
    is used to assign a rating to this wine. The dialog box inserts today (that can
    be changed), and you should enter the point as a number between 0 and 100. A rating
    can not directly be changed, but if you double-click on a rating, you can remove
    it, and you can create all the ratings you like, but you can only create one rating
    for the same date. If you enter a rating for an existing date, the old value is
    overriden.


    You should note, that dialog box has a `JTable`, and the data model for the table
    is in the package `myines.tables`. The same applies to the two `JTable` components
    above for the grapes. It means that every `JTable` for the three mentioned here
    is `Ratings`, `Cuves` and `Grapes`. `PointView` is a simple dialog box, but should
    update the database, and for that is assigned a controller with the name `PointCtrl`.


    ![](image/Image37864.jpg)


    The button `Purchase` opens the following dialog box:


    ![](image/Image3783.jpg)


    that is used to enter information about a purchase of a wine, and that is the
    price and number of units. The dialog box is called `PurchaseView` and the controller
    `PurchaseCtrl`.


    The button `Consume` opens a dialog box to enten information about a consumption:


    ![](image/Image3787.jpg)


    The last button `Units` opens a dialog box that shows what has happened with the
    wine, that is alle purchases and consumptions:


    ![](image/Image3796.jpg)


    The dialog box shows primarily a `JTable` with a filter. If you double-click on
    a row in the table you are allowed to delete the actual purchase or consumption.
    The dialog box is called `UnitView`, and the data model to the `JTable` is `Units`.
    The dialog also has a controller called `UnitCtrl`.


    As described above, maintenance of wines is a function which extends the program
    with several new classes. Furthermore the function results in an extension of
    the class `Repository` with many new methods, and here you should special note,
    that several of these methods are implemented as database transactions.


    ### The search functions


    Then there is the three functions in the last menu. The three functions are very
    similar and opens dialogs with almost the same design. The first opens a dialog
    box as shown below and is used to search for wines based on several criteria.
    The window shows an example where there has been searched on all French wines.
    If a field is empty (has not been selected a search criteria), it is ignored in
    the search. If you enter a value in the fields `Name` and `Description` it means
    that a row in the database to match must contain the value in the actual column.
    For a criteria where you can enter two values, it means a from and to value, and
    if you only enter one value it means either from or to. If you select a value
    in a combo box a row in the `wine` table must have that value in the actual column
    (in the example belov a row must have the value `FR` for country).

