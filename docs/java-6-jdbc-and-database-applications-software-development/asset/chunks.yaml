    # Poul Klausen


    # Java 6: JDBC 与数据库应用程序


    # 软件开发


    Java 6: JDBC 与数据库应用程序：软件开发


    第 1 版


    © 2017 Poul Klausen & [bookboon.com](http://bookboon.com)


    ISBN 978-87-403-1736-7


    由 Ove Thomsen, EA Dania 同行评审


    # 前言


    本书是软件开发系列丛书中的第六本。编程语言是 `Java`，虽然该语言及其语法和语义显然占据了大量内容，但这些书籍也很大程度上关注了开发过程以及如何开发良好且健壮的应用程序。本书的主题是数据库应用程序，以及如何使用
    `Java` 编写使用数据库的程序。在实践中，需要大量数据事务的程序总是使用数据库，而开发数据库应用程序是作为专业软件开发人员工作的一项重要且必要的知识。从原则上讲，它是简单的，道路上良好的一步只需要接受你应该像书中示例那样编写代码，但数据库编程需要
    `SQL` 知识，最困难的部分实际上是正确地编写 `SQL` 语句。因此，本书包含一个附录，提供了 `SQL` 的快速介绍并描述了最基本的语法。除了 `SQL`
    之外，读者还需要拥有一个运行中的数据库来尝试书中的示例并解决练习，并将使用 `MySQL`。本书有一个附录展示了如何安装 `MySQL`。


    正如标题所示，这一系列书籍涉及软件开发，目标是教读者如何用 `Java` 开发应用程序。可以通过阅读相关主题和学习完整的示例程序来学习，但最重要的是亲自动实践并从零开始编写自己的程序。因此，书中的重要部分是练习和问题，读者必须编写与书中处理的内容相对应的程序。系列中的所有书籍都围绕同一个骨架构建，由文本、示例、练习和问题组成，这些内容被放置在文中自然所在的位置。练习与问题的区别在于，练习在很大程度上涉及对文中介绍内容的重复，并且对需要做什么描述得相对准确。而问题的描述则较为松散，通常规模稍大，且很少有明确的完美解决方案。这些书是应该从头读到尾的，但大量的代码示例（包括练习和问题）起着核心作用，读者通过详细研究许多示例代码是非常至关重要的，并且还要解决练习和问题，或者可能只是研究推荐的解决方案。


    所有书籍都以一个或两个较大的示例程序结束，这些程序主要关注过程以及对程序如何编写的解释。另一方面，代码只在有限范围内出现——如果有的话——读者反而应该在测试程序时学习完成的程序代码。除了展示比文中所介绍的示例更大的程序开发外，结语示例的目标还为了展示来自不同应用领域的程序示例。


    大多数书籍还以一个附录结束，处理一个书中未涉及的主题。这可能是关于软件安装问题或计算机技术中的其他主题，这些主题不属于软件开发，但有必要具备入门知识。如果读者已经熟悉该主题，可以跳过当前附录。


    如前所述，编程语言是 `Java`，此外，书中还使用了以下产品：


    *   `NetBeans` 作为应用程序开发的 IDE

    *   `MySQL` 在需要数据库服务器时使用（从 `Java 6` 书籍开始）

    *   `GlassFish` 作为 Web 服务器和应用程序服务器（从 `Java 11` 书籍开始）


    这些产品都是免费且可免费安装的，甚至提到某些产品的安装过程是全自动的，无需付出巨大的努力和挑战。此外，在网络上有针对这三个产品的详细安装说明。这些产品可在
    Windows 和 `Linux` 上运行，因此你使用 `Linux` 还是 Windows 并没有特殊。


    所有示例程序都在运行 `Linux` 的机器上开发和测试。事实上，这并没有产生什么主要影响，因为无论平台是哪一个，`Java` 和其他产品的工作完全相同。书中某些地方你会看到平台是
    `Linux`，这主要适用于涉及文件系统的命令。否则，对于读者来说，程序在 `Linux` 机器开发并没有意义，它们也可以立即在 Windows 下运行，除非程序引用了文件系统，此时可能需要更改文件名。


    最后简单介绍一下这些书并不是什么。它们不是 `Java` 的“如何编写”或参考手册，而是正如标题所示关于软件开发的书籍。我希望读者在阅读这些书籍时，通过许多示例可以找到编写良好程序的灵感，但也可以作为解决方案集，提供许多你作为软件开发人员经常面对的具体日常编程问题的解决方案示例。


    # 1 引言


    许多应用程序需要使用和维护持久化数据。在之前的书籍中，我通过使用对象序列化或纯文本文件解决了此类任务，这在某些情况下确实是极佳的解决方案，但如果有大量频繁更新的数据，或者有多个用户必须访问数据，那么它就不是一个可行的选择。在这些情况下——在实践中几乎总是如此——数据存储在数据库中。


    数据库是文件的集合，包含一个或多个业务的相关数据，但它的意义远于此，因为它是一个由管理和维护数据库系统系统的程序组成的软件包。这个软件包被称为*数据库管理系统*，而数据库系统指的是管理系统以及该系统维护的数据库。


    在书中，我将介绍与数据库相关的核心概念，但是从程序员的角度出发的，因此特别是程序员需要了解的内容。该主题需要特定的数据库管理系统，我将使用 `MySQL`。事实上，系统本身并不重要，但
    `MySQL` 提供可以免费下载和安装的开源版本。`MySQL` 现在是一个强大的数据库系统，支持人们对良好的数据库管理系统所期望的服务，此外 `MySQL`
    在实践中被广泛使用。为了在 Java 程序中使用 `MySQL`，你至少需要安装三个产品：


    1.  管理系统本身，即 `MySQL 服务器`

    2.  一个名为 `MySQL Workbench` 的程序，用户可以用它来管理系统

    3.  一个名为 `JDBC` 的类库，它使得编写使用数据库的 Java 成为可能


    书的附录 A 展示了如何在机器上安装这些产品。


    以下内容基于两个假设：


    1.  你已经安装了运行的上述产品的 `MySQL 服务器`（如何安装产品请参附录 A）

    2.  你拥有 `SQL` 入门知识并了解常用的语句（介绍请参附录 B）。


    '
- fmt: '

    ## Database Setup

    To show how to use databases from a Java program, you must also have a database.
    Open `MySQL Workbench` (see below). Perform then the command that is entered.
    You do this by clicking on the third icon (lightning) in the toolbar. The result
    is the creation of a database with the name `padata`. You may of course choose
    a different name if you wish, but it makes it easier to follow the book’s examples
    and exercises if you choose the same name, which I have used. So far, it is an
    empty database, but through the book I will create several tables with data.


    The folder to this book contains a `SQL` script called `CreateHistorie.sql`. Open
    this script in `MySQL Workbench`. The contents are as shown below:


    ![](image/Image36961.jpg)![](image/Java_6_26-4-17_9.jpg)


    It is a script that creates a table with information about historical persons.
    A table consists of rows and columns, and each row contains data (information)
    about a particular person. A column has a type and a name. The name makes it possible
    to refer to the column in `SQL` statements, while the type determines what kind
    of values the column can hold. Taking the above script, indicating the first column,
    that the column must contain an auto-generated integer that starts with 1 and
    increases by 1 each time adding a row to the table. In addition is definied that
    the column must be the primary key, which means that the column’s values must
    be unique and thus can serve to identify each row. The next two columns are of
    the type `varchar`, indicating that the column can contain a string, which in
    this case must be maximum of, respectively 50 and 30 characters. The next two
    columns again may contain integers, and the column with the name `country` must
    contain a string of 2 characters. Finally, the last column can contain any text
    (however, maximum 65535 characters). The column `name` is defined `not null`,
    which means that every row must have a value in that column. The other columns
    (except the first that is the primary key) does not need to have a value, but
    may be `null`.


    The book’s directory also contains a script `InsertHistory.sql` where below shows
    a few lines


    ![](image/Java_6_26-4-17_10.jpg)


    If you opens the script in `MySQL Workbench` and executes it, the script adds
    52 rows to the table `history`, where the rows contains data about Danish kings.
    The following assumes that this table is created, and the script `InsertHistory.sql`
    is performed.


    ### About surrogate keys

    When you have to create (design) a database table, you must choose one or more
    columns that can be used as the `primary key` (above `id` ). This means that each
    row must have a unique value in this column or columns. Is it not possible, you
    can define a column, which then is assigned a unique value, and it is the case
    of the column `id` of the table `history,` when the value is automatically incremented
    by 1 each time you add a row to the table. This column can therefore be used as
    the primary key, and it is called a `surrogate key` corresponding to, that it
    is a replacement for another key column. Actually one should, if possible, avoid
    surrogate keys as they expand the table with data that does not tell anything,
    and in this case one might avoid the key as the Kings have unique names and thus
    the name could be used as the primary key. When I have nonetheless chosen a surrogate
    key, it is because a string – a column of the type `varchar` – not always is a
    good candidate for a primary key, first, it may be difficult to enter (you can
    misspell) and partly it is less effective than an `int`.


    # 2 JDBC

    JDBC is a family of classes that implements an interfaces defined in the `JDBC
    API`, and which makes it possible, that a Java program can communicate with a
    database server. In relation to the Java program the API has the necessary types
    as interfaces and classes defined in the package `java.sql`, while the specific
    types are implemented by a JDBC driver. So there has to be a JDBC driver available
    for each of the databases that the program must apply and often it is the database
    supplier that develops the JDBC driver. You can think of a JDBC driver as a layer
    between the database and the Java program that ensures that the program can use
    the database in the same way, whether it is one or the other database system.


    ## 2.1 HelloJDBC

    Before I go further and look at the details concerning JDBC, I will look at an
    example to show that it is quite easy to use a database from a Java program. The
    following program reads the rows in the table `history` and prints them on the
    screen:


    ![](image/Java_6_26-4-17_11.jpg)![](image/Java_6_26-4-17_12.jpg)


    You must add an import statement to the necessary types:


    ![](image/Java_6_26-4-17_13.jpg)


    Then you must define a connection to the database:


    ![](image/Java_6_26-4-17_131.jpg)


    Writing this connection is in fact the only difficulty of writing database applications,
    as it should be written correctly and as it depends on the specific database product.
    The method `getConnection()` has three parameters. The first is a connection string,
    while the last two are respectively the username and the password to the database.
    In this case, they are direct encoded as strings, and it may of course not be
    the solution to an application which is used in an operation condition, but about
    this later. Connection string consists of the database server that here is a MySQL
    server on the local machine:


    ![](image/Java_6_26-4-17_132.jpg)


    This is followed by the port number (which incidentally is not necessary, since
    3306 is the default port number for MySQL), and finally follows the name of the
    database, which here is `padata`. In this case, there is also provided an information
    that the database does not require an SSL connection. If you need to use a database
    on another machine, you must type something else than `localhost` (possible an
    IP) and you may also need to use a different port number. Finally, be aware that
    the connection string looks different if is another database than MySQL.


    After the connection is defined the program creates of a `Statement`, which is
