- fmt: '

    It is also possible to save files in databases, for example PDF documents, XML
    documents or images. It has limited use, but with web applications one sometimes
    sees examples where images are stored in databases, and if these are small files,
    there may also be situations where it is ok. In this section I will show how to
    do that.


    A column that must contain a file must be of the type `TEXT` (for documents) or
    `BLOB` (binary files like images). The following script `CreateFileDb.sql` creates
    a database with two tables, one table to documents, while the other is for images:


    ![](image/Java_6_26-4-17_92.jpg)


    The following program is called `UploadDocs` and opens the following window:


    ![](image/Image37721.jpg)


    When you click the `Upload` button, you get a standard dialog where you can browse
    file systems and find the file that you want to store in the database. If you
    double-click at a line in the table, you get a similar dialog box where you can
    browse to a folder, and the program must then save the content of the database
    row as a file in that folder.


    The event handler for the button is:


    ![](image/Java_6_26-4-17_93.jpg)


    The event handler creates a `JFileChooser` object and open the dialog box so that
    you are placed in the user’s home directory. If the user selects a file, the user
    should enter a description of the document (the file). Then the method `streamFile()`
    is called, that streams the file to the database. This method opens a `FileInputStream`
    to the file and then a connection to the database and initialize a `PreparedStatement`.
    The only thing to note is the fact that the column 3 (the third parameter in `stmt`)
    is initialized with the method `setAsciiStream()` with the `InputStream` as a
    parameter.


    You should note that the program does not try to validate the file, and in fact
    the program can upload any file and store it in the database – even a picture.


    If you double-click a line in the table, the following event handler is performed:


    ![](image/Java_6_26-4-17_94.jpg)![](image/Java_6_26-4-17_95.jpg)


    There is not so much new, but the user will be able to select the directory to
    where the file should be saved. If a directory is selected the method `streamFile()`
    is called, which creates the file, and retrieves the content from the database:


    ![](image/Java_6_26-4-17_951.jpg)


    Again, there is not much new to explain. The method creates a `PreparedStatement`
    with one parameter, which is value to the primary key. The `SELECT` statement
    defines only a single column, as the column of file’s content. If the row is found
    the content in the column is referenced to with the method `getAsciiStream()`,
    which is an `InputStream`. It is encapsulated in a `BufferedInputStream` (of performance
    reasons), and then is created a `BufferedOutputStream` that represents the file
    to which the database content must be streamed.


    In the example, the data streaming to and from the database is performed with
    an `AsciiStream` that treat data as ASCII bytes encoded as ISO-Latin-1\. There
    are other options:


    *   `UnicodeStream`, where the data is treated as 16-bits unicode

    *   `BinaryStream`, where the data is treated as raw bytes


    and the difference is, what services these types provides.


