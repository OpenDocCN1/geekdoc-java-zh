    1. `VALUES` 之后必须在括号内包含表中三个列的每个值，且类型必须匹配。

    2. `autnr` 的值（值 186）不能已经存在——该列是主键。


    在很多方面，正如大家所想象的，这是最简单的 `INSERT` 命令。


    然而，通常插入一行数据需要向多个表中插入多个行。例如，如果我想创建一本名为 *78-7900-910-7, Afrikas dyreliv* 的书，它由 *Globe*
    出版社作为第 1 版出版，由 *Mogens Trolle* 编写，那么该出版社不存在，必须先创建它。当作者创建完成后（使用上述命令），还必须向 `written`
    表中添加一行，然后可以如下创建该书籍：


    ![](img/Java_6_26-4-17_1611.jpg)


