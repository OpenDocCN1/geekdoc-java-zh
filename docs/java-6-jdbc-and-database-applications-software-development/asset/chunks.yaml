    换一种说法，是将 `book` 表的每一行与 `publisher` 表的每一行进行组合，但结果中只包含 `pubnr` 列值相同的行。结果将有 87 行和两列。你应该注意，虽然两个列名
    `title` 和 `name` 在两个表的组合中是唯一确定的，但两张表都有一个名为 `pubnr` 的列，因此在 `WHERE` 部分有必要用表名来限定字段名。


    如果你在连接中不指定具体的列，例如：


    ![](img/Java_6_26-4-17_1683.jpg)


    结果仍然是 87 行，但两个表的所有列都在那里


    ![](img/Image38029.jpg)


    特别注意 `pubnr` 列出现了两次。表与表之间有类型的 `JOIN`，像上面的示例被称为 `INNER JOIN`（内连接），它也可以写为：


    ![](img/Java_6_26-4-17_169.jpg)


    两个表之间的 `INNER JOIN` 返回在两个表中都匹配的行。`INNER JOIN`（以及所有其他 `JOIN` 操作）也可以与 `WHERE` 子句结合使用，如下


    ![](img/Java_6_26-4-17_170.jpg)


    返回 `isbn` 以 87- 开头的书籍的标题和类别名称（所有丹语标题）：


    image/Image38036.jpg)


    除了 `INNER JOIN` 之外，还有以下 `JOIN` 操作：


    - `LEFT JOIN`：如果右表中没有匹配项，则返回左表的所有行。

    - `RIGHT JOIN`：如果左表中没有匹配项，则返回右表的所有行。

    - `FULL JOIN`：如果其中一个表中没有匹配项，则返回所有行。

    - `CARTESIAN JOIN`：返回两个表的笛卡尔积。


    你应该意识到，MySQL 不支持 `FULL JOIN`。作为一个示例，我将展示一个 `LEFT JOIN`：


    ![](img/Java_6_26-4-17_1701.jpg)


