    - `LEFT JOIN`, which returns all rows from the left table, if there is no match
    in the right table.

    - `RIGHT JOIN`, which returns all rows of the right table, if there is no match
    in the left table.

    - `FULL JOIN`, which returns all rows if there is no match in one of the two tables.

    - `CARTESIAN JOIN`, that returns the cartesian product of the two tables.


    You should be aware that a `FULL JOIN` is not supported by MySQL. As an example
    I will show a `LEFT JOIN`:


    ![](image/Java_6_26-4-17_1701.jpg)


