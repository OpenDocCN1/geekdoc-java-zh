    要编辑或可能删除货币或国家，你必须在两个表格中的一个一个双击当前对象，然后就会弹出一个显示对象数据的对话框。


    为了编写原型，我在 NetBeans 中创建了一个名为 `World` 的新项目，除了 `main-class` 之外，还添加了以下类（文件）：


    - `MainView`，即上述窗口

    - `Currencies`，即货币表格的数据模型

    - `Countries`，即国家表格的数据模型


    后两个类非常简单，但它们对于原型创建两个 `JTable` 组件来说是必要的。下例所示了示例：


    ![](img/Java_6_26-4-17_102.jpg)


    原型完成后，我创建了该项目的副本并将其命名为 `World0`。现在我将继续在该项目上工作，但有了这个副本，我可以随时回到原型状态。


    ### 数据模型


    作为下一步，我编写了一些模型类，即用于表示程序数据的类。


    添加了三个非常简单的模型类，分别代表大洲、国家和货币：


    - `Continent`

    - `Country`

    - `Currency`


    这些类直接对相应数据库表中的行进行建模，然而 `Currency` 类扩展了一个包含 `Country` 对象的列表，用于使用该货币的国家。


    还为上述每个类型都定义了一个集合：


    - `Continents`

    - `Countries`

    - `Currencies`


    每个集合都包含对应数据库表中的每一行的一个对象。这里，第一个类是显而易懂的，而另外两个是原型中对应类的重写。因此，这两个类同时也是程序 `JTable` 组件的模型。


    整个模型由 `DataModel` 类表示，这是一个简单的类，由上述三个集合中的每个集合的一个对象组成。程序的模型可以如下所示：


    ![](img/Image37748.jpg)


    这三个集合必须初始化，这是通过读取相应的数据库表来实现的。为此，编写了一个 `Repository` 类，它只包含静态方法，其中包括创建这三个集合类的方法。`Repository`
    类还拥有 `currency` 和 `country` 表格的更新方法，这意味着与数据库有关的所有内容都收集在这个类中。如果应用程序必须使用不同的数据库，意味着只需要修改此类类。`Repository`
    类是一个相对复杂的类，因为所有关于数据库和 SQL 的内容都汇聚在这里，因此这里包含了书中介绍的所有内容。


    ### 用户界面


    程序的用户界面除了 `MainView` 之外还包括：


    - `CurrencyView`，用于维护货币的对话框

    - `CountryView`，用于维护国家的对话框


    此外，还有一个名为 `ErrorView` 的辅助对话框，用于显示导入汇率时的错误列表。下面是 `MainView`，它与原型中的视图相同，但这次初始化了数据：


    ![](img/Image37755.jpg)


    每个视图（`ErrorView` 除外）都关联了一个控制器。目标是让控制器类验证用户的输入和选择，并且在适当的情况下，由控制器类调用 `Repository`
    类中的方法来更新模型。用于维护货币和国家的两个对话框的控制器原理上工作方式相同。下面是维护货币的对话框：


    ![](img/Image37762.jpg)


    无论是创建新货币还是编辑现有货币，使用的都是同一个对话框。在这种情况下，在主窗口中双击了 EUR。


    同样，下方显示了维护国家的对话框，并在其中双击了 US：


    ![](img/Image37771.jpg)


    通过这样为对话框关联控制器，你可以实现两点：


    1. 所有关于算法和业务逻辑的内容都被移动到了单独类中

    2. 对话框的代码变得更简单且易于理解


    现在，无论如何都不应该为对话框/窗口附加控制器类。控制器类必须包含某些有趣的内容才有意义。


    ### 导入 CSV 文件


    缺失的最后一个功能是从 CSV 文件更新汇率。这包括能够打开、解析文件并使用解析结果来更新数据库表 `currency`。关于浏览文件，这是 `MainView`
    中事件处理程序的活动。当选择文件时，它会被发送到 `MainView` 的控制器类，然后由其解析文件并验证每一行。根据合法行创建 `Currency` 对象，并发送到
    `Repository` 类中的方法，然后更新数据库。


    ## 10.2 MyWines


    下一个项目是编写一个经典的数据库应用程序。这意味着你创建一个数据库并编写一个可以维护该数据库的程序。该程序是一个普通的 PC ，用于维护私人酒窖的信息，这并不现实。如果在实践中编写这样的程序，你可能会编写一个
    Web 应用程序。应该忽略这一点，项目的目的是测试书中涉及的大部分内容。


    与我在本书和上一本书中展示的程序相比，它是一个相对较大的程序，如果有人拥有酒窖并觉得需要记录消费情况，它也是一个实用的程序。程序由许多类组成（约 80 个），并且有
    25 多个窗口（对话框）。现在听起来并不那么糟糕。大多数对话框都是简单的，相应的类也是如此。所有的对话框都以相同的方式实现，即一个实现用户界面的视图类，以及一或两个模型类。当对话框需要显示对象集合（数据库表中的行）时，用户界面使用了
    `JTable`，并且对话框还分配了 `JTable` 的数据模型。除了模型类外，大多数对话框还有一个控制器类，用于验证用户输入并可能调用应用程序仓库的方法。因此，你应该注意，许多对话框是以相同的方式实现的，这使得理解程序和维护代码变得更容易。


    当你需要编写一个在该示例中由许多相似且工作方式几乎相同的对话框组成的程序时，你可以尝试通过参数控制对话框来减少代码和对话框的数量，取决于传递给构造函数的参数。如果你这样做，你将获得更少的代码和少的类，因此在原理上程序会更容易维护，但类会变得更复杂，可能难以理解，因为你拥有了执行多个功能的对话框。相反，每个功能对应一个对话框意味着类的数量变得非常巨大，这反过来意味着维护程序时需要在很多地方进行修改。

