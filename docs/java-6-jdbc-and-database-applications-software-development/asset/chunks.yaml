    对话框显示了一个 `JTable`，其中包含了所有葡萄酒类型，即 `winetype` 表的内容，在底部定义了该表的过滤器。两个按钮用于创建新的葡萄酒类型和移除过滤器。双击表格中的某行，会弹出一个对话框，你可以在其中编辑（并删除）葡萄酒类型，例如：


    ![](img/Image37848.jpg)


    这与创建新葡萄酒类型时使用的对话框是同一种。


    菜单项 `The wines properties`（葡萄酒属性）有 9 个功能，对于这 9 个功能中的每一个一个，都应该发生以下情况：


    1. `Repository` 类必须扩展 4 个新方法：一个返回与数据库表内容对应的对象列表的方法、一个在数据库中创建新行的方法、一个更新现有行的方法，以及一个删除现有行的方法。

    2. 一个作为 `JTable` 组件数据模型的类。

    3. 一个作为包含带有 `JTable` 组件的对话框的类。

    4. 一个用于编辑对象的对话框控制器（controller）的类。

    5. 一个作为最后一个对话框的类。


    当菜单有 9 个功能时，意味着程序可能需要扩展 36 个新类，例如 `Repository` 类必须扩展 36 个新方法。这听起来很多，事实也如此，但相反请注意，程序代码中也有关于维护
    9 张数据库表的讨论，最后你还应该注意，这些类通常是简单的，`Repository` 类中的方法也是如此。


    你还需要注意，这种实现是程序维护数据库表的一种模式，其中你拥有一个带有 `JTable` 和过滤器的对话框，用于显示数据库表的内容，并且你可以打开对话框来添加或编辑表格中的行。我喜欢用这种方式，因为当表格发生变化时逻辑一目了然，但也有其他方法，这里特别需要注意的是，人们可以直接编辑
    `JTable` 的内容。


    ### 葡萄酒表


    `wine` 表的维护遵循相同的模式。也就是说，`MainView` 有一个创建新葡萄酒的按钮，如果你双击表格中的某行，就可以编辑该葡萄酒。在这两种情况下使用的是同一个对话框，原则上它的意义与上述相同：


    * `Repository` 类必须扩展 3 个新功能（返回所有葡萄酒的功能已经实现）

    * 为该对话框编写一个控制器

    * 必须编写对话框本身


    区别在于，这次是一个非常复杂的对话框，具有许多其他功能。如果你在主窗口双击某款葡萄酒，结果可能如下所示。


    对话框左侧有用于输入信息的输入字段，右侧是用于从维度表中选择值的组合框（combo boxes）。除了用于葡萄（grapes）的 `JTable` 组件外，所有内容都应该是自而易见的。底部显示了数据库中所有葡萄的表格以及关联的过滤器。顶部显示此葡萄酒中使用的葡萄。如果你在下方的
    `JTable` 中通过勾选选择框选择一个或多个葡萄并点击 `Add`（添加）按钮，这些葡萄就会添加到上方的 `JTable` 中，因此成为了该葡萄酒的一部分。在上方方的
    `JTable` 中，你同样可以勾选一个或多个复选框，如果点击 `Remove`（移除），则这些葡萄将从葡萄酒中移除。上方的 `JTable` 还有一列用于表示该葡萄在葡萄酒中的占比（如果该葡萄酒由多种葡萄组成）。该列通过直接输入值（百分比）进行编辑。


    窗口顶部有 6 个按钮。它们用于创建相应类型的对象，因此功能与从菜单中选择的功能相同。这些快捷键的意义在于，当你正准备创建一个新葡萄酒（或编辑现有的葡萄酒），并发现该葡萄酒来自一个尚未创建的地区，你可以立即创建该地区。这
    6 个功能使用了之前为维护维度表创建的相同对话框。


    窗口底部有另外 8 个按钮，`OK`（确定）和 `Cancel`（取消）的意义不自明。另外 6 个按钮只有在编辑葡萄酒时才能激活，而在创建新葡萄酒时无法激活。它们的功能见下文。


    ![](img/Image37855.jpg)


    `Remove`（移除）按钮用于删除葡萄酒。该功能还会删除与此葡萄酒相关的所有信息。


    `Copy`（复制）按钮用于创建一个数据几乎相同的新葡萄酒，但 `year`（年份）、`drunk`（已饮用）和 `units`（单位）字段为 `null`。原因是另一个年份的同一葡萄酒被视为另一种葡萄酒，这样就可以创建一个新年份而无需重新输入所有信息。


    `Point`（评分）按钮打开一个名为 `PointView` 的对话框，如下所示。该功能用于给葡萄酒评分。对话框插入今天的日期（可以更改），你应该输入 0
    到 100 之间的数字作为评分。评分不能直接更改，但如果你双击评分，可以将其删除，并且你可以创建任何你喜欢的评分，但同一日期只能创建一个评分。如果你为已存在的日期输入评分，旧值将被覆盖。


    你应该注意，该对话框有一个 `JTable`，该表格的数据模型在 `myines.tables` 包中。同样适用于上述葡萄的两个 `JTable` 组件。这里三个
    `JTable` 是 `Ratings`（评分）、`Cuves`（年份）和 `Grapes`（葡萄）。`PointView` 是一个简单的对话框，但更新数据库，分配了一个名为
    `PointCtrl` 的控制器。


    ![](img/Image7864.jpg)


    `Purchase`（购买）按钮打开以下对话框：


    ![](img/Image3783.jpg)


    用于输入葡萄酒购买信息，即价格和数量。对话框称为 `PurchaseView`，控制器为 `PurchaseCtrl`。


    `Consume`（消耗）按钮打开一个输入信息的对话框：


    ![](img/Image3787.jpg)


    最后一个按钮 `Units` 打开一个对话框，显示该葡萄酒发生的情况，即所有的购买和消耗记录：


    ![](img/Image3796.jpg)


    对话框主要显示一个带有过滤器的 `JTable`。如果你双击表格中的某行，允许删除相应的购买或消耗记录。对话框称为 `UnitView`，`JTable`
    的数据模型是 `Units`。对话框还有一个名为 `UnitCtrl` 的控制器。


    如上述，维护葡萄酒是一个扩展程序多个新类的功能。此外，该功能导致 `Repository` 类扩展了许多新方法，在这里你应该特别注意，这些方法中的许多是通过数据库事务实现的。


    ### 搜索功能


    然后是最后一个菜单中的三个功能。这三个功能非常相似，打开的对话框设计几乎相同。第一个打开的对话框所示，用于根据多个标准搜索葡萄酒。窗口显示了一个搜索所有法国葡萄酒的示例。如果某个字段为空（未选择搜索标准），则在搜索中将其忽略。如果你在
    `Name`（名称）和 `Description`（描述）字段中输入值，意味着数据库中匹配的行必须包含该列中的值。对于可以输入两个值的标准，意味着一个起始值和一个结束值，如果你只输入一个值，则意味着起始或结束。如果你在组合框中选择一个值，`wine`
    表中的行必须在该列具有该值（在下方的示例中，国家列必须具有值 `FR`）。

