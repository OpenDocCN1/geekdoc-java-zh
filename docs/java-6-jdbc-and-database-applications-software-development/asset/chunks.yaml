    ### SQL 命令


    SQL 是一种命令语言，包含以下命令：


    - `CREATE`，用于创建数据库对象，如表

    - `ALTER`，用于修改现有对象，如表

    - `DROP`，用于删除对象，如表


    这些命令被称为数据定义语言（Data Definition Language）DDL 命令。


    - `GRANT`，用于为用户分配权限

    - `REVOKE`，用于从用户处移除权限


    这些命令被称为数据控制语言（Data Control Language）DCL 命令。


    - `INSERT`，用于在表中插入行

    - `UPDATE`，用于修改表中的一个或多行内容

    - `DELETE`，用于删除表中的一个或多行


    这些命令被称为数据操作语言（Data Manipulation Language）DML 命令。


    - `SELECT`，用于从一个或多个表中提取行


    此命令被称为数据查询语言（Data Query Language）DQL 命令。


    总共有 9 条命令，因此 SQL 应该很容易学习，事实也确实如此，只有最后一个命令非常复杂，语法非常详尽。


    首先注意，SQL 不区分大小写，但在后续内容，我通常用大字母写 SQL 名称，这只是为了让读者能够清楚哪些是 SQL 关键字。


