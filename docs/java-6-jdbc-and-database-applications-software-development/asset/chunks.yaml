    ## 数据库设置

    为了演示如何从 Java 程序使用数据库，你必须拥有一个数据库。打开 `MySQL Workbench`（见下文）。然后执行输入的命令。你可以通过点击工具栏上的第三个图标（闪电图标）来实现此操作。结果是创建了一个名为
    `padata` 的数据库。当然，如果你愿意，也可以选择不同的名称，但选择我使用的相同名称会让你更容易跟进本书中的示例和练习。到目前为止，它是一个空数据库，但通过本书的学习，我将创建几个包含数据的表。


    本书的文件夹包含一个名为 `CreateHistorie.sql` 的 `SQL` 脚本。在 `MySQL Workbench` 中打开此脚本。其内容所示：


    ![](img/Image36961.jpg)![](img/Java_6_26-4-17_9.jpg)


    这是一个创建一个包含历史人物信息的表的脚本。表由行和列组成，每行都包含关于特定人物的数据（信息）。每一列都有类型和名称。名称使得可以在 `SQL` 语句中引用该列，而类型决定了该列可以包含什么的值。以上述脚本为例，指定第一列，该列必须包含一个自动生成的整数，从
    1 开始，并在向表中添加行时每次增加 1。此外还定义了该列必须是主键，这意味着该列的值必须是唯一的，因此可以用来识别每一行。接两列的类型为 `varchar`，表示该列可以包含字符串，在这种情况下，长度最大分别为
    50 和 30 个字符。接两列也可能包含整数，而名为 `country` 的列必须包含 2 个字符的字符串。最后，最后一列可以包含任何文本（尽管最多为 65535
    个字符）。`name` 列被定义为 `not null`，这意味着每一行在该列中必须有一个值。其他列（除了作为主键的第一列）不需要有值，但可以是 `null`。


    本书的目录还包含一个脚本 `InsertHistory.sql`，下面显示了其中几行：


    ![](img/Java_6_26-4-17_10.jpg)


    如果你在 `MySQL Workbench` 中打开并执行该脚本，脚本将向 `history` 表添加 52 行数据，这些行包含了关于丹麦国王的数据。以下内容假设该表已经创建并且执行了
    `InsertHistory.sql` 脚本。


    ### 关于代理键（surrogate keys）

    当你必须创建（设计）数据库表时，你必须选择一个或多个列作为`primary key`（上述的 `id`）。这意味着每一行在该列或这些列中都必须有一个唯一的值。如果可能，你可以定义一列，然后为其分配一个唯一值，`history`
    表的 `id` 列就是这种情况，每当你向表中添加一行时，该值就会自动增加 1。因此，该列可以作为主键，它被称为相应的`代理键`（surrogate key），它是另一个键列的替代。实际上，如果可能，应该避免使用代理键，因为它们用不提供任何数据的扩展了表，在这种情况下，可能会避免使用键，因为国王们有唯一的名称，因此名称可以作为主键。尽管如此我仍然选择了代理键，是因为字符串——`varchar`
    类型的列——并不总是主键的良好候选者，首先，它可能很难输入（你可能会拼错），部分原因是它的效率低于 `int` 类型。


    # 2 JDBC

    JDBC 是一族类，它们实现了 `JDBC API` 中定义的接口，并使得 Java 程序能够与数据库服务器通信。对于 Java 程序来说，API 在 `java.sql`
    包中定义了必要的类型作为接口和类，而特定类型则由 JDBC 驱动程序实现。因此，对于程序必须应用的每个数据库，都必须有一个可用的 JDBC 驱动程序，而且通常是由数据库供应商开发
    JDBC 驱动程序。你可以将 JDBC 驱动程序认为是数据库和 Java 程序之间的一层，它确保程序无论使用哪一个数据库系统，都能以相同的方式使用数据库。


    ## 2.1 HelloJDBC

    在我继续深入并查看有关 JDBC 的细节之前，我将通过一个示例来展示从 Java 程序使用数据库是多么简单。以下程序读取 `history` 表中的行并将它们打印在屏幕上：


    ![](img/Java_6_26-4-17_11.jpg)![](img/Java_6_26-4-17_12.jpg)


    你必须为必要的类型添加导入语句：


    ![](img/Java_6_26-4-17_13.jpg)


    然后你必须定义一个到数据库的连接：


    ![](img/Java_6_26-4-17_131.jpg)


    编写此连接实际上是编写数据库应用程序的唯一困难之处，因为它应该被正确地编写，并且取决于特定的数据库产品。`getConnection()` 方法有三个参数。第一个是连接字符串，后两个分别是数据库的用户名和密码。在这种情况下，它们直接硬编码为字符串，这对于用于生产环境的应用程序来说可能不是解决方案，但这一点稍后讨论。连接字符串由数据库服务器组成，这里是本地的
    MySQL 服务器：


    ![](img/Java_6_26-4-17_132.jpg)


    其后是端口号（实际上是不需要的，因为 3306 是 MySQL 的默认端口），最后是数据库名称，这里是 `padata`。在这种情况下，还提供信息说明数据库不需要
    SSL 连接。如果你需要使用另一机器上的数据库，你必须输入 `localhost` 以外的内容（可能是 IP），你可能还需要使用不同的端口号。最后，请注意如果不是
    MySQL 数据库，连接字符串会不同。


    在定义连接后，程序创建一个 `Statement`，它是代表 SQL 语句的对象，通过 `executeQuery()` 方法执行该语句，该参数是一个 SQL
    SELECT 命令。该方法的结果是 `ResultSet`，它是一个包含每一行对象的集合，这些行是从 SQL 命令提取的。在语句成功执行后，应用程序执行一个循环来遍历行，并为每行打印一行其字段的值，即每列的值。你应该注意如何使用
    `ResultSet` 类中的方法引用值，以及数据库中的列名。


    大多数数据库操作可能会抛出 `SQLException`，因此语句被放在 `try` 块中。相关的 `finally` 块关闭 `Statement` 和
    `Connection`，释放已分配的资源是非常重要的。


    如果你执行程序，将得到以下结果，我只显示了前几行：


    ![](img/Java_6_26-4-17_14.jpg)


    如示例所示，从 Java 程序执行数据操作基本上非常简单。当然，还有比这个示例更多的内容，下一章将展示许多其他示例，但区别实际上更多在于 SQL 而非 Java。


    ## 练习 1

    你必须编写一个类似于 `HelloJDBC` 的程序，但程序应该只打印那些国王或女王且统治期在 1500 年之前开始的人的名字和年份。


