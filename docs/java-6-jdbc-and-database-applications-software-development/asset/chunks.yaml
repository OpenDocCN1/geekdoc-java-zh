    是必要的，因为它是主键。此外，`title` 也是必要的，因为该列被定义为 `NOT NULL`（非空）；而 `year` 和 `pages` 没有值是可以接受的，因为这些列允许
    `NULL` 值。`pubnr` 被定义为 `NOT NULL`，你必须指定一个出版号；当该列是 `publisher` 表的外键时，它必须是已存在的出版社编号。因此，必须在创建书籍的命令之前执行创建出版社的命令。最后注意，这里没有定义类别，尽管该列（`catnr`
    列）是 `category` 表的外键。这不是必要的，因为该列允许 `NULL` 值，这反过来意味着书籍不需要拥有类别。


    最后是最后一个命令，没什么好说的，但你应该注意这两个值是一个复合键，且键的每个部分分别是 `book` 表和 `author` 表的外键。


    ### UPDATE


    `UPDATE` 命令用于更改列中的值。通过示例，以下命令更新了 `book` 表中的一行：


    ![](img/Java_6_26-4-17_1612.jpg)


    该命令非常容易理解。`SET` 之后跟着一个由逗号分隔的列名和值列表，其中值是新值。然后是 `WHERE` 子句，其后跟着一个决定要修改哪些行的条件。`WHERE`
    子句可以非常复杂，这在后续关于 `SELECT` 的内容中也会出现，但在本例中，它恰好定义了一行。`WHERE` 完全可以定义多行，在适当的情况下，所有满足条件的行都会被更新。你必须特别注意，`UPDATE`
    命令并不要求有 `WHERE` 部分，如果没有，则表的所有行都将被更新。另外注意，你不能更改主键的值。


