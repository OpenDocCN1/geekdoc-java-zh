- fmt: '

    To edit and possible delete either a currency or a country is decided that you
    have to double click the current object in one of the two tables, and then you
    get a dialog box that displays the object’s data.


    To write the prototype I have created a new project `World` in NetBeans, and besides
    the `main-class`, are added the following classes (files)


    - `MainView`, that is the above window

    - `Currencies`, that is a data model for the currency table

    - `Countries`, that is a data model for the country table


    The last two are trivial, but they are necessary for the prototype can create
    the two `JTable` components. As an example is shown the one below:


    ![](image/Java_6_26-4-17_102.jpg)


    After the prototype is finished, I’ve created a copy of the project, which I have
    called `World0`. I will now continue to work on the project, but with the copy
    I can always return to the prototype.


    ### The data model


    As a next step I have written some model classes, and thus the classes to represent
    the program’s data.


    There’s added three very simple model classes, representing respectively a continent,
    a country and currency:


    - `Continent`

    - `Country`

    - `Currency`


    The classes are directly modeling the rows in the corresponding database tables,
    however, the class `Currency` extends with a list containing `Country` objects
    for the countries using this currency.


    There are also defined a collection for each of the above types:


    - `Continents`

    - `Countries`

    - `Currencies`


    each of which includes an object for each row in the corresponding database table.
    Here the first of the classes is trivial, while the other two are reprogrammings
    of the corresponding classes from the prototype. The two classes are thus at the
    same time model for the program’s `JTable` components.


    The total model is represented by the class `DataModel`, which is a simple class
    that is made up of an object by each of the above three collections. The program’s
    model can be illustrated as follows:


    ![](image/Image37748.jpg)


    The three collections must be initialized, which is done by reading the corresponding
    database tables. To this end, it is written a class `Repository`, which only has
    static methods, including among others, methods that creates the three collection
    classes. The class `Repository` also has update methods for the tables `currency`
    and `country`, and that means that everything that has to do with the database
    is collected in this class. If the application must use a different database,
    it means that only this class has to be changed. The class `Repository` is a relatively
    complex class, as everything concerning the database and SQL are gathered here,
    and thus everything that is introduced in this book.


    ### The user interface


    The program’s user interface consists besides `MainView` of


    - `CurrencyView` which is a dialog box for maintenance of currencies

    - `CountryView` which is a dialog box for maintaining the countries


    Furthermore, there is a secondary dialog box called `ErrorView` and is used to
    display a list of errors with the import of exchange rates. Below is the `MainView`,
    which is the same view as in the prototype, but this time initialized with data:


    ![](image/Image37755.jpg)


    For each view (except `ErrorView`) there is attached a controller. The goal is
    that the controller class should validate the user input and choices, and it is
    also, where appropriate the controller classes that calls the methods in the class
    `Repository` to update the model. The controller classes for the two dialog boxes
    for maintaining respectively currencies and countries works in principle the same.
    Below is the dialog for maintaining currency:


    ![](image/Image37762.jpg)


    It is the same dialog that is used regardless of whether to create a new currency,
    or to edit an existing currency. In this case, there is double clicked EUR, in
    the main window.


    Similarly is below shown the dialog box for the maintenance of countries and where
    there are double clicked on US:


    ![](image/Image37771.jpg)


    By thus associating a controller for a dialog you achieves two things:


    1. everything regarding algorithms and business logic is moved into a separate
    class

    2. the code of dialog box becomes simpler and easier to understand


    Now one should not at any price attach a controller class for a dialog/window.
    A controller class must contain something interesting for it to makes sense.


    ### Import af CSV file


    The last feature that is missing is updating the exchange rates from a CSV file.
    This includes being able to open the file, parse it and use the result of the
    pasing to update the database table `currency`. With regards to browse the file,
    it is an activity that belongs in an event handler in the `MainView`. When the
    file is selected, it is sent to the controller class for `MainView`, which then
    parses the file and validate the individual lines. On the basis of the legal lines
    it creates `Currency` objects, which are sent to a method in the class `Repository`,
    which then updates the database.


    ## 10.2 MyWines


    The following project is to write a classic database application. This means that
    you must create a database and write a program that can maintain this database.
    The program is an ordinary PC application, that should maintain information about
    a private wine cellar, which is not entirely realistic. Should such a program
    be written in practice, you would probably write a web application. It should
    be ignored, and the purpose of the project is to test most of the substance that
    is treated in this book.


    Compared with the programs that I have shown in this and the previous books, it
    is a relatively large program, and it is also a program that can be used in practice
    if one has a wine cellar and feel a need to register his consumption. The program
    consists of many classes (about 80), and there are more than 25 windows (dialogs).
    Now it’s all not as violent as it sounds. Most of the dialog boxes are simple,
    and the same goes for the corresponding classes. All dialog boxes are implemented
    in the same manner with a view class that implements everything concerning the
    user interface, and then one or two model classes. There will always be a model
    class, which models the object which the dialog box maintains, and in the case
    where the dialog box has to display a collection of objects (rows in a database
    table), a `JTable` is used in the user interface, and the dialog box has also
    assigned a data model for `JTable`. In addition to model classes most dialog boxes
    also have a controller class that validates the user input and possible calls
    methods in the application’s repository to update the database. You should therefore
    note that many dialog boxes are implemented in the same way that makes it easier
    to understand the program and thus maintain the code.


    When you have to write a program which, that in this example, will consist of
    many dialog boxes (the program has many features) which are similar and almost
    works the same way, you can then try to reduce the code and the number of dialog
    boxes by parameter control the dialog boxes and apply them to multiple functions
    depending on the parameters that are transferred to the constructors. If you do
    that, you get less code and fewer classes and thus, in principle, a program that
    is easier to maintain, but however more complex classes, which can be difficult
    to understand, because you have dialog boxes that perform several functions. Conversely,
    a dialog box for every function mean that the number of classes becomes very large,
    which in turn may mean that you have to change in many places for maintains the
    program. It is a choice, and in the current solution I have tried to some extent
