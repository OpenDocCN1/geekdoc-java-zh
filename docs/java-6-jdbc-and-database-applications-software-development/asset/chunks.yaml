    本章描述了 `Swing` 中最复杂的组件之一 `JTable`。原则上，它与 JDBC 或数据库没有关系，但该组件用于显示按行列组织的数据，因此该组件在显示数据库表格内容方面具有特定的应用。这就是在这里提到它的原因。


    这是一个非常重要的组件，非常灵活，具有许多选项和自定义功能，但它同样复杂，并不总是那么容易理解其工作原理。类名如前所述为 `JTable`，首先重要的是注意到，`JTable`
    对象本身不包含数据，但它可以显示由数据模型定义的数据。该类使用了几个在 `javax.swing.table` 包中常见的（实际上是很多很多）辅助类。


    ## 7.1 演示程序


    我将从简单的开始，下面显示了一个带有 `JTable` 的窗口，它显示了以 6 列 9 行表格布局的一些数据：


    ![](img/Image37559.jpg)


    单个数据元素并不重要，但它们显示了关于 9 本书的数据。如果你运行该程序，必须观察到以下现象：


    * 你可以改变窗口大小。如果你改变高度，导致没有空间显示整个表格，就会出现滚动条。如果你改变宽度，列宽会发生变化，但没有滚动条。然而，ISBN 和 Pages
    这两的宽度不会改变。


    * 你可以通过鼠标点击选择多行，并且具有通常可以与 Ctrl 和 Shift 键结合使用的功能。


    * 你可以通过拖动两个列标题之间的分割线来改变每列的宽度。


    * 你可以编辑单个单元格的内容。通过鼠标双击单元格可以打开编辑模式。


    `JTable` 附带了许多功能，上述提到的都是默认设置（那两个固定宽度的列除外）。


    代码如下：


    ```

    ![](img/Java_6_26-4-17_55.jpg)![](img/Java_6_26-4-17_56.jpg)

    ```


    在代码的开头布局了要显示的数据。第一个数组是列标题，接下来的二维数组是表格的数据。你应该注意数组的数据类型是 `Object`，由于某些数据是简单数据类型，因此使用了自动装箱（auto
    boxing）来转换为 `Integer` 和 `Boolean` 类型的对象。表格在 `createTable()` 方法中创建，其中两个数据结构（数组）作为参数传递给
    `JTable` 的构造函数，构造函数随后将根据这些结构创建一个数据模型。接下来调用了 `setColumnWidth()` 方法用于第 0 列和第 4 列，为这些列定义固定宽度。查看语法时，它并没有什么奥秘，但它远非典型的应用，考虑到大量的用户交互机会，很明显有一部分是必须学习的。


    该类是一个名为 `JTableDemo` 的项目的一部分，当你运行程序时，你会得到以下窗口：


    ![](img/Image37567.jpg)


    因此这是一个带有 12 个按钮的窗口。每个按钮都会打开一个对话框，显示 `JTable` 的示例，左上角是上面提到的示例。


    ### 数据模型


    现在我将查看数据模型，因为 `JTable` 显示的是数据模型中的对象。在上一个示例中，是 `JTable` 类的构造函数创建了模型，但通常不是这样。数据模型是一个继承自
    `AbstractTableModel` 的类，对于上述相同的数据，模型可以是：


    ```

    ![](img/Java_6_26-4-17_58.jpg)![](img/Java_6_26-4-17_59.jpg)

    ```


    它除了数据定义外，还重写了基类的方法。事实上，这些方法中只有三个是必要的（`getColumnCount()`、`getRowCount()` 和 `getValueAt()`），因为其他的在
    `AbstractTableModel` 中有默认实现。然而，`getColumnName()` 获取正确的列名是必要的。这些方法通常很简单，但你应该注意
    `isCellEditable()` 方法，在这种情况下它定义了只有索引大于 2 的列可以编辑。同样注意 `getColumnClass()` 方法，它返回每列的数据类型。通常（如上一个示例所示），JTable
