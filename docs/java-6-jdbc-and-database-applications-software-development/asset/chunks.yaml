    Below I will show a few examples of simple procedures, and how they are created
    using MySQL Workbench. In the database right-click on `Stored Procedures` and
    select `Create Stored Procedure` and MySQL Workbench creates a skeleton:


    ![](image/Java_6_26-4-17_1821.jpg)


    You can then write a stored procedure named `Hello` as follows:


    ![](image/Java_6_26-4-17_1822.jpg)


    and if you then click `Apply` the procedure is translated, and if there is no
    errors, it is stored in the database and MySQL Workbench will show the finished
    code:


    ![](image/Java_6_26-4-17_183.jpg)


    The first thing that happens is that the procedure is deleted if there is already
    a procedure with the same name. Next, define a punctuation used to mark to MySQL
    that the procedure ends. By default it is a dollar sign. After the procedure is
    translated and saved, it can be performed as follows:


    ![](image/Java_6_26-4-17_1831.jpg)


    and the result is that the procedure prints `Hello World` on the screen.


    It is obviously not a particularly interesting procedure, but it shows the principle
    and that is simply the case that one or more SQL statements can be executed under
    a common name. In addition to seeing some more examples, there are basically two
    things that must be addressed, namely parameters and program logic.


    As an example is below shown a procedure, that calculate the number og books,
    where the number of pages is greater than or equal to `a` and less than or equal
    to `b`, and where `a` and `b` are input parameters. The result is saved in an
    output parameter `c`:


    ![](image/Java_6_26-4-17_1832.jpg)


    You should notice how the procedure stores the result in `c` with the operatator
    `INTO`. The folowing shows how the procedure can be used to calculates the number
    of books, where the number of pages is greater than or equal to 200 and less than
    or equal to 500:


    ![](image/Java_6_26-4-17_184.jpg)


    It is also possible to define a parameter as `INOUT`. The following procedure
    determines the average of number of pages in books where the page number is less
    than or equal to the value of the parameter `t`:


    ![](image/Java_6_26-4-17_1841.jpg)


    and the procedure can be used as follows:


    ![](image/Java_6_26-4-17_1842.jpg)


    The following script creates a database with one table, that has only one column:


    ![](image/Java_6_26-4-17_185.jpg)


    To this database I have added a stored procedure that adds the value of a parameter
    `n` to the table, if `n` is a prime and not already is in the table. The result
    of the procedure is stored in the parameter `r`:


    ![](image/Java_6_26-4-17_1851.jpg)


    and below an example of an application of the procedure:


    ![](image/Java_6_26-4-17_1852.jpg)


    The above procedure does not have great practical interest, and the goal is alone
    show that in a stored procedure you can use program logic in the same way as for
    example Java.


    As a final comment should be added that there is much more to say about stored
    procedures, and you may also have stored functions, but the above should suffice
    to illustrate what a stored procedure is.

