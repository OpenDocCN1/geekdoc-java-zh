    `jpg`、`gif` 和 `png` 文件。如果你双击表格中的某行，相应的文件应该以与上述程序相同的方式复制到文件系统中的某个目录。


    表格的右列由复选框组成。如果你点击 `Remove` 按钮，选中的图像必须从数据库中移除。


    # 9 DDL 命令


    如果你必须创建一个数据库并包含其表，在实践中你通常会写一个 SQL 脚本。当脚本由 SQL 命令组成时，这些命令当然可以通过 JDBC 执行，我将用一个示例来结束对
    JDBC 的解释，展示如何创建一个数据库以及数据库中的表。实际上，这只是为了演示，下面的测试方法创建了一个数据库：


    ![](img/Java_6_26-4-17_97.jpg)


    下一个方法在该数据库中创建一个表：


    ![](img/Java_6_26-4-17_98.jpg)


    然后就很清楚了，所有的 DDL 命令都可以从 Java 程序立即执行——只要你有权限执行这些命令。


    # 10 结示例


    我将通过两个数据库应用程序的示例来结束本关于 JDBC 和数据库的这本书。这两个示例非常相似，是数据库应用程序的经典示例。除了大小之外（第一个是一个小程序，而另一个稍大一些），它们的区别在于第一个使用现有的数据库，而后者展示了从零开始开发数据库程序的过程，这还包含了数据库的设计和实现。


    ## 10.1 World


    在本书的练习和问题中，你通过三个表扩展了数据库 `padata`：


    *   `world`

    *   `country`

    *   `currency`（货币）


    现在的任务是编写一个可以维护这些表的程序，即一个可以查询表、以及编辑和删除数据的程序。该程序必须具有图形界面。


    ### 要求


    在处理开发之前，必须定义需求，即程序必须能够执行：


    1.  程序应该打开一个窗口（主视图），包含两个表格，一个表提供所有国家的概述，而另一个表显示所有货币的概述。

    2.  可以创建一个新国家。

    3.  可以编辑国家信息。

    4.  可以删除国家。

    5.  可以创建一个新货币。

    6.  可以编辑货币信息，特别是汇率。

    7.  如果没有国家使用该货币，则可以删除该货币。

    8.  可以从 CSV 文件更新汇率。


    已经决定你不应该维护关于世界大洲的 `world` 表。


    除了第一个和最后一个功能外，这些需求不需要进一步解释。对于主视图，我将定义一个原型。对于最后一个功能，CSV 文件必须由以下格式的行组成：


    ```

    ![](img/Java_6_26-4-17_100.jpg)

    ```


    每行至少包含一个货币代码和一个汇率。如果货币在数据库可用，则更新该货币汇率；否则，如果该行包含货币名称，则应创建一个新货币。函数应该显示包含且无法更新表的行。


    ### 原型


    原型是一个名为 `World` 的程序，它会打开以下窗口：


    ![](img/Image37740.jpg)


    程序应该展示主视图的设计。窗口在 `JSplitPane` 中显示两个 `JTable` 组件，表格分别显示货币和国家的概述。搜索通过每个表格下方的过滤器实现，`Clear`
    按钮用于移除过滤器。货币表上两个按钮用于：


    *   从 CSV 文件导入汇率

    *   向表格（以及数据库）添加新货币


    国家表上的按钮用于添加新国家，而下拉框包含世界上所有大洲的列表，并按大洲过滤国家表的功能。

