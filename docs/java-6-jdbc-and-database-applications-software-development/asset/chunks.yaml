    I will conclude this appendix with a very brief introduction to stored procedures,
    which is actually a large area. A stored procedure is a routine consisting of
    SQL statements that are stored on the database server together with the database
    tables, and the idea is of course to save the SQL procedures which are often needed,
    but also that a stored procedure is translated into an internal format and thus
    is effective.'
  toc: []
  trans: '

    此外，根据数据库产品，还有许多（有时是很多）函数。


    ### 通用函数


    这组函数包括：


    * `COUNT`

    * `MAX`

    * `MIN`

    * `SUM`

    * `AVG`


    它们都是经典函数，我在上面已经使用了 `COUNT` 和 `SUM`。例如，接下来的命令确定了书籍的数量、总页数（所有书籍的总页数）、平均页数、最小页数和最大页数：


    ![](img/Java_6_26-4-17_174.jpg)![](img/Image38053.jpg)


    ### 数学函数


    `ABS` `ACOS` `ASIN` `ATAN` `ATAN2` `BIT_AND` `BIT_COUNT` `BIT_OR` `CEIL` `CEILING`
    `CONV` `COS` `COT` `DEGREES` `EXP` `FLOOR` `FORMAT` `GREATEST` `INTERVAL` `LEAST`
    `LOG` `LOG10` `MOD` `OCT` `PI` `POW` `POWER` `RADIANS` `RAND` `ROUND` `SIN` `SQRT`
    `STD` `STDDEV` `TAN` `TRUNCATE`


    大多数函数的含义通过名称即可看出，你无法确定所有的数据库系统都实现了所有的函数。以以下语句作为示例：


    ![](img/Java_6_26-4-17_175.jpg)![](img/Image38062.jpg)


    前三个函数的结果非常简单，而第四个函数确定书籍页数的标准差。第一个语句定义了一个变量，下一个语句将该变量设置为页数的平均值（平均数）。该变量的值用于最后一个公式，用于计算页数的标准差。当然，这种计算是没有意义的，因为有一个
    `STDDEV` 函数可以执行相同的操作，但这个示例部分展示了如何使用变量，部分展示了一个复杂表达式的示例。


    ### 字符串函数


    `ASCII` `BIN` `BIN_LENGTH` `CHAR_LENGTH` `CHARACTER_LENGTH` `CONCAT_WS` `CONCAT`
    `CONV` `ELT` `EXPORT_SET` `FIELD` `FIND_IN_SET` `FORMAT` `HEX` `INSERT` `INSTR`
    `LCASE` `LEFT` `LENGTH` `LOAD_FILE` `LOCATE` `LOWER` `LPAD` `LTRIM` `MAKE_SET`
    `MID` `OCT` `OCTET_LENGTH` `ORD` `POSITION` `QUOTE` `REGEXP` `REPEAT` `REPLACE`
    `REVERT` `RIGHT` `RPAD` `RTRIM` `SOUNDEX` `SOUNDEX_LIKE` `SPACE` `STRCMP` `SUBSTR`
    `SUBSTRING` `SUBSTRING_INDEX` `TRIM` `UCASE` `UNHEX` `UPPER`


    大多数函数都易于理解，但并非所有都是如此，这时就有必要查阅函数的含义。例如，接下来的语句确定了标题包含“Java”单词的书籍标题长度以及标题的前 10 个字符：


    ![](img/Java_6_26-4-17_176.jpg)


    ### 日期和时间函数


    如上所述，SQL 的日期类型可能很难正确使用，有很多专门用于日期的函数：


    `ADD_DATE` `ADD_TIME` `CONVERT_TZ` `CURDATE` `CURRENT_DATE` `CURRENT_TIME` `CURRENT_TIMESTAMP`
    `CURTIME` `DATE_ADD` `DATE_FORMAT` `DATE_SUB` `DATE` `DATE_DIFF` `DAY` `DAYNAME`
    `DAYOFMONTH` `DAYOFWEEK` `DAYOFYEAR` `EXTRACT` `FROM_DAYS` `FROM_UNIXTIME` `HOUR`
    `LAST_DAY` `LOCALTIME` `LOCALTIMESTAMP` `MAKEDATE` `MAKETIME` `MICROSECOND` `MINUTE`
    `MONTH` `MONTHNAME` `NOW` `PERIOD_ADD` `PERIOD_DIFF` `QUATER` `SEC_TO_TIME` `SECOND`
    `STR_TO_DATE` `SUBDATE` `SUBTIME` `SYSDATE` `TIME_FORMAT` `TIME_TO_SEC` `TIME`
    `TIMEDIFF` `TIMESTAMP` `TIMESTAMPADD` `TIMESTAMPDIFF` `TO_DAYS` `UNIX_TIMESTAMP`
    `UTC_DATE` `UTC_TIME` `UTC_TIMESTAMP` `WEEK` `WEEK_DAY` `WEEKOFYEAR` `YEAR` `YEARWEEK`


    如表所示，有很多函数，并不容易弄清楚它们的所有含义，但结果是在 SQL 中有很多机会处理日期和时间。作为一个小例子，下面的语句使用了其中两个函数：


    ![](img/Java_6_26-4-17_177.jpg)![](img/Image38075.jpg)


    ### 视图


    视图基本上只是存储在数据库中的 SQL 语句，但它可以被看作虚拟表的一种，因为原则上你可以像使用其他表一样使用它。视图可以基于一个或多个表创建，但你对视图可以做什么取决于它是如何创建的。视图的目的是：


    * 根据用户的使用情况来组织数据库的内容

    * 限制用户可以操作的数据

    * 允许来自多个表的数据显示为单个表


    在 `MySQL Workbench` 中，你可以通过右键点击 `Views`（`SCHEMA` 标签页）并选择 `Create View` 来视图：


    ![](img/Java_6_26-4-17_178.jpg)


    作为一个示例，你可以编写如下视图：


    ![](img/Java_6_26-4-17_179.jpg)


    它定义了一个名为 `Prentice_hall` 的视图，对于 `pubnr` 为 2 的所有书籍，提取 `isbn`、`title`、`edition`
    和 `year`。这是 Prentice Hall 出版的所有书籍在 `book` 表中的列。当你点击 `Apply` 时，`MySQL Workbench`
    创建了如下视图：


    ![](img/Java_6_26-4-17_1791.jpg)


    该视图可以像其他表一样被使用，例如你可以写道：


    ![](img/Java_6_26-4-17_1791.jpg)


    当然，你可以在视图中执行 `INSERT`、`UPDATE` 和 `DELETE` 语句。以以下视图作为示例，它提取了以 K 开头的姓：


    ![](img/Java_6_26-4-17_179.jpg)

