    There is also a need for a table to purchases:


    ![](image/Image37793.jpg)


    where a purchase is identified by the primary key of the table `wine` as well
    as a date. Based on the analysis it has been decided that the same wine can not
    be purchased twice the same day. Should the same wine could be purchased several
    times on the same day, it would be necessary to expand the table with a surrogate
    key.


    Similarly, there must be a table with information on consumption of wines:


    ![](image/Image37802.jpg)


    Here however, it is decided to use a surrogate key corresponding to the possibility
    of consuming the same wine several times on the same day.


    Finally, there must be a table to record the user’s ratings by the 100 points
    scale:


    ![](image/Image37809.jpg)


    and here it is again assumed that the individual wine has only one registration
    per day (only one rating for a wine the same day).


    After these considerations, the design of the database is illustrated as shown
    below.


    Along with the project is a script called `Wine.sql` that creates the database.
    I will not show the script here, but in addition to the database – called `cellar`
    – the script initializes the four tables:


    * `zipcode`

    * `winetype`

    * `category`

    * `pack`


    ![](image/Image37816.jpg)


    ### Program architecture


    The program should in principle be able to maintain the above database, and to
    that purpose the program must use some windows and dialog boxes, and the program
    will consist of many files (types). As a start, I have therefore created a project
    `MyWines` and created the following packages:


    ![](image/Image37826.jpg)


    * `mywines` is the default package created by NetBeans, and should just contain
    the class with the `main()` method

    * `mywines.ctrls` should contain all controller classes to dialog boxes

    * `mywines.models` should be used for model classes, which is essentially a model
    class for every database table

    * `mywines.repositories` that should contain classes with the SQL code, and then
    the code that extracts data from tables and update the tabels

    * `mywines.tables` that belongs to the user interface layer and consists at classes
    thatt act as data models for `JTable` components

    * `mywines.views` that shouls contain dialog boxes


    In addition is added a reference to my class library `PaLib`, when I will use
    tools from this library.


    ### The model layer


    I am now ready to start on the development of the program and I will begin with
    the model layer and writes the first model classes, when a model class should
    modeling a row in a database table. So far, I will concentrate on the table `wine`
    and the tables which it refers, and I will write the following model classes:


    * `Zipcode`

    * `Supplier`

    * `Producer`

    * `Category`

    * `Classification`

    * `Winetyper`

    * `Grape`

    * `Country`

    * `District`

    * `Packing`

    * `Wine`


    Except the last they are all simple and vary only in terms of the fields they
    contains. As an example is shown the class `District` that is modeling the table
    `distrct`:


    ![](image/Java_6_26-4-17_118.jpg)![](image/Java_6_26-4-17_119.jpg)


    The class is simple since it only contains get and set methods for the class’s
    variables, but note that the class overrides `equals()` so that two objects are
    equal, if the corresponding rows in the database have the same primary key. Also
    note that there are initially defined a `public` constant `NAME`, that indicates
    how many characters are reserved in the database for the column `name` (in the
    database the type is `VARCHAR(50)` ).


    The development of a database application will typically start to write that kind
    of model classes. There may of course be variations, but basically they will model
    the database table’s columns, and often the classes will also be expanded later
    in the development process.


    The class `wine` is basically designed in the same way, but it takes up a lot
    more, as the table `wine` has many columns. The beginning of the class is:


    ```

    ![](image/Java_6_26-4-17_120.jpg)

    ```


    Here you should note how the columns for the foreign keys are defined as a reference
    to an object of that model type. That is, if you, for example, consider the supplier,
    it is not a `String` (for the primary key `phone`), but a reference to a `Supplier`
    object.


    You should also note the variable `cuve`, that is a collection with objects of
    the type `Cuve`. The database has a table `cuve` that is a relation table between
    `wine` and `grapes` and defines which grapes are part of a wine. The class `Cuve`
    modelings this table, but is expanded with a variable for the grape’s name:


    ```

    ![](image/Java_6_26-4-17_1201.jpg)

    ```


    There is also a variable `mark`, which allows to highlight (select) objects in
    a collection. The class `wine` has a corresponding variable. You will se, how
    this variables are used in the user interface.


    ### The MainView


    I will then write the program’s `MainView`, but first I have in `MySQL Workbench`
    performed the following script that creates the:


    ```

    ![](image/Java_6_26-4-17_120.jpg)

    ```


    The script is called `Threines.sql`, and the aim is, that the database should
    contain data, which can be displayed on the front window. When the program is,
    it should show the following:


    ```

    ![](image/Image37833.jpg)

    ```


    Center is `JTable`, that shows an overview over all wines, but later it should
    show only the wines, where the number of bottles in stock are positive. The last
    column with the check boxes should be used to select rows, that shows wines to
    be drunk. If the user double-click on a wine in the table, the program should
    open a dialog box with all the details about that wine. The menu has the following
    functions:


    * The wines properties

    * Maintenance of suppliers

    * Maintenance of producers

    * Maintenance of countries

    * Maintenance of districts

    * Maintenance of classifications

    * Maintenance of grapes

    * Maintenance of wine types

    * Maintenance of wine categories

    * Maintenance of bottles/packings


    * Other functions

    1. Advanced Search

    2. Purchase

    3. Consumption


    To write the class `Mainiew` I have also written the following classes


    * `mywines.tables.Wines`

    * `mywines.repositories.DB`

    * `mywines.repositories.Repository`


    The class `Wines` is a simple model class to a `JTable`, and contains nothing
    new. The class `DB` should represents a connection to a database and is written
    as a singleton:


    ```

    ![](image/Java_6_26-4-17_123.jpg)![](image/Java_6_26-4-17_124.jpg)

    ```


    Immediately the class makes little sense, since it merely consists of variables
    that contains parameters for the database, but the class must be used to solve
    the problem that the database parameters are hard coded so they can be lifted
    out of the program to a configuration file.


    The class `Repository` is also written as a singleton, and so far it has only
    a single method that can return a `Wine` object for all rows in the table `wine`.
    However, it is the program’s central class, and will includes all methods for
    database operations. It thus becomes a very extensive class. Al SQL is hidden
    away in this class.


    ### The dimension tables


    As a next step I want to write the code for the maintenance the dimension tables,
    and thus all functions under the menu `The wines properties`. All functions works
    in principle the same way, and I will as an eksemple look at `Maintenance of wine
    types`. If you click the menu item, the program opens the following dialog box:


    ```

    ![](image/Image37841.jpg)

    ```

