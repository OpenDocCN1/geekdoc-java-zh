    The following describes a program, called `DbOperations` consisting of several
    test methods. The methods should show how to perform the most basic database operations
    using JDBC, where I only care about operations that maintains the database tables
    and hence SQL `INSERT`, `UPDATE` and `DELETE` statements, as well as operations
    that extract data from tables and thus SQL `SELECT`.


    ## 3.1 SQL statements


    The following test method uses the table `history`, and starts to delete a row
    in the table, insert a row, execute a query, update a row and finally execute
    a query again. This means that the method performs all the above four database
    operations. The code is as follows:


    ![](image/Java_6_26-4-17_15.jpg)![](image/Java_6_26-4-17_16.jpg)


    If the method is performed, you get the result:


    ![](image/Java_6_26-4-17_161.jpg)


    In the same manner as in the program `HelloJDBC` the first thing is to open a
    connection to the database, and it is done in exactly the same way, but with the
    difference, that the `Connection` object this time is created within the parenteses
    in the `try` statement. This means that the connection is automatically closed
    when the method exits the `try` block, and in the same manner as in closing files
    it provides a more simple and also more readable code. It should be noted that
    when a database connection is closed, it also closes any opening statements that
    may be associated with the object.


    The `try` block starts to create a `Statement` object, and the next statement
    performs a SQL DELETE. It is executed with the method `executeUpdate()` which,
    in addition to `DELETE` is used to perform `INSERT` and `UPDATE` statements. The
    method returns the number of rows that have changed. In this case, the statement
    delete the rows in which the name’s value is `Ragnar Lodbrog`. If this is the
    first time that the method is run, there may not be such a row, and the method
    will return 0. If the method has been completed, there are a row with that value
    in the column `name`, and the method will return 1 and then will print 1 on the
    screen corresponding to the above result.


    The next statement performs a SQL INSERT and inserts thus a row in the table.
    You should note that the statement only add a value in the column `name`, which
    is okay because the other columns allow `null` values. When this statement is
    executed, the method also prints 1 on the screen, because there are inserted one
    row in the table.


    The next statement again performs a SQL SELECT, and this time it’s with `executeQuery()`,
    which just is used to execute a SELECT. The query extract the rows where the column
    `name` has the value `Ragnar Lodbrog`. There is only one such row, and the row
    is printed in the next statement. The result is as shown in the third line above.
    Note that the method loops over the objects in the `ResultSet` object using a
    while loop. It is obviously no need for a loop when I know that there is only
    one row, but it is necessary to perform `res.next()` to step to the first row.


    Finally is performed a SQL UPDATE and again with the method `executeUpdate()`,
    and as the last is performed a new query, showing that the row has been updated.


    ### PreparedStatements


    In the above examples, all database operations are executed with a `Statement`
    object, which is an object that represents a static SQL statement, and thus an
    SQL statement that can not be changed. There is also a class called `PreparedStatement`,
    which represents a parameterized SQL statement. The objective of the following
    test method is to show how, a SQL expression can use parameters.


    The project `DbOperations` have a class called `Person` that represents a row
    in the table `history`. This means that class contains a variable for each column
    in the table:


    ![](image/Java_6_26-4-17_17.jpg)![](image/Java_6_26-4-17_18.jpg)


    I will not show the full class here, partly because I earlier have seen on an
    almost identical class, and partly because the class consisting primarily of `get`
    and `set` methods. Note, however, that the type of `birth` and `death` is `Integer`
    not `int`. The reason is that the two columns in the database could contain `null`
    (and an `int` can not be `null` ).


    The class `DbOperations` has the following method that creates an `ArrayList`
    with some `Person` objects (I have only shown the first person – there are 12):


    ![](image/Java_6_26-4-17_181.jpg)


    Then the test method:


    ![](image/Java_6_26-4-17_19.jpg)


    First the method creates a list with the 12 Person objects. Then, opening a connection
    to the database, and for this connection is created a `PreparedStatement` object.
    The class `PreparedStatement` is derived from `Statement` and represents as such
    a SQL expression, but an expression that may have parameters. In this case it
    is a SQL DELETE, and there is a single parameter that is indicated with a question
    mark. The next loop must delete all the people in the list (if available), and
    for each iteration the loop performs a DELETE, but first it must insert a value
    for the column `name` in the SQL expression. That is, that the question mark must
    be replaced by a value:


    ![](image/Java_6_26-4-17_191.jpg)


    Here, 1 indicates it is the first parameter (and there is just the same), while
    the last parameter is the value. The `stmt` object is assigned the value with
    `setString()` as the type is `VARCHAR`. There are similar methods for other types.


    When the loop is completed, another `PreparedStatement` is created, but this time
    for a SQL INSERT. It has fewer than six parameters, and it is used to insert a
    row in the table. It happens in a loop, and for each repetition, the parameters
    are initialized. Finally the test method performs the method `print()` with a
    SQL SELECT.


    ## Exercise 2


    You should use `MySQL Workbench` to add a new table to the database `padata`.
    You should do this by writing a script (the same way as for the table `history`)
    when the table should be named `currency`, and it should have three columns:


    1. `code`, which must be a currency code of three characters, which must be the
    primary key

    2. `name`, that must be the name of the currency and can be up to 30 characters

    3. `rate`, which must be the exchange rate and having the type DECIMAL with 10
    digits and 4 after the decimal point


    You must then write a program using the following array to update `currency` table.
    The program should start by deleting the entire contents of the table (with a
    simple DELETE), and then it must use a `PreparedStatement` and insert a row for
    each string in the array:


    ![](image/Java_6_26-4-17_20.jpg)![](image/Java_6_26-4-17_21.jpg)


    To insert a value for the rate in a `PreparedStatement`, you must specify that
    the type is DECIMAL, and here you can use `setBigDecimal()`.


    Before you run the program, you may update the array with today’s current rates.


    # 4 ResultSet


    The most complex SQL statement is SELECT, and it is a very complex statement with
    many options. From a Java program you can perform a SQL SELECT with `executeQuery()`,
    and although the SELECT statement can be complex, the result seen from the Java
    program is always the same: A `ResultSet` object. You can think of the object
    as a collection of objects with an internal cursor that points to a current object
    (a row), or the cursor is `null` if it is not pointing to anything. The class
    `ResultSet` defines many methods that can basically be divided into three kinds:


    1. methods to move the cursor

    2. `get` methods that returns the value for a column at the current row

    3. update methods that update the column value for the current row and you even
    have the opportunity to write the changes back to the database


    To create a `Statement` object, I have so far used the following syntax:


    ![](image/Java_6_26-4-17_22.jpg)

