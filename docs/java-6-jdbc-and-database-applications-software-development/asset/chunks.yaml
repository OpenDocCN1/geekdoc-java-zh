    也可以在数据库中保存文件，例如 PDF 文档、XML 文档或图像。虽然这种用途有限，但在 Web 应用中，有时会看到将图像存储在数据库中的示例，如果这些是小文件，这种情况下也是是可以的。在本节中，我将展示如何进行操作。


    必须包含文件的列类型必须是 `TEXT`（用于文档）或 `BLOB`（用于二进制文件，如图像）。以下脚本 `CreateFileDb.sql` 创建了一个包含两个表的数据库，一个表用于文档，另一个用于图像：


    ![](img/Java_6_26-4-17_92.jpg)


    以下程序名为 `UploadDocs`，它会打开以下窗口：


    ![](img/Image37721.jpg)


    当你点击 `Upload` 按钮时，会弹出一个标准对话框，你可以在其中浏览文件系统并找到想要存储在数据库中的文件。如果你双击表格中的某行，会弹类似的对话框，你可以在其中浏览到一个文件夹，然后程序必须将数据库行的内容作为文件保存到该文件夹中。


    按钮的事件处理器如下：


    ![](img/Java_6_26-4-17_93.jpg)


    该事件处理器创建一个 `JFileChooser` 对象并打开对话框，使用户置于用户主目录。如果用户选择了一个文件，用户应该输入文档（文件）的描述。然后调用
    `streamFile()` 方法，该方法将文件流到数据库。此方法打开指向文件的 `FileInputStream`，然后建立到数据库的连接并初始化一个 `PreparedStatement`。唯一需要注意的是，第
    3 列（`stmt` 中的第三个参数）使用 `setAsciiStream()` 方法初始化，并以 `InputStream` 作为参数。


    你应该注意，程序并没有尝试验证文件，事实上，该程序可以上传任何文件并将其存储在数据库中——即使是图片。


    如果你双击表格中的某行，将执行以下事件处理器：


    ![](img/Java_6_26-4-17_94.jpg)![](img/Java_6_26-4-17_95.jpg)


    这没什么新奇的，但用户将能够选择保存文件的目录。如果选择了目录，将调用 `streamFile()` 方法，该方法会创建文件并从数据库检索内容：


    ![](img/Java_6_26-4-17_951.jpg)


    再次，没什么新的需要解释的。该方法创建一个带有一个参数的 `PreparedStatement`，该参数的值为主键。`SELECT` 语句仅定义了一个单列，作为文件内容的列。如果找到了该行，列中的内容通过
    `getAsciiStream()` 方法进行引用，这是一个 `InputStream`。出于性能考虑，它被封装在 `BufferedInputStream`
    中，然后创建一个 `BufferedOutputStream`，它代表必须向其流数据库内容的文件。


    在示例中，流向和来自数据库的数据是通过 `AsciiStream` 完成的，它将数据处理为编码为 ISO-Latin-1 的 ASCII 字节。还有其他选项：


    *   `UnicodeStream`，数据被处理为 16 位 Unicode

    *   `BinaryStream`，数据被处理为原始字节


    它们的区别在于这些类型所提供的服务。


