    ### View’s


    A view is basically nothing more than a SQL statement that is stored in the database,
    but it can be seen as a form of virtual table, as you in principle can use it
    in the same way, as you uses other tables. A view can be created on basis of one
    or more tables, but what you can do with a view is determined by how it is created.
    The purpose of a view is


    to structure the content of a database corresponding to the users’ use of the
    database


    limiting access to the data that users can work with


    allowing data from multiple tables to appear as a single table


    In *MySQL Workbench* you can create a view by right-click on *Views* (the tab
    SCHEMA) and choose *Create View*. You then gets the following skeleton:


    ![](image/Java_6_26-4-17_178.jpg)


