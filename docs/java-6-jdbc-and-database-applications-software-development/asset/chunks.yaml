    你首先应该注意到，定义了两个实例变量：第一个引用输入字段，另一个类型为 `TableRowSorter`，用于使用的数据模型（即 `DemoDataModel`）。构造函数中没有新内容，但
    `createTable()` 方法创建了 `sorter` 对象并将其绑定到表格上。`createBottom()` 方法创建了输入字段，并通过以下语句将过滤器关联到该字段：


    ![](img/Java_6_26-4-17_79.jpg)


    其中 `Filter` 是一个实现了 `DocumentListener` 接口的内部类。该接口定义了三个方法，当输入字段的内容发生时会执行这些方法，因此当用户输入或删除任何内容时，都会触发这些方法。在所有三种情况下，调用的方法都是
    `newFilter()`，而这正是该方法的核心。它根据正则表达式创建一个过滤器，并特别注意它通过一个索引来指示过滤器必须应用于哪一列——在此情况下，索引为
    `1`，因此是标题列。最后，`sorter` 对象被用于对表格行进行过滤。


    ### 打印 JTable


    下一个示例 `Demo09` 非常简单，显示了与上面相同的表格，但该示例演示了如何将表格打印到打印机，这不能更简单了。窗口有一个 `Print` 按钮，所有工作都在该按钮的事件处理器中完成：


    ![](img/Java_6_26-4-17_791.jpg)


    ### 同步两个表格


    下一个示例显示了一个 `JTable` 和 `JList`，它们都使用数据模型，但这次使用的是不同的数据模型，包含一个丹麦国王列表：


    ![](img/Image37660.jpg)


    这两个组件都使用了同一个数据模型，而关于该模型最重要的一点是行数非常多，以至于你需要滚动表格。其中一个组件只显示模型的列之一，而另一个组件显示所有列。该示例应该向你展示，如果你点击其中一个组件中的某行，它们都会同步滚动，这样选中的行就会出现在顶部（见下文）。


    该数据模型名为 `Kings`，并且相对复杂。它被定义为派生自 `DefaultListModel` 的类，但实际上它应该是一个 `AbstractTableModel`（参见前面的示例）。然而，这并非必须，只需实现
    `TableModel` 接口（`AbstractTableModel` 所做的）就足够了。作为，`Kings` 类必须实现 `TableModel` 定义的所有方法。这可以通过定义一个类型为
    `KingsModel` 的对象来实现，它是一个继承 `AbstractTableModel` 的内部类，然后 `Kings` 类可以委托 `KingsModel`
    类的方法。我们鼓励你研究这种原则上简单但有些异常的数据模型实现。


    ![](img/Image37667.jpg)


    然后是用户界面的代码：


    ![](img/Java_6_26-4-17_82.jpg)![](img/Java_6_26-4-17_83.jpg)


    组件在构造函数中放置在窗口中。`JList` 组件在 `createList()` 方法中创建，它被放置在一个带有上方标签的面板中。接下来，列表分配了一个新的
    `CellRenderer` 对象，该对象是基于派自 `DefaultListCellRenderer` 的匿名类创建的，它并没有做什么，只是重写了 `getListCellRendererComponent()`
    方法。列表的数据模型是 `kings`，该方法必须确保只显示名称，并且单元格具有首选大小以适应 `JTable` 组件中的行高。接下来设置变量 `listSelectionModel`
    指向列表框的 `SelectionModel`，并在此处附加一个类型为 `ListSelectionHandler` 的事件处理器（即一个内部类）。


    然后是 `createTabel()` 方法，在这里你主要注意到如何定义表格表头和行的高度。最后，注意表格被分配到与列表框相同的 `SelectionModel`。这意味着如果你点击这两个组件之一，将执行的是同一个事件处理器，并且是这个处理器滚动了两个组件，使得被点击的元素位于顶部。


    ### JTable 和数据库表格


    示例 `Demo11` 展示了如何使用 `JTable` 显示数据库表格的内容。该示例打开了下方的窗口。窗口显示了一个带有 `zipcode` 表格内容的
    `JTable`。在窗口底部有一个按钮和两个输入字段。输入字段充当两列的过滤器，而按钮用于清除字段。关于表格和窗口的定义以及过滤器的包含，没有什么新奇的，所以你感兴趣的是数据模型，而这里其实并不新：


    ![](img/Java_6_26-4-17_84.jpg)![](img/Java_6_26-4-17_85.jpg)![](img/Java_6_26-4-17_86.jpg)


    唯一新奇的地方是在构造函数中，它不过是书中已插图的初始示例，即如何读取数据库表格。


    结论是，使用 `JTable` 显示数据库表格非常简单——你只需要用数据库表格的内容初始化数据模型即可。


    ![](img/Image37676.jpg)


    ### 大表格


    最后一个示例将打开以下窗口：


    ![](img/Image37688.jpg)


    窗口显示了一个 `JTable`，有 10000 行和 200 列。该示例主要展示了 `JTable` 可以拥有许多单元格，并且仍然有效。你也可以编辑除最后一行和最后一列的所有单元格。在单元格中你可以输入数字，底部行显示所有列。


    数据模型非常简单，没有增加任何新内容：


    ![](img/Java_6_26-4-17_87.jpg)![](img/Java_6_26-4-17_88.jpg)![](img/Java_6_26-4-17_89.jpg)


    你应该注意到最后一行和最后一列不能被编辑，而其他单元格可以。你还应该注意到每一列包含 `Double` 类型的对象，因此是数字。然后是对话框，那里更多需要注意的地方。我在这里不显示代码，只需提到几点你在学习时需要的内容：


    1. 定义了两个定义表格的常量。你可以尝试并修改这些常量。

    2. 如何定义一个 `RowHeader`，它被封装在包含 `JTable` 组件的 `JView`（JScrollPane）中。

    3. 内部类 `CellEditorHandler`，它是编辑单元格的事件处理器。

    4. `DoubleEditor` 类，这是一个 `CellEditor`。

    5. `RowNumberHeader` 类，它是一个 `JTable` 并定义了表格表头的类型。


    ### 问题 2


    你必须编写一个可以调用 `Denmark` 的程序，它会打开以下窗口：


    ![](img/Image37698.jpg)


    窗口显示了位于 `JSplitPane` 中的两个 `JTable` 组件。左侧表格显示 `zipcode` 表的所有行，而右侧表格显示 `municipality`
    表的所有行，但只显示市的名称和区域名称。在两个表格之间，有四个用于过滤的输入字段，位于上方。顶部的两个按钮用于清除过滤器。


    如果你双击 `zipcode` 表中的某行，你应该得到下面的窗口：


    ![](img/Image37707.jpg)


    显示该邮政编码所使用的市名称。如果你双击 `municipality` 表中的某行，你将得到一个所示的窗口，其中部分接收该市的面积和人口，部分接收包含该市使用的邮政编码的表格。这个表格（本地邮政编码表格）必须是一个
    `JTable` 组件。


    ![](img/Image37714.jpg)


    # 8 数据库中的文件

