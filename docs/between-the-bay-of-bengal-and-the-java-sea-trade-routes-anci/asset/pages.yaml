  md: '# Trade routes, ancient ports and cultural commonalities — a voyage into Southeast
    Asia’s surprising past


    THE PEOPLES OF SOUTHEAST ASIA have a long history of shared culture. From Myanmar
    to Papua, the inhabitants built wooden houses on poles, whether they lived in
    flooded coastal plains or in the highlands. Their diet consisted mainly of rice
    and fish. They engaged in past such as cockfighting and sat enthralled at wayang
    kulit performances. Offering betel to guests was the cornerstone of hospitality.


    How did such features come to spread across an area of 4.5 million square kilometres?
    For all its diversity of ethnicity, language and religion, Southeast Asia can
    be best understood as a region knit together by a network of trade routes over
    land and sea.


    This revelatory book traces the diffusion of cultures between the Bay of Bengal
    and the Java Sea, beginning from the last few centuries BCE, looking at trade
    goods such as Indian textiles, Vietnamese Dong drums, ceramics, and spices from
    the Indonesian archipelago. The authors take us through a host of ancient port-cities
    and kingdoms, such as Srivijaya, whose were intimately led to these trade routes,
    pointing out striking similarities in architecture, writing systems and everyday
    customs.


    Richly illustrated with maps, drawings and photographs, Between the Bay of Bengal
    and the Java Sea takes you on a fascinating voyage into the region’s colourful
    past.


    ![](img/c3e5c3015b89799ae52d8dae1158f750_257_0.png)


    ![](img/c3e5c3015b89799ae52d8dae1158f750_257_1.png)'
