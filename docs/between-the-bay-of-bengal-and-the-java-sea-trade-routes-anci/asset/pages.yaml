    Traders from the archipelago also sailing to China. Hitherto, the Chinese had
    been getting their supplies mainly through Funan; in fact, they thought cloves
    were a Funanese product. Chinese traders themselves only started sailing to the
    archipelago, or Nanyang (Southern Seas), in large number during the Southern Song
    Dynasty (1127–1279). Direct foreign trade was forbidden, so trade was conducted
    through tribute missions in which foreign traders presented their goods at the
    imperial court. These traders gained access to the huge Chinese market without
    having to compete with local Chinese traders. The tributes were also a form of
    advertisement – they showed the type of products available, and in this way Southeast
    Asians were able to introduce new products into the Chinese market.


    Two products from West Asia popular in China were frankincense and myrrh; these
    products used to reach China via the overland routes. However, Nanyang traders
    managed to convince the Chinese to replace frankincense, an aromatic resin from
