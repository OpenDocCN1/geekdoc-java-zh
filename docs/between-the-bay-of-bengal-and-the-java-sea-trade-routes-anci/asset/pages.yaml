    to the ruler of Jepara. Its name may derive from the Sanskrit word *vanga* which
    means ''tin'', or wangka, a type of Chinese vessel. Bangka exported


    forest products such as wood resin, sandalwood, dye, gutta percha, cotton and
    iron obtained from its hinterland. Malays from Palembang resided in Bangka from
    the 16th century onwards. The Dutch VOC opened tin mines on the island in 1710
    and obtained a monopoly on tin in Bangka from the Sultan of Palembang in 1722.
    Tin-mining activities increased with the arrival of the Chinese.


