    ports, which consolidated products from their hinterlands. Riding the monsoons
    to India and China, the boat-dwelling sea nomads distributed these goods to markets
    outside the region, Southeast Asian jungle and sea produce, such as tortoise shells,
    pearls, aloe-wood, sandalwood, camphor and spices, were considered exotic. The
    sea nomads were expert navigators, looking to the skies and the seas for guidance.
    The stars, clouds, birds, sea animals and wave patterns allowed them to navigate
    safely the waters between Madagascar in the Indian Ocean and Easter in the Pacific.
    Their grit and purpose drew admiration from the Greek philosopher Pliny the Elder,
    who wrote they were driven by the "spirit of man and human courage". Their navigational
    skills would later be sought by the Chinese and Portuguese.


