    The decorations are similar to those found at Óc-Eo (Vietnam), a port during the
    Funan period. In addition, pottery shards discovered at both Óc-Eo and Kuala Selensing
    have similar patterns. Taken together, these finds have led researchers to argue
    that Kuala Selensing developed a minor port within the Funan network. Funan was
    a Hindu kingdom based in present-day Cambodia. The demise of Funan and the subsequent
    rise of Srivijaya in the 7th century would have seen Kuala Selensing forging a
    relationship with Sungai Mas in southern Kedah, which was under Srivijayan suzerainty.
    Beads from Kuala Selensing would then have been shipped from Sungai Mas.


    As a minor port, Kuala Selensing was not on the main trade routes. Instead, it
    was serviced by small boats, which plied the waters picking up cargo from minor
    ports and consolidating these at the larger ports such as Óc-Eo and Sungai Mas.
    An example of such a boat can be seen in the Pontian shipwreck. This wreck was
    found on the right bank of the Pontian River (in Pahang), about 1.6 kilometres
    from the river mouth. The wood from the boat has been carbon-dated to between
    260 and 430 CE, making it the oldest shipwreck undiscovered in Southeast Asia.


    The wood used in the keel of the Pontian boat measured 6 metres when discovered,
    suggesting an original length of around 10 metres. This would make it considerably
    smaller than the Malay boats that to ply the routes between India and China, which
    reached up to 50 metres in length. Based on comparisons with


