  md: '# Local Innovation


    The enterprising Balinese started manufacturing their own products in imitation
    of the foreign goods they imported. These included imitations of Indian pottery
    and Han-style paddle-impressed pottery. These locally manufactured goods – generally
    of lower quality but less expensive than the originals – would have been traded
    by the Balinese for spices, rice and other agricultural produce.


    The main Balinese-made product exchanged for spices was Cotton cloth was initially
    imported from India, but Bali soon developed its own weaving industry. The Dutch
    recorded in the 17th century that merchants from Tuban in East Java took pepper
    to Bali and exchanged this for cotton cloth. Balinese cloth even found its way
    to China, as recorded in the Tang Dynasty annals. Sir Stamford Raffles, in his
    History of Java, praised Balinese for producing “cotton” of the most quality and
    in great abundance.


    The cloth industry was highly regulated, with villages assigned specific roles
    in the process. For instance, while some villages could only trade raw cotton,
    others were given the right to spin and weave.


