  md: 'Two monsoon seasons hold sway in Southeast Asia. Boats travelled to Southeast
    Asia on one monsoon and returned on the other. The north-east monsoon builds up
    in November with strong winds blowing in November and December across the South
    China Sea. The winds gradually weaken from February and start withdrawing at the
    end of March. There is a transition period in April when the winds bring boats
    towards eastern Indonesia. The southwest monsoon builds up in May and is in full
    force June and August. The winds weaken gradually and disappear in November. The
    cycle then starts again.


    Sea routes from India to Southeast Asia. Boats from Tamralipi in Bengal tended
    to hug the coastline, taking advantage of the coastal ports like Bago. Crossing
    the Bay of Bengal directly from the northern coastline of India, boats would sail
    straight for Dawe on the Taninthary Peninsula. From South India, there were two
    options. Boats could either take the route between the Andaman and Nicobar islands
    to reach Takuapa, or the route between the Nicobar Islands and the Aceh homeland
    to reach Kedah.


    ![](img/c3e5c3015b89799ae52d8dae1158f750_12_0.png)


