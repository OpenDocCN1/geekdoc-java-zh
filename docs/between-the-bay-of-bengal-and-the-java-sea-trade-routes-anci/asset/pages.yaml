    # Relationship with the Orang Laut


    Srivijaya’s control of the Orang Laut (sea people) was a decisive factor in its
    success. The Orang Laut occupied the islands of the Riau-Lingga Archipelago and
    collected sea products such as tortoise shells, pearls and edible seaweed. They
    also developed a relationship with people in the interior from whom they obtained
    products such as gaharuwood and rattan, which they traded as far afield as India
    and China. However, the Orang Laut also engaged in piracy, making the surrounding
    waters a dangerous zone for shippers to traverse.'
