    △ The pagoda-like Great Mosque of Jepara


    Jepara (Java)

    Jepara was an important port, subordinate to Demak. Being located in a bay which
    could be entered by large ships made it highly attractive to traders plying between
    Java and the Moluccas. Jepara exported rice to Melaka and the Spice Islands. It
    became the main port of the Mataram Kingdom in the 17th century. Jepara''s trade
    declined due to sanctions and attacks by the Dutch between 1618 and 1646.


    Melaka for Lasem and brought back with 60 Javanese shipbuilders. Lasem was conquered
    by Mataram''s Sultan Agung in 1616. The port began to decline towards the end
    of the 19th century.


    Tuban (Java)

    Tuban''s overseas trade record goes back to the 11th century. It was the port
    of departure for sea voyages to the Moluccas. In the 13th century, a Chinese expedition
    landed in a vain attempt to conquer the island. In the 15th century, it was an
    important port where numerous Chinese from Guangzhou and Quanzhou had settled.
    Its native ruler became a Muslim by the mid-15th century. Surrounded by a thick
    wall harbouring some 1,000 residents, Tuban was a court capital


    Lasem (Java)

    Located between Tuban and Jepara, Lasem was blessed with a huge supply of teak
    from the forests of Rembang, making it a centre of the shipbuilding industry.
