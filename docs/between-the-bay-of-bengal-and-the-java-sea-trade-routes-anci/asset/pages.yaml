  md: 'Up to the 13th century, both the Malay Srivijaya and Javanese Majapahit kingdoms
    had influence over the governance of Banten Girang. They fought frequently over
    the settlement in order to profit from the pepper-rich district and to gain control
    of the Sunda Strait, which connects the Java Sea to the Indian Ocean. Between
    the 13th and 14th centuries, the Kingdom of Sunda was an independent state, and
    Banten Girang prospered as a pepper producer and exporter, only to be completely
    destroyed in an attack by the Pajajaran Kingdom around 1400. Nevertheless, the
    region slowly regained its significance in the 1500s as its harbour rose entrepot
    after the fall of Melaka to the Portuguese in 1511.


    The backbone of Banten''s economy since the day of Banten Girang in the 12th century
    was pepper, which was in high demand in the international trade. In Europe, pepper
    was the solution to meat preservation during winter, as meat from cattle that
    were slaughtered in autumn would otherwise become contaminated towards spring.
    Prior to the 15th century, pepper was such a prized commodity that it was used
    as currency to pay rent, dowries, and even to purchase land. The cities of Alexandria,
    Genoa and Venice prospered on the trade in pepper, which was supplied by Middle
    Eastern merchants who tightly guarded any information about their sources in Malabar.
    It was pepper that ultimately drove Vasco Da Gama to venture east in 1498, eventually
    securing the Portuguese a key position in the Indian Ocean''s spice trade in 16th
    century.


