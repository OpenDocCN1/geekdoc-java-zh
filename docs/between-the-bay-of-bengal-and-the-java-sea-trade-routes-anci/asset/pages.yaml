  md: 'Revenue farming was already in place before colonisation. Rulers across Southeast
    Asia had long outsourced the collection of taxes along rivers and at ports. In
    the 17th and 18th centuries, they had also given to the Chinese businessmen the
    exclusive rights to run opium, gambling and pawnshop businesses. Colonial governments
    simply expanded on this existing business model.


    For Singapore, Raffles stipulated that no revenue was to be derived from "vices"
    (gambling, liquor and opium), which were to be banned. However, Farquhar, pressed
    for funds to develop the town, demanded the rights to collect excise taxes, displacing
    Raffles when he visited in 1822. Subsequently, in May 1823, Raffles shut down
    all gambling and cockfight establishments. He also imposed higher taxes on liquor
    and opium and Dr John Crawford, who replaced Farquhar as Resident in 1823, reintroduced
    made gambling licences on the premise that gambling, being endemic among the Chinese,
    was being conducted illegally and the government might as well profit from it.
    However, it was permanently illegal in 1829 after it led to high rates of crime.
    Opium farms took over as the highest revenue generators.


