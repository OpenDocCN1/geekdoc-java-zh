    the river from its hinterland. Products came as far as Mount Dempo and the Pasemah
    Plateau, near the Mi headwaters. A network of rivers also provided transportation
    for the gold mined in Bengkulu province. Srivijaya, in turn, supplied its hinterland
    with products such as iron, salt, cloth and beads.


