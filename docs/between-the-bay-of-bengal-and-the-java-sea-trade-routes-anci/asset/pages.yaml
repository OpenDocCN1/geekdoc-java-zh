  md: '▲ One of the eight expository boxes excavated at Candi Bukit Batu Pahat. With
    the lid on, the box measures 22 x 27 Inches. The box has nine depressions, with
    a copper pot resting in the middle one. The lid has a hole in the centre; during
    the consecration ceremony, water poured over it would have trickled inside, activating
    the objects.


    Garbhanyasa is an important ritual in the construction of a Hindu temple. The
    word translates to “depositing the embryo”. The embryo takes the form of a compartmented
    box in which objects of symbolic significance – mostly products of the earth such
    as minerals, metals, stones, grains, plants and sand – have been placed. The box
    is then ceremonially placed within the temple’s foundations. According to the
    Kasyapasilpa, a South Indian treatise dealing with rituals, if the garbhanyasa
    ritual has not been performed, the deity will not enter the sanctuary.


    Uniquely, Candi Bukit Batu Pahat yielded 8 depository boxes, buried within the
    sanctuary wall at floor level, at locations corresponding to the four cardinal
    and four intercardinal directions. Researchers speculate that there would have
    been a ninth box at the centre of the sanctuary, possibly similar to the large
    depository excavated at Pengkalan Bujang. The central depository would have played
    the role of activating the main deity while the positions of the eight smaller
    depositories bring to mind lokapala, guardians of direction, which guard the main
    deity.


