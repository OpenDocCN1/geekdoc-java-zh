    # Early Days

    The conditions that had made Srivijaya successful were also enjoyed by Singapore
    (Temasek). It, too, is located to the northwest of the Java Sea, the convergence
    point of the northeast and southwest monsoons made this meeting the logical place
    for the coming together of traders flying the sea route between China and the
    West.


    During the Srivijaya era, Singapore was likely already linked into the regional
    trading networks, and its mangrove inhabited by the Orang Laut, who played an
    important role in assisting Srivijaya. With Srivijaya no longer a factor, Singapore
    could now develop into a trading centre in its own right. In fact, it became of
    sufficient importance to warrant the attention of the Chinese. In 1320, the Mongol
    Yuan court sent a mission to Longyamen (the entrance to Keppel Harbour) requesting
    elephants; this visit was reciprocated in 1325.


