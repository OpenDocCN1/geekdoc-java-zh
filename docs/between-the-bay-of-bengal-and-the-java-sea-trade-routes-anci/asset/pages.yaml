  md: '# ABOUT THE AUTHORS


    FOUNDERS OF Heritage Output Lab, Mariana Isa and Maganjeet Kaur are independent
    researchers of Malaysian and Southeast Asian history. Through their company, they
    provide research-based services to organisations and individuals requiring further
    background for print, audio and film projects. Kuala Lumpur Street Names (2015)
    and Towns of Malaya (2017, with Dr Neil Khor) are two of their notable publications.
    They were the heritage consultants for Kuala Lumpur''s Heritage Trail Interpretive
    Panels, a project dubbed "KL Dulu", commissioned by the Kuala Lumpur City Council
    (DBKL).


    Maganjeet Kaur holds a Bachelor of Applied Science degree from Universiti Sains
    Malaysia and an MSc in Information Technology (Royal Melbourne Institute of Technology).


    Mariana Isa received her Bachelor’s degree in Architecture from Universiti Teknologi
    Malaysia and an MSc in Conservation of Historic Buildings from the University
    of Bath. ♦


    Contact the authors at heritageoutputlab@gmail.com'
