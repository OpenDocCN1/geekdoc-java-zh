  md: '# # GARBHANYASA

    AT CANDI BUKIT BATU PAHAT


    DATING to the 11th century, Candi Bukit Batu Pahat overlooked a picturesque waterfall
    formed by the Merbok Kecil River, the pleasing scene no doubt contributing to
    the selection of its location. Its architectural structure included a *vimana*
    and a *mandapa*, identifying it as a Hindu *candi*. It was larger than other *candi*
    in southern Kedah and better built, using granite stone. Unlike other sun, Candi
    Bukit Batu Pahat faced east towards the rising sun. Thus, each corner of its square
    sanctorum aligned to a cardinal direction.


    The *garbhanyasa* ceremony that preceded its construction must have been among
    the most complex in ancient Southeast Asia.


    +   * Candi Bukit Batu Pahat amidst a lush green setting photographed from behind
    the vimana. The granite pillar bases are visible. The vimana housed the garbhagriha
    or embryo chamber, known as such because of the "embryo*" deposited in it.


