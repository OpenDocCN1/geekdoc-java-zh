  md: '# REVENUE FARMING


    A REVENUE FARM was a licence granted by the government for the right to distribute
    – and to collect taxes on – a specific item or activity. The most common ones
    in Singapore were for liquor, opium, gambling, prostitution and pawnshops. A public
    auction was held to farm out the rights to distribute these items. The successful
    bidder, usually a kongsi (business syndicate), was charged a fixed amount by the
    government and was then free to charge his customers any amount he felt reasonable.
    For a government on a tight budget, this system effectively did away with the
    need to maintain labour and infrastructure for revenue collection.


    The most lucrative and hotly fought over of these farms were the opium farms.
    Many of the secret society wars in Singapore were over control of these farms.
    Opium was imported raw and converted into consumable forms – known as chandu in
    Malay – by local opium farm holders. The largest consumers were the Chinese labourers
    working in tin mines and plantations, which were ultimately controlled by the
    kongsi. The kongsi required their workers to buy consumables (food, liquor, chandu)
    through them, thus allowing the kongsi to get back a large share of the workers''
    wages. The majority of the labourers were indentured, and as they got addicted,
    they became trapped in a vicious cycle of debt, having to buy chandu from the
    kongsi at inflated prices. Some historians argue if it had not been for opium,
    the Chinese capitalists would have been hard-pressed to remain in business during
    the 19th century.'
