    # Sungai Batu: Iron Accumulation Port


    Of particular historical interest in southern Kedah is the former port of Sungai
    Batu. Sungai Batu takes its name from the Batu River, a tributary of the Merbok.
    This river is barely a stream today but paleo-environmental studies show that
