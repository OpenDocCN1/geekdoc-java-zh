    # 第4章


    # 库亚拉塞林辛 (KUALA SELINSING)


    ## 卓越的珠子制造者


    东南亚珠子贸易始于一种细小的拉制珠子，设计虽不起眼，但从加纳一直流通到中国。它的历史跨越了2000多年，始于印度普德里普域的阿里卡姆杜（Arikamedu），那里是它们的首次制造地。海外贸易将珠子带向远方，珠子制造者也将他们的生意带到了东南亚，在技术需求的地方建立了卫星制造点。这些珠子是奢侈品，用于交换内陆的森林产品。它们还被纳入当地的信仰体系，成为被称为
    mutisalah 的传家宝（源自 mutiara salah，意为“假珍珠”）。


    彼得·弗朗西斯（Peter Francis）是玻璃珠制造传统研究的先驱。根据制造技术的相似性，他推测来自阿里卡姆杜的珠子制造者移到东南亚，建立制造点。他们可能将当地人口纳入制造过程中，随着时间的推移，这变成了一项本土产业。在公元后的几个世纪，珠子制造——


    ![](img/c3e5c3015b89799ae52d8dae1158f750_99_0.png)


    > ▲ 在库亚拉塞林辛（上方）出土的珠串；以及在澳仔（Oc-Eo，左侧）。这是湄公河三角洲的一个印度-太平洋珠子制造地，曾与库亚拉塞林辛有贸易往来。


    ![](img/c3e5c3015b89799ae52d8dae1158750_100_0.png)


    ▲ 捕鱼是塞林辛大地区村庄的主要生计。


    从阿里卡姆杜扩散到曼泰（斯里兰卡）、澳仔（越南）、隆通（泰国）和库亚拉塞林辛（马来西亚）。这些中心不仅满足了东南亚市场的需求，还满足了当时更远地区的需求。在中国、日本和韩国的皇室墓和贵族墓中发现的印度-太平洋珠子，证明了这些珠子被视为身份的象征。


    ▲ 库亚拉塞林辛位于马来西亚半岛西岸，霹雳州北部。


    库亚拉塞林辛位于太平的西北部，处于马来西亚半岛西岸。如今，这里是一片红树林沼，主要是渔民和伐炭木工出没。然而，至少从公元第一个千年到公元8至10世纪，这里曾是一群海员的定居点。它是一个古代海员未标在地图的小港。尽管如此，在第一个千年的几个世纪里，为了吸引珠子制造来到自己的岸边，并成为区域贸易网络中重要的收集中心，它确保了自己在历史史册中有一席之地。


    ![](img/c3e5c3015b89799ae52d8dae1158750_100_1.png)


    100 · 孟加拉湾与爪哇海之间


    ![](img/c3e5c3015b89799ae52d8dae1158750_101_0.png)


    棕红色的半宝石是最常见的石珠，而条纹玛瑙、石英和紫水晶制成的珠子也数量相当。宝石类珠子包括尖晶石、红宝石、石榴石和蓝宝石。玻璃珠有多种颜色，有半透明也有不透明的。然而，更有趣的是发现了未钻孔和部分钻孔的红髓石珠子、破碎的石英碎片、一块方形玛瑙块以及识别出各种颜色库亚拉塞林辛的粗玻璃碎片。正是这些发现确定了库亚拉塞林辛作为制造地的地位。源自阿里卡姆杜的制造技术通过发现的玻璃废料（弃品）以及两端钻孔的珠子得以确认。


    尽管珠子是在库亚拉塞林辛制造的，但大部分原料在当地并未发现——这些都是进口的。一个例子是发现的未成形青金石，这种石头的主要产地是阿富汗东北部。玻璃


    > 位于库亚拉塞林辛附近的库亚拉塞珀当（Kuala Sepetang）的一家木炭厂。覆盖库亚拉塞林辛的红树林被开发木材，其能量高，适合制木炭。在古代，红树林的木材也被用于熔铁炉。


    ![](img/c3e5c3015b89799ae52d8dae1158750_102_0.png)


    ▲ ► 库亚拉塞林辛制造了壳、石（半宝石）、玻璃甚至鱼骨制的珠子。制作石珠的原料大多是进口，而玻璃珠可能是在库亚拉塞林辛本身制造的。


