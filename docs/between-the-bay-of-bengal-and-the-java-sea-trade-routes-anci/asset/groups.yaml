    The town of Semarang was laid out according to spatial principles similar to other
    Javanese towns – addressing the sea through a north-south axis. The two principal
    areas were the seaport, located at the mouth of Semarang River, and an administration
    area known as the Kanjengan. At the Kanjengan were the government offices, palace
    and mosque, centred around the alun-alun, a traditional public square. Shophouses
    sprang up along the road that connected these hubs. Jalan Layur, as it is known
    today, was at one time dominated by Arab and Chinese traders. Behind this thoroughfare
    were settlements by merchant communities from India, the Malay Peninsula, Cirebon
    and Banjar.


