    Ancient Mataram, also known as the Medang Kingdom, was founded in Central Java
    by King Sanjaya, the nephew of King Sanjaya (Bratasenawa) of the Galuh Kingdom
    in West Java. The Canggal Inscription, dated 732 CE, records King Sanjaya declaring
