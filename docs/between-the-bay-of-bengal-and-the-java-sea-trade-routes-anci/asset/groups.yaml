    sent tribute to China, it would bring prosperity to Kantoli. It highlights the
    importance of Chinese trade to the Southeast Asian maritime-based policies as
    their fortunes were tied to the demand in Chinese markets. The last mention of
    Kantoli in Chinese records is in 563 CE. Its demise can be linked to a weak dynasty
    in China, the Southern Dynasty between 557 and 589.


    Srivijaya, building on the trade links and alliances established by earlier kingdoms,
    emerged in the 7th century as the leading kingdom in Sumatra. Its location on
    the 750-kilomet Musi River allowed it to become the collection centre for products
    such as ivory, pepper, rattan, aromatics and benzoin, which were transported down
    the river from its hinterland. Products came as far as Mount Dempo and the Pasemah
    Plateau, near the Mi headwaters. A network of rivers also provided transportation
    for the gold mined in Bengkulu province. Srivijaya, in turn, supplied its hinterland
    with products such as iron, salt, cloth and beads.


