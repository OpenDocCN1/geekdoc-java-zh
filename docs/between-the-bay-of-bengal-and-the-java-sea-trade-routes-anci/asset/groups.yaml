    A Sukhothai dish recovered from the Longquan, a Chinese vessel that sank off the
    coast of Terengganu c. 1400. The dish is decorated with an underglazed black floral
    motif, the black colour coming from iron. The Sukhothai kingdom, located in north-central
    Thailand, became active in producing ceramics in the 14th and 15th centuries.


    A porcelain plate commissioned by the Sultan of Aceh and believed to have been
    made in Swatow (Shantou), China, in the 16th–17th century. The nine circles in
    the design represent the Aceh royal seal, Sik Sireukung (Ninefold Seal). The large
    circle in the centre contains the name of the reigning sultan while the eight
    smaller circles surrounding it contain the names of his predecessors. These plates
    were also talismanic, containing verses from the Quran and the names of caliphs.


    bead manufacturing, which was established by craftsmen in West Java. Similarly,
    Chinese potters set up kilns in Thailand and Vietnam, giving rise to the Thai
    and Vietnamese pottery traditions. Settled Chinese communities, cut off from China,
    assimilated with the local population. Thus, when the Portuguese first arrived
    in Southeast Asia in 1509, the only Chinese community they noticed was at Ayutthaya
    in Thailand.


    Introduction · 29


    The Yongle Emperor (r. 1403–24) temporarily lifted the Ming ban. He sent envoys
    to India, Japan and Southeast Asia in a bid to re-establish diplomatic and trade
    relations. He still forbade private overseas commerce but encouraged state-run
    trading. He ordered sea-going ships to be constructed – 36 ships were built in
    1403, with another 1,180 ordered in 1405. These were used in the finest voyages
    of Admiral Zheng He between 1405 and 1433. Melaka’s rise to become the most important
    kingdom in the Straits of Melaka was linked to the support given by the Ming emperors.
    Similar to Sriwijaya, Melaka was able to exert its influence over the Straits
    and bring piracy back under control.


    However, the cost of the imperial voyages together with the lavish treatment given
    to foreign envoys bearing a strain on China’s economy and the country retreated
    into isolation.


    By this time, spices (cloves, mace and nutmeg) from the eastern Indonesian islands
    became the most important products exported from Melaka. Melaka-based travellers
    travelled to Banda, where they obtained spices from the Banda and Maluku islands.
