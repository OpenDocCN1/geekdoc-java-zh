    Mrauk-U''s local population at 16,000. They lived mainly in stilt houses made
    of bamboo and palm leaves. The palace was located at the centre of the city, contained
    within its own walls. It loomed high over the surrounding areas and, with its
    golden roof, lent elegance to the city. It was three stories high and constructed
    completely of teak. Unfortunately, the use of perishable materials did not allow
    the palace to survive the passage of time. However, travellers'' accounts provide
    clues to its architecture, as stone-relief depictions in royal temples such as
    the Shithhaung. Manrique wrote that the palace buildings“have great wooden pillars
    of such length and symmetry that one is astonished that trees so lofty and straight
    can exist.”


