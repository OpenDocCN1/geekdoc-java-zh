    \ Maritime trade took the beads afar and the bead-makers took themselves their\
    \ trade to Southeast Asia, where they set up satellite manufacturing sites at\
    \ locations where their skills were in demand. The beads were luxury items trade,\
    \ exchanged for jungle products from the interiors. They were also incorporated\
