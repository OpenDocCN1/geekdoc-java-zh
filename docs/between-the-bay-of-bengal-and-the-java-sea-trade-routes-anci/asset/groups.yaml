    1890年左右位于直落街（Telok Ayer Street）的福建福山。这座中国寺庙供奉妈祖（M of the Sea），人们拜她以感谢航海平安。寺庙建于1822年左右，资金由当地福建人社区捐赠；其中最大的捐赠者是商人陈大德胜（Tan
    Hock Seng）。寺庙最初靠近海岸，但由于陆地填海工程将其推向了内陆。


    随后的华人超过了1000人。新加坡的两个马来统治者——曾在1819年与莱莱签署条约的丹绒督阿布杜勒·拉赫曼（Temenggung Abdul Rahman）和苏赛丹侯赛因（Sultan
    Hussein），带着随从继续住在岛上。苏赛丹侯住在格林榜（Kampong Glam），并在那里建造了一座宫殿。来自民丹（Bencoolen）的马来人居住在巴西巴河（Bras
    Basah River，现为斯坦姆福德河），该定居点被称为甘榜士（Kampong Bugis）。


    迁往新加坡的华人是此前在东南亚其他地区定居的商人，他们许多人娶了当地妻子。这些南洋商人被新加坡的自由港地位和对贸易极少的政府干预所吸引；而在东南亚其他地区，外国商人被征收沉重的税款并受到限制。随后，来自中国大陆的移民导致华人人数超过了马来人。


    1820年2月，一支来自荷兰控制的廖内答的望霹人船队带来了约500名定居者。望霹人已取代了马来人和阿拉伯成为该群岛主要的商人，这些新移民遭到了福顺（Farquhar）的热烈欢迎。


    印度人是少数群体之一，主要作为士兵身份抵达新加坡。一些印度商人来自槟城和马六甲。最早的之一是来自槟城的廖内亚（Riau），他于1819年5月随从莱莱。他开了一家砖窑，成为新加坡的第一位建筑承包商。在19世纪的一段时间里，印度人成为仅次于华人的第二社区。


    马六甲和廖内答是移民最大的来源。福顺此前担任马六甲的英国驻守，他随和的性格赢得了当地人赋予的“马六甲拉惹”称号。因此，很容易诱导马六甲的欧亚人、印度人、马来人尤其是土生华人（Peranakans）迁往新加坡成为新殖民的一部分。导致马六甲人口流出的进一步原因还有1819年的霍乱以及荷兰人重新引入的人头税。到1823年，5000名来自各业的马来人迁到了新加坡，其中包括著名的马来书记员阿布杜拉·本·阿卜杜勒·卡迪尔（Abdullah
    bin Abdul Kadir，即著名的 Munshi Abdullah）和陈卓盛（Tan Tock Seng），后者从一名蔬菜小贩成长为新加坡领先的商人之一。


    由于增长如此迅速，城市的发展杂乱无章，让莱莱在1822年10月访问时感到困扰。他曾设想一个井然良好的城市，为政府行政大楼、商业活动和不同社区的居住区划分清晰的区域。他聘用了中尉菲利普·杰克逊（Philip
    Jackson）担任执行工程师兼测量员，并将其抽派到新成立的镇委员会，该委员会负责规划城市。莱莱提供了明确的指示，而今天的市中心布局仍保留了他的设计。


    - 圣玛丽安曼庙（Sri Mariamman Temple）是新加坡的第一座印度教庙，由纳拉亚纳·皮莱（Naraina Pillai）于1827年建立。原本的三层塔门（入口塔）在1925年被五层结构取代。


    由中尉菲利普·杰克逊绘制并于1829年出版的新加坡城市规划图被认为代表了莱莱对城市的愿景，而非实际的测量图。城市的布局直接来自莱莱的指导。他在现在的莱佛士（Raffles
    Place）和牛车水（Boat Quay）设立了商业中心。丹绒督村迁到了丹戎巴（Tanjong Pagar）和直落望（Telok Blangah）之间的海岸；腾出的空间则用于兵场和政府大楼。罗惹区（Rocher）被留给高效的欧洲人和亚洲人。阿拉伯人被分配在罗惹区之外毗邻甘林榜的空间，而望霹人被迁到了甘林榜之外。华人被分配在河流西侧的大片区域，即牛车街（Chinatown），而印度人被分配在上游地区。


    ## 中转贸易


    新加坡高昂的成本和恶劣的土壤条件使其不适合大规模种植园。例外是霸胶（gambier）和胡椒种植园，它们曾繁荣了几十年。新加坡也没有生产出口商品。一位从马六甲迁往新加坡的土生华人带回了在马六甲发明的珍珠西米粉技术。这变得非常流行，因为西米是该地区的主食。


    然而，真正维持新加坡的是中转贸易。来自世界各地的船只将货物运到港口，特别是来自中国和欧洲。相比之下，荷兰控制的港口征收进出口税；选择停靠新加坡的外国船面临更高的税。与荷兰船只和港口不同，马来人和望霹人的木船（perahu）在新加坡和荷兰港口之间走私货物。作为荷兰垄断产品的爪哇咖啡被走私出爪哇，并通过巴厘岛到达新加坡。同样，鸦片也被走私进爪哇。


