    室齐丹向中国宣称朱罗王朝是室齐丹的属国。此外，在东南亚拥有强大影响力的泰米尔商会（如 Manigramam 和 Ainnruvar）受到了室齐丹对“海人”激进利用的影响，他们向罗真德·朱罗一世求救。因此，朱罗王朝对室齐丹的攻击可能是对室齐丹试图阻碍朱罗王朝与中国之间贸易的报复。


    攻击并没有消灭室齐丹，而是削弱了它，导致朱罗王朝将其首府从占胆迁至占碑。最终为室齐丹敲响丧钟之音的是中国商人直接参与海外贸易。此前与中国的贸易仅限于朝贡贸易，而南宋（1127–1279）因依赖海上贸易维持收入，开启了让中国人直接参与此类贸易的实践。中国商人开始大量涌入东南亚。中国人也在这一千年之初开始建造远洋船只。


    随着中国商人自行前往东南亚港口并自行购买产品，室齐丹作为中间人的服务已不再重要。该王国开始衰落，其属国也开始脱离，因为它们发现自己独立经营获得的贸易条款比通过室齐丹获得的要优得多。


    “室齐丹”这一名称在11 世纪后半叶转移到了占碑，而占胆则被称为“旧港”。1225年赵汝硕提到的15个属国都归属于占碑。然而，这些属国最终还是脱离，占碑不得不用武力强迫船只进入其港口。长期盟友的“海人”不再服从室齐丹。正如12
    世纪的阿拉伯作家艾·伊德里西（Al-Idrisi）和13 世纪的伊本·赛义德（Ibn Said）所指出的，海盗活动开始抬头。室齐丹的成功源于其所享有的垄断地位；这种垄断的消失标志着室齐丹帝国的终结。


    1275年，爪哇信哈萨尔王国的统治者克塔纳加拉（Kertanagara）作为其帕马鲁（Pamalayu）扩张的一部分进攻了占碑，占碑成为爪哇的附庸。到14世纪末，占碑被民加毛（Minangkabau）王国吞并，不再作为一个独立海上帝国的首都存在。同一时期，占胆被爪哇的满帕希（Majapahit）王国兼并。马来贵族四散。此时的占胆已拥有庞大的中国人口，他们大多是在1371年明朝首次发布禁私海外贸易令时离开中国的商人。他们选举梁道明（Liang
    Tao-ming）为首领，并受到了明朝皇帝的保护。


    占胆可以自豪其作为室齐丹王国首都拥有约400年的历史。据信室齐丹城位于穆西江与柯灵河及奥甘河的交汇处，距离现代城市向西约5公里。该地区显示了10世纪之前的居住、贸易、制造和宗教活动证据。该城市的宗教中心位于塞贡当坦山（Bukit
    Seguntang），该地位于马来地区（Melayu），据新加坡和马六甲的创始人均被认为起源于此。这里发现了佛教遗迹，包括尊观音菩萨像、尊青铜毗来佛像、一尊财神像、一尊高3米的佛像以及一座带有圆形底座的佛塔（candi）遗迹。


    占胆西部的一个有趣发现是一个用于铸造佛塔（stupika，供养佛塔）的青铜模具。东南亚发现了大量的供养牌和佛塔，但仅发现另一座佛塔：


    > 这尊佛像高2.27米，发现于塞贡当坦山。它由花岗岩制成，这种材料在当地并不产。佛穿着一件覆盖双肩的长袍，头发卷曲并结成肉髻。


    占胆：室齐丹之座


    格廷苏罗（Gedingsuro）的一座佛塔（candi），这是一个由七座建筑组成的印度教庙。考古挖掘发现了陶器、珠子、树脂和货币。这些发现结合建筑结构表明，该建筑群建于满帕希时期（14-16世纪）。它在16世纪被转变为墓地，现在被称为基因乌鲁墓（Makam
    Ki Ing Ulu）。基因乌鲁来自爪哇的德马（Demak），于1522年创立了占胆苏丹国。


