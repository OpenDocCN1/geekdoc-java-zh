    images. It was located northeast of the palace, which is the traditional location
    for royal shrines.


    ► A six-tiered stone relief in the outer corridor of Shitthaunga Pagoda. At the
    centre is Indra (king of the gods, also known as Sakra in Myanmar), holding his
    Vajra (thunderbolt), while seated on Airavata, his three-headed white elephant.
    Indra is the god of rain, thunder, and storms. In an agricultural country dependent
    on the rains, Indra is an important deity as as he has the power to control rainfall.
    Consequently, the kings of Rakhine were consecrated with Indra''s power.


    ► New Buddha statues, donated by pilgrims and devotees, line the left side of
    a passageway in Shitthaunga Pagoda, while original statues line the right side.'
