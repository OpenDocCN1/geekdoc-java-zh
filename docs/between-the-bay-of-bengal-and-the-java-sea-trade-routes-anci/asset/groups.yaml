    ## 第7章

    ## 新加坡


    ### 城市的两个起源


    斯里·特里布亚纳（Sri Tri Buana）站在民丹岛的一块高岩上，望向海对岸一片沙滩，细腻得像一块布料。这就是淡马锡（Temasek）岛。它的美景吸引了三佛齐王子在其岸边建立了一座城市，他在岛上发现一只狮子后，将这座城市命名为
    Singapura——梵语中是“狮子城”。


    斯里·特里布亚纳建立新加坡发生在13世纪的最后十年。那是该地区的一个动荡时期。作为马来权力堡垒的三佛齐齐帝国正在解体，而爪哇人正在苏门答腊西南部争夺权力。暹人正向马来半岛南部扩张，进入了被满城者者王国（Majapahit）占领的领土。马来霸权正受到威胁。但随着新加坡的建立，马来权力的中心从马六甲海峡的西岸扩展到了东岸。《马来纪事》（Sejarah
    Melayu）记载，新加坡在斯里·特里布亚纳及其四位继任者的统治下，崛起成为一座大城市，吸引了外国商人，使其名声远扬海外外。


    > 新加坡市政厅的一处狮头形门扣。狮子已成为国家的象征。然而，关于斯里·特里布亚纳发现狮子的故事虽然受到过质疑，但也并非孤例。更有可能是，斯里·特里布亚纳选择“Singapura”这个名字是为了让他的新城与佛教世界联系起来，在佛教世界中，狮子一直是一个重要的象征。


    ## 早期


    令三佛齐成功的条件新加坡（淡马锡）同样具备。它也位于爪哇海西北部；东北风和西南风的交汇点使得这里成为往来于中国与西方海上航线的商人汇聚的理想之地。


    在三佛齐时代，新加坡可能已经接入区域贸易网络，其红树林地区居住着海来人（Orang Laut），他们在协助三佛齐方面发挥了重要作用。随着三佛齐不再是影响因素，新加坡现在可以发展成为一个独立的贸易中心。事实上，它的重要性足以引起中国人的关注。1320年，蒙古元朝派遣了一支使团前往龙眼门（吉柏港入口）请求大象；这次访问在1325年得到了回访。


    淡马锡是中国旅行者王大渊所访问的东南亚99个地点之一。


    福宁山（Fort Canning Hill）的考古研究始于1984年，出土了3万件文物，属于14世纪的定居点。这一特定地点位于伊斯坎达·沙墓（Keramat
    Iskandar Shah）附近，曾是生产玻璃和黄金制品的皇家作坊。


    他在1330年代，并在1349年的出版物中对此进行了描述。有趣的是，他提到淡马锡是两个拥有华人的地点之一。另一个位于婆罗洲西南岸的岛屿。这可能是五爪岛（Pulau
    Gelam），那里的中国人口后裔是哥必汗在1292年为了报复爪哇信哈萨里王国而派出的元朝舰队中留下的病患。这个岛屿并不是贸易站，因此新加坡拥有了东南亚沿海地区最早的华人贸易定居点的荣誉。然而，中国人何时以及何时定居于此尚不清楚。


