    # THE BIRTH OF MELAKA as an entrepôt in the early 15th century can be attributed
    to a large extent to its geographical location, nestled halfway between two major
    civilisations — Ming China to the east, and the Indian kingdoms to the west. But
    it was founded circa 1402 by Parameswara, a renegade prince from Palembang, trade
    was not the main thing on his mind.

    Parameswara was on the run from the Siamese, who had laid a bounty on his head
    for killing the ruler of his vassal state, Temasek. Fleeing up the western coast
    of the Malay Peninsula, Parameswara found a hide with numerous corridors and pathways
    and land that would be strategic for warding off attacks from the Siamese. Here
    he established a new settlement, became known as Melaka. His son fortified an
    abode on the crest of the hill near the mouth of Bertam River (today Melaka River),
    from where their men kept constant vigilance over the ships that passed the Straits
    of Melaka.

    Melaka''s original inhabitants were mostly sea gypsies or fishing folk commonly
    referred to as Orang Seletar. Parameswara built an alliance with them to


    ![](img/c3e5c3015b89799ae52d8dae1158f750_112_0.png)


    112 · Between the Bay of Bengal and the Java Sea'
  - '[PAGE 113]


    establish the new city as a viable port-of-call, seeing that its location made
    it accessible in all seasons. Piracy was reduced with the assistance of these
    faithful Orang Seletar noblemen, whose followers patrolled the sea in light boats.


    As the seaport rose in prominence, Melaka began to attract traders near and far,
    leading Arab and Indian merchants to its shores. It was apparently these Muslim
    merchants who informed the Chinese court of Parameswara''s new port, China''s
    Melaka''s potential as a commercial hub. China''s maritime explorations in search
    of trade proved to be timely for this erstwhile fishing hamlet. Yongle, a delegation
    led by Admiral Yin Qing set sail for Melaka, arriving in 1403, and reporting a
    population of over 2,000.


    Parameswara seized the opportunity and pledged his loyalty to the emperor to gain
    China''s support against his rivals, Siam. In 1405, he sent an envoy to pay homage
    to the emperor and received recognition as the independent ruler of Melaka. From
    then on, regular tributes that included pepper, timber and


    > A group of Orang Seletar in the 19th century. It was from this group of seafaring
    people that Parameswara had chosen his ministers. From their base on Bintan Island
    they also served as rulers for the rulers of Melaka when required.


    ![](img/c3e5c3015b89799ae52d8dae1158f750_113_0.png)'
  - '[PAGE 114]


    ![](img/c3e5c3015b89799ae52d8dae1158f750_114_0.png)


    A Chinese navigational map showing Melaka''s importance in the early 15th century,
    with sailing directions to and from its estuary. The name Melaka (circled in red)
    is above a styled hill. Across the estuary is an official depot and ship repair
    yard (circled in blue). This map first appeared in the Wu Bei Zhi (Records of
    Military Affairs) compiled by Ma Huan in 1419, and is believed to have been based
    on Admiral Zheng He''s expeditions.


    jewels were sent to China in exchange for protection against Siamese and Majapahit
    invaders. Parameswara''s successors would visit the Ming emperor personally to
    seek blessings and reaffirm the close ties between the two kingdoms. This tradition
    continued until the reign of the last Sultan of Melaka, Sultan Mahmud (d. 1528).

    Admiral Zheng He, the Muslim Chinese eun diplomat, arrived in Melaka with his
    “treasure fleet” for the first time in 1409. On behalf of the Ming emperor, he
    raised the territory to the rank of a Chinese vassal state. He proceeded to establish
    a regional headquarters near Melaka''s harbour, with that, a sizeable Chinese
    trading community began to settle in town. According to the voyager Ma Huan, Zheng
    He''s depot was a palisade-like castle with four walled gates. Within the enclosure
    were protected warehouses and granaries that stored money, food and other


    114 Between the Bay of Bengal and the Java Sea'
  - '[PAGE 115]


    ![](img/c3e5c3015b89799ae52d8dae1158f750_115_0.png)


    provisions. Melaka became the terminus for Zheng He’s voyages to the West, a storage
    centre for goods en route to China. Chinese travellers described Melaka’s public
    buildings, especially the royal palace, to be similar to Chinese imperial palace.
    Zheng He and his men are believed to be the ones who introduced the construction
    of permanent buildings to the town, replacing the local timber, bamboo and nipah
    structures. The palace was reported to have featured roof tiles that Zheng He
    brought from China.


    +   - Shards of ceramics have been discovered in Melaka of the Ming, Qing, Swatow,
    Swankhalok, Sukhothai, Annamese, and Japanese Persian varieties – reflection of
    the bustling cosmopolitan trade that took place in the city.


    China’s presence at Melaka boosted the status. The Ming court, the biggest purchaser
    of pepper at the time, was Melaka’s principal trading partner, bringing among
    other orders, porcelain, musk, silk, mercury, copper and vermillion. Melaka remained
    under China’s influence up to 1436, after which the Ming Dynasty began to decline.
    The Malukan sought new markets to replace China when the treasure fleets stopped
    arriving, though tributes and private trading continuing.


    +   - An acute shortage of copper cash in Melaka led the Chinese to make alternative
    copies of local tin, using the titles of emperors from dynasties. These tin coins
    were used in Melaka and are not found in China.


    At the time of Melaka’s establishment, the pepper-rich kingdom of Samudra-Pasai
    in northern Sumatra was the major business centre along the Melaka Straits. It
    was the first Islamic kingdom in the Far East, conducting trade with Muslim merchants
    from


    ![](img/c3e5c3015b89799ae52d8dae1158f750_115_1.png)'
  - '[PAGE 116]


    <!-- no content -->'
  - '[PAGE 117]


    Asia, especially the Gujaratis from Cambay, since the late 13th century. Samudra-Pasai
    had a guaranteed supply of rice and spices from the Javanese, and it was essentially
    the latter commodity, on top of its own pepper and gold, that attracted international
    merchants to its advantageous terms to draw some of Pasai''s international spice
    and rice trade to Melaka. It is said that Pasai''s ruler was amenable, on the
    condition that the Hindu convert to Islam. Parameswara''s son eventually embraced
    the religion towards the end of his long reign, marrying a Samudra-Pasai princess
    and forged an alliance with the kingdom, especially in their struggle against
    Majapahit. His Malay subjects converted, Banten and Gresik, following his example.


    To avoid the pirate lair between Banten and Gresik, the Muslim Gujarati merchants
    would travel to Java along Sumatra''s west coast and arrive via the Sunda Strait.
    With the opening of Melaka''s much sheltered port, they unlocked an alternative
    route through the Straits of Melaka, ending direct to north Java ports as they
    no longer needed to sail further to Melaka to gain access to products from the
    Moluccas and China. Preference for Melaka led to the eventual decline of Samudra-Pasai,
    and Melaka took on its baton as the region''s prominent international port and
    centre of Islamic propagation.


    By the middle of the 15th century, Melaka was almost entirely Islamised. The town
    grew to become a destination for religious education, attracting scholars,


    > ◄ According to the Ming imperial annals, in 1455 the Emperor conferred the title
    "Mountain Protecting the Country" upon Melaka. Some scholars say that the name
    Bukit Cina may have been derived from this event. Bukit Cina used to be used as
    a Chinese cemetery and today to be the oldest remaining Chinese cemetery outside
    China.


    > ◄ This mausoleum at Jalan Kabul is is said to be that of Lakshamana Shah Jebat,
    an admiral from the Melaka Sultanate who according to the Sejarah Melayu rebelled
    against an unjust act by Sultan Mansur Shah.'
  - '[PAGE 118]


    princes and rulers to study Muslim culture, literature, calligraphy, law and Sufism.
    The seventh Sultan of Melaka, Sultan Alaudin Rakyat Shah (r. 1477–88), funded
    the sultans of Kampar and Indragiri to study in his kingdom. Sunan Bonang and
    Sunan Kalijaga, two of Java''s Wali Songo (Nine Saints of Islam), also pursued
    their Islamic studies there. With Melaka''s encouragement, Muslim missionaries
    preached openly within the Nusantara region. It was under Melaka''s influence
    that the majority of the people living on the Spice Islands embraced. The religious
    network proved to be a commercial advantage, with the rulers of Aden, Hormuz,
    Bengal and Cambay issuing letters and gifts to encourage merchants to set up commerce
    in Melaka. With direct diplomatic ties with the Ottoman centres of power, the
    Sultanate also secured military advisers and weapons that strengthened its power.


    The Straits of Melaka was part of the spice route, but was textiles that were
    central to Melaka''s status as an emporium, linking to the Coromandel, Malabar,
    Gujarat and Arabian ports of the Indian Ocean. Indian textiles were the single
    most important commodity traded for spices. This was an advantage for Gujarat,
    the centre of cotton manufacturing and textile design. In Cambay, merchants from
    the Malabar, Arab and Coromandel would converge and form companies to hire Gujarati
    ships for journeys to Melaka. They flooded Melaka with a variety of cotton fabrics
    and dyes in exchange for pepper, jungle products, camphor and benzoin. Raw silk
    from Bengal and Sumatra was also highly prized by the


