    # MAHAMAMUNI: A RAKHINE LEGACY


    RAKHINE OCCUPIES an important place in Myanmar''s religious history as the progenitor
    of the enduring Mahamunni tradition. Mahamuni is a bronze image of Buddha that
    is said to bear an exact resemblance to Gautama Buddha.


    A Rakhine manuscript relates that Buddha wished to meet with King Kandasuriya
    of Rakhine. Thus, in the company of 500 disciples, he flew from his home in Shravasti
    (India) to Selagiri Hill by Kyauktaw (Rakhine). There, he awaited the king. Upon
    hearing of Buddha''s arrival, the king hastened to Selagiri with a large retinue.
    Buddha tutored him on Buddhist


    Sculptures representing Buddha and his 500 disciples on Selagiri Hill, installed
    on the grounds of the Mahamuni shrine.


