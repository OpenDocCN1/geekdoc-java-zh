    The Canggal Inscription, written in Sanskrit script using the Pallava script,
    bears witness that a Shaivite Hindu regime had been established in Central Java
    by the 8th century.


    Bulu is located. During this earlier period, Pragota serviced the Mataram Kingdom
    – but not the same one the Pangeran Made Pandan Arang came from. “Mataram” refers
    to two different kingdoms: the Ancient Mataram Kingdom, a Hindu-Buddhist polity
    (732–938/1006), and the Islamic Mataram Kingdom, which emerged in Demak (1475–1755).


    Ancient Mataram, also known as the Medang Kingdom, was founded in Central Java
    by King Sanjaya, the nephew of King Sanjaya (Bratasenawa) of the Galuh Kingdom
    in West Java. The Canggal Inscription, dated 732 CE, records King Sanjaya declaring
    himself the universal ruler of Medang. The inscription, discovered in the Wukir
    Mountain temple complex (near Magelang), marks the beginning of Sanjaya’s dynasty
    in the region, which lasted until 770, before it was taken over by the Mahayana
    Buddhist Sailendra Dynasty.


    King Sanjaya, a just ruler, was well-versed in holy scriptures, martial arts and
    military strategy. His kingdom, Medang Bhumi Mataram (Medang in the Land of Mataram),
    was an agrarian state that relied heavily on rice farming. The volcanic soils
    of the Kedu Plain were fertile fields. Rivers and canals were integrated into
    a sophisticated system to irrigate the rice fields. Paddy storage facilities and
    warehouses increased Mataram''s handling capacity for trade. In the meantime,
    many neighbouring trading ports were outgrowing their food production capabilities
    and increasingly dependent on imported rice. These factors secured Mataram''s
    role as the rice bowl for the region between the 8th and 10th centuries.


    As part of the Ancient Mataram Empire, the village of Praha strengthened itself
    as one of the many harbours consolidating the rice supply from the hinterland,
    although it remained overshadowed by prominent neighbours such as Jepara and Tegal.


    From the 9th century onwards, safflower and pepper from India were also planted
    in the kingdom as cash crops. Together with rice, these agricultural commodities
    were traded for gold, silver, ceramics, iron goods, lacquerware, cotton, silks,
    damasks and cinnabar, as well as raw materials to supply its domestic ceramic,
    textile and metal industries.


    Politically stable and extremely wealthy from its rice trade, the Ancient Mataram
    Kingdom was able to channel its resources towards the construction of monuments
    – some as symbols of its rulers'' divine powers and some as spiritual focal points.
    The Borobudur, Prambanan, Rorojongrang, Mendut, Kalasan, Pawon and Sewu temples
    are among the structures built by the Mataram kings. Mataram grew to become a
    centre for Buddhist studies, led by Sanskrit-literate priests.


    Continuous volcanic sedimentation along Pragota and the volcanic eruption of Mount
    Merapi around 1000 CE forced Mataram''s ruler, King Sindok, to move the centre
    of his government to East Java, at the estuary of the Brantas River, after which
    the kingdom slowly disappeared.


    It wasn''t until the arrival of Admiral Zheng He with his treasure fleet of 62
    ships, 225 vessels and sailors in 1406 that detailed descriptions of the area
    reappear in the records. Tasked with expanding China''s trading network on behalf
    of the Ming court, Zheng He carried out seven expeditions between 1405 and 1433,
    visiting more than 37 kingdoms, including Palembang, Banten, Cirebon and Gresik.
    Six of his expeditions stopped at Java, bringing in a varied crew of astronomers,
    officials, map-makers, traditional healers, preachers and ethnographers, among
    others.


    Though intertwined with myths and legends, it is believed that while sailing along
    the north coast of Java, Zheng He''s fleet anchored at Pragota after several of
    the crew fell ill. Among them was the Admiral''s deputy, Wang Jing Hong. While,
    a Muslim, performed his prayers in a small cave on a rocky hillside. After 10
    days, the fleet resumed its journey, leaving behind Wang and ten servants to recover.
    These Chinese Muslims decided to settle in the area, farming, trading and preaching
    Islam to the locals.


    In 1411 the Admiral''s fleet stopped by Pragota for repairs. This time, Zheng
    He established a mosque near the cave where he had prayed. An image of him was
    placed in the mosque much later, incidentally turning it into a temple-like centre
    for the local Buddhists, Taoists and Confucians. Known today as Sam Po Kong (Sanbao
    Dong) and the Gedung Batu Temple, it remains a popular worship destination for
    Javanese Muslims and Chinese Buddhists alike. Zheng He''s visit is also memorialised
    in the Chinese name for Semarang, Sanbao Long, which comes from Sanbao.


    In the 15th century, the group of Chinese Muslims that had settled in Java emerged
    as the driving force in the Islamisation of Javanese. The Kingdom of Demak was
    the most powerful early Muslim kingdom in Java, profiting from Mataram’s strategic
    harbours and agricultural richness. The Demak rulers adopted “Sultan” as their
    titles in the 1520s.


    Pragata became the kingdom’s main harbor town. A new mosque was built in 1478
    in gratitude for Jin Bun’s victory and to substitute the one that had been converted
    as the Sam Po Kong earlier. The abandoned dockyard was redeveloped. Adopting the
    construction of Acehnese ships, large, high-speed jong were built, and Demak was
    able to expand its maritime influence, even launching expeditions in 1546 to gain
    direct control of the Moluccas spice trade. The shipbuilders of Pragata, comprising
    mostly non-Muslim Chinese, were known for their quality work.


    There isn’t a specific date when Pragata’s name was changed, but it is noted that
    by the time the Portuguese apothecary Tomé Pires visited between 1512 and 1515,
    the area was already known as Semarang, which he referred to as “Camaram”.


    The rice trade remained the Demak Mataram’s primary source of income, mainly conducted
    through the port of Jepara. Its biggest customer was Melaka, a highly populated
    entrepot on the Malay Peninsula. However, the fall of Melaka to the Portuguese
    in 1511 was a turning point for all its trade partners and allies. In 1512, the
    Demak Sultan sent naval forces to capture Melaka. Of the 100 vessels sent, only
