    ## INDIGENOUS CULTURE AT KUALA SELINSING


    THE KUALA SELINSING SETTLERS lived in houses made of wood and thatch, built over
    water, and they discarded their household refuse below their dwellings. The accumulation
    of this refuse, over time, caused mounds of dry land to appear around the houses.
    The existence of Kuala Selinsing may have faded from memory but excavation of
    these mounds has exposed this ancient culture and brought its lifestyle into sharp
    focus.


    A picture is gleaned of a community whose diet included bivalves, coconut and
    bottle gourds. They hunted animals for meat and food sustenance from the ocean
    in the form of giant clams and sea snails. Mortars made out of hollowing a tree
    trunk were used to pound paddy. Bark-cloth beaters were used to soften


    Bark-cloth beaters, identified by a cross-hatched pattern incised on one face,
    were used to pound barks in order to soften them for fashioning. Two such beaters
    were found at Kuala Selinsing, while one was found in the burial site at Changkat
    Menteri, Pointing to a possible cultural commencement between the two settlements.
    However, the Kuala Selinsing specimens were made of hard pottery while the one
    at Changkat Menteri was of stone.


