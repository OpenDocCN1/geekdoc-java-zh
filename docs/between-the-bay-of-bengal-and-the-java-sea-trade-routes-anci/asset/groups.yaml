    But Singapore never did become the opium hub envisaged by EIC as most opium was
    shipped directly from India to China. In 1835–36, for example, 48 chests of opium
    were imported into China, while 30,202 chests were imported directly from India.
    The imports from Singapore made up only 1.4 percent of China’s total imports.
    However, Singapore became a hub distributing opium to the tin-mining settlements
