    The pepper plant (Piper nigrum), native to India. The fortunes of Banten were
    built on this highly sought-after spice.


    Black and white peppers are both produced from the same species, *Piper nigrum*.
    Black pepper is made from unripe pepper berries that blacken after being dried.
    The production of white pepper is more tedious – sunny sacks of fully ripe pepper
    berries were traditionally fermented in water for about two weeks before their
    pericarps were scrubbed off. White pepper, used as seasoning in light-coloured
    dishes and to flavour wine, was more expensive. This was China, the biggest market
    for pepper in the East, was sourcing for Banten at the beginning of the 15th century.


    In 1379, the Ming court, which had sole monopoly over China''s foreign pepper
    trade, began to reward its subjects with the spice. Admiral Zheng He, during his
    sea voyages between 1405 and 1433, became the sole importer of pepper from the
    Afro-Asia region. In 1424, the pepper and sappan wood that he brought back was
    used to pay the salary of imperial officers. When Zheng He''s voyages ended, foreign
    envoys brought in pepper as tributes to the imperial court. By 1532, one catty
    of pepper was worth 5.5 taels of silver.


    The average annual amount of pepper purchased by China in the 15th and 16th centuries
    was 50,000 bags, or 2 million catties, equivalent to the total amount of pepper
    imported by Europe from the East in the first half of the 16th century. Demand
    increased yet further at the end of the Wanli Emperor''s reign (1572–1620), as
    direct access to the commodity became available to commoners. Pepper was no longer
    an exclusive commodity for China''s wealthy. In this turn stimulated pepper cultivation
    in the Malay Archipelago.


    Banten Girang was reputed to yield top-quality pepper. Its harbour, Banten, sheltered
    by several islands from the open sea, was a strategic assembly point for traders
    coming from the Indian Ocean, the South China Sea and the Malay Archipelago. Taking
    over Melaka''s role as the primary entrep for the export of pepper to China, Banten
    Girang sustained a relationship with the Portuguese, who sold them gunpowder for
    Melaka-made cannons that were supported by carriages produced by Banten''s Chinese
    carpenters. Banten''s ships would often sail to Macao, which was also under Portuguese
    rule.


    An agreement signed in 1522 granted the Portuguese unlimited access to Banten''s
    pepper and permission to build a fort at the mouth of the Java Ontong River (present-day
    Cisadane River), which would be financed by the kingdom in the form of an annual
    pepper subsidy of 1,000 gunneries (30 tons). The fort was intended to block attacks
    coming from the east, but before it could be built, an invasion force of 2,000
    men from the Muslim Kingdom of Demak attacked and captured Banten Girang in 1527.
    With the cooperation of the local elites, the populace embraced Islam, and a Muslim
    state was established, led by the brother-in-law of Demak''s Sultan Trangana,
    Sunan Gunungijati, and his son, Maulana Hasanuddin.


    Sunan Gunungijati (also known as Syarif Hidayullah) is revered today as one of
