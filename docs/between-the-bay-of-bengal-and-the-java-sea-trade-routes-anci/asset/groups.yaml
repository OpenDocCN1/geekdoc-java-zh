    八人回了。1521年的另一次尝试同样没有成功。


    到世纪世纪中叶，金汶（Jin Bun）的孙辈之间爆发了一场内战。除了三宝岗庙（Sam Po Kong Temple）和清真寺，三宝被付之一。随着马塔兰（Mataram）地区被苏丹·哈迪维吉亚亚（Sultan
    Hadiwijijaya，即贾亚·廷基尔）领导的帕江王国取代，金马拉克王朝随之结束。


    苏丹·哈迪维吉亚亚注意到在城长潘丹·阿拉朗二世（Pandan Arang II，王子潘丹·阿拉朗之子）的领导下，三宝的增长与潜力。苏丹在1547年5月2日宣布该镇为正式行政县（kabupaten）。直到今天，这一天仍被庆祝为三宝的建城日。


    三宝城的布局遵循了与爪哇岛其他城市类似的空间原则——通过一条南北轴线连接海洋。两个主要区域是位于三宝河口的海港区，以及一个被称为“坎杰安”（Kanjengan）的行政区。坎杰安设有政府办公楼、皇宫和清真寺，并围绕着传统的公共广场“阿隆阿隆”（alun-alun）。商店在连接这些枢纽的道路两旁拔地而起。如今的Jalan
    Layur路曾由阿拉伯和中国商人主导。在这条干道后面，是来自印度、马来半岛、泗里汶和班爪的商人社区的定居点。


    到16世纪末，荷兰人对与远东直接贸易的兴趣增加。通过扩大海外探索，他们于1595年开启了首次亚洲航行。1602年，荷兰东印度公司（Vereenigde Oost
    Indische Compagnie；VOC）获得特许经营权，并寻求对该地区的当地亚洲商人建立自己的商业垄断，并在1619年控制了巴达维亚（Batavia）。VOC依赖马塔兰提供食物和木材，以建造他们的新城。


    在苏丹·阿贡·哈尼奥克鲁苏莫（Sultan Agung Hanyokrokusumo，1613–46）的统治下，马塔兰的领土通过对爪哇中部和东部大部分地区以及望杜拉和婆罗洲的大规模军事征服大大扩张。但马六甲依然未能逃脱马塔兰的掌心。这个旧的中转港反而于1641年落入荷兰控制，VOC随后阻碍了爪哇大米出口马六甲。马塔兰的另一个主要出口地是马鲁群岛，但那里的供应链也必须经过荷兰人。


    面对财务困难，苏丹·阿曼阿库特一世（Sultan Amangkurat I，在位1646–77）在1674年面临了望杜拉王子特纳亚（Trunaya）及其望加锡盟友的反叛挑战。他们最初取得了成功，占领了泗水并俘获了爪哇北岸。为了寻求支持，马塔兰于1677年3月与VOC建立了同盟。他的继任者阿曼阿库特二世（Amangkurat
    II）延续了这一联盟，并为VOC代表马塔兰进行的军事行动提供承诺。尽管阿曼阿库特二世击败了特纳亚，但他的王国留下了沉重的债务，因为苏丹希望从特纳亚那里追回国库被VOC和马塔兰士兵掠夺了。由于无法支付，阿曼阿库特二世于1682年将三宝让给了荷兰人。在此基础上，他还授予了VOC向马塔兰进口纺织和鸦片的垄断权，以及从苏丹处购买糖的权利。1705年10月5日，三宝正式签署成为VOC的领土，以换取苏丹的所有债务。


    - 在普拉戈塔（Pragota）建造的船可能类似于这种由J.H. van Linschoten于1596年绘制的“戎船”（jong，帆船）。带有新月标志的蓝旗表明船只来自印度尼西亚的一个伊斯兰苏丹国。


