    While archaeology has provided good insights into the settlements and their trading
    activities, the political structure of ancient Kedah remains uncertain. Kingdoms
    are mentioned in ancient texts, especially Arab ones, but these have yet to be
    verified by archaeological evidence. Chinese and Arabic writings indicate southern
    Kedah was under Srivijayan sovereignty and was an important port within the Srivijayan
    mandala. This is corroborated by the fact that Kedah did not send any missions
    to China, with the possible exception in 638 CE, implying that it was not an independent
    polity. The 1025 Chola attack on Srivijayan ports reshaped the culture of southern
    Kedah to a more Hindu-dominant one.


    Subsequently, with the conversion to Islam and the decline in maritime activity,
    the ancient culture of southern Kedah lay forgotten. However, its ruins inspired
