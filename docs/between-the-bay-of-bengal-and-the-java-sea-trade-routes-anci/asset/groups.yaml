    14世纪的满爪没丹王国和15世纪的马六甲苏丹国。


    **邦加/Bangka/Banca（苏门答腊）** 位于苏门答腊东部，邦加隶属于杰帕拉统治者。它的名字可能源于梵语单词 *vanga*，意为“锡”，或 wangka，一种中国船只。邦加出口其后陆的森林产品，如木脂、檀香、染料、乳胶、棉花和铁。从16世纪起，来自勿加腊的马来人居住在邦加。荷兰东印度公司（VOC）于1710年在该岛开采了锡矿，并于1722年从勿加腊苏丹处获得了邦加锡矿的垄断权。随着中国人的到来，采矿活动日益增加。


    ![](img/c3e5c3015b89799ae52d8dae1158f750_244_0.png)

    双层石庙（Candi Kembar Batu），茂罗三比


    ![](img/c3e5c3015b89799ae52d8dae1158f750_245_0.png)

    雅加达巽达吉甲港的普尼西船。


    # 巽达吉甲（爪哇腊）


    巽达吉甲是爪爪ajaran王国的主要港，16世纪贸易胡椒、黄金和稻米，以及来自马尔代夫和爪哇腊的奴隶。食物和当地制造的粗布出口到马六甲和其他地区，在特伦甘纳苏丹（在位：1505–18，1521–46）的统治下走向繁荣。其港口在16世纪关闭，由港口更好的杰帕拉取代。


    ![](img/c3e5c3015b89799ae52d8dae1158f750_245_1.png)

    德麦苏丹国币


    # 德麦（爪哇腊）


    德麦出口其后陆的粮食供应，但依赖与马六甲的船只供应贸易。它是15世纪至16世纪爪哇腊海洋王国最重要的政治中心。


    ![](img/c3e5c3015b89799ae52d8dae1158f750_246_0.png)

    △ 像塔一样的杰帕拉大清真寺


    # 杰帕拉（爪哇腊）


    杰帕拉是一个重要的港，隶属于德麦。位于一个大型船舶可以进入的海湾，使其对在爪哇腊和摩鹿加群岛之间往来的商人极具吸引力。杰帕拉向马六甲和香料群岛出口米。它在17世纪成为马达拉腊王国的主港。1618年至1646年间，由于荷兰人的制裁和攻击，杰帕拉的贸易有所衰落。


    前往拉斯姆并带回60名爪哇腊造船师。拉斯姆在1616年被马达拉腊的阿贡苏丹征服。该港口在19世纪末开始衰落。


    # 杜班（爪哇腊）


    杜班的海外贸易记录可追溯到11世纪。它是前往摩鹿加群岛航海的出发港。13世纪，一支中国探险队登陆并试图征服该岛。15世纪，它是一个重要的港口，许多来自广州和泉州的华人定居于此。其本土统治者在15世纪中期皈入伊斯兰教。杜班被一堵厚墙围绕，居住着约1000名居民，是一个宫廷首都。


    # 拉斯姆（爪哇腊）


    拉斯姆位于杜班和杰帕拉之间，拥有雷姆邦丰富的柚木资源，使其成为造船业中心。它曾是满爪丹王国的领土。1512年，阿尔方索·德·阿尔布奎尔克离开拉斯姆。1619年最终被马达拉腊的阿贡苏丹击败。


    # 格里克/Gresik/Grise/Agasim（爪哇腊）


    马杜拉岛与爪哇腊本土之间通道的天然避风港，格里克在14世纪非常繁荣。它用香料、檀香和蜂蜜换取织品和瓷器。格里克通过索罗河连接爪哇腊中部的定居点，如帕江和泗水巴。1764年，格里克处于荷兰东印度公司的控制之下。♦
    18世纪早期的爪哇地图


