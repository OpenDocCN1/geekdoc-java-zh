    # FINDING SRVIJAYA


    PALEMBANG can boast a history of around 400 years as the capital of the Srivijaya
    kingdom. The city of Srivijaya is believed to have been located where the Musi
    River meets the Komering and Ogan rivers, about 5 kilometres west of the modern
    city. This area shows evidence of habitation, trading, manufacturing and religious
    activities from before the 10th century. The religious centre of the city was
    at Bukit Seguntang, and the location is Melayu where the founders of both Singapore
    and Melaka are said to have originated. Buddhism remains have been discovered
    here, including an Avalokitesvara statue, a bronze Vairocana Buddha statue, a
    Kubera statue, a 3-metre-high Buddha statue, and the remains of a candi with a
    circular base.


    One interesting find from west Palembang is a bronze mould used for casting stupika
    (votive stupa). Votive tablets and stupika have been found in large quantities
    in Southeast Asia, but only one other stupika


