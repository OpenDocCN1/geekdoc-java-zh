    Peninsula; these regions had seen tremendous growth during the 13th and 14th centuries.
    Samudra-Pasai was also linked directly to Bengal, Gujarat and China. Ibn Battuta,
    a traveller from northern Africa, noted the presence of ships from China during
    the mid-14th century.

    An important milestone in the history of Southeast Asia was the ban on overseas
    trading issued in 1337 by the Hongwu Emperor, founder of the Ming Dynasty. This
    comes to be known as the Ming dynasty and it saw China retreat from direct trade
    in the region. During this time, many merchants and craftsmen, with their livelihoods
    under threat, left China to settle in Southeast Asia and Japan. They brought their
    technical know-how with them to their homelands, where they established industries
    based on Chinese manufacturing methods. One example is


