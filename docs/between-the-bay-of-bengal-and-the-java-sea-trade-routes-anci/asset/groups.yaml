    Gold was one of the products from Myanmar that attracted foreign traders from
    the earliest times. The main gold belt lies in Myanmar''s north, in the regions
    of Kachin, Sagaing and Mandalay. In the south, deposits have been found in the
    lower reaches of the Sittuang River. Kyaittha, a gold-producing region at the
    mouth of the Sittuang, yielded ancient gold coins. Indians referred to this region
    as Suvarnabhumi (Land of Gold), a name that later encompassed other parts of Southeast
    Asia. In Myanmar, gold was not used as currency, and it also limited usage as
    adornment for the ruling classes. Instead, it was reserved for the decoration
