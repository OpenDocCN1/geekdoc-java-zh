    transition from Hinduism-Buddhism to Islam among the Javanese.


    The Kingdom of Demak was the most powerful early Muslim kingdom in Java, profiting
    from Mataram’s strategic harbours and agricultural richness. The Demak rulers
    adopted “Sultan” as their titles in the 1520s.


    Pragata became the kingdom’s main harbor town. A new mosque was built in 1478
    in gratitude for Jin Bun’s victory and to substitute the one that had been converted
    as the Sam Po Kong Temple earlier. The abandoned dockyard was redeveloped. Adopting
    the construction of Acehnese ships, large, high-speed jong were built, and Demak
    was able to expand its maritime influence, even launching expeditions in 1546
    to gain direct control of the Moluccas spice trade. The shipbuilders of Pragata,
    comprising mostly non-Muslim Chinese, were known for their quality work.


    There isn’t a specific date when Pragata’s name was changed, but it is noted that
    by the time the Portuguese apothecary Tomé Pires visited between 1512 and 1515,
    the area was already known as Semarang, which he referred to as “Camaram”.


    The rice trade remained the Demak Mataram’s primary source of income, mainly conducted
    through the port of Jepara. Its biggest customer was Melaka, a highly populated
    entrepot on the Malay Peninsula. However, the fall of Melaka to the Portuguese
    in 1511 was a turning point for all its trade partners and allies. In 1512, the
    Demak Sultan sent naval forces to capture Melaka. Of the 100 vessels sent, only
    seven or


    204 · Between the Bay of Bengal and the Java Sea'
- md: '

    eight returned. Another attempt, in 1521, was equally unsuccessful.


    By the middle of the century, a civil war had broken out among the grandchildren
    of Jin Bun. Semarang was burnt to the ground, except for its Sam Po Kong Temple
    and mosque. Jin Demak dynasty ended when the Mataram region was taken over by
    the Kingdom of Pajang, led by Sultan Hadiwijijaya (Jaya Tingkir), who established
    his government at Kotagede.


    Sultan Hadiwijijaya noticed the growth and potential of Semarang under the leadership
    of the town’s chief, Pandan Arang II, son of Pangeran Made Pandan Arang. The sultan
    announced the town as an official district (kabupaten) on 2 May 1547. Until today,
    this is celebrated as the day of Semarang''s founding.


    The town of Semarang was laid out according to spatial principles similar to other
    Javanese towns – addressing the sea through a north-south axis. The two principal
    areas were the seaport, located at the mouth of Semarang River, and an administration
    area known as the Kanjengan. At the Kanjengan were the government offices, palace
    and mosque, centred around the alun-alun, a traditional public square. Shophouses
    sprang up along the road that connected these hubs. Jalan Layur, as it is known
    today, was at one time dominated by Arab and Chinese traders. Behind this thoroughfare
    were settlements by merchant communities from India, the Malay Peninsula, Cirebon
    and Banjar.


    By the end of the 16th century, Dutch interest in direct trade with the Far East
    increased. Expanding their maritime explorations, they launched their first voyage
    to Asia in 1595. In 1602, the Dutch East India Company (Vereenigde Oost Indische
    Compagnie; VOC) received its charter and sought to establish its own commercial
    monopoly over indigenous Asian traders in the region, gaining control of Batavia
    in 1619. The VOC depended on Mataram to supply food and timber to construct their
    new city.


    Mataram’s territory was greatly expanded under the reign of Sultan Agung Hanyokrokusumo
    (1613–46) through extensive military conquest in most of central and eastern Java,
    as well as Madura and Borneo. But Melaka continued to elude Mataram’s grasp. The
    old entrepot instead came under Dutch control in 1641, and the VOC would later
    obstruct Java''s rice export traffic to Malaka. Mataram''s other major export
    destination was the Moluccas, but here, too, their supply chain had to go through
    the Dutch.


    In the face of financial woes, Sultan Amangkurat I (r. 1646–77) was challenged
    by a rebellion in 1674 by a Madurese prince, Trunaya, and his Makassare ally.
    They were initially successful, taking over Surabaya and capturing the north coast
    of Java. In search of support, Mataram formed an alliance with the VOC in March
    1677. His successor, Amangkurat II, renewed this alliance, promising the VOC for
    their campaigns on Mataram''s behalf. Although Amangkurat II was able to defeat
    Trunaya, his kingdom was left with a heavy debt as their treasury, which the Sultan
    had hoped to recover from Trunaya, was looted by the VOC and Mataram''s soldiers.
    Unable to pay up, Amangkurat II ceded Semarang to the Dutch in 1682. On top of
    this, he awarded the VOC a monopoly on the import of textiles and opium into Mataram
    and the purchase of sugar from the Sultan. On 5 October 1705, Semarang was signed
    off as the VOC''s territory in exchange for the Sultan''s entire debt.


