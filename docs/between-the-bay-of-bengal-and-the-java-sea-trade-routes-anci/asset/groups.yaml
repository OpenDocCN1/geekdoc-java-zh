    166 · Between the Bay of Bengal and the Java Sea## Expanding beyond its Borders


    A number of inscribed stones found around Palembang trace Srivijaya''s expansion
    beyond its borders. The inscriptions are in Old Malay, written in Pallava script,
    and they provide the earliest examples of the Malay language.


    The first of these stone inscriptions is the Kedukan inscription. Dated 682 CE,
    it records a pilgrimage undertaken by the king prior to leading a 20,000-strong
    army to victory and bringing prosperity to Srivijaya. Although the king is not
    identified by name, he is likely to be Sri Jayasana, who endowed a public park
    at Talang Tuo in 684 CE, as evidenced by another inscription found nearby, about
    5 kilometres northwest of Bukit Sepuntang.


    A particularly significant inscription related to Srivijaya''s formative years
    is the Sabukingking or Telaga Batu inscription. Discovered at Sabukingking, located
    south of a pond known as Telaga Batu, the stone inscription administers a master
    sumpah ("eat an oath"), a pledge of allegiance to the king. Carved at the top
    of the stone are seven naga (serpent) heads, over which water would have been
    poured as part of the ritual. The water would run down the inscription – which
    specifies that curses will befall those who betray the king while blessings will
    be received by those who remain loyal – and collect in a waterspot at the base
    of the stone. The person taking the oath would drink this water, expecting to
    be poisoned if he ever broke the oath. The oath was administered to a large segment
    of the populace, suggesting that the stone was erected during a period of unrest,
    possibly a war brought about by the military unrest mentioned in the Kedukan Bukit
    inscription.


    Abbreviated forms of the Sabukingking oaths have been found elsewhere in South
    Sumatra, at Karang Brahi (upper Jambi), Bukit Seguntang (Palembang), Boom Batu
    (Palembang), Kota Kapur (Bangka), Bunkuk (Lampung), and Palas Semah (Lampung).
    The Kota Kapur inscription dates to 686 CE, however all other inscriptions are
    believed to have been from around the same period. These were the formative years
    of Srivijaya, when the king was consolidating control.


