    # Entrepôt Trade


    Singapore''s high labour costs and poor soil conditions made it uncon to large-scale
    plantations. The exceptions were gambier and pepper plantations, which thrived
    for a few decades. Neither did Singapore produce goods for export. One of the
    Peranakan Chinese who migrated to Singapore from Melaka brought with them a technology
    invented in Melaka for producing pearl sago. This became popular, as sago was
    a staple in the archipelago, especially in the eastern islands. It was also exported
    to India and Europe.


    What really sustained Singapore, however, was entre trade. Ships from all parts
    of the world arrived in port daily. European square-rigged vessels, junks, Malay
    and Bugis perahu and sampan-pukat mingled with one another, painting a lively
    scene. These ships brought to Singapore the varied produce of the archipelago
    and beyond, including Australia, Britain, China, Europe, India, North America
    and West Asia. At the port were found rice, gambier, sugar, coffee, tobacco, cotton,
    woollens, raw silk, coarse chinaware, porcelain, firearms, steel, copper sheathing,
    alum, ironware, tin, gutta-percha, timber, coal, antimony, tortoise shells, mother-of-pearl
    shells, birds'' nests, wax, sharks''


