    up by the Dutch East India Company, which came tohrauk-U mainly to purchase rice
    and slaves.


    Slave trading was prevalent throughout Southeast Asia as labour was a scarce commodity.
    Europeans quickly learnt the difficulty of hiring labour at ports and the high
    costs involved in doing so. Slave labour was the alternative. Rakhine and Portuguese
    mercenaries took advantage of the fact that Bengal was a vassal of Rakhine and
    mounted regular slave raiders, especially around the Chittagong area. The captives
    were brought to Mrauk-U, where a quarter of them would be gifted to the palace.
    The Dutch, for example, bought the slaves for their plantations and shipyards
    in the Indonesian islands.


