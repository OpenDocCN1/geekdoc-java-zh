  - '[PAGE 200]


    dynasty in the region, which lasted until 770, before it was taken over by the
    Mahayana Buddhist Sailendra Dynasty.


    King Sanjaya, a just ruler, was well-versed in holy scriptures, martial arts and
    military strategy. His kingdom, Mdang Bhumi Mataram (Medang in the Land of Mataram),
    was an agrarian state state that relied heavily on rice farming. The volcanic
    soils of the Kedu Plain were fertile fields. Rivers and canals were integrated
    into a sophisticated system to irrigate the rice fields. Paddy storage facilities
    and warehouses increased Mataram''s handling capacity for trade. In the meantime,
    many neighbouring trading ports were outgrowing their food production capabilities
    and increasingly dependent on imported rice. These factors secured Mataram''s
    role as the rice bowl for the region between the 8th and 10th centuries.


    As part of the Ancient Mataram Empire, the village of Praha strengthened itself
    as one of the many harbours consolidating the rice supply from the hinterland,
    although it remained overshadowed by prominent neighbours such as Jepara and Tegal.


    From the 9th century onwards, safflower and pepper from India were also planted
    in the kingdom as cash crops. Together with rice, these agricultural commodities
    were traded for gold, silver, ceramics, iron goods, lacquerware, cotton, silks,
    damasks and cinnabar, as well as raw materials to supply its domestic ceramic,
    textile and metal industries.


    Politically stable and extremely wealthy from its rice trade, the Ancient Mataram
    Kingdom was able to'
  - '[PAGE 201]


    channel its resources towards the construction of monuments – some as symbols
    of its rulers'' divine powers and some as spiritual focal points. The Borobudur,
    Prambanan, Rorojongrang, Mendut, Kalasan, Pawon and Sewu temples are among the
    structures built by the Mataram kings. Mataram grew to become a centre for Buddhist
    studies, led by Sanskrit-literate priests.


    Continuous violous sedimentation along Pragota and the volcanic eruption of Mount
    Merapi around 1000 CE forced Mataram''s ruler, King Sindok, to move the centre
    of his government to East Java, at the estuary of the Brantas River, after which
    the kingdom slowly disappeared.


    It wasn''t until the arrival of Admiral Zheng He with his treasure fleet of 62
    ships, 225 vessels and sailors in 1406 that detailed descriptions of the area
    reappear in the records. Tasked with expanding China''s trading network on behalf
    of the Ming court, Zheng He carried out seven expeditions between 1405 and 1433,
    visiting more than 37 kingdoms, including Palembang,


