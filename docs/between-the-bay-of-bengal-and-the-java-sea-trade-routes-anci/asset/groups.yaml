    - Capitals of the Rakhine Kingdom (in sequence): Dhanyawadi, Vesali, Sambawak
    and Pyinsa, Parein, Hkrit, (reoccupied), Nareinzara Toungoo, Launggret, and Mauk-U.


    They prospered well for Mauk-U, as its enemies — Inwa and Bago — were stronger.
    Thus, in 1430, Mauk-U became the capital of the Rakhine Kingdom. Rakhine (Arakan)
    is a narrow strip of land stretching along the eastern arc of the Bengal. The
    Arakan mountain range acts on its east while the Naf River acts as its northern
    border. It is a state in the Republic of Myanmar. For most of its history, with
    its authority extending to east Bengal (now Bangladesh). Its capitals were located
    to the northeast, within the flood plains of the Kaladan and Lay Mio river valleys.


    Rakhine was wealthy, making it a target for attacks. Its kings ruled from within
    fortified cities. Brick walls surrounded the cities, while moats provided an extra
    layer of protection. These cities were self-sustaining, with an economy based
    on wet rice cultivation and taungya (slash-and-burn) agriculture. The first urban
    site was Dhanyawadi, which means “grain-blessed”, an apt description for a territory
    with high yields of paddy. Dhanyawadi was also the original site of the Mahamuni
    Buddha, a statue said to bear an exact resemblance to Gautama Buddha. Vesali replaced
    Dhanyawadi in the 6th century and in 1018, Sambawak became the first of five capitals
    on the banks of the Lay Myo River. Launggret, the last, was replaced by Mrauk-U.


    Mrauk-U’s picturesque aspect relied on its strong security. Walls and moats filled
    the gaps between natural barriers provided by mountains and tidal rivers. Forts,
    built on mountains, supplemented the city’s defenses. From the eastern border,
    roads led across the mountains into Myanmar. All traffic coming into the city,
    brought by these mountain roads, was monitored by sentried gates.


    The king’s power rested on his ability to ensure the material well-being of his
    subjects. This was tied to good harvests, which, in turn, required good water
    management. Large water tanks captured and stored rainwater, sustaining the city
    during dry spells. A network of streams and canals provided irrigation. The streams
    also served as waterways on which boats served large and small peddling, provisions
    and sundry commodities. These floating markets lent charm to the city, as did
    artificial lakes that supplied the general populace with fresh water. Beautiful
    as they were, the lakes served a darker purpose. In the event of an enemy attack,
    the sluice gates could be opened, releasing the waters to drown the invaders,
    while the people of Mrauk-U kept safe in citadels and inner hillocks.


    - Laymaythnar Pagoda, built by King Min Min Saw Mun. It is square in plan, with
    four entrances, corresponding to the cardinal points. Its design is similar to
    the Laymaythnar Pagoda in Bagan. Eight Buddha statues sit in an octagonal formation
    at the centre of the pagoda.


    - View of Kaladan River, Mrauk-U''s chief waterway, seen from Uriteataung Pagoda.
    The pagoda houses a skull relic of Gautama Buddha and holds a special place in
    the hearts of the Rakhine people. It is located opposite Ponnagagun, a naval base
    during the Mrauk-U period.


    - Sakya Man Aung Pagoda. Engraved on the front entrance are replicas of silver
    coins used in Rakhine from the 5th century. The obverse side of the coin is on
    the right-hand side of the entrance. It depicts a recumbent bull beneath the king''s
    name. The reverse side of the coin has a Stupa of wealth. In order to traders
    of different cultures and religions to Mrauk-U, the coins borrowed from their
    powerful neighbours, during the time when the Bengal Sultanate was powerful, the
    kings of Rakhine started using Islamic titles. Coins, which hitherto borne their
    names, started including the Kalima, the Muslim declaration of faith, in Persian
    script.


    Lying between the Kaladan and Lay Myo rivers, Mrauk-U was in a position to control
    movement on both ways. Two separate ports handled the traffic on these rivers:
    Aungdat on the Kaladan, and Paungdok on the Lay Myo. It was the Kaladan, though,
    that was the main transportation highway bringing foreign ships from the Bay of
    Bengal. A customs checkpoint was located near the mouth of this river, and a naval
    base, at Ponnagagun was established about 30 kilometres from the river mouth.
    A visitor going to Mrauk-U today can take a boat from Sittwe and follow this same
    route. Depending on weather conditions, Mrauk-U became the most powerful in the
    region. When Min Bin became king in 1531, he turned his sights on Bengal. Mrauk-U''s
    success in occupying Bengal heralded the golden age of Rakhine. By the late 16th
