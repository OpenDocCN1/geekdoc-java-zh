    Chinese boats raced to greet the junks and escort them into harbour. Much of the
    trade was conducted on the junks themselves, with their wares spread out on deck
    and local Chinese competing with one another to pur- chase the waves.


    Interestingly, the biggest cargo arriving from China was people, brought in labour
    for mining settlements. Annually, around 6,000–8,000 Chinese immigrants arrived
    in Singapore. Around one-eighth of these remained on Singapore while the rest
    dispersed mostly to the tin mines of Bangka and the Malay Peninsula, the gold
    mines of Pahang and the west coast of Borneo. By July 1845, the Chinese made up
    56 percent of the total population of Singapore and, by 1867, this figure had
    grown to 75 percent.


    ▼ The British used the Singapore Strait, Located south of Pulau Blakang Mati (Sentosa
    island), when they first sailed to Singapore. The strait between mainland and
    Johor/ Pulau Blakang was not known to. Farquhar noticed it in August 1819, but
    it was not until 30 years later that it was properly surveyed and developed. With
    deep water to shore, it was suitable for large ships. New Harbour was completed
    in 1886 and renamed Keppel Harbour in 1900.


