    centre from Banten Girang to Banten on the coast and instructed his son to build
    a brick-walled city over the existing harbour, complete with artificial reservoir
    drainage and aqueducts. Only Muslim locals were allowed to reside within the fortified
    city, which was divided into several strictly guarded villages led by nobleman
    whose power depended on the number 200–2,000 slaves they owned. Each village housed
    200–2,000 people, who lived in dwellings made of bamboo or coconut lumber. Foreigners
    settled outside the walls, along the shore – Muslims on the northeast, non-Muslims
    along the west. They were largely of the merchant community, each headed by their
    own representatives.


    Maulana Hasanuddin, who married the Princess of Demak, was installed as the first
    independent sovereign of the Banten Sultanate in 1522, ruling as Panembahan Surosowan
    from his palace, Kraton Surosowan. A rectangular rock stone as Watu Gigilang,
