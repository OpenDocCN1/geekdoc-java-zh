    Rakhine derived its wealth from rice production. Heavy rainfall coupled with good
    water management practices ensured it always had a surplus of the staple crop.
    This attracted traders, especially from drought-prone states in India, who sailed
    up the Kaladan. Mrauk-U was established at a time when maritime trade in Southeast
    Asia as a whole was seeing unprecedented growth. With rice as the backbone of
    the kingdom''s economy and a strong navy protecting its waters, Rakhine''s rulers
    were able to develop Mrauk-U into a key node in the trading network that came
    to pass the world of Southeast Asia.


    By the 15th century, it had become an important entrepot. At Mrauk-U was found
    pepper, camphor, nutmeg and cloves from the Indonesian islands, as well as cotton,
    muslin and copper from the Indian subcontinent. From nearer home came lac, teak
    and horses. From Ava came gemstones, which were then polished by skilled artisans
    available at Mrauk-U. With all these products obtainable at one location, many
    traders from the Middle East and India opted not to travel to Melaka for spices
    or to Bago for gemstones, horses and teak. Instead, they cong at Mrauk-U, attracted
    by its duty-free status. Docking at Mrauk-U were ships from Jakarta, Melaka, Aceh,
    Martaban, Bago, Bengal, Kalinga, the Coromandel Coast, Sri Lanka and the Middle
    East.


    With so many foreign ships docking at Mrauk-U, it took on a cosmopolitan flavour.
