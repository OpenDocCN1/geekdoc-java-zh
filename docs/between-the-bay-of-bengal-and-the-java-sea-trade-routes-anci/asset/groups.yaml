    have loaded their ships with cloves and nutmeg. These two coveted spices grew
    exclusively on the islands east of Bali – cloves on the Maluku islands, especially
    on Ternate and Tidore, and nutmeg on a small group of volcanic islands in the
    Banda Sea. The spices came to be in such great demand that in the 17th century,
    in an attempt to control the trade, the Dutch took control of these islands, massacring
    the Bandanese in the process.


    That these spices made their way to South Asia in early times is evidenced by
    the remains of a carbonised nutmeg dating to around 400–300 BCE found in eastern
    Uttar Pradesh and another piece dating to around 100–300 CE found at Sanghol and
    found at Mantai in Sri Lanka, for cloves, the earliest specimen, has been dated
    to around 900–1100 CE; however, its earliest mention goes much further back, to
    the 3rd century BCE, when the Han emperor required anyone addressing him to hold
    a clove in his mouth.


    Surprisingly, in spite of the close trade relationship between Bali and South
    Asia, the only known mention of Bali in any Indian text is in the Manjusrimrimulakalpa
    (c. 800 CE), which discusses the languages of Bali and other islands of the Eastern
    seas.


    ## Foreign Trade


    The sea off Bali’s northern coast is deep, with sheltered bays, which allowed
    port-settlements such as Sembiran and Pacung to develop. Sembiran stretches from
    the coast to the mountains, while Pacung lies on a narrow strip of land between
    the sea and the mountains. Archaeological excavations at both locations yielded
    many foreign products, indicating that northern Bali was an important stopover
    within the maritime trading network that linked India with China. Traders from
    the region, especially Java and Sumatra, brought products such as tin and copper
    to Bali to be exchanged for spices. The Balinese ports were also able to entice
    traders from South Asia as early as the first few centuries BCE.


    A human tooth at Pacung, dated between 340 BCE and 20 BCE, has been very revealing.
    The owner of the tooth consumed a terrestrial diet, in contrast with the Balinese
    diet of predominantly marine. The hypothesis that the tooth belonged to a foreigner
    is supported by mitochondrial DNA analysis, which has revealed a northeast Indian
    ancestry. Indeed, a follow-up study on modern Balinese men suggests genetic intermingling
    between South Asians and indigenous Balinese.


    Along with the tooth, a large number of shards of Indian rouletted ware were found
    at the Pacung site. These distinctively decorated ceramics were possibly the earliest
    goods exchanged between South Asia and Southeast Asia. They have been found in
    many Southeast Asian sites including Sumatra, Java, Bukit Tengku Lembu in Malaysia,
    and Vietnam – all dating to the 3rd century BCE and the 3rd century CE. The finds
    at Semibiran and Pacung, comprising mostly objects for daily use, constitute the
    largest collection of these ceramics found in Southeast Asia.


