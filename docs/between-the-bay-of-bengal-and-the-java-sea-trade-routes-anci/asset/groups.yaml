    THE ANNUAL BALI YATRA (“Voyage to Bali”) festival in Odisha, India, sees gaily
    painted miniature boats, made of paper or dried banana tree bark and carrying
    oil lamps or candles, floating on the rivers, lakes and seabores. This unique
    festival, with roots that go back more than 2,000 years, is celebrated on Kartik
    Purnima, the day of the full moon in the month of Kartik (October/November). It
    marks the onset of the northeast monsoon, when mariners would leave Kalinga (as
    Odisha was formerly known) to make the voyage across the Bay of Bengal to other
    islands of the Indonesian archipelago. In those days, the festival supplicated
    the merchants'' safe journey; today it continues to be celebrated in commemoration
    of Kalinga''s maritime heyday.


    ▲ A paper boat floated in Odisha during Kartik Purnima. Today the Bali Petra has
    become associated with the weekly trade fair in Cuttack, Odisha. However, the
    full moon is still celebrated by floating lighted boats. This festival supported
    the merchants'' safe journey to Southeast Asia at the onset of the northeast monsoon,
    the Khudurukuni Osha festival celebrated their return with the southwest monsoon
    around September, and it too continues to be practised.


    The intrepid mariners of Kalinga, on arriving at the island of Bali, would have
    docked at one of its two major ports, Sembiran and Pacung. Here, they would


