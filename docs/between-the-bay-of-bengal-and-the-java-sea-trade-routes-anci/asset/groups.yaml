    亚洲对中国来说是新奇的——犀牛角、翠羽羽、龙血（从各种藤类植物中获得的红色树脂）——中国人热烈地将其视为“珍宝”。


    在早期政策中，最重要的之一是坎托利（Kantoli），被认为位于占比（Jambi）和士民兰（Palembang）之间的某处。它最早出现在公元44年的中国记录中。《梁书》了502年坎托利统治者的一个梦。在梦中，一位僧侣告诉统治者，如果他向中国派遣贡品，将为坎托利带来繁荣。这凸显了中国贸易对东南亚海洋贸易政策的重要性，因为它们的财富与中国市场的需求紧密相连。中国记录中最后提到坎托利是在563年。它的消灭可能与中国的一个弱弱朝代——公元557年至589年间的南朝有关。


    室齐腊（Srivijaya）在早期王国建立的贸易联系和联盟的基础上，于7世纪崛起成为苏答腊岛领先的王国。它位于全长750公里的穆西河（Musi River）上，使其成为象牙、胡椒、藤条、香料和没药等产品的集散中心，这些产品从其后陆沿河运下。产品远达德波山（Mount
    Dempo）和靠近米河源头的帕塞马赫高原。河流网络也为本肯古鲁（Bengkulu）省开采的黄金提供了运输。室齐腊则向其后陆供应铁、盐、布料和珠子等产品。


    - ▲ 没药（Styrax benzoin），也称为安息香。这种苏答腊产品在中国市场替代了乳香没药。

    - ▲ 一小袋胡椒（Piper nigrum）。


    166 · 在孟加拉湾与爪哇海之间## 扩张至边界之外


    在士民兰周边发现的许多铭文石追溯了室齐腊向边界之外的扩张。这些碑文是古马来语，用波罗拉瓦文字（Pallava script）书写，是马来语最早的例子。


    这些石碑中的第一个是杜肯甘布基特碑文（Kedukan inscription）。它日期为公元682年，记录了国王在带领两万大军赢得胜利并为室齐腊带来繁荣之前的一次朝圣。虽然没有说明国王的名字，但他可能是斯里·杰亚萨纳（Sri
    Jayasana），正如另一块在附近布庞当山（Bukit Sepuntang）西北约5公里处的碑文所证明的，他在684年在塔朗图奥（Talang Tuo）捐建了一个公园。


    与室齐腊形成时期一个特别重要的碑文是萨布库金金（Sabukingking）或特拉加巴图（Telaga Batu）碑文。该碑文发现于萨布库金金，位于名为特拉加巴图的池塘南方，该石碑执行一种主誓（master
    sumpah，“吃誓”），即对国王的效忠誓言。石头的顶部刻有七个那伽（蛇）头，仪式时会向其上方倒水。水会流过碑文——碑文规定背叛国王的人将降临诅咒，而忠诚的人将获得祝福——并聚集在石底的一个水槽中。宣誓的人会喝下这些水，期望如果他违背誓言就会中毒。这种誓言面向大部分人口，表明该石碑是在动荡时期建立的，可能是由杜肯甘布基碑文中提到的军事动荡引发的战争。


    萨布库金金誓言的简写形式在南苏答腊的其他地方发现，分别位于卡朗布拉希（上占比）、布吉松当山（士民兰）、布姆巴图（士民兰）、科塔卡普尔（邦加岛）、崩库克（灯笼）和帕拉斯塞马（灯笼）。然而，科塔卡普尔碑文的于公元686年，但所有其他碑文均被认为来自同一时期。这些是室齐腊的形成时期，当时国王正在巩固统治。


    士民兰：室齐腊所在地 · 137


