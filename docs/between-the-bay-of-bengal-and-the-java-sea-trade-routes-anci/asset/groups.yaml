    万丹：胡椒王国 · 189


    ![](img/c3e5c3015b89799ae52d8dae1158f750_190_0.png)


    今日德马勇村（Demayon）帕恰南提清真寺（Masjid Pacinan Tinggi，即上中国街）宣礼塔遗址，据说是由苏南·古努朱加蒂（Sunan Gunungjungati）建造并由穆拉纳·哈桑苏丁（Maulana
    Hasanuddin）扩建的。前景是一个始于1843年的中国墓。


    1625年的人口以及1626年马塔兰的进攻。在建立清国的满洲人于1645年实施海禁，禁止私人船只出海并出口贵重商品后，万丹与中国的胡椒贸易开始减少。


    幸运的是，万丹在苏丹·阿根格（Sultan Ageng，名Abdulfatah Agung）1651年至1684年的统治下恢复了活力，他成功地利用农业、贸易和海洋优势发展了万丹。阿根格苏丹和且开放领土政策吸引了来自世界各地的商人，将万丹变成了一个国际大都市。万丹港口得到了扩大，包含了西班丹河（Cibanten
    River）三角洲西侧的国际港口和东侧名为卡兰图图（Karangantu）的当地港口。


    修建了街道和运河以方便万丹的运输，将海湾与城市及内陆连接起来。1661年建造了两道海堤以防止泥沙沉积。挖掘了灌溉渠为万丹的椰子和甘糖种植园供水。


    英国、荷兰、法国、丹、中国、布吉、望加锡、爪哇、苏门答腊和巴厘人的定居点出现在城市堡垒之外。阿格苏丹是一位公正的统治者，宽容其他宗教，允许在这些定居点建造教堂和寺庙。他的几位大臣是外国人，尽管他们都是穆斯林。其中三位杰出人物是首相凯·阿里亚·曼贡贾亚（Kiai
    Arya Mangunjaya）、经济顾问凯·纳贝希·凯斯图（Kiai Ngabehi Kaystu）和建筑师凯·纳贝希·恰克拉达纳（Kiai Ngabehi
    Cakradana，即Tantsekolo），他们都是华裔。特别是恰克拉达纳深度参与了万丹城的规划和建设。


    效仿欧洲舰队，阿格苏丹建立了一支强大的舰队师，并与波斯、泰国、印度、越南、中国和菲律宾进行远程贸易。通过与英国、葡萄牙和马来人等方的合作，万丹舰队直接交付客户。


    与此同时，万丹苏丹继续扩张版图，于1661年获得兰达（Landak），于1677年获得里井汶（Cirebon），成功反对了荷兰东公司（VOC）向这些地区的扩张。尽管在1636年和1645年与荷兰签署了停火协议，但与巴达维的冲突仍在。为了防御万丹，每个居民被命令沿爪哇翁通河（Java
    Ontong River——万丹与巴达维之间的边界）种植1000棵椰子树，堡垒配备了欧洲大炮。


    万丹：胡椒王国 · 191


    双方战争在1656年爆发，直到1659年签署临时和平协议才结束。由于提防荷兰间谍，阿根苏丹及其随从大臣于1671年从城市堡垒撤到位于市东北部15公里的尔塔萨（Tirtasa）私人宫殿，在那里他还建造了永久性的砖结构建筑，这在当时的爪哇是罕见的。万丹的治理权交给了他的儿子皇储哈吉（Crown
    Prince Haji，名Abu Nasr Abdul Kahhar）。


    哈吉对万丹的华人怀有不满，认为他们拥有比父亲过多的特权。由于于与万丹建立更亲密的关系并希望对行政拥有更多控制，他剥夺了恰克拉达纳的职位并将并将首相凯·阿里亚·曼贡贾亚流逐至兰榜的塞曼卡（Semangka），随后他被杀死。阿根苏丹得知消息后大发雷霆，强行放逐哈吉并任命他的小儿子为继承者。


    阿根苏丹于1680年向荷兰宣战，以荷兰东公司虐待万丹人的事件为借口。正当巴达维被包围时，哈吉对他发起了政变，并将老苏丹禁在尔塔萨宫殿。然而，发现自己被父亲的追随者包围，且缺乏穆斯林精英的支持，哈吉转而利诱荷兰东公司，签署了一份将万丹屈服于荷兰东公司的合同。长期条款包括向荷兰东公司支付60万里亚尔、将里井汶让给公司、以及排除其他欧洲人的贸易


