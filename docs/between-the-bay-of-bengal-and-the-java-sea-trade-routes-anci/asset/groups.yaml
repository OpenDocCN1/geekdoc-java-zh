    # 马甲


    国际化大市


    作为15世纪著名的转口港入口，马甲俯落在圣保罗山，当时马甲苏丹的皇宫和清真寺在山上非常显眼。


    > “人们无法估量马甲的价值，由于其规模和利润，马甲是一个为了贸易而存在的城市，比世界上任何其他地方都更合适：它是季风的结束也是另一个季风的开始。马甲被围绕并处于中心位置，方圆英里不同国家间的贸易和商业必须经过马甲……谁掌握了马甲就抓住了威尼的咽喉。”


    —— 汤·皮雷斯（Tomé Pires），《东方志》

