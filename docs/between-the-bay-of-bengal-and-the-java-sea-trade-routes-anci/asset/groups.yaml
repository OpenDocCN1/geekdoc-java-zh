    The opening of the Suez Canal in 1869 accelerated the switch from sail to steamships.
    A steamer could make three voyages a year between Europe and the Far East as compared
    to a single trip previously. It marked the end of the fast clippers, which tended
    to zoom between India and China, bypassing Singapore unless they had to pick up
    supplies such as fresh water. The opening of the Suez Canal conferred importance
    on Singapore’s strategic position. Its safe anchorage and good berthing facilities
    ensured it was the preferred port of call. Today, it counts among the largest
    and busiest ports in the world.


