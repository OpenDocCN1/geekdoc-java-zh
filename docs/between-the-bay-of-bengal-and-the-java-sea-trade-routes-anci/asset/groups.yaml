  - '[PAGE 49]


    came religious influences, especially from northeast India. Indian religions came
    to be practised alongside the worship of indigenous spirits known as nat. Theravada
    Buddhism prevailed during the Mrauk-U period and, consequently, Merauk-U forged
    a closer relationship with Sri Lanka. In fact, the newly founded Merauk-U Kingdom
    was legitimised as a Buddhist kingdom after Min Khari, the second king of the
    Merauk-U dynasty, sent a mission to Sri Lanka in 1439. Henceforth, Merauk-U started
    looking towards Sri Lanka as the source of its religious practices and texts.
    The exchange of priests and ideas further strengthened the ties between the two
    countries.


    Evidence that Merauk-U harboured a flourishing entrepot is barely discernible
    today. The canals that earned it the label "Venice of the East" are also long
    gone. However, glimpses into its ancient past can still be caught in the numerous
    pagodas glimmering in its skyline. The kings of Rakhine built many religious structures
    to obtain merit. Consequently, Merauk-U abounds in pagodas, stupas and temples.
    Made of sturdy stone, these structures have survived the centuries, their carvings
    and statues providing invaluable insights into Merauk-U''s history. Among the
    earliest of these edifices is the Laymathnar Pagoda, built by King Min Saw. It
    is square in plan, with four entrances, each corresponding to a cardinal point.


    Perhaps the most important pagoda in is the Shitthaung, built by King Min Bin
    in 1536 to commemorate his conquest of Bengal. It holds 84,000 images of Buddha
    and depictions of his previous lives.


    ![](img/c3e5c3015b89799ae52d8dae1158f750_49_0.png)'
