    此外，佛教文化使得吉打南部成为中国僧侣在往返印度的航途中等待季风风向变化的理想之地。


    尽管考古学为定居点及其贸易活动提供了良好的见解，但古古吉打的政治结构仍不确朗。古代文献（尤其是阿拉伯文献）中提到了王国，但这些尚未通过考古证据证实。中国和阿拉伯文献表明，吉打南部隶属于室里齐王朝（Srivijayan）的主权，是室里齐王朝曼荼罗（mandala）体系内的一个重要港口。这一点得到了吉打未向中国派遣任何使团的事实（公元
    638 年可能是一个例外），这意味着它并不是一个独立的政治政体。1025 年朱罗王朝对室里齐港口的袭击重塑了吉打南部的文化，使其转变为以印度教为主的文化。


    随后，随着伊斯兰教的传入和海上活动的衰落，吉打南部的古代文化被遗忘了。然而，它的遗迹激发了 18 世纪或 19 世纪一位无名作者创作史诗《梅龙马瓦旺萨传》（Hikayat
    Merong Mahawangsa）。梅龙马瓦旺萨是被派往鲁姆苏丹国（1077–1308 年，现今土耳其）的使者，负责协商国王儿子与中国皇帝女儿的婚事。他在陪伴王子前往中国途中，船只遭遇风暴并在马来半岛西岸失事。梅龙马瓦旺萨在风暴中与王子失散，他自封为所在土地的国王，建造了堡垒和宫殿，并将该国家命名为吉打。


