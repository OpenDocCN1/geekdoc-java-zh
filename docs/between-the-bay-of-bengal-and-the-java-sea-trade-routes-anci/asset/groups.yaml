    of the bowl is a 4x4 magic square encircled with the phrase “There is no hero
    except Ali and there is no sword except Zulfiqar”. Ali referred to Ibn Abi Talib,
    the son-in-law of Prophet Muhammad, and “Father of Sufism”. The bowls were used
    in the Islamic world as a talisman to ward off bad luck and illnesses.


