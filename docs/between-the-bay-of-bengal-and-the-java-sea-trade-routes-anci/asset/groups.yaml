    ## Entrepôt Trade


    Singapore''s high labour costs and poor soil conditions made it unsuitable to
    large-scale plantations. The exceptions were gambier and pepper plantations, which
    thrived for a few decades. Neither did Singapore produce goods for export. One
    of the Peranakan Chinese who migrated to Singapore from Melaka brought with them
    a technology invented in Melaka for producing pearl sago. This became popular,
    as sago was a staple in the region.


    What really sustained Singapore, however, was entrepôt trade. Ships from all parts
    of the world brought goods to port, especially from China and Europe. In contrast,
    Dutch-controlled ports levied both import and exports taxes; higher taxes were
    levied on foreign ships opting to stop in Singapore. Unlike Dutch ships and ports,
    Malay and Bugis *perahu* smuggled goods between Singapore and Dutch ports. Javanese
    coffee, a monopoly of the Dutch, was smuggled out of eastern Java and found its
    way to Singapore via Bali. Likewise, opium was smuggled into Java.

