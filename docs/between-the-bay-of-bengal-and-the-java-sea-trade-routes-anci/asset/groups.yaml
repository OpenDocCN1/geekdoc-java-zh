    Kyai Arya Mangunjaya, economic adviser Kyai Ngabehi Kaystu and architect Kyai
    Ngabehi Cakradana (Tantsekolo), all of Chinese origin. Cakradana, in particular,
    was highly involved in the masterplanning and construction of Banten city.


    Taking his cue from the European fleets, Sultan Agung built a strong armada and
    traded long-distance with Persia, Siam, India, Vietnam, China and the Philippines.
    In partnership with other parties such as the British, Portuguese and Malays,
    Banten’s fleet delivered directly to customers.


    At the same time, the Sultan of Banten continued to extend his rule, acquiring
    Landak in 1661 and Cirebon in 1677, successfully opposing the VOC’s expansion
    into those areas. Truce treaties were signed with the Dutch in 1636 and 1645,
    but conflict with Batavia continued notwithstanding. To defend Banten, each inhabitant
    was ordered to plant 1,000 coconut trees along the Java Ontong River – the border
    between Banten and Batavia – and the fortress was equipped with European artillery.


