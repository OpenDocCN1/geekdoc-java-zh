    年间统治，据说他是第一个皈归伊斯兰教的统治者。根据《梅龙马瓦旺萨传》，他在皈依前名为 Phra Ong Mahawangsa，居住在 Bukit Meriam。


    《梅龙马瓦旺萨传》声称记录了吉打统治者的谱系。然而，它并不是历史著作。相反，这位无名作者编写了一个富有想象力的叙事，将历史事件与民间传说融合，并将古代建筑遗迹作为叙述焦点。例如，他显然比他的时代早
    1000 多年就了解该地区的地理情况。在书中，他提到一个名为 Pulo Srai（吉莱山）的大岛正与大陆相连，海水退缩导致了新陆地的形成。19 世纪 60
