    Chinese ceramics, shows the burgeoning trade between the Middle East and China
    during the Tang period. The earliest records by Arabian geographers that mention
    Southeast Asia date to the 9th century, although Arab traders could have been
    visiting the region prior to that.


    In 1025, the Chola Kingdom of South India launched raids against Srivijaya, weakening
    the kingdom and loosening its hold on its vassal states. This raid could have
    been partly instigated by Tamil merchant guilds who had felt hampered by Srivijayan
    merchant control of the trade lanes to China. In South India, merchant associations
    such as Manigramam and Ainnurruvar had developed product-based monopolies and
    become powerful through their large networks and private armies. The first evidence
    that these Tamil merchant guilds expanded their activities to Southeast Asia comes
    from a 9th-century inscription found at Takua, a port on the west coast of southern
    Thailand. Seven other Tamil inscriptions – in Southeast Asia and in China – date
    to the Chola attacks, pointing to expanded Tamil presence and influence in the
    region.


    The last days of Srivijaya were marked by the liberalisation of Chinese markets
    during the Southern Song, which saw the Chinese getting directly involved in maritime
    trade and Chinese traders coming to Southeast Asia in large numbers. This direct
    Chinese involvement possibly contributed to Srivijaya''s demise. By the 13th century,
    which coincided with the demise of the Chola Kingdom, Chinese traders had more
    numerous than their Indian counterparts in Southeast Asian ports.


    New Chinese trade products started making their way into Southeast Asia. Chinese
    coil glass beads, for example, only entered the Southeast Asian bead market during
    the Southern Song period. They replaced the Indo-Pacific bead industry, which
    had collapsed with the demise of Srivijaya. In appearance, size and color, the
    Chinese monochrome coil beads are similar to the Indo-Pacific beads, but compositionally,
    Chinese beads are high in lead and barium, which makes them heavier.


    The demise of Srivijaya saw the rise of Java. Srivijaya had tightly controlled
    the ports through foreign traders, but now foreign merchants—Indian, Chinese and
    Middle Eastern—started to travel directly to the Java sea, stimulating the growth
    of ports on the northern and eastern coasts of Java. These ports controlled the
    flow of spices from the eastern Indonesian islands. Spices had become among the
    most important trade items exported from the archipelago to international markets.
    Foreign goods including ceramics, textiles and iron arriving at the Javanese ports
    were taken to the hinterland and traded for local produce, especially rice. Javanese
    traders took the rice together with Indian textiles and exchanged these for spices
    at the eastern islands. The spices were brought back to the ports and exchanged
    for foreign goods, restarting the cycle.


    The importance of eastern Java in the trading network gave rise to Majapahit.
    This kingdom was established in 1293 by Raden Yuan Wijaya (Kertaraj) after he
    succeeded in warding off an attack by the Mongol Yuan Dynasty. In contrast to
    politics in Southeast Asia, which were established at ports, Majapahit was centred
    at the inland town of Trowulan. It was served by two ports – Surabaya, a seaport,
    and Cangguru, a river port – were 42 kilometres apart and connected by the Brantas
    River. Cangguru located close to Trowulan, became Majapahit’s primary gateway
    to the coast. Rice was the main product from Java’s hinterland and it was brought
    to Trowulan to be exported via Canggu. Roads were building Trowulan to regions
    connected by river, giving rise to a well-developed road system throughout the
    kingdom. Majapahit was not very effective in controlling the waters of the Straits
    region, resulting in the rise of primacy.


    Meanwhile, in Sumatra, although the centre of Malay power had shifted from Palembang
    to Jambi after the Chola attacks, Sumatra ceased to be an important player in
    the regional trade after the 13th century. The island’s northern coast, however,
    became active thanks to the increased demand for Sumatra pepper. An important
    polity there between the 13th and 16th centuries was Samudra-Pasai, comprising
    the twin cities of Samudra and Pasai. The 15th-century Hikayat-raja Pasai records
    that Pasai was founded by Merah Silu and named after his hunting dog after the
    dog was scared by a deer. Merah Silu later converted to Islam, adopting the name
    Malik al-Salih. Assuming control of the northern Sumatran pepper supply, Samudra-Pasai
    became the most important centre of commerce in the Straits of Melaka at the start
    of the 15th century.


    (Note: Image captions integrated below)

    - Gajah Mada was the colourful Minister of Majapahit between 1330 and 1364. He
    famously took an oath, known as Sumpah Palapa, to abstain from the pleasure of
    eating any spiced food until he succeeded in unifying Nusantara, a word that loosely
    denotes the Southeast Asian archipelago.

    - Birds-of-paradise are found on the Papuan and Aru islands of Indonesia. They
    were hunted for their beautiful plumage and brought to the island of Serum in
    eastern Indonesia, where they were prepared for export. They were traded in ports
    along the Java Sea as far back as the first millennium and exported to China,
    India and the Middle East.

    - An artist''s impression of a shipwreck carrying Chinese ceramics. Timber ships
    disintegrate over time, leaving behind their ceramic cargo, which defy time. As
    the styles of Chinese ceramics have changed over time, they can be dated to specific
    time periods, making them time markers.

    - Statue of Gajah Mada at Tasik Warna on the Dieng Plateau.

    - Candi Tikus was a bathing place located in Trowulan; it represents the Mahameru
    mountain, home of the gods. Its name translates to "Rat Temple" - it was given
    this name in modern times when farmers, plagued by rats, drew water from the tank
    believing it would repel the rats.

    - A ceramic bowl for magic-medical uses dating to the 18th century. Such bowls
    were made in China for export mainly to Southeast Asia and India. In the centre
    of the bowl is a 4x4 magic square encircled with the phrase “There is no hero
    except Ali and there is no sword except Zulfiqar”.

