    - 1456 to 1498. An early nineteenth-century manuscript containing the Undang-Undang
    Laut Melaka (Maritime Laws of Melaka), a legal code governing maritime regulations,
    nautical procedures, seafaring matters, slavery, adultery, murder, debt-service,
    theft, taxes, and measures.


    News of Melaka''s wealth reached King Emmanuel I of Portugal via Vasco Da Gama''s
    expedition to India in 1497–99. After conquering Goa and Hormuz, he dispatched
    four ships in April 1508 under Diogo Lopes de Sequeira, which was initially granted
    permission to enter a trading post in Melaka when he arrived in September 1509.
    The Gujarati and Javanese merchants, wary of Portugal''s intentions to penetrate
    the spice trade, instigated Bendahara Tunun Mutahir to betray their agreement.
    Sequeira was ambushed, he was met slain in the streets, and 20 of them were captured.
    This move had catastrophic repercussions.


    Melaka''s trade was at its peak when its administration had grown weak and oppressive,
    riddled with corruption, treachery and internal power struggles, especially after
    the death of Bendahara Tun Perak in 1498. In 1510, despite the lack of evidence,
    Sultan Mahmud (r. 1488–1511) executed members of his court for treason and slander.


    In June 1511, a Portuguese armada of 17 ships and 1,200 men, led by Alfonso de
    Albuquerque, arrived off Melaka, seeking to avenge their slain countrymen and
    to rescue the 20 prisoners. Sultan Mahmud was in the midst of planning to attack
    Aru and Pasai, the only two remaining independent kingdoms along the Straits.
    Distracted and without experienced advisers, he negotiated rather poorly, at first
    refusing to release the Portuguese men without a peace treaty. He eventually set
    the prisoners free.


    > ▼ An illustration of the Portuguese arriving in Melaka in 1509. Sequeira''s
    representative, Teixeira, was led to the palace on an elephant, where he presented
    the Sultan with gifts and a letter in Arabic from King Emmanuel I.


    But he had underestimated Albuquerque, who now demanded a heavy compensation of
    300,000 *cruzados* and authorisation to build a fortress in Melaka. Sultan Mahmud
    refused, and a battle broke out.


    The entire might of the Melakan Empire was summoned. Armed forces were dispatched
    from Melaka’s dependencies — Pahang, Indragiri, Palembang and Siak/Minangkabau
    — while mercenaries were recruited from Java. The Portuguese were up against a
    total of 20,000 men, Turkish and Persian bowmen, of artillery pieces and 20 war
    elephants.


    Unfortunately, Melaka’s artillery was crude and lacked gunmen. On the 40th day
    of fighting, Albuquerque seized the town bridge and captured the city. With no
    reinforcements henceforth, Sultan Mahmud was forced to retreat to Bertam. Albuquerque
    remained in Melaka until November 1511, setting the town ablaze after ransacking
    the treasury. The Muslim merchants were massacred or sold into slavery.


    The Portuguese dispatched an envoy to China to seek recognition as Melaka’s new
    rulers, but their request was rejected. The Chinese emperor issued a decree ordering
    all other countries to assist Melaka – but none obeyed. Despite losing his capital,
    Mahmud still wielded power over the rest of his empire and established a new capital
    in Bintan, which the Portuguese razed to the ground in 1526. His counter-attacks
    failed to capture Melaka. However, his descendant, Muzaffar, became the ruler
    of Perak, while another son, Alauddin, established the Johor Sultanate.


    The Portuguese demolished Melaka''s entire royal quarter, recycling building materials
    from the mosque and palace for a new church and buildings. A fort, which they
    dubbed "A Famosa" (The Famous), was built on the site of the Sultan''s fort.


    The capture of Melaka disrupted the trade network. Merchants took their business
    to neighbouring market ports such as Aceh, Johor, Java and Banten. Eight years
    after the Portuguese took over, annual ship movements dropped from 100 to 10.
    Melaka was later conquered by the Dutch in 1641. They rebuilt and strengthened
    the old Portuguese fort, but their regulations required all Chinese junks to trade
    at Batavia rather than Melaka, reducing the town to a romantic ruin. In 1807,
    the British demolished Melaka''s fort, leaving only a small gatehouse standing.


    > A sketch of Melaka shortly after its conquest by the Portuguese. Albuquerque''s
    fort, A Famosa, completed in January 1512, was square in plan with a 120-foot-high
    donjon (keep). The original fort was heavily renovated and expanded by the Dutch
    after they took over Melaka in 1641.


    The Portuguese erased all physical evidence of the royal palace located on the
    summit of St Paul''s Hill. What is visible today are the ruins of a Portuguese
    church.


    The Musi River, a 750-kilometer long river was the lifeblood of Srivijaya. Srivijaya,
    situated in present-day Palembang, was the capital of southern Sumatra. Its location
    at the bottom of the Straits allowed it to monitor traffic between India and China
    become a powerful kingdom between the 7th and 11th centuries.


    In fact, most of what is known of Srivijaya comes from Chinese writings. Yijing,
    a Chinese Buddhist monk who visited the city in 671 CE from India. By this time,
    Srivijaya must have been well established not only as a trading port but also
    as a centre for Buddhist learning. From Guangzhou, Yijing boarded a ship to Srivijayan
    ruler and sailed direct to Srivijaya, indicating that the trade link between the
    two cities must have already been in use. He spent six months waiting for the
    change of monsoon to continue his journey to India and put this time to good by
    studying sabdavidya (Sanskrit grammar) at a large monastery outside the port.


    The earliest-known mention of Srivijaya appears in Chinese writings as Shih-fo-chih
    (Sanfo).


    The policies initially acted as brokers for products from South Asia and the Middle
    East to China. In time, however, they were able to create a demand for local products.
    For example, frankincense and myrrh, two products from the West much in demand
    in China, were replaced by pine resin and benzoin respectively. Pepper and camphor
    were introduced by Southeast Asian traders into the Chinese market in the early
    6th century. Camphor became so highly valued in China (principally for its medical
    properties) that its price was on par with gold.

