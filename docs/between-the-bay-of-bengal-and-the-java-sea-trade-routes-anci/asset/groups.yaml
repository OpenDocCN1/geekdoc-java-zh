    where two drums were placed face down in a dugout. Oblique dark red beads and
    pottery shards were also found with the drums. The beads are believed to have
    originated at Kuala Selinsing, pointing to a trade relation between the two settlements.
    They are of the type that came to be treated as mutisalah.


    tree bark for clothing. They used iron, lead and tin to fashion tools and weapons.
