    fins, seaweed, aloes-wood, camphor, betel-nut, rattan, gemstones and gold.


    Central to Singapore''s success was its free-port status, which allowed it to
    steal trade away from nearby ports, especially Riau and Penang. It was the only
    free port in the region when it was established in 1819. Although other free ports
    were eventually established, they did not give Singapore much competition, as
    merchants had already invested capital to set up their businesses in Singapore.
    Both Penang and Melaka were made free ports in 1826, but they served as more feeders
    to Singapore. Kuching in Sarawak, a British port, was a minor competitor as it
    shipped the in-demand gutta-percha and antimony directly to British. Dutch-controlled
    Makassar in southwest Sulawesi declared a free port in 1847, but instead of drawing
    business away from Singapore, it stimulated trade between Singapore and Sulawesi.


    > A gambier and pepper plantation, c. 1900. The Chinese were already planting
    these cash crops in Singapore when the British arrived in 1819. Gambier was its
    use in the dyeing and tanning industries saw Britain become the biggest market.
    The number of plantations increased rapidly. Unfortunately, the planters used
    slash-and-burn cultivation methods, moving on to another tract of land once they
    exhausted the soil. By the late 1860s, much of the interior had been laid waste
    and the planters moved on to Johor.


