    Tuban''s overseas trade record goes back to the 11th century. It was the port
    of departure for sea voyages to the Moluccas. In the 13th century, a Chinese expedition
    landed in a vain attempt to conquer the island. In the 15th century, it was an
    important port where numerous Chinese from Guangzhou and Quanzhou had settled.
    Its native ruler became a Muslim by the mid-15th century. Surrounded by a thick
    wall harbouring some 1,000 residents, Tuban was a court capital.


    # Lasem (Java)


    Located between Tuban and Jepara, Lasem was blessed with a huge supply of teak
    from the forests of Rembang, making it a centre of the shipbuilding industry.
    It was a territory of Majapahit in the 14th century. in 1512, Alfonso de Albuquerque
    left Lasem which could not be easily captured. It was eventually defeated by Sultan
    Agung of Mataram in 1619.


    # Gresik/Grise/Agasim (Java)


    A naturally sheltered harbour on the channel running between the island of Madura
    and mainland Java, Gresik flourished at the beginning of the 14th century. It
    traded spices, sandalwood and honey for textiles and porcelain. Gresik was connected
    to the Bengawan Solo river, which linked it with the interior settlements of Central
    Java and East Java such as Pajang, Karturasura and Surabaya’s produce in the 16th
    century, Surabaya was traded via the port of Gresik. In 1764. Gresik was placed
    under the control of the VOC. ♦


