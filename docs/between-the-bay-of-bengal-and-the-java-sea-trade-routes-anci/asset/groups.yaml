    ## 南吉打

    从炼铁到转口港


    吉打的海岸线在几个世纪里发生了巨大变化。直到大约3世纪，吉打南部大部分要么位于水下，要么是无人的沼泽。默尔博河（Merbok River）曾是一个大湾，直到大约600年前才形成现在的形状。未来的转口港——双溪村（Kampung
    Sungai Mas）和布江甲（Pengkalan Bujang）在当时并不存在。相反，主港位于水石（Sungai Batu），今天位于内陆10多公里处。吉赖山（Mount
    Jerai）是吉打最高的山，曾是一座岛，只有山峰露出水面。


    这里的土壤由海洋沉积物和粘土层组成，特别肥沃。然而，吉赖山孤立地耸在周围平地上1217米高。这座山是吉打-董甲（Kedah-Singgora）山脉的一部分，该山脉高度破碎，导致吉赖山在吉打南部孤立。因此，它是一个有效的航海标记。在山顶发现的一块8世纪印度教珊瑚证明了这山山的重要性。


