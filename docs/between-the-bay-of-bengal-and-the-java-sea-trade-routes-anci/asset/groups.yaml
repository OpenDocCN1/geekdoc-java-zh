    ![](img/c3e5c3015b89799ae52d8dae1158f750_189_0.png)


    Illustrations of people encountered in Banten (or Bantam, to the Dutch) by Cornelis
    de Houtman on his voyage to the East Indies, 1595–97:


    - A Malay merchant and a Keling with his wife

    - Chinese merchants

    - A Javanese gamelan orchestra with three musicians


    ![](img/c3e5c3015b89799ae52d8dae1158f750_189_1.png)


