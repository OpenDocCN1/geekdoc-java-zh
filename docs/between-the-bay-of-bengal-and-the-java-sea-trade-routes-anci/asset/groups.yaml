    Banten, Cirebon and Gresik. Six of his expeditions stopped at Java, bringing in
    a varied crew of astronomers, officials, map-makers, traditional healers, preachers
    and ethnographers, among others.


    Though intertwined with myths and legends, it is believed that while sailing along
    the north coast of Java, Zheng He''s fleet anchored at Pragota after several of
    the crew fell ill. Among them was the Admiral''s deputy, Wang Jing Hong. While,
    a Muslim, performed his prayers in a small cave on a rocky hillside. After 10
    days, the fleet resumed its journey, leaving behind Wang and ten servants to recover.
    These Chinese Muslims decided to settle in the area, farming, trading and preaching
    Islam to the locals.


    In 1411 the Admiral''s fleet stopped by Pragota for repairs. This time, Zheng
    He established a mosque near the cave where he had prayed. An image of him was
    placed in the mosque much later, incidentally turning it into a temple-like centre
    for the local Buddhists, Taoists and Confucians. Known today as Sam Po Kong (Sanbao
    Dong) and the Gedung Batu Temple, it remains a popular worship destination for
    Javanese Muslims and Chinese Buddhists alike. Zheng He''s visit is also memorialised
    in the Chinese name for Semarang, Sanbao Long, which comes from his informal name,
    Sanbao.


    In the 15th century, the group of Chinese Muslims that had settled in Java emerged
    as the driving force in the Islamisation of Javanese society at large. Jin Bun
    (also known as Raden Patah/Sunan Kota) – a Sino-Javanese said to be the son of
    King Kertabhumi,'
