    源自北方，他们于1538年占领了仰高，结束了孟族（Mon）的统治。


    这座城市位于仰高河上游的右岸，呈正方形布局，每边长2.4公里。一堵围墙包围着城市，以抵御攻击。墙外有一有一条布满鳄鱼的护城河。二十座大门提供了进出城市的通道。木制的守望楼镀着金箔，显得宏伟华丽。街道旁种满了树木提供遮荫，据说路宽到可以让10–12个人并排骑行。人们住在铺有瓦片的木屋里。


    仰高的辉煌也反映在国王的宫殿中。坎巴瓦萨迪宫殿（Kambawzathi Palace）位于市中心，由自己的围墙和护城河保护。该宫殿建于1556年，拥有76间房间和殿堂。镀金的木墙和银瓦总是让访客们叹为观止。16世纪60年代到1580年代间访问过仰高的意大利商人兼旅行家费德里奇（Federici）注意到，宫殿内供奉四头大象。1599年，宫殿在大火中被毁。大议厅和班玛亚亚塔纳厅（Bhammayarthana
    Hall）此后已重建，后者是根据古代棕榈叶经和其他文献中的设计设计的。


    与缅甸的其他城市一样，仰高遍布佛塔。最受推崇的是瑞德玛多塔（Shwemawdaw），其次是著名的马哈齐迪塔（Mahazedi）。国王捐赠了相当于其自身重量四倍的黄金来镀金这两座佛塔。这两座塔都是为了安放佛陀的舍利而建。瑞德玛多塔有两发舍，而马哈齐迪塔有一尊牙舍。此外，白增那信王（King
    Bayint Naung，于1551–81年在位）为瑞德玛多塔描绘了一座经书图书馆和52座小塔，每座代表他的一岁年龄。


    缅甸拥有悠久的舍利传统。传说金石（Golden Rock）之所以能平衡在觉吉丘（Kyaikyo Hill，位于仰高东部50公里的觉吉），是因为岩石中供奉着一缕佛发。仰光市的大金塔（Shwedagon
    Pagoda）备受推崇不仅是因为它拥有释牟佛的八尊发舍，还因为其三位前任佛（迦尸孙、光那伽摩那和迦叶波）留下的舍利。国王统治人民的能力在某种程度上取决于他拥有供奉重要舍利的佛塔，这些舍利能引发民众对国王的信心。


    > 白增那信王建造的仰高城市规划图。地图显示了进入城市的20座门的位置和名称。


    仰高：孟族的辉煌 · 63


    城墙内有一个独立的围封区域专门供外国商人使用。所有进入仰高的外国人都必须登记，并被视为国王的奴隶。他们只有在国王许可后才能离开。进入港口的外国船必须上交船舵和火炮，只有在获得国王离开许可后，这些物品才会归还。


    港务对所有与港口的事务拥有管辖权。所有进出口货物


    坎巴瓦萨迪宫殿的大议厅。该宫殿由白增那信王建造，但在1599年被大火焚毁。大议厅于20世纪90年代重建。


    在20世纪90年代的挖掘中发现了曾支撑大议厅的222根柱子的残骸。这些柱子显示了1599年毁灭性大火的证据。在建造宫殿时，这些柱子是来自缅甸各地的捐赠。许多柱子上刻有捐送他们的总督和官员的名字，以及他们所属的名称。


    一根柚木柱的特写，上面刻有国王顾问的名字。根据书写风格，该柱子的年代追溯到16世纪。


    仰高：孟族的辉煌 · 65


    瑞德玛多塔是仰高最受推崇的地方。关于它的历史至少有四种记载。一种早期的孟族记载称，佛塔内供奉着从大同（Thaton，曾是孟族的首都）带回的释牟佛牙舍。这种说法在另一种记载中指向政治权力从一个城市向另一个城市的转移；主塔供奉佛舍，而八座较小的塔每座供奉一尊身舍。目前的版本是，佛塔供奉着佛陀赐给居住在仰高附近的印度商人的两发舍。另一种基于此版本的说法是，佛塔供奉着九尊发舍，是由纳特王（nat
    king）达伽敏供奉的。


    ▲ 瑞德玛多塔的一座寺庙。


    缅甸占星术承认八天制（其中周三被分为上午和晚上）。每周的每一天都分配一种动物。在瑞德玛多塔周围可以找到代表每种动物的龛。这张照片展示了代表周五的豚鼠龛。动物后面安置了一尊佛像，而在佛像后面坐着一个*非*守护灵。信徒们在代表他们出生日期的动物像上洒水并许下愿望。


