    这盏“清真寺灯”是从槟加兰布贾江（Pengkalan Bujang）发现的碎片中部分修复的。它的玻璃呈绿色调，灯顶部有一个玻璃圆缘。这曾是一个油灯；底座上有一个玻璃管，用于盛放灯芯。链条本可以穿过身上的六个手柄，使灯能够悬挂起来。由于在中东古代清真寺遗址发现了大量此类灯，现代研究人员对其进行了命名。然而，在教堂和其他公共建筑中也发现了许多灯。在吉打（Kedah）发现了四件——三件在槟加兰布贾江，一件在布江河上游。


    水坝遗址 SB2A 的冶炼在此时期重新开始。


    与此同时，慕达河谷并没有消失在无人区域。连接默博河（Merbok）和慕达河的特鲁斯河（Terus）为内陆定点提供了贸易贸易路线。有两个定点被确定为重要港口：丹邦辛坡村（Kampung
    Tambang Simpor）和西累赫村（Kampung Sireh）。前者位于特鲁斯河的支流辛坡河上。那里出土了珠子、玻璃和陶瓷。这些陶瓷包括中国、越南和中东器皿，表明该港口在
    10 世纪到 13 世纪之间非常繁荣。它是槟加兰布贾江主要转运港的附属港，负责整合内陆当地产品并将进口货物分配到内陆。


    位于慕达河边的西累赫村发现的遗物中，包括 11 世纪和 14 世纪的中国和中东陶瓷、越南（13–16 世纪）和泰国素瓦纳洛洛（14–15 世纪）陶瓷。有趣的是，还发现了
    15 世纪至 17 世纪的明代陶瓷，这表明在马六甲建立后出口贸易仍在继续；重点是与大城城王国（Kingdom of Ayutthaya）的胡椒贸易。


    ## 布吉石峇帕哈神庙的入圣仪式（GARBHANYASA）


    这座追溯到 11 世纪的布吉石峇帕哈神庙（Candi Bukit Batu Pahat）俯瞰着由默博小河形成的如画的瀑布，这优美的景色无疑促进了其选址的选择。其建筑结构包括一个
    *vimana*（主殿）和一个 *mandapa*（门厅），将其标识为一座印度教 *candi*（神庙）。它比吉打南部的其他神庙更大且建造更好，使用了花岗岩石。与其他寺庙不同，布吉石峇帕哈神庙面朝升起的太阳。因此，其方形圣所的每个角都与方位对齐。


    在建筑之前进行的入圣仪式（garbhanyasa）无疑是古代东南亚最复杂的仪式之一。


    - 从 vimana 后方拍摄的绿意环绕背景中的布吉石峇帕哈神庙。可以看到花岗岩柱基。vimana 内供着胚胎室（garbhagriha），因为其中放置了“胚胎”而得名。


    - 在布吉石峇帕哈神庙挖掘出的八个陈物盒之一。盖上盖子后，盒子尺寸为 22 x 27 英寸。盒子有九个凹槽，中间放着一个铜罐。盖子中心有一个孔；在封圣仪式期间，洒在上面的水会流进内部，从而激活法器。


    入圣仪式是印度教神庙建造中的一项重要仪式。该词翻译为“放置胚胎”。胚胎以隔间盒的形式存在，其中放置了具有象征意义的物品——大部分是产品，如矿物、金属、石头、谷物、植物和沙子。然后将仪式性地放在神庙的地基内。根据处理仪式的南印度著作《迦叶建筑学》（Kasyapasilpa），如果没有执行入圣仪式，神灵将不会进入圣所。


    独特的是，布吉石峇帕哈神庙发现了 8 个陈物盒，埋在圣所墙体内的地面处，位置对应于四个方位和四个斜方位。研究人员推测，圣所中心应该还有一个第九个盒子，可能与槟加兰布贾江挖掘出的大型陈物盒相似。中央陈物盒起到激活主神的作用，而八个较小陈物盒的位置让人联想到洛卡帕拉（lokapala，方位守护者），它们负责守护主神。


    - 一片刻有“Om”字样的金箔被折叠并插入铜罐中。


    | 物品 |

    | :--- |

    | 银牛（Nandi） |

    | 带星号的银方形 |

    | 铜龟 |

    | 铜莲花 |

    | 金林伽（linga） |

    | 金半圆 |

    | 金坐姿女像（Sakti） |


    布吉石峇帕哈神庙的陈物盒是立方体的，四个脚，盖子中心有一个小孔。每个盒子有九个凹槽。中间的凹槽最大，里面放着一个铜罐。罐内装有一片刻有“Om”字样的金箔。八个较小凹槽中的物品性质相似。罐下方是银银、铜和金制成的物品。


    布吉石峇帕哈神庙的陈物盒是立方体的，四个脚，盖子中心有一个小孔。每个盒子有九个凹槽。中间的凹槽最大，里面放着一个铜罐。罐内装有一片刻有“Om”字样的金箔。八个较小凹槽中的物品性质相似。在
    *mandapa*（门厅）上，用灰色画出的柱基在挖掘过程中并未被发现，假设它们曾经存在。


    - 现场保护：圣所内可能安装了一尊湿婆铜像。

    此类陈物盒并非吉打特有。在巴厘岛、爪哇、印度、斯里兰卡和泰国也发现了类似的，而在柬埔寨和越南发现了砖制的盒子，里面装有类似的物品。这些盒子有时被误认为是圣物盒，但实际上是神庙仪式的一部分。许多南印度文献和手册描述了这些仪式。

    布吉石峇帕哈神庙于 1959–60 年间在联邦博物馆部、以及马来西亚大学和柬埔寨吴古窟保护中心的帮助下得以重建。随后在旁边建造了布江谷考古博物馆。该建筑基于
    *mandapa-vimana* 结构，从 *mandapa* 到 *vimana* 有七级台阶，并由 66 或 70 根花岗岩柱组成的矩阵覆盖。东南亚特有的建筑特征，这些柱基是用于支撑屋顶木柱的底座。研究人员认为
    *mandapa* 覆盖着双层屋顶，而 *vimana* 具有巴厘岛 *meru* 型的多层屋顶结构，这种结构是由茅草或洋叶等易腐材料制成的。


    布吉石峇帕哈神庙平面图。这座神庙位于东南部。每个陈物盒都位于圣所墙内（红色标记）。推测圣所中心有一个较大的陈物盒，位于该神灵的基座处。在 *mandapa*
    上，用灰色画出的柱基在挖掘过程中并未被发现，假设它们曾经存在。通往 *vimana* 的阶梯底部的一块石头（绿色标记）最可能是宗教物品的底座，可能代表湿婆的坐骑牛（Nandi）。


