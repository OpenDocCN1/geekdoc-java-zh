    # A Trade-Based Polity


    East of Sembiran lies the village of Julah, another of what is known about Julah''s
    history comes from the discovery of 20 inscribed copper plates in Sembiran in
    the second half of the 19th century. Dating back than a thousand years, the Sembiran
    inscriptions are regarded by the locals as *pratima* — sacred icons with spiritual
    functions. Ten of the plates are kept at Sembiran, the other at Julah. The copper
    plates, each measuring generally 30 cm, contain inscriptions of royal edicts issued
    to the villagers of Julah, written in Old Balinese and Old Javanese, with a scattering
    of Sanskrit words. Edicts issued by various kings between the 10th and 12th centuries,
    the earliest being Sri Ugrasna, who ruled between 915 and 942 CE. The inscriptions
    point to Julah being part of *mandala* comprising seven states, which possibly
    encompassed Sembiran and Pacung as well. The king did not reside in these coastal
    ports, however further inland, near the Batur caldera. Julah, according to the
    inscriptions, was a prosperous port with a stratified society, giving the port-settlement
    a cosmopolitan flavour. Port officials were responsible for inspecting cargo on
    ships and ensuring that the needs of Julah were well-supplied with rice and other
    agricultural products from the surrounding areas. Among its residents were priests
    and merchants allowed to manufacture certain products, including crowbars and
    small weapons.


