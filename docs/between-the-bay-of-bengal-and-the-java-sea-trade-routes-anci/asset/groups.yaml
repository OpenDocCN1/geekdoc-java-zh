    与其他传统的船只不同，人们认为丰提安船是在湄公河三角洲或暹湾附近建造的。丰提安船的现代对应物是泰国的*rua chalom*，其祖先的形象被刻在吴哥窟窟庙的外围回廊上。


    丰提安船所载的大部分陶器在被发现时已成碎片，尽管发现了一些完整的器缘和两个状态近乎完好的罐子。一些陶器被描述为大型，高约1米，呈椭圆形，口部宽。这种描述符合马达丹罐（Martaban
    jar）的特征，其名称来源于缅甸的马达丹（Mottama）港。这些罐子盛放液体、米和其他食物；在船上发现了几粒米。很大比例的陶器带有绳纹；有些图案与在瓜拉·塞林斯（Kuala
    Selings）发现的陶器相似。丰提安船可能曾停靠瓜拉·塞林斯，带来食物和生活用品，同时运出其珠子。


    评估瓜拉·塞林斯的地层并确定不同居住期的时期


    > ▲ 这不是普通的木头，而是丰提安船残骸的遗迹，追溯到公元260–400年。这艘船是典型的东南亚船——由jok（糖棕）纤维制成。建造过程中未使用金属，船的不同部分通过制作船的jok连接在一起，制作船的jok被鉴定为merawan（望洋黄属的几种硬木），而木销是medang（肉豆科）。


    沉积导致了海岸线的变化，使其逐渐向深海推移。这隔绝了瓜拉·塞林斯的通海通道，并可能导致该定居点最终被遗弃。


    地层的划分一直很困难。这是因为地层已经发生了混合：尤其是最上层，包含了古代和现代文物，因为海水冲走了定居点的大部分区域，并将文物重新沉积在表面。早期的物质遗存可能被波浪搅动并带到地层顶部，从而可能导致对物质遗存的年代判定错误。


    珠子制造使瓜拉·塞林斯成为区域贸易网络一个虽小但重要的港口，该网络最初由扶南统治，后由室兰五统治。随着时间的推移，沉积导致海岸线向外扩张，切断了定居点与海洋及贸易路线的联系。这可能导致了瓜拉·塞林斯的终结；其珠子制造业可能被吉丹南部的士盖马斯接管。


    随后，一个马来海盗定居点占领了该地区，接着是一个中国海盗定居点。后来，出现了一个高脚式的中国渔村。中国村庄的一部分侵占了森林保护区，这部分村庄在1909年被森林局破坏。以前河口只有一个岛，但侵蚀的影响让我们今天拥有11个岛。


    106 · 孟加湾与爪哇海之间


    ## 瓜拉·塞林斯的本土文化


    瓜拉·塞林斯的定居者住在木头和草制的房屋里，建在水上，并在住所下方排放生活垃圾。随着时间的推移，这些垃圾堆积导致房屋周围出现了土丘。瓜拉·塞林斯的存在可能已从记忆中消失，但对这些土丘的挖掘揭示了这一古代文化，并使这种生活方式成为焦点。


    我们窥见了一个社区，其饮食包括双壳类动物、椰子和葫芦。他们捕猎动物获取肉类，并从海洋中获取巨蛤和海螺作为食物生给。用掏空树木制成的臼用于捣碎谷物。树皮捶槌被用来软化


    树皮捶槌通过单面上刻的交叉网格纹样来识别，用于敲打树皮使其变软以便制成衣服。在瓜拉·塞林斯发现了两个这样的捶槌，而在长卡特·门特里（Changkat Menteri）的墓地发现了一个，这表明两个定居点之间可能存在文化交汇。然而，瓜拉·塞林斯的标本是硬陶制成的，而长卡特·门特里的则是石制的。


    ▲ 在雪兰莪州双溪村（Kampung Sungai Lang）发现的东山鼓。这是一条独舟，两只鼓面朝下放在木槽中。鼓旁边还发现了倾斜的深红色珠子和陶片。这些珠子被认为于瓜拉·塞林斯，指向两个定居点之间存在贸易关系。它们属于后来被视为mutisalah的类型。


    树皮用于制作衣服。他们使用铁、铅和锡制造工具和武器。与东南亚其他地区相似，他们闲暇时嚼槟榔，并使用独舟在水域航行。


    瓜拉·塞林斯社会的文化可以从其葬礼习俗中进一步获得，分为两种。第一类尸体放在独舟内，第二类尸体则埋在地下（尽管在某些情况下，独舟可能解体）。身体背朝上。身体附近发现了珠子。一具独舟葬的骨架其左腋下有一只短桨，几颗橙红色的珠子，头上有一条黄鱼。


    108 · 孟加湾与爪哇海之间


    独舟葬头骨和骨骼遗骸的分析似乎显示与马来西亚半岛的两个群体具有相似性：塞曼人（一个南亚语系群体）和马来人（一个南岛语系群体）。然而，尚未给出确切结论。


    瓜拉·塞林斯的葬礼习俗与其南方邻居相似——即霹霹雳州伯南姆谷（Bernam Valley）长卡特·门特里的石棺墓文化，以及雪兰莪州双溪的东山文化。这两种文化也让死者随葬陶片。珠子很可能来自瓜拉·塞林斯，表明这些社区之间至少存在贸易联系，甚至是文化纽带。例如，在瓜拉·塞林斯发现的工具和耳环中的锡可能是通过双溪运来的，那里背后有丰富的锡矿。


    > 马来西亚国家博物馆石棺墓复制品。石棺或板墓之所以如此命名，是因为它们的壁由大板制成，顶部用石头覆盖。在霹雳州和雪兰莪北部发现的这些墓的碳年代测定为15至17世纪。在霹雳州伯南姆谷长卡特·门特里石棺墓中发现的珠子。这些可能来自瓜拉·塞林斯。


    瓜拉·塞林斯：卓越的珠子制造者 · 109


