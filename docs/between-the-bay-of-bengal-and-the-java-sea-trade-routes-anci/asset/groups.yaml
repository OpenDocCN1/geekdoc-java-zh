    Depending on the monsoon, Melaka''s residency was between 50,000 and 100,000 people,
    the largest population in Southeast Asia in the 15th century. Some 84 languages
    were reportedly spoken by the cosmopolitan mix of traders, international merchants,
    priests, soldiers, administrators.


    Melaka, essentially a market town, was the only port along the Straits without
    agrarian hinterland produce. Its fields infertile and crops poor, focus was on
    the fishing industry inside. From the accounts of the Melaka-born Makassarese-Portuguese
    writer Manuel Godinho de Erédia, Melaka was well known as a shad-fishery and as
    a source of an array of dried and salted sea produce. These would include dried
    fish roses and ikan terubuk (a highly prized species of shad) pickled in brine.
    The town relied heavily on regular food supply – especially rice, as the supply
    from Siam was unreliable – hence the strong presence of nowadays, who had their
    bazaar at the south end of the Melaka River.


    ![](img/c3e5c3015b89799ae52d8dae1158f750_124_0.png)


    +   Tin ingots, a trading currency unique to Melaka. Ten blocks made up one unit
    called a "small bundle", while 40 blocks made up one "large bundle". Tin tributes
    received via treaties with Perak, Selangor, Manjung and Beruas were also sold.


    The only other local export recorded was tin, obtained from the interior, which
    was fired into ingots, weighing about one pound. These were unique to Melaka as
    a trading currency. Also accepted were gold dust, silver bars, gold dinars, Paisai''s
    tin coinage, and Chinese copper cash, though in general items were barred.


    Large ships and vessels berthed on Melaka''s sea-coast, while the river was plied
