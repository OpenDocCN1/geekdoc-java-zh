    Stilt house on Inle Lake, Myanmar.

    Throughout history, houses across Southeast Asia have been built on stilts, raising
    the living area high above ground level. This protects the occupants from wild
    animals as well as from floods, while air circulation under the floor helps keep
    the interior cool. These dwellings could moor their boats in the space under the
    house.'
