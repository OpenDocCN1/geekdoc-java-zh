    # CHAPTER 8


    # BANTEN


    The Pepper Kingdom


    ![](img/c3e5c3015b89799ae52d8dae1158f750_178_0.png)'
  - '[PAGE 179]


    IN THE 10TH CENTURY, under the protection of Srivijaya, the Kingdom of Sunda established
    a settlement at Banten Girang, 10 kilometres upstream of the Cibanten River, at
    the western tip of Java. Literally "Upper Banten", Banten Girang sat between Mount
    Pulosari and Banten, the harbour at the river mouth. A temple dedicated to Siva
    was built on the sacred highland of Mount Pulosari and became one of Sunda''s
    centres of Hinduism.


    ![](img/c3e5c3015b89799ae52d8dae1158f750_179_0.png)


    Majestic ruins of the Kalbon Kraton in Old Banten. Built in 1815, it was destroyed
    by the Dutch in 1832.'
  - '[PAGE 180]


    Up to the 13th century, both the Malay Srivijaya and Javanese Majapahit kingdoms
    had influence over the governance of Banten Girang. They fought frequently over
    the settlement in order to profit from the pepper-rich district and to gain control
    of the Sunda Strait, which connects the Java Sea to the Indian Ocean. Between
    the 13th and 14th centuries, the Kingdom of Sunda was an independent state, and
    Banten Girang prospered as a pepper producer and exporter, only to be completely
    destroyed in an attack by the Pajajaran Kingdom around 1400. Nevertheless, the
    region slowly regained its significance in the 1500s as its harbour rose entrepot
    after the fall of Melaka to the Portuguese in 1511.


    The backbone of Banten''s economy since the day of Banten Girang in the 12th century
    was pepper, which was in high demand in the international trade. In Europe, pepper
    was the solution to meat preservation during winter, as meat from cattle that
    were slaughtered in autumn would otherwise become contaminated towards spring.
    Prior to the 15th century, pepper was such a prized commodity that it was used
    as currency to pay rent, dowries, and even to purchase land. The cities of Alexandria,
    Genoa and Venice prospered on the trade in pepper, which was supplied by Middle
    Eastern merchants who tightly guarded any information about their sources in Malabar.
    It was pepper that ultimately drove Vasco Da Gama to venture east in 1498, eventually
    securing the Portuguese a key position in the Indian Ocean''s spice trade in 16th
    century.


    +   *   Banten and its surroundings. Tasikardi lake that functioned as a water
    reservoir for the royal palace in the city.


    ![](img/c3e5c3015b89799ae52d8dae1158f750_180_0.png)


    180 · Between the Bay of Bengal and the Java Sea'
- md: '

    The pepper plant (Piper nigrum), native to India. The fortunes of Banten were
    built on this highly sought-after spice.


    Black and white peppers are both produced from the same species, *Piper nigrum*.
    Black pepper is made from unripe pepper berries that blacken after being dried.
    The production of white pepper is more tedious – sunny sacks of fully ripe pepper
    berries were traditionally fermented in water for about two weeks before their
    pericarps were scrubbed off. White pepper, used as seasoning in light-coloured
    dishes and to flavour wine, was more expensive. This was China, the biggest market
    for pepper in the East, was sourcing for Banten at the beginning of the 15th century.


    In 1379, the Ming court, which had sole monopoly over China''s foreign pepper
    trade, began to reward its subjects with the spice. Admiral Zheng He, during his
    sea voyages between 1405 and 1433, became the sole importer of pepper from the
    Afro-Asia region. In 1424, the pepper and sappan wood that he brought back was
    used to pay the salary of imperial officers. When Zheng He''s voyages ended, foreign
    envoys brought in pepper as tributes to the imperial court. By 1532, one catty
    of pepper was worth 5.5 taels of silver.


    The average annual amount of pepper purchased by China in the 15th and 16th centuries
    was 50,000 bags, or 2 million catties, equivalent to the total amount of pepper
    imported by Europe from the East in the first half of the 16th century. Demand
    increased yet further at the end of the Wanli Emperor''s reign (1572–1620), as
    direct access to the commodity became available to commoners. Pepper was no longer
    an exclusive commodity for China''s wealthy. In this turn stimulated pepper cultivation
    in the Malay Archipelago.


    Banten Girang was reputed to yield top-quality pepper. Its harbour, Banten, sheltered
    by several islands from the open sea, was a strategic assembly point for traders
    coming from the Indian Ocean, the South China Sea and the Malay Archipelago. Taking
    over Melaka''s role as the primary entrep for the export of pepper to China, Banten
    Girang sustained a relationship with the Portuguese, who sold them gunpowder for
    Melaka-made cannons that were supported by carriages produced by Banten''s Chinese
    carpenters. Banten''s ships would often sail to Macao, which was also under Portuguese
    rule.


    An agreement signed in 1522 granted the Portuguese unlimited access to Banten''s
    pepper and permission to build a fort at the mouth of the Java Ontong River (present-day
    Cisadane River), which would be financed by the kingdom in the form of an annual
    pepper subsidy of 1,000 gunneries (30 tons). The fort was intended to block attacks
    coming from the east, but before it could be built, an invasion force of 2,000
    men from the Muslim Kingdom of Demak attacked and captured Banten Girang in 1527.
    With the cooperation of the local elites, the populace embraced Islam, and a Muslim
    state was established, led by the brother-in-law of Demak''s Sultan Trangana,
    Sunan Gunungijati, and his son, Maulana Hasanuddin.


    Sunan Gunungijati (also known as Syarif Hidayullah) is revered today as one of
    the Wali Songo, the nine saints of Islam in Indonesia. He moved the administration
    centre from Banten Girang to Banten on the coast and instructed his son to build
    a brick-walled city over the existing harbour, complete with artificial reservoir
    drainage and aqueducts. Only Muslim locals were allowed to reside within the fortified
    city, which was divided into several strictly guarded villages led by nobleman
    whose power depended on the number 200–2,000 slaves they owned. Each village housed
    200–2,000 people, who lived in dwellings made of bamboo or coconut lumber. Foreigners
    settled outside the walls, along the shore – Muslims on the northeast, non-Muslims
    along the west. They were largely of the merchant community, each headed by their
    own representatives.


    Maulana Hasanuddin, who married the Princess of Demak, was installed as the first
    independent sovereign of the Banten Sultanate in 1522, ruling as Panembahan Surosowan
    from his palace, Kraton Surosowan. A rectangular rock stone as Watu Gigilang,
    sacred to Banten Girang, served as his throne. This was placed under the shade
    of a banyan tree in an open-air hall (*lapangan*) held the royal court of Banten.
    One of the gapura gateways of the Kaibon Kraton. This Bantenese palace was built
    by Sultan Agyafuddin (r. 1683-1703) for his mother, Ratu Aisyah. Kaibon means
    "love of a mother".


    - The Great Mosque of Banten, constructed during the reign of Sultan Maulana Yusuf,
    the third Sultan of Banten and son of Maulana Hasanuddin. It features a traditional
    tiered roof and a 22-metre-tall octagonal minaret.


