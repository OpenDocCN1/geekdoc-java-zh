    # PREFACE


    ANCIENT PORT-CITIES ARE wonderful to visit.

    Remnants of their thriving past in the form of architectural relics and artefacts
    echo the lives and events that took place in these historic centres of activity.
    However, centuries of natural sedimentation and land reclamation have pushed many
    of these settlements inland, away from their original coastal locations, so much
    that their early origins as maritime trading hubs are now lost on us.


    This book offers an insight to the historical backdropdropping the rise and decline
    of 10 significant Southeast Asian ports, in the hope that these individual stories
    illuminate the larger tapestry of maritime trade and cultural exchange. We have
    zoomed in on the region between the Bay of Bengal and the Java Sea as a particularly
    fertile area of study. The port-cities we have selected are Merauk-U, Bago, southern
    Kedah, Kuala Selinsing, Melaka, Palembang, Singapore, Banten, Semarang and northern
    Bali. Our focus is on the formation of the early settlements, the commodities
    exchanged, and the commercial networks that made them prosperous, from the beginning
    of the Common Era up to the coming of the Europeans.


    Among our readings, we referred to travellers'' accounts, historical writings
    by the Arabs, Chinese, Portuguese and Dutch, Tamil epics, Malay chronicles, maps
    and lithographs. As written records for these cities prior to the Europeans''
    arrival are limited and to a great degree intertwined with folklore, we turned
    to academic papers and journals to establish reliable facts, noting that debates
    on certain aspects have been going'
  - '[PAGE 6]


    on for ages. The latest archaeological discoveries have enriched our knowledge
    and understanding of places, and we keep an open mind to future discoveries that
    will augment or possibly upend the narratives that we are accustomed to. On the
    whole, we have chosen to stay close to the essence of these cities'' fortunes,
    maritime trade and commerce, without disregarding the romance, power struggles,
    feuds and betrayals that attended the complex history of the region.


    Today, almost nothing from their earliest history can be traced on the ground.
    Fortunately, the remaining elements in one way or other have been preserved, although
    the less popular historical sites are not easily located. Many of the artefacts
    and relics are also no longer in situ but distributed throughout museums and galleries.
    We enjoyed tracking down these places and items, finding ourselves in awe of the
    grand architecture and majestic ruins that have stood the test of time.


    A note on terminology: We have used the name "India" interchangeably with "South
    Asia" to refer to the Indian subcontinent, comprising modern-day Afghanistan,
    Bangladesh, India, Nepal, Pakistan and Sri Lanka.


    We are indebted to our editors at Marshall Cavendish, Justin Lau and Melvin Neo,
    for supporting our ideas and guiding this book to fruition, as well as Sophia
    Susanto, for helping us shape the initial manuscript. Our heartfelt gratitude
    goes out to the following people who have contributed towards this book in one
    way or other: Ar. Adrianta Aziz, Anthony C. Louis,


    6 · Between the Bay of Bengal and the Java Sea'
