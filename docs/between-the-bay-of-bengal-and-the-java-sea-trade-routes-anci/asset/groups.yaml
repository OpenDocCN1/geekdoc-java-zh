    from the north, which seized Bago in 1538, bringing an end to Mon control.


    This city, on the right bank of the Bago River when going upstream, was laid out
    on a square plan measuring 2.4 kilometres on each side. A wall encircled the city,
    affording protection against attacks. A moat filled with crocodiles ran along
    the outside of the wall. Twenty gates provided access in and out of the city.
    The watchtowers, built of wood, were gilded in a show of grandeur. The streets,
    lined with trees to provide shade, were said to be broad that 10–12 men could
    ride abreast. The people lived in wooden houses covered in tiles.


    The splendour of Bago was reflected in the king’s palace. Kambawzathi Palace was
    located in the centre of the city, protected by its own set of walls and moat.
    Built in 1556, it had 76 apartments and halls. Gilded wooden walls and tiles of
    silver never failed to awe visitors. The Italian merchant and traveller Federici,
    who visited Bago some time between the 1560s and 1580s, noted that the palace
    housed four elephants. In 1599, the palace was razed in fire. The Great Audience
    Hall and the Bhammayarthana Hall (or Bee Throne Hall) have since been reconstructed,
    the latter based on designs found on ancient palm leaf manuscripts and other documentation.


    As with other cities in Myanmar, Bago is dotted with pagodas. The most revered
    is the Shwemawdaw followed by the Mahazedi. The king donated gold amounting to
    four times his own weight to gild these two pagodas. Both were built to house
    relics


