    IT IS SAID THAT in the 15th century, when a prince from the Mataram Kingdom by
    the name of Pangeran Made Pandan Arang arrived at a small village on the north
    coast of central Java, he sighted many asam (tamarind) trees scattered throughout
    the plantation fields. He described the place as "asam arang", meaning "scattered
    tamarinds". The combination of these two words gave the town of Semarang its name.


    Semarang was not an unknown town by any means. Originally known as Pragota, it
    had come into existence around the 8th century, when it was established at the
    estuary of Kali Garang (present-day Semarang River) as a port-settlement. Entry
    to its port from the Java Sea was initially sheltered by a series of small islands,
    making it an ideal harbour. But beginning from the 10th century, heavy sedimentation
    pushed the coastline further out into the sea. Over time, the old harbour found
    itself some 5 kilometres inland, around where present-day Simongan/Pasar


    ![](img/c3e5c3015b89799ae52d8dae1158f750_198_0.png)


    +   The extent of the Ancient Mataram Kingdom over four centuries.


