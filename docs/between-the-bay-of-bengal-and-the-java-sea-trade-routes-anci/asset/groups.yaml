    # REVENUE FARMING


    A REVENUE FARM was a licence granted by the government for the right to distribute
    – and to collect taxes on – a specific item or activity. The most common ones
    in Singapore were for liquor, opium, gambling, prostitution and pawnshops. A public
    auction was held to farm out the rights to distribute these items. The successful
    bidder, usually a kongsi (business syndicate), was charged a fixed amount by the
    government and was then free to charge his customers any amount he felt reasonable.
    For a government on a tight budget, this system effectively did away with the
    need to maintain labour and infrastructure for revenue collection.


    The most lucrative and hotly fought over of these farms were the opium farms.
    Many of the secret society wars in Singapore were over control of these farms.
    Opium was imported raw and converted into consumable forms – known as chandu in
    Malay – by local opium farm holders. The largest consumers were the Chinese labourers
    working in tin mines and plantations, which were ultimately controlled by the
    kongsi. The kongsi required their workers to buy consumables (food, liquor, chandu)
    through them, thus allowing the kongsi to get back a large share of the workers''
    wages. The majority of the labourers were indentured, and as they got addicted,
    they became trapped in a vicious cycle of debt, having to buy chandu from the
    kongsi at inflated prices. Some historians argue if it had not been for opium,
    the Chinese capitalists would have been hard-pressed to remain in business during
    the 19th century.'
  - '[PAGE 177]


    Revenue farming was already in place before colonisation. Rulers across Southeast
    Asia had long outsourced the collection of taxes along rivers and at ports. In
    the 17th and 18th centuries, they had also given to the Chinese businessmen the
    exclusive rights to run opium, gambling and pawnshop businesses. Colonial governments
    simply expanded on this existing business model.


    For Singapore, Raffles stipulated that no revenue was to be derived from "vices"
    (gambling, liquor and opium), which were to be banned. However, Farquhar, pressed
    for funds to develop the town, demanded the rights to collect excise taxes, displacing
    Raffles when he visited in 1822. Subsequently, in May 1823, Raffles shut down
    all gambling and cockfight establishments. He also imposed higher taxes on liquor
    and opium and Dr John Crawford, who replaced Farquhar as Resident in 1823, reintroduced
    made gambling licences on the premise that gambling, being endemic among the Chinese,
    was being conducted illegally and the government might as well profit from it.
    However, it was permanently illegal in 1829 after it led to high rates of crime.
    Opium farms took over as the highest revenue generators.


    ![](img/c3e5c3015b89799ae52d8dae1158f750_177_0.png)


    > Raw opium was boiled and filtered into chandu, which was then packed into individual
    balls of dried bamboo leaves. A long needle was used to pick up the chandu and
    hold it over a lamp that produced heat rather than light. As the chandu melted,
    the smoker shaped it into a ball and placed it on the end of the opium pipe. The
    opium was then consumed by smoking.


