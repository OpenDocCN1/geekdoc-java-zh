    胡椒植物（*Piper nigrum*）产于印度。万丹（Banten）的财富建立在这种备受追的香料之上。


    黑胡椒和白椒均产自同一品种，即*Piper nigrum*。黑胡椒由未成熟的椒果制成，干燥后变为黑色。白椒的生产更为繁琐——传统上将装满完全成熟椒果的阳光曝晒袋子在水中发酵约两周，然后洗去果皮。白椒用于浅色菜肴的调味和葡萄酒增味，价格更为昂贵。15世纪初，作为东方最大的胡椒市场的中国正从万丹采购胡椒。


    1379年，对中国对外胡椒贸易拥有垄断权的明朝开始向其臣民提供这种香料作为奖励。郑和提督在1405年至1433年间的航海期间，成为非洲和亚洲地区胡椒的唯一进口商。1424年，他带回的胡椒和苏木用于支付皇家官员的薪水。当郑和的航行结束后，外国使节将胡椒作为贡品送给朝廷。到1532年，一猫胡椒价值5.5两银。


    15世纪和16世纪，中国每年购买的胡椒平均数量为5万袋，即200万猫，相当于16世纪上半叶欧洲从东方进口的胡椒总量。在万历皇帝统治末期（1572–1620），随着平民可以直接获得这种商品，需求量进一步增加。胡椒不再是中国富人的专有商品。这一转变刺激了马来群岛的胡椒种植。


    万丹-格里兰（Banten Girang）以产出顶级胡椒闻名。它的港口万丹受几个岛屿遮挡不受海风，是来自印度洋、中国南海和马来群岛商人的战略集结点。万丹格里兰接替了马六甲成为出口中国的主要转口，并与葡萄牙人保持关系，葡萄牙人提供火药以换马六甲制造的大炮，而这些大炮由万丹中国木匠制作的炮架支撑。万丹的船只经常前往同样受葡萄牙人统治的澳门。


    1522年签署的一项协议授予葡萄牙人无限获取万丹胡椒的权利，并允许他们在爪哇翁通河（现西萨丹内河）河口建造堡垒，该堡垒由王国以每年1000担（30吨）胡椒补贴的形式提供资助。堡垒旨在阻止来自东方的进攻，但在其建成之前，1527年，一支来自德马克（Demak）穆斯林王国的2000人入侵军进攻并占领了万丹格里兰。在当地精英的合作下，民众接受了伊斯兰教，建立了一个穆斯林国家，由德马克苏丹特拉加纳的姐夫苏南·古努尼贾蒂（Sunan
    Gunungijati）及其子马哈拉纳·哈桑丁丁（Maulana Hasanuddin）领导。


    苏南·古努尼贾蒂（又名谢里夫·希达亚拉胡）今天被尊为印尼“九圣”（Wali Songo）之一。他将行政中心从万丹格里兰迁至沿海岸的万丹，并指示儿子在现有港口上方建造一座砖墙城市，配备人工水库排水系统和引水渠。只有穆斯林当地人被允许住在防御城市内，城市被分为几个严密守护的村庄，由贵族领导，他们的权力取决于所拥有的200–2000名奴隶的数量。每个村庄居住200–2000人，住在竹子或椰子木制的房屋里。外国人定居墙外的岸边——东北部是穆斯林，西部是非穆斯林。他们主要由商人社区组成，每个群体由自己的代表领导。


    马哈拉纳·哈桑丁丁娶了德马克公主，于1522年被任命为万丹苏丹国的第一位独立主，，从他的苏罗瓦万皇宫（Kraton Surosowan）以潘内巴汉·苏罗瓦万（Panembahan
    Surosowan）的身份统治。一块名为吉加兰石（Watu Gigilang）的矩形岩石作为万丹格里兰的圣物，是他的宝座。它被放在万丹皇廷露天大厅（langan）的榕树荫下。卡伊邦皇宫（Kaibon
    Kraton）的gapura大门之一。这座万丹宫殿是苏丹阿吉亚富丁（执位1683-1703年）为他的母亲艾伊莎后（Ratu Aisyah）建造的。卡伊邦意为“母爱”。


    - 万丹大真寺建于万丹第三任苏丹马哈拉纳·优素夫（Maulana Yusuf）统治时期，他是马哈拉纳·哈桑丁之子。它具有传统的层叠屋顶和一座22米高的八角形宣塔。


    在孟加湾和爪哇海之间

