    古吉拉特人精通丝绸织造，但并不养蚕。因此，马六甲成为了坎贝（Cambay）纺织贸易的转运站。每年都有五艘船只从坎贝航往马六甲。在马六甲黄金时代，古吉拉特人形成了当地最大的商人社区。根据葡萄牙药剂托梅·皮雷斯（Tomé
    Pires）的记载，他曾在1512年至1515年间住在马六甲：


    ▲ 马六甲苏丹曼苏尔·沙（Sultan Mansur Shah，死于1477年）的墓石碑。墓碑侧面刻有苏门答腊北部墓碑上常见的诗句。“世界转瞬即逝；世界并无永恒；世界正如蜘蛛织的网。”


    坎贝商人将马六甲作为他们的主要贸易中心。马六甲曾有一千名古吉拉特商人，此外四五千名往返的古吉拉特海员。如果想要非常富足和繁荣，马六甲离不开坎贝，坎贝也离不开马六甲。所有来自古吉拉特的衣服和物品在马六甲以及与马六甲贸易的国家中都有贸易价值。


    一种辛德莱布（cinderai cloth），是印度帕托拉（patola）的当地版本。这种布传统上被马来妇女当作披肩（selendang），男性则用作腰带（bengkung）。其高质量的扎染工艺（ikat
    weave）赋予了它坚韧性（如果层层穿着几乎可以防刺），使人们将其与神秘力量和长生联系在一起。


    在马来群岛，衣服具有重要的象征和仪式功能。许多人相信，作为礼物，它们能赐予健康、多产和祖先神灵。例如，木质、金属或石质塑像在穿上衣服和香水之前是没有力量的。丝绸被珍用于皇室，丝绸长袍经常赏给受苏丹青睐的人。马六甲皇室的成员穿着丝绸以与穿棉花的平民区分开来。但总体而言，棉花是该地区的首选材料，在某些地方价格甚至比丝绸还。它也被用于造船业制作帆布。


    抵达马六甲的原料和制成品纺织品都受到苏门答腊商人的追捧，他们将其带往巴民荣和占碑等沿海织造中心。在那里，当地织工吸收了印度织物的风格和图案，这些风格今天在传统的马来手工织布上仍然清晰可见，例如
    kindai 布（kindai cloth），它是对鲜艳印度帕托拉的模仿。一些印度织物甚至是为满足东南亚市场的仪式需求而设计的。


    另一个主要的纺织品来源是科罗曼德海岸（Coromandel Coast）。马六甲的纺织品和纱出口是从普利卡特（Pulicat）的安纳达扬·帕蒂南港（Anandarayan
    Pattinam）运出的，那里是该地区最富有、最活跃的棉花产地。当地的手织格子或条纹裙（lungi）非常受欢迎，成为马来群岛、斯里兰卡和阿拉伯海常见的服装。直到今天，这种布在马来地区被称为
    pelikat。


    马六甲王国在穆扎法尔·沙（sultan Muzaffar Shah，在位1445-56年）时期时期得到了扩张，从北部邻接大城王朝的穆斯林马来定居点——武吉岛（Phuket）、沙敦（Satun）和北大丹（Pattani），延伸到西南。


