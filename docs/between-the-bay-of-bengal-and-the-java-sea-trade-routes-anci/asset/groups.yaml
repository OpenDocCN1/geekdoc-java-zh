    # SINGAPORE


    Two Foundings of the City


    STANDING ON A HIGH ROCK on the island of Bintan, Sri Tri Buana espied a beach
    across the sea with sand so that it looked like a piece of cloth. This was the
    island of Temasek. Its beauty lured the Srivijayan prince to establish a city
    on its shores, a city he gave the name Singapura – “Lion City” in Sanskrit – after
    spotting a lion on the island.


    Sri Tri Buana’s founding of Singapore occurred in the last decade of the 13th
    century. This was a period of tumult in the region. Srivijaya, the bastion of
    Malay power, was disintegrating and the Javanese were muscling for power in southwest
    Sumatra. The Siamese were expanding down the Malay Peninsula, into territory conquered
    by Majapahit as theirs. Malay hegemony was under threat. But with the founding
    of Singapore, the seat of Malay power expanded from the west coast of the Straits
    of Melaka to its east coast. The Sejarah Melayu (Malay Annals) purports that Singapore,
    under the rule of Sri Tri Buana and his four successors, rose to become a great
    city, attracting foreign traders who spread its fame throughout the world.


