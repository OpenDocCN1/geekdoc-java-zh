  - '[PAGE 52]


    Some historians are of the view that the reliefs portray Min Bin''s perception
    of himself as a *cakravartin*, a virtuous king ruling across continents. The pagoda
    is also important as the location of the Anandancandra Stone Inscription, a pillar
    inscribed with the early history of Rakhine. The Shitthaung continues to be an
    active place of worship today and is one of the most well-maintained pagodas in
    Muk-U. In size, however, it is exceeded by the Koethaing Pagoda, built by Min
    Bin''s son, Dikka, in the mid-16th century. Home to 90,000 statues of Buddha,
    it is the largest pagoda not only in Mra-U but also in the whole of Rakhine.


    An army made up of mercenaries is not easy to keep loyal and Rakhine''s power
    started waning in the mid-17th century. Bengal took the opportunity to break away.
    The kingdom was beset by civil wars and natural disasters, and hence was not well
    prepared to defend itself when King Bodawpaya Konbaung dynasty attacked in 1784.
    Not only did the Burmese occupy Rakhine, they removed Mahamuni, the Buddha image
    that was the very symbol of Rakhine, to their capital of Amarapura.


    In 1826, the British annexed Rakhine, and in 1886, they incorporated it together
    with the rest of Myanmar as a province of British India. The capital of Rakhine
    was moved to Sittwe (Akyab), a small fishing village at the time. Muk-U was renamed
    Mrohaung (Old City), but it reverted to its original name in 1979. Rakhine became
    a state in independent Myanmar in 1948.'
