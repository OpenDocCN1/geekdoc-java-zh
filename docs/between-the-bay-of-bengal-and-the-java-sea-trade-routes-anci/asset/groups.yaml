    ## THE BIRTH OF MELAKA


    # Melaka as an entrepôt in the early 15th century can be attributed to a large
    extent to its geographical location, nestled halfway between two major civilisations
    — Ming China to the east, and the Indian kingdoms to the west. But it was founded
    circa 1402 by Parameswara, a renegade prince from Palembang, trade was not the
    main thing on his mind.


    Parameswara was on the run from the Siamese, who had laid a bounty on his head
    for killing the ruler of his vassal state, Temasek. Fleeing up the western coast
    of the Malay Peninsula, Parameswara found a hide with numerous corridors and pathways
    and land that would be strategic for warding off attacks from the Siamese. Here
    he established a new settlement, became known as Melaka. His son fortified an
    abode on the crest of the hill near the mouth of Bertam River (today Melaka River),
    from where their men kept constant vigilance over the ships that passed the Straits
    of Melaka.


    Melaka''s original inhabitants were mostly sea gypsies or fishing folk commonly
    referred to as Orang Seletar. Parameswara built an alliance with them to establish
    the new city as a viable port-of-call, seeing that its location made it accessible
    in all seasons. Piracy was reduced with the assistance of these faithful Orang
    Seletar noblemen, whose followers patrolled the sea in light boats.


    As the seaport rose in prominence, Melaka began to attract traders near and far,
    leading Arab and Indian merchants to its shores. It was apparently these Muslim
    merchants who informed the Chinese court of Parameswara''s new port, China''s
    Melaka''s potential as a commercial hub. China''s maritime explorations in search
    of trade proved to be timely for this erstwhile fishing hamlet. Yongle, a delegation
    led by Admiral Yin Qing set sail for Melaka, arriving in 1403, and reporting a
    population of over 2,000.


    Parameswara seized the opportunity and pledged his loyalty to the emperor to gain
    China''s support against his rivals, Siam. In 1405, he sent an envoy to pay homage
    to the emperor and received recognition as the independent ruler of Melaka. From
    then on, regular tributes that included pepper, timber and jewels were sent to
    China in exchange for protection against Siamese and Majapahit invaders. Parameswara''s
    successors would visit the Ming emperor personally to seek blessings and reaffirm
    the close ties between the two kingdoms. This tradition continued until the reign
    of the last Sultan of Melaka, Sultan Mahmud (d. 1528).


    Admiral Zheng He, the Muslim Chinese eun diplomat, arrived in Melaka with his
    “treasure fleet” for the first time in 1409. On behalf of the Ming emperor, he
    raised the territory to the rank of a Chinese vassal state. He proceeded to establish
    a regional headquarters near Melaka''s harbour, with that, a sizeable Chinese
    trading community began to settle in town. According to the voyager Ma Huan, Zheng
    He''s depot was a palisade-like castle with four walled gates. Within the enclosure
    were protected warehouses and granaries that stored money, food and other provisions.


    Melaka became the terminus for Zheng He’s voyages to the West, a storage centre
    for goods en route to China. Chinese travellers described Melaka’s public buildings,
    especially the royal palace, to be similar to Chinese imperial palace. Zheng He
    and his men are believed to be the ones who introduced the construction of permanent
    buildings to the town, replacing the local timber, bamboo and nipah structures.
    The palace was reported to have featured roof tiles that Zheng He brought from
    China.


    - Shards of ceramics have been discovered in Melaka of the Ming, Qing, Swatow,
    Swankhalok, Sukhothai, Annamese, and Japanese Persian varieties – reflection of
    the bustling cosmopolitan trade that took place in the city.


    China’s presence at Melaka boosted the status. The Ming court, the biggest purchaser
    of pepper at the time, was Melaka’s principal trading partner, bringing among
    other orders, porcelain, musk, silk, mercury, copper and vermillion.


