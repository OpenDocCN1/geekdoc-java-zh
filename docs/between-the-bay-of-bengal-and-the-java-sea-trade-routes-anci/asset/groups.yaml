    languished. In 1826, the British built a fort and stationed a garrison; they called
    the city “Bassein”.


    ## Yangon/Rangoon/Dagon (Myanmar)


    Dagon was a Mon village famous for the Shwedagon Pagoda, which houses hair relics
    of Buddha. In 1755 (r. 1752–60), founder of the Konbaung dynasty, captured Dagon
    and made it the capital of Lower Myanmar. City officials and people changed Dagon''s
    name to Yangon, “End of Strife”, a stockade from which a road led to the Shwedagon.
    People of importance lived in this stockade while the rest lived outside. The
    British captured the city (which they called Rangoon) in 1852 and made it capital
    of their newly annexed territory of Lower Myanmar. It remained the capital of
    independent Myanmar until 2005, when a newly located city, 300 kilometres to the
    north of Yangon, became the nation’s new capital.


    ## Thaton (Myanmar)


    Thaton developed during the middle of the first millennium and was one of the
    earliest urban centres in Lower Myanmar. Mon chronicles point to Thaton at the
    initial location of Suvarnabhumi, the legendary “Land of Gold”. Thaton was a walled
    city, rectangular in plan. The palace and the main star, Shwe Sar Yan Pagoda,
    were at the southern end, surrounded by Buddhist monasteries. Thaton used to be
    known as Sudhammatti, City of Good Law. A tradition relates that in the 5th century,
    a Theravada Buddhist scholar brought from Sri Lanka the Pali canon from Theravada
    Buddhism, known as Tipitaka. It was reportedly to tell this canon that King Anawrahta
    from Bagan conquered Thaton in 1057.


    ## Mottama/Martaban (Myanmar)


    Mottama developed in the second millennium and was known for its large storage
    jars as Martaban jars. Being poor conductors of heat, these jars were ideal for
    carrying fresh water, wine, oil, preserved vegetables and grains onboard ships.
    Although a boat sandbar and violent tides made it difficult to navigate to the
    port, pilots could be hired at the bar to take a boat in safely. These experienced
    pilots knew the approach, avoiding both high tide and low tide. There was a strong
    trade relationship between Mottama and Melaka as well as Pasai. Tomé Pires, writing
    between 1512 and 1515, noted that merchants from this region were a great favourite
    of the Malay ladies in Melaka. Traders from Martaban took lak, musk, precious
    stones, silver, onions, garlic and butter for Melaka, where they traded these
    for ornaments, tin, cloves, mace and nutmeg; with Pasai, they traded these for
    pepper.


    ## Dawei/Tavoy (Myanmar)


    While Dawei’s chronicles date the royal lineage back to 754 CE, the city developed
    as an important port in the 2nd millennium. Dawei – or Tavoy, under the British
    – lies on the Taninthary (Tenasserim) Peninsula, an important location for making
    landfall from the Bay of Bengal. It was furthermore the starting point of a transpeninsular
    route across to the Gulf of Thailand. This route took travellers through the Three
    Pagoda Pass (a pass in the Tenasserim Hills marked by three small pagodas) and
    by a network of rivers to Ratchaburi in Thailand. Its strategic location invited
    guests from both northern Myanmar and Thailand and it changed hands between the
    two powers a number of times.


    ## Myeik/Mergui (Myanmar)


    Lying on the Tanintharyi (Tenasserim) Peninsula, this 2nd-millennium port had
    the advantage of a harbour that ships could approach with relative ease compared
    to the trickier harbours offered by other port-settlements along the Malay Peninsula.
    Additionally, peaks over 400 metres helped navigators approach the port more safely.
    Local products from Mergui entering the trade markets included pearls, birds''
    nests and ambergris (a substance obtained from sperm whales and used in perfumery).


    ## Phu Khao Thong (Ranong Province, Thailand)


    Phu Khao Thong shows evidence of a transinsular route to Khao Sam Kaeo from as
    early as the 3rd century BCE, based on similarities in their imported products
    (Indian rouleted wares, knotted wares and fine wares). Fragments of a Chinese
    mirror dated to the Eastern Han (25–220 CE) in nearby Bang Kluai Nok support this
    link. A pottery shard inscribed in Tamil-Brahmi dated to the 2nd century CE is
    the oldest Tamil inscription in Southeast Asia.


    - Glazed terracotta plaque depicting the daughters of the demon Mara (c. 1460),
    southern Myanmar


    ## Langkawi/Lancui (Peninsular Malaysia)


    A large producer of pepper, Langkawi was referred to by the Acehnese as Pulau
    Lada or “Pepper Island”. Its residents moved to Kedah after an attack by Aceh
    in 1618–19, returning periodically to harvest pepper. Its population would increase
    to 700 during the harvest season. The population hit a high of 3,000 right before
    an attack by Siam in 1821–22, after which the people relocated to Seberang Perak.
    Langkawi was then used as a military base by those fighting Siamese presence in
    Kedah and was eventually surrendered to the British upon the signing of the Anglo-Siamese
    Treaty in 1909.


    ## Beruas (Peninsular Malaysia)


    Beruas is associated with the kingdoms of Gangga Negara and Manjung, a predecessor
    of the Perak kingdom today. believed to be the centre of Gangga Negara before
    it was attacked by the Chola Kingdom in 1025, it was subsequently conquered by
    Melaka in the 15th century, and by the 16th century it was an important trading
    post with an ample supply of paddy.


    ## Klang/Clang/Clan/Callang/Calling (Peninsular Malaysia)


    Archaeological evidence suggests the existence of settlements in Klang in the
    2nd century. Rich in alluvial tin, the region was part of the Melaka Empire between
    the 15th and 16th century.

