    # 一种基于贸易的政体


    塞比兰东部是朱拉（Julah）村，关于朱拉历史的另一部分信息源于 19  世纪下半叶在塞比兰发现的 20 块铭文铜板。塞比兰铭文可以追溯到一千年前，当地人将这些铭文视为*pratima*——具有精神功能的圣像。其中
    10 块铜板保存在塞比兰，另外 10 块在朱拉。这些铜板的尺寸通常为 30 厘米，上面刻有发给朱拉村民的皇家敕令，用古巴厘岛语和古爪哇语写就，并夹杂着一些梵语词。这些敕令由
    10 世纪到 12 世纪间的不同国王颁布，最早的是 Sri Ugrasna，他在公元 915 年至 942 年间统治。铭文指出，朱拉是一个包含七个国家的*曼荼罗*（mandala）的一部分，这可能也包含了塞比兰和帕充（Pacung）。然而，国王并不居住这些沿海港口，而是住在更内陆的地方，靠近巴图尔山口。根据铭文，朱拉是一个繁荣的港口，拥有阶分化的社会，使这个港口定居点具有国际化色彩。港口官员负责检查船货物，并确保朱拉获得周边地区米和其他农产品的供应。其居民中包括祭司和商人，他们被允许制造某些产品，包括撬棍和小武器。


