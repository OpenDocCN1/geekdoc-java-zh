    ![](img/c3e5c3015b89799ae52d8dae1158f750_190_0.png)


    The ruins of a minaret of the Masjid Pacinan Tinggi (Upper Chinese Quarter) in
    Demayon village today, said to be built by Sunan Gunungjungati and extended by
    Maulana Hasanuddin. In the foreground, a Chinese tomb dated 1843.


    Population in 1625 and an attack by Mataram in 1626. Banten''s pepper trade with
    China began to decrease after the Manchus who founded the Qing Dynasty 1645 launched
    a maritime trade ban that prohibited private ships from sailing overseas and the
    export of valuable commodities.


    Fortunately, Banten was able to recover its vigour under the reign of Sultan Ageng
    (Abdulfatah Agung) from 1651 to 1684, who successfully developed Banten on its
    agricultural, trading and maritime strengths. Sultan Ageng''s conciliatory and
    open territory policies attracted merchants from all over the world, transforming
    Banten into a cosmopolitan city. Banten''s port was enlarged, encompassing an
    international port on the west side of the Cibanten River delta and a local one,
    called Karangantu, on the east side.


    Streets and canals were built to facilitate transport throughout Banten, connecting
    the bay to the city and the interior. In 1661, two sea walls were constructed
    to prevent the buildup of silt. Irrigation canals were dug to supply Banten’s
    coconut and sugar plantations.


    Settlements of the English, Dutch, French, Danish, Chinese, Bugis, Makassare,
    Javanese, Sumatran and Balinese communities appeared outside the city’s fortress.
    Sultan Agung, a just and fair ruler, tolerant of other religions, allowing churches
    and temples to be built within these settlements. Several of his ministers were
    foreigners, though all were Muslims. The three outstanding ones were Prime Minister
    Kyai Arya Mangunjaya, economic adviser Kyai Ngabehi Kaystu and architect Kyai
    Ngabehi Cakradana (Tantsekolo), all of Chinese origin. Cakradana, in particular,
    was highly involved in the masterplanning and construction of Banten city.


    Taking his cue from the European fleets, Sultan Agung built a strong armada and
    traded long-distance with Persia, Siam, India, Vietnam, China and the Philippines.
    In partnership with other parties such as the British, Portuguese and Malays,
    Banten’s fleet delivered directly to customers.


    At the same time, the Sultan of Banten continued to extend his rule, acquiring
    Landak in 1661 and Cirebon in 1677, successfully opposing the VOC’s expansion
    into those areas. Truce treaties were signed with the Dutch in 1636 and 1645,
    but conflict with Batavia continued notwithstanding. To defend Banten, each inhabitant
    was ordered to plant 1,000 coconut trees along the Java Ontong River – the border
