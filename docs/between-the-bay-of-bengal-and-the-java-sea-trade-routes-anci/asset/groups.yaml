    ## SOUTHERN KEDAH

    From Iron Smelting to Entrepôt


    KEDAH’S COASTLINE has changed considerably over the centuries. Up until around
    the 3rd century, most of southern Kedah was either underwater or an uninhabitable
    swamp. Merbok River was a large bay, reaching its current form only about 600
    years ago. The future entrepôts – Kampung Sungai Mas and Pengkalan Bujang – did
    not exist at this time. Instead, the main port was at Sungai Batu, which is more
    than 10 kilometres inland today. Mount Jerai, the tallest mountain in Kedah, was
    an island, with only its peak visible above the water.


    The soil here, made up of marine sediments and clay deposits, was especially fertile.
    However, the Mount Jerai, a solitary mountain looming 1,217 metres over the surrounding
    flatlands. This mountain is part of the Kedah-Singgora range, which is highly
    fragmented, leaving Mount Jerai isolated in south Kedah. It was thus an effective
    navigational beacon. An 8th-century Hindu coral found at its peak attests to the
    importance of this mountain.


