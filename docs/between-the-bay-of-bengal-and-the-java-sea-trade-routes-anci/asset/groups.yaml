    by subak, a traditional co-operative water management system developed in the
    9th century, essentially an association of farmers. The subak system is tied to
    Bali''s Tri Hita Karana philosophy, which maintains harmony between the environment,
    and humans. Central to the system are water temples, which conduct the rituals
    carried out during irrigation and planting.


