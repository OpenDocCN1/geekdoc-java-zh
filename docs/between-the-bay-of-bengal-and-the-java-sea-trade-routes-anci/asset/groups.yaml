    中国瓷器展示了唐代中东与中国之间蓬勃发展的贸易。阿拉伯地理学家关于东南亚的最早记录可追溯到9世纪，尽管阿拉伯商人可能在此之前就已经访问该地区。


    1025年，印度南部的朱罗王朝（Chola Kingdom）对室利佛耶（Srivijaya）发起了袭击，削弱了该王国并松动了其对属属国家的控制。这次袭击可能部分由泰米尔商人公会挑起，他们感到受到室利佛耶商人对通往中国贸易路线的控制的限制。在印度南部，诸如
    Manigramam 和 Ainnurruvar 这样的商人协会已经发展了基于产品的垄断，并通过其庞大的网络和私人军队变得强大。这些泰米尔商人公会将将其活动扩展到东南亚的首个证据，源于在泰国南部西岸的港口达库阿亚（Takua）发现的一块9世纪铭文。在东南亚和中国的另外七处泰米尔铭文也同样追溯到朱罗王朝的进攻时期，表明泰米尔人在该地区的存在和影响力得到了扩张。


    室利佛耶的末日以南宋时期中国市场的自由化为标志，这一时期中国人开始直接参与海上贸易，大量中国商人来到东南亚。这种中国人的直接参与可能导致了室利佛耶的消灭。到13世纪（与朱罗王朝的消灭相吻合），中国商人在东南亚港口的数量已超过了他们的印度同胞。


    新的中国贸易产品开始进入东南亚。例如，中国的缠丝玻璃珠（coil glass beads）直到南宋时期才进入东南亚珠子市场。它们取代了随着室利佛耶灭亡而崩溃的印度太平洋珠子工业。在外观、尺寸和颜色上，中国单色缠丝珠与印度太平洋珠子相似，但在成分上，中国珠子的的铅和钡含量较高，这使得它们更重。


    室利佛耶的消灭见证了爪哇的崛起。室利佛耶曾通过外国商人严密控制港口，但现在外国商人——印度、中国和中东商人开始直接前往爪哇答海，刺激了爪哇答北岸和东岸港口的增长。这些港口控制着来自印度尼西亚东部岛屿的香料流量。香料已成为从该群岛出口到国际市场最重要的贸易物品之一。抵达爪哇港的陶瓷、纺织品和铁器等外国货物被运往内陆，交换当地产品，特别是大米。爪哇商人将大米和印度纺织品一起，在东部岛屿交换香料。香料被带回港口交换外国货物，重新开始循环。


    东爪哇在贸易网络中的重要性促成了马芝帕希王国（Majapahit）的兴起。这个王国由拉登·元·维查亚（Raden Yuan Wijaya）于1293年在成功抵御蒙古元朝的进攻后建立。与东南亚建立在港口的政治不同，马芝帕希中心位于内陆城市特罗乌兰（Trowulan）。它由两个港口服务——海港泗水（Surabaya）和河港甘古古鲁（Cangguru），它们相隔42公里，由布兰塔斯河（Brantas
    River）连接。甘古古鲁靠近特罗乌兰，成为马芝帕希通往海岸的主要门户。大米是爪哇内陆的主要产品，被运到特罗乌兰通过甘古鲁出口。道路建设将特罗乌兰与河流连接的地区连接起来，使得整个王国形成了发达的道路系统。马芝帕希在控制海峡地区水域方面并不十分有效，导致了海盗霸权的兴起。


    与此同时，在苏门答腊，尽管在朱罗王朝进攻后马来权力的中心从满义转移到占比（Jambi），但苏门答腊在13世纪后不再是区域贸易的重要参与者。然而，由于对苏门答椒的需求增加，该岛的北岸变得活跃。13世纪到16世纪之间，那里一个重要的政体是苏穆德拉-帕塞（Samudra-Pasai），由苏穆德拉和帕塞这两座双子城组成。15世纪的《帕塞王传》（Hikayat-raja
    Pasai）记载，帕塞是由Merah Silu建立的，并以他的猎狗命名，因为那只狗被鹿吓到了。Merah Silu后来皈了伊斯兰教，采用了名字马利克·阿尔-萨利赫（Malik
    al-Salih）。通过控制苏门答腊北部的胡椒供应，苏穆德拉-帕塞在15世纪初成为马六甲海峡地区最重要的商业中心。


    （注：图片说明整合在下方）

    - 嘉雅·马达（Gajah Mada）是1330年至1364年间马芝帕希才华横溢的大臣。他曾发下了著名的“帕拉帕誓言”（Sumpah Palapa），承诺在成功统一群岛（Nusantara，一个泛指东南亚群岛的词）之前放弃享受任何香料食物的乐趣。

    - 天堂鸟发现于印度尼西亚的巴布亚岛和阿鲁岛。它们因美丽的羽毛被捕猎，并带到印度尼西亚东部的塞尔姆岛（Serum），在那里准备好出口。早在第一个千千年，它们就在爪哇海沿岸港口进行贸易，并出口到中国、印度和中东。

    - 载有中国瓷器的沉船的艺术构图。木船随时间推移而解体，留下了抵抗时间的陶瓷货物。随着中国瓷器风格随时间变化，它们可以被追溯到特定的时期，使其成为时间标记。

    - 丁根高原（Dieng Plateau）Tasik Warna 的嘉雅·马达像。

    - 鼠穴庙（Candi Tikus）是位于特罗乌兰的一个浴场；它代表神灵居住的梅鲁山（Mahameru）。它的名字翻译为“老鼠庙”——这是现代由于深受老鼠困扰的农民从池中取水，相信这可以驱赶老鼠。

    - 一个用于魔法用途的陶瓷碗年代为18世纪。这种碗在中国制造，主要出口到东南亚和印度。碗的中心是一个4x4幻方，周围环绕着“非剑唯阿里，非剑唯主菲凯尔”的文字。

