    ► 鼓身上画有一个脸部，被称为“皮杰珍之月”（Moon of Peejeng）。一对脸部图案是皮杰珍鼓上鼓膜常见的装饰。


    当地铸造的鼓今天被称为皮杰珍鼓，得名于一个村庄，欧洲人在17世纪注意到第一只（也是最大的一只）这种鼓时就在该村庄。这面名为“皮杰珍之月”的鼓目前保存在位于皮杰珍的
    Pura Penaran Sasih 庙，这是一座建立于13 世纪的巴厘岛印度教寺庙。虽然皮杰珍鼓源自越山文化（Dong Son）青铜铸造传统，但它们的形状不同于典型的蘑菇形越山鼓，而是采用了更细长的沙漏形。皮杰珍鼓的独特之处在于上鼓膜上的脸部图案。


    ► 皮杰珍之月。高 18.5 厘米，是迄今发现的皮杰珍鼓。一对脸部图案装饰着它的鼓皮（鼓膜），交织的螺旋图案环绕着中心星形。传说中这面鼓是月亮车的轮子和轴；它在破碎后掉落在地球，因此被称为“皮杰珍之月”。


    除了塞比兰（Sembiran）的发现外，在巴厘岛中部的马巴（Manaba）也发现了铸造青铜鼓的石模，这表明该产业非常广泛。


    它们分段铸造然后连接的，这与一体铸造的越山鼓不同。由于塞比兰的模具是与印度轮盘一起发现的，可以推断巴厘岛寺庙的青铜铸造最早始公元 1 世纪，甚至更早。


    ► Pura Penaran Sasih 是一座建于 1666 年的印度教寺庙，已成为“皮杰珍之月”的所在地。寺庙群的入口是一个叉门（bentar），这是巴厘岛东部和兰望岛常见的建筑特征。


