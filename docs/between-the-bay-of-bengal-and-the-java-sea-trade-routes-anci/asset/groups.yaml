    In February 1820, a fleet of Bugis ships from Dutch-controlled Riau brought some
    500 people as settlers. The Bugis had overtaken the Malays and Arabs as the principal
    traders in the archipelago, and the new settlers were warmly welcomed by Farquhar.


    Indians were one of the minority groups, arriving in Singapore mainly as soldiers.
    Some Indian merchants came from Penang and Melaka. Among the earliest was Riau
    from Penang, who accompanied Raffles in May 1819. He started a brick kiln and
    became Singapore''s first building contractor. For a time, during the 19th century,
    Indians would become the second-largest community after the Chinese.


    Melaka and Riau were the biggest source of settlers. Farquhar had previously served
    as British Resident of Melaka, and his easy-going nature had endeared him the
    title “Raja of Melaka” to the locals to him. Hence, it was easy to induce Melaka''s
    Eurasia, Indians, Malays, Malays and, especially, Chinese Peranakans to move to
    Singapore and be part of the new colony. Further contributing to the exodus from
    Melaka was a cholera epidemic in 1819 and the reintroduction by the Dutch of a
    poll tax on the Chinese. By 1823, 5000 Malays from all walks of life had moved
    to Singapore, including Abdullah bin Abdul Kadir, the Malay scribe who would become
    famously known as Munshi Abdullah, and Tan Tock Seng, a vegetable hawker who rose
    to become one of Singapore''s leading merchants.


    With such rapid growth, the town developed haphazardly, displacing Raffles when
    he made a visit in October 1822. He had envisioned a well-ordered town with clearly
    demarcated areas for government administration buildings, commercial activity
    and living quarters for the different communities. He hired lieutenant Philip
    Jackson, Executive Engineer and Surveyor, and seconded him to the newly formed
    Town Committee, which was charged with laying out the town. Raffles provided explicit
