  mdcn: "\n\n# 作者简介\n\nHeritage Output Lab 的创始人 Mariana Isa 和 Maganjeet Kaur 是研究马来西亚和东南亚历史的独立研究员。通过他们的公司，他们为需要印刷、音频和电影项目提供更多背景资料的机构和个人提供基于研究的服务。《吉隆坡街道名称》（2015年）和《马来亚的城镇》（2017年，与\
    \ Neil Khor 博士合著）是他们的两个代表性著作。他们曾受吉隆坡市市政会（DBKL）委托，担任“旧吉隆坡”（KL Dulu）项目——即吉隆坡文化遗产足迹解释性展牌的遗产顾问。\n\
    \nMaganjeet Kaur 拥有马来西亚科学大学（Universiti Sains Malaysia）的应用科学学士学位和皇家墨尔本理工学院（RMIT）的信息技术硕士学位。\n\
    \nMariana Isa 拥有马来西亚科技大学（Universiti Teknologi Malaysia）的建筑学学士学位和巴斯大学的古建筑保护硕士学位。♦\
    \ \n\n请通过 heritageoutputlab@gmail.com 联系作者。\n\n# 贸易路线、古老港口与文化共性——通往东南亚惊过去的之旅\n\
    \n东南亚人民拥有悠久的共同文化历史。从缅甸到巴布亚，无论居民住在水涝泛滥的沿海平原还是高地，他们都会建造高脚木质房屋。他们的饮食主要是米饭和鱼类。他们参加斗鸡等活动，并痴迷于皮影戏（wayang\
    \ kulit）表演。向客人们提供槟榔是待客之道的基石。\n\n这些特征是如何扩散到整个 450 万平方公里的区域的？尽管东南亚在民族、语言和宗教上具有高度多样性，但对其最好的理解方式是将其视为一个由陆海贸易路线网络交织在一起的地区。\n\
    \n这本具有启发性的书籍追溯了孟加拉湾与爪哇海之间的文化扩散，始于公元前后的最后几个世纪，研究了如印度纺织品、越南铜鼓、瓷器以及来自印度尼西亚群岛的香料等贸易货物。作者带领我们穿梭于许多古代港口城市和王国，例如室里佛逝（Srivijaya），这些地方与贸易路线密切相关，并指出了它们在建筑、文字系统和日常习俗方面的惊人相似之处。\n\
    \n《孟加拉湾与爪哇海之间》一书配有丰富的地图、绘画和照片，带你开启一场探索该地区色彩斑过去的迷人之旅。\n\n"
