    Beads and coloured glass shards constitute the largest portion of these finds.
    Kampung Sungai Mas is believed to have been a bead manufacturing site, as indicated
    by finds of beads with collapsed holes, unpolished beads and beads fused together.
    Imported glass shards from the Middle East may have been melted down to produce
    these glass beads. Kampung Sungai Mas could also have acted as the export port
    for Kuala Selincing, a bead manufacturing site in Perak.


    Chinese ceramics have also been recovered, mainly from the Tang and Song periods,
    including Ding and Yu ware. The Middle Eastern ceramic finds include Sasanian-Islamic
    ware and the three-coloured ''splashed sgraffite'' ware. All four ceramic types
    have also been found at Ko Khao Khao in southern Thailand.


    As mentioned, Kampung Sungai Mas is postured to have been the export port for
    Kuala Selincing, a bead manufacturing site in Perak.


