    ## 马六甲的诞生


    # 15世纪初马六甲之所以成为转口港，很大程度上归功于它的地理位置，它坐落在两大主要文明之间——东部是明朝中国，西部是印度王国。但它大约在1402年由来自满者（Palembang）的叛逆皇子丹霹士惹（Parameswara）建立，当时贸易并非他首要考虑的事情。


    丹霹士惹当时在躲避暹人的追捕，因为他杀死了其封属国淡士锡（Temasek）的统治者，暹人对他悬下了赏金。在沿着马来半岛西岸逃亡时，丹霹士惹发现了一个拥有众多走廊和路径的隐身之处，这里的土地对于防御暹人的进攻具有战略意义。他在这里建立了一个新的定居点，被称为马六甲。他的儿子在白淡姆河（今马六甲河）山口附近的山顶加固了一座住所，从那里，他们的人们时刻监视着经过马六甲海峡的船只。


    马六甲的原住民大多数是海吉普赛人或渔民，通常被称为Orang Seletar。丹霹士惹与他们建立了联盟，将这个新城建立为一个可行的停靠港，因为其位置使得它四季都可以通行。在这些忠诚的Orang
    Seletar贵族的帮助下（他们的追随者乘坐小船在海上巡逻），海盗活动得到了减少。


    随着这个海港的日益显赫，马六甲开始吸引远方的商人，导致阿拉伯和印度商人来到岸边。显然是这些穆斯林商人向中国朝告知了丹霹士惹的新港，以及中国马六甲作为商业枢纽的潜力。中国为了贸易进行的海洋探索证明对于这个昔的渔村来说是及时的。永乐年，由海军将姚庆率领代表团出发马六甲，于1403年抵达，并报告人口超过2000人。


    丹霹士惹抓住机会向皇帝宣誓效忠，以获得中国的支持对抗他的对手暹罗。1405年，他派遣使节向皇帝朝贡，并被承认为马六甲的独立统治者。从那时起，定期向中国运送包括胡椒、木材和宝石在内的贡品，换取抵御暹罗和满者腊加入侵者的保护。丹霹士惹的继承者会亲自拜见明皇帝寻求庇佑，并确认两个王国之间的紧密关系。这一传统一直持续到马六甲最后一位苏丹马哈穆德德（Sultan
    Mahmud，卒于1528年）统治时期。


    穆斯林中国宦官郑和于1409年首次带着他的“宝船队”抵达马六甲。他代表明皇帝将该领土提升为中国的藩属国。他在马六甲港口附近建立了一个区域总部，自此，一个庞大的中国贸易社区开始在镇定居。根据旅行者马环的描述，郑和的仓库是一个像栅栏一样的城堡，有四个墙门。围墙内有保护的仓库和粮仓，储存着钱、食物和其他物资。


    马六甲成为郑和西行航行的终点，是通往中国货物的存储中心。中国旅行者描述马六甲的公共建筑，尤其是皇宫，类似于中国的皇宫。郑和和他的部下被认为是向小镇引入永久性建筑的人，取代了当地的木材、竹子和尼帕棕榈结构。据报道，皇宫使用了郑和从中国带来的屋瓦。


    -   在马六甲发现了明、清、爪陶、斯瓦纳洛洛、素可泰、安南和日本波斯风格的陶瓷碎片——这反映了在该城市发生的繁华的国际贸易。


    中国在马六甲的存在提升了其地位。明朝作为当时最大的胡椒购买者，是马六甲的主要贸易伙伴，带来的订单包括瓷器、龙香、丝绸、汞、铜和朱砂。


    马六甲海峡是香料之路的一部分，但纺织品是马六甲作为贸易中心的核心。印度纺织品是交换香料的最重要商品。这对于棉纺制造和纺织设计中心古吉拉特来说是一个优势。在坎贝（Cambay），来自马拉巴尔、阿拉伯和科罗曼德尔的商人汇聚并组成公司，租用古吉拉特的船只前往马六甲。他们用各种棉织物和染料充斥马六甲，以换胡椒、森林产品、樟脑和安香。来自孟加拉和苏门腊的生丝也备受推崇。


