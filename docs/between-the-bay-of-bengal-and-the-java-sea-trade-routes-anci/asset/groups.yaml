    We hope that this book will set you on a stimulating journey through Southeast
    Asia, including many less well-known places that have played a more important
    role in the region''s history than their current state might suggest. Our belief
    is that this zone lying between the Bay of Bengal and the Java Sea tells one of
    the most fascinating stories of disparate politics knit together by cultural diffusion
    borne on the back of trade and commerce.


