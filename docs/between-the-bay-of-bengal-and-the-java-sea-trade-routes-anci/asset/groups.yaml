    SRIVIJAYA, TRANSLATING TO “auspicious victory” in Sanskrit, was a port-city situated
    in present-day Palembang, capital of Indonesia’s South Sumatra province. Its location
    at the bottom of the Straits of Melaka allowed it to control the traffic flowing
    through the Straits between India and China, and to serve as a key transit port.
    Srivijaya developed strong connections with both Tamralipti (Tamluk) and Canton
    (Guangzhou), the start and end points of these trade routes. Its ambitions led
    it to achieve hegemony over its neighbours and become a powerful maritime kingdom
    between the 7th and 11th centuries.


    The Chinese knew Srivijaya as Shih-li-fo-shih during the Tang Dynasty and subsequently
    as San-fo-chih (Sanfoqi). In fact, most of what is known of Srivijaya comes from
    Chinese writings. Its earliest-known mention appears in the work of Yijing, a
    Chinese Buddhist


