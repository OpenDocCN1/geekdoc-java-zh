    # 第一章

    # 妙乌（MRAUK-U）

    ## 罗兴信古都


    位于现代缅甸的妙乌镇曾是一个繁荣的港口，距离海岸约60公里。到16世纪时，妙乌已成为位于加拉丹河（Kaladan River）上的主要强权。它位于山脉与孟加拉湾之间的位置确保了其作为东南亚重要节点的地位。到17世纪中期，妙乌成为罗兴（Rakhine）的首都，作为王室居所了355年。


    妙乌的故事始于1403年，当时信信信（Min Saw Mun）被拥为罗兴国王。不幸的是，他的统治在1406年中断，当时来自缅缅部的因瓦（Inwa）进攻并攻占了他的首都。信信信逃往孟加拉，在其廷寻求庇护。在流亡期间，他与孟加拉的统治者建立了密切的关系，特别是苏丹贾拉鲁丁·穆哈默德·沙阿（Sultan
    Jaluddin Muhammad Shah）。他在战斗中的表现被证明特别有帮助。作为苏丹军队的指挥，他帮助击退了多次针对苏丹国的袭击。1429年，苏丹报了这一大恩，派遣了一支大军帮助信信信重返并回到首都。但这样做是有代价的。罗兴现在成为孟加拉苏丹国的属国，并保持了大约一百年的状态。


    信信国王希望让罗兴再次繁荣。为了实现这一点，他需要强大的首都，而龙格（Launggget）并不达标。它位于平原上，难以防御敌人的进攻。最近的入侵也让它变得糟糕，一系列不吉之兆（包括闪电击中宫殿）预示着是时候搬迁了。位于群山环绕的山谷中的妙乌（Merauk-U）位置非常理想。天平向他倾斜的是国王及其随从者在那里见到的奇特现象，特别是三三个事件：一只被猫追逐的老鼠转过身来追猫；一只鹿反击了老虎；一只被蛇追逐的青蛙转过身咬住了蛇并吃掉了一部分。这些事件说明了弱者也可以击败敌人。


    据传妙乌的名字源于“myauk”（猴）和“u”（蛋）这两个词。民间传说，一只猴后和一只孔雀在两个蛋中孵出了两个美丽的女孩。这幅悬挂在胜达贡佛塔（Shittthaung
    Pagoda）的画作展示了佛祖预言妙乌这座大城。皇室夫妇出现在前景，皇后手里拿着两个蛋。一个魔鬼在夫妇身后跪着。或者，学者们称妙乌在古阿坎语中意为“第一成就”。


    妙乌：罗兴古都 · 37


