    # INTRODUCTION

    THE DEVELOPMENT OF TRADE & PORTS IN SOUTHEAST ASIA


    ONE OF THE MOST remarkable features of Southeast Asia is its diversity. This geographical
    region, encompasses 11 modern nation states, is home to more than 1,000 distinct
    languages; its ethnic groups are equally diverse and belief systemsmultif. A closer
    look, however, reveals many cultural similarities. From Myanmar to Papua, people
    built wooden houses on poles, whether they lived in flooded coastal plains or
    in the highlands. The practice of chewing betel, an intoxicant made of areca nut,
    betel leaf and lime, became entrenched in traditions of hospitality and


    +   ▼ The tongkonan is the traditional house of the people of South Sulawesi.
    These houses are built high on stilts and have boat-shaped roofs. The form of
    these houses is said to be reflected in the motifs on Vietnamese Dong drums.


    ![](img/c3e5c3015b89799ae52d8dae1158f750_9_0.png)'
- md: '

    A lion head made of sandstone, dated to the 10th century, found at Tra Kieu, Quang
    Nam province, Vietnam. Tra Kieu was a Cham royal city and it was previously known
    as Simhapura city, making it the first "lion city" of South-East Asia.


    A partial Dong Son drum from Sangpang Island, Indonesia. These large mushroom-shaped
    bronze drums take from Dong Son in northern Vietnam. Four frogs are embedded on
    the drum''s tympanum – croaking frogs herald rain, important in agricultural society.


    The Ngoc Lu drum, unearthed in 1893 in Vietnam, featuring motifs on its tympanum.
    Notice the house in it with a still with a saddle roof at the centre of the drawing
    – types of houses were common throughout Southeast Asia, e.g. the tongkan houses
    of South Sulawesi. Observe also the process of men carrying instruments and feathered
    headdresses, which were also worn in parts of the southern islands.


    ![](img/c3e5c3015b89799ae52d8dae1158f750_10_0.png)


    wedding ceremonies. Finding stories based on the courage of weaker animals in
    the face of stronger ones, like Melaka''s mousedeer kicking a dog, echo across
    the region. The name "Singapura" (lion city) is unique to Singapore but has been
    used for a number of cities across Southeast Asia.


    This transmission of culture, beliefs and stories across the region took advantage
    of the numerous trading networks, comprising both land and sea routes, intersected
    with one another, providing the opportunity for products and culture to be widely
    dispersed. Two ancient prestige products from Vietnam – Dong Son drums and Sa
    Vinh pottery – have been found as far as Sumatra in the west and Bird''s Head
    Peninsula, West Papua, in a carbonised nutmeg from the eastern Indonesian islands
    dating to 400–300 BCE found in India points not only to the antiquity of these
    networks but also to the participation of local products in international markets.


    The wide dispersal of products and culture was no mean feat, considering that
    a large part of Southeast Asia is insular – that is, made up of islands. The key
    nodes in the trading networks were seaports and river ports, which consolidated
    products from their hinterlands.


    ![](img/c3e5c3015b89799ae52d8dae1158f750_11_0.png)


    ![](img/c3e5c3015b89799ae52d8dae1158f750_11_1.png)


    Between the Bay of Bengal and the Java Sea


    Two monsoon seasons hold sway in Southeast Asia. Boats travelled to Southeast
    Asia on one monsoon and returned on the other. (Wait, the text says: Two monsoon
    seasons hold sway in Southeast Asia. Boats travelled to Southeast Asia on one
    monsoon and returned on the other. The north-east monsoon builds up in November
    with strong winds blowing in November and December across the South China Sea.
    The winds gradually weaken from February and start withdrawing at the end of March.
    There is a transition period in April when the winds bring boats towards eastern
    Indonesia. The southwest monsoon builds up in May and is in full force June and
    August. The winds weaken gradually and disappear in November. The cycle then starts
    again.)


    Sea routes from India to Southeast Asia. Boats from Tamralipi in Bengal tended
    to hug the coastline, taking advantage of the coastal ports like Bago. Crossing
    the Bay of Bengal directly from the northern coastline of India, boats would sail
    straight for Dawe on the Taninthary Peninsula. From South India, there were two
    options. Boats could either take the route between the Andaman and Nicobar islands
    to reach Takuapa, or the route between the Nicobar Islands and the Aceh homeland
    to reach Kedah.


    ![](img/c3e5c3015b89799ae52d8dae1158f750_12_0.png)


    ![](img/c3e5c3015b89799ae52d8dae1158f750_13_0.png)


    Riding the monsoons to India and China, the boat-dwelling sea nomads distributed
    these goods to markets outside the region. Southeast Asian jungle and sea produce,
    such as tortoise shells, pearls, aloe-wood, sandalwood, camphor and spices, were
    considered exotic. The sea nomads were expert navigators, looking to the skies
    and the seas for guidance. The stars, clouds, birds, sea animals and wave patterns
    allowed them to navigate safely the waters between Madagascar in the Indian Ocean
    and Easter in the Pacific. Their grit and purpose drew admiration from the Greek
    philosopher Pliny the Elder, who wrote they were driven by the "spirit of man
    and human courage". Their navigational skills would later be sought by the Chinese
    and Portuguese.


    The 1st century saw increased trade in the region, stimulated by Indian traders
    turning their attention eastwards. India''s main trading partner had hitherto
    been Rome, but declining trade saw them Bas-relief of a ship carved on a panel
    at Borobudur, the monumental 9th-century Buddhist temple in Java. This ship is
    said to be a typical Southeast Asian vessel of the time. A Chinese document from
    the 3rd century describes the ships as 50 metres long and 5 metres above sea level,
    and able to hold up to 1,000 tons of cargo and 700 passengers. In, the Samudra
    Raksha, a life-size replica of Borobudur, was sailed from Jakarta to demonstrate
    that these ships were capable of making open sea journeys.


    They took the maritime route across the Bay of Bengal to Funan, a Southeast Asian
    polity centred at the lower Mekong delta, where Chinese diplomats and emissaries
