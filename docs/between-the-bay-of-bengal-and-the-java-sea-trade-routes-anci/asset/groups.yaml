    科内利斯·德·霍特曼（Cornelis de Houtman）在1595–97 年远往东印度群岛航行期间，在万丹（荷兰语称为Bantam）遇到的人肖插画：


    - 一位马来商人和他的凯林人（Keling）妻子

    - 中国商人

    - 一个由三名音乐家组成的爪哇甘兰乐队


