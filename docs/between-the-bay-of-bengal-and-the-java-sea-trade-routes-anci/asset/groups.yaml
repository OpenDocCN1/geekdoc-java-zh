    A piece of cinderai cloth, a local version of the Indian patola. This traditionally
    used as a selendang (shawl) by Malay women and as a bengkung (cummerband) by the
    men. Its high-quality ikat weave gave it strength (virtually stab-proof if worn
    in layers), leading people to associate it with mystical powers and immortality.


    Clothes had important symbolic and ceremonial functions in the Malay Archipelago.
    Many believed that as gifts they bestowed well-being and fertility, and ancestral
    spirits. Wooden, metal or stone figures, for example, were powerless until bestowed
    with clothes and perfumes. Silk was prized for royal clothing, and silk robes
    were often awarded to those favoured by the Sultan. Members of the Melakan royal
    court wore silk to distinguish themselves from commoners, who wore cotton. On
    the whole, however, cotton was the preferred material in the region and in some
    places fetched higher prices than silk. It was also used in the shipbuilding industry
    to make sailcloth.


    Both raw and manufactured textiles that arrived in Melaka were sought after by
    Sumatraran traders, who took them to coastal weaving centres such as Palembang
    and Champa. There, the local weavers adopted the style and patterns of Indian
    fabrics, which are still apparent today in traditional Malay handloom fabrics
    such as kindai cloth, an imitation of the brightly coloured Indian patola. Some
    Indian fabrics were even designed to meet the ritual requirements of the Southeast
    Asian market.


    Another major source of textiles was the Coromandel Coast. Textile and yarn exports
    for Melaka were shipped out from the port of Anandarayan Pattinam in Pulicat,
    the region''s richest and most active cotton producer. The hand-woven chequered
    or striped lungi produced in Pulicat was so popular that it became a common attire
    in the Malay Archipelago, Ceylon and the Arabian Sea. Till today, this cloth is
    known as pelikat in the Malay region.


    The extent of the Melaka kingdom grew under sultan Muzaffar Shah (r. 1445-56),
    stretching from the Muslim Malay settlements of Bukit (Phuket), Setol (Satun)
    and Pattani bordering the Ayutthaya Kingdom in the north to the southwest.


    The port-city itself was divided into two sections by the Melaka River and connected
    by a timber bridge housed 20 shop-pavilions. To the east of the river, the Sultan
    and him resided within the kota raja (royal fort). The palace, administration
    offices, a mosque and residential quarters for royal courtiers were built within
