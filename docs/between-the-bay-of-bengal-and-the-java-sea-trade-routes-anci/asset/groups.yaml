    他们在那里能够用 5–10 个椰子换取一个两指大小的铁锭。这些铁锭是尼科巴尔岛人梦寐以求的，可能是运往南亚的船只所携带的贸易物品。


    在双打巴图（Sungai Batu）考古遗址，目前已鉴定出至少 17 处炼铁遗址。炼铁在该地点的不同时期进行，有些甚至可以追溯到公元以前。一个遗址（称为 SBG）在
    11 世纪至 13 世纪之间活跃，而另一个（SB2A）连续使用了至少 400 年，从 3 世纪持续到 6 世纪。有趣的是，SB2A 在 17 世纪至 18
    世纪之间恢复了生产。此外，在石河发现作为码头的遗址表明，铁锭是通过水系出口的——最初，船只可能直接航行到双打巴图，随后，较小的船只可能将货物向下运到新的转口港。


    位于甘榜加丁（Kampung Gading）的炉址。该遗址在 4 世纪至 12 世纪之间活跃，与双打巴图的一些遗址同期。该遗址位于切皮尔河（Chepir River），靠近其与姆达河（Muda
    River）的分叉处。河流流向马六甲海峡，可能是这里生产铁锭的运输通道，而默博克河（Merbok）为双打巴图提供了这一功能。


    吉打南部：从炼铁到转口港 · 85


    - 这座位于双打巴图考古遗址内的结构被认为是一座宗教纪念碑。它的形状相当奇特——圆形底座上覆盖着一个方形结构，而方形结构上方又覆盖着一个圆形结构。铭文发现物（包括六块金碎片和一块石头）确定了该结构与佛教的联系。


    遗址北部区域的一处独特结构引起了大量推测。这座土砖结构被推测是一座宗教建筑，由三个部分组成：一个圆形底座，上方是一个方形结构，方形结构上方又是另一个圆形结构。圆形底座表明它可能是一座佛教塔。从顶层出土的由一块石头和六块金碎片组成的铭文发现物为这一观点提供了支持。


    那六块铭文金碎片想起了布基图帕庄园（Bukit Tupah Estate）的碎片，那里的铭文被认为是菩萨的名字。


    那块石头刻有句子，与在甘榜本当达姆（Kampung Bendang Dalam）发现的铭文石相似。由于两处铭文之间的相似性，双打巴图铭文石也被定于 6 世纪和
    7 世纪。对该结构最底层砖块的年代测定显示其日期为公元 110 年，表明该结构从 2 世纪起一直在使用。


    - 这块在双打巴图纪念碑顶层发现的石头上刻有八句话。铭文使用的是锡瓦格兰塔文字（Siva Grantha script），根据其与布江河（Bujang River）附近及双马河（Sungai
    Mas）发现的铭文的相似性，定于 6 世纪至 7 世纪。这两个地点的内容被确定是大乘佛教经典《萨伽罗妈妈提问》（Questions of Sagaramati）中的诗节。


    ## 转口港


    吉打最早的转口港被认为位于甘榜双马河（Kampung Sungai Mas），它位于特鲁斯河（Terus River）西岸的一个桥脊上。虽然它现在距离海岸有
    4 多公里，但它曾一度是一处沿海定居点，在早期阶段可能作为海港而非河港发挥作用。其年代定于 5 世纪至 10 世纪之间，大量各种来源的贸易物品证实了其转口港的地位。


    两块在吉打南部发现的 5–7 世纪石板，刻有塔的图像。塔周围的铭文包含了与业报（karma）相关的佛教诗。两块石板都被认为是信徒在各自的寺庙（candi）中的供奉品。


    - 甘榜双马河铭文石。除了业报诗，它还有一段“耶法”（Ye dharma）信条。该石碑现藏于布江谷考古博物馆。


    - 佛华达古普塔（Buddhhadagupta）铭文石，发现于瓜尔肯帕（Guar Kepah）附近。除了业报诗外，铭文还提到了一位来自拉克塔姆蒂卡（Raktamtika）、名为佛华达古普塔的海军。“拉克塔姆蒂卡”翻译为“红土”，最初被认为是赤图（Chitu），位于半岛东岸。根据
    7 世纪赴印度的佛教僧玄奘的一份晦涩中文稿中的记载，它也可以被认为是西孟加拉邦拉杰巴迪丹加（Rajbadidanga）的一座古代寺院。原件藏于加尔答印度博物馆。


    吉打南部：从炼铁到转口港 · 89


    珠子和彩色玻璃碎片是这些发现物的大部分。甘榜双马河被认为是一个珠子制造地，发现的孔孔珠子、未抛光的珠子以及融合在一起的珠子证明了这一点。来自中东的玻璃碎片可能被熔化制成这些玻璃珠。甘榜双马河也可能作为吉拉雪林辛（Kuala
    Selincing）的出口港，后者是霹雳省的一处珠子制造地。


    还发掘了中国陶瓷，主要来自唐宋时期，包括定窑和越窑。中东陶瓷发现物包括萨珊伊斯兰风格瓷器和三色“斑花釉彩瓷”。这四类陶瓷在泰国南部的考考耶（Ko Khao
    Khao）也有发现。


    如前所述，甘榜双马河被认为是霹雳省吉拉雪林辛珠子制造地的出口港。


    与甘榜双马河同期的还有布江岸的遗址，年代至少可追溯到 7 世纪。随后，位于河流与默博克河汇合处上游约 7 公里的彭加兰布江（Kampung Pengkalan
    Bujang）成为布江河上主要的转口港。


    从这些遗址中回收的物品包括南宋和元代的陶瓷碎片。宋瓷包括大量高质量的龙泉青瓷。此外，还发现了大量 17 世纪的中国和越南青花瓷，但显著的是没有发现更早的明代青花瓷（例如
    15 世纪的）。这表明彭加兰布江可能在 14 世纪作为港口衰落了，但在 17 世纪得到了复兴，也许由于以下因素的推动：


    - 一个在甘榜双马河发现的储汞容器。另一个容器发现于彭加兰布江（Penjalan Bujang）。汞可能来自砂拉越，那里以出口汞闻名。汞用于金矿。它还被认为是锡瓦之神的“种子”；在巴图帕哈特庙（Candi
    Batu Pahat）的金属箔上发现了汞的痕迹。


    表明佛教在这一时期广泛流行。


    90 · 孟加湾与爪哇海之间


    在甘榜双马河发现的一件年代定于 9 世纪至 13 世纪的宋代陶瓷。


