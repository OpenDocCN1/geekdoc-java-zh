    - 1456年至1498年。一份19世纪初的手稿，其中包含了《马六甲海事法》（Undang-Undang Laut Melaka），这是一部规范海上规章、航海程序、航海事务、奴隶、通奸、谋杀、债务偿、盗窃、税收和衡量的法典。


    通过1497–99年达·伽马的印度远征，马六甲富足的消息传到了葡萄牙国王埃曼纽尔一世手中。在征服果亚和霍尔木兹后，他在1508年4月派遣了迪戈·洛佩斯·德塞奎拉（Diogo
    Lopes de Sequeira）率领四船，后者在1509年9月抵达时最初获得了进入马六甲贸易站的许可。古拉人和爪哇商人戒备葡萄牙渗透香料贸易的意图，怂使宰宰穆塔希尔（Bendahara
    Tunun Mutahir）背叛了协议。塞奎拉遭到伏击，在街上被杀害，另20人被俘。此举产生了灾难性的后果。


    当马六甲贸易处于巅峰时，其管理层已变得软弱且压迫，充满了腐败、背叛和内部权力斗争，尤其是在1498年宰宰敦佩拉克（Bendahara Tun Perak）去世后。1510年，尽管缺乏证据，马哈穆德苏丹（Sultan
    Mahmud，在位1488–1511）仍因叛国和诽谤处决了他的宫廷成员。


    1511年6月，由阿尔方索·德·阿尔布奎尔克（Alfonso de Albuquerque）领导的一支拥有17艘船和1200人的葡萄牙舰队抵达马六甲海域，寻求为被死的同胞报仇并营救那20名俘虏。马哈穆德苏丹正计划攻击阿鲁（Aru）和巴西赛（Pasai），这是海峡沿线剩下的两个独立王国。他心神不定且缺乏经验丰富的顾问，谈判得相当糟糕，起初拒绝在没有和平协议的情况下释放葡萄牙人。他最终释放了俘虏。


    > ▼ 1509年葡萄牙人抵达马六甲的插图。塞奎拉的代表特谢伊拉（Teixeira）骑着大象进入宫殿，向苏丹呈交了礼物和埃曼纽尔一世国王用阿拉伯语写的信件。


    但他低估了阿尔布奎尔克，后者现在要求30万*克鲁萨多*（cruzados）的巨额赔偿以及在马六甲建造堡垒的授权。马哈穆德苏丹拒绝了，战斗爆发了。


    马六甲帝国的全部力量被动员了起来。从马六甲的属地——彭亨、因德拉吉里、勿兰腊和锡亚/敏加包派遣了军队，同时从爪哇招募了佣兵。葡萄牙人面对的是总计2万名士兵、土耳其和波斯弓箭手、大口炮以及20头战象。


    不幸的是，马六甲的火炮简陋且缺乏枪手。战斗第40天，阿尔布奎尔克占领了城镇桥梁并攻占了城市。由于之后没有援军，马哈穆德苏丹被迫退到贝塔姆（Bertam）。阿尔布奎尔克一直留在马六甲直到1511年11月，在洗劫国库后焚掉了城市。穆斯林商人被屠杀或卖为奴隶。


    葡萄牙人派遣使节前往中国，寻求作为马六甲新统治者的承认，但请求被拒绝了。中国皇帝发布了诏，命令所有其他国家协助马六甲——但无人听从。尽管失去了首都，马哈穆德仍对其帝国其他地区行使权力，并在民丹（Bintan）建立了新首都，但葡萄牙人在1526年将其夷为平地。他的反击行动未能夺回马六甲。然而，他的后代穆扎法尔（Muzaffar）成为了霹雳（Perak）的统治者，而他的另一个儿子阿拉乌丁（Alauddin）则建立了柔佛苏丹国。


    葡萄牙人拆除了马六甲的整个皇室，将清真寺和宫殿的建筑材料回收用于建造一座新教堂和建筑。他们在苏丹堡遗址上建造了一座被他们称为“A Famosa”（意为“著名的”）的堡垒。


    马六甲的沦落破坏了贸易网络。商人将业务转移到邻的市场港口，如亚齐、柔佛、爪哇和八打。葡萄牙人接管八年后，年度船只流量从100次降至10次。马六甲后来于1641年被荷兰人征。他们重建并加固了旧葡萄牙堡垒，但他们的规定要求所有中国帆船必须在巴达维而非马六甲贸易，使这座城市沦为浪漫的废墟。1807年，英国人拆除了马六甲的堡垒，只留了一个小门楼。


    > 葡萄牙人征服马六甲不久后的写草图。阿尔布奎尔克的堡垒A Famosa于1512年1月竣工，平面呈方形，有一座120英尺高的主楼。荷兰人在1641年接管马六甲后，对原始堡垒进行了大规模的修复和扩。


    葡萄牙人抹除了位于圣保罗山山顶皇宫的所有物理证据。今天所看到的是一座葡萄牙教堂的遗迹。


    穆士河全长750公里，是室夷齐（Srivijaya）的命脉。室夷齐位于现今的勿兰腊，是苏门答腊南部。它位于海峡底部的位置使其能够监控印度和中国之间的交通，在7世纪至11世纪之间成为了强大的王国。


    事实上，关于室夷齐的大部分信息都来自中国的文献。义净（Yijing）是一位于公元671年从印度访问该城市的中国佛教僧。到那时，室夷齐不仅已作为一个贸易港口立足，而且还是佛教学习的中心。义净从广州登船寻找室夷齐统治者，并直达室夷齐，这表明这两个城市之间的贸易联系可能已经在使用。他花费了六个月等待季风变化以继续前往印度的之旅，并利用这段时间在港口外的一所大院学习sabdavidya（梵文语法）。


    关于室夷齐最早的记载出现在中国文献中，被称为“三波”（Shih-fo-chih）。


    这些政策最初作为南亚和中东产品进入中国的中介。然而，随着时间的推移，他们能够为当地产品创造需求。例如，乳香和没药这两种在中国极受欢迎的西方产品，分别被松脂和脑香取代。胡椒和樟脑由东南亚商人于6世纪初引入中国市场。樟脑在中国受到极推崇（主要是因其药用价值），以至于其价格与黄金等值。


