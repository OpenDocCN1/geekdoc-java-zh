    # Entrepôt Trade


    Bago developed into a major entrepôt as products from neighbouring regions were
    channelled to the city, making it unnecessary for traders from the West to travel
    all the way to other ports of maritime Southeast Asia or China, and vice versa.
    Common goods exported through Bago included rice, sugar, tin copper, beeswax and
    musk. However, Bago was famously predominantly for lac, houses, gemstones and
    teakwood.


    Lac is a dark-red resin secreted by a few species of insects. After it has been
    refined and cleansed, colour is added, making a range of colour options available.
    The lac from Myanmar had a reputation for being very high quality. A key use for
