    the Bujang River and at Sungai Mas. The two locations have been identified as
    stanzas from the "Questions of Sagaramati", a Mahayana Buddhist sutra.


    ## The Entrepôts


    The earliest entreôt in Kedah is believed to have been located at Kampung Sungai
    Mas, which is situated on a peratang (bridge ridge) on the west bank of the Terus
    River. Although it lies over 4 kilometres from the coast today, it would have
    been a coastal settlement at one time and, in its early days, probably functioned
    as a seaport rather than a river port. Dated between the 5th and the 10th centuries,
    its entreôt status has been confirmed by the numerous finds of trade items of
    various origins.


    Two stone tablets from the 5th–7th century, engraved with the image of a stupa,
    found in southern Kedah. The inscriptions around the stupa contain a Buddhist
    verse associated with karma. Both tablets are believed to have been votive offerings
    by pilgrims at their respective candi.


    - The Kampung Sungai Mas Inscribed Stone. In addition to the karma verse, it also
    has a "Ye dharma" credo. The tablet is housed at the Bujang Valley Archaeological
    Museum.


    - The Buddhhadagupta Inscribed Stone, found near Guar Kepah. Apart from the karma
    verse, the inscriptions mention a sea captain named Buddhhadagupta from Raktamtika.
    Translated as "Red Earth", Raktamtika was originally thought to be Chitu. Located
    on the east coast of the Peninsula. It can also be identified with an ancient
    monastery at Rajbadidanga in West Bengal based on its mention in an obscure Chinese
    manuscript by the Buddhist monk Xuanzang, who travelled to India in the 7th century.
    The original tablet is housed at the Indian Museum, Kolkata.


