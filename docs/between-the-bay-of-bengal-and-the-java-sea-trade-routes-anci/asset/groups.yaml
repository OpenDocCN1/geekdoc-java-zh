    有趣的是，从中国运来的最大货物是人，被带往矿区定居点提供劳动力。每年有约6,000至8,000名中国移民抵达新加坡。其中约八分之一留在了新加坡，其余的大多散落在邦加（Bangka）和马来半岛的锡矿、彭亨（Pahang）的金矿以及婆罗洲西岸的矿区。到1845年7月，中国人占了新加坡总人口的56%，而到1867年，这一数字已增长到75%。


    - 英国人首次航行新加坡时，使用的是位于 Pulau Blakang Mati（今为圣淘沙岛）南部的新加坡海峡。大陆与柔佛/Pulau Blakang 之间的海峡当时尚不为人知。福尔哈在1819年8月发现了它，但直到30年后，它才得到了适当的测量和开发。由于岸边水深，这里非常适合大型船只。新港于1886年建成，并于1900年更名为吉葛坡港（Keppel
    Harbour）。


    新加坡：城市的两个建立 · 173


    - 位于高林码头（Collier Quay）的约翰逊码头（Johnston’s Pier）位于福临广场（Fullerton Square）对面，该码头建于1855年，直到1933年拆毁前一直是市区主要的登陆点。它的角色被位于高林码头更处的克里福德码头取代。


    帆船提供的一项重要服务是让新加坡的中国居民通过这些帆船船长向中国的家人汇款，船长从汇款中提取抽成。


    较小的快速帆船在4月东北季风的末尾抵达，唯一目的是收购鸦片。它们不携带货物，用金条支付鸦片。然后它们通过贿赂港口官员将鸦片走私运往广州。


    但新加坡从未成为英国东印度公司（EIC）设想的鸦片中心，因为大部分鸦片直接从印度运往中国。例如，在1835–36年间，有48箱鸦片进口中国，而有30,202箱直接从印度进口。来自新加坡的进口仅占中国总进口量的1.4%。然而，新加坡成为了向地区锡矿定居点和种植园分销鸦片的枢纽。


    1869年苏伊士运河的开通加速了从帆船到蒸汽船的转变。与单程旅行相比，蒸汽船每年可以在欧洲与远东之间进行三次航行。这标志着快速帆船的终结，这些帆船于在印度和中国之间穿梭，除非需要补充淡水等物资，否则会绕过新加坡。苏伊士运河的开通赋予了新加坡战略位置的重要性。其安全的锚地良好的泊位设施确保了它成为首选停靠港。今天，它是世界上最大、最繁忙的港口之一。


    一块高3米的巨石裂成两半，立在现在的福临酒店所在地。在断裂的表面上刻有约50行文字。这些铭文本可以提供新加坡早期历史的价值信息，但直到1843年新加坡河口施工期间巨石被炸成碎片。只有三个碎片被救起。图中被称为“新加坡石”的底部残片现藏于新加坡国家博物馆。


    新加坡：城市的两个建立 · 175


    ## 税收经营


    税包（REVENUE FARM）是政府授予的一种许可，允许分发——并对特定物品或活动征收税。在新加坡最常见的税包涉及酒类、鸦片、赌博、卖妓和当铺。政府通过公开拍卖出售这些物品的分发权。中标者（通常是会馆，即商业财团）向政府缴纳固定金额，然后就可以自由地向客户收取其认为合理的任何金额。对于预算紧张的政府来说，这种制度有效地消除了维持征税劳动力和基础设施的需求。


    这些税包中，利润丰厚且争夺最激烈的是鸦片包。新加坡的许多秘密社战争都是为了控制这些税包。鸦片以原料形式进口，并由当地鸦片包经营者转化为消费形式——在马来语中称为
    *chandu*。最大的消费者是在锡矿和种植园工作的中国工人，而这些地方最终由会馆控制。会馆要求工人通过他们购买消费品（食物、酒、鸦片），从而让会馆能够收回工人工资的大部分。大多数工人是契约工，随着他们成瘾，他们陷入了债务的恶性循环，不得不以高价从会馆购买
    *chandu*。一些历史学家认为，如果没有鸦片，中国资本家在19世纪将很难维持经营。


