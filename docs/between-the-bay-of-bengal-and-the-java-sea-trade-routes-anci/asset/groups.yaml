    # CHAPTER 1

    # MRAUK-U

    ## Ancient Capital of Rakhine


    The town of Mrauk-U, in modern-day Myanmar, was once a thriving port, located
    some 60 kilometres from the coast. By the 16th century, Mrauk-U had become a major
    power, situated on the Kaladan River. Its location between the mountains and the
    Bay of Bengal ensured its status as an important node in Southeast Asia. By the
    mid-17th century, Mrauk-U was the capital of Rakhine, which stood for 355 years
    as the abode of kings.


    The story of Mrauk-U starts in 1403, when Min Saw Mun was installed King of Rakhine.
    His rule was unfortunately cut in 1406 when the Inwa from central Myanmar attacked
    and captured his capital. Min Saw Mun fled to Bengal, taking refuge at his court.
    During his exile, he developed a close relationship with Bengal’s rulers, especially
    Sultan Jaluddin Muhammad Shah. His prowess in battle proved particularly helpful.
    Serving as commander in the Sultan’s army, he helped repel numerous attacks against
    the Sultanate. In 1429, the Sultan repaid this service by sending a large army
    that helped restore Min Saw Mun to the throne to capital. But this came with a
    price. Rakhine was now a vassal of the Bengal Sultanate and would remain so for
    about a hundred years.


    King Min Saw Mun desired to make Rakhine prosperous again. For that, he needed
    a strong capital and Launggget was not up to the mark. It was located on a plain,
    making it difficult to defend against enemy attacks. The recent invasions had
    also left it in bad shape, and a series of bad omens, including lightning striking
    the palace, signalled that it was time to move. Merauk-U, which stood in a valley
    surrounded by mountains, was ideally located. Tipping the scales in his favour
    were the strange phenomena that the king and his entourage witnessed there, in
    particular a series of three events: a mouse that was being chased by a cat turned
    around to chase the cat instead; a deer turned the tables on a tiger; and a frog,
    chased by a snake, turned around and bit the snake, eating part of it. These events
    showed that the weak could defeat their enemies.


    Mrauk-U is said to have got its name from the words myauk (monkey) and u (egg).
    Popular lore has that a monkey queen and a peacock hatched in two eggs into two
    beautiful girls. This painting, installed at the Shittthaung Pagoda, shows Buddha
    predicting Krauk-U''s great city. The royal couple is shown in the foreground
    with the queen holding two eggs. An ogre kneels behind the couple. Alternatively,
    scholars claim Mrauk-U means ‘First Accomplishment’ in old Arakanese.


    Mrauk-U: Ancient Capital of Rakhine · 37

