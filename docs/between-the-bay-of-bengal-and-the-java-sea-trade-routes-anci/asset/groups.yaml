    Srivijaya''s claim to the Chinese that this news the Chola kingdom was a dependency
    of Srivijaya, which would not have sat well with Rajendrachola I, ruler of the
    Chola kingdom. In addition, Tamil merchant guilds, such as Manigramam and Ainnruvar,
    which had established a strong presence in Southeast Asia, were impacted by Srivijaya''s
    aggressive use of Orang Laut, and they appealed to Rajendrachola I for help. Hence,
    the Chola attacks on Srivijaya were likely in retribution for Srivijaya''s attempts
    to obstruct the trade between the Chola kingdom and China.


    The attacks did not destroy Srivijaya but weakened it, causing the Chola kingdom
    to move its capital from Palembang to Jambi. What ultimately sounded the death
    knell for Srivijaya was the direct involvement of Chinese traders in overseas
    trade. Where previously trade with China was limited to tributary trade, the Southern
    Song (1127–1279), having become dependent on maritime trade for its revenue, set
    in motion practices that saw the Chinese getting involved directly in this trade.
    Chinese traders started coming to Southeast Asia in large numbers. The Chinese
    also started building ocean-going boats at the start of the millennium.


    As Chinese merchants were travelling to Southeast Asian ports and buying products
    on their own, Srivijaya''s services as an intermediary were no longer relevant.
    The kingdom declined, and its dependencies started breaking away as they could
    now get better trading terms working on their own than through Srivijaya.


    The name “Srivijaya” transferred to Jambi in the second half of the 11th century
    and Palembang became known as the “Old Harbour”. The 15 dependencies mentioned
    by Zhao Rukuo in 1225 answered to Jambi. However, these dependencies eventually
    broke away and Jambi had had to pressure ships to its harbour with armed force.
    The Orang Laut, long-term allies, were no longer submitting to Srivijaya. Piracy
    started gaining ground, as noted by Arab writers such as Al-Idrisi in the 12th
    century and Ibn Said in the 13th century. Srivijaya''s success had stemmed from
    the monopoly it enjoyed; the disappearance of this monopoly marked the end of
    Srivijaya as an empire.


    In 1275, Kertanagara, the ruler of the Singhaszaar kingdom of Java, attacked Jambi
    as part of his Pamalayu campaign, and Jambi became a vassal of Java. By the end
    of the 14th century, Jambi was subsumed by the kingdom of Minangkabau and ceased
    to exist as the capital of an independent maritime empire. At around the same
    time, Palembang was annexed by the Javanese Majapahit kingdom. The Malay nobles
    dispersed. Palembang, by this time, had a large Chinese population made up merchants
    who had left China at the time of the Ming ban on private foreign trade, first
    issued in 1371. They elected Liang Tao-ming as their leader, who was protected
    by the Ming emperor.


