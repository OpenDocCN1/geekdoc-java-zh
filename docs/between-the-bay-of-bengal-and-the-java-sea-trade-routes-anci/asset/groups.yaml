    Settlements of the English, Dutch, French, Danish, Chinese, Bugis, Makassare,
    Javanese, Sumatran and Balinese communities appeared outside the city’s fortress.
    Sultan Agung, a just and fair ruler, tolerant of other religions, allowing churches
