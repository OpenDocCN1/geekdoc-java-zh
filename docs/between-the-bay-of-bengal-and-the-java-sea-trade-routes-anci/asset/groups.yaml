    The earliest traders to southern Kedah probably sailed directly to Sungai Batu
    to get their precious cargo of iron ingots. The conditions at Sungai Batu were
    ideal for iron smelting. Laterite, the source of raw iron ore (magnetite and haematite)
    was readily available, and the nearby mangrove forests provided plentiful wood
    for charcoal to heat the furnaces. Although no complete furnaces have so far turned
    up at Sungai Batu, intact specimens have been discovered at Kampung Gading in
    Jeniam, about 40 kilometres to the east. These furnaces, made of clay, are likely
    to be what the Sungai Batu furnaces would have looked like. The relationship between
    the Kampung Gading and Sungai Batu smelting sites, however, remains uncertain.


    The iron ingots were exported. They were of high quality, and their use in the
    making of swords was mentioned in a number of Arabic texts, such as those by Al-Kindi
    (9th century) and the Persian scholar Al-Biruni (10th century). The 10th-century
    Tamil epic, Parunathai, mentions that karathathu irumpu (iron from Kataram) was
    one of the materials used in the making of a royal chariot.


    Eventually, sedimentation deprived Sungai Batu of its access to the sea. The entrepots
