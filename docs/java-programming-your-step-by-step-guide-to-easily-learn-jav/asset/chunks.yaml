    # 第一章：Java 基础


    ![image](img/chapter_title_below.png)


    ### 编译和运行 Java 程序


    每个 Java 源文件只包含一个类。文件名必须与类名相同。例如，`Hello` 类应该存储在源文件 `Hello.java` 中。使用 `javac` 编译器可以在终端编译源文件
    `Hello.java`：


    ```

    javac Hello.java

    ```


    这将产生一个与源文件相同但扩展名不同的文件；`.class` 扩展。类文件现在包含字节码。这意味着它不能立即执行。它需要 Java 虚拟机或字节码解释器：


    ```

    java Hello

    ```


    '
- fmt: "\nThe command above loads and executes the `Hello` class and its `main` method.\
    \ If the class contains extensions from other classes (to be discussed further\
    \ on the following chapters), these classes are loaded automatically when needed.\
    \ If you have a source file which extends several other source files, you can\
    \ compile all of them using:\n\n```bash\njavac *.java\n```\n\nAssuming that all\
    \ files are in the same folder, each source file will load and execute its corresponding\
    \ class file.\n\n## Declarations and Expressions\n\nThere are eight primitive\
    \ types in Java. By primitive, it means that these types are not defined in terms\
    \ of anything else; basically, atomic. They are sequences of bits that the CPU\
    \ is ready to deal with. These types are:\n\n`Byte`, `short`, `int`, `long`, `float`,\
    \ `double`, `char`, `Boolean`\n\nIf a variable type is not a primitive type, it\
    \ is considered a reference type. A reference type can either be a class, interface,\
    \ or array type. A variable of any reference type can be set to `null`. This means\
    \ that it can hold nothing.\n\nJava supports the usual set of data types such\
    \ as integer, char, boolean, and other variables. Here are some:\n\n```java\n\
    int a, b;   //integer variables\nfloat f;    //float variable\nchar s;     //character\
    \ variable\nboolean a;  //returns true or false\n```\n\nNote: `//` and `/* */`\
    \ are used to serve for single line comments and multiple line comments respectively.\n\
    \nNumerical expressions can be written in pretty much the same way as other languages:\n\
    \n```java\na = 2 * (3 + 1);\nb = c / 4.12643;\np = q % 2;\no = true;\ns = ‘L’;\n\
    ```\n\nIt is possible to assign an initial value to a variable directly when declaring\
    \ it:\n\n```java\nint a = 5;\nfloat f = 0.52;\n```\n\nThe division operator in\
    \ Java actually means two different things. It can either be real division for\
    \ real numbers, or integer division for integers. This is not really a problem\
    \ in most cases although it may lead to varying results.\n\n```java\ndouble a;\n\
    a = 1 / 9;      // the result of a will be 0.0\na = 1.0 / 9.0;  // the result\
    \ of a will be 0.111...\n```\n\nThe first operation performed integer division,\
    \ hence the result of `0`. If you want to get the exact quotient of `1` and `9`,\
    \ you need to express `1` and `9` as real values so that the division becomes\
    \ real division.\n\nIt is possible in java to assign a real value to an integer\
    \ variable. The value is automatically converted to the corresponding type. This\
    \ is called typecasting.\n\nJava supports type conversion (typecasting) but does\
    \ not perform the conversions automatically. The programmer is required to indicate\
    \ where and what conversions must be made by writing the desired type in parentheses\
    \ before the expression.\n\n```java\ndouble a;\nint b;\nb = (int) (a * 12.3223122);\n\
    ```\n\nOf course, it is possible to assign an integer value to a real variable\
    \ without typecasting. It is not necessary to cast as long as the conversion can\
    \ be performed without the loss of any information.\n\n## Classes and Methods\n\
    \nJava is an object-oriented programming language, so the terms that we will use\
    \ are a little different compared to terms used in structural programming languages.\n\
    \nFunctions, sub-routines, and procedures in Java are called `methods`. The term\
    \ used for calling or executing a function is called `invoking`. A collection\
    \ of variables and methods put together is called a `class`.\n\nHere are some\
    \ examples of methods:\n\n```java\nclass HelloWorld{\n    public void sayHi(int\
    \ a, int b){\n        aa = a;\n        bb = b;\n    }\n    private int getAge(){\n\
    \        return x;\n    }\n}\n```\n\nThe example above contains two methods: `sayHi`\
    \ and `getAge`. A method can have multiple parameters or none.\n\nNotice that\
    \ one method begins with the keyword `public` and the second one begins with `private`.\
    \ This indicates whether the method can be accessed from other classes or not.\
    \ This is helpful when you are securing some data that should not be accessed\
    \ by other methods.\n\nSimilar to the `struct` type in C (record structure), variables\
    \ in Java are considered as a group for every instance of the class. An object\
    \ is considered an occurrence of the struct or record. In other words, an object\
    \ is an instance of its class.\n\nKnowing what the class of an object is also\
    \ means knowing what set of variables it has and what methods it can perform.\
    \ It may sound odd because a set of variables cannot supposedly perform anything.\
    \ This is the core of object-oriented programming. It means that every code is\
    \ considered as being executed by an object.\n\nHere is an example of a simple\
    \ Java code:\n\n```java\nclass Section{ //This is defining a class called “Section”\n\
    \    int a, b, c; //These are three integer instance variables declared\n    /*every\
    \ Section instance will have its own values for these variable */\n    void add(int\
