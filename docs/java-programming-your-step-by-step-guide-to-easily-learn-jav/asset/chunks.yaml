    # Chapter 5:


    Interfaces and Inheritance


    ![image](d2d_images/chapter_title_below.png)


    In programming and software engineering, there are some scenarios where it is
    vital for different programmers or different groups of programmers to have a “common
    ground” that will make their code and software interactive. These programmers
    should be able to write their code regardless of not knowing how the code of other
    programmers is written. The “common ground” for these programmers is called an
    interface.


    Take for example a community wherein there are advanced vehicles that could operate
    and transfer people without the help of a human operator. In order for those vehicles
    to operate, their vehicle manufacturers develop software written in Java that
    could manipulate the vehicle without human operation. Imagine your vehicle or
    car starting and accelerating by itself and being able to manage speed to avoid
    accidents.


    Another example that can be considered is the Global Positioning System or GPS.
    There are computer systems that receive data transmitted by the GPS in order to
    track the location of a vehicle and provide wireless transmission of other data
    such as up-to-date maps, weather and traffic situations. Together with GPS, automated
    vehicles can have a sense of which route to choose the correct direction in order
    to get to a destination without having any hassle such as traffic.


    Now the GPS software and automation software for the vehicle are clearly made
    by different teams of programmers. The team of programmers who developed the automation
    software does not have any idea what the code of the GPS software looks like or
    how it is implemented but they can interact with each other through a single common
    ground. That is the interface. Each team of programmers can actually have their
    code modified by the other team as long as they keep the interactivity of the
    interface.


    Java Interfaces


    The Java programming languages addresses an interface as a reference type. It
    is considered similar to a class which can only contain constants, default and
    static methods, method signatures and nested class types. The method bodies of
    an interface are included only for the purpose of default and static methods.


    An interface cannot have an instance. It is not possible to instantiate an interface
    as it can only be implemented or extended by classes or other interfaces.


    Here is an example of an interface:


    Public interface automateVehicle {


    //static variable declarations


    // method signatures


    int init(Speed s, float distance, float gas, float angle, boolean collision);


    int accelerate (Speed s, float gas, float distance);


    int decelerate (Speed s, float gas, float distance, boolean collision) ;


    int steerWheel (Speed s, float distance, boolean collision);


    //other methods


    }


    Note: Remember that method signatures do not require curly braces as they are
    terminated by a semi-colon.


    In order to use an interface, the keyword implements is used. Whenever a class
    that can be instantiated implements an interface, it creates a method body for
    the methods declared in the interface.


    The following code is an example:


    Public class Car implements automateVehicle {


    Int init (Speed s, float distance, float gas, float angle, boolean collision)


    //the code above contains the method signatures and the implementation


    //code to make the class car init goes here


    // some more code


    }


    //other class members can be written here


    }


    If you remembered, the developers of the interface automateVehicle are not the
    same developers of the class car.  Other car classes can use the automateVehicle
    interface and have a different implementation from the other but both still need
    to keep the same interface. These car developers will then build systems such
    as GPS systems and digital maps and make them usable and effective through the
    use of the methods of the interface.


    The interface automateVehicle example shows the use of the interface in the real
    world as an Application Programming Interface (API). APIs can also be found in
    other software products. Usually, a software package that contains methods that
    other companies could use for their own product is developed and sold by another
    company as well.


    Take for example two companies: one graphics company an one software company.
    The graphics company develops the classes to implement the interface.  The software
    company then uses the interface developed by the graphics company for their own
    software. Although the interface API of the software company is for sale and available
    to the public, the implementation remains kept in secret. It is actually possible
    that the implementation of the API be revised in the future as long as the interest
    and use for the public remains efficient.


    Interface Declaration and Definition


    There are five components that an interface needs to be declared: the modifier,
    the interface name, list of parent interfaces it there are any, the body, and
    the keyword interface, of course.


    public interface SampleInterface extends AnotherInterface, ThatInterface, SampleInterfaceAgain
    {


    float value = 1.54;


    void doSomething (int i, double x);


    int doSomethingElse(String s);}


    In the previous code, the modifier public means that other classes from any package
    can gain access to the interface. If the modifier of the interface is not specified,
    the interface, by default, will only be accessible to the classes within the same
    package.


    Like a regular class, it is possible to extend interfaces. It can’t just extend
    one class; it can extend any number of interfaces, hence the list of parent interfaces
    that it extends if there are any.


    Now, the body of the interface can contain multiple methods such as abstract methods,
    default methods and static methods. Each method is a bit different from the other.'
