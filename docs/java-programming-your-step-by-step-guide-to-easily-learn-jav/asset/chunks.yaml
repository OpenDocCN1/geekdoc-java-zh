    # Chapter 6:


    Packages


    ![image](d2d_images/chapter_title_below.png)


    In programming, developers tend to group related types into groups so that they
    can be easier to find and to avoid conflicts in names. These groups are called
    packages.


    A package is basically a group of related types that allow access protection and
    management of name space.


    Note: Remember that a type can be referred to as a class, interface, annotation,
    or enumeration.


    The special kinds of classes are enumerations while the special kinds of interfaces
    are called annotations, but generally, types are usually referred to as classes
    and interfaces.


    In the Java Platform, there are types that are also members of some packages that
    can group a class by function.  For example:


    Java.lang contains the fundamental classes while java.io contains the classes
    used for reading and writing (input / output). There are other packages that provide
    other functions than i/o and fundamental functions. It is also possible for a
    programmer to bundle their classes into a package.


    The advantages of grouping classes and interfaces into packages are:


    *   It is convenient and more accessible for other programmers to locate specific
    types such as graphics-related functions.


    *   There won’t be a conflict in type names and the name of the types developed
    since a package utilizes the use of a new namespace.


    *   Unrestricted access is possible between types within the same package but
    retain protected access from types from other packages.


    Package Creation


    In creating a package, it is important to first choose a name and precede it with
    a package statement wherein the name must be written at the top of every source
    file that contains the types you wish to include from and in the package.


    Take for example:


    Package example;


    The line of code above needs to be the first line to be written in a source file.
    A maximum of one package statement can only be written per source file. This rule
    applies to all types in the file.


    If multiple types are places in a single source file, only one type can be modified
    to public. That name of that type must also be the same as the name of the source
    file.


    Take for example a source file named Test.java and Example.java, It is possible
    to define a public class named Test in the file.  It is also possible to define
    a public interface named Example in the source file Example.java. The exclusivity
    of the type name to the source file is important.


    Non-public types can also be included in the same file by being treated as a public
    type although this practice is not recommended unless the size of the non-public
    type is small and relatively close to the public type. Non-public types can be
    included but the access to the public type will only be available from outside
    of the package. This means that all top-level, non-public types will remain private
    within the package.


    Whenever a graphics interface and classes that implanting the graphics interface
    in a package called graphics, a total of six source files will be needed.


    If the package statement is not used, the type will end up in an unnamed package.
    An unnamed package is usually used for small and temporary applications only or
    used as form early development stages of a program. If your type is important,
    then it should be put in a named package.


    Since there are now so many programmers in the whole world developing classes
    and interfaces with the Java Programming Language, there is a high probability
    that a lot of programmers will use the name for different types.


    Conventions in Naming Packages


    Package names are normally written in lower case letters to avoid the possibility
    of conflict with class names or interface names.


    Packages names used by companies usually come from their domain names but are
    reversed. For example:


    net.sample.samplepackage


    The packages in the Java Programming Language, Java Language to be precise, begin
    with the work java. or in some cases, javax.


    There are some situations where in using the domain name is not a valid package
    name. This situation can occur if the name of the domain contains a symbol or
    a special character like ‘@’. It will also be invalid if the package name begins
    with a number or any character that should not be used. A package name will also
    be invalid if the name begins with special keywords such as int. The safest symbol
    to use is a simple name which can be followed by an underscore.


    Package member usage


    The components inside a package are usually called package members. In order to
    use a package member (public) from the outside, referring to a member by its full
    name can be done. Importing the package member itself is also possible. Another
    way is importing the entire package where the member comes from. These solutions
    can be applied to specific situations.


    Name referral is probably the most used way of referring to a member or method
    or type that we have seen from the previous chapters. It is possible to utilize
    the simple name of a package member if both the code being developed and the package
    member are from the same package or the package member itself was imported.


    Although this method is useful, it needs to utilize the fully qualified name of
    the member including the package name when trying to use a member from a different
    package that has not been imported.


    Fully qualified names are used for non-frequent moments. A name used multiple
    times can become tiresome and makes the code difficult to understand so importing
    the member or the package itself is done as a simpler solution.


    Package Member Import


    To be able to import a member into a current file, add the import statement at
    the beginning of the file before everything else but not before the package statement
    if one is being used.


    Package Import


    To be able to import all the components within a package, use the same method
    as importing package members but use an asterisk instead of the member name. This
    imports all the members instead of just one.


    The asterisk character can only be used to specify that all classes within the
    package are being imported. It cannot be used to match a specific member or subset
    within the package. This will make the compiler throw a compilation error. The
    import statement specifies that either a single member or the entire package can
    be imported.  The import statement has another form that allows public nested
    classes of an enclosing class to be imported.


    Packages may seem hierarchical but they are not. The order at which packages are
    imported does not have any effect on how the members and types are used within
    the program.


