  toc: []
  trans: '

    Java 是一种非常灵活的编程语言。从软件开发到 Applet 开发，Java 已在许多方面证明了自己是一种强大的语言。但它的灵活性远未于此。


    由于它是平台无关，相同的 Java 程序可以在不同的操作系统上运行，而无需重新创建或重写代码，这与 `C` 和 `C++` 等编程语言不同。这一切之所以可能，归功于`Java
    Runtime Environment`（Java 环境），它可以解释 Java 源码并告知操作系统需要执行的操作。


    当然，这种语言也有一些缺点，但它仍然易于理解和学习。在一天的时间内，任何人都可以创建属于自己的 Java 程序。

    '
