    # Introduction


    ![image](d2d_images/chapter_title_below.png)


    The world of programming is a very diverse one where each programming language
    has its own specific advantages. There are languages such as C and Assembly which
    focus on operating system instructions and other computer software while there
    are other languages such as HTML and JavaScript which focus on web-based applications.
    An example of a programming language that can do both is Java. This eBook contains
    guides and instructions that will help you learn and understand java in one day.


    ### What is Java?


    Java is actually a decent programming language developed at Sun Microsystems.
    It was originally used for Internet applications or applets. Those applets are
    embedded on web pages and run in the browser. Java uses a special format known
    as byte code instead of an ordinary machine code. With the help of a Java interpreter
    program, the byte code can be executed on any computer. This Java interpreter
    program is called a Java Virtual Machine or `JVM`. It is available today in most
    computer systems. Java may use byte code format but there is nothing about Java
    that requires this byte code technique. There are some compilers that exist and
    generate real machine code, or more commonly known as native code.


    Java programs consist of sets of classes. The source files of those programs are
    written in `.java`. These source files are then compiled into `.class` files which
    contain the byte code instead of the CPU-specific machine code. The `.class` files
    are then executed by a Java Virtual Machine (`JVM` or interpreter) at run time.


    Java is not limited to Internet applications. It is technically a complete general
    object-oriented programming language which can be used to develop all sorts of
    applications. The syntax of Java is very much similar to the syntax of C++ but
    removes its error-prone features and complications.


    Do not mistake Java for JavaScript. JavaScript is an entirely different language.
    JavaScript is an interpreted programming language used as one of the three essential
    components of a webpage or website content production. The difference between
    Java and JavaScript is that Java is an object-oriented language while JavaScript
    is an object-oriented-scripting language. Codes written in Java need to be compiled
    while the codes written in JavaScript are all in text. Java creates applications
    that can run in both a virtual machine and a browser while JavaScript can only
    run on browser. Each language also requires different sets of plug-ins.


    Sun Microsystems, the company behind the creation of Java, offer free tools for
    developing Java-based software. If you want to know more about those tools, you
    can visit this website ([https://www.sun.com](https://www.sun.com)) for more information
    such as Java compilers for different computer systems (UNIX, Microsoft Windows,
    OSX) along with detailed documentation. Java compilers are free and can be downloaded
    from the given link.


    Throughout the eBook, we will discuss the basics of how Java programs are compiled,
    simple expressions and declarations, classes, objects, and statements, until you
    are able to learn, understand, and write a complete Java program in just one day.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Chapter 1: Basics of Java


    ![image](d2d_images/chapter_title_below.png)


    ### Compiling and running a Java Program


    Every source file in Java contains exactly one class. The filename must be the
    same as the class name. For example, a class `Hello` should be stored in the source
    file `Hello.java`. Using the `javac` compiler, the source file `Hello.java` can
    be compiled in the terminal:


    ```

    javac Hello.java

    ```


    This will result in a file with the same name as the source file but a different
    file extension; the `.class` extension. The class file now contains the byte code.
    This means that it cannot be executed immediately. It needs a Java Virtual Machine
    or byte code interpreter:


    ```

    java Hello

    ```

