    \n```java\npublic void setBreaks(String breakType) {\n    this.break = breakType;\n\
    }\n\npublic void displayData( ) {\n    super.displayData();\n    System.out.println(\"\
    The \" + \"car has a\" +\n    getBreaks( ) + \" type as breaks\");\n}\n}\n```\n\
    \n注意重写的方法 `displayData`。另一个需要考虑的细节是输出中包含的关于刹车（breaks）的数据。\n\n"
