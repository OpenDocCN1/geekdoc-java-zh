  trans: "\n\n抽象方法（abstract method）与方法签名几乎相同。它不需要实现。默认方法（default method）是在 `default`\
    \ 修饰符内声明的方法。而 `static` 修饰符是在 `static` 修饰符内声明的。接口中的抽象方法、`static` 方法和默认方法默认都是公共的（public）。\n\
    \n除了方法之外，接口中还可能使用常量声明。接口中声明的每个常量值都可以是任何修饰符（`public`、`static`、`final`）。\n\n为了使一个类能够实现一个接口，在声明中必须在接口名称之前编写\
    \ `implements` 关键字。一个类可以实现多个接口。如果发生这种情况，该类要实现的接口将用逗号隔开。如果一个类继承一个父类并实现一个接口，则 `extends`\
    \ 关键字后面总是跟父类名，然后是 `implements` 关键字。\n\n想象一个定义了对象大小比较的接口：\n\n```java\npublic interface\
    \ Comparison{\n    public int isSmallerThan(Comparison object_1);\n}\n```\n\n\
    为了能够不分类型地比较相似对象的大小，`Comparison` 接口需要由实例化这些对象的类来实现。\n\n只要有一个方法可以比较从该类实例化的对象的相似字段，任何类都可以实现\
    \ `Comparison` 接口。对于 `strings` 等其他数据类型，可以比较字符数。对于 `person` 等其他对象，可以使用 `height`\
    \ 和 `age` 等字段。对于几何对象等数学情况，可以对面积进行比较，而像体积等其他情况则适用于三维对象的比较。`isSmallerThan()` 方法可以由所有上述类实现。\n\
    \n如果已知某个类可以实现 `Comparison` 接口，那么比较从该类实例化的对象大小也是一个肯定的的事实。\n\n# 继承 (Inheritance)\n\
    \n我们在之前的某些章节中已经看到过继承的应用。Java 编程语言允许类派生自其他类。由于这种可能性的存在，父类的属性和方法将由派生类或子类继承。\n\n\
    以下代码是 `Vehicle` 类的简单实现，它在之前的示例中用过：\n\n```java\npublic class Vehicle {\n    Float\
    \ distance;\n    Float gas;\n    Float angle;\n\n    public Vehicle(float Vgas,\
    \ float Vdistance, float Vangle ) {\n        gas = Vgas;\n        distance = Vdistance;\n\
    \        angle = Vangle;\n    } \n\n    public void setDistance(int Ndistance){\n\
    \        distance = Ndistance;\n    }\n\n    public void setGas(int Ngas) {\n\
    \        gas = Ngas;\n    }\n\n    public void turnStraight(int value){\n    \
    \    angle-= value;\n    }\n\n    public void turn(int value){\n        Angle+=\
    \ value;\n    }\n}\n```\n\n作为 `Vehicle` 类子类的 `Car` 类声明看起来所示：\n\n```java\npublic\
    \ class Car extends Vehicle {\n    public int heatRate;\n\n    public Car(float\
    \ heatR, float sDistance, float sGas, float sAngle) {\n        super(sDistance,\
    \ sGas, sAngle);\n        heatRate = heatR;\n    } \n\n    // 汽车子类增加了一个方法\n  \
    \  public void setHeatRate(int newValue) {\n        heatRate = newValue;\n   \
    \ } \n}\n```\n\n子类 `Car` 继承了其父类 `Vehicle` 的所有字段和方法。它还增加了另一个名为 `setHeatRate` 的方法及其字段\
    \ `heatRate`。除了构造函数之外，编写子类 `Vehicle` 看起来就像是完全凭空创建的另一个类，连同它的字段和方法。感觉是这样，但现在它是这样创建的。如果父类\
    \ `Vehicle` 中的方法更复杂且调试需要很长时间，这种技术将非常重要。\n\n子类是派生自另一个类的类。它也可以被称为派生类或子类。子类的对面是父类（superclass）。父类是子类派生的那个类。父类的另一个术语是父母类（parent\
    \ class）。\n\n父类的所有成员，包括属性、方法和其他嵌套类，都由子类继承。虽然它不继承构造函数，但可以从子类调用父类的构造函数。\n\nJava\
    \ 编程语言不支持多父类继承。这意味着每个类只能有一个直接父类。除了对象之外，每个类基本上都是 `Object` 类的子类；假设该类没有声明父类。子类拥有一个被另一个子类派生的子类是可能的。每个类的顶层父类都是\
    \ `Object` 类。无论子类如何，每一个类都可以追溯到对象。\n\n在处理本质上具有相同结构的多个类时，继承的概念可以非常高效。\n\n例如，想象一个\
    \ `Mountain` 类和一个 `Valley` 类。与其将 `Mountain` 类的所有属性重写到 `Valley` 类中，不如创建一个 `Landform`\
    \ 类，它包含了 `Mountain` 和 `Valley` 类都拥有的所有相同属性和方法。这减少了错误的可能性并缩短了调试时间。\n\n# Java 平台层次结构\
    \ (Java Platform Hierarchy)\n\n在 Java 编程语言中，`Object` 类基本上是所有类的核心类。它是最常见的类。所有类都派生自\
    \ `Object` 类。这些类然后又有子类，依此类推。这被称为类的层次结构。与其父类相比，层次结构底部的类倾向于执行更具体的方法。\n\n## 子类 (Subclasses)\n\
    \n子类可以继承其父类的公共和保护成员，无论子类位于哪个包。如果子类和它的父类在同一个包中，子类还可以继承所有的私有成员。如此，子类可以对其继承的成员进行操作，例如：\n\
    \n-   直接使用继承的字段\n-   在子类中声明与父类相同的字段\n-   声明父类未包含的新字段\n-   直接使用从父类继承的所有方法\n-  \
    \ 在子类中创建一个实例方法，其方法签名与父类相同（方法重写）\n-   创建一个与父类同名的静态方法\n-   在子类中声明父类未包含的新方法\n-  \
    \ 创建一个调用父类构造函数的子类构造函数\n\n子类不能继承父类的私有成员。只有当子类和父类位于同一个包时才是可能的。\n\n如果父类访问私有字段的方法是公共或保护的，那么这些方法对子类是可访问的。嵌套类可以访问其所在类的所有私有字段和方法。因此，如果嵌套类是公共或保护的，其子类可以访问父类的所有私有成员。\n\
    \n"
- fmt: "\nThe code above declares that `obj1` is declared as both an `Object` and\
    \ a `MyOwnClass`. This method is called implicit casting.\n\nThe following code,\
    \ on the other hand is called explicit casting:\n\n––––––––\n\n![image](d2d_images/scene_break.png)\n\
    \n```\nMyOwnClass sample = obj1;\n\nMyOwnClass sample = (MyOwnClass) obj;\n```\n\
    \nIf the type `MyOwnClass` was not assigned to `obj1`, the code would have encountered\
    \ an error since the datatype of `obj1` was originally unknown. Explicit casting\
    \ initializes an observation during runtime to make sure that `obj1` is of the\
    \ type `MyOwnClass`. This is to ascertain that the compiler can identify `obj1`\
    \ is an instance of `MyOwnClass`. If `obj1` does not become an instance of `MyOwnClass`,\
    \ the program throws out an exception.\n\nIt is possible to determine the type\
    \ of a particular object using `instanceof`. This reduces the chances of encountering\
    \ a runtime error due to an improper cast.\n\n```\nif (obj1 instanceof MMyOwnClass)\
    \ {\n    MyOwnClass sample = (MyOwnClass) obj1;\n}\n```\n\nThe `instanceof` operator\
    \ checks if `obj1` refers to `MyOwnClass` in order to make the cast without the\
    \ possibility of having a thrown runtime exception.\n\n## Multiple Inheritance\n\
    \nThe difference between classes and interfaces is that interfaces are not allowed\
    \ to have fields while classes can. Another difference is that an interface cannot\
    \ make an instance of itself to create an object while a class can be instantiated\
    \ to create one. As discussed in chapter 4, objects can store their current state\
    \ in fields which can be defined through the use of classes.\n\nThe reason why\
    \ the Java Programming Language does not allow a class to have more than one super\
    \ class is to avoid the possibility of multiple inheritance of the state, or in\
    \ other words, the ability to inherit fields from multiple classes.\n\nConsider\
    \ a situation where it is possible to create a class that can extend multiple\
    \ classes. When an object is created through an instance of a class, the fields\
    \ of all of the superclass of that class will be inherited by the object. There\
    \ will be a possibility that a method or constructor can create an instance of\
    \ the same fields. This will be very difficult to resolve. This is also why interfaces\
    \ cannot contain fields; to avoid the problems from multiple inheritance of state.\n\
    \nThe ability to inherit method definitions from multiple classes is called multiple\
    \ inheritance of implementation. This type of inheritance can have a lot of problems\
    \ such as conflicts with method names. Programming languages that are able to\
    \ support multiple inheritance of implementation might encounter situations such\
    \ as multiple superclasses that have methods of the same names. The compilers\
    \ of these programming languages will not be able to distinguish the difference\
    \ of one method from the other. Human errors such as creating a conflict with\
    \ the methods of a superclass can also happen.\n\nDefault methods also have a\
    \ different form of multiple inheritance of implementation. Multiple interfaces\
    \ can be implemented by more a class. These interfaces can contain default methods\
    \ with the same name. In Java, the compiler has rules that could verify the default\
    \ method a particular class needs or uses.\n\nThe Java Programming Language has\
    \ the capability to support multiple inheritance of type. This is technically\
    \ the ability to implement more than one interface. It is possible for an object\
    \ to have multiple types. These types can be of types of their own class or the\
    \ types of all the interfaces implemented by the class. In other words, if a declared\
    \ variable is declared as a type of an interface, the value of that variable can\
    \ be used to reference any instantiated object from any class where the interface\
    \ is being implemented.\n\nMultiple inheritance of implementation, on other hand,\
    \ allows a class to inherit different implementations from an interface that it\
    \ extends any method defined.\n\n## Instance Method\n\nIn a subclass, an instance\
    \ method with the same signature and return type as an instance method in a superclass\
    \ has the capability to override the instance method of the superclass. \n\nDue\
    \ to the overriding ability of a subclass, a class can be allowed to inherit from\
    \ a superclass whose characteristics are relatively similar and modify those characteristics\
    \ as required. The components (name, type and number of parameters, return type)\
    \ of the overriding method must be the same as the method that it will override.\
    \ It is also possible for an overriding method to return the subtype of the type\
    \ returned by the overridden method; In other words, a covariant return type.\n\
    \nDuring method overriding, it is recommended to use the `@Override` so that the\
    \ compiler will be instructed that a method in the superclass will be overridden.\
    \ If the method to be overridden in the superclass does not exist, an error will\
    \ occur.\n\n## Static Methods\n\nWhen an identical static method (identical method\
    \ signatures) from a superclass is defined within a subclass, the method from\
    \ the subclass will hide the method from the superclass.\n\nThe difference between\
    \ instance method overriding and static method overriding are:\n\n- The overridden\
    \ instance method in the subclass is the method that is invoked.\n- The hidden\
    \ static method that gets used may vary since the location where it is invoked\
    \ may vary between a superclass and a subclass.\n\nIn an interface, default methods\
    \ and abstract methods can be treated like instance methods in such a way that\
    \ they can be inherited like instance methods. Although if the supertypes of a\
    \ class or interface already have default methods with the same method signatures,\
    \ the java compiler will follow the rules of inheritance so that the conflict\
    \ in method name will be resolved. These rules are:\n\n- Interface default methods\
    \ are less preffered over instance methods.\n- Overriden methods by other candidates\
    \ will be ignored. This situation happens when the supertypes have a similar ancestor.\n\
    - In the case of abstract methods, if there is at least one defined default method\
    \ that conflicts with an abstract method, a compiler error will be thrown by the\
    \ Java compiler. It is important to note that the supertype methods must be overridden\
    \ explicitly.\n\n## Polymorphism\n\nIn Biology, the term polymorphism is referred\
    \ to where in an organism or species can assume multiple different phases or forms.\
    \ In the Java programming language, this concept is also applicable. The unique\
    \ behaviors can be defined by their own subclass but still be able to share some\
    \ of the similar functionalities of the parent class.\n\nTo be able to demonstrate\
    \ polymorphism, we will make some adjustments to the class `Vehicle`. For example,\
    \ a method named `displayData` can be added to the class. This method displays\
    \ all the data that is currently stored in an instance.\n\n––––––––\n\n![image](d2d_images/scene_break.png)\n\
    \n```java\npublic void displayData( ){\n    System.out.println(\"\\nThe Vehicle\
    \ is \" + \"in the correct\" + this.\n+ \" with a gas in liters of \" + this.gas\
    \ +\n\" and currently have  a total distance travelled of \" + this.distance +\
    \ \". \");\n}\n```\n\nTo be able to demonstrate the features of polymorphism in\
    \ the Java Programming Language, the class `Vehicle` is extended by a class `Car`\
    \ and a `RallyCar` class. For the class `Car`, a field named `breaks` will be\
    \ added, which is a String value that indicates if the car contains a back shock\
    \ absorber, Here is the updated class:\n\n```java\npublic class Car extends Vehicle\
    \ {\n    private String breaks;\n\n    public Car(\n        int sDistance,\n \
    \       int sGas,\n        int sAngle,\n        String breakType){\n        super(sDistance,\n\
    \        sGas,\n        sAngle);\n        this.setBreaks(breakType);\n    }\n\n\
    \    public String getBreaks(){\n        return this.breaks;\n    }\n}\n```\n\n\
    ––––––––\n\n![image](d2d_images/scene_break.png)\n\n```java\npublic void setBreaks(String\
    \ breakType) {\n    this.break = breakType;\n}\n\npublic void displayData( ) {\n\
    \    super.displayData();\n    System.out.println(\"The \" + \"car has a\" +\n\
    \    getBreaks( ) + \" type as breaks\");\n}\n}\n```\n\nNotice the overridden\
    \ method `displayData`. Another detail to be considered is the data about the\
    \ breaks that is included in the ouput.\n"
