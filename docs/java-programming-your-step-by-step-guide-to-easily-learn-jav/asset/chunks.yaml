    If there are two members from different packages that share a common name, these
    members need to be imported through the use of fully qualified name method. This
    is done to avoid any ambiguity between the names from different packages.


    ## The Static Import Statement


    In importing packages, there are some cases where in access to fields and a static
    method from more than one class is frequent. Using the class names as a prefix
    multiple times will lead to an unreadable code that can be very difficult to understand.


    The static import statement allows a solution for importing the static methods
    and constants that are needed to avoid the multiple prefix problems.


    ## Source and Class File Management


    The Java Programming Language platform has many implementations that rely on hierarchical
    file systems in order to be able to manage class and source files although this
    is not required in the Java Language Specification. To be able to do this, the
    following steps must be done:


    1. Place the source code for a type in a text file whose name is the name of type
    and with a file extension of `.java`.


    ```java

    //from a file called sample.java


    package example;


    public class sample{

    //code

    }

    ```


    2. After that, put the source file in a directory whose name is the same name
    as the package name of where it belongs.


    The names of the package members and the path name to the files should be parallel.
    Assuming the file name separator is backslash (Microsoft Windows).


    As we have discussed from previous topics, it is a common practice that a package
    name is derived from its company’s domain name. Remember the example domain name
    `sample.net` will have its package name as `net.sample`. All the components inside
    the package will correspond to a sub-directory. So if the company of the domain
    `sample.net` has a package member named `net.sample.packagemember` that contains
    a file `sample.java`, it will be placed in a series of subdirectories such as:


    `....\net\sample\package\sample.java`


    When compiling a source file, a different output file is created by the compiler
    for each type defined.


    ## Wrapping Up


    Overall, the Java Programming Language is a very powerful programming language
    that can be used in many aspects. Having goals such as being simple, object-oriented,
    independent of the host platform, the ability to contain language facilities and
    libraries for network systems and a structure specifically designed to have code
    be executed securely from remote source, the Java programming language has features
    that are not present in other programming languages like C and C++.


    Considering the modularity of the Java programming language, its capability to
    divide codes into modules gives it a tremendous advantage over other languages
    such as C/C ++. In Java, the output application can be drawn out in the form of
    modules instead of just a single executable. Programming languages like C/C++
    on the other hand, when encountering small changes or adjustments in code, require
    the whole application to be recompiled.


    The idea of the Java Programming Language is to be able to compile a source code
    into an intermediate language that can be interpreted. The intermediate language
    is considered the `byte code`. While the Java Virtual Machine or `JVM` is the
    interpreter. In terms of Standardization, Java has standardized libraries which
    have the ability to gain access to features of host machines such as network and
    graphics in multiple ways. The Java programming language can also support multi-threaded
    programs which can be necessary for networking applications.


    Java is also platform independent and will be even more powerful and efficient
    when tagged with server side applications such as web services and mini servers.
    For the client side, Java has also provided some improvements such as Windows
    toolkits, widget toolkits, and `Swing`. Java is a write once, run anywhere programming
    language. This means that there are not that many problems with its portability
    to any hardware as long as there is a Java Virtual Machine present. It is also
    a write once, test anywhere programming language. This makes Java very efficient
    and fast.


    For execution and error handling, Java can make an exception throw an object just
    like any other object. The only requirement it needs is to implement the interface
    `Throwable`. The compiler also specifies whether or not an exception may be caught.
    If there is not `catch` block made for a thrown exception, the compiler will produce
    an error.


    Java forces its programmers to handle exceptions. With that said, the programmer
    must be able to handle the exception or define that the user must be able to handle
    it.


    In the field of networking capabilities, the predecessors of Java did not have
    a feature that could allow their language to network with other computer systems.
    This means they became platform independent and almost all network protocols are
    standardized. This made the developers of the Java language add more focus on
    its integration in the Internet.


    Java was originally designed with networking computing as one of its features.
    It was one of the first language systems to offer wide support for a code from
    a remote source execution.


    For dynamic class loading, classes in Java can be compiled as needed. If a class
    is not required during the execution of a program, it is impossible to compile
    the class into code.


    This perk is highly useful when it comes to networking programming. Being able
    to run a program that could load classes from the file system or remote source
    is a very efficient concept. It can also be possible for a program written in
    Java Language to alter its own code while being in an execution. However, it is
    more realistic and possible for a program written in Java to be executed with
    some feedback and improve the generated code over time.


    In Java, releasing the memory is no longer in the programmer’s list of responsibilities.
    The Java Virtual Machine (`JVM`) keeps track of and records all the used memory.
    When a memory is not used anymore, it automatically freed up. While that is happening,
    another task is being done in the background by `JVM`: releasing up unreferenced,
    unused memory which can also be called Garbage Collection. The garbage collector
    is always running. This feature feature makes it easy to write complex server
    side programs. The only thing the programmer has to do now is to observe the speed
    of the creation of the object. If an application is creating objects faster than
    the Garbage Collector can free, this will cause memory problems. The application
    may either run out of memory or throw out an exception, or halt to give time for
    the Garbage Collector to keep up and do its tasks.


    One more thing that can be said about Java is that the people behind it were also
    the creators of the concept of the `applet`. A Java program has the capability
    to be run in a web browser. Java was originally designed for web applications.
    The promise of the Java programming language was in the web browser side and that
    the code could be downloaded and executed as an `applet` for the browser.


    Since Java is basically an upgrade of some programming languages, there were some
    features in the other languages that were disabled such as multiple inheritance,
    restrictions of typecasting and many more in Java to avoid errors.


    As a final generalization, Java is a programming language that can deliver results
    and live up to its goals. The Java language is not just some other language as
    it allows the creation of advanced data types (objects) which can be representations
    of real-world things. These objects can have fields that can be modified as well.

