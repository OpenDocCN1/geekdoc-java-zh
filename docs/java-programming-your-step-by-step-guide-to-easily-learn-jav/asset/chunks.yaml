    # Chapter 3:


    Arrays


    ![image](d2d_images/chapter_title_below.png)


    An array is not a primitive data type in Java. It is, in other words, a collection
    of variables of the same data type; basically a container. It holds a number of
    values of the same data type. The size of an array is always fixed. Once an array
    has been created, it cannot be expanded.


    ![image](d2d_images/image000.jpg)


    As you can see in the image above, the positions in an array are called indices
    or index. The values stored in those indices are called elements. If you noticed,
    the beginning of the array starts an index 0 and ends at index 9\. Arrays in java
    are pretty much the same from other programming languages.


    Array Declaration


    Consider an integer variable sample_array. In order to make the sample_array an
    array of integer, add [  ] after the int. Here is an example:


    int[ ] sample_array;


    You have just declared an array of integers named sample_array. Now, an array
    declaration can be split into two components: the datatype of the array and the
    name of the array itself. Based on the example above, the datatype of the array
    is int[ ] and the name of the array is sample_array. The [ ] remain empty because
    they are not a part of the data type. It just signifies that you are declaring
    the variable as an array. Although you have declared the array, it does not mean
    you have created one.


    Note: Like any other variable, declaring the array properly is very important.
    Otherwise, your program will run into a compilation error.


    Java arrays are not restricted to integer arrays. Here are some examples of other
    types of arrays in Java:


    String[] string_array_sample;


    byte[] byte_array_sample;


    long[] long_array_sample;


    float[] float_array_sample;


    boolean[] boolean_array_sample;


    double[] double_array_sample;


    char[] char_array_sample;


    short[] short_array_sample;


    The following lines of code are examples of how to assign values (elements) to
    specific array indices:


    sample_array [ 0 ] = 24;


    char_array_sample[ 4 ] = “E”;


    In order to access an array and display it, the name of the array and the index
    of the element that you want to access can be used:


    System.out.println (“The value is: “ + sample_array [ 0 ] );


    System.out.println (“The element is: “ + char_array_sample [ 4 ] );


    System.out.println (“The element in the index is “ + sample_array [ 5 ] + “.”);


    ––––––––


    ![image](d2d_images/scene_break.png)


    Another way of declaring your array can be done like in the following code:


    int[ ] sample_array = {


    20,444, 195,


    23, 0, 100,


    32, 55, 19,


    10, 14, 123,


    150, 141, 170


    };


    Using the way above to declare an array, the size of the array can easily be determined
    since the number of elements between the curly braces is known.


    Placing the brackets after the array name is also accepted when declaring an array.
    Here is an example:


    int test_array[ ];


    char array_char[ ];


    Although this is acceptable, it is not a good practice since the brackets are
    the ones that identify the array type. They should appear beside the data type.


    Take a look at the following program:


    public class simple_array{


    public static void main(String[ ] args){


    int[ ] sample_array;


    sample_array = new int [10];


    sample_array[0] = 23;


    sample_array[1] = 12;


    sample_array[2] = 33;


    sample_array[3] = 42;


    sample_array[4] = 56;


    sample_array[5] = 77;


    sample_array[6] = 99;


    sample_array[7] = 11;


    sample_array[8] = 53;


    sample_array[9] = 66;


    System.out.println (" The element for index 0 = "+ sample_array[0] );


    System.out.println (" The element for index 1 = "+ sample_array[1] );


    System.out.println (" The element for index 2 = "+ sample_array[2] );


    System.out.println (" The element for index 3 = "+ sample_array[3] );


    System.out.println (" The element for index 4 = "+ sample_array[4] );


    System.out.println (" The element for index 5 = "+ sample_array[5] );


    System.out.println (" The element for index 6 = "+ sample_array[6] );


    System.out.println (" The element for index 7 = "+ sample_array[7] );


    System.out.println (" The element for index 8 = "+ sample_array[8] );


    System.out.println (" The element for index 9 = "+ sample_array[9] );


    }


    The output of the Java code above will be: The element for index =


    The element for index 0 = 23


    The element for index 1 = 12


    The element for index 2 = 33


    The element for index 3 = 42


    The element for index 4 = 56


    The element for index 5 = 77


    The element for index 6 = 99


    The element for index 7 = 11


    The element for index 8 = 53


    The element for index 9 = 66


    If you’ll notice, it is rather tiresome and difficult to declare all the elements
    of an array. Imagine having 100 elements that you need to print out or store.
    Wouldn’t writing them one by one be troublesome? In most cases, programmers implement
    iterative statements (while, do-while, and for ) to make the iteration through
    each element in the array much simpler.


    Here is an example of an array implementation using loops:


    public class loop_array {


    public static void main (String[ ] args) {


    int x = 10;


    int [ ] sample_array;


    sample_array = new int [ x ];


    for ( x = 0; x < 10; x ++ ){


    sample_array [ x ] = x;


    System.out.println(“ The element of index “ + x + “ is “ + sample_array [ x ] 
    +“.”);


    }


    }


    }


    The output of the code above will be:


    The element of index 0 is 0.


    The element of index 1 is 1.


    The element of index 2 is 2.


    The element of index 3 is 3.


    The element of index 4 is 4.


    The element of index 5 is 5.


    The element of index 6 is 6.


    The element of index 7 is 7.


    The element of index 8 is 8.


    The element of index 9 is 9.'
