    }


    Creating the object is also the same but without the parameters:


    samp Example = new Example ( );


    Both constructors can be declared in class Example since the arguments they have
    are different. Just like methods, the Java platform can distinguish constructors
    based on the number of arguments included in the lists and their types.


    It is not possible for a class to have two constructors with the same name and
    the same type of arguments since the platform cannot distinguish one from the
    other; hence encountering a compilation error.


    It is not required to have any constructors in a class although caution is advised.
    It is automatic for the compiler to provide a default constructor without any
    arguments for a class without constructors. This constructor will invoke the constructor
    (the constructor without any arguments) of the superclass. During this moment,
    the compiler will check if the superclass does not have a constructor without
    arguments so it is important to clarify that it does.  (We will discuss more on
    superclasses and sub-classes after constructors)


    Now if a class does not have a declared superclass, it still has a default superclass
    which contains the default constructor.


    Superclasses and Subclasses


    class MyOwnClass extends MyOwnSuperClass implements MyOwnInterface{


    int value;


    int result;


    }


    Take a look at the code above. The class MyOwnClass extends another class called
    MyOwnSuperClass. The MyOwnClass is now called a subclass of MyOwnSuperClass. MyOwnSuperClass
    is now called the superclass of MyOwnClass. This means that MyOwnClass inherits
    all the shared attributes and methods of its superclass. Another keyword implement
    has also been added. The term implement means that the subclass MyOwnClass can
    use the methods in the class MyOwnInterface. We will discuss more on extends and
    implements in Inheritance and Interfaces.


    It is also possible to add declarations such as public and private at the start.


    Overall, a class can have the following components: 


    *   Class modifiers (Public, private, protected)


    *   Class name 


    *   *if any:


    Name of the parent class (superclass) and keyword extends


    Note: A subclass can only extend one parent at a time


    *   Interfaces


    -Separated by commas if there are multiple interfaces that need to be implemented


    *   Class Body


    -begins with { and ends with }


    Objects


    In java, an object is an instance of a class. It is created by the program to
    interact with everything else through the use of methods. Because of that, a program
    can carry out multiple objectives such as animation, GUI implementation and information
    management between a sender and a receiver.


    After an object finished its objectives, its resources are again used by other
    objects.


    Methods


    We have already introduced ourselves with methods in the previous chapters. As
    we know, a method is the same as a function in other programming languages like
    C. It is used to perform specific tasks like calculations and manipulation. Here
    is an example of a method:


    public void getAverage (float exam1, float exam2, float exam3){


    float average, ex1, ex2, ex3;


    average = (ex1 + ex2 + ex3)/3;


    System.out.println(“The average is: “ + average + ”%.”);


    }


    In a method, the only components needed are the name of the method, the return
    type, the parameters if there are any, and of course, the body itself.


    However, there are some components that can also be added such as modifiers and
    exception list. Modifiers are important in methods so that data access can be
    secure and there will be no mishandling of fragile information.  Exception lists
    are also important since they are used in handling runtime errors. More on exception
    lists to be discussed in the following chapters.


    In a method declaration, it is important to always have the method signature.
    The method signature is the name of the method and its parameter types.


    Here is an example:


    getAverage(float, float, float)


    Although a method can have any name, it is a good practice for a method name to
    be a verb in lowercase. If it is a multi-word method name, it is still conventional
    to start off with a lowercase verb followed by the noun that begins with a capital
    letter. For example:


    getAverage


    solveEquation


    printAnswer


    searchList


    isNotEmpty


    Method Overloading


    Usually, the name of a method is unique within its class. In some cases, however,
    it is possible for multiple methods in Java to have the same method name. This
    is called method overloading.


    In the Java programming language, method overloading is supported.  The Java programming
    language can also determine the difference between methods with different method
    signatures. In other words, different parameters can determine the difference
    from one method to the other. Of course, both methods have to be within the same
    class.


    Imagine having a class that can solve 2 numbers of the same datatype. Each method
    is different for each datatype. It is tiresome to write a new method name for
    each method. Since Java supports method overloading, it is possible to use the
    same method name for the multiple methods. The parameters or arguments are the
    only components that need to be changed.


    Public class solver{


    public void solve ( int a, int b ){ }


    public void solve ( float x, float y) { }


    public void solve ( double I, double j) { }


    }


    Methods that are overloaded can be distinguished through the number of parameters
    and the data type passed to the method. If you’ll notice in the code above, solve
    (int a, int b) and solve ( float x, float y) clearly have different parameters
    and are considered different from each other since they require different method
    parameters.


    It is not possible to declare one method with the same name and the same parameters.
    The compiler will not be able to differentiate them from one another regardless
    of their body. The Java compiler does not take into consideration the return type
    of the method when distinguishing them from one another. This means that it is
    not possible to declare two methods that have the same method signature regardless
    of their return type.


    Method overloading may be a very efficient concept in writing a program, but it
    reduces the codes readability so its usage is not that often.


    Method Value Returning


    There are three situations wherein a method exits its section and returns to the
    main program: First is when the method passes through all the statements in its
    body Second is when a return statement is encountered, and third, when an exception
    is thrown.


    It is possible to declare the return type of a method in the method declaration.
    The return statement is then used to return the value of the method evaluated
    within its body.


    If the return type of a method is void, then it does not return any value and
    it is not required to contain a return statement. However, in some cases, a return
    statement can be used to manipulate program flow and exit the method—almost similar
    to a break statement. Trying to return a value from a method with a void declaration
    will result to a compilation error. On the other hand, if a method is not declared
    void, it is required to have a return statement with its corresponding value.


    It is also vital that the data type of the return value is the same as the data
    type of the method’s declared return type. Take for example trying to return a
    float value from an integer value. It will result to an error.


    public int solveAverage ( ) {


    return ((score1+score2+score3)/3);


    }


    The method above will return the evaluated value of the expression (score1 + score2
    + score3) / 3.


    The return statement is not limited to primitive datatypes. It can also return
    reference type variables. Take a look at the following code:'
