    This Statement


    We have seen the use of “this” in previous chapters. this actually refers to the
    current object whose method or constructor is currently being invoked. Through
    the use of this, it is possible to refer to any member or attribute of the current
    object from within an instance method.


    The this keyword is generally used for a field because it is overshadowed by a
    method or constructor parameter.


    Take a look at the following example:


    public class sample{


    public int a;


    public int b;


    public sample (int i, int j) {


    a = i;


    b= j;


    }


    }


    Through the use of the this statement, the code can be re-written as:


    public class sample{


    public int a;


    public int b;


    public sample (int a, int b) {


    this.a = a;


    this.b = b;


    }


    }


    Every argument that the constructor has shadows each of the attributes of the
    object. The attribute x inside the constructor sample pertains to a local copy
    of the argument from the class sample. To be able to refer to the sample attribute
    x, the constructor is required to use this.x.


    It is also possible to use the this statement to call another constructor in the
    same class, provided that it is within a constructor. This process can be called
    explicit constructor invocation. For example:


    public class sample {


    private int a, b, var1, var2;


    public sample( ) {


    this(0, 1, 3, 3);


    }


    public sample(int var1, int var2) {


    this(0, 1, var1, var2);


    }


    public sample ( int a, int b, int var1, int var2)     {   


    this.a = a;


    this.b = b; 


    this.var1 = var1;


    this.var2 = var2;


    }  


    }


    The code above contains a set of constructors. Each constructor offers a default
    value and creates instances of the class sample’s member variables.


