  trans: "\n上面的代码声明 `obj1` 同时被声明为 `Object` 和 `MyOwnClass`。这种方法被称为隐式转换。\n\n相比之下，下面的代码被称为显式转换：\n\
    \n––––––––\n\n![image](img/scene_break.png)\n\n```\nMyOwnClass sample = obj1;\n\
    \nMyOwnClass sample = (MyOwnClass) obj;\n```\n\n如果没有将类型 `MyOwnClass` 赋值给 `obj1`，将会遇到错误，因为\
    \ `obj1` 的数据类型最初是未知的。显式转换在运行时初始化一个观察，以确保 `obj1` 的类型是 `MyOwnClass`。这是为了确保编译器能够识别出\
    \ `obj1` 是 `MyOwnClass` 的实例。如果 `obj1` 没有成为 `MyOwnClass` 的实例，程序将抛出异常。\n\n可以使用 `instanceof`\
    \ 来确定特定对象的类型。这减少了因转换不当而导致运行时错误的几率。\n\n```\nif (obj1 instanceof MMyOwnClass) {\n\
    \    MyOwnClass sample = (MyOwnClass) obj1;\n}\n```\n\n`instanceof` 运算符检查 `obj1`\
    \ 是否引用 `MyOwnClass`，以便在不会产生抛出运行时异常的情况下进行转换。\n\n## 多重继承\n\n类和接口之间的区别在于，接口不允许拥有字段，而类可以。另一个区别是，接口不能创建自身的实例来创建对象，而类可以被实例化来创建对象。正如第\
    \ 4 节过的，对象可以将其当前状态存储在字段中，这些字段可以通过类来定义。\n\nJava 语言不允许一个类拥有多个父类，的原因是为了避免状态多重继承的可能性，换句话说，避免从多个类继承字段的能力。\n\
    \n考虑一种情况，即创建一个可以扩展多个类的类。当通过一个类的实例创建对象时，该类所有父类的字段都将由对象继承。可能会出现一个方法或构造函数创建相同字段的实例。这将非常难以解决。这也是为什么接口不能包含字段；为了避免状态多重继承带来的问题。\n\
    \n从多个类中继承方法定义的能力被称为实现的多重继承。这种继承可能会带来很多问题，例如方法名冲突。能够支持多重继承的编程语言可能会遇到多个父类具有同名方法的情况。这些编程语言的编译器将无法区分一个方法与另一个方法之间的区别。人为错误（如与父类方法产生冲突）也可能发生。\n\
    \n默认方法也具有不同形式实现多重继承。一个类可以实现多个接口。这些接口可以包含同名的默认方法。在 Java 中，编译器有一套规则可以验证特定类需要或使用的默认方法。\n\
    \nJava 语言具有支持类型多重继承的能力。这在技术上是指实现多个接口的能力。一个对象可以拥有多个类型。这些类型可以是它们所属类的类型，也可以是该类实现的所有接口的类型。换句话说，如果一个声明变量被声明为接口类型，则该变量的值可以用来引用来自实现该接口的任何类的任何实例化对象。\n\
    \n另一方面，实现的多重继承允许类从它所扩展的接口中继承不同的实现，无论定义了任何方法。\n\n## 实例方法\n\n在子类中，与父类实例方法具有相同签名和返回类型的实例方法具有覆盖（override）父类实例方法的能力。\n\
    \n由于子类的重写能力，允许类继承特征相对相似的父类，并根据需要修改这些特征。重写方法的组件（名称、参数类型和参数数量、返回值）必须与它将重写的方法相同。重写方法还可以返回被重写方法返回类型的子类型；换句话说，即协变返回类型。\n\
    \n在方法重写期间，建议使用 `@Override`，以便指示编译器父类中的方法将被重写。如果父类中不存在要重写的方法，将发生错误。\n\n## 静态方法\n\
    \n当在子类中定义与父类相同的静态方法（方法签名相同）时，子类的方法将隐藏（hide）来自父类的方法。\n\n实例方法重写和静态方法重写的区别在于：\n\n\
    - 子类中被重写的实例方法是被调用的方法。\n- 使用的隐藏静态方法可能会有所不同，因为调用它的位置在父类和子类之间可能有所不同。\n\n在接口中，默认方法和抽象方法可以像实例方法一样处理，使其能够像实例方法一样被继承。尽管如果类或接口的父类型已经具有相同方法签名的默认方法，Java\
    \ 编译器将遵循继承规则，以解决方法名的冲突。这些规则是：\n\n- 接口默认方法的优先级低于实例方法。\n- 被其他候选者重写的方法将被忽略。这种情况发生在父类型具有相似祖先类时。\n\
    - 在抽象方法的情况下，如果至少有一个定义的默认方法与抽象方法冲突，Java 编译器将抛出编译错误。需要注意的是，父类型方法必须显式重写。\n\n## 多态\n\
    \n在生物学中，多态（polymorphism）术语指的是生物或物种可以呈现多种不同的阶段或形式。在 Java 语言中，这个概念同样适用。独特的行为由它们自己的子类定义，但仍然共享父类的一些功能。\n\
    \n为了演示多态，我们将对 `Vehicle` 类进行一些调整。例如，可以在类中添加一个名为 `displayData` 方法。该方法显示存储在实例中的所有数据。\n\
    \n––––––––\n\n![image](img/scene_break.png)\n\n```java\npublic void displayData(\
    \ ){\n    System.out.println(\"\\nThe Vehicle is \" + \"in the correct\" +\n+\
    \ with a gas in liters of \" + this.gas +\n\" and currently have  a total distance\
    \ of \" + this.distance + \". \");\n}\n```\n\n为了演示 Java 语言的多态，`Vehicle` 类被 `Car`\
    \ 类和 `RallyCar` 类扩展。对于 `Car` 类，将添加一个名为 `breaks` 的字段，它是一个指示汽车是否包含后减震器的字符串值。这里是更新后的类：\n\
    \n```java\npublic class Car extends Vehicle {\n    private String breaks;\n\n\
    \    public Car(\n        int sDistance,\n        int sGas,\n        int sAngle,\n\
    \        String breakType){\n        super(sDistance,\n        sGas,\n       \
