    |


    ![image](d2d_images/chapter_title_above.png)


    # Chapter 2:


    Conditional Statements, Iterative Statements,


    and Branching Statements


    ![image](d2d_images/chapter_title_below.png)


    Statements in Java can be written in the same manner as in other languages. Similar
    to how statements are written in C or Pascal, these statements can be grouped
    together in sections using ‘{‘and ‘}’.


    If-then-else Statement


    Like almost all languages, the if-then-else statement in Java allows an alternate
    path of execution when the “if” condition evaluates to false. Here is an example:


    void isZero() {


    If( x == 0 ) {


    System.out.println(“x is zero.”);


    }


    System.out.println(“X is not equal to zero.”);


    }


    Just like other languages, it is possible in Java to have an if-statement alone.
    You can have just the if-statement if your code does not have a lot of conditional
    executions.


    Now, take a look at the following code:


    Import Java.util.Scanner;


    Class ConditionCheck {


    Public static void main ( String[] args ) {


    int grade;


    Scanner sc = new Scanner( );  


    System.out.print.ln(“Enter your grade (0 – 100):”);


    number = sc.next();


    if (grade == 100) {


    System.out.println(“ You had a perfect score! Congratulations!”);


    } else if (grade >= 60) {


    System.out.println(“You passed the exam with a score of “ + grade + ”%.”);


    } else if (grade < 60 ) {


    System.out.println(“You failed the exam. You should study more to pass the next
    one.”);


    }


    }


    }


    The program above demonstrates a simple grade checker.  Just like any other language,
    Java can have multiple conditional statements. The ConditionCheck class is an
    example of one. The program will output “You had a perfect score” if the user
    input is equal to 100\. If the user input is greater than or equal to 60, the
    program will output “You passed the exam with a score of (grade) %” but if the
    user input is less than 60, the program will output “You failed the exam. You
    should study more to pass the next one.


    Boolean Expressions


    Boolean expressions can be used with logical operators corresponding to ‘and’,
    ‘or’, and ‘not’. These operators are written in Java as:


    And   | &&


    Or  | ||


    Not  | !


    Here is an example:


    If(a == 0  && b!=a) {


    B++;


    }


    Switch-Case Statement


    Although the switch statement is also a conditional statement like if-then and
    if-then-else, it differs through a number of varieties. A switch statement works
    with primitive data types such as byte, short, char, and int. Switch statements
    also work with enumerated data-types such as string and a few special classes
    that cover certain primitive types like char, byte, short, and int~in other words,
    a record.


    public class SwitchCase {


    public static void main(String[] args) {


    int month = 8;


    String monthStr;


    switch (month) {


    case 1:  monthStr = "January";


    break;


    case 2: monthStr = "February";


    break;


    case 3: monthStr = "March";


    break;


    case 4: monthStr = "April";


    break;


    case 5: monthStr = "May";


    break;


    case 6: monthStr = "June";


    break;


    case 7: monthStr = "July";


    break;


    case 8: monthStr = "August";


    break;


    case 9: monthStr = September";


    break;


    case 10: monthStr = "October";


    break;


    case 11: monthStr = "November";


    break;


    case 12: monthStr = "December";


    break;


    default: monthStr = "Invalid month";


    break;


    }


    System.out.println(monthStr);


    }


    }


    The code above demonstrates how a switch statement is written in Java. Note that
    the value of int month is 8 and there are 13 cases written including a default
    case to check if the value of month is (not) an integer between 1 and 12\. Considering
    the value of int month is, the result of the println will be ‘August’.


    The difference between if-else statement and switch statement is that the switch
    statement is much easier to read. Imagine having many multiple conditions written
    in if-else. It will be difficult to write and also hard to read.


    Another difference is the keyword break. In an if-else, the program only goes
    to one condition block at a time while in a switch statement; the program can
    go through all cases sequentially. Here is an example:


    int month = 8;


    switch (month) {


    case 1:  System.out.println(" January ");


    case 2:  System.out.println(" February ");


    case 3:  System.out.println(" March ");


    case 4:  System.out.println(" April ");


    case 5:  System.out.println(" May ");


    case 6:  System.out.println(" June ");


    case 7:  System.out.println(" July ");


    case 8:  System.out.println(" August ");


    case 9:  System.out.println(" September ");


    case 10: System.out.println(" October ");


    case 11: System.out.println(" November ");


    case 12: System.out.println(" December ");


    break;


    default: break;


    }


    Since the value of month is 8, the condition will jump to case 8 and that the
    break line is only written after case 12\. The resulting output of the code will
    be:


    August


    September


    October


    November


    December


    Switch Statements and Strings


    In the Java SE 7 and later versions of Java SE, it is possible to use the String
    data type in switch statements. Here is an example:


    public class getDate {


    public static int getMonthNo(String month) {


    int monthNo = 0;


    if (month == null) {


    return monthNo;


    }


    switch ( month.toLowerCase() ) {


    case "january" : monthNo = 1;


    break;


    case "february" : monthNo = 2;


    break;


    case "march" : monthNo = 3;


    break;


    case "april" : monthNo = 4;


    break;


    case "may" : monthNo = 5;


    break;


    case "june" : monthNo = 6;


    break;


    case "july" : monthNo = 7;


    break;


    case "august" : monthNo = 8;


    break;


    case "september": monthNo = 9;


    break;


    case "october" : monthNo = 10;


    break;


    case "november": monthNo = 11;


    break;


    case "december": monthNo = 12;


    break;


    default: monthNo = 0;


    break;


    }


    return monthNo;  }


    public static void main (String[] args) {


    String month = "August";


    int returnedMonthNo =  StringSwitchDemo.getMonthNo(month);


    if (returnedMonthNo == 0) {


    System.out.println( " Invalid month");


    } else {


    System.out.println(returnedMonthNo);


    }


    }


    }


    The output of the code above is 8\. The String data type in the switch expression
    is compared with the expressions linked with each case label like as if the String
    = method were being used. The value of the variable month needs to be converted
    to lowercase using the .toLowerCase method so that the getDate class example to
    be able to accept any month regardless of case. All the strings associated with
    the case label are in lowercase.


    Note: The code above also checks whether the expression in the switch statement
    has a value of null. It is important to remember that the expression in any switch
    statement is not null in order to prevent a NullPointerException from having an
    error or being thrown.'
