- fmt: "\n```java\nPublic MyOwnClass solveMethod( MyOwnClass sample1, myOwnClass sample2)\
    \ {\n    MyOwnClass example_1;\n    //insert some code here\n    Return example_1;\n\
    }\n```\n\n## This Statement\n\nWe have seen the use of `this` in previous chapters.\
    \ `this` actually refers to the current object whose method or constructor is\
    \ currently being invoked. Through the use of `this`, it is possible to refer\
    \ to any member or attribute of the current object from within an instance method.\n\
    \nThe `this` keyword is generally used for a field because it is overshadowed\
    \ by a method or constructor parameter.\n\nTake a look at the following example:\n\
    \n```java\npublic class sample{\n    public int a;\n    public int b;\n    public\
    \ sample (int i, int j) {\n        a = i;\n        b= j;\n    }\n}\n```\n\nThrough\
    \ the use of the `this` statement, the code can be re-written as:\n\n```java\n\
    public class sample{\n    public int a;\n    public int b;\n    public sample\
    \ (int a, int b) {\n        this.a = a;\n        this.b = b;\n    }\n}\n```\n\n\
    Every argument that the constructor has shadows each of the attributes of the\
    \ object. The attribute `x` inside the constructor `sample` pertains to a local\
    \ copy of the argument from the class `sample`. To be able to refer to the sample\
    \ attribute `x`, the constructor is required to use `this.x`.\n\nIt is also possible\
    \ to use the `this` statement to call another constructor in the same class, provided\
    \ that it is within a constructor. This process can be called explicit constructor\
    \ invocation. For example:\n\n```java\npublic class sample {\n    private int\
    \ a, b, var1, var2;\n    public sample( ) {\n        this(0, 1, 3, 3);\n    }\n\
    \    public sample(int var1, int var2) {\n        this(0, 1, var1, var2);\n  \
    \  }\n    public sample ( int a, int b, int var1, int var2)     {\n        this.a\
    \ = a;\n        this.b = b; \n        this.var1 = var1;\n        this.var2 = var2;\n\
    \    }  \n}\n```\n\nThe code above contains a set of constructors. Each constructor\
    \ offers a default value and creates instances of the class `sample`’s member\
    \ variables.\n\n# Chapter 5: Interfaces and Inheritance\n\nIn programming and\
    \ software engineering, there are some scenarios where it is vital for different\
    \ programmers or different groups of programmers to have a “common ground” that\
    \ will make their code and software interactive. These programmers should be able\
    \ to write their code regardless of not knowing how the code of other programmers\
    \ is written. The “common ground” for these programmers is called an interface.\n\
    \nTake for example a community wherein there are advanced vehicles that could\
    \ operate and transfer people without the help of a human operator. In order for\
    \ those vehicles to operate, their vehicle manufacturers develop software written\
    \ in Java that could manipulate the vehicle without human operation. Imagine your\
    \ vehicle or car starting and accelerating by itself and being able to manage\
    \ speed to avoid accidents.\n\nAnother example that can be considered is the Global\
    \ Positioning System or `GPS`. There are computer systems that receive data transmitted\
    \ by the `GPS` in order to track the location of a vehicle and provide wireless\
    \ transmission of other data such as up-to-date maps, weather and traffic situations.\
    \ Together with `GPS`, automated vehicles can have a sense of which route to choose\
    \ the correct direction in order to get to a destination without having any hassle\
    \ such as traffic.\n\nNow the `GPS` software and automation software for the vehicle\
    \ are clearly made by different teams of programmers. The team of programmers\
