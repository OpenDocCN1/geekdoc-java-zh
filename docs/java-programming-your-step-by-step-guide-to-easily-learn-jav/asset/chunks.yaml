  trans: "\n\n上述命令加载并执行了 `Hello` 类及其 `main` 方法。如果该类包含了对其他类的扩展（将在接下来的章节中进一步讨论），这些类会在需要时自动加载。如果你有一个源文件扩展了其他源文件，可以使用以下命令编译所有文件：\n\
    \n```bash\njavac *.java\n```\n\n假设所有文件都在同一个文件夹中，每个源文件将加载并执行其对应的类文件。\n\n## 声明与表达式\n\
    \nJava 中有八种基本数据类型。所谓基本类型，意味着这些类型不是基于其他类型定义的；本质上是原子的。它们是 CPU 准备好处理的位序列。这些类型是：\n\
    \n`Byte`, `short`, `int`, `long`, `float`, `double`, `char`, `Boolean`\n\n如果一个变量类型不是基本类型，则它被视为引用类型。引用类型可以可以是类、接口或数组类型。任何引用类型的变量都可以被设置为\
    \ `null`。这意味着它可以不包含任何内容。\n\nJava 支持通常的一组数据类型，如整数、字符、布尔型和其他变量。以下是一些示例：\n\n```java\n\
    int a, b;   //整数变量\nfloat f;    //浮点数变量\nchar s;     //字符变量\nboolean a;  //返回\
    \ true 或 false\n```\n\n注意：`//` 和 `/* */` 分别用于单行注释和多行注释。\n\n数值表达式的编写方式与其它语言几乎相同：\n\
    \n```java\na = 2 * (3 + 1);\nb = c / 4.12643;\np = q % 2;\no = true;\ns = ‘L’;\n\
    ```\n\n在声明变量时，可以直接为其分配一个初始值：\n\n```java\nint a = 5;\nfloat f = 0.52;\n```\n\n\
    Java 中的除法运算符实际上代表两种不同的含义。它可以是实数的浮点除法，也可以是整数的整除。在大多数情况下这并不是真的问题，尽管它可能会导致不同的结果。\n\
    \n```java\ndouble a;\na = 1 / 9;      // a 的结果将是 0.0\na = 1.0 / 9.0;  // a 的结果将是\
    \ 0.111...\n```\n\n第一个操作执行了整除，因此结果为 `0`。如果你想得到 `1` 和 `9` 的精确商，你需要将 `1` 和 `9` 表示为实值，以便除法变为浮点除法。\n\
    \n在 Java 中，可以为整数变量分配实值。该值会自动转换为对应的类型。这被称为类型转换（typecasting）。\n\nJava 支持类型转换，但不会自动执行转换。程序员需要通过在表达式前的括号中写入所需的类型，来指示在何处以及进行哪些转换。\n\
    \n```java\ndouble a;\nint b;\nb = (int) (a * 12.3223122);\n```\n\n当然，可以在不进行类型转换的情况下为实数变量分配整数。只要转换可以在不丢失任何信息的情况下进行，就没有必要强制转换。\n\
    \n## 类与方法\n\nJava 是一种面向对象的编程语言，因此我们使用的术语与结构化编程语言中的术语略有不同。\n\nJava 中的函数、子程序和过程被称为\
    \ `methods`（方法）。用于调用或执行函数的术语称为 `invoking`（调用）。变量和方法的组合在一起被称为 `class`（类）。\n\n以下是方法的一些示例：\n\
    \n```java\nclass HelloWorld{\n    public void sayHi(int a, int b){\n        aa\
    \ = a;\n        bb = b;\n    }\n    private int getAge(){\n        return x;\n\
    \    }\n}\n```\n\n上面的示例包含两个方法：`sayHi` 和 `getAge`。一个方法可以有多个参数，也可以没有参数。\n\n注意第一个方法以关键字\
    \ `public` 开头，第二个方法以 `private` 开头。这表示该方法是否可以从其他类访问。当你需要保护某些不应被其他方法访问的数据时这非常有帮助。\n\
    \n与 C 语言中的 `struct` 类型（记录结构）类似，Java 中的变量被视为类每个实例的一个组。一个对象被视为结构体或记录的发生实例。换句话说，一个对象是其类的实例。\n\
    \n了解对象属于哪个类也意味着了解它拥有哪组变量以及它可以执行哪些方法。这听起来可能很奇怪，因为一组变量按理不能执行任何操作。这是面向对象编程的核心。这意味着每一段代码都被认为是由一个对象在执行的。\n\
    \n这里是一个简单的 Java 代码示例：\n\n```java\nclass Section{ //这是定义了一个名为“Section”的类\n    int\
    \ a, b, c; //这些是定义的三个整数实例变量\n    /*每个 Section 实例都为这些变量拥有自己的值 */\n    void add(int\
    \ aa, int bb, int cc){\n        a+= aa; //将 (aa, bb) 加到 (a, b)\n        b+=bb;\
    \ \n        this.c += cc //“this.c” 等于“c”\n    }\n}\n```\n\n现在你可能在想 `this` 是做什么用的。很好，类中的每个方法都包含一个未列出的秘密参数，即变量组。该参数就是\
    \ `this`。`add` 方法需要知道它正在加哪个 section。调用者需要告诉加哪个 section。任何对 `add` 的调用都需要链接到 `Hello`\
    \ 类的特定实例。\n\n```java\nSection s1;\ns1 = new Section();\ns1.a = 1;\ns1.b = p;\n\
    s1.c = 0;\n```\n\n我们将在第 3、4 章中详细讨论方法、对象和类。现在来看这个简单的程序示例：\n\n```java\npublic class\
    \ HelloWorld{\n    public static void main(String[] args){\n        System.out.print(\"\
    Hello World!”);\n    }\n}\n```\n\n逐行讨论：\n\n首先你会看到类声明 `HelloWorld`。`public` 表示它可以被其他类访问。\n\
    \n其次，我们看到方法 `main`。注意方法声明中的 `static` 吗？这意味着当调用该方法时，它并不与对象关联，而是与类本身关联。换句话说，方法无法访问任何属性。\n\
    \n第三是 `args` 参数。该参数从 Java 解释器执行的类名以外的信息中获取值（如果有的话）。\n\n注意：`System.out.print` 是显示程序员在引号（\
    \ ” ）内编写内容的方法。如果你想在运行时换行，可以使用 `System.out.println`。这将为输出创建一个新行。\n\n示例 #2：\n\n\
    ```java\nimport java.util.Scanner; //导入包\npublic class User{\n    public static\
    \ void main( String[] args ){\n        Scanner inp = new Scanner(System.in); //实例化新对象\
    \ Scanner\n        String f_name; //字符串变量声明\n        String l_name;\n        String\
    \ full_name;\n        System.out.print(\"Enter your first name:\"); //这一行要求输入你的名\n\
    \        f_name = inp.next(); //输入的内容将通过 inp.next() 存储在 f_name 中\n        System.out.print(\"\
    Enter your last name:\"); //此行要求输入你的姓\n        l_name = inp.next(); //输入的内容现在将存储在\
    \ l_name 中\n        full_name = f_name + \" \" + l_name; //这一行将 f_name 和 l_name\
    \ 存储在 full_name 中，并用 \" \" 分隔\n        System.out.println(\"Hello,\"+ full_name\
    \ + \"! Pleased to meet you.\"); //这一行打印你的全名\n    }\n}\n```\n\n"
- fmt: "\nNow, the code above is an example of a basic input-output program in Java.\
    \ First, let’s try to discuss what the line `import java.util.Scanner;` means.\
    \ The `Scanner` class is a class that is really helpful when handling user input.\
    \ To use the `Scanner` class, we need to reference it to our code via the keyword\
    \ `import`. `Import` is basically the same as the `#include` in C. This means\
    \ that `import` references external libraries that are ready to use for our program.\n\
    \nNext is the line `Scanner inp = new Scanner(System.in);`.\n\nThis line simply\
    \ creates an object instance of the method `Scanner`. The `System.in` denotes\
    \ that it will store the input given by a user.\n\n```java\nf_name = inp.next();\n\
    l_name = inp.next();\n```\n\nThe two lines of code above demonstrate how the input\
    \ will be stored in `f_name` and `l_name` respectively. The line `inp.next();`\
    \ means that whatever input the user types in next, it will be stored in the corresponding\
    \ variable assigned to it.\n\nThe line `full_name = f_name + “ “ + l_name;` The\
    \ `+` symbols after `f_name` and before `l_name` indicate that you could put a\
    \ defined string or character in between. The `+` symbols simply connect both\
    \ user inputs and characters or symbols in one line or statement.\n\n# Chapter\
    \ 2: Conditional Statements, Iterative Statements, and Branching Statements\n\n\
    Statements in Java can be written in the same manner as in other languages. Similar\
    \ to how statements are written in C or Pascal, these statements can be grouped\
    \ together in sections using ‘{‘ and ‘}’.\n\n## If-then-else Statement\n\nLike\
    \ almost all languages, the `if-then-else` statement in Java allows an alternate\
    \ path of execution when the “if” condition evaluates to false. Here is an example:\n\
    \n```java\nvoid isZero() {\n  If( x == 0 ) {\n    System.out.println(“x is zero.”);\n\
    \  }\n  System.out.println(“X is not equal to zero.”);\n}\n```\n\nJust like other\
    \ languages, it is possible in Java to have an `if`-statement alone. You can have\
    \ just the `if`-statement if your code does not have a lot of conditional executions.\n\
    \nNow, take a look at the following code:\n\n```java\nImport Java.util.Scanner;\n\
    \nClass ConditionCheck {\n  Public static void main ( String[] args ) {\n    int\
    \ grade;\n    Scanner sc = new Scanner( );\n    System.out.print.ln(“Enter your\
    \ grade (0 – 100):”);\n    number = sc.next();\n    if (grade == 100) {\n    \
    \  System.out.println(“ You had a perfect score! Congratulations!”);\n    } else\
    \ if (grade >= 60) {\n      System.out.println(“You passed the exam with a score\
    \ of “ + grade + ”%.”);\n    } else if (grade < 60 ) {\n      System.out.println(“You\
    \ failed the exam. You should study more to pass the next one.”);\n    }\n  }\n\
    }\n```\n\nThe program above demonstrates a simple grade checker. Just like any\
    \ other language, Java can have conditional statements. The `ConditionCheck` class\
    \ is an example of one. The program will output “You had a perfect score” if the\
    \ user input is equal to `100`. If the user input is greater than equal to `60`,\
    \ the program will output “You passed the exam with a score of grade% but if user\
    \ input is less than `60`, the program will output “You failed the exam. You should\
    \ study more to pass the next one.”\n\n## Boolean Expressions\n\nBoolean expressions\
    \ can be used with logical operators like ‘and’, ‘or’, and ‘not’. These operators\
    \ are written in Java as:\n- `&&`\n- `||`\n- `!`\n\nHere is an example:\n\n```java\n\
    If(a == 0 && b) {\n  B++;\n}\n```\n\n## Switch-Case Statement\n\nAlthough the\
    \ `switch` statement is also a conditional statement like `if-then` and `if-then-else`,\
    \ it differs through a number of varieties. A `switch` statement works with primitive\
    \ types such as `byte`, `char`, and `int`. `Switch` statements also work with\
    \ enumerated data such as `string` and few special classes that cover primitive\
    \ types like `byte`, `char`, and `int`-in other words, a record.\n\n```java\n\
    public class SwitchCase {\n  public static void main(String[] args) {\n    int\
    \ month = 8;\n    String monthStr;\n    switch (month) {\n      case 1: monthStr\
    \ = \"January\"; break;\n      case 2: monthStr = \"February\"; break;\n     \
    \ case 3: monthStr = \"March\"; break;\n      case 4: monthStr = \"April\"; break;\n\
    \      case 5: monthStr = \"May\"; break;\n      case 6: monthStr = \"June\";\
    \ break;\n      case 7: monthStr = \"July\"; break;\n      case 8: monthStr =\
    \ \"August\"; break;\n      case 9: monthStr = \"September\"; break;\n      case\
    \ 10: monthStr = \"October\"; break;\n      case 11: monthStr = \"November\";\
    \ break;\n      case 12: monthStr = \"December\"; break;\n      default: monthStr\
    \ = \"Invalid month\"; break;\n    }\n    System.out.println(monthStr);\n  }\n\
    }\n```\n\nThe code above demonstrates how a `switch` statement is written in Java.\
    \ Note that the value of `int month` is `8` and there are `13` cases written including\
    \ a `default` case to check if the value of `month` is an integer between `1`\
    \ and `12`. Considering the value of `int month`, the result of `println` will\
    \ be ‘August’.\n\nThe difference between `if-else` statement and `switch` statement\
    \ is that the `switch` statement is much easier to read. Imagine having multiple\
    \ conditions written in `if-else`. It will be difficult to write and also hard\
    \ to read. Another difference is the keyword `break`. In an `if-else`, the program\
    \ only goes to one condition block at a time while in a `switch` statement; the\
    \ program can go through all cases sequentially. Here is an example:\n\n```java\n\
    int month = 8;\nswitch (month) {\n  case 1: System.out.println(\" January \");\n\
    \  case 2: System.out.println(\" February \");\n  case 3: System.out.println(\"\
    \ March \");\n  case 4: System.out.println(\" April \");\n  case 5: System.out.println(\"\
    \ May \");\n  case 6: System.out.println(\" June \");\n  case 7: System.out.println(\"\
    \ July \");\n  case 8: System.out.println(\" August \");\n  case 9: System.out.println(\"\
    \ September \");\n  case 10: System.out.println(\" October \");\n  case 11: System.out.println(\"\
    \ November \");\n  case 12: System.out.println(\" December \");\n  break;\n  default:\
    \ break;\n}\n```\n\nSince the value of `month` is `8`, the condition will jump\
