  raw: 'An abstract method is almost the same as a method signature. It does not need
    implementation. A default method is a method which is declared within the default
    modifier. A static modifier, on the other hand, is declared within the static
    modifier. The abstract, static and default methods within an interface are by
    default, public.


    Besides the methods, it is also possible to use constant declarations in interfaces.
    Every constant value declared in an interface can be any of the modifiers (public,
    static, final).


    For a class to be able to implement an interface, the keyword implements must
    be written before the interface name in the declaration. It is possible for a
    class to implement more than one interface. If that situation happens, the interfaces
    to be implemented by the class are separated by commas. If a class is extending
    a superclass and implements an interface, the keyword extends is always followed
    by the superclass name, and then the implements keyword.


    Imagine an interface that defines a comparison between sizes of objects:


    public interface Comparison{


    public int isSmallerThan(Comparison object_1);


    }


    In order to be able to compare the sizes of similar objects regardless of their
    type, the interface Comparison needs to be implemented by the class that instantiates
    them.


    It is possible for any class to implement the interface Comparison as long as
    there is a method that can compare the similar field of objects that are instantiated
    from the class. For other datatypes such as strings, the number of characters
    can be compared. For other objects such as person, fields such as height and age
    can be used. For mathematical situations such geometrical objects, areas can have
    comparisons while other situations such as volume would be suitable for three-dimensional
    object comparisons. The method isSmallerThan() can be implemented by all the said
    classes.


    If it is known that a class can implement the interface Comparison, then it is
    also a fact that it is possible to compare the object size instantiated from its
    class.


    Inheritance


    We have seen the application of inheritance in some of the previous chapters.
    The Java programming language allows classes to be derived from other classes.
    With that being possible, the attributes and methods of the parent class will
    be inherited by the derived class or the subclass.


    The following code is a simple implementation of the class Vehicle which was used
    in an earlier example:


    Public class Car implements automateVehicle {


    public class Vehicle {


    Float distance;


    Float gas;


    Float angle;


    public Vehicle(float Vgas, float Vdistance, float Vangle ) {


    gas = Vgas;


    distance = Vdistance;


    angle = Vangle;


    } 


    Public void setDistance(int Ndistance){


    distance = Ndistance;


    }


    public void setGas(int Ngas) {


    gas = Ngas;


    }


    Public void turnStraight(int value){


    angle-= value;


    }


    Public void turn(int value){


    Angle+= value;


    }


    }


    The class declaration for class Car that is a subclass of class Vehicle will look
    like this:


    public class Car extends Vehicle {


    public int heatRate;


    public Car(float heatR, float sDistance, float sGas, float sAngle) {


    super(sDistance, sGas, sAngle);


    heatRate = heatR;


    } 


    // the car subclass adds one method


    public void setHeatRate(int newValue) {


    heatRate = newValue;


    } 


    }


    The subclass Car gets to inherit all the fields and methods of its superclass
    Vehicle. It also adds another method named setHeatRate and its field heatRate.
    Besides the constructor, writing the subclass Vehicle seems like it was a different
    class made entirely from nothing, together with its fields and methods. That was
    how it felt but now how it was made. This technique will be very important if
    the methods in the superclass Vehicle were more complex and took a very long time
    to debug.


    A subclass is a class derived from another class. It can also be called a derived
    class, or child class.  The opposite of the subclass is the superclass. A superclass
    is the class where the subclass was derived. Another term for a superclass is
    the parent class.


    All the members from the superclass, including the attributes, methods, and other
    nested classes, are inherited by the subclass. Although it does not inherit the
    constructors but the constructor of the superclass can be called from the subclass.


    The Java Programming Language does not support multiple superclass inheritance.
    This means that every class can only have one direct superclass. Besides an object,
    every class is basically a subclass of Object; Assuming that the said class does
    not have a declared superclass.   A subclass having a subclass extended by another
    subclass is possible. The topmost superclass of every class is the class Object.
    Every single class can be traced back to object regardless of the subclasses.


    The concept of inheritance can be very efficient when it comes to handling multiple
    classes that basically have the same structure.


    For example, imagine a class Mountain and class Valley. Instead of rewriting all
    the attributes of class Mountain to class Valley, it is possible to create a class
    Landform which contains all the same attributes and methods that both class Mountain
    and class Valley have. This also reduces the possibility of errors and reduces
    debugging time.


    Java Platform Hierarchy


    In the Java Programming Language, the class Object is basically the core class
    of all classes. It is the most common of all classes. All classes are derived
    from class Object. These classes then can have subclasses and so on. This is called
    a hierarchy of classes. Classes at the bottom of the hierarchy tend to perform
    more specific methods compared to their superclasses.


    Subclasses


    A subclass can inherit all the public and protected members of its parent regards
    less of what package the subclass is located in. If both the subclass and its
    parent are in the same package, the subclass can also inherit all of the parent’s
    private members. With that said, a subclass can do manipulations to its inherited
    members such as:


    *   Direct usage of the inherited fields


    *   Declaring a field within the subclass but having the same name as the superclass


    *   Declaring new fields not included in the superclass


    *   Direct usage of all the inherited methods from the parent


    *   Creating a new instance method in the subclass that can have the same method
    signature in the superclass (method overriding)


    *   Creating a new static method with the same name as the superclass


    *   Declaring new methods in the subclass that are not included in the superclass


    *   Creating a subclass constructor that calls the constructor of the superclass


    A subclass cannot inherit the private members of its parent class. This can only
    be possible if both the subclass and the parent class are in the same package.


    If the methods used by the superclass for accessing private fields are either
    public or protected, these methods are accessible to the subclass. The nested
    classes in a class have access to all of the private fields and methods of its
    enclosing class. Hence, if a nested class is either public or protected, its subclass
    gains access to all of the private members of its superclass.


    We have already discussed that the object is from the data type of the class where
    it was instantiated. For example:


    public MyOwnClass sample = new MyOwnClass ( );


    The data type of the object sample is MyOwnClass.


    The object sample comes from the class MyOwnClass. This makes sample a MyOwnClass
    and also an object which can be used for all the purposes of MyOwnClass or Object.


    The idea that MySuperClass maybe a MyOwnClass may be true is not necessary. It
    can be considered the same as an Object can be a MySuperClass or MyOwnClass is
    true but not necessary.


    The use of an object of one type as a substitute or alternative for another type
    among the list of objects where inheritance and implementation are possible is
    called Casting.


    For example:


    Object obj1 = new MyOwnClass ( );'
