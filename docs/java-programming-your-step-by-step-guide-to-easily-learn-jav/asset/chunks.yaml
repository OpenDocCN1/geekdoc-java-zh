    from a superclass whose characteristics are relatively similar and modify those
    characteristics as required. The components (name, type and number of parameters,
    return type) of the overriding method must be the same as the method that it will
    override. It is also possible for an overriding method to return the subtype of
    the type returned by the overridden method; In other words, a covariant return
    type.


    During method overriding, it is recommended to use the @Override so that the compiler
    will be instructed that a method in the superclass will be overridden. If the
    method to be overridden in the superclass does not exist, an error will occur.


    Static Methods


    When an identical static method (identical method signatures) from a superclass
    is defined within a subclass, the method from the subclass will hide the method
    from the superclass.


    The difference between instance method overriding and static method overriding
    are:


    *   The overridden instance method in the subclass is the method that is invoked.


    *   The hidden static method that gets used may vary since the location where
    it is invoked may vary between a superclass and a subclass.


    In an interface, default methods and abstract methods can be treated like instance
    methods in such a way that they can be inherited like instance methods. Although
    if the supertypes of a class or interface already have default methods with the
    same method signatures, the java compiler will follow the rules of inheritance
    so that the conflict in method name will be resolved. These rules are:


    *   Interface default methods are less preffered over instance methods.


    *   Overriden methods by other candidates will be ignored. This situation happens
    when the supertypes have a similar ancestor.


    *   In the case of abstract methods, if there is at least one defined default
    method that conflicts with an abstract method, a compiler error will be thrown
    by the Java compiler. It is important to note that the supertype methods must
    be overridden explicitly.


    Polymorphism


    In Biology, the term polymorphism is referred to where in an organism or species
    can assume multiple different phases or forms. In the Java programming language,
    this concept is also applicable. The unique behaviors can be defined by their
    own subclass but still be able to share some of the similar functionalities of
    the parent class.


    To be able to demonstrate polymorphism, we will make some adjustments to the class
    Vehicle. For example, a method named displayData can be added to the class. This
    method displays all the data that are currently stored in an instance.


    ––––––––


    ![image](d2d_images/scene_break.png)


