    \nJava 中的多维数组与 C 或其他语言中的多维数组略不同，因为 Java 中多维数组的组件也是数组。\n\n为了更好地理解这一点，这里有一个示例代码：\n\
    \n```java\nclass sample_md_array {\n    public static void main(String[] args)\
    \ {\n        String[][] rankings = {\n            {\"Sgt. \", \"Lt. \", \"Capt.\
