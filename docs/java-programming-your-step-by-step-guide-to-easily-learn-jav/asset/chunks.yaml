    Note: Since the code above is an unlabeled continue statement, the code will not
    skip the expression included although it will still evaluate whether the expression
    is true of false.


    A labeled continue, on the other hand, skips the loop where the label begins.
    Here is an example of a labeled continue statement:


    public class Hello{


    public static void main(String[] args){


    int x,y;


    loop:


    for(x=0;x<5;x++){


    System.out.println(" ");


    for(y=0;y<5;y++){


    System.out.print("x ");


    if(y==3 && x==2 ){


    continue loop;


    }


    }


    }


    } 


    }


    The output of the program will be:


    x x x x x


    x x x x x


    x x x x


    x x x x x


    x x x x x


    Notice the third row does not have 5 x’s? That’s because when the expression if
    ( y == 3 && x == 2 ) became true, the continue label jumped right back to the
    loop for ( x = 0; x < 5; x ++ ). This means that the continue statement skipped
    when the program arrived when the expression if( y == 3 && x == 2 ) became true.
    That is what a labeled continue statement does.


    The return Statement


    The return statement is different from both the break and continue statements.
    It exits from a method and returns to where the method was called.


    A return statement, like the return statement in other programming languages,
    has two forms: one that returns a value, and one that does not. In order to return
    a value, simply write the value or expression that evaluates the value after the
    return keyword. Here is an example:


    return answer;


    Here is an example of a return statement without a value:


    return;


    Note: When a return statement is used, the return type of the method should be
    int. If void is declared for a method, the return statement will not work.  The
    data type after the return value must also be the same as the one declared as
    a parameter in the method. Otherwise, the program will run into an error.


    We will see more use of the return statement on chapter 4.


