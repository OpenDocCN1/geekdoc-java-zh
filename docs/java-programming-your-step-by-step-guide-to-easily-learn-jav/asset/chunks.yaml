    f_name = inp.next();


    l_name = inp.next();


    The two lines of code above demonstrate how the input will be stored in f_name
    and l_name respectively. The line inp.next(); means that whatever input the user
    types in next, it will be stored in the corresponding variable assigned to it.


    The line full_name = f_name + “ “ + l_name; The + symbols after f_name and before
