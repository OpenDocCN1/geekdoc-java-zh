    System.out.println("\nThe Vehicle is " + "in the correct" + this.


    + " with a gas in liters of " + this.gas +


    " and currently have  a total distance travelled of " + this.distance + ". ");


    }


    To be able to demonstrate the features of polymorphism in the Java Programming
    Language, the class Vehicle is extended by a class Car and a RallyCar class. For
    the class Car, a field named breaks will be added, which is a String value that
    indicates if the car contains a back shock absorber, Here is the updated class:


