    # 引言


    ![image](img/chapter_title_below.png)


    编程世界是非常多样化的世界，每种编程语言都有其特定的优势。有像 C 和汇编语言这样的语言关注操作系统指令和其他计算机软件，而也有像 HTML 和 JavaScript
    这样的语言关注基于 Web 的应用程序。Java 就是兼顾这两者的编程语言示例。本电子书包含了指南和说明，帮助你在一天内学习并理解 Java。


    ### 什么是 Java？


    Java 实际上是由 Sun Microsystems 开发的一种优秀的编程语言。它最初用于内核应用程序或小程序（applets）。这些小程序嵌入网页并在浏览器中运行。Java
    使用一种名为字节码（byte code）的特殊格式，而不是普通的机器码。在 Java 解释程序的帮助下，字节码可以在任何计算机上执行。这个 Java 解释器程序被称为
    Java 虚拟机或 `JVM`。它在大多数计算机系统中都是可。Java 可能使用字节码格式，但 Java 没有任何部分要求使用这种字节码技术。存在一些编译器可以生成真正的机器码，或者更广为人知的原生代码。


    Java 程序由一系列类组成。这些程序的源代码使用 `.java` 编写。这些源文件然后被编译成 `.class` 文件，其中包含字节码而不是针对特定 CPU
    的机器码。`.class` 文件在运行时由 Java 虚拟机（`JVM` 或解释器）执行。


    Java 并不限于互联网应用程序。从技术上讲，它是一种完整的通用面向对象编程语言，可以开发各种应用程序。Java 的语法与 C++ 的语法非常相似，但去除了其容易出错的特性和复杂性。


    不要将 Java 误认为 JavaScript。JavaScript 是一种完全不同的语言。JavaScript 是一种解释型编程语言，作为网页或网站内容生成的三个基本组成部分之一。Java
    和 JavaScript 的区别在于 Java 是面向对象的语言，而 JavaScript 是面向对象的脚本语言。Java 编写的代码需要编译，而 JavaScript
    编写的代码全是文本。种语言在虚拟机和浏览器中都需要不同的插件。


    创建 Java 的 Sun Microsystems 为开发 Java 软件提供了免费工具。如果你想了解更多关于这些工具的信息，可以访问网站 ([`www.sun.com`](https://www.sun.com))
    获取更多信息，例如针对不同计算机系统（UNIX、Microsoft Windows、OSX）的 Java 编译器以及详细文档。Java 编译器是免费的，可以从给定链接下载。


    在整个电子书中，我们将讨论 Java 程序编译的基础、简单表达式和声明、类、对象和语句，直到你能够在一天内学习、理解并编写一个完整的 Java 程序。


