    If you’ll notice, a method copyOfRange from the java.util.Arrays package was used
    instead of the arraycopy method. Its difference is that the developer is no longer
    required to initialize the destination array before invoking the method since
    the destination array itself is the value returned by the method.


    The output of the program will also be the same as the program which applied the
    arraycopy method but if you’ll examine more properly, the starting index to be
    copied to the destination array is no longer required. Only the source array,
    the starting index and up to what index the method needs to reach; in other words,
    the final index to be copied.


    Other methods that the java.util.Arrays package class include are:


    BinarySearch method


    *   This method searches the array for a specific value by locating the index
    where it is placed.


    Equals Method


    *   This method compares two arrays in order to determine if the values are equal
    or not.


    Fill method


    *   This method is used for storing values. It fills the array by placing a specific
    value at each index.


    ParallelSort


    *   This method was only introduced in Java SE 8\. The parallelSort arranges the
    elements concurrently of an array into ascending order. Parallel sorting is very
    efficient in arranging large amounts of arrays; typically on multiprocessor systems.


    Sort Method


    *   This method also works the same as the parallelSort method but sorts the elements
    of the array sequentially.


