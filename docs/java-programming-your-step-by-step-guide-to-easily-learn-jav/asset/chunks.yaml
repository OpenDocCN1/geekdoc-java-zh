  trans: "\n现在，上面的代码是一个 Java 基础输入输出程序的示例。首先，让我们来讨论一下 `import java.util.Scanner;` 这一行的含义。`Scanner`\
    \ 类是一个在处理用户输入时非常有用的类。要使用 `Scanner` 类，我们需要通过关键字 `import` 将其引用到我们的代码中。`Import` 基本上与\
    \ C 语言中的 `#include` 相同。这意味着 `import` 引用了我们的程序可以直接使用的外部库。\n\n接下来是这一行 `Scanner inp\
    \ = new Scanner(System.in);`。\n\n这一行简单地创建了 `Scanner` 方法的对象实例。`System.in` 表示它将存储用户提供的输入。\n\
    \n```java\nf_name = inp.next();\nl_name = inp.next();\n```\n\n上述两行代码演示了输入如何分别存储在\
    \ `f_name` 和 `l_name` 中。`inp.next();` 行意味着用户接下来输入的任何内容，都将存储在赋值给它的相应变量中。\n\n`full_name\
    \ = f_name + “ ” + l_name;` 这一行。`f_name` 之后和 `l_name` 之前的 `+` 符号表示你可以在它们之间定义的字符串或字符。`+`\
    \ 符号仅将两个用户输入以及字符或符号连接在一个行或语句中。\n\n# 第 2 章：条件语句、迭代语句和分支语句\n\n Java 中的语句的编写方式与其他语言相同。与在\
    \ C 或 Pascal 中编写语句的方式类似，这些语句可以使用 ‘{‘ 和 ‘}’ 在部分中分组在一起。\n\n## If-then-else 语句\n\n\
    与几乎所有语言一样，Java 中的 `if-then-else` 语句允许当“if”条件评估为假时执行另一种执行路径。以下是一个示例：\n\n```java\n\
    void isZero() {\n  If( x == 0 ) {\n    System.out.println(“x is zero.”);\n  }\n\
    \  System.out.println(“X is not equal to zero.”);\n}\n```\n\n与其他语言一样，在 Java 中单独使用\
    \ `if`-语句是可能的。如果你的代码中没有很多条件执行，你只需要 `if`-语句即可。\n\n现在，看看下方的代码：\n\n```java\nImport\
    \ Java.util.Scanner;\n\nClass ConditionCheck {\n  Public static void main ( String[]\
    \ args ) {\n    int grade;\n    Scanner sc = new Scanner( );\n    System.out.print.ln(“Enter\
    \ your grade (0 – 100):”);\n    number = sc.next();\n    if (grade == 100) {\n\
    \      System.out.println(“ You had a perfect score! Congratulations!”);\n   \
    \ } else if (grade >= 60) {\n      System.out.println(“You passed the exam with\
    \ a score of “ + grade + ”%.”);\n    } else if (grade < 60 ) {\n      System.out.println(“You\
    \ failed the exam. You should study more to pass the next one.”);\n    }\n  }\n\
    }\n```\n\n上面的程序演示了一个简单的成绩检查器。与任何其他语言一样，Java 也可以有条件语句。`ConditionCheck` 类其中一个示例。如果用户输入等于\
    \ `100`，程序将输出“You had a perfect score”。如果用户输入大于或等于 `60`，程序将输出“You passed the exam\
    \ with a score of grade%”，但如果用户输入小于 `60`，程序将输出“You failed the exam. You should\
    \ study more to pass the next one.”\n\n## 布尔表达式\n\n布尔表达式可以与逻辑运算符如‘and’‘or’和‘not’一起使用。这些运算符在\
    \ Java 中的写法为：\n- `&&`\n- `||`\n- `!`\n\n以下是一个示例：\n\n```java\nIf(a == 0 && b) {\n\
    \  B++;\n}\n```\n\n## Switch-Case 语句\n\n虽然 `switch` 语句也是像 `if-then` 和 `if-then-else`\
    \ 一样的条件语句，但它在许多方面有所不同。`switch` 语句与 `byte`、`char` 和 `int` 等原始类型一起。`Switch` 语句也适用于枚举数据，如\
    \ `string` 以及少数覆盖原始类型（如 `byte`、`char` 和 `int`）的特殊类——换句话说，即记录。\n\n```java\npublic\
    \ class SwitchCase {\n  public static void main(String[] args) {\n    int month\
    \ = 8;\n    String monthStr;\n    switch (month) {\n      case 1: monthStr = \"\
    January\"; break;\n      case 2: monthStr = \"February\"; break;\n      case 3:\
    \ monthStr = \"March\"; break;\n      case 4: monthStr = \"April\"; break;\n \
    \     case 5: monthStr = \"May\"; break;\n      case 6: monthStr = \"June\"; break;\n\
    \      case 7: monthStr = \"July\"; break;\n      case 8: monthStr = \"August\"\
    ; break;\n      case 9: monthStr = \"September\"; break;\n      case 10: monthStr\
    \ = \"October\"; break;\n      case 11: monthStr = \"November\"; break;\n    \
    \  case 12: monthStr = \"December\"; break;\n      default: monthStr = \"Invalid\
    \ month\"; break;\n    }\n    System.out.println(monthStr);\n  }\n}\n```\n\n上面的代码演示了在\
    \ Java 中如何编写 `switch` 语句。注意 `int month` 的值为 `8`，并且编写了 `13` 种情况，包括一个 `default`\
    \ 情况，用于检查 `month` 的值是否为 `1` 到 `12` 之间的整数。考虑到 `int month` 的值，`println` 的结果将是 ‘August’。\n\
    \n`if-else` 语句和 `switch` 语句之间的区别在于 `switch` 语句更易读。想象一下在 `if-else` 中写了多个条件。它将很难编写也难以阅读。另一个区别是关键字\
    \ `break`。在 `if-else` 中，程序每次只进入一个条件块，而在 `switch` 语句中；程序可以按顺序通过所有情况。这里有一个示例：\n\n\
    ```java\nint month = 8;\nswitch (month) {\n  case 1: System.out.println(\" January\
    \ \");\n  case 2: System.out.println(\" February \");\n  case 3: System.out.println(\"\
    \ March \");\n  case 4: System.out.println(\" April \");\n  case 5: System.out.println(\"\
    \ May \");\n  case 6: System.out.println(\" June \");\n  case 7: System.out.println(\"\
    \ July \");\n  case 8: System.out.println(\" August \");\n  case 9: System.out.println(\"\
    \ September \");\n  case 10: System.out.println(\" October \");\n  case 11: System.out.println(\"\
    \ November \");\n  case 12: System.out.println(\" December \");\n}\n```\n\n由于\
    \ `month` 的值为 `8` 且编写了 `13` 种情况（包括一个用于检查 `month` 值是否为 `1` 到 `12` 之间整数的 `default`\
    \ 情况），程序将跳转到 `case 8`。输出将是：\nSeptember\nOctober\nDecember\n\n## Switch 语句与字符串\n\
    \n在 Java SE 7 及更高版本中，可以在 switch 语句中使用 `String` 类型。以下是一个示例：\n\n```java\npublic\
    \ class getDate {\n  public static int getNo(String month) {\n    int monthNo\
    \ = 0;\n    if (month == null) {\n      return monthNo;\n    }\n    switch ( month.toLowerCase()\
    \ ) {\n      case \"january\" : monthNo = 1; break;\n      case \"february\" :\
    \ monthNo = 2; break;\n      case \"march\" : monthNo = 3; break;\n      case\
    \ \"april\" : monthNo = 4; break;\n      case \"may\" : monthNo = 5; break;\n\
    \      case \"june\" : monthNo = 6; break;\n      case \"july\" : monthNo = 7;\
    \ break;\n      case \"august\" : monthNo = 8; break;\n      case \"september\"\
    : : monthNo = 9; break;\n      case \"october\" : monthNo = 10; break;\n     \
    \ case \"november\": : monthNo = 11; break;\n      case \"december\": : monthNo\
    \ = 12; break;\n      default: monthNo = 0; break;\n    }\n    return monthNo;\n\
    \  }\n  public static void main (String[] args) {\n    String month = \"August\"\
    ;\n    int returnedMonthNo = getDate.getNo(month);\n    if (returnedMonthNo ==\
    \ 0) {\n      System.out.println( Invalid month\");\n    } else {\n      System.out.println(returnedMonthNo);\n\
    \    }\n  }\n}\n```\n\n上述代码的输出是 `8`。switch 表达式中的 `String` 类型与每个 case 标签关联的表达式进行比较，就像使用了\
    \ `String=` 方法一样。为了让 `getDate` 类示例能够接受任何大小写的月份，需要使用 `.toLowerCase` 方法将变量的值转换为小写。与\
    \ case 标签关联的所有字符串都是小写的。\n\n注意：上面的代码还检查了 switch 语句中的表达式是否为 null。记住，为了防止 `NullPointerException`\
    \ 产生或被抛出，任何 switch 语句中的表达式都不能为 null。\n\n"
- fmt: "\n# Loops and Iterative Statements\n\n## The While Statement\n\nThe `while`\
    \ statement in Java is pretty much not that different from the `while` statements\
    \ of other programming languages. The `while` statement continuously executes\
    \ a section of instructions while the condition indicated is true. It’s syntax\
    \ can be written as:\n\n```\nwhile (expression | instruction| condition) {\n \
    \   Statement | instruction | condition (s);\n}\n```\n\nThe `while` statement\
    \ checks the `expression` which needs to return a boolean value. As long as the\
    \ value of the `expression` evaluates to `true`, the `while` statement will continue\
    \ the instructions or statements included inside the `while` section. The `while`\
    \ statement will continue evaluating the `expression` and will execute its instructions\
    \ until the value of the `expression` becomes `false`. The sample code below prints\
    \ out the values from 1 to 10 given the expression `count`.\n\n```java\nclass\
    \ displayNumbers {\n    public static void main(String[] args){\n        int count\
    \ = 1;\n        while (count < 11) {\n            System.out.println (\"Count\
    \ is: \" + count);\n            count++;\n        }\n    }\n}\n```\n\nAs you can\
    \ see in the code above, the `while` statement checks if the value of `count`\
    \ is not greater than 11. If the `expression` evaluates to `true`, the program\
    \ will enter the `while`-statement and execute the line `System.out.println(\"\
    Count is:\" + count)`. After that, the value of `count` will be increased and\
    \ re-evaluate its value until the expression `count < 11` becomes `false`.\n\n\
    It is also possible to implement an infinite loop using the `while` statement.\
    \ The sample code below demonstrates how:\n\n```java\nwhile (true){\n    // your\
    \ code goes here\n}\n```\n\nSince the `expression` will always evaluate to `true`,\
    \ the `while` statement will keep executing the instructions inside the block;\
    \ hence, the infinite loop.\n\n## Do-while Statement\n\nIn the Java programming\
    \ language, there is also a `do-while` statement. The `do-while` statement does\
    \ not really have that much of a difference when compared to the `do-while` statements\
    \ of other programming languages. The `do-while` statement can be expressed like\
    \ this:\n\n```\ndo {\n    statement(s)\n} while (expression);\n```\n\nWhen the\
    \ program enters the `do-while` statement, it immediately executes the instructions\
    \ and statements inside the block. After that will it only check if the `expression`\
    \ is `true` or not.\n\n### What’s the difference between a do-while and a while?\n\
    \nThe difference between `do-while` and `while` is that `do-while` evaluates its\
    \ `expression` at the bottom of the loop instead of the top. Therefore, the statements\
    \ within the `do` block are always executed at least once. The code below demonstrates\
    \ how a Java program with a simple `do-while` loop works:\n\n```java\nclass DoWhileSample\
    \ {\n    public static void main(String[] args){\n        int count = 1;\n   \
    \     do {\n            System.out.println(\"Count is: \" + count);\n        \
    \    count++;\n        } while (count < 11);\n    }\n}\n```\n\n## For Statement\n\
    \nIn the Java Programming Language, the `for` statement gives an accurate task\
    \ to loop or iterate over a range of values. A common term used by developers\
    \ and programmers for the `for` statement is the “for loop” due to its repetitive\
    \ iteration until its conditions are met. A `for` loop can be written as:\n\n\
    ```\nfor (initial value; terminating condition; incrementing value) {\n    //expressions\
    \ | statements\n}\n```\n\nIn using a `for` loop, it is vital to note that the\
    \ `initial value` is the starting point of the loop. It is only executed once\
    \ at the beginning. Once the `terminating condition` is met, the loop will halt\
    \ and terminate. If the `terminating condition` is not yet met, every time the\
    \ loop iterates, the `incrementing value` is added to the current value. It will\
    \ keep incrementing as long as the `terminating condition` evaluates to `true`.\
    \ The `incrementing value` can also be decrementing depending on the flow of program.\n\
    \n```java\nclass sample_For {\n    public static void main(String[] args){\n \
    \       for (int x=1; x<10; x++){\n            System.out.println (\"The current\
    \ value is: \" + x);\n        }\n    }\n}\n```\n\nThe example code above shows\
    \ the common use of `for` loop in Java. The output of the program will be:\nThe\
    \ current value is: 1\nThe current value is: 2\n...\nThe current value is: 9\n\
    \nIf you’ll notice, the code declares a variable within the `expression`. The\
    \ scope of the loop covers the declaration of the variable up to the end of the\
    \ loop section. For the `for` statement, that can be useful in `terminating` and\
