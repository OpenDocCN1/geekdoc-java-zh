    \ = 1; break;\n      case \"february\" : monthNo = 2; break;\n      case \"march\"\
    \ : monthNo = 3; break;\n      case \"april\" : monthNo = 4; break;\n      case\
    \ \"may\" : monthNo = 5; break;\n      case \"june\" : monthNo = 6; break;\n \
    \     case \"july\" : monthNo = 7; break;\n      case \"august\" : monthNo = 8;\
    \ break;\n      case \"september\": : monthNo = 9; break;\n      case \"october\"\
    \ : monthNo = 10; break;\n      case \"november\": : monthNo = 11; break;\n  \
    \    case \"december\": : monthNo = 12; break;\n      default: monthNo = 0; break;\n\
    \    }\n    return monthNo;\n  }\n  public static void main (String[] args) {\n\
    \    String month = \"August\";\n    int returnedMonthNo = StringSwitchDemo.getMonthNo(month);\n\
    \    if (returnedMonthNo == 0) {\n      System.out.println( \" Invalid month\"\
    );\n    } else {\n      System.out.println(returnedMonthNo);\n    }\n  }\n}\n\
    ```\n\nThe output of the code above is `8`. The `String` data type in the switch\
    \ expression is compared with the expressions linked with each case label like\
