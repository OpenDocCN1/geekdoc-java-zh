    如果来自不同包的两个成员具有相同的名称，则需要通过使用完全限定名的方法来导入这些成员。这样做是为了避免不同包之间的名称之间出现任何歧义。


    ## 静态导入语句


    在导入包时，在某些情况下，需要频繁地访问来自多个类中的字段和静态方法。多次使用类名作为前缀会导致代码可读性差，非常难以理解。


    静态导入语句为导入所需的静态方法和常量提供了解决方案，从而避免了多个前缀的问题。


    ## 源文件与类文件管理


    Java 编程语言平台有许多实现依赖于层次文件系统来管理类和源文件，尽管这在 Java 语言规范中并不是强制要求的。为了实现这一点，必须执行以下步骤：


    1. 将类型的源代码放在一个文本文件中，文件名与类型名相同，且扩展名为 `.java`。


    ```java

    //来自一个名为 sample.java 的文件


    package example;


    public class sample{

    //code

    }

    ```


    2. 之后，将源文件放在与其所属包名相同的目录中。


    包成员的名称与文件的路径名称应该是平行的。假设文件名分隔符是反斜杠（Microsoft Windows）。


    正如我们在之前的主题中讨论过的，包名源自其公司域名的是一种常见做法。记住示例域名 `sample.net` 的包名将 `net.sample`。包内的所有组件都将对应一个子目录。因此，如果域名
    `sample.net` 的公司有一个名为 `net.sample.packagemember` 的包成员，其中包含一个文件 `sample.java`，它将被放置在系列子目录下，如：


    `....\net\sample\package\sample.java`


    在编译源文件时，编译器会为每个定义的类型创建一个不同的输出文件。


    ## 总结


    总的来说，Java 编程语言是一种非常强大的编程语言，可以用于许多方面。具有简单、面向对象、独立于主机平台、包含网络系统语言设施和库的能力，以及专门设计用于从远程源安全执行代码的结构等目标，Java
    语言拥有 C 和 C++ 等其他语言所不具备的特性。


    考虑到 Java 编程语言的模块化，它将代码划分为模块的能力使其比 C/C++ 等语言具有巨大的优势。在 Java 中，输出应用程序可以以模块的形式呈现，而不仅仅是单个可执行文件。相比之下，C/C++
    等编程语言在遇到代码的微小变化或调整时，需要重新编译整个应用程序。


    Java 编程语言的想法是将源代码编译成一种可以被解释的中间语言。这种中间语言被认为是 `byte code`（字节码）。而 Java 虚拟机 `JVM`
    是解释器。在标准化方面，Java 拥有标准库，能够以多种方式访问主机的特性（如网络和图形）。Java 语言还可以支持多线程程序，这对于网络应用程序可能是必要的。


    Java 同样具有平台独立性，并且当带有服务器端应用程序（如 Web 服务和微型服务器）时，将变得更加强大高效。对于客户端，Java 还提供了一些改进，如
    Windows 工具包、小部件工具包和 `Swing`。Java 是一种“编写一次，到处运行”的编程语言。这意味着只要存在 Java 虚拟机，它的任何硬件可移植性就没有太大问题。它也是一种“编写一次，到处测试”的编程语言。这使得
    Java 非常非常高效且快速。


    在执行和错误处理方面，Java 可以像任何其他对象一样让异常抛出一个对象。唯一的要求是实现 `Throwable` 接口。编译器还会指定异常是否可以被捕获。如果没有为抛出的异常创建
    `catch` 块，编译器将产生错误。


    Java 强制要求程序员处理异常。尽管如此，程序员必须能够处理异常，或者定义用户必须能够处理该异常。


    在网络能力领域，Java 的前身并没有具备允许其语言与其他计算机系统联网的功能。这意味着 Java 具有了平台独立性，并且几乎所有的网络协议都是标准化的。这使得
    Java 语言的开发者更加关注其在互联网中的集成。


    Java 最初设计时就将网络计算作为其特性之一。它是最早为远程源代码执行提供广泛支持的语言系统之一。


    对于动态类加载，Java 中的类可以根据需要进行编译。如果程序执行期间不需要某个类，则无法将该类编译成代码。


    这种优势在涉及网络编程时非常有用。能够运行一个从文件系统或远程源加载类的程序是一个非常高效的概念。Java 语言编写的程序还可以在执行过程中修改自己的代码。然而，用
    Java 编写的程序带有某些反馈执行并随着时间的推移改进生成的代码更符合现实且可能的。


    在 Java 中，释放内存不再是程序员的责任范围。Java 虚拟机 (`JVM`) 会跟踪并记录所有使用的内存。当内存不再被使用时，它会自动释放。在这一发生时，`JVM`
    在后台执行另一项任务：释放未引用的、未使用的内存，这也称为垃圾回收（Garbage Collection）。垃圾回收器始终运行。这一特性使得编写复杂的服务器端程序变得简单。现在程序员唯一做的就是观察对象创建的速度。如果应用程序创建对象的速度快于垃圾回收释放的速度，就会导致内存问题。应用程序可能会耗尽内存或抛出异常，或者停下来给垃圾回收留出应对并执行任务的时间。


    关于 Java 还有一点可以说明，其背后的人也是 `applet`（插件）概念的创建者。Java 程序具有在网络浏览器中运行的能力。Java 最初是为 Web
    应用程序设计的。Java 语言的承诺在于浏览器端，代码可以下载并作为 `applet` 在浏览器中执行。


    由于 Java 基本上是某些编程语言的升级，其他语言中的某些特性在 Java 中被禁用了，例如多重继承、类型转换限制等，以避免错误。


    作为最后的总结，Java 是一种能够交付结果并实现其目标的编程语言。Java 语言不仅仅是其他语言之一，因为它允许创建高级数据类型（对象），这些对象可以是现实世界事物的表示。这些对象还可以可以修改的字段。

    '
- fmt: '

    Java is a very flexible programming language. From the development of software
    to the development of applets as well; java has proven to be a powerful language
    in many aspects. But its flexibility is not yet over.


    Since it is platform independent, the same Java programs can be run on various
    operating systems with having the need to recreate or rewrite the code, unlike
    programming languages like `C` and `C++`. This was all possible due because of
    the `Java Runtime Environment` which interprets the Java source code and relays
    the operating system on what needs to be done.


    Of course, the language has some drawbacks, but it is still easy to understand
    and learn. In a span of one day, any person can be able to create their own Java
    programs.

    '
