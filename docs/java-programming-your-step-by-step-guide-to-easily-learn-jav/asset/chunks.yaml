  trans: "\n\n```java\nPublic MyOwnClass solveMethod( MyOwnClass sample1, myOwnClass\
    \ sample2) {\n    MyOwnClass example_1;\n    //insert some code here\n    Return\
    \ example_1;\n}\n```\n\n## 语句 (This Statement)\n\n我们在之前的章节中已经见过 `this` 的用法。`this`\
    \ 实际上指的是当前正在调用的方法或构造函数的当前对象。通过使用 `this`，可以在实例方法内部引用当前对象的任何成员或属性。\n\n`this` 关键字通常用于字段，因为它会被方法或构造函数的参数所遮蔽。\n\
    \n看下面的示例：\n\n```java\npublic class sample{\n    public int a;\n    public int\
    \ b;\n    public sample (int i, int j) {\n        a = i;\n        b= j;\n    }\n\
    }\n```\n\n通过使用 `this` 语句，代码可以重写为：\n\n```java\npublic class sample{\n    public\
    \ int a;\n    public int b;\n    public sample (int a, int b) {\n        this.a\
    \ = a;\n        this.b = b;\n    }\n}\n```\n\n构造函数的每个参数都遮蔽了对象的每个属性。构造函数 `sample`\
    \ 内部的属性 `x` 属于类 `sample` 参数的本地副本。为了引用样本属性 `x`，构造函数需要使用 `this.x`。\n\n可以使用 `this`\
    \ 语句调用同一类中的另一个构造函数，前提是它位于构造函数内部。这个过程可以称为显式构造函数调用。例如：\n\n```java\npublic class\
    \ sample {\n    private int a, b, var1, var2;\n    public sample( ) {\n      \
    \  this(0, 1, 3, 3);\n    }\n    public sample(int var1, int var2) {\n       \
    \ this(0, 1, var1, var2);\n    }\n    public sample ( int a, int b, int var1,\
    \ int var2)     {\n        this.a = a;\n        this.b = b; \n        this.var1\
    \ = var1;\n        this.var2 = var2;\n    }  \n}\n```\n\n上面的代码包含了一组构造函数。每个构造函数都提供了一个默认值，并创建了类\
    \ `sample` 成员变量的实例。\n\n# 第 5 章：接口与继承\n\n在编程和软件工程中，在某些情况下，不同的程序员或不同的程序员小组之间拥有“共同基础”是至关重要的，这使得他们的代码和软件具有交互性。这些程序员在不知道其他程序员代码如何编写的情况下也能编写自己的代码。这些程序员的“共同基础”被称为接口。\n\
    \n例如，一个社区中存在可以在没有人类操作员的情况下运行并传输人的先进车辆。为了让这些车辆运行，车辆制造商开发了用 Java 编写的软件，可以在无需人工操作的情况下操控车辆。想象你的车辆或汽车自动启动并加速，能够管理速度以避免事故。\n\
    \n另一个可以考虑的例子是全球定位系统 `GPS`。有计算机系统接收 `GPS` 传输的数据，以跟踪车辆的位置并提供其他数据的无线传输，如最新的地图、天气和交通状况。结合\
    \ `GPS`，自动驾驶车辆可以感知应该选择哪条路线、选择正确的方向以到达目的地，而不会遇到拥堵之类的困扰。\n\n现在，`GPS` 软件和车辆的自动化软件显然是由不同的程序员团队开发的。开发自动化软件的程序员小组不知道\
    \ `GPS` 软件的代码长什么样，也不知道它是如何实现的，但他们可以通过单一的共同基础进行交互。那就是接口。只要他们保持接口的交互性，每个程序员小组实际上都可以让另一个小组修改代码。\n\
    \n## Java 接口 (Java Interfaces)\n\nJava 编程语言将接口视为一种引用类型。它被认为类似于类，只能包含常量、默认方法和静态方法、方法签名和嵌套类类型。接口的方法体仅用于默认方法和静态方法的目的。\n\
    \n接口不能有实例。接口无法实例化，因为接口只能被类或其他接口实现或扩展。\n\n这里是一个接口的示例：\n\n```java\nPublic interface\
    \ automateVehicle {\n    //静态变量声明\n    // 方法签名\n    int init(Speed s, float distance,\
    \ float gas, float angle, boolean collision);\n    int accelerate (Speed s, float\
    \ gas, float distance);\n    int decelerate (Speed s, float gas, float distance,\
    \ boolean collision) ;\n    int steerWheel (Speed s, float distance, boolean collision);\n\
    \    //其他方法\n}\n```\n\n注意：记住，方法签名不需要大括号，因为它们以分号结束。\n\n为了使用接口，使用了 `implements`\
    \ 关键字。每当一个可以实例化的类实现接口时，它就会为接口中声明的方法创建方法体。\n\n以下代码是一个示例：\n\n```java\nPublic class\
    \ Car implements automateVehicle {\n    Int init (Speed s, float distance, float\
    \ gas, float angle, boolean collision)\n    //上面的代码包含了方法签名和实现\n    //让类 car 初始的代码写在这里\n\
    \    // 更多代码\n    //其他类成员可以写在这里\n}\n```\n\n如果你还记得，接口 `automateVehicle` 的开发者并不是类\
    \ `car` 的开发者。其他的汽车 `car` 类可以使用 `automateVehicle` 接口，并有不同的实现。这些汽车开发者随后将构建如 `GPS`\
    \ 系统和数字地图，并通过接口的方法使其可用且有效。\n\n## 接口的声明与定义 (Interface Declaration and Definition)\n\
    \n接口的声明需要五个组件：修饰符、接口名称、父接口列表（如果有的话）、体、以及 `interface` 关键字。\n\n```java\npublic interface\
    \ SampleInterface extends AnotherInterface, ThatInterface, SampleInterfaceAgain\
    \ {\n    float value = 1.54;\n    void doSomething (int i, double x);\n    int\
    \ doSomethingElse(String s);\n}\n```\n\n在前面的代码中，修饰符 `public` 意味着任何包的类都可以访问该接口。如果没有指定接口的修饰符，则接口默认只对相同包内的类可见。\n\
    \n像普通类一样，接口是可以扩展的。它不能只扩展一个类；它可以扩展任意数量的接口，因此如果有父接口，则有一个列表。\n\n现在，接口的体可以包含多种方法，例如抽象方法、默认方法和静态方法。每个方法与其他方法略有不同。\n\
    \n"
- fmt: "\nAn abstract method is almost the same as a method signature. It does not\
    \ need implementation. A default method is a method which is declared within the\
    \ `default` modifier. A `static` modifier, on the other hand, is declared within\
    \ the `static` modifier. The abstract, `static` and default methods within an\
    \ interface are by default, public.\n\nBesides the methods, it is also possible\
    \ to use constant declarations in interfaces. Every constant value declared in\
    \ an interface can be any of the modifiers (`public`, `static`, `final`).\n\n\
    For a class to be able to implement an interface, the keyword `implements` must\
    \ be written before the interface name in the declaration. It is possible for\
    \ a class to implement more than one interface. If that situation happens, the\
    \ interfaces to be implemented by the class are separated by commas. If a class\
    \ is extending a superclass and implements an interface, the keyword `extends`\
    \ is always followed by the superclass name, and then the `implements` keyword.\n\
    \nImagine an interface that defines a comparison between sizes of objects:\n\n\
    ```java\npublic interface Comparison{\n    public int isSmallerThan(Comparison\
    \ object_1);\n}\n```\n\nIn order to be able to compare the sizes of similar objects\
    \ regardless of their type, the interface `Comparison` needs to be implemented\
    \ by the class that instantiates them.\n\nIt is possible for any class to implement\
    \ the interface `Comparison` as long as there is a method that can compare the\
    \ similar field of objects that are instantiated from the class. For other datatypes\
    \ such as `strings`, the number of characters can be compared. For other objects\
    \ such as `person`, fields such as `height` and `age` can be used. For mathematical\
    \ situations such as geometrical objects, areas can have comparisons while other\
    \ situations such as volume would be suitable for three-dimensional object comparisons.\
    \ The method `isSmallerThan()` can be implemented by all the said classes. \n\n\
    If it is known that a class can implement the interface `Comparison`, then it\
    \ is also a fact that it is possible to compare the object size instantiated from\
    \ its class.\n\n# Inheritance\n\nWe have seen the application of inheritance in\
    \ some of the previous chapters. The Java programming language allows classes\
    \ to be derived from other classes. With that being possible, the attributes and\
    \ methods of the parent class will be inherited by the derived class or the subclass.\n\
    \nThe following code is a simple implementation of the class `Vehicle` which was\
    \ used in an earlier example:\n\n```java\npublic class Vehicle {\n    Float distance;\n\
    \    Float gas;\n    Float angle;\n\n    public Vehicle(float Vgas, float Vdistance,\
    \ float Vangle ) {\n        gas = Vgas;\n        distance = Vdistance;\n     \
    \   angle = Vangle;\n    } \n\n    public void setDistance(int Ndistance){\n \
    \       distance = Ndistance;\n    }\n\n    public void setGas(int Ngas) {\n \
    \       gas = Ngas;\n    }\n\n    public void turnStraight(int value){\n     \
    \   angle-= value;\n    }\n\n    public void turn(int value){\n        Angle+=\
    \ value;\n    }\n}\n```\n\nThe class declaration for class `Car` that is a subclass\
    \ of class `Vehicle` will look like this:\n\n```java\npublic class Car extends\
    \ Vehicle {\n    public int heatRate;\n\n    public Car(float heatR, float sDistance,\
    \ float sGas, float sAngle) {\n        super(sDistance, sGas, sAngle);\n     \
    \   heatRate = heatR;\n    } \n\n    // the car subclass adds one method\n   \
    \ public void setHeatRate(int newValue) {\n        heatRate = newValue;\n    }\
    \ \n}\n```\n\nThe subclass `Car` gets to inherit all the fields and methods of\
    \ its superclass `Vehicle`. It also adds another method named `setHeatRate` and\
    \ its field `heatRate`. Besides the constructor, writing the subclass `Vehicle`\
    \ seems like it was a different class made entirely from nothing, together with\
    \ its fields and methods. That was how it felt but now how it was made. This technique\
    \ will be very important if the methods in the superclass `Vehicle` were more\
    \ complex and took a very long time to debug.\n\nA subclass is a class derived\
    \ from another class. It can also be called a derived class, or child class. The\
    \ opposite of the subclass is the superclass. A superclass is the class where\
    \ the subclass was derived. Another term for a superclass is the parent class.\n\
    \nAll the members from the superclass, including the attributes, methods, and\
    \ other nested classes, are inherited by the subclass. Although it does not inherit\
    \ the constructors but the constructor of the superclass can be called from the\
    \ subclass.\n\nThe Java Programming Language does not support multiple superclass\
    \ inheritance. This means that every class can only have one direct superclass.\
    \ Besides an object, every class is basically a subclass of `Object`; Assuming\
    \ that the said class does not have a declared superclass. A subclass having a\
    \ subclass extended by another subclass is possible. The topmost superclass of\
    \ every class is the class `Object`. Every single class can be traced back to\
    \ object regardless of the subclasses.\n\nThe concept of inheritance can be very\
    \ efficient when it comes to handling multiple classes that basically have the\
    \ same structure.\n\nFor example, imagine a class `Mountain` and class `Valley`.\
    \ Instead of rewriting all the attributes of class `Mountain` to class `Valley`,\
    \ it is possible to create a class `Landform` which contains all the same attributes\
    \ and methods that both class `Mountain` and class `Valley` have. This also reduces\
    \ the possibility of errors and reduces debugging time.\n\n# Java Platform Hierarchy\n\
    \nIn the Java Programming Language, the class `Object` is basically the core class\
    \ of all classes. It is the most common of all classes. All classes are derived\
    \ from class `Object`. These classes then can have subclasses and so on. This\
    \ is called a hierarchy of classes. Classes at the bottom of the hierarchy tend\
    \ to perform more specific methods compared to their superclasses.\n\n## Subclasses\n\
    \nA subclass can inherit all the public and protected members of its parent regards\
    \ less of what package the subclass is located in. If both the subclass and its\
    \ parent are in the same package, the subclass can also inherit all of the parent’s\
    \ private members. With that said, a subclass can do manipulations to its inherited\
    \ members such as:\n\n-   Direct usage of the inherited fields\n-   Declaring\
    \ a field within the subclass but having the same name as the superclass\n-  \
    \ Declaring new fields not included in the superclass\n-   Direct usage of all\
    \ the inherited methods from the parent\n-   Creating a new instance method in\
    \ the subclass that can have the same method signature in the superclass (method\
    \ overriding)\n-   Creating a new static method with the same name as the superclass\n\
    -   Declaring new methods in the subclass that are not included in the superclass\n\
    -   Creating a subclass constructor that calls the constructor of the superclass\n\
    \nA subclass cannot inherit the private members of its parent class. This can\
    \ only be possible if both the subclass and the parent class are in the same package.\n\
    \nIf the methods used by the superclass for accessing private fields are either\
    \ public or protected, these methods are accessible to the subclass. The nested\
    \ classes in a class have access to all of the private fields and methods of its\
    \ enclosing class. Hence, if a nested class is either public or protected, its\
    \ subclass gains access to all of the private members of its superclass.\n\nWe\
    \ have already discussed that the object is from the data type of the class where\
    \ it was instantiated. For example:\n\n```java\npublic MyOwnClass sample = new\
    \ MyOwnClass ( );\n```\n\nThe data type of the object `sample` is `MyOwnClass`.\n\
    \nThe object `sample` comes from the class `MyOwnClass`. This makes `sample` a\
