  raw: 'The command above loads and executes the Hello class and its main method.
    If the class contains extensions from other classes (to be discussed further on
    the following chapters), these classes are loaded automatically when needed. If
    you have a source file which extends several other source files, you can compile
    all of them using:


    javac *.java


    Assuming that all files are in the same folder, each source file will load and
    execute its corresponding class file.


    Declarations and Expressions


    There are eight primitive types in Java. By primitive, it means that these types
    are not defined in terms of anything else; basically, atomic. They are sequences
    of bits that the CPU is ready to deal with. These types are:


    Byte, short, int, long, float, double, char, Boolean


    If a variable type is not a primitive type, it is considered a reference type.
    A reference type can either be a class, interface, or array type. A variable of
    any reference type can be set to null. This means that it can hold nothing


    Java supports the usual set of data types such as integer, char, boolean, and
    other variables. Here are some:


    int a, b; //integer variables


    float f; //float variable


    char s; //character variable


    boolean a; //returns  true or false


    Note: “//” and “/*  */” are used to serve for single line comments and multiple
    line comments respectively.


    Numerical expressions can be written in pretty much the same way as other languages.


    a = 2 * (3 + 1);


    b = c / 4.12643;


    p = q % 2;


    o = true;


    s = ‘L’;


    It is possible to assign an initial value to a variable directly when declaring
    it.


    int a = 5;


    float f = 0.52;


    The division operator in Java actually means two different things. It can either
    be real division for real numbers, or integer division for integers. This is not
    really a problem in most cases although it may lead to varying results.


    double a;


    a = 1 / 9; // the result of a will be 0.0


    a = 1.0 / 9.0; // the result of a will be 0.111...


    The first operation performed integer division, hence the result of 0\. If you
    want to get the exact quotient of 1 and 9, you need to express 1 and 9 as real
    values so that the division becomes real division.


    It is possible in java to assign a real value to an integer variable. The value
    is automatically converted to the corresponding type. This is called typecasting.


    Java supports type conversion (typecasting) but does not perform the conversions
    automatically. The programmer is required to indicate where and what conversions
    must be made by writing the desired type in parentheses before the expression.


    double a;


    int b;


    b = (int) (a * 12.3223122);


    Of course, it is possible to assign an integer value to a real variable without
    typecasting. It is not necessary to cast as long as the conversion can be performed
    without the loss of any information.


    Java is an object-oriented programming language, so the terms that we will use
    are a little different compared to terms used in structural programming languages.


    Functions, sub-routines, and procedures in Java are called methods. The term used
    for calling or executing a function is called invoking. A collection of variables
    and methods put together is called a class.


    Here are some examples of methods:


    Class HelloWorld{


    public void sayHi(int a, int b){


    aa = a;


    bb = b;


    }


    private int getAge(){


    return x;


    }  


    }


    The example above contains two methods: sayHi and getAge. A method can have multiple
    parameters or none.


    Notice that one method begins with the keyword public and the second one begins
    with private?  This indicates whether the method can be accessed from other classes
    or not. This is helpful when you are securing some data that should not be accessed
    by other methods.


    Similar to the struct type in C (record structure), variables in Java are considered
    as a group for every instance of the class. An object is considered an occurrence
    of the struct or record.


    In other words, an object is an instance of its class.


    Knowing what the class of an object is also means knowing what set of variables
    it has and what methods it can perform. It may sound odd because a set of variables
    cannot supposedly perform anything. This is the core of object-oriented programming.
    It means that every code is considered as being executed by an object.


    Here is an example of a simple Java code:


    Class Section{ //This is defining a class called “Section”


    int a, b, c; //These are three integer instance variables           declared


    /*every Section instance will have its own values for these variable */


    void add(int aa, int bb, int cc){


    a+= aa; //this adds (aa, bb) to (a, b)


    b+=bb; 


    this.c += cc //”this.c” is the same as “c”


    }


    }


    Now you’re probably wondering what the “this” was for. Well, every method in a
    class contains a secret unlisted argument which is the group of variables. That
    argument is this. The method add needs to know which section it is adding. The
    caller needs to tell which section to add. Any call to add needs to be linked
    to a specific instance of the Hello class.


    Section s1;


    s1 = new Section();


    s1.a = 1;


    s1.b = p.x * 2;


    s1.c = 0


    s1.add(1,2,3);


    The last line of code above means that whenever translate is called, the argument
    this will be equal to p1.


    If the object performing a method is not specified, it is safe to assume that
    this should perform the method.


    In other words:


    add(1, 2, 3 );


    can be considered the same as


    this.add(1, 2, 3);


    We will discuss methods, objects and classes in more detail in chapters 3 to 4\.
    For now, look at the example of a simple Java program:


    public class HelloWorld{


    public static void main(String[] args){


    System.out.print(“Hello World!”); //this prints out “Hello World”


    } //main


    } //HelloWorld


    The code above is a simple Java program which prints out “Hello World!”


    Let’s try to discuss the lines of code one by one.


    First you’ll see the class declaration HelloWorld. The public indication denotes
    that it can be accessed by other classes.


    Second, we’ll see the method main. Notice the new word “static” on the method
    declaration? This simply means that when the method is called, it is not associated
    with an object but with the class itself. In other words, the method cannot access
    any attributes.


    Third is the “args” parameter. This parameter gets the value of the data from
    the information other than the class name executed by the Java interpreter, if
    there are any.


    Note: The System.out.print is a method that displays what the programmer writes
    inside the quotations marks


    (“ ”). If you want to print out a new line when running, you can use System.out.println.
    This will make a new line for displaying the output.


    Example #2:


    import java.util.Scanner; //import package


    public class User{


    public static void main( String[] args ){


    Scanner inp = new Scanner(System.in); //declaration of a new object Scanner


    String f_name; //string variable declarations


    String l_name;


    String full_name;


    System.out.print("Enter your first name:"); //this line here asks for your first
    name


    f_name = inp.next(); //the input you type in will be stored in f_name via inp.next()


    System.out.print("Enter your last name:"); //this line on the other hand, asks
    for your last name


    l_name = inp.next(); //the input you type in will now be stored in l_name


    full_name = f_name + " " + l_name; //this line here stores both f_name and l_name
    in full_name while being seperated by " "


    System.out.println("Hello,"+ full_name + "! Pleased to meet you.");  //This line
    prints out your full_name.


    }//main


    }//User'
