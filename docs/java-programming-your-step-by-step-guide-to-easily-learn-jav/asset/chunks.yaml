    # Chapter 4:


    Methods, Objects, Classes


    ![image](d2d_images/chapter_title_below.png)


    We have already had a short introduction about classes, methods, and objects in
    the previous chapters. In this chapter, we will discuss these terms in more detail.


    Classes


    A class is generally a declaration which contains a specific set of attributes
    or in other words, instance variables. Together with methods, declaring a Java
    class can be very much similar to declaring one in Simula.


    Take a look at the following code:


    Class Example{


    Private int value;


    Protected char letter;


    }


    If you’ll notice, there are declarations right before the data types int and char.
    These declarations mean that the attributes cannot be accessed outside of the
    class. Overall, attributes need to remain private or protected in order to prevent
    direct unauthorized access from other classes.  There are three declarations normally
    used in Java: private, protected and public.


    Public


    *   This declaration means the attribute can be accessed from other classes.


    Private


    *   This declaration does not allow the attribute to be accessed by any other
    class except its own.


    Protected


    *   This class is somewhat similar to a private declaration although it gives
    access to its own class and its subclasses but not classes from the outside.


    A class in Java is defined like this:


    class MyOwnClass {


    // field, constructor, and


    // method declarations


    }


    The code above is an example of how to write a class declaration. The area between
    the curly braces is called the class body. It contains pretty much the codes that
    initialize the objects made from the class. These codes include:


    Constructors, declarations, methods


    We are already familiar with declarations and methods. Let’s talk about the constructors.
    Constructors are used to create new objects.  A class can contain constructors
    which are executed to create objects from the main class.


    In appearance, declaring constructors is almost the same as declaring methods
    except for two things: Constructors use the name of the class and do not have
    a return type.


    Here is an example of a constructor of class Example:


    public class Example{


    int start;


    int final;


    int middle;


    //constructor


    public Example(int Constart, int Confinal, int Conmiddle ) {


    start = Constart;


    final = confinal;


    middle = Conmiddle;


    }


    }


    The following code shows how to create a new Example object called samp:


    Example samp = new Example(0, 10, 5);'
