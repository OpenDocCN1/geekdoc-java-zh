  md: '# Urls vary from database to database,for example:


    jdbc:sqlserver://127.0.0.1:733;DatabaseName=pubs //SQL Server 2000 URL


    jdbc:sqlserver://localhost:733:DatabaseName=zhangli //SQL Server 2007 URL


    jdbc:oracle:thin:@166.111.78.98:1721:ora //Oracle URL


    jdbc:mysql://127.0.0.1/DatabaseName=studentcs //MySQL URL


    +   2 Create a connection to the data source.


    # Call the getConnection function provided by the DriverManager class to get the
    connection.


    The following demonstrates creating a connection to the native SQL Server 2007
    database named zhangli:


    ```

    String url="jdbc:sqlserver://localhost:733;DatabaseName=zhangli";String username="root";
    //User name

    String password="zhangli"; //Secret

    Connection conn=DriverManager.getConnection(url,username,password);

    ```


