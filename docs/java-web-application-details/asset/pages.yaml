    may even lead to the entire system paralysis.So we have to solve the problem of
    the utilization of database resources.


    There are two kinds of database resource problems in database development.


    +   (1)Efficiency problems caused by ordinary JDBC connections In the use of ordinary
    JDBC connection database,under normal circumstances need three steps:① establish
    a database connection;②Operate the database;③Release resources.


    In these three steps,the time taken to establish and release the database connection
    is much greater than the time spent on the database operation,that is,in our database
    operation,most of the time is spent on establishing and releasing the database
    connection,and the time really used to perform the operation is not much.


    When the connection pool is not used,each database operation needs to establish
    a new database connection, in the application system that requires a large number
    of database operations,it is necessary to repeatedly establish and release the
    database connection,such an an operation method will greatly reduce the efficiency
    of the system.


