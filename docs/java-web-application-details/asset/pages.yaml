  md: '# 10.1.3 JavaBean Authoring Specifications


    To write a Javabeans is to write a Java class that creates an object called aBean.To
    make the Bean''s properties and methods known to the application building tool
    that uses the Bean,such as the JSP engine,you need to follow the following rules
    when writing a Javabean.


    +   (1)The class must be public and have a default constructor without arguments.


    +   (2)Several properties can be defined in a class,but they must be private.


    +   (3)A class can define several methods,but they must be public.


    +   (4)If the name ofthe the class''s property is xxx,then in order to change
    or get the value of the property, two corresponding methods should be generated
    for each property,as shown below.


    +   ① getXXX():To get the attribute xxx.


    +   ② setXXX():modifies the property xxx


