  md: '# Preface


    Java is an object-oriented programming language that can span multiple platforms
    and has the highest portability.It is also one of the most advanced,feature-rich
    and powerful computer


    languages at present.Java can be used to write desktop applications,Web applications,distributed
    system applications,embedded system applications,etc.,its application range is
    very wide,'
  merge: -1
  pgno: 4
- img_proc: true
  md: 'especially in the development of Web programs.

    At present,there are many books in the field of Java Web development,but there
    are not many that can really explain the technology thoroughly,especially the
    books that combine the project are even less.The author combines his years of
    experience in Java Web development and teaching guidance,summarizes and draws
    the core technology and ability,chooses the Web message board as the main line
    to integrate Java Web knowledge,not only interprets the concept and method of
    website design,but also systematically explains the core technology of Java Web.
    This book adopts the method of combining theory and project demonstration,and
    gradually explains the various kinds of knowledge necessary for JavaWeb development
    from entry to programming master,which is divided into 4 parts.

    The first part:static web page. This article by explaining the Java Web development
    environment installation and configuration,HTML and CSS and its application,JavaScript
    and its application and other content,and combined with a large number of charts,cases,so
    that readers quickly'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'grasp the foundation of static web development,lay a solid foundation for future
    programming.

    The second part:dynamic website article.This article through explaining the Web
    program operation principle,Servlet and its application,JDBC database connection,database
    connection pool technology,JSP and its application,JavaBean and its application,and
    combined with a large number of charts,cases, so that readers in-depth grasp the
    core technology required for dynamic website


    The third part:the system framework.This article through explaining the Struts
    framework and its application,tag library and its application,Hibernate framework
    and its application,Spring framework and its application,SSH integration application
    and other content,and combined with a large number of charts,cases,so that readers
    master the website architecture design theory and methods.


    Chapter 4:Project actual combat article.This article through the general forum
    BBS design and implementation,social networking site design and implementation,DIY
    commodity electronic trading platform design and implementation of three chapters
    to elaborate the development process of the three complete systems,leading the
    reader to experience the whole process of development project step by step, master
    the essence of Java Web development.These three systems are'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'different in size and detail,so that readers can contact each technology from
    shallow to deep,from easy to difficult,from part to whole.These three systems
    tend to have different technologies,and readers can choose one to study according
    to actual needs.When explaining each routine,the author takes the framework construction
    as the vertical,and the function realization as the horizontal,and introduces
    each code in detail,so that the reader can grasp the overall idea of each technology
    in the macro at the same time,can actually master the actual technology.


    # The book features the following..


    The mainline is fascinating:This book to the development of the network message
    board to implement the whole process of Java Web development,the main line is
    clear,outline'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'Take it.This book is arranged in the order most suitable for beginners to learn,the
    network message board is gradually upgraded from simple to complex version 1.0
    to version 7.0,so that readers follow the content of the book gradually into the
    best,Java Web development ability continues to improve.


    Case classic practical:The cases selected in this book are more classic,with strong
    operability and a wide range of application.Many cases,such as the forum system,can
    be directly applied to specific fields after modification.Readers can also easily
    expand on this basis,implement more modules,or replace existing functional modules
    with other implementation methods.


    Technical coverage of the mainstream:This book covers the basic theoretical knowledge
    required for Java Web development,covering most of the current application development
    techniques.Readers can not only enter the door of Java Web development,but also
    through the actual combat of the book''s routines,readers can eventually master
    this knowledge,and lay a solid foundation for further in-depth theoretical study.


    Easy to understand:This book pursues simple and easy to understand in the text,and
    fully describes the problem from the reader''s point of view when writing.In each
    case analysis,a comprehensive and detailed step analysis is given,just like a
    teacher around you,guiding readers to solve various problems by hand hand.


    Structure of the primary and secondary clear:this book focuses on the development
    of commonly used technologies,so that readers in the study of the first to master
    the most critical development technology,and not for the technical problems,when
    the reader gradually familiar with the development of the technology used,through
    further research and learning it is easy to solve the problems encountered in
    the development.'
  merge: -1
