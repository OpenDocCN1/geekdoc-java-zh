  md: '# 2.4.17 Multimedia embed files


    The <applet-tag is used to embed a JavaApplet in a page.The <embed>tag is used
    to embed a variety of audio and video formats into a page.The format depends on
    the player on the viewer''s system,and the appropriate processing program needs
    to be installed on the viewer''s computer.Common embedded file formats include
    mp3,mid,wma,asf(streaming media),asx(audio),rm,ra,ram,swf,avi,etc.


    The <embed>tag is used for:


    ```

    <embedsrc="

    autostart =true"

    loop="true"

    hidden =false"

    controls="CONSOLE"

    width="200"

    height="45"

    ```


    The controls property specifies the appearance of the control panel.The controls
    property can be console,smallconsole,playbutton,pausebutton,stopbutton,or volumelever.The
    default value is console.'
  merge: -1
  pgno: 109
- img_proc: true
  md: '(1)console:Generally normal panel;

    (2)smallconsole:a smaller panel;

    (3)playbutton:Only the playbutton is displayed;

    (4)pausebutton:Only the pausebutton is displayed;

    (5)stopbutton:Only the stopbutton is displayed.

    And (6)volumelever:Only the volume adjustment button is displayed.


    More special,for rm,ra,ram format audio files,you need to add a type attribute
    to the <embed>tag:


    ```

    embed src="..."

