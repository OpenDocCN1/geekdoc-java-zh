    # 9.1.3 The essence of JSP


    JSP page is essentially Servlet,in the JSP program can

    not be separated from the shadow of Servlet.Servlet

    and JSP can be considered as Java to achieve the first

    and second generation of Web programming

    technology,is Servlet is not easy to quickly

    develop a large number of HTML code dynamic Web

    pages,so Sun

    lunched JSP technology to quickly develop dynamic

    web pages.Servlet and JSP is to achieve the same

    programming effect of the two different ways of

    implementation.Fundamentally speaking,JSP is a

    Servlet, because JSP runs in the Web server,is first

    converted into a Servlet,and then call the method

    of conversion Servlet,the output of dynamic HTML

    content returned to the customer''s browser.So as

    long as the Servlet programming can achieve the

    function,JSP programming can also be achieved.'
