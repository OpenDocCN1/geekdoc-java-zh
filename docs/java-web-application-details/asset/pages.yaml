    # 5.3 Web Program Flow


    # 5.3.1 C/S architecture program development process


    In the development process of traditional Web applications,the steps required
    to develop an application system generally include:


    # (1)The development of client/server software;


    +   (2)deployment of server-side programs;


    +   And (3)installation of client software.


    Only after completing these steps,the user can access the services provided by
    the server through the client.


    # 5.3.2 B/S architecture program development process


    In the development process of Web programs based on B/S architecture,only the
    functional code of the server needs to be developed,and then the server-side program
    is deployed in the Web server software.After the deployment,start the Web server,and
    users can access the services provided by Web applications through browsers.'
