  md: '# 7.4.1 JDBC Programming Steps


    (1)Reference necessary packages.

    import java.sql.*;// contains the classes and interfaces that

    operate the database


    (2)Load the driver program that connects to the database.


    In order to connect with a specific database,JDBC must load the corresponding
    driver class.This is usually done by explicitly loading a driver Class using the
    class.forName()method.The driver is responsible for registering with DriverManager
    and DriverManager will use this driver when connecting to the database.


    Driver names vary from database to database,for example:'
  merge: -1
