  md: '# Chapter 12 Tag library and its application


    # 12.1.1 Introduction to Struts tag library


    In order to facilitate developers to use Struts to develop Web applications,the
    Struts framework provides built-in tag libraries,which can be used to construct
    JSP pages of the presentation layer. In the example program in chapter 9,part
    of Struts tags have been used.Although a large part of Web programs still use
    traditional HTML tags to achieve the presentation layer of the page, but in the
    development process of Struts application,the use of Struts tags is inevitable.


    # 12.1.2 Common tag library and description


    The Struts system provides five tag namely,HTML,Bean,Logic,Nested,and Template.
    Table 12-1


    > Table 12-1 Description of the five libraries of Struts


    | Libraries | Instructions |

    |---|---|

    | HTML Tags | This tag library contains tags that can be used to create Struts
    input forms,Create that interact with the Struts framework and other corresponding
    HTML tags |

