    requested at the time the pool is set up.When an application pulls a new connection
    from the database,which is used to maintain the number of available connections
    in the pool. When the application releases connections,the connection pool checks
    the number of available connections,and if the number of available connections
    exceeds the set number,the excess connections are released.


    The connection pool policy ensures that there are always a certain number of available
