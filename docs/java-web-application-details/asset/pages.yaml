  md: '# # Chapter 4:JavaScript and its Applications


    # ## 4.1 Basics of JavaScript


    # ### 4.1.1 Basic concepts of JavaScript


    JavaScript is a scripting language developed by Netscape Corporation.It is an
    object-and event-driven interpreted scripting language with security features,which
    has been widely used in

    Web applications.It does not need to be compiled,but is directly embedded in HTTP
    pages,turning static pages into dynamic pages that support user interaction and
    respond to application events. In Java Web programs,JavaScript is often used to
    validate data,control the browser,and'
  merge: -1
  pgno: 174
- img_proc: true
  md: 'generate clock,calendar,and time-stamped documents.

    JavaScript is a popular scripting language in Web pages,which is interpreted and
    executed by the client browser,and can be applied in JSP,ASP,PHP and other websites.At
    the same time,as Ajax enters the mainstream market of Web development,JavaScript
    has been pushed to the center of the stage,so it is very important for website
    developers to master and apply JavaScript.


    # 4.1.2 Features of JavaScript


    JavaScript is suitable for static or dynamic pages and is a widely client-side
    scripting language.It is interpretive,object-based,event-driven,secure,and cross-platform,which
    are described in detail below.


    +   (1)Interpreted Language

    JavaScript is a scripting language that is programmed with small program segments.Like
    other scripting languages,JavaScript is an interpreted language that provides
    an easy development process.


    +   (2)Object Based

    JavaScript is an object based language.It can apply objects that it has created
    itself,so a lot of the'
  merge: -1
  pgno: 175
- img_proc: true
  md: 'functionality comes from how the object''s methods in the scripting environment
    interact with the script.


    # (3)Event Driven


    Event driven means that the user performs certain operations (such as pressing
    the mouse,selecting the menu,etc.),and the computer makes corresponding responses
    accordingly.The certain operations here are called events,and the responses made
    by the computer are called event responses.


    JavaScript can respond directly to client input in an event-driven way,without
    going through server-side programs.


    # 4)Security


    JavaScript has security.It does not allow access to the local hard disk,can not
    write data to the server, and does not allow the network document to modify and
    delete,only through the browser to achieve information browsing or dynamic interaction,so
    as to effectively prevent the loss of data.


