    # 3.2.3 DIV float and clear


    DIV is a block level element,and a DIV occupies a row,but what if you want to
    implement two block elements side by side in your layout?


    +   Block-level elements have an important float property that allows multiple
    block-level elements to be placed in a row side by side.


    (1)Set the float property of the preceding DIV element;

    (2)When the front DIV element is left with enough white space,the following DIV
    element will automatically float up and be placed in a row with the previous DIV
    element.


    The float property has the values left,right,and none.If the value is none,the
    block element will not float,which is the default value of the block element;If
    left,the block element floats to the left;When the value is right,the block element
    floats to the right.'
