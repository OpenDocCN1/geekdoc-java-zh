  md: '# Chapter 10:Javabeans and their applications


    # 10.1 JavaBean Basics


    10.1.1 Introduction to JavaBean

    nThe Chinese meaning of Bean is "bean",as the name suggests,JavaBean is a piece
    of Java program.A JavaBean is actually a special Java class,which is usually used
    to implement some common simple functions, and can be easily reused or inserted
    into other applications.All Java classes that follow certain programming principles
    can be called Javabeans.'
  merge: -1
  pgno: 507
- img_proc: true
  md: 'Javebeans are software component models that describe Java,something similar
    to Microsoft''s COM concept.In the Java model,the function of Java program can
    be extended infinitely through Javaveans,and new applications can be generated
    quickly through the combination of Javaveans.For programmers,the best point is
    that Javaveans can realize the reuse of code,and it is also of great significance
    for the easy maintenance of the program.


    Javebeans can be divided into visual components and non-visual components,of which
    visual components include simple GUI elements (such as text boxes,buttons)and
    some report components. Non-visual components are often used in real development
    and play a crucial role in the application.Its main function is to encapsulate
    business logic (function implementation),database operations (such as data processing,connecting
    to the database),etc.


    The traditional application of Javaveans lies in the field of visualization,such
    as the application of AWT. Since the birth of JSP,Javebeans are more used in non-visual
    fields,and have shown more and more vitality in server-side applications.Here
    we mainly discuss the non-visual Javaveans,visual Javaveans in the market there
    are a lot of Java books have detailed elaboration,here is not the focus.


    # 10.1.2 Non-visual Javaveans'
  merge: -1
  pgno: 508
- img_proc: true
  md: 'A non-visual Jabaveans,by definition,is a JavaBeans without a GUI interface.In
    the JSP program is often used to encapsulate transaction logic,database operations,etc.,can
    well realize the separation of business logic and foreground program(such as JSP
    file),so that the system has better robustness and flexibility.


    A simple example,such as a shopping cart program,to achieve the function of adding
    a product to the shopping cart operation,you can write a shopping cart operation
    JavaBean,establish a public AddItem member method,the foreground JSP file inside
    the direct call this method to achieve.If you later consider adding goods when
    you need to judge whether there are goods in the inventory,no goods can not be
    purchased,at this time we can directly modify the AddItem method of JavaBean,add
    processing statements to achieve,so you do not need to modify the foreground JSP
    program.


    Of course,you can also completely write these processing operations in the JSP
    program,but such a JSP page may have hundreds of lines,just look at the code is
    a headache,let alone modify.Thus,through the JavaBean can be a good implementation
    of the logic of packaging,easy maintenance of the program and so on.If you use
    JSP development program,a good habit is to make more


    Use JavaBean.


