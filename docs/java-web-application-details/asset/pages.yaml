  md: 'When the browsersends a request to the Web server to call the JSP page,the
    Web server will know that the browser is requesting a jsp file according to the".Jsp
    "extension of the request file.The Web server passes the request to the Web container,and
    the Web container will convert the requested JSP file into the source file of
    the Servlet,compile the source file at the same time,and generate the converted
    Servlet class file.The process of conversion and compilation occurs when the JSP
    file is requested by the browser for the first time,so we will have the experience
    when calling the JSP page,the first time to call the JSP file to spend more time
    to see the output content.When the server receives the request for this JSP page
    again,it judge whether the JSP page has been modified.If it has been modified,Java
    code will be regenerated and recompiled,and the garbage collection method in the
    server will delete the unused class files.If there are no changes,the server simply
    calls the previously compiled class file.


