    by the customer. The JavaBean object ends its life when the current page file
    is executed by the customer.


    In the scope of page,a new JavaBean object is generated each time the page file
    is accessed,and the original JavaBean object has ended its life.


    # 10.3.2 request scope


    When the scope is request,the JavaBean object is created,it will exist throughout
    the lifetime of the request,the request object is a built-in object,using its
    getParameter method can get the data information in the form.


    Request scope JavaBean has a great relationship with the request object,its access
    scope in addition to page,but also includes the use of action elements <jsp:include>and
    <jsp:forward>contained web pages. All JSP programs connected by these two action
    instructions can share the same JavaBean object.


    # 10.3.3 session scope'
