    # 14.1.4 Aspect Oriented programming


    Aspect Oriented Programming (AOP)is another feature of Spring framework after
    Spring IOC,and it is also the core content of the framework.


    AOP is an idea,and all the technologies that conform to this idea can be regarded
    as the implementation of AOP.AOP provides another way to think about program structure,and
    by using it can provide powerful AIDS to object-oriented programming.


    In the Spring framework,AOP support is provided.Spring''s AOP framework allows
    modules scattered in the system to be centralized,implemented through AOP facets,and
    introduced into the program at any time


    through Spring''s powerful pointcut mechanism.Among many AOP technologies,Spring
    AOP does the best and is the most mature.By using Spring''s AOP framework,you
    can add powerful services to your system,such as authentication,declarative transaction
    management,and so on.


    Spring AOP is based on Java''s proxy mechanism,which has been supported since
    JDK 1.3.But performance becomes a big issue.For this reason,CGLIB proxy mechanism
    emerged.It can generate bytecode,so its performance will be higher than the JDK
    proxy.Spring supports both types of proxies.However,as the performance of the
    JVM(Java Virtual Machine)continues to improve,the performance gap between the
    two'
