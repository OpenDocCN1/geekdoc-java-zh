    The whole visual effect is achieved through a set of algorithms,the principle
    of the algorithm is:set the current perspective and focus as the default,through
    the focus and perspective to determine the position relationship between other
    pictures and the picture,so as to judge the degree of rotation deformation and
    occlusion of the surrounding pictures.The core code is shown below.


    ```

    p.container.visible =true;

    var z:Number=Math.sin(i anglePer)*radius;

    var xPosition:Number=Math.cos(i*anglePer)*radius;

    var rotation:Number=(-i*anglePer)*(180/Math.PI)+270;

    px=xPosition;p.z=zPosition;p.rotationY=yRotation;

    var reflection:setDisplay3D=lookupReflection(child);

    reflection.x=xPosition;reflection.Z=zPosition;

    reflection.y=-child.height-2;reflection.rotationYyRotation;

    ```


