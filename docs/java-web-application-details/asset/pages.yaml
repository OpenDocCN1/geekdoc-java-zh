  md: '# 12.4.2 Features of EL expressions


    (1)Namespaces are obtained in EL expressions (PageContext objectwhich is the largest
    range of integrated objects of all other built-in objects in the page,through
    which other can be accessed.


    (2)EL expressions can access not only general variables,but also properties in
    JavaBean as well as nested properties and collection objects.


    (3)Relational operations,logical operations and arithmetic operations can be performed
    in EL expressions. (4)Extension functions can be mapped to static methods of Java
    classes.


    (5)in the expression can access the JSP scope(request,session,and application,and
    page).


    (6)EL expressions can be used in conjunction with JSTL or with JavaScript statements.


