    To solve the above two problems,you need to use the database connection pool technology
    to maintain the connection between databases through the connection pool,so as
    to improve the efficiency of database operation.


    # 8.1.2 Principles of Database connection pooling


    The database connection pool is to establish a certain number of database connections
    during system initialization, and then through a set of database connection usage,allocation
    and management policies,that the database connection pool can be efficiently and
    safely reused to avoid the system overhead caused by frequent establishment and
    closure of database connections.


