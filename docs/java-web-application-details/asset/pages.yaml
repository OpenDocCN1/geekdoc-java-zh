    # 9.2.4 Action Identification


    (1)<jsp:include> — Inclusive action


    The<jsp:includeaction is used to include additional files to the current page.The
    included files can be either dynamic or static.

    <The syntax format for jsp:include action is as follows:

    <jsp:include page="url"flush="false"/>

    page specifies the relative path to the contained file.For example,specifically
    a property value of top.jsp means the top.jsp file in the folder as the current
    JSP file is included in the current JSP page. flush is an optional property that
    sets whether or not to flush the buffer.The default value is false,and if set
    to true,flush the buffer before performing the include job if the current page
    outputs the buffer.The difference between the include directive and the <jsp:include>action
    is that the action can dynamically include a file,the content of the file can
    be a static or a dynamic script.When the included dynamic file is modified,the
    JSP engine dynamically compile and update it.The include directive includes a
    file in a JSP page,thus combining it into a file,just to play a simple combination
    role.Its function is not as powerful as the action.


    # (2)<jsp:forward--->Requests the forward action


    Through <jsp:forward> you can forward the request to other Web resources,as another
    JSP file,HTML page,Servlet,etc. After the request is forwarded,the current page
    will not be executed,but the page specified by the action.


    > The syntax of the <jsp:forward action identifier is as follows:


    ```

    <jsp:forward page="url"/>

    ```


