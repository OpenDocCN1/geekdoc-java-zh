    # # 16.3.2 Database Connection


    This system uses the connection pool of Hibernate.Compared with the traditional
    JDBC connection method,Hibernate looks at the database with the object-oriented
    idea.When operating the database,there is no need to consider the operation of
    each field in a data record.By creating Hibernate configuration file,Hibernate
    obtains database information about this file,including database type,database
    name,password and mapping file.


    ```

    <property name="connection.url"="jdbc:mysql://localhost:3306/bbs?useUnicode=true&characterEncoding=UTF-8"/>

    <property name="connection.username">root</property>

    Database username

    <property name="connection.driver_class">com.mysql.jdbc.Driver</property>

    <property name="dialect">org.hibernate.dialect.MySQLDialect</property>

    <mapping resource="com/BBS/model/User.HBM.XML"/>

    configure the mapping file

    ```


