    ② The request will be cleared,because it is like entering a new address in the
    browser,the request can not be sent.


    3.form The form will be cleared,even if you jump to the same page.Since the request
    is not saved,the form can''t be saved.


    (2)Redirect="false"Server side jump.


    Metaphor:As if the server redirects the user''s request to another place.


    Feature:①can only jump in a Web service.


    ②request is reserved.


    ③form The form is retained.'
