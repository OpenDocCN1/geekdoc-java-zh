  md: 'communication technology has become the main way.But the biggest problem of
    XML is the amount of data,because XML has a large number of labels,it leads to
    larger files, and if the communication through JSON technology,on the basis of
    maintaining the advantages of XML greatly simplified the size of the communication
    file,improve the quality of communication.


    According to the technical characteristics of JSON and Flex,a basic request flow
    is designed,as shown in Figure 18-12.


    The view layer submits the request to the control layer,the control layer calls
    the Service layer,if you need to access


    the database,the Service layer continues to call the persistence layer,the data
    obtained by the persistence layer is returned to the control layer,the control
    layer will assemble the obtained data into a string in JSON format and return
    to the view layer,the view layer will get the data in the required form rendered.In
    this way,a communication process is completed.The data communication of the entire
    website is based on this technical principle.'
