    # ## 4.3.1 Event-related concepts


    An Event is used to describe what happens.It is triggered by the user''s mouse
    or keyboard actions (such as clicking,text input,item selection,etc.)and other
    page actions (such as page loading and unloading,etc.). Event Source:A component,usually
    a form component,that may generate an event.


    Event Driven:Events trigger the program''s response,executing pre-prepared event-handling
    code.


    Event Handle:In JavaScript,event handling code is usually defined as a function
    that adds the required processing logic and associates it with the he event source
    component of interest.


