  md: 'The full name of JSTL is JavaServerPages Standard Tag Library,that is,JSP standard
    tag library.It is developed and maintained by the Jakarta group of Apache Foundation,a
    constantly improving open source JSP standard tag library,which provides a standard
    and universal tag library for JavaWeb developers.


    The developers can use these tags to replace the Java code on the JSP page,so
    as to improve the readability of the program and reduce the difficulty of the
    maintenance of the program.


    # 12.3.2 JSTLfeatures


    In essence,JSTLis a set of tags defined in advance.These tags encapsulate different
    functions.

    When the tag is called on the page,it is equivalent to calling the encapsulated
    function.JSTL tags canner output content on the page,query databases,and process
    XML documents.


    JSTL tag library is basically divided into five categories :JSTL core library,national
    and format tag library,function tag library,database tag library,XML operation
    library.Using these tags can avoid the use of Java code on the page, and these
    tags are very powerful.Just by introducing a simple tag,you can do what you used
    to with a large chunk of Java code on a JSP page.


    Java 4.0 and later added support for JSTL.


