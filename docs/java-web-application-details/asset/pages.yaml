  md: 'Before,After,Around,Throw 4 kinds.


    (4)PointCut


    A pointcut is a set of connection points that indicate when a notification will
    be triggered.The pointcut can be either a specified class name or a regular expression
    matching the class name and method name. When a matching class or method is called,a
    notification is applied at the matching location.


    (5)The Target object


    The target object is the object to be notified.In AOP,the target object can concentrate
    on implementing its own business logic,and the notification function can be automatically
    introduced during the running of the program.


    (6)Proxy


    A proxy is a new object created after the notification is used in the target object.This
    object has all the functionality of the target object,but also has the additional
    functionality provided by the notification.


