  md: '# # Chapter 5:Web program operation principle


    # ## 5.1 Web program architecture


    # ### 5.1.1 C/S architecture


    In the traditional Web application development,it is necessary to develop both
    client and server-side programs,and the server-side program provides basic services.The
    client is the access interface provided to the user,and the user can access the
    services provided by the server through the software of the client.This Web application
    development mode is the traditional C/S development mode.


    In the C/S development mode,the server and the client cooperate to complete the
    complex business logic.For example,in the previous network software,this mode
    is generally adopted,and now in the network game,this Web development mode is
    generally adopted.In these'
  merge: -1
  pgno: 216
- img_proc: true
  md: 'Web applications,users are required to install the client before they can be
    used.


    In the development mode of C/S architecture,the server side is completely provided
    by the developers themselves,the developers themselves to formulate client access
    rules,this time the server not only to provide functions of the service,but also
    to provide a little protocol support,through such a protocol,the client program
    can communicate with the server side,so as to enjoy the services provided by the
    server side.


    # 5.1.2 B/S architecture


    In the current Web application development,under normal circumstances,another
    development mode will be adopted,in this development mode,no longer develop the
    client software separately,the client only needs a browser


    to access the services provided by the server side,this development mode is the
    current popular B/S architecture


    In B/S architecture,only need to develop server-side program functions,without
    considering the development of client software,the client can access the functions
    provided by the application system through a browser


    This architecture is the main development mode of Web applications at present,such
    as major portal websites,various


    Web information management systems,the use of B/S architecture can speed up the
    speed of Web'
