  md: 'flow. (1)After receiving the request from a user,ActionServlet searches for
    the matching ActionMapping object based on the request URL.If no matching example
    exists,it indicates that the URL path information requested by the user is incorrect.Therefore,the
    message "The request pathis invalid"is returned.When the matching ActionMapping
    object is found,it goes to the next step.


    (2)When ActionServlet finds the matched ActionMapping object,it determines whether
    the corresponding ActionForm exists according to the mapping information in ActionMapping.If
    it does not exist,it creates a new ActionForm object and saves the form content
    submitted by the user to this new ActionForm object.


    (3)In the Struts-config.xml configuration file,you can also configure whether
    the form requires validation.If validation is required,call ActionForm''s validate()method
    to validate the form information entered by users.


    (4)If ActionForm''s validate()method returns ActionErrors,the form validation
    fails.In this case,the ActionServlet returns the page to the user''s input page
    and prompts the user to re-enter.If null is returned,the form validation was successful.'
