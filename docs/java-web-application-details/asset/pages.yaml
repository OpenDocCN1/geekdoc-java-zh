  md: '# Chapter 7 JDBC Database Connections


    # 7.1 JDBC Overview


    7.1.1 JDBC

    JavaDataBase Connectivity (JDBC),Java Database Connectivity technology,It is a
    combination of Java and SQL and independent of a specific database system programming
    interface (API,it is a Java API that can be used to execute SQL statements,that
    is,by a set of classes and interfaces written in the Java language).

    With JDBC,Java programmers can write complete database applications in the Java
    language.In'
  merge: -1
  pgno: 313
- img_proc: true
  md: 'addition,it is also possible to manipulate data stored in a variety of different
    database management systems,regardless of the data storage format in the database
    management system.At the same time, Java language platform independence,it is
    not necessary to write different database applications under different system
    platforms.


    # 7.1.2 Purpose of JDBC design


    JDBC is a specification,the most important purpose of designing it is to allow
    each database developer to provide Java programmers with standard database access
    classes and interfaces,making it possible to develop Java applications independent
    of the DBMS(database changes,drivers change,but the application program remains
    unchanged).


    Microsoft ODBC is written in C,And only applicable to the Windows platform,can
    not achieve cross-platform operation of the database.Although SQL language contains
    data definition,data manipulation,data management and other functions,but it is
    not a complete programming language,and does not support flow control,need to
    be used with other programming languages.


    The design of JDBC is because the Java language has the advantages of robustness,security,easy
    to use and automatic download to the network,so if the Java language is used to
    connect the'
  merge: -1
  pgno: 314
- img_proc: true
  md: 'database,it will be able to overcome the defects of ODBC limited to a system
    platform;The SQL language and Java language combined with each other,can realize
    the connection of different database systems,thatis,the use of JDBC can easily
    send SQL statements to any relational database.


    # 7.1.3 Main functions of JDBC


    +   (1)Support the basic SQL statements,in the Java program to achieve the database
    operation function and simplify the operation process.


    +   (2)Provide a variety of database connection methods.


    +   (3)Provide a unified operation interface for a v ariety of different databases.


    # 7.1.4 Comparison between JDBC and ODBC


    (1)ODBC is written in C language,not object-oriented;While JDBC is written in
    Java and is object-oriented. (2)ODBC is difficult to learn because it combines
    simple functionality with advanced functionality,and even simple queries come
    with complex options;JDBC is designed so that simple things are done in simple
    ways.'
  merge: -1
  pgno: 315
