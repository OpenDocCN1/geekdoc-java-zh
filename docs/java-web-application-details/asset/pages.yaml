  md: '# (1)Assignment injection


    In the Javbeans specification,getter and setter methods corresponding to properties
    can be used to obtain and set the property values of beans,and this method has
    been widely used in ordinary Javbeans. Also in Spring,each object appears as <bean>in
    the configuration file,and the child element <property-specifies the use of the
    setter method of the Javbeans to inject the value.


    In <property>,you define the property to be configured and the value to be injected.You
    can inject any type of value into the property,whether it''s a basic Java data
    type or another Bean object.


    # (2)Constructor injection


    When using the assignment injection method,you can inject the value of the property
    through the <property> element.The method of constructor injection is basically
    similar to this,the difference is that when using constructor injection,the <bean>element''s
    child <constructor-arg>specifies the parameters that need to be injected when
    instantiating the Bean,and provides the corresponding constructor in the Bean.Instead
    of providing setter and getter methods for properties. In actual development,both
    of the above methods are commonly used.In addition,the method of injection dependency
    can also use the interface method to achieve,in the specific development,you can
