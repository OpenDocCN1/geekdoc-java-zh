    JSP is a dynamic web authoring technology that allows Java code to be included
    in a page.The extension of the JSP file is.jsp,and the markup of the jsp file
    can also use XML syntax.


    JSP is a server-side scripting language developed by Sun Company.Since its launch
    in 1999,JSP has gradually developed into an important technology for developing
    Web applications.


    JSP can be nested in HTML,and support multiple operating system platforms,a Web
    application'
