  md: '# Chapter 3 CSS and its applications


    # 3.1 Basics of CSS


    # 3.1.1 Basic concepts of CSS


    CSS is a set of extended style standards customized by W3C Association to make
    up for the shortcomings of HTML in the display attribute setting.Its full name
    is Cascading Style Sheets.Traditional HTML has some problems with page layout
    and display Settings.Since the introduction of CSS,HTML markup is used specifically
    to define the content of the webpage,and CSS is used to set its display.


    The CSS standard redefines the original text display style in HTML,adding some
    new concepts such as classes, layers,etc.,which can overlap and position text.Before
    the introduction of CSS page design,the traditional'
