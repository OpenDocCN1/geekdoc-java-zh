  md: "# ### 6.3.1 Basics of HTML forms\n\nIn the previous section,we explained how\
    \ the Servlet\nsends different dynamic content to the browser for\ndisplay through\
    \ examples,and did not explain how the\nclient sends the specified request to\
    \ the Web\nserver through the browser.The client can send\n kinds of requests\
    \ to the Web server through the\nbrowser, that\nis,POST,GET,PUT,DELETE,OPTIONS,HEAD\
    \ and\nTRACE.But in actual Web programming,we only\nneed to focus on \"POST\"\
    \ and \"GET\"requests,and the\nother five types of requests are rarely used.\n\
    \nA\"POST request is sent via an HTML Form called\n\"Form\",which contains various\
    \ forms of Input\ncomponents,such as Input text,Input password,Input\nradio,and\
    \ input checkbox,select radio,Select\nmultiple,textarea,\nSubmit button,Reset\
    \ button,etc.The following details the\nuse of forms and components.\n\n(1)Form\n\
    The basic syntax used by the Form tag is as\nfollows.\n\n```\n<form method=\"\
    post\"action=\"/servlet/addMessage\">\n</form>\n```\n\nHTML markup is not case\
    \ sensitive,and all data content\nthat needs to be submitted through the Form\
    \ must be\nplaced in the form markup to be submitted\ncorrectly.\"action\" specifies\
    \ the URL of the Servlet\nprogram that processes the form;If not specified,the"
