  md: '1.Temporary state


    The Java object that opens up memory space by Java''s new command is the Java
    object that is usually familiar.If no variables reference it,it will be reclaimed
    by the JVM.


    Temporary objects exist in memory in isolation.Their purpose is to carry information
    and have no connection to the data in the database.


    You can use the save ()and saveOrUpdate ()methods of the Session to associate
    a temporary object with the


    database,and insert the information carried by the temporary object into the database
    through the mapping of the configuration file.The temporary object becomes a persistent
    object,and has the same "id"field as the database.


    2.Persist the state


    Persistent objects have a corresponding record in the database and have a persistence
    identifier.A persistent object may be newly saved or newly loaded,and only holds
    this state for the duration of the associated Session declaration.'
