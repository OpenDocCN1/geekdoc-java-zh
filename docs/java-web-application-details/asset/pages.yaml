    com.microsoft.jdbc.sqlserver.SQLServerDriver

    com.microsoft.sqlserver.jdbc.SQLServerDriver

    oracle.jdbc.driver.OracleDriver

    com.mysql.jdbc.Driver

    ```


    ```

    //SQL Server 2000 driver class name

    //SQL Server 2007 driver name

    //Oracle driver name

    //MySql driver class name

    ```


    The following is an example of loading the SQL Server 2007 driver:


    ```

    Class.forName("com.microsoft.sqlserver.jdbc.SQLServerDriver");

    ```


    # (3)Create a connection to the data source.


    ①First to specify the data source,JDBC technology uses the database URL to identify
    the target database. Database URL format: jdbc:<subprotocol name>:<subname>,where
    jdbc is the protocol name,determined

    <subprotocol name>specifies the type and specific connection mode of the target
    database;<<sub-name>specify the specific database/data source connection information
    (such as the database server IP address/communication number,ODBC data source
    name,connection user name/password,etc.),the format and content of the sub-name
    change with the different sub-protocols.'
  merge: -1
