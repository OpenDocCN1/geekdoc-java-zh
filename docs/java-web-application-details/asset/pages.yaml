    # 4.2.3 Data types of JavaScript


    The data types of JavaScript are relatively simple,mainly including integer,floating,character
    and Boolean.


    +   (1)Integer:Integer data can be positive integers,negative integers,and 0,can
    be expressed in decimal,octal,or hexadecimal.


    +   (2)Floating-point:floating-point data consists of an integer part plus a decimal
    part and can only be expressed in decimal, but be expressed using scientific notation
    or standard methods.


    +   (3)Character type:Character type data is one or more characters enclosed by
    single or double quotation marks.


    +   (4)Boolean type:Boolean type data has only two values,that is,true or false,mainly
    used to describe a state or flag. In JavaScript,it is also possible to use the
    integer 0 to represent false and non-zero represent true.


    The basic objects supported by JavaScript arebuilt-in objects(String,Math,Date),browser
    objects(Window,Document,History,Forms...,User-defined objects.The use of related
    objects is described in detail below section 4.4.


