  md: 'When the scope is session,JavaBean object is created,it will exist for the
    entire session life cycle,session object is a built-in object,when the user uses
    the browser to access a web page,A session representing the link is created,and
    files in the same session share this JavaBean object.The JavaBean object''s life
    ends when the client''s session lifetime ends.A JavaBean object exists in a session
    within the same browser.When you reopen a new browser,a new session is started.Each
    session has its own JavaBean object.


    # 10.3.4 application scope


    When the scope is application,after the JavaBean object is created,it will exist
    for the entire lifetime of the host or virtual host,with the application scope
    being the longest lifetime of the JavaBean.All files in the same host or virtual
    host share this JavaBean.If the server is not restarted,the JavaBean object for
    which scope is applied will remain in memory,processing client requests,until
    the server is shutdown and the resources it occupies in memory are released.During
    this time,the server does not create a new JavaBean component,but creates a synchronous
    copy of the source object.Any change to the replicated object will change the
    source'
