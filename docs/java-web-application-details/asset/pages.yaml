  md: 'the makers of website content.BBS,as the earliest a nd most successful Internet
    social tool,has already be ecommerce the

    mainstream community form of the Internet.


    # 16.1 Analysis of key technologies


    In order to meet the needs of users''network communication,based on the MVC framework
    extended by Struts+Hibernate,

    MyEclipse is used as the development platform and Tomcat is used as the server.With
    today''s mainstream website development technology JSP language for the development
    of the front interface,MySQL as the background development of a BBS forum can
    provide anonymous users,ordinary users,moderators,system administrators four roles
    of the user registration,login,Posting,reply and rights management and other core
    functions.


    The biggest feature of this system is friendly interface,simple and beautiful,simple
    and convenient operation,stability and versatility. The application of FCKeditor
    plug-in makes the function of text editing diversified when Posting and replying
    in the forum.


