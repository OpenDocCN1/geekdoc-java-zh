  md: '# # Chapter 14:Spring Framework and its applications


    # ## 14.1 Spring Basics


    # ### 14.1.1 Introduction to Spring


    Spring is a lightweight framework that consumes less resources.Moreover,Spring
    is non-invasive, and in general,concrete objects in the system introduced with
    Spring do not depend on the Spring API.In Spring,there is good support for inversion
    control (IOC)and aspect oriented programming (AOP).

    Spring is a powerful,lightweight framework that solves many common problems in
    J2EE development and can

    replace EJB technology.Spring is made up of several modules as shown in Figure
    14-1.These modules provide the basic functionality needed to develop enterprise-level
    applications.You can choose to use the required modules in your programs


    | SpringAOF | Spring ORM | ho | Spring MVC |

    |---|---|---|---||

    | | Spring Web | | |

    | Spring D | | Spring Context |


    Figure 14-1 Structure of the Spring framework


    (1)Core container and support tools

    The core container provides the basic functionality of the Spring framework,and
    the main component of the core container is the FirebaseAuth class,which provides
    the core functionality of Spring.It uses the factory pattern to implement inversion
    control,thereby separating the configuration and dependencies of the application
    from the actual application code.'
  merge: -1
  pgno: 796
- img_proc: true
  md: '# (2)Application Context module


    The Application Context module extends the BeanFactory to provide support for
    internationalization,system lifecycle events,and provides support for Java enterprise-class
    services in this module,such as accessing JNDI,integrating EJBs,and email services.


    # (3)AOP module


    In the Spring AOP module,directly integrated the function of section-oriented
    programming,development section-oriented.Spring AOP can provide services such
    as transaction management for Spring-based applications.By using AOP,you can also
    use declarative transaction management strategies in applications without relying
    on EJBs.


    # (4)JDBC and DAO modules


    JDBC and DAO modules provide template code in database operations,such as obtaining
    database connections,processing result sets,closing database connections,etc.
    By providing Spring simplifies the code of database operations and releases database
    resources,so you can avoid the performance problems caused by database resource
    release failure.


    In addition,Spring''s JDBC and DAO modules provide a database exception handling
    layer,which is used to manage exception handling and error information thrown
    by different database vendors,which simplifies the error handling of database
    operations,and greatly reduces the exception'
  merge: -1
  pgno: 797
- img_proc: true
  md: 'The amount of work handled.


    (5)ORM mapping module


    In Spring does not provide the implementation of ORM mapping,but provides support
    for other ORM tools,you can integrate existing ORM mapping tools in Spring,ORM
    tools supported in Spring include JDO,Hibernate and ibatis,etc.Spring transaction
    management provides support for these ORM tools. (6)Web module


    The Web module builds on the Application Context module and provides context for
    web-based applications. This module provides common Web task handling capabilities,simplifies
    handling multi-part and binding request parameters to domain objects, and in the
    Spring Web module,provides support for Struts.


    (7)MVC module


    Spring''s MVC module is a complete MVC implementation.Although Spring can integrate
    well with other MVC frameworks,Spring can separate business logic from control
    logic by using inversion control,and in Spring you can declare how to bind request
    parameters to business objects.At the'
