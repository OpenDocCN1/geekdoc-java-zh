  md: 'Struts is responsible for the Web layer.ActionFormBean receives the data submitted
    by the form in the web page,processes it through the Action,and then forwards
    it to the corresponding web page.The <action-mapping? is defined in Struts-config.xml,and
    the ActionServlet loads in.


    Spring is responsible for the business layer management,which is the Service.Service
    provides a unified calling interface for Action,encapsulates the DAO of persistence
    layer,and integrates Hibernate.Spring manages transactions in a unified manner.


    Hibernate is responsible for the persistence layer and completes the CRUD operation
    of the database.Hibernate has a set of hbm.xml files and POJOs that correspond
    to tables in the database,and then defines DAOs.These are the classes that interact
    with the database.


