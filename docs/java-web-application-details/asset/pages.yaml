  md: '# # Chapter 11 Struts framework and its applications


    # ## 11.1 Struts Basics


    # ### 11.1.1 Struts Origin


    Struts is an open source project of Apache Foundation,which is an implementation
    of the classic design pattern--MVC_. Struts provides a common framework for Web
    applications,allowing developers to focus on solving the actual business logic,and
    adopting Struts can achieve good code reuse.So far,Struts has become the de facto
    standard of MVC pattern in Web development,and a large number of Web application
    development choose to use Struts to realize MVC pattern.'
  merge: -1
  pgno: 555
- img_proc: true
  md: 'Framework concept is not very new,along with the development of software development,in
    multi-layer software development projects,reusable,easy to extend and well-tested
    software components are more and more popular.This means that people can spend
    more more time analyzing and building applications of business logic,rather than
    same type of problem engineering.The solution to the same type of problem is abstracted
    and extracted into an application framework.This is what we call a Framework.


    # 11.1.2 How Struts works


    Figure 11-1 shows the working mechanism of Struts.'
  merge: -1
  pgno: 556
- img_proc: true
  md: 'Figure 11-1 How Struts works


    All requests from customers that need to go through the framework,Uniformly received
    by ActionServlet (Struts has written ActionServlet for us,as long as the application
    does not have any special requirements,it can basically meet the requirements),according
    to the received request parameters and Struts configuration (struts-config.XML)in
    ActionMapping,the request is sent to the appropriate Action to deal with,to solve
    the problem of who is doing,they together constitute the controller of Struts.


    Action is the real component of the Struts application.It solves the problem of
    what to do.It completes the business of the application by calling the required
    business components (models).The business component solves the problem of how
    to do,and returns the result of execution'
  merge: -1
  pgno: 557
- img_proc: true
  md: 'An ActionForward object representing the required JSP(or Action)that depicts
    the response is returned to the ActionServlet to render the response to the customer.


    In particular,the Action class should not contain too much business logic,but
    simply collect the data


    required by the business method and pass it to the business object t.In fact,
    its main responsibilities are:


    +   (1)Verify preconditions orstatements;


    +   (2)Invoking the required business logic method;


    +   (3)Detect or handle other errors;


    And (4)Routing control to relevant views.


    Struts is a realization of JSP Model2 design standards,the following from the
    Model (Model),View(View),Controller (controller) three parts to introduce the
    structure and working principle of Struts.The MVC pattern structure is shown in
    Figure 11-2.


    ![](img/311f18978b6cf25bea17ea3c0d6ddff3_558_0.png)


    Figure 11-2.MVC pattern


    In general,the model in Struts frameworkis composed of Javebeans or EJBs,the view
    is composed of JSP pages,and the controller is implemented'
  merge: -1
  pgno: 558
- img_proc: true
  md: 'by ActionServlet and Action.Figure 11-3 shows the basic structure of the MVC
    framework.


    Figure 11-3 MVC pattern of Struts'
  merge: -1
  pgno: 559
- img_proc: true
  md: '(1)Model

    The model represents the state of the application and the processing of business
    logic,in the general Web application, using JavaBean or EJB to achieve the business
    logic of the system,in the Struts framework,the model layer is also implemented
    with JavaBean or EJB.


    (2)View

    In Struts,view layer broadly includes two parts,namely JSP page and ActionForm.ActionForm
    encapsulates the user submitted form information,in these JavaBeans there is no
    specific business logic,It only provides getter and setter methods for all properties,
    which correspond to the input items of the user form by one by.In Struts,the user''s
    form information is submitted to the controller through the ActionForm.

    Struts view components include JSP pages, which is also the main view components
