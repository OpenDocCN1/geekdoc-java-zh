  md: 'Step 1:To execute an SQL query Statement,you must first create a statement
    object,which encapsulate the SQL statement to be executed,and executes the SQL
    statement to return a ResultSet object,which can be achieved through the createStatement()method
    in the Connection Class.For example:


    ```

    Statement stmt =conn.createStatement();

    ```


    Step 2:execute the SQL Statement by calling executeQuery(),executeUpdate(),or
    execute() provided in Statement.It''s up to the SQL statement itself to decide
    which method to use.


    The executeQuery method is used for statements that


    produce a single result set,such as select


