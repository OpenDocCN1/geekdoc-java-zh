    +   (1)Aspect


    Aspect is the realization of an abstract function module,such as the function
    of user login,which can be abstracted from the system and described by an independent
    module,the independent module is the aspect. Of course,this module is different
    from the ordinary Java function module,it is a special module that follows the
    AOP specification.Through the section plane isolate the problems of different
    levels in the system to achieve unified management,each section plane only needs
    to focus on their own logic implementation also reduce the coupling degree of
    the system,thus greatly enhancing thereusability of code.


    +   (2)Join point(JointPoint)


    The join point is a stage point in the process of running the program,which can
    be a method call,an exception thrown,etc.At these stages facets can be introduced
    to add new service functions to the system.


    +   (3)Advice


    Advice is the processing logic used at a connection point,that is,the actual implementation
    of the section function.The types of notifications include'
