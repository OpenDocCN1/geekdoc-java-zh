    #  11.1.3 Workflow of Struts


    ActionServlet is the core controller in Struts,all user requests must be processed
    by ActionServlet,and struts-config,xml is the core configuration file in Struts.In
    this file configures the mapping relationship between user request URL and controller
    Action,ActionServletends user request to the corresponding controller through
