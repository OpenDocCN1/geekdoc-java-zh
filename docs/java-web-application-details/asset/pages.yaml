    # 14.1.2 Spring Inversion of Control


    In order to form a loosely-coupled structure between program components or classes,developers
    need to create instances of objects before using instances of classes.IOC gives
    the task of creating an instance to the IOC container,so that only the instance
    of the class needs to be used directly when developing application code.This is
    IOC inversion of control.This inversion of control relationship is often likened
    to the so-called Hollywood principle (Don''t call me,I will callyou,please don''t
    call me,I callyou).

    IOC is the relationship between programs controlled by the container,rather using
    code control directly in the program. Controlis transferred from the program code
    to the external container.The transfer of control is called inversion,which is
    the essence of inversion of control.


    Since the dependencies between the program components are controlled by the container,during
    the program run,the container dynamically injects the dependencies into the components,which
    is the essence of dependency injection.Dependency injection is essentially another
    interpretation of inversion of control. Inversion of control is one of the core
    technologies in Spring.In any Java application system,to implement specific business
    logic,many Java classes need to work together to complete.During the running of
    the program,each Java object must get the required object before it can continue
    to run.This relationship'
  merge: -1
  pgno: 799
- img_proc: true
  md: 'between objects is dependency.

    In the traditional application system,this dependency relationship is completed
    by calling other classes in the code,

    which increases the degree of coupling,which brings all kinds of hidden dangers
    to the system.In IOC,the dependency between objects is described in a unified
    configurationfile,and the object of other classes will not be


    directly called by code in the program.During the program run,the 10C container
    is responsible for injecting the dependency between objects,so that the various
    objects work together,so as to achieve the functions of the system.


    # 14.1.3 Spring injection of dependencies


    Martin Fowler has written an article specifically about Inversion of Control Containers
    and the DependencyInjection pattern discusses the concept of Inversion of Control
    and comes up with a more accurate


    concept called "injection dependency".Various parts of the Spring framework make
    full use of Dependency Injection technology,eliminating single-instance junk and
    cumbersome property files from code and replacing them with consistent and elegant
    application code.'
