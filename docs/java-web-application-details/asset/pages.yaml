  md: 'If the delete()method is used,the persistent object becomes a temporary object,and
    the corresponding record in the database is deleted,and the object is no longer
    associated with the database.

    A persistent object is always associated with a Session and Transaction.During
    a Session,the persistent object are not immediately written back to the database.Only
    when the Transaction ends,the database is updated.This completes the synchronization
    between the persistent object and the database.The persistent object before the
    synchronization is called a dirty object.


    +   3 Persist a Session executes


    When close(),clear()orevict(),the persistent object becomes a managed object.
