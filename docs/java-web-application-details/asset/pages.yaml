  md: '# 13.1.6 Hibernate persists classes and rules


    # 1.Persist classes


    Persistent classes are classes used by applications to solve business problems.Instances
    of persistent classes are saved to the database by Hibernate persistence management.


    Persisting classes only need to conform to simple rules,known as the POJO programming
    model,and Hibernate will work fine.


    But these rules are not mandatory,and the latest versions of Hibernate have very
    few requirements for persistent objects that users can use Your own method for
    representing persistent objects.


    # 2 Persist class rules


    (1)Implement a default constructor All persistent classes must have a default
    constructor so that Hibernate can instantiate them by using newInstance().


    (2)Provide an identification attribute (optional) The property must contain a
    primary key field in the database table.This property can be called by any name,and
    its type can be any original type,a wrapper type of the original type,or even
    a user-defined joint primary key.'
