    on the tech line today.Using Flex to develop the foreground part of DIY e-commerce
    platform can not only show the required DIY functions incisively and vividly,but
    also greatly reduce the development and design cost of the foreground page.


    # 18.1.1 Flex technology


    Flex is an open source framework from Adobe.Flex interprets a.mxml file to organize
    components in a non-Flash way,such as Java.NET,and generates a corresponding.swf
    file.Flex''s component is similar to Flash''s component,but with some enhancements.


    Flex mainly supports two development languages,one is ActionScript,and the other
    is specially used for the development of the network mxml annotation language,and
    this website is mainly by mxml,with JSP background technology to achieve an e-commerce
    platform.


    # 18.1.2 Flex asynchronous


    Synchronous and asynchronous are both responses for interacting with other resources,synchronous
    is a real-time response at the same time,and asynchronous is a response that can
    be given at different points in time.


    The simple explanation is that you provide a callback function,and when the data
    arrives,the callback function will be called and you can access the'
  merge: -1
  pgno: 1057
- img_proc: true
  md: 'downloaded data.Through this technique,you can refresh parts of the page,and
    Ajax technology is based on this.However,b ecause Ajax is implemented by HTML
    and JavaScript,it inevitably brings about the compatibility problem of the system
    and browser,while Flex is implemented by Flash virtual machine,so the cross-platform
    characteristics make it have its own advantages.


    # 18.1.3 JSON


    JSON(JavaScript Object Notation)is a lightweight data interchange format that
    is easy for humans to read and write,but also easy for machines to parse and generate.It
    is based on a subset of JavaScript.JSON uses a completely language-independent
    text format,but also uses similar to the C family of languages. These features
    make JSON an ideal language for data exchange, Since JSON and XML are about equal
    in readability,it''s hard to tell the difference between the simple syntax on
    one side and the canonical form of tags on the other.XML is naturally very extensible,and
    JSON certainly is.


