  md: '# 12.5 JSTL Core tag Library


    # 12.5.1 Basic knowledge of the Core label library


    The JSTL core library mainly has functions such as input/output,flow control,iterative
    operation and URL operation. If you want to use the tag of the core library in
    the JSP page,need to use the taglib instruction to indicate the path of the tag
    library as follows:


    ```

    @taglib prefix="c" uri="http://java.sun.com/jsp/jstl"

    ```


    prefix="c" indicates that the label of the core library must start with c.The
    uri=http://java.sun.com/jsp/jstl/core specifies the uri address of the core library''s
    declaration file.


    In the above code,the tag prefix can be set by itself,but the uri is already set,and
    you not need to change this setting in general.


    +   1.<c:out>


    The function of the <c:out>tag is equivalent to the out object in JSP,and can
    print a string on the JSP page,and <c:out> can also print the value of an.


    The common properties of the <c:out> are shown in Table 12-5.


    Table 12-5 <c:out>Common properties


    | Generic | Description | Must | Ornot | Default |

    |---|---|---|---|--|

    | value | The output information can be an EL expression | is | There |

    | default | value Displays the information when the value is empty | no | i |

    | escapeXml | true escapes XML character sets | no | True |


    Code:Your username is:


    ```

    <c:out value="${S(user,username)}"default="guest">

    ```


    Meaning:Display the username of the user,if empty,display guest.


    ```

    Code:<c:out value="${S(sessionScope,username)}">

    ```


    Meaning:Specifies the display of the value of username obtained from the session.<c:out
    value="${S(username)}"/>'
