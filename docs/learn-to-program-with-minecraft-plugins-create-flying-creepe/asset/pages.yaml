  md: "# Create a SavedLocation Class\n\nSince you can't save SavedLocation objects\
    \ directly to disk, you need to make an object that you can save to disk: a SavedLocation.\
    \ You'll create a SavedLocation from a Location by making a new SavedLocation\
    \ object like this:\n\n```\nSavedLocation saved = new SavedLocation(loc);\n```\n\
    \nLet's get started writing some code. Go into the BackCmd plugin's src/backcmd\
    \ directory and create a new file name SavedLocation.java. The first thing you'll\
    \ need is a package statement:\n\n```\npackage backcmd;\n```\n\nThe start of your\
    \ SavedLocation class will look like this:\n\n```\nBackCmdSave/src/backcmdsave/SavedLocation.java\n\
    import java.util.Stack;\nimport org.bukkit.Location;\nimport org.bukkit.Server;\n\
    import org.bukkit.World;\n\npublic class SavedLocation implements java.io.Serializable\
    \ {\n    public String worldName;\n    public double x;\n    public double y;\n\
    \    public double z;\n\n    public SavedLocation(Location loc) {\n        //\
    \ ...\n    }\n```\n\nGo ahead and copy that into your new file, or type it in\
    \ as we go.\n\nFirst off, declare that the class implements java.io.Serializable.\
    \ That's the missing piece that tells Java that objects of this class can be written\
    \ to disk. Now, that means that any data you contain must also be Serializable,\
    \ which all of the basic Java classes are. In this case, each of your SavedLocation\
    \ objects will hold four pieces of data: a String for the name of the world of\
    \ this Location, and the three coordinates, x, y, and z.\n\nWhen you use to create\
    \ an object, Java will create the object for you and run the constructor. That\
    \ gives you the chance to set up anything in the object that needs setting. And\
    \ that's where you're going to start writing code.\n\nNow it's your turn. Fill\
    \ in the body of the constructor and set the object's internal variables (worldName,\
    \ x, y, z) to the proper values from the Location named loc, which is passed in\
    \ this function. You may need to look at the Bukkit documentation for Location\
    \ and World. Remember that because it's a constructor,"
