  md: 'section of code a name, and those instructions will be run in one order, line
    after another. We call that a function (sometimes we call it a method; for now
    they mean mostly the same thing).


    Why do we bother with functions at all? Couldn''t we just have one big list of
    instructions and be done? Well yes, we could, but it can get very confusing that
    way.


    Think of a list of instructions and ingredients to make a cake with frosting:


    +   * Blend together and bake

    * Flour

    * Butter

    * Sugar

    * Milk

    * Eggs

    * Vanilla

    * Cocoa powder

    * Confectioner''s sugar

    * Butter

    * Milk

    * Mix together and spread on cake


    Which part of the list is for the cake itself, and which is for the frosting?
    Maybe the frosting part starts at the cocoa powder. Then again, maybe it''s a
    chocolate cake base with a vanilla frosting. The point is, it''s hard to tell.
    It might work as is, but if you need to figure out what''s going wrong it will
    be very hard. And if you need to make any changes, it will be harder still. Suppose
    you have some strange relatives who want their cake to have an orange-apricot
    glaze instead of chocolate frosting (did mention they were strange). Where do
    you go in and make the changes?


    Instead of one big list, suppose we had broken it up into two steps like this,
    where each one lists the ingredients and steps for just that part of the cakaking
    process:


    +   * makeChocolateCake

    * makeVanillaFrosting


    Oh, now it is easy to see. If there''s a problem with the cake, you know how to
    look. If you want to do a different icing, you can easily change it to this:


    +   * makeChocolateCake

    * makeOrangeApricotGlaze'
