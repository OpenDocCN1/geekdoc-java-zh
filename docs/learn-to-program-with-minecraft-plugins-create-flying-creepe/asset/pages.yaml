  md: '# Chapter 10. Schedule Tasks for Later * 136


    So far we''ve sort of cheated—we''ve been putting all new code in our plugin class,
    in one source-code file. When the Minecraft server runs, it makes one object from
    that class file and uses that.


    But if you look at other plugins on the Internet, you''ll notice that often a
    plugin is made of several different classes, working together. The main class
    file has the plugin itself, while other class files might contain listeners, or
    tasks to be scheduled, or any other kind of helper code that the plugin might
    need. We''ve been adding listeners right in our main class, but we aren''t going
    to do that with schedule-able tasks; we''ll define that code in its own class.


    Mechanically, making another source-code file is easy. If you can hit your editor''s
    File -> Save (or something similar), you can make a new file. As long as you''ve
    saved it in the correct directory, the build system will see the new file and
    know what to do. But that''s not enough. You need to know how to tell the plugin
    about the new file, and the new file about the plugin.


    ![](img/7a2de3c40dffff9892138df9fcd9587a_149_0.png)


    Many plugins use a static variable to do that. In other words, they will use code
    in the main plugin to create a static variable that holds an object of the other
    class, and reference it that way. You can also create an object from the class
    using new.


    # Using a Separate Listener


    For example, suppose that in BackCmd we wanted to make the listener a separate
    class. We''d put the onTeleport method in a separate class file and name something
    like BackCmdListener. Then in our main plugin, we''d change the top of the class
    declaration and take out the implements part, like this:


    ```

    public class BackCmd extends JavaPlugin {

    ```'
