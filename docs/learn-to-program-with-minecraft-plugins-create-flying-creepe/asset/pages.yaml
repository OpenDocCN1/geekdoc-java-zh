  md: '# Appendix 3. How to Install a Desktop Server • 226


    If the firewall is turned off (not enabled), then you''re good to go. If it''s
    turned on, make sure Java has permission to allow allowing incoming connections:


    ![](img/7a2de3c40dffff9892138df9fcd9587a_239_0.png)


    Linux:


    If you set up a firewall IPTables, make sure port 25565 is open. However, opening
    up the firewall on your computer itself may not be enough.


    To check if the Internet can get to your port, by point your browser to http://canyouseme.com.
    That will come up with your publicly visible IP address. Type in the port to check
    as 25565, and press Check Port. If it works, you''re good to go. If not, there''s
    one more thing you need to do


    If you are connected to the Internet through a router or cable modem, that device
    may have a firewall as well. Also, even if it has the port open to the Internet,
    you need to forward the port traffic from the router to your local computer.


    # Port Forwarding


    You need to exercise caution and restraint when changing settings on your router.
    If you change something you didn''t intend to, you could end up mucking the device
    and losing your Internet access. However, every router is different, so I can''t
    really give you specific step-by-step instructions. Here are the basics:


    +   Log on your router. You may already know the user name and password for it.
    If not, it may have a default user name and password that you can Google for.'
