  md: '# Chapter 9. Modify, Spawn, and Listen in Minecraft * 120


    +   - setDamage(int damage) sets the damage value of the last damaging event.

    You could make it a lot or a little.


    +   - damage(int amount) inflicts damage on this entity.


    +   - getHealth() returns a double of this entity''s health. It can be zero (dead)
    up to the amount returned by getMaxHealth().


    +   - setHealth(double health) sets the health. Zero is dead.


    You may have noticed that all these functions are declared in LivingEntity itself.
    This is Java gets a little messy. The familiar entity objects incorporate a lot
    of different parent recipes. For instance, a Cow is an Animals, but also an Ageable,
    a Creature, a LivingEntity, a Damageable object, and of course, an Entity.


    That means you use functions from all these different parents. Because Cow inherits
    from Ageable, you get functions where you can alter a Cow property to change its
    age—make it a baby or an adult—let it breed, and so on.


    A Player, on the other hand, does not use Ageable, so you can''t turn players
    into babies, even if they''re acting like them. Instead, a Player has a whole
    different set of functions available, including functions to change the weather,
    the time of day, and your player''s experience level, food inventory, and so on.


    # Spawn Entities


    You can use several functions to spawn different entities and creatures, as well
    as game objects—like an Ender Pearl. To create new things in the world, we''ll
    use functions defined in org.bukkit.World. There are a few useful ways to spawn
    things, depending on what you''re making and how you want to specify it:


    +   - spawn(Location location, Class whatTo) is what we use to spawn squid previously.
    You can get the class to pass in by using the class function on the class name
    itself, like this: Cow.class.


    +   - spawnArrow(Location location, Vector velocity, 0.6, 12) returns a new Arrow.
    The hard-coded numbers 0.6 and 12 seem to make an arrow that flies nicely.


    +   - spawnCreature(Location loc, CreatureType type) returns a LivingEntity.


    +   - spawnEntity(Location loc, EntityType type) is used for nonliving entities;
    it returns an Entity.


    2. In survival mode, right-clicking on an Ender Pearl will transport you to where
    it lands.'
