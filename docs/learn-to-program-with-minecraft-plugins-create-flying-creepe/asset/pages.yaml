- img_proc: true
  md: 'Appendix 3. How to Install a Desktop Server • 224


    # Static vs. Dynamic DNS


    An IP address is a number that anyone in the world can use to connect to your
    server. An IP address is usually four sets of numbers with periods in between,
    like 93.184.216.119 (example.com) or 127.0.0.1 (your local machine, localhost).


    Your ISP probably changes your IP address every so often; you aren''t guaranteed
    to get the same IP-address assignment unless you pay extra for a static IP. If
    you want to ask for a static IP, you probably already know how to set up a domain
    name and DNS server to point your IP (if not, and you want a static IP, check
    out the end of Appendix 4, How to Install a Cloud Server, page 229).


    But you don''t need a static IP for your friends to find you. There''s a trick
    that lets you use your changing, dynamic IP just as easily.


    First off, if you don''t know what your IP looks like, point your browser to this
    URL: http://www.checkip.org.


    And that''s what your IP looks like to the outside world.


    If that changes every few hours or every few days, that can be annoying, as you
    have to keep telling your friends what IP address to use to connect to you. But
    you''re in luck! You can get set up with a dynamic DNS registration for free or
    at a low cost from places like http://dyndns.org or http://www.noip.com.


    They''ll get set up so that your friends can use a friendly name to find you on
    the Internet—something like andyminecraft.dns.org.


    Now that you can find your machine, you need to let them in.


    # Open Up Your Firewall


    Windows, Mac. and Linux machines, as well as your cable modem or ISP''s router,
    can all run firewall software, which is designed to block exactly what we''re
    trying to accomplish here. The idea is twisted, evil griefers are always trying
    to attack your machine and break in. So most machines run some kind of firewall
    to lock out every port except the ones you really want to have open and are expecting.


    So first you need to make sure your computer is open to port 25565.


    Windows:


    +   On Windows 8, starting typing Firewall, and Metro will guide you through to
    "Allow an app or feature through Windows Firewall." See the Windows'
  merge: -1
