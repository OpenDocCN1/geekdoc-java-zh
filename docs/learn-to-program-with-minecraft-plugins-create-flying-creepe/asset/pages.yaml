  md: "# Chapter 11. Use Configuration Files and Store Game Data * 148\n\n```\n--/Desktop/code/SquidBombConfig$\
    \ ls\nbin/ build.sh config.yml dist/ plugin.yml src/\n```\n\nWhen you deploy your\
    \ plugin, this file needs to be included. Fortunately, build.sh will include any\
    \ .yml files in this directory, so both config.yml and plugin.yml will be packaged\
    \ up when you run build.sh.\n\nNext, let's look at how to modify the plugin code\
    \ to use the config file. The important part is in the onCreate() function. If\
    \ it starts up, it'll go and grab values from the configuration file and set them\
    \ into a few static variables for our plugin to use. Here's what I added:\n\n\
    ```\nSquidBombConfig/src/squidbombConfig/SquidBombConfig.java\nprivate static\
    \ int numSquids;\nprivate static double squidDropHeight;\nprivate static boolean\
    \ fire;\n\npublic void onCreate() {\n    FileConfiguration config = getConfig();\n\
    \    numSquids = config.getInt(\"numSquids\");\n    squidDropHeight = config.getDouble(\"\
    squidDropHeight\");\n    fire = config.getBoolean(\"setFire\");\n    setDefaultConfig();\n\
    }\n```\n\nFirst, call getConfig() to get the configuration-file object for our\
    \ plugin. (If there is no actual file yet, we'll get an empty object instead.)\
    \ With this we can now make calls to get values out of the config file.\n\nEach\
    \ call to read data looks like getType(), where Type is the type of the variable\
    \ you're trying to get, so you have getInt, getDouble, getBoolean, getString,\
    \ and such. Using functions named getXXX and setXXX to read and save variables\
    \ is a pretty standard practice of Java.\n\nWe refer to these kinds of functions\
    \ as getters and setters. Okay, perhaps not the most original names.\n\nAt the\
    \ end of our function we'll call setDefaultConfig() as a fail-safe. In case the\
    \ actual configuration file goes missing, this will at least re-create it with\
    \ default values.\n\nLater in the plugin, we'll use these static, class-level\
    \ variables instead of the hard-coded numbers we used in the previous version:\n\
    \n+   1. You have to use the camel-case version of the data type, so it's getInt,\
    \ not getInt: getBoolean, not getBoolean; getDouble, not getDouble; and so on."
