  md: '# CHAPTER 5


    # Plugins Have Objects


    ![](img/7a2de3c40dffff9892138df9fcd9587a_78_0.png)


    You may have heard of object-oriented programming or that Java is an "object-oriented
    language." That''s what we''re talking about in this chapter: using objects to
    represent elements of the Minecraft game, from players to cows.


    You can do anything in code that you could do in the game, and then some. This
    comes down to working with mostly three kinds of things: blocks, items, and entities.


    # Everything in Minecraft Is an Object


    The Minecraft world is filled with blocks. Every location in the game has a block,
    which might be made of air or another material. Blocks can exist in the world
    and in a player''s inventory. Anything in a player''s inventory is represented
    by an item.


    In this world of blocks you have entities, which includes players, creepers, and
    cows. Items in motion are also entities—an arrow in flight or a snowball or a
    potion that''s being flung. All of these are objects.


    Everything in our plugins is an object: locations, blocks, entities, cows, creepers,
    players, and even the plugin itself. All objects, all the time,'
