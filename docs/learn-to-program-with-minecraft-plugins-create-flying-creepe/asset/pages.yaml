    # Getting around Minecraft


    +   - In case you''re not familiar with the Minecraft user interface (GUI), here
    are a couple of quick tips. You can check out some of the many YouTube tutorials
    or official docs for more.

    - The keys W, A, S, and D move you forward, backward, left, and right, respectively.
    Use the Spacebar to jump.

    - Use the mouse to control the direction you are facing.

    - You "hit" things with your left mouse button—for example, to strike with a sword
    or dig with a pickaxe or shovel.

    - You "use" items with your right mouse button—for example, placing an item or
