  md: 'Chapter 13. Design Your Own Plugin • 188


    what you need. That''s all totally normal, and really it''s writing code is all
    about.


    You may need to throw out everything you''ve done and do it over, up to and including
    the entire project. Hey, the government does that with $100 billion projects,
    so we can do it too.


    Professional programmers tackle this problem by taking very small steps: do one
    small, bite-size thing at a time, make sure that works, then go on to the next.
    Any you realize you''ve made a mistake or misunderstood something, go back and
    fix it right then and there. Don''t think you''ll remember to fix it later; you
    won''t. Trust me on that one.


    Let''s dig in and design a new plugin. I''m going to go through these steps on
    my new plugin, and you''ll do the same thing for your new plugin alongside of
    me. Yours should do something different. And it''s okay if this takes awhile;
    this isn''t the sort of chapter you''ll whip through in one evening.


    # Have an Idea


    Before you start, you need some idea of what you want to write. It may not be
    a great idea or a perfect idea yet, and that''s okay. This is software, after
    all, and you''re allowed to change your mind. But we need to start somewhere.


    So I think I''d like to figure out how to randomly generate "creper cows." That
    is, cows that jump around and try to attack you, and that explode when they jump
    on you. That might be fun.


    At this point, I have no idea how to start such a thing.


    # Try This Yourself


    What is your idea? Jot it down now. If you''re stuck, take a look at plugins other
    people have written, or just browse the Bukkit documentation and see if something
    inspires you.


    # Gather Your Materials


    Armed with an idea, the next thing to do is "gather your materials." If you were
    building a craft project, you''d gather all the raw materials (glue, wood, paper,
    gloomy eyes, plutonium) and tools (scissors, hammer, welder, cooling tower—whatever).
    We need to do the same. But what materials do we need?'
