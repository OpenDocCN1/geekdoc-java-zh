  md: '# Files on Your Desktop


    We''ll do all of our work on the Desktop because that''s the easiest place for
    you to find files, and it''s the same across Windows, Mac, and Linux.


    Out in the real world you probably wouldn''t want to clutter your Desktop with
    each new project you work on. But until you get more comfortable moving around
    and setting things, stick to the Desktop.


    makes it look like you typed this:


    ```

    $ cp C:/Users/John Smith/Desktop/HelloWorld/build.sh

    ```


    The computer interprets that as saying "copy C:/Users/john to Smith/Desktop/code/HelloWorld.build"
    and an extra dot. You''ll get the error that is "no such file or directory."


    You have two workarounds: you can use a relative path, typing ".." for parent
    directories, so you go "up" and down into code:


    ```

    $ cp ../../code/HelloWorld/build.sh

    ```


    Or just type it by hand, using quotation marks around the part that contains the
    offensive space:


    ```

    $ cp C:/Users/"John Smith"/Desktop/HelloWorld/build.sh

    ```


    Another problem you might run into is not being in the directory that you think
    you are. When in doubt, you can always do a pwd command to print your current
    working directory:


    ```

    $pwd

    /Users/andy/Desktop

    ```


    Here''m in my Desktop directory, which is where we''ll be starting off for our
    work.


