  md: '# CHAPTER 7


    # Use Piles of Variables: Arrays


    # Your Toolbox


    Is your head full yet? I hope not, because you have a few fun things left to learn.
    In this chapter we''ll add these abilities to your toolbox:


    +   - Use local variables that exist only within a block

    - Use class-level global variables that can be accessed from anywhere in the class

    - Keep piles of data in arrays


    Now that we can create a plugin command to do something, we need to take a look
    at how to remember stuff—in other words, how to better use Java variables to keep
    track of values. We''ll see when to use which kind of variable and how to work
    with piles of data in different ways (things like lists of Player objects), and
    we''ll build a couple of plugins along the way.


    # Variables and Objects Live in Blocks


    Variables live inside blocks. We''ve seen and been using blocks all along; blocks
    are the bits of code written between braces—{ and }.


    Java is a "block structured" programming language. It descended from a family
    of languages going back to the ancient Algol of the 1960s, a line that extends
    from the mother of all programming languages, C, its children C++ and Objective-C,
    and down to its half-cousin-stepchild Java. After Java was around, Microsoft came
    out with C#, which is (totally coincidentally) nearly identical to Java. All of
    these languages work more or less the same way.


    In these languages, you work with blocks of code. Things like statements work
    with blocks of code. Objects we define (like plugins) are blocks of code. The
    whole structure of the language is based on blocks of code within braces.'
