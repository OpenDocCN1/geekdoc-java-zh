  md: '# Chapter 4. Plugins Have Variables, Functions, and Keywords * 54


    That''s pretty much the idea behind functions. They are a way to gather instructions
    and data together into groups that make sense. But functions have an extra fun
    ability: you can use the same function (list of instructions) with slightly different
    data. For example, you could have one function named makeFrosting(flavor) and
    call it with different flavorings.4


    ```

    makeFrosting(flavor)

    sugar

    butter

    mix in "flavor"

    spread on cake

    ```


    Then you could use that same function, passing in slightly different data as needed:

    makeFrosting(vanilla)

    makeFrosting(chocolate)


    That''s why we use functions: to make long lists of instructions (code) easier
    to read and understand, and to reuse sets of instructions with different data.


    You could say functions make programming a piece of a cake. But back to Minecraft.


    # Defining Functions in Java


    Every bit of code we write in Java will be in a function; that''s how Java works.
    We''ve seen functions already, right from the very first plugin.


    Back in the HelloWorld plugin, we declared a bunch of functions that Minecraft
    calls when the game is running: the short ones for onEnable and onDisable, and
    the main one for_.


    We call these particular functions in a plugin the entry points. These are the
    functions that the Minecraft server will call when it needs to. You can provide
    code, if necessary, for all of these—or just for some, depending on your plugin.


    | onLoad | Called when the server loads the plugin, but before it''s enabled |

    | onEnable | Called when the server enables this plugin |

    | onDisable | Called when the server disables this plugin or shuts down |

    | on | Called when the user types in a command in the Minecraft chat with a slash,
    "/" |


    +   4. When you write out an idea that is codelike but isn''t really a programming
    language, we call it pseudo-code. In just case you see that term somewhere, now
    you know what it means.'
