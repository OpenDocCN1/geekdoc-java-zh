  md: "# Chapter 11. Use Configuration Files and Store Game Data · 146\n\nIt would\
    \ be handy if we knew the server was going down, and when our plugins were being\
    \ loaded and run. Unfortunately, the server is set up to call your plugin when\
    \ these events happen. You've seen these entry points in our plugins ever since\
    \ HelloWorld (and we've been using onEnable() to set up for listeners in the last\
    \ two chapters:\n\n```\npublic void onLoad() {\n    log.info(\"[HelloWorld] Plugin\
    \ loaded.\");\n}\n```\n\n```\npublic void onEnable() {\n    log.info(\"[HelloWorld]\
    \ Plugin enabled.\");\n}\n```\n\n```\npublic void onDisable() {\n    log.info(\"\
    [HelloWorld] Plugin stopping.\");\n}\n```\n\nI described these functions in Chapter\
    \ 6, Add a Chat Command, Locations, and Targets, we've used onEnable already.\
    \ Now we're going to start using onDisable() as well. To save and load plugin\
    \ data from disk, we can use both of these functions:\n\nAs you may remember,\
    \ when your plugin gets loaded from disk, onLoad() will be called. At this point,\
    \ the Minecraft worlds don't exist! But if you need to do some setup before Bukkit\
    \ does, then this is your chance (we won't need to use it here, though).\n\nWhen\
    \ the server is going down or your plugin is turned off, onDisable() will be called,\
    \ and that's your chance to save data. When the server comes up, you can use the\
    \ onEnable() function to read data back into your plugin (in addition to any other\
    \ setup in onEnable()—for example, setting up listeners:\n\nThere are two different\
    \ kinds of data that you might care about:\n\n+   - Configuration data, which\
    \ contains things you need to know about how the plugin should work. This is probably\
    \ set only once and updated rarely, but it's read every time the plugin runs.\
    \ You've probably used configuration files in other plugins or in the server setup\
    \ for Minecraft\n\n+   - Game data, which contains things like player scores,\
    \ inventory, and stuff that changes frequently as the game plays. That gets a\
    \ little tricky, as we'll see shortly.\n\nLet's look at each of these types of\
    \ data and how to save and load them."
