  md: 'Floating-point numbers can float or double. A double is larger and can store
    numbers much more precisely, but at the cost of needing more space and power to
    manage. But computers are fast and have plenty of storage these days, almost everyone
    uses double any time they need a double-precision, floating-point, fractional
    number.


    When you type a number with a decimal point in Java, it assumes you''ve typed
    a double:


    ```

    3.1415 // assumed to be a double

    ```


    But if you really need the number to be a float, you have to stick the letter
    ''f'' on the number:


    ```

    3.1415f // now it''s a float, not a double.

    ```


    We''ll need to use floats in just a minute to play a sound effect, because that''s
    what Bukkit requires to set the volume and pitch of the sound. And in general
    you might need a floating-point number more often than you think.


    For example, let''s look at a simple division problem. In Java, you write division
    using the ''/'' character (instead of +), so divide the number 5 in half you''d
    write 5/2. Depending on how you do the division, though, the answer might surprise
    you.


    +   - 5 / 2 is 2 (just 2, nothing more)

    - 5 / 2.0 is 2.5, as you would expect

    - 5.0 / 2.0 is also 2.5


    Why is 5 divided by 2 equal to only 2? On a math quiz, that would be wrong. But
    we''re not dividing real numbers here; we''re using int numbers, so the result
    is another whole number; another int. There are no fractions at all.


    If you want the answer to include fractions, then at least one of the numbers
    involved has to have a fractional part. That''s why 5 divided by 2.0 (note the
    extra .0) gives us the real answer of 2.5 (two and a half). This time, we''re
    using an int (5) and a double (2.0).


    Sometimes you''re careful about fractional parts or remainders (leftovers). If
    you''re calculating something that doesn''t have fractional parts, then all-int
    math is just fine. Half of a Player or a Cow doesn''t make sense (unless you''re
    making hamburger). But if you need fractional answers, then at least one of the
    numbers involved has to be a double or a float.


    Here''s a handy list of several of the common math operators you might need:'
