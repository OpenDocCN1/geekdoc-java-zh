    Let''s take a closer look at how a plugin handles a chat command like /sky.


    # Handle Chat Commands


    When the player types a command, your onCommand method will be called.


    The player''s command is passed to you in a string, which we named commandLabel.
    The first thing you need to do is check and see if the command player typed is
    the one you want. How do you check if strings are equal? Down on the line at ①
    we''ll use the string''s function equalsIgnoreCase to check if the player typed
    "sky". (Remember, you can''t use == on strings; you have to use either equals
    or equalsIgnoreCase, and most of the time you want to ignore the case, so "sky"
    will match "Sky", "SKY", and even "sky")


    If we got a match for "sky", then we''ll execute this next code block, between
    the braces—{ and}.


    The next thing we need to check is a bit awkward; it turns out that the CommandSender
    gets passed to us may not be a Player. It could be a Player object, but it could
    be a Console instead, or who knows what else. We want to make sure it''s really
    a Player, so we''ll check for explicitly at ②, using the Java keyword instanceof.
    This tests to see if the thing passed in is really a Player. If it is, then we''re
    going to do the bulk of the command starting at ③.


    This begins with another bit of magic, just like we saw with parent/child recipes
    at the end of Chapter 5, Plugins Have Objects, on page 65. Now that we''ve confirmed
    the variable sender is really of type Player (not just a CommandSender or any
    other parent or child), we can convert it to the type Player, using a cast operator.'
