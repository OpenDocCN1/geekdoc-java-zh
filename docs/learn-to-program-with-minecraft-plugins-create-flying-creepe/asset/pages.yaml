    \ says \"make this plugin listen for events.\" You need this only once in this\
    \ file; it will work for all events you'll use. Add it in, and off we go.\n\n\
    Finally we come to the event listener itself, starting at 4. Yes, starting there,\
    \ not on the line with public void like usual. That @EventHandler thing is a tag\
    \ that"
