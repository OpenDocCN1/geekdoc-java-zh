  md: '# Use a Java Array


    Java has you covered. There are several different ways to keep and access piles
    of data. We''re going to focus on a few: the simple Array, the classifier ArrayList,
    and the remarkably handy if somewhat alien HashMap (covered in the next chapter).
    First, upon the Array,


    There are actually a few different Array-like collections in Java, including Array,
    Vector, LinkedList, and ArrayList. They each work differently on the inside, are
    stored slightly differently, and perform differently with large or small data
    sets, but the idea is the same for all of them.


    Arrays are probably the simplest of these piles of data. Arrays are mostly used
    when you have a small list of values that you want to create directly in code
    and then use. Arrays are fixed length—you can''t grow or shrink them. They are
    not useful if you need to add, delete, and move things around a lot in the list
    (for that we''ll use an ArrayList, which is next).


    You''ll usually employ an Array when you want to access its values by an index,
    or run through all the values and do something to them with a loop.


    You can declare an Array using square brackets, and load it up with values using
    braces. Here''s an example of a list of Strings.


    ```

    String[] grades = {"A", "B", "C", "D", "F", "Inc"

    ```


    You can access individual elements from the list using brackets:


    ```

    String myGrade = grades[2];

    ```


    In this case, yourGrade will be a C. Hey, wait a minute—why is that a C, and not
    a B? That''s because Java, like the C language and its predecessors, counting
    at 0. The first element in any list is 0. The second is 1. The third is 2, and
    so on. You''ll get used to it. Think of accessing the first element as adding
    0 to the start of the list, and the second element adding 1 to the start of the
    list.


    That''s exactly how an Array is stored in memory of the computer. Just a bunch
    of values all in row. Since the first entry in the Array is right at the start
    of the memory, it has no offset. The second value is one over from the start,
    the third is two over from the start, and up you go.


    You can tell the length of an Array by looking at its length field (note this
    is not a function call; there are no parentheses)


    ```

    int numGrades = grades.length;

    ```'
