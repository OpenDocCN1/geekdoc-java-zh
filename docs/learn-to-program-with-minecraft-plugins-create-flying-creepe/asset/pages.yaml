  md: 'So imagine you''re the Java compiler. You just completed reading a line of
    code through the semicolon, and you''re starting the next line. You see this first
    part:


    ```

    Stack<Player> locs =

    ```


    Ah! The programmer is declaring a variable named locs, and it''s a generic Stack
    of Player objects. And we''re about to assign an initial value to it.


    Then the compiler sees the next part of the statement:

    playerTeleports.get(player.getName());


    You (the compiler), look up playerTeleports() and see that it returns a Stack
    of Location objects. Well, that won''t do at all. Here the programmer says we''ve
    got a Stack of Players, and now the code is trying to assign a Stack of Locations.
    So from the point of view of the compiler, you expected a Player and instead got
    a Location.


    The compiler, of course, is wrong.


    That''s because no compiler can really infer your intent. The compiler can only
    judge what you''ve actually done, not what you intended to do.


    Always be in mind when trying to decipher compiler error messages: they are from
    the compiler''s point of view, and it cannot read your mind. At least not yet.
    We''re working on it.


    At any rate, correcting the type of the Stack to match the problem:

    Stack<Location> locs = playerTeleports.get(player.getName());


    # Bukkit Server Error Messages


    Bukkit will display error messages either in the server log (~/Desktop/server.log)
    or right in the Minecraft game console as you''re playing. Here are the most common
    errors you might see with a new plugin.


    # Server Log: Plugin Won''t Load


    Most errors in the file serverlog or in the server''s console (in your screen
    session) are more straightforward than the compiler error messages. One of the
    most critical and common ones is this:


    ```

    [SEVERE] Could not load ''plugins/HelloWorld.jar'' in folder ''plugins''

    org.bukkit.plugin.InvalidPluginException:

    java.lang.ClassNotFoundException: helloworld.HelloWorld

    ```


    You''ve written a new plugin, and you''re getting an error that it can''t be loaded.'
