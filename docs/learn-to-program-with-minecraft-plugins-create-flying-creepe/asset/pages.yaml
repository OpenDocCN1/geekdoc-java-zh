    First Commit


    That shows the full log entries, with the long version of the commit identifier,
    the author, the date, and the log message. These long random-looking hashes (which
    are cryptographically interesting SHA1 hashes, in fact) identify each commit.
    But they are really long. Usually you can just use the first four to eight characters
    of the hash as long as produces a unique string.


    You can get a more concise report of the exact same information using this:


    ```

    $ git log --oneline

    50847c8 Add my personal screed

    aa58dba First Commit

    ```


    The shorter version of the commit hash is usually all you need.


    So remember: when you create a new file and need Git to track it, don''t forget
    to do the add:


    ```

    $ git add myNewFile.java

    ```


    And then do a commit to save a snapshot of all your files in the repository. You
    can always check to see what Git knows about, which ones it doesn''t, what''s
    been committed, and what hasn''t, by typing this:


