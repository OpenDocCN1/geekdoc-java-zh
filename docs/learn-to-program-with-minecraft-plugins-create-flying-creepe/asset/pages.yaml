  md: 'Remote Access * 235


    Your next question may be, ''Swell, but how do I get OUT?'' Fair enough.


    You can log out by pressing Ctrl-d or by typing exit. And now you''re back to
    your local shell.


    # Admin with Root


    On any modern system, an ordinary user doesn''t usually full permissions to do
    everything on the system. You usually have to type a password to get the authority
    of an administrator on the system. On Windows machines this account is called
    Administrator, and on Linux and Mac it''s called root.


    While you can log in directly as root with the appropriate password, that''s usually
    frowned upon. It''s too easy to make a typo and suddenly blow away half your system.
    Root is ultimately powerful, and with great power comes responsibility.


    But you still need to be able to execute certain commands as root. You can do
    that using the sudo command, which lets you do as the super user root would do.
    You preface the command you want to run with sudo, and it will prompt you for
    your normal user account password. Get it right, and then the rest of the command
    will be executed as root. For example, here I''m using sudo to run an adduser
    command to add the user ''fred''.


    ```

    Remote sudo adduser fred

    Password:

    User ''fred'' added.

    ```


    This way allows you to have the full power of root, but only in limited, controlled,
    well-known circumstances, and not just logged in as root.


    In fact, if your SSH is set so that it allows root to log in directly, you should
    look up how to disable that feature. You may have to log in using your user account
    and SSH key, and then provide your password via sudo. That''s the safest way to
    allow root access for yourself, and not for the millions of hostile attackers
    who are eyeing your system at this very moment.


    # Securing Root Access


    You might be already set up to use sudo. Log in to your server and try running
    some simple command (like id, which just reports who you are) sudo:


    ```

    Remote sudo id

    [sudo] password for and:

    uid=0(root) gid=0(root)

    groups=0(root),1(bin),2(daemon),3(sys),

    4(adm),6(disk),10(wheel).

    ```'
