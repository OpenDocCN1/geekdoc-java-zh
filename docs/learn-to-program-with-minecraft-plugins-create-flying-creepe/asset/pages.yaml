    # Design Your Own Plugin


    # Your Toolbox


    In this chapter you''re going to design your own plugin. You''ll add the last
    necessary bits to your toolbox. You''ll learn the following:


    +   - How to assign responsibilities to classes

    - How to translate responsibilities into functions

    - How to do a little design, a little coding, and a little testing, all as you
    go


    You''ll be able to start working on your very own plugins.


    For all the plugins we''ve looked at so far, I''ve led the way and shown you what
    to do. In this chapter I''ll give you some suggestions and hints to help you develop
    your own plugins from scratch. Together we''ll go through the steps for a brand-new
    plugin and see how it works.


    We''re going to (more or less) follow these steps:


    +   1. Have an idea: I want a plugin to do

