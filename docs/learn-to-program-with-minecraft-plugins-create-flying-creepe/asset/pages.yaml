  md: '# APPENDIX 1


    # # How to Read Error Messages


    Error messages from the Java compiler, the runtime system, and the Minecraft server
    try to be self-explanatory, but they don''t always succeed. The javac compiler
    in particular can get more than a little confused and spit out unhelpful messages.


    Please read through this whole section even if you aren''t getting a particular
    error at the moment, as some of this information might help you decipher other
    error messages that aren''t included here.


    I''ve included some of the common error messages you might run into, along with
    some observations and commentary. If you run into an error that you just can''t
    figure out, and it isn''t listed here, try Googling for the text of the error
    message. Odds are that someone else has the same problem at some point, and you
    can benefit from their experience.


    # Java-Compiler Error Messages


    Java-compiler error messages usually look something like this:


    ```

    src/helloworld/HelloWorld.java:21: cannot find symbol

    symbol: class CommandSender

    location: class HelloWorld.HelloWorld

    public boolean onCommand(CommandSender sender, Command command,

    ```


    Java is trying to tell you exactly where the error occurred and what it thinks
    the problem is.


    The first bit of text is the name of the file where Java thinks the problem is
    located—in this case, the file src/helloworld/HelloWorld.java. Next is a number
    in between colons—that''s the line number in the file (21 here). Next is the error
    message itself, "cannot find symbol.\ After that come the details specific to'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# Appendix A. How to Read Error Messages • 212


    this error message, which in this example is the symbol that it can''t find, and
    some more information about the location of the missing symbol.


    So on line 21 of HelloWorld.java, Java doesn''t know about the thing named CommandSender.
    Let''s look at some possible causes.


    # javac: Cannot Find Symbol


    "Cannot find symbol" means that the compiler has come across a word, a piece of
    text, that it doesn''t understand.


    This error can be caused by several problems. First, what happens if I just stick
    in an assignment statement like i = 10 without ever declaring what i is?


    ```

    src/helloworld/HelloWorld.java:23: cannot find symbol

    symbol : variable i

    location : class helloworld.HelloWorld

    i=10;

    ```


    The compiler has no idea what i is or what it should be, so it complains.

    To fix it I can add a declaration like int i; above this code or on this same
    line as int=10; the compiler knows that i is a local variable.


    But what if I have declared the variable and I I still get an error? For instance,
    the call to onCreate(). I''m declaring a CommandSender sender. sender is my variable,
    of type CommandSender, but I get the error:


    ```

    src/helloworld/HelloWorld.java:21: cannot find symbol

    symbol : class CommandSender

    location : class helloworld.HelloWorld

    public boolean onCreate(CommandSender sender, Command command,

    ```


    This can indicate a missing or misspelled import statement. The compiler knows
    that sender is a variable of type CommandSender, but it doesn''t know what a CommandSender
    is.


    In this case, adding


    ```

    import org.bukkit.command.CommandSender;

    ```


    at the top of the file fixes the error. See Appendix 7, Common Imports, on page
    253, for a list of common imports we''ve used in the book, or look it up in the
    Java or Bukkit doc.


    # javac: Missing Semicolon


    ```

    src/helloworld/HelloWorld.java:6: '';'' expected

    import org.bukkit.command.CommandSender

    ```'
