  md: '# Running Remotely * 239


    Fortunately, you can use a command named screen. Java running even though you''ve
    logged out. It takes an argument string of -d -m -S followed by a name for your
    server session. We''ll use mcserver to name the session, so the new server-style
    startup script will look like this:


    ```

    #!/bin/bash

    cd $(dirname "$0")

    screen -m -S mcserver Java -Xms1024M -Xmx1024M -jar craftbukkit.jar nogui

    ```


    (Remember, start_minecraft needs to be executable; be sure to chmod +x start_minecraft
    if you get a "permission denied".)


    That will start the server off in its own little world, which won''t be affected
    by logging off. If you want to "attach" to the server so you can issue commands
    and,, use screen with the -r option and the server name:


    ```

    $ screen -r mcserver

    ```


    And you''ll be attached to the server with the usual spew and prompt:


    ```

    16:47:49 [INFO] Done (1.163s)! For help, type "help" or "?"

    >

    ```


    To detach from your server session, press Ctrl-a then d. You''ll be returned to
    your original shell, and your server will still be running in the background.


    To see what processes you have running, use the ps command:


    ```

    Server - $ ps

    PID TTY TIME CMD

    337 tty0 0:00:09 -bash

    842 tty2 0:13:78 /usr/bin/java -jar craftbukkit.jar

    ```


    And to see all the processes on a machine, try ps -? will list all the options.

    There are a lot.


    In a pinch, if you need to kill all Java processes, you can use


    ```

    Server - killall java

    ```


    That asks Java nicely to exit. It will try to do some cleanup and exit in a safe
    and reliable manner. However, if it''s stubborn and won''t behave, you can use
    the brutal


    ```

    Server - killall -9 java

    ```


    which will kill all Java processes, right now—period.


    +   1. There''s a slightly simpler way to do this using the command nohup (named
    for "No Hangup"); however, you lose the ability to enter commands to the server
    easily.'
