  md: '# Chapter 5. Plugins Have Objects • 70


    In Java, you can define a pile of variables and a bunch of code that uses those
    variables, sort of like defining a recipe. You can then create and use an object
    that''s built from that recipe. Java calls this kind of recipe a class. From that
    class recipe, Java will make running objects. Look at the following figure here
    you have a few variables and some functions for a sample Player class, and some
    objects it can make.


    | Player |

    | int health;

    | String name;

    | Location location;

    | setHealth();

    | teleport();

    | getName();|


    A class is like a recipe


    That can make a bunch of objects; all have the same functions, but each with their
    own values:


    | int health=100:

    | String name="Fred"

    | Location=100,65,250 |


    | int health=56:

    | String name="Pat"

    | Location=10,82,123 |


    | int health=6:

    | String name="Kim"

    | Location=340,76,225 |


    Figure 5—A class is a recipe for making objects.


    It is just like building objects from Lego blocks; the blocks may all be the same,
    but when you follow the printed instructions that come with the kit, you can build
    a spaceship.


    For instance, Minecraft keeps a pile of interesting data and functions related
    to each player who''s online. This "recipe" is defined by the class org.bukkit.entity.Player,
    which builds objects for an individual Player. Note before you use Player in your
    code, you must add an import statement at the very top of the file—in this case
    you''d do an import org.bukkit.entity.Player.


    So how can we get one of these player objects?


    The Minecraft server knows who''s online at any point, so we can ask the server
    for a list of Player objects. Or we can ask for a specific user by name, and it
    will give us a single Player object. Here''s how.'
