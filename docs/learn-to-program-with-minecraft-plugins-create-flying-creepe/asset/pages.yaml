    of different ways you can use piles of data, using Java data collections.


    # Use a Java Array


    While variables with individual values are useful and common, sometimes you need
    more than that. You need to keep track of all the players in the system, or one
    player''s inventory items, or a to-do list, or a grocery list, or a homework list.'
