    ```\n// Add 'implements Listener' here:\n2 public class HelloWorld extends JavaPlugin\
    \ implements Listener {}\n```\n\n```\n3 public void on() {\n    // Register this\
    \ plugin to listen to events\n    getServer().PluginManager().registerEvents(this,\
    \ this);\n}\n```\n\n```\n// Here's one event listener:\n4 @EventHandler\npublic\
    \ void anyname(SomeEvent event) {\n    // Some code goes here\n}\n```\n\nFirst\
    \ off, you have to import the class for the event you're interested in (you'd\
    \ add this somewhere around 1).\n\nThere are a ton of events available, all listed\
