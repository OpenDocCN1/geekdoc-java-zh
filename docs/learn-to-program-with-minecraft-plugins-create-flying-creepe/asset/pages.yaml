  md: 'Typically you don''t want to store .class or .jar files, as those can always
    be created again. You definitely want Git to remember all your java source code,
    and your plugin-configuration and build-configuration files.


    So first thing, let''s clean up the plugin directory and get rid of the extra
    junk:


    ```

    $ rm -f bin/*.class

    $ rm -f dist/*.jar

    ```


    That removed the generated .class and jar files. Now you''re left with a clean
    directory tree, with the files you want Git to remember and track changes for.


    You use git add files..., where files can be individual file or directory names.
    Since now you want everything in the current directory from here down, you can
    just type git add .


    ```

    $ git add

    ```


    (Remember that ". means the current directory.) Now Git knows to watch all these
    files.


    But it hasn''t yet taken a snapshot of the current state of your files. To do
    that, you have to commit your changes:


    ```

    $ git commit -a -m ''My first commit''

    ```


    That command will record the current state of your source code in Git''s repository.
    The -a means to commit changes in all the tracked files, and the -m lets you specify
    a message.


    The message is very important: it''s how you can tell what you were doing when
    you changed these files. If you use a wonderfully descriptive message like "I
    did stuff.", then this won''t help you any.


    Let''s play with that moment. Create a new file in the CowShooter directory and
    name it README.txt. Put anything you want in the file: comments about the plugin,
    your personal manifesto, nonsense text, whatever.


    Now add the file and commit the add:


    ```

    $ git add README.txt

    $ git commit -a -m "Add my personal screed"

    [master 50847c8] Add my personal screed

    1 file changed, 1 insertion(+)

    create mode 100644 README.txt

    ```


    To see the history of your commit messages, you use git log:'
