    \ online.\n\nLet's see how to use this code within a plugin.\n\n# Plugin: LocationSnapshot\n\
    \nHere's a simple example of PerMap being used in a new plugin, LocationSnapshot.\
    \ In this plugin, we'll provide two new commands:\n\n+   * /savelocations\n* /loadocations\n\
    \nYou might want to use this kind of feature as part of a competition, where you\
    \ can return everyone back to their starting points at the end.\n\nThe saveload\
    \ command, as you might expect, saves to disk the current locations of all online\
    \ players. loadocations reads them back in and teleports everyone back to those\
    \ saved locations. We'll use the PerMap functions to save and load a hash of Players\
    \ and Locations.\n\nThis is a long plugin, so let's break it up and look at the\
    \ pieces.\n\nThe plugin starts off in the usual way, and we'll keep the name of\
    \ the data file in a string:\n\n```\nLocationSnapshot/src/locationsn/LocationSnapshot.java\n\
    public class LocationSnapshot extends JavaPlugin {\n    public static Logger log\
    \ = Logger.getLogger(\"Minecraft\");\n    private final String datafile = \"locations.dat\"\
    ;\n```\n\nWhy bother putting it in a string instead of typing it literally (as\
    \ \"locations.dat\") a few times? Because any time you have to something repeatedly,\
    \ you run a pretty good risk of typing it wrong the second or third time. In this\
    \ case, the compiler can't help you: it doesn't know that there's a problem when\
    \ you save to \"locations.dat\" and read from \"locations.dat\". So you're there\
    \ scratching your head over a weird bug where you never see the data you write.\
    \ So let's keep the name in a string instead, and mark the string as final. That\
