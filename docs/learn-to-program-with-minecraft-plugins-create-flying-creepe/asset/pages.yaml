  md: 'But in fact that''s not the case; the computer can be running a bunch of different
    threads of execution, apparently all at the same time. Can our code work that
    way? What would happen to our code if it were run by multiple threads?


    If you''re using only local variables and aren''t trying to change anything in
    common in the Minecraft world, that would probably be fine—each version of the
    code as it''s running would have its own copy of variables, and no harm done.
    But if you''re using a static variable, something like a big HashMap to keep track
    of players and values? Then you have two bits of code reading and writing from
    it at the same time, and that generally leads to disaster.


    Imagine that you read the player''s health as 50 in one thread, but then a second
    thread sets it to 0—killing the player. You don''t know that, and you subtract
    10 from the player''s health and reset it to 40. Now the other thread thinks it''s
    killed the player, but instead of 0 the health has "magically" been set to 40!
    That''s a simple and innocent example, but worse things can happen that could
    cause strange bugs or make your code—crash.


    There are ways to write code that can be run by multiple threads safely; however,
    the Bukkit code was not built that way.


    That''s important enough to repeat: the Bukkit library, and your code that uses
    it, is not built to run by multiple threads. It will break.


    So when we want to run a piece of code "later," we can''t actually let it run
    at some random time—we can''t let it run at the same time as our code (or the
    Bukkit code).


    Instead, we have to let Bukkit determine when to run the code. Then it can run
    it pretty much as if you were a player typing in a command or responding to an
    in-game event; it''s the only thing running at the time. Bukkit calls that a synchronous
    task, and that''s what you''ll learn how to set up in this chapter.


    But to set up a task, we''ll first see how to make our own classes.


    # Put Code in a Class by Itself


    First, let''s be a little more precise in what we name things. In Java source
    code, you declare a plugin to be a public class, which is Java''s way of saying,
    "This is a recipe. I can make objects of this class at runtime. While I''ve been
    loosely talking about recipes and parent recipes, I''m going to start calling
    them by their proper Java name: classes. "Recipes" are classes.'
