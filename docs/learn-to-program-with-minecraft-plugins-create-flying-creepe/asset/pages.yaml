    # Try This Yourself


    Now go through these questions for the plugin you want to build, and come

    up with your own list of things you''ll need—your "materials."


    Include things you''re not sure about—there''s no penalty if you end up in

    using them.


    # Lay Them Out


    Before we create the plugin and start writing code, let''s think about what

    might go. In other words, will this fit all in one function or even one

    class, and if there are several functions or classes, what goes where? If there

    additional classes, what do they need to know about us or each other? If

    you''ve forgotten some details of functions and objects, check back with

    Chapter 4, Plugins Have Variables, Functions, and Keywords, on page 41, and

    Chapter 5, Plugins Have Objects, on page 65, for a refresher.'
