  md: "But first we'll cover how to use it with a simple plugin named SaveLocations.\n\
    Then you'll be writing your very own class to use PerMap to save the state of\
    \ the more complicated BackCmd plugin.\n\n# Use PerMap\n\nPerMap provides you\
    \ with two functions, load and save. load takes a plugin\n and name of the file\
    \ you want to load from and returns a hash. save takes\nthe plugin, the file name\
    \ to save to, and the hash to save:\n\n```\nHashMap<String, Object> load(JavaPlugin\
    \ plugin, String fileName)\n```\n\n```\nboolean save(JavaPlugin plugin, String\
    \ fileName, Map<String, Object> data)\n```\n\nThe file name in both cases should\
    \ be named after the plugin. For instance,\nwe're going to hook this up in SaveLocations,\
    \ so we'll use the name \"SaveLoca-\ntions.dat\". Notice we're not specifying\
    \ the full path or any directories; the load\\and save will figure that out for\
    \ you.\n\nYou'll probably want to load the PerMap hash just once, in your plugin's\n\
    enable section, and save it as often as you need. You might want to save\nit only\
    \ the disable section, but in that case you could lose data if the\nserver crashes\
    \ or shuts down unexpectedly. If that's important to you, then\ny should save\
    \ the hash any time you make a change to it.\n\nThere is one important limitation\
    \ to PerMap and many other storage\napproaches, however. This hash will save most\
    \ normal Java objects, but will\nnot save Minecraft-specific objects—things like\
    \ Location or Player. You can save\na player's name as a String, and save a location\
    \ as a set of double coordinates,\nbut you can't save the Minecraft objects directly.\
    \ That's in order to be\nsaved, an object has to know how to save itself, which\
    \ is marked by having\njio.serializable as a parent. The Bukkit API objects don't\
    \ do that, so we can't\nsave or load them directly using Java.\n\nThat turns out\
    \ to be a fair and reasonable limitation in real time. Because you really\nshould\
    \ not store Player objects, worlds, locations, or other \"live\" elements in\n\
    the game.\n\nKeep in mind that the game is still playing in real time. Players\
    \ log off, they\nchange locations, blocks change types, and things catch on fire,\
    \ and all go\nin and out of inventory, all while your code is running. If you\
    \ store a Player\nobject on disk, or even in a list in memory, there's no guarantee\
    \ that it\nwil be valid when you go to use it the next day or next week. In fact,\\\
    \ odds are it probably won't be valid. All a player needs to do is disconnect\
    \ and\nconnect, and bam—the old Player object is no longer valid."
