    # Keep Your Code Safe


    # Your Toolbox


    In this chapter we''ll add Git to your arsenal. With Git you can change your code
    without fear that you''ll lose anything or mess anything. Git gives you one of
    the most powerful tools of all: an “undo button” for your project. You''ll add
    these skills to your toolbox:


    +   * How to install Git

    * Use Git to keep track of changes to code

    * Go back to earlier versions of code (an “undo button”)

    * Maintain multiple versions of code at the same time

    * Back up your code to the cloud


    Now you might realize a certain frustrating moment when programming: everything
    was working just fine, but you added a couple of lines of code in a couple of
    different files, and now nothing works anymore. What changes did you make? Which
    one messed up? Was it in this file or that one?


    Wouldn''t it be great to press a sort of giant “undo button,” to toss out this
    set of changes that didn''t work so well, and go back to the code from a few minutes
    ago that was working right so you can try again?


    I have got a treat for you.


    You can use a tool named Git to do exactly that and more. Git acts like a huge
    memory of all the changes you make to your code. You can go back in time to any
    previous point, even if you accidentally deleted a file or renamed it, moved code
    from one file to another, and so so on—Git will track it all for you. In addition,
    you can set it up so that a copy of Git''s memory can be backed up in the cloud,
    so even if your whole computer gets damaged or stolen, all'
