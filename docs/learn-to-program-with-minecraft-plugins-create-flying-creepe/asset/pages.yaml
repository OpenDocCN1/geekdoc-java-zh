  md: '# Use a Configuration File


    Many plugins, and the Bukkit server itself, use configuration files to fine-tune
    and customize different values and select different behaviors. A configuration
    file is just a simple text file, designed to be read and edited directly by a
    person. The idea is that you can customize aspects of the plugin without having
    to fool around with the source code or recompile anything. Ed users, server operators,
    developers—everyone can use them. And now we will to


    We''re going to modify a plugin to use a configuration file. Previously, on page
    82, we built a plugin that dropped a bunch of squid on your current location—a
    “squid bomb.” We''re going to add configuration options to the SquidBomb plugin:


    +   * The number of squid to drop

    * The height from which the squid fall

    * The ability to enable or disable setting the squid on fire (a new feature!)


    Lucky for us, the Bukkit plugins come with a configuration file mechanism built
    in and ready to use. Here''s how it works.


    The configuration file has to be named config.yml, and it looks something like
    this:


    ```

    SquidBombConfig/config.yml

    numSquids: 10

    squidDropHeight: 0.0

    setFire: false

    ```


    The format used in this file is called YAML (which stands for YAML Ain Markup
    Language), and it is designed to be a pretty simple format. In fact, you''ve been
    using it all along—it''s the format of the plugin.yml file also.


    Each line represents one setting and has just the name of the value you want to
    store (no spaces in the name, please), followed by a colon (:) and then the value.
    You can use strings, integers, Booleans (true or false), doubles, and so on. You
    can get fancier and nest sections, include lists and hashes, and more, but we''ll
    keep it simple for now.


    To use a configuration file in your plugin, start by making the file yourself,
    by hand. Be sure it''s named config.yml and is in the plugin directory itself
    (not down underneath src with the Java files). It should be in the same directory
    as plugin.yml and src/.


    I''ve gone ahead and created a config file and made the changes to SquidBomb in
    a new plugin called SquidBombConfig. Take a look at that plugin on disk; it starts
    off the same as the original SquidBomb, but you can see I''ve added the config
    file:'
