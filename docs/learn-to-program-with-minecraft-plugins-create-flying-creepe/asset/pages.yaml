  md: '# Chapter 7. Use Piles of Variables: Arrays • 92


    But then on the line at i we declare another variable with the very same name.
    From this point until the next closing brace, }, any time we mention cakeHeight
    we''ll be working with this local one, not the class-level one. This local version
    shadows the class version. So when we set it to 5 and then print it, we''re modifying
    this local version.


    Calling makeCakes then uses the class version to build the tower. The makeCakes
    function has no knowledge of the shadowed variable inside the onCommand function.
    So you end up with fifty blocks; not a hundred, and not five.


    ![](img/7a2de3c40dffff9892138df9fcd9587a_105_0.png)


    +   1) cake_height is 50

    2) cake_height is 5

    3) cake_height is 50


    Moral of this story: don''t do this. As you can see, shadowed variable names can
    be very confusing. Give your variables unique, memorable names.


    # Try This Yourself


    Since the cake tower doesn''t quite work as expected, let''s fix it!


    Change code/CakeTower/src/ctower/CakeTower.java to just use the one local variable
    cakeHeight, not the class-level variable, and pass it to makeCakes.


