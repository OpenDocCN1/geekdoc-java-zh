  md: "# Chapter 8. Use Piles of Variables: HashMap 104\n\nNote that we're not returning\
    \ any particular value from this function, as it's declared to be void; just like\
    \ main is. Instead it's modifying the global currentScores HashMap.\n\nMost of\
    \ the time, though, you'll want functions that return a useful value. For instance,\
    \ there's a short, trivial function that adds 10 to any number pass in.\n\n```\n\
    public static int addTen(int originalNumber) {\n  int newNumber = originalNumber\
    \ + 10;\n  return newNumber;\n}\n```\n\nAll we've done differently is specify\
    \ what kind of value we're going to return (in this case) instead of using void\
    \ in the declaration. Then we use the keyword return with the value that we want\
    \ to return to our caller. Usually we want to call return as the very last thing\
    \ in your function. That's because it specifies what value to return and performs\
    \ the return right then and there. No more code will run in your method after\
    \ it hits the return.\n\n# Try This Yourself\n\nModify the HashMapjava source\
    \ so that no one's score can go below 0 or above 1,000. Use a helper function\
    \ that returns a value to clamp the score to be between 0 and 1,000.\n\nYou can\
    \ see my solution in HashMapClamp/src/hashplay/HashMap.java. In fact, you might\
    \ see another subtle trick in there: instead of making the helper function public,\
    \ I declared it to be a private. What's that all about?\n\n# Keep Things Private\
    \ or Make Them Public\n\nMost of the time so far, we've used the Java keyword\
    \ public when making static variables and defining functions and plugins. That\
    \ tells Java that the thing we're defining should be publicly accessible—all of\
    \ our plugin code can use it, and any other plugin in the system can use it as\
    \ well (like when we use Logger).\n\nThere is another option, though. you can\
    \ create functions or variables or even helper objects that no one else can see.\
    \ Instead of public, you can make them private.\n\nIn programming, there's a simple\
    \ rule. So simple it's the kind of thing you'd tell a five-year-old: don't expose\
    \ your privates."
