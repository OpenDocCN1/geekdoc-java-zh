  md: '# Chapter 3. Build and Install a Plugin • 36


    Here''s a description of what this file needs. Don''t worry much about the details
    yet—it will make more sense as we get farther into the book.


    name


    Name of the plugin—In this case, HelloWorld.


    author


    Name of the author (that''s you).


    main


    Name of the package and class that Java will run to start this plugin (package.classname).


    version


    Version number of your plugin. Start low, and increment the number each time you
    release a new version to the world.


    commands


    A list of the user commands this plugin supports.


    For each command, you have to specify three things:


    +   - **command**: The command a user can type in


    +   - **description**: A simple description of what the command does


    +   - **usage**: A description of the command usage and any options


    The format is important: the white space that''s used to indent some lines needs
    to be there, using spaces, not tab characters. It all needs to line up, and the
    tags (names followed by a colon—“:\”) need to be spelled just as shown here. You
    can find more details on the YAML format in Appendix 5, **Cheat Sheets**, on page
    241.


    # Build and Install with build.sh


    The commands you''ve been typing in your terminal window can also be saved into
    a file; that way you can run them over and over again without having to retype
    them each time. We call this a *shell script*, and it''s another way to program
    the computer.


    Building a plugin is only a little more complicated than compiling a single Java
    file as we did last chapter, but even so, it involves a lot of commands we don''t
    want to have to type out every time.'
