  md: '# Chapter 11. Use Configuration Files and Store Game Data * 166


    In theory, however, exceptions should be used only for exceptional things. If
    you tried to spawn a clown and instead get a creeper, that would be exceptional:
    an unexpected disaster. If you just added a player to a list of players and the
    length of the list was still zero, that would indicate a disaster in progress.


    But trying to read a file that isn''t yet qualify as an exceptional disaster.
    It''s a common occurrence. So we catch the exception (any exception at all) and
    return an empty hash. Now, that''s the behavior I decided on for this particular
    plugin. That might not be appropriate in all cases. In your own plugins, if you
    really expected data to be present and it''s not, then that''s a serious error.
    What will you do?


    And what happens if you fail when trying to write a file? That might mean there''s
    a more serious problem—you might be out of disk space on the server, for instance.
    What should you do?


    If I were you, I''d want to shut down the server as gracefully as possible. A
    dead program does a lot less damage than a broken program that''s still running.
    In writing code for most professional systems, that''s almost always the best
    action to take: fail quickly and loudly.


    But this isn''t our server, necessarily; we''ve just made a plugin that someone
    else is running, and it would be rude to shut down your server because we can''t
    write a file. So in this case, we''ll log an error message to the Minecraft console
    and struggle on.


    # Hide Compiler Warnings


    The other new feature here is the odd-looking @SuppressWarnings("unchecked") annotation,
    which you can see on the line @ PerMap.java.


    We marked event listeners with an annotation in the last chapter, and we''re marking
    this function with a different annotation. Here''s why: Normally when you make
    a mistake in a program''s source code, the compiler will complain with an error
    message and won''t produce the `class` file. But sometimes it does know what you''re
    doing, and doesn''t like it. In that case it prints out a more-less-friendly warning
    message to let you know that it''s not happy.


    Most of the time you should listen to those warnings very carefully. They are
    usually an indication that you really do have an error: the code itself might
    be perfectly legal, but it''s probably not going to do what you want it to.


