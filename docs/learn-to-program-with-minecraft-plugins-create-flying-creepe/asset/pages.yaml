  md: '# # Learn Hardware, Learn Ruby!


    Get into the DIY hardware spirit with the Raspberry Pi, or to program using Ruby;
    the language of Ruby on Rails web applications.


    # ## Raspberry Pi: A Quick-Start Guide (2nd edition)


    The Raspberry Pi is one of the most successful source hardware projects ever.
    For less than $840, you get a full-blown PC, a multimedia center, and a web server—and
    this book gives you everything to get started. You''ll learn the basics, progress
    to controlling the Pi, and build your own electronics projects. This new edition
    is revised and updated with two new chapters on adding digital and analog sensors,
    and creating videos and a burglar alarm with the Pi camera. *Printed in full color.*


    Maik Schmidt

    (176 pages) ISBN: 9781937785082.822

    http://prprog.com/book/msraspi2


    ![](img/7a2de3c40dffff9892138df9fcd9587a_280_0.png)


    # ## Learn to Program (2nd edition)


    For this new edition of the best-selling Learn to Program, Chris Pine has taken
    a good thing and made it even better. First, he used the feedback from hundreds
    of readers to update the content and make it even clearer. Second, he updated
    the examples in the book to use the latest stable version of Ruby, and also to
    use code that looks more like real-world Ruby code, so that people who have just
    learned to program will be more familiar with common Ruby techniques.


    Not only does the Second Edition now include answers to all of the exercises,
    it includes them twice. First you''ll find the “how could you do it?” using the
    techniques you''ve learned up to that point in the book. Next you''ll see “how
    Chris Pine would do it?” answers using more advanced Ruby techniques, to whet
    your appetite as well as providing sort of a “Rosetta Stone” for more elegant
    solutions.


    This fourth printing of Learn to Program, 2nd edition has been updated for Ruby
    2.0. *Printed in full color.*


    Chris Pine

    (194 pages) ISBN: 9781934356384. $24.95

    http://prprog.com/book/ltp2


    ![](img/7a2de3c40dffff9892138df9fcd9587a_280_1.png)'
