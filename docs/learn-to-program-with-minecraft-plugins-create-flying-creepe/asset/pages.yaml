    # Friendly Code


    When you''re writing code to share with others—which means sharing with the whole

    world—you need to make a little extra effort to write "friendly" code:


    +   * Neatness counts. Put braces where they belong; don''t try and jam everything
    on

    one line or use inconsistent indentations. The format of the code can be

    asimportant as the code itself for human readers.


    +   * Keep it tight. Don''t make lines or functions hugely long.


    +   * Comment your functions. Explain why a function is, and what it''s used

    for. Don''t comment on how it does it—that''s what the code is for.


    +   * Honor naming conventions. Java prefers camelCase identifiers (like in the
    word

    camel), with embedded capital letters. Other languages may use names with

    underscores or other conventions. Variable names so that readers can easily

    understand what they are used for. Although single-letter variables (especially

    i) are often used for loop counters, that''s not descriptive. But it''s even worse

    to use i | (which is normally an Index) as a string or a Location! Stick to the

    conventions.


    Suppose one of your fans has for a new feature she''d like you to include

    in your plugin. She''d fork (make a copy of) your repository on her own, and

    make the proposed changes in a named branch in her repository. Then

    trough the magic of GitHub (or Bit), she''d submit her changes in that branch

    to you as a pull request. That''s sending you a request to pull

    her branch into your repository and use it.


    In the web interface, you can reply to pull requests with questions and comments,
    and a whole discussion about the changes. If and when you want to incorporate
    them, just press the Merge Pull Request button. If the new code can merge in without
    any conflicts, you''re done. Otherwise, click the Command Line button, and you''ll
    get further instructions.


