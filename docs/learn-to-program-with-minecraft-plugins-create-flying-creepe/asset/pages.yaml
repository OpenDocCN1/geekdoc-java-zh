  md: 'Gather Your Materials 189


    Well, we need a first guess at what sort of data we will require in the plugin,
    how to keep track of it, and what makes the plugin run—is it run from a command,
    or an event, or a timer? Here are some good questions to ask:


    +   * What do you need to keep track of?


    +   * How long do you need to keep it? (During a command, while the server is
    running, across server reboots on disk...)


    +   * What are the triggers? (User-entered command, in-game event, internal state,
    timer, combination...)


    +   * What parts of the game do you need to affect (blocks, players, potions,
    inventory, and so on) and what Bukkit or Java functions will you need to use for
    them?


    +   * What can go wrong?


    You may not have all the answers yet. But that won''t stop us; let''s get started
    (using "creeper cow" idea).


    What do you need to keep track of? We probably need to keep track of players that
    each cow is getting and trying to attack, or maybe we''ll figure out that for
    each cow as we go along. We don''t know which one yet. Anything else? Oh, we want
    to randomly create locations for the cows; do you remember what function to use
    to get random numbers in Java?


    How long do you need to keep it? Since these are randomly generated attack cows,
    I don''t think we need to keep track of them when the server shuts down—we''ll
    just make new ones. We need to keep track of them in memory while the server is
    running, though, so at a minimum we will need some kind of a static list or hash
    of the cows we spawned. Reread Chapter 7, Use Pile of Variables: Arrays, on page
    87, or Chapter 11. Use Configuration Files and Store Game Data, on page 145, if
    you need a refresher.


    What are the triggers? It would be kind of stupid to have to type in a command
    to get attacked by creeper cows, so we won''t be using anCommand function. Instead,
    we''ll need an event to kick off cow generation, and maybe a timer to keep the
    cow attacking and make it eventually explode. We''ll have to find some kind of
    suitable event to listen for. Have a look back at Chapter 9, Modify, Spawn, and
    Listen in Minecraft, on page 113, and Chapter 10, Schedule Tasks for Later, on
    page 133, for details.


    What parts of the game do you need to affect? We''ll need to move the killer cows
    around and blow them up, which we know how to do from the earlier'
