  md: '# CHAPTER 1


    # Command Your Computer


    # Your Toolbox


    In this chapter you''ll learn about the shell, where you can type commands to
    your computer. You''ll add these topics to your mental toolbox:


    +   * How to open a command shell and type commands

    * How files and directories make up the file system

    * How to navigate around directories in the file system


    Of the earliest and greatest computer games that created a world for you to explore
    was Colossal Cave Adventure,¹ way back in 1976. It was a purely text-based adventure—there
    were no images or graphics. You typed instructions to the game using simple sentences,
    commanding it to "go north" or "take axe" or "kill troll" as needed. And it did
    as you asked, even killing the troll with your bare hands.


    Today, text commands are still in games—even Minecraft has text commands. You''ve
    probably typed commands in Minecraft''s chat window using a "/" character.


    You''re going to issue commands to your computer to build plugins and work with
    files in very much the same way, using the command line.


    The command line is a powerful tool that lets you work on your local computer
    as well as on distant computers in the cloud. In fact, we''ll cover how to do
    exactly that later in the book, in Appendix 4, How to Install a Cloud Server,
    on page 229.


    > 1. http://en.wikipedia.org/wiki/Colossal_Cave_Adventure'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Chapter 1. Command Your Computer • 2


    You can even use the command-line processor to write programs; it contains a full
    programming language by itself, separate from Java. I''ve done a little of that
    for you, with a couple of scripts that help you build and install plugins. We''ll
    use those as we go along.


    If you''re already familiar with the command line, feel free to skip to the end
    of this chapter on page 12.


    # Use the Command Line


    The command line looks something like this on my computer. Yours may use different
    colors and fonts, and you can usually set these to your liking. I apparently prefer
    black letters on a tan background:


    ![](img/7a2de3c40dffff9892138df9fcd9587a_15_0.png)


    You access the command line a little differently depending on the kind of operating
    system you''re running, which will be one of these:


    # Windows


    Windows comes with a very bare-bones command line. You get to it by running cmd.exe.
    If your version of Windows has a “Start” command, then you might be able to select
    Start-Run and enter cmd.exe or just use the search box that comes up to find and
    run cmd.exe. But I don''t recommend using cmd.exe by itself; see the instructions
    in the box on page 3.


    # Mac OS X


    Open the application via Applications -> Utilities -> Terminal.


    # Linux


    If you''re running Linux, you likely already know how to get to a command-shell.
    But for the sake of completeness, and it''s called different things, try any of
    these: open a shell, start a Konsole, or right-click on the Desktop to open a
    Terminal.


    (Fortunately, all of these pesky differences between Windows, Mac, and Linux disappear
    once you''re writing Java code: Java runs the same on each platform.)


    Once you have your command-line application up and running, you''re ready to type
    commands into the command-line processor, or shell, as I''ll call it. You''ll
    be using a few simple commands that I''ll show you as we go along.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Install BusyBox on Windows


    The Mac OS and Linux environments are based on Unix, which has a very rich command-line
    environment, including a full-featured shell. There''s a published standard for
    that environment, called POSIX, which includes commands and language features.
    The POSIX standard shell is really an entire programming language by itself, and
    you can write shell scripts to do basic tasks on the computer for you.


    Windows, however, is not sophisticated. The default command processor doesn''t
    do much at all, the commands have different names, and directory and file names
    are specified differently.


    In order to keep consistency for everybody, I recommend that Windows download
    BusyBox. It installs a more professional, POSIX-compliant standard shell and common
    commands—the same ones that Mac OS X, Linux, and the rest of the world.


    To install the shell and basic commands for Windows, download this to your Desktop:
    ftp://it.busybox.co.uk/public/app/6.0.0/busybox/busybox


    Once it''s downloaded to your Desktop, rename the file from busybox.exe to sh.exe.
    Then open a cmd window and type:


    ```

    C> cd Desktop

    C> C:\windows\system32\cmd.exe /c sh.exe -l

    ```


    Now you''ll see a new shell with a dollar-sign prompt. That''s where we''ll run
    commands and do our work. Notice an important detail: this is running sh.exe with
    a -l flag (which you would pronounce as "minus ell"), which tells it to act like
    a "login shell" where you can type commands.


    For convenience''s sake, you can make a batch file on your Desktop to launch this
    command shell for you. To do that, create a text file and save it to your Desktop.
    Name the file shell.bat and use this line of text in the file:


    ```

    C:\Windows\system32\cmd.exe /c sh.exe -l

    ```


    Save the file, and now you can double-click on shell.bat, and you''ll have a POSIX-compatible
    shell. With that, you can access the commands we''ll use (things like ls, mv,
    cp, and pwd), and you''ll specify directory names with "/" instead of the Windows
    "" character, so everything will work the same on Windows as on Mac and Linux.


    You''ll also be able to employ the command scripts we''ll use to build and install
    plugins.


    For more information on BusyBox for Windows, see its home page.


    > http://intgat.tigress.co.uk/rmy/busybox/index.html'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Chapter 1. Command Your Computer 4


    Each shell prints out a short message indicating it''s ready for you to type something
    in. But instead of a straightforward prompt like "Ready for you to type, master,"
    most prompts are a little more cryptic.


    Windows will show something like C\. Linux and Mac systems might show $ or %.
    Any of these prompts might include additional information, like your name, the
    computer''s name, or a directory name. Since that will be different for everyone,
    I''m going to choose the simplest one for the examples in this book and show the
    command prompt as a $. Whatever your prompt looks, that''s where you type in commands.


    DO NOT TYPE IN THE DOLLAR SIGN ($). I''ll show it to indicate where you type,
    but you don''t type the $:


    +   - $ you type this part, but not the dollar sign


    When you''re done typing in a command and want the computer to run it, press the
    Enter (or Return) key on your keyboard. That''s the easy part. Next you just need
    to learn a few basic commands to type in!


    You can list the files and directories with the directory listing command:


    ```

    $ ls

    ```


    To change your current directory, you use the change directory command. For example,
    to change the directory to the Desktop, you''d type


    ```

    $ cd Desktop

    ```


    and transported to the Desktop (or any other directory whose name you enter).


    For instance, when your shell opens up, you''ll be in some sort of default directory
    or folder (sometimes called a home directory). You can see what files are in your
    current directory by typing the command `ls` (short for "list files") and pressing
    Return.


    You''ll see a listing of a bunch of files. Type cd Desktop, and you''ll be in
    your Desktop directory. Type the command in, and you''ll see a list of all the
    files on the Desktop. Now you''re working at the command line! Let''s delve into
    that a little more.


    +   2. On stock Windows using cmd.exe, you''d have to type dir (short for "directory
    listing") instead. Also, while the rest of the world uses a "/" in directory names,
    Windows uses a "\". These and other differences are why I recommend using the
    POSIX-standard bash shell for Windows as described in on page 3.'
  merge: -1
