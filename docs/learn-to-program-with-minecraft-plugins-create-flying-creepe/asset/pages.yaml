    # Plugin: FlyingCreeper


    Here''s a plugin that shows spawning two entities: a bat and a creeper. We''ll
    make the creeper ride the bat, and then turn the bat invisible using a potion
    effect. The result is a nightmare, terrifying, flying creeper.


    Here are the guts of the plugin:


    ```

    FlyingCreeper/src/flyingcrereeper/FlyingCreeper.java

    Location loc = player.getLocation();

    loc.setY(loc.getY() + 5);

    Bat bat = player.getWorld().spawn(loc, Bat.class);

    Creeper creeper = player.getWorld().spawn(loc, Creeper.class);

    bat.setPassenger(creeper);

    PotionEffect effect = new PotionEffect(

    EffectType.INVISIBILITY,

    Integer.MAX_VALUE,

    1);

    bat.addPotionEffect(effect);

    ```


    Notice we''re using the first version of spawn that we just saw, where we pass
    in a location and a class—in this case, Bat.class and Creeper.class.


    All Entity objects have a setPassenger() function. In theory, you could even ride
    primed TNT. But I wouldn''t advise it. We''re going to have the creeper ride the
    bat by setting the bat''s passenger to the creeper.


    Next we need to turn the bat invisible to make the flying creeper look more convincing.
    Fortunately, all LivingEntity objects can use potion effects. We create a new
    potion effect, which lets us specify the effect''s type, duration, and magnitude:


    PotionEffect(EffectType type, int duration, int amplifier)


    In this case, the type is EffectType.INVISIBILITY and we want it to last forever,
    so we''ll make the duration the largest possible value we can: Integer.MAX_VALUE.
    There is no larger integer. The magnitude doesn''t really matter in this case,
    as you can''t be any "more invisible," so we''ll just use a 1.


    +   3. All potion effect types are listed at http://jd.bukkit.org/rb/doxygen/d3/d70/class-org_1_bukkit_1_potion_1_PotionType.html.'
