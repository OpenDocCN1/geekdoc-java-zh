    # Installing Packages


    Your Linux distribution may come with everything manageable, or it might be missing
    a few parts. To keep things manageable, Linux breaks up all the utilities and
    programs into different software packages. For example, if you''re not doing any
    work with publishing, you won''t need Tex or Ghostscript. If you''re not programming
    in C or C++, you won''t need GCC. If you''re not on a desktop machine, you probably
    don''t need a window manager like Gnome or KDE.


    All of these packages of software can be installed, removed, updated, and listed
    using a package manager. Every major Linux distribution uses a different package
    manager. In fact, you could almost say the package manager is what distinguishes
    one distribution from another, although there is some sharing going on.


    These are some popular package manager commands:


    +   * yum

    * rpm

    * apt-get

    * deb


    The details for each of these commands are different, but they all basically do
    the same thing: download and install a software package for you.


    In particular, if you don''t have SSH installed yet, you''ll need the open-ssh
    package installed so you can log on to your server in a secure way. On Ubuntu,
    you''d run a command like this:


    ```

    $ sudo apt-get install openssh-server

    ```


    sudo run the command as root; apt-get is the package-manager command under Ubuntu,
    and you''re giving it the option to install the package named openssh-server.'
