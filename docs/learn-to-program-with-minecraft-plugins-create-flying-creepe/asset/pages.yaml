  md: '# How Do I Get a Piece of Leather?


    For testing or just playing you might not have a piece of leather handy. Here’s
    how to get one:


    +   - Go into creative mode by typing /gamemode c.

    - Press E.

    - The icon in the upper-right corner is a search bar; click it.

    - Start typing leather, and you should see the Leather material appear.

    - Click it once, then click again on your hotbar (the bottom row of slots in the
    Inventory) to put it there.

    - Close your inventory by pressing the escape key, Esc.

    - Press the corresponding number (1 through 9) to select the box where you put
    the leather.


    When you try to go into creative mode you might see an error saying that you don’t
    have permission. In that case, you’ll need to “op” yourself—that is, give yourself
    privileges.


    In the server directory, you’ll see an ops.txt file, which is probably an empty
    file at this point. Just edit that file and add your name—you might be “player”
    or you might use your real account name.


    Next we get the player’s “item in hand” and check to see if the player is holding
    leather. If the answer is no, we just ignore it goes on.


    But if the answer is yes, we get the player’s current location and the direction
    the character is pointing. We bump up the velocity by multiplying it by 3, as
    that seems to look pretty cool. At we spawn a cow, set its velocity so it will
    go flying, and light it on fire.


    Now, there’s a problem with a flaming cow (or anything that is, really). It won’t
    stay on fire for long; it will burn up and die. So that’s what our scheduled task
    will take care of: it will keep the cow alive and watch for it to land.


