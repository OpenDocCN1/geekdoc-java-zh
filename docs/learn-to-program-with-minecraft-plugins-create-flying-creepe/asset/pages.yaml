  md: 'Next, notice that we''re setting two local variables, name and msg, to args[0]
    and args[1]. Why bother? Aren''t they the same thing? Yes, they are, but it''s
    a lot easier to read name instead of reading args[1] and trying to remember that
    1 is the name and 2 is the message.


    Next we''ll check that we really have an entry in the hash for name, and if not
    we''ll complain to the player. Otherwise we can safely get the location for the
    sign block.


    Next is the bit of magic. We can get the block at the right location, but it''s
    still a block—an org.bukkit.block.Block. A Block doesn''t know anything about
    the functions of a Sign. A Sign is one kind of Block, so we''ll have to convince
    Java to make an org.bukkit.block.Sign out of it.


    The Bukkit documentation tells us to call getState() on the block, and then casting
    using the cast operator to make a proper sign. With the sign variable in hand
    we can call the two sign functions we need: setLine() and update().


    addLine() puts a line of text on the sign at the given index (0 in this case),
    and update() makes sure that the sign is redrawn in the client so you can see
    the new text.


    It might look like a fair bit of code, but if you look at each piece one at a
    time, it''s not so hard. In fact, now it''s your turn to make some changes.


    # Try This Yourself


    As we have it, the plugin only sets the first line of the sign, but you can have
    up to four lines per sign. Modify the sign so that if the user types in extra
    words, you''ll pass each word to sign.setLine(). Remember: if it can hold four
    lines, then they are numbered 0, 1, 2, and 3. We''ve got the setLine() already,
    so you''ll need to add the others if args is long enough.


    # Next Up


    In this chapter we''ve seen how to use a HashMap to keep track of important game
    data by name or other object, and how to make functions private so that other
    plugins can''t access them, or public so that they can.


    In the next chapter we''ll do more than just respond to user commands. We''ll
    see how to listen to the Minecraft server and respond to game events as they happen,
    and even create a few of our own.'
