    # Catch Exceptions in Java


    See the code block bracketed by the try/catch keywords? Some of those functions
    are declared to "throw exceptions" when something goes wrong; if there are problems
    like no file to read, or there''s an error writing the file because the disk is
    full. What''s an exception?


    An exception interrupts the code that''s currently running, throws away the rest
    of the function, and jumps straight to the catch block. It''s sort of like if
    the fire alarm rang right now, you jump up and run out, and not finish reading
    the page.


    For instance, if the call to newOutputStream throws an exception for some reason,
    the calls to writeObject and close will never be called. Instead, the two lines
    of code in the catch block will never run.


    If there''s no error, then the catch block will never run.


    To simplify things, our code catches all exceptions and returns a simple true
    or false. That can be a "beginners" way to handle exceptions, though, and you
    shouldn''t always catch all expressions. Instead, the question to ask yourself
    is "whose problem is it, and who can fix it"


    Normally, code that you''re calling in a library has no idea what you''re using
    it for. When something bad happens, it doesn''t know what you need to do to handle
    the problem. Should the whole server exit? Should you return an error to the user?
    Do you need to change some variables and clean up whatever you were trying to
    do? Since the library code doesn''t know, it doesn''t try to fix it. It just raises—it
    throws up its hands and gives up.


    For instance, the constructor for FileOutputStream we''re using is declared to
    throw a FileNotFoundException:


    ```

    public FileOutputStream(String name)

    throws FileNotFoundException

    ```


    When you call that function, you have two choices. You can either accept the responsibility
    for dealing with any errors and catch the exception yourself, or you can throw
    up your hands as well, and pass the exception up to the caller. To pass the exception
    up, you just declare that your function also throws FileNotFoundException. Now
    it''s someone else''s problem.


    ![](img/7a2de3c40dffff9892138df9fcd9587a_178_0.png)'
