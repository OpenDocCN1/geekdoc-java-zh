  md: "# Use a Java ArrayList\n\nAn ArrayList in Java also keeps track of a list of\
    \ values, just like a simple Array does. ArrayLists are a little messy to declare\
    \ but simple enough to use, and much more flexible and a bit safer than plain\
    \ Array objects. You can add and delete from the ArrayList as many times as you\
    \ want; it's not a fixed length and will grow or shrink as needed.\n\nHere's an\
    \ example of an ArrayList that will hold Player objects:\n\n```\n`List<Player>\
    \ myList = new ArrayList<Player>();`\n```\n\nThere's a lot more gunk in there\
    \ than we've seen up to. First of all, I've called our new myList. Note that funny\
    \ syntax with the angle brackets, < and > You have to specify the kind of list\
    \ you're making (twice, in fact). Java 7 improves this: you don't have to repeat\
    \ it on the right-hand side and you can say List<Player> whatever = new ArrayList<>().\
    \ Also, in a small bit of weirdness, notice that although it's still List on the\
    \ left. The reason for that is...because Java. (Okay, the reason is that List\
    \ is the parent and ArrayList is one particular child.) Moving on now.\n\nWith\
    \ a list you've created, you can do a lot of fun things, like adding and removing\
    \ values from the list, retrieving values, and checking to see if a value exists.\
    \ Here's a bit of sample code:\n\n```\nListPlay/src/listplay/ListPlay.java\npublic\
    \ void listDemo(Player me) {\n  List<String> listOfStrings = new ArrayList<String>();\n\
    \  listOfStrings.add(\"This\");\n  listOfStrings.add(\"is\");\n  listOfStrings.add(\"\
    a\");\n  listOfStrings.add(\"list.\");\n\n  String third = listOfStrings.get(2);\n\
    \  me.sendMessage(\"The third element is \" + third);\n\n  me.sendMessage(\"List\
    \ contains \" + listOfStrings.size() + \" elements.\");\n\n  boolean hasIt = listOfStrings.contains(\"\
    is\");\n  me.sendMessage(\"Does list contain the word 'is?' \" + hasIt);\n\n \
    \ hasIt = listOfStrings.contains(\"kerfluffle\");\n  me.sendMessage(\"Does the\
    \ list contain the word 'kerfluffle?' \" + hasIt);\n\n  \"Because Java is a bit\
    \ of an Internet joke: http://www.theatlantic.com/technology/archive/2013/11/english-has-a-new-preposition-because-internet/281601\
    \ for details.\"\n```"
