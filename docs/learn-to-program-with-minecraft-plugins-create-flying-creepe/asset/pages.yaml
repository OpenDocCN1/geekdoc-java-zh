    that isn''t set up, you''ll get this scary warning:


    andy is not in the sudoers file. This incident will be reported.


    Yikes! Sounds like the cops will come after us. Have no fear: it''s only logging
    the attempt to a log file. All it means is that you have to add your name to the
    permissions file for sudo.


    To do that, log in root and add the following line to the bottom of the file /etc/sudoers
    (nano is a convenient editor to use over SSH; we''ll cover how to install that
    and more in the next section):


    ```

    andy ALL=(ALL) ALL

    ```


    But use your name, not "andy"—unless your name is actually Andy.


    Save the file and try to use sudo.


    Once you can successfully ssh in without a password, and you can use sudo to do
    things as root, then you can turn off the use of passwords and not allow root
    to ssh in directly.


    Now obviously that sounds a little dangerous, as you could accidentally lock yourself
    out of your computer. To help prevent, open one window and log in your server
    as root. Leave that window open and leave it alone, then open a second window
    to start changing settings. In case you mess up and can''t log in or sudo for
    some reason, you have this window still open—as root, the Great and Powerful—as
    a backup.


    In your new window, log in root and edit the file /etc/ssh/sshd_config. You want
    to find these two lines and uncomment them, or change them to no:


    ```

    PasswordAuthentication no

    PermitRootLogin no

    ```


    Then you need to restart the SSH daemon. On many systems you can do that by using
    this:


    ```

    Server $ sudo service ssh restart

