  md: "We will use a simple loop to go through this list of offsets. The first element\
    \ in the list is indexed at 0, and we'll go up to (but not including) the length\
    \ of the list. By using the length of the offsets list instead of sticking in\
    \ a fixed number, like 10, it makes it easier if we want to add extra blocks to\
    \ the list (remember we're adding the player, playerY, and playerZ offsets from\
    \ the preceding code):\n\n```\nsrc/stuck/Stuck.java\nfor(int i =0; i < offsets.length;\
    \ i++) {\n    int x = offsets[0];\n    int y = offsets[1];\n    int z = offsets[2];\n\
    \n    Block b = world.getBlockAt(x + playerX, y + playerY, z + playerZ);\n   \
    \ b.setType(Material.STONE);\n}\nreturn true;\n\n```\n\nSo here we are, going\
    \ through the list of offsets. At each index (which is i), we need to pick out\
    \ the three elements x, y, and z. In each of the small arrays, x is first at index\
    \ 0. The Java syntax lets you work with arrays of arrays by writing both the big\
    \ list first. Think of this of numbers as a table or a matrix, with rows and columns,\
    \ like you might find in an Excel spreadsheet. You specify indexes in \"row-major\
    \ order,\" which means the rows come first, then the column. For each trip through\
    \ the loop, we'll pick out an x, y, and z value from the list. That's the location\
    \ of a block we want to turn to stone.\n\nWe get the block at that location we\
    \ want—in this case, by adding the x, y, and z offset to the player's location\
    \ (playerX, playerY, and playerZ from the code). With the block in hand, simply\
    \ set its material to stone using the constant Material.STONE. All the material\
    \ types are listed in the documentation for org.bukkit.Material. You could, for\
    \ instance, remove a block without breaking it—you'd set the block's material\
    \ to Material.AIR.\n\nHere's the code for the full plugin, all together:\n\n```\n\
    src/stuck/Stuck.java\npackage stuck;\n\nimport org.bukkit.Location;\nimport org.bukkit.Material;\n\
    import org.bukkit.World;\nimport org.bukkit.block.Block;\nimport org.bukkit.command.Command;\n\
    import org.bukkit.command.CommandSender;\n\n```"
