  md: '# Build and Install a Plugin


    # Your Toolbox


    After completing this chapter you''ll know how to


    +   - Compile Java source code to class files, pack them in a JAR, and install
    them on a Minecraft server

    - Run your local server with a new plugin

    - Connect to your local server


    Now that you have the tools installed, we''ll build a simple, basic plugin. It
    won''t do much as plugins go, but it will make sure you can build and run your
    own plugins, and it will act as starting point (or skeleton) for all the plugins
    we''ll write in this book.


    So do your typed-in instructions end up running on a Minecraft server? Here''s
    how the process works.


    You type Java language instructions (we call that "source code") and save them
    into a text file, and then the Java compiler, javac, reads your text file and
    converts it into something the computer can run.


    You went through this process already with the simple CreeperTest.java program
    you typed in previously.


    For the source code you type into a file named CreeperTest.java you''ll get a
    binary (not text) file named CreeperTest.class. A binary file is a file of numbers—it
    makes sense to the computer, but not to humans.


    Because a typical program might use lots and lots of class files, you usually
    archive a bunch of class files into a JAR file, and Java runs the code from the
    JAR.'
  merge: -1
