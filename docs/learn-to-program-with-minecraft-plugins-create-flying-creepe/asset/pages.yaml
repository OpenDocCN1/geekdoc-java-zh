  md: "# Stack vs. Heap\n\nYou may have noticed that sometimes we create and directly\
    \ assign a simple value to a variable, like int a=25, and sometimes we use the\
    \ new keyword to create an object, like a plugin.\n\nThese two different kinds\
    \ of objects are stored differently. Immediate values like integers and floats\
    \ are kept on Java's list of function calls that you're making. That list is called\
    \ a stack. It's like a stack of pancakes. Each new function call throws a new\
    \ pancake on the stack, and when it's done you remove that pancake and you're\
    \ back to the previous one. When a function is finished, its \"pancake\" is thrown\
    \ away, and any of its local variables disappear.\n\nBut objects that you create\
    \ with new are kept off in a big pile of memory we call the heap. They can stick\
    \ around after your function is gone, if you want them to (like a plugin).\n\n\
    You just need to keep a variable somewhere that points to your object; that variable\
    \ can be local and passed around, or global. Java keeps track of how many different\
    \ variables reference the object created with new. No one is using that object\
    \ anymore, it gets tossed in the trash. And then when the system feels like it,\
    \ it empties the trash and your object is gone. (Java even calls \"garbage collection.\\\
    ')\n\nIn other words, if you're using a function or something that only you should\
    \ use it, then mark it as private to make sure that no one from the outside can\
    \ use it. Why would you need to do that?\n\nSuppose that somewhere in your plugin\
    \ you have a function to mark a player as a super, high-level, über-Wizard. You\
    \ wouldn't want any other plugin to call that function on a player of yours. So\
    \ where normally you'd declare the function in the plugin like this (leaving out\
    \ all the other bits):\n\n```\npublic class WizardWorld extends JavaPlugin {\n\
    \n    public void makeSuperUberHighWizard(Player p) {\n        ...\n    } // Any\
    \ other plugin can call makeSuperUberHighWizard()\n}\n```\n\nyou can instead make\
    \ it private, like this:\n\n```\npublic class WizardWorld extends JavaPlugin {\n\
    \n    private void makeSuperUberHighWizard(Player p) {\n        ...\n    } //\
    \ Only functions here can call makeSuperUberHighWizard()\n}\n```"
