  md: 'As this plugin is using event listening, here are the special things we need
    to do:


    +   * At 1, declare that this plugin implements Listener.

    * At 2, register the plugin for events.

    * At 3 add the EventHandler annotation and declare that this event listener will
    listen for PlayerTeleportEvent.


    Every time a player teleports, the onTeleport function will be called. The first
    thing we do is get the correct Player object, which is stored in the event that
    was passed to us. Now we know who we''re dealing with.


    Next we''re looking in the list named to find out whether this player is someone
    we are in the middle of teleporting. What''s isTeleporting, you ask?

    Ah, take a look up the top of the plugin around 2, and you''ll see two variables
    declared to private static. That means no one else can see them, and the values
    will stick around in between running. So we have isTeleporting and playerTeleports
    to keep track of players and the locations they''ve teleported to and.


    We''re checking if isTeleporting list contains this player already. If it doesn''t,
    we''ll add it—this player has just started teleporting. If the isTeleporting list
    already contains this player, we should ignore this event (and remove the player
    from the list). That means we generated this event ourselves, and we don''t want
    our own teleport to trigger the teleport, because it would keep doing forever.
    So we threw this extra teleport event out.


    If this player has teleported before, we''ll get a loc from the playerTeleports
    hash (a hash of locations) using the player as a key. We''ll add this location
    to the existing list. If this is the player''s first time teleporting, we''ll
    make a new list (of Locations) and add this as its first entry.


    But this is no ordinary list. It''s a kind of list, alright, but it''s a Stack,
    not a plain list. A Stack works like a stack of pancakes. You add to the top of
    the stack, and when you remove a pancake it comes off the top of the stack. That''s
    the model we use for our list of places we''ve teleported. As you teleport, each
    location is added to the top of the stack—and it''s the top one you want to go
    back to next, then the one under, and so on.


    To add an object to the top of a stack, you push it on. To get the value and remove
    the object at the top, you pop it off. To just check on the top value without
    removing it, you can peek at it.'
