  md: 'that might include a directory C:\windows\System32, and on Mac/Linux there
    be several directories, like /usr/bin, /usr/local/bin, and so on.


    Because the system has its own commands that you shouldn''t mess with, and because
    you want to add your own commands to run, it turns out are a lot of places the
    computer needs to look! You can tell it exactly where to look with a list of directory
    names. We call that search path, or path for short.


    You can see what''s in the path for your shell window by typing:


    ```

    $ echo PATH

    ```


    For the shell/command-line processor to find a command to execute, it must be
    in a directory that your search path. So you''ll need to add Java''s bin directory
    to your path.


    That directory''s location depends on your operating system and what installer
    you used. A typical location for Windows would be C:\Program Files\Java\jdk1.7.0_45\bin
    (your version numbers may be a little different).


    On Mac, it''s probably installed in /usr/bin or /usr/local/bin, both of which
    are already in your path. But it might be installed somewhere else completely,
    in /opt/local/java.


    In any case, once you''ve installed the install directory for Java, you''ll see
    a bin directory in there. In that directory you''ll see java, jar, and a whole
    bunch of things. You''ll need to add the full path for that bin directory to your
    shell''s PATH.


    The PATH is a list of directories, separated by a colon (semicolon) on Windows).
    To change your PATH for the bash shell that you''re using, follow these steps:


    +   1. In the shell, navigate to your home directory by typing cd, by itself.
    Confirm the full path of your home directory by typing pwd.

    2. Using your text editor, create or edit the bash startup file in your home directory
    named .profile or .bash_profile in your home directory (the leading dot). On Windows
    using BusyBox, you have to use .profile. Otherwise you should use .bash_profile.
    It''s not normal to show files with a leading dot, but -a will show it if the
    file already exists. You may need to create it from scratch, and that''s okay.

    3. Add a line to the file to modify the PATH setting, adding Java''s bin directory,
    separated by a colon (:)—or a semicolon (;) on Windows.


    +   5. If you run into trouble with this method, especially with Windows, take
    a look at http://www.java.com/en/download/help/path.xml.


