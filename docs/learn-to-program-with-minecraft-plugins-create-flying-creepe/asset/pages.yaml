  md: '# Chapter 13. Design Your Own Plugin • 192


    programming language, for that matter), say what you want to do in steps in plain
    English. Tell the story of what you want to do—don''t worry about how yet.


    Each of these steps will become a function. Or at least one function—you may want
    to further split that up into a couple of simpler functions and/or classes needed.


    +   1. Create our list of cows.

    2. Spawn creeper cows and add them to our list.

    3. Set up each creeper cow with a timer.

    4. Listen for events to create and remove cows.


    That part was easy. But what''s a creeper cow to do? Our responsibility is to
    "attack players." What does that mean? How about this:


    +   1. Find the closest player. (There might not be one.).

    2. Jump toward the closest player. (Don''t die from the impact!)

    3. If you hit the closest player, explode.


    So for the CreeperCow, let''s take our list of gathered materials plus the list
    of steps, make up some function names, and see what we need to code:


    CreeperCow (the main plugin class):


    +   - listOfCows: A static list of cows''ve created.

    - Math.random(): We need a random number, and the Java docs say this will return
    a double between 0 and 1.

    - spawnCows(): Create some random number of cows, no more than established limit.
    We''ll create a CreeperCowTimer to hold each cow and set its timer.

    - eventListener(): A listener to call spawnCows().


    CreeperCowTimer (one per cow):


    +   - findClosestPlayer(): There might not be.

    - jump(Location loc): Jump means fly up into the air and don''t die on impact.

    - explode(): If we hit a player (or are close enough), explode and tell the plugin
    to remove this cow.


    There''s a lot we haven''t figured out yet, but this gives us to start putting
    some code together. And that will help us figure out the remaining questions.
    And probably raise some new ones. Onward we go.


    +   1. http://docs.oracle.com/javase/7/docs/api/java/lang/Math.html#random%289'
