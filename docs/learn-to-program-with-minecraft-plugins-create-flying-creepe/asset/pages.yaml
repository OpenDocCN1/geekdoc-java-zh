    # Try This Yourself


    For this exercise, you''re going to create a brand-new plugin that uses a listener.


    Create a plugin named FireBow. When you fire an arrow, it will change the arrow
    into a flying, exploding block of TNT. To do this, listen for EntityShootBowEvent
    and spawn a new TNTPrimed entity at the same location as the arrow. Set the TNT
    entity''s velocity to the same as the arrow''s velocity, as well. Don''t forget
    to cancel the arrow event; that way, there will be no arrow—only flying TNT.


    Hint: you can get the arrow from the EntityShootBowEvent event using getProjectile().


