  md: "# Chapter 9. Modify, Spawn, and Listen in Minecraft * 124\n\ntells Java that\
    \ the next function is special. It's part of the function name. Always start off\
    \ an event handler with special declaration.⁴\n\nThe function for the listener\
    \ itself can be named anything you want (shown here as any). But the argument\
    \ list is important: the type of event you list here determines when this function\
    \ will be called, or if it gets called at all.\n\nAn event handler for the EntityTeleportEvent\
    \ would look like this:\n\n```\n@EventHandler\npublic void myTeleportListener(EntityTeleportEvent\
