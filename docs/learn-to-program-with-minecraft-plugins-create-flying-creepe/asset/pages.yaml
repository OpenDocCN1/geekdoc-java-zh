    # Installing Java


    No matter optional packages you may need or want, at a minimum you''ll need Java
    to run your server. You can install it just like we did earlier in the book, but
    bear in mind one important detail: you need the official Oracle (formerly Sun)
    version of Java. The JDK version of Java, which may be available or already installed
    on your system, is known to cause problems with Minecraft.


    You may need to uninstall OpenJDK your system''s package manager. For instance,
    to remove the 1.6 version on a system that uses the Red Hat Package Manager (RPM),
    you''d run this:


    ```

    $ rpm -e java-1.6.0-openjdk

    ```


    Now go get the good Java. You''ll have to download the installation program on
    your local computer, then scop it to your server.


    On your local machine, point your browser to http://www.java.com/en/download/manual.jsp
    and scroll down to the Linux section. Download the regular or 64-bit version (depending
    on your server) and follow the instructions for your flavor of Linux.


    You''ll need to set up your minecraft script and JARS on the server just as we
    did locally back in Chapter 2, Add an Editor and Java, on page 15.


    # Running Remotely


    There''s slight hitch with running a script like start_minecraft when you''re
    logged in via ssh. As soon as you log out, the script will be killed. That''s
    not very helpful in a server environment.


