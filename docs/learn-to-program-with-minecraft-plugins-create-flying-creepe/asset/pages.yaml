    is a hash with Player keys and Stack values.


    Finally, we get down to the onCommand. When we get a back command, we''ll get
    the player''s list of teleport locations (if there is one), and peek at the location
    on the top of the stack, saving that in loc for now.


    Maybe we teleported to this spot and haven''t moved yet. In that case, we''d want
    to go to the previous spot—not stay at this location. So we''ll test for that:
    if we''re still at the same location as the last teleport (or close to it), we''ll
    remove that location from the loc list by using the pop, and set loc to the new
    location in the stack.


    Either way, we''ve got a loc pointing to the spot that we want to teleport to.
    We''ll add the player to the isTeleporting list and teleport the player to the
    new location.'
