  md: 'So here are our questions:


    +   * What goes where? What functions and classes do you need?

    * Why do you need this function (or class)? What is it responsible for?

    * Who else needs to know about this function or class (if anyone)?


    One way of attacking this, especially on complicated plugins, is by using good
    old-fashioned index cards. (These are called CRC cards, where CRC is short for
    "class-responsibility-collaborators," invented by our friends Ward Cunningham
    and Kent Beck.) Divide each card into three parts: a title up top, a list of things
    it is responsible for on the left, and other classes it needs to work with the
    right.


    Our main plugin class, so far, would look like this:


    ![](img/7a2de3c40dffff9892138df9fcd9587a_204_0.png)


    Then there''s the CreeperCowTimer, which will hold a cow and take care of the
    things attacking cow needs to do:


    ![](img/7a2de3c40dffff9892138df9fcd9587a_204_1.png)


    Notice we haven''t gotten into any detail of particular functions yet: you to
    get a firm idea in your head of why a particular class needs to exist. What is
    it responsible for doing?


    Then for each responsibility, take a stab at working out what it needs to do.
    So as not to get too hung up on Java syntax and issues (or those of any other'
