  md: '![](img/7a2de3c40dffff9892138df9fcd9587a_81_0.png)


    Figure 4—Zoom in and out, from atoms to galaxies.


    For example, a Cow object in Minecraft has a lot of functions you can call.

    Here are a few of them:


    +   - teleport(Location location)

    - setFireTicks(int ticks)

    - setBaby()

    - setAdult()

    - setBreed(boolean canBreed)


    It also maintains some internal state: some variables to keep track of that individual
