- img_proc: true
  md: 'These are all fine things you can do with a Cow object. But they wouldn''t
    make sense for a player, or an arrow, or a tree. Player objects can''t breed,
    and you can''t turn a Player into a baby, even if the player is acting like one.


    You want to keep cow things in the Cow object, arrow things in the Arrow object,
    and so on. If you don''t, things can get awfully confusing fast, and you might
    end up writing a piece of code that you can no longer understand or work with.
    So this is really just a matter of good hygiene, keeping milk in the milk carton
    in the fridge, and not storing it in the pretzel bag in the closet. You don''t
    want to mix corn chips with potato chips, to continue with this metaphor.


    Keeping separate things in different objects is the easy part.


    The hardest aspect of programming is this problem of dealing with very low-level
    details and very high-level details at the same time. We call these levels of
    abstraction. Let''s face it: when you''re writing code to deal with a player in
    Minecraft, it''s not the actual person playing the game. Somewhere there is an
    actual person, sitting there, sweating, eating chips and listening to loud music.
    Your piece of code is an abstract representation of real-life player; an abstraction
    that includes the data and behavior you need for the game.


    And just in the real world, abstraction can contain parts. So you can choose to
    focus on molecules or planets as you need to—or in software, the molecule objects
    or planet objects. You can zoom in and out to the level you need to be at, and
    with the parts you want.


    Let''s take a closer look at what that means in Minecraft and Java.


    # Combine Data and Instructions into Objects


    Suppose you were to write a game like Minecraft from scratch. You''d want to have
    a bunch of players in the game. Each one would have its own name, inventory, health
    points, and so on, but the structure of each player would be the same.


    That is, every player object would have the same collection of variables (name,
    health, location, and so on) and the same functions that you''d want to run (set
    this player''s health, teleport the player to a new location, that sort of thing).
    That''s where objects come in. You''d create an object in Java to represent each
    player in the system. You''d write code to do things to a player, and that code
    would work no matter which specific player you were using at the time. That''s
    exactly what the Minecraft folks did. Here''s how the magic works.'
