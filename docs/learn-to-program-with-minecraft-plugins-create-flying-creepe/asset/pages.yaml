    # Keep Track of Data with Variables


    Data are facts—things like your age or the color of your bicycle. To work with
    these facts in Java, you hold them in variables. A variable is a holder of data.
    Think of it like a small box you can put things in.


    In Minecraft, we use variables to keep track of things like players in the game,
    a player''s current health and location, and all the other data we need to know.'
