    So as players teleport around, we''ll have a stack of each of their teleport locations,
    stored in a Stack in our playerTeleports variable, which we can get to by using
    the Player object as a key. You can see what this looks like in the following
    figure.


    ![](img/7a2de3c40dffff9892138df9fcd9587a_141_0.png)


