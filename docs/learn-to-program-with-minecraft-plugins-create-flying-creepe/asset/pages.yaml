  md: '> "A handful of boiler plate and about five lines of custom code and suddenly,
    exploding arrows! And that''s where programming has to be learned—in easy, bite-sized
    chunks."


    — Carl Cravens, Linux system architect and Minecraft dad


    # # Learn to Program with Minecraft Plugins


    Write your own Minecraft plugins and watch your code come to life with flaming
    cows, flying creepers, teleportation, and interactivity. You''ll learn how to
    code and build plugins for your own Minecraft servers using Java and Bukkit.


    You''ll manipulate and control elements in the 3D game environment without having
    to write tons of code or learn huge frameworks. You''ll use variables and functions
    to write plugins that react to game events, and schedule tasks that will run later
    in the game. You''ll learn Java programming, backup your code using Git, and set
    up and run your own server. By the end of the book you''ll be able to design and
    code your own plugins from scratch.


    You don''t need programming experience to get started—this book will teach you
    everything you need to know!


    **Andy Hunt** has written and co-written more than a half-dozen previous titles,
    including the classic Pragmatic Programmer, Practices of an Agile Developer, and
    Pragmatic Thinking & Learning, and regularly speaks at conferences on software
    development around the world. He''s used Minecraft to help teach his son programming.


    ![](img/7a2de3c40dffff9892138df9fcd9587a_285_0.png)


    ![](img/7a2de3c40dffff9892138df9fcd9587a_285_1.png)'
