    ```


    You need to look in the Bukkit documentation or the Java documentation to find
    the full package name. We''ll use a lot of the commons in our examples, for Player,
    Server, Location, Entity, and various Java libraries. For your convenience, these
    are all listed in Appendix 7, Common Imports, on page 253.


