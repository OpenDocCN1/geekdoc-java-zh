  md: '# How to Install a Desktop Server


    So you have your great new custom plugins running on the server on your /computer,
    and you want your friends to be able to connect and play along.


    There are two ways to go about that: set up your own personal computer for /your
    friends to access, or set up a permanent server in the cloud. (See how /in the
    next appendix, Appendix 4, How to Install a Cloud Server, on page 229.)


    To use your own computer, remember that it needs to be powered on and /running
    your Minecraft server for that to work. If you''re okay with that idea, /here''s
    what you need to do.


    There are two main issues to address:


    +   - You need a mechanism for your friends to find your machine’s address /on
    the Internet.


    +   - You need to make sure that your Minecraft port, 25565, is open to the /world.


    What’s a Port?

    In this and the next appendix, you''ll see references to network ports and Minecraft
    /ndefault port of 25565. A port is just a number—an agreed-upon number that lets
    /computers communicate over a network. For example, the Web uses port 80.


    There are several ways to go about this. The easiest is to use a piece of software
    /that does all the work for you. You can also take care of all the bits by hand,
    /which is more fun but more work.'
  merge: -1
  pgno: 234
