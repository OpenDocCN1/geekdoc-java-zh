    (a String). When we''re creating a new sign, we''ll stuff its location in the
    hash, using the name the user gave us. When we go to set text on a sign, we''ll
    get the sign''s location back out of the hash using the name.


    # The parseArgs Function


    Since there are a couple of things to check for when the user types in a command,
    we split that out into its own function instead of doing it right in the onCommand.


    Notice we''re using a parameter from onCommand that we haven''t used before: String[]args.
    These are any arguments that the player types in the command in the chat window.
    For example, if I type in


    ```

    /signs

    ```


    that will be passed to onCommand as the commandLabel, and args will be empty (length
    of zero). If I type


    ```

