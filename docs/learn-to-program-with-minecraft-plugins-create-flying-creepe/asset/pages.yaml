  md: '# Swimming in the Deep End • xiii


    short book: program in Java by writing Java instructions (which we call source
    code," or just "code" or the "program") to create plugins for the Minecraft server.
    A plugin is just a piece of code that you add to an existing program.²


    Before we get started plugins, you need to set up a local Minecraft server for
    testing, and install the Java programming language and a couple of other applications.
    We will go over all of it in the first few chapters. Installing stuff isn''t very
    much fun by itself. In fact, it''s boring as dirt. But we''ll try to get through
    the dirt pile as fast as we can.


    In fact, to help you keep track of your progress, a "Your Growing Toolbox" sidebar
    at the end of each chapter shows a progress bar. You''ll start from just plain
    dirt:


    ![](img/7a2de3c40dffff9892138df9fcd9587a_12_0.png)


    And finish up with 100% grass:


    ![](img/7a2de3c40dffff9892138df9fcd9587a_12_1.png)


    Some chapters will go faster than others and some will add more than others, but
    you will keep making progress.


    # Swimming in the Deep End


    Because we''ve got a lot to cover in a small space, I''m going to try to show
    you things first, maybe even use them first, and then explain them in detail a
    little later. Sometimes that can feel like you''ve been thrown into the deep end
    of the pool. When you see something that doesn''t make sense yet, don''t worry
    about it. Just let it wash over you; the explanation will be shortly.


    In many cases, you can use successfully even if you don''t really understand how
    it works. I can turn a desk lamp on and use it without understanding how electricity
    is generated. I could even build my own desk lamp without understanding how to
    build a power-station generator. I just need to know how my part fits in.


    We''ll focus on how your part fits in as much as possible.


    +   Some folks write Minecraft mods, which take place in the graphical client,
    but we won''t cover those here. Mods are mostly concerned with loading new skins;
    the plugin development we''ll do is closer to what professional programmers do
    and actually changes the game mechanics, not just the look.'
