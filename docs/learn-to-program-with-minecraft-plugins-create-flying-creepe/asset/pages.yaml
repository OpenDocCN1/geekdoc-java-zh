  md: '# Move around in File Directories


    Normally when you want to look at files on your computer''s hard drive, you use
    graphical programs like Explorer on Windows or the Finder on Mac. Either way,
    the idea is to show you the files, folders/directories, and applications/pro-grams
    on the computer so you can navigate around and run things.


    We''re doing the same thing here, but in a more powerful way and without graphics.
    If you''re already familiar with doing this, please feel free to skip to the end
    of this chapter for a small treat. Otherwise, read on.


    The collection of files and folders on your computer is called the file system.
    At any point in time a Finder (or Explorer) window on your Desktop or in your
    command shell is sitting in some current directory. On your Desktop you might
    have several folder windows, each looking at a different folder (directory) on
    your disk.


    Each command-line shell window you have works the same way: for each window, there
    is a current directory. Some systems are set up to the current directory in your
    prompt. But you can always find out where you are by typing the command pwd (which
    stands for "print working directory")


    ```

    $ pwd

    /Users/andy/Desktop

    ```


