  md: '# How to Read the Bukkit Documentation


    Many times you''ll need to read the Bukkit documentation directly to find out
    how to do something in the Minecraft world involving a Block, a Player, an Ocelot,
    a Cow, a Creeper, or whatever. You need to find out what classes to use and what
    functions they offer. The Bukkit documentation lists this information for you,
    and we''ll take a quick look here at how to find it.


    # Bukkit JavaDoc Documentation


    The Bukkit JavaDoc documentation is centered on the system''s classes, listed
    within their packages. Here you''ll find the following:


    +   * The package name, which is what you use in the import statement.

    * The class name, which is what you use to declare variables and create objects
    with new.

    * The functions (methods) in the class that you can run with () and parameters.

    * Parent classes or interfaces it uses, which will include additional functions
    you can call.


    Point your browser to the Bukkit documentation, and all the hidden treasures of
    Bukkit are yours!⁵ Ah, but what does all this stuff mean? And where is everything?


    +   1. Chapter 2, Add an Editor and Java, on page 15, and Appendix 7, Common Imports,
    on page 253.

    2. Chapter 4, Plugins Have Variables, Functions, and Keywords, on page 41, and
    Chapter 5, Plugins Have Objects, on page 65.

    3. Chapter 7, Use Piles of Variables: Arrays, on page 87.

    4. Chapter 5, Plugins Have Objects, on page 65.

    5. http://jd.bukkit.org/rb/doxygen/annotated.html'
  merge: -1
