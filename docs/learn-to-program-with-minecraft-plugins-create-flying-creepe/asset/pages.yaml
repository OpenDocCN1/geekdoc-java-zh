  md: '# Schedule to Run Later


    Now back to your main plugin: once you have the task defined over in its own class,
    you can create an object of that class from your main plugin using new, and set
    it up to be run some number of server ticks in the future using runTaskLater().


    ```

    BukkitTask task = new ExampleTask(plugin);

    task.runTaskLater(plugin, 20);

    ```


    plugin should be a variable that''s set to your main plugin. If you''re putting
    this code in a non-static function in your plugin, you can use the Java keyword,
    which means "this plugin object." If you''re putting this code in a static function,
    you need a static variable (like plugin) that has previously been set to the plugin.
    For example, in an object (a method) like onEnable you''d set plugin = this.


    You might want to hang on the task variable, but it''s not necessary. Or without
    it, you''ve created an ExampleTask whose run function will be run 20 ticks from
    now (which is about one second).


    It will run only one time, however, and never again.


    # Schedule to Keep Running


    If you want a task that keep running, then you use a slightly different scheduling
    function, runTaskTimer().


    ```

    BukkitTask task = new ExampleTask(plugin);

    task.runTaskTimer(plugin, long delay, long period);

    ```


    So here you''d pass in a variable that holds your plugin, and two numbers. These
    numbers are declared as long, which is shorthand for a long int, which just means
    it can be a really big number.


    This will run the given task after an initial delay (in server ticks), and will
    wait for a specified period (also in ticks) before running it again. It will run
    forever that way, until it cancels itself (or you can cancel it).


    We could change the previous example to delay for 1 second, then run the ExampleTask
    once each minute:


    ```

    BukkitTask task = new ExampleTask(plugin).runTaskTimer(plugin, 20, 1200);

    ```


    At 20 ticks per second, that''s 1 second for the delay and 60 seconds for the
    period.'
