    Instead, only declare it as int once, then use age = to change the value if needed.


    Now. just because you "labeled the box" age doesn''t mean it really has to hold
    an age. There''s nothing to stop you from putting some other number in that box:


    ```

    int age = 2048;

    ```


    That''s perfectly legal Java code, as 2048 is a perfectly reasonable number. It
    might be okay for the age of a historical relic, but it''s not a realistic age
    for a person. Setting that age for a person would be stupid, but there are no
    laws against stupidity. That means it''s up to you to give variables names that
    make sense. Renaming this variable to something like ageyears might make more
    sense, to avoid problems like the famous crash of the Mars climate orbiter.


    Java does try to keep you from mixing apples and oranges. Although it doesn''t
    know you''re using an int as a "human age." it does know the difference between
    things like an int, a float, a String, and so on. And it won''t let you mix those
    types. If you''ve declared that a variable should hold an integer, you can''t
    store a String in it. This will throw an error:


    ```

    int age = "Old enough to know better"; // Error!

    ```


    We tried to store a string of characters in an int. That won''t work, and Java
    will complain. You can''t go the other way. Here we''re trying to store an integer
    value (42) into a variable declared to hold a string of characters (a String):


    ```

    String answer = 42; // Error!

    ```


    But for common types such as numbers and strings, there are ways you can convert
    them back and forth as needed, if it makes sense. For instance, suppose you read
    a numeric value from something the user typed, and it was given to you as a String
    named str. You can make it an int like this:


    ```

    String str = "1066";

    int value = Integer.parseInt(str);

    // value is now set to 1066 as a number

    ```


