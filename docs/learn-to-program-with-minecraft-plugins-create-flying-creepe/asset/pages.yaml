    > In this chapter we''ll get a little fancier with piles of data and plugin structure,
    and add these abilities to your toolbox:


    * Keep piles of data in hashes

    * Use private to hide your private data, and use public for things other people
    should see and use


    # A Java HashMap


    HashMap is a funny name. The "hash" part refers to how it works internally; it
    really has nothing to do with how you use it.


    But the "map" part is about what you''d think: it maps a key, which can be anything,
    to a value, which can also be anything.


    Other languages might call this a dictionary or an associative array or some kind
    of associative memory. They all mean the same thing. In the simple array we looked
    at, you use an integer as the index. But with a HashMap, you can use any object
    as the key, especially Strings (see Figure 7. A HashMap, on page 102).


    We''ll use this a lot in the plugins. It''s a great way to keep track of players,
    cows that you''ve spawned, or anything else you want. Although it kind of works
    like an array, you don''t use it the same way. Back when we looked at an array
    you learned that you can get and set a value with an index like this:


    ```

    myList[9] = "Andy";

    String who = myList[9];

    ```'
