  md: '# CHAPTER 11


    # Use Configuration Files and Store Game Data


    # Your Toolbox


    Now we''re getting some storage capability to your toolbox, and discover some
    more-advanced Java language features. You''ll add these skills:


    +   - Save and load user-editable configuration data from a local file

    - Save and load your private game data from a local file

    - Build up more-complex code from smaller functions

    - Understand Java file functions

    - Understand Java exceptions and annotations


    Now we''re getting somewhere. From what you''ve learned so far, you can listen
    for events, schedule tasks to run later, keep data around in lists or hashes,
    and let your whole plugin use it as long as the server is up and running. That
    puts you in a good position to build some fun plugins. However, you''re missing
    an important piece: servers don''t run forever.


    Any Minecraft server (including yours) can just stop running. You''ve stopped
    yours of times by now, just to install plugins! Even if you weren''t installing
    new plugins, hardware can crash, or maybe you just closed your laptop. And once
    the server stops running, your plugin will forget everything it used to know.
    All its data is gone.


    So we need to figure out how to save important data on disk somewhere, where we
    can save it often and load it back in when we need to.'
