  md: '# Chapter 12. Keep Your Code Safe • 178


    You can create a new timeline easily using Git''s branch command, branch itself
    will list all the current branches in your project:


    ```

    $ git branch

    * master

    ```


    There''s only one branch by default. It''s named master, and you''re in that timeline.
    Now let''s split the universe into two and make an alternate reality! It''s simple:


    ```

    $ git branch cow-plane

    ```


    And now you''ve created a new timeline. But you''re not in it yet; you''re still
    in master. (Type git branch and you''ll see the star is still next to master.)
    To switch into the other timeline, type this:


    ```

    $ git checkout cow-plane

    ```


    Yes, it''s our good friend git checkout again. Powerful magic. It''s now transported
    you to a different reality. Nothing you do affect the master timeline. You can
    edit files, delete files, add new files, commit changes—everything. And it''s
    all in the cow-plane universe. You can go back to master at any time:


    ```

    $ git checkout master

    ```


    And now you''ll see the world as it was in master''s time, with none of your changes
    from cow-plane. Now you fix problems and release this version of the plugin, without
    any of the work-in-progress bits from your cow-plane timeline.


