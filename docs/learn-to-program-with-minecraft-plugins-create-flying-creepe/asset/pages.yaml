  md: '(In fact, you''re going to add some variables to a piece of code in just a
    minute—a plugin that will build you a house.)


    A variable is is the box that holds data. You can put a label on the box, but
    that''s just a label for your convenience—it doesn''t affect what''s in the box.


    ![](img/7a2de3c40dffff9892138df9fcd9587a_56_0.png)


    Here''s how to use variables. For this example, we''ll make a variable called
    age, and tell Java to set the value of that variable to 15, either in two steps
    or all in one step:


    ```

    int age;

    age = 15;

    ```


    or


    ```

    int age = 15;

    ```


    The important part here is that you''re telling Java the type of the variable
    you want to make—in this case, an integer whole number (no fractional part or
    decimal point), which is abbreviated as int.


    There are lots of types in addition to int, including float and double, which
    hold fractional numbers (with decimal points); String, which holds a sequence
    of characters such as "Hello, World!''; types you can create yourself, such as
    NunChuck or CowBell; and types that Minecraft defines, such as Player and Location.
    Any time you declare a variable in Java, you need to specify the type for that
    variable. Java can''t guess; you need to tell it.


    You can create the variable and assign its value in one step, or create the variable
    first and then assign it later. In either case you can put a new value in that
    variable any time you want.


    This is okay:


    ```

    int age = 15;

    age = 39;

    age = 21;

    ```


    However, you can''t declare it a second time. This won''t work:'
