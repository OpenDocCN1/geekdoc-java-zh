    | Evict...

    | Details |


    When you don''t want your friends connected, just press the power-switch icon
    to turn your network off.


    You''re done.


    # The Harder Way: By Hand


    To set up your computer to be open and findable on the Internet without the help
    of something like LogMeln isn''t magic, but it does take some work. Here are some
    advantages of doing it the “hard way":


    +   * It''s free.

    * You can connect more than five users if you want.

    * You can be available to the whole world, not just your friends.

    * It''s really interesting and useful stuff to learn.


    You''ll need to learn a little bit about networking and how the Internet works.
    I''ll outline the important steps, but you may need to do some additional reading
    on your own. Most importantly, I can''t give you exact step-by-step directions
    because every router (or cable modem, DSL modem, and so on) is different. But
    you can find that information online with help from Google or via informational
    sites like http://portforward.com.


    Let''s look at the steps.


    First, your friends need to find your machine.'
