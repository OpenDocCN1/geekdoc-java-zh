  md: '# # The Joy of Math and 3D Programming


    Rediscover the joy and fascinating weirdness of pure mathematics, or get started
    programming 3D games in JavaScript.


    # ## Good Math


    Mathematics is beautiful—and it can be fun and exciting as well as practical.
    Good Math is your guide to some of the most intriguing topics from two thousand
    years of mathematics: from Egyptian fractions to Turing machines; group symmetry,
    and mechanical computation. If you\u20ve wondered what lay beyond the proofs you\u20
    struggled to complete in high school geometry, or what limits the capabilities
    of the computer on your desk, this is the book for you.


    Mark C. Chu-Carroll

    (282 pages) ISBN: 97819337785338. S34

    http://prag.com/book/memath


    ![](img/7a2de3c40dffff9892138df9fcd9587a_279_0.png)


    # ## 3D Game Programming for Kids


    You know what''s even better than playing games? Creating your own. Even if you''re
    an absolute beginner, this book will teach you how to make your own online games
    with interactive examples. You\ll learn programming using nothing more than a
    browser, and see, cool, 3D results as you type. You\ll learn real-world programming
    skills in a real programming language: JavaScript, the language of the web. You\ll
    be amazed at what you can do as you build interactive worlds and fun games. Appropriate
    for ages 10-99!


    Printed in full color.

    Chris Strom

    (250 pages) ISBN: 9781933778544. 836

    http://prag.com/book/csjava


    ![](img/7a2de3c40dffff9892138df9fcd9587a_279_1.png)'
