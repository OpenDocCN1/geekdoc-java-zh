  md: '# Other books by Andy Hunt


    Time to rewire your brain for better thinking and learning, and then see what
    it takes to be a modern software developer.


    # Pragmatic Thinking and Learning


    Software development happens in your head. Not in an editor, IDE, or design tool.
    You''re well educated on how to work with software and hardware, but what we use—our
    brains? Learning new skills and new technology is critical to your career, and
    it''s all in your head.


    In this book by Andy Hunt, you''ll learn how our brains are wired, and how to
    take advantage of your brain''s architecture. You''ll learn new tricks and tips
    to learn more, faster, and retain more of what you learn.


    You need a pragmatic approach to thinking and learning. You need to Refactor Your
    Weteware.


    Printed in full color.


    Andy Hunt

    (290 pages) ISBN: 9781934356050, 83.95

    http://pragprog.com/book/ahptl


    ![](img/7a2de3c40dffff9892138df9fcd9587a_277_0.png)


    # Practices of an Agile Developer


    Want to be a better developer? This book collects the personal habits, ideas,
    and approaches of agile software developers and presents them in a series of short,
    easy-to-digest tips.


    You''ll learn how to improve your software development process, see what real
    agile practices feel like, avoid the common temptations that kill projects, and
    keep agile practices in balance.


    Venkat Subramanianiam and Andy Hunt

    (208 pages) ISBN: 9780974514086, 82.95

    http://pragprog.com/book/pad


    ![](img/7a2de3c40dffff9892138df9fcd9587a_277_1.png)'
  merge: -1
  pgno: 277
- img_proc: true
  md: '# Mobile Games and Sound


    Build mobile games for Android and iOS devices, and see how to add live sound
    to your apps.


    # Create Mobile Games with Corona


    Develop cross-platform mobile games with Corona using the Lua programming language!
    Corona is experiencing explosive growth among mobile game developers, and this
    book gets you up to speed on how to use this versatile platform. You''ll use the
    Corona SDK to simplify game programming and take a fun, non-non-sense approach
    to write and add must-have gameplay features: menus, sprites, movement, perspective
    and sound effects, levels, loading and saving, and game physics. Along the way,
    you''ll learn how to build common kinds of mobile games from scratch that can
    run on the iPhone, iPad, Kindle Fire, Nook Color, and all other Android smart-phones
    and tablets.


    Printed in full color.


    Silvia Domenech


    (220 pages) ISBN: 9781937785574, 836


    http://pragprog.com/book/sdcorona


    ![](img/7a2de3c40dffff9892138df9fcd9587a_278_0.png)


    # Programming Sound with Pure Data


    Sound gives your native, web, or mobile apps that extra dimension, and it''s essential
    for games. Rather than using canned samples from a sample library, learn how to
    build sounds from the ground up and produce them for web projects using the Pure
    Data programming language. Even better, you''ll be able to integrate dynamic sound
    environments into your apps or games—sound that reacts to the app, instead of
    sounding the same every time. Start your journey as a sound designer, and get
    the power to craft the sound you put into your digital experiences.


    Tony Hillerson


    (196 pages) ISBN: 9781937785666, 836


    http://pragprog.com/book/thsound


    ![](img/7a2de3c40dffff9892138df9fcd9587a_278_1.png)'
