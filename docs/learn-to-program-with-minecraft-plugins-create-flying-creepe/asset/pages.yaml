  md: 'Start Here • xii


    We''ll take a look at setting up your own Minecraft server and sharing and keeping
    cloud-based backups of the code you write, and we''ll take a peek at a few advanced
    coding techniques.


    # Who This Book Is For


    This book is aimed at readers who have no experience programming, but who do have
    some experience playing Minecraft. If you aren''t familiar with Minecraft, there
    are plenty of videos and books to help you get started. I''m guessing you''re
    already pretty adept and enthusiastic about Minecraft, and you want to learn the
    programming engine.


    Readers younger than 8 or 9, or readers of any age who are having trouble understanding
    programming in Java, might want to take a short detour and experiment with a friendlier
    programming language. Scratch and the newer version, Snap! are great little languages
    that help you learn the basic concepts of programming. They show how programming
    elements fit together visually. Once you get the hang of that, then coming back
    to a text-based language like Java can make a lot more sense.


    Otherwise, you just need a modern computer running Windows, Mac OS X, or Linux,
    and we''ll go from there.


    # Getting Started


    Minecraft is designed as a “client-server” application. That means it''s split
    into two parts.


    First, there''s the client, which is the application you run on your desktop or
    laptop computer. The client renders images of the Minecraft world and accepts
    your commands to move and act in the game.


    Second, there''s the server, which keeps track of everything in the game, including
    all the players who are connected, their inventories, what they''ve built, where
    they are, and so on. Most of the time the server is running on some faraway machine
    in another part of the country. But it could be running on your laptop or desktop
    computer as well.


    The client and the server talk to each other over the network, the same way you
    use a web browser to connect to servers and play games or see pictures of cats.


    To add or change functionality in the Minecraft game, you have to add to or change
    the Java program on the server. That''s what you''ll learn to do in this


    +   1. http://scratch.mit.edu, http://snap.berkeley.edu'
