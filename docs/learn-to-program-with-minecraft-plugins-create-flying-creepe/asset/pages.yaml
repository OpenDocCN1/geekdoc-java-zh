    # Try This Yourself


    In the Stuck plugin, we''ve encased a player in the minimum number of blocks needed
    to enclose the player. But from the outside, it makes kind of a weird-looking
    shape.


    So here''s what you need to do: add extra blocks so that the player is encased
    in a solid rectangle, measuring 3 blocks wide, 3 blocks deep, and 4 blocks tall.
    Add the extra blocks to the list of offsets, then recompile and deploy and see
    if you''ve put the extra blocks in the right places. From the outside, it should
    look like a solid, rectangular block.


    # Modify Entities


    Entities, as you might expect, are quite different from blocks. For one thing,
    there are many more kinds of entities, and they have different kinds of abilities
    (and functions for us). With blocks, all you have to do is change the ID and perhaps
    add some additional information, but entities are more complicated.


    To start off, all entities have the capabilities described in org.bukkit.entity.Entity,
    which include the following useful functions:


    +   * getLocation() returns the Location of the entity.


    +   * setVelocity(Vector velocity) sets its velocity.


    +   * teleport(Location location) teleports the entity to a new location. It returns
    true if it was successful, and false otherwise.


    +   * teleport(Entity destination) teleports the entity to the location of the
    destination entity. Way to crash a party.


    Then, depending on the type of the entity, you might have other cool functions
    to play with. Living entities (org.bukkit.entity.LivingEntity), for example, have
    the following functions:


    +   * launchProjectile(Projectile) lets you throw an egg, fire an arrow, toss
    a snowball, or launch other kinds of Projectiles. It returns the launched Projectile.


    +   * getLastDamage() returns the amount of damage (as an int) just inflicted
    on this entity.'
