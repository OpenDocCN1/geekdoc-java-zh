  md: '# Chapter 7. Use Piles of Variables: Arrays * 94


    numGrades will be set to 6. That means that each of the six values will be numbered
    0 to 5. The index of the last element is always length-1 (in this case, 6-1, or
    5).


    Instead of sticking in all the values hard-coded as we did, you could make an
    Array that''s a fixed size, then stuff values into it. Here''s what looks like
    with a list of int values:


    ```

    int[] quizScores = new int[5];nquizScores[0] = 85;

    quizScores[1] = 92;

    quizScores[2] = 63;

    ```


    Getting values out looks just like putting values in, only the other way around.
    Using the code we just looked at, you retrieve the values like this:


    ```

    int myBestQuiz = quizScores[1];nint badDay = quizScores[2];

    ```


    To get all the values, you can use an old-fashioned for loop:


    ```

    for (int i=0; i < 5; i++) {

    me.sendMessage("Quiz score " + i + ": " + quizScores[i]);

    }

    ```


    Remember that Array is a fixed size; if you retrieve a value that''s past the
    end of the array (like quizScores[15]), your plugin will throw an error and crash.
    In this case, since we define the quizScores array to have a size of 5, you can
    safely store and retrieve values at index 0, 1, 2, 3, and 4. That''s why we use
    i < 5 in the middle, instead of i <=.


    It''s a lot safer to use the Array''s length field instead of hard-coding a number
    like "5." So it would be better to write that loop like this:


    ```

    for (int i=0; i < quizScores.length; i++) {

    me.sendMessage("Quiz score " + i + ": " + quizScores[i]);

    }

    ```


    In a little bit we''ll discuss an even better way to loop through all the values
    in an array.


    Let''s do that thing now, but with Minecraft blocks.


