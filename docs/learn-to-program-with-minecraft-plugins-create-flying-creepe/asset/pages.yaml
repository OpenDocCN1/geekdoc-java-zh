  md: '# APPENDIX 4


    # # How to Install a Cloud Server


    You can run a Minecraft server on your own computer, but there are some drawbacks
    to doing that. The biggest one is that your computer needs to be powered on and
    connected to the Internet 24x7. That''s a little difficult on a laptop. Also,
    anything you''re doing personally on the computer may slow down the server and
    all your players—and anything the server is doing will slow down the other programs
    on your computer. So if a lot of folks want to connect to your server and play
    on it, you might prefer to set it up on a remote server in the cloud.


    Setting up a Minecraft server in the cloud is very similar to setting up a server
    locally, with one important difference: you don''t have physical access to the
    computer that''s running your Minecraft server. That means no keyboard, no screen,
    no power switch or reboot button.


    But no worries; know how to use the command line, and that''s all you need.


    We''ll see what this all means and how to work with it in this appendix.


    # ## What Is the Cloud?


    Some say that the "cloud" is really just a big rack of computers in Virginia.
    That''s actually not far from the truth, as Amazon and others maintain large data
    centers in that area, plus in California and many other spots around the world.
    The "cloud" is just a bunch of computers somewhere on the Internet.


    When people talk about computers in the cloud, they mean a computer that is accessed
    only over the Internet, that you might not even know (or care about) the physical
    location of, and that someone else owns and maintains. As you can see, that''s
    a pretty generic and flexible definition. A huge variety of cloud services is
    available, with an equally huge range of pricing, reliability,'
  merge: -1
  pgno: 242
- img_proc: true
  md: 'Appendix 4. How to Install a Cloud Server · 230


    and what you get for your money. There are two major types of services you might
    be interested in:


    +   - Minecraft-specific: The service provider does all the work of maintaining
    and administering the server. The provider will load or provide plugins, possibly
    handle griefers and attacks, and keep the server running. You don''t have to do
    anything. You may be charged by the number of players online at instead of being
    charged for the size of the server.

    - Generic: The service provider supplies a running system and a login, nothing
    else: you have install Java and Bukkit, load and provide plugins, admin the server,
    reboot it if it gets hung up, and so on. You are usually charged based on the
    number of CPUs, the amount of RAM, and possibly the amount of network traffic
    used each month.


    While you want to look at a Minecraft-specific provider, it''s a trade-off between
    ease of use and control. In this case you don''t get much control over the server;
    you might have to ask to get plugins loaded, and the service might load only well-known
    plugins, not your development version.


    Instead, what you probably want is known as a virtual private server, or VPS for
    short. There are tons of VPS providers on the Internet, with different pricing
    plans and packages, located in different countries with different hardware and
    features available. Just Google “VPS providers."


    A VPS looks like an entire computer to you. You can log on and have all the files
    and processor to yourself. In reality, you''re sharing a big piece of hardware
    with a bunch of other people. But everyone sees what looks like a whole computer
    that is all theirs. That means that as an administrator of the system, you can
    install any software you want. You can add user accounts, reboot, and set up your
    own domain name (like example.com or any.prprog.com).


    The good news is that you can work on the remote server using a command-line shell,
    just like we''ve been doing all along, because your remote server is probably
    running Linux.


    # Remote Operating Systems


    Virtually all VPS services offer one operating system for your server: Linux.
    Some providers, such as Microsoft with its own Azure cloud service, can offer
    Windows, and a small number offer Mac OS X. These are rare and relatively expensive.
    The vast majority, including Amazon''s cloud service,


    +   1. http://www.windowsazure.com'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# VPS Features


    While pricing and features can vary a lot for VPS offerings, here are some commonalities
    and things to look for:


    +   - Most VPS systems include a Web-based front end (one named panel) is very
    popular that allows you to reboot the system, add users, and that sort of thing.

    - While a fast computer is always good to have. Minecraft is more sensitive to
    the amount of RAM you have available. You might want a package with as much RAM
    as you can—at least 2 GB (gigabytes), and often 4 or so.

    - As I write this, several good providers have systems available for $20 and $850
    a month. That''s a lot of money for a hobby, but you can help support the server
    by asking for donations from your players. Even a few dollars per can fund your
    server. However, there might be issues with your government''s laws and tax codes
    once you start taking money, so you should check with someone in your area who
    knows about such things before you start.


    Some providers allow unlimited network traffic ("bandwidth”), and others set a
    cap. Just as with many cell-phone plans, if you exceed the bandwidth cap the provider
    will charge you more money.


    Some providers may do the same thing with RAM or disk storage: you''re allowed
    a certain amount, and if you exceed they''ll start charging you extra.


    When comparing plans, just be sure to add up the extra fees that you might have
    to pay.


    offer some "flavor" of Linux, a Unix-like, largely POSIX-compliant operating system.²


    But Linux isn''t just one thing. Linux is really a bundle of the core operating
    system plus all the extras: the windowing system, utilities, programming languages,
    and so on. A particular bundle is known as a distribution, and each one is a little
    bit different in terms of what''s included, what''s included, how you install
    software, and how when it gets updated.


    These are some popular distributions, listed more or less in order of popularity:


    +   - CentOS

    - Ubuntu

    - Fedora

    - Debian

    - Linux Mint


    +   2. POSIX stands for Portable Operating System Interface, a standard for operating
    system compatibility.'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# Appendix 4. How to Install a Cloud Server * 232


    Before you panic over all these different bundles, realize one very important
    and comforting thing: the command-line shell, bash, works the same on each and
    every one of these distributions. All the commands we''ve used in this book, such
    as ls, cp, and cd, all work exactly the same no matter which Linux flavor you
    choose.


    Ubuntu and CentOS seem to be the most common server distributions at the moment.
    Most VPS services will let you choose which distribution you want from a small
    selection of offerings.


    The biggest difference you''ll run into one distribution to another is their package
    management: what tool do you use to install software packages, and what packages
    are included by default.


    # Remote Access


    To log in your remote server''s command-line shell, you need to use a set of programs
    known as SSH (which stands for "secure shell”). ssh is the command you run to
    connect to the server; the server is running sshd (for "ssh daemon"), and that''s
    what you connect to. Your server might already be running an sshd. We''ll get
    to that shortly.


    You can use ssh to connect to a server, and its companion program, scp, to copy
    files to the server (scp works a lot like cp).


    sshd just needs to know the user name and server name or IP address you''re connecting
    to, which you can specify like an email address, using the "@" sign:


    ```

    $ ssh andy@example.com

    Password:

    ```


    Or if you don''t have a name yet, you can connect using the IP address:


    ```

    $ ssh andy@93.184.216.119

    Password:

    ```


    You may have been given an account name to use already, or you may need to make
    one using the web interface from your VPS provider.


    You use the same sort of notation with scp to copy a file. Here we are copying
    a local text file myfile.txt to the server example.com, logging in as andy, and
    copying the file to your home directory (~/).


    ```

    $ scp myfile.txt andy@example.com:~/myfile.txt

    Password:

    ```


    (Again, you could also use the IP, as in andy@93.184.216.119).'
  merge: -1
  pgno: 245
- img_proc: true
  md: '# Remote Access • 223


    Notice that when you use ssh or scp doing anything else, it will ask you for your
    password on the remote machine. Every time. That gets tiresome pretty quickly,
    fortunately there''s a better way to set up your remote login.


    # Set Up SSH Keys


    This setup takes a couple of steps, but they are pretty straightforward. We''ll
    go into the details next, but the overall steps are as follows:


    +   1 Generate a special set of secret keys, including a “public key.”

    2 Copy the public key to the remote machine.

    3 Make sure the public key is secured on the remote machine.


    Once that''s done, you can use ssh and scp without having to supply a password.
    That means you can use ssh and scp from shell scripts—which can be very handy
    when you need to do a bunch of things to the remote machine.


    Here are the steps in detail.


    First off, change your home directory and use ssh-keygen to generate a set of
    RSA-style keys.³


    ```

    $ cd

    ssh-keygen -t rsa

    ```


    When asked for a passphrase, press Enter—don''t input text at this point. That
    command will make a subdirectory named ssh under your home directory. Because
    of the leading dot (". ") you won''t normally see this directory listed with is,
    but is -a will show it:


    ```

    $ ls -a

    ... .profile .ssh (and a bunch of other stuff)

    $ cd .ssh

    ~/.ssh$ ls

    id_rsa id_rsa.pub  known_hosts

    ```


    Your public key is id_rsa.pub, and you''ll need to add that to a file named ~/.ssh/authorized_keys
    on the server.


    To do that, make the .ssh directory on the server first. I''ll show the login
    prompt on the server as Server$ so you can tell which machine I''m on.


    ```

    $ ssh username@example.com

    Password:

    Welcome to My Awesome Minecraft Server

    Last login: Mon Feb 16 12:16:57 from xyzy-plugh

    Server$ mkdir .ssh

    ```


    +   3 RSA is a public-key-style cryptographic system, named for its inventors.'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# Changing Your Prompt


    The environment variable PS1 sets your prompt string for bash. In that string,
    you can use w to print out the current directory. So if you set


    ```

    $ PS1=Server|w$

    ```


    your prompt will come back as


    ```

    Server -$

    ```


    Stick this in your bash startup file to make the change permanent (as we saw in
    Chapter 2, Add an Editor and Java, on page 15).


    Now back on your computer, copy the id_rsa.pub file (or whatever .pub file is
    named) up to the server using scp, putting it in the .ssh directory and renaming
    it authorized_keys:


    ```

    $ scp id_rsa.pub username@example.com:~/.ssh/authorized_keys

    ```


    That will copy the file to your .ssh directory under your home ("~”), and name
    authorized_keys. If you want to later, you can add keys from other machines into
    this file (that''s why "keys" is plural). But for now you just have this one entry.


    Finally, you need to go back on the server and check and fix the file permissions.
    The .ssh directory should be readable and listable only by you, and the files
    inside should be readable by you alone. In most cases, ssh will not work at all
    if the file permissions aren''t restricted. It''s for your own good.


    You can set the file permissions using the chmod command:


    ```

    $ ssh username@example.com

    Welcome to My Awesome Minecraft Server

    Last login: Mon Feb 16 12:26:13 from xyzzy-plugh

    Server$ cd .ssh

    Server ~/.ssh chmod 700

    Server ~/.ssh chmod 600 authorized_keys

    ```


    Now from your your computer, you should be able to ssh or scp without having to
    specify a password:


    ```

    $ ssh username@example.com

    Welcome to My Awesome Minecraft Server

    Last login: Mon Feb 16 12:32:07 from xyzzy-plugh

    Server$

    ```


    And we''re in!'
