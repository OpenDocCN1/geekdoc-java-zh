    ```


    The leading slash makes the difference. Earlier, when you typed cd src, the cd
    command looked for src under the current directory. But if instead you typed cd
    /src it would look for a directory src under a directory named "/—we call the
    root.


    Root is the topmost directory on your system. It''s your code, above your Desktop,
    above everything. Somewhere under root are your home directory and Desktop. In
    my case, that''s /Users/andy/Desktop. I could get there by the slow way by typing
    this sequence of commands:


