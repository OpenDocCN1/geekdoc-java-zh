  md: '# Chapter 11. Use Configuration Files and Store Game Data * 156


    start with a list of all the players we saved in the hash, and then check to see
    if they are online, but it''s probably easier this way. In either case, there
    may have players that were online before and aren''t now, or vice versa.


    Now if there''s an error saving the file, we''ll log an error message but continue
    with our business. If there''s an error reading the file, PerMap assumes that
    simply isn''t one, and we start off with a fresh, empty hash. You may want to
    treat errors differently; we''ll talk more about this at the end of the chapter
    when we look at PerMap''s innards in more detail.


    Note that we''re not saving Player objects or Location objects. Instead, we''re
    storing player names (plain old String) and coordinates (Java double) of their
    Locations. When we are ready to teleport a player, we make a new Location object
    based on the coordinates we saved.


    # One Java Package


    PerMap is a general-purpose, reusable bit of code. You could use it from several
    different plugins.


    Normally you''d put something general like PerMap in a different package, and
    name the package "com.myname.utils" or similar. You''d import PerMap from all
    your plugins that you use.


    However, because we want a plugin to be self-contained, it''s easier to deploy
    by including the PerMap source code right here in our package. That way, when
    it''s installed there is no confusion as to where an extra package might be located:
    everything is in the one package we''re installing.


    Bukkit does have a mechanism to load multiple plugins and specify that one plugin
    depends on another plugin being loaded first, but we won''t be working with that
    here.


    Compile and install LocationSnapshot and give it a try. Connect from your client
    and run the /savelocations command. After you''ve saved locations, go into your
    server''s directory and take a look:


    ```

    $ cd plugins/

    $ ls

    LocationSnapshot LocationSnapshot.jar

    $ cd LocationSnapshot

    $ ls

    locations.dat

    ```


    And there''s your data file. It''s a binary file, so there''s not much we can
    do from here except marvel that it was created.'
