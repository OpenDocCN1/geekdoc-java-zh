    \ that gives us the displacement between the cow and its target. That's too large\
    \ a number for a velocity, so we multiply it by a convenient number (0.1) that\
    \ I found by experimenting. Finally we set as the cow's velocity, which will make\
    \ it jump along Vector at that speed.\n\n```\npublic class CreeperCowTimer implements\
    \ Listener {\n\nimport org.bukkit.event.Listener;\nimport org.bukkit.entity.Cow;\n\
