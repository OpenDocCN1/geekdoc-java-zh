    # Listen for Events


    Now we get to the best part. You know how to write code for commands the user
    types in and you know how to do things to affect the world. Now it''s time to
    see how to monitor what''s going on in the world so you can respond to gameplay
    automatically, without typing in a command or anything.


    It works like this: you set up your code that your functions get called when some
    interesting event happens. In your function, you can let the events happen or
    you can stop them.


    We''ll start off by listening for events right in our main plugin. In the next
    chapter we''ll look at how to split that off into its own separate class and source
    code file.


