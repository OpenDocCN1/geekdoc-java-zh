  md: 'This usually means the package name and plugin name specified in your plugin.yml
    file don''t match the package name and class name in the code. Check your spelling.
    Remember that the package name is customarily all lowercase, and that the class
    name is mixed uppercase and lowercase.


    # Minecraft Console: Unknown Command


    If the plugin compiles okay but Minecraft gives you the “Unknown command” error,
    be sure to check your plugin.yml file to make sure the command is there and spelled
    correctly. Also check in your onCommand() function to make sure you''ve spelled
