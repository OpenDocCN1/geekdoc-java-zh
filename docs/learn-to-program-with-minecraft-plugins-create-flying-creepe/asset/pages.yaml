  md: 'The Harder Way: By Hand • 222


    Now tell your friends to download the same software and join your network with
    the name you picked (like andys_minecraft_server).


    They can join your network. When they right-click on your network name, they should
    select Copy IPv4 Address and use that in the Minecraft client to connect to you.


