  md: '# Chapter 13. Design Your Own Plugin · 202


    Ah, right. The cow died. We ran into that same problem back in the CowShooter
    plugin—we have to set the cow''s health to the max using something like this:

    `ncow.setHealth(cow.getMaxHealth());`


    But where should we do it? And what else do we need to finish up this plugin?

    The current version is working but has a problem. Do a git commit to save the
    current state of the code at this point before we start making more major changes.


    # Knit It All Together


    We need to add a few things from our list of materials and take care of a couple
    of problems.


    First off, we need to fix the dying cows, so let''s add an event handler to listen
    for EntityDamageEvent, and cancel the event if its cause is DamageCause.FALL.


    When testing the spawn function and the jump, we used ourselves as the target.
    We need to do a little better than that, so we''ll need to add a getClosest-Player()
    to find the closest player to any given


    And as we said earlier, we need to pick an event to spawn these creeper cows.
    There are probably a couple of ways to do that. You don''t want to spawn cows
    all over the world; it would be great if there were some kind of event that gets
    sent when each chunk of the world gets loaded into the server.


    A quick look through the Bukkit documentation for events org.bukkit.event.world
    reveals just what we need: a ChunkLoadEvent when part of the world is loaded,
    and a ChunkUnloadEvent when it''s deleted. Each time a 16x16 chunk of the world
    gets loaded, we''ll get an event. One minor thing: the chunk tells us where it
    is in a grid of chunks, you have to multiply by 16 to get a real-coordinate.


    Our-do list now includes these items:


    +   * Add an EntityDamageEvent event handler so the cow doesn''t die.

    * Add GetClosestPlayer so each cow can find a nearby target.

    * Add ChunkLoadEvent to spawn cows in a 16×16 area.

    * Add the ChunkUnloadEvent to remove cows from that chunk.

    * Set up a task timer so each cow can find a target, jump, and explode if needed.

    * Manage the cowList in all these functions (add to it on spawn, delete it on
    death or unload).'
