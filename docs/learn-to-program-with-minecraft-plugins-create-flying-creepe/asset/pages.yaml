  md: '# Chapter 11. Use Configuration Files and Store Game Data · 152


    There are two main ways to go about this. One is to use a data file just like
    a config file but manage it ourselves, and that''s what we''ll do here. The other
    method is to use a full-fledged SQL database like SQLite orMySQL, but that''s
    a lot more complicated than we have space to cover here. If you''re dealing with
    hundreds of users, file-based techniques here will work fine. If you''re dealing
    with millions of users on a large server, you''ll need to look into the SQL techniques.


    So the first question that comes up where we should write our data files for a
    plugin. Well, as you just saw, that use a config file already have a directory
    where we can read and write files ourselves.


    That makes it easier for us. Now all we need to do open and read in a file in
    the plugins/plugin-name directory.


    The plugin''s getDataFolder() function tells us the location of directory so we
    can stay nice and tidy. getDataFolder() returns a File object, and what we really
    want is a string of that file''s path name. getDataFolder().getAbsolutePath()
    will give us that.


    It''s polite to store and not spray files over the server''s disk. It''s also
    customary to make the file name with a .dat suffix to indicate that it is data.
    So we''ll end up making a file named something like -~/Desktop/server/plugins/MyPluginName/MyPluginName.dat
    for our data.


    File reading and writing is a bit of a pain in Java. There''s the problem of converting
    your variables into something writable, and then converting the file''s data and
    structure back into Java variables. To top off, the Java I/O (input/output) functions
    for reading and writing can be messy all by themselves. You could end up writing
    a lot of code to handle that.


    So what can we do to make a little easier? What if we started with a HashMap and
    stored everything we wanted in there, and saved that one hash (which contains
    a whole mess) out to a file? Then all you''ll need is a bit of code to load and
    save a HashMap to a file.


    I''ve written a class named PermMap that will do that for you. We''ll take a quick
    fly-over at the very end of this chapter to see how it works on the inside, and
    look at some more-advanced Java while.


    +   2. There''s an official tutorial at http://docs.oracle.com/javase/tutorial/jdbc/basics/processingstatements.html
    as well as some information on the Bukkit forums at https://forums.bukkit.org.
    But It''s a much more advanced and confusing topic, even for professionals.'
