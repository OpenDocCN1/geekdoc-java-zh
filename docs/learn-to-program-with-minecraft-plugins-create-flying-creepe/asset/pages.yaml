  md: "# Make a Runnable Task\n\nHere's the simplest code for a task that just sends\
    \ a broadcast message. It\\may not do much, but you can use this piece of code\
    \ as a starting template\nmaking your own tasks.\n\nJust add the code you want\
    \ down in the body of the run function, change the\npackage name, and add any\
    \ imports you may need. (Remember, the common\names are listed in Appendix 7,\
    \ Common Imports, on page 253, and you can find\nothers in the Bukkit or Java\
    \ docs.)\n\n```\npackage examplepackage;\nimport org.bukkit.Bukkit;\nimport org.bukkit.plugin.java.JavaPlugin;\n\
    import org.bukkit.scheduler.BukkitRunnable;\n\npublic class ExampleTask extends\
    \ BukkitRunnable {\n    private final JavaPlugin plugin;\n\n    public ExampleTask(JavaPlugin\
    \ plugin) {\n        this.plugin = plugin;\n        // you can keep a reference\
    \ to your plugin as I've done here,\n        // or to any other variable you pass\
    \ in\n    }\n\n    public void run() {\n        // Do something interesting...\n\
    \        plugin.getServer().broadcast(\"Surprise!\");\n    }\n}\n```\n\nIn this\
    \ case, you'd put this code in its own file, which must be named Example-\nTask.java\
    \ (to match the name on the line at ①).\n\nSo far good, but what's up with this\
    \ interesting-looking function that has\nno return and is named ExampleTask—the\
    \ exact same name as our class?\nRemember, that's called a constructor. That's\
    \ the function Java calls when\nIt's creating a new ExampleTask.\n\nSo to create\
    \ an ExampleTask, you have to pass in a JavaPlugin to the new (which\ngets passed\
    \ to your constructor). In other words, you have to give it your main\nplugin\
    \ object. That way this task can get at all the Bukkit things it might\nto need,\
    \ like the world, players, and so on.\n\nNow that you have a task that will do\
    \ something interesting (well, sort of),\nhow do you schedule it?"
