  md: '# Making Objects


    You can also make a new location from scratch:


    ```

    double x, y, z;

    x = 10;

    y = 0;

    z = 0;

    Location whereNow = new Location (fred.getNow(), x, y, z);

    ```


    Or do it in one step:


    ```

    Location whereNow = new Location (fred.getWorld(), 10, 0, 19);

    ```


    And that''s how to make a new object in Java: by using the new keyword.

    When you use new to create an object, Java will create the object for you and
    run its constructor: a function that''s named the same as the class (for instance,
    public Location()). The constructor gives you the chance to set up anything in
    the object that needs setting. It doesn''t return anything and isn''t declared
    with a return type; Java automatically returns the new object after you''ve done
    your setup.


    We''ll discuss how to make our own object definitions later in the book, but for
    now we''ll use Minecraft has given us plus our plugin skeleton.


    And now armed with a location, you can whisk Fred away:


    ```

    boolean ok = fred.teleport(whereNow);

    ```


    If the teleport worked as expected, the variable ok will be set to true, and Fred
    will find himselfself...suffocating in bedrock (because y is zero). Ouch.


