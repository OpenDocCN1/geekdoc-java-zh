    # Plugin: BackCmd with Save


    Using the same ideas as with LocationSnapshot, you''re going to add data storage
    to the BackCmd plugin so that you can save the locations across server restarts.
    I''ll provide the outline and function signatures, but you will be writing the
    bodies of the functions, the actual code to make it work. Buckle up!


    Now, the BackCmd plugin is a little more complicated than our simple Location-Snapshot.
    As you may remember from the plugin on page 125, the BackCmd plugin tracks more
    than just a location per player; it tracks a Stack of Location objects for each
    player.


    Instead of converting a Location to double coordinates and back, you''ll need
    to convert a Stack of Location objects to double coordinates and back. That''s
    more than just a line or two of code; you''ll need to iterate through each stack
    and build a new stack with the converted types, and I suppose you''ll need something
    that looks like a Location that you can safely save to disk. and while we''re
    at it, you might want to handle Locations in different Worlds, some-thing didn''t
    account for in LocationSnapshot.


    To recap, here''s your to-do list for the code you''re going to write:


    +   - Create an object like a Location that you can save to disk. Let''s name
    it SavedLocation.


    +   - Write a conversion function that takes a Location and makes a SavedLocation
    object.


    +   - Write the other conversion function that takes a SavedLocation and makes
    a Location.


    +   - Write a function to convert a Stack of Location objects to a Stack of SavedLocation
    objects.


    +   - Write a function to convert a Stack of SavedLocation objects to a Stack
    of Location objects.


    Don''t be shy about adding log messages to help trace what the plugin is doing.


    Okay, you have your hands full. I''ll get you started.'
