  md: '# 6 Application Architecture


    Web application systems, like any other complex engineering artifacts, need an
    architecture that helps master their complexity by breaking them down into smaller
    parts with manageable inter-dependencies. Software application architecture is
    concerned with the following issues:


    +   1. The state structure of the application system to be designed is defined
    in the form of information models describing their information architecture.

    2. The goal of a code base architecture is to structure and partition the overall
    program code of an application in such a way that the fundamental software quality
    of maintainability is achieved.

    3. The distribution of the application system''s runtime components within a computer
    network is defined by a deployment architecture. A web app is distributed on the
    Web, which is a world-wide client-server network system with HTTP-based communication.


    In all cases of designing a complex system, no matter if a new building, a new
    space shuttle, a new computer or a software application is to be designed, an
    architecture provides a kind of master plan for defining the structure of the
    system. Any good architecture is based on the following three principles:


    +   1. separation of concerns, which helps managing complexity by breaking a system
    down into smaller, functionally defined parts such that their

    2. interdependencies are minimized,

    3. keeping the more fundamental parts independent of the less fundamental parts
    (the onion principle).


    Complying with these principles makes it easier to develop, or source, or update
    certain system parts independently of others.


    The three most important parts of the code base of an app are:


    +   1. the model, which implements the app''s data model in the form of model
    classes, defining suitable data structures and constraints;

    2. the data storage management procedures (typically, but not necessarily, an
    SQL database system) which set up a connection to a storage system and for storing
    and retrieving persistent data;

    3. the user interface (UI) code, taking care of both information provision (output)
    to the user, e.g., on the computer screen, and user input provided by user actions
    in the form of UI events, e.g., keyboard or mouse events, such that all required
    user interactions are supported.


    The onion principle requires to keep the app''s model classes independent of the
    UI code it should be possible to re-use the same model classes with different
    UI technologies.'
