  md: "# 10.3 Enumerations in Computational Languages 189\n\n```\n<xs:enumeration\
    \ value=\"OTHER\"/>\n<xs:restriction>\n<xs:simpleType>\n```\n\n# 10.3.3 Enumerations\
    \ in JavaScript\n\nIn JavaScript, we can define an enumeration as a special JS\
    \ object having a property for each enumeration literal such that the property's\
    \ name is the enumeration literal's name (the enumeration label or in upper case)\
    \ and its value is the corresponding index. One approach for implementing this\
    \ is using the `Object.defineProperties` method:\n\nThis definition allows using\
    \ the enumeration `BookCategoryEL.NOVEL`, `BookCategoryEL.BIOGRAPHY` etc., standing\
    \ for the enumeration indices 1, 2, 3 and 4, in program statements. Notice how\
    \ this definition takes the requirement that enumeration literals like `BookCategoryEL.NOVEL`\
    \ are constants, the value of which cannot be changed during program execution.\
    \ This is achieved with the help of the property descriptor `writable: false`\
    \ in the `Object.defineProperties` method.\n\nWe can also use a more generic approach\
    \ and define a meta-class `Enumeration` in the form of special JS objects:\n\n\
    ```\nfunction Enumeration (enumLabels) {\n  var i=0, LBL=\"\";n  this.MAX = enumLabels.length;\n\
    \  this.labels = enumLabels;\n  // generate the enum literals as capitalized keys/properties\n\
    \  for (i=1; i <= enumLabels.length; i++) {\n    LBL = enumLabels[i-1].toUpperCase();\n\
    \    this[LBL] = i;\n  }\n  // prevent any runtime change to the enumeration\n\
    \  Object.freeze(this);\n}\n```"
