    ExistsException {

    Book book = new Book(isbn, title, year);

    em.persist(book);

    ut.commit();

    }

    ```


    The method may throw a number of exceptions when trying to run the persist or
    the commit method. One of the exceptions (i.e. EntityExistsException) is thrown
    by the ut.commit. The method which calls Book.create may catch this exception
    and perform specific actions, such as rolling back the transaction. In our case,
    the Book.create is called by the create action and the action performed is to
    show the exception stack trace in the Controller class, and the console, as well
    as calling the ut.rollback which takes care of cancelling any database change
    performed by the current transaction. The rest of the exceptions are caught by
    their super class (i.e. Exception) and the exception stack trace is displayed
    in the console.


