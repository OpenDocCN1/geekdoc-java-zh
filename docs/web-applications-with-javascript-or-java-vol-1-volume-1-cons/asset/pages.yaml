    # 13.6.1 Records


    Records are composite data values consisting of field slots, which are name-value
    pairs, which we can access the value of a record field by its name.


    Examples of records address records like {street: "37 Market St", city:"New York",
    zipCode: 10473} or phone book entries like {type:"home", areaCode:"757" number:"3765295"}.


    # 13.6.1.1 Color definitions


    Colors can be defined with three components on the basis of a color model such
    as the Red-Green-Blue (RGB) color model or the Hue-Saturation-Lightness (HSL)
    color model. In models a fourth component, in the form of a decimal number from
    the unit interval [0,1] or a corresponding percentage, for defining the opacity
    (technically called alpha channel) of color can be added.


    In the RGB model, each component is an integer between 0 and 255. In CSS, an RGB
    color is specified by a ternary term like rgb(255, 255, 255) corresponding, e.g.,
    by a JS triple like {R:255, G:255, B:255}.


    In the HSL model, the H component is an integer between 0 and 360 denoting an
    angle in the rainbow color with red with 0 = 360, green = 120, and blue = 240.
    Saturation and lightness are represented as percentages, that S=100% is full saturation,
    and 0% is a shade of grey, L=100% is white, 0% lightness is black, and 50% lightness
    is "normal". In CSS, an HSL color is specified by a ternary term like hsl(0, 0%,
    100%) corresponding, e.g., by a JS triple like {H:0, S:0, L:100}.'
