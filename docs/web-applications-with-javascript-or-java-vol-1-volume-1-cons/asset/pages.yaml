  md: '# 1.2 HTML and XML


    of the form prefix:name, such as svg:circle as a namespace-qualified name for
    SVG circle elements.


    A default namespace is declared in the start tag of an element in the following:


    ```

    <html xmlns="http://www.w3.org/1999/xhtml">

    ```


    This example shows the start tag of the HTML root element, in which the XHTML
    namespace is declared as the default namespace.


    The following example shows an SVG namespace declaration for an svg element embedded
    in an HTML document:


    ```

    <html xmlns="http://www.w3.org/1999/xhtml">

    <head>

    </head>

    <body>

    <figure>

    <figcaption>Figure 1: A blue circle</figcaption>

    <svg xmlns:svg="http://www.w3.org/2000/svg">

    <svg:circle cx="100" cy="100" r="50" fill="blue"/>

    </svg>

    </figure>

    </body>

    </html>

    ```


    # 1.2.4 Correct XML documents


    XML defines two syntactic correctness criteria. An XML document must be well-formed,
    and if it is based on a grammar (or schema), then it must also be valid with respect
    to that grammar, or in other words, satisfy all rules of the grammar.


    An XML document is called well-formed, if it satisfies the following syntactic
    criteria:


    +   There must be exactly one root element.

    Each element has a start tag and an end tag; however, empty elements can be closed
    as <phone/> instead of <phone></phone>.

