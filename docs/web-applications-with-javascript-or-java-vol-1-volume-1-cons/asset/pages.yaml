  md: '# 3.10.6 Synchronizing views with the model


    When an app is used by more than one user at the same time, we have to take care
    of somehow synchronizing the possibly concurrent read/write actions of users such
    that users have always current data in “views” and are prevented from interfering
    with each other. This is a very difficult problem, which is attacked in ways by
    different approaches. It has been mainly investigated for multi-user-data management
    systems and large enterprise applications built on top of them.


    The original MVC proposal included a data binding mechanism for automated one-way
    model-to-view synchronization (updating the model’s views whenever a change in
    the data occurs). We didn''t take care of this in our minimal be-cause a front-end
    app with local storage doesn''t really have multiple concurrent users. However,
    we can create a (rather artificial) situation that illustrates the issue:


    +   1. Open the UI page of the minimal app twice (for instance, by `dateLearningUnit.html`
    twice), so that you two browsers rendering the same page.


    +   2. Select the same learning unit on both tabs, so that you see your data in
    the `date view`.


    +   3. Change one item of this learning unit on one of the tabs and save your
    change.


    +   4. When you now go to the other tab, you still see the old data value, while
    you may have expected that it would have been automatically updated.


    A mechanism for automatically updating all views of a model object whenever a
    change in its property values occurs is provided by the `observer pattern` that
    treats any view as an observer of its model object. Applying the observer pattern
    requires that (1) model objects can have a multi-valued reference property like
    `observers`, which holds a set of references to view objects; (2) a `notify` method
    can be invoked on view objects by the model object whenever one of its property
    values is changed; and (3) the `notify` method defined for view objects takes
    care of refreshing the user interface.


    Notice, however, that the general model-view synchronization problem is not really
    solved by automatically updating all (other users'') views of a model object whenever
    a change in its data occurs. Because this would only help, if the users of these
    views didn''t make themselves any change of the data item concerned, meanwhile.
    Otherwise, their changed data value would be overwritten by the automated refresh,
    and they may not even notice this, which is not acceptable in terms of usability.'
