  md: '# 13.2.1 Telephone numbers


    There is much variation in the format of phone numbers across different countries.
    Consequently, it doesn''t make sense trying to capture all these different formatting
    options with one pattern. The HTML5 specification doesn''t define any syntax rules
    for phone numbers in the context of input elements of type `tel`, except that
    they can''t include line breaks. The precise formatting assumptions and corresponding
    validation is left to the application developer who may employ a specific pattern
    for enforcing a particular national or international phone number format.


    A simple international phone number format has been defined by the International
    Union''s ITU-T E123. It requires that phone numbers include a leading sign and
    allows only spaces to separate groups of digits. ITU also has the limited length
    of phone numbers in contain seven to most 15 digits. Since the shortest international
    phone number in contain seven digits, we can use these two constraints in the
    following JavaScript definition of a regular expression for international phone
    numbers:


    ```

    var itPhoneNumberPattern = /+(?:[0-9] ?){6,14}[0-9]$$/

    ```


    # 13.2.2 Email addresses


    The format of email addresses has originally been defined by the International
    Engineering Task Force (IETF), but due to several weaknesses it has been redefined
    in the HTML5 specification in the context of introducing input elements of type
    `email`. The HTML5 specification provides a regular expression for email addresses³,
    which can be used for validating strings that are supposed to be email addresses.


    # 13.2.3 URLs


    The format of URLs has originally been defined by the International Engineering
    Task Force (IETF), but due to several weaknesses and the historical confusion
    about URLs versus URNIs, it has been redefined in the URL specification* of the
    WHAT Working Group. The syntax rules in this specification also define the value
    of URL strings in input `url` introduced by HTML5.


    There are many proposals* how to capture the complex URL parsing rules with a
    regular expression, but most of them are either too strict or too lax. The solution
    by


    +   5 https://developers.whatwg.org/states-of-the-type-attribute.html#e-mail-state-(type=email)

    6 https://url.spec.whatwg.org

    7 https://mathiasbynsens.de/demo/url-regex'
