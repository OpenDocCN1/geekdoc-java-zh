  md: 'Notice that the h namespace must be defined once again in footer.xhtml if it
    has already been defined in page.xhtml. In the footer template component, we define
    the “Back to main menu” operation, which is going to be injected into each page
    that uses this template. The main region is dynamic, and will be replaced with
    the content generated by a facetlet template.


    JSF is using the following namespaces:

    ui="http://java.sun.com/jsf/facelets" for the JSF Facelets Tag Library providing
    templating elements (like ui:insert for specifying the region of a template where
    to inject the facetlet content).


    xmlns="http://java.sun.com/jsf/html" for the JSF HTML Tag Library providing JSF
    versions of HTML elements, which are mapped to HTML elements. For example h:inputText,
    which is mapped to an HTML input element.


    xmlns="http://java.sun.com/jsf/core" for the JSF Core Tag Library providing custom
    actions that are independent of any particular render. For example, f:actionListener
    can be used to define a Java method executed when the user clicks a button.


    xmlns="http://xmlns.jcp.org/jsf/passthrough" using HTML attributes in JSF elements
    and passing them through the generated HTML. For example, with p:type in,<h:inputText
    p:type="number"> <input type attribute can be created in the generated HTML: <input
    type="number">


    xmlns="http://java.sun.com/jsf/jstl" for the JSTL Core Tag Library providing all
    kinds of features, dealing with loops and defining variables. For example, we
    can use <c:set var="isbn" value="#{book.isbn}/> to create a variable isbn which
    can be used in the view code for conditional expressions.


    xmlns="http://java.sun.com/jsf/jstl/functions" for the JSTL Functions Library
    providing utility functions, as string convert-ters. For example, we can use fn:toUpperCase
    to convert a string to its upper-case.


