  md: '# 2.1.3 Strict Mode


    Starting from ES5, we can use strict mode for getting more runtime (ordinary)
    error checking. For instance, in strict mode, all variables must be declared.
    An assignment to an un-declared variable throws an exception.


    We can turn strict mode by typing the following statement as the first line in
    a JavaScript file or inside a <script> element:


    ```

    ''use strict'';

    ```


    It is generally recommended that you use strict mode, except your code depends
    on libraries that are incompatible with strict mode.


    # 2.1.4 Different kinds of objects


    JS objects are different from classical OO/UML objects. In particular, they need
    not instantiate a class. And they can have their own (instance-level) methods
    in the form of slots, slots that do not only have property slots, but also method
    slots. In addition they may also have key-value slots. So, they may have different
    kinds of slots, while classical objects (called "instance specifications") in
    UML have only property slots.


    +   1.1.1. A JS object is essentially a set of name-pairs, also called slots,
    where names can be property names, function names or keys of a map. Objects can
    be created in an ad-hoc manner, using JavaScript''s object literal notation (JSON),
    without instantiating a class:


    ```

    var personi = { lastName:"Smith", firstName:"Tcm" };

    ```


    An empty object with slots is created in the following way:


    ```

    var ol = Object.create(null);

    ```


    Whenever the name in a slot is an admissible JavaScript identifier¹⁰, the slot
    may be either a property slot, a method slot or a key-value slot. Otherwise, if
    the name is some other type of string (in particular when it contains any blank
    space), then the slot represents a key-value slot, which is a map element, as
    explained below.


    The name in a property slot may denote either


    +   a. a data-valued property, in which case the value is a data value or, more
    generally, a data-valued expression;'
