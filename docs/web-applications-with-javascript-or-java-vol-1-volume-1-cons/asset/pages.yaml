  md: '# 8.9.2 Configuring the UI for preventing invalid user input


    Some of the new HTML5 input field types (like number, date or color) are intended
    to allow web browsers rendering corresponding input elements in the form of UI
    widgets (like date or color pickers) that limit the user''s input options such
    that only valid input is possible. In terms of usability, it''s preferable to
    prevent users from entering invalid data instead of allowing to enter it and only
    then checking its validity and reporting errors. Unfortunately, and this is quite
    disappointing, many browsers do, in 2017, still not have reasonable widget implementations
    for these HTML5 input field types yet.


    # 8.10 Practice Projects


    For the following projects, you have to take care of


    +   1. adding, for every property, a check function that validates the constraints
    defined for the property, and a setter that invokes the check function and is
    to used for setting the value of the property,

    2. performing validation before any data is saved using the add and update methods.


    in the model code of your app, in the user interface ("view") code you have to
    take care of


    +   1. styling the user interface with CSS rules (for instance, integrating a
    library by Yahoo''s Pure CSS),

    2. validation on user input for providing immediate feedback to the user,

    3. validation on form submission for preventing the submission of invalid data.


    Make sure that your pages comply with the XML syntax of HTML5 by means of XHTML
