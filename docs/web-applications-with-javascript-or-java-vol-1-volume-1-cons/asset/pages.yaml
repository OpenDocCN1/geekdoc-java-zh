    # 4.3.7 Clearing all data


    The following procedure clears our database by deleting all rows:


    ```

    public static void clearData(EntityManager em,

    UserTransaction ut) throws Exception {

    ut.begin();

    Query deleteStatement = em.createQuery("DELETE FROM Book");

    deleteStatement.executeUpdate();

    ut.commit();


    }

    ```


    JPA does not provide a direct method to delete the entire population of a specific
    class from the database. However, this can be easily achieved by using a JPQL
    statement as shown in the above code. The JPQL code can be read as: delete all
    rows from the database table associated with the entity class Book.


