  md: "# 8.8 Possible Variations and Extensions\n\n# 8.8 Possible Variations and Extensions\n\
    \n# 8.8.1 Adding an object-level validation function\n\nWhen object-level validation\
    \ (across two or more properties) is required for a model class, we can add a\
    \ custom validation function `validate` to it, such that object-level validation\
    \ can be performed before save by invoking `validate` on the object concerned.\
    \ For instance, for expressing the constraint defined in the model class shown\
    \ in Figure 7.1, we define the following validation function:\n\n```\nAuthor.prototype.validate\
    \ = function () {\n  if (this.dateOfDeath && this.dateOfDeath < this.dateOfBirth)\
    \ {\n    throw new ValidationError(\n      \"The dateOfDeath must be after the\
    \ dateOfBirth!\"\n    );\n  }\n};\n```\n\nWhen a `validate` function has been\
    \ defined for a model class, it can be invoked in the create and update methods.\
    \ For instance,\n\n```\nAuthor.add = function (slots) {\n  var author = null;\n\
    \  try {\n    author = new Author(slots);\n    author.validate();\n  } catch (e)\
    \ {\n    console.log(e.constructor.name + \": \" + e.message);\n  }\n};\n```\n\
    \n# 8.8.2 Using implicit JS setters\n\nSince ES5, JavaScript has its own form\
    \ of setters, which are implicit and allow having the same semantics as explicit\
    \ setter methods, but with the simple syntax of direct access. In addition to\
    \ having the advantage of a simpler syntax, implicit JS setters are also safer\
    \ than explicit setters because they decrease the likelihood of a programmer circumventing\
    \ a setter by using a direct property assignment when instead a setter should\
    \ be used. In other OOP languages, like Java, this is prevented by declaring properties\
    \ as `private`. But JavaScript does not have this option.\n\nThe following code\
    \ defines implicit setter and getter methods for the property title:\n\n```\n\
    Object.defineProperty(Book.prototype, \"title\", {\n  set: function (t) {\n  \
    \  var validationResult = Book.checkTitle(t);\n```"
