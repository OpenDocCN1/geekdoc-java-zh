  md: '# Foreword


    This two-volume book shows how to design and implement web applications with a
    model-based engineering approach, using the two relevant technology platforms
    for web development: JavaScript and Java. Web apps are designed with the help
    of information models in the form of UML class diagrams and implemented as:


    +   1. JavaScript front-end apps, using one of two local storage technologies
    offered by web browsers;

    2. Java back-ends, using Java Server Faces (JSF) as the user interface technology,
    the Java Persistence API (JPA) for object-to-storage mapping, and a MySQL/MariaDB
    database management system;

    3. distributed JavaScript apps with


    +   a. a front-end component for managing the user interface and taking care of
    certain parts of the application logic (including constraint-based data validation),

    b. a NodeJS-based back-end component for managing persistent storage and taking
    care of certain parts of the application logic (including constraint-based data
    validation).


    The focus of this book are general concepts and techniques concerning the fundamental
    information management issues of integrity constraints and data validation,


    +   1. integrity constraints

    2. enumerations and enumeration attributes

    3. unidirectional and bidirectional associations between object types,

    4. subtyping and inheritance in class hierarchies.


    The first two issues of this list are discussed in Volume 1 of the book, while
    the last two are discussed in Volume 2.


    We assume that the reader is familiar with HTML and with object-oriented programming,
    preferably with Java (or, otherwise, C++, PHP, Python or C#). In addition we assume
    that the reader has some familiarity with CSS and JavaScript, and is willing to
    learn more about programming with modern JavaScript.

    The book can be used


    +   1) in web development courses for students of Computer Science and related
    disciplines;

    2) by JavaScript developers for learning Java;

    3) by Java developers for learning JavaScript;

    4) by JavaScript and Java (and PHP/Python/C# etc.) developers for learning

    - object-oriented (OO) programming with JavaScript and Java EE,

    - how to implement basic information management concepts and build web apps with
    plain JavaScript and Java EE.'
  merge: -1
