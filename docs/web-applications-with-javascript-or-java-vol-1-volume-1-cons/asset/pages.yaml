  md: '# 184 10 Enumerations and Enumeration Attributes


    +   1. simple enumerations define a list of self-explanatory enumeration labels;

    2. code lists define a list of code/label pairs.

    3. record enumerations consist of a list of records, so they are defined like
    classes with simple attributes defining the record fields.


    These three forms of enumerations are discussed in more detail below.

    Notice that since enumerations are used as the range of enumeration attributes,
    they are considered as datatypes.

    Enumerations may have further features. For instance, we may want to be able to
    define a new enumeration by extending an existing enumeration. In programming
    languages and in other computational languages, enumerations are implemented with
    different features. Also see the Wikipedia article on enumerations¹.


    # 10.1.1 Simple enumerations


    A simple enumeration defines a fixed list of self-explanatory enumeration labels,
    like in the example of a GenderEL enumeration shown in the following UML class
    diagram.


    | enumeration |

    | GenderEL |

    | MALE |

    | FEMALE |

    | UNDETERMINED |


    Since the labels of a simple enumeration are being used, in capitalized form,
    as the names of the corresponding enumeration literals (GenderEL.MALE, GenderEL.FEMALE,
    etc.), we may also list the (all upper case) enumeration literals in the UML enumeration
    datatype, instead of the corresponding (lower or mixed case) enumeration labels.


    # 10.1.2 Code lists


    A code list is an enumeration that defines a fixed list of code/label pairs. Unfortunately,
    the UML concept of an enumeration datatype does not support the distinction between
    codes as enumeration literals and their labels. For defining both codes and labels
    in a UML class diagram in the form of an enumeration datatype, we may use the
    attribute compartment of the data type rectangle and use the codes as attribute


    > 1 http://en.wikipedia.org/wiki/Enumerated_type'
