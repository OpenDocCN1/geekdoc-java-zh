  md: '# 74 Building a Minimal Web App with Java EE in Seven Steps


    ```

    @Entity @Table(name="books")

    @RequestScoped @ManagedBean(name="book")

    public class Book { ... }

    ```


    ```

    @SessionScoped @ManagedBean(name="bookCtrl")

    public class BookController { ... }

    ```


    Notice how a lifetime scope can be specified by an annotation. In our example
    the book bean is @RequestScoped, this instance exists as long as the HTTP request
    and the associated response are processed. The bookCtrl bean is @SessionScoped,
    which means it is created when the session starts, and destroyed when the session
    is closed. Other scopes are available, but in our example we only need these two.


    # 4.4.5 Build the WAR file and deploy it to TomEE


    There are multiple ways in which we could compile the source code, create the
    war file and deploy it to a TomEE server. For example one can use Eclipse IDE¹²
    or Netbeans¹³, one can use ANT and create a script that takes care of all these
    tasks.


    We provide an ANT¹⁴ script that allows to automatically create the structure of
    a Java application, compile the Java source code, build the WAR file and deploy
    it to a TomEE web server. Our ANT script generates Eclipse compatible folder,
    so if you use Eclipse, simply create a project from the existing application code.
    The ANT installation instructions, detailed description of the available tasks
    as well as download links are available on our instructions¹⁵.


    For our "PublicLibrary" example, we have used the ANT script and the following
    steps were needed:


    +   - create the application folder structure: ant create app -Dappname=publicLibrary

    - compile the Java code and build the war file: ant war -Dappname=publicLibrary

    - deploy the application to TomEE server: ant deploy -Dappname=publicLibrary.
    This operation also builds the war file, if it was not already created using the
    task, as shown before.


    Hint: We do not recommend using spaces in folder names, but if for any reason,
    the application name needs to contain spaces, then it has to be enclosed in double
    quotes, e.g. create app -Dpgname=hw -Dappname="Hellow World".


