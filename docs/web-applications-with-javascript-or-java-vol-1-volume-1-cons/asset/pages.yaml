    The JPA architecture for data management and object-storage mapping is based on
    the concept of an entity manager, which provides the data management methods persist
    for saving a newly created or updated entity, find for retrieving an entity, and
    remove for deleting an entity.


    Since the database access operations of an entity manager are executed in the
    context of a transaction, our data management methods have a parameter of type
    UserTransaction. Before the entity manager can invoke the database write method
    persist, a transaction needs to be started with ut.begin(). After all write (and
    state change) operations have been performed, the transaction is completed (and
    all changes are committed) with ut.commit().'
