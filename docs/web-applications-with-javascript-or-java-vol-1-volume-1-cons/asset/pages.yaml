  md: "```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<persistence version=\"2.1\"\
    >\nxmlns=\"http://java.sun.com/xml/ns/persistence\"\nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    >\n  <persistence-unit name=\"MinimalApp\">\n    <class>pl.m.Book</class>\n  \
    \  <properties>\n      <!-- Request auto-generation of the database schema ->\n\
    \      <property name=\"javax.persistence.schema-generation.database.action\"\n\
    \            value=\"create\"/>\n      \n      <!-- Use the JPA annotations to\
    \ create the database schema ->\n      <property name=\"javax.persistence.schema-generation.create-source\"\
    \n            value=\"metadata\"/>\n    </properties>\n    <jta-data-source>jdbc/MinimalApp/jta-data-source</jta-data-source>\n\
    \  </persistence-unit>\n</persistence>\n```\n\nThe configuration name \"MinimalApp\"\
    \ is defined by the name attribute of the persistence-unit element. The value\
    \ we have to use for the unitName property of the @PersistenceContext. The persistence-unit\
    \ element has three content parts:\n\n+   1. One or more classes, each containing\
    \ the fully qualified name of an entity class of the app (like pl.m.Book in our\
    \ example app).\n2. A set of configuration property elements used for providing\
    \ further configuration settings.\n3. A jta-data-source element for specifying\
    \ the configuration block in the config/TomEE.xml web server configuration file\
    \ in the web installation folder.\n\nIn this persistence.xml file, two configuration\
    \ properties have been set:\n- javax.persistence.schema-generation.database.action,\
    \ with the possible values: none (default), create, drop-and-create and drop.\
    \ It specifies if the database schema is automatically created and additionally\
    \ allows to drop the existing tables before creating the new ones (with drop-and-create).\n\
    - javax.persistence.schema-generation.create-source, with the possible values\
    \ metadata (default), script, metadata-then-script and script-then-metadata. It\
    \ specifies the source of information used to create the database schema. The\
    \ value metadata enforces using the JPA annotations while the value script allows\
    \ using an external script for defining the schema."
