  md: "# 80 4 Building a Minimal Web App with Java EE in Seven Steps\n\n```\npublic\
    \ class Book {\n  public static void update( EntityManager em, UserTransaction\
    \ ut,\n  String isbn, String title, int year) throws Exception {\n  ut.begin();\n\
    \  Book book = em.find(Book.class, isbn);\n  if (title != null && !title.equals(book.title))\
    \ {\n    book.setTitle(title);\n  }\n  if (year == book.year) {\n    book.setYear(year);\n\
    \  }\n  ut.commit();\n  }\n}\n```\n\nNow, we create the view where a Book can\
    \ be selected so the user can edit the title and year properties, and then save\
