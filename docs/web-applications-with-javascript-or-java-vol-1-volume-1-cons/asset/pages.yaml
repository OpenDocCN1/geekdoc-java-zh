  md: "# 8 Implementing Constraint Validation in a Plain JS Web App\n\nNotice optional\
    \ properties, like `edition`, need to be treated in a special way. If the user\
    \ doesn't enter any value for them in a `Create` or `Update` user interface, the\
    \ form field's value is the empty string \"\". In the case of an optional property,\
    \ this means that the property is not assigned a value in the `add` use case,\
    \ or that it is different from the case of a mandatory property, where the empty\
    \ string value obtained from an empty form field may or may not be an admissible\
    \ value.\n\nIf there is a constraint violation exception, an error message is\
    \ written to the log and the object concerned is reset to its previous state:\n\
