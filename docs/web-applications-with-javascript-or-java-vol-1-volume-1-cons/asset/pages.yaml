    # 10.1.4 Extensible enumerations


    There may be cases of enumerations that need to be extensible, that is, it must
    be possible to extend their list of enumeration values (labels or code/label pairs)
    by adding a new one. This can be expressed in a class diagram by appending an
    ellipsis to the list of enumeration values, as shown in Figure 10.1.


    ![](img/42f1421051423f5b9e022255ae58c362_203_0.png)


    > Figure 10.1 An example of an extensible enumeration


    Since enumeration values are internally represented by a database, which are normally
    stored as plain positive integers in a database, an enumeration value can only
    be added at the end of the value list such that it can be assigned a new index
    integer without re-assigning the indexes of other enumeration values. Otherwise,
    the mapping of enumeration indices to corresponding enumeration values would not
    be preserved.


    Alternatively, if new enumeration values have to be inserted in-between enumeration
    values, and their indices are re-assigned, this implies that


    +   1. enumeration indexes are plain sequence numbers and do no longer identify
    an enumeration value;'
