  md: '# 13.3.4 Arbitrary precision numbers


    In widely used programming languages, like JavaScript and Java, the built-in standard
    datatypes for dealing with decimal numbers (like number in JavaScript and double
    in Java) do not support precise calculations. For instance, in JavaScript, the
    result of computing the subtraction 0.3–0.1 is not 0.2, but rather 0.9999999999999,
    which is close to, but not the same as the correct result. Even if such a precision
    error may be acceptable in a use case like physics simulation for games, it is
    not acceptable in a use case like financial accounting.


    The concept of arbitrary-precision numbers is to allow calculations where the
    precision is only limited by the available memory, unlike the fixed-precision
    arithmetic implemented in a computer''s arithmetic logic unit, which is normally
    employed by the standard arithmetic implementation of a programming language.
    Arbitrary-precision numbers are used in applications where precise results of
    calculations (even with large numbers) are required and where the calculation
    speed is not a critical factor.


    In JavaScript, we can use a library big.js or mathjs¹ for arbitrary-precision
    calculations. For instance, using the big.js library, the precise result of the
    subtraction 0.3–0.1 is obtained in the following way:


    ```

    var x = new Big(0.3);

    var result = x.min(0.1);

    console.log(result); // 0.2

    ```


    The maximum number of decimal places and the rounding mode used to round the results
    of the critical operations div, sqrt and pow (with negative exponent) is determined
    by the static properties DP and RM of the Big class, illustrated by the following
    example:


    ```

    Big.DP = 10 // decimal places

    Big.RM = 1 // default rounding mode

    ```


    ```

    x = new Big(2);

    y = new Big(3);

    z = x.div(y) // "0.666666666667"

    z.sqrt() // "0.8164965809"

    z.pow(-3) // "0.374999999995"

    ```'
