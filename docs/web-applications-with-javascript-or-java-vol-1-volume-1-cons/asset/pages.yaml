    unofficial) built-in reference __proto__ (with a double prefix and suffix) for
    finding methods and properties. As shown in Figure 2.1, every constructor has
    a reference to a prototype object as the value of its reference property. When
    a new object is created with the help of it, __proto__ is set to the constructor''s
    prototype property.


    For instance, after creating an object with f = new Foo(), it holds that Object.getPrototypeOf(f),
    which is the same as f.__proto__. Consequently, changes to the slots of Foo.prototype
    affect all objects created with new Foo(). While every object has a __proto__
    slot (except Object), only objects constructed with new have a constructor property
    slot.


