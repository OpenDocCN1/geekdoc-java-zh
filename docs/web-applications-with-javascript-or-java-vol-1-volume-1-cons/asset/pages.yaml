  md: '# 13.1 Boolean Values


    Boolean attributes, like Smoker, can only have one of two possible values: true
    or false, which are sometimes more naturally expressed with yes or no. In the
    model code, Boolean attributes are treated as primitive datatype attributes, since
    all programming languages support Boolean as a primitive datatype.


    For rendering a Boolean attribute in a user interface, there are several examples
    that have to be the simplest solution is using a checkbox field. Alternatively,
    a single-selection list with the two options true and false (and yes as no), or
    a radio button group with two radio buttons, could be used.


    In an HTML form, a checkbox field is implemented with an input element of type
    checkbox. For assigning the value of the checkbox field to the Boolean attribute,
    the field''s checked attribute has to be used, as shown in the following example
    where we have a checkbox field in an HTML form:


    ```

    <form id="Person">

    <p><label>

    is smoker: <input type="checkbox" name="isSmoker" />

    </label></p>

    </form>

    ```


    In JavaScript code, the checkbox field is accessed via its name, and the Boolean
    attribute is assigned by reading the field''s checked attribute (instead of its
    value attribute), like so:


    ```

    var isSmokerCheckboxField = document.forms["Person"].isSmoker;

    var newPerson = new Person();

    Person.isSmoker = isSmokerCheckboxField.checked;

    ```


    # 13.2 String Patterns


    Email addresses, URLs and telephone numbers are examples of strings that have
    to match a pattern, typically defined by a regular expression. It''s common to
    have attributes with such values. For readability, it is preferable to use predefined
    datatypes, like Email, URL and PhoneNumber, in an information design model, instead
    of defining them as string-valued attributes with a pattern constraint.


    In a (JavaScript or Java) class definition, these attributes have to be implemented
    as string-valued attributes with a pattern constraint. It is, however, desirable
    to have built-in support for them, like in the data/document format definition
    XML Schema.'
