  md: "# 14.3 Dealing with Derived Properties in the User Interface\n\nSince derived\
    \ properties are not set by user input, there are no input, but only output fields\
    \ for them in a user interface. This is illustrated in the following example of\
    \ an HTML form:\n\n```\n<form id=\"Person\">\n  <label>First name: <input name=\"\
    firstName\" type=\"text\"/></label>\n  <label>Last name: <input name=\"lastName\"\
    \ type=\"text\"/></label>\n  <label>Initials: <output name=\"initials\"/></label>\n\
