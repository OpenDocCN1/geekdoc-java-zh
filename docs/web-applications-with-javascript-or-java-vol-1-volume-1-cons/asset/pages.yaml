  md: "# 160 9 Implementing Constraint Validation in a Java EE Web App\n\nThe @Id\
    \ annotation of the itemCode attribute is mapped to a SQL primary key declaration\
    \ for the corresponding database table. As a consequence, the itemCode column\
    \ of the generated items table must have a value in each row and these values\
    \ are unique. however, these conditions are not checked in the Java runtime environment.\
    \ JPA generates the following CREATE TABLE statement:\n\n```\nCREATE TABLE IF\
    \ NOT EXISTS items (\n    itemCode varchar(255) NOT NULL PRIMARY KEY,\n    quantity\
    \ int(11) DEFAULT NULL\n)\n```\n\nSince nothing has been specified about the length\
    \ of itemCode, the length is set to 255 by default. However, in our case we know\
    \ that itemCode has a fixed length of 10, which can be enforced by using the @Column\
    \ annotation, which has the following parameters:\n\n+   - name allows to specify\
    \ a name for the column to be used when the table is created (by default, the\
    \ attribute name of the entity class is used);\n- nullable is a boolean parameter\
    \ that defines the column allows NULL values (by default, it is true);\n- length\
    \ is a positive integer, specifying the maximum number of characters allowed for\
    \ string values of that column (by default, this is 255);\n- unique is a boolean\
    \ parameter that defines the values of the column must be unique (by default,\
    \ it is false).\n\nUsing the @Column annotation, the improved Java/JPA code of\
    \ the model class is:\n\n```\n@Entity@Table( name=\"items\")\npublic class Item\
    \ {\n    @Id @Column( length=10)\n    private String itemCode;\n    @Column( nullable=false)\n\
    \    private int quantity;\n    // define constructors, setters and getters\n\
    }\n```\n\nAs a result, the generated CREATE TABLE statement now contains the additional\
    \ constraints expressed for the columns itemCode and quantity:"
