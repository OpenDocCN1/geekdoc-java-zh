  md: "# 5.4 Excursion: Formalizing Information Models with RDF and OWL 99\n\n![](img/42f1421051423f5b9e022255ae58c362_116_0.png)\n\
    \nIn an RDF graph, nodes with an elliptic shape represent \"resources\" (like\
    \ properties and classes), and arrows represent relationships defined by a property.\
    \ Each arrow between two nodes represents a statement (also called \"triple”).\
    \ For instance the rdf:range arrow between year and xs:int represents the statement\
    \ that the range of the property year is the XML Schema datatype xs:int, where\
    \ xs is a namespace prefix for the XML Schema namespace.\n\nNotice that RDF has\
    \ the predefined meta-classes rdf:Class and rdf:Property, used to define classes\
    \ and their properties with the help of the predefined property rdf:type. For\
    \ instance the rdf:type arrow between year and rdf:Property represents the statement\
    \ that year is of rdf:Property, that is, it is defined as an RDF property.\n\n\
    RDF graphs are a formalism for theoretical purposes. They can be used for illustrating\
    \ simple examples. Compared to UML class diagrams, they are not useful for visually\
    \ expressing realistic vocabularies, due to their convolution and unnecessary\
    \ visual complexity.\n\nThe domain of a property has to be explicitly defined\
    \ in an RDF vocabulary (with an rdf:domain property statement), as opposed to\
    \ UML class diagram where it is defined implicitly. While it is natural to define\
    \ properties in the context of a class, as in UML, RDF allows defining properties\
    \ independently of any class.\n\nThe RDF/XML syntax allows publishing an RDF vocabulary\
    \ for the Web. For instance, the Book vocabulary defined in the RDF graph above,\
    \ can be represented by the following RDF/XML document:\n\n```\n<xml version=\"\
