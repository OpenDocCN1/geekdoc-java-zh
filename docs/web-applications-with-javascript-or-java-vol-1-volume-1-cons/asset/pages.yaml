  md: "# 214 — 12 Implementing Enumeration Attributes in a Java EE Web App\n\nFor\
    \ the case of single-valued enumeration attributes (like originalLanguage and\
    \ category), the JPA annotation @Enumerated is used for specifying the storage\
    \ serialization. It takes one of the following two parameter values:\n\n+   -\
    \ EnumType.STRING means that enumeration literals are converted to strings when\
    \ they are serialized (e.g., in the case of the originalLanguage attribute of\
    \ the Book class, the values saved in the database are one of \"EN\", \"DE\",\
    \ \"FR\" or \"ES\")\n- EnumType.ORDINAL means that enumeration literals are converted\
    \ to their index integer when they are serialized (i.e., the values saved in the\
    \ database are 1, 2, 3 etc.).\n\nWe store the values of a multi-valued enumeration\
    \ attribute (like other-AvailableLanguages and publicationForms) in a database\
    \ table column as serialized arrays in the form of [\"value1\",\"value2\",...].\
    \ In the case of the originalLanguage attribute, an example of a saved value would\
    \ be [\"EN\",\"FR\",\"DE\"]. Achieving this behavior is possible with JPA using\
    \ custom converters to map database table column to types and versa. The Converter\
    \ annotation allows specifying a Java converter that is responsible for the mapping.\n\
    \nAlso, in the case of a multi-valued enumeration attribute, we use the @Size\
    \ annotation to specify the minimum, and if required the maximum, number of elements\
    \ stored by this attribute. For example, in the case of publicationForms, we use\
    \ @Size(min=1,message=\"At least one publication form is required\") which enforces\
    \ to have at least one value for this attribute, otherwise the error is displayed.\n\
    \n```\n@Table(name=\"books\")\n@Scoped @ManagedBean(name=\"books\")\npublic class\
    \ Book {\n    public Book(String isbn, String title, Integer year,\n         \
    \      LanguageEL originalLanguage,\n               Set<LanguageEL> otherAvailableLanguages,\n\
    \               BookCategoryEL category);\n    public Set<PublicationForm> getOriginalLanguage()\
    \ { }\n    public void setOriginalLanguage(LanguageEL originalLanguage) { }\n\
    \    public Set<LanguageEL> getOtherAvailableLanguages() { }\n    public void\
