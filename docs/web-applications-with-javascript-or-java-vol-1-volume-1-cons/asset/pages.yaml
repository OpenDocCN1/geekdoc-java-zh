  md: '# 6.1 The Model-View-Controller (MVC) Architecture Metaphor — 109


    UI concept includes both the output (the information output provided to the user,
    as well as system actions) and the input (including information input, as well
    as actions performed, by the user).


    The Smalltalk MVC metaphor was developed for (monochromatic) text-based interfaces
    with no general notion of UI events. This may explain why they did not consider
    an integral concept of UI. While they distinguished between the state of objects
    in the model and their state in the UI, which are both in the scope of a user
    session, they did not consider the distinction between the model state and the
    database state.


    In his web essay GUI Architectures? (2006), Martin Fowler summarizes the principles
    of the original MVC approach in the following way:


    +   1. Separation between UI and model.

    2. Divide UI into a ''controller'' and ''view''.

    3. Views are synchronized with the model (by means of a data binding mechanism).


    While the first and third principles are fundamental for the architecture of software
    applications, the second principle has just historic meaning and was soon abandoned
    by the developers of Smalltalk.


    Compared to the 1980s, computers, human-computer interaction and software architecture
    have evolved. In particular, the establishment of the Web has made web browsers
    to be the most important infrastructure for user interfaces.


    The MVC terminology is still used today, by web application frameworks, with different
    meanings assigned to “M”, “V” and “C”. Typically, the “view” denotes the app''s
    code for the HTML-based user interface, and the “controller” denotes the code
    that is in charge of mediating between the “view” and the “model”.


    In many MVC approaches, the “model” is tightly coupled with the underlying database
    technology, using an object-relational mapping (ORM) approach mapping classes
    to tables and objects to rows. This tight coupling between model classes and database
    tables violates the fundamental principle of minimizing dependencies (because
    there is no need that model classes depend on database tables) and the opinion
    discussed below.


    For instance, in the Active Record* paradigm of the influential Ruby-on-Rails
    framework, which has been adopted by many other web application frameworks (such
    as CakePHP), the “model” is a direct representation of the schema of the underlying
    database system, where each table of the database is represented by a “model”
    class that inherits data manipulation methods for performing Create/'
