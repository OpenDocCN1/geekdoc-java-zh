  md: "# 190 10 Enumerations and Enumeration Attributes\n\nUsing this Enumeration\
    \ class allows to define a new enumeration in the following way:\n\n```\nvar BookCategoryEL\
    \ = new\nEnumeration({\"novel\",\"biography\",\"textbook\",\"other\"});\n```\n\
    \nHaving an enumeration BookCategoryEL, we can then check if an enumeration attribute\
    \ like category has an admissible value by testing if its value is smaller than\
    \ 1 and not greater than BookCategoryEL.MAX. Also, the label can be retrieved\
    \ in the following way:\n\n```\nformEL.category.value = BookCategoryEL.labels[this.category\
    \ -1];\n```\n\nAs an example, we consider the following model Book with the enumeration\
    \ attribute category:\n\n```\nfunction Book( slots) {\n  this.isbn = \"\"; //\
    \ string\n  this.title = \"\"; // string\n  this.category = 0; // number (BookCategoryEL)\n\
    \  if (arguments.length > 0) {\n    this.setIsbn(slots.isbn);\n    this.setTitle(slots.title);\n\
    \    this.setCategory(slots.category);\n  }\n}\n```\n\nFor validating input values\
    \ for the enumeration attribute category, we can use the following function:\n\
    \n```\nBook.checkCategory = function (c) {\n  if (!c) {\n    return new MandatoryInputValueViolation(\n\
    \      \"A category must be provided!\"\\n  } else if (!Number.IsInteger(c) ||\
    \ c < 1 ||\n    c > BookCategoryEL.MAX) {\n    return new RangeConstraintViolation(\n\
    \      \"The category must be a positive integer \" +\n      \"not greater than\
    \ \" + BookCategoryEL.MAX + \" !\"\\n    );\n  } else {\n    return new NoConstraintViolation();\n\
    \  }\n}\n```\n\nNotice how the constraint defined by the enumeration BookCategoryEL\
    \ is checked: it is tested if the input value c is a positive integer and if it\
    \ is not greater than BookCategoryEL.MAX."
