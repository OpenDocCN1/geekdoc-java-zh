  md: '# 76 4 Building a Minimal Web App with Java EE in Steps


    Data binding refers to the binding of model class properties to form (input or
    output) fields. In the following facet code fragment, the entity property book.isbn
    is bound to the input field "isbn":


    ```

    <h:outputLabel for="isbn" value="ISBN">

    <h:inputText id="isbn" value="#{book.isbn}" />

    </h:outputLabel>

    ```


    In JSF, the inputText elements of a form, the id attribute is used with a given
    value, e.g., id="isbn". The rendered HTML5 input elements have both, the id and
    name attributes, which are obtained by using the form id and element values separated
    by a colon, i.e., id="createBook:isbn" and name="createBook:isbn"


    We can also see a first example of an expression in the Java Expression Language
    (EL), where an expression starts with # and is enclosed in brackets, like #{expression}.
    Such an expression allows reading the value of a property of, or invoking a method
    on, a Java bean or context object. The value of the expression is assigned to
    the value of the generated HTML input element. The example in our JSF code above
    is the expression #{book.isbn}, which retrieves the value of isbn property of
    the book bean.


    Action binding refers to the binding of method invocation expressions to actionable
    UI elements, where invoked methods are controller action methods, and the actionable
    UI elements are form buttons. For instance, in the following facet code fragment,
    the method invocation expression bookCtrl.create(...) is bound to the form''s
    submit button:


    ```

    <h:commandButton value="Create"

    action="#{book.create(book.isbn, book.title, book.year)}" />

    ```


    After discussing data binding and action binding, it''s time to look at the complete
    of the facet:


    ```

    <!DOCTYPE html>

    <html xmlns="http://www.w3.org/1999/xhtml"

    xmlns:ui="ui" xmlns:h="h" xmlns:p="p">

    <ui:define template="WEB-INF/templates/page.xhtml">

    <ui:define name="headerTitle">

    <h1>Create a new book record</h1>

    </ui:define>

    <ui:define name="main">

    <h:form id="createBookForm">

    <div><h:outputLabel for="isbn" value="ISBN: ">

    <h:inputText id="isbn" value="#{book.isbn}" />

    </h:outputLabel></div>

    <div><h:outputLabel for="title" value="Title: ">

    <h:inputText id="title" value="#{book.title}" />

    </h:outputLabel></div>

    </h:form>

    </ui:define>

    </ui:define>

    ```'
