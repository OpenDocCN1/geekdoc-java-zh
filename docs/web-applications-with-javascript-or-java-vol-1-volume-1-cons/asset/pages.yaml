    \    // instance-level methods\n    public boolean checkISBN() {\n    }\n}\n```\n\
    \nWe need to be aware of the ambiguity of the term \"object\". We have to distinguish\
    \ objects in the sense of real-world objects (also called \"business objects\"\
    ) or \"entities\") in an OO program, such as JS objects or Java objects. When\
    \ we want to manage information about business objects of type in an app, we represent\
    \ them in the form of JS/Java objects that represents their (business) object\
    \ type. We call these classes model classes for two reasons: first because they\
    \ implement the classes defined in an app's data model, and second they represent\
    \ the 'model' of an app's Model-Controller codebase architecture.\n\nTherefore,\
    \ in a JS/Java app, a business object is a JS/Java object, but not every JS/Java\
    \ object represents a business object because we use JS/Java objects for many\
    \ purposes (e.g., in JavaScript, an array is a JS object, but it's not a business\
    \ object). The same applies to classes: (business) object types are represented\
    \ as model classes, but not every JS/Java class is a model class because we may\
    \ use JS/Classes also for other purposes (e.g., in Java, a class can be used as\
    \ a container for a method library, but such a class is not a model class)."
