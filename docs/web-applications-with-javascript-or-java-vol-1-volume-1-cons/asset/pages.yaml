    \ integrity constraints in a JavaScript *model class*, and how to perform constraint\
    \ validation in both the model of the app and in the user interface built with\
    \ HTML5.\n\nWe show how to perform responsive validation with the HTML5 form validation\
    \ API¹. Since using the new HTML5 `input` field types and validation attributes\
    \ (like `required`, `min`, `max` and `pattern`) implies defining constraints in\
    \ the UI, they are not really useful in a best-practice approach where constraints\
    \ are only checked, but not defined in the UI.\n\nConsequently, we use the new\
