  md: '# 5 Information Modeling


    UML


    The Unified Modeling Language (UML¹), created in the mid-1990s, is an industry
    standard that defines a set of modeling languages for various kinds of models
    and diagrams in support of object-oriented problem analysis and software design.
    Its core languages are Class Diagrams for information/data modeling, and Sequence
    Diagrams, Activity Diagrams and State Diagrams (or State Charts) for process/behavior
    modeling.


    UML class diagrams provide a visual syntax for expressing UML class models, which
    allow defining information and data models. They can be used at both the level
    of conceptual modeling for requirements engineering and at the more detailed level
    of design modeling for designing the model classes of an app. Their main building
    blocks are class rectangles and association lines.


    A class rectangle has one, or two compartments, containing the name of the class,
    its properties, and its methods. The purpose of a class is to classify objects
    and define its properties and the methods that can be invoked on.


    RDF and OWL


    The Resource Description Framework (RDF²) has been defined by the W3C in 2004
    as a logical format that allows (1) formalizing information models in the form
    of RDF vocabularies, and (2) representing propositional information (e.g., meta-data)
    on the Web. The core of a UML class model can be expressed as RDF vocabulary.
    However, many types of integrity constraints cannot be expressed in RDF. The W3C
    has therefore defined an extension of RDF, called the Web Ontology Language (OWL³),
    which allows to formalize the logic classes, properties and integrity constraints
    of a UML class model in the form of an OWL ontology.


    An association connects two class rectangles. The purpose of an association is
    to classify relationships (links) between objects. While UML classes have a direct
    counterpart in the class concepts of object-oriented programming (OOP) languages,
    UML associations do not have such a direct OOP counterpart. They are therefore
    often more difficult to understand for developers. Only in the special case of
    a unidirectional association there is a direct OOP counterpart: a reference property
    for the objects that are linked to a given object by the association.


    From a logical point of view, a class defines a vocabulary, or language, for expressing
    various types of statements about objects. The knowledge representation languages
    RDF and OWL allow to formalize the vocabularies defined by class models and the
    statements made instantiating these classes by creating objects. In this way,
    they help to understand the semantics of information models.


    +   1 http://www.uml.org

    2 https://www.w3.org/TR/rdf11-primer/

    3 https://www.w3.org/TR/owl2-overview/


    https://doi.org/10.1515/9783110499957-005'
  merge: -1
