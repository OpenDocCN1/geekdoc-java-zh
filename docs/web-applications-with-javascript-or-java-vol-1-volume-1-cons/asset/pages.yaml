  md: "# 4.11 Possible Variations and Extensions\n\n# 4.11 Possible Variations and\
    \ Extensions\n\n# 4.11.1 Using resource URLs\n\nWhenever an app library provides\
    \ public information about entities, such as the books available in a public library,\
    \ it is desirable to publish this information with the help of self-descriptive\
    \ resource URLs, such as `http://publiclibrary.norfolk.city/books/006251857X`,\
    \ which would be the resource URL for retrieving information about the book “Weaving\
    \ the Web” in the public library of Norfolk. However, resource URLs are not supported\
    \ by JSE. In the Java world, we would have to use JAX-RS, instead of JS, for programming\
    \ a web API with resource URLs. But this would imply that we need to take care\
    \ of the front-end UI in a different way, since JAX-RS is a pure back-end API,\
    \ not providing any support for building user interfaces. Another option would\
    \ be to use a JavaScript front-end framework, such as BackboneJS or ReactJS, for\
    \ rendering the UI.\n\n# 4.11.2 Using an alternative DBMS\n\nInstead of MySQL,\
    \ you can use any other database management systems for persistent storage. The\
    \ following four steps are required to specify the used DBMS (only one DBMS at\
    \ a time is possible):\n\n+   - Configure TomEE so it uses the corresponding resource\
    \ for your application. For a list of resource configuration examples used for\
    \ common DBMSs, check Common DataSourceConfigurations². For example, if `PostgreSQL`\
    \ was chosen as DBMS, then edit the `conf/tomee.xml` file and add the following\
    \ code:\n```xml\n<Resource id=\"application-persistence-unit-name\" type=\"DataSource\"\
    >\n  JdbcDriver org.postgresql.Driver\n  JdbcbcUrl jdbc:postgresql://host/database-name\n\
    \  UserName dbms-username\n  Password user-password\n</Resource>\n```\n\n- Copy\
    \ the jar file corresponding to the DBMS driver implementation to the lib folder.\
    \ After this, the TomEE server needs to be restarted.\n- Install the DBMS, if\
    \ not already installed. Installation instructions are usually available on the\
    \ corresponding DBMS web page.\n- Create the corresponding DBMS user and database\
    \ to be used for your application."
