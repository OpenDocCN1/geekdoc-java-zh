  md: '# 2.2 Storing Database Tables with JavaScript''s localStorage API


    In most cases, we have some form of data management where data is represented
    in tables that table rows correspond to objects, and the table schema corresponds
    to the objects'' type. When building a front-end web app with JavaScript, the
    simplest approach for persistent data storage is using JavaScript''s localStorage
    API, which provides a simple key-value database but does not support database
    tables. So, the question is: how can we store and retrieve tables with Local Storage?


    We show how to represent database tables in JavaScript in the form of (what we
    call) entity tables, and how to store these tables in Local Storage.


    # 2.2.1 Entity Tables


    The JavaScript Object Notation (JSON)¹⁰ defines a concise syntax for JavaScript
    array literals (lists) and JavaScript object literals (maps):


    +   - Lists are expressed as comma-separated lists of data enclosed in brackets:
    `["penguin", "arctic", "snow"]`n- Maps are expressed as comma-separated lists
    of key-value slots enclosed in curly braces:

    - `{"id": 2901465, "my phone number":"0049.30.227109"}`n- A record is a special
    type of map where the keys are JavaScript identifiers¹¹, so they need not to be
    enclosed in quotation marks in JavaScript code. For example, id: 2901465, phone:"0049.30.227109"
    is a record. The value of a property in a record, or the value associated with
    a key in map, may be a data literal, or an array literal, or another object literal
    as: `{"tags":["penguin", "arctic"], "photographer":{"last":"Wagner","first":"Gerd"}\}`


    An entity table contains a set of records (or table rows) that each record represents
    an object with a standard identifier property slot. Consequently, an entity table
    can be represented as a map of records, where the keys are the map of the identifier
    property, and their associated records, are illustrated by the following example:


    | Key | Value |

    |---|---|

    | 006251587X | {"id":"006251587X","title":"Weaving the Web","year":2000} |

    | 0465026567 | {"id":"0465026567","title":"Gödel, Escher, Bach","year":1999} |

    | 0465030793 | {"id":"0465030793","title":"I Am A Strange Loop","year":2008} |


    > ¹⁰ https://developer.mozilla.org/en/JavaScript/Reference/Global_Objects/JSON

    ¹¹ https://thereoff.org/in/js-variables'
  merge: -1
  pgno: 52
