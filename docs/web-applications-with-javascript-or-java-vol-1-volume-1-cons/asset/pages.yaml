    Any syntactic approach to constraint validation also requires to define a set
    of error (or ‘exception’) classes, including one for each of the standard property
    constraints listed above.


    # 7.2.1 String Length Constraints


    The length of a string value for a property such as the title of a book may have
    to be constrained, typically rather by a maximum length, but possibly by a minimum
    length. In an SQL table definition, a maximum string length can be specified in
    parenthesis appended to the datatype CHAR or VARCHAR, as in VARCHAR(50). UML does
    not define any special way of expressing string constraints in class diagrams.
    Of course, we always have the option to use an invariant for expressing any kind
    of constraint, but it seems preferable to use a simpler form of expressing these
    property constraints. One option is to append a maximum length, or both a minimum
    and a maximum length, in parenthesis to the datatype name, like so


    | Book |

    | isbn : String |

    | title : String(5,80) |


    Another option is to use min/max constraint keywords in the property modifier
    list:


    | Book |

    | isbn : String |

    | title : String(min:5, max:80) |


