  md: "# 14 Derived Properties\n\nIn certain cases, a property may have the only purpose\
    \ to provide some information that is computed from other information items. For\
    \ such a derived property, there is no point to allow the user entering a value\
    \ for it. Examples of derived properties of a class Person are the attributes\
    \ age and initials. The value of age is computed on demand from the value of the\
    \ attribute dateBirth and the current year. The value of initials is computed\
    \ from the values of the attributes lastName.\n\nUnlike the case of standard properties,\
    \ the value of a derived property cannot be set by the user. Rather, it is computed\
    \ from the values of other properties. Consequently, it does not have a setter,\
    \ but only a getter method.\n\n# 14.1 Virtual Derived Properties\n\nWhen the value\
    \ of a derived property is computed on demand, by its getter method performing\
    \ its computation, the derived property is called virtual. The value of such a\
    \ virtual property is not stored. When using JavaScript's/set methods in an ES6\
    \ class definition, this means that we define a get method for age, but no internal\
    \ property like _age, and no set method:\n\n```\nvar Person = class {\n  constructor(slots)\
    \ {\n    // assign default values to mandatory properties\n    this.name = \"\"\
    ; // string (non-empty)\n    this.dateBirth = 0; // Date\n    // is constructor\
    \ invoked with a non-empty slots argument?\n    if (typeof slots === \"object\"\
    \ &&\n      Object.keys(slots).length > 0) {\n        // assign properties by\
    \ invoking implicit setters\n        this.name = slots.name;\n        this.dateBirth\
    \ = slots.dateBirth;\n    }\n  }\n\n  get name () { return this.name; }\n  set\
    \ name (n) { this.name = n; }\n  get dateBirth () { return this.dateBirth; }\n\
    \  set dateBirth (d) { this._dateBirth = d; }\n  get age () {\n    var today =\
    \ new Date();\n    return today.getFullYear() - this.dateBirth.getFullYear();\n\
    \  }\n};\n```"
