  md: '# 13.4 Calendar Dates and Times 235


    Both JavaScript and Java have a built-in Date class that actually not represent
    calendar dates, but rather timestamps (or date-times) in the specific form of
    the number of milliseconds since January 1, 1970 UTC.


    # 13.4.1 Using JavaScript''s Date class


    JavaScript''s Date class allows to represent Gregorian calendar timestamps in
    the interval of +/- 100 Million days or approximately 285,000 years either forward
    or backward, from 01 January, 1970 UTC.


    A JS date-time can be created in several ways:


    ```

    var firstNameManOnMoon = new Date(1969, 7, 20);

    var firstNameManOnMoon = new Date("1969-07-20");

    var firstNameManOnMoon = new Date(1969, 7, 20, 18, 0);

    var firstNameManOnMoon = new Date("1969-07-20T18:00:00");

    ```


    A timestamp with the current date and time can be created in the following way:


    ```

    var currentDate = new Date();

    ```


    Assume that the Book class defined above has an additional attribute publication,
    the values of which have to be included in HTML tables and forms. While date/time
    information items have to be formatted as strings in a human-readable web on pages,
    preferably in localized form based on settings of the user''s browser. it''s not
    a good idea to store date/time values in this form in a data-base. Rather use
    instances of predefined JavaScript class Date for representing date/time values
    internally and for storing them. The predefined functions toISOString() and toLocaleDateString()
    can be used for turning Date values into ISO standard date like "2015-01-27",
    or to localized date/time strings like "27.1.2015" (for simplicity, we omit the
    time part in these strings).


    In summary, date/time values may be expressed in three different formats:


    +   1. Internally, for storage and computations, or a Date value.

    2. Internally, for annotating localized date/time strings, externally, for displaying
    a date/time value in a standard format, as an ISO standard/date string, e.g.,
    with the help of toString().

    3. Externally, for displaying a date/time value in a localized form, as a localized
    date/time string, e.g., with the help of toLocaleDateString().


    Since the calendar arithmetic and calendar date manipulation functionality of
    the built-in Date class is limited, using a library like date-fns¹² may be helpful
    for doing more advanced calendar computations.


