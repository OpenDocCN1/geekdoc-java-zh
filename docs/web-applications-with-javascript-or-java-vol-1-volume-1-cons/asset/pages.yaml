    are the historic predecessors of the general annotation language RDFa, which is
    derived from RDF. Some microformats, like vCard and vEvent, are still used today,
    but are increasingly replaced with one of two general formats RDFa and JSON-LD.


    The main author of HTML5, Hickson, has proposed an alternative annotation language,
    called *microdata*, with the goal to simplify RDFa and remedy its usability issues
    (in particular, by dropping its use of XML namespaces). Despite the (rather unfortunate)
    choice of using different names for the same annotation concepts (like “itemprop”
    instead of “property”), Hickson''s microdata proposal succeeded to show


    +   1. how to get essentially the same annotation functionality at lower usability
    costs,

    2. how to integrate annotations with the DOM.


    Since Hickson ended his collaboration with the W3C, the microdata proposal did
    not succeed to get an official W3C status, and web browsers have discontinued
    their support for it. However, it a W3C proposal to use the RDF Lite subset of
    RDFa, which “can be applied to most simple to structured data markup tasks, without
    burdening the authors with additional complexities.”


