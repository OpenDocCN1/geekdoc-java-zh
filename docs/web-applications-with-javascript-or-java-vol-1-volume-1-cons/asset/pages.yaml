  md: '# 5.4 Excursion: Formalizing Information Models with RDF and OWL 97


    Having a setter method for each property is a best-practice approach that allows
    more control over property value assignments. For instance, we could check the
    validity of values before they are assigned, or we could notify other modules
    of the app assignment event.


    The implementation phase consists of making an implementation model for a specific
    technology platform, and then coding this model and testing the resulting program
    code. In this book, we make both JavaScript class models and Java class models,
    which are subsequently coded in plain JavaScript and in Java EE, respectively.


    The entire transformation chain, from a conceptual model via a design model to
    a JavaScript class model (as a special type of implementation model), is summarized
    in the following figure.


    ![](img/42f1421051423f5b9e022255ae58c362_114_0.png)


    In summary, the process of model-based development takes a conceptual model as
    the starting point for making a general (platform-independent) design model, from
    which one or more implementation models for a (set of) specific target technologies
    can be derived. Typically, they include a class model for an object-oriented programming
    language and a database model for an SQL DBMS. This process is illustrated by
    the following diagram:


    # 5.4 Excursion: Formalizing Information Models with RDF and OWL


    The Resource Description Framework (RDF), together with its extension RDF Schema,
    is a logical framework that allows


    +   1. formalizing information models consisting of class definitions and property
    definitions, where both class names and property names are URIs (representing
    globally unique identifiers);

    2. representing propositional information (in the form of statements about individuals)
    on the Web, embedded in web pages or in the form of special web data sources.'
