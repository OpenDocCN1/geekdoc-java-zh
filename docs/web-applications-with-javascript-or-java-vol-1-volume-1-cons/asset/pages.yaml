    # 9.2 Bean Validation annotations


    In the Java EE Validation'' approach, Java runtime validation can be defined in
    the form of bean validation annotations placed on a property, method, or class.


    Table 9.1 Bean Validation annotations for properties


    | Constraint Type | Annotations | Examples |

    |---|---|---|

    | String Length Constraints | @Size | @Size(min=8, max=80) String message;

    | Cardinality Constraints (for arrays, collections and maps) | @Size | @Size(min=2,
    max=3) List<Member> coChairs;

    | Mandatory Value Constraints | @NotNull | @NotNull String name |

    | Range Constraints for numeric attributes | @Digits | @Digits(integer=6, fraction=2)
    BigDecimal price;

    | Interval Constraints for integer-valued attributes | @Min and @Max | @Min(5)
    int teamSize |

    | Interval Constraints for decimal-valued attributes | @DecimalMin and @Max |
    @DecimalMax("30.00") double voltage |

    | Pattern Constraints | @Pattern | @Pattern(regexp="\\\d(10)\\\") String isbn;|"


    In addition, there are annotations that require a date value to be in the future
    (@Future) or in the past (@Past).


    All Bean Validation annotations have an optional message attribute for defining
    a custom error message. In the following, we add two @NotNull annotations with
    messages, a @Min annotation to the JPA constraint annotations. The @NotNull annotations
    constrain the itemId and the quantity attributes to be mandatory, while the @Min
    annotation constrains the quantity attribute to a minimum value of 0:


    ```

    @Entity(name="items")

    public class Item {

    @Id Column(length=8)

    @NotNull(message="An item code is required")

    ```


