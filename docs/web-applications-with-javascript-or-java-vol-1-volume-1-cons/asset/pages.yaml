    \ F. Boyce, is an ISO standard that is based on the Relational Database model\
    \ of Edgar F. Codd and defines\n\n+   - a Data Definition Language (based on CREATE\
    \ TABLE statements) for creating databases containing primitive data;\n- a Data\
    \ Manipulation Language (based on INSERT, UPDATE and DELETE statements), for creating,\
    \ updating and deleting the contents of database tables;\n- a Query Language (based\
    \ on SELECT statements) for retrieving the information stored in database tables.\n\
    \nSQL is widely used in Database Management Systems (DMSs) and in programming\
    \ languages for persistent data. Despite the existence of the SQL standard, each\
    \ DBMS has its own dialect of SQL. Consequently, SQL code is in practice not completely\
    \ portable among different DBMSs without adjustments.\n\nThe storage technology\
