    # 7.5 Adding Constraints to a Design Model


    We consider the book data management problem that was considered in Part 1. But
    now we also consider the data integrity rules (or ‘business rules’) that govern
    the management of book data. These integrity rules, or constraints, can be expressed
    in a UML class diagram as shown in Figure 7.2.


    | Book | «invariant» |

    | :--- | :--- |

    | isbn[1]: NonEmptyString(id) | (isbn must be a 10-digit string or a 9-digit string
    followed by “X”) |

    | title[1]: NonEmptyString(50) | |

    | year[1]: integer | |

    | edition[0..1]: PositiveInteger | «year > 1454 AND year <= nextYear()»


    Figure 7.2 A design model defining the type Book with two invariants


    In this model, the following constraints have been expressed:


    +   1. Due to the fact that the isbn attribute is declared to be the standard
    identifier of Book, it is mandatory and unique.

    2. The isbn attribute has a pattern constraint requiring its values to match the
    ISBN-10 format that admits only 10-digit or 9-digit strings by “X”.

    3. The title attribute is mandatory, as indicated by its multiplicity expression
    [1], and has a length constraint requiring its values to have at most 50 characters.

    4. The year attribute is mandatory and has an interval constraint, however, of
    a special form the maximum is not fixed, but provided by the calendar function
    nextYear(), which we implement as a utility function.


    Notice that the edition attribute is not mandatory, optional, as indicated by
    its multiplicity expression [0.1]. In addition to the constraints described in
    this list, there are the implicit constraints defined by assigning the datatype
    NonEmptyString as range to isbn and title, Integer to year, and PositiveIn-'
