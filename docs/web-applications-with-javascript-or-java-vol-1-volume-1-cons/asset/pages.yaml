  md: '# 3.11 Practice Projects — 55


    # 3.10.7 Architectural separation of concerns


    From an architectural point of view, it is important to keep the app''s model
    classes independent of


    +   1. the user interface (UI) code because it should be possible to re-use the
    same model classes with different UI technologies;

    2. the storage management code because it should be possible to re-use the same
    model classes with different storage technologies.


    In this chapter, we have kept the model class independent of the UI code, since
    it does not contain any references to UI elements, nor does it invoke any view
    method. However, for simplicity, we didn''t keep it independent of storage management
    code, since we have included the method definitions for add, update, destroy,
    etc., which invoke the storage management methods of localStorage API. Therefore,
    the separation of concerns is incomplete in our minimal example app.


    We show in Volume 2 how to achieve a more complete separation of concerns by defining
    abstract storage management methods in a special storage manager class, which
    is complemented by libraries of concrete storage management methods for specific
    storage technologies, called storage adapters.


    # 3.11 Practice Projects


    In most parts of the following projects you can follow, or even copy, the code
    of the book data management app presented in this chapter. Like in the book data
    management app, you can make the simplifying assumption that all the data can
    be kept in main memory. So, on application start, the data is read from the persistent
    data store. When the user quits, the data has to be saved to the persistent data
    store, which should be implemented with JavaScript''s Local Storage API, as shown
    in this chapter, or with the more powerful IndexedDB® API.


    For developing the apps, simply follow the sequence of seven steps above:


    +   1. Step 1 – Set up the Folder Structure

    2. Step 2 – Write the Model Code

    3. Step 3 – Initialize the Application

    4. Step 4 – Implement the Retrieve/List All Objects Use Case

    5. Step 5 – Implement the Create Object Use Case

    6. Step 6 – Implement the Update Object Use Case

    7. Step 7 – Implement the Delete Object Use Case


