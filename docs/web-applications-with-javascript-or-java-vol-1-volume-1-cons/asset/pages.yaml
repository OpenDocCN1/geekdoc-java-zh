    of the attribute, except the mandatory value and the uniqueness constraints.


    b. An extended operation, such as checkIsbnAsId, for checking, in addition to
    the basic constraints, the mandatory value and uniqueness constraints that are
    required for a standard identifier attribute.


    The checkIsbnAsId operation is invoked on user input for the isbn field in the
    create book form, also in the setIs method, while the checkIsbn operation is used
    for testing if a value satisfies the syntactic constraints defined for an ISBN.


    +   2. Create a setter for each operation (non-derived) single-valued property.
    The setter, the corresponding check operation is invoked and the property is only
    set, if the check does not detect any constraint violation.


    This leads to the JavaScript class model shown on the right-hand side of the mapping
    arrow in the following figure.


    ![](img/42f1421051423f5b9e022255ae58c362_155_0.png)


    Figure 8.1 From an information design model to a JS class model


    Essentially, the JavaScript class model extends the design model by adding checks
    and setters for each property. The attached invariants have dropped since they
    are taken of in the checks. Property ranges have turned into JavaScript datatypes
    (with a reminder to their real range in curly braces). Notice that the names of
    check functions are underlined, since this is the convention in UML for class-level
    (as opposed to instance-level) operations.'
