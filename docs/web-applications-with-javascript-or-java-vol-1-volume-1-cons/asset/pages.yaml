    # 6.1 The Model-View-Controller (MVC) Architecture Metaphor


    The most popular and widely used code base architecture approach is the Model-View-Controller
    base partitioning pattern. Although it has not been precisely defined, and has
    been implemented in many different ways, especially in web application frameworks,
    it is based on the principle of separation of concerns and on the fundamental
    insight that the model is the foundation for all other parts of an application,
    in particular for the user interface. Consequently, if the MVC approach does not
    provide a precise definition of what ‘model’, we can consider it to be a model-based
    approach.


    ![](img/42f1421051423f5b9e022255ae58c362_125_0.png)


    According to Wikipedia, the first MVC architecture was introduced to application
    programming with Smalltalk-76 by Trygve Reenskaug in the 1970s. In a later article
    about Smalltalk-80², MVC is explained as a “three-way division of an application”
    that entails “separating (1) the parts that represent the model of the underlying
    application domain from (2) the way model is presented to the user and (3) the
    way user interacts with it”. The authors, also use the term “MVC metaphor”, point
    out that their approach would allow programmers to “write an application model
    by first defining new classes that would embody the special application-specific
    information.


    Notice that the model is defined as classes that capture the required domain information.
    We call them model classes.


    In this original MVC approach, there is no well-defined concept of a user interface
    (UI). The ‘view’ is defined as comprising the output under a UI, while the user
    input is separated from it and submitted under the term ‘controller’. This does
    not reflect how a UI is really organized: by combining certain forms of application
    output with certain forms of user input like two sides of the same coin. A general


