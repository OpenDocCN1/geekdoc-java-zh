    # 13.4.3 Using Java’s Date and Calendar classes


    In Java, we have two built-in classes for dealing with date-times: java.util.Calendar
    is an abstract class, which provides methods for dealing with timestamps and has
    concrete subclasses for specific calendars like GregorianCalendar. Notice that
    an instance of Calendar is not a calendar, but a wrapped date-time value. For
    getting a specific date or time, we can invoke the constructor of a suitable calendar
    class with the desired values:


    ```

    Calendar birthDate = new GregorianCalendar( 2017,3,26);

    Calendar birthTime = new GregorianCalendar (

    2017,3,26, 18,32);

    java.util.Date is a class that represents milliseconds since 1 January, 1970,
    UTC. Of the specific form of the methods and constructors of the Date class have
    been deprecated (because they do not support internationalization), but not the
    class itself. It is recommended to avoid using it and use a suitable Calendar
    subclass instead of Date, or if an instance of Date is needed, create a Date object
    by creating a Calendar object and converting it to a Date object with the help
    of the getTime method:

    Calendar calendarDateTime = new GregorianCalendar (

    2017,3,26);

