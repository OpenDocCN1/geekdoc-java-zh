  md: '# 8.3 Make a JavaScript Class Model 137


    +   b. a setter method that invokes the check function and is be used for setting
    the value of the property.


    +   2. In the user interface ("view") code we have to take care of

    aa. responsive validation on user input for providing immediate feedback to the
    user,

    b. validation on form submission for preventing the submission of flawed data
    to the model layer.


    For improving the break-down of the view code, we introduce a utility method (in
    lib/util.js) that fills a select form control with option the elements of which
    is retrieved from an entity table such as Book.instances.This method is used in
    the setupUserInterface method of both the updateBook and the deleteBook cases.


    Checking the constraints in the user interface (UI) on user input is important
    for providing immediate feedback to the user. But it is not enough to perform
    validation only in the UI, this could be circumvented in a distributed web application
    where the users in the browser of a front-end device where the application''s
    data is managed by a back-end component on a remote server. Consequently, we need
    multiple constraint validation, first in the UI on (or change) and on form submission,
    and subsequently in the model layer before saving/sending data to the persistent
    data store. And in an application based on a DBMS we may use a third round of
    validation before persistent storage using the validation mechanisms of the DBMS.
    This is a must, when the application''s database is shared with other apps.


    Our proposed solution to this multiple validation problem is to keep the constraint
    validation code in special check functions in the model classes and invoke these
    functions in the UI on user input and on form submission, as well as in the create
    and update data management methods of model class invoking the setters. Notice
    that referential integrity constraints (and other relationship constraints) may
    be violated by a delete operation, but in our single-class example we don''t have
    to consider this.


