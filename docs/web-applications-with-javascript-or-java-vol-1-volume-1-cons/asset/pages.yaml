    JavaScript has better support for functional programming. For instance, it supports
    "closures", which are function execution contexts. Java only supports a limited
    version of closures for anonymous classes and "lambdas".


    # 5 Good Programs Are: Effective, Robust, Efficient and Maintainable


    ... observed by Nick Gonzalez¹. A good program is effective: it solves the problem
    it is supposed to solve. A good program must not crash when it receives bad inputs
    from users; it is robust. Good programs are efficient: they do the job it is supposed
    to do quickly. Since the requirements for a program may change over time, a good
    program should be maintainable, so that it can be modified when requirements change.
    A program can only be maintainable, if its code is written in a clear manner.


    > Any damn fool can write code that a computer can understand, the trick is to
    write code that humans can understand. (Martin Fowler in The Program Rules²)


    Code is often "necessarily complicated, convoluted, disorganized, and stitched
    together with disdain", as observed in a post by Santiago L. Valdarrama³ who recommends
    using comments when necessary, only to explain things that cannot be made clear
    enough, but rather make your code reveal its intention through the use of better
    names, proper structure, and correct indentation.


