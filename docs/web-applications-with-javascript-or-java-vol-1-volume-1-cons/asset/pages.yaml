  md: "# 206 11 Implementing Enumeration Attributes in a Plain JS Web App\n\ntion\
    \ sub-elements of the select. If the attribute is rendered as a radio button group,\
    \ we can enforce a choice, and thus the mandatory value constraint, in the create\
    \ case by setting the checked attribute of the first radio button to true and\
    \ not allowing the user to uncheck a button. In this way, if the user doesn't\
    \ check any button, the first one is the default choice.\n\nIn the case of an\
    \ optional single-valued enumeration attribute rendered as a single-selection\
    \ list, we need to include an empty or void option (e.g., in the form of a string\
    \ like \"-\"). If the attribute is rendered as a radio button group, we do not\
    \ check any initially and need to allow the user to uncheck a button with a mouse\
    \ click in a click event listener.\n\nIn the case of a multi-valued enumeration\
    \ attribute rendered as publicationForms rendered as a multiple-selection list\
    \ or checkbox group, we need to check if the user has at least one option. Whenever\
    \ the user selects or unselect a select element, a change event is raised by the\
    \ browser, so we can implement the responsive value constraint validation as an\
    \ listener for change events on the select element, testing if the selectOptions\
    \ is empty. If the attribute is rendered as a checkbox group, we need an event\
    \ listener for click events when it is non-empty, as shown in the following example\
    \ code fragment:\n\n```\nsetupInterface: function () {\n\n  // check mandatory\
    \ value constraint for checkbox group\npubFormsFieldSetEl.addEventListener(\"\
    click\", function () {\n    var val = pubFormsFieldSetEl.getAttribute(\"data-value\"\
    );\n    formEl.publicationForms[].setCustomValidity(\n      (!val || Array.isArray(val)\
    \ && val.length === 0) ?\n      \"At least one publication must be selected!\"\
    :\"\"\n    );\n  });\n}\n```\n\nNotice that the HTML5 constraint validation API\
    \ does not allow to indicate a constraint violation on a fieldset element (the\
    \ container element of a widget). As a workaround, we use the first checkbox element\
    \ of the publicationForms choice widget, which can be accessed with formEl.publicationForms[],\
    \ for invoking the setCustomValidity method that indicates a constraint violation\
    \ if its argument is a non-empty (message) string."
