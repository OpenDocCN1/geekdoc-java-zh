    Notice that distinction between maps, records and entity tables is a purely conceptual
    distinction, and not a syntactic one. For a JavaScript engine, `firstName:"Tom",
    lastName:"Smith"` and `{"one":"two":2,"three":3}` are just objects. Conceptually,
    `firstName:"Tom", lastName:"Smith"` is a record because `firstName` and `lastName`
    are intended to denote properties (or fields), where `{"one":1,"two":2,"three":3}`
    is a map because `one` and `two` are not intended to denote properties/fields,
    but are just arbitrary strings used as keys for a map.


    Making such conceptual distinctions helps in the logical design of a program,
    and mapping them to better understand the syntactic distinctions, even if they
    are not interpreted computational meaning of the code and improves their readability.


    # 2.1.8 Procedures, methods and functions


    Generally, a (parametrized) procedure is like a sub-program that can be called
    (with a certain number of arguments) any number of times from within a program.
    When a procedure returns a value, it is called a function. In OOP, procedures
    are called methods, if they are defined in the context of a class or an object.


    In JavaScript, JS functions are special JS objects, having an optional `name`
    property and a `length` property providing any number of parameters. If a variable
    `v` references a function it can be tested with


    ```

    if (typeof v === "function") {...}

    ```


    Being JS objects implies that JS functions can be stored in variables, passed
    as arguments, returned by functions, have properties and can be changed dynamically.
    Therefore, JS functions are first-class citizens, and JavaScript can be viewed
    as a functional programming language.


    The general form of a JS function definition is an assignment of a JS function
    expression to a variable:


    ```

    var myMethod = function nameOfMethod(params) {

    }

    ```'
