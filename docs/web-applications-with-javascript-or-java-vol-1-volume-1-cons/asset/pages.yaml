    ```

    ```


    In the case of a code list, we can use both the codes or the labels as the names
    of enumeration literals, but using the codes seems preferable for brevity (GenderEL.M,
    GenderEL.F, etc.). For displaying the value of an enumeration attribute, it’s
    an option to show not only the label, but also the code, like “male (M)”, provided
    that there is sufficient space. If space is an issue, only the code can be shown.


    # 10.1.3 Record enumerations


    A record enumeration defines a record type with a unique field designated to provide
    the enumeration literals, and a fixed list of records of that type. In general,
    a record is defined by a set of field definitions (in the form of primitive datatype
    attributes), such that one of the unique fields is defined to be the enumeration
    literal field, and a set of operation definitions.


    Unfortunately, record enumerations, as the general form of an enumeration datatype,
    are not supported by the current version of UML (2.5) where the general form of
    an enumeration is defined as a special kind of datatype (with optional field and
    operation definitions) having an additional list of unique strings as enumeration
    literals (shown in a fourth compartment). The UML definition neither allows designating
    one of the unique fields as the enumeration literal field, nor does it allow populating
    an enumeration with records.


    Consequently, for showing a record enumeration in a UML class diagram, we need
