    The Book.checkIsbnAsId method discussed in the previous sub-section is designed
    to be used in combination with a controller so the user gets an error message
    when trying to duplicate a Book record (i.e., if the isbn value is already used
    in an existing record). However, if the Book.create method is used directly (i.e.
    by another piece of code, where the uniqueness constraint is not performed by
