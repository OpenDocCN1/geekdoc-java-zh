  md: '# 6.4 MVC Web Applications


    The MVC terminology is still widely used today, especially by web application
    frameworks, but with different meanings ascribed to “M”, “V” and “C”. In some
    approaches it is extended by adding another layer, called “view model” abbreviated
    as “VM”, which we will discuss later in the course.


    In the original MVC proposal, the “model” consists of model classes implementing
    the app’s data model, while many MV(C) frameworks do not include any concept of
    model classes, but rather to refer to data objects (or records) as “models”. Also
    the term “controller” is ambiguous. In the original MVC proposal, the term “controller”
    refers to the handling of UI events including user inputs. Today, it typically
    refers to all the glue code needed for mediating between the model and the view,
    including the code for routing.


    In summary, in today’s frameworks, the term “model” vaguely refers to the data
    of an app, while the “view” denotes the app’s code for the user interface, which
    is based on CSS-styled HTML forms and DOM events, and the “controller” denotes
    the (glue) code that is in charge of mediating between the view and model. There
    is widespread agreement that


    +   1. the model should be independent of the view and the controller, implying
    that the model must neither invoke the view nor the controller (in the model code,
    there should be no calls of any view or controller procedures);

    2. the controller may invoke both the model and the view;

    3. the view may invoke the controller.


    However, as shown in the following diagram, it is not clear if the view may invoke
    the model, or if it needs to route any calls of model procedures via the controller.
    Both approaches are being used in practice. The first approach, where model procedures
    can be called from the view, is simpler and to a leaner controller.


    ![](img/42f1421051423f5b9e022255ae58c362_129_0.png)


    The second approach, where the view is decoupled from the model by routing all
    calls to it via the controller, is called the mediating-controller MVC approach,
    shown in the following diagram. It has the advantage of fewer dependencies and
    providing better support for model-view synchronization based on data-bindings.'
