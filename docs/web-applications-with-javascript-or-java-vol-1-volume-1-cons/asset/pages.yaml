  md: '# 4 Building a Minimal Web App with Java EE in Seven Steps


    In this chapter, we show how to build a simple Java EE application using the Java
    Persistence API (IPA) for object-to-storage mapping and Java Server Faces (JSF)
    as the user interface (or "view") technology. Such an application requires a web
    server that supports the Java EE specifications Servlets, Java Expression Language
    (EL), JPA and JSF, as the open source web server Tomcat/TomEE (pronounced "Tommy").
    In addition to the Java code executed on the back-end the TomEE web server, a
    Java EE app also consists of HTML, CSS and possibly some auxiliary JavaScript
    code that is executed by a web browser running on the user''s front-end computer.
    Essentially all data processing is performed on the back-end, and the front-end
