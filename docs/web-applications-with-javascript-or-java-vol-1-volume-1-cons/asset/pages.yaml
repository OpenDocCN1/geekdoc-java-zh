  md: '# 9 Implementing Constraint Validation in a Java EE Web App


    The minimal web app that we have discussed in Part 1 has been limited to support
    the minimum functionality of a data management app only. For instance, did it
    not take care of preventing the user from entering invalid data into the app''s
    data-base. In this chapter, we show how to express integrity constraints in a
    Java EE entity class, and how to have constraints automatically validated on critical
    life cycle events of entity objects with JPA, and on form submission with JSF.


    # 9.1 Java Annotations for Persistent Data Management and Constraint Validation


    The integrity constraints of a distributed app have to be checked in model classes
    and in the underlying database, and possibly also in the UI. However the requirement
    for three-fold validation should not imply having to define the constraints three
    times in different languages: Java, in SQL and HTML5/JavaScript. Rather, the preferred
    approach is to define the constraints only once, in the model class, and reuse
    these constraint definitions also in the underlying database and in the UI. Java
    EE supports this goal to some degree. There are two types of constraint annotations:


    +   1. JPA constraint annotations, specify constraints to be used for generating
    the database schema (with CREATE TABLE statements) such that they are then checked
    by the DBMS, and not by the Java runtime environment;

    2. Bean Validation annotations specify constraints to be checked by the Java runtime
    environment


    In this section we discuss how to use some of the predefined constraint annotations
    and how to define a custom constraint annotation for the year property of the
    Book class, since its value is an upper bound defined by an expression (''next
    year'').


    # 9.1.1 JPA constraint annotations


    The JPA constraint annotations specify constraints to be used by the underlying
    database management system after generating the database schema, but not for Java
    validation. Consider the @Id annotation in the following definition of an entity
    Item:'
  merge: -1
