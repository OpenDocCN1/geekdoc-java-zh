  md: '# 7.2 Integrity Constraints


    Integrity constraints (or simply constraints) are logical conditions on the data
    of an app. They may take many different forms. The most important type of constraints,
    **property constraints**, define on the admissible property values of an object.
    They are defined for an object type (or class) such that they apply to all objects
    of that type. We concentrate on the most important cases of constraints:


    | | |

    | --- | --- |

    | String Length Constraints | require that the length of a string value for an
    attribute is less than a certain maximum number, or greater than a minimum number.
    |

    | Mandatory Value Constraints | require that a property must have a value. For
    instance, a person must have a name, so the name attribute must not be empty.
    |

    | Range Constraints | require that an attribute must have the value space of the
    type that has been defined as its range. For instance, an integer attribute must
    not have the value "aaa" |

    | Interval Constraints | require that a numeric attribute be in a specific interval.
    |

    | Pattern Constraints | require that a string attribute''s value match a certain
    pattern defined by a regular expression. |

    | Cardinality Constraints | apply to multi-valued properties, only, and require
    that the cardinality of a multi-valued property set is not less than a minimum
    cardinality or not greater a given cardinality. |

    | Uniqueness Constraints | require that a property''s value is unique among all
    instances of the given object type. |

    | Referential Integrity Constraints | require that the values of a reference property
    refer to an existing object in the range of the reference property. |

    | Frozen Constraints | require that the value of a property must not be changed
    after it has been assigned initially. |


    The visual language of UML class diagrams supports integrity constraints either
    in a special way for special cases (like predefined keywords), or in the general
    case, with the help of invariants, and in the *Object Constraint Language (OCL)*
    shown in a special type of rectangle attached to the model element concerned.
    We use UML diagrams for modeling constraints in *design models* that are independent
    of a specific programming language or technology platform.


    UML class diagrams provide special support for expressing multiplicity (or cardinality)
    constraints. This type of constraint allows to specify a lower multiplicity (minimum
    cardinality) or an upper multiplicity (maximum cardinality), or both, for a property
    or an association end. In UML, this takes the form of a multiplicity expression
    `1..u` where the lower multiplicity `1` is a non-negative integer and the upper
    multiplicity `u` is either a positive integer smaller than `1` or the special
    value `*`'
