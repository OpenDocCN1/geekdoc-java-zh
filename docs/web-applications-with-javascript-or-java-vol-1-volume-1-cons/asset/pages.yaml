  md: '# 2.1 JavaScript Basics 27


    Any code pattern for defining classes in JavaScript should satisfy five requirements.
    First of all, (1) it should allow to define a *class name*, a set of (instance-level)
    *properties*, preferably with the option to keep them ''private'', a set of (instance-level)
    *methods*, and a set of *class-level* properties and methods. It''s desirable
    that properties can be defined with a range/type, and with other meta-data, such
    as constraints. There should also be two introspection features: (2) an *is-instance-of
    predicate* that can be used for checking if an object is a direct or indirect
    instance of a class, and (3) an instance-level property for retrieving the *direct
    type* of an object. In addition, it is desirable to have a third introspection
    feature for retrieving the *direct type* of a class. And finally, there are two
    inheritance mechanisms: (4) *property inheritance* and (5) *method inheritance*.


    In addition, it is desirable to have support for multiple inheritance and multiple
    classifications, for allowing objects to play several roles at the same time by
    instantiating role classes.


    There was no class definition syntax before ES6. Different code patterns for defining
    classes in JavaScript have been proposed and are being used in different frameworks.
    But they do not satisfy the five requirements above. The two most important approaches
    for defining classes are:


    +   1. In the form of a **constructor** factory that achieves method inheritance
    via the prototype chain and allows to create new instances of a class with the
    help of the **new** operator. This is the classical approach recommended by Mozilla
    JavaScript Guide¹¹. This is also the approach implemented in ES6 with the `class`
    definition syntax.


    +   2. In the form of a **factory** object that uses the predefined `Object.create`
    method for creating inheritance mechanisms of a class. In this approach, the prototype
    chain method inheritance is replaced by a “copy & append” mechanism. Eric Elliott¹²
    argued that factory-based classes are a viable alternative to constructor-based
    classes in JavaScript (in fact, he even condemns the use of classical inheritance
    with constructor-based classes, throwing out the baby with the water bath).


    When building an app, we can use both kinds of classes, depending on the requirements
    of the app. Since we often need to define class hierarchies, and not just single
    classes, we have to make sure, that we don''t mix these two alternative approaches
    within the same hierarchy. The factory-based approach, as exemplified by Babel¹³,
    has many advantages, which are summarized in Table 2.2, the constructor-based
    approach enjoys the advantage of higher performance object creation.


    > 11 http://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Details_of_the_Object_Model

    12 http://chimera.labs.oreilly.com/books/123400000262/ch03.html#fluentstyle_javascript

    13 http://web-engineering.io/tech/modelCLLassjs/validation-tutorial.html'
