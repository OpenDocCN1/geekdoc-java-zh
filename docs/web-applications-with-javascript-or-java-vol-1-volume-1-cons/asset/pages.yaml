    # 10.2 Enumeration Attributes


    An enumeration attribute is an attribute that has an enumeration as its range.


    In the interface, an output field for an enumeration attribute would display the
    enumeration label, rather than its internal value, the corresponding enumeration
    index.


    For allowing user input to an enumeration attribute, we can use the UI concept
    of a (drop-down) select list, which may be implemented with an HTML select element,
    such that the enumeration labels would be used as the text content of option elements,
    and enumeration indexes would be used as their values. We have to distinguish
    between single-valued and multi-valued enumeration attributes. In the case of
    a single-valued enumeration attribute, we use a standard select element. In the
    case of a multi-valued enumeration attribute, we use a select element with the
    HTML attribute setting "multiple".


    In the case of a single select element for an optional enumeration attribute,
    we need to include in its options element like “—” for indicating that nothing
    has been selected. The UI page for CRUD use case “Create” shows “—” as the initially
    selected option.


    For usability, the multiple selection list can only be implemented with an HTML
    select list, if the number of enumeration literals does not exceed a certain threshold
    (like 20), which depends on the number of options the user can see on the screen
    without scrolling.


    For user input for a single-valued enumeration attribute, a radio button group
    can be used instead of a selection list, if the number of enumeration literals
    is sufficiently small (say, not larger than 7). A radio button group is implemented
    with an HTML fieldset element acting as a container of labeled input elements
    of type “radio”, all having the same name, which is normally equal to the name
    of the represented enumeration attribute.


    For user input for a multi-valued enumeration attribute, a checkbox group can
    be used instead of a multiple selection list, if the number of enumeration literals
    is sufficiently small (say, not larger than 7). A checkbox group is implemented
    with an HTML fieldset element acting as a container of labeled input elements
    of type “checkbox”, all having the same name, which is normally equal to the name
    of the represented enumeration attribute.'
