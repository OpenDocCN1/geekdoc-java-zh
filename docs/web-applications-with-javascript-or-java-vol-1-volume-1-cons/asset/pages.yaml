    # 9.8.2 JSF custom validators


    An alternative approach to object-level validation is to using JSF custom validators.
    They have the advantage that they are directly supported in facelets, but the
    downside of this approach is that it violates the onion architecture by defining
    business rules in the UI instead of defining them in the model.


    For our example, the validator for the Author class that is responsible for validating
    dateOfDeath comparing it with dateBirth is shown below:


    ```

