  md: "# 10.3 Enumerations in Computational Languages\n\nDefining enumerations is\
    \ directly supported in information modeling languages (such as in UML Class Diagrams),\
    \ in data schema languages (such as XML Schema, but not in SQL), and in many programming\
    \ languages (such as in C++ and Java, but not in JavaScript).\n\n# 10.3.1 Enumerations\
    \ in SQL\n\nUnfortunately, standard SQL does not support enumerations. Some DBMS,\
    \ such as MySQL and Postgres, provide their own extensions of SQL column definitions\
    \ in the CREATE TABLE statement allowing to define enumeration-valued columns.\n\
    A MySQL enumeration² is specified as a list of enumeration labels with the keyword\
    \ ENUM within a column definition, like so:\n\n```\nCREATE TABLE people (\n  name\
    \ VARCHAR(40),\n  gender ENUM('MALE','FEMALE', 'UNDETERMINED')\n);\n```\n\nA Postgres\
    \ enumeration³ is specified as a special user-defined type that can be used in\
    \ column definitions:\n\n```\nCREATE TYPE GenderEL AS ENUM ('MALE','FEMALE', 'UNDETERMINED');\n\
    CREATE TABLE people (\n  name text,\n  gender GenderEL\n);\n```\n\n# 10.3.2 Enumerations\
    \ in XML Schema\n\nIn XML Schema, an enumeration datatype can be defined as a\
    \ simple type restricting the primitive type xs:string in the following way:\n\
    \n```\n<xs:simpleType name=\"BookCategoryEL\">\n  <xs:restriction base=\"xs:string\"\
    >\n    <xs:enumeration value=\"NOVEL\"/>\n    <xs:enumeration value=\"BIOGRAPHY\"\
    />\n    <xs:enumeration value=\"TEXTBOOK\"/>\n  </xs:restriction>\n```\n\n+  \
    \ 2 https://dev.mysql.com/doc/refman/5.7/en/enum.html\n3 http://postgresguide.com/sexy/enums.html"
