    |...) | 0.1 |

    constructor


    Figure 2.1 The built-in JavaScript classes Object and Function.


    Notice that we can retrieve the prototype of an object with Object. getPrototypeOf(o),
    which is an official ES5 alternative to o.__proto__.'
