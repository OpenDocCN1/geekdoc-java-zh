    form submission content, the response contains the already existing values because
    these values are known in this case. This consideration shows that it is important
    to choose the right bean scope.


    # 9.6 Defining a Custom Validation Annotation


    One integrity constraint we have to consider is the allowed values of the year,
    which must be in the interval [1459, nextYear()] where nextYear() is a function
    invocation expression. We may have the idea to use @Min and @Max specify the constraint,
    but this is not possible because the @Max annotation (as well as any other annotation)
    does not allow expressions, but only data literals. So, while we can express the
    interval''s lower bound with @Min( value=1459), we need another solution for expressing
    the upper bound.


    Fortunately, the Bean Validation API allows to define custom validation annotations
    with custom code performing the constraint checks. This means we are free to express
    any kind of validation logic in this way. Creating and using a custom annotation
    requires the following steps:


    +   1. Create the annotation UpToNextYear with the following code:

    @Target({ElementType.FIELD, ElementType.METHOD})

    @Retention(RetentionPolicy.RUNTIME)

    @Constraint(validatedBy = UpToNextYearImpl.class)

    public interface UpToNextYear {'
