  md: "# 14.2 Materialized Derived Properties\n\nIf the value of a derived property\
    \ is computed whenever there is a change in the value of one of the properties\
    \ on which it depends, the derived property is called materialized. The value\
    \ of such a materialized property is stored, and the getter method retrieves this\
    \ stored value. When using JavaScript's get/set methods in an ES6 class definition,\
    \ this means that we define a get method for retrieving the value of the internal\
    \ attribute _initials, but no set method. The computation of the materialized\
    \ derived property's value is performed in the setters of the attributes on which\
