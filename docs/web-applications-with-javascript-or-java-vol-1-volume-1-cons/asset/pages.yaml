    A Book instance is deleted from the entity table Book.instances by first testing
    the table has a row with the given key (line 2), and then applying the JavaScript
    builtin delete operator, which deletes a slot from an object, or from a map:


    ```

    Book.destroy = function (isbn) {

    if (Book.instances["Book " + isbn]) {

    console.log("Book " + isbn + " deleted");

    delete Book.instances[isbn];

    } else {

    console.log("There is no book with ISBN " + isbn + " in the database!");

