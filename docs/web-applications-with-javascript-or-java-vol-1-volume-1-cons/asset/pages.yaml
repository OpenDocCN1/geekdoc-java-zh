    # 4.3.5 Deleting a Book instance


    A book entity can be deleted from the database as shown in the following example
    code:


    ```

    public static void delete(EntityManager em,

    UserTransaction ut, String isbn) throws Exception {

    ut.begin();

    Book book = em.find(Book.class, isbn);

    em.remove(book);

    ut.commit();

    }

    ```


    To delete an entity from the database, we need to retrieve it with the help of
    the find method as in the update case. Then, the remove method has to be invoked
    by the ‘entity manager’, and finally the transaction is completed with ut.commit().


