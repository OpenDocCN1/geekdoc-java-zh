  md: '# 2.1 JavaScript Basics 15


    All numeric data values are represented in 64-bit floating point format with an
    optional exponent (like the numeric literal 3.1e10). There is no explicit type
    distinction between integers and floating points. If a numeric expression cannot
    be evaluated to a number, its value is NaN ("not a number"), which can be tested
    with the built-in predicate `isNaN(expr).


    Unfortunately, a built-in function, `Number.isInteger`, for testing if a number
    is an integer has only been introduced in ES6, or a polyfill is needed for using
    it in browsers that do not support it. For making sure a numeric value is an integer,
    or a string representing it to an integer, one has to apply the predefined function
    `parseInt`. A string representing a decimal number can be converted to this number
    with `parseFloat`. For converting a number to a string, the best method is using
    `String(n).


    There are two predefined Boolean literals, `true` and `false`, and the Boolean
    operators are the exclamation mark ! for NOT, the double ampersand `&&` for AND,
    and the double pipe `||` for OR. When a non-Boolean value is used in a condition,
    or as an operand of a Boolean expression, it is implicitly converted to a Boolean
    value according to the following rules: The empty string, the literal 0, as well
    as `undefined` and `null`, are mapped to `false`, and all other values are mapped
    to `true`. This conversion can be performed explicitly with the help of the double
    negation operation, like in the equality test `!!undefined === false`, which evaluates
    to true.


    In addition to strings and Boolean values, also *dates* and times are important
    types of primitive data values, although they are not implemented as primitive
    values. `Date` objects do, in the form of wrapper objects instantiating `Date`.
    Notice that `Date` objects store time represented internally as the number of
    milliseconds since January 1, 1970 UTC. For converting the internal value of a
    `Date` object to a human-readable string, we have several options. The most important
    ones are either the standard format of ISO/date strings of the form "2015–01–27",
    or localized formats of date/time strings (examples). When `x` is an instance
    of `Date`, `x.toISOString()` provides the ISO date/time string, and `x.toLocaleString()`
    provides the localized date/time string. Given any date string, `DS` or localized,
    new `Date(ds)` creates a corresponding date object.


    For testing the *equality* (or inequality) of primitive data values, use the triple
    equality symbol `===` (and `!==`) instead of the double equality symbol `==`.
    Otherwise, for instance, the number 2 would be the same as the string "2", since
    the condition `2 == "2"` evaluates to *true* in JavaScript.


