  md: '# 8 1 A Quick Tour of the Foundations of Web Apps


    Each form control has an initial value and a current value, both of which are
    strings. The initial value is specified with the element''s value attribute, except
    for the initial value of a textarea element, which is given by its initial contents.
    The control''s current value is first set to the initial value. Thereafter, the
    control''s current value may be modified through user interaction or scripts.
    When a form is submitted for processing, some controls have their name with their
    current value and these pairs are submitted with the form.


    Labels are associated with a control by including the child element within a label
    (implicit labels), or by giving the control an id value and referencing this ID
    in the for attribute of the label element (explicit labels).


    In the user interfaces of our "Getting Started" applications, we only need four
    types of controls:


    +   1. single line input fields created with an <input name="" />

    2. single line output fields created with an <output name="" /> element,

    3. push buttons created with a <button type="button">...</button> element,

    4. dropdown selection lists created with a select element of the following form:

    <select name="">

    <option value="value1"> option1</option>

    <option value="value2"> option2</option>

    ...

    </select>


    An example of an HTML form with implicit labels for creating such a user interface
    is


    ```

    <form id="Book">

    <p><label>ISBN: <output name="isbn" /></label></p>

    <p>Title: <input name="title" /></label></p>

    <p><label>Year: <input name="year" /></label></p>

    <p><button type="button">Save</button></p>

    </form>

    ```


    In an HTML-based data management user interface, we have a correspondence between
    the different kinds of properties defined in the model classes of an app and the
    form controls used for the input and output of values. We distinguish between
    various kinds of model class attributes, which are mapped to various kinds of
    form fields. This mapping is also called data binding.


    In general, an attribute of a model class can always be represented in the user
    interface by a plain input control (with the default type="text"), no matter datatype
    has been defined as the range of the attribute in the model class. However, in
    special cases, other types of input controls (for instance, type="date"), or other
    widgets, may be used. For instance, if the attribute''s range is an enumeration,
    a select control or, if the number of choices is small enough (say, less than
    8), a radio button group can be used.'
