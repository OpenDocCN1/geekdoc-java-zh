    sketch out incomplete pictures when they convey anything at all. To use language
    is to enter the territory of categories, which are as necessary as they are dangerous.


    Categories leak. I was going to write that all categories leak, but there are
    surely things that can be said of prime numbers or stars that are true without
    exception. All muskrats are mammals, and all US presidents to date have been men,
