  md: '# # An Insurrectionary Year

    (2014)


    I have been waiting all my life for 2014 has brought. It was a year of feminist
    insurrection against male violence: a year of mounting refusal to be silent, refusal
    to let our lives and torments be erased or dismissed. It has not been a harmonious
    tune, but harmony is often purchased by suppressing those with something to say.
    It was loud, discordant, and maybe transformative, because important things were
    said—not necessarily new, but said more emphatically, by more of us, and heard
    as before.


    It was a watershed year for women, and for feminism, we refused to accept the
    pandemic of violence against women—the beatings, the harassment on the streets
    and the threats online. Women''s voices achieved a power that seemed unprecedented,
    and the whole conversation changed. There were concrete advances—such as California''s
    "Yes Means Yes" campus sexual consent law—but those were a comparatively small
    consequence of enormous change in the collective consciousness. The problems have
    not been merely legal—there have been, for example, laws against violence-beating
    since the nineteenth century, which were rarely enforced until the late 1970s
    and still can''t halt the epidemic of domestic violence now. The fundamental problem
    is cultural. And the culture—many cultures, around the world—is beginning to change.


    You can also think of 2014 as a parody of these little calendars with the flower
    or the gemstone of the month. January was not for garnets; it was mainly talking
    about online threats, and about Dylan Farrow''s testimony that her adoptive father
    had molested her when she was. Seven The conversation in April was about kidnapped
    Nigerian schoolgirls, and a Silicon Valley multimillionaire caught on video beating
    his girlfriend. May wasn''t; it was the massacre of six people in Isla Vista,
    California, by a young misogynist and the birth of #yesallwomen, perhaps the most
    catalytic in a year of powerful protests online about women and violence.

    September was taurmaline; it was the release of a videotape that showed the American
    football player Rice Rice knocking out his fiancée in an elevator, and a renewed
    public conversation about domestic violence, accompanied by the hashtags #whileleft
    and #whystayed. renewed public conversation about domestic violence, accompanied
    by the hashtags #whileleft and #whistayed. October brought,'
