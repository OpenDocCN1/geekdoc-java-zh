  md: '(I use now, framed as a question, to stymie some of the questioners: “Would
    you ask a man that?” Such questions seem to come out of the sense that there are
    not women, the 51 percent of the human species who are diverse in their wants
    and as mysterious in their desires as the other 49 percent, only Woman, who must
    marry, must breed, must let men in and babies out, like some elevator for the
    species. At their heart these questions are not questions but assertions that
    we fancy ourselves individuals, charting our own courses, are wrong. Brains are
    individual phenomena producing wildly varying products; uterus bring forth first
    kind of creation.


    As happens, there are many reasons why I don''t have children: I am very good
    at birth control; though I love children and adore aunthood, I also love solitude;
    I was raised by unhappy, unkind people, and I wanted never to replicate their
    form of parenting nor create human beings who might feel me about the way that
    I sometimes felt about my begetters; the planet is unable to sustain more first-world
    people, and the future is uncertain; and I really wanted to write books, which
    as Ive done it is a fairly consuming vocation. I''m not dogmatic about having
    kids. I might have had them under other circumstances and been fine—as I am now.


    Some people want kids but don''t have them for various private reasons, medical,
    emotional, financial, professional; others don''t want kids, and that''s not anyone''s
    business either. Just because the question to be answered doesn''t mean that anyone
    is obliged to answer it, or that it ought to be asked. The interviewer''s question
    to me was indecent, because it presumed that women should have children, and that
    a woman''s reproductive activities were naturally public business. More fundamentally,
    the question assumed that there was only one way for a woman to live.


    But even to say that there''s one way may be putting the case out optimistically,
    given that mothers are consistently wanting, too A mother may be treated like
    a criminal for leaving her child alone for five minutes, even if child''s father
    has left it for several years. Some mothers have told me that having children
    caused them to be treated as bovine nonintellects who should be disregarded. A
    lot of women I know have been told that they cannot be taken seriously professionally
    because they will go off and reproduce at some point. Many mothers who succeed
    professionally are presumed to be neglecting someone. There is no'
