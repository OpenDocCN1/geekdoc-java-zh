  md: 'the twentieth century and after—against colonialism, against racism, against
    misogyny, against the innumerable enforced silences homophobia imposed, and so
    much more. We know that in the United States class was leveled out to some extent
    in the twentieth century and then reinforced toward the end, through income inequality
    and the withering away of social mobility and the rise of a new extreme elite.
    Poverty silences.


    Who has been heard we know; they are the well-mapped islands, the rest are the
    unnamed sea of unheard, uncharted history. Many over the centuries were heard
    and loved, and their words disappeared in the air as soon as they were spoken
    but root in minds, contributed to the culture, like something composting into
    rich earth; new things grew from words. Many others were silenced, excluded, ignored.
    The earth is sevententh water, but the ratio of silence to voice is far greater.
    If libraries hold all the stories that have been told, there are ghost libraries
    of all the stories that have not. The ghosts outnumber the books by some unimagin
    vast sum. Even those who have been audible have often earned the privilege through
    strategic silences or the inability to hear voices, including their own.


    The struggle of liberation has been in part to create the conditions for the formerly
    silenced to speak and be heard. An Englishman tells me that Britain has a growing
    prison population of old men, because countless victims whom no one was willing
    to hear before are now telling of sexual abuse. The most notorious British case
    is of BBC entertainer Jimmy Savile, who was knighted and lauded and made into
    a celebrity. He died before more than 450 people charged with sexual abuse, mostly
    young women but also younger boys and adult women. Four hundred and fifty people
    were not heard, who perhaps did not think they had the right to speak out or even
    to object or to be believed. Or rather knew they lacked those rights, that they
    were voiceless.


    John Lydon, as Johnny Rotten of the Sex Pistols, said to the BBC of Savile, in
