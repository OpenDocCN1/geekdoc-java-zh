  md: '# 80 Books No Woman Should Read

    (2015)


    A few years ago, Esquire put together a list that keeps rising from the dead like
    a zombie to haunt the Internet. “The 80 Best Books Every Man Should Read” is a
    reminder that the magazine is for men, and that if many young people now disavow
    the binaries of gender, they are revolving against much more established people
    building up like a Iron Curtain across humanity.


    Course, women''s magazines like Cosmopolitan have provided decades of equally
    troubling instructions on how to be a woman. Maybe it says a lot about the fragility
    of gender that instructions on the two main ones have been issued monthly for
    so long. Should men read different books than women? In this list they shouldn''t
    even read books by women, except for one by Flannery O’Connor amongst seventy-nine
    books by men.


    The author annot O’Connor''s Good Man Is Hard to Find and Other Stories with a
    quote: “She would be of a good woman . . . if it had somebody to shoot her every
    minute of life.” Shoot. Which goes nicely with the comment for John Steinbeck''s
    The Grapes of Wrath:“Because it’s all about the titty.” In other words, books
    are instructions; they read them to be a man, and that’s why they men need their
    own list. And what is a man? The comment on Jack London’s Call of the Wild tells
    us, “A book about dogs is equally a book about men. Bitches are crazy men, I guess.


    Scanning the list, which is full of all the manliest books ever, lots of war books,
    only one by an out gay man, I was reminded that it’s hard to be a woman it’s harder
    in many ways to be a man, that gender’s supposed to be incessantly defended and
    demonstrated through acts of manliness. I looked at that list and with unbidden
    the thought arose, No wonder there are so many murderers. Which are the extreme
    expression of being a man when the job is framed this way, though, happily, many
    men have more graceful, empathic ways of being in the world.


