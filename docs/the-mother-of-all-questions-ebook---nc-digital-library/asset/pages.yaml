    how rape jokes are always funny, and an audience member shouted, “Rape jokes are
    never funny.” Tosh reportedly responded by saying, “Wouldn’t it be funny if that
    girl raped by like five girls right now?” The woman who had shouted at her then
    blogged about it, and her blog the incident got a lot of attention back then.
    It was an epoch ago, by what’s happened since with feminism and comedy.


    That rape jokes aren''t funny as an axiom that rape jokes are at the expense of
    the victim. They are too funny insisted upon by some of the tellers and fans of
    such jokes. Something horrible happened to you, babhababba! I''m going to violate
