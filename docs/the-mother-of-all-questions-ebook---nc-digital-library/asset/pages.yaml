  md: '# About Haymarket Books


    Haymarket Books is a nonprofit, progressive book distributor and publisher, a
    project of the Center for Economic Research and Social Change. We believe that
    activists need to take ideas, history, and politics into the many struggles for
    social justice today. Learning the lessons of past victories, as well as defeats,
    can arm a new generation of fighters for a better world. As Karl Marx said,“The
    philosophers have merely interpreted the world; the point, however, is to change
    it.”


    We could not succeed in our publishing efforts without the generous financial
    support of our readers. Learn more and shop our full catalog online at www.haymarketbooks.org.'
