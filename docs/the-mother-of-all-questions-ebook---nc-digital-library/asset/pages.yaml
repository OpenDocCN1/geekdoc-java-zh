  md: 'Even those who live out the best version of the familiar story might not find
    happiness as their reward. This is not necessarily a bad thing. I know a woman
    who was lovingly married for seventy years. She has had a long, meaningful life
    that she has lived according to her principles, and she is loved and respected
    by her descendants. But I would not call her happy; her compassion and concern
    for the future have given her a respondent worldview. What she has instead of
    happiness requires better language to describe. There are entirely different criteria
    for a good life that might matter more to a person—loving and being loved or having
    satisfaction, honor, meaning, depth, engagement, hope.


    Part of my endeavor as a writer is to find ways to value what is elusive and overlooked,
    to describe nuances and shades of meaning, to celebrate public life and solitary
    life, and—in John Berger’s phrase—to find “another way of telling,” which is part
    of getting slobbered by the old ways of telling is disheartening.


    The conservative “defense of marriage,” which is really nothing more than a defense
    of the old hierarchical arrangement straight marriage before feminists began to
    reform it, is sadly not just the property of conservatives. Too many in this society
    are entrenched in the devout belief that there is something magically awesome
    for children about the heterosexual two-parent household, which leads many people
    to stay in miserable marriages that are destructive for everyone within range.
    I Know people who long hesitated to leave horrible marriages because the old recipe
    insists that a situation that is terrible for one or both parents will be beneficial
    for the children. Even women with violently abusive spouses are often urged to
    stay in situations that are supposed to be so categorically wonderful that the
    details don''t matter. Form wins out over content. And yet I''ve seen the joy
    of divorce and the myriad forms happy families can take, over and over and over,
    from one parent and one child to innumerable forms of multiple households and
    extended families.


    After I wrote a book about myself and my mother, who married a brutal professional
    man and had four children and oft seething with rage and misery, I was ambushed
    by an interviewer who asked whether abusive father was the reason I failed to
    find a life partner. Her question was freighted with astonishing assumptions about
    what I had intended to do with my life and her right to introduce upon that life.
    The book, The Faraway'
