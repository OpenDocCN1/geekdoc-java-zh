  md: '# A Short History of Silence


    “What I most regretted were my silences. . . . And there are so many silences
    to be broken.”


    —Audre Lorde


    # THE OCEAN AROUND THE ARCHIPELAGO


    Silence is golden, or so I was told when I was young. Later, everything changed.
    Silence equals death, the queer activists fighting the neglect and repression
    around AIDS sought in the streets. Silence is the ocean of the unsaid, the unspeakable,
    the repressed, the unheard. It surrounds the scattered islands made up of those
    allowed to speak and of what can be said and who listens. Silence occurs in many
    ways for many reasons; each of us has her own sea of unspoken words.


    English is full of overlapping words, but for the purposes of this essay, regard
    silence as what is imposed and quiet as what is sought. The tranquility of a quiet
    place, of quieting one’s own mind, of a retreat from words and bustle, is acoustically
    as the silence of intimidation or repression but psychologically and politically
    something entirely different. What is unsaid because is as different from what
    is not said because the threats are high or the barriers are as great as swimming
    from drowning. Quiet is to noise as silence is to communication. The quiet of
    the listener makes room for the speech of others, like the quiet of the reader
    taking in words on the page, like the white of the paper taking ink.


    “We are volcanoes,” Ursula K. Le Guin remarked. “When we women offer our experience
    as truth, all the maps change. There are new voices that undersea volcanoes erupt
    in open water, and new islands are born; it’s a furious business and a startling
    one. The world changes. Silence is what allows people to suffer without recourse,
    what allows hypocrisies and lies to grow and flourish. If our voices are essential
    aspects of our humanity, to be rendered voiceless is to be dehumanized or excluded
    from one’s humanity. And the history of silence is central to women’s history.


    Words bring us together, and silence separates us, leaves us hereof of the help
    or solidarity or just communion that speech can solicit or elicit. Some'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'species of trees spread root systems underground that interconnect individual
    trunks and weave the individual trees into a more stable whole that can''t easily
    be blown down in the wind. Stories and conversations are like those roots. For
    a century, the human response to stress and danger has been defined as “fight
    or flight.” A 2000 UCLA study by several psychologists noted that this research
    was based largely on studies of male rats and human beings. But studying women
    led them to a third, often deployed option: gather for solidarity, support, advice.
    They noted that “behaviorally, females’ responses are more marked by a pattern
    of ‘tend-and-bef.’ Tending involves nurturant activities designed to protect the
    self and offspring that promote safety and reduce distress; befriending is the
    creation and maintenance of social networks that may aid in this process.


    Much of this is done through speech, through telling of one’s plight, through
    being heard, through compassion and understanding in the response of the people
    you tend to, whom you befriend. Not only women do this, but perhaps women help
    me, now that how I cope, or how my community helps me, now that I have one.


    Being unable to listen your story is a living death and sometimes a literal. If
    no one listens when you say your ex-husband is trying to kill you, if no one believes
    when you say you are in pain, if no one hears you say help, if you don''t say
    help, if you are trained not to bother people by saying help. If you are considered
    to be out of line when you speak up in a meeting, not admitted into an institution
    of power, are subject to irrelevant criticism whose subset is women should not
    be here, or heard. Stories save your life. And stories are your life. We are our
    stories, stories that can be prison and the crowbar to break the door of that
    prison; we make stories to save ourselves or to trap ourselves or others, stories
    that lift us or smash against the stone wall of our own limits and fears. Liberation
    is always in part a storytelling process: breaking stories, breaking sil, making
    new stories. A free person tells her own story. A valued person lives in a society
    in which her story has place.


    Violence against women is often against our voices and our stories. It is a refusal
    of our voices, and of what a voice means: the right to selfdetermination, to participation,
    to consent or dissent, to live and participate, to interpret and narrate. A husband
    hits his wife to silence her; a date rapist or acquaintance refuses to let the
    “no” of his victim mean'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'what it should, that she alone has jurisdiction over her body; rape culture
    asserts that women''s testimony is worthless, untrustworthy; anti-abortion activists
    also seek to silence the self-determination of women; a murderer silences forever.
    These are assertions that the victim has no rights, no value, is not an equal.
    These silencings take place in smaller ways: the people harassed and badgered
    into silence online, talked over and cut out in conversation, belittled, humiliated,
    dismissed. Having a voice is crucial. It''s not all there to human rights, but
    it''s central to them, and so you can consider the history of women''s rights
    and lack of rights as a history of silence and silence.


    Speech, words, voice sometimes changes things in themselves when they bring about
    inclusion, recognition, the rehumanization that undoes dehumanization. Sometimes
    they are only the preconditions for changing rules, laws, regimes to bring about
    justice and liberty. Sometimes just being able, to be heard, to be believed are
    crucial parts of membership in a family, a community, a society. Sometimes we
    break these things apart; sometimes those things are prisons. And then through
    speakability, was not tolerated by a society sometimes becomes intolerable. Those
    not impacted fail to see or feel the impact of segregation or police brutality
    or domestic violence: stories bring home the trouble and make it unavoidable.


    By voice, I mean only literal voice—the sound produced by the vocal cords in the
    ears of others—but the ability to speak up, to participate, to experience once
    and be experienced as a free person with rights. This includes the right not to
    speak, whether it''s the right against being tortured to confess, as political
    prisoners are, or not to be expected to strangers who approach you, as some men
    do to young women, demanding attention andattery and punishing their absence.
    The idea of voice expanded to the idea of agency includes wide realms of power
    and powerlessness.


    Who has been unheard? The sea is vast, and the surface of the ocean is unmappable.
    We know how has, mostly, been heard on the official subjects: who held office,
    attended university, commanded armies, served as judges and juries, wrote books,
    and ran empires over the past several centuries. We know how it has changed somewhat,
    thanks to the countless revolutions of'
