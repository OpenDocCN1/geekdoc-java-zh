    Sooner or later in conversations about who we are, who we have been, and who we
    can be, someone will tell a story about Man the Hunter. It''s a story not just
    about Man but about Woman and Child, too. There are countless variants, all of
    them go something like this: in primordial times men went out and hunted and brought
    home meat to feed women and children, who sat around dependent on them. In most
    versions, the story is set in nuclear units, where men provide only for their
    own family, and women have no community to help with the kids. In every version,
    women are baggage that breeds.


    Though it makes claims about human societies as they existed 200,000 or 5 million
    years ago, the story itself isn''t so old. Whatever its origins, it seems to have
    reached a peak of popularity only in the middle of last century. Here''s a chunk
    of one of the most popular versions from the 1960s, Desmond Morris''s The Naked
    Ape:


    > Because of the extremely long periods of dependency of the young and the heavy
    demands made by them, the females found themselves almost perpetually confined
    to the base. . . .

    The hunting parties, unlike those of the “pure” carnivores, had to become all-male
    groups. . . .

    For a virile primitive male to go off on a feeding trip and leave his females
    unprotected from the advances of any other males that might happen to come by
    was unheard of. . . The answer was the development of a pair-bond.


    This narrative, in other words, attempts to trace the dominant socioeconomic arrangements
    of the late fifties and early sixties middle class back to the origins of our
    species. I think of it as the story of the five-million-year-old suburb. Proto-human
    males go off—all of them, since apparently none are old or sick or sitting around
    talking about the fantastic land they got last week. They go out all day, every
    day, carrying their spears and atlatls to work and punching the primordial time
    clock. Females hang around the hearth with the kids, waiting for the men to bring
