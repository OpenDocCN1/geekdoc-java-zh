    emergency aid—tourniquets, pressure to gunshot wounds, CPR—to the injured and
    dying, and twenty thousand came to the memorial at the UCSB stadium that week.
    But the people who embody the us, like all of us, live in a climate in which violence
    can erupt anywhere any time.


