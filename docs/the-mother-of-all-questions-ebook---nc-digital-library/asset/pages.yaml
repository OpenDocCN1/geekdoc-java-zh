  md: 'Sometimes at big political demonstrations—against the war in Iraq in early
    2003, for example—the thousands of placards with handwritten statements, jokes,
    and facts, for all their brevity, constitute a cumulative critique that covers
    a lot of angles. Social media can do the same, building arguments by comment,
    challenging, testing, reinforcing, and circulating the longer arguments in blogs,
    essays, and reports. It’s like a barn raising for ideas: innumerable people bring
    their experiences, insights, analysis, new terms, and frameworks. These then become
    part of the fabric of everyday life, and when that happens, the world has changed.
    Then, down the road, what was a radical idea becomes woven into everyday life
    that people imagine it is self-evident and what everyone knew. But it’s not; it’s
    the result of a struggle—of ideas and voices, not of violence.


    The most transformative shooting—moment I witnessed this year after the Isla Vista
    mass you remember, the incident in a young man poisoned by“pickup artist” misogyny
    and possessed of a sense that all women owned whatever he wanted, and that he
    had the right to administer collective punishment to the gender, killed six and
    wounded fourteen before he took his own life. He set out to massacre members of
    a sorority but ended up killing anyone in his path, including other men. Many
    in the mainstream media rushed to assert that was an isolated incident due to
    mental illness, and both the strong individuals and the great collective roar
    on social media pushed back, hard to insist that it was a part of misogynist violence
