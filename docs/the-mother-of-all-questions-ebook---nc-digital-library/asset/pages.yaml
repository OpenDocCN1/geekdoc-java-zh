  md: 'Nearby, was, I thought, in a quiet, roundabout way about my long journey toward
    a really nice life, and an attempt to reckon with my mother''s fury, including
    the origin of that fury in her entrapment in conventional feminine roles and expectations.


    I have done what I set out to do in my life, and what I set out to do was not
    what my mother or the interviewer presumed. I set out to write books, to be surrounded
    by generous, brilliant people, and to have great adventures. Men—rances, flings,
    and long-term relationships—have been some of those adventures, and so have remote
    deserts, arctic seas, mountaintops, uprisings and disasters, and the exploration
    of ideas, archives, records, and lives.


    Society''s recipes for fulfillment seem to cause a great deal of unhappiness,
    both in those who are stigmatized for being unable or unwilling to carry them
    out and in those who obey but dont find happiness. Course there are people with
    very standard-issue lives who are very happy. I know some of them, as I know very
    childless and celibate monks, priests, and abbesses, gay divorces, and everything
    in between. Last summer my friend Emma was walked down the aisle by her father,
    with her husband following right behind on Emma''s arm; the four of them, plus
    Emma''s husband, is an exceptionally loving and close-knit family engaged in the
    pursuit of justice through politics. This summer, both of the weddings I went
    to had grooms and no brides; at the first, one of the grooms wept because he had
    been excluded from the right to marry for most of his life, and he never thought
    he would see his own.


    Still, the same old questions came buzzing around—though they often seem like
    questions than a sort of enforcement system. In the traditional worldview happiness
    is essentially private and selfish. Reasonable people pursue their self-interest,
    and they do so successfully they are supposed to be happy. The very definition
    of what it means to be human is narrow, and altruism, idealism, and public life
    (except in the forms of fame, status, or material success) have little place on
    the shopping list. The idea that a life should seek meaning seldom emerges; not
    only are the standard activities assumed to be inherently meaningful, they are
    treated as the only meaningful options.


    One of the reasons people lock onto motherhood as a key to feminine identity is
    the belief that children are the way to fulfill your capacity to love.'
