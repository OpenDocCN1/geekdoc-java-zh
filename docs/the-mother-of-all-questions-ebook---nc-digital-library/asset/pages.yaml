  md: 'In June 1994, when Nicole Brown Simpson and Ronald Goldman were found murdered
    and her ex-husband’s extensive history of beating and stalking was revealed, I
    hoped we would have a real conversation about domestic violence and misogyny (which
    often results in collateral deaths of the target''s friends, family members, coworkers,
    others, and is a major factor in mass shootings in the United States). But O.
    J. Simpson hired a platoon of high-powered lawyers, who made him out to be the
