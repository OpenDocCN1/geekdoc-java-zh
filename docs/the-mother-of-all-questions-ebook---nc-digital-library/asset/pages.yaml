  md: '# Artwork Credits


    Artwork by Paz de la Calzada. All images by Paz de la Calzada, courtesy of the
    artist.


    Paz de la Calzada is a multidisciplinary artist based in San Francisco. Her site-specific
    drawings and installations create intricate labyrinths that provide a pathway
    from the public sphere into a contemplative realm, linking two very isolated worlds.
    The intricate lines and repetitive patterns of her HairScope drawings cohabitate
    and collaborate with surrounding architecture, reclaiming aspects of female beauty.


    Paz has created temporary public art projects in the United States, India, Crete,
    and Spain, engaging with local communities and drawing inspiration from their
    stories.

