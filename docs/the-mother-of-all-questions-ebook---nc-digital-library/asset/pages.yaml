    Throughout the televised trial, which dragged on for almost a year, there was
    little public discussion of domestic violence, as one advocate said, following
    the trial:


    +   There were some juror comments after the verdict that said, “Why are they
    talking about domestic violence when this is a murder?” When I realized the jurors
