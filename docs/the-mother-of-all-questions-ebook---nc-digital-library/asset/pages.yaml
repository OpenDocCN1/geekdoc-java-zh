    who were too large to keep up were often tended by someone staying at camp while
    their mothers roared. Thomas makes clear that hunting and gathering are not completely
    separate activities and speaks of “slow game—the tortoises, snakes, snails, and
    baby birds that are often found by people who are gathering,”


