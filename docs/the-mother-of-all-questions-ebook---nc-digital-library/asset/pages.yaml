  md: 'at last, a substantive conversation about street harassment, and an overwhelming
    response to the claims of fifteen women that Canada’s most famous radio host,
    Jian Ghomeshi, had assaulted them.

    Not all the allegations listed above have been proven true. But in some cases
    crimes that rarely received much coverage, if any—or had been treated as isolated
