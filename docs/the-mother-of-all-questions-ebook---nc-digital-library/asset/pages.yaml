  md: '# The Case of the Missing Perpetrator

    (2016)


    In a detective novel, you begin in a state of ignorance and advance toward knowledge,
    clue by clue. The little indicators add up at last to a revelation that sets the
    world to right and sees that justice is done, or at least provides the satisfaction
    of a world made clear in the end. If detective fiction is the literature of disillusion,
    then there''s a much more literature of illusion that aspires to deceive and distract
    rather than clarify.


    A perfect example is the Center for Disease Control''s new and widely mocked guidelines
    to drinking. They are like a detective novel run backward—if you read them with
    incredity, you''d become muddled about what a woman is and how violence and pregnancy
    happen and who is involved in those things. If you read more carefully, you might
    learn why the passive sentence is so often a cover-up and that the missing subject
    in a circumlocation sentence


    What is a woman? According to the CDC, all women are in danger of becoming pregnant.
    "Drinking too much can have many risks for women," its chart tells us, and itemizes
    them for "any woman." "Injuries/violence" top list and "intended pregnancy" brings
    up the rear. "Drinking too much can have risks for women including . . . any alcohol
    use for women who are pregnant or may be pregnant." Medical professionals should
    advise a woman to stop drinking she is trying to get pregnant or not using birth
    control with sex." In this a few deft, simple strokes reduces all women to fertile
    females in their breeding years who have what you might call exposure to fertile
    men. It denies the existence of many other kinds of women and the equal responsibility
    of at least one kind of man. Maybe it denies the existence of men, since women
    seem to get pregnant here as a consequence of consorting with booze, not boys.


    Woman is a category covering a great variety of us who fall outside the CDC criteria.
