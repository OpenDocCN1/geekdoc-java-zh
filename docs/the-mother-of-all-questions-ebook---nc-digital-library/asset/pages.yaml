  md: 'But there are many things to love besides one''s own offspring, so many things
    that need love, so much other work love has to do in the world.


    While many people question the motives of the childless, who are taken to be selfish
    for refusing the sacrifices that come with parenthood, they often neglect to note
    that those who love their children intensely may have less love for the rest of
    the world. Christina Lupton, a writer who is also a mother, recently described
    some of the things she relinquished when motherhood''s consuming tasks had in
    her grasp, including


    all the ways of tending to the world that are less easily validated than parenting,
    but which are just as fundamentally necessary for children to flourish. I mean
    here the writing and inventing and the politics and the activism; the reading
    and the public speaking and the protesting and the teaching and the filmmaking...
    Most of the things I value most, and which I trust any improvements in the human
    condition will come, are violently incompatible with the actual and imaginative
    work of childcare.


    One of the fascinating things about Snowden''s sudden appearance a few years ago
    was the inability of many people to comprehend why a young man might give up on
    the recipe for happiness—high wages, secure job, Hawaiian home—to become the world''s
    most sought-after fugitive. Their premise seemed to be that since all people are
    selfish, Snowden''s motive must be a self-serving pursuit of attention or money.


    During the first rush of commentary, Jeffrey Toobin, the New Yorker''s legal expert,
    wrote that Snowden was "a grandiiose narcissist who deserves to be in prison."
    Another pundit announced, "I think what we have in Edward Snowden is just a narcissistic
    young man who is smarter than the rest of us." Others assumed that he was revealing
    US government secrets because he had been paid by an enemy country.


    Snowden seemed like a man from another century. In his initial communications
    with journalist Glenn Greenwald he called himself Cincinnatus—after the Roman
    statesman who acted for the good of his society without seeking self-advancement.
    This was a clue that Snowden formed his ideals and models far from the standard-issue
    formulas for happiness. Other eras and cultures often asked different questions
    from the ones we ask now: What is the most meaningful thing you can do with your
    life? What''s contribution to the world or your community? Do you live according
    to your principles? What will your legacy be? What does your life mean? Maybe
    our obsession with happiness is a way not to ask those other'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'questions, a way to ignore spacious our lives can be, how effective our work
    can be, and how far-reaching our love can be.


    There is a paradox at the heart of the happiness question. Todd Kashdan, a psychology
    professor at George Mason University, reported a few years ago on studies that
    concluded that people who think being happy are important more likely to become
    depressed: “Organizing your life around trying to become happy, making happiness
    the primary objective of life, gets in the way of actually becoming happy.”


    I did finally have my rabbinical moment in Britain. After the jet lag was over,
    I was interviewed onstage by a woman with a plummy, fluting accent. “So,” she
    thrilled, “you’ve been wounded by humanity and fled to the landscape for refuge.”
    The implication was clear: I was an exceptionally sorry specimen on display, an
    outlier in the herd. I turned to the audience and asked, “Have any of you ever
    been wounded by humanity?” They laughed with me; in that moment, we knew that
    we were all weird, all in this together, and that addressing our own suffering
    while learning not to inflict it on others is part of the work we''re all here
    to do. So is love, which comes in so many forms and can be directed at so many
    things. There are many questions in life worth asking, but perhaps if we''re wise
    we can understand that not every question needs an answer.'
