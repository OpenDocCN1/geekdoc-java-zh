    her lover (or her mistress; she was below the age of consent) was convicted of
    voluntary manslaughter—not murder—shortly before Shepard’s death. There was no
    national outrage over Sulk’s murder, nor over the rape and murder of an eight-year-old
    Laramie girl, Christin Lamb, that summer.


    All three of these deaths were monstrous, as usual, like thousands of other violent
    crimes against women. If these crimes were addressed at all beyond the inner pages
    of a newspaper, they were treated as isolated incidents—the crimes of aberrant
