  md: '# The Short Happy Recent History of the Rape Joke

    (2015)


    Are rape jokes funny? The feminist position a few years ago seemed to be a firm
    no, and everything changed. In fact, the rapid evolution of the rape joke over
    the past three years is a small-scale echo of the huge changes that have taken
    place in the public conversation about sexual violence, gender, feminism, whose
    voice matters, and who gets to tell the story.


