    In 1977, Audre Lorde addressed the Modern Language Association with her landmark
    talk and essay considering race, gender, and orientation together, “The Transformation
    of Silence Into Language and Action” (published in 1984). It’s a brief, dense,
    aphoristic essay with some of the urgency of a manifesto:


    My silences had not protected me. Your silence will not protect you. But for every
    word spoken, for every attempt I had ever made to speak those truths for which
    I am still seeking, I had made contact with other women while we examined the
    words to fit a world in which we all believed, bridging our differences. And it
    was the concern and caring of all those women who gave me strength.


    Lorde addressed that breaking silence was not only an act of courage but also
    of creation: “What are the words you do not yet have? What do you need to say?
    . . . Each of us is here now in one way or another we share a commitment to language
    and to the power of language, and to the reclaiming of language which has been
    made to work us.”


    In 1978, Jamaican-born Michelle Cliff published “Notes on Speechlessness,” which
    dealt with both avoidance and exploration of difficult truths. “Both withdrawal
    and humor are types of speechlessness. The obscuring and trivialization of truth
    is real also speechlessness.” She wrote about bad dreams, wrote in fragments,
    wrote about herself also about political and literary history, out herself as
    a lesbian and addressed the way that passing as straight was a masquerade, another
    route around truth. Cliff’s essay concludes that she seeks to eliminate what has
    eliminated her: “This means nothing more or less than seeking my own language.
    This may be what women do.”


    Her lover and partner, Adrienne Rich, titled one poem of her books of poetry The
    Dream of a Common Language. The crucial poem in that book is “Cartographies of
    Silence”: it opens, “A conversation begins with a lie” and speaks of “the scream
    of an illegitimate voice.” At the end of the long piece, truth breaks out like
    a new-growing thing, green. Many of the women who spoke about silence were lesbians,
    including Griffin and Rich; were also Black, including Cliff and Lorde. Though
    intersectionality is a term that'
