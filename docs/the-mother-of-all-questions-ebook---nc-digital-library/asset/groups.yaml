    And now, back to those false rape accusations. In *Men Explain Things to Me*,
    I added this footnote:


    False accusations of rape are a reality, and a relatively rare one, though stories
    of those convicted falsely are terrible. A British study by the Crown Prosecution
    Service released in 2013 noted that there were 5,651 prosecutions for rape in
    the period studied, versus only 35 prosecutions for false allegations of rape
    (or more than 160 cases for every false allegation, all under 1 per-cent). A 2000
    U.S. Department of Justice report cited these estimates for the United States:
    322,230 rapes annually, resulting in 55,424 reports to police, 26,271 arrests,
    and 7,007 convictions—slightly more than 2 percent of rapes counted and 12 percent
    of rapes reported in jail sentences.


    In other words, reporting a rape is not likely to get someone jailed, and though
    2 percent of rape charges are false, only slightly more than 2 percent of all
    charges result in convictions. (Some estimates go high as 3 percent.) In other
    words, there are an awful lot of unpunished rapists out there. And most, when
    accused or charged, do not admit to committing rape. Which means we have a host
    of rapists out there who are also liars, and maybe the lies that abound are by
    men who have raped, not by women who have not been raped.


    Of false-rape allegations have happened. My friend Astra Taylor points out that
    the most dramatic examples in this country were when white men falsely accused
    Black men of assaulting white women. Which means that if you want to summon up
    a more complicated picture of how power, blame, and age actually work. There have
    been the infamous Scottsboro Boys gang-rape case of the 1930s, for example—where
    white women were also pressured by the authorities in order to incriminate Black
    men. In the Scottsboro case, one of the accusers, seventeen-year-old Ruby Bates,
    later recanted and told the truth, despite the threats against her.


    Then there''s the Central Park jogger case of 1989 in which the police coerced
    false confessions from, and the judicial system (including a woman prosecutor)
    convicted and jailed, five innocent African American and Latino teens. The white
    victim, who had been beaten to death, had no memory of the incident and was not
    a witness against them. In 2002, the real assailant confessed and the five were
    exonerated, but only after their youths were spent in prison for crimes they didn''t
    commit. Even in 2016 Donald Trump was proclaiming the guilt of these innocent
    men. Convicting the innocent tends to result from corruption and misconduct in
    the justice system, not just a lone accuser. Of course, there are exceptions.
    My point is that they are rare.


    The false-rape-allegation obsession apparently arises from a number of things,
    including the delusion that they are common and the enduring slander that women
    are naturally duplicitous, manipulative, and unreliable. The constant mention
    of the issue suggests that there''s a weird kind of male confidence that comes
    from a sense of having more credibility than women. And now that''s changing.
    Maybe by confidence I mean entitlement. Maybe these feminist guys are saying in:
    men are finally going to be accountable and that frightens them. Maybe it''s good
    for them to be frightened—or at least accountable.


    ## WHAT MAKES A PLANET INHABITABLE


    The situation as has long existed to be described bluntly. Let''s say that a significant
    number of men hate women, whether the stranger harassed in the street, the Twitter
    user threatened into silence online, or the wife who''s beaten. Some men believe
    they are entitled to humiliate, punish, silence, violate, and even annihilate
    women. As a consequence, women face a starting amount of everyday violence and
    an atmosphere of menace, as well as a host of smaller insults and aggressions
    to keep us down. It''s not surprising, then, that the Southern Poverty Law Center
    classifies some men''s rights groups as hate groups.


    In this context, consider what we mean by rape culture. It''s hate. Those sports-team
    and fraternity rates are predicated on the idea that violating the rights, and
    body of another human being is a cool thing to do. Such group act are based on
    a predatory-monster notion of what masculinity is, one to which many men don''t
    subscribe but that affects us all. It''s also a problem that men are capable of
    rectifying in ways women are not.


    The other evening, I left a talk on what makes a planet inhabitable—temperature,
    atmosphere, distance from a star—by an astrophysicist I know.


    I''d thought about asking a young man, a friend of friend of mine, to accompany
    me to my car in the very dark park outside the California Academy of Sciences,
    but the astrophysicist and I fell to talking and walked to the car without ever
    questioning the necessity of it, and I drove to her car.


    A couple of weeks earlier, I joined Emma Sulkowicz and a group of young women
    who were carrying a mattress between classes at Columbia University. As mentioned
    earlier, Sulkowicz is an art major who reported being raped and noticed nothing
    resembled justice either from the campus authorities or the New York Police Department.
    In response, she is bearing witness to her plight with a performance-art piece
    that consists of carrying a dorm-room mattress with whenever she''s on campus,
    wherever she''s going.


    The media response has been tremendous. A documentary film team was along that
    day, and the middle-aged camerawoman remarked to me that, if campus consent had
    existed when she was young, the right of women to say no and the obligation of
    men to respect women''s had been recognized, her life would have been different.
    I thought about it for a moment and realized: so would mine. So much of my energy
    between the ages of twelve and thirty was given over just surviving predatory
    men. The revelation that humiliation, harm, and maybe even death was liable to
    be inflicted on by complete strangers and casual acquaintances because of my gender
    and I had to be on watch all the time—that part of what made me a feminist.


    I care passionately about the inhabitability of our planet from an environmental
    perspective, but until it''s fully inhabitable by women who can walk freely down
    the street without the constant fear of danger, we will labor under practical
    and psychological burdens that impair our powers. Which is why, as someone who
    thinks climate is the most important thing in the world right now, I''m still
    writing about feminism and women''s rights. Since I wrote this essay, Rolling
    Stone published and retracted a story on rape at the University of Virginia. The
    article focused on one alleged victim, whose statements were not fact-checked
    and were not accurate. The mainstream media and the Twittersphere became obsessed
    with the case and gave the victim and her falsehoods massive coverage, in such
    a way to suggest that false charges were the major problem at UVA, a school under
    federal investigation and charged with mishandling dozens of incidents of sexual
    assault dating many years. The Charlottesville Hook had reported, "In the same
    span, 60 UVA students reported they''d been sexually assaulted, many by fellow
    students. Yet, according to various sources in the UVA administration, not one
    sexual offender has been expelled or ever suspended from the school in the past
    five years." But after the Rolling Stone debacle, dozens of news stories gave
    the impression there was only one rape story at UVA and it was false.

