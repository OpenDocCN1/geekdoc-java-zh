    # 关于作者


    作家、历史学家兼活动家瑞贝卡·索尔尼特（Rebecca Solnit）写了十八本关于女性主义、历史、权力、社会变革、流浪和灾难的书，包括 Haymarket
    出版的《向我解释》和《黑暗中的希望》；一部关于美国城市的三部曲；《神学西方》（*Theological West*，她因该书获得了古德堡奖、国家图书评论评论奖和兰南文学奖）。她是从幼儿园到研究生阶段加州教育系统的产物，是《哈珀杂志》的专栏作家也是《卫报》的定期撰稿人。


    # 关于 Haymarket Books


    Haymarket Books 是一家非营利性的进步书籍发行商和出版商，是经济研究和社会变革中心的项目。我们相信活动家需要将思想、历史和政治带入争取社会正义的斗争中。学习过去的胜利和失败教训可以为新一代争取世界的战士武装。正如卡尔·马克思所说，“哲学家们只是在解释世界，问题在于改变世界。”


    没有读者的慷慨支持，我们无法完成出版工作。请访问 www.haymarketbooks.org 了解更多并购买我们的完整目录。


    # Rebecca Solnit 其他作品


    《黑暗中的希望：未被讲述的历史，狂野的可能性》

