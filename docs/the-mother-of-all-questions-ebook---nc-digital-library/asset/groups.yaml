    The first woman undergraduate at Yale entered in 1969. The reception women received
    was so hostile that in 1977 the nation''s first Title IX lawsuit for campus sexual
    harassment and rape by professors, Alexander v. Yale, was filed. It set a precedent
    requiring campuses across the country to address these abuses as discrimination
    (but not enough changed: thirty-nine years later, in the summer of 2016, 169 philosophers
    signed a letter decrying a twenty-seven series of sexual harassment incidents
    by Yale professor Thomas Pogge, whose specialty is the field of ethics).


    New recognition required new language, and feminism coined a plethora of words
    to describe the individual experiences that the conversations of the 1960s and
    1970s were beginning to flush out of hiding. Susan Brownmiller coined the term
    date rape in 1975. The term sexual harassment was coined in 1974 by Mary Rowe
    to describe misconduct at MIT, or by a group of women addressing the same problem
    at Cornell in 1975. The legendary lawyer Catherine MacKinnon took the concept
    forward with her 1979 book Sexual Harassment of Working Women. The term and the
    concepts behind it would only become well known to the public with the Clarence–Anita
    Hill hearings in 1991. In 1993, Oklahoma and North Carolina became the last states
