    ranch are treated, finding herself not only in an arid country but an apart. Her
    husband rules like Abraham in the land of Canaan. Mighty is her herds, vast her
    lands. Among other things, the film seems to propose the great division in the
    United States is not necessarily the famous Civil War configuration of North/South,
    but East/West, with differences of manners, histories, ecologies, and scale. It''s
    clear that Leslie meeting people who speak Spanish and not English means she''s
    arrived in another country.


