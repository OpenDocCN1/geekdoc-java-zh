    酒精，与其说它是如何做到的，不如说结果。对我而言，我正试图警告人们误用语言。我们都是语言侦探，只要我们给予足够的关注，我们就能弄清楚某些陈述的含义，即使这些陈述并没有告诉我们真相，我们甚至能看出来故事在对我们撒谎。很多时候确实如此。


    ## 巨星 (Giantess)


    (2016)


    激进主义往往被想象成边缘化，以至于有时真正具有颠覆性的东西仅仅通过穿燕尾服而不是T恤或滑雪面具出现就能逃避检测。以乔治·斯蒂文斯导演的1956年电影《巨星》为例。它是一部史诗，一部传奇，一个横跨家族的家族，是德克萨斯州经济从畜牧业向石油业转型的胶囊史，一部后西部西部，同时也是一个煽动装置。它的时长略超过三小时，有足够的空间展示从婚礼场景到对种族、阶级和性别干预的所有内容。


    影片由伊丽莎白·泰勒和三位男性恋同——罗克·哈德森、詹姆斯·迪恩和萨尔·米尼奥主演，他们之间不安地环绕着，这种方式似乎只有部分与他们的电影角色有关。我第一次看《巨星》是在旧金山卡斯罗剧院的一场三十周年纪念放映上，当时我注意到了这一点。从我月中旬起，在这座拥有1400个座位的宏伟梦想宫殿里看电影，我学会了通过黑暗中男同性恋者的叹息、呻吟和窃笑来察觉同性恋的潜台词，充满活力地赞赏女性，并欣赏坎普风（camp）、苦涩和陈词滥调。《巨星》拥有所有元素。


    虽然许多同龄人背下了像《石洛霍恐怖剧秀》这样的邪典电影，而卡斯罗剧院仍然为那些想来看《小美人鱼》或《音乐剧之声的人提供合唱放映，但我可以背诵《巨星》中她一些最精彩的台词。泰勒是极其罕见的快乐，她是一个打破规则、赢得胜利并享受自己的女性，而不是像在男权制剧情中的许多反叛者那样，只会心心祈望或被击。在我第一次观看这部电影的前一年，哈德森死于艾滋病，而泰勒开始为那些患有当时无法治愈且被严重污名化的疾病的人发声。她作为倡导者和筹款者的直言不讳的英雄事迹，使她在现实生活中就像她三年前扮演的那个不可征服的女英雄。


    每当我在屏幕上看到这样的女性时，我都会被点燃，这种感觉就像好莱坞无尽的动作英雄必须时刻保持的状态一样。仅仅在2015年的传记电影《快乐》中，看着詹妮弗·劳伦斯像经典的牛仔手一样走在德克萨斯州的街道上面对敌人，就给了我一种大约一年才一次的快感。劳伦斯的卡特丽丝·艾弗瑞是硬汉派，在此之前的系列香港动作英雄和《致命女：尼基塔》中的角色也是如此。碧昂最近的视频提供了这种快乐，一个杀伐一切且永不倒下的女性。不屈的女性之魂，拥有自主权的女性。


    当我第二次在卡斯罗剧院巨大的场地上为它的四十周年纪念活动看《巨星》时，我带了我自己的超棒低分评论源——表演艺术家古列尔莫·戈麦斯-佩尼亚。他穿了一身黑皮衣，带着宿醉蜷缩在椅子上。从一开始开始，他就不断低声念道：“瑞贝卡，我不相信我所看到的。”电影早期，由光彩、自信的泰勒饰演的马里兰州年轻名女莱斯莉·林林顿，既迷住也骚扰了西德克萨斯州的牧场主罗克·哈德森，前者是因为她是一个爱调情且迷人的女性，后者是因为她直抒胸臆。弗洛伊德式的符号警报：他要从林林顿的父亲那里买一匹种马——一匹闪亮的黑马在开场戏中华丽地奔跑。泰勒在他们见面第二天早上向他提到，她一直在阅读关于德克萨斯的一切信息，当他准备好迎接奉承时，她说：“我们偷走了德克萨斯！我的意思是，是从墨西哥手里夺走的。”


    这是一个端庄而又疯狂的场景，由于一个黑人管家而变得复杂，他那不知所措的表情与哈德森敬酒的选择一起引起了一些镜头的关注。电影拍摄于“布朗诉教育委员会案”及其那较少为人知的平行案件“赫尔南德斯诉德克萨斯州”之后的一年，将涉及德克萨斯州的种族问题，这是一个涉及白人和棕色人的，尽管它忽略了在南方作为黑人的政治问题。它并不是一个完美的论说，属于从白人盟友（受影响群体）视角观察种族正义的大类，但作为在马丁·路德·金完成研究生毕业、罗莎·帕克斯仍在让座期间拍摄的大片，它依然是非凡的。


    我们真的偷走了德克萨斯。即使是现在说这句话也很神奇，作为伊丽莎白·泰勒在早餐时对一个迷恋家乡的畜牧主提出的观察，这令人震惊。它仍然是一个很好的提醒。古列尔莫我在卡斯罗看《巨星》四十周年的那一年——1996年——我们正处于加州抨击移民的时代，受各种关于经济影响的神话的驱动，这些神话将残酷新经济的负担从领主转移到了底层。那一年也是美国对墨西哥战争开始的150周年，这场战争在两年后结束，夺取了墨西哥半部领土，那片从新墨西哥州到加利福尼亚州的广阔土地，如果仍留在墨西哥手中，将导致完全不同的全球地缘政治，也许可能导致美国人越过边界，在西南方的那个超级大国寻找工作。（当然，德克萨斯早早之前被偷走了。）遗忘是政客们魔化拉丁裔移民和居民的意识形态的一个重要组成部分，从淘金热到加州州皮特·威尔逊执政时期。

