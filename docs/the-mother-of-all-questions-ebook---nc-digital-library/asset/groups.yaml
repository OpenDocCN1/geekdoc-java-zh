    尽管最近才被广泛使用，这些女性已经理解了在交叉或多个交叉点上运作意味着什么。里奇（Rich）的书在克里夫（Cliff）的文章的前一年出版；在她丰富的著作中首次包含了同性恋爱情诗。


    两年后，1979年，里奇出版了散文集《谎言、秘密与沉默》（*On Lies, Secrets, and Silence*），其中包含了她对伍尔夫《自己的房间》（*A
    Room of One''s Own*）的批判。在书的其他地方她写道：


    我相信，许多让沉默成为一种转化力量的女性，也可以回望这样一个时代：那时，那些无法提问的问题微弱而不可可能的轮廓，在大脑细胞中盘旋，在某位已故女性的作品的某些行文或短语中，触发了认同的震撼，而她可以模糊地想象那个女性的生活和经历。


    曾经无法提问的问题，现在被提问了。1980年，里奇通过里程碑式的文章《强制性异性恋与同性恋伦理》（"Compulsory Heterosexuality and
    Lesbian Ethics"）增加了她的批判，审视了女性女性身份和活动是如何被忽视或排除的，这种排除扭曲了我们所有人生活和理解的可能性。她在提到当时一本流行的女性主义书籍时说，它“特别忽略了女性的历史，即作为女巫、*独立女性*（*femmes
    seules*）、婚姻反对者、老女、自主的寡妇和/或同性恋者——她们以不同程度维持生活。与其说从这段历史中学习，恰说是女性主义者可以从中学习很多，而这段历史总体上是一片空白。”她是一位伟大的探索者。


    她质疑异性恋作为一种规范：“‘大多数女性天生是异性恋者’的假设对许多女性来说是一个理论和政治上的绊石……未能将异性恋视为一种制度来审查，就像未能承认资本主义这种经济体系，或种族主义种姓制度是由多种力量维持的。”她写道同性恋的生活本身被沉默了，而且异性恋并非自然，“而是某种必须通过力量来强加、管理、组织、宣传和维持的事物。”一个全新的思想和可能性的城市正在建立，就像一座物质城市一样，通过项目、劳动、决策和愿望的堆积，女性们正进入其中居住。


    20世纪70年代的女性主义充满了认同的喜悦与愤怒，以及即便对糟糕事的认同也带来的力量。可以被识别的就可以被修复或抵抗。在《那不勒斯四部曲》的第三部小说中，埃莉娜·费兰特（Elena
    Ferrante）描述了她的主角在20世纪70年代发现女性主义分析的过程：“我想，一个女人怎么可能会那样思考？我在书上付出了这么多努力，但我只是忍受了它们，从未真正使用过它们，也从未让它们反抗我自己。”她第一次发现，如果跳出那些限制了她自身、她的性别和语言可能性的假设，世界看起来会是什么样。


    那个时代的一些女性主义者，特别是地凯瑟琳·麦金农农（Catherine MacKinnon）和安德里亚·德沃金（Andrea Dworkin），公开反对一种言论和表现形式——色情，理由是因为导致了对女性的压迫。她们的工作引发了游行、示威、法律诉讼以及基于言论自由理由被推翻的禁令。运动中的其他人则为色情辩护，要么为了其本身，要么为了言论自由。（杂志《在我们背后》（*Off
    Our Backs*那挑衅性的标题被同性恋色情杂志《在我们背后》（*On Our Backs*）嘲讽。）反色情女性主义者被严重诋毁，并被错误地记忆为一群拥有教守主义论点的铁板一块，是解放式放荡的对立面。


    情况比这复杂得多（即厌视女性色情会鼓励并模仿实际的厌视女性这一观点，只需要你接受表现具有力量和影响这一合理想法）。正如当下的网络骚扰，一个问题被提出：当某些言论旨在粉碎他人说话和被听见的权利及能力时，什么是言论自由？


    苏珊·格里芬（Susan Griffin）1981年的著作《色情与沉默》（*Pornography and Silence*）提出了一个原创的论点：主流色情不应被想象为自由意志的言论，或应当被听见的自由声音，而应被视为一种特殊的压迫。她写道：“色情不是人类情欲情感的表达，不是对身体生命的热爱，而是对身体知识的恐惧以及对让爱欲（eros）沉默的渴望。”在她看来，色情并不是情欲的——如果情欲意味着对身体、自我、情感和他者的充分体验的话——而是它的对立面，充满了“基督教的形而上学……一座建立在旧大教堂遗址之上的现代建筑，共享着相同的基础。”


    那个基础包括对肉体的厌恶、对欲望的愤怒，以及将欲望和那份愤怒投射到女性身上。“我们将看到，色情中的‘女性’，就像反犹太主义中的‘犹太人’和种族主义中的‘黑人’一样，仅仅是灵魂中迷失的部分，是色情者或种族主义者会忘记或否认的领域。”格里芬此后的工作经常试图去记忆、去承认、扩大我们可能存在、梦想、思考、爱意以及庆祝情欲和感官体验的空间。


    关于色情的辩论从未停止。1993年，哲学家雷·兰格顿（Rae Langton）在一篇非凡且严谨的文章《言语行为与不可言说的行为》（“*Speech Acts
    and Unspeakable Acts*”）中探讨了这一话题。她的探索和分析远超色情本身，通过将辩论焦点从言论的内容转向言论的作用及其力量，开辟了视野。她指出，我们用语言结婚、投票、判决、下达命令——或者在缺乏这种权力时就不这样做。主子对奴隶说“我要吃东西”是在下达命令，奴隶说同样的话也是下达命令。

