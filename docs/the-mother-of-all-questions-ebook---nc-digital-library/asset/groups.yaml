    you realize how little you grasped at the start, even when you thought you knew.
    We move through life not seeing what is around us, not knowing who is around us,
    not understanding the forces at play, not understanding ourselves unless we stay
    with it, and maybe this is a movie about staying with it. When I watched *Giant*
    earlier this year, for the film’s sixtieth anniversary, the marriage plot was
    familiar, the power of Taylor’s Leslie Benedict remained a joy, and I noticed
    nuances that had escaped me before.


