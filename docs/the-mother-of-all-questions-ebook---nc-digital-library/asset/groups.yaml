    as promised. The horse buyer’s friend notes that “intent on the inward qualities,
    he loses sight of the external. . . . He looks at the things he ought to look
    at, and neglects those that need not be looked at.” In not seeing surfaces, the
    wise man sees depths. One St. Patrick’s day, when my Irish-American mother was
    at the state of Alzheimer’s where what she saw was being processed by her brain,
    she asked a Black man if he was Irish. He was delighted, because in fact we was
    part Irish, but people seldom think to ask about European ancestry of a dark-skinned
    person.


    This is not the same thing as pretending that we can be colorblind in a society
    where our color affects status, experience, opportunities, and chances of being
    shot by the police. Really, what I’m arguing for is the possibility of an art
    of using and not using category, of being deft and supple and imaginative or maybe
    just fully awake in how we imagine and describe the world and our experiences
    of it. Not too tight, not too loose, as a Zen master once put it. Categories are
    necessary to speech, especially to political and social speech, in which we discuss
    general tendencies. They’re fundamental to language; if language is categories—rain,
    dreams, jails—then speech is about learning how to conduct the orchestra of words
    into something precise and maybe even beautiful. Or at least to describe your
    world well and address others fairly.


