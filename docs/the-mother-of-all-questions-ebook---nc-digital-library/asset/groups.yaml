    喜剧界的德高望叔舅杰·里诺（Jay Leno）曾评论道：“我不知道为什么相信女性这么难。你去沙特阿拉伯，你需要两个女性来指证一个男人的罪；在这里，你需要二十五个女性。”一位顶级的单口喜剧演员成为笑话的对象，这其中有一种特殊的讽刺意味。它标志着女性主义喜剧在主流世界的崛起，以及强奸文化的削弱。没有比这更清晰的权力交接标志了。


    比尔·柯斯比（Bill Cosby）之所以在他涉嫌的犯罪行径中生存如此久，归功于一种女性没有信誉、几乎没有话语权的文化；他们举报被他强奸，会导致进一步的攻击，导致他免受惩罚，并导致了权力的不平等。他失去了那种免受惩罚的权利大部分权力，而《纽约杂志》（*New
    York magazine*）7月26日的杂志基本上就是他的墓碑。在那期杂志中，四六名站出来发声并露脸的受害者有三十五名。他们的故事埋葬了他，并从坟墓的沉默中挖掘出了自己。


    艾米·舒默（Amy Schumer）在喜剧中央频道的节目中出现过一两个关于柯斯比的短剧——其中一个是他的辩护律师试图让陪审团相信他们对“美国爸爸”、布丁及其他事物的喜爱超过对真理和正义。这反映了人们拒绝放弃他们喜爱的事物，或拒绝正视让他们感到不安的事物。它以一个转折结束：一张来自柯斯比的信让喝醉的舒默表示感谢，她面露惊恐地看着它，然后把它扔在脑后。她心明如镜。


    但以强奸人为代价、所有强奸笑话中最伟大的里程碑、史诗般的《伊利亚特》，非《内部艾米·舒默》中的“足球小镇夜晚”（Football Town Nights）。那是对《周五之夜》（*Friday
    Night Lights*，关于 Texas高中橄榄球的电视剧）的模仿，更是对强奸文化逻辑更为尖锐的讽刺。4月底的这段短剧描绘了一个新教练试图教他的男孩们不要强奸，换来的是孩子们的不解和社区的愤恨。舒默扮演教练的贤妻子，随着他的新工作变得越来越糟糕，她带着越来越大的白葡萄酒杯出现。


    起初，橄榄球队在更衣室里试图在教练的“禁止强奸”规则中寻找漏洞。“我们可以在客场赛中强奸吗？”不行。“如果那是万圣节，她打扮成性感的猫呢？”不行。“如果她认为是强奸，而我不认为是呢？”还是不行。“如果我妈妈是检察官且不予起诉，我可以强奸吗？”“如果那个女孩前几天跟我说（但那是关于其他事）呢？”“如果那个女孩说了好，然后突然像疯子一样改变了主意呢？”


    这些“高学学者”的论点恰恰是大学校园和评论区经常看到的逻辑与无逻辑，即拒绝承认男性权利的界限，或拒绝承认女性权利的存在。这一节之后是一个精彩而令人震惊的场景：中年妇女们坐在教练面前，指责他让“我们的孩子”获得了理所应当的强奸机会（这让人想起了针对任何指控体育明星强奸的年轻女性的真实愤怒，以及主流媒体对加害者受影响而非受害者的关注）。整个短剧是一个幽默的笑话，揭示了那些想当强奸者的人是多么不理智，以及有多少社区支持那些这类混蛋——简而言之，关于的不是强奸本身（短剧中没有发生任何强奸），而是强奸文化。局面已经反转了。女性主义还没有赢，为了让每个人的基本人权得到尊重的战争还没有结束，但我们现在正处于连胜状态。这有时是挺幽默的，同时也极其严肃。


    后记：自从我写下这篇文章以来，舒默在短剧和言论中严重偏离了种族问题。她的愿景（以及她的剧本）是有缺陷的，有时她的辩护更多是为了直性白人年轻女性的情感需求，而非革命对其内涵可能能做的贡献。

