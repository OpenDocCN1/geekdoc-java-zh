    why females are faithful and males are powerful: fidelity is exchanged for gobbets
    of meat.


    There was even a 1966 conference at the University of Chicago titled “Man Hunter”
    that resulted in a book of that title. In a Google search of the online version
    of the book, the word woman first occurs on page 74, in this sentence: “The non-moving
    members are less able-bodied persons or the aged, women, and children.” The word
    gatherer is similarly rare, though the book is supposed to be about hunter-gatherers.
    All this would be only a historical curiosity were it not the stories we tell.
    People from the mainstream to our own era''s misogynistic fringe peddle them as
    facts about we used to be, and, too often, who we are now.


    I learned something about this bizarre fantasy of evolutionary biology at the
    end of the nineties, while writing a book about the history of walking. I came
    across the work of anatomist C. Owen Lovejoy, who had been writing about the evolution
    of human walking in academic journals for over a decade. He deployed a more technically
    complex version of Morris’s tale about pair-bounds: Bipedality figured in this
    reproductive scheme because by freeing the hands made it possible for the male
    to carry food gathered from his mate.” The walking and the hand thing were for
    the guys. We stayed home, dependent.


    A much-cited essay Lovejoy published in 1981, “The Origin of Man,” actually has
    a section called “The Nuclear Family,” in which he posits that Man the Hunter—who
    is more monogamous than Morris’s hunter with “his females”—brought home meat for
    his faithful ladyfriend and children, not the whole group. This seems dubious
    when you''re talking about a big dead animal in warm weather or anything hunted
    in the company of friends. Wouldn''t you be more likely to share your kill and
    maybe women waited. Lovejoy theorized about the “lowered mobility rate of females.”
    In summary: “The nuclear family and human sexual behavior may have their ultimate
    origin long before the dawn of the Pleistocene.”


    There is ample evidence to contradict the Man Hunter story. In the 1950s, Elizabeth
    Marshall Thomas lived with the people of the Kalahari, sometimes known as the
    San. They are thought to have maintained, until recently, a more ancient way of
    life than anyone else on earth.'
