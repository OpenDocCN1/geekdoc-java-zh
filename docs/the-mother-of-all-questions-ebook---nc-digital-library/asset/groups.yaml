    \ question.\n\nWe talk about open questions, but there are closed questions, too,\
    \ questions to which there is only one right answer, at least far as the interrogator\
    \ is concerned. These are questions that push you into the herd or nip at you\
    \ for diverging from it, questions that contain their own answers and whose aim\
    \ is enforcement and punishment. One of my goals in life is to become truly rabbinical,\
    \ to be able to at least remember a good gatekeeper-intruders approach to, and\
    \ to say, \"Why are you asking? This, I've found, is always a good answer to an\
    \ unfriendly question, and closed questions tend to be unfriendly. But on the\
    \ day of my interrogation having babies, I was taken by surprise (and severely\
    \ jet-lagged), and so I was left to wonder: Why do such bad questions so predictably\
    \ get asked?\n\nMaybe part of the problem is that we have learned to ask the wrong\
    \ things of ourselves. Our culture is steeped in a kind of pop psychology whose\
    \ obsessive question: Are you happy? We ask so that it seems natural to wish that\
    \ a pharmacist with a time machine could deliver a lifetime supply of antidepressants\
    \ to Bloomsbury, so that an incomparable feminist stylist could be reintroduced\
    \ to produce litters of Woolf babies.\n\nQuestions about happiness generally assume\
    \ that we know what a happy life looks like. Happiness is often described as the\
    \ result of having a great many ducks lined up in a row—spouse, offspring, private\
    \ property, erotic experiences—even though a millisecond of will to bring us countless\
    \ people who have all those things and are still miserable.\n\nWe are constantly\
    \ given one-size-fits-all formulas, but those formulas fail, often and hard. Nevertheless,\
    \ we are given them again. And again and again. They become prisons and punishments;\
    \ the prison of the imagination traps many in the prison of a life that is correctly\
    \ aligned with the recipes and yet is entirely miserable.\n\nThe problem may be\
    \ a literary one: we are given a single story line about what makes a good life,\
    \ even though not few who follow that story line have bad lives. We speak as though\
    \ there is one good plot with one happy outcome, while the myriad forms a life\
    \ can take flower—and wither—all around us.\n\nEven those who live out the best\
    \ version of the familiar story might not find happiness as their reward. This\
    \ is not necessarily a bad thing. I know a woman who was lovingly married for\
    \ seventy years. She has had a long, meaningful life that she has lived according\
    \ to her principles, and she is loved and respected by her descendants. But I\
    \ would not call her happy; her compassion and concern for the future have given\
    \ her a respondent worldview. What she has instead of happiness requires better\
    \ language to describe. There are entirely different criteria for a good life\
    \ that might matter more to a person—loving and being loved or having satisfaction,\
    \ honor, meaning, depth, engagement, hope.\n\nPart of my endeavor as a writer\
    \ is to find ways to value what is elusive and overlooked, to describe nuances\
    \ and shades of meaning, to celebrate public life and solitary life, and—in John\
    \ Berger’s phrase—to find “another way of telling,” which is part of getting slobbered\
    \ by the old ways of telling is disheartening.\n\nThe conservative “defense of\
    \ marriage,” which is really nothing more than a defense of the old hierarchical\
    \ arrangement-straight marriage before feminists began to reform it, is sadly\
    \ not just the property of conservatives. Too many in this society are entrenched\
    \ in the devout belief that there is something magically awesome for children\
    \ about the heterosexual two-parent household, which leads many people to stay\
    \ in miserable marriages that are destructive for everyone within range. I know\
    \ people who long hesitated to leave horrible marriages because the old recipe\
    \ insists that a situation that is terrible for one or both parents will be beneficial\
    \ for the children. Even women with violently abusive spouses are often urged\
    \ to stay in situations that are supposed to be so categorically wonderful that\
