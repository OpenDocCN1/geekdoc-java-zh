    In a landmark essay from 2014, “The Public Voice of Women,” she notes that silencing
    women begins almost as soon as Western literature does, in the _Odyssey_, with
    Telemachus telling his mother, Penelope, to shut up. Penelope is already stranded
    at home and besieged by suitors while her husband leisurely wanders around the
    Mediterranean landing. (You can imagine a feminist revision in which Penelope
    enjoys her autonomy, takes some of the suitors as lovers, and maybe doesn''t yearn
    for her husband''s return; Margaret Atwood tried out a version of this with her
    _Penelope_.) Beard describes how a voice—preferably a deep one—was considered
    definitive of masculinity, and the public sphere: “A woman speaking in public
    was, in most circumstances, by definition not a woman.”


