    以及那些反叛者们\n\n## 引言\n\n本书中最长、最新的一篇随笔是关于沉默的。我开始写它时，认为我是在写女性被沉默的各种方式。我很快意识到，男人被沉默的方式也是我主题不可分割的一部分，而且我们每个人都存在于多种沉默的复合体中，包括我们所谓的“性别角色”的互惠沉默。这是一本女性主义书籍，但它不仅仅关乎女性的经历，而是关于我们所有人——男性、女性、孩子，以及那些挑战性别二元法和边界的人。\n\
    \n本书涉及了狂热的女性主义男性，也涉及了连环强奸犯，它的写作是基于一种认知：所有类别都是流动的，我们必须临时地使用它们。它关注了快速的社会变化，这些变化不仅仅是在改变法律。它正在改变我们对知情、权力、权利、性别、声音和代表性的理解。这是一场华丽的变革运动，特别是由年轻人领导的，在校园、在社交媒体、街头，我对这群无畏且毫无歉意的新一代女性主义者和人权活动家充满了由大的钦佩。同样，我也对这种反弹感到恐惧，这种反弹本身就证明了女性主义作为更广泛的解放计划的一部分，对男权主义和现状所构成的威胁。\n\
    \n本书是一场穿过杀戮的之旅，是对解放与团结、洞察与同情的颂歌，也是对我们可能探索所有这一切时所使用的术语和工具的调查。\n\n## 终极问题 (2015)\n\
    \n几年前，我做了一场关于弗吉尼亚·伍夫（Virginia Woolf）的演讲。在随后的提问环节，似乎许多人感兴趣的话题是伍夫是否应该生孩子。我尽职地回答了这个问题，指出伍夫显然在看到她的姐姐瓦内莎·贝尔（Vanessa\
    \ Bell）享受为人母的快乐后，考虑过在婚姻早期生孩子。但随着时间的推移，伍夫开始认为生育是不明智的，也许是因为她自己的心理不稳定。或者，我提议道，她是想成为一名作家，将生命献给艺术，而她对此取得了巨大的成功。在演讲中，我赞同地引用了她对杀掉“家中的天使”（the\
    \ Angel in the House）的描述，那是告诉许多女性要做家庭内务和男性自尊的自我牺牲的女仆的内在声音。我很惊讶，主张扼杀传统女性气质的精神竟然会导致这种对话。\n\
    \n我本应该对观众说的是，我们对伍夫生育状态的质问，是偏离她作品所提出的宏大问题的一场催眠且毫无意义的绕行。（我想在某个时刻，我心里想：“去他的这鬼”，这传达了同样的大意，并让大家都离开了讨论。）毕竟，许多人人都生了孩子；但只有一个人写了《灯塔》和《三本金尼亚斯》，我们讨论伍夫是因为后者。\n\
    \n原本应该是关于我写的一本政治书的提问，那个采访我的英国男人坚持认为，我们不应该谈论我思想的产物，而应该谈论我的肉体果实，或者说缺乏果实。在舞台上，他纠缠我为什么没有孩子。我给出的任何回答都没有让他满意。他的立场似乎是我必须生孩子，我不生孩子是不可理喻的，因此必须谈谈我为什么不生。当我下台时，我出版社的公关——身材瘦小，穿着粉色芭蕾舞鞋并戴着婚戒指——正在愤怒地嚎叫。“他绝不会那样问一个男人的，”她唾了一道。她是对的。\n\
    \n"
