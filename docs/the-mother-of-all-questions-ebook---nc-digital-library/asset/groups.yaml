    the same thing, they are inseparable.


    In Wanderlust, my book on the history of walking, I described my own experience
    as a young woman:


    "It was the most devastating discovery of my life that I had no real right to
    life, liberty and pursuit of happiness out of doors, that the world was full of
    strangers who seemed to hate me and wished to harm me for no reason than my gender,
    that sex so readily became violence, and that hardly anyone considered it a public
    issue rather than a problem."


    I was given advice how to modify or limit my own life—rather than an affirmation
    that this was wrong and should change.


    It was, and still is, a sort of blame-the-victim framework, this insistence that
    women modify their presence in public space, or just give up and stay in, rather
    than that we transform public space (or men) so that women have the right to walk
    down the street unharassed. The same blame has been applied to women in nearly
    every situation which they are attacked by men, as a way of not blaming them.
    If I’m exhilarated this year I’ve read more rape trials; victims’ testimonies;
    accounts of murders, beatings, and threats; and rape weaves and misogynist comments
    than in probably all my other years together, it’s because violence against women
    is now a public issue. At last.


    # WAITING FOR THE WATERSHED


