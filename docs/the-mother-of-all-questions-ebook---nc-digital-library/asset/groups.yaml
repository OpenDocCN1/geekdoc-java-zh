    good answer how to be a woman; the art may instead lie in how we refuse the question.


    We talk about open questions, but there are closed questions, too, questions to
    which there is only one right answer, at least far as the interrogator is concerned.
    These are questions that push you into the herd or nip at you for diverging from
    it, questions that contain their own answers and whose aim is enforcement and
    punishment. One of my goals in life is to become truly rabbinical, to be able
    to at least remember a good gatekeeper intruders approach to, and to say, "Why
    are you asking? This, I''ve found, is always a good answer to an unfriendly question,
    and closed questions tend to be unfriendly. But on the day of my interrogation
    having babies, I was taken by surprise (and severely jet-lagged), and so I was
    left to wonder: Why do such bad questions so predictably get asked?


    Maybe part of the problem is that we have learned to ask the wrong things of ourselves.
    Our culture is steeped in a kind of pop psychology whose obsessive question: Are
    you happy? We ask so that it seems natural to wish that a pharmacist with a time
    machine could deliver a lifetime supply of antidepressants to Bloomsbury, so that
    an incomparable feminist stylist could be reintroduced to produce litters of Woolf
    babies.


    Questions about happiness generally assume that we know what a happy life looks
    like. Happiness is often described as the result of having a great many ducks
    lined up in a row—spouse, offspring, private property, erotic experiences—even
    though a millisecond of will to bring us countless people who have all those things
    and are still miserable.


    We are constantly given one-size-fits-all formulas, but those formulas fail, often
    and hard. Nevertheless, we are given them again. And again and again. They become
    prisons and punishments; the prison of the imagination traps many in the prison
    of a life that is correctly aligned with the recipes and yet is entirely miserable.


    The problem may be a literary one: we are given a single story line about what
    makes a good life, even though not few who follow that story line have bad lives.
    We speak as though there is one good plot with one happy outcome, while the myriad
    forms a life can take flower—and wither—all around us.'
