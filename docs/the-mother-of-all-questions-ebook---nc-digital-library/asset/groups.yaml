    In 2010 book At the Dark End of the Street, Danielle L. McGuire argues that the
    Civil Rights Movement was itself silenced, in a way, when it was rewritten as
    a history of what movement led by men (and forgotten women) did about everyone’s
    rights. She restarts the history with Rosa Parks as an investigator of rape cases
    for the NAACP, thereby recasting the whole movement launched by Black women for
    Black women’s rights, an intersection ordinarily erased from the history of that
    boulevard.


    In contrast, 1969 Susan Sontag published an essay, “The Aesthetics of Silence,”
    that is silent about gender. It is about male artists and uses the male pronoun
    to “describe the artist.” She wrote about choosing silence, artists such as Marcel
    Duchamp and Arthur Rimbaud, for whom silence was a gesture of scorn or transcendence,
    a departure—but then she notes, “An exemplary decision of this sort can be made
    only after the artist has demonstrated that he possesses genius and exercised
    genius authoritatively.”It the quiet some choose after being heard and valued—the
    antithesis of being silenced.


    What gets second-wave feminism is full of accounts of oppressions that were not
    previously named or described, and of the girl recognizing even oppression: diagnosis
    is the first step toward cure and recovery. To speak of, to find definitions for
    what afflicted them brought women out of isolation and into power. The writings
    of the 1960s and 1970s are a literature of exploration, even revelation: people
    stumble forward, not sure what they are encountering, describing it awkwardly,
    reaching for new language for things that have not been described before, seeing
    the new undermine assumptions about the familiar, becoming people who belong to
    this new territory as much or more than the old one, crossing over to a world
    invented as they go.


