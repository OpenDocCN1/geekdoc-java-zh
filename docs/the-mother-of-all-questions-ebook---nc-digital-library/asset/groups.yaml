    他们的立场最近被狂热游戏、前职业足球运动员、直言不讳的酷少数权利倡导及女性主义者克里斯·克鲁维（Chris Kluwe）在一次引人注目的指责中抨击。他在一段较为礼貌的段落中告诉他的游戏同胞们：


    不幸的是，为了让所有的 #游戏门事件（Gamergates）继续捍卫这种幼稚的肮脏，唯一能得出的结论是逻辑上的：那就是你们支持这些极度歧视女性的白痴。你们支持视频游戏行业（以及其他领域）对女性的骚扰。你们支持对“玩家”的愚蠢刻板印象——即躲在地下室里的汗货，而许多人一直以来努力想要消除这种印象。


    随后有人给克鲁维发了推文：“去去死吧，你这个傻臭逼。游戏门不是在恨女性。”对此，我想补充一个刘易斯法则（Lewis''s Law）的变体（所有对女性主义的评论都证明了女性主义的合理）：大量攻击女性以及任何为女性发声的人，为了证明女性没有受到攻击且女性主义没有现实依据，他们显然没有意识到自己正在证明相反的结论。


    如今强奸和死亡威胁随处可见。在萨基斯（Sarkees）的案例中，犹他大学拒绝采取关于校内可能发生屠杀的威胁（尽管法律允许携带武器进入讲堂），因为她经常收到死亡威胁，结果导致她不得不取消自己的课程。


    其他时候，他们试图将任何关于女性苦境的言论重新转移到男性的苦境上。例如，阅读网上关于校园强奸的男性评论，你可能会认为我们正面临着一种无意识或恶意的年轻女性的流行病，她们为了陷害无辜的旁观者而经常自残式。《福布斯》最近刊登了一篇（随后他们忙着删除）由某麻省理工学院（MIT）兄弟会前主席发表的文章，标题为《醉酒女性客人是兄弟会最大的威胁》。


    有时，男性坚持认为“公平”意味着承认男性遭受女性的伤害就像女性遭受男性的伤害一样，甚至认为他们遭受的更多。你大可以辩称白人遭受种族主义伤害的程度与黑人完全一样，或者这个世界上不存在特权等级和压迫程度之分。确实有人这么做。


    事实是，例如女性确实会实施家庭暴力，但在数量或严重程度上的后果有着巨大差异。正如我在《男人向我解释事情》（*Men Explain Things to Me*）中所写的，家庭暴力是：


    - 美国女性受伤的首要原因；根据疾病控制与预防中心的数据，每年有200万人受伤，其中超过五十万需要医疗治疗，约14万需要住院过夜，而你不想知道之后还需要进行的牙科治疗。配偶也是美国孕妇死亡的主要原因。


    然而，孕妇是其配偶死亡的主要原因。这两者之间根本没有等效性。


    并非所有人都能理解这一点，但有些人是这样的（这也许可以作为一个很好的标签）。我们看到漫画演员阿齐兹（Aziz）表演了一段关于性骚扰的节目。“变态男到处都是，”他说，描述了一个女性为了躲避一个跟踪她的男士而在宠物店里躲了一个小时。他指出，男性从未需要面对过女性在公共场所抽打他们的殖器、在他们面前自慰或以同样怪异的方式骚扰他们。“女性才不干那份事儿！”他惊呼道（他归功于他的女朋友让他变成了一个女性主义者）。


    喜剧演员纳托·格林（Nato Green）、W·卡Mau·詹姆斯·怀特（W. Kamau James White）和路易斯·凯（Louis C. K.）是其他现在发声的女性主义喜剧演员，约翰·史蒂华（Jon
    Stewart）也有一些精彩的表现。男性不仅参与了对话，而且成为其中日益幽默的一部分，这很好。贝尔（Bell）、怀特（White）和特朱·科尔（Teju Cole）等黑人在问题上异常敏锐、善辩且直率，也许是因为压迫理解压迫。


    科尔写道：


    - 昨晚，阅读科比（Cosby）侵犯女性的描述时，我被悲伤淹没。

    - 对此很难评论，但沉默不是选择。这是每个人的事务但我会对正在阅读的男性说一些话。


    我们从强奸文化中受益，所有男性都受益。我们从它带给女性的痛苦中获益，因为我们在毫无顾忌地前进；我们从它将她们挤出局并为我们腾出空间的方式获益；我们从它将她们非人性化以便我们自己的人性能更加闪耀的方式获益；我们从它作为作为施暴者或受益者所赋予我们的权力感中获益。正因为我们显性或隐性地获益，我们对它的反对才不够响亮。


    我们必须在这方面成为盟友，在那些永远斗争的女性世代中扮演至关重要的辅助角色。为什么这会容易呢？这不可能。


    ## 对虚假强奸指控的痴迷：一个实用的手册章节


    当然，旧观念依然在起作用。几乎每当我听到或或在网上读到）有人成为强奸受害者时，总有一个男性跳出来提出“虚假强奸指控”这个“问题”。说真的，这几乎是某些人嘴里蹦出的第一个词；男性似乎对这个话题非常痴迷，它往往成为一种将焦点从广泛的女性受害者转移到极少数男性受害者的便利手段。因此，我整理了这份关于该主题的实用指南，以后我再也不需要它。


    强奸在我们的文化中如此普遍，称其为流行病是合理的。毕竟，还有什么能用来形容一种直接影响近五分之一女性（以及七十分之一男性），并作为威胁影响几乎所有女性，且如此渗透以至于在我们人生的大部分时间改变了我们生活、思考和在世界上行走方式的东西呢？女性虚假声称强奸的实际案例极其罕见。最可靠的研究表明，2%的强奸报告是虚假的，这意味着98%是真实的。即使是统计数据也不意味着那2%是虚假指控，因为在没有被强奸的情况下说自己被强奸等于虚报。尽管如此，这些数据并没有阻止男性反复提起这一话题。此类指控听起来是这样的：


    - 女：我的部落正面临着流行病！

    - 男：我担心一种听说过（但没研究过）极其罕见的疾病可能会侵扰我部落的成员！


    或者它听起来是这样的：


    - 女：你们的部落对我们做了可怕的事，这是有据可查的。

    - 男：你们的部落充满了谎子。我真的没有证据，但我的感觉比你的事实更理性。


    顺便提醒一下，当你考虑那些强奸数据时，记住大多数强奸都没有报案。在报案的强奸中，大多数都没有起诉。在已起诉的强奸中，绝大多数未能获得定罪。提起强奸指控通常不是一种寻求正义的有趣且有效的方式，而且虚报罪行本身就是一种犯罪，警方通常对此并不感冒。


