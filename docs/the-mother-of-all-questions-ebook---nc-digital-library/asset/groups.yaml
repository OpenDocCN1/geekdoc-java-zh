    Their position was recently attacked in a striking rant by avid gamer, former
    pro football player, outspoken queer rights advocate, and feminist Chris Kluwe.
    He told his gaming brethren, in one of his more polite passages:


    Unfortunately, to draw all #Gamergates keep defending this puerile filth, so the
    only conclusion to draw is the logical one: That you support misogynistic cretins
    in all mouthbreathing glory. That you support the harassment of women in the video
    game industry (and in general). You support the idiotic stereotype of the "gamer"
    as a basement-dwelling sweatat that so many people have worked so hard to try
    and get rid of.


    Someone then tweeted at Kluwe, "Go fuck yourself stupid cunt. Gamegate is not
    hating on women." To which I''d like to append a variation on Lewis''s Law ("all
    comments on feminism justify feminism): the plethora of men attacking women and
    anyone who stands up for women in order to prove that women are not under attack
    and feminism has no basis in reality are apparently unaware that they''re proving
    the opposite.


    There are so many rape and death threats these days. In Sarkees'' case, the University
    of Utah declined to take the threat of a massacre at the school (despite the fact
    that weapons could legally be brought into the lecture hall), because she gets
    death threats all the time, and as a result, she had to cancel her own lesson.


    Other times they try to refocus anything said about women''s woes on men''s woes.
    Reading men''s comments online about campus rape, for example, you''d think we
    face an epidemic of unconscious bout malicious young women regularly impaling
    themselves on innocent bystanders for the purpose of getting them in trouble.
    Forbes recently ran, and they scrambled to delete, a imaju by a former president
    of an MIT fraternity titled, "Drunk Female Guests Are the Gravest Threat to Fraternities."


    Sometimes, men insist “fairness” means admitting that men suffer from women just
    as women do from men, or even that they suffer more. You might as well argue that
    white people suffer from racism exactly as much as Black people, or that there
    are no hierarchies of privilege and degrees of oppression in this world. Some
    do.


