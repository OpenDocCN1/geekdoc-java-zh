    not a pleasure.


    The omnipresence of men raping female children as a literary subject, from Hardy''s
    Tess of the d''Urbervilles to Brett Easton''s Less Than Zero, along with real-life
    accounts like that of Jaycee Dugard (kidnapped at eleven in 1991 and used as a
    sex slave for eighteen years by a Bay Area man) or Elizabeth Smart (kidnapped
    in 2002 and used the same way, for nine months), can have the cumulative effect
    of reminding women that we spend a lot of our lives, strategically trying not
    to get raped, which takes a huge toll on our lives and affects our sense of self.
    Sometimes art reminds us of it.


    Hardy''s novel is, in fact, a tragedy of what happens when a young woman''s lack
    of agency, beginning with her lack of the right to say no to the sex forced by
    a rich man, spirals out to destroy her life in a great manner. It could be regarded
    as great feminist novel. There are a lot of male writers, even a long way back,
    whom I think of as humane and empathetic toward female as well as male characters:
    Worthsworth, Hardy, Tolstoy, Trollope, Dickens come to mind. (That none of them
    are blemishless human beings we can discuss another time, possibly after hell
    over.)


