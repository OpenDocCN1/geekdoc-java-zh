    force can also look back to a time when the faint, improbable outlines of unaskable
    questions, curling in her brain cells, triggered a shock of recognition at certain
    lines, phrases, in the work of this or that woman, long dead, whose life and experience
    she could dimly try to imagine.


    Once unaskable, the questions were being asked. In 1980, Rich added to her critique
    with the landmark essay "Compulsory Heterosexuality and Lesbian Ethics," looking
    at the way that the identity and activity of a significant sector of women were
    overlooked or excluded and that distorted the possibilities of living and understanding
    for all of us. She wrote of one popular feminist book of the time that it “ignores,
    specifically, the history of women who as witches, *femmes seules*, marriage resisters,
    spinsters, autonomous widows, and/or lesbians—have managed on varying levels not
    so much to learn and on is this history, precisely, from which feminists have
    so much to learn and on which there is overall such blanketing silence.” She was
    a great explorer.


    She questioned heterosexuality as a norm: “The assumption that “most women are
    innately heterosexual” stands as a theoretical and political stumbling block for
    many women . . . the failure to examine heterosexuality as an institution is like
    failing to admit the economic system called capitalism or the caste system of
    racism is maintained by a variety of forces.” She writes of how lesbian lives
    had themselves silenced, along with the possibility thatosexuality is not natural
    “but something that has had to be imposed, managed, organized, propagandized and
    maintained by force.” A new city of ideas and possibilities was being built, like
    a material city, by an accretion of projects, labors, decisions, and desires,
    and women were taking up residence in it.'
  - '[PAGE 52]


    The feminism of the 1970s is full of the joy and fury of recognition and the power
    that comes with recognition even of terrible things. What can be recognized can
    be remedied or resisted. In the third novel of Naples quartet, Elena Ferrante
    describes her protagonist’s discovery of feminist analysis in the 1970s: “How
    it is possible, I wondered, that a woman knows how to think like that? I worked
    so hard on books, but I endured them, I never actually used them, I never turned
    against themselves.” She sees, for the first time, that the world might look like
    from outside the assumptions that circumscribed her sense of possibility for herself,
    for her gender, for her language.


    Some of the feminists of that era, notably Catherine MacKinnon and Andrea Dworkin,
    spoke out against one form of speech and representation —pornography—on the grounds
    that it contributed to the subjugation of women. Their work led to marches, demonstrations,
    legal cases, and bans that were overturned on free-speech grounds. Others in the
    movement defended pornography, either in and of itself or as free speech. (The
    defiant title of the journal Off Our Backs was mocked by the lesbian erotic magazine
    On Our Backs.) The antiporn feminists were much vilified, and they were misremembered
    as a monolith with puritanical arguments, the foil to liberatory libertineage.


    It was more complicated than that (the position that misogynistic pornography
    can encourage and model actual misogyny only requires you to accept the reasonable
    idea that representations have power and influence). As Internet harassment in
    the present, the question was raised as to what is free speech, when some speech
    is designed to crush others'' right and ability to speak and be heard.


    Susan Griffin’s 1981 book Pornography and Silence made an original argument: that
    mainstream pornography could be imagined not as libertarian speech, as free voices
    that should be heard, but as a particular kind of repression. She wrote that “pornography
    is an expression not of human erotic feeling and, not of a love of life of the
    body, but of a fear of bodily knowledge and a desire to silence eros.” Pornography,
    in her view, was not erotic—if erotic meant full experience of the body, the self,
    the emotions, and the other—but its opposite, full of “the metaphysics of Christianity
    . . . a modern building built on the site of the old cathedrals, sharing the same
    foundation.'
  - '[PAGE 53]


    That foundation includes loathing for the flesh, fury at desire, and a projection
    of desire and that fury onto women. “We will come to see that ‘the woman’ in pornography,
    like ‘the Jew’ in anti-Semitism and the ‘black’ in racism is simply a lost part
    of the soul, that region of being the pornographic or the racist would forget
    or deny.” Griffin’s work since then has often sought out to remember, to admit,
    enlarge the spaces in which we might be, dream, think, love, and celebrate the
    erotic and sensual.


    The debate over pornography never stopped. In 1993, philosopher Rae Langton took
    up the topic in a remarkable, rigorous essay, “Speech Acts and Unspeakable Acts.”
    Her exploration and analysis shed light far beyond pornography by refocusing the
    debate from what the content of speech is to what it does, what its power is.
    She points out that with language we marry, vote, render verdicts, give orders—or
    don’t, if we lack the power to do so. A master saying, “I want food” to a slave
    is giving an order, the slave uttering the same words is making an appeal; the
    power each holds has everything to do with what their words mean and do. Or cannot.


    Langton makes the case that pornography carries authority as instruction as well
    as entertainment. She cites evidence to suggest that a high percentage of boys
    and young men regard men’s satisfaction as a right and women’s rights as an irrelevancy,
    as well as statistics on date rape and men who find women in panel erotic, and
    ties these things to porn culture. She outlines three kinds of silence. The first
    is the literal silence of intimidation or defeat. The second is when the speaker
    speaks a listener, a response. Then she concludes, “If pornography silences women,
    then it prevents women from doing things with their words.


    This third kind of silence “happens when one speaks, one utters words, and fails
    . . to perform the act one intends.” That is for forbidding, of saying no. “It
    is indeed possible to silence someone . . by making their speech acts unspeakable.
    . . Consider the utterance ‘no.’ We all know how to do things with this word.
    However, in sexual contexts something happens. Sometimes a woman tries to use
    the ‘no’ locution to refuse sex, and it does not work. Refusal—in that context—has
    become unspeakable for her. In this case refusal is not simply frustrated or disabled.”
