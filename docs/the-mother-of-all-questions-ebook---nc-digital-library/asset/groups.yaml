    莫里斯关于“年轻人处于极长期依赖期”导致女性“几乎永远地被困在家庭基地”的说法，正如托马斯所学到的，在桑人（San）身上显然是错误的。


    整个群体会定期移动，家庭也可以独立于群体进行移动。托马斯遇到的女性几乎每天都会外出采集食物。那些大到跟不上的孩子通常由留在营地的人照顾，而母亲则在忙碌。托马斯明确表示，狩猎和采集并不是完全分开的活动，并提到了“采集者经常发现的慢速动物——乌龟、蛇、蜗牛和幼鸟”。


    男性不仅是食物的唯一提供者，他们甚至不是肉类的唯一提供者。这并不是说他们不带肉回家，或者他们不重要，而是每个人都带食物回家，孩子们也是如此。托马斯提到一位异常的猎人，一位能追上羚的运动员。有一天，他杀死了三只大动物。他守在尸旁，他的妻子和母亲招募其他人将肉带回营地。他确实是一个伟大的猎人，但在收获猎物方面，他依赖高流动性的女性和他的扩展社区的帮助。托马斯注意到：“肉团结了人们。一顿赋予生命的肉是属于所有人的。”桑族男性并不是作为个人主义生活方式的核心家庭成员进行狩猎；他们作为社区的一部分进行狩猎。


    根据作家、探险家彼特·弗鲁（Peter Freuchen）的说法，他在二十世纪与因纽特人生活了几十年。他讲述了他的妻子如何愤怒地嘲讽一个吝于分享丈夫杀死猎物的女人。分享既是礼仪也是一种生存。即使在因纽特这种食肉动物群体中，女性有时也会伴同男性进行长时间的狩猎，因为如果衣服损坏，猎人可能会在零下的天气里冻死。女性负责食物、衣物和住所。


    关于男性独立的那些熟悉的“恰如此”故事也误导了定居农民以及手工业者、工业和白领工人的家庭动态。大多数农民在家里工作——一个拥有农田和果园的大家庭——他们的家人与他们一起工作。匠人的妻儿通常以各种方式参与工作。工业革命期间，工人阶级的妇女和儿童在工厂和汗水工厂劳作，正如他们今天在危地拉、中国和孟加拉国的工厂中所做的那样。


    每个人都在贡献。你可以称女性为具有依赖性，但前提是你愿意对男性使用同样的称呼。依赖性并不是一个很有用的衡量标准；相互依赖可能更好。“无用且依赖的”并不是大多数女性的过去，也不是绝大多数女性的现状。关于“男猎猎人”（Man
    Hunter）的故事中包含了男性是给予者和索取者、男性工作而女性空闲的观念，无非是对当今政治立场的辩护。他的愤怒基于一个虚构，这个虚构描绘了人类物种一个相当悲惨的画面，男女都栖居在固定且异化的角色中。这幅画面中包含着一个有趣的矛盾：它一方面暗示女性从未工作过，而另一方面，生孩子是一项如此巨大的工作，以至于女性被困在家里——困在洞穴里或树上。这好像所有女性在一段时间内手里确实满了婴儿和幼儿，但并非永远如此，而且很可能仅仅是在母母亲的这一阶段。推崇父制核心家庭观念的故事，与女性在整个历史或史前中实际做的事情几乎毫无关系。它们暗示人类的状况一直像二十世纪中产阶级、已婚、居家妇女被预期做的那样。即使汉娜·阿伦特（Hannah
    Arendt）也将女性的状况描述为几乎只是生产孩子。她谈论的是古典雅典的特殊情况，那里富有资产的公民女儿很大程度上被困在家里，这限制了她们的生产力和参与。雅典男性也不一定产出很多；食物来自农村和遥远的殖民地，大多数体力劳动是由奴隶和农民完成的。尽管如此，阿伦特在《人类境况》中写道：“个人的维持应是男性的任务，生存应是女性的任务，这是显而易见的，而这两种自然功能——男性提供营养的劳动和女性分娩的劳动——都具有同样的生命紧迫性。”阿伦特似乎无法抵挡“男人的劳动”与“女人的劳动”之间整齐的对称性。但我们应该克制。在历史的大部分时间里，家务比现在困难得多。它涉及铲煤或劈木、生火、泵水、倒空便盆、手洗一切物品、宰杀或照料动物，以及从零开始制作面包、线、衣服等许多东西。当然，过去也经常有闲闲阶级的女性。但她们通常嫁给了闲闲阶级的男性。而她们的闲暇是由狩猎伴侣实现的，其中许多人也是女性。无论如何，闲暇并不是人类的原始状况，也不是现在世界上大多数女性的状况。西方世界曾有过一段短暂的时期，工业化让打理家庭变得更容易，许多中产阶级女性并非薪资经济的一部分。你可以将其中一些女性视为非生产性消费者，尽管说你必须贬低抚养孩子、维持家庭和支持正在工作的配偶所付出的劳动。这一时期持续了数十年，但它始于五年前，并随着工资下降导致更多女性进入劳动力市场而逐渐消退。现在在美国，女性占工资者的47%；这些女性女性中有74%是全职工作的。在工业化国家的大部分地区，数字相似或更高。在其他地方，女性在种植食物、挑水和运柴、放牧牲畜、挖掘木薯根、手磨玉米。


    父权——意味着男性统治以及具有父系后裔的社会（这需要对女性性进行严格控制）——在许多时代和地方创造了许多版本的依赖性、无产的女性，她们因装束或身体改造而残废，被限制在家里，并在法律和习俗的影响下限制教育、就业和职业。一些厌视女性者抱怨女性是移动的负担，但许多厌视女性的行为努力让女性如此。


    反本质主义和女性人类学家试图颠覆这些故事。埃莱恩·摩根（Elaine Morgan）在1972年的著作《女性的起源》（The Descent of Woman）反驳了“男猎猎人”的观点；1981年，莎拉·布莱弗·赫迪（Sarah
    Blaffer Hrdy）写了一本更具科学依据的书《女性从未进化》（The Woman Never Evolved），也提出了替代理论。即使马尔塞尔·萨林（Marshall
    Sahlins）参加了“男猎猎人”会议并贡献了同名书籍，他发表了1972年的论文《石器时代经济》，论证狩猎采集者拥有充足的时间和食物。


    但所有这些故事都隐含着一个假设：我们注定要保持很久以前的样子。根据这种逻辑，我们可以认为由于我们以前吃生肉，就不应该烹饪它；或者因为我们曾四足行走，所以这种双足生物是不被允许的。不久前，人类在一些温暖的地方过几乎全素的饮食，在北极过几乎全肉的饮食。


    我们是一个适应性极强的物种。我们生活在城市、游牧部落和核心单位中；我们实行一夫多妻或一妻多夫或连续一夫一制或守贞戒；我们与异性或同性的人结婚，或从不结婚；我们抚养亲生子或领养，或由叔父母照顾孩子；我们在家里、办公室或作为流动务工或访诊护士工作；我们生活在性别隔离是常态、所有人混杂或性别本身作为一种二元对立概念正在被改变的社会中。

