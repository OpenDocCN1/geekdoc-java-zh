    《小美人鱼》是汉斯·克里斯蒂安·安德森写的一个故事，他在许多意义上都是一个异类人——一个农妇生下的、笨拙、巨大且私生子的儿子，但他却成为了贵族们的宠儿。故事讲述了一个美人鱼为了获得在地球上生活的机会交易了自己的声音。她带着腿走出海洋，却失去了言。正如安德森《野生天鹅》中那个被沉默的女主角一样，她不能、也无法为自己发声。2011年，当曼哈顿一家高端酒店的清洁工纳菲斯萨图·迪亚洛（Nafissatou
    Diallo）遭到国际货币基金组织主席多米尼克·斯特劳斯-坎恩（Dominique Strauss-Kahn）的性侵时，她在媒体上被诋毁和污名，检察官也放弃了案件，但她赢得了对斯特劳斯-坎恩的民诉讼。在许多此类案件中，代价就是沉默。


    公共诚信中心在2009年报告道：“虽然绝大多数遭受过性侵的学生仍保持沉默——根据美国司法部研究部门资助的一项研究，这一比例超过95%——但那些能够站出来的人可能会遇到费解的的纪律程序、不透明的学校管理层以及私下谈判。”在弗吉尼亚大学，指控者被告知他们必须对案件的所有方面保持沉默，否则将面临不服从的惩罚，直到联邦政府干预。此外，Buzzfeed在2015年报道道：“一位巴德学院（Bard
    College）的毕业生本周向美国教育部提交了正式投诉，表示在签署了一份防止她讨论该侵害事件的协议之前，她被允许与学校官员讨论涉嫌的强奸案。”


    2013年，在起诉奥西德学院（Occidental College）的37名学生和校友中，有十人获得了现金，但被禁止参与校园团体“奥西德性侵害联盟”（Occidental
    Sexual Assault Coalition），该团体曾组织了导致联邦调查的活动运动。他们被付钱是为了让他们保持沉默。犯罪学教授丹尼尔·迪尔克斯（Danielle
    Dirks）告诉《洛杉矶时报》，要求“女性保持沉默且不参与校园活动可能会在奥西德大学产生寒蝉效应。这么多女性能够站出来的部分原因在于，其他侵害幸存者能够公开谈论他们的遭遇。”


    当所谓的胜利包含了对沉默的强加时，这意味着什么？或者，我们应该称之为重新施加？


    受害者被沉默的还有其他方式：被嘲笑、被威胁、被诋毁、被排挤。


    丽贝卡·多纳（Rebecca Donner）最近在在线杂志《格尔尼卡》（Guernica）上通过一篇文章打破了自己的沉默，讲述了她在青少年时期被叔叔强奸的经历，讲述了她如何无法开口只能对母亲的提问点头，讲述了她的家庭既怪罪发生的事，又拒绝相信发生过——这种熟悉的受害者归责的认知失调。“我被要求忘记发生的事。我被要求保持沉默。直到现在，我一直像个乖女孩一样闭上嘴。”有数百万这样的故事，它们有各自悲伤的细节，但有着同样的否认和沉默的模式。


    羞耻是一个巨大的沉默制造者。


    沉默是属于或曾属于我们大多数人的负担，尽管有些人人身上承受得比其他人更重，而有些人已经变成了如何将其撇开、丢弃、否认的专家和天才。伊丽莎白·斯玛特（Elizabeth
    Smart）十四岁时从盐湖市的家中被绑架并被强奸了几个月，她说那种禁欲主义性教育告诉她，如果她在结婚前发生性行为就是毫无价值且被污染的。“这就是感觉自己不再有价值是多么容易。你的生活不再有意义。”这种无价值感帮助她保持被囚禁的状态，感到绝望，觉得没有好的生活可以回去。校园反性侵运动的兴起，部分是因为年轻幸存者拒绝被指责而陷入沉默，然后完全拒绝，至少这是一种立场，即使它不是一种心理状态。


    礼貌也是如此。


    我们所说的礼貌意味着一种训练，即他人的舒适更重要。你不应该打扰它，无论发生了什么，你这么做都是错的。我记得几十年前在电里里听过一个短故事，令我难忘，那是一个关于一个女性在纽约地铁上被骚扰的第一人称叙述，她试图弄清楚如何离开，同时又不暗示骚扰者错了或冒犯了他。这是一个讽刺的事件，关于关于保持礼貌、安慰、愉快和无威胁的指令根深蒂固程度，以及它们如何干扰生存。我记得我二十多岁时的一次事件，当时我在深夜的街上被一个可怕的男人威胁，我想起当时我竟然没有想到向路过的汽车招手、大大闹，这些都是我等我长大了、对自己的判断和权利更有信心、没那么害怕制造场面时会做的事。礼貌、自我怀疑、内在的沉默会让更年轻的女性成为更容易攻击的目标。哲学家玛莎·努斯鲍姆（Martha
    Nussbaum）于1969年进入哈佛大学读研究生；她最近回忆道，当她的导师“伸出手去摸她的胸部时……她轻柔地推开了他，小心不要感到尴尬。”


    沉默也是一种权力无的法律地位。


    2015年，法官巴德尔·金斯斯堡（Bader Ginsburg）在审理同性婚姻权利案件时，提到了一起1982年的最高法院案件。“如今的婚姻不再是普通法传统那样，而是根据民法传统，”金斯斯堡解释道，当时正当罗伯茨（Roberts）和肯尼迪（Kennedy）法官开始担心法院是否处于主导男性对从属女性的关系时，“这随着1982年法院裁决推翻《路易斯安纳规则》而结束。”


