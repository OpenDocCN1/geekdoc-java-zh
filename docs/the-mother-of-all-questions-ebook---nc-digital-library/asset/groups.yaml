    另一场审判发生了，据告诉我，这已成为一种推翻定罪的策略。


    现在，回到那些虚假的强奸指控。在《男人应该为女人解释》（*Men Explain Things to Me*）中，我添加了这段脚注：


    虚假强奸指控是存在的，而且相对罕见，尽管那些被诬枉的人的故事令人触目。英国皇家检控署在2013年发布的一项研究指出，在研究期间，共有5,651起强奸诉讼，而针对虚假强奸指控的诉讼仅有35起（或平均每起虚假指控对应超过160起案件，所有比例均低于1%）。2000年美国司法部的一份报告引用了美国的估算数据：每年有322,230起强奸案，导致55,424起警案、26,271人被捕以及7,007人被定罪——仅占计数的强奸案的2%多，以及占报案强奸案的12%。


    换句话说，报案强奸并不可能让某人入狱，尽管2%的强奸指控是虚假的，但只有略多于2%的所有指控导致了定罪。（某些估值高达3%。）换句话说，外面有很多未受惩罚的强奸者。而且大多数人在被指控或起诉时并不承认实施强奸。这意味着我们面对的是群既是强奸者又是谎子的人，也许充斥四周的谎言来自那些强奸过的男性，而不是没有被强奸过的女性。


    虚假的强奸指控确实发生过我的朋友阿斯特拉·泰勒（Astra Taylor）指出，这个国家最戏剧性的例子是白人男性诬告黑人男性侵犯白人女性。这意味着，如果你想勾出一幅关于权力、责任和年龄究竟如何运作的更复杂的画面。例如，20世纪30年代臭名昭著的斯茨斯堡男孩集体强奸案——当时白人女性也受到当局的压力以陷害黑人男性。在斯茨斯堡案中，指控者之一、17岁的露比·贝茨（Ruby
    Bates）后来在受到威胁的情况下撤回了证词并说出了真相。


    然后是1989年的中央公园跑步者案件，警方在该案中强迫了虚假口供，且司法系统（包括一名女检察官）定罪并监禁了五名无辜的非洲裔和拉丁裔青少年。那个被被打死的白人受害者对事件没有记忆，也不是针对他们的指控证人。在2002年，真正的凶手坦认了罪，这五个人得以清白，但那是在他们的青春在监狱里为自己未犯的罪行而耗尽之后。甚至在2016年，唐纳德·特朗普仍在宣称这些无辜者有罪。定罪无辜者往往源于司法系统的腐败和行为不当，而不仅仅是一个孤独的指控者。当然，也有例外。我的观点是，这些是罕见的。


    对虚假强奸指控的痴迷显然源于许多原因，包括认为它们很常见的幻觉，以及关于女性天生虚伪、操纵和不可信赖的长期诋毁。对这一问题的反复提及暗示着一种奇怪的男性自信，这种自信源于认为自己比女性更有信誉感。而现在这种情况正在发生。也许我所说的自信是指特权感。也许这些女性主义男士在说：男人终于要承担责任了，这惊吓了他们。也许让他们感到恐惧是件好事——或者至少是学会负责。


    ## 是什么让一个行星变得宜居


    长期以来，这种情况可以用直白的话来描述。假设大量的男性仇恨女性，无论是在街上骚扰的陌生人、在推特上被威胁闭嘴的用户，还是被殴打的妻子。某些男性认为他们有权羞辱、惩罚、沉默、侵犯甚至消灭女性。结果，女性面临着某种程度的日常暴力和威胁性的氛围，以及许多较小的侮辱和侵犯，以此压制我们。因此，南方贫困法律中心将一些男性权利团体归类为仇恨团体并不意外。


    在这种背景下，考虑一下我们所说的“强奸文化”。它是仇恨。那些运动队和兄弟会的文化是建立在一种观点上的：侵犯另一个人类的权利和身体是一件很酷的事。这种集体行为基于对男性气概何种掠食性怪兽式的观念，许多男性并不认同这种观念，但它影响着我们所有人。这也是男性能够以女性无法做到的方式纠正的问题。


    另一个晚上，我离开了一个由我认识的一位物理学家做的关于什么让行星变得宜居的讲座——温度、大气、离恒星的距离。


    我曾想过请一位我朋友的朋友的年轻人在加州科学院外那个黑漆漆的公园里陪我走到车旁，但我与那位物理学家聊了起来，直接走了过去，完全没有考虑是否有必要，我开车去了她的车。


    几周前，我加入了艾玛·苏尔科维奇（Emma Sulkowicz）和一群年轻女性，她们在哥伦比亚大学的课之间抬着床垫。如前所述，苏尔科维奇是一个艺术专业的学生，她报告自己被强奸，并注意到校园当局或纽约警方局都没有提供任何看起来像正义的东西。作为回应，她通过一件行为艺术作品见证了自己的困境，这件作品的内容是：当她在校园时，无论去向哪里，都拖着一张宿舍床垫。


    媒体的反应是巨大的。一个纪录片团队那天就在场，那位中年女摄影师对我说，如果她年轻时有校园知情同意，那么女性说不的权利和男性尊重女性权利的义务得到承认，她的生活将会不同。我思考了片刻，意识到：我的也是如此。在12岁到30岁之间，我的大部分精力都花在躲避掠食性男性生存上。这种由于我的性别而可能遭受陌生人或熟人施加的羞辱、伤害甚至是死亡，导致我必须时刻保持警觉——这这也是我成为女性主义者的一部分。


    我热衷地从环境角度关注我们星球的宜居性，但在它完全对女性可以自由走在街上而无需时刻担心危险变得宜居之前，我们将一直承受损害我们能力的实际和心理负担。这就是为什么，作为一个认为气候变化是目前最重要的事情的人，我仍然在写女性主义和女性权利的文章。在我写这篇文章之后，《滚石刀》杂志发表并撤回了一篇关于弗吉尼亚大学强奸案的故事。该文章聚焦于一个所谓的受害者，她的陈述没有经过事实核查，且并不准确。

    '
