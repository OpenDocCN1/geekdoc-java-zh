    # 七死后一年

    (2015)


    1988年，摄影师理查德·米拉奇（Richard Misrach）发现了几本《花花》杂志，它们曾被用作内华达核试验场附近的射击目标，那里曾爆炸过一千枚美英核武器。当他看去时，一阵微风吹过杂志书页，翻到一张雷·查尔斯（Ray
    Charles）唱歌的照片。杂志的每一页都布满了如星空般的弹孔——参差不齐，弹孔向纸张延伸出破碎的裂口。米拉奇回忆道，雷·查尔斯的“狂喜被一颗穿透杂志的子弹化成了尖叫。我意识到，这两本杂志封面上的女性是预定的目标，但这种专门针对女性的暴力在象征意义上渗透了我们社会的每一个阶层。我们社会的每一个方面……都充满了暴力。”


    我想起了他那些关于男女名流的大彩色照片——风景、产品、电影场景，所有的都被子弹贯穿了；我想起了他的他的评论，当我再次思考一年前的今天发生的伊斯拉维斯塔（Isla
    Vista）大屠杀时。2014年5月23日晚，一名22岁的男子发起了疯狂杀戮，导致六人死亡，多人受伤（有人被子弹擦伤，有人被撞进他的车里），最后他用手枪自杀了自己。


    那天晚的伊斯拉维斯塔天气很和，那里是紧邻加州大学圣塔芭芭拉分校的沿海开发区，到处满了名字奇特的披萨店、卷饼店、兄弟会和女会宿舍，以及公寓楼。学生们在外面滑滑板、骑自行车、和朋友一起散步，穿着T恤和泳衣。那个杀手——他的名字不应该被记住，也不应该像科伦拜因校园枪杀案者那样被美化——尽管已经在那里住了将近三年。他早已计划好了一场血案，以此报复一个他认为欠他性爱、崇拜、友谊和成功的世界。他的仇恨特别地针对女性和女孩，以及那些享受她们陪伴的男性。


    这个在好莱坞电影行业边缘长大的年轻人，在网上发布的自传因其浅薄和极人的特权感而引人注目。这些词很刻薄，但没有其他办法可以描述他完全缺乏同理心、想象力以及对他人生活的投入。他经常被描述为精神疾病，但他似乎更像是一个极易受到周围社会疯狂影响的人，即我们处于最糟糕状态的社会。


    他的厌女性症就是我们文化的厌女性症。他想通过中彩变得富有、受推崇并在性事上成功的悲哀梦想，是一个平庸且广为人知的梦想。他对比品牌产品和地位符号的痴迷，正是广告业试图注入我们脑海的东西。他幻想在枪口下获得权势的幻想，是卖给枪支游说团体和动作电影的幻想——在那些电影中，无所不能的超级人无误地击落坏人，那是由他的枪制造的神。“我的第一项准备工作是购买我的第一把手枪，”他在描写那场计划已久的杀戮时写道，“拿起手枪后，我把它带回房间，感到了一种新的力量。我武装了。现在谁才是阿尔法雄性，婊子们？我心里这样想着，针对那些过去看不起我的女孩们。”


    那天，正如他计划的那样，他在公寓里刺死了三个年轻人，显然是一个接一个伏击了他们。其中两个是他的室友，一个是访客：20岁的王伟贤（Weihan Wang）、20岁的陈洪（Chen
    Hong）以及19岁的乔·陈（George Chen）。随后，他带着枪前往他认为最美女性聚集地的女会宿舍，用力敲门，希望能进去并杀掉所有人——那里充满了火辣、美丽的金发女孩；那种我一直渴望却永远无法拥有的女孩，因为她们都看不起我。她们都是娇纵、心狠、邪恶的婊子。


    被女会宿舍门前愤怒且持续的敲门声惊醒，他开了门。杀手却在门外射了三名女性：22岁的凯瑟琳·库珀（Katherine Cooper）、19岁的维罗妮卡·魏斯（Veronica
    Weiss），以及第三位幸存的女性（后者在路人和警长副警官的帮助下幸存）。）。回到车里，他转向撞向路人，冲击力将一些人撞飞，撞碎了另一些，将另一些挤进车里，并用更多子弹扫射其他人。除了他杀死的6个人，他还导致14人受伤。


    他在自杀前杀害的最后一个人克里斯托弗·迈克尔斯-马丁斯（Christopher Michaels-Martinez），他当时和朋友在一起，是最后进入避难的便利店的人。2014年5月23日晚上9:30左右，根据警长报告，“一颗子弹‘进入胸部左侧并从右侧排出，穿透了肝脏和心脏右室’”克里斯托弗·迈克尔斯-马丁斯是一个和朋友出去的20岁英语系，尽管一名19岁的女性试图帮助，他在便利店的地板上当去世。几天后，在店外临时举行的蜡烛花卉纪念活动上，他回忆道：“我正在对他做CPR，一看认出了他的脸。他是我新生期间遇到的第一个人。”


    “我愿意用余生换取与克里斯托弗共处的最后一天，”理查德·马丁斯的父亲几周前告诉我，“但这不会发生。所以我现在这样做——在‘每个城镇的枪支安全’（Everytown
    for Gun Safety）从事枪支管制倡导工作。我不希望有其他父母再次失去像我们儿子一样可爱的孩子。我觉得这关乎拯救生命。”那天晚还有六个年轻人去世。他们所有人。


    我感觉到，每当我和马丁斯交谈时（从他杀案发生几天后开始），他必须做些什么来让这种无法承受的痛苦产生意义。他无法逃避痛苦，但他可以利用痛苦，于是他辞去了长期的公共辩护人工作，上路。


    你可以从各种方式来审视这场疯狂杀戮的原因。女性主义者（包括在内）去年关注的是厌女性症，即杀手认为女性欠他的那种愤怒，认为他有权获得她们能提供的任何快乐和崇拜。对这场犯罪案的讨论加入了关于女性暴力的更广泛对话。因为男性不断跳出来说“并不是所有男人”（有时以
    #notallmen 标签的形式，即“并不是所有男人都是强奸犯或杀人犯，我们不应该讨论男性暴力的模式），一位以 Gilded Spine 为网名的年轻女性创造了
    #yesallwomen 标签，其意思是：是的，我们知道并不是所有人都犯这些罪，重点是所有人都受到了它们的影响。在伊斯拉维斯塔事件发生后的几个月里，这个标签病毒式地传播，尽管
    Gilded Spine 收到了大量威胁性推文而沉默了很长时间。即使谈论暴力也是危险的，而那些发布嘲讽言论、色情图像和威胁的男性似乎并没有意识到，他们所都在证明女性主义的必要性。#Yesallwomen
    可能是近年来最广泛的女性主义标签之一。


