    is a form of silencing, a way of making what one says no value, and words without
    value are worse than silence: one can be punished for them.


    ## II: EVERY MAN AN ISLAND: MALE SILENCE


    Silence is present everywhere under patriarchy, though it requires different silences
    from men than from women. You can imagine the policing of gender as the creation
    of reciprocal alliances, and you can begin to recognize male silence as a tradeoff
    for power and membership. No one ever put it better than bell hooks, who said:


    > The first act of violence that patriarchy demands of males is not violence towards
    women. Instead patriarchy demands of all males that they engage in acts of psychic
    self-mutilation, they kill off the emotional parts of themselves. If an individual
    is not successful in emotionally crippling himself, he can count on patriarchal
    men to enact rituals of power that will assault his self-esteem.


    That is, patriarchy requires men silence themselves first (and perhaps) it''s
    worth noting again that, though patriarchy is a system that privileges men and
    masculinity, many women are complicit in it, some men rebel against it, and some
    people are undoing the rules of gender that pop it). This means learning not to
