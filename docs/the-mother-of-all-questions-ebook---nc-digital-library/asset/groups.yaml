    enforcement of laws shifted. But these stories were also an assault on the impunity
    of authority, an authority that had often been indistinguishable from patriarchy.
    These stories said that authority was not necessarily to be trusted; that power
    was liable to be abused.


    They were part of the great anti-authoritarian uprising that sometimes gets called
    the sixties, though the sixties are often reduced to young white men or to college
    students opposing a war, not acknowledging the breadth of many movements—civil
    rights and racial justice, including Native American and Latinx and Asian American
    as well as Black constituencies, gay and lesbian rights, disability rights, and
    environmental and anticolonial and anticapitalist critiques—that changed the foundations
    of our conversations. It was like wealth redistribution, but the redistribution
    was of audibility, credibility, value, participation, power, and rights. It was
    a great leveling, still going on—with backlashes seeking to show people back into
    the silence from which they emerged.


    Sometimes in the teens of the twenty-first century, a new round of feminist conversation
    began, in response to atrocities and to the breaking of silence about atrocities,
    including campus rape (thanks to campus organizers, many of them survivors themselves).
    A number of stories garnered attention on an almost unprecedented scale, and the
    intersection of a few misogynistic mainstream media and feminists on alternative
    media generated a fiercely lively new conversation.


    On a number of occasions recent, a notable case of gender violence—the Isla Vista
    massacre in Santa Barbara, Ghomeshi''s attacks in Canada, football player Ray
    Rice''s domestic violence in New Jersey, the Stanford rape case—has led women
    to testify on social media. Some share the hashtags: #yesallwomen; #WhyIstayed
    and #WhyIleft, in support of Ghomeshi''s victims; #wasrapedtotoo, in response
    to the 2016 Stanford case; #notokay, the label for more than 27 million tweets
    from women telling their stories about being sexually assaulted, in response to
    the videotape of presidential candidate Donald Trump talking about grabbing women
    “by the pussy.”


    Sometimes men participated in the sharing of the hashtags or supporting the speakers.
    As detailed elsewhere in this book, men actively speaking and acting on behalf
    of women''s rights and feminism has been one of the steps forward in recent years
    (while there were also so many steps back). Social media also became the scene
    of furious campaigns to silence women who spoke up about violence against women
    and misogyny, and Twitter in particular tolerated extended campaigns of rape and
    death threats. It has become a new platform for both breaking the silence and
    trying to enforce it through threats and intimidation. “Online harassment has
    become the intellectual equivalent of street harassment,” said media critic Jennifer
    Pozner after the Black actor Leslie Jones was harassed, insulted, and bullied
    into leaving Twitter. “It is the attempt to police and punish women for being
    in a public space. It’s men and boys saying, ‘Stay out of my playground.’


    Even the Guardian took stock of its vitriolic comments section in 2016 and reported
    that eight of its most attacked columnists were women, who were men of color,
    and the most attacked of all was feminist Jessica Valenti. This recent campaign
    to silence women online is far from over, though many things suggest that it is
    a backlash, an attempt to push back what has marched forward, to silence what
    has been heard.


    There is always something unsaid and yet to be said, anyone struggling to find
    the words and the will to tell her story. Every day each of us invents the world
    and the self who meets that world, opens or closes space for others within. Silence
    is forever being broken, and then waves lapping over the footprints, the sandcastles
    and washed-up shells and seaweed, silence rises again.


    We make ourselves in part of our stories about ourselves and our world, separately
    and together. The great feminist experiment of remaking the world by remaking
    our ideas of gender and challenging who has the right to break the silence has
    been wildly successful and remains extremely incomplete. Undoing the social frameworks
    of millennia is not the work of a generation or a few decades but by a process
    of creation and destruction that is epic in scope and often embattled in execution.
    It is work that involves the smallest gestures and exchanges and the changing
    of laws, beliefs, politics, and culture at the national and international scale;
    often the latter arises from the cumulative impact of the former.


    The task of calling things by their true names, of telling the truth to the best
    of our abilities, knowing how we got here, listening particularly to those who
    have been silenced in the past, seeing how the myriad stories fit together and
    break apart, of using any privilege we may have been handed to us privilege or
    expand its scope is each of our tasks. It’s how we make the world.


