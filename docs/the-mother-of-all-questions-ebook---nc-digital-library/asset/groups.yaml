    Ghomeshi）的指控。这两个人似乎认为旧规则仍然适用，但发现自从他们上次检查以来世界已经发生了变化。看着他们试图对针对自己的许多指控置若罔闻，就像看着一个撞上墙的风车；它们的轮子在转，但它们没有任何进展。


    戈梅希在2014年10月被加拿大广播公司（CBC）因职场骚扰解雇。他提起了不当解雇诉讼，索赔5500万加元，并聘佣了一家昂贵的公关公司。最激烈的是，他通过一篇冗长且广泛流的Facebook帖子对潜在的指控者发起了防御性打击，文中声称：“我被CBC开除是因为由于一个被抛弃的前女友和一名自由撰稿人发起的虚假指控运动，导致我的私生活面临公开的风险。”他声称那名作家和前女友出于恶意歪曲了他完全自愿的性活动，并声称他因为自己是性少数群体（痴迷性虐癖的人）而受到攻击。换句话说，他是受害者。结果却适得其反。


    这种语言本身让一些读者响起了警报，因为这种“恶毒报复的女性为了让男性陷入困境而撒谎”的框架也许是陈词滥调的刻板印象。对那些证言自己遭到袭击的女性进行常规贬低是一个关键。戈梅希的公开姿态使《多伦多星报》发表了一份基于四位女性证词的报告，涉及非自愿且非传统的性活动（这些活动似乎让戈梅希兴奋）。她们声称他残忍且突然地袭击了她们。这些女性没有名字，因为她们知道自己会遭到攻击，而她们的描述最初受到了广泛攻击。


    公开指控的后果通常是不愉快的。动机了顾虑。在戈梅希案中，更多女性站了出来，立即就有五位，随后又是几位。最引人注目的是受尊敬的演员、加拿大皇家空军上尉露西·德库特尔（Lucy
    DeCoutere），她是第一个也是最后一个公开露面的人：“他突然掐住我的脖子扇了我脸几次，”她在描述2003年的一起事件时说道，“这完全让我困惑，因为我以前从未被人扇过脸。被掐脖的感觉并不愉快，而且它是突如其来的。它是毫无无故的。”到那时，已经八位女性表示她们曾被勒喉和击打，这种暴力并非自愿的性游戏。根据这些女性的描述，戈梅希是一个渴望违背他人意愿勒死和击打女性及他人的人。许多袭击者认为他们会永远逃脱法，因为他们的受害者缺乏声音和公信力，或者因为犯罪者消灭了她们的声音并恐吓她们保持沉默。规则有时在某种程度上发生了改变，这显然让一些作案者感到困惑。


    这种被倾听、被相信和被尊重的权利，沉默了许多永远无法被听见的女性和无数案件。因为，当这些故事浮出水面时，你必须记住还有多少案件永远不会发生——在那些受害者像世世代代那样保持沉默的案件中，或者在尚未找到敢于发声的舞台，或者发了声却只被嘲笑、羞辱或攻击的案件中。德库特尔评论道：“过去几个月，关于女性暴力的对话发生了重大转变。对于许多人（包括我在内）来说，这是一段震惊且痛苦的，但也令人鼓舞。我希望害者的声音继续被听到，这是迫切需要的改变开始。”


    针对科斯比的指控已经徘伏多年，甚至十年。2005年的民事审判有15项指控他性侵，但原告在庭外达成和解，案件仅得到了有限的报道。他的许多被指受害者保持了沉默。芭芭拉·鲍曼（Barbara
    Bowman）报告她在1985年（17岁时被科斯比下毒并强奸，她讲述了一个典型的故事：“一个女朋友带我看了律师，但他指控我编造故事。他们不屑的回应摧毁了我获得帮助的任何希望；我确信没有人会听我的。这种无力感最终阻止了我去报警。我告诉朋友们发生了什么，尽管他们同情我，但他们也无能为力。我是一个在多伦多拍过广告的青少年。他是比尔·科斯比：《老父亲》中的克里夫·哈斯塔和果冻代言人。最终，我必须继续我的生活和事业。”


    他的许多被指受害者都很年轻且脆弱，这种脆弱性由于女性一直以来缺乏声音和公信力而加剧。


