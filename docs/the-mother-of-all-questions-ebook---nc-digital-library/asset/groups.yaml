    你爱的人——是清醒的，而且他表现得很好，复杂的情绪在他那宽大平滑的脸上流转，宛如云层和天气在草原上移动。“你嫁给我的时候，你就知道我是个骄傲且不讨人的女孩，”莱斯莉（Leslie）在第二天早晨这样对他说。在那之前，她又违反了一次规则，闯入了她丈夫和他的党友之间的政治对话，那些人是德克萨斯平原的权力经纪者和选举操纵者。关于如何进入一段关系、一段婚姻、如何坠入爱河电影有很多，也有一些关于感情破裂，但关于如何长年相守的电影并不多。他们争吵、和好、忍受、适应、繁衍。


    能够陪伴你度过几十年的艺术品是镜子，你可以从中看到自己；是你可以不断汲取的井水。它们提醒你，你带给艺术品的东西和艺术品带给你的东西同样重要，而且它们成为了你如何变化的记录。如果说《巨龙》（*Giant*）对我每十年看一次都是一部不同的电影，也许我也是一个不同的人，关注着周围世界中不同的事物。这并不是说我放弃了那些来自黑暗中低语的教训。


    看清一个东西、了解一个人需要多久？如果你投入了多年，你就会意识到起初自己抓住了多少什么，即使你曾以为自己很了解。我们穿过生活，却看不见周围的事物，不知道身边是谁，不理解正在起的力量，除非我们留下来，也许这正是一部关于留守的电影。当我早些时候《巨龙》上映六十周年看它时，婚姻情节是熟悉的，莱斯莉·贝迪克特（Leslie
    Benedict）的力量依然存在，我注意到以前我错过的细节。


    在我们主角身上发生了最不可想象的事情是：他们有了一个儿子，这个儿子长大后变成了丹尼斯·霍珀（Dennis Hopper）。霍珀饰演的角色乔丹·贝迪克特世（Jordan
    Benedict III）是一个红发、不安、焦虑的人，他害怕马匹，成年后想当医生。他也很快嫁了一个由墨西哥演员艾尔莎·卡尔丹纳斯（Elsa Cárdenas）饰演的胖拉丁裔护士。吉列尔莫（Guillermo）在我们年前看这部电影时告诉我，卡尔丹纳斯在故乡墨西哥是一个明星，在电影中她被允许的华华得多，而且电影中所有的拉丁裔角色似乎都被涂上了“棕色化妆”的色彩。


    霍珀饰演的角色拒绝接管那五十万英亩的牧场，牧场业本身不再是定义德克萨斯的核心、关键产业；石油取代了它并改变了一切。乔丹·贝迪克特二世（Jordan Benedict
    II）作为德克萨斯最大的牧场主之一，被剥夺了所有对他而言最重要的权力，电影告诉我们，这没关系，对他来说就像任何人一样，他释怀了。转变不仅仅是从牛群到原油，而是从父权制到某种开放的、协商的重组，即这个充满争议的当代。


    当我最后一次看这部电影时，我感到惊讶的一部分是，这部电影关于一个发现自己完全无法控制任何事情的男人，他不是约伯（Job），这也不是一篇哀歌。那会假定他应该控制事情，并且当他这样做时不是悲哀的。那会主张国王不应该被推翻。这部电影提出了相反的观点：国王倒台了——正如他在小酒馆里发生的那样——一切都好。为了获得洞察，这是一项糟糕的工作，阅读无数审判记录、强奸和谋杀的描述、关于骨折和破碎生活的统计数据——但作为改变世界项目的一部分，这是值得的。


    ![img/d673876511d33210e83cdfee20579_137_0.png


    # 致谢


    存在针对女性的战争，是我在一个充满男性暴力的家庭中长大的经历，曾以为如果或当我离开，我就是安全的，而我很小时就离开了。正如我在《流浪》（*Wanderlust*,
    2000）中所写的那样：“这是我生命中最毁灭性的发现，我在室外没有真正的生存权和追求幸福的权利，这个世界充满了陌生人，他们似乎恨我，并由于除了我的性别之外没有其他理由想伤害我，性如此轻易地变成暴力，而几乎没有人人将其视为公共问题，而是私人问题。”我一直试图把它变成一个公共问题。


    这场战争如此植根于我们的文化之中，以至于它引发了愤怒甚至很少关注；孤立的事件成为新闻，但整体模式对我来说是无处不在的。我一直试图描述它的一些影响来引起关注，用像关于家庭暴力的这样的句子来列举它们：“它是美国女性受伤的首要原因；在每年受伤的一百万人中，超过50万次伤害需要医疗治疗，而根据疾病控制中心的数据，约有14.5万例过夜住院，”我正试着理解暴力背后的仇恨、恐惧和特权感，并揭示暴力只是一个贬低、去人性化和抹杀女性的系统更具戏剧性的表现。


    我感激女性主义运动，它是为了让我们在法律和日常生活中更加平等的更大决议中关键且重要的一部分，为了确保每个人的权利和尊重。我足够老，记得在那个没有家庭暴力救济途径、没有结识和约会强奸以及职场性骚扰（这是我青少年时期工作的普通部分）糟糕的世界；足够老，看到由于洞察、组织和干预而改变的世界。我感激那些带给我们一个更自由、更平等世界的个人和集体，感激最近几年里拥有过它们。


