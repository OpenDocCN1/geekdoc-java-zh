    # Feminism: The Men Arrive

    (2014)


    What do the prime minister of India, retired National Football League punter Chris
    Kluwe, and superstar Aziz Ansari have in common? It''s not that they''ve all walked
    into a bar, though Ansari could probably figure out the punch line to that joke.
    They''ve all spoken up for feminism this year, part of an unprecedented wave of
    men actively engaging with what’s usually called “women’s issues,” though violence
    and discrimination against women are only women’s issues because they’re things
    done to women—mostly by men, so maybe they should always been “men’s issues.”


    The arrival of the guys signifies a sea change, part of an extraordinary year
    for feminism, in which the conversation has been transformed, as have crucial
    laws, with new voices and constituencies joined in. There have always been men
    who agreed on the importance of women''s issues, and some who spoke up, but never
    in such numbers or with such effect. And we need them. So consider this watershed
    year for feminism.


    Take the speech the generally malevolent Indian prime minister Narendra Modi gave
    on that country’s Independence Day. Usually it is an occasion for booster and
    pride. Instead, he spoke powerfully of India’s horrendous rape problem. “Brothers
    and sisters, when we hear about the incidents of rape, we hang our heads in shame,”
    he said in Hindi. “I want to ask every parent [who has] a daughter of 10 or 12
    years old, you are always on the alert, every now and then you keep keeping on
    where you are going, would you come back. . . Parents ask their daughters hundreds
    of questions, but have they ever dared to ask their son as to he is going, why
    he is going out, who his friends are? After all, a rapist is also somebody’s son.
    He also has parents.


    It was a remarkable thing to say, the result of a new discourse in that country
    where many are now starting to blame perpetrators, not victims—to accept, as campus
    antirape activists in the United States put it, that “rapists cause rape.” That
    act, in other words, is not caused by any of the everyday activities women have
    been blamed for when men assault them.'
  - '[PAGE 72]


    This in itself represents a huge shift, especially when the analysis comes from
    the mouths of men. And from this violently conservative man, the words seemed
    remarkable—not because they were evidence of some emerging virtue in Modi, but
    because he seemed to be a conduit for arguments framed elsewhere: feminism was
    so powerful a force it emerged from his mouth.


    The Obama administration, too, recently launched a campaign to get bystanders,
    particularly to reach out potential victims of sexual assault under the rubric
    “It’s On Us.” Easy as it might be to critique that slogan is as a tone-deaf gesture,
    it’s a landmark all the same, part of a larger response in this country to campus
    rape in particular.


    And here’s what it all means: the winds of change have reached our largest weathervanes.
    The highest powers in the country have begun calling on men to take responsibility
    not only for their own conduct but also for that of the men around them, to be
    agents of change.


    # WHEN X DOES''NT EQUAL Y


    Feminism needs men. For one thing, the men who hate and despise women will be
    changed, if they change, by a culture in which doing horrible things to, or saying
    horrible things about, women will undermine rather than enhance a man’s standing
    with other men.


    There are infinite varieties of men, or at least 3.5 billion different ones living
    on Earth now, Klansen and human rights activists, drag queens and duck hunters.
    For the purposes of feminism, I’d like to delineate three big blurry categories.
    There are the allies, mentioned above (and below). There are the raging misogynists
    and haters in word and deed. You can see them in various places online, where
    they thrive (and seem to have time on their hands): the men’s rights forums, for
    instance, where they endlessly st the flames of resentment, and guys on Twitter
    who barrage any outspoken woman with threats and insults. Take the threat just
    to kill media analyst Anita Sarkeesian for speaking about sexism in video games
    but to launch a massacre of women at a speech she was to give at the University
    of Utah. Sarkeesian’s is not the only one in world to receive death threats. And
    don’t forget all the gamers who have gone down the rabbit hole of misogynist conspiracy
    theories under the hashtag #Gamergate.'
