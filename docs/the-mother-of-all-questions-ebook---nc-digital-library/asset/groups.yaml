    Morris''s claim about the “extremely long periods of dependency of the young”
    that kept the females “almost perpetually confined to the home base” is patently
    untrue in the case of the San, as Thomas learned.


    The whole group moved regularly, and families could also move independently of
    the group. The women Thomas met went out and gathered food almost daily. Children
    who were too large to keep up were often tended by someone staying at camp while
    their mothers roared. Thomas makes clear that hunting and gathering are not completely
    separate activities and speaks of “slow game—the tortoises, snakes, snails, and
    baby birds that are often found by people who are gathering,”


    Not only were the male the sole providers of food, they weren''t even the sole
    providers of meat. Which is not to say that they brought home meat or that they
    weren''t important. It’s just that everyone brought home food, even kids. Thomas
    mentions an exceptional hunter, an athlete who could run down an eland. One day
    he killed three big animals. He stayed with his carcasses while his wife and her
    mother recruited others to carry the meat back to camp. He was truly a great hunter,
    but he relied on highly mobile women and his extended community for help with
    bounty. Thomas notes that “meat united people. A meal of life-giving meat meant
    for all.” San males didn’t hunt as the heads of nuclear families following an
    individualist way of life; they hunted as part of a community.


    The Inuit shared meat, according to Peter Freuchen, a writer and explorer who
    lived among them for decades in the twentieth century. He tells a story about
    how his Inuit wife furiously mocked a woman who was stingy in sharing her husband
    had killed. Sharing was etiquette as well as survival. Even among the Inuit, some
    of the carnivorous people on earth, women sometimes accompanied men on long hunting
    trips, because the hunters could die of cold in the subzero weather if their clothing
    was damaged. Women took care of food, clothing, and shelter.


    The familiar “just-so” stories about male independence also misrepresent the family
    dynamics of settled farmers and artisanal, industrial, and white-collar workers.
    Most farmers worked at home—an extended home with fields and orchards—and their
    families worked alongside them. The wives and kids of craftsmen often participated
    in the work in various ways. During the Industrial Revolution, working-class women
    and children toiled in factories and sweatshops, as they do in the factories of
    Guatemala and China and Bangladesh today.


    Everyone contributes. You could call women dependent, but only if you were willing
    to call men the same thing. Dependency isn''t a very helpful measure; interdependency
    might be better. Useless and dependent isn''t what most women have been, and it
    isn''t what most women are. Stories about Man Hunter that contain the notion that
    men are givers and takers, that men work and women are idle, are nothing more
    than justifications of present-day political positions. His fury is based on a
    fiction, which paints a fairly sad picture of the human species, with both men
    and women inhabiting fixed and alienated roles. There is an interesting contradiction
    built into this picture: it suggests, on the one hand, that women never worked,
    and on the other, bearing children was such overwhelming work that women were
    housebound—cavebound, or treebound. It''s as if all women literally had hands
    full of babies and toddlers for a while but not forever, and quite possibly during
    this phase of motherhood, Stories that promote the idea of patriarchal nuclear
    family have little to do with what women actually done throughout of history or
    prehistory. They suggest that the human condition has always resembled what middle-class,
    married, stay-at-home women were expected to do in the twentieth century. Even
    Hannah Arendt describes the female condition as something that involved little
    more than baby production. She was talking about the specifics of classical Athens,
    where women of means, daughters of citizens were largely confined to the house,
    which limited their productivity and participation. Athenian men weren’t necessarily
    producing much, either; food came from the countryside and from far-ung colonies,
    and most the manual labor was done by slaves and peasants. Nevertheless, Arendt
    wrote in The Human Condition, “That individual maintenance should be the task
    of the man and survival the task of the woman was obvious, and both of these natural
    functions, the labor of man to provide nourishment and the labor of woman in giving
    birth, were subject to the same urgency of life.” Arendt apparently could not
    resist the neat symmetry between “the labor of man” and “the labor of woman.”
    But we should. For most of history, housework was much harder than it is now.
    It involved shoveling coal or chopping wood, stoking fires, pumping water, emptying
    chamber pots, washing everything by hand, butchering or tending animals, and making
    bread, thread, clothes, and much else from scratch. There have often been women
    of leisure, of course. But they were usually married to men of leisure. And their
    leisure was made possible by hunter-mates, many of whom were also women. In any
    case, leisure was not the primordial human condition, nor is it the condition
    of most women around the world now. There was a brief era in the Western world
    when industrialization had made running a household easier and many middle-class
    women werent part of the wage-earning economy. You could look at some of these
    women as nonproducing consumers, though to say you’ve had to discount the labor
    involved in raising children and keeping a house and supporting a working spouse.
    This period lasted several decades, but it started five years ago, and it tapered
    off when declining wages sent many more women into the workforce. Right now, in
    the United States, women constitute 47 percent of wage earners; 74 percent of
    these working women work full time. Throughout much of the industrialized world
    the numbers are similar or higher. Elsewhere, women are growing food, carrying
    water and firewood, herding livestock cassava root, grinding corn by hand.


    Patriarchy—meaning both male domination and societies with patrilineal descent,
    which requires strict control over female sexuality—has, in many times and places,
    created many versions of dependent, unproductive women, who are disabled by dress
    or body modification, restricted to the home, and limited in their access to education,
    employment, and profession by laws and customs backed by threats of violence.
    Some misogynists complain that women are immobile burdens, but much misogyny has
    striven to make women so.


    Antitarian and feminist anthropologists have attempted to upend some of these
    stories. Elaine Morgan countered the arguments of the Man Hunter with a 1972 book
    called *The Descent of Woman*; in 1981, Sarah Blaffer Hrdy wrote a more scientifically
    solid book, *The Woman Never Evolved*, which also proposed alternative theories.
    Even Marshall Sahlins, who participated in the Man Hunter conference and contributed
    to the book of the same name, published *Stone Age Economics*, a 1972 treatise
    that argued hunter-gatherers lived with an abundance of free time and food.


    But there''s an underlying assumption in all these stories: that we are doomed
    to remain who we were a very long time ago. By that logic we could argue since
    we used to eat our food raw, we ought not cook it, or that because we once walked
    on all fours, this two-legged thing isn''t meant to be. Not long ago humans lived
    on almost entirely vegetarian diets in some warm places and on almost carnivorous
    diets in the Arctic.


    We are a highly adaptable species. We live in cities and nomadic bands and nuclear
    units; we are polygamous or polyandrous or practice serial monogamy or take vows
    of celibacy; we marry people of some other gender or the same gender or never
    marry at all; we raise our biological children or adopt or devote aunts and uncles
    or hide kids; we work at home or in an office or as migrant workers or visiting
    nurses; we live in societies where gender apartheid is the norm or where everyone
    mingles or where the idea of gender itself as something binary and oppositional
    is being.


    There are givens in our biology, and there are particularly common patterns in
    our past. But we are not necessarily who we once were, and who

