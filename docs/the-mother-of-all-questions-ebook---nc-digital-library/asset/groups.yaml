    see hoofprints, you think horse, but sometimes it’s a zebra.” That is, the familiar
    symptoms usually mean the familiar disease but are sometimes evidence of something
    completely different. A category is set of assumptions; the aphorism reminds you
    that sometimes your assumptions are wrong; that particular doesn’t always fit
    into the general. But the fact that it’s sometimes a zebra doesn’t undermine the
    pattern that it’s usually horses.


    Some of the most furious debates of our time come when opposing sides insist that
    everything in a given category correspond only to their version of the phenomenon.
    In recent debates about prostitution, one position at its most dogmatic insists
    that that prostitutes—apparently, all prostitutes are free agents whose lifestyle
    and labor choices should be respected and left alone. I''ve been acquainted with
    a few middle-class white sex workers. They have retained control over what they
    did and with whom, along with the option of quitting when it stopped being what
    they wanted to.


    Of course that experience of being a sex worker with agency exists. Do sex trafficking
    and the forcing of children, immigrants, and other categories of the socially
    and economically vulnerable into prostitution. Prostitution is not a category
    of the enslaved or the free, but of both. And undoubtedly there are blurry areas
    in between. How do you even speak, let alone propose regulation of, a category
    as full of internal contradictions? Maybe, like so many other things, it is a
    language problem, and we need different terms to talk about different categories
    of people engaged in sex for money.


    In 2014, when women wanted to talk about sexual violence, they were often confronted
    with men who wanted to focus on the fact that not all are rapists. That subset
    of men even started a hashtag, #notallmens, as though the central subject ought
    to be them and their comfort and reputation: that this scourge upon the land.
    It''s a language-and-logic problem: far from all men are rapists, we assumed everyone
    understood, but nearly all rapists are men, and so it''s useful to be able to
    say rape (and men and boys got got, but in much lower numbers than women and girls).


    According to Kate Harding''s excellent history of rape, *Asking for It*, 98 percent
    of rapists are men. There are exceptions. I had a male student at an Ivy League
    school demand to know why I insisted on talking about gender when I talked about
    rape. Another student noted that my ideas of gender were "so binary." I speak
    about gender in binaries because people often operate on that basis. Rape is,
    among other things, a rite affirming these categories of who has rights and who
    lacks them, and is often an act of hostility against a gender. None of the fraternity
    rapists seems to be interested in looking beyond gender, though doing so is going
    to be crucial to undoing rape culture. That is, making it possible to see a shared
    category of humanity that overrides unshared categories of genitals and gender
    roles.


    That we imagine the two main genders as opposite or opposing tightens up the categories
    and the ways they define each other. The idea that gender is a false binary is
    a useful one, yet gender is an inescapably useful thing in talking about who does
    what to whom and has done over the ages. If, for example, couldn''t note that
    all of our presidents to date have been male, we could not suggest that the situation
    should be rectified at some point. Male and female, men and women, are how people
    have organized a lot of their social thinking for a very long time. "Male and
    female he created them," as the Old Testament says, and its very firm ideas about
    what men and women are still with us, in case you haven''t heard a conservative
    Christian talk about marriage lately.


    We must speak, and in speaking we must use categories such as Black and white,
    male and female. We must also understand the limits of categories, their leakiness,
    and that male and female modify Black and white and vice versa. The exceptional
    cases are important, both of those who were born with anomalous anatomy and those
    who have an assigned identity. The Intersex Society of North America notes, "If
    you ask medical centers how often a child is born so atypical in sex differentiation
    that is called in, the number comes out to about 1 in 1500. But a lot more people
    are born with subtle variations of which won''t show up until life." They estimate
    that is 1 in 100. Which means that millions of people in this country do not,
    even biologically, correspond to our categories. The writers of the text on this
    website advocate for intersex not as a category but rather as a term that allows
    us to acknowledge that categories are porous and some of us are not contained
    by them:


    Intersex is a general term for a variety of conditions in which a person is born
    with reproductive or sexual anatomy that doesn''t seem to fit the typical definitions
    of female or male. For example, a person might be born appearing to be female
    on the outside, but having mostly male-typical anatomy on the inside. A person
    may be born with genitals that seem to be between the usual male and female types—for
    example, a girl may be born with a noticeably large clitoris, or lacking a vaginal
    opening, or a boy may be born with a notably small penis, or with a scrotum that
    is divided so it has formed more like labia. Or a person may be born with mosaic
    genetics, so that some of their cells have XX chromosomes and some of them have
    XY.


    In contemporary parlance, sex is biological and gender is socially constructed;
    the first is in your pants and your genes, the second in your mind. Perhaps this
    will if people are less confined by all the activities and outfits that goes with
    their assigned gender: the young are going further in dismantling this system
    that queers and feminists have taken on for decades, both in how they identify
    and who they desire. (In a recent study, 46 percent of eighteen-to-twenty-four-year-olds
    identified as totally straight, 6 percent as totally queer, and almost half as
    somewhere in between.) Some refuse to let gender define them.


    My hometown, San Francisco, is where the first man gave birth to a child (that
    we know of). We tend to think that bearing children is women''s work, but a trans
    man in my town who''d kept his uterus had a child before the much more widely
    publicized case of Thomas Beatie in 2008. A nice thing about the Beatie case is
    that the man carried and gave birth to three children because his wife was infertile
    and he was not. Categories are leaky, and some categories are prone to revision.
    I never thought I''d get to write "his uterus." Sometimes, not always, the leaks
    in categories are cause celebration.

    '
