    ## Giantess


    (2016)


    The radical is so often imagined as the marginal that sometimes something truly
    subversive escapes detection just by showing up in a tuxedo rather than a T-shirt
    or a ski mask. Take Giant, the 1956 film directed by George Stevens. It''s an
    epic, a saga, a sweeping family story, a capsule history of Texas''s economic
    transition from cattle to oil, a post-Western Western, and also an incendiary
    device. It is at a little over three hours, it has room to show everything from
    scenes of a marriage to interventions on race, class, and gender.


    It stars Elizabeth Taylor and three gay men, Rock Hudson, James Dean, and Sal
    Mineo, who orbit each other uneasily in ways that seem only partly about their
    cinematic roles. I noticed this the first time I watched Giant, at a thirtieth-anniversary
    screening at San Francisco''s Castro Theatre. Watching films at the great 1,400-seat
    dream palace from my mid-teens on, I learned the sighs and groans and snickers
    of the gay men in the dark to notice homootic subtexts, to delight in women with
    verve, and to appreciate camp and bitterness and cliché. Giant had all those things.


    While a lot of my peers memorized cult films as The Rocky Horror Picture Show,
    and the Castro still offers sing-along screenings for people who can come in on
    The Little Mermaid or The Sound of Music, I can recite some of her best lines
    from Giant. Taylor is the rarest of joys, a woman who breaks rules and triumphs
    and enjoys herself rather than wishing up or defeated, as too many rebels have
    in too many patriarchal plots. The year before my first viewing, Hudson had died
    of AIDS and Taylor had begun standing up for those with the then untreatable and
    horrifically stigmatized device. Her outspoken heroics as an advocate and fundraiser
    made her in real life a little the unconquered heroine she played three years
    before.


    Whenever I see a woman like that on screen, I get rev up in a way that me identify
    with Hollywood''s endless supply of action heroes must be all the time. Just watching
    Jennifer Lawrence walk down a Texas street like a classic gunslinger to confront
    an enemy in the 2015 biopic Joy gave me a thrill I get maybe a year or so. Lawrence’s
    Katriss Everdeen was the hard drugs, as were a series of Hong Kong action hero
    and La Femme Nikita long before. Beyoncé’s recent videos offer some of the joy,
    of a woman who slays and doesn’t stay down. Distaff invictus, lady with agency.


    The second time I saw Giant at the Castro’s huge scene, for its fortieth anniversary,
    I brought my own superb source of low-volume commentary, the performance artist
    Guillermo Gómez-Peña. He was dressed all in black leather and slumped in his seat
    with a hangover. He kept murmuring, almost from the outset, “Rebecca, I do not
    believe what I am seeing.” Early in the film, the young Maryland debutante Leslie
    Lynnton, played by a radiant, self-possessed Taylor, both captivates and annoys
    West Texas rancher Rock Hudson, the former by being a flirtatious and lovely woman,
    the latter by speaking her mind. Freudian motif alert: he’s to buy a stallion—a
    gleaming black horse rides magnificently in the opening scene—from Lynnnton’s
    father. Taylor comes down the morning after they’ve met to remark to him that
    she’s been reading all about Texas, and he prepares to be flattered when she remarks
    “We stole Texas! I mean away from Mexico.


    It’s a demurely outrageous scene, complicated by the Black butler whose nonplussed
    facial expression gets some camera attention along with Hudson’s choice to toast.
    The film, made the year after Brown v. Board of Education and its little-remembered
    parallel case, Hernandez v. Texas, is going to take race in Texas, a white-and-brown
    affair, though it leaves out the politics of being Black in the South. It’s not
    a perfect polemic, and it falls in the large genre of racial justice as seen from
    the perspective of a white ally, the affected population, but it is nevertheless
    extraordinary for a blockbuster filmed while Martin Luther King was finishing
    graduate school and Rosa Parks was still giving up her seat.


    We really stole Texas. It’s an amazing thing to say even now, and as an observation
    Elizabeth Taylor offers at breakfast to a cattle baron besotted with his homeland,
    it’s an astonishment. It’s still good reminder. The year that Guillermo and I
    watched Giant turn forty at the Castro—1996—we were in the midst of an era of
    immigrant-bashing in California, driven by various myths about economic impact
    that shifted the burden of a brutal new economy from its lords to its underclasses.
    That year was also the 150th anniversary of the beginning of the United States’s
    war on Mexico, the war that ended two years later with seizure of Mexico''s northern
    half, the rich expanse from New Mexico to California that, had it remained in
    Mexican hands, would have led to a wildly different global geopolitics and, perhaps,
    Yankee sneaking across the border for jobs in the superpower to the southwest.
    (Texas, of course, had been stolen earlier.) Amnesia has been an important component
    of the ideology of politicians demonizing Latino immigrants and residents, from
    the Gold Rush to California governor Pete Wilson in.


