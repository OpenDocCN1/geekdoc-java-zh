    人们听到了许多类似的垃圾言论，说什么不存在种族主义，说他们没有受到区别对待，说种族不会影响我们中的任何人，因为谁能比那些试图让有色人族沉默的白人更了解这些呢？性少数群体也是如此，但我们对这一切已经了如指掌，或者说我们应该去关注。


    这种关注是共情的基础行为，是去观察、去想象自身之外的经历，是跳出自身经验边界。目前流行的一种观点认为，书籍能帮助我们产生共情，如果确实如此，是因为它们帮助我们想象自己成为那些我们并非的人。或者更深层地探索内心，更清楚地意识到心碎、生病、身体不适、九六岁或彻底迷失意味着什么。而不仅仅是那些被我们渲染得无极光华、永恒正义且永远正确的形象，生活在一个他人存在仅仅是为了帮助衬托我们伟大伟大的世界里——尽管此类这类书籍、漫画和电影大量存在，用以迎合男性的想象。这提醒了我们，文学和艺术也可能让我们丧失共情，如果它们将我们囚禁在“伟大的自我”这一无聊的老堡垒之中。


    这就是为什么我最近很有兴致挑剔由《时尚杂志》（Esquire）列出的极具男性色彩的“每个男人都应该读的80本书”，其中七十本是女性的作品。这似乎在鼓励这种经验的狭隘。作为回应，我主张每个人都应该读女性的作品——改变平衡是重要的——但也许阅读的全部意义在于能够通过体验他人来探索并超越你的性别（以及种族、阶级、性取向、国籍、历史时刻、年龄和能力）。这种说法让一些男性感到不悦。许多对性别感到好奇的人很容易被激怒，当他们生气时，他们并不知道。他们只是觉得你错了，有时甚至还觉得你邪恶。


    关于大学生——意味着女大学生、黑人学生、跨性别学生——一直有很多言论，说他们过度敏感并要求他人接受审查。这就是为什么《大西洋月》（The Atlantic）这本像重摆一样在进步与保守之间来回的奇特出版物，最近写了一篇关于“被溺爱的美国思想”的文章。它告诉我们，杰里·西纳德（Jerry
    Seinfeld）和比尔·马赫（Bill Maher）公开谴责大学生的过度敏感，说“他们中太多的人受不起开玩笑”，并援引了这两个老白人作为决定性的权威。


    但说认真的，你们知道谁受不起玩笑吗？白人男性，如果这个玩笑暗示了他们和他们的宇宙，而且当你看到他们的愤怒或收到威胁时，你看到的是那些真心指望事事人愿、并且整天都被告诉他们非常棒的人。在这里，为了记录起见，让我澄清一下，我并不是在说他们所有人都受不起。很多男性——其中包括了我的许多朋友（当然，还有肤色几乎和我一样苍白的家人成员）——都有幽默感，有洞察事物理想与现实之间差距的天赋，能够超越自身立场的局限。有些人拥有深邃的共情和洞察力，为我们其他人提供了结果。有些人是人权的捍卫者。


    但也有这类人，他们出现并要求被溺爱。一群黑人大学生不喜欢某些事；他们以相当文明的方式要求不同的事物，却被指责为需要溺爱，就像需要核武器或被持枪抢劫钱包一样。一群白人男性玩家不喜欢一位关于游戏性别歧视的女性文化评论员，他们花费一年左右的时间骚扰她，伴随着无尽的强奸威胁、死亡威胁、炸弹威胁、人肉搜索，最终发出了一场屠杀威胁，引用1989年杀害十四名女性的蒙特利尔性别歧视者马克·莱平（Marc
    Lépine）作为榜样。我当然是在说安妮塔·萨凯相（Anita Sarkesian）和“游戏门”（Gamergate）事件。你可以称那些家伙是被溺爱了。我们本应该、而且严肃地说，觉得他们拥有一个所有人认为他们所作所为的一切都很棒的世界——或者保持沉默？也许吧，因为他们已经拥有太久了。


    那天我通过对书籍发表女性主义观点，简直是捅了蜂窝。这一切都指向了《洛莉塔》。那种认为小说好是因为它们能培养共情的流行观点，假设我们会认同角色，而没有人会认为认同吉尔伽美诗（Gilgamesh）或伊莉莎白·贝内特（Elizabeth
    Bennett）是错误的。只是，当你认同《洛莉塔》时，你是在澄清这是一本关于一个男人多年来严重强奸孩子的书。你应该阅读《洛莉塔》并……


