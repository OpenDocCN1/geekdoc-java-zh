    我在工作中扮演了一个微小的角色，而这项工作不会很快结束。无论遭受多大的反反噬，我们都不会回头。


    我感谢我遇到的那些年长女性，她们是我生命中第一批不屈的、强大的、自由的女性：我父亲的表姐妹玛丽·索尔尼·克拉克（Mary Solnit Clarke）和朱恩·索尔尼·赛尔（June
    Solnit Sale），她们自20世纪40年代起就是人权活动人士，也是自1961年成立起那个伟大且未被充分宣传组织“妇女和平罢工”的关键成员；凯莉和玛丽·丹（Carrie
    and Mary Dann），她们是西部肖肖族人的族母，我在1992年加入了她们的土地权利斗争，在内华达州东部进行了几年的英勇努力和伟大的冒险；几年后是女性主义作家露西·利帕德德（Lucy
    Lippard）；然后是伟大的苏珊·格里芬（Susan Griffin）；以及许多其他人。


    我感谢那些正以新的活力和愿景为女性主义注入活力的年轻女性，包括许多伟大的作家，如贾亚·托伦蒂诺（Jia Tolentino）、罗珊珊·盖（Roxane Gay）、蒙娜·埃尔塔维（Mona
    Eltahawy）、卡罗琳·克里亚多·佩雷斯（Caroline Criado-Perez）、布里特尼·库珀（Brittney Cooper）、瑞贝卡·特瑞斯特（Rebecca
    Traister）、艾德里安·马里·布朗（Adrienne Maree Brown）、艾玛·苏尔科维奇（Emma Sulkowicz）以及黑人命运动的女性，还有许多因为这些著作而我有幸遇到的年轻女性。


    我感谢我的同辈，特别是阿斯特拉·泰勒（Astra Taylor）和玛丽娜·西特林（Marina Sitrin），这些才华横溢且亲爱的朋友。我感谢那些成为女性主义者的男性，我们现在明白，正如女性可以服务父权制一样，男性和任何人也可以反抗它；特别感谢许多在压迫出现在任何地方都能理解它的黑人男性的发声：其中包括塔奇·詹姆斯（Taj
    James）、埃隆·琼斯·怀特（Elon Jones White）、泰朱·科尔（Teju Cole）、加内特·卡多根（Garnette Cadogan）和贾维斯·马斯特斯（Jarvis
    Masters）。


    感谢从我十三岁起一直是伟大朋友、盟友和见解来源的男同恋，感谢成长在一个曾是酷儿解放世界之都城市。感谢家族中抚养孩子的女性们。


    我感谢Haymarket 出社编辑安东尼·罗（Anthony Rowe）的才华与奉献，感谢卡罗琳·卢夫（Caroline Luft）优美的编辑工作；感谢阿比·韦特劳布（Abby
    Weintraub）的天赋，她让《向我解释》（*Explain Things to Me*）书名转化为如此大胆且清晰的文字，使得这本小书成为了标语和挑衅，我们将这种设计一直用于《黑暗中的希望》（*Hope
    in the Dark*）以及这本书，它完成了一部始终关于希望，也关乎暴力与斗争的三部曲；感谢罗里·法宁（Rory Fanning）、吉姆·普兰克（Jim
    Plank）、朱莉·费恩（Julie Fain）以及 Haymarket 团队其他人的慷慨工作；感谢想要参与这场关于性别与权力的对话的读者；感谢那些让我的书能够触及读者的独立书店；感谢书籍仍然是我们生活的中心，仍然是我们在宁静与孤独中与他人思想交流的最深度的方式。


    特别感谢克里斯托弗·贝哈（Christopher Beha），他邀请我担任《哈珀杂志》（Harper’s）的专栏作家，在那里，“所有问题的母亲”（The Mother
    of All Questions）、《逃离5000年的郊区》（Escape from the 5,000-Year-Old Suburb）和《伟大性》（Giantness）首次发表；感谢出版了其中几篇文章的《卫报》编辑们，包括《叛乱年》（An
    Insurrectionary Year）、《死后一年》（One Year after Seven Deaths）和《强奸笑话的短快乐近期史》（The Short
    Happy Recent History of the Rape Joke）；以及感谢 Lithub 的约翰·弗里曼（John Freeman）和乔尼·戴蒙德（Jonny
    Diamond），在那里，《女性不该读的80本书》（80 Books No Woman Should Read）、《男人向我解释洛莉莉塔》（Men Explain
    Lolita to Me）和《失踪作案者的案》（The Case of the Missing Perpetrator）首次出现。


    非常感谢我的老友帕斯·德·拉·卡拉萨（Paz de la Calzada），她精美的画作以微妙的方式唤起身体、美感、越界和边界，丰富并深化了这本书。还有我的朋友玛丽·贝斯·马克斯（Mary
    Beth Marks），我有幸遇到的最善良、最富有光彩的人之一，她非常热爱书籍、热爱水、热爱她的许多朋友，尤其是她的妻子、兄弟和姐夫，她在我们完成这本书时突然去世了，而这本书正以献给我生命中的年轻人作为开头；让它在对她的深情怀念中结束吧。


    # 艺术谢


    插画由 Paz de la Calzada 创作。所有图片由 Paz de la Calzada 提供，感谢艺术家。


    Paz de la Calzada 是一位定居旧金山的跨学科艺术家。她的场特定绘画和装置创造了复杂的迷宫，提供了一条从公共领域进入冥想境界的路径，连接了两个非常孤独的世界。她的
    *HairScope* 系列图中复杂的线条和重复的图案与周围的建筑共存协作，重新夺了女性美的某些方面。


    Paz 曾在美国、印度、克里特和西班牙创作过临时公共艺术项目，与当地社区互动并从他们的故事中汲取感。

    www.pazdelacalzada.com


