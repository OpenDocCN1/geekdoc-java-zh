    ## Introduction


    The longest and newest essay in this book is about silence, and I began it thinking
    I was writing about the many ways women were silenced. I soon realized that the
    ways men were silenced were an inseparable part of my subject, and that each of
    us exists in a complex of many kinds of silence, including the reciprocal silences
    we call gender roles. This is a feminist book, yet it is not a book about women''s
    experience alone but all of ours—men, women, children, and people who are challenging
    the binaries and boundaries of gender.


    This book deals with men who are ardent feminists as well as men who are serial
    rapists, and it is written in the recognition that all categories are leaky and
    we must use them provisionally. It addresses the rapid social changes that are
    not merely altering the laws. It’s changing our understanding of consent, power,
    rights, gender, voice, and representation. It is a gorgeously transformative movement
    led in particular by the young, on campuses, on social media, in the streets,
    and my admiration for this fearlessly unapologetic new generation of feminists
    and human rights activists is vast. As is my fear of the backlash against it,
    a backlash that is itself evidence of the threat feminism, as part of the broader
    project of liberation, poses to patriarchy and the status quo.


    This book is a tour through carnage, a celebration of liberation and solidarity,
    insight and empathy, and an investigation of the terms and tools with which we
    might explore all these things.


    ## The Mother of All Questions (2015)


    I gave a talk on Virginia Woolf a few years ago. During the question period that
    followed, the subject that seemed to most interest a number of people was whether
    Woolf should have children. I answered the question dutifully, noting that Woolf
    apparently considered having children early in her marriage, after seeing the
    delight that her sister, Vanessa Bell, took in her own. But over time Woolf came
    to see reproduction as unwise, perhaps because of her own psychological instability.
    Or maybe, I suggested, she wanted to be a writer and to give her life over to
    art, which she did with extraordinary success. In the talk I had quoted with approval
    her description of murdering "the Angel in the House," the inner voice that tells
    many women to be self-sacrificing handmaidens to domesticity and the male ego.
    I was surprised that advocating for throttling the spirit of conventional femininity
    should lead to this conversation.


    What I should say to the crowd was that our interrogation of Woolf’s reproductive
    status was a soporic and pointless detour from the magnificent questions her work
    poses. (I think at some point I, “Fuck this shit,” which carry the same general
    message, and moved everyone from the discussion.) After all, many people made
    babies; only one made To Lighthouse and Three Guineas, we were discussing Woolf
    because of the latter.


    The line of questioning that was supposed to be about a book I had written on
    politics, the British man interviewing me insisted that instead of talking about
    the products of my mind, we should talk about the fruit of my loins, or the lack
    thereof. Onstage, he hounded me about why I hadn’t children. No answer I gave
    satisfied him. His position seemed to be that I must have children, that it was
    incomprehensible that I did not, and so had to talk about why I didn’t. When I
    got off stage my publisher’s publicist—slight, wearing pink ballet slippers and
    an engagement ring—was howling in fury. “He would never ask a man that,” she spat.
    She was right.


    I use now, framed as a question, to stymie some of the questioners: “Would you
    ask a man that?” Such questions seem to come out of the sense that women, the
    51 percent of the human species who are diverse in their wants, are the other
    49 percent, who must marry, must breed, must let in and babies out. At their heart
    these questions are not questions but assertions that we fancy ourselves, charting
    our own courses, are wrong. Brains are individual phenomena producing wildly varying
    products; uterus brings forth creation.


    As happens, there are many reasons why I don''t have children: I am very good
    at birth control; though I love children and adore adulthood, I also love solitude;
    I was raised by unhappy, unkind people, and I wanted never to replicate their
    form of parenting nor create human beings who might feel the way I sometimes felt
    about my begetters; the planet is unable to sustain more people, and the future
    is uncertain; and I really wanted to write books, which as done is a fairly consuming
    vocation. I''m not dogmatic about having kids. I might have had them under other
    circumstances and been fine—as I am now.


    Some people want kids but don''t have them for various private reasons, medical,
    emotional, financial, professional; others don''t want kids, and that''s not anyone''s
    business either. Just because the question to be answered doesn''t mean that anyone
    is obliged to answer it, or that it ought to be asked. The interviewer''s question
    to me was indecent, because it presumed that women should have children, and that
    a woman''s reproductive activities were naturally public business. More fundamentally,
    the question assumed that there was only one way for a woman to live.


    But even to say that there''s one way may be putting the case out optimistically,
    given that mothers are consistently wanting. A mother may be treated like a criminal
    for leaving her child alone for five minutes. Some mothers have told me that having
    children caused them to be treated as bovine nonintellects who should be disregarded.
    A lot of women I know have been told that they cannot be taken seriously professionally
    because they will go off and reproduce at some point. Many mothers who succeed
    professionally are presumed to be neglecting someone.

