    But a significant subsection is directed at silencing the women—“Shut up you bitch”
    is a fairly common refrain. Or “I’m going to cut off your head and rape it” was
    one tweet I got.


    Which probably distinguishes her from most of the male classics professors at
    Cambridge. She told the *New York Times* in April 2016, “We have never escaped
    a certain male cultural desire for women’s silence.”


    Women are often disqualified from participation in the kind of public life Beard
    speaks of.


    There are myriad ways to remove women from public and professional life. Women
    who work in engineering speak of ways in which their access to training and meaningful
    roles was denied; women who competed in chess speak of sexual harassment and denigration;
    the same stories emerge from women in many other fields. Women in politics are
    criticized for their appearances, for their voices, for being ambitious, for not
    serving their families full-time (or for not having families). Words like *strident*
    and *bossy* are largely reserved for women for African Americans. Women in politics
    must not be too feminine, since femininity is not associated with leadership,
    but they must not be too masculine, since masculinity is not their prerogative;
    the double bind requires them to occupy a space that does not exist, to be something
    impossible in order not to be something wrong. Being a woman is a perpetual state
    of wrongness, as far as I can determine. Or, rather, it is under patriarchy.


    I looked at the reception of Rachel Carson''s landmark 1962 book about the devastating
    effect of pesticides, *Silent Spring*, many times, applauded at the waves and
    then since she was dismissed as hysterical, emotional, unqualified. As I was writing
    this book and researching another project, I read an oral history in which a man
    who had been on the board of the Sierra Club at the time *Silent Spring* was published,
    making Carson perhaps the best-known environmentalist of the 1960s, said: “I cannot
    think of her now but some woman who is not a scientist write a story about terrible
    pesticides.” The only description he wanted was that she was not a scientist.


    Suki Kim, an investigative journalist who went undercover to report on North Korea,
    in 2016, wrote in the New Republic, the idea that women are not qualified is rampant
    now, as it was in Carson''s time. It was reframed as personal, rather than professional,
    for marketing reasons, but also with a sense that women belonged outside it. She
    was moved from a position of authority, to the realm of the imprisonment the old
    order in which women were confined to the home and private life, as though the
    only realm in which she was competent was herself.


    # IV: THE FLOODED CITY


    > "I want to write a novel about silence. The things people do not say."

    —Virginia Woolf


    A feminist literature investigates the nature of those silences, their causes,
    and effects, peaking in the 1970s and early 1980s with a plethora of essays on
    silence. Mary Wollstonecraft and nineteenth-century feminists addressed exclusion
    and power, including the exclusion from educ. Suffragists pointed out that to
    be without the vote was to be silenced politically, excluded from full citizenship,
    self-determination, and the public sphere. Charlotte Perkins Gilman spoke in 1911
    of women "hedged with restrictions of a thousand sorts ... the enforced ignorance
    from which women are now swiftly emerging." In the era when women gained the vote—in
    1920 in the United States, in 1918 in Britain—but lacked so much inside, the investigation
    of silence continued.


    Virginia Woolf sounded the alarm in two landmark essays. The more famous *A Room
    of One Own* came out in 1929, based on a pair of talks in 1928, by the practical,
    financial, social, and psychological restrictions on women writing and, by implication,
    having a voice. But what kind of voice could she have? Adrienne wrote, half century
    later, I was astonished by the tone of effort, of pains taken, of dogged tentativeness
    in the tone of that essay. I recognized that tone. I had heard it enough, in myself
    and in others. It is the tone of a woman almost in touch with her anger, who is
    determined not to appear angry, who is willing to be calm, detached, and ever
    charming in a roomful of men where things have been said which are attacks on
    her very integrity. Virginia Woolf is addressing an audience of women, but she
    is acutely conscious—as she always was—of being overheard by men.

