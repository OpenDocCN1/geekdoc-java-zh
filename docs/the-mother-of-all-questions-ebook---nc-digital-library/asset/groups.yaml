    # One Year after Seven Deaths

    (2015)


    In 1988 the photographer Richard Misrach found a couple of Playboy magazines that
    had been used for target practice near the Nevada Nuclear Test Site, where more
    than a thousand US and British nuclear weapons had been detonated. As he looked,
    a breeze rustled the pages of the magazine to a picture of Ray Charles singing.
    Every page of the magazine had a starry constellation of bullet holes—jagged,
    with rips going into the paper beyond the hole—scattered across it. Misrach recalls
    that Ray Charles’s “ecstasy was transformed into a scream by a bullet that had
    ripped through the magazine. I realized that the women on the covers of both magazines
    were the intended targets, but that the violence that was directed specifically
    at the women symbolically penetrated every layer of our society. Every aspect
    of our society . . . was riddled with violence.


    I thought of his big color photographs of male and female celebrities, landscapes,
    products, movie scenes, all ripped through by bullets, and of his comment, when
    I began to contemplate, again, the Isla Vista massacre a year ago today. On the
    evening of May 23, 2014, a twenty-two-year-old went on a rampage that left six
    dead and injured many, grazed by bullets or slammed into his car, before he killed
    himself with his handgun.


    The weather was balmy that night in Isla Vista, a coastal development next to
    the University of California–Santa Barbara, full of pizza and burrito shops with
    gimmicky names, fraternity and sorority houses, apartment buildings. Students
    were out skateboarding, bicycling, walking around with friends and T-shirts and
    swimsuits. The killer, whose name should not be remembered, who should not be
    glorified as the Columbine killers were, had though he had lived there for nearly
    three years. He had long planned a bloodbath as revenge on a world he thought
    owed him sex, adoration, friendship, success. His hatred was particularly directed
    at women and girls and the men who enjoyed their company.


    The autobiography the young man, who grew up on the edge of the Hollywood movie
    industry, posted online that is notable for its shallowness and his entitlement.
    Those are harsh words, but there''s no other way to describe his utter lack of
    empathy, imagination, and engagement with the life of others. He''s often described
    as mentally ill, but he seems instead to be someone who was exceptionally susceptible
    to the madness of the society around him, our society at its worst.


    His misogyny was our culture''s misogyny. His sad dream of becoming wealthy, admired,
    and sexually successful by winning the lottery was banal, widely marked dream.
    His preoccupation with brand-name products and status symbols was exactly what
    the advertising industry tries to inject into our minds. His fantasy of attaining
    power and status at the point of a gun is the fantasy sold to the gun lobby and
    the action movies in which invulnerable superman unerringly shoots down the bad
    guys, a god made by his gun. "My first act of preparation was the purchase [of]
    my first handgun," he wrote about his long-planned rampage. "After I picked up
    the handgun, I brought it back to my room and felt a new sense of power. I was
    now armed. Who''s the alpha male now, bitches? I thought to myself, regarding
    all of the girls who''ve looked down on me in the past.


    That day, as he had planned, he stabbed to death three young men in his apartment,
    apparently ambushing them one at a time. Two were his roommates, one visitor:
    Weihan Wang, age twenty, Chen Hong, also twenty, and George Chen, nineteen. He
    then set out with his guns for the sorority he thought the most beautiful women
    and banged on the door, hoping to go in and massacre all—full of hot, beautiful
    blonde girls; the kind of girls I''ve always desired was never able to have because
    they all look down on me. They are all spoiled,hearted, wicked bitches.


    Alarmed by the angry, persistent pounding on the sorority''s front door, he opened
    it. The killer instead shot three women out front, twenty-two-year-old Katherine
