    # 女人不该读的80本书

    (2015)


    几年前，《时尚绅士》（Esquire）汇总了一份清单，它像僵尸一样从死里复活，在互联网上徘荡。“每个男人都应该读的80本好书”提醒人们，这本杂志是给男士的，而且如果现在许多年轻人否认性别的二元对立，他们就是在反抗那些在人类身上筑起如铁幕般、根深蒂固的人。


    诚然，像《时尚芭》（Cosmopolitan）这样的女性杂志几十年来一直提供关于“如何成为女性”的同样令人不安的指令。也许关于这两种主要性别的指令每月发布发行如此之久，恰恰说明了性别的脆弱性。男人应该读和女性不一样的书籍吗？在这份清单中，他们甚至不应该读女性的作品，在79本男性的著作中，只有一本是弗兰纳瑞·奥康纳（Flannery
    O’Connor）写的。


    作者在奥康纳的《好人难寻及其他故事》中引用了一段话：“她本可以是个好女人……如果有人在她生命的每一分钟都对她开枪。”开枪。这与约翰·斯坦贝贝克（John Steinbeck）《愤怒葡萄》的评论相得益彰：“因为那全是关于乳房。”换句话说，书籍是指令；他们阅读书籍是为了成为一个男人，这就是为什么男人需要他们自己的清单。那么什么是男人？对杰克·伦敦（Jack
    London）《荒野呼唤》的评论告诉我们：“一本关于狗的书同样也是一本关于男人的书。我猜，母狗就是疯狂的男人。”


    浏览这份充满了有史以来最男子气概书籍的清单（其中有很多战争书籍，只有一本是由一位公开的同性恋男性撰写的），让我想起当一个女人很难——在很多方面，做一个男人更难，因为这种性别似乎必须通过男子气概的行为不断地防御和证明。我看着那份清单，脑中不由自主地浮现出一个念头：“难怪有这么多杀手。”尽管，当这项任务被这样设定时，幸运的是，许多男人有更优雅、更有共情力的处世方式。


    这份清单让我觉得应该还有另一份，包含一些相同的书籍，名为“女人不该读的80本书”，尽管我认为每个人都应该读他们想读的任何书。我认为有些书籍是关于为什么女性是垃圾、或者除了配饰之外几乎不存在、或者天生邪恶且空虚的指令。它们是关于“男子气概”版本的指令，这种气概意味着无情和无知，这种价值观扩张为家庭、战争和经济手段上的暴力。让我证明我不是一个厌男主义者吧，我的我的清单从安··兰德（Ayn
    Rand）的《动摇的地球》开始，因为任何美国议员保罗·莱恩（Paul Ryan）如此喜爱的书，都对他正死死想要创造的苦难负有某种责任。


    谈到将女性视为“非人”的指令，当我第一次读《在路上》（On the Road）时（这本书不在清单上，尽管《法达的流浪者》在），我意识到这本书假设你认同主角，主角坚信自己敏感而深邃，即使他离开了那个与之在一起的拉丁裔农场女，让她去面对他所造成的任何麻烦。它假设你不认同那个女人本身，她并不在路上，也没有被当作除了一个可以丢弃的仓库以外的任何。


    我认同她，正如我认同《洛莉塔》（Lolita）一样（《洛莉塔》，亨特共情失败的杰作，出现在《时尚绅士》清单上，带着含蓄的描述）。我最终原谅了克鲁拉克（Kerouac），正如我原谅詹姆斯·哈里森（James
    Harrison）在纸面上将色欲物化，因为他们有可救的特质。哈里森的色欲中有一种健康的中西部特色，不像所有的查尔斯·布科斯基（Charles Bukowski）和亨利·米勒（Henry
    Miller）。


    这三个人都在《时尚绅士》清单上。正如《n+1》杂志编辑戴娜·托托里奇（Dayna Tortorici）所说：“我永远不会忘记读布科斯基的《邮局》时的感觉非常糟糕，叙述者描述丑女腿部厚度的方式。我觉得那是我第一次觉得一本我试图认同的书拒绝了我。尽管我吸收了它，当然，它让我讨厌我的身体或类似的什么。”作家艾米莉·古尔德（Emily
    Gould）几年前将贝洛（Bellow）、罗斯（Roth）、厄迪克（Updike）和梅勒（Mailer）描述为“中世纪厌女性主义者”，对于《时尚绅士》清单上也会进入我清单的那四个人来说，这是一个方便的术语。


    欧斯特·海明威（Ernest Hemingway）也在我的禁读区，因为如果你从格特鲁·斯坦（Gertrude Stein）那里学到了很多，就不应该是一个恐同恋的、反犹太教的厌女性主义者，而且射杀大型动物永远不应该等同于男子气概。枪支-阴茎-死亡的关系既悲伤又丑。而且那种简洁、压抑的散文风格在他笔下是做作、虚伪且感性的。男人气气的感性是最糟糕的一种感性，因为它在某种程度上是自我欺目的，比如诚实感性的狄更斯（Dickens）从未有过过。


    此外，海明威对F·斯科特·菲茨兹杰德（F. Scott Fitzgerald）阴茎尺寸的那些坏话是可怜且透明的，在那时菲茨兹杰德还是一个更成功的作家。他仍然要好得多，句子像丝绸，而海明威的散文像乐高积木，而且他对戴西·布坎南（Daisy
    Buchanan）和尼科尔·迪弗（Nicole Diver）以及他的男性角色有着如变色龙般的共情。《温柔的夜晚》（Tender Night）可以被视为对乱伦和虐待深远影响的调查。诺曼·梅尔（Norman
    Maier）和威廉·巴鲁克斯（William Burroughs）在我的禁读清单上名列前茅，因为有很多作家读后没有留下或射杀他们的妻子（*等等，OCR显示为"read
    not stay or shoot their wives"*）。


    （注：此处原文存在大量重复和OCR识别错误，翻译时已根据要求进行清理并仅翻译核心内容）


