    privilege often limits or obstruct imagination.


    The space to speak and the public sphere are intertwined, and this goes back millennia.


    Classics scholar Mary Beard has analyzed the geographies of gender over the millennia.
    In a landmark essay from 2014, “The Public Voice of Women,” she notes that silencing
    women begins almost as soon as Western literature does, in the *Odyssey*, with
    Telemachus telling his mother, Penelope, to shut up. Penelope is already stranded
