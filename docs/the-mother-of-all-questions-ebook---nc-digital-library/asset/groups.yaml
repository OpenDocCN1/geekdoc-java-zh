    甚至剥夺了女性受害者的堕胎权。在当前反堕倡导和执行的极端情况下（例如那些因试图导致流产而被起诉的女性案例），女性相对于子宫里的胎儿毫无价值，尽管大约一半的胎儿最终会变成女性，而这些女性反过来又被认为相对于下一代潜在胎儿毫无价值。女性可能是价值的容器的容器的容器，即男性。胚胎期的男性。又也许孩子在变成女性之前都是有价值的。我不知道。这些人到底是怎么想的，对我来说是个谜团。


    与此同时，在这个关于生殖的神秘化故事中，怀孕的机制被刻意规避了。首先，有一个我们可以称之为“消失男性的谜团”：它让男性在生殖中缺席，并让父亲从所谓的“父爱缺失”中解脱，仿佛他们对孩子生活的缺席与他们自己无关。（是的，确实有坏女人会阻碍男性与孩子的接触，但根据我的个人经验，我见过更多父亲失踪、母亲充当暴力变态狂魔的案例。）说真的，为什么男性在这些叙事中缺席：这免除了他们对怀孕的责任，包括那些不幸和意外的怀孕，然后免除了他们产生那种让许多贫困女性长期饱受指责的现象——缺失父亲的孩子。这些缺失孩子的父亲们多不胜数。


    你可以想象一个非厌女的平行宇宙，在那个宇宙里，男性被告知他们携带着这种危险的东西，这种东西能让女性陷入九个月的怀孕并产下其他人类；而当他们在未经同意、计划或不考虑长期后果的情况下向无法防御的人植入东西时，他们就是不负责任的、不道德且缺乏某种东西——女性到底缺乏什么？——除了警告女性用怀孕陷害男性之外，并上并没有多少这方面的指责，而这种警告往往是描述男性推卸责任的一种，而非真的在承担责任。对女性的建议类似于对女性的饮酒指南：一种导致出生缺陷的疾病被描绘成完全取决于女性的问题，即使在像萨尔瓦多尔这样的国家，那里在任何情况下堕胎都是非法，避孕工具无法获得，而且（和几乎其他事情一样）女性并不总能有安全的时间拒绝性行为。十七名被指控堕胎的女性（在萨尔瓦多尔，有时流产会被解释为堕胎）因杀人罪入狱。显而易见，她们的身体并不认为属于自己，但巴西确实没有绕过告诉我有怀孕的风险。


    这种对生殖的神秘化充满了消失的男性和缺失的资源。美国疾病控制中心（CDC）对美国意外怀孕的强调引发了问题：如果更好地获得生殖权利和教育，是否可以减少意外怀孕？而那种声称所有使用避孕药的女性都不应该喝酒的断言——我希望所有告诉女性酒精很危险的人，其实是一个热爱婴儿国家的表现，这种表现应该贯穿从纽约到弗林特的铅污染，爱荷华州受硝酸盐污染的水源，以及糖类食品与普遍获得良好食物的需求之间的联系。你知道事实并非如此。这只是仇恨女性。仇恨女性需要这种叙事让男性消失，让女性变成魔法师，凭空和通过卤素产生婴儿。对于权力来说，这是一种趣的叙事，因为它赋予了女性权力，但我更想要一个准确的叙事。也许应该更广泛地讨论影响儿童福祉的所有生态和经济因素。但那样的话，罪责方就变成了我们，而不是他们。


    语言至关重要。我们曾在强奸语言上进行过激烈斗争，以便让人们停止指责受害者。那个简洁概括这一点的词是：强奸。女性穿什么或消费什么，去哪里，其他等等，因为当你把女性视为过错者时，就成了消失的主角之谜团。强奸是一种蓄意行为：行为者是强奸犯。然而，你会认为特别是大学校园上的年轻女性是在强奸自己，所以校园上缺席的男性成了一种环境自然力量，一种无法治理或追究责任的必然性。个体男性在这一叙事中消失了，而强奸、攻击、怀孕只是变成了女性必须适应的条件。如果这些事情发生在她身上，失败是她们的。


    CDC 正在拼命扭动身子以避免说另一部我们的反侦探小说，或者这个谜团的另一个章节。我们在这个国家有很多这样的故事，如果你相信它们，它们会让你变蠢。这些故事不是解释，而是对贫困原因和种族主义后果等事事的掩盖。这些故事导致因果倒置，并将意义抛之一边。CDC
    通过告诉女性为什么不应该喝酒，扩大了犯罪者的缺席；喝得太多会带来像臭鼬一样醉酒的风险，但由于这里的伤害与暴力相连，而绊倒椅子通常被视为暴力，所以显然其意思是：有人伤害并致伤了你。在健康的世界和语法连贯的叙事中，暴力有原因，而这个原因具有主体性和意识：它必须是另一个生命实体。酒精不能是那个实体，因为落在你身上的后果不是暴力的，尽管如果你的房子维护不当坍塌在你身上，房东可能负责。


    谁伤害了你不能被提到。房间里只有女性和酒精。即使某人正是被针对的对象：CDC 的指南告诉他们，他们也应该注意自己的饮酒量，并指出“过度饮用酒精通常涉及性侵犯”。过度饮用酒精，或者说，过度酒精摄，那些衬衫上没有刺字字母的人。我们都遇到过过度酒精消耗者（EAU）。他在这里——重点是：他从不单独行动。CDC
    正在拼命扭动身子以避免说“你”或“男性”或“醉汉子”或“犯罪者”。他们似乎并不担心有人可能受到殴打或强奸的伤害，而是担心某人的感受受到伤害。但人们受到伤害，部分是因为我们不想谈论是谁施的手。


    “过度饮用酒精”在这个名单上有一个兄弟叫“过度酒精摄入”，他也是个麻烦：“过度酒精摄入会增加攻击性，因此会增加身体攻击另一个人的风险。”在这一叙事中，EAC
    似乎也是单独行动的，这是一个寻找主语的句子。谁的攻击性？谁会进行攻击？也许 CDC 应该直奔主题，发布关于男性的警告。毕竟，男性是针对女性暴力的主要来源（同样，也是针对男性的暴力的主要来源）。想象一下这种语言！“使用男性可能导致怀孕或受伤；应谨慎使用男性。仔细评估每个男性的潜在风险。使用男性时要小心。”也许他们应该带上警告标签？但那也将免除他们对其行为的责任，我认为一个我们不经常进行这种免责的世界会更好一些。家庭暴力是美国
    15 至 44 岁女性受伤的首要原因。


    那种“她逼我这么做的”的逻辑是次要原因；被动语态和主动暴力往往同时出现。旧金山一名警察杀死一名无武器且无威胁的男子后说：“这很悲剧。不幸我被迫了，”尽管除了偏差之外，没有什么强迫他。拥有二十多年经验的活动家
    Georgia Black 对我说：“我可以告诉你参加过多少量刑和假释听证，犯罪者在那里提到‘发生的可怕事’。”即使是对受害者或受害者家属的道歉信也是“对你发生的事情感到抱歉”。仿佛自我加行动等于结果的简单性是一个他们无法解决的数学题；语言，松散的语言，模糊的语言变成了出口。这种情况会发生。


    在文学的野生保护区中，我们研究语言的物种、单个词的飞行模式、词汇汇在一起的群居行为，并学习语言的作用以及它为什么重要。这为进入世界提供了极好的训练，观察政治声明、新闻头条和
    CDC 指令中所有不允许的言论，并观察它们如何塑造世界，或者在某些情况下搞糟世界。语言最真实、最高的目的是让事情清晰并帮助我们看清；当语言被用来做相反时，你就知道遇到麻烦了，也许可能存在掩盖。CDC
    警告误用酒精的危险是正确的。


