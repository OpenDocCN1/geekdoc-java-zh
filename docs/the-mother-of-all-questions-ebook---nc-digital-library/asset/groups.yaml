    伍尔夫的《女性职业》（*Professions for Women*）最初是于1931年在国家妇女协会发表的一场演讲，它探讨的是另一种声音——不是里奇所批评的那种具有说服力的声音（女性的语调经常受到批评），而是一种令人宽慰的声音。她描述了内化在女性身上的指令，要求她们要讨人、优雅、奉承，这些指令会让真实的声音和真实的思想陷入沉默：她指出，有一种说话的方式可以打破这种沉默的白噪音：那些陈词滥调和安抚、礼貌与拒绝，它们润滑着一个延续沉默的系统。你为他人而说，而不是为自己说。伍尔夫谈到了女性内心的声音，那告诉自己：“要同情；温柔；奉承；欺骗；利用性别所有的艺术技巧和恶习。永远不要让人猜到你有自己的主见。”她将那种声音称为“家中的天使”（Angel
    in the House），并自豪自己出于需要杀了她，这样她才能拥有自己的声音。这样她才能打破沉默。


    百年后，苏珊·格里芬在她的书《色情与沉默》（*Pornography and Silence*）中引用了诺曼·梅勒关于玛丽莲·梦罗的话：“她她是那些凝视她的人获得愉悦的镜子。”这意味着梦罗出现了，她说话了，但她的出现方式、她所说的话并不是为了表达自我、做自己，而是为了服务他人。格里芬评论道：“然而，知道她的象征性存在是一个面具，他拒绝透过这层面具。然而，如果不存在另一个自我——一个被迷失的自我和一个被侵犯的自我，这位女演员的生活就不会是一场悲剧。”这是对一个人如何可能既可见、可闻，却又被沉默的分析。


    梦罗可以代表任何女性，代表所有在追求男性的快乐、认可、舒适和强化过程中，选择沉默、隐藏、伪装或忽视自身特质及自我表达的女性。这并非色情交易；而是职场、教室或街道上的女性学会如何绕过男性的期望，因为她们知道如果过于自信、强势或自给自足，可能会受到惩罚。这也有其类比——我的朋友加内特·卡德多根（Garnette
    Cadogan）曾雄辩而痛苦地写过，作为一个黑人男性在公共场合如何不断地表演“不是罪犯，不是威胁”，以平息白人的恐惧并保护自己。身为黑人又是女性，意味着在这场服务他人的买卖中要承担双重责任。


    梅勒在称梦罗为愉悦的镜子时，未能质疑当这种快乐常规成为他人的时会发生什么。这是一种被伪装成快乐的快乐死亡，是一种为了服务他人而自我的死亡。它是包裹在讨悦的虚无中的沉默。于1962年去世的梦罗肖像，是贝尔·霍克斯斯（bell
    hooks）对男性的“精神自残”观察的一种终结——它是另一种自残的肖像，为了创造一个自我去迎合并服务那些自残的自我。一种面对沉默的沉默，这些沉默像模具和铸件一样完美契合，像一个鬼故事。


    直到蒂尔·奥森（Till Olsen）在1962年发表了一次演讲（1965年发表在《哈珀》杂志上），这成了她她1978年畅销书《沉默》（*Silences*）的一部分。沉默，或者对沉默的质询与消灭的欲望，它，已经成年了。它和现在都笼罩在沉默之中：有些沉默多年来被伟大者承认；有些沉默被隐藏了；有些沉默在一部作品出版后才出版；有些根本没有以书的形式出现。”换句话说，有几种沉默，一种是为了已说出但仍未说的，另一种是关于说出它且被允许说话的人。


    她花时间才进入她的真正主题，仿佛她必须先建立自己的资历，建立对男性伟大文学的认知和关注。然后她转向了文学中女性的沉默，注意到大多数文学家没有孩子，因为留给自己、留给自己声音的时间对于创作至关重要。那是关于实际的沉默——缺乏时间来构建如长篇文章般的文字宫殿——但有许多种沉默。


