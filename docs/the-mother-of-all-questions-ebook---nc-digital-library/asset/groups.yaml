    我们过去并不一定像那些“事如此”的故事所说的那样。现在完全不像那些“事如此”的故事所描述的过去，过去也是如此。我们需要停止讲述那个关于留在家、被动且依赖、等待男人的女性的故事。她并不是坐在那儿等待。她很忙。她现在依然如此。


    ## 当鸽子飞走后留下的刻条框


    我偶尔注意到，实际上无法说明任何事情。词汇是通用的类别，将在重要方面并不相似的事物归为一类；蓝色代表着千种颜色，马涵盖了纯血马、矮马和玩具；爱意味着一切，也意味着虚无；语言是一系列概括，当它们传达任何信息时，勾勒出的都是不完整的画面。使用语言就是进入类别的领地，而这些类别既必不可少，又充满危险。


    类别是泄露的。我本想写下所有类别都会泄露，但对于质数或恒星，确实有些话是可以无例外地为真的。所有的水鼠都是哺乳动物，而且到目前为止所有的美国总统都是男性，但许多其他类别都是复杂的，既包含了真理，也包含了矛盾和对真理的例外。即使是“男性”这个类别现在也面临质疑，尽管我们在思考迄今为止的四位总统时通常如此。


    最近有人告诉我所有犹太人人都支持以色列。当我反对时，他问我最近是否去过纽约，坚信这是支持他论点的决定性因素。我说我去过，而且刚写完一本关于这座城市的书。其中一张地图是关于犹太人的，或者说，“犹太人”这个类别包含了某种程度上相互抵消的人：锡犹主义者和反锡犹主义者、黑帮和人道主义者、哈波·马克斯、库库·科菲、汉娜·阿伦特、伯尼·马多夫和埃琳娜·卡根；地图的副标题是“从高盛到高盛萨克斯”，以防有人忽略了类别内部的矛盾。我的对话者认为，犹太人是一个拥有统一思想的同质化群体，像有生命的哈瓦瓦或黏泥一样。


    “歧视”（discrimination）一词有两个相反的含义。持续地歧视是指清晰地区分，详细地感知；在社会政治层面，它是拒绝清晰地区分，未能将范畴落实到细节和个体。种族主义是由无差别（或至少是基于范畴）驱动的歧视。当然，这是一个包含其对立面的范畴陈述。类别对于反种族主义也是有用且必要的：次级贷款出售者的目标是有色人种，因此这群人在2008年金融危机中损失了更高比例的净资产；近期研究结论认为，学校往往对黑人儿童的惩罚更为严厉。但这些是对群体状况的描述，而非其本质。


    一个群体是一个密不透光的类别，其成员共享的心态、信仰以及最终的责任，这种观点是歧视的核心。它导致了集体惩罚，导致了观念：如果这个女人背叛了你，那个是可以救的；如果某些无家可归的人犯罪，所有无家者的人都可以受到惩罚并驱逐。最高法院曾发现，“仅根据血缘对公民进行区分，其本质对于一个建立在平等原则之上的自由人民来说是可恶的。因此，仅基于种族的立法分类或歧视被认为是对平等保护的否定。”这是在弗雷德·科雷马茨的案件中，他在二战期间像他那样的日裔美国人，但法院维持这些罚款是非法的，然而思维习惯并不受法律约束。


    反种族主义的叙事也可以是无别的。有些人现在喜欢断言《宪法》第十九修正案并没有赋予所有女性投票权。从技术上讲，第十九修正案赋予了所有公民的成年女性投票权，或者说任何权利都不应“由于性别”而被剥夺；更准确的说法是这种权利在某些地方被剥夺了——并注意到，保持部落身份的印第人直到1924年的《印第人公民法案》才获得投票权。这些足以动摇规则的例外；这些类别的泄露是否值得承认？我们应该多精细地解析1920年谁获得了投票权？我们在多大的尺度上筛筛选准确性？


    古生物学家和进化生物学家有时分为“大分类派”和“小派”——取决于他们倾向于将证据视为一个具有广泛差异的单一物种，还是不同的物种。对于古生物学家来说，他们可以利用的证据稀少；有时会被后来的证据矛盾或加强；即使是仔细的研究也会导致无法解决的问题或有争议的解释。但我们对彼此的判断往往是通过避开证据做出的。类别成了我们某些人的封闭系统。我们是谁、我们在做什么，通常以被蔑视的方式被包装。所有犹太人都支持以色列。所有穆斯林都是圣战分子。所有女同恋者都恨男人。你把世界包裹在一个整洁的包子里，思考就可以停止了。


    无别的歧视也导致了集体惩罚的观念：当你将他人视为一个单一有机体——犹太人、黑人、女性、同性恋者、无家者、穷人——你可以攻击该有机体的任何部分。迪兰·斯托姆·鲁夫（南卡罗来纳州查尔斯顿的凶杀犯）意味着他在2015年枪杀了九名男女，并解释说黑人正在侵奸“我们的女性”，而没有将这种情境定性为白人男性（特别是他那一刻的自己）正在杀害黑人女性和男性。


    任何个体女性都可能被视为关于女性的“行走公投”——我们是否情绪化、有心机、反感数学？——而男性相对免于被衡量。我们没有听到很多关于白人特性的概括，而且鲁夫或查尔斯·曼森并不被认为是其种族或性别的耻辱。被视为超越或处于类别之外可能是一种特权，一种“作为个体而非标本”的地位。免受歧视意味着允许作为一个个体根据自己的表现接受评估。但这种自由可能导致重要数据遗漏。


    相比之下，黑人的任何犯罪都被某些人视为对整个黑人类别的指控。“黑人命关”运动的兴起伴随着让白人尴尬的要求，他们要求任何黑人去解释费格森或巴尔的摩的骚乱起义，或为这些或类似事件的道歉，就好像他们遇到的任何黑人都可能

