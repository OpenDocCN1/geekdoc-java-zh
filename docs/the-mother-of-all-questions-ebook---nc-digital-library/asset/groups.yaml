    they want to share their sandwich with you, and that''s not a form of oppression
    either. You probably learned that in kindergarten.


    But if you assume that sex with a female body is a right that heterosexual men
    have, then women are just these crazy illegitimate gatekeepers always trying to
    get between you and your rights. Which means you have failed to recognize that
    women are people, and that comes from the books and movies you have—and haven''t
    been exposed to, as well as the direct inducement of the people and systems around
    you. Art matters, and there''s a fair bit of art in which rape is celebrated as
    a triumph of the will (see Kate Millet''s 1970 book Sexual Politics, which covers
    some of the same male writers as the *Esquire* list). It''s always ideological,
    and it makes the world we live in.


    Investigative journalists T. Christian Miller and Ken Armstrong published, in
    December 2015, a long piece about how police caught a rapist (and how one of his
    victims was not only delivered for years but was bullied into saying she lied
    and then prosecuted for lying). The rapist told them “Deviant fantasies had gripped
    him since he was a kid, way back to when he had seen Jabba the Hutt enslave and
    Princess Leia.” Culture shapes up.


    But “to *Lolita* and ‘identify’ with one of the characters is to entirely misunderstand
    Nabokov,” said one of my volunteer instructors. I thought that was funny, so I
    posted it on Facebook, and a nice liberal man came along and explained to me that
    this book was actually an allegory—as though I hadn''t thought of that. It is,
    and it''s also a novel about a big old guy violating a childish child over and
    over. Then she weeps. And then another liberal man came along and said, “You do
    not seem to understand the basic truth of art. I wouldn''t care if a novel was
    about a bunch of women running casting men. If it was great writing, I''d want
    to read it. Probably more than once.” Of course there is no body of literature,
    and if the liberal man made that statement had been assigned book after full of
    casting scenes, maybe even celebrations of castration, it might have made an impact
    on him.


    I hasten to add that I don''t think I''m injured by these guys at this point in
    my life, and I don''t feel sorry for myself. I just goggle in amazement at the
    batshit that comes out of them; it''s like I''m running a laboratory and they
    keep offering up magnificent specimens. Apparently ever over the horizon some
    of them got so upset that no less a literary voice than this year''s Booker winner
    Marlon James, said, "Liberal men. I''m not about to stop your inevitable progress
    to neoliberal and eventually, neocon, let''s make this one quick. It seems some
    of you have a problem with Rebecca Solnit''s new piece. It is censorship, and
    there is challenging somebody''s access to making money. This is not the same
    thing."


    And though I was grateful to James for calling them out, I wasn''t even challenging
    anyone''s access to making money. I just made humorous remarks about some books
    and some dead writers'' characters in a piece that also praised and celebrated
    many male writers (it actually praised about the same number of men that it excoriated;
    you could consider the score even). These guys were apparently upset and convinced
    that the existence of my opinions and voice nuanced others'' rights. Guys: censorship
    is when the authorities repress a work of art, not when someone dislikes it.


    I had never said that we shouldn''t read Lolita. I read it more than once. I joked
    that there should be a list of books no woman should read, because quite a few
    lionized books are rather nasty about my gender, but I''d also said, "Of course
    I believe everyone should read anything they want. I just think some books are
    instructions on why women are dirt or hardly exist at all except as accessories
    or are inherently evil and empty." And then I''d had fun throwing out some opinions
    about books and writers. But I was serious about this. You read enough books in
    which people like you are disposable, or are dirt, or are silent, absent, or worthless,
    and it makes an impact on you. Because art makes the world, because it matters,
    because it makes us. Or breaks us.


    ## Drinking too much can have many risks for women.


    ![](img/d6573876511d332120e83cdfee205779_122_0.png)


    # The Case of the Missing Perpetrator

    (2016)


    In a detective novel, you begin in a state of ignorance and advance toward knowledge,
    clue by clue. The little indicators add up at last to a revelation that sets the
    world to right and sees that justice is done, or at least provides the satisfaction
    of a world made clear in the end. If detective fiction is the literature of disillusion,
    then there''s a much more literature of illusion that aspires to deceive and distract
    rather than clarify.


    A perfect example is the Center for Disease Control''s new and widely mocked guidelines
    to drinking. They are like a detective novel run backward—if you read them with
    incredity, you''d become muddled about what a woman is and how violence and pregnancy
    happen and who is involved in those things. If you read more carefully, you might
    learn why...


