    # Men Explain Lolita to Me

    (2015)


    It is a fact universally acknowledged that a woman in possession of an opinion
    must be in want of correction. Well, actually, no it isn''t, but who doesn''t
    love riffing on Jane Austen and her famous opening sentence? The answer is: lots
    of people, because we are all different and some of us haven''t read Pride and
    Prejudice dozens of times, but the main point is that I''ve been performing interesting
    experiments in proffering my opinions and finding that some of the people out
    there, particularly men, respond on the grounds that their opinion is wrong, while
    theirs is right because they are convinced that their opinion is a fact, while
    mine is a delusion. Sometimes they also seem to think that they are in charge
    of, and as well of facts.


    It''s not a fact universally acknowledged that a person who mistakes opinions
    for facts may also mistake himself for God. This can happen if he''s insufficiently
    exposed to the fact that there are also other people who have other experiences,
