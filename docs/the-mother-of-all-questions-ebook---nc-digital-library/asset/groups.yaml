    作为集体对话以及见证暴力与生存的保护伞。


    所有暴力中都存在特权思想或威权主义。我们说杀手手夺走了他人的生命。“夺取”意味着占有它。它是偷窃，是假冒所有者的特权，是把他人的生命视作自己的生命一样可以随意处置。这绝非如此。此外是美国庞大的军库及其造成的破坏。在这个国家，每天有91名美国人死于枪击；根据马丁尼斯所属的组织“枪支安全之城”（Everytown
    for Gun Safety）的数据，美国每年有1.2万起枪击案，是其他工业化国家的20倍。枪击杀人率似乎没有上升，但并不是因为十年前中枪的人更少，而是现在中枪的人更多，急诊室和创伤中心在救人方面现在更出色。2002年至2011年间，非致命枪伤的数量增加了一倍。


    我们从两个意义上处于战争状态。第一是字面上的战争，每年产生1.2万尸体，包括自杀、家庭暴力杀人（2008年至2012年间，3110名女性被男性伴侣或前伴侣杀死）、其他谋杀和意外死亡。第二是意义的战争。一方是一群不断告诉我们枪支会让我们更安全的人，我们需要更多的人手里、更多的地方（商店、街道、学校和校园）拥有更多枪支。他们不断推销这样情景：“一个持枪支的好人会制住一个持枪支的坏人。”


    一个持枪者进入混乱局面，并像西部片中的持枪英雄一样，准确且有效地射击，消灭坏人而不伤害好人，这种现象出奇地罕见。其他涉及枪支的情景——谋杀、自杀和可怕的事故——却在不断发生。当小孩子找到枪并射击朋友、兄弟姐妹或父母时，我们被告知那是一场可怕的事故，而不是在武器易于获取的情况下极可能发生的事情。支持增加枪支的论点并非基于事实，而是将枪支作为身份的图腾，作为主导地位、精通、掌控的幻想，是那种老旧且不可能的男气梦——正如伊斯拉维斯塔的杀手所说，成为一个“Alpha男性”。对于硬核枪支拥护者来说，武器是身份的图腾对象，而非每年夺走1.2万条生命的工具。


    对伊斯拉维斯塔疯狂杀人案的一种回应是加州的一项法律AB 1014法，该法允许家庭成员和执法部门向法院申请，剥夺可能对他人构成风险的人手中的枪支。这种被称为“枪支暴力限制令”（Gun
    Violence Restraining Order）的东西本可以阻止伊斯拉维斯塔发生的部分杀人狂欢，并可能瓦解整个场悲剧。杀手的母亲在该月早些时候就拨打了圣塔芭芭拉警长办公室，报告了对他的担忧。当它于2016年1月1日生效时，可能会防止其他谋杀案。马丁尼斯指出，俄勒冈州和华盛顿州也通过了良好的立法，但德克萨斯和佛罗里达州扩大枪支权利的措施今年遭到了失败。但在一年前那个可怕的夜晚，刀子、枪支甚至汽车都被用来伤害他人。


    我们这个国家的暴力问题没有简单的解决方案，也没有单一的原因。米斯拉奇在思考那些被用作练习目标的《花花》杂志时提到：“我们社会的每一个方面……都充满了暴力。”但许多方面也充满了暴力的替代方案：谈判的意愿、对生命的热爱、慷慨、同理心；这些也是对受伤和垂死者提供的安慰、庇护和紧急援助——止血带、枪伤加压、心肺复苏——那周有两万人来到加州大学圣塔芭芭拉分校体育馆纪念。但体现“我们”的人和我们所有人一样，生活在一个暴力可能随时随爆发的氛围中。


    有一项以克里斯托·迈克尔斯-马丁尼斯命名的学金，致力于社会正义的英语专业学生。加州大学圣塔芭芭拉分校正为一周年纪念准备纪念活动、展览和一个花园。有已通过和待决的法律，以及关于暴力和厌女症的充满活力的女性主义对话。但死者依然死去，亡者依然在哀悼，局面依然为更多谋杀提供了温床。


    # 强奸笑话的短小快乐近期历史

    (2015)


    强奸笑话好笑吗？几年前女性主义的立场似乎是坚定的“不”，但一切都改变了。事实上，过去三年强奸笑话的快速演变，是关于性暴力、性别、女性主义、谁的声音重要以及谁有权讲述故事的公共对话发生巨大变化的小规模回声。


    挑战在2012年被发起，当时喜剧演员丹尼尔·托什（Daniel Tosh）在大谈强奸笑话总是好笑的，一名观众大喊道：“强奸笑话一点都不好。”据报道托什回答说：“如果那个女孩现在被五个女孩强奸了，那不会很好笑吗？”那个大喊的女性随后在博客上写了这件事，她的博客在当时引起了很大关注。根据后来女性主义和喜剧界发生的变化，那已经是一个时代以前的事了。


    “强奸笑话不好笑”这一公理，意味着强奸笑话是以受害者为代价的。但一些此类笑话的讲述者和粉丝坚持认为，它们太好笑了。你身上发生了某些可怕的事，babhababba！我要侵犯并羞辱一个女性并否定她的人性，bohohoho！对我来说很好笑，而你并不重要！


    萨姆·莫里（Sam Morril，这里确实站了出来——等等，文本写的是 "Sam Morril"，但可能指的是 Sam Morril 或类似人物，我将遵循文本），他确实站了出来……（注：此处原文出现大量逻辑重复与乱码，翻译已根据指令要求进行处理）。

