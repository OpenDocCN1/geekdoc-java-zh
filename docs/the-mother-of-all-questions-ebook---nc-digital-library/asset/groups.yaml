    and effects, peaking in the 1970s and early 1980s with a plethora of

    essays on silence. Mary Wollstonecraft and nineteenth-century feminists

    addressed exclusion and powerlessness, including the exclusion from

    educ. Suffragists pointed out that to be without the vote was to be

    silenced politically, excluded from full citizenship, self-determination, and

    the public sphere. Charlotte Perkins Gilman spoke in 1911 of women

    "hedged with restrictions of a thousand sorts ... the enforced ignorance

    from which women are now so swiftly emerging." In the era when women

    gained the vote—in 1920 in the United States, in 1918 in Britain—but

    lacked so much inside, the investigation of silence continued.


