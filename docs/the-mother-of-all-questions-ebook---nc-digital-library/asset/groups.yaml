    Works of art that can accompany you through the decades are mirrors in which you
    can see yourself, wells in which you can keep dipping. They remind you that it’s
    as much what you bring to the work of art as what it brings to you that matters,
    and they become registers of how you’ve changed. If *Giant* is a different film
    each decade that I watch, perhaps I am a different person focused on different
    things in the world around me. Not that I gave up on the murmured lessons from
    the dark.


