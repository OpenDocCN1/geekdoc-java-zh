    # Acknowledgments


    That there is a war against women was my life growing up in a house full of male
    violence, thinking I would be safe if and when I left, which I did very young.
    As I wrote in Wanderlust (2000): “It was the most devastating discovery of my
    life that I had no real right to life and pursuit of happiness out doors, that
    the world was full of strangers who seemed to hate me and wished to harm me for
    no reason other than my gender, that sex so readily became violence, and that
    hardly anyone considered it public issue rather than a private problem.” I have
    tried to make it a public issue.


    This war is so woven into our culture that it provokes outrage and even little
    attention; isolated events make the news, but the overall pattern is so pervasive
    to me. I have been trying to call attention to it by describing some of its impacts,
    enumerating them with sentences like this domestic violence: “It’s the number-one
    cause of injury to American women; of the million injured annually, more than
    half million of these injuries require medical attention, while about 145,000
    overnight hospitalizations according to the Centers for Disease Control,” trying
    to understand what hate, fear, and entitlement lie behind the violence, and illuminating
    how the violence is only the more dramatic manifestation of a system that devalues,
    dehumanizes, and erases women.


    My gratitude is to the feminist movement as a critical and pivotal part of the
    larger resolutions to make us all equal under the law and in our everyday lives,
    to guarantee rights and respect for everyone. I am old enough to remember the
    ugly world before there was recourse for domestic violence, acquaintance and date
    rape, and workplace sexual harassment (an ordinary part of my working experience
    in my teens), old enough to see the world change because of insight and organizing
    and intervention. I’m grateful to the individuals and collectives who delivered
    a new world in which we are more free and more equal, grateful to have had in
    recent years.

