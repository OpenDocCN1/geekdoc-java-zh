    他们想和你分享他们的三明治，这也不算是一种压迫形式。你可能在幼儿园就学到这一点了。


    但如果你假设与女性身体发生性关系是异性恋男性拥有的某种权利，那么女性就是这些疯狂且不合法的守门人，总是试图插在你和你的权利之间。这意味着你未能意识到女性也是人，而这种认知源于你接触过（以及没有接触过）的书籍和电影，以及来自你周围的人和系统的直接诱导。艺术至关重要，在许多艺术作品中，强暴被歌为意志的胜利（参见凯特·米勒（Kate
    Millet）1970年的著作《性政治》，书中涵盖了与《时尚先生》（*Esquire*）名单同类的一些男性作家）。这总是意识形态的，它塑造了我们所处的世界。


    调查记者T·克里斯蒂·米勒（T. Christian Miller）和肯·阿姆斯特朗（Ken Armstrong）在2015年12月发表了一篇长文，讲述了警察如何抓捕一名强奸犯（以及他的受害者之一不仅被忽视了多年，还被欺凌说她在撒谎，并随后因撒谎被起诉）。那名强奸犯告诉他们：“变态幻想从小就抓住了我，一直追溯到我看到贾巴中虫奴役莱莉亚公主的时候。”文化塑造了一切。


    但“对于《洛莉塔》（*Lolita*）并‘认同’其中的某个角色，完全是误解了纳博科夫，”我的一位志愿者老师这样说。我觉得这很有趣，于是把它发到了Facebook上，一位友好的自由派男性走过来向我解释，这本书实际上是一个寓言——仿佛我没想过这一点一样。它确实是，但它也是一本关于一个大老头反复侵犯小女孩的小说。然后她哭了。接着另一个自由派男性走过来说：“你似乎并不理解艺术的本质真理。我根本不在乎一本小说是关于一群女性阉割男性的。如果写得好，我想读读它，可能还会读好几遍。”当然，并没有这样这类文学作品，而且如果那位自由派男性被分配去读一本满都是阉割场面、甚至是歌颂阉割场景的书，也许可能会对他产生影响。


    我急于补充道，我不认为在人生的这个阶段我被这些家伙伤害了，我并不觉得可怜。我只是惊讶地看着他们吐出的荒唐言论；这就像我在经营一个实验室，而他们不断提供绝佳的标本。显然，在视平线的彼岸，他们这些人如此激动，以至于像今年布克奖得主马龙·詹姆斯（Marlon
    James）这样一位文学界人物说道：“自由派男性。我可不想阻止你们向新自由主义并最终走向新保守主义的必然进步，让我们快点结束吧。似乎你们中的某些人对瑞贝卡·索尼特（Rebecca
    Solnit）的新作有意见。那是审查，是挑战某人的赚钱机会。这可不是一回事。”


    尽管我很感谢詹姆斯指责他们，但我并没有挑战任何人的赚钱机会。我只是在一篇文章中对一些书籍和一些已故作家的角色发表了幽默的评论，而那篇文章也赞扬和庆祝了许多男性作家（它赞美的人数和指责的人数差不多；你可以认为这双方是平的）。这些家伙显然很不爽，并认为我的观点和声音的存在侵犯了他人的权利。哥们们：审查是当局镇压艺术作品，而不是当有人不喜欢它时。


    我从未说过我们不应该读《洛莉塔》。我读过多次。我开玩笑说应该有一份女性不应该读的书单，因为很多部受推崇的书对我的性别描述相当恶毒，但我也说过：“当然，我相信每个人应该读他们想读的任何书。我只是认为有些书是关于女性为什么是垃圾，或者除了配饰之外几乎不存在，或者本质上是邪恶且空虚的指令。”然后我享受了发表一些关于书籍和作家的观点的乐趣。但这件事我是认真的。当你读了足够的书，书中像你这样的人是被丢弃的、是垃圾、是沉默、缺席的或毫无价值的，这会对你产生影响。因为艺术塑造了世界，因为它至关重要，因为它塑造了我们。或者摧毁了我们。


    ## 饮酒过多对女性健康有许多风险。


    ![](img/d6573876511d332120e83cdfee205779_122_0.png)


    # 消失的犯罪者案

    (2016)


    在侦探小说中，你从无知状态开始，沿着线索走向知识。这些微小的指示最终汇聚成一个启示，让世界恢复正轨并让正义伸张，或者至少提供了一个世界大明的满足感。如果说侦探小说是幻灭的文学，那么存在更多幻觉的文学，旨在欺骗和分散注意力，而不是澄清。


    一个完美的例子是疾病控制中心（CDC）新的且广受嘲笑的饮酒指南。它们就像是一部倒着写的侦探小说——如果你带着怀疑阅读它们，你会对什么是女性、暴力和怀孕是如何发生的以及谁参与了这些事情感到困惑。如果你读得仔细一点，可能会发现……


