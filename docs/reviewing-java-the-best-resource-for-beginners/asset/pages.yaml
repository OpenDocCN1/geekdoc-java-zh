    \ reads “j cannot be resolved to a variable.”\n\n# NESTED LOOPS\n\nWhen dealing\
    \ with loops, it is possible to have loops inside one another, and another, and\
    \ another, etc. These are called nested loops. The rule about this is that the\
    \ inner most loop will be used first, then the one above that, and the one above\
    \ that one, etc... It could be something like this, most generally:\n\n```\nfor(\
    \ loop counter 1; condition(s) 1; counter 1 changes ) {\n//code for the 1st for\
    \ loop\nfor( loop counter 2; condition(s) 2; counter 2 changes ) {\n  //code for\
    \ the 2nd for loop\n  for( loop counter 3; condition(s) 3; counter 3 changes )\
    \ {\n    //code for the 3rd for loop\n  }\n}\n}\n```\n\nSo, here is a short example,\
    \ tracing the values of each variable along the way. Observe this code snippet\n\
    \n```\nfor(int a = 0; a < 3; a++) {\n  for(int b = 0; b < 5; b++) {\n    System.out.println(a\
    \ + \" \" + b);\n  }\n}\n```\n\nHere, the output of the above snippet would be\
    \ the following:\n\n+   00\n01\n02\n03"
