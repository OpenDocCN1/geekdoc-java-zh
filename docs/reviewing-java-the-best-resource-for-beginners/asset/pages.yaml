    This method returns a boolean value (either true or false). If true,

    The String parameter is an exact copy, character for character, of the

    initial String. If false, the argument is not a copy as something

    differs in the String.


    boolean equalsIgnoreCase(String another)

    This method is similar to the regular equals() method with the

    extension of this method not taking into account the case (either upper

    or lower) of BOTH Strings.


    Strings will be used intermittently throughout the book in some example programs
