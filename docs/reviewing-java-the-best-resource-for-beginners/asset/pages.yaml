    A good view of Javadoc is to take a look at the current Java APIs online at https://docs.oracle.com/en/java/


    # TERMINATING PROGRAMS


    To terminate a program earlier than it should be, you can use the exit() method
    in the System library. The syntax will be as follows:


    ```

    System.exit(1);

    ```


    You can of course replace the number 1 with any integer of your choosing. Mostly,
    0 and 1 are used. One is used to denote a problem and signal to a debugger that
    there is an early termination. Zero is used to state that there are no issues.
    Again, it is not a requirement to just use 0 and 1, but rather the most commonly-used
    integers for this purpose.'
