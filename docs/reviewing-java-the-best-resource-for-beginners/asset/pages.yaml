    );\n    }\n} //class\n```\n\n# TYPES OF METHODS\n\nA method that uses instance\
    \ variables of that class is called an instance method. This is the default for\
    \ a method.\n\nA method that uses NO instance variables can be declared static.\
    \ It must NOT use any of them, otherwise there will be a compiler error. The static\
    \ methods tend to compute something from arguments of that method instead of using\
    \ the variables.\n\nHere is an example of a static method:\n\n```\npublic static\
    \ double mean(int n1, int n2, int n3) {\n    int sum = 0;\n    double ans = 0.0;\n\
    \nsum += n1 + n2 + n3;\nans = sum / 3.0;\n\nreturn ans;\n```"
