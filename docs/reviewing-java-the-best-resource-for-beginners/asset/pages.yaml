    #  Conversions


    What happens when someone only knows how to read numbers in a certain way? Most
    everyone knows how to read decimal numbers. So, say we are given a binary number
    or a hexadecimal number that a person cannot read and understand. We can convert
    that given number into the appropriate system using a set of rules.


    The first type of conversion that is easiest to learn is a binary number to a
    decimal number.


    #  Binary to Decimal


    To take a small example, the binary representation of the decimal number 9 is:


    $(1001)_2$


    The algorithm to go about the conversion is:


    +   - Start at the rightmost bit.

    - Take that bit and multiply by $2^n$, where n is the current position beginning
    at 0 and increasing by 1 each time. This represents a power of two.

    - Sum each term''s product until all bits have been used.


    So, using the above methods, here is the resulting conversion to decimal above:


    ```

    $1 * 2^3 + 0 * 2^2 + 0 * 2^1 + 1 * 2^0$

    $8 + 0 + 0 + 1 = (9)_{10}$

    ```


    A shortcut is to avoid counting the 0 bits in the sum. It saves space and time
    when converting, but also remember that you need to increase the exponent for
    the converting--otherwise the number will not be correct.


    Let''s look at another example converting the binary number below:


    $(10110101)_2$


    Using the conversion steps above, and skipping the 0 bits, here is the conversion:'
