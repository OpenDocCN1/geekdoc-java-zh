    Highest Amount: The DD is placed in the first row ($10 space) in any of the categories.


    The player has answered all the questions correctly and then finds the DD to double
    winnings. Add simply any amounts on the board and then double it:


    ```

    ($50 • 6) + ($40 • 6) + ($30 • 6) + ($20 • 6) + ($10 • 5) = ?

