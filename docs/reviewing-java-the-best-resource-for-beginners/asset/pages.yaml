  md: 'There are also times you may want to perform modular division. This can be
    represented as follows:


    ```

    % Modular Division

    The modulo division of two numbers is the remainder when the number on the left
    is divided by the number on the right.

    ```


    Such examples can be:


    ```

    3 % 5

    Evaluates to 3 as 5 goes into 3 ZERO times, with a remainder of 3.


    19 % 10

    Evaluates to 9 as 10 goes into 19 ONE time, with a remainder of 9.


    7 % 3

    Evaluates to 1, since 3 goes into 7 TWO times, with a remainder of 1.


    15 % 1

    Evaluates to 0, since any number MOD 1 is 0 as 1 goes into that fully.


    12 % 0

    This will evaluate to a compiler error, since you cannot divide by 0.


    4 % 4

    This will evaluate to 0, since any number MOD itself goes into fully with no remainder.

    ```


    Now an actual code snippet showcasing modular division:


    ```

    //declares integer variables a and b

    int a, b, mod;


    //assign initial values

    a = 10;

    b = 5;


    //perform the modular division (value of mod would be 0 as 10%5 is 0)

    mod = a % b;

    ```'
