  md: 'In most programs, a loop can be used to do something x number of times. For
    the purpose of code saving it certainly helps and it can also prove quite useful.


    A loop is used for repetition and contains some decision-making. The decision
    need to make is what condition(s) will continue to make this loop run.


    We have already seen a type of loop earlier in this book. While statements are
    types of loops! They will perform a set of actions X number of times, so long
    as the statement logic returns true. But now let''s see other types of loops in
    Java.


    # FOR LOOPS


    Taking this literally, for a certain number of times, perform an action(s). At
    minimum, for a loop will be defined as:


    ```

    for( loop counter; condition(s); counter changes ) {

    //code for the for

    }

    ```


    Let''s break down what each section of the for loop means. Note that there are
    3 sections, each of which (except the last) is separated by a semicolon.


    First, the loop counter. The loop counter is a variable and is used to keep track
    of how many times you want the loop to run. It is always a numeric value such
    as an int, double, or float.


    Second, the condition(s) of the loop. This is where logic comes into play. Say
    you wanted the loop to run 30 times. The counter would have logic that kept track
    of that (counter < 30).


    Finally, the counter changes. Without this, you would have AN INFINITE LOOP! Those
    are quite a pain in the neck because the LOOP WILL NEVER END! Generally, you will
    either increment or decrement a loop counter, but not always. Sometimes, you program
    calls for a loop to have a change by 2, 3, 5, etc. Just use the correct operations.


    # EXAMPLE 1: A Simple Loop'
