  md: '# Constructor


    The constructor for the Stack class creates an empty Stack. This declaration does
    not state data type is being used.


    ```

    Stack s = new Stack();

    ```


    You may also declare type of Stack you are dealing with. Using the rules of Generics,
    we will not use any primitive data type.


    ```

    Stack<Integer> s = new Stack<Integer>();

    Stack<Double> s = new Stack<Double>();

    Stack<String> s = new Stack<String>();

    Etc...

    ```


    # Member Methods


    The methods contained in this Stack class are defined below:


    ```

    boolean empty()

    Returns true if the Stack is empty and false if not.


    peek()

    This method looks at the data at the top of Stack, without removing it.

    Throws an EmptyStackException if the Stack is empty.


    pop()

    This method returns the data from the top of the Stack and removes it from the
    Stack. Throws an EmptyStackException if the Stack is empty.


    push(E item)

    This method adds data to the top of the Stack. It also returns said item.


    int search(Object o)

    This method returns the position of the argument being searched for in Stack.
    If it is not on the Stack, the method returns a value of -1.

    ```


    The below example will showcase java.util.Stack.'
