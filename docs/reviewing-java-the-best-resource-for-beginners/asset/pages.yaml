  md: 'The BigInteger class can also help us find prime numbers with some useful methods.
    Recall that a prime number is a number that is only divisible by 1 and itself,
    otherwise it is a composite number.


    ```

    boolean isProbablePrime(int certainty)

    Returns true if the BigInteger object is most likely a prime number and false
    otherwise (meaning it''s a composite number). If the certainty parameter is <=
    0, true is always returned. If the call returns true, the probability that this
    BigInteger is prime exceeds (1/2^certainty)).

    ```


    # BigInteger nextProbablePrime()


    Returns the next probable prime number that is larger than the BigInteger value.


    For the isProbablePrime() method, let''s see some actual math to prove the validity
    of the method. If you gave a certainty value of 1:


    Result = (1 - (1/2^))

    Result = (1 - (1/2))

    Result = .5 (or 50%)


    If you gave the certainty parameter a value of 2:


    Result = (1 - (1/2^2))

    Result = (1 - (1/4))

    Result = .75 (or 75%)


    Let''s see a value of 5:


    Result = (1 - (1/2^5))

    Result = (1 - (1/32))

    Result = .96875 (or 96.875%)


    The higher value of certainty, the more likely you want the number to be prime.


    Let''s see a short example.


    # EXAMPLE 11: BigInteger Primes'
