  md: '# CHARACTER WRAPPER CLASS


    An important class that contains some useful methods is the character wrapper
    class. There are methods that will check if a character is a digit, letter, etc...
    as well as uppercase, lowercase, etc...


    | boolean isDigit(char c)

    This method will return true if the character argument is a digit 0 to 9. Else,
    it will return false.


    boolean isLetter(char c)

    This method will return true if the character argument is a letter from, EITHER
    UPPERCASE OR LOWERCASE. Else, it will return false.


    boolean isUpperCase(char c)

    This method will return true if the character argument is an uppercase letter.
    Else, it will return false.


    boolean isLowerCase(char c)

    This method will return true if the character argument is a lowercase letter.
    Else, it will return false.


