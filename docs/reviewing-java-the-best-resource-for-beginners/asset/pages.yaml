    \ b[], c[];\n```\n\n# LENGTH METHOD\n\nA method that is built into arrays is called\
    \ the length() method. This will return an integer representing the physical size\
    \ of the array (that DOES NOT MEAN SIZE-1). Let's say we have this declaration:\n\
    \n```\nint[] a = {3,4,5,9,10};\n```\n\nAnd we call the length method when dealing\
    \ with a for loop:\n\n```\nfor(int i = 0; i < a.length; i++)\n    System.out.println(a[i]);\n\
    ```\n\nThe value that will be returned from the length() method is 5, since the\
    \ actual size of the array is 5 (indices 0-4)."
