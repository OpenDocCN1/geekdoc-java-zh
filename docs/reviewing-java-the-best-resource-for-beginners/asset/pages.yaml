  md: "# Inserting at the End (Tail)\n\nHere, this method will handle adding data\
    \ to the end of a list.\n\n```\npublic void addTail(Object d) {\n    Node n =\
    \ new Node(d, null);\n    if (tail == null) head = tail = n;\n    else {\n   \
    \     tail.setNext(n);\n        tail = n;\n    }\n    size++;\n}\n```\n\nFirst,\
    \ declare a temporary Node n, where the data it will contain is the data from\
    \ the argument, and the next field points to null (since this is the tail, the\
    \ next field of the tail will always point to null).\n\nThere are two things that\
    \ can occur: if the tail is null, the list itself is empty, so, therefore, make\
    \ the head and tail point to the newly created node. Otherwise, the current tail's\
    \ next is the newly created Node n, and the tail points to that same node. The\
    \ last thing to do is increase the size.\n\n# Deleting the Head\n\nThe first of\
    \ the removal method's is to remove the head of a list. Here, there is a return\
    \ type of the method you might want to print the data out.\n\n```\npublic Object\
    \ removeHead() {\n    if (empty()) throw new RuntimeException(\"Empty List\");\n\
    \n    //temporary node is the current head\n    Node n = head;\n    //new head\
    \ node is the current head's next\n    head = head.getNext();\n\n    if (head\
    \ == null) tail = head;\n    size--;\n    return n.getData();\n}\n```"
