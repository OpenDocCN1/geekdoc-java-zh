  md: 'In Java, an exception can be thought of as an error when a program is being
    run. There are numerous types of exceptions that may occur.


    # TYPES OF EXCEPTIONS


    An exception can be checked or unchecked. If the exception is checked, you are
    able to recover from the mistake and possibly continue the program. An example
    of this may be a user entering the wrong name of a text file. A good program will
    catch the exception and ask the user to enter the name again. All of these checked
    exceptions do not need to be caught (see try/catch below).


    If the exception is unchecked, there is no need for a try/catch block. There are
    two subcategories of unchecked exceptions:


    # Runtime Exceptions


    These occur when the program has a logical error or bug that you did not anticipate
    when programming. An example of a Runtime Exception can be the user entering a
    file name, and causing the program to open a null file.


    # Error Exceptions


    These will not be discussed here, but are caused by an error with the hardware
    of a computer.


    # LIST OF EXCEPTIONS


    There are many definitions of exceptions in Java (too many, in fact, to list them
    all). Below are the most common types of exceptions that a programmer may see.
    Next to the exception is the type of exception it is:


    | IllegalArgumentException (Runtime) | An exception to handle a problem with method
    arguments or command-line arguments. One way to think of this is if the user does
    not give a needed command-line argument or the argument in method is not in a
    certain range. This is the appropriate exception to be thrown. |

    | NumberFormatException (Runtime) | This is an exception to handle a problem when
    formatting a number(s). This is commonly seen when using any of the parseXXX methods
    of a certain wrapper class. Say that your string is "1234ff" and you call |'
