  md: "# size() & empty()\n\nAs seen before creating our SimpleStack, these methods\
    \ will check for the queue being empty and for the size of the queue.\n\n```\n\
    public int size() { return size; }\npublic boolean empty() { return size == 0;\
    \ }\n```\n\n# Adding Data (Enqueue)\n\nThis method will add data to the queue.\
    \ This method will first check the size, and if it is equal to the capacity, a\
    \ RuntimeException is thrown, since the queue would be full. Otherwise, the data\
    \ is added to the rear of the queue. If after adding, the rear is the capacity,\
    \ set the rear to 0, since you will not be adding any data to the queue. Finally,\
    \ increment the size.\n\n```\npublic void enqueue(Object x) {\n    if (size()\
    \ == capacity)\n        throw new RuntimeException(\"Queue Full\");\ndata[rear++]\
    \ = x;\n    if (rear == capacity) rear = 0;\n    size++;\n}\n```\n\n# Removing\
    \ Data (Dequeue)\n\nThis method will remove data from the queue. The return type\
    \ is not void, since you want to extract the data from the queue. First, this\
    \ methods checks if the queue is empty() and if so, throws a RuntimeException,\
    \ since you cannot remove data from an empty queue. Next, it places the current\
    \ front data in an answer variable and checks if the front is at capacity. If\
    \ so, set the front to 0, since you have no more data to remove. Finally, decrement\
    \ the size and return the data.\n\n```\npublic Object dequeue() {\n    if (empty())\
    \ throw new RuntimeException(\"Queue Empty\");\n    Object answer = data[front++];\n\
    \    if (front == capacity) front = 0;\n    size--;\n}\n```"
