    # **Binary to Hexadecimal**


    An easy conversion to binary is to hexadecimal. The hexadecimal number system
    uses the digits 0 to 9 and A, B, C, D, E, F. And, since the hexadecimal system
    is a power of 2 (2^4), we can take a binary number in groups of 4 and use the
    appropriate hexadecimal digit in its place.


    The steps for doing so are simple. Begin at the rightmost 4 bits. If there are
    not 4 bits, pad 0 to the left until you hit 4. Repeat the steps until all groups
    have been converted.


    An example is below:


    Take the binary number (1000101). Using the above steps, here is the conversion:


    ```

    0100 | 0101

    4 | 5

    ```


    Note that we needed to pad a 0 to the left.


    # **Answer: (45)16**


    Take the binary number (11101011). Using the same steps, here is the conversion:


    ```

    1110 | 1011

    E | B

    ```


    # **Answer: (EB)16**


    The best advice is to practice each conversion many times with different numbers.'
