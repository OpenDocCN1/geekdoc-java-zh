    1 | 2 | 3 | 4 | 5 | 6 | 7

    001 | 010 | 011 | 100 | 101 | 110 | 111

    ```


    Answer: (001010111010101110111)₈


    # Decimal to Octal


    Similar to the decimal to binary method, you must divide each number by 8 and
    record the remainder. This continues until the number cannot be divided into anymore.


    Take the decimal number (18)��₀ and convert it to octal:


    ```

    18 / 8 = 2   2

    2 / 8 = 0   2

    ```


    Answer: (22)₈


    Take the decimal number (46)��₀ and convert it to octal:


    ```

    46 / 8 = 5   6

    5 / 8 = 0   5

    ```


    Answer: (56)₈'
