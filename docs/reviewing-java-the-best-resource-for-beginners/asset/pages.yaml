  md: 'By definition, an array is collection of data that is side by side in memory.
    Like any variable, an array must be declared before it is used. There are also
    numerous types of arrays.


    In Java, an array is treated as an object. It can require the keyword new to create
    an array of a certain type. An array is also an ordered list of values.


    # ONE-DIMENSIONAL ARRAYS


    In general, this is how to declare a one-dimensional array:


    ```

    type name[] = new type[ size ];

    ```


    Where in the above, type is the appropriate data type; name is the name of the
    array; and size is how many pieces of data you want inside it.


    ```

    int myarr[] = new int[5];

    ```


    The above would declare an array of 5 integers. In memory, here it is what it
    would look like:


    | 0 | 1 | 2 | 3 | 4 |

    |---|---|---|---|---|


    The numbers above the cells are the index. The index is where particular piece
    of data is located. All array indices begin at zero and end at the size-1. So
    above, the capacity is 5, but the indices range from 0 to 4.


    Say we wanted to fill the array with numbers. Here is a code snippet using a for
    loop:


    ```

    for(int i = 0; i < 5; i++)

    myarr[i] = i * 2;

    ```


    This loop will place doubled value of the loop counter inside the array.'
