  md: "To start, if the list is empty, throw a RuntimeException to let the user know\
    \ they cannot remove data from an empty list. Next, the temporary Node n points\
    \ to the current head. The head node will then point to its current next node,\
    \ advancing the head by one. If the head is now null, make the tail point to the\
    \ head, as this means the list is empty. Decrease the size and simply return the\
    \ data from the old head node, held in the temporary Node n.\n\n# Deleting the\
    \ Tail\n\nThe next removal method is to remove the tail of a list. Here, there\
    \ is a return type of the method you may want to print the data on screen.\n\n\
    ```\npublic Object removeTail() {\n    if (empty()) throw new RuntimeException(\"\
    Empty List\");\n\n    //start at the head\n    Node n = head;\n\n    //while you\
    \ aren't at the tail node, keep going\n    while(n.getNext() != tail) {\n    \
    \    n = n.getNext();\n    }\n\n    //tail is now the found node\n    tail = n;\n\
    \n    //the tail has no next so set to null\n    tail.setNext(null);\n\n    //decrease\
    \ size\n    size--;\n\n    return n.getData();\n}\n```\n\nAgain, we need to check\
    \ if the list is empty. If so, throw a RuntimeException to let the user know.\
    \ Otherwise, we need to navigate to the item in the list that is just before the\
    \ current tail node. Our temporary Node n will begin at the current head node,\
    \ and traverse the list until you arrive at the correct node (previous to the\
    \ tail). Once there, the current tail node is the Node n. We then need to set\
    \ the next node of the tail to null, since you are at the end of the list. Decrease\
    \ the size and then return the data."
