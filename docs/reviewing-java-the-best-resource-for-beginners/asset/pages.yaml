  md: 'The array is accessed with the [] **operator**. What goes inside of the brackets
    is the index of the array. The code below is incorrect and a common mistake made
    by programmers:


    ```

    for(int i = 1; i <= 5; i++)

    myarr[i] = i * 2;

    ```


    The reason it is wrong is that there is no index 5 in the array we declared. You
    would get something called an **exception**, specifically ArrayIndexOutOfBounds
    Exception (see Chapter 15), which is the Java way of saying that you are out of
    bounds in the array. The above is also ignoring 0.


    Here are just some more declarations so you can see how to do it in Java:


    ```

    int heights[] = new int[5];


    float f[] = new float[15];


    char alphabet[] = new char[26];


    boolean bool[] = new boolean[45];


    String str[] = new String[10];

    ```


    You can also declare an array and initialize it at the same time with the use
    of what''s called an **initializer list**. This will not involve the new operator
    and can be seen like the following:


    ```

    int heights[] = {1, 2, 3, 4, 5};

    This would declare and initialize an integer array of size 5,

    containing indices 0 - 4.


    char alphabet[] = {''A'', ''B'', ''C'', ''D'', ''E''};

    This would declare and initialize a character array of size 5,

    containing indices 0 - 4.


    boolean bools[] = {true, false, false, false, true, true, true};

    This would declare and initialize a boolean array of size 7, containing

    indices 0 - 6.


    String str[] = {"One", "Two", "Three", "Four"};

    ```'
