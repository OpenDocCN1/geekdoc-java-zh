    # Decimal to Binary


    A more annoying and longer way of converting numbers is the decimal system to
    binary system. The best way of doing this is to follow these steps:


    +   a) Divide the remainder number by 2.

    b) Take the remainder and record it on the side.

    c) REPEAT UNTIL the decimal number cannot be divided into anymore.

    d) With the bits, record them in order from right to left, as that will be the
    number in two base.


    The example here with the decimal number 8 is a good way to start:


    ```

    8 / 2 = 0

    4 / 2 = 0

    2 / 2 = 0

    1 / 2 = 0

    ```


    Answer: (1000)_2


    To check the result, use the previous method of converting from binary to decimal:


    ```

    1 * 2^3 = (8)_{10}

    ```


    This does work, and is is an acceptable conversion.


    Let’s see another example using (125)_{10}


    ```

    125 / 2 = 1

    62 / 2 = 0

    31 / 2 = 1

    15 / 2 = 7

    ```'
