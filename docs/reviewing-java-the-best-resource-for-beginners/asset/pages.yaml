    \ block. This form is defined below:\n\n```\ntry{\n    //code here\n}catch(ExceptionName\
    \ varName) {\n    //code to handle exception here\n}finally{\n    //code here\n\
    }\n```\n\nWhat the finally section will do is contain some block of code that\
    \ will execute, whether or not an exception is thrown. Say that there is an IllegalArgumentException\
    \ thrown; the code for the catch block will execute, but immediately after that,\
    \ the finally code will execute. This is one way of continuing a program.\n\n\
    There is also a global Exception object that will catch any type of exception\
    \ when the program is run. That can be coded in a try/catch block or try/catch/finally\
    \ block as such:\n\n```\ntry{\n    //code here\n}catch(Exception varName) {\n\
    \    //code to handle exception here\n}\ntry{\n    //code here\n}catch(Exception\
    \ varName) {\n    //code to handle exception here\n}finally{\n    //code here\n\
    }\n```\n\nSome examples will help clarify exception handling."
