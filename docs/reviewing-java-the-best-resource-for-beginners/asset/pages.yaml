    \ methods called talk, both of which return void, and are\nnamed the same. The\
    \ only difference is the arguments of these methods. This is allowed\nin Java.\
    \ We have now overloaded the talk() method.\n\nAnother example may be as follows.\
    \ If we wanted to find the average of numbers in\nprogram. We can write a method\
    \ called avg(that) will return the number average.\nWe also wanted there to be\
