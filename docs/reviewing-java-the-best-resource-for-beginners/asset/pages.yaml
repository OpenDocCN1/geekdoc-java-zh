  md: 'The compareTo() method compares two Strings lexicographically, via its Unicode
    values (or ASCII values (see Appendix A)). The method returns an integer value
    that is negative if the primary String is lexicographically before the argument
    String; 0 if they are exactly equal; and a positive value if the primary String
    is lexicographically after the argument String.


    ```

    int compareIgnoreCase(String another)

    This method is similar to the above compareTo() method with the exception of this
    method not taking into account the case (either upper or lower) of BOTH Strings.

    ```


    Let''s see a short example of the above. Say that we have using the following
    code snippet:


    ```

    String word1 = "Orange", word2 = "Alexander", word3 = "Alex";

    System.out.println(word1.compareTo(word2));

    System.out.println(word2.compareTo(word3));

    System.out.println(word3.compareTo(word2));

    ```


    The output would be:


    +   14

    5

    -5


    For the first line of output, lexicographically, the characters differ in the
    first position. It compares O and A, which have a difference of 14. That means
    that Orange comes before Alexander, as the value is positive.


    For the second line of output, the characters differ in the fifth position. In
    the case one String is larger than the other, the shorter String, lexicographically,
    comes before the longer String.


    For the final line of output, it is the reverse of the above, since the shorter
    String is the primary String being compared to the longer one.


