  md: '# Relational/Equality Operators


    == Logical Equals

    Both sides of a statement must have the EXACT same value in order to return an
    overall value of true.


    =! Logical Not

    Both sides of a statement must have DIFFERENT values in order to return an overall
    value of true.


    > Logical Strictly Greater Than

    A value on the left hand side of the operator must be strictly greater than the
    value on the right hand side of the operator in order to return an overall value
    of true.


    < Logical Strictly Less Than

    A value on the left hand side of the operator must be strictly less than the value
    on the right hand side of the operator in order to return an overall value of
    true.


    >= Logical Greater Than or Equal To

    A value on the left hand side of the operator can be greater than equal to the
    value on the right hand side of the operator in order to return an overall value
    of true.


    = Logical Less Than or Equal To

    A value on the left hand side of the operator can be less than or equal to the
    value on the right hand side of the operator in order to return an overall value
    of true.


    Such examples can be:


    ```

    (7 == 5)

    Evaluates to FALSE as 7 does not equal the value of 5.


    ((4 + 5) == (5 + 3 + 1))

    Evaluates to TRUE, since 9 is equal to 9. This performs the operations inside
    the parentheses first and then evaluates the logic.


    (5 % 2 == 1)

    Evaluates to TRUE, since 5 MOD 2 is 1. This first evaluates the modular division
    and then evaluates the logic.


    (9 > 12)

    Evaluates to FALSE, since 9 is not strictly greater than 12.

    ```'
