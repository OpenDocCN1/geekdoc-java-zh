    # Generate Numbers


    Contained within the Random object you create are a list of methods that will
    generate the pseudorandom numbers. They are defined below:


    ```

    int nextInt()

    This method will return a pseudorandom integer.


    int nextInt(int range)

    This method will return a pseudorandom integer in the range 0 to range-1. This
    is also very similar to array indices, as they go from o to size-1.

    ```


    Say that you wanted to generate a random value from 1 to 10. This can be accomplished
    as:


    ```

    int num = r.nextInt(10) + 1;


    double nextDouble()

    This method will return a pseudorandom double precision value.


    float nextFloat()

    This method will return a pseudorandom floating point value.


    long nextLong()

    This method will return a pseudorandom long integer.


    boolean nextBoolean()

    This method will return a pseudorandom boolean value.

    ```


    Some example programs are below, showing some of the above methods and possible
    outputs.


