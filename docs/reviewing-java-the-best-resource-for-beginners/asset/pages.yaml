    \ <= 0)\n            throw new RuntimeException(\"Size must be at least 1\");\n\
    \        data = new Object[size];\n        top = -1;\n        max_size = size;\n\
    \    }\n}\n```\n\nThe top variable is set to -1 in both constructors, since there\
    \ is no data in the stack.\n\n# Size() & empty()\n\nThe two auxiliary methods\
    \ are shown here, which return the current size of the stack, as well as telling\
    \ us if the stack is empty.\n\n```\npublic int size() { return top + 1; }\npublic\
    \ boolean empty() { return top == -1; }\n```\n\n# Adding (pushing) Data\n\nThe\
    \ push() method will simply check if the size of the stack is at its maximum,\
    \ and if so, throw a new RuntimeException, since we can't add data to a full stack.\
    \ Otherwise, it simply adds the data to the stack at the appropriate index."
