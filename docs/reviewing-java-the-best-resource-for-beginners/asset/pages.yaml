    # PRACTICAL EXAMPLE: STUDENTS’ BIRTHDAYS


    Pretend you are a teacher and have a class of 10 students. You want to encourage
    class morale, and celebrate birthdays when they come up. Let’s write a program
    that performs the following tasks:


    +   1) Reads from a text file 10 lines of data, each representing a student’s
    information in the following format of name, birthday and gpa:

    Alex1986-09-01/3.5

    2) The program will load all data into an ArrayList of Student objects.

    3) Inside the Student object will be instance variables for name, birthday, gpa
    and birth date of the week.

    4) Upon loading the data, the program performs some error checking on the birthday
    and gpa.

    a. The year specified must be between 1980 and 2000. If it’s out of range, a YearException
    is thrown and message printed to the console.

    b. The gpa can only be between 0.0 and 4.0. If it’s out of range, a GPAException
    is thrown and message printed to the console.

    5) If any above error exist, the program throws the respective Exception, but
    continues processing the data.

    6) Once all data is loaded from the file, we want to print (to the console) the
    following (in the order):

    a. The student with the highest GPA.

    b. The day of the week each student was born.

    c. The current age of the student based on the date of 2019-01-01.'
