  md: "In our Java adventures thus far, we have learned about methods and how they\
    \ are utilized. We wrote methods to perform arithmetic operations, to find the\
    \ largest or smallest values, or even to determine if an element is contained\
    \ in an array or object. Each of those methods uses a certain data type, whether\
    \ its primitive or object.\n\nLet's say that we wanted to find the smallest element\
    \ in an array, and write a method to do so. We would have to write a method for\
    \ 5 different data types (int, short, long, float and double) each specific. What\
    \ if I told you could write one method to handle that task, and not worry about\
    \ data types? It's possible with the help of what's called a generic method.\n\
    \n# GENERIC METHODS\n\nThere are some rules about declaring a generic method:\n\
    \n+   - All generic method declarations have a type parameter that is delimited\
    \ by angle brackets <>, and precedes the methods return type.\n- The methods'\
    \ parameters and the method return type can be of said type parameter.\n- A generic\
    \ method's body is declared and utilized like that any other method.\n- The type\
    \ parameters for a generic method can only be of the wrapper class or custom object,\
    \ NOT a primitive data type.\n\nSo most generally, a generic method is declared\
    \ as such:\n\n```\n[identifier] < T > [return type] method_name ( arguments )\n\
    ```\n\nWhere in above, [identifier] can be either public, private, protected or\
    \ nothing; <T> is the type parameter being used for the method; return_type is\
    \ the return type of the method (can be void); method_name is a useful name for\
    \ the method; and arguments are any parameters you need to pass for the method.\n\
    \nSome examples will clear this up.\n\n# EXAMPLE 1: Printing Elements in an Array\n\
    \n```\npublic class Example1{\n    private static <T> void printElements(T[] arr)\
    \ {\n```"
