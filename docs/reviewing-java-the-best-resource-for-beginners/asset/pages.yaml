  md: '# APPENDIX B

    Number Conversions


    There are many number systems in the world of computer science and mathematics.
    Some systems include the decimal system (base ten), octal system (base eight),
    binary system (base two), and hexadecimal system (base sixteen).


    The below chart can certainly come in handy as these are most commonly seen when
    converting numbers. The table is representing the first 11 powers of 2, which
    includes 2 to the 0th power.


    | Power | Result | Binary form |

    | --- | --- | --- |

    | 2^0 | 1 | 1 |

    | 2^1 | 2 | 10 |

    | 2^2 | 4 | 100 |

    | 2^3 | 8 | 1000 |

    | 2^4 | 16 | 10000 |

    | 2^5 | 32 | 100000 |

    | 2^6 | 64 | 1000000 |

    | 2^7 | 128 | 10000000 |

    | 2^8 | 256 | 100000000 |

    | 2^9 | 512 | 1000000000 |

    | 2^10 | 1024 | 10000000000 |


    # Representations


    Number systems each have different representations. For example, each number we
    written out is implied to be in decimal, unless otherwise stated. For example,
    we could write the following numbers in this way:


    +   - (9)_10

    - (10)_10

    - (11)_10

    etc...


    Each number system has what is called a base. As mentioned earlier, decimal is
    a system of base 10; octal is a system of base 8; binary is a system of base 2;
    and of course, hexadecimal is a system of base 16. The above numbers in the parentheses
    show the'
