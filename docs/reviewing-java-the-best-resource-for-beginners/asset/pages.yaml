    \ another type of control statement in Java called a switch/case block. This is\
    \ a different version of an if statement.\n\nHere is what a general switch case\
    \ block looks like:\n\n```\nswitch( variable ) {\n  case value:\n    //code for\
    \ value\n    break;\n  default:\n    //code for default\n    break;\n}\n```\n\n\
    Where in the above, variable is a variable of an integral type (int), value is\
    \ the value of the variable at that point, and default is an action to take place\
    \ when, and only when, all above cases are FALSE. There is no limit to how many\
    \ cases you can have.\n\nA break must occur after the actions for your case are\
    \ completed, otherwise the program will not stop going to the next case(s) until\
    \ it sees a break.\n\n# ## EXAMPLE 9: Even/Odd Detection Switch\n\nRemembering\
