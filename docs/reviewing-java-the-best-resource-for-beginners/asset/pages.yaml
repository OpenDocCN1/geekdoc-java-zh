  md: "By definition, a recursive method is a method that calls itself until a certain\
    \ condition is met. That condition is called the base case.\n\nThe best practice\
    \ of recursion is to draw right in, see a lot of examples, and practice.\n\n#\
    \ # RECURSIVE TRACING\n\nWhen recursive methods are being called, they are placed\
    \ on what is called the runtime stack of a program. Just the same as a stack of\
    \ dishes, the item on the top is the item that is accessed. With a program, it\
    \ is the same idea that the most recent call to the stack (or the top of the stack)\
    \ is the currently active method call. Let's see a small example.\n\n# # EXAMPLE\
    \ 1: Recursive Printing\n\nHere is an example that will recursively print out\
    \ the numbers from 1 to 5.\n\n```\npublic class Example1{\n    public static void\
    \ Print(int n) {\n        //base case\n        if (n < 1) return;\n\n        Print(n-1);\
    \ //recursive call\n        System.out.println(n);\n    } //Print\n\n    public\
    \ static void main(String args[]) {\n        Print(5);\n    } //main\n} //class\n\
    ```\n\nThe Print() recursive method in the above program will accept an integer\
    \ argument. The base case of the method will be when the argument is 0, since\
    \ we want a number from 1 to 5. It will simply return to the last method call.\n\
    \nThen, if the base case is false, the method is called again with 1 less for\
    \ the argument value. If you did not do this, the recursion would be infinite."
  merge: -1
  pgno: 175
- img_proc: true
  md: "Finally, it will simply output that current value of the argument when the\
    \ recursive calls are finished.\n\nHere is the trace for the above printing example.\
    \ It shows the call of the method and the value of n.\n\n```\nPrint (5)\nPrint\
    \ (4)\nPrint (3)\nPrint (2)\nPrint (1)\nPrint (0) ← base case here.\nPrint (1)\
    \ ← prints 1\nPrint (2) ← prints 2\nPrint (3) ← prints 3\nPrint (4) ← prints 4\n\
    Print (5) ← prints 5\n```\n\nAnother example is to print out a triangle of stars\
    \ recursively:\n\n# EXAMPLE 2: Recursive Triangle of Stars I\n\n```\npublic class\
    \ Example2{\n    public static void Triangle(int x) {\n        //base case\n \
    \       if (x <= 0) return;\n\n        //recursive call\n        Triangle(x -\
    \ 1);\n\n        //print the stars with a loop\n        for (int i = 1; i <= x;\
    \ i++) {\n            System.out.print(\"**\");\n        }\n        System.out.println();\n\
    \    } //Triangle method\n\n    public static void main(String args[]) {\n   \
    \     Triangle(7);\n    } //main\n}//class\n```"
