  md: "# Constructor\n\n```\npublic LinkedList() {\n    head = tail = null;\n    size\
    \ = 0;\n}\n```\n\nOur constructor simply sets the head and tail nodes to null,\
    \ and the size to 0, since there is no data added yet.\n\n# size() & empty()\n\
    \nThese methods will check for the list empty, and for the current size of the\
    \ list.\n\n```\npublic int size() { return size; }\npublic boolean empty() { return\
    \ size == 0; }\n```\n\n# Inserting at the Start (Head)\n\nTo insert data to the\
    \ beginning of the list (the head node), we have the following method:\n\n```\n\
    public void addHead(Object d) {\n    Node n = new Node(d, head);\n    head = n;\n\
    \    size++;\n    if(tail == null) tail = head;\n}\n```\n\nWe declare a temporary\
    \ Node n. The new nodes data will be the data from the argument. The node it will\
    \ point to next is the current head node. Finally, assign the head node temporary\
    \ node n, and increase the size. If you do not assign anything to the head node,\
    \ you would not have added anything to the list.\n\nSome housekeeping applies\
    \ to the tail node. If the tail is null, simply make the tail point to the head\
    \ node. This would be the case if the list had 0 elements."
