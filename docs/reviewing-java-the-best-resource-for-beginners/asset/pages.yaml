  md: 'Let''s breakdown why that is. Firstly, we create each object, giving it no
    initial value for $a$, but giving initial values for objects $b$ and $c$. Currently,
    here is the breakdown of each variable in each object:


    ```

    a n1 = 0 n2 = 0

    b n1 = 2 n2 = 2

    c n1 = 5 n2 = 3

    ```


    We print out the returned result from $mysteryA()$ of the $a$ object. That method
    simply returns the product of $n1$ and $n2$. Since they are both 0, it returns
    0, and prints value to the console.


    Next, we call the $mysteryB()$ method of the $b$ object. Here, that method gets
    the current value of $n1$, and adds it to the result of the $mysteryA()$ method
    it inherited. The current value of $n1$ is 2. The $mysteryA()$ method will return
    $2 * 2$, or 4. The final return value of $mysteryB()$ is 6. That result is printed
    to the screen.


    Next, we call the $mysteryC()$ method of the $c$ object. Here, that method gets
    the current value of $n2$ and adds it to the result of the $mysteryB()$ method
    it inherited from class B. The current value of $n2$ is 3. The $mysteryB()$ method
    will get the current value of $n1$, which is 5, and add it to the result of $mysteryA()$.
    The $mysteryA()$ returns $n1*n2$, or $5*3$, which is 15. Going back to $mysteryB()$,
    it returns 15, plus the current value of $n1$, which is 5, for a result of 20.
    Now heading back to $mysteryC()$, it adds the current value of $n2$ to result
    of 20, for a value of 23. That result is printed to the screen.


    We then make some changes to the value of some variables in each object, via the
    inherited $setN1()$ or $setN2()$ methods. The updated value of each variable is:


    ```

    a n1 = 2 n2 = 5

    b n1 = 5 n2 = 2

    c n1 = 5 n2 = 5

    ```


    Rerun the trace through each method with the above current values to get the final
    three lines of output.


    Dizzying yes, but this shows that classes inherit methods from classes that inherited
    methods.'
