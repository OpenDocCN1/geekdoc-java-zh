  md: "# DOCUMENTATION & JAVADOC\n\nAn important part of programming is documentation.\
    \ Without it, you can run into a lot of trouble when trying to debug a program.\
    \ There are three types of documentation for a program in Java; in-line comments,\
    \ block comments and Javadoc comments.\n\nThe first type of comment is an in-line\
    \ comment that may look like this:\n\n```\npublic static void main(String args[]){\n\
    \  //check arguments here\n}\n```\n\nThe in-line comment is denoted by the two\
    \ forward slashes. Anything appearing on that line past those two markers is ignored\
    \ by the compiler.\n\nThe second type of comment is the block comment that may\
    \ look like this in a code snippet:\n\n```\npublic static void main(String args[]){\n\
    \  /*\n   *check for arguments here\n  */\n}\n```\n\nNote that to START the block\
    \ comment, there is the /* while to END the block comment, there is the /*. They\
    \ are different from each other so be careful.\n\nThe final piece of commenting\
    \ is Javadoc. The Javadoc comments are written thus:\n\n```\n/**\n  * Javadoc\
    \ writing here.  The Javadoc will explain\n  *  and document a method.\n  */\n\
    public static void main(String args[]){\n  //code here for main\n}\n```"
  merge: -1
