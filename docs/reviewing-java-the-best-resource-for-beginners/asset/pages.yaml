- img_proc: true
  md: 'When dealing with any kind of array, you may want to, in some way, sort the
    data they contain. You may sort them from lowest value to highest value (known
    as ascending) or from highest value to lowest value (known as descending).


    There are many kinds of sorting techniques that can be used, but the three that
    will be discussed here: Selection Sort, Bubble Sort, and Count Sort.


    # SELECTION SORT


    The algorithm for Selection Sort is:


    +   1. Search through each element.

    2. Find the lowest or highest values.

    3. Swap the elements.

    4. REPEAT UNTIL FULLY SORTED.


    Let''s say that you have an array of integers set up as follows:


    ```

    arr[] = {12, 9, 8, 3, 14};

    ```


    And you want to sort them in ascending order. Let''s step through this one by
    one:


    You want to start the search with the first element, in which this case is index
    0. You have to compare it with the remainder of the array, which in this case,
    begins with index 1. The current lowest value will be the value in the array at
    index 0.


    ```

    arr[] = {12, 9, 8, 3, 14};      Lowest=12      Current=9

    Index_lowest=0

    ```


    If the current value is less than the lowest value, store the index of the current
    value.


    ```

    arr[] = {12, 9, 8, 3, 14};      Lowest=12      Current=9

    Index_lowest=1 (new lowest index since 9 < 12)

    ```


    Repeat for the rest of the elements of the array:


    ```

    arr[] = {12, 9, 8, 3, 14};      Lowest=9      Current=8

    Index_lowest=2

    ```


    ```

    arr[] = {12, 9, 8, 3, 14};      Lowest=8      Current=3

    Index_lowest=3

    ```'
