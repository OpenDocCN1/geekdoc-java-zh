  md: 'In Java, a variable will be used to hold some form of data. That data can be
    of any type, such as an integer, decimal or character, or a custom data type (we
    will explore that later in the book), just to name a few.


    While variables hold some form of data, we want to be able to work with them in
    a program, or “operate” on them as it’s called. By operating on variables, you
    can assign information/data to them, modify data, perform mathematical operations,
    perform logical operations -- basically anything you need to do run your program.


    # DECLARING VARIABLES


    There are numerous ways to use and declare variables in Java. Here is one of the
    ways to declare a variable:


    ```

    [identifier] type var_name;

    ```


    Where in the above, identifier can be public, private, protected or nothing (see
    later); type is the data type of the variable and var_name is a useful name of
    the variable.


    You can also declare a variable and assign a value to it. This is called initializing
    the variable.


    ```

    [identifier] type var_name = initial_value;

    ```


    Where in the above, identifier can be public, private, protected or nothing (see
    later); type is the data type of the variable; var_name is a useful name of the
    variable; initial_value is the default value given to a variable.


    # DATA TYPES


    While we now know how to declare a variable, we need to know both the different
    data types, as well as how to operate on them. The below chart consists of the
    primitive data types used in Java (note: String is not primitive, but will be
    used frequently throughout the book).'
  merge: -1
  pgno: 16
