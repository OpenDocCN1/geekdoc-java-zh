  md: "```\npublic void push(Object x) {\n    if (size() == max_size)\n        throw\
    \ new RuntimeException(\"Stack Full\");\n    data[++top] = x;\n}\n```\n\n# Removing\
    \ (popping) Data\n\nThe pop() method will check if the stack is empty, and throw\
    \ a RuntimeException if, since we cannot remove data from an empty stack. Otherwise,\
    \ it will return the data at the top of the stack, and decrement the top variable,\
    \ since that piece has been removed.\n\n```\npublic Object pop() {\n    if (empty())\
    \ throw new RuntimeException(\"Stack Empty\")\n    return data[top--];\n}\n```\n\
    \n# Peeking at Data\n\nThe peek() method will simply return the data on the top\
    \ of the stack without changing the position in the stack.\n\n```\npublic Object\
    \ peek() {\n    if (empty()) throw new RuntimeException(\"Stack Empty\")\n   \
    \ return data[top];\n}\n```\n\n# Printing the Stack\n\nWe will overload the toString()\
