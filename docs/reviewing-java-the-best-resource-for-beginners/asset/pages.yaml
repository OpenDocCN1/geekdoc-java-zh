    # JAVA.UTIL.LINKEDLIST


    Also contained in the java.util library is a LinkedList, which functions in its
    capacity as a doubly linked list.


    In order to use this, you must import it from the java.util library:


    ```

    import java.util.LinkedList;

    ```


    # Constructors


    The constructors for the LinkedList class will create an empty list, or create
    one where you can specify the elements with the use of a Collection.


    ```

    public LinkedList()

    Default constructor, which creates an empty list.


    public LinkedList(Collection<? extends E> c)

    The constructor will create a list containing the elements of

    sspecified Collection.

    ```


    You may also declare what type of LinkedList you are dealing with. Using the rules
