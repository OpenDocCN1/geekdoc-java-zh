    \ Fruit{\n  //code here\n}\n\npublic class Wheel extends Car{\n  //code here\n\
    }\n\npublic class Yankees extends Baseball{\n  //code here\n}\n\npublic class\
    \ Cat extends Animal{\n  //code here\n}\n\nEtc...\n```\n\nIn human terms, an apple\
    \ is a type of fruit; a wheel is part of a car; the Yankees are a baseball team;\
    \ and a cat is an animal. All are pieces of a larger entity.\n\n# SUPER KEYWORD\n\
    \nThe keyword super will be used when referring to the super class (or parent\
    \ class) of an object. This can reference the constructor when used like this:"
