    # FOR EACH LOOPS


    There is a variation of a for loop called a foreach loop (also called an enhanced
    for loop), that will iterate through arrays or collections of data (Collections
    are discussed in Chapter 19). The general declaration of a foreach loop is:


    ```

    for (type var_name : array) {

    //code

    }

    ```


    Where in the above, type is the data type of var_name; var_name is a useful name
    of the iterator; and array is the actual array you are going to iterate through.
    It is important to note that the iterator data type must match the data type of
    the array.


    foreach loops iterate through each item in the given array or Collection. It stores
    each item in the variable you define (var_name in the above) in the foreach loop
    and executes the code in the body of the foreach loop. Foreach loops only work
    with one-dimensional arrays.'
