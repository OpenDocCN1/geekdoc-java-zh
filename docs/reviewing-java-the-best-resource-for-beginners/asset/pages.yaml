    \ exception to the console, you see what type of exception is thrown, and a brief\
    \ message as to what the error is.\n\n# DEFINING EXCEPTIONS\n\nUsing the power\
    \ of inheritance, you can create your own kind of exceptions. Say that you have\
    \ a program that relates to both Graduate and Undergraduate students in college.\
    \ More specifically, the names of the students are being read from a text file.\n\
    \nInstead of throwing a general IllegalArgumentException, which may apply to either\
    \ the Graduate or Undergraduate classes, you may want to create a useful exception\
    \ called GradStudentException or UnderGradStudentException; both of which are\
    \ subclasses of the IllegalArgumentException.\n\nBelow is the definition, in general,\
    \ of your own exceptions:\n\n```\npublic class NewExceptionName extends CurrExceptionName{\n\
    \    public NewExceptionName(String gripe){\n        super(gripe); //super class:\
    \ CurrExceptionName\n    }\n}\n```\n\nWhere in the above, NewExceptionName is\
    \ your own name for an exception (such as GradStudentException); and CurrExceptionName\
    \ is the name of a current exception (such as IllegalArgumentException). There\
    \ is also the constructor for the new exception to allow a String argument to\
    \ describe the problem. This is passed to the super class.\n\nBelow is a new exception\
    \ in regard to the student program before:\n\n```\npublic class GradStudentException\
    \ extends IllegalArgumentException{\n    public GradStudentException(String gripe){\n\
    \        super(gripe);\n    }\n}\n```"
