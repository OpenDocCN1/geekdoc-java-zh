  md: "That problem can be solved by bounding our type parameters. When declaring\
    \ the type parameter of a method, we will use the keyword extends.\n\nLet's write\
    \ the header line for a generic method to find the largest value of two parameters\
    \ of type T.\n\n```\npublic <T extends Number> T something(T a, T b);\n```\n\n\
    This will bound the method to any subclass of Number, which in this case is Integer,\
    \ Short, Long, Double, and Float. If we attempted to pass a String to the method,\
    \ it will result in a compiler error.\n\nThe below example will demonstrate this.\n\
    \n# EXAMPLE 2: Finding Maximum and Minimum Values\n\nThis program will find the\
    \ maximum and minimum values when comparing three elements.\n\n```\npublic class\
    \ Example2{\n    private static <T extends Comparable<T>> T max(T a, T b, T c)\
    \ {\n        //start at first element\n        T max_value = a;\n\n        //if\
    \ next element comes after current max_value\n        //then new max_value is\
    \ b\n        if(b.compareTo(max_value) > 0)\n            max_value = b;\n\n  \
    \      //if next element comes after current max_value\n        //then new max_value\
    \ is c\n        if(c.compareTo(max_value) > 0)\n            max_value = c;\n\n\
    \        return max_value;\n    }\n    private static <T extends Comparable<T>>\
    \ T min(T a, T b, T c) {\n        //start at first element\n        T min_value\
    \ = a;\n\n        //if next element comes before current min_value\n        //then\
    \ new min_value is b\n```"
