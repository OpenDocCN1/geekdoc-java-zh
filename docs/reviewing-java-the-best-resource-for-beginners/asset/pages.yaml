  md: '# Hexadecimal to Binary


    This conversion is also simplistic. Given a hexadecimal number, simply convert
    each digit to its binary equivalent. Then, combine each 4 bit binary number and
    that is the resulting answer.


    Take the hexadecimal number (A2F)₁₆ and convert it to its binary form:


    | A | 2 | F |

    | 1010 | 0010 | 1111 |


    **Answer: (1010 0010 1111)₂


    Take the hexadecimal number (55)₁₆ and convert it to its binary form:


    | 5 | 5 |

    | 0101 | 0101 |


    **Answer: (1010101)₂


    # Binary to Octal


    Since the octal system is again a power of two (2³), we can take the bits into
    groups of 3 and represent each group as an octal digit. The steps are the same
    for the binary to hexadecimal conversions except we are dealing with the octal
    base now.


    Take the binary number (10011)₂ and convert it to octal:


    | 010 | 011 |

    | 2 | 3 |


    **Answer: (23)₈


    Take the binary number (10101010111)₂ and convert it to octal:


    | 010 | 010 | 101 | 011 |

    | 2 | 2 | 5 | 3 |


    **Answer: (2253)₈'
