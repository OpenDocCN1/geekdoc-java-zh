  md: '# PREFACE


    As many students embark on learning Java, some find it a challenge, and others
    find it as easy as others find it impossible. I''ve learned that there are many
    students who are willing to just give up at the drop of a hat or even after they
    fail miserably on the first exam (i.e. the "OptionPane" exam).


    During my own experiences, I realized that there are quite a few students who
    do not want to come into my office and ask questions. To this day I still do not
    know why. Perhaps it is the stigma of the tutor or aide; too "nerdy" or "geeky"
    for some, or not important enough to others. I was once the latter, but quickly
    snapped out of it once I embarked on my computer science career.


    This material is written to give hope to those lost students who have to take
    a programming class as it is mandated by their degree requirements, or those students
    who are anxious to learn a new subject. I hope you find this information helpful
    understandable, so that you have a pleasant experience with Java programming.
    The material contained herein is a summary of the major topics of Java.'
