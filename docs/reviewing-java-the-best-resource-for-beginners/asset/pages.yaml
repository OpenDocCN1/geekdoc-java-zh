    \ created, which in this case was a Circle, with a radius of 2. It performs the\
    \ proper calculations for the area and perimeter.\n\n# INTERFACES\n\nWhen dealing\
    \ with an abstract class, we sometimes see what's called an interface. An interface\
    \ is a definition of all methods, unlike abstract methods within an abstract class,\
    \ these methods defined in the interface can be used in any other class, regardless\
    \ of being abstract or not. Most generally, here is how to define an interface:\n\
    \n```\ninterface Name {\n  //method(s) here\n}\n```\n\nThe methods that are defined\
    \ in the interface DO NOT need the abstract keyword in them. In order for a class\
    \ to use an interface, it must use the keyword implements in its class header.\
    \ Here is the definition:\n\n```\npublic class Name implements interfaceName {\n\
    \  //code here\n}\n```\n\nWhere in the above, Name is the name of the class; and\
    \ interfaceName is the name of the interface you will be implementing.\n\nBy default,\
    \ all methods in an interface contain the keywords public abstract before each\
    \ definition, so these are not needed. You also cannot make the methods private\
    \ protected as this is not permitted in Java interfaces.\n\n# EXAMPLE 2: Food\
    \ Stores with Interfaces"
