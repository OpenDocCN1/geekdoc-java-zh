  md: "'g'\n'f'\n'e'\n'd'\n'c'\n'b'\n'a' ← BOTTOM\n\nLet's create our own stack class\
    \ called SimpleStack.\n\n# Interface\n\nEvery stack has five primary methods,\
    \ as defined in this interface. Our class will implement this interface.\n\n```\n\
    interface Stack {\n    public Object pop();\n    public void push(Object x);\n\
    \    public Object peek();\n    public boolean empty();\n    public int size();\n\
    }\n```\n\nWhen we want to add data to the top of the stack, we will push data.\
    \ This will add data to the end of the array. When we want to remove data from\
    \ the top of the stack, we will pop data. This returns the data and removes it\
    \ entirely from the array. When we want to see what is on top of the stack without\
    \ removing it, we can peek at the data.\n\nThe empty() method will tell us if\
    \ the stack is completely empty, meaning it contains no data in its entire length.\n\
    \nThe size() method will tell us the size of the stack, meaning how many elements\
    \ are contained in it.\n\n# Constructors\n\nThe SimpleStack class begins with\
    \ its instance variables. We will use the generic Object type here to allow for\
    \ many different types of data. The data array will be of type Object. We also\
