  md: "In Java, a thread is a smaller piece of a larger program. It can also be a\
    \ super class objects in a program.\n\nFor example, say you want to simulate cars\
    \ driving, or horses racing at a track; you can do all that with threading. Using\
    \ the first example above, we will expand on that in this chapter.\n\nSo what\
    \ are some useful methods of the Thread super class?\n\n```\nvoid sleep(long milliseconds)\n\
    This method will delay the program for a specified amount of time. Keep in mind\
    \ that 1000 milliseconds are equivalent to 1 second. So if you wanted the program\
    \ to delay for 10 seconds, the argument to the method will be the value 10000.\
    \ Also know that the method is accessed as such:\n\nThread.sleep( );\n```\n\n\
    And requires a try/catch block looking for an InterruptedException (for now, that\
    \ kind of exception will not be thrown here with the program we will write because\
    \ we are not dealing with monitors in Java, a more advanced threading concept).\n\
    \n```\nvoid start()\nThis method will be called from the Thread object itself\
    \ and will invoke the run() method within that object. This will then start the\
    \ thread.\n```\n\n```\nvoid run()\nThis method will need to be overloaded in the\
    \ Thread object itself. It is a required overload and will act like the main method\
    \ of an object. This is where the code will be implemented.\n```\n\n# EXAMPLE\
    \ 1: Countdown Clock\n\nThe below program will countdown from the number the user\
    \ enters. Number must be between 5 and 30.\n\n```\nimport java.util.Scanner;\n\
    public class Example1{\n    public static void main(String args[]){\n        Scanner\
