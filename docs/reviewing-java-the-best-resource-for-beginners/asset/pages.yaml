    \ a certain exception, you must use the throw keyword.\n\n# EXAMPLE 4: Custom\
    \ Exceptions\n\nThe below program will ask the user for a month, day, and year\
    \ entry (all int values). It then performs some error checking on the entries\
    \ when trying to create the DateEntered object. If a particular error is caught,\
    \ a respective Exception is thrown. These exceptions will be defined to help us\
    \ narrow down what type of error occurred when the user entered the data. If all\
    \ is correct, then the program outputs the entry in date form.\n\nA leap year\
    \ is defined as a year that is evenly divisible by 4, unless it falls on a century.\
    \ If it falls on a century, the year must be evenly divisible by 400. An example\
    \ is 2000. That is a century year and is evenly divisible by 400. An example of\
    \ a century that is not a leap year is 1900. If it is divisible by 4 and a century,\
