  md: "In Java, method is a block of code that performs a certain task. This is *almost*\
    \ the same as a C++ function. There are some small differences which we will explore.\n\
    \nA method can be private, protected, or public, as well as static or non-static.\
    \ The return types can be anything primitive (int, float, etc...), an Object,\
    \ or user-defined.\n\n# METHOD BASICS\n\nHere is how to define a Java method:\n\
    \n```\nidentifier type Name( argument(s ) ) {\n// code here\n}\n```\n\nWhere in\
    \ the above, identifier is either public, private, or protected; type is the return\
    \ type of the method; Name is a useful name of the method, and argument(s) are\
    \ the parameters to pass to the method (if any).\n\nThe type is the specific data\
    \ type that will be returned by the method. Any of the primitive data types can\
    \ be used with methods (int, float, Boolean, etc...) in addition to any user-defined\
    \ types (classes and objects). However, there is a special type listed below:\n\
    \n```\nvoid\nDoes not return a value. Mostly used for printing information.\n\
    ```\n\nA simple method void method is defined below:\n\n```\nprivate static void\
    \ printMessage() {\n  System.out.println(\"Hello and welcome!\");\n}\n```\n\n\
    This method would print out \"Hello and welcome!\" on screen when used. But how\
    \ you use a method?"
  merge: -1
