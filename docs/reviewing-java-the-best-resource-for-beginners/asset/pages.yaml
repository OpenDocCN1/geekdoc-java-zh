  md: "The interface here contains two methods we have already seen: size() and empty().\
    \ However, there are two parts to a Queue that make it a Queue: enqueue(), which\
    \ will add data to the queue (or a new person gets in line); and dequeue(), which\
    \ will remove data from the queue (or a person leaves the line).\n\n# Constructor\n\
    \nThe class begins with the definition of the array, of the generic Object type,\
    \ in addition to the front and rear integers, which hold the index of the front\
    \ of the line and the back of the line. The size variable is the current size\
    \ of the queue, and the capacity is the maximum capacity of the queue.\n\n```\n\
    public class SimpleQueue implements Queue{\n    private Object data[];\n    private\
    \ int front, rear, size, capacity;\n```\n\nThe first of the two constructors is\
    \ the default constructor, that will allow a maximum capacity of 1000, declare\
    \ the array, and set all the remaining variables to 0, since there is no data\
    \ thus far in the queue.\n\nThe second of the constructors will allow you to declare\
    \ a queue of a certain size. We will again throw error, similar to the SimpleStack,\
    \ that the capacity must be at least 1. If it is not, we will throw a new RuntimeException.\n\
    \n```\npublic SimpleQueue() {\n    capacity = 1000;\n    data = new Object[capacity];\n\
    \    front = rear = size = 0;\n}\n\npublic SimpleQueue(int c) {\n    if(c <= 0)\
    \ \n        throw new RuntimeException(\"Capacity must be at least 1\")\n    capacity\
    \ = c;\n    data = new Object[capacity];\n    front = rear = size = 0;\n}\n```"
