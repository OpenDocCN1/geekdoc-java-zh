  md: "The last node will always be pointing to nothing (or null). As seen, each of\
    \ the nodes point to each other. Apple points to Orange; Orange points to Pear,\
    \ etc...\n\nA node for a linked list can be written as a simple class, such as\
    \ the below:\n\n```\n//Node.java\npublic class Node {\n    private Object data;\n\
    \    private Node next;\n    public Node(Object d, Node n) {\n    data = d; next\
    \ = n;\n}\n    public Object getData() { return data; }\n    public getNodeNext()\
    \ { return next; }\n    public void setData(Object d) { data = d; }\n    public\
    \ void setNext(Node n) { next = n; }\n}\n```\n\nWe will be using the Object type\
    \ here, but this can be changed to an appropriate type for your needs. Perhaps\
    \ you want a linked list of integers, simply change Object to int.\n\nThe constructor\
    \ will take both the data and the next node as its arguments. The other methods\
    \ will allow you to access the data (get methods), and set the data (set methods).\n\
    \n# Singly Linked Lists\n\nFor a singly linked list, all nodes will point in one\
    \ direction (forward). The last node always points to null.\n\nWe will begin to\
    \ build the LinkedList class piece by piece and explain it along the way. To begin,\
    \ the class definition for the LinkedList is as follows:\n\n```\npublic class\
    \ LinkedList {\n    private Node head, tail;\n    private int size;\n```\n\nHere,\
    \ we have two nodes: a head and a tail. This is used for reference points when\
    \ navigating (or traversing) a linked list, as we want to know where it begins\
    \ and ends. We also have a size variable that will simply keep track of how big\
    \ the list is."
