    # ABSTRACT METHODS


    In Java, a method can be declared abstract. This means that it will not have an
    implementation within the abstract class in which it is being defined, but it
    will be implemented in a subclass. The method will use the same abstract keyword
    in its title:


    ```

    [identifier] abstract type Name();

    ```


    Where in the above, identifier can be public, private, or protected; type is the
    return type of the method; and Name is the name of the useful name of the method.
    Notice there is a savings and a semicolon appearing at the end of the method declaration.
    This is how to denote an abstract method, since there is no implementation after
    it.


    # ACCOUNT CLASS


    Let''s use a real world example. In banking, there are two types of accounts,
    a checking and a savings. In reality, there are many more than that, but for the
    purpose of this example we are using those two. In Java, we can declare an abstract
    class named Account, with a subclass of both Checking and Savings. As we''ve done
    in prior chapters, let''s build this class piece by piece.


    An account holder can withdraw, deposit or transfer funds from one account to
    another.


    At the minimum, the abstract class will look like this:'
