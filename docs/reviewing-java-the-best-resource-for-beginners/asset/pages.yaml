  md: '```

    import java.util.StringTokenizer;

    ```


    Most generally, here is how to declare a StringTokenizer object:


    ```

    Tokenizer name = new StringTokenizer(variable, token(s));

    ```


    where in the above, name is an appropriate name for the tokenizer object; variable
    is the name of a String variable you are using, or even just a simple string;
    and token(s) is the token(s) you are specifying.


    In the above definition, if the second argument of the constructor is not specified,
    the token, by default, is a white space. Also, if the token that is declared does
    not exist in the String you are searching through, the entire string is returned
    to you.


    Let''s say that we wanted to break up the following line of text into smaller
    pieces:


    ```

    "Hello and welcome to programming"

    ```


    The StringTokenizer class has some useful methods when tokenizing Strings. Here
    is some information below.


    ```

    boolean hasMoreTokens()

    This method will return a boolean value that will represent if there are any more
    tokens left in the line you are trying to tokenize.

    true return will show that there is at least 1 more in the line.

    ```


    ```

    int countTokens()

    This method will simply return an integer representing the number of tokens in
    the String. This method does not advance the position in the String.

    ```


    ```

    String nextToken()

    This method is the primary method of the class as it will get you the next piece
    of data in the String. The position in the string is changed after this method
    is called.

    ```'
