  md: 'In the above, the array is sorted correctly, from largest to smallest.


    # # BUBBLE SORT


    This is the oldest sorting algorithm in computer science. A Bubble Sort will:


    +   1. Compare one element with its neighbor.

    2. Swap those elements if it is greater or less than.

    3. REPEAT UNTIL SORTED.


    Let''s see a small example first with this small array of integers. We want to
    sort them in ascending order.


    ```

    arr[] = {9, 8, 2, 4};

    ```


    Based on the algorithm, it compares index 0 and index 1, or the values 9 and 8,
    respectively. Since 8 is less than 9, we want to swap them. Here is the revised
    array:


    ```

    arr[] = {8, 9, 2, 4};

    ```


    It now compares index 1 and index 2, or the values 9 and 2, respectively. Again,
    swap them.


    ```

    arr[] = {8, 2, 9, 4};

    ```


    It now compares index 2 and index 3, or the values 9 and 4, respectively. Again,
    swap them.


    ```

    arr[] = {8, 2, 4, 9};

    ```


    You have reached the end of the array. Simply start from the beginning. Here is
    the current array:


    ```

    arr[] = {8, 2, 4, 9};

    ```


    It compares index 0 and index 1, or the values 8 and 2, respectively. Since 2
    is less than 8, swap them:


    ```

    arr[] = {2, 8, 4, 9};

    ```'
