  md: '# toLowerCase()


    TheLowerCase() method will return the lowercase version of a string. Say you have
    a string "Welcome TO Earth." This method will return "welcome to earth." Only
    the letters a-z and A-Z are affected; not numbers or symbols.


    # trim()


    The trim method will return the string without leading or trailing white space
    characters. Say that a string was " " There are 4 spaces in the front and 3 spaces
    at the end. The trim method would make this "hello."


    # charAt(index)


    This method will look for a character at a specific index. It will return that
    character if it is found. Say we have the string "Hello" and we charAt(4). It
    will return ''o'' as that character is at index 4.


    # indexOf(int ch)


    # indexOf(int ch, int begin)


    # indexOf(String ch)


    # indexOf(String ch, int begin)


    Notice that there are 4 different methods listed here. All of them perform the
    same overall action returning an integer, which represents the FIRST OCCURRENCE
    of a character or String contained in that. So say that we have the string "Hello"
    and we say indexOf(1). This method will use the first method above and return
    2. Notice it does not return 3 as the first occurrence of the character l is at
    index 2. We can also say, using the same string "Hello", indexOf("He"). It will
    return 0 as the string that you are searching for starts at index 0.


    By default, if a string or character is not found in the string, any of the methods
    will return -1.


    # String substring(int begin)


    # String substring(int begin, int end)


    Either of these methods will shorten a string when called. If no ending index
    is specified, it will return the rest of the string. Say we have the string "Hello
    there" and we say substring(4), the method will return " there." Let''s use substring(2,5),
    the method will return "llo".


