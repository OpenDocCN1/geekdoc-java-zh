  md: 'In Java, file input and file output are done with a BufferedReader (input)
    and BufferedWriter (output). Each of them is a stream, like the C++ <fstream>.


    # FILE INPUT


    In order for you to have a BufferedReader object, you must import both of the
    below:


    ```

    import java.io.BufferedReader;

    import java.io.FileReader;

    ```


    After that, you can declare the BufferedReader object as follows:


    ```

    BufferedReader varName = new BufferedReader(

    new FileReader(filename));

    ```


    This will instantiate the object and allow you to read a line of text. Note that
    inside the constructor of the BufferedReader is another object called FileReader.
    BOTH of these need to be instantiated in order for the entire BufferedReader object
    to be created.


    Most often paired with a BufferedReader (though not always), is a StringTokenizer
    that will allow you to read an entire line of a file, and break it into pieces
    (if that is needed). The StringTokenizer object is in the java.util library (see
    the String chapter for a refresher on the StringTokenizer).


    There is one golden rule about file input or output: the object MUST be declared
    inside a try/catch block; there is no exception to this rule.


    Let''s review some methods that a BufferedReader will use:


    ```

    readLine()

    This will extract an entire line of text as denoted by the carriage character
    ''\r'' or a new line character ''\n''. The return type is String because it will
    extract a String from the file.

    ```


    ```

    int read()

    There is also another method in the class called read(). This will simply read
    an individual character. It will return a -1 if the end of the stream has been
    reached.

    ```'
