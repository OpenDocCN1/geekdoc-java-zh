  md: "# Multiple Parameter Types\n\nAny generic method, or class, can have multiple\
    \ generic types associated with it. Each type is separated by a comma in the method\
    \ declaration.\n\n```\n[identifier] < A, B, C ... > [return type] method_name\
    \ ( arguments );\n```\n\nHowever, there can be only one of those defined as the\
    \ method return type.\n\n# EXAMPLE 4: Multiple Parameter Types\n\nThe below program\
    \ will print elements of an array of types A and B.\n\n```\npublic class Example4{\n\
    \    private static <A, B> void mystery(A a[], B b[]) {\n        int sizeA = a.length,\
    \ sizeB = b.length;\n\n        for(int i = sizeA-1; i >= 0; i--) {\n         \
    \   System.out.print(a[i]);\n        }\n        System.out.println();\n\n    \
    \    for(int j = 0; j < sizeB; j++) {\n            System.out.print(b[j]);\n \
    \       }\n        System.out.println();\n    }\n\n    public static void main(String\
    \ args[]){\n        Character arr[] = {'o', 'l', 'l', 'e', 'H'};\n        Integer\
    \ arr2[] = {9, 0, 2, 1, 0};\n\n        mystery(arr, arr2);\n    }\n} //main //\n\
    ```\n\nThe output from running the above program is:\n\nHello\n90210"
