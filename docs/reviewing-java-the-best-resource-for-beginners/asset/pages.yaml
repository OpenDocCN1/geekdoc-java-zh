  md: '# # APPENDIX C

    The Game of Keno


    For those who have been to a casino or played a state lottery that has this game,
    we are going to create a console based program that will simulate a game of Keno.


    The rules of the game are straightforward. There are numbers 1 to 80 that are
    in the field. In any one game, 20 numbers are randomly drawn from the field. A
    player has the option to play anywhere from 1 to 10 numbers (or spots as they
    are called). The more numbers you match, the more you win, based on the number
    of spots you play. That''s the basic aspect of the game. But how much do you win
    per game?


    Below is a pay table that we will be using for this game which is based on the
    New York state lottery. Each state''s or casino''s pay will vary slightly.


    | MATCHES PRIZE | MATCHES PRIZE |

    |---|---|---|--|

    | 10 SPOT GAME | $100,000 | 6 SPOT GAME | $1,000 |

    | 9 | $5,000 | 5 | $55 |

    | 8 | $300 | 4 | $6 |

    | 7 | $45 | 3 | $1 |

    | 6 | $10 | 5 SPOT GAME | $300 |

    | 5 | $2 | 4 | $20 |

    | 0 | $5 | 3 | $2 |

    | 9 SPOT GAME | $30,000 | 4 SPOT GAME | $2 |

    | 8 | $3,000 | 4 | $55 |

    | 7 | $125 | 3 | $5 |

    | 6 | $20 | 2 | $1 |

    | 5 | $5 | 3 SPOT GAME | $23 |

    | 0 | 2 | $2 |

    | 8 SPOT GAME | $10,000 | 2 SPOT GAME | $10 |

    | 7 | $550 | 1 SPOT GAME | $2 |

    | 6 | $75 | | |

    | 5 | | | |

    | 0 | | | |


    *All payouts above are on a $1 wager.


    | 7 SPOT GAME | |

    |---||

    | 7 | $5,000 |

    | 6 | $100 |

    | 5 | $20 |

    | 4 | $2 |

    | 0 | $1 |'
