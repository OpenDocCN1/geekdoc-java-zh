  md: '# RANDOM NUMBERS


    In Java, as well as any other programming language, you can generate a random
    number, or sequence of random numbers. In order to use this library, you must
    import it from the java.util library:


    ```

    import java.util.Random;

    ```


    Here is how to create a new Random object in Java:


    ```

    Random name = new Random();

    ```


    Where in the above, name is an appropriate name for the Random object. Once declared,
    you can begin to generate a random number by making use of an appropriate method
    within the object.


    While it may appear that Java is indeed generating random numbers, it isn''t.
    It is generating what is called pseudorandom numbers. This is accomplished by
    the Random class taking an initial value (called a seed), that then generates
    another value based on the seed you give it. If no seed is defined, the default
    value is the computer''s clock in milliseconds, which is of the type long.


    To define a Random object with a seed, you would need to do this:


    ```

    Random name = new Random();

    name.setSeed(long value);

    ```


    Where in the above, name is an appropriate name for the Random object. You then
    call the method within the Random object, and seed the value. The parameter of
    the setSeed() method is a long integer value.


    You can also set the seed at the time of creating the new Random object. That
    can be accomplished like this:'
  merge: -1
