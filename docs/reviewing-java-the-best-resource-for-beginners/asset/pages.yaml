    to perform our desired tasks.


    Below is a list of the various methods associated with this library.


    ```

    static double abs(double d)

    static float abs(float f)

    static int abs(int n)

    static long abs(long l)

    Returns the absolute value of its argument.


    static double cbrt(double a)

    Returns the cube root of a double value.


    static double ceil(double a)

    Returns the smallest double precision value that is not less than the argument
    and is equal to a mathematical integer.


    static double cos(double a)

    Returns the trigonometric cosine of an angle.


    static double cosh(double a)

    Returns the hyperbolic cosine of an angle.


    static double exp(double a)

    Returns Euler''s number raised to the power of a double value.


    static double floor(double a)

    Returns the largest double precision value that is not greater than the argument
    and is equal to a mathematical integer.


    static double hypot(double x, double y)

    Returns the sqrt(x^2 + y^2).


    static double log(double a)

    Returns the natural logarithm (base e) of a double value.

