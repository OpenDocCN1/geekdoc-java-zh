  md: '# # APPENDIX E


    The long-running game show Jeopardy! was created by Merv Griffin back in 1964.
    It has had a slew of hosts, most notably, and currently Alex Trebek, who has hosted
    the show since 1984.


    # ## RULES & GAMEPLAY


    The game itself consists of three players (one returning champion and two others).
    The game also consists of a single Jeopardy round, a double Jeopardy round, and
    a final Jeopardy round, played in that order.


    # ### Game Boards


    The game board consists of 6 categories, each of which has 5 clues. At the present
    time (2019), the current game board looks like this for the single Jeopardy round:


    | $200 | $200 | $200 | $200 | $200 | $200 |

    | $400 | $400 | $400 | $400 | $400 | $400 |

    | $600 | $600 | $600 | $600 | $600 | $600 |

    | $800 | $800 | $800 | $800 | $800 | $800 |

    | $1000 | $1000 | $1000 | $1000 | $1000 | $1000 |


    The board for the double Jeopardy round consists of the above amounts doubled.
    There are still 6 categories and 5 clues in each one.


    For further background, the clues themselves are answers. A contestant must give
    their response in question form. For this model, this is irrelevant, since we
    will not be dealing with actual responses from a contestant.


    # ### Daily Double(s)


    A daily double will allow a contestant to potentially double their current winnings.
    There is one daily double in single Jeopardy & two in double Jeopardy. These can'
  merge: -1
  pgno: 574
- img_proc: true
  md: 'appear in ANY of the places above in either round. That does include the first
    row (which many people think can never occur).


    What this will do is enable a player to wager any amount of or all of their money
    (with a minimum of a $5 bet). If the current bank roll of the contestant is negative
    or $0, the contestant may wager up to the highest value clue on the board ($1000
    in single Jeopardy and $2000 in double Jeopardy).


    # Single Jeopardy


    The first round of game play. Here, the returning champion picks the first clue
    from the game board. The round continues until all clues are completed OR time
    has expired. This round also consists of one (1) daily double.


    # Double Jeopardy


    The second round of game play. Here, the contestant with the lowest bank roll
    picks the first clue from the game board. The round continues until all clues
    are completed OR time has expired. This round also consists of two (2) daily doubles.


    At the end of this round, or any or players with a $0 or negative balance will
    NOT play in Final Jeopardy (even if that means all of the players).


    # Final Jeopardy


    The final round of game play. Here, one (1) clue is asked to the remaining contestants.
    They must decide how much they want to wager BEFORE the clue appears. They can
    wager up to their current bankroll or $0.


    The player with the highest score at the end of Final Jeopardy will be declared
    the “champion” and return for the next show.


    # HOW MUCH CAN YOU WIN?


    As mentioned earlier, we will be assuming and/or realizing the following things
    about the game play:


    +   1. There is 1 Daily Double for round 1 (single Jeopardy) and 2 in round 2
    (double Jeopardy).'
