  md: 'So far in our adventures, we have written programs in prior chapters dealing
    with dates, and calendars. While that certainly wasn''t a waste of time or brain
    power, could have utilized some members of the java.time library to help us!


    There are many libraries contained in the java.time package. We will be covering
    some of them, but not all. This is just a way to show how programs can handle
    dates and times as desired for your program(s).


    # TIME LIBRARY HIGHLIGHTS


    # Month Class


    In order to use this class, you must import it from the java.time library:


    ```

    import java.time.Month;

    ```


    This class does not need to be constructed, meaning you do not need to create
    a new Month object with the use of the new keyword. To create a new instance of
    the Month object, you can make use of the static of(of) method:


    ```

    Month name = Month.of(int month);

    ```


    Where in the above, name is a useful name of the Month object. The parameter of
    the of(of) method is an int value from 1 to 12, representing the month of the
    year. This method throws a DateTimeException if the given parameter is invalid.


    Contained in the Month object are two constant, final variables representing the
    months of the year.


    ```

    static final Month JANUARY The singleton instance for the month of January with
    31 days. This has a numeric value of 1. Can be accessed from the object as Month.JANUARY;

    ```


    ```

    static final Month FEBRUARY The instance for the month of February with 28 days
    (or 29 days in a leap year). This has a numeric value of 2. Can be accessed from
    the object as Month.FEBRUARY;

    ```'
