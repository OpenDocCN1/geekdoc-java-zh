    # WRAPPER CLASSES


    A wrapper class is simply an object version of a primitive data type. It contains
    methods or constants that can be useful for a program. Here is a list of the wrapper
    classes for the primitive data types:


    | Integer

    Methods for an int data type |

    |Short

    Methods for a short data type |

    |Long

    Methods for a long data type |

    |Double

    Methods for a double data type |

    |Float

    Methods for a float data type |

    |Character

    Methods for a char data type |

    |Boolean

    Methods for a boolean data type |


    Each of the above wrapper classes contains a very important method that will parse
    (or convert) any String, either a command line argument or a String object, into
    the appropriate data type. These methods are defined below:


    ```

    Integer.parseInt(String val)

    Returns an int value from a String representation of a number. A NumberFormatException
    is thrown if the argument is not a String representation of a number.

    ```


    ```

    Short.parseShort(String val)

    Returns a short value from a String representation of a number. A NumberFormatException
    is thrown if the argument is not a String representation of a number.

    ```'
