  md: '# Octal to Binary


    To go from octal to binary, simply reverse the above algorithm and represent each
    octal digit in its three bit binary form.


    Take the octal number (742)₈ and convert it to binary:


    ```

    7 | 4 | 2

    111 | 100 | 010

