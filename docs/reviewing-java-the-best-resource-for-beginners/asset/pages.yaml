    \ nextSignal();\n\n    //instance variable\nprivate final int secondsAt;\n\n \
    \   //constructor\nTrafficLight(int secondsColor) {\n        this.secondsAt =\
    \ secondsColor;\n    }\n\n    //get method\n    public int getSecondsAt() { return\
    \ this.secondsAt; }\n}\n```\n\nEach enum value will implement the abstract method\
    \ nextSignal(). The return type is of TrafficLight, as we want to know what color\
