    \ that takes the desired size of the stack, we need to check if the argument is\
    \ less than or equal to 0. If so, we will throw a RuntimeException as the size\
    \ of the stack must be at least 1.\n\n```\npublic class SimpleStack implements\
    \ Stack{\n    private Object data[];\n    private int top, max_size;\n\n    public\
    \ SimpleStack() {\n        data = new Object[1000];\n        top = -1;\n     \
