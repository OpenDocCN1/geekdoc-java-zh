  mdcn: "\n同样，你可以声明一个 3 维（三维）数组。例如：\nString[][][] personalInfo = new String[3][4][2];\n\
    \n在这种情况下，personalinfo 是一个 3 维数组，能够容最多 24 (3*4*2) 个字符串类型的元素。\nJava 中多维数组的组成部分也是数组。\n\
    \n如果你对 C 或 C++ 语言有所了解，你可能已经开始认为 Java 的多维数组工作方式与 C/C++ 中的数组相同。但事实并非如此，因为 Java 的行长度是可以变变的。\n\
    \n在初始化期间，你会看到这种区别。\n\n## 在 Java 中初始化 2 数组\n\n使用下面的示例来初始化一个 2 数组：\n\n```\nint[][][]\
    \ a = {\n  {1, 2, 3},\n  {4, 5, 6, 9},\n  {7},\n};\n```\n\n数组组件 'a' 的每一个实际上本身都是一个数组，而且所有行的长度也不相同。为了证明这一点，我们将编写一个程序。\n\
    \n```\nclass MultidimensionalArray {\n    public static void main(String[] args)\
    \ {\n\n    int[][] a = {\n        {1, 2, 3},\n        {4, 5, 6, 9},\n    };\n\n\
    \    System.out.println(\"Length of row 1: \" + a[0].length);\n    System.out.println(\"\
    Length of row 2: \" + a[1].length);\n    System.out.println(\"Length of row 3:\
    \ \" + a[2].length);\n    }\n}\n```\n\n运行该程序时你将得到以下输出：\nLength of row 1: 3\nLength\
    \ of row 2: 4\nLength of row 3: 1\n\n既然所有的多维数组组件也是数组，这意味着 a[2]、a[1] 和 (a[0]) 也是数组。你可以通过使用\
    \ 'length' 属性来行的长度。让我们来看一个很好的例子：\n\n## 使用循环打印所有 2 数组元素\n\n```\nclass MultidimensionalArray\
    \ {\n    public static void main(String[] args) {\n\n        int[][] a = {\n \
    \           {1, -2, 3},\n            {-4, -5, 6, 9},\n            {7}\n      \
    \  };\n\n        for (int i = 0; i < a.length; ++i) {\n            for (int j\
    \ = 0; j < a[i].length; ++j) {\n                System.out.println(a[i][j]);\n\
    \            }\n        }\n    }\n}\n```\n\n注意，当有机会时，在遍历数组时最好利用 for..each 循环。你可以使用\
