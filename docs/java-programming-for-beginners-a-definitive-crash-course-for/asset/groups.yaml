    \ (30) 映射到 `amount`（'number' 类型）。这种参数（parameter）的记法可以扩展到多个参数，方法是在一个用逗号分隔的列表中列出多个参数，，形式如\
    \ 'doSomething(number valueOne, Number valueTwo)'。在参数按位置映射的情况下，这种参数（argument）记法可以派上用场，例如\
    \ 'doSomething(15, 37)' 将 37 映射到 `valueTwo`。\n\n## 类声明\n\n让我们从一个类定义的示例开始：\n\n\
    ```\nclass MyClass {\n  // 字段、构造函数和\n  // 方法声明\n}\n```\n\n这是类声明的形式。大括号之间的区域——或类体——包含了该类创建的对象的生命周期所提供的所有功能：用于初始化新对象的构造函数、提供类及其对象状态的字段声明，以及实现类及其对象行为的方法。先前的类声明是一个极简的——它基本上包含了类声明的所有必需组件。你可以在类声明的开头提供更多关于类的信息，例如，它的父类名称、它是否实现了任何接口等。例如：\n\
