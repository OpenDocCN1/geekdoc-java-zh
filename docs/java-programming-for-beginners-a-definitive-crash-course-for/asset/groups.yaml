    \ You can complete the same task with for..loop as:\n\n```\nclass MultidimensionalArray\
    \ {\n    public static void main(String[] args) {\n        int[][] a = {\n   \
    \         {1, -2, 3},\n            {-4, -5, 6, 9},\n        };\n\n        for\
