    Num 1 | num 2 compares num 1 and num 2 bits and then generates 1, that if either
    bit is 1, otherwise it returns zero. In the case here, it returns 31, which essentially
    is 0011111.


    Num 1^ num 2 on the other hand compares the corresponding bits of num 2 and num
    1 before generating a 1; that is if they are not equal, otherwise it returns o.
    In our example here, it would return 29, which is equal to 00011101.


    -num happens to be a complement operator that only changes the bit from o to 1
    and to to o. In the example we have here, it returns -12. This one is signed 8
    bit equal to 11110100.


    Num 1 << is a left shift operator, which is responsible for transferring the bits
    towards the left hand side and discards the bit that is far left, before assigning
    zeros to the rightmost bit. In the case here, the output is 44. This figure is
    equivalent to 00101100.'
