    \ {\n            for (int data: innerArray) {\n                System.out.println(data);\n\
    \            }\n        }\n    }\n}\n```\n\n运行该程序时你将得到以下输出：\n\n## 在 Java 中初始化\
    \ 3 数组\n\n初始化一个 3 维数组与初始化 2 数组相同。看下面的示例：\n\n```\n// test 是一个 3 维数组\nint[][][]\
    \ test = {\n    {\n        {1, -2, 3},\n        {2, 3, 4}\n    },\n    {\n   \
    \     {-4, -5, 6, 9},\n        {1},\n        {2, 3}\n    }\n};\n```\n\n就像 2 数组的情况一样，3\
    \ 维数组的长度也可以不同。让我们来看一个例子：\n\n使用循环打印 3 维数组元素的程序\n\n```\nclass ThreeArray {\n   \
    \ public static void main(String[] args) {\n\n    int[][][] test = {\n       \
