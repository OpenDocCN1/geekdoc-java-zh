    \    for (int[][] array2D: test) {\n        for (int[] array1D: array2D) {\n \
    \           for (int item: array1D) {\n                System.out.println(item);\n\
    \            }\n        }\n    }\n}\n```\n\nYOU WILL GET THE FOLLOWING OUTPUT\
    \ WHEN YOU RUN THE PROGRAM:\n1\n-2\n3\n2\n3\n4\n\n\n## Java Copy Arrays\n\nWe're\
    \ now going to learn about the various ways copy arrays (that is one and two dimensional\
    \ arrays) can be used in Java. We have a number of techniques we can use to achieve\
    \ this as explained in this section:\n\n## Using the assignment operator to copy\
    \ the arrays\n\nTake a look at the following example:\n\nYou'll get the following\
    \ output when you run the program:\n1, 2, 3, 4, 5, 6\n\nEven though this particular\
    \ method of copying arrays works superbly, it tends to have a problem. The thing\
    \ is, when you alter the elements of a single array in the above example, the\
    \ other arrays' corresponding elements are also altered.\n\n```\nclass AssignmentOperator\
    \ {\n  public static void main(String[] args) {\n\n    int [] numbers = {1, 2,\
    \ 3, 4, 5, 6};\n    int [] positiveNumbers = numbers; // copying arrays\n\n  \
    \  numbers[0] = -1;\n\n    for (int number:positiveNumbers) {\n        System.out.print(number\
    \ + \", \");\n    }\n  }\n}\n```\n\nYou'll get the following output when you run\
    \ the program:\n-1, 2, 3, 4, 5, 6\n\nWhen the initial element of the array 'numbers'\
    \ becomes altered to -1, the initial element of the array 'positiveNumbers' likewise\
    \ becomes -1. This is because the two arrays denote the same array object. This\
    \ is known as shallow copy.\n\nNonetheless, we often require what is referred\
    \ to as deep copy and not shallow copy. This (deep copy) copies the values to\
    \ make a new array object.\n\n## Let's use looping construct to copy arrays\n\n\
    We'll begin with an example:\n\n```\nimport java.util.Arrays;\n\nclass ArraysCopy\
    \ {\n    public static void main(String[] args) {\n\n        int [] source = {1,\
    \ 2, 3, 4, 5, 6};\n        int [] destination = new int[6];\n\n        for (int\
    \ i = 0; i < source.length; ++i) {\n            destination[i] = source[i];\n\
    \        }\n\n        // converting array to string\n        System.out.println(Arrays.toString(destination));\n\
    \    }\n}\n```\n\nYour output will be as follows after running the program:\n\
    [1, 2, 3, 4, 5, 6]\n\nIn this case, the loop is being used to iterate through\
    \ each and every element of the 'source' array. In all iterations, the corresponding\
    \ element of the 'source' array is copied to the 'destination' array.\n\nThe destination\
    \ and source array do not share similar reference which is deep copy. This means\
    \ that if the elements of one array either destination or source are altered,\
    \ another array's corresponding elements are not changed.\n\nThe 'toString()'\
    \ method basically works to change array to string - only for the output purposes.\
    \ In Java, we have a better way of copying arrays (apart from using loops). This\
    \ is by using the 'copyOfRange()' and 'arraycopy()' method.\n\n## How to use the\
    \ arraycopy() method to copy arrays\n\nThe system class has the 'arraycopy()'\
    \ method that lets you copy data from one particular array to another. The arraycopy()\
    \ method is efficient and also flexible. The method lets you copy a particular\
    \ part of source array to destination array. Take a look:\n\n```\npublic static\
    \ void arraycopy(Object src, int srcPos,\n        Object dest, int destPos, int\
    \ length)\n```\n\nIn this case:\n- Src is the array that you want to copy\n- srcPos\
    \ is the src array's starting position or index\n- dest is the array which the\
    \ src elements will be copied to\n- destPos is the dest array's starting position\
    \ or index\n- 'length' is the number of elements to be copied\n\nWe'll take an\
    \ example:\n// To use Arrays.toString() method\nimport java.util.Arrays;\n\nclass\
    \ ArraysCopy {\n    public static void main(String[] args) {\n        int[] n1\
    \ = {2, 3, 12, 4, 12, -2};\n```\n\n```\nclass ArraysCopy {\n    public static\
    \ void main(String[] args) {\n        int[] source = {2, 3, 12, 4, 12, -2};\n\
    \        int[] destination = new int[6];\n```\n\n```\n        // Creating n2 array\
    \ having length of n1 array\nint[] n2 = new int[5];\n```\n\n```\n        // copying\
    \ entire n1 array to destination\nSystem.out.println(Arrays.toString(destination));\n\
    \    }\n}\n```\n\nYou need to note that the default opening value of elements\
    \ of the int array is 0.\n\n## Using the copyOfRange() method to copy arrays\n\
    \nWhat's more, you can use this method that is defined in class to copy arrays.\
    \ You don't necessarily have to build the destination array before this particular\
    \ method is called. To learn more about this method, visit this\n\nLet's see how\
    \ you can do it:\n\n```\n// To use toString() and copyOfRange() method\nimport\
    \ java.util.Arrays;\n\nclass ArraysCopy {\n    public static void main(String[]\
    \ args) {\n\n        int[] source = {2, 3, 12, 4, 12, -2};\n\n        // copying\
    \ entire source array to destination\n        int[] destination1 = Arrays.copyOfRange(source,\
