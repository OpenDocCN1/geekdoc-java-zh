- md: "\n```java\ndestination1 = [2, 3, 12, 4, 12, -2]\ndestination2 = [12, 4, 12]\n\
    ```\n\n# Using loop to copy 2d arrays\n\nTake the example below to copy irregular\
    \ 2d arrays with loop:\nimport java.util.Arrays;\n\n```java\nclass ArraysCopy\
    \ {\n    public static void main(String[] args) {\n        int[][] source = {\n\
    \            {1, 2, 3, 4},\n            {5, 6},\n            {0, 2, 42, -4, 5}\n\
    \        };\n\n        int[][] destination = new int[source.length][];\n\n   \
    \     for (int i = 0; i < destination.length; ++i) {\n            // allocating\
    \ space for each row of destination array\n            destination[i] = new int[source[i].length];\n\
    \n            for (int j = 0; j < destination[i].length; ++j) {\n            \
    \    destination[i][j] = source[i][j];\n            }\n        }\n    }\n```\n\
    \nYou will get the following output when you run the program:\n\n[[1, 2, 3, 4],\
    \ [5, 6], [0, 2, 42, -4, 5]]\n\nAs you can see, we've used the method 'deepToString()'\
    \ for arrays here. This method better represents a multi-dimensional array as\
    \ like in a 2 dimensional array. You can get more information about deepToString()\
    \ on this\n\nYou can use the System.arraycopy() or- in the case of one dimensional\
    \ array- use Arrays.copyOfOf() array to replace the inner loop of the code above.\
    \ Take a look at the example below that shows how to achieve the same thing with\
    \ the arraycopy() method.\n\n```java\nimport java.util.Arrays;\n\nclass AssignmentOperator\
    \ {\n    public static void main(String[] args) {\n\n        int[][] source =\
    \ {\n            {1, 2, 3, 4},\n            {5, 6},\n            {0, 2, 42, -4,\
    \ 5}\n        };\n\n        int[][] destination = new int[source.length][];\n\n\
    \        for (int i = 0; i < source.length; i++) {\n            // allocating\
    \ space for each row of destination array\n            destination[i] = new int[source.length];\n\
    \            System.arraycopy(source[i], 0, destination[i], 0, destination[i].length);\n\
    \        }\n\n        // displaying destination array\n        System.out.println(Arrays.deepToString(destination));\n\
    \    }\n}\n```\n\nArrays are, after all, not that complicated! The next topic\
    \ is even more straightforward. Let's take a look at operators to ensure some\
    \ of what we've learned so far makes more sense, as well as what's to come.\n\n\
    # Java Operators\n\nSimply put, operators are characters representing specific\
    \ actions. For instance, +, as you know it, is an an arithmetic operator that\
    \ denotes addition. In Java, we have the following types of operators:\n\n- Assignment\
    \ operators\n- Basic arithmetic operators\n- Comparison or relational operators\n\
    - Auto-increment/decrement operators\n- Bitwise operators\n- Logical operators\n\
    - Ternary operators\n\n# Basic Arithmetic Operators\n\nThese include things like\
    \ +, %, -, *, /\n\n- Addition is represented by + \n- Subtraction is represented\
    \ by - \n- Multiplication is represented by *\n- Division is represented by /\n\
    - Modulo is represented by %\n\nYou have to note that modulo operator returns\
    \ remainder- for instance 10 % 5 returns zero\n\nLet's take a look at some of\
    \ the arithmetic operators examples: public class ArithmeticOperatorDemo {\n\n\
    ```java\npublic static void main(String[] args) {\nint num1 = 100;\nint num2 =\
    \ 20;\n\nSystem.out.println(\"num1 + num2: \" + (num1 + num2));\nSystem.out.println(\"\
    num1 - num2: \" + (num1 - num2));\nSystem.out.println(\"num1 * num2: \" + (num1\
    \ * num2));\nSystem.out.println(\"num1 / num2: \" + (num1 / num2));\nSystem.out.println(\"\
    num1 % num2: \" + (num1 % num2));\n}\n```\n\nThe output will be as follows:\n\n\
    ```\nnum1 + num2: 120\nnum1 - num2: 80\nnum1 * num2: 2000\nnum1 / num2: 5\nnum1\
    \ % num2: 0\n```\n\n# Assignment Operators\n\nThe assignment operators include\
    \ the following:\n\n- The operator that would assign the num1 variable to the\
    \ variable num2=num1\n- Num2 +=num1 is the same/equivalent to num2=num2+num1\n\
    - Again, num2-=num1 is equivalent to num2=num2-num1\n- Num2 *=num1 is equivalent\
    \ to num2=num2 *num1\n- Num2 /=num1 is equivalent to num2=num2/num1\n- Num2%=num1\
    \ is equivalent to num2=num2%num1\n\nLet's have an example of assignment operators:\n\
    \n```java\npublic class AssignmentOperatorDemo {\n    public static void main(String\
    \ args[]) {\n        int num1 = 10;\n        int num2 = 20;\n\n        num2 =\
    \ num1;\n        System.out.println(\"Output: \"+num2);\n\n        num2 += num1;\n\
    \        System.out.println(\"+= Output: \"+num2);\n\n        num2 -= num1;\n\
    \        System.out.println(\"-= Output: \"+num2);\n\n        num2 *= num1;\n\
    \        System.out.println(\"*= Output: \"+num2);\n\n        num2 /= num1;\n\
    \        System.out.println(\"/= Output: \"+num2);\n\n        num2 %= num1;\n\
    \        System.out.println(\"%= Output: \"+num2);\n    }\n}\n```\n\nThe output\
    \ you get by running the program is as follows:\nOutput: 10\n+= Output: 20\n-=\
    \ Output: 10\n*= Output: 100\n/= Output: 10\n%= Output: 0\n\n# Auto-Increment\
    \ Decrement Operators\n\nHere, we are dealing with ++ is equal to num+1 while\
    \ -- is equal to num-1\n\nLet's take an example of auto-increment decrement operators:\n\
    \n```java\npublic class AutoOperatorDemo {\n    public static void main(String\
    \ args[]){\n    int num1 = 10;\n    int num2 = 20;\n    num1++;\n    num2--;\n\
    \    System.out.println(\"num1++ is: \"+num1);\n    System.out.println(\"num2--\
    \ is: \"+num2);\n    }\n}\n```\n\nThe output is as follows:\nnum1++ is: 11\nnum2--\
    \ is: 19\n\nLogical operator is used with binary variables. They are mostly used\
    \ in loops and conditional statements to evaluate a condition.\n\nEssentially,\
    \ Java's logical operators are ||, &&, !\n\nConsider the case that we have boolean\
    \ variables: b1 and b2. In this case, b1 && b2 will return true in the instance\
    \ b1 as well as b2 are true; otherwise it would return false.\n\nOn the other\
    \ hand, b1 || b2 returns false in the instance b1 as well as b2 are false, otherwise\
    \ it would return true.\n\n!b1 would, on the other hand, return the opposite of\
    \ b1, meaning it would return true in the instance b1 is false and return false\
    \ in case b1 is true.\n\nLet's take an example of these logical operators:\n```java\n\
    public class LogicalOperatorDemo {\n    public static void main(String args[])\
    \ {\n        boolean b1 = true;\n        boolean b2 = false;\n\n        System.out.println(\"\
    b1 && b2: \" + (b1&&b2));\n        System.out.println(\"b1 || b2: \" + (b1||b2));\n\
    \        System.out.println(\"!(b1 && b2): \" + !(b1&&b2));\n    }\n}\n```\n\n\
    The output is as follows:\nb1 && b2: false\nb1 || b2: true\n!(b1 && b2): true\n\
    \n# Relational Comparison Operators\n\nIn Java, there are six relational operators\
    \ which include:\n\n- In the instance left and right side are equal, == returns\
    \ true\n- In the instance the left side isn't equivalent to the operator's right\
    \ side, != returns true\n- In the instance the left side is more/greater than\
    \ the right side, > returns true\n- In the instance the left side is smaller/less\
    \ than the right side, < returns true\n- In the instance the left side is more/greater\
    \ than the right side, or equal to it, >= returns true\n- In the instance the\
    \ left side is smaller/fewer/less than the right side, or equal to it, <= returns\
    \ true\n\nLet’s take an example of these relational operators:\n\nFirst of all,\
    \ you need to note that the example below is using the if-else statement, which\
    \ you need to be well conversant with before you continue. You can refer to what\
    \ we discussed earlier on this statement before continuing.\n\n```java\npublic\
