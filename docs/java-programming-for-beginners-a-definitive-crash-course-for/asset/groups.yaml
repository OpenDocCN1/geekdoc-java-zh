    考虑到这些，让我们开始学习。如果你是这个领域的完全新手，我们将从基础知识开始：


    ## Java 编程：背景


    在进入 Java 编程之前，让我们先确保我们理解计算机编程（或编码）到底是什么。


    ## 什么是编程？


    ```ruby

    require ''open-uri''

    require ''json''

    FRONT_PAGE_URL = ''https://reddit.com/r/all.json''

    front_page = JSON.load(open(FRONT_PAGE_URL))

    top_post = front_page[''data''][''children''][0][''data'']

    puts The top post on reddit is:

    puts top_post[''title'']

    puts top_post[''uri'']

    ```


    根据定义，**编程**是构建软件的过程，软件由指令组成。这些指令基本上被称为**源代码**。源代码是一组计算机能够理解的书写指令。在整本书中，我们将使用这个概念，因此在开始之前你需要理解它。


    源代码源代码看起来到底像什么样？


    代码通常不遵循自然语言（如英语）的规则。看看这个小程序来理解我的意思：


    计算机实际上会字面意思地理解一切——例如，当你问计算机一个数字是偶数还是奇数时，它总是会回答“是”。不相信吗？看看下面的代码：


    ```ruby

    puts (5.odd? or 5.even)

    ```


    代码将显示 ''true''，从技术上来说，这是正确的。数字 5 要么是偶数是奇——尽管这并不是我的真实意思。


    编程还涉及**测试**和**调试**


    代码写好后，必须进行测试，因为仅仅编写代码并不能保证它是正确的。代码可能会偶尔崩溃、显示错误的结果、冻结或其他类似问题。专业程序员通常采用不同的方法来测试他们的代码，以试图避免此类问题。


    最后，我们有一个被称为**调试**（debugging）的术语——这是调查问题、诊断问题并在源代码中修复它的过程——你很快就会在书中发现，这本身就是一种技能。


    ## 那么，什么是 Java 编程语言？


    Java 编程语言是一种计算机编程语言，它的独特之处在于让你使用基于英语的命令来编写计算机指令，而不是使用通常的数字代码。它被称为**高级语言**，是因为人类可以轻松地阅读和编写它。尽管像英语一样，Java
    也有一些规则决定了这些指令是如何编写的；这些规则被称为它的**语法**。基本上，当程序被编写时，高级指令会被翻译成计算机可以理解并执行的数字代码。


    ## 那么，是谁创建了 Java？


    Java 是 90 年代初由一位名为詹姆斯·高斯林（James Gosling）的男子为太阳微系统公司（Sun Microsystems，目前由 Oracle
    拥有）创建的。该程序最初被称为 Oak，然后是 Green。


    Java 最初设计设计用于为由不同计算机处理器控制的家电器编程，随后用于手机等移动设备。很快，人们意识到这种语言需要能够被各种计算机处理器所访问。1994
    年，这种语言被认为是用于网络浏览器的理想选择，很快，它与互联网的连接就开始了。1995 年，Netscape 公司发布了能够运行 Java 程序的最新版本
    Netscape 浏览器；1996 年，当 Java 1.0 向公众发布时，它的重点已经转向在互联网上使用，通过为开发者提供一种创建动画网页的好方法，从而提供了与用户的交互性。


    从 1.0 版本开始，我们看到了许多更新和发展，例如：


    - J2SE 1.3 于 2000 年发布

    - J2SE 于 2004 年

    - Java SE 8 于 2014 年

    - Java SE 10 于 2018 年


    多年来，Java 无疑已经演成为一种你可以在互联网内外使用的极优秀且成功的语言。让我们接触一下使用 Java 编程语言的优点：


    ## 优点


    每种编程语言的引入都有其目的并具有某些优点。尽管每种语言都创造了开启蓬勃职业的机会，但 Java 通常更受青睐。Java 的优点确实数不胜数，但我将简要提到几点。


    - ✓ 你获得丰富的信息


    虽然现有的编程语言之间没有明显的竞争，但 Java 被认为是最好的——有时是因为它拥有丰富的信息。Java 已经存在了多年，所以对于脑中出现的关于编程的几乎所有查询，你可以预期快速答案。因此，在精炼技能的过程中，你可以轻松地解决你的每一个问题。


    - ✓ 易于学习


    有时新手倾向于认为语言越好，可能就越难学习。然而，事实并非如此——至少对 Java 来说。确实有一些不可避免的初始障碍，但该语言使用普通简单的英语来代替泛型或多个括号，这使得语言变得易于学习。当你学会如何正确地安装
    JDK 和配置 PATH 时，其余部分的学习和实现将变得非常有趣。


    - ✓ 你获得了一个很强大的工具箱


    你经常会听到，在编程中，语言的工具箱在决定其整体成功方面起着主要作用。Java 在这方面无疑具有优势，因为它对开源提供了完整的支持。这意味着作为用户，你可以获得几乎你所需的每种物品的工具。我们有很多开源项目提供了有关与
    Java 编程相关的所有主题的信息。


    - ✓ 你能从错误中学习


    我们有一些语言设计用于教你或允许你从自己的错误中建立基础。此外，该语言还建议你重格式代码并告诉你为什么要这么做。这样，你从基础阶段就能清晰地理解编码，并在开始旅程时极少犯错。


    - ✓ 该语言是免费的


    要获取 Java，你从一开始不需要支付任何费用。因此，无论你处于学习阶段还是专业阶段，都可以使用 Java 开发应用程序而无需支付任何资金。你只需要学习如何获取程序、设置它并开始。


    - ✓ 专业人士有更好的前景


    如果你打算学习一种编程语言来开启职业生涯，Java 仍然是你的最佳选择。它被应用于大多数现有应用，其范围仍在不断扩大。因此，通过学习这种语言，与其他语言的程序员相比，你可以获得更好的职业。


    ## 基础/先决条件


    本节介绍了你在开始编写任何代码之前需要的东西。要开始，你应该下载 Java（Java 环境-JRE/ Java 开发包- JDK）以及集成开发环境-IDE。


    下载和安装 Java 对于任何操作系统都是简单的。我将向你展示如何使用 Linux 和 Windows 操作系统下载并安装此程序。


    ## 1: Linux


    在本节结束时，你将在 Linux 机器上良好地安装并配置 Java——无论是 Debian、Mint 还是 Ubuntu。然而，我将在整个指南中使用 Ubuntu
    14.04，并还会提到终端和非终端的方法，以帮助在你是完全新手的情况下也能跟上。


    你将安装 Oracle JRE 或 Oracle JDK，所以你真的需要理解两者之间的区别。


