    \ 属性来定义是野生还是家养。当你在另一个语境下设计该类时，这个属性可能没有意义了。\n\n同样，问问你自己在这个类中将拥有什么样的行为。抽象在这里也被应用。重要的东西与过载的东西是不同的。从类中剥离掉一些信息，这个过程就是在使用或应用抽象。\n\
    \n当被问及封装和抽象之间的区别时，你可以说封装作为一种概念应用了抽象。因此，它仅仅是封装。但抽象是一个概念，它甚至被应用于多态（稍后讨论）和继承的一部分中。你需要从面向对象编程的其他概念（包括多态、继承和封装）中，从更高的层次来看抽象。\n\
    \n# 抽象与继承\n\n让我们以继承为例。在继承中，我们有一个父类和一个子类（也称为子类）。子类继承父类的属性和方法。然而，它也可以重写从父类继承的方法。这就是多态发挥作用的地方。子类可以为已经在父类中定义的方法提供自己的实现。\n\
    \n在 Java 中，继承通过 `extends` 关键字实现。\n\n```java\nclass Animal {\n    void eat() {\n\
    \        System.out.println(\"This animal eats food.\");\n    }\n}\n\nclass Dog\
    \ extends Animal {\n    void bark() {\n        System.out.println(\"The dog barks.\"\
    );\n    }\n}\n```\n\n在上面的例子中，`Dog` 是 `Animal` 的子类。它继承了 `Animal` 的 `eat()` 方法，但它也有自己独特的\
    \ `bark()` 方法。当我们创建一个 `Dog` 的对象时，可以同时调用 `eat()` 和 `bark()`。\n\n```java\nDog myDog\
    \ = new Dog();\nmyDog.eat();\nmyDog.bark();\n```\n\n# Java 中的多态\n\n多态意味着多种形式。在\
    \ Java 中，它允许对象呈现多种形式。实现多态最常见的方法是通过方法重写。当子类为已经在父类中定义提供特定实现时，就发生了方法重写。\n\n```java\n\
    class Animal {\n    void sound() {\n        System.out.println(\"Animal makes\
    \ a sound\");\n    }\n}\n\nclass Dog extends Animal {\n    @Override\n    void\
    \ sound() {\n        System.out.println(\"Dog barks\");\n    }\n}\n\nclass Cat\
    \ extends Animal {\n    @Override\n    void sound() {\n        System.out.println(\"\
    Cat meows\");\n    }\n}\n```\n\n在上面的例子中，`Dog` 和 `Cat` 都重写了 `Animal` 的 `sound()`\
    \ 方法。我们在 `Animal` 引用上调用 `sound()` 时，执行的是对应实际对象的方法。\n\n```java\nAnimal myDog =\
    \ new Dog();\nAnimal myCat = new Cat();\n\nmyDog.sound(); // 输出 Dog barks\nmyCat.sound();\
    \ // 输出 Cat meows\n```\n\n这就是多态行为。`Animal` 引用可以指向 `Dog` 和 `Cat` 对象，行为在运行时改变。\n\
    \n# 静态多态\n\n在 Java 语言中，我们通过方法重载来实现静态多态。方法重载意味着类中存在多个同名但参数类型或顺序不同的方法。\n\nJava 在编译时通过查看方法签名知道调用哪种方法。因此，这被称为静态绑定或编译时多态。\n\
    \n让下面的示例让你更清楚地理解这个概念：\n\n```java\nclass DemoOverload {\n    public int add(int\
    \ x, int y){//方法 1\n        return x+y;\n    }\n\n    public int add(int x, int\
    \ y, int z);//方法 2\n        return x+y+z;\n    }\n\n    public int add(double\
    \ x, int y);//方法 3\n        return (int)x+y;\n    }\n\n    public int add(int\
    \ x, double y);//方法 4\n        return x+(int)y;\n    }\n}\n\nclass Test {\n  \
    \  public static void main(String[] args){\n        DemoOverload demo=new DemoOverload();\n\
    \        System.out.println(demo.add(2,3)); // 调用方法 1\n        System.out.println(demo.add(2,3,4));\
    \ // 调用方法 2\n        System.out.println(demo.add(2,3.4)); // 调用方法 4\n        System.out.println(demo.add(2.5,3));\
    \ // 调用方法 3\n    }\n}\n```\n*(注：由于提供的原始文本中 `DemoOverload` 示例代码存在逻辑语法错误，如多余的分号和缺失括号），翻译时保持了原文的结构，仅对注释部分进行了翻译。)*\n\
