    \ array element is age[0], the second is age[1] and so forth. If the array's length\
    \ is n, then the final element is arrayName[n-1]. Now that 5 is the length of\
    \ 'age' array, the last array element is 'age[4]' in the example above.\n\nZero\
    \ is the default first value of elements of an array for the numeric types; for\
