    , new ArmoredCar());\nEmployee e2 = new Employee(\"Paul\", new SpaceCar());\n\
    Employee e3 = new Employee(\"Pavni\", new BMW());\n```\n\n## Encapsulation In\
    \ Java\n\nEncapsulation refers to the ability to package related behavior in an\
    \ object bundle and control or restrict their access in both function and data\
    \ from other objects. It essentially is all about packaging related stuff together\
    \ and keeping them away from external elements. You will note that encapsulation\
    \ with data hiding are used interchangeably all over. You should not misunderstand\
    \ that encapsulation is only about data hiding. When you say encapsulation, you\
    \ should emphasize on grouping, packaging or even bundling related data as well\
    \ as behavior together.\n\n![](img/7a31d4b199c3ce98626ee7cafe01163_184_0.png)\n\
    \nWHEN YOU ASSIGN A CLASS in object oriented programming, it is said that the\
    \ first principle you should consider is encapsulation. Group the associated data\
    \ and its behavior in a bucket. The main benefit of encapsulation is maintainability.\n\
    \nBelieve it all or not, that's pretty much it when it comes to encapsulation!\n\
    \nAny Java class that is well defined in its context domain is a good example\
    \ for Java encapsulation. Thus, the essence here is basically for bundling methods\
    \ and data together after this data hiding is highlighted. The term data hiding\
    \ in this case relates to the access specifiers in Java. It is easier to hide\
    \ an attribute or method from the outer word by using the access specifier ‘private’.\n\
    \nTherefore, hiding is quite plain and simple. But how about bundling method and\
    \ data? This in particular is important. You have to understand well the business\
    \ domain and design the class and group attributes, as well as its methods together\
    \ based on that. This process is vital in encapsulation.\n\nTake the Java encapsulation\
    \ outline example below. When you talk about an animal, you should have all its\
    \ attributes listed as well as its behavior such as how it will run, mate, hunt\
    \ and so forth. When you bundle all these behavior and data in one class, you\
    \ are essentially following the principles of encapsulation.\n"
  mdcn: "\n\n## 隐藏的基类静态成员\n\n如果派类以及基类和派类实际上定义了同名的静态方法和变量，会发生什么？是否可以像我们经常访问实例变量那样，在派类中访问基类中的“静态”成员？\n\
    \n我们将在下面的示例中找到答案：\n\n```java\n1 public class Car {\n2 public static String msg()\
    \ {\n3 return \"Car\";\n4 }\n5 }\n1 public class ArmoredCar extends Car {\n2 public\
    \ static String msg() {\n3 return super.msg(); // 这将无法编译。\n4 }\n5 }\n```\n\n不，你不能这样做。静态成员通常属于给定的类，而不是实例。这意味着我们不能在\
    \ `msg()` 中非静态关键字 `super`。\n\n考虑到静态成员通常属于特定的类，你可以按照以下方式修改之前的调用：\n\nreturn Car.msg();\n\
    \n考虑下面的示例，其中基类和派类都描述了一个具有相似签的静态方法：'msg()'。\n\n```java\npublic class Car {\n  \
    \  public static String msg() {\n        return \"Car\";\n    }\n\npublic class\
    \ ArmoredCar extends Car {\n    public static String msg() {\n        return \"\
    ArmoredCar\";\n    }\n}\n```\n\n以下是你可以调用它们的方法：\n\n```java\nCar first = new ArmoredCar();\n\
    ArmoredCar second = new ArmoredCar();\n```\n\n前面的代码 `first.msg()` 输出 'car'，而 `second.msg()`\
    \ 直接输出 'ArmoredCar'。调用的静态消息取决于引用 ‘ArmoredCar’ 实例时使用的变量类型。\n\n## 多重接口\n\n尝试想象我们在上一节中定义的\
    \ ‘ArmoredCar’ 被一个超级间谍所需要。因此，制造 ‘Car’ 的公司认为添加漂浮和飞行功能是最好的：\n\n```java\npublic interface\
    \ Floatable {\n    void floatOnWater();\n}\n\npublic interface Flyable {\n   \
    \ void fly();\n}\n\npublic class ArmoredCar extends Car implements Floatable,\
    \ Flyable {\n    public void floatOnWater() {\n        System.out.println(\"I\
    \ can float!\");\n    }\n\n    public void fly() {\n        System.out.println(\"\
    I can fly!\");\n    }\n}\n```\n\n在上面的代码中，你注意到使用了 `implements` 关键字来继承接口。\n\n##\
    \ 多重继承的问题\n\nJava 允许通过接口实现多重继承。在 Java 7 之前这不是一个问题，因为接口只能定义抽象方法（那些缺乏实现的方法）。因此，如果一个类使用相同的方法签名实现多个接口，这并不是一个问题；实现类最终只有一个方法需要实现。\n\
    \n现在让我们来看看当 Java 8 引入接口中的 `default` 方法时，简单的等式发生了什么变化。\n\n从 Java 8 开始，接口有了定义其方法的默认实现的选项——也就是说，接口仍然能够定义抽象方法。这意味着当一个类实现多个定义具有相同签名方法的接口时，子类实际上将继承不同的实现。这是不被允许的，就像它听起来很复杂一样。\n\
    \nJava 不允许对在单独接口中定义的相同方法进行多个继承。让我用示例来解释：\n\n```java\npublic interface Floatable\
    \ {\n    default void repair() {\n        System.out.println(\"Repairing Floatable\
    \ object\");\n    }\n}\n```\n\n```java\npublic interface Flyable {\n    default\
    \ void repair() {\n        System.out.println(\"Repairing Flyable object\");\n\
    \    }\n}\n```\n\n```java\npublic class ArmoredCar extends Car implements Floatable,\
    \ Flyable {\n    // 这将无法编译\n}\n```\n\n如果你想实现这两个接口，你必须重写方法 `repair()`。如果前面示例中的接口定义了同名的变量——例如\
    \ `duration`，你无法在没有接口名称位于变量名前的情况下访问它们：\n\n```java\npublic interface Floatable\
