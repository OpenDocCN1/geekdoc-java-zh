    \ return: 2 which is just 0000010 since in num 1 and num 2 binary form, it's only\
    \ the last bits that are matching.\n\nNum 1 | num 2 compares num 1 and num 2 bits\
    \ and then generates 1, that if either bit is 1, otherwise it returns zero. In\
    \ the case here, it returns 31, which essentially is 0011111.\n\nNum 1^ num 2\
    \ on the other hand compares the corresponding bits of num 2 and num 1 before\
    \ generating a 1; that is if they are not equal, otherwise it returns 0. In our\
    \ example here, it would return 29, which is equal to 00011101.\n\n-num happens\
    \ to be a complement operator that only changes the bit from 0 to 1 and to 1 to\
    \ 0. In the example we have here, it returns -12. This one is signed 8 bit equal\
    \ to 11110100.\n\nNum 1 << is a left shift operator, which is responsible for\
    \ transferring the bits towards the left hand side and discards the bit that is\
    \ far left, before assigning zeros to the rightmost bit. In the case here, the\
    \ output is 44. This figure is equivalent to 0101100.\n\nYou need to note that\
    \ in the example below, we are giving 2 to the right hand side of the shift operator,\
    \ which is the reason the bits are going 2 places towards the left hand side.\
    \ You can change this number and the bits would have to be moved by the specified\
    \ number of bits on the operator's right side. Num >> is a right shift operator,\
    \ which usually has a tendency of moving the bits to the right discarding the\
    \ far right bit, before assigning a value of 0. In the case here, the output is\
    \ 2, which is equal to 0000010. Let's take a look at an example of these operators:\n\
    \n```java\npublic class BitwiseOperatorDemo {\n    public static void main(String[]\
    \ args[]) {\n\n        int num1 = 11; /* 00001011 */\n        int num2 = 22; /*\
    \ 00010110 */\n        int result = 0;\n\n        result = num1 & num2;\n    \
