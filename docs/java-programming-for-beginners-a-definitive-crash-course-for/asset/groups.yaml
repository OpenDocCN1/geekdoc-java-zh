    Hermoine\n\n- **Do while** The do while loop is largely the same as the while\
    \ loop. The only difference however is that it checks for condition once it executes\
    \ the statements and thus, it is a good example of the exit control loop.\n\n\
    ```java\n{\n  statements..\n}\nwhile (condition);\n```\n\nThe flowchart is as\
    \ follows:\n\n![](img/7a31d4b199c3ce698626ee7cafe01163_92_0.png)\n\nThe do while\
    \ loop begins with the statement(s) execution. For the first time, there usually\
    \ isn’t any checking of any condition. Once the statements are executed, and there\
    \ is the update of the variable value, the condition gets checked for a true or\
    \ false value. In case it gets evaluated to true, the next loop iteration commences.\n\
    \nWhen the condition turns out to be false, and just like that, its life cycle\
    \ comes to an end. You need to remember that the do-while loop executes its statements\
    \ not less than once before checking of any condition; therefore, it is a good\
    \ example of the exit control loop.\n\n```java\n// Java program to illustrate\
    \ do-while loop\nclass dowhileloopDemo\n{\n    public static void main(String\
    \ args[])\n{\n        int x = 21;\n        do\n        {\n            // The line\
