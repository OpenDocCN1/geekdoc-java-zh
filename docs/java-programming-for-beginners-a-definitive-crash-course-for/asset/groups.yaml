    \ will give the following output:\nElement index 0: 12\nElement index 1: 4\nElement\
    \ index 2: 5\nElement index 3: 2\nElement index 4: 5\n\n# HOW CAN YOU ACCESS the\
    \ array?\n\nIt is easy to access and change the array elements with its numeric\
    \ index. Take the example below:\n\n```java\nclass ArrayExample {\n    public\
    \ static void main(String[] args) {\n        int[] age = new int[5];\n\n     \
    \   // insert 14 to third element\n        age[2] = 14;\n\n        // insert 34\
    \ to first element\n        age[0] = 34;\n\n        for (int i = 0; i < 5; i++)\
    \ {\n            System.out.println(\"Element at index \" + i + \": \" + age[i]);\n\
    \        }\n    }\n}\n```\n\nRunning the program will give you the following output:\n\
    Element index 0: 34\nElement index 1: 0\nElement index 2: 14\nElement index 3:\
    \ 0\nElement index 4: 0\n\n# An example of Java arrays\n\nBelow is a program that\
    \ calculates the average and sum of values stored in type int array:\n\n```java\n\
    class SumAverage {\n    public static void main(String[] args) {\n\n        int[]\
    \ numbers = {2, -9, 0, 5, 12, -25, 22, 9, 8, 12};\n        int sum = 0;\n    \
    \    Double average;\n\n        for (int number: numbers) {\n            sum +=\
    \ number;\n        }\n\n        int arrayLength = numbers.length;\n\n        //\
    \ Change sum and arrayLength to double as average is double\n        average =\
    \ ((double)sum / (double)arrayLength);\n\n        System.out.println(\"Sum = \"\
    \ + sum);\n        System.out.println(\"Average = \" + average);\n    }\n}\n```\n\
    \nRUNNING THE PROGRAM will give you the following output:\nSum = 36\nAverage =\
    \ 3.6\n\nThere are a few things here:\n\nThe int values, sum as well as arraylength\
    \ get converted into double to calculate the average because average is double.\
    \ This is known as type casting (see glossary). Getting the length of an array\
    \ uses the length attribute. In this case, numbers.length returns the length of\
    \ numbers.\n\n# Multidimensional Arrays\n\nSo far, we've been talking about one-dimensional\
    \ arrays. In Java though, you can declare arrays referred to as multidimensional\
    \ arrays. The following is an example to declare/ initialize a multidimensional\
