    \n大多数编程语言都有一组基础的原始类型，包括小数值（如单精度浮点数）、整数、字符串、字符和布尔值（这些值可以是 true 或 false）。这些类型以位集合的形式出现，而没有必要定义类的递归结构。此类原始类型可以作为构建块，用于根据创建的类构建更复杂的类型。为了讨论起见，我们假设\
