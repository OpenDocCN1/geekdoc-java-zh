    # Encapsulation In Java


    Encapsulation refers to the ability to package related behavior in an object bundle
    and control or restrict their access in both function and data from other objects.
    It essentially is all about packaging related stuff together and keeping them
    away from external elements. You will note that keywords encapsulation with data
    hiding are used interchangeably all over. You should not misunderstand that encapsulation
    is only about data hiding. When you say encapsulation, you should emphasize on
    grouping, packaging or even bundling related data as well as behavior together.


    ![](img/7a31d4b199c3ce698626ee7cafe01163_184_0.png)


    WHEN YOU ASSIGN A CLASS in object oriented programming, it is said that the first
    principle you should consider is encapsulation. Group the associated data and
    its behavior in a bucket. The main benefit of encapsulation is maintainability.


    Believe it all or not, that''s pretty much it when it comes to encapsulation!
    You can leave it as simple as that with nothing more or less.'
