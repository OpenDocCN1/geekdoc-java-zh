    With that in mind, let''s start our learning. In case you are completely new to
    this, we''ll start with the basics:


    ## Java Programming: A Background


    Before we get into Java programming, let''s first make sure we understand what
    computer programming (or coding) really is.


    ## What Is Programming?


    ```ruby

    require ''open-uri''

    require ''json''

    FRONT_PAGE_URL = ''https://reddit.com/r/all.json''

    front_page = JSON.load(open(FRONT_PAGE_URL))

    top_post = front_page[''data''][''children''][0][''data'']

    puts The top post on reddit is:

    puts top_post[''title'']

    puts top_post[''uri'']

    ```


    BY DEFINITION, PROGRAMMING is the process of building software, which is made
    up of instructions. These instructions are basically referred to as the source
    code. The source code is a set of written instructions that a computer understands.
    Throughout the book, we''ll be using this concept so you need to understand before
    we begin.


    What does the source code really look like?


    Code doesn''t typically follow the rules of natural languages, such as English.
    Take a look at this small program to understand what I mean:


    A computer actually takes everything literally-for instance, when you ask a computer
    if a number is even or odd, it will always respond with a ''yes''. Don''t believe
    me? Take a look at the code below:


    ```ruby

    puts (5.odd? or 5.even)

    ```


    THE CODE WILL DISPLAY ''true'', which is, technically speaking, right. The number
    5 is either even or odd-even though that''s not what I really meant.


    Programming also entails Testing and debugging


    When code is written, it has to be tested because just writing it does not guarantee
    that it is correct. The code could crash from time to time, or display incorrect
    results, freeze or any other problem like that. Professional programmers usually
    employ different methods to test their code to try to avert such problems.


    Lastly, we have a term referred to as debugging-this is the process of investigating
    a problem, diagnosing it and fixing it in source code-as you will soon find out
    in the course of this book, this is actually a skill in itself.


    ## So, what is Java programming language?


    Java programming language is a computer programming language that uniquely lets
    you write the computer instructions using English-based commands as opposed to
    writing them in the usual numeric codes. It is referred to as high-level language
    due to the fact that human beings can read and write it easily. Just like English
    though, Java has some rules, which determine how these instructions are written;
    these rules are referred to as its syntax. Basically, when the program is written,
    the high-level instructions are translated into numeric codes that are understandable
    and executable to computers.


    ## So, Who Created Java?


    Java was created in the early 90s by a man known as James Gosling for a company
    called Sun Microsystems (which is currently owned by Oracle). The program was
    originally called Oak, and then Green.


    Java was originally designed to be used to program home appliances controlled
    by different computer processors and then later, mobile devices like cell phones.
    Soon enough, came the realization that the language needed to be accessible by
    various computer processors. In 1994, the language was seen as ideal for use with
    web browsers and in no time, its connection to the internet started. In 1995,
    the latest version of the Netscape browser capable of running Java programs was
    released by Netscape Incorporated and in 1996, when Java 1.0 was released to the
    public, its main focus had already shifted to use on the internet, thus offering
    interactivity with users by providing developers a good way to create animated
    web pages.


    Since the 1.0 version, we have seen many updates and developments such as:


    - J2SE 1.3 released in 2000

    - J2SE in 2004

    - Java SE 8 in 2014

    - Java SE 10 in 2018


    Java has undeniably evolved over the years as a great and successful language
    you can use on and off the internet. Let''s touch on the benefits of using Java
    programming language:


    ## The Benefits


    Each programming language has been introduced with a purpose and has some benefits.
    Even though each language creates the opportunity to begin a flourishing career,
    Java is usually given preference. The benefits of Java in particular are indeed
    countless but I will mention a few briefly.


    - ✓ You get rich information


    While there is no obvious competition between existing programming languages,
    Java is considered the best-sometimes owing to its wealth of information. Java
    has been existing for many years so you can expect a quick answer to nearly all
    queries that come to mind with regards to programming. Thus, you can solve each
    one of your problems easily as you hone your skills in the process.


    - ✓ Ease of learning


    Sometimes beginners tend to think that the better language is, the harder it''s
    probably going to learn it. However, it is not true-least not with Java. There
    are definitely some unavoidable initial hurdles but the fact that the language
    uses ordinary and simple English in place of generics or multiple brackets makes
    the language easy to learn. When you learn how to install JDK and the installation
    of PATH the right way, the rest will be fun to learn and implement.


    - You get a great toolset


    You will often hear that in programming, the toolset of a language has a major
    role to play in determining its overall success. Java undeniably has an upper
    hand in this respect because it comes with a complete support for open source.
    This means that as a user, you can get tools for nearly everything you require.
    We have a number of open source that provide information on all topics to do with
    Java programming. Also, there are a number of communities-especially online to
    guide new programmers.


    - You get to learn from your mistakes


    We have a few languages that are designed to teach or allow you to learn from
    your own mistakes and let you build up your base. Java contains some great IDEs
    (IDE refers to Integrated Development Environment – see that you are tasked with
    updating your of errors as soon as you make them). Besides that, the language
    also suggests for you to reformat the codes and gives you the reason for doing
    that. That way, you get a clear understanding of coding right from the basic stage
    and barely yourself making any mistakes as you begin your journey as a professional.


    - The language is free


    To get Java, you don''t have to incur any cost from the very beginning. Therefore,
    whether you are in the learning stage or professional stage, you can create or
    develop an application using Java without paying anybody any cash at all. All
    you need to learn is how to get the program, set it up and begin.


    - Better scope for the professionals


    As you intend to learn a programming language to start a professional career,
    Java remains your best bet. It is applied in most existing apps and its scope
    is still being increased further. Therefore, by learning this language, you can
    expect a better career in the industry compared to another programmer specialized
    in another language.


    With all that in mind, let''s move on to actually getting started with Java.


    ## The Fundamentals/Prerequisites


    This section describes the things you need to get before you begin coding anything.
    To get started, you should download Java (Java runtime environment-JRE/ Java Development
    Kit- JDK), and the Integrated Development Environment-IDE.


    Downloading and installing Java is simple for any kind of operating system. I
    will show you how you can download and install this program using Linux and Windows
    operating systems as examples.


    ## 1: Linux


    By the end of this section, you will have Java well installed and configured for
    your Linux machine-whether it''s Debian, Mint or Ubuntu. I will, however, be using
    Ubuntu 14.04 for the duration of the guide and also mention the terminal and non-terminal
    ways of going about the process to help you follow in case you are a complete
    newbie.


    You are going to installing either Oracle JRE or Oracle JDK so you need to really
    understand the difference between the two.

