    \    }\n}\n```\n\nThe output is as follows:\n\nBike color= Black wheels= 2\nEngine\
    \ has been started\n\n## So what is the importance of composition?\n\n- You are\
    \ able to control other objects’ visibility to classes in composition and only\
    \ reuse what you need.\n- Composition lets you create back-end class when it is\
