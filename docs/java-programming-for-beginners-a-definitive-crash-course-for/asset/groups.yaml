    and their values don''t get shared among instances. Some people look at non-static
    fields as instance variables because their values tend to be unique to each class
    instance. For instance, the currentSpeed of a certain bicycle is independent from
    another’s currentSpeed.


    Further, you need to note the following:


    When a space is assigned for an object in the heap (see glossary), a slot for
    every instance variable value is made. These variables are made when objects are
    created using the keyword ‘new’ and destroyed when the object gets destroyed.
    Instance variables hold values that have to be referenced by multiple methods,
    block or constructor, or the essential parts of the state of an object that need
    to be present throughout the class.


    Instance variables could as well be declared within the class level right before
    or after use. Keywords used to specify accessibility of a class or type and its
    members, which are also known as access modifiers could be given for different
    instance variables.'
