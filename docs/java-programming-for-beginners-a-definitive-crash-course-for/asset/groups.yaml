    \n![](img/7a31d4b199c3ce698626ee7cafe01163_44_0.png)\n\nCLICK CLOSE WHEN THE installation\
    \ completes.\n\n![](img/7a31d4b199c3ce698626ee7cafe01163_44_1.png)\n\nSET JAVA\
    \ ENVIRONMENT VARIABLES: classpath and path\n\nThe path variable offers the location\
    \ of executables such as java, javac and so forth. You can be able to run a program\
    \ without specifying the PATH but you'll require a full path of executable such\
    \ as C:\\Program Files\\Java\\jdk1.8.0_131\\bin\\javac as opposed to the simple\
    \ javac A_Java\n\nThe variable 'CLASSPATH' provides the library files' location.\
    \ We'll now look at the steps to set the CLASSPATH and PATH. Right click on 'My\
    \ Computer' and then select 'properties'\n\n![](img/7a31d4b199c3ce698626ee7cafe01163_45_0.png)\n\
    \nSELECT 'ADVANCED SYSTEM settings' and then 'environment variables'.\n\n- Control\
    \ Panel Home\n- Device Manager\n- Remote settings\n- System protection\n- Advanced\
    \ system settings\n\n![](img/7a31d4b199c3ce698626ee7cafe01163_46_0.png)\n\nIN\
    \ THE ‘USER select the ‘new’ button..\n\n![](img/7a31d4b199c3ce698626ee7cafe01163_46_1.png)\n\
    \nIN THE ‘VARIABLE type PATH.\n\n![](img/7a31d4b199c3ce698626ee7cafe01163_47_0.png)\n\
    \nCOPY THE BIN FOLDER's path that is installed in the JDK folder:\n\n![](img/7a31d4b199c3ce698626ee7cafe01163_47_1.png)\n\
    \nPASTE THE BIN FOLDER's path in variable value and then click on the 'OK' button.\n\
    \n![](img/7a31d4b199c3ce698626ee7cafe01163_47_2.png)\n\nIF YOU HAVE A PATH variable\
    \ set in your PC already, just edit the PATH to the following:\nPATH =<JDK installation\
    \ directory>\\bin;%PATH%;\n\nIn this case, the %PATH% joins the existing path\
    \ variable to your new value\n\nTo set CLASSP, just follow the same process.\n\
    \n![](img/7a31d4b199c3ce698626ee7cafe01163_48_0.png)\n\nIF YOU REALI YOUR installation\
    \ is not working after you complete, just change the classpath to the:\nCLASSPATH\
    \ = <JDK installation directory>\\lib\\tools.jar;\n\nNow tap the 'ok' button.\n\
    \n![](img/7a31d4b199c3ce698626ee7cafe01163_48_1.png)\n\nNOW GO TO YOUR COMMAND\
    \ prompt and enter javac commands. If the screen is similar to the one below,\
    \ Java has been installed successfully.\n\n```\nC:\\Users\\Guru99-Jayesh> javac\n\
    Usage: javac <options> Source-files\n  -g                     Generate all debugging\
    \ info\n  -none                 Generate no debugging info\n  -d(lines,var,source)\
    \  Generate no warnings\n  -lint                 Show what compiler is doing\n\
    \  -deprecation          Output source locations where deprecated APIs are used\n\
    \  -classpath(path)      Specify where to use class files and annotation processors\n\
    \  -p (path)              Specify where to generate class files\n  -bootstrapclass(path)\
    \ Specify where to use class files and annotation processors override location\
    \ of bootstrap class files\n  -endorsdir<dir>       Override location of standards\
    \ path\n  -Xmaxmem              Maximum memory of memory during compilation is\
    \ done.\n  -processor([class1],[class2],...) Names of annotation processors to\
    \ run; bypass default process\n  -parameters           Generate metadata for reflection\
    \ on methods\n  -d<directory>          Specify where place source files\n  -h<directory>\
    \          Specify where generate header files\n  -implicit(class,class) Specify\
    \ whether or not generate class files implicitly referenced files\n  -source release\
    \        Provide source compatibility with specified release\n  -target release\
    \        Check that used API is available in the specified profile\n  -profile<profile>\
    \      Version information to include in the specified profile\n  -key=[value]\
    \           Options to annotation processors-<flag> Pass directly to the runtime\
    \ system\n  -sourcepath            Search for source files recursively\n  -@filename\
    \             Read options from file\n```\n\nAn IDE (Integrated Development Environment)\
    \ makes you productive in development as it helps you important tasks such as\
    \ coding, refactoring, running web apps and testing. Nonetheless the most important\
    \ factor it offers to me, is speed (days of sitting around and waiting for stuff\
    \ to compile or load). An IDE such as Eclipse is extremely fast, doesn't suck\
    \ up memory and takes short time to load, and doesn't take lots of time to synchronize\
    \ changes. A good programming expert would also mention other features you to\
    \ enjoy such as integration with code repositories (see glossary) and checking\
    \ of errors as static analysis and highlighting unused references.\n\n# Steps\
    \ Of Installing Eclipse For Windows\n\n# Download Eclipse\n\nGo to this link and\
    \ download the latest version: ![](img/7a31d4b199c3ce698626ee7cafe01163_51_0.png)\n\
    \nCLICK ‘DOWNLOAD PACKAGES’ under 'get eclipse'. As a beginner, you should select\
    \ the fourth entry IDE for Java Developers (32-bit or 64-bit).\n\n| | DOWNLOADS\
    \ | |\n||---|---|---|\n| 349 MB | 12104 | Mac Cocoa 64-bit Linux 32-bit 64-bit\
    \ |\n| The essential tools for Java and DSL developers, including a Java & Xtend\
    \ IDE, DSL Framework (Xtext), Git client, XML Editor, and Maven Integration. |\
    \ | |\n| 195 MB | 172013 | Windows 32-bit 64-bit Mac Cocoa 64-bit Linux 32-bit\
    \ 64-bit |\n| The essential tools for any Java developer, including a Java IDE,\
    \ Git client, XML Editor, Maven and Gradle Integration. | | |\n| 172 MB | 49333\
    \ | Windows 32-bit 64-bit Mac Cocoa 64-bit Linux 32-bit 64-bit |\n| Eclipse IDE\
    \ for JavaScript and Web Developers | | |\n\nCLICK DOWNLOAD.\n\nThe next step\
    \ entails unzipping the downloaded file to install it. Unzip the file into a designated\
    \ directory (for instance, c:\\javaproject). You don't need to run any installer.\
    \ What more, you can just delete the whole eclipse directory when you need it\
    \ anymore (without having to run the uninstaller). Feel free to rename or move\
    \ the directory. Also note that you can install more than one copy on the same\
    \ machine.\n\n# Installing Eclipse on Mac OS X\n\nRepeat the same process of downloading\
    \ and installing Eclipse for windows explained above using this link. Just ensure\
    \ to select Mac OS X (cocoa). When you select 'eclipse IDE for Java Developers',\
    \ you'll get a DMG file. Double click this downloaded file (DMG) and follow the\
    \ instructions given thereafter to install the program. The program will be installed\
    \ in the location: /Applications/eclipse.\n\nNote that you may alternatively download\
    \ a TAR ball (.tar.gz); double click to be able to expand into a folder known\
    \ as 'eclipse' and then drag this expanded folder into the 'Applications' folder.\n\
    \n# Installing Eclipse on Ubuntu Linux\n\nInstall Eclipse for java by downloading\
    \ from [this page](##). As usual download the ‘packages’ and for platform, select\
    \ ‘Linux’, then ‘eclipse’ IDE for Java developers’ for Java SE program development.\
    \ You will get a .tar ball in the downloads folder and installation will be under\
    \ /usr/local\n\n1. // Unzip the tarball into /usr/local\n2. $ cd /usr/local\n\
    3. $ sudo tar xvzf ~/Downloads/eclipse-java-oxygen-2-linux-gtk-x86_64.tar.gz\n\
    4. // Extract the downloaded package\n5. // x: extract, z: for unzipping gz, v:\
    \ verbose, f filename\n6. // Extract into /usr/local/eclipse\n7. // You can also\
    \ unzip in \"File Explorer\" by double-clicking the tarball.\n8.\n9. // (Optional)\
    \ Change ownership\n10. $ cd /usr/local\n11. $ sudo chmod -R your-username:your-groupname\
    \ eclipse\n12. // Change ownership to your chosen username and groupname\n13.\
    \ // -R recursive\n14.\n15. Set up a symlink to /usr/bin (which is in the PATH)\n\
    16. $ cd /usr/bin\n17. $ sudo ln -s /usr/local/eclipse/eclipse\n18. // Make a\
    \ symlink in /usr/bin, which is in the PATH.\n19. $ ls -ld /usr/bin/eclipse\n\
    20. lrwxrwxrwx 1 root root 26 Aug 30 11:53 /usr/bin/eclipse -> /usr/local/eclipse/eclipse\n\
    21. $ which eclipse\n/usr/bin/eclipse\n\nTO RUN ECLIPSE, JUST open the folder\
    \ ‘/usr/local/eclipse’ and then click on the icon ‘Eclipse’; or just start a terminal\
    \ and enter ‘Eclipse’.\n"
  mdcn: "\n\n# Java SE 开发工具包 9 下载\n\n感谢下载此版本的 Java™ 平台标准版开发工具包 (JDK™)。JDK 是用于构建应用程序以及使用\
    \ Java 编程语言组件的开发环境。\n\nJDK 包含了用于开发和测试用 Java 语言编写并运行在 Java 平台上的程序的工具。\n\n另请：\n\n\
    - Java 开发者通讯：从您的 Oracle 账户，选择“订阅”（Subscriptions），展开“技术”（Technology），并订阅 Java\n\
    - Java 开发者日实操工作坊（免费）和其他活动\n- Java 杂志\n\n## JDK 9.0.1 校验和\n\n# Java SE 开发工具包 9.0.1\n\
    \n您必须接受 Oracle Java SE 二进制许可协议才能下载此软件。\n\n| 产品 / 文件 描述 | 文件大小 | 下载 |\n|---|---|---|\n\
    | Linux | 304.99 MB | jdk-9.0.1_linux-x64_bin rpm |\n| Linux | 338.11 MB | jdk-9.0.1_linux-x64_bin.tar.gz\
    \ |\n| macOS | 382.11 MB | jdk-9.0.1_osx-x64_bin.dmg |\n| Windows | 375.51 MB\
    \ | jdk-9.0.1_windows-x64_bin.exe |\n| Solaris SPARC | 206.85 MB | jdk-9.0.1_solaris-sparc9_bin.tar.gz\
    \ |\n\n当您的下载完成后，运行 exe 文件安装 JDK，并点击“下一步”。\n\n![](img/7a31d4b199c3ce698626ee7cafe01163_44_0.png)\n\
    \n安装完成后点击“关闭”。\n\n![](img/7a31d4b199c3ce698626ee7cafe01163_44_1.png)\n\n设置 JAVA\
    \ 环境变量：classpath 和 path\n\npath 变量提供了 java、javac 等可执行文件的位置。您可以在不指定 PATH 的情况下运行程序，但需要可执行文件的完整路径，例如\
    \ `C:\\Program Files\\Java\\jdk1.8.0_131\\bin\\javac`，而不是简单的 `javac A_Java`\n\n\
    变量 'CLASSPATH' 提供了库文件的位置。我们现在来查看设置 CLASSPATH 和 PATH 的步骤。右键点击“我的电脑”，然后选择“属性”。\n\
    \n![](img/7a31d4b199c3ce698626ee7cafe01163_45_0.png)\n\n选择“高级系统设置”，然后点击“环境变量”。\n\
    \n- 控制面板首页\n- 设备管理器\n- 远程设置\n- 系统保护\n- 高级系统设置\n\n![](img/7a31d4b199c3ce698626ee7cafe01163_46_0.png)\n\
    \n在“用户变量”中选择“新建”按钮..\n\n![](img/7a31d4b199c3ce698626ee7cafe01163_46_1.png)\n\n\
    在“变量名”类型输入 PATH。\n\n![](img/7a31d4b199c3ce698626ee7cafe01163_47_0.png)\n\n复制安装在\
    \ JDK 文件夹中的 bin 文件夹路径：\n\n![](img/7a31d4b199c3ce698626ee7cafe01163_47_1.png)\n\
    \n将 bin 文件夹的路径粘贴到“变量值”中，然后点击“确定”按钮。\n\n![](img/7a31d4b199c3ce698626ee7cafe01163_47_2.png)\n\
    \n如果您的 PC 已设置了 PATH 变量，只需将 PATH 修改为：\nPATH =<JDK 安装目录>\\bin;%PATH%;\n\n在这种情况下，%PATH%\
    \ 将现有的路径变量连接到您的新值中。\n\n要设置 CLASSPATH，只需遵循相同的过程。\n\n![](img/7a31d4b199c3ce698626ee7cafe01163_48_0.png)\n\
    \n如果在完成完成后发现安装未生效，请将 classpath更改为：\nCLASSPATH = <JDK 安装目录>\\lib\\tools.jar;\n\n\
    现在点击“确定”按钮。\n\n![](img/7a31d4b199c3ce698626ee7cafe01163_48_1.png)\n\n现在进入您的命令提示符并输入\
    \ javac 命令。如果屏幕如下所示，说明 Java 已成功安装。\n\n```\nC:\\Users\\Guru99-Jayesh> javac\nUsage:\
    \ javac <options> Source-files\n  -g                     生成所有调试信息\n  -none   \
    \              不生成调试信息\n  -d(lines,var,source)  不生成警告\n  -lint               \
    \  显示编译器正在执行\n  -deprecation          输出使用已弃 API 的源码位置\n  -classpath(path)   \
    \   指定使用类文件和注解处理器的位置\n  -p (path)              指定生成类文件的位置\n  -bootstrapclass(path)\
    \ 指定使用类文件和注解处理器的位置，以覆盖引导类文件的位置\n  -endorsdir<dir>       覆盖标准标准路径的位置\n  -Xmaxmem\
    \              编译期间的最大内存\n  -processor([class1],[class2],...) 运行注解处理器的名称\n  -parameters\
    \           为方法生成元数据\n  -d<directory>          指定放置源文件的位置\n  -h<directory>   \
    \       指定生成头文件的位置\n  -implicit(class,class) 指定是否隐含生成类文件\n  -source release  \
    \      与指定的发布版本兼容\n  -target release        检查指定的发布版本中使用的 API\n  -profile<profile>\
    \      包含在指定配置文件版本版本\n  -key=[value]           直接传递给运行系统的选项\n  -sourcepath   \
    \         递归搜索源码\n  -@filename             从文件读取选项\n```\n\nIDE（集成开发环境）让开发变得高效，因为它可以帮助您完成编码、重构、运行应用程序和测试等重要任务。尽管如此，最重要的因素是速度（等待编译或加载的时间）。像\
    \ Eclipse 这样的 IDE 非常快，不占用内存且加载时间短，并且不需要大量时间同步更改。优秀的程序员还会提到其他功能，例如与代码库集成以及静态分析和高亮。\n\
    \n# 在 Windows 上安装 Eclipse\n\n# 下载 Eclipse\n\n访问此链接下载最新版本：![](img/7a31d4b199c3ce698626ee7cafe01163_51_0.png)\n\
    \n在“get eclipse”下点击“DOWNLOAD PACKAGES”。作为初学者，您应该选择 Java 开发者的 IDE（32 位或 64 位）。\n\
    \n| | 下载内容 | |\n|---|---|---|\n| 349 MB | 12104 | Mac 64位 Linux 32位 |\n| Java\
    \ 和 DSL 开发者的必备工具，包括 Java IDE、DSL 框架 (Xtext)、文本编辑器和 Maven 集成。 | | |\n| 195 MB |\
    \ 172013 | Windows 32位 Mac Cocoa Linux 64位 |\n| 任何 Java 开发者的必备工具，包括 Java IDE、Git\
    \ 客户端、文本编辑器和 Gradle 集成。 | | |\n| 172 MB | 49333 | Windows 32位 Mac Cocoa Linux\
    \ 64位 |\n| JavaScript 和 Web 开发者的 IDE | | |\n\n点击下载。\n\n下一步是解压下载的文件进行安装。将文件解压到指定的目录（例如\
    \ `c:\\javaproject`）。您不需要运行任何安装程序。此外，当不再需要时，可以直接删除整个 eclipse 文件夹。可以随意重命名或移动目录。此外请注意，可以在同一机器上安装多个副本。\n\
    \n# 在 Mac OS X 上安装 Eclipse\n\n使用此链接重复上述下载和安装 Eclipse 的过程。只需选择 Mac OS X (cocoa)。当您选择“Java\
    \ Developers IDE”时，将得到一个 DMG 文件。双击此下载的文件 (DMG) 并按照后续说明安装程序。程序将安装在：/Applications/eclipse\n\
    \n注意您也可以下载 TAR 包 (.tar.gz)；双击即可展开名为“eclipse”的文件夹，然后将展开的文件夹拖入“Applications”文件夹。\n\
    \n# 在 Ubuntu Linux 上安装 Eclipse\n\n从[此页面](##) 下载 Java 版 Eclipse。按照习惯下载“packages”，平台选择“Linux”，然后选择用于\
    \ Java SE 程序开发的“Java Developers IDE”。您将在下载文件夹中获得 .tar 包，安装位于 /usr/local\n\n1.\
    \ // 将 tar 包解压到 /usr/local\n2. $ cd /usr/local\n3. $ sudo tar xvzf ~/Downloads/eclipse-java-oxygen-2-linux-gtk-x86_64.tar.gz\n\
    4. // 提取下载的包\n5. // x: 提取, z: 解压缩 gz, v: 详细, f: 文件\n6. // 提取到 /usr/local/eclipse\n\
    7. // 您也可以在“文件管理器”中双击 tar 包来解压\n8.\n9. // （可选）更改所有者\n10. $ cd /usr/local\n11.\
    \ $ sudo chmod -R your-username:your-groupname eclipse\n12. // 将所有者更改为指定的用户名和组名\n\
    13. // -R 递归\n14.\n15. 设置到 /usr/bin 的软链接（在 PATH 中）\n16. $ cd /usr/bin\n17. $ sudo\
    \ ln -s /usr/local/eclipse/eclipse\n18. // 在在 PATH 中的 /usr/bin 中创建软链接\n19. $ ls\
    \ -ld /usr/bin/eclipse\n20. lrwxrwxrwx 1 root root 26 Aug 30 11:53 /usr/bin/eclipse\
    \ -> /usr/local/eclipse/eclipse\n21. $ which eclipse\n/usr/bin/eclipse\n\n要运行\
    \ ECLIPSE，只需打开“/usr/local/eclipse”文件夹并点击图标“Eclipse”；或者启动终端并输入“Eclipse”。\n\n"
