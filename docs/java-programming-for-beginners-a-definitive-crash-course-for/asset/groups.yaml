    \ the child class would actually inherit different implementations. This is not\
    \ allowed just as it sounds complex.\n\nJava doesn't allow multiple implementations’\
    \ inheritance of the same methods that are defined in separate interfaces. Let\
    \ me explain with an example:\n\n```java\npublic interface Floatable {\n    default\
    \ void repair() {\n        System.out.println(\"Repairing Floatable object\");\n\
    \    }\n}\n```\n\n```java\npublic interface Flyable {\n    default void repair()\
    \ {\n        System.out.println(\"Repairing Flyable object\");\n    }\n}\n```\n\
    \n```java\npublic class ArmoredCar extends Car implements Floatable, Flyable {\n\
    \    // this won't compile\n}\n```\n\nIF YOU DESIRE TO IMPLEMENT the two interfaces,\
    \ you'll have to override the method 'repair()'. If the interfaces in the earlier\
