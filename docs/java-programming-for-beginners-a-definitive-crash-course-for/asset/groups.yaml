- md: "\n## Lock Eclipse on the launcher\n\nJust start the program and right click\
    \ the Eclipse icon and then click lock to launcher. If you are using an older\
    \ version (and thus the above is not working), just create a file `/usr/share/applications/eclipse.desktop`\
    \ with the contents below:\n\n```text\n[Desktop Entry]\nName=Eclipse\nType=Application\n\
    Exec=eclipse\nTerminal=false\nIcon=/usr/local/eclipse/icon.xpm\nComment=Integrated\
    \ Development Environment\nNoDisplay=false\nCategories=Development;IDE;\nName[en]=Eclipse\n\
    ```\n\nYou can now write your first Java program or project in Eclipse.\n\nLaunch\
    \ Eclipse (run ‘eclipse.exe’) from the Eclipse installed directory and then select\
    \ an appropriate directory for your workspace- i.e. where you would want to save\
    \ your files (such as c:\\javaproject\\eclipse for windows).\n\nIf the screen\
    \ named ‘welcome’ pops up, click the button labelled ‘cross’ next to the ‘welcome’\
    \ title.\n\nFor all Java applications, you have to create a project to to have\
    \ all the classes (discussed in a bit), source files and important resources.\n\
    \nDo the following to create the project:\n\nSelect ‘file’ menu then ‘new’, then\
    \ ‘java project’ (or ‘file’ then ‘new’ then ‘project’ then ‘java project.’)\n\
    The dialog named ‘new java project’ will pop up.\nEnter ‘firstproject’ in the\
    \ ‘project name’.\n\nCheck the ‘user default location’.\nSelect ‘use default JRE’\
    \ in JRE.\nCheck the ‘use project folder as the root for sources and class files’\
    \ in the ‘project layout’ and then push the button labeled ‘finish’.\n\nBefore\
    \ we continue (write our first project), let’s go over some of the basic concepts\
    \ of Java.\n\n## Java Tokens\n\nTokens are basically the tiniest logical components\
    \ of Java and any other program. The first step of the compiler is to separate\
    \ the whole program into smaller bits known as tokens. You can think of them as\
    \ the building blocks of a program.\n\nTokens are basically anything in a program\
    \ that a compiler can identify during the compilation process or tokenization.\
    \ Let's take a look at the types of tokens:\n\n- Keywords\n- Operators\n- Literals\n\
    - Separators\n- Comments\n- Literals\n\nLet's have a brief description of each\
    \ one of them so that you get a better understanding.\n\nKeywords are special\
    \ words or what are known as ‘reserved’ words in Java as they have a special meaning.\
    \ We have a list of 50 keywords, which are highlighted below:\n\n| byte | short\
    \ | int | long | double | float | char | boolean | void | public |\n| :--- | :---\
    \ | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| private | static\
    \ | import | package | class | interface | extends | implements | if | else |\n\
    | for | do | while | switch | case | instanceof | return | native | new | synchronized\
    \ |\n| strictfp | super | this | volatile | try | catch | finally | final | protected\
    \ | transient |\n| default | assert | break | continue | throw | throws | goto\
    \ | abstract | const | enum |\n\n## Identifiers\n\nIdentifiers are those names\
    \ programmers use in program to any method, class, variable, packages, objects,\
    \ labels or interfaces in Java programs (you'll learn more on the meaning of these\
    \ terms in due course).\n\nWe have rules of naming identifiers, which include\
    \ the following:\n\n- You cannot have any special symbols in Java identifiers\
    \ apart from the dollar sign $ and the underscore (_). Identifiers need to begin\
    \ from digits.\n- The keywords are reserved already and contain special meaning\
    \ – so they can't be used as identifiers.\n- The reserved literals are also allowed\
    \ as identifiers; for instance-null, false and true.\n- You cannot use one name\
    \ for multiple identifiers. Identifiers also have to be case-sensitive thus the\
    \ Mf and mf variables are very different.\n\nSome good examples of valid identifiers\
    \ in this case include the following:\n\n```\npasa 1, Name, roll_no, $raju, string\n\
    ```\n\nInvalid identifiers would include something like:\n\nTrue (reserved literal),\
    \ Roll-no (a special character has been used), 16sita (begins with a number) and\
    \ try (this is a java keyword).\n\nNOTE: reserved literals and keywords in Java\
    \ are those words you cannot use as variables or function names.\n\n## Operators\n\
    \nOperators are the symbols you'll use to produce some result as you apply with\
    \ some operands. We have different types of operators in Java. As you will note,\
    \ some strings can also be used as operators. Essentially operators are important\
    \ in Java when it comes to building expressions and statements – some of them\
    \ include: -, +, *, =, >= and so forth.\n\n## Separators\n\nSeparators are also\
    \ referred to as punctuators. These special characters and symbols separate different\
    \ parts of code from others. Sometimes, they connect and separate either one or\
    \ multiple tokens or organize a code block – that's why we call them separators.\n\
    \nIn Java, punctuators that are used include semi-colon (;), period (.), comma\
    \ (,), pair of square brackets, group of parenthesis, pair of braces.\n\n## Literals\n\
    \nLiterals refer to any values in Java programming that don’t change in the process\
    \ of program execution. You can think of them as constants for literals. These\
    \ are constant values of some string type or primitive type. Any literal that\
    \ is used in Java needs to be one of the types mentioned below:\n\n## Character\n\
    \nThis is what stores the Character constants in the memory. It basically takes\
    \ up a size of 2 bytes but can hold only one character since char stores Unicode\
    \ sets of characters. It contains a maximum value of 65,535.\n\n## Integer\n\n\
    Integer types can hold whole numbers.\n\n| Type | Size | Range |\n| :--- | :---\
    \ | :--- |\n| byte | 1 byte | -128 to 127 |\n| short | 2 bytes | -32,768 to 32,767\
    \ |\n| int | 4 bytes | -2,147,483,648 to 2,147,483,647 |\n| long | 8 bytes | -9,223,372,036,854,775,808\
    \ to 9,223,372,036,854,775,807 |\n| float | 4 bytes | - |\n| double | 8 bytes\
    \ | - |\n| char | 2 bytes | - |\n| boolean | 1 byte | true, false |\n\n## Floating\
    \ point\n\nThese are fractional numbers.\n\n## Boolean\n\nBoolean types basically\
    \ store states: true or false.\n\n## Comments\n\nIn Java, comments are used for\
    \ documentation. Some compilers ignore them. Single-line comments begin with:\n\
    \n```java\n// This is a comment\n```\n\nMulti-line comments begin with:\n\n```java\n\
    /* This is a multi-line \n   comment */\n```\n\n## Variables\n\nVariables are\
    \ containers that store data in programming. When a variable is declared, it is\
    \ initialized with some value and then changed to another value later. A variable\
    \ can be further used to do any calculations, printing and so forth. Each variable\
    \ needs to have a datatype such as Boolean, int and so on, and that type needs\
    \ to be specified at the time the variable was declared. Each variable needs to\
    \ have a non-duplicate or unique name to identify it.\n\nLet's take an example\
    \ of a student program. In such, we can have a single variable to store 'the student\
    \ section', another one for 'student roll number' and so forth.\n\n```java\nchar\
    \ section;\nint roll_number;\n```\n\n```java\nclass Test{\n  public static void\
    \ main(String args[]){\n    char section = 'C';\n    int roll_number = 76;//assign\
    \ 76 to roll number\n  }\n}\n```\n"
  mdcn: "\n\n## 将 Eclipse 锁定到启动器\n\n只需启动程序，右键点击 Eclipse 图标，然后点击“锁定到启动器”。如果你使用的是旧版本（因此上述方法无效），请创建一个名为\
    \ `/usr/share/applications/eclipse.desktop` 的文件，内容如下：\n\n```text\n[Desktop Entry]\n\
    Name=Eclipse\nType=Application\nExec=eclipse\nTerminal=false\nIcon=/usr/local/eclipse/icon.xpm\n\
    Comment=Integrated Development Environment\nNoDisplay=false\nCategories=Development;IDE;\n\
    Name[en]=Eclipse\n```\n\n现在你可以在 Eclipse 中编写你的第一个 Java 程序或项目了。\n\n从 Eclipse 安装目录启动\
    \ Eclipse（运行 `eclipse.exe`），然后为你的工作空间选择一个合适的目录——即你想要保存文件的地方（例如 Windows 上的 `c:\\\
    javaproject\\eclipse`）。\n\n如果弹出名为“welcome”的窗口，点击“welcome”标题旁边标记有“cross”的按钮。\n\n\
    对于所有的 Java 应用程序，你都必须创建一个项目来包含所有的类（稍后会讨论）、源文件和重要资源。\n\n按照以下步骤创建项目：\n\n1. 选择 ‘file’\
    \ 菜单，点击 ‘new’，然后选择 ‘java project’（或者 ‘file’ -> ‘new’ -> ‘project’ -> ‘java project’）。\n\
    2. 将弹出名为 ‘new java project’ 的对话框。\n3. 在 ‘project name’ 中输入 ‘firstproject’。\n4.\
    \ 勾选 ‘user default location’。\n5. 在 JRE 中选择 ‘use default JRE’。\n6. 在 ‘project\
    \ layout’ 中勾选 ‘use project folder as the root for sources and class files’，然后点击标记有\
    \ ‘finish’ 的按钮。\n\n在我们继续（编写第一个项目）之前，让我们先回顾 Java的一些基本概念。\n\n## Java 标记 (Tokens)\n\
    \n标记基本上是 Java 以及任何其他程序中最小的逻辑组件。编译器的第一步是将整个程序分成称为标记的较小部分。你可以将它们视为程序的构建块。\n\n标记基本上是程序中编译器在编译过程或标记化过程中可以识别的任何内容。让我们来看标记的类型：\n\
    \n- 关键字 (Keywords)\n- 运算符 (Operators)\n- 字面量 (Literals)\n- 分隔符 (Separators)\n\
    - 注释 (Comments)\n- 字面量 (Literals)\n\n让我们对每一个项进行简要描述，以便你更好地理解。\n\n关键字是 Java 中特殊的单词，或者被称为“保留”字，因为它们有特殊的含义。我们有一份\
    \ 50 个关键字的列表，如下文所示：\n\n| byte | short | int | long | double | float | char | boolean\
    \ | void | public |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\
    \ :--- | :--- |\n| private | static | import | package | class | interface | extends\
    \ | implements | if | else |\n| for | do | while | switch | case | instanceof\
    \ | return | native | new | synchronized |\n| strictfp | super | this | volatile\
    \ | try | catch | finally | final | protected | transient |\n| default | assert\
    \ | break | continue | throw | throws | goto | abstract | const | enum |\n\n##\
    \ 标识符 (Identifiers)\n\n标识符是程序员在程序中用于 Java 程序中任何方法、类、变量、包、对象、标签或接口的名称（你将在以后学习更多这些术语的含义）。\n\
    \n我们有标识符的命名规则，包括以下内容：\n\n- 在 Java 标识符中，除了美元符号 $ 和下划线 (_) 之外不能包含任何特殊符号。标识符需要从数字开头。\n\
    - 已经被保留并包含特殊含义——因此它们不能作为标识符。\n- 保留字面量也允许作为标识符；例如-null、false 和 true。\n- 你不能为多个标识符使用同一个名称。标识符还区分大小写，因此\
    \ `Mf` 和 `mf` 变量是完全不同的。\n\n在这种情况下，有效标识符的一些良好示例包括：\n\n```\npasa 1, Name, roll_no,\
    \ $raju, string\n```\n\n无效的标识符包括类似的内容：\n\n`True`（保留字面量）、`Roll-no`（使用了特殊字符）、`16sita`（以数字开头）以及\
    \ `try`（这是一个 Java 关键字）。\n\n注意：Java 中的保留字面量和关键字是那些你不能作为变量或函数名的单词。\n\n## 运算符 (Operators)\n\
    \n运算符是你用于与某些操作数结合产生某些结果的符号。我们在 Java 中有不同类型的运算符。正如你注意到的，某些字符串也可以用作运算符。从根本上说，在构建表达式和语句时，运算符在\
    \ Java 中是非常重要的——其中包括 `-`、`+`、`*`、`=`、`>=` 等。\n\n## 分隔符 (Separators)\n\n分隔符称为标记。这些特殊字符和符号将代码的不同部分与其他部分隔离开。有时，它们连接并分离一个或多个标记，或者组织代码块——这就是为什么我们称之为分隔符。\n\
    \n在 Java 中，使用的标点符号包括分号 (;)、句号 (.)、逗号 (,)、方括号 `[]`、圆括号 `()` 大括号 `{}`。\n\n## 字面量\
    \ (Literals)\n\n字面量是指 Java 编程中执行过程中不会改变的值。你可以将它们视为字面量的常量。这些是某些字符串类型或原始类型的常量值。Java\
    \ 中使用的任何字面量必须是下面提到的类型之一：\n\n## 字符 (Character)\n\n这是在内存中存储字符常量的部分。它基本上占用 2 字节的大小，但只能存储一个字符，因为\
    \ char 存储的是 Unicode 字符集。它包含最大值 65,535。\n\n## 整数 (Integer)\n\n整数类型可以存储整数。\n\n|\
    \ 类型 | 大小 | 范围 |\n| :--- | :--- | :--- |\n| byte | 1 字节 | -128 到 127 |\n| short\
    \ | 2 字节 | -32,768 到 32,767 |\n| int | 4 字节 | -2,147,483,648 到 2,147,483,647 |\n\
    | long | 8 字节 | -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807 |\n| float\
    \ | 4 字节 | - |\n| double | 8 字节 | - |\n| char | 2 字节 | - |\n| boolean | 1 字节 |\
    \ true, false |\n\n## 浮点数 (Floating point)\n\n这些是小数。\n\n## 布尔 (Boolean)\n\n布尔类型基本上存储状态：true\
    \ 或 false。\n\n## 注释 (Comments)\n\n在 Java 中，注释用于文档说明。某些编译器忽略它们。单行注释开头为：\n\n```java\n\
    // 这是一个注释\n```\n\n多行注释开头为：\n\n```java\n/* 这是一个多行\n   注释 */\n```\n\n## 变量 (Variables)\n\
    \n变量是编程中存储数据的容器。当变量被声明时，它被初始化为一个值，稍后变为另一个值。变量可以进一步用于进行任何计算、打印等。每个变量都需要一个数据类型，如\
    \ Boolean、int 等，并且该类型需要在声明变量时指定。每个变量都需要一个不重复或唯一的名称来标识它。\n\n让我们来看一个学生程序的示例。在这种情况下，我们可以有一个变量来存储“学生班级”，另一个用于“学生学号”等。\n\
    \n```java\nchar section;\nint roll_number;\n```\n\n```java\nclass Test{\n  public\
    \ static void main(String args[]){\n    char section = 'C';\n    int roll_number\
    \ = 76;//将 76 赋值给学号\n  }\n}\n```\n\n"
