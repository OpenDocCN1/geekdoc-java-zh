  mdcn: "\n\n## 在继承和组合之间进行选择\n\n继承与组合之间的对比对你的设计有什么帮助？以下反映了我通常如何在继承和组合之间进行选择的几个指南。\n\
    \n### 确保继承建模的是“是一种”（is-a）关系\n\n主要的指导哲学是，只有当子类是一个父类时，你才应该使用继承。例如，橙子很可能“是一种”水果，那么，我很可能会选择继承。\n\
    \n当你认为自己拥有“是一种”关系时，你需要问自己的一个关键问题是：这种“是一种”的关系在整个应用程序的生命周期内（也许运气好的话是在代码的生命周期内）是否恒定的？例如，你可能认为“员工”是一个“人”，但本质上，“员工”一词指的是“人”在特定时间段内扮演的角色。如果这个人被解雇了呢？如果他既是“主管”又是“员工”呢？在处理这些瞬态的“是一种”关系时，你应该考虑它们必须用组合来建模。\n\
    \n### 不要仅仅为了代码复用而使用继承\n\n如果你想重用代码且仅此而已，而且你没有看到任何明显的“是一种”关系，你可以使用组合。\n\n### 如果你只是想要多态性，就不要使用继承\n\
    \n当你只想要多态性，而且不存在任何自然的“是一种”关系时，你只需要使用接口配合组合。\n\n现在，让我们看看在下一章中如何通过构建一个简单的游戏项目来实现我们所学的一切：\n\
    \n## 使用 Java 构建一个简单的游戏\n\n下面的指南将向你展示如何以简单分步骤的方法制作你自己的游戏。\n\n在开始之前，你需要安装一个名为 Java\
    \ Processing 的程序，它对于构建我们今天今天要构建的这类应用程序非常有用。简单解释一下它是什么：Processing 是开源的，可以使用基本语法创建动画、交互式程序和绘图。它还包含一个基础\
    \ IDE，作为你编程的界面。通过 Processing，你可以创建额外的抽象，来某种程度上屏蔽某些普通初学者认为困难的特定 Java 编程元素。\n\n\
    注意：抽象让你能够更轻松地执行某些操作，特别是当你对该主题没有太多背景知识时。如果你用纯 Java 来构建或处理图像，你会感到非常头疼。\n\n![](img/7a31d4b199c3ce698626ee7cafe01163_207_0.png)\n\
    \n我们在这一节中要构建的游戏是 Pong（弹球游戏）、Flappy bird（愤怒的小鸟）和打砖的某种结合。我特别选择这个游戏是因为包含了简单的概念，并且有助于他人理解，而这些概念给初学者在游戏开发方面带来了问题。你需要注意的是，首先要制作像具有多个关卡、实体、玩家等的复杂平台游戏是非常困难的。随着我们的继续，你会看到代码变得非常复杂，但好处是它通常组织良好且简单。只需缓慢阅读每个部分，在需要明确的概念时参考书中的相关区域，获取整个代码并在你开始思考自己的游戏时尽早自己自己玩一玩，然后开始实现它。让我们从基础开始吧。\n\
    \n## 如何构建 Flappy Pong\n\n### 初始化不同的屏幕\n\n我们将从初始化项目开始。首先，我们将像大家通常做的那样编写 `setup`\
    \ 和 `draw` 块——所以这里没什么新奇或花哨的！之后，我们将处理各种屏幕——这些包括游戏屏幕、初始屏幕、游戏结束屏幕等。但可能会出现问题：你如何确保在正确的时间显示正确的页面？\n\
    \n完成这项任务非常简单。我们将有一个全局变量来存储当前活跃屏幕的信息。然后我们将绘制正确屏幕的内容——但这取决于变量。在 `draw` 块中，我们将包含一个\
    \ `if statement`，它基本上检查变量并根据此呈现屏幕内容。每当你想要更改屏幕时，我们将变量更改为你要更改的屏幕，你必须将变量更改为你想要显示的标识符。如此，让我们概述一下你的骨架代码结构：\n\
    \n```java\n/********* VARIABLES ***********/\n\n// 我们通过设置/更新 game 变量来控制哪个屏幕是活跃的。\n\
    // 我们根据这个变量的值显示正确的屏幕。\n//\n// 0: 屏幕\n// 1: 游戏屏幕\n// 2: 游戏结束屏幕\n```\n\n```java\n\
    int gameState = 0;\n\n/**** SETUP BLOCK ***********/\n\nvoid setup() {\n  size(500,\
    \ 500);\n}\n```\n\n```java\n/********* DRAW BLOCK ***********/\n\nvoid draw()\
    \ {\n  // 显示当前屏幕的内容\n  if (gameState == 0) {\n    initScreen();\n  } else if (gameState\
    \ == 1) {\n    gameScreen();\n  } else if (gameState == 2) {\n    gameOverScreen();\n\
    \  }\n}\n```\n\n```java\n/********* SCREEN CONTENTS ***********/\n\nvoid initScreen()\
    \ {\n```\n\n确实，这在开始时看起来很吓人，但我做的只是创建了基本结构并用注释块分隔不同的部分。如你所见，对于每个显示的屏幕，我们都定义了一个独立的方法。在你的\
    \ `draw` 块中，你只需要在调用相应方法之前检查变量 `gameScreen` 的值。当涉及到 `void mousepressed() {...}`\
    \ 这部分时，你基本上是在监听鼠标点击，并在活跃的屏幕中——初始屏幕中——执行操作。\n\n"
