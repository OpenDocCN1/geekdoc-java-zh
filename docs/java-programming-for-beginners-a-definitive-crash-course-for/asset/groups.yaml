    I can fly!\");\n    }\n}\n```\n\nIN THE ABOVE you’ve noticed that the ‘implements’\
    \ keyword has been used to inherit from an interface.\n\n## Problems With Multiple\
    \ Inheritance\n\nJava allows multiple inheritance with interfaces. This was not\
    \ an issue until Java 7 as interfaces could only be able to define abstract methods\
    \ (those methods that lack implementation). Therefore, if a class implemented\
    \ multiple interfaces using the same method signature, it wasn’t an issue; the\
    \ implementing class eventually had only a single method to implement.\n\nLet's\
    \ now take a look at the way the simple equation changed when the ‘default’ methods\
    \ in interfaces were introduced with Java 8.\n\nBeginning with Java 8, the interfaces\
    \ had an option of defining its methods’ default implementation - that is an interface\
