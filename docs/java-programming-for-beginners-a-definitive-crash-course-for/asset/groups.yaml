    \ `accelerate` 行为实际上可以是一个值，该值作为参数之一紧密地表示了增加的速度。为此，你将在与你的类状态相同的记法关联类型之前，用圆括号将增加的速度括起来。正如你所注意到的的，参数需要被命名，否则你将无法在行为定义内部使用或访问该参数。你还需要注意，当行为没有任何参数时，你将使用空参数集。例如，如果\
