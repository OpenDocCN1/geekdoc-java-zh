- md: "\nanother variable- or section can store the char data. The special keywords\
    \ in Java signify the type of data that every variable stores. This means that\
    \ we can actually declare variables with the types/keywords and initialize the\
    \ variable's value.\n\n## The Types of Variables In Java\n\nIn Java, variables\
    \ can be divided into four categories namely:\n\n- Static variable\n- Instance\
    \ variable\n- Method parameter\n- Local variable\n\n## Instance Variable\n\nAlso\
    \ known as non-static fields, instance variables are used to store states of objects.\
    \ The variables that are defined without the static keyword, and are outside any\
    \ declaration method automatically are object-specific, and are referred to as\
    \ instance variables due to the fact that their values are instance specific and\
    \ their values don't get shared among instances. Some people look at non-static\
    \ fields as instance variables because their values tend to be unique to each\
    \ class instance. For instance, the currentSpeed of a certain bicycle is independent\
    \ from another’s currentSpeed.\n\nFurther, you need to note the following:\n\n\
    When a space is assigned for an object in the heap (see glossary), a slot for\
    \ every instance variable value is made. These variables are made when objects\
    \ are created using the keyword ‘new’ and destroyed when the object gets destroyed.\
    \ Instance variables hold values that have to be referenced by multiple methods,\
    \ block or constructor, or the essential parts of the state of an object that\
    \ need to be present throughout the class.\n\nInstance variables could as well\
    \ be declared within the class level right before or after use. Keywords used\
    \ to specify accessibility of a class or type and its members, which are also\
    \ known as access modifiers could be given for different instance variables.\n\
    \nInstance variables contain default values. For the numbers, zero is the default\
    \ value; it's false for the Booleans and null for the object references. During\
    \ declaration (or within the constructor), the values can be assigned.\n\nThe\
    \ instance variables are also visible for all constructors, block and methods\
    \ in the class. Typically, it's recommended to make these variables private or\
    \ access level. Nonetheless, subclasses' visibility can be provided for these\
    \ variables using access modifiers.\n\nThe instance variables can be directly\
    \ accessed by calling the name of the variable within the class. Nonetheless,\
    \ within the static variables – that is when the instance variables are offered\
    \ accessibility-they need to be called with the fully qualified name. Let's take\
    \ an example:\n\n```java\nimport java.io.*;\npublic class Employee {\n\n    //\
    \ this instance variable is visible for any child class.\n    public String name;\n\
    \n    // salary variable is visible in Employee class only.\n    private double\
    \ salary;\n\n    // The name variable is assigned in the constructor.\n    public\
    \ Employee(String empName) {\n        name = empName;\n    }\n\n    // The salary\
    \ variable is assigned a value.\n    public void setSalary(double empSal) {\n\
    \        salary = empSal;\n    }\n\n    // This method prints the employee details.\n\
    \    public void printEmp() {\n        System.out.println(\"name: \" + name);\n\
    \        System.out.println(\"salary: \" + salary);\n    }\n}\n```\n\nFrom this,\
    \ you'll get the following result:\n\n```\nname : Ransika\nsalary :1000.0\n```\n\
    \n## Class Or Static Variables\n\nAlso known as static variables, class variables\
    \ are declared using the static keyword in a class, but outside a method, block\
    \ or constructor. Regardless of the number of objects created from it, there would\
    \ only be a single copy of each class variable per class.\n\nStatic variables\
    \ are seldom used – that is besides declared as constants. Constants are variables\
    \ essentially declared as private/public, static and final. Constant variables\
    \ will never change from their first value.\n\nThe static variables are kept within\
    \ the static memory, and it is not common to use static variables as private or\
    \ public constants. Static variables are actually created when the program starts\
    \ up and killed when the program stops.\n\nVisibility is similar to instance variables.\
    \ Nonetheless, most static variables get declared public because they need to\
    \ be available for the class users. The default values are similar to instance\
    \ variables and for the numbers, zero represents the default value. It is false\
    \ for the Booleans and null for the object references. The values get assigned\
    \ either within the constructor or during the declaration. What's more, the values\
    \ can get assigned in distinctive static initializer blocks.\n\nCalling with the\
    \ class name is what is required to access the static variables – className.variableName.\n\
    \nLastly, if we declare the class variables as public static final, this means\
    \ that the constants or variable names are all in the upper case. Moreover, if\
    \ the static variables aren't public as well as final, this means that the naming\
    \ syntax is similar to the instance and the local variables.\n\nLet's take an\
    \ example:\n\n```java\nimport java.io.*;\npublic class Employee {\n    // salary\
    \ variable is a private static variable\n    private static double salary;\n\n\
    \    // DEPARTMENT is a constant\n    public static final String DEPARTMENT =\
    \ \"Development \";\n\n    public static void main(String[] args[]) {\n      \
    \  salary = 1000;\n        System.out.println(DEPARTMENT + \"average salary:\"\
    \ + salary);\n    }\n}\n```\n\nThe following result will be given:\n-Development\
    \ average salary: 1000\nYou need to note that if the variables are accessed from\
    \ an outside class, the constant needs to be accessed as the Employee Department.\n\
    \nLocal variables are used to store a method in its temporary state. The syntax\
    \ used to declare a local variable is the same as declaring a field- for instance,\
    \ int count=0; You won't find a particular keyword that designates a variable\
    \ as local as such a determination comes entirely from the location in which it\
    \ is declared that is between the method’s closing and opening braces. In short,\
    \ local variables are referred to as 'local' because they can only be referenced\
    \ in the method that they are declared. Below is a method where 'miles' is a local\
    \ variable.\n\n```java\nprivate static double convertKmToMi(double kilometers)\
    \ {\n    double miles = kilometers * MILES_PER_KETER;\n    return miles;\n}\n\
    ```\n\n## Parameters\n\nParameters are also methods passed in. For instance, in\
    \ the main method, the string args [] is a parameter.\n\n```java\npackage com.jbt;\n\
    \n/** Here we will discuss about different type of Variables available in Java\
    \ **/\npublic class VariablesInJava {\n\n    public static void main(String args[])\
    \ {\n        System.out.println(\"Hello\");\n    }\n}\n```\n\n## Conditional Statements\
    \ In Java\n\nEvery day in life, we come in contact with different kinds of objects\
    \ as you try to get things done; at the same time, we use these objects to carry\
    \ out different tasks. The one type of objects we tend to come in contact are\
    \ digital or analog devices such as phones, computers, cars, self-opening doors\
    \ in malls and offices, and televisions.\n\nIn relation to the example above,\
    \ you'll realize that the concept of conditional statements in Java depicts the\
    \ way we go about our daily lives. Conditional statements, with regards to Java\
    \ programming, are all about making decisions that are directed towards a desired\
    \ result. We make decisions, and for these decisions, we get particular result.\n\
    \nIn Java programming, we have two types of decision making statements to use\
    \ when programming a software or device that you can run on any device like the\
    \ ones I've stated above. These statements basically assist the device and the\
    \ device's user as well to do something according to a particular state or condition.\n\
    \nThe IF-STATEMENT is the first conditional statement. You need to note that the\
    \ if-statement contains three versions, which include the following:\n\n- IF —\
    \ STATEMENTS\n- ELSE — IF STATEMENTS\n- IF / ELSE STATEMENTS\n"
  mdcn: "\n另一个变量或部分可以存储字符数据。Java 中的特殊关键字表示每个变量所存储的数据类型。这意味着我们实际上可以使用这些类型/关键字来声明变量并初始化变量的值。\n\
    \n## Java 中的变量类型\n\n在 Java 中，变量可以分为四类，即：\n\n- 静态变量 (Static variable)\n- 实例变量 (Instance\
    \ variable)\n- 方法参数 (Method parameter)\n- 局部变量 (Local variable)\n\n## 实例变量\n\n\
    实例变量也称为非静态字段，用于存储对象的状态。没有使用 static 关键字且在任何声明方法之外定义的变量自动是特定对象的，由于它们的值是特定于实例且不会在实例之间共享，因此被称为实例变量。有些人将非静态字段视为实例变量，因为它们的值往往对每个类实例是唯一的。例如，某辆自行车的当前速度（currentSpeed）与另一辆自行车的当前速度是独立的。\n\
    \n此外，你需要注意以下几：\n\n当在堆（heap，见术语表）中为对象分配空间时，会为每个实例变量值创建一个槽。这些变量在通过 `new` 关键字创建对象时创建，在对象被销毁时销毁。实例变量持有必须被多个方法、块或构造函数引用的值，或者是整个类中都需要存在的对象状态的核心部分。\n\
    \n实例变量也可以在类级别使用之前或之后声明。用于指定类或类型及其成员访问权限的关键字（称为访问修饰符）可以赋予不同的实例变量。\n\n实例变量包含默认值。对于数字，默认值是\
    \ 0；对于布尔值（Booleans）为 false，对于对象引用为 null。在声明期间（或在构造函数内部），可以赋值。\n\n实例变量对类中的所有构造函数、块和方法都是可见。通常，建议将这些变量设为\
    \ private 或访问级别。尽管如此，可以使用访问修饰符为这些变量提供子类的可见性。\n\n可以通过类内部调用变量名直接访问实例变量。然而，在静态变量中——即当实例变量提供访问权限时——需要使用完全限定名调用。让我们来看一个例子：\n\
    \n```java\nimport java.io.*;\npublic class Employee {\n\n    // 此实例变量对任何子类都可见。\n\
    \    public String name;\n\n    // salary 变量仅在 Employee 类中可见。\n    private double\
    \ salary;\n\n    // name 变量在构造函数中赋值。\n    public Employee(String empName) {\n\
    \        name = empName;\n    }\n\n    // 为 salary 变量赋值值。\n    public void setSalary(double\
    \ empSal) {\n        salary = empSal;\n    }\n\n    // 此方法打印员工详情。\n    public\
    \ void printEmp() {\n        System.out.println(\"name: \" + name);\n        System.out.println(\"\
    salary: \" + salary);\n    }\n}\n```\n\n从这里你将得到以下结果：\n\n```\nname : Ransika\n\
    salary :1000.0\n```\n\n## 类变量或静态变量\n\n类变量也称为静态变量，在类中使用 `static` 关键字声明，但在方法、块或构造函数之外。无论从其创建了多少对象，每个类都只有一个类变量的副本。\n\
    \n静态变量很少使用——除了被声明为常量之外。常量本质上是声明为 private/public、static 和 final 的变量。常量变量永远不会从其初始值改变。\n\
    \n静态变量保存在静态内存中，通常不将静态变量作为私有或公共常量。静态变量实际上在程序启动时创建，在程序停止时销。\n\n可见性与实例变量相似。然而，大多数静态变量被声明为\
    \ public，因为它们需要供类用户可用。默认值与实例变量相似，对于数字，0 代表默认值。对于布尔值为 false，对于对象引用为 null。值可以在构造函数内部或声明期间赋值。此外，值可以在特定的静态初始化块中赋值。\n\
    \n访问静态变量需要使用类名——`className.variableName`。\n\n最后，如果我们将类变量声明为 `public static final`，这意味着常量或变量名都采用大写字母。此外，如果静态变量既不是\
    \ public 也不是 final，这意味着命名语法将与实例变量和局部变量相似。\n\n让我们来看一个例子：\n\n```java\nimport java.io.*;\n\
    public class Employee {\n    // salary 变量是一个私有静态变量\n    private static double\
