    ```\n\n当你运行该程序时，将得到以下输出：\n1\n-2\n3\n2\n3\n4\n\n\n## Java 复制数组\n\n我们现在将学习 Java\
    \ 中用于复制数组（即一维和二维数组）的各种方法。我们有许多技术可以来实现这一点，正如本节所解释的那样：\n\n## 使用赋值运算符复制数组\n\n看下面的示例：\n\
    \n运行该程序时，你将得到以下输出：\n1, 2, 3, 4, 5, 6\n\n尽管这种特定的复制数组方法效果非常好，但它倾向于有一个问题。问题在于，当你修改上述示例中单个数组的元素时，另一个数组也会发生变化。\n\
    \n```\nclass AssignmentOperator {\n  public static void main(String[] args) {\n\
