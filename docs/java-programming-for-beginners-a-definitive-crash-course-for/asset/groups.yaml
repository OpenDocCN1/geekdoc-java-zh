    \  {\n        {-4, -5, 6, 9},\n        {1},\n        {2, 3}\n    }\n};\n```\n\n\
    Just like the case with 2d arrays, 3d arrays can vary in length. Let's take an\
    \ example:\n\nA program to print 3d array elements using loop\n\n```\nclass ThreeArray\
    \ {\n    public static void main(String[] args) {\n\n    int[][][] test = {\n\
    \        {\n            {1, -2, 3},\n            {2, 3, 4}\n        },\n     \
