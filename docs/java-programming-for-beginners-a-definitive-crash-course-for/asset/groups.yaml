- md: "\nproperly typed (we’ll use the ‘type StateName’ notation) where the name of\
    \ the type precedes the state entry name.\n\n```\nclass Vehicle:\n  invariants:\n\
    \    currentSpeed is greater than or equal to 0\n  state:\n    String manufacturerName\n\
    \    String modelName\n    Number productionYear\n    Number currentSpeed\n  behavior:\n\
    \    accelerate:\n      increase currentSpeed by 1\n    decelerate:\n      if\
    \ currentSpeed is greater than 0:\n        decrease currentSpeed by 1\n```\n\n\
    You need to note that a string is a sequence of characters and that we’ll have\
    \ to ignore the current speed units. It will, for the moment, suffice to limit\
    \ the current speed to a number. As you go on to describe the types, you have\
    \ run into two things that need to be addressed before continue adorning and maturing\
    \ the vehicle class: the primitive and parameters to behavior.\n\n## Primitive\
    \ Types\n\nAs you declare the state entries for the class in terms of other classes,\
    \ we'll eventually come to a point where you can no longer reference another class\
    \ without having a cyclical hierarchy. For instance, if you try assigning a type\
    \ of 'number' to the state 'currentSpeed', then how do you define the class 'number'?\
    \ If you try defining it in terms of other classes, how do you, therefore, define\
    \ those classes? Since you cannot let a type system that accepts infinite regression,\
    \ you need to declare a value or values to exist. Such axiomatic types are known\
    \ as primitive types.\n\nMost programming languages have a basic set of primitive\
    \ types which include decimal values (like single-precision floating point), integers,\
    \ strings, characters and Boolean values (these could be true or false values).\
    \ These types occur as a set of bits without the necessity to define a regressive\
    \ structure of a class. Such primitive types can operate as building blocks to\
    \ have more complex types in terms of classes created. For purposes of this discussion,\
    \ we'll have to assume that the types 'string', 'number', 'Boolean' and 'character'\
    \ exist.\n\nAnother thing you have to look at is concerned with passing information\
    \ to the class when you execute behaviors. For instance, when you want to accelerate\
    \ to 80 kilometers per hour, you'd have to execute the accelerate behavior of\
    \ the vehicle class successfully 80 times. That is definitely unruly for a real\
    \ system. In place of that, you should try instructing the vehicle how much to\
    \ accelerate by, when you execute 'accelerate by 30' and then 'accelerate by 15'\
    \ gives you a speed of 45 kilometers per hour. To do this, you need to declare\
    \ that your accelerate behavior can actually be a value, which closely represents\
    \ the increased speed as one of the parameters. For this, you'll border the increased\
    \ speed with a parenthesis before associating a type with the same notation as\
    \ that for your class' state state. As you would note, the parameter needs to\
    \ be named, otherwise you would not be able to use or access the parameter inside\
    \ your definition of the behavior. You also need to note that when a behavior\
    \ fails to have any parameters, you'll use an empty set of parameters. For instance,\
    \ if the 'drive' behavior doesn't take any parameters, its declaration will be\
    \ 'drive()'. As a result, you'll get the following class for your vehicle:\n\n\
    ```\nclass Vehicle:\ninvariants:\n  currentSpeed is greater than or equal to 0\n\
    \  state:\n    String: manufacturerName\n    String modelName\n    Number productionYear\n\
    \    Number currentSpeed\nbehavior:\n  accelerate(Number amount):\n    increase\
    \ currentSpeed by amount\n  decelerate(Number amount):\n    if currentSpeed minus\
    \ amount is greater or equal to 0:\n      decrease currentSpeed by amount\n```\n\
    \nIf right now you instruct the vehicle to accelerate by 30, you'd be able to\
    \ increase the current speed of the vehicle by 30. Now that the value (30) is\
    \ passed to your behavior at execution, it is referred to as an argument. Even\
    \ though the argument and the terms parameter are closely related, you'll get\
    \ a vital distinction: a parameter is a value referenced in the behavior definition.\
    \ The argument on the other hand is the actual value passed to the behavior upon\
    \ execution.\n\nI deliberately selected the execution notation because it maps\
    \ the arguments that are supplied to the declared parameters. For instance, 'accelerate(30)'\
    \ maps the value (30) to amount (of the 'number' type) during execution. This\
    \ parameters' notation can be extended for more than a single parameter by enumerating\
    \ the multiple parameters in a list with comma-separation taking the form of 'doSomething(number\
    \ valueOne, Number valueTwo)'. In instances when the arguments are positionally\
    \ mapped, this very argument notation can come in handy for instance 'doSomething(15,\
    \ 37)' maps 37 to valueTwo.\n\n## Declaring Classes\n\nLet's start with an example\
    \ of a definition of classes:\n\n```\nclass MyClass {\n  // field, constructor,\
    \ and\n  // method declarations\n}\n```\n\nThis is a form of class declaration.\
    \ The area in between the braces- or the class body- has all the offers that offers\
    \ for the life cycle of the objects made from the class- that is constructors\
    \ to initialize new objects, the declarations for the fields providing the class'\
    \ state and its objects, as well as methods to implement the behavior of both\
    \ the class and its objects. The class declaration that precedes is a minimal\
    \ one-it basically has all the required components of a class declaration. You\
    \ can offer more information concerning the class, for instance, its super class'\
    \ name, whether it implements any surfaces, and so forth, at the beginning of\
    \ the class declaration. For instance:\n\n```\nclass MyClass extends SuperClass\
    \ implements YourInterface {\n  // field, constructor, and\n  // method declarations\n\
    }\n```\n\nThis means that 'MyClass' is MySuperClass' subclass which implements\
    \ the interface 'YourInterface'. You can add such modifiers like 'private' or\
    \ 'public' at the start- so you can see that the first line of a class declaration\
    \ can get a bit complicated. Generally, class declarations can comprise the following\
    \ components in order:\n\n- Modifiers, like 'private' and 'public', as well as\
    \ a couple of others that you'll come across later.\n- The class name along with\
    \ the initial letter conventionally capitalized\n- The class' parent or superclass\
    \ name, if any, with the keyword 'extends' preceding it. A class is only able\
    \ to extend one parent.\n- A list of interfaces separated by commas implemented\
    \ by the class, if any which is preceded by the 'implements' keyword. A class\
    \ can be able to implement more than one interface.\n- The class body, bounded\
    \ by braces {}\n\nWe have different kinds of variables:\n\n- The member variables\
    \ in a class known as fields\n- The ones in a block of code or a method known\
    \ as local variables and\n- Those in method declarations known as parameters\n\
    \nThe class 'bicycle' uses the lines of code below to define its fields:\n\n```\n\
    public int cadence;\npublic int gear;\npublic int speed;\n```\n\nThe field declarations\
    \ are made up of three components, which include:\n\n- The zero or more modifiers,\
    \ for instance, the private or public\n- The type of field\n- The name of the\
    \ field\n\nThe 'bicycle' fields have the name cadence, gear as well as speed and\
    \ all of them are data type integer known as int. the keyword 'bicycle' identifies\
    \ these fields as public members, which are accessible by any object able to access\
