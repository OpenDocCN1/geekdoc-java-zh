    # Class Instantiation


    The operator ''new'' allocates memory for a new object and then returns a reference
    to that particular memory to instantiate a class. You need to note that the phrase
    ''instantiation of a class'' is no different from ''creation of an object''. By
    creating an object, you are building an instance of a class, thus, instantiating
    a class.


    The operator ''new'' needs one postfix argument – that is a call to a constructor,
    the constructor name gives the class name to instantiate. The operator ''new''
    returns a reference to the object made. This reference is typically assigned to
    the appropriate type variable such as:


    Point originOne = new Point(23, 94);


    The reference that was returned by the operator ''new'' doesn''t require being
    assigned to a variable. You can also use it directly in whichever expression-
    take this example:


    ```

    int height = new Rectangle().height;

