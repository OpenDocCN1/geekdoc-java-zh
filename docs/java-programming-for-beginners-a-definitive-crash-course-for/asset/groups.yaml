- md: "\n# Java SE Development Kit 9 Downloads\n\nThank you for downloading this release\
    \ of the Java™ Platform, Standard Edition Development Kit (JDK™). The JDK is a\
    \ development environment for building applications, and components using the\
    \ Java programming language.\n\nThe JDK includes tools useful for developing and\
    \ testing programs written in the Java language and running on the Java platform.\n\
    \nSee also:\n\n- Java Developer Newsletter: From your Oracle account, select Subscriptions,\
    \ expand Technology, and subscribe to Java\n- Java Developer Day hands-on workshops\
    \ (free) and other events\n- Java Magazine\n\n## JDK 9.0.1 checksum\n\n# Java\
    \ SE Development Kit 9.0.1\n\nYou must accept the Oracle Binary License Agreement\
    \ for Java SE to download this software.\n\n| Product / File Description | File\
    \ Size | Download |\n|---|---|---|\n| Linux | 304.99 MB | jdk-9.0.1_linux-x64_bin\
    \ rpm |\n| Linux | 338.11 MB | jdk-9.0.1_linux-x64_bin.tar.gz |\n| macOS | 382.11\
    \ MB | jdk-9.0.1_osx-x64_bin.dmg |\n| Windows | 375.51 MB | jdk-9.0.1_windows-x64_bin.exe\
    \ |\n| Solaris SPARC | 206.85 MB | jdk-9.0.1_solaris-sparc9_bin.tar.gz |\n\nWHEN\
