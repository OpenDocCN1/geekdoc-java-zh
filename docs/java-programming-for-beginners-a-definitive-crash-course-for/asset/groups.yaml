    \  System.out.println(Floatable.duration); // outputs 10\n        System.out.println(Flyable.duration);\
    \ // outputs 20\n    }\n}\n```\n\n## Interfaces That Extend Other Interfaces\n\
    \nAn interface can basically extend multiple interfaces as the example below explains\n\
    \n```java\n1 public interface Floatable {\n2 void floatOnWater();\n3 }\n1 interface\
    \ Flyable {\n2 void fly();\n3 }\n1 public interface SpaceTraveller extends Floatable,\
    \ Flyable {\n2 void remoteControl();\n3 }\n```\n\nAN INTERFACE WILL INHERIT other\
    \ interfaces by using the 'extends' keyword. The classes use the 'implements'\
    \ keyword in inheriting an interface.\n\n## Inheriting Type\n\nWhen a class inherits\
    \ another one or interfaces, besides inheriting their members, it tends to inherit\
    \ their type as well. This equally applies to an interface inheriting other interfaces.\
    \ This is one very powerful concept that lets developers program to an interface-\
