  mdcn: "\n现在进入简单部分：让我们使用一些技巧来实现重力——首先是实现部分的代码。\n\n```\nfloat gravity = 1;\nfloat\
    \ ballSpeedVert = 0;\n...\nvoid gameScreen() {\n...\n  applyGravity();\n  keepInScreen();\n\
    }\nvoid applyGravity() {\n  ballSpeedVert += gravity;\n  ballY += ballSpeedVert;\n\
    }\nvoid makeBounceBottom(float surface) {\n  ballY = surface-(ballSize/2);\n \
    \ ballSpeedVert*=-1;\n}\nvoid makeBounceTop(float surface) {\n  ballY = surface+(ballSize/2);\n\
    \  ballSpeedVert*=-1;\n}\n// 将球留在屏幕内\nvoid keepInScreen() {\n  // 球碰撞地板\n  if\
    \ (ballY+(ballSize/2) > height) {\n    makeBounceBottom(height);\n  }\n  // 球碰撞天花板\n\
    \  if (ballY-(ballSize/2) < 0) {\n    makeBounceTop(0);\n  }\n}\n```\n\n[点击此处](#)查看预期结果。\n\
    \n我确定你可能在想物理学理解是否受到了威胁。我知道在现实生活中，重力并不是这样工作的。请将此简单视为一个动画过程。变量“重力”只是一个数值——一个简单的\
    \ `float` 类型，这使得可以使用小数而不仅仅是整数——在每个循环中，我们都将其加到 `ballSpeedVert` 上。实际上，`ballSpeedVert`\
    \ 代表球的垂直速度，它在所有循环中都对应球的 Y 坐标 (`ballY`)。你观察球的坐标以确保它留在屏幕上，并且确保（正如你可能已经知道的那样）球不会掉落无限。但目前，球只在垂直方向上移动。这意味着我们观察屏幕上地板和天花板的边界。通过\
    \ `keepInScreen()` 方法，我们检查 `ballY` 加上半径是否小于 `height`，同样地，`ballY` 减去半径是否大于 0。如果不符合条件，你就使用方法\
    \ `makeBounceTop()` 和 `makeBounceBottom()` 让球发生反弹（直接从底部或顶部顶部）。我们可以让球移动到它必须反弹的位置，然后得到垂直速度\
    \ `ballSpeedVert` 乘以 -1 的乘积（注意，当你乘以 -1 时符号会改变）。当值获得符号时，意味着你加上了 Y 坐标，速度将变为从 `ballY+-ballSpeedVert`。在这种情况下，球会立即以相同的速度改变方向。现在，当你将“重力”加入\
    \ `ballSpeedVert` 且它具有负值时，它将开始接近 0，最终变为 0 然后再次开始增加。这会让球上升，然后速度变慢，停止，然后开始下落。\n\n\
    ![](img/7a31d4b199c3ce698626ee7cafe01163_217_0.png)\n\n如果你**非常敏锐**，你会注意到我们的动画过程存在一个问题——球没有停止反弹。如果我们用现实世界的场景来看待它，我们会说球在每次接触表面时都会面临摩擦和空气阻力。这正是我们希望动画过程具有的行为。实现这一点非常简单，只需添加以下代码：\n\
    \n```\nfloat airfriction = 0.0001;\nfloat friction = 0.1;\n```\n\n```\nvoid applyGravity()\
    \ {\n  ballSpeedVert -= (ballSpeedVert * airfriction);\n}\nvoid makeBounceBottom(int\
    \ surface) {\n  ballSpeedVert -= (ballSpeedVert * friction);\n}\nvoid makeBounceTop(int\
    \ surface) {\n  ballSpeedVert -= (ballSpeedVert * friction);\n}\n```\n\n动画过程将产生类似的效果：\n\
    \n“摩擦”，顾如其，指的是表面摩擦；而“空气摩擦”则指的是空气的阻力。显然，“摩擦”在球每次接触任何表面时都需要应用。这正是我们所做的。`applyGravity()`\
    \ 方法在每个循环中运行，因此你在所有循环中都从 `ballSpeedVert` 中减去其值的 0.0001%。`makeBounceTop()` 和 `makeBounceBottom()`\
    \ 在球接触任何表面时运行。因此，我们在这些方法中做了相同的事情，只是这次使用了“摩擦”。\n\n# 现在创建球拍\n\n你现在需要一个球会在上面反弹的球拍。你还应该能够控制球拍。我们将让它可以通过鼠标控制。代码如下：\n\
    \n```\ncolor racketColor = color(0);\nfloat racketWidth = 100;\nfloat racketHeight\
    \ = 10;\nvoid gameScreen() {\n  drawRacket();\n}\nvoid drawRacket(){\n  fill(racketColor);\n\
    \  rectMode(CENTER);\n  rect(mouseX, mouseY, racketWidth, racketHeight);\n}\n\
    ```\n\n我们把球拍的宽度、高度和颜色定义为全局变量。你可能想看到它们在游戏过程中发生变化。\n\n# 水平移动并控制球\n\n主意与垂直运动相同。我们创建了\
    \ `ballSpeedHorizon`，一个水平速度变量。我们还创建了一个在移除空气摩擦的情况下将水平速度应用于球的方法。\n\n```\nint ballBounceRate\
    \ = 20;\n...\nvoid gameScreen() {\n...\n  applyHorizontalSpeed();\n}\n```\n\n\
    ```\nvoid applyHorizontalSpeed() {\n  ballX += ballSpeedHorizon;\n}\n\nvoid watchRacketBounce()\
    \ {\n  float overhead = mouseY - ballY;\n  if ((ballX+(ballSize/2) > mouseX-(racketWidth/2))\
    \ && (ballX-(ballSize/2) < mouseX+(racketWidth/2))) {\n    if (dist(ballX, ballY,\
    \ ballX, mouseY)<=ballSize/2)+abs(overhead)) {\n      ...\n        ballSpeedHorizon\
    \ = (ballX - mouseX)/5;\n      ...\n    }\n  }\n}\n```\n"
