  md: '# Oracle JDK (Java Development Kit)


    This is a software development kit that comprises the JVM, JRM (Java Runtime Environment),
    as well as the entire list of class libraries present in the production environment
    to build and compile programs. Thus, if you want to do some Java development,
    you''ll require JDK.


    Having said that, let''s start.


    # Create the Java Folder


    As an example, we will begin creating an empty folder called ''Java'' for your
    JRE/JDK files in the directory /usr/local which makes the path of the folder:
    /usr/local/java. Get to the terminal and type the command below then press:


    ```

    kross@com-ubuntu:~~$ sudo mkdir -p /usr/local/java

    [sudo] password for kross:

