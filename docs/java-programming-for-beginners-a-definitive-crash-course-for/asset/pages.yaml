  md: '# Primitive Types


    As you declare the state entries for the class in terms of other classes, we''ll
    eventually come to a point where you can no longer reference another class without
    having a cyclical hierarchy. For instance, if you try assigning a type of ''number''
    to the state ''currentSpeed'', then how do you define the class ''number''? If
    you try defining it in terms of other classes, how do you, therefore, define those
    classes? Since you cannot let a type system that accepts infinite regression,
    you need to declare a value or values to exist. Such axiomatic types are known
    as primitive types.


    Most programming languages have a basic set of primitive types which include decimal
    values (like single-precision floating point), integers, strings, characters and
    Boolean values (these could be true or false values). These types occur as a set
    of bits without the necessity to define a regressive structure of a class. Such
    primitive types can operate as building blocks to have more complex types in terms
    of classes created. For purposes of this discussion, we''ll have to assume that
    the types ''string'', ''number'', ''Boolean'' and ''character'' exist.'
