  md: '# Java Programming: A Background


    Before we get into Java programming, let''s first make sure we understand what
    computer programming (or coding) really is.


    # What Is Programming?


    ```

    require ''open-uri''

    require ''json''

    FRONT_PAGE_URL = ''https://reddit.com/r/all.json''

    front_page = JSON.load(open(FRONT_PAGE_URL))

    top_post = front_page[''data''][''children''][0][''data'']

    puts The top post on reddit is:

    puts top_post[''title'']

    puts top_post[''uri'']

    ```


    BY DEFINITION, PROGRAMMING is the process of building software, which is made
    up of instructions. These instructions are basically referred to as the source
    code. The source code is a set of written instructions that a computer understands.
    Throughout the book, we''ll be using this concept so you need to understand before
    we begin.


    What does the source code really look like?


    Code doesn''t typically follow the rules of natural languages, such as English.
    Take a look at this small program to understand what I mean:


    A computer actually takes everything literally- for instance, when you ask a computer
    if a number is even or odd, it will always respond with a ''yes''. Don''t believe
    me? Take a look at the code below:


    ```

    puts (5.odd? or 5.even)

    ```'
  merge: -1
