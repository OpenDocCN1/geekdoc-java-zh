  md: '# Inheritance in Java


    In Java, one of the principles of Object Oriented Programming is inheritance;
    inheritance lets us reuse existing code or extend a type that already exists or
    extend a type that is already existing. Put simply, Java allows a class to inherit
    another class and many interfaces, are are able to inherit other interfaces.


    In our discussion today, we''ll begin with looking at why you need inheritance
    and how it works with interfaces and classes. And then cover how the method or
    variable names and how the inherited members are affected by access modifiers,
    among other important things.


    # Why Inheritance?


    Take a moment and imagine you are a car manufacturer offering multiple car models
    to your customers. While the different car models could provide features such
    as bulletproof windows or sunroof, they all have common features and components
    such as wheels and engine. It''s only sensitive to build a basic design and extend
    it to build their specialized versions instead of trying to design the car models
    individually, from scratch. Similarly, inheritance is here to assist you create
    a class that has simple features as well as behavior, and make its dedicated versions
    by building classes that inherit the base class. Similarly, interfaces are designed
    to extend the existing interfaces. You''ll notice how multiple terms have been
    used to refer to a type which is under inheritance by another type: more specifically;


    A base type is also known as a parent or super type'
