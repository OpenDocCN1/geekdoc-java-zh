  md: '# Polymorphism In Java


    Polymorphism in its literal sense refers to a state of having many shapes or the
    ability to take on various forms. When it is used in an object oriented programming
    language such as Java, it describes the ability of the language to process objects
    of various classes and types through a uniform and single interface.


    Polymorphism takes on two types: Runtime polymorphism and static binding (also
    known as compile time polymorphism). The former entails method overloading as
    an example while the latter is contained in dynamic polymorphism.


    Perhaps you need to note that polymorphism entails a very important example, which
    is how a parent class refers to a child object. As a matter of fact, any object
    satisfying more than a single IS-A relationship is by nature polymorphic.


    As an example, we can consider the class animal and let one of its subclasses
    be Therefore, any cat is an animal. The cat in this case satisfies the IS-A relationship
    for its own type and also its super class ''animal''. You also need to note that
    it is very legal to state that every object in Java is by nature polymorphic because
    each one of them passes the IS-A test for itself as well as that for the ''object''
    class.'
