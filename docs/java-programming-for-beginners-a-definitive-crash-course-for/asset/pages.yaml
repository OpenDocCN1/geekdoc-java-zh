  md: '# Java Tokens


    Tokens are basically the tiniest logical components of Java and any other program.
    The first step of the compiler is to separate the whole program into smaller bits
    known as tokens. You can think of them as the building blocks of a program.


    Tokens are basically anything in a program that a compiler can identify during
    the compilation process or tokenization. Let''s take a look at the types of tokens:


    +   Keywords

    Operators

    Literals

    Separators

    Comments

    Literals


    Let''s have a brief description of each one of them so that you get a better understanding.'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'Keywords are special words or what are known as ‘reserved’ words in Java as
    they have a special meaning. We have a list of 50 keywords, which are highlighted
    below:


    | byte | short | int | long | double | float | char | boolean | void | public
