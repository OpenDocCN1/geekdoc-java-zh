  md: "# Some Basics Of Classes\n\nClass or classification is a representation of\
    \ an entity or something that is made up of behavior and state. The class' state\
    \ is the data associated with it and the class behaviors are those actions the\
    \ class can perform.\n\nFor instance, in classifying a simple vehicle, we can\
    \ say that it has a model name, manufacturer name and a production year associated\
    \ with it. You can also say that your simple car is able to accelerate and decelerate.\
    \ In that case, you can define behavior and state with the rule below:\n\nThe\
    \ class' state is simply what the class contains while the class' behavior is\
    \ what the class is able to do. You can create a simple specification for your\
    \ class using the example I've just given as follows:\n\n```\nclass Vehicle:\n\
    state:\n  manufacturerName\n  modelName\n  productionYear\nbehavior:\n  accelerate\n\
    \  decelerate\n```\n\nYou need to note that nearly all the programming languages\
    \ have a restriction on state entry names and behavior names from having spaces.\
    \ For instance, manufacturer name isn't a valid state entry name, manufacturerName.\
    \ The latter name is written in what is known as the camel case, in which the\
    \ first letter in lower case and the rest of the letters are capitalized."
