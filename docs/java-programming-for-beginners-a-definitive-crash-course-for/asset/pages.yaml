  md: '# Selecting Between Inheritance And Composition


    How do the comparisons between inheritance and composition assist in your design?
    The following are a few guidelines reflecting how I typically choose between inheritance
    and composition.


    Ensure the inheritance models the relationship ‘is-a’


    The main guiding philosophy is that you should only use inheritance when a subclass
    is a super class. For instance, an orange likely is-a fruit, then, I would most
    likely go with inheritance.


    A good question you need to ask yourself when you think you have ‘is-a’ relationship
    is definitely whether the ‘is-a’ relationship is constant throughout the application’s
    lifetime and, perhaps when lucky, the code’s lifecycle. For instance, you could
    think that ‘employee’ is a ‘person’ when essentially, the term ‘employee’ denotes
    a role a ‘person’ plays only during a given period of time. What if the person
    is fired? What if he is a ‘supervisor’ as well as an ‘employee’? When dealing
    with impermanent-is relationships like these, you should consider that they have
    to be modelled with composition.


    Do not just use inheritance to get code reuse


    If you want to reuse code and that’s all, and also there is no ‘is-a’ that you
    can see, you can use composition.


    Do not use inheritance if all you want is to get at polymorphism


    When polymorphism is all you want, and there isn’t any natural ‘is-a’ relationship,
    you just use composition with interfaces.'
  merge: -1
