    In this case, data refers to an array that is able to hold values of the type
    ‘double''.


    How many elements therefore can this array hold? Since this hasn’t been defined,
    yet our next step will be allocating memory for the array elements.

    data = new Double[10];


    The data array length is 10- this means that it can hold ten elements (in this
    case, it is 10 double values). You need to note that when the array length is
    defined, it can’t be changed in the program.


    We’ll take another example:

    int[] age;

    age = new int[5];


    In this example, the age array is able to hold five values of the int type. You
    can be able to allocate and declare memory of an array in a single statement.
    You can also replace two statements above with one statement.'
