  \n**程序输出**\n\n```\nThe box’s length is 10.0\nThe box’s width is 20.0\nThe box’s\
  \ area is 200.0\n```\n\n***\n\n### 访问器和变异器方法\n\n如前所述，将类的所有字段都设为私有（private），并提供公共方法来访问和更改这些字段是一种常见做法。这确保了拥有这些字段的对象能够控制对它们进行的所有更改。从类的字段中获取值但不对其进行更改的方法被称为\
  \ `访问器方法`（accessor method）。在字段中存储值或以其他方式更改字段值的方法被称为 `变异器方法`（mutator method）。在 `Rectangle`\
  \ 类中，`getLength` 和 `getWidth` 方法是访问器，而 `setLength` 和 `setWidth` 方法是变异器。\n\n![Image](img/00005.jpg)\n\
  \n***\n\n**注意：** 变异器方法有时被称为“setters”，访问器方法有时被称为“getters”。\n\n***\n\n### 避免过时数据\n\
  \n在 `Rectangle` 类中，`getLength` 和 `getWidth` 方法返回存储在字段中的值，但 `getArea` 方法返回计算结果。你可能会想，为什么矩形的面积不像长度和宽度那样存储在字段中。面积之所以不存储在字段中，是因为它可能会变得过时。当某项的值依赖于其他数据，且当其他数据发生变化时该项没有更新时，就说该项已变得\
  \ `过时`（stale）。如果矩形的面积存储在字段中，那么只要 `length` 或 `width` 字段任一发生变化，该字段的值就会变得不。\n\n在设计类时，你应该注意不要在字段中存储可能变得过时的计算数据。相反，应提供一个返回计算结果的方法。\n\
  \n### 在 UML 图中显示访问规范\n\n在 图 6-8 中，用 UML 图显示了 `Rectangle` 类。用于指示访问级别的符号 `-` 表示私有（private），`+`\
  \ 表示公共（public）。\n\n### UML 中的数据类型和参数符号\n\n统一建模语言（UML）还提供了你可以使用的符号来指示字段、方法和变量的数据类型。要指示字段的数据类型，请在名称后放置冒号。例如，`Rectangle`\
  \ 类中的 `length` 字段是一个 `double`。它可以在 UML 图中列为：\n\n```\n- length : double\n```\n\n\
  方法的返回类型可以以此方式列出：在方法名之后，放置冒号并跟返回类型。`Rectangle` 类的 `getLength` 方法返回 `double`，因此它可以在\
  \ UML 图中列为：\n\n```\n+ getLength() : double\n```\n\n参数变量及其数据类型可以列在方法的括号内。例如，`setLength`\
  \ 方法有一个名为 `len` 的 `double` 参数，因此它可以在 UML 图中列为：\n\n```\n+ setLength(len : double)\
  \ : void\n```\n\n### 类成员的布局\n\n注意，在 `Rectangle` 类中，首先声明字段变量，然后定义方法。你不需要在方法定义之前编写字段声明。事实上，有些程序员倾向于先写公共方法的定义，最后写私有字段的声明。无论你使用哪种风格，都应该保持一致。在书中，我们总是先写字段声明，然后是方法定义。图\
  \ 6-15 显示了这种布局。\n\n**图 6-15** 类成员的典型布局\n\n![Image](img/0346.jpg)\n\n##### 检查点\n\n\
