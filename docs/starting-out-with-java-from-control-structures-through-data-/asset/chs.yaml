  \n![Image](img/00597.jpg)\n\n### 累加二维数组的行总和\n\n有时，你可能需要计算二维数组中每一行的总和。例如，假设使用二维数组来存储一组学生的分数成绩。数组中的每一行代表一个学生的一组测试成绩。为了得到一个学生测试成绩的总和（可能是为了计算平均分），你使用循环来将某行中的所有元素相加。下面的代码展示了一个示例：\n\
