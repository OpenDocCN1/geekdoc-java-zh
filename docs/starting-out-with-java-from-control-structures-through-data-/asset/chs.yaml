  \ `System.out.println`。\n\n### 7.10 应避免的常见错误\n\n- 在 `import` 语句中拼错 `javax.swing`。不要忘记\
  \ `java` 之后的字母 `x`。\n- 忘记指定用户点击 `JFrame` 关闭按钮时执行的操作。默认情况下，点击关闭按钮时窗口隐藏，但应用程序不会终止。如果你希望在点击关闭按钮时退出应用程序，必须调用\
  \ `setDefaultCloseOperation` 方法并传递 `JFrame.EXIT_ON_CLOSE` 作为参数。\n- 忘记为希望响应的每个事件编写事件监听器。为了响应事件，你必须编写实现相应接口并注册到事件监听器。\n\
  - 忘记注册事件监听器。即使你编写了事件监听器，如果没有注册，它也不会执行。\n- 在编写所需的事件监听器方法时，没有使用接口指定的方法头部。`actionPerformed`\
  \ 方法的头部必须与 `ActionListener` 接口一致。同样，`itemStateChanged` 方法的头部必须与 `ItemListener` 接口一致。\n\
  - 在将组件直接添加到由 `BorderLayout` 管理的容器中时，如果你不希望组件被缩放或想在每个区域添加多个组件。如果你不希望放置在 `BorderLayout`\
  \ 区域的组件被缩放，请将其放入 `JPanel` 组件中，然后将 `JPanel` 组件添加到该区域。\n- 在将组件直接添加到由 `GridLayout`\
  \ 管理的容器中，如果你不希望组件被缩放或想在每个单元格添加多个组件。如果你不希望放置在 `GridLayout` 单元格中的组件被缩放，请将其放入 `JPanel`\
