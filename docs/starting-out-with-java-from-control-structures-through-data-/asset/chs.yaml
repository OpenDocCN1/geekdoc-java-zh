  \n当异常由 `try` 块抛出时，JVM 开始在 `try` 语句中寻找可以处理它的 `catch` 子句。它从上到下搜索 `catch` 子句，并将程序的控制权传递给与异常兼容的第一个\
  \ `catch` 子句\n\n#### 使用异常处理器从错误恢复\n\n代码列表 12-5 演示了 `try` 语句如何拥有多个 `catch` 子句以处理不同类型的异常。然而，程序并没有使用异常处理器从任何错误中恢复。无论文件是否存在或在文件中遇到非数值项，程序都会停止。代码列表\
