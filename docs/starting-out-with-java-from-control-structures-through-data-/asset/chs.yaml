  \ = \"Z\";\n ```\n\n## 2.5 算术运算符\n\n> **概念：有许多运算符用于处理数值和执行算术运算**。\n\nJava 提供了许多用于处理数据的运算符。通常，有三类型的运算符：一元、二元和三元。这些术语反映了运算符所需的的操作数数量。\n\
  \n一元运算符只需要一个操作数。例如，考虑以下语句：\n\n```\n-5\n```\n\n![Image](img/00009.jpg)\n\n### 简单表达式\n\
  \n当然，二元运算符需要两个操作数。例如，考虑以下语句：\n\n```\nnumber = 5\n```\n\n赋值运算符是二元运算符。算术运算符通常如下：\n\
  \n```\nnumber = 5 + 2\n```\n\n三元运算符需要三个操作数。算术运算非常常见。在表 2-5 列出的 Java 原始数据类型中可以看到。\n\
  \n### 算术运算符\n\n![Image](img/00010.jpg)\n\n加法运算符返回两个操作数的和。例如：\n\n```\n12 + 7\n```\n\
  \n减法运算符返回左操作数减去右操作数的值。例如：\n\n```\n12 - 7\n```\n\n乘法运算符返回两个操作数的积。例如：\n\n```\n5 *\
  \ 2\n```\n\n除法运算符返回左操作数除以右操作数的商。例如：\n\n```\n12 / 5\n```\n\n取模运算符返回除法的余数。\n\n```\n\
  17 % 3\n```\n\n\n\n\n可以使用多个操作符构建数学表达式。以下语句将 17、`x`、21 和 `y` 的和赋值给变量 `answer`：\n\n\
  ```\nanswer = 17 + x + 21 + y;\n```\n\n然而，某些表达式并不那么简单。考虑以下语句：\n\n```\noutcome =\
  \ 12 + 6 / 3;\n```\n\n`outcome` 中将存储什么值？6 被同时用作加法运算符和除法运算符的数数。`outcome` 变量可能被赋值为\
  \ 6 或 14，这取决于除法发生的时间。答案是 14，因为除法运算符的`precedence`（优先级）高于加法运算符。\n\n数学表达式从左到右求值。当两个运算符共享一个操作数时，优先级最高的运算符先执行。乘法和除法的优先级高于加法和减法，因此上述语句的作用如下：\n\
  \n> 1. 6 除以 3，得到结果 2\n> 2. 12 加上 2，得到结果 14\n\n它可以如图 2-5 所示进行绘图。\n\n**图 2-5** 优先级示意\n\
  \n![Image](img/00062.jpg)\n\n表 2-8 显示了算术运算符的优先级。表格顶部的运算符优先级高于下方的运算符。\n\n**表 2-8**\
  \ 算术运算符的优先级（从高到低）\n\n![Image](img/00063.jpg)\n\n乘法、除法和模运算符的优先级相同。加法和减法运算符的优先级相同。如果两个共享操作数的运算符优先级相同，它们根据它们的`associativity`（结合性）运行。结合性可以是`从左到右`或`从右到左`。表\
  \ 2-9 显示了算术运算符及其结合性。\n\n**表 2-9** 算术运算符的结合性\n\n![Image](img/00064.jpg)\n\n表 2-10\
  \ 显示了一些表达式及其值。\n\n**表 2-10** 一些表达式及其值\n\n![Image](img/00065.jpg)\n\n### 使用括号分组\n\
  \n数学表达式的部分可以使用圆括号分组，以强制某些操作在其他操作之前执行。在下面的语句中，`a`、`b`、`c` 和 `d` 的和除以 `4.0`。\n\n```\n\
  average = (a + b + c + d) / 4.0;\n```\n\n然而，如果没有括号，`d` 将被除以 `4`，结果将加到 `a`、`b` 和\
  \ `c`。表 2-11 显示了更多表达式及其值。\n\n**表 2-11** 更多表达式及其值\n\n![Image](img/00066.jpg)\n\n\
  ***\n\n### 焦点：计算百分比和折扣 ![Image](img/00067.jpg)\n\n确定百分比是计算机编程中常见的计算。虽然在通用数学中使用 `%`\
