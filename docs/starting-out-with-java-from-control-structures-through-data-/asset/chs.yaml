  \n### 11.6 Object 类\n\n> **概念：Java API 有一个名为 Object 的类，所有类都直接或间接地继承自它**。\n\nJava\
  \ 中的所有类（包括 API 中的类和你创建的类）都直接或间接地继承自一个名为 `Object` 的类，它是 `lang` 包的一部分。发生如下：当类没有使用\
  \ `extends` 关键字继承其他类时，Java 会自动将其扩展自 `Object` 类。例如，考虑以下类声明：\n\n```\npublic class\
  \ MyClass {\n}\n```\n\n该类没有显式扩展任何其他类，因此 Java 将其处理为：\n\n```java\npublic class MyClass\
  \ extends Object {\n}\n```\n\n最终，每个类都扩展 `Object` 类。图 11-17 显示了 `PassFailExam` 类是如何继承\
  \ `Object` 的。\n\n`图 11-17` 从 `Object` 到 `PassFailExam` 的继承线\n\n![Image](img/00857.jpg)\n\
