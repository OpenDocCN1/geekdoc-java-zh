  \ 为 GUI 类配备 `main` 方法\n\n> **概念：Java 用作应用程序起点的 `main` 方法可以直接写在 GUI 类中**。\n\n你已经知道\
  \ Java 应用程序总是从一个名为 `main` 的方法开始执行执行。到在本章为止，我们看过的应用程序由两个独立的文件组成：一个文件包含一个定义 GUI 窗口的类，另一个文件包含一个带有\
  \ `main` 方法的文件，用于创建 GUI 窗口类的对象并显示它。第二个文件的目的仅仅是演示 GUI 窗口。\n\n通过直接在 GUI 类中编写 `main`\
  \ 方法，可以消除第二个文件。代码清单 7-11 中的 `EmbeddedMain` 类展示了一个示例。\n\n**代码清单 7-11 (`EmbeddedMain.java`)**\n\
  \n![Image](img/00427.jpg)\n\n![Image](img/00428.jpg)\n\n`EmbeddedMain` 类包含它自己的 `main`\
  \ 方法，该方法创建了该类的实例。注意，该 `main` 方法的头信息与我们编写过的任何其他 `main` 方法完全相同。我们可以编译 `EmbeddedMain.java`\
  \ 文件，然后运行生成的 `.class` 文件。当我们这样做时，就会看到在图 7-12 所示所示窗口。\n\n**图 7-12** 由 `EmbeddedMain`\
  \ 类显示的窗口\n\n![Image](img/00429.jpg)\n\n注意在第 46 行中，`main` 方法声明了一个名为 `em` 的变量来引用类的实例。然而，一旦创建了实例，该变量就不再被使用。由于我们不需要该变量，可以像这里这样匿名实例化该类：\n\
  \n```java\npublic static void main(String[] args) \n{\n           new EmbeddedMain();\n\
  \n}\n```\n\n## 7.4 布局管理器\n\n> **概念：布局管理器是一个管理容器内组件位置和大小的对象。当容器大小发生变化时，布局管理器会自动重新调整组件的位置，并在某些情况下调整组件的大小**。\n\
  \n设计 GUI 应用程序的重要部分是确定在应用程序窗口中显示的组件的布局。“布局”（*layout*）一词是指组件的位置和大小调整。在 Java 中，你通常不需要指定组件在窗口内的精确位置。相反，你让布局管理器来为你控制组件的位置。*布局管理器*是一个对组件如何定位和调整大小有自己规则的对象，并在需要时进行调整。例如，当用户调整窗口大小时，布局管理器会决定组件应该移动到哪里。\n\
  \n为了对一组组件使用布局管理器，你必须将组件放在容器中，然后创建一个布局管理器对象。布局管理器对象和容器协同工作。在本章中，我们讨论了表 7-5 中描述的三种布局管理器。要使用其中任何类，你的代码应该包含以下\
  \ `import` 语句：`import java.awt.*;`\n\n**表 7-5** 布局管理器\n\n![Image](img/00430.jpg)\n\
  \n#### 为容器添加布局\n\n你通过调用 `setLayout` 方法并传递一个布局管理器作为参数，向容器（如内容面板或面板）添加布局。例如，以下代码创建了一个\
  \ `JPanel`，然后设置 `BorderLayout` 为布局：\n\n```java\nJPanel panel = new JPanel();\npanel.setLayout(new\
  \ BorderLayout());\n```\n\n#### FlowLayout 管理器\n\n`FlowLayout` 管理器按行排列组件。这是 `JPanel`\
  \ 的默认布局管理器。`FlowLayout` 遵循以下规则：\n\n> • 你可以向使用 `FlowLayout` 管理器的容器添加多个组件。\n> • 当向使用\
  \ `FlowLayout` 管理器的容器添加组件时，它们将按照添加顺序从左到右水平排列。\n> • 当某行没有空间但添加了更多组件时，新组件将“流”到下一行。\n\
  \n例如，代码清单 7-12 所示的 `FlowWindow` 类继承自 `JFrame`。该类创建一个宽 200 像素、高 105 像素的窗口。在构造函数中，它调用了\
  \ `setLayout` 方法为内容面板提供 `FlowLayout` 管理器。然后创建了三个按钮并将它们添加到内容面板中。`main` 方法创建了 `FlowWindow`\
  \ 类的实例并显示窗口。\n\n**代码清单 7-12 (`FlowWindow.java`)**\n\n![Image](img/00431.jpg)\n\n\
  ![Image](img/00432.jpg)\n\n图 7-13 显示了该类显示的窗口。注意按钮按照添加顺序从左到右出现。由于第一行只容下前两个按钮，第三个按钮被放置在第二行。默认情况下，每行的内容居中，且组件之间有五像素的间隙。\n\
  \n**图 7-13** `FlowWindow` 类显示的窗口\n\n![Image](img/00433.jpg)\n\n如果用户调整窗口大小，布局管理器会根据其规则重新定位组件。图\
  \ 7-14 显示了窗口在三种不同尺寸下的外观。\n\n**图 7-14** 调整大小后的按钮排列\n\n![Image](img/00434.jpg)\n\n\
  ##### 调整 FlowLayout 对齐方式\n\n`FlowLayout` 管理器允许将组件在每行中或沿每行的左边缘或右边缘对齐。重载构造函数允许你传递以下常量之一作为参数设置对齐方式：`FlowLayout.CENTER`、`FlowLayout.LEFT`\
  \ 或 `FlowLayout.RIGHT`。这是一个设置左对齐的示例：\n\n```java\nsetLayout(new FlowLayout(FlowLayout.LEFT));\n\
  ```\n\n\n\n\n\n图 7-15 显示了使用 `FlowLayout` 管理器的窗口示例，具有左对齐、居中和右对齐的功能。\n\n##### 调整 `FlowLayout`\
  \ 组件间距\n\n默认情况下，`FlowLayout`管理器在组件之间水平和垂直方向上都会插入 5 像素的间距。你可以通过向重载的 `FlowLayout`\
  \ 构造函数传递水平和垂直间距的值作为参数来调整此间距。构造函数的格式如下：\n\n```java\nFlowLayout(int alignment, int\
  \ horizontalGap, int verticalGap)\n```\n\n你将在上一节中讨论的对齐常量之一传递给 `alignment` 参数。`horizontalGap`\
  \ 参数是水平分离组件的像素数，`verticalGap` 参数是垂直分离组件的像素数。以下是构造函数调用的示例：\n\n```java\nsetLayout(new\
  \ FlowLayout(FlowLayout.LEFT, 10, 7));\n```\n\n该语句导致组件左对齐，水平间距为 10 像素，垂直间距为 7 像素。\n\
  \n**图 7-15 左、居中和右对齐**\n\n![Image](img/00435.jpg)\n\n#### `BorderLayout` 管理器\n\n\
  `BorderLayout`管理器将容器分为五个区域。这些区域被称为北（north）、南（south）、东（east）、西（west）和中心（center）。这些区域的布局如图图\
  \ 7-16 所示。\n\n**图 7-16** `BorderLayout`管理器的区域\n\n![Image](img/00436.jpg)\n\n当组件被放置在由`BorderLayout`管理器容器中，组件必须放置在上述五个区域之一。每个区域一次只能放置一个组件。向容器添加组件时，你通过将以下常量之一作为容器的`add`方法的第二个参数来指定区域：`BorderLayout.NORTH`、`BorderLayout.SOUTH`、`BorderLayout.EAST`、`BorderLayout.WEST`\
  \ 或 `BorderLayout.CENTER`。\n\n例如，看以下代码：\n\n```java\nJPanel panel = new JPanel();\n\
  JButton button = new JButton(\"Click Me\");\npanel.setLayout(new BorderLayout());\n\
  panel.add(button, BorderLayout.NORTH);\n```\n\n第一个语句创建了一个由`panel`变量引用的`JPanel`对象。第二个语句创建了一个由`button`变量引用的`JButton`对象。第三个语句将`JPanel`对象的布局管理器`BorderLayout`对象。第四个语句将`JButton`对象添加到`JPanel`对象的北（north）区域。\n\
  \n如果你不向`add`方法传递第二个参数，组件将添加到中心区域。以下是`BorderLayout`管理器遵循的某些规则：\n\n> • 每个区域一次只能容纳一个组件。\n\
  > • 当组件被添加到区域时，该组件会被拉伸以填充整个区域。\n\n看代码列表 7-13 中所示的`BorderWindow`类，该类继承自`JFrame`。此类创建了一个宽\
  \ 400 像素、高 300 像素的窗口。在构造函数中，调用了`setLayout`方法来给内容面板提供一个`BorderLayout`管理器。然后，创建了五个按钮，并将每个按钮添加到不同的区域。\n\
  \n**代码列表 7-13 (`BorderWindow.java)**\n\n![Image](img/00437.jpg)\n![Image](img/00438.jpg)\n\
  ![Image](img/00439.jpg)\n![Image](img/00005.jpg)\n\n***\n\n**注意：** `JFrame`对象的内容面板会自动被赋予一个`BorderLayout`管理器。我们在代码列表\
  \ 7-13 中显式地添加了它，以便清楚我们正在使用`BorderLayout`管理器。\n\n***\n\n图 7-17 显示了显示的窗口。通常情况下，按钮的大小仅足够容纳显示在按钮上的文本。请注意，此窗口中显示的按钮没有保留其原始大小。相反，它们被拉伸以填充其区域内的所有空间。如果用户调整窗口大小，组件的大小也会发生改变。这在图\
  \ 7-18 中所示。\n\n**图 7-17** `BorderWindow`类显示的窗口\n\n![Image](img/00440.jpg)\n\n以下是规定`BorderLayout`管理器如何调整组件大小的规则：\n\
  \n> • 放置在北或南区域的组件可以进行水平方向的调整以填充整个区域。\n> • 放置在东或西区域的组件可以进行垂直方向的调整以填充整个区域。\n\n**图\
  \ 7-18** 调整大小后的窗口\n\n![Image](img/00441.jpg)\n\n> • 放置在中心区域的组件可以同时进行水平和垂直方向的调整以填充整个区域。\n\
  \n![Image](img/00006.jpg)\n\n***\n\n**提示：** 你不需要在布局的每个区域中都放置一个组件。为了实现所需的布局，你可能希望将组件放在面板中。在第\
  \ 13 章](#dummy_split_014.html_filepos225796)中你会看到这种应用的示例。\n\n默认情况下，区域之间没有间距。然而，你可以使用重载的`BorderLayout`构造函数来指定水平和垂直间距。以下是构造函数的格式：\n\
  \n```java\nBorderLayout(int horizontalGap, int verticalGap)\n```\n\n`horizontalGap`参数是水平分离区域的像素数，`verticalGap`参数是垂直分离区域的像素数。以下是构造函数调用的示例：\n\
  \n```java\nsetLayout(new BorderLayout(5, 10));\n```\n\n该语句导致区域水平间距为 5 像素，垂直间距为 10\
  \ 像素。\n\n##### 在容器区域嵌套面板\n\n你可能认为`BorderLayout`管理器是有限制的，因为它每个区域只允许一个组件，并且放置区域的组件会自动调整大小以填充额外空间。然而，通过将组件添加到面板并将面板嵌套在区域中这些限制是可以克服的。\n\
  \n例如，假设我们希望修改代码列表 7-13 中的类，以便使按钮保留原始大小。我们可以通过将每个按钮放在独立的`JPanel`对象中，然后将这些`JPanel`对象添加到内容面板的区域来实现。这在图\
  \ 7-19 中有所说明。结果是，`BorderLayout`调整的是`JPanel`对象的大小，而不是它们包含的按钮。\n\n**图 7-19** 在每个区域内嵌套`JPanel`\n\
  \n![Image](img/00442.jpg)\n\n代码列表 7-14 展示了这种技术。该类引入了调整窗口的新方法。注意构造函数没有使用`setSize`方法显式设置窗口大小。相反，它在调用`setVisible`方法之前调用了`pack`方法。`pack`方法继承自`JFrame`，会自动调整窗口大小以容纳其中的组件。图\
  \ 7-20 显示了类显示的窗口。\n\n**代码列表 7-14 (BorderpanelWindow.java)**\n\n![Image](img/00443.jpg)\n\
  ![Image](img/00444.jpg)\n![Image](img/00445.jpg)\n\n**图 7-20** `BorderPanelWindow`类显示的窗口\n\
  \n![Image](img/00446.jpg)\n![Image](img/00005.jpg)\n\n***\n\n**注意：** `BorderPanelWindow`类中同时存在多个布局管理器。内容面板使用`BorderLayout`管理器，而每个`JPanel`对象都使用`FlowLayout`管理器。\n\
  \n***\n\n#### `GridLayout` 管理器\n\n\n\n\n\n`GridLayout` 布局管理器创建一个包含行和列的网格，类似于电子表格。因此，由\
  \ `GridLayout` 对象管理的容器被划分为等大小的单元格。图 7-21 展示了一个包含 3 行 5 列的容器。这意味着该容器被划分成了 15 个单元格。\n\
  \n图 7-21 `GridLayout` 布局管理器将容器划分为单元格\n\n![Image](img/00447.jpg)\n\n以下是 `GridLayout`\
  \ 布局管理器遵循的一些规则：\n\n> • 每个单元格只能容纳一个组件。\n> • 所有单元格的大小相同。该大小是放置在布局中最大的组件的大小。\n> • 放置在单元格中的组件会自动调整大小以填充任何额外空间。\n\
  \n你将容器应该拥有的行数和列数作为参数传递给 `GridLayout` 构造函数。以下是构造函数的通用格式：\n\n```\nGridLayout(int rows,\
  \ int columns)\n```\n\n以下是构造函数调用的示例：\n\n```\nsetLayout(new GridLayout(2, 3));\n\
  ```\n\n该语句为容器提供了两行三列，总共有六个单元格。你可以将 0 作为行或列的参数传递，但不能两个都传。两个参数都传 0 将导致错误。\n\n在向由 `GridLayout`\
  \ 布局管理器管理的容器添加组件时，你不能指定单元格。相反，组件按照它们添加的顺序分配到单元格中。第一个添加到容器的组件被分配给第一个单元格（位于左上角）。随着其他组件的添加，它们将从左到右分配到第一行的剩余单元格中。当第一行填满后，组件将分配到第二行的单元格中，依此类推。\n\
  \n代码列表 7-15 所示的 `GridWindow` 类演示了这一点。它创建了一个宽 400 像素、高 200 像素的窗口，由 `GridLayout` 布局管理器管理。内容面板被划分为两行三列，并在每个单元格中添加了一个按钮。图\
  \ 7-22 显示了该类显示的窗口。\n\n代码列表 7-15 (`GridWindow.java`)\n\n![Image](img/00448.jpg)\n\
  ![Image](img/00449.jpg)\n![Image](img/00450.jpg)\n\n如前所述，`GridLayout` 布局管理器限制每个单元格只能有一个组件，并调整组件大小以填充单元格中的所有空间。为了绕过这些限制，你可以在单元格内部嵌套面板（panels），并在面板中添加其他组件。例如，代码列表\
  \ 7-16 所示的 `GridPanelWindow` 类是 `GridWindow` 类的修改。它创建了六个面板，并在每个面板中添加了一个按钮和一个标签。然后将这些面板添加到内容面板的单元格中。图\
  \ 7-23 显示了该类显示的窗口。\n\n图 7-22 `GridWindow` 类显示的窗口\n\n![Image](img/00451.jpg)\n\n\
  代码列表 7-16 (`GridPanelWindow.java`)\n\n![Image](img/00452.jpg)\n![Image](img/00453.jpg)\n\
  ![Image](img/00454.jpg)\n![Image](img/00455.jpg)\n![Image](img/00456.jpg)\n\n图 7-23\
  \ `GridPanelWindow` 类显示的窗口\n\n![Image](img/00457.jpg)\n\n由于我们在内容面板内部嵌套了容器，因此 `GridPanelWindow`\
  \ 类中有多个布局管理器在工作。内容面板使用 `GridLayout` 布局管理器，而每个 `JPanel` 对象都使用 `FlowLayout` 布局管理器。\n\
