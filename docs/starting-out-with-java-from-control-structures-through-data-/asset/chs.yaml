  > • 给出的工作小时数无效。这应该是一个负数或大于 84 的数字。\n> • 给出的时薪率无效。这应该是一个负数或大于 25 的数字。\n\n修改 `Payroll`\
  \ 类，使其在发生上述任一种错误时均能抛出相应的异常。在程序中演示这些异常类。\n\n## 6. `FileArray` 类\n\n设计一个类，其中包含一个名为\
