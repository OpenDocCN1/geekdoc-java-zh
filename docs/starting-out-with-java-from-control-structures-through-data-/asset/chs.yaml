  \ *\n\n## 插入排序\n\n在插入排序中，我们首先查看数组的前两个元素。我们比较这些元素，并在必要时交换它们，以确保它们处于正确的顺序。这就成了数组的一个已排序部分。\n\
  \n然后，我们的目标是将数组的第三个元素合并到已经排序的数组部分。我们通过通过相对于前两个元素将其插入到适当的位置来实现这一点。如果我们需要移动前两个元素中的任何一个来容纳第三个元素，我们就这样做。一旦我们将第三个元素插入到正确的位置（相对于前两个元素），由前三个元素组成的数组初始部分就是排序有序的。\n\
  \n这个过程对于第四个及后续元素继续进行，直到所有元素都插入到它们正确的位置。让我们来看一个例子。假设我们从图 16-14 所示的 `int` 数组开始。如图所示，第一个和第二个元素的值顺序是错误的，因此它们将被交换。\n\
  \n**图 16-14** 未排序的数组\n\n![Image](img/01232.jpg)\n\n交换发生后，第一个和第二个元素将处于排序顺序。下一步是移动第三个元素的值，使其相对于前两个元素处于正确的位置。如图\
  \ 16-15 所示所示，第三个元素的值必须放置在第一个和第二个元素的值之间。\n\n**图 16-15** 第三个元素必须移动\n\n![Image](img/01233.jpg)\n\
  \n在第三个元素的值移动到它的新位置后，前三个元素将处于排序顺序。下一步是移动第四个元素的值，使其相对于前三个元素处于正确的位置。如图 16-16 所示，第四个元素的值必须放置在第二个和第三个元素的值之间。\n\
  \n**图 16-16** 第四个元素必须移动\n\n![Image](img/01234.jpg)\n\n在第四个元素的值移动到它的新位置后，前四个元素将处于排序顺序。下一步是移动第五个元素的值，使其相对于前四个元素处于正确的位置。如图\
  \ 16-17 所示，第五个元素的值必须放置在第一个和第二个元素的值之间。\n\n**图 16-17** 第五个元素必须移动\n\n![Image](img/01235.jpg)\n\
  \n在第五个元素的值移动到它的新位置后，前五个元素将处于排序顺序。下一步是移动第六个元素的值，使其相对于前五个元素处于正确的位置。如图 16-18 所示，第六个元素的值必须移动到数组的开头。\n\
  \n第六个元素是数组中的最后一个元素。一旦它移动到正确的位置，整个数组就排序完毕。这如图 16-19 所示。\n\n**图 16-18** 第六个元素必须移动\n\
  \n![Image](img/01236.jpg)\n\n**图 16-19** 所有元素都在正确的位置\n\n![Image](img/01237.jpg)\n\
  \n以下是插入排序的伪代码：\n\n```\nFor index equals 1 through last subscript\n    Save array[index]\
  \ in scan\n    While scan > 0 and array[scan-1] is greater than scan\n        Move\
  \ array[scan-1] to array[scan]\n        Subtract 1 from scan\n```\n\n接下来显示 `IntInsertionSorter`\
  \ 类，它有一个公共静态方法 `insertionSort`。你将一个 `int` 数组传递给该方法，它会对数组内容进行排序。代码列表 16-9 中的程序测试了该方法。\n\
