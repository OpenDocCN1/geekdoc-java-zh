  \n[content]\nIn this book’s source code folder `Chapter 19\\Iterable Files` contains\
  \ a modified version of the `ListType` class. This version of the class implements\
  \ the `Iterable` interface. We will not show all of the class in the text because\
  \ the only change that has been made is to implement the interface and add an `iterator`\
  \ method. The code for the `iterator` method is shown here:\n\n... (后续内容略)\n\n\n\
  \n\n### 3. 什么是基于数组的列表？\n\n### 4. 什么是可调整大小的数组列表？\n\n### 5. 列表的容量（capacity）和大小（size）有什么区别？\n\
  \n### 6.在本章介绍的类中，`contains` 方法和 `indexOf` 方法有什么区别？\n\n### 7.在本章介绍的类中，`resize` 方法将列表内部数组的长度改变了多少？\n\
  \n### 8. 迭代器的三个基本操作是什么？\n\n### 9. 如果你想使用增强型 `for` 循环来遍历你的列表类，你必须做什么？\n\n## 编程挑战\n\
  \n#### 1. 编写你自己的数组的列表类\n使用泛型（generics）从零开始编写你自己的数组的列表类。你可以实现在本章所示的 `GeneralList`\
  \ 接口，也可以编写自己的接口。无论哪种方式，请务必实现所有常用的列表操作。\n\n![Image](img/00010.jpg)\n\n#### 2. 容量增强\n\
  通过添加以下方法修改在本章介绍的 `ListType` 类：\n\n- `public int getCapacity()`\n  该方法应返回列表的当前容量。\n\
  \n- `public void ensureCapacity(int minCapacity)`\n  如果列表的容量小于 `minCapacity`，则该方法应将其增加到\
  \ `minCapacity`。\n\n- `public void trimToSize()`\n  该方法应修剪列表的容量，使其等于列表的当前大小。\n\n\
  在一个简单的程序中演示这些新方法。\n\n![Image](img/00010.jpg)\n\n#### 3. 拷贝构造函数和 `lastIndexOf` 方法\n\
  通过添加以下方法修改在本章介绍的 `ListType` 类：\n\n- 拷贝构造函数\n  为类添加一个拷贝构造函数，该函数接受另一个 `GeneralList`\
  \ 对象的引用。\n- `public int lastIndexOf(E element)`\n  该方法应返回指定元素的最后一个索引。\n\n在一个简单的程序中演示这些新方法。\n\
  \n#### 4. `removeRange` 方法\n通过添加以下方法修改在本章介绍的 `ListType` 类：\n\n```public void removeRange(int\
  \ fromIndex, int toIndex)\n```\n\n该方法应删除索引在 `fromIndex`（包含）到 `toIndex`（不包含）范围内的所有元素。列表中所有随后的元素都应向列表前端移动，以填充被删除元素留下的空格。如果指定的索引任一无效，该方法应抛出\
  \ `IndexOutOfBoundsException`。\n\n#### 5. 可排序的 `StringListType`\n通过添加一个执行快速排序算法的方法修改在本章介绍的\
  \ `StringListType` 类。（有关快速排序的信息请参见第 16 章）。在方法运行后，列表元素应按升序排列。\n\n![Image](img/00010.jpg)\n\
  \n#### 6. `OrderedStringListType` 类\n在本章中我们介绍了一个名为 `StringListType` 的类，它包含一个`String`对象的列表。现在你需要编写一个名为\
  \ `OrderedStringListType` 的类。该类应该包含一个`String`对象的列表，且这些元素始终按升序排列。该类应该支持表 19-4 中描述的操作。\n\
  \n**表 19-4** `OrderedStringListType` 类中需要支持的操作\n\n![Image](img/01491.jpg)\n\n注意，当调用\
  \ `add` 操作时，列表类将确定元素的位置。该类不应按照添加顺序存储元素，而应按升序存储元素。\n\n#### 7. `OrderedStringListType`\
