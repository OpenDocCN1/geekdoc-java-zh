  * 1.23 使用示例数据或输入测试程序的目的是什么？\n\n## 1.7 面向对象编程\n\n> **概念：Java 是一种面向对象编程 (OOP) 语言。OOP\
  \ 是一种软件开发方法，它有自己的实践、概念和词汇。**\n\n目前使用的编程方法主要有两种：过程化和面向对象化。最早的编程语言是过程化的，这意味着程序由一个或多个过程组成。`procedure`（过程）是一组编程语句，它们共同执行特定任务。这些语句可能会从用户处收集输入，处理存储在计算机内存中的数据，并执行完成任务所需的任何操作。\n\
  \n过程通常在独立于过程的数据项上进行操作。在过程化程序中，数据项通常从一个过程传递到另一个过程，如图 1-9 所示。\n\n**图 1-9 数据在过程之间传递**\n\
  \n![Image](img/0023.jpg)\n\n正如你所想象的，过程化编程的重点在于创建操作数据的过程。然而，数据与操作数据的代码分离往往会导致问题。例如，数据存储在特定的格式中，该格式由变量和从变量创建的更复杂的结构组成。操作数据的过程设计时必须考虑这种格式。但是，如果数据格式发生了变化会怎样？经常，程序的规范会改变，导致重新设计数据格式。当数据结构变化时，操作数据的代码也必须更改以接受新格式。这增加了程序员的额外工作，并增加了\
  \ Bug 出现的机会。\n\n这推动了从过程化编程向面向对象编程 (OOP) 的转变。过程化编程以创建过程为中心，而面向对象编程以创建对象为中心。对象是一个包含数据和过程的软件实体。对象包含的数据被称为对象的\
  \ `attributes`（属性）。对象执行的过程或行为，被称为对象的 `methods`（方法）。从概念上说，对象是一个由数据（属性）和过程（方法）组成的自包含单元。这在图\
  \ 1-10 中得到了所示。\n\nOOP 通过封装和数据隐藏解决了代码/数据分离的问题。`Encapsulation`（封装）指的是将数据和代码合并到单个对象中。`Data\
  \ hiding`（数据隐藏）指的是对象将其数据隐藏在对象外部代码之外。只有对象的方法才能直接访问并更改对象的数据。对象通常隐藏其数据，但允许外部代码访问操作数据的方法。如图\
  \ 1-11 所示，对象的方法为对象外部的编程语句提供了间接访问对象数据的途径。\n\n\n\n\n当一个对象的内部数据对外部代码隐藏，并且对该数据的访问限制在对象的方法中时，这些数据就防止了意外损坏。此外，对象外部的程序代码不需要了解对象数据的格式或内部结构。代码只需要与对象的方法进行交互。当程序员更改对象内部数据的结构时，他或她也会修改对象的方法，以便它们能够正确地处理数据。然而，外部代码与方法交互的方式不会改变。\n\
  \n**图 1-10** 一个包含数据和过程的对象\n\n![Image](img/00024.jpg)\n\n**图 1-11** 对象外部的代码与对象的方法交互\n\
  \n![Image](img/00025.jpg)\n\n这些只是面向对象编程的益处之一。由于 Java 是完全面向对象的，随着本书的阅读，你将学习到更多 OOP\
  \ 实践、概念和术语。\n\n#### ![Image](img/00004.jpg) 检查点\n\n> 1.24 在过程编程中，程序的哪两个部分通常是分开的？\n\
  \n> 1.25 对象的属性是什么？\n\n> 1.26 对象的方法是什么？\n\n> 1.27 什么是封装？\n\n> 1.28 什么是数据隐藏？\n\n***\n\
