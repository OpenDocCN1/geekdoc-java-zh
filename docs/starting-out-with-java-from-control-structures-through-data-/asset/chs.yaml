  \n### 题与\n\n* 14.1 Applet 简介\n* 14.2 HTML 简介绍\n* 14.3 使用 Swing 创建 Applet\n* 14.4\
  \ 使用 AWT 提高可移植性\n* 14.5 绘制形状\n* 14.6 处理鼠标事件\n* 14.7 `Timer` 对象\n* 14.8 播放音频\n* 14.9\
  \ 需避免的常见错误\n\n***\n\n## 14.1 Applet 简介\n\n> **概念：Applet 是一种与 Web 页面相关并在 Web 浏览器中作为该页面的一部分执行的\
  \ Java 程序**。\n\n回想第 1 章，你可以用 Java 创建两种类型的程序：应用程序（applications）和 Applet（applets）。*应用程序*是运行在你的计算机上的独立程序。到目前为止，我们在书中一直只专注于编写应用程序。\n\
  \n*Applet* 通常是网站的一部分的 Java 程序。如果用户使用启用 Java 的浏览器打开网站，applet 就会在浏览器窗口内执行。对用户来说，applet\
  \ 就像是网站的一部分。其工作原理如下：Applet 与网站的网页页面一起存储在 Web 服务器上。当用户使用浏览器访问服务器上的 Web 页面时，任何与该页面相关的\
  \ applet 都会通过互联网从服务器传输到用户的系统。这在图 14-1 中所示。一旦 applet 传输完成，用户的系统就会执行它们。\n\nApplet\
  \ 非常重要，因为它们可以用于扩展 Web 页面的功能。Web 通常用超文本标记语言（HTML）编写。然而，HTML 是有限的，因为它仅仅描述 Web 页面的内容和布局，并创建指向其他文件和\
  \ Web 页面的链接。HTML 不具备如执行数学计算和与用户交互等复杂功能。程序员可以编写 Java applet 来执行此类操作并将其与 Web 页面关联。\n\
  \n![Image](img/0105.jpg)\n\n**图 14-1** Applet 与网页一同传输\n\n![Image](img/0106.jpg)\n\
  \n**图 14-2** 带 applet 的网页\n\n***\n\nApplet 并不一定要在服务器上才能执行。图 14-2 所示的网页位于 *TempConverter*\
  \ 文件夹中，该文件夹可在 [www.pearsonhighered.com/gaddis](http://www.pearsonhighered.com/gaddis)\
  \ 获取。在浏览器中打开 `TempConverter.html` 文件尝试一下。在本章后面我们将详细查看此网页及其 applet。\n\n***\n\n大多数\
  \ 浏览器都有一个运行 applet 的特殊 JVM 版本。出于安全考虑，此版本的 JVM 大限制了 applet 的操作。以下是 applet 限制总结：\n\
  \n> Applet 不能在用户系统上删除文件、读取文件内容或创建文件。\n> Applet 不能在用户系统上运行任何程序。\n> Applet 不能在用户系统上执行操作系统过程。\n\
  > Applet 不能检索有关用户系统或用户身份的信息。\n> Applet 不能与除服务器以外的任何系统建立网络连接。\n> 如果 applet 显示窗口，窗口内会自动显示诸如“警告：Applet\
  \ 窗口”的消息。这让用户知道该窗口不是由系统上的应用程序显示的。\n\n这些限制看起来可能很严，但对于防止恶意代码攻击或监视不知情的用户来说是必要的。如果 applet\
  \ 尝试违反这些限制之一，就会抛出异常。\n\n##### ![Image](img/00004.jpg)**Checkpoint\n\n> 14.1 与 Web\
  \ 页面关联的 applet 是如何在用户的系统上执行的？\n\n> 14.2 为什么 applet 在受限的环境中运行？\n\n\n\n\n\n# 14.2\
  \ HTML 简介绍\n\n> **概念：在创建网页时，你使用超文本标记语言（HTML）来创建一个可以被 Web 浏览器读取和处理的文件。**\n\n超文本标记语言（HTML）是编写网页的语言。虽然向你介绍关于\
  \ HTML 的所有内容超出了本书的范围，但本节将为你提供足够的基础知识，让你能够编写简单的网页。为了运行 Java applet，你只需要了解一点 HTML。如果你已经熟悉\
  \ HTML，那么本节内容是可选的。\n\n在继续之前，让我们先来看“超文本”和“标记语言”这两个术语的含义。\n\n## 超文本\n\n网页可以包含普通文本和超文本，它们都会在浏览器窗口中显示。此外，`hypertext`\
  \ 可以包含指向另一个网页的链接，或者指向同一个网页中的另一个位置。当用户点击超文本时，它会加载该超文本链接到的网页或位置。\n\n## 标记语言\n\n尽管\
  \ HTML 被称为一种语言，但它不是像 Java 那样的编程语言。相反，HTML 是一种`markup language.`。它允许你通过插入特殊指令来对文本文件进行“标记”。这些指令告诉浏览器如何格式化文本以及创建任何超文本链接。\n\
  \n要创建一个网页，你需要创建一个包含 HTML 指令的文本文件，这些指令被称为`tags`（标签），以及要在网页上显示的文本。生成的文件被称为`HTML document`（HTML\
  \ 文档），通常以 `.html` 文件扩展名保存。当 Web 浏览器读取 HTML 文档时，标签指示它如何格式化文本、在何处放置图像、用户点击链接时做什么等。\n\
  \n大多数 HTML 标签都是成对出现的。第一个被称为起始标签（opening tag），第二个被称为结束标签（closing tag）。简单标签的通用格式如下：\n\
  \n```\n     <tag_name>\n     Text\n     </tag_name>\n```\n\n在这个通用格式中，`tag_name`\
  \ 是标签的名称。起始标签是 `<tag_name>`，结束标签是 `</tag_name>`。起始标签和结束标签都包含在角括号（`< >`）中。注意，在结束标签中，标签名称前面有一个正斜杠（`/`）。出现在起始和结束标签之间的\
  \ `Text` 是由标签进行格式化或修改的文本。\n\n## 文档结构标签\n\n某些 HTML 标签用于建立 HTML 文档的结构。你应该学习的第一个结构标签是\
  \ `<html></html>`。此标签标记了 HTML 文档的开始和结束。这些标签之间的所有内容（包括其他标签）都是网页的内容。当你编写 HTML 文档时，在最开始处放置一个\
  \ `<html>` 标签，在最末尾放置一个 `</html>` 标签。\n\n下一个标签是 `<head></head>`。出现在 `<head>` 和 `</head>`\
  \ 之间的所有内容都被视为文档头（document head）的一部分。`document head` 是 HTML 文件的一个部分，包含了关于文档的信息。例如，搜索引擎用于识别文档的关键词通常放置在文档的头中。我们将使用文档头的唯一目的是是在\
  \ Web 浏览器的标题栏中显示一个标题（title）。你通过`<title></title>` 标签来实现这一点。你放置在 `<title>` 和 `</title>`\
  \ 之间的任何文本将成为页面的标题，并显示在浏览器的标题栏中。代码列表 14-1 显示了标题为“My First Web Page”的 HTML 文档内容。\n\
  \n注意`<title></title>` 标签位于 `<head></head>` 标签内部。此网页显示的唯一输出是标题。图 14-3 显示了此网页在浏览器中打开时的显示情况。\n\
  \n**代码列表 14-1 (`BasicWebPage1.html`)**\n\n![Image](img/01058.jpg)\n\n**图 14-3**\
  \ 只有标题的网页\n\n![Image](img/01059.jpg)\n\n文档头之后是文档主体（document body），它包含在 `<<body>></</body>`\
  \ 标签中。`document body` 包含了在浏览器窗口中输出的所有标签和文本。代码列表 14-2 显示了一个在其主体中放置了文本的 HTML 文档。图\
  \ 14-4 显示了该文档在浏览器中打开时的样子。\n\n**代码列表 14-2 (`BasicWebPage2.html`)**\n\n![Image](img/01060.jpg)\n\
  \n**图 14-4** 由 *BasicWebPage2.html* 生成的网页\n\n![Image](img/01061.jpg)\n\n## 文本格式标签\n\
  \n图 14-4 网页中显示的文本是未格式化的，这意味着它以纯文本的形式出现。你可以使用许多 HTML 标签来改变文本的外观。标题数字越大，文本越小。例如，看以下内容：\n\
  \n```\n<h1>This is h1</h1>\n<h2>This is h2</h2>\n<h3>This is h3</h3>\n<h4>This is\
  \ h4</h4>\n<h5>This is h5</h5>\n<h6>This is h6</h6>\n```\n\n`h1` 标签创建一个一级标题。`h2`\
  \ 标签创建一个二级标题，它比一级标题小。这种模式在其他标签上继续。\n\n你可以使用 `<center></center>` 标签使某行居中。为了演示，我们在文档\
  \ 代码列表 14-2 中添加了以下内容：\n\n```\n<center><h1>Java</h1></center>\n```\n\n这将导致“Java”一词作为一级标题居中显示。注意，在\
  \ HTML 文档中，“Java”一词被两组标签包围着：`<center>` 标签和 `<h1>` 标签。先使用哪一组标签并不重要。如果我们按照如下方式编写该行，我们将得到相同的结果：\n\
  \n```\n<h1><center>Java</center></h1>\n```\n\n修改后的文档显示代码列表 14-3 中，它生成的网页显示图 14-6\
  \ 中。\n\n**代码列表 14-3 (`BasicWebPage3.html`)**\n\n![Image](img/01063.jpg)\n\n**图 14-6**\
  \ 由 *BasicWebPage3.html* 生成的网页\n\n![Image](img/01064.jpg)\n\n## 在文本中创建换行\n\n我们将查看三个用于创建文档文本换行的\
  \ HTML 标签。这三个标签与我们之前学习的标签不同，因为它们不是成对出现的。当你使用其中任何一个标签时，只需插入一个起始标签。\n\n\n\n\n\n`<br\
  \ />` 标签会在文本中插入的位置产生一个换行符。在 HTML 文档中，通常有必要插入 `<br />` 标签，因为因为浏览器通常会忽略按下回车键时产生的换行符。例如，如果以下行出现在\
  \ HTML 文档的正文部分中，它将导致如图 14-7 所示的输出。\n\n```\nFirst line<br />Second line<br />Third\
  \ line\n```\n\n**图 14-7** HTML 文档中的换行\n\n![Image](img/01065.jpg)\n\n`<p />` 标签会在文本中插入的位置产生一个段落分隔。段落分隔通常比换行符在文本中插入更多空间。例如，如果以下行出现在\
  \ HTML 文档的正文部分中，它将导致如图 14-8 所示的输出。\n\n```\nFirst paragraph<p />Second paragraph<p\
  \ />Third paragraph\n```\n\n**图 14-8** HTML 文档中的段落分隔\n\n![Image](img/01066.jpg)\n\
  \n`<hr />` 标签会在文本中插入的位置产生一条水平线。水平线是一条横跨 Web 页面的细水平线。例如，如果以下文本出现在 HTML 文档的正文部分中，它将导致如图\
  \ 14-9 所示的输出。\n\n```\n     This is the first line of text.\n     <hr />\n     This\
  \ is the second line of text.\n     <hr />\n     This is the third line of text.\n\
  ```\n\n**图 14-9** Web 页面上的水平线\n\n![Image](img/01067.jpg)\n\n代码列表 14-4 所示的 HTML 文档演示了我们讨论过的每一个标签。它生成的\
  \ Web 页面如图 14-10 所示。\n\n**代码列表 14-4 (`BasicWebPage4.html`)**\n\n![Image](img/01068.jpg)\n\
  \n**图 14-10** 由 `BasicWebPage4.html` 生成的 Web 页面\n\n![Image](img/01069.jpg)\n\n###\
  \ 插入链接\n\n如前所述，链接是 Web 页面上的一个允许用户点击的元素。当用户点击链接时，会显示另一个 Web 页面，或者启动某种操作。我们现在查看如何插入一个导致显示另一个\
  \ Web 页面的简单链接。用于插入链接的标签具有以下通用格式：\n\n```\n   <a href=\"Address\">Text</a>\n```\n\n\
  出现在起始标签和结束标签之间的 `Text` 是将将在 Web 页面上显示的文本。当用户点击此文本时，浏览器将显示位于 `Address` 所在位置的 Web\
  \ 页面。此地址通常被称为*统一资源定位符*（`URL`）。注意地址被包含在引号中。这是一个例子：\n\n```\n      <a href=\"http://www.gaddisbooks.com\"\
  >Click here to go to\n      the textbook's web site.</a>\n```\n\n代码列表 14-5 所示的 HTML\
  \ 文档使用了这个链接，而图 14-11 显示了该页面在浏览器中的外观。\n\n**代码列表 14-5 (`LinkDemo.html`)**\n\n![Image](img/01070.jpg)\n\
