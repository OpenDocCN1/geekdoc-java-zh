  \n你可以使用 `java.io.File` 类来访问计算机上与文件和文件系统相关的信息。`File` 类首次引入 `第 13 章`，它是文件或目录的抽象表示（目录被视为特殊类型的文件）。以下是该类提供的一些方法：\n\
