  \n## 2.12 编程风格\n\n> **概念：编程风格是指程序员使用空格、缩进、空行和标点字符在视觉上安排程序源代码的方式**。\n\n在第 1 章中，你学习了语法规则规定了语言的使用方式。Java\
  \ 的语法规则规定了如何以及在何处放置关键字、分号、逗号、括号以及语言的其他元素。编译器会检查语法错误，如果没有错误，则生成字节码。\n\n当编译器读取程序时，它将其处理为一个很长的字符流。编译器并不关心每个语句是否在单独的一行，也不关心空格是否将操作符与操作数分开。相反，人类发现很难阅读不是以视觉美感编写的程序。以代码列表\
  \ 2-27 例。\n\n#### 代码列表 2-27 (`Compact.java`)\n\n![Image](img/00089.jpg)\n\n**程序输出**\n\
  \n`There were 220 shares sold at $14.67 per share.`\n\n尽管该程序在语法上是正确的（它没有违反 Java\
  \ 的任何规则），但它很难阅读。代码列表 2-28 显示了相同的程序，但使用了更易理解的风格编写。\n\n#### 代码列表 2-28 (`Readable.java`)\n\
  \n![Image](img/00090.jpg)\n\n**程序输出**\n\n`There were 220 shares sold at $14.67 per\
  \ share.`\n\n*编程风格*一术通常指的是源代码在视觉上的安排方式。它包括在程序中一致地放置空格和缩进的技术，从而创建视觉线索。这些线索可以快速告诉程序员关于程序的重要信息。\n\
  \n例如，注意代码列表 2-28，在类的大括号内部，每行都缩进了，在 `main` 方法的大括号内部，每行再次缩进。将一组大括号内的所有行缩进是一种常见的编程风格，如图\
  \ 2-11 所示。\n\n#### 图 2-11 缩进\n\n![Image](img/00091.jpg)\n\n编程风格的另一个方面是处理无法放在一行的语句。注意\
  \ `println` 语句跨越了三行。在语句的第二行和第三行开头插入额外的空格，以指示它们是延续。\n\n当声明多个相同类型的变量时，通常做法是将每个变量单独写一行，并附上说明变量的注释。这是一个示例：\n\
  \n`int fahrenheit,    // 用于存储华氏温度`\n`     celsius,      // 用于存储摄氏温度`\n`     kelvin;\
  \       // 用于存储开文温度`\n\n你可能已经注意到示例程序中在变量声明和后续语句之间插入了空行。这是为了在视觉上分离它们。\n\n与编程风格相关的许多其他问题将贯穿本书。\n\
  \n## 2.13 读取键盘输入\n\n> **概念：可以使用 Scanner 类对象从键盘读取输入**。\n\n之前我们讨论了 `System.out` 对象以及它指向标准输出设备。Java\
  \ API 有另一个对象 `System.in`，它指向标准输入设备。*标准输入设备*通常是键盘。你可以使用 `System.in` 对象读取在键盘上输入的击键。\n\
  \n\n\n\n声明了一个名为 `keyboard` 的变量。该变量的数据类型为 `Scanner`。由于 `Scanner` 是一个类，因此 `keyboard`\
  \ 变量是一个类类型变量。回想我们 `String` 对象的讨论，类类型变量持有对象的内存地址。因此，`keyboard` 变量将用于存储 `Scanner`\
  \ 对象的地址。语句的第二部分如下：\n\n```java\n= new Scanner(System.in);\n```\n\n在语句的这部分，我们首先看到的是赋值运算符（`=`）。赋值运算符将某个值赋给\
  \ `keyboard` 变量。在赋值运算符之后，我们看到了 `new` 单词，这是一个 Java 关键字。`new` 关键字的目的是在内存中创建一个对象。将创建的对象的类型列列在其后面。在这种情况下，我们在\
  \ `new` 关键字后面看到了 `Scanner(System.in)`。这指定应该创建一个 `Scanner` 对象，并将其连接到 `System.in`\
  \ 对象。该对象的内存地址（通过 `=` 运算符）赋值给变量 `keyboard`。语句执行后，`keyboard` 变量将引用内存中创建的 `Scanner`\
  \ 对象。\n\n图 2-12 指出了该语句每个部分的目的。图 2-13 说明了 `keyboard` 变量如何引用 `Scanner` 类的对象。\n\n**图\
  \ 2-12** 语句各个部分\n\n![Image](img/00092.jpg)\n\n**图 2-13** `keyboard` 变量引用 `Scanner`\
  \ 对象\n\n![Image](img/00093.jpg)\n\n![Image](img/00005.jpg)\n\n***\n\n**注意：** 在前面的代码中，我们选择了\
  \ `keyboard` 作为变量名。`keyboard` 这个名字并没有特殊之处。我们之所以选择这个名字是因为我们将使用该变量从键盘读取输入。\n\n***\n\
  \n`Scanner` 类具有读取字符串、`byte`、整数、`long` 整数、`short` 整数、`float` 和 `double` 的方法。例如，下面的代码使用\
  \ `Scanner` 类对象从键盘读取一个 `int` 值并将该值赋给 `number` 变量。\n\n```java\n         int number;\n\
  \         Scanner keyboard = new Scanner(System.in);\n         System.out.print(\"\
  Enter an integer value: \");\n         number = keyboard.nextInt();\n```\n\n这里显示的最后语句调用了\
  \ `Scanner` 类的 `nextInt` 方法。`nextInt` 方法将输入值格式化为 `int`，然后返回该值。因此，该语句将在键盘上输入的输入格式化为\
  \ `int`，然后返回。该值被赋给 `number` 变量。\n\n表 2-17 列出了 `Scanner` 类的若干方法并描述了它们的用途。\n\n**表\
  \ 2-17** `Scanner` 类的一些方法\n\n![Image](img/00094.jpg)\n\n![Image](img/00095.jpg)\n\
  \n### 使用 `import` 语句\n\n在准备好使用 `Scanner` 类之前，还有一个关于该类的细节你需要知道。`Scanner` 类不会自动供你的\
  \ Java 程序使用。任何使用 `Scanner` 类的程序都应该在文件的开头（任何类定义之前）包含以下语句：\n\n```java\nimport java.util.Scanner;\n\
  ```\n\n该语句告诉 Java 编译器在 Java 库的何处找到 `Scanner` 类，并使其对程序可用。\n\n代码列表 2-29 显示了使用 `Scanner`\
  \ 类读取 `String`、`int` 和 `double`。\n\n**代码列表 2-29 (`Payroll.java`)**\n\n![Image](img/00096.jpg)\n\
  \n***\n\n**加粗显示的示例输入的程序输出**\n\n`What is your name?` **`Joe Mahoney [Enter]`**\n\n\
  `How many hours did you work this week?` **`40 [Enter]`**\n\n`What is your hourly\
  \ pay rate?` **`20 [Enter]`**\n\n`Hello Joe Mahoney`\n\n`Your gross pay is $800.0`\n\
  \n***\n\n***\n\n![Image](img/00005.jpg)\n\n**注意：** 注意到，我们使用的每个 `Scanner` 类方法在返回值之前都会等待用户按下\
  \ ![Image](img/00097.jpg) 键。当按下 ![Image](img/00097.jpg) 键时，光标会自动移动到下一行以便进行后续的输出操作。\n\
  \n***\n\n### 读取字符\n\n有时你想要从键盘读取单个字符。例如，你的程序可能会向用户提一个是/否的问题，并指定他或她输入 Y 表示是，输入 N 表示否。然而，`Scanner`\
  \ 类没有读取单个字符的方法。我们在书中将使用的用于读取字符的方法是：使用 `Scanner` 类的 `nextLine` 方法从键盘读取一个字符串，然后使用\
  \ `String` 类的 `charAt` 方法提取字符串的第一个字符。这将是用户在键盘上输入的字符。这是一个示例：\n\n```java\n       \
  \  String input;  // 用于存储一行输入\n         char answer;   // 用于存储单个字符\n         //\
  \ 为键盘输入创建一个 Scanner 对象。\n         Scanner keyboard = new Scanner(System.in);\n \
  \        // 向用户提一个问题。\n         System.out.print(\"Are you having fun? (Y=yes, N=no)\
  \ \");\n         input = keyboard.nextLine(); // 获取一行输入\n         answer = input.charAt(0);\
  \ // 获取第一个字符\n```\n\n`input` 变量引用一个 `String` 对象。该代码中的最后一条语句调用了 `String` 类的 `charAt`\
  \ 方法来获取位置 0 字符，即第一个字符。在该语句执行后，`answer` 变量将持有用户在键盘上输入的字符。\n\n### 混合调用 `nextLine`\
  \ 与其他方法\n\n当你调用其中一个 `Scanner` 方法来读取一个基本数据类型值（如 `nextInt` 或 `nextDouble`），然后调用 `nextLine`\
  \ 方法读取字符串时，可能会出现一个恼人且难以发现的问题。例如，查看代码列表 2-30 中的程序。\n\n**代码列表 2-30 (`InputProblem.java`)**\n\
  \n![Image](img/00098.jpg)\n\n***\n\n**加粗显示的示例输入的程序输出**\n\n`What is your age?` **`24\
  \ [Enter]`**\n\n`What is your annual income?` **`50000.0 [Enter]`**\n\n`What is\
  \ your name? Hello. Your age is 24 and your income is $50000.0`\n\n***\n\n注意示例输出，程序首先允许用户输入年龄。第\
  \ 20 行语句从键盘读取一个 `int` 并将值赋给 `age` 变量。接下来，用户输入收入。第 24 行语句从键盘读取一个 `double` 并将值赋给 `income`\
  \ 变量。然后要求用户输入姓名，但似乎第 28 行语句被跳过了。姓名从未从键盘被读取。这种情况的发生是因为 `nextLine` 方法与其他 `Scanner`\
  \ 类方法之间行为的细微差异。\n\n当用户在键盘上输入按键时，这些按键被存储在一个有时被称为*键盘缓冲区*（keyboard buffer）的内存区域。按下\
  \ ![Image](img/00097.jpg) 键会导致一个换行字符存储在键盘缓冲区。在代码列表 2-30 程序的示例运行中，用户被要求输入年龄，第 20\
  \ 行语句调用 `nextInt` 方法从键盘缓冲区读取一个整数。注意用户输入了 24 然后按下了 ![Image](img/00097.jpg) 键。`nextInt`\
  \ 方法从键盘缓冲区读取了值 24，然后在遇到换行字符时停止。因此，值 24 从键盘缓冲区被读取，但换行字符没有被读取。换行字符留在键盘缓冲区中。\n\n\n\n\
  \n\n接下来，用户被要求输入其年收入。用户输入了 50000.00 然后按下了 ![Image](img/00097.jpg) 键。当第 24 行的 `nextDouble()`\
  \ 方法执行时，它首先遇到了 `nextInt()` 方法留下的换行符。这不会引起问题，因为 `nextDouble()` 方法的设计会自动跳过它遇到的任何领先换行符。它会跳过初始的换行符，从键盘缓冲区中读取值\
  \ 50000.00，并在遇到下一个换行符时停止读取。这个换行符会被留在了键盘缓冲区中。\n\n接下来，用户被要求输入其姓名。在第 28 行调用了 `nextLine()`\
  \ 方法。然而，`nextLine()` 方法的设计并不是为了跳过初始换行符。如果换行符是 `nextLine()` 方法遇到的第一个字符，则将无内容读取。由于第\
  \ 24 行的 `nextDouble()` 方法在键盘缓冲区中留下了一个换行符，`nextLine()` 方法不会读取任何输入。相反，它会立即终止，用户将没有机会输入姓名。\n\
  \n虽然这个问题的细节看起来可能很困惑，但解决方案很简单。代码列表 2-31 中的程序是代码列表 2-30 的修改版，解决了输入问题。\n\n### 代码列表\
  \ 2-31 (`CorrectedInputProblem.java`)\n\n![Image](img/00099.jpg)\n\n![Image](img/00100.jpg)\n\
  \n* * *\n\n* * *\n\n### 示例输入以粗体显示的程序输出\n\n`What is your age?` **`24 [Enter]`**\n\
  \n`What is your annual income?` **`50000.00 [Enter]`**\n\n`What is your name?` **`Mary\
  \ Simpson [Enter]`**\n\n`Hello Mary Simpson. Your age is 24 and your income is $50000.0`\n\
  \n* * *\n\n注意，在第 24 行通过 `nextDouble()` 方法读取用户收入后，在第 27 行调用了 `nextLine()` 方法。此调用的目的是消耗或移除残留在键盘缓冲区中的换行符。然后，在第\
  \ 31 行再次调用了 `nextLine()` 方法。这次它正确地读取了用户的姓名。\n\n![Image](img/00005.jpg)\n\n* * *\n\
  \n**注意：** 注意在第 27 行，当我们消耗剩余的换行符时，没有将方法的返回值赋值给任何变量。这是因为我们只是调用该方法来移除换行符，我们不需要保留方法的返回值。\n\
  \n* * *\n\n## 2.14 对话框\n\n> **概念：`JOptionPane` 类允许你快速显示对话框，这是一个显示消息或请求输入的小型图形化窗口。**\n\
  \n*对话框*是一个小型的图形化窗口，用于向用户显示消息或请求输入。你可以使用 `JOptionPane` 类快速显示对话框。在本节中，我们将讨论以下类型的对话框以及你如何使用\
  \ `JOptionPane` 显示它们：\n\n> • 消息对话框：显示消息的对话框；同时显示一个 OK 按钮\n> • 输入对话框：提示用户输入的对话框，并提供一个输入文本的字段；同时显示\
  \ OK 按钮和取消按钮\n\n图 2-14 显示了每种对话框的示例。\n\n**图 2-14** 消息对话框和输入对话框\n\n![Image](img/00101.jpg)\n\
  \n`JOptionPane` 类对你的 Java 程序并不是自动可。任何使用 `JOptionPane` 类的程序都必须在文件开头包含以下语句：\n\n`import\
  \ javax.swing.JOptionPane;`\n\n该语句告诉编译器去哪里寻找 `JOptionPane` 类，并使其对你的程序可用。\n\n####\
  \ 显示消息对话框\n\n`showMessageDialog()` 方法用于显示消息对话框。这里有一个调用该方法的语句：\n\n`JOptionPane.showMessageDialog(null,\
  \ \"Hello World\");`\n\n第一个参数仅在显示其他图形化窗口的程序中重要。你将在第 7 章 中学习更多相关内容。在此之前，我们将始终将关键字\
  \ `null` 作为第一个参数。这会导致对话框显示在屏幕中心。第二个参数是我们希望在对话框中显示的消息。这段代码将使图 2-15 中的对话框出现。当用户点击\
  \ OK 按钮时，对话框将关闭。\n\n**图 2-15** 消息对话框\n\n![Image](img/00102.jpg)\n\n#### 显示输入对话框\n\
  \n输入对话框是一种请求用户输入数据的快速简单方法。你使用 `JOptionPane` 类的 `showInputDialog()` 方法来显示输入对话框。以下代码调用了方法：\n\
  \n```java\nString name;\nname = JOptionPane.showInputDialog(\"Enter your name.\"\
  );\n```\n\n`JOptionPane` 类对你的 Java 程序并不是自动可。任何使用 `JOptionPane` 类的程序都必须在文件开头包含以下语句：\n\
  \n`import javax.swing.JOptionPane;`\n\n该语句告诉编译器去哪里寻找 `JOptionPane` 类，并使其对你的程序可用。\n\
  \n#### 显示消息对话框\n\n`showMessageDialog()` 方法用于显示消息对话框。这里有一个调用该方法的语句：\n\n`JOptionPane.showMessageDialog(null,\
  \ \"Hello World\");`\n\n第一个参数仅在显示其他图形化窗口的程序中重要。你将在第 7 章 中学习更多相关内容。在此之前，我们将始终将关键字\
  \ `null` 作为第一个参数。这会导致对话框显示在屏幕中心。第二个参数是我们希望在对话框中显示的消息。这段代码将使图 2-15 中的对话框出现。当用户点击\
  \ OK 按钮时，对话框将关闭。\n\n**图 2-15** 消息对话框\n\n![Image](img/00102.jpg)\n\n#### 显示输入对话框\n\
  \n输入对话框是一种请求用户输入数据的快速简单方法。你使用 `JOptionPane` 类的 `showInputDialog()` 方法来显示输入对话框。以下代码调用了方法：\n\
  \n```java\nString name;\nname = JOptionPane.showInputDialog(\"Enter your name.\"\
  );\n```\n\n`showInputDialog()` 方法总是返回一个 `String` 类型，即使用户输入的是数值数据。例如，如果用户在输入对话框中输入\
  \ 72，`showInputDialog()` 方法将返回字符串 `\"72\"`。如果用户点击取消按钮，`name` 将引用特殊值 `null`。\n\n\
  **图 2-16** 输入对话框\n\n![Image](img/00103.jpg)\n\n#### 示例程序\n\n代码列表 2-32 展示了如何使用两种类型的对话框。该程序使用输入对话框请求用户输入姓名，然后消息对话框显示问候。\n\
