  \ = 5; x <= 14; x += 3)\n```\n\n> 4.10 写一个显示 10 次名字的 `for` 循环。\n\n> 4.11 写一个显示所有奇数的\
  \ `for` 循环。\n\n> 4.12 写一个显示零的 `for` 循环。\n\n### 4.6 运行总量与哨值\n\n> **概念：运行总量是每次迭代中数字的和。哨值是信号列表结束的值。**\n\
  \n许多编程任务需要你计算一系列数字的总和。例如，假设你正在编写一个计算一周销售额的程序。该程序将读取每天的销量并在收集时计算它们的总和。\n\n计算数字总数的程序通常使用两个元素：\n\
  \n> • 读取序列中每个数字的循环。\n> • 用于累加总数的变量。\n\n用于累加总和的变量被称为*累加器*（accumulator）。说循环保持了一个*运行总量*（running\
  \ total），因为它在读取序列中的每个数字时都会进行累加。图 4-11 显示了计算运行总量的通用逻辑。\n\n#### 图 4-11 计算运行总量的逻辑\n\
  \n![Image](img/00236.jpg)\n\n循环结束后，累加器将包含循环读取的数字的总和。注意流程图的第一步是将累加器设置为 0。这是一个关键步骤。循环每次读取一个数字，就会将其加到累加器中。如果累加器从\
  \ 0 以外的任何值开始，那么循环结束时它将不是正确的总和。\n\n\n\n\n让我们仔细观察这个程序。在第 20 到 23 行中，用户被要求输入其拥有销售数据的天数。该数字从输入对话框中读取并赋值给变量\
  \ `days`。然后，在第 26 行，`totalSales` 变量被赋值为 0.0。在通用编程术语中，`totalSales` 变量被称为**累加器**（accumulator）。`累加器`是一个用初始值（通常为零）初始化的变量，然后通过不断加上数字来累加总和。正如你所看到的，在将值加到累加器之前将其设置为零是非常关重要的。\n\
  \n接下来，执行第 29 到 35 行的 `for` 循环。在循环的每次迭代中，用户输入特定日的销售额，并将其赋值给 `sales` 变量。这在第 31 到 33\
  \ 行完成。然后，在第 34 行，将 `sales` 的内容加到 `totalSales` 变量的现有值。（注意第 34 行不是将 `sales` 赋值给 `totalSales`，而是将\
  \ `sales` 加到 `totalSales` 上。换句话说，这一行根据 `sales` 的值增加了 `totalSales`。）\n\n由于 `totalSales`\
  \ 最初被赋值为 0.0，在循环的第一次迭代后，`totalSales` 将设置为与 `sales` 相同的值。在之后的每次迭代中，`totalSales` 都会根据\
  \ `sales` 的值增加。循环结束后，`totalSales` 将包含所有输入的每日销售数据的总和。现在应该很清楚为什么我们在循环执行之前给 `totalSales`\
  \ 赋值为 0.0 了。如果 `totalSales` 从任何其他值开始，总和将是不正确的。\n\n### 使用哨兵值（Sentinel Value）\n\n\
  代码列表 4-10 中的程序要求用户预先知道其拥有销售数据的天数。有时，用户有一份很长的输入值列表，并且不知道项目的准确数量。在其他情况下，用户可能从几个列表中输入值，要求计算每个列表中的每个项目是不切实际的。\n\
  \n在这种情况下，可以使用的一种技术是要求用户在列表末尾输入一个哨兵值。`哨兵值`是一个特殊的值，不会被误认为列表的成员，并标志着没有更多值需要输入。当用户输入哨兵值时，循环终止。\n\
  \n代码列表 4-11 中的程序展示了一个示例。它计算了足球队在一系列比赛中获得的总分。它允许用户输入系列比赛的分，然后输入 -1 来指示列表结束。\n\n**代码列表\
  \ 4-11 (`SoccerPoints.java`)**\n\n![Image](img/00240.jpg)\n\n![Image](img/00241.jpg)\n\
  \n***\n\n**以粗体显示的的示例输入的程序输出**\n\n`输入你的团队在本赛季`\n`每场比赛获得的分数。`\n`完成后输入 –1。`\n`输入比赛分数或\
  \ –1 结束:` `7 [回车]`\n\n`输入比赛分数或 –1 结束:` `9 [回车]`\n\n`输入比赛分数或 –1 结束:` `4 [回车]`\n\n\
  `输入比赛分数或 –1 结束:` `6 [回车]`\n`输入比赛分数或 –1 结束:` `8 [回车]`\n`输入比赛分数或 –1 结束:` `–1 [回车]`\n\
  \n`总分是 34`\n\n***\n\n选择 -1 作为哨兵值是因为球队不可能得到负分。注意，此程序执行了“引导读取”（priming read）来获取第一个值。这使得如果用户输入的第一个值是\
  \ -1，循环就可以立即终止。还要注意，哨兵值没有包含在运行总量中。\n\n### ![Image](img/00004.jpg)检查点\n\n> 4.13 写一个循环七次的\
  \ `for` 循环，要求用户输入一个数字。循环还应该计算所输入数字之和。\n\n> 4.14 在下面的程序段中，哪个变量是循环控制变量（也称为计数器变量），哪个是累加器？\n\
  \n![Image](img/00242.jpg)\n\n> 4.15 为什么在选择哨兵值时应该小心？\n\n## 4.7 嵌套循环\n\n> **概念：位于另一个循环内部的循环被称为嵌套循环**。\n\
  \n当一项任务执行重复性操作且该任务本身必须重复时，嵌套循环是必要的。时钟是像嵌套循环一样工作的一个很好的例子。代码列表 4-12 中的程序使用嵌套循环来模拟时钟。\n\
  \n**代码列表 4-12 (`Clock.java`)**\n\n![Image](img/00243.jpg)\n\n**程序输出**\n\n`01:00:00`\n\
  `01:00:01`\n`01:00:02`\n`01:00:03`\n(`循环继续计数` ……)`\n`12:59:57`\n`12:59:58`\n`12:59:59`\n\
  \n外层循环（第 19 行）每迭代 60 次，中间循环（第 17 行）每迭代 60 次，内层循环（第 15 行）在内层循环的每次迭代中会迭代 43200 次。模拟时钟的示例引出了关于嵌套循环的几点：\n\
  \n> • 内层循环在外层循环的每次迭代中完成其迭代。\n> • 内层循环在外层循环之前完成迭代。\n> • 要获得嵌套循环的迭代次数，将循环次数相乘。\n\n\
  ***\n\n如需更多示例，请参见本章源码文件夹中的 `TestAverage.java`。它询问用户学生人数以及每个学生的成绩数量。外层循环每个学生，内层循环每个成绩。\n\
  \n## 4.8 `break` 和 `continue` 语句（可选）\n\n> **概念：`break` 语句导致循环提前终止。`continue` 语句导致循环停止当前迭代并开始下一次**。\n\
  \n`break` 语句在第三章中与 `switch` 语句一起使用，也可以放在循环内部。遇到它时，循环停止并跳转到循环后的语句。虽然在 `switch` 语句中使用\
  \ `break` 语句是完全可以的，但在循环中使用被视为禁忌。这是因为跳过了终止循环所需的正常条件，并且代码难以理解和调试。因此，应尽可能避免在循环中使用 `break`\
  \ 语句。\n\n`continue` 语句导致循环的当前迭代立即结束。遇到它时，循环体中其之后的所有语句都会被忽略，并为下一次迭代做准备。在 `while`\
  \ 循环中，这意味着程序跳转到循环顶部的布尔表达式。按照通常，如果表达式仍为 `true`，则开始下一次迭代。在 `do-while` 循环中，程序跳转到循环底部的布尔表达式，决定是否开始下一次迭代。在\
  \ `for` 循环中，`continue` 会执行更新表达式，然后评估测试表达式。\n\n也应该避免 `continue` 语句。像 `break` 语句一样，它跳过了循环的逻辑，使得代码难以理解和调试。\n\
  \n### 4.9 决定使用哪种循环\n\n> **概念：虽然大多数重复算法可以使用三种循环中的任何一种编写，但每种循环在不同情况下效果最好**。\n\nJava\
  \ 的三种循环在不同情况下都是理想的。以下是关于何时应使用每种循环的简要总结：\n\n\n\n\n\n- **`while` 循环**。`while` 循环是一种预测试循环。在条件从一开始就为\
  \ `false` 且你不希望循环迭代的情况下，它是理想的选择。如果你想使用哨兵值来终止循环，它也是理想的选择。\n- **`do-while` 循环**。`do`-`while`\
  \ 循环是一种后测试循环。在你始终希望循环至少执行一次的情况下，它是理想的选择。\n- **`for` 循环**。`for` 循环是一种预测试循环，内置了用于初始化、测试和更新的表达式。这些表达式使得使用循环控制变量作为计数器变得非常方便。在确切迭代次数的情况下，`for`\
  \ 循环是理想的选择。\n\n## 4.10 文件输入与输出简介\n\n**概念：Java API 提供了若干类，你可以使用它们向文件写入数据和从文件中读取数据。要向文件写入数据，可以使用\
  \ `PrintWriter` 类，可选地使用 `FileWriter` 类。要从文件中读取数据，可以使用使用 `Scanner` 类和 `File` 类。**\n\
  \n你目前为止所编写的程序要求你在每次运行程序时重新输入数据。这是因为存储在内存中变量和对象中的数据一旦程序停止运行就会消失。为了在多次运行之间保留数据，程序必须拥有一种保存数据的方法。\n\
  \n数据可以保存在*文件*中，文件通常存储在计算机的磁盘上。一旦数据保存到文件中，即使程序停止运行，它仍然留在那里。之后可以在其他时间检索并使用这些数据。通常情况下，程序使用文件时会采取三个步骤：\n\
  \n1. 必须*打开*文件。当打开文件时，文件和程序之间会建立连接。\n2. 然后将数据写入文件或从文件中读取。\n3. 当程序完成文件的使用后，必须*关闭*文件。\n\
  \n在本节中，我们将讨论如何编写向文件写入数据和从文件中读取数据的 Java 程序。通常使用“输入文件”和“输出文件”这两个术语。*输入文件*是程序从中读取数据的文件。它被称为输入文件是因为其中存储的数据充当程序的输入。*输出文件*是程序向其写入数据的文件。它被称为输出文件是因为程序将输出内容存储在文件中。\n\
  \n通常，文件有两种类型：文本文件和二进制文件。*文本文件*包含使用 Unicode 等方案编码为文本的数据。即使文件中包含数字，这些数字在文件中也是以一系列字符的形式存储的。因此，可以使用记事本等文本编辑器打开并查看该文件。*二进制文件*包含未转换为文本的数据。因此，你无法用文本编辑器查看二进制文件的内容。在本章中，我们将讨论如何处理文本文件。二进制文件将在第\
  \ 12 章中讨论。\n\nJava API 提供了许多将用于处理文件的类。要使用这些类，你需要在程序顶部放置以下 `import` 语句：\n\n```java\n\
  import java.io.*;\n```\n\n#### 使用 `PrintWriter` 类向文件写入数据\n\n要向文件写入数据，你将创建一个 `PrintWriter`\
  \ 类实例。`PrintWriter` 类允许你打开一个文件进行写入。它还允许你使用与之前在屏幕上显示数据时相同的 `print` 和 `println` 方法将数据写入文件。你将想要打开的文件名作为字符串传递给\
  \ `PrintWriter` 构造函数。例如，以下语句创建了一个 `PrintWriter` 对象并将文件名 *StudentData.txt* 传递给构造函数。\n\
  \n```java\nPrintWriter outputFile = new PrintWriter(\"StudentData.txt\");\n```\n\
  \n该语句将创建一个名为 *StudentData.txt* 的空文件，并建立它与由 `outputFile` 引用的 `PrintWriter` 对象之间的连接。文件将在当前目录或文件夹创建。\n\
  \n你也可以将 `String` 对象的引用作为参数传递给 `PrintWriter` 构造函数。例如，在下面的代码中，用户指定了文件名。\n\n```java\n\
  String filename;\nfilename = JOptionPane.showInputDialog(\"Enter the filename.\"\
  );\nPrintWriter outputFile = new PrintWriter(filename);\n```\n\n![Image](img/00007.jpg)\n\
  \n**警告！** 如果用 `PrintWriter` 对象打开的文件已经存在，将被擦除并创建一个同名的空文件。\n\n一旦你创建了 `PrintWriter`\
  \ 类实例并打开了文件，你就可以使用 `print` 和 `println` 方法将数据写入文件。你已经知道如何配合 `System.out` 使用 `print`\
  \ 和 `println` 在屏幕上显示数据了。它们在 `PrintWriter` 对象上的用法是相同的，用于将数据写入文件。例如，假设 `outputFile`\
  \ 引用一个 `PrintWriter` 对象，以下语句将字符串 `\"Jim\"` 写入文件：\n\n```java\noutputFile.println(\"\
  Jim\");\n```\n\n当程序完成向文件写入数据后，必须关闭文件。使用 `close` 方法关闭文件。这里是一个示例：\n\n```java\noutputFile.close();\n\
  ```\n\n*缓冲区*（buffer）是内存中一个很小的“持有区域”。当程序向文件写入数据时，这些数据首先写入缓冲区。当缓冲区填满时，存储在那的信息就会写入文件。这种技术提高了系统性能，因为向内存数据比写入磁盘快得多。\n\
  \n一旦文件关闭，它与 `PrintWriter` 对象之间的连接就会被移除。为了对文件进行进一步操作，必须打开它。\n\n##### 关于 `PrintWriter`\
  \ 类 `println` 方法的更多信息\n\n`PrintWriter` 类的 `println` 方法向文件中写入数据。例如，假设一个应用程序创建一个文件并通过以下代码将三个学生的姓名和分数写入文件：\n\
  \n```java\nPrintWriter outputFile = new PrintWriter(\"StudentData.txt\");\noutputFile.println(\"\
  Jim\");\noutputFile.println(95);\noutputFile.println(\"Karen\");\noutputFile.println(98);\n\
  outputFile.println(\"Bob\");\noutputFile.println(82);\noutputFile.close();\n```\n\
  \n`println` 方法向文件中写入数据，并在数据之后写入一个换行符。你可以按照如下方式可视化写入的数据：\n\n```text\nJim\n95\nKaren\n\
  98\nBob\n82\n```\n\n换行符在这里被表示为 <*newline>。你实际上看不到换行符，但当用记事本等文本编辑器打开文件时，其内容将如图 4-13\
  \ 所示。从图中可以看到，每个换行符都会导致其后的数据显示在新的一行。\n\n**图 4-13** 在记事本中显示的文件内容\n\n![Image](img/00244.jpg)\n\
  \n除了将文件内容分之外，换行符还充当分隔符（delimiter）。*分隔符*是分隔其他项目的项。当你使用 `println` 方法向文件写入数据时，换行符将分隔各个数据项。稍后你会看到，文件中的每个数据项必须被分隔才能从文件中读取。\n\
  \n##### `PrintWriter` 类的 `print` 方法\n\n\n\n\n\n`print` 方法用于将数据项写入文件，但不写入换行符。例如，请看以下代码：\n\
  \n```\nString name = \"Jeffrey Smith\";\nString phone = \"554-7864\";\nint idNumber\
  \ = 47895;\nPrintWriter outputFile = new PrintWriter(\"PersonalData.txt\");\noutputFile.print(name\
  \ + \" \");\noutputFile.print(phone + \" \");\noutputFile.println(idNumber);\noutputFile.close();\n\
  ```\n\n这段代码使用 `print` 方法将 `name` 对象的内容写入文件，后面跟着一个空格（`\" \"`）。然后，它使用 `print` 方法将\
  \ `phone` 对象的内容写入文件，后面也是一个空格。接着，它使用 `println` 方法将 `idNumber` 变量的内容写入文件，并紧跟一个换行符。图\
  \ 4-14 显示了记事本中显示的文件内容。\n\n**图 4-14** 记事本中显示的文件内容\n\n![Image](img/00245.jpg)\n\n\
  ### 在方法头中添加 `throws` 子句\n\n当 Java 程序中发生意外事件时，我们称该程序抛出了异常。现在，你可以将*异常*（exception）视为一种信号，表示在处理该意外事件之前程序无法继续运行。例如，假设你创建了一个\
  \ `PrintWriter` 对象并将文件名传递给它的构造函数。`PrintWriter` 对象尝试创建该文件，但意外的是，磁盘已满导致文件无法创建。显然，在处理这种情况之前，程序无法继续执行，因此会抛出一个异常，这会导致程序暂停正常执行。\n\
  \n当异常被抛出时，正在执行的方法必须要么处理该异常，要么将其再次抛出。如果 `main` 方法抛出异常，程序将停止并显示错误消息。由于 `PrintWriter`\
  \ 对象能够抛出异常，我们必须要么编写处理这些可能异常的代码，要么允许我们的方法在异常发生时重新抛出它们。在第 12 章中，你将学习关于异常的所有知识以及如何响应它们，但目前我们只需允许方法重新抛出可能发生的任何异常。\n\
  \n为了允许方法重新抛出一个尚未处理的异常，你只需在方法头中写一个 `throws` 子句。`throws` 子句必须指定可能抛出的异常类型。以下是一个示例：\n\
  \n```\npublic static void main(String[] args) throws IOException\n```\n\n此方法头表示\
  \ `main` 方法能够抛出 `IOException` 类型的异常。这正是 `PrintWriter` 对象能够抛出的异常类型。因此，任何使用 `PrintWriter`\
  \ 对象且不响应其异常的方法，都必须在方法头中列出此 `throws` 子句。\n\n此外，任何调用使用 `PrintWriter` 对象的方法的方法，在其方法头中都应该有\
  \ `throws IOException` 子句。例如，假设 `main` 方法没有执行任何文件操作，但调用了一个名为 `buildFile` 的方法，该方法打开文件并从中写入数据。`buildFile`\
  \ 和 `main` 方法都应该在方法头中拥有 `throws IOException` 子句。否则将发生编译错误。\n\n### 示例程序\n\n让我们来看一个向文件写入数据的示例程序。代码列表\
  \ 4-13 中的程序将你朋友的名字写入文件。\n\n**代码列表 4-13 (`FileWriteDemo.java`)**\n\n![Image](img/00246.jpg)\n\
  \n![Image](img/00247.jpg)\n\n**加粗显示的示例输入对应的程序输出**\n\n```\nHow many friends do you\
  \ have? 5 [Enter]\nEnter the filename: MyFriends.txt [Enter]\nEnter the name of\
  \ friend number 1: Joe [Enter]\nEnter the name of friend number 2: Rose [Enter]\n\
  Enter the name of friend number 3: Greg [Enter]\nEnter the name of friend number\
  \ 4: Kirk [Enter]\nEnter the name of friend number 5: Renee [Enter]\nData written\
  \ to the file.\n```\n\n第 2 行的 `import` 语句是必要的，因为此程序使用了 `PrintWriter` 类。此外，第 10 行的\
  \ `main` 方法头有一个 `throws IOException` 子句，因为 `PrintWriter` 类对象可能会抛出 `IOException`。\n\
  \n该程序要求用户输入有多少个朋友（第 20 到第 21 行），然后输入要创建的文件名（第 27 行和第 28 行）。`filename` 变量引用文件的名称，并用于第\
  \ 31 行的以下语句：\n\n```\nPrintWriter outputFile = new PrintWriter(filename);\n```\n\n\
  该语句打开文件并创建一个 `PrintWriter` 对象，可用于向文件写入数据。第 34 行到第 43 行的 `for` 循环为用户的每个朋友执行一次迭代，每次询问一个朋友的名字。用户的输入由\
  \ `friendName` 变量引用。一旦输入名称，就会使用第 42 行的语句将其写入文件：\n\n```\noutputFile.println(friendName);\n\
  ```\n\n循环结束后，在第 46 行关闭文件。使用示例运行所示的输入执行程序后，将创建*MyFriends.txt* 文件。如果我们在记事本中打开该文件，我们将看到如图\
  \ 4-15 所示的内容。\n\n**图 4-15** 记事本中显示的文件内容\n\n![Image](img/0248.jpg)\n\n### 复习\n\n\
  在继续之前，让我们回顾一下编写向文件写入数据的程序的基本要素：\n\n1. 你需要在程序顶部添加 `import java.io.*;` 语句。\n2. 因为我们还没有学习如何响应异常，任何使用\
  \ `PrintWriter` 的方法都必须在其方法头中拥有 `throws IOException` 子句。\n3. 你创建一个 `PrintWriter`\
  \ 对象，并将文件名作为字符串传递给构造函数。\n4. 你使用 `PrintWriter` 类的 `print` 和 `println` 方法向文件写入数据。\n\
  5. 完成文件写入后，你使用 `PrintWriter` 类的 `close` 方法关闭文件。\n\n### 向文件追加数据\n\n当你将文件名传递给 `PrintWriter`\
  \ 构造函数时，如果该文件已存在，它将被擦除并创建一个同名的空文件。然而，有时你想要保留现有文件并向其追加数据。向文件追加意味着向文件中已存在的数据写入新数据。\n\
  \n要向现有文件追加数据，你首先创建一个 `FileWriter` 类的实例。向 `FileWriter` 构造函数传递两个参数：包含文件名的字符串和一个布尔值\
  \ `true`。示例下：\n\n```\nFileWriter fwriter = new FileWriter(\"MyFriends.txt\", true);\n\
  ```\n\n此语句创建了一个 `FileWriter` 对象并以写入模式打开文件 *MyFriends.txt*。写入文件的任何数据都将追加到现有内容之后。（如果文件不存在，则将创建它。）\n\
  \n你仍然需要创建一个 `PrintWriter` 对象，以便可以使用 `print` 和 `println` 方法向文件写入数据。创建 `PrintWriter`\
  \ 对象时，将 `FileWriter` 对象的引用作为参数传递给 `PrintWriter` 构造函数。例如，看以下代码：\n\n```\nFileWriter\
  \ fwriter = new FileWriter(\"MyFriends.txt\", true);\nPrintWriter outputFile = new\
  \ PrintWriter(fwriter);\n```\n\n这创建了一个 `PrintWriter` 对象，可向文件 *MyFriends.txt* 写入数据。写入文件的任何数据将追加到现有内容之后。例如，假设文件\
  \ *MyFriends.txt* 存在且包含以下数据：\n\n```\nJoe\nRose\nGreg\nKirk\nRenee\n```\n\n\n\n\n\
  \n以下代码打开文件并向现有内容追加附加数据：\n\n```java\nFileWriter fwriter = new FileWriter(\"MyFriends.txt\"\
  , true);\nPrintWriter outputFile = new PrintWriter(fwriter);\noutputFile.println(\"\
  Bill\");\noutputFile.println(\"Steven\");\noutputFile.println(\"Sharon\");\noutputFile.close();\n\
  ```\n\n执行完此代码后，`MyFriends.txt` 文件将包含以下数据：\n\n```\nJoe\nRose\nGreg\nKirk\nRenee\n\
  Bill\nSteven\nSharon\n```\n\n![Image](img/00005.jpg)\n\n* * *\n\n**注意：** 如果由于任何原因无法打开文件，`FileWriter`\
  \ 类也会抛出 `IOException`。\n\n* * *\n\n### **指定文件位置**\n当你打开文件时，可以与文件名一起指定路径。在 Windows\
  \ 计算机上，路径包含反斜杠字符。请记住，当字符串字面量中出现单个反斜杠字符时，它标记着转义序列（如 `\"\\n\"`）的开始。字符串字面量中的两个反斜杠字符表示一个单独的反斜杠。因此，当你在字符串字面量中提供路径且该路径包含反斜杠字符时，必须在每个单个反斜杠字符的位置使用两个反斜杠字符。\n\
  \n例如，路径 `\"E:\\\\Names.txt\"` 指定 `Names.txt` 在 E 盘的根目录下，而路径 `\"C:\\\\MyData\\\\\
  Data.txt\"` 指定 `Data.txt` 在 C 盘的 `\\MyData` 文件夹中。在以下语句中，将在 A 盘的根目录下创建 `Pricelist.txt`\
  \ 文件：\n\n```java\nPrintWriter outputFile = new PrintWriter(\"A:\\\\PriceList.txt\"\
  );\n```\n\n只有当文件的路径位于字符串字面量中时才需要使用双反斜杠。如果你的程序要求用户输入路径到一个 `String` 对象，然后将其传递给 `PrintWriter`\
  \ 或 `FileWriter` 构造函数，用户不需要输入双反斜杠。\n\n![Image](img/00006.jpg)\n\n* * *\n\n**提示：**\
  \ Java 允许在 Windows 路径用斜杠替换反斜杠。例如，路径 `\"C:\\\\MyData\\\\Data.txt\"` 可以写成 `\"C:/MyData/Data.txt\"\
  `。这消除了使用双反斜杠的需求。\n\n* * *\n\n在 UNIX 或 Linux 计算机上，你可以提供无需任何修改的路径。以下是一个示例：\n\n```java\n\
  PrintWriter outputFile = new PrintWriter(\"/home/rharrison/names.txt\");\n```\n\n\
  ### **从文件中读取数据**\n在第 2 章中，你学习了如何使用 `Scanner` 类从键盘读取输入。要读取键盘输入，请记住我们创建一个 `Scanner`\
  \ 对象，并将 `System.in` 传递给 `Scanner` 构造函数。这是一个示例：\n\n```java\nScanner keyboard = new\
  \ Scanner(System.in);\n```\n\n记住 `System.in` 对象代表键盘。将 `System.in` 作为参数传递给 `Scanner`\
  \ 构造函数指定键盘为 `Scanner` 对象的输入源。\n\n你也可以使用 `Scanner` 类从文件读取输入。不要将 `System.in` 传递给 `Scanner`\
  \ 构造函数，而是传递一个 `File` 对象的引用。这是一个示例：\n\n```java\nFile myFile = new File(\"Customers.txt\"\
  );\nScanner inputFile = new Scanner(myFile);\n```\n\n第一条语句创建了 `File` 类的实例。`File`\
  \ 类位于 Java API 中，用于表示文件。注意我们已将字符串 `\"Customers.txt\"` 传递给构造函数。这创建了一个表示文件的 `File`\
  \ 对象。\n\n在第二条语句中，我们将此 `File` 对象的引用作为参数传递给 `Scanner` 构造函数。这创建了一个使用 `Customers.txt`\
  \ 文件作为输入源的 `Scanner` 对象。然后你可以使用在第 2 章中学习的相同 `Scanner` 类方法从文件中读取项目。（请参见表 2-17。）\n\
  \n当你完成从文件的读取工作后，使用 `Scanner` 类的 `close` 方法关闭文件。例如，假设变量 `inputFile` 引用一个 `Scanner`\
  \ 对象，以下语句将关闭该对象的输入源文件：\n\n```java\ninputFile.close();\n```\n\n### **使用 nextLine\
  \ 方法从文件中读取行**\n`Scanner` 类的 `nextLine` 方法读取一行输入，并将该行作为 `String` 返回。代码列表 4-14 中的程序演示了如何使用\
  \ `nextLine` 方法从文件中读取一行。该程序要求用户输入文件名，然后在屏幕上显示文件的第一行。\n\n**代码列表 4-14 (ReadFirstLine.java)**\n\
  \n![Image](img/00249.jpg)\n\n**带有加粗示例输入的程序输出**\n```\nEnter the name of a file: MyFriends.txt\
  \ [Enter]\nThe first line in the file is:\nJoe\n```\n\n该程序在第 17 行从用户处获取文件名称。在第 20\
  \ 行创建了一个 `File` 对象来表示该文件，第 21 行创建一个 `Scanner` 对象来从文件中读取数据。第 24 行从文件中读取一行。在该语句执行后，`line`\
  \ 变量引用一个持有从文件中读取的行的 `String` 对象。该行在第 28 行显示在屏幕上，并在第 31 行关闭文件。\n\n值得注意的是，该程序创建了两个独立的\
  \ `Scanner` 对象。第 13 行创建的 `Scanner` 对象从键盘读取数据，而第 21 行创建的 `Scanner` 对象从文件中读取数据。\n\n\
  当文件被打开以读取时，内部为该文件维护一个名为*读取位置*（read position）的特殊值。文件的读取位置标记了从文件中读取的下一个项目的位置。当打开文件时，其读取位置被设置为文件中的第一个项目。当项目被读取时，读取位置将移动到文件中的下一个项目。随着后续项目的读取，内部读取位置会穿过文件。例如，考虑\
  \ `Quotation.txt` 文件，如图 4-16 所示。从图中可以看出，文件有三行。\n\n你可以想象数据如下存储在文件中：\n\n```\nImagination\
  \ is more\nimportant than knowledge\nAlbert Einstein\n```\n\n假设程序使用以下代码打开文件：\n\n\
  ```java\nFile file = new File(\"Quotation.txt\");\nScanner inputFile = new Scanner(file);\n\
  ```\n\n这段代码打开文件时，其读取位置位于第一行的开头，如图 4-17 所示。\n\n**图 4-17 读取位置**\n\n![Image](img/00251.jpg)\n\
  \n现在，假设程序使用以下语句从文件中读取一行：\n\n```java\nString str = inputFile.nextLine();\n```\n\n\
  该语句将从当前读取位置从文件中读取一行。在该语句执行后，`str` 引的对象将包含字符串“Imagination is more”。文件的读取位置将移动到下一行，如图\
  \ 4-18 所示。\n\n**图 4-18 读取第一行后的读取位置**\n\n![Image](img/00252.jpg)\n\n\n\n\n\n当你将一个\
  \ `File` 对象引用传递给 `Scanner` 类的构造函数时，如果未找到指定的文件，构造函数将抛出 `IOException` 类型的异常。因此，在任何将\
  \ `File` 对象引用传递给 `Scanner` 类构造函数的方法的头部中，你都需要写一个 `throws IOException` 子句。\n\n## 检测文件的结束\n\
  \n很多时候，程序必须读取文件的内容，但并不知道文件中存储了多少项内容。例如，程序在代码列表 4-13 中创建的 `MyFriends.txt` 文件可以存储任意数量的名称。这是因为程序会询问用户有多少个朋友。如果用户输入的朋友数量为\
  \ 5，程序就会创建一个包含五个名字的文件；如果用户输入 100，程序就会创建一个包含 100 个名字的文件。\n\n`Scanner` 类有一个名为 `hasNext`\
  \ 的方法，可以用它来判断文件是否有更多可读取的数据。在调用任何其他读取文件的方法之前，你都要调用 `hasNext` 方法。如果文件中还有更多可读的数据，`hasNext`\
  \ 方法将返回 `true`。如果已到达文件末尾没有更多数据可读，`hasNext` 方法将返回 `false`。\n\n代码列表 4-15 展示了一个示例。程序读取包含你朋友名称的文件，该文件是程序在代码列表\
  \ 4-13 中创建的。\n\n**代码列表 4-15 (FileReadDemo.java)**\n\n![Image](img/00253.jpg)\n\n\
