  \ Stinky]`\n\n***\n\n## 17.9 擦除\n\n> **概念：当 Java 编译器处理泛型类或方法时，它会擦除泛型符号并为每个类型参数替换实际类型**。\n\
  \n当 Java 编译器遇到泛型代码时，它使用一种名为*擦除*（erasure）的过程来编译代码。该过程被称为擦除，是因为编译器擦除了泛型符号并为每个类型参数替换了实际类型。擦除的工作原理如下：当编译器遇到带有未边界类型参数的泛型类、接口或方法（例如\
  \ `<T>` 或 `<E>`）时，它会将类型参数的所有出现处替换为 `Object`。例如，以下类：\n\n![Image](img/01317.jpg)\n\
  \n将被擦除过程转换为此代码：\n\n![Image](img/01318.jpg)\n\n以及，以下泛型方法：\n\n![Image](img/01319.jpg)\n\
  \n将被转换为：\n\n![Image](img/01320.jpg)\n\n当编译器遇到带有有界类型参数的类、接口或方法（例如 `<T extends Number>`\
  \ 或 `<E extends Comparable>`）时，它会将类型参数的所有出现处替换为应用于该参数的边界。例如，以下类：\n\n![Image](img/01321.jpg)\n\
  \n将被擦除过程转换为此代码：\n\n![Image](img/01322.jpg)\n\n以及，以下泛型方法：\n\n![Image](img/01323.jpg)\n\
  \n将被转换为：\n\n![Image](img/01324.jpg)\n\n如你所见，泛型符号只存在于程序员编写的源代码中。一旦编译器确认泛型类型被安全使用，它就会将其转换为原始类型（raw\
  \ type），这仅仅是一个非泛型类型。在字节码级别，只存在原始类型。\n\n在处理泛型类型时，编译器会在使用泛型类型的代码中必要处插入转换运算符。例如，假设我们使用以下代码创建\
  \ `Point` 类的实例：\n\n```\nInteger x = new Integer(1);\nInteger y = new Integer(2);\n\
  ```\n\n```\nPoint<Integer> p1 = new Point<>(x);\nPoint<Integer> p2 = new Point<>(y);\n\
  ```\n\n```\nPoint p3 = (Point) p1;\nPoint p4 = (Point) p2;\n```\n\n\n\n让我们想象一下 Java\
  \ 应用程序要使用泛型异常类需要发生什么。首先，你必须能够在 `catch` 子句中使用泛型类型表示法。然后，当抛出一个泛型异常时，系统必须检查用于创建异常类时所使用的类型参数，以判断它是否与\
  \ `catch` 子句中指定的类型匹配。这是不可能的，因为在运行时，泛型类型信息已经被编译器擦除了。由于编译器在编译时无法知道异常将从何处来，也不知道将使用什么类型参数来创建它，因此你不允许创建泛型异常类。具体来说，你不允许创建\
  \ `Throwable` 的泛型子类。你也不允许在 `catch` 子句中使用泛型类型表示。\n\n### 17.11 应当避免的常见错误\n\n> • **在实例化泛型类时忘记传递类型参数**。当不在传递类型参数的情况下实例化泛型类时，你是将该类作为原始类型（raw\
  \ type）使用的。这样做，你就放弃了通常在泛型类中拥有的类型安全优势。\n\n> • **将基本类型作为类型参数**。泛型类和方法只能接受引用类型作为类型参数。\n\
  \n> • **在将泛型类的实例作为参数传递给方法时误用继承**。如果方法的参数变量声明为 `Point<Number>` 类型，你不能将 `Point<Integer>`\
  \ 的实例传递给该参数。即使 `Integer` 是 `Number` 的子类，`Point<Integer>` 也并不是 `Point<Number>` 的子类。当参数变量被声明为\
  \ `Point<Number>` 时，可以传递给它的参数只有 `Point<Number>` 的实例。\n\n> • **在使用泛型类声明参数变量时类型限制过多**。假设在一个方法中，你将参数变量声明为\
  \ `Point<Integer> myPoint`。可以传递给此参数的只有 `Point<Integer>` 类型的参数。如果你尝试传递一个 `Point<Double>`\
  \ 对象，就会发生错误。通过将参数声明为 `Point<?> myPoint`，你将能够向方法传递任何 `Point` 对象。通过将参数变量声明为 `Point<?\
  \ extends Number> myPoint`，你将能够传递任何类型参数为 `Number` 或其子类的 `Point` 对象。\n\n> • **尝试使用\
  \ `implements` 关键字将类型参数限制为实现某个接口的类型**。在泛型类型表示法中，你不使用 `implements` 关键字。要将类型参数限制为实现特定接口的类型，你应该使用\
  \ `extends` 关键字。在泛型表示中，`extends` 关键字意味着“继承”或“实现”。\n\n> • **忘记在泛型方法中定义类型参数**。如果泛型方法有自己的类型参数，你必须在方法头中为该类型参数编写定义。\n\
  \n> • **在泛型位置的错误位置定义类型参数**。泛型方法中的类型参数定义必须出现在方法的返回类型之前。\n\n***\n\n## 复习题与练习\n\n**单选择与判断题**\n\
