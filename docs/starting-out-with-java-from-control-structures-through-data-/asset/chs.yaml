  \ 12\nThe sum of the values is 78\n```\n\n### 锯齿数组（Ragged Arrays）\n\n由于二维数组中的行也是数组，因此每行都可以有自己的长度。当二维数组的各行长度不同时，该数组被称为锯齿数组。你通过先创建一个特定行数但未指定列数的二维数组来创建锯齿数组。这里是一个示例：\n\
