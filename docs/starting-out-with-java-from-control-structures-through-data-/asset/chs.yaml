  \ `ActionEvent` 类的对象，并调用动作监听器的 `actionPerformed` 方法，并将 `ActionEvent` 对象的引用传递给参数变量\
  \ `e`。因此，当 `actionPerformed` 方法执行时，参数 `e` 引用了响应该事件而生成的事件对象。\n\n之前提到过，事件对象包含了有关事件的信息。如果你愿意，可以通过调用事件对象的方法之一来获取有关事件的特定信息。`ActionEvent`\
