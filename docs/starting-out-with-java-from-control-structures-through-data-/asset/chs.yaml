  \ variables reference different objects.`\n\n#### 拷贝构造函数\n\n创建对象的另一种方法是使用拷贝构造函数。*拷贝构造函数*（copy\
  \ constructor）只是接受同类对象作为参数的构造函数。它将正在创建的对象创建为传递参数对象的副本。\n\n在源代码文件夹 *第 09 章\\Stock\
  \ 类阶段 4）* 中，你将找到 `Stock` 类的另一个修订版本。该版本的类有一个拷贝构造函数。该构造函数的代码如下（类的其他部分没有发生变化，因此只显示了拷贝构造函数）：\n\
  \n![Image](img/00658.jpg)\n\n\n\n\n\n```java\n// Create a Stock object.\nStock company1\
  \ = new Stock(\"XYZ\", 9.62);\n// Create another Stock object that is a copy of\
  \ the company1 object.\nStock company2 = new Stock(company1);\n```\n\n## 9.7 聚合\
  \ (Aggregation)\n\n> **概念：当一个类的实例是另一个类的字段时，就发生了聚合。**\n\n在现实生活中，对象经常是由其他对象组成的。例如，一栋房子是由门对象、窗户对象、墙壁对象等等组成的。正是所有这些对象的组合构成了一个房子对象。\n\
  \n***\n\n![Image](img/00009.jpg)\n\n### 聚合 (Aggregation)\n\n***\n\n在设计软件时，有时通过其他对象创建一个新对象是有意义的。例如，假设你需要一个对象来代表你在大学里修读的一门课程。你决定创建一个\
  \ `Course` 类，该类将包含以下信息：\n\n> • 课程名称\n> • 讲师的姓、名和办公室门号\n> • 教科书的标题、作者和出版社\n\n除了课程名称外，该类还将包含与讲师和教科书相关的项。你可以在\
  \ `Course` 类中为这些每项设置字段。然而，一个良好的设计原则是将相关的项分离到它们各自的类中。在这个示例中，可以创建一个 `Instructor` 类来存储与讲师相关的数据，并创建一个\
  \ `TextBook` 类来存储与教科书相关的数据。这些类的实例就可以被用作 `Course` 类的字段。让我们仔细查看如何实现这一点。图 9-11 显示了\
  \ `Instructor` 类的 UML 图。为了保持简单，该类仅包含以下方法：\n\n> • 一个构造函数，它接受讲师的姓、名和办公室门号作为参数\n> •\
  \ 拷贝构造函数\n> • 一个 `set` 方法，可用于设置类的所有字段\n> • 一个 `toString` 方法\n\n**图 9-11** `Instructor`\
  \ 类的 UML 图\n\n![Image](img/00659.jpg)\n\n`Instructor` 类的代码如代码列表 9-12 所示。\n\n**代码列表\
  \ 9-12 (`Instructor.java`)**\n\n![Image](img/00660.jpg)\n![Image](img/00661.jpg)\n\
  ![Image](img/00662.jpg)\n\n图 9-12 显示了 `TextBook` 类的 UML 图。和之前一样，我们希望保持类简单。它拥有的唯一方法是构造函数、拷贝构造函数、`set`\
  \ 方法和 `toString` 方法。`TextBook` 类的代码如代码列表 9-13 所示。\n\n**图 9-12** `TextBook` 类的 UML\
  \ 图\n\n![Image](img/00663.jpg)\n\n**代码列表 9-13 (`TextBook.java`)**\n\n![Image](img/00664.jpg)\n\
  ![Image](img/00665.jpg)\n![Image](img/00666.jpg)\n\n图 9-13 显示了 `Course` 类的 UML 图。注意，`Course`\
  \ 类有一个 `Instructor` 对象和一个 `TextBook` 对象作为字段。将一个类的实例作为另一个类中的字段被称为*对象聚合* (object aggregation)。*Aggregate*（聚合）一词的意思是“由组成部分形成的整体”。在这个示例中，`Course`\
  \ 类是一个聚合类，因为它是由各个组成对象组成的。\n\n当一个类的实例是另一个类的成员时，称类与类之间存在“拥有（has a）”的关系。例如，`Course`、`Instructor`\
  \ 和 `TextBook` 类之间存在的关系可以描述如下：\n\n> • 课程*拥有一个*讲师。\n> • 课程*拥有一本*教科书。\n\n“拥有”关系有时被称为*整体-部分关系*\
  \ (whole-part relationship)，因为一个对象是更大整体的一部分。`Course` 类的代码如代码列表 9-14 所示。\n\n**图 9-13**\
