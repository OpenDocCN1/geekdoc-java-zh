  \n![Image](img/01418.jpg)\n\n### `clear` 方法\n\n`clear` 方法简单地清空列表，使其不再包含任何元素：\n\n\
  ![Image](img/01419.jpg)\n\n### `contains` 方法\n\n`contains` 方法接受一个 `String` 参数，如果列表中找到了该参数，则返回\
  \ `true`。如果参数不在列表中，该方法返回 `false`。由于元素不是排序的，而是按照它们添加到列表的顺序存储的，该方法按如下方式执行顺序搜索：\n\n\
  ![Image](img/01420.jpg)\n\n### `get` 方法\n\n`get` 方法返回存储在特定索引处的字符串。如果指定了无效索引，该方法将如下抛出\
  \ `IndexOutOfBoundsException`：\n\n![Image](img/01421.jpg)\n\n### `indexOf` 方法\n\n\
  `indexOf` 方法接受一个 `String` 参数。它在列表中搜索该 `String`，如果找到，则返回其索引。如果在列表中未找到该 `String`，该方法返回\
  \ -1。与 `contains` 方法一样，此方法执行顺序搜索，因为列表元素没有按特定顺序排序。\n\n![Image](img/01422.jpg)\n\n\
  ### `isEmpty` 方法\n\n`isEmpty` 方法确定列表是否包含任何元素。如果列表为空，返回 `true`。否则，返回 `false`。该方法通过如下方式返回表达式\
  \ `(elements == 0)` 的值：\n\n![Image](img/01423.jpg)\n\n### `remove` 方法\n\n该类有两个重载的\
