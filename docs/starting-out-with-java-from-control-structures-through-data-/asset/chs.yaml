  \n### 焦点聚焦：![Image](img/00008.jpg)\n\n**根树与 JTree 组件**\n\n根树是二叉树的推广，在其中节点可能有两个以上的子节点。根树的一个熟悉例子是几乎在所有计算机上使用的分级文件和目录系统。图\
  \ 22-27 展示了一个可能是家谱树一部分的根树简单示例。\n\n**图 22-27** 根树\n\n![Image](img/01716.jpg)\n\n\
  许多程序需要作为用户界面的一部分显示根树。Java Swing 库提供了一个可以使用 `JTree` 组件。\n\n\n\n\n## 复习题与练习题\n\n##\
  \ 单选题与判断\n\n> 1. 二叉树是项的集合，其中每个项 ________。\n> a. 没有后继节点\n> b. 有一个后继节点\n> c. 恰有两个后继节点\n\
  > d. 最多有两个后继节点\n> 2. 遍历二叉树的三种标准技术是 ________。\n> a. 前序、中序和后序\n> b. 前置、中缀和后置\n> c.\
  \ 从左到右、从上到下、从父到子节点\n> d. 以上都不是\n> 3. 二叉树中某个节点的所有后代构成了 ________。\n> a. 从该节点到树末尾的路径\n\
  > b. 从该节点到根节点的路径\n> c. 以该节点为根的子树\n> d. 一个最适合用中序遍历遍历的集合\n> 4. 二叉搜索树的结构使得 ________。\n\
  > a. 对于每个节点，左子树的值小于该节点的值，右子树的值大于该节点的值\n> b. 对于每个节点，左孩子的值小于该节点的值，右孩子的值大于该节点的值\n>\
  \ c. 每个节点上存储的值小于存储在子节点中的值\n> d. 任意节点两个子树的高度差最多为 1\n> 5. AVL 树是 ________。\n> a. 一种优先级队列\n\
  > b. 一种堆\n> c. 一种二叉搜索树\n> d. 以上都不是\n> 6. 当从二叉搜索树中删除一个具有两个孩子的节点时，可以用 ________ 来替换它。\n\
  > a. 树中最深层最右侧的叶子节点\n> b. 其右子树中最小的节点\n> c. 其左子树中最小的节点\n> d. 该节点的最小祖先\n> 7. 在堆的二叉树中，________。\n\
  > a. 每个非根节点的值必须大于其父节点的值\n> b. 每个左孩子都小于其父节点，每个右孩子都大于其父节点\n> c. 每个节点的左右子树的高度差最多为 1\n\
  > d. 叶子节点必须大于或等于所有其他节点\n> 8. 在完全二叉树中，________。\n> a. 除最后一层外的每一层 `l` 都有 `2*^l` 个节点\n\
  > b. 树的深度 `d` 满足 `d ≤ log n + 1`，其中 `n` 是树中的节点数\n> c. 每个有右孩子的节点也都有左孩子\n> d. 以上都是\n\
  > 9. 堆排序方法 ________。\n> a. 基于具有堆序属性的完全二叉搜索树结构\n> b. 在排序包含 `n` 个条目的数组时，会进行 `O(n log\
  \ n)` 次比较\n> c. 是一种非常好的排序方法，但还有其他更快速的通用排序方法\n> d. 以上都是\n> 10. 向堆中添加一个新值，你应该 ________。\n\
  > a. 将其作为叶子节点添加，然后向上调整（sift up）\n> b. 将根节点向下调整以为新节点腾出空间\n> c. 用最深最右的叶子节点替换根节点，然后向下调整（sift\
  \ down）\n> d. 以上都不是\n> 11. 正确或错误：二叉树中的节点可以有两个父节点。\n> 12. 正确或错误：二叉树中的节点可以没有父节点。\n\
  > 13. 正确或错误：二叉树的深度始终等于其根的高度。\n> 14. 正确或错误：节点的层级是树的高度减去节点的高度。\n> 15. 正确或错误：从优先级队列中删除项可以得到最小元素。\n\
  > 16. 正确或错误：空二叉树的高度未定义。\n> 17. 正确或错误：堆是一个具有堆序属性的完全二叉树。\n> 18. 正确或错误：节点的祖先永远不会在该节点的子树中。\n\
  > 19. 正确或错误：节点的后代必须属于该节点至少的一个子树。\n> 20. 正确或错误：AVL 树中节点的子树高度可以相等。\n> 21. 正确或错误：完全二叉树中节点的子树高度必须相等。\n\
  \n## 找错\n\n找到以下每个代码段中的错误。\n\n![Image](img/01720.jpg)\n\n2.\n\n![Image](img/01721.jpg)\n\
  \n3.\n\n![Image](img/01722.jpg)\n\n## 简答\n\n1. 为什么二叉搜索树保持平衡是好的？\n2. 一个二叉搜索树有右子树但没有左子树。哪个节点包含树中的最小元素？\n\
  3. 二叉树的高度是什么？\n4. 解释优先级队列中使用的“顺序”（order）概念。\n5. 什么是优先级队列？\n6. 解释为什么拥有 `n` 个节点的完全二叉树深度最多为\
  \ `log n + 1`。\n7. AVL 树与二叉搜索树有什么区别？\n\n## 算法工作\n\n1. 编写一个方法 `preorder(NodeTree)`，使用前序遍历打印存储的所有值。\n\
  2. 编写一个方法 `postorder(NodeTree)`，使用后序遍历打印存储的所有值。\n3. 编写一个方法 `intSize(NodeTree)`，计算并返回节点数量。\n\
  4. 编写一个方法 `int leafCount(NodeTree)`，计算并返回叶子节点数量。\n5. 为 `contains(x)` 方法提供一个算法，该方法搜索二叉树中的特定值\
  \ `x` 并返回 `true` 或 `false`。\n6. 定义一个 `Comparator` 类 `DecOrder`，按降序排列整数，并提供如何创建一个使用此类\
  \ `Comparator` 对象的 `PriorityQueue` 对象的代码。\n7. 定义一种字符串的顺序：如果字符串 `s` 的长度小于字符串 `t`\
  \ 的长度，则 `s` 小 `t`。如果 `s` 和 `t` 长度相同，且 `s` 在字母顺序上于 `t`，则 `s` 小 `t`。编写一个相应的 `Comparator`\
  \ 类。\n\n## 编程挑战\n\n### 1. AVL 树\n\n为 AVL 树类添加一个 `remove` 方法。使用图形用户界面允许用户交互式操作 AVL\
  \ 树，添加和删除项。\n\n![Image](img/00010.jpg)\n\n### 2. 家谱树\n\n编写带有图形用户界程序，允许用户创建并操作家谱树。家谱树中的每个人限制最多有两个孩子。树节点将存储字符串值，解释为姓名。程序应支持以下命令：\n\
  \n- `root name`：将 `name` 添加为树的根。这必须是输入的命令：它创建一个只有一个节点的树，其值字段持有 `name`。创建的节点成为家谱树的根。在树创建后输入此命令将被忽略。\n\
  - `left parent child`：将新节点 `child` 添加为名为 `parent` 的节点的左孩子。如果树中没有名为 `parent` 的节点，或者该节点已有左孩子，则该命令被忽略。\n\
  - `right parent child`：将新节点 `child` 添加为名为 `parent` 的节点的右孩子。如果树中没有名为 `parent` 的节点，或者该节点已有右孩子，则该命令被忽略。\n\
  - `descendants person`：显示名为 `person` 的节点的所有后代。如果树中没有该节点，则该命令被忽略。\n- `ancestors person`：显示名为\
  \ `person` 的节点的所有祖先。如果树中没有该节点，则该命令被忽略。\n\n![Image](img/00010.jpg)\n\n### 3. 平衡搜索树\n\
  \n\n\n\n\n编写一个程序，将排序数组转换为平衡二叉搜索树。对于本项目，平衡二叉树是指每个节点的左、右子树的大小差异最多为一的树。你的程序应该具有一个图形化用户界面。该程序允许用户输入一个数字\
  \ `n`，生成一个包含 `n` 个随机整数的数组，对数组进行排序，然后将排序数组转换为平衡二叉搜索树。程序应该显示二叉搜索树的图形化表示。\n\n## 4.\
  \ 前缀计算器\n\n当运算符写在操作数之前时，算术表达式称为`前缀形式`。以下是前缀表达式的一些示例以及它们计算的值：\n\n![Image](img/01723.jpg)\n\
  \n以整数开头的表达式（例如 12）是前缀表达式，其值为本身。否则，如果一个表达式以运算符开头并后跟两个前缀表达式，则它也是前缀表达式。在后的情况下，表达式的值通过其组成的前缀子表达式的值递归计算得出。\n\
  \n编写一个程序，允许用户在文本框中输入前缀表达式。程序读取表达式、对其求值，并在合适的 GUI 组件中显示结果。假设用户输入的表达式仅使用正整数以及两个运算符\
  \ `+` 和 `*`。你的程序在求值之前应在内部将前缀表达式转换为二叉树。\n\n***\n\n![Image](img/00009.jpg)\n\n###\
  \ 前缀计算器\n\n***\n\n## 5. AVL 树中的深度\n\n![Image](img/00010.jpg)\n\n扩展本章介绍的 AVL 类，添加一个方法接收一个值，在\
  \ AVL 树中定位该值并显示其深度。通过扩展程序支持的命令列表，包含形 `level value` 格式的命令来实现。例如，如果用户输入\n\n```\nlevel\
  \ 12\n```\n\n程序将显示包含 12 的节点的深度。如果用户输入的值不在树中，程序应显示 -1。如果树中存在多个该值的实例，程序将显示其中任意一个的深度。\n\
  \n## 6. 二叉树的输入与显示\n\n你将获得一个文件，其中包含描述二叉树的数据，该树的节点是字符串。文件第一行单独包含整数 `N`，表示树中的节点数量。第一行之后是另外\
  \ `N` 行，每行指定树中某个节点的子节点信息。节点 `X` 的行以 `X` 本身开头，随后是 `X` 的子节点列表。节点名称之间用空格分隔。例如，数据集\n\
  \n\n\n```\n5\nAl Bob Carol\nBob Debby Elaine\nCarol\nDebby\nElaine\n```\n\n代表一棵二叉树，其中\
  \ Al 有两个名为 Bob 和 Carol 的孩子；Bob 有两个名为 Debby 和 Elaine 的孩子；而 Carol、Debby 和 Elaine 没有孩子。编写一个程序，从此类文件中读取数据并将其显示在\
  \ `JTree` 组件中。\n\n## 7. 二叉树的广度优先遍历\n\n编写一个程序，读取使用编程挑战 6 格式描述二叉树的文件。程序然后根据节点距离根节点的距离列出树中的所有节点：首先是根节点，然后是根的所有孩子，然后是根之子节点的所有节点，依此类推。对于编程挑战\
  \ 6 中的示例树，程序可能会按以下任意顺序输出节点：\n\n```\nAl Bob Carol Debby Elaine\nAl Carol Bob Elaine\
  \ Debby\nAl Bob Carol Debby Elaine\n```\n\n这种排序被称为广度优先排序。注意，这三种并不是可能的广度优先排序。\n\n\
