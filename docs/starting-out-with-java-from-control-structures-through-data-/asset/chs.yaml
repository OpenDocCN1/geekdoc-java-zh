  > b. 重写 (overriding)\n> c. 组合 (composition)\n> d. 错误 (error)\n\n> 10. 这些父类成员可被子类和同包类访问。\n\
  > a. 私有 (private)\n> b. 公共 (public)\n> c. 受保护 (protected)\n> d. 以上所有 (all of these)\n\
