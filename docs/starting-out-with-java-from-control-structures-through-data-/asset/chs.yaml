  \n### 13.7 文件选择器和颜色选择器\n\n> **概念：Java 提供了了一些组件，为你的应用程序配备标准的对话框，用于打开文件、保存文件和选择颜色**。\n\
  \n#### 文件选择器\n\n文件选择器是一个特殊的对话框，允许用户浏览并选择文件。图 13-20 显示了文件选择器对话框的示例。\n\n**图 13-20**\
  \ 用于打开文件的文件选择器对话框\n\n![Image](img/01024.jpg)\n\n你可以创建 `JFileChooser` 类实例（它是 `javax.swing`\
  \ 包的一部分）来显示文件选择器对话框。该类有几个构造函数。我们将关注其中两个，它们的通用格式如下：\n\n```java\nJFileChooser()\n\
  JFileChooser(String path)\n```\n\n所示第一个构造函数不接受任何参数。第二个构造函数接收一个 `String` 路径。（注：原文此处存在大量重复内容，已根据翻译要求去重）。\n\
  \n\n\n\n你使用 `javax.swing` 包中的 `JColorChooser` 类来显示颜色选择器对话框。然而，你不需要创建该类的实例。它有一个名为\
  \ `showDialog` 的静态方法，其通用格式如下：\n\n```\nColor showDialog(Component parent, String\
  \ title, Color initial)\n```\n\n第一个参数可以是 `null` 或指向组件的引用。如果你传递 `null`，对话框通常会居于屏幕中央。如果你传递一个组件的引用（例如\
  \ `JFrame`），则对话框将显示在该组件上方。第二个参数是显示在对话框标题栏中的文本。第三个参数表示在对话框中初始被选中的颜色。该方法返回用户选择的颜色。以下代码是一个示例。该代码允许用户选择一种颜色，然后将该颜色赋值为面板的背景颜色。\n\
  \n```java\nJPanel panel = new JPanel();\nColor selectedColor;\nselectedColor = JColorChooser.showDialog(null,\n\
  \                   \"Select a Background Color\", Color.BLUE);\npanel.setBackground(selectedColor);\n\
  ```\n\n## 13.8 菜单\n\n> **概念：Java 提供了创建下拉菜单的类。菜单可以包含菜单项、复选菜单项、单选按钮菜单项以及其他菜单。**\n\n\
  在你目前学习的 GUI 应用程序中，用户通过点击按钮等组件来启动操作。当应用程序有多个操作供用户选择时，菜单系统比按钮更常用。菜单系统是组织在一个或多个下拉菜单中的命令集合。在学习如何构建菜单系统之前，你必须学习典型菜单系统中包含的基础条目。请查看图\
  \ 13-23 中的示例菜单系统。\n\n**图 13-23** 示例菜单系统\n\n![Image](img/01027.jpg)\n\n图中的菜单系统包含以下项目：\n\
  \n*   **菜单栏 (Menu Bar)**。在窗口顶部，标题栏正下方是菜单栏。菜单栏列出了一个或多个菜单的名称。图 13-23 中的菜单栏显示了两个菜单名称：文件（File）和编辑（Edit）。\n\
  *   **菜单 (Menu)**。菜单是菜单项的下拉列表。用户可以通过点击菜单栏上的其名称来激活菜单。在图中，编辑菜单已被激活。\n*   **菜单项 (Menu\
  \ Item)**。用户可以选择菜单项。当某个菜单项被选中时，通常会执行某种类型的操作。\n*   **复选菜单项 (Check box menu item)**。复选菜单项旁边带有一个小方框。该项可以被选中或取消选中。当它被选中时，方框内会出现一个标记。当它未被选中时，方框显示为空。复选菜单项通常用于开启或关闭某个选项。用户每次选择复选菜单项时，都会切换该项的状态。\n\
  *   **单选按钮菜单项 (Radio button menu item)**。单选按钮菜单项可以被选中或取消选中。它旁边有一个小圆圈，当该项被选中时圆圈会被填充，当未被选中时则为空。与复选菜单项类似，单选按钮菜单项可用于开启或关闭某个选项。当一组单选按钮菜单项通过\
  \ `ButtonGroup` 对象组合在一起时，一次只能选择其中一个。当用户选择一个单选按钮菜单项时，之前选中的那个将被取消选中。\n*   **子菜单 (Submenu)**。菜单中的菜单被称为子菜单。菜单上的某些命令实际上是子菜单的名称。当某个命令右侧出现一个小右箭头时，你可以判断该命令是子菜单的名称。激活子菜单名称会导致子菜单出现。例如，在图\
  \ 13-23 中，点击排序（Sort）命令会导致子菜单出现。\n*   **分隔线 (Separator bar)**。分隔线是一条水平线，用于分隔菜单上的不同组项目。分隔线仅作为视觉辅助，不能被用户选择。\n\
  \n菜单系统是通过以下类构建的：\n\n*   `JMenuItem`。使用此类创建普通的菜单项。当用户选择 `JMenuItem` 组件时，它会产生一个动作事件。\n\
  *   `JCheckBoxMenuItem`。使用此类创建复选菜单项。该类的 `isSelected()` 方法在条目被选中时返回 `true`，否则返回 `false`。当用户选择\
  \ `JCheckBoxMenuItem` 组件时，它会产生一个动作事件。\n*   `JRadioButtonMenuItem`。使用此类创建单选按钮菜单项。`JRadioButtonMenuItem`\
  \ 组件可以组合在 `ButtonGroup` 对象中，以便一次只能选择其中一个。该类的 `isSelected()` 方法在条目被选中时返回 `true`，否则返回\
  \ `false`。当用户选择 `JRadioButtonMenuItem` 组件时，它会产生一个动作事件。\n*   `JMenu`。使用此类创建菜单。\n\
  *   `JMenuBar`。使用此类创建菜单栏。\n\n\n\n\n\n`setPreferredSize` 方法接受一个 `Dimension` 对象作为参数。`Dimension`\
  \ 对象指定了组件的宽度和高度。`Dimension` 类构造函数的第一个参数是组件的宽度，第二个参数是组件的高度。在此类中，常量 `LABEL_WIDTH`\
  \ 和 `LABEL_HEIGHT` 分别被定义为值 400 和 200。因此，该条语句将标签的偏好尺寸设置为宽 400 像素、高 200 像素。（`Dimension`\
  \ 类是 `java.awt` 包的一部分。）注意，从图 13-24 中中看出，这段代码不会影响显示在标签中的文本的大小，只影响标签组件的大小。\n\n为了创建菜单系统，构造函数在第\
  \ 53 行调用了 `buildMenuBar` 方法。在该方法内部，第 67 行的语句创建了一个 `JMenuBar` 组件并将其地址赋值给变量 `menuBar`。`JMenuBar`\
  \ 组件充当 `JMenu` 组件的容器。此应用程序中的菜单栏有两个菜单：文件（File）和文本（Text）。\n\n接下来，第 70 行的语句调用了 `buildFileMenu`\
  \ 方法。`buildFileMenu` 方法创建文件菜单，它只有一个项目：退出（Exit）。第 89 行的语句为退出项目创建了一个 `JMenuItem` 组件，并由变量\
  \ `exitItem` 引用。传递给 `JMenuItem` 构造函数的 `String` 是将显示在该菜单项对应菜单上的文本。第 90 行的语句将 x 键作为助记键（mnemonic）分配给\
  \ `exitItem` 组件。然后，第 91 行为该组件创建了一个动作监听器（`ExitListener` 的实例，这是一个私有内部类），会导致应用程序结束。\n\
  \n接下来，第 94 行为文件菜单创建了一个 `JMenu` 对象。注意，菜单名称作为参数传递给 `JMenu` 构造函数。第 95 行将 F 键作为助记键分配给文件菜单。`buildFileMenu`\
  \ 方法的最后一条语句（第 98 行）将 `exitItem` 添加到 `fileMenu` 组件中。\n\n回到 `buildMenuBar` 方法，第 71\
  \ 行的语句调用了 `buildTextMenu` 方法。`buildTextMenu` 方法构建文本菜单，它包含三个单选按钮菜单项（黑色、红色和蓝色）、一个分隔条和一个复选框菜单项（可见）。第\
  \ 111 行至 121 行的代码创建了单选按钮菜单项，为它们分配了助记键，并为每个项目添加了动作监听器。\n\n`JRadioButtonItem` 构造函数接受一个\
  \ `String` 参数，即菜单项的文本。默认情况下，单选按钮菜单项初始未选中。构造函数还可以接受可选的第二个参数，这是一个 `boolean` 值，表示该项目是否初始被选中。注意在第\
