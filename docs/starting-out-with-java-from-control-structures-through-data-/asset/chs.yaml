  \ 类案例（访问 [www.pearsonhighered.com/gaddis](http://www.pearsonhighered.com/gaddis），获取另一个使用\
  \ `StringTokenizer` 类的示例。\n\n***\n\n### 10.6 数值数据类型的包装类\n\n> **概念：Java API 为每种数值数据类型都提供了包装类。这些类具有执行涉及原始数值的有用操作的方法。**\n\
  \n在本章的早些部分，我们讨论了 `Character` 包装类及其的一些静态方法。Java API 还为所有数值原始数据类型提供了包装类，如 表 10-13\
  \ 所示。\n\n你已经使用过许多这些包装类的“解析（parse）”方法，这些方法将字符串转换为原始类型的值。例如，`Integer.parseInt` 方法将字符串转换为\
  \ `int`，而 `Double.parseDouble` 方法将字符串转换为 `double`。现在我们将检查包装类的其他方法和用途。\n\n**表 10-13**\
  \ 数值原始数据类型的包装类\n\n![Image](img/00769.jpg)\n\n#### 静态 `toString` 方法\n\n每个数值包装类都有一有一个静态的\
  \ `toString` 方法，可以将数字转换为字符串。该方法接受数字作为参数，并返回该数字的字符串表示。下面的代码演示了：\n\n```java\nint i\
  \ = 12;\ndouble d = 14.95;\nString str1 = Integer.toString(i);\nString str2 = Double.toString(d);\n\
  ```\n\n#### `toBinaryString`, `toHexString` 和 `toOctString` 方法\n\n`toBinaryString`、`toHexString`\
  \ 和 `toOctString` 方法是 `Integer` 和 `Long` 类的静态成员。这些方法接受整数作为参数，并返回该数字的二进制、十六进制或八进制的字符串表示。下面的代码演示了：\n\
  \n```java\nint i = 12;\ndouble d = 14.95;\nString str1 = Integer.toString(i);\n\
  String str2 = Double.toString(d);\n```\n\n这段代码将产生以下输出：\n\n```\n12\n14.95\n```\n\n\
  #### `MIN_VALUE` 和 `MAX_VALUE` 常量\n\n每个数值包装类都有一组名为 `MIN_VALUE` 和 `MAX_VALUE` 的 `final`\
  \ 变量。这些变量持有特定类型的最小值和最大值。例如，下面的代码演示了：\n\n```java\nint i = 12;\ndouble d = 14.95;\n\
  String str1 = Integer.toString(i);\nString str2 = Double.toString(d);\n```\n\n这段代码将产生输出：\n\
  \n```\n12\n14.95\n```\n\n#### 自动装箱和拆箱\n\n从包装类创建对象是可能的。一种方法是将初始值传递给构造函数，如下：\n\n```java\n\
  Integer number = new Integer(7);\n```\n\n这创建了一个初始化为 7 的 `Integer` 对象。另一种方法是声明包装类变量，然后对其赋值原始值。例如，查看下面的代码：\n\
  \n```java\nInteger number;\nnumber = 7;\n```\n\n这段代码的第一语句声明了一个 `Integer` 变量 `number`。它没有创建\
  \ `Integer` 对象，只是一个变量。第二个语句是简单的赋值。它将原始值 7 赋值给变量。然而，因为 `number` 是包装类变量，Java 执行了自动装箱操作。*自动装箱*是\
  \ Java 自动将值封装在对象内部的过程。当此赋值语句执行时，Java 将 7 封装在 `Integer` 对象中，并将该对象的地址赋值给 `number`\
  \ 变量。\n\n*拆箱*是装箱的反面。它是包装类对象转换为原始类型的过程。下面的代码演示了拆箱操作：\n\n![Image](img/0770.jpg)\n\n\
  这段代码的第一语句将 `myInt` 声明为 `Integer` 引用变量。原始值 5 被自动装箱，并将生成的对象地址赋值给 `myInt` 变量。第二语句将\
  \ `primitiveNumber` 声明为 `int` 变量。然后，第三语句将 `myInt` 对象赋值给 `primitiveNumber`。当此语句执行时，Java\
  \ 自动拆箱 `myInt` 包装类对象，并将结果（5）存储在 `primitiveNumber` 中。\n\n尽管你很少创建包装类的实例，但 Java 的自动装箱和拆箱功能使得某些操作更加方便。有时你会发现处于这样的情况下：你想使用原始变量执行操作，但该操作只能与对象一起。例如，回想我们在第\
  \ 8 章讨论过的 `ArrayList` 类（#dummy_split_015.html_filepos1408679）。`ArrayList` 是一种用于存储其他对象的数组类对象。然而，你不能在\
  \ `ArrayList` 中存储原始值。它仅用于对象。如果你尝试编译以下语句，将会发生：\n\n```java\nArrayList<int> list =\
  \ new ArrayList<int>(); // 错误！\n```\n\n\n\n\n然而，你可以将包装类对象存储在 `ArrayList` 中。如果我们需要在\
  \ `ArrayList` 中存储 `int` 值，则必须指定该 `ArrayList` 将包含 `Integer` 对象。这里是一个示例：\n\n```\n\
  ArrayList<Integer> list = new ArrayList<Integer>(); // Okay.\n```\n\n这条语句声明 `list`\
  \ 引用一个可以包含 `Integer` 对象的 `ArrayList`。在 `ArrayList` 中存储 `int` 值的一种方法是实例化一个 `Integer`\
  \ 对象，用所需的 `int` 值对其初始化，然后将该 `Integer` 对象传递给 `ArrayList` 的 `add` 方法。这里有一个示例：\n\n\
  ```\nArrayList<Integer> list = new ArrayList<Integer>();\nInteger myInt = 5;\nlist.add(myInt);\n\
  ```\n\n然而，Java 的自动装箱（autoboxing）和自动拆箱（unboxing）功能使得创建 `Integer` 对象变得不再。如果你向 `ArrayList`\
  \ 添加一个 `int` 值，Java 会自动对该值进行装箱。以下代码可以正常运行：\n\n```\nArrayList<Integer> list = new\
  \ ArrayList<Integer>();\nlist.add(5);\n```\n\n当值 5 被传递给 `add` 方法时，Java 将该值装箱成一个\
  \ `Integer` 对象。在必要时，Java 还会对从 `ArrayList` 获取的值进行拆箱。以下代码演示了这一点：\n\n```\nArrayList<Integer>\
  \ list = new ArrayList<Integer>();\nlist.add(5);\nint primitiveNumber = list.get(0);\n\
  ```\n\n这段代码的最后一条语句获取索引为 0 的项。由于该项被赋值给 `int` 变量，Java 会对其进行拆箱并将原始值存储在 `int` 变量中。\n\
  \n#### ![Image](img/00004.jpg) 检查点\n\n> 10.29 编写一条语句，将以下整数转换为字符串并将其存储在 `str` 引用的\
