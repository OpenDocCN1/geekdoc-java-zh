  \n\n\n\n\n## 18.19 哪种具体的列表类使用链表存储其元素？\n\n## 18.20 当你的应用程序需要在列表中存储大量数据，并且可能发生大量的插入和/或删除操作时，哪种具体的列表类是一个很好的选择？\n\
  \n## 18.3 集合 (Sets)\n\n**概念：集合是一种允许你从海量数据中快速找到某个值的集合。集合以无序序列存储元素，并且不允许重复项。**\n\n\
  有时当数据存储存储在列表中时，你知道特定项目的确切位置。例如，假设我们有一个存储每年每月总销售额的列表。该列表有 12 个元素，索引从 `0` 到 `11`。我们知道\
  \ 1 月份的销售额存储在索引 `0`，2 月份的销售额存储在索引 `1`，以此此类推。如果我们想获取 12 月份的销售额，我们就必须检索索引为 `11` 的元素。在列表中，第\
  \ `n` 个月的销售额存储在索引 `n - 1` 。\n\n有时我们需要从集合中检索一个特定的元素，但我们不知道该元素的位置。例如，假设我们有一个 `Customer`\
  \ 对象的集合，我们需要根据客户名称搜索一个特定的对象。`Customer` 对象每天被添加到集合中或从集合中移除，我们无法知道特定对象存储在何处。如果对象存储在列表中，寻找特定客户意味着要顺序搜索列表，直到找到我们正在寻找的元素。如果列表中有大量对象，这可能是一个耗时的过程。\n\
  \n如果快速检索非常重要，那么集合可能是这种情况下最好用的集合类型。当你拥有一个大量数据集合，并且必须通过搜索其值来从集合中检索元素时，集合会非常有用。集合中的元素存储在一种针对此类类型检索进行了优化的数据结构中。\n\
  \n将集合与列表进行比较是有帮助的。列表允许你在末尾尾接元素、在开头添加元素，或在列表中的特定位置插入元素。相比之下，集合元素与集合中的位置没有关联。集合与列表在另一个方面也不同：它们不允许出现重复元素。集合中的每个元素必须是唯一的。\n\
  \n#### `Set` 接口和 `AbstractSet` 类\n\n`Set` 接口扩展了 `Collection` 接口，因此它继承了 `Collection`\
  \ 指定的所有方法。（有关 `Collection` 接口指定方法的描述，请参见 [表 18-1]。）`Set` 接口没有添加任何自己的方法，但它对继承自 `Collection`\
  \ 的许多方法施加了限制。这些限制强制要求集合不能包含重复元素。\n\n`AbstractSet` 类扩展了 `AbstractCollection` 类，并实现了\
  \ `Set` 接口。该类可以作为其他集合类的抽象父类，JCF 中所有的具体的集合类都扩展了这个类。\n\n#### `HashSet` 类\n\n我们将学习第一个具体的集合类是\
  \ `HashSet` 类，它实现了 `Set` 接口。`HashSet` 类使用哈希值（hash codes）存储其元素，使得搜索更快。要理解 `HashSet`\
  \ 如何工作，首先必须理解哈希值的概念。\n\n*哈希值*（hash code）是对象的特征整数值。你使用*哈希算法*（hashing algorithm）为对象计算哈希值。有很多不同的哈希算法，从简单到复杂不等。尽管我们不会对哈希算法进行深入研究，但在在本节稍后部分，我们将查看计算哈希值的一些简单技术。\n\
  \n哈希算法通常使用存储在对象中的数据来计算对象的哈希值。例如，如果我们为一个字符串计算哈希值，我们会在计算中某种使用组成字符串的字符。也许我们会在数学公式中使用每个字符的\
  \ Unicode 值，从而得到一个整数值。理想情况下，我们的哈希算法应该为不同的字符串产生不同的哈希值。例如，`\"Fred\"` 的哈希值将与 `\"Wilma\"\
  ` 的哈希值不同。\n\n除了为不同的对象产生不同的哈希值外，理想的哈希算法应该为值相等的对象产生相同的哈希值。例如，假设有以下两个 `String` 对象，`str1`\
  \ 和 `str2`：\n\n```\nString str1 = new String(\"Fred\");\nString str2 = new String(\"\
  Fred\");\n```\n\n尽管 `str1` 和 `str2` 是不同的对象，但它们包含相等的数据，哈希算法应该为两者产生相同的哈希值。\n\n在 Java\
  \ 中，每个对象都有继承自 `Object` 类的 `hashCode` 方法。该方法返回对象的哈希值。然而，继承自 `Object` 类的 `hashCode`\
  \ 方法很少是足够的，因为它返回的值是基于对象的内存地址的。`Object` 类 `hashCode` 方法返回的值对于每个对象都是唯一的，即使是包含相同数据的对象也是如此。由于这个原因，通常必须重写\
  \ `Object` 类的 `hashCode` 方法，以便为等效对象返回相同的哈希值。\n\n哈希值是 `HashSet` 类工作的核心。当一个对象被添加到\
  \ `HashSet` 时，`HashSet` 会调用对象的 `hashCode` 方法来获取其哈希值。然后它检查集合中是否已经存储了相同哈希值的对象。（记住，集合不允许重复。）如果发现集合中已经存储了相同哈希值的对象，它会进行额外的检查：调用对象的\
  \ `equals` 方法来查看两个对象是否相等。如果相等，则 `HashSet` 不再存储该对象。\n\n\n\n\n\n**提示：** 因为 `hashCode`\
  \ 和 `equals` 方法是这样配合使用的，每当你重写 `Object` 类的 `equals` 方法时，也应该重写 `hashCode` 方法。\n\n\
  ***\n\n`HashSet` 类有四个构造函数，总结在表 18-7 中。请注意，当构造 `HashSet` 时，它有一个初始容量和一个负载因子。`initial\
  \ capacity`（初始容量）是 `HashSet` 拥有的“桶”（buckets）的数量。`load factor`（负载因子）是在容量增加之前，必须被占用的桶的百分比。例如，当负载因子为\
  \ 0.75 时，当 75% 的桶中存储了值时，容量就会增加。\n\n**表 18-7** `HashSet` 构造函数\n\n![Image](img/01360.jpg)\n\
  \n现在让我们来看一个简单的示例，展示如何在 `HashSet` 中存储 `String` 对象。代码列表 18-6 中的程序创建了一个 `HashSet` 并向其添加一组\
  \ `String` 对象。然后，它尝试向集合添加重复的 `String` 对象。\n\n**代码列表 18-6 (`HashSetDemo1.java`)**\n\
  \n![Image](img/01361.jpg)\n\n![Image](img/01362.jpg)\n\n**程序输出**\n\n`Here are the\
  \ elements.`\n`Apple`\n`Pear`\n`Banana`\n`Strawberry`\n`Trying to add Banana to\
  \ the set again…`\n`Banana was not added again.`\n`Here are the elements once more.`\n\
  `Apple`\n`Pear`\n`Banana`\n`Strawberry`\n\n仔细观察第 30 行和 31 行：\n\n```\n  if (!fruitSet.add(\"\
  Banana\"))\n      System.out.println(\"Banana was not added again.\");\n```\n\n\
  当向集合添加重复项时，`HashSet` 类的 `add` 方法不会抛出异常。它不再添加该项目。然而，该方法会返回一个 `boolean` 值，指示该项目是否被添加。第\
  \ 30 行的 `if` 语句调用了 `add` 方法，并将 `\"Banana\"` 作为参数传递。因为 `\"Banana\"` 已经在集合中，该方法返回\
  \ `false`，表示没有没有再次添加。\n\n代码列表 18-7 中的程序展示了另一个演示。它创建了一个存储了一些名称的 `HashSet`，然后获取一个\
  \ `iterator` 来遍历每个元素。请注意，你使用 `Iterator` 对象作为 `HashSet` 的迭代器。程序还调用了 `HashSet` 类的\
  \ `contains` 方法来确定对象是否存在于集合中。\n\n**代码列表 18-7 (`HashSetDemo2.java`)**\n\n![Image](img/01363.jpg)\n\
  \n![Image](img/01364.jpg)\n\n**程序输出**\n\n`Here are the names in the set.`\n`Chris`\n\
  `Katherine`\n`David`\n`Kenny`\n`Katherine is in the set.`\n`Bethany is NOT in the\
  \ set.`\n\n### 实现你自己的 `hashCode` 方法\n\n当你设计一个类时，如果你想在 `HashSet` 中存储该类的对象，就需要重写 `hashCode`\
  \ 和 `equals` 方法。在编写自己的 `hashCode` 和 `equals` 方法时，你应该遵循以下三个准则：\n\n1. 如果在应用程序执行期间多次调用对象的\
  \ `hashCode` 方法，该方法应该一致地返回相同的值。唯一的例外是对象中的某些内容发生了变化，这会影响 `equals` 方法比较的方式。\n2. 如果\
  \ `equals` 方法报告两个对象相等，那么这两个对象的 `hashCode` 方法都应该返回相同的值。\n3. 如果 `equals` 方法报告两个对象*不*相等，那么两个对象具有相同的哈希值是允许的。然而，你应该意识到，过多的具有相同哈希值的不等对象会降低使用哈希值进行搜索的算法的性能。\n\
  \n`String` 类使用以下公式计算字符串的哈希值：\n\n`hashCode = S*[0] * 31^((n – 1))*+ S*[1] * 31^((n\
  \ – 2)) + … + S[n – 1]`\n\n在公式中，`n` 是字符串中的字符数，`S[0]` 是位置 0 处字符的 Unicode 值，`S[1]`\
  \ 是位置 1 处字符的 Unicode 值，而 `S[n – 1]` 是位置 `n – 1` 处字符的 Unicode 值。\n\n`String` 类使用的算法相当复杂。其他类使用简单的方法。例如，`Character`\
  \ 类直接使用字符的 Unicode 值作为其哈希值。`Integer` 类使用对象的实际整数值作为其哈希值。\n\n代码列表 18-8 显示了一个用于存储数据的\
  \ `Car` 类。（注意：提供的文本在此处似乎损坏/乱码，但核心逻辑得以保留）。\n\n\n\n\n\n为了让 `TreeSet` 能够对其存储的对象进行排序，这些对象必须具有“自然排序”（natural\
  \ order）。这意味着 `TreeSet` 必须能够比较对象，并确定一个对象是大于、小于还是等于另一个对象。实现这一点的一种方法是在 `TreeSet` 中只存储实现\
  \ `Comparable` 接口的对象。我们在学习泛型时，在第 17 章中讨论过 `Comparable` 接口。请记住，`Comparable` 接口指定了一个名为\
  \ `compareTo` 的方法，用于比较调用对象与作为参数传递给方法的对象。以下是 `compareTo` 方法的工作原理：\n\n> • 如果调用对象小于作为参数传递的对象，该方法返回一个负数。\n\
  > • 如果调用对象等于作为参数传递的对象，该方法返回 0。\n> • 如果调用对象大于作为参数传递的对象，该方法返回一个正数。\n\n如果你只向 `TreeSet`\
  \ 存储实现了 `Comparable` 接口的对象，那么 `TreeSet` 就可以使用 `compareTo` 方法来比较这些对象。事实上，当你使用无参构造函数创建一个\
  \ `TreeSet` 时，`TreeSet` 会假设你正在向的的对象实现了 `Comparable`。代码列表 18-11 中的程序通过创建一个 `TreeSet`\
  \ 并向其添加 `String` 对象来演示了这一点。请记住，`String` 类实现了 `Comparable` 接口。\n\n**代码列表 18-11 (`TreeSetDemo1.java`)**\n\
