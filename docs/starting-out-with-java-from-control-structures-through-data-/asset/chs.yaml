  \ 抽象类的目的是什么？\n\n> 11.22 如果一个类被定义为抽象类，你不能对该类做什么？\n\n## 11.9 接口\n\n> **概念：接口规定了类的行为**。\n\
  \n在上一节中，你学习了抽象类不能被实例化，但其目的是作为超类使用。你还学习了抽象方法没有方法体，必须在子类中重写。接口类似于所有方法都是抽象方法的抽象类。它不能被实例化，且接口中列出的所有方法必须在其他地方编写。接口的目的是规定类的行为。\n\
  \n接口看起来与类相似，区别在于使用的是 `interface` 关键字而不是 `class` 关键字，并且接口中指定的方法没有方法体，只有以分号结尾的方法头。以下是接口定义的通用格式：\n\
  \n```java\n  public interface InterfaceName\n  {\n    (Method headers …)\n  }\n\
  ```\n\n例如，代码列表 11-29 显示了一个名为 `Relatable` 的接口，该接口旨在用于之前介绍的 `GradedActivity` 类。该接口有三个方法头：`equals,\
  \ isGreater` 和 `isLess`。注意，每个方法都接受一个 `GradedActivity` 对象作为参数。同样注意，方法头没有使用访问修饰符，因为接口指定的所有方法都是公共的。\n\
  \n**代码列表 11-29 (`Relatable.java`)**\n\n![Image](img/00875.jpg)\n\n为了让一个类使用接口，它必须实现该接口。这是通过\
  \ `implements` 关键字实现的。例如，假设我们有一个名为 `FinalExam3` 的类，它继承自 `GradedActivity` 类并实现了 `Relatable`\
  \ 接口。它的定义的第一行如下：\n\n```java\n  public class FinalExam3 extends GradedActivity\n\
  \         implements Relatable\n```\n\n当一个类实现接口时，它同意提供接口所指定的所有方法。人们常说接口像一份“合同”，当一个类实现接口时，它必须遵守这份合同。\n\
  \n实现接口的类必须提供接口中列出的所有方法，且具有完全相同的指定的签名和相同的返回类型。因此，在之前所示示例中，`FinalExam3` 类必须提供一个 `equals`\
  \ 方法、一个 `isGreater` 方法和一个 `isLess` 方法，所有这些方法都接受一个 `GradedActivity` 对象作为参数并返回一个 `boolean`\
  \ 值。\n\n你可能猜到 `Relatable` 接口命名为“Relatable”是因为它指定了推测上与 `GradedActivity` 对象进行关系比较的方法。其意图是让任何实现此接口的类都能够与\
  \ `GradedActivity` 对象产生“关联性”，方法是确保它拥有执行关系比较的 `equals`、`isGreater` 和 `isLess` 方法。但是，接口只指定了这些方法头，而没有规定方法应该做什么。虽然实现\
  \ `Relatable` 接口的类的程序员可以选择这些方法的功能，但他或她应该提供符合这一意图的方法。\n\n代码列表 11-30 显示了 `FinalExam3`\
  \ 类的完整代码，该类实现了 `Relatable` 接口。`equals, isGreater` 和 `isLess` 方法将调用对象与作为参数传递的对象进行比较。代码列表\
  \ 11-31 中的程序演示了该类。\n\n**代码列表 11-30 (`FinalExam3.java`)**\n\n![Image](img/00876.jpg)\n\
