  \ 11 章中学习更多信息。\n\n* *\n\n## 9.6 复制对象的方法\n\n> **概念：通过为类配备一个返回对象副本的方法，可以简化复制对象的过程。**\n\
  \n你不能通过简单的赋值语句来复制对象，就像处理基本变量那样。例如，查看下面的代码：\n\n```\nStock company1 = new Stock(\"\
  XYZ\", 9.62);\nStock company2 = company1;\n```\n\n第一条语句创建了一个 `Stock` 对象并将其地址赋值给变量\
  \ `company1`。第二条语句将 `company1` 赋值给 `company2`。这并没有复制 `company1` 所引用的对象。相反，它复制了存储在\
  \ `company1` 中的地址并将该地址存储在 `company2` 中。执行此语句后，`company1` 和 `company2` 变量将引用同一个对象。这在图\
  \ 9-10 中所示。\n\n**图 9-10** 两个变量引用同一个对象\n\n![Image](img/00655.jpg)\n\n这种赋值被称为*引用复制*（reference\
  \ copy），因为只复制了地址，而不是对象本身。要复制对象本身，你必须创建一个新对象，然后将新对象的字段设置为与调用对象相同。这一过程可以通过为类配备一个返回副本对象引用的方法来简化。在源代码文件夹\
  \ *第 09 章\\Stock 类阶段 2）* 中，你将找到 `Stock` 类的修订版本。该版本的类有一个名为 `copy` 的方法，返回一个对象的副本。该方法的代码如下（类的其他部分没有发生变化，因此只显示了\
  \ `copy` 方法）：\n\n```\npublic Stock copy() {\n    // 创建一个新的 Stock 对象并用调用对象持有的数据对其初始化。\n\
  \    Stock copyObject = new Stock(symbol, sharePrice);\n    return copyObject; //\n\
  }\n```\n\n代码列表 9-11 中的程序演示了 `copy` 方法。（该文件也存储在源代码文件夹 *第 09 章\\Stock 类阶段 2）*中，可以通过\
