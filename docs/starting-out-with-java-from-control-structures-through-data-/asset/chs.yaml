  \n> 12. 这种绑定方式，Java 虚拟机在运行时根据变量引用的对象类型决定调用哪个方法。\n> a. 静态 (static)\n> b. 早期 (early)\n\
  > c. 灵活 (flexible)\n> d. 动态 (dynamic)\n\n> 13. 这个运算符可以判断引用变量是否引用某个特定类的对象。\n> a.\
