  > 19.10 为什么 `ListType` 对象应该重写 `equals` 方法，以便其他 `ListType` 方法正常工作？\n\n### 19.4 编写迭代器类和可迭代列表\n\
  \n> **概念：你可以编写与你的列表类配合使用的自定义 `Iterator` 类**。\n\n迭代器（iterator）是一个可以从列表中一个接一个获取元素的对象。你通常在循环中使用迭代器。在循环的每次迭代中，迭代器都会从列表中获取一个不同的元素。\n\
  \n我们首先在第 18 章 中讨论了迭代器。回想一下，Java 集合框架中的集合类提供一个返回 `Iterator` 对象的 `iterator` 方法。从该方法返回的\
  \ `Iterator` 对象可以用于遍历集合中的所有元素。你也可以为自己的列表类配备一个返回 `Iterator` 对象的 `iterator` 方法。返回的\
  \ `Iterator` 对象可以用于遍历你列表类中的元素。\n\n为了在你的列表类中使用 `Iterator`s，你必须做两件事情：\n\n* 编写一个可以用于实例化迭代器的类。该类必须实现\
  \ `Iterator` 接口。`Iterator` 位于 `java.util` 包中。\n* 让你的列表类实现 `Iterable` 接口。`Iterable`\
  \ 位于 `java.lang` 包中。\n\n一旦你正确完成了这两点，就可以从你的列表类中获取一个 `Iterator` 对象，并使用该对象遍历你的列表。让我们详细查看这些步骤。\n\
  \n#### 编写 `Iterator` 类\n\n`Iterator` 类是实现了 `java.util.Iterator` 接口的类。该接口规定了迭代器必须执行的基本操作。图\
  \ 19-10 显示了 `Iterator` 接口的 UML 图，表 19-3 描述了它指定的方法。\n\n![Image](img/00009.jpg)\n\n\
  ***\n\n**编写 `Iterator`**\n\n***\n\n**图 19-10** `java.util.Iterator` 接口\n\n**表 19-3**\
  \ `Iterator` 指定的方法\n\n**图 19-10** `java.util.Iterator` 接口\n\n```java\npublic class\
  \ ListIterator<E> implements Iterator<E> {\n    private List<E> list;\n    private\
  \ int previous;\n    private boolean canRemove;\n\n    public ListIterator(List<E>\
  \ list) {\n        list = list;\n        previous = -1;\n        canRemove = false;\n\
  \    }\n\n    public boolean hasNext() {\n        return (previous + 1) < list.size();\n\
  \    }\n\n    public E next() {\n        if (!hasNext()) {\n            throw new\
  \ NoSuchElementException();\n        }\n        previous++;\n        canRemove =\
  \ true;\n        return list.get(previous);\n    }\n\n    public void remove() {\n\
  \        if (!canRemove) {\n            throw new IllegalStateException();\n   \
  \     }\n        list.remove(previous);\n        previous--;\n        canRemove\
  \ = false;\n    }\n}\n```\n\n\n\n\n在本书的源代码文件夹 `第 19 章\\可迭代文件` 中，包含一个 `ListType`\
  \ 类的修改版本。该版本的类实现了 `Iterable` 接口。我们不会在文中显示该类的全部代码，因为唯一的更改是实现该接口并添加一个 `iterator` 方法。`iterator`\
  \ 方法的代码所示：\n\n![Image](img/01486.jpg)\n\n如你所见，该方法非常简单。它创建了我们之前看到的 `ListTypeIterator`\
  \ 类的实例，并将 `this` 作为参数传递给构造函数。最后返回该对象的引用。\n\n`代码列表 19-9` 展示了如何从 `ListType` 获取 `Iterator`\
  \ 并使用它来遍历列表元素示例。（该文件也存储在源代码文件夹 `第 19 章\\可迭代文件` 中。）\n\n**代码列表 19-9 `(IteratorDemo1.java)`**\n\
  \n![Image](img/01487.jpg)\n\n![Image](img/01488.jpg)\n\n**程序输出**\n\n`     Johnson`\n\
  `     Graves`\n`     Jones`\n\n第 20 行的语句获取第一个迭代器。第 24 到 28 行的循环使用迭代器遍历列表，寻找 `\"\
  Smith\"`。当找到它时，它会被移除。第 31 行的语句获取第二个迭代器。然后，第 35 到 36 行的循环使用迭代器遍历列表元素，并打印每个元素。如程序输出所示，`\"\
  Smith\"` 已从列表中移除。\n\n### 使用增强型 `for` 循环\n\n在你的列表类中实现 `Iterable` 接口有一个很好的处：它允许你编写遍历列表元素的增强型\
  \ `for` 循环。回想 `第 18 章`，Java 编译器实际上会将增强型 `for` 循环转换为使用迭代器的传统循环。`代码列表 19-10` 中的程序展示了在我们使\
