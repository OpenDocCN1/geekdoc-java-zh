  \ `Point` 类的实例。这将防止程序员在实例化 `Point` 类时使用如 `String` 之类的类作为类型参数。我们可以通过使用 `extends`\
  \ 关键字来限制该的类型参数，从而实施这种限制。\n\n代码列表 17-7 显示了 `Point` 类的修改版本，它在泛型类型符号中使用了 `extends`\
