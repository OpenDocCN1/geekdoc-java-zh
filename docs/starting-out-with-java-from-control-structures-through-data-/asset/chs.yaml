  \ 类生成的窗口\n\n![Image](img/00418.jpg)\n\n### 更改 `JFrame` 对象内容面板的背景颜色\n\n回想一下，`JFrame`\
  \ 对象有一个内容面板（content pane），它是所有添加到 `JFrame` 中的组件的容器。当你将一个组件添加到 `JFrame` 对象中时，你实际上是将其添加到该对象的内容面板中。在本节所示的示例中，我们向一个面板添加了标签和一些按钮，然后将该面板添加到\
  \ `JFrame` 对象的内容面板中。当我们更改背景颜色时，我们更改的是面板的背景颜色。在这个示例中，内容面板的颜色并不重要，因为它完全被面板填满了。面板的颜色覆盖了内容面板的颜色。\n\
  \n在某些情况下，如果你没有用面板填充 `JFrame` 对象的内容面板，你可能想要更改内容面板的背景颜色。如果你想更改 `JFrame` 对象内容面板的背景颜色，你必须调用内容面板的\
  \ `setBackground` 方法，而不是 `JFrame` 对象的 `setBackground` 方法。例如，在扩展 `JFrame` 类的类中，可以使用以下语句将内容面板的背景更改为蓝色：\n\
  \n```\ngetContentPane().setBackground(Color.BLUE);\n```\n\n在这一语句中，调用了 `getConentPane`\
  \ 方法来获取 `JFrame` 对象内容面板的引用。然后使用该引用调用内容面板的 `setBackground` 方法。结果是，内容面板的背景颜色将变为蓝色。\n\
  \n#### `ActionEvent` 对象\n\n动作监听器的 `actionPerformed` 方法有一个名为 `e` 的参数变量，其声明如下：\n\n\
