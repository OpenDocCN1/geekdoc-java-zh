  \ 类应具有以下方法：\n\n![Image](img/00902.jpg)\n\n## 10. `Ship`, `CruiseShip` 和 `CargoShip`\
  \ 类\n\n设计一个名为 `Ship` 的类，包含以下内容：\n\n> • 一个姓名的字段 (String)。\n> 一个建造年份的字段 (int)。\n>\
  \ • 一个或多个构造函数。\n> 相应的修改器和访问器方法。\n> 一个返回姓名和年份的 `toString` 方法。\n\n设计一个名为 `CruiseShip`\
  \ 的类，它继承自 `Ship` 并包含以下内容：\n\n> • 一个人数字段 (int)。\n> • 一个或多个构造函数。\n> 相应的修改器和访问器方法。\n\
  > 一个返回姓名、年份和人数的 `toString` 方法。\n\n设计一个名为 `CargoShip` 的类，它继承自 `Ship` 并包含以下内容：\n\n\
  > • 一个载重吨字段 (int)。\n> • 一个或多个构造函数。\n> 相应的修改器和访问器方法。\n> • 一个返回姓名、年份和载重量的 `toString`\
  \ 方法。\n\n在一个程序中演示这些类，该程序有一个 `Ship` 数组。将各种 `Ship`、`CruiseShip` 和 `CargoShip` 对象赋值给数组元素。然后程序应遍历数组，调用每个对象的\
  \ `toString` 方法。\n\n\n\n\n此程序中的 `numbers` 数组仅包含三个元素，下标从 0 到 2。当程序尝试读取 `numbers[3]`\
  \ 处的元素时，程序会崩溃，并显示一条与程序输出末尾显示的类似的错误消息。该消息表示发生了异常，并提供了关于该异常的一些信息。`exception`（异常）是由于错误或意外事件的结果而在内存中生成的对象。当异常产生时，称其为被“抛出”（thrown）。除非应用程序检测并处理该异常，否则它会导致应用程序停止。\n\
  \n为了检测已抛出的异常并防止其导致应用程序停止，Java 允许你创建异常处理器。`exception handler`（异常处理器）是一段代码，用于在异常被抛出时优雅地做出响应。拦截和响应异常的过程被称为\
  \ `exception handling`（异常处理）。如果你的代码在异常被抛出时没有对其进行处理，则由 `default exception handler`（默认异常处理器）来处理，如代码列表\
  \ 12-1 所示。默认异常处理器会打印错误错误信息并导致程序崩溃。\n\n导致 代码列表 12-1 中抛出异常的错误很容易避免的。如果循环写得正确，它就不会尝试读取数组边界之外的内容。然而，某些错误是由应用程序之外的条件引起的，无法避免。例如，假设应用程序在磁盘上创建了一个文件，然后用户删除了它。随后应用程序尝试打开该文件进行读取，由于文件不存在，便发生了错误。结果就是抛出了异常。\n\
  \n## 异常类\n\n如前所述，异常是一个对象。异常对象是由 Java API 中的类创建的。API 拥有大量的异常类层次结构。该层次结构的一小部分如图 12-1](#dummy_split_019.html_filepos2124189)\
  \ 所示。\n\n如你所见，层次结构中的所有类都继承自 `Throwable` 类。紧接 `Throwable` 类之下的是 `Error` 和 `Exception`\
  \ 类。继承自 `Error` 的类用于发生严重错误时抛出的异常，例如 Java 虚拟机的的内部错误或内存耗尽。你的应用程序不应尝试处理这些错误，因为它们是严重状况的结果。\n\
  \n你将处理的所有异常都是继承自 `Exception` 的类的实例。图 12-1 显示了其中的两个类：`IOException` 和 `RuntimeException`。这些类也充当父类。`IOException`\
  \ 是与输入输出操作相关的异常的父类。`RuntimeException` 是由于编程错误（例如数组下标越界）导致的异常的父类。\n\n图 12-1 中的图表显示了继承自\
  \ `IOException` 两个类：`EOFException` 和 `FileNotFoundException`。这些是创建异常对象的类示例。当应用程序尝试读取文件末尾之外时，会抛出\
  \ `EOFException` 对象；当应用程序尝试打开一个不存在的文件时，会抛出 `FileNotFoundException` 对象。\n\n![Image](img/00005.jpg)\n\
  \n**注意：** 异常类位于 Java API 的包中。例如，`FileNotFoundException` 位于 `java.io` 包中。当你处理一个不在\
  \ `java.lang` 包中的异常时，将需要适当的 `import`语句。\n\n**图 12-1** 异常类层次结构的一部分\n\n![Image](img/00904.jpg)\n\
  \n## 处理异常\n\n要处理异常，你使用 `try` 语句。我们将查看 `try` 语句的几种变体，从以下通用格式开始：\n\n首先出现关键字 `try`。接下来，在大括号内部出现一段代码，大括号是必须的。这段代码被称为\
  \ `try block`（try 块）。`try block` 包含一个或多个被执行并可能抛出异常的语句。你可以将 try 块中的代码认为是受“保护”的，因为如果\
  \ try 块抛出异常，应用程序不会停止。\n\n在 try 块之后，会出现一个 `catch` 子句。`catch` 子句以关键字 `catch` 开头，后面跟着代码\
  \ `(ExceptionType parameterName)`。这是一个参数变量声明，其中 `ExceptionType` 是异常类的名称，`parameterName`\
  \ 是变量名。如果 try 块中的代码抛出了 `ExceptionType` 类的异常，则参数变量将引用该异常对象。此外，紧随 `catch` 子句的代码将被执行。紧随\
  \ `catch` 子句的代码被称为 `catch block`（catch 块）。同样，大括号是必须的。\n\n让我们来看一个使用 `try` 语句的代码示例。以下\
  \ try 块中的语句尝试打开文件 `MyFile.txt`。如果文件不存在，`Scanner` 对象将抛出 `FileNotFoundException` 类的异常。此代码的设计用于在抛出异常时对其进行处理。\n\
  \n![Image](img/00906.jpg)\n\n让我们仔细观察。首先执行 try 块中的代码。如果这段代码抛出异常，Java 虚拟机将搜索处理该异常的\
  \ `catch` 子句。为了让 `catch` 子句能够处理异常，其参数必须与异常的类型兼容。这是该代码的 `catch` 子句：\n\n```\ncatch\
  \ (FileNotFoundException e)\n```\n\n该 `catch` 子句声明了一个名为 `e` 的引用变量作为其参数。变量 `e` 可以引用\
  \ `FileNotFoundException` 类的对象。因此，此 `catch` 子句可以处理 `FileNotFoundException` 类异常。如果\
  \ try 块中的代码抛出 `FileNotFoundException` 类的异常，变量 `e` 将引用该异常对象并执行 catch 块中的代码。在这种情况下，将打印消息“File\
  \ not found.”在执行 catch 块后，程序将恢复执行整个 `try`/`catch` 结构之后的代码。\n\n![Image](img/00005.jpg)\n\
