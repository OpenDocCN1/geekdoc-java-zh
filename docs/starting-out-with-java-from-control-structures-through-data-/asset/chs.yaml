  \n**程序输出**\n\n```\nArrayList<Integer> list = new ArrayList<Integer>();\nlist.add(5);\n\
  int primitiveNumber = list.get(0);\n```\n\n### 10.8 避免常见错误\n\n以下列表描述了学习本章时经常发生的几种错误：\n\
  \n- 将静态方法当作实例方法使用。许多类方法是静态的。\n- 尝试使用 `startsWith` 和 `endsWith` 等 `String` 方法。这些方法是区分大小写的。\n\
  - 认为字符串的起始位置是 1。`end` 位置是不包含在内的。\n\n### 复习题\n\n**单选题与判断题**\n\n> 1. `isDigit`、`isLetter`\
  \ 和 `isLetterDigit` 方法是哪个类的成员？\n> a. String\n> b. Char\n> c. Character\n> d. StringTokenizer\n\
  \n> 2. 哪种方法将字符转换为大写？\n> a. makeUpperCase\n> b. toUpperCase\n> c. isUpperCase\n>\
  \ d. upperCase\n\n> 3. `startsWith`、`endsWith` 和 `regionMatches` 方法是哪个类的成员？\n> a.\
  \ String\n> b. Char\n> c. Character\n> d. StringTokenizer\n\n> 4. `indexOf` 和 `lastIndexOf`\
  \ 方法是哪个类的成员？\n> a. String\n> b. Integer\n> c. Character\n> d. StringTokenizer\n\n\
  > 5. `substring`、`getChars` 和 `toCharArray` 方法是哪个类的成员？\n> a. String\n> b. Float\n\
  > c. Character\n> d. StringTokenizer\n\n> 6. 哪种 `String` 类方法在用于字符串时与 `+` 运算符的操作相同？\n\
