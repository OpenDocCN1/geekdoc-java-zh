  \ `ImageIcon` 类的实例，该类可以读取图像文件的内容。`ImageIcon` 类是 `javax.swing` 包的一部分。构造函数接受一个 `String`\
  \ 类型的参数作为图像文件的名称。支持的文件类型有 JPEG、GIF 和 PNG。名称也可以包含路径信息。这里是一个示例：\n\n```java\nImageIcon\
  \ image = new ImageIcon(\"Smiley.gif\");\n```\n\n该语句创建了一个 `ImageIcon` 对象，该用于读取 `Smiley.gif`\
  \ 文件的内容。由于没有提供路径，假设该文件位于当前目录或文件夹中。这是一个使用路径的示例：\n\n```java\nImageIcon image = new\
