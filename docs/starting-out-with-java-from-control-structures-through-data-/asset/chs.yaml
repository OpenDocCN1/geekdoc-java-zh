  \n从 Java 早期开始，如果已知要存储在数组的内容，Java 就允许在声明数组时对其初始化：\n\n```\nString[] colorNames = {\"\
  PINK\", \"YELLOW\", \"BLUE\", \"RED\"};\nColor[] colors = {Color.PINK, Color.YELLOW,\
  \ Color.BLUE, Color.RED};\n```\n\n这对于程序员来说是一个非常大的便利。Java 的最新版本提供了设施，可以以类似的方式轻松初始化列表。从\
  \ 5 版本开始，`java.util.Arrays` 类有了一个静态泛型方法 `asList`，可以将数组转换为列表。该方法可以通过两种不同的方式调用：通过传递单个数组参数，或者通过传递逗号分隔的项列表。在下面的代码中，两个语句都初始化了相同字符串序列的列表：\n\
  \n```\nString [] numerals = {\"one\", \"two\", \"three\"};\n// 传递单个数组作为参数\nList<String>\
  \ list2 = Arrays.asList(numerals);\n// 传递任意数量逗号分隔的值作为参数\nList<String> list1 = Arrays.asList(\"\
  one\", \"two\", \"three\");\n```\n\n如果你知道将存储在映射中的键值对集合，可以使用一对并行数组和一个循环来初始化映射。例如，假设你想构建映射，将数组\
  \ `colorNames` 提供的颜色名称与第二个数组 `colors` 提供的颜色对象配对。你可以这样初始化映射：\n\n```\nString[] colorNames\
  \ = {\"PINK\", \"YELLOW\", \"BLUE\", \"RED\"};\nColor[] colors = {Color.PINK, Color.YELLOW,\
  \ Color.BLUE, Color.RED};\nMap<String, Color> colorMap = new HashMap<String, Color>();\n\
  for (int k = 0; k < colorNames.length; k++)\n    colorMap.put(colorNames[k], colors[k]);\n\
  ```\n\n* * *\n\n## 18.5 `Collections` 类\n\n> **概念：Collections 类提供了许多静态方法，用于对集合执行算法和实用程序操作**。\n\
