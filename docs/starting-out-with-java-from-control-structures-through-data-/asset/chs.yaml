  ![Image](img/01665.jpg)\n![Image](img/01666.jpg)\n![Image](img/01667.jpg)\n\n##\
  \ 22.3 AVL 树\n\n> **概念：当二叉树保持平衡时，对二叉搜索树的操作效率更高。AVL 树是一种在每个节点上都满足平衡条件的二叉搜索树。**\n\n\
  由于二叉搜索树上的大多数操作都会追踪从根节点到某个节点的路径，因此它们的工作量与路径长度成正比。因此，二叉搜索树应该是“浅”的而不是“深”的。通过对其子树的高度施加限制，可以保持二叉树的浅。。二叉树的\
  \ `height` 是从根节点到叶子节点的最长路径的长度。（路径的长度是路径中边或链接的数量：它比路径中的节点数少一）。只有一个节点的二叉树高度为 0，按照惯例，空二叉树的高度为\
  \ –1。\n\n`AVL 树` 是一种二叉搜索树，其中每个节点的左子树和右子树的高度差不超过 1。图 22-13 展示了 AVL 树的两个示例。\n\n**图\
  \ 22-13** AVL 树的示例\n\n![Image](img/01668.jpg)\n\n图 22-14 中的树未能成为 AVL 树，因为根节点的右子树高度为\
  \ 2，而左子树高度为 0。\n\n**图 22-14** 非 AVL 树的示例\n\n![Image](img/01669.jpg)\n\n### 向 AVL\
  \ 树中添加新元素\n\nAVL 树支持与普通二叉搜索树相同的操作：添加新元素、删除和搜索。要向 AVL 树添加新元素，我们只需使用与向普通二叉搜索树添加元素相同的算法添加新元素即可。然而，添加操作可能会破坏\
  \ AVL 平衡条件，因此我们必须检查这一点并根据需要重新平衡树。我们只需要检查位于新插入节点与根节点之间路径上的节点的平衡条件。\n\n向现有的 AVL 树中添加新节点可能会导致四种类型的不平衡：\n\
  \n- `LL 不平衡` 发生在具有左子节点 `K` 的节点 `N` 上，当 `N` 和 `K` 均向左重时：即 `N` 的左子树的高度大于 `N` 的右子树的高度；且\
  \ `K` 的左子树的高度大于 `K` 的右子树的高度。通过在 `N` 上执行单右旋转（single right rotation）可以修复 LL 不平衡：这在图\
  \ 22-15 中所示。\n- `RR 不平衡` 发生在具有右子节点 `M` 的节点 `N` 上，当 `N` 和 `M` 均向右重时。这种情况是 LL 不平衡的镜像：通过在\
  \ `N` 上执行单左旋转（single left rotation）来修复。\n- `LR 不平衡` 发生在具有左子节点 `K` 的节点 `N` 上，当 `N`\
  \ 向左重且 `K` 向右重时。LR 不平衡通过在 `N` 上执行双 LR 旋转（double LR rotation）来修复。这在图 22-16 中所示。\n\
  - `RL 不平衡` 发生在具有右子节点 `M` 的节点 `N` 上，当 `N` 向右重且 `M` 向左重时。这种情况是 LR 不平衡的镜像，可以通过在 `M`\
  \ 上执行双 RL 旋转（double RL rotation）来修复。\n\n**图 22-15** 在具有 LL 不平衡的节点上执行单右旋转\n\n![Image](img/01670.jpg)\n\
  \n**图 22-16** 在具有 LR 不平衡的节点上执行双 LR 旋转\n\n![Image](img/01671.jpg)\n\n现在考虑移除在 AVL\
  \ 树中添加新节点后发生的 LL 不平衡的通用策略。令 `N` 为具有 LL 不平衡的节点，`K` 为 `N` 的左孩子，`J` 为 `K` 的左孩子。如图 22-17\
  \ 所示，令 `p`、`q`、`r`、`s` 分别代表 `J` 的左子树、`J` 的右子树、`K` 的右子树和 `N` 的右子树。假设 `s` 的高度为 `h`，我们推出\
  \ `N` 的左子树高度为 `h + 2`。我们可以进一步推出 `r` 的高度为 `h`，且 `p` 和 `q` 中的一个高度为 `h`，另一个为 `h - 1`。\n\
  \n**图 22-17** 具有 LL 不平衡的节点\n\n![Image](img/01672.jpg)\n\n通常情况下，这种情况发生在新节点被添加到子树\
  \ `p` 时，我们在向根节点追踪的过程中在 `N` 发现了不平衡。此时，我们通过在 `N` 上执行单右旋转来修复不平衡，即我们重新排列节点和子树之间的父子关系，产生如图\
  \ 22-18 所示的树。\n\n**图 22-18** 单右旋转的效果\n\n![Image](img/01673.jpg)\n\n注意重新排列的树仍然是二叉树，而且满足每个节点的\
  \ AVL 平衡条件。RR 不平衡同样可以采用单左旋转来修复。\n\n现在考虑如何移除节点 `N` 处的 LR 不平衡。任何此类节点 `N` 都会有一个左孩子\
  \ `J`，而 `J` 又有一个右孩子 `K`。令 `p`、`q`、`r`、`s` 分别代表这些节点的左右子树，如图 22-19 所示。假设 `s` 的高度为\
  \ `h`，我们推出以 `J` 为根的树高度为 `h + 2`。我们可以进一步推出 `p` 的高度为 `h`。由于以 `K` 为根的树高度为 `h + 1`，`K`\
  \ 的子树之一（假设为 `q`）高度为 `h`。另一个子树 `r` 必须为 `h - 1`（如果 `r` 的高度小于 `h-1`，则不平衡将出现在 `K` 处而非\
  \ `N` 处）。\n\n**图 22-19** 具有 LR 不平衡的节点\n\n![Image](img/01674.jpg)\n\n图 22-19 所示的\
  \ LR 不平衡通过执行双 LR 旋转来移除，重新排列树为如图 22-20 所示的形式。\n\n\n\n\n\n# 图 22-20 双重 LR 旋转对图 22-19\
  \ 中树的影响\n\n![Image](img/01675.jpg)\n\n重构后的树现在是一棵 AVL 树。同样，可以通过执行双重 RL 旋转消除 RL 不平衡。\n\
  \n## AVL 树的实现\n\nAVL 树的实现与二叉搜索树相似，不同之处在于修改 `add` 和 `remove` 方法以确保树保持平衡。代码列表 22-5\
  \ 显示了一个实现了 `add` 方法的 `AVL` 类。用户可以使用上一节中的符号表示法，通过代码列表 22-6 中实现的图形用户界面（如图 22-21 所示）向\
  \ AVL 树中添加元素。\n\nAVL 树的实现实现使用了两个主要类：表示 AVL 树中节点的 `AVLNode` 类，以及表示 AVL 树对象的 `AVLTree`\
  \ 类。`AVLNode` 有一个 `height` 字段用于帮助跟踪平衡条件，而 `AVLTree` 类有一个静态方法 `getHeight`，用于计算 AVL\
  \ 树的高度。\n\n`add(bTree, x)` 方法是对已讨论策略的直接实现。如果 `bTree` 为空，`add` 将创建并返回一个带有单个节点的 AVL\
  \ 树。否则，该方法递归地将新元素添加到其中一个子树中，重新计算子树的高度，并检查 `bTree` 的平衡条件。如果 `bTree` 超平衡，`add` 将调用其\
  \ `balance` 方法。\n\n`balance` 方法确定传递给它的节点上存在的不平衡类型，并调用四个方法中的一个来执行相应的旋转。执行旋转的方法根据它们修正的不平衡类型命名为\
  \ `llBalance`、`lrBalance`、`rlBalance` 和 `rrBalance`。\n\n### 代码列表 22-5 `(AVLTrees.java)`\n\
