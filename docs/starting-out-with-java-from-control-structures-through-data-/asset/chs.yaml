  * 8.5 从方法返回数组\n* 8.6 `String` 数组\n* 8.7 对象数组\n* 8.8 顺序查找\n* 8.9 二维数组\n* 8.10 多维数数组\n\
  * 8.11 命令行参数与变长列表\n* 8.12 `ArrayList` 类\n* 8.13 需要避免的常见错误：案例研究——`PinTester` 类\n\n\
  ***\n\n## 8.1 数组简介\n\n**概念：数组可以同时存储多个值**。\n\n你为止所使用的原始类型变量设计为一次只存储一个值。然而，数组是一个对象，可以存储一组相同类型的值。在\
  \ Java 中创建和使用数组与创建和使用其他对象相似：你声明一个引用变量并使用 `new` 关键字创建一个实例。这是一个示例：\n\n```\nint[] numbers;\n\
  ```\n\n此语句将 `numbers` 声明为数组引用变量。注意，该语句看起来像普通的 `int` 变量声明，区别在于关键字 `int` 之后出现了一组括号。括号表示该变量是对\
  \ `int` 数组的引用。声明数组引用变量并不会创建数组。该过程的下一步是使用 `new` 关键字创建一个数组并将其地址赋值给 `numbers` 变量。以下语句显示了一个示例：\n\
  \n```\nnumbers = new int[6];\n```\n\n**图 8-1** 变量声明及其内存分配\n\n![Image](img/00517.jpg)\n\
  \n括号内的数字是*大小声明符*。它指示数组可以容纳的元素（或值）的数量。当执行此语句时，`numbers` 将引用一个可以包含六个元素的数组，每个元素都是 `int`。如图\
  \ 8-2 所示。\n\n**图 8-2** `numbers` 数组\n\n![Image](img/00518.jpg)\n\n与其他任何类型的对象一样，可以在一个语句中声明引用变量并创建数组实例。这是一个示例：\n\
  \n```\nint[] numbers = new int[6];\n```\n\n可以声明任何数据类型的数组。以下均都是有效的数组声明：\n\n```\n\
  float[] temperatures = new float[100];\nchar[] letters = new char[41];\nlong[] units\
  \ = new long[50];\ndouble[] sizes = new double[1200];\n```\n\n\n\n数组的大小声明符必须是一个非负整数表达式。它可以是一个字面量值（如前面的示例所示），也可以是一个变量。使用\
  \ `final` 变量作为大小声明符是一种常见的惯做法。以下是一个示例：\n\n```java\nfinal int NUM_ELEMENTS = 6;\n\
  int[] numbers = new int[NUM_ELEMENTS];\n```\n\n这种做法可以使程序更易维护。当我们把数组的大小存储在变量中时，在引用数组大小时，可以使用该变量而不是字面量数字。如果我们需要更改数组的大小，只需要更改变量的值即可。该变量应该是\
  \ `final` 的，这样它的内容在程序执行期间就无法被更改。\n\n![Image](img/00005.jpg)\n\n***\n\n**注意：** 一旦创建了数组，其大小就无法更改。\n\
  \n***\n\n## 访问数组元素\n\n虽然数组只有一个名称，但数组中的元素可以作为单独的变量被访问和使用。这是可能的因为每个元素都被分配了一个被称为下标（subscript）的数字。下标用作索引来定位数组中的特定元素。第一个元素的下标分配为\
  \ 0，第二个元素的下标为 1，以此此类推。`numbers` 数组（前文描述）中的六个元素下标为 0 到 5。这在图 8-3 中所示。\n\n**图 8-3**\
  \ `numbers` 数组的下标\n\n![Image](img/00519.jpg)\n\n下标编号始终从 0 开始。数组最后一个元素的下标比数组中元素的总数少\
  \ 1。这意味着对于具有六个元素的 `numbers` 数组来说，5 是最后一个元素的下标。\n\n`numbers` 数组中的每个元素在通过其下标访问时，都可以作为\
  \ `int` 变量使用。例如，看下面的代码。第一语句将 20 存储在数组的第一个元素（元素 0），第二语句将 30 存储在第四个元素（元素 3）。\n\n```java\n\
  numbers[0] = 20;\nnumbers[3] = 30;\n```\n\n![Image](img/00005.jpg)\n\n***\n\n**注意：**\
  \ 表达式 `numbers[0]` 的读音是“numbers sub zero”。你将这些赋值语句读为“numbers sub zero 被赋值为二十”以及“numbers\
  \ sub three 被赋值为三十”。\n\n***\n\n图 8-4 展示了这些语句执行后数组的内容。\n\n**图 8-4** 将 20 赋值给 `numbers[0]`\
  \ 并将 30 赋值给 `numbers[3]` 后数组的内容\n\n![Image](img/00520.jpg)\n![Image](img/00005.jpg)\n\
  \n***\n\n**注意：** 默认情况下，Java 将数组元素初始化为 0。在图 8-4 中，元素 1、2、4 和 5 没有存储值，因此它们被显示为 0。\n\
  \n***\n\n到此为止，你应该理解了数组大小声明符和下标之间的区别。当你使用 `new` 关键字创建数组对象时，括号内的数字就是大小声明符。它表示数组中元素的数量。在赋值语句或任何处理数组内容的语句中，括号内的数字是下标。它用于访问数组中的特定元素。\n\
  \n## 输入和输出数组内容\n\n你可以从键盘读取值并将其存储在数组元素中，就像处理普通变量一样。你还可以使用 `print` 和 `println` 输出数组元素的内容。代码列表\
  \ 8-1 展示了如何使用数组来存储和显示用户输入的值。图 8-5 展示了 `hours` 数组的内容，包含了示例输出中用户输入的值。\n\n**代码列表 8-1\
  \ (`ArrayDemo1.java`)**\n\n![Image](img/00521.jpg)\n![Image](img/00522.jpg)\n\n\
  **程序输出（示例输入已加粗显示）**\n\n```\n输入 3 名员工的工作小时数。\nEmployee 1: 40 [Enter]\nEmployee 2:\
  \ 20 [Enter]\nEmployee 3: 15 [Enter]\n你输入的小数是:\n40\n20\n15\n```\n\n**图 8-5** `hours`\
  \ 数组的内容\n![Image](img/00523.jpg)\n\n下标数字可以存储在变量中。这使得使用循环“遍历”整个数组成为可能，对每个元素执行相同的操作。例如，代码列表\
  \ 8-1 可以通过两个 `for` 循环进行简化：一个用于向数组输入值，另一个用于显示内容。这在代码列表 8-2 中所示。\n\n***\n\n![Image](img/00009.jpg)\n\
  \n## 在循环中访问数组元素\n\n**代码列表 8-2 (`ArrayDemo2.java`)**\n\n![Image](img/00524.jpg)\n\
  \n**程序输出（加粗示例输入）**\n\n```\n输入 3 名员工的工作小时数。\nEmployee 1: 40 [Enter]\nEmployee 2:\
  \ 20 [Enter]\nEmployee 3: 15 [Enter]\n你输入的小数是:\n40\n20\n15\n```\n\n让我们仔细看第 21 到\
  \ 25 行的第一个循环：\n\n```java\nhours[index] = keyboard.nextInt();\n```\n\n变量 `index`\
  \ 从 0 开始。在循环第一次迭代中，用户的输入被存储在 `hours[0]`。然后 `index` 加 1，其值变为 1。在下一次迭代中，用户的输入被存储在\
  \ `hours[1]`。这种持续持续直到所有元素都存储了值。正如图 8-6 所示，循环正确地开始和结束，使用了了有效的下标。\n\n**图 8-6** 带注释的循环\n\
  ![Image](img/00525.jpg)\n\n## Java 执行边界检查\n\nJava 执行边界检查，这意味着它不允许使用超出数组范围的下标。例如，下面的语句创建了一个具有\
  \ 10 个元素的数组。该数组的有效下标为 0 到 9。\n\n```java\nint[] values = new int[10];\n```\n\nJava\
  \ 不允许使用小于 0 或大于 9 的下标来操作此数组。Java 编译器在处理无效下标时不会显示错误。相反，当该语句执行时，程序会抛出异常并立即终止。例如，代码列表\
  \ 8-3](#dummy_split_015.html_filepos1427364) 程序声明了一个三元素数组，但尝试向数组存储四个值。在 17 行，当程序尝试向\
  \ `values[3]` 存储值时，它会停止并显示错误消息。\n\n**代码列表 8-3 (`InvalidSubscript.java`)**\n\n![Image](img/00526.jpg)\n\
  \n**程序输出**\n\n```\n我将尝试向三元素数组存储四个数字。\n正在处理元素 0\n正在处理元素 1\n正在处理元素 2\n正在处理元素 3\nException\
  \ in thread \"main\"\njava.lang.ArrayIndexOutOfBoundsException: 3\nat InvalidSubscript.main(InvalidSubscript.java:17)\n\
  ```\n\n![Image](img/00005.jpg)\n\n***\n\n**注意：** 根据你的系统，你看到的错误消息可能会有所不同。\n\n***\n\
  \n## 注意差一错误\n\n由于数组下标从 0 开始而不是从 1 开始，你必须小心不要发生差一错误。例如，看下面的代码：\n\n```java\n// 这段代码有一个差一错误。\n\
  final int SIZE = 100;\nint[] numbers = new int[SIZE];\nfor (int index = 1; index\
  \ <= SIZE; index++)\n    numbers[index] = 0;\n```\n\n\n\n这段代码的意图创建一个包含 100 个元素的整数数组，并在每个元素中存储值\
  \ 0。然而，这段代码存在一个差一错误（off-by-one error）。循环使用其控制变量 `index` 作为 `numbers` 数组的下标。在循环执行期间，变量\
  \ `index` 取值范围是 1 到 100，而它本应该取值为 0 到 99。结果导致下标为 0 的第一个元素被跳过了。此外，循环在最后一次迭代中尝试使用 100\
  \ 作为下标。由于 100 是一个无效的下标，程序将抛出异常并停止。\n\n## 数组初始化\n\n与普通变量一样，Java 允许你在创建数组时初始化数组元素。以下是一个示例：\n\
  \n```java\nint[] days = {31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31};\n```\n\
  \n该语句声明了引用变量 `days`，在内存中创建了一个数组，并在数组中存储了初始值。大括号内部用逗号分隔的一系列值被称为初始化列表。这些值按照它们在列表中出现的顺序存储在数组元素中。（第一个值\
  \ 31 存储在 `days[0]` 中，第二个值 28 存储在 `days[1]` 中，以此此类推。）注意，当你使用初始化列表时不需要使用 `new` 关键字。Java\
  \ 会自动创建数组并将初始化列表中的值存储其中。\n\nJava 编译器通过初始化列表中的项数来确定数组的大小。由于示例语句的初始化列表中有 12 项，因此该数组将有\
  \ 12 个元素。程序代码列表 8-4 演示了数组的初始化。\n\n**代码列表 8-4 (`ArrayInitialization.java`)**\n\n\
  ![Image](img/00527.jpg)\n\n**程序输出**\n\n```\nMonth 1 has 31 days.\nMonth 2 has 28\
  \ days.\nMonth 3 has 31 days.\nMonth 4 has 30 days.\nMonth 5 has 31 days.\nMonth\
  \ 6 has 30 days.\nMonth 7 has 31 days.\nMonth 8 has 31 days.\nMonth 9 has 30 days.\n\
  Month 10 has 31 days.\nMonth 11 has 30 days.\nMonth 12 has 31 days.\n```\n\nJava\
  \ 允许你将初始化列表跨多行。以下两个数组声明是等价的：\n\n![Image](img/00528.jpg)\n\n## 替代数组声明符号\n\nJava 允许在声明数组引用变量时使用两种不同的样式。第一种样式是本书使用的，括号紧跟在数据类型之后，所示：\n\
  \n```java\nint[] numbers;\n```\n\n在第二种样式中，括号放在变量名之后，所示：\n\n```java\nint numbers[];\n\
  ```\n\n这两个语句实现完全相同：它们都声明 `numbers` 是一个 `int` 数组的引用。两种样式之间的差异在同一语句中声明多个变量时会被体现。例如，看以下语句：\n\
  \n```java\nint[] numbers, codes, scores;\n```\n\n该语句声明了三个变量：`numbers`、`codes` 和\
  \ `scores`。这三个变量都是 `int` 数组的引用。这是完全合理的，因为 `int[]` 是该语句中声明的所有变量的数据类型。现在看下面使用替代符号的语句：\n\
  \n```java\nint numbers[], codes, scores;\n```\n\n该语句声明了相同的三个变量，但只有 `numbers` 是 `int`\
  \ 数组的引用。`codes` 和 `scores` 变量是普通的 `int` 变量。这是因为 `int` 是该语句中声明的所有变量的数据类型，且只有 `numbers`\
  \ 后面跟着括号。要使用替代符号将这三个变量都声明为 `int` 数组的引用，你需要在每个变量名后写一组括号。以下是一个示例：\n\n```java\nint\
  \ numbers[], codes[], scores[];\n```\n\n第一种样式是大多数 Java 程序员的标准符号，因此这是本书所使用的样式。\n\n\
