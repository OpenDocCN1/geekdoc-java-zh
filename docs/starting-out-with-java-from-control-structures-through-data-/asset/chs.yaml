  `Katherine`\n`Kenny`\n`Kenny`\n`Katherine`\n`David`\n`Chris`\n\n#### 增强型 for 循环\n\
  \n回顾第 8 章 提到的，Java 提供了一种增强型 `for` 循环，它简化了遍历集合中元素的过程。例如，以下代码可以遍历 `ArrayList` 的每个元素：\n\
  \n```\n  for (String element : nameList)\n      System.out.println(element);\n```\n\
  \n#### 使用迭代器修改列表\n\n迭代器提供了三种修改列表的方法：`remove`、`add` 和 `set`。这里是每个方法的总结：\n\n- `remove`\
  \ 方法（在 `Iterator` 接口中定义）移除 `next` 方法返回的元素。\n- `add` 方法在列表中添加一个新元素。新元素将位于 `next`\
  \ 方法返回的元素之前。\n- `set` 方法替换 `next` 方法返回的元素。代码列表 18-4 中的程序演示了如何使用 `add` 方法插入元素。在这个程序中，字符串\
  \ `\"Darlene\"` 被插入到 `\"Chris\"` 之后。\n\n### 代码列表 18-4 (`ListIteratorDemo3.java`)\n\
  \n![Image](img/01351.jpg)\n![Image](img/01352.jpg)\n![Image](img/01353.jpg)\n\n\
  #### 程序输出\n\n`Here are the original names.`\n`Chris`\n`David`\n`Katherine`\n`Kenny`\n\
  `Here are the names now.`\n`Chris`\n`Darlene`\n`David`\n`Katherine`\n\n### 代码列表\
  \ 18-5 (`ListIteratorDemo4.java`)\n\n![Image](img/01354.jpg)\n![Image](img/01355.jpg)\n\
  ![Image](img/01356.jpg)\n\n#### 程序输出\n\n`Here are the original names.`\n`Chris`\n\
  `David`\n`Katherine`\n`Kenny`\n`Here are the names now.`\n`Alfonso`\n`David`\n`Katherine`\n\
  \n\n\n\n\n然而，同步付出的代价是性能。同步需要执行额外的操作，因此 `Vector` 类通常比 `ArrayList` 类慢。如果你没有开发多线程应用程序，请选择\
  \ `ArrayList` 类而不是 `Vector` 类。然而，如果你正在开发多线程应用程序，并且想确保没有线程会并发访问列表中的元素，请使用 `Vector`\
  \ 类。\n\n`Vector` 类实现了 `List` 接口，`ArrayList` 类中存在的所有方法在 `Vector` 类中也存在。\n\n![Image](img/00005.jpg)\n\
  \n***\n\n**注意：** `Vector` 类长期以来一直是 Java 的一部分，甚至在 JCF 出现之前就是。旧的预 JCF 版本的 `Vector`\
  \ 类使用的方法与 `List` 接口指定的方法的操作相同，但名称不同。如今，`Vector` 类既包含了 `List` 接口指定的方法，也包含了旧方法。出于兼容性考虑，该类中保留了这些旧方法。\n\
  \n***\n\n### `LinkedList` 类\n\n与 `ArrayList` 和 `Vector` 类不同，`LinkedList` 类并不使用数组存储其数据。相反，它使用链表。*链表*是一种由一系列连接的节点组成的数据结构。链表中的每个节点包含一个数据项（列表中的一个元素）和一个指向列表中下一个节点的引用。图\
  \ 18-10 显示了链表是如何组织的。图中的列表有三个节点。注意列表中的最后一个节点包含一个空引用（null）。这标志着列表的结束。\n\n**图 18-10**\
  \ 链表的结构\n\n![Image](img/01357.jpg)\n\n链表相比数组具有一些优势。首先，如果数组满了，你想在末尾添加一个额外的元素，你必须创建一个更大的数组，并将元素从旧数组复制到新数组。然后你就可以向新数组的末尾添加数据。这对于链表来说是没有必要的，因为链表没有固定的大小。当向链表末尾添加新节点时，只需在内存中创建该节点，然后让列表的最后一个节点引用它。这就将新节点添加到列表末尾。\n\
  \n此外，在链表的中间插入节点比在数组中间插入元素要高效得多。当元素插入到数组中间时，插入点之后的所有元素都必须向数组末尾移动以为新元素留位置。例如，假设我们有一个包含\
  \ 500 个对象的数组，想在索引 50 处插入一个新对象。从索引 50 到 499 的所有现有元素都必须复制到下一个位置，以便将新对象插入到索引 50。为了进一步减慢速度，如果在插入时数组已满，必须先创建一个新数组，然后将每个旧元素复制到其中。这些对于链表来说都是没有必要的。当在链表的中间插入新节点时，只有几个引用发生了变化。图\
  \ 18-11 展示了如何在链表的第二个和第三个节点之间插入一个新节点。\n\n正如你想象的那样，从数组中间删除元素也是低效的。被删除元素之后的所有元素都必须向数组前端移动以占据空间。在链表的中间删除节点只是调整几个引用的简单问题。\n\
  \n**图 18-11** 插入链表的新节点\n\n![Image](img/01358.jpg)\n\n![Image](img/00005.jpg)\n\n\
  ***\n\n**注意：** `LinkedList` 类内部维护的链表比图 18-10 和 18-11 显示的稍微复杂。`LinkedList` 类维护一个双向链表，其中列表中的每个节点同时引用上一个节点和下一个节点。\n\
  \n***\n\n由于在插入和删除节点时的效率，当你的应用程序需要在列表中存储大量数据，并且可能发生大量的插入/或删除时，`LinkedList` 类是一个很好的选择。\n\
  \n如果你回看图 18-1，你会发现 `LinkedList` 类继承自 `AbstractSequentialList` 类。与数组不同，链表对其元素提供顺序访问。例如，你不能像在数组中那样随机地从一个索引跳转到另一个索引。`AbstractList`\
  \ 类中的某些方法的实现方式最适合数组这样的随机访问结构。因此，`AbstractSequentialList` 类提供了 `List` 方法的备选实现，适用于像链表这样的顺序访问结构。\n\
