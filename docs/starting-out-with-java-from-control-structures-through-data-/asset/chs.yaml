  \n#### 包访问权限 (Package Access)\n\n如果你不为类成员提供访问修饰符，该类成员默认获得包访问权限。这意味着同一包中的任何方法都可以访问该成员。以下是一个示例：\n\
  \n![Image](img/00843.jpg)\n\n在此类中，`radius`、`centerX` 和 `centerY` 字段没有提供访问修饰符，因此编译器授予它们包访问权限。与\
  \ `Circle` 类位于同一包中的任何方法都可以直接访问这些成员。\n\n保护访问（protected）和包访问之间存在细微的区别。保护成员可以被同一包中的方法或子类中的方法访问。即使子类位于不同的包中也是如此。然而，具有包访问权限的成员无法被不同包中的子类访问。\n\
  \n你无意中给类成员赋予包访问权限的可能性比有意设计为这样要大，因为很容易忘记访问修饰符。虽然在某些情况下包访问可能有所帮助，但你通常应该避免它。务必始终为类成员指定访问修饰符。\n\
