  numbers = new int[5];\n```\n\n第一个语句创建一个十元素的数组并将其赋值给 `numbers` 变量。这在图 8-7 中所示。\n\n\
  **图 8-7** `numbers` 变量引用一个十元素的数组\n\n![Image](img/00533.jpg)\n\n第二个语句分配五个元素的整数数组并将其赋值给\
  \ `numbers` 变量。五个元素的数组地址取代了十元素的数组地址。在执行此语句后，`numbers` 变量引用五元素的数组，而不是十元素的数组。这在图 8-8\
  \ 中所示。\n\n**图 8-8** `numbers` 变量引用一个五元素的数组\n\n![Image](img/00534.jpg)\n\n## 复制数组\n\
  \n由于数组是一个对象，因此数组与引用它的变量之间存在区别。数组和引用变量是两个独立的实体。当你想要将一个数组的内容复制到另一个数组时，记住这一点很重要。你可能会想写类似如下的代码，认为你正在复制数组：\n\
  \n```\n  int[] array1 = { 2, 4, 6, 8, 10 };\n  int[] array2 = array1; // 这并没有复制\
  \ array1。\n```\n\n\n\n\n第一条语句创建一个数组并将其地址赋值给变量 `array1`。第二条语句将 `array1` 赋值给 `array2`。这并没有为\
  \ `array1` 引用的数组创建副本，而是将存储在 `array1` 中的地址进行复制，并将其存储在 `array2` 中。执行此条语句后，`array1`\
  \ 和 `array2` 变量都将引用同一个数组。这种赋值操作被称为`引用拷贝`（reference copy）。它复制的是数组对象的地址，而不是数组对象的内容。这在图\
  \ 8-9 中所示。\n\n**图 8-9** `array1` 和 `array2` 引用同一个数组\n\n![Image](img/00535.jpg)\n\
  \n代码列表 8-7 展示了将数组的地址赋值给两个引用变量。无论程序使用哪一个变量，操作的都是同一个数组。\n\n**代码列表 8-7 (`SameArray.java`)**\n\
  \n![Image](img/00536.jpg)\n\n**`程序输出`**\n\n`array1 的内容:`\n\n`200 4 6 8 1000`\n\n\
  `array2 的内容:`\n\n`200 4 6 8 1000`\n\n代码列表 8-7 中的程序说明了，你不能仅仅通过将一个数组引用变量赋值给另一个来复制数组。相反，要复制数组，你需要将一个数组的各个元素复制到另一个数组中。通常，使用循环是最好的方法，如下所示：\n\
  \n```java\nint[] firstArray = { 5, 10, 15, 20, 25 };\nint[] secondArray = new int[5];\n\
  for (int index = 0; index < firstArray.length; index++)\n    secondArray[index]\
  \ = firstArray[index];\n```\n\n此代码中的循环将 `firstArray` 的每个元素复制到 `secondArray` 对应的元素中。\n\
