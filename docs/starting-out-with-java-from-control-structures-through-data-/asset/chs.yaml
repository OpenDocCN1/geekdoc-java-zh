  \ 和 `middleName`。其次，注意该类没有程序员定义的构造函数。当创建该类的实例时，`lastName`、`firstName` 和 `middleName`\
  \ 字段将由默认构造函数初始化为 `null`。第三，注意 `getLength` 方法在第 51 行和 52 行使用了 `lastName`、`firstName`\
  \ 和 `middleName` 变量来调用 `String` 类的 `length` 方法。没有任何机制阻止在这些任何一个或所有引用变量被设置为 `null`\
  \ 时调用 `length` 方法。代码列表 9-17 中的程序演示了这一点。\n\n**代码列表 9-17 (`NameTester.java`)**\n\n\
