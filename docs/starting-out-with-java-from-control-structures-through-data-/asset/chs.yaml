  \n## 11.3 重写父类方法\n\n> **概念：子类可以拥有一个与父类方法签名相同的方法。在这种情况下，子类方法重写了父类方法。**\n\n有时子类从其父类继承一个方法，但该方法对于子类的目的并不充分。由于子类比父类更专门，有时子类需要用更合适的方法替换不充分的父类方法。这被称为方法重写。\n\
  \n例如，回想本章稍后介绍的 `GradedActivity` 类。该类有一个 `setScore` 方法用于设置数值分数，以及一个 `getGrade` 方法用于根据分数返回字母等级。但是，假设一个老师想在确定字母等级之前对数值分数进行调整（曲线）。例如，哈森博士确定，为了调整数值分数，她必须将每个学生的分数乘以某个百分比。为了满足这一需求，我们可以设计一个新类\
  \ `CurvedActivity`，它继承自 `GradedActivity`。`CurvedActivity` 的 `setScore` 方法重写了 `GradedActivity`\
  \ 的 `setScore` 方法。\n\n**图 11-11** `Rectangle` 和 `Cube` 类\n\n![Image](img/00821.jpg)\n\
