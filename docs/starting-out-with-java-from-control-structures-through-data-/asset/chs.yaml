  ### 使用快速排序对对象\n\n与本章中所示的其他排序算法一样，我们演示的快速排序方法可以修改为接受一个 `Comparable` 对象的数组，然后我们可以使用\
  \ `compareTo` 方法进行比较。修改这些快速排序方法以接受 `Comparable` 对象的数组将作为本章末尾留给你们的一项编程练习。\n\n####\
  \ ![Image](img/00004.jpg) **检查点**\n\n> 16.1 在我们讨论的排序算法中，哪一个算法会对数组进行多次遍历，并导致较大的值在每次遍历中逐渐向数组的末尾移动？\n\
  \n> 16.2 我们讨论的排序算法之一工作原理如下：它首先将由前两个元素组成的数组初始部分按顺序排列。然后将第三个元素移动到其相对于前两个元素的正确位置。此时，前三个元素已经处于排序状态。这个过程对第四个及随后的元素继续进行，直到整个数组都排序完成。这是哪种算法？\n\
  \n> 16.3 我们讨论的排序算法之一工作原理如下：找到数组中最小的值并将其移动到元素 0。然后找到下一个较小的值并移动到元素 1。这个过程一直持续，直到所有元素都按照正确的顺序就位。这是哪种算法？\n\
  \n> 16.4 我们讨论的算法之一将数组分为两个子列表，其之间有一个枢值值。它安排子列表，使得所有小于枢值的值都存储在左侧子列表中，所有大于枢值的值都存储在右侧子列表中。该算法以相同的方式递归地排序子列表。当所有的递归调用完成后，数组就被完全排序了。这是哪种算法？\n\
  \n### 16.2 搜索算法简介\n\n> **概念：搜索算法是在较大的数据集中定位特定项目的方法。本节将讨论两种用于搜索数组内容的算法。**\n\n程序不仅存储和处理存储在数组中的数据，在数组中搜索特定项目也是非常常见的。本节将向你展示两种搜索数组的方法：顺序搜索和二分查找。它们各有各自的优缺点。\n\
  \n#### 顺序搜索算法\n\n`sequential search algorithm` 使用循环按顺序遍历数组，从第一个元素开始。它将每个元素与与要搜索的值进行比较，并在找到该值或遇到数组末尾时停止。如果搜索的值不在数组中，算法将搜索到数组末尾并返回失败。\n\
  \n这里是执行顺序搜索的方法的伪代码：\n\n```\nSet found to false.\n  Set position to -1.\n  Set index\
  \ to 0.\n  While found is false and index < number of elements\n     If list[index]\
  \ is equal to search value\n         found = true.\n         position = index.\n\
  \     End If\n     Add 1 to index.\n  End While\n  Return position.\n```\n\n该伪代码方法返回持有该值的元素的下标。但是，如果没有找到该值，它将返回\
  \ -1。未找到值时返回 -1 的原因是 -1 并不是数组下标，它不会被误认为是数组中的某个位置。\n\n代码列表 16-12 中的 `IntSequentialSearcher`\
  \ 类有一个公共静态方法，用于对 `int` 数组执行顺序搜索。代码列表 16-13 中的程序测试了该方法。\n\n**代码列表 16-12 `(IntSequentialSearcher.java)`**\n\
  \n![Image](img/01248.jpg)\n\n![Image](img/01249.jpg)\n\n**代码列表 16-13 `(SequentialSearchTest.java)`**\n\
  \n![Image](img/01250.jpg)\n\n![Image](img/01251.jpg)\n\n* * *\n\n**程序输出**\n\n`You\
  \ earned 100 on test 4`\n\n* * *\n\n#### 顺序搜索的平均情况分析\n\n顺序搜索的优点在于其简单。它非常容易理解和实现。顺序搜索非常灵活，可以用于任何数组。但这种灵活性是有代价的：如果被搜索的数组包含\
  \ 20,000 个元素，算法可能需要查看所有的 20,000 个元素。这可能会发生，例如当搜索的值不在数组中，或者它在数组的最后一个条目中找到。\n\n\n\n\
  \n在平均情况下，一个元素在数组开头附近找到的概率与在末尾附近是相同的。通常，对于一个包含 `n` 个元素的数组，顺序搜索需要在 `n/2` 次尝试中定位一个元素。如果数组有\
  \ 50,000 个元素，在典型情况下，顺序搜索将对其中 25,000 个元素进行比较。这当然是假设被搜索的元素在数组中任何位置被找到的概率是相等的。（`n/2`\
  \ 是平均比较次数。最大比较次数始终为 `n`。）\n\n## 二分查找\n\n`binary search`（二分查找）是一种非常聪明的算法，其效率比顺序搜索高得多。它的唯一要求是数组中的值必须按照某种顺序排序。让我们假设输入数组是升序排列的。该算法不再测试数组的第一个元素，而是从中间元素开始。如果该元素恰好包含所需的值，则搜索结束。否则，中间元素的值要么大于要么小于正在搜索的值。如果它大于搜索值，那么所需的值（如果存在列表中）将在数组的前半部分找到。如果它小于搜索值，所需的值（同样，如果在列表中）将在数组的后半部分找到。在任何情况下，数组的一半元素都被排除在进一步搜索之外。\n\
  \n如果在中间元素中没有找到所需的值，则对可能包含该值的数组部分重复该过程。例如，如果要搜索数组的后半部分，算法将测试其中间元素。如果在那里没有找到所需的值，搜索范围将缩小到该元素之前或之后的四分之一区域。这个过程持续持续，直到找到正在搜索的值，或者没有更多元素可以测试。以下是一个在数组上执行二分查找的方法的伪代码：\n\
  \n```\n![Image](img/01252.jpg)\n```\n\n该算法使用三个变量来标记数组中的位置：`first`、`last` 和 `middle`。`first`\
  \ 和 `last` 变量标记了当前正在搜索的数组边界。它们用数组的 `first` 和 `last` 元素的下标初始化。`first` 和 `last` 正中间元素的下标被计算并存储在\
  \ `middle` 变量中。如果数组中间的元素不包含搜索值，则会调整 `first` 或 `last` 变量，以便在下一次迭代中只搜索数组的上半或下半部分。每当循环未能定位搜索值时，被搜索的数组部分就会减半。\n\
  \n代码列表 16-14 所示的 `IntBinarySearcher` 类有一个公共静态方法会对整数数组执行二分查找。第一个参数 `array` 用于搜索存储在\
  \ `value` 中的数字。如果找到了该数字，返回其数组下标。否则，返回 -1，表示该值未出现在数组中。代码列表 16-15 中的程序测试了该方法。\n\n\
