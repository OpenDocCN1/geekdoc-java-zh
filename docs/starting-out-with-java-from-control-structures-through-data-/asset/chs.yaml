  \ Action 监听器处理事件\n\n*事件*（event）是程序内部发生的一种动作，例如点击按钮。当事件发生时，负责该事件的组件会在内存中创建一个事件对象。*事件对象*（event\
  \ object）包含有关事件的信息。生成事件对象的组件被称为*事件源*（event source）。例如，当用户点击按钮时，`JButton` 组件会生成一个事件对象。生成事件对象的\
  \ `JButton` 组件就是事件源。\n\n***\n\n![Image](img/00009.jpg)\n\n### 处理事件\n\n***\n\n但是事件对象一旦由源组件生成后会发生什么呢？源组件可能连接到一个或多个事件监听器。*事件监听器*（event\
  \ listener）是一个对事件做出响应的对象。如果源组件连接到事件监听器，则事件对象将自动作为参数传递给事件监听器中的特定方法。该方法随后会执行其被编写为响应事件而执行的任何动作。这个过程有时被称为*事件触发*（event\
  \ firing）。\n\n当你编写 GUI 应用程序时，你有责任为应用程序所需的事件监听器编写类。例如，如果你编写了一个带有 `JButton` 组件的应用程序，每当用户点击按钮时，就会生成一个事件。因此，你应该编写一个可以处理该事件的事件监听器类。在你的应用程序中，你会创建一个事件监听器类的实例，并将其连接到\
  \ `JButton` 组件。在查看具体示例之前，我们必须讨论编写事件监听器时出现的两个重要主题：私有内部类和接口。\n\n#### 作为私有内部类编写事件监听器类\n\
  \nJava 允许你在另一个类定义内部编写类定义。在另一个类内部定义的类被称为*内部类*（inner class）。图 7-7 展示了另一个类定义内部的类定义。\n\
  \n**图 7-7** 带有内部类的类\n\n![Image](img/00403.jpg)\n\n当内部类是私有的时（如图所示），它只对包含它的类中的代码可访问。例如，图中所示的\
  \ `Inner` 类将只对 `Outer` 类可见。\n\n#### 事件监听器必须实现接口\n\n事件监听器类有一个特殊的要求需要满足：它们必须*实现接口*（implement\
  \ an interface）。目前，你可以将接口想象成类似类，包含一个或多个方法。然而，接口没有实际的方法，只有方法头。。当你编写一个实现接口的类时，你同意该类将拥有接口中指定的所有方法。\n\
  \nJava 提供了许多可以与监听器类配合接口。GUI 应用程序中可能会发生不同类型的事件，你使用的特定接口取决于你想处理的事件类型。`JButton` 组件产生*动作事件*（action\
  \ events），能够处理动作事件的监听器类也称为*动作监听器*（action listener）类。当你为 `JButton` 组件编写动作监听器时，它必须实现一个名为\
  \ `ActionListener` 的接口。在第 11 章之前，我们不会讨论如何编写接口，但如果你好奇，这是 `ActionListener` 接口的代码所示：\n\
  \n```\npublic interface ActionListener {\n    public void actionPerformed(ActionEvent\
  \ e);\n}\n```\n\n如你所见，`ActionListener` 接口仅包含一个方法的头部：`actionPerformed`。注意该方法具有 `public`\
  \ 访问权限，返回类型为 `void`，并且有一个 `ActionEvent` 类型的参数。当你编写实现此接口的类时，它*必须*有一个名为 `actionPerformed`\
  \ 的方法，其头部与接口中的完全一致。\n\n![Image](img/00005.jpg)\n\n***\n\n**注意：** `ActionListener`\
  \ 接口以及其他事件监听器接口位于 `java.awt.event` 包。为了使用这些接口，我们将使用以下 `import` 语句：\n\n```\nimport\
  \ java.awt.event.*;\n```\n\n***\n\n你在类头中使用 `implements` 关键字来表示它实现了一个接口。这里是一个名为 `MyButtonListener`\
  \ 的实现 `ActionListener` 接口类的示例：\n\n```\nprivate class MyButtonListener implements\
  \ ActionListener {\n    public void actionPerformed(ActionEvent e) {\n        //\
  \ 在此处编写代码处理事件。\n    }\n}\n```\n\n\n\n\n记住，当你编写一个实现接口的类时，你是在“承诺”该类将拥有接口中指定的方法。请注意，这个类履行了它的承诺。它有一个名为\
  \ `actionPerformed` 的方法，其方法头部与 `ActionListener` 接口中的 `actionPerformed` 头部完全匹配。\n\
  \n![Image](img/00005.jpg)\n\n***\n\n**注意：** 在你的动作监听器类中，`actionPerformed` 方法头部中唯一不需要与\
  \ `ActionListener` 接口中显示的内容完全匹配的部分是参数变量名。你不需要使用 `e` 作为名称，而是可以使用你希望的任何合法的变量名。\n\n\
  ***\n\n### 注册事件监听器对象\n\n一旦你写好了事件监听器类，就可以创建该类的对象，然后将该对象与 GUI 组件连接起来。将事件监听器对象连接到 GUI\
  \ 组件的过程被称为*注册*（registering）事件监听器。\n\n当 `JButton` 组件产生事件时，它会自动执行已注册到该组件的事件监听器对象的\
  \ `actionPerformed` 方法，并将事件对象作为参数传递。这在图 7-8 中有所说明。\n\n**图 7-8** 触发动作事件的 `JButton`\
  \ 组件\n\n![Image](img/00404.jpg)\n\n### 为 `KiloConverterWindow` 类编写事件监听器\n\n既然我们已经回顾了事件监听器的基础知识，让我们继续开发\
