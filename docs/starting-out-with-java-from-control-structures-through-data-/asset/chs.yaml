  \ 5，程序应该显示以下内容：\n\n```\nXXXXX\nXXXXX\nXXXXX\nXXXXX\nXXXXX\n```\n\n如果用户输入 8，程序应该显示以下内容：\n\
  \n```\nXXXXXXXX\nXXXXXXXX\nXXXXXXXX\nXXXXXXXX\nXXXXXXXX\nXXXXXXXX\nXXXXXXXX\nXXXXXXXX\n\
  ```\n\n***\n\n# 第 5 章：方法\n\n### 目录\n* 5.1 方法引论\n* 5.2 向方法传递参数\n* 5.3 关于局部变量的更多信息\n\
  * 5.4 从方法返回返回值\n* 5.5 使用方法解决问题\n* 5.6 需要避免的常见错误\n\n***\n\n### 5.1 方法引论\n> **概念：方法可以用于将复杂的程序拆分成较小、易于管理的部分。`void`\
  \ 方法简单地执行一组语句然后终止。返回值的方法则向调用它的语句返回一个值。**\n\n从广义上说，方法是执行特定任务的语句集合。到目前为止，你已经通过两种方式体验了方法：(1)\
  \ 你在编写的每个程序中创建了一个名为 `main` 的方法，(2) 你执行了 Java API 中的预定义方法，例如 `System.out.println`、`Integer.parseInt`\
  \ 和 `Math.pow`。在本章中，你将学习如何创建除 `main` 以外自定义的方法，这些方法可以像执行 API 方法一样被执行。\n\n方法通常用于将问题拆分成小且易于管理的部分。与其编写一个包含解决问题所需所有语句的长方法，不如编写几个小方法，每个小方法解决问题的一个特定部分。然后可以按照所需的顺序执行这些小方法来解决问题。这种方法有时被称为*分而治之*，因为一个大问题被分成若干个容易解决的小问题。图\
  \ 5-1 通过比较两个程序展示了这一思想：一个程序使用包含解决问题所需所有语句的长且复杂的方法，另一个则将问题分成更小的问题，每个小问题由一个单独的方法处理。\n\
  \n**图 5-1** 使用方法分而治之解决问题\n\n![Image](img/00269.jpg)\n\n编写方法的另一个原因是它们可以简化程序。如果某个特定任务在程序的多个地方执行，则可以只写一次方法来执行该任务，然后在需要任何时候执行它。使用方法的这种处被称为*代码复用*，因为你只需要编写一次执行该任务的代码，然后在每次需要执行该任务时都复用它。\n\
  \n首先，我们将看看方法运行的一般方式。在章节结束处，我们将更详细地讨论如何使用方法解决问题。\n\n#### `void` 方法和返回值的方法\n在本章中，你将学习两类通用方法：`void`\
  \ 方法和返回值的方法。`void` 方法是简单执行任务然后终止的方法。`System.out.println` 就是一个 `void` 方法的示例。例如，看下面的代码：\n\
  \n![Image](img/00270.jpg)\n\n第 1 行语句声明了 `number` 变量并将其初始化为 7。第 2 行语句调用了 `System.out.println`\
  \ 方法，并将 `number` 作为参数传递。该方法执行其工作（在屏幕上显示值），然后终止。代码在第 3 行继续。\n\n返回值的方法不仅执行任务，还会向调用它的代码返回一个值。`Integer.parseInt`\
  \ 方法是返回值的方法的示例。例如，看下面的代码：\n\n![Image](img/00271.jpg)\n\n第 1 行语句声明了 `number` 变量。第\
  \ 2 行语句创建一个值为 `\"700\"` 的 `String` 对象并将其赋值给 `str` 变量。第 3 行语句是一个赋值语句，调用了 `Integer.parseInt`\
  \ 方法并将 `str` 作为参数。该方法执行并向该行返回一个值。\n\n方法返回的值赋值给 `number` 变量。正如此代码所示，返回值的方法向调用语句返回值。调用语句通常会对该值进行某些操作，例如赋值给变量。下面的代码展示了另一个在数学运算中使用\
  \ `Integer.parseInt` 方法返回值的示例：\n\n![Image](img/00272.jpg)\n\n此代码中的第 3 行将 `parseInt`\
  \ 方法的返回值乘以 2，并将结果赋值给 `number` 变量。在代码执行后，`number` 将赋值为 14。\n\n#### 定义 `void` 方法\n\
  要创建一个方法，必须编写它的*定义*，它由两个通用部分组成：头部和体。你在第 2 章 中学习过这两者，但让我们简单回顾一下。*方法头部*出现在方法定义的开头，列出了关于方法的若干信息，包括方法的名称。*方法体*是执行方法时执行的语句集合。这些语句封装在一对括号内。图\
  \ 5-2 指出了 `main` 方法的头部和体。\n\n**图 5-2** `main` 方法的头部和体\n\n![Image](img/00273.jpg)\n\
  \n正如你所知，每个完整的 Java 程序必须有一个 `main` 方法。Java 程序也可以有其他方法。这是一个在屏幕上显示消息的简单方法示例：\n\n```\n\
  public static void displayMessage()\n{\n   System.out.println(\"Hello from the displayMessage\
  \ method.\");\n}\n```\n\n该方法有一个头部和一个体。图 5-3 显示了方法头部的不同部分。\n\n**图 5-3** 方法头部的部分\n\
  \n![Image](img/00274.jpg)\n\n让我们仔细观察图中识别出的部分如下：\n\n\n\n\n\n- **方法修饰符**——关键字 `public`\
  \ 和 `static` 是修饰符。你现在不需要太担心这些修饰符，但如果你的好奇心开始作祟，这里有一个简短的解释：`public` 意味着该方法对类外部的代码是公开的。`static`\
  \ 意味着该方法属于类，而不是某个特定的对象。你将在后面的章节中学习更多关于这些修饰符的知识。在本章中，我们写的每个方法都以 `public` `static`\
  \ 开头。\n\n- **返回类型**——回想我们之前对 `void` 和返回值的方法的讨论。当关键字 `void` 出现在这里时，意味着该方法是一个 `void`\
  \ 方法，并且不返回任何值。正如你稍后看到的，返回值的方法会在此处列出一个数据类型。\n\n- **方法名**——你应该为每个方法起一个描述性的名称。通常，适用于变量名的相同规则也适用于方法名。此方法命名为\
  \ `displayMessage`，因此我们可以很容易猜出该方法的作用：它显示一条消息。\n\n- **括号**——在头部部，方法名后面总是跟着一组括号。正如你在本章稍后将学到的，方法能够接收参数。在这种情况下，括号内部将一个一个或多个变量声明的列表。示例中的方法不接收任何参数，所以括号是空的。\n\
  \n![Image](img/00005.jpg)\n\n**注意：** 方法头部从不以分号结束。\n\n### 调用方法\n\n方法在被调用时会执行。`main`\
  \ 方法在程序启动时会被自动调用，但其他方法是通过方法调用语句来执行的。当一个方法被调用时，JVM 会跳转到该方法并执行其体内的语句。这里是一个方法调用语句的示例，它调用了我们之前检查过的\
  \ `displayMessage` 方法：\n\n```\n    displayMessage();\n```\n\n该语句只是方法名后跟着一组括号。因为它是一条完整的语句，所以以分号结束。\n\
  \n![Image](img/00006.jpg)\n\n**提示：** 注意，方法修饰符和 `void` 返回类型没有写在方法调用语句中。它们只写在方法头部。\n\
  \n代码列表 5-1 中的程序演示了这一点。\n\n**代码列表 5-1 (`SimpleMethod.java`)**\n\n![Image](img/00275.jpg)\n\
  \n**程序输出**\n\n`Hello from the main method.`\n`Hello from the displayMessage method.`\n\
  `Back in the main method.`\n\n注意程序的流转情况。它当然从 `main` 方法开始。当遇到第 10 行对 `displayMessage`\
  \ 方法的调用时，JVM 会跳转到该方法并执行其体内的语句（第 20 行）。一旦 `displayMessage` 方法执行完毕，JVM 将跳转回 `main`\
  \ 方法，并在第 11 行继续执行方法调用之后的后续语句。这在图 5-4 中有所说明。\n\n**图 5-4** `SimpleMethod.java` 程序中的分支\n\
  \n![Image](img/00276.jpg)\n\n方法调用语句可以用于控制结构，如循环、`if` 语句和 `switch` 语句。代码列表 5-2 中的程序将\
  \ `displayMessage` 方法调用放在循环内部。\n\n**代码列表 5-2 (`LoopCall.java`)**\n\n![Image](img/00277.jpg)\n\
  \n**程序输出**\n\n`Hello from the main method.`\n`Hello from the displayMessage method.`\n\
  `Hello from the displayMessage method.`\n`Hello from the displayMessage method.`\n\
  `Hello from the displayMessage method.`\n`Hello from the displayMessage method.`\n\
  `Back in the main method.`\n\n代码列表 5-3 中的程序展示了另一个示例。它要求用户输入年薪和信用评级。程序判断用户是否符合信用卡的条件。调用两个\
  \ `void` 方法（`qualify` 或 `noQualify`）之一来显示消息。图 5-5 和 5-6 显示了与程序交互的示例。\n\n**代码列表 5-3\
  \ (`CreditCard.java`)**\n\n![Image](img/00278.jpg)\n![Image](img/00279.jpg)\n![Image](img/00280.jpg)\n\
  \n**图 5-5** 与 `CreditCard.java` 程序的交互\n\n![Image](img/00281.jpg)\n\n**图 5-6** 与\
  \ `CreditCard.java` 程序的交互\n\n![Image](img/00282.jpg)\n\n### 分级方法调用\n\n方法也可以以分级或分层的方式调用。换句话说，方法\
  \ A 可以调用方法 B，方法 B 然后调用方法 C。当方法 C 完成时，JVM 返回到方法 B。当方法 B 完成时，JVM 返回到方法 A。代码列表 5-4\
  \ 中的程序通过三个方法演示了这一点：`main`、`deep` 和 `deeper`。`main` 方法调用 `deep`，然后 `deep` 调用 `deeper`。\n\
