  \n### 使用 Math 类\n\nJava API 提供了一个名为 `Math` 的类，包含了许多用于复杂操作的方法。在本节中，我们将简要查看 `pow`\
  \ 和 `sqrt` 方法。\n\n#### Math.pow 方法\n\n在 Java 中，计算数字的幂需要 `pow` 方法。这里是使用 `pow` 方法的示例：\n\
  \n```\nresult = Math.pow(4.0, 2);\n```\n\n该方法接受两个 `double` 参数。它将第一个参数的第二个参数次方幂，并返回\
  \ `double` 类型的结果。在这个例子中，4.0 的 2 次幂。该语句等同于以下代数表达式：\n\n*result = 4²*\n\n这是另一个使用 `pow`\
  \ 方法的语句。它将 3 乘以 6³赋值给 `x`：\n\n```\nx = 3 * Math.pow(6.0, 3);\n```\n\n下面的语句显示 5 的\
  \ 4 次幂：\n\n```\nSystem.out.println(Math.pow(5.0, 4));\n```\n\n#### Math.sqrt 方法\n\
  \n`sqrt` 方法接受一个 `double` 值作为参数，并返回该值的平方根。这里是该方法的示例：\n\n```\nresult = Math.sqrt(9.0);\n\
  ```\n\n在这个例子中，9.0 作为参数传递给 `sqrt` 方法。该方法将返回 9.0 的平方根，并赋值给 `result` 变量。以下语句显示另一个例子。在该语句中，25.0\
  \ 的平方根（即 5.0）被显示在屏幕上：\n\n```\nSystem.out.println(Math.sqrt(25.0));\n```\n\n***\n\
