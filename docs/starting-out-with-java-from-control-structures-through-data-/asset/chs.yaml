  \ map 中，反之亦然。\n\n### `LinkedHashMap` 类\n\n`HashMap` 是无序的，和集合一样，没有元素的位置概念。例如，注意代码列表\
  \ 18-16 中映射的顺序与它们放入 map 的顺序并不匹配。`LinkedHashMap` 继承 `HashMap`，允许以两种顺序访问其映射：\n\n-\
  \ 插入顺序，即映射到 map 的顺序。\n- 访问顺序，即最后被访问的顺序。\n\n`LinkedHashMap` 维护一个引用映射的内部链表。如果你在插入模式下使用\
  \ map，则链表按照插入顺序排列。如果你在访问模式下使用 map，则链表按照 `put()` 或 `get()` 的访问顺序排列。\n\n在访问模式下，访问最频繁的映射放在链表的末尾，访问最少少的映射放在开头。这种模式对于需要知道哪些数据项访问最频繁的应用程序很有用。\n\
  \n你通过合适的 `LinkedHashMap` 构造函数来指定你偏好的排序顺序。表 18-13 总结了它们。\n\n**表 18-13** `LinkedHashMap`\
