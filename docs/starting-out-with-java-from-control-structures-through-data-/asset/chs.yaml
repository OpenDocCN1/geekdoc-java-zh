  ## 编程挑战\n\n#### 1. Employee 类（员工类）\n\n编写一个名为 `Employee` 的类，具有以下字段：\n\n* `name`。`name`\
  \ 字段引用一个 `String` 对象，存储员工姓名。\n* `idNumber`。`idNumber` 是一个 `int` 变量，存储员工的 ID 号。\n\
  * `department`。`department` 字段引用一个 `String` 对象，存储员工工作部门的名称。\n* `position`。`position`\
  \ 字段引用一个 `String` 对象，存储员工的职位名称。\n\n该类应该具有以下构造函数：\n\n* 一个接受以下值作为参数并将它们赋值给相应字段的构造函数：员工姓名、员工\
  \ ID 号、部门和职位。\n* 一个接受以下值作为参数并将它们赋值给相应字段的构造函数：员工姓名和 ID 号。`department` 和 `position`\
  \ 字段应赋值为空字符串（`\"\"`）。\n* 一个无参构造函数，将空字符串（`\"\"`）赋值给 `name`、`department` 和 `position`\
  \ 字段，并将 `idNumber` 字段赋值为 0。\n\n编写适当的修改器方法将值存储这些字段，以及返回这些值的访问器方法。编写该类后，编写一个单独程序创建三个\
  \ `Employee` 对象来存储以下数据：\n\n![Image](img/00386.jpg)\n\n程序应将这些数据存储在三个对象中，然后在屏幕上显示每个员工的数据。\n\
  \n#### 2. Car 类（汽车类）\n\n编写一个名为 `Car` 的类，具有以下字段：\n\n* `yearModel`。`yearModel` 字段是一个\
  \ `int`，存储汽车的型号年份。\n* `make`。`make` 字段引用一个 `String` 对象，存储汽车的品牌。\n* `speed`。`speed`\
  \ 字段是一个 `int`，存储汽车的当前速度。\n\n此外，该类应该具有以下构造函数和其他方法：\n\n* 构造函数。构造函数应该接受汽车的型号年份和品牌作为参数。这些值应赋值给对象的\
  \ `yearModel` 和 `make` 字段。构造函数还应该将 `speed` 字段赋值为 0。\n* 访问器。适当的访问器方法应该获取存储在 `yearModel`、`make`\
  \ 和 `speed` 字段中的值。\n* `accelerate`。`accelerate` 方法每次调用都会向 `speed` 字段加 5。\n* `brake`。`brake`\
  \ 方法每次调用都会从 `speed` 字段减 5。\n\n在一个程序中演示该类，创建一个 `Car` 对象，然后调用五次 `accelerate` 方法。在每次调用\
  \ `accelerate` 后，获取当前速度并显示。然后调用五次 `brake` 方法。在每次调用 `brake` 后，获取当前速度并显示。\n\n####\
