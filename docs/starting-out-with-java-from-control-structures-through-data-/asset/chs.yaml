  \n## 14.5 绘制形状\n\n> **概念：组件关联有一个 `Graphics` 对象，该对象可以绘制线条和形状**。\n\n除了显示按钮和标签等标准组件外，Java\
  \ 还允许你绘制线条和图形形状，如矩形、椭圆和弧。这些线条和形状直接绘制在组件上。这使得帧或面板可以成为你绘画的画布。然而，在研究如何在组件上绘制图形之前，我们必须讨论\
  \ `XY` 坐标系。你使用 `XY` 坐标系来指定图形的位置。\n\n### XY 坐标系\n\n组件中每个像素的位置通过 `X` 坐标和 `Y` 坐标来标识。坐标通常以\
  \ (`X`, `Y`) 的形式表示。`X` 坐标识别像素的水平位置，而 `Y` 坐标识别其垂直位置。组件左上角像素的坐标通常为 (0, 0)。`X` 坐标从左到右增加，`Y`\
  \ 坐标从上到增加。例如，图 14-17 展示了一个宽 300 像素、高 200 像素的组件（如帧或面板）。图中显示了每个角像素的 `X` 和 `Y` 坐标，以及组件中心像素。组件中心像素的\
  \ `X` 坐标为 149，`Y` 坐标为 99。\n\n**图 14-17** 300 像素宽 x 200 像素高组件上的 `X` 和 `Y` 坐标\n\n\
  ![Image](img/01093.jpg)\n\n当你在组件上绘制线条或形状时，必须使用 `X` 和 `Y` 坐标指定其位置。\n\n### 图形对象\n\n\
  每个组件都有一个继承自 `Graphics` 类的内部对象，该类是 `java.awt` 包的一部分。该对象有许多方法可以在组件表面绘制图形形状。表 14-2\
  \ 列出了其中一些方法。\n\n**表 14-2** `Graphics` 类的一些方法\n\n![Image](img/01094.jpg)\n\n![Image](img/01095.jpg)\n\
