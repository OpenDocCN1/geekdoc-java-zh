  ## 9.1 静态类成员\n\n概念：静态类成员属于类，而不属于对象。\n\n#### 实例字段和方法的快速回顾\n\n回第 6 章，类的每个实例都有自己的一组字段，这些字段被称为实例字段。例如，假设\
  \ `box` 引用 `Rectangle` 的一个实例，我们执行以下语句：\n\n```\nbox.setLength(10);\n```\n\n该语句将 10\
  \ 存储在属于该实例的 `length` 字段中。你也记得类可以有实例方法。当你调用实例方法时，它会对特定实例执行操作。例如，假设 `box` 引用 `Rectangle`\
  \ 的一个实例，查看以下语句：\n\n```\nx = box.getLength();\n```\n\n该语句调用 `getLength()` 方法，该方法返回\
  \ `length` 字段的值。实例字段和实例方法都与特定实例相关，并且在创建类的实例之前无法使用它们。\n\n#### 静态成员\n\n可以创建一个不属于类任何实例的字段或方法。这些成员被称为静态字段和静态方法。当值存储在静态字段中时，它并不存储在类的实例中。事实上，即使不存在类的实例，也可以将值存储在类的静态字段中。同样，静态方法不对属于任何实例的字段进行操作。相反，它们只能操作静态字段。你可以将静态字段和静态方法想象成属于类而不是属于类的实例。\n\
  \n#### 静态字段\n\n当一个字段用 `static` 关键字声明时，无论存在多少类实例，内存中都只有一个该字段的副本。类静态字段的副本由类的所有实例共享。例如，代码列表\
  \ 9-1 显示的 `Countable` 类使用静态字段来计数创建的类实例的数量。\n\n首先，注意第 7 行声明了名为 `instanceCount` 的静态字段如下：\n\
  \n```java\nprivate static int instanceCount = 0;\n```\n\n\n\n\n```java\nprivate\
  \ static int instanceCount = 0;\n```\n\n通过在访问修饰符之后、字段数据类型之前放置 `static` 关键字，可以创建一个静态字段。请注意，我们显式地将\
  \ `instanceCount` 字段初始化为值 `0`。无论创建了多少个类实例，这种初始化只发生一次。\n\n![Image](img/00005.jpg)\n\
  \n* * *\n\n**注意：** Java 会自动在所有未初始化的静态成员变量中存储 `0`。此类中的 `instanceCount` 字段经过了显式初始化，因此任何阅读代码的人都能清楚地看到该字段的初始值是\
  \ `0`。\n\n* * *\n\n接下来，查看第 16 到 19 行的构造函数。构造函数使用 `++` 运算符来递增 `instanceCount` 字段。每当创建一个\
  \ `Countable` 类的实例时，就会调用构造函数，并且 `instanceCount` 字段会加 1。因此，`instanceCount` 字段将包含已创建的\
  \ `Countable` 类的实例数量。第 28 到 31 行的 `getInstanceCount()` 方法返回 `instanceCount` 中的值。代码列表\
  \ 9-2 中的程序演示了这个类。\n\n**代码列表 9-2 (`StaticDemo.java`)**\n\n![Image](img/00627.jpg)\n\
