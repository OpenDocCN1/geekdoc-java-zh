  \n### 继承中构造函数问题的总结\n\n我们涵盖了在继承关系中关于构造函数的几个重要问题。以下列表总结了这些问题：\n\n - 父类构造函数始终在子类构造函数之前执行。\n\
  - 你可以编写一个调用父类构造函数的 `super` 语句，但只能在子类的构造函数中使用。你不能从任何其他方法调用父类构造函数。\n- 如果子类构造函数中出现了调用父类构造函数的\
  \ `super` 语句，它必须是第一条语句。\n- 如果子类构造函数没有显式调用父类构造函数，Java 将在执行子类构造函数代码之前自动调用 `super()`。\n\
  - 如果父类既没有默认构造函数也没有无参构造函数，那么继承自它的类必须调用父类所拥有的其中一个构造函数。\n\n#### ![Image](img/00004.jpg)\
