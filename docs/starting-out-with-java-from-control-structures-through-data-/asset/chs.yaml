  \n> 6.11 构造函数是如何命名的？\n\n> 6.12 构造函数的返回值是什么？\n\n> 6.13 假设以下是类中的一个构造函数：\n\n```java\n\
  ClassAct(int number)\n{\n    item = number;\n}\n```\n\n\n\n\n\n> a) 该构造函数出现在哪个类中？\n\
  \n> b) 编写一条语句，从该类创建一个对象，并将值 25 作为参数传递给构造函数。\n\n### 6.4 方法与构造函数的重载\n\n> **核心概念：类中的两个或多个方法只要参数列表不同，就可以有相同的名称。这同样适用于构造函数。**\n\
  \n方法重载是面向对象编程的重要组成部分。当一个方法被“重载”时，意味着同一个类中有多个方法名称相同，但使用不同类型的参数。方法重载之所以重要，是因为有时你需要几种不同的方式来执行相同的操作。例如，假设一个类有以下两个方法：\n\
  \n```java\n    public int add(int num1, int num2)\n    {\n        int sum = num1\
  \ + num2;\n        return sum;\n    }\n    public String add(String str1, String\
  \ str2)\n    {\n        String combined = str1 + str2;\n        return combined;\n\
  \    }\n```\n\n这两个方法都命名为 `add`。它们都接受两个参数并相加。第一个方法接受两个 `int` 参数并返回它们的和。第二个方法接受两个\
  \ `String` 引用，并返回一个这两个参数拼接后的 `String` 引用。当我们调用 `add` 方法时，编译器必须确定我们意图调用的是重载方法中的哪一个。\n\
  \n将方法调用与正确的方法匹配的过程被称为 `binding`（绑定）。当调用重载方法时，Java 使用方法的名称和参数列表来确定将调用绑定到哪种方法上。如果向\
  \ `add` 方法传递两个 `int` 参数，则会调用具有两个 `int` 参数的方法版本。同样，当向 `add` 传递两个 `String` 参数时，会调用具有两个\
  \ `String` 参数的版本。\n\nJava 使用方法的签名（`signature`）来将其与其他同名方法区分开。方法的`signature` 由方法名和方法参数的数据类型组成，按它们出现的顺序排列。例如，这里是之前显示的\
  \ `add` 方法的签名：\n\n`add(int, int)`\n`add(String, String)`\n\n注意，方法的返回类型**不是**签名的一部分。出于这个原因，以下\
  \ `add` 方法不能与之前的方法一起添加到同一个类中：\n\n```java\n    public int add(String str1, String\
  \ str2)\n    {\n        int sum = Integer.parseInt(str1) + Integer.parseInt(str2);\n\
  \        return sum;\n    }\n```\n\n因为返回类型不是签名的一部分，此方法的签名与另一个接受两个 `String` 参数的 `add`\
  \ 方法相同。由于这个原因，在编译包含所有这些方法的类时将发出错误信息。\n\n构造函数也可以被重载，这意味着一个类可以有多个构造函数。重载构造函数的规则与重载其他方法相同：每个版本的构造函数必须有不同的参数列表。只要每个构造函数都有唯一的签名，编译器就能区分它们。例如，我们之前讨论的\
  \ `Rectangle` 类可以有以下两个构造函数：\n\n```java\n    public Rectangle()\n    {\n        length\
  \ = 0.0;\n        width = 0.0;\n    }\n    public Rectangle(double len, double w)\n\
  \    {\n        length = len;\n        width = w;\n    }\n```\n\n这里显示的第一个构造函数不接受任何参数，并将\
  \ 0.0 分给 `length` 和 `width` 字段。第二个构造函数接受两个参数，并将它们分配给 `length` 和 `width` 字段。以下代码展示了如何调用每个构造函数：\n\
  \n```java\n    Rectangle box1 = new Rectangle();\n    Rectangle box2 = new Rectangle(5.0,\
  \ 10.0);\n```\n\n第一条语句创建一个由 `box1` 变量引用的 `Rectangle` 对象，并执行无参构造函数。它的 `length` 和\
  \ `width` 字段将被设置为 0.0。第二条语句创建另一个由 `box2` 变量引用的 `Rectangle` 对象，并执行第二个构造函数。它的 `length`\
  \ 和 `width` 字段将被设置为 5.0 和 10.0。\n\n#### `BankAccount` 类\n\n现在我们来看 `BankAccount`。该类有一个\
  \ `double` 字段 `balance`，持有账户的当前余额。以下是重载构造函数的总结：\n\n- 第一个构造函数是无参构造函数。它将 `balance`\
  \ 字段设置为 0.0。如果我们希望在创建类实例时执行此构造函数，只需不传递任何构造函数参数。例如：\n  `BankAccount account = new\
  \ BankAccount();`\n\n- 第二个构造函数有一个 `double` 类型参数变量 `startBalance`，它被赋值给 `balance`\
  \ 字段。如果我们希望在创建类实例时执行此构造函数，则传递一个 `double` 值作为构造函数参数。例如：\n  `BankAccount account =\
  \ new BankAccount(1000.0);`\n\n- 第三个构造函数有一个 `String` 类型参数变量 `str`。假设该 `String` 包含余额的字符串表示。该方法使用\
  \ `Double.parseDouble` 方法将字符串转换为 `double`，然后将其赋值给 `balance` 字段。如果我们希望在创建类实例时执行此构造函数，则传递一个\
  \ `String` 引用作为构造函数参数。例如：\n  `BankAccount account = new BankAccount(\"1000.0\");`\n\
  \n提供这个构造函数是为了方便。如果该类用于从对话框或文本文件中读取账户余额的程序，则金额在传递给构造函数之前不需要从字符串转换。\n\n以下是重载的 `deposit`\
  \ 方法的总结：\n\n- 第一个 `deposit` 方法有一个参数 `amount`，类型为 `double`。当调用该方法时，会将存入账户的金额传递给此参数。然后将该参数的值加到\
  \ `balance` 字段的值上。\n\n\n\n\n\n> 第二个 `deposit` 方法有一个参数 `str`，它是对 `String` 对象的引用。假设该\
  \ `String` 包含要存款金额的字符串表示。该方法使用 `Double.parseDouble` 方法将字符串转换为 `double` 类型，然后将其加到\
  \ `balance` 字段上。例如，如果我们调用该方法并传入“500.0”作为参数，它将把 500.0 加到 `balance` 字段中。与重载的构造函数一样，该方法是为那些从对话框或文本文件中读取存款金额的程序提供的便利。\n\
  \n以下是重载的 `withdraw` 方法的总结：\n\n> • 第一个 `withdraw` 方法有一个参数 `amount`，它的类型是 `double`。当调用该方法时，将要从账户中取出的金额传递给此参数。此后，该参数的值将从\
  \ `balance` 字段的值中减去。\n\n> • 第二个 `withdraw` 方法有一个参数 `str`，它是对 `String` 对象的引用。假设该\
  \ `String` 包含要取款金额的字符串表示。该金额被转换为 `double` 类型，然后从 `balance` 字段中减去。与重载的构造函数和 `deposit`\
  \ 方法一样，该方法是为了提供便利。\n\n以下是重载的 `setBalance` 方法的总结：\n\n> • 第一个 `setBalance` 方法接受一个\
  \ `double` 参数，并将其赋值给 `balance` 字段。\n\n> • 第二个 `setBalance` 方法接受一个 `String` 引用作为参数。假设该\
  \ `String` 包含账户余额的字符串表示。该 `String` 被转换为 `double`，然后赋值给 `balance` 字段。与许多其他重载方法一样，该方法是为了提供便利。\n\
  \n剩余的方法是 `getBalance`。它返回 `balance` 字段中的值，即当前账户余额。代码列表 6-14 中的 `AccountTest.java`\
  \ 程序演示了 `BankAccount` 类。其输出如图 6-24 所示。\n\n**代码列表 6-14 (`AccountTest.java`)**\n\n\
  ![Image](img/00371.jpg)\n\n![Image](img/00372.jpg)\n\n**图 6-24** 与 `AccountTest`\
  \ 程序的交互\n\n![Image](img/00373.jpg)\n\n### 重载方法使类更有用\n\n你可能在奇怪，为什么这些重载方法都会出现在 `BankAccount`\
  \ 类中，尤其是其中许多方法并没有被代码列表 6-14 中的演示程序未使用。毕竟，如果类只包含我们要用到的方法，不是更简单吗？\n\n一个对象的目的是提供特定的服务。`BankAccount`\
  \ 类提供的服务是模拟银行账户。任何需要模拟银行账户的程序都可以简单地创建一个 `BankAccount` 对象，然后使用它的方法让模拟运行起来。由于 `BankAccount`\
  \ 类有许多重载方法，它比只提供一种执行每种操作的方法要灵活得多。通过提供重载的构造函数、`deposit` 方法、`withdraw` 方法和 `setBalance`\
  \ 方法，我们使得 `BankAccount` 类对我们简单的演示程序以外的其他程序也有用。在设计自己的类时，这是一个需要记住的重要考虑。\n\n## 6.5\
  \ 实例字段的作用域\n\n> **概念：实例字段对类的所有实例方法都是可见的**。\n\n回想第 2 章内容，变量的作用域是程序中可以通过名称访问该变量的部分。变量名仅对变量作用域内部的语句可见。变量声明的位置决定了变量的作用域。\n\
  \n在本章中，你已经看到了在类中被声明为实例字段的变量。实例字段可以被该字段所在同一类中的任何实例方法访问。如果实例字段使用 `public` 访问修饰符声明，则它也可以被类外部的代码访问。\n\
  \n#### 遮蔽 (Shadowing)\n\n在第 2 章中，你看到在同一个作用域内不能有两个同名的局部变量。这同样适用于参数变量。参数变量本质上是一个局部变量。所以，你不能在同一个方法中给参数变量和局部变量赋予相同的名称。\n\
  \n然而，你可以拥有与字段同名的局部变量或参数变量。当你这样做时，局部变量或参数变量名会遮蔽字段的名称。这意味着字段名被局部变量或参数变量名隐藏了。\n\n例如，假设\
  \ `Rectangle` 类的 `setLength` 方法是如下编写的：\n\n```java\npublic void setLength(double\
  \ len)\n{\n    int length;    // 局部变量\n    length = len;\n}\n```\n\n在这段代码中，局部变量被赋予了与字段相同的名称。因此，局部变量名遮蔽了字段名。当执行语句\
  \ `length = len;` 时，`len` 的值被赋值给局部变量 `length`，而不是字段。字段名的意外遮蔽会导致难以发现的错误，因此你需要小心不要给局部变量赋予与字段相同的名称。\n\
  \n##### ![Image](img/00004.jpg)**检查点**\n\n> 6.14 重载方法是否要求具有不同的返回值、不同的参数列表，或两者兼有？\n\
  \n> 6.15 方法的签名（signature）是什么？\n\n> 6.16 查看下面的类：\n\n```java\npublic class CheckPoint\n\
  {\n    public void message(int x)\n    {\n        System.out.print(\"This is the\
  \ first version \");\n        System.out.println(\"of the method.\");\n    }\n\n\
  \    public void message(String x)\n    {\n        System.out.print(\"This is the\
  \ second version \");\n        System.out.println(\"of the method.\");\n    }\n\
  }\n```\n\n以下代码将显示什么？\n\n```java\nCheckPoint cp = new CheckPoint();\ncp.message(\"\
  1\");\ncp.message(1);\n```\n\n> 6.17 一个类可以拥有多少个默认构造函数？\n\n### 6.6 包和 import 语句\n\
  \n> **概念：Java API 中的类组织在包中。import 语句告诉编译器类位于哪个包中**。\n\n在第 2 章中，你接触了 Java API，它是一个预写类的标准库。API\
  \ 中的每个类都是为了特定的目的而设计的，你可以在自己的程序中使用这些类。你已经使用了一些 API 中的类，例如 `String` 类、`Scanner` 类、`JOptionPane`\
  \ 类、`DecimalFormat` 类和 `Random` 类。\n\nJava API 中的许多类对你的程序并不是自动可。很多情况下，你需要 `import`\
  \ 一个 API 类才能使用它。你使用 `import` 关键字来导入类。例如，以下语句是导入 `Scanner` 类所需的：\n\n```java\nimport\
  \ java.util.Scanner;\n```\n\n#### 显式和通配符 import 语句\n\n`import` 语句有两种类型：显式和通配符。*显式*\
  \ *`import`* 语句标识单个类的包位置。例如，以下语句显式地标识了 `Scanner` 类的位置：\n\n```java\nimport java.util.Scanner;\n\
  ```\n\n\n\n\n`java.util` 包包含了 `Scanner` 类以及此外还包含了几个其他类。例如，`Random` 类也是 `java.util`\
  \ 包的一部分。如果一个程序需要使用 `Scanner` 类和 `Random` 类，它就必须导入这两个类。实现此目标的一种方法是为每个类编写显式的 `import`\
  \ 语句，如下：\n\n```\nimport java.util.Scanner;\nimport java.util.Random;\n```\n\n另一种导入这两个类的方法是使用通配符\
  \ `import` 语句。通配符 `import` 语句告诉编译器导入包中的所有类。以下是一个示例：\n\n```java\nimport java.util.*;\n\
  ```\n\n包名后的 `.*` 告诉编译器导入 `java.util` 包中包含的所有类。使用通配符 `import` 语句不会影响程序的性能或大小。它只是告诉编译器，你希望让特定包中的每个类对你的程序都可用。\n\
  \n## `java.lang` 包\n\nJava API 确实有一个包，即 `java.lang`，它会自动导入到每个 Java 程序中。该包包含了通用类，例如\
  \ `String` 和 `System`，这些类是 Java 编程语言的基础。你不需要为属于 `java.lang` 包的任何类编写 `import` 语句。\n\
  \n## 其他 API 包\n\nJava API 中有许多包。表 6-2 列出了其中若干包。\n\n**表 6-2** 几个标准的 Java 包\n\n![Image](img/00374.jpg)\n\
  \n***\n\n有关包的更详细信息，请参阅此本书的在线资源页面 [www.pearsonhighered.com/gaddis](http://www.pearsonhighered.com/gaddis)\
  \ 附录 G。\n\n***\n\n## 6.7 关注面向对象的设计：寻找类及其职责\n\n到目前为止，你已经学习了编写类、从类创建对象以及使用对象执行操作的基础知识。虽然这些知识对于创建面向对象的应用程序是必要的，但它们并不是第一步。第一步是分析你试图解决的问题，并确定你需要的类。在本节中，我们将讨论一种在问题中寻找类并确定其职责的简单技术。\n\
  \n### 寻找类\n\n在开发面向对象的应用程序时，你的要任务之一是识别你需要创建的类。通常，你的目标是识别问题中存在的不同类型的现实世界对象，然后在应用程序中为这些类型的对象创建类。\n\
  \n多年来，软件专业人员开发了许多在给定问题中寻找类的技术。一种简单且流行的技术涉及以下步骤：\n\n1. 获取关于问题领域的书面描述。\n2. 识别描述中的所有名词（包括代词和名词性短语）。这些中的每一个项都是一个潜在的类。\n\
  3. 精炼列表，只包含与问题相关的类。\n\n让我们仔细观察这每一个步骤。\n\n#### 编写问题领域的描述\n\n`problem domain`（问题领域）是与问题相关的现实世界对象、实体和重大事件的集合。如果你充分理解你试图解决的问题本质，你可以自己编写一份问题领域的描述。如果你不彻底理解问题的本质，你应该让专家来为你编写描述。\n\
  \n例如，假设我们正在编写一个供 Joe 的汽车修理店经理使用的应用程序，用于为客户打印服务报价单。以下可能是由专家（也许 Joe 本人）编写的描述：\n\n\
  > Joe 的汽车修理店服务外国汽车，专门从事维修梅赛德斯、保时捷和宝马制造的汽车。当客户把汽车带到修理店时，经理获取客户的名字、地址和电话号码。然后经理确定汽车的品牌、型号和年份，并给客户服务报价单。服务报价单显示了预估的零件费用、预估人工费用、销售税和总预估费用。\n\
  \n问题领域描述应该包含以下任何内容：\n\n* 物理对象，如车辆、机器或产品\n* 人所扮演的角色，如经理、员工、客户、教师、学生等\n* 业务事件的结果，例如客户订单，或者在本例中为服务报价单\n\
  * 记录项目，例如客户历史和工资记录\n\n#### 识别所有名词\n\n下一步是识别所有的名词和名词性短语。（如果描述中包含代词，也把它们包含进来。）再次之前的问题领域描述。这次名词和名词性短语加粗显示。\n\
  \n> **Joe 的汽车修理店**服务**外国汽车，**并专门从事维修**梅赛德斯、保时捷、**和**宝马**制造的**汽车**。当一个**客户**把一辆**汽车**带到**修理店，**时，**经理**获取**客户**的**名字、地址、**和**电话号码**。然后**经理**确定**品牌、型号、**和**年份**的**汽车，**并给**客户**一份**服务报价单**。**服务报价单**显示了**预估的零件费用、预估人工费用、销售税、**和**总预估费用**。\n\
  \n问题领域描述应该包含以下任何内容：\n\n#### 精炼名词列表\n\n出现在问题描述中的名词仅仅是成为类的候选者。可能没有必要为所有名词创建类。下一步是精炼列表，只包含解决问题所需的类。\n\
  \n\n\n\n![Image](img/00377.jpg)\n\n我们的问题描述并没有直接引导我们处理任何关于 `shop` 的信息，或关于 `manager`\
  \ 的任何信息，因此我们把它们从列表中删除了。\n\n> **3. 某些名词可能代表对象，而不是类**。\n\n我们可以排除 `Mercedes`、`Porsche`\
  \ 和 `BMW` 作为类的可能性，因为在这个示例中，它们都代表特定的汽车，可以被视为 `cars` 类的实例。此外，我们还可以从列表中删除 `car` 这个词。在描述中，它指的是客户带进商店的某个特定汽车。因此，它也会代表\
  \ `cars` 类的一个实例。此时，更新后的潜在类列表如下：\n\n![Image](img/00378.jpg)\n\n我们删除了 `Mercedes`、`Porsche`、`BMW`\
  \ 和 `car`，因为它们都是 `cars` 类的实例。这意味着这些名词标识的是对象，而不是类。\n\n![Image](img/000006.jpg)\n\n\
  ***\n\n**提示：** 一些面向对象的设计师会注意名词是复数还是单数。有时，复数名词表示类，而单数名词表示对象。\n\n***\n\n> **4. 某些名词可能代表简单值，可以存储在原始变量中，且不需要类**。\n\
  \n记住，类包含字段（fields）和方法（methods）。字段是存储在类对象中的相关项，定义了对象的状态。方法是类对象可以执行的操作或行为。如果一个名词代表的项类型没有任何可识别的字段或方法，那么它可能可以从列表中删除。为了帮助判断一个名词是否代表一个具有字段和方法的项，可以就它提出以下问题：\n\
  \n> • 你是否会使用一组相关值来表示该项目的状态？\n> • 该项目是否有任何而易见的可以的操作？\n\n如果这两个问题的答案都是“否”，那么该名词可能代表一个可以存储在原始变量中的值。如果我们对列表中剩余的每个名词应用这项测试，我们可以得出以下内容可能不是类：`address`、`estimated\
  \ labor charges`、`estimated parts charges`、`make`、`model`、`name`、`sales tax`、`telephone\
  \ number`、`total estimated charges` 和 `year`。这些都是简单的字符串或数值，可以存储在原始变量中。以下是更新后的潜在类列表：\n\
  \n![Image](img/00379.jpg)\n\n我们删除了 `address`、`estimated labour charges`、`estimated\
  \ parts charges`、`make`、`model`、`name`、`sales tax`、`telephone number`、`total estimated\
  \ charges` 和 `year` 作为类，因为它们代表可以存储在原始变量中的简单值。\n\n从列表中可以看到，我们删除了 `cars`、`customer`\
  \ 和 `service quote` 之外的所有内容。这意味着在我们的应用程序中，我们需要类来表示汽车、客户和服务报价。最终，我们将编写一个 `Car` 类、一个\
  \ `Customer` 类和一个 `ServiceQuote` 类。\n\n**识别类的职责**\n\n一旦确定了类，下一个任务就是识别每个类的职责。类的职责如下：\n\
  \n> • 类负责获晓的事情\n> • 类负责执行的操作\n\n当你识别了类负责获晓的事情时，你就识别了类的属性（attributes）。这些值将存储在字段中。同样，当你识别了类负责执行的操作时，你就识别了它的方法。\n\
  \n询问“在这一问题的背景下，类必须知道什么？类必须做什么？”通常很有帮助。寻找答案的第一个地方是问题领域的描述。类必须知道和做法的许多事情都会被提到。然而，某些类职责可能没有直接在问题领域中提到，因此通常需要脑风暴。让我们将这种方法应用到我们之前从问题领域识别出的类上。\n\
  \n**Customer 类**\n\n在我们问题领域的背景下，`Customer` 类必须知道什么？描述中直接提到了以下项，它们都是客户的属性：\n\n> •\
  \ 客户的名字\n> • 客户的地址\n> • 客户的电话号码\n\n这些都是可以表示为字符串并存储在类字段中的值。`Customer` 类可能知道许多其他事情。在这一点可能会犯的错误是识别了太多的对象负责获晓的事情。在某些应用程序中，`Customer`\
  \ 类可能知道客户的电子邮件地址。这个特定的问题领域没有提到客户的电子邮件地址用于任何用途，因此我们不应该将其包含为职责。\n\n现在让我们识别类方法。在我们问题领域的背景下，`Customer`\
  \ 类必须做什么？唯一而易见的动作如下：\n\n> • 创建 `Customer` 类的对象\n> • 设置和获取客户的名字\n> • 设置和获取客户的地址\n\
  > • 设置和获取客户的电话号码\n\n从这个列表中看到，`Customer` 类将有一个构造函数，以及其每个字段的访问器（accessor）和变异器（mutator）。图\
  \ 6-25 显示了 `Customer` 类的 UML 图。\n\n**图 6-25** `Customer` 类的 UML 图\n\n![Image](img/00380.jpg)\n\
  \n**Car 类**\n\n在我们问题领域的背景下，`Car` 类必须知道什么？以下项都是汽车的属性，并在问题领域被提到：\n\n> • 汽车品牌\n> •\
  \ 汽车型号\n> • 年份\n\n现在识别类方法。在我们问题领域的背景下，`Car` 类必须做什么？再次，唯一易见的动作是我们在大多数类中常见的标准方法（构造函数、访问器和变异器）。具体来说，动作是：\n\
  \n> • 创建 `Car` 类的对象\n> • 设置和获取汽车品牌\n> • 设置和获取汽车型号\n> • 设置和获取年份\n\n图 6-26 显示了此时 `Car`\
  \ 类的 UML 图。\n\n**图 6-26** `Car` 类的 UML 图\n\n![Image](img/00381.jpg)\n\n**ServiceQuote\
  \ 类**\n\n在我们问题领域的背景下，`ServiceQuote` 类对象必须知道什么？问题领域提到了以下项：\n\n> • 预估费用\n> • 预估工费\n\
  > • 税费\n> • 总预估费用\n\n仔细的思考和一些脑风暴将发现这些项中的两个是计算结果：税费和总预估费用。这些项取决于预估费用和工费的值。为了避免持有过期数据的风险，我们不会将这些值存储在字段中。相反，我们将提供计算并返回这些值的方法。我们此类类需要的其他方法是构造函数，以及预估费用和预估工费字段的访问器和变异器。图\
  \ 6-27 显示了 `ServiceQuote` 类的 UML 图。\n\n**图 6-27** `ServiceQuote` 类的 UML 图\n\n\n\n\
