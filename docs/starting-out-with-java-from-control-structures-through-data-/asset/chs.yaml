  ***\n\n#### UML 图中的聚合\n\n在 UML 中，你通过一个空心菱形连接两个类来表示聚合。图 9-14 是一张显示 `Course`、`Instructor`\
  \ 和 `TextBook` 类之间关系的 UML 图。空心菱形靠近作为聚合体的类。\n\n#### 聚合类的安全问题\n\n在编写聚合类时，你应该小心不要在无意中创建“安全漏洞”，允许类外部的代码修改私有数据。我们将关注以下两个可以帮助解决问题的特定实践：\n\
  \n> • **在创建字段对象时执行深拷贝 (Deep Copies)**\n\n聚合对象包含对其他对象的引用。当你复制聚合对象时，对它所引用的对象也进行复制是重要的。这被称为*深拷贝*\
  \ (deep copy)。如果你复制了聚合对象，但只对它引用的对象进行了引用拷贝，那么你执行的是*浅拷贝* (shallow copy)。\n\n> • **返回字段对象的副本而非原始对象**\n\
  \n当聚合类中的方法返回字段对象的引用时，请返回该字段对象的副本。\n\n让我们深入讨论一下这每一个实践。\n\n##### 在创建字段对象时执行深拷贝\n\n\
  让我们仔细查看 `Course` 类。首先，注意构造函数在第 19 行和第 20 行接受的参数如下：\n\n> • 包含课程名称的 `String` 引用被传入\
  \ `name` 参数。\n> • 一个 `Instructor` 对象的引用被传入 `instr` 参数。\n> • 一个 `TextBook` 对象的引用被传入\
  \ `text` 参数。\n\n接下来，注意构造函数并没有简单地将 `instr` 赋值给 `instructor` 字段。相反，它在第 27 行为 `instructor`\
  \ 字段创建了一个新的 `Instructor` 对象，并将 `instr` 传递给拷贝构造函数。语句如下：\n\n```java\ninstructor =\
  \ new Instructor(instr);\n```\n\n该语句创建了 `instr` 所引用对象的副本。`instructor` 字段将引用该副本。\n\
  \n当一个类有一个是对象的字段时，浅拷贝操作可能会创建一个安全漏洞。例如，假设 `Course` 构造函数是如下编写的：\n\n![Image](img/00674.jpg)\n\
  \n在这个示例中，`instructor` 和 `textBook` 字段仅仅赋值了传入构造函数的对象的地址。这可能会导致问题，因为 `Course` 对象外部的变量可能也包含这些\
  \ `Instructor` 和 `TextBook` 对象的引用。这些外部变量将直接访问 `Course` 对象的私有数据。\n\n\n\n\n在此处，你可能在想为什么对\
  \ `courseName` 字段没有进行深拷贝。在第 23 行，`Course` 构造函数执行了浅拷贝，简单地将 `name` 引用的 `String` 对象的地址赋值给\
  \ `courseName` 字段。这是被允许的，因为 `String` 对象是不可变的。`immutable`（不可变）对象不提供更改其内容的方法。即使 `Course`\
  \ 类外部的变量引用了与 `courseName` 相同的对象，该对象也无法被更改。\n\n### 返回字段对象的拷贝，而不是原始对象\n\n当聚合类（aggregate\
  \ class）中的方法返回一个字段对象的引用时，它应该返回该字段对象拷贝的引用，而不是字段本身。例如，查看 `Course` 类中的 `getInstructor`\
  \ 方法。代码所示：\n\n![Image](img/00675.jpg)\n\n注意，`return` 语句使用了 `new` 关键字来创建一个新的 `Instructor`\
  \ 对象，并将 `instructor` 字段传递给拷贝构造函数。创建的对象是 `instructor` 所引用对象的拷贝。然后返回该拷贝的地址。这比直接返回字段对象本身的引用要好。例如，假设该方法是这样写的：\n\
  \n![Image](img/00676.jpg)\n\n此方法返回存储在 `instructor` 字段中的值，即 `Instructor` 对象的地址。任何接收该地址的变量随后都可以访问该\
  \ `Instructor` 对象。这意味着 `Course` 对象外部的代码可以更改 `Instructor` 对象所持有的值。这是一个安全漏洞，因为 `Instructor`\
  \ 对象是一个私有字段！只有 `Course` 类内部的代码才被允许访问它。\n\n![Image](img/00005.jpg)\n\n**注意：** 返回\
  \ `String` 对象的引用是被允许的，即使 `String` 对象是一个私有字段。这是因为 `String` 对象是不可变的。\n\n### 避免使用 `null`\
  \ 引用\n\n默认情况下，实例字段引用变量被初始化为 `null`。这表示该变量没有引用任何对象。由于 `null` 引用变量不引用对象，你不能使用它来执行需要对象存在的操作。例如，`null`\
  \ 引用变量不能用于调用方法。如果你尝试对 `null` 引用变量执行操作，程序将终止。例如，查看代码列表 9-16 所示的 `FullName` 类。\n\n\
