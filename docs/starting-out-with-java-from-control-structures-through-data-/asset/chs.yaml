  \ Exam 1 score is the highest.`\n\n#### 接口中的字段\n\n接口可以包含字段声明，但接口中的所有字段都是 `final`\
  \ 且 `static` 的。因为它们是 `final`，例如查看下面的接口：\n\n```java\npublic interface Doable\n{\n\
  int FIELD1 = 1;\nint FIELD2 = 2;\n}\n```\n\n在这个接口中，`FIELD1` 和 `FIELD2` 是 `final`。\n\
  \n#### 实现多个接口\n\n你可能疑惑为什么既需要抽象类又接口，因为它们如此相似。原因是一个类只能继承一个超类，但 Java 允许类实现多个接口。要在类中指定多个接口，只需在\
  \ `implements` 关键字后用逗号列出接口名称。这是一个实现三个接口的类的第一行：\n\n![Image](img/00883.jpg) Interface1,\
  \ Interface2, Interface3.\n\n#### UML 中的接口\n\n在 UML 中，接口的绘制方式与类相同，但接口名和方法名使用斜体，并在接口名称上方显示\
  \ `<<interface>>` 标签。类与接口之间的关系被称为实现（类实现接口）。在 UML 图中，通过一根带有空箭头的虚线连接类和接口来显示实现关系。箭头指向接口。这描述了实现关系。图\
  \ 11-20 显示了 `GradedActivity` 类、`FinalExam3` 类和 `Relatable` 接口之间关系的 UML 图。\n\n**图\
  \ 11-20** UML 中的实现关系\n\n![Image](img/00884.jpg)\n\n#### 多态与接口\n\n正如你可以创建类类型的引用变量一样，Java\
  \ 也允许你创建接口类型的引用变量。接口引用变量可以引用实现该接口的对象，无论其类类型如何。这是多态的另一个例子。例如，查看代码列表 11-32 中的 `RetailItem`\
  \ 接口。\n\n**代码列表 11-32 (`RetailItem.java`)**\n\n![Image](img/00885.jpg)\n\n该接口只指定了一个方法：`getRetailPrice`。`CompactDisc`\
