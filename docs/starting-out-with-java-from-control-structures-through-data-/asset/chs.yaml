  \n\n\n这是一个示例，展示了你如何使用 `Integer.parseInt` 方法将 `JOptionPane.showInputDialog` 方法返回的值转换为\
  \ `int`：\n\n```java\nint number;\nString str;\nstr = JOptionPane.showInputDialog(\"\
  Enter a number.\");\nnumber = Integer.parseInt(str);\n```\n\n执行此代码后，`number` 变量将存储用户输入的值，并将其转换为\
