  \ `final int` 变量。`DEFAULT_CAPACITY` 初始化为 10，这是列表的默认容量。`RESIZE_FACTOR` 初始化为 2。当数组扩展时，数组的新长度将是当前长度乘以此值。\n\
  \n第 13 行声明了 `list`，它是 `String` 数组的引用。`list` 字段将引用存储元素的数组。第 14 行声明了 `elements`，一个\
  \ `int` 类型。该字段将保存存储在列表中的元素数量。\n\n\n\n\n\n该类提供了两个构造函数。第一个（所示）是一个无参数构造函数，用于创建一个具有默认容量的空列表：\n\
