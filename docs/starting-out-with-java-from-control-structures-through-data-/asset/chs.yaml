  \ 17.5 泛型类中的类型参数限制\n\n> **概念：你可以对泛型类中的类型参数进行限制，使得只有某些类型参数可以用于创建该类的实例。**\n\n之前你已经看到了如何在\
  \ `printPoint` 方法头中使用泛型符号，以便该方法能够接受泛型 `Point` 类的实例作为参数。你还看到如何使用泛型符号来限制方法，使其只接受类型参数为\
