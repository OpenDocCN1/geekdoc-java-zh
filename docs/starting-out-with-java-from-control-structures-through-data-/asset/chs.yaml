  \n##### `startsWith` 和 `endsWith` 方法\n\n`startsWith` 方法确定调用对象的字符串是否以指定的子字符串开头。例如，以下代码确定字符串“Four\
  \ score and seven years ago”是否以“Four”开头。如果字符串以指定的子字符串开头，该方法返回 `true`，否则返回 `false`。\n\
  \n```java\nString str = \"Four score and seven years ago\";\nif (str.startsWith(\"\
  Four\"))\n    System.out.println(\"The string starts with Four.\");\nelse\n    System.out.println(\"\
  The string does not start with Four.\");\n```\n\n**表 10-3** 查找子字符串的 `String` 方法\n\
  \n![Image](img/00732.jpg)\n\n在代码中，方法调用 `str.startsWith(\"Four\")` 返回 `true`，因为字符串确实是以“Four”开头的。`startsWith`\
  \ 方法区分大小写比较，因此方法调用 `str.startsWith(\"four\")` 将返回 `false`。\n\n`endsWith` 方法确定调用字符串是否以指定的子字符串结尾。例如，以下代码确定字符串“Four\
  \ score and seven years ago”是否以“ago”结尾。如果字符串确实以指定的子字符串结尾，该方法返回 `true`，否则返回 `false`。\n\
  \n```java\nString str = \"Four score and seven years ago\";\nif (str.endsWith(\"\
  ago\"))\n    System.out.println(\"The string ends with ago.\");\nelse\n    System.out.println(\"\
  The string does not end with ago.\");\n```\n\n在代码中，方法调用 `str.endsWith(\"ago\")`\
  \ 返回 `true`，因为字符串确实是以“ago”结尾的。`endsWith` 方法区分大小写比较，因此方法调用 `str.endsWith(\"Ago\"\
  )` 将返回 `false`。\n\n代码列表 10-4 中的程序演示了一种使用 `startsWith` 方法的搜索算法。该程序在字符串数组中搜索以指定字符串开头的元素。\n\
