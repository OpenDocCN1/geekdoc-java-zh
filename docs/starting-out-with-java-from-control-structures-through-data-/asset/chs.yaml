  \ 编写名为 `Employee` 的类的第一行，该类实现了 `Payable` 和 `Listable` 接口。\n\n## 11.10 需要避免的常见错误\n\
  \n以下列表描述了在学习本章主题时常见的几种错误：\n\n- **尝试直接从子类访问父类的私有成员**。子类的方法无法直接访问父类的私有成员。子类必须调用父类的公共或受保护方法，以便访问父类的私有成员。\n\
  - **当父类没有默认构造函数或由程序员定义的无参构造函数时，忘记显式调用父类构造函数**。当父类没有默认构造函数或程序员定义的无参构造函数时，子类的构造函数必须显式调用父类已有的构造函数之一。\n\
  - **想要调用另一个父类构造函数却允许父类的无参构造函数被隐含调用**。如果子类的构造函数没有显式调用父类构造函数，Java 会自动调用父类的无参构造函数。\n\
  - **忘记在调用重写的父类方法之前加上 `super`**。当子类方法调用重写的父类方法时，必须在方法调用之前加上关键字 `super` 和点（`.`）。未这样做会导致调用子类版本的方法。\n\
  - **忘记指定类成员的访问修饰符**。当你不给类成员指定访问修饰符时，它默认获得包访问权限。这意味着同一包中的任何方法都可以访问该成员。\n- **为抽象方法编写方法体**。抽象方法不能有方法体。\n\
  - **忘记用分号结束抽象方法**。抽象方法的头部必须以分号结束。\n- **未能重写抽象方法**。子类必须对其进行重写。\n- **重载抽象方法而不是重写它**。重载（overloading）不同于重写（riding）。\n\
  - **尝试实例化抽象类**。你不能创建抽象类的实例。\n- **实现了接口但忘记提供接口中指定的所有方法**。该类必须具有对应签名的方法。\n\n## 复习题与练习题\n\
