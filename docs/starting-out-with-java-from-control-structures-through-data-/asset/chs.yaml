  ```\n\n## 11.8 抽象类与抽象方法\n\n> **概念：抽象类不能被实例化，但其他类可以扩展它。抽象方法没有方法体，必须在子类中重写。**\n\n\
  抽象方法是一种出现在父类中但在但在子类中被重写的方法。抽象方法只有头部而没有方法体。以下是抽象方法头部的通用格式：\n\n`AccessSpecifier` abstract\
  \ `ReturnType MethodName (ParameterList);`\n\n注意关键字 `abstract` 出现在头部中，且头部以分号结束。该方法没有方法体。以下是一个抽象方法头部的示例：\n\
  \n```\npublic abstract void setValue(int value);\n```\n\n当抽象方法出现在类中时，必须在子类中重写该方法。如果子类未能重写该方法，将导致错误。抽象方法用于确保子类实现该方法。\n\
  \n当一个类包含抽象方法时，你无法创建该类的实例。抽象方法通常用于抽象类。抽象类本身不被实例化，而是作为其他类的父类。抽象类代表了所有继承自它的类的通用形式或抽象形式。\n\
  \n例如，考虑一个制造飞机的工厂。该工厂不制造一种通用的飞机，而是制造三种特定类型的飞机：两种不同型号的螺旋桨飞机和一个支线喷气机型号。用于编目飞机的计算机软件可能会使用一个名为\
  \ `Airplane` 的抽象类。该类拥有代表所有飞机共同特征的成员。此外，软件还为工厂制造的三种特定飞机型号各准备了一个类。这些类都扩展了 `Airplane`\
  \ 类，并拥有代表每种类型飞机独特特征的成员。`Airplane` 类从不实例化，而是作为其他类的父类使用。\n\n当你在类定义中使用 `abstract` 关键字时，该类就变成了抽象类。以下是通用格式：\n\
  \n`AccessSpecifier` abstract class `ClassName`\n\n抽象类不能被实例化，但其他类可以扩展它。抽象方法没有方法体，必须在子类中重写。\n\
  \n\n\n\n抽象类在 UML 中的绘制方式与普通类相同，但类名和抽象方法名用斜体显示。例如，图 11-19 显示了 `Student` 类的 UML 图。\n\
  \n**图 11-19** `Student` 类的 UML 图。\n\n![Image](img/00874.jpg)\n\n##### **![Image](img/00004.jpg)\
