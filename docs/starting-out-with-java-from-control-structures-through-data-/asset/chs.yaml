  ```\n\n编写代码将 `a` 数组复制到 `b` 数组。\n\n## 8.3 将数组作为参数传递给方法\n\n> **概念：数组可以作为参数传递给方法。要传递数组，只需传递引用数组的变量中的值。**\n\
  \n你经常需要编写处理数组中数据的方法。正如你将看到的，方法可以用于在数组中存储值、显示数组内容、计算数组所有元素的和、计算它们的平均值等。通常，此类方法接受数组作为参数。\n\
