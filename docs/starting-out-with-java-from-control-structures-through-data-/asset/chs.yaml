  jumps\nover\nthe\nlazy\ndog\n```\n\n## 15. 皮格语 (Pig Latin)\n\n编写一个程序，要求用户输入一个句子。程序将句子中的每个单词的第一个字母移到末尾并添加“ay”。例如，如果用户输入“The\
  \ quick brown fox jumps over the lazy dog”，程序将显示：\n\n```\nheTay uickay ownwnay oxay\
  \ umpsjay overay ethay azylay ogday\n```\n\n## 16. 摩斯密码\n\n编写一个程序，要求用户输入一个句子。程序应将句中的每个字母转换为对应的摩斯密码。例如，如果用户输入“SOS”，程序将显示：\n\
  \n```\n... --- ...\n```\n\n\n\n\n> • 足球员是一种运动员。\n\n当对象之间存在“是一种（is a）”关系时，意味着特化对象具有通用对象的所有特征，外加使其变得特殊的额外特征。在面向对象的编程中，继承被用于在类之间创建“是一种”的关系。这允许你通过创建另一个该类的特化版本类来扩展该类的功能。\n\
  \n继承涉及一个父类（superclass）和一个子类（subclass）。`superclass` 是通用类，而 `subclass` 是特化类。你可以将子类类为父类的扩展版本。子类继承了父类的字段和方法，而无需重写其中任何一个。此外，可以向子类中添加新的字段和方法，这使得它成为父类的特化版本。\n\
  \n在第 7 章中，你已经接触了继承的概念以及它如何在开发 GUI 应用程序中使用。回想一下，你创建了 `JFrame` 类的扩展类。在这些应用程序中，`JFrame`\
  \ 是父类，而你的特化类就是子类。\n\n![Image](img/00005.jpg)\n\n***\n\n**注意：** 为了避免因术语过多让你产生困惑，但应该提到父类也被称为基类（`base\
  \ classes`），子类也被称为派生类（`derived classes`）。这两组术都是正确的。为了一致起见，本文将使用父类和子类这两个术语。\n\n***\n\
  \n让我们来看一个如何使用继承的示例。大多数老师会给学生布置各种评分活动。评分活动可以给出一个数值分数，例如 70、85、90 等，以及一个字母等级，如 A、B、C、D\
  \ 或 F。图 11-2 显示了 `GradedActivity` 类的 UML 图，该类被设计用于持有评分活动的数值分数。`setScore` 方法设置一个数值分数，而\
  \ `getScore` 方法返回该数值分数。`getGrade` 方法返回与数值分数对应的字母等级。注意，该类没有程序员定义的构造函数，因此 Java 将自动为它生成一个默认构造函数。这将在以后成为一个讨论点。代码列表\
  \ 11-1 显示了类的代码。\n\n**图 11-2** `GradedActivity` 类的 UML 图\n\n![Image](img/00783.jpg)\n\
  \n**代码列表 11-1 (`GradedActivity.java`)**\n\n![Image](img/00784.jpg)\n\n![Image](img/00785.jpg)\n\
  \n代码列表 11-2 中的程序演示了该类。图 11-3 和 11-4 显示了与程序交互的示例。\n\n**代码列表 11-2 (`GradeDemo.java`)**\n\
  \n![Image](img/00786.jpg)\n\n![Image](img/00787.jpg)\n\n**图 11-3** 与 `GradeDemo.java`\
  \ 程序的交互\n\n![Image](img/00788.jpg)\n\n**图 11-4** 与 `GradeDemo.java` 程序的交互\n\n![Image](img/00789.jpg)\n\
  \n`GradedActivity` 类代表了学生评分活动的通用特征。然而，存在许多不同类型的评分活动，例如测验、期中考试、期末考试、实验报告、论文等。由于这些评分活动的数值分数的确定方式可能不同，我们可以创建子类来处理每一个活动。例如，我们可以创建一个\
  \ `FinalExam` 类，它将是 `GradedActivity` 类的子类。图 11-5 显示了此类类的 UML 图，代码列表 11-3 显示了它的代码。它包含考试题目数量的字段（`numQuestions`）、每个问题的分值字段（`pointsEach`）以及学生错过的题目数量（`numMissed`）。\n\
  \n**图 11-5** `FinalExam` 类的 UML 图\n\n![Image](img/00790.jpg)\n\n**代码列表 11-3 (`FinalExam.java`)**\n\
  \n![Image](img/00791.jpg)\n\n![Image](img/00792.jpg)\n\n![Image](img/00793.jpg)\n\
  \n查看第 5 行 `FinalExam` 类的头部。该头部使用了 `extends` 关键字，这表示该类继承了另一个类（父类）。父类的名称列在 `extends`\
  \ 之后。因此，此行表示 `FinalExam` 是被声明的类的名称，而 `GradedActivity` 是它所继承的父类的名称。这在图 11-6 中所示。\n\
  \n**图 11-6** `FinalExam`\n\n![Image](img/00794.jpg)\n\n如果我们想表达这两个类之间的关系，可以说 `FinalExam`\
  \ 是一个 `GradedActivity`。因为 `FinalExam` 继承 `GradedActivity`，它继承了 `GradedActivity`\
  \ 的所有公共成员。这里是 `FinalExam` 的成员：\n\n**字段：**\n\n![Image](img/00795.jpg)\n\n**方法：**\n\
  \n![Image](img/00796.jpg)\n\n注意 `GradedActivity` 类的 `score` 字段没有列在 `FinalExam` 的成员中。这是因为\
  \ `score` 是私有的。父类的私有成员无法被子类访问，因此它们没有被继承。你也会注意到父类构造函数没有被继承。下一节我们将详细讨论构造函数是如何工作的。\n\
  \n为了看到继承是如何是如何工作的，让我们仔细观察第 18 行的 `FinalExam` 构造函数。它接受两个参数：考试题目数量和学生错过的数量。在第 23 和\
  \ 24 行，这些值被赋值给 `numQuestions` 和 `numMissed`。然后，在第 28 和 29 行，计算每个问题的得分和数值分数。在第 33\
  \ 行，构造函数的最后语句如下：\n\n```\nsetScore(numericScore);\n```\n\n这是对 `setScore` 方法的调用。虽然\
  \ `FinalExam` 类没有 `setScore` 方法，但它是继承自 `GradedActivity` 的。代码列表 11-4 中的程序演示了 `FinalExam`\
  \ 类。图 11-7 显示了与程序交互的示例。\n\n**代码列表 11-4 (`FinalExamDemo.java`)**\n\n![Image](img/00797.jpg)\n\
  \n![Image](img/00798.jpg)\n\n**图 11-7** 与 `FinalExamDemo.java` 程序的交互\n\n![Image](img/00799.jpg)\n\
  \n在第 27 行，以下语句创建 `FinalExam` 类的实例并将地址赋值给 `exam` 变量：\n\n```\nFinalExam exam = new\
  \ FinalExam(questions, missed);\n```\n\n当在内存中创建一个 `FinalExam` 对象时，它不仅拥有 `FinalExam`\
  \ 类中定义的成员，还拥有 `GradedActivity` 类中定义的非私有成员。注意此处所示第 30 到 34 行，直接从 `exam` 对象调用了 `GradedActivity`\
  \ 类的两个公共方法 `getScore` 和 `getGrade`：\n\n```java\nJOptionPane.showMessageDialog(null,\n\
  \    \"Each question counts \" + exam.getPointsEach() +\n    \" points.\\nThe exam\
  \ score is \" +\n    exam.getScore() + \" \\nThe exam grade is \" +\n    exam.getGrade());\n\
  ```\n\n\n\n\n\n当子类扩展父类时，父类的公共成员将成为子类的公共成员。在程序程序中，`getScore` 和 `getGrade` 方法可以从 `exam`\
  \ 对象调用，因为它们是该对象父类的公共成员。\n\n如前所述，父类的私有成员（在本例中为 `score` 字段）无法被子类访问。当在内存中创建 `exam`\
  \ 对象时，存在一个 `score` 字段，但只有在父类 `GradedActivity` 中定义的方法可以访问它。它对父类来说是真正的私有。由于 `FinalExam`\
  \ 构造函数无法直接访问 `score` 字段，它必须调用父类的 `setScore` 方法（它是公共的）来向其中存储值。\n\n## UML 图中的继承\n\n\
