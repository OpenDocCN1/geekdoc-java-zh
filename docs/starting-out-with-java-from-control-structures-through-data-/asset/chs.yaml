  \n***\n\n### 焦点关注：创建一个处理数组的对象\n\n以下伪代码显示了计算一组考试成绩的扣除最低分后的平均值的步骤：\n\n1. 计算考试总和。\n\
  2. 找到最低分。\n3. 从总和中减去最低分。\n4. 将调整后的总和除以（人数）。\n\n你决定创建一个名为 `Grader` 的类。`Grader` 类将有一个接受测试分数数组的构造函数，一个返回最低值的\
  \ `getLowest` 方法，以及一个返回扣除最低分后分数平均值的 `getAverage` 方法。\n\n**图 8-12** `Grader` 类的 UML\
  \ 图。\n\n![Image](img/00555.jpg)\n\n**代码列表 8-12 (`Grader.java`)**\n\n```java\npublic\
  \ class Grader {\n    private double[] testScores;\n\n    public Grader(double[]\
  \ scores) {\n        testScores = scores;\n    }\n\n    public double getLowest()\
  \ {\n        double lowest = testScores[0];\n        for (int i = 1; i < testScores.length;\
  \ i++) {\n            if (testScores[i] < lowest) {\n                lowest = testScores[i];\n\
  \            }\n        }\n        return lowest;\n    }\n\n    public double getAverage()\
  \ {\n        if (testScores.length < 2) {\n            System.out.println(\"Error:\
  \ at least two scores required.\");\n            return 0;\n        } else {\n \
  \           double total = 0;\n            for (int i = 0; i < testScores.length;\
  \ i++) {\n                total += testScores[i];\n            }\n            double\
  \ lowest = getLowest();\n            return (total - lowest) / (testScores.length\
  \ - 1);\n        }\n    }\n}\n```\n\n**代码列表 8-13 (`CalcAverage.java`)**\n\n```java\n\
  import java.util.Scanner;\n\npublic class CalcAverage {\n    public static void\
  \ main(String[] args) {\n        Scanner input = new Scanner(System.in);\n     \
  \   System.out.print(\"How many test scores do you have? \");\n        int count\
  \ = input.nextInt();\n        double[] scores = new double[count];\n        for\
  \ (int i = 0; i < count; i++) {\n            System.out.print(\"Enter score #\"\
  \ + (i + 1) + \": \");\n            scores[i] = input.nextDouble();\n        }\n\
  \        Grader grader = new Grader(scores);\n        System.out.println(\"Your\
  \ adjusted average is \" + grader.getAverage());\n        System.out.println(\"\
  Your lowest test score was \" + grader.getLowest());\n    }\n}\n```\n\n**程序输出，示例输入加粗显示**\n\
  \n```\nHow many test scores do you have? 4\nEnter score #1: 100\nEnter score #2:\
  \ 100\nEnter score #3: 40\nEnter score #4: 100\nYour adjusted average is 100.0\n\
  Your lowest test score was 40.0\n```\n\n\n\n\n有时，你需要在数组中存储一系列项，但你并不知道这些项的数量。因此，你不知道数组所需的确切元素个数。一种解决方案是让数组足够大，以容纳最多可能数量的项。然而，这会导致另一个问题。如果数组中实际存储的项数少于元素的个数，则该数组将是部分填充的。当你处理一个部分填充的数组时，你必须只处理包含有效数据项元素。部分填充的数组通常与伴随的整数变量一起使用，该变量存储数组中存储的数量。例如，假设一个程序使用以下代码创建一个包含\
  \ 100 个元素的数组，以及一个名为 `count` 的 `int` 变量，该变量将存储数组中存储的项：\n\n```java\nfinal int ARRAY_SIZE\
  \ = 100;\nint[] array = new int[ARRAY_SIZE];\nint count = 0;\n```\n\n每当我们向数组添加一个项时，都必须增加\
  \ `count`。以下代码演示了：\n\n![Image](img/00563.jpg)\n\n此哨兵控制循环的每次迭代都允许用户输入一个要存储在数组中的数字，或者输入\
  \ –1 退出。`count` 变量用作数组中下一个可用元素的下标，然后递增。当用户输入 –1 或 `count` 达到数组大一时，循环停止。以下代码显示了数组中所有的有效项：\n\
  \n![Image](img/00564.jpg)\n\n注意，此代码使用 `count` 来确定要使用的最大数组下标。\n\n![Image](img/00005.jpg)\n\
  \n**注意：** 如果将部分填充的数组作为参数传递给方法，则存储数组中项数的变量也必须作为参数传递。否则，该方法将无法确定存储在数组中的数量。\n\n## 数组与文件的操作\n\
  \n将数组的内容保存到文件中是一个简单的过程：使用循环遍历数组的每个元素，并将其内容写入文件。例如，假设程序如下所示声明了一个数组：\n\n```java\n\
  int[] numbers = { 10, 20, 30, 40, 50 };\n```\n\n以下代码打开名为 `Values.txt` 的文件，并将 `numbers`\
  \ 数组中每个元素的内容写入文件：\n\n![Image](img/00565.jpg)\n\n以下代码演示了如何打开 `Values.txt` 文件并将其内容读回\
  \ `numbers` 数组中。\n\n![Image](img/00566.jpg)\n\n打开文件后，通过一个 `while` 循环将文件中的所有值读入 `numbers`\
  \ 数组中。只要 `inputFile.hasNext()` 返回 `true` 且 `index` 小于 `numbers.length`，循环就会重复。调用\
  \ `inputFile.hasNext()` 方法是为了确保文件中还有剩余的值。这防止了在文件包含的值不足以填充数组时发生错误。第二个条件（`index <\
  \ numbers.length`）防止循环写入到数组边界之外。\n\n## 8.5 从方法返回数组\n\n> **概念：除了接受数组作为参数外，方法还可以返回数组。**\n\
  \n方法可以返回数组的引用。为了做到这一点，必须正确声明方法的返回类型。例如，查看以下方法定义：\n\n![Image](img/00567.jpg)\n\n\
  `getArray` 方法返回一个 `double` 数组。注意方法头中列出的返回类型是 `double[]`。方法头如图图 8-13 所示。它表示该方法返回一个\
  \ `double` 数组的引用。\n\n**图 8-13** 数组引用返回类型\n\n![Image](img/00568.jpg)\n\n在方法内部创建一个\
