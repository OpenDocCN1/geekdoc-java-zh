  `Item #2: Wheels of Fury`\n`Price: $12.95`\n\n使用接口引用变量有一些局限性。如前提到的，你不能创建接口的实例。此外，当接口变量引用一个对象时，你可以使用该接口变量调用接口中指定的方法。例如，查看代码：\n\
