  \ FileInputStream(\"MyInfo.dat\");\nDataInputStream inputFile = new DataInputStream(fstream);\n\
  ```\n\n也可以使用以下将这两个语句合并为一条的代码：\n\n```java\nDataInputStream inputFile =\n    new DataInputStream(new\
  \ FileInputStream(\"MyInfo.dat\"));\n```\n\n如果找不到由字符串参数命的文件，`FileInputStream` 构造函数将抛出\
