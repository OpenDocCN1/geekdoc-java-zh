  \n## 2.3 变量与字面量\n\n> **概念：变量是内存中的命名存储位置。字面量是写入程序代码中的值。**\n\n正如你在第 1 章中发现的那样，变量允许你在内存中存储和处理数据。编程工作的一部分是确定程序需要多少变量以及它们将持有什么类型的数据。代码列表\
  \ 2-7 中的程序是一个带有变量的 Java 程序示例。\n\n**代码列表 2-7 (`Variable.java`)**\n\n![Image](img/00043.jpg)\n\
  \n\n\n\n\n# 程序输出\n\n`The value is 5`\n\n***\n\n让我们更仔细地观察这个程序。这里是第 7 行：\n\n```java\n\
  int value;\n```\n\n***\n\n![Image](img/00009.jpg)\n\n## 声明变量\n\n***\n\n这被称为*变量声明*。变量在使用之前必须进行声明。变量声明告诉编译器变量的名称以及它将存储的数据类型。这一行表示变量名称为\
  \ `value`。`int` 单词代表整数（integer），因此 `value` 将仅用于存储整数。注意变量声明以分号结尾。该程序中的下一条语句出现在第 9\
  \ 行：\n\n```java\nvalue = 5;\n```\n\n这被称为赋值语句。等号（`=`）是一个运算符，它将其右侧的值（在此例中 `5`）存储到左侧命名的变量中。执行此行后，`value`\
  \ 变量将包含值 `5`。\n\n![Image](img/00005.jpg)\n\n***\n\n**注意：** 这一行不会在计算机屏幕上打印任何内容。它在后台静默运行。\n\
  \n***\n\n现在看第 10 行和第 11 行：\n\n```java\nSystem.out.print(\"The value is \");\nSystem.out.println(value);\n\
  ```\n\n第 10 行的语句将字符串字面量“The value is ”发送给 `print` 方法。第 11 行的语句将 `value` 变量名发送给 `println`\
  \ 方法。当你将变量名发送到 `print` 或 `println` 时，变量的内容会被显示。注意 `value` 周围没有引号。看看代码列表 2-8 中发生的情况。\n\
  \n### 代码列表 2-8 (`Variable2.java`)\n\n![Image](img/00044.jpg)\n\n***\n\n# 程序输出\n\n\
  `The value is value`\n\n***\n\n当单词 `value` 周围加上双引号时，它就变成了一个字符串字面量，而不是变量名。当字符串字面量被发送到\
  \ `print` 或 `println` 时，它们将按照引号内部的形式完整显示。\n\n### 使用 `+` 运算符显示多个项目\n\n当 `+` 运算符与字符串一起使用时，被称为*字符串拼接运算符*。拼接（concatenate）意味着附加，因此字符串拼接运算符会将一个字符串附加到另一个后面。例如，看以下语句：\n\
  \n```java\nSystem.out.println(\"This is \" + \"one string.\");\n```\n\n这条语句将打印：\n\
  \n`This is one string.`\n\n`+` 运算符产生一个由用作操作数的两个字符串组合而成的字符串。你也可以使用 `+` 运算符将变量的内容拼接到字符串。以下代码显示了一个示例：\n\
  \n```java\nnumber = 5;\nSystem.out.println(\"The value is \" + number);\n```\n\n\
  第二行使用 `+` 运算符将 `number` 变量的内容与字符串“The value is ”拼接起来。尽管 `number` 不是字符串，但 `+` 运算符会将它的值转换为字符串，然后将该值与第一个字符串拼接。将显示的输出是：\n\
  \n`The value is 5`\n\n有时，你与 `print` 或 `println` 使用的参数太长了，无法放在程序代码的单行中。然而，字符串字面量不能从某行开始并在另一行结束。例如，以下内容会导致错误：\n\
  \n```java\n// 这是一个错误！\nSystem.out.println( \"Enter a value that is greater than\
  \ zero and less than 10.\" );\n```\n\n你可以通过将参数拆分为较小的字符串字面量，然后使用字符串拼接运算符将其分散到多行来解决这个问题。这是一个示例：\n\
  \n```java\nSystem.out.println(\"Enter a value that is \" +\n                   \"\
  greater than zero and less \" +\n                   \"than 10.\");\n```\n\n在这一语句中，参数被拆分成三个字符串并使用\
  \ `+` 运算符连接。以下示例显示了当变量的内容拼接的一部分时使用相同的技术：\n\n```java\nsum = 249;\nSystem.out.println(\"\
  The sum of the three \" +\n                   \"numbers is \" + sum);\n```\n\n###\
  \ 注意引号\n\n如代码列表 2-8 所示，在单词 `value` 周围加上引号，它就变成了一个字符串字面量，而不是变量名。当字符串字面量被发送到 `print`\
  \ 或 `println` 时，它们将按照引号内部的形式完整显示。\n\n\n\n\n字母 `O` 的大写使得 `itemsOrdered` 更易于读。通常，变量名以小写字母开头，此之后，组成变量名的每个单词的首字母都要大写。\n\
  \n以下是所有标识符必须遵循的一些特定规则：\n\n> • 第一个字符必须是字母 `a–z`、`A–Z`、下划线 (`_`) 或美元符号 (`$`) 之一。\n\
  > • 在第一个字符之后，可以使用字母 `a–z` 或 `A–Z`、数字 `0–9`、下划线 (`_`) 或美元符号 (`$`)。\n> • 大写和小写字母是有区分的。这意味着\
  \ `itemsOrdered` 与 `itemsordered` 不同。\n> • 标识符不能包含空格。\n\n![Image](img/00005.jpg)\n\
  \n* * *\n\n注意：尽管 `$` 是合法的标识符字符，但它通常用于特殊用途。因此，不要在变量名中使用它。\n\n* * *\n\n表 2-4 显示了变量名列表，并说明了每个在\
  \ Java 中是合法还是非法。\n\n**表 2-4** 一些变量名\n\n![Image](img/00047.jpg)\n\n### 类名\n\n如前所述，标准做法是变量名以小写字母开头，然后将名称中后续每个单词的首字母大写。同样的标准做法是将类名的首字母及其包含的后续每个单词的首字母大写。这有助于区分变量名和类名。例如，`payRate`\
  \ 是一个变量名，而 `Employee` 是一个类名。\n\n#### ![Image](img/00004.jpg) 检查\n\n> 2.10 检查以下程序。\n\
