  \n**图 3-21** 与 `LogicalOr` 程序的交互\n\n![Image](img/00164.jpg)\n\n### `!` 运算符\n\n`!`\
  \ 运算符执行逻辑非操作。它是一个一元运算符，接受一个 `boolean` 表达式作为操作数并反转其逻辑值。换句话说，如果表达式为 `true`，`!` 运算符返回\
  \ `false`；如果表达式为 `false`，它返回 `true`。这里是一个使用 `!` 运算符的 `if` 语句：\n\n```\nif (!(temperature\
  \ > 100))\n    System.out.println(\"This is below maximum.\");\n```\n\n首先评估表达式 `(temperature\
  \ > 100)`。如果 `(temperature > 100)` 为 `true`，`!` 运算符返回 `false`。如果 `(temperature >\
  \ 100)` 为 `false`，它返回 `true`。之前的代码等于询问：“温度是否大于 100？”\n\n表 3-8 显示了 `!` 运算符的真值表。\n\
  \n**表 3-8** `!` 运算符的真值表\n\n![Image](img/00165.jpg)\n\n#### 逻辑运算符的优先级和结合性\n\n与其他运算符一样，逻辑运算符也有优先级顺序。表\
  \ 3-9 显示了逻辑运算符的优先级，从高到低。\n\n**表 3-9** 逻辑运算符优先级\n\n![Image](img/00166.jpg)\n\n`!`\
  \ 运算符的优先级高于 Java 的许多其他运算符。你应该始终将其操作数放在括号内，除非你将其应用于没有其他运算符的变量或简单表达式。例如，考虑以下表达式（假设\
  \ `x` 是一个存储值的 `int` 变量）：\n\n```\n!(x > 2)\n!x > 2\n```\n\n第一个表达式将 `!` 运算符应用于 `x\
  \ > 2`。它在询问：“x 是否大于 2？”。然而，第二个表达式尝试仅将 `!` 运算符应用于 `x`。它在询问：“x 的逻辑反是否大于 2？”。由于 `!`\
  \ 运算符只能应用于 `boolean` 表达式，该语句将导致编译错误。\n\n逻辑运算符从左到右评估它们的表达式。在以下表达式中，`a < b` 在 `y ==\
  \ z` 之前被评估。\n\n```\na < b || y == z\n```\n\n在以下表达式中，`y == z` 先被评估，但因为 `&&` 运算符的优先级高于\
  \ `||`。\n\n```\na < b || y == z && m > j\n```\n\n该表达式等于以下：\n\n```\n(a < b) || ((y\
  \ == z) && (m > j))\n```\n\n表 3-10 显示了我们目前为止讨论过的所有运算符的优先级。此表包含了赋值、算术、关系和逻辑运算符。\n\
  \n\n\n\n有时你可能需要编写代码来判断一个数值是否在特定的数值范围内或在特定范围之外。在判断一个数字是否在某个范围内时，最好是使用 `&&` 运算符。例如，下面的\
  \ `if` 语句检查 `x` 中的值，以确定它是否在 20 到 40 的范围内：\n\n```\nif (x >= 20 && x <= 40) {\n  \
  \  System.out.println(x + \" is in the acceptable range.\");\n}\n```\n\n`if` 语句中的\
  \ `boolean` 表达式仅在 `x` 大于或等于 20 且小于或等于 40 时才为 `true`。`x` 的值必须在 20 到 40 的范围内，该表达式的结果才为\
  \ `true`。\n\n在判断一个数字是否在某个范围之外时，最好是使用 `||` 运算符。以下语句判断 `x` 是否在 20 到 40 的范围之外：\n\n\
  ```\nif (x < 20 || x > 40) {\n    System.out.println(x + \" is outside the acceptable\
  \ range.\");\n}\n```\n\n不要混淆这些逻辑运算符的逻辑。例如，接接 `if` 语句中的 `boolean` 表达式永远不会测试为 `true`：\n\
  \n```\nif (x < 20 && x > 40) {\n    System.out.println(x + \" is outside the acceptable\
  \ range.\");\n}\n```\n\n显然，`x` 不可能在小于 20 的同时大于 40。\n\n##### ![Image](img/00004.jpg)\
