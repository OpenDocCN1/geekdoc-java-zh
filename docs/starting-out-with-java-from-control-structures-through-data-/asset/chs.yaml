  \n> 21.5 请列举一个日常生活中的例子，说明一组物品的行为类似于一个栈。\n\n## 21.4 队列及其应用\n\n> **概念：队列是一个按照先入队（first-in-first-out）方式访问的元素集合。**\n\
  \n你在上一节中看到，栈是一个按照后进先出（last-in-first-out）方式访问的元素集合。队列类似于栈，但它的元素添加和移除遵循先入队的方式。队列和栈一样，在现实世界有很多应用。例如，在杂货店收银台前，队列中的第一个客户是第一个被服务的。\n\
  \n队列在计算机科学中有许多应用。例如，考虑一个必须共享一台打印机的计算机网络。打印机服务器与打印机关联一个队列，来自各种计算机的打印任务被添加到此队列中。打印任务从队列中取出，并按照来来服务的方式进行处理。\n\
  \n队列可以看作是一个列表，其中一端被指定为队列的 `front`（头），另一端被指定为 `rear`（尾）。我们在队列的尾部添加元素，从头部移除元素。队列需要支持以下操作：\n\
  \n- `enqueue(x)`：在队列的尾部添加一个新元素 `x`\n- `dequeue()`：移除并返回队列头部的元素\n- `empty()`：检查队列是否为空\n\
  - `peek()`：返回但不移除队列头部的元素\n\n## 21.5 队列的数组实现\n\n> **概念：可以使用固定大小的数组来实现队列。**\n\n要使用数组实现队列，我们需要一个数组\
  \ `q` 和两个整数索引 `front` 和 `rear`。假设我们要实现一个存储字符串的队列，我们如下所示声明这些变量：\n\n* *\n\n![Image](img/00009.jpg)\n\
  \n**队列的数组实现**\n\n* * *\n\n```\nString [] q;\nint front, rear;\n```\n\n建立一个规定变量 `front`\
  \ 和 `rear` 如何使用的条件是有帮助的，并要求所有操作 `front` 和 `rear` 的队列方法都保持该条件。这个条件（我们称之为*队列不变性*，*queue\
  \ invariant*）如下：\n\n- `front` 是 `q` 中存放下一个将要出队的元素的槽位的索引。该槽位通常是填充的。\n- `rear` 是 `q`\
  \ 中存放下一个将要入队的元素的槽位的索引。该槽位通常是空的。\n\n初始时，队列为空，根据队列不变性的要求，`front` 和 `rear` 都初始化为 0（第一个存储的元素将存放在\
  \ 0 位，第一个移除的元素将从 0 位取出）。队列不变性在图 21-4 中所示。\n\n现在假设我们要向队列中添加一个元素 `s`。队列不变性说我们应该将 `s`\
  \ 存储在槽位 `q[rear]` 中，然后增加 `rear` 使指向下一个空槽位，如下：\n\n```\nq[rear] = s;\nrear ++;\n```\n\
  \n因此，在添加一个元素后，`rear` 将变为 1；添加第二个元素后，`rear` 将变为 2。此时 `front` 仍为 0。这在图 21-4 的前两行中所示。\n\
  \n**图 21-4** 基于数组的队列的使用\n\n![Image](img/01579.jpg)\n\n现在考虑移除元素的操作。要移除的元素是 `q[front]`。我们保存该位置的值以便将其返回给调用者，将队列条目设置为\
  \ `null`，并增加 `front` 以指向下一个将要出队的元素。\n\n```\nString value = q[front];\nq[front] =\
  \ null;\nfront ++;\n```\n\n\n\n\n\n```\nfront = 2; rear = 1\n0 Elaine\n1 ?\n2 Carol\n\
  3 Deborah\n```\n\n#### 队列演示程序的 GUI 前端\n\n现在我们来描述在代码列表 21-7 中实现的队列的图形化用户界面。图 21-6\
  \ 显示了用户在从一个大小为 4 的队列开始，添加三个名称，然后移除一个名称后用户界面的截图。\n\n**图 21-6** 队列程序的 GUI 前端截图\n\n\
