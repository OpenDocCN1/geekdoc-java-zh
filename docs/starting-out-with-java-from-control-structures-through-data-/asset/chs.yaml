  \n***\n\n### 浅目录搜索\n\n#### 9. 浅目录搜索\n编写一个搜索指定文件的程序。假设该文件存储在根目录或根目录的子文件夹中。如果找到文件，程序应打印通往文件的文件夹路径。如果未找到文件，程序应打印：*The\
  \ file was not found.*（未找到文件。）\n\n***\n\n## 第 20 章 链表\n\n### 话题\n- 20.1 链表简介\n-\
  \ 20.2 链表上的操作\n- 20.3 双向链表和循环链表\n- 20.4 链表上的递归\n- 20.5 需要避免的常见错误\n\n## 20.1 链表简介\n\
  **链表是列表的一种实现，其中元素存储在节点中，每个节点都包含指向其后继节点的链接。**\n\n正如你在第 19 章中所学习的，列表是一个按位置顺序存储元素的集合。列表中的每个元素都与其在列表中对应的索引关联。第一个元素的索引为\
  \ 0，第二个元素的索引为 1，依此类推。\n\n这种基于位置的顺序引入了每个元素的前驱和后继的概念：如果 *X* 是索引为 *k* 的列表元素，那么它的*后继*是索引为\
  \ *k* + 1 的元素，而它的*前驱*是索引为 *k* – 1 的元素。列表第一个元素没有前驱，最后一个元素没有后继。\n\n分配列表元素的存储有两种方法：连续分配和链接分配。第\
  \ 19 章](#dummy_split_026.html_filepos305877)中的数组列表使用*连续分配*，即在连续的内存位置为连续的元素分配存储。连续分配的缺点是在列表中间插入或删除元素时，需要移动大量元素。\n\
  \n*链接分配*不需要连续的内存位置来存储元素。相反，它在每个元素处存储一个指向其后继节点内存位置的指针。*链表*是使用链接分配的列表。在 Java 中，链表被实现为节点的序列，其中每个节点存储一个列表元素以及指向列表中下一个节点的引用。\n\
  \n\n\n\n一旦我们有了合适的 `Node` 类，就可以通过创建节点并设置它们的后继链接来创建链表，后继链接反映了列表对其元素施加的顺序。构建链表的一系列语句所示在图\
  \ 20-1 中。在图中，一个 `Node` 对象被显示为一个矩形框，其中一个隔间用于存储元素，另一个隔间用于后继引用 `next`。\n\n图 20-1 中的第一条语句\n\
  \n```java\nNode myList = new Node(\"Bob\");\n```\n\n创建了一个包含单个元素 `\"Bob\"` 的链表。此时，`myList`\
  \ 指向一个包含字段 `myList.next` 的 `Node` 对象，该字段本身可以被设置为指向另一个节点：\n\n```java\nmy.next = new\
  \ Node(\"Carol\");\n```\n\n这创建了一个链表，其两个元素构成了 `\"Bob Carol\"` 序列。新添加的节点包含它自己的 `next`\
  \ 字段，可以通过表达式 `myList.next.next` 访问，并使其指向另一个节点：\n\n```java\nmyList.next.next = new\
  \ Node(\"Debby\");\n```\n\n在添加节点时，我们并不限于列表末尾。语句\n\n```java\nNode p = new Node(\"\
  Allan\", myList);\n```\n\n将新节点 `\"Allan\"` 添加到已累积元素列表的开头。该语句使用了双参数构造函数，该函数允许指定节点的后继节点。执行这四条语句的结果是如图\
  \ 20-1 底部所示的包含四个元素的列表。图中，`Node` 对象的 `next` 字段被显示为一个指向后继节点的箭头。穿过 `next` 字段的向后对角线表示\
  \ `null` 值，意味着该节点没有后继节点。\n\n**图 20-1** 向链表添加节点\n\n![Image](img/01493.jpg)\n\n除了在列表开头和末尾添加节点外，我们还可以将节点插入到中间。给定图\
  \ 20-1 所示的最终场景，我们可以通过编写以下代码在 `\"Bob\"` 之后添加 `\"Brad\"`：\n\n```java\nNode b = p.next;\
  \    // b 指向 \"Bob\"\n```\n\n```java\nNode c = b.next;   // c 指向 \"Carol\"\n```\n\
  \n```java\nb.next = new Node(\"Brad\", c);\n```\n\n执行这些语句将带我们图 20-2 所示的场景序列。\n\n\
  在刚刚展示的示例中，我们使用了两个辅助引用 `b` 和 `c` 在列表中间插入了一个节点。通常情况下，在开头之外任何位置添加新节点，都需要指向将成为前驱的节点的引用（在本例中为\
  \ `b`）以及指向将成为新节点后继的节点的引用（在本例中为 `c`）。然而，辅助变量并不总是需要的。例如，与其使用图 20-2 所示的三条语句，我们可以通过以下代码将\
  \ `\"Brad\"` 添加到列表中：\n\n```java\nmyList.next = new Node(\"Brad\", myList.next);\n\
  ```\n\n**图 20-2** 在链表中间插入节点\n\n![Image](img/01494.jpg)\n\n### 删除节点\n\n你通过“绕过”后继链接来从链表中删除节点。基本上，要从链表中间删除节点\
  \ `X`（例如图 20-3 所示的第一个链表中的 `Carol`），你必须首先获取导向其前驱（在本例中为 `Bob`）和后继（在本例中为 `Debby`）的引用。\n\
  \n```java\nNode b = p.next;       // Carol 的前驱\n```\n\n```java\nNode d = b.next.next;\
  \ // Carol 的后继\n```\n\n然后，你通过操纵引用以绕过 `X` 来删除目标节点 `X`，并使 `X` 的后继成为其前驱的后继：\n\n```java\n\
  b.next = d;\n```\n\n这一系列事件在图 20-3 中如所示。\n\n**图 20-3** 从链表中间删除节点\n\n![Image](img/01495.jpg)\n\
  \n正如你可能猜到的那样，删除节点不需要对目标节点的后继有显式的引用。以下代码段也从列表中删除了 `Carol`，而且更短：\n\n```java\nb = p.next;\n\
  b.next = b.next.next;\n```\n\n我们刚刚概述的从列表中间删除节点的程序在当要删除的节点是列表第一个节点时将不起作用。这是因为第一个节点没有前驱。你通过将头引用向前移动一个节点来删除列表开头的节点。例如，要从图\
  \ 20-3 的列表开头删除 `\"Allan\"`，只需：\n\n```java\np = p.next;\n```\n\n正如我们所见，添加和删除都需要对节点的前驱的引用。遍历列表是指对集合中的每个元素执行某些操作。\n\
  \n### 遍历列表\n\n*遍历*集合是系统地处理集合中元素的方法。要遍历列表，将一个引用（例如 `ref`）设置为第一个节点，直到它变为 `null`：\n\
  \n```java\nNode ref = myList;\nwhile (ref != null) {\n    System.out.println(ref.value);\n\
  \    ref = ref.next;\n}\n```\n\n图 20-1 构建了一个简单的链表并遍历其打印内容。程序的核心是 `LinkedList0` 类。该类使用私有的\
  \ `Node` 类来表示链表。`LinkedList0` 使用一个私有字段指向列表的第一个节点。\n\n**代码列表 20-1 (LinkedList0.java)**\n\
  \n![Image](img/01496.jpg)\n![Image](img/01497.jpg)\n![Image](img/01498.jpg)\n![Image](img/01499.jpg)\n\
  \n**程序输出**\n列表的内容为：\nAlice Bob Charlie David\n\n##### ![Image](img/00004.jpg)**Checkpoint\n\
  \n> 20.1 给出一系列语句，创建一个包含 `\"green blue\"` 的链表，通过创建一个 `\"green\"` 节点，然后是 `\"blue\"\
  ` 节点，最后是 `\"red\"` 节点，按顺序排列。\n\n> 20.2 考虑以下语句：\n\n```java\nNode colorList = new\
  \ Node(\"Yellow\", new Node(\"Purple\"));\ncolorList = new Node(\"Brown\", colorList);\n\
  System.out.print(colorList.value);\nSystem.out.print(colorList.next.value);\nSystem.out.print(colorList.next.next.value);\n\
  ```\n\n输出是什么？\n\n\n\n为了跟踪列表中的第一个和最后一个节点，引用 `first` 作为列表的头部，而 `last` 则用于能够快速地向列表末尾添加元素。当列表为空时，这两个引用都将被设置为\
  \ `null`。\n\n### `isEmpty` 方法\n\n我们可以通过评估表达式 `first == null` 来检查列表是否为空。`isEmpty`\
  \ 方法简单地返回该表达式的值：\n\n```java\nboolean isEmpty()\n{\n    return first == null;\n}\n\
  ```\n\n### `size` 方法\n\n链表中的元素数量可以通过将计数器初始化为 0，然后在每次遍历链表的每一步中递增计数器来确定。\n\n### `add`\
  \ 方法\n\n`add(String e)` 方法将新元素 `e` 添加到链表的末尾。如果列表为空，包含 `e` 的新节点将同时成为第一个节点和最后一个节点：\n\
  \n```java\n  first = new Node(e);\n  last = first;\n```\n\n如果列表不为空，则将新节点设置为上一个节点的后继，然后将引用\
  \ `last` 指向新节点：\n\n```java\n  last.next = new Node(e);\n  last = last.next;\n```\n\
  \n`add(int index, String e)` 方法稍微复杂一些。我们考虑了几种情况：\n\n- *索引无效。* 如果索引为负数或大于列表的大小，该方法将抛出一个异常。\n\
  - *索引为零。* 新节点将成为列表的第一个节点。如果列表之前为空，则必须将 `last` 设置为 `first`。\n- *索引大于零。* 该方法必须找到插入新节点的正确位置。它通过跳过\
  \ `index–1` 个节点来获取作为新节点前驱的节点，如下所示：\n\n```java\n  Node pred = first;\n  for (int\
  \ k = 1; k <= index – 1; k++)\n  {\n      pred = pred.next;\n  }\n```\n\n一旦找到前驱节点，就会创建新节点并将其拼接进来：\n\
  \n```java\npred.next = new Node(e, pred.next);\n```\n\n此时，该方法检查新节点现在是否为最后一个节点。如果是，则必须更新\
  \ `last` 以其指向新节点，如下：\n\n```java\n  if (pred.next.next == null)\n      last = pred.next;\n\
  ```\n\n### `remove` 方法\n\n`remove` 方法的逻辑与相应的 `add` 方法类似。让我们考虑 `remove(int index)`\
  \ 方法。同样考虑了许多不同的情况：\n\n- *索引无效。* 如果索引为负数或大于或等于列表的大小，该方法将抛出一个异常。\n- *索引为零。* 此时要删除的元素是列表中的第一个。该方法移动\
  \ `first` 以移除第一个节点。如果列表现在为空，则必须将 `last` 设置为 `null`。\n- *索引大于零。* 在这种情况下，方法将引用 `pred`\
  \ 设置为目标删除节点的前驱。然后移除目标节点。如果被删除的节点位于列表末尾，则必须重置 `last` 指向其前驱：\n\n```java\n     pred.next\
  \ == pred.next.next;\n     if (pred.next == null)\n        last = pred;\n```\n\n\
  ### `toString` 方法\n\n该方法返回列表内容的字符串表示，用于在 GUI 组件中显示列表。该方法将每个列表元素的字符串值附加到 `StringBuilder`\
  \ 对象中，并返回该对象的字符串表示。`StringBuilder` 类在许多方面与 [第 10 章] 中涵盖 `StringBuffer` 类相似并具有相同的方法。\n\
