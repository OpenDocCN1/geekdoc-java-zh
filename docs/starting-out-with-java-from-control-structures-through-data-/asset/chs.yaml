  \ **`999 [Enter]`**\n\n`999 was not found.`\n\n`Do you want to search again? (Y\
  \ or N):` **`n [Enter]`**\n\n***\n\n## 二分查找的效率\n\n对于排序后的数组，二分查找的效率比顺序搜索高得多。每当它比较并未能找到所需项时，它都会排除待搜索部分的一半。例如，考虑一个拥有\
  \ 1,000 个元素的数组。\n\n如果二分查找在第一次尝试时未能找到元素，剩余需要搜索的元素数量为 500。如果第二次尝试仍未找到元素，剩余需要搜索的元素数量为\
  \ 250。这个过程一直持续，直到二分查找找到所需项或确定其不在数组中。对于 1,000 个元素，这只需要不超过 10 次比较。（与顺序搜索相比，后者平均需要\
  \ 500 次比较！）\n\n使用 2 的幂来计算二分查找在任何大小的数组上将进行的最大比较次数。只需找到大于或等于数组元素数量的最小 2 的幂。例如，对于一个拥有\
  \ 20,000 个元素的数组，最多将进行 15 次比较（2¹⁵ = 32,768），对于 1,000,000 个元素，最多将进行 20 次比较（2²⁰ = 1,048,576）。\n\
  \n## 递归二分查找\n\n二分查找也可以递归实现。例如，该过程可以表示如下：\n\n```\n如果 array[middle] 等于搜索值，则找到了该值。\n\
  否则如果 array[middle] 小于搜索值，则对数组的上半部分执行二分查找。\n否则如果 array[middle] 大于搜索值，则对数组的下半部分执行二分查找。\n\
  结束\n```\n\n当将递归算法与其迭代对应版本进行比较时，显而易见递归版本更加优雅且易于理解。代码列表 16-16 显示了 `RecursiveBinarySearcher`\
  \ 类。该类提供了一个公共静态方法 `search`，通过递归 `binarySearch` 在整型数组中查找值。代码列表 16-17 中的程序测试了该方法。\n\
