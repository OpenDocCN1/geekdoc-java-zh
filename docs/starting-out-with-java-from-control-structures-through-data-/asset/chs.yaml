  \   d. 参数声明\n   e. 以上都是\n   f. 以上都不是\n\n5. 调用方法时传入方法的值被称为 __________。\n   a. 参数\n\
  \   b. 实参参数\n   c. 信号\n   d. 返回值\n\n6. 接收传入方法的值的变量被称为 __________。\n   a. 参数\n  \
  \ b. 实参\n   c. 信号\n   d. 返回值\n\n7. 用于文档参数的 javadoc 标签是。\n   a. `@parameter`\n  \
  \ b. `@param`\n   c. `@paramvar`\n   d. `@arg`\n\n8. 该语句导致方法结束并将值传回调用语句。\n   a.\
  \ `end`\n   b. `send`\n   c. `exit`\n   d. `return`\n\n9. 用于文档方法返回值的 javadoc 标签是。\n\
  \   a. `@methodreturn`\n   b. `@ret`\n   c. `@return`\n   d. `@returnval`\n\n10.\
  \ 方法头部以分号结束。\n11. 有时，向方法传递参数时，Java 将自动执行宽转换（转换为更高排名的数据类型）。\n12. 有时，向方法传递参数时，Java\
  \ 将自动执行窄转换（转换为低排名的数据类型）。\n13. 参数变量的作用域是包含声明该参数整个程序。\n14. 当方法中的代码更改参数变量的值时，它也会更改传入该参数的参数的值。\n\
  15. 当将对象（如 `String`）作为参数传递时，传递的实际上是该对象的引用。\n16. `String` 对象的内容无法更改。\n17. 向方法传递多个参数时，传递参数的顺序并不重要。\n\
  18. 同一个程序中的没有两个方法可以具有相同名的局部变量。\n19. 一个方法可以访问在另一个方法中声明的局部变量。\n\n\n\n\n\n## 20. **对或错：**\
  \ 在有返回值的方法中，必须有一个 `return` 语句。\n\n### 寻找错误\n\n1.  在以下方法定义中找到错误：\n\n```java\n// 这个方法有一个错误！\n\
  public static void sayHello();\n{\n    System.out.println(“Hello”);\n}\n```\n\n\
  2.  查看以下方法头：\n\n```java\npublic static void showValue(int x)\n```\n以下代码包含对 `showValue`\
