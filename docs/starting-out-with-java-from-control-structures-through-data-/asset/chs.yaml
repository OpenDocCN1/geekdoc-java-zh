  \ Java 应用程序必须具有：\n> a) 一个名为 `main` 的方法\n> b) 多个类定义\n> c) 一个或多个注释\n\n\n\n\n\n在 Java\
  \ 中执行输出以及许多其他任务都是通过使用 Java API 完成的。`API` 一术代表“应用程序编程接口”（Application Programmer Interface）。`API`\
  \ 是一个由预写类组成的标准库，用于执行特定操作。这些类及其方法对所有 Java 程序都可用。`print` 和 `println` 方法是 `API` 的一部分，提供了在标准输出设备上显示输出的方法。\n\
  \n代码列表 2-1 中的程序（`Simple.java`）使用以下语句在屏幕上打印一条消息：\n\n```java\nSystem.out.println(\"\
  Programming is great fun!\");\n```\n\n`System` 是 Java API 的一个类。`System` 类包含了执行系统级操作的对象和方法。`System`\
  \ 类包含的对象之一名为 `out`。`out` 对象具有 `print` 和 `println` 等方法，用于在系统控制台或标准输出设备上执行输出。`System`、`out`、`print`\
  \ 和 `println` 之间的层次关系如图图 2-3 所示。\n\n**图 2-3** `System` 类、`out` 对象以及 `print` 和 `println`\
  \ 方法之间的关系\n\n![Image](img/00034.jpg)\n\n以下是它们如何共同运行的简要总结：\n\n> `System` 类是 Java\
  \ API 的一部分。它具有执行系统级操作的成员对象和方法，例如向控制台发送输出。\n> `out` 对象是 `System` 类的成员。它提供了向屏幕发送输出的方法。\n\
  > `print` 和 `println` 方法是 `out` 对象的成员。它们实际上执行了在屏幕上写入字符的工作。\n\n这种层次结构解释了为什么执行 `println`\
  \ 的语句如此长。序列 `System.out.println` 指定了 `println` 是 `out` 的成员，而 `out` 是 `System` 的成员。\n\
  \n![Image](img/00005.jpg)\n\n***\n\n**注意：** 分隔对象名称的句号读作“dot”。`System.out.println`\
  \ 读作“system dot out dot print line”。\n\n***\n\n要显示在屏幕上的值放在括号内。这个值被称为 `argument`（参数）。例如，以下语句使用字符串\
  \ `\"King Arthur\"` 作为其参数执行 `println` 方法。这将在屏幕上打印“King Arthur”（引号不会显示）。\n\n```java\n\
  System.out.println(\"King Arthur\");\n```\n\n关于 `println` 方法需要知道的一个重要点是，在显示完消息后，它会将光标移动到下一行的开头。屏幕上打印的下一个项目将从此位置开始。例如，看代码列表\
  \ 2-2 中的程序。\n\n由于代码列表 2-2 中的每个字符串都是使用单独的 `println` 语句打印的，因此它们在程序输出中显示在不同的行。\n\n\
  **代码列表 2-2 (`TwoLines.java`)**\n\n![Image](img/00035.jpg)\n\n***\n\n**程序输出**\n\n\
  ```\nProgramming is great fun!\nI can't get enough of it!\n```\n\n***\n\n### `print`\
  \ 方法\n\n`print` 方法也是 `System.out` 对象的一部分，其作用与 `println` 类似——在屏幕上显示输出。然而，`print`\
  \ 方法在显示完消息后不会将光标移动到下一行。看代码列表 2-3。\n\n**代码列表 2-3 (`GreatFun.java`)**\n\n![Image](img/00036.jpg)\n\
  \n***\n\n**程序输出**\n\n```\nProgramming is great fun!\n```\n\n***\n\n关于代码列表 2-3 需要理解的一个重要概念是，虽然输出被拆分成了两个语句，但该程序仍然在一行上显示消息。你发送到\
  \ `print` 方法的数据以连续流的形式显示。有时这可能会产生不理想的结果。代码列表 2-4 中的程序就是一个例子。\n\n**代码列表 2-4 (`Unruly.java`)**\n\
  \n![Image](img/00037.jpg)\n\n***\n\n**程序输出**\n\n```\nThese are our top sellers:CoffeeAspir\n\
  ```\n\n***\n\n实际输出的布局与源代码中字符串的排列完全不同。首先，尽管输出在源代码中被拆分为四行（第 7 到第 10 行），但它以单行的形式输出。其次，注意显示的某些单词之间没有空格分隔。字符串完全按照它们发送到\
  \ `print` 方法的方式进行显示的。如果需要显示空格，它们必须出现在字符串中。\n\n修复此程序有两种方法。最明显的方法是使用 `println` 方法代替\
  \ `print` 方法。另一种方法是使用转义序列将输出分离到不同的行。`转义序列`以反斜杠（`\\`）开头，后跟一个或多个`控制字符`。它允许你通过在字符串中嵌入命令来控制输出的显示。导致输出光标移动到下一行的转义序列是\
  \ `\\n`。代码列表 2-5 展示了它的用法。\n\n**代码列表 2-5 (`Adjusted.java`)**\n\n![Image](img/00038.jpg)\n\
  \n***\n\n**程序输出**\n\n```\nThese are our top sellers:\nComputer games\nCoffee\nAspirin\n\
  ```\n\n***\n\n`\\n` 字符被称为换行转义序列。当 `print` 或 `println` 方法在字符串中遇到 `\\n` 时，它们不会在屏幕上打印\
  \ `\\n`，而是将其解释为移动光标到下一行的特殊命令。还有其他转义序列。例如 `\\t` 是制表符转义序列。当 `print` 或 `println` 遇到它时，会导致光标移动到下一个制表位置。代码列表\
  \ 2-6 显示了它的用法。\n\n**代码列表 2-6 (`Tabs.java`)**\n\n![Image](img/00039.jpg)\n\n***\n\
