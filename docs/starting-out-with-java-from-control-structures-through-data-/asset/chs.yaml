  \ 字段是私有的，子类无法直接访问它。为了在父类的 `score` 字段中存储值，子类必须调用父类的 `setScore` 方法。子类可以通过在方法类名前面加上\
  \ `super` 关键字和点（`.`）来调用其被重写的父类方法。\n\n**代码列表 11-14 (`CurvedActivityDemo.java`)**\n\
  \n![Image](img/00827.jpg)\n\n![Image](img/00828.jpg)\n\n**`加粗显示的示例输入程序输出`**\n\n\
  `输入学生的原始数值分数：` `87 [Enter]`\n`输入调整百分比：` `1.06 [Enter]`\n`原始分数为 87.0。`\n`调整后的分数为\
  \ 92.22`\n`考试等级为 A`\n\n该程序使用 `curvedExam` 变量来引用一个 `CurvedActivity` 对象。在第 32 行，使用以下语句调用\
  \ `setScore` 方法：\n\n```\ncurvedExam.setScore(score);\n```\n\n\n\n\n\n由于 `curvedExam`\
  \ 引用一个 `CurvedActivity` 对象，此语句调用了 `CurvedActivity` 类的 `setScore` 方法，而不是父类版本。\n\n\
  尽管子类可能会重写父类中的方法，但父类对象仍然会调用父类版本的方法。例如，以下代码创建了一个 `GradedActivity` 类的对象并调用了 `setScore`\
  \ 方法：\n\n```java\nGradedActivity regularExam = new GradedActivity();\nregularExam.setScore(85);\n\
  ```\n\n由于 `regularExam` 引用一个 `GradedActivity` 对象，这段代码调用了 `GradedActivity` 类的 `setScore`\
  \ 方法。\n\n## 重载与重写\n\n方法重载（Overloading）和方法重写（Overriding）之间存在区别。回想第 6 章中的内容，重载是指一个方法与另外一个或多个方法名称相同，但参数列表不同。虽然重载的方法名称相同，但它们的签名（signature）不同。然而，当一个方法重写另一个方法时，它们的签名是相同的。\n\
  \n重载和重写都可以发生在继承关系中。你已经知道重载的方法可以出现在同一个类中。此外，子类中的方法可以重载父类中的方法。如果类 `A` 是父类而类 `B` 是子类，则类\
  \ `B` 中的方法可以重载类 `A` 中的方法，也可以重载类 `B` 中的另一个方法。另一方面，重写只能发生在继承关系中。如果类 `A` 是父类而类 `B`\
  \ 是子类，则类 `B` 中的方法可以重写类 `A` 中的方法。但是，方法不能重写同一类中的另一个方法。列表总结了重载与重写的区别：\n\n> • 如果两个方法名称相同但签名不同，它们就是重载的。无论这两个方法是在同一个类中，还是一个方法在父类中另一个在子类中，结论都成立。\n\
  > • 如果子类中的方法与父类中的方法签名相同，则子类方法重写父类方法。\n\n重载与重写的区别非常重要，因为它们会影响子类中父类方法的访问性。当子类重载父类方法时，可以使用子类对象调用这两个方法。然而，当子类重写父类方法时，使用子类对象只能调用子类版本的方法。例如，查看代码列表\
  \ 11-15 中的 `SuperClass3` 类。它有两个名为 `showValue` 的重载方法。其中一个方法接受一个 `int` 参数，另一个接受一个\
  \ `String` 参数。\n\n**代码列表 11-15 (`SuperClass3.java`)**\n\n![Image](img/00829.jpg)\n\
