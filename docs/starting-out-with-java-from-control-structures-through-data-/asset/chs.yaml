  \   }\n        System.exit(0);\n    }\n}\n```\n\n`JOptionPane` 类对你的 Java 程序并不是自动可。任何使用\
  \ `JOptionPane` 类的程序都必须在文件开头包含以下语句：\n\n`import javax.swing.JOptionPane;`\n\n该语句告诉编译器去哪里寻找\
  \ `JOptionPane` 类，并使其对你的程序可用。\n\n`showInputDialog()` 方法总是返回一个 `String` 类型，即使用户输入的是数值数据。例如，如果用户在输入对话框中输入\
  \ 72，`showInputDialog()` 方法将返回字符串 `\"72\"`。如果用户点击取消按钮，`name` 将引用特殊值 `null`。\n\n\
  #### 将字符串输入转换为数字\n\n与 `Scanner` 类不同，`JOptionPane` 类没有读取不同数据类型值的方法。`showInputDialog()`\
  \ 方法总是返回用户输入的 `String`，即使用户输入的是数值数据。如果你希望在数学运算中使用用户输入，这可能会是一个问题，因为正如你所知，你不能对字符串进行数学运算。在这种情况下，你必须将输入转换。要将字符串值转换为数值，你使用表\
  \ 2-18 中列出的方法之一。\n\n**表 2-18** 将字符串转换为数字的方法\n\n![Image](img/00106.jpg)\n\n![Image](img/00005.jpg)\n\
