  \ `sum` 的方法，它可以接受任意数量的 `int` 值，然后返回这些值的和。我们可以像所示所示调用该方法：\n\n```\nresult = sum(10,\
  \ 20);\n```\n\n在这里，我们向方法传递了两个参数：10 和 20。在段代码执行后，值 30 将存储在 `result` 变量中。但是，该方法并不要求每次调用都接受两个参数。我们可以使用不同数量的参数再次调用该方法，如下：\n\
  \n```java\nint firstVal = 1, secondVal = 2, thirdVal = 3, fourthVal = 4;\nresult\
  \ = sum(firstVal, secondVal, thirdVal, fourthVal);\n```\n\n在这里，我们向方法传递了四个参数：`firstVal`（设置为\
