  * 21.9 需避免的常见错误\n\n## 21.1 栈及其应用\n\n> **概念：栈是一个项集合，允许以后进先出的方式对项进行添加和移除**。\n\n在第\
  \ 18 章中，你学习了链表、数组列表、向量以及 Java 集合框架的一部分其他类型的集合类。你在该章中学习的 `List` 类是非常通用的，允许在列表的任何位置添加和移除元素。许多应用程序以更受限的方式使用对象列表。例如，某个应用程序可能需要维护一个对象列表，该列表仅在末端进行添加和移除，甚至只在列表的一端进行添加和移除。在只允许在末端进行添加和移除的列表中，唯一可以移除的项是最后添加的项。这样的列表被称为`栈`，进行添加和移除的列表末端被称为`栈顶`。\n\
  \n#### 栈的示例与应用\n\n现实生活中有很多栈的例子。例如，当几辆车单排停放在狭窄的车道上时，最后停放的那辆车必须最先离开。另一个例子是食堂里的盘子堆。工作人员将盘子添加到栈的顶部，每位顾客从栈的顶部取一个盘子。\n\
  \n在计算机科学及其之外都有许多问题可以使用栈来解决。例如，所有的编程语言都允许程序员定义方法并在程序中的不同位置调用它们。计算机必须跟踪每个方法调用的`返回地址`，即程序中调用该方法的地方。然后，当方法执行\
  \ `return` 语句时，计算机就会使用这个返回地址。每当方法被调用时，计算机都会将其返回地址添加到栈中。稍后，当方法执行 `return` 时，计算机从栈中取出地址并将其作为\
  \ `return` 语句的目标地址。栈是正确的数据结构，因为最后一个调用的方法是第一个返回的。\n\n#### 栈操作\n\n栈可以看作是一种抽象数据类型，支持三个主要操作，传统称为\
  \ `push`、`peek` 和 `pop`。`push` 操作取单个项并将其添加到栈顶。`peek` 操作返回当前栈顶的项，但不移除它。`pop` 操作移除（并返回）当前存储在栈顶的项。\n\
  \nJava 集合框架提供了一个支持泛型类型的 `Stack` 类。该类位于 `java.util` 包中。表 21-1 列出了它的大部分方法。\n\n**表\
  \ 21-1** Stack 类方法\n\n![Image](img/01559.jpg)\n\n代码列表 21-1 是使用 `Stack` 类的简单演示。程序创建了一个栈并将\
  \ `String` 对象推入栈中。然后它不断弹出栈元素并打印弹出的值，直到栈为空。注意，栈的后进先出特性导致字符串弹出的顺序与它们推入的顺序相反。\n\n**代码列表\
  \ 21-1 (`StackDemo`)**\n\n![Image](img/01559.jpg)\n\n**输出**\n\n#### 类型的类型的栈\n\n\
  Java 集合框架提供的 `Stack` 类不直接接受基本类型。要对 `int` 或 `double` 等基本类型使用它，必须使用包装类。例如，为了拥有 `int`\
  \ 栈，你必须创建一个：\n\n`Stack<Integer>` \n\n然后你可以将基本类型的值传递给 `push` 方法，正如第 17 章中解释的那样，值会自动装箱。同样，从栈中弹出值会导致拆箱。基本类型的使用在代码列表\
  \ 21-2 中所示。程序向栈推入了一些数字，然后弹出它们。\n\n**代码列表 21-2 (`StackDemo2`)**\n\n![Image](img/01560.jpg)\n\
  \n**输出**\n\n## 21.2 栈的数组实现\n\n> **概念：可以使用数组存储栈项，并使用整数跟踪栈顶来实现栈**。\n\n栈仅仅是一个强制后进先出访问的列表。它的实现可以基于第\
  \ 17 章中学习的任何列表类型：`ArrayList`、`LinkedList` 或 `Vector`。事实上，栈的实现可以基于简单的数组。在本节和下一节中，我们将如何使用数组和链表来实现栈。\n\
  \n这个原理很简单。创建一个足够容纳任何时刻栈中所需的最大数量元素的数组，例如四个（实际应用程序中的栈容量可能大得多），并使用一个整数索引 `top` 指向数组中可以接收项的槽。因此，对于整数栈，你会有：\n\
  \n`int[] s = new int[4]; // 数组持有栈元素`\n`int top = 0; // 栈顶指针`\n\n变量 `top` 在这种用法下传统上被称为`栈顶指针`或简单称为`栈指针`。\n\
  \n#### 栈 Push 操作\n\n要推入新项 `x`，首先检查栈是否有空间。如果有，我们将其放在 `top` 指向的槽中，然后增加 `top`指向下一个槽。如果栈没有空间，我们抛出如下异常：\n\
  \n![Image](img/01561.jpg)\n\n`StackOverFlowException` 不是 Java 异常：它是我们必须定义的。图 21-1\
  \ 插图了从空栈开始并添加两个项的事件序列。\n\n**图 21-1** 向栈中推入项\n\n![Image](img/01562.jpg)\n\n#### 栈\
  \ `empty` 方法\n\n\n\n\n布尔表达式 `top == 0` 在栈为空时为真，在非空时为假，因此 `empty` 方法简单地返回该表达式的值：\n\
  \n```java\nreturn top == 0;\n```\n\n### 栈的 `peek` 和 `pop` 方法\n\n这两个栈方法 `peek` 和\
  \ `pop` 是相似的：它们在尝试访问栈顶元素之前，都会检查栈是否为空，如果栈为空，则抛出 `EmptyStackException`。`peek` 方法按如下方式返回栈顶的元素：\n\
  \n```java\nreturn s[top-1];\n```\n\n`pop` 方法需要返回与 `peek` 相同的值，但此外，它还需要递减栈指针，以指示当前持有栈顶元素的栈槽正变为可用。这通过以下方式实现：\n\
  \n```java\ntop --;\nreturn s[top];\n```\n\n我们在这里概述的代码将正确地实现一个整数栈。`Stack` 类使用了一个单独的文件\
  \ `StackExceptions.java`，该文件包含了 `RuntimeException` 类的以下子类的定义。这两个异常异常类将由我们的栈方法抛出。\n\
  \n```java\nclass StackOverFlowException extends RuntimeException\n{}\nclass EmptyStackException\
  \ extends RuntimeException\n{}\n```\n\n栈类的代码紧接着给出，如代码列表 21-3。\n\n**代码列表 21-3 (`ArrayStack.java`)**\n\
  \n![Image](img/01564.jpg)\n![Image](img/01565.jpg)\n![Image](img/01566.jpg)\n![Image](img/01567.jpg)\n\
  \n代码列表 21-4 所示的 `ArrayStackDemo` 类演示了该栈的使用。它有一个 `main` 方法，可以创建一个容量为 5 的栈，在其中存储一些整数，然后将它们弹出并打印出来。\n\
  \n**代码列表 21-4 (`ArrayStackDemo.java`)**\n\n![Image](img/01568.jpg)\n\n* * *\n\n\
  #### 程序输出\n\n```\n正在向栈中推入 10 20。\n栈顶的值为 20\n正在弹出并打印所有值：\n20 10\n```\n\n* * *\n\n\
  ### 对象栈\n\n代码列表 21-3 中的栈是一个整数栈。编写一个可以处理其他类型的栈是相似的。例如，若要写一个可以处理 `String` 对象的栈，我们将通过修改\
  \ `ArrayStack` 类，将所有引用栈中存储元素类型的 `int` 出现处改为 `String`。特别是，`peek`、`pop` 和 `push` 的参数和返回类型将发生如下变化：\n\
  \n`int peek()` 变为 `String peek()`\n`int pop()` 变为 `String pop()`\n`void push(int\
  \ x)` 变为 `void push(String x)`\n\n存放栈元素的数组类型也需要进行如下更改：\n\n`int [ ] s;` 变为 `String\
  \ [ ] s;`\n`s = new int[capacity]` 变为 `s = new String[capacity];`\n\n当栈被用于存储对象类型时，对\
  \ `pop` 方法必须进行另一项更改：指向被移除栈元素的数组条目必须设置为 `null`，以便对从栈中移除的元素进行垃圾回收，如下：\n\n```java\n\
  s[top-1] = null;\n```\n\n例如，修改后处理字符串对象的 `pop` 方法如下：\n\n![Image](img/01569.jpg)\n\
  \n在本章的稍后部分，我们将介绍如何使用泛型来编写一个适用于所有类型值的单个栈类。\n\n使用数组实现的一个缺点是在创建栈时需要固定数组的大小。如果使用栈的应用程序需要存储的项多于栈允许的大小，就会产生问题。基于链表实现数组可以避免这个问题。\n\
  \n## 21.3 栈的链表实现\n\n> **概念**：可以使用单向链表来持有栈元素，并让链的头部作为栈顶，从而实现栈。\n\n栈可以使用任何类型的列表来实现，包括\
  \ `java.util` 包中的 `LinkedList` 类，来持有栈元素。然而，`LinkedList` 类支持许多在我们需要栈时并不的操作的操作：例如，栈的大多数应用并不需要迭代器，也不需要从列表中间添加或删除元素的能力。我们可以通过基于我们自己编写的简单链表来避免这种开销。\n\
  \n链表将基于以下 `Node` 类，该类声明在 `LinkedStack` 类内部：\n\n![Image](img/01570.jpg)\n\n在 `LinkedStack`\
  \ 类内部，我们将有一个指向元素链表的引用。引用 `top` 将指向列表顶部的节点：该节点将在下一次调用 `pop` 时被移除。例如，从空栈开始并连续推入字符串\
  \ `\"Alice\"` 和 `\"Bob\"` 将导致如图 21-2 所示的情况。\n\n![Image](img/01571.jpg)\n\n**图 21-2**\
  \ 推入两个项后的栈\n\n![Image](img/01572.jpg)\n\n向栈推入 `\"Carol\"` 将产生如图 21-3](#dummy_split_028.html_filepos326541)所示的结果：\n\
  \n**图 21-3** 推入 \"Carol\" 的栈\n\n![Image](img/01573.jpg)\n\n此时，执行 `pop` 操作将移除 `\"\
  Carol\"` 并让我们回到图 21-2 所示的情况。\n\n#### 栈方法的实现\n\n`LinkedStack` 类将有一个指向元素链表的引用。引用 `top`\
  \ 将指向列表顶部的节点：该节点将在下一次调用 `pop` 时被移除。当 `top == null` 为真时，栈为空，因此 `empty` 方法简单地返回该表达式的值：\n\
  \n```java\npublic boolean empty()\n{\n    return top == null;\n}\n```\n\n`push`\
  \ 操作将新项 `s` 添加到头部：\n\n```java\ntop = new Node(s, top);\n```\n\n`peek` 方法返回头部节点的值：\n\
  \n```java\nreturn top.value;\n```\n\n`pop` 方法保存顶部节点的值，通过移动头部移除顶部节点，并返回保存的值：\n\n\
  ```java\nString retValue = top.value;\ntop = top.next;\nreturn retValue;\n```\n\n\
  `peek` 和 `pop` 在空栈上调用时都会抛出异常。最后，`LinkedStack` 类配备了一个 `toString` 方法，使用 `StringBuilder`\
  \ 对象创建该类的字符串表示。拥有此方法允许通过将其传递给 `System.out.print` 方法显示整个栈 `st`：\n\n```java\nSystem.out.println(st);\n\
  ```\n\n`LinkedStack` 类可见代码列表 21-5。\n\n**代码列表 21-5 (`LinkedStack.java`)**\n\n![Image](img/01574.jpg)\n\
