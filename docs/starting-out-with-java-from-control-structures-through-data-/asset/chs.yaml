  \ 188 行到 192 行的循环将后续元素向列表前端移动位置。如果找到了 `String` 并从列表中删除，该方法返回 `true`。如果未找到 `String`，该方法返回\
  \ `false`。\n\n![Image](img/01424.jpg)\n\n第二个 `remove` 方法从指定的索引处删除元素。一旦元素被删除，后续元素将向列表前端移动一个位置。该方法返回被删除元素的引用。如果指定了无效索引，该方法将如下抛出\
  \ `IndexOutOfBoundsException`：\n\n![Image](img/01425.jpg)\n\n### `resize` 方法\n\n\
