  \ 对象，然后要求用户输入员工数据。程序应显示总工资金额。\n\n![Image](img/00010.jpg)\n\n#### 6. TestScores 类（测试成绩类）\n\
  \n\n\n\n\n设计一个 `TestScores` 类，用包含存储三个测试成绩的字段。该类应包含一个构造函数、针对测试成绩字段的访问器（accessor）和修改器（mutator）方法，以及一个返回测试平均分的方法。编写一个独立的程序来演示该类，该程序应创建该类的实例。程序应要求用户输入三个测试成绩，并将它们存储在\
  \ `TestScores` 对象中。然后，程序应显示由 `TestScores` 对象报告的平均分。\n\n## 7. `Circle` 类\n\n编写一个\
  \ `Circle` 类，包含以下字段：\n\n- `radius`: 一个 `double` 类型\n- `PI`: 一个 `final` 的 `double`\
  \ 类型，初始化值为 3.14159\n\n该类应包含以下方法：\n\n- **构造函数（Constructor）**：接受圆的半径作为参数。\n- **构造函数（Constructor）**：无参构造函数，将\
  \ `radius` 字段设置为 0.0。\n- `setRadius()`：针对 `radius` 字段的修改器方法。\n- `getRadius()`：针对\
  \ `radius` 字段的访问器方法。\n- `getArea()`：返回圆的面积，计算公式为 `area` = `PI * radius * radius`。\n\
  - `getDiameter()`：返回圆的直径，计算公式为 `diameter` = `radius * 2`。\n- `getCircumference()`：返回圆的周长，计算公式为\
  \ `circumference` = `2 * PI * radius`。\n\n编写一个程序来演示 `Circle` 类，通过询问用户圆的半径，创建一个 `Circle`\
  \ 对象，然后报告圆的面积、直径和周长。\n\n## 8. `BankCharges` 类\n\n银行每月收取 $10 费用，加上商业支票账户的以下支票费用：\n\
  \n- 少于 20 get 支票，每张 $0.10\n- 20–39 张支票，每张 $0.08\n- 40–59 张支票，每张 $0.06\n- 60 张或以上支票，每张\
  \ $0.04\n\n如果账户余额低于 $400（在应用任何支票费用之前），银行还将额外收取 $15。设计一个类来存储账户的期初余额和开出的支票数量。它还应该包含一个返回该月银行服务费的方法。\n\
  \n## 9. 冰点与沸点\n\n下表列出了几种物质的冰点和沸点。\n\n![Image](img/00388.jpg)\n\n设计一个类将温度存储在 `temperature`\
  \ 字段中，并具有该字段相应的访问器和修改器方法。除了相应的构造函数外，该类应包含以下方法：\n\n- `isEthylFreezing()`：如果 `temperature`\
  \ 字段存储的温度等于或低于乙醇的冰点，该方法返回布尔值 `true`。否则，方法返回 `false`。\n- `isEthylBoiling()`：如果 `temperature`\
  \ 字段存储的温度等于或高于乙醇的沸点，该方法返回布尔值 `true`。否则，方法返回 `false`。\n- `isOxygenFreezing()`：如果\
  \ `temperature` 字段存储的温度等于或低于氧气的冰点，该方法返回布尔值 `true`。否则，方法返回 `false`。\n- `isOxygenBoiling()`：如果\
  \ `temperature` 字段存储的温度等于或高于氧气的沸点，该方法返回布尔值 `true`。否则，方法返回 `false`。\n- `isWaterFreezing()`：如果\
  \ `temperature` 字段存储的温度等于或低于水的冰点，该方法返回布尔值 `true`。否则，方法返回 `false`。\n- `isWaterBoiling()`：如果\
  \ `temperature` 字段存储的温度等于或高于水的沸点，该方法返回布尔值 `true`。否则，方法返回 `false`。\n\n编写一个程序来演示该类。程序应要求用户输入一个温度，然后显示在该温度下会结冰和在该温度下会沸腾的物质列表。例如，如果温度为\
  \ –20，该类应报告水在该温度下结冰，氧气在该温度下沸。\n\n## 10. `SavingsAccount` 类\n\n设计一个 `SavingsAccount`\
  \ 类，存储储蓄账户的年利率和余额。类构造函数应接受储蓄账户初始余额的金额。该类还应具有用于减取提取金额、增加存款金额以及将每月利息加入余额的方法。每月利率为年除以十二。要将每月利息添加到余额中，将每月利率乘以余额，并将结果加到余额上。\n\
  \n在一个程序中测试该类，该程序计算一段时间后储蓄账户的余额。它应要求用户输入年利率、初始余额以及账户建立以来经过的月数。然后循环应每个月迭代一次，执行以下操作：\n\
  \na. 询问用户该月内存入账户的金额。使用类方法将此金额添加到账户余额。\nb. 询问用户该月内从账户提取的金额。使用类方法从账户余额中减去此金额。\nc.\
  \ 使用类方法计算每月利息。\n\n在最后迭代之后，程序应显示结束余额、总存款额、总取款额和总收益。\n\n## 11. 存款与取款文件\n\n使用记事本或其他编辑器创建一个名为\
  \ `Deposits.txt` 的文本文件。文件应包含以下数字，每行一个：\n- 100.00\n- 124.00\n- 78.92\n- 37.55\n\n\
  接下来，创建一个名为 `Withdrawals.txt` 的文本文件。文件应包含以下数字，每行一个：\n- 29.88\n- 110.00\n- 27.52\n\
  - 50.00\n- 12.90\n\n`Deposits.txt` 文件中的数字是该月存入储蓄账户的金额，而 `Withdrawals.txt` 文件中的数字是该月提取的金额。编写一个程序，创建一个你在第\
  \ 10 题中编写的 `SavingsAccount` 类实例。对象的初始余额为 500.00。程序应从 `Deposits.txt` 文件读取数值并使用对象方法将其添加到账户余额中。程序应从\
  \ `Withdrawals.txt` 文件读取数值并使用对象方法从账户余额中减去它们。程序应调用类方法计算每月利息，然后显示结束余额和总收益。\n\n## 12.\
  \ 抛币模拟器\n\n编写一个名为 `Coin` 的类。该类应包含以下字段：\n\n- 一个名为 `sideUp` 的 `String` 类型。`sideUp`\
  \ 字段将持有“heads”（正面）或“tails”（反面），表示硬币朝上的一面。\n\n`Coin` 类应包含以下方法：\n\n- 一个无参构造函数，随机确定硬币朝上的一面（“heads”或“tails”），并初始化\
  \ `sideUp` 字段。\n- 一个名为 `toss` 的 `void` 方法，模拟抛硬币。当调用 `toss` 方法时，它随机确定硬币朝上的一面（“heads”或“tails”），并设置\
  \ `sideUp` 字段。\n- 一个名为 `getSideUp` 的方法，返回 `sideUp` 字段的值。\n\n\n\n\n编写一个演示 `Coin`类的程序。该程序应该创建该类的实例，并显示初始朝上的一面。然后，使用循环抛掷硬币\
  \ 20 次。每次抛掷硬币时，显示朝上的一面。程序应该统计正面朝上的次数和反面朝上的次数，并在循环结束后显示这些值。\n\n* * *\n\n# 第 7 章\n\
  ## GUI 应用初探\n\n### 课程主题\n\n* * *\n\n* 7.1 引言\n* 7.2 创建窗口\n* 7.3 为 GUI 类配备 `main`\
  \ 方法\n* 7.4 布局管理器\n* 7.5 单选按钮和复选框\n* 7.6 边框\n* 7.7 专注于问题解决：从 `JPanel` 扩展类\n* 7.8\
  \ 启动屏幕\n* 7.9 使用控制台输出调试 GUI 应用\n* 7.10 需要避免的常见错误\n\n* * *\n\n### 7.1 引言\n\n> **概念：在\
  \ Java 中，你使用 Java 基础类（JFC）为你的应用程序创建图形用户界面。在 JFC 中，你使用抽象窗口工具包（AWT）或 Swing 类来创建图形用户界面。**\n\
  \n在本章中，我们将讨论如何创建带有图形用户界面或 `GUI`（读作“gooey”）的 Java 应用的基础。`GUI` 是应用程序呈现的用于与用户交互的图形窗口或图形窗口系统。除了接受键盘输入外，GUI\
  \ 通常还接受鼠标输入。\n\n`GUI` 中的一个窗口通常由若干个组件组成，这些组件向用户展示数据并/或允许与应用程序进行交互。一些常见的 `GUI` 组件有按钮、标签、文本框、复选框和单选按钮。图\
  \ 7-1 显示了一个包含各种组件的窗口示例。表 7-1 描述了出现在窗口中的组件。\n\n**图 7-1** 各种 GUI 组件\n\n![Image](img/00389.jpg)\n\
  \n**表 7-1** 一些 GUI 组件\n\n![Image](img/00390.jpg)\n\n#### JFC、AWT 和 Swing\n\nJava\
  \ 程序员使用 `Java 基础类 (JFC)` 来创建 `GUI` 应用程序。`JFC` 由几组类组成，其中许多类超出了本书的范围。我们关注的两个组 `JFC`\
  \ 类是 AWT 和 Swing 类。首先，我们讨论它们之间的区别。\n\n从最早的版本开始，Java 就配备了一组用于绘制图形和创建 GUI 的类。这些类是\
  \ `抽象窗口工具包 (AWT)` 的一部分。`AWT` 允许程序员创建通过窗口和其他 `GUI` 组件与用户交互的应用程序和 Applet。\n\n然而，程序员在使用\
  \ `AWT` 类时能做的事情是有限的。这是因为 `AWT` 类实际上并没有在屏幕上绘制用户界面组件。相反，`AWT` 类与另一层软件（称为“对等类”，peer\
  \ classes）进行通信，由对等类指导底层操作系统绘制其内置组件。为特定操作系统开发的每个 Java 版本都有其自己的一套对等类。虽然这意味着 Java 程序的外观与同一系统上的其他应用程序保持一致，但也导致了一些问题。\n\
  \n一个问题是并不是所有的操作系统都提供相同的 `GUI` 组件。例如，某个操作系统可能提供一个复杂的滑条组件，而该组件在任何其他平台上都是找不到的。其他操作系统可能也有自己独特的组件。为了让\
  \ `AWT` 保持可移植性，它必须仅提供所有支持 Java 的操作系统所共有的组件。\n\n另一个问题是组件在各种操作系统上的行为差异。某个操作系统上的组件行为可能与不同操作系统上的相同组件略有不同。此外，据报道，某些操作系统的对等类存在\
  \ Bug。因此，程序员在测试每个操作系统之前，无法完全确定他们的 `AWT` 程序在不同操作系统上的表现会如何。\n\n第三个问题是程序员无法方便地自定义 `AWT`\
  \ 组件。由于这些组件依赖于底层操作系统组件的外观和行为，程序员几乎无法做什么来改变它们的属性。\n\n为了解决这些问题，`Swing` 随着 Java 2 发布而引入。`Swing`\
  \ 是一个类库，它并没有取代 `AWT`，而是为 `GUI` 应用程序提供了改进的替代方案。\n\n#### 事件驱动编程\n\n在 GUI 环境运行的程序必须是事件驱动的。事件是程序内部发生的动作，例如点击按钮。编写\
  \ GUI 应用的一部分是创建事件监听器。事件监听器是在当特定事件发生时会自动执行其方法之一的对象。\n\n\n\n\n你在第 2 章中学习过的 `JOptionPane`\
  \ 对框允许你轻松地显示消息并收集输入。然而，如果一个应用程序要提供完整的图形用户界面，则需要更多内容。应用程序通常需要一个或多个带有各种组件的窗口，允许用户输入和/或选择数据并与应用程序交互。例如，图\
  \ 7-1 中显示的窗口内部包含几个不同的组件。\n\n窗口是一个组件，但由于窗口包含其他组件，因此更恰当地被视为容器。`container` 简单就是一个持有其他组件的组件。在\
  \ GUI 术语中，可以显示为窗口的容器被称为 `frame`（帧）。`frame` 表现为一个基础窗口，周围有一个边框、一个标题栏，以及一组用于最小化、最大化和关闭窗口的按钮。在\
  \ Swing 应用程序中，你从 `JFrame` 类创建一个 `frame` 对象。\n\n创建一个窗口涉及许多步骤，让我们来看一个例子。代码列表 7-1 中的程序显示了图\
  \ 7-2 所示的窗口。\n\n**代码列表 7-1 (`ShowWindow.java`)**\n\n```\n![Image](img/00391.jpg)\n\
  ```\n\n**图 7-2** 由 `ShowWindow.java` 显示的窗口\n\n```\n![Image](img/00392.jpg)\n```\n\
  \n图 7-2 中显示的窗口是在运行 Windows XP 的系统上生成的。注意该窗口有一个边框和一个显示有“A Simple Window”的标题栏。此外，它在右上角有标准的\
  \ Windows XP 按钮：最小化按钮、最大化按钮和关闭按钮。这些标准特征有时被称为 `decorations`（装饰）。如果你运行此程序，你将看到窗口显示在屏幕上。当你点击关闭按钮时，窗口会消失且程序终止。\n\
  \n让我们仔细查看代码。首先，注意在第 1 行使用了以下 `import` 语句：\n\n```\n      import javax.swing.*; //\
  \ Needed for Swing classes\n```\n\n任何使用 Swing 类（如 `JFrame`）的程序必须包含此 `import` 语句。在第\
  \ 12 行和第 13 行，两个常量 `WINDOW_WIDTH` 和 `WINDOW_HEIGHT` 声明如下：\n\n```\n      final int\
  \ WINDOW_WIDTH = 350; // Window width in pixels\n      final int WINDOW_HEIGHT =\
  \ 250; // Window height in pixels\n```\n\n我们稍后会在程序中使用这些常量来设置窗口的大小。窗口的大小是以像素为单位的。`pixel`（像素）是组成屏幕显示的小点之一；你的显示器的分辨率以像素为单位。例如，如果你的显示器分辨率为\
  \ 1024 比 768，这意味着你的屏幕宽度为 1024 像素，高度为 768 像素。\n\n接下来，我们在第 16 行使用以下语句创建 `JFrame` 类的实例：\n\
  \n```\n      JFrame window = new JFrame();\n```\n\n该语句在内存中创建了一个 `JFrame` 对象并将其地址分配给变量\
  \ `window`。然而，该语句并没有在屏幕上显示窗口。`JFrame` 初始状态是不可见的。\n\n在第 19 行，我们如下调用 `JFrame` 对象的\
  \ `setTitle` 方法：\n\n```\n      window.setTitle(“A Simple Window”);\n```\n\n作为参数传递给\
  \ `setTitle` 的字符串将在显示时出现在窗口的标题栏中。在第 22 行，我们调用 `JFrame` 对象的 `setSize` 方法来如下设置窗口的大小：\n\
  \n```\n      window.setSize(WINDOW_WIDTH, WINDOW_HEIGHT);\n```\n\n传递给 `setSize`\
  \ 的两个参数指定了窗口的像素宽度和高度。在此程序中，我们传递了之前声明的常量 `WINDOW_WIDTH` 和 `WINDOW_HEIGHT`，将窗口大小设置为\
  \ 350 像素乘以 250 像素。\n\n在第 25 行中，我们指定了当用户点击窗口右上角的关闭按钮时我们希望执行的操作，如下所示：\n\n```\n   \
  \   window.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n```\n\n当用户点击关闭按钮时可以发生许多操作。`setDefaultCloseOperation`\
  \ 方法接收一个 `int` 参数，用于指定操作。在这条语句中，我们传递了常量 `JFrame.EXIT_ON_CLOSE`，这会导致应用程序通过调用 `System.exit`\
  \ 方法结束。如果我们传递了 `JFrame.HIDE_ON_CLOSE`，窗口将从视图中隐藏，但应用程序不会结束。默认操作是 `JFrame.HIDE_ON_CLOSE`。\n\
  \n最后，在第 28 行，我们使用以下代码显示窗口：\n\n```\n      window.setVisible(true);\n```\n\n`setVisible`\
  \ 方法接收一个 `boolean` 参数。如果参数为 `true`，则窗口变为可见。如果参数为 `false`，则窗口被隐藏。\n\n#### 使用继承扩展\
  \ JFrame 类\n\n随着本章的深入，你的 GUI 应用程序将比这复杂得多。与其简单地创建 `JFrame` 的实例，常用技术是创建一个 `extends`\
  \ `JFrame` 的新类。\n\n代码列表 7-1 中的程序创建了一个 `JFrame` 对象并调用了它的四个方法：`setTitle`、`setSize`、`setDefaultCloseOperation`\
  \ 和 `setVisible`。这些都是 `JFrame` 类的成员。当新类扩展现有类时，它会继承现有类的许多成员，使其成为一个更专门的版本。\n\n让我们来看代码列表\
  \ 7-2 中的 `SimpleWindow` 类。这是一个扩展 `JFrame` 示例。\n\n**代码列表 7-2 (`SimpleWindow.java`)**\n\
  \n```\n![Image](img/00393.jpg)\n```\n\n注意第 9 行的类头如下：\n\n```\n      public class\
  \ SimpleWindow extends JFrame\n```\n\n`extends` `JFrame` 单词表示 `SimpleWindow` 类扩展了\
  \ `JFrame` 类。这意味着 `SimpleWindow` 类继承了 `JFrame` 类的成员，例如 `setTitle`、`setSize`、`setDefaultCloseOperation`\
  \ 和 `setVisible` 方法，就像它们写在 `SimpleWindow` 类声明中一样。现在看构造函数。在第 17 行和第 18 行，我们声明了 `WINDOW_WIDTH`\
  \ 和 `WINDOW_HEIGHT` 常量，它们将用于如下建立窗口的大小：\n\n```\n      final int WINDOW_WIDTH = 350;\
  \ // Window width in pixels\n      final int WINDOW_HEIGHT = 250; // Window height\
  \ in pixels\n```\n\n在第 21 行，我们调用 `setTitle` 方法如下设置窗口标题栏的文本：\n\n```\n      setTitle(“A\
  \ Simple Window”);\n```\n\n注意我们在调用该方法时没有使用对象引用和前置点符号。这是因为该方法继承自 `JFrame` 类，我们可以调用它，就就像它写在\
  \ `SimpleWindow` 类声明中一样。\n\n\n\n\n构造函数的其余部分调用了 `setSize`、`setDefaultCloseOperation`\
  \ 和 `setVisible` 方法。显示窗口所需的所有操作只需创建一个 `SimpleWindow` 类的实例即可，如代码列表 7-3 中的程序所示。当该程序运行时，之前在图\
  \ 7-2 中显示的窗口将会显示。请记住，`SimpleWindow` 类是 `JFrame` 类的扩展版本。当我们创建一个 `SimpleWindow` 类的实例时，我们实际上是在创建一个\
  \ `JFrame` 类的实例，并在其构造函数中添加了一些自定义代码。\n\n### 代码列表 7-3 (`SimpleWindowDemo.java`)\n\n\
  ```java\n      1   /**\n      2       This program creates an instance of the\n\
  \      3       SimpleWindow class.\n      4    */\n      5\n      6   public class\
  \ SimpleWindowDemo\n      7   {\n      8       public static void main(String[]\
  \ args)\n      9       {\n     10            SimpleWindow myWindow = new SimpleWindow();\n\
  \     11       }\n      12 }\n```\n\n### 向窗口添加组件\n\nSwing 提供了许多可以添加到窗口的 GUI 组件。三个基本组件是标签（label）、文本字段和按钮。这些内容总结在表\
  \ 7-2 中。\n\n**表 7-2** 标签、文本字段和按钮控件\n\n![Image](img/00394.jpg)\n\n在 Swing 中，标签是用\
