  \n***\n\n# 第 19 章\n## 基于数组的列表\n\n### 课题\n\n***\n\n> 19.1 列表简介\n\n> 19.2 创建用于存储 `String`\
  \ 对象的基于数组的列表\n\n> 19.3 创建泛型基于数组的列表\n\n> 19.4 编写迭代器类和迭代列表\n\n***\n\n## 19.1 列表简介\n\
  \n> **概念：列表是一个将对象作为元素组合的容器**。\n\n毫无疑问，你对列表非常熟悉，因为它们太常见了。在去杂货店之前，你可能会列一份购物清单。在忙碌的处理杂务的早晨，你可能会为自己列出一份待办事项。当你计划举办派对时，准备一份邀请名单通常是一个好主意。列表简单来说就是为了某些目的而存储在一起的一组项目。\n\
  \n列表在计算机科学中也很常见。对于程序员来说，列表是一个包含一组元素的容器。列表中的元素存储在一个序列中，其中一个元素被认为在另一个元素之后。通常，列表中的元素有一个关联的索引，该索引对应每个元素在列表中的位置。第一个元素的索引为\
  \ 0，第二个元素的索引为 1，依此类推。除了最后一个元素外，每个元素都有一个后继者（successor），除了第一个元素外，每个元素都有一个前驱者（predecessor）。列表还有大小，即存储在列表中的元素数量。此外，列表还有各种方法，允许你存储、检索和删除元素。\n\
  \n在第 18 章中，你接触过 Java 集合框架 (JCF) 中的 `List` 类型。通过 JCF，你可以使用 `ArrayList` 和 `LinkedList`\
  \ 等类来创建列表。虽然这些类是直接为你提供的，但作为一名计算机科学学生，理解列表类是如何实现的，并能够编写自己的列表类是非常关重要的。\n\n#### 列表操作\n\
  \n表 19-1 描述了大多数列表类可以执行的一系列常用操作。这些操作用于添加元素、获取元素、删除元素等。请注意表 19-1 中的操作是 Java 集合框架中\
  \ `java.util.List` 接口指定的操作子集。\n\n**表 19-1** 常用列表操作\n\n![Image](img/01406.jpg)\n\n\
  ### 19.2 创建用于存储 `String` 对象的基于数组的列表\n\n> **概念：基于数组的列表使用内部数组来存放列表元素。基于数组的列表是可以调整大小的，这意味着当其内部数组满且向列表中添加另一个元素时，其内部数组会自动扩展**。\n\
  \n我们将从创建一个可以存储 `String` 对象的列表开始学习列表。我们的第一步是设计一个接口，用以指定表 19-1 中描述的所有常用列表操作。该接口名为\
  \ `StringList`，如图 19-1 中的 UML 图以及代码清单 19-1 所示。\n\n**图 19-1** `StringList` 接口\n\n\
  ![Image](img/01407.jpg)\n\n**代码清单 19-1 `(StringList.java)`**\n\n![Image](img/01408.jpg)\n\
  \n![Image](img/01409.jpg)\n\n![Image](img/01410.jpg)\n\n![Image](img/01411.jpg)\n\
  \n`StringList` 接口指定了我们在字符串列表中需要实现的操作。然而，它并没有描述这些操作是如何执行的。这些细节将在一个具体的类中处理。在设计具体的列表类时，我们必须决定如何在内存中存储列表，以及如何执行这些操作。\n\
  \n#### 基于数组的列表与可调整大小的列表\n\n存储列表的方法有很多。在本章中，我们所有的列表类都是基于数组的。基于数组的列表使用内部数组来存储元素。这些类是可以调整大小的，这意味着当内部数组满并向列表添加另一个元素时，内部数组会自动扩展。\n\
  \n##### 容量\n\n可调整大小的基于数组列表有一个容量（capacity），这与大小（size）不同。列表的容量是它可以存储而不需扩展的元素数量。然而，大小是存储在列表中的元素数量。数组可能只部分填充，因此大小小于或等于容量。我们将创建的列表类默认容量为\
  \ 10。我们还会提供指定其他容量的构造器。\n\n#### 存储字符串列表的具体类\n\n图 19-2 显示 `StringListType` 类的 UML\
  \ 图。这是一个实现了 `StringList` 接口的具体类。该类的设计策略是在数组中存储列表。\n\n**图 19-2** `StringListType`\
  \ 类\n\n![Image](img/01412.jpg)\n\n由于 `StringList` 接口没有指定实现方法的细节，该类有一些额外的方法。这些方法对于支持可调整大小的基于数组的列表是必要的。表\
  \ 19-2 描述了这些额外方法。\n\n**表 19-2** `StringListType` 类中的额外方法\n\n![Image](img/01413.jpg)\n\
  \n`StringListType` 类的源代码可以从 [www.pearsonhighered.com/gaddis.](http://www.pearsonhighered.com/gaddis)\
