  \ Joe 在交易中亏损了）。\n\n* *\n\n# 第 3 章：选择结构\n\n### **主题**\n\n* *\n\n* 3.1 `if` 语句 中所示。\n\
  \n**图 3-1** 顺序结构\n\n![Image](img/00114.jpg)\n\n\n\n\n\n在图 3-1 中所示的代码类型被称为`顺序结构`，因为语句是顺序执行的，不会分支到其他方向。然而，程序通常需要多条执行路径。许多算法要求程序在特定情况下才执行某些语句。这可以通过`决策结构`来实现。\n\
  \n在决策结构的简单形式中，只有当条件存在时才会执行某个特定操作。如果条件不存在，则不执行该操作。图 3-2 中的流程图显示了决策结构的逻辑。菱形符号表示一个是/否问题或真/假条件。如果问题的答案是是（或条件为真），程序流将遵循一条路径并导致执行某操作。如果问题的答案是否（或条件为假），程序流将遵循另一条路径，跳过该操作。\n\
  \n**图 3-2** 简单的决策结构逻辑\n\n![Image](img/00115.jpg)\n\n在流程图中，只有当外面很冷时才会执行“穿外套”的操作。如果外面不冷，则跳过该操作。该操作是`条件执行的`，因为它只有在特定条件（外面很冷）存在时才执行。图\
  \ 3-3 显示了一个更复杂的流程图，其中只有在外面很冷时才会执行三个操作。\n\n**图 3-3** 三操作决策结构逻辑\n\n![Image](img/00116.jpg)\n\
  \n在 Java 中编写决策结构的一种方法是使用`if`语句。以下是`if`语句的通用格式：\n\n```\n  if (BooleanExpression)\n\
  \    statement;\n```\n\n`if` 语句的工作原理非常简单：括号内出现的 `BooleanExpression` 必须是一个 `boolean`\
  \ 。`boolean expression`是指结果为 `true` 或 `false` 的表达式。如果 `boolean`表达式为 `true`，则执行紧随其后的\
  \ `statement`。否则，将跳过它。该`statement` 是条件执行的，因为它只在括号中的表达式为 `true` 的条件下才执行。\n\n### 使用关系运算符形成条件\n\
  \n通常，`if` 语句测试的 `boolean` 表达式是用关系运算符形成的。`relational operator`决定两个值之间是否存在特定关系。例如，大于运算符（`>`）决定一个值是否大于另一个值。相等运算符（`==`）决定两个值是否相等。表\
  \ 3-1 列出了所有的 Java 关系运算符。\n\n**表 3-1** 关系运算符\n\n![Image](img/00117.jpg)\n\n所有的关系运算符都是二进的，这意味着它们使用两个操作数。以下是一个使用大于运算符的表达式示例：\n\
  \n```\n  length > width\n```\n\n该表达式判断 `length` 是否大于 `width`。如果 `length` 大于 `width`，表达式的值为\
  \ `true`。否则，表达式的值为 `false`。因为表达式只能是 `true` 或 `false`，所以它是一个 `boolean` 表达式。下一个表达式使用小于运算符来判断\
  \ `length` 是否小于 `width`：\n\n```\n  length < width\n```\n\n表 3-2 显示了几个比较变量 `x` 和\
  \ `y` 的 `boolean` 表达式示例。\n\n**表 3-2** 使用关系运算符的 `boolean` 表达式\n\n![Image](img/00118.jpg)\n\
  \n两个运算符 `>=` 和 `<=` 测试的是多个一个关系。`>=`运算符判断左侧的操作数是否大于等于右侧的操作数。假设 `a` 为 4，`b` 为 6，`c`\
  \ 为 4，表达式 `b >= a` 和 `a >= c` 均为 `true`，而 `a >= 5` 为 `false`。使用此运算符时，`>` 符号必须在 `=`\
  \ 符号之前，且之间没有空格。`<=`运算符判断左侧的操作数是否小于等于右侧的操作数。再次假设 `a` 为 4，`b` 为 6，`c` 为 4，`a <= c`\
  \ 和 `b <= 10` 均为 `true`，但 `b <= a` 为 `false`。使用此运算符时，`<` 符号必须在 `=` 符号之前，且之间没有空格。\n\
  \n`==`运算符判断左侧的操作数是否等于右侧的操作数。如果两个操作数具有相同的值，则表达式为 `true`。假设 `a` 为 4，表达式 `a == 4` 为\
  \ `true`，表达式 `a == 2` 为 `false`。注意相等运算符是两个 `=` 符号。不要将此运算符与赋值运算符混淆，后者只有一个 `=` 符号。\n\
  \n`!=`运算符是不等于运算符。它判断左侧的操作数是否不等于右侧的操作数，这与 `==` 运算符相反。\n\n### 整合在一起\n\n让我们来看一个 `if`\
  \ 语句的示例：\n\n```\n  if (sales > 10000)\n    bonus = 500;\n```\n\n第 38 到 40 行的代码会导致打印祝贺消息：\n\
  \n```java\nif (average > 95)\n    JOptionPane.showMessageDialog(null, \"That's a\
  \ great score!\");\n```\n\n图 3-6 显示了该 `if` 语句的逻辑。表 3-3 显示了其他 `if` 语句的示例及其结果。\n\n\
  \n\n\n\n在大多数编辑器中，你每按一次 tab 键，就会缩进一层。通过对条件条件下执行的语句进行缩进，你可以让它在视觉上脱颖而出。这样做可以让你一眼看出\
  \ `if` 语句执行的是程序的哪部分代码。这是编写 `if` 语句的标准方法，也是你应该使用的方法。\n\n### 注意分号\n\n不要在 `if` 语句的\
  \ `if (expression)` 部分之后放置分号，如图 3-7 所示。这是因为如果没有其条件条件下执行的语句，`if` 语句是不完整的。\n\n**图\
  \ 3-7** 不要用分号提前终止 `if` 语句\n\n![Image](img/00125.jpg)\n\n如果你用分号提前终止了 `if` 语句，编译器不会显示错误信息，但会假设你是在那儿处放置了一个\
  \ `null statement`（空语句）。`null statement` 是一个什么都不执行的空语句，它将成为该条件条件下执行的语句。而你本打算条件条件下执行的语句将与\
  \ `if` 语句断开，并且始终执行。\n\n例如，看以下代码：\n\n```\n  int x = 0, y = 10;\n  // 下面的 if 语句被分号\n\
  \  // 提前终止了。\n  if (x > y);\n      System.out.println(x + \" is greater than \"\
  \ + y);\n```\n\n这段代码中的 `if` 语句被分号提前终止了。由于 `println` 语句没有连接 `if` 语句，它将始终执行。\n\n###\
  \ 具有多个条件条件下执行的语句\n\n之前的 `if` 语句示例是在条件条件下执行单个语句。`if` 语句也可以条件条件下执行一组语句，只要它们被包含在一对括号中。将一组语句包含在大括号内部会创建一个语句的\
  \ `block`（块）。以下是一个示例：\n\n![Image](img/00126.jpg)\n\n如果 `sales` 大于 50,000，这段代码将按照它们出现的顺序执行大括号内的所有三个语句。然而，如果不小心漏掉了括号，`if`\
  \ 语句将只条件条件下执行紧随其后的第一条语句。图 3-8 说明了这一点。\n\n**图 3-8** 缺少括号的 `if` 语句\n\n![Image](img/00127.jpg)\n\
  \n### 标志位 (Flags)\n\n标志是一个 `boolean` 变量，用于信号程序中是否存在某些条件。当标志变量被设置为 `false` 时，表示该条件尚不存在。当标志变量被设置为\
  \ `true` 时，意味着该条件确实存在。\n\n例如，假设一个与之前的测试平均值程序程序有一个名为 `highScore` 的 `boolean` 变量。该变量可能用于以下代码来指示获得了高分：\n\
  \n```\n  if (average > 95)\n      highScore = true;\n```\n\n稍，同一个程序可能会使用类似下面的代码来测试\
  \ `highScore` 变量，以确定是否获得了高分：\n\n```\n  if (highScore)\n      System.out.println(\"\
  That's a high score!\");\n```\n\n你将在许多情况下发现标志变量非常有用，我们将在未来的章节中再次回到它们。\n\n### 比较字符\n\
  \n你可以使用关系运算符来测试字符数据，也可以测试数字。例如，假设 `ch` 是一个 `char` 变量，以下代码段使用 `==` 运算符将其与字符‘A’ 进行比较：\n\
  \n```\n  if (ch == 'A')\n      System.out.println(\"The letter is A.\");\n```\n\n\
  `!=` 运算符也可以用于字符来测试不相等性。例如，以下语句判断 `char` 变量 `ch` 是否等于字母‘A’：\n\n```\n  if (ch != 'A')\n\
  \      System.out.println(\"Not the letter A.\");\n```\n\n你还可以使用 `<`, `>=`, 和 `<=`\
  \ 运算符来比较字符。计算机并没有在内存中实际存储如 A、B、C 等字符。相反，它们存储的是代表字符的数字代码。回想第 2 章，Java 使用 Unicode，这是一组代表所有世界字母表中的所有字母（包括小写和大写）、可打印数字\
  \ 0 到 9、标点符号和特殊字符的数字。当字符被存储在内存中时，实际存储的是它的 Unicode 数字。当指示计算机在屏幕上打印该值时，它会显示与数字代码对应的字符。\n\
  \n![Image](img/00005.jpg)\n\n* * *\n\n**注意：** Unicode 是一种国际编码系统，广泛到可以表示世界上所有字母表中的所有字符。\n\
  \n* * *\n\n在 Unicode 中，字母按字母顺序排列。因为‘A’在‘B’之前，所以字符‘A’的数字代码小于‘B’的代码。\n\n\n\n\n在执行除法之前会测试\
  \ `number2` 的值。如果用户输入 0，则执行由 `if` 子句控制的语句块，显示指示程序无法执行除零操作的消息。否则，由 `else` 子句接控制，将\
  \ `number1` 除以 `number2` 并显示结果。图 3-9 显示了 `if`-`else` 语句的逻辑。\n\n***\n\n**图 3-9**\
  \ `if-else` 语句的逻辑\n\n![Image](img/00130.jpg)\n\n##### ![Image](img/00004.jpg)**要检查点**\n\
  \n> 3.8 写一个 `if`-`else` 语句：如果变量 `x` 大于 100，则给变量 `y` 赋值 20。否则，应给变量 `y` 赋值 0。\n\n\
  > 3.9 写一个 `if`-`else` 语句：当 `y` 等于 100 时，给 `x` 赋值 1。否则，应给 `x` 赋值 0。\n\n> 3.10 写一个\
  \ `if`-`else` 语句：除非 `sales` 大于或等于 50000.0，否则给 `commission` 赋值 0.10；在这种情况下，则给 `commission`\
  \ 赋值 0.2。\n\n> 3.11 写一个 `if`-`else` 语句：如果变量 `a` 小于 10，则给变量 `b` 赋值 0 并给变量 `c` 赋值\
  \ 1。否则，应给变量 `b` 赋值 –99 并给变量 `c` 赋值 0。\n\n## 3.3 嵌套 `if` 语句\n\n> **概念：为了测试多个条件，可以将一个\
  \ `if` 语句嵌套另一个 `if` 语句内部。**\n\n有时，一个 `if` 语句必须嵌套另一个 `if` 语句内部。例如，考虑一个确定银行客户是否符合特殊低利率贷款条件的银行程序。要符合条件，必须满足两个条件：(1)\
  \ 客户的工资至少为 30,000 美元，且 (2) 客户担任当前工作已至少满两年。图 3-10 显示了可能用于此类程序的算法流程图。\n\n**图 3-10**\
  \ 嵌套 `if` 语句的逻辑\n\n![Image](img/00131.jpg)\n\n如果我们遵循流程图中的执行流，可以看到它测试了表达式 `salary\
  \ >= 30000`。如果该表达式为假，则不需要进行进一步测试；我们知道客户不符合特殊利率条件。然而，如果表达式为真，我们需要测试第二个条件。这是通过嵌套决策结构完成的，该结构测试表达式\
  \ `yearsOnJob >= 2`。如果该表达式为真，则客户符合特殊利率条件。如果该表达式为假，则客户不符合条件。代码列表 3-3 显示了完整的程序。图 3-11、3-12,\
  \ 和 3-13 显示了与程序三次不同会话期间发生。\n\n**代码列表 3-3 `(LoanQualifier.java)`**\n\n![Image](img/00132.jpg)\n\
  \n![Image](img/00133.jpg)\n\n**图 3-11** 与 `LoanQualifier` 程序的交互\n\n![Image](img/00134.jpg)\n\
  \n**图 3-12** 与 `LoanQualifier` 程序的交互\n\n![Image](img/00135.jpg)\n\n**图 3-13** 与\
  \ `LoanQualifier` 程序的交互\n\n![Image](img/00136.jpg)\n\n第一个 `if` 语句（从第 26 行开始）有条件地执行第二个语句（从第\
  \ 28 行开始）。程序执行第二个 `if` 语句的唯一方法是 `salary` 变量包含一个大于或等于 30,000 的值。在这种情况下，第二个 `if` 语句将测试\
  \ `yearsOnJob` 变量。如果它包含一个大于或等于 2 的值，将显示一个对话框告知用户其符合贷款条件。\n\n需要注意的是，此程序中 `if` 语句使用的括号不是必须的。它们可以写成如下：\n\
  \n```\n  if (salary >= 30000)\n    if (yearsOnJob >= 2)\n      JOptionPane.showMessageDialog(null,\
  \ \"You qualify \" +\n                                     \"for the loan.\");\n\
  \    else\n      JOptionPane.showMessageDialog(null, \"You must earn \" +\n    \
  \                                 \"at least $30,000 per year.\");\n  else\n   \
  \ JOptionPane.showMessageDialog(null, \"You have been \" +\n                   \
  \                  \"at least two years.\");\n```\n\n（注：原文中存在大量重复的代码块说明，此处已根据要求进行了整合，以保持专业性并保留所有语义内容）。通过缩进，可以很容易看出每个\
  \ `else` 子句都与其所属的 `if` 子句对应，如图 3-14 所示。括号的使用不仅使语句更易读，还有助于调试。\n\n\n\n\n> **概念：`if-else-if`\
  \ 语句用于测试一系列条件。使用 `if-else-if` 语句测试一系列条件，通常比使用一组嵌套的 `if-else` 语句要简单。**\n\n尽管 代码列表\
  \ 3-4 只是一个简单的示例，但嵌套决策结的逻辑其实相当复杂。你也可以选择使用 `if-else-if` 语句来测试一系列条件。`if-else-if` 语句使得某些类型的嵌套决策逻辑的编写变得更加简单。以下是\
  \ `if-else-if` 语句的一般格式：\n\n***\n\n![Image](img/00009.jpg)\n\n## `if-else-if` 语句\n\
  \n***\n\n![Image](img/00145.jpg)\n\n当该语句执行时，会测试 `expression_1`。如果 `expression_1`\
  \ 为真（true），则执行紧随其后的语句块，并忽略结构的其余部分。然而，如果 `expression_1` 为假（false），程序将跳转到下一个 `else\
  \ if` 子句并测试 `expression_2`。如果它为真，则执行紧随其后的语句块，然后忽略结构的其余部分。这一过程从结构的顶部到底部一直持续，直到发现其中一个表达式为真。如果没有任何表达式为真，则由最后一个\
  \ `else` 子句接管，并执行紧随其后的语句块。\n\n最后一个 `else` 子句后面没有跟 `if` 语句，它被称为尾随 `else`（trailing\
