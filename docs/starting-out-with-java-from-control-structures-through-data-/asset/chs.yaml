  \ 127 行中，创建了一个按钮组（button group），并将单选按钮菜单项添加到其中。与 `JRadioButton` 组件一样，`JRadioButtonMenuItem`\
  \ 组件可以分组在一个 `ButtonGroup` 对象中。因此，组中的菜单项一次只能有一个被选中。当其中一个被选中时，组中的任何其他菜单项都会取消选中。\n\n\
  接下来，第 131 行创建了“可见”（Visible）项目，这是一个复选框菜单项。注意 `true` 作为第二个参数传递给构造函数。这导致该项目初始被选中。第\
  \ 132 行分配了助记键，并在第 133 行为组件添加了动作监听器。\n\n第 136 行为文本菜单创建了一个 `JMenu` 组件，第 137 行为其分配了助记键。第\
  \ 140 行至 142 行将 `blackItem`、`redItem` 和 `blueItem` 单选按钮菜单项添加到文本菜单。在第 143 行，调用了 `addSeparator`\
  \ 方法为菜单添加一个分隔条。由于 `addSeparator` 方法是在添加 `blueItem` 组件之后、添加 `visibleItem` 组件之前调用的，因此它将出现在菜单上蓝色项目和可见项目之间。第\
  \ 144 行将“可见”项目添加到文本菜单。\n\n回到 `buildMenuBar` 方法，在第 74 行和 75 行，将文件菜单和文本菜单添加到菜单栏。在第\
  \ 78 行，调用了 `setJMenuBar` 方法并将 `menuBar` 作为参数传递。`setJMenuBar` 是一个 `JFrame` 方法，用于在框架中放置菜单栏。你传递一个\
  \ `JMenuBar` 组件作为参数。当 `JFrame` 显示时，菜单栏将出现在其顶部。\n\n图 13-26 显示了当文件菜单和文本菜单打开时类窗口的样式。从文本菜单中选择颜色会导致\
