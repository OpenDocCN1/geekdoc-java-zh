  - 复习题与练习\n- 编程挑战\n\n## 前言\n\n欢迎阅读 *Java 入门：从控制结构到数据结构* 第二版。本书适用于两个学期的课程。书的前部分针对\
  \ CS1 课程，教授基础知识；后半部分针对 CS2 课程，教授高级主题。\n\n与 *Starting Out* 系列中的所有书籍一样，本书的特点是写作风格清晰、友好且易于理解。此外，它还包含了丰富且实用的示例。\n\
  \n## 本版的改进之处\n\n本书的教学方法、组织结构和清晰的写作风格与上一版保持不变。我们进行了许多改进，总结如下：\n\n- **改进了第 3 章的结构**：`if-else`\
  \ 语句被简化，现在紧跟在嵌套 `if` 章节之后。这些章节经过了重写，以突出 `if-else` 与嵌套 `if` 之间的相似性。\n- **新增“焦点关注\
  \ (In the Spotlight)”章节**：许多章节新增了名为 *焦点关注* 的新章节。每个章节都提供了一个编程问题以及详细的逐步分析，向学生展示如何解决问题。\n\
  - **在线视频教程 (VideoNotes)**：我们开发了一系列丰富的在线视频来配合教材。在全书中，VideoNote 图标会提醒学生查看涵盖特定主题的视频。此外，每个章节末尾的一个编程挑战现在都有相应的\
  \ VideoNote，解释如何开发问题的解决方案。视频可以在 `www.pearsonhighered.com/gaddis` 获得。\n- **额外的编程题**：许多章节增加了额外的编程挑战题。其中几个是简单的游戏，将挑战并激发学生的兴趣。\n\
  \n## 本书的结构\n\n本书循序渐进地教授 Java。每个章节涵盖一组主要主题，并随着学生阅读书籍不断构建知识。虽然章节可以按照现有顺序轻松教学，但具有一定的灵活性。图\
  \ P-1 显示了章节依赖关系。每个框代表一个章节或一组章节。实线箭头指向必须预先涵盖的章节。虚线箭头表示该章节的某个节或小部分依赖于另一个章节。\n\n###\
  \ 各章节简述\n\n\n\n\n\n# 第 1 章：计算机与 Java 简介\n本章介绍了计算机科学领域，并涵盖了硬件、软件和编程语言的基础知识。通过分析一个简单的程序，讨论了程序的各个元素，如关键字、变量、运算符和标点符号。文中概述了输入源代码、编译和执行程序的流程。此外，还简述了\
  \ Java 的历史。\n\n# 第 2 章：Java 基础\n本章通过介绍数据类型、标识符、变量声明、常量、注释、程序输出和简单算术运算，引导学生开始学习 Java。书中同时也介绍了编程风格的规范。学生将学习如何使用\
  \ `Scanner` 类以及使用 `JOptionPane` 对话框读取控制台输入。\n\n# 第 3 章：决策结构\n在本章中，学生将探索关系运算符和关系表达式，并学习如何使用\
  \ `if`、`if-else` 和 `if-else-if` 语句来控制程序的流程。还涵盖了嵌套 `if` 语句、逻辑运算符、条件运算符以及 `switch`\
  \ 语句。本章讨论了如何使用 `equals`、`compareTo`、`equalsIgnoreCase` 和 `compareToIgnoreCase` 方法来比较\
  \ `String` 对象。此外涵盖了使用 `DecimalFormat` 类对数值输出进行格式化，并介绍了 `System.out.printf` 方法。\n\
  \n# 第 4 章：循环与文件\n本章涵盖了 Java 的循环控制结构。介绍了 `while` 循环、`do-while` 循环和 `for` 循环，以及这些设备的常用用途。讨论了计数器、累加器、运行总计、哨兵和其他与应用相关的主题。还包含了用于读写文本文件的简单文件操作。\n\
  \n### 图 P-1 章节依赖\n\n# 第 5 章：方法\n在本章中，学生将学习如何编写 `void` 方法、返回值方法以及接受和不接受参数的方法。书中讨论了函数化分解的概念。\n\
  \n# 第 6 章：类初探\n本章介绍学生如何设计类以实现对象的实例化。学生将学习类字段和方法，并引入了 UML 图作为设计工具。随后讨论了构造函数和重载。文中提供了一个\
  \ `BankAccount` 类作为案例研究，并包含了一个关于面向对象设计的章节。该部分将引导学生识别问题领域中的类及其职责的过程。此外，还部分章节简要解释了包和\
  \ `import` 语句。\n\n# 第 7 章：GUI 应用初探\n本章介绍了使用 Swing 开发 GUI 应用的基础知识。涵盖了基础 Swing 组件和事件驱动编程的基本概念。\n\
  \n# 第 8 章：数组与 ArrayList 类\n在本章中，学生将学习创建和操作单维及多维数组。文中演示了许多数组处理技术，例如计算数组元素和、寻找最大值和最小值以及对数组进行顺序搜索。还讨论了其他主题，包括不规则数组和可变参数（varargs）。文中介绍了\
  \ `ArrayList` 类，并简要讨论和演示了 Java 的泛型。\n\n# 第 9 章：类与对象的深入学习\n本章向学生展示如何编写具有增强能力的类。讨论了静态方法和字段、对象之间的交互、将对象作为参数传递以及从方法返回对象。涵盖了聚合和“拥有”（has\
  \ a）关系，以及枚举类型。一个关于面向对象设计的章节展示了如何使用 CRC 卡来确定类之间的协作。\n\n# 第 10 章：文本处理与包装类进阶\n本章讨论了数值类和\
  \ `Character` 包装类。涵盖了将数字转换为字符串、测试字符大小写以及转换字符大小写的方法。还讨论了自动装箱和拆箱。涵盖了更多 `String` 类方法，包括使用\
  \ `split` 方法对字符串进行分词。本章还涵盖了 `StringBuffer` 和 `StringTokenizer` 类。\n\n# 第 11 章：继承\n\
  本章继续学习类、继承和多态。涵盖的主题包括父类、子类、继承中构造函数的工作原理、方法重写、多态和动态绑定、保护和包访问、类层次结构、抽象类、抽象方法和接口。\n\
  \n# 第 12 章：异常与流 I/O 进阶\n在本章中，学生学习使用异常开发增强的错误捕获技术。涵盖了异常处理以及自定义异常的开发和抛出。本章讨论了处理顺序访问、随机访问、文本和二进制文件的高级技术。\n\
  \n# 第 13 章：高级 GUI 应用\n本章继续研究 GUI 开发。涵盖了更高级的组件、菜单系统和外观（and feel）。\n\n# 第 14 章：Applet\
  \ 及其他\n在本章中，学生将 GUI 开发知识应用于创建 applet。除了使用 Swing applet 类外，还讨论了 AWT 类。讨论了绘制简单图形形状的方法。\n\
  \n# 第 15 章：递归\n本章介绍了递归作为一种问题解决技术。演示了许多递归方法的示例。\n\n# 第 16 章：排序、搜索与算法分析\n在本章中，学生将学习排序数组和搜索其中存储数据的知识。章节涵盖了冒泡排序、选择排序、插入排序、快速排序、顺序搜索和二分查找算法。还提供了一个算法分析章节，涵盖了基本步骤、复杂度和大\
  \ O 表示法。\n\n# 第 17 章：泛型\n本章向学生如何编写泛型类和方法。主题包括擦除、将泛型类实例作为参数传递传递、约束类型参数、泛型与继承以及泛型与接口。还讨论了泛型使用的限制。\n\
  \n# 第 18 章：集合\n本章向学生介绍 Java 集合框架（JCF）。讨论了列表（Lists）、集合（Sets）、映射（Maps）和 `Collections`\
  \ 类。\n\n# 第 19 章：基于数组的列表\n在本章中，学生学习编写可调整大小的数组列表。首先，学生学习存储 `String` 对象的列表，然后学习如何使用泛型创建一个存储任何类型对象的列表。学生还将学习如何为自己的列表类编写迭代器。\n\
  \n# 第 20 章：链表\n本章引入了编写链表类的概念和技术。涵盖了基础链表操作，如添加、插入、删除和遍历。讨论了双向链表、循环链表以及在链表中使用递归。\n\
  \n\n\n\n# 第 21 章：栈与队列\n在本章中，学生将学习栈和队列的操作，以及如何编写基于数组和基于链表的栈与队列类。\n\n# 第 22 章：二叉树、AVL\
  \ 树与优先级队列\n本章涵盖了二叉树的不同方面以及二叉树操作。书中涵盖的特定二叉树实现包括二叉搜索树、AVL 树和优先级队列。\n\n## 本书特点\n\n\
  **概念陈述 (Concept Statements)**。书的每个主要章节都以一个概念陈述开头，简要地总结该章节的重点。\n\n**示例程序 (Example\
  \ Programs)**。书中有大量的完整和部分示例程序，每个程序旨在突出当前主题。在大多数情况下，这些程序都是实用的现实案例。\n\n**程序输出 (Program\
  \ Output)**。每个示例程序后面都有其输出样本，向学生展示程序是如何运行的。\n\n\n**检查点 (Checkpoints)**。检查点通过勾选图标突出，在每章中定期出现。它们旨在学生在学习完新主题后立即检查其掌握情况。\n\
