  \n## 10.1 包装类简介\n\n> **概念：Java 为基本数据类型（primitive data types）提供了包装类（wrapper classes）。对于给定的基本类型，其对应的包装类不仅包含该类型的值，还包含了执行与该类型相关操作的方法。**\n\
  \n回想 第 2 章，基本数据类型被称为“基本”类型，是因为它们不是从类创建的。你不是实例化对象，而是从基本数据类型创建变量，而变量不具备属性或方法。它们的设计初仅仅是为了在内存中存储单个值。\n\
  \nJava 也为所有基本数据类型提供了包装类。*包装类*（wrapper class）是一个“包裹”在基本数据类型周围的类，允许你创建对象而不是变量。此外，这些包装类还提供了对基本值执行有用操作的方法。例如，你已经使用过包装类的“解析（parse）”方法来将字符串转换为基本值。\n\
  \n虽然这些包装类可以用来创建对象而不是变量，但很少有程序员那样使用它们。原因之一是包装类是不可变的（immutable），这意味着一旦你创建了对象，就无法更改该对象的值。另一个原因是，对于简单操作，它们不像变量那样易于使用。例如，要获取对象中存储的值，必须调用方法，而变量可以直接用于赋值语句、数学运算、作为方法参数传递等。\n\
  \n虽然通常情况下从包装类中创建对象并没用处，但它们确实提供了非常有用的静态方法。在本章中，我们将检查 Java 的几个包装类。我们首先查看 `Character`\
  \ 类，它是 `char` 数据类型的包装类。\n\n## 10.2 使用 `Character` 类进行字符测试与转换\n\n> **概念：`Character`\
