  - 13.10 使用什么方法在现有的 JLabel 或 JButton 中存储图像？\n\n### 13.6 助记键和工具提示\n\n助记键（Mnemonic）是你按住\
  \ Alt 键时用于与组件交互的键。工具提示（Tool tip）是用户将鼠标指针悬停在组件上时在小框中显示的文本。\n\n#### 助记键\n\n助记键是键盘上的一个键，你通过结合\
  \ Alt 键使用来快速访问按钮等组件。这些有时被称为快捷键或热键。当你为按钮分配助记键时，用户可以通过按住 Alt 键并按下助记键来点击按钮。\n\n你通过组件的\
  \ `setMnemonic` 方法为组件分配助记键，该方法继承自 `AbstractButton` 类。方法的通用格式如下：\n\n```java\nvoid\
  \ setMnemonic(int key)\n```\n\n传递给方法的参数是一个整数代码，代表你想要分配为助记键的键。`KeyEvent` 类位于 `java.awt.event`\
  \ 包中，定义了一些你可以使用的预定义常量。这些常量采用 `KeyEvent.VK_x` 的形式，其中 `x` 是键盘上的键。例如，要将 A 键分配为助记键，你应该使用\
  \ `KeyEvent.VK_A`。（常量中的字母 VK 代表“虚拟键”）。这里有一个代码示例，创建一个文本为“Exit”并并将 X 键分配为助记键的按钮：\n\
  \n\n\n\n\n```java\nJButton exitButton = new JButton(\"Exit\");\nexitButton.setMnemonic(KeyEvent.VK_X);\n\
  ```\n\n用户可以通过按下键盘上的 ![Image](img/01020.jpg) 来点击此按钮。（这意味着按住 Alt 键并按下 `X`。）\n\n如果选定作为快捷键（mnemonic）的字母出现在组件的文本中，则当组件显示时，该字母第一次出现的地方将带有下划线。例如，用前面的代码创建的按钮文本为“Exit”。因为选择了\
  \ `X` 作为快捷键，字母 `x` 将带有下划线，如图 13-17 所示。\n\n**图 13-17** 带有快捷键 X 的按钮\n\n![Image](img/01021.jpg)\n\
  \n如果快捷键是一个未出现在组件文本中的字母，则没有字母会显示为下划线。\n\n![Image](img/00005.jpg)\n\n***\n\n**注意：**\
  \ `KeyEvent` 类还包含符号的常量。例如，符号 `!` 的常量为 `VK_EXCLAMATION_MARK`，符号 `&` 的常量为 `VK_AMPERSAND`。查看\
  \ `KeyEvent` 类的 Java API 文档获取所有常量列表。\n\n***\n\n你也可以为单选按钮（radio buttons）和复选框（check\
  \ boxes）分配快捷键，代码所示：\n\n```java\n// 创建三个单选按钮并分配快捷键。\nJRadioButton rb1 = new JRadioButton(\"\
  Breakfast\");\nrb1.setMnemonic(KeyEvent.VK_B);\nJRadioButton rb2 = new JRadioButton(\"\
  Lunch\");\nrb2.setMnemonic(KeyEvent.VK_L);\nJRadioButton rb3 = new JRadioButton(\"\
  Dinner\");\nrb3.setMnemonic(KeyEvent.VK_D);\n// 创建三个复选框并分配快捷键。\nJCheckBox cb1 =\
  \ new JCheckBox(\"Monday\");\ncb1.setMnemonic(KeyEvent.VK_M);\nJCheckBox cb2 = new\
  \ JCheckBox(\"Wednesday\");\ncb2.setMnemonic(KeyEvent.VK_W);\nJCheckBox cb3 = new\
  \ JCheckBox(\"Friday\");\ncb3.setMnemonic(KeyEvent.VK_F);\n```\n\n此代码将创建图 13-18\
  \ 所示的组件。\n\n**图 13-18** 分配了快捷键的单选按钮和复选框\n\n![Image](img/01022.jpg)\n\n### 工具提示 (Tool\
  \ Tips)\n\n工具提示是用户将鼠标光标悬停在组件上时显示在一个小框中的文本。该小框通常简要描述组件的功能。大多数 GUI 应用程序使用工具提示作为为用户提供即时且简洁帮助的一种。例如，图\
  \ 13-19 显示了一个显示了工具提示的按钮。\n\n**图 13-19** 显示工具提示的按钮\n\n![Image](img/01023.jpg)\n\n\
  你使用 `setToolTipText` 方法为组件分配工具提示，该方法继承自 `JComponent` 类。以下是该方法的通用格式：\n\n```java\n\
  void setToolTipText(String text)\n```\n\n作为参数传递的 `String` 是将显示在组件工具提示中的文本。例如，以下代码创建了图\
  \ 13-19 所示的 Exit 按钮及其关联工具提示：\n\n```java\nJButton exitButton = new JButton(\"Exit\"\
  );\nexitButton.setToolTipText(\"Click here to exit.\");\n```\n\n##### ![Image](img/00004.jpg)\
