  ```\n\n* * *\n\n## 21.9 需要避免的常见错误\n\n> • **忘记检查空栈或空队列**。在调用 `peek` 或 `pop` 之前，你应该始终检查栈是否为空；在尝试访问或从队列中取出元素之前，你应该始终检查队列是否为空。如果你忘记这样做，抛出的异常将终止你的程序。\n\
  \n> • **通过捕获抛出的异常来处理空栈或空队列**。异常处理应该留给程序无法预料和防止的情况。相反，使用检查集合是否为空的方法。\n\n> • **未维护栈或队列的不不变性**。如果你正在编写栈或队列，请建立一个如何使用栈或队列类字段的约定（不变性），并确保所有方法都保持这种不变性。\n\
