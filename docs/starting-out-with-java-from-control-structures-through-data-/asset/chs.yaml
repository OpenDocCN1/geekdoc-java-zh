  \ boxes）呢？\n4. 如何创建一个包含其他组件及其相关代码的特殊面板？\n\n## 编程挑战\n\n### 1. 零售价计算器\n创建一个 GUI 应用，用户可以在文本字段中输入商品的批发成本和其加成百分比。（例如，如果一件商品的批发成本为\
  \ $5，加成百分比为 100%，则其零售价为 $10。）该应用程序应有一个按钮，点击时显示该商品的零售价。\n\n### 2. 月销售税\n一家零售公司必须提交一份每月销售税报告，列出当月的总销售额以及收取的州税和县销售税金额。州销售税率为\
  \ 4%，县销售税率为 2%。创建一个 GUI 应用，允许用户在文本字段中输入当月的总销售额。根据该数字，应用程序应计算并显示以下内容：\n\n* 县销售税金额\n\
  * 州销售税金额\n* 总销售税（县税加州税）\n\n在应用程序代码中，将县税率 (0.02) 和州税率 (0.04) 表示为命名常量。\n\n### 3. 产税\n\
  某县根据财产的评估值征收产税，评估值为财产实际价值的 60%。如果一英亩土地的价值为 $10,000，则其评估值为 $6,000。那么，每 $100 的评估值收取的产税为\
  \ $0.64。对于评估值为 $6,000 的土地，产税为 $38.40。创建一个 GUI 应用，当用户输入财产的实际价值时，显示评估值和产税。\n\n###\
  \ 4. 差旅费\n\n\n\n\n创建一个 GUI 程序，用于计算并显示商务人士出差的总费用。用户必须提供以下信息：\n\n* • 出差天数\n* • 航空机票费用（如有）\n\
  * • 租车费用（如有）\n* • 如果使用私家车，行驶的里程数\n* • 停车费（如有）\n* • 出租费（如有）\n* • 会议或讨会注册费（如有）\n*\
  \ • 住宿费，每晚\n\n公司根据以下政策报销差旅费用：\n\n* • 每天 $37 的餐费\n* • 停车费每天最高 $10.00\n* • 出租费每天最高\
  \ $20.00\n* • 住宿费每天最高 $95.00\n* • 如果使用私家车，每英里 $0.27\n\n该程序应能计算并显示以下内容：\n\n* • 商务人士产生的总费用\n\
  * 本次行程的总允许费用\n* 商务人士必须支付的超额部分（如有）\n* 如果费用低于总允许金额，商务人士节省的金额\n\n## 5. 电影院收入\n\n电影院仅保留门票销售收入的百分比。剩余部分归电影公司。创建一个\
  \ GUI 程序，允许用户在文本框中输入以下数据：\n\n* • 成人票单价\n* • 成人票销售数量\n* • 儿童票单价\n* • 儿童票销售数量\n\n\
  程序应计算并显示电影院单晚的票务业务数据：\n\n* **成人票销售总收入**。这是所有出售成人票所收取的金额。\n* **成人票销售净收入**。这是扣除给电影公司的费用后剩余的门票销售金额。\n\
  * **儿童票销售总收入**。这是所有出售儿童票所收的金额。\n* **儿童票销售净收入**。这是扣除给电影公司的费用后剩余的门票销售金额。\n* **总总收入**。成人和儿童票销售总收入的总和。\n\
  * **总净收入**。成人和儿童票销售净收入的总和。\n\n假设电影院保留其票房收入的 20%。在代码中使用常量来表示此百分比。\n\n## 6. Joe 的汽车维修\n\
