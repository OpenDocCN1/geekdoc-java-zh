  \n![Image](img/00825.jpg)\n\n![Image](img/00826.jpg)\n\n回想第 6 章，方法的签名由方法名称和参数的数据类型组成，按它们出现的顺序。为了让子类方法重写父类，它必须具有相同的签名。当子类对象调用该方法时，它调用的是子类的版本，而不是父类的。\n\
