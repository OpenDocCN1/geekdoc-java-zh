  \ `SwingConstants.LEFT`、`SwingConstants.CENTER` 或 `SwingConstants.RIGHT` 来指定水平对齐方式。这里是一个示例：\n\
  \n```java\nImageIcon image = new ImageIcon(\"Smiley.gif\");\nJLabel label = new\
  \ JLabel(\"Have a nice day!\", image, SwingConstants.RIGHT);\n```\n\n你也可以在按钮中显示图像，如图\
  \ 13-15 所示。\n\n# 图 13-15 显示图像图标的按钮\n\n![Image](img/01012.jpg)\n\n创建带有图像的按钮与创建带有图像的标签相似。你使用\
