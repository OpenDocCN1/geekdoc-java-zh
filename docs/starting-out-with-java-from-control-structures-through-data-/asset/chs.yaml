  \n### 7.5 单选按钮和复选框\n\n> **概念：单选按钮通常以两个或多个一组出现，允许用户从几个可能的选项中选择一个。复选框可以单独出现也可以成组出现，允许用户进行是/否或开启/关闭的选择。**\n\
  \n#### 单选按钮\n\n当你想让用户从几个可能的选项中选择一个时，`Radio buttons` 是很有用的。图 7-24 显示了一组单选按钮。\n\n\
  图 7-24 单选按钮\n\n![Image](img/00458.jpg)\n\n单选按钮可以被选中或取消选中。当单选按钮被选中时，圆圈是填充的，当未选中时为空。你使用\
  \ `JRadioButton` 类来创建单选按钮。以下是两种 `JRadioButton` 构造函数的通用格式：\n\n```\nJRadioButton(String\
  \ text)\n```\n```\nJRadioButton(String text, boolean selected)\n```\n\n第一个构造函数创建一个未选中的单选按钮。传递给\
  \ `text` 参数的字符串是显示在单选按钮旁文字。例如，以下语句创建一个旁边显示“Choice 1”的单选按钮。该按钮是未选中的。\n\n```\nJRadioButton\
  \ radio1 = new JRadioButton(\"Choice 1\");\n```\n\n第二个构造函数接受额外的 `boolean` 参数，传递给\
  \ `selected` 参数。如果传递 `true`，则单选按钮被选中；如果传递 `false`，则未选中。例如，以下语句创建一个显示“Choice 1”的单选按钮。该按钮是选中的。\n\
  \n```\nJRadioButton radio1 = new JRadioButton(\"Choice 1\", true);\n```\n\n单选按钮通常成组出现。当一组单选按钮成组时，组内只有一个单选按钮可以被选中。点击一个单选按钮会选中它并自动取消选中组内的其他单选按钮。由于组内任何时候只有一个单选按钮被选中，因此这些按钮被称为`互斥`的。\n\
  \n![Image](img/00005.jpg)\n\n**注意：** “单选按钮”名称源于旧收音机，它们有用于选择电台的按按钮。一次只有一个按钮可以被按下。当你按下一个按钮时，它会自动弹出另一个已按下的按钮。\n\
  \n#### 使用 `ButtonGroup` 类进行分组\n\n一旦创建了希望在组中显示的 `JRadioButton` 对象，你就必须创建一个 `ButtonGroup`\
  \ 类的实例，然后将 `JRadioButton` 对象添加到其中。`ButtonGroup` 对象会在它所包含的单选按钮之间创建互斥关系。以下代码显示了一个示例：\n\
  \n```\n// 创建三个单选按钮。\nJRadioButton radio1 = new JRadioButton(\"Choice 1\", true);\n\
  JRadioButton radio2 = new JRadioButton(\"Choice 2\");\nJRadioButton radio3 = new\
  \ JRadioButton(\"Choice 3\");\n\n// 创建一个 ButtonGroup 对象。\nButtonGroup group = new\
  \ ButtonGroup();\n\n// 将单选按钮添加到 ButtonGroup 对象中。\ngroup.add(radio1);\ngroup.add(radio2);\n\
  group.add(radio3);\n```\n\n\n\n\n\n虽然你将单选按钮添加到 `ButtonGroup` 对象中，但 `ButtonGroup`\
  \ 对象并不是像 `JPanel` 对象或内容框架那样的容器。`ButtonGroup` 对象的作用是在当其中一个单选按钮被选中时，取消所有其他单选按钮的选择。如果你想将单选按钮添加到面板或内容框架，你必须逐个添加，如下所示：\n\
  \n```java\n// Add the radio buttons to the JPanel referenced by panel.\npanel.add(radio1);\n\
  panel.add(radio2);\npanel.add(radio3);\n```\n\n### 响应单选按钮事件\n\n与 `JButton` 对象一样，`JRadioButton`\
  \ 对象在被点击时会产生动作事件（action event）。要响应单选按钮动作事件，你必须编写一个监听器类，然后将该类的实例注册到 `JRadioButton`\
  \ 对象上。为了演示这一点，我们将查看 `MetricConverterWindow` 类，它与之前显示的 `KiloConverterWindow` 类相似。`MetricConverterWindow`\
  \ 类展示了一个窗口，用户可以在其中输入以公里的距离，然后点击单选按钮查看该距离转换为英里、英尺或英寸。转换公式如下：\n\n`Miles` = `Kilometers`\
  \ × 0.6214\n`Feet` = `Kilometers` × 3281.0\n`Inches` = `Kilometers` × 39370.0\n\n\
  图 7-25 显示了该窗口外观的草图。从草图中可以看出，窗口将有一个标签、一个文本字段和三个单选按钮。当用户点击其中一个单选按钮时，距离将转换为选定的单位并显示在单独的\
  \ `JOptionPane` 对话框中。\n\n**图 7-25** 公制转换窗口\n\n![Image](img/00459.jpg)\n\n`MetricConverterWindow`\
