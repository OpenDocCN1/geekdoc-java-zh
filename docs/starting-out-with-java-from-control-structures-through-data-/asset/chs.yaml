  A\nB\n```\n\n## 赋值与初始化\n\n正如你已经在几个例子中所看到的，赋值语句将一个值放入变量。例如，以下语句赋值：\n\n`unitsSold\
  \ = 12;`\n\n`=` 符号被称为赋值运算符。运算符对数据进行操作。运算符操作的数据被称为操作数。在上述语句中，操作数是 `unitsSold` 和 `12`。接收赋值的变量必须出现在运算符的左侧，被赋值的值必须出现在右侧。以下语句是错误的：\n\
  \n`12 = unitsSold; // 错误！`\n\n左侧的操作数必须是变量名。右侧的操作数必须是一个有值的表达式。假设 `length` 和 `width`\
  \ 都是 `int` 变量，以下代码说明赋值运算符的右操作数可以是字面量或变量：\n\n```java\nlength = 20;\nwidth = length;\n\
  ```\n\n重要的是赋值运算符只改变其左操作数的内容。第二个语句将 `length` 的值赋给 `width`。语句执行后，`length` 仍然具有相同的值\
  \ `20`。\n\n你也可以在声明语句为变量赋值。这被称为初始化。代码列表 2-16 展示了如何操作。\n\n此程序中的变量声明语句位于第 7 行：\n\n\
  ```java\nint month = 2, days = 28;\n```\n\n**代码列表 2-16 (`Initialize.java`)**\n\n\
