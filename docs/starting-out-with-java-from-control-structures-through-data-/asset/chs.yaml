  \n* * *\n\n**警告！你不能在数值字面量中嵌入逗号。例如，以下语句会导致错误：\n\n`number = 1,257,649; // 错误!`\n\n\
  该语句必须写成：\n\n`number = 1257649; // 正确。`\n\n* *\n\n### 浮点数据类型\n\n整数对于许多工作是不够的。如果你正在编写处理金额或精确测量程序，你需要一种允许小数值的数据类型。在编程术语中，这些被称为浮点数。例如，1.7\
  \ 和 –45.316 是浮点数。\n\n在 Java 中，有两种数据类型可以表示浮点数。它们是 `float` 和 `double`。`float` 数据类型被认为是单精度数据类型。它可以存储具有\
  \ 7 位精度的浮点数。`double` 数据类型被认为是双精度数据类型。它可以存储具有 15 位精度的浮点数。然而，`double` 数据类型使用的内存是 `float`\
  \ 的两倍。`float` 变量占用 4 字节内存，而 `double` 变量使用 8 字节。\n\n代码列表 2-11 显示了一个使用三个 `double`\
  \ 变量的程序。\n\n**代码列表 2-11 (`Sale.java`)**\n\n\n\n\n\n![Image](img/00052.jpg)\n\n##\
  \ 程序输出\n\n```\n  The price of the item is 29.75\n  The tax is 1.76\n  The total\
  \ is 31.51\n```\n\n## 浮点字面量 (Floating-Point Literals)\n\n你在程序代码中编写浮点字面量时，Java 会假设它是\
  \ `double` 数据类型。例如，在代码列表 2-11 中，字面量 `29.75`、`1.76` 和 `31.51` 都被视为 `double` 值。正如此，在将浮点字面量赋值给\
  \ `float` 变量时可能会出现问题。Java 是一种**强类型语言**（strongly typed language），这意味着它允许你在变量中存储兼容数据类型的值。`double`\
  \ 值与 `float` 变量不兼容，因为 `double` 的值可以远大于或小于 `float` 的允许范围。因此，像下面的代码会导致错误：\n\n```java\n\
  float number;\nnumber = 23.5; // 错误！\n```\n\n但是，通过在字面量后加上字母 `F` 或 `f`，你可以强制将 `double`\
  \ 字面量视为 `float`。前面的代码可以用以下方式重写以防止错误：\n\n```java\nfloat number;\nnumber = 23.5F;\
  \ // 这可以工作。\n```\n\n![Image](img/00007.jpg)\n\n**警告！** 如果你处理代表金额的字面量，请记住不能在字面量嵌入货币符号（如\
  \ `$`）或逗号。例如，以下语句会导致错误：\n\n```java\ngrossPay = $1,257.00; // 错误！\n```\n\n该语句必须写为：\n\
  \n```java\ngrossPay = 1257.00; // 正确。\n```\n\n## 科学计数和 E 表示法 (Scientific and E Notation)\n\
  \n浮点字面量可以用科学计数法表示。以数字 `47,281.97` 为例。在科学计数法中，这个数字是 `4.728197 × 10⁴`。（`10⁴` 等于 `10,000`，而\
  \ `4.728197 × 10,000` 是 `47,281.97`。）\n\nJava 使用 E 表示法来表示科学计数法的值。在 E 表示法中，数字 `4.728197\
