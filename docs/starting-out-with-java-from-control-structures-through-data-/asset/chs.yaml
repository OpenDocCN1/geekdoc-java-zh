  \n`Timer` 对象按固定的时间间隔自动生成动作事件。当你希望程序在特定时间执行操作或在经过一段时间后执行操作时，这非常有用。\n\n`Timer` 对象是由\
  \ `Timer` 类创建的，该类位于 `javax.swing` 包中。以下是 `Timer` 类构造函数的通用格式：\n\n`Timer(int delay,\
  \ ActionListener listener)`\n\n传递给 `delay` 参数的参数是动作事件之间的时间，以毫秒为单位。一毫秒是秒的千分之一，因此\
  \ `delay` 值为 1000 会导致每秒生成一次动作事件。传递给 `listener` 参数的参数是用于要注册到 `Timer` 对象的动作监听器的引用。如果你想在稍后添加动作监听器，可以传递\
  \ `null` 作为此参数，然后使用 `Timer` 对象的 `addActionListener` 方法来注册动作监听器。表 14-5 列出了 `Timer`\
  \ 类的方法。\n\n应用程序可以使用 `Timer` 对象按固定的时间间隔自动执行代码。例如，可以使用 `Timer` 对象通过在固定的时间间隔内按一定量在屏幕上移动图形图像来执行简单动画。这在代码列表\
  \ 14-22 中所示的 `BouncingBall` 类中得到了。该类是一个显示跳动球的 applet，如图 14-31 所示。\n\n**表 14-5**\
