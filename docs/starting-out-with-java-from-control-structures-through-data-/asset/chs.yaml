  ```\nif (isValid && x > 90)\n```\n\n### `||` 运算符\n\n`||` 运算符被称为逻辑或运算符。它接受两个 `boolean`\
  \ 表达式作为操作数，并创建一个当任一子表达式为 `true` 时为 `true` 的 `boolean` 表达式。这是一个使用 `||` 运算符的 `if`\
  \ 语句示例：\n\n```\nif (temperature < 20 || temperature > 100)\n{\n    System.out.println(\"\
  The temperature is in the \" + \"danger zone.\");\n}\n```\n\n如果 `temperature` 小于\
  \ 20 或者 `temperature` 大于 100，将显示消息。如果任一个关系测试为 `true`，则整个表达式为 `true`。\n\n表 3-7 显示了\
  \ `||` 运算符的真值表。\n\n或表达式要变为 `true`，只需要 `||` 运算符的某侧为 `true`。另一侧是 `false` 还是 `true`\
  \ 并不重要。与 `&&` 运算符一样，`||` 运算符执行短路求值。如果 `||` 运算符左侧的表达式为 `true`，则不会检查右侧的表达式。因为只需要其中一个表达式为\
  \ `true`，检查剩余表达式将浪费 CPU 时间。\n\n**表 3-7** `||` 运算符的真值表\n\n![Image](img/00161.jpg)\n\
