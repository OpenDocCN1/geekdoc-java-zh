  \ 21 34`\n\n## 寻找最大公约数\n\n我们的下一个递归示例是计算两个数的最大公约数，或 GCD。两个正整数 `x` 和 `y` 的 GCD 如下：\n\
  \n> 如果 `y` 能整整除 `x`，则 `gcd(x, y)` = `y`\n\n> 否则，`gcd(x, y)` = `gcd(y, x/y 的余数)`\n\
  \n该定义规定，如果 `x/y` 没有余数，则 `x` 和 `y` 的 GCD 是 `y`。这是基准情况。否则，答案是 `y` 和 `x/y` 余数的 GCD。代码列表\
  \ 15-8 中的程序显示了一个用于计算 GCD 的递归方法。\n\n### 代码列表 15-8 (`GCDdemo.java`)\n\n```\n![Image](img/01189.jpg)\n\
