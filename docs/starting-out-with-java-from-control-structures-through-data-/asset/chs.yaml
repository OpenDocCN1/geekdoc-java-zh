  \n9. 这是在 try 块执行之后、且在抛出异常后任何 catch 块执行之后，始终执行的一个或多个语句。\na. try 块 (try block)\nb.\
  \ catch 块 (catch block)\nc. finally 块 (finally block)\nd. 保护块 (protected block)\n\
  \n10. 这是当前正在执行的所有方法的内部列表。\na. 调用列表 (invocation list)\nb. 调用堆栈 (call stack)\nc. 调用列表\
  \ (call list)\nd. 列表跟踪 (list trace)\n\n11. 此方法可以从任何异常对象调用，并显示了抛出异常时调用的方法链。\na. `printInvocationList`\n\
  b. `printCallStack`\nc. `printStackTrace`\nd. `printCallList`\n\n12. 这些是继承自 `Error`\
  \ 类或 `RuntimeException` 类的异常。\na. 不可恢复异常 (unrecoverable exceptions)\nb. 未检查异常 (unchecked\
  \ exceptions)\nc. 可恢复异常 (recoverable exceptions)\nd. 检查异常 (checked exceptions)\n\
  \n13. 所有不继承自 `Error` 类或 `RuntimeException` 类的异常都是 __________。\na. 不可恢复异常 (unrecoverable\
  \ exceptions)\nb. 未检查异常 (unchecked exceptions)\nc. 可恢复异常 (recoverable exceptions)\n\
  d. 检查异常 (checked exceptions)\n\n14. 这告知编译器可能从方法抛出的异常。\na. `throws` 子句 (throws clause)\n\
  b. 参数列表 (parameter list)\nc. `catch` 子句 (catch clause)\nd. 方法返回类型 (method return\
  \ type)\n\n15. 你使用此语句手动抛出异常。\na. `try`\nb. `generate`\nc. `throw`\nd. `System.exit(0)`\n\
  \n16. 这是将对象转换为表示对象数据的一系列字节流的过程。\na. 序列化 (serialization)\nb. 反序列化 (deserialization)\n\
  c. 动态转换 (dynamic conversion)\nd. 转换 (casting)\n\n17. **对或错：** 你不需要捕获继承自 `RuntimeException`\
  \ 的异常。\n18. **对或错：** 当 try 块内部的代码抛出异常时，try 块中的所有语句始终执行。\n19. **对或错：** `IOException`\
  \ 是与编程错误（如数组下标越界）相关的异常的父类。\n20. **对或错：** 每个 `try` 语句不能有多个 `catch` 子句。\n21. **对或错：**\
  \ 当抛出异常时，JVM 从上到下搜索 `try` 语句的 `catch` 子句，并将程序控制权传递给第一个与异常兼容的参数的 `catch` 子句。\n22.\
  \ **对或错：** 在不考虑多态引用，`try` 语句对于每种特定类型的异常只能有一个 `catch` 子句。\n23. **对或错：** 在同一个 `try`\
  \ 语句中处理多个异常，且某些异常通过继承相互相关时，你应该在处理更具体的异常类之前处理更通用的异常类。\n24. **对或错：** `throws` 子句会导致异常被抛出。\n\
