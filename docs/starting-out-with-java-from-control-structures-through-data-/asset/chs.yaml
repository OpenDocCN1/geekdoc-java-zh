  \ `HashSet` 的构造函数相似。由于 `HashMap` 类使用哈码存储键，它提供了允许指定初始容量和负载因子的构造函数。（关于初始容量和负载因子的讨论，请参见之前关于\
  \ `HashSet` 类的节。）\n\n**表 18-12** `HashMap` 构造函数\n\n![Image](img/01383.jpg)\n\n**代码列表\
