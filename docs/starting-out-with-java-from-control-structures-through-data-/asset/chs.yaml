  \n> `StringBuilder` 类的 `replace` 方法与 `String` 类的 `replace` 方法有何不同？\n\n### **10.5\
  \ 分词字符串**\n\n> **概念：字符串标记（Tokenizing）是将字符串分解为组件的过程，这些组件被称为标记（tokens）。`StringTokenizer`\
  \ 类和 `String` 类的 `split` 方法可用于字符串标记**\n\n有时字符串会包含一组由空格或其他字符分隔的单词或其他数据项。例如，查看以下字符串：\n\
  \n`  \"peach raspberry strawberry vanilla\"`\n\n\n\n\n\n此字符串包含以下四个数据项：`peach, raspberry,\
  \ strawberry` 和 `vanilla`。在编程术语中，此类项被称为 `tokens`（标记）。注意到项目之间出现了一个空格。分隔标记的字符被称为 `delimiter`（分隔符）。这里是另一个示例：\n\
  \n```\n  \"17;92;81;12;46;5\"\n```\n\n此字符串包含以下标记：`17, 92, 81, 12, 46` 和 `5`。注意到每个项目之间都出现了一个分号。在这个示例中，分号被用作\
  \ `delimiter`。某些编程问题要求你读取一个包含项目列表的字符串，然后从字符串中提取所有标记以进行处理。例如，看下方的这个包含日期的字符串：\n\n\
  ```\n  \"3-22-2009\"\n```\n\n此字符串中的标记是 `3, 22` 和 `2009`，分隔符是连字符 `-`。也许程序可能需要从此类字符串中提取月份、日期和年份。另一个示例是操作系统的路径，例如：\n\
  \n```\n  /home/rsullivan/data\n```\n\n此字符串中的标记是 `home, rsullivan` 和 `data`，分隔符是\
  \ `/` 字符。也许程序可能需要从此类路径中提取所有的目录名称。\n\n将字符串拆分为标记的过程被称为 `tokenizing`（标记化）。在本节中，我们将讨论\
  \ Java 用于字符串标记化的两个工具：`StringTokenizer` 类以及 `String` 类的 `split` 方法。\n\n##  `StringTokenizer`\
  \ 类\n\nJava API 提供了一个名为 `StringTokenizer` 的类，允许你对字符串进行标记化。该类是 `java.util` 包的一部分，因此在任何使用它的程序中，你都需要以下导入语句：\n\
  \n```\n  import java.util.StringTokenizer;\n```\n\n当你创建一个 `StringTokenizer` 类的实例时，会将一个\
  \ `String` 作为参数传递给其中一个构造函数。标记将从该字符串中提取。表 10-11 总结了该类的三个构造函数。\n\n**表 10-11** `StringTokenizer`\
  \ 构造函数\n\n![Image](img/00759.jpg)\n\n第一个构造函数使用空白字符作为分隔符。以下语句实例化了一个 `StringTokenizer`\
  \ 对象并使用了此构造函数：\n\n```\n  StringTokenizer strTokenizer = new StringTokenizer(\"2\
  \ 4 6 8\");\n```\n\n第二个构造函数接受第二个参数，该字符串包含一个或多个将用作分隔符的字符。以下语句使用此构造函数创建一个对象。它指定将 `-`\
  \ 字符用作分隔符。\n\n```\n  StringTokenizer strTokenizer =\n                 new StringTokenizer(\"\
  10-14-2009\", \"-\");\n```\n\n第三个构造函数接受第二个参数（包含一个或多个将用作分隔符的字符的字符串）以及第三个参数（该参数指示是否将分隔符作为标记包含）。以下语句使用此构造函数创建一个对象。它指定将\
  \ `-` 字符用作分隔符，并且将分隔符作为标记包含。\n\n```\n  StringTokenizer strTokenizer =\n         \
  \        new StringTokenizer(\"10-14-2009\", \"-\", true);\n```\n\n![Image](img/00005.jpg)\n\
  \n**注意：** 前两个构造函数不包含分隔符字符标记。\n\n## 提取标记\n\n一旦你创建了 `StringTokenizer` 对象，就可以使用它的方法从传递给构造函数的字符串中提取标记。表\
  \ 10-12 列出了一些 `StringTokenizer` 的方法。\n\n**表 10-12** 一些 `StringTokenizer` 方法\n\n\
  ![Image](img/00760.jpg)\n\n以下代码演示了如何从 `StringTokenizer` 对象中提取所有标记。只要还有剩余标记待提取，循环就会执行。\n\
  \n![Image](img/00761.jpg)\n\n此代码将产生以下输出：\n\n```\n  One\n  Two\n  Three\n```\n\n\
  代码列表 10-8 中的 `DateComponent` 类使用了 `StringTokenizer` 对象。它的构造函数接受一个包含 `MONTH/DAY/YEAR`\
  \ 格式日期的字符串。它提取月份、日期和年份并将这些值存储在 `month`、`day` 和 `year` 字段中。然后可以使用 `getMonth`、`getDay`\
  \ 和 `getYear` 方法来检索这些值。代码列表 10-9 中的程序演示了这个类。\n\n**代码列表 10-8 (`DateComponent.java`)**\n\
  \n![Image](img/00762.jpg)\n\n![Image](img/00763.jpg)\n\n**代码列表 10-9 (`DateTester.java`)**\n\
  \n![Image](img/0074.jpg)\n\n### 使用分隔符\n\n某些情况需要你使用字符作为分隔符。例如，看下面的邮箱地址：\n\n```\n\
  joe@com\n```\n\n此字符串使用了两个分隔符：`@`（at 符号）和 `.`（点）。要从此字符串中提取标记，我们必须同时指定两者。在这里：\n\n\
  ![Image](img/0076.jpg)\n\n此代码将产生以下输出：\n\n```\njoe\ncom\n```\n\n### 修剪字符串\n\n当你对用户输入的字符串进行标记化，并且使用了空白以外的字符时，你可能希望在标记化之前对字符串进行修剪。否则，如果用户输入了开头字符，它们将成为第一个标记的一部分。同样，如果用户输入了结尾字符，它们将成为最后一个标记的一部分。这里有一个示例：\n\
  \n![Image](img/0077.jpg)\n\n为了防止开头和结尾字符包含在标记中，请使用 `String` 类的 `split` 方法\n\n`String`\
  \ 类有一个名为 `split` 的方法，它可以将字符串标记化并返回一个 `String` 对象数组。数组中的每个元素都是一个标记。以下代码摘自程序 *Demo1.java*，演示了该方法的用法：\n\
  \n```java\n// 创建一个需要标记化的字符串。\nString str = \"one two three four\";\n// 从字符串获取标记。\n\
  String[] tokens = str.split(\" \");\n// 显示每个标记。\nfor (String s : tokens)\n    System.out.println(s);\n\
  ```\n\n传递给 `split` 方法的参数指示分隔符。在这个示例中，空格被用作分隔符。代码将产生以下输出：\n\n```\none\ntwo\nthree\n\
  four\n```\n\n你传递给 `split` 方法的参数是一个*正则表达式*（regular expression）。正则表达式是一个指定字符模式的字符串。正则表达式是非常强大的工具，用于在字符串、文件或其他文本集合中搜索模式。对正则表达式的完整讨论超出了本书的范围。然而，我们将讨论用于字符串标记化的正则表达式的一些基本用法。\n\
  \n在上一个示例中，我们向 `split` 方法传递了一个包含单个空格的字符串。这指定了空格字符是分隔符。`split` 方法还允许你使用多字符分隔符。这意味着你并不局限于使用单个字符作为分隔符。如果你愿意，分隔符可以是整个单词。以下代码演示了这种用法：\n\
  \n```java\n// 使用 \" 和 \" \" 作为分隔符获取标记。\n```\n\n\n\n\n\n```java\nString[] tokens\
  \ = str.split(\" and \");\n// 显示这些标记。\nfor (String s : tokens)\n    System.out.println(s);\n\
  ```\n\n这段代码将产生以下输出：\n\n```\none\ntwo\nthree\nfour\n```\n\n之前的代码演示了多字符分隔符（包含多个字符的分隔符）。你也可以指定一系列字符，其中每个单独字符都是一个分隔符。在对\
  \ `StringTokenizer` 类的讨论中，我们使用了以下字符串作为需要多个分隔符的示例：\n\n```\njoe@gaddisbooks.com\n\
  ```\n\n该字符串使用了两个分隔符：`@`（“at”字符）和 `.`（句号）。为了指定 `@` 字符和 `.` 字符都是分隔符，我们必须在正则表达式内部将它们括在括号中。正则表达式看起来如下所示：\n\
  \n```java\n\"[@.]\"\n```\n\n由于 `@` 和 `.` 字符被包含在括号中，它们将被分别视为分隔符。下面的代码取自 `SplitDemo3.java`\
  \ 程序，演示了：\n\n```java\n// 创建一个字符串进行分词。\nString str = \"joe@gaddisbooks.com\";\n//\
  \ 使用 @ 和 . 作为分隔符获取标记。\nString[] tokens = str.split(\"[@.]\");\n// 显示这些标记。\nfor (String\
  \ s : tokens)\n    System.out.println(s);\n```\n\n这段代码将产生以下输出：\n\n```\njoe\ngaddisbooks\n\
  com\n```\n\n#### !![Image](img/00004.jpg) 检查点\n\n> 10.25 下面的字符串包含三个标记。它们是什么？哪个字符是分隔符？\n\
