  **概念：单个数组元素的处理方式与其他任何其他类型一样。**\n\n处理数组元素与处理变量没有区别。例如，以下语句将 `hours[3]` 乘以变量 `payRate`：\n\
  \n```java\ngrossPay = hours[3] * payRate;\n```\n\n以下是对数组元素进行前自增和后自增的示例：\n\n```java\n\
  int[] score = {7, 8, 9, 10, 11};\n++score[2]; // 前自增\nscore[4]++; // 后自增\n```\n\n\
  使用自增和自减运算符时，注意不要在打算用于数组时将运算符用在下标上。例如，以下语句减少了变量 `count` 值，但对数组中的值什么都没做：\n\n```java\n\
  count--;\n```\n\n代码列表 8-5 演示了数组元素的使用。循环遍历数组的每个元素，使用这些元素计算五名员工的总工资。\n\n**代码列表 8-5\
  \ (`PayArray.java`)**\n\n![Image](img/00529.jpg)\n\n![Image](img/00530.jpg)\n\n\
  **带有示例输入的程序输出**\n\n```\nEnter the hours by 5 employees who earn the same hourly\
  \ rate.\nEmployee #1: 10\nEmployee #2: 20\nEmployee #3: 30\nEmployee #4: 40\nEmployee\
  \ #5: 50\nEnter the hourly rate for each employee: 10\nHere is each employee’s gross\
  \ pay:\nEmployee #1: $100.0\nEmployee #2: $200.0\nEmployee #3: $300.0\nEmployee\
  \ #4: $400.0\nEmployee #5: $500.0\n```\n\n在第 41 行，以下语句将 `hours[index]` 乘以 `payRate`\
  \ 的值赋值给 `grossPay` 变量：\n\n```java\ngrossPay = hours[index] * payRate;\n```\n\n\n\
  \n\n\n在本书的源代码中（可以在 [www.pearsonhighered.com/gaddis](http://www.pearsonhighered.com/gaddis)\
  \ 找到），你会发现 `Overtime.java` 文件，它是 代码清单 8-5 中 `PayArray.java` 程序的修改。`Overtime.java`\
  \ 程序在总工资中包含了加班工资。如果员工工作超过 40 小时，超出部分将使用普通工资率的 1.5 倍作为加班费率。\n\n## 数组长度\n\nJava 中的每个数组都有一个名为\
  \ `length` 的公共字段。该字段包含数组中的元素个数。例如，考虑由以下语句创建的数组：\n\n```\n  double[] temperatures\
  \ = new double[25];\n```\n\n由于 `temperatures` 数组有 25 个元素，以下语句会将 25 赋值给变量 `size`：\n\
  \n```\n  size = temperatures.length;\n```\n\n处理数组的全部内容时，`length` 字段非常有用。例如，以下循环遍历数组并显示每个元素的内容。数组的\
  \ `length` 字段被用于测试表达式，作为循环控制变量的上限：\n\n```\n  for (int i = 0; i < temperatures.length;\
  \ i++)\n      System.out.println(temperatures[i]);\n```\n\n![Image](img/00007.jpg)\n\
  \n**警告！** 使用 `length` 字段作为下标的上限时，注意不要导致差错（off-by-one error）。`length` 字段包含数组中的元素个数。数组最大的下标是\
  \ `length - 1`。\n\n![Image](img/00005.jpg)\n\n**注意：** 你不能更改数组 `length` 字段的值。\n\n\
  ## 增强型 `for` 循环\n\nJava 提供了一种特殊的 `for` 循环，在许多情况下它可以简化数组处理。它被称为增强 `for` 循环。以下是增强\
  \ `for` 循环的通用格式：\n\n```\n  for (dataType elementVariable : array)\n    statement;\n\
  ```\n\n增强 `for` 循环的设计用于为数组中的每个元素迭代一次。循环每次迭代时，它会将一个数组元素复制到一个变量。让我们更仔细地查看其语法：\n\n\
  - `dataType elementVariable` 是变量声明。在每次循环迭代中，该变量将接收不同数组元素的值。在第一次循环迭代中，它接收第一个元素的值；在第二次迭代中，它接收第二个元素的值，依此类推。该变量的类型必须与数组元素的类型相同，或者是是元素可以自动转换的类型。\n\
  - `array` 是你希望循环对其操作的数组名称。循环将为数组中的每个元素迭代一次。\n- `statement` 是在循环迭代期间执行的语句。\n\n例如，假设我们有如下的数组声明：\n\
  \n```\n  int[] numbers = { 3, 6, 9 };\n```\n\n我们可以使用以下增强 `for` 循环来显示 `numbers` 数组的内容：\n\
  \n```\n  for (int val : numbers)\n      System.out.println(val);\n```\n\n由于 `numbers`\
  \ 数组有三个元素，此循环将迭代三次。第一次迭代时，`val` 变量将接收 `numbers[0]` 中的值。在第二次迭代中，`val` 将接收 `numbers[1]`\
  \ 中的值。在第三次迭代中，`val` 将接收 `numbers[2]` 中的值。代码的输出如下：\n\n```\n  3\n  6\n  9\n```\n\n\
  如果你需要在增强 `for` 循环中执行多条语句，只需将语句块括在在大括号中即可。这是一个示例：\n\n![Image](img/00531.jpg)\n\n\
  此代码将产生以下输出：\n\n```\n  The next value is 3\n  The next value is 6\n  The next value\
  \ is 9\n```\n\n### 增强型 `for` 循环与传统的 `for` 循环\n\n当你需要从第一个元素到最后一个元素访问数组中存储的值时，增强 `for`\
  \ 循环比传统的 `for` 循环更容易使用。使用增强 `for` 循环，你不需要担心数组的大小，不需要创建一个“索引”变量来保存下标。然而，在某些情况下，增强\
  \ `for` 循环是不够的。你无法如下使用增强 `for` 循环：\n\n- 如果你需要更改数组元素的内容\n- 如果你需要反序处理数组元素\n- 如果你需要访问某些数组元素而不是全部\n\
  - 如果你需要在循环中同时处理两个或多个数组\n- 如果你需要引用特定元素的下标下标数字\n\n在任何这些情况下，你都应该使用传统的 `for` 循环来处理数组。\n\
  \n## 让用户指定数组大小\n\nJava 允许你使用整数变量来指定数组的大小声明符。这使得允许用户指定数组的大小可能。代码清单 8-6 展示了这一点，以及\
