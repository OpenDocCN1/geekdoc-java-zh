  \n> 4.7 写出出现在 `for` 循环头部括号内的三个表达式。\n\n> 4.8. 你想写一个 `for` 循环来显示 50 次“I love to program”。假设你将使用一个名为\
  \ `count` 的控制变量。\n\n> a) 使用什么样的初始化表达式？\n\n> b) 使用什么样的测试表达式？\n\n> c) 使用什么样的更新表达式？\n\
