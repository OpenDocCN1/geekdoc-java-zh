  \ Content）”。\n\n***\n\n**图 14-13** Internet Explorer 中的安全警告\n\n![Image](img/01075.jpg)\n\
  \n### 使用 `appletviewer` 运行 Applet\n\nSun JDK 带有一个 applet viewer 程序，它可以在不需要 Web 浏览器的情况下加载并执行\
  \ applet。可以通过 `appletviewer` 命令从命令行界面运行该程序。当你运行该程序时，指定 HTML 文档的名称作为命令行参数。例如，以下命令将\
  \ `SimpleApplet.html` 作为命令行参数传递：\n\n```\nappletviewer SimpleApplet.html\n```\n\n\
