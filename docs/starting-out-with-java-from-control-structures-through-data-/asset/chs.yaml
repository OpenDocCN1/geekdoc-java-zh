  \n### 5.2 传递参数\n\n**概念：方法可以写为接收参数。这样在调用时就可以向方法传递数据。**\n\n传入方法的值被称为参数。你已经熟悉如何在方法调用中使用参数。例如，查看以下语句：\n\
  \n```\nSystem.out.println(\"Hello\");\n```\n\n该语句调用 `System.out.println` 方法并传递 `\"\
  Hello\"` 作为参数。这里是另一个示例：\n\n```\nnumber = Integer.parseInt(str);\n```\n\n该语句调用 `Integer.parseInt`\
  \ 方法并将 `str` 变量的内容作为参数。通过使用参数变量，你可以设计自己的接收此类数据的方法。*参数变量*（有时被简单称为*参数*）是用于存储传入方法值的特殊变量。这里是使用参数的方法定义：\n\
  \n* * *\n\n![Image](img/00009.jpg)\n\n**向方法传递参数**\n\n* * *\n\n```\npublic static\
  \ void displayValue(int num)\n{\n    System.out.println(\"The value is \" + num);\n\
  }\n```\n\n注意括号 `(int` `num)` 内部的整数变量声明。这是参数变量的声明，使得 `displayValue` 方法能够接收整数作为参数。这里是调用\
  \ `displayValue` 方法的示例，将 5 作为参数传递：\n\n```\ndisplayValue(5);\n```\n\n\n\n\n此语句执行了\
  \ `displayValue` 方法。括号内列出的参数被复制到方法的参数变量 `num` 中。这在图 5-7 中所示。\n\n**图 5-7** 向 `displayValue`\
  \ 方法传递 5\n\n![Image](img/00285.jpg)\n\n在 `displayValue` 方法内部，变量 `num` 将包含传递给它的任何参数的值。如果我们传递\
  \ 5 作为参数，该方法的显示结果如下：\n\n```\n      The value is 5\n```\n\n你，你可能还可以将变量的内容和表达式的值作为参数传递。例如，以下语句通过传递不同的参数调用了\
  \ `displayValue` 方法：\n\n```\n      displayValue(x);\n      displayValue(x * 4);\n\
  \      displayValue(Integer.parseInt“700”));\n```\n\n第一条语句非常简单。它将变量 `x` 中的值作为参数传递给\
  \ `displayValue` 方法。第二条语句也很简单，但它多做了一些工作：它将表达式 `x * 4` 的结果作为参数传递给 `displayValue`\
  \ 方法。第三条语句做的工作更多。它将 `Integer.parseInt` 方法返回的值作为参数传递给 `displayValue` 方法。（首先调用 `Integer.parseInt`\
  \ 方法，然后将其返回值传递给 `displayValue` 方法。）代码代码列表 5-5**\n\n![Image](img/00286.jpg)\n\n*\
  \ * *\n\n**程序输出**\n\n```\nI am passing values to displayValue.\nThe value is 5\n\
  The value is 10\nThe value is 40\nThe value is 700\nNow I am back in main.\n```\n\
  \n* * *\n\n![Image](img/00007.jpg)\n\n* * *\n\n**警告！** 当将变量作为参数时，只需在方法调用的括号内编写变量名即可。不要在方法调用中编写参数变量的数据类型。例如，以下语句会导致错误：\n\
  \n```\n       displayValue(int x); // Error!\n```\n\n方法调用应该显示如下：\n\n```\n      \
  \ displayValue(x);     // Correct\n```\n\n* * *\n\n![Image](img/00005.jpg)\n\n*\
  \ * *\n\n**注意：** 在本文中传递到方法的值称为参数（arguments），而接收这些值的变量称为形式（parameters）。这些术语有几种不同的变体。在某些领域，这些术语的含义是相反的。此外，有些人将参数称为*实参*（actual\
  \ parameters），将形式变量称为*形参*（formal parameters）。还有人使用 actual argument 和 formal argument\
  \ 这两组英文术语。无论你使用哪一组术语，保持一致性都是重要的。\n\n* * *\n\n#### 参数与形式的数据类型兼容性\n\n当你向方法传递参数时，请确保参数的数据类型与形式变量的数据类型兼容。如果参数的数据类型排名低于形式变量的数据类型，Java\
  \ 将自动执行宽类型转换。例如，`displayValue` 方法有一个 `int` 参数变量。以下两个代码段都能正常工作，因为 `short` 和 `byte`\
  \ 参数会自动转换为 `int`：\n\n```\n       short s = 1;\n       displayValue(s);         \
  \   // Converts short to int\n       byte b = 2;\n       displayValue(b);      \
  \     // Converts byte to int\n```\n\n然而，Java 不会自动将参数转换为较低排名的数据类型。这意味着 `long`、`float`\
  \ 或 `double` 值不能传递给一个具有 `int` 参数变量的方法。例如，以下代码会导致编译器错误：\n\n```\n      double d =\
  \ 1.0;\n      displayValue(d); // Error! Can't convert double to int.\n```\n\n![Image](img/00006.jpg)\n\
  \n* * *\n\n**提示：** 你可以使用强制类型转换符手动将值转换为较低排名的数据类型。例如，以下代码可以编译：\n\n```\n    double\
  \ d = 1.0;\n    displayValue((int)d); // This will work.\n```\n\n* * *\n\n#### 参数变量作用域\n\
  \n回想第 2 章 {\n    int sum = num1 + num2;\n    System.out.println(\"The sum is \"\
  \ + sum);\n}\n```\n\n假设我们反转方法调用中列出参数的顺序，如下：\n\n```\nshowSum(10, 5);\n```\n\n这将导致\
  \ `num1` 包含 10，`num2` 包含 5。这次我们将变量作为参数传递。这里有一个示例：\n\n```java\ndouble value1 = 2.5;\n\
  double value2 = 3.5;\nshowSum(value1, value2);\n```\n\n当 `showSum` 方法执行时，参数 `num1`\
  \ 将包含 2.5，`num2` 将包含 3.5。\n\n#### 参数按值传递\n\n在 Java 中，所有基本数据类型的参数都是*按值传递*的，这意味着只有参数值的副本被传递到形式变量中。方法的形式变量与方法调用括号内的参数是分离且独立的。如果在方法内部更改了形式变量，它对原始参数没有影响。例如，查看代码代码列表\
  \ 5-6 {\n        int number = 99;\n        System.out.println(\"number is \" + number);\n\
  \        changeMe(number);\n        System.out.println(\"Now the value is \" + number);\n\
  \    }\n\n    public static void changeMe(int myValue) {\n        System.out.println(\"\
  I am changing the value.\");\n        myValue = 0;\n    }\n}\n```\n\n**输出：**\n```\n\
  number is 99\nI am changing the value.\nNow the value is 99\n```\n\n\n\n\n到为止，你已经看到了接受基本类型值作为参数的方法示例。你也可以编写接受对象引用作为参数的方法。例如，查看以下方法：\n\
  \n```java\npublic static void showLength(String str)\n{\n    System.out.println(str\
  \ + \" is \" + str.length() +\n                       \" characters long.\");\n\
  }\n```\n\n该方法接受一个 `String` 对象引用作为参数，并显示该该对象字符数量的消息。下面的代码展示了如何调用该方法：\n\n```java\n\
  String name = \"Warren\";\nshowLength(name);\n```\n\n当这段代码执行时，`showLength` 方法将显示以下内容：\n\
  \n```\n    Warren is 6 characters long.\n```\n\n当对象（例如 `String`）作为参数传递时，传递的实际上是该对象的引用。在示例代码中，`name`\
  \ 变量是一个 `String` 引用变量。它被作为参数传递给 `showLength` 方法。`showLength` 方法有一个参数变量 `str`，它也是一个\
  \ `String` 引用变量，用于接收该参数。\n\n记住，引用变量持有对象的内存地址。当调用 `showLength` 方法时，存储在 `name` 中的地址被传递到\
  \ `str` 参数变量中。这在图 5-9 中有所说明。这意味着当 `showLength` 方法执行时，`name` 和 `str` 都引用同一个对象。这在图\
  \ 5-10 中所示。\n\n**图 5-9** 将引用作为参数传递\n\n![Image](img/00290.jpg)\n\n**图 5-10** `name`\
  \ 和 `str` 引用同一个对象\n\n![Image](img/00291.jpg)\n\n这可能会让你得出一个结论：方法可以改变任何作为参数传递给它的 `String`\
  \ 对象的内容。毕竟，参数变量引用的与参数是同一个对象。然而，Java 中的 `String` 对象是*不可变的*（immutable）的，这意味着它们不能被改变。例如，查看代码列表\
  \ 5-7 中的程序。它向方法传递了一个 `String` 对象，该方法似乎改变了该对象。但实际上，对象并没有改变。\n\n**代码列表 5-7 (`PassString.java`）**\n\
  \n![Image](img/00292.jpg)\n\n![Image](img/00293.jpg)\n\n* * *\n\n**程序输出**\n\n```\n\
  In main, the name is Shakespeare\nIn changeName, the name is now Dickens\nBack in\
  \ main, the name is Shakespeare\n```\n\n* * *\n\n让我们仔细观察这个程序。在执行第 12 行后，`name` 变量引用一个包含“Shakespeare”的\
  \ `String` 对象。在第 20 行，调用了 `changeName` 方法并将 `name` 变量作为参数传递。这会将 `String` 对象的地址传递到\
  \ `str` 参数变量中。此时，`name` 和 `str` 引用同一个对象，如图 5-11 所示。\n\n**图 5-11** 在执行第 36 行之前，`name`\
  \ 和 `str` 引用同一个对象\n\n![Image](img/00294.jpg)\n\n在 `changeName` 方法中，第 36 行的执行如下：\n\
  \n```java\nstr = \"Dickens\";\n```\n\n起初，你可能会认为这条语句改变了 `String` 对象的内容为“Dickens”。实际上发生的情况是创建了一个包含“Dickens”的新\
  \ `String` 对象，并将其地址存储在 `str` 变量中。在该语句执行后，`name` 变量和 `str` 参数变量引用了不同的对象。这在图 5-12\
  \ 中所示。\n\n**图 5-12** 在执行第 36 行后，`name` 和 `str` 引用不同的对象\n\n![Image](img/00295.jpg)\n\
  \n在第 10 章中，我们将详细地讨论 `String` 对象的不可变性。在此之前，只需记住这一点：`String` 对象不能被改变。每当你使用 `=` 运算符将字符串字面量赋值给\
  \ `String` 引用变量时，内存中都会创建一个新的 `String` 对象。\n\n### **在文档注释中使用 `@param` 标签**\n\n在为方法编写文档注释时，你可以使用\
  \ `@param` 标签为每个参数提供描述。当 `showSum` 方法的文档注释包含一个或多个 `@param` 标签时，javadoc 工具会在文档中创建一个“Parameters”（参数）部分。这就是列出参数描述的地方。\n\
  \n```java\n/**\n * 显示两个数字的和。\n * @param num1 第一个数字\n * @param num2 第二个数字\n */\n\
  public static void showSum(int num1, int num2)\n{\n    int sum = num1 + num2;\n\
  \    System.out.println(\"The sum is \" + sum);\n}\n```\n\n`@param` 的通用格式如下：\n\n\
  `@param parameterName Description`\n\n在通用格式中，`parameterName` 是参数名称，`Description`\
  \ 是参数的描述。关于 `@param` 以下几点：\n\n- 文档注释中的所有 `@param` 标签必须出现在方法的通用描述之后。\n- 描述可以跨多行。\n\
  - 它在文档注释的结束处（`*/`）或另一个标签的开始结束。\n\n当 javadoc 在文档注释中看到 `@param` 标签时，它就知道了参数的名称和描述。图\
  \ 5-13 展示了 *Args2.java* 中 `showSum` 方法生成的文档。\n\n**图 5-13** *Args2.java* 中 `showSum`\
