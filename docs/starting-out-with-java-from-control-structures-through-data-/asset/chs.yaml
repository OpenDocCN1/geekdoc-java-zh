  \nJava 程序可以具有以下类型的定界符：`{`、`}`、`(`、`)`、`[` 和 `]`。在正确的 Java 程序中，这些定界符必须正确嵌套。将每个左定界符\
  \ `{`、`(` 和 `[` 视为开启一个范围，并将每个右定界符 `}`、`)` 和 `]` 视为关闭相应的左定界符开启的作用。包含这些定界符的字符字符串如果每个开启的作用域最终都被关闭，且作用域的开启和关闭遵循后进先出的方式，则其具有正确的嵌套。\n\
  \n编写一个程序读取包含 Java 源代码的文件并检查其定界符是否嵌套正确。你的程序从文件中读取源代码并将其打印到屏幕上。如果文件嵌套正确，所有内容都将打印到屏幕，并打印文件嵌套正确的消息。如果文件嵌套错误，一旦检测到嵌套错误，复制文件到屏幕的操作将停止，你的程序将打印文件存在错误的消息。为了简化任务，你可以假设这些定界符不会出现在注释和字符串字面量内部，也不会以字符字面量的形式出现在程序中。\n\
  \n## 5. 追踪家谱\n\n一个文件包含 `N` 个人的家谱数据。文件的第一行包含整数 `N`，随后是 `N` 行数据。每行额外数据都指定了一个人的孩子列表。该行以该人的名字开头，随后是该人的孩子数量，最后是孩子的名字。以下是一个指定十个人家谱信息的文件示例。\n\
  \n![Image](img/01617.jpg)\n\n例如，Al 有三个孩子，分别为 Beth、Carol 和 Dino；Beth 有一个名为 Pablo\
  \ 的孩子；Dino 没有孩子。你可以假设所有名字都是唯一的。\n\n编写一个程序读取家谱信息文件，然后允许用户输入姓名对 `X` 和 `Y`。程序随后判断 `Y`\
  \ 是否是 `X` 的后代，如果是，则打印一个从 `X` 开始并以 `Y` 结束的名字列表，使得链中的每一个人都是列表中前一个人的孩子。否则，程序将说明 `Y`\
  \ 不是 `X` 的后代。\n\n***\n\n## 第 22 章\n## 二叉树、AVL 树和优先队列\n\n### 题型\n\n* 22.1 二叉树及其应用\n\
  * 22.2 二叉搜索树\n* 22.3 AVL 树\n* 22.4 优先队列\n* 22.5 需要避免的常见错误\n\n### 22.1 二叉树及其应用\n\n\
  > **概念：二叉树类似于列表，其中每个节点最多有两个后继节点。**\n\n二叉树是节点集合，其中每个节点最多关联两个节点，分别称为 `左` 孩子和 `右`孩子。二叉树中的每个节点并不都有孩子：左孩子可能缺失，右孩子可能缺失，或者两者缺失。二叉树中没有孩子的节点被称为`叶子节点`。\n\
  \n拥有节点的节点被称为其`父节点`。对于非空节点集合要构成二叉树，每个节点最多有一个父节点，且必须恰有一个父节点。那个没有父节点的节点被称为二叉树的`根`。空节点集合被视为空二叉树。\n\
  \n二叉树在某些方面与链表相似：二叉树的根对应于表的头部，二叉树中节点的节点对应于列表的后继节点。当然，空列表的对应物是空二叉树。\n\n图 22-1 展示了一个二叉树示例。标记为\
  \ `A` 的节点是根，每个箭头从父指向子。\n\n**图 22-1** 二叉树\n\n![Image](img/01618.jpg)\n\n#### 二叉树概念\n\
  \n设 `X` 是二叉树 `T` 中的一个节点。如果 `Y` 在从 `X` 到叶子节点的路径上，则 `Y` 是 `X` 的`后代`。因此，`X` 的后代包括 `X`\
  \ 自身、它的所有孩子、所有孩子的孩子，以此类推。在图 22-1 中，`C` 的后代是 `C`、`E`、`F` 和 `G`。任何节点 `X` 及其所有后代共同构成一个以\
  \ `X` 为根的二叉树：这样的二叉树被称为 `T` 的`子树`。特别，根左孩子的所有后代构成了一个被称为 `T` 的`左子树`。同样，根右孩子的所有后代构成了\
  \ `T` 的`右子树`。图 22-2 说明了图 22-1 中二叉树的左右子树。\n\n**图 22-2** 左、右子树\n\n![Image](img/01619.jpg)\n\
  \n虽然这种说法不严谨，但我们有时会将位于节点 `X` 孩子处的子树称为 `X` 的子树。根据这种说法，`{*B*, *D*}` 是 `A` 的左子树，而 `{*F*,\
  \ *G*}` 是 `C` 的右子树。\n\n\n\n\n\n`X` 的 `ancestor` 是从 `X` 到 `T` 根节点路径上的任何节点。在图 22-1\
  \ 的二叉树中，`F` 的祖先是 `F`、`C` 和 `A`。\n\n### 二叉树的应用\n\n二叉树及其推广形式有许多应用。它们可以用于组织信息，以便进行高效的搜索和检索。与二叉树密切相关的其他树的形式被用于数据库管理系统中表示数据，并用于编程语言编译器和解释器中表示表达式。图\
  \ 22-3 展示了如何使用二叉树来表示算术表达式。\n\n**图 22-3** 表达式的二叉树表示\n\n![Image](img/01620.jpg)\n\n\
  ### 表示二叉树的节点\n\n二叉树中的节点是一个对象，它包含一个存储值的字段以及另外两个存储左、右子节点引用的字段。以下是一个可以用于创建存储字符数据的二叉树节点的类：\n\
  \n![Image](img/01621.jpg)\n\n![Image](img/01622.jpg)\n\n注意 `Node` 类中的两个构造函数。当我们需要创建叶子节点时，带有一个参数的构造函数非常方便。\n\
  \n二叉树通过其根节点的引用来表示。我们可以通过执行以下语句序列来构建出图 22-4 所示的二叉树：\n\n```\nNode dNode = new Node('D');\n\
  Node cNode = new Node('C', dNode, null);\nNode bNode = new Node('B');\nNode aNode\
  \ = new Node('A', bNode, cNode);\n```\n\n**图 22-4** 使用 `Node` 类构建的二叉树\n\n![Image](img/01623.jpg)\n\
  \n### 二叉树的遍历\n\n`binary tree traversal`（二叉树遍历）是一种对二叉树中每个节点进行某种处理的系统方法。遍历二叉树的一个常见原因是打印存储在其中的值。遍历二叉树有三种标准技术。每种技术最容易实现的方法为在二叉树的根节点上调用的递归方法。它们如下：\n\
  \n> • 前序遍历：处理根节点的数据，遍历左子树，然后遍历右子树\n> • 中序遍历：遍历左子树，处理根节点的数据，然后遍历右子树\n> • 后序遍历：遍历左子树，遍历右子树，然后处理根节点的数据\n\
  \n对节点处的数据处理通常被称为 `visiting`（访问）该节点。\n\n遍历方法将子树根节点的引用 `btree` 作为参数。如果 `btree` 为 `null`，则方法立即返回；否则，它访问根节点，并按照所用遍历技术规定的顺序递归遍历两个子树。以下是中序遍历的实现，它可以打印出二叉树中存储的所有值：\n\
  \n![Image](img/01624.jpg)\n\n### 二叉树的实现\n\n可以使用如 `Node` 的类来表示节点，并使用 `Node` 引用指向根节点，来实现二叉树类。`Node`\
