  你也可以将数组传递给变长参数。这在 `VarargsDemo4.java` 中得到了演示，该程序可以在本书的在线资源页面 www.pearsonhighered.com/gaddis\
  \ 获取。\n\n### 8.12 ArrayList 类\n\n> **概念：`ArrayList` 是 Java API 中的一个类，类似于数组，并允许你存储对象。**\n\
  \nJava API 提供了一个名为 `ArrayList` 的类，可用于存储和检索对象。一旦你创建了一个 `ArrayList` 对象，你就可以认为它是存放对象的容器。`ArrayList`\
  \ 对象与对象数组相似，但比数组具有许多优势：\n\n> • 当向 `ArrayList` 添加项时，`ArrayList` 对象会自动扩展。\n> • 除了向\
  \ `ArrayList` 添加项外，你还可以移除项。\n> • 当从 `ArrayList` 中移除项时，`ArrayList` 对象会自动缩小。\n\n`ArrayList`\
  \ 类位于 `java.util` 包，因此需要以下 `import` 语句：\n\n```java\nimport java.util.ArrayList;\n\
  ```\n\n#### 创建和使用 ArrayList 对象\n\n这是一个是如何创建 `ArrayList` 对象的示例：\n\n```java\nArrayList<String>\
  \ nameList = new ArrayList<String>();\n```\n\n该语句创建一个新的 `ArrayList` 对象并将其地址存储在 `nameList`\
  \ 变量中。注意在例示例中，单词 `String` 写在单词 `ArrayList` 之后的尖角括号 `<>` 中。这指定了 `ArrayList` 可以持有\
  \ `String` 对象。如果我们尝试在此 `ArrayList` 中存储其他类型的对象，将会发生错误（在本节稍后的部分，你将看到创建一个用于存储其他类型对象的\
  \ `ArrayList` 的示例）。\n\n要向 `ArrayList` 对象添加项，你可以使用 `add` 方法。例如，以下语句向 `nameList` 添加了一系列\
  \ `String` 对象：\n\n```java\nnameList.add(\"James\");\nnameList.add(\"Catherine\"\
  );\nnameList.add(\"Bill\");\n```\n\n在这些语句执行后，`nameList` 将持有三个 `String` 对象的引用。第一个指向\
  \ \"James\"，第二个指向 \"Catherine\"，第三个指向 \"Bill\"。\n\n存储在 `ArrayList` 中的项都有相应的索引。索引指定项在\
  \ `ArrayList` 中的位置，因此类似于数组下标。第一个添加到 `ArrayList` 的项存储在索引 0 。下一个添加到 `ArrayList` 的项存储在索引\
  \ 1，依此类推。在之前述的语句执行后，“James\" 将存储在索引 0，“Catherine\" 将存储在索引 1，“Bill\" 将存储在索引 2。\n\n\
  `ArrayList` 类有一个 `size` 方法，报告存储在 `ArrayList` 中的项数。它返回 `int` 类型的数量。例如，以下语句使用该方法显示\
  \ `nameList` 中存储的项数：\n\n```java\nSystem.out.println(\"The ArrayList has \" + nameList.size()\
  \ + \" objects stored in it.\");\n```\n\n假设 `nameList` 持有 \"James\"Catherine\" 和\
  \ \"Bill\"，以下语句将显示：\n\n`The ArrayList has 3 objects stored in it.`\n\n`ArrayList`\
  \ 类的 `get` 方法返回指定索引处的项。将索引作为参数传递给方法。例如，以下语句将显示 `nameList` 中索引 1 处的项：\n\n```java\n\
  System.out.println(nameList.get(1));\n```\n\n代码列表 23 中的程序演示了目前讨论的内容。\n\n#### 在 ArrayList\
  \ 中使用增强 for 循环\n\n在本章之前，你看到了如何使用增强型 `for` 循环来遍历数组中的每个 `element`。你也可以使用增强型 `for`\
  \ 循环来遍历 `ArrayList` 中的每个项。\n\n\n\n\n\n`ArrayList` 中存储了 3 个对象。\n\n`James`\n\n`Catherine`\n\
  \n`Bill`\n\n## `ArrayList` 类的 `toString` 方法\n\n`ArrayList` 类有一个 `toString` 方法，该方法返回一个表示\
  \ `ArrayList` 对象中存储的所有项的字符串。例如，假设我们像之前所示设置了 `nameList` 对象，其中包含“James”、“Catherine”和“Bill”这些\
  \ `String`。我们可以使用以下语句显示所有名称：\n\n```\n  System.out.println(nameList);\n```\n\n`ArrayList`\
  \ 的内容将以以下方式显示：\n\n```\n  [James, Catherine, Bill]\n```\n\n这在程序 `ArrayListToString.java`\
  \ 中得到了演示，该程序可以在本书的在线资源页面 [www.pearsonhighered.com/gaddis](http://www.pearsonhighered.com/gaddis)\
  \ 获取。\n\n## 从 `ArrayList` 中删除项\n\n`ArrayList` 类有一个 `remove` 方法，可以删除指定索引处的项。你将索引作为参数传递给该方法。代码列表\
  \ 8-25 中的程序演示了这一点。\n\n### 代码列表 8-25 (`ArrayListDemo3.java`)\n\n![Image](img/00614.jpg)\n\
  \n![Image](img/00615.jpg)\n\n### 程序输出\n\n```\nIndex: 0 Name: James\nIndex: 1 Name:\
  \ Catherine\nIndex: 2 Name: Bill\n索引 1 处的项已删除。现在的项如下：\nIndex: 0 Name: James\nIndex:\
  \ 1 Name: Bill\n```\n\n请注意，当删除索引 1 处的项时（在第 27 行），之前存储在索引 2 处的项会移动到索引 1 处。当从 `ArrayList`\
  \ 中删除一个项时，其后的所有项都会向下移动位置以填补空隙。这意味着被删除项之后的每个项的索引都会减 1。\n\n请注意，如果你使用无效索引调用 `remove`\
  \ 方法，将会发生错误。\n\n## 插入项\n\n如之前所示，`add` 方法在 `ArrayList` 对象的最后一个位置添加一个项。`ArrayList`\
  \ 类有一个 `add` 方法的重载版本，允许你在指定的索引处添加一个项。这会导致项被插入到 `ArrayList` 对象的特定位置。代码列表 8-26 中的程序演示了这一点。\n\
  \n### 代码列表 8-26 (`ArrayListDemo4.java`)\n\n![Image](img/00616.jpg)\n\n![Image](img/00617.jpg)\n\
  \n### 程序输出\n\n```\nIndex: 0 Name: James\nIndex: 1 Name: Catherine\nIndex: 2 Name:\
  \ Bill\n在索引 1 添加了 Mary。现在的项如下：\nIndex: 0 Name: James\nIndex: 1 Name: Mary\nIndex:\
  \ 2 Name: Catherine\nIndex: 3 Name: Bill\n```\n\n请注意，当在索引 1 处添加新项时（在第 27 行），之前存储在索引\
  \ 1 处的项会移动到索引 2 处。在指定索引处添加项时，其后的所有项都会向上移动位置以容纳新项。这意味着新项之后的每个项的索引都会增加 1。\n\n请注意，如果你使用无效索引调用\
  \ `add` 方法，将会发生错误。\n\n## 替换项\n\n`ArrayList` 类的 `set` 方法可用于将指定索引处的项替换为另一个项。例如，以下语句将当前位于索引\
  \ 1 处的项替换为字符串“Becky”：\n\n```\n  nameList.set(1, \"Becky\");\n```\n\n这在程序 `ArrayListDemo5.java`\
  \ 中得到了演示，该程序可以在本书的在线资源页面 [www.pearsonhighered.com/gaddis](http://www.pearsonhighered.com/gaddis)\
  \ 获取。请注意，如果你指定了无效索引，将会发生错误。\n\n## 容量\n\n之前你学过 `ArrayList` 对象的尺寸（size）是存储在 `ArrayList`\
  \ 对象中的项数。当你向 `ArrayList` 对象中添加一个项时，它的大小增加 1；当你从 `ArrayList` 对象中删除一个项时，它的大小减少 1。\n\
  \n`ArrayList` 对象还有一个 `capacity`（容量），它是它在不增加增加大小的情况下可以存储的项数。当使用无参构造函数首次创建 `ArrayList`\
  \ 对象时，它的初始容量为 10 个项。这意味着它可以容最多 10 个项而无需增加大小。当添加第十一个项时，`ArrayList` 对象必须增加其大小以容纳新项。如果你需要，可以通过向\
  \ `ArrayList` 构造函数传递一个 `int` 参数来指定不同的起始容量。例如，以下语句创建了一个初始容量为 100 个项的 `ArrayList`\
  \ 对象：\n\n```\n  ArrayList<String> list = new ArrayList<String>(100);\n```\n\n我们到为止的所有示例都使用\
  \ `ArrayList` 来存放 `String` 对象。\n\n```\nArrayList<String> list = new ArrayList<String>();\n\
  ```\n\n### 代码列表 27 (`ArrayListDemo6.java`)\n\n![Image](img/00619.jpg)\n\n### 程序输出\n\
