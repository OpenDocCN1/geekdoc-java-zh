  \ 类提供了几种方法用于搜索和处理 `String` 对象**。\n\n#### 查找子字符串\n\n`String` 类提供了几种在字符串内部搜索另一个字符串的方法。*substring*（子字符串）一词通常指作为另一个字符串的一部分的字符串。表\
