  \ 0。\n\n### 8.4 一些算法算法操作\n\n#### 比较数组\n\n在上一节中，你看到不能通过将其引用变量赋值给另一个数组引用变量来复制数组。此外，你不能使用\
  \ `==` 运算符比较两个引用变量并判断数组是否相等。例如，以下代码似乎在比较两个数组，但实际上并没有：\n\n```java\nint[] firstArray\
  \ = { 5, 10, 15, 20, 25 };\nint[] secondArray = { 5, 10, 15, 20, 25 };\nif (firstArray\
  \ == secondArray) { // 这是一个错误\n    System.out.println(\"数组相同。\");\n} else {\n  \
  \  System.out.println(\"数组不同。\");\n}\n```\n\n当你对引用变量（包括引用数组的变量）使用 `==` 运算符时，运算符比较的是变量包含的内存地址，而不是变量所引用对象的内容。由于此代码中的两个数组变量引用内存中不同的对象，它们将包含不同的地址。因此，布尔表达式\
  \ `firstArray == secondArray` 的结果为 `false`，代码报告数组不同。\n\n要比较两个数组的内容，你必须比较数组的元素。\n\
  \n例如，查看以下代码：\n\n![Image](img/00543.jpg)\n\n此代码确定了 `firstArray` 和 `secondArray` 是否包含相同的值。一个布尔标记变量\
  \ `arraysEqual` 初始化为 `true`，用于指示数组是否相等。另一个变量 `index` 初始化为 0，用作循环控制变量。\n\n\n\n\n\
  首先，这段代码确定两个数组的长度是否相同。如果长度不相同，则数组不相等，因此标记变量 `arraysEqual` 被设置为 `false`。接着开始一个 `while`\
  \ 循环。只要 `arraysEqual` 为 `true` 且控制变量 `index` 小于 `firstArray.length`，循环就会继续执行。在每次迭代中，它都会比较数组中不同组对应的元素。当它发现两个值不同的对应元素时，标记变量\
  \ `arraysEqual` 被设置为 `false`。循环结束后，使用一个 `if` 语句来检查 `arraysEqual` 变量。如果该变量为 `true`，则数组相等，并显示相应的消息。否则，它们不相等，将显示另一个消息。\n\
  \n### 累加数值数组中的值\n\n要计算数组中值的总和，必须使用带有带有累加器变量的循环。循环将数组中每个元素的值加到累加器。例如，假设程序中存在以下语句且值已存储在\
  \ `units` 数组中：\n\n```java\nint[] units = new int[25];\n```\n\n以下循环将 `units` 数组中每个元素的值加到\
  \ `total` 变量。当代码完成后，`total` 将包含 `units` 数组所有元素的总和。\n\n```java\nint total = 0;  \
  \  // 初始化累加器\nfor (int index = 0; index < units.length; index++)\n    total += units[index];\n\
  ```\n\n### 获取数值数组的平均值\n\n计算数组中所有值平均值的第一步是求加这些值。第二步是将总和除以数组中的元素个数。假设程序中存在以下语句且值已存储在\
  \ `scores` 数组中：\n\n```java\ndouble[] scores = new double[10];\n```\n\n以下代码计算 `scores`\
  \ 数组中值的平均值。当代码完成后，平均值将存储在 `average` 变量中。\n\n```java\ndouble total = 0;      // 初始化累加器\n\
  double average;        // 将存储平均值\nfor (int index = 0; index < scores.length; index++)\n\
  \    total += scores[index];\naverage = total / scores.length;\n```\n\n注意，最后一条将\
  \ `total` 除以 `scores.length` 的语句不在循环内部。这条语句应该只执行一次，即在循环完成迭代之后。\n\n### 寻找数值数组中的最大值和最小值\n\
  \n寻找数组中最大和最小值的算法非常相似。首先，让我们来看查找数组中最大值的代码。假设程序中存在以下语句且值已存储在 `numbers` 数组中：\n\n```java\n\
  int[] numbers = new int[50];\n```\n\n查找数组中最大值的代码如下：\n\n![Image](img/00544.jpg)\n\
  \n首先，我们将数组第一个元素的值赋给变量 `highest`。然后，循环从下标 1 开始，将所有剩余数组元素与 `highest` 中的值进行比较。每当它在数组中发现一个大于\
  \ `highest` 的值时，它就会将该值复制给 `highest`。当循环结束后，`highest` 将包含数组中的最大值。\n\n以下代码查找数组中的最小值。如你所见，它与查找最大值的代码几乎相同。\n\
  \n![Image](img/00545.jpg)\n\n循环结束后，`lowest` 将包含数组中的最小值。\n\n### SalesData 类\n\n为了演示这些算法，请查看[代码列表\
