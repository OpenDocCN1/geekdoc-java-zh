  \n# 第 6 章：类的初探\n\n## 课题介绍\n\n* 6.1 类与对象\n* 6.2 实例字段与方法\n* 6.3 构造方法\n* 6.4 方法与构造方法的重载\n\
  * 6.5 实例字段的作用域\n* 6.6 包与 `import` 语句\n* 6.7 关注面向对象的设计：在 Web 上寻找类及其职责：案例研究——`Amortization`\
  \ 类\n* 6.8 需要避免的常见错误\n\n## 6.1 类与对象\n\n**概念：类是对象的蓝图。它规定了特定类型对象所拥拥的字段和方法。从类可以创建一个或多个对象。**\n\
  \n目前主要使用的编程方法有两种：过程化编程和面向对象编程。最早的编程语言是过程化的，这意味着程序是由一个或多个过程组成的。*过程*是一组编程语言语句，它们共同完成一个特定的任务。这些语句可能会从用户处收集输入，处理存储在计算机内存中的数据，并执行计算或完成任务所需的任何其他操作。你目前为止所编写的程序在本质上都是过程化的。\n\
  \n过程通常对与过程分离的数据项进行操作。在过程化程序中，数据项通常从一个过程传递到另一个过程。正如你想象的，过程化编程的重点在于创建操作程序数据的过程。然而，随着程序变得越来越大越来越复杂，数据与操作数据的代码分离可能会导致问题。例如，数据存储在特定的格式中，该格式由变量以及由变量创建的更复杂的结构组成。操作数据的过程设计必须考虑这种格式。但是，如果数据格式发生了变化怎么办？通常情况下，程序的规范会发生变化，导致数据格式的重新设计。当数据结构发生变化时，操作数据的代码也必须随之以接受新格式。这增加了程序员的工作量，并增加了代码中出现漏洞的机会。\n\
  \n这种现象促使了从过程化编程向面向对象编程（OOP）的转变。过程化编程以创建过程为中心，而面向对象编程以创建对象为中心。*对象*是一个包含数据和过程的软件实体。对象中包含的数据被称为对象的*字段*（fields）。对象执行的过程无非就是方法（methods）。在概念上，对象是一个由数据（字段）和过程（方法）组成的自包含单元。这在[图\
  \ 6-1]中。\n\n**图 6-1** 对象包含数据和过程\n\n![Image](img/00320.jpg)\n![Image](img/00005.jpg)\n\
  \n**注意：**对象的字段有时被称为属性（attributes）。然而，Java 程序员更多地使用“字段”（field）一词。\n\nOOP 通过封装和数据隐藏解决了代码/数据分离的问题。*封装*指的是将数据和代码结合到单个对象中。*数据隐藏*是指对象对其外部代码隐藏其数据的能力。此时，只有对象的方法才能直接访问并修改对象的数据。对象通常会隐藏其数据，但允许外部代码访问其方法。如[图\
  \ 6-2]所示，对象的方法为对象外部的编程语句提供了间接访问对象数据的途径。\n\n当一个对象的内部数据对外部代码隐藏，且对该数据的访问限制在对象的方法内部时，数据就免受意外损坏的风险。此外，对象外部的程序代码不需要了解对象数据的格式或内部结构。代码只需要与对象的方法交互。\n\
  \n**图 6-2** 对象外部的代码与方法交互\n\n![Image](img/0321.jpg)\n\n### 对象重用性\n\n除了解决代码/数据分离的问题外，OOP\
  \ 的使用还受到*对象重用性*趋势的推动。对象不是一个独立的程序，而是被需要它的程序使用。例如，Sharon 开发了一个用于渲染 3D 图像的对象。她是一个数学天才，精通计算机图形，因此她的对象被设计为执行所有的三维数学运算并处理计算机硬件。Tom\
  \ 正在为建筑公司编写程序，他的应用程序需要显示 3D 图像。由于他面临紧迫的期限且对计算机图形并不了解，他可以使用 Sharon 的对象。\n\n### 对象的日常实例\n\
  \n将闹钟想象成一个对象。它具有以下字段：\n- 当前秒（0–59 之间）\n- 当前分（0–59 之间）\n- 当前小时（1–12 之间）\n- 闹钟设置的时间（有效的小时和分钟）\n\
  - 闹钟是否开启（“开启”或“关闭”）\n\n如你所见，字段仅仅是定义闹钟当前处于*状态*的数据值。你作为闹钟对象的用户，无法直接操作这些字段，因为它们是私有的（*private*）。要更改字段的值，必须使用对象的方法。以下是闹钟对象的一些方法：\n\
  - 设置时间\n- 设置闹钟时间\n- 开启闹钟\n- 关闭闹钟\n\n每个方法操作一个或多个字段。例如，`设置时间`方法允许你设置闹钟的时间。你通过按下顶部的按钮来激活该方法。通过另一个按钮，你可以激活`设置闹钟时间`方法。此外，另一个按钮允许你执行`开启闹钟`和`关闭闹钟`方法。注意，所有这些方法都可以由位于闹钟外部的你激活。可以被对象外部访问的方法被称为*公共方法*（public\
  \ methods）。\n\n\n\n\n闹钟还拥有`private methods`，这些是对象私有内部工作的一部分。外部实体（例如你，即闹钟的用户）无法直接访问闹钟的私有方法。该对象的设计旨在自动执行这些方法，并向你隐藏这些细节。以下是闹钟对象的私有方法：\n\
  \n> • 增加当前秒\n> • 增加当前分钟\n> • 增加当前小时\n> • 发出闹铃\n\n每秒都会执行“增加当前秒”方法。这会改变当前秒字段的值。如果在该方法执行时当前秒字段被设置为\
  \ 59，则该方法程序设定将当前秒重置为 0，然后触发“增加当前分钟”方法。该方法会在当前分钟的基础上加 1，除非它被设置为 59。在这种情况下，它会将当前分钟重置为\
  \ 0，并触发“增加当前小时”方法。（值得注意的是，“增加当前分钟”方法会将新时间与闹钟时间进行比较。如果两个时间匹配且闹钟已开启，则会执行“发出闹铃”方法。）\n\
  \n### 类与对象\n\n现在让我们来讨论软件中是如何创建对象的。在创建对象之前，必须由程序员对其进行设计。程序员确定必要的字段和方法，然后创建一个类。你已经知道类可以被用作程序的容器。在\
  \ Java 中，类还有另一个用途：类可以指定特定类型对象可能拥有的字段和方法。将类想象成一个可以据此创建对象的“蓝图”。因此，类不是一个对象，但它可以是对象的描述。当程序运行时，它可以使用该类在内存中创建所需的任意数量的特定类型的对象。从类中创建的每个对象都称为该类的\
  \ `instance`（实例）。\n\n例如，杰西卡（Jessica）是一位昆虫学家（研究昆虫的人），她也喜欢编写计算机程序。她设计了一个程序来编目录不同类型的昆虫。作为程序的一部分，她创建了一个名为\
  \ `Insect` 的类，该类规定了存储和处理所有类型昆虫通用数据的字段和方法。`Insect` 类不是一个对象，而是可以据此创建对象的规范。接下来，她编写了编程语句来创建一个\
  \ `housefly`（家蝇）对象，它是 `Insect` 类的的一个实例。`housefly` 对象是一个占据计算机内存并存储关于家蝇数据的实体。它拥有 `Insect`\
  \ 类指定的字段和方法。然后，她编写了编程语句来创建一个 `mosquito`（蚊子）对象。`mosquito` 对象也是 `Insect` 类的一个实例。它在内存中有有自己的区域，并存储了关于蚊子的数据。尽管\
  \ `housefly` 和 `mosquito` 对象是计算机内存中的两个独立实体，但它们都是从 `Insect` 类创建的。这意味着每个对象都拥有 `Insect`\
  \ 类描述的字段和方法。这在图 6-3 中所示。\n\n**图 6-3** `housefly` 和 `mosquito` 对象是 `Insect` 类的实例\n\
  \n![Image](img/00322.jpg)\n\n饼干模具的比喻经常被用来描述类和对象之间的区别。虽然饼干模具本身不是饼干，但它描述饼干。饼干模具可以用来制作多个饼干，如图\
  \ 6-4 所示。将类比作饼干模具，将从类中创建的对象比作饼干。\n\n**图 6-4** 饼干模具的比喻\n\n![Image](img/00323.jpg)\n\
  \n所以，类不是一个对象，而是对象的描述。一旦写好了类，你就可以使用该类创建任意数量的对象。每个对象都被视为该类的实例。从同一个类创建的所有对象都具有该类所描述的字段和方法。\n\
  \n### 对象与原始变量\n\n第 2 章向你引入了 Java 原始数据类型：`byte, short, int, long, char, float, double`\
  \ 和 `boolean`。你使用这些数据类型来创建变量，变量是计算机内存中的存储位置。原始数据类型被称为“原始”，是因为使用原始数据类型创建的变量除了存储值之外，没有内置功能。\n\
  \n第 2 章还向你引入了 `String` 类，它允许你创建 `String` 对象。除了存储字符串外，`String` 对象还有许多方法，可以对它们所持有的字符串执行操作。作为回顾，让我们来看一个例子。考虑以下语句：\n\
  \n```java\nString cityName = “Charleston\";\n```\n\n对于 Java 程序中出现的每个字符串字面量，内存中都会创建一个\
  \ `String` 对象来持有它。此语句中出现的字符串字面量“Charleston”会导致创建一个 `String` 对象并将其初始化为字符串“Charleston”。该语句还声明了一个名为\
  \ `cityName` 的变量，它引用该 `String` 对象。这意味着 `cityName` 变量持有 `String` 对象的内存地址。这在图 6-5\
  \ 中所示。\n\n**图 6-5** `cityName` 变量引用一个 `String` 对象\n\n![Image](img/00324.jpg)\n\n\
  假设同一个程序有一个名为 `stringSize` 的 `int` 变量。看以下语句：\n\n```java\nstringSize = cityName.length();\n\
  ```\n\n该语句调用了 `String` 类的 `length` 方法，该方法返回字符串的长度。表达式 `cityName.length()` 返回 `cityName`\
  \ 引用的字符串的长度。在该语句执行后，`stringSize` 变量将包含值 10，即字符串“Charleston”的长度。\n\n假设我们从 `String`\
  \ 类创建了几个对象，如下代码所示：\n\n```java\nString person = “Jenny”;\nString pet = “Fido”;\n\
  String favoriteColor = “Blue”;\n```\n\n如图 6-6 所示，这段代码在内存中创建了三个 `String` 对象，它们被 `person`、`pet`\
  \ 和 `favoriteColor` 变量引用。\n\n**图 6-6** 三个引用 `String` 对象的变量\n\n![Image](img/00325.jpg)\n\
  \n尽管三个 `String` 对象中的每一个持有不同的数据，但它们的设计完全相同。例如，我们可以这样调用每个对象的 `length` 方法：\n\n```java\n\
  personSize = person.length();\npetSize = pet.length();\ncolorSize = favoriteColor.length();\n\
  ```\n\n在这些语句执行后，`personSize` 将持有 `person` 引用的字符串的长度，`petSize` 将持有 `pet` 引用的字符串的长度，而\
  \ `colorSize` 将持有 `favoriteColor` 引用的字符串的长度。\n\n正如你在第 2 章中所看到的，`String` 类除了 `length`\
  \ 之外还有其他方法。这些示例说明了从类创建的对象与从原始数据类型创建的变量之间的区别。类对象通常对其数据执行有用操作的方法。然而，原始变量只存储数据而没有方法。对原始变量进行的任何操作必须写在变量外部的代码中。\n\
  \n### 逐步构建一个简单的类\n\n在本节中，我们将编写名为 `Rectangle` 的类。从 `Rectangle` 类创建的每个对象都能持有关于矩形的数据。具体来说，`Rectangle`\
  \ 对象将具有以下字段：\n\n> • `length.` `length` 字段将持有矩形的长度。\n> • `width.` `width` 字段将持有矩形的宽度。\n\
  \n\n\n\n`Rectangle` 类还将具有以下方法：\n\n* `setLength()` `setLength` 方法将在对象的 `length` 字段中存储一个值。\n\
  * `setWidth()` `setWidth` 方法将在对象的 `width` 字段中存储一个值。\n* `getLength()` `getLength`\
  \ 方法将返回对象的 `length` 字段中的值。\n* `getWidth()` `getWidth` 方法将返回对象的 `width` 字段中的值。\n\
  * `getArea()` `getArea` 方法将返回矩形的面积，该面积是对象的长度乘以其宽度的结果。\n\n在设计类时，绘制 UML 图通常非常有帮助。UML\
  \ 代表统一建模语言（Unified Modeling Language）。它提供了一系列标准图，用于图形化地描述面向对象的系统。图 6-7 显示了类 UML\
  \ 图的般布局。注意，该图是一个分为三个部分的框。顶部部分是书写类名的地方。中间部分包含类的字段列表。底部部分包含类的方法列表。\n\n**图 6-7** 类\
  \ UML 图的般布局\n\n![Image](img/00326.jpg)\n\n遵循此布局，图 6-8 显示了我们 `Rectangle` 类的 UML 图。在整本书中，我们经常使用\
  \ UML 图来说明类。\n\n**图 6-8** Rectangle 类的 UML 图\n\n![Image](img/00327.jpg)\n\n### 编写类代码\n\
  \n现在我们已经确定了想要 `Rectangle` 类拥字段和方法，让我们来编写 Java 代码。首先，我们使用编辑器创建一个名为 `Rectangle.java`\
  \ 的新文件。在 `Rectangle.java` 文件中，我们将按照如下 own 编写一个通用类“骨架”：\n\n```java\npublic class\
  \ Rectangle\n{\n}\n```\n\n出现在第一行的关键字 `public` 是访问修饰符。访问修饰符指示类如何可以被访问。`public` 访问修饰符表示该类对编写在\
  \ `Rectangle.java` 文件之外的代码可见。我们在书中编写的几乎所有的类都是 `public` 的。\n\n![Image](img/00009.jpg)\n\
  \n### 编写类和创建对象\n\n紧随访问饰饰符的是关键字 `class`，然后是 `Rectangle`，它是类名。在下一行出现一个左大括号，随后是一个右大括号。类的内容（即字段和方法）将写在这些大括号内部。类定义的般用格式如下：\n\
  \n```\nAccessSpecifier class Name\n{\n    Members\n}\n```\n\n从通俗来说，属于类的字段和方法被称为类的\
  \ `members`（成员）。\n\n### 编写类字段代码\n\n让我们继续编写 `Rectangle` 类，为其中一些成员填充代码。首先，我们将为类的两个字段\
  \ `length` 和 `width` 编写代码。我们将使用 `double` 数据类型的变量作为字段。新行代码将以加粗形式显示，如下：\n\n```java\n\
  public class Rectangle\n{\n    private double length;\n    private double width;\n\
  }\n```\n\n我们添加的这两行代码声明了变量 `length` 和 `width`。注意，两个声明都以关键字 `private` 开头，位于数据类型之前。`private`\
  \ 关键字是一个访问修饰符。它表示这些变量可能被类之外的语句访问。\n\n回想我们之前的讨论，对象可以执行数据隐藏，这意味着存储在对象内部的关键数据受到对象外部代码的保护。从通俗来说，属于类的字段和方法被称为类的\
  \ `members`（成员）。`private` 访问修饰符是一个访问修饰符。它表示这些变量可能被类之外的语句访问。\n\n### 编写 `setLength`\
  \ 方法\n\n`setLength` 方法将在对象的 `length` 字段中存储一个值。`setLength` 方法将在对象的 `width` 字段中存储一个值。`getLength`\
  \ 方法将返回对象的 `length` 字段中的值。`getWidth` 方法将返回对象的 `width` 字段中的值。`getArea` 方法将返回矩形的面积，该面积是对象的长度乘以其宽度的结果。\n\
  \n`Rectangle` 类还将具有以下方法：\n\n* `setLength()` `setLength` 方法将在对象的 `length` 字段中存储一个值。\n\
  * `setWidth()` `setWidth` 方法将在对象的 `width` 字段中存储一个值。\n* `getLength()` `getLength`\
  \ 方法将返回对象的 `length` 字段中的值。\n* `getWidth()` `getWidth` 方法将返回对象的 `width` 字段中的值。\n\
  * `getArea()` `getArea` 方法将返回矩形的面积，该面积是对象的长度乘以其宽度的结果。\n\n```java\npublic void setLength(double\
  \ len)\n{\n    length = len;\n}\n```\n\n\n\n\n代码 Listing 6-2 中的程序必须保存为 `LengthDemo.java`，并存放在与\
  \ `Rectangle.java` 文件相同的文件夹或目录下。随后，可以使用 Sun JDK 使用以下命令来编译该程序：\n\n```bash\njavac\
  \ LengthDemo.java\n```\n\n当编译器读取 `LengthDemo.java` 的源码并看到正在使用一个名为 `Rectangle` 的类时，它会在当前文件夹或目录中查找\
  \ `Rectangle.class` 文件。然而，该文件并不存在，因为我们还没有编译 `Rectangle.java`。所以，编译器会搜索 `Rectangle.java`\
  \ 文件并对其编译。这会创建 `Rectangle.class` 文件，使得 `Rectangle` 类变得可用。随后编译器完成 `LengthDemo.java`\
  \ 的编译。生成的 `LengthDemo.class` 文件可以使用以下命令执行：\n\n```bash\njava LengthDemo\n```\n\n\
  程序的输出显示在代码 Listing 6-2 的底部。\n\n让我们来看该程序 `main` 方法中的每个语句。首先，程序在第 12 行使用以下语句创建一个 `Rectangle`\
  \ 对象并将其与变量关联：\n\n```java\nRectangle box = new Rectangle();\n```\n\n让我们将该语句拆分为两个部分。语句的第一部分：\n\
  \n```java\nRectangle box\n```\n\n声明了一个名为 `box` 的变量。该变量的数据类型是 `Rectangle`。（由于 `Rectangle`\
  \ 单词不是基本原始数据类型的名称，Java 假设它是一个类的名称。）请记住，类类型的变量是一个引用变量，它持有对象的内存地址。当引用变量持有对象的内存地址时，就称该变量引用了该对象。因此，变量\
  \ `box` 将用于引用一个 `Rectangle` 对象。语句的第二部分如下：\n\n```java\n= new Rectangle();\n```\n\n\
  语句的这部分使用了关键字 `new`，它会在内存中创建一个对象。在单词 `new` 之后，会出现一个类名，后面跟着一组括号。这指定了应该从哪个类创建对象。在这种情况下，创建了一个\
  \ `Rectangle` 类的对象。随后，将该对象的内存地址（通过 `=` 运算符）赋值给变量 `box`。语句执行后，变量 `box` 将引用内存中创建的对象。这在\
  \ Figure 6-10 中有所体现。\n\n**图 6-10** `box` 变量引用一个 `Rectangle` 类对象\n\n![Image](img/00332.jpg)\n\
  \n注意，图 6-10 显示 `Rectangle` 对象的 `length` 和 `width` 字段被设置为 0。类所有的数值字段默认都被初始化为 0。\n\
  \n***\n\n![Image](img/00006.jpg)\n\n**提示：** 该语句中的括号是必须的。如果如下方式编写语句将报错：\n\n```java\n\
  Rectangle box = new Rectangle; // 错误！！\n```\n\n***\n\n第 15 行和第 16 行的语句使用 `System.out.println`\
  \ 方法在屏幕上显示消息。第 19 行的下一个语句如下调用了 `box` 对象的 `setLength` 方法：\n\n```java\nbox.setLength(10.0);\n\
  ```\n\n该语句将参数 10.0 传递给 `setLength` 方法。当方法执行时，值 10.0 被复制到 `len` 参数变量中。方法将 `len` 的值赋值给\
  \ `length` 字段，然后终止。Figure 6-11 显示了方法执行后 `box` 对象的状态。\n\n**图 6-11** `setLength` 方法执行后\
  \ `box` 对象的状态\n\n![Image](img/00333.jpg)\n\n### 编写 `setWidth` 方法\n\n现在我们已经知道了 `setLength`\
  \ 方法是如何工作的，让我们为 `Rectangle` 类添加 `setWidth` 方法。`setWidth` 方法与 `setLength` 类似。它接受一个参数，并将其赋值给\
  \ `width` 字段。代码 Listing 6-3 显示了更新后的 `Rectangle` 类。`setWidth` 方法位于 28 到 31 行。（该文件位于源码文件夹\
  \ `Chapter 06\\Rectangle Class Phase 2` 中，可在本书的在线资源页 [www.pearsonhighered.com/gaddis](http://www.pearsonhighered.com/gaddis)\
  \ 获取。）\n\n**代码列表 6-3 (`Rectangle.java`)**\n\n![Image](img/00334.jpg)\n\n`setWidth`\
  \ 方法有一个名为 `w` 的参数变量，它被赋值给 `width` 字段。例如，假设 `box` 引用一个 `Rectangle` 对象并执行了以下语句：\n\n\
  ```java\nbox.setWidth(20.0);\n```\n\n在该语句执行后，`box` 对象的 `width` 字段设置为 20.0。\n\n####\
  \ 编写 `getLength` 和 `getWidth` 方法\n\n由于 `length` 和 `width` 字段是私有的，我们编写 `setLength`\
  \ 和 `setWidth` 方法以允许类外部设置值。我们还必须编写允许类外部获取值的方法。\n\n`getLength` 方法如下：\n\n```java\n\
  public double getLength() {\n    return length;\n}\n```\n\n`getWidth` 方法如下：\n\n\
  ```java\npublic double getWidth() {\n    return width;\n}\n```\n\n代码 Listing 6-4\
