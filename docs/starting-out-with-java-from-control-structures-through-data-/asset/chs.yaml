  52 + 19 = ? 71 [Enter]\n\n正确！\n\n**带有示例输入的程序输出（部分加粗显示）**\n\n以下问题的答案是什么？\n\n27 +\
  \ 73 = ? 101 [Enter]\n\n抱歉，答案错误。正确答案是 100\n\n* * *\n\n## 4.12 需要避免的常见错误\n\n以下列表描述了学习本章主题时经常遇到的几种错误。\n\
  \n> • **在错误的模式下使用自增或自减运算符**。当自增或自减运算符放在其操作数之前（左侧）时，它以前置模式使用。当这些运算符中的任何一个放在操作数之后（右侧）时，它以后置模式使用。\n\
  \n> • **忘记将 `boolean` 表达式括起来**。当自增或自减运算符放在其操作数之前（左侧）时，它以前置模式使用。当这些运算符中的任何一个放在操作数之后（右侧）时，它以后置模式使用。\n\
  \n> • **在 `for` 循环头中错误放置分号**。当自增或自减运算符放在其操作数之前（左侧）时，它以前置模式使用。当这些运算符中的任何一个放在操作数之后（右侧）时，它以后置模式使用。\n\
  \n> • **在 `for` 循环头中使用逗号代替分号**。当自增或自减运算符放在其操作数之前（左侧）时，它以前置模式使用。当这些运算符中的任何一个放在操作数之后（右侧）时，它以后置模式使用。\n\
  \n> • **忘记将累加器初始化为 0**。为了让累加器正确保持总和，必须在添加任何值之前将其初始化为零。\n\n* *\n\n### 复习题\n\n**单选题和判断题**\n\
