  \n### 7.6 边框\n\n> **概念：组件周围可以显示几种不同风格的边框。`Border` 对象指定了边框的细节。你使用 `BorderFactory`\
  \ 类来创建 `Border` 对象。**\n\n有时，在面板上的组件或一组组件周围放置一个边框是有帮助的。通过将相关组件分组在边框内，你可以让窗口看起来更加整洁。例如，图\
  \ 7-29 显示了一组被包含在边框内的选框。此外，注意该边框有一个标题。\n\n**图 7-29** 带有标题边框的选框组\n\n![Image](img/00476.jpg)\n\
  \n`JPanel` 组件有一个名为 `setBorder` 的方法，用于为面板添加边框。`setBorder` 方法接受一个 `Border` 对象作为参数。`Border`\
  \ 对象包含了描述边框外观的详细信息。\n\n与其自己创建 `Border` 对象，你应该使用 `BorderFactory` 类来为你创建它们。`BorderFactory`\
  \ 类拥有返回各种类型边框的方法。表 7-6 描述了可以使用 `BorderFactory` 类创建的边框。该表还列出了可以调用以创建边框的 `BorderFactory`\
  \ 方法。请注意，每个方法都有多个重载版本。\n\n![Image](img/00005.jpg)\n\n***\n\n**注意：** 如果你在代码中使用了 `BorderFactory`\
  \ 类，则应包含以下 `import` 语句：`import javax.swing.*;`\n\n***\n\n**表 7-6** 由 `BorderFactory`\
  \ 类产生的边框\n\n![Image](img/00477.jpg)\n\n在本章中，我们将重点介绍空边框、线条边框和带标题的边框。\n\n#### 空边框\n\
  \n空边框仅仅是组件边缘周围的空白区域。要创建一个空边框，请调用 `BorderFactory` 类的 `createEmptyBorder` 方法。该方法的通用格式如下：\n\
  \n```\nBorderFactory.createEmptyBorder(int top, int left, int bottom, int right);\n\
  ```\n\n传递给 `top`、`left`、`bottom` 和 `right` 的参数以像素为单位指定边框上、左、下、右边缘的大小。该方法返回 `Border`\
  \ 对象的引用。以下是一个使用该方法的语句示例。假设 `panel` 变量引用一个 `JPanel` 对象。\n\n```\npanel.setBorder(BorderFactory.createEmptyBorder(5,\
  \ 5, 5, 5));\n```\n\n执行此语句后，由 `panel` 引用的 JPanel 在每个边缘周围都将有一个五像素宽的空边框。\n\n![Image](img/00005.jpg)\n\
  \n***\n\n**注意：** 你不需要创建 `BorderFactory` 类的实例。相反，你只需要在方法名前加上 `BorderFactory.` 来调用它的方法。你不是从对象调用方法，而是直接从类调用它们。这与我们讨论过的\
  \ `Math` 类和包装类方法的调用方式相似。从类而不是对象调用的方法称为静态方法。你将在第 9 章中学习更多关于静态方法的知识。\n\n***\n\n####\
  \ 线条边框\n\n线条边框是组件周围的指定颜色和厚度的线条。要创建一个线条边框，请调用 `BorderFactory` 类的 `createLineBorder`\
  \ 方法。该方法的通用格式如下：\n\n```\nBorderFactory.createLineBorder(Color color, int thickness);\n\
  ```\n\n传递给 `color` 和 `thickness` 的参数指定线条的颜色和线条的像素大小。该方法返回 `Border` 对象的引用。以下是一个使用该方法的语句示例。假设\
  \ `panel` 变量引用一个 `JPanel` 对象。\n\n```\npanel.setBorder(BorderFactory.createLineBorder(Color.RED,\
  \ 1));\n```\n\n执行此语句后，由 `panel` 引用的 JPanel 在边缘周围将有一个像素宽的红色线条边框。\n\n#### 带标题的边框\n\
  \n带标题的边框是带有标题的刻蚀边框。要创建一个带标题的边框，请调用 `BorderFactory` 类的 `createTitledBorder` 方法。该方法的通用格式如下：\n\
  \n```\nBorderFactory.createTitledBorder(String title);\n```\n\n传递给 `title` 的参数是要作为边框标题的的文本。该方法返回\
  \ `Border` 对象的引用。以下是一个使用该方法的语句示例。假设 `panel` 变量引用一个 `JPanel` 对象。\n\n```\npanel.setBorder(BorderFactory.createTitledBorder(\"\
  Choices\"));\n```\n\n##### ![Image](img/00004.jpg) **检查点**\n\n> 7.26 你使用什么方法在组件周围设置边框？\n\
  \n> 7.27 创建 Border 对象的首选方法是什么？\n\n### 7.7 关注解决问题：扩展 `JPanel` 类\n\n> **概念：通过编写一个继承自\
  \ `JPanel` 的类，你可以创建一个包含其他组件和相关代码的自定义面板组件。**\n\n在这一章目前为止所学习的应用中，我们在类头中使用了 `extends\
  \ JFrame` 子句来使类继承自 `JFrame` 类。记住，扩展后的类即是 `JFrame` 类的特殊版本，我们使用它的构造函数来创建面板、按钮以及所有需要的组件。这种方法对于简单的应用程序非常有效。但对于使用许多组件的应用程序，这种方法可能会变得繁琐。将大量组件的所有代码和事件监听器打包到一个类中会导致类变得庞大且复杂。更好的方法是将相关的组件小组及其事件监听器封装到它们自己的类中。\n\
  \n#### Brandi’s Bagel House \n\nBrandi’s Bagel House 为她社区的企业提供贝果和咖啡外送服务。客户可以电话订购白贝果、全麦贝果以及各种配料。此外，还可以点三种咖啡。（然而，不单独配送咖啡。）以下是完整的价格表：\n\
  \n> *贝果：白贝果 $1.25，全麦贝果 $1.50*\n\n> *配料：奶油奶士 $0.50，黄油 $0.25，桃子酱 $0.75，蓝莓酱 $0.75*\n\
  \n\n\n\n\n> *咖啡：普通咖啡 $1.25，脱因咖啡 $1.25，卡布奇 $2.00*\n\n所有主 Brandi 需要一个“订单计算器”应用程序，以便她的员工在接到订单时用它计算价格。该应用程序应该显示小计、6%\
  \ 的销售税金额以及订单总额。图 7-30 显示了该应用程序窗口的草图。用户选择贝果的类型、配料和咖啡，然后点击“Calculate”（计算）按钮。程序会弹出一个对话框，显示小计、销售税金额和总额。用户可以通过点击“Exit”（退出）按钮或窗口右上角的标准关闭按钮来退出应用程序。\n\
  \n草图所示的布局可以通过在窗口的内容面板中使用 `BorderLayout` 布局管理器来实现。显示“Welcome to Brandi’s Bagel House”的标签位于北部（north）区域，贝果种类的单选按钮位于西部（west）区域，配料种的复选框位于中心（center）区域，咖啡选择的单选按钮位于东部（east）区域，而\
  \ Calculate 和 Exit 按钮位于南部（south）区域。为了构建此窗口，我们创建了以下继承自 `JPanel` 的特殊面板类：\n\n**图 7-30**\
  \ 订单计算器窗口草图\n\n![Image](img/00478.jpg)\n\n- • `GreetingsPanel`。该面板包含窗口北部区域显示的标签。\n\
  - • `BagelPanel`。该面板包含贝果种类的单选按钮。\n- • `ToppingsPanel`。该面板包含配料种类的复选框。\n- • `CoffeePanel`。该面板包含咖啡选择的单选按钮。\n\
  \n（我们没有为 Calculate 和 Exit 按钮创建特殊面板。原因稍后解释。）在创建这些类之后，我们可以从它们创建对象，并将这些对象添加到窗口内容面板的相应区域。让我们仔细查看其中的每一个类。\n\
