  * [4.11 `Random` 类]\n* [4.12 需要避免的常见错误]\n\n## 4.1 递增和递减运算符\n\n> **概念：`++` 和 `--`\
  \ 是对其操作数加 1 或减 1 的运算符**。递增一个值意味着将其增加 1，递减一个值意味着将其减少 1。以下两个语句都会递增变量 `number`：\n\n\
  ```java\nnumber = number + 1;\nnumber += 1;\n```\n\n以下两个语句都会对 `number` 进行递减：\n\n\
  ```java\nnumber = number - 1;\nnumber -= 1;\n```\n\nJava 提供了一组简单的单元运算符，用于递增和递减变量。递增运算符是\
  \ `++`，递减运算符是 `--`。以下语句使用 `++` 运算符递增 `number`：\n\n```java\nnumber++;\n```\n\n以下语句递减\
  \ `number`：\n\n```java\nnumber--;\n```\n\n**注意**：表达式 `number++` 的读作是“number plus”，`number--`\
  \ 的读作是“number minus”。\n\n`IncrementDecrement.java` 中的程序演示了 `++` 和 `--` 运算符。\n\n\
  ```java\nIncrementDecrement.java\n```\n\n**程序输出**\n```\nnumber is 4\nnumber is 5\n\
  number is 4\n```\n\n代码中的语句显示了在`后置模式`中使用的递增和递减运算符，这意味着运算符放在变量之后。运算符在`前置模式`中同样有效，此时运算符放在变量之前，如下：\n\
  \n```java\n++number;\n--number;\n```\n\n在后置和前置模式下，这些运算符都会对其操作数加 1 或减 1。`Prefix.java`\
  \ 展示了这一点。\n\n```java\nPrefix.java\n```\n\n**程序输出**\n```\nnumber is 4\nnumber is\
  \ 5\nnumber is 4\n```\n\n### 后置模式与前置模式的区别\n\n在代码列表 4-1 和 4-2 中，语句 `number++` 和 `++number`\
  \ 递增变量 `number`，而语句 `number--` 和 `--number` 递减变量 `number`。在这些简单的语句中，使用后置模式还是前置模式并不重要。然而，当这些运算符被用于不仅仅是递增或递减的语句时，区别就产生了。例如，看以下代码：\n\
  \n```java\nnumber = 4;\nSystem.out.println(number++);\n```\n\n调用 `println` 方法的语句执行了两件事：(1)\
  \ 调用 `println` 显示 `number` 的值(2) 递增 `number`。但哪个先发生？如果 `number` 先递增和最后才递增，`println`\
  \ 方法显示的值将是不同的。答案取决于递增运算符的模式。\n\n后置模式导致递增发生在变量值在表达式中使用之后。在之前所示的语句中，`println` 方法将显示\
  \ 4，然后 `number` 将递增到 5。然而，前置模式导致递增先发生。这是一个示例：\n\n```java\nnumber = 4;\nSystem.out.println(++number);\n\
  ```\n\n在这些语句中，`number` 先递增到 5，然后 `println` 将显示 `number` 中的值（即 5）。另一个例子，看以下代码：\n\n\
  ```java\nint x = 1, y;\ny = x++; // 后置递增\n```\n\n第一条语句声明了变量 `x`（初始化为 1）和变量 `y`。第二条语句执行以下操作：\n\
  * 将 `x` 的值赋值给变量 `y`。\n* 变量 `x` 递增。\n\n存储在 `y` 中的值取决于递增发生的时间。由于 `++` 运算符是以后置模式使用的，它在赋值之后执行。因此，这段代码会将\
  \ 1 存储在 `y` 中。代码执行后，`x` 将包含 2。让我们相同的代码，但在前置模式使用 `++` 运算符：\n\n```java\nint x = 1,\
  \ y;\ny = ++x; // 前置递增\n```\n\n第一条语句声明了变量 `x`（初始化为 1）和变量 `y`。在第二条语句中，`++` 运算符是以前置模式使用的，因此它在赋值之前作用于变量。因此，这段代码会将\
  \ 2 存储在 `y` 中。代码执行后，`x` 也包含 2。\n\n**自测点**\n\n4.1 以下程序段落将显示什么？\na) `x = 2; y = x++;\
  \ System.out.println(y);`\nb) `x = 2; System.out.println(x++);`\nc) `x = 2; System.out.println(--x);`\n\
  d) `x = 8; y--; System.out.println(y);`\n\n## 4.2 `while` 循环\n\n> **概念：循环是程序中重复的部分**。\n\
  \n在第 3 章中，你学习了控制结构的概念，它们引导程序的流程。*循环*是一种导致语句或一组语句重复的控制结构。Java 有三种循环控制结构：`while` 循环、`do`-`while`\
  \ 循环和 `for` 循环。这些结构之间的区别在于它们如何控制重复。在本节中，我们将关注 `while` 循环。\n\n`while` 循环有两个重要部分：(1)\
  \ 一个用于测试 `true` 或 `false` 值的布尔表达式，(2) 一个只要表达式为 `true` 就会重复的语句或语句块。图 4-1 显示了 `while`\
  \ 循环的逻辑。\n\n以下是 `while` 循环的通用格式：\n\n```java\nwhile (BooleanExpression)\n    Statement;\n\
  ```\n\n\n\n循环的工作原理如下：测试 `BooleanExpression`，如果结果为 `true`，则执行 `Statement`。然后，再次测试\
  \ `BooleanExpression`。如果为 `true`，则执行 `Statement`。这个循环不断重复，直到 `BooleanExpression`\
  \ 为 `false`。\n\n被重复执行的语句被称为循环的 `body`（体）。它也被视为一种条件执行语句，因为只有在 `BooleanExpression`\
  \ 为 `true` 的情况下它才会执行。\n\n注意，循环头部结尾没有分号。与 `if` 语句一样，如果 `while` 循环没有跟随其后的条件执行语句，它将是不完整的。\n\
  \n如果你希望 `while` 循环重复一个语句块，格式如下：\n\n![Image](img/00204.jpg)\n\n`while` 循环的工作方式就像一个不断执行的\
  \ `if` 语句。只要括号内的表达式为 `true`，条件执行语句或语句块就会重复执行。代码列表 4-3 中的程序使用 `while` 循环打印五次“Hello”。\n\
  \n**代码列表 4-3 (`WhileLoop.java`)**\n\n![Image](img/00205.jpg)\n\n**程序输出**\n\n`Hello`\n\
  \n`Hello`\n\n`Hello`\n\n`Hello`\n\n`Hello`\n\n`That's all!`\n\n让我们仔细观察这个程序。声明了一个整数变量\
  \ `number` 并将其初始化为 1。`while` 循环从以下语句开始：\n\n```\n  while (number <= 5)\n```\n\n该语句测试变量\
  \ `number` 以判断它是否小于或等于 5。如果是，则按如下执行循环体中的语句：\n\n```\n  System.out.println(\"Hello\"\
  );\n  number++;\n```\n\n循环体中的第一个语句打印单词“Hello”。第二条语句使用递增运算符给 `number` 加 1。这是循环体中的最后一个语句，因此在执行之后，循环将重新开始。它再次测试\
  \ `boolean` 表达式，如果为 `true`，则执行循环体中的语句。这个循环不断重复，直到 `boolean` 表达式 `number <= 5` 为\
  \ `false`，如图 4-2 所示。\n\n**图 4-2** `while` 循环\n\n![Image](img/00206.jpg)\n\n循环的每次重复被称为一次\
  \ `iteration`（迭代）。此循环将执行五次迭代，因为变量 `number` 初始化为值 1，并且每次执行循环体时它都会递增。当测试表达式 `number\
  \ <= 5` 并发现为 `false` 时，循环将终止，程序将从紧随循环后的语句继续执行。图 4-3\n\n### `while` 循环是预测试循环\n\n\
  `while` 循环被称为 `pretest`（预测试）循环，这意味着它在每次迭代之前都会测试其表达式。注意代码列表 4-3 中 `number` 的变量声明：\n\
  \n```\n  int number = 1;\n```\n\n`number` 变量被初始化为 1。如果 `number` 初始化为大于 5 的值（如下代码段所示），循环将永远不会执行：\n\
  \n![Image](img/00208.jpg)\n\n`while` 循环的一个重要特性是，如果 `boolean` 表达式初始为 `false`，则循环永远不会迭代。如果你想确保\
  \ `while` 循环在第一次执行，必须以这种方式初始化相关数据，使 `boolean` 表达式初始为 `true`。\n\n### 无限循环\n\n在极少数情况下外，循环内部必须包含一种能够自终止的方法。这意味着循环内部的某些内容最终必须使\
  \ `boolean` 表达式变为 `false`。代码列表 4-3 中的循环在表达式 `number <= 5` 为 `false` 时停止。\n\n如果一个循环没有停止的方法，它被称为无限循环（`infinite\
  \ loop`）。`infinite loop` 会持续重复，直到程序被中断。这里有一个无限循环的示例：\n\n![Image](img/00209.jpg)\n\
  \n这是一个无限循环，因为它没有包含改变 `number` 变量值的语句。每次测试 `boolean` 表达式时，`number` 都将包含值 1。\n\n通过在\
  \ `while` 循环的第一行后不小心放置分号，也可以创建一个无限循环。这里有一个示例：\n\n![Image](img/00210.jpg)\n\n第一行尾的分号将\
  \ `while` 语句与其随后的语句块隔离开。对于编译器来说，这个循环看起来像：\n\n```\n  while (number <= 5);\n```\n\n\
  这个 `while` 循环将永远执行 `null` 语句。程序看起来似乎“进入了太空”，因为没有任何可显示的内容。\n\n### 语句块不要忘记大括号\n\n\
  如果你在使用语句块，请不要忘记将所有语句封装在一组大括号中。如果不小心漏了大括号，`while` 语句将只执行下一条语句。例如，查看以下代码：\n\n```\n\
  int number = 1; // 这个循环缺少大括号！\nwhile (number <= 5)\n  System.out.println(\"Hello\"\
  );\nnumber++;\n```\n\n在这段代码中，`number++` 语句不在循环体内。由于缺少了大括号，循环将无限执行。\n\n### 编程风格与\
  \ `while` 循环\n\n可以创建如下所示的循环：\n\n```\nwhile (number <= 5) { System.out.println(\"\
  Hello\"); number++; }\n```\n\n避免使用这种编程风格。在使用 `while` 循环时应该使用的编程风格与 `if` 语句相似：\n\n\
  - 如果循环只重复一条语句，它应该出现在 `while` 语句的下一行，并额外缩进一层。该语句可以可选地出现在大括号内。\n- 如果循环重复一个块，大括号内的每一行都应该缩进。\n\
  \n这种编程风格应该在视觉上将循环体与周围的代码隔离开。通常情况下，你会发现本章介绍的其他类型循环也使用了类似的风格。\n\n\n\n\n\n在审查此算法后，你会发现如果测试条件（温度大于\
  \ 102.5）起初为假，则不应执行步骤 2(a) 和 2(b)。`while` 循环在这种情况下会运行良好，因为如果它的条件为假，它甚至一次都不会执行。代码列表\
