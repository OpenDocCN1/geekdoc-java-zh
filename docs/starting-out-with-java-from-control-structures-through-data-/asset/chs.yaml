  \ valid\"。\n\n## 3.6 比较 `String` 对象\n\n> **概念：你不能使用关系运算符来比较 `String` 对象。相反，你必须使用\
  \ `String` 方法**。\n\n在前面的节中，你已经看到如何使用关系运算符比较数值。然而，你不应该使用关系运算符来比较 `String` 对象。\n\n\
  记住 `String` 对象是通过内存地址引用的。当你对 `String` 对象使用关系运算符时，它比较的是内存地址，而不是实际内容。例如，假设程序有：\n\n\
  ```java\nString name1 = \"Mark\";\nString name2 = \"Mary\";\n```\n\n表达式 `name1 ==\
  \ name2` 将为 `false`，因为 `name1` 和 `name2` 引用不同的对象。要比较 `String` 对象的实际内容，你应该使用 `equals()`\
  \ 方法。通用形式如下：\n\n```java\nif (name1.equals(name2)) {\n    // ...\n}\n```\n\n如果字符串相等，`equals()`\
  \ 方法返回 `true`；如果不相等则返回 `false`。这是 Java 中比较 `String` 对象的标准方法。\n\n\n\n\n如果比较的字符串一个比另一个短，Java\
  \ 只能比较对应的字符。如果对应的字符完全相同，则较短的字符串被认为小于较长的字符串。例如，假设正在比较字符串“High”和“Hi”。字符串“Hi”会被认为小于“High”，因为它的长度更短。\n\
  \n## 在字符串比较中忽略大小写\n\n`equals` 方法和 `compareTo` 方法执行的是区分大小写的比较，这意味着大写字母不被认为与其小写字母形式对等。换句话说，“A”不等于“a”。当你想要执行不区分大小写的比较时，这显然会产生问题。\n\
  \n`String` 类提供了 `equalsIgnoreCase` 和 `compareToIgnoreCase` 方法。这些方法的工作方式与 `equals`\
  \ 和 `compareTo` 方法类似，不同之处它们会忽略字符串中字符的大小写。例如，代码列表 3-11 中的程序要求用户输入“秘密单词”，这类似于密码。秘密单词是“PROSPERO”，程序执行不区分大小写的字符串比较，以确定用户是否输入了它。\n\
  \n**代码列表 3-11 (`SecretWord.java`)**\n\n![Image](img/00175.jpg)\n\n***\n\n**加粗显示示例输入的程序输出**\n\
  \nEnter the secret word: Ferdinand [Enter]\n\nSorry, that is NOT the secret word!\n\
  \n**加粗显示示例输入的程序输出**\n\nEnter the secret word: Prospero [Enter]\n\nCongratulations!\
  \ You know the secret word!\n\n***\n\n`compareToIgnoreCase` 方法的工作方式与 `compareTo`\
  \ 方法完全相同，不同之处在于忽略了所比较字符串中字符的大小写。\n\n### ![Image](img/00004.jpg) **Checkpoint**\n\
