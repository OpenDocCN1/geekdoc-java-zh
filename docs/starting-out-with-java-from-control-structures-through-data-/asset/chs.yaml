  \ 方法。为什么？\n\n## 11.7 多态\n\n> **概念：父类引用变量可以引用子类对象的引用**。\n\n查看下面的语句，该语句声明了一个名为 `exam`\
  \ 的引用变量：\n\n`GradedActivity exam;`\n\n![Image](img/00009.jpg)\n\n**多态**\n\n该语句告诉我们\
  \ `exam` 变量的数据类型是 `GradedActivity`。因此，我们可以使用 `exam` 变量来引用一个 `GradedActivity` 对象，如下句所示：\n\
  \n`exam = new GradedActivity();`\n\n`GradedActivity` 类也被用作 `FinalExam` 类的父类。由于父类和子类之间存在“是”（is-a）关系，`FinalExam`\
  \ 类的对象不仅仅是一个 `FinalExam` 对象。它还是一个 `GradedActivity` 对象。（期末考试是一种分级活动）。由于这种关系，我们可以使用\
  \ `GradedActivity` 变量来引用 `FinalExam` 对象。例如，查看下面的语句：\n\n`GradedActivity exam = new\
  \ FinalExam(50, 7);`\n\n该语句将 `exam` 声明为 `GradedActivity` 变量。它创建了一个 `FinalExam` 对象并将对象的地址存储在\
  \ `exam` 变量中。这条语句是完全合法的，不会导致错误信息，因为 `FinalExam` 对象也是一个 `GradedActivity` 对象。\n\n\
  这是多态的一个示例。多态一术意味着以多种形式采取的能力。在 Java 中，引用变量是多态的，因为它可以引用与自身类型不同的类型对象，只要这些类型是其类型的子类即可。以下所有声明都是合法的，因为\
  \ `FinalExam`、`PassFailActivity` 和 `PassFailExam` 类继承自 `GradedActivity`：\n\n`GradedActivity\
  \ exam1 = new FinalExam(50, 7);`\n\n`GradedActivity exam2 = new PassFailActivity(70);`\n\
  \n`GradedActivity exam3 = new PassFailExam(100, 10, 70);`\n\n虽然 `GradedActivity`\
  \ 变量可以引用任何扩展 `GradedActivity` 的类的对象，但该变量对这些对象的操作是有限制的。记得 `GradedActivity` 类有三个方法：`setScore`、`getScore`\
  \ 和 `getGrade`。因此，`GradedActivity` 变量只能用于调用这三个方法，无论该变量引用的对象类型是什么。例如，查看下面的代码：\n\n\
  ```\nGradedActivity exam = new PassFailExam(100, 10, 70);\nSystem.out.println(exam.getScore());\
  \        // 这有效。\nSystem.out.println(exam.getGrade());        // 这有效。\nSystem.out.println(exam.getPointsEach());\
  \   // 错误！无法工作。\n```\n\n在这段代码中，`exam` 被声明为 `GradedActivity` 变量，并赋值了 `PassFailExam`\
  \ 对象的地址。`GradedActivity` 类只有 `setScore`、`getScore` 和 `getGrade` 方法，所以这些是 `exam`\
  \ 变量知道如何执行的唯一方法。代码中的最后语句是对 `getPointsEach` 方法的调用，该方法定义在 `PassFailExam` 类中。因为 `exam`\
  \ 变量只认识 `GradedActivity` 类中的方法，它无法执行该方法。\n\n#### 多态与动态绑定\n\n多态和动态绑定：当父类变量引用子类时，Java\
  \ 虚拟机会在运行时决定调用哪个方法，这取决于对象类型，而不是变量类型。这被称为动态绑定。\n\n代码列表 11-25 中的程序演示了多态行为。它声明了一个 `GradedActivity`\
  \ 变量数组，然后将各种类型对象的地址赋值给数组。\n\n**代码列表 11-25 (`Polymorphic.java`)**\n\n![Image](img/00860.jpg)\n\
