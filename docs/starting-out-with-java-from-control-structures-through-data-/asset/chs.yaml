  \ `28 [回车]`\n`这两个数字的最大公约数是 7`\n\n## 15.4 汉诺塔\n\n> **概念：解决汉诺塔游戏涉及的重复步骤可以很容易地通过递归算法实现**。\n\
  \n汉诺塔是一种数学游戏，经常用于计算机科学教科书中以说明递归的力量。该游戏使用三个柱子和一组中心有孔的圆盘。圆盘堆放在其中一个柱子上，如图 15-7 所示。\n\
  \n**图 15-7** 汉诺塔游戏中的柱子和圆盘\n\n![Image](img/01191.jpg)\n\n注意圆盘按大小顺序堆放在最左侧的柱子上，最大的圆在底部。该游戏基于一个传说，河内一座寺庙的僧侣有一组类似的\
  \ 64 个圆盘的柱子。僧侣的任务是将圆盘从第一个柱子移动到第三个柱子。中间的柱子可以作为临时。此外，僧侣在移动圆盘时必须遵循以下规则：\n\n> • 每次只能移动一个圆。\n\
  > • 圆不能放在较小的圆之上。\n> • 除了移动时，所有圆盘都必须存储在柱子上。\n\n根据传说，当僧侣将所有圆盘从第一个柱子移动到最后一个柱子时，世界将会结束。\n\
  \n要玩这个游戏，你必须遵循与僧侣相同的规则，将所有圆盘从第一个柱子移动到第三个柱子。让我们看看这个游戏针对不同数量圆的一些示例解决方案。如果你只有一个圆，游戏的解决方案很简单：将圆从\
  \ 1 号柱子移动到 3 号柱子。如果你有两个圆，解决方案需要三次移动：\n\n> • 将圆盘 1 移动到 2 号柱子。\n> • 将圆盘 2 移动到 3 号柱子。\n\
  > • 将圆盘 1 移动到 3 号柱子。\n\n\n\n\n\n![Image](img/01197.jpg)\n\n### `Program Output`\n\
  \n![Image](img/01198.jpg)\n\n## 15.5 应该避免的常见错误\n\n> • **没有编写基准情况（base case）**。当到达基准情况时，递归方法停止调用自身。如果没有基准情况，方法将无限地调用自身。\n\
  \n> • **未在每次递归调用时没有缩小问题规模**。除非每次递归调用都能缩小问题规模（这通常意味着一个或多个关键参数的值减小），否则方法将无法到达基准情况。如果没有到达基准情况，方法将无限地调用自身。\n\
  \n> • **编写递归的方式导致永远无法到达基准情况**。你可能有一个基准情况和一个可以缩小问题的递归情况，但如果计算执行的方式导致最终无法到达基准情况，方法将无限地调用自身。\n\
