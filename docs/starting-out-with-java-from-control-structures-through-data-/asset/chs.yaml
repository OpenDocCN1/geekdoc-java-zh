  \n## 9.4 `toString` 方法\n\n> **概念：大多数类都可以从拥有一个名为 `toString` 的方法中受益，该方法在某些情况下会被隐式调用。通常情况下，该方法返回一个表示对象状态的字符串。**\n\
  \n我们经常需要显示一条指示对象状态的消息。对象的*状态*简单来说就是在任何给定时刻存储在对象字段中的数据。例如，回想 `BankAccount` 类有一个字段：`balance`。在任何时刻，`BankAccount`\
  \ 对象的 `balance` 字段都将持有某个值。`balance` 字段的值代表了对象在该刻的状态。以下可能是显示 `BankAccount` 对象状态的代码示例：\n\
  \n```java\n  BankAccount account = new BankAccount(1500.0);\n  System.out.println(\"\
  The account balance is $\" +\n                      account.getBalance());\n```\n\
  \n第一条语句创建一个 `BankAccount` 对象，将值 1500.0 传递给构造函数。回想 `BankAccount` 构造函数将此值存储在 `balance`\
  \ 字段中。执行此语句后，`account` 变量将引用 `BankAccount` 对象。在第二个语句中，`System.out.println` 方法显示显示对象\
  \ `balance` 字段值的字符串。该语句的输出如下：\n\n```\nThe account balance is $1500.0\n```\n\n让我们仔细观察第二个语句，它显示了对象的的状态。传递给\
  \ `System.out.println` 的参数是一个字符串，它由两个部分组合而成。连接运算符（`+`）将部分连接在一起。第一部分是字符串字面量 `\"The\
  \ account balance is $\"`。在此基础上，拼接了 `getBalance` 方法返回的值。生成的显示在屏幕上的字符串代表了对象的当前状态。\n\
  \n创建一个表示对象状态的字符串是一项如此常见的任务，以至于许多程序员为他们的类配备一个返回此类字符串的方法。在 Java 中，将此方法命名为 `toString`\
  \ 是标准做法。让我们来看带有 `toString` 方法的类示例。图 9-8 显示了 `Stock` 类的 UML 图，该类持有有关公司股票的数据。\n\n\
