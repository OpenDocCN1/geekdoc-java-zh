  \ 标签\n\n在为方法编写文档注释时，你可以使用 `@exception` 标签来记录该方法抛出的异常。当 `javadoc` 工具在方法的文档注释中看到 `@exception`\
  \ 标签时，它知道接下来将出现异常名称，随后是导致该异常的事件描述。`@exception` 标签注释的通用格式如下：\n\n`@exception ExceptionName\
  \ Description`\n\n`ExceptionName` 是异常的名称，`Description` 是导致异常发生的情况的描述。关于 `@exception`\
  \ 标签注释，请记住以下几点：\n\n> 方法文档注释中的 `@exception` 标签必须出现在方法的常规描述之后。\n> 描述可以跨越多行。它结束于文档注释的结尾（`*/`\
  \ 符号）或另一个标签的开始处。\n\n当方法的文档注释中包含 `@exception` 标签时，`javadoc` 工具会在方法的文档中创建一个 Throws（抛出）部分。在该部分将列出该方法所抛出的异常的描述。例如，这里是\
