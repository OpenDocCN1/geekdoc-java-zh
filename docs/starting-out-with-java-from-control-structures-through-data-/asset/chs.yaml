  \n### 3.10 使用 DecimalFormat 类创建对象\n\n> **概念：`DecimalFormat` 类用于格式化到指定小数位数的浮点数**\n\
  \n在 Java 中，`double` 类型的值可以显示最多 15 位小数，而 `float` 类型的值可以显示最多 6 位小数。例如，看以下代码：\n\n```java\n\
  \    double number = 10.0 / 6.0;\n    System.out.println(number);\n```\n\n此代码将显示：\n\
  \n`1.666666666666667`\n\n通常，你想要控制显示的小位数。例如，在显示金额时，通常显示两位小数。你可以使用 API 中的 `DecimalFormat`\
  \ 类来控制浮点数的格式化。首先，为了使用 `DecimalFormat` 类，你需要在程序顶部有以下 `import` 语句：\n\n```java\nimport\
  \ java.text.DecimalFormat;\n```\n\n`DecimalFormat` 类并不是自动对你的程序可用的。该语句使其可用。\n\n回顾\
  \ 第 2 章 关于 `String` 类的讨论，类是对象的描述。它指定了对象拥有的属性和方法。在本书中，类经常被比作可以创建对象的“蓝图”。当程序运行时，它可以使用类在内存中创建所需的任意对象。从类创建的每个对象都称为该类的*实例*（instance）。\n\
  \n要使用 `DecimalFormat` 类，你需要创建一个该类的对象或实例。以下语句显示了一个示例：\n\n```java\n    DecimalFormat\
  \ formatter = new DecimalFormat(\"#0.00\");\n```\n\n让我们将语句拆解为两个部分。语句的第一部分如下：\n\n\
  ```\n    DecimalFormat formatter =\n```\n\n\n\n\n这声明了一个名为 `formatter` 的变量。变量的数据类型为\
  \ `DecimalFormat`。由于 `DecimalFormat` 单词并不是原始数据类型的名称，Java 假设它是一个类的名称。回想第 2 章，类类型的变量被称为引用变量，它用于保存对象的内存地址。当引用变量持有一个对象的内存地址时，称该变量引用了该对象。因此，`formatter`\
  \ 变量将用于引用一个 `DecimalFormat` 对象。紧随其后的 `=` 运算符将由语句后半部分创建的对象的地址赋值给它，如下所示：\n\n```\n\
  \  new DecimalFormat(\"#0.00\");\n```\n\n语句的这部分使用了关键字 `new`，它会在内存中创建一个对象。在单词 `new`\
  \ 之后，出现了名称 `DecimalFormat`，后面紧跟一些包含在一组括号中的数据。`DecimalFormat` 的名称指定了应该创建一个 `DecimalFormat`\
  \ 类的对象。\n\n现在让我们来看括号内出现的数据。当创建对象时，一个名为 `constructor`（构造函数）的特殊方法会自动执行。构造函数的目的是用适当的数据初始化对象的属性，并执行任何必要的设置操作。换句话说，它构建了对象。括号内出现的数据是传递给构造函数的参数。当你创建一个\
  \ `DecimalFormat` 对象时，你向构造函数传递了一个包含 `formatting pattern`（格式化模式）的字符串。格式化模式由指定如何格式化浮点数的特殊字符组成。在例例中，字符串\
  \ `\"#0.00\"` 被传递给构造函数。该字符串将被赋值给对象的内部属性之一。语句执行后，`formatter` 变量将引用在内存中创建的对象。这在图 3-24\
  \ 中所示。\n\n**图 3-24** `formatter` 变量引用一个 `DecimalFormat` 对象\n\n![Image](img/00187.jpg)\n\
  \n格式化模式中的每个字符都对应数字中的一个位置。前两个字符 `#0` 对应小数点前的两个数字，句号表示小数点，而字符 `00` 对应小数点后的两个数字。`#`\
  \ 字符指定如果该位置有数字，则显示该数字。如果该位置没有数字，则不显示任何数字。`0` 字符也指定如果该位置有数字，则显示该数字。然而，如果该位置没有数字，则应该显示一个\
  \ `0`。小数点后的两个零表示数字应该四舍五入两位小数。\n\n一旦你正确创建了 `DecimalFormat` 对象，你就可以调用它的 `format` 方法并将想要格式化的数字作为参数传递。该方法返回一个包含格式化后数字的字符串。例如，查看代码列表\
  \ 3-16 中的程序。\n\n**代码列表 3-16 (`Format1.java`)**\n\n![Image](img/00188.jpg)\n\n**程序输出**\n\
  \n`0.17`\n\n`1.67`\n\n`16.67`\n\n`166.67`\n\n注意格式化模式中 `#` 字符与 `0` 字符之间的区别。`#` 符号不会导致显示任何数字，而\
  \ `0` 字符会导致显示前导零。例如，查看代码列表 3-17 中的程序。这与代码列表 3-16 中所示的程序相同，但使用了不同的格式模式。\n\n**代码列表\
  \ 3-17 (`Format2.java`)**\n\n![Image](img/00189.jpg)\n\n**程序输出**\n\n`000.17`\n\n\
  `001.67`\n\n`016.67`\n\n`166.67`\n\n你也可以在格式化模式中插入逗号，以便在格式化数字中创建分组分隔符。代码列表 3-18 中的程序演示了这一点。\n\
  \n**代码列表 3-18 (`Format3.java`)**\n\n![Image](img/00190.jpg)\n\n**程序输出**\n\n`123.90`\n\
  \n`1,233.90`\n\n`12,345.90`\n\n`123,456.90`\n\n`1,234,567.90`\n\n你还可以通过在格式化模式的最后一个位置写入\
  \ `%` 字符将数字格式化为百分比。这会导致数字乘以 100，并在其末尾附加 `%` 字符。代码列表 3-19 中的程序演示了这一点。\n\n**代码列表 3-19\
  \ (`Format4.java`)**\n\n![Image](img/00191.jpg)\n\n**程序输出**\n\n`%`\n\n\n\n\n\n```java\n\
  int value1 = 3;\nint value2 = 6;\nint value3 = 9;\nSystem.out.printf(\"%d %d %d\\\
  n\", value1, value2, value3);\n```\n\n在 `printf` 方法调用中，格式字符串之后有三个格式占位符和三个额外的参数。这段代码将产生以下输出：\n\
  \n```\n3 6 9\n```\n\n现在，让我们对要显示的值实际应用一些格式化。格式占位符还可以包含一个字段宽度。这里有一个示例：\n\n```java\n\
  int number = 9;\nSystem.out.printf(\"The value is %6d\\n\", number);\n```\n\n格式占位符\
  \ `%6d` 表示参数 `number` 应该打印在一个宽度为 6 个位置的字段中。如果 `number` 的值少于 6 个位置，它将右对齐。这里是该代码的输出：\n\
  \n```\n  The value is 9\n```\n\n如果参数的值宽于指定的字段宽度，字段宽度将扩大以容纳该值。例如，看以下代码：\n\n```java\n\
  int number = 97654;\nSystem.out.printf(\"The value is %2d\\n\", number);\n```\n\n\
  在这段代码中，字段宽度为两个空格，但显示的值 `97654` 需要五个空格。因为字段宽度会自动扩大以容纳该数字，所以这段代码将产生以下输出：\n\n```\n\
  \  The value is 97654\n```\n\n当你需要打印按列对齐的值时，字段宽度非常有帮助。例如，看以下代码：\n\n```java\nint\
  \ num1 = 97654, num2 = 598;\nint num3 = 86, num4 = 56012;\nint num5 = 246, num6\
  \ = 2;\nSystem.out.printf(\"%7d %7d\\n\", num1, num2);\nSystem.out.printf(\"%7d\
  \ %7d\\n\", num3, num4);\nSystem.out.printf(\"%7d %7d\\n\", num5, num6);\n```\n\n\
  格式占位符 `%7d` 在宽度为七个空格的字段中打印整数。因此，这段代码在一个三行两列的表格中显示变量的值。每列的宽度为七个空格。这里是该代码的输出：\n\n\
  ```\n  97654    598\n  86      56012\n  246         2\n```\n\n如果你想打印浮点值，请使用 `%f`\
  \ 格式占位符。这里有一个示例：\n\n```java\ndouble number = 1278.92;\nSystem.out.printf(\"The number\
  \ is %f\\n\", number);\n```\n\n这段代码产生以下输出：\n\n```\n      The number is 1278.9200000\n\
  ```\n\n在打印浮点值时你也可以使用字段宽度。例如，以下代码在一个宽度为 18 个空格的字段中打印 `number` 的值：\n\n```java\nSystem.out.printf(\"\
  The number is %18f\\n\", number);\n```\n\n除了字段宽度，你还可以指定小数点后出现的位数。这里有一个示例：\n\n```java\n\
  double grossPay = 874.12;\nSystem.out.printf(\"Your pay is %.2f\\n\", grossPay);\n\
  ```\n\n在这段代码中，`%.2f` 占位符表示该值在小数点后应出现两位数字。代码的输出如下：\n\n```\n  Your pay is 874.12\n\
  ```\n\n当你指定小数点后出现的位数时，数字会被四舍五入。例如，看以下代码：\n\n```java\ndouble number = 1278.92714;\n\
  System.out.printf(\"The number is %.2f\\n\", number);\n```\n\n这段代码将产生以下输出：\n\n```\n\
  \      The number is 1278.93\n```\n\n你可以同时指定字段宽度和小数位数，所示：\n\n```java\ndouble grossPay\
  \ = 874.12;\nSystem.out.printf(\"Your pay is %8.2f\\n\", grossPay);\n```\n\n该代码的输出如下：\n\
  \n```\n  Your pay is 874.12\n```\n\n### 3.1 需要避免的常见错误\n\n以下列表描述了在学习本章时常见的几种错误。\n\
  \n-   **使用 `=` 代替 `==` 来比较基本类型值**：记住，`=` 是赋值运算符，而 `==` 用于测试相等性。\n-   **使用 `==` 代替\
  \ `equals` 来比较 `String` 对象**：你不能使用 `==` 来比较 `String` 的内容；必须使用 `equals` 方法。\n-  \
  \ **忘记用括号括起 `if` 语句**：Java 要求 `if` 测试的 `boolean` 表达式必须包含在括号内。如果省略了括号或使用了任何分组字符，将导致错误。\n\
  -   **在 `if` 语句末尾写分号**：在 `if` 子句末尾写分号会导致 Java 认为条件执行的语句为空。\n-   **忘记用大括号括多个条件执行语句**：通常\
  \ `if` 语句条件执行一个语句。要条件执行多个语句，必须将它们括起来。\n-   **省略 `if-else if` 语句末尾的 `else`**：这不是语法错误，但可能会导致逻辑错误。如果你省略了\
  \ `if-else if` 语句中最后的 `else`，那么当没有任何布尔表达式为真时，将没有任何代码被执行。\n-   **在逻辑 `&&` 或 `||`\
  \ 运算符两侧没有编写完整的布尔表达式**：你必须在两侧都编写完整的布尔表达式。例如，`x > 0 && < 10` 是无效的，因为 `< 10` 不是完整的表达式。\n\
  -   **尝试用 `String` 类的 `equals` 和 `compareTo` 方法进行不区分大小的比较**：要进行不区分大小的比较，请使用 `String`\
  \ 类的 `equalsIgnoreCase` 和 `compareToIgnoreCase` 方法。\n-   **使用不是 `int`、`short`、`byte`\
  \ 或 `char` 类型的 SwitchExpression**：`switch` 语句只能评估 `int、short、byte` 或 `char` 类型的表达式。\n\
  -   **使用不是字面量或 `final` 变量的 CaseExpression**：因为编译器必须在编译时确定 *CaseExpression* 的值，所以\
  \ **CaseExpressions* 必须是字面值或 `final` 变量。\n-   **忘记在 `case` 语句末尾写冒号**：每个 `case` 语句的\
  \ **CaseExpression* 之后都必须有一个冒号。\n-   **忘记在 `case` 部分写 `break` 语句**：这不是语法错误，但可能会导致逻辑错误。程序在遇到\
  \ `break` 语句或到达 `switch` 语句结束之前不会跳出 `switch` 语句。\n\n\n\n\n\n- **在 `switch` 语句中忘记写\
  \ `default` 部分**。这不是一个语法错误，但可能会导致逻辑错误。如果你省略了 `default` 部分，当没有任何 `CaseExpressions`\
  \ 匹配 `SwitchExpression` 时，将没有任何代码被执行。\n- **在使用条件运算符时反转了 `?` 和 `:` 的顺序**。在使用条件运算符时，`?`\
  \ 字符应该先后后出现在条件表达式中，然后是 `:` 字符。\n- **忘记向 `DecimalFormat` 对象的构造函数传递格式化字符串**。格式化字符串指定了如何对传递给\
  \ `format` 方法的任何数字进行格式化。\n\n## 复习题与练习题\n\n### 单选题与判断题\n\n1. `if` 语句是 _________ 的一个示例。\n\
