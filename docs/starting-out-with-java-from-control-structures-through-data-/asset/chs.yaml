  \ [代码列表 20-3] 中找到。\n\n### **20.3 双向链表和循环链表**\n\n> **概念：单向链表易于从任何节点移动到它的后继。双向链表易于从任何节点移动到它的后继或前驱。循环链表则方便于从列表的一端移动到另一端。**\n\
  \n\n\n\n\n我们一直在学习的单链表允许我们从任何节点一步直接移动到它的后继节点。然而，如果我们想从一个节点移动到它的前驱节点，则必须从链表的头部开始，然后一直移动到当前节点的前驱节点。如果当前节点位于长链的末尾，这种操作将非常昂贵。如果我们为每个节点都添加一个前驱引用，就可以一步到位移动到前驱节点。具有后继和前驱引用的链表被称为*双向链表*。双向链表中的节点所示：\n\
  \n![Image](img/01518.jpg)\n\n带有 `next` 和 `prev` 引用的节点如图 20-5 所示。\n\n**图 20-5** 双向链表的节点\n\
  \n![Image](img/01519.jpg)\n\n处理双向链表的操作与处理单链表没有太大区别。你使用 `null` 引用表示空表，使用指向链表表头的引用表示非空链表。如果节点没有后继节点，则将\
  \ `next` 设置为 `null`；如果节点没有前驱节点，则将 `prev` 设置为 `null`。一个包含 `Alan`、`Bob` 和 `Carol`\
  \ 名的双向链表示例如图 20-6 所示。该链表使用一个名为 `first` 的头指针和一个指向最后一个元素的名为 `last` 的指针。\n\n**图 20-6**\
  \ 双向链表\n\n![Image](img/01520.jpg)\n\n* * *\n\n![Image](img/00009.jpg)\n\n## 向双向链表添加节点\n\
  \n* * *\n\n#### 向双向链表添加节点\n\n向双向链表添加节点与向单链表添加节点节点的。假设我们要向一个双向链表添加元素 `e`。如果链表为空，新节点既没有后继节点也没有前驱节点，因此我们可以这样写：\n\
  \n```\nfirst = new Node(e, null, null);\nlast = first;\n```\n\n或者，我们可以如下使用单参数构造函数：\n\
  \n```\nfirst = new Node(e);\nlast = first;\n```\n\n当链表不为空时，需要考虑两种情况：新节点要添加到第一个元素*之前*，以及新节点要添加到第一个元素*之后*。要在第一个元素之前添加新节点，我们可以这样写：\n\
  \n```\nfirst = new Node(e, first, null);\nfirst.next.prev = first;\n```\n\n现在让我们考虑后一种情况。一种方法是首先获取将成为新节点前驱的节点引用。假设已经获取了这样一个引用\
  \ `pred`。现在再取另一个引用 `succ`，并将其指向 `pred` 之后的节点：\n\n```\nNode succ = pred.next;\n```\n\
  \n要添加的新节点将置于 `pred` 和 `succ` 之间。使用名为 `middle` 的引用创建这个新节点：\n\n```\nNode middle =\
  \ new Node(e, succ, pred);\n```\n\n执行这一序列将产生图 20-7 所示的结果，其中 `Alex` 扮演元素 `e` 的角色。目标是将\
  \ `Alex` 插入到 `Allan` 之后。\n\n**图 20-7** 向双向链表中插入插入节点的第一步\n\n![Image](img/01521.jpg)\n\
  \n一旦实现了图 20-7 中的情况，只需将 `pred.next` 设置为 `middle` 并将 `succ.prev` 设置为 `middle` 即可。但我们必须小心：虽然知道\
  \ `pred` 不是 `null`，但不能对 `succ` 那么。此外，如果 `succ` 为 `null`，则意味着新节点被添加到链表的末尾，必须将 `last`\
  \ 指向它。完成工作的正确代码如下：\n\n```\npred.next = middle;\nif (succ == null)\n    last = middle\n\
  else\n    succ.prev = middle;\n```\n\n#### 从双向链表中删除节点\n\n从双向链表中删除节点并不困难，尽管这需要谨慎进行。首先，获取你想要删除的节点引用。给定这样一个引用（假设为\
  \ `target`），获取两侧节点的引用：\n\n```\nNode pred = target.prev;\nNode succ = target.next;\n\
  ```\n\n现在你想让 `succ` 成为 `pred` 的后继，并让 `pred` 成为 `succ` 的前驱：\n\n```\npred.next = succ;\n\
  succ.prev = pred;\n```\n\n不幸的是，如果目标节点是链表的第一个或最后一个，这段代码将无法工作。例如，如果目标节点是链表中的最后一个，那么\
  \ `succ` 将为 `null`，而尝试设置 `succ.prev` 将导致异常。正确代码如下：\n\n```\nif (pred == null)\n \
  \   first = succ;\nelse\n    pred.next = succ;\n\nif (succ == null)\n    last =\
  \ pred;\nelse\n    succ.prev = pred;\n```\n\n注意，即使被删除的节点是链表中唯一的节点，这段代码也有效。\n\n\n\
  \n\n\n该类与第 20.2 节中的 `LinkedList1` 类不同之处在于，它省略了指向列表中最后一个节点的引用。我们想要为 `size`、`add`\
  \ 和 `remove` 方法编写递归实现。\n\n### `size` 的递归实现\n\n计算列表大小的递归策略反映了链表的递归性质：如果列表为空，则其大小为\
  \ 0；否则，列表的大小为尾部的大小加 1。请注意，列表 `list` 的尾部是 `list.next`。`size` 的递归实现如下：\n\n![Image](img/01534.jpg)\n\
  \n公共方法 `size` 简单调用 `size` 的私有递归版本，并将列表头引用传递给它，如下所示：\n\n![Image](img/01535.jpg)\n\
  \n该类的其他递归方法同样将是私有的，并由相应的公共方法进行调用。\n\n### `add (String e, Node list)` 方法的递归实现\n\n\
  `RLinkedList` 类将有一个递归私有方法：\n\n```\nNode add(String e, Node list)\n```\n\n它将由其公共对应方法\
  \ `void add(String e)` 调用。该递归方法将列表 `list` 和一个元素 `e` 作为参数，并返回将 `e` 添加到 `list` 末尾后得到的列表。与\
  \ `size` 的情况一样，递归策略基于链表的递归性质。如果列表为空，则方法返回一个包含 `e` 作为其唯一元素的单项列表。如果列表不为空，则按照如下方式将元素\
  \ `e` 添加到列表尾部的最后：\n\n![Image](img/01536.jpg)\n\n注意非基准情况下的事件序列。首先，使用递归调用来返回将 `e`\
  \ 添加到尾部的结果：\n\n```\nadd(e, list.next);\n```\n\n其次，使用这个修改后的尾部来替换 `list` 中的当前尾部：\n\
  \n```\nlist.next = add(e, list.next);\n```\n\n第三，也是最后，该方法返回已替换了尾部的原始列表：\n\n```\n\
  return list;\n```\n\n### add(int index, String e, Node list) 的递归实现\n\n该方法在列表的指定索引处插入元素\
  \ `e` 并返回生成的列表。首先，方法检查 `index` 是否在适当范围内，如果不在，则抛出异常。因此，假设索引非负，且列表的大小大于或等于索引。考虑两种情况：\n\
  \n* *索引为零。* 方法需要将 `e` 放在列表开头（列表可能为空也可能为空）并返回结果。这通过以下代码实现：\n\n```\nreturn new Node(e,\
  \ list);\n```\n\n* *索引大于零。* 因为列表的大小大于或等于索引，列表不可能为空，因此必须有头部和尾部。方法需要将尾部替换为在尾部位置 `index-1`\
  \ 处添加 `e` 的结果，并返回修改后的列表：\n\n```\nlist.next = add(index-1, e, list.next);\nreturn\
  \ list;\n```\n\n在此方法中，递归是针对 `index` 参数的而不是列表，基准情况是索引为 0 的时候。完整方法如下：\n\n![Image](img/01537.jpg)\n\
  \n### remove 方法的递归实现\n\n两个递归 `remove` 方法中的每一个都返回一对结果：从列表中移除的节点，以及在该节点被移除后剩余的列表。这两个结果可以封装在一个\
  \ `RemovalResult` 类型的单个对象中：\n\n![Image](img/01538.jpg)\n\n首先，考虑方法\n\n```\nRemovalResult\
  \ remove(int index, Node list)\n```\n\n该方法本应返回指定索引处的节点以及剩余的列表，并将它们封装在单个 `RemovalResult`\
  \ 对象中。假设 `index` 非负，且小于或等于列表大小减 1。再次考虑以下情况：\n\n* *索引为零。* 那么列表的大小必须大于或等于 1，所以列表不为空。方法需要从\
  \ `list` 中移除第一个节点，封装该节点和剩余列表（将是 `list.next`），并返回生成的 `RemovalResult` 对象。\n\n![Image](img/01539.jpg)\n\
  \n* *索引不为零。* 在这种情况下，方法需要递归地从尾部移除 `index-1` 处的节点：\n\n```\nRemovalResult remRes;\n\
  remRes = remove(index-1, list.next);\n```\n\n然后，方法用递归调用的结果替换尾部：\n\n```\nlist.next\
  \ = remRes.list;\n```\n\n在返回给调用者之前，方法必须通过将递归调用返回的 `RemovalResult` 对象的剩余列表字段设置为 `list`（通过替换其尾部而修改过的）：\n\
  \n```\nremRes.list = list;\nreturn remRes;\n```\n\n第二个移除方法也类似，可以在代码列表 20-5 中找到。\n\
