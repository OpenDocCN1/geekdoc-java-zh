  \ 方法\n\n`substring` 方法返回来自调用对象的子字符串的副本。该方法有两个重载版本。第一个版本接受一个 `int` 参数，作为子字符串的起始位置。该方法返回一个\
  \ `String` 对象的引用，其中包含从起始位置到字符串结尾的所有字符。起始位置的字符是子字符串的一部分。以下是该方法的使用示例：\n\n```\n  String\
  \ fullName = \"Cynthia Susan Lee\";\n  String lastName = fullName.substring(14);\n\
  \  System.out.println(\"The full name is \" + fullName);\n  System.out.println(\"\
  The last name is \" + lastName);\n```\n\n此代码将产生以下输出：\n\n```\n  The full name is\
  \ Cynthia Susan Lee\n  The last name is Lee\n```\n\n请记住，`substring` 方法返回一个持有子字符串副本的新\
  \ `String` 对象。当这段代码执行时，`fullName` 和 `lastName` 变量将引用两个不同的 `String` 对象，如图 10-5 所示。\n\
  \n**图 10-5** `fullName` 和 `lastName` 变量引用的是独立对象\n\n![Image](img/00744.jpg)\n\n该方法的第二个版本接受两个\
  \ `int` 参数。第一个指定子字符串的起始位置，第二个指定子字符串的结束位置。起始位置的字符包含在子字符串中，但结束位置的字符不包含。以下是该方法的使用示例：\n\
  \n```\n  String fullName = \"Cynthia Susan Lee\";\n  String middleName = fullName.substring(8,\
  \ 13);\n  System.out.println(\"The full name is \" + fullName);\n  System.out.println(\"\
  The middle name is \" + middleName);\n```\n\n代码将产生以下输出：\n\n```\n  The full name\
  \ is Cynthia Susan Lee\n  The middle name is Susan\n```\n\n### `getChars` 和 `toCharArray`\
  \ 方法\n\n`getChars` 和 `toCharArray` 方法将调用的 `String` 对象转换为 `char` 数组。`getChars` 方法用于转换子字符串，而\
  \ `toCharArray` 方法转换整个字符串。以下是 `getChars` 方法的使用示例：\n\n```\n  String fullName = \"\
  Cynthia Susan Lee\";\n  char[] nameArray = new char[5];\n  fullName.getChars(8,\
  \ 13, nameArray, 0);\n  System.out.println(\"The full name is \" + fullName);\n\
  \  System.out.println(\"The values in array:\");\n  for (int i = 0; i < nameArray.length;\
  \ i++) {\n    System.out.print(nameArray[i]);\n  }\n```\n\n`toCharArray` 方法返回一个包含字符串所有字符的\
  \ `char` 数组。以下是一个示例：\n\n```\n  String fullName = \"Cynthia Susan Lee\";\n  char[]\
  \ nameArray = fullName.toCharArray();\n```\n[/content]\n\n\n\n\n`trim()` 方法返回 `String`\
  \ 对象的副本，其中删除了所有开头和结尾的空白字符。`leading`（开头）空白字符出现在字符串开头（或左侧）的字符。例如，以下字符串有三个开头空白字符：\n\
  \n```\n  \" Hello\"\n```\n\n`trailing`（结尾）空白字符出现在非空格字符之后的字符串结尾（或右侧）的字符。例如，以下字符串有三个结尾空白字符：\n\
  \n```\n  \"Hello \"\n```\n\n这里是一个示例：\n\n```java\n  String greeting1 = \"        \
  \   Hello            \n  greetingString greeting greeting;\n\n .�System.out.println(\"\
  *\" + greeting1 + \"*\");\n  System.out.println(\"*\" + greeting2 + \"*\");\n```\n\
  \n在这段代码中，第一个语句将字符串 `\" Hello \"`（带有三个开头空格和三个结尾空格）赋值给变量 `greeting1`。调用了 `trim()`\
  \ 方法，该方法返回一个删除了开头和结尾空格的字符串副本。代码将产生以下输出：\n\n```\n  *          Hello              *\n\
    *Hello*\n```\n\n`trim()` 方法的一个常见用途是移除用户在输入数据时可能输入的任何开头或结尾空格。\n\n### 静态 `valueOf`\
