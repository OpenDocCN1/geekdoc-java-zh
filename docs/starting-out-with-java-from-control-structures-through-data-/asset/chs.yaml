  \ 程序的交互\n\n![Image](img/00633.jpg)\n\n静态方法对于许多任务来说非常方便，因为可以根据需要直接从类调用。它们通常被用于创建工具类，用于对数据执行操作，但不需要收集和存储数据。`Metric`\
  \ 类就是一个很好的例子。它被用作容器来存放将英里转换为公里以及反之的方法，但并打算存储任何数据。\n\n静态方法唯一的局限性是它们不能引用类的非静态成员。这意味着任何从静态方法调用的方法也必须是静态的。这也意味着如果方法使用了类的任何字段，这些字段也必须是静态的。\n\
