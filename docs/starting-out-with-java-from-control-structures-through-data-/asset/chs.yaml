  \n如果 `toLowerCase` 方法的参数是大写字符，该方法将返回其对应的小写字符。例如，以下语句将在屏幕上显示字符 `a`：\n\n```java\n\
  System.out.println(Character.toLowerCase('A'));\n```\n\n如果参数已经是小写的，`toLowerCase`\
  \ 方法将原样返回。以下语句也会导致显示小写字符 `a`：\n\n```java\nSystem.out.println(Character.toLowerCase('a'));\n\
  ```\n\n\n\n\n如果 `toUpperCase` 方法的参数是一个小写字母，则该方法返回其对应的大写字母。例如，以下语句将将在屏幕上显示字符 `A`：\n\
  \n```java\nSystem.out.println(Character.toUpperCase('a'));\n```\n\n如果参数已经是大写字母，则\
  \ `toUpperCase` 方法将原样返回它。\n\n传递给 `toLowerCase` 或 `toUpperCase` 的任何非字母参数都将按原样返回。以下每条语句都会在不进行任何更改的情况下显示方法的参数：\n\
  \n```java\nSystem.out.println(Character.toLowerCase('*'));\nSystem.out.println(Character.toLowerCase('$'));\n\
