  使用类似于 `LinkedList1Demo.java` 的图形用户界面测试分数。图形界面应支持如下格式的单条命令：\n\n`insert name score`\n\
  \n此类命令的示例是“insert Whiz 105”。\n\n#### 5. 婚礼抽奖 (Wedding Lottery)\n一位美丽的公主要从 $n$ 个求婚者中选择一个丈夫。求婚者被编号为\
  \ 0 到 $n-1$，并围坐在圆桌旁。有一个 $n-1$ 的随机序列 $x[0], x[1], \\dots$。公主从 0 开始，顺时针方向数 $x[0]$\
  \ 个位置并移除该位置的人。从那里开始，她再数 $x[1]$ 个位置并移除该位置的人。她一直这样做，直到剩下一个幸运的人：她嫁给了他，从此幸福生活。\n\n假设公主的位置始终位于两个求婚者之间。作为一个例子，假设求婚者为\
  \ $A, B, C, D$，$A$ 编号为 0，$D$ 编号为 3。让随机序列为 0, 2, 1。那么移除顺序为 $A, C$，幸运的人是 $B$。\n\n\
  编写一个使用链表的类来帮助公主做决定。该类的构造函数将接收求婚者的数量 $n$（例如 4），然后是 $n$ 个名字（例如 A, B, C, D），最后是用于“旋转”的\
  \ $n-1$ 个数字（0, 2, 1）。当前位置从列表开始。该类应该有一个方法 `rotate(int x)`，从当前位置开始顺时针方向数 $x$ 步。该类有一个方法\
  \ `List<String> getEliminated()`，按移除顺序返回已移除求婚者的名称列表。该类还有一个方法 `List<String> getHopeful()`，返回未移除的求婚者列表。\n\
  \n编写一个驱动程序，获取输入 $n$、$n$ 个求婚者的名字列表以及作为“旋转步骤”的 $n-1$ 个整数。使用你写的类，程序打印被拒绝求婚者的名字（按拒绝顺序），然后打印幸运儿的名字。\n\
  \n#### 6. 婚礼抽奖 II (Wedding Lottery II)\n为婚礼抽奖问题编写一个适当图形界面。该界面允许公主使用格式为 *add name.*\
