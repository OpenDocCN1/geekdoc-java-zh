  \ 10.4 `StringBuilder` 类\n\n> **概念：`StringBuilder` 类与 `String` 类相似，不同之处在于你可以更改 `StringBuilder`\
  \ 对象的内容。`StringBuilder` 类还提供了几个 `String` 类没有的实用方法。**\n\n`StringBuilder` 类与 `String`\
  \ 类相似。两者之间的主要区别是，你可以更改 `StringBuilder` 对象的内容，但不能不能。回想一下 `String` 对象是不可变的。这意味着一旦设置了内容，就无法更改它。例如，看以下代码：\n\
  \n```java\n  String name;\n  name = \"George\";\n  name = \"Sally\";\n```\n\n在这段代码中，第一个语句将字符串\
  \ `\" Hello \"` 赋值给变量 `greeting1` 赋值。调用了 `trim()` 方法，该方法返回一个删除了开头和结尾空格的字符串副本。代码将产生以下输出：\n\
  \n```\n  *              Hello                  *\n  *Hello*\n```\n\n`trim()` 方法的一个常见用途是移除用户在输入数据时可能输入的任何开头或结尾空格。\n\
  \n### `StringBuilder` 类\n\n`StringBuilder` 类与 `String` 类相似。两者之间的主要区别是，你可以更改 `StringBuilder`\
  \ 对象的内容，但不能不能。回想一下 `String` 对象是不可变的。这意味着一旦设置了内容，就无法更改它。例如，看以下代码：\n\n```java\n  String\
  \ name;\n  name = \"George\";\n  name = \"Sally\";\n```\n\n第一个语句创建变量 `name`。第二个语句创建一个包含\
  \ \"George\" 的字符串对象并将其地址赋值给 `name`。第三个语句创建另一个包含 \"Sally\" 的字符串对象并将其地址赋值给 `name`。正如\
  \ 图 10-7 所示。\n\n**图 10-7** 字符串不再\n\n![Image](img/00750.jpg)\n\n与 `String` 对象不同，`StringBuilder`\
  \ 对象具有允许修改它们无需创建对象的方法。你可以修改字符、插入字符、删除字符并执行其他操作。`StringBuilder` 对象将根据需要增大或缩小大小以适应这些更改。`String`\
  \ 对象不可变这一事实很少成为问题，但如果你的程序需要大量更改，你可以考虑使用 `StringBuilder` 对象。通过减少必须创建和移除的 `String`\
  \ 对象数量来提高程序的效率。现在来看 `StringBuilder` 类的构造函数和方法。\n\n#### `StringBuilder` 构造函数\n\n\
  表 10-8 列出了三个 `StringBuilder` 构造函数。\n\n**表 10-8** `StringBuilder` 构造函数\n\n![Image](img/00751.jpg)\n\
  \n前两个构造函数创建指定大小的空 `StringBuilder` 对象。第一个构造函数使 `StringBuilder` 对象足够容 16 个字符，第二个构造函数使其足够容\
  \ `length` 个字符。记住，`StringBuilder` 对象会自动调整大小，因此以后想在对象中存储更大的字符串也没有问题。第三个构造函数接受一个 `String`\
  \ 对象作为参数，并将对象的内容赋值给 `StringBuilder` 对象。以下是其用法示例：\n\n```java\n  StringBuilder city\
  \ = new StringBuilder(\"Charleston\");\n  System.out.println(city);\n```\n\n这段代码创建了一个\
  \ `StringBuilder` 对象并将其地址赋值给变量 `city`。该对象初始化为字符串 \"Charleston\"。如代码所示，你可以将 `StringBuilder`\
  \ 对象传递给 `println` 和 `print` 方法。\n\n`StringBuilder` 类的一个局限性是你不能使用赋值运算符将字符串赋值给 `StringBuilder`\
  \ 对象。例如，以下代码将无法工作：\n\n```java\n  StringBuilder city = \"Charleston\"; // 错误！！！无法工作！\n\
  ```\n\n不要使用赋值运算符，必须使用 `new` 关键字和构造函数，或者一个 `StringBuilder` 方法将字符串存储在 `StringBuilder`\
  \ 对象中。\n\n\n\n\n\n`StringBuilder` 类提供了许多与 `String` 类相同的方法。表 10-9 列出了若干 `StringBuilder`\
  \ 方法，这些方法的工作方式与 `String` 类中对应的方法完全相同。\n\n**表 10-9** `String` 和 `StringBuilder` 类共有的方法\n\
  \n![Image](img/00752.jpg)\n\n此外，`StringBuilder` 类还提供了若干 `String` 类不具备的方法。让我们来看其中几个。\n\
  \n### **`append` 方法**\n\n`StringBuilder` 类有若干个名为 `append` 的方法的重载版本。这些方法接受一个参数，该参数可以是任何原始数据类型、`char`\
  \ 数组或 `String` 对象。它们将参数的字符串表示附加到调用对象的当前内容之后。由于 `append` 有许多重载版本，我们将按照如下形式检查该方法典型调用的泛般形式：\n\
  \n```\n`object.append(item)`\n```\n\n调用该方法后，`item` 的字符串表示将附加到 `object` 的内容中。下面的代码显示了一些\
  \ `append` 方法用法：\n\n![Image](img/00753.jpg)\n\n此代码将产生以下输出：\n\n`  We sold 12 doughnuts\
  \ for $15.95`\n\n### **`insert` 方法**\n\n`StringBuilder` 类也有若干个名为 `insert` 的方法的重载版本，它可以将一个值插入到调用对象的字符串中。这些方法接受两个参数：一个指定在调用对象字符串中开始插入位置的\
  \ `int` 类型，以及要插入的值。要插入的值可以是任何原始数据类型、`char` 数组或 `String` 对象。由于 `insert` 有许多重载版本，我们将按照如下形式检查该方法典型调用的泛般形式：\n\
  \n```\n`object.insert(start, item)`\n```\n\n在泛形式中，`start` 是插入的起始位置，`item` 是要插入的项目。下面的代码显示了一些\
  \ `insert` 方法用法：\n\n![Image](img/00754.jpg)\n\n此代码产生以下输出：\n\n`  In July we sold\
  \ 20 cars.`\n\n代码列表 10-6 显示了 `insert` 方法另一个示例。`Telephone` 类有一个名为 `format` 的静态方法，它接受一个包含未格式化电话号码的\
  \ `String`。该方法在区号周围插入括号，并在前码后插入连字符。代码列表 10-7 中的程序演示了该类。\n\n**代码列表 10-6 (`Telephone.java`)**\n\
  \n![Image](img/00755.jpg)\n\n![Image](img/00756.jpg)\n\n**代码列表 10-7 (`TelephoneTester.java`)**\n\
  \n![Image](img/00757.jpg)\n\n**程序输出**\n\n`(919)555-1212`\n\n### **`replace` 方法**\n\
  \n`StringBuilder` 类有一个 `replace` 方法，它与 `String` 类的 `replace` 方法略有不同。`String` 类的\
  \ `replace` 方法是将一个字符的所有出现替换另一个字符，而 `StringBuilder` 类的 `replace` 方法是将指定的子字符串替换为字符串。以下是该方法调用的泛形式：\n\
  \n```\n`object.replace(start, end, str)`\n```\n\n在泛形式中，`start` 是一个 `int`，指定调用对象中子字符串的起始位置，`end`\
  \ 是一个 `int`，指定子字符串的结束位置。（起始位置包含在内，但结束位置不包含。）`str` 参数是一个 `String` 对象。在方法执行后，子字符串将被替换为\
  \ `str`。以下是一个示例：\n\n```\nStringBuilder str =\n    new StringBuilder(\"We moved from\
  \ Chicago to Atlanta.\");\nstr.replace(14, 21, \"New York\");\nSystem.out.println(str);\n\
  ```\n\n此代码中的 `replace` 方法将单词“Chicago”替换为“New York”。代码将产生以下输出：\n\n`  We moved from\
  \ New York to Atlanta.`\n\n### **`delete, deleteCharAt,` 和 `setCharAt` 方法**\n\n\
  `delete` 和 `deleteCharAt` 方法用于从 `StringBuilder` 对象中删除子字符串或字符。`setCharAt` 方法将指定的字符更改另一个值。表\
  \ 10-10 描述了这些方法。\n\n**表 10-10** `StringBuilder` 类的 `delete`, `deleteCharAt` 和 `setCharAt`\
  \ 方法\n\n![Image](img/00758.jpg)\n\n下面的代码演示了这三个方法：\n\n```\nStringBuilder str =\n\
  \    new StringBuilder(\"I ate 100 blueberries!\");\nstr.delete(9, 13);\nstr.deleteCharAt(8);\n\
  str.setCharAt(6, '5');\nSystem.out.println(str);\n```\n\n`  I ate 100 blueberries!`\n\
  `I ate 10!`\n`I ate 50 berries!`\n\n![Image](img/00752.jpg)\n\n* *\n\n**注意：** Java\
  \ API 提供了一个 `StringBuffer` 类，它本质上与 `StringBuilder` 相同，具有相同的构造函数和相同的方法。区别在于 `StringBuffer`\
  \ 类中的方法是*同步的（synchronized）*。这意味着 `StringBuilder` 类在多线程应用程序中使用是安全的。多线程编程超出了本书的范围，但简而言之，多线程应用程序是一个并发运行多个线程的程序。在这样的应用程序中，可能多个线程同时访问同一个对象。\n\
  \n由于同步操作需要执行额外的步骤，`StringBuffer` 类比 `StringBuilder` 类慢。在对象不会被多个线程访问的应用程序中，你应该使用\
  \ `StringBuilder` 类以获得最佳性能。在多个线程将访问对象的应用程序中，你应该使用 `StringBuffer` 类。\n\n* *\n\n###\
