  > 24. 如何确定 `ArrayList` 对象的尺寸（size）？\n> 25. `ArrayList` 对象的尺寸和容量之间有什么区别？\n\n## 8.13\
  \ 应避免的错误\n\n以下列表描述了在学习本章时常见的错误：\n\n- **使用无效索引**。Java 不允许使用超出数组范围的索引值。\n- **混淆整数数组元素的内容与元素的索引**。元素的索引和存储在元素中的值是不相同的。索引标识一个元素，而元素持有一个值。\n\
  - **导致差一错误**。在处理数组时，索引从 0 开始，到项数减 1 结束。当循环使用 1 作为初始索引，和/或使用等于项数的作为最大索引时，通常会导致差一错误。\n\
  - **使用 `=` 运算符复制数组**。使用 `=` 运算符将一个数组引用赋值给另一个仅仅是将一个变量中的地址复制到另一个。要复制数组，你应该将一个数组的元素复制到另一个数组。\n\
  - **使用 `==` 运算符比较两个数组**。你不能使用 `==` 运算符比较两个数组引用并判断数组是否相等。当你对引用变量使用 `==` 运算符时，比较的是变量所包含的内存地址，而不是变量所引用对象的内容。\n\
  - **在处理二维数组时反转行和列索引**。当把二维数组设为行和列时，第一个索引访问行，第二个索引访问列。如果你反转了这些索引，将访问错误的元素。\n\n\n\n\
