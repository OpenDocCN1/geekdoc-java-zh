  ![Image](img/01001.jpg)\n\n### 13.4 组合框 (Combo Boxes)\n\n> **概念：组合框允许用户从下拉列表中选择一个项目**。\n\
  \n* * *\n\n![Image](img/00009.jpg)\n\n**JComboBox 组件**\n\n* * *\n\n组合框展示了一个用户可以从中选择的项目列表。与列表组件不同，组合框以下拉列表的形式呈现其项目。你使用位于\
  \ `javax.swing` 包中的 `JComboBox` 类来创建组合框。你向构造函数传递一个要作为下拉列表项目显示的对象数组。以下是一个示例：\n\n\
  ```java\nString[] names = { \"Bill\", \"Geri\", \"Greg\", \"Jean\",\n          \
  \        \"Kirk\", \"Phillip\", \"Susan\" };\nJComboBox nameBox = new JComboBox(names);\n\
  ```\n\n显示时，由此代码创建的组合框最初将显示为图 13-11 左侧所示的按钮。该按钮显示当前选中的项目。请注意，当组合框首次显示时，列表中的第一个项目会被选中。当用户点击按钮时，会弹出下拉列表，用户可以选择另一个项目。\n\
  \n**图 13-11** 组合框\n\n![Image](img/01002.jpg)\n\n如你所见，组合框是两个组件的结合。在图 13-11 所示的组合框情况下，它是按钮和列表的结合。这就是“组合框（combo\
  \ box）”名称的由来处。\n\n#### 响应组合框事件\n\n当 `JComboBox` 对象中的某一个项目被选中时，它会产生一个动作事件（action\
  \ event）。与 `JButton` 组件一样，你使用动作事件监听器类来处理动作事件，该类必须具有一个 `actionPerformed` 方法。当用户在组合框中选择一个项目时，组合框会执行其动作事件监听器的\
  \ `actionPerformed` 方法，并将一个 `ActionEvent` 对象作为参数传递。\n\n#### 获取选中的项目\n\n`JComboBox`\
  \ 类中有两个方法可以用来确定组合框中当前选中了哪一个项目：`getSelectedItem` 和 `getSelectedIndex`。`getSelectedItem`\
  \ 方法返回当前选中项目的引用。例如，假设 `nameBox` 引用之前在图 13-11 中所示的 `JComboBox` 组件。以下代码获取当前选中的名称的引用，并将其赋值给变量\
  \ `selectedName`：\n\n```java\nString selectedName;\nselectedName = (String) nameBox.getSelectedItem();\n\
  ```\n\n请注意，`getSelectedItem` 方法的返回值是一个 `Object` 引用。在这段代码中，我们必须将返回值强制转换为 `String`\
  \ 类型，以便将其存储在 `selectedName` 变量中。\n\n`getSelectedIndex` 方法返回被选中项目的索引。与 `JList` 组件一样，组合框中存储的项目使用从\
  \ 0 开始的索引编号。你可以使用选中项目的索引从数组中检索项目。例如，假设使用以下代码来构建图 13-11 中所示的 `nameBox` 组件：\n\n```java\n\
  String[] names = { \"Bill\", \"Geri\", \"Greg\", \"Jean\",\n                  \"\
  Kirk\", \"Phillip\", \"Susan\" };\nJComboBox nameBox = new JComboBox(names);\n```\n\
  \n由于 `names` 数组持有在 `namesBox` 组件中显示的值，可以使用以下代码来确定选中的项目：\n\n```java\nint index;\n\
  String selectedName;\nindex = nameList.getSelectedIndex();\nselectedName = names[index];\n\
  ```\n\n代码列表 13-4 所示的 `ComboBoxWindow` 类演示了一个组合框。它使用了一个带有动作监听器的 `JComboBox` 组件。当从组合框选择一个项目时，它将显示在一个只读文本字段中。`main`\
