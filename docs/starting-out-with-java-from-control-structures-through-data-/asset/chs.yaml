  \ 18.4 Map\n\n> **概念：map 中的每个元素包含两个部分：键（key）和值（value）。每个键关联一个值。例如，假设我们希望在 map 中存储名称，并通过\
  \ ID 检索它们。map 不允许重复的键。然而，map 允许重复的值。**\n\n#### `Map` 接口和 `AbstractMap` 类\n\n`Map`\
  \ 接口指定了任何 map 必须支持的基本操作。有添加映射、移除映射、搜索值以及对 map 进行其他操作的方法。表 18-9 描述了 `Comparator`\
  \ 接口指定的方法。（等等，此处提到的是 `Comparator` 接口，但上下文是 `Map`）。`Map` 接口指定了任何 map 必须支持的基本操作。有用于添加映射、移除映射、搜索值以及对\
