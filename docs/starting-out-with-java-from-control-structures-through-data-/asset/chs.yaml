  \n让我们仔细观察第 6 行的类头：\n\n```java\npublic class Point<T>\n```\n\n在类名之后，`T` 出现在尖括号内。在这个类声明中，`T`\
  \ 是一个**类型参数**（type parameter）。*类型参数*是一个表示实际类型的标识符。当你实例化该类时，你使用一个实际类型作为类型参数的参数。你通过在类名后面紧跟的尖括号内编写类型名称来实现此操作。例如，考虑以下代码：\n\
  \n```java\nInteger intX = new Integer(10);\nInteger intY = new Integer(20);\nPoint<Integer>\
  \ myPoint = new Point<Integer>(intX, intY);\n```\n\n记得 `Integer` 是一个包装类。在这一语句中，我们将\
  \ `Integer` 作为类型参数传递给 `T` 参数。这在 图 17-1 中所示。\n\n**图 17-1** 向类型参数传递类型参数\n\n![Image](img/01285.jpg)\n\
  \n对于这个 `Point` 类实例，类型参数 `T` 将变为 `Integer`。在 `Point` 类中多处使用了 `T`，如 图 17-2 所示。在每个地方，`T`\
  \ 都变为作为参数传递给它的类型。\n\n**图 17-2** `Point` 类中的类型参数 `T`\n\n![Image](img/01286.jpg)\n\
  \n例如，查看第 8 行和第 9 行中 `xCoordinate` 和 `yCoordinate` 字段的声明：\n\n```java\nprivate T xCoordinate;\
  \           // X 坐标\nprivate T yCoordinate;           // Y 坐标\n```\n\n如果我们将 `Integer`\
  \ 作为类型参数传递给 `T`，这些声明将变为：\n\n```java\nprivate Integer xCoordinate;       // X 坐标\n\
  private Integer yCoordinate;       // Y 坐标\n```\n\n`T` 类型参数还被用于以下方法头：\n\n```java\n\
  public Point(T x, T y)\npublic void setX(T x)\npublic void setY(T y)\npublic T getX()\n\
  public T getY()\n```\n\n如果我们将 `Integer` 作为类型参数传递给 `T`，这些方法头将变为：\n\n```java\npublic\
  \ Point(Integer x, Integer y)\npublic void setX(Integer x)\npublic void setY(Integer\
  \ y)\npublic Integer getX()\npublic Integer getY()\n```\n\n代码列表 17-3 中的程序通过创建该类的两个实例来测试\
  \ `Point` 类。在第一个实例中，`Double` 类型被传递给类型参数 `T`；在第二个实例中，`Integer` 类型被传递给 `T`。（此程序也存储在源代码文件夹第\
