  \ `total` 中。因此，在内层循环每次迭代之前，必须将 `total` 变量设置为零。\n\n### 累加二维数组的列总和\n\n有时，你可能需要计算二维数组中每一列的总和。例如，假设使用二维数组存储一组学生的分数成绩，你想计算每项成绩的级平均分。要做到这一点，你需要计算数组中每一列的平均值。这通过一组嵌套循环来实现。外层循环控制列下标，内层循环控制行下标。内层循环计算一列的和，并存储在一个累加器中。下面的代码演示了：\n\
