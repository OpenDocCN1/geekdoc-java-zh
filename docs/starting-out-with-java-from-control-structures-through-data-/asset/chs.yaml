  \n**代码列表 16-10 `(InsertionSortTest.java)`**\n\n![Image](img/01240.jpg)\n\n* * *\n\
  \n## 程序输出\n\n`原始顺序：`\n\n`David Abe Katherine Beth Jeff Daisy`\n\n`排序后的顺序：`\n\n`Abe\
  \ Beth Daisy David Jeff Katherine`\n\n* * *\n\n## 快速排序\n\n快速排序算法是一种由 C. A. R. Hoare\
  \ 于 1960 年开发的流行排序例程。它通过将数组划分为子列表来对其排序。在子列表之间有一个选定的值，称为基值（pivot），如图 16-20 所示。\n\n\
  **图 16-20** 子列表与基值\n\n![Image](img/01241.jpg)\n\n注意图中，子列表 1 位于基值的左侧（之前），而子列表 2 位于基值的右侧（之后）。一旦选定了基值，算法就会重新排列数组中的其他值，直到左列表中的所有元素都小于基值，而右列表中的所有元素都大于或等于基值。这并不意味着子列表中的元素是有序的，只是意味着数组中较小的值在左子列表中，较大的值在右子列表中。\n\
  \n完成后，算法递归地对子列表 1 然后对子列表 2 重复该过程。在此过程中，子列表本身再次被划分为带有基值的子列表。所有小于基值的元素都被移动到左子列表，所有大于基值的元素都被移动到右子列表。当子列表中最多只有一个元素时，递归停止。当所有递归调用完成后，数组就完全完全排序了。\n\
  \n为了演示快速排序算法，我们提供了一个类 `IntQuickSorter.java`。该类具有以下公共静态方法：\n\n\n\n\n该方法接受一个 `int`\
  \ 数组作为参数。然后它调用一个私有静态方法 `doQuickSort`。我们之所以需要这个额外的方法调用，是因为快速排序算法需要待排序数组区域的起始下标和结束下标。当你首次调用快速排序算法时，你提供的是整个数组的起始下标和结束下标。为了方便使用\
  \ `IntQuickSorter` 类的用户，我们提供了 `quickSort` 方法，它只需接受一个数组。然后它调用 `doQuickSort` 方法，并将起始下标和结束下标作为参数传递。\n\
  \n`doQuickSort` 方法的伪代码所示：\n\n```\ndoQuickSort:\nIf Starting Index < Ending Index\n\
  Partition the List around a Pivot.\ndoQuickSort Sublist 1.\ndoQuickSort Sublist\
  \ 2.\nEnd If\nEnd doQuickSort\n```\n\n这里是 `doQuickSort` 方法的 Java 代码：\n\n![Image](img/01243.jpg)\n\
  \n第一个参数是保存待排序列表的数组。第二个和第三个参数是列表的起始下标和结束下标。\n\n第 34 行的 `partition` 方法返回枢值元素的下标。`partition`\
  \ 方法不仅决定哪个元素将作为枢值，还重新排列列表中的其他值。该方法选择数组中间的元素作为枢值，然后扫描数组的剩余部分寻找小于枢值的值。\n\n`partition`\
  \ 方法的代码所示：\n\n![Image](img/01244.jpg)\n\n![Image](img/01245.jpg)\n\n`partition`\
  \ 方法最初并没有将值按最终顺序进行排序。它的任务是将小于枢值的值移动到枢值的左侧，并将大于枢值的值移动到枢值的右侧。只要满足该条件，它们可以以任何顺序出现。整个数组的最终排序顺序通过对\
  \ `doQuickSort` 方法的递归调用累积实现。\n\n划分数组有许多不同的方法。如前所述，此 `partition` 方法中所示的技术选择中间值作为枢值。然后，该值被移动到数组的开头（通过与存储在底处的值进行交换）。这简化了下一步，即扫描数组。\n\
  \n一个 `for` 循环扫描数组的剩余部分，当发现某个元素的值小于枢值时，该值就会被移动到枢值点左侧的位置。第三个方法 `swap` 用于交换数组中任意两个元素的值。该方法所示：\n\
