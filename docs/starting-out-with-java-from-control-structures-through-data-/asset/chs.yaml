  \ 变量使用 4 字节，而 `double` 变量使用 8 字节。\n\n范围列显示了每个数据类型变量中可能存储的数字范围。例如，`int` 变量可以存储从 –2,147,483,648\
  \ 到 +2,147,483,647 的数字。Java 语言的一个迷人的特性之一是，所有原始数据类型的大小和范围在所有计算机上都是相同的。\n\n![Image](img/00005.jpg)\n\
