  \ `DataInputStream` 的一些方法。请注意，如果已经到达文件末尾，表中所列的每个方法都会抛出 `EOFException`。\n\n**表 12-2**\
  \ 一些 `DataInputStream` 方法\n\n![Image](img/00954.jpg)\n\n代码列表 12-12 中的程序打开了由代码列表\
  \ 12-11](#dummy_split_019.html_filepos2188030) 程序创建的 `Numbers.dat` 文件。从文件中读取数字并显示在屏幕上。注意，程序必须捕获\
  \ `EOFException` 以确定何时到达了文件末尾。\n\n**代码列表 12-12 (`ReadBinaryFile.java`)**\n\n![Image](img/00955.jpg)\n\
  \n![Image](img/00956.jpg)\n\n***\n\n**程序输出**\n\n`Reading numbers from the file:`\n\
  `2 4 6 8 10 12 14`\n`Done.`\n\n***\n\n### 写入和读取字符串\n\n要向二进制文件写入字符串，你应该使用 `DataOutputStream`\
  \ 类的 `writeUTF` 方法。该方法将其 `String` 参数以名为 UTF-8 编码的格式写入。编码的工作原理如下：在写入字符串之前，该方法会写入一个双字节整数，表示字符串所占的字节数。然后它以\
  \ Unicode 格式写入字符串的字符。（UTF 代表 Unicode 文本格式。）\n\n当 `DataInputStream` 类的 `readUTF`\
  \ 方法从文件中读取时，它期望前两个字节包含字符串所占的字节数。然后它会读取等数量的字节并将其作为 `String` 返回。\n\n例如，假设 `outputFile`\
  \ 引用一个 `DataOutputStream` 对象，以下代码使用 `writeUTF` 方法写入一个字符串：\n\n```java\nString name\
  \ = \"Chloe\";\noutputFile.writeUTF(name);\n```\n\n假设 `inputFile` 引用一个 `DataInputStream`\
  \ 对象，以下语句使用 `readUTF` 方法从文件中读取一个 UTF-8 编码的字符串：\n\n```java\nString name = inputFile.readUTF();\n\
  ```\n\n记住，只有当字符串使用 `writeUTF` 方法写入时，`readUTF` 方法才能正确读取该字符串。\n\n***\n\n书的源代码可以在 [www.pearsonhighered.com/gaddis](http://www.pearsonhighered.com/gaddis)\
  \ 获取，包含示例程序 `WriteUTF.java` 和 `ReadUTF.java`，它们演示了如何使用这些方法写入和读取字符串。\n\n***\n\n###向现有二进制文件追加数据\n\
  \n如果你将现有文件的名称传递给 `FileOutputStream` 构造函数，它将被擦除并创建一个同名的空文件。如果你想保留现有文件并追加数据，`FileOutputStream`\
  \ 构造函数接受一个可选的 `boolean` 参数。如果参数为 `true`，数据将追加到末尾。如果参数为 `false`，则文件将被擦除。\n\n```java\n\
  FileOutputStream fstream = new FileOutputStream(\"MyInfo.dat\", true);\nDataOutputStream\
  \ outputFile = new DataOutputStream(fstream);\n```\n\n#### 随机访问\n\n虽然顺序访问在很多情况下有用，但它会降低程序速度。如果文件很大，定位深处的数据可能需要长时间。或者，Java\
  \ 允许程序进行随机访问。在随机访问中，程序可以直接跳转到文件的任何位置，而无需先读取字节。顺序访问与随机访问之间的区别就像磁带和光盘的区别。在听 CD 时，不需要听或快进歌曲。你只需跳转到想听的轨道。这在图\
  \ 12-15 中所示。\n\n**图 12-15** 顺序访问与随机访问\n\n![Image](img/00957.jpg)\n\n要在 Java 中创建并处理随机访问文件你需要你需要\
  \ `RandomAccessFile` 类，它位于 `java.io` 包中。类构造函数的通用格式如下：\n\n```java\nRandomAccessFile(String\
  \ filename, String mode)\n```\n\n第一个参数是文件名。第二个参数是指示你想要使用文件的模式字符串。两种模式是用于读取的 `\"\
  r\"` 和用于读取和写入的 `\"rw\"`。当使用 `\"r\"` 模式打开文件时，程序只能从中读取。当使用 `\"rw\"` 模式打开文件时，程序可以读取并写入文件。以下是一些使用\
  \ `RandomAccessFile` 类打开文件的语句示例：\n\n```java\n// 用于随机读取文件。\nRandomAccessFile randomFile\
  \ = new RandomAccessFile(\"MyData.dat\", \"r\");\n\n// 用于随机读取和写入文件。\nRandomAccessFile\
  \ randomFile = new RandomAccessFile(\"MyData.dat\", \"rw\");\n```\n\n\n\n\n这里关于这两种模式需要记忆的一些重要点：\n\
  \n> • 如果你以 `\"r\"` 模式打开文件而该文件不存在，则将抛出 `FileNotFoundException`。\n> • 如果你以 `\"r\"\
  ` 模式打开文件并尝试进行写入，则将抛出 `IOException`。\n> • 如果你以 `\"rw\"` 模式打开一个现有文件，它不会被删除。文件的现有内容将被保留。\n\
  > • 如果你以 `\"rw\"` 模式打开文件而该文件不存在，则将创建它。\n\n### 使用 `RandomAccessFile` 类进行读写\n\n使用\
  \ `RandomAccessFile` 类打开或创建的文件被视为二进制文件。事实上，`RandomAccessFile` 类拥有与 `DataOutputStream`\
  \ 类相同的写入数据方法，以及与 `DataInputStream` 类相同的读取数据方法。实际上，你可以使用 `RandomAccessFile` 类来顺序处理二进制文件。例如，代码列表\
  \ 12-13 中的程序打开了一个名为 `Letters.dat` 的文件，并将字母表中的所有字母写入该文件。\n\n**代码列表 12-13 (`WriteLetters.java`)**\n\
  \n```\n![Image](img/00958.jpg)\n![Image](img/00959.jpg)\n```\n\n**程序输出**\n\n`Opening\
  \ the file.`\n`Writing data to the file…`\n`Done.`\n\n在此程序执行完毕后，字母表中的字母将存储在 `Letters.dat`\
  \ 文件中。由于使用了 `writeChar` 方法，每个字母都将分别存储为两个字节的字符。当我们以后想要从文件中读取字符时，知道这一事实是关重要的。\n\n\
  ### 文件指针（The File Pointer）\n\n`RandomAccessFile` 类将文件视为字节流。这些字节是经过编号的，第一个字节是字节 0。最后一个字节的编号是文件中字节总数减一。这些字节编号类似于数组的下标，用于标识文件中的位置。\n\
  \n在内部，`RandomAccessFile` 类维护着一个名为**文件指针**的长整型（long integer）值。`file pointer`持有文件中某个位置的字节数。当文件被首次打开时，文件指针被设置为\
  \ 0。这使得它“指向”文件中的第一个字节。当从文件中读取项时，它是从文件指针指向的字节处读取的。读取操作还会导致文件指针移动到被读取项之后的下一个字节。例如，假设文件指针指向字节\
  \ 0，并使用 `readInt` 方法从文件中读取一个 `int`。一个 `int` 的大小为四个字节，因此将从字节 0 开始从文件中读取四个字节。在读取该值后，文件指针将移动到字节数\
  \ 4，即文件中的第 5 个字节。如果紧接着读取另一个项，读取将从字节数 4 开始。如果文件指针所指的字节编号超过了文件末尾，则在执行读取操作时会抛出 `EOFException`。\n\
  \n写入操作也发生在文件指针所指向的位置。如果在执行写入操作时文件指针指向文件末尾，则数据将写入文件末尾。然而，如果文件指针持有文件内部某个字节的编号（即已存储数据的位置），那么写入操作将导致数据覆盖该位置现有数据。\n\
  \n`RandomAccessFile` 类不仅允许你读写数据，还允许你移动文件指针。这意味着你可以立即从文件的任何字节位置读取数据。这也意味着你也可以将数据写入文件的任何位置，覆盖现有数据。要移动文件指针，你可以使用\
  \ `seek` 方法。该方法的通用格式如下：\n\n```\nvoid seek(long position)\n```\n\n该参数是你想要让文件指针移动到的字节数。例如，查看以下代码：\n\
  \n```\nRandomAccessFile file = new RandomAccessFile(\"MyInfo.dat\", \"r\");\nfile.seek(99);\n\
  byte b = file.readByte();\n```\n\n这段代码以只读模式打开文件 `MyInfo.dat`。调用 `seek` 方法将文件指针移动到字节数\
  \ 99（即文件中的第 100 个字节）。然后，调用 `readByte` 方法从文件中读取字节数 99 的字节。在该语句执行后，文件指针将向前移动一个字节，因此它将指向字节\
  \ 100。假设我们使用以下代码继续处理同一个文件：\n\n```\nfile.seek(49);\nint i = file.readInt();\n```\n\
  \n首先，`seek` 方法将文件指针移动到字节数 49（即文件中的第 50 个字节）。然后，调用 `readInt` 方法。这从文件中读取一个 `int`。一个\
  \ `int` 的大小为四个字节，因此该语句从字节数 49 开始读取四个字节。在该语句执行后，文件指针将移动到字节数 53。\n\n\n\n\n在附录 I（可通过\
  \ [www.pearsonhighered.com/gaddis](http://www.pearsonhighered.com/gaddis) 获取）中，你可以看到如何检索对象的字段将其保存为记录中的字段。然而，如果一个对象包含其他类型的对象作为字段，保存其内容的过程可能会变得复杂。幸运的是，Java\
  \ 允许你 `serialize` 对象，这是将对象保存到文件的一种更简单的方法。\n\n当对象被序列化时，它会被转换为包含对象数据的系列字节流。如果对象的设置得当，即使是它可能作为字段包含的其他对象也会自动序列化。生成的字节集可以保存到文件中以便稍后检索。\n\
  \n为了使对象能够序列化，其类必须实现 `Serializable` 接口。`Serializable` 接口位于 `java.io` 包中，没有任何方法或字段。它仅用于告知\
  \ Java 编译器该类的对象可能会被序列化。此外，如果一个类包含其他类的对象作为字段，那么这些类也必须实现 `Serializable` 接口才能被序列化。\n\
  \n例如，在书的源代码中有一个名为 `BankAccount2` 的 `BankAccount` 类修改版本。该类唯一的修改是它实现了 `Serializable`\
  \ 接口。以下是文件中修改后的代码行：\n\n```\nimport java.io.Serializable;\npublic class BankAccount2\
  \ implements Serializable\n```\n\n这段新代码告诉编译器，我们希望能够序列化 `BankAccount2` 类的对象。要将序列化后的对象写入文件，你需要使用\
  \ `ObjectOutputStream` 对象。`ObjectOutputStream` 类用于执行序列化过程（将对象转换为系列字节）。要将字节写入文件，你还必须使用输出流对象，例如\
  \ `FileOutputStream`。这是一个示例：\n\n```\nFileOutputStream outStream = \n           \
  \  new FileOutputStream(\"Objects.dat\");\nObjectOutputStream objectOutputFile =\
  \ \n             new ObjectOutputStream(outStream);\n```\n\n要序列化对象并将其写入文件，使用 `ObjectOutputStream`\
  \ 类的 `writeObject` 方法，如下所示：\n\n```\nBankAccount2 account = new BankAccount2(5000.0);\n\
  objectOutputFile.writeObject(account);\n```\n\n如果发生错误，`writeObject` 方法会抛出 `IOException`。\n\
  \n读取序列化对象的字节并根据它们构建对象的过程被称为 `deserialization`（反序列化）。要反序列化一个对象，你需要使用 `ObjectInputStream`\
  \ 对象以及 `FileInputStream` 对象。以下是设置对象的示例：\n\n```\nFileInputStream inStream = \n  \
  \           new FileInputStream(\"Objects.dat\");\nObjectInputStream objectInputFile\
  \ = \n             new ObjectInputStream(inStream);\n```\n\n要从文件中读取序列化对象，使用 `ObjectInputStream`\
  \ 类的 `readObject` 方法。这是一个示例：\n\n```\nBankAccount2 account;\naccount = (BankAccount2)\
  \ objectInputFile.readObject();\n```\n\n`readObject` 方法返回反序列化后的对象。注意，你必须将返回值强制类型转换为所需的类类型。（如果发生错误，`readObject`\
  \ 方法会抛出若干个不同的异常。更多信息请参阅 API 文档。）\n\n以下程序演示了如何序列化和反序列化对象。代码列表 12-15 中的程序序列化了三个 `BankAccount2`\
  \ 对象，而代码列表 12-16 中的程序反序列化了它们。\n\n**代码列表 12-15 (`SerializeObjects.java`)**\n\n![Image](img/00963.jpg)\n\
  \n![Image](img/00964.jpg)\n\n![Image](img/00965.jpg)\n\n* * *\n\n**带有加粗示例输入的程序输出**\n\
  \n`Enter the balance for account 1:` **5000.0 [Enter]**\n`Enter the balance for\
  \ account 2:` **2500.0 [Enter]**\n`Enter-the-balance for account 3:` **1800.0 [Enter]**\n\
  `The serialized objects were written to the Objects.dat file.`\n\n* * *\n\n**代码列表\
  \ 12-16 (`DeserializeObjects.java`)**\n\n![Image](img/00966.jpg)\n\n![Image](img/00967.jpg)\n\
  \n* * *\n\n**程序输出**\n\n`Account 1 $ 5000.0`\n`Account 2 $ 2500.0`\n`Account 3 $\
  \ 1800.0`\n\n* * *\n\n### 序列化聚合对象\n\n如果一个类实现了 `Serializable` 接口，那么该类中的所有字段都必须是可以序列化的。这对于原始变量来说不是问题，因为它们是可以序列化的。然而，如果一个类包含其他类的对象作为字段，这些类也必须实现\
  \ `Serializable` 接口才能被序列化。\n\n## 12.4 需要避免的常见错误\n\n- **假设 try 块中的所有语句都会执行**：当抛出异常时，会退出\
  \ try 块。这意味着出现在 try 块中跟在出错语句之后的语句将不会执行。\n- **try, catch, 和 finally 子句的顺序错误**：在 `try`\
  \ 语句中，`try` 子句必须首先出现，随后是所有的 `catch` 子句，最后是可选的 `finally` 子句。\n- **在同一个 try 语句中编写两个处理相同异常的\
  \ catch 子句**：在同一个 `try` 语句中，每个异常类型不能有多个 `catch` 子句。\n- **捕捉通过继承关系相关的多个异常时，先列出更通用的异常**：如果你在同一个\
  \ `try` 语句中处理多个异常，且某些异常通过继承关系相关，那么你应该在处理更通用的异常类之前处理更具体的异常类。否则，将发生错误，因为编译器认为你多次处理了同一个异常。\n\
  - **忘记在可能抛出受检异常但未处理异常的方法上编写 throws 子句**：如果一个方法能够抛出受检异常但没有处理该异常，它必须在方法头中包含一个 `throws`\
  \ 子句来指定该异常。\n- **调用方法但未处理其可能抛出的异常**：你必须处理该方法可能抛出的所有受检异常，或者在调用方法的 `throws` 子句中列出它们。\n\
  - **在自定义异常类中，忘记向父类构造函数传递错误消息**：如果你没有向父类构造函数传递错误消息，则异常对象的错误消息将为 `null`。\n- **序列化带有不可序列化成员的对象**：如果一个类具有作为其他类对象的字段，则这些类必须实现\
  \ `Serializable` 接口。\n\n### **复习题与练习**\n\n**单选题和判断题**\n\n\n\n\n1. 当产生异常时，通常说它被 __________。\n\
