  \ 方法。这里是一个示例：\n\n```java\n// 创建一个带有图像和文本的按钮。\nJButton button = new JButton(\"Have\
  \ a nice day!\");\nImageIcon image = new ImageIcon(\"Smiley.gif\");\nbutton.setIcon(image);\n\
  ```\n\n在标签或按钮中放置图像时，并不局限于较小的图形图标。例如，代码列表 13-5 中的 `MyCatImage` 类在用户点击按钮时会在标签中显示一张数字照片。`main`\
