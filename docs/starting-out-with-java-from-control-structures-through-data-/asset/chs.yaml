  \n### **5.3 关于局部变量**\n\n> **概念：局部变量定义在方法内部，方法外部无法访问。不同方法可以拥有相同的局部变量，因为方法看不到彼此的局部变量。**\n\
  \n在第 2 章中，我们引入了局部变量的概念，即在方法内部定义的变量。它们被称为“局部”，是因为它们对于定义它们的方法是局部的。方法外部语句无法访问该方法的局部变量。\n\
  \n由于局部变量对其他方法是不可见的，其他方法可以拥有相同名的局部变量。例如，查看列表 5-8 中的程序。除了 `main` 方法外，该程序还有两个方法：`texas`\
  \ 和 `california`。这两个方法各拥有一个名为 `birds` 的局部变量。\n\n\n\n\n在德克萨斯州有 5000 只鸟。\n\n在加利福尼亚州有\
  \ 3500 只鸟。\n\n***\n\n虽然有两个名为 `birds` 的变量，但程序一次只能看到其中一个，因为它们位于不同的方法。当 `texas` 方法执行时，在\
  \ `texas` 内部声明的 `birds` 变量是可见的。当 `california` 方法执行时，在 `california` 内部声明的 `birds`\
  \ 变量是可见的。\n\n### 局部变量生命\n\n方法的局部变量在方法执行期间存在。这被称为局部变量的 `lifetime`。当方法开始时，它的局部变量和参数变量会在内存中创建；当方法结束时，局部变量和参数变量会被销毁。这意味着存储在局部变量中的任何值在调用声明该变量的方法之间都会丢失。\n\
  \n### 使用参数值初始化局部变量\n\n可以使用参数变量来初始化局部变量。有时这可以简化方法的代码。例如，回想一下我们之前讨论过的 `showSum` 方法：\n\
  \n```java\npublic static void showSum(double num1, double num2)\n{\n    double sum;\
  \      // 用于存储和\nsum = num1 + num2;\n    System.out.println(“The sum is “ + sum);\n\
  }\n```\n\n在方法的体内，声明了变量 `sum`，然后通过一个单独的赋值语句将 `num1 + num2` 赋值给 `sum`。我们可以将这些语句合并为一条，如下所示修改后的方法：\n\
  \n```java\npublic static void showSum(double num1, double num2)\n{\n    double sum\
  \ = num1 + num2;\n    System.out.println(“The sum is “ + sum);\n}\n```\n\n因为参数变量的作用范围是它所在的整个方法，所以我们可以使用参数变量来初始化局部变量。\n\
  \n![Image](img/00007.jpg)\n\n***\n\n**警告！** 局部变量不会用默认值初始化。在使用它们之前必须给它们赋值。如果你尝试在给局部变量赋值之前使用它，将导致编译错误。例如，查看以下方法：\n\
  \n```java\npublic static void myMethod()\n{\n    int x;\n    System.out.println(x);\
  \ //Error! x has no value.\n}\n```\n\n这段代码会导致编译错误，因为变量 `x` 没有赋值，而它正被用作 `System.out.println`\
  \ 方法的参数。\n\n### 5.4 从方法返回值\n\n> **概念：方法可以将值返回给调用该方法的语句**。\n\n你已经看到数据可以通过参数变量传递到方法。数据也可以从方法返回，返回给调用它的语句。返回值的方法通常被称为\
  \ `value-returning methods`（有返回值的方法）。\n\n你已经很练练使用有返回值的方法。例如，你使用过包装类的解析方法，如 `Integer.parseInt`。这里有一个示例：\n\
  \n```java\nint num;\nnum = Integer.parseInt(“700”);\n```\n\n这段代码的第二行调用了 `Integer.parseInt`\
  \ 方法，将“700”作为参数传递。该方法返回整数 700，该值通过 `=` 操作符赋予变量 `num`。你也见过返回值的 `Math.pow` 方法。这里有一个示例：\n\
  \n```java\ndouble x;\nx = Math.pow(4.0, 2.0);\n```\n\n这段代码的第二行调用了 `Math.pow` 方法，将\
  \ 4.0 和 2.0 作为参数传递。该方法计算 4.0 的 2.0 次幂并返回该值。该值为 16.0，通过 `=` 操作符赋予变量 `x`。\n\n在本节中，我们将讨论如何编写自己的有返回值的方法。\n\
  \n***\n\n![Image](img/00009.jpg)\n\n**从方法返回值**\n\n***\n\n### 定义有返回值的方法\n\n当你编写有返回值的方法时，必须决定方法将返回什么类型的值。这是因为你必须在方法头部指定返回值的数据类型。回想不返回值的\
  \ `void` 方法在方法头部使用关键字 `void` 作为返回类型。有返回值的方法使用 `int`、`double`、`boolean` 或其他有效类型。这里有一个示例：\n\
  \n```java\npublic static int sum(int num1, int num2)\n{\n    int result;\n    return\
  \ num1 + num2;\n}\n```\n\n这个方法的名为 `sum`。注意方法头部的返回类型是 `int`。`return` 语句用于将值传回调用者。\n\
  \n![Image](img/00005.jpg)\n\n\n\n\n这段代码将 `sum` 方法的返回值发送到 `System.out.println`，因此它可以显示在屏幕上。屏幕将显示消息“The\
  \ sum is 25”。\n\n请记住，返回值的方法返回的是一个特定数据类型的值。你可以在任何可以使用相同数据类型的普通值的地方使用该方法的返回值。这意味着，在任何可以使用\
  \ `int` 值的地方，都可以使用对返回 `int` 值的方法的调用。同样地，在任何可以使用 `double` 值的地方，都可以使用对返回 `double`\
  \ 值的方法的调用。对于所有其他数据类型情况也是如此的。\n\n### 在文档注释中使用 `@return` 标签\n\n在为返回值的方法编写文档注释时，你可以使用\
  \ `@return` 标签对返回值提供描述。当 `javadoc` 工具在方法的文档注释中看到 `@return` 标签时，它就知道紧接出现的是该方法返回值的描述。\n\
  \n`@return` 标签注释的一般格式如下：\n\n`@return Description`\n\n`Description` 是对返回值的描述。请记住关于\
  \ `@return` 标签注释的以下几点：\n\n> • 方法文档注释中的 `@return` 标签必须出现在方法的常规描述之后。\n> • 描述可以跨多行。它在文档注释的结束处（`*/`\
  \ 符号）或另一个标签的开头结束。\n\n当方法的文档注释包含 `@return` 标签时，`javadoc` 工具会在方法的文档中创建一个“返回”（Returns）部分。这就是列出方法返回值的地方。图\
  \ 5-16 显示了 `javadoc` 为 `ValueReturn.java` 文件中的 `sum` 方法生成的文档。\n\n**图 5-16** `ValueReturn.java`\
  \ 中 `sum` 方法的文档\n\n![Image](img/00302.jpg)\n\n* *\n\n### 焦点聚焦：![Image](img/00008.jpg)\n\
