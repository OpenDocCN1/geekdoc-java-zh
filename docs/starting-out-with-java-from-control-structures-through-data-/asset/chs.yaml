  \ 21.8 队列与广度搜索\n\n如果你需要在程序中使用队列，就不自己实现它。Java 集合框架提供了许多实现 `Queue` 接口的不同类。其中一个类就是我们在第\
  \ 20 章中遇到的熟悉的 `LinkedList` 类。`Queue` 接口声明了表 21-2 所示的方法。\n\n**表 21-2** `Queue` 接口中的某些方法\n\
  \n![Image](img/0165.jpg)\n\n#### 焦点：使用广度搜索进行目录搜索 ![Image](img/00008.jpg)\n\n\n\n\
  \n队列在解决涉及`广度优先搜索`（breadth-first search）的问题时非常有用，这是一种遍历有向图节点的搜索类型。（有图在第 20 章的重点部分有介绍。）广度优先搜索从一个节点开始搜索，然后按照距离起始节点距离增加的顺序继续搜索其他节点。在这里，我们展示如何使用广度优先搜索在目录及其所有子目录中搜索指定的文件或子目录。理解本文不需要理解什么是有图。\n\
  \n计算机系统中的文件和目录按层次结构存储，目录可以包含文件和其他目录。当目录 `D` 包含另一个目录 `E` 中时，我们说 `D` 是 `E` 的子目录。这创建了目录可以有子目录、孙子目录，通称为*后代*的情况。这里的问题是搜索某个初始目录及其所有后代以找到指定的文件\
  \ `F`，如果找到了，则打印 F 的路径。\n\n广度优先搜索基于使用队列来存储初始目录的后代目录。如果遇到了后代目录但尚未对其搜索，则将其放入队列。初始，队列只包含一个目录：初始目录。我们分阶段进行。在每个阶段，我们移除队头的目录\
  \ `X` 并对其搜索。如果我们找到了所需的文件，就停止搜索。否则，我们将 `X` 的所有子目录添加到队列（队尾）。\n\n假设初始目录是 `X`。开始时，队列只包含\
  \ `X`，`X` 将从队列中移除并搜索。如果进程在此未停止，那么 `X` 的所有子目录将添加到队列。`X` 的子目录是第一代后代。在第二阶段，其中一个第一代后代（例如\
  \ `Y`）将被移除并搜索。如果未找到所需的文件，则 `Y` 的所有子目录（即 `X` 的第二代后代）将添加到队列末尾以便稍后处理。由于节点从队列中移除并搜索的顺序与它们添加的顺序一致，因此所有目录将按照其代际递增的顺序被搜索。你可以从这里看出，广度优先搜索是按照距离起始节点距离增加的顺序来搜索节点的。\n\
  \n我们需要使用 `java.util.File` 类中的几个方法，如表 21-3 所示。\n\n**表 21-3** `File` 类的一些方法\n\n![Image](img/01607.jpg)\n\
