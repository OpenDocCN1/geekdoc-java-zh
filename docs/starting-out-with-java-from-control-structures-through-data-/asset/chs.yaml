  \n## 22.4 优先级队列\n\n> **概念：优先级队列是一个根据某种顺序存储元素的集合。优先级队列支持元素的添加和删除，且删除操作总是返回集合中的最小元素。**\n\
  \n值集上的*顺序*是一种建立建立任意两个元素 `x` 和 `y` 之间 `x` 是否“小于” `y` 或 `y` 是否“小于” `x` 的方法。许多集合具有*自然顺序*：例如，整数集按照通常的“小于”关系\
  \ `<` 排序，也就是说，在整数的自然顺序中，当且仅当 `x < y` 时，`x` 即“小于” `y`。同样，在字符串的自然顺序中，如果字符串 `s` 在字母顺序上于\
  \ `t` 之前，则字符串 `s` “小于”字符串 `t`。在有序集中，“小于”所有其他元素的元素被称为*最小*元素，或*极值*。本章提到的所有顺序都将假定为*全序*（或*线性序*），这意味着对于任何两个元素\
  \ `x` 和 `y`，以下条件必须有有一个成立：\n\n> 1. `x` “小于” `y`\n> 2. `x` 等于 `y`\n> 3. `y` “小于” `x`\n\
  \n作为非自然顺序的示例，我们可以规定对于任意两个数字 `x` 和 `y`，如果 `x > y`，则 `x` “小于” `y`。在这种情况下，对于像{1, 2,\
  \ 3, 4}这样的集合，定义的顺序将集合变为序列{4, 3, 2, 1}，并使 4 成为该集合的“最小”元素。\n\nJava 中基本类型的自然顺序由内置的比较运算符\
  \ `<` 指定。像 `Integer` 或 `String` 这样的类类型通过实现 `Comparable` 接口来指定其自然顺序。优先级队列是一个根据某种顺序存储元素的集合。优先级队列支持元素的添加和删除，且删除操作总是返回集合中的最小元素。优先级队列的最小元素位于队头。优先级队列支持的操作如下：\n\
  \n> • `add(x)`：将 `x` 添加到队列\n> • `remove()`：移除并返回队头元素\n\nJava 集合框架提供了一个名为 `PriorityQueue`\
  \ 的优先级队列实现。它的大部分方法列在表 22-1。\n\n### 优先级队列的应用\n\n当元素需要根据某种优先级进行处理时，优先级队列非常有用。例如，个人信息管理器可能会根据截止日期维护任务列表。计算机操作系统使用优先级队列调度任务，计算机网络用于调度数据包。\n\
  \n如果你将一组元素存储在优先级队列中检索它们，它们将按顺序输出。这是一种名为堆排序的高效算法的基础。代码列表 22-7 展示了如何使用优先级队列对数组进行排序。\n\
  \n### 代码列表 22-7 `(Heapsort.java)`\n\n![Image](img/01693.jpg)\n![Image](img/01694.jpg)\n\
  \n### 程序输出\n\n```\n这里要排序的数组：\n13 81 78 93 94 60 2 32 88 58\n排序后的数组：\n2 13 32 58\
  \ 60 78 81 88 93 94\n```\n\n## 在优先级队列中使用比较器\n\n代码列表 22-7 中使用的 `PriorityQueue` 类的无参构造函数按照元素的自然顺序进行排序。如果元素类型是基本类型，则由\
  \ `<` 运算符指定；对于实现 `Comparable` 接口的类类型，则由接口指定。我们需要使用不同的顺序，则必须使用表 22-1 所示的第二个构造函数。该构造函数接受两个参数：一个指定要创建的队列容量和一个\
  \ `Comparator` 对象。`Comparator` 是定义如下泛型接口：\n\n```\npublic interface Comparator<T>\
  \ {\n    int compare(T x, T y);\n}\n```\n\n实现此接口的类提供了 `compare` 的定义，当 `x` 应被视为小于\
  \ `y` 时返回一个负整数，当 `x` 应被视为大于 `y` 时返回一个正整数，当 `x` 等于 `y` 时返回 0。`Comparator` 接口的 `equals`\
  \ 方法是为了允许检查两个 `Comparator` 对象的相等性，如果从 `Object` 继承的默认实现已经足够，则不需要实现。\n\n作为一个示例，让我们来看一个按其字符串表示的字母顺序排序整数的堆排序版本。这是通过创建一个\
  \ `PriorityQueue` 对象并使用从以下类定义的 `Comparator` 对象来实现的：\n\n![Image](img/01695.jpg)\n\
  \n\n\n\n`AlphaOrder` 类被定义在 `Alphaheapsort` 内部，作为一个静态内部类。`AlphaOrder` 设置为静态是因为因为它会被\
  \ `main` 方法实例化，而 `main` 方法本身是静态的。在 Java 中，静态方法无法实例化非静态内部类。\n\n下面的代码段创建一个使用 `AlphaOrder`\
  \ 作为比较器的优先级队列，代码列表 22-8 程序展示了它的用法：\n\n```java\nAlphaOrder comp = new AlphaOrder();\n\
  PriorityQueue<Integer> pQueue = new PriorityQueue<Integer>(arr.length, comp);\n\
  ```\n\n**代码列表 22-8 `(Alphaheapsort.java)`**\n\n![Image](img/01697.jpg)\n\n![Image](img/01698.jpg)\n\
  \n![Image](img/01699.jpg)\n\n***\n\n**程序输出**\n\n`这里是原始数字列表:`\n`1065 8433 743 4962\
  \ 9954 31 1815 4135 489 3094`\n`这些数字按字母顺序排序后为:`\n`1065 1815 3094 31 4135 489 4962\
  \ 743 8433 9954`\n\n***\n\n#### 堆排序分析\n\n我们可以通过计算堆排序导致优先级队列执行的数组元素比较次数来分析其效率。事实证明，一个实现良好的、包含\
  \ *n* 个元素的优先级队列在添加或删除项目时，最多需要 log *n* 次比较。对于一个包含 *n* 个元素的数组，我们可以使用 *n*log *n* 次比较将所有元素添加到优先级队列中，然后使用另外\
  \ *n*log *n* 次比较将它们全部移除，总共需要 2*n*log *n* 次比较。用第 16 章的话来说，堆排序是一个 O(*n*log *n*) 算法。在实践中，n*log\
  \ *n* 算法比选择排序或冒泡排序等 O(*n*²)算法快得多。可以证明，任何通过比较项目进行排序的算法都无法在少于 *n*log *n* 次比较的情况下对\
  \ *n* 个元素的数组进行排序。这意味着在常数因子范围内，堆排序的性能是最可能的。\n\n#### 优先级队列的实现\n\n我们实现优先级队列的目标是找到一种数据结构，使得当优先级队列有\
  \ *n* 个项目时，两个主要的优先级队列操作 `add` 和 `removeMin` 的每一个操作执行所需的比较次数都不超过 log *n* 次。这里立刻能想到两种可能性：\n\
  \n1. 我们可以使用一个未排序的链表来存储 *n* 个元素。这将允许我们快速地向列表中添加新元素，但将迫使我们执行 *n* - 1 次比较来找到并移除最小元素。\n\
  2. 可以使用一个按升序排列的链表来存储 *n* 个元素。这允许我们快速找到并移除最小值，但在最坏情况下，将迫使我们在寻找插入新元素的正确位置时执行 *n* 次比较。\n\
  \n这两种方法都无法实现两种操作所需的 O(log *n*) 复杂度，因此我们必须寻找其他方法。\n\n#### 具有堆顺序属性二叉树\n\n第三种可能性是使用二叉树来存储队列的元素。考虑一个满足以下条件的二叉树\
  \ *T*，我们将其命名为*堆顺序属性*：\n\n在 *T* 的每一个节点 *N* 中，存储在 *N* 中的值大于存储在 *N* 父节点中的值。\n\n直观地说，具有这种属性的二叉树是指从根到叶的每条路径都是升序的树。图\
  \ 22-22 展示了这样一个树的示例。\n\n**图 22-22** 具有堆顺序属性的二叉树\n\n![Image](img/01700.jpg)\n\n我们需要对这样的树施加一个条件来保持其浅；也就是说，我们希望穿过树的最长路径长度约为\
  \ log *n* 而不是 *n*。这将确保必须遍历从根到叶节点路径的添加操作可以在 log *n* 时间内完成。在继续之前，我们需要引入一些术语。\n\n设\
  \ *T* 为一棵二叉树。*T* 中节点 *N* 的 `level`（层级）是从根到 *N* 的路径长度。例如，根节点的层级为 0，根节点的子层级为 1。*T*\
  \ 的 `depth`（深度）是 *T* 中节点的最大层级；即是从根到叶节点的最长路径的长度。深度为 *d* 的二叉树有 *d* + 1 层，因为它在 0 ≤\
  \ *l* ≤ *d* 范围内的每个值 *l* 都有对应的层。我们正在寻找一种深度最好的树族。\n\n#### 具有堆顺序的二叉树\n\n如果一个具有 *n*\
  \ 个节点的二叉树满足以下两个条件，则它就是*完全的*：\n1. 除了可能最后的一外，每一层都是完全满的。\n2. 最后一层中的所有节点都尽可能靠左对齐。\n\n\
  这意味着，如果我们从根开始沿着任何路径向下，每当我们移动到一个新的（数值更高的）层时，我们都保留了少于一半的节点。这表明任何路径的长度最多为 log *n* +\
  \ 1。我们这样表述：\n\n具有 *n* 个节点的完全二叉树深度 ≤ log *n* + 1。\n\n#### 在数组中存储二叉树\n\n完全二叉树没有“空隙”这一事实有一个有趣的后果。如果你使用规则\
  \ R1 到 R3 构建二叉树并在每个节点添加到树时将其存储在数组 *A* 中，你将得到图 22-24 所示的模式。\n\n**图 22-24** 在数组中存储完全二叉树\n\
  \n![Image](img/01702.jpg)\n\n这种模式具有以下特征：\n\n- 树的根是 `A[0]`\n- 非根节点 `A[k]` 的父节点是 `A[(*k*\
  \ – 1)/2]`\n- 节点 `A[k]` 的左孩子和右孩子分别为 `A[2*k* + 1]` 和 `A[2*k* + 2]`\n- 最右叶节点（树的最后一个节点）位于\
  \ `A[*n* - 1]`\n- 如果 *2k* + 1 ≥ *n*，则节点 `A[k]` 是叶子节点；如果 *2k* + 1 < *n*，它有一个左孩子；如果\
  \ *2k* + 2 < *n*，它有一个右孩子\n\n这些观察允许我们使用数组或数组列表来存储完全二叉树。特别是，为了构建整数堆，可以使用如下数组列表：\n\n\
  `ArrayList<Integer> arrayHeap;`\n\n#### 向堆中添加项目\n\n\n\n\n向堆中添加新元素必须维护完全二叉树的结构以及堆的序属性。我们可以通过根据规则\
  \ `R1`、`R2` 和 `R3` 添加新节点来保持树的结构。这意味着新节点将作为树的最最后一层的叶子节点添加，并且在该层内尽可能靠左对齐。例如，向图 22-23\
  \ 中的树中添加 `12` 会得到图 22-25 所示的树。\n\n**图 22-25** 添加新值可能会违反堆的序属性\n\n![Image](img/01703.jpg)\n\
  \n从我们的数组列表表示来看，这意味着新值将如下所示添加到数组列表的末尾：\n\n```\narrayHeap.add(x);\n```\n\n一旦我们添加了新节点（假设为\
  \ `X`），我们就通过遍历从插入点回根节点的路径来恢复堆的序属性。在过程中，我们将 `X` 的值与其父节点的值进行比较，如果父节点的值更大，则交换这两个节点。然后我们向上爬树到达\
  \ `X` 的新位置并重复此过程。当 `X` 变成根节点，或者它到达一个值大于父节点的地方时，我们就停止操作。当我们这样做时，称为对新节点进行*上浮*（sifting\
  \ up）。堆添加值的代码体现在以下方法中：\n\n![Image](img/01704.jpg)\n\n上浮过程由以下方法执行：\n\n![Image](img/01705.jpg)\n\
  \n### 移除最小元素\n\n要从堆中删除元素，我们删除根节点并用队列最后一个位置的节点替换它，即树的最深层最右侧的叶子节点。如果我们对图 22-23 中的堆执行此操作，将得到图\
  \ 22-26 所示的完全二叉树。\n\n**图 22-26** 将根节点替换为最深最右侧叶子节点后的图 22-23 中的堆\n\n![Image](img/01706.jpg)\n\
  \n通常情况下，当这样替换根节点时，树会违反堆的序属性，我们必须执行*下浮*（sift down）操作来重建堆。假设 `X` 是当前存储在根节点并需要下浮的值。我们从根开始沿着树的某个分支向下移动。如果我们到达\
  \ `X` 小于其子节点或是一个叶节点的地方，则停止操作。否则，我们将 `X` 与其最小子节点交换，然后跟随 `X` 下到下一层。通过这种方式，我们将 `X`\
  \ 在树中下浮，直到它到达它所属的位置。在此时，堆的序属性得到恢复，我们将树重新构造成了堆。\n\n从我们的数组实现来说，我们必须先保存位置 `0` 处，然后移除数组列表末尾的值并将其存储在位置\
  \ `0`。`removeMin` 方法如下：\n\n![Image](img/01707.jpg)\n\n你可以在代码列表 22-9 中看到 `siftDown`\
