  \n*输入验证：工作天数不接受小于 1 的数字。*\n\n### 5. 字符计数\n编写一个程序，要求用户输入一个字符串，然后要求用户输入一个字符。该程序应统计并显示指定字符在字符串中出现的次数。\n\
  \n### 6. 文件字符计数\n编写一个程序，要求用户输入文件名，然后要求用户输入一个字符。该程序应统计并显示指定字符在文件中出现的次数。使用记事本或其他文本编辑器创建一个简单的文件来测试该程序。\n\
  \n### 7. 酒店入住率\n酒店的入住率计算公式如下：\n\n`Occupancy rate = number of rooms occupied ÷ total\
  \ number of rooms`\n\n编写一个程序，计算酒店每层的入住率。该程序首先应询问酒店的层数。然后，循环应为每层楼迭代一次。在每次迭代中，循环应询问用户该层的房间总数以及已入住的房间数。在所有迭代完成后，程序应显示酒店的房间总数、已入住数、空闲数以及酒店的入住率。\n\
  \n*输入验证：层数不接受小于 1 的值。每层的房间数不接受小于 10 的数字。*\n\n### 8. 平均降水量\n编写一个使用嵌套循环的程序，收集数据并计算多年间的平均降水量。首先，程序应询问年数。外层循环将每年迭代一次。内层循环将迭代\
  \ 12 次，每月一次。内层循环的每次迭代都会询问用户该月的降雨量（英寸）。在所有迭代完成后，程序应显示总月份数、总降雨英寸数以及整个期间的每月平均降水量。\n\
  \n*输入验证：年数不接受小于 1 的数字。每月降雨量不接受负数。*\n\n![Image](img/00010.jpg)\n\n### 9. 人口数量\n编写一个预测生物种群规模的程序。该程序应询问初始生物数量、平均每日人口增长率（百分比）以及它们繁殖的天数。例如，一个种群可能从两个个体开始，平均每天增长率为\
  \ 50%，并允许繁殖七天。该程序应使用循环显示每天的人口规模。\n\n*输入验证：初始人口规模不接受小于 2 的数字。平均每日增长率不接受负数。*\n\n###\
