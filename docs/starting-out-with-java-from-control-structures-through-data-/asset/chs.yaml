  \ `object2` 将引用作为参数传递的对象。`if` 语句执行以下比较：如果调用对象的 `symbol` 字段与 `object2` 的 `symbol`\
  \ 字段相等，*且*调用对象的 `sharePrice` 字段与 `object2` 的 `sharePrice` 字段相等，则两个对象包含相同的值。在这种情况下，局部变量\
  \ `status`（一个 `boolean` 类型）被设置为 `true`。否则，`status` 被设置为 `false`。最后，方法返回 `status`\
  \ 变量的值。\n\n注意，该方法可以直接访问 `object2` 的 `symbol` 和 `sharePrice` 字段。由于 `object2` 引用一个\
