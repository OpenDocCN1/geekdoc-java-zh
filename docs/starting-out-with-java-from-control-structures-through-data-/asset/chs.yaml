  \ `JLabel`）的大小？\n\n> 13.22 `Dimension` 类构造函数接收哪些参数？\n\n### 13.9 关于文本组件的更多信息：文本区域和字体\n\
  \n> **概念：文本区域是一个可以接受多行的文本字段。继承自 `JComponent` 的组件都有 `setFont` 方法，允许更改组件文本的字体和样式****\n\
  \n#### 文本区域\n\n在第 7 章中，你介绍了 `JTextField` 类，它用于创建文本字段。文本字段是允许用户输入单行文本的组件。文本区域类似于可以多行的文本字段。你使用\
  \ `JTextArea` 类来创建文本区域。以下是类两个构造函数的通用格式：\n\n`JTextArea(int *`rows*`, int *`columns**)`\n\
  \n`JTextArea(String *`text*`, int *`rows*`, int *`columns**)`\n\n在这两个构造函数中，`rows`\
  \ 是文本区域要显示的行数，`columns` 是每行显示的列数（字符数）。在第二个构造函数中，`text` 是文本区域初始显示的字符串。例如，以下语句创建一个具有\
  \ 20 行 40 列的文本区域：\n\n`JTextArea textInput = new JTextArea(20, 40);`\n\n以下语句创建一个具有\
  \ 20 行 40 列的文本区域，并初始显示存储在 `String` 对象 `info` 中的文本：\n\n`JTextArea textInput = new\
  \ JTextArea(info, 20, 40);`\n\n\n\n\n\n与 `JTextField` 类一样，`JTextArea` 类提供了 `getText`\
  \ 和 `setText` 方法用于获取和设置组件包含的文本。例如，以下语句获取存储在 `textInput` 文本区域中的文本并将其存储在 `String`\
  \ 对象 `userText` 中：\n\n```\nString userText = textInput.getText();\n```\n\n以下语句将\
  \ `String` 对象 `info` 中的文本存储在 `textInput` 文本区域中：\n\n```java\ntextInput.setText(info);\n\
  ```\n\n`JTextArea` 组件不会自动显示滚动条。要在 `JTextArea` 组件上显示滚动条，你必须将其添加到滚动面板（scroll pane）中。正如你已经所知道的，你使用\
  \ `JScrollPane` 类创建一个滚动面板。以下是一个创建一个文本区域并将其添加到滚动面板的代码示例：\n\n```java\nJTextArea textInput\
  \ = new JTextArea(20, 40);\nJScrollPane scrollPane = new JScrollPane(textInput);\n\
  ```\n\n`JScrollPane` 对象会在文本区域上同时显示垂直和水平滚动条。默认情况下，滚动条在需要之前不会显示；但是，你可以通过 `JScrollPane`\
  \ 类的两个方法来更改此行为。`setHorizontalScrollBarPolicy` 方法接受一个 `int` 参数，指定水平滚动条何时应该出现在滚动面板中。你可以传递以下常量之一作为参数：\n\
  \n* `JScrollPane.HORIZONTAL_SCROLLBAR_AS_NEEDED`：这是默认设置。只有当水平空间不足以显示文本区域包含的文本时，才会显示水平滚动条。\n\
  * `JScrollPane.HORIZONTAL_SCROLLBAR_NEVER`：此设置防止文本区域中显示水平滚动条。\n* `JScrollPane.HORIZONTAL_SCROLLBAR_ALWAYS`：使用此设置，水平滚动条将始终显示，即使在不需要时。\n\
  \n`setVerticalScrollBarPolicy` 方法也接受一个 `int` 参数，指定垂直滚动条何时出现在滚动面板中。你可以传递以下常量之一作为参数：\n\
  \n* `JScrollPane.VERTICAL_SCROLLBAR_AS_NEEDED`：这是默认设置。只有当垂直空间不足以显示文本区域包含的文本时，才会显示垂直滚动条。\n\
  * `JScrollPane.VERTICAL_SCROLLBAR_NEVER`：此设置防止文本区域中显示垂直滚动条。\n* `JScrollPane.VERTICAL_SCROLLBAR_ALWAYS`：使用此设置，垂直滚动条将始终显示，即使在不需要时。\n\
  \n例如，以下代码指定滚动面板的组件上应始终出现垂直滚动条，但不应出现水平滚动条：\n\n```java\nscrollPane.setHorizontalScrollBarPolicy(JScrollPane.HORIZONTAL_SCROLLBAR_NEVER);\n\
  scrollPane.setVerticalScrollBarPolicy(JScrollPane.VERTICAL_SCROLLBAR_ALWAYS);\n\
  ```\n\n[图 13-27] 显示了没有滚动条的文本区域、带有垂直滚动条的文本区域，以及一个同时带有水平和垂直滚动条的文本区域。\n\n**图 13-27**\
  \ 有或无滚动条的文本区域\n\n![Image](img/01040.jpg)\n\n默认情况下，`JTextArea` 组件不执行换行。这意味着当文本输入到组件中并到达行尾时，文本不会换行到下一行。如果你需要换行，可以使用\
  \ `JTextArea` 类的 `setLineWrap` 方法来将其开启。该方法接受一个 `boolean` 参数。如果你传递 `true`，则开启换行；如果你传递\
  \ `false`，则关闭换行。以下是一个开启文本区域换行的语句示例：\n\n```java\ntextInput.setLineWrap(true);\n```\n\
  \n有两种不同的换行样式：单词换行（word wrapping）和字符换行（character wrapping）。执行单词换行时，换行始终发生在单词之间，永远不会出现在单词中间。执行字符换行时，行在字符之间断开。这意味着行可以在单词中间断开。你使用\
  \ `JTextArea` 类的 `setWrapStyleWord` 方法指定你喜好的换行样式。该方法接受一个 `boolean` 参数。如果你传递 `true`，文本区域将执行单词换行；如果你传递\
  \ `false`，文本区域将执行字符换行。默认样式是字符换行。\n\n#### 字体\n\n组件文本的外观由文本的字体、样式和大小决定。字体是字体的名称——样式可以是普通、粗体和/或斜体——大小是以磅为单位的文本大小。要更改组件文本的外观，你使用组件的\
  \ `setFont` 方法，该方法继承自 `JComponent` 类。该方法的通用格式如下：\n\n```java\nvoid setFont(Font appearance)\n\
  ```\n\n你传递一个 `Font` 对象作为此方法的参数。`Font` 类的构造函数具有以下通用格式：\n\n```java\nFont(String name,\
  \ int style, int size)\n```\n\n\n\n\n> **概念：滑动块（slider）是一种允许用户在数值范围内通过图形方式调整数值的组件。**\n\
  \n滑动块是由 `JSlider` 类创建的，显示显示一个“滑钮”的图像，该滑钮可以沿着轨道移动。滑动块可以是水平或垂直方向的，如图 13-30 所示。\n\n\
  滑动块设计用于表示一组数值范围。滑动块的一端是范围的最小值，另一端是范围的最大值。图 13-30 中显示的两个滑动块都代表 0 到 50 的范围。滑动块在字段中存储一个数值值，随着用户沿着轨道移动滑钮，该数值值会随之调整。请注意，图\
  \ 13-30 中的滑动块带有附带刻度。每隔十个数值，沿轨道会显示一个主刻度，并带有一个指示该刻度数值的标签。主刻度之间是小刻度，在本例中，小刻度每隔两个数值显示一次。刻度的外观、间距以及标签的外观可以通过\
  \ `JSlider` 类中的方法进行控制。`JSlider` 构造函数具有以下通用格式：\n\n```\nJSlider(int orientation, int\
  \ minValue, int maxValue, int initialValue)\n```\n\n**图 13-30** 水平和一个垂直的滑动块\n\n\
  ![Image](img/01043.jpg)\n\n第一个参数是 `int` 类型，用于指定滑动块的方向。你应该使用常量 `JSlider.HORIZONTAL`\
  \ 或 `JSlider.VERTICAL` 之一。第二个参数是滑动块范围的最小值，第三个参数是滑动块范围的最大值。第四个参数是滑动块的初始值，它决定了滑钮的初始位置。例如，可以使用以下代码创建图\
  \ 13-30 所示的滑动块：\n\n```\nJSlider slider1 = new JSlider(JSlider.HORIZONTAL, 0, 50,\
  \ 25);\nJSlider slider2 = new JSlider(JSlider.VERTICAL, 0, 50, 25);\n```\n\n你通过\
  \ `setMajorTickSpacing` 和 `setMinorTickSpacing` 方法设置主刻度和小刻度的间距。这些方法每个都接受一个 `int`\
  \ 参数，用于指定刻度的间隔。例如，以下代码将 `slider1` 对象的主刻度间距设置为 10，将小刻度间距设置为 2：\n\n```\nslider1.setMajorTickSpacing(10);\n\
  slider1.setMinorTickSpacing(2);\n```\n\n如果 `slider1` 组件的范围是 0 到 50，那么这些语句会导致主刻度显示在\
  \ 0, 10, 20, 30, 40 和 50 处。小刻度将显示在 2, 4, 6 和 8 处，然后是 12, 14, 16 和 18 处，依此类推。\n\n\
  默认情况下，刻度是不显示的，且设置它们的间距也不会导致它们显示。你通过调用 `setPaintTicks` 方法来显示刻度，该方法接受一个 `boolean`\
  \ 参数。如果你传递 `true`，则显示刻度；如果你传递 `false`，则不显示。这是一个示例：\n\n```\nslider1.setPaintTicks(true);\n\
  ```\n\n默认情况下，标签也不显示。你通过调用 `setPaintLabels` 方法在滑动块组件上显示数值标签，该方法接受一个 `boolean` 参数。如果你传递\
  \ `true`，则在主刻度处显示数值标签；如果你传递 `false`，则不显示标签。这是一个示例：\n\n```\nslider1.setPaintLabels(true);\n\
  ```\n\n当滑钮的位置移动时，滑动块组件会生成一个更改事件。要处理该更改事件，你必须编写一个监听类（change listener）。当你编写监听器类时，它必须满足以下要求：\n\
  \n- 它必须实现 `ChangeListener` 接口。该接口位于 `javax.swing.event` 包中。\n- 它必须有一个名为 `stateChanged`\
  \ 的方法。该方法必须接受一个 `ChangeEvent` 类型的参数。\n\n要检索存储在 `JSlider` 中的当前值，请使用 `getValue` 方法。该方法作为\
  \ `int` 类型返回滑动块的值。这是一个示例：\n\n```\ncurrentValue = slider1.getValue();\n```\n\n代码列表\
  \ 13-7 中显示的 `TempConverter` 类演示了 `JSlider` 组件。该类显示了图 13-31 所示的窗口。最初显示两个温度：32.0 华氏度和\
  \ 0.0 摄氏度。范围为 0 到 100 的滑动块允许你调整摄氏温度。\n\n### 13.11 外观与感觉\n\n> **概念：GUI 应用的外观由其外观和感觉（look\
  \ and feel）决定。Java 允许你选择应用程序的外观**。\n\n大多数操作系统都有自己独特的视觉和样式。例如，如果 Windows 用户切换到 Macintosh、UNIX\
  \ 或 Linux 系统，他们最可能注意到的是 GUI 显示方式的差异。特定系统的外观被称为其 look and feel。\n\nJava 允许你选择应用程序的\
  \ look and feel。Java 的默认外观是 Ocean。这是你在我们编写过的所有 GUI 程序中看到的 laok。其他 look and feel\
  \ 还包括 Metal、Motif 和 Windows。Metal 是之前 Java 版本的默认外观。Motif 类似于 UNIX 的 look and feel。Windows\
  \ 是 Windows 操作系统的 look and feel。图 13-32 显示了本章之前介绍的 `TempConverterWindow` 类在这些外观和感觉中的样子。\n\
  \n- **注意**：Ocean 实际上是 Metal look and feel 的一种特殊主题。\n- **注意**：目前 Windows look and\
  \ feel 在运行 Microsoft Windows 操作系统的计算机上可用。\n\n要更改应用程序的 look and feel，你需要调用 `UIManager`\
  \ 类的静态方法 `setLookAndFeel`。Java 为一种 look and feel 都提供了一个类，该方法将所需 look and feel 的完全限定类名作为参数。类名必须作为字符串传递。表\
  \ 13-1 列出了 Metal、Motif 和 Windows look and feel 的完全限定类名。\n\n当你调用 `UIManager.setLookAndFeel`\
  \ 方法时，任何已经创建的组件都需要更新。你通过调用 `SwingUtilities.updateComponentTreeUI` 方法来实现这一点，并将想要更新的组件的引用作为参数传递。\n\
  \n\n\n\n\n`UIManager.setLookAndFeel` 方法会抛出多种异常。具体来说，它抛出 `ClassNotFoundException`、`InstantiationException`、`IllegalAccessException`\
  \ 和 `UnsupportedLookAndFeelException`。除非你想捕获每种类型的异常，否则你可以简单地捕获类型为 `Exception`。以下是一个可以从\
  \ `JFrame` 对象运行的代码示例，它可以将其外观和感觉更改为 Motif：\n\n![Image](img/01052.jpg)\n\n这里是一个可以从\
  \ `JFrame` 对象运行的代码示例，将其外观和感觉更改为 Windows：\n\n![Image](img/01053.jpg)\n\n### 13.12\
  \ 应该避免的常见错误\n\n> • **在已选择多个项的列表组件中仅检索第一个被选中的项**。如果列表组件中选择了多个项，`getSelectedValue`\
  \ 方法仅返回第一个被选中的项。同样，`getSelectedIndex` 方法只返回第一个被选中项的索引。你应该使用 `getSelectedValues`\
  \ 或 `getSelectedIndices` 方法。\n\n> • **将 1 作为列表或组合框的起始索引**。列表或组合框的索引从 0 开始，而不是从 1\
  \ 开始。\n\n> • **忘记将列表或文本区域添加到滚动面板中**。`JList` 和 `JTextArea` 组件不会自动显示滚动条。你必须将这些组件添加到滚动面板对象中，它们才能显示滚动条。\n\
  \n> • **使用 `add` 方法而不是构造函数向滚动面板添加组件**。要向滚动面板添加组件，你必须将该组件的引用作为参数传递给 `JScrollPane`\
  \ 构造函数。\n\n> • **将组件添加到滚动面板中，然后将该组件（而不是滚动面板）添加到另一个容器（如面板）中**。如果你将一个组件添加到滚动面板中，然后打算将同一个组件添加到面板或其他容器中，你必须添加滚动面板而不是组件。否则，滚动条将不会出现在组件上。\n\
  \n> • **忘记调用 `setEditable` 方法来给组合框提供文本字段**。默认情况下，组合框是按钮和列表的组合。要让它成为文本字段和列表的组合，你必须调用\
  \ `setEditable` 方法并传递 `true` 作为参数。\n\n> • **尝试打开不支持的类型的图像文件**。目前，`ImageIcon` 对象可以打开存储为\
  \ JPEG、GIF 或 PNG 格式的图像文件。\n\n> • **将图像加载到现有的 `JLabel` 组件并裁剪部分图像**。如果你没有显式设置 `JLabel`\
  \ 组件的首选大小，当你向其加载图像时，它会自动调整自身大小。然而，封装 `JLabel` 的 `JFrame` 不会自动调整大小。你必须调用 `JFrame`\
  \ 对象的 `pack` 方法或 `setPreferredSize` 方法来调整其大小。\n\n> • **为多个组件分配相同的快捷键记忆（mnemonic）**。如果你在窗口中为多个组件分配了相同的快捷键记忆，它只对你分配给的第一个组件有效。\n\
  \n> • **忘记将菜单项添加到 `JMenu` 组件中，将 `JMenu` 组件添加到 `JMenuBar` 组件中**。在创建菜单项后，你必须将其添加到\
  \ `JMenu` 组件中，它才能显示在菜单上。同样，`JMenu` 组件必须被添加到 `JMenuBar` 组件中，才能显示在菜单栏上。\n\n> • **未调用\
  \ `JFrame` 对象的 `setJMenuBar` 方法来放置菜单栏**。要显示菜单栏，你必须调用 `setJMenuBar` 方法并将其作为参数传递。\n\
  \n> • **未在 `ButtonGroup` 对象中对 `JRadioButtonMenuItems` 进行分组**。与普通的单选按钮组件一样，你必须在按钮组对单选按钮菜单项进行分组，以便在它们之间创建互斥关系。\n\
