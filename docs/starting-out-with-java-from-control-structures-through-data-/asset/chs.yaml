  ```\n\n最后一行代码无法编译，因为 `RetailItem` 接口只指定了一个方法：`getRetailPrice`。因此，我们不能使用 `RetailItem`\
  \ 引用变量调用任何其他方法。\n\n![Image](img/00006.jpg)\n\n**提示：** 可以将接口引用变量强制转换为它引用的对象的类型，然后调用该类型成员的方法。然而，这种语法有些笨拙。示例代码中导致编译错误的语句可以重写为：\n\
  \n```java\nSystem.out.println(((CompactDisc)item).getTitle());\n```\n\n![Image](img/00004.jpg)\
