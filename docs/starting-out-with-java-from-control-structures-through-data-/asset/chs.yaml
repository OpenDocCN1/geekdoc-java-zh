  \ = new Rectangle(7.0, 14.0);\n```\n\n一旦该语句执行，`box` 变量将引用一个 `Rectangle` 对象。\n\n\
  在使用未初始化的引用变量时需要小心。回想 第 5 章 中的内容，局部变量在使用之前必须进行初始化或赋一个值。对于本地引用变量也是如此。本地引用变量在使用之前必须引用一个对象，否则将发生编译错误。\n\
  \n## 默认构造函数\n\n当创建一个对象时，该对象的构造函数总是会被调用。但如果我们没有在对象的类中编写构造函数呢？如果你没有在类中编写构造函数，Java\
  \ 在类被编译时会自动提供一个。Java 提供的这个构造函数被称为默认构造函数。默认构造函数不接受参数。它将对象的所有数值字段设置为 `0`，将 `boolean`\
  \ 字段设置为 `false`。如果对象有任何引用变量类型的字段，默认构造函数会将它们设置为特殊值 `null`，这意味着它们不引用任何内容。\n\nJava\
  \ 提供默认构造函数的唯一情况是你没有为类编写自己的构造函数。例如，在本章的开始时，我们开发了 `Rectangle` 类，但没有为它编写构造函数。当我们编译该类时，编译器生成了一个默认构造函数，它将\
  \ `length` 和 `width` 字段都设置为 `0.0`。假设以下代码使用了该版本的类来创建一个 `Rectangle` 对象：\n\n```java\n\
  // 我们没有为 Rectangle 类编写过构造函数。\nRectangle r = new Rectangle(); // 调用默认构造函数\n```\n\n\
  当我们使用该版本的类创建 `Rectangle` 对象时，我们没有向默认构造函数传递任何参数，因为默认构造函数不接受参数。\n\n后来，我们向类中添加了自己的构造函数。我们添加的这个构造函数接受\
  \ `length` 和 `width` 字段的参数。当我们那刻编译该类时，Java 不再提供默认构造函数。我们添加的构造函数变成了该类拥有的唯一构造函数。当我们使用该版本的类创建\
  \ `Rectangle` 对象时，我们必须向构造函数传递长度和宽度参数。使用该版本的类，以下语句会导致错误，因为我们没有为构造函数提供参数：\n\n```java\n\
  // 现在我们为 Rectangle 类编写了自己的构造函数。\nRectangle box = new Rectangle(); // 错误！现在必须传递参数。\n\
  ```\n\n由于我们添加了需要两个参数的自定义构造函数，该类不再拥有默认构造函数。\n\n## 编写自己的无参数构造函数\n\n不接受参数的构造函数被称为无参数构造函数（no-arg\
  \ constructor）。默认构造函数不接受参数，因此被认为是无参数构造函数。此外，你可以编写自己的无参数构造函数。例如，假设我们为 `Rectangle`\
  \ 类编写了以下构造函数：\n\n```java\npublic Rectangle()\n{\n    length = 1.0;\n    width =\
  \ 1.0;\n}\n```\n\n如果在 `Rectangle` 类中使用这个构造函数，我们在创建 `Rectangle` 对象时将不会传递任何参数。以下代码显示了一个示例。在该代码执行后，`Rectangle`\
  \ 对象的 `length` 和 `width` 字段都将被设置为 `1.0`。\n\n```java\n// 现在我们编写了自己的无参数构造函数。\nRectangle\
  \ r = new Rectangle(); // 调用无参数构造函数\n```\n\n## String 类构造函数\n\n`String` 类有一个接受字符串字面量作为参数的构造函数，用于初始化\
