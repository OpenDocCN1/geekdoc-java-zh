  \n## 变量一次只能存储一个值\n\n记住，一个变量在一次只能存储一个值。当你给变量分配一个新值时，新值将取代变量之前的内容。例如，看下面的代码。\n\n```\n\
  int x = 5;\nSystem.out.println(x);\nx = 99;\nSystem.out.println(x);\n```\n\n在这段代码中，变量\
  \ `x` 被初始化为值 5 并显示了其内容。然后，给变量分配了值 99。这个值覆盖了之前存储在 is 里的值 5。代码将产生以下输出：\n\n```\n5\n\
  99\n```\n\n### ![Image](img/00004.jpg) 检查点\n\n> 2.12 下列哪些是非合法的变量名？为什么？\n> `x`\n\
