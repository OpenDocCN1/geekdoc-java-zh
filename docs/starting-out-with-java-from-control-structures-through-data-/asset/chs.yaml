  \ 类有两个静态方法：`milesToKilometers` 和 `kilometersToMiles`。由于它们被声明为 `static`，因此它们属于类，并且可以在不存在任何类实例的情况下被调用。你只需要在方法调用中的点运算符\
  \ `.` 之前编写类名即可。这里是一个例子：\n\n```\nkilometers = Metric.milesToKilometers(10.0);\n```\n\
  \n该语句调用了 `milesToKilometers()` 方法，并将值 `10.0` 作为参数传递。请注意，该方法不是从类的实例调用的，而是直接从 `Metric`\
  \ 类调用的。代码列表 9-4 显示了一个使用 `Metric` 类的程序。图 9-2 显示了与该程序交互的示例。\n\n**代码列表 9-4 (`MetricDemo.java`)**\n\
