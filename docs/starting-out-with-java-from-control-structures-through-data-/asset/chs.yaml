  \ [www.pearsonhighered.com/gaddis](http://www.pearsonhighered.com/gaddis)，用于测试程序。图\
  \ 5-19 显示了执行期间与程序的交互。\n\n我们没有将整个程序写在 `main` 方法中，而是将算法分解为以下方法：\n\n> • `getFileName`—此方法显示一个输入对话框，提示用户输入包含\
  \ 30 天销售额的文件名。该方法返回一个包含用户输入文件名的 `String` 对象的引用。\n\n\n\n\n\n- `getTotalSales`—此方法接受文件名作为参数。打开文件，从文件中读取销售金额，并累加销售金额的总和。该方法返回\
  \ `double` 类型的总和。\n- `displayResults`—此方法接受总销售额和平均日销售额作为参数。它显示一个指示这些值的消息对话框。\n\n\
  **图 5-19** 与 `SalesReport.java` 程序的交互\n\n![Image](img/00315.jpg)\n\n### 调用抛出异常的方法\n\
  \n关于 `SalesReport.java` 程序，还有最后一点需要讨论。注意到 `main` 方法头部（第 14 行）和 `getTotalSales` 方法头部（第\
  \ 65 到 66 行）都包含 `throws IOException` 子句。`getTotalSales` 方法拥有该子句是因为它使用 `Scanner`\
  \ 对象来打开文件。正如你从第 4 章中所了解到的，任何使用 `Scanner` 对象打开文件的方法都应该在其头部包含 `throws IOException`\
  \ 子句。让我们快速回顾一下为什么是这样。\n\n当 `Scanner` 对象在打开文件出现问题时，它会抛出一个名为 `IOException` 的异常。Java\
  \ 要求 (a) 在产生异常的方法中处理该异常，或者 (b) 方法终止并再次抛出该异常。目前，你必须编写方法来再次抛出该异常，因为你在第 12 章之前都不会学习如何处理异常。通过在方法头部编写\
  \ `throws IOException` 子句，你是在告诉编译器该方法没有处理该异常，而是再次抛出它。\n\n这解释了为什么 `getTotalSales`\
  \ 方法有 `throws IOException` 子句，但它并没有解释为什么 `main` 方法也有。毕竟，`main` 并没有使用 `Scanner` 对象执行任何文件操作。`main`\
  \ 必须拥有该子句是因为 `main` 调用了 `getTotalSales` 方法。如果 `getTotalSales` 中的 `Scanner` 对象抛出了\
  \ `IOException`，`getTotalSales` 方法将终止并再次抛出 `IOException`。这意味着 `main` 要么处理该异常，要么终止并再次抛出它。当\
  \ `main` 方法抛出异常时，JVM 会屏幕上显示错误信息。\n\n![Image](img/00006.jpg)\n\n**提示：** 在第 12 章学习如何处理异常之前，在编写抛出异常的程序时只需记住：如果一个方法调用了另一个头部带有\
  \ `throws` 子句的方法，那么调用方法也应该具有相同的 `throws` 子句。\n\n## 5.6 需要避免的常见错误\n\n- **在方法头部末尾加分号**。方法头部永远不会以分号结束。\n\
  - **在方法调用语句中编写修饰符或返回类型**。方法修饰符和返回类型写在方法头部，但绝不在方法调用中。\n- **调用不接受参数的方法时忘记写空括号**。在方法调用语句中必须始终编写括号，即使该方法不接受参数。\n\
  - **忘记向需要参数的方法传递参数**。如果方法具有参数变量，在调用该方法时必须提供参数。\n- **传递了无法自动转换为参数变量数据类型的数据类型的参数**。如果参数的数据类型排名低于参数变量的数据类型，Java\
  \ 将自动执行宽转换。但 Java 不会自动将参数转换为低排名的数据类型。\n- **尝试在声明变量的方法之外的代码中访问参数变量**。参数变量仅在声明它的方法内部可见。\n\
  - **在方法头部未为每个参数变量编写数据类型**。方法头部括号内的每个参数变量声明都必须包含该变量的数据类型。\n- **更改方法参数变量的内容，并期望传入参数的参数也随之改变**。方法参数是按值传递的，这意味着参数的副本被传递到参数变量中。对参数变量的更改对参数没有影响。\n\
  - **当变量的数据类型与返回值的数据类型不兼容时，使用变量来接收方法的返回值**。接收方法返回值的变量必须是与返回值数据类型兼容的数据类型。\n- **在有返回值的方法中未编写\
  \ `return` 语句**。如果方法的返回类型是 `void` 除的任何类型，它应该返回一个值。\n- **在调用其他方法的方法中未编写所需的 `throws`\
  \ 子句**。任何调用头部带有 `throws` 子句的方法都必须处理潜在的异常，或者具有相同的 `throws` 子句。你将在第 12 章学习如何处理异常。\n\
