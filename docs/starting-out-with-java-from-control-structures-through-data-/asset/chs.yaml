  创建一个应用程序，允许你输入购买金额，然后显示销售税金额。使用滑块在 0% 到 10% 之间调整税率。\n\n### 2. 图像查看器\n编写一个应用程序，允许用户查看图像文件。该程序应使用一个文件选择器。当用户选择图像时，它将被加载并显示。\n\
  \n### 3. 宿舍和就餐计划\n某大学有以下宿舍：\n- Allen Hall: 每学期 $1500\n- Pike Hall: 每学期 $1600\n-\
  \ Farthing Hall: 每学期 $1200\n- University Suites: 每学期 $1800\n\n该大学还提供以下用餐计划：\n- 每周\
  \ 7 顿：每学期 $560\n- 每周 14 顿：每学期 $1095\n- 无限制用餐：每学期 $1500\n\n创建一个带有两个组合框的应用程序。一个存储宿舍名称，另一个存储用餐计划。用户应选择一个宿舍和一个用餐计划，应用程序应显示该学期的总费用。\n\
  \n### 4. 滑板设计器\n滑板店销售表 13-2 中列出的滑板产品。此外，滑板店还销售以下杂项产品和服务：\n- 防滑胶：$10\n- 轴承：$30\n\
  - 垫：$2\n- 螺丝套装：$3\n\n创建一个应用程序，允许用户从列表组件或组合框中选择一个板面、一组支架和一组轮子。该程序还应该有一个列表组件，允许用户选择多个杂项产品。程序应显示小计、销售税金额（6\
  \ 比例）和订单总额。\n\n### 5. 购物车系统\n创建一个像书店购物车系统一样的应用程序。在本书的源代码中（位于 `www.pearsonhighered.com/gaddis`），你可以找到一个名为\
  \ `BookPrices.txt.` 的文件。该文件包含了各种书籍的名称和价格，格式如下：\n\n\n\n\n\n> 《按你的方式行》，11.95\n> 《苏格兰史》，14.50\n\
  > 《一天学会微积分》，29.95\n> 《感受压力》，18.50\n\n文件中的每行都包含书名，后面是一个逗号，以及该书的零售价格。当你的应用程序开始执行时，它应该读取文件内容并将书名存储在列表组件中。用户应该能够从列表中选择标题并将其添加到购物车中，购物车只是另一个列表组件。应用程序应该具有按钮或菜单项，允许用户从购物车中移除项目、清空购物车中的所有选择并进行结账。当用户结账时，应用程序应该计算并显示购物车中所有书籍的小计、销售税（小计的\
  \ 6%）以及总额。\n\n## 6. 手机套餐\n\nCell Solutions 是一家手机提供商，它销售以下套餐：\n\n> 每月 300 分钟：每月 $45.00\n\
