  \n## 2.4 原始数据类型\n\n> **概念：有许多不同的数据。变量根据其数据类型进行分类，数据类型决定了变量中可以存储的数据种类。**\n\n计算机程序从现实世界收集数据并以各种方式对其进行处理。有许多不同类型的数据。例如，在数值领域，有整数和分数、负数和正数；以及大到无法命名或小到无法命名的数字。然后是文本信息。例如，名称和地址以字符字符串的形式存储。当你编写程序时，必须确定它可能遇到什么类型的数据。\n\
  \n每个变量都有一个 `data type`，即变量可以包含的数据类型。选择合适的数据类型是非常重要的，因为变量的数据类型决定了变量使用的内存量，以及变量格式化和存储数据的方式。选择与你的程序将处理的数据类型匹配的数据类型至关重要。如果你正在编写一个计算到遥远恒星里数的程序，你需要能够存储非常大数字的变量。如果你正在设计记录微观尺寸的软件，你需要存储非常小且精确数字的变量。如果你正在编写一个必须执行数千次密集计算的程序，你希望变量能够快速处理。变量的数据类型决定了所有这些因素。\n\
  \n表 2-5 显示了所有用于存储数值的 Java 原始数据类型（primitive data types）。\n\n表 2-5 左列列出的单词是你在变量声明中使用的关键字。变量声明采用以下通用格式：\n\
  \n`DataType VariableName;`\n\n**表 2-5** 数值数据的原始数据类型\n\n![Image](img/00050.jpg)\n\
  \n`DataType` 是数据类型的名称，`VariableName` 是变量名。以下是一些变量声明的示例：\n\n```\nbyte inches;\nint\
