  \ `Alice` 的入门书籍，均由 Pearson 的 Addison-Wesley 出版。\n\n**Godfrey Muganda** 是北中央学院计算机科学副教授。他在本科和研究生阶段教授各种课程，包括\
  \ `Linux` 和 `Unix` 编程、`Windows` 和 `.NET` 编程、Web 应用开发、Web 服务、数据结构和算法。他曾获得北中央学院卓越学术成就奖。他的主要研究领域是模糊集与系统。\n\
  \n## 第 1 章：计算机与 Java 简介\n\n### 话题\n\n* 1.1 简介\n* 1.2 为什么要编程？\n* 1.3 计算机系统：硬件与软件\n\
  * 1.4 编程语言\n* 1.5 程序是由什么构成的？\n* 1.6 编程过程\n* 1.7 面向对象编程\n\n## 1.1 简介\n\n本书教授如何使用\
  \ `Java` 进行编程。`Java` 是一种强大的语言，运行在几乎每种计算机上。它可以用于创建大型应用程序或小型程序（称为 Applet，是网站的一部分）。然而，在深入学习\
  \ `Java` 之前，本章将回顾计算机硬件和软件的基础知识，然后概括地介绍计算机编程。\n\n## 1.2 为什么要编程？\n\n**概念：计算机可以执行许多不同的工作，因为它们是可以编程的**。\n\
  \n每种职业都有让工作变得简单的工具。木工使用锤子、锯子和卷尺。机械师使用扳手、螺丝刀和棘轮。电子技术人员使用探针、示波器和仪表表。有些工具是独特的，可以归类为属于单一职业。例如，外科医生拥有某些专门为手术设计的工具。这些工具可能除了外科医生外没有其他人使用。然而，有些工具是在多个职业中使用的。例如，螺丝刀被机械师、木工等许多人使用。\n\
  \n计算机是许多职业共同使用的工具，因此无法简单地分类。它可以执行许多不同的工作，也许是迄今制造的最功能多样的工具。对于会计师来说，计算机平衡账目、分析损益并准备税务报告。对于工人来说，计算机控制制造机器并跟踪生产。对于机械师来说，计算机分析汽车的各种系统并找出难以发现的问题。计算机能够执行如此广泛的任务，是因为它可以被`程序化`。它是一台专门设计用于遵循指令的机器。由于计算机的可编程性，它不属于任何单一职业。计算机的设计是为了执行其程序或`软件`告诉它们做的任何工作。\n\
  \n计算机程序员从事着非常重要的工作。他们创建软件，将计算机变为许多行业的专业工具。没有程序员，计算机用户将没有软件；而没有软件，计算机将无法执行任何操作。\n\
  \n计算机编程既是艺术也是科学。它之所以是一门艺术，是因为程序的每个方面都应该经过仔细设计。以下是任何真实世界的计算机程序必须设计的几个内容：\n\n* 指令的逻辑流\n\
  * 数学步骤\n* 编程语句的布局\n* 屏幕的外观\n* 信息呈现给用户的方式\n* 程序的“用户友好性”\n* 手册、帮助系统和/或其他形式的书面文档\n\n\
  编程也有科学性。因为程序很少在第一次编写就能正常运行，因此需要大量的分析、实验、纠正和重新设计。这要求程序员具有耐心和坚持。编写软件也需要纪律。程序员必须学习如\
  \ `Java` 等特殊语言，因为计算机听不懂英语或其他人类语言。编程语言有必须仔细遵守的严格规则。\n\n编程的艺术性和科学性使得编写计算机软件就像设计汽车一样：汽车和程序都应该是功能完备、高效、强大、易于使用且美观的。\n\
  \n## 1.3 计算机系统：硬件与软件\n\n**概念：所有计算机系统由相似的硬件设备和软件组件组成**。\n\n#### 硬件\n\n`硬件`指的是构成计算机的物理组件。我们通常认为的计算机不是单一设备，而是一个设备系统。就像交响乐队中的乐器一样，每个设备都扮演着自己的角色。一个典型的计算机系统由以下主要部分组成：\n\
  \n* 中央处理单元 (CPU)\n* 主内存\n* 次级存储设备\n* 输入设备\n* 输出设备\n\n计算机系统的结构如图 1-1 所示。\n\n**图 1-1**\
  \ 计算机系统的结构\n\n\n让我们仔细观察这些设备中的每一个。\n\n##### **CPU**\n\n\n\n\n\n计算机的核心是它的`central\
  \ processing unit`，即`CPU`。`CPU`的工作是取取指令、执行指令并产生某些结果数据。在内部，中央处理单元由两部分组成：`control\
  \ unit`和`arithmetic and logic unit (ALU)`。`control unit`协调计算机的所有操作。它决定从哪里获取下一条指令，并用控制信号调节计算机的其他主要组件。`arithmetic\
  \ and logic unit`正如其名，旨在执行数学运算。`CPU`的结构如图图 1-2 所示。\n\n**图 1-2 CPU 的结构**\n\n\n程序是存储在计算机内存中的一系列指令。当计算机运行程序时，`CPU`参与到一个正式称为`fetch/decode/execute\
  \ cycle`（取指/解码/执行周期）的过程中。`fetch/decode/execute cycle`的步骤如下：\n\n> *提取 (Fetch)* `CPU`的控制单元从主内存中提取程序指令序列中的下一条指令。\n\
  \n> *解码 (Decode)* 指令以数字的形式编码。`control unit`解码该指令并产生电子信号。\n\n> *执行 (Execute)* 信号被路由到计算机的相应组件（如`ALU`、磁盘驱动器或其他设备）。信号导致该组件执行操作。\n\
  \n只要有指令需要执行，这些步骤就会重复进行。\n\n### # 主内存\n\n计算机主内存通常被称为`random-access memory`或`RAM`，它是一种存储信息的设备。具体来说，`RAM`存储了运行中的程序的指令序列以及这些程序正在使用的数据。\n\
  \n内存被分为若干包含等量数据的区域。每个区域由八个“开关”组成，这些开关可以是开启或关闭状态。开启状态的开关通常代表数字 1，而关闭状态的开关通常代表数字 0。计算机通过将内存位置中的开关设置为代表字符或数字的模式来存储数据。这些开关中的每一个被称为一个`bit`，代表`binary\
  \ digit`（二进制位）。每个内存区域是八个位的集合，被称为`byte`（字节）。每个字节都被分配一个唯一的数字称为`address`（地址）。地址从低到高排序。字节通过地址来识别，就像邮政箱通过地址来识别一样。图\
  \ 1-3 显示了一系列字节及其地址。在插图中，示例数据存储在内存中。数字 149 存储在地址为 16 的字节中，数字 72 存储在地址为 23 的字节中。\n\
  \n`RAM`通常是易性内存，仅用于临时存储。当计算机关闭时，`RAM`的内容会被清除。\n\n**图 1-3** 内存字节及其地址\n\n\n### # 辅助存储\n\
  \n辅助存储是一种可以长时间保存数据的内存——即使计算机没有电源也是如此。经常使用的程序存储在辅助内存中，并在需要时加载到主内存中。重要数据如文字处理文档、工资数据和库存数字也会保存到辅助存储中。\n\
  \n最常见的辅助存储设备是`disk drive`。`disk drive`通过将数据磁性编码到圆形磁盘上来存储数据。硬盘（`Hard drives`是最常见的磁盘驱动器类型，能够存储大量数据并快速访问数据。大多数计算机的机箱内部安装了硬盘。也有外部硬盘，它们连接到计算机的通信端口之一。外部硬盘可用于创建重要数据的备份副本，或将数据移动到另一台计算机。\n\
  \n除了外部硬盘，还创建了许多类型的设备用于复制数据将其移动到其他计算机。多年来，软盘驱动器非常流行。`floppy disk drive`将数据记录在可以从驱动器中取出的微型软盘上。然而，软盘有许多缺点。它们存储的数据量小，访问数据缓慢，而且有时不可靠。\n\
  \n### # 输入设备\n\n输入是计算机从外部世界收集任何数据。收集数据并发送到计算机的设备被称为`input device`。常见的输入设备有键盘、鼠标、扫描仪和数字相机。\n\
  \n### # 输出设备\n\n输出是计算机向外部世界发送任何数据。可能是销售报告、名单或图形图像。数据被发送到输出设备，由设备进行格式化并呈现。常见的输出设备有显示器和打印机。\n\
  \n### # 软件\n\n如前所述，指的是运行在计算机上的程序。软件分为两大类：操作系统和应用程序。操作系统是一组管理计算机硬件设备并控制其程序的程序。大多数现代操作系统都是多任务的，这意味着它们能够同时运行多个程序。通过称为分共享技术，多任务系统在所有执行中的程序之间分配硬件资源和`CPU`的注意力。UNIX、Linux、Mac\
  \ OS X 和 Windows 都是多任务操作系统。\n\n应用程序指的是使计算机对用户有用的程序。这些程序解决特定问题或执行满足用户需求的通用操作。文字处理、电子表格和数据库软件包都是应用程序的示例。\n\
  \n\n\n\n\n计算机的设计是为了遵循指令。计算机程序是一组指令，能够使计算机解决问题或执行任务。例如，假设我们想让计算机计算某人的总工资。以下是计算机执行此任务时应该执行的步骤列表。\n\
  \n1. 在屏幕上显示消息：“你工作了多少小时？”\n2. 允许用户输入工作的小时。\n3. 一旦用户输入数字，就将其存储在内存中。\n4. 在屏幕上显示消息：“你的每小时工资是多少？”\n\
  5. 允许用户输入时薪率。\n6. 一旦用户输入数字，就将其存储在内存中。\n7. 一旦工作小时数和时薪率都输入完成，将这两个数字相乘并将结果存储在内存中。\n\
  8. 在屏幕上显示收入金额的消息。该消息必须包含第 7 步执行的计算结果。\n\n这些指令合称为`算法`。算法是执行任务或解决问题的一系列定义良好的步骤。注意，这些步骤是按顺序排列的。第\
  \ 1 步应该在第 2 步之前执行，以此此类推。按顺序执行这些指令至关重要。\n\n虽然你我可能轻松理解工资计算算法中的指令，但它还没有准备好在计算机上执行。计算机的\
  \ CPU 只能处理用`机器语言`编写的指令。如果你查看一个机器语言程序，你会看到一串二进制数字（仅由 1 和 0 组成的数字）。二进制数字形成了机器语言指令，CPU\
  \ 将其解释为命令。这里是一个机器语言指令的示例：\n\n```\n1011010000000101\n```\n\n正如你可以想象的，用机器语言编码算法的过程是非常枯燥且困难。此外，每种不同类型的\
  \ CPU 都有自己的机器语言。如果你为计算机 A 编写了一个机器语言程序，然后想在具有不同类型 CPU 的计算机 B 上运行，你就必须用计算机 B 的机器语言重写该程序。\n\
  \n编程语言使用单词而不是数字，发明是为了减轻编程任务。可以使用编程语言编写程序，这种语言比机器语言更容易理解，然后将其翻译成机器语言。程序员使用软件来执行这种翻译。已经创建了许多编程语言。表\
  \ 1-1 列出了其中一些著名的语言。\n\n**表 1-1** 编程语言\n\n\n### Java 的历史\n\n1991 年，太阳微系统公司（Sun Microsystems）成立了一个团队，预测近期可能出现的重要技术趋势。该团队被称为“绿色小组”（Green\
  \ Team），他们得出计算机与家用电器融合。他们的第一个项目是开发一种名为 `7 (读作 star seven)` 的手持设备，它可以控制各种家庭娱乐设备。为了让该设备工作，它必须使用一种可以被其控制的所有设备处理的编程语言。这带来了一个问题，因为不同品牌的消费设备使用不同的处理器，每种处理器都有自己的机器语言。\n\
  \n由于不存在这样的通用语言，团队首席工程师 James Gosling 创建了一种。用这种最初名为`Oak` 的语言编写的程序并没有翻译成特定处理器的机器语言，而是翻译成一种名为`byte\
  \ code`（字节码）的中间语言。然后另一个程序会将字节码翻译成特定消费设备中的处理器可以执行的机器语言。\n\n遗憾的是，绿色小组开发的技术超前了。没有找到客户，主要是因为计算机控制的消费电器行业刚刚起步。但他们并没有放弃心血去转向其他项目，而是看到了另一个机会：互联网。互联网是像\
  \ `Oak` 这样的通用编程语言的完美环境。它由连接在单个网络中的许多不同计算机平台组成。\n\n为了证明他们更名为 Java 的语言有效性，团队用它开发了一个\
  \ Web 浏览器。该浏览器名为 `HotJava`，能够下载并运行被称为 `applets` 的小型 Java 程序。这让浏览器了显示动画和与用户交互的能力。`HotJava`\
  \ 在 1995 年的 SunWorld 大会上向惊叹的观众进行了演示。随后宣布，Netscape 将将 Java 技术整合到其 Navigator 浏览器中。其他互联网公司迅速跟进，增加了\
  \ Java 语言的接受度和影响。今天，Java 不仅用于开发互联网 applet，还广泛用于开发独立应用程序。\n\n### Java 应用程序和 Applet\n\
  \n用 Java 可以创建两种程序：应用程序（applications）和 applet。应用程序是运行在你计算机上的独立程序。你可能已经用过几个应用程序，例如文字处理程序、电子表格、数据库管理器和图形程序。虽然可以使用\
  \ Java 编写这些类型的应用程序，但 `C`、`C++` 和 `Visual Basic` 等语言也在使用。\n\n在上一节中，你学到了 Java 也可以用于创建\
  \ applet。“applet”一词指的是小型应用程序，就像“piglet”（小猪）指的是小猪一样。与应用程序不同，applet 设计为从 Web 服务器通过互联网传输，然后在\
  \ Web 浏览器中执行。applet 是重要的，因为它们可以显著地扩展 Web 页面的功能。\n\nWeb 页面通常用 `HTML` 编写。然而，`HTML`\
  \ 是有限的，因为它仅仅描述 Web 页的内容和布局。`HTML` 没有复杂的能力，例如执行数学计算和与用户交互。Web 设计师可以编写一个 Java applet\
  \ 来执行通常由应用程序执行的操作，并将其嵌入网站中。当有人访问该网站时，applet 会被下载到浏览器并执行。\n\n#### 安全\n\n每当内容从 Web\
  \ 服务器下载到访问者的计算机时，安全性都是一个重要的考虑因素。由于 Java 是一种功能齐全的编程语言，起初你可能会对任何向你的计算机传输 applet 的网站产生存怀疑。毕竟，Java\
  \ applet 不会做一些有害的事情，如删除硬盘内容或向另一台计算机传输隐私信息吗？幸运的是，答案是否定的。Web 浏览器在你计算机内存中的一个安全环境中运行\
  \ Java applet，不允许它们访问该环境之外的资源（如磁盘驱动器）。\n\n## 1.5 程序由什么组成？\n\n> 概念：所有编程语言都有某些共同的元素。\n\
  \n#### 语言元素\n\n所有编程语言都有一些共同点。表 1-2 列出了你在几乎每种语言中都能找到共同元素。\n\n**表 1-2** 编程语言的共同元素\n\
  \n![Image](img/00015.jpg)\n\n让我们看一个 Java 程序示例，并识别这些元素的每一个实例。代码列表 1-1 显示了每行都带有编号的代码列表。\n\
  ![Image](img/00005.jpg)\n\n* *\n\n**注意：** 行号不是程序的一部分。包含它们是为了帮助指出程序的特定部分。\n\n* *\n\
  \n\n\n\n\n# 代码列表 1-1 `Payroll.java`\n\n![Image](img/00016.jpg)\n\n### 关键字（保留字）\n\
  \n第 1 行出现了两个 Java 关键字：`public` 和 `class`。在第 3 行中，`public`、`static` 和 `void` 都是关键字。第\
  \ 5 行中的 `int` 和第 6 行中的 `double` 也是关键字。这些单词始终以小写形式编写，每个在 Java 中都有特殊的含义，并且只能用于它们的预期用途。正如你所看到的，程序员允许为程序中的某些事物创建自己的名称。然而，关键字是保留的，不能用于其指定用途之外的任何地方。学习编程语言的一部分就是学习常用的关键字、它们的含义以及如何使用它们。\n\
  \n表 1-3 显示了 Java 关键字的列表。\n\n**表 1-3** Java 关键字\n\n![Image](img/00017.jpg)\n\n###\
  \ 程序员定义的名称\n\n程序第 5、6、8 和 9 行中出现的 `hours`、`payRate` 和 `grossPay` 单词是程序员定义的名称。它们不是\
  \ Java 语言的一部分，而是由程序员创建的名称。在这个程序中，这些是变量的名称。正如你在本章后面将学到的，变量是可能存储数据的内存位置的名称。\n\n###\
  \ 运算符\n\n第 8 行出现了以下内容：\n\n```java\ngrossPay = hours * payRate;\n```\n\n`=` 和 `*`\
  \ 符号都是运算符。它们对数据项（称为操作数）执行操作。`*` 运算符将它的两个操作数相乘，在这个例中，这两个操作数是变量 `hours` 和 `payRate`。`=`\
  \ 符号被称为赋值运算符。它获取右侧表达式的值并将其存储在左侧出现的变量中。在这个例中，`=`运算符将 `hours` 变量乘以 `payRate` 变量的结果存储在\
  \ `grossPay` 变量中。换句话说，语句的意思是：“将 `hours` 乘以 `payRate` 的值赋值给变量 `grossPay`。”\n\n###\
  \ 标点符号\n\n注意第 5、6、8 和 9 行都以分号结尾。Java 中的分号类似于英语中的句号：它标记了一个完整句子（或在编程术语中称为“语句”）的结束。然而，Java\
  \ 程序中并不是每一行末尾都有分号。有规则规定了哪里需要分号，哪里不需要。学习 Java 的一部分就是学习在何处放置分号和其他标点符号。\n\n#### 行和语句\n\
  \n通常，程序的内容是按“行”和“语句”来考虑的。*行*（line）就是字面意思——即程序正文中显示的单行。代码列表 1-1 显示了其每一行并带有编号。大部分\
  \ 代码列表 1-1 的行都经过编号。语句（statement）是执行某些操作的完整指令。\n\n```java\nSystem.out.println(\"\
  Your message is \" + message);\n```\n\n#### 变量\n\nJava 存储数据最基本的方式是通过变量。你可以将变量理解为可能存储数据的命名位置。在程序运行时，`variable`\
  \ 中存储的值可能会改变。\n\n### 编译器和 Java 虚拟机\n\n编写 Java 程序时，必须将其输入计算机并保存为文件。此任务使用*文本编辑器*（text\
  \ editor），它类似于文字处理程序。程序员编写的 Java 语句称为*源代码*（source code），它们保存的文件称为源文件。\n\n程序员将源代码保存到文件后，运行编译器。*编译器*（compiler）是将源代码翻译成可执行形式的程序。在翻译过程中，编译器会发现程序可能存在的任何语法错误。*语法错误*是程序员违反语言规则所犯的错误。在编译器翻译源代码之前必须修正这些错误。一旦程序没有语法错误，编译器就会创建另一个存储翻译指令的文件。\n\
  \n大多数编程语言编译器直接将源代码翻译成包含机器语言的文件。这些文件被称为*可执行文件*，因为它们可以直接由 CPU 执行。然而，Java 编译器将 Java\
  \ 源文件翻译成包含字节码（byte code）的文件。字节码指令不是机器语言，因此无法由 CPU 直接执行。相反，它们由 Java 虚拟机执行。*Java 虚拟机*（JVM）是一个读取\
  \ Java 字节码并在读取时执行它们的程序。因此，JVM 通常被称为解释器，而 Java 通常被视为解释型语言。\n\n\n\n\n对于大多数其他编程语言，可移植性是通过为该语言运行的每种类型的计算机创建一个编译器来实现的。例如，为了让\
  \ C++ 语言支持 Windows、Linux 和 Mac 计算机，必须为这些环境中的每一个都创建一个独立的 `C++` 编译器。编译器是非常复杂的程序，比解释器更难开发。由于这个原因，已针对许多类型的计算机开发了\
  \ `Java Virtual Machine`（Java 虚拟机）。\n\n**图 1-5 程序开发流程**\n\n![Image](img/00019.jpg)\n\
  \n**图 1-6** Java 字节码可以在任何带有 Java 虚拟机的计算机上运行\n\n![Image](img/00020.jpg)\n\n## Java\
  \ 软件版本\n\n你用于创建 Java 程序的软件被称为 `JDK`（Java 开发工具包）或 `SDK`（软件开发工具包）。Sun Microsystems\
  \ 提供了以下不同版本的 `JDK`：\n\n> • `Java SE`—Java 标准版提供了编写 Java 应用程序和小节程序（applets）所需的所有基本软件工具。\n\
  \n> • `Java EE`—Java 企业版提供了创建大型业务应用程序的工具，这些程序使用服务器并通过 Web 提供服务。\n\n> • `Java ME`—Java\
  \ 微型版为手机、传真机和家用电器等消费产品提供了一个小型、高度优化的运行时环境。\n\n这些版本的 Java 可以从 Sun Microsystems 的下载：\n\
  \n[`java.sun.com`](http://java.sun.com)\n\n## 编译和运行 Java 程序\n\n编译 Java 程序是一个简单的过程。要使用\
  \ Sun `JDK`，请进入你操作系统的命令提示符。\n\n![Image](img/00006.jpg)\n\n**提示：** 在 Windows 中，点击“开始”，进入“所有程序”，然后进入“杂工具”。点击“杂工具”菜单上的`命令提示符`。一个命令提示符窗口将会打开。\n\
  \n![Image](img/00009.jpg)\n\n### 编译和运行 Java 程序\n\n在操作系统的命令提示符处，确保你处于要编译的 Java 程序所在的相同目录或文件夹中。然后，使用如下格式的\
  \ `javac` 命令：\n\n```\njavac Filename\n```\n\n`Filename` 是包含 Java 源代码的文件名。如前所述，该文件具有\
  \ `.java` 扩展名。例如，如果你想编译 `Payroll.java` 文件，可以执行以下命令：\n\n```\njavac Payroll.java\n\
  ```\n\n此命令运行编译器。如果文件包含任何语法错误，你将看到一条或多个错误信息，编译器将不会将文件转换为字节码。当发生这种情况时，你必须用文本编辑器打开源文件并修复错误。然后你可以再次运行编译器。如果文件没有语法错误，编译器将将其翻译为字节码。字节码存储在扩展名为\
  \ `.class` 的文件中，因此 `Payroll.java` 文件的字节码将存储在 `Payroll.class` 中，它将位于源文件相同的目录或文件夹中。\n\
  \n要运行 Java 程序，你使用如下格式的 `java` 命令：\n\n```\njava ClassFilename\n```\n\n`ClassFilename`\
  \ 是你想要执行的 `.class` 文件名。然而，你不需要输入 `.class` 扩展名。例如，要运行存储在 `Payroll.class` 文件中的程序，你应该输入以下命令：\n\
  \n```\njava Payroll\n```\n\n此命令运行 Java 解释器（`JVM`）并执行程序。\n\n### 集成开发环境\n\n除了命令提示符程序外，还有几个\
  \ Java 集成开发环境（IDE）。这些环境由文本编辑器、编译器、调试器和其他实用程序集成到一个软件包中，并拥有一套菜单。只需点击一次按钮或从菜单中选择一个项目项，即可编译并执行程序。图\
  \ 1-7\n\n### 使用 IDE\n\n**图 1-7** 集成开发环境 (IDE)\n\n![Image](img/00021.jpg)\n\n## 检查点\n\
  \n![Image](img/00004.jpg)\n\n## 1.6 编程过程\n\n**概念：编程过程由设计、创建、测试和调试组成**。\n\n现在你已经了解了什么是程序，是时候考虑一下过程了。通常，当给没有经验的学生分配编程作业时，他们往往很难着手。如果你发现自己陷入了这种困境，以下步骤可能会有所帮助：\n\
  \n> 1. 明确定义程序要做什么\n> 2. 可视化程序在计算机上运行的过程\n> 3. 使用设计工具创建程序的模型\n> 4. 检查模型是否存在逻辑错误\n\
  > 5. 输入代码并编译\n> 6. 纠正编译期间发现任何错误\n> 7. 使用测试数据运行程序\n> 8. 在运行程序时纠正任何运行时错误\n> 9. 验证程序的结果。\n\
  \n这些步骤强调了规划的重要性。就像粉房子有好方法和坏方法一样，创建程序也有好方法和坏方法。以本章之前介绍的薪资计算算法作为示例，让我们详细地查看每一个步骤。\n\
  \n#### 明确定义程序要做什么\n\n这一步通常要求你识别程序的目的、要输入的数据、要进行的处理以及期望的输出。让我们检查薪资计算算法的每项要求。\n\n\
  > *目的*：计算用户的总工资。\n> *输入*：工作小时数、时薪率。\n> *处理*：将工作小时数乘以时薪率。结果为用户的总工资。\n> *输出*：显示一条指示用户总工资的消息。\n\
  \n#### 可视化程序在计算机上运行的过程\n\n在计算机上创建程序之前，你应该先在脑海中创建它。尝试想象程序运行时运行时计算机屏幕看起来像什么样。如果有帮助的话，可以在程序的各个点画出屏幕的图片，并带有示例输入和输出。例如，图\
  \ 1-8\n\n\n\n获取薪资数据。\n\n计算总工资。\n\n显示总工资。\n\n虽然这段伪代码提供了程序的概览，但它并没有揭示程序的所有细节。下面是更详细的伪代码版本：\n\
  \n显示“你工作了多少小时？”\n\n输入小时数。\n\n显示“你的每小时工资是多少？”\n\n输入费率。\n\n将小时数乘以费率的值存储在 `pay` 变量中。\n\
  \n显示 `pay` 变量中的值。\n\n注意，伪代码使用的语句看起来更像命令，而不是第 1.4 节中描述算法的英语语句。伪代码甚至为变量命名了名称，并描述了数学操作。\n\
  \n## 4. 检查模型是否存在逻辑错误\n\n逻辑错误是导致程序产生错误结果的错误。一旦建立了程序模型，就应该检查是否存在这些错误。例如，如果使用了伪代码，程序员应该对其进行跟踪执行，检查每一步的逻辑。如果发现错误，可以在尝试下一步之前对模型进行修正。\n\
  \n## 5. 输入代码并编译\n\n一旦创建、检查并修正了程序模型，程序员就可以在计算机上编写源代码了。程序员将源代码保存到文件中，并开始编译过程。在这一步中，编译器将找到程序中可能存在的任何语法错误。\n\
  \n## 6. 修正编译过程中发现的错误。根据需要重复步骤 5 和 6\n\n如果编译器报告了任何错误，必须对其进行修正。必须重复步骤 5 和 6，直到程序没有编译时错误。\n\
  \n## 7. 使用测试数据输入运行程序\n\n一旦生成了可执行文件，程序就可以进行运行时错误测试了。运行时错误是在程序运行期间发生的错误。这些通常是逻辑错误，例如数学错误。\n\
  \n运行时错误测试需要使用示例数据或示例输入来执行程序。示例数据应当能够预测出正确的输出。如果程序没有产生正确的输出，则程序中存在逻辑错误。\n\n## 8.\
  \ 修正运行程序时发现的运行时错误。根据需要重复步骤 5 到 8\n\n当程序中发现运行时错误时，必须对其进行修正。你必须识别错误发生的步骤并确定原因。如果错误由于逻辑不正确导致的（例如数学公式表述不当），你必须修正涉及该逻辑的语句。如果错误是因为对程序要求的理解不完全，那么你必须重新表述程序目的并修改程序模型和源代码。然后必须保存程序、重新编译并重新测试。这意味着必须重复步骤\
  \ 5 到 8，直到程序能够可靠地产生满意的结果。\n\n## 9. 验证程序的结果\n\n当你认为已经修正了所有运行时错误时，输入测试数据并判断程序是否解决了原始问题。\n\
  \n### 软件工程\n\n软件工程领域涵盖了制作软件的全过程。它包括设计、编写、测试、调试、文档、修改和维护复杂的软件开发项目。与传统工程师一样，软件工程师在他们的工作中使用许多工具。以下是一些示例：\n\
  \n* 程序规范\n* 屏幕输出图\n* 表示程序组件和数据流的图\n* 伪代码\n* 预期输入和期望输出的示例\n* 为测试程序设计的特殊软件\n\n大多数商业软件应用程序都是大型且复杂的。通常是由一个程序员团队而不是个人开发的。对程序需求进行彻底分析，并将其拆分为由个别团队或团队内个人处理的子任务是非常重要的。\n\
