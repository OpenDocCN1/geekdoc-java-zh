  > b. 可解情况\n> c. 已知情况\n> d. 迭代情况\n> 3\\. 这是问题中通过递归解决的部分。\n> a. 基准情况\n> b. 迭代情况\n\
  > c. 未知情况\n> d. 递归情况\n> 4\\. 这是方法显式地调用自身的情况。\n> a. 显式递归\n> b. 模式递归\n> c. 直接递归\n\
  > d. 间接递归\n> 5\\. 这是方法 A 调用方法 B，方法 B 又调用方法 A 的情况。\n> a. 隐式递归\n> b. 模式递归\n> c. 直接递归\n\
  > d. 间接递归\n> 6\\. 这指的是方法被调用时，JVM 内部采取的操作。\n> a. 开销 (overhead)\n> b. 设置 (set up)\n\
  > c. 清理 (clean up)\n> d. 同步 (synchronization)\n> 7\\. **正确或错误**：迭代算法的运行速度通常比同等的递归算法快。\n\
  > 8\\. **正确或错误**：某些问题只能通过递归解决。\n> 9\\. **正确或错误**：并不是所有的递归算法都必须有基准情况。\n> 10\\. **正确或错误**：在基准情况下，递归方法使用原问题的更小规模版本来调用自身。\n\
