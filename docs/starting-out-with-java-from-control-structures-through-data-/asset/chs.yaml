  \ the numbers to the file…`\n\n`Done.`\n\n***\n\n### 从二进制文件中读取数据\n\n为了打开二进制文件进行输入，你使用以下类：\n\
  \n![Image](img/00953.jpg)\n\n为了打开二进制文件进行输入，你需要在 `FileInputStream` 对象周围包装一个 `DataInputStream`\
