  \ exceptions` 是继承自 `Error` 类或 `RuntimeException` 类的异常。请记住，继承自 `Error` 的异常在发生严重错误时（例如内存溢出）会被抛出。你不应该处理这些异常，因为导致这些异常的情况在程序中很难被处理。同样请记住，`RuntimeException`\
  \ 是由编程错误（例如数组下标越界）引起的异常的父类。这些异常最好也不要处理，因为它们可以通过编写良好的代码来避免。因此，你不应该处理未检查异常。\n\n所有剩余异常（即那些*不*继承自\
  \ `Error` 或 `RuntimeException` 的异常）都是 `checked exceptions`（受检异常）。这些是你应该在程序中处理的异常。如果一个方法中的代码可能抛出受检异常，那么该方法必须满足以下要求之一：\n\
