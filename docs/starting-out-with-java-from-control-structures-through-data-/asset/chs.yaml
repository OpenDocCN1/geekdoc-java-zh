  \ 14.3 使用 Swing 创建 Applet\n\n> **概念：你通过扩展 `JApplet` 类来创建一个 applet，就像你通过扩展 `JFrame`\
  \ 类来创建一个 GUI 应用程序一样。**\n\n到目前，你已经掌握了创建 applet 需要的所有知识。这是因为 applet 与 GUI 应用程序非常相似。你可以认为\
  \ applet 是在浏览器控制下运行的 GUI 应用程序。应用程序与 applet 代码之间的差异总结如下：\n\n- GUI 应用程序继承自 `JFrame`。applet\
  \ 继承自 `JApplet`。`JApplet` 类是 `javax.swing` 包的一部分。\n- GUI 应用程序有一个构造函数，用于创建其他组件并设置\
  \ GUI。applet 通常没有构造函数。相反，它有一个名为 `init` 方法执行与构造函数相同的操作。`init` 方法不接受参数且返回类型为 `void`。\n\
  - 以下方法在 GUI 应用程序构造函数中常用但不适用于 applet，因为 applet 没有窗口：\n  - `setTitle`\n  - `setSize`\n\
  \  - `setDefaultCloseOperation`\n  - `pack`\n  - `setVisible`\n\n* *\n\n![Image](img/00009.jpg)\n\
  \n#### 创建 Applet\n\n* *\n\n> • 不需要静态 `main` 方法来创建 applet 实例。浏览器会自动创建类的实例。\n\n让我们来看一个简单的\
  \ applet。代码列表 14-6 显示了一个显示标签的 applet。\n\n**代码列表 14-6 (`SimpleApplet.java`)**\n\n\
  ![Image](img/01072.jpg)\n\n这段代码与普通的 GUI 应用程序非常相似。尽管该类扩展的是 `JApplet` 而不是 `JFrame`，但你仍然仍然向内容面板添加组件并使用布局管理器。\n\
  \n#### 运行 Applet\n\n运行 applet 的过程与运行应用程序不同。运行 applet 需要创建一个带有 `applet` 标签的 HTML\
  \ 文档，该标签具有以下通用格式：\n\n```\n   <applet code=\"Filename.class\" width=\"Wide\" height=\"\
  High\"></applet>\n```\n\n在通用格式中，`Filename.class` 是 applet 类文件名。这是包含编译后的字节码的文件。注意你不需要指定包含\
  \ Java 源代码的 java 文件。你可以可选地指定文件的路径。如果只指定文件名，则假设该文件与 HTML 文档在同一目录中。`Wide` 是 applet\
  \ 的像素宽度，`High` 是 applet 的像素高度。当浏览器处理 `applet` 标签时，它会加载指定的字节码并在由 `Wide` 和 `High`\
  \ 值指定的区域内执行它。\n\n\n\n\n\n代码列表 14-7 所示的 HTML 文档使用 `applet` 标签来加载 代码列表 14-6 所示的 applet。该文档指定\
  \ applet 应该在一个宽 200 像素、高 50 像素的区域内显示。图 14-12 显示了该文档在 Web 浏览器中显示的样子。\n\n### 代码列表\
  \ 14-7 (`SimpleApplet.html`)\n\n![Image](img/01073.jpg)\n\n**图 14-12** 由 `SimpleApplet.html`\
  \ 生成的网页\n\n![Image](img/01074.jpg)\n\n![Image](img/00005.jpg)\n\n***\n\n**注意：**\
  \ 当你向浏览器加载一个使用 applet 的网页时，你很可能会收到安全警告。例如，图 14-13](#dummy_split_021.html_filepos2472250)\
