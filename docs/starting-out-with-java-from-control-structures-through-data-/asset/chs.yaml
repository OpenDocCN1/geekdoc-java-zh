  \ 7-26** `MetricConverterWindow` 类显示的窗口和对话框\n\n![Image](img/00467.jpg)\n\n### 在代码中判断单选按钮是否被选中\n\
  \n在许多应用程序中，你可能只想知道单选按钮是否被选中。`JRadioButton` 类的 `isSelected()` 方法返回一个 `boolean` 值，指示单选按钮是否被选中。如果单选按钮被选中，该方法返回\
  \ `true`。否则，返回 `false`。在下面的代码中，`radio` 引用一个单选按钮。`if` 语句调用 `isSelected()` 方法来确定单选按钮是否被选中。\n\
  \n```java\nif (radio.isSelected())\n{\n    // Code here executes if the radio\n\
  \    // button is selected.\n}\n```\n\n### 在代码中选择单选按钮\n\n也可以通过 `JRadioButton` 类的\
  \ `doClick()` 方法在代码中选择单选按钮。当调用该方法时，单选按钮被选中的状态就像用户点击了它一样。结果是会产生一个动作事件。在接下来的语句中， `radio`\
  \ 变量引用一个单选按钮。当此语句执行时，该单选按钮将被选中。\n\n```java\nradio.doClick();\n```\n\n### 复选框\n\n\
  复选框显示为一个带有其旁侧标签的小方框。图 7-27 所示的窗口有三个复选框。\n\n**图 7-27** 复选框\n\n![Image](img/00468.jpg)\n\
  \n与单选按钮一样，复选框可以在运行时选中或取消选中。当复选框被选中时，框内会出现一个一个小勾号。虽然复选框通常成组显示，但它们通常不会像单选按钮那样在 `ButtonGroup`\
  \ 中分组。这是因为复选框通常不用于进行互斥选择。相反，允许用户选择一组中显示的任何一个或所有复选框。\n\n你使用 `JCheckBox` 类创建一个复选框。以下是两个\
  \ `JCheckBox` 构造函数的通用格式：\n\n```java\nJCheckBox(String text)\nJCheckBox(String text,\
  \ boolean selected)\n```\n\n### 响应复选框事件\n\n当 `JCheckBox` 对象被选中或取消选中时，它会产生一个项目事件（item\
  \ event）。你以类似于 `JButton` 和 `JRadioButton` 对象产生的动作事件的方式来处理项目事件。首先，你编写一个项目监听器类，它必须满足以下条件：\n\
  \n- 它必须实现 `ItemListener` 接口。\n- 它必须有一个名为 `itemStateChanged` 的方法，头部如下：\n\n```java\n\
  public void itemStateChanged(ItemEvent e)\n```\n\n![Image](img/00005.jpg)\n\n**注意：**\
  \ 在实现 `ItemListener` 时，你的代码必须包含以下语句：\n\n```java\nimport java.awt.event.*;\n```\n\
  \n一旦你写了项目监听器，你就创建一个该类的对象，然后将监听器对象注册到 `JCheckBox` 组件上。当 `JCheckBox` 组件产生事件时，它会自动执行项目监听器的\
  \ `itemStateChanged` 方法，并将事件对象作为参数传递。\n\n### 在代码中判断复选框是否被选中\n\n与 `JRadioButton`\
  \ 一样，你使用 `isSelected()` 方法来确定 `JCheckBox` 是否被选中。该方法返回一个 `boolean` 值。如果复选框被选中，该方法返回\
  \ `true`。否则，返回 `false`。在下面的代码中，`checkBox` 引用一个 `JCheckBox` 组件。\n\n```java\nif (checkBox.isSelected())\n\
  {\n    // Code here executes if the check\n    // box is selected.\n}\n```\n\n`ColorCheckBoxWindow`\
