  \n***\n\n## 6.8 需要避免的常见错误\n\n> • **在方法头末尾加分号**。分号从不出现在方法头的末尾。\n> • **声明一个引用对象的变量，但忘记使用\
  \ `new` 关键字来创建对象**。声明引用对象的变量并不会创建对象。你必须使用 `new` 关键字来创建对象。\n> • **忘记在类名后写上必须出现的括号（类名出现在\
  \ `new` 关键字之后）**。类名出现在 `new` 关键字之后，且类名之后跟有一组括号。即使不向构造函数传递任何参数，你也必须写括号。\n> • **当构造函数需要参数时忘记提供参数**。使用带有参数变量的构造函数时，你必须为它们提供参数。\n\
  > • **在方法调用的点号前后插入空格**。在方法调用中，点号（点操作符）之前或之后不能出现空格。\n> • **尝试通过赋予方法不同的返回类型来重载方法**。重载的方法必须具有唯一的参数列表。\n\
  > • **对于你想要在不传递参数的情况下创建实例的类，忘记编写一个无参数构造函数**。如果你写了一个接受参数的构造函数，那么如果你想在不传递参数的情况下创建该类的实例，必须也为该类写一个无参数构造函数。\n\
  > • **在方法中无意中声明了一个与同类字段同名的局部变量**。当方法的局部变量与同类中的字段同名时，局部变量的名字会遮蔽字段的名字。\n\n***\n\n\
