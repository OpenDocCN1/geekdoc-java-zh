  \ 层次结构\n\n![Image](img/0973.jpg)\n\n### 13.2 只读文本字段\n\n> **概念：只读文本字段显示可以通过代码更改但用户无法编辑的内容**。\n\
  \n只读文本字段并不是新组件，而是使用 `JTextField` 组件的另一种方式。`JTextField` 组件有一个名为 `setEditable` 方法，其通用格式如下：\n\
  \n`setEditable(boolean editable)`\n\n你向此方法传递一个 `boolean` 参数。默认情况下文本字段是可编辑的，这意味着用户可以输入数据。如果你调用\
  \ `setEditable` 方法并传递 `false` 作为参数，则文本字段将变为只读。这意味着它无法被用户编辑。图 13-2 显示了一个具有三个只读文本字段的窗口。\n\
  \n**图 13-2** 有三个只读文本字段的窗口\n\n![Image](img/0974.jpg)\n\n可以使用以下代码创建图中所示的只读文本字段：\n\n\
  ```\n// 创建小计的只读文本字段。\nJTextField subtotalField = new JTextField(10);\nsubtotalField.setEditable(false);\n\
  // 创建销售税的只读文本字段。\nJTextField taxField = new JTextField(10);\ntaxField.setEditable(false);\n\
  // 创建总计的只读文本字段。\nJTextField totalField = new JTextField(10);\ntotalField.setEditable(false);\n\
  ```\n\n\n\n\n\n只读文本字段看起来是一个带有边框的标签。你可以使用 `setText` 方法在其中显示数据。这是一个示例：\n\n```\nsubtotalField.setText(\"\
  100.00\");\ntaxField.setText(\"6.00\");\ntotalField.setText(\"106.00\");\n```\n\n\
  这段代码会导致文本字段显示如图 13-3 所示所示。\n\n**图 13-3** 显示数据的只读文本字段\n\n![Image](img/00975.jpg)\n\
  \n## 13.3 列表\n\n> **概念：列表组件显示项目项目列表，并允许用户从列表中选择一个项目。**\n\n***\n\n![Image](img/00009.jpg)\n\
  \n#### JList 组件\n\n***\n\n列表是一种显示项目列表的组件，并且允许用户从列表中选择一个或多个项目。Java 提供了 `JList` 组件用于创建列表。图\
  \ 13-4 显示了一个示例。图中的 `JList` 组件显示了一个名称列表。在运行时，用户可能会选择列表中的一个项目，导致该项目以高亮显示。在图中，选中了第一个名字。\n\
  \n**图 13-4** 一个 `JList` 组件\n\n![Image](img/00976.jpg)\n\n当你创建一个 `JList` 类的实例时，会将一个对象数组传递给构造函数。这是构造函数调用的通用格式：\n\
  \n```\nJList (Object[] array)\n```\n\n`JList` 组件使用该数组来创建项目列表。在本文中我们始终将 `String`\
  \ 对象的数组传递给 `JList` 构造函数。例如，图 13-4 所示所示列表组件可以使用以下代码创建：\n\n```\nString[] names = {\
  \ \"Bill\", \"Geri\", \"Greg\", \"Jean\",\n                  \"Kirk\", \"Phillip\"\
  , \"Susan\" };\nJList nameList = new JList(names);\n```\n\n#### 选择模式\n\n`JList`\
  \ 组件可以在任何一种选择模式下运行：\n\n> • 单选模式。在这种模式下，一次只能选择一个项目。当某个项目被选中时，其他任何已选中的项目都会被取消选中。\n\
  \n> • 单区间间隔选择模式。在这种模式下，可以选择多个项目，但它们必须处于单个区间内。区间是一组连续的项目。\n\n> • 多区间间隔选择模式。在这种模式下，可以无限制地选择多个项目。这是默认的选择模式。\n\
  \n图 13-5 显示了每种类型选择选择模式下的列表示例。\n\n**图 13-5** 选择模式\n\n![Image](img/00977.jpg)\n\n\
  默认模式是多区间间隔选择。为了保持应用程序简单，我们目前将使用单选模式。你通过 `setSelectionMode` 方法更改 `JList` 组件的选择模式。该方法接受一个\
  \ `int` 参数，用于确定选择模式。\n\n位于 `javax.swing` 包中的 `ListSelectionModel` 类提供了以下常量，你可以将其作为\
  \ `setSelectionMode` 方法的参数：\n\n> • `ListSelectionModel.SINGLE_SELECTION`\n\n> •\
  \ `ListSelectionModel.SINGLE_INTERVAL_SELECTION`\n\n> • `ListSelectionModel.MULTIPLE_INTERVAL_SELECTION`\n\
  \n假设 `nameList` 引用一个 `JList` 组件，以下语句将组件设置为单选模式：\n\n```\nnameList.setSelectionMode(ListSelectionModel.SINGLE_SELECTION);\n\
  ```\n\n#### 响应列表事件\n\n当 `JList` 对象中的某个项目被选中时，它会产生一个列表选择事件。你使用列表选择器类来处理列表选择事件，该类必须满足以下要求：\n\
  \n> • 它必须实现 `ListSelectionListener` 接口。\n\n> • 它必须有一个名为 `valueChanged` 的方法。该方法必须接收一个\
  \ `ListSelectionEvent` 参数。\n\n![Image](img/00005.jpg)\n\n***\n\n**注意：** `ListSelectionListener`\
  \ 接口位于 `javax.swing.event` 包，因此你必须在源代码中有该包的 `import` 语句。\n\n***\n\n一旦你写好了列表选择器类，就可以创建该类的对象，然后将其作为参数传递给\
  \ `JList` 组件的 `addListSelectionListener` 方法。当 `JList` 组件产生事件时，它会自动执行列表选择器对象的 `valueChanged`\
  \ 方法，并将事件对象作为参数传递。稍后你将看到一个示例。\n\n#### 获取选中的项目\n\n你可以使用 `getSelectedValue` 方法或 `getSelectedIndex`\
  \ 方法来确定列表中当前选了哪一个项目。`getSelectedValue` 方法返回当前被选中项目的引用。`getSelectedIndex` 方法返回被选中项目的索引，如果没有项目被选中，则返回\
  \ -1。\n\n```java\nString selectedValue;\nselectedValue = (String) nameList.getSelectedValue();\n\
  ```\n\n```java\nint index;\nString selectedValue;\nindex = nameList.getSelectedIndex();\n\
  if (index != -1)\n    selectedValue = names[index];\n```\n\n\n\n\n\n默认情况下，列表组件的大小足够大，可以显示其包含的所有项。然而，有时列表组件包含的项过多，无法一次性显示。大多数\
  \ GUI 应用程序会在包含大量项的列表组件上显示滚动条。用户只需使用滚动条即可滚动查看列表项。\n\n列表组件不会自动显示滚动条。若要在列表组件上显示滚动条，你必须遵循以下通用步骤：\n\
  \n1. 设置列表组件的可见行数。\n2. 创建一个滚动面板（scroll pane）对象，并将列表组件添加到其中。\n3. 将滚动面板对象添加到任何其他容器（如面板/panels）中。\n\
  \n让我们仔细查看如何使用这些步骤为以下代码创建的列表组件应用滚动条：\n\n```java\nString[] names = { \"Bill\", \"\
  Geri\", \"Greg\", \"Jean\",\n                  \"Kirk\", \"Phillip\", \"Susan\"\
  \ };\n  JList nameList = new JList(names);\n```\n\n首先，我们通过 `JList` 类的 `setVisibleRowCount`\
  \ 方法来确定列表组件的大小。以下语句将 `nameList` 组件的可见行数设置为三：\n\n```java\nnameList.setVisibleRowCount(3);\n\
  ```\n\n此语句导致 `nameList` 组件每次只显示三项。\n\n接下来，我们创建一个滚动面板对象并将列表组件添加到其中。滚动面板对象是一个容器，可以在它包含的任何组件上显示滚动条。在\
  \ Java 中，我们使用 `JScrollPane` 类来创建滚动面板对象。我们将希望添加到滚动面板的对象作为参数传递给 `JScrollPane` 构造函数。以下语句演示了：\n\
  \n```java\nJScrollPane scrollPane = new JScrollPane(nameList);\n```\n\n此语句创建一个 `JScrollPane`\
  \ 对象并将 `nameList` 组件添加到其中。\n\n接下来，我们将滚动面板对象添加到 GUI 所需要的任何其他容器中。例如，以下代码将滚动面板添加到 `JPanel`\
  \ 中，然后将 `JPanel` 添加到 `JFrame` 对象的的内容面板中：\n\n```java\n// 创建一个面板并将滚动面板添加到其中。\n  JPanel\
  \ panel = new JPanel();\n  panel.add(scrollPane);\n  // 将面板添加到此 JFrame 对象的 contentPane\
  \ 中。\n  add(panel);\n```\n\n当列表组件显示时，它将如图 13-8 所示。\n\n虽然列表组件每次只显示三项，但用户可以滚动查看其包含的所有项。\n\
  \n代码列表 13-2 所示的 `ListWindowWithScroll` 类是 `ListWindow` 类的修改版。在此类中，`monthList` 组件每次只显示六项，但显示了滚动条。加粗显示的代码是用于向列表添加滚动条的新行。`main`\
  \ 方法创建了该类的实例，它显示了如图 13-9 所示的窗口。\n\n**图 13-8** 带有滚动条的列表组件\n\n![Image](img/00986.jpg)\n\
  \n**图 13-9** 带有多个滚动条的列表组件\n\n![Image](img/00987.jpg)\n\n**代码列表 13-2 (`ListWindowWithScroll.java`)**\n\
  \n![Image](img/00988.jpg)\n![Image](img/00989.jpg)\n![Image](img/00990.jpg)\n![Image](img/00991.jpg)\n\
  ![Image](img/00992.jpg)\n![Image](img/00993.jpg)\n![Image](img/00005.jpg)\n\n**注意：**\
  \ 默认情况下，当 `JList` 组件添加到 `JScrollPane` 对象时，只有当列表中的项数多于可见行数时，才会显示滚动条。\n\n![Image](img/00005.jpg)\n\
  \n**注意：** 当 `JList` 组件添加到 `JScrollPane` 对象时，列表周围会自动出现一个边框。\n\n### 向现有的 `JList` 组件添加项\n\
  \n`JList` 类的 `setListData` 方法允许你向现有的 `JList` 组件中存储项。以下是该方法的通用格式：\n\n```java\nvoid\
  \ setListData(Object[] data)\n```\n\n传递给 `data` 的参数是一个对象数组，这些对象将成为 `JList` 组件中显示的项。组件中当前显示的任何项都将被新项替换。\n\
  \n除了替换列表中的现有项外，你还可以使用此方法向空列表添加项。你可以通过向 `JList` 构造函数不传递参数来创建一个空列表。这是一个示例：\n\n```java\n\
  JList nameList = new JList();\n```\n\n此语句创建了一个由 `nameList` 引用的空 `JList` 组件。然后你可以像此处所示向列表添加项：\n\
  \n```java\nString[] names = { \"Bill\", \"Geri\", \"Greg\", \"Jean\",\n        \
  \          \"Kirk\", \"Phillip\", \"Susan\" };\nnameList.setListData(names);\n```\n\
  \n#### 多项选择\n\n为了简单起见，之前的示例使用了选择模式下的 `JList`。回想另外两种模式是单间隔（single interval）和多间隔（multiple\
  \ interval）。\n\n#### 单间隔模式\n\n通过向组件的 `setSelectionMode` 方法传递 `ListSelectionModel.SINGLE_INTERVAL`\
  \ 将 `JList` 组件设置为单间隔模式。在单间隔模式下，可以选择单项或多个项。间隔是指一组连续的项。请参图 13-5 查看示例。\n\n要选择一个间隔，用户通过点击选择间隔中的第一项，然后按住\
  \ Shift 键点击间隔中的最后一项。从第一项到最后一项的所有项都被选中。\n\n在单间隔模式下，`getSelectedValue` 返回第一项。`getSelectedIndex`\
  \ 返回第一项的索引。要获取整个选中的间隔，请使用 `getSelectedValues` 方法。该方法返回一个数组。你还可以使用 `getSelectedIndices`\
  \ 方法，它返回包含所有选中项索引的 `int` 数组。\n\n#### 多间隔模式\n\n通过向组件的 `setSelectionMode` 方法传递 `ListSelectionModel.MULTIPLE_INTERVAL`\
  \ 将 `JList` 组件设置为多间隔模式。在多间隔模式下，可以选择多个项，且项不需要在同一个间隔内。\n\n在多间隔模式下，用户可以选择单项或间隔。当用户在点击项时按住\
  \ Ctrl 键，将选中该项而不取消任何当前选中的项。\n\n在多间隔模式下，`getSelectedValue` 返回第一个选中的项。`getSelectedIndex`\
  \ 返回第一个选中项的索引。`getSelectedValues` 方法返回包含所选中项的对象数组。`getSelectedIndices` 方法返回包含所有选中项索引的\
  \ `int` 数组。\n\n代码列表 13-3 所示的 `MultipleIntervalSelection` 类演示了用于多项选择模式的 `JList` 组件。`main`\
  \ 方法创建该类的实例，显示出如图 13-10 左侧所示的窗口。当用户从顶部 `JList` 组件选择项并点击“Get Selections”按钮时，选中的项将出现在底部的\
  \ `JList` 组件中。\n\n\n\n\n\n![Image](img/00995.jpg)\n\n![Image](img/00996.jpg)\n\n\
