  \n***\n\n#### 以粗体显示的示例输入对应的程序输出\n\n`XYZ 公司的股票目前价格为每股 $9.62。`\n`你想买多少股股票？` `100 [Enter]`\n\
  `股票成本: $962.00`\n\n***\n\n#### 使用 CRC 卡片确定类之间的协作\n\n在面向对象的设计过程中，你可以通过检查类的职责来确定类之间所需的许多协作。在第\
  \ 6 章、第 6.7 节中，我们讨论了寻找类及其职责的过程。回想该节，类的职责如下：\n\n> • 类负责知道的事物\n> • 类负责执行的操作\n\n通常，你会发现该类必须与另一个类协作以完成其一项或多项职责。发现类职责和协作的一种流行方法是创建\
  \ CRC 卡。CRC 代表类（Class）、职责（Responsibilities）和协作（Collaborations）。\n\n你可以使用简单的索引卡来执行此过程。一旦你完成了寻找类的过程（这在第\
  \ 6 章、第 6.7 节中讨论过），为每个类单独留一张索引卡。在索引卡的顶部写上类的名称。将卡片的其余部分分为两列。在左侧列中，写下类的每项职责。在写每项职责时，思考该类是否需要与另一个类协作来完成该职责。问自己以下问题：\n\
  \n> • 此类的对象是否需要从另一个对象获取数据以完成此职责？\n> • 此类的对象是否需要请求另一个对象执行某项操作以完成此职责？\n\n如果需要协作，请在右列中写下协作类的名称，紧挨在需要该协作的职责旁边。如果某项职责不需要协作，只需在右列写上“None”或留空。图\
  \ 9-20 显示了 `StockPurchase` 类的示例 CRC 卡。\n\n##### 图 9-20 CRC 卡\n\n![Image](img/00707.jpg)\n\
  \n从所示的 CRC 卡可以看出，`StockPurchase` 类具有以下职责和协作：\n\n> • 职责：知道购买股票协作：`Stock` 类\n> • 职责：知道购买数量协作：无\n\
  > • 职责：计算成本协作：`Stock` 类\n\n当你为每个类完成 CRC 卡后，你就能很好地了解类的职责以及它们是如何交互的。\n\n### 9.12 应避免的错误\n\
  \n以下列表描述了学习本章节时常见的几种错误：\n\n> • **在静态方法中尝试引用实例字段或实例方法**。静态方法只能引用类成员。\n> • **在接受对象作为参数的方法中编写意外修改对象的代码**。当对象作为参数传递给方法时，该方法拥有该对象。在编写接收引用变量作为参数的方法时，必须小心不要修改所引用对象的内容。\n\
  > • **允许使用空引用**。由于 `null` 引用不引用任何对象，你无法使用它执行需要对象的操作。例如，不能使用 `null` 引用调用方法。如果你尝试对\
  \ `null` 引用执行操作，程序将终止。这发生在类有一个引用变量作为字段，但没有被正确初始化为对象的地址时。\n> • **忘记使用枚举常量的全名**。在大多数情况下，必须使用枚举常量的全名。一个例外是枚举常量用作\
  \ switch 语句的表达式时。\n\n***\n\n## 复习题与练习\n\n**单选题与判断**\n\n> 1. 这种类型的方法无法访问所属类中的任何非静态成员变量。\n\
