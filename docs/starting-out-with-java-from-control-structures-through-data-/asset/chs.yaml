  \n```java\ndouble portion;\nportion = 70 / 3;\n```\n\n### ### 2.6 复合赋值运算符\n\n> **概念：复合赋值运算符将赋值运算符与算术运算符结合在一起。**\n\
  \n程序中经常会有如下形式的赋值语句：\n\n```java\nx = x + 1;\n```\n\n在赋值运算符的右侧，`1` 被加到 `x` 上。然后将结果赋值给\
  \ `x`，替换掉之前的值。实质上，这条语句向 `x` 加了 `1`。这里是另一个例子：\n\n```java\nbalance = balance + deposit;\n\
  ```\n\n假设 `balance` 和 `deposit` 是变量，该语句将 `balance + deposit` 的值赋值给 `balance`。该语句的效果是将\
  \ `deposit` 加到存储在 `balance` 中的值上。这里还有一个例子：\n\n```java\nbalance = balance - withdrawal;\n\
  ```\n\n假设 `balance` 和 `withdrawal` 是变量，该语句将 `balance - withdrawal` 的值赋值给 `balance`。该语句的效果是将\
  \ `withdrawal` 从存储在 `balance` 中的值中减去。\n\n如果你没有见过这类语句，它们可能会引起初期的某些困惑，因为同一个变量名同时出现在赋值运算符的两侧边。表\
  \ 2-12 显示了其他这种编写方式的语句示例。\n\n**表 2-12** 各种赋值语句（假设每条语句中 `x` = `6`）\n\n![Image](img/00071.jpg)\n\
  \n这类操作在编程中非常常见。为了方便起见，Java 提供了一组专门为这些任务设计的特殊运算符。表 2-13 显示了*复合赋值运算符*，也称为*复合操作符*。\n\
  \n**表 2-13** 复合赋值运算符\n\n![Image](img/00072.jpg)\n\n你可以看到，复合赋值运算符不需要程序员输入两次变量名。以下语句：\n\
  \n```java\nbalance = balance + deposit;\n```\n\n可以重写为\n\n```java\nbalance += deposit;\n\
  ```\n\n同样，语句\n\n```java\nbalance = balance - withdrawal;\n```\n\n可以重写为\n\n```java\n\
  balance -= withdrawal;\n```\n\n#### #### ### ![Image](img/00004.jpg) 检查点\n\n> 2.24\
  \ 使用复合赋值运算符编写语句执行以下操作：\n\n> a) 将 `x` 加 `6`\n> b) 从 `amount` 中减去 `4`\n> c) 将 `y`\
  \ 乘以 `4`\n> d) 将 `total` 除以 `27`\n> e) 在 `x` 中存储 `x` 除以 `7` 的余数\n\n### ### 2.7 基本数据类型之间的转换\n\
  \n> **概念：在将值存储在变量之前，该值的数据类型必须与变量的数据类型兼容。Java 会自动执行数据类型之间的某些转换，但不会自动执行任何可能导致数据丢失的转换。在评估包含混合数据类型的算术表达式时，Java\
  \ 也遵循一套规则。**\n\nJava 是一种*强类型*语言。这意味着在将值赋值给变量之前，Java 会检查变量及其被赋值之值的数据类型，以确定它们是否兼容。例如，看以下语句：\n\
  \n```java\nint x;\ndouble y = 2.5;\nx = y;\n```\n\n该赋值语句试图将一个 `double` 值（`2.5`）存储在\
  \ `int` 变量中。当 Java 编译器遇到这行代码时，会返回错误信息。（Sun JDK 显示信息“possible loss of precision”，可能会丢失精度。）\n\
  \n然而，并不是所有混合数据类型的赋值语句都会被编译器拒绝。例如，看以下程序段：\n\n```java\nint x;\nshort y = 2;\nx = y;\n\
  ```\n\n这条将 `short` 存储在 `int` 中的赋值语句可以正常运行。那么，为什么 Java 允许 `short` 存储在 `int` 中，但不允许\
  \ `double` 存储在 `int` 中呢？显然原因是 `double` 可以存储小数，并且持有比 `int` 大得多的值。如果 Java 允许将 `double`\
  \ 赋值给 `int`，可能会丢失数据。\n\n就像军队中的军官一样，基本数据类型也是分级的。如果一个数据类型可以持有更大的数字，那么它的级别就高于另一个数据类型。例如，`float`\
  \ 的级别高于 `int`，`int` 的级别高于 `short`。图 2-6 按级别顺序显示了数值数据类型。数据类型在列表中出现得越高，它的级别就越高。\n\n\
  **图 2-6** 基本数据类型排名\n\n![Image](img/00073.jpg)\n\n在将低级别类型存储在高级别变量中的赋值语句中，Java 会自动转换低级别类型。这被称为*宽化转换*。例如，以下代码：\n\
  \n```java\ndouble x;\nint y = 10;\nx = y;\n```\n\n变量 `x` 是 `double` 类型，持有值 `10`。变量\
  \ `y` 是 `int` 类型，其值被转换为 `double`。\n\n*窄化转换*是将高级别类型转换为低级别类型的过程。这可能会导致数据丢失。例如：\n\n\
  ```java\ndouble number = 10.5;\nint x;\nx = (int)number;\n```\n\n变量 `x` 是 `int`\
  \ 类型，持有值 `10`。`number` 的小数部分被*截断*了。\n\n#### #### #### 强制转换运算符\n\n强制转换运算符允许手动转换值。它们是表现为括号内数据类型的一元运算符。例如：\n\
  \n```java\nx = (int)number;\n```\n\n括号内的 `int` 返回转换为 `int` 类型的 `number` 值。注意，当强制转换运算符应用于变量时，它不会改变变量的内容；它只返回转换类型的值。\n\
  \n回想之前的讨论，当除法的两个操作数都是整数时，运算将导致整数除法。这意味着除法结果是一个整数，任何小数部分都被丢弃。例如，看以下代码：\n\n```java\n\
  int pies = 10, people = 4;\ndouble piesPerPerson;\npiesPerPerson = pies / people;\n\
  ```\n\n尽管 10 除以 4 是 2.5，这段代码会在 `piesPerPerson` 变量中存储 2。由于 `pies` 和 `people` 都是 `int`\
  \ 变量，结果将是一个整数，小数部分将被丢弃。然而，我们可以通过强制转换运算符修改代码，使其得到正确的浮点值结果：\n\n```java\npiesPerPerson\
  \ = (double)pies / people;\n```\n\n变量 `pies` 是 `int` 类型。表达式 `(double)pies` 返回 `pies`\
  \ 转换为 `double` 后的值。这意味着除法运算符的一个操作数是 `double`，因此除法结果将是 `double` 类型。该语句也可以写成：\n\n\
  ```java\npiesPerPerson = pies / (double)people;\n```\n\n在这一条语句中，强制转换运算符返回 `people`\
  \ 变量转换为 `double` 后的值。在任何一种语句中，除法结果都是 `double`。\n\n\n\n\n\n# 警告！\n\n`cast` 运算符可以应用于由括号括的整个表达式。例如，看以下语句：\n\
  \n```\npiesPerPerson = (double)(pies / people);\n```\n\n该语句并没有将 `pies` 或 `people`\
  \ 中的值转换为 `double`，而是将表达式 `pies / people` 的结果转换为 `double`。如果使用该语句，仍然会执行整数除法。原因如下：表达式\
  \ `pies / people` 的结果是 2（因为执行了整数除法）。将值 2 转换为 `double` 的结果是 2.0。为了防止整数除法的发生，必须将其中一个操作数转换为\
  \ `double`。\n\n## 混合整数运算\n\nJava 语言的细微之处之一是它在内部处理 `int`、`byte` 和 `short` 变量的算术运算的方式。当\
  \ `byte` 或 `short` 数据类型的值用在算术表达式中时，它们会被临时转换为 `int` 值。仅使用混合 `byte`、`short` 或 `int`\
  \ 值进行的算术运算，其结果始终是 `int`。\n\n例如，假设以下表达式中的 `b` 和 `c` 是 `short` 变量：\n\n```\nb + c\n\
  ```\n\n尽管 `b` 和 `c` 都是 `short` 变量，但表达式 `b + c` 的结果是 `int`。这意味着当将此类表达式的结果存储在变量中时，该变量必须是\
  \ `int` 或更高的数据类型。例如，看以下代码：\n\n```java\nshort firstNumber = 10,\n     secondNumber\
  \ = 20,\n     thirdNumber;\n// 以下语句会导致错误！\nthirdNumber = firstNumber + secondNumber;\n\
  ```\n\n当编译这段代码时，以下语句会导致错误：\n\n```java\nthirdNumber = firstNumber + secondNumber;\n\
  ```\n\n错误的原因是 `thirdNumber` 是一个 `short`。虽然 `firstNumber` 和 `secondNumber` 也是 `short`\
  \ 变量，但表达式 `firstNumber + secondNumber` 的结果是一个 `int` 值。如果将 `thirdNumber` 声明为 `int`，或者在赋值语句中使用强制转换运算符，程序就可以得到修正，如下所示：\n\
  \n```java\nthirdNumber = (short)(firstNumber + secondNumber);\n```\n\n## 其他混合数学表达式\n\
  \n在数学表达式包含一个或多个 `double`、`float` 或 `long` 数据类型值的情况下，Java 会努力将表达式中的所有操作数转换为相同的数据类型。让我们来看控制这些类型表达式求值的的特定规则。\n\
  \n1. 如果运算符的操作数之一是 `double`，则另一个操作数的值将被转换为 `double`。表达式的结果将是 `double`。例如，在以下语句中，假设\
  \ `b` 是 `double` 且 `c` 是 `int`：\n\n```java\na = b + c;\n```\n\n`c` 的值在加法之前将被转换为\
  \ `double`。加法的结果将是 `double`，因此变量 `a` 也必须是是 `double`。\n\n2. 如果运算符的操作数之一是 `float`，则另一个操作数的值将被转换为\
  \ `float`。表达式的结果将是 `float`。例如，在以下语句中，假设 `x` 是 `short` 且 `y` 是 `float`：\n\n```java\n\
  z = x * y;\n```\n\n`x` 的值在乘法之前将被转换为 `float`。乘法的结果将是 `float`，因此变量 `z` 必须是 `double`\
  \ 或 `float` 之一。\n\n3. 如果运算符的操作数之一是 `long`，则另一个操作数的值将被转换为 `long`。表达式的结果将是 `long`。例如，在以下语句中，假设\
  \ `a` 是 `long` 且 `b` 是 `short`：\n\n```\nc = a - b;\n```\n\n`b` 在减法之前将被转换为 `long`。减法的结果将是\
  \ `long`，因此变量 `c` 必须是 `long`。\n\n### 检查点\n\n2.25 程序中出现了以下声明：\n\n```\nshort totalPay,\
  \ basePay = 500;\n```\n\n同一程序中出现了以下语句：\n\n```\nbonus = 1000;\n```\n\na)语句会正常编译还是会导致错误？\n\
  \nb) 如果语句会导致错误，原因是什么？如何修复？\n\n2.26 变量 `a` 是 `float`，变量 `b` 是 `double`。写出语句。\n\n\
  **概念：常量是在执行过程中值不会改变的变量。**\n\n在 Java 中，你可以通过使用 `final` 关键字来创建这样的变量。声明 `final` 变量时必须给出一个初始化值，否则会产生错误。如果程序中有任何尝试更改\
  \ `final` 变量值的语句，也会产生编译错误。例如：\n\n```java\nfinal double INTEREST_RATE = 0.09;\n```\n\
  \n`final` 单词出现在数据类型之前，变量名使用了大写字母。并不是要求变量名必须大写字母，但许多程序员这样做以便与变量名区分来。\n\n使用命名常量的优点是它们使程序更具自文档性。以下语句：\n\
  \n```\namount = balance * 0.09;\n```\n\n可以改为：\n\n```\namount = balance * INTEREST_RATE;\n\
  ```\n\n新程序员可以阅读第二个语句并知道发生了什么。显然，余额正在乘以利率。这种方法的另一个优势是可以方便地对程序进行广泛更改。假设利率在程序中出现了几十处。当利率变化时，只需要修改命名常量定义中的初始化值。如果利率增加到\
  \ 8.2%，声明可以改为：\n\n```java\nfinal double INTEREST_RATE = 0.082;\n```\n\n然后程序就可以重新编译。每个使用\
  \ `INTEREST_RATE` 的语句都将使用新值。\n\n### Math.PI 常量\n\n`Math` 类是 Java API 的一部分，提供了一个预定义的命名常量\
  \ `Math.PI`。该常量被赋值为 3.14159265358979323846，这是数学值 π 的近似值。例如，看以下语句：\n\n```\narea =\
  \ Math.PI * radius * radius;\n```\n\n假设 `radius` 变量持有圆的半径，该语句使用 `Math.PI` 常量来计算圆的面积。\n\
  \n\n\n\n欲了解更多关于 `Math` 类的信息，请参见附录 F，该内容可在本书的在线资源页 [www.pearsonhighered.com/gaddis](http://www.pearsonhighered.com/gaddis)\
  \ 获取。\n\n* *\n\n## 2.9 `String` 类\n\n> **概念：`String` 类允许你创建用于存储字符串的对象。它还有各种允许你处理字符串的方法。**\n\
  \n你已经遇到过字符串，并检查了在屏幕上显示字符串的程序，但让我们花一点时间确保你理解什么是字符串。字符串是一个字符序列。它可以用于表示任何包含文本的数据类型，例如名称、地址、警告信息等。字符串字面量包含在双引号中，如下所示：\n\
  \n```\n\"Hello World\"\n\"Joe Mahoney\"\n```\n\n虽然程序经常遇到字符串并必须对它们执行各种任务，但 Java 并没有用于在内存中存储它们的原始数据类型。相反，Java\
  \ API 提供了一个处理字符串的类。你使用这个类来创建能够存储字符串并对其执行操作的对象。在讨论这个类之前，让我们简要讨论类和对象之间的关系。\n\n####\
  \ 对象由类创建\n\n第 1 章 向你介绍了对象，它们是作为包含属性和方法的软件实体。对象的属性是存储在对象中的数据值。对象的方法是对对象属性执行操作的过程。然而，在创建对象之前，它必须由程序员进行设计。程序员确定必要的属性和方法，然后创建一个描述该对象的类。\n\
  \n你已经见过类被用作应用程序的容器。类也可以被用于指定特定类型的对象可能拥有的属性和方法。将类想象为一个可以根据其创建对象的“蓝图”。因此，类不是对象，而是对对象的描述。当程序运行时运行时，它可以使用该类在内存中创建所需数量的对象。从类中创建的每个对象都称为该类的*实例*（instance）。\n\
  \n![Image](img/00006.jpg)\n\n* *\n\n**提示：** 如果这些概念对你来说似乎有些模糊，不要担心。随着你对这本书的阅读，类和对象的概念将反复得到加强。\n\
  \n* *\n\n#### `String` 类\n\nJava API 提供的处理字符串的类名为 `String`。使用 `String` 类的第一步是声明一个\
  \ `String` 类数据类型的变量。这里有一个 `String` 变量声明的示例：\n\n```\nString name;\n```\n\n* *\n\n\
  **提示：** `String` 中的 `S` 是大写的。按照惯例，类名的第一个字母始终大大写。\n\n* *\n\n此语句将 `name` 声明为 `String`\
  \ 变量。记住 `String` 是一个类，而不是原始数据类型。让我们简要查看原始类型变量和类类型变量之间的区别。\n\n#### 原始类型变量和类类型变量\n\
  \n任何类型的变量都可以与数据项关联。*原始类型变量*（Primitive type variables）持有与其关联的实际数据项。例如，假设 `number`\
  \ 是一个 `int` 变量。以下语句将值 25 存储在变量中：\n\n```\nnumber = 25;\n```\n\n在图 2-7](#dummy_split_009.html_filepos332061)\
  \ 中所示。\n\n**图 2-7** 原始类型变量持有与其关联的数据\n\n![Image](img/00075.jpg)\n\n*类类型变量*（class\
  \ type variable）并不持有与其关联的实际数据项，而是持有与其关联的数据项的内存地址。如果 `name` 是 `String` 类变量，那么 `name`\
  \ 就可以持有 `String` 对象的内存地址。在图 2-8](#dummy_split_009.html_filepos332796) 中所示。\n\n**图\
  \ 2-8** 一个 `String` 类变量可以持有 `String` 对象的地址\n\n![Image](img/00076.jpg)\n\n当类类型变量持有对象的地址时，称该变量引用该对象。由于这个原因，类类型变量通常被称为*引用变量*（reference\
  \ variables）。\n\n#### 创建 `String` 对象\n\n每你在程序中编写字符串字面量时，Java 都会在内存中创建一个 `String`\
  \ 对象来持有它。你可以通过一个简单的赋值语句在内存中创建一个 `String` 对象并将其地址存储在 `String` 变量中。这里有一个示例：\n\n```\n\
  name = \"Joe Mahoney\";\n```\n\n在这里，字符串字面量导致在内存中创建一个 `String` 对象，其中存储了值“Joe Mahoney”。然后，赋值运算符将该对象的地址存储在\
  \ `name` 变量中。在该语句执行后，称 `name` 变量引用了一个 `String` 对象。在图 2-9](#dummy_split_009.html_filepos334801)\
  \ 中所示。\n\n**图 2-9** `name` 变量持有 `String` 对象的地址\n\n![Image](img/00077.jpg) （等待，源文本图像路径中有拼写错误，保持原样：images/00077.jpg）\n\
  \n\n\n\n> 2.27 编写一条语句声明一个名为 `city` 的 `String` 变量。该变量应初始化，使其引用字符串为“San Francisco”的对象。\n\
  \n> 2.28 假设 `stringLength` 是一个 `int` 变量。编写一条语句，将 `city` 变量（在 Checkpoint 2.27 中声明）引用字符串的长度存储在\
  \ `stringLength` 中。\n\n> 2.29 假设 `oneChar` 是一个 `char` 变量。编写一条语句，将 `city` 变量（在 Checkpoint\
  \ 2.27 中声明）引用字符串的第一个字符存储在 `oneChar` 中。\n\n> 2.30 假设 `upperCity` 是一个 `String` 引用变量。编写一条语句，将\
  \ `city` 变量（在 Checkpoint 2.27 中声明）引用字符串的大写形式存储在 `upperCity` 中。\n\n> 2.31 假设 `lowerCity`\
  \ 是一个 `String` 引用变量。编写一条语句，将 `city` 变量（在 Checkpoint 2.27 中声明）引用字符串的小写形式存储在 `lowerCity`\
  \ 中。\n\n## 2.10 作用域\n\n> **概念：变量的作用域是程序中可以访问该变量的部分**。\n\n每个变量都有 `scope`。变量的作用域是程序中可以通过名称访问该变量的部分。变量只对其作用域内部的语句可见。定义变量作用域的规则非常复杂，你在这里只是开始接触这个概念。在书的后续章节中，我们将再次回到这个主题并进行扩展。\n\
  \n到目前为止，你只见过在 `main` 方法内部声明的变量。在方法内部声明的变量被称为 `局部变量`。以后你将学习在方法外部声明的变量，但现在，让我们关注局部变量的使用。\n\
  \n局部变量的作用域从变量的声明开始，到声明该变量的方法结束处结束。该区域之外语句无法访问该变量。这意味着，局部变量无法通过方法之外的代码访问，也无法通过方法内部但在变量声明之前的代码访问。代码列表\
  \ 2-23 显示了一个示例。\n\n**代码列表 2-23 (`Scope.java`)**\n\n![Image](img/00082.jpg)\n\n该程序无法编译，因为它试图在变量声明之前将变量\
  \ `value` 的内容发送给 `println`。记住，编译器是从上到下读取你的程序的。如果它在变量声明之前遇到使用该变量的语句，会导致错误。要纠正程序，必须在任何使用变量的语句之前编写变量声明。\n\
  \n![Image](img/00005.jpg)\n\n**注意：** 如果你编译此程序，编译器将显示如“无法解析符号”（cannot resolve symbol）之类的错误信息。这意味着编译器遇到了一个无法确定其含义的名字。\n\
  \n关于局部变量你必须记住的另一个规则是，你不能在同一个作用域内拥有两个同名的局部变量。例如，查看以下方法。\n\n![Image](img/00083.jpg)\n\
  \n该方法声明了一个名为 `number` 的变量并将其初始化为 7。该变量的作用域从声明语句开始，延伸到方法的结束。在变量的作用域内部出现了一条语句，声明另一个名为\
  \ `number` 的变量。这条语句将导致错误，因为你不能在同一个作用域内拥有两个同名的局部变量。\n\n## 2.11 注释\n\n> **概念：注释是解释性的备注，用于记录程序的行或章节。注释是程序的一部分，但编译器会忽略它们。它们是为那些可能阅读源代码的人准备的**。\n\
  \n你可能会感到惊讶，程序最重要的部分之一对程序的运行方式完全没有影响。事实上，编译器忽略了程序的这部分。当然，这部分就是注释。\n\n养成用描述性注释对代码进行详尽标注的习惯至关重要。现在可能需要花费额外的时间，但将来几乎肯定会节省时间。想象一下，编写一个中等复杂度、具有约\
  \ 8,000 到 10,000 行代码的程序。一旦你写完代码并满意地完成了调试，你就高兴地将其收起来，转向下一个项目。十个月后，你被要求对程序进行修改（更糟的是，追踪并修复一个难以发现的错误）。你打开包含源代码的文件，盯着成千上万条现在完全毫无意义的语句。如果当初你留给自己留一些笔记来解释程序代码该就好了。当然，现在已经太晚了。唯一能做的就是决定哪种更省时间：搞懂旧程序，还是完全重写它！\n\
  \n这种场景听起来可能很极端，但你不希望它发生在自己身上。现实世界的程序通常很大且复杂。详尽的注释会让你的生活变得更轻松，更不用说未来阅读你代码的其他程序员了。\n\
  \n#### Java 中注释的三种方式\n\n#### 单行注释\n\n你已经见过了在 Java 程序中写注释的第一种方法。你只需要在想开始注释的地方放置两个正斜杠（`//`）。编译器会忽略从该点到行尾的所有内容。代码列表\
  \ 2-24 显示，注释可以大量分布在整个程序中。\n\n**代码列表 2-24 (`Comment1.java`)**\n\n![Image](img/00084.jpg)\n\
  \n除了说明谁编写了程序以及描述变量的用途外，注释还可以用于解释代码中复杂的步骤。\n\n#### 多行注释\n\nJava 的第二种注释类型是多行注释。`多行注释`以\
  \ `/*`（正斜杠加星号）开始，以 `*/`（星号加正斜杠）结束。这两个标记之间的所有内容都会被忽略。代码列表 2-25 说明了如何使用多行注释。\n\n**代码列表\
  \ 2-25 (`Comment2.java`)**\n\n![Image](img/00085.jpg)\n\n与以 `//` 开头的注释不同，多行注释可以跨越几行。这使得编写大块注释更加方便，因为你不需要标记每一行。因此，多行注释在编写单行注释时并不方便，因为你必须输入开始和结束注释符号。\n\
  \n在使用多行注释时，请记住以下建议：\n\n- 注意不要颠倒开始和结束符号。\n- 确保不要忘记结束符号。\n\n许多程序员使用星号或其他字符在注释周围绘制边框或方框。这有助于在视觉上将注释与周围的代码分开。这些被称为块注释。表\
  \ 2.16 显示了块注释的四个示例。\n\n**表 2.16** 块注释\n\n![Image](img/00086.jpg)\n\n#### 文档注释\n\n\
  第三种注释被称为文档注释。`文档注释`可以被名为 `javadoc` 的程序读取并处理，该程序随 Sun JDK 提供。`javadoc` 程序的目的是读取 Java\
  \ 源文件并生成格式良好的 HTML 文件来对源代码进行文档。如果源文件包含任何文档注释，注释中的信息将成为 HTML 文档的一部分。HTML 文档可以使用 Web\
  \ 浏览器（如 Internet Explorer 或 Netscape Navigator）进行查看。\n\n\n\n\n\n以 `/**` 开头并以 `*/`\
  \ 结尾的注释都被视为文档注释。通常，你会在类头部之前写一个文档注释，对该类进行简要描述。你还会在每个方法头部之前写一个文档注释，对该方法进行简要描述。例如，代码列表\
  \ 2-26 显示了一个了一个带有文档注释的程序。该程序在类头部之前有一个文档注释，在 `main` 方法头部之前也有一个文档注释。\n\n#### 代码列表\
  \ 2-26 (`Comment3.java`)\n\n![Image](img/00087.jpg)\n\n从操作系统的命令行提示符运行 `javadoc`\
  \ 程序。以下是 `javadoc` 命令的一般格式：\n\n`javadoc SourceFile.java`\n\n`SourceFile.java` 是\
  \ Java 源文件的名称，包括 `.java` 扩展名。`javadoc` 将读取该文件并为其生成文档。例如，以下命令将为 `Comment3.java` 源代码生成文档，该文件见代码列表\
  \ 2-26：\n\n`javadoc Comment3.java`\n\n在该命令执行后，会在源代码文件相同的目录中创建几个文档文件。其中一个文件将命名为 `index.html`。图\
  \ 2-10 显示了在 Internet Explorer 中查看的 `index.html` 文件。注意，在文档注释中编写的内容出现在文件中。\n\n![Image](img/00006.jpg)\n\
  \n**提示：** 当为方法编写文档注释时，`javadoc` 生成的 HTML 文档文件将该方法有两个部分：摘要部分（summary）和详细部分（detail）。方法文档注释中的第一句被用作方法的摘要。注意，`javadoc`\
  \ 将句子的结束视为句号后跟一个空格字符。出于这个原因，当方法描述包含多个句子时，你应该始终以句号后加空格字符来结束第一句。方法的详细部分将包含文档注释中出现的所有描述。\n\
  \n#### 图 2-10 由 `javadoc` 生成的文档\n\n![Image](img/00088.jpg)\n\n如果你查看 JDK 文档（你在 Web\
  \ 浏览器中查看的 HTML 文件），你会发现它们的格式与 `javadoc` 生成的文件相同。使用 `javadoc` 对源代码进行文档编制的好处是，你的文档将具有与标准\
  \ Java 文档相同的专业外观和感受。\n\n图 2-10 所示的 JDK 文档文件包含在书中源码中，可以在 [www.pearsonhighered.com/gaddis](http://www.pearsonhighered.com/gaddis)\
  \ 获取。\n\n从书中这里开始，我们将在示例源码中使用文档注释。随着各个主题的进行，你将看到文档注释和 `javadoc`程序的更多用法。\n\n#####\
