  \ 的类型的参数。例如，下面的代码将 `FinalExam`、`PassFailActivity` 和 `PassFailExam` 类的对象传递给该方法：\n\
  \n![Image](img/00863.jpg)\n\n#### “是”关系不能反过来\n\n要注意，“是”关系不能反过来。虽然“期末考试是分级活动”这一说法是正确的，但“分级活动是期末考试”则是不正确的。这是因为并不是所有的分级活动都是期末考试。同样，并不是\
  \ `GradedActivity` 对象都是 `FinalExam` 对象。因此，下面的代码无法工作：\n\n```java\nGradedActivity\
  \ activity = new GradedActivity();\nFinalExam exam = activity; // 错误！\n```\n\n你不能将\
  \ `GradedActivity` 对象的地址赋值给 `FinalExam` 变量。这是，因为 `FinalExam` 对象具有超出 `GradedActivity`\
  \ 对象范围的能力。有趣的是，如果你使用类型转换，Java 编译器会允许你进行这样的赋值，如下：\n\n```java\nGradedActivity activity\
  \ = new GradedActivity();\nFinalExam exam = (FinalExam) activity; // 可以编译但无法运行。\n\
  ```\n\n但当赋值语句执行时，程序将会崩溃。\n\n#### `instanceof` 运算符\n\n\n\n\n\nJava 中有一个名为 `instanceof`\
  \ 的操作符，你可以用它来确定对象是否是特定类的实例。以下是使用 `instanceof` 操作符的表达式通用形式：\n\n`refVar` instanceof\
  \ `ClassName`\n\n在通用形式中，`refVar` 是引用变量，`ClassName` 是类名。这是一个 `boolean` 表达式的形式，如果\
  \ `refVar` 引的对象是 `ClassName` 的实例，则表达式返回 `true`；否则，表达式返回 `false`。例如，下面代码中的 `if` 语句判断引用变量\
  \ `activity` 是否引用了某个 `GradedActivity` 对象：\n\n```\n  GradedActivity activity = new\
  \ GradedActivity();\n  if (activity instanceof GradedActivity)\n     System.out.println(\"\
  Yes, activity is a GradedActivity.\");\n  else\n     System.out.println(\"No, activity\
  \ is not a GradedActivity.\");\n```\n\n这段代码将显示 `\"Yes, activity is a GradedActivity.\"\
  `\n\n`instanceof` 操作符理解类继承自另一个类时存在的“is-a”（是一个……）关系。例如，查看以下代码：\n\n```\n  FinalExam\
  \ exam = new FinalExam(20, 2);\n  if (exam instanceof GradedActivity)\n     System.out.println(\"\
  Yes, exam is a GradedActivity.\");\n  else\n     System.out.println(\"No, exam is\
  \ not a GradedActivity.\");\n```\n\n尽管 `exam` 引用的对象是一个 `FinalExam` 对象，这段代码也会显示 `\"\
  Yes, exam is a GradedActivity.\"`。`instanceof` 操作符返回 `true` 是因为 `FinalExam` 是 `GradedActivity`\
  \ 的子类。\n\n##### Checkpoint\n\n> 11.18 回顾之前讨论过的 `Rectangle` 和 `Cube` 类，如图 11-18 所示。\n\
