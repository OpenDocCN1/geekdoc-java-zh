  \n![Image](img/00010.jpg)\n\n## 7. 文件加密过滤器\n\n文件加密是用秘密代码编写文件内容的科学。你的加密程序应该像过滤器一样工作：读取一个文件的内容，将数据修改为代码，然后将编码后的内容写入第二个文件。第二个文件将是第一个文件的版本，但是用秘密代码编写的。\n\
  \n尽管有复杂的加密技术，但你应该自己设计一个简单的方案。例如，你可以每次一个字符地读取第一个文件，并在每个字符写入第二个文件之前，将其字符的编码加上 10。\n\
