  \ 构造函数在何时执行？它的目的是什么？\n\n## 编程挑战\n\n![Image](img/00010.jpg)\n\n### 1. 罗马数字\n编写一个程序，提示用户输入一个\
  \ 1 到 10 之间的数字。程序应该显示该数字的罗马数字版本。如果数字在 1–10 范围之外，程序应显示错误信息。\n\n### 2. 魔法日期\n1960\
  \ 年 6 月 10 日是一个特别的日子，因为当我们按照下面的格式书写它时，月份乘以日期等于年份：\n\n`6/10/60`\n\n编写一个程序，要求用户输入月份（数字形式）、日期和两位数的年份。程序应判断月份乘以日期是否等于年份。如果是，则应显示一条消息说明该日期是魔法日期；否则，应显示一条消息说明该日期不是魔法日期。\n\
  \n### 3. 体质指数\n编写一个程序计算并显示人的体质指数（BMI）。BMI 通常用于判断一个久坐生活方式的人对于其身高来说是超重还是偏轻。人的 BMI\
  \ 使用以下公式计算：\n\n```\nBMI = weight × 703 / height²\n```\n\n其中 `weight` 的单位是磅，`height`\
  \ 的单位是英寸。程序应显示一条消息，指示该人的是理想、偏轻还是超重。如果久坐者的 BMI 于 18.5 到 25 之间，则认为体重理想。如果 BMI 小于 18.5，则该人被认为偏轻。如果\
  \ BMI 值大于 25，则该人被认为超重。\n\n### 4. 测试分数与等级\n编写一个程序，拥有存储三个测试分的变量。程序应要求用户输入三个测试分，然后将输入的值赋给变量。程序应显示测试分的平均分以及根据该平均分分配的字母等级。请使用下表中的评分标准：\n\
  \n![Image](img/00196.jpg)\n\n### 5. 质量与重量\n科学家用千克测量对象的质量，用牛顿测量其重量。如果你知道一个对象的质量，可以使用以下公式计算其以牛顿为单位的重量：\n\
