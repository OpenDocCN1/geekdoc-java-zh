  \n### 12.3 高级主题：二进制文件、随机访问文件和对象序列化\n\n> 包含原始数据的文件称为二进制文件。二进制文件的内容不是格式化为文本，也不打算在文本编辑器中打开。随机访问文件是一种允许程序从文件中的任何位置读取数据，或向文件中的任何位置写入数据的文件。对象序列化是将对象转换为一系列字节并将其保存到文件的过程。反序列化是重构序列化对象的过程。\n\
  \n#### 二进制文件\n\n到目前为止，你处理的所有文件都是文本文件。这意味着存储在文件中的数据已格式化为文本。即使是数字，当使用 `print` 或 `println`\
  \ 方法存储在文本文件中时，也会转换为文本。例如，考虑以下程序段：\n\n```java\nPrintWriter outputFile = new PrintWriter(\"\
  Number.txt\");\nint x = 1297;\noutputFile.print(x);\n```\n\n最后一条语句将变量 `x` 的内容写入\
  \ `Number.txt` 文件。然而，当写入该数字时，它是作为字符 `'1'`、`'2'` 和 `'7'` 存储的。这在图 12-13](#dummy_split_019.html_filepos218214)\
  \ 中所示。\n\n**图 12-13** 以字符表示的数字 1297\n![Image](img/00947.jpg)\n\n当 1297 这样的数字存储在计算机内存中，它并不是以文本存储的。它被格式化为二进制数。图\
  \ 12-14](#dummy_split_019.html_filepos2182902) 显示了数字 1297 如何使用二进制存储在 `int` 变量中。回想\
  \ `int` 变量占用四个字节。\n\n**图 12-14** 内存中存储的二进制形式数字 1297\n![Image](img/00948.jpg)\n\n\
  图 12-14](#dummy_split_019.html_filepos2182902) 所示数字的二进制表示是原始数据存储在内存中的方式。事实上，这有时被称为原始二进制格式。数据可以以其原始二进制格式存储在文件中。包含二进制数据的文件通常被称为二进制文件。\n\
  \n以二进制格式存储数据比以文本存储更高效，因为转换的次数更少。此外，某些类型的数据应该以其原始二进制格式存储。图像就是一个例子。然而，当数据存储在二进制文件中时，你无法在记事本等文本编辑器中打开它。当文本编辑器打开文件时，它假设文件包含文本。\n\
  \n#### 向二进制文件写入数据\n\n向二进制文件写入数据需要创建以下类的对象：\n\n![Image](img/00949.jpg)\n\n你通过 `DataOutputStream`\
  \ 对象包装 `FileOutputStream` 对象来向二进制文件写入数据。以下代码显示了如何打开名为 `MyInfo.dat` 的文件进行二进制输出：\n\
  \n```java\nFileOutputStream fstream = new FileOutputStream(\"MyInfo.dat\");\nDataOutputStream\
  \ outputFile = new DataOutputStream(fstream);\n```\n\n第一行创建了 `FileOutputStream`\
  \ 类实例，它能够为二进制输出打开文件并建立连接。你将想要打开的文件名作为字符串传递给构造函数。第二行创建了与 `fstream` 所引连接的 `DataOutputStream`\
  \ 对象实例。该语句的结果是 `outputFile` 变量将引用一个能够向 `MyInfo.dat` 文件写入二进制数据的对象。\n\n![Image](img/00007.jpg)\n\
  \n***\n\n**警告！** 如果你用 `FileOutputStream` 对象打开的文件已经存在，它将被擦除并创建一个同名的空文件。\n\n***\n\n\
  ![Image](img/00005.jpg)\n\n***\n\n**注意：** 如果 `FileOutputStream` 构造函数在尝试打开文件时发生错误，将抛出\
  \ `IOException`。\n\n***\n\n\n\n\n\n如果不需要引用 `FileOutputStream` 对象，则这些语句可以合并为一条，如下所示：\n\
  \n```java\nDataOutputStream outputFile =\n    new DataOutputStream(new FileOutputStream(\"\
  MyInfo.dat\"));\n```\n\n一旦创建了 `DataOutputStream` 对象，你就可以使用它向文件写入二进制数据。表 12-1 列出了\
