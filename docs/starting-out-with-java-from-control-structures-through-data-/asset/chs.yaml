  \ 定期运行一种称为垃圾回收的过程，以移除不可达的对象**。\n\n当对象不再需要时，它应该被销毁。坦率地说，你不需要销毁对象。例如，查看以下代码：\n\n此代码使用了引用变量\
  \ `account1` 和 `account2`。创建一个 `BankAccount` 对象并由 `account1` 引用。然后将 `account1` 赋值给\
  \ `account2`，导致 `account2` 指向同一个对象。这在图 9-17 中所示。\n\n```\nBankAccount account1 =\
  \ new BankAccount(\"John Doe\", 100.0);\nBankAccount account2 = account1;\n```\n\
  \n图 9-17 `account1` 和 `account2` 引用同一个对象\n\n![Image](img/0699.jpg)\n\n接下来将 `null`\
  \ 值赋值给 `account1`。这从 `account` 中移除了对象的地址，使其不再引用该对象。\n\n```\naccount1 = null;\n```\n\
  \n图 9-18 对象仅被 `account2` 变量引用\n\n![Image](img/00700.jpg)\n\n然而，对象仍然可以访问，因为它被 `account2`\
  \ 变量引用。下一个语句将 `null` 赋值给 `account2`。这从 `account2` 中移除了对象的地址，使其不再引用该对象。\n\n```\n\
  account2 = null;\n```\n\n图 9-19 对象不再被引用\n\n![Image](img/00701.jpg)\n\n#### `finalize`\
  \ 方法\n\n> **概念：如果类有一个名为 `finalize` 的方法，该方法会在类实例被垃圾回收器销毁之前自动调用**。\n\n如果你希望在对象被销毁之前执行代码，可以在类中创建一个\
  \ `finalize` 方法并将代码放置在那里。`finalize` 方法不接受参数且返回类型为 `void`。\n\n![Image](img/00005.jpg)\n\
  \n* * *\n\n**注意：** 垃圾回收器是定期运行，你无法预测它何时执行。因此，你无法确切知道对象的 `finalize` 方法会在何时执行。\n\n\
  ## 9.11 关注面向对象的设计：类协作\n\n> **概念：类之间经常会相互作用或协作以执行其操作。面向对象设计过程的一部分是识别类与类之间的协作关系**。\n\
  \n\n\n\n在面向对象的应用程序中，不同类的对象之间进行协作是很常见的。这简单来说意味着对象之间在相互交互。有时，一个对象需要另一个对象的服务来完成它的职责。例如，假设一个对象需要从键盘读取一个数字，然后将该数字格式化为美元金额。该对象可能会使用\
  \ `Scanner` 对象的服务从键盘读取数字，然后使用 `DecimalFormat` 对象的服务对数字进行格式化。在这个例中，该对象正在与从 Java API\
  \ 类创建的对象进行协作。你从自己的类中创建的对象也可以彼此相互协作。\n\n如果一个对象要与另一个对象协作，那么它必须了解一些另一个对象的类方法以及如何调用这些方法。例如，假设我们要编写一个名为\
  \ `StockPurchase` 的类，它使用一个 `Stock` 类的对象（在本章前面介绍过）来模拟股票的购买。`StockPurchase` 类负责计算购买股票的成本。为了这一点，它必须知道如何调用\
  \ `Stock` 类的 `getSharePrice` 方法来获取股票的每股价格。代码列表 9-24 显示了 `StockPurchase` 类的一个示例。（此文件存储在源代码文件夹\
  \ 第 9 章\\StockPurchase Class 中，可以在 [www.pearsonhighered.com/gaddis](http://www.pearsonhighered.com/gaddis)\
  \ 获取。）\n\n#### 代码列表 9-24 (`StockPurchase.java`)\n\n![Image](img/00702.jpg)\n![Image](img/00703.jpg)\n\
  \n![Image](img/00704.jpg)\n\n该类的构造函数接受一个代表正在购买的股票的 `Stock` 对象，以及一个表示购买数量的 `int`。在第\
  \ 20 行，我们看到了第一次协作：`StockPurchase` 构造函数通过 `Stock` 类的拷贝构造函数创建了 `Stock` 对象的副本。拷贝构造函数在\
  \ `getStock` 方法（第 33 行）中被再次使用，用于返回 `Stock` 对象的副本。\n\n下一次协作发生在 `getCost` 方法中。该方法计算并返回购买股票的成本。在第\
  \ 53 行，它调用 `Stock` 类的 `getSharePrice` 方法来确定股票的每股价格。代码列表 9-25 展示了该类。（此文件也存储在源代码文件夹\
