  在程序中测试你的方法，显示以下方法调返回值：\n\n![Image](img/01204.jpg)\n\n### 10. 递归人口类\n\n在第 4 章的编程挑战\
  \ 9 中，你编写了一个人口类，用于预测若干天数后生物种群的大小。修改该类，使用递归方法代替循环来计算生物数量。\n\n\n\n\n\n通常，数组中的数据必须按照某种顺序进行排序。例如，客户列表通常按字母顺序排序。学生成绩可能从高到低排序。产品代码可以进行排序，以便所有相同颜色的产品存储在一起。为了对数组进行排序，程序员必须使用适当的`sorting\
  \ algorithm`。排序算法是一种扫描数组并按照特定顺序重新排列其内容的技术。\n\n数组中的数据可以按升序或降序排序。如果数组按`ascending order”（升序）排序，意味着数组中的值从低到高存储。如果值按`descending\
  \ order”（降序）排序，则从高到低存储。本节将介绍四种可以用于排序数组数据的排序算法：`bubble sort`、`selection sort`、`insertion\
  \ sort`以及`Quicksort`。\n\n## 泡泡排序\n\n泡泡排序是按升序或降序排列数据的简单方法。在本节中，我们将看到如何使用泡泡排序按升序排列数组。这种特定的算法被称为`bubble\
  \ sort`，是因为它对数组元素进行多次遍历，每次遍历中较大的值都会像“泡泡”一样向数组的末尾移动。\n\n***\n\n![Image](img/00009.jpg)\n\
  \n### 泡泡排序算法\n\n***\n\n假设我们有图 16-1 所示的数组。让我们看看如何使用泡泡排序将数组元素按升序排列。\n\n**图 16-1**\
  \ 一个数组\n\n![Image](img/01205.jpg)\n\n泡泡排序从比较数组中的前两个元素开始。如果`element 0`大于`element\
  \ 1`，则交换它们。交换后，数组将显示如图 16-2 所示。\n\n**图 16-2** 元素 0 和 1 交换\n\n![Image](img/01206.jpg)\n\
  \n此步骤对元素 1 和 2 重复执行。如果`element 1`大于`element 2`，则交换它们。此时数组将显示如图 16-3 所示。\n\n**图 16-3**\
  \ 元素 1 和 2 交换\n\n![Image](img/01207.jpg)\n\n接下来，比较元素 2 和 3。在这个数组中，这些元素已经处于正确的顺序（`element\
  \ 2`小于`element 3`），因此没有发生交换。随着循环继续，比较元素 3 和 4。再次，没有必要交换，因为它们已经处于正确的顺序。\n\n然而，当比较元素\
  \ 4 和 5 时，必须发生交换，因为`element 4`大于`element 5`。现在数组显示如图 16-4 所示。\n\n**图 16-4** 元素 4\
  \ 和 5 交换\n\n![Image](img/01208.jpg)\n\n此时此时，整个数组已经扫描完毕，最大值 9 已经处于正确的位置。然而，还有其他元素尚未处于最终位置。因此，我们再次对数组进行一次遍历，将每个元素与其邻接元素进行比较。在下一次遍历中，当我们到达倒数第二个元素时就可以停止比较，因为最后一个元素已经处于正确的位置。\n\
  \n第二次遍历从比较元素 0 和 1 开始。因为这两个元素处于正确的顺序，所以没有发生交换。接下来比较元素 1 和 2，但再次没有发生交换。这种情况一直持续，直到比较元素\
  \ 3 和 4。因为`element 3`大于`element 4`，它们被交换了。`Element 4` 是我们在本次遍历中将比较的最后一个元素，因此本次遍历停止。现在数组显示如图\
  \ 16-5 所示。\n\n**图 16-5** 元素 3 和 4 交换\n\n![Image](img/01209.jpg)\n\n在第二次遍历结束时，数组中的最后两个元素已处于正确的位置。现在开始第三次遍历，将每个元素与其邻接元素比较。然而，第三次遍历将不再最后两个元素，因为它们已经处于正确的位置。当第三次遍历完成时，最后三个元素也将被正确放置，如图\
  \ 16-6 所示。\n\n算法每次对数组进行遍历时，扫描的数组部分就会减少一个元素，数组扫描部分中的最大值将被移动到其最终位置。当完成所有遍历后，数组将显示如图\
  \ 16-7 所示。\n\n**图 16-6** 第三次遍历后的数组\n\n![Image](img/01210.jpg)\n\n**图 16-7** 所有元素都已排序的数组\n\
  \n![Image](img/01211.jpg)\n\n下面的伪代码显示了泡泡排序的逻辑。\n\n```\n每次算法每次对数组进行遍历时，扫描的数组部分就会减少一个元素，数组扫描部分中的最大值将被移动到其最终位置。\n\
  \nFor lastPos = array.length - 1 down to 0:\n    For index = 0 up through lastPos\
  \ - 1:\n        If array[index] > array[index + 1]:\n            temp = array[index]\n\
  \            array[index] = array[index + 1]\n            array[index + 1] = temp\n\
  ```\n\n代码列表 16-1 显示了`IntSorter`类，它有一个静态方法`bubbleSort`。你将一个 `int` 数组传递给该方法，它使用泡泡排序算法按升序排序数组。\n\
  \n```java\nclass IntSorter {\n    public static void bubbleSort(int[] array) {\n\
  \        int lastPos;\n        int index;\n        int temp;\n        for (lastPos\
  \ = array.length - 1; lastPos >= 0; lastPos--) {\n            for (index = 0; index\
  \ <= lastPos - 1; index++) {\n                if (array[index] > array[index + 1])\
  \ {\n                    temp = array[index];\n                    array[index]\
  \ = array[index + 1];\n                    array[index + 1] = temp;\n          \
  \      }\n            }\n        }\n    }\n}\n```\n\n代码列表 16-2 测试了该方法。\n\n```java\n\
  public class BubbleSortTest {\n    public static void main(String[] args) {\n  \
  \      int[] array = {5, 1, 3, 6, 4, 2};\n        System.out.println(\"Original\
  \ order:\");\n        for (int n : array) {\n            System.out.print(n + \"\
  \ \");\n        }\n        System.out.println();\n        IntSorter.bubbleSort(array);\n\
  \        System.out.println(\"Sorted order:\");\n        for (int n : array) {\n\
  \            System.out.print(n + \" \");\n        }\n        System.out.println();\n\
  \    }\n}\n```\n\n**程序输出**\n\n原始顺序：\n\n5 1 3 6 4 2 \n\n排序顺序：\n\n1 2 3 4 5 6 \n\n\
  #### 使用泡泡排序排序对象\n\n之前的示例演示了如何使用泡泡排序算法对 `int` 值数组进行排序。但是，假设我们有一个想要排序的对象数组。我们应该如何修改之前显示的\
  \ `bubbleSort` 方法使其能够处理对象呢？\n\n\n\n\n为了对对象数组进行排序，我们必须有一种一致的方法来比较对象。在 `IntBubbleSorter`\
  \ 类中，`bubbleSort` 方法的第 35 行比较了数组中的两个元素并判断其中一个是否大于另一个。由于该方法比较的是原始 `int` 值，因此它简单地使用大于号（`>`）运算符来比较这两个元素。然而，这种方法对于对象引用并不适用。引用变量只持有对象的地址，你不能使用大于号（`>`）或小于号（`<`）等运算符来比较它们。（即使你可以在对象引用上使用这些运算符，这样做也是意义的。当你比较两个对象时，你通常想比较这些对象中包含的数据。）\n\
  \nJava API 有一个名为 `Comparable` 的接口，这可以帮助解决此类问题。`Comparable` 接口位于 `java.lang` 包中，指定了一个名为\
  \ `compareTo` 的方法，该方法用于比较调用对象与作为参数的另一个对象。该方法返回一个 `int` 值，用于指定调用对象是大于（`>`）、小于（`<`）还是等于（`=`）作为参数传递的对象。\n\
  \nJava API 中的许多类都实现了此接口，包括 `String` 类及其包装类。你可能记得我们在第 3 章中讨论 `String` 类时提到过 `compareTo`\
  \ 方法是如何工作的：\n\n* 如果调用对象小于作为参数传递的的对象，该方法返回一个负数。\n* 如果调用对象等于作为参数传递的对象，该方法返回 0。\n*\
  \ 如果调用对象大于作为参数传递的对象，该方法返回一个正数。\n\n如果我们想写一个可以接受对象数组的 `bubbleSort` 方法，一个很好的解决方案是要求数组中的对象实现\
  \ `Comparable` 接口。这样，我们就可以使用 `compareTo` 方法来比较元素了。代码列表 16-3 显示了 `ObjectBubbleSorter`\
  \ 类，它拥有一个 `bubbleSort` 方法，可以对 `Comparable` 对象数组进行排序。\n\n### 代码列表 16-3 `(ObjectBubbleSorter.java)`\n\
  \n![Image](img/01215.jpg)\n\n![Image](img/01216.jpg)\n\n***\n\n![Image](img/00005.jpg)\n\
  \n**注意：** 如果你编译代码列表 16-3 中所示的类，你可能会看到如下警告：\n\n```\nObjectBubbleSorter.java uses\
  \ unchecked or unsafe operations.\nNote: Recompile with -Xlint:unchecked for details.\n\
  ```\n\n目前，忽略这个警告。在第 17 章中，当我们讨论泛型时，你将学会如何消除这些警告。\n\n***\n\n注意第 16 行，`bubbleSort`\
  \ 方法的参数被声明为 `Comparable[] array`。当我们调用此方法时，传递的参数必须是一个实现了 `Comparable` 的对象数组。第 36\
  \ 行中进行的比较如下：\n\n```\nif (array[index].compareTo(array[index + 1]) > 0)\n```\n\n\
  该语句使用 `array[index]` 对象的 `compareTo` 方法来确定它是否大于 `array[index + 1]` 处的对象。如果是，则交换这两个元素。（同时也注意\
  \ `temp` 变量的数据类型已经更改。它现在是一个 `Comparable` 引用变量。）\n\n由于 `String` 类实现了 `Comparable`\
  \ 接口，测试该方法的简单方法是向它传递一个 `String` 对象数组，如代码列表 16-4 所示。\n\n### 代码列表 16-4 `(ObjectBubbleSortTest.java)`\n\
  \n![Image](img/01217.jpg)\n\n![Image](img/01218.jpg)\n\n***\n\n### 程序输出\n\n原始顺序：\n\
  \nDavid Abe Katherine Beth Jeff Daisy\n\n排序后的顺序：\n\nAbe Beth Daisy David Jeff Katherine\n\
  \n当你设计自己的类时，并想要使用 `ObjectBubbleSorter` 类所示的 `bubbleSort` 方法对该类的对象进行排序时（代码列表 16-3），你的类必须实现\
  \ `Comparable` 接口并提供一个 `compareTo` 方法。在第 17 章泛型中，我们将仔细查看 `Comparable` 接口以及如何实现它。\n\
  \n### 选择排序\n\n*选择排序*的工作原理如下：找到数组中的最小值并将其移动到位置 0。然后，找到下一个较小的值并移动到位置 1。这个过程一直持续，直到所有元素都按照正确的顺序排列。让我们看看选择排序在安排图\
  \ 16-8 中的数组元素时是如何运作的。\n\n**图 16-8** 数组中的值\n\n![Image](img/01219.jpg)\n\n选择排序从位置\
  \ 0 开始扫描数组，找到值最小的元素。然后将这个最小元素与位置 0 处的元素交换。在这个例中，存储在位置 5 的 1 与存储在位置 0 的 5 交换。交换后，数组如图\
  \ 16-9 所示。\n\n**图 16-9** 第一次交换后数组中的值\n\n![Image](img/01220.jpg)\n\n然后，算法重复该过程，但因为位置\
  \ 0 处的元素已经是数组中的最小值，因此可以排除在过程之外。这次，算法从位置 1 开始扫描。在这个例中，位置 2 处的元素与位置 1 处的元素交换。然后，数组如图\
  \ 16-10 所示。\n\n**图 16-10** 第二次交换后数组中的值\n\n![Image](img/01221.jpg)\n\n再次重复该过程，但这次扫描从位置\
  \ 2 开始。算法发现位置 5 包含下一个最小值。该元素与位置 2 处交换，导致数组如图 16-11 所示。\n\n**图 16-11** 三次交换后数组中的值\n\
  \n![Image](img/01222.jpg)\n\n接下来，扫描从位置 3 开始。它的值与位置 5 处的值交换，导致数组如图 16-12 所示。\n\n\
  **图 16-12** 四次交换后数组中的值\n\n![Image](img/01223.jpg)\n\n此时，未排序部分只剩下两个元素。算法发现 5 小于位置\
  \ 4 处的值，因此交换了这两个。这使得数组达到了最终排列，如图 16-13 所示。\n\n**图 16-13** 五次交换后数组中的值\n\n![Image](img/01224.jpg)\n\
  \n以下是选择排序的伪代码：\n\n```\nFor startScan equals array 的每个下标 从 0\n  到倒数第二个下标\n    Set\
  \ index to startScan.\n    Set minIndex to startScan.\n    Set minValue to array[startScan]\n\
  \    For index is array 的每个下标 从 (startScan + 1)\n      到最后一个下标\n        If array[index]\
  \ is less than minValue\n          Set minValue to array[index].\n          Set\
  \ minIndex to index.\n        End If\n        Increment index.\n    End For\n  \
  \  Set array[minIndex] to array[startScan].\n    Set array[startScan] to minValue.\n\
  End For.\n```\n\n代码列表 16-5 显示了 `IntSelectionSorter` 类，它有一个公共静态方法 `selectionSort`。你向该方法传递一个\
