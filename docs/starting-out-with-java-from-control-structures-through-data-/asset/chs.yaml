  \ `Applet` 和 `Frame`\n\n`paint` 方法负责在屏幕上显示或“绘制”组件。当组件首次显示时，该方法会被自动调用，并在组件需要重新显示的任何时候再次被调用。例如，当组件被另一个窗口完全或部分遮挡，且遮挡窗口发生移动时，就会调用组件的\
