  ![Image](img/00156.jpg)\n\n如表所示，`&&` 运算符的双方都为 `true`，运算符才能返回 `true` 值。\n\n`&&` 运算符执行*短路求值*。其工作原理如下：如果\
  \ `&&` 运算符左侧的表达式为 `false`，则不会检查右侧的表达式。因为只要有一个子表达式为 `false`，整个表达式就是 `false`，所以检查剩余表达式将浪费\
  \ CPU 时间。因此，当 `&&` 运算符发现其左侧的表达式为 `false` 时，它会短路且不再评估其右侧的表达式。\n\n`&&` 运算符可以用于简化原本会使用嵌套\
  \ `if` 语句的程序。代码列表 3-7 中的程序是 代码列表 3-3 中 `LoanQualifier` 程序的另一个版本，它是为了使用 `&&` 运算符而编写的。图\
