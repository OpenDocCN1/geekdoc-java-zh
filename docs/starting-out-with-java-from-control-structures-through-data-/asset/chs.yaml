  \ = carMap.get(mustang.getVin());\n```\n\n这条语句创建了一个 `Car` 引用变量 `foundCar`，并将 `carMap.get`\
  \ 方法返回的值赋值给它。`get` 方法接受键作为参数，并返回该键所映射的值。在这条语句中，我们把野马的 VIN 作为参数传递。我们基本上是在告诉 `HashMap`：“给我与此\
  \ VIN 关联的 `Car` 对象。”如果在大 `HashMap` 中找到了该键，则该方法将返回与该键关联的值的引用。因为野马的 VIN 确实作为键存在 `HashMap`\
