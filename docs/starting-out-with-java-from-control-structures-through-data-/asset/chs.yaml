  \ 对象开始生成事件？\n\n> 14.34 你如何让 `Timer` 对象停止生成事件？\n\n## 14.8 播放音频\n\n> **概念：存储在音频文件中的声音可以在\
  \ Java 程序中播放。**\n\nJava applet 可以播放存储在各种声音文件格式中的音频。直接支持的格式如下：\n\n> • `aif` 或 `aiff`\
  \ (Mac 音频文件)\n> • `au` (Sun 音文件)\n> • `mid` 或 `rmi` (MIDI 文件)\n> • `wav` (Windows\
  \ 波文件)\n\n为了播放音频文件，你的电脑必须配备声卡和扬声器。播放音频文件的一种方法是使用 `Applet` 类的 `play` 方法。我们将使用的版本是：\n\
  \n`void play(URL baseLocation, String fileName)`\n\n传递给 `baseLocation` 的参数是指定文件位置的\
  \ `URL` 对象。传递给 `fileName` 的参数是文件名。记录在文件中的声音将播放一次。\n\n在调用 `play` 方法时，通常使用 `Applet`\
  \ 类中的 `getDocumentBase` 或 `getCodeBase` 方法来获取第一个参数的 `URL` 对象。`getDocumentBase` 方法返回包含调用\
  \ applet 的 HTML 文件位置的 `URL` 对象。以下是使用 `getDocumentBase` 作为第一个参数调用 `play` 方法的示例：\n\
  \n```java\nplay(getDocumentBase(), \"mysound.wav\");\n```\n\n该语句将加载并播放 *mysound.wav*\
  \ 文件，它与调用 applet 的 HTML 文件位于相同位置。\n\n`getCodeBase` 方法返回包含 applet 类文件位置的 `URL` 对象。其用法示例如下：\n\
  \n```java\nplay(getCodeBase(), \"mysound.wav\");\n```\n\n该语句将加载并播放 *mysound.wav*\
  \ 文件，它与 applet 的类文件位于相同位置。\n\n\n\n\n\n![Image](img/00005.jpg)\n\n* *\n\n**注意：**\
  \ 如果找不到 `play` 方法参数中指定的音频文件，则将不播放任何声音。\n\n* *\n\n### 使用 `AudioClip` 对象\n\n`Applet`\
  \ 类的 `play` 方法加载一个音频文件，播放一次，然后将其释放供垃圾回收。如果你需要加载一个要多次播放的音频文件，应该使用 `AudioClip` 对象。\n\
  \n`AudioClip` 对象是一个实现了 `AudioClip` 接口的对象。`AudioClip` 接口位于 `java.applet` 包中，它指明了以下三个方法：`play`、`loop`\
  \ 和 `stop`。`play` 方法播放一次声音。`loop` 方法重复播放声音，而 `stop` 方法导致声音停止播放。\n\n`Applet` 类的 `getAudioClip`\
  \ 方法可以如下所示为给定的音频文件创建一个 `AudioClip` 对象：\n\n`AudioClip getAudioClip(URL baseLocation,\
  \ String fileName)`\n\n传递给 `baseLocation` 的参数是一个 `URL` 对象，用于指定音频文件的位置；传递给 `fileName`\
  \ 的参数是文件名。该方法返回一个可以播放该音频文件的 `AudioClip` 对象。\n\n与之前一样，我们可以使用 `getDocumentBase` 或\
  \ `getCodeBase` 方法获取第一个参数的 `URL` 对象。这里是一个使用 `getAudioClip` 方法的语句示例：\n\n```\nAudioClip\
  \ clip = getAudioClip(getDocumentBase(), \"mysound.wav\");\n```\n\n该语句声明 `clip`\
  \ 为一个 `AudioClip` 引用变量。`getAudioClip` 方法返回的对象将加载 `mysound.wav` 文件，该文件存储在调用该 applet\
  \ 的 HTML 文件相同的位置。对象的地址将赋值给 `clip`。随后可以使用以下语句播放该音频文件：\n\n```\nclip.play();\n```\n\
  \n可以使用以下语句重复播放音频文件：\n\n```\nclip.loop();\n```\n\n在音频文件正在播放的任何时候，都可以以下语句停止它：\n\n\
  ```\nclip.stop();\n```\n\n在代码列表 14-23 所示的 `AudioDemo2` 类是一个使用 `AudioClip` 对象播放音频文件的\
  \ applet。可以使用 `AudioDemo2.html` 文件来启动该 applet。图 14-32 显示了 applet 的运行情况。Play 按钮调用\
