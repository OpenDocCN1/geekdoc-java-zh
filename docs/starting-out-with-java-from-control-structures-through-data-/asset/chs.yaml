  17. 抽象类不能 ________。\na. 作为父类使用\nb. 拥有抽象方法\nc. 被实例化\nd. 拥有字段\n\n18. **对或错:** 构造函数是不继承的。\n\
  \n19. **对或错:** 在子类中，对父类构造函数的调用可以在子类构造函数中。\n\n20. **对或错:** 如果子类构造函数没有显式地调用父类构造函数，Java\
  \ 将不会调用父类的任何构造函数。\n\n21. **对或错:** 父类的对象可以访问在子类中声明的成员。\n\n22. **对或错:** 父类构造函数在子类构造函数之前执行。\n\
  \n23. **对或错:** 当一个方法用 `final` 修饰符声明时，它必须在子类中被重写。\n\n24. **对或错:** 父类有一个具有包访问权限的成员。位于父类包之外但继承自父类的类可以访问该成员。\n\
  \n25. **对或错:** 父类引用变量可以引用扩展父类的子类对象。\n\n26. **对或错:** 子类引用变量可以引用父类的对象。\n\n27. **对或错:**\
  \ 当一个类包含抽象方法时，该类不能被实例化。\n\n28. **对或错:** 一个类只能实现一个接口。\n\n29. **对或错:** 默认情况下，接口的所有成员都是公共的。\n\
