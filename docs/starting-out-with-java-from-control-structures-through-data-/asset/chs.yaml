  \ 2.37 在使用 `JOptionPane` 类的程序中，你需要写什么 `import` 语句？\n\n## 2.15 需要避免的常见错误\n\n- **大括号、引号或括号不匹配**。在本章中，你看到构成类定义的语句被包含在一组大括号中。此外，你还看到方法中的语句也包含在一组大括号中。每一个左大括号在正确的位置都必须有一个右大括号。包裹字符串字面量的双双引号和包裹字符字面量的单引号也是如此。此外，在使用括号的语句（如数学表达式）中，你必须为每个左括号提供一个对应的右括号。\n\
  - **关键字拼写错误**。Java 将无法识别拼写错误的关键字。\n- **在关键字中使用大写字母**。请记住 Java 是一种区分大小写的语言，所有的关键字都用小写字母写。在关键字中使用大写字母等同于拼写错误关键字。\n\
  - **将关键字用变量名**。关键字被保留用于特殊用途；它们不能用于任何其他用途。\n- **变量名拼写不一致**。每当你使用一个变量名时，它的拼写必须与在声明语句中的形式完全一致。\n\
  - **变量名中的字母大小写不一致**。因为 Java 是一种区分大小写的语言，它能区分大写字母和小写字母。Java 将无法识别与声明语句中的形式不完全一致的变量名。\n\
  - **在变量名中插入空格**。变量名不允许包含空格。不要使用像 `gross` `pay` 这样两个单词的名称，而是使用一个单词，如 `grossPay`。\n\
  - **忘记语句结尾的分号**。在 Java 中，每个完整语句的末尾都有分号。\n- **将 `double` 字面量赋值给 `float` 变量**。Java\
  \ 是一种强类型语言，这意味着它只允许你在变量中存储兼容数据类型的值。所有浮点字面量都被视为 `double`，而 `double` 值与 `float` 变量不兼容。浮点字面量必须以字母\
  \ `f` 或 `F` 结尾才能存储在 `float` 变量中。\n- **在数字字面量中使用逗或其他货币符号**。数字字面量不能包含逗号或货币符号（如美元符号）。\n\
  - **无意中执行整数除法**。当除语句的两个操作数都是整数时，该语句的结果将是一个整数。如果有余数，余数将被丢弃。\n- **忘记对数学表达式的部分进行分组**。如果你在数学表达式中使用多个运算符，该表达式将根据运算顺序进行求值。如果你想更改运算符使用的顺序，必须使用括号对表达式的部分进行分组。\n\
  - **在复合赋值运算符中插入空格**。在构成复合赋值运算符两个运算符之间不能出现空格。\n- **当变量的数据类型与结果的数据类型不兼容时，使用变量接收计算结果**。接收计算结果的变量必须是与结果数据类型兼容的数据类型。\n\
  - **错误地终止多行注释或文档注释**。多行注释和文档注释通过 `*/` 字符终止。忘记在注释所需的处放置这些字符。\n\n\n\n\n\na. `nextString`\n\
