  \n#### *\n\n**程序输出**\n这里是 Point。\nX: 1.5\nY: 2.5\n这里是 Point。\nX: 10\nY: 20\n\n####\
  \ *\n\n**只有引用类型可以传递给类型参数**\n\n当你创建一个泛型类的实例时，可以通过在类名后的尖括号内来指定类型参数。例如：`Point<Integer>\
  \ myPoint = new Point<Integer>(intX, intY);`\n\n如果不指定类型参数，Java 会根据传递给构造函数的参数使用**类型推断**（type\
  \ inference）来确定类型参数。例如，在以下语句中：\n\n```java\nPoint myPoint = new Point(intX, intY);\n\
  ```\n\n编译器推断类型参数为 `Integer`，因为 `intX` 和 `intY` 的类型都是 `Integer`。这使得代码更加简洁且易读。\n\n\
  #### **自动装箱与自动拆箱**\n\n虽然我们只能向泛型类传递引用类型，但如果需要在泛型中存储原始类型，可以使用 Java 的自动装箱（autoboxing）和自动拆箱（unboxing）功能来简化代码。我们在[第\
  \ 10 章]中简要介绍了装箱和拆箱。\n\n*自动装箱*是 Java 将原始值“封装”进适当包装类对象的过程。例如，查看以下代码：\n\n```java\n\
  List<Integer> list = new ArrayList<>();\nlist.add(10);\n```\n\n在语句 `list.add(10)`\
  \ 中，原始值 `10` 在传递给 `add()` 方法之前会被自动装箱为 `Integer` 对象。`add()` 方法期望接收一个 `Integer` 类型的对象。\n\
  \n*自动拆箱*是装箱的反过程。它是根据需要将包装类对象转换为原始类型的过程。例如，查看以下代码：\n\n```java\nint x = list.get(0);\n\
  ```\n\n在语句 `int x = list.get(0)` 中，`get()` 方法返回一个 `Integer` 对象，然后它被自动拆箱为原始值 `int`\
  \ 并赋值给变量 `x`。\n\n**注意**：自动装箱和拆箱是在 Java 5 中引入 Java 语言的。之前的 Java 版本不支持此功能。\n\n####\
  \ **在不指定类型参数的情况下实例化泛型类**\n\n\n\n虽然不推荐这样做，但可以在不提供类型参数的情况下创建泛型类的实例。当你这样做时，你正在将该类作为`原始类型`（raw\
  \ type）使用。例如，查看代码列表 17-4 中的程序。（该程序存储在源代码 `Chapter 17\\Point Class Version 1.` 中。）\n\
  \n### 代码列表 17-4 `(TestPoint2.java)`\n\n![Image](img/01288.jpg)\n\n***\n\n### 程序输出\n\
  \n`X Coordinate: 1`\n\n`Y Coordinate: 7.5`\n\n***\n\n使用第 17 行的语句创建了 `Point` 类的实例：\n\
  \n```java\nPoint myPoint = new Point(x, y);\n```\n\n注意，尖括号中没有提供类型参数。当为泛型类的实例提供类型参数时，Java\
  \ 将默认提供 `Object` 作为类型参数。这意味着对于 `myPoint` 对象，`xCoordinate` 和 `yCoordinate` 字段的声明将变为如下：\n\
  \n```java\nprivate Object xCoordinate; // X 坐标\nprivate Object yCoordinate; // Y\
  \ 坐标\n```\n\n同样，类方法中每次出现的 `T` 都将变为 `Object`。\n\n![Image](img/00005.jpg)\n\n***\n\
  \n**注意：** 如果你编译代码列表 17-4 所示的 `TestPoint2.java` 程序，你将看到如下的警告：\n\n```\nTestPoint2.java\
  \ uses unchecked or unsafe operations.\nNote: Recompile with -Xlint:unchecked for\
  \ details.\n```\n\n从 Java 5 开始，当我们编译未指定类型参数而实例化泛型类的代码时，Java 编译器会发出此警告。\n\n***\n\n\
  不建议在不提供类型参数的情况下实例化泛型类，因为你放弃了本可以获得的类型安全优势。例如，在代码列表 17-4 的第 17 行中，一个 `Integer` 对象作为\
  \ X 坐标传递给 `Point` 类的构造函数，一个 `Double` 对象作为 Y 坐标传递。这是合法的，因为构造函数的参数变量是 `Object` 类型，我们可以多态地向它们传递任何类型的引用。\n\
  \n这同时也意味着该类的 `xCoordinate` 和 `yCoordinate` 字段可以引用任何类型的对象。如果我们尝试对该类的字段之一执行不支持的操作，就会为运行时错误打开大门。\n\
  \n我们我们应该避免在不提供类型参数的情况下实例化泛型类的另一个原因是，我们必须使用强制转换运算符将 `Object` 引用赋值给任何其他类型的变量。下面的代码说明了这一点：\n\
  \n```java\n// 创建一个 Integer 和一个 Double。\nInteger x = new Integer(1);\nDouble y =\
  \ new Double(7.5);\n// 创建一个没有类型参数的 Point 对象。\nPoint myPoint = new Point(x, y);\n\
  // 获取 X 和 Y 坐标。\nInteger xx = (Integer) myPoint.getX();\nDouble yy = (Double) myPoint.getY();\n\
  ```\n\n这里显示的最后两个语句使用 `myPoint` 对象调用了 `getX` 和 `getY` 方法。由于这些方法返回的是 `Object` 引用，我们必须将引用转换为正确的类型，以便将其赋值给变量。当我们使用类型参数实例化\
  \ `Point` 类时，这是不必要的。\n\n#### 常用的类型参数名称\n\n我们所检查的泛型 `Point` 类定义了一个名为 `T` 的类型参数。`T`\
  \ 这个名字并没有什么神奇之处。当你定义泛型类型参数时，可以使用任何你喜的合法标识符。但是，根据惯例，类型参数通常是大写的单个字母。这有助于区分类型参数名与类名。此外，根据类型参数的用途，还有一些常用的名称。表\
  \ 17-1 列出了常用的参数名称并简要描述了它们的含义。\n\n**表 17-1** 常用类型参数名称\n\n![Image](img/01289.jpg)\n\
  \n随着本章的学习，你将看到这些类型参数名称被多次使用。\n\n##### ![Image](img/00004.jpg)Checkpoint\n\n> 17.5\
  \ 什么是类型参数？\n> 17.6 当你创建泛型类的实例时，可以传递引用类型、基本数据类型吗？\n> 17.7 是否可以在不提供类型参数的情况下创建泛型类的实例？\n\
  > 17.8 类型参数必须是大写的单个字母吗？\n\n### 传递泛型类的对象\n\n此时，你已经了解了一些关于继承的知识，你可能会这样想：“我刚刚检查了 Java\
  \ API，发现所有数值类都继承自 `Number` 类。为什么不使用 `Number` 作为方法参数的类型参数呢？这样我们就可以利用多态来接受类型参数自 `Number`\
  \ 的任何 `Point` 对象。”\n\n换句话说，为什么不这样写 `printPoint` 方法呢？\n\n![Image](img/0190.jpg)\n\
  \n遗憾的是，这并不能给我们想要的结果。Java 编译器将*仅*允许向此方法传递 `Point<Number>` 对象。如果我们尝试传递 `Point<Integer>`\
  \ 或 `Point<Double>` 对象，将在编译时得到错误。\n\n解决我们问题的一种方法是在参数中使用 `?` 类型通配符，如下：\n\n![Image](img/0192.jpg)\n\
  \n注意参数的类型是 `Point<?>`。出现在尖括号内的 `?` 字符是*类型通配符*，它表示在该位置可以使用任何类型参数。现在，我们可以将任何 `Point`\
  \ 对象作为参数传递给方法，无论其类型参数是什么。以下语句将编译并执行而无错误：\n\n```java\nPoint<Integer> iPoint = new\
  \ Point<Integer>(1, 2);\nPoint<Double> dPoint = new Point<Double>(1.5, 2.5);\nprintPoint(iPoint);\n\
  printPoint(dPoint);\n```\n\n#### 约束类型参数\n\n回想我们原始版本的 `printPoint` 方法头看起来如下：\n\n\
  ```java\npublic static void printPoint(Point<Integer> point)\n```\n\n由于参数类型 `Point<Integer>`\
  \ 过于严格，我们将方法头更改为：\n\n\n\n\n\n```java\npublic static void printPoint(Point<?> point)\n\
  ```\n\n该方法现在允许我们传递任何 `Point` 对象作为参数传递。然而，这导致了另一个问题：参数的新类型 `Point<?>` 可能没有足够的限制性。假设我们只想接受类型参数为数值包装类的\
  \ `Point` 对象。换句话说，我们只想接受类型参数为 `Number` 的子类的 `Point` 对象。这可以通过再次修改该方法来实现，如下所示：\n\n\
  ![Image](img/01293.jpg)\n\n在方法的这个版本中，参数的类型是 `Point<? extends Number>`。这意味着 `Point`\
  \ 对象的类型参数可以是 `Number`，也可以是任何扩展 `Number` 的类型。以下语句将通过编译并执行，不会产生错误：\n\n```java\nPoint<Integer>\
  \ iPoint = new Point<Integer>(1, 2);\nPoint<Double> dPoint = new Point<Double>(1.5,\
  \ 2.5);\nprintPoint(iPoint);\nprintPoint(dPoint);\n```\n\n然而，以下代码将无法编译，因为 `String`\
  \ 类不是 `Number` 的子类：\n\n```java\nPoint<String> sPoint = new Point<String>(\"1\",\
  \ \"2\");\nprintPoint(sPoint); // Error!\n```\n\n代码列表 17-5 显示了 `TestPoint3.java`\
  \ 程序，它演示了此版本的 `printPoint` 方法。（该程序存储在源代码文件夹 `Chapter 17\\Point Class Version 1.`\
  \ 中）。\n\n**代码列表 17-5 `(TestPoint3.java)`**\n\n![Image](img/01294.jpg)\n\n***\n\n\
  ### 程序输出\n\n```\niPoint:\nCoordinate: 1\nCoordinate: 2\ndPoint:\nCoordinate: 1.5\n\
  Coordinate: 2.5\nlPoint:\nCoordinate: 10\nCoordinate: 20\nfPoint:\nCoordinate: 7.9\n\
  Coordinate: 9.9\n```\n\n***\n\n![Image](img/00005.jpg)\n\n***\n\n**注意：** 在第 12 行中，作为参数传递给\
  \ `Point` 类构造函数的值是 `10L` 和 `20L`。“L”后缀告诉编译器将这些字面量视为长整型（long）。如果没有“L”后缀，这些字面量将被视为\
  \ `int` 值，并会导致错误。同样，在第 13 行中，值 `7.9f` 和 `9.9f` 被作为参数传递给构造函数。“f”后缀告诉编译器将这些字面量视为 `float`\
  \ 值。如果没有“f”后缀，这些字面量将被视为 `double` 值并会导致错误。\n\n***\n\n### 在方法头中定义类型参数\n\n在之前的示例中，你看到\
  \ `<? extends Number>` 符号表示“任何是 `Number` 或 `Number` 的子类的类型”。作为在此表示法中使用通配符的替代方案，你实际上可以在方法头中定义一个类型参数。例如，`printPoint`\
  \ 方法可以写如下：\n\n```java\npublic static <T extends Number> void printPoint(Point<T>\
  \ point)\n{\n    System.out.println(\"X Coordinate: \" + point.getX());\n    System.out.println(\"\
  Y Coordinate: \" + point.getY());\n}\n```\n\n注意在 `static` 和 `void` 单词之间出现了 `<T extends\
  \ Number>` 符号。这定义了一个名为 `T` 的类型参数，并指定 `T` 可以接受任何是 `Number` 或 `Number` 的子类的类型。然后注意方法的参数类型是\
  \ `Point<T>`。这意味着该方法可以接受任何类型参数为 `Number` 或 `Number` 的子类的 `Point` 对象。\n\n使用这种替代方案可以将类型限制在一组边界范围内。例如，看以下内容：\n\
  \n\n\n\n\n```java\npublic static <E extends Number> void displayArray(E[] array)\n\
  \    {\n        for (E element : array)\n            System.out.println(element);\n\
  \    }\n```\n\n在方法的这个版本中，我们将类型参数 `E` 限制为任何 `Number` 类型或 `Number` 的子类。在调用此版本的方法时，我们只能传递\
  \ `Number` 对象的数组，或者 `Number` 子类对象的数组。\n\n##### !![Image](img/00004.jpg) **检查点**\n\
