  \n***\n\n# 第 18 章 集合\n\n### 课题\n\n***\n\n* 18.1 Java 集合框架简介\n* 18.2 列表 (Lists)\n\
  * 18.3 集合 (Sets)\n* 18.4 映射 (Maps)\n* 18.5 `Collections` 类\n* 18.6 需要避免的常见错误\n\n\
  ***\n\n### 18.1 Java 集合框架简介\n\n**概念：Java API 提供了大量的接口和类，允许你创建集合，集合是作为其他对象组容器的对象。**\n\
  \n应用程序创建一组对象并在整个执行过程中与该组进行操作是很常见的。例如，假设老师使用一个应用程序来管理学生成绩。该应用程序可能会创建 `Student` 对象，每个对象持有关于学生的信息。另一个例子是工资发放应用程序，它创建\
  \ `Employee` 对象，每个对象持有关于员工的信息。\n\n在编程中，对一组对象的操作非常常见，因此 Java API 专门为此此目的提供了一组接口和类。这些位于\
  \ `java.util` 包中的接口和类被称为 Java 集合框架（JCF）。你可以使用这些接口和类来创建集合，即作为容器的对象。你可以使用集合来存储一组对象。存储在集合中的每个对象被称为元素（element）。集合还允许检索对象并对该组对象执行排序和搜索等有用操作。\n\
  \n#### 列表、集合和映射\n\n有三种类型的集合：列表 (Lists)、集合 (Sets) 和映射 (Maps)。这里描述了其中每一种：\n\n*   **列表\
  \ (List)**：列表按有序序列存储元素。列表中的每个元素可以通过其索引访问，索引即它在列表中的位置。元素可以添加到列表末尾，也可以插入到指定位置。还可以从列表中移除特定位置的元素。列表可以存储重复元素。\n\
  *   **集合 (Set)**：集合针对搜索进行了优化。它的设计目的是让你能够在大量数据中快速找到某个值。集合按无序序列存储元素。这意味着你无法控制元素在集合中所占的位置。集合不允许重复，因此集合中的每个元素必须是唯一的。\n\
  *   **映射 (Map)**：映射中的每个元素由两部分组成：键（key）和值（value）。每个键都关联一个特定的值，并用于定位该值。例如，假设我们希望在映射中存储员工姓名，并根据其\
  \ ID 号搜索特定的员工。每当我们把员工姓名作为值存储在映射中时，也会将该员工的 ID 号作为键存储。映射在值和键之间建立了关联，并允许我们通过搜索 ID 号来检索姓名。\n\
  \n#### JCF 中的列表和集合\n\n图 18-1 显示了 JCF 层次结构的部分内容。此图显示了用于创建列表和集合的接口以及许多类。\n\n#### 接口\n\
  \n\n\n\n\n注意，`Collection` 接口位于图表的顶部。该接口规定了列表或集合等集合的基本操作。`List` 和 `Set` 接口规定了列表和集合的基本操作。这些接口使用继承来扩展\
  \ `Collection` 接口，因此它们继承了在 `Collection` 中指定的方法。（因为它们扩展了 `Collection` 接口，所以它们被称为\
  \ `Collection` 的`子接口`。）`Set` 接口有一个子接口：`SortedSet`。`SortedSet` 接口规定了排序集合的操作，它是集合的一种特殊类型。\n\
  \n### 抽象类\n\n在图 18-1 中接口的下方下方出现了四个抽象类：`AbstractCollection, AbstractList, AbstractSet`\
  \ 和 `AbstractSequentialList`。这些抽象类分别实现了 `Collection, List` 或 `Set` 接口之一。回想第 11 章的内容，抽象类不能被实例化。相反，抽象类旨在作为其他类可以扩展的超类。JCF\
  \ 中的抽象类为它们实现的接口所指定的大多数方法提供了实际的方法定义。提供这些抽象类是为了为创建自己的列表或集合类的开发者提供便利。开发者可以编写扩展这些抽象类之一的类，并继承它定义的方法。这比编写一个直接实现\
  \ JCF 接口之一的类，然后为接口中指定的所有方法编写定义要容易得多。\n\n**图 18-1** JCF 层次结构的一部分\n\n![Image](img/01330.jpg)\n\
  \n### 具体类\n\n虽然开发者可以编写自己的扩展 JCF 抽象类的类，但通常很少有必要。JCF 还提供了扩展这些抽象类的普通类。因为它们是可以实例化的普通类，所以它们通常被称为`具体类`。\n\
  \n在图 18-1 中抽象类的下方，你可以看到这六个具体类：`LinkedList, ArrayList, Vector, HashSet, LinkedHashSet`\
  \ 和 `TreeSet`。这些具体类中的每一个都是列表或集合的特定类型，并且可以在你的程序中实例化。事实上，你已经在第 8 章和第 17 章中见过 `ArrayList`\
  \ 类。我们将在本章后续部分详细查看这些具体类。\n\n### JCF 中的 Map\n\n你刚刚了解到 `List` 和 `Set` 接口规定了列表和集合的基本操作，并且这两个接口扩展了\
  \ `Collection` 接口。列表和集合非常相似，共享许多相同的基本操作。\n\nJCF 还提供了 `Map` 接口，它规定了映射的基本操作。然而，`Map`\
  \ 接口并没有扩展 `Collection` 接口。这是因为映射的基本操作与列表和集合不同。列表或集合中的元素是一个对象，但映射中的元素由两个对象组成：一个值，一个用于键。因此，JCF\
  \ 提供了另一组接口和类来创建映射。图 18-2 显示了映射接口和类之间的关系。\n\n**图 18-2** JCF 层次结构的一部分\n\n![Image](img/01331.jpg)\n\
  \n图表的顶部是 `Map` 接口。`Map` 接口有一个子接口：`SortedMap`。`SortedMap` 接口规定了名为排序映射的特殊类型映射的操作。\n\
  \n图中显示了一个抽象类：`AbstractMap`。提供这个抽象类是为了为创建自己的映射类的开发者提供便利。它实现了 `Map` 接口，并为 `Map` 接口指定的大多数方法提供了实际的方法定义。\n\
  \n在 `AbstractMap` 类下面有三个具体类：`HashMap, LinkedHashMap` 和 `TreeMap`。这些具体类中的每一个都是映射的特定类型，并且可以在你的程序中实例化。我们将在本章晚些时候详细查看这些类。\n\
  \n### Collections 支持泛型类型\n\nJCF 中所有的接口和类都支持泛型类型。当你实例化集合类时，可以使用泛型表示法来指定你将存储在类中的对象类型。Java\
  \ 编译器随后将确保只有指定类型的对象被存储在集合中。\n\n### Collection 接口和 AbstractCollection 类\n\n`Collection`\
  \ 接口规定了任何列表或集合必须支持的基本操作。简而言之，它规定了添加元素、删除元素、搜索元素、将集合转换为数组以及对集合执行各种测试的方法。图 18-3 显示了\
  \ `Collection` 接口的 UML 图，表 18-1 描述了 `Collection` 接口中指定的每个方法。\n\n**图 18-3** `Collection`\
  \ 接口\n\n![Image](img/01332.jpg)\n\n**表 18-1** `Collection` 接口指定的方法\n\n![Image](img/01333.jpg)\n\
  \n![Image](img/01334.jpg)\n\n#### 迭代器 (Iterators)\n\n注意 `Collection` 接口中的 `iterator`\
  \ 方法返回一个 `Iterator` 对象的引用。`iterator` 是一个可以一个接一个地检索集合中元素的对象。通常，你在循环中使用迭代器。在循环的每次迭代中，迭代器从集合中检索不同的元素。迭代器通常与集合配合使用，JCF\
  \ 提供了 `Iterator` 接口，它规定了迭代器的基本操作。在本章的后续部分，你将详细查看迭代器。\n\n#### AbstractCollection\
  \ 类\n\n如前所述，`AbstractCollection` 类实现了 `Collection` 接口，旨在作为其他列表或集合类的超类。`AbstractCollection`\
  \ 类为除 `iterator` 和 `size` 之外的所有 `Collection` 方法提供了默认方法定义。这两个方法必须在扩展 `AbstractCollection`\
  \ 的类中实现。\n\nJCF 中所有的具体列表类和集合类都使用 `AbstractCollection` 作为超类。在本章中，我们不会直接操作 `AbstractCollection`，但我们将使用继承自它的具体类。\n\
  \n### ![Image](img/00004.jpg) 检查\n\n> 18.1 Java 集合框架中的接口和类属于哪个包？\n\n> 18.2 三种通类型的集合是什么？\n\
  \n> 18.3 描述列表和集合之间的区别。\n\n> 18.4 映射的元素由几个部分组成？它们是什么？\n\n> 18.5 `List` 和 `Set` 接口扩展了哪个其他接口？\n\
  \n> 18.6 JCF 中像 `AbstractList, AbstractSet` 和 `AbstractMap` 这样的抽象类的作用是什么？\n\n> 18.7\
  \ 什么是迭代器？\n\n### 18.2 列表 (Lists)\n\n> **概念: 列表是一种按顺序存储其元素的集合。列表中的每个元素都可以通过其索引（即元素在列表中的位置）来访问**。\n\
  \n列表是一个类似于无固定大小数组的对象。当你向列表中添加元素时，它会动态增长大小以容纳新元素。\n\n\n\n\n\n列表中的每个元素都可以通过索引访问，索引是元素在列表中的位置。列表中的第一个元素存储在位置\
  \ 0 处，因此其索引为 0。下一个元素的索引为 1，依此类推。当你向列表添加元素时，可以将其附加到列表末尾，也可以将其插入到特定的位置。也可以从列表中移除特定位置的元素。列表中可以存储重复的元素。\n\
  \n## `List` 接口\n\n`List` 接口规定了列表必须支持的操作。它扩展了 `Collection` 接口，因此继承了 `Collection`\
  \ 指定的所有方法。它还添加了专门用于处理列表的额外方法。简单来说，`List` 接口规定了用于以下操作的方法：\n\n> • 在特定索引处添加元素\n> •\
  \ 从特定索引处检索元素\n> • 修改特定索引处元素的值\n> • 移除特定索引处的元素\n> • 在列表中搜索元素并获取其索引号\n> • 将列表的一小部分作为子列表检索\n\
  \n[图 18-4] 显示了 `List` 接口的 UML 图。`List` 接口指定的方法在[表 18-2] 中描述。\n\n**图 18-4** `List`\
  \ 接口\n\n![Image](img/01335.jpg)\n\n**表 18-2** `List` 接口指定的方法\n\n![Image](img/01336.jpg)\n\
  ![Image](img/01337.jpg)\n![Image](img/01338.jpg)\n![Image](img/00005.jpg)\n\n注意：`List`\
  \ 接口继承了 `Collection` 接口中的所有方法，包括以下：\n\n```\nboolean add(E o)\nboolean addAll(Collection<?\
  \ extends E> c)\n```\n\n当在 `List` 对象上调用这些继承的方法时，添加到列表中的元素将附加到列表的末尾。\n\n## `AbstractList`\
  \ 类\n\n`AbstractList` 类扩展了 `AbstractCollection` 类，并实现了 `List` 接口。它作为其他列表类的抽象父类。`AbstractList`\
  \ 类为所有 `List` 方法提供了默认方法定义，但 `get` 和 `size` 除外。（`size` 方法是由 `Collection` 接口指定的）。在扩展\
  \ `AbstractList` 的类中必须实现这两个方法。\n\n## `ArrayList` 类\n\n你已经遇到过 `ArrayList` 类，它是 JCF\
  \ 中的一个具体列表类。`ArrayList` 扩展了 `AbstractList` 类。`ArrayList` 类拥有 `List` 和 `Collection`\
  \ 接口指定的所有方法，以及构造函数和一些额外方法。[表 18-3] 描述了这些额外方法。\n\n`ArrayList` 对象可以动态增长大小，以适应存储在其中的对象数量。在内部，`ArrayList`\
  \ 类在数组中存储对象。当你使用无参构造函数创建 `ArrayList` 对象时，对象的内部数组将有十个元素。因此，你可以在 `ArrayList` 中存储十个对象而不会导致其调整大小。然而，当你在\
  \ `ArrayList` 中存储第十一个对象时，它创建一个更大的内部数组，并将原始数组的内容复制其中。然后将第十一个对象添加到新数组中。\n\n**表 18-3**\
  \ `ArrayList` 类中的额外方法\n\n![Image](img/01339.jpg)\n\n[代码列表 18-1] 中的程序演示了如何实例化 `ArrayList`\
  \ 类、使用 `add` 方法将对象添加到列表中、使用 `size` 方法获取列表中的元素数量以及使用 `get` 方法从列表中检索对象。\n\n**代码列表\
  \ 18-1 (`ArrayListDemo1.java`)**\n\n![Image](img/01340.jpg)\n\n**程序输出**\n```\nThe\
  \ ArrayList has 4 objects stored in it.\nThe name stored at Element 0 is Chris\n\
  The name stored at Element 1 is David\nThe name stored at Element 2 is Katherine\n\
  The name stored at Element 3 is Kenny\n```\n\n### 使用接口变量引用集合\n\n仔细查看[代码列表 18-1]中第\
  \ 12 行的语句：\n\n```\nList<String> nameList = new ArrayList<String>();\n```\n\n注意 `nameList`\
  \ 是一个 `List` 变量，而不是 `ArrayList` 变量。由于 `ArrayList` 类实现了 `List` 接口，我们可以使用 `List` 变量来引用一个\
  \ `ArrayList` 对象。这是一种常见的做法。通过始终使用接口变量来引用集合对象，如果以后以后需要使用不同的具体类来创建对象，我们的代码将更容易维护。例如，回想[图\
  \ 18-1]，`ArrayList` 和 `Vector` 类实现了 `List` 接口。这些类中的每一个都可以用于创建列表。但在内部，这些类处理列表操作的方式存在差异（我们很快就会学习这些差异）。假设我们写一个程序，首先使用\
  \ `ArrayList` 存储大量的 `String` 对象。我们使用以下语句实例化 `ArrayList`：\n\n```\nList<String> myList\
  \ = new ArrayList<String>();\n```\n\n此外，假设在程序我们将 `ArrayList` 对象作为参数传递给许多方法。每个方法都使用\
  \ `List` 变量作为参数，如下：\n\n```java\npublic void displayList(List<String> somelist) {\n\
  \    // 方法代码\n}\n```\n\n一旦运行程序，我们发现由于不断插入大量对象，`ArrayList` 运行很慢。经过研究，我们发现 `LinkedList`\
  \ 类在这种情况下更快，因此我们决定使用它代替 `ArrayList`。由于 `LinkedList` 类也实现了 `List` 接口，而且我们只使用 `List`\
  \ 变量来引用列表，因此更改非常简单。在实例化对象的语句中，我们只需要将 `ArrayList` 改为 `LinkedList`，如下：\n\n```\nList<String>\
  \ myList = new LinkedList<String>();\n```\n\n程序的其他部分不需要更改，因为我们只使用 `List` 变量来引用列表。\n\
  \n## 使用迭代器从列表获取元素\n\n之前我们提到迭代器是一个可以逐个检索集合元素的对象。回想 `Collection` 接口中的 `iterator` 方法返回一个\
  \ `Iterator` 对象。`Iterator` 是 JCF 中的一个接口，规定了迭代器必须执行的基本操作。[图 18-5] 显示了 `Iterator`\
  \ 接口的 UML 图，[表 18-4] 描述了指定的方法。\n\n**图 18-5** `Iterator` 接口\n\n![Image](img/01341.jpg)\n\
  \n从[表 18-2] 注意 `List` 接口指定了以下两个方法，每个方法都返回 `ListIterator` 对象的引用：\n\n```\nListIterator<E>\
  \ listIterator()\nListIterator<E> listIterator(int index)\n```\n\n`ListIterator`\
  \ 是 JCF 中的一个扩展了 `Iterator` 接口的接口。`ListIterator` 对象特殊的迭代器，专门为列表设计。虽然 `Iterator` 对象只能向一个方向（向前）移动，但\
  \ `ListIterator` 对象可以在列表的两个方向（向前或向后）移动。[图 18-6] 显示了 `ListIterator` 接口的 UML 图，[表\
  \ 18-5] 描述了指定的方法。\n\n**表 18-4** `Iterator` 接口指定的方法\n\n![Image](img/01342.jpg)\n\n\
  **图 18-6** `ListIterator` 接口\n\n![Image](img/01343.jpg)\n\n\n\n\n当你需要一个列表迭代器来遍历列表中的所有元素时，你不需要自己实例化列表迭代器。相反，你应该调用\
  \ `List` 对象的 `listIterator` 方法之一，该方法会为你创建一个列表迭代器。从 `listIterator` 方法返回的列表迭代器已经准备好与该列表配合使用。代码列表\
  \ 18-2 中的程序演示了如何使用 `ArrayList` 实现这一操作。\n\n### 表 18-5 由 `ListIterator` 接口定义的方法（除继承自\
  \ `Iterator` 的方法外）\n\n![Image](img/01344.jpg)\n\n### 代码列表 18-2 (`ListIteratorDemo1.java`)\n\
  \n![Image](img/01345.jpg)\n\n#### 程序输出\n\n`Chris`\n`David`\n`Katherine`\n`Kenny`\n\
  \n第 21 行的语句从 `ArrayList` 对象中获取一个列表迭代器的引用，并将其赋值给变量 `it`：\n\n```\n  ListIterator it\
  \ = nameList.listIterator();\n```\n\n从 `listIterator` 方法返回的列表迭代器已准备好与 `ArrayList`\
  \ 配合使用。它位于 `ArrayList` 的第一个元素处，如图图 18-7 所示。该元素是第一次调用列表迭代器的 `next` 方法时将返回的元素。\n\n\
  从第 24 行开始的 `while` 循环只要列表迭代器的 `hasNext` 方法返回 `true`，就会继续迭代：\n\n```\n  while (it.hasNext())\n\
  ```\n\n如果调用 `next` 方法将返回元素的引用，则 `hasNext` 方法返回 `true`。在循环内部的第 26 行，调用了列表迭代器的 `next`\
  \ 方法，该方法返回一个对象的引用。该引用被传递给 `System.out.println`：\n\n```\n  System.out.println(it.next());\n\
  ```\n\n### 图 18-7 `ListIterator` 位于 `ArrayList` 的第一个元素处\n\n![Image](img/01346.jpg)\n\
  \n第一次调用列表迭代器的 `next` 方法时，将返回包含 `\"Chris\"` 的对象，列表迭代器在 `ArrayList` 中的位置将移动到下一个元素。现在列表迭代器位于\
  \ `ArrayList` 的第二个元素处，如图图 18-8 所示。\n\n### 图 18-8 `ListIterator` 位于 `ArrayList` 的第二个元素处\n\
  \n![Image](img/01347.jpg)\n\n再次调用 `next` 方法时，它将返回包含 `\"David\"` 的对象的引用，列表迭代器将移动到第三个元素。这个过程一直持续，直到\
  \ `ArrayList` 中的最后一个元素被 `next` 方法返回为止。在此时，列表迭代器将位于 `ArrayList` 最后一个元素的之后，如图图 18-9\
  \ 所示。当列表迭代器处于此位置时，调用 `hasNext` 将返回 `false`，导致循环终止。\n\n![Image](img/00005.jpg)\n\n\
  **注意：** 如果你在迭代器位于列表最后一个元素之后时调用 `next` 方法，该方法将抛出 `NoSuchElementException`。\n\n你还可以使用列表迭代器反向遍历列表。`previous`\
  \ 方法返回列表中的上一个节点的引用。当你调用 `previous` 时，如果迭代器位于列表的开头，则没有之前的元素，该方法将抛出 `NoSuchElementException`。如果\
  \ `hasPrevious` 返回 `true`，则表示列表中存在上一个元素。代码列表 18-3 中的程序演示了如何向前移动。\n\n### 图 18-9 `ListIterator`\
  \ 位于 `ArrayList` 的最后一个元素之后\n\n![Image](img/01348.jpg)\n\n### 代码列表 18-3 (`ListIteratorDemo2.java`)\n\
