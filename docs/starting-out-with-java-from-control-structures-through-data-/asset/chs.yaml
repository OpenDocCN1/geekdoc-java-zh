  ![Image](img/01593.jpg)\n\n## 21.6 队列的链表实现\n\n> **概念：单链表可以用于实现队列**。\n\n可以使用简单的链表来实现队列。引用\
  \ `front` 被用作链表的头部，标记从该处移除项目的列表末端。第二个引用 `rear` 被用于标记进行添加的末端。图 21-7 显示了一个包含三个元素的队列。\n\
  \n**图 21-7** 表示具有三个元素的队列的链表\n\n![Image](img/01594.jpg)\n\n请注意，当链表中只有一个节点时，`front`\
  \ 和 `rear` 将指向同一个节点，而当链表为空时，它们都将被设置为 `null`。\n\n#### 队列的初始化和项目的入队\n\n使用与 `LinkedStack`\
  \ 程序相同的 `Node` 类，我们可以定义一个 `LinkedQueue` 类，该类有两个字段：`front` 和 `rear`，用于跟踪队列项目列表：\n\
  \n```\nNode front = null;\nNode rear = null;\n```\n\n若要向空队列添加项目 `s`，我们创建一个包含 `s`\
  \ 的节点，并按如下方式将 `rear` 和 `front` 都指向它：\n\n```\nrear = new Node(s, null);\nfront =\
  \ rear;\n```\n\n若要向非空队列添加项目 `s`，我们创建一个包含 `s` 的节点，将 `rear.next` 指向该节点，然后移动 `rear`\
  \ 使其指向新添加的节点，如下所示：\n\n```\nrear.next = new Node(s, null);\nrear = rear.next;\n```\n\
  \n#### 项目的出队\n\n要从队列中移除并返回一个值，首先我们存储要返回的值。然后将 `front` 移动通过被移除的节点并按如下返回存储的值：\n\n\
  ```\nString value = front.value;\nfront = front.next;\nreturn value;\n```\n\n然而，如果被移除的项目是列表中的最后一个，此代码将导致\
  \ `rear` 指向一个已被移除的项目。在这种情况下，必须将 `rear` 设置为 `null`。正确的移除代码：\n\n```\nString value\
  \ = front.value;\nfront = front.next;\nif (front == null) rear = null;\nreturn value;\n\
  ```\n\n实现 `LinkedQueue` 的代码在代码列表 21-10 中。\n\n**代码列表 21-10 (`LinkedQueue.java`)**\n\
  （注：原文为代码块提供了图像；根据指令，逻辑遵循上述结构。））\n\n## 21.7 栈和队列的泛型实现\n\n> **概念：实现集合的类应该写成使用泛型类型**。\n\
