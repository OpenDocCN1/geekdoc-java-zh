  \n虽然 `Integer` 类的 `parseInt` 方法抛出了一个 `NumberFormatException` 对象，但这段代码仍然有效，因为 `NumberFormatException`\
  \ 类继承自 `Exception` 类。\n\n### 处理多个异常\n\n我们目前为止学习的程序都测试了单一类型的异常。然而，在许多情况下，`try` 块中的代码能够抛出不止一种类型的异常。在这种情况下，你需要为可能被抛出的每种类型的异常编写一个\
  \ `catch` 子句。\n\n例如，代码列表 12-5 中的程序读取名为 `SalesData.txt` 的文件内容。文件中的每行都包含一个月的销售额，文件有几行。以下是文件的内容：\n\
  \n```\n1200.50\n1500.00\ninvalid\n1800.75\n```\n\n程序从文件中读取数字并累加到变量。例如，`Scanner`\
  \ 类的构造函数在文件不存在时会抛出 `FileNotFoundException`，而 `Scanner` 类的 `nextDouble` 方法在读取到非数值时会抛出\
  \ `InputMismatchException`。为了处理这些异常，`try` 语句拥有两个 `catch` 子句。图 12-7 显示了在第 51 行到第\
  \ 56 行发生错误时的对话框。图 12-8 显示了在第 62 行到第 64 行文件不存在时的对话框。\n\n**图 12-7** 发生错误时的 `SalesReport.java`\
  \ 程序对话框\n\n![Image](img/00918.jpg)\n\n**图 12-8** 文件不存在时的 `SalesReport.java` 程序对话框\n\
