  \ 获取，其中包含一个文件 `RLinkedListDemo.java`，它实现了该类的图形用户界面。\n\n***\n\n### 焦点：有向图 ![Image](img/00008.jpg)\n\
  \n链表在一组节点之间定义了一种单向关系，使得从任何节点最多可以移动到一个节点。如果你从节点 `A` 移动到另一个节点 `B`，我们说 `A` 访问 `B`，或者说\
  \ `B` 是 `A` 的邻居。使用这种术语，我们可以看到链表是一个节点最多有一个邻居的集合，并且从一个指定的头部节点到所有其他节点的路径，如图 20-8 所示。\n\
  \n**图 20-8** 链表的节点关系\n\n![Image](img/01553.jpg)\n\n有向图是一种与链表相似的数据结构，但其节点之间有更通用的访问关系。具体来说，*有向图*是一个节点集合，其中任何节点都可以有任意数量的邻居。有向图通常称为\
  \ `digraphs`，节点之间的链接被称为 `edges`。图 20-9 展示了有向图的一个示例。\n\n**图 20-9** 有向图的示例\n\n![Image](img/01554.jpg)\n\
  \n有向图不需要可以到达所有其他节点的头部节点，也不必须是“连通的”。有向图在建模不同类型的系统中非常有用。例如，可以使用有向图建模计算机网络。在这样的模型中，节点代表计算机，边代表通信链路。\n\
  \n我们在本章之前的章节中学到的思想可以创建有向图的计算机表示。其中一种表示与每个节点 `X` 关联它的邻居列表：即通过遍历单条边从 `X` 可到达的节点列表。这样的列表被称为\
  \ `X` 的 `邻接列表`。例如，图 20-9 中的有向图可以如表 20-1 所示的方式表示。\n\n**表 20-1** 通过邻接列表表示有向图\n\n![Image](img/01555.jpg)\n\
  \n\n\n\n邻接表表示可以使用一个将节点与其邻接列表相关联的 map 来实现。代码列表 20-6 为图 20-9 中的有向图初始化邻接表，然后将其打印出来。程序使用了从\
  \ `String` 到 `List<String>` 的 `Map`，定义在第 12 和第 13 行。在第 22 到 27 行中，程序获取 `Map` 对象的项集（entry\
  \ set），然后使用增强 `for` 循环打印邻接表信息。映射的项集在第 18.4 节中讨论过。\n\n### 代码列表 20-6 (`AdjacencyList.java`)\n\
  \n![Image](img/01556.jpg)\n\n### 程序输出\n\n```\n      D: [E]\n      E: []\n      F:\
  \ [G]\n      G: []\n      A: [B, C]\n      B: [C, D, E]\n      C: [A, D]\n```\n\n\
  在实践中，我们并不像这里这样构建字符串的邻接表。相反，我们建立节点名称集合与非负整数集合 `0..N*×1` 之间的映射，其中 `N` 是节点数。在我们的示例中，如果我们按顺序对节点\
  \ `A` 到 `G` 编号，邻接表结构可能如表 20-2 所示。\n\n### 表 20-2 使用整数表示有向图节点的邻接表\n\n![Image](img/01557.jpg)\n\
  \n这种变化的原因是，在实践中，处理邻接表的算法通常需要比较有向图中不同节点以判断相等。比较整数比比较字符串更高效。\n\n描述邻接表的数据通常存储在文本文件中。处理有向图的程序从此类文件中读取数据并构建邻接表的内存表示。存储在文件中的数据应该遵循便于程序\
  \ `parse` 数据的格式。`Parsing`（解析）是从语法中识别有意义结构的过程。在这种情况下，我们需要解析文件数据，以识别数据的哪些部分代表节点，哪些部分代表节点的邻接表。表\
  \ 20-3 使用图 20-9 中的示例有向图说明了一种易于解析的格式。\n\n### 表 20-3 将有向图信息存储在文件中以简化解析\n\n![Image](img/01558.jpg)\n\
  \n文件开头是图中节点数 `N`，在本例中为 7。该数字后面跟着 `N` 行，每行显示一个节点名称以及用于在邻接表中表示该节点的数字。接下来是另一组 `N` 行，每行指定从单个节点可以到达的所有的邻居。每行的格式如下：\n\
  \n`(节点) (可到达邻居的数量) (可到达邻居的列表)`\n\n例如，节点 1 的行是：\n\n```\n  1 3 2 3 4\n```\n\n该行显示编号为\
  \ 1 的节点有 3 个可到达的邻居，这些邻居构成了列表 `2 3 4`。\n\n***\n\n## 20.5 应该避免的常见错误\n\n- **忘记检查指向节点的引用是否为空**。在尝试访问存储在节点中的值或\
  \ `next` 或 `prev` 引用之前，确保该引用不为空。\n- **忘记检查特殊情况**。在链表上操作的算法通常需要处理一个或多个特殊情况。需要注意的特殊情况包括：在添加元素时列表为空、删除元素时列表只有一个元素，以及在添加或删除节点时链表中的第一个或最后一个节点。\n\
  - **在递归链表算法中对基准情况处理不当**。大多数递归链表算法对列表参数进行递归。在这种情况下，基准情况通常是列表为空。基于索引操作列表的算法有时会对索引参数进行递归：在这种情况下，基准情况是索引为\
  \ 0。\n- **使用链表的头部（head）遍历链表**。在遍历链表时，不要使用头部引用来移动链表，因为这将破坏链表的结构。请使用一个初始化为头部的辅助引用。\n\
