  \ 类的 `getDocumentBase` 方法和 `getCodeBase` 方法之间有什么区别？\n\n### 14.9 应该避免的常见错误\n\n> •\
  \ **在 HTML 文档中遗漏结束标签**。大多数 HTML 标签都有开始标签和结束标签。如果你忘记了结束标签，页面将无法正常显示。\n\n> • **混淆\
  \ `<head></head>` 标签与 `<h1></h1>` 或其他标题标签**。`<head></head>` 标签标记文档的头部区域，而`<h1></h1>`\
  \ 标签标记标题，即大号粗体文本。\n\n> • **在组件外的 X 和 Y 坐标绘制形状**。如果你使用了组件外的坐标，形状将不会出现。\n\n> • **未调用父类的\
  \ `paint` 或 `paintComponent` 方法**。当你重写方法时，应该调用父类的方法。\n\n> • **覆盖 JComponent 的 `paint`\
  \ 方法**。当更新用于绘制形状的数据时，必须调用 `repaint` 方法来强制重绘窗口。\n\n> • **未为监听器提供不需要的方法定义**。在编写监听器时，你可以通过继承一个适配器类来避免这种情况。\n\
  \n> • **忘记启动 Timer 对象**。`Timer` 对象在调用 `start` 方法之前不会开始产生事件。\n\n* *\n\n### 复习题\n\n\
