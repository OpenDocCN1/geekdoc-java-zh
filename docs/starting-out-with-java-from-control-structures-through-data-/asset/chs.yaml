  \n* *\n\n**程序输出**\n\nJohn\n\n* *\n\n## 5.5 使用方法解决问题\n\n> **概念：大型、复杂的问题可以通过方法逐部分地解决。**\n\
  \n在本章的开始，我们引入了使用方法来“分而治之”问题的想法。通常解决复杂问题的最佳方法是将其拆解成较小的部分，然后解决这些较小的问题。分解问题的过程被称为*函数分解*。\n\
  \n在函数分解中，不再编写一个包含解决问题所需所有语句的长方法，而是编写许多小方法，每个方法解决一个特定的部分。这些小方法然后可以按照所需的顺序执行。\n\n\
  让我们来看一个例子。代码 代码列表 5-12 中的程序从文件中读取 30 天的销售额，然后显示总额和平均销售额。这里是算法的简短伪代码模型：\n\n*询问用户输入文件名。*\n\
