  \ 字段持有公司股票的交易代码。这是一组用于在证券交易所识别股票的简短字符。`sharePrice` 字段持有股票的每股价格。例如，`Stock` 类可能持有交易代码。图\
  \ 9-1 描述了 `Stock` 类的方法。\n\n**图 9-1** `Stock` 类\n\n![Image](img/00646.jpg)\n\n\n\n\
  \n\n> **概念：你无法通过 `==` 运算符来判断两个对象是否包含相同的数据。相反，类必须有一个诸如 `equals` 的方法来比较对象的内容。**\n\n\
  回想第 3 章内容，`String` 类有一个名为 `equals` 的方法，用于判断两个字符串是否相等。你也可以为你自己的任何类编写一个 `equals` 方法。\n\
  \n事实上，为了确定一个类的两个对象是否包含相同的值，你必须为该类编写一个 `equals` 方法（或一个功能类似的方法）。这是因为你不能使用 `==` 运算符来比较两个对象的内容。例如，下面的代码似乎在比较两个\
  \ `Stock` 对象的内容，但实际上并没有这样做：\n\n![Image](img/00651.jpg)\n\n当你对引用变量使用 `==` 运算符时，该运算符比较的是变量所包含的内存地址，而不是变量所引用的对象的内容。这在图\
  \ 9-9 中所示。\n\n**图 9-9** `if` 语句测试的是引用变量的内容，而不是变量所引用对象的内容\n\n![Image](img/00652.jpg)\n\
  \n由于两个变量引用的是内存中不同的对象，它们将包含不同的地址。因此，布尔表达式 `company1 == company2` 的结果为 `false`，代码报告这些对象不相同。我们不应该使用\
  \ `==` 运算符来比较两个 `Stock` 对象，而应该编写一个 `equals` 方法来比较两个对象的内容。\n\n在源代码文件夹 *第 09 章\\Stock\
  \ 类阶段 2）* 中，你将找到 `Stock` 类的修订版本。该版本的类有一个 `equals` 方法。该方法的代码如下（类的其他部分没有发生变化，因此只显示了\
