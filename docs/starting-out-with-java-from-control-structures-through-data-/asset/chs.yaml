  \ 赋值为 0.0：\n\n![Image](img/00682.jpg)\n\n`this` 关键字是对象可以用于引用自身的引用变量名。它可以对 `String`\
  \ 对象的赋值：\n\n![Image](img/00683.jpg)\n\n## 9.8 `this` 引用变量\n\n> **概念：`this` 关键字是对象可以用于引用自身的引用变量名。它在所有非静态方法中都是有效的。**\n\
  \n`this` 关键字是对象可以用于引用自身的引用变量名。它在所有非静态方法中都是有效的。例如，回顾在本章之前介绍的 `Stock` 类。它具有以下构造函数：\n\
  \n```java\npublic Stock(String sym, double price) {\n    symbol = sym;\n    sharePrice\
  \ = price;\n}\n```\n\n当此方法执行时，`this` 变量包含调用对象的地址。我们可以如下重写 `if` 语句（更改部分已加粗）：\n\n\
  ```java\nif (this.symbol.equals(object2.symbol) && this.sharePrice == object2.sharePrice)\n\
  ```\n\n`this` 引用变量在类的非静态方法中是有效的。\n\n#### 使用 `this` 解决遮蔽（Shadowing）\n\n`this` 关键字的一个常见用途是解决解决参数名对字段的遮蔽。有时参数名与字段名相同，此时参数名会遮蔽字段名。例如，查看\
  \ `Stock` 类中的构造函数：\n\n![Image](img/00684.jpg)\n\n#### 使用 `this` 调用重载构造函数\n\n你已经知道在创建对象时会自动调用构造函数。你也知道不能显式地调用构造函数，就像调用其他方法一样。然而，该规则有一个例外：你可以使用\
  \ `this` 关键字从同类的另一个构造函数调用构造函数。为了说明这一点，回顾在本章之前介绍的 `Stock` 类。它具有以下构造函数：\n\n```java\n\
  public Stock(String sym, double price) {\n    symbol = sym;\n    sharePrice = price;\n\
  }\n```\n\n此构造函数接受并赋值给 `symbol` 和 `sharePrice` 字段。假设我们还需要一个只接受 `symbol` 字段参数的构造函数，并将\
  \ `sharePrice` 字段赋值为 0.0。编写该构造函数的方法如下：\n\n```java\npublic Stock(String sym) {\n\
  \    this(sym, 0.0);\n}\n```\n\n此构造函数仅使用 `this` 变量调用第一个构造函数。它将 `sym` 的值作为第一个参数并将\
  \ 0.0 作为第二个参数传递。结果是 `symbol` 字段被赋值 `sym` 的值，`sharePrice` 字段被赋值为 0.0。\n\n记住使用 `this`\
  \ 调用构造函数的规则：\n\n> • `this` 只能用于从同类的另一个构造函数调用构造函数。\n> • 它*必须*是调用构造函数中的第一条语句。如果它不是第一条语句，会导致编译错误。\n\
  \n##### ![Image](img/00004.jpg)**检查点**\n\n\n\n\n> 9.4 查看下面的代码。（你可能想回顾一下本章之前介绍的 `Stock`\
  \ 类。）\n\n```java\nStock stock1 = new Stock(\"XYZ\", 9.65);\nStock stock2 = new Stock(\"\
  SUNW\", 7.92);\n```\n\n> 当执行以下语句导致 `equals` 方法执行时，`this` 引用的是哪个对象？\n\n```java\n\
  if (stock2.equals(stock1))\n    System.out.println(\"The stocks are the same.\"\
  );\n```\n\n## 9.9 枚举类型\n\n> **概念：枚举数据类型由一组预定义的值组成。你可以使用该数据类型来创建变量，这些变量只能持有属于该枚举数据类型的值。**\n\
  \n你已经学习了数据类型的概念以及它们如何在基本类型变量中使用的。例如，一个 `int` 数据类型的变量可以存储特定范围内的整数值。你不能将浮点值赋值给 `int`\
  \ 变量，因为只有 `int` 值可以被赋值给 `int` 变量。数据类型定义了该类型任何变量的合法值。\n\n有时，创建一个具有特定合法值集合的自定义数据类型是有帮助的。例如，假设你想创建一个名为\
  \ `Day` 的数据类型，该数据类型中的合法值是星期中几天的名称（星期日、星期一等）。当你创建一个 `Day` 数据类型的变量时，你只能在该变量中存储星期中几天的名称。任何其他值都是非法的。在\
  \ Java 中，这种类型被称为枚举数据类型。\n\n你使用 `enum` 关键字来创建自己的自定义数据类型，并指定属于该类型的值。这里是一个枚举类型声明的示例：\n\
  \n```java\nenum Day { SUNDAY, MONDAY, TUESDAY, WEDNESDAY,\n           THURSDAY,\
  \ FRIDAY, SATURDAY }\n```\n\n枚举类型的声明以 `enum` 关键字开头，后面跟类型类型名称，然后是大括号内的标识符列表。示例声明创建了一个名为\
  \ `Day` 的枚举类型。大括号内的标识符 `SUNDAY`、`MONDAY`、`TUESDAY`、`WEDNESDAY`、`THURSDAY`、`FRIDAY`\
  \ 和 `SATURDAY` 被称为 `enum` 常量。它们代表属于 `Day` 数据类型的值。以下是枚举类型声明的通用格式：\n\n`enum` `TypeName`\
  \ `{` `一个或多个` `enum` 常量 `}`\n\n注意 `enum` 常量没有被引号括，因此它们不是字符串。`enum` 常量必须是法的 Java\
  \ 标识符。\n\n![Image](img/00006.jpg)\n\n**提示：** 在为枚举常量命名时，并不要求它们全全大写字母。我们可以将 `Day`\
  \ 类型的枚举常量写为 `sunday`、`monday` 等。然而，由于它们代表常量值，标准的约定是将它们写成全大写字母。\n\n一旦你在程序中创建了枚举数据类型，就可以声明该类型的变量了。例如，以下语句将\
  \ `workDay` 声明为 `Day` 类型的变量：\n\n```java\nDay workDay;\n```\n\n由于 `workDay` 是一个 `Day`\
  \ 变量，我们可以合法赋值给它的唯一值是 `enum` 常量 `Day.SUNDAY`、`Day.MONDAY`、`Day.TUESDAY`、`Day.WEDNESDAY`、`Day.THURSDAY`、`Day.FRIDAY`\
  \ 和 `Day.SATURDAY`。如果我们尝试分配除 `Day` 类型 `enum` 常量之外的任何值，将导致编译错误。例如，以下语句将值 `Day.WEDNESDAY`\
  \ 赋值给 `workDay` 变量：\n\n```java\nDay workDay = Day.WEDNESDAY;\n```\n\n注意我们赋值的是 `Day.WEDNESDAY`\
  \ 而不仅仅是 `WEDNESDAY`。`Day.WEDNESDAY` 是 `Day` 类型 `WEDNESDAY` 常量的完全限定名。在大多数情况下，你必须使用\
  \ `enum` 常量的完全限定名。\n\n#### 枚举类型是特殊的类\n\n当你编写枚举类型声明时，你实际上是在创建一种特殊的类。此外，你在大括号内列出的\
  \ `enum` 常量实际上是该类的对象。在上一个示例中，`Day` 是一个类，而 `enum` 常量 `Day.SUNDAY`、`Day.MONDAY`、`Day.TUESDAY`、`Day.WEDNESDAY`、`Day.THURSDAY`、`Day.FRIDAY`\
  \ 和 `Day.SATURDAY` 都是 `Day` 类的实例。当我们给 `workDay` 变量赋值 `Day.WEDNESDAY` 时，我们是将 `Day.WEDNESDAY`\
  \ 对象的地址赋值给该变量。这在图 9-15 中有所说明。\n\n**图 9-15** `workDay` 变量引用了 `Day.WEDNESDAY` 对象\n\
  \n![Image](img/00686.jpg)\n\n`enum` 常量（实际上是对象）会自动配备几个方法。其中之一是 `toString` 方法。`toString`\
  \ 方法简单地返回调用常量的名称作为字符串。例如，假设 `Day` 类型已经声明，以下代码将显示 `WEDNESDAY`：\n\n```java\nSystem.out.println(workDay);\n\
  ```\n\n`enum` 常量还有一个名为 `ordinal` 的方法。`ordinal` 方法返回表示常量位置的整数。图 9-16 显示了枚举中的常量序数值，第一个常量位置为\
  \ 0。\n\n**图 9-16** `Day` 枚举类型及其序数值\n\n![Image](img/00687.jpg)\n\n例如，假设 `Day` 类型已经声明，查看以下代码：\n\
  \n```java\nDay workDay = Day.FRIDAY;\nSystem.out.println(workDay.ordinal());\nSystem.out.println(Day.MONDAY.ordinal());\n\
  ```\n\n`Day.FRIDAY` 的序值为 5，而 `Day.MONDAY` 的序值为 1：\n\n```\n5\n1\n```\n\n我们在这里讨论的最后枚举方法是\
  \ `equals` 和 `compareTo`。`equals` 方法接收对象作为参数，如果该对象与调用常量相等，则返回 `true`。例如，假设 `Day`\
  \ 类型已经声明，以下代码段将显示“The two are the same.”：\n\n```java\nDay workDay = Day.TUESDAY;\n\
  if (workDay.equals(Day.TUESDAY))\n    System.out.println(\"The two are the same.\"\
  );\n```\n\n`compareTo` 方法用于比较相同类型的 `enum` 常量。它接收对象作为参数并返回：\n\n- 如果调用的 `enum` 常量序数值小于参数序数值，返回负整数\n\
  - 如果 `enum` 常量与参数相同，返回零\n- 如果调用的 `enum` 常量序数值大于参数序数值，返回正整数\n\n例如，假设 `Day` 类型已经声明，以下代码段将显示“FRIDAY\
  \ is greater than MONDAY”：\n\n```java\nDay myDay = Day.FRIDAY;\nif (myDay.compareTo(Day.MONDAY)\
  \ > 0)\n    System.out.println(myDay + \" is greater than \" + Day.MONDAY);\n```\n\
  \n声明枚举类型的另一个地方是在类内部。如果你在类内部声明枚举类型，它不能在方法内部。代码列表 9-18 展示了一个示例。它演示了 `Day` 枚举类型。\n\n\
