  \n***\n\n## 3.8 条件运算符（可选）\n\n> **概念：你可以使用条件运算符创建类似于 `if-else` 语句的短表达式**。\n\n条件运算符非常强大且独特。因为它接受三个操作数，所以被认为是三元运算符。条件运算符提供了一种表示简单\
  \ `if-else` 语句的简写方法。该运算符由问号（`?`）和冒号（`:`）组成。你使用该运算符按以下格式编写条件表达式：\n\n`BooleanExpression\
  \ ? Value1: Value2;`\n\n此处的`BooleanExpression` 类似于 `if` 语句括号中的 `boolean` 表达式。如果\
  \ `BooleanExpression` 为真，则条件表达式的值为 `Value1`。否则，条件表达式的值为 `Value2`。这里有一个使用条件运算符的语句示例：\n\
  \n```\ny = x < 0 ? 10: 20;\n```\n\n上述语句与以下 `if-else` 语句执行的操作相同：\n\n```\nif (x <\
  \ 0)\n    y = 10;\nelse\n    y = 20;\n```\n\n条件运算符让你能够将决策能力封装在简洁的代码行中。只要稍加想象力，它可以应用于许多其他编程问题。例如，考虑以下语句：\n\
  \n```\nSystem.out.println(\"Your grade is: \" +\n             (score < 60 ? \"Fail.\"\
  \ : \"Pass.\"));\n```\n\n转换为 if-else 语句，它的写法如下：\n\n```\nif (score < 60)\n    System.out.println(\"\
  Your grade is: Fail.\");\nelse\n    System.out.println(\"Your grade is: Pass.\"\
  );\n```\n\n**注意：** 括号被放在条件表达式周围，是因为 `+` 运算符的优先级高于 `?:` 运算符。如果没有括号，`+` 运算符将拼接字符串\
  \ `\"Your grade: \"`。\n\n***\n\n要查看使用条件运算符的示例程序，请参见此章源代码文件夹中的 `ConsultantCharges.java`，该文件可以在本书的在线资源页\
  \ [www.pearsoned.com/gaddis.](http://www.pearsoned.com/gaddis) 获取。\n\n***\n\n###\
  \ ![Image](img/00004.jpg) **Checkpoint**\n\n> 3.23 将以下 `if`-`else` 语句重写为使用条件运算符的语句。\n\
  \n> a) if (x > y)\n> z = 1;\n> else\n> z = 20;\n\n> b) if (temp > 45)\n> population\
  \ = base * 10;\n> else\n> population = base * 2;\n\n> c) if (hours > 40)\n> wages\
  \ *= 1.5;\n> else\n> wages *= 1;\n\n> d) if (result >= 0)\n> System.out.println(\"\
  The result is positive.\");\n> else\n> System.out.println(\"The result is negative.\"\
  );\n\n## 3.9 `switch` 语句\n\n> **概念：`switch` 语句允许变量或表达式的值决定程序跳转到何处**。\n\n当程序的某部分导致另一部分执行时，就会发生分支。`if`-else-if`\
  \ 语句允许你的程序分支到几种可能路径之一。它测试一系列 `boolean` 表达式，并在其中一个表达式为 `true` 时进行分支。`switch` 语句是一种类似的机制。然而，它测试整数或字符表达式的值，然后使用该值来确定跳转到哪组语句。以下是\
  \ `switch` 语句的格式：\n\n![Image](img/00177.jpg)\n\n语句的第一行以 `switch` 单词开头，后面是括号内的 `SwitchExpression`。`SwitchExpression`\
  \ 是一个必须产生以下类型之一值的表达式：`char`、`byte`、`short` 或 `int`。\n\n\n\n\n下一行是一个包含多个 `case` 语句的块的开头。每个\
  \ `case` 语句按如下格式格式：\n\n```\ncase CaseExpression:\n              //在此处放置一个或多个\n \
  \             // 语句\n              break;\n```\n\n`case` 语句以关键字 `case` 开始，后面跟着 `CaseExpression`。`CaseExpression`\
  \ 是字面量或 `final` 变量，其类型必须是 `char`、`byte`、`short` 或 `int`。`CaseExpression` 后面跟着一个冒号。\n\
  \n在 `case` 语句之后，可能会出现一个或多个有效的程序语句。如果 `SwitchExpression` 的值与 `case` 语句的 `CaseExpression`\
  \ 匹配，则这些语句会被分支执行。语句组中的最后一个语句应该是关键字 `break`。`break` 语句导致程序跳出 `switch` 语句，并从其后的语句开始继续处理。\n\
  \n![Image](img/00005.jpg)\n\n***\n\n**注意：** 每个 `case` 语句的 `CaseExpressions` 必须是唯一的。\n\
  \n***\n\n`default` 部分通常位于所有 `case` 语句之后。如果没有任何 `case` 表达式匹配 `switch` 表达式，则跳转到该部分。\n\
  \n![Image](img/00005.jpg)\n\n***\n\n**注意：** `default` 部分是可选的。然而，如果你省略了它，当 `SwitchExpression`\
  \ 不匹配任何 `CaseExpressions` 时，你的程序将无处可去。\n\n***\n\n代码列表 3-13 中的程序显示了简单的 `switch` 语句是如何工作的。\n\
  \n**代码列表 3-13 (`SwitchDemo.java`)**\n\n![Image](img/00178.jpg)\n\n![Image](img/00179.jpg)\n\
  \n**加粗显示的示例输入对应的程序输出**\n\n`输入 1, 2, 或 3:` `2 [回车]`\n\n`                   你输入了 2.`\n\
  \n**加粗显示的示例输入对应的程序输出**\n\n`输入 1, 2, 或 3:` `5 [回车]`\n\n`                   那不是 1,\
  \ 2 或 3!`\n\n第一个 `case` 语句是 `case 1`，第二个是 `case 2`，第三个是 `case 3`。这些语句标记了当变量 `number`\
  \ 包含 `1`、`2` 或 `3` 时，程序应该跳转的位置。如果用户输入 `1, 2` 或 `3` 以外的任何内容，则跳转到 `default` 部分。\n\n\
  注意 `case 1`、`case 2` 和 `case 3` 部分中的 `break` 语句。\n\n![Image](img/00180.jpg)\n\n\
  `case` 语句显示程序从块的哪里开始执行，而 `break` 语句显示程序在何停止。如果没有 `break` 语句，程序将执行从匹配的 `case` 语句到块结束的所有行。\n\
