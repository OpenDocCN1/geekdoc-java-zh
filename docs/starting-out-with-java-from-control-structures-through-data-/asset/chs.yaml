  \ 10 张图像，并指定以秒为单位的时间延迟。\n\n***\n\n# 第 15 章\n## 递归\n\n### 课题\n* 15.1 递归简介\n* 15.2\
  \ 用递归解决问题\n* 15.3 递归方法的示例\n* 15.4 汉诺亚塔\n* 15.5 需要避免的常见错误\n\n## 15.1 递归简介\n> **概念：**\
  \ 递归方法是一种调用自身的方法。\n\n你已经见过方法调用其他方法的实例了。方法 A 可以调用方法 B，方法 B 然后可以调用方法 C。方法也可以调用自身。调用它自己的方法就是递归方法。查看代码列表\
  \ 15-1 中的`message` 方法。\n\n**代码列表 15-1 (`EndlessRecursion.java`)**\n![Image](img/01164.jpg)\n\
  \n该方法显示字符串“This is a recursive method.”然后调用自身。每次调用自身时，循环都会重复。你能看出该方法的一个问题吗？没有办法可以停止递归调用。这个方法就像无限循环，因为没有代码可以停止它的重复。\n\
  \n就像循环一样，递归方法必须有某种方式来控制它重复的次数。代码列表 15-2 中的类拥有`message` 方法的修改版本。它传递了一个整数参数，该参数持有该方法应该调用自自身的次数。\n\
  \n**代码列表 15-2 (`Recursive.java`)**\n![Image](img/01165.jpg)\n\n该方法包含一个控制重复的 `if`\
  \ 语句。只要参数 `n` 大于 0，该方法就会显示消息然后使用 `n - 1` 调用自身。例如，查看代码列表 15-3。\n\n**代码列表 15-3 (`RecursionDemo.java`)**\n\
  ![Image](img/01166.jpg)\n\n**程序输出**\n```\nThis is a recursive method.\nThis is a\
  \ recursive method.\nThis is a recursive method.\nThis is a recursive method.\n\
  This is a recursive method.\n```\n\n图 15-1 中的图说明了这一点。每次调用该方法时，都会创建一个 `n` 的新实例。第一次调用方法时，参数\
  \ `n` 被设置为 5。当方法调用自身时，会创建一个 `n` 的新实例，并将 4 传递进去。这种循环重复直到最后将零传递给方法。\n\n**图 15-1**\
  \ 方法的前两次调用\n![Image](img/01167.jpg)\n\n从图 15-2 可以看出，该方法总共被调用六次。第一次是从 `RecursionDemo`\
  \ 类的 `main` 方法调用的，其他五次是它调用自自身的。方法调用自自身的次数被称为递归深度。在这个例子中，递归深度为五。当方法达到第六次调用时，参数 `n`\
  \ 被设置为 0。此时，`if` 语句的条件表达式为 `false`，因此方法返回。\n\n程序控制从第六个方法实例返回到第五个实例中递归方法调用之后的位置。\n\
  \n由于在方法调用之后没有更多要执行的语句，第五个方法实例将程序控制返回给第四个实例。这种重复一直持续所有方法实例都返回。\n\n**图 15-2** 对 `message`\
  \ 方法的六次调用\n![Image](img/01168.jpg)\n\n**图 15-3** 控制返回到递归方法调用之后\n![Image](img/01169.jpg)\n\
  \n## 15.2 用递归解决问题\n> **概念：** 如果一个问题可以分解为若干与整体问题相同的连续较小问题，就可以用递归来解决。\n\n\n\n\n上一节中展示的\
  \ `Recursive` 和 `RecursionDemo` 类演示了递归方法的机制。递归是解决重复性问题的强大工具，也是高级计算机科学课程中的一个重要课题。你现在可能还不清楚的是如何使用递归来解决问题。首先，应该指出，解决问题并不绝对需要递归。任何可以用递归解决的问题都可以通过迭代（循环）来解决。事实上，递归算法的效率通常低于迭代算法。这是因为方法调用需要\
  \ JVM 执行若干项操作。这些操作包括为参数和局部变量分配内存，以及存储在方法终止后控制返回的程序位置地址。这些操作有时被称为开销（overhead），在每次方法调用时都会发生。而循环中是不需要这些开销的。\n\
  \n然而，某些重复性问题用递归比迭代更容易解决。在迭代算法可能产生更短执行时间的情况下，程序员可能能够更快地设计出递归算法。\n\n总来说，递归方法的工作原理如下：\n\
  \n> • 如果问题现在不需要递归就可以解决，那么该方法就会解决它并返回。\n\n> • 如果问题现在无法解决，那么该方法将其还原为一个较小但相似的问题，并调用自身来解决这个较小的问题。\n\
  \n为了应用这种方法，我们首先识别出至少一种不需要递归即可解决的情况。这被称为 `base case`（基础情况）。其次，我们确定一种在所有其他情况下使用递归解决问题的方法。这被称为\
  \ `recursive case`（递归情况）。在递归情况中，我们必须始终将问题还原为原问题的较小版本。通过在每次递归调用缩小问题，最终将到达基础情况，递归就会停止。\n\
  \n***\n\n![Image](img/00009.jpg)\n\n## 使用递归简化问题\n\n***\n\n让我们从数学中取一个例子来研究递归的应用。在数学中，符号\
  \ `n!` 表示数字 `n` 的阶乘。非负整数的阶乘可以由以下规则定义：\n\n![Image](img/01170.jpg)\n\n让我们将符号 `n!`\
  \ 替换为 `factorial(n)`，它看起来更像计算机代码，并将这些规则重写为如下：\n\n![Image](img/01171.jpg)\n\n这些规则规定，当\
  \ `n` 为 0 时，它的阶乘为 1。当 `n` 大于 0 时，它的阶乘是从 1 到 `n` 的所有正整数的积。例如，`factorial(6)` 的计算方法为\
  \ 1 × 2 × 3 × 4 × 5 × 6。\n\n在设计计算任何数字阶乘的递归算法时，我们首先识别基础情况，即我们可以不需要递归即可解决的计算部分。即 `n`\
  \ 等于 0 的情况如下：\n\n`If n = 0 then factorial(n) = 1`\n\n这告诉我们当 `n` 等于 0 时如何解决问题，但当\
  \ `n` 大于 0 时该做什么呢？那就是递归情况，或者是我们用递归解决的问题部分。我们这样表达它：\n\n`If n > 0 then factorial(n)\
  \ = n × factorial(n – 1)`\n\n这表示如果 `n` 大于 0，则 `n` 的阶乘是 `n` 乘以 `n - 1` 的阶乘。注意递归调用是如何在缩小后的问题版本\
  \ `n - 1` 上工作的。因此，我们计算数字阶乘的递归规则可能像这样：\n\n![Image](img/01172.jpg)\n\n以下代码展示了如何在 Java\
  \ 方法中实现它：\n\n![Image](img/01173.jpg)\n\n代码列表 15-4 中的程序演示了该方法。图 15-4 展示了与程序的示例交互。\n\
  \n**代码列表 15-4 (`FactorialDemo.java`)**\n\n![Image](img/01174.jpg)\n\n![Image](img/01175.jpg)\n\
  \n**图 15-4** 与 `FactorialDemo.java` 程序的交互\n\n![Image](img/01176.jpg)\n\n在程序的示例运行中，调用\
  \ `factorial` 方法时将参数 4 传递给 `n`。由于 `n` 不等于 0，`if` 语句的 `else` 分句执行以下语句：\n\n`return\
  \ n * factorial(n - 1);`\n\n尽管这是一个 `return` 语句，但它并没有立即返回。在确定返回值之前，必须先确定 `factorial\
  \ (n - 1)` 的值。`factorial` 方法会被递归调用，直到第五次调用，此时 `n` 参数将被设置为零。图 15-5 中的图表说明了在方法每次调用期间\
  \ `n` 的值和返回值。\n\n此图说明了为什么递归算法必须在每次递归调用时缩小问题。最终，递归必须停止才能获得解决方案。如果每次递归调用都在较小的问题版本上工作，那么递归算法就不会停止。\n\
