  \ 对象作为参数传递给 `JLabel` 构造函数，在标签中显示图像。该构造函数的通用格式如下：\n\n```java\nJLabel(Icon image)\n\
  ```\n\n传递给 `image` 参数的参数可以是 `ImageIcon` 对象，也可以是任何实现了 `Icon` 接口的对象。这里是一个示例：\n\n```java\n\
  ImageIcon image = new ImageIcon(\"Smiley.gif\");\nJLabel label = new JLabel(image);\n\
  ```\n\n这创建了一个带有图像但没有文本的标签。你也可以创建一个既有图像又有文本的标签。实现此点的简单方法是像往常一样创建文本标签，然后使用 `JLabel`\
  \ 类的 `setIcon` 方法向标签添加图像。`setIcon` 方法接受一个 `ImageIcon` 对象作为其参数。这里是一个示例：\n\n```java\n\
  JLabel label = new JLabel(\"Have a nice day!\");\nlabel.setIcon(image);\n```\n\n\
  文本将显示在图像的右侧。`JLabel` 类还有如下构造函数：\n\n```java\nJLabel(String text, Icon image, int\
