  \ 显示的框架\n\n![Image](img/01636.jpg)\n\n### 22.2 二叉搜索树\n\n> **概念：二叉搜索树组织信息以便搜索**\n\
  \n在 16 章中，你看到了如何使用二分搜索在排序数组中快速查找给定项目。二叉搜索树是二叉树的一种特殊类型，用于实现不需要数组的二分搜索形式。查看图 22-7\
  \ 中的二叉树。\n\n**图 22-7** 二叉搜索树\n\n![Image](img/01637.jpg)\n\n事实上，该树具有以下属性：对于每个节点 `N`，左子树中存储的所有值都小于\
  \ `N` 处的值，而右子树中存储的所有值都大于 `N` 处的值。具有此属性的二叉树被称为*二叉搜索树*（binary search tree）。\n\n\n\n\
  二叉搜索树具有实现快速搜索的潜力。假设我们要确定 `X` 是否在树中。从根节点开始，沿着二叉树的某条路径向下移动，将 `X` 与遇到的每个节点进行比较。在每个节点\
  \ `N`，如果 `X` 小于 `N`，我们在左子树中继续搜索；如果 `X` 大于 `N`，则在右子树中继续。当我们在某个节点找到 `X`，或者到达一个不是 `X`\
  \ 的叶子节点时，搜索停止。假设树是相当平衡的，我们可以看到，每次进行比较时都会丢弃大约剩余树的一半。因此，搜索一个具有 `n` 个节点的二叉树大约需要 `log\
  \ n` 次比较。自然地，二叉搜索只能用于支持比较操作的项目，且该操作的属性是：对于任意两个不同的元素 `x` 和 `y`，要么 `x` “小于” `y`，要么\
  \ `x` “大于” `y`。支持此类比较操作的集合被称为**全序**有序或**线性**有序。\n\n以下方法在二叉搜索树中搜索元素 `x`。如果树包含 `x`\
  \ 则返回 `true`，否则返回 `false`。\n\n![Image](img/01638.jpg)\n\n### 向二叉搜索树添加值\n\n与二叉树上的绝大多数操作一样，向二叉搜索树添加一个值有一个自然的递归实现。该方法\n\
  \n```\nNode add(int x, Node bstree)\n```\n\n它将 `x` 添加到以 `bstree` 为根的二叉搜索树中，并返回生成的二叉搜索树根节点的引用。首先，该方法检查\
  \ `bstree` 是否为空：如果为空，它将创建并返回一个包含 `x` 的新节点。如果 `bstree` 不为空，该方法将 `x` 与根节点存储的元素进行比较：如果\
  \ `x` 小，它将 `x` 添加到左子树，并将生成的树作为新的左子树；如果 `x` 大，它将 `x` 添加到右子树，并将生成的树作为新的右子树。然后，它返回根节点的引用：\n\
  \n![Image](img/01639.jpg)\n\n### 从二叉搜索树中删除值\n\n要从二叉搜索树中删除一个值，必须找到包含该值的节点 `N` 并将其从树中移除。有情况需要需要：\n\
  \n> • 节点 `N` 没有孩子。通过将其父节点中对应的引用设置为 `null` 来移除 `N`。\n\n> • 节点 `N` 有一个孩子。移除 `N` 并提升\
  \ `N` 的孩子取代其在树中父节点的位置，如图 22-8 所示。\n\n***\n\n![Image](img/00009.jpg)\n\n**从二叉搜索树中删除值**\n\
  \n***\n\n> • 节点 `N` 有两个孩子。移除 `N` 并用左子树中最大的节点替换它，如图 22-9 所示。注意，`N` 左子树中最大的节点不能有右孩子，因此删除它将其简化为删除具有至多一个节点的简单情况。\n\
  \n**图 22-8** 删除具有一个子节点的节点的前后\n\n![Image](img/01640.jpg)\n\n**图 22-9** 删除具有两个子节点的节点\n\
  \n![Image](img/01641.jpg)\n\n在图 22-9 的树中移除节点 90 之后，生成的树如图 22-10 所示。\n\n**图 22-10**\
  \ 移除 90 之后的图 22-9 的树\n\n![Image](img/01642.jpg)\n\n现在让我们考虑编写代码以实现从二叉搜索树 `T` 中删除值\
  \ `x` 的任务。此操作产生两个对象：一个包含 `x` 的节点 `N`，以及 `N` 从 `T` 中移除后剩余的树。将使用类来表示此类操作的结果：\n\n![Image](img/01643.jpg)\n\
  \n该类将是代表二叉搜索树的类的私有类。执行实际删除的方法\n\n```\nRemovalResult remove(Node bTree, int x)\n\
  ```\n\n将接收一个指向二叉搜索树根节点的引用 `bTree` 和一个整数值 `x`。如果在 `bTree` 中未找到 `x`，则 `remove` 方法返回\
  \ `null`。\n\n移除 `x` 的算法考虑了三种情况：\n\n> 1. 关系 `x < bTree.value` 成立。在这种情况下，`x` 在左子树中被递归移除：\n\
  \n> ![Image](img/01644.jpg)\n\n> 如果递归调用返回 `null`，则 `x` 不在左子树中，因此不在树中，原始调用也返回 `null`。否则，递归调用返回的剩余树将成为原始调用剩余树的左子树，并相应地修改和返回\
  \ `result` 对象。\n\n> 2. 关系 `x > bTree.value` 成立。在这种情况下，`x` 从右子树中递归移除。\n\n> 3. 关系\
  \ `x == bTree.value` 成立。在这种情况下，`bTree` 根节点包含了要删除的值。移除 `x` 的逻辑取决于 `bTree` 具有零、一个或两个孩子，如前文图\
  \ 22-7、22-8 和 22-9 所示。具体实现如下：\n\n首先考虑 `bTree` 为零孩子的情况。移除节点后的空树：\n\n```\nif (bTree.left\
  \ == null && bTree.right == null)\n    return null\n```\n\n接下来考虑 `bTree` 有一个孩子的情况。移除节点后的非空树为：\n\
  \n```\nif (bTree.left != null)\n    tree = bTree.left;\nelse\n    tree = bTree.right;\n\
  node.parent = tree;\n```\n\n最后，考虑 `bTree` 具有两个孩子的情况。在这里，我们需要通过移除左子树中的最大节点来合并这两个二叉搜索树：\n\
  \n```\nRemovalResult removeLargest(Node bTree)\n```\n\n为了理解该方法后的逻辑，请观察二叉搜索树中的最大节点在没有右子树时是根节点，否则它是右子树中的最大节点。\n\
  \n![Image](img/01645.jpg)\n\n代码列表 22-3 显示了 `remove`、`contains` 和 `add` 方法的完整实现。\n\
