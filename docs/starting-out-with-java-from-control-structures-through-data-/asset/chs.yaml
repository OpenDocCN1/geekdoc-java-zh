  \n##### `regionMatches` 方法\n\n`String` 类提供了 `regionMatches` 方法的重载版本，用于确定两个字符串的区域是否匹配。以下代码演示了：\n\
  \n```java\nString str = \"Four score and seven years ago\";\nString str2 = \"Those\
  \ passed quickly\";\nif (str.regionMatches(15, str2, 6, 11))\n    System.out.println(\"\
  The regions match.\");\nelse\n    System.out.println(\"The regions do not match.\"\
  );\n```\n\n这段代码将显示 The regions match.。`str` 的指定区域从位置 15 开始，`str2` 的指定区域从位置 6 开始。两个区域都是\
  \ 11 个字符。`str` 中的指定区域是“seven years”，`str2` 中的指定区域也是“seven years”。因为两个区域匹配，代码中的 `regionMatches`\
  \ 方法返回 `true`。此版本的 `regionMatches` 方法区分大小写比较。重载版本接受一个额外的参数，指示是否执行不区分大小写的比较。以下代码演示了：\n\
  \n```java\nString str = \"Four score and seven years ago\";\nString str2 = \"THOSE\
  \ SEVEN YEARS PASSED QUICKLY\";\nif (str.regionMatches(true, 15, str2, 6, 11))\n\
  \    System.out.println(\"The regions match.\");\nelse\n    System.out.println(\"\
  The regions do not match.\");\n```\n\n这段代码也将显示 The regions match.。传递给此版本 `regionMatches`\
  \ 方法的第一个参数可以是 `true` 或 `false`，指示是否执行不区分大小写的比较。在此中传递了 `true`，因此在比较“seven years”和“SEVEN\
  \ YEARS”时将忽略大小写。\n\n这些方法都通过 `boolean` 返回值指示字符串是否出现在字符串中。`String` 类提供的方法不仅可以搜索字符串内部的项，还可以报告这些项的位置。表\
