  > **概念：接口和类一样，可以是泛型的**。\n\n到目前为止，我们检查的所有泛型类型都是类。接口也可以是泛型的。例如，Java API 有一个名为 `Comparable`\
  \ 的接口，其定义如下：\n\n```\n      public interface Comparable<T>\n      {\n         int\
  \ compareTo(T o);\n      }\n   � }\n```\n\n此接口指定了一个名为 `compareTo` 的方法，用于比较调用对象与作为参数传递给\
  \ `o` 的另一个对象。注意接口定义了一个类型参数 `T`。在 `compareTo` 方法头中，`T` 是参数 `o` 的类型。\n\nJava API 中的许多类都实现了此接口，包括\
  \ `String` 和包装类。你可能还记得我们在 第 3 章 中讨论 `String` 类时，`compareTo` 方法的工作原理：\n\n* 如果调用对象小于传递给\
  \ `o` 的对象，则方法返回一个负数。\n* 如果调用对象等于传递给 `o` 的对象，则方法返回 0。\n* 如果调用对象大于传递给 `o` 的对象，则方法返回一个正数。\n\
  \n假设我们正在编写一个名为 `Tree` 的类，并且希望 `Tree` 类实现 `Comparable` 接口。我们将按照以下方式编写类：\n\n![Image](img/01308.jpg)\n\
  \n在类头中，我们将 `Tree` 作为类型参数传递给 `Comparable` 接口。因此，`Tree` 类中的 `compareTo` 方法头必须写如下：\n\
  \n`int compareTo(Tree o)`\n\n任何调用 `compareTo` 方法的 `Tree` 对象都必须将另一个 `Tree` 对象作为参数传递给方法。\n\
  \n#### 将类型参数限制为实现接口的类型\n\n方法的参数变量是接口引用而非类引用的情况非常常见。例如，假设我们想写一个名为 `greatest` 的泛型方法，它将比较两个对象并确定哪一个是“更大”的。当然，“更大”的概念完全取决于所比较的对象。如果我们正在比较两个\
  \ `LuxuryCar` 对象，最昂贵的那个可能被认为是更大的。然而，如果我们正在比较两个 `RaceCar` 对象，最高速的那个可能被认为是更大的。任何作为参数传递给我们方法的对象都必须支持标准的比较方法，以便我们判断哪一个更大。\n\
  \n`Comparable` 接口在这种情况下很有帮助。例如，假设 `LuxuryCar` 类实现了 `Comparable` 接口。类头将写如下：\n\n```\n\
       public class LuxuryCar implements Comparable<LuxuryCar>\n     {\n*此处为类代码...*\n\
       }\n```\n\n如果我们有两个 `LuxuryCar` 对象，`mercedes` 和 `jaguar`，我们可以使用如下表达式比较这两个对象：\n\
  \n`mercedes.compareTo(jaguar)`\n\n此表达式将返回负数、0 或正数，表示 `mercedes` 对象小于、等于或大于 `jaguar`\
  \ 对象。\n\n我们编写 `greatest` 方法的方法是确保只将实现 `Comparable` 接口的对象作为参数传递给它。这样就可以安全地使用其中一个对象来调用\
  \ `compareTo` 方法，并确定哪个对象是最大的。使用泛型，我们可以如下所示编写方法：\n\n![Image](img/01309.jpg)\n\n此方法通过以下符号定义类型参数\
  \ `T`：\n\n`< T extends Comparable<T >`\n\n在泛型符号中，关键字 `extends` 也意味着“实现”。这指定传递给 `T`\
  \ 的类型必须实现 `Comparable` 接口。方法有两个参数变量 `arg1` 和 `arg2`。等等，让我们重新检查文本。（注意：提供的原文包含某些重复/重叠，但任务是格式化所提供的内容）。\n\
  \n实际上，查看末尾提供的文本块，似乎是一个不同的版本或重复部分。我将格式化提示中提供的最后一个块。\n\n等待，提示说“## 以下是需要排版的文本”后面跟着一个长块。我应该格式化*那个特定的块*。\n\
  \n\n\n如果集合的大小为 $N$，它将有 $2^N$ 个子集。每个子集都对应一个长度为 $N$ 的位字符串；反之，每个位字符串对应范围 $0..2^N-1$\
  \ 内的一个二进制数。例如，如果集合为 $S = \\{A, B, C\\}$，则 $N = 3$，且 $S$ 的八个子集每一个都对应一个长度为 3 的位字符串。子集、位字符串和数字之间的三者对应关系如所示。\n\
  \n![Image](img/01313.jpg)\n\n简而言之，原始集合中的每个元素都被分配了一个位置。当相应的子集包含该位置上的元素时，位字符串在该位置上为\
  \ 1。对于大小为 $N$ 的集合，我们可以使用 `java.util.Random` 类的 `nextInt()` 方法在 $0..2^N-1$ 范围内选择一个随机整数\
  \ $k$。接下来我们可以将 $k$ 转换为表示它的二进制字符串，然后将该二进制字符串映射到对应的子集。例如，如果选中的随机数是 5，那么位字符串为 101，选中的随机子集就是\
  \ $\\{A, C\\}$。通过这种方式，我们可以通过在 $0..2^N-1$ 范围内选择随机整数来选取大小为 $N$ 的集合的随机子集。\n\n`Integer`\
  \ 类有两个非常有用的静态方法。第一个如下：\n\n```\nint rotateLeft(int i, int N)\n```\n\n调用此方法时，如果第一个参数\
  \ `i` 的值为 1 且 `N` 小于 32，将返回 $2^N$，即大小为 $N$ 的集合的子集数量。这在以下代码列表的第 38 行所示。要将整数转换为对应的位字符串，我们使用方法：\n\
  \n```\nString toBinaryString(int i);\n```\n\n如第 42 行所示。与你预期相反，返回的字符串 `subsetStr`\
  \ 的长度可能与输入集合 `argList` 的大小不同。这是因为前导零被省略了。例如，对应 $\\{B, C\\}$ 的位字符串将是 11 而不是 011。为了补偿，将\
  \ `1` 位映射到列表元素的代码必须根据省略的零位数量对 `argList` 的索引进行偏移。这段代码出现在第 44–49 行。\n\n以下代码列表演示了一个带有构造随机子集的泛型方法的泛型类。`main`\
  \ 方法通过调用调用该方法来测试该方法，每次调用都传递相同的字符串列表。如程序输出所示，每次调用该方法都可能返回不同的子集。\n\n**代码列表 17-14 `(GenericRandomSubset.java)`**\n\
