  \n**图 7-37** 显示的小计、税费和总额\n\n![Image](img/00503.jpg)\n\n### 7.8 启动界面 (Splash Screens)\n\
  \n> **概念：启动界面是在应用程序加载到内存并启动时显示的图形图像。**\n\n大多数主要的应用程序都会显示启动界面，这是在应用程序加载到内存时显示的图形图像。启动界面通常显示公司标志，并在应用程序启动期间吸引用户的注意力。对于加载时间较长的大型应用程序，启动界面尤为重要，因为它们能向用户保证程序没有发生故障。\n\
  \n从 Java 6 开始，你可以在 Java 应用程序中显示启动界面。首先，你必须使用图形处理程序创建你想要显示的图像。Java 支持 GIF、PNG 或 JPEG\
  \ 格式的启动界面。（如果你使用的是 Windows，可以使用 Microsoft 画画创建图像，它支持所有这些格式。）\n\n在运行应用程序时，你通过以下方式使用\
  \ `java` 命令来显示启动界面：\n\n```\njava -splash:GraphicFileName ClassFileName\n```\n\n\
  `GraphicFileName` 是包含图形图像的文件名，而 `ClassFileName` 是你正在运行的 `.class` 文件名。例如，在 *Brandi’s\
  \ Bagel House* 应用程序相同的源代码文件夹中，你会找到一个名为 `BrandiLogo.jpg` 的文件。该图像显示在图 7-38 中，是 *Brandi’s\
  \ Bagel House* 应用程序的标志。要在应用程序启动时显示启动界面，你应该使用以下命令：\n\n```\njava -splash:BrandiLogo.jpg\
  \ Bagel\n```\n\n当你运行此命令时，图形文件将立即显示在屏幕中央。它将一直显示到应用程序窗口出现为止。\n\n**图 7-38** *Brandi’s\
  \ Bagel House* 应用程序的启动界面\n\n![Image](img/00504.jpg)\n\n### 7.9 使用控制台输出调试 GUI 应用程序\n\
