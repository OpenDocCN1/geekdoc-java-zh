  \n\n\n\n\n## 16.3 算法分析\n\n> **概念：我们可以通过计算算法解决问题所需的步骤数来估计算法的效率。**\n\n算法是解决问题的一种机械化分步程序，是设计程序时使用的基本策略。对于给定的问题，通常有多种算法可以用来解决。例如，我们在上一节中看到，搜索排序数组的问题可以通过两种不同的方法解决：`sequential\
  \ search`（顺序查找）和 `binary search`（二分查找）。\n\n我们如何判断解决某个问题的两个算法中哪一个更好？为了回答这个问题，我们需要建立一套判断算法“优劣”程度或效率的标准。最常用的两个标准是空间和时间。`space`\
  \ 标准指的是算法解决问题所需的内存量，而 `time` 标准则指的是执行时间的长短。在本章中，我们将使用时间标准来评估评估算法的效率。\n\n比较两个算法的一种可能性是把它们编写成代码，然后对生成的\
  \ Java 程序进行执行计时。这种实验方法可以产生有用的信息，但它存在以下缺点：\n\n- 它衡量的是程序的效率，而非算法的效率。\n- 所获得的结果取决于用于编写算法的编程语言，以及用于生成机器码的编译器质量。如果使用不同的语言编写代码或由不同的编译器编译，程序的运行速度可能会更快或更慢。\n\
  - 所获得的结果取决于操作系统如何执行程序，以及程序运行所处硬件的性质。如果我们在不同的计算机和不同的操作系统上运行程序，执行时间可能会不同。\n- 所获得的结果仅适用于执行运行过程中包含的那些输入，可能不能代表算法在另一组输入上的性能。\n\
  \n一种更好的方法是计算算法处理给定大小的输入所需的所需的基本步骤数。为了使这种方法具有意义，我们需要对计算问题、问题输入、输入大小和基本步骤等概念有更精确的定义。\n\
  \n#### 计算问题与基本步骤\n\n`computational problem`（计算问题）是一个需要用算法解决的问题。这类问题是若干个 `instances`（实例）的集合，每个实例都通过以某种预定义格式给定的输入数据来指定。例如，如果问题\
  \ `P` 是对整数数组进行排序，那么 `P` 的一个实例就是一个特定的整数数组。实例的 `size`（大小）指的是存储输入数据所需的内存量。输入大小通常给出一个数字，使我们能够推断出输入数据占用的总比特数。如果数组中每个元素占用的位数是固定的（例如\
  \ 64 位），那么数组的长度就是输入大小的良好衡量。相比之下，如果数组元素的大小没有先验界限，那么数组的长度就不是输入大小的良好衡量。\n\n如果算法执行某一步无论输入大小如何，都能在常数限制的时间内完成，那么该步骤就是\
  \ `basic step`（基本步骤，也称为 `basic operation` 基本操作）。在对整数数组进行排序时，步骤\n\n```\nSwap the\
  \ elements in positions k and k+1\n```\n是基本步骤，因为即使数组长度增加，交换两个数组元素所需的时间也保持不变。相比之下，像如下的步骤：\n\
  \n```\nFind the largest element of the array\n```\n不是基本步骤，因为完成该步骤所需的时间取决于数组的长度。直观地说，基本步骤是理论上可以构建到某些物理计算机硬件中的步骤。\n\
  \n基本步骤的定义并没有规定限制执行该步骤所需时间的常数的大小。忽略这些常数的确切值反映了现实情况：相同的操作在不同的硬件上可能会以不同的速度执行，而在某台计算机上可以通过单条硬件指令执行的操作，在另一台计算机上可能需要几条硬件指令。该定义的结果是，我们可以将任何常数个基本步骤计为一个基本步骤。特别是，一个执行\
  \ `500*n` 基本步骤的算法可以准确地描述为执行了 `n` 个基本步骤。\n\n需要重要的是，普通的算术和逻辑操作（如加法和比较）并不是基本操作，除非对被加或比较的数字的大小加上常数界限。界限的大小并不重要，只要界限是常数即可：它可以是\
  \ 32、64、128、1024 比特，甚至更大，这些操作仍然是基本操作。在接后的讨论中，我们假设算法中作为输入、输出或作为中间结果计算的数字在大小上都是有界限的。这允许我们对它们进行的操作被视为基本操作。\n\
  \n只有在我们描述了算法应该解决的问题后，描述该算法才有意义。一个计算问题的描述方式是：对于每个正整数 `n`，给出大小为 `n` 的典型输入格式，随后是关于解决该问题的算法将产生的输出的描述。例如，对整数数组求和的问题可以描述如下：\n\
  \nINPUT：一个大小为 `n` 的整数数组 `a[ ]`\nSIZE OF INPUT：数组条目的数量 `n`\nOUTPUT：一个表示数组条目总和的整数\
  \ `sum`\n\n在此语境下，解决该问题的算法可以给出：\n\nALGORITHM:\n\n![Image](img/01264.jpg)\n\n####\
  \ 算法复杂度\n\n我们可以通过以下推理来确定该算法在大小为 `n` 的输入上执行的基本步骤数。该算法由两个语句（语句 1 和语句 2）和一个循环（语句 3-6）组成。循环之前的两个语句可以计为一个基本操作。显然，算法执行循环\
  \ `single`（单次）迭代所需的时间不取决于 `n`，因此是常数。（这也可以通过注意到循环内部每条语句都是基本操作来理解。）这允许我们把每次循环迭代计为一个单一的基本操作。由于算法执行了\
  \ `n` 次循环，它总共执行了 `n + 1` 个基本操作。对于较大的问题规模，执行的基本步骤数大约是 `n`。由于隐藏的常数因子，我们说算法处理大小为 `n`\
  \ 的输入需要与 `n` 成正比的时间。\n\n\n\n\n\n输出：范围在 0 ≤ `k` ⊈ `n` – 1 内的整数 `k`，使得 `a[k] = X`，或\
  \ `k = n`\n\n算法：\n\n![Image](img/01265.jpg)\n\n该算法从数组的一端开始，按顺序遍历整个数组。算法一旦遇到 `X`\
  \ 就会停止，但如果 `X` 不在数组中，它将搜索整个数组。算法可能在仅进行一次比较后停止（在检查的第一个项目中找到了 `X`），也可能在进行 `n` 次比较后停止（在最后一个检查的项目中找到了\
  \ `X`，或者它不在数组中）。事实上，对于 1 到 `n` 之间的任何值 `m`，算法都可能执行 `m` 次比较。在算法对相同大小的不同输入执行不同工作量的情况下，通常通过测量对大小为\
  \ `n` 且工作量最大的输入来衡量算法的效率。这被称为通过*最坏情况复杂度函数*来衡量算法。\n\n### 算法的最坏情况复杂度\n\n算法的最坏情况复杂度函数\
  \ `f(n)` 是算法在处理工作量最大的大小为 `n` 的输入时执行的步骤数。它指示了算法解决大小为 `n` 的实例可能花费的最长时间，当我们寻求性能保证时，这是一个很好的效率衡量标准。\n\
  \n让我们来确定二分查找的最坏情况复杂度。该算法用于在升序排列的数组中定位项目 `X`。最坏情况发生在数组中未找到 `X` 时。我们将证明，在这种情况下，算法执行了\
  \ `L + 1` 步，其中 `L` 是循环迭代次数。\n\n正如本章前面所示，该算法由某些变量的初始化以及随后的循环组成。初始化需要常数时间，因此可以被视为一个基本操作。同样，循环的每次迭代都是一个基本步骤（数组条目的数量增加不会增加单次迭代所需的时间）。这表明二分查找所需的步数为\
  \ `L + 1`。现在 `L` 大约等于 `log n` 的整数部分，即 `n` 以 2 为底的对数。为了这一点，请注意要搜索的数组大小初始为 `n`，每次迭代都会将数组剩余部分的大小减半。因为每次循环迭代最多执行两次比较，所以二分查找总共执行了\
  \ `2 log n` 次比较。通过忽略常数因子，我们将结果总结如下：\n\n*在最坏情况下，二分查找所需的时间与 log n 成正比。*\n\n对于最后一个确定算法复杂度的示例，考虑以下选择排序算法变体的大纲，该算法在本章前面也研究过：\n\
  \n输入：一个包含 `n` 个整数的数组 `a[]`\n\n输入大小：数组条目的数量 `n`\n\n输出：重排数组 `a[]` 使得 `a[0] ≤ a[1]\
  \ ≤ … ≤ a[n – 1]`\n\n算法：\n\n![Image](img/01266.jpg)\n\n让我们来确定该算法在排序包含 `n` 个条目的数组时执行的比较次数（涉及数组条目）。所有此类比较都发生在步骤\
  \ 3 中，这显然不是一个基本步骤（它需要与 `k` 成正比的时间，`k` 可以大到 `n`）。让我们用显然是基本的操作来表示步骤 3：\n\n输入：包含 `k\
  \ + 1` 个条目的数组 `a[0..k]`\n\n输入大小：数组条目的数量 `k + 1`\n\n![Image](img/01267.jpg)\n\n很清楚，该算法在数组条目之间需要\
  \ `k` 次比较。\n\n现在回到主排序算法，我们观察到从第 1 行到第 5 行的循环将迭代 `n – 1` 次，对于 `n – 1` 到 `1` 范围内的每个\
  \ `k` 值都有一次迭代。此外，在第 `k` 次此类迭代中，第 3 行的步骤将执行 `k` 次比较：\n\n![Image](img/01268.jpg)\n\
  \n现在我们看到，简单排序算法执行的比较总数由表达式给出\n\n1 + 2 + 3 + … + n – 1 = (n – 1)n/2\n\n对于较大的 `n`，这个表达式非常接近\
  \ `n² / 2`。我们证明了以下：\n\n*在最坏情况下，选择排序所需的时间与 n² 成正比。*\n\n### 平均情况复杂度\n\n最坏情况复杂度不能很好地指示算法在实际情况下的表现，因为产生最坏情况性能的输入很少见。可以使用另一种方法，*平均情况复杂度函数*。\n\
  \n### 渐近复杂度与大 O 符号\n\n通常，我们可以通过观察随着 `n` 变大 `f(n)/g(n)` 的变化来比较两个算法 `F` 和 `G`。虽然从该比例极限的角度考虑有助于比较这两个算法，但我们不能假设这种极限总是存在。事实证明，即使极限不存在，我们也可以从这个比例中获得有用信息：如果我们能找到一个正常数\
  \ `K` 使得\n\n![Image](img/0172.jpg)\n\n我们就可以比较这两个函数。如果可以这样做，意味着对于大问题，算法 `F` 并不比 `G`\
  \ ，换句话说，`F` 至少和 `G` 一样。在这种情况下，我们说 `f(n)` 属于 `O(g(n))`，读作“*f 是 g 的 O*”。定义 `f(n)`\
  \ 属于 `O(g(n))` 的条件通常写成等价形式 (16.2) 所示。\n\n![Image](img/01273.jpg)\n\n证明 `f(n)` 属于\
  \ `O(g(n))` 通常很直观：你查看比例 `f(n)/g(n)` 并尝试找到一个正常数 `K`，使得对于所有 `n ≥ 1` 满足方程 (16.1)。例如，为了证明\
  \ `3n² + 5n` 是 `O(n²)`，查看比例\n\n![Image](img/01274.jpg)\n\n并注意到对于所有 `n ≥ 1`，`5/n`\
  \ 最大为 5。你可以在方程 (16.1) 中使用 `K = 8`。\n\n要证明 `f(n)` *不属于* `O(g(n))`，你必须证明没有办法找到一个正\
  \ `K` 在所有 `n ≥ 1` 时满足方程 (16.1)。例如，函数 `3n² + 5n` 不属于 `O(n)`，因为没有常数 `K` 满足\n\n![Image](img/01275.jpg)\n\
  \n\n\n\n虽然该定义是针对函数的，但“大 O”符号和术语也用于表描述算法和计算问题。因此，如果算法 `F` 的复杂度函数 `f (n*)` 属于 `g (n)`\
  \ 的大 O 阶，我们就说算法 `F` 属于 `O(g (n))`。相应地，数组的顺序查找属于 `O(n)`，而二分查找属于 `O(log n)`。\n\n同样地，如果对于一个计算问题存在一个算法，其最坏情况的复杂度函数属于\
  \ `O(g (n))`，则称该问题属于 `O(g (n))`。因此，数组排序问题属于 `O(n²)`，而对有序数组进行搜索的问题则属于 `O(log n)`。\n\
  \n如果 `g (n)` 是一个函数，那么 `O(g (n))` 可以被视为一组增长速度不于 `g (n)` 的函数族。这些族被称为复杂度类，其中有几个类重要到足以拥有专门的名称。我们在这里按照其增长率从低到高的顺序列出它们：\n\
  \n> 1. `O(1)`：如果存在常数 `K > 0` 使得对于所有 `n ≥ 1` 都有 `f (n) ≤ K`，则函数 `f (n)`属于此类。最坏情况复杂度函数属于此类类的算法被认为是以常数时间运行。\n\
  \n> 2. `O(log n)`：此类类的算法以对数时间运行。由于 `log n` 的增长速度远慢于 `n`，问题规模的巨大增加会导致算法运行时间的少量增加。这种复杂度是搜索问题的特征，即每次操作都能消除一半的搜索空间。`binary\
  \ search` 算法属于此类。\n\n> 3. `O(n)`：此类类的算法以线性时间运行。问题规模的任何增加都会导致算法运行时间的按比例增加。这种复杂度是如\
  \ `sequential search` 等算法的特征，这些算法对输入进行单次（或常数次）扫描。\n\n> 4. `O(n log n)`：此类被称为“n log\
  \ n”时间。问题规模的增加会导致算法运行时间的略微增加。`Quicksort` 的平均情况复杂度属于此类。两种著名的排序算法 `Mergesort` 和 `Heapsort`\
  \ 的最坏情况复杂度函数也属于此类。我们将在第 22 章中讨论 `Heapsort` 算法。\n\n> 5. `O(n²)`：此类被称为二次时间。这种性能是使用两个嵌套循环对输入数据进行多次扫描的算法的特征。问题规模的增加会导致算法运行时间的大幅增加。`bubble\
  \ sort`、`selection sort`、`insertion sort` 和 `Quicksort` 的最坏情况复杂度函数都属于此类。\n\n> 6.\
  \ 所有类 `O(n¹)`、`O(n²)`、`O(n³)`、……的并形成了一个称为多项式时间的类。\n\n* * *\n\n#### 焦点关注：选择高效算法的重要性\
  \ ![Image](img/00008.jpg)\n\n为特定任务选择的算法会对程序的运行时间产生显著影响。作为一个例子，让我们考虑计算斐波那契数列项的任务。你首先在第\
  \ 15 章中遇到这个序列，正如你可能记得的，它的项可以通过这种方法计算：\n\n![Image](img/01276.jpg)\n\n这种实现具有简短且易于理解的优点，因此它经常被用于说明递归。然而，它是非常低效的。我们可以通过将其嵌入一个确定执行该方法所需时间的程序中，来直观感受它有多低效。以下程序允许用户指定六个连续的值作为传递给方法，并打印计算机执行每次调用所需的时间。\n\
