  \ 绘制圆弧\n> i) 绘制一个字符串\n> j) 设置字体\n\n### 14.6 处理鼠标事件\n\n> **概念：Java 允许你创建监听器类来处理由鼠标生成的事件**。\n\
  \n#### 处理鼠标事件\n\n鼠标产生两种类型的事件：鼠标事件和鼠标移动事件。为了处理鼠标事件，你创建一个鼠标监听器（mouse listener）类和/或鼠标移动监听器（mouse\
  \ motion listener）类。鼠标监听器类可以响应以下任何事件：\n\n> • 按下鼠标按钮。\n> • 释放鼠标按钮。\n> • 点击鼠标按钮（按下后释放且未移动）。\n\
  > • 鼠标光标进入组件的屏幕空间。\n> • 鼠标光标离开组件的屏幕空间。\n\n鼠标监听器类必须实现 `MouseListener` 接口，该接口位于 `java.awt.event`\
  \ 包中。该类还必须拥有 表 14-3 中列出的方法。\n\n**表 14-3** `MouseListener` 接口所需的方法\n\n![Image](img/01128.jpg)\n\
  \n注意 表 14-3 中列出的每个方法都接受一个 `MouseEvent` 对象作为参数。`MouseEvent` 对象包含有关鼠标事件的数据。我们将使用 `MouseEvent`\
  \ 对象的两个方法：`getX` 和 `getY`。这些方法返回事件发生时鼠标光标的 *X* 和 *Y* 坐标。\n\n一旦你创建了鼠标监听器类，就可以使用 `addMouseListener`\
  \ 方法将其注册到组件中，该方法继承自 `Component` 类。当相应的鼠标事件发生时，鼠标监听器类中的相应方法会被调用。\n\n鼠标移动监听器类可以响应以下事件：\n\
  \n> • 拖拽鼠标（按下按钮并在按住按钮时移动鼠标）。\n> • 移动鼠标。\n\n鼠标移动监听器类必须实现 `MouseMotionListener` 接口，该接口位于\
  \ `java.awt.event` 包中。该类还必须拥有 表 14-4 中列出的方法。注意这些方法每个也接受一个 `MouseEvent` 对象作为参数。\n\
  \n**表 14-4** `MouseMotionListener` 接口所需的方法\n\n![Image](img/01129.jpg)\n\n一旦你创建了鼠标移动监听器类，就可以使用\
  \ `addMouseMotionListener` 方法将其注册到组件中，该方法继承自 `Component` 类。当相应的鼠标事件发生时，鼠标移动监听器类中的相应方法会被调用。\n\
