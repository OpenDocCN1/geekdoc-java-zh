  \ 对象是一个 `RetailItem`，同样，`DvdMovie` 对象也是一个 `RetailItem`。因此，我们可以创建 `RetailItem` 引用变量并让它们引用\
  \ `CompactDisc` 和 `DvdMovie` 对象。\n\n代码列表 11-35 中的程序演示了如何将接口引用变量用方法参数。\n\n### 代码列表\
