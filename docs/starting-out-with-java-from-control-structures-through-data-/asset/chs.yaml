  \n***\n\n> 2.1 Java 程序的组成部分\n\n***\n\n### 2.1 Java 程序的组成部分\n\n> **概念：** 一个 程序 程序由具有特定用途的部分\n\
  \nJava 程序由不同的部分组成。学习 Java 的第一步是学习这些部分是什么。我们将从查看一个简单的示例开始，如代码列表 2-1 所示。\n\n**代码列表\
  \ 2-1 (`Simple.java`)**\n\n![Image](img/00027.jpg)\n\n![Image](img/00006.jpg)\n\n\
  ***\n\n**提示：** 请记住，程序中显示的行号不是程序的一部分。显示数字是为了我们可以引用特定的行。\n\n如第 1 章所述，Java 源文件的名称以\
  \ `.java` 结尾。代码列表 2-1 所示的程序名为 `Simple.java`。使用 Sun Java 编译器，可以使用以下命令编译此程序：\n\n```\n\
  javac Simple.java\n```\n\n编译器将创建另一个名为 `Simple.class` 的文件，其中包含翻译后的字节码。该文件可以使用以下命令执行：\n\
  \n```\njava Simple\n```\n\n![Image](img/00006.jpg)\n\n***\n\n**提示：** 请记住，在使用 `java`\
  \ 命令时，不需要输入 `.class` 扩展名。\n\n程序的输出如下。这是程序运行时显示在屏幕上的内容。\n\n**程序输出**\n\n```\nProgramming\
  \ is great fun!\n```\n\n***\n\n让我们逐行检查该程序。这是第 1 行的语句：\n\n```java\n// This is a simple\
  \ Java program.\n```\n\n除了该行开头的两个斜杠外，它看起来非常像一个普通的句子。`//` 标记注释的开始。编译器忽略从双斜杠到行尾的所有内容。这意味着你可以在该行输入任何你想的内容，编译器永远不会抱怨。虽然注释不是强制性的，但它们对程序员来说非常重要。大多数程序都比这个示例复杂得多，注释有助于解释正在发生什么。\n\
  \n第 2 行是空的。程序员经常在程序中插入空行以便于阅读。第 3 行内容为：\n\n```java\npublic class Simple\n```\n\n\
  这一行被称为类头头（class header），它标记了类定义的开始。类的用途之一是作为应用程序的容器。随着学习的深入，你将学习更多关于类的知识。现在，只需记住一个\
  \ Java 程序必须至少有一个类定义。这行代码由三个单词组成：\n\n* `public`、`class` 和 `Simple`。让我们仔细观察每个单词。\n\
  * `public` 是一个 Java 关键字，必须全用小写字母。它被称为访问修饰符，控制从何处访问该类。`public` 修饰符意味着对类的访问不受限制。（换句话说，该类是“向公众开放的”。）\n\
  * `class` 也必须用小写字母编写，是一个 Java 关键字，表示类定义的开始。\n* `Simple` 是类名。这个名字是由程序员定义的。该类可以被称为\
  \ `Pizza`、`Dog` 或程序员想要的任何名称。程序员定义的名称可以使用小写字母、大写字母或两者的混合。\n\n简而言之，这行代码告诉编译器正在定义一个名为\
  \ `Simple` 的公共访问类。关于类，还有两点需要知道：\n\n* 你可以在一个文件中创建多个类，但每个 Java 文件只能有一个 `public` 类。\n\
  * 当 Java 文件包含一个 `public` 类时，该公共类的名称必须与文件名相同（不包括 `.java` 扩展名）。例如，代码列表 2-1 中的程序有一个名为\
  \ `Simple` 的 `public` 类，因此它存储在名为 `Simple.java` 的文件中。\n\n![Image](img/00005.jpg)\n\
  \n***\n\n**注意：** Java 是一种区分大小写的语言。这意味着它将大写字母视为与其对应的小写字母完全不同的字符。单词 `Public` 不等于 `public`，`Class`\
  \ 也不等于 `class`。Java 程序中的某些单词必须完全全小写，而其他单词可以使用小写和大写字母的组合。在本章稍后的部分，你将看到所有 Java 关键字的列表，它们必须以小写形式。\n\
  \n***\n\n第 4 行仅包含一个字符：\n\n```java\n{\n```\n\n\n\n\n\n这被称为左大括号，或起始大括号，它与类定义的开始相关。属于该类的所有编程语句都包含在一组括号中。如果你看一眼程序的最后一行（即第\
  \ 9 行），你会看到右大括号。两个大括号之间的所有内容都是名为 `Simple` 的类的*主体*。这里是再次程序代码，这次类定义的主体被阴影标记了。\n\n\
  ![Image](img/00028.jpg)\n\n* * *\n\n![Image](img/00007.jpg)\n\n**警告！** 确保你的程序中每一个左大括号都有对应的右大括号！\n\
  \n* * *\n\n### 第 5 行的内容是：\n\n```\npublic static void main(String[] args)\n```\n\n\
  这一行被称为*方法头*（method header）。它标记了一个*方法*（method）的开始。方法可以被看作一组一个或多个编程语句，这些语句共同拥有一个名称。在创建方法时，你必须告诉编译器关于该方法的若干信息。这就是为什么这一行包含这么多单词。到目前，你只需要关注的是方法名是\
  \ `main`，其余单词都是为了正确定义该方法所必需的。这在图 2-1 中所示。\n\n回想第 1 章内容，在你的计算机上运行的独立 Java 程序被称为应用程序（application）。每个\
  \ Java 应用程序必须有一个名为 `main` 的方法。`main` 方法是应用程序的起点。\n\n**图 2-1** `main` 方法头\n\n![Image](img/00029.jpg)\n\
  \n![Image](img/00005.jpg)\n\n* * *\n\n**注意：** 目前，你将编写的所有程序都将包含一个带有 `main` 方法的类，其方法头与代码列表\
  \ 2-1 所示完全相同。随着本书的深入学习，你将学习 `public static void` 和 `(String[] args)` 的含义。现在，只需假设你正在学习一个组合\
  \ Java 程序的“配方”。\n\n* * *\n\n### 第 6 行有另一个左大括号：\n\n```\n{\n```\n\n这个左大括号属于 `main`\
  \ 方法。记住，括号包含语句，并且每一个左大括号都必须有一个对应的右大括号。如果你看第 8 行，你会看到与这个左大括号对应的右大括号。这些括号之间的所有内容都是\
  \ `main` 方法的*主体*。\n\n### 第 7 行显示如下：\n\n```\nSystem.out.println(\"Programming is\
  \ great fun!\");\n```\n\n简单来说，这一行在屏幕上显示一条消息。消息“Programming is great fun!”打印时是不带引号的。在编程术语中，引号内部的字符组被称为*字符串字面量*（string\
  \ literal）。\n\n![Image](img/00005.jpg)\n\n* * *\n\n**注意：** 这是程序中唯一会导致在屏幕上打印任何内容的行。其他行（如\
  \ `public class Simple` 和 `public static void main(String[] args)`）对于你的程序框架是必要的，但它们不会导致任何屏幕输出。记住，程序是给计算机的一组指令。如果要在屏幕上显示某些内容，你必须使用编程语句来实现该目的。\n\
  \n* * *\n\n行的末尾是一个*分号*（semicolon）。就像句号标记句子的结束一样，分号在 Java 中标记语句的结束。然而，并不是每一行代码都以分号结尾。以下是你不放置分号的场景总结：\n\
  \n> • 注释不必非以分号结尾，因为它们会被编译器忽略。\n> • 类头和方法头不以分号结尾，因为它们是以大括号内部的代码体终结的。\n> • 大括号字符 `{`\
  \ 和 `}` 不是语句，因此你不需要在它们后面放置分号。\n\n看起来关于在哪里放置分号的规则似乎并不明确。现在，只需集中于学习程序的组成部分。你很快就会对哪里应该和不应该使用分号产生直觉。\n\
  \n正如已经指出的那样，第 8 行和第 9 行包含了 `main` 方法和类定义的右大括号：\n\n```\n}\n}\n```\n\n在继续之前，让我们回顾一下刚刚涵盖的重点，包括一些难以捉摸的规则。\n\
  \n> • Java 是一种大小敏感的语言。它不认为大写字母与其小写字母是相同的字符。\n> • 所有 Java 程序必须存储在以 `*.java` 结尾的文件中。\n\
  > • 注释会被编译器忽略。\n> • 一个 `.java` 文件可以包含许多类，但只能有一个 `public` 类。如果 `.java` 文件有一个公共类，该类名必须与文件名相同。例如，如果文件\
  \ `Pizza.java` 包含一个 `public class`，那么该类名就是 `Pizza`。\n> • 每个 Java 应用程序都必须有一个名为 `main`\
  \ 的方法。\n> • 对于每一个左大括号（或起始大括号），必须有一个对应的右大括号（或结束大括号）。\n> • 语句以分号结束。这不包括注释、类头、方法头或大括号。\n\
