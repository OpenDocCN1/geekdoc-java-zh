  \ 200 像素的区域内运行该 applet？\n\n### 14.4 使用 AWT 提高可移植性\n\n> **概念：使用 Swing 组件的 Applet\
  \ 可能与某些浏览器不兼容。如果你想确保 applet 兼容于所有启用了 Java 的浏览器，请使用 AWT 组件代替 Swing 组件。**\n\nJava\
  \ 提供了两个用于创建 GUI 组件的类库。回想第 7 章，这些库是 AWT 和 Swing。AWT 是 Java 自早期版本以来一直包含的原始库。Swing\
  \ 是随 Java 2 引入的改进库。第 7 章和第 13 章 中的所有 GUI 应用程序，以及我们在本章中目前为止学习的 applet 都使用 Swing 类作为它们的组件。\n\
  \n某些浏览器（例如 Microsoft Internet Explorer 和旧版本的 Netscape Navigator）并不直接支持 applet 中的\
  \ Swing 类。这些浏览器需要一个*插件（plug-in）*，这是一种扩展或增强另一个程序的软件，以便运行使用 Swing 组件的 applet。坦率地说，这个插件在安装\
  \ JDK 时会自动安装。然而，如果你是在为他人编写 applet，则无法保证他们拥有所需的插件。如果是这种情况，如果你为他人编写 applet，你应该使用 AWT\
  \ 组件代替 Swing 类。坦率地说，AWT 组件与 Swing 类非常相似，如果你已经学会了使用 Swing。\n\nAWT 类名不以 `J` 开头。例如，创建框架的\
  \ AWT 类名为 `Frame`，创建面板的 AWT 类名为 `Panel`。表 14-1 列出了若干 AWT 类。所有这些类都在 `java.awt` 包中。\n\
