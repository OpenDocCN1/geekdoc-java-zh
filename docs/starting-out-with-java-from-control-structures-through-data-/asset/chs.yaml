  ![Image](img/00930.jpg)\n\n### 在 `try` 语句中仅处理一次每个异常\n\n在不包含多态引用的情况下，每个 `try` 语句对于每种特定类型的异常只能有一个\
  \ `catch` 子句。例如，下面的 `try` 语句将导致编译器发布错误消息，因为它用两个 `catch` 子句处理了一个 `NumberFormatException`\
  \ 对象：\n\n![Image](img/00931.jpg)\n\n有时你可以通过使用多态引用来导致此错误。例如，查看图 12-11，它显示了 `NumberFormatException`\
  \ 类的继承层次结构。\n\n**图 12-11** `NumberFormatException` 类的继承层次结构\n\n![Image](img/00932.jpg)\n\
  \n从图中可以看到，`NumberFormatException` 类继承自 `IllegalArgumentException` 类。现在看下面的代码：\n\n\
  ![Image](img/00933.jpg)\n\n编译器针对第二个 `catch` 子句发布了错误消息，报告 `NumberFormatException`\
  \ 已经被捕获。这是因为捕获 `IllegalArgumentException` 对象的第一个 `catch` 子句会以多态的方式捕获 `NumberFormatException`\
  \ 对象。\n\n如果你在同一个 `try` 语句中处理多个异常，并且某些异常通过继承关系与其它异常相互关联，那么你应该在处理更通用的异常类之前处理更具体的异常类。我们可以如下重写之前的代码，且不会产生错误：\n\
  \n![Image](img/00934.jpg)\n\n### `finally` 子句\n\n`try` 语句可以有一个可选的 `finally` 子句，它必须出现在所有\
  \ `catch` 子句之后。这里是带有 `finally` 子句的 `try` 语句的通用格式：\n\n![Image](img/00935.jpg)\n\n\
  `finally block` 是一个或多个语句，它们在 try 块执行之后以及在抛出异常后任何 catch 块执行之后总是会被执行的。无论是否发生异常，`finally`\
  \ 块中的语句都会执行。例如，下面的代码打开了一个 `doubles` 文件并读取其内容。外部 `try` 语句打开文件，并有一个捕获 `FileNotFoundException`\
  \ 的 `catch` 子句。内部 `try` 语句从文件中读取值，并有一个捕获 `InputMismatchException` 的 `catch` 子句。无论是否发生\
  \ `InputMismatchException`，`finally` 块都会关闭文件。\n\n![Image](img/00936.jpg)\n\n###\
  \ 堆栈跟踪 (Stack Trace)\n\n通常，一个方法会调用另一个方法，而该方法又调用另一个方法。例如，方法 A 调用方法 B，方法 B 调用方法 C。`call\
  \ stack`（调用栈）是当前正在执行的所有方法的内部列表。\n\n当异常在多层方法调用下执行的方法中抛出时，了解哪些方法负责被调用的方法有时是有帮助的。`stack\
  \ trace`（堆栈跟踪）是调用栈中所有方法的列表。它指示了异常发生时正在执行的方法，以及为了执行该方法而顺序调用的所有方法。例如，查看代码列表 12-7 中的程序。它有三个方法：`main`、`myMethod`\
  \ 和 `produceError`。`main` 方法调用 `myMethod`，`myMethod` 调用 `produceError`。`produceError`\
  \ 方法通过向 `String` 类的 `charAt` 传递一个无效的位置数字导致异常。\n\n```\nmain, myMethod, and produceError\n\
  ```\n\n`main` 方法调用 `myMethod`，`myMethod` 调用 `produceError`。`produceError` 方法通过向\
  \ `String` 类的 `charAt` 传递一个无效的位置数字导致异常。`main` 方法调用 `myMethod`，`myMethod` 调用 `produceError`。`produceError`\
  \ 方法通过向 `String` 类的 `charAt` 传递一个无效的位置数字导致异常。`main` 方法调用 `myMethod`，`myMethod` 调用\
  \ `produceError`。`produceError` 方法通过向 `String` 类的 `charAt` 传递一个无效的位置数字导致异常。`main`\
  \ 方法调用 `myMethod`，`myMethod` 调用 `produceError`。`produceError` 方法通过向 `String` 类的\
