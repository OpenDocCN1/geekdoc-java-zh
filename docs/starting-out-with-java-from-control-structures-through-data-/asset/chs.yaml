  \ 当搜索值未在数组中时，返回 -1 是因为 -1 不是一个有效的下标。\n\n## 8.9 二维数组\n\n> **概念：二维数组是数组的数组。它可以被理解为具有行和列**。\n\
  \n数组对于存储和处理一组数据非常有用。然而，有时需要处理多组数据。例如，在一个计算成绩平均分的程序中，老师可能会用一个 `double` 数组记录一个学生的所有测试成绩。如果老师有\
  \ 30 个学生，这意味着她需要 30 个数组来记录整个班级的分数。然而，与其定义 30 个独立的数组，不如定义一个二维数组。\n\n你目前为止所学习的数组都是一维数组。它们被称为*一维*数组是因为它们只能存储一组数据。二维数组（有时称为\
  \ *2D 数组*）可以存储多组数据。虽然二维数组实际上是数组的数组，但最好将其理解为具有行和列元素的元素的结构，如图 8-18 所示。\n\n**图 8-18**\
  \ 行和列\n\n![Image](img/00581.jpg)\n\n\n\n\n图中所示数组有三行（编号从 0 到 2）和四列（编号从 0 到 3）。数组共有\
  \ 12 个元素。\n\n要声明一个二维数组，需要两组括号和两个大小声明符：第一组用于行数，第二组用于列数。以下是一个具有三行四列的二维数组声明示例：\n\n\
  ```java\ndouble[][] scores = new double[3][4];\n```\n\n数据类型中的两组括号表示变量 `scores` 将引用一个二维数组。数字\
  \ `3` 和 `4` 是大小声明符。第一个大小声明符指定行数，第二个大小声明符指定列数。注意每个大小声明符都包含在自己的括号中。这在图 8-19 中有所插图。\n\
  \n**图 8-19** 二维数组的声明\n\n![Image](img/00582.jpg)\n\n在处理二维数组中的数据时，每个元素有两个下标：一个用于行，另一个用于列。在\
  \ `scores` 数组中，第 0 行的元素引用方式如下：\n\n```java\nscores[0][0]\nscores[0][1]\nscores[0][2]\n\
  scores[0][3]\n```\n\n第 1 行的元素如下：\n\n```java\nscores[1][0]\nscores[1][1]\nscores[1][2]\n\
  scores[1][3]\n```\n\n第 2 行的元素如下：\n\n```java\nscores[2][0]\nscores[2][1]\nscores[2][2]\n\
  scores[2][3]\n```\n\n图 8-20 展示了每个元素带有所示下标的数组。\n\n**图 8-20** `scores` 数组每个元素的下标\n\
  \n![Image](img/00583.jpg)\n\n要访问二维数组中的其中一个元素，必须同时使用两个下标。例如，以下语句将数字 95 存储在 `scores[2][1]`\
