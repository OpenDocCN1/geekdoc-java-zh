  md: '# Acting


    see also ACTORS, FILM STARS, THEATRE


    METHOD ACTOR: What is my motivation?

    ABBOTT: Your job.


    +   - George Abbott 1887–1995 American director, producer, and dramatist


    CLAUDETTE COLBERT: I knew these lines backwards last night.

    NOËL COWARD: And that''s just the way you''re saying them this morning.


    +   - Noël Coward 1889–1973 English dramatist, actor, and composer


    when asked to say terrifying during rehearsals:

    We open in two weeks.


    +   - John Gielbud 1904–2000 English actor


    when asked by Michael Horden for advice before playing Lear for the first time:

    All I can tell you, get a Cordelia.


    +   - John Gielbud 1904–2000 English actor


    An actor is a kind of guy who if you ain''t talking about him ain''t

    listening.


    +   - George Glass 1910–84 American film producer


    JOSEPHINE HULL: Shakespeare is so tiring. You never get a chance to

    down unless you''re a king.


    +   - George S. Kaufman 1889–1961 and Howard Teichmann 1916–87 American dramatists,
    in

    them The Solid Gold Cadillac


    on nudity:

    The part never calls for it. And I''ve never ever used that excuse. The box

    office calls for it.


    +   - Helen Mirren 1945– English actress


    I used to work for a life, then I became an actor.


    +   - Roger Moore 1927–2017 English actor


    Acting is merely the art of keeping a large group of people from coughing.


    +   - Ralph Richardson 1902–83 English actor'
