  md: '# Academic Life


    see also EDUCATION


    You can always tell a Harvard man, but you can''t tell him much.


    James Barnes 1866–1936 American writer


    No academic person is ever voted into the chair until he has reached an age at
    which he has forgotten the meaning of the word ‘irrelevant’.


    Francis M. Cornfy 1874–1943 English academic


    Old professors never die, they merely lose their faculties.


    Stephen Fry 1957– English comedian, actor, and writer


    I find that the three major administrative problems on campus are sex for the
    students, athletics for the alumni, and parking for the faculty.


    Clark Kerr 1911–2003 American academic


    In university they don''t tell you that the greater part of the law is learning
    to tolerate fools.


    Doris Lessing 1919–2013 English writer


    of writer friends with degrees in English:


    University seems to have turned into Conan the Grammarians, who fret over perfect
    sentence construction.


    Kathy Lette 1958– Australian writer


    The Socratic method is a game at which only one (the professor) can play.


    Ralph Nader 1934– American consumer protectionist


    relying to Woodrow Wilson’s ‘And what in your opinion is the trend of the modern
    English undergraduate? ?:


    F. E. Smith 1872–1930 British Conservative politician and lawyer'
