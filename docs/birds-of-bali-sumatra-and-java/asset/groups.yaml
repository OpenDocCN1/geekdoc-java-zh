    ## 印度八椋 *Agrosprit sturninus* 17–18cm


    印尼语名称：Jalak Cina


    雄性的识别特征是灰色的头部，头脑后部有一块光亮的紫色斑块，上背部有奇特的紫色羽毛。紫黑色的肩羽与羽毛尖端构成的宽阔白带形成对比。尾臀部为黄米白色，短尾为黑色并带有绿色光泽。腹部呈白色。它的下背部有光亮的紫色。虹状膜为棕色，喙为黑色，腿为灰色。雌性和幼鸟色泽较浅，褐色较多。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_175_0.png)


    观赏地点：作为季节性迁鸟出现在该地区，通常在城市公园和花园中可见，也出现在沿海森林。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_175_1.png)


    ## 爪哇八椋 *Gracupica jalla* 22cm


    印尼语名称：Jalak Suren


    背部主要是黑色，带有棕褐色。它有一条白色翼斑，额头、脸颊、腹部、尾端和臀部也是白色的。眼睛周围裸露的橙色皮肤、黄色的脚和橙白色的喙使这种鸟具有色彩丰富的外观。农业活动和宠物贸易导致野生种群数量锐减，即使今天在鸟市上看到的鸟也可能是人工饲养的。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_175_2.png)


    观赏地点：分布于爪哇岛和巴厘岛。该物种目前处于极临危状态，它们曾在整个地区非常常见，特别是在开阔和耕作的低地地区。


    ## 巴厘八椋 *Leucopsar rothschildi* 25cm


    印尼语名称：Jalak Bali


    它独特的羽毛大部分是白色，除了翅尖和尾尖端是黑色的。它有长长的白色冠羽（雌性较短），眼睛周围有一块天蓝色的皮肤。这种巴厘岛特有物种是世界上最受威胁的物种之一，现在野外仅存极少数鸟类。栖息地的破坏和为了宠物贸易的捕捕是其数量减少的主要原因。


    观赏地点：一小部分野生群体在原生栖地巴厘岛西北部（巴厘西部国家公园）的保护下幸存了下来。遗憾的是，最近它以不科学的方式被引入了巴厘岛的努萨佩尼达岛，那里不是它的原生栖地。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_176_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_176_1.png)


    ## 黑翅八鹊 *Acridototheres melanopter* 23cm


    印尼语名称：Jalak Putih


    除了黑色的翅膀和尾巴以及眼睛周围的一块黄色裸露皮肤外，这种八鹊全身洁白。尾巴末端白色，有一条白色翼斑。爪哇岛西北部的鸟看起来要浅得多，只有飞行用羽和尾巴是黑色的。爪哇岛东南部的鸟有灰色的臀部和肩部。巴厘岛的鸟羽毛对比更明显，腹部、颈部和头部到上背部为白色，背部包括背部到尾部为灰黑色。


    观赏地点：三个亚种特产于该地区：爪哇西北部的黑翅亚、爪哇东南部的灰背亚和巴厘岛的灰臀亚。它们似乎都偏好干旱的沿海草地。


    ## 亚洲八鹊 *Acridototheres tristis* 24–26cm


    印尼语名称：Kerak Ungu


    背部以及腹部中部和侧面为深暖褐色，颈部腹部为深灰色，尾下覆羽逐渐变为褐色和白色。头部、颈部和长长的冠羽呈光黑色，与强有力的黄棕色喙以及眼睛下方和后方的亮黄色裸露皮肤形成对比。栖息时，可以看到前翅上有一条长长的白纹。腿为黄色，尾部为棕色，末端白色。


    观赏地点：分布于苏丹腊岛和巴厘岛的各种栖息地，从城市到开阔地区。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_177_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_177_1.png)


    ## 画鸫 *Zoothera andromedae* 23–25cm


    印尼语名称：Anis Hutan


    这种图案美丽的画鸫喙特别长。它的背部（包括冠部）为灰褐色，黑色的羽毛边缘形成贝壳纹。面部侧面（包括耳部羽和眉间）为白色底黑色斑点，黑色虹状膜周围有一圈白环。喉部、胸部和腹部为浅灰色，在腹部和尾下覆处变为白色。白色侧面有精美的黑色鳞片纹。腿呈粉灰色，喙为黑色。雌雄非常相似。幼鸟上下下褐色较多。


    观赏地点：分布于该地区的丘陵和山地森林。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_178_0.png)


    ## 氏画鸫 *Zoothera horsfieldi* 28cm


    印尼语名称：Anis Horsfield


    按照典型的画类习，该物种的大部分时间都在地面觅食。它只有静静的哨声鸣唱和微弱的啾啾警告声。它的背部为橄榄褐色，带有金褐色和黑色鳞片状斑纹，这些斑纹在背部和上翅羽上更明显。棕色鳞片状腹部较白，上胸部和侧面有浅栗褐色的晕染。


    观赏地点：分布于整个地区，在爪哇岛和巴厘岛的茂密林和山区森林。在苏丹腊岛则局限于北部的山区林地。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_178_1.png)


    ## 爪哇蓝嘴 *Coochoa azurea* 23cm


    印尼语名称：Ciung-mungkal Jawa


    雄性的冠部和大部分背部及尾部为光蓝色，而腹部更偏紫蓝色。喙、冠部、翅和腿为黑色。雌性有蓝色的冠部、翅和尾巴，但其他部分为深棕色。它高调的鸣唱也很很安静，受惊时会发出较较大的“djek-djek-djek”声，让人想起许多其他画类。


    观赏地点：分布于爪哇岛西部和中部，出没于热带山地森林的下层，很少进入树冠。它通常很难发现，因为它似乎会静静不动地栖息许久。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_179_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_179_1.png)


    ## 西伯利亚鸫 *Geokichla sibirica* 20–23cm


    印尼语名称：Anis Siberia


    雄性背部为深石蓝色，侧面为灰色，腹部变为白色。头部和肩部区域呈深石蓝色。尾下覆羽和外尾羽带有白色。腿为黄色，喙为黑色。


    观赏地点：定期越冬于苏丹腊岛和爪哇岛的湿润森林。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_180_0.png)


    ## 褐冠画 *Geokichla* 16–17cm


    印尼语名称：Anis Kembang


    正如其名，这种小画冠部是褐色的，其他部分呈斑纹状。褐冠部延伸到颈部，止于灰色的肩部和背部。它有两条明显的白纹。喉部和上胸部为密黑色，延伸到带有黑点的下胸部和白色腹部。喙为黑褐色，腿为粉色。


    观赏地点：分布于爪哇岛的原始和次生林，巴厘岛罕见。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_180_1.png)


    ## 橙头鸫 *Geokichla citrina* 20–22cm


    印尼语名称：Anis Merah


    头部、颈部和腹部为亮橙色，背部为灰蓝色，尾巴和翅膀为灰色。它有白色腹和翼斑。雌性背部为绿褐色。它的歌非常好听，加上迷人的色彩使其使其当地养鸟爱好者以及近期出口宠物贸易的目标。


    观赏地点：分布于爪哇岛和巴厘岛的低地和山地竹林森林。稀有。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_181_0.png)


    ## 岛鸫 *Turdus poliocephalus* 18–22cm


    印尼语名称：Anis Gunung


    这是一种中等体型的鸫，深灰色头部融入暗黑色背部。喉部和上胸部为中灰色，腹部为栗色，尾端为白色。眼环、喙和腿为黄色。它的鸣声悦耳动听，警告声则是相当嘈杂的咯咯声。


    观赏地点：分布于苏丹腊岛和爪哇岛最高山上。通常可以在当干山（Mt. Tangkuban Perahu）火山附近的苔藓森林中看到。在苏丹腊岛，莱瑟山的山峰是它们的家园。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_181_1.png)


