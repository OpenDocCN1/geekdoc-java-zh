    ## 蓝耳灰嘴 *Psilopogon australis* 16cm


    该地区有两种羽色变异，均具有绿色身体羽毛、黑色颊纹和胸部条纹，以及蓝色的下巴和头顶。爪哇岛的鸟类在脸颊和黑色胸纹下方有黄色斑块，而苏门答腊的鸟类缺少黄色，但脸颊是红色的。也被称为黄耳蜂嘴或小蜂嘴，它们听声多于视觉可见。它们的叫声是快速、重复的“tuk-trrk,
    tuk-trrk”，以及一系列高音的哨声或颤音调。


    观赏地点：森林和种植园常见的蜂嘴鸟，分布于从海岸到该地区低丘的区域。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_98_0.png)


    ## 火簇蜂嘴 *Psilopogon pyrolophus* 28–29cm


    印尼语名称：Takur Api


    与大多数蜂嘴鸟一样，主羽毛为亮绿色。胸部有一条黄色带，下方由一条黑线勾勒。后脑顶和颈后部为红色，下巴是绿色的，耳羽为灰色，眼纹和额头为黑色。在眼眶基部有一个明显的、红尖的黑色羽毛簇。它非常喜欢成熟的水果，特别是小无花果，也捕食昆虫。它会长时间静止地停在高树上，经常发出刺耳的嗡嗡声，听起来非常像蝉。


    观赏地点：分布于苏门答腊和西爪哇，它们在那里偏好低丘和山坡上高大的古树。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_99_0.png)


    ## 黑纹蜂嘴 *Psilopogon javensis* 26cm

    印尼语名称：Takur Tulung-tumpuk


    体型相当大，身体和尾部羽为绿色，这种鸟有黄色头顶和眼睛下方的黄色斑点。它还有红色的喉部，下方是实黑色的颈圈，连接着穿过眼睛的黑色条纹。足部为淡橄榄绿，喙为黑色。与其他蜂嘴鸟一样，足部适应攀爬树干，有两个趾朝前，两个趾朝后。它主要是果实性动物，偏爱小型成熟的无花果、种子、芽芽、花朵，偶尔也吃昆虫。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_100_0.png)


    观赏地点：分布在爪哇岛开阔低地和丘陵森林的空地和森林边缘，在巴厘较少。


    ## 焰额蜂嘴 *Psilopogon armillaris* 20–22cm

    印尼语名称：Takur Tohtor


    这种健壮的小蜂嘴鸟上部主要呈绿色，下部颜色稍浅，额头有醒目的黄橙色。颈后后部为蓝色，在两侧和颈部前方下方有小的橙色斑块。强壮的喙为黑色，额前眼纹也是黑色。来自东爪哇和巴厘的鸟看起来更大，额头和颈下部的橙色更深。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_100_1.png)


    观赏地点：分布在爪哇和巴厘岛的低地和丘陵森林边缘；偶尔出现在人类居住区附近。


    ## 纹纹蜂嘴 *Psilopogon lineatus* 25–30cm


    印尼语名称：Takur Bultok


    这种蜂嘴鸟背部、翅膀和尾部为绿色，头部和上胸呈棕色并布有褐色斑纹。其余下部为绿色，同样有褐色斑纹。眼睛周围有一圈宽的橙黄色裸皮环。厚实的喙颜色多样，从淡粉色到黄色不等，足部为黄色。


    观赏地点：仅分布在爪哇岛和巴厘岛，出没于稀疏的干燥海岸林、稀树边缘、金合树森林、果园和耕作区；经常与其他蜂嘴鸟一起聚集在结果果树上。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_101_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_101_1.png)


    ## 巽达小啄木 *Picoides moluccensis* 13cm


    印尼语名称：Caladi Tilik


    这种小啄木有短腿和灰足，有两个趾朝前，两个趾朝后。它的上部为深棕色带有白色横纹，呈现出部分斑点的外观。下部为白色，并有黑色条纹。它有深棕色的头顶、黑色颊纹、中心为灰褐色的白色脸斑，眼睛后有一条细细的红纹。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_102_0.png)


    观赏地点：分布于整个地区。它偏好红树林、开阔林地和海岸次生林。


    ## 普通火背啄木 *Dinopium javanense* 28–30cm


    印尼语名称：Pelatuk Besi


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_102_1.png)


    雄性拥有红色头冠延伸至后部的羽冠，而雌性的头冠是一块较扁平的黑白羽毛。雌雄外观相似，都有金黄色的背部和覆羽、红色的下背和尾部、黑色的尾巴和初飞羽，以及白色的脸，带有黑色眼纹和单条实色颊纹。白色下部羽毛边缘为黑色，形成鳞片状。它只有三只趾是不寻常的。通过其持续的“churring”接触鸣声引起人注意。


    观赏地点：分布于整个地区。一种常见的低地森林啄木鸟，经常出现在耕作区、种植园甚至花园中，且通常成对出现。


    ## 红翅啄木 *Picus puniceus* 25cm


    这种主要以红色和橄榄绿为主的啄木鸟有黄色的后脑冠，看起来像是长红色头冠和羽冠羽的延伸。颊纹为红色（仅限雄性），眼眶为黑色。覆羽为橄榄绿，腹部为白色。它有红色的喉部。长尖喙为黑色，足部为灰色。


    观赏地点：常见于爪哇岛和苏门答腊岛的原始森林，通常成混合群出现。


    ## 蕾纹啄木 *Picus vittatus* 30–33cm

    印尼语名称：Pelatik Hijau


    这种啄木鸟上部为绿色，但在尾部和二级翅上显示白点。头顶为黑色，喙上方边缘有白色斑块，眼睛后有一条白色条纹，脸侧和耳羽为黑色。下部为带白色的褐色。喙为黑色，足部为灰色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_104_0.png)


    观赏地点：分布于整个东爪哇和巴厘岛。它偏好海岸林、竹丛和椰子园。


    ## 白腹啄木 *Dryocopus javensis* 40–48cm


    外观非常显著且引人注目，体型巨大，除腹部为白色外，全身全黑色。雄性有红色羽冠和颊斑。长尖喙为黑色，足部为灰色。通常比较独居，通过响亮的“笑声”和“犬吠声”以及以及在枯枝上沉重的啄击声来告知自己的存在。它在飞行中经常发出刺耳的“kiow,
    kiow, kiow”。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_105_0.png)


    观赏地点：分布于该地区的开阔低地森林。


    ## 黑跗隼 *Microhierax fringillarius* 14–17cm


    印尼语名称：Alap-alap Capung


    这种微型隼上部为黑色，但在尾部和二级翅上显示白点。头顶为黑色，喙上方边缘有白色斑块，眼睛后有一条白色条纹，脸侧和耳羽为黑色。下巴和腹部为锈褐色，带有白色边缘。腿和蜡膜为黑色，虹膜为棕色。雌性比雄性大一点，幼鸟头部的白色染有红色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_105_1.png)


    观赏地点：分布于整个地区。它出没于森林边缘、开阔地区和灌丛，偶尔出现在稻田上方。


    ## 斑纹啄木 *Chrysophleg mentale* 26–29cm

    印尼语名称：Pelatik Kumis-kelabu


    这种深绿色的啄木鸟颈后和羽冠呈淡黄色。喉部为白色并带有斑纹。宽的锈褐色带从耳后延伸到颈部。覆羽为强烈的栗色和黑色。它有长灰色的喙、红棕色虹膜和灰色足。


    观赏地点：常见于爪哇岛和苏门答腊岛的原始森林和次生林，通常成群出现。

