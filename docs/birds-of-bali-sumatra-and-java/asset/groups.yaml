  mdcn: '


    ## 绿孔雀 Pavo muticus 雄性：180–250cm 雌性：100–110cm 印尼语名称：Merak Hijau


    这种壮丽的雉类主要呈现彩虹绿色，雄性具有显著的眼斑尾羽和头部的垂直冠羽。雌性外与之相似，但颜色较暗，腿部较短，腹部颜色较浅。幼鸟看起来相似，但在面部和颈部有几根白羽。在繁殖季节，可以很容易听到它们的鸣叫声和响亮的鸣叫声，雄性张开尾扇的引人展示也极易辨认。何处可见：爪哇岛上存在少数残遗种群，巴鲁兰国家公园是其最后的堡垒。


    ## 蓝胸斑腹鹌 Synoicus chinensis 12–15cm 印尼语名称：Puyuh


    该物种的雄性特征明显，但雌性容易与凤�鹌混淆。背部呈深褐色，带有较浅的条纹，颜色比雄性浅。雄性有明显的黑白斑纹，胸部、头部两侧和尾下覆羽呈亮蓝色；雌性的腹部为黄褐色条纹，胸部呈较深褐色，喉部有白色斑块。刚出生的幼鸟非常小，几乎像蜜蜂。何处可见：稀疏分布于地区的低地草原、稀树草原和沼泽，有时出现在农耕区。


    ## 红原鸡 Gallus gallus 雄性：65–78cm 雌性：41–46cm 印尼语名称：Ayam-hutan Merah


    雄性通过其锯齿状的红冠、脸部和垂肉、长青铜颈羽以及长弧形尾羽来识别。它们具有栗色到金色的背部以及绿色的胸部和初级覆羽。雌性颜色暗得多；呈不同深浅的褐色，颈部有黑色条纹。喙呈褐色，腿呈板灰色。区分野生鸟和家化鸟并非易事，但纯野生鸟的雄性尾羽和翅羽颜色全黑，雌性为斑驳褐色，并有橙色颈羽。


    ## 绿原鸡 Gallus varius 雄性：65–75cm 雌性：40–46cm 印尼语名称：Ayam-hutan Hijau


    这种大体黑绿色鸟与红原鸡相似，但具有锯齿状的紫色冠。雄性有红垂肉，眼周皮肤裸露，具有光泽绿色背部和颈部，以及边缘带黄色的彩虹绿颈羽，背部和翅覆羽为橙黄色；其余羽毛为黑色。雌性和幼鸟的羽毛颜色较不艳丽，背部为褐色点有浅褐色斑纹，腹部为浅褐色点有黑色斑纹，并有白色喉部。何处可见：分布在海岸附近，也有内陆森林，偏好较开阔的草地，通常与放牧动物聚集在一起。


    ## 巽他环颈鸽 Streptopelia bitorquata 30–33cm 印尼语名称：Dereduk Jawa


    不会与相似的欧斑环颈鸽（Streptelia decao）混淆。通常呈现为粉褐色的鸟，颈部有宽阔的、白色边缘的黑色半环。冠部和颈部为淡蓝色，泛着粉红色，额头为极浅灰色。背部和翅覆羽呈深粉色。腹部为淡粉色，在尾屏和尾下覆羽处变为白色。它有粉褐色的喙、粉色的腿和棕橙色的虹膜。何处可见：主要分布在巴厘岛和爪哇岛的低地，通常出现在开阔地区，但也靠近人类居住区。经常在地面觅食。


    ## 斑鸠 Spilopelia chinensis 30cm 印尼语名称：Tekukur Biasa


    这种非常熟悉的鸽子通常呈粉褐色羽毛，飞行羽颜色稍深，背部有深色斑纹。颈部两侧都有明显的白色斑点黑块。外尾羽末端有宽白色，这在飞行时非常明显。它有红脚和黑喙。何处可见：遍布整个地区，从城市花园到农村耕地、低地的开阔地带和森林边缘，通常在地面觅食。


    ## 纹斑鸠 Macropygia 37–41cm 印尼语名称：Loreng


    因其体型和密集的条纹背部与其他鸽子区分开，这种鸽子颜色较暗；腹部为褐色，带有密集的黑色条纹。冠部和颈部为灰褐色，带有栗色条纹。雄性尾部有绿色虹光。喙为褐色，红脚。何处可见：贯穿地区的亚山地森林。


    ## 环斑鸠 Macropygia emiliana 30cm 印尼语名称：Buaki


    比纹斑鸠小，胸部有白色条纹。背部为浅褐色带黑色条纹，雌性的腹部为较浅的栗色。雄性颈部有绿色虹光，尾羽为黑色。腹部为栗色带黑色条纹。喙和腿为褐色。何处可见：发现于爪哇岛的山地森林，特别是森林边缘和空地。


    ## 小环斑鸠 Macropygia ruficeps 29cm 印尼语名称：Kouran


    比其他环斑鸠小，胸部有黑色条纹。背部为浅褐色并带有虹光，尤其是腹部。雌性颜色较暗，虹光较少。它们有红尖的喙。何处可见：在山地和高地森林中常见。通常成大群出现在边缘并觅食。


    ## 亚洲翠绿鸽 Chalcophaps indica 23–27cm 印尼语名称：Delukan


    这种迷人的地鸽具有彩虹祖绿色的翅覆羽和背部，深灰色背部上有两条明显的白色横纹。飞行羽和短尾为黑色。腹部、颈部和头部两侧为深粉。雄性有白色额头，冠部和颈部泛灰色。雌性较暗。喙亮红，腿和脚为暗粉，眼睛为棕色。何处可见：遍布整个地区，偏好幽密的森林、林缘和红树林。


    ## 斑鸽 Geopolia maugeus 22–26cm 印尼语名称：Perkutut Loreng


    斑鸽常与斑鸠外观相似，但歌声明显不同。此外，它有更强的黑白条纹横跨胸部延伸到侧腹，白色腹和栗色下翅覆羽，眼周裸露黄色皮肤，淡黄色虹膜。何处可见：从巴厘岛向东分布，栖息在干旱的开阔灌丛和草原、低地的农田和林缘，甚至在城市中。

