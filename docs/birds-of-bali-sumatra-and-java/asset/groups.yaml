    Similar in size to the Great White Pelican (Pelecanus onocrotalus) and identifiable
    by its black tail and upperwing-coverts, pinkish pouch stretching the full length
    of the very large pinkish-purple bill, and lack of bare facial skin patch. The
    primaries and secondaries are black, legs and feet grey-blue. It flies with laboured
    wingbeats and catches fish by plunging into the water.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_69_1.png)


    Where to see: It breeds in Australia, migrating north and west as far as Bali
    and East Java. Occasionally


    found singly but more often in small flocks on estuarine sand flats and mudflats.'
  - '[PAGE 70]


    # Cinnamon Bittern Ixobruchus cinnamameus 40–41cm


    Indonesian name: Bambangan Merah


    Adult males have bright cinnamon-brown upperparts and orange-buff under-brown-brown
    underparts and are streaked black on the centre of the belly and along the upper
    flanks. The sides of the long neck are streaked dirty white. Females and immatures
    appear darker, with a black cap, and immatures have a more mottled appearance.
    One of the smaller, more timid bitterns of the region. When disturbed, it rises
    from cover with a croaking alarm call and flies off with slow, powerful wingbeats.


    Where to see: Occurs throughout the region, living in grassland, freshwater swamps
    and rice fields. Common.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_70_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_70_1.png)'
  - '[PAGE 71]


    # Grey Heron Ardea cinerea 85–100cm


    A predominantly grey bird with paler underparts, it has a prominent black streak
    on the head extending into a small nuchal crest, black flight feathers and a line
    of black streaks on the front of its white neck. Legs and bill are yellowish.
    It appears smaller than the Purple Heron and lacks the reddish-brown colour of
    that species.


    Where to see: Found mostly in the region''s lowlands, frequenting wet areas such
    as rice fields, lakes, mangroves and swamps, hunting fish, frogs and crabs. It
    is a colonial nester, often seen in tall trees in the proximity of mangroves.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_71_0.png)'
- md: '

    ## Purple Heron *Ardea purpurea* 75–90cm


    Indonesian name: Cangak Merah


    Similar in height to the Grey Heron, this more elegant, slimmer bird has a less
    hunched stance. Easily distinguished from other herons of its size by its darker
    underparts and its black-streaked, russet-coloured neck and upper breast. The
    back and wings are greyish-purple with a scattering of long purple plumes. It
    has a yellow-brown bill, reddish-brown legs and yellow iris. Juveniles have plainer
    brown plumage, less streaking on the uppersparts and brown bill and legs. Although
    more solitary, it congregates in large colonies to nest.


    **Where to see:** Occurs throughout the region in typical heron open habitat of
    rice fields, swamps, mangroves and lakes, and often inland.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_72_0.png)


    ## Great Egret *Ardea alba* 80–104cm


    Indonesian name: Kuntul Besar


    The largest of the white egrets, with a more substantial bill and a peculiar kink
    midway along the neck. During the breeding period, the facial skin becomes greyish-blue
    and the lores pale green, the bill turns black and the bare thighs turn red. At
    other times of the year, the facial skin is dull yellow, the bill is yellowish,
    occasionally tipped black, and the feet and legs are all black. Juveniles have
    a black-tipped, yellow bill.


    **Where to see:** Occurs throughout the region, preferring mudflats, mangroves
    and coastal marshland, as well as rice fields, where it is found either alone
    or in small groups, feeding on small fish and frogs.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_73_0.png)


    ## Intermediate Egret *Ardea intermedia* 64–72cm


    It is intermediate in size between the Great Egret and Little Egret but is less
    common. Recognised by its overall slightly off-white plumage, no head plumes but
    long back and chest plumes, and bare yellow facial skin only to the front of the
    eye. Unlike the Little Egret it has a yellow bill tipped black.


    Distinguished from the larger Great Egret by its smooth, uninked neck.


    **Where to see:** Occurs throughout the region. It can be found in rice fields,
    mangroves and swamps, and on coastal mudflats, but probably often inland.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_74_0.png)


    ## Little Egret *Egretta garzetta* 55–65cm


    Indonesian name: Kuntul Kecil


    Larger and slimmer than the Cattle Egret, it has greyish-black legs and a black
    bill. Normally brilliant all-white plumage, in the breeding season it develops
    long pendulous plumes on the breast, back and nape and a small, dirty-yellow bare
    facial patch. The Asiatic migrant subspecies is distinguished by having yellow
    toes.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_75_0.png)


    **Where to see:** Occurs throughout the region, mainly in mixed eg flocks in coastal
    lowlands, rice fields, on riverine mudflats and sand bars, alongside small streams.
    It mixes freely with other herons and egrets during their breeding colonies and
    at night-time roosts.


    ## Pacific Reef Egret *Egretta sacra* 58–66cm


    Indonesian name: Kuntul Karang


    The Pacific Reef Egret possesses two colour forms. The commoner form has uniform
    grey plumage, a short, thick neck, very pale chin, dark yellow bill and greenish
    legs. Less common is the white form, which resembles the Cattle Egret but is considerably
    larger and has a sleeker head and neck. It also has relatively short greenish
    legs and a dirty yellow bill.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_75_1.png)


    **Where to see:** Occurs throughout the region, generally confined to coasts and
    seen resting on rocks and cliffs when not hunting at the water''s edge. More commonly
    found on the sandy beaches and reefs of offshore islands.


    ## Cattle Egret *Ardea ibis* 45–55cm


    Indonesian name: Kuntul Kerbau


    Herons, egrets and bitterns


    A smallish white heron, sometimes tinged orange on the forehead. In breeding plumage
    it develops an orange wash over the breast, head and neck, as well as yellow-orange
    bill, legs and toes. Lores more rounded body, short neck and short, thick bill
    distinguish it from other egrets. It nests and roost colonially.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_76_0.png)


    **Where to see:** Common throughout the region, found in rice fields and freshwater
    swampy areas. It is also attracted to grazing cattle, feeding on the insects they
    disturb. In Petulu village, Bali, a large nocturnal roost is protected by the
    belief that the birds carry the souls of Balinese killed in the 1966 anti-Communist
    slaughter.


    ## Javan Pond Heron *Ardea speciosa* 45cm


    Indonesian name: Blekok Sawah


    This heron normally appears dark brown, dark brown streaked with buff underparts
    and black wings. In breeding plumage the neck and head are blackish. It has a
    yellow-brown bill and greenish legs.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_76_1.png)


    **Where to see:** Occurs throughout the region, in freshwater marshes.


    ## Black-crowned Night Heron *Nycticor melanops* 60cm


    A stocky-bodied heron with a black crown, neck and white underparts. In breeding
    plumage the facial skin becomes greyish-blue and the lores pale green. It has
    a yellow-brown bill and red legs.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_77_0.png)


    **Where to see:** Occurs throughout the region, in freshwater marshes and rice
    fields.


    ## Striated Heron *Scorides striata* 35–48cm


    Indonesian name: Kokokan


    Adults are mainly grey with a chestnut crown and long neck. Immatures appear dark
    brown with streaked feathers. It has a yellow bill.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_77_1.png)


    **Where to see:** Occurs throughout the region, in coastal areas and wetlands.


    ## Malayan Night Heron *Gorsachius melanoph* 47–50cm


    Indonesian name: Kowak Melayu


    A solidly built heron with chestnut upperparts and streaked white underparts.
    It has a yellow bill and olive legs. Immatures are dark brown.


    **Where to see:** Occurs as a migrant throughout the region, preferring dense
    vegetation in marshes and reeds.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_78_0.png)


    ## Glossy Ibis *Plegadis falcinellus* 55–66cm


    Indonesian name: Ibis Rokoko


    The only ibis in the region with all-dark plumage, it has green and purple iridescence.
    Immatures are dark brown with buff streaked. It has a long, decurved bill and
    dark legs.


    **Where to see:** Occurs on Java and Bali, in freshwater marshes and rice fields.


    ## Black-headed Ibis *Threskiornis melancephus* 65–75cm


    Indonesian name: Ibis Cucukbesi


    The almost all-white body is offset by a black head and neck and a strong, black
    bill. The long legs are also black.


    **Where to see:** Occurs rarely in Sumatra and north Java, in freshwater marshes
    and by lakes and rivers, flooded grasslands and rice fields.

