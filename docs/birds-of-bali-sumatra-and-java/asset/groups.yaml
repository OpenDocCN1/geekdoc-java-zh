    ## 戴氏针�� *Prinia polychroa* 15–16cm


    这种大型、颜色暗淡的针��有一条长实的褐色尾巴。在繁殖羽期，它的颜色更暗，羽毛磨损严重。在其他时候，它的颜色会变得不再暗，颈部和眼前的眉纹呈白色，腹部为浅褐色，上部为棕色并带有深色条纹。繁殖期喙部为黑色，否则为棕色至黄褐色。腿为粉棕色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_145_0.png)


    **何处可见：** 出于爪哇答，偏好干旱的低地灌木丛。


    ## 宽斑纹针�� *Prinia familiaris* 13cm


    这是一种嘈闹、多才且群群居的小鸟，在从地面到树梢觅食昆虫时，经常发出响亮、高频的啾鸣声。它的特征是带有黑白尖端羽毛的长尾巴、暗淡的橄榄褐色上部以及两条明显的白色翼带。喉部的白色延伸至腹部中部，侧腹为浅灰色，下腹和尾门处为浅黄色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_145_1.png)


    **何处可见：** 爪哇岛和巴厘岛低地非常常见的特有种，但在苏门答腊较少，特别是在北部。它喜好次生林，尤其是公园、花园、红树林、种植园和灌木丛。


    ## 黄腹针鴴 *Prinia flavviventris* 12–14cm

    印尼语名称：Peranjak Rawa


    外表看起来像长尾莺鴱，上部和尾部为橄榄褐色，腹部呈亮黄色，下巴、喉部和上胸部为白色。头部呈灰色，有红橙色的眼环和有一条非常细且往往是断续的白色眉纹。腿和脚为暗橙色，喙上部为深褐色，下部为浅褐色。这种针鴴歌声较弱。


    **何处可见：** 发现于苏门答腊和西爪哇，在地地的草地、芦苇丛和茂密的灌木丛中常见。它性害，倾向于躲在湿地栖息地的草丛和芦苇中。


    ## 普通针鴴 *Prinia inornata* 11cm

    印尼语名称：Peranjak Padi


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_146_0.png)


    这种小型针鴴的冠部、耳罩到背部均为单调的灰褐色，尾巴长尖且末端带褐色。下部在腹部和尾门处呈白褐红色。它有一条宽的白色眉纹。腿为浅褐色。繁殖期喙为黑色，后期变为浅褐色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_146_1.png)


    **何处可见：** 出于爪哇岛和巴厘岛，有灌木丛草地的各种栖息地。


    ## 止止鴹 *Cisticola juncidis* 10cm

    印尼语名称：Cici Padi


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_147_0.png)


    这种相当不显眼的褐色小鸟上部布满了深褐色和褐色的浓密条纹。白色下部和尾门在侧腹呈暖褐色，棕黑相间的尾巴末端带白色。它有粉色的腿、灰黑色的喙和浅褐色的虹膜。宽宽的白色眉纹使其与金头鴹区分开来。


    **何处可见：** 遍布整个地区。低地草地和芦苇丛中常见；会被湿地栖息地和稻田吸引。


    ## 金头鴹 *Cisticola exilis* 9cm

    印尼语名称：Cici Merah


    繁殖期雄鸟具有暖金色的冠部和尾椎。非繁殖期鸟类和雌鸟与止止鴹非常相似，但头部颜色更金，褐色的眉纹与后脑和头部侧面颜色相同。喉部为白色，下部为褐色。深棕色的尾巴末端带有褐色。


    **何处可见：** 遍布整个地区。爪哇岛和巴厘岛芒茅草地、稻田和芦苇丛的常见鸟。仅在苏门答腊局部常见。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_147_1.png)


    ## 东方苇莺 *Accephalus orientalis* 19cm

    印尼语名称：Kerak-basi Besar


    这是一种大型褐色莺，有一条明显的浅褐色眉纹，下方有一条细细的深棕色眼纹。它的下部为白色，在侧腹、尾椎和上腹部过渡为褐色，上腹和胸部侧面有稀疏的棕色条纹。最大的喙上部为褐色，下部染粉色，腿为蓝灰色。


    **何处可见：** 作为冬季候鸟遍布整个地区。通常发现于低地芦苇丛和海岸沼泽，但经常出现在水边附近的稻田和灌木丛。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_148_0.png)


    ## 纹状草莺 *Megalurus palustris* 22–28cm

    印尼语名称：Cica-koreng Jawa


    一种大型长尾莺，雄性比雌性大，但褐色的羽毛非常相似。在深棕色眼纹上方有一条长白色眉纹。上部为浅褐色，背部有较深的深色条纹。下部为白褐色，带有浅表条纹，侧腹较深。喙和虹膜为棕色，腿为黄褐色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_148_1.png)


    **何处可见：** 留于爪哇岛和巴厘岛有高草的湿地和沼泽。


    ## 丛蜂鴶 *Pnoepyga pusilla* 8–9cm


    这种微小的六鴶有暖褐色的下部和橄榄绿的上部。面部和耳罩为深色，尾巴末端带白色。


    **何处可见：** 主要发现于爪哇岛和苏门答腊。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_149_0.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_149_1.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_149_2.png)


    ## 家燕 *Hirundo rustica* 17–19cm

    印尼语名称：Layang-layang


    家燕上部为深色，胸部为白色。翅膀为蓝色，尾巴为近黑色。幼鸟颜色较暗。


    **何处可见：** 在该地区越冬。经常看到在高空盘旋捕食昆虫。有时会成群聚集在芦苇丛、高草地，甚至是建筑上。


    ## 红喉光鴵 *Pycnonotus dispar* 20cm

    印尼语名称：Cucak Emas


    这种大型光鴵上部为橄榄绿色。特征通过其鲜艳的红色喉部和圆尾巴来识别。头部为黑色，尾门处为黄色。喙为黑色，腿为黑色并带橙色。


    **何处可见：** 遍布整个地区。出现在次生林和森林边缘的高树上。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_150_0.png)


    ## 黑头光鴵 *Microtarsus melanocephalus* 16–18cm

    印尼语名称：Cucak Kuricang


    通过黄绿色的身体羽毛以及光亮的头部和喉部来识别。上部为带棕色的黄绿色，翅膀稍深，尾巴为黑色并带宽宽的黑色亚端带。存在稀有变种，黄色区域被暗灰色或绿橄榄色取代。


    **何处可见：** 遍布整个地区，出现在河流和沿海灌木丛中，经常沿路边。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_151_0.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_151_1.png)


    ## 鳞胸光鴵 *Pycnonotus squamatus* 14–16cm


    上部（包括从背部到尾椎）为橄榄绿色，翅膀稍深，黑色尾巴末端带白色。下部胸部和侧腹为黑色，羽毛边缘带白色，产生鳞片状。喉部、颈部和下腹为白色，尾下覆为黄色。头部从额纹经过冠部到后脑和耳罩均为黑色。虹膜从红色到黄色不等；腿和细喙为黑色。苏门答腊的鸟上部颜色更深。


    **何处可见：** 最可能出现在爪哇岛和苏门答腊的森林边缘。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_152_0.png)


