    # INTRODUCTION


    The islands of Bali, Sumatra and Java total some 613,000 square kilometres, almost
    2½ times the area of the United Kingdom, and possess approximately 700 bird species.
    With such a rich avifauna, it is hardly surprising that birds are widely kept
    for their beauty and soul. Visitors, who now reach the region in ever-increasing
    numbers, cannot fail to notice that many houses have caged birds hanging from
    the eaves. Close inspection reveals that many of the species in captivity are
    often the same as those found in pet stores around the world. Fortunately, much
    of the international trading has now ceased, but local markets persist, taking
    their toll on local populations, some being brought to the edge of extinction
    in spite of protective legislation.


    So far, only the Java Lapwing have become extinct in recent times, but several
    others, most notably the Bali Myna, are hovering on the brink. The demise of the
    Bali Myna is widely documented and is largely the result of illicit trapping,
    exacerbated by human disturbance and loss of habitat. The same dismal picture
    is repeated for many other species, including the Java Sparrow, Brahmin Kite and
    Black-winged Starling, of which, were not many years ago, a common sight.


    It is fortunate that the Indonesian authorities, in conjunction with national
    and international conservation organisations, have recognised the urgent need
    for protection, and vast areas have now been designated as national parks and
    reserves, with special protection for wildlife. Visitors should be in mind that
    permits are officially required to enter many of these reserves, and prior arrangements
    may be necessary. Even outside reserve areas the most threatened animals are protected,
    at least in theory.


    Within the space limitations of this small book, it would be impossible to cover
    all the 700 so bird species that have been recorded on the main islands of Bali,
    Sumatra and Java. The selection has therefore been based upon birds that are reasonably
    common throughout the region. A few less common but more spectacular species have
    been added to reveal the enormous biological diversity to be found there and to
    provide an understanding of its characteristic nature.


    The 322 species treated include a reasonable representation from most of the families
    that may be encountered in the region. The reader will undoubtedly come across
    others, and these are covered in the more specialised (but unfortunately more
    cumbersome) books listed for further reading or on the internet.


    # BIRDWATCHING


    For most of us, birdwatching is really putting a name to a bird, but there is
    so much more to be gained from more detailed study subjects. Behaviour, life cycles
    and interaction with the environment are fascinating subjects which not only give
    us enormous enjoyment but can also add much to our knowledge of the world around
    us.


    Initially, however, identification must be the priority. We should consider all
    the clues available and, ideally, identify not just the species but also its sex,
    age and race. There are many clues to go on, and by combining them we narrow the
    possibilities down until our problem is solved. We accept all the value of visual
    clues, but we neglect the importance of sound until we become more experienced.
    For the seasoned birdwatcher, a sounder recorder is just as important a part of
    his her kit as a notebook, binoculars, telescope and field guide. That important
    call can often be identified later in the day.


    ## Birdwatching aids


    Whatever equipment you take, it should be well protected from the ravages of the
    weather. Rain and high humidity provide the worst conditions for cameras, binoculars
    and electronics. Any equipment should be kept dry and well aired and, if possible,
    stored with a bag of silica-gel desiccant to protect against fungal attack. It
    is astonishing how much damage can cause if inadequate precautions have been taken.
    Ideally, lightweight waterproof binoculars are recommended, particularly if you
    are going into wet areas, but for general, the not too expensive kind are perfectly
    adequate for most observation. For the more serious birder, there are many professional-style
    binoculars to choose from, as well as spotting scopes for more distant observation.


    For sound recording, it is possible to use a smartphone for close-up sounds, but
    for better reproduction, use the compact, lightweight and reasonably priced Olympus
    recorders, such as the LS-P5. For more distant birdsong, an added parabolic microphone
    is preferred to a directional ''gun'' microphone.


    As cameras, they are not recommended for regular birdwatching trips, not only
    because of the detrimental effect of the weather on equipment, but also because
    it is almost impossible to concentrate on both activities at once, particularly
    in a group situation.


    It is fortunate that many of the good birdwatching areas are accessible by car.
    Also, there is always public transport and, except on Bali, at the end of the
    journey ubiquitous motorbike-taxis known as ‘ojeks’. In the field, the energy-sapping
    heat and humidity are perhaps the biggest drawbacks. It should be unnecessary
    to advise here on hygiene and the need to carry sufficient bottled water. Keeping
    fit and healthy is extremely important, particularly in areas where medical facilities
    may be poor or non-existent. Do not forget to take essential medication with you,
    and always be prepared for stomach upsets. Remember, ‘Bali Belly’ is not confined
    to Bali. Insects can also be a problem at certain times, and insecticide sprays
    and creams could save you from some nasty bites. Suitable clothing is also essential,
    not only as protection against the elements but also as a disguise. Lightweight,
    dull-coloured clothes are necessary. Visitors are recommended to carry a light
    poncho with a hood, and in lowland forests long trousers are desirable for warding
    off and stinging plants from making contact with your skin. Sturdy footwear is
    a must, although many people prefer heavy-duty sandals, particularly in wet conditions.
    Lightweight canvas boots are better than leather ones, which quickly mouldy. Common
    Green Magpie.


