    ## Edible-nest Swiflet *Aerodramus fuciphagus* 11–13cm

    Indonesian name: Walet Sarang-putih


    Difficult to separate from other swifts in the flight. Plumage is overall blackish-brown,
    appearing greyer on the throat, underparts and rump. Sumatran birds are often
    darker.


    Where to see: They naturally inhabit the region''s dark caves, where they use
    echolocation for navigation. Today, this is the swiflet that has become big business
    in Indonesia, where they are encouraged to nest in disused buildings so their
    nests can be harvested for bird''s nest soup.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_42_0.png)


    ## House Swift *Apus nipalensis* 14–15cm

    Indonesian name: Kapinis Rumah


    This medium-sized swift can be recognised by its broad white rump, pale throat
    and slightly notched tail, unlike the similar but larger Pacific Swift (*Apus
    pacificus*), which has a distinct fork to the tail. Otherwise, it has blackish
    plumage, black bill and brown feet.


    Where to see: Usually seen in large groups hunting insects over open countryside.
    It prefers coastal habitats and the lower hills and is frequently found in towns
    and villages, where it nests under the eaves of houses. It also uses overhanging
    cliff faces and cave entrances as nesting sites.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_42_1.png)


    ## Whiskered Treesift *Hemiprocne comata* 15–17cm


    Smaller than the Grey-rumped Treesift (*Hemiprocne longipennis*), which also occurs
    in the region. Has a long, slightly forked tail and rudimentary crest. Males have
    a mostly dark greenish-bronze body, shiny head and throat offset by long white
    supercilium and moustachial stripes separated by dark chestnut ear-coverts. The
    belly and tertials are whitish. Females are much the same but with dark blue-green
    ear-coverts. Juveniles are duller and browner.


    **Where to see:** Occurs on Sumatra, mainly in lowland primary and secondary forest
    or woodland with tall trees.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_43_0.png)


    ## Common Moorhen *Gallinula chloropus* 30–35cm

    Indonesian name: Mandar Batu


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_43_1.png)


    This very adaptable aquatic bird is almost entirely dark grey to black, with a
    broken white stripe along its flanks. It also displays white patches under the
    tail, particularly when dashing for cover with its tail raised. It has a characteristic
    frontal shield and bill, with a yellow tip to the bill. The legs are greenish-yellow.


    **Where to see:** Frequent the region’s freshwater pools, lakes, rivers and rice
    fields. It is a good surface swimmer and will dive and even run over the water’s
    surface.


    ## Purple Swamphen *Porphyrio porphyrio* 40–48cm

    Indonesian name: Mandar Besar


    Easily recognised, large, blue-black rail with a substantial bright red bill and
    frontal shield, the uppers having a purple-blue sheen on the mantle and sides
    of the neck. the upperwing-coverts are black shaded with green and its undertail-covers
    are white. Its long, ungainly pink legs with huge spreading toes are ideal for
    trampling through and over aquatic vegetation. Habitually flicks its tail.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_44_0.png)


    Where to see: Occurs throughout the region. A rather quiet and secretive bird,
    keeping to the edges of undisturbed reedbeds, marshland and occasionally paddyfields.


    ## White-breasted Waterhen *Amaurornis phoenicurus* 28–33cm

    Indonesian name: Kareo Padi


    A conspicuous rail with a white face, foreneck and breast along with rufous flanks
    and lower belly well-demarcated from the dark grey-green uppers. The bill is greyish-green
    with a red base, and the legs and feet are yellow. It is very vocal at dawn and
    dusk, with a cacophony of weird squawks, grunts and croaking sounds.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_44_1.png)


    Where to see: Occurs throughout the region''s wetlands. It is a wandering feeder,
    frequently out in the open but never far from dense cover. Very agile, it runs
    over floating vegetation and climbs through bushes, searching for insects.


    ## Red-legged Crake *Rallina fasciata* 22–25cm

    Indonesian name: Tikusan Ceruling


    The red-brown mantle and brighter red-brown head along with the red legs are diagnostic
    of this rail. The remaining uparts are grey-brown. The underparts and forewings
    are barred black and white. It has a green bill. Female similar but has a more
    pinkish head with narrower barring on the lower parts of the body. Immatures have
    less obvious markings and paler underparts and brownish legs.


    **Where to see:** Occurs throughout the region’s damp lowland forests and prefers
    disturbed forest edges, and sometimes nearby cultivation.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_45_0.png)


    ## Ruddy-breasted Crake *Zapornia fusca* 21–23cm

    Indonesian name: Tikusan Merah


    Easily confused with other crakes of the region, it is the only one that has both
    head and breast bright chestnut, with a white chin and blackish-brown underparts
    finely barred white. It has a green bill and red legs. Uppersparts are plain russet-brown.


    **Where to see:** A relatively common resident throughout the region’s lowlands.
    As a partially nocturnal and shy bird, it prefers the exclusion of paddyfields
    and reedy habitat and often bushland adjacent to water.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_45_1.png)


    ## Beach Thick-knee *Esacus magnirostris* 51–57cm

    Indonesian name: Wili-wili Besar


    This stocky shorebird is recognised by its substantial black bill, which is yellow
    at the base, and its face, heavily patterned with black and white stripes. The
    crown is dark chestnut, the uppersparts brown, and neck and upper belly lightly
    streaked fawn. The belly to undertailcoverts are buff. The long and thick, rather
    gangly legs are yellow. It has a large yellow staring eye.


    Where to see: Occurs as a resident shorebird throughout the region. Seldom found
    inland, preferring sandy, muddy or rocky coastal beaches, where it finds crabs
    and small crustaceans.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_46_0.png)


    ## Black-winged Stilt *Himantopus himantopus* 35–39cm

    Indonesian name: Gagang-bayang Timur


    This tall and rather elegant shorebird has long pink legs that trail behind in
    flight. It has a long white neck and small head with a slender, straight, black
    bill. The upperparts are black with a slight green iridescence and underparts
    white with some black-grey patches. The white head shows varying amounts of black.
    Females and juveniles have duller uparts.


    Where to see: Occurs mainly in north Sumatra and West Java, preferring particularly
    shallow wetland, swamps and rice fields and occasionally coastal saltmarshes.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_47_0.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_47_1.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_47_2.png)


    ## Grey Plover *Pluvialis squaratola* 27–30cm

    Indonesian name: Cerek Besar


    In winter plumage, this rather attractive water has uparts mottled grey and brown
    and underparts pale grey to white. It has a faint pale supercilium, a black bill,
    dark grey legs and a large black eye. In flight, it shows a pale wing-bar and
    rump and, below, a white underway with a large black patch near the body. These
    features easily separate it from the Golden Plover, which is slightly smaller
    and has a shorter bill.


    Where to see: Occurs as a winter visitor to the region. Found in small groups
    on tidal mudflats feeding on marine invertebrates and often roosting on isolated
    shingle spits.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_48_0.png)


    ## Pacific Golden Plover *Pluvialis fulva* 23–26cm

    Indonesian name: Cerek Kernyut


    A typical plover in shape, with an upright stance, a robust body, neck and lavish
    head with a short, strong bill. In the region it is usually in non-breeding plumage,
    having lost the distinctive black face and underparts it had on its breeding grounds.
    Can be identified by its speckled gold, brown and buff uppersparts, and buff breast,
    face and supercilium. The bill is black and the legs grey.


    Where to see: This winter migrant stops off around the coasts of the Sundas, often
    congregating in flocks. It is common on mudflats and open grassland near the coast.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_48_1.png)

