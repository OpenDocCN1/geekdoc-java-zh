    观赏地点：遍布该地区。可见低地森林边缘。较罕见。


    ## 哀诉锦壳 Cacomantis merulinus 18–23cm

    印尼语名称：Wiwik Kelabu


    成鸟头部、颈部和上胸为浅灰色，与深灰色的翅膀和背部形成对比。胸部的灰色过渡为浅灰色，然后是栗褐色，在腹门处变为黄褐色。尾羽为灰色，末端带白色。红褐色的虹膜周围环绕着狭窄的白色眼圈。喙为黑色，腿部为黄褐色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_37_0.png)


    观赏地点：遍布该地区的低地，特别是在稀疏林中，有时出现在城镇和村庄。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_37_1.png)


    ## 巽他刷锦壳 Cacomantis sepulcralis 21–28cm

    印尼语名称：Wiwik Uncuing


    成鸟背部为灰色，头部为灰色。翅膀为灰褐色，略带绿光。尾羽为黑色，末端带白色，外缘边缘似乎有白色的水平 V 形斑块。下巴上方为灰色，上胸为纯栗色，向腹门处变浅。虹膜为褐色，眼圈为亮黄色，足部为黄褐色，喙为黑色，偶尔下方为黄色。雌鸟下胸部有细微的灰色横纹。幼鸟颜色较暗，具有棕色横纹羽毛。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_38_0.png)


    观赏地点：遍布该地区，通常位于森林边缘和孤立的红树林。


    ## 黑杜鹃 Surnicul lugubris 23–25cm

    印尼语名称：Kedasi-hitam


    这种主要是黑色的蜜壳拥有像牛眼留一样的方形尾巴。背部为闪光黑色，腹部为棕黑色，但尾伞覆盖处有白色条带，整个大腿为全白色。喙为黑色，腿为灰色，虹膜为灰褐色。雌鸟颜色较暗，虹膜为黄色。幼鸟与其相似，但头部、胸部和翅膀上有白色斑点。它们响亮而清亮的叫声是一系列上扬的婉转音。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_38_1.png)


    观赏地点：遍布该地区的低地森林。


    ## 大鹰杜鹃 Hierococcyx sparverioides 38–40cm

    印尼语名称：Kangkkok Besar


    这是鹰杜鹃中最大的物种，成鸟背部为棕色，带有棕色横纹的亚末尾，末端带黑白色。头部为灰色，有明显的黄色眼圈和橙色虹膜。它不像其他鹰杜鹃那样有白色脑后。上胸和腹部为黄褐色，带有密集的棕色条纹和横纹，上胸泛着锈褐色。下腹部和腹门为黄白色。上喙为黑色，下喙为黄色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_39_0.png)


    观赏地点：遍布该地区，主要在低地森林，偶尔在灌木丛。


    ## 普通锦壳 Cuculus canorus 32cm

    印尼语名称：Kangkkok


    成鸟头部、颈部和上胸为浅灰色，与深灰色的翅膀和背部形成对比。胸部的灰色过渡为浅灰色，然后是栗褐色，在腹门处变为黄褐色。尾羽为灰色，末端带白色。红褐色的虹膜周围环绕着狭窄的白色眼圈。喙为黑色，腿部为黄褐色。


    (注：由于提供的待翻译文本中存在大量重复内容和 OCR 错误，此处已按要求进行整合翻译)


