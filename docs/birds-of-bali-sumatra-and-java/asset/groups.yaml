    ## 普通游足鹬 Actitis hypoleucus 19–21cm


    印尼语名称：Trinil Pantai


    这种足鹬上部为棕褐色，下部为白色，有一块棕色斑块从颈部延伸到侧腹。飞行时，其白褐相间的条纹外尾羽清晰可见，白色的翼斑也如此。这是一种非常忙碌的觅食者，尾部不断上下抖动。受到骚扰时，它们通常会飞短一段距离并继续觅食，似乎不受影响。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_57_0.png)


    何处可见：该地区常见的候鸟。通常单独活动，在海岸泥涂滩和河岸边觅食，偶尔也会上游的沼泽和稻田。


    ## 灰尾沙嘴鹬 Tringa brevipes 23–27cm


    印尼语名称：Trinil Ekor-kelabu


    它的上部呈均匀的浅灰色，头顶、颈部和胸部的颜色稍浅。腹部、颈部和尾下为白色。下巴和颈部为白色至灰色。短腿为黄色，喙为黑色且基部呈黄色。雌性比雄性略大，幼鸟的上部呈现白色斑点。


    何处可见：大多数候鸟涉鹬的典型特征，经常出现在潮间带泥滩和卵石岸线，也出现在有海草丛的岩石上。一种常见的候鸟，在该地区东部更为常见。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_57_1.png)


    ## 普通红主 Tringa totanus 27–29cm


    印尼语名称：Trinil Kaki-merah


    这种长红腿涉鹬从头顶到臀部上部都有灰褐色的黑色斑点。喉部、胸部和腹部颜色较浅，黑色斑点更明显。尾部有灰黑和白色的条纹，喙基部为红色，尖端为黑色，黑色虹膜周围环绕着圈白色眼环。


    何处可见：该地区常见的候鸟，广泛分布于河口、盐沼泽和内陆淡水水湿地。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_58_0.png)


    ## 条纹鹹 Turnix suscitator 16–17cm


    印尼语名称：Gemak Loreng


    雄性容易与雌性蓝胸鹹（第21页）混淆，体呈棕色斑驳，胸部和侧腹有黑色条纹。主要的区分特征是该鹹亮黄色的腿和喙。雌性较大，拥有更深（近黑色）的下巴、喉部和头顶，但头部白色更多。在繁殖季节，晚上可以听到雌性发出短促而重复的咕咕声。


    何处可见：常见于整个地区，偏好低地带开阔草地和灌木栖息地。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_58_1.png)


    ## 东方鱼燕 Glareola maldivivarum 23–25cm


    其特征是主要是浅褐色的羽毛，留有白色尾斑和淡黄色的胸斑，胸斑边缘有模糊的黑色颈圈。上部为稍深的棕褐色，头顶有浅色条纹，胸部为深浅褐色，在泄殖处过渡为白色，飞行羽和分叉尾为黑色。腿为灰黑色，大虹膜为黑色，喙尖端为黑色，基部为暗红色。


    何处可见：常见的冬季候鸟，遍布整个地区。通常在水边附近的开阔区域可见：潮汐泥滩、河口、稻田和牧场。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_59_0.png)


    ## 普通黑头鸥 Larus ridibundus 37–43cm


    印尼语名称：Camar Kepala-hitam


    下部和颈部为白色，上部为灰色，包括背部、上覆羽、二级飞羽和内级飞羽。外级飞羽为白色尖带黑色，二级飞羽为灰色尖带白色，尾巴为白色。除了后颈为白色外，头部为黑褐色，与断续的白色眼环形成对比。喙为深红色，腿为浅红色。非繁殖期鸟类的后颈和耳部羽呈带黑色影的白色褐色。


    何处可见：作为稀有的冬季迁访客出现，通常靠近海岸，但也出现在内陆低地、湖泊、稻田和牧场。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_59_1.png)


    ## 烟灰燕鶻 Onychoprion fuscus 36–45cm


    印尼语名称：Dara-laut Sayap-hitam


    繁殖羽的成鸟上部和上翅膀从头顶、颈部到背部均为黑色，外尾羽边缘为白色。额头为白色，至眼睛上方，下部也是如此。翅膀有深色级飞羽。飞行时显示出深分叉尾，白色的翼下覆羽与深色级飞羽形成对比。虹膜为棕色，腿和喙为黑色。非繁殖羽颜色较浅或呈褐色，幼鸟呈类似的褐色，除白色泄殖处、尾下和较浅的翼覆羽外。


    **何处可见：** 出于该地区的海岸线，但很少离岸。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_60_1.png)


    ## 带鹹燕鶻 Onychoprion anaethetus 37cm


    印尼语名称：Dara-laut Batu


    这是一种中型燕鶻，背、尾和翅膀为深灰褐色，下部为白色，尾部长分叉。头顶、颈部和眼纹为黑色，留出狭窄的白色额头，并延伸至眼睛外的短白色眉纹。不要与烟灰燕鶻混淆。翅膀前缘为白色，外尾羽也是如此。


    **何处可见：** 出于该地区的海岸，通常捕食海面上的小鱼或浮游无生物，但在夏季月份较多在陆地上出现。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_61_0.png)


    ## 较小冠燕鶻 Onychoprion bengalensis 37–43cm


    印尼语名称：Dara-laut Benggala


    这种物种看起来与大冠燕鶻非常相似，但体略小且喙为橙色。繁殖后，黑色头冠变为白色。幼鸟上部呈灰褐色，喙为黑色。


    **何处可见：** 作为爪哇岛和巴厘岛常见的冬季迁访客，但在苏答腊腊较少。更多沿沙质和泥质岸线观察到，但在远海。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_61_1.png)


    ## 黑脑纹燕鶻 Sterna sumatrana 30–33cm


    印尼语名称：Dara-laut Tengkuk-hitam


    除了穿过眼睛和环绕颈部的明显黑带以及浅灰色的上部外，这种小燕鶻呈现为白色。飞行时，其极长的分叉尾显而易见。腿为黑色，喙尖为黄色。然而，幼鸟上部为灰褐色，喙为黑色。


    **何处可见：** 这种留留鸟分布于整个地区，通常在离岸岛屿繁殖。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_62_0.png)


    ## 白尾鹸 Phaeeton leptururus 40cm


    印尼语名称：Buntutase Putih


    成鸟通常为白色，有些带有黄色调，有长长的白色尾流。翅尖有黑色标记，上翅有一条黑色横纹。幼鸟没有尾流，且上部有黑色条纹。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_63_0.png)


    何处可见：虽然在该地区部分地区为留鸟，也有来自其他地区的访客。出现在苏答腊岛周围的个体以金色的羽毛为特征，源自圣诞岛。一些在巴厘岛的努萨佩尼达岛以及爪哇岛的南岸繁殖。


    ## 亚洲白颈鹳 Ciconia episcopus 76–91cm


    印尼语名称：Bangau Sandang-lawe


    这种大型、以黑色为主的鹳拥有蓬松羽毛的颈部。尾下和下腹也是白色的，额头和窄的眉纹也是如此。它面部有一块中灰色的皮肤。足为脏红色，而喙为黑色，带有红色调，尖端为红色。幼鸟与成鸟的区别在于黑色羽毛带有棕色。


    何处可见：作为候鸟分布于整个地区，但在爪哇岛和巴厘岛并不常见见。可能会看到它们与其他鹳一起在稻田和牧场觅食，并在高树上与其一同栖息。


