    # 朴实花蜜雀 Pachyglossa modesta 9–10cm


    印尼语名称：Cabai Gesit


    这种花蜜雀体色相对平淡，看起来像是一只小小的、脏脏的灰褐色鸟，尾巴不断向左右抖动，对于花蜜雀来说，它的喙异常厚。背部呈阴的橄榄绿色，腹部呈黄褐色，并分布有不明显的棕色条纹。一条黄褐色的须状下颊纹将浅棕色的颊纹与浅棕色的耳羽分开开来。棕色的尾巴和初级羽边缘有较浅的绿褐色。虹膜呈亮红褐色，腿为棕色和蓝灰色。雌异相似，幼鸟颜色更平淡，腹部呈黄色。


    何处可见：分布于苏门答腊和爪哇腊低地的森林中。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_196_0.png)


    # 橙腹花蜜雀 Dicaeum trigonostigma 8–9cm


    印尼语名称：Cabai Bunga-api


    橙色的腹部、尾脂、臀部和腰背，以及蓝色的头部、翅膀和尾巴是雄性的特征。雌鸟为浅橄榄灰色，灰色喉，腹部变为黄色，臀部为脏橙色。尖下弯的喙为黑色，腿为灰色。幼鸟看起来像暗淡的雌鸟，缺乏黄色或橙色。


    何处可见：遍在该地区的低地，在森林冠层、花园树木和红树林间穿梭。它们非常活跃，寻找小型昆虫以及小型成熟果实。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_196_1.png)


    # 爪哇花蜜雀 Dicaeum sanguinolentum 9–10cm


    印尼语名称：Cabai Gunung


    雄鸟具有血红色的胸部，喉部变为黄褐色。腹部呈粉褐色一直到尾下覆羽。一条宽的黑色条纹覆盖在胸部中心一直到腹部。背部到头部顶部呈光泽的钢蓝色。喙和腿为黑色，虹膜为蓝褐色。雌鸟在橄榄褐色的身体上有亮红色的臀部，腹部染有橙黄色。幼鸟与雌鸟相似，但头部有更多灰色，腹部带有黄色调。


    何处可见：主要分布在爪哇和巴厘岛的山区和丘陵森林，但偶尔也出现在苏门答腊南部。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_197_0.png)


    # 红花蜜雀 Dicaeum trochileum 8–9cm


    印尼语名称：Cabai Jawa


    成年雄鸟从头部到下胸部，以及沿着背部到尾下覆羽均为绯红色。尾巴和上覆翅羽为黑色，腹部为极浅的灰色，在侧腹部和下胸部变深。足部和喙为黑色，虹膜为褐色。雌鸟背部为浅棕色，臀部为绯红色。头部和肩通常呈红褐色。腹部为浅灰白色。幼鸟背部为浅绿褐色，但呈现橙色。


    何处可见：这是一种沿海和低地物种，以昆虫、蜜和果实为食，分布于整个地区。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_197_1.png)


    # 红颊太阳鸟 Chalcoparia singalensis 10–11cm


    印尼语名称：Burung-madu Belukar


    虽然这种小型太阳鸟色彩鲜艳，但在阴影下，它的虹彩往往并不可见，雄鸟甚至呈黑色。然而，在明光下，雄鸟虹彩的深绿色背部和冠部非常华丽，耳羽为深红色。喉部为橙褐色，过渡到黄色腹部。雌鸟颜色较暗，背部为橄榄绿色，腹部为浅橙黄色。直的喙和腿为黑色，腿通常带有绿色调。


    何处可见：这是森林边缘和稀疏林地的鸟，经常与其他物种结伴。分布于苏门答腊和爪哇。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_198_0.png)


    # 棕喉太阳鸟 Anthrepes malacensis 12–13cm


    印尼语名称：Burung-madu Kelapa


    通过其鲜艳的颜色和长弯喙识别，该物种通常悬停在花前寻找蜜。雄鸟有黄色的胸、腹和尾脂，棕色的喉部通常带有深紫色边缘。脸和下巴为橄榄色，背部为虹彩橄榄绿色，融入带有绿光的深蓝色头部。雌鸟上方为橄榄绿色，下方为黄色。在该地区的12种太阳鸟中，只有棕喉太阳鸟和华丽鸟出现在巴厘岛。


    何处可见：分布于整个地区。通常在开放种植园、花园、海岸灌木丛和红树林中可见。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_198_1.png)


    # 哈塞尔特太阳鸟 Leptocoma brasiliana 9–10cm


    印尼语名称：Burung-madu Pengantin


    雄鸟背部主要为深黑色，具有虹彩的翠绿色冠部和颈部，以及蓝色的尾巴。下肩、颈部和脸侧面为纯黑色。覆羽和尾下覆羽上有绿色虹彩。喉和腹部为栗色紫色。雌鸟上方为深橄榄绿，下方为浅橄榄绿。


    何处可见：分布于苏门答腊和爪哇，主要在低地森林，以昆虫、蜜、果实和种子为食。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_199_0.png)


    # 喉太阳鸟 Leptocoma calcostheta 12–13cm


    印尼语名称：Burung-madu Bakau


    雄鸟颜色深，甚至呈黑色。背部有紫色虹彩，胸部有铜光泽。腹部为黄色，尾巴为黑色。雌鸟较小，上方为橄榄绿色，腹部为浅橄榄褐色。


    何处可见：分布在爪哇和苏门答腊的沿海低地，主要在灌木丛、红树林和森林中。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_200_0.png)


    # 华丽太阳鸟 Cnopsis ornatus 10cm


    印尼语名称：Burung-madu Sriganti


    非常小，有长弯喙，橄榄绿色背部配有深色翅膀和尾巴。腹部为亮黄色。雄鸟有带有紫色虹彩的黑色喉和胸。它们是非常活跃且经常喧闹的鸟，要么在花花间穿梭，要么悬停吸蜜。它们的巢是由精细的草和丝状材料织成的精妙结构，危险地悬挂在树枝末端。


    何处可见：分布于整个地区。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_200_1.png)


    # 爪哇太阳鸟 Aethopyga mystacalis 9–12cm


    印尼语名称：Burung-madu Jawa


    雄鸟头部、背部和胸部为绯红色，有黑色冠部和紫色虹彩。翅膀为橄榄灰色，尾部深色。腹部为亮白色，在尾脂处变为浅黄色。臀部也是黄色的。长尾巴为虹彩深紫色。雌鸟背部为橄榄绿色，胸部为浅黄色，腹部为白色。幼鸟颜色更灰。


    何处可见：分布在爪哇亚山地森林地区。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_201_0.png)


    # 绯红太阳鸟 Aethopyga siparaja 10–15cm


    印尼语名称：Burung-madu Sepah-raja


    雄鸟具有黑色冠部，带有虹彩紫绿光泽。从后脑后、过肩部到上覆翅，包括下巴到胸部中部，羽毛均为绯红色。下胸部到尾脂为黑紫色。有一条虹彩蓝色的须状纹。臀部为黄色，其余背部为深棕色至黑色。较小的雌鸟上方为橄榄绿色，腹部为浅橄榄褐色。


    何处可见：分布在苏门答腊南部和爪哇较开的森林和森林边缘，偶尔靠近人类居住区。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_202_0.png)


