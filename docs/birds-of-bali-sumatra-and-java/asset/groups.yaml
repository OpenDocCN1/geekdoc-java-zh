  mdcn: '


    ## 颤声花嘴留 *Pteruthius aenobarbus* 12cm

    印尼语名称：Ciu Kunyit


    这种小型留丝拨��鸟的雄性背部呈橄榄绿黄色，包括冠部、耳罩和次级翼羽的外缘。覆翅羽为黑色末带白色，形成双条翼纹。下巴、喉部和前额下部为红黑色，额顶下方有一条窄的黄色条带。它有白色的眼环，后方带有黑色。腹部为亮橄榄绿色，耳罩亦然，边缘呈灰色与灰色的眉纹相连。腿为粉红色，喙为蓝灰色。雌性颜色较暗，喉部呈黄褐色。


    **观赏地：** 分布于爪哇的低地山林。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_122_0.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_122_1.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_122_2.png)


    ## 斑花嘴留 *Pteruthius flaviscapis* 14cm

    印尼语名称：Ciu Jawa


    这种圆滚的小鸟似乎头部比例偏大，喙较厚。雄性头部为黑色，有明显的白色眉纹，肩和背部为灰色，翅膀和尾巴为黑色，飞羽末带白色，三缘羽带有栗色和黄色。


    下部为灰白色。雌性头部为灰色，眉纹不明显，上部呈灰绿色。


    **观赏地：** 分布于爪哇，更多见于较开阔的山林冠层中。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_123_0.png)

    ![](img/ebd3744cf82a745248fa123f6cbb3e51_123_1.png)


    ## 东南亚啸拨� *Pachycephala calliope* 17–19cm

    印尼语名称：Kancilan Tenggara


    雄性具有亮丽黑色、白色和亮黄色羽毛。颈后的黄色斑块通过一条窄带连接到胸部、腹部和泄门，头部除白色下巴和喉部外均为黑色，喉部和腹部之间留有一条窄黑带。上部为橄榄绿色，尾巴几乎全黑。雌性上部为暗橄榄绿色，下部为脏黄色，下腹部和尾覆盖羽呈黄色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_123_2.png)


    **观赏地：** 分布于东爪哇和巴厘的丘陵和山林、密不透风的以及次生林。


    ## 黑喉黄鹲 *Oriolus xanthonotus* 17–19cm

    印尼语名称：Kepudang Hutan


    雄性的头部、肩、颈部到上胸均为黑色。上部其余部分为亮黄色。飞羽为黑色，边缘带有浅黄色。尾巴为黑色，中覆羽和中羽末端也为黄色。腹部为白色，有密集的黑纹。喙为暗橙色，腿为灰色，虹膜为深红色。雌性颜色较暗，上部通常为橄榄绿色，下部为白色带黑纹，尾覆盖羽为黄色。


    **观赏地：** 分布于苏门腊和爪哇的低地森林边缘。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_124_0.png)


    ## 黑额黄鹲 *Oriolus chinensis* 23–28cm

    印尼语名称：Kepudang Kuduk-hitam


    雄性呈亮黄色，有一条明显的黑纹穿过眼睛并横跨脑后。飞羽和尾巴为黑色，边缘带黄色。雌性颜色暗得多。幼鸟在成年鸟黑色的部位呈橄榄色，下部有白色带黑纹。它们在树冠层觅食昆虫和软果实。


    **观赏地：** 常见于该地区的整个低地和丘陵，包括次生林和开阔森林、公园和花园、红树林和海岸灌木丛。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_124_1.png)


    ## 黑红黄鹲 *Oriolus sanguineineus* 21–24cm

    印尼语名称：Kepudung Melayu


    易于识别为中型黄鹲，雄性除栗红色上腹部和初覆羽的一小块栗红色斑块外，羽毛全黑。它有独特的淡蓝灰色喙和蓝黑色的腿。雌性全黑，胸部带栗色，腹部有有灰色条纹。它的叫声像猫的喵喵声。


    **观赏地：** 分布于苏门腊，主要在阔叶常绿林和山林的树顶。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_125_0.png)


    ## 白胸灰霸 *Artamus leucopus* 18cm

    印尼语名称：Kekap


    白胸灰霸是一种中型鸟，具有引人目的白色胸部和喉部，与其较色的上部形成对比。它有长弯的喙，适合取食果实和昆虫。分布于印度尼西亚的各种森林类型。


    **观赏地：** 从低地到山林的许多地区都很常见。


    ## 黑翅柳�� *Hemipus hirundaceus* 14–15cm

    印尼语名称：Jing


    黑翅柳��是一种小型、活跃的鸟，有明显的黑色翅膀。雄性肩为灰色，下部颜色较浅。经常在森林下层中看到，通常在空中捕捉昆虫。


    **观赏地：** 经常发现于低地森林和森林边缘。


    ## 褐翅啸拨� *Pachycephala pyrhoptera* 16–17cm

    印尼语名称：Batu


    褐翅啸拨�是一种美丽的鸟，翅膀和尾巴呈褐褐色调。雄性喉部颜色较深，下部呈黄色。经常在森林冠层中听到它的声音，叫声很独特。


    **观赏地：** 分布于山林和丘陵地区。


    ## 普通留拨� *Pachycephala galerina* 12–13cm

    印尼语名称：Cipat


    普通留拨�是一种具有橄榄绿黄色羽毛的小鸟。雄性喉部近黑色，下部颜色较浅。经常在花园、果园和森林边缘看到它们。


    **观赏地：** 在各种栖息地都非常常见，包括花园和城市地区。


