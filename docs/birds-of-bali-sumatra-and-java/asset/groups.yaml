    # Ruby-cheeked Sunbird Chalcoparia singalensis 10–11cm


    Indonesian name: Burung-madu Belukar


    Although this small sunbird is brightly coloured, when in the shade its iridescence
    is not often visible, and males even appear blackish. In bright light, however,
    the male’s iridescent dark green uparts and crown are brilliant, and the ear-covers
    are a deep red. The throat is orange-brown, grading into a yellow belly. Females
    are duller, with olive-green uparts and pale orange-and-yellow underparts. The
    straight bill and legs are black, the legs often with a greenish tinge.


    Where to see: This is a bird of forest edge and sparse woodland, often found in
    the company of other species. Occurs on Sumatra and Java.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_198_0.png)


    # Brown-throated Sunbird Anthrepes malacensis 12–13cm


    Indonesian name: Burung-madu Kelapa


    Identified by its bright colour and long, curved bill, this species usually hovers
    in front of flowers in search of nectar. The male has a yellow breast, belly and
    vent, and a brown throat often fringed with dark purple. The face and chin are
    olive and the uparts are iridescent olive-green, blending into a dark bluish head
    with a green sheen. The female is olive-green above and yellowish below. Of the
    region’s 12 different sunbirds, only Brown-throated and Ornate occur on Bali.


    Where to see: Occurs throughout the region. Usually seen in open plantations,
    gardens, coastal scrub and mangroves.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_198_1.png)'
