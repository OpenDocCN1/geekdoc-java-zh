    # Black-capped White-eye *Zosterops atricapilla* 9.5–10cm


    Indonesian name: Kacamata Topi-hitam


    The upperparts of this little white-eye are a solid olive-green becoming black
    on the forehead, forehead, lores and a circle around the eye. The white eye-ring
    is broken by a black spot at the front. The blackish-brown flight and tail feathers
    are also edged olive-green. On the rump, the olive-green becomes yellower, and,
    below, the bright yellow undertail-coverts extend to the lower breast in a stripe
    flanked by dark grey underparts. The throat and bib area are a lemon-green. The
    bill is fawn and black and legs grey.


    Where to see: Occurs in the lower montane forests of Sumatra.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_160_0.png)


    # Lemon-bellied White-eye *Zosterops chloris* 11–12cm


    Indonesian name: Kacamata Laut


    This little white-eye has dullish green upperparts from the crown, over the back
    and wing-coverts to the yellow-green upper-coverts. The underparts are pale yellow,
    brighter on the throat and undertail-coverts. There is a small yellow loral patch
    with the black lores extending below the unbroken white eye-ring to the greenish
    ear-coverts. The tail and flight feathers are blackish, edged green. The bill
    is blackish above and grey below and legs are grey.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_160_1.png)


    Where to see: Occurs in extreme West Java and on Nusa Penida, in a variety of
    habitats, from forest to mangrove and even cultivation.'
