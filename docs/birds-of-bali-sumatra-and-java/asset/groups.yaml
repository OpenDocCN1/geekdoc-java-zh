    ## 黑嘴嘴隼 Baza Aviceda leuphotes 28–35


    印尼尼语名称：Baza Hitam


    被识别为一种小型、体型粗壮的黑色隼，带有尖的羽冠，并有白色和红棕色的斑块。下体上部有黑褐色的横纹，向泄殖腔逐渐变为红色。颈部为黑色，虹膜为红褐色，腿为蓝灰色。飞行时，初级飞羽呈白色，末端黑色，次级飞羽为褐色。幼鸟非常相似，但颜色更暗且更偏棕色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_81_0.png)


    **分布地区：** 作为冬季访客出现在苏门答腊和爪哇。


    ## 爪哇��雕 Nisaetus bartelsi 55–60


    印尼尼语名称：Elang Jawa


    印度尼西亚的国鸟，通过其明显的白色白色深色羽冠即可轻易识别。它有黑色的胡须纹、头部、喉部，颈部有黑色条纹，腹部为棕色，翅膀有白色羽毛。头部侧面和后脑是浓郁的锈褐色，与深褐色的上部融合。长尾巴为棕色带有黑色横纹。虹膜和腿为黄色，蜡膜为深灰色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_81_1.png)


    **分布地区：** 爪哇特有。仅发现于西爪哇的原始森林和山地林区，以及东部的梅鲁贝蒂里国家公园（Meru Betiri）。最后的据点是哈利蒙恩山国家公园。


    ## 鸢类、隼与鹰


    ## 冠头蛇雕 Spilornis cheela 50–70cm

    印尼尼语名称：Elang-ular Bido


    颜色较深，上部为灰巧克力褐色，下部亦然，肩部、腹部和侧腹有白色斑点。头部顶部和背部有一簇竖起的白色斑点羽毛，看起来像羽冠。飞行时，宽大的白色尾带和翅下覆羽上的白色带是显著特征。它有黄色的脚和褐色的喙。通常通过其响亮、尖锐的叫声
    cwe-chee, cwe-chee, cwe-cheemee 被发现。


    **分布地区：** 遍布整个地区。经常出现在林地和森林上空。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_82_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_82_1.png)


    ## 贝氏隼 Tachysypiza virgata 25–35cm

    印尼尼语名称：Elang-alap Besra


    雄性具有均匀的深灰褐色上部，头部为深灰褐色，喉部白色并有一条黑色中线。胸部和腹部为红灰色，上胸中央有密集的黑白条纹。下腹部有白色横纹，一直延伸到白色尾下羽。浅色的尾端显示出三条宽黑纹。雌性通常更棕。苏门答腊亚种（A.
    v. vanbemmeli）颜色更红。喙为黑色，蜡膜为灰色，虹膜为黄色至橙红色。


    **分布地区：** 遍布整个地区，但主要局限于山地和丘陵林地。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_83_0.png)


    ## 东方谷头鸮 Tyto javanica 33–50cm


    印尼尼语名称：Serak Jawa


    谷头鸮遍布世界，许多人对其都很熟悉。它有明显的心形白色脸盘，下体颜色从白色到棕色不等，带有较深色的斑点。头部和上部颜色也多变，从浅褐色到灰色。飞行时通过其通常较浅的颜色、长翅膀、短而方形的尾巴以及不超出尾巴的脚来识别。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_84_0.png)


    **分布地区：** 遍布整个地区，尽管分布稀疏。它们在印度尼西亚是夜行性，且缺失于大部分山区或森林茂密的地区。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_84_1.png)


    ## 东方亚洲谷头鸮 Phodius badius 23–29cm


    印尼尼语名称：Serak Bukit


    这种小猫头鹰有近黑色的眼睛，陷在深褐色的脸盘中，脸盘边缘有一圈细细的深棕色羽毛。短的肉黄色耳羽看起来像是脸盘的延伸。上部从栗色到浅褐色，带有细小的肉黄色斑点；下部为肉粉色，带有细小黑点。短翅膀有黑色横纹，喙为米黄色，脚为黄褐色。雌性稍大，幼鸟颜色更淡、更暗。


    **分布地区：** 出现在于苏门答腊和爪哇，主要在低地森林，有时接近红树林和耕地区。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_85_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_85_1.png)


    ## 环林角鸮 Otus lepus 20–24cm

    印尼尼语名称：Celecuk


    识别并不容易，因为该物种有几种颜色形态。可以是红褐色到灰褐色，上部布满肉黄色斑点；下部颜色较浅并有黑色条纹。它有浅色的沙黄色颈环和较长的肉黄色耳羽。喙和脚为浅黄色。经常能听到雄雌交替发出的柔和“呜”叫声。


    **分布地区：** 遍布整个地区，几乎在500米以下各处可见。经常在城镇捕食昆虫和小型啮类。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_85_2.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_85_3.png)


    ## 肌肉斑鱼鹰 Ketupa ketupa 40–44cm

    印尼尼语名称：Beluk Ketupa


    这种猫头鹰外貌有趣，有亮黄色的眼睛和明显的耳羽。上部为棕色，带有黑色和肉黄色的条纹，下部为明亮的红肉黄色，带有窄纹。它有白色的眉毛、灰色的喙和黄色的脚。


    **分布地区：** 一种遍布整个地区的夜行物种，白天躲在树间。晚上，它们会离开森林进入公园、稻田。总是靠近水边，依赖水中的蛙和其他水生生物为食。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_86_0.png)


    ## 爪哇小嘴鸺 Glaucidium castanopterum 23–25cm

    印尼尼语名称：Beluk Jawa


    这种小鸺有暖棕色的脸部，带有浅橙色和白色横纹，没有明显的脸盘。头部和肩部为棕色浅橙色横纹，上部为暖栗色。翅膀和尾巴有黄色和棕色横纹，下部（包括胸部、腹部和侧腹）为浅肉黄色，并有明显的条纹。翼覆羽边缘为白色。虹膜为黄色，喙和脚为黄黄色。


    **分布地区：** 出现在爪哇的原始森林中。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_87_0.png


    ## 褐色环林鸮 Ninox scututata 27–33cm

    印尼尼语名称：Pungguk Coklat


    成鸟和幼鸟非常相似，具有褐色的头部和上部。下部为白色，带有密集的心形斑点，尾巴有灰棕色的横纹。喙为绿黑色，眼睛为黄色。


    **分布地区：** 遍布整个地区，常见于原始森林和次生林。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_87_1.png


    ## 爪哇蜂蜜 Hapactes reinwardii 34cm

    印尼尼语名称：Luntur Jawa


    与苏门答腊蜂蜜（Hapactes mackl）相似但体型更大，具有绿色的上部从后脑到臀部；尾部为深蓝色。翼覆羽有细密的黄色横纹，喉部和腹部为黄色。宽的灰绿色胸带环绕黑色虹膜。喙为亮红色，脚为橙色。


    **分布地区：** 主要出现在西爪哇的山地森林。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_88_0.png


    ## 橙胸蜂蜜 Hapactes oreskios 25–27cm

    印尼尼语名称：Luntur Harimau


    这种蜂蜜具有引目的橙色胸部，向泄殖腔变为黄色，但胸部以上变为暗橄榄灰色，头部橄榄黄色。深色眼睛有蓝色虹环。上部为红褐色，臀部变浅，尾下羽为黑白间，翼覆羽为黑色细纹。苏门答腊雄性的上胸更黄，雌性为黄灰色。


    **分布地区：** 出现在爪哇和苏门答腊的低地和亚山地森林。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_89_0.png


    ## 大犀鸟 Buceros bicornis 95–105cm

    印尼尼语名称：Rangkong Papan


    巨大的黄色喙和冠、黑脸、染黄的白色颈部和上胸，以及白色尾巴上的黑色末带将其与该地区的犀鸟区分来。背部、下腹和翼覆羽为黑色，白色的翼带常有黄色斑迹。它们有明显的“睫毛”，与其他犀鸟相似。雄性比雌性大，虹膜为红色，裸露虹环为黑色。雌性的虹膜为白色，裸露为粉红色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_89_1.png


    **分布地区：** 稀有物种，局限于苏门答腊的低地和亚山地原始常绿森林。


