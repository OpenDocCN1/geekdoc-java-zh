    # Gede/Pangrango National Park


    This West Javan national park consists mainly of luxuriant evergreen forests,
    but with mossy elfin forest and alpine meadows at the peak of Gunung Pangrango.
    It is a wonderful place to see many of the Javan endemics, such as Javan Tesia,
    Javan Cochoa, Javan Hawk Eagle, Chestnut-bellied Partridge, Javan Scops Owl, Javan
    White-eye, Dusky (Horsfield''s) Woodcock, Pygmy Tit, Mountain Serin, Volcano Swiflet
    and Blue-tailed Trogon.


    mangroves and a rather rugged coastline with some beautiful beaches. It is one
    of the least explored areas where new discoveries are likely to be made. Among
    the rarer birds are Wreathed Hornbill, Banded Woodpecker, Violet Cuckoo, Pin-tailed
    Parrotfin, Black-crested Bulbul, Grey-checked Green Pigeon, Black-naped Fruit
    Dove, Javan Owlet, Waterfall (or Giant) Swiflet, Black-banded Barbet and Crescent-scented
    Babbler.


    # Meru Betiri National Park


    Meru Betiri covers large areas of moist primary and secondary forests.


    # Baluran National Park


    Situated at the north-east tip of Java, Baluran National Park covers the environs
    of the dormant volcano of Gunung Baluran. It is one of the easier places for birdwatching,
    being more open and easily accessible, and is a good place to see Green Peafowl
    and Green and Red Jungles. White-bellied Woodpecker, Oriental Pied Hornbill, Spotted
    Wood Owl, Banded Pitt, Lesser Adjutant and Grey-checked Tit Babbler are all reported
    from the area. and it is difficult to miss Black-naped Oriole, Sooty-headed Bulbul
    and Oriental Magpie Robin. Other species likely to be seen are Black-naped Fruit
    Dove, Collared Kingfisher, Blue-eared Kingfisher, Grey-checked Green Pigeon, Horsfield''s
    Babbler, Ornate Sunbird, Purple-threatened Sunbird, Hill Blue Flycatcher and Yellow-throated
    Parrot.


    # Kebun Raya (Botanic Gardens), Bogor


    Being easily accessible, Bogor''s Botanic Gardens became crowded with local visitors
    at the weekend. A weekday visit, however, can be very fruitful in the comparative
    tranquility. The Enchanting settings of Kebun Raya, covering 1km², have been established
    for around two centuries and provide very ready opportunities to see many town
    and woodland birds. There is a roost of Black-crowned Night Herons,


    # Pangandaran Nature Recreation Park


    Just west of Cilacap on the south coast of Central Java is the peninsula of Pangandaran,
    with its nature recreation park. Consisting mainly of dry forest, it is a good
    area for Green Jungle and Javan Banded Pitt. Other species present are Oriental
    Pied Hornbill, White-rumped Shama, Scaly-crowned Babbler and Black-backed Kingfisher.
    To the east lie the mangroves of Segara Anakan, where many waterbirds can be seen.
    Among the large population of herons, egrets and terns, Lesser Adjutant and Milky
    Stork may be seen. Javan Coucal and Stork-billed Kingfisher have also been recorded
    there.


    # VISITING NATIONAL PARKS


    Fees to enter national parks can be paid at the entrances. In most Indonesian
    national parks, trail networks, experienced bird guides, and accommodation close
    to the best birding sites are limited.


    Javan Pied Starling.


    ## Wandering Whistling Duck Dendrocygna arcuata 40–45cm

    Indonesian name: Belibis Kembang


    Plumage is generally a deep chestnut-brown on the back, tail and breast with white
    undertailcovers rump, and a line of black-edged white feathers showing the folded
    wing. The head and neck are a paler brown, and there is a dark brown elongated
    cap running down the back of the neck. The legs are blackish-brown and bill black.
    This bird emits a series of high-pitched whistling and twittering calls in flight.


    **Where to see:** Rivers, freshwater lakes, wet marshland, coastal wetlands and
    mangrove throughout the region.


    ## Cotton Pygmy-goose Nettaptus coromandelianus 30–35cm

    Indonesian name: Trutu Kapas


    A small black-and-white duck, the male being predominantly white, with iridescent
    black plumage on the crown, back, wings and tail a black neckband. The female''s
    plumage is more subdued, being buffish-white where males are white, and brown
    where males are black; she has a brown eye-stripe and the neck-band. In flight,
    males show a white wing.


    **Where to see:** Throughout Java, Bali and northern coastal wetlands of Sumatra
    marshland and lakes, flooded paddyfields and grassland. Scarce. Unlike most wildlife,
    this species regularly perches in trees and normally in trees.


    ## Garganey Spatula querquala 37–41cm

    Indonesian name: Itik Jurai


    The very distinctive male sports an ostentatious tufted spiky crest above a white
    patch. His overall plumage is black-blue with purple sheen, shaded towards the
    tail; the wings are green. The female is generally brown with a barred pattern
    and a speculum of green and white.


    **Where to see:** Occurs throughout the region, but scarce on open water. Found
    in freshwater lakes, rice fields, saltflats and marshes.


    ## Pacific Black Duck Anas superciliosa 47–60cm

    Indonesian name: Itik Alis


    The name ‘black duck’ is a misnomer, as the bird’s plumage is actually dark brown
    with green speculum. The head is black with a white eyebrow.


    **Where to see:** Occurs throughout the region, but less frequent on Sumatra.
    Found in freshwater lakes, rice fields, marshes and grasslands.


    ## Roul Rollulus rouloul 25cm

    Indonesian name: Puyuh Sengayan


    The male has a short, dark brown crest and bare red skin on the head and neck.
    His overall plumage is black-blue with purple sheen, the wings dark red. The female
    lacks the crest and has grey plumage; the wings are dark-brown and barred black.


    **Where to see:** Lowland peat bogs and hill forests of Sumatra. Often a single
    male accompanied by several females, foraging for seeds, insects, and fallen fruit.


    ## Chestnut-bellied Partridge Arborophila javanica 27cm

    Indonesian name: Puyuh-gongong Jawa


    Endemic to Java, each subspecies has a different head pattern of reddish-buff
    with black markings and a black collar. The breast is grey varying through chestnut
    to a white vent. The flanks are chestnut, the back and tail grey-brown and barred
    black, and wings brown with black barring and small white spots. The legs are
    red and the bill blackish.


    **Where to see:** Occurs in clearings in montane forests on Java, usually in pairs
    but occasionally in small groups, foraging amongst undergrowth.


    ## Great Argus Argianus argus male 160–200cm, female 70–75cm

    Indonesian name: Kuau Raja


    One of the most spectacular of the region’s pheasants, particularly the males
    with their extraordinarily elongated secondary and tail feathers used in their
    mating display. With tail raised high and wings spread wide, the beautiful patterning
    of green ‘eye’ marks (ocelli) is spectacular. Plumage is otherwise mainly chestnut-brown,
    broken and patterned by spots and flecks of buff and black. The female is generally
    darker, has shorter wings and tail, and lacks the male’s eye spots. Both sexes
    have a short, dark brown crest and bare blue skin on the head and neck.


    **Where to see:** Undisturbed primary rainforests of Sumatra. Often a single male
    accompanied by several females.

