    ## 草头吊 Pycnonotus zeylanicus 28–29cm


    印尼语名称：Cucak Rawa


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_153_0.png)


    优妙的歌声使得这一物种在印度尼西亚作为笼养鸟广受欢迎。它是最大的八留鸟之一，其特征是草色的冠部和耳羽，以及黑色的胡须纹。背部、翅膀和尾部呈绿褐色。它有一条细的黑色眼纹、白色的下巴和喉部、灰色的胸部和腹部，以及黄色的尾缘。上胸和背部有少量白色条纹。


    **在哪里看到：** 分布于爪哇岛。曾常见于低地、丘陵森林和河流栖息地，现在处于极危状态。


