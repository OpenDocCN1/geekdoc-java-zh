    ## 大鴴 Turdinus macrodactyl 19–21cm


    印尼语名称：Berencet Besar


    这种大型鴴的背部为深褐色并并有黑色条纹，冠部为浅褐色，在覆羽和尾部处颜色变得更浅、更暖。腹部为白色，喉部布有棕色斑点，上腹部为灰褐色带白色斑点，在苏门答腊的个体中会形成模糊的胸带，但在爪哇西的个体中缺失。爪哇西的个体通常颜色较深。眼睛周围有一圈蓝色的皮肤。耳羽为深褐色。喙呈黑色，腿为深褐色。


    **观赏地点：** 出于苏门答腊和爪哇西的低原生林和茂密林中。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_167_0.png)


    ## 巽没短眉麍 Alcippe brunneicauda 14.5–15cm


    印尼语名称：Wergan Coklat


    这种色彩相当平淡的森林栖息麍灰色头部带有棕色冠部。背、翅膀和尾巴为棕色，翅膀、尾部和上覆羽看起来更偏红褐色；腹部为黄白色。喙、腿和虹膜均为灰褐色。雌雄外形相似，但幼鸟颜色较浅，喙为黄棕色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_167_1.png)


    **观赏地点：** 出于苏门答腊的低地森林，它们更偏于树冠层。


    ## 爪哇短眉麍 Alcippe pyrrhoptera 14–15cm


    印尼语名称：Wergan Jawa


    这种鸟从冠部到背部和翅羽上均呈淡栗褐色，在臀部和尾巴处变为更暖的栗色。冠部有浅的深色横向条纹延伸至后脑，边缘衬有模糊的黑褐色眉纹。耳羽为浅栗色，带有纤细的白色条纹。喉部和腹部为黄褐色，侧腹较棕。喙为黑色，腿为浅黄棕色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_168_0.png)


    观赏地点： 出于爪哇西和爪哇中部的低山森林。


    ## 巽没画眉鴇 Garrulax palliatus 25cm


    印尼语名称：Poksai Mantel


    **观赏地点：** 出于苏门答腊的低山森林。现较为稀有。


    这种笑喉鴇的头部到背部、肩部以及下腹部均为灰色；腹部到尾门处变为灰灰色。带刺的额结、下巴和脸部为黑色。背部（包括翅膀）为红黑色；尾巴也是如此。虹膜为暖灰褐色，周围环有一大片银蓝色的裸皮。腿为深褐色，喙为灰黑色。幼鸟颜色更暗、更棕。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_168_1.png)


    ## 眼眼镜笑喉鴇 Garrulax mitratus 22–24cm


    印尼语名称：Poksai Genting


    这种深灰色的笑喉鴇具有栗色的冠部和眉纹，宽大的白色眼圈，以及亮橙黄色的喙和腿。它还有栗色的尾门和初级飞羽上的白色斑块。额结、脸部和下巴的硬羽毛给人以黑色面具的印象。前冠部的几根羽呈白色，灰色的尾巴末带黑色，虹膜为红褐色。幼鸟颜色更暗、更棕。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_169_0.png)


    观赏地点：一种出现在苏门答腊的低山森林物种。


    ## 长尾山嘴雀 Heterophasia picaoides 28–35cm


    印尼语名称：Sibia Ekor-panjang


    一种长尾灰色鴴，尾羽末端有白色，有明显的白色翼斑。头部为灰色，背部带有灰褐色。腹部为较浅的灰色，腹部带棕。略微下弯的喙是黑色的，虹膜为红褐色，腿为灰色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_169_1.png)


    观赏地点： 居住在苏门答腊的阔叶常绿林边缘和低山森林中，取食各种昆虫、果实、种子甚至花蕾。


    ## 银耳嘴��雀 Leiothrix argentauris 15–17cm


    印尼语名称：Mesia Telinga-perak


    雄鸟特征明显，亮亮的银色耳羽与黑色的冠部和脸部形成对比，亮黄色喙的基部有一小簇黄橙色的羽毛。下巴、颈部和前领为深橙色，过渡到橄榄色的背部和较浅橙色的胸部。尾巴为黑色带黄色缘边，腿和虹膜为黄色。雌鸟颜色较暗。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_170_0.png)


    观赏地点： 出于苏门答腊，但由于捕捕，在其偏好的山地栖息地正变得稀有。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_170_1.png)


    ## 黑额头麴 Sitta frontalis 12–13cm


    印尼语名称：Munguk Bebledu


    黑额头麴有红喙和红足，腹部为脏粉白色，喉部为白色。背部主要为紫蓝色，尾部和初级飞羽有黑色边缘，额头为天鹅般的黑色。这是一种非常活跃且迷人的鸟，与该地区的其他麴不同，它非常适应在苏门答腊和爪哇的树干上爬爬寻找昆虫和蜘蛛。通常成对出现，偶尔也成小群，在林下层中随机移动。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_171_0.png)


    观赏地点： 常见于苏门答腊的低地森林、丘陵森林和种植园。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_171_1.png)


    ## 蓝麴 Sitta azurea 13cm


    印尼语名称：Munguk Loreng


    在阴影森林中它看起来背部是黑色的，但实际上其背、翅和尾是光亮的深蓝色。只有冠部、后脑和脸侧是黑色的。喉和胸部为蓝白色。爪哇东的个体下腹和尾门为蓝黑色，但爪哇西和苏门答腊的个体为黑色。它有黄灰色的喙和灰色的足。这种麴通常在树枝和树干上觅食，利用树皮碎片获取幼虫和昆虫。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_172_0.png)


    **观赏地点：** 出于苏门答腊的巴里桑山脉和爪哇，在低山森林中很常见。


    ## 亚洲光鹊 Aphonis panayensis 20cm


    印尼语名称：Perling Kumbang


    成鸟全身黑色，体将其与短尾鹊 *(Aphonis minor)* 区分来，后者体型更大且具有绿色金属光泽。它有深红色的眼睛和黑腿。


    在巴厘岛，它们比爪哇和苏门答腊的鸟小。幼鸟有黄色虹膜、带黑色条纹的白色腹部，背部有黑棕色条纹。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_172_1.png)


    **观赏地点：** 一种分布于该地区森林附近、次生植被以及海岸灌木丛开阔地的常见低地鸟，也被椰子种植园、耕作区和花园吸引，经常出现在城镇和城市中。


    ## 大嘴嘴鹊 Scissirostrum dubium 20cm


    印尼语名称：Jalak Tunggir-merah


    这种小鹊以其灰色为主的羽毛易于识别，拥有厚实的“大嘴型”橙黄色喙，以及鲜红色的长尾下覆羽（部分末端带光）。腿也是橙黄色的，虹膜为黑棕色。


    观赏地点： 出于爪哇。偏好低地森林边缘的树冠层，在那里经常成群聚集觅食果实、种子和昆虫。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_173_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_173_1.png)


    ## 普通山雀 Gracula religiosa 27–35cm


    印尼语名称：Tiong Emas


    全身黑色，带有紫色光泽，眼睛后方和下方有橙色肉冠，翅上有白色翼斑。它有黄色足和粗壮的橙色喙。这也是另一种因栖息地丢失和宠物贸易而面临巨大压力的物种，这种鸟因其模仿其他鸟的能力以及丰富的哨声和鸣声而备受青睐。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_174_0.png)


    观赏地点：虽然它们偶尔成小群聚集，但更有可能在高树上成对出现。它们曾是低地森林边缘的常见鸟，在巴厘岛和爪哇已变得稀有，但在苏门答腊仍保持一定数量。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_174_1.png)


