    and a prominent yellow-and-orange forehead. The rear of the nape is blue and there
    are small patches of orange either side and just below the front of the neck.
    The strong bill is black, as is the frontal eye-stripe. Birds from East Java and
    Bali appear larger with darker orange on the forehead and lower neck.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_100_1.png)


    Where to see: Occurs on Java and Bali at edges of lowland and hill forest; occasionally
    around nearby habitation.'
  - '[PAGE 101]


    # # Lineated Barbet Psilopogon lineatus 25–30cm


    Indonesian name: Takur Bultok


    This barbet has a green back, wings and tail, and a brown head and upper breast
    heavily streaked with buff. The remaining underparts are green, also streaked
    with buff. It has a broad orange-yellow orbital ring of bare skin. The heavy bill
    is variable in colour, from pale pink to yellow, and the feet are yellow.


    Where to see: Occurs only on Java and Bali, frequenting sparse, dry coastal woodlands,
    edges of savanna, acacia forest, orchards and cultivated areas; often gathers
    with other barbets at fruiting trees.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_101_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_101_1.png)'
  - '[PAGE 102]


    # Sunda Pygmy-woodpecker Picoides moluccensis 13cm


    Indonesian name: Caladi Tilik


    This little woodpecker has short legs and grey feet, with two toes pointing forward
    and two backward. Its uparts are dark brown with white barring, giving a partially
    spotted appearance. The underparts are whitish with black streaking. It has a
    rich brown crown, black malar stripe, white face patch with a greyish-brown centre,
    and thin red stripe behind the eye.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_102_0.png)


    Where to see: Occurs throughout the region. It prefers mangroves, open woodland
    and coastal secondary forest.


    # Common Flameback Dinopium javanense 28–30cm


    Indonesian name: Pelatuk Besi


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_102_1.png)


    The male has a red crown extending into a crest at the rear, whilst the female’s
    crown is a more flattened mass of black-and-white feathers. Both, sexes are similar,
    having a golden-yellow mantle and wing-coverts, red lower back and rump, black
    tail and primaries, and a white face with a black eye-stripe and single solid
    malar stripe. The white underpart feathers are edged black, forming a scaly pattern.
    It is unusual in having only three toes. Noticed by its continual ‘churring’ contact
    calls.


    Where to see: Occurs throughout the region. A common lowland forest woodpecker,
    regularly appearing around cultivation, plantations and even in gardens, and usually
    in pairs.'
  - '[PAGE 103]


    # Crimson-winged Woodpecker Picus puniceus 25cm


    This predominantly red and olive-green woodpecker has a yellow hindcrown appearing
    as an extension to the long red crown and crest feathers. The malar stripe is
    red (only on the male) and lores black. The ear-coverts are olive-green running
    down the neck and onto the breast and back, with the upper


    breast and throat tinged brown. The wing-coverts are red, the bill brown above,
    yellow below. The iris is red and the legs are dirty green.


    Where to see: Occurs commonly in primary and secondary forest on Java and Sumatra,
    often in mixed flocks.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_103_0.png)'
  - '[PAGE 104]


    # Laced Woodpecker Picus vittatus 30–33cm

    Indonesian name: Pelatik Hijau


    This woodpecker has green upperparts and nape, a yellow rump and a black tail.
    The underparts are buffish-yellow with the feathers edged in green, giving the
    laced appearance. Males have a red crown, this black in females. The cheeks are
    blue-grey, bordered by a black eye-stripe and malar stripe, both of which are
    mottled with white. The black primaries are barred with white. The bill is black
    and the feet grey-grey.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_104_0.png)


    Where to see: Occurs throughout east Sumatra, Java and Bali. Prefers coastal woodland
    and forest, and often found in mangroves, bamboo thickets and coconut plantations.


    # Checker-throated Yellowname Chrysophlegma mentale 26–29cm

    Indonesian name: Pelatik Kumis-kelabu


    This sombre dark green and red woodpecker has pale yellow feathers appearing as
    a nuchal crest. The throat is white and black chequered. A wide dull rufous band
    stretches from the rear of the ear-covers on the sides of the neck and onto the
    breast. The wing-covers are intense chestnut and flight feathers and uppertail
    brown-black. It has a long grey bill, a red-brown iris and grey legs.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_104_1.png)


    Where to see: Occurs commonly in primary and secondary forest on Java and Sumatra,
    often in mixed flocks.'
  - '[PAGE 105]


    # White-bellied Woodpecker Dryocopus javensis 40–48cm


    A very conspicuous and striking appearance, being very large, with all-black plumage
    apart from a white belly. Males have a red crest and cheek patches. The long,
    pointed bill is black and the feet grey. Rather solitary usually makes its presence
    known by its loud ‘laughing’ and ‘barking’ calls, as well as its heavy hammering
    on dead branches. It often calls in flight with a raucous, echoing kiow, kiow,
    kiow.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_105_0.png)


    Where to see: Occurs throughout the region’s open lowland forests


    # Black-thigued Falconet Microhierax fringillarius 14–17cm


    Indonesian name: Alap-alap Capung


    This tiny falcon has black uppersparts but shows white spotting on the tail and
    secondaries. The crown is black, edged with a white patch above the bill and a
    white stripe behind the eye, and the sides of the face and ear-coverts are black.
    The chin and belly are rufous with white margins. The legs and cere are black
    and the iris brown. Females are a little larger than males, and juveniles have
    the white on the head tinged red.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_105_1.png)


    Where to see: Occurs throughout the region. It frequents edges of forests and
    mangroves, and open country and scrub, and occasionally is seen over rice fields.'
