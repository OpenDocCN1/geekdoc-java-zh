    ## 大鸻 Anarhynynchus leschenaultii 22–25cm


    这种棕、白、灰相色的鸻与其他涉水类在一起，特别是在泥滩和沙质河口海滩上较小的青青斑鸻。它最容易识别的特征是其较粗壮、微膨的喙，这与可能遇到的所有其他冬候鸻不同，后者具有胸带或颈环，且腿较短。只有早到的个体可能显示出繁殖羽毛的残迹，并带有栗色的胸带。


    观赏地点：作为冬季访客出现在巴厘岛和爪哇岛的泥滩和海滩上。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_49_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_49_1.png)


    ## 凤斑鸻 Anarhynynchus alexandrinus 15–18cm


    印尼语：Cerek Tilil


    在繁殖羽下，雄性眼睛下方有一条黑色横线，延伸至耳羽，并在栗色的头顶和颈部后有一个黑色尖端。下部、下巴、脸颊、额头、眼纹和颈环均为白色。胸部两侧有黑色区域，背部为沙褐色。喙和腿呈黑色。雌性和非繁殖季节的雄性外表更为平淡，雄性的黑色区域变为深褐色。


    观赏地点：遍布整个地区，主要出现在平坦的沿海海滩、湖泊和水道，极少出现在岩石岸边。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_50_0.png)


    ## 藏斑鸻 Anarhynynchus atriftrons 18–21cm


    印尼语：Cerek-pasir Tibet


    很容易与体型更大、腿腿的大鸻混淆，尤其是当单只看到时。它的头部更圆，喙更短且更细。成年鸟在栗色头冠下有完整的黑色面罩，白色喉部上方有一条宽的栗色胸带，延伸到侧腹。腿为灰色。非繁殖鸟的羽色暗得多，缺乏黑色和栗色斑纹。幼鸟也是如此。


    观赏地点：作为冬季访客出现在该地区平坦的沿海海滩和泥滩。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_50_1.png)


    ## 大斑翅嘴鹬 *Rostratula benghalensis* 23–28cm


    这种体型丰满的涉水鸟有一个略微下弯的脏黄色喙（雌性尖端为黑色），肩部到胸部有一条明显的窄白带。强烈的雄性二形性与常常相反。较大的雌性表现出更亮丽、更强烈的特征，具有更长的黑绿色翅膀和深栗色背部，包括头部下部、颈部和胸部。白色条纹从白色眼环向后延伸。腿为黄色。雄性颜色较暗，翅膀和背部有肉桂色条纹。


    **观赏地点：** 遍布整个地区的沿海、淡水沼泽和草地。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_51_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_51_1.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_51_2.png)


    ## 长尾���� Hydrophasius chirurgus 繁殖羽 40–58cm，其他为 30–31cm

    印尼语：Burung-sepatu Teratai


    繁殖期的成鸟有长黑尾巴和黑色下部，棕色的背部和肩羽与下方的白色翅斑形成对比。外飞羽为黑色。头部和颈部前为白色，由一条细黑线与黄色的颈后和后颈隔开。腿为浅灰色。非繁殖期，尾巴变短很多，背部变棕。下胸变为白色，但保留了颈下部的一些黑色羽毛。幼鸟羽色更暗，与非繁殖鸟相似，缺乏颈部的黄色，并有栗褐色的头冠。


    观赏地点：该地区湿地中一种相当罕见的迁徙鸟。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_52_0.png)


    ## 欧亚沙嘴鹬 Numenius phaeopus 40–46cm


    这是一种长腿涉水鸟，颈部长，喙相对较短且下弯，腿为灰色。它的羽毛布满密集的棕色斑点，肉桂色眉纹上方有一条明显的黑色顶纹和深色眼纹。飞行时，显示出白色的下部、尾部和下背部。通常很安静，受惊时时经常会发出颤鸣的叫声。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_53_0.png)


    观赏地点：该地区常见的访客。通常聚集在潮间泥滩和河口，偶尔与其他涉水鸟类群一起出现在沿海沼泽和粗糙的草地上。非繁殖季节的鸟类全年可见。


    ## 欧亚大嘴鹬 Numenius arquata 50–60cm


    印尼语：Gajahan Erasia


    这种大嘴鹬极具伪装性。羽色变化很大，但主要是浅灰褐色并带有深色条纹。它有白色腹部和尾部，腿为灰蓝色。长棕色下弯喙在雌性中最长。飞行时，大嘴鹬尾部有明显的白色楔形，翅膀下方为白色。它得名的鸣声是具有辨识度的“curloo”声，通常在飞行中发出。


    观赏地点：作为冬季访客出现在该地区的湿地、草地和海滩。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_53_1.png)


    ## 斑尾滨 Limosa lapponica 37–40cm


    该物种与类似的黑尾大嘴鹬（Limosa limosa）可能同时出现。它们是体型较大的长腿涉水鸟，喙直而长且微向上弯曲，背部为灰褐色；斑尾滨的斑点更密，有明显的条纹尾巴，在最白的胸部上有略偏灰的条纹。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_54_0.png)


    观赏地点：该地区不常见的冬季迁徙鸟，通常与其他涉水鸟类一起出现在潮间泥滩、河口、开阔的沙质海滩和盐沼中。在苏门答腊东岸可能更为常见。


    ## 褐岩��� Arenaria interpres 21–26cm


    印尼语：Trinil Pembalik-batu


    这种体型结实的小涉水鸟在北极繁殖。它有强壮的喙，外观斑驳，头部、颈部和胸部呈黑白相间。背部为栗色，带有肉桂色衬边。下部为白色，腿为红色。非繁殖季节在该地区的羽色会暗一些。


    观赏地点：在整个地区越冬，经常在沙质海滩和岩石海滩观察到它们通过翻动石块寻找猎物。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_54_1.png)


    ## 红眶��� Calidris canutus 23–25cm

    印尼语：Kedidi Merah


    在非繁殖羽下，它的背部为浅灰色，下部为白色，喙和脚为黑色。肩部的黑斑有助于将其与其他涉水鸟区分开来。飞行时显示黑色飞羽和明显的白色翼带。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_55_0.png)


    观赏地点：在整个地区越冬，定期出现在传统的沿海停留点，如沙质和泥泞的入海，在那里它们可以轻松找到小型软壳动物、甲壳类和其他海洋无生物。


    ## 红颈��� Calidris ruficollis 13–16cm

    印尼语：Kedidi Leher-merah


    这种小型涉水鸟的背部带有深浅不一的灰褐色，上翅看起来更灰。头冠、颈部和胸部为灰色并带有深色条纹，面部和下部完全全白。它有短黑喙和深色腿，有时带有橙色斑块。与小足���（Calidris
    minuta）相似，后者在该地区很少出现。


    观赏地点：该地区常见的迁徙鸟，通常在河口、海滩和沿海泥滩上成群结结，也出现在淡水池塘和水田里。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_55_1.png)


    ## 灰足��� Calidris alba 20cm


    在非繁殖羽下，它的背部为浅灰色，下部为白色，喙和脚为黑色。肩部的黑斑有助于将其与其他涉水鸟区分开来。飞行时显示黑色飞羽和明显的白色翼带。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_56_0.png)


    观赏地点：作为不常见的非繁殖季节迁徙鸟出现在整个地区，几乎完全出现在沙质海滩上，通常成小群跟随退潮的海浪觅食海洋无生物。


    ## 普通波泽��� Gallinago gallinago 25–27cm


    印尼语：Bercik Ekor-kipas


    很容易与针尾���（Gallinago stenura）和胜氏泽���（Gallinago megala）混淆，非常难区分。它有长长的、尖端黑色的肉桂色喙，下部为白色，侧腹和腹部有许多棕色斑点。背部为棕色，肉桂色的羽缘形成了从背部到尾部的条条纹。它有深棕色眼纹和宽大的肉桂色眉纹。喉部和颈部也是肉桂色。腿为黄色。飞行速度快且轨迹诡异，翅膀非常尖。


    观赏地点：偶尔出现在爪哇岛和巴厘岛的开放式淡水沼泽、河口、盐沼和水田。


