    ## Black-capped White-eye *Zosterops atricapilla* 9.5–10cm


    Indonesian name: Kacamata Topi-hitam


    The upperparts of this little white-eye are a solid olive-green becoming black
    on the forehead, lores and a circle around the eye. The white eye-ring is broken
    by a black spot at the front. The blackish-brown flight and tail feathers are
    also edged olive-green. On the rump, the olive-green becomes yellower, and, below,
    the bright yellow undertail-coverts extend to the lower breast in a stripe flanked
    by dark grey underparts. The throat and bib area are a lemon-green. The bill is
    fawn and black and legs grey.


    Where to see: Occurs in the lower montane forests of Sumatra.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_160_0.png)


    ## Lemon-bellied White-eye *Zosterops chloris* 11–12cm


    Indonesian name: Kacamata Laut


    This little white-eye has dullish green upperparts from the crown, over the back
    and wing-coverts to the yellow-green upper-coverts. The underparts are pale yellow,
    brighter on the throat and undertail-coverts. There is a small yellow loral patch
    with the black lores extending below the unbroken white eye-ring to the greenish
    ear-coverts. The tail and flight feathers are blackish, edged green. The bill
    is blackish above and grey below and legs are grey.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_160_1.png)


    Where to see: Occurs in extreme West Java and on Nusa Penida, in a variety of
    habitats, from forest to mangrove and even cultivation.


    ## Chestnut-capped Babbler *Timalia pileata* 15–17cm


    Distinguished by its masked appearance and long tail. Main body colour is warm
    olive-brown above and buffish-brown finely streaked black below. The head is more
    striking, with a bright chestnut crown underlined by a white forehead and supercilium.
    The chin, throat and neck are white, with the ear-covers whitewish, becoming pale
    grey towards the nape. The strong bill is black and iris and legs dark brown.


    Where to see: This babbler inhabits scrubby and swampy areas, usually in the company
    of other babblers and occurs from West Bali east to Bali.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_161_0.png)


    ## Pin-striped Tit Babbler *Mixornis gularis* 11–12cm


    Indonesian name: Ciung-air Melayu


    The upperparts of this small tit babbler are all chestnut-brown, including the
    tail. The underparts, in particular, the breast, are conspicuously finely streaked
    with black on a ground colour of yellowish-green, becoming whitish on the lower
    belly and vent. Javan birds are more greyish below. The sides of the head are
    grey, sometimes tinted, with a pale supercilium. The bill is brown and the legs
    are grey-blue.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_161_1.png)


    Where to see: A common bird in lowland Sumatra, gathering in small groups foraging
    in dense thickets and bushes, especially bamboo, and secondary growth in broadleaf
    forest.


    ## Golden Babbler *Cyanoderma chrysaeum* 10–12cm


    Golden Babbler has olive-green upperparts and a dull yellow, thinly streaked crown.
    The underparts are buff-yellow on the throat, becoming greyish on the flanks and
    on the vent. The tail and upperwing are grey tinted olive with flight feathers
    vaguely edged olive. Dark brown iris surrounded by dark grey-blue loral skin extending
    into a short black submoustachial stripe. The ear-coverts are yellow-grey, the
    bill is blackish above and black to pink below, and the legs are light brown.


    Where to see: Occurs in montane forests of Sumatra.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_162_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_162_1.png)


    ## Crescent-chested Babbler *Cyanoderma melanothorax* 13cm


    Upperparts are brown varying, across subspecies, from chestnut to dull olive-brown.
    Underparts are white to whitish-buff, becoming greyish or sandy-buff, on the belly,
    with a black crescent shape across the upper breast. Ear-covers are olive-grey
    to grey underlined by a black malar stripe. The supercilium is pale grey, the
    legs and bill brown.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_163_0.png)


    Where to see: Occurs in the forests of Java and Bali.


    ## Javan Scimitar Babbler *Pomerhinus montanus* 21cm


    Indonesian name: Cika-kopi Jawa


    This bird has a striking greyish-black head with a long white eyebrow and a longish,
    curved, buffish-yellow bill, at the base. The throat and breast are white, the
    back, flanks and vent chestnut-brown, the tail and wings dark brown. The feet
    are grey.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_163_1.png)


    Where to see: Occurs on Java and Bali. Frequently seen in pairs or small groups
    with laughingthrushes, foraging in ground litter and through low bushes and in
    the lower tree canopy of higher montane forests.


    ## Black Scimitar Babbler *Melanocichla lugubris* 25–27cm


    Indonesian name: Cica-kopi Hitam


    This all-black babbler has a substantial orange-red bill and a patch of bare blue
    skin behind the eye. Most of its plumage is dull black apart from shiny areas
    of the face, throat and crown, and bristly feathers of the lores and chin. The
    iris is dark brown (sometimes bluish) and the legs dark grey tinged brown. Juveniles
    are browner and duller.


    Where to see: Occurs in the lower mountain forests of Sumatra.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_164_0.png)


    ## White-bibbed Babbler *Stachyris thoracica* 18cm


    Indonesian name: Tepus Leher-putih


    Birds from West Java have all dark chestnut plumage, apart from the grey-black
    throat and face and a broad white breast-band. In West and East Java the crown
    to the nape is dark grey, with the white breast-band faintly edged blackish above
    and below. A small area of bluish bare skin surrounds a dark red iris; the bill
    is dark grey above, bluish below and legs are grey.


    Where to see: Occurs in montane forest on Java. Subspecies S. t. thoracica occurs
    in West Java and S. t. orientalis in West and East Java.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_164_1.png)


    ## Javan Black-capped Babbler *Pellorneum capistrat* 16–17cm


    Indonesian name: Pelanduk Topi-hitam


    This brown-coloured babbler has prominent head markings. The crown to the nape
    feathers are black, contrasting with a pale orange-brown supercilium, below is
    a blurred grey-brown eye-stripe. The throat is white. The upperparts, upperwing
    and tail are brown and underparts pale orange-chestnut. The legs are brown, the
    bill grey and iris brown.


    Where to see: Occurs in lowland forest on Java.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_165_0.png)


    ## Abbott’s Babbler *Malacoccincla abbotti* 15–17cm


    Indonesian name: Pelanduk Asia


    Like Horsfield’s Babbler, Abbott’s is small and brown and has a heavy bill. It
    is distinguished by being lighter and having a longer tail. The upperparts are
    brownish-olive, with a pale chestnut rump. The underparts are buffish-white on
    the throat, with a pale grey-green breast, buffish-brown belly and rufous undertail-coverts.
    The sides of the head are buffish-brown with a pale-grey supercilium.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_166_0.png)


    Where to see: Locally common in Sumatra’s lowland forests, with a few records
    for Java, but absent Bali. Usually found at forest edges and in scrub and thickets.


    ## Horsfield’s Babbler *Malacoccincla sepiaria* 15–16cm


    Indonesian name: Pelanduk semak


    This babbler has a dark grey-brown crown and warm russet-brown upperparts, becoming
    chestnut on the rump and tail. The flanks and vent are also chestnut, while the
    throat and belly are white and the breast grey. It has a heavy grey-and-black
    bill and red-brown iris. Separated from Abbott’s Babbler by its darker and greyer
    crown. This noisy little babbler has a monotonous and repetitive call, pee-o-oel
    pee-o-eet, given particularly at dawn and dusk.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_166_1.png)


    Where to see: This is a locally common resident throughout the region in dense
    undergrowth low thickets of hill and submontane forests. Subspecies M. s. sepiaria
    occurs on Java and Bali and M. s. barussana on Sumatra.

