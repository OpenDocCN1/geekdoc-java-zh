    grey.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_81_1.png)


    Where to see: Endemic to Java. Found only in primary forest and mountain wooded
    areas in West Java, and on the east coast at Meru Betiri National Park. A last
    stronghold is Gunung Halimun National Park.


    Kites, hawks and eagles'
  - '[PAGE 82]


    # Crested Serpent Eagle Spilornis cheela 50–70cm

    Indonesian name: Elang-ular Bido


    Dark-coloured, the upperparts being a greyish chocolate-brown and the underparts
    similar, with shoulders, belly and flanks spotted white. It has a raised patch
    of white-spotted feathers on the top and back of the head, giving the appearance
    of a crest. In flight, the broad white tail-band and the band of white on the
    underwing-coverts are significant. It has yellow feet and a greyish-brown bill.
    Often detected by its loud, shrill call, cwe-chee, cwe-chee, cwe-cheemee.


    Where to: Occurs throughout the region. Often seen over woodland and forests.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_82_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_82_1.png)'
  - '[PAGE 83]


    # Besra Tachysypiza virgata 25–35cm

    onesian name: Elang-alap Besra


    Males have uniform dark grey-brown upperparts with a dark greyish-brown head,
    and a white throat with a black mesial stripe. The breast and belly are rufous-grey,
    heavily streaked with black and white in the centre of the upper breast. The lower
    belly is barred white, leading into white undertail-coverts. The pale-tipped tail
    shows


    three wide black bars. Females are generally browner. Sumatran birds (A. v. vanbemmeli)
    are more rufous. The bill is black, the cere grey and the iris yellow to orange-red.


    Where to see: Occurs throughout the region but confined mainly to mountain and
    foothill woodland.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_83_0.png)'
  - '[PAGE 84]


    # Eastern Barn Owl Tyto javanica 33–50cm


    Indonesian name: Serak Jawa

    The Barn Owl is widespread throughout the world and familiar to many. It has an
    obvious heart-shaped white facial disc and underparts that vary from white to
    brown with darker speckling. The head and upperparts colour is also variable from
    light brown to grey. Recognised in flight by its generally pale colour, long wings,
    short, squarish tail and feet that do not extend beyond the tail.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_84_0.png)


    **Where to see:** Occurs throughout the region, albeit sparsely. It is nocturnal
    in Indonesia and absent from most of the mountainous or heavily forested areas.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_84_1.png)'
  - '[PAGE 85]


    # Oriental Bay Owl Phodius badius 23–29cm


    Indonesian name: Serak Bukit


    This small owl has rather blackish eyes set back in a deep fawn-coloured facial
    disc bordered by a thin dark brown line of feathers. The short, buff ear-tufts
    appear as an extension to the facial disc. The uppersparts are from chestnut to
    fawn with small buff spots and underparts buff-pink with small black spots. The
    short wings are barred black, the bill is buff and feet buff-brown. Females are
    a little larger and juveniles paler and duller.


    Where to see: Occurs on Sumatra and Java, mainly in lowland forests and sometimes
    approaching mangroves and cultivated areas.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_85_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_85_1.png)


    # Collared Scops Owl Otus lempiji 20–24cm


    Indonesian name: Celecuk Reban


    Identification is not easy, as the species occurs in several colour forms. It
    can be dull reddish-brown to grey-brown, with the uppersparts mottled and with
    buff and black; the underparts are paler and streaked black. It has a pale sandy-buff
    neck collar and longish buff-tufts. Bill and feet are pale yellow-pink. The regular
    soft whoop call of the male and the weeo and plop calls from the female are often
    heard alternately as a continuous duet.


    Where to see: Occurs throughout the region, almost everywhere below 1,500m. Often
    seen hunting for insects and small rodents from trees and prominent perches in
    built-up areas of towns.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_85_2.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_85_3.png)'
  - '[PAGE 86]


    # Buffy Fish Owl Ketupa ketupa 40–44cm

    Indonesian name: Beluk Ketupa


    This owl has an amusing appearance, with bright yellow eyes and its conspicuous
    horizontal ear-tufts. Its upperparts are brown, streaked black and buff, and the
    underparts are bright rufous-buff with narrow black streaks. It has whitish eyebrows,
    a grey bill and yellow feet.


    Where to see: A mainly nocturnal species occurring throughout the region and remaining
    hidden among trees during the day. At night, it ventures outside the forest into
    parks, rice fields and often alongside roads. Always close to water, on which
    it is dependent for its diet of frogs, fish and other aquatic life.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_86_0.png)'
  - '[PAGE 87]


    # Javan Owlet Glaucidium castanopterum 23–25cm


    Indonesian name: Beluk-watu Jawa


    This owlet has a warm brown face barred pale orange and white eyebrows with no
    apparent facial disc. The head and shoulders are brown subtly barred pale orange
    and uparts are warm chestnut. The wings and tail are barred yellow and brown,
    and the brown upper breast subtly barred orange-brown. The underparts, including
    breast, belly and flanks, are pale buff boldly streaked chestnut. The edges of
    the scapulars are white forming a line bordering the wing. The iris is yellow
    and the bill and feet are green-yellow.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_87_0.png)


    Where to see: Occurs in primary and secondary forests on Java and Bali.


    # Brown Boobook Ninox scututata 27–33cm


    Indonesian name: Pungguk Coklat


    Adults and immatures are very similar, having grey-brown heads and dark upperparts.
    The underparts are white, heavily marked with heartsaped brown spots, and the
    barred tail has a grey-brown subterminal and There is a white facial patch above
    the greenish-black bill, and the eyes are orange-yellow.


    Where to see: Occurs throughout the region, commonly in primary and secondary
    forest and often in pairs.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_87_1.png)'
  - '[PAGE 88]


    # Javan Trogon Apalharparctes reinwardtii 34cm

    Indonesian name: Luntur Jawa


    Similar to but larger than the Sumatran Trogon (Apalharparctes mackloti), this
    bird has blue-green, sometimes turquoise upperparts that extend from the nape
    to the rump; below, the tail is rich steel-blue. The wing-coverts are finely barred
    yellow and black, and the throat and belly are yellow separated


    by a broad, pale grey-green breast-band. The crown is bright green and a broad
    blue orbital ring surrounds a black iris. The bill is bright red and the feet
    orange.


    Where to see: Occurs mostly in the submontane forest of West Java.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_88_0.png)'
  - '[PAGE 89]


    # Orange-breasted Trogon Harpactes oreskios 25–27cm

    Indonesian name: Luntur Harimau


    This trogon has a striking orange breast, paling to yellow at the vent, but above
    the breast becomes dull olive-grey turning olive-yellow over the head. The dark
    eye has a blue orbital ring. The upperparts are reddish-brown becoming paler at
    the rump. the undertail feathers are white and black and the wing-coverts are
    black finely lined white. Sumatran males have a more yellow upper breast, yellow-grey
    in the female.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_89_0.png)


    Where to see: Occurs in lowland and subtontane forest of Java and Sumatra.


    # Great Hornbill Buceros bicornis 95–105cm

    Indonesian name: Rangkong Papan


    The enormous yellow bill and casque, black face, yellow-stained white neck and
    upper breast, and black subterminal bar on a white tail separate it from other
    hornbills of the region. The back, lower belly and wing-coverts are black, and
    a white wing-bar are often stained with yellow. They have prominent ''eyelashes’,
    similar to other hornbills. Males are larger than females and have a red iris
    and a black orbital ring of bare skin. The female’s iris is white and the bare
    skin is pinkish-red.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_89_1.png)


    Where to see: An uncommon species, confined to lowland and subtontane primary
    evergreen forests of Sumatra.'
- md: '

    ## Oriental Pied Hornbill *Anthracoceros albirostris* 55–60cm


    Recognised by its mainly black plumage with a white lower breast, belly and flanks,
    this species also has white patches behind the eye and at the base of the lower
    mandible. The huge horn-coloured bill is surmounted by a banana-shaped casque
    marked black at the front end. Females have more black on the bill. The tail shows
    variable amounts of black and white, particularly on the outer feathers. Normally
    found in small parties. Utters loud, raucous and cackling laughs and chicken-like
    cackling, puk-puk-puk-puk.


    **Where to see:** Occurs in clearances and edges of more remote lowland and secondary
    forest, down to the coast.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_90_0.png)


    ## Wreathed Hornbill *Rhyticeros undulatus* 75–85cm


    Indonesian name: Julang Emas


    Apart from the whitish, often dirty yellow, tail and the male''s chestnut-crowned,
    creamy head, the plumage is black. The male has a bare yellow gular pouch, of
    the black-headed female being blue. Like all hornbills, it relies on hollow trees
    when nesting, the male reducing the size of the entrance hole with mud while the
    female is incubating, and the female doing likewise after hatching until the young
    are ready to fledge.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_91_0.png)


    **Where to see:** Common in lowland and hill forests of Sumatra, it is confined
    to a few remaining undisturbed forests on Java and Bali.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_91_1.png)


    ## Blue-eared Kingfisher *Alcedo menint* 16–17cm


    This woodland counterpart of the Common Kingfisher is very similar in its behaviour,
    moving between waterside perches in rapid flight. Blue-eared has a more contrasting
    appearance, its uppers being a darker but shinier blue and its underparts a bright
    orange-red. The ear-coverts are blue, legs and the iris is dark brown. It dives
    into water to catch fish, which it kills by bashing it on the perch before swallowing
    it whole, head-first.


    **Where to see:** Occurs throughout the region, where it frequents forest rivers,
    streams, lakes and occasionally estuarine habitat.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_92_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_92_1.png)


    ## Common Kingfisher *Alcedo atthis* 16–17cm


    Indonesian name: Raja-udang Erasia


    This common kingfisher occurs all the way across Eurasia and to New Guinea. Upperparts
    are a shiny blue-green, with paler blue upper-coverts and a small patch in the
    centre of the back. The underparts and ear-covers are rufous. There is a white
    stripe on the side of the neck. Feet are red, the bill black, the iris dark brown.
    The Bali subspecies A. a. floresiana has darker blue upperparts and a few blue
    feathers in the rufous ear-coverts. In flight, it has a drawn-out, high-pitched
    call, tseep, tseep.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_93_0.png)


    **Where to see:** Occurs throughout the region, frequenting lowland open country
    with freshwater mangroves, rivers and lakes.


    ## Stork-billed kingfisher *Pelargopsis capensis* 35cm


    Indonesian name: Pekaka Emas


    The largest kingfisher in the region, with an enormous red bill. Easily identifiable.
    The back, wings and tail are blue-green and the underparts pinkish-orange. The
    head is brown, becoming paler around the neck. It has short red legs. It feeds
    on fish, crabs and amphibians.


    **Where to see:** Occurs throughout the region, inhabiting coastal mangroves and
    lowland rivers and marshland, as well as cultivated land and woodland adjacent
    to rivers. It is now an uncommon resident, possibly extinct on Bali.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_93_1.png)


    ## White-breasted Kingfisher *Halcyon smyrnnensis* 27–29cm


    Indonesian name: Cekak Belukar


    The white throat and ‘bib’ contrasting with the chocolate-brown head and underparts
    are distinguishing features of this large kingfisher. The underparts, tail and
    upper surfaces of the wings are iridescent mid-blue, and there is a patch of brown
    on the upperwing-coverts. A loud screaming call, ‘kee-kee-kee-kee’, announces
    the bird’s presence.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_94_0.png)


    **Where to see:** Occurs in Sumatra and West Java, by rivers and ponds in mainly
    lowland open areas and even along the coast.


    ## Javan Kingfisher *Halcyon cyanoventris* 27cm


    Indonesian name: Cekak Jawa


    This dark-looking kingfisher is dark brown on the head, with a lighter collar
    and upper breast. The belly and hind collar are purplish-blue, and the back and
    wing-coverts dark purple. Flight feathers and tail are bright blue. The white
    wing patches are particularly conspicuous in flight. Both bill and feet are red.
    It is not reliant on fishing for its food, having adapted well to a diet of insects
    and terrestrial prey.


    **Where to see:** Endemic to Java and Bali. Often seen on an isolated perch in
    open grassland, it remains near water where prey items are more abundant.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_94_1.png)


    ## Sacred Kingfisher *Todiramamphus sanctus* 22cm


    Indonesian name: Cekakak Australia


    The upperparts are green tinted grey, including the forehead, crown, mantle and
    back. The rump is turquoise and the tail blue-green, darker on the outer feathers.
    The throat, cheeks and collar are warm buff which passes a black mask reaching
    narrowly across the nape. There is a buff to orange loral spot. The flight feathers
    are black and upperwing-coverts. The breast is becoming pale chestnut on the undertail-coverts.
    The legs are black and bill blackish above and buff at the base.


    **Where to see:** A migrant frequenting the mangroves, small lakes and coastal
    regions of Java and Bali, occasionally to east Sumatra


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_95_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_95_1.png)


    ## Collared Kingfisher *Todiramphus chloris* 23–25cm


    Indonesian name: Cekak Sungai


    At first sight this species is bright blue and white, but at close range the blue
    of the crown, back, wings and tail has a brilliant green iridescence. It has a
    strikingly clean white collar and underparts. The lores are white, and a black
    stripe passes through the eye and around the back of the head. A very common kingfisher,
    as is evident from its continual calling throughout the day. Its harsh, noisy
    chue-chue-chue-chue-chue carries over long distances.


    **Where to see:** Occurs throughout the region. It prefers open country around
    the coast and wherever there is water in which to fish.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_96_0.png)


    ## Blue-tailed Bee-eater *Merops philippinus* 30cm


    Indonesian name: Kirik-kirik Laut


    The uppers of this colourful bee-eater are green from the crown to back leading
    to a beautiful pale-blue rump and tail. The underparts are blue-green from below
    the yellow chin to the blue undertail-coverts. It has a wide black eye-stripe
    outlined by a thin blue line above and below. The throat and cheeks are red tinged
    brown. The bill is black, the iris ruby-red and feet grey-brown.


    **Where to see:** Occurs throughout Sumatra and Java. More often found in open
    areas near water.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_96_1.png)


    ## Common Dollarbird *Eurystomus orientalis* 27–30cm


    Indonesian name: Tiong-lampu Biasa


    Overall, it appears dark bluish-brown with an upright stance, with a large head,
    solid orange-red bill and blue throat. In flight, two circular light-blue contrasting
    patches on the underwingcovers are evident, giving the bird its English name.
    Immatures are duller and lighter with blackish bills.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_97_0.png)


    **Where to see:** The only member of the roller family to be seen throughout the
    region. Widespread but not common; usually singly or in pairs. Hunts from exposed
    perches in open country by swooping on its insect prey.


    ## Coppersmith Barbet *Psilopogon haemacephal* 15–17cm


    Indonesian name: Takur Ungkut-ungkut


    A drawn-out, resonant tonk-tonk-tonk call, reminiscent of a vibrating hammer on
    metal, announces this bird’s presence. The back, wings and tail are green, with
    fawn underparts streaked black. Those found on Java and Bali have a red crown,
    chin, and cheek; those on Sumatra have the throat, cheek and eyebrow yellow. A
    thin black necklace separates the red and yellow neck markings. The legs are red.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_97_1.png)


    **Where to see:** Occurs throughout the region. Frequently found in trees in open
    country and dry deciduous forest. It also ventures into town gardens and parks.

