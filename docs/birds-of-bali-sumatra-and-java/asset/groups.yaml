    印尼语名称：Cucak Kutilang


    这种八留鸟头部有一个短的、几乎垂直的冠，位于其光泽的黑色头部，从下巴到眼睛下方一直延伸到后颈。耳羽呈白色，下部染灰色，上胸颜色较深，向黄色尾缘处逐渐变浅。上尾羽为白色，尾羽为黑色，末端带白色。后颈为灰灰色，在背部变深，向臀部变浅。边缘较浅的羽毛呈现出鳞片状。翅覆羽和二级羽相似。初级羽为棕色，边缘为灰色。腿和喙为黑色。


    **在哪里看到：** 常见于爪哇岛和巴厘岛的灌木丛、开阔栖息地，通常靠近人类居住区。


