    # Modest Flowerpecker Pachyglossa modesta 9–10cm


    Indonesian name: Cabai Gesit


    This flowerpecker is comparatively dull, appearing as a small, dingy, grey-brown
    bird that continuously twitches its tail from side to side, with an unusually
    thick bill for a flowerpecker. The upperparts are shaded olive-green and underparts
    are buff with indistinct brown streaks. A buff submoustachial malar stripe separates
    the light brown malar stripe from the pale brown ear-coverts. The brown tail and
    primaries are edged paler greenish-brown. The iris is bright red-brown, the legs
    brown and blue-grey. Sexes are similar, while juveniles are plainer and yellow
    below.


    Where to see: Occurs in woodlands the lowlands of Sumatra and Java.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_196_0.png)


    # Orange-bellied Flowerpecker Dicaeum trigonostigma 8–9cm


    Indonesian name: Cabai Bunga-api


    The orange belly, vent, rump and lower back, and the blue-grey head, wings and
    tail are diagnostic of the male. The female is pale olive-grey with a grey throat,
    becoming yellowish on the belly, the rump being dirty orange. The pointed and
    decurved bill is black and the legs grey. Juveniles look like dull females, lacking
    yellow or orange.


    Where to see: Occurs throughout the region''s lowlands, flitting among the forest
    canopy, garden trees and mangroves. It is very active, searching out small insects
    as well as small ripe fruits.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_196_1.png)


    # Javan Flowerpecker Dicaeum sanguinolentum 9–10cm


    Indonesian name: Cabai Gunung


    The male has a blood-red chest, becoming buff on the throat. The belly is pinky-buff
    down to the undertail-covers. A broad black stripe is superimposed down the centre
    of the breast to the belly. The upperparts to the top of the head are lustrous
    steel-blue. The bill and legs are black and iris is blue-brown. Females have a
    bright red rump on an otherwise olive-brown body, tinted orangey-buff on the underparts.
    Juveniles are similar to females but show more grey on the head and a yellow tinge
    to the underparts.


    Where to see: Occurs mainly in montane and hill forest of Java and Bali but is
    occasionally found in south Sumatra.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_197_0.png)


    # Scarlet-headed Flowerpecker Dicaeum trochileum 8–9cm


    Indonesian name: Cabai Jawa


    Adult males are scarlet-red from the head to the lower breast and along the back
    to the undertail-covers. The tail and upperwings are black, with a very pale grey
    belly becoming darker on the flanks and lower breast. The feet and bill are black
    and the iris brown. Females have light brown upperparts and a scarlet-red rump.
    The head and mantle often appear reddish-brown. The underparts are pale grey-white.
    Juveniles are light green-brown on the upperparts but show orange.


    Where to see: This is a coastal and lowland species, feeding on insects, nectar
    and fruit and occurring throughout the region.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_197_1.png)


    # Ruby-cheeked Sunbird Chalcoparia singalensis 10–11cm


    Indonesian name: Burung-madu Belukar


    Although this small sunbird is brightly coloured, when in the shade its iridescence
    is not often visible, and males even appear blackish. In bright light, however,
    the male’s iridescent dark green upperparts and crown are brilliant, and the ear-covers
    are a deep red. The throat is orange-brown, grading into a yellow belly. Females
    are duller, with olive-green upperparts and pale orange-and-yellow underparts.
    The straight bill and legs are black, the legs often with a greenish tinge.


    Where to see: This is a bird of forest edge and sparse woodland, often found in
    the company of other species. Occurs on Sumatra and Java.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_198_0.png)


    # Brown-throated Sunbird Anthrepes malacensis 12–13cm


    Indonesian name: Burung-madu Kelapa


    Identified by its bright colour and long, curved bill, this species usually hovers
    in front of flowers in search of nectar. The male has a yellow breast, belly and
    vent, and a brown throat often fringed with dark purple. The face and chin are
    olive and the upperparts are iridescent olive-green, blending into a dark bluish
    head with a green sheen. The female is olive-green above and yellowish below.
    Of the region’s 12 different sunbirds, only Brown-throated and Ornate occur on
    Bali.


    Where to see: Occurs throughout the region. Usually seen in open plantations,
    gardens, coastal scrub and mangroves.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_198_1.png)


    # Van Hasselt’s Sunbird Leptocoma brasiliana 9–10cm


    Indonesian name: Burung-madu Pengantin


    Males have primarily dark blackish upperparts, an iridescent emerald-green crown
    and nape and bluish-blue tail. The lower mantle, neck and sides to the face are
    solid black. Some green iridescence is present on the scapulars undertail-coverts.
    The throat and belly are maroon and dull purple. The female is dark olive above
    and paler olive below.


    Where to see: Occurs on Sumatra and Java, mainly in lowland forest, feeding on
    insects, nectar, fruit and seeds.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_199_0.png)


    # Copper-throated Sunbird Leptocoma calcostheta 12–13cm


    Indonesian name: Burung-madu Bakau


    Males are dark, even appearing blackish. Upperparts have green-purple iridescence
    and the breast has a coppery sheen. The lowerparts are yellow and the tail is
    black. The females are smaller, olive-green above and have light olive-buff underparts.


    Where to see: Occurs along the coastal lowlands of Java and Sumatra, mainly in
    scrub, mangroves and woodland.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_200_0.png)


    # Ornate Sunbird Cnopsis ornatus 10cm


    Indonesian name: Burung-madu Sriganti


    Quite small, with a long, curved bill and olive-green upperparts with darker wings
    and tail. The lowerparts are bright yellow. The males have a black throat and
    breast with purple iridescence. They are very active and often noisy birds, either
    flitting between flowers or hovering to extract nectar. Their nests are wonderfully
    woven structures of fine grasses and hair-like materials, suspended precariously
    from the end of a branch.


    Where to see: Occurs throughout the region.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_200_1.png)


    # Javan Sunbird Aethopyga mystacalis 9–12cm


    Indonesian name: Burung-madu Jawa


    The male is scarlet over the head, back and breast, with a black crown and purple
    iridescence. The wings are olive-grey with dark tail. The underparts are bright
    white merging into pale yellow on the vent. The rump is also yellow. The long
    tail is iridescent dark purple. The female has olive-green upperparts with pale
    yellowish breast and whitish belly. Juveniles are similar greyer.


    Where to see: Occurs in submontane forested regions of Java.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_201_0.png)


    # Crimson Sunbird Aethopyga siparaja 10–15cm


    Indonesian name: Burung-madu Sepah-raja


    The male has a blackish crown with an iridescent purple-green sheen. From the
    back of the head, over the mantle and to the upperwing-coverts, including the
    chin to mid-breast, the plumage is crimson. The lower breast to vent is blackish-purple.
    There is an iridescent purple-blue moustachial stripe. The rump is yellow and
    remaining upperparts dark brown to black. The smaller females are olive-green
    above and have light olive-buff underparts.


    Where to see: Occurs in more open forest and forest edges of south Sumatra and
    Java, occasionally close to human habitation.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_202_0.png)

