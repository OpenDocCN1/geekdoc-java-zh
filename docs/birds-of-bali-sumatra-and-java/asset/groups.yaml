    ## Asian Brown Flycatcher *Muscica dauurica* 12–14cm


    Indonesian name: Sikatan Bubik


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_182_0.png)


    This species of submontane forest and forest edges can frequently be found in
    plantations, open forest and even gardens. It hunts aerial insects from exposed
    perches, often shaking its tail on arrival back at the perch. It is greyish-brown
    above and whitish below, becoming grey-brown on the flanks and the sides of the
    breast, and has a pale eye-ring. The black bill has a yellow base to the lower
    mandible.


    **Where to see:** A winter migrant to the region from north-east Asia, but some
    may be resident in north Sumatra. Occurs in woodland, forest and scrubland, sometimes
    close to cultivation.


    ## White-rumped Shama *Copsychus malabaricus* 21–27cm


    Indonesian name: Kucica Hutan


    The male has a very long tail, about half its total length, with dull central
    feathers and white outers, which habitually flicks on landing. Its head, neck,
    back and wings are black with a blue sheen, its lower underparts are deep orange,
    and it has a conspicuous white patch on the rump. Another beautiful songster in
    decline, due to trapping for the pet trade.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_182_1.png)


    **Where to see:** Occurs on Sumatra and Java, spending a lot of time foraging
    on the ground in dense undergrowth. Common on Sumatra in denser forest, but far
    less so on Java.


    ## Oriental Magpie-robin *Copsychus saularis* 20cm


    Sumatran birds have black wings and central tail, belly and vent, and a broad
    white patch across the wing-coverts, whereas those from East Java and Bali are
    all black except for the white wing-covert patch. Females are much duller, with
    the black plumage replaced by grey. Juveniles have similar but mottled plumage.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_183_0.png)


    **Where to see:** Occurs throughout the region in lowland mangroves and forests
    to town gardens. Once trapping for the pet trade has caused a serious decline.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_183_1.png)


    ## Pale Blue Jungle-flycatcher *Cyornis unicolor* 16–18cm


    Indonesian name: Sikatan-rimba Biru-muda


    Males of this mid-sized, longish-tailed flycatcher are predominantly blue, whereas
    females are grey-brown. The male has black lores and a pale-blue forehead grading
    into a short supercilium. The throat is pale blue grading to grey on the belly
    and white on the lower belly and undertailcoverts. The female has grey-brown upperparts
    and buff underparts.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_184_0.png)


    **Where to see:** Occurs in the lower dense and moist primary forests of Sumatra
    and Java.


    ## Javan Jungle-flycatcher *Cyornis banyumas* 14–15cm


    Indonesian name: Sikatan-rimba Jawa


    Males have dark blue upperparts with iridescence on the forehead, eyebrow and
    shoulder. The chin, lores and a thin line around the eye are black, while the
    throat and breast are rufous-orange, grading into white on the lower belly and
    vent. The bill is black fading to dull purple at the base, the legs vary from
    dark brown to pale pink and the iris is dark brown. Females have brown upperparts
    with an off-white eye-ring, and underparts similar to the male’s but paler.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_184_1.png)


    **Where to see:** Occurs on Java, where it favours low undergrowth and bamboo
    thickets and the edges of glades in high montane forests.


    ## Mangrove Jungle-flycatcher *Cyornis rufigastra* 15cm


    Characteristic blue uppers and orange-red underparts. The bill is black and the
    legs blue-grey, although the female is paler and has a whitish chin and a white
    local patch. the many subspecies vary, typically in strength of colour of uppers
    and underparts. It is most likely to be confused with the Hill Blue Flycatcher
    (Cyornis banyumas), but that has a pale blue forehead and blackish chin.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_185_0.png)


    **Where to see:** Occurs in mangrove forest on Sumatra and West to Central Java,
    also in Baluran National Park in East Java and Bali Barat National Park in Bali.


    ## Sumatran Niltava *Niltava sumatrana* 15cm


    Indonesian name: Nilatava Sumatera


    The male''s dark blue underparts are iridescent on the forecrown, rump and upper
