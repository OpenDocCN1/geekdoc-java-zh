  - '[PAGE 49]


    # Greater Sand Plover Anarhynynchus leschenaultii 22–25cm


    This brown, white and grey plover joins other waders, especially the smaller Tibetan
    Plover on mudflats and sandy estuarine beaches. It is most easily separated by
    its more substantial, slightly bulbous bill and from all other wintering plovers
    likely to be encountered as they show a breast-band or a collar and have shorter
    legs. Only early arrivals may show remnants of the breeding plumage and have a
    russet breast bar.


    Where to see: Occurs on the mudflats and beaches of Bali and Java as a winter
    visitor.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_49_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_49_1.png)'
  - '[PAGE 50]


    # Kentish Plover Anarhynchus alexandrinus 15–18cm


    Indonesian name: Cerek Tilil


    In breeding plumage, males have a black line passing below the eye extending over
    the ear-coverts and a black peak to the rufous crown and nape. The underparts,
    chin, cheeks, forehead, eyestripe and collar are all white. There are black areas
    either side of the breast, and the upperparts are sandy-brown. The bill and legs
    appear black. Females and non-breeding males are more nondescript, with the male’s
    black areas becoming dark brown.


    Where to see: Occurs throughout the region, mainly on flat coastal beaches, lakes
    and waterways, and seldom on rocky shores.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_50_0.png)


    # Tibetan Plover Anarhynchus atriftrons 18–21cm


    Indonesian name: Cerek-pasir Tibet


    Easily confused with the larger, longer-legged Greater Sand Plover, especially
    when seen alone. It also has a more rounded head and shorter and thinner bill.
    Adults have a full black mask under a chestnut crown and a white throat above
    a broad rufous breast-band extending onto the flanks. The legs are grey. Non-breeding
    birds are much duller brown and lack the black and rufous markings. Juveniles
    are


    Where to see: Occurs as a winter visitor throughout the region''s flat coastal
    beaches and mudflats.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_50_1.png)'
  - '[PAGE 51]


    # # Greater Painted-snipe *Rostratula benghalensis* 23–28cm


    A plump wader with a slightly decurved dirty-yellow bill (black-tipped in the
    female) and prominent narrow white band from the shoulder to the breast. Strong
    sexual dimorphism is reversed from normal. Larger female shows brighter and stronger
    characteristics, with longer blackish-green wings and dark chestnut


    upperparts, including the lower head, neck and breast. A white streak extends
    backwards from a white eye-ring. Legs are yellow. The male is duller, showing
    buff streaks on the wings and back.


    **Where to see:** Occurs throughout the region on coastal and freshwater marshes
    and grasslands.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_51_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_51_1.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_51_2.png)'
  - '[PAGE 52]


    # Pheasant-tailed Jacana Hydrophasius chirurgus

    40–58cm in breeding plumage, otherwise 30–31cm

    Indonesian name: Burung-sepatu Teratai


    Breeding adults show a long, black tail and black underparts along with a brown
    back and scapular that contrast with the lower white wing patch. The outer primaries
    are black. The front of the head and neck are white, separated from the yellow
    nape and hindneck by a thin black line. The legs are pale grey. When not breeding
    the tail becomes much shorter and upperparts


    browner. The lower breast turns to white while retaining some of the blackish
    plumage at the lower neck. Immatures are more sombre-plumaged, similar to non-breeders,
    lacking the yellow on the neck and having a russet-brown crown.


    Where to see: A rather rare migrant of the region''s wetlands.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_52_0.png)'
  - '[PAGE 53]


    # Eurasian Whimrel Numenius phaeopus 40–46cm


    A large, long-legged wader with a long neck, comparatively short, decurved bill
    and grey legs. Its plumage is heavily mottled brown, with a prominent black crown-stripe
    above a buff eyebrow and dark eye-stripe. In flight, it shows a white under, rump
    and lower back. Normally quiet, it will often give a trilling call when alarmed.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_53_0.png)


    Where to see: A common visitor throughout the region. Usually congregates on tidal
    mudflats and estuaries with flocks of other waders


    occasionally on coastal marshes and rough grassland. Non-breeding birds are often
    present throughout the year.


    # Eurasian Curlew Numenius arquata 50–60cm


    Indonesian name: Gajahan Erasia


    This curlew is extremely well camouflaged. Plumage is variable but mainly light
    greyish-brown with dark streaking. It has a white belly and rump, and the legs
    are grey-blue. The long, brown, decurved bill is longest in the female. In flight
    curlews show a prominent white wedge shape on the rump and white below the wings.
    The call from which it gets its name is the recognisable curloo, often emitted
    in flight.


    Where to see: Occurs as a winter visitor to the region''s wetlands, grasslands
    and beaches.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_53_1.png)'
  - '[PAGE 54]


    # Bar-tailed Godwit Limosa lapponica 37–40cm


    Both this species and the similar Black-tailed Godwit (Limosa limosa) can be present
    at the same time. They


    are largish, long-legged waders with straight and long, upcurved bills and greyish-brown
    uppers; Bar-tailed is more heavily mottled and has an obvious barred tail and
    slightly greyier streaking on the whitest breast.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_54_0.png)


    Where to see: An uncommon winter migrant to the region, generally found with other
    waders on tidal mudflats, estuaries, open expanses of sandy beach and saltmarsh.
    Perhaps more common on the east coast of Sumatra.


    # Ruddy Turnstone Arenaria interpres 21–26cm


    Indonesian name: Trinil Pembalik-batu


    This thickset little wader breeds in the Arctic. It has a strong bill and a rather
    blotchy appearance, being mottled black and white on the head, neck and breast.
    Upperparts are chestnut with buff lining and black patches. The underparts are
    white and the legs red. When overwintering in the region the plumage becomes duller.


    Where to see: Overwinters throughout the region and is frequently observed on
    sandy and rocky beaches dislodging small rocks and stones to locate prey.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_54_1.png)'
  - '[PAGE 55]


    # Red Knot Calidris canutus 23–25cm

    Indonesian name: Kedidi Merah


    More likely to be seen in its winter plumage; light grey over with thick black
    legs and a short, tapered bill. Other distinguishing


    features are its typical hunched feeding posture and to some extent its comparatively
    short neck, small head and eyes.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_55_0.png)


    Where to see: Overwinters throughout the region, regularly occurring at traditional
    coastal stopover sites, such as sandy and muddy inlets and estuaries, where it
    can easily locate small molluscs, crustaceans and other marine invertebrates.


    # Red-necked Stint Calidris ruficollis 13–16cm

    Indonesian name: Kedidi Leher-merah


    This small wader has upperparts marked with dark and paler shades of grey-brown,
    with the upwings appearing greyer. The crown, neck and breast are grey with darker
    streaking and the face and underparts totally


    white. It has a short black bill and short, dark legs sometimes blotched orange
    and without webbing between the toes. Similar to the Little Stint (*Calidris minuta*),
    which occurs only infrequently in the region.


    Where to see: A common migrant occurring throughout the region, usually seen in
    large wader flocks on estuaries, beaches and coastal mudflats, and on freshwater
    inland pools and rice fields.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_55_1.png)'
  - '[PAGE 56]


    # Sanderling Calidris alba 20cm


    In non-breeding plumage, it has pale grey uppersparts and white underparts, with
    black bill and feet. A black shoulder


    patch helps to distinguish it from other waders. It shows black primaries and
    a prominent white wing-bar in flight.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_56_0.png)


    Where to see: Occurs throughout the region as an uncommon non-breeding migrant,
    found almost entirely on sandy beaches, usually in small groups following the
    retreating waves as they feed on marine invertebrates thrown up by the waves.


    # Common Snipe Gallinago gallinago 25–27cm


    Indonesian name: Bercik Ekor-kipas


    Easily confused with Pintail (Gallinago stenura) and Swinhoe''s Snipes (Gallinago
    megala), and very difficult to separate. It has a long, black-tipped, buff-coloured
    bill and white underparts heavily spotted brown on the flanks and belly. The uppers
    are brown with buff feather edges creating a striped pattern from the mantle to
    the rump. It has a dark brown eye-stripe and broad buff supercilium. Throat and
    neck are also buff. The legs are yellow. Fast, erratic flight with very pointed
    wings.


    Where to see: Occurs sporadically on Java and Bali in open freshwater marshland,
    estuaries, saltmarshes and rice fields.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_56_1.png)'
