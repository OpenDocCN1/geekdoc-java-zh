  - '[PAGE 149]


    # Pygmy Cupwing Pnoepyga pusilla 8–9cm


    This tiny, tail-less little babbler has for warm, olive-brown uppersparts marked
    only by the paler tips to the scapular and wing-coverts. The underparts are brown
    with strong buff-white scaling. The face and ear-coverts are warm grey-brown,
    darker and less rusty-coloured overall in Javan birds.


    The bill is grey-black, legs are light brown and iris is dark brown. Sexes are
    similar.


    Where to see: Found mainly on the ground of montane forests of Java and Sumatra.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_149_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_149_1.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_149_2.png)'
  - '[PAGE 150]


    # Barn Swallow Hirundo rustica 17–19cm

    Indonesian name: Layang-layang Asia


    The Barn Swallow is dark blue above, with a white breast and very long outer tail
    feathers. The forehead and throat are red, with a blue bar across the upper breast.
    Juveniles are duller and lack the tail-streamers.


    **Where to see:** Overwinter in the region. It is more likely to be seen wheeling
    and gliding high in the sky, hunting aerial insects but often skims the surface
    of lakes and streams. Sometimes gathers in huge flocks to roost in reedbeds, tall
    grasses and even on city buildings.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_150_0.png)


    # Ruby-throated Bulbul Pycnonotus dispar 17–20cm

    Indonesian name: Cucak Emas


    This large bulbul has olive-tinged yellow-green uparts and paler underparts. Distinguished
    by its black head with a superficial tufty crest, bright red throat and rounded
    tail with white-tipped outer feathers. Sexes are similar. Juveniles have a dark
    olive-brown nape. It has a black bill, blackish legs tinged pale pink and orange
    iris.


    **Where to see:** Occurs throughout the region in well-foliated tall trees in
    secondary forest and at forest edges.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_150_1.png)'
  - '[PAGE 151]


    # # Black-headed Bulbul Microtarsus melanocephalos 16–18cm


    Indonesian name: Cucak Kuricang


    Recognised mainly by its yellow-green body plumage and glossy head and throat.
    The upperparts are greenish-yellow tinged brown, and the underparts brighter.
    The wings are black and the tail yellow, with a broad black subterminal bar. The
    bill is black, legs brownish-black and iris very pale blue. Juveniles are duller.
    Rare colour forms exist in which the yellow areas are replaced by dull grey or
    greenish-olive, but they have a yellowish-white vent and undertail-covers, and
    with whitish tip to the tail.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_151_0.png)


    Where to see: Occurs throughout the region at forest edges, in riverine and coastal
    scrub and often along roadsides.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_151_1.png)'
  - '[PAGE 152]


    # Scalaly-breasted Bulbul Pycnonotus squamatus 14–16cm


    The upperparts, including the mantle to the rump, are olive-green, the wings being
    a little darker and the black tail tipped white. The underparts are black on the
    breast and flanks with the feathers edged white, producing a scaled appearance.
    The chin, neck and lower belly are white and undertail-coverts yellow. The head
    is


    black from the lores over the crown to the nape and the ear-coverts. The iris
    varies from red to yellow; the legs and thinnish bill are black. Sumatran birds
    have darker upperparts.


    Where to see: Most likely to be seen at forest edges, on Java and Sumatra.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_152_0.png)'
