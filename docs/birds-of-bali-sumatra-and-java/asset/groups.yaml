  mdcn: '


    ## 白侧腹太阳鸟 Aethopypga eximia 13cm


    印尼语名称：Burung-madu Gunung


    这种色彩斑艳的太阳鸟因其侧腹上簇集的白色羽毛而得名。除了暗淡的橄榄绿黑色翅膀、长蓝绿色尾巴和橄榄色下腹外，雄性具有亮黄色的臀部、红色喉部和上胸部，胸部有一条蓝绿色的项状条纹，冠部呈虹光紫色。除了白色侧腹外，尾巴较短的雌性呈橄榄绿色，喉部和泄殖孔颜色稍浅。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_203_0.png)


    观赏地点：爪哇答特有，分布于山地森林和高山灌木丛。特别喜欢花花树木。


    ## 小食蜜鸟 Arachnothera longiroirostra 13–16cm


    印尼语名称：Pijantung Kecil


    这是一种不起眼的橄黄色小鸟，喙部长而弯曲，上部为黑色，下为灰色。上部为暗橄榄绿色，下部为亮黄色。它可以通过白色的喉部和黑色的须纹与所有相似物种区分开来。


    观赏地点：在整个地区的低地和丘陵森林中常见，在某些地区也深入山区。它们栖息在花园、种植园和采伐后的森林中，可以看到它们在开阔区域快速移动以寻找花蜜，特别是香蕉和生姜的花蜜。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_203_1.png)


    ## 长喙食蜜鸟 Arachnothera robusta 21–22cm


    这种长喙且体型较大的食蜜鸟通常是独居的，甚至会驱赶所有侵入其领地的其他食蜜鸟。它有栖息在裸露树枝高处的习惯，并发出重复且乏味的“chew-lewt, chew-lewt”叫声。飞行时，它会发出简单的“chit-chit”声。其上部为暗橄榄绿色，下部为黄色，胸部和喉部有橄榄绿色条纹。由于缺乏黄色耳斑或眼环，可与眼镜食蜜鸟（Arachnothera
    flavigaster）和黄耳食蜜鸟（Arachnothera chrysogenys）区分来。


    **观赏地点：**出现在苏门答腊和爪哇的森林边缘。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_204_0.png)


    ## 树雀 Passer montanus 14–15cm


    印尼语名称：Burung-gereja Erasia


    这可能是整个地区最常见的留鸟物种。它有栗色冠部、白脸、黑耳斑、浅黄褐色喉部、脸颊和下部、棕色背部、翅膀有黑白斑点，以及两条浅色翼带。喙为蓝黑色，腿为棕色。雄雌外表相似，幼鸟颜色较浅。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_205_0.png)


    观赏地点：遍布整个地区，特别是在低地，已殖遍了从城市到森林空地的几乎所有区域。常见于地上觅食，并成群结袭种子类作物。


    ## 斑纹织鸟 Pleceus manyar 15cm


    印尼语名称：Manyar Jambul


    这种群居物种的繁殖期雄性具有黑色头部带有金黄色冠，深棕色的羽毛边缘形成条纹状，白色下腹在侧腹变为棕色，胸部有黑色条纹。它有黑喙和粉色腿。雌性和非繁殖期雄性具有黑色条纹的棕色头部以及浅褐色的族群和下巴。大型筑巢群建立在良好觅食区附近的孤立树上，多夫制的雄性会离开雌性让编织它们复杂的悬挂鸟巢。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_205_1.png)


    观赏地点：出现在巴厘岛和爪哇岛，更多以大群迁徙的形式出现，停留在结籽草地，通常在稻田和芦苇丛周围。


    ## 爪织鸟 Pleoceus philippinus 15cm


    繁殖期雄性具有亮黄色的冠部和颈部，以及黑褐色的脸颊和喉部，上部有深浅不一的红褐色条纹和斑点，下部为暖褐色。雌性冠部有棕色条纹和斑点，白色下巴，黄色眉，以及棕色脸颊和上胸。它有黑喙、棕色翅膀和尾巴，以及棕色虹膜。在雌性和非繁殖期雄性中，额头、冠部到后脑变为棕色，并带有深色条纹。幼鸟与雌性相似，但缺乏厚重的条纹或明显的浅色眉纹。


    观赏地点：遍布地区，通常在草地和植被茂密的区域内，且通常靠近人类居住区。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_206_0.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_206_1.png)


    ## 亚洲金织鸟 Pleoceus hypoxanthus 15cm


    印尼语名称：Manyar Emas


    繁殖羽色彩壮观的雄性具有黑色脸部和喉部，从头部到臀部全呈亮金黄色。覆翅羽和尾巴的羽毛为棕色，带有褐色和黄色边缘，背部有棕色条纹。它有粉色腿、黑喙和黑色虹膜。雌性和非繁殖期雄性相似，上部为深棕带褐色条纹，包括额头和冠部。翅膀和尾巴为深棕色。宽的眉纹和脸颊为橙褐色。下部为浅橙褐色，向尾下覆过渡为白色。它的喙和腿都是粉色的。


    观赏地点：出现在苏门答腊和西爪哇的低地，通常靠近水源和耕地，它们主要以种子为食。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_207_0.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_207_1.png)


    ## 红火雀 Amandava amandava 9.5–10cm


    印尼语名称：Pipit Benggala


    一年中大部分时间雄雌外表相似，但随着繁殖季节的临近，异性羽色变得非常明显。雌性上部为灰褐色，头部侧面较灰，下部为灰褐色，翅膀和尾巴为灰黑色。臀部和喙为亮红色。繁殖期雄性的背部和胸部变为深红色，胸部侧面、侧腹以及臀部有小白色斑点。脚为粉灰色。它们主要以草类种子为食，但也偶尔捕食昆虫。


    观赏地点：红腹亚种出现在爪哇岛和巴厘岛，栖息在草地和湿地地区，通常靠近耕地。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_208_0.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_208_1.png)


    ## 巽达腊斑纹雀 Taeniopygia guttata 10cm


    印尼语名称：Pipit Zebra


    雄性从头部顶部到白色臀部均为灰色，上部覆羽有黑色横纹。耳羽为橙色到深橙色，并有灰色眼环。从额部开始，一个带细黑边缘的白色水滴状区域从下巴下方到上胸的灰色区域脱而出。胸部有一条窄的黑色横带，下方下部变为奶油色。尾巴为黑色，虹膜为深橙色，喙为橙红色。腿为粉色。雌性的耳羽颜色浅得多。


    观赏地点：出现在整个小巽达群岛，从龙目岛开始开始。偶尔出现在巴厘岛较开阔的低地沿海地区。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_209_0.png)


    ## 棕胸壮尾雀 Erythrura hyperythra 10cm


    印尼语名称：Bondol-hijau Dada-merah


    该物种上部从头部顶部起为绿色，上部覆羽变为橙褐色。额头与头部顶部绿色交界处为黑色。下部和脸部为暖褐色，腿为粉红色，喙为黑色，虹膜为棕色。长长的尾巴、臀部和尾下覆羽为红色。雌性颜色暗淡，幼鸟额部无蓝色。


    观赏地点：出现在爪哇岛，偶尔出现在巴厘岛。主要在湿润的山地森林和竹林中可见，尽管它们也出现在开阔的草地和稻田。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_209_1.png)


    ## 长尾壮雀 Erythura prasina 12–15cm


    印尼语名称：Bondol-hijau Benglis


    这种物种上部为绿色，臀部和长尖尾为红色，下腹部和泄殖孔为棕褐色。雄性腹部中心有红斑，喉部、脸颊和额头为蓝色。喙基部变为灰色，腿为粉色，虹膜为深褐色，深灰色眼环。罕见的颜色变异是眼部羽毛变为黄色。雌性尾巴较短，下部为褐色，头部呈绿色，尾巴、臀部和尾下覆羽为暗红色。幼鸟看起来比雌性浅。


    观赏地点：出现在苏门答腊和爪哇。栖息于山地和低地湿森林，但在灌木丛、竹林和水田中，经常与大群的草雀混在一起。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_210_0.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_210_1.png)


