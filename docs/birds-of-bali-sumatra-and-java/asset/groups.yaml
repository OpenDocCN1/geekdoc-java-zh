    and the iris brown. Females have light brown upperparts and a scarlet-red rump.
    The head and mantle often appear reddish-brown. The underparts are pale grey-white.
    Juveniles are light green-brown on the upperparts but show orange


    Where to see: This is a coastal and lowland species, feeding on insects, nectar
