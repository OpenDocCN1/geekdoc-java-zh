    ![](img/ebd3744cf82a745248fa123f6c6b3e51_169_1.png)


    Where to see: Lives at the edges of broadleaved evergreen forest and lower montane
    forests on Sumatra, feeding on various insects, fruit, seeds and even flower buds.'
  - '[PAGE 170]


    # Silver-eared Mesia Leiothrix argentauris 15–17cm

    Indonesian name: Mesia Telinga-perak


    The male is distinctively marked, with bright silver ear-coverts that contrast
    with a black crown and face, and a small yellow-orange tuft of feathers at the
    base of the bright yellow bill. The chin, neck and fore-collar are dark orange
    blending into an olive mantle and paler orange breast. The tail is blackish fringed
    yellow, the legs and iris yellow. Females are less bright.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_170_0.png)


    Where to see: Occurs on Sumatra but is becoming rare in its preferred montane
    habitat because of trapping.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_170_1.png)'
  - '[PAGE 171]


    # Velvet-fronted Nuthatch *Sitta frontalis* 12–13cm


    Indonesian name: Munguk Bebledu


    Velvet-fronted Nuthatch has a red bill and reddish feet, dirty pinkish-white underparts
    and whitish throat. The uppersparts are mainly violet-blue, with black-edged feathers
    in the tail and primaries, and the forehead is velvety-black. A very active and
    attractive bird which, unlike other nuthches in the region, is well-adapted to
    creeping up and down tree trunks of insects and spiders.


    and Java. Usually seen in pairs but occasionally in small parties, moving erratically
    through the understorey.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_171_0.png)


    Where to see: Common in lowland and hill forests and plantations of Sumatra


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_171_1.png)'
  - '[PAGE 172]


    # # Blue Nuthatch Sitta azurea 13cm


    Indonesian name: Munguk Loreng


    In shady forest it appears to have black upperparts, but in fact its back, wings
    and tail are shiny dark blue. Only the crown, nape and sides of the face are black.
    The throat and breast are bluish-white. East Javan birds have a bluish-black lower
    belly and vent, but these are black on West Javan and Sumatran birds. It has a
    yellow-grey bill and grey feet. This nuthatch typically forages along branches
    and tree trunks, leveraging off fragments of bark to get grubs and insects.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_172_0.png)


    **Where to see:** Occurs in the Barisan Range of Sumatra and on Java, where it
    is common in lower montane forests.


    # # Asian Glossy Starling Aphonis panayensis 20cm


    Indonesian name: Perling Kumbang


    Adults are all black and can be separated from the Short-tailed Starling *(Aphonis
    minor)* by being larger and having a green iridescentcence. It has dark red eyes
    and black legs.


    On Bali they are smaller than the birds in Java and Sumatra. Juveniles have a
    yellowish iris, black-streaked whitish underparts, and upperparts streaked black
    and brown.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_172_1.png)


    **Where to see:** A common lowland bird occurring throughout the region''s open
    areas near forest and secondary vegetation and coastal scrub, also attracted to
    coconut plantations, cultivated areas and gardens, and frequently in towns and
    cities'
  - '[PAGE 173]


    # Grosbeak Myna Scissirostrum dubium 20cm


    Indonesian name: Jalak Tunggir-merah


    This small starling is easily recognised by its predominantly dark grey plumage,
    the solid ‘grosbeak-type’ orange-yellow bill and the bright red, elongated undertail-coverts,
    some with shiny tips. The legs are also orange-yellow and the iris is black-brown.


    Where to see: Occurs on Java. Prefers tree canopy of lowland forest edges, where
    it often congregates in large flocks, feeding on fruit, seeds and insects.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_173_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_173_1.png)'
  - '[PAGE 174]


    # Common Hill Myna Gracula religiosa 27–35cm


    Indonesian name: Tiong Emas


    Black overall with a purple sheen and orange wattles both behind and below the
    eye and has a white wing-bar. It has yellow feet and a stout orange bill. Another
    species under great pressure from habitat loss and trapping for the pet trade,
    this bird is particularly in demand for its ability to mimic other birds, as well
    as for its own enormous repertoire of whistles and calls.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_174_0.png)


    Where to see: Although it occasionally congregates in small flocks, it is more
    likely to be seen in pairs in tall trees. Once a common bird of lowland forest
    edge, it has become rare on Bali and Java but remains in reasonable numbers on
    Sumatra.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_174_1.png)'
