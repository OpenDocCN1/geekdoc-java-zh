  mdcn: "\n\n## 亚洲白犀 *Anthracoceros albirostris* 55–60cm\n\n这种物种以主要的黑色羽毛为主，胸部下部、腹部和侧部为白色，眼后和下喙基部也有白色斑块。巨大的角质色喙部上方覆盖着一个香蕉状的头盔，前端标有黑色。雌鸟喙上的黑色较多。尾巴显示出不同程度的黑色和白色，特别是在外尾羽上。通常成小群活动。发出响亮、刺耳且咯咯的笑声，以及类似鸡的咯咯声：puk-puk-puk-puk。\n\
    \n**观赏地点：**出现在偏远的低地和次生森林的空地和边缘，一直到海岸。\n\n![](img/ebd3744cf82a745248fa123f6c6b3e51_90_0.png)\n\
    \n## 皱纹犀 *Rhyticeros undulatus* 75–85cm\n\n印尼语名称：Julang Emas\n\n除了白色的（通常是脏黄色）的尾巴和雄性栗红冠、奶油色的头部外，羽毛均为黑色。雄性有裸露的黄色喉囊，而黑头雌性的喉是蓝色的。像所有犀鸟一样，它们筑巢时依靠空树，雄性在雌鸟孵卵时用泥缩小入口洞的大小，雌鸟在雏化后也这样做，直到幼鸟准备离巢。\n\
    \n![](img/ebd3744cf82a745248fa123f6c6b3e51_91_0.png)\n\n**观赏地点：** 在苏门答腊的低地和山地森林很常见，仅限于爪哇岛和巴厘岛少数剩余未受干扰的森林。\n\
    \n![](img/ebd3744cf82a745248fa123f6c6b3e51_91_1.png)\n\n## 蓝耳翠鸟 *Alcedo menint*\
    \ 16–17cm\n\n这种普通翠鸟的林地近缘种行为非常相似，在水边的栖息处间快速飞行移动。蓝耳翠鸟的外观对比更强烈，背部是更深但更亮的蓝色，腹部为明亮的橙红色。耳羽是蓝色的，腿和虹膜为深棕色。它潜入水中捕捉鱼类，在头朝下吞吞之前，通过在栖息处上拍打将其击死。\n\
    \n**观赏地点：** 遍布整个地区，出没于森林河流、溪流、湖泊，偶尔出现在河口栖地。\n\n![](img/ebd3744cf82a745248fa123f6c6b3e51_92_0.png)\n\
    \n![](img/ebd3744cf82a745248fa123f6c6b3e51_92_1.png)\n\n## 普通翠鸟 *Alcedo atthis*\
    \ 16–17cm\n\n印尼语名称：Raja-udang Erasia\n\n这种普通翠鸟遍布整个欧亚直到新几内亚。背部是闪亮的蓝绿色，上覆羽颜色较浅，背部中心有一个小斑块。腹部和耳羽为栗褐色。颈侧有一条白纹。脚为红色，喙为黑色，虹膜为深棕色。巴厘岛亚种\
    \ A. a. floresiana 有更蓝的背部，栗色耳羽中有几根蓝色羽毛。飞行时，它的叫声是长而高的：tseep, tseep。\n\n![](img/ebd3744cf82a745248fa123f6c6b3e51_93_0.png)\n\
    \n**观赏地点：** 遍布整个地区，常见于淡水红树林、河流和湖泊的低地开阔地区。\n\n## 犀翠鸟 *Pelargopsis capensis* 35cm\n\
    \n印尼语名称：Pekaka Emas\n\n该地区最大的翠鸟，拥有巨大的红喙。容易识别。背、翅膀和尾巴为蓝绿色，腹部为粉橙色。头部为褐色，颈部变浅。它有短红腿。以鱼、螃蟹和两栖动物为食。\n\
    \n**观赏地点：** 遍布整个地区，栖在海岸红树林、低地河流和沼泽地，以及河流附近的耕地和林地。它现在是不常见的留鸟，在巴厘岛可能已经灭绝。\n\n![](img/ebd3744cf82a745248fa123f6c6b3e51_93_1.png)\n\
    \n## 白胸翠鸟 *Halcyon smyrnnensis* 27–29cm\n\n印尼语名称：Cekak Belukar\n\n白色的喉部和“围兜”与巧克力褐色的头部和腹部形成，是这种大型翠鸟的特征。腹部、尾巴和翅膀上为虹光中蓝色，上翼羽处有一个棕色斑块。响亮的尖叫声“kee-kee-kee-kee”宣告了这种鸟的存在。\n\
    \n![](img/ebd3744cf82a745248fa123f6c6b3e51_94_0.png)\n\n**观赏地点：** 出现在苏门答腊和西爪哇，主要位于低地开阔地区的河流和池塘边，甚至沿海。\n\
    \n## 爪哇翠鸟 *Halcyon cyanoventris* 27cm\n\n印尼语名称：Cekak Jawa\n\n这种看起来深色的翠鸟头部为深褐色，有较浅的颈圈和上胸。腹部和后颈为紫蓝色，背部和覆羽为深紫色。飞羽和尾巴为亮蓝色。白色的翼斑在飞行时尤为显眼。喙和脚均为红色。它不依赖捕鱼为食，已很好地适应了昆虫和陆地猎物的饮食。\n\
    \n**观赏地点：** 爪哇岛和巴厘岛特有。经常出现在开阔草原的孤立栖息处，留在水边。\n\n![](img/ebd3744cf82a745248fa123f6c6b3e51_94_1)\n\
    \n 圣翠鸟 *Todiramphus sanctus* 22cm\n\n这种深色的翠鸟头部为深褐色，有浅色的颈圈和上胸。腹部和后颈为紫蓝色，背部和覆羽为深紫色。飞羽和尾巴为亮蓝色。白色的翼斑在飞行时尤为显眼。喙和脚均为红色。它不依赖捕鱼为食，已很好地适应了昆虫和陆地猎物的饮食。\n\
    \n**观赏地点：** 爪哇岛和巴厘岛特有。经常出现在开阔草原的孤立栖息处，留在水边。\n\n![](img/ebd3744cf82a745248fa123f6c6b3e51_94_1)\
    \ (注：此处原文内容重复，已按指令逻辑处理)\n\n## 蓝领翠鸟 *Todiramphus chloris* 23–25cm\n\n印尼语名称：Cekak\
    \ Sungai\n\n这种翠鸟第一眼看上去是蓝色的，额头、头顶和背部为绿色，尾部为亮蓝色，腹部为浅绿色。它有一条显目的白色颈圈，黑纹穿过眼睛并环绕。喉和脸颊为红色。喙为黑色。它整天发出刺耳、嘈杂的叫声。\n\
    \n**观赏地点：** 遍布整个地区，常见于沿海的开阔地，只要有水哪里就有。\n\n![](img/ebd3744cf82a745248fa123f6c6b3e51_95_0.png)\n\
    \n## 蓝尾蜂鸟 *Merops philippinus* 30cm\n\n印尼语名称：Kirik-kirik\n\n这种彩色蜂鸟的上体部为绿色，有着漂亮的浅蓝色尾椎和尾巴。腹部为蓝色。飞行时，下翼两处浅蓝色圆形斑块非常显眼，赋予了该鸟的英文名称。幼鸟色泽较暗，喙为黑色。虹膜为宝石红，脚为灰褐色。\n\
    \n**观赏地点：** 出现在苏门答腊和爪哇，常在水边。\n\n![](img/ebd3744cf82a745248fa123f6c6b3e51_96_0.png)\n\
    \n## 普通行行鸟 *Eurystomus orientalis* 27–30cm\n\n印尼语名称：Tiong-lampu Biasa\n\n整体上，它呈现蓝褐色，姿态直立，头部大，有橙红色喙和蓝色喉部。飞行时，下翼两处浅蓝色圆形斑块非常显眼，赋予了该鸟的英文名称。幼鸟色泽较暗较浅，喙为黑色。\n\
    \n![](img/ebd3744cf82a745248fa123f6c6b3e51_97_0.png)\n\n**观赏地点：** 该地区唯一的行鸟鸟类成员。分布广泛但不常见；通常单只或成对出现。在开阔地的裸露栖息处俯冲捕虫。\n\
    \n## 蜂嘴凤 *Psilopogon haemacephal* 15–17cm\n\n印尼语名称：Takur Ungkut-ungkut\n\n长而共鸣的\
    \ tonk-tonk-tonk 声，像锤子敲击金属的声音，宣告了这种鸟的存在。背、翅膀和尾巴为绿色，褐色腹部带有黑纹。爪哇和巴厘岛的个体具有红色头冠、下巴和脸颊；苏门答腊的喉、脸颊和眉纹为黄色。细黑颈圈将红色和黄色颈部标记分开。脚为红色。\n\
    \n![](img/ebd3744cf82a745248fa123f6c6b3e51_97_1.png)\n\n**观赏地点：** 遍布整个地区。常见于开阔地的树木和干旱落叶林。\n\
