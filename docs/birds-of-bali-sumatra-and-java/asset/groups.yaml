  mdcn: '

    # 风暴白鹳 Ciconia stormi 75–90cm

    印尼语名称：Bangau Storm


    一种非常稀见的鹳类，外观与白颈鹳相似。它的上部主要为黑色，胸部为黑色，颈部为白色且侧有黑色斑纹，头顶为黑色。尾部和腹部为白色。在繁殖季节，亮粉色的面部皮肤块和黄色眼环非常明显。略微上翘的喙呈红色，腿部呈粉色。


    **在哪里可见：** 仅发现于苏门答腊东部低地森林的淡水池中。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_64_0.png)


    # 小腹洲 Leptoptilos javanicus 120–130cm


    这种长相奇特的生物并不是美丽的鸟。它在光秃秃的头上长着巨大的角色的喙，头部、颈部和上胸部有橙色的皮肤块，看起来像畸形或生病了。背部、翅膀和尾部为深灰色，腹部和上背部为白色。喙和腿呈灰色。幼鸟上部为灰褐色，腹部为脏白色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_65_0.png)


    在哪里可见：遍布于该地区的沿海湿地、红树林、泛水草地和稻田。由于爪哇腊和巴厘的狩猎和栖息地流失而变得稀有。它在苏门答腊南部的低地地区仍然常见。


    # 白鹳 Mycteria cinerea 95–100cm

    印尼语名称：Bangau Bluwok


    这种大鹳通常以单种群出现，但与其他鹳和鹭类在一起。它主要是白色的，但有黑色的飞行飞羽和尾羽。它有一块明显的裸露脸部，颜色从粉色到红色不等，喙长而弯曲，呈橄榄黄色，腿部呈灰色。幼鸟为脏浅褐色，臀部为白色，飞行飞羽为黑色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_65_1.png)


    在哪里可见：一种遍布该地区的稀有物种。它出现在苏门答腊西部的红树林和泥滩，雅加达附近的爪哇岛西北岸，以及靠近泗水水的布兰塔斯三角洲。


    # 圣诞军鞱 Fregata andrewsi

    长度 90–100cm，翼展 210–230cm

    印尼语名称：Cikalang Christmas


    这种极临濒危的海鸟拥有非常深、棕色的羽毛，长长的翅膀和深深叉的尾巴。雄性在腹部和泄殖孔之间有一块白色斑块，而雌性的斑块更广，向前延伸覆盖整个腹部并延伸到翅下。雄性具有显著的亮红色充气喉囊，用于求偶，喙和腿为灰色。雌性体略大，腿、喙和喉囊呈粉色。未成年鸟的头部颜色多变，从脏黄色头部到白色不等。


    **在哪里可见：** 这种漂流鸟出现在该地区的沿岸，源自圣诞岛。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_66_0.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_66_1.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_66_2.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_66_3.png)


    # 东方蛇鹭 Anhinga melanogaster 87–95cm

    印尼语名称：Pecuk-ular Asia


    与鸬类非常相似，不同在于长长的蛇形颈子、小头部和黄褐色的匕首状喙。它主要是黑色的，翅膀和背部有白色条纹的羽毛。它在水面游得非常低，只露出头部和颈部，因此它经常被水浸透，起飞困难。它花大量时间独自在低矮、暴露的栖息地上，经常张开翅膀晾干，但会群聚栖息。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_67_0.png)


    在哪里可见：遍布该地区，偏好大型、清洁的淡水湖泊和缓慢的森林河流。


    # 小�� Microcarbo niger 51–56cm

    印尼语名称：Pecuk-padi Kecil


    该地区最小的鸬类。羽毛通常为绿黑色，颈部和头部有几根细小的白色羽毛。喙是黄褐色的，成年鸟喙端为黑色，基部附近呈紫色。繁殖后，羽毛颜色变深并失去白色斑点，除了下巴和喉部变为白色。未成年鸟全部呈暗褐色。


    在哪里可见：遍布该地区，出没于红树林、湖泊和河口，通常以小群结队在水面低处游泳并潜水捕鱼。曾是爪哇沿海、红树林和低地水道的常见居民，但正变得稀少。


    # 白足䷯ Microcarbo melanoleucos 58–65cm

    印尼语名称：Pecuk-padi Belang


    这种小鸬类有长尾巴和短粗喙。在该地区，它失去了黑白相间的繁殖羽毛，变为更多的黑褐色和白色。腹部、颈部、喉部和脸侧面均为白色，上部为黑褐色。腿为黑色，虹膜为深灰色，喙呈橙黄色并泛着绿色。


    在哪里可见：非繁殖期鸟出现在爪哇和巴厘，栖于淡水栖息地、河流、湖泊和沼泽。也出现在沿海河口和红树林。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_68_0.png)


    # 小黑䷯ Phalacirocorax sulcirostris 55–65cm

    印尼语名称：Pecuk-padi Hitam


    一种羽毛均匀黑色的鸟，带有紫绿色的虹光，仅在翅覆羽上有斑纹。在繁殖季节，它在蓝绿色眼睛后会获得一小块白色羽毛。它有一个小小的灰色喉囊，眼睛周围是裸皮。喙为蓝灰色，脚为黑色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_69_0.png)


    在哪里可见：作为留留鸟出现在爪哇和巴厘，并正沿着苏门答腊东岸扩散。主要是内陆湖泊、鱼塘和水库的鸟类，偶尔出现在沿海河口，在岩石和树上栖息。它并不常见，但在爪哇西北岸的兰布岛（Pulau
    Rambut）有一个群落。


    # 澳洲鹈 Pelecanospicillatus 152–185cm

    印尼语名称：Undan Kacamata


    体型与大鹈（Pelecanus onocotus）相似，通过黑色的尾巴和上翅覆羽、粉色的皮囊以及缺乏裸露面部皮肤来识别。初级和次级飞羽为黑色，腿和脚为蓝灰色。它以费力的扇翅飞行，并通过俯冲入水捕鱼。


    ![](img/ebd3744cf82a75248fa123f6c6b3e51_69_1.png)


    在哪里可见：在澳大利亚繁殖，向北和向西迁徙至巴厘和爪哇。有时单只出现，更多是小群出现在河口沙滩和泥滩。


    # 肉桂色苍鹭 Ixobruchus cinnamameus 40–41cm

    印尼语名称：Bambangan Merah


    雄性具有亮肉桂色的上部和橙褐色的腹部，腹部中心和侧腹有黑色条纹。长颈侧面有脏白色条纹。雌性和未成年鸟颜色较深，有黑冠，未成年鸟外观较斑驳。该地区较小且更胆小的苍鹭之一。受惊扰时，它会发出鸣叫从掩体中起，带着有力的扇翅飞走。


    在哪里可见：遍布该地区，生活在草地、淡水沼泽和稻田。常见。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_70_0.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_70_1.png)


    # 灰鹭 Ardea cinerea 85–100cm


    一种以灰色为主腹部较浅鸟，头部有一条明显的黑色条纹并延伸成小小的颈冠，飞行飞羽为黑色，白色颈部前方有一排黑色条纹。腿和喙呈黄色。它看起来比紫鹭小，且缺乏那种物种的红棕褐色。


    在哪里可见：主要位于该地区的低地，出没于稻田、湖泊、红树林和沼泽等湿地，捕食鱼、蛙和螃蟹。它是群居筑巢鸟，经常出现在红树林附近的高树上。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_71_0.png)

