    ## 印度尼西亚红隼 Falco moluccensis 26–32cm


    印尼语名称：Alap-lap Sapi


    雄性背部上为栗色，布有密集的深褐色斑点并延伸至翅膀。头部顶部、颈部和胸部的颜色更偏向黄栗色，斑点呈条纹状。黑色虹膜周围环绕着黄色眼圈和一圈裸露的黄色皮肤。蜡膜为黄色，喙为灰色，腿为黄色并长有黑色爪子。尾下羽为黄褐色，过渡到浅灰色尾巴，尾巴有一条宽的黑色亚端带，末端为白色。


    分布地区：出现在爪哇岛和巴厘岛的开阔栖息地，通常靠近人类居住区。


    ## 东方普通隼 Falco severus 27–30cm


    印尼语名称：Alap-lap Macan


    背部为黑黑色，下半部为栗色，胸部和腹部颜色较深，向泄殖处变浅并呈黄褐色。下巴和喉部为白色，但通常呈浅栗色。足部、蜡膜和眼眶为黄色。幼鸟也有背部颜色，但下半部为黄褐色并有密集的褐色条纹。不同地区存在颜色差异；巴厘岛的较深，苏门腊岛的较浅。


    分布地区：出现在巴厘岛、爪哇岛和苏门腊岛东部的开阔林地、草地，甚至稻田。


    ## 黄冠白鹦鹉 Cacatua sulphphaerea 33cm


    与双头白鹦鹉（Cacatua galerita）相似但体型更小。这种全白的鹦鹉有一冠由硬黄色羽毛组成的漂亮羽冠和黄色脸斑。它有黑喙和深灰色的足。它的飞行看起来比较费力，交替着滑翔和快速的扇动翅膀。通常成对生活，但经常成小群嘈闹的群体出现，发出尖叫、嘎嘎声和哨声，并在鸣叫时竖起羽冠。被宠物贸易大量利用。


    分布地区：出现在巴厘岛的努佩达岛的森林边缘。稀有。


    ## 红胸鹦鹦 Psittacula alexandri 33–37cm


    印尼语名称：Betet Biasa


    从颈部到臀部的背部上部（包括翅膀）为深绿色，中翅羽缘染有更亮的绿色。头部为蓝灰色，有一条黑线横跨额头到眼睛。另一条较宽的黑线横跨下巴和颈部，在脸颊下方变窄。下半部在领部下方呈蓝粉色，腹部变为粉色，然后是青绿色，尾下羽为绿色。背部最上层为亮蓝色。喙为鲜红色，末端为角黄色，足为浅灰色。


    分布地区：出现在爪哇岛和巴厘岛，它们偏好森林中的潮湿林地。


    ## 蓝臀鹦鹉 Psittinus cyanurus 18–20cm


    印尼语名称：Nuri Tanau


    这种小鹦鹉有蓝色的冠部和颈部，脸部两侧为蓝色，通常带有灰褐色。肩部和上背部为深紫色至黑色。下背部、臀部和尾覆盖为亮蓝色，尾巴外羽为绿黄色。翅膀肩部处带有红褐色，下半部为橄榄灰，侧腹和翅下羽变为红色。上背部为红色，下背部为深角色。腿为灰绿色，虹膜为白色。雌头部为棕色。


    分布地区：出现在苏门腊岛的低地森林。


    ## 落日琥嘴鹦 Trichoglossus forsteni 28–30cm


    印尼语名称：Perkiki Dada-merah


    这是一种色彩绚丽的多色鹦鹉，头部呈深紫色。除了浅绿色的领部外，背部均为深绿色。它有红色的下覆羽和肩下方的黄色斑块。胸部为红色，腹部为深蓝色，大腿显示交替的绿色和黄色窄条纹。足为灰色，喙为红色。


    分布地区：巴厘岛的居民，通常看到成小群嘈闹的觅食群体在山地森林的冠层上低空飞行。


    ## 蓝冠粉兜 Loriculus galgulus 12–13cm


    印尼语名称：Serindit Melayu


    这种小鹦鹉主要是亮绿色，翅膀颜色较深，下方较浅。颈部下方有一小块橙黄色区域，在亮色的臀部和尾背羽上方也有。冠顶有一小块深蓝色斑块，喉部和上胸部为亮红色。腿为橙色，喙为黑色。雌性缺少红色喉部。


    分布地区：出现在苏门腊岛和爪爪哇，它们偏好低地森林和种植园。


    ## 爪哇粉兜 Loriculus pusillus 12cm


    印尼语名称：Serindit Jawa


    这种非常小的、主要是叶绿色的鹦鹉具有良好的伪装色，下半部为较亮的黄绿色；这种颜色与叶片融合良好。雄性有大黄色喉部；雌性较小。最常在树冠上看到，倒挂着取食花朵和小果，发出尖锐的鸣叫声。


    分布地区：爪哇岛和巴厘岛特有。栖息于低地沼泽森林，特别是有松树的地区。常见。


    ## 绿大嘴鸟 Calyptomena viridis 14–17cm


    印尼语名称：Madi-hijau


    这种大嘴鸟全身呈绿色，除了雄性在耳罩下方的颊上有明显的黑斑以及翅膀上有厚重的斑纹外。它额头有一个奇特的羽簇，短黑喙，短尾巴和带有黑色飞羽的尖尖翅膀。奶油色的眼圈环绕着深棕色虹膜。腿为黄绿色。雌性和幼鸟颜色较浅且缺少厚斑纹。


    分布地区：出现在苏门腊岛。通常栖息于雨林，也出现在沼泽和河流栖息地。


    ## 长尾大嘴鸟 Psaris dalhousiae 23–26cm


    印尼语名称：Madi-Injap


    这种纤细的长尾大嘴鸟标记鲜明且色彩鲜艳，极具吸引力。它的背部为绿色，下半部为绿绿色，头部有一个黑色的头顶，带有蓝色的冠部，耳罩后方有亮黄色斑点。脸部和喉部为亮黄色，形成一个窄的、几乎完整的领圈。飞羽是黑色和蓝色的，长尾巴也是如此。虹膜为灰绿色，腿为黄绿色，喙为绿色。


    分布地区：出现在苏门腊岛的原始和次生常绿及阔叶林中。


    ## 银胸大嘴鸟 Seriophus lunatus 16–17cm


    印尼语名称：Madi-perak


    雄性有浅灰褐头部，带有浅灰色额头和宽的黑色眉纹。背部在领部处为灰色，过渡到臀部和尾下羽的栗色。胸部和腹部为白色。飞羽为亮蓝色和黑色，尾巴为黑色。深蓝绿色虹膜周围有一圈窄的眼圈。喙为浅蓝绿色，有时基部显示出橙色，足部为脏黄色。


    分布地区：稀疏分布于苏门腊岛的山下森林。


    ## 斑纹大嘴鸟 Trichopsis javanicus 21–23cm


    印尼语名称：Sempur-hujan Rimba


    这种色彩漂亮的大嘴鸟有黑色的肩部、背部和下半部，上面有粗糙的黄色斑纹。飞羽为黑褐色，尾巴和翅覆盖羽为黑色。下半部和头部为红褐色，腹部变浅。一条细的黑色横纹横跨上胸部。亮奶油色虹膜周围环绕着区域从眉纹到耳罩上方的黑色。喙为浅蓝绿色，足为灰粉。爪哇岛和苏门腊岛湿地附近的常绿和混合落叶林。


    ## 黑黄大嘴鸟 Megilopter ochromalus 13.5–15cm


    印尼语名称：Sempur-hujan Darat


    这种色彩鲜艳的大嘴鸟有黑色头部，覆盖了颈部、耳罩和喉部，下方是一个宽大的白色领圈。领圈下方是黑色胸带，雄性不间断，雌性在中间断开。下半部为粉色，向尾下羽变为黄色。尾巴为黑色，喙为亮蓝绿色且边缘为黑色，虹膜为黄白色，足为浅褐色至蓝色。它的肩部、背部和下半部覆盖羽有粗糙的黄色斑纹。


    分布地区：出现在苏门腊岛。偏好低地森林。


