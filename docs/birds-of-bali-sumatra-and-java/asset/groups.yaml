    ## Javan Munia *Lonchura leucogastro* 11cm


    Indonesian name: Bondol Jawa


    This munia has dark chestnut-brown uparts, crown, tail and vent; black chin, throat
    and sides of face down to the upper breast, and a white belly. It should not be
    confused with the White-bellied Munia (Lonchura leucogastra), which has fine pale
    grey streaking on the uparts, brown flanks and a yellowish-brown tail. The bill
    is pale greyish to blue. The legs are grey and the iris dark brown. Females are
    similar, and the juvenile is buff-brown with whitish underparts, spotted brown
    on the flanks and lower breast.


    Where to see: Occurs in south Sumatra, Java and Bali. Normally a grassland bird,
    it is attracted with munias to the easy pickings of cultivated land and especially
    rice fields at harvest time.


    ## Black-faced Munia *Lonchura molucca* 10–11cm


    Indonesian name: Bondol Taruk


    This munia has a black crown and covers and chin to the upper breast. The nape
    to the blackish upperwing-coverts is brown. The tail and uppertail-coverts are
    black. The lower breast and below, to the undertail-coverts, are white lined with
    narrow blackish barring. The bill is grey-blue and legs are grey. A grey eye-ring
    surrounds a black iris.


    Where to see: Occurs sporadically on Java and Bali. A typical munia that feeds
    on seeding grasses, often in rice fields.


    ## Scaly-breasted Munia *Lonchura puncticulata* 10–12cm


    Indonesian name: Bondol Peking


    This species is easily identified by the scaley appearance of its breast and flanks
    (that show as double scales in this subspecies). White feathers edged with brown.
    The upperparts and throat are brown without stre own. It has a red-brown face
    and throat. Bill is dark grey above, paler below, legs are grey and the iris is
    dark reddish-brown. Juveniles are paler and have a black bill.


    Where to see: Occurs throughout the region. It inhabits scrub, gardens and open
    grassland but is considered a pest to the farmer for raiding rice fields and crops.


    ## Black-headed Munia *Lonchura atricapilla* 11–12cm


    Indonesian name: Bondol Rawa


    Apart from its black head, neck and chin to upper belly, plumage is dark chestnut
    with a black-brown patch on the centre of the lower belly in the north Sumatra
    subspecies (illustrated). The bill is pale blue-grey and legs dark grey. A dark
    grey eye-ring surrounds a brown iris.


    Where to see: Occurs on Sumatra, often in large flocks feeding from seeding grasses,
    but also in rice fields.


    ## White-capped Munia *Lonchura ferruginosa* 11–12cm


    Indonesian name: Bondol Oto-hitam


    This munia has a whitish head inclusive of the nape and ear-covers and the chin
    to upper belly are black. The remaining plumage is dark chestnut with a black-brown
    patch on the centre of the lower belly reaching the undertail-covers. The bill
    is pale grey and legs medium grey. A dark grey eye-ring surrounds a brown iris.


    Where to see: Occurs on Java and Bali and very occasionally in south Sumatra.
    Often seen in large flocks feeding on seeding grass heads. Also in rice fields.


    ## White-headed Munia *Lonchura maja* 11cm


    Indonesian name: Bondol Haji


    Quite small, with the head and throat completely white and a greyish nape. The
    remainder of the plumage is chestnut-brown, apart from a small area of black on
    the belly. The bill and feet are pale bluish-grey and the iris is dark brown.
    Males and females are similar, the females often showing a darker crown and nape
    and paler underparts. Juveniles are brownish above and buff below with a creamy-white
    chin and throat.


    Where to see: A widespread lowland bird occurring throughout the region. Common
    on Java and Bali, where it prefers open grassland, as well as swamps, reedbeds
    and rice fields.


    ## Pale-headed Munia *Lonchura pallida* 11cm


    Indonesian name: Bondol Kepala-pucat


    A small munia with a whitish-fawn head, pale grey nape and pale brown upperparts.
    The upper belly is pale grey-fawn and lower belly and flanks pale. The tail is
    chestnut, the bill pale blue-grey. Legs are grey and the brown iris is surrounded
    by a grey-ring.


    Where to see: Occurs on Bali and usually found in lowland grassy scrub and rice
    fields, and often in the centre of towns.


    ## Java Sparrow *Padda oryzora* 16cm


    Adults are largely grey, with a black head and throat, large white cheek patches,
    a black tail, white undertail-coverts, and a heavy red bill. Juveniles are brownish-grey
    with a buff breast. This once common bird has declined alarmingly in recent years.
    Occasionally it forms large flocks feeding on grain and rice. Sometimes seen close
    to human habitation, in cities and villages.


    Where to see: Endemic to Java. It is usually sedentary, found in small groups
    feeding on seeding grasses and in other vegetation.


    ## Grey Wagtail *Motacilla cinerea* 17–20cm


    A typical wagtail in shape and behaviour, running and skipping among the rocks
    and running water. Its flight is markedly undulating. It has a grey crown and
    mantle, with bright yellow underparts. The chin and eye-stripe are whitish and
    the ear-coverts greyish. The underparts of juveniles are much paler. The very
    long tail is edged white. The bill is dark brown and the feet are pinkish.


    Where to see: Overwinters throughout the region. Prefers stony river beds, streams
    and damp meadows, from the coast to tops of mountains.


    ## Eastern Wagtail *Motacilla tschudhensis* 17–18cm


    Many variations in plumage occur amongst the subspecies, especially in winter
    plumage, making identification difficult. Of typical wagtail shape and behaviour,
    the species is olive-brown or olive-green on the back, with yellow underparts.
    The commonly occurring M. t. simillima has a grey crown, yellow throat and white
    supercilium. Immatures have browner upperparts and whiter underparts.


    Where to see: Occurs as a winter visitor throughout the region. Commonly found
    in coastal lowlands, particularly pastures, rice fields and dried-up marshland.


    ## Paddyfield Pipit *Anthus rufulus* 15–16cm


    Indonesian name: Apung Sawah


    Very similar in appearance to Richard’s Pipit (A. richardii) but is generally
    paler and has shorter legs. This very ordinary looking pipit has upperparts streaked
    grey-brown with lightly streaked underparts becoming white on the belly. It has
    a dark brown malar and submoustachial stripes and a long and broad buff supercilium
    that tapers off the back of the head. The tail is dark brown, as is the iris.
    The legs are flesh-coloured with a very long hind claw.


    Where to see: Occurs throughout the region in open short grassland, rice fields
    and frequently by the roadside and close to cultivated land.


    ## GLOSSARY OF TERMS


    - Canopy: Unbroken layer of branches and foliage at tops of trees in forest

    - Mandible: Upper or lower half of bill

    - Cere: Bare fleshy or waxy protuberance at base of upper mandible, including
    nostrils

    - Malar: The area between base of bill and side of throat

    - Coverts: Small feathers at base of quill feathers forming main flight surfaces
    of wing and tail

    - Mesial: Dividing down the middle

    - Migrant: Non-resident traveller

    - Montane: Relating to mountain habitats, usually above 900m

    - Dimorphic: Occurring in two genetically determined plumage forms

    - Narial feathers: Small, bristly feathers projecting forward over the nostril,
    collectively called narial

    - Echolocation: Navigation by ultrasound

    - Necklace: A line of markings around front of neck

    - Endemic: Indigenous species restricted to a particular area

    - Orbital ring: Unfeathered bare around eye

    - Eyebrow: Contrasting line above eye (supercilium)

    - Primaries: The main outer flight feathers (longest of folded wing)

    - Eye-stripe: Contrasting line through eye

    - Primary forest: Original natural forest

    - Flank: Side of the body

    - Race: Another name for subspecies

    - Frontal shield: Skin or unfeathered area on forehead which extends to bill

    - Rackets: Peddle-shaped ends to tail feathers

    - Frugivorous: Subsisting on a diet of mainly fruit and berries

    - Resident: Remaining in a local area throughout year

    - Greater Sundas: Borneo, Sumatra, Java and Bali, including offshore islands

    - Roost: Resting or sleeping place

    - Gregarious: Frequently occurring in groups

    - Secondaries: The inner flight feathers on rear half of wing

    - Gular pooch: Bare fleshy patch of skin around neck of cormorants

    - Secondary forest: New-growth forest replacing primary forest

    - Gunung: Indonesian name for mountain

    - Spatulate: Having thickened, rounded ends

    - Hackles: Long narrow and often pendulous feathers around neck

    - Speculum: Contrasting iridescent patch on a duck''s wing

    - Lores: Area of feathers between bill and eye

    - Sub-montane: Relating to mountain habitats, usually below 900m

