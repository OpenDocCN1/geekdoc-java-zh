  - '[PAGE 90]


    # Oriental Pied Hornbill *Anthracoceros albirostris* 55–60cm


    Recognised by its mainly black plumage with a white lower breast, belly and flanks,
    this species also has white patches behind the eye and at the base of the lower
    mandible. The huge horn-coloured bill is surmounted by a banana-shaped casque
    marked black at the front end. Females have more black on the bill. The tail shows
    variable


    amounts of black and white, particularly on the outer feathers. Normally found
    in small parties. Utters loud, raucous and cackling laughs and chicken-like cackling,
    puk-puk-puk-puk.


    **Where to see:** Occurs in clearances and edges of more remote lowland and secondary
    forest, down to the coast.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_90_0.png)'
  - '[PAGE 91]


    # Wreathed Hornbill Rhyticeros undulatus 75–85cm


    Indonesian name: Julang Emas


    Apart from the whitish, often dirty yellow, tail and the male''s chestnut-crowned,
    creamy head, the plumage is black. The male has a bare yellow gular pouch, of
    the black-headed female being blue. Like all hornbills, it relies on hollow trees
    when nesting, the male reducing the size of the entrance hole with mud while the
    female is incubating, and the female doing likewise after hatching until the young
    are ready to fledge.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_91_0.png)


    Where to see: Common in lowland and hill forests of Sumatra, it is confined to
    a few remaining undisturbed forests on Java and Bali.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_91_1.png)'
  - '[PAGE 92]


    # Blue-eared Kingfisher Alcedo meninent 16–17cm


    This woodland counterpart of the Common Kingfisher is very similar in its behaviour,
    moving between waterside perches in rapid flight. Blue-eared has a more contrasting
    appearance, its uppers being a darker but shinier blue and its underparts a bright
    orange-red. The ear-coverts are blue, legs and the iris is dark brown. It dives
    into water to catch fish, which it kills by bashing it on the perch before swallowing
    it whole, head-first.


    Where to see: Occurs throughout the region, where it frequents forest rivers,
    streams, lakes and occasionally estuarine habitat.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_92_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_92_1.png)'
  - '[PAGE 93]


    # Common Kingfisher Alcedo athis 16–17


    Indonesian name: Raja-udang Erasia


    This common kingfisher occurs all the way across Eurasia and to New Guinea. Upperparts
    are a shiny blue-green, with paler blue upper-coverts and a small patch in the
    centre of the back. The underparts and ear-covers are rufous. There is a white
    stripe on the side of the neck. Feet are red, the bill black, the iris dark brown.
    The Bali subspecies A. a. floresiana has darker blue upperparts and a few blue
    feathers in the rufous ear-coverts. In flight, it has a drawn-out, high-pitched
    call, tseep, tseep.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_93_0.png)


    Where to see: Occurs throughout the region, frequenting lowland open country with
    freshwater mangroves, rivers and lakes.


    # Stork-billed kingfisher Pelargopsis capensis 35cm


    Indonesian name: Pekaka Emas


    The largest kingfisher in the region, with an enormous red bill. Easily identifiable.
    The back, wings and tail are blue-green and the underparts pinkish-orange. The
    head is brown, becoming paler around the neck. It has short red legs. It feeds
    on fish, crabs and amphibians.


    Where to see: Occurs throughout the region, inhabiting coastal mangroves and lowland
    rivers and marshland, as well as cultivated land and woodland adjacent to rivers.
    It is now an uncommon resident, possibly extinct on Bali.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_93_1.png)'
  - '[PAGE 94]


    # White-breasted Kingfisher Halcyon smyrnsensis 27–29cm


    Indonesian name: Cekak Belukar


    The white throat and ‘bib’ contrasting with the chocolate-brown head and underparts
    are distinguishing features of this large kingfisher. The underparts, tail and
    upper surfaces of the wings are iridescent mid-blue, and there is a patch of brown
    on the upperwing-coverts. A loud screaming call, ‘kee-kee-kee-kee’, announces
    the bird’s presence.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_94_0.png)


    Where to see: Occurs in Sumatra and West Java, by rivers and ponds in mainly lowland
    open areas and even along the coast.


    # Javan Kingfisher Halcyon cyanoventris 27cm


    Indonesian name: Cekak Jawa


    This dark-looking kingfisher is dark brown on the head, with a lighter collar
    and upper breast. The belly and hind collar are purplish-blue, and the back and
    wing-coverts dark purple. Flight feathers and tail are bright blue. The white
    wing patches are particularly conspicuous in flight. Both bill and feet are red.
    It is not reliant on fishing for its food, having adapted well to a diet of insects
    and terrestrial prey.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_94_1.png)


    Where to see: Endemic to Java and Bali. Often seen on an isolated perch in open
    grassland, it remains near water where prey items are more abundant.'
  - '[PAGE 95]


    # Sacred Kingfisher *Todiramamphus sanctus* 22cm


    Indonesian name: Cekakak Australia


    The upperparts are green tinted grey, including the forehead, crown, mantle and
    back. The rump is turquoise and the tail blue-green, darker on the outer feathers.
    The throat, cheeks and collar are warm buff which passes a black mask reaching
    narrowly across the nape. There is a buff to orange loral spot. The flight feathers
    are black and upperwing-coverts. The breast is becoming pale chestnut on the undertail-coverts.
    The legs are black and bill blackish above and buff at the base.


    Where to see: A migrant frequenting the mangroves, small lakes and coastal regions
    of Java and Bali, occasionally to east Sumatra


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_95_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_95_1.png)'
  - '[PAGE 96]


    # Collared Kingfisher Todiramphus chloris 23–25cm

    Indonesian name: Cekak Sungai


    At first sight this species is bright blue and white, but at close range the blue
    of the crown, back, wings and tail has a brilliant green iridescence. It has a
    strikingly clean white collar and underparts. The lores are white, and a black
    stripe passes through the eye and around the back of the head. A very common kingfisher,
    as is evident from its continual calling throughout the day. Its harsh, noisy
    chue-chue-chue-chue-chue carries over long distances.


    Where to see: Occurs throughout the region. It prefers open country around the
    coast and wherever there is water in which to fish.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_96_0.png)


    # Blue-tailed Bee-eater Merops philippinus 30cm

    Indonesian name: Kirik-kirik Laut


    The uppers of this colourful bee-eater are green from the crown to back leading
    to a beautiful pale-blue rump and tail. The underparts are blue-green from below
    the yellow chin to the blue undertail-coverts. It has a wide black eye-stripe
    outlined by a thin blue line above and below. The throat and cheeks are red tinged
    brown. The bill is black, the iris ruby-red and feet grey-brown.


    Where to see: Occurs throughout Sumatra and Java. More often found in open areas
    near water.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_96_1.png)'
  - '[PAGE 97]


    # Common Dollarbird Eurystomus orientalis 27–30cm


    Indonesian name: Tiong-lampu Biasa


    Overall, it appears dark bluish-brown with an upright stance, with a large head,
    solid orange-red bill and blue throat. In flight, two circular light-blue contrasting
    patches on the underwingcovers are evident, giving the bird its English name.
    Immatures are duller and lighter with blackish bills.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_97_0.png)


    Where to see: The only member of the roller family to be seen throughout the region.
    Widespread but not common; usually singly or in pairs. Hunts from exposed perches
    in open country by swooping on its insect prey.


    # Coppersmith Barbet Psilopogon haemacephal 15–17cm


    Indonesian name: Takur Ungkut-ungkut


    A drawn-out, resonant tonk-tonk-tonk call, reminiscent of a vibrating hammer on
    metal, announces this bird’s presence. The back, wings and tail are green, with
    fawn underparts streaked black. Those found on Java and Bali have a red crown,
    chin, and cheek; those on Sumatra have the throat, cheek and eyebrow yellow. A
    thin black necklace separates the red and yellow neck markings. The legs are red.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_97_1.png)


    Where to see: Occurs throughout the region. Frequently found in trees in open
    country and dry deciduous forest. It also ventures into town gardens and parks.'
