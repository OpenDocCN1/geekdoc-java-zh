    ## Deignan’s Prinia *Prinia polychroa* 15–16cm


    This large, dull-coloured prinia has a substantial long brown tail. In breeding
    plumage it is duller still, with well-abraded plumage. At other times it becomes
    less dull with a whitish neck and supercilium in front of the eye, pale buff underparts
    and brown upperparts with dark streaking. The bill is black when breeding, otherwise
    brown to yellow-brown. Legs are pink-brown.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_145_0.png)


    **Where to see:** Occurs on Java, preferring dry lowland scrub.


    ## Bar-winged Prinia *Prinia familiaris* 13cm


    A noisy, versatile and gregarious little bird, often uttering its loud, high-pitched
    tweeting call as it searches for insects from ground to treetops. It is recognised
    by its long tail of black and white-tipped feathers, drab, olive-brown upperparts,
    and two distinctive white wing-bars. The white of the throat extends down the
    middle of the upper belly, with the flanks pale grey and lower belly and vent
    pale yellow.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_145_1.png)


    **Where to see:** A very common endemic in the lowlands of Java and Bali, but
    less so on Sumatra, particularly in the north. It favours second growth, especially
    parks and gardens, mangroves, plantations and scrub.


    ## Yellow-bellied Prinia *Prinia flavviventris* 12–14cm

    Indonesian name: Peranjak Rawa


    Appearing like a long-tailed warbler, it has olive-brown uppers and tail, a bright
    yellow belly and a white chin, throat and upper breast. The head is greyish with
    a reddish-orange eye-ring and a very thin, and often broken, white supercilium.
    The legs and feet are dull orange, and the bill is dark brown above and pale brown
    below. This prinia has a weak song.


    **Where to see:** Found on Sumatra and West Java, it is common in grassland, reedbeds
    and thick scrub in the lowlands. It has shy habits, with a tendency to remain
    hidden among grass and reeds in wetland habitat.


    ## Plain Prinia *Prinia inornata* 11cm

    Indonesian name: Peranjak Padi


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_146_0.png)


    This small prinia has plain, grey-brown upperparts from the crown over the ear-coverts
    and back to its long, tapered, buff-tipped tail. The underparts are whitish rufous
    towards the belly and vent. It has a broad white supercilium. The legs are pale
    brown. The bill is black in the breeding season, becoming pale brown later.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_146_1.png)


    **Where to see:** Occurs on Java and Bali in a variety of habitats where scrubby
    grassland is present.


    ## Zitting Cisticola *Cisticola juncidis* 10cm

    Indonesian name: Cici Padi


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_147_0.png)


    This rather inconspicuous little brown bird is heavily streaked with dark brown
    and buff on its upperparts. The white underparts and vent are warm buff on the
    flanks, and the brown-and-black tail is tipped white. It has pink legs, a grey-black
    bill and a pale-brown iris. Its broad white supercilium distinguishes it from
    the Golden-headed Cisticola.


    **Where to see:** Occurs throughout the region. Common in lowland grassland and
    reedbeds; it is attracted to wet habitat and rice fields.


    ## Golden-headed Cisticola *Cisticola exilis* 9cm

    Indonesian name: Cici Merah


    Breeding males have a warm golden crown and rump. Non-breeding birds and females
    are very similar to the Zitting Cisticola but have a more golden head colour,
    and the buff supercilium is the same colour as the nape and head sides. The throat
    is white and the underparts buff. The dark brown tail is tipped buff.


    **Where to see:** Occurs throughout the region. A common bird of Alang-alang grassland,
    rice fields and reedbeds on Java and Bali. Only locally common on Sumatra.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_147_1.png)


    ## Oriental Reed Warbler *Accephalus orientalis* 19cm

    Indonesian name: Kerak-basi Besar


    This is a large brown warbler with a conspicuous pale buff supercilium underlined
    by a thin dark-brown eye-stripe. Its underparts are whitish, shading into buff
    on the flanks, rump and upper belly, with the upper belly and the sides of the
    breast sparsely streaked brown. The largest bill is brown above and tinted pink
    below, and the legs are blue-grey.


    **Where to see:** Occurs throughout the region as a winter migrant. Usually found
    in lowland reedbeds and coastal marshes, but frequently occurs in rice fields
    and scrub near water.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_148_0.png)


    ## Striated Grassbird *Megalurus palustris* 22–28cm

    Indonesian name: Cica-koreng Jawa


    Large, long-tailed warbler, the male being larger than the female but very similar
    in their buff-brown plumage. It has a long white supercilium above a dark brown
    eye-stripe. Upperparts are light brown, heavily streaked darker on the mantle.
    Underparts are white-buff with superficial streaking, darker on the flanks. The
    bill and iris are brown and legs yellow-brown.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_148_1.png)


    **Where to see:** Resident in Java and Bali’s wetlands and marshes where tall
    grass is present.


    ## Pygmy Cupwing *Pnoepyga pusilla* 8–9cm


    This tiny babbler has warm buff-brown underparts, olive-green-upperparts. The
    face and ear-coverts are dark, with whitish tip to the tail.


    **Where to see:** Found mainly on Java and Sumatra.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_149_0.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_149_1.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_149_2.png)


    ## Barn Swallow *Hirundo rustica* 17–19cm

    Indonesian name: Layang-layang


    The Barn Swallow is dark above with a white breast. The wings are blue and the
    tail black-ish. Juveniles are duller.


    **Where to see:** Overwinter in the region. Often seen wheeling high, hunting
    insects. Sometimes gathers in huge in reedbeds, tall grasses and even on buildings.


    ## Ruby-throated Bulbul *Pycnonotus dispar* 20cm

    Indonesian name: Cucak Emas


    This large bulbul has olive-green-upperparts. Distinguished by its bright red
    throat and rounded tail. The head is black with a yellowish vent. The bill is
    black, legs blackish and orange.


    **Where to see:** Occurs throughout the region. In secondary forest and tall trees
    at forest edges.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_150_0.png)


    ## Black-headed Bulbul *Microtarsus melanocephalus* 16–18cm

    Indonesian name: Cucak Kuricang


    Recognised by its yellow-green body plumage and glossy head and throat. The upperparts
    are greenish-yellow tinged brown, the wings being a little darker and the tail
    black with a broad black subterminal bar. Rare forms exist in which the yellow
    areas are replaced by dull grey or greenish-olive.


    **Where to see:** Occurs throughout the region, in riverine and coastal scrub
    and often along roadsides.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_151_0.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_151_1.png)


    ## Scalaly-breasted Bulbul *Pycnonotus squamatus* 14–16cm


    The upperparts, including the mantle to the rump, are olive-green, the wings being
    a little darker and the black tail tipped white. The underparts are black on the
    breast and flanks with the feathers edged white, producing a scaled appearance.
    The chin, neck and lower belly are white and undertail-coverts yellow. The head
    is black from the lores over the crown to the nape and the ear-coverts. The iris
    varies from red to yellow; the legs and thinish bill are black. Sumatran birds
    have darker upperparts.


    **Where to see:** Most likely to be seen at forest edges, on Java and Sumatra.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_152_0.png)

