  - '[PAGE 130]


    # White-bellied Fantail Rhipidura euryura 18cm


    Indonesian name: Kipasan Bukit


    Males and females have very similar plumage; predominantly dull-grey overall but
    below the mid-belly it is white. There is a broad white supercilium and the outer
    tail feathers are tipped white. Bill and legs are black and the iris dark brown.


    Where to see: Occurs in Java''s dense montane forests, often in small groups with
    other species, foraging for small flying insects.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_130_0.png)


    # Black Drongo Dicrurus macrocercus 25–30cm


    Indonesian name: Srigunting Hitam


    This drongo has black plumage with slight iridescence and a long, deeply forked
    tail with outer feathers which tend to turn outwards at the tips. Juveniles show
    pale grey barring on the underparts. Unlike most other drongos, favours open country
    and often associates with cattle, which disturb insect prey.


    Where to see: Occurs on Java and Bali. Frequently seen in open scrub, cultivated
    land and rice fields, perching on fencing, isolated branches and telephone wires
    alongside roads.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_130_1.png)'
  - '[PAGE 131]


    # Ashy Drongo Dicrurus leucophaeus 26–29cm


    This drongo has the typical long, forked tail and upright stance. Its plumage
    is light blue-grey, with a tuft of black feathers at the base of the upper mandible.
    The subspecies in the region all vary in their grey colour. Sumatran birds occasionally
    have a white loral spot, with those in north


    Sumatra being a little darker. Usually observed in pairs waiting on exposed branches
    to swoop on large passing insects.


    Where to see: Occurs throughout the region. A bird of open woodland and forest
    edge and clearings.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_131_0.png)'
  - '[PAGE 132]


    # Crow-billed Drongo Dicrurus annectens 27–30cm


    Indonesian name: Srigunting Gagak


    This sturdy elegant drongo has a strong, broad bill, well adapted to taking aerial
    insects in flight. The base of the bill is hidden by a layer of short feathers.
    The head is black and the remainder of the uparts glossed black with a bluish
    iridescence. The underparts are black, often spotted white. The long, blackish,
    forked tail has the outer feathers curved outwards. Legs and bill are black and
    the iris dark red.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_132_0.png)


    Where to see: Occurs as a migrant on Sumatra and West Java, frequenting wooded
    lowland and hills.


    # Javan Spangled Drongo Dicrurus jentincki 27–29cm


    Indonesian name: Srigunting Jawaut


    This unusual drongo has a peculiarly fork-shaped tail, the outer feathers spreading
    outwards and upwards almost into a lyre shape. It also has an extraordinary crest
    of long, hair-like feathers from the front of the crown, but this feature is variable.
    It has a very pale buff eye. The general plumage is glossy black with an iridescent
    spangling, particularly on the crown and upper breast.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_132_1.png)


    Where to see: Occurs in East Java and Bali. It is common in open areas of lowland
    and submontane forests.'
  - '[PAGE 133]


    # Lesser Racket-tailed Drongo Dicrurus remifer 25–28


    A spectacular, big, glossy-black drongo with a square-ended tail and extended
    tail-streamers almost 50cm long. Each streamer feather shaft terminates in an
    elongated oval web around 10cm long. A substantial tuft of short black feathers
    covers the base of the upper mandible, creating a long-headed appearance. It is
    smaller than the Greater Racket-tailed Drongo, has no frontal crest, and has no
    fork in the tail.


    Where to see: Occurs in West Java and the Barisan Range and Batak Highlands of
    Sumatra. Inhabits dense montane forest and secondary forest, especially at edges.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_133_0.png)'
  - '[PAGE 134]


    # Greater Racket-tailed Drongo *Dicrurus paradiseus*


    30cm plus 35cm tail rackets Indonesian name: Srigunting Batu


    This large, forked-tailed drongo has beautifully extended outer tail feathers
    on the outer edge of the shafts terminating in spirally twisted rackets on the
    shafts. Its forked tail easily separates it from the Lesser Racket-tailed Drongo.
    Plumage is glossy black, and adults often display a short frontal crest on the
    crown. The bill and legs are black.


    **Where to see:** Occurs throughout the region. Usually found in pairs, often
    hawking for insects in glades in swamp, primary and secondary forests and in mangroves.
    It remains a common bird of the lowland forests of Sumatra.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_134_0.png)'
  - '[PAGE 135]


    # # Black-naped Monarch Hypothymis azure 15–17cm

    Indonesian name: Kehicap Ranting


    A beautiful flycatcher with an azure-blue head and back. The male has a short,
    erect black hindrown crest and a thin black band above and below the bill. A narrow
    black band extends


    across the upper breast, with a grey belly paling to a white vent. Wings are grey,
    tail-blue, bluish tipped band, iris dark brown and legs-grey. Females and juveniles
    are duller and greyer and lack the male’s black markings. Small colour variations
    occur: Sumatran birds are more grey-blue, on Java and Bali males are pale blue
    and females have greyish-blue uppersparts, and over Nusa Penida Island, Bali,
    females have a more-bright blue.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_135_0.png)


    **Where to see:** Occurs commonly throughout the region''s forests, edges and
    scrubland.


    # ## Amur Paradise-flycatcher Terpsiphone incei

    males: 20–25cm, females: 18–21cm Indonesian name: Seriwangi Utara


    Occurs in two colour forms: red and, much less common, white. In red form, upperparts
    and upperwing down to the tail are rich chestnut. The upper breast is pale grey
    shading to white at the belly and vent. The bill and legs are grey and the iris
    brown, encircled by pale blue bare skin. The red-form male has a long chestnut
    tail and complete glossy-black head, including a nuch crest. The white form is
    similar to Blyth’s Paradise-flycatcher but shows less black on the edges of the
    primaries. The female’s plumage is very similar, but has a much shorter tail.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_135_1.png)


    **Where to see:** A scarce overwintering species of scrubland and forest edge,
    occurring on Sumatra and West Java.'
  - '[PAGE 136]


    # Blyth’s Paradise-flycatcher Terpsiphonis affinis 20–30cm


    Easily confused with Amur Paradiseflycatcher. It also occurs in two colour forms:
    red and, much less common, white. The red-form male has a complete glossy black
    head including a nuchal crest, whereas the upper breast to mid-breast the flanks
    is dark grey grey before becoming white on the lower belly. The vent and tail
    are light chestnut, as are the remaining


    uppers. The rarer white form is all white apart from the black head and some wing
    markings. The female’s plumage is very similar but with a much shorter tail.


    Where to see: A common over-wintering species of scrubland and forest edge, occurring
    on Sumatra and Java.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_136_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_136_1.png)'
  - '[PAGE 137]


    # Jay Shrike Platylophus galericulatus 31–33cm


    Indonesian name: Tangkar Ongklet


    This bird is relatively inconspicuous until it starts to call, the harsh and rattling
    sounds revealing its presence. Its plumage is dark grey to black,


    apart from a broad white patch. Easily recognised by its tail, flat, upright crest.
    The bill is black and legs are dark grey.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_137_0.png)


    Where to see: Occurs in Java and Sumatra''s lowland broadleaf and hill forests,
    usually in small, noisy groups foraging through trees and bushes.


    # Tiger Shrike Lanius tigrinus 17–19cm


    Indonesian name: Bentet Loreng


    This little shrike has a robust, bluish-black, hook-tipped bill. The adult''s
    crown is light grey extending well over the nape into the mantle, and it has a
    broad, mask-like eye-stripe from the lores over the ear-coverts (not present on
    immatures). The upperparts are russet-brown barred black down to the warm brown
    tail. Underparts, including chin to undertail-coverts, are white. The legs are
    grey-blue and iris dark brown. Females are duller with less obvious markings.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_137_1.png)


    Where to see: Occurs in more open habitat and secondary forests throughout the
    region. Uncommon.'
- md: '

    ## Long-tailed Shrike Lanius schach 20–25cm


    Indonesian name: Bentet Kelabu


    Easily identified by the long black tail, upright stance and brown, black and
    white plumage. It has a grey crown and nape, with chestnut mantle, back and rump;
    the underparts are clean white. Adults have a black mask through the forehead
    and across the ear-coverts. Juveniles tend to be duller, with dark grey head and
    nape and barring on flanks.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_138_0.png)


    **Where to see:** Occurs throughout the region. Often in pairs, it roams through
    grassland and scrub, venturing into cultivated land and plantations up to the
    edge of human habitation.


    ## Common Green Magpie Cissa chinensis 31cm


    Indonesian name: Eek Layongan


    This magpie is predominantly green with a conspicuous black mask stretching through
    the eye to the nape. The more yellowish-green crown feathers also extend to form
    a short crest at the nape. The wing feathers are dark chestnut apart from the
    light green scapular and uppercoverts. The underside of tail is pale green; a
    red orbital ring encircles a brown iris; the substantial bill and legs are red.
    The bright green plumage is sometimes faded by sunlight to pale blue, particularly
    when in captivity.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_138_1.png)


    **Where to see:** Occurs in the hill and mountain forests of Sumatra.


    ## Racket-tailed Treepie Crypsirin temia 31–33cm including 18cm tail


    Indonesian name: Tangkar Centrong


    This member of the crow family has uniformly blackish plumage with a greenish-bronze
    sheen. It has black feet, a strong black bill and blue eyes. It differs from all
    similar birds in the region in having a long tail with spatulate tips to the central
    feathers.


    **Where to see:** Occurs as a resident on Java and Bali. Usually inhabits lowland
    and hill forests and plantations, and often in secondary growth, more cultivated
    areas, and even scrubland and gardens.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_139_0.png)


    ## Sunda Crow Corvus enca 43–48cm


    Indonesian name: Gagak Hutan


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_140_0.png)


    This entirely black crow is more slender and shorter-tailed than its larger cousin,
    the Large-billed Crow, which is also found in the region. It also has fewer throat
    hackles and inconspicuous bare black skin around the eye. Most of its plumage
    is slightly iridescent purple, except for the dull black underparts. The longest,
    slightly downcurved bill is black, the legs also black and the iris brown. In
    flight it shows a squarish tail and broad, stubby wings.


    **Where to see:** Occurs in forest and at forest edges throughout the region,
    sometimes in pairs.


    ## Large-billed Crow Corvus macrorhynchos 47–50cm


    Indonesian name: Gagak Kampung


    This bulky black crow is distinguished from its close relative, the Sunda Crow,
    by its strong, solid bill, more protruding foreneck and more pronounced throat
    hackles. Its overall plumage is glossed purple. The iris is dark brown and feet
    are black. Even the underparts show iridescence, except in juveniles, which are
    soft matt in appearance. In flight it has long and broad wings with wide-spread
    primaries and long tail.


    **Where to see:** An open-country species occurring throughout the region, often
    close to human habitation.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_140_1.png)


    ## Rail-babbler Eupetes macrocerus 28–30cm


    Indonesian name: Sipinjur Melayu


    The unique rail-babbler occurs in the region, where it is almost totally terrestrial
    and is mostly revealed by its sorrowful whistling call. It has a long neck and
    tail. Its plumage is mainly red-brown on both rear upperparts and underparts,
    which become redder over the belly, neck and underwing, and chestnut on the chin
    and throat. The forecrown is buff, the crown chestnut with a broad white supercilium
    above a broad black eye-stripe from the lores to the nape. Below the rear of the
    eye-stripe there is a bright blue patch over each gular sac. Bill and legs are
    black and the iris is brown.


    **Where to see:** Occurs on Sumatra, primarily in dense forest.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_141_0.png)


    ## Grey-headed Canary-flycatcher Culicicapa ceylonensis 12–13cm


    Indonesian name: Sikan Kepala-abu


    This little flycatcher has a typical upright posture with a raised crest. The
    head, from nape, along with the sides of the face, neck and upper breast, is grey.
    The upperparts are dull green, from the mantle to the rump as well as the upperwing-coverts.
    The black wing feathers are edged dull green. The underparts from breast to undertail-covers
    are dull yellow, becoming greyish on the flanks. A white eye-ring encircles a
    dark brown iris; the bill is black above, pink below and leaves fawn colour.


    **Where to see:** A common forest and woodland species, occurring throughout the
    region.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_142_0.png)


    ## Cinereous Tit Parus cinereus 13cm


    Indonesian name: Gelatik-batu Kelabu


    These are relatively small, black, white and grey birds. The head and throat are
    black, with a black stripe from the throat to vent; the ventral stripe is wide
    on males, but on females can be very narrow and even broken. There is a large
    white patch on the cheek and a small white nape spot.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_142_1.png)


    **Where to see:** Occurs throughout the region from lowland to open montane deciduous,
    coniferous and secondary forests as well as mangroves and even gardens. Usually
    seen foraging for insects.


    ## Australasian Bushlark Mirafra javanica 13–15cm


    Indonesian name: Branjangan Jawa


    This bird occasionally perches in trees but is more often seen walking on the
    ground. It has dark-mottled, russet-brown uppers, with paler underparts and white
    outer tail feathers. It has a broad buff supercilium and brown bill tinted yellow.
    Its short, pinkish-grey legs have long claws. It has a weak undulating flight,
    and like many other larks it often has a fluttering hover-in in which it sings,
    with a high-pitched trilling, before gliding slowly back to the ground.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_143_0.png)


    **Where to see:** Common in open areas of short grass, rice field stubble and
    cultivated fields on Java and Bali.


    ## Common Tailbird Orthotomius sutorius 10–14cm


    Indonesian name: Common Pisang


    The uppers on this wren-like warbler are yellow-green from the nape to the tail,
    with the flight feathers brown olive. The head is bright chestnut from the lores
    to the nape, the chin being little paler. The underparts from throat to undertail-coverts
    are buffish-white, becoming grey-white on the flanks. The longish bill is brown
    above, pink below and the iris is pale red and legs are pink-yellow. Females have
    slightly shorter tails and juveniles.


    **Where to see:** Common on Java, in open scrub and gardens, close to human habitation.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_143_1)


    ## Ashy Tailbird Orthotomus ruficeps 12cm


    Indonesian name: Common


    A small, plain-coloured tailorbird with a grey-brown back and greyish underparts,
    becoming white on the belly. Males have a rufous face, crown and throat, whereas
    females have a much paler rufous face and crown and white throat.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_144_0.png)


    **Where to see:** This energetic little bird frequently occurs in the region''s
    wetland areas in more open country and lowland forests, mangroves, bamboo thickets,
    coastal scrubland and well-vegetated gardens.


    ## Olive-backed Tailorbird Orthotomus sepium 12cm


    Indonesian name: Jawa


    This tailorbird has olive-grey upperparts, paler below with a whitish belly. The
    head of the male is almost completely light chestnut, including crown to below
    the ear-covets and lores to nape; the chin being little paler. Females have less
    chestnut on the face. The greyish tail has a fine whitish tip below a dark subterminal
    bar. The legs are pink, the quite long bill is brown above, pinkish below and
    the iris is pale red. Females are duller with a white chin.


    **Where to see:** Occurs in Java and Bali’s scrublands, cultivated areas and mangroves.

