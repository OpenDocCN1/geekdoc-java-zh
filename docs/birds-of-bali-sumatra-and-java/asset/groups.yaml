    # 引言


    巴厘岛、苏门答腊岛和爪哇岛的总面积约为 613,000 平方公里，是英国面积的近 2.5 倍，拥有约 700 种鸟类。凭借如此丰富的鸟类资源，鸟类因其美观和灵性而被广泛饲养并不意外。如今来到该地区的游客日益增加，他们不免注意到许多房屋的檐下都挂着笼在子里的鸟。仔细观察发现，许多被圈养的物种与世界各地宠物店常见的种类相同。幸运的是，大部分国际贸易现在已经停止，但当地市场仍然存在，这对当地种群造成了影响，尽管有保护性法律，某些物种已处于灭绝边缘。


    到目前为止，只有爪哇凤翅�在近期灭绝，但其他几种物种，最著名的巴厘八퇴正处于边缘。巴厘八퇴的消灭有大量记录，很大程度上是由于非法捕捕，并因人类干扰和栖息地丧失而加剧。类似的惨剧也也出现在许多其他物种身上，包括爪哇雀、印度红�鸢和黑翅八哥，它们在几年前还是常见的景象。


    幸运的是，印度尼西亚当局联合国家和国际保护组织认识到了保护的紧迫性，现在大片区域已被指定为国家公园和保护区，并对野生动物进行特别保护。游客应记住，进入许多此类保护区需要官方许可，并可能需要提前安排。即使在保护区之外，最受威胁的动物在理论上也受到了保护。


    由于这本小书的篇幅限制，无法涵盖在巴厘、苏门答腊和爪哇主要岛屿上记录的所有 700 多种鸟类。因此，选用的标准是在该地区较为常见的鸟类。书中还增加了一些较不常见但更壮观的物种，以揭示那里巨大的生物多样性，并让读者理解其特征属性。


    书中介绍的 322 物种涵盖了在该地区可能遇到的大多数科的合理代表。读者无疑会遇到其他物种，这些物种可以在列出的更具专业性（但遗憾更繁琐）的书籍或或上找到。


    # 观鸟


    对于我们大多数人来说，观鸟实际上是给鸟命名，但通过更详细的研究可以获得更多收获。行为、生命周期以及与环境的互动是极着迷的主题，它们不仅能带给我们巨大的乐趣，还能增加我们对周围世界的认知。


    然而，最初识别必须是首要任务。我们应该考虑所有可用线索，理想情况下不仅要识别物种，还要识别其性别、年龄和亚种。有很多线索可以参考，通过结合这些线索，我们可以缩小范围直到解决问题。我们认可视觉线索的所有价值，但在变得更有经验之前，我们忽略了声音的重要性。对于经验丰富的观鸟者来说，一台良好的录音机和笔记本、望远镜、单筒镜和野外指南一样，都是其装备的一部分。那些重要的鸣叫通常可以在当天的晚些时候被识别出来。


    ## 观鸟辅助


    无论你带什么设备，都应使其免受天气侵害。雨水和高湿度为相机、望远镜和电子设备提供了最糟糕的条件。任何设备都应保持干燥通风，如果可能的话，与硅胶干燥剂一起存放，以防真菌侵害。如果预防措施不足，其造成的损害是令人惊讶的。理想情况下建议使用轻便的防水望远镜，特别是当你进入潮湿地区时，但对于一般的观察，不不贵的种类对大多数情况也绰有余。对于更严肃的观鸟爱好者，有许多专业型的望远镜可以选择，还有用于远距离观察的单筒镜。


    对于录音，可以使用手机记录近距离的声音，但为了获得更好的效果，请使用紧凑、轻便且价格合理的奥斯录音机，如 LS-P5。对于更远的鸟声，最好使用额外的抛物麦克风而非定向枪式麦克风。


    相机不建议用于常规的观鸟旅行，不仅是因为天气对设备的有害影响，还因为几乎无法同时关注这两项活动，特别是在团体情况下。


    幸运的是，许多优质观鸟区域开车到达。此外，总有公共交通，且除巴厘岛外，旅程终点随处可见被称为“ojeks”的摩托车出租。在野外，消耗能量的热量和湿度可能是最大的缺点。这里应该没必要建议卫生问题以及携带足够的瓶装水。保持身体健康至关重要，特别是在医疗设施可能糟糕或不存在的地区。不要忘记带上必备药物，并随时准备应对胃部不适。记住，“巴厘胃”并不限于巴厘岛。在某些时期昆虫也可能是一个问题，杀虫喷雾和霜可以让你免受一些糟糕的叮咬。合适的衣服也至关重要，不仅是为了抵御风雨，还作为伪装。轻便、暗色的衣服是必要的。建议游客携带带帽的轻雨衣，在低地森林中，长裤有助于防止植物接触皮肤。结固的鞋子是必须的，尽管许多人更喜欢重型凉鞋，特别是在潮湿条件下。轻便帆布靴比皮鞋好，后者极易长霉。普通绿鹊。


