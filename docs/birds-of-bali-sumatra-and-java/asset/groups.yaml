    ![](img/ebd3744cf82a745248fa123f6c6b3e51_13_0.png)


    绿孔雀。


    # 格德/潘朗戈国家公园 (Gede/Pangrango National Park)


    这座西爪哇国家公园主要由茂密的常绿森林组成，但在潘朗戈山（Gunung Pangrango）的山顶拥有苔藓矮林和高山草甸。这里是观察许多爪哇特有种的好地方，如爪哇短尾莺、爪哇蜡、爪哇雕、栗腹斑、爪哇猫头鹰、爪哇白眼雀、普通鹬、小鴫、山雀、火山金燕和蓝尾蜂。


    红树林和相当崎岖的海岸线点缀着一些美丽的海滩。它是探索程度最低的地区之一，极有可能发现新物种。较稀有的鸟类包括犀嘴鸟、斑纹啄木、紫翠谷、针尾火雀、黑冠留��、灰斑纹绿鸽、黑颈果鸠、爪哇猫头鹰、瀑布（或巨型）金燕、黑纹喙和月香蜂。


    # 梅鲁·贝蒂里国家公园 (Meru Betiri National Park)


    梅鲁·贝蒂里涵盖了大量的湿润原始林和次生林。


    # 巴鲁兰国家公园 (Baluran National Park)


    巴鲁兰国家公园位于爪哇岛东北角，涵盖巴鲁兰山火山（Gunung Baluran）周边地区。它是最容易观鸟的地方之一，地形较开阔且易于，是观察绿孔雀和绿红丛林的好地方。该地区记录有白腹啄木、东方犀嘴鸟、斑点猫头鹰、斑纹画��、小白鹭和灰斑纹声眉。在这里很难错过黑颈黄鎴、灰头绿画和亚洲亚洲。可能看到的其他物种还有黑颈果鸠、白领翠鸟、蓝耳翠鸟、灰斑纹绿鸽、霍氏雀、丽太阳雀、紫危太阳雀、山蓝鸱和黄喉鹦雀。


    # 博哥植物园 (Kebun Raya, Bogor)


    由于由于交通方便，博哥植物园在周末挤满了当地游客。然而，工作日的访问在相对宁静的环境中会收获颇丰。博哥植物园占地1平方公里，迷人的环境已建立约两个世纪，提供了观察许多城市和森林鸟类的绝佳机会。这里有一群黑冠夜鹭，。


    # 潘甘达兰自然休闲公园 (Pangandaran Nature Recreation Park)


    位于中爪哇岛南岸西拉恰普（Cilacap）以西的是潘甘达兰半岛，那里有一个自然休闲公园。公园主要由干旱林组成，是观察绿丛林和爪哇斑画的好区域。其他存在的物种包括东方犀嘴鸟、白腹画鸸、鳞冠声眉和黑背翠鸟。东部是塞加拉阿坎的红树林，在那里可以看到许多水鸟。在大量的鹭类、白鸥和燕群中，可以看到小白鹭和白鹳。那里还记录了爪哇凤和嘴喙翠鸟。


    # 访问国家公园


    进入国家公园的费用可以在入口处支付。大多数印度尼西亚国家公园的步道网络、经验观鸟向导以及靠近最佳观鸟点的住宿非常有限。


    爪哇斑尾伞。


    ## 游水绿鸭 Dendrocygna arcuata 40–45cm

    印尼语名称：Belibis Kembang


    羽毛在背部、尾部和胸部通常为深栗褐色，尾下覆和臀部为白色，折叠翅膀处有一排黑色边缘的白色羽毛。头部和颈部呈较浅的褐色，颈后部有一个深棕色的长条冠羽。腿呈黑褐色，喙为黑色。这种鸟在飞行时会发出的一系列高频的哨声和啾啾声。


    **观赏地点：** 整个地区的河流、淡水湖泊、湿润沼泽、沿海湿地和红树林。


    ## 绒毛小鴻鸭 Nettaptus coromandelianus 30–35cm

    印尼语名称：Trutu Kapas


    这是一种小型黑白鸭，雄性以白色为主，冠、背部、翅膀和尾部有虹光黑色羽毛，颈部有黑色环。雌性的羽毛较暗淡，雄性为白色的地方为灰白色，雄性为黑色的地方为棕色；她有棕色的眼纹和颈环。飞行时，雄性会露出白色翅膀。


    **观赏地点：** 整个爪哇、巴厘岛以及苏门腊北部沿海沼泽、湖泊、水稻和草地。稀少。与大多数野生动物不同，该物种经常栖息在树上，通常在树中。


    ## 骨鸭 Spatula querquala 37–41cm

    印尼语名称：Itik Jurai


    非常独特的雄性在白色斑块上方有一个夸张的簇状尖冠。它的整体羽毛是带有紫色光泽的黑色，向尾部渐深；翅膀为绿色。雌性通常为棕色，带有条纹和绿白色的翼镜。


    **观赏地点：** 出现在整个地区，但在开阔水域较少。发现于淡水湖、稻田、盐湖和沼泽。


    ## 太平洋黑鸭 Anas superciliosa 47–60cm

    印尼语名称：Itik Alis


    “黑鸭”是一个误称，因为这种鸟的羽毛实际上是深棕色，带有绿色翼镜。头部为黑色，带有白色眉纹。


    **观赏地点：** 出现在整个地区，但在苏门腊较少。发现于淡水湖、稻田、沼泽和草地。


    ## 环雉 Rollulus rouloul 25cm

    印尼语名称：Puyuh Sengayan


    雄性有短深褐色冠，头部和颈部有裸露皮肤。它的整体羽毛是带有紫色光泽的黑色，翅膀为深红色。雌性没有冠，羽毛为灰色；翅膀为深褐色并带黑纹。


    **观赏地点：** 苏门腊低地的泥炭沼和山地森林。通常一只雄性带着几只雌性，觅食种子、昆虫和掉落的水果。


    ## 栗腹斑 Arborophila javanica 27cm

    印尼语名称：Puyuh-gongong


    爪哇特有，每个亚种都有不同的红褐色头部，带有黑色斑纹和黑色颈圈。胸部从灰色过渡到栗色，腹白色。侧腹为栗色，背部和尾部为灰褐色带黑纹，翅膀为棕色带黑纹和小白色斑点。腿为红色，喙为黑色。


    **观赏地点：** 出现在爪哇山区森林的空地，通常成对出现，偶尔成小群出现，在灌木丛中觅食。


    ## 大凤 Argianus argus 雄性 160–200cm，雌性 70–75cm

    印尼语名称：Kuau Raja


    该地区最壮观的雉类之一，尤其是雄性极长的二飞羽和尾羽用于求偶展示。当尾巴高高并张开翅膀时，美丽的绿色“眼”状（眼斑）非常壮观。其他羽毛主要是栗褐色，被黄褐色和黑色的斑点和斑纹打破。雌性通常颜色较深，翅膀和尾巴较短，且没有雄性的眼斑。两性都有短深褐色冠，头部和颈部有裸露的蓝色皮肤。


    **观赏地点：** 苏门腊未受干扰的原始雨林。通常一只雄性带着几只雌性。


