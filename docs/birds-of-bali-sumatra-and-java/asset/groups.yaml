    ## Straw-headed Bulbul Pycnonotus zeylanicus 28–29cm


    Indonesian name: Cucak Rawa


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_153_0.png)


    A melodious song is responsible for the popularity of this species as a cagebird
    in Indonesia. It is one of the largest bulbuls, recognised by its straw-coloured
    crown and ear-coverts and its black moustachal stripe. The back, wings and tail
    are shades of greenish-brown. It has a thin black eye-stripe, a white chin and
    throat, grey breast and belly, and yellow vent. The upper breast and back have
    a small amount of white streaking.


    **Where to see:** Occurs on Java. Previously common in lowland and hill forest
    and riverine habitat, it is now Critically Endangered.


    ## Sooty-headed Bulbul Pycnonotus aurigaster 19–21cm


    Indonesian name: Cucak Kutilang


    This bulbul has a short, almost vertical crest topping its lustrous black head
    from the chin and just below the eyes to the nape. Ear-coverts are whitish and
    underparts tinted grey, darker on the upper breast and paler towards the yellow
    vent. Uppertail-coverts are white and tail black, tipped white. The hindneck is
    ash-grey darkening across the mantle and becoming paler onto the rump. The paler-edged
    feathers give a scalloped appearance. The wing-coverts and secondaries are similar.
    Primaries are brown, edged grey. Legs and bill black.


    **Where to see:** Common in scrubby, open habitats on Java and Bali, often close
    to human habitation.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_153_1.png)


    ## Orange-spotted Bulbul Pycnonotus bimaculatus 20cm


    Indonesian name: Cucuk Gunung


    Plumage is darkish, brown to olive-brown above, with paler yellow-tinged ear-covers
    and two distinguishing orange spots, one on the lores and the other above the
    eye. The throat is black shading into a brown upper breast that becomes off-white
    with brown mottling as it leads to a white belly and bright yellow vent. Some
    birds in central Sumatra have a greyish belly. The bill is black and legs grey
    to black. The iris is darkish red-brown. Juveniles are duller. The subspecies
    P.b. tenggerensis has a smaller orange eye spot and dark spotted ear-covers.


    **Where to see:** Occurs throughout the region, more often in lower mountain forests.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_154_0.png)


    ## Sunda Yellow-vented Bulbul Pycnonotus analis 20–21cm


    Indonesian name: Merbah Cerukcuk


    As befits its name, has a bright yellow vent but is otherwise relatively sombre
    in plumage. The uppers and tail are brown and the underparts white. The crown
    is dark brown and the supercilium white. Lores black. It has pinkish-grey feet
    and a black bill.


    **Where to see:** Common throughout the region, preferring more open habitat.
    Especially attracted to cultivation, plantations, gardens and parks, even in towns.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_154_1.png)


    ## Melodious Bulbul Alophoix bres 19–22cm


    Indonesian name: Empuloh Jawa


    This solidly built bulbul can be recognised by its habitual calling while raising
    its rufous crest and puffing out its white throat feathers. The uppersparts from
    the head to the tail are greyish olive-brown with the uppertail tinged chestnut.
    The underparts vary from pale olive-brown on the upper breast to yellow and buff
    on the vent with the flanks suffussed olive-brown. The iris is brown, the legs
    are pink-brown and the bill is grey-brown.


    **Where to see:** Occurs in the lower mountain forests of Java and Bali.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_155_0.png)


    ## Arctic Warbler Phylloscopus borealis 13cm


    Indonesian name: Cikrak Kutub


    Identified by its conspicuous, long, yellowish-white supercilium above a blackish
    eye-stripe. It also has a poorly defined white wing-bar. The uppersparts are dark
    olive and the underparts almost white, blending to olive-brown on the flanks.
    Similar to the smaller Yellow-browed or Inorn Warbler (Phylloscopus inornatus),
    but much duller and with less obvious wing-bars.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_155_1.png)


    **Where to see:** Occurs throughout the region as an overwintering migrant. Found
    generally at primary and secondary lowland edges and mangroves.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_155_2.png)


    ## Sunda Warbler Phylloscopus grammiceps 10cm


    Indonesian name: Cikrak Muda


    This active warbler frequently occurs in small groups in the lower canopy of forests
    in mountainous areas, foraging for insects. Mainly chestnut-and-grey upperparts,
    brown tail and white underparts. Long, black crown extends to the mantle. It has
    two yellow wing-bars, a very pale grey eye-ring.


    **Where to see:** A montane forest species occurring throughout the region.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_156_0.png)


    ## Mountain Leaf Warbler Phylloscopus trivirgatus 10–11cm


    Indonesian name: Cikrak Daun


    Mostly green above, with greenish-yellow underparts. Its prominent greenish-yellow
    crown-stripe and supercilium are intersected by a blackish stripe. The legs are
    grey and the bill is black with a reddish tinge. Juveniles are duller and greener
    below.


    **Where to see:** Occurs throughout the region. Common in montane forests, the
    treetops and forest edges.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_156_1.png)


    ## Javan Tesia Tesia superciliaris 9cm


    Indonesian name: Tesia Jawa


    This almost tailless warbler creeps around. Uppers from the nape to the tail are
    olive-green and underparts light grey, tinged olive on the flanks and rump. The
    nape is black, as is the eye-stripe, which broadens at the nape. The long and
    broad supercilium and ear-coverts are grey-white. The bill is black above and
    yellow below.


    **Where to see:** Occurs in West and Central Java in brushland and dense undergrowth
    at the edges and clearings of montane forest.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_157_0.png)


    ## Yellow-bellied Warbler Abroscopus superciliaris 9cm


    Indonesian name: Cikrak Bambu


    The uparts of this small warbler are olive-green becoming yellowish on the rump
    and tail-coverts. The tail is brown. A long, whitish supercilium separates the
    dark grey crown, forehead and nape from dark grey lores and ear-coverts. Underparts
    are very pale grey on the chin, throat and upper belly and pale yellow below.
    The bill is brown, legs light pink and iris dark brown.


    **Where to see:** Occurs on Java and Sumatra, where it adheres to forest undergrowth
    in the lowlands and foothills.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_157_1.png)


    ## Pygmy Bushtit Aegithalos exilis 9cm


    Indonesian name: Cerecet Jawa


    A rather plain little tit with medium-long tail and a small bill. Upperparts are
    grey and brown and the throat light grey; the remainder of the underparts are
    buff, tinged pink. It has a very pale yellow iris, brown to black bill and yellow
    legs. Both sexes and juveniles are similar.


    **Where to see:** Occurs only in the mountains of West and Central Java, showing
    a preference for montane forest edges, where it forages for insects, often in
    small flocks.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_158_0.png)


    ## Javan Heleia Apalopteron javanicum 13cm


    Indonesian name: Opior Jawa


    This white-eye does not have the familiar broad orbital ring. It has a grey crown
    extending onto the nape and the ear-coverts, and olive-green upperparts. The forehead
    is buff, as is the broken eye-ring, the iris is blackish-brown, the bill and the
    legs dark olive-yellow. The throat and chest are buff blotched pale grey shading
    into a yellow, blotched grey belly and yellowish flanks. The subspecies vary in
    the size and shape of the black loral patch.


    **Where to see:** Occurs in thick regrowth and forest of Java and Bali, sometimes
    venturing into cultivation.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_158_1.png)


    ## Sangkar White-eye Zosterops melanurus 10–11cm


    Indonesian name: Kacamata Biasa


    An active bird with upparts bright olive-green, and whole breast, belly, throat
    and vent bright yellow. Wings and tail are blackish-brown. It has a ring of white
    feathering around the eye broken by a dark loral stripe contrasting with darker
    sides to the face, and sometimes a yellowish forehead. The bill is dark brown
    and feet are grey.


    **Where to see:** A locally common woodland species occurring on Java and Bali.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_159_0.png)


    ## Warbling White-eye Zosterops japonicus 11–12cm


    Indonesian name: Empuloh Jawa


    Males have olive-green uparts, yellowish on the rump. The forecrown is bright
    yellow at the lores becoming olive-green on the crown. It has a black loral spot
    and loral line passing under the white eye-ring. The throat and upper breast are
    pale yellow becoming pale grey to white on the underparts and buffish on the flanks.
    The undertail-coverts are pale yellow and bill and legs grey-black. Iris is dark.


    **Where to see:** A mountaintop species occurring throughout the region.


    ![](img/ebd3744cf82a7452488fa123f6c6b3e51_159_1.png)

