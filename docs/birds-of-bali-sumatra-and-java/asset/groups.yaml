  mdcn: '


    ## 苍鹭 *Ardea purpurea* 75–90cm


    印尼语名称：Cangak Merah


    这种鸟与大苍鹭身高相当，但更优雅、更纤细，姿态也不那么弯腰。通过其较深色的腹部以及带有黑色条纹的红褐色颈部和上胸，可以轻松与其他同体型的鹭类区分开来。背部和翅膀呈紫色，散布着长长的紫色羽。它有黄褐色的喙、红褐色的腿和黄色的虹膜。幼鸟的羽色较单调，背部条纹较少，喙和腿呈棕色。尽管它们倾向于独居，但也会成群筑巢。


    **观赏地点：** 遍布整个地区典型的鹭类开放栖息地，如稻田、沼泽、红树林和湖泊，且经常出现在内陆。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_72_0.png)


    ## 大白鹭 *Ardea alba* 80–104cm


    印尼语名称：Kuntul Besar


    白鹭中体型最大的，喙更粗壮，颈部中间有一个奇特的弯折。在繁殖期，面部皮肤变为灰蓝色，眉心呈浅绿色，喙变为黑色，裸露的大腿部变为红色。在每年的其他时候，面部皮肤呈暗黄色，喙呈黄黄色（偶尔末端为黑色），脚和腿均为黑色。幼鸟的喙呈黄色且尖端黑色。


    **观赏地点：** 遍布整个地区，偏好泥涂滩、红树林和沿海沼泽，以及稻田。它们通常单只出现或成小群活动，以小鱼和青蛙为食。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_73_0.png)


    ##Intermediate白鹭 *Ardea intermedia* 64–72cm


    它的体型介于大白鹭和小白鹭之间，但并不常见。其特征是全身羽毛略微偏白，没有头羽，但有长背羽和胸羽，且仅眼睛前方有裸露的黄色脸部。与小白鹭不同，它的喙是黄色的且尖端为黑色。


    通过光滑无条纹的颈部与体型更大的大白鹭区分来。


    **观赏地点：** 遍布整个地区。可以在稻田、红树林、沼泽以及沿海泥涂滩发现，但可能经常出现在内陆。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_74_0.png)


    ## 小白鹭 *Egretta garzetta* 55–65cm


    印尼语名称：Kuntul Kecil


    比牛苍鹭大且纤细，有灰黑色的腿和黑色的喙。通常羽毛为亮全白色，在繁殖季节，胸部、背部和颈后部会长出长垂羽，并有一块小小的脏黄色裸露面部斑。亚洲迁徙亚种的特征是脚趾为黄色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_75_0.png)


    **观赏地点：** 遍布整个地区，主要出现在沿海低地的混合鹭类群中、稻田、河岸泥涂滩和沿小溪的沙洲。它们在繁殖群落和夜间栖息时会与其他鹭和白鹭自由混合。


    ## 太平洋礁白鹭 *Egretta sacra* 58–66cm


    印尼语名称：Kuntul Karang


    太平洋礁白鹭有两种体色。较常见的品种具有均匀的灰色羽毛，颈部短而厚，下巴极浅，深黄色的喙和绿色的腿。较少的是白色品种，类似于牛苍鹭，但体型大得多，头部和颈部更流线。它也有较短的绿色腿和脏黄色的喙。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_75_1.png)


    **观赏地点：** 遍布整个地区，通常局限于海岸，在不在水边捕食时可见其在岩石和悬崖上休息。更常见于离岸岛的沙滩和礁石。


    ## 牛苍鹭 *Ardea ibis* 45–55cm


    印尼语名称：Kuntul Kerbau


    鹭类、白鹭和反嘴鹬


    一种较小的白色鹭类，额头有时带橙色。在繁殖羽色下，胸部、头部和颈部会覆盖一层橙色，还有黄橙色的喙、腿和脚趾。更圆润的身体、短颈部和短而粗的喙将其与其他白鹭区分开来。它们群群筑巢和栖息。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_76_0.png)


    **观赏地点：** 整个地区常见，见于稻田和淡水沼泽地区。它们还会被放牧的牛吸引，取食它们惊扰出的昆虫。在巴厘岛佩图鲁村，大型夜间栖息地受到信仰的保护，人们认为这些鸟载着1966年反共主义大屠杀中去世巴厘利人的灵魂。


    ## 爪哇池鹭 *Ardea speciosa* 45cm


    印尼语名称：Blekok Sawah


    这种鹭类通常呈深褐色，深褐色身上带有黄褐色的腹部，翅膀为黑色。在繁殖羽色下，颈部和头部呈近黑色。它有黄褐色的喙和绿色的腿。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_76_1.png)


    **观赏地点：** 遍布整个地区，出现在淡水沼泽中。


    ## 黑脸鹭 *Nycticor melanops* 60cm


    一种体态粗实的鹭类，黑色头冠、颈部和白色腹部。在繁殖羽色下，面部皮肤变为灰蓝色，眉心呈浅绿色。它有黄褐色的喙和红色的腿。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_77_0.png)


    **观赏地点：** 遍布整个地区，出现在淡水沼泽和稻田。


    ## 斑纹鹭 *Scorides striata* 35–48cm


    印尼语名称：Kokokan


    成鸟主要是灰色的，带有栗色头冠和长颈。幼鸟呈深褐色，羽毛有条纹。它有黄色的喙。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_77_1.png)


    **观赏地点：** 遍布整个地区，出现在沿海地区和湿地。


    ## 马来夜鹭 *Gorsachius melanoph* 47–50cm


    印尼语名称：Kowak Melayu


    一种体型结实的鹭类，栗褐色的上部和带有条纹的白色腹部。它有黄色的喙和橄绿色的腿。幼鸟为深褐色。


    **观赏地点：** 作为迁徙鸟遍布整个地区，偏好沼泽和苇丛中的茂密植被。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_78_0.png)


    ## 绿朱 *Plegadis falcinellus* 55–66cm


    印尼语名称：Ibis Rokoko


    该地区唯一全色深羽的朱，具有绿色和紫色的光泽。幼鸟为深褐色并带有黄褐色条纹。它有长弯的喙和深色的腿。


    **观赏地点：** 出现在爪哇岛和巴厘岛的淡水沼泽和稻田。


    ## 黑头朱 *Threskiornis melancephus* 65–75cm


    印尼语名称：Ibis Cucukbesi


    几乎全白的身体被黑色的头部、颈部和强力的黑喙所抵消。长腿也是黑色的。


    **观赏地点：** 在苏门答腊和爪哇岛北部罕见，出现在淡水沼泽、湖河流边、淹没草场和稻田。


    '
