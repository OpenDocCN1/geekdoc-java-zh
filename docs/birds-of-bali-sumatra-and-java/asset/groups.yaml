    # Storm''s Stork Ciconia stormi 75–90cm

    Indonesian name: Bangau Storm


    A very rare stork, similar in appearance to Woolly-necked Stork. It has predominantly
    black uppersparts, a black breast, white neck with black patterning at the side,
    and a black crown. The tail and belly are white. During the breeding season, the
    bright pink facial skin patch and the yellow eye-ring are very obvious. The slightly
    upturned bill is reddish and the legs are pink.


    **Where to see:** Found only at freshwater pools in lowland forest in east Sumatra.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_64_0.png)


    # Lesser Adjutant Leptoptilos javanicus 120–130cm


    This strange-looking creature is not a pretty bird. Its massive horn-coloured
    bill on a virtually bald head and patches of orange skin on the head, neck and
    upper breast give the appearance of being deformed and sick. The back, wings and
    tail are dark grey and the underparts and upper back are white. The bill and legs
    are greyish. Juveniles have brownish-grey upperparts and dirty white underparts.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_65_0.png)


    Where to see: Occurs throughout the region''s coastal wetlands, mangroves, flooded
    grasslands and rice fields. Rare because of hunting and habitat loss in Java and
    Bali. It remains locally common in lowland areas of south Sumatra.


    # Milky Stork Mycteria cinerea 95–100cm

    Indonesian name: Bangau Bluwok


    This large stork usually occurs in single-species groups but in the company of
    other storks and herons. It is primarily white but has black flight feathers and
    tail. It has a prominent bare patch of facial skin which varies in colour from
    pink to red, a long, curved, olive-yellow bill and greyish legs. Juveniles are
    a dirty pale brown, with the rump white and the flight feathers black.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_65_1.png)


    Where to see: A relatively rare species found throughout the region. It occurs
    in mangroves and mudflats of west Sumatra, the north-west coast of Java near Jakarta,
    and Brantas Delta, near Surabaya.


    # Christmas Frigatebird Fregata andrewsi

    Length 90–100cm, wingspan 210–230cm

    Indonesian name: Cikalang Christmas


    This Critically Endangered seabird has very dark, brownish-black plumage, with
    long wings and a deeply forked tail. The male has a white patch extending between
    the belly and the vent, while in the female the patch is more extensive, extending
    forward to encompass the whole belly and onto the underwings. Males have a prominent
    bright red inflatable gular sac used in display, and grey bill and legs. Females
    are slightly bigger and have pinkish legs, bill and gular pouch. Immatures have
    variable head colour, from dirty yellow head to white.


    **Where to see:** This vagrant occurs around coasts of the region and originates
    from Christmas Island.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_66_0.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_66_1.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_66_2.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_66_3.png)


    # Oriental Darter Anhinga melanogaster 87–95cm

    Indonesian name: Pecuk-ular Asia


    Very similar to cormorants apart from the long, snaking neck, small head and yellow-brown,
    dagger-like bill. It is mainly black, with white-streaked plumed feathers on the
    wing and back. It swims very low in the water with only its head and neck showing,
    so it often becomes waterlogged and has great difficulty in taking to the air.
    It spends a lot of time alone on low, exposed perches, often with its wings outstretched
    to dry, but it roosts communally.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_67_0.png)


    Where to see: Occurs throughout the region, preferring large, clean freshwater
    lakes and slow, forested rivers.


    # Little Cormorant Microcarbo niger 51–56cm

    Indonesian name: Pecuk-padi Kecil


    The smallest of the cormorants in the region. The plumage is generally greenish-black,
    with a few tiny white feathers on the neck and head. The bill is yellowish-brown,
    with a black tip and purple near the base in adults. After breeding, the plumage
    darkens and loses the white flecks, except for the chin and throat, which become
    white. Immatures are all dull brown.


    Where to see: Occurs throughout the region, frequenting mangroves, lakes and estuaries,
    often in small flocks swimming low in the water and diving for fish. Once a common
    resident of the coasts, mangroves and lowland waterways of Java, but becoming
    rarer.


    # Little Pied Cormorant Microcarbo melanoleucos 58–65cm

    Indonesian name: Pecuk-padi Belang


    This little cormorant has a long tail and short, thick bill. In the region it
    loses its black-and-white pied breeding plumage for more blackish-brown and white.
    The underparts, neck, throat and sides to the face are all white and the uppers
    blackish-brown. The legs are black, iris dark grey, and bill orangey-yellow, tinged
    green.


    Where to see: Non-breeding birds occur on Java and Bali, practising freshwater
    habitat, rivers, lakes and swamps. Also appears at coastal estuaries and mangroves.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_68_0.png)


    # Little Black Cormorant Phalacirocorax sulcirostris 55–65cm

    Indonesian name: Pecuk-padi Hitam


    A bird with uniform black plumage and a purplish-green iridescent, except for
    mottling on the wing-coverts. In the breeding season, it acquires a small patch
    of white feathers behind the blue-green eye. It has a small greyish gular pouch
    and bare skin around the eye. The bill is grey-blue and the feet black.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_69_0.png)


    Where to see: Occurs as a resident on Java and Bali and is spreading along the
    east Sumatran coast. Mainly a bird of inland lakes, fish ponds and reservoirs,
    it is occasionally on coastal estuaries, where it roosts on rocks and trees. It
    is uncommon, but a colony exists at Pulau Rambut on the north-west Javan coast.


    # Australian Pelican Pelecanospicillatus 152–185cm

    Indonesian name: Undan Kacamata


    Similar in size to the Great Pelican (Pelecanus onocotus) and identifiable by
    its black tail and upperwing coverts, pinkish pouch and lack of bare facial skin.
    The primaries and secondaries are black, legs and feet grey-blue. It flies with
    laboured wingbeats and catches fish by plunging into the water.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_69_1.png)


    Where to see: It breeds in Australia, migrating north and west as far as Bali
    and East Java. Occasionally found singly but more often in small flocks on estuarine
    sand flats and mudflats.


    # Cinnamon Bittern Ixobruchus cinnamameus 40–41cm

    Indonesian name: Bambangan Merah


    Adult males have bright cinnamon-brown upperparts and orange-buff underparts and
    are streaked black on the centre of the belly and along the upper flanks. The
    sides of the long neck are streaked dirty white. Females and immatures appear
    darker, with a black cap, and immatures have a more mottled appearance. One of
    the smaller, more timid bitterns of the region. When disturbed, it rises from
    cover with a croaking alarm call and flies off with slow, powerful wingbeats.


    Where to see: Occurs throughout the region, living in grassland, freshwater swamps
    and rice fields. Common.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_70_0.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_70_1.png)


    # Grey Heron Ardea cinerea 85–100cm


    A predominantly grey bird with paler underparts, it has a prominent black streak
    on the head extending into a small nuchal crest, black flight feathers and a line
    of black streaks on the front of its white neck. Legs and bill are yellowish.
    It appears smaller than the Purple Heron and lacks the reddish-brown colour of
    that species.


    Where to see: Found mostly in the region''s lowlands, frequenting wet areas such
    as rice fields, lakes, mangroves and swamps, hunting fish, frogs and crabs. It
    is a colonial nester, often seen in tall trees in the proximity of mangroves.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_71_0.png)

    [/content]

