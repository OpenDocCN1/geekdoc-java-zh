    # Javan Forktail Enicurus leschenaulti 28cm


    Indonesian name: Meninting Jawa

    The deeply forked tail consists of tiers of white-tipped black feathers overlaid
    to form an attractive, evenly spaced, crescent-shaped pattern pointing up to the
    body. The outer tail feathers are all white except for a contrasting white outstanding
    crown. The chin, breast and back are also black, as


    are the shoulder and scapulas. It has an obvious white wing-bar and white rump
    and belly. The legs are pink and the bill black. Males and females are similar,
    with juveniles being browner and duller.


    **Where to see:** Occurs in the lowland forests of Java and Bali.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_189_0.png)'
  - '[PAGE 190]


    # Yellow-rumped Flycatcher Ficedula zanthopygia 13–14cm


    Indonesian name: Sikatan Emas


    The underparts and lower back and rump of the flycatcher are bright yellow, and
    the undertail-covers whitish. The upperparts are all black apart from the broad
    white supercilium and a white area on the wing-covers and tertials. The bill is
    black, grey-blue below; legs black. Females are olive-grey over the crown to the
    yellow uppermost-coverts. Underparts whitish on the chin becoming pale pale yellow
    on the breast and whitish again on the vent. The pale wing patch is much less
    obvious than in the male.


    Where to see: A migrant that occurs throughout the region and is frequently found
    at woodland edges.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_190_0.png)


    # Mugimaki Flycatcher Ficedula mugimaki 12.5–13.5cm


    Indonesian name: Sikatan Mugimaki


    The male has blackish-grey upperparts including the head and tail, with two prominent
    white spots, just behind the eye, the other on the tips of the median coverts.
    The belly and undertail-covers are also white. The remainder of the underparts
    up to the throat are orange-red. The small bill is black, the


    legs are pink and the iris is dark brown. The female has dark brown upperparts
    and tail, the throat to mid-belly pale orange-red and the belly white.


    Where to see: Occurs throughout the region, mainly in lowland broadleaf evergreen
    forest.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_190_1.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_190_2.png)'
  - '[PAGE 191]


    # # Snowy-browed Flycatcher Ficedula hyperythra 11–13cm


    Indonesian name: Sikatan Bodoh


    This delicate little flycatcher has a round head and short tail. The underparts
    are alike in both sexes, being pale chestnut on the chin blending to fawn on the
    belly and white below the tail. The uparts differ, the male dark grey steely blue
    above and the female olive-brown. The male has a noticeable white stripe above
    black lores almost centrally but extending over the eye. The leg colour is variable,
    from purple to grey in males to pink in females. The bill is black and iris very
    dark brown. Females are coloured orange-buff from above the bill to just over
    the eye. Male Sumatraran birds have blackish


    wings and tail, and those on Java and Bali are greyer above.


    Where to see: Common in the highland forests of west Sumatra and on Java and Bali


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_191_0.png)


    # # Little Pied Flycatcher Ficedula westermanni 11cm


    Indonesian name: Sikatan Belang


    This species is sexually dimorphic, the male being black and white and the female
    brown and white. The male''s upperparts are all black, apart from a white wing-bar
    and supercilium and white edges to the base of the outer tail feathers. The underparts
    are all white and the legs and bill black. Iris dark brown. Females have brown
    upperparts and whitish underparts, the tail being rufous-brown. Juveniles are
    heavily spotted with buff on the head and upperparts and have dark barring on
    the breast. It has a quiet *pi-pi-pi-pi-pi* call followed by a vibrating churring
    sound.


    Where to see: Occurs throughout the region in submontane to montane forest.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_191_1.png)'
  - '[PAGE 192]


    # Rufous-chested Flycatcher Ficedula dumetoria 11–12cm


    Indonesian name: Sikatan Dada-merah


    The male''s upperparts are mainly black from the head and mantle, including the
    upperwing and tail. The long supercilium is white as are the median covert tips
    and of the upperwing-coverts, which form a white stripe along the wing. The bases
    of the outer tail feathers are also white. The throat and upper breast are orange-red,
    the remaining underparts white. Females are similar to the male but coloured olive-brown
    instead of black above.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_192_0.png)


    Where to see: Occurs throughout the region, but rarely on Bali. It is mostly insectivorous,
    preferring mainly lowland forests.


    # Pied Bushcat Saxicola caprata 13–14cm


    Indonesian name: Decu Belang


    Males are all black, apart from a rump, vent and distinctive wing-bar and shoulder
    patch. Females have dark brown-streaked upperparts, dark brown tail, buff underparts
    with rufous flanks, and pale rufous-brown rump. Juveniles are spotted dark and
    light brown. Often sings from a prominent perch while cocking its tail.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_192_1.png)


    Where to see: Like all the chats, this bird prefers scrubby grassland, where it
    perches on exposed bushes or posts to locate its insect prey. A common resident
    of the dry, open lowlands of Java and Bali, occurring sporadically in the hills.'
  - '[PAGE 193]


    # Greater Green Leafbird Chloropsis sonnerati 18–22cm


    Indonesian name: Cica-daun Besar


    Of the many leafbirds resident in the region, the Greater Green Leafbird is by
    far the largest. It is bright green on the back and tail, with slightly paler
    underparts. The strong hooked bill is black. The male has a black throat and face
    with a blue malar stripe, and the shoulder of the wing is marked by a small blue
    spot. The female has a yellow throat edged by a blue malar stripe, with a distinctive
    yellow eye-ring. Juveniles are very like the female, with the blue malar stripe
    being very dull or non-existent.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_193_0.png)


    Where to see: Typically found with other leafbirds in lowland primary and secondary
    forest throughout the region.


    # Blue-winged Leafbird Chloropsis moluccensis 17cm


    Indonesian name: Cica-daun Sayap-biru


    Both subspecies have the typical colour of most leafbirds; generally yellowish-green
    above and more yellow below. This species is recognised by the blue wings and
    tail. The male has a black patch below the eye which extends into a yellow-bordered
    black throat.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_193_1.png)


    The Sumatran subspecies has a yellow crown and yellow to orange nape, whereas
    the Javan subspecies has a green crown and yellow upper part. Females lack the
    black head and


    throat markings. All have a blue malar stripe, a little less evident on females.


    Where to see: Occurs at forest edges on Sumatra and Java.'
  - '[PAGE 194]


    # Asian Fairy-bluebird Irena puella 21–25cm

    Indonesian name: Kecembang Gadung


    Apart from the black face, neck, underparts, tail and primaries, the male''s plumage
    is brilliant blue. The iris is red and legs are dark grey. Females are a duller
    blue with a greenish tinge, except for their brighter blue rump. It can be distinguished
    from other bright bright blue-and-black birds by its larger size.


    Where to see: Commonly found in the lowland forests of Sumatra, but less so on
    Java. More likely to be seen at fruiting fig trees, where it is often in mixed
    flocks with other birds. Otherwise it confines itself to foraging through the
    tops of tall trees of primary and secondary forest.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_194_0.png)'
  - '[PAGE 195]


    # Crimson-breasted Flowerpecker Prionochilus percussus 10cm


    Indonesian name: Pentis Pelangi


    The adult male is brilliantly coloured, with bright bright yellow underparts broken
    only by a bright crimson breast patch. The uparts are greyish-blue, with a bright
    red patch on the crown. The forehead and primaries are black and the tail is dark
    blue-grey. It has a white malar stripe finely underlined in black. Females are
    olive-green above, with


    only a tinge of orange on the crown, and have a yellow-tinged grey throat, a white
    malar stripe and a yellow belly with greyish-olive flanks; the undertail-coverts
    are distinctly white.


    Where to see: A rather scarce and local bird of Sumatra and West Javan woodlands.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_195_0.png)'
