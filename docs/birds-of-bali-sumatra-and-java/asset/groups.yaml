    ## 金丝雨燕 *Aerodramus fuciphagus* 11–13cm

    印尼语名称：Walet Sarang-putih


    这种雨燕在飞行时很难与其他雨燕区分。羽毛整体呈黑褐色，喉部、腹部和背部呈灰色。苏门答腊的鸟类颜色通常更深。


    在哪里可见：它们自然栖息在该当地的洞穴中，利用回声定位进行导航。今天，这种雨燕在印度尼西亚已成为一项大生意，人们鼓励它们在废弃的建筑中筑巢，以便采集巢窝制作燕汤。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_42_0.png)


    ## 岩燕 *Apus nipalensis* 14–15cm

    印尼语名称：Kapinis Rumah


    这种中型雨燕可以通过宽宽的白色臀部、浅色喉部和略微凹的尾巴来识别，与相似但体更大的太平洋鹿（*Apus pacificus*）不同，后者的尾部有明显的叉形。除此之外，它有黑色的羽毛、黑喙和棕脚。


    在哪里可见：通常成群出现在开阔乡村上空捕食昆虫。它们偏好沿海栖息地和低矮丘陵，经常出现在城镇和村庄，在房屋屋檐下筑巢。它们还利用悬悬的崖壁和洞穴口作为筑巢地。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_42_1.png)


    ## 须蜂嘴莺 *Hemiprocne comata* 15–17cm


    比在该地区出现的灰臀蜂嘴莺（*Hemiprocne longipennis*）体小。有长且略微叉的尾巴和退化的冠羽。雄性身体大部分呈深绿色青色，头部和喉部发亮，被长白色眉纹和胡须纹衬托，纹之间被深褐色的耳羽隔开。腹部和三缘羽呈白色。雌性非常相似，但耳羽为蓝绿色。幼鸟颜色较暗且偏褐色。


    **在哪里可见：** 出现在苏门答腊，主要在低地原生森林和次生林或有高树的林地。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_43_0.png)


    ## 绿脚秧 *Gallinula chloropus* 30–35cm

    印尼语名称：Mandar Batu


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_43_1.png)


    这种适应能力极强的水鸟几乎全呈深灰色到黑色，侧面有一条断续的白纹。尾下也有白色斑块，特别是当它抬起尾巴冲向避难所时。它有具有特征性的额盾和喙，喙尖呈黄色。腿部为黄绿色。


    **在哪里可见：** 经常出现在该地区的淡水池塘、湖泊、河流和稻田。它们是良好的水游泳者，会潜水甚至在水面上奔跑。


    ## 紫秧 *Porphyrio porphyrio* 40–48cm

    印尼语名称：Mandar Besar


    易于识别，是一种大型蓝黑色水鸡，长有厚实的亮红色喙和额盾，背部和颈部侧面带有紫色光泽。上翅覆羽为黑色并带有绿色调，尾下羽为白色。它们长而粗、略显笨拙的粉色腿配着巨大的开趾，是践踏通过水生植物的理想工具。习惯性抖动尾巴。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_44_0.png)


    在哪里可见：遍布整个地区。一种相当安静且隐秘的鸟，停留在未受干扰的芦苇丛、沼泽边缘，偶尔出现在稻田。


    ## 白胸水秧 *Amaurornis phoenicurus* 28–33cm

    印尼语名称：Kareo Padi


    一种显眼的秧鸡，面部、前颈和胸部为白色，栗色侧腹和下腹部与深绿色的上部界限分明。喙为绿绿色基底呈红色，腿和脚为黄色。它们在黎晨和黄昏时非常活跃，发出一阵杂乱的叫声、咕噜声和咯咯声。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_44_1.png)


    在哪里可见：遍布该地区的湿地。它是一种游荡觅食者，经常出现在开阔地，但从未远离茂密的遮蔽处。非常敏捷，会在浮叶植物上奔跑并穿过灌丛寻找昆虫。


    ## 红脚秧 *Rallina fasciata* 22–25cm

    印尼语名称：Tikusan Ceruling


    红褐色的背部和较亮的红褐色头部，以及红腿是这种秧鸡的识别特征。其余上部为灰褐色。腹部和前翅有黑白相间的条纹。它有绿喙。雌性相似，但头部更偏粉，身体下部的条纹较窄。幼鸟斑纹较不明显，腹部颜色较浅，腿呈棕色。


    **在哪里可见：** 出现在该地区的潮湿低地森林，偏好受干扰的森林边缘，有时出现在附近的农耕地。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_45_0.png)


    ## 栗胸秧鸡 *Zapornia fusca* 21–23cm

    印尼语名称：Tikusan Merah


    容易与该地区的其他秧鸡混淆，它是唯一一种头部和胸部都是亮栗色的物种，有白色下巴和黑褐色的腹部，上面有细细的白色横纹。它有绿喙和红腿。上部为纯净的褐色。


    **在哪里可见：** 是该地区低地较为常见的留鸟。作为一种半夜行且害羞的鸟，它偏好避开稻田和芦苇栖息地，通常在水边的丛林。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_45_1.png)


    ## 大嘴脚鹬 *Esacus magnirostris* 51–57cm

    印尼语名称：Wili-wili Besar


    这种粗壮的岸鸟通过其硕大的黑喙（基部为黄色）以及布满黑白条纹的面部来识别。冠部为深栗色，上部为褐色，颈部和上腹部有浅褐色条纹。腹部到尾下羽为肉褐色。长而粗、略显细长的腿部是黄色的。它有一只巨大的黄色眼睛。


    在哪里可见：作为留鸟岸鸟遍布整个地区。很少在内陆发现，偏好沙质、泥泞或岩石质沿海海滩，在那里寻找螃蟹和小型甲壳类。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_46_0.png)


    ## 黑翅涉鹬 *Himantopus himantopus* 35–39cm

    印尼语名称：Gandang-bayang


    这种高挑且优雅的岸鸟有长粉色腿，飞行时拖在后方。它有长白色脖子和细小的头部，配有细长的黑喙。上部为黑色并带有微绿光泽，下部为白色带有黑色斑块。头部显示不同程度的黑色。雌性和幼鸟的上部颜色较暗。


    在哪里可见：主要出现在苏门答腊北部和爪哇，偏好浅水湿地、沼泽和稻田，偶尔出现在盐沼。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_47_0.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_47_1.png)

    ![](img/ebd3744cf82a745248fa123f6c6b3e51_47_2.png)


    ## 灰鹬 *Pluvialis squaratola* 27–30cm

    印尼语名称：Cerek Besar


    冬羽下，这种相当漂亮的水鸟上部呈灰褐色斑点，腹部为浅灰色到白色。它有浅色的眉纹、黑喙、深灰色腿和大眼睛。飞行时，它显示出浅色的翼带和臀部，下方为白色，在身体附近有一个大黑斑。这些特征很容易将其与体型稍小且喙较短的金眶区分开来。


    在哪里可见：作为冬季游客来到该地区。成小群出现在潮间泥滩上觅食海洋无脊椎动物，经常栖在孤立的碎石浅滩上。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_48_0.png)


    ## 海金眶 *Pluvialis fulva* 23–26cm

    印尼语名称：Cerek Kernyut


    典型的环卵形状，直立姿态，身体健壮，脖子和头部很大，喙短而有力。它在该地区通常处于非繁殖羽期，失去了在繁殖地的特征性黑脸和腹部。可以通过其斑驳的金色、褐色和肉色上部，以及肉色的胸部、脸和眉纹来识别。喙为黑色，腿为灰色。


    在哪里可见：这种冬季迁徙鸟停留在巽他群岛周边，通常成群聚集。在沿海附近的泥滩和开阔草地很常见。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_48_1.png)


