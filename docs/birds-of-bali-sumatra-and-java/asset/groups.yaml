    ## Daurian Starling *Agrosprit sturninus* 17–18cm


    Indonesian name: Jalak Cina


    The male is recognised by its grey head, a shiny purple patch on the rear crown
    and odd purple feathers on the upper mantle. The purple-black scapular contrast
    with a broad white band formed by their tips. The rump is white-buff and the short
    tail black, glossed green. The underparts are whitish. It has a shiny purple lower
    mantle. The iris is brown, the bill is black and the legs are grey. Females and
    juveniles are paler and have more brown colouring.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_175_0.png)


    Where to see: Occurs as a winter migrant to the region, often seen in city parks
    and gardens but also in coastal woodland.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_175_1.png)


    ## Javan Pied Starling *Gracupica jalla* 22cm


    Indonesian name: Jalak Suren


    The upperparts are mainly black, tinted brown. It has a white wing-bar, with forehead,
    cheeks, belly, vent and rump also white. Bare orange skin around the eye, yellow
    feet and orange-white bill give the bird a colourful appearance. Agricultural
    practices and the pet trade have decimated the wild population, and even those
    seen in bird markets today may have been captive-bred.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_175_2.png)


    Where to see: Occurs on Java and Bali. This species is now Critically Endangered,
    having once been common throughout the region, especially in more open and cultivated
    lowland country.


    ## Bali Starling *Leucopsar rothschildi* 25cm


    Indonesian name: Jalak Bali


    Its distinctive plumage is mostly white, apart from black wing-tips and the tip
    of the tail. It has a long white crest, shorter in the female, and a patch of
    sky-blue skin around the eye. This endemic to Bali is one of the world''s most
    threatened species, with very few birds now surviving in the wild. Destruction
    of habitat and trapping for the pet trade are the main causes of its decline.


    Where to see: A small wild population has managed to survive under protection
    in its native range of north-west Bali (Bali Barat National Park). It has regrettably
    and unscientifically, recently been introduced to Nusa Penida Island, Bali, which
    is outside its native range.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_176_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_176_1.png)


    ## Black-winged Myna *Acridototheres melanopter* 23cm


    Indonesian name: Jalak Putih


    Apart from black wings and tail and a yellow patch of bare skin around the eye,
    this starling is all white. The tail is tipped white, and there is a white wing-bar.
    North-west Javan birds appear much paler and have black only on the flight feathers
    and tail. South-east Javan birds have a grey rump and shoulder. Birds from Bali
    have more contrasting plumage with white underparts, neck and head to top of mantle,
    and upperparts, including back and to the tail, grey-black.


    Where to see: Three subspecies are endemic to the region: black-winged in north-west
    Java, grey-backed in south-east Java and grey-rumped on Bali. All seemingly prefer
    dry coastal grasslands.


    ## Common Myna *Acridototheres tristis* 24–26cm


    Indonesian name: Kerak Ungu


    The upperparts, as well as the mid-belly and flanks, are dark warm brown and underparts
    dark grey at the neck, fading to brown and white on the undertail-coverts. The
    head, neck and long crown feathers are shiny black contrasting with the strong
    yellow-brown bill and bright yellow bare skin below and behind the eye. When perched,
    a long white streak is visible on its forewing. The legs are yellow and the tail
    is brown, tipped white.


    Where to see: Occurs on Sumatra and Bali in a wide variety of habitats, from cities
    to open country.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_177_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_177_1.png)


    ## Sunda Thrush *Zoothera andromedae* 23–25cm


    Indonesian name: Anis Hutan


    This prettily patterned thrush has a particularly long bill. Its uppersarts, including
    the crown, are grey-brown with black feather edging creating a scallop pattern.
    The sides of the face, including the ear-coverts and lores, are white stippled
    black, and there is a white eye-ring surrounding a black iris. The throat, breast
    and belly are pale grey, becoming white on the belly and undertail-coverts. The
    white flanks are beautifully patterned with bold black scallops. Legs are pinkish-grey
    and the bill is black. The sexes are very similar. Juveniles are browner above
    and below.


    Where to see: Occurs throughout the region in hill and mountain forests.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_178_0.png)


    ## Horsfield''s Thrush *Zoothera horsfieldi* 28cm


    Indonesian name: Anis Horsfield


    In typical thrush fashion, this species spends much of its time foraging for the
    ground. It has only a quiet whistling song and a feeble tweet alarm call. Its
    uppers are olive-brown with golden-brown and blackish scaly markings, these being
    bolder on the back and upperwing-coverts. The brown-scaled underparts are more
    whitish, with a pale chestnut wash on the upper breast and flanks.


    Where to see: Occurs throughout the region, on Java and Bali in dense wooded areas
    and montane forest. On Sumatra is confined to the montane woodland of the north.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_178_1.png)


    ## Javan Coochoa *Coochoa azurea* 23cm


    Indonesian name: Ciung-mungkal Jawa


    The male has crown and most of the upperparts and tail glossy blue, while the
    underparts are more purplish-blue. Bill and crown wings and legs black. The female
    has a blue crown, wings and tail but is otherwise a very dark brown. Its high-pitched
    song is also quiet when alarmed it emits a louder djek-djek-djek call, reminiscent
    of many other thrushes.


    Where to see: Occurs in West and Central Java, frequenting the lower levels of
    tropical montane forest, seldom venturing into the canopy. It is often difficult
    to locate, as it seems to perch quietly and motionless for ages.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_179_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_179_1.png)


    ## Siberian Thrush *Geokichla sibirica* 20–23cm


    Indonesian name: Anis Siberia


    The male is dark slate-blue above and slate-grey on the flanks, becoming whitish
    on the belly. The head and shoulder area appear darker slate-blue. The undertail-coverts
    and outer tail feathers are tipped white. The legs are yellow and the bill black.


    Where to see: Regularly overwinters on Sumatra and West Java, in the lower levels
    of moist forest.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_180_0.png)


    ## Chestnut-capped Thrush *Geokichla interpreters* 16–17cm


    Indonesian name: Anis Kembang


    Chestnut-capped, as its name implies, this small thrush otherwise has a pied appearance.
    The chestnut crown extends onto the nape, stopping at the slate-grey mantle and
    upperparts. It has two distinctive white wing-bars. The throat and upper breast
    are dense black, leading into a black-spotted lower breast and white belly. The
    bill is blackish-brown and the legs pink.


    Where to see: Occurs in primary, secondary forest on Java, rarely on Bali.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_180_1.png)


    ## Orange-headed Thrush *Geokichla citrina* 20–22cm


    Indonesian name: Anis Merah


    The head, nape and belly are bright orange, the back grey-blue, and the tail and
    wings dark grey. It has a white vent and wing-bar. The female has greenish-brown
    uppersparts. It has a very nice song and this, along with its attractive colouring,
    makes it a prime target for local birdkeepers and more recently, the export pet
    trade.


    Where to see: Occurs in Java and Bali, in lowland and hill forests of bamboo thickets.
    Uncommon.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_181_0.png)


    ## Island Thrush *Turdus poliocephalus* 18–22cm


    Indonesian name: Anis Gunung


    This is a medium-sized thrush with a dark grey head blending into dull blackish
    uppersparts. The throat and upper breast are mid-grey, while the belly is chestnut
    and the vent white. The eye-ring, bill and legs are yellow. It has a pleasantly
    melodic song and a rather raucous rattling alarm call.


    Where to see: Occurs in the highest mountains of Sumatra and Java. More it can
    usually be seen close to the volcano of Mt. Tangkuban Perahu in the mossy forests
    of Mt. Gede. On Sumatra, the peaks of Mt. Leuser are its home.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_181_1.png)

