    # Zebra Dove Geopelia striata 20cm


    Known as the Zebra Dove for its finely barred pale neck to tail. The back of the
    head is pale brown blending into a buff face, crown, neck and chin. The long,
    tapered tail is brown with white-tipped outer feathers; very evident on take-off.
    Commonly known locally as the Peaceful Dove, it should not be confused with its
