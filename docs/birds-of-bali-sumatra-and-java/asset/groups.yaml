  mdcn: '


    ## 黑头白眼雀 *Zosterops atricapilla* 9.5–10cm


    印尼语名称为：Kacamata Topi-hitam


    这种小型白眼雀的背部为纯正橄榄绿色，在额头、眉纹间和眼周处变为黑色。白色的眼圈被前缘的一个黑斑截断。黑褐色的翅羽和尾羽也有橄榄绿色的边缘。腰部的橄榄绿色变得更黄，在下方，亮黄色的尾端覆羽呈条纹状延伸至下胸部，两侧由深灰色的下腹部环围。喉部和胸前区域为柠檬绿。喙呈褐色和黑色，腿为灰色。


    观赏地点：出现在苏门答腊的低地山森林中。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_160_0.png)


    ## 黄腹白眼雀 *Zosterops chloris* 11–12cm


    印尼语名称为：Kacamata Laut


    这种小型白眼雀的头顶、背部和上覆羽呈暗绿色，到下覆羽变为黄绿色。下腹部为浅黄色，喉部和尾端覆羽颜色更亮。眉纹处有一个小小的黄色斑块，黑色的眉纹延伸至完整的白色眼圈下方，一直到绿色的耳羽。尾羽和翅羽为黑色，边缘带绿色。喙上部为黑色，下部为灰色，腿为灰色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_160_1.png)


    观赏地点：出现在爪哇岛西部和努尼佩尼达岛，分布多种栖息地，从森林到红树林甚至耕园地。


    ## 栗色头音留 *Timalia pileata* 15–17cm


    以其面具状的外观和长尾巴为特征。身体主色背部为暖色橄榄褐色，下部为黄褐色并带有纤细的黑色条纹。头部更为引人，有亮亮的栗色头冠，并衬有白色额头和眉纹。下巴、喉部和颈部为白色，耳羽为白色，向颈后变为浅灰色。强壮的喙黑色，虹膜和腿为深褐色。


    观赏地点：这种音留栖息在灌木丛和沼泽地区，通常与其他音留一同出现，分布于西巴厘岛东部至巴厘岛。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_161_0.png)


    ## 条纹��雀留 *Mixornis gularis* 11–12cm


    印尼语名称为：Ciung-air Melayu


    这种小型��雀留的背部全部为栗褐色，包括尾巴。下腹部，尤其是胸部，在黄绿色的底色上有明显的纤细黑色条纹，在下腹部和泄殖处变为白色。爪哇岛的鸟类下部偏灰。头部侧面为灰色，有时带有色调，有浅色眉纹。喙为棕色，腿为灰蓝色。


    ![](img/ebd3744cf82a745248fa123f66b3e51_161_1.png)


    观赏地点：苏门答腊低地的常见鸟，成小群聚集在茂密的丛林和灌木丛中觅食，特别是竹林和阔叶林的林的次生林中。


    ## 金音留 *Cyanoderma chrysaeum* 10–12cm


    金音留有橄榄绿色的背部和淡黄色的、带有细条纹的头冠。下腹部喉部为黄褐色，在侧腹和泄殖处变为灰色。尾巴和上翅羽呈带橄榄色的灰色，翅羽边缘隐约有橄榄色包边。深褐色虹膜被深灰蓝色的眉纹皮肤环围，延伸成一条短的黑色下颏须纹。耳羽为黄灰色，喙上部为黑色，下部为黑色至粉色，腿为浅褐色。


    观赏地点：出现在苏门答腊的山林中。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_162_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_162_1.png)


    ## 月胸音留 *Cyanoderma melanothorax* 13cm


    背部棕色随亚种不同，从栗色到暗橄榄褐色不等。下腹部为白色至浅黄褐色，在腹部变为灰色或沙褐色，上胸部有一条黑色的月形纹。耳羽为橄榄灰至灰色，下方有一条黑色颊纹。眉纹为浅灰色，腿和喙为棕色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_163_0.png)


    观赏地点：出现在爪哇岛和巴厘岛的森林中。


    ## 爪哇弯嘴音留 *Pomerhinus montanus* 21cm


    印尼语名称为：Cika-kopi Jawa


    这种鸟有引人目的灰黑色头部，长长长的白色眉纹，基部有长而弯曲的黄褐色喙。喉部和胸部为白色，背部、侧腹和泄殖处为栗褐色，尾巴和翅膀为深褐色。脚为灰色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_163_1.png)


    观赏地点：出现在爪哇岛和巴厘岛。经常成对或成小群与画眉鸟在一起，在地面落叶层、穿过矮灌木丛以及较高山森林的下层树冠中觅食。


    ## 黑弯嘴音留 *Melanocichla lugubris* 25–27cm


    印尼语名称为：Cica-kopi Hitam


    这种全黑色的音留有宽硕的橙红色喙，眼睛后有一块裸露的蓝色皮肤。除了脸部、喉部和头冠的光亮区域，以及眉纹和下巴的刚羽外，它的大部分羽毛均为暗黑色。虹膜为深褐色（有时带蓝色），腿为带褐色的深灰色。幼鸟颜色较棕且较暗。


    观赏地点：出现在苏门答腊的低地山森林中。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_164_0.png)


    ## 白胸音留 *Stachyris thoracica* 18cm


    印尼语名称为：Tepus Leher-putih


    来自西爪哇的鸟全身呈深栗色羽毛，除了灰黑色的喉部和脸部以及宽白胸带。在西爪哇和东爪哇，从头顶到颈部为深灰色，白色胸带上下边缘有隐约的黑色。一小块蓝色裸露皮肤环绕着深红色虹膜；喙上部为深灰色，下部为蓝色，腿为灰色。


    出现在爪哇岛的山林。亚种 S. thoracica 分布于西爪哇，S. orientalis 分布于东爪哇。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_164_1.png)


    ## 爪哇黑头音留 *Pellorneum capistrat* 16–17cm


    印尼语名称为：Pelanduk Topi-hitam


    这种棕色音留有明显的头部特征。头冠到颈后的羽毛为黑色，与浅橙色的眉纹形成对比，下方有灰色的眼纹。喉部为白色。背部、上翅和尾巴为棕色，下腹部为浅橙色。腿为棕色，喙为灰色，虹膜为棕色。


    观赏地点：出现在爪哇岛的低地森林。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_165_0.png)


    ## 亚洲音留 *Malacoccincla abbotti* 15–17cm


    印尼语名称为：Pelanduk Asia


    与音留类似，体型小且棕色。区别在于颜色更浅且尾巴更长。背部为棕橄榄色，腰部为浅栗色。下腹部喉部为浅黄白色，胸部为浅绿绿色，腹部为棕褐色，尾端覆羽为红褐色。头部侧面为棕褐色，有浅灰色眉纹。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_166_0.png)


    观赏地点：苏门答腊低地的常见鸟，爪哇岛有少量记录，但巴厘岛缺失。通常出现在森林边缘以及灌木丛和丛林中。


    ## 森音留 *Malacoccincla sepiaria* 15–16cm


    印尼语名称为：Pelanduk semak


    这种音留有灰褐色的头冠和暖红褐色的背部，腰部和尾巴变为栗色。侧腹和泄殖处也是栗色，而喉部和腹部为白色，胸部为灰色。它有强壮的灰黑喙和红褐色虹膜。与亚洲音留的区别在于头冠更深、更灰。这种吵闹的小型音留鸣声单调且重复，通常为
    `pee-o-oel pee-o-eet`，特别在黎明和黄昏时分。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_166_1.png)


    观赏地点：该物种是当地常见的留鸟，栖息于丘陵和山地森林茂密的植被和矮灌木丛。亚种 M. s. sepiaria 分布于爪哇岛和巴厘岛，M. s. barussana
    分布于苏门答腊。


