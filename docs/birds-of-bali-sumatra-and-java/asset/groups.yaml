    # Large Frogmouth Batrachostomus auritus 39–43cm


    Indonesian name: Paruh-kodok Besar


    This is the largest of the Asian frogmouths, varie in coloration with both sexes
    very similar. The upperparts are warm brown to buff-brown with pale-barred scapulars
    and dark-bordered buff spots on the wing-covers. The outer wing and tail are brown
    with paler bars. The underparts are brown spotted with a paler belly. The bill
    is dark buff becoming brown at the tip. The legs are yellow and the iris is brown.
