    # White-flanked Sunbird Aethopypga eximia 13cm


    Indonesian name: Burung-madu Gunung


    This colourful sunbird is aptly named after the cluster of soft white feathers
    on its flanks. Apart from the rather drab olive-and-black wings, longterm blue-green
    tail and olive underparts, the male has a bright yellow rump and red throat and
    upper breast, the last crossed by a bluish-green necklace-like band, and his crown
    is iridescent purple. Except for the white flanks, the shorter-tailed female is
    dull olive, a little paler on the throat and vent.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_203_0.png)


    Where to see: Endemic to Java, occurring in mountain forests and alpine scrub.
    Particularly fond of flowering trees.


    # Little Spiderhunter Arachnothera longiroirostra 13–16cm


    Indonesian name: Pijantung Kecil


    An inconspicuous little olive-and-yellow bird with a long, curved bill, which
    is black above and grey below. The upperparts are drab olive-green


    and the underparts brilliant yellow. It can be separated from all similar species
    by its whitish throat and black moustachal stripe.


    Where to see: Common in lowland and hill forests throughout the region, and in
    some areas deep into the mountains. It inhabits gardens, plantations and logged
    forests, where it can be seen moving rapidly across open areas as it searches
    for nectar, in particular from the flowers of banana and ginger.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_203_1.png)'
  - '[PAGE 204]


    # Long-billed Spiderhunter Arachnothera robusta 21–22cm


    This long-billed and largish spiderhunter is normally a solitary bird, even to
    the extent of driving away all other spiderhunters that encroach on its territory.
    It has a habit of perching high on exposed branches and uttering its repeated
    and uninteresting call, chew-lewt, chew-lewt. In flight, it gives a simple chit-chit
    call. Its upperparts are


    and its underparts yellow, with the breast and throat streaked olive-green. Separated
    from the Spectacled Spiderhunter (Arachnothera flavigaster) and the Yellow-eared
    Spiderhunter (Arachnothera chrysogenys) by lacking yellow ear patches or an eye-ring.


    **Where to see:** Occurs at forest edges on Sumatra and Java.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_204_0.png)'
  - '[PAGE 205]


    # Eurasian Tree Sparrow Passer montanus 14–15cm


    Indonesian name: Burung-gereja Erasia


    This is perhaps the commonest of all resident species throughout the region. It
    has a chestnut crown, white face, black ear patches, pale buff throat, sides of
    face and underparts, brown back, wings mottled with black and white, and two pale
    wing-bars. The bill is bluish-black and legs are brown. Males and females appear
    alike, with juveniles looking paler.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_205_0.png)


    Where to see: Well distributed throughout the region, particularly in the lowlands,
    where it has colonised almost all areas, from cities to forest


    clearings. Commonly seen feeding out the ground, and in large flocks raiding seeding
    crops.


    # Streaked Weaver Pleceus manyar 15cm


    Indonesian name: Manyar Jambul


    Breeding males of this colonial species have a black head with golden-yellow cap,
    dark brown feather edges giving a streaked appearance, and white underparts becoming
    brownish on the flanks and black streaking on the breast. It has a black bill
    and pink legs. Females and non-breeding males have a black-streaked brown head
    and buff colonies and chin. Large nesting colonies are established in isolated
    trees near good feeding areas, the polygamous males leaving the females alone
    to weave their elaborate suspended nests.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_205_1.png)


    Where to see: Occurs on Bali and Java, more often in large roaming flocks,,


    stopping off at seeding grassland and often around rice fields and reedbeds.'
  - '[PAGE 206]


    # Baya Weaver Pleocus philippinus 15cm


    The breeding male has a bright yellow crown and nape and blackish-brown cheeks
    and throat, the upperparts being streaked and mottled dark and light rufous-brown
    and the underparts a warm buff. Females have the crown streaked and mottled brown,
    a whitish chin, a buff eyebrow, and light brown cheeks and upper breast. It has
    a black bill, brown wings and tail, and a brown iris. In females and non-breeding
    males the forehead, crown and nape to the back become brown with darker streaking.
    Juveniles are much like females but lack heavy streaking or the obvious buff supercilium.


    Where to see: Occurs throughout the region, usually in grassland and overgrown
    vegetation and often close to human habitation.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_206_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_206_1.png)'
  - '[PAGE 207]


    # Asian Golden Weaver Pleoceus hypoxanthus 15cm


    Indonesian name: Manyar Emas


    The spectacular male in breeding plumage has a black face and throat and bright
    golden-yellow head and body all the way to the rump. The feathering of the upwings
    and tail is brown with buff-and-yellow borders, and the mantle is streaked brown.
    It has pink legs, a black bill and blackish iris. Female and non-breeding males
    are similar, with dark brown, buff-streaked upperparts, including the forehead
    and crown. The wings and tail are dark brown. The broad supercilium and cheeks
    are orangey-buff. Underparts are pale orange-buff grading towards white undertail-coverts.
    Her bill is pink as are the legs.


    Where to see: Occurs in the lowlands of Sumatra and West Java, often close to
    water and near cultivation, where it relies mainly on a seed diet.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_207_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_207_1.png)'
  - '[PAGE 208]


    # # Red Avadat Amandava amandava 9.5–10cm

    Indonesian name: Pipit Benggala


    For most of the year months and females look alike, but as the breeding season
    approaches, sexually dimorphic plumage becomes very apparent. Females have greyish-brown
    uppers and greyer sides to the head, with greyish-buff underparts and blackish
    wings and tail. The rump and bill are bright red. Breeding males become crimson-red
    on the back and breast, with small white spots on breast sides and flanks and
    also on the rump. The feet are pinkish-grey. It feeds mainly on seeding grasses
    but also occasionally insects.


    Where to see: The red-bellied subspecies occurs on Java and Bali and inhabits
    grassland and marshy areas often close to cultivation.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_208_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_208_1.png)'
  - '[PAGE 209]


    # Sunda Zebra Finch Taeniopygia guttata 10cm


    Indonesian name: Pipit Zebra

    The male has grey uppers from the top of the head to the white rump, where the
    uppertal-covers are barred with black. The ear-covers are orange to dark orange
    and there is a grey eye-ring. From a lores a white, teardrop-shaped area thinly
    bordered black stands out from the grey area below the chin to the upper breast.
    There is a narrow black breast-band, below which the underparts become buffish-cream.
    The tail is black, iris dark orange and the bill red-orange. Legs pink. Females
    have much paler ear-covers.


    Where to see: Occurs throughout the Lesser Sundas, from Lombok onwards. Occasionally
    appears in the more open, lowland coastal areas of Bali.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_209_0.png)


    # Tawny-breasted Parrotfinch Erythrura hyperythra 10cm


    Indonesian name: Bondol-hijau Dada-merah


    The upperparts from the top of the head are green becoming orange-brown on the
    uppertal-covers. The forehead is black blue where it meets the green on the top
    of the head. The underparts and face are a warm buff, the legs pinkish-red, the
    bill black and the iris brown. Females are dull and juveniles paler without blue
    on the forehead.


    Where to see: Occurs on Java and occasionally on Bali. It is mainly seen in moist
    montane forests and bamboo thickets, although it occurs in open grassland and
    rice fields.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_209_1.png)'
  - '[PAGE 210]


    # # Pin-tailed Parrotfinch Erythura prasina 12–15cm

    Indonesian name: Bondol-hijau Benglis


    This species has green upperparts, the rump and long, pointed tail are red, and
    the lower belly and vent brownish-buff. The male has a red patch in the centre
    of the belly and blue throat, cheeks and forehead. It has a black bill becoming
    grey at the base, pink legs, dark brown iris and a dark grey eye-ring. A rare
    colour variation has the eye areas of plumage replaced by yellow. The female has
    a shorter tail, buff underparts, a greenish head, and a dull red tail, rump and
    undertail-coverts. Juveniles appear paler than the female.


    Where to see: Occurs on Sumatra and Java. Inhabits both montane and lowland moist
    forest, but also found in scrubland, bamboo thickets and rice plantations, often
    mixing with large flocks of munias.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_210_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_210_1.png)'
