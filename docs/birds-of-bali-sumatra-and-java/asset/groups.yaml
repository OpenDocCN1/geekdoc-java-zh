    华莱士优兜鸟下巴和头部到颈脑均为黑色，有一条橙色头纹从眼眶处沿眼睛上方延伸，在颈脑处变为白色。背部为带褐色的绿色。臀部为蓝色，黑尾巴末端带绿色。飞羽为黑色，绿色的翅羽上有一块蓝色肩斑。腹部为橙黄色，中心有一条黑色条纹延伸至红色泄殖。喙是黑色的，虹膜为棕色，脚为浅红褐色。


    **分布地：** 分布于巴厘岛尼萨佩达岛的林地和灌木丛。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_116_1.png)


    ## 棕色食蜜鸟 *Lichmera indistincta* 15cm


    印尼语名称：Isap-madu Australia


    背部为带橄榄色的深灰色，冠部呈灰色。腹部喉部为白色，胸部变为浅灰色，向尾下羽处变为浅褐色。飞羽和尾羽为灰色边缘带黄橄榄色。有一条黑色花纹纹和一圈深灰色裸皮，眼后方的皮肤较宽，环绕着深棕色的虹膜。喙是黑色的，腿为深灰色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_117_0.png)


    **分布地：** 分布于巴厘岛的红树林灌丛和森林，通常靠近人类居住区。


    ## 金腹蜜�� *Gerygone sulphurea* 9–10cm


    印尼语名称：Remetuk Laut


    这是该地区唯一的澳洲仙蜜��。背部为带褐色的灰色，腹部为亮黄色。下巴和颈部为白色，通常显示出白色的眶斑。深灰色的尾巴末端带黑色，有一列白点亚末端线。喙和腿为深灰色。幼鸟通常较浅，有浅色眼环。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_117_1.png)


    **分布地：** 遍布整个地区，分布于开阔森林、竹林、针叶灌丛、红树林甚至种植园。


    ## 小蜜�� *Pericrocotus cinnamameus* 14–16cm


    印尼语名称：Sepah Kecil


    头部、项部和上背部为灰色，臀部、泄殖和外尾羽为橙色。雌性通常较浅，腹部为灰色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_118_0.png)


    **分布地：** 分布于爪哇岛和巴厘岛。


    ## 巽答蜜�� *Pericrocotus miniatus* 20cm


    印尼语名称：Sepah Gunung


    头部、项部和背部为黑色，带红色翼带。腹部为白色，喉部为黑色。雄性有黑色翅羽，喉部和耳羽为红色。雌性通常较浅，腹部为灰色。


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_118_1.png)


    **分布地：** 分布于耕地。


    ## 火红蜜�� *Pericrocotus flammeus* 19cm


    印尼语名称：Sepah Hutan


    头部、项部和背部为黑色，带红色翼带。腹部为白色，喉部为黑色。雄性有黑色翅羽，喉部和耳羽为红色。雌性通常较浅，腹部为灰色。


    **分布地：** 分布于山地森林。


