  - '[PAGE 122]


    # Trilling Shrike-vire Pteruthius aenobarbus 12cm

    Indonesian name: Ciu Kunyit


    Males of this small shrike-babbler have olive-green tinged yellow uparts, including
    crown, ear-covers and the outer parts of the secondary wing feathers. The upperwing-covers
    are black tipped white, forming double wing-bars. The chin, throat and lower forehead
    are reddish-black with a narrow yellow band below the forecrown. It has a


    white eye-ring underlined black at the rear. The belly is bright olive-green,
    as the ear-covers, which are grey bordered and join with a grey supercilium. The
    legs are pink and the bill blue-grey. Females are duller with a buff-green throat.


    **Where to see:** Occurs in the lower montane forests of Java.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_122_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_122_1.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_122_2.png)'
  - '[PAGE 123]


    # Pied Shrike-vireo Pteruthius flaviscapis 14cm


    Indonesian name: Ciu Jawa


    This plump little bird appears to have a disproportionately large head and thick
    bill. Males have a black head with a conspicuous white eyebrow, grey mantle and
    back, and black wings and tail, with the primaries tipped white and the tertials
    tinged chestnut and yellow.


    The underparts are whitish. Females have a grey head, less distinct eyebrow, and
    greyish-green uppers.


    Where to see: Occurs on Java, more often in the canopy of more open montane forests.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_123_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_123_1.png)


    # Tenggara Whistler Pachycephala calliope 17–19cm


    Indonesian name: Kancilan Tenggara


    The male has brilliant black, white and bright yellow plumage. The yellow nape
    patch is joined by a narrow band to the breast, belly and vent, whilst the head
    is black except for a white chin and throat, leaving a narrow black band between
    the throat and belly. The upperparts are olive-green and the tail is almost black.
    Females have drab olive upperparts and dirty buff underparts, with the lower belly
    and undertail-coverts tinged yellow.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_123_2.png)


    Where to see: Occurs in East Java and Bali in hill and montane forest, impenetrable
    woodland and second growth.'
  - '[PAGE 124]


    # Dark-throated Oriole Oriolus xanthonotus 17–19cm


    Indonesian name: Kepudang Hutan


    The male has head, mantle and neck to upper breast all black. The remainder of
    the upperparts are bright yellow. The flight feathers are black fringed with pale
    yellow. The tail is black with central-coverts and tips of central feathers also
    yellow. The belly is white, heavily streaked black. The bill is a muted orange,
    legs grey and iris dark red. The female is duller with upperparts generally olive
    green and underparts white streaked black with yellow undertail-coverts.


    Where to see: Occurs in lowland forest edges of Sumatra and Java.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_124_0.png)


    # Black-naped Oriole Oriolus chinensis 23–28cm


    Indonesian name: Kepudang Kuduk-hitam


    The male is a brilliant yellow, with a distinct black stripe passing through the
    eye and across the nape. The flight feathers and tail are black, edged yellow.
    The female is much duller. juveniles show olive where adults are black, and they
    have black-streaked, whitewish underparts. It adheres to the tree canopy while
    foraging for insects and soft fruit.


    Where to see: Occurs commonly throughout the region''s lowlands and hills, furthering
    secondary and open forest, parks and gardens, mangroves and coastal scrub.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_124_1.png)'
  - '[PAGE 125]


    # Black-and-crimson Oriole Oriolus sanguineineus 21–24cm

    Indonesian name: Kepudung Melayu


    Easily identified as a medium-sized oriole, the males having all-black plumage
    except from the crimson-red upper belly and a small crimson patch on the primary
    covers. It has a distinctive pale blue-grey bill and blue-black legs. Females
    are all black, with


    the breast tinged chestnut and streaked with grey on the belly. It has a cat-like,
    mewing call.


    Where to see: Occurs on Sumatra, mainly in the treetops of broadleaf-evergreen
    and hill forests.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_125_0.png)'
  - '[PAGE 126]


    # White-breasted Woodswallow Artamus leucorynchos 18cm


    Indonesian name: Kekap Babi


    The only resident woodswallow in the region, showing similarities to true swallows
    in stance and gliding flight; easily distinguished by its stockier appearance,
    broader, triangular-shaped wings and squarish, forked tail. Its heavy bill is
    grey, and the entire upperparts except for the white rump are dark slate-grey.
    The underparts are white. Feeds on insects caught in flight.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_126_0.png)


    Where to see: A common bird of open spaces, particularly in the lowlands and hills,
    throughout the region.


    # Black-winged Flycatcher-shrike Hemipus hirundinaceus 14–15cm


    Indonesian name: Jingjing Batu


    Males’ upperparts are all black with greenish iridescence from the nape to the
    tail, apart from a white rump with slight barring on the upper rump. The underparts,
    throat and sides to the neck are white. Bill and legs are black and iris brown.
    Females and juveniles are similar but more grey-brown, with immatures looking
    more mottled.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_126_1.png)


    Where to see: Found throughout the region’s lowland forest edges.'
  - '[PAGE 127]


    # # Rufous-winged Philentoma Philentoma pyrhoptera 16–17cm


    One of the larger flycatchers, occurring in two colour forms. The male of the
    more common rufous-winged form has dull-blue uparts down to the centre of the
    back and blue underparts to the centre of the belly. The lower belly and vent
    are buff-white. The secondaries, greater covers and tail are chestnut and the
    primaries grey-brown. The legs are blue-grey and the bill is black and the iris
    red. The blue form is all dark blue-grey with paler lower belly and vent. The
    female’s uparts are brown shading into dark grey towards the top of the head.
    Underparts buffish on the breast to white at the vent.


    Where to see: Occurs on Sumatra, mainly in lowland forest.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_127_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_127_1.png)'
  - '[PAGE 128]


    # Common lora Aegithina tiphia 12–15cm


    Indonesian name: Cipoh Kacat


    The Sumatran subspecies have olive-green to bright green uppersparts, a white
    rump, and yellow underparts. The wings are black, with distinct white and yellow
    edges and two clear wing-bars. On Java and Bali the subspecies have more subdued
    coloration, the uppersparts being a paler olive-green. There is a clear yellow
    eye-ring. Both bill and feet are bluish-grey.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_128_0.png)


    Where to see: Occurs throughout the region, inhabiting open lowland forest and
    mangroves, but can frequently be found in town gardens.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_128_1.png)'
  - '[PAGE 129]


    # Green Iora Aegithina viridissima 12–15cm

    Indonesian name: Cipoh Jantung


    The upperparts of the male are dark olive-green with the underparts paler, becoming
    yellower at the vent. The tail and flight feathers are blackish, sometimes edged
    olive-yellow. The coverts are black tipped white, forming two conspicuous wing-bars.
    A narrow band of black skin surrounds the eye, encircled by an area of pale yellowish
    feathers. The iris is brown and the legs are blue-grey. The bill is black above,
    blue-grey below. Females and juveniles are yellower and brighter.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_129_0.png)


    **Where to see:** Occurs commonly in the canopy of Sumran forests.


    # Sunda Pied Fantail Rhipidura javanica 18–19cm

    Indonesian name: Kipasan Belang


    This active, small fantail displays a typical wing-drooping posture and regular
    flicking and fanning of the tail. The upperparts are dusky-black, the underparts
    white with a diagnostic black chest band, and there is a thin white eyebrow. When
    the tail is fanned, the broad bill white tips to the feathers are obvious. Both
    bill and legs are black and the iris is dark brown. Sumatran birds appear to have
    black upperparts and slightly longer tails.


    **Where to see:** An open-habitat species occurring throughout the region''s scrublands,
    open woodland, second growth, mangroves and even gardens.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_129_1.png)'
- md: "\n## White-bellied Fantail Rhipidura euryura 18cm\n\nIndonesian name: Kipasan\
    \ Bukit\n\nMales and females have very similar plumage; predominantly dull-grey\
    \ overall but below the mid-belly it is white. There is a broad white supercilium\
    \ and the outer tail feathers are tipped white. Bill and legs are black and the\
    \ iris dark brown.\n\nWhere to see: Occurs in Java's dense montane forests, often\
    \ in small groups with other species, foraging for small flying insects.\n\n![](img/ebd3744cf82a745248fa123f6c6b3e51_130_0.png)\n\
    \n## Black Drongo Dicrurus macrocercus 25–30cm\n\nIndonesian name: Srigunting\
    \ Hitam\n\nThis drongo has black plumage with slight iridescence and a long, deeply\
    \ forked tail with outer feathers which tend to turn outwards at the tips. Juveniles\
    \ show pale grey barring on the underparts. Unlike most other drongos, favours\
    \ open country and often associates with cattle, which disturb insect prey.\n\n\
    Where to see: Occurs on Java and Bali. Frequently seen in open scrub, cultivated\
    \ land and rice fields, perching on fencing, isolated branches and telephone wires\
    \ alongside roads.\n\n![](img/ebd3744cf82a745248fa123f6c6b3e51_130_1.png)\n\n\
    ## Ashy Drongo Dicrurus leucophaeus 26–29cm\n\nThis drongo has the typical long,\
    \ forked tail and upright stance. Its plumage is light blue-grey, with a tuft\
    \ of black feathers at the base of the upper mandible. The subspecies in the region\
    \ all vary in their grey colour. Sumatran birds occasionally have a white loral\
    \ spot, with those in north Sumatra being a little darker. Usually observed in\
    \ pairs waiting on exposed branches to swoop on large passing insects.\n\nWhere\
    \ to see: Occurs throughout the region. A bird of open woodland and forest edge\
    \ and clearings.\n\n![](img/ebd3744cf82a745248fa123f6c6b3e51_131_0.png)\n\n##\
    \ Crow-billed Drongo Dicrurus annectens 27–30cm\n\nIndonesian name: Srigunting\
    \ Gagak\n\nThis sturdy elegant drongo has a strong, broad bill, well adapted to\
    \ taking aerial insects in flight. The base of the bill is hidden by a layer of\
    \ short feathers. The head is black and the remainder of the upperparts glossed\
    \ black with a bluish iridescence. The underparts are black, often spotted white.\
    \ The long, blackish, forked tail has the outer feathers curved outwards. Legs\
    \ and bill are black and the iris dark red.\n\n![](img/ebd3744cf82a745248fa123f6c6b3e51_132_0.png)\n\
    \nWhere to see: Occurs as a migrant on Sumatra and West Java, frequenting wooded\
    \ lowland and hills.\n\n## Javan Spangled Drongo Dicrurus jentincki 27–29cm\n\n\
    Indonesian name: Srigunting Jawaut\n\nThis unusual drongo has a peculiarly fork-shaped\
    \ tail, the outer feathers spreading outwards and upwards almost into a lyre shape.\
    \ It also has an extraordinary crest of long, hair-like feathers from the front\
    \ of the crown, but this feature is variable. It has a very pale buff eye. The\
    \ general plumage is glossy black with an iridescent spangling, particularly on\
    \ the crown and upper breast.\n\n![](img/ebd3744cf82a745248fa123f6c6b3e51_132_1.png)\n\
    \nWhere to see: Occurs in East Java and Bali. It is common in open areas of lowland\
    \ and submontane forests.\n\n## Lesser Racket-tailed Drongo Dicrurus remifer 25–28\n\
    \nA spectacular, big, glossy-black drongo with a square-ended tail and extended\
    \ tail-streamers almost 50cm long. Each streamer feather shaft terminates in an\
    \ elongated oval web around 10cm long. A substantial tuft of short black feathers\
    \ covers the base of the upper mandible, creating a long-headed appearance. It\
    \ is smaller than the Greater Racket-tailed Drongo, has no frontal crest, and\
    \ has no fork in the tail.\n\nWhere to see: Occurs in West Java and the Barisan\
    \ Range and Batak Highlands of Sumatra. Inhabits dense montane forest and secondary\
    \ forest, especially at edges.\n\n![](img/ebd3744cf82a745248fa123f6c6b3e51_133_0.png)\n\
    \n## Greater Racket-tailed Drongo *Dicrurus paradiseus* 30cm plus 35cm tail rackets\
    \ \n\nIndonesian name: Srigunting Batu\n\nThis large, forked-tailed drongo has\
    \ beautifully extended outer tail feathers on the outer edge of the shafts terminating\
    \ in spirally twisted rackets on the shafts. Its forked tail easily separates\
    \ it from the Lesser Racket-tailed Drongo. Plumage is glossy black, and adults\
    \ often display a short frontal crest on the crown. The bill and legs are black.\n\
    \n**Where to see:** Occurs throughout the region. Usually found in pairs, often\
    \ hawking for insects in glades in swamp, primary and secondary forests and in\
    \ mangroves. It remains a common bird of the lowland forests of Sumatra.\n\n![](img/ebd3744cf82a745248fa123f6c6b3e51_134_0.png)\n\
    \n## Black-naped Monarch Hypolyca 15–17cm\n\nIndonesian name: Black-naped\n\n\
    A beautiful flycatcher with a short crest. The black-naped monarch is similar\
    \ to the white-collared monarch but has a more pronounced black patch on the nape.\
    \ It is found in lowland forests and gardens.\n\n**Where to see:**\nThe black-naped\
    \ monarch is common in the lowland forests of Sumatra and Java.\n\n## Blyth's\
    \ Drongo Dicrurus affinis 20–25cm\n\nIndonesian name: Srigunting\n\nEasily confused\
    \ with Amur's Drongo. It also occurs in two forms: Sumatran birds are darker than\
    \ those in Bali. The plumage is mostly dark-grey with a white throat and breast.\
    \ The tail is long and forked, with dark tips. The female's plumage is very similar\
    \ but with a shorter tail.\n\n**Where to see:**\nBlyth's drongo is common in the\
    \ lowland forests of Sumatra and Java.\n\n## Jay Shrike Platylophus galericulatus\
    \ 31–33cm\n\nIndonesian name: Tangkar Ongklet\n\nThis bird is relatively inconspicuous\
    \ until it starts to call, the harsh and rattling sounds revealing its presence.\
    \ Its plumage is dark grey to black, apart from a broad white patch. Easily recognised\
    \ by its tail, flat, upright crest. The bill is black and legs are dark grey.\n\
    \nWhere to see: Occurs in Java and Sumatra's lowland broadleaf and hill forests,\
    \ usually in small, noisy groups foraging through trees and bushes.\n\n## Tiger\
    \ Shrike Lanius tigrinus 17–19cm\n\nIndonesian name: Bentet Loreng\n\nThis little\
    \ shrike has a robust, bluish-black, hook-tipped bill. The adult's crown is light\
    \ grey extending well over the nape into the mantle, and it has a broad, mask-like\
    \ eye-stripe from the lores over the ear-coverts (not present on immatures). The\
    \ upperparts are russet-brown barred down to the warm brown tail. Underparts,\
    \ including chin to undertail-coverts, are white. The legs are grey-blue and iris\
    \ dark brown. Females are duller with less obvious markings.\n\nWhere to see:\
    \ Occurs in more open habitat and secondary forests throughout the region. Uncommon.\n"
  mdcn: "\n\n## 白腹长尾留 Rhipidura euryura 18cm\n\n印尼语名称：Kipasan Bukit\n\n雄性和雌性的羽毛非常相似；整体呈暗灰色为主，但腹部中部以下为白色。有宽的白色眉纹，尾羽外羽末端呈白色。喙和腿为黑色，虹膜为深褐色。\n\
    \n何处可见：分布于爪哇岛的茂密山林，通常与其他物种成小群活动，觅食小型飞行昆虫。\n\n![](img/ebd3744cf82a745248fa123f6c6b3e51_130_0.png)\n\
    \n## 黑乌尾留 Dicrurus macrocercus 25–30cm\n\n印尼语名称：Srigunting Hitam\n\n这种乌尾留拥有黑色羽毛，带有轻微的光泽，尾巴长且呈深叉形，外羽末端倾向于向外弯斜。幼鸟腹部有浅灰色的横纹。与其他大多数乌尾留不同，它偏好开阔地带，并经常与牛类在一起，利用牛扰出的昆虫捕食。\n\
    \n何处可见：分布于爪哇岛和巴厘岛。经常出现在开阔的灌丛、农田和稻田，栖息在路边的栅栏、孤立的树枝和电线线上。\n\n![](img/ebd3744cf82a745248fa123f6c6b3e51_130_1.png)\n\
    \n## 灰乌尾留 Dicrurus leucophaeus 26–29cm\n\n这种乌尾留具有典型的长叉尾和直立姿态。它的羽毛呈蓝灰色，上喙基部有一簇黑色羽毛。该地区的各亚种灰色颜色各不相同。苏门答腊的鸟类偶尔有白色额斑，而苏门答腊北部的颜色稍深。通常成对观察到，它们栖息在暴露的树枝上，等待俯捕飞过的大型昆虫。\n\
    \n何处可见：遍布整个地区。是开阔林地、森林边缘和空地的鸟类。\n\n![](img/ebd3744cf82a745248fa123f6c6b3e51_131_0.png)\n\
    \n## 鸦嘴乌尾留 Dicrurus annectens 27–30cm\n\n印尼语名称：Srigunting Gagak\n\n这种体壮而优雅的乌尾留拥有强壮、宽大的喙，适应于捕食飞行中的昆虫。喙基部被一层短羽覆盖。头部为黑色，背部其余部分为光泽黑色并带有蓝色的光泽。腹部为黑色，常有白色斑点。长而黑色的叉尾，外羽向外弯曲。腿和喙为黑色，虹膜为深红色。\n\
    \n![](img/ebd3744cf82a745248fa123f6c6b3e51_132_0.png)\n\n何处可见：作为迁徙鸟出现在苏门答腊和西爪哇，经常出没于林木区低地和丘陵。\n\
    \n## 斑纹乌尾留 Dicrurus jentincki 27–29cm\n\n印尼语名称：Srigunting Jawaut\n\n这种不寻常的乌尾留拥有奇特的叉形尾，外羽向外并向上展开，几乎呈琴形。它在冠部前方有一簇异常的由长状羽毛组成的冠，但这一特征具有变异性。它的眼睛呈极浅的肉褐色。整体羽毛为光泽黑色，带有虹彩斑点，特别是在冠部和上胸部。\n\
    \n![](img/ebd3744cf82a745248fa123f6c6b3e51_132_1.png)\n\n何处可见：分布于东爪哇和巴厘岛。在低地和亚山森林的开阔区域常见。\n\
    \n## 小凤尾乌尾留 Dicrurus remifer 25–28\n\n这是一种壮观、体型大、光黑色的乌尾留，具有方形末的尾巴和长度近50厘米的延伸流苏。每根流苏羽的羽轴末端都有一个约10厘米长的椭圆形扇膜。密集的短黑色羽毛簇覆盖在上喙基部，营造出长头的外观。它比大凤尾乌尾留小，没有额冠，尾部也不叉。\n\
    \n何处可见：分布于西爪哇、苏门答腊的巴里山脉和巴塔高地。栖息于茂密的山林和次生森林，尤其是边缘。\n\n![](img/ebd3744cf82a745248fa123f6c6b3e51_133_0.png)\n\
    \n## 大凤尾乌尾留 *Dicrurus paradiseus* 30cm以上 尾扇35cm以上 \n\n印尼语名称：Srigunting Batu\n\n\
    这种大型叉尾乌尾留拥有美丽的延伸外尾羽，在羽轴边缘处，末端呈螺旋扭曲的扇状结构。它的叉尾很容易将其与小凤尾乌尾留区分开。羽毛为光泽黑色，成年鸟通常在冠部显示出短的额冠。喙和腿为黑色。\n\
    \n**何处可见：** 遍布整个地区。通常成对出现，经常在沼泽、原始林、次生森林以及红树林的空地中捕猎昆虫。它是苏门答腊低地森林的常见鸟类。\n\n![](img/ebd3744cf82a745248fa123f6c6b3e51_134_0.png)\n\
    \n## 黑喉伯�� Hypolyca 15–17cm\n\n印尼语名称：Black-naped\n\n一种带有短冠的美丽捕鸱。黑喉伯��与白领伯鸱相似，但后脑的黑斑更明显。它发现于低地森林和花园。\n\
    \n**何处可见：**\n黑喉伯鸱在苏门答腊和爪哇的低地森林常见。\n\n## 亚洲氏乌尾留 Dicrurus affinis 20–25cm\n\n印尼语名称：Srigunting\n\
    \n容易与伯利亚乌尾留混淆。它也有两种形态：苏门答腊的鸟类比巴厘岛的颜色深。羽毛大部分为灰色，喉部和胸部为白色。尾巴长且呈叉形，末端色深。雌鸟羽毛非常相似，但尾巴较短。\n\
    \n**何处可见：**\n亚洲氏乌尾留在苏门答腊和爪哇的低地森林常见。\n\n## 冠丝伯留 Platylophus galericulatus 31–33cm\n\
    \n印尼语名称：Tangkar Ongklet\n\n这种鸟在开始鸣叫之前并不显眼，粗哑且咯哒的声音会暴露它们的行踪。它的羽毛为深灰色到黑色，除了一块宽大的白色斑外。通过其尾巴、扁平且直立的冠很容易被识别。喙为黑色，腿为深灰色。\n\
    \n何处可见：分布于爪哇和苏门答腊的低地广阔叶林和山地森林，通常以小群、嘈闹的群体活动，在树木和灌木丛中觅食。\n\n## 虎纹留伯鸱 Lanius tigrinus\
    \ 17–19cm\n\n印尼语名称：Bentet Loreng\n\n这种小伯鸱有一只强壮、蓝黑色的钩喙。成年鸟的冠部为浅灰色，一直延伸过后脑到达背部，并有一条宽的、像面具一样的眼纹，从额纹经过耳圆羽（幼鸟没有）。上部为栗褐色横纹，直到暖褐色的尾巴。下部（包括下颏到尾下覆）为白色。腿为灰蓝色，虹膜为深褐色。雌鸟颜色较暗，斑纹不明显。\n\
    \n何处可见：分布于整个地区较开阔的栖息地和次生森林。较罕见。\n\n"
