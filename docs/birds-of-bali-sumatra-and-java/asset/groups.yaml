    # # Javan Flowerpecker Dicaeum sanguinolentum 9–10cm

    Indonesian name: Cabai Gunung


    The male has a blood-red chest, becoming buff on the throat. The belly is pinky-buff
    down to the undertail-covers. A broad black stripe is superimposed down the centre
    of the breast to the belly. The uparts to the top of the head are lustrous steel-blue.
    The bill and legs are black and iris is blue-brown. Females have a bright red
    rump on an otherwise olive-brown body, tinted orangey-buff on the underparts.
    Juveniles are similar to females but show more grey on the head and a yellow tinge
    to the underparts.


    Where to see: Occurs mainly in montane and hill forest of Java and Bali but is
    occasionally found in south Sumatra.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_197_0.png)


