    a pale grey-green breast, buffish-brown belly and rufous undertail-coverts. The
    sides of the head are buffish-brown with a pale-grey specirculium.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_166_0.png)


    Where to see: Locally common in Sumatra’s lowland forests, with a few records
    for Java, but absent Bali. Usually found at forest edges and in scrub and thickets.


    # Horsfield’s Babbler Malacoccincla sepiaria 15–16cm


    Indonesian name: Pelanduk semak


    This babbler has a dark grey-brown crown and warm russet-brown upperparts, becoming
    chestnut on the rump and tail. The flanks and vent are also chestnut, while the
    throat and belly are white and the breast grey. It has a heavy grey-and-black
    bill and red-brown iris. Separated from Abbott’s Babbler by its darker and greyer
    crown. This noisy little babbler has a monotonous and repetitive call, pee-o-oel
    pee-o-eet, given particularly at dawn and dusk.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_166_1.png)


    Where to see: This is a locally common resident throughout the region in dense
    undergrowth low thickets of hill and submontane forests. Subspecies M. s. sepiaria
    occurs on Java and Bali and M. s. barussana on Sumatra.'
- md: '

    ## Large Wren-Babbler Turdinus macrodactyl 19–21cm


    Indonesian name: Berencet Besar


    The uppersparts of this large babbler are dark brown streaked black and light
    brown at the crown, becoming lighter and warmer over the upper-coverts and on
    the rump. The underparts are whitish flecked brown on the throat and grey-brown
    flecked whitish on the upper belly, forming a vague breast-band in Sumatran birds
    but missing in Javan. Javan birds are generally darker. A patch of bluish skin
    surrounds the eye. Ear-coverts dark brown. The bill is blackish and legs are dark
    brown.


    **Where to see:** Occurs in lower primary forests and dense woodlands of Sumatra
    and Java.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_167_0.png)


    ## Sunda Fulvetta Alcippe brunneicauda 14.5–15cm


    Indonesian name: Wergan Coklat


    This rather plain-coloured forest-dwelling babbler has a brown crown on a grey
    head. Mantle, wings and tail are brown, appearing more rufous on the wings, rump
    and upper-coverts; underparts are buffish-white. The bill is grey-brown, as are
    the legs and iris. Sexes are similar but juveniles appear paler with a yellow-brown
    bill.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_167_1.png)


    **Where to see:** Occurs in Sumatra’s lowland forests, where it prefers the tree
    canopy.


    ## Javan Fulvetta Alcippe pyrrhoptera 14–15cm


    Indonesian name: Wergan Jawa


    This bird is dull chestnut-coloured from the crown over its back and wing-coverts,
    becoming warmer chestnut on the ramp and tail. The crown is faintly striped with
    dark lateral stripes extending to the nape, bordered by a vague blackish-brown
    supercilium. The ear-coverts are light chestnut with fine white streaking. The
    throat and underparts are buff with browner flanks. The bill is blackish and legs
    are pale yellow-brown.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_168_0.png)


    Where to see: Occurs in lower montane forests of West and Central Java.


    ## Sunda Laughingthrush Garrulax palliatus 25cm


    Indonesian name: Poksai Mantel


    **Where to see:** Occurs in low montane forest of Sumatra. Now rare.


    The head of this laughingthrush is dull grey down to the mantle, across the shoulders
    and to the lower belly; the belly becomes rufous-grey to the vent. The bristled
    lores, chin and face are black. The uppersparts, including the wings, are rufescent-black;
    as is the tail. The iris is warm grey-brown surrounded by a large silver-blue
    patch of bare skin. The legs are dark brown and the bill is grey-black. Juveniles
    are duller and browner.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_168_1.png)


    ## Spectacled Laughingrush Garrulax mitratus 22–24cm


    Indonesian name: Poksai Genting


    This darkish grey laughingrush has a chestnut crown and supercilium, a broad white
    eye-ring and bright orange-yellow bill and legs. It also has a chestnut vent and
    a white patch on the outer primaries. The bristly feathering to the lores, face
    and chin gives the impression of a black mask. A few feathers on the forecrown
    are whitish, the grey tail is tipped black and the iris is red-brown. Juveniles
    are duller and browner.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_169_0.png)


    Where to see: A lower montane forest species occurring on Sumatra.


    ## Long-tailed Sibia Heterophasia picaoides 28–35cm


    Indonesian name: Sibia Ekor-panjang


    A long-tailed grey babbler with white tips to its tail feathers and an obvious
    white wing patch. The head is grey and upperparts are tinged greyish-brown. Underparts
    are paler grey tinged brown on the belly. The vaguely downcurved bill is black,
    the iris is red-brown and legs are grey.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_169_1.png)


    Where to see: Lives at the edges of broadleaved evergreen forest and lower montane
    forests on Sumatra, feeding on various insects, fruit, seeds and even flower buds.


    ## Silver-eared Mesia Leiothrix argentauris 15–17cm


    Indonesian name: Mesia Telinga-perak


    The male is distinctively marked, with bright silver ear-coverts that contrast
    with a black crown and face, and a small yellow-orange tuft of feathers at the
    base of the bright yellow bill. The chin, neck and fore-collar are dark orange
    blending into an olive mantle and paler orange breast. The tail is blackish fringed
    yellow, the legs and iris yellow. Females are less bright.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_170_0.png)


    Where to see: Occurs on Sumatra but is becoming rare in its preferred montane
    habitat because of trapping.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_170_1.png)


    ## Velvet-fronted Nuthatch Sitta frontalis 12–13cm


    Indonesian name: Munguk Bebledu


    Velvet-fronted Nuthatch has a red bill and reddish feet, dirty pinkish-white underparts
    and whitish throat. The uppersparts are mainly violet-blue, with black-edged feathers
    in the tail and primaries, and the forehead is velvety-black. A very active and
    attractive bird which, unlike other nuthches in the region, is well-adapted to
    creeping up and down tree trunks of insects and spiders in Sumatra and Java. Usually
    seen in pairs but occasionally in small parties, moving erratically through the
    understorey.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_171_0.png)


    Where to see: Common in lowland and hill forests and plantations of Sumatra


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_171_1.png)


    ## Blue Nuthatch Sitta azurea 13cm


    Indonesian name: Munguk Loreng


    In shady forest it appears to have black upperparts, but in fact its back, wings
    and tail are shiny dark blue. Only the crown, nape and sides of the face are black.
    The throat and breast are bluish-white. East Javan birds have a bluish-black lower
    belly and vent, but these are black on West Javan and Sumatran birds. It has a
    yellow-grey bill and grey feet. This nuthatch typically forages along branches
    and tree trunks, leveraging off fragments of bark to get grubs and insects.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_172_0.png)


    **Where to see:** Occurs in the Barisan Range of Sumatra and on Java, where it
    is common in lower montane forests.


    ## Asian Glossy Starling Aphonis panayensis 20cm


    Indonesian name: Perling Kumbang


    Adults are all black and can be separated from the Short-tailed Starling *(Aphonis
    minor)* by being larger and having a green iridescentcence. It has dark red eyes
    and black legs.


    On Bali they are smaller than the birds in Java and Sumatra. Juveniles have a
    yellowish iris, black-streaked whitish underparts, and upperparts streaked black
    and brown.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_172_1.png)


    **Where to see:** A common lowland bird occurring throughout the region''s open
    areas near forest and secondary vegetation and coastal scrub, also attracted to
    coconut plantations, cultivated areas and gardens, and frequently in towns and
    cities


    ## Grosbeak Myna Scissirostrum dubium 20cm


    Indonesian name: Jalak Tunggir-merah


    This small starling is easily recognised by its predominantly grey plumage, the
    solid ‘grosbeak-type’ orange-yellow bill and the bright red, elongated undertail-coverts,
    some with shiny tips. The legs are also orange-yellow and the iris is black-brown.


    Where to see: Occurs on Java. Prefers tree canopy of lowland forest edges, where
    it often congregates in large flocks, feeding on fruit, seeds and insects.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_173_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_173_1.png)


    ## Common Hill Myna Gracula religiosa 27–35cm


    Indonesian name: Tiong Emas


    Black overall with a purple sheen and orange wattles both behind and below the
    eye and has a white wing-bar. It has yellow feet and a stout orange bill. Another
    species under great pressure from habitat loss and trapping for the pet trade,
    this bird is particularly in demand for its ability to mimic other birds, as well
    as for its enormous repertoire of whistles and calls.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_174_0.png)


    Where to see: Although it occasionally congregates in small flocks, it is more
    likely to be seen in pairs in tall trees. Once a common bird of lowland forest
    edge, it has become rare on Bali and Java but remains in reasonable numbers on
    Sumatra.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_174_1.png)

