  - '[PAGE 182]


    # Asian Brown Flycatcher Muscicaapa dauurica 12–14cm


    Indonesian name: Sikatan Bubik


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_182_0.png)


    This species of submontane forest and forest edges can frequently be found in
    plantations, open forest and even gardens. It hunts aerial insects from exposed
    perches, often shaking its tail on arrival back at the perch. It is greyish-brown
    above and whitish below, becoming grey-brown on the flanks and the sides of the
    breast, and has a pale eye-ring. The black bill has a yellow base to the lower
    mandible.


    Where to see: A winter migrant to the region from north-east Asia, but some may
    be resident in north Sumatra. Occurs in woodland, forest and scrubland, sometimes
    close to cultivation.


    # White-rumped Shama Copysychus malabaricus 21–27cm


    Indonesian name: Kucica Hutan


    The male has a very long tail, about half its total length, with dull central
    feathers and white outers, which habitually flicks on landing. Its head, neck,
    back and wings


    are black with a blue sheen, its lower underparts are deep orange, and it has
    a conspicuous white patch on the rump. Another beautiful songster in decline,
    due to trapping for the pet trade.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_182_1.png)


    Where to see: Occurs on Sumatra and Java, spending a lot of time foraging on the
    ground in dense undergrowth. Common on Sumatra in denser forest, but far less
    so on Java.'
  - '[PAGE 183]


    # # Oriental Magpie-robin Copsychus saularis 20cm


    Sumatran birds have black wings and central tail, belly and vent, and a broad
    white patch across the wing-coverts, whereas those from East Java and Bali are
    all black except for the white wing-covert patch. Females are much duller, with
    the black plumage replaced by grey. Juveniles have similar but mottled plumage.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_183_0.png)


    **Where to see:** Occurs throughout the region in lowland mangroves and forests
    to town gardens. Once trapping for the pet trade has caused a serious decline.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_183_1.png)'
  - '[PAGE 184]


    # Pale Blue Jungle-flycatcher *Cyornis unicolor* 16–18cm

    Indonesian name: Sikatan-rimba Biru-muda


    Males of this mid-sized, longish-tailed flycatcher are predominantly blue, whereas
    females are grey-brown. The male has black lores and a pale-blue forehead grading
    into a short supercilium. The throat is pale blue grading to grey on the belly
    and white on the lower belly and undertailcoverts. The female has grey-brown upperparts
    and buff underparts.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_184_0.png)


    **Where to see:** Occurs in the lower dense and moist primary forests of Sumatra
    and Java.


    # Javan Jungle-flycatcher *Cyornis banyumas* 14–15cm

    Indonesian name: Sikatan-rimba Jawa


    Males have dark blue upperparts with iridescence on the forehead, eyebrow and
    shoulder. The chin, lores and a thin line around the eye are black, while the
    throat and breast are rufous-orange, grading into white on the lower belly and
    vent. The bill is black fading to dull purple at the base, the legs vary from
    dark brown to pale pink and the iris is dark brown. Females have brown upperparts
    with an off-white eye-ring, and underparts similar to the male’s but paler.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_184_1.png)


    **Where to see:** Occurs on Java, where it favours low undergrowth and bamboo
    thickets and the edges of glades in high montane forests.'
  - '[PAGE 185]


    # Mangrove Jungle-flycatcher Cyornis rufigastra 15cm


    Characteristic blue uppers and orange-red underparts. The bill is black and the
    legs blue-grey, although the female is paler and has a whitish chin and a white
    local patch. the many subspecies vary, typically in strength of colour of uppers
    and underparts. It is most likely to be confused with the Hill Blue Flycatcher
    (Cyornis banyumas), but that has a pale blue forehead and blackish chin.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_185_0.png)


    Where to see: Occurs in mangrove forest on Sumatra and West to Central Java, also
    in Baluran National Park in East Java and Bali Barat National Park in Bali.


    # Sumatran Niltava Niltava sumatrana 15cm


    Indonesian name: Nilatava Sumatera


    The male''s dark blue underparts are iridescent on the forecrown, rump and upper
    coverts and tail and dark blue over the back and wing-coverts. The flight feathers
    are blue-black, edged dark blue. There is a thin iridescent blue neckline and
    patch on the shoulder. The lores and forecrown, chin, throat and ear-coverts are
    blue-black. The underparts from the neck to the undoubt-coverts are bright orange.
    The legs are blue-grey and the bill black. Females are grey from crown to nape,
    the remainder of the uppers and sides of the face being warm brown. The underparts
    are grey at the belly, becoming whitish at the vent.


    Where to see: Occurs in montane forest in the Barisan Range of W. Sumatra.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_185_1.png)'
  - '[PAGE 186]


    # Blue-and-white Flycatcher Cyanoptila cyanomelanana 16–17cm

    Indonesian name: Sikatan Biru-putih


    The male has mainly rich blue uparts, over the crown, the uppermost-coverts and
    along the edges of the tail and flight feathers; the greater part of the flight
    feathers being black. The lores, face, ear-coverts, chin and upper breast are
    shiny black. The remainder of the uparts, including the undertail-coverts, are
    white. The legs are purplish-black. The bill is black and the iris is dark brown.


    The female’s uparts, including the crown, are grey-brown, the ear-coverts finely
    streaked buff and the wings dark brown with russet edges. Tail feathers are also
    russet-brown. Buff with a warmer tint to the breast.


    Where to see: Overwinters in the hill and montane forests of Sumatra and Java.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_186_0.png)'
  - '[PAGE 187]


    # Indigo Warbling-flycatcher Eumyias indigo 14cm


    This species is mainly a deep indigo-blue, especially on the uppersparts and breast,
    the blue becoming dense blue-black on the throat and face towards the bill base.
    The forehead is bluish-white, as is the supercilium. The belly is grey-blue, becoming
    white and then buff on the vent. The legs and bill are black. Sexes are very similar
    but juveniles have dull, lightly barred uppersparts and buff-spotted underparts.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_187_0.png)


    Where to see: A relatively common resident of montane and submontane forests on
    Java, but less so on Sumatra.


    # Verditer Warbling-flycatcher Eumyias thalassinus 15–17


    This is a large blue flycatcher with an upright stance. The male’s plumage is
    a fairly uniform turquoise-blue, with brighter forehead and throat and white fringing
    to the undertail-covers giving a scaled appearance. The dark grey area on the
    face does not reach the black lores. The feet and bill are blackish and iris is
    dark brown. Females look duller and greener and juveniles are a mottled brown
    tinged with green.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_187_1.png)


    Where to see: Occurs on Sumatra, where it prefers open forest edges, choosing
    exposed perches from which it can launch its attacks on passing airborne insects.'
  - '[PAGE 188]


    # Javan Whistling-thrush Myophonus glaucinus 25–26cm


    Indonesian name: Ciung-batu Java


    The male has blackish underparts and dark blue uparts with an often hidden, brighter
    blue area on the shoulder. The plumage is more uniform than that of other whistling
    thrushes, lacking spangles. It has a blackish bill and legs. The female is browner
    but duller, with juveniles a bit darker and marked with elongate whitish spots.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_188_0.png)


    Where to see: Occurs on Java and Bali, keeping to the lower levels in montane
    forest. Often secretively hides away in dark corners and crevices but is occasionally
    seen foraging on the ground.


    # Blue Whistling-thrush Myophonus caeruleus 29–35cm


    Indonesian name: Ciung-batu Siul


    A largish blue-black thrush having a moderate purplish sheen and sparsely fleck
    and spangled white on the wing-covers. The contrasting yellow bill is often marked
    with black, particularly


    on Sumatran birds. Legs are black. It has a high-pitched screeching alarm, screech-chit-chit-chit-chit,
    and a loud whistling song often incorporating imitations of other birds'' songs.
    A


    ground feeder, taking insects, invertebrates and small fruits.


    Where to see: Uncommon on Java and Sumatra but absent from Bali. Generally found
    in denser lowland and hill forests beside rivers and among exposed limestone rock
    formations.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_188_1.png)'
