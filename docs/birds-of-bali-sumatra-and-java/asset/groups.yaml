  - '[PAGE 77]


    # Black-crowned Night Heron Nycticorax nycticorax 60cm


    This stocky-bodied heron has a distinctive adult plumage of black back and crown,
    white neck and underparts, and grey wings and tail, with two long white plumes
    emerging from the nape. Both the bill and the neck are comparatively short. In
    breeding plumage, the normally dirty yellow legs become red. Females and juveniles
    are streaked and mottled brown.


    **Where to see:** Occurs throughout the region, often near freshwater wetlands,
    rice fields, swamps and mangroves. Also on mudflats.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_77_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_77_1.png)'
  - '[PAGE 78]


    # Striated Heron Butorides striata 35–48cm


    Indonesian name: Kokokan Laut


    Adults are mainly dark grey, with a very dark greenish crest crown and long greenish
    feathers. They have a pale buff neck and facial markings. Immatures appear stockier
    and are brown with a streaked breast and mottled upperparts.


    Where to see: Common throughout the region''s coastal wetlands, it prefers to
    remain close to cover, but is occasionally seen on rocky shorelines and exposed
    reefs.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_78_0.png)


    # Malayan Night Heron Gorsachius melanoloph 47–50cm


    Indonesian name: Kowak Melayu


    This solidly built heron has chestnut upperparts finely barred and speckled across
    the back and wings, and a pale chestnut neck and head with black trailing crest.
    Its underparts are white and flecked heavily with chestnut, buff and black. The
    throat is white, streaked along the median line. It often (but not always) has
    bright blue lores. It has olive-green legs, and the short, stubby bill is olive-brown
    with yellow on the lower mandible. Nocturnal and very timid.


    Where to see: Occurs as a migrant throughout the region, preferring dense vegetation,
    particularly bamboo and reeds surrounding inland marshes


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_78_1.png)'
  - '[PAGE 79]


    # Glossy Ibis Plegadis falcinellus 55–66cm


    Indonesian name: Ibis Rokoroko


    The only ibis in the region with all-dark plumage, it has blackish-chestnut coloration
    with green, purple and bronze iridescences. Immatures are dark brown, with buff
    streaking on the head and neck. Legs are dark brown to olive-grey, and the long,
    decurved bill is brownish-grey.


    Where to see: Occurs on Java and Bali, usually in small groups in rice fields,
    marshland and lake fringes. It often associates with egrets and herons, both at
    night-time roosts and at breeding colonies.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_79_0.png)'
  - '[PAGE 80]


    # # Black-headed Ibis Threskiornis melancephalus 65–75cm

    Indonesian name: Ibis Cucukbesi


    The almost all-white body is offset by a black head and neck and a strong, black
    bill. The long legs are also black. The decorativeed feathers on the tail are
    pale grey, and the few fine decorative neck feathers are white.


    **Where to see:** Occurs rarely in Sumatra and north Java, in freshwater marshes
    and by lakes and rivers, flooded grasslands and rice fields, taking amphibians,
    crustaceans and small fish. Occasionally associated with grazing cattle.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_80_0.png)


    # # Black-winged Kite Elanus caeruleus 30–37cm

    Indonesian name: Elang Tikus


    Named for its black shoulder patches and that it often hovers like a kite before
    dropping on its prey. When in flight, this elegant raptor might be mistaken for
    a gull. Its grey upperparts and white underparts, along with long black primaries
    and squarish tail, can be confusing. It has red eyes encircled by black.


    **Where to see:** Occurs throughout the region, preferring open countryside and
    in dry areas of sparse woodland, at woodland edges, as well as in cultivated areas.
    Occasionally seen perched on exposed tree branches and telephone poles.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_80_1.png)'
- md: '

    ## Black Baza Aviceda leuphotes 28–35


    Indonesian name: Baza Hitam


    Identified as a small, thickset, black hawk with a pointed crest with white and
    reddish-brown patches. The underparts have blackish-brown bars across the upper
    breast becoming reddish towards the vent. The neck is black, the iris red-brown
    and legs bluish grey-black. In flight the primaries appear white, tipped black
    and the secondaries grey-brown. Juveniles are very similar but duller and browner.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_81_0.png)


    **Where to see:** Occurs as a winter visitor to Sumatra and Java.


    ## Javan Hawk Eagle Nisaetus bartelsi 55–60


    Indonesian name: Elang Jawa


    Indonesia’s national bird, easily identified by its conspicuous white-tipped dark
    crest. It has a black moustachal stripe and crown, throat and underparts streaked
    black on neck and brown on belly, white-feathered wings. The sides of the head
    and nape are a rich russet-brown, blending into dark brown upperparts. The long
    tail is brown with black barring. The iris and legs are yellow and the cere dark
    grey.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_81_1.png)


    **Where to see:** Endemic to Java. Found only in primary forest and mountain wooded
    areas in West Java, and on the east coast at Meru Betiri National Park. A last
    stronghold is Gunung Halimun National Park.


    ## Kites, hawks and eagles


    ## Crested Serpent Eagle Spilornis cheela 50–70cm

    Indonesian name: Elang-ular Bido


    Dark-coloured, the upperparts being a greyish chocolate-brown and the underparts
    similar, with shoulders, belly and flanks spotted white. It has a raised patch
    of white-spotted feathers on the top and back of the head, giving the appearance
    of a crest. In flight, the broad white tail-band and the band of white on the
    underwing-coverts are significant. It has yellow feet and a greyish-brown bill.
    Often detected by its loud, shrill call, cwe-chee, cwe-chee, cwe-cheemee.


    **Where to:** Occurs throughout the region. Often seen over woodland and forests.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_82_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_82_1.png)


    ## Besra Tachysypiza virgata 25–35cm

    Indonesian name: Elang-alap Besra


    Males have uniform dark grey-brown upperparts with a dark greyish-brown head,
    and a white throat with a black mesial stripe. The breast and belly are rufous-grey,
    heavily streaked with black and white in the centre of the upper breast. The lower
    belly is barred white, leading into white undertail-coverts. The pale-tipped tail
    shows three wide black bars. Females are generally browner. Sumatran birds (A.
    v. vanbemmeli) are more rufous. The bill is black, the cere grey and the iris
    yellow to orange-red.


    **Where to see:** Occurs throughout the region but confined mainly to mountain
    and foothill woodland.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_83_0.png)


    ## Eastern Barn Owl Tyto javanica 33–50cm


    Indonesian name: Serak Jawa


    The Barn Owl is widespread throughout the world and familiar to many. It has an
    obvious heart-shaped white facial disc and underparts that vary from white to
    brown with darker speckling. The head and upperparts colour is also variable from
    light brown to grey. Recognised in flight by its generally pale colour, long wings,
    short, squarish tail and feet that do not extend beyond the tail.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_84_0.png)


    **Where to see:** Occurs throughout the region, albeit sparsely. It is nocturnal
    in Indonesia and absent from most of the mountainous or heavily forested areas.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_84_1.png)


    ## Oriental Bay Owl Phodius badius 23–29cm


    Indonesian name: Serak Bukit


    This small owl has rather blackish eyes set back in a deep fawn-coloured facial
    disc bordered by a thin dark brown line of feathers. The short, buff ear-tufts
    appear as an extension to the facial disc. The uppersparts are from chestnut to
    fawn with small buff spots and underparts buff-pink with small black spots. The
    short wings are barred black, the bill is buff and feet buff-brown. Females are
    a little larger and juveniles paler and duller.


    **Where to see:** Occurs on Sumatra and Java, mainly in lowland forests and sometimes
    approaching mangroves and cultivated areas.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_85_0.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_85_1.png)


    ## Collared Scops Owl Otus lepus 20–24cm

    Indonesian name: Celecuk


    Identification is not easy, as the species occurs in several colour forms. It
    can be reddish-brown to grey-brown, with uppersparts mottled with buff; the underparts
    are paler and streaked black. It has a pale sandy-buff collar and longish buff-tufts.
    Bill and feet are pale yellow. The regular soft whoop call of the male and female
    are often heard alternately.


    **Where to see:** Occurs throughout the region, almost everywhere below 500m.
    Often seen hunting for insects and small rodents in towns.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_85_2.png)


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_85_3.png)


    ## Buffy Fish Owl Ketupa ketupa 40–44cm

    Indonesian name: Beluk Ketupa


    This owl has an amusing appearance, with bright yellow eyes and conspicuous ear-tufts.
    Its upperparts are brown, streaked black and buff, and the underparts are bright
    rufous-buff with narrow streaks. It has whitish eyebrows, a grey bill and yellow
    feet.


    **Where to see:** A nocturnal species occurring throughout the region and remaining
    hidden among trees during the day. At night, it ventures outside the forest into
    parks, rice fields. Always close to water, on which it is dependent for its diet
    of frogs and other aquatic life.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_86_0.png)


    ## Javan Owlet Glaucidium castanopterum 23–25cm

    Indonesian name: Beluk Jawa


    This owlet has a warm brown face barred pale orange and white with no apparent
    facial disc. The head and shoulders are brown barred pale orange and upperparts
    are warm chestnut. The wings and tail are barred yellow and brown, and the underparts,
    including breast, belly and flanks, are pale buff boldly streaked chestnut. The
    edges of the scapulars are white forming a line bordering the wing. The iris is
    yellow and the bill and feet are green-yellow.


    **Where to see:** Occurs in primary and secondary forests on Java and Bali.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_87_0.png)


    ## Brown Boobook Ninox scututata 27–33cm

    Indonesian name: Pungguk Coklat


    Adults and immatures are very similar, having grey-brown heads and dark upperparts.
    The underparts are white, heavily marked with heart-shaped brown spots, and the
    barred tail has a grey-brown subterminal. There is a white facial patch above
    the greenish-black bill, and the eyes are orange-yellow.


    **Where to see:** Occurs throughout the region, commonly in primary and secondary
    forest and often in pairs.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_87_1.png)


    ## Javan Trogon Hapactes reinwardii 34cm

    Indonesian name: Luntur Jawa


    Similar to but larger than the Sumatran Trogon (Hapactes mackloti), this bird
    has blue-green, sometimes turquoise upperparts that extend from the nape to the
    rump; below, the tail is rich steel-blue. The wing-coverts are finely barred yellow
    and black, and the throat and belly are yellow separated by a broad, pale grey-green
    breast-band. The crown is bright green and a broad blue orbital ring surrounds
    a black iris. The bill is bright red and the feet orange.


    **Where to see:** Occurs mostly in the submontane forest of West Java.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_88_0.png)


    ## Orange-breasted Trogon Hapactes oreskios 25–27cm

    Indonesian name: Luntur Harimau


    This trogon has a striking orange breast, fading to yellow at the vent, but above
    the breast becomes dull olive-grey turning olive-yellow over the head. The dark
    eye has a blue orbital ring. The upperparts are reddish-brown becoming paler at
    the rump, the undertail feathers are white and black and the wing-coverts are
    black finely lined white. Sumatran males have a more yellow upper breast, yellow-grey
    in the female.


    **Where to see:** Occurs in lowland and subtontane forest of Java and Sumatra.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_89_0.png)


    ## Great Hornbill Buceros bicornis 95–105cm

    Indonesian name: Rangkong Papan


    The enormous yellow bill and casque, black face, yellow-stained white neck and
    upper breast, and black subterminal bar on a white tail separate it from other
    hornbills of the region. The back, lower belly and wing-coverts are black, and
    a white wing-bar are often stained with yellow. They have prominent ''eyelashes’,
    similar to other hornbills. Males are larger than females and have a red iris
    and a black orbital ring of bare skin. The female’s iris is white and the bare
    skin is pinkish-red.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_89_1.png)


    **Where to see:** An uncommon species, confined to lowland and subtontane primary
    evergreen forests of Sumatra.

