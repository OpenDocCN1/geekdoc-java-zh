    ## Green Peafowl Pavo muticus males: 180–250cm females: 100–110cm Indonesian name:
    Merak Hijau


    This spectacular pheasant is predominantly iridescent green, males having conspicuous
    ocelli tail feathers and a vertical crest on the head. Females are similar but
    dull with shorter legs and paler underparts. Juveniles appear similar but have
    a few white feathers on the face and neck. During the breeding season their mewing
    and loud calls are readily heard, and the male’s striking display with tail fanned
    is unmistakable. Where to see: A few relict populations exist on Java, with Baluran
    National Park being the last stronghold.


    ## Blue-breasted Quail Synoicus chinensis 12–15cm Indonesian name: Puyuh


    The male of this species is distinctive, but females are easily confused with
    Buttonquails. The upperparts are dark brown with lighter streaks, paler than the
    male. Males have a distinct black-and-white bib, with the breast, sides of the
    head and undertail-coverts bright-blue; the female''s underparts are brown streaked
    buff, with darker brown across the chest and a whitish throat patch. The newly
    hatched young are tiny, almost like bumblebees. Where to see: Occurs sparsely
    through the region''s lowland grasslands, savannas and marshes, sometimes in cultivated
    areas.


    ## Red Junglefowl Gallus gallus: 65–78cm females: 41–46cm Indonesian name: Ayam-hutan
    Merah


    Males are recognised by their serrated red comb, face and wattles, their long
    bronze hackles and long, arched tail feathers. They have a chestnut to golden
    mantle and greenish-green breast and primary coverts. Females are much duller;
    various shades of brown with black streaking on the neck. The bill is buff and
    the legs slate-grey. Separating wild birds from feral ones is not easy, but purely
    wild birds have tail and wing colour all black in males, mottled brown in females,
    and orange hackles.


    ## Green Junglefowl Gallus varius males: 65–75cm females: 40–46cm Indonesian name:
    Ayam-hutan Hijau


    This large blackish-green fowl is similar to the Red Junglefowl with a serrated
    purplish-red comb. Males have red wattles and bare facial skin around the eye,
    a glossy green mantle and nape and iridescent green hackles edged yellow, with
    upperparts and wing-covers orange and yellow; the rest of the plumage is black.
    Females and young juveniles have a less showy plumage with brown upperparts mottled
    with buff, buffish underparts mottled with black and a white throat. Where to
    see: Occucrs close to the coast, also inland forest, preferring more open, grassy
    areas and often associating with grazing animals.


    ## Sunda Collared Dove Streptopelia bitorquata 30–33cm Indonesian name: Dereduk
    Jawa


    Not confused with the similar Eurasian Collared Dove (Streptelia decao). Generally
    appears as a pinkish-fawn bird with a broad black half-collar fringed with white.
    The crown and nape are pale bluish-grey tinged pink and the forehead very pale
    grey. The upperparts and wing-covers are slightly darker pink. Underparts are
    pale pink fading to white at the vent and undertail-coverts. It has a pinkish-brown
    bill, pink legs and a brownish-orange iris. Where to see: Occurs mainly in the
    lowlands of Bali and Java, often in open areas but also close to human habitation.
    Frequently seen foraging on the ground.


    ## Eastern Spotted Dove Spilopelia chinensis 30cm Indonesian name: Tekukur Biasa


    This very familiar dove has a generally pinkish-brown plumage with slightly darker
    flight feathers and dark-mottled back. On each side of the neck it has an obvious
    white-spotted black patch. The outer tail feathers are broadly tipped white, this
    being conspicuous in flight. It has red feet and a black bill. Where to see: Occurs
    throughout the region, from city gardens to rural cultivation, open country and
    forest edges in lowland areas, often foraging on the ground.


    ## Barred Cuckoo Dove Macropygia 37–41cm Indonesian name: Loreng


    Distinguished from other doves by its size and heavily barred upperparts, this
    dove is rather dull; the underparts are brown, heavily barred with black. The
    crown and nape are greyish-brown with chestnut barring. Males have green iridescence
    on the tail. The bill is buff and red feet. Where to see: Submontane forest throughout
    the region.


    ## Cuckoo Dove Macropygia emiliana 30cm Indonesian name: Buaki


    Smaller than the Barred Cuckoo, it has a white barring on the breast. The upperparts
    are light brown with black barring, the female''s underparts are paler chestnut.
    Males have green iridescence on the nape and the tail feathers are black. The
    underparts are chestnut barred with black. The bill is buff and the legs. Where
    to see: Found in hill forests of Java, where forest edges and clearings.


    ## Little Cuckoo Dove Macropygia ruficeps 29cm Indonesian name: Kouran


    Smaller than other cuckoo doves, it has a black barring on the breast. The upperparts
    are light brown with iridescence, especially on the underparts. Females are duller
    with less iridescence. They have red-tipped bill. Where to see: Common in hill
    and montane forests. Often in large flocks, at edges and feeding.


    ## Asian Emerald Dove Chalcophaps indica 23–27cm Indonesian name: Delukan


    This attractive ground dove has iridescent emerald-green wing-coverts and mantle,
    with a dark grey back crossed by two conspicuous white bars. The flight feathers
    and short tail are black. The underparts, neck and sides of the head are dark
    pink. Males have a white forehead, with the crown and nape tinged grey. Females
    are duller. The bill is bright red, the legs and feet dull pink and eyes brown.
    Where to see: Occurs throughout the region, preferring the seclusion of thick
    forests, woodland edge and mangroves.


    ## Barred Dove Geopolia maugeus 22–26cm Indonesian name: Perkutut Loreng


    The Barred Dove is often confused with the Zebra Dove being similar in appearance
    but with a distinctly different song. Also, it has stronger black and white barring
    stretching across the breast and onto the flanks, a white belly and chestnut underwing-coverts,
    bare yellow skin around the eye and a pale yellow iris. Where to see: Occurs from
    Bali eastwards, inhabiting dry open scrub and grassland, cultivated land and woodland
    edges in lowland areas and even cities.

