    ## 巽他黄尾缘八留鸟 Pycnonotus analis 20–21cm


    印尼语名称：Merbah Cerukcuk


    正如其名，它有亮黄色的尾缘，但其他羽毛相对暗淡。背部和尾部为褐色，下部为白色。冠部为深褐色，眉纹为白色。眉心为黑色。它有粉灰色的脚和黑色的喙。


    **在哪里看到：** 常见于整个地区，偏好更开阔的栖息地。特别被引种地、种植园、花园和公园吸引，甚至是城市中。


