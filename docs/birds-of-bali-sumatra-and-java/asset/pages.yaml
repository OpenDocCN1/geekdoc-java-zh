  md: '# # Wandering Whistling Duck Dendrocygna arcuata 40–45cm

    Indonesian name: Belibis Kembang


    Plumage is generally a deep chestnut-brown on the back, tail and breast with white
    undertailcovers rump, and a line of black-edged white feathers showing the folded
    wing. The head and neck are a paler brown, and there is a dark brown elongated
    cap running down the back of the neck. The legs are blackish-brown and bill black.
    This bird emits a series of high-pitched whistling and twittering calls in flight.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_16_0.png)


    **Where to see:** Rivers, freshwater lakes, wet marshland, coastal wetlands and
    mangrove throughout the region.


