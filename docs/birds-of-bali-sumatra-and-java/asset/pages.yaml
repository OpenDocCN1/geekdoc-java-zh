  md: '# HOW TO USE THIS BOOK


    Photographs depict the bird in a commonly seen form where possible, either male
    or female, and variations are briefly described in the text. The order and naming
    of the 322 species generally follows the International Ornithological Congress
    (IOC) taxonomy adopted by Avibase – The World Bird Database and the Cornell Laboratory
    of Ornithology current terminology. While other checklists exist, the process
    of revision based on more recent scientific knowledge will continue. At the time
    of writing, a concerted effort is taking place with the International Ornithologists’
    Union (IOU) forming the Working Group on Avian Checklists (WGAC) with a view to
    produce and maintain an open-access global checklist of bird species that will
    unify taxonomies. It must therefore be expected that not only will the scientific
    names provide more reliable. The names used in this book follow the latest scientific
    data available as contained in the second edition of Eaton, J.A., van Balen, B.,
    Brickle, N.W. and Rheandt, F.E. Birds of the Indonesian Archipelago: Greater Sundas
    and Wallacea (2021).


    Each species description includes an English name and its scientific name and
    a formal Indonesian name where known. As a size guide, the overall length of the
    species from the tip of the bill to the end of the tail is provided. The remaining
    description follows no particular order but provides most of the clues necessary
    for a fairly reliable identification. Only for a few species has any attempt made
    to describe calls and song, as it is felt that written lack without the experience
    of hearing the actual sound. Nevertheless, the value of sound must not be underestimated.
    In many cases, it can be the only determining factor in successful species identification.
    Much of the description is necessarily brief and written in a semi-technical language
    adopted by most bird books, but for easy understanding many of the technical terms
    used by ornithologists are explained in the glossary on page 218.


    # A note on the photos


    All images show the adult plumage, unless stated otherwise. Please refer to the
    key below for further information:


    +   - male

    - female

    imm. – immature

    juv. – juvenile

    var. – variant

    br. – breeding

    non br. – non-breeding'
