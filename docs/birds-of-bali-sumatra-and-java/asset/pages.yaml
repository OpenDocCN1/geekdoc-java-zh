  md: '# KEY BIRDWATCHING SITES


    # BALI


    # Bali Barat National Park


    Situated at the western tip of Bali, Bali Barat is a mix of dry and moist forests
    with coastal scrub, savanna and mangroves. It is the only place to find native
    wild, endemic Bali Mynas. Many other interesting species reside there, among Banded
    Pitta, Green Junglefowl, Pink-headed Fruit Dove, Black-backed Fruit Dove, Shiny
    Whistling Thrush, and Sunda Bush Warbler.


    Dusky Broadbills, Jay Shrike and Red-bearded Bee-eater.


    # Kerinci-Seblat National Park


    The park includes the dominating peak of Mt Kerinci and the Kerinci valley wetlands.
    The best place to see Sumatra montane birds, as well as several of the endemics
    such as Schneider''s, Sumatra Peacock Pheasant and Sumatra Cochoa. Also recorded
    there are Salvador''s Pheasant, Silver-feathered Mesia, Chestnut-capped Laughingthrush,
    White-throated Fantail, Sunda Bush Warbler and Golden Babbler.


    # Nusa Penida Island


    Nusa Penida Island, while strictly speaking in Bali province, is just east of
    the Wallace Line. Here you may see Lemon-bellied White-eye and Wallace''s Elegant
    Pitta.


