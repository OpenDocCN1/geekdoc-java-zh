  md: '# Garganey Spatula querquula 37–41 cm


    Indonesian name: Itik Jurai


    Males in the region are usually in eclipse plumage looking like females. They
    have brown-barred feathers and a contrasting head pattern, with pale eyebrow,
    dark eye-stripe, and plain whitish throat. Neck and breast are reddish-brown flecked
    white. It has a green underwing speculum with a white border above below. The
    elongated scapular are striped grey, dark green, black and white, and the upper-coverts
    are light blue-grey. The flanks are finely patterned grey and the belly is white.


    The bill is blackish-grey, the eyes reddish-brown and legs and feet greyish.


    Where to see: Occurs throughout the region, but scarce; on open marshland, freshwater
    lakes, rice fields, coastal saltmarshes, mudflats and onshore waters.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_17_0.png)


    # Pacific Black Duck Anas superciliosa 47–60cm


    Indonesian name: Itik Alis


    The name ‘black duck’ is a misnomer, as the bird’s body plumage looks black only
    in flight when contrasting with the conspicuous white underwing plumage.


    It is actually dark brown, with the head striped black and white. The speculum
    is iridescent green and purple, the legs yellow-brown and the bill grey.


    ![](img/ebd3744cf82a745248fa123f6c6b3e51_17_1.png)


    Where to see: Occurs throughout the region but is less frequent on Sumatra. It
    is a surface-feeding duck which dabbles in shallow water. Confined mainly to mountain
    lakes of East Java and Bali, but often found feeding on marshes and grassland.'
