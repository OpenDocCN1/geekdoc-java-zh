    \n# Kotlin program to convert decimal to binary\n\nExample:\n\nInput:\nDecimal\
    \ number = 12\n\nRecursive division:\n\n| Number | Quotient | Remainder |\n| 12\
    \ | 6 | 0 |\n| 6 | 3 | 0 |\n| 3 | 1 | 1 |\n| 1 | 0 | 1 |\n\nRead the remainders\
    \ in reverse order\n1100 is the binary for 12.\n\n# PROGRAM\n\n```kotlin\nimport\
    \ java.util.*\n\n/* function to convert decimal number into Binary */\nfun getBinary(decimalNumber:\
    \ Int): String {\n    var tempNumber = decimalNumber\n    val binaryStr = StringBuilder()\n\
