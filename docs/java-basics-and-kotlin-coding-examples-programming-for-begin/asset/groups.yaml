    \  }\n}\n```\n\n输出:\n\n5\n\n# Java 赋值运算符\n\nJava 中常用的运算符之一是赋值运算符。它用于将右侧的值分配给左侧的操作数。\n\
    \n# 示例\n\n```java\nclass OperatorExample{\npublic static void main(String args[]){\n\
    int a=10;\nint b=20;\na+=4;//a=a+4 (a=10+4)\nb-=4;//b=b-4 (b=20-4)\nSystem.out.println(a);\n\
    System.out.println(b);\n}\n}\n```\n\n# 输出:\n\n14\n\n16\n\n# Java 赋值运算符示例：加 short\
