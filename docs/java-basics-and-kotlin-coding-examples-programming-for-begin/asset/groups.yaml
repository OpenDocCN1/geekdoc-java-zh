    environment. | JRE stands for Java Runtime Environment. It provides the set of
    tools only to execute our program. | JVM stands for Java Virtual Machine. It is
    responsible for the program to execute line by line.

    | JDK is the superset of the JRE. It contains JRE with Java compiler, debugger,
    and core classes. | JRE contains a set of libraries and other files that JVM uses
    at runtime. | It contains JIT (Just in Time Compiler), interpreter, and set of
    APIs. JIT optimizes bytecode to machine specific language compilation by compiling
    similar bytecodes. |'
