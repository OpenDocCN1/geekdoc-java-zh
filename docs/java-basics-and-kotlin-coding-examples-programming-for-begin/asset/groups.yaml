- md: "\n| null | This keyword indicates that a reference does not refer to anything.\
    \ It removes the garbage value. |\n| package | It declares a Java package that\
    \ includes the classes. |\n| private | It is an access modifier that indicates\
    \ that a method or variable may be accessed only in the class where it was declared.\
    \ |\n| protected | It is an access modifier that can be accessed within the package\
    \ and outside the package but through inheritance only. It can't be applied to\
    \ the class. |\n| public | It is an access modifier that is used to indicate that\
    \ an item can be accessed anywhere. It has the widest scope among other modifiers.\
    \ |\n| return | This keyword is used to return from a method when its execution\
    \ is complete. |\n| short | This keyword declares a variable that can hold a 16-bit\
    \ integer. |\n| static | This keyword indicates that a variable or method is a\
    \ class method. It is used for memory management mainly. |\n| strictfp | It is\
    \ used to restrict the floating-point calculations to ensure the portability of\
    \ the code. |\n| super | This keyword is a reference variable that is used to\
    \ refer to the parent class object. It can also be used to invoke an immediate\
    \ parent class method. |\n| switch | It contains a switch statement which executes\
    \ code based on test value. It tests the equality of a variable against multiple\
    \ values. |\n| synchronized | This keyword is used to specify the critical sections\
    \ or methods in a multithreaded code. |\n| this | It refers to the current object\
    \ in a method or constructor. |\n| throw | It explicitly throws an exception.\
    \ The \"throw\" keyword is used to throw a custom exception, followed by an instance.\
    \ |\n| throws | It declares an exception. A checked exception can be piped with\
    \ throws. |\n| transient | This keyword is used in serialization. If we define\
    \ any data member as transient, then it can't be serialized. |\n| try | It starts\
    \ a block of code that will be tested for exceptions. It must be followed by either\
    \ catch or finally block. |\n| void | The void keyword specifies that a method\
    \ does not have a return value. |\n| volatile | This keyword is used to indicate\
    \ that a variable may change asynchronously. |\n| while | It starts a loop that\
    \ iterates a part of the program number of times. |\n\n# Data Types in Java\n\n\
    The different sizes and values that can be stored in the variable are described\
    \ by data types. In Java, there are two kinds of data types:\n\n**Primitive data\
    \ types**: Boolean, char, byte, short, int, long, float, and double are examples\
    \ of primitive data types.\n\n**Non-primitive data types**: Classes, Interfaces,\
    \ and Arrays are examples of non-primitive data forms.\n\n![](img/be4ff60adbb55f4a0f24c7da99a5899a_41_0.png)\n\
    \n# Java Primitive Data Types\n\nPrimitive data types are the building blocks\
    \ of data manipulation in the Java programming language. These are the most basic\
    \ data types in the Java programming language.\n\n- boolean data type\n- byte\
    \ data type\n- char data type\n- short data type\n- int data type\n- long data\
    \ type\n- float data type\n- double data type\n\n| Data Type | Default Value |\
    \ Default size |\n|---|---|---|\n| boolean | false | 1 bit |\n| char | \"\\u0000\"\
    \ | 2 byte |\n| byte | 0 | 1 byte |\n| short | 0 | 2 byte |\n| int | 0 | 4 byte\
    \ |\n| long | 0L | 8 byte |\n| float | 0.0f | 4 byte |\n| double | 0.0d | 8 byte\
    \ |\n\n# Boolean Data Type\n\nOnly two possible values are stored in the Boolean\
    \ data type: true and false. Simple flags that track true/false conditions are\
    \ stored in this data form.\n\nThe Boolean data type defines a single bit of data,\
    \ but its \"size\" cannot be precisely specified.\n\n# EXAMPLE :\n\nBoolean one\
    \ = false\n\n# Byte Data Type\n\nThe primitive data form byte is an example of\
    \ this. It's an 8-bit two-s complement signed integer. It has a value range of\
    \ -128 to 127 (inclusive).\n\nIt has a minimum of -128 and a maximum of 127. It\
    \ has a value of 0 by default.\n\nThe byte data form is used to conserve memory\
    \ in wide arrays where space is at a premium.\n\nSince a byte is four times smaller\
    \ than an integer, it saves space. It can also be substituted for the \"int\"\
    \ data sort.\n\n# Example,\n\nbyte a = 10 and\nbyte b = -20.\n\n# Short Data Type\n\
    \nA 16-bit signed two's complement integer is the short data form. It has a value\
    \ range of -32,768 to 32,767 (inclusive). It has a minimum of -32,768 and a maximum\
    \ of 32,767. It has a value of 0 by default.\n\nThe short data type, like the\
    \ byte data type, can be used to save memory. A short data form is twice the size\
    \ of an integer.\n\n# EXAMPLE\n\nshort s = 10000,\nshort r = -5000\n\n# Int Data\
    \ Type\n\nA 32-bit signed two's complement integer is represented by the int data\
    \ form.\n\nIts range of values is -2,147,483,648 (-2^31-1) to 2,147,483,647 (2^31-1)\
    \ (inclusive).\n\nIt has a minimum of -2,147,483,648 and a limit of 2,147,483,647.\n\
    \nIt has a value of 0 by default.\n\nIf there is a memory limit, the int data\
    \ type is commonly used as the default data type for integral values.\n\n# EXAMPLE\n\
    \n```\nint a = 100000,\nint b = -200000\n```\n\n# Long Data Type\n\nA 64-bit two's\
    \ complement integer is the long data form. It has a value range of -9,223,372,036,854,775,808\
    \ (-2^63-1) to 9,223,372,036,854,775,807 (2^63-1) (inclusive).\n\nIts minimum\
    \ and maximum values are -9,223,372,036,854,775,808 and 9,223,372,036,854,775,807.\n\
    \nIt has a value of 0 by default. When you need a wider set of values than int\
    \ can provide, you can use the long data form.\n\n# EXAMPLE\n\n```\nlong a = 100000L,\n\
    long b = -200000L\n```\n\n# Float Data Type\n\nThe float data form is a 32-bit\
    \ IEEE 754 floating point with single precision.\n\nIt has an infinite value set.\
    \ If you need to conserve memory in huge arrays of floating point numbers, use\
    \ a float (rather than a double).\n\nFor precise values, such as money, the float\
    \ data form can never be used. 0.0F is the default value.\n\n# EXAMPLE\n\n```\n\
    float f1 = 234.5f\n```\n\n# Double Data Type\n\nA double data form is a 64-bit\
    \ IEEE 754 floating point with double precision.\n\nIt has an infinite value set.\
    \ Like float, the double data form is used for decimal values. For precise values,\
    \ such as money, the double data form can never be used. 0.0d is the default value.\n\
    \n# EXAMPLE\n\n```\ndouble d1 = 12.3\n```\n\n# Char Data Type\n\nA 16-bit Unicode\
    \ character is represented by the char data type. It has a range of '\\u0000'\
    \ to '\\ffff' (65,535 inclusive). Characters are stored using the char data form.\n\
    \n# EXAMPLE\n\n```\nchar letterA = 'A'\n```\n\n# Java Variables\n\nA variable\
    \ is a container that contains the value during the execution of a Java program.\
    \ A data type is allocated to a variable.\n\nLocal, instance, and static variables\
    \ are the three types of variables. The variable is the name of a memory-reserved\
    \ field. To put it another way, it's the name of a memory spot. It is made up\
    \ of the words \"vari\" + \"able,\" which means that its meaning can be modified.\n\
    \n```\nint data=50;//Here data is variable\n```\n\n# Types of Variables\n\n- local\
    \ variable\n- instance variable\n- static variable\n\n# 1) Local Variable\n\n\
    A local variable is a variable declared within the method's body. This variable\
    \ can only be used within that method, and the other methods in the class are\
    \ unaware that it exists. The keyword \"static\" cannot be used to describe a\
    \ local variable.\n\n# 2) Instance Variable\n\nAn instance variable is a variable\
    \ declared within the class but outside the method body. It hasn't been declared\
    \ static. It's called an instance variable because its value is exclusive to each\
