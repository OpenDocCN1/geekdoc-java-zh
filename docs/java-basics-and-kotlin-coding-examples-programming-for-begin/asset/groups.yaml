    | abstract | It is used to declare an abstract class that provides the implementation
    of the interface. |

    | boolean | It is used to declare a variable as a boolean type. It only holds
    true and false values. |

    | break | It breaks the current flow of the code (loop or switch statement). |

    | byte | This keyword declares a variable that can hold 8-bit data values. |'
