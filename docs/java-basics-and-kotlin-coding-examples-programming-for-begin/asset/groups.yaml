    # JAVA INTRODUCTION


    The Java programming language was designed with portability, stability, and simplicity
    in mind.


    Despite this, Java has a range of features that make it a common programming language.


    We structure our application as a set of different types of objects that contain
    both data and actions, which is known as object-oriented programming.


    Java is a WORA (Write Once, Run Anywhere) programming language because of this.


    Java is architecture-neutral because it has no implementation-dependent aspects,
    making the compiled code executable on a wide range of processors using JRE.


    # Evolution of Java:


    | Version | Release Date | Features |

    | --- | --- | --- |

    | JDK Beta | 1995 | — |

    | JDK 1.0 | January 1996 | This is the first stable version. |

    | JDK 1.1 | February 1997 | In this version, added many new library elements,
    redefined the way of handling events, and reconfigured most of the libraries of
    1.0 and deprecated some features defined by 1.0. Added inner class, JavaBeans,
    JDBC, RMI, JIT (Just In time) compiler. |

    | J2SE 1.2 | December 1998 | Added support for many features, such as Swing and
    Collection Framework. The methods suspend(), resume() and stop() of Thread class
    were deprecated. |

    | J2SE 1.3 | May 2000 | A very small improvement, as it just improved the development
    environment. |


    | J2SE 1.4 | February 2002 | It added some upgrades such as the new keyword assert,
    chained exception and a channel-based I/O subsystem. Also added some feature to
    the collection framework and the Networking classes. |

    | J2SE 5.0 | September 2004 | The significant new features added to this version
    are - Generics, Annotation, Autoboxing and Autoboxing, for-each, Enumeration,
    variable-length argument, Static import, Formatted I/O, Concurrency utilities.
    |

    | Java SE 6 | December 2006 | In this version the API libraries and several packages
    enhanced and offered improvements to the run time. It supports JDBC 4.0. |

    | Java SE 7 | July 2011 | Added JVM support for dynamic language, String in the
    switch, Automatic resource management in try-statement, support for underscore
    in integers, binary integer literals etc... |

    | Java SE 8 | March 2014 | Added Date and time API, Repeating annotation, JavaFX.
    |

    | Java SE 9 | September 2017 | Added Java platform module system update, jshell,
    XML Catalog, link, and the JavaDB was removed from JDK. |

    | Java SE 10 | March 2018 | Added features are local variable type interface,
    Application class data sharing, Garbage collector interface, etc... |

    | Java SE 11 | September 2018 | Feature added: Dynamic class file loader, HTTP
    client, and Transport layer security. JavaFX, Java EE, and CORBA modules have
    been removed from JDK. |

    | Java SE 12 | March 2019 | Added Microbenchmark Suite, JVM Constant API, One
    AArch64 Port, Default CDS Archives etc. |


    # C++ vs Java


    | C++ | Java | C |

    | --- | --- | --- |

    | C++ is a general programming language created by Bjarne Stroustrup as an extension
    of c language | Java is class-based, object-based, and designed to have as few
    dependencies as possible. | C is considered all programming language father, and
    It is general-purpose, procedural programming language supporting structured programming,
    lexical variable scope, and recursion. |


    | Developer | | |

    | --- | --- | --- |

    | | C++ programming language was invented by Bjarne Stroustrup in 1979 | Java
    language was invented by James Gosling in 1991 | C language was invented by Dennis
    Ritchie in 1972 |


    | Programming | | |

    | --- | --- | --- |

    | | In C++ the programming paradigm follows the | The programming supports pure
    | C is entirely a procedural |


    | Paradigm | Object-Oriented programming | Object-Oriented Programming | language.
    |

    |---|---|---|---|

    | Origin | The C++ programming language is based upon C language. | Java is based
    on both C++ and the C language. | C language is based on assembly level language.
    |

    | Translator | C++ follows compiler to translate the code into binary-level code.
    | Java uses an interpreter to translate the code in binary codes. | C also uses
    a compiler to translate the code into binary level code. |

    | Platform dependency | C++ programming language is platform dependent. | Java
    is platform-independent the code written on one platform can run on any platform.
    | C is also platform dependent. |

    | Code Execution | C++ supports direct code execution. | Java follows JVM Which
    Is Java Virtual Machine. Code will be sent to JVM for translation and code execution.
    | C language follows direct code execution. |

    | | Java also | C language | |


    | Approach | C++ supports the bottom-up approach. | supports bottom up approach.
    | supports top down approach. |

    |---|---|---|---|

    | File generation | It generates a .exe file after compiling the program. | It
    generates a .class file after compilation of a program | It also creates a .exe
    file. |

    | Pre-processor directives | C++ follows #header and #define to include the pre-processor
    directives. | Java uses the import option to import the packages it needs to compile
    the program it is running | C being the predecessor of CPP it also follows #header
    and #define |

    | Key words | C++ language has 63 defined keywords. | Java language has 50 defined
    keywords. | C language has the support for 52 keywords. |

    | Data Types | Data types like union and structure are supported in C++ programming.
    | Structure and Union are not supported in Java. | Data types like union and structure
    are supported in C language also. |

    | In inheritance | Cpp and Java both support inheritance | But Java does not support
    multiple inheritances. To support Java has to use | Does not support inheritance
    |


    | | | | |

    | --- | --- | --- | --- |

    | | | | |

    | Overloading | C++ support overloading through polymorphism. | Operator overloading
    is not supported by Java. | Overloading is not supported by C language. |

    | Pointers | C++ supports pointers. | Java does not support pointers. | C supports
    pointers. |

    | Memory Allocation | Cpp uses the new keyword to allocate memory to a program
    and to delete it uses “delete” keyword | Java uses the new keyword to allocate
    memory and uses a unique feature called garbage collector to remove unwanted memory
    space. | When comes to C language we call calloc(), malloc() and realloc() function
    to allocate the memory to a particular program and we use the free() function
    if we wanted to delete or free the memory space from the individual application.
    |

    | Exception Handling | C++ supports exception | Java also supports | C does not
    support |

