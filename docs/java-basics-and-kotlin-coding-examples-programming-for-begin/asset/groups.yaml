    short a = 10 ;\nshort b = 10 ;\n//a+=b;//a=a+b 内部处理没问题\na=a+b; // 编译错误，因为现在 10+10=20\
    \ 是 int 类型\nSystem.out.println(a);\n}\n}\n```\n\n# 输出:\n\nCompile time error\n\
    \n# 类型转换后:\n\n```java\nclass OperatorExample{\n  public static void main(String\
