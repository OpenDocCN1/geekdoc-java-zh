    (no need in IDE). It converts the code to bytecode, which is platform-agnostic.


    When we compile our software, it produces a.class file that contains the bytecode
    for the equivalent java file.


    And that bytecode can be run on any device that has the JRE enabled.


    The procedure is outlined below.


