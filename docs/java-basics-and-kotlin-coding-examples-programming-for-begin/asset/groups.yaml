    \nfalse\n\n10\n\nfalse\n\n11\n\n# Java OR 运算符示例：逻辑 || 与位或 |\n\n如果第一个条件为真，逻辑运算符\
    \ || 运算符将不会验证第二个条件。只有当第一个条件为假时，它才会测试第二个条件。\n\n无论第一个条件为真还是为假，位或运算符 | 总是会测试两个条件。\n\
    \n```java\nclass OperatorExample{\n    public static void main(String args[]){\n\
    \        int a=10;\n        int b=5;\n        int c=20;\n        System.out.println(a>b||a<c);//true\
