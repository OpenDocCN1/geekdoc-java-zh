    * static variable


    # 1) Local Variable


    A local variable is a variable declared within the method''s body.


    This variable can only be used within that method, and the other methods in the
    class are unaware that it exists.


    The keyword "static" cannot be used to describe a local variable.


    # 2) Instance Variable


    An instance variable is a variable declared within the class but outside the method
    body.


    It hasn''t been declared static.


    It''s called an instance variable because its value is exclusive to each instance
    and isn''t shared across them.


    # 3) Static variable


    A static variable is one that has been declared as such.


    It''s not possible for it to be local.


    You may make a single copy of a static variable and share it across all of the
    class''s instances.


