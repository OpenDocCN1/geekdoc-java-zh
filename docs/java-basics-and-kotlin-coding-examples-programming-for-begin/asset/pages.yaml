  md: '# Int Data Type


    A 32-bit signed two''s complement integer is represented by the int data form.


    Its range of values is - 2,147,483,648 (-231 -1) to 2,147,483,647 (231 -1).

    (inclusive).


    It has a minimum of 2,147,483,648 and a limit of 2,147,483,647.


    It has a value of 0 by default.


    If there is a memory limit, the int data type is commonly used as the default

    data type for integral values.


    # EXAMPLE


    ```

    int a = 100000,

    int b = -200000

    ```


    # Long Data Type


    A 64-bit two''s complement integer is the long data form. It has a value range

    of -9,223,372,036,854,775,808(-263 -1) to 9,223,372,036,854,775,807(263

    -1). (inclusive).


    Its minimum and maximum values are 9,223,372,036,854,775,808 and

    9,223,372,036,854,775,807.


    It has a value of 0 by default. When you need a wider set of values than int

    can provide, you can use the long data form.


    # EXAMPLE


    ```

    long a = 100000L,

    long b = -200000L

    ```'
