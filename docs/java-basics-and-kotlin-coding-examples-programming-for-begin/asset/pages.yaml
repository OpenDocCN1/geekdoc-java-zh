  md: '# Float Data Type


    The float data form is a 32-bit IEEE 754 floating point with single precision.


    It has an infinite value set. If you need to conserve memory in huge arrays of
    floating point numbers, use a float (rather than a double).


    For precise values, such as money, the float data form can never be used. 0.0F
    is the default value.


    # EXAMPLE


    ```

    float f1 = 234.5f

    ```


    # Double Data Type


    A double data form is a 64-bit IEEE 754 floating point with double precision.


    It has an infinite value set. Like float, the double data form is commonly used
    for decimal values.


    For precise values, such as money, the double data form can never be used. 0.0d
    is the default value.


    # EXAMPLE


    ```

    double d1 = 12.3

    ```


    # Char Data Type


    A single 16-bit Unicode character is represented by the char data type. It has
    a meaning range of ''u0000'' (or 0) to ''ffff'' (or 65,535 inclusive).


    Characters are stored using the char data form.


    # EXAMPLE'
