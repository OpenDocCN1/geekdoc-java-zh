  md: '# Byte Data Type


    The primitive data form byte is an example of this. It''s an 8-bit two-s complement
    signed integer. It has a value range of -128 to 127. (inclusive).


    It has a minimum of -128 and a maximum of 127. It has a value of 0 by default.


    The byte data form is used to conserve memory in wide arrays where space is at
    a premium.


    Since a byte is four times smaller than an integer, it saves space. It can also
    be substituted for the "int" data sort.


    # Example,


    byte a = 10 and


    byte b = -20.


    # Short Data Type


    A 16-bit signed two''s complement integer is the short data form. It has a value
    range of -32,768 to 32,767. (inclusive). It has a minimum of -32,768 and a maximum
    of 32,767. It has a value of 0 by default.


    The short data type, like the byte data type, can be used to save memory. A short
    data form is twice the size of an integer.


    # EXAMPLE


    short s = 10000,


    short r = -5000'
