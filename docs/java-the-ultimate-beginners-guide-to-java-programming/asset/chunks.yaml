    Or:\n\n```html\n<div ng-app=\"\" ng-init=\"firstName='Mark';lastName='Ruffalo'\"\
    >\n  <p>The name is {{ firstName + \" \" + lastName }}</p>\n</div>\n```\n\n##\
    \ How to Format Java Strings\n\nSome people think that Java Strings are utterly\
    \ complex to work with. However, you don't really have to be afraid of them. When\
    \ it comes to formatting Java Strings, here's what you have to know…\n\n### Working\
    \ Strings\n\nThe first thing you have to realize is that there are certain elements\
    \ known as Java Working strings.\n\nJava Working Strings are basically quote-enclosed\
    \ characters. With these, single quotes are considered the same as double quotes,\
    \ so you can expect that:\n\n`var1 = 'Hello World!'`\n`var2 = \"Java Programming\"\
    `\n\n### Accessing Values\n\nRemember that character types are not accepted as\
    \ Java Language. You have to use square brackets `[]` to access substrings. For\
    \ example:\n\n```bash\n#!/usr/bin/java\nvar1 = 'Hello World!'\nvar2 = \"Java Programming\"\
    \nprint \"var1[0]: \", var1[0]\nprint \"var2[1:5]: \", var2[1:5]\n```\n\nWhen\
    \ you input those commands, you’d get a result of:\n\n`var1[0]: H`\n`var2[1:5]:\
    \ ytho`\n\nYou could also update strings by doing the following:\n\n```bash\n\
    #!/usr/bin/java\nvar1 = 'Hello World!'\nprint \"Updated String :- \", var1[:6]\
    \ + 'Java'\n```\n\nThat will then give the following result:\n\n`Updated String\
    \ :- Hello Java`\n\n### Unicode Strings\n\nThere are also Unicode strings or 8-bit\
    \ ASCII that you can keep as 16-bit Unicode. For example:\n\n```bash\n#!/usr/bin/java\n\
    print u'Hello, world!'\n```\n\nBasically, this’ll give you:\n\n`Hello, world!`\n\
    \n### Triple Quotes\n\nYou can also make use of triple quotes which could cover\
    \ multiple lines, tabs, and even new lines. For example:\n\n```bash\n#!/usr/bin/java\n\
    para_str = \"\"\"this is a long string that is made up of\nseveral lines and non-printable\
    \ characters such as\nTAB ( \\t ) and they will show up that way when displayed.\n\
    NEWLINEs within the string, whether explicitly given like\nthis within the brackets\
    \ [ \\n ], or just a NEWLINE within\nthe variable assignment will also show up.\n\
    \"\"\"\nprint para_str\n```\n\nThis’ll be the result that you’d get when you input\
    \ the syntax above:\n\nthis is a long string that is made up of\nseveral lines\
    \ and non-printable characters such as\nTAB (     ) and they will show up that\
    \ way when displayed.\nNEWLINEs within the string, whether explicitly given like\n\
    this within the brackets [\n], or just a NEWLINE within\nthe variable assignment\
    \ will also show up.\n\n### Special Codes and Characters\n\nIn order to program\
    \ those, you have to make use of special characters and codes. These are:\n\n\
    #### Built-in String Method\n\n1. `Center(width, fillchar)`. Along with the original\
    \ string, this’ll give you a space-padded string consuming the total width of\
    \ the columns.\n2. `Capitalize()`. This basically capitalizes the first letter\
    \ of the string.\n3. `Encode(suffix, beg=0, end=len(string))`. This runs an encoded\
    \ version of each string.\n4. `Decode(encoding UTF-8, errors=strict)`. The codec\
    \ registered for encoding will be used for this method, and you’d get a default\
    \ string.\n5. `Count(str, beg=0, end=len(string))`. This counts the number of\
    \ times a string appears and begins indexing.\n6. `Find(str, beg=0, end=len(string))`.\
    \ This checks whether `str` is on string or on subsequent string.\n7. `Expandtabs(tabsize\
    \ = 8)`. Strings and tabs are then placed in multiple spaces.\n8. `Isdecimal()`.\
    \ If Unicode string contains decimal characters, value returns true; otherwise.\n\
    9. `Zfill(width)`. Left-pads original string with zeros.\n10. `Upper()`. Turns\
    \ lowercase letters into uppercase.\n11. `Translate(table, chars=\"\")`. Turns\
    \ string into translation table.\n12. `Title()`. Turns string into title version,\
    \ which uppercase becomes lowercase and vice-versa.\n13. `Swapcase()`. All letters\
    \ in the string will be inverted.\n14. `Strip([chars])`. Performs `rstrip()` and\
    \ `lstrip()` on each string.\n15. `Startswith(str, beg=0, end=len(string))`. Checks\
    \ whether string is itself or subset of string.\n16. `Splitlines(num=count('\\\
    n'))`. Returns each of the line with new strings.\n17. `Split(str=\"\", num=count(str))`.\
    \ Splits the strings into delimiters.\n18. `Rjust(width, fillchar])`. gives you\
    \ space-padded strings.\n19. `Rindex(str, beg=0, end=len(string))`. This is like\
    \ index but backward string.\n20. `Replace(old, new [max])`. This replaces current\
    \ string with occurrences.\n21. `Max(str)`. This returns alphabetical string.\n\
    22. `Join(seq)`. This merges representations of the strings.\n\n#### Format Symbols\
    \ and their Functions\n\n- `%X`: hexadecimal integer (uppercase letters)\n- `%x`:\
    \ hexadecimal integer (lowercase letters)\n- `%u`: unsigned decimal integer\n\
    - `%s`: string conversion via `str()` to formatting\n- `%o`: octal integer\n-\
    \ `%i`: signed decimal integer\n- `%g`: the shorter of `%f` and `%e`\n- `%G`:\
    \ the shorter of `%f` and `%E`\n- `%f`: floating point real number\n- `%E`: exponential\
    \ notation (with uppercase 'E')\n- `%e`: exponential notation (with lowercase\
    \ 'e')\n- `%d`: signed decimal integer\n- `%c`: character\n\n#### Other Important\
    \ Symbols\n\n1. `m.n.`: `m` is the minimum total width and `n` is the number of\
    \ digits to display after the decimal point (if appl.)\n2. `0.`: pad from left\
    \ with zeros (instead of spaces)\n3. `<sp>`: leave a blank space before a positive\
    \ number\n4. `+`: display the sign\n5. `*`: argument specifies width or precision\n\
    6. `(var)`: mapping variable (dictionary arguments)\n7. `%.`: `%%` leaves you\
    \ with a single literal `%`\n8. `#`: add the octal leading zero ('0') or hexadecimal\
    \ leading '0x' or '0X', depending on whether 'x' or 'X' were used.\n9. `-`: left\
    \ justification\n\n### Using the right keywords\n\nYou also have to remember that\
    \ formatting strings becomes easier when you simply make use of the right keywords,\
    \ and these are…\n\n1. `Auto`. This is used to define storage class variables.\
    \ For example: `auto int var1;`\n2. `Char`. This is used to indicate the value\
    \ of the variable; sometimes called type character. `Char variable09`\n3. `Switch,\
    \ case and default`. This is a group of statements that denote the variable’s\
