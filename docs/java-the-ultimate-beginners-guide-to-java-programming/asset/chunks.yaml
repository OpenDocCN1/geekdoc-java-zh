  trans: "\n\n```javascript\nRscope.name = \"thehungergames\";\n});\n```\n\n```html\n\
    # 根机制\n\n还有一种所谓的根机制（Rooting Mechanism，也称为 `$rootscope`）。它使用了 `ng-app` 指令并适用于整个应用程序——所以你可以说它是教程中非常重要的部分。它同样使用了当前使用的范围（scope）。\n\
    \n例如：\n\n```html\n<body ng-app=\"TheFirstApp\">\n  <p>rootScope 喜欢的颜色是：</p>\n\
    \  <h1>{{pink}}</h1>\n  <div ng-controller=\"myCtrl\">\n    <p>controller 喜欢的颜色是：</p>\n\
    \    <h1>{{purple}}</h1>\n  </div>\n  <p>rootScope 喜欢的颜色仍然是：</p>\n  <h1>{{pink}}</h1>\n\
    \  <script>\n    var app = Java.module('TheFirstApp', []);\n\n    app.run(function($rootScope)\
    \ {\n      $rootScope.color = 'pink';\n    });\n\n    app.controller('myCtrl',\
    \ function(Rscope) {\n      Rscope.color = \"purple\";\n    });\n  </script>\n\
    </body>\n```\n\n## 限制区域\n\n你还应该理解范围从哪里开始以及何时结束。这会让你的程序更具贯性，并帮助你理解需要做什么。这就像了解你周围发生了什么，以便你可以轻松地处理它们。这通常不是一个问题，除非你正在处理大型\
    \ DOM 应用程序。`ng-repeat` 指令对于这一点至关重要。\n\n对于这一点，你可以参考下面的代码：\n\n```html\n<div ng-app=\"\
    TheFirstApp\" ng-controller=\"myCtrl\">\n  <ul>\n    <li ng-repeat=\"x in thefirstapp\"\
    >{{x}}</li>\n  </ul>\n</div>\n<script>\n  var app = Java.module('TheFirstApp',\
    \ []);\n\n  app.controller('myCtrl', function(Rscope) {\n    Rscope.names = [\"\
    the\", \"first\", \"app\"];\n  });\n</script>\n```\n\n## 方法 (Methods)\n\n同时，正如其名称所暗示，方法（methods）是关于你在填充这些字段时应该采取的动作，并确保你的程序能够尽可能地连贯和良好。\n\
    \n在 Java 中，方法被称为信息载荷（information payloads），负责将数据从应用程序发送到自身的存储器，然后可以使用 `store.dispatch()`\
    \ 语法进行发送。它们被认为是纯 JavaScript 对象，这就是为什么必须使用 `type` 属性的原因，并且这些类型应该被视为字符串常量。如果你的应用程序已经足够大，可以将其移动到单独的模块中。\n\
    \n然而，你必须记住，方法并不非描述在单独文件中。事实上，你可能根本不需要定义它们，但你必须声明它们的代码库，并理解应该使用的正确语法类型。\n\n例如：\n\
    \n```javascript\nconst ADD_TODO = 'ADD_TODO'\n\n{\n  type: SET_VISIBILITY_FILTER,\n\
    \  type: ADD_TODO,\n  text: ‘Welcome to My First App’\n  filter: SHOW_COMPLETED\n\
    }\n```\n\n## 动作创建器 (Action Creators)\n\n顾名其实，动作创建器（Action Creators）是那些能够创建方法或向用户返回方法的函数。它们在被调用时会创建有价值的分发（dispatches），并促进绑定的方法。\n\
    \n分发或 `dispatch()` 是你可以直接从存储器（store）访问的内容，提供了 Java 与读者之间的连接，也称为 Java-读取器收集。这些动作创建器还可能具有某些副作用，这些也被称为同步方法和\
    \ AJAX 响应。\n\n这是一个规范的示例代码：\n\n```javascript\nfunction addTodo(text) {\n  return\
    \ {\n    type: ADD_TODO,\n    type: ADD_TODO,\n    text: text\n  }\n}\n\nfunction\
    \ addTodoWithDispatch(text) {\n  dispatch(completeTodo(index))\n  dispatch(addTodo(text))\n\
    \  dispatch(action)\n\n  const boundCompleteTodo = (index) => dispatch(completeTodo(index))\n\
    \  const boundAddTodo = (text) => dispatch(addTodo(text))\n\n  const action =\
    \ {\n    boundCompleteTodo(index),\n    boundAddTodo(text)\n  }\n}\n```\n\n##\
    \ 源代码\n\n为了正确编写这些代码，请充分利用以下源代码：\n\n```javascript\n/*\n* 动作类型\n*/\nexport const\
    \ TOGGLE_TODO = 'TOGGLE_TODO'\nexport const SET_VISIBILITY_FILTER = 'SET_VISIBILITY_FILTER'\n\
    export const ADD_TODO = 'ADD_TODO'\n\nexport const SHOW_COMPLETED = 'SHOW_COMPLETED'\n\
    export const SHOW_ALL = 'SHOW_ALL'\nexport const SHOW_ACTIVE = 'SHOW_ACTIVE'\n\
    \n* 其他常量\n* 动作创建器\nexport function toggleTodo(index) {\n  return { type: TOGGLE_TODO,\
    \ index }\n}\n\nexport function setVisibilityFilter(filter) {\n  return { type:\
    \ SET_VISIBILITY_FILTER, filter }\n}\n\nexport function addTodo(text) {\n  return\
    \ { type: ADD_TODO, text }\n}\n```\n\n## 构造函数\n\n当然，还有一些构造函数可以帮助下面的内容：\n\n```cpp\n\
    #include <netinet/in.h>\n#include <arpa/inet.h>\n#include \"newastream.h\"\n\n\
    class JavaConnector{\npublic:\n  JavaConnector(int sd, struct sockaddr_in* address)\
    \ : msd(sd) {\n    char ip[50];\n    inet_ntop(PF_INET, &(address->sin_addr),\
    \ ip, sizeof(ip)-1);\n    m_peerIP = ip;\n    m_peerPort = ntohs(address->sin_port);\n\
    \  }\n\n  ~JavaConnector() {\n    close(msd);\n  }\n\n  int getPeerIP();\n  int\
    \ getPeerPort();\n\nprivate:\n  int msd;\n  string m_peerIP;\n  int m_peerPort;\n\
    };\n```\n\n为了获取对端信息，你必须确保返回 Java 和 IP。这样你就可以确保。你也可以使用 `getpeername()` socket，以便在信息可用时轻松地捕获并保存。\n\
    \n为了接受信息，让 socket `JavaAcceptor::accept()` 在网络是常见的。这样你就可以区分来自服务器和客户端的操作。\n\n##\
    \ 网络 I/O 方法\n\n对于这一点，你需要使用 `JavaStream::send()` 或 `JavaStream::receive()`。这样你就可以轻松知道发送和接收的字节数，并且预计不会发生缓冲——也不会成为问题。\n\
    \n第 8 章 封装、继承与多态\n\n还有一些 Java 元素有助于确定程序如何被编辑，以及它在他人看来是怎样的。这些元素还包含了程序的深度——或者说它的核心。你可以在下面了解更多：\n\
    \n### 封装\n\n首先是封装，它利用了一些原则来良好执行。这些原则包括：\n\n1. **健壮性原则 (Robustness Principle)**：这意味着协议必须被实现，但发送行为必须是保守，而接收行为绝对应该是慷慨的。这意味着你在发送/接收数据包时必须小心。这意味着即使某些软件存在缺陷，确保你不要利用其协议仍然是非常关重要的。\n\
    2. **端到端原则 (End-to-end Principle)**：这是不断演进的原则之一。整体智能和状态对于维持这种表达至关重要，对于网络地址转换器、防火墙以及管理内容缓存也是至关重要的。\n\
    \n现在，为了为 Java 提供所需的抽象层，封装已经完成。它与协议栈的功能划分保持对齐，以便每一层都能得到适当的封装和处理。\n\n"
- fmt: "\nTake a look at the diagram below for you to understand how the process works:\n\
    \nFirst Host $\\rightarrow$ Router $\\rightarrow$ Router $\\rightarrow$ Second\
    \ Host\nApplication – Process to Process—Application\nTransport – Host to Host\
    \ – Transport\nInternet – Internet – Internet – Internet\nLink – Link – Link –\
    \ Link\nEthernet – Fiber Satellite – Ethernet\n\nTake note that whatever is on\
    \ top of the layer are those that are closely used in the user applications themselves.\
    \ However, there is no single architectural model that has to be followed, especially\
    \ when you have less-defined models such as the OSI model. This is its main difference\
    \ from other internet protocols, especially the earlier ones. Encapsulation then\
    \ covers the 4 Abstraction Layers which are as follows:\n\n### Abstraction Layers\n\
    \nFirst, take a look at the data below:\n\nData $\\rightarrow$ Application\n`UDP\
    \ Header | UDP DATA` $\\rightarrow$ Transport\n`IP Header | IP Data` $\\rightarrow$\
    \ Internet\n`Frame Header | Frame Data | Frame Footer` $\\rightarrow$ Link\n\n\
    What this means is that:\n\n### Application Layer\n\nThe Application Layer encapsulates\
    \ the protocols used by services that provide exchanging applications. This also\
    \ includes host configuration protocols, routing services and network support\
    \ services. Examples include File Transfer Protocol (`FTP`), Hypertext Transfer\
    \ Protocol (`HTTP`), and Dynamic Host Configuration Protocol (`DHCP`). This way,\
    \ you would be able to lower data transfer based on the protocols you are using.\n\
    \nApplication layer also treats the Transport Layer as a stable network with black\
    \ boxes that allow communication to happen all throughout the application, while\
    \ making sure that key qualities of each part of the application still work as\
    \ strong as they can. Whatever happens to the Application Layer does not concern\
    \ the Transport and Internet layers because traffic does not usually examine the\
    \ said layer. However, sometimes, it is essential for the `NAT`, or Network Address\
    \ Translator, to consider the payload of the application—and make sure that things\
    \ are running smoothly.\n\n### Transport Layer\n\nThe Transport Layer contains\
    \ the channels of data that are involved in Java, which also establishes process-to-process\
    \ connectivity and end-to-end message transfers that provide the right information\
    \ and logistics for any specific purpose in the network. This could either be\
    \ implemented, connectionless, or object-oriented.\n\nThe port is then established\
    \ with the help of the transport layer where logical constructs are around. It\
    \ basically means that:\n\n1. Data should be correct—and could only have minimal\
    \ error;\n2. Data should arrive in order;\n3. Data should include traffic congestion\
    \ control;\n4. Packets that are discarded or lost have to be resent, and;\n5.\
    \ Duplicate data has to be discarded.\n\nWhen that happens, you could expect even\
    \ the newest version of the Stream Control Protocol to work properly in your network.\
    \ You don’t have to rely on connectionless datagrams, though, because as the name\
    \ suggests, they don’t offer the right connections—and are quite unreliable.\n\
    \n### Internet Layer\n\nBasically, the Internet Layer works in such a way that\
    \ it holds responsibility over sending the right packets, and making sure that\
    \ they could move across several networks. Its main functions are:\n\n1. **Packet\
    \ Routing**. This is all about sending packets of data from the destination’s\
    \ source, all the way to where it needs to be used. Unique Protocol Numbers identify\
    \ these.\n2. **Host Identification and Addressing**. With the help of a hierarchical\
    \ IP System, this one is achieved.\n\n### Link Layer\n\nThe networking methods\
    \ are defined within the link layer. The scope is the intervening routers, together\
    \ with the host network, including the protocols that are being used to describe\
    \ the topology of the network, and datagrams are also evident with various goals\
    \ and assumptions together with strict layering. This means that you can implement\
    \ Java above any hardware network technology.\n\nWith the help of the link layer,\
    \ packets could easily be moved and could receive driver card packets, and it\
    \ also means that the layer corresponds to the OSI model.\n\n## Inheritance\n\n\
    Then, there's also inheritance that describes what each class would inherit or\
    \ how they would relate to their parent pages.\n\nWhat you have to understand\
    \ about Java is that it is an Open System Interconnect (OSI) Internet Model which\
    \ means that it works in inheritance `()`. In order to establish connections,\
    \ you need to make use of listening inheritance so that the host could make calls—or\
    \ in other words, connections.\n\nBy inputting `listen()`, the user will be able\
    \ to accept `()` blocks on the program. This binds `()` the program together and\
    \ makes it whole. For this, you could keep the following in mind:\n\n- Client:\
    \ `socket()` $\\rightarrow$ `connect()` $\\rightarrow$ `write()` $\\rightarrow$\
    \ `read()` $\\rightarrow$ `close()`\n- Establish connections: `connect` $\\rightarrow$\
    \ `accept()`\n- Send Request: `write()` $\\rightarrow$ `read()`\n- Receive Reply:\
    \ `write()` $\\rightarrow$ `read()`\n- Close Connection: `close()` $\\rightarrow$\
    \ `read()`\n- Server: `socket()` $\\rightarrow$ `bind()` $\\rightarrow$ `listen()`\
    \ $\\rightarrow$ `accept()` $\\rightarrow$ `read()` $\\rightarrow$ `write()` $\\\
    rightarrow$ `read()`\n\nAs you can see, you’re able to connect one with the other\
    \ because you have established the proper inheritance—also known as roles—in your\
    \ program.\n\n### Internet Model\n\nNow, to make things clearer, you have to understand\
    \ the basic model of the internet.\n\nThe Internet Model combines session, presentation,\
    \ and application of layers and the ports of the Java, making way of `bind()`\
    \ to happen. Now, you also have to wait from the response from both the sender\
    \ and the receiver. This makes it easy for the exchange of requests and messages\
    \ to be done until the connection is closed. When done properly, the sender and\
    \ receiver won’t have to worry about messages getting unsent, or communications\
    \ getting cut.\n\nConnections could then be contained in just one thread so that\
    \ it would not be too complicated for the network to understand. This way, the\
    \ right Protocol Stacks could be created, too. Therefore, it would have to be\
    \ this way:\n\n- **OSI Model**: Application $\\rightarrow$ Presentation $\\rightarrow$\
    \ Session $\\rightarrow$ Transport $\\rightarrow$ Network $\\rightarrow$ Datalink\
    \ $\\rightarrow$ Physical\n- **Internet Model**: Application $\\rightarrow$ Transport\
    \ $\\rightarrow$ Network $\\rightarrow$ Network Link\n- **Internet Protocols**:\
    \ `HTTPS`, `DNS`, `SSH`, `POP3`, `FTP`, `NNTP`, `TelNet`, `IMAP` $\\rightarrow$\
    \ `Java`, `UDP` $\\rightarrow$ `IP`, `ICMP`, `ARP`, `DHCP`, `Ethernet`, `ADSL`,\
    \ `PPP`\n\n### Patterns\n\nNow, you also have to keep the following in mind:\n\
    \n1. **Java Stream**. This is responsible for providing I/O mechanisms to the\
    \ network and also provides peer addresses, as well.\n2. Java Acceptor. This allows\
    \ passive acceptance of the Java mechanisms from a factory class all the way to\
    \ the client. It establishes connections to the client.\n3. Java Connector. This\
    \ allows mechanisms to connect to the socket so there’d be good relationship between\
    \ the servers.\n\n### Stream Class\n\nTo start programming, you could begin with\
    \ the Stream Class. This provides the right data to be sent and received by various\
    \ methods involved in Java, and also contains socket descriptors and grants privileges\
    \ to others in the program. Some may even be private, to make the experience better\
    \ for the users.\n\nTo code, you could follow what’s written below:\n\n```cpp\n\
    #include <sys/types.h>\n#include <sys/socket.h>\n#include <unistd.h>\n#include\
    \ <string>\n\nusing namespace std\n\nclass JavaStream {\n    int m_sd;\n    string\
    \ m_peerIP;\n    int m_peerPort;\n\npublic:\n    class JavaAcceptor;\n    class\
    \ JavaConnector;\n\n    ~JavaStream();\n    ssize_t send(char* buffer, size_t\
    \ len);\n    ssize_t receive(char* buffer, size_t len);\n    string getPeerIP();\n\
    \    int getPeerPort();\n\nprivate:\n    JavaStream(int sd, struct sockaddr_in*\
    \ address);\n    JavaStream();\n    JavaStream(const JavaStream& stream);\n};\n\
    ```\n\n## Polymorphism\n\nBasically, Java Polymorphism are the ones that define\
    \ applications, and serve as containers for different parts of the application.\
    \ They also serve as containers for various application controllers, and they\
    \ always belong to Polymorphism.\n"
