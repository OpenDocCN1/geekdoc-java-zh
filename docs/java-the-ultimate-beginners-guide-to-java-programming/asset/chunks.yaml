    \nSo basically, the whole program is depicted through various <Java> tags, and\
    \ that’s why start <> and end </> tags have to be used. Without them, words on\
    \ the page would all come together—making them hard to read. The <body> tag then\
    \ defines what the page contains. It also contains headings, paragraphs, and other\
    \ attributes.\n\nFor example:\n\n<Java>\n\n<body>\n\n<h1>My Sunday</h1>\n\n<p>Last\
