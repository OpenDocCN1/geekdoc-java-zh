    \ in this area){\n    case 'A':\n    //some statements to execute when A\n   \
    \ break;\n    case 'B':\n    //some statements to execute when B\n    break;\n\
    \    default:\n    //some statements to execute when default;\n}\n```\n4. `Break\
    \ and continue`. This is used for enclosing loops so you could jump out of them\
    \ and so you could continue with the next statement easily. This is also used\
    \ to skip some elements in the same loop.\n\n```c\nfor (i=1;i<=1;++i){\n    if\
    \ (i==2)\n        continue;\n    if (i==8)\n        break;\n    printf(\"%d \"\
    ,i);\n}\n```\n"
