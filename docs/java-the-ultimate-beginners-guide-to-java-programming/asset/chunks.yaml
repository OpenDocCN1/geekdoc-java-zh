    \ 转换为字符串表示。\n5. `Complex(real [imag])`：这给你一个复数。\n6. `Eval(str)`：评估字符串并返回一个对象。\n\
    7. `Repr(x)`：将 `x` 转换为表示字符串。\n8. `Set(s)`：将 `x` 转换为集合。\n9. `List(L)`：将 `x` 转换为列表。\n\
    10. `Tuple(t)`：将 `x` 转换为元组。\n11. `Frozen set(s)`：将 `x` 转换为冻结集合。\n12. `Dict(d)`：这给你一个字典。\n\
    13. `Oct(x)`：将 `x` 转换为八进制字符串。\n14. `Hex(x)`：将 `x` 转换为十六进制字符串。\n15. `Ord(x)`：这给单个字符其整数值。\n\
    16. `Unichr(x)`：最后，使用此命令将得到一个 Unicode 字符。\n\n#### 赋值\n等号（`=`）在这里很重要，因为。你不需要在这里进行显式声明，但你必须确保将变量放在等号之前，而在右侧，放置你想让变量发生的操作。例如：\n\
    \n"
- fmt: "\nThen, you also have Java Operators. These manipulate operand values, and\
    \ could be categorized as:\n\n1.  Arithmetic\n2.  Assignment\n3.  Identity\n4.\
    \  Membership\n5.  Bitwise\n6.  Logical\n7.  Comparison/ Relational\n\n### Arithmetic\
    \ Operators\n\nHere are the arithmetic operators that you can use:\n\n1.  `+`\
    \ Addition. Of course, this adds values on your operators (`a + b = 15`)\n2. \
    \ `–` Subtraction. This subtracts the operand on the right from the one on the\
    \ left (`a – b = -10`).\n3.  `/` Division. This divides operand on the left with\
    \ what’s on the right (`b/a = 2`).\n4.  `*` Multiplication. Multiples whatever\
    \ you have (`a * b = 200`).\n5.  `//` Floor Division. With this, you’d get quotient\
    \ results, especially when decimal points are removed (`9//2 = 4`) (`9.0//2.0\
    \ = 4.0`).\n6.  `**` Exponent. This helps you derive exponential notation (`a**b\
    \ = 5 to the power of 10`).\n7.  `%` Modulus. Divides operand on the left by the\
    \ right and provides remainder (`b% a = 0`).\n\n### Assignment Operators\n\n1.\
    \  `=` Gives value to what’s on the right side back to the left operand (`c =\
    \ a + b` assigns value of `a + b` into `c`).\n2.  `-=` Subtract AND.. This subtracts\
    \ the operand on the right from the left operand and assigns results to what’s\
    \ on the left (`c -= a` is equivalent to `c = c – a`).\n3.  `+=` Add AND. This\
    \ adds the operand on the right to the left and gives left operand result (`c\
    \ += a` is equivalent to `c = c + a`).\n4.  `/=` Divide AND. Divides left with\
    \ right operand and assigns value to the left (`c /= a` is equivalent to `c =\
    \ c / a`).\n5.  `*=` Multiply AND. Multiplies right operand with left operand\
    \ and assigns result to left operand (`c *= a` is equivalent to `c = c * a`).\n\
    6.  `**=` Exponent AND. Derives exponential notation (`c **= a` is equivalent\
    \ to `c = c ** a`).\n7.  `%=` Modulus AND. Takes modulus of two operands (`c %=\
    \ a` is equivalent to `c = c % a`).\n8.  `//=` Floor Division AND. With this,\
    \ you’d get quotient results, especially when decimal points are removed (`c //=\
    \ a` is equivalent to `c = c // a`).\n\n### Identity Operators\n\nThese compare\
    \ memory of two locations of two different objects.\n\n1.  `is`. Determines whether\
    \ variables on either side are true; if not, operator points to the same subject\
    \ (`x is y`, here `is` results in 1 if `id(x)` equals `id(y)`).\n2.  `is not`.\
    \ If variables on either side are false, operator points to the subjects and says\
    \ true-wise (`x is not y`, here `is not` results in 1 if `id(x)` is not equal\
    \ to `id(y)`).\n\n### Membership Operators\n\nThese check whether there is membership\
    \ or coherence in a certain sequence.\n\n1.  `is`. Checks whether variables on\
    \ each side are true (`x is y`, here `is` results in 1 if `id(x)` equals `id(y)`).\n\
    2.  `not in`. Checks if a variable is not in a specified sequence and evaluates\
    \ to either true or false (`x not in y`, here `not in` results in a 1 if `x` is\
    \ not a member of sequence `y`).\n\n### Bitwise Operators\n\nThese perform bit\
    \ by bit operation. For example:\n\n```\na = 0011 1100\nb = 0000 1101\n\na&b =\
    \ 0000 1100\na|b = 0011 1101\na^b = 0011 0001\n~a = 1100 0011\n```\n\n### Logical\
    \ Operators\n\nLogical Operators are basically items that hold 10 to 20 variables\
    \ in between them.\n\n### Comparison Operators\n\n1.  `==`. Condition equates\
    \ to true if the operands are equal (`(a==b)` is not true).\n2.  `<>`. If values\
    \ are not equal, condition becomes true (`(a<>b)` is true).\n3.  `!=`. Condition\
    \ becomes true if values of two operands are not equal.\n4.  `<=`. Condition becomes\
    \ true if left operand value is less than the right operand (`a <=b` is true).\n\
    5.  `>=`. Condition becomes true if value of left operand is greater than right\
    \ operand (`a>=b` is not true).\n6.  `<`. If left operand value is less than right\
    \ operand, condition is true (`a < b` is true).\n7.  `>`. If value of left operand\
    \ is greater than right, condition is true (`(a>b` is not true).\n\n### Loops\n\
    \nLoops are statements that provide various actions that could be used in your\
    \ program. These include:\n\n1.  `For Loop`. This helps you execute statements\
    \ a number of times and also abbreviates codes that are used in the variable.\n\
    2.  `While Loop`. This repeats statements or groups of statements you want to\
    \ use again in your program.\n3.  `Nested Loop`. This means that you’re using\
    \ one or more loops in your program.\n4.  `Do…While Loop`. This is equivalent\
    \ to a statement but is seen by the program as a condition.\n5.  `Goto Statement`.\
    \ This gives control to the statement that has already been.\n6.  `Continue Statement`.\
    \ This skips the rest of the loop body.\n7.  `Break Statement`. This terminates\
    \ the loop.\n\n### Switch Case\n\nSwitch statements allow you to execute different\
    \ blocks of code based on a condition.\n\n```c\n#include <stdio.h>\nint main ()\
    \ {\n    char grade = 'D';\n    switch(grade) {\n        case 'E':\n         \
    \   printf(\"...\");\n            break;\n    }\n}\n```\n\n### Chapter 3: Arrays\
    \ and Strings\n\nIn Java, arrays and strings help make sure that whatever will\
    \ appear onscreen are certainly what the programmer, or you, want to express.\
    \ In coding the Java language, you course have to make use of. These are written\
    \ in double braces `{{}}`, but could also be contained within a directive, just\
    \ like this one:\n\n`ng-bind=\"expression\"`\n\nThe expression will then be resolved\
    \ by Java itself, and have results when they are ready. They pretty much mirror\
    \ JavaScript expressions, so if you know something about that, this language would\
    \ not be too hard for you.\n\nThis also means that Java Expressions are:\n\n1.\
    \  Java Expressions could contain filters—but JavaScript expressions do not.\n\
    2.  They do not support exceptions, loops, and coordinates.\n3.  The expressions\
    \ could be written inside HTML.\n4.  Java Expressions could also be variables,\
    \ operators, and literals.\n\nFor example:\n\n`{{ 10 + 5 }}` or `{{ name + \"\
    \ \" + nickname }}`\n\nThis means that a basic Java expression code would look\
    \ like the following:\n\n```html\n<!DOCTYPE html>\n<html>\n<script src=\"http://ajax.googleapis.com/ajax/libs/angularjs/1.4.8/angular.min.js\"\
    ></script>\n<body>\n<div ng-app=\"\">\n  <p>Supergirl Versus Bizarro: {{ Supergirl\
    \ +Bizzaro }}</p>\n</div>\n</body>\n</html>\n```\n\nBy taking away the ng directive,\
    \ HTML would not be able to solve the expression, but just show it as it is, which\
    \ would just basically look the same as this:\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <script src=\"http://ajax.googleapis.com/ajax/libs/angularjs/1.4.8/angular.min.js\"\
    ></script>\n```\n"
  raw: 'Then, you also have Java Operators. These manipulate operand values, and could
    be categorized as:


    1.  Arithmetic


    2.  Assignment


    3.  Identity


    4.  Membership


    5.  Bitwise


    6.  Logical


    7.  Comparison/ Relational


    Arithmetic Operators


    Here are the arithmetic operators that you can use:


    1.  + Addition. Of course, this adds values on your operators ( a + b = 15)


    2.  –Subtraction. This subtracts the operand on the right from the one on the
    left. (a – b = -10)


    3.  /Division. This divides operand on the left with what’s on the right. (b/a
    = 2)


    4.  *Multiplication. Multiples whatever you have. (a * b = 200)


    5.  // Floor Division. With this, you’d get quotient results, especially when
    decimal points are removed. (9//2 = 4) (9.0//2.0 = 4.0)


    6.  **Exponent. This helps you derive exponential notation. (a**b = 5 to the power
    of 10)


    7.  % Modulus. Divides operand on the left by the right and provides remainder.
    (b% a = 0)


    Assignment Operators


    1.  =. Gives value to what’s on the right side back to the left operand. (c =
    a + b assigns value of a + b into c)


    2.  -=Subtract AND. This subtracts the operand on the right from the left operand
    and assigns results to what’s on the left. (c -= a is equivalent to c = c – a)


    3.  +=Add AND. This adds the operand on the right to the left and gives left operand
    result. (c += a is equivalent to c = c + a)


    4.  /=Divide AND. Divides left with right operand and assigns value to the left.
    (c /= a is equivalent to c = c / ac /= a is equivalent to c = c / a)


    5.  *=Multiply AND. Multiplies right operand with left operand and assigns result
    to left operand. (c *= a is equivalent to c = c * a)


    6.  **=Exponent AND. Derives exponential notation. (c **= a is equivalent to c
    = c ** a)


    7.  %=Modulus AND. Takes modulus of two operands. (c %= a is equivalent to c =
    c % a)


    8.  // Floor Division AND. With this, you’d get quotient results, especially when
    decimal points are removed. (c //= a is equivalent to c = c // a)


    Identity Operators


    These compare memory of two locations of two different objects.


    1.  Is. Determines whether variables on either side are true; if not, operator
    points to the same subject. (x is y, here is results in 1 if id(x) equals id(y).)


    2.  Is not. If variables on either side are false, operator points to the subjects
    and says true-wise. (x is not y, here is not results in 1 if id(x) is not equal
    to id(y).)


    Membership Operators


    These check whether there is membership or coherence in a certain sequence.


    1.  Is. Checks whether variables on each side are true. (x is y, here is results
    in 1 if id(x) equals id(y).)


    2.  Not in. Checks if a variable is not in a specified sequence and evaluates
    to either true or false. (x not in y, here not in results in a 1 if x is not a
    member of sequence y.)


    Bitwise Operators


    These perform bit by bit operation. For example:


    a = 0011 1100


    b = 0000 1101


    -----------------


    a&b = 0000 1100


    a|b = 0011 1101


    a^b = 0011 0001


    ~a  = 1100 0011


    Logical Operators


    Logical Operators are basically items that hold 10 to 20 variables in between
    them.


    Comparison Operators


    1.  ==. Condition equates to true if the operands are equal. ((a==b) is not true)


    2.  <>. If values are not equal, condition becomes true. ((a<>b) is true)


    3.  !=. Condition becomes true if values of two operands are not equal.


    4.  <=. Condition becomes true if left operand value is less than the right operand.
    (a <=b) is true)


    5.  >=. Condition becomes true if value of left operand is greater than right
    operand. (a>=b) is not true)


    6.  <. If left operand value is less than right operand, condition is true. (a
    < b) is true)


    7.  >. If value of left operand is greater than right, condition is true. ((a>b
    is not true)


    ## Loops


    Loops are statements that provide various actions that could be used in your program.
    These include:


    1.  For Loop. This helps you execute statements a number of times and also abbreviates
    codes that are used in the variable.


    2.  While Loop. This repeats statements or groups of statements that you want
    to use again in your program.


    3.  Nested Loop. This means that you’re using one or more loops in your program.


    4.  Do…While Loop. This is equivalent to a statement but is seen by the program
    as a condition.


    5.  Goto Statement. This gives control to the statement that has already been
    labeled.


    6.  Continue Statement. This helps the loop skip the remainder of the body—so
    it wouldn’t be around when it’s unnecessary.


    7.  Break Statement. This terminates the switch and loop statements and helps
    execute the other statements in the program after you have made one of the loops.


    ## Switch Case


    And of course, if you want to test variables, you have to make use of switch cases—also
    known as switch statements. There are certain rules that you have to follow, though,
    and these are:


    1.  Switch statements could also be default cases. Therefore, they have to appear
    at the end of the switch and could be used to determine false statements in the
    program. In this case, you wouldn’t have to use a break anymore.


    2.  You don’t need a break for every case. In case no break appears, all you have
    to do is wait for something to fall through.


    3.  When you have reached the break statement, go ahead and change the terminates
    that you have been using so that you could then jump to the next line.


    4.  Constant Expression should be used. This means you have to use the same data
    types in your program.


    5.  Every switch contains a number of case statements that could be separated
    with colons.


    6.  You could use enumerated or integral types of switches so that class conversion
    could easily be done.


    For this, you have to remember that:


    ExpressionCase 1 Code Block 1


     Case 2 Code Block 2


     Case 3 Code Block 3


    And so on. In short, you could take note of the example below:


    #include <mylistofgrades>


    int main () {


       /* local variable definition */


       char grade = ''D'';


       switch(grade) {


          case ''E'' :


             printf("Amazing!/n" );


             break;


          case ''E'' :


          case ''D'' :


             printf("Great Job!\n" );


             break;


          case ''D'' :


             printf("You did well!\n" );


             break;


          case ''F'' :


             printf("Try again next time\n" );


             break;


          default :


             printf("Invalid grade\n" );


       }


       printf("Your grade is  %c\n", grade );


       return 0;


    }


    # Chapter 3: Arrays and Strings


    In Java, arrays and strings help make sure that whatever will appear onscreen—or
    on the finished program are certainly what the programmer, or you, in this case,
    want to express .


    In coding the Java language, you of course have to make use of expressions. These
    are written in double braces {{}}, but could also be contained within a directive,
    just like this one below:


    Ng-bind= “expression”


    The expression will then be resolved by Java itself, and have results returned
    when they are ready. They pretty much mirror JavaScript expressions, so if you
    know something about that, this language would not be too hard for you.


    This also means that Java Expressions are:


    1\. Java Expressions could contain filters—but JavaScript expressions do not have
    them.


    2\. They do not support exceptions, loops, and coordinates.


    3\. The expressions could be written inside HTML.


    4\. Java Expressions could also be variables, operators, and literals.


    For example:


    {{ 10 + 5 }} or {{ name + " " + nickname }}


    This means that a basic Java expression code would look like the following:


    <!DOCTYPE html>


    <html>


    <script src="http://ajax.googleapis.com/ajax/libs/angularjs/1.4.8/angular.min.js"></script>


    <body>


    <div ng-app="">


      <p>Supergirl Versus Bizarro: {{ Supergirl +Bizzaro }}</p>


    </div>


    </body>


    </html>


    By taking away the ng directive, HTML would not be able to solve the expression,
    but just show it as it is, which would just basically look the same as this:


    <!DOCTYPE html>


    <html>


    <script src="http://ajax.googleapis.com/ajax/libs/angularjs/1.4.8/angular.min.js"></script>'
