    该结构涉及一个报头和一个负载，其中报头已知为主 IP 地址，并带有某些参数连接的接口。此外，还涉及路由前缀和网络标识，以及内部或外部网关协议。可靠性也取决于端到端协议，但大多数情况下，你可以预期框架结构如下：


    Data -> Application

    UDP Header | UDP DATA -> Transport

    IP Header | IP Data -> Internet

    Frame Header | Frame Data | Frame Footer -> Link

