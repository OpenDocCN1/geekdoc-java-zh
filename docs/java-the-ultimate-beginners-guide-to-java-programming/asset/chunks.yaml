- fmt: "\nMore than anything, what you have to understand about Java is that it is\
    \ a general purpose, object-oriented programming language—which means that it\
    \ is easier to understand than other programming languages. It was designed primarily\
    \ so that software developers could just code their programs once, and allow those\
    \ programs run anywhere, or at least, in most platforms, as long as those platforms\
    \ allow Java code to run in them.\n\nJava primarily uses some of the same elements\
    \ that `C+` and `C++` use, but transforms them into much simple, easy to understand\
    \ versions that could also be modified depending on the developer’s preferences.\n\
    \nJava has also been created to run with enough runtime support, both for hardware\
    \ and software, by means of representing each bytecode in a clear, and concise\
    \ manner. For example, shih tzus, border collies, and terriers are all dogs—therefore,\
    \ they could all be classified as dogs, and thus, not a lot of space would be\
    \ taken up in the system, and the system would be able to work in a fast manner.\
    \ This is also the reason why Java is one of the world’s most powerful, and most\
    \ used programming languages of all time!\n\n## History\n\nThe history of Java\
    \ dates back to 1991 when programmers Patrick Haughton, Mike Sheridan, and James\
    \ Gosling thought of a programming language that could best be used for the development\
    \ of Digital TV. However, it was deemed to be way ahead of its own time, and thus,\
    \ they redeveloped it based on the `C+` and `C++` platforms to make it easier\
    \ and more economical to use.\n\nWith the redevelopment also came the core principles\
    \ of Java, which are:\n\n1. It has to be portable—or that it should work on as\
    \ many platforms as possible, without any of them not working as well as the other;\n\
    2. It should be safe and secure to use—and definitely well encrypted;\n3. People\
    \ should feel connected to it in as little time as possible, which means that\
    \ they should be working with words that are somehow familiar to them, and even\
    \ though it looks complex at first, sooner or later, they have to realize that\
    \ it actually works;\n4. It should be dynamic, should work in threads, and could\
    \ be modified when needed, and;\n5. It should perform with precision.\n\nAs you\
    \ can see, these core principles give you the feeling that the programmers real\
    \ made Java for the people—so they can enjoy using more programs without having\
    \ to buy too many devices.\n\nIn 1995, Sun Microsystems finally released Java\
    \ 1.0—the first public inception of Java, which had amazing security, no-cost\
    \ runtimes, and file access restrictions across all networks. Over the years,\
    \ 7 more Java releases had been made, and ever since 2006, Java started to be\
    \ available through `GNU`, or General Public License—meaning it is now a free,\
    \ open-source programming language. This stemmed from the public outcry that happened\
    \ once when some of its contents were made private and only available for a fee,\
    \ which definitely does not resonate with its core principles.\n\n## Runtime and\
    \ Performance\n\nAt first, Java did not run as fast as it should have, mostly\
    \ because of the fact that the first couple of programs created from it required\
    \ a bit more memory than those made from `C+`. However, over the years, its speed\
    \ improved, and actually has gained better reputation in the industry than its\
    \ peers.\n\nBeing a virtual machine in itself, Java now works with the so-called\
