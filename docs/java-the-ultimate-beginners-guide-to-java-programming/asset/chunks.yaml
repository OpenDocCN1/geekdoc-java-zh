    \ to eat some omelet and buttered vegetables </p>\n\nAlso, you have to remember\
    \ that while tags are not case-sensitive, it’s still better to use lowercase tags\
    \ especially in Java 4 and 5—which are commonly used these days. This way, you’d\
    \ avoid problems from happening to your page.\n\n## How to Quote Properly\n\n\
    There are times when you do have to quote certain things on your page. For example,\
