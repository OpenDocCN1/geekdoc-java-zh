    Another example would be if you want to change certain colors and styles in CSS.
    For example, if you want to change the color of a box as pink, you could try the
    following:


    <div ng-app="" ng-init="myCol=''pink''">


    <input style="background-color:{{myCol}}" ng-model="myCol" value="{{myCol}}">


    </div>


    ## Arrays


    This works like JavaScript Arrays. If you’re going to use ng-bind, it would look
    something like this one below:


    <div ng-app="" ng-init="points=[2,4,6,8]">


    <p>The third result is <span ng-bind="points[2]"></span></p>


    </div>


    But, if you’re going to take away ng-bind, it would look something like this one:


    <div ng-app="" ng-init="points=[2,4,6,8]">


    <p>The third result is {{ points[2] }}</p>


    </div>


    ## Strings


    Strings connect things together, even in programming. Java Strings also work like
    JavaScript. It could go two ways—just take a look at the examples below:


    <div ng-app="" ng-init="firstName=''Mark'';lastName=''Ruffalo''">


    <p>The name is <span ng-bind="firstName + '' '' + lastName"></span></p>


    </div>


    Or:


    <div ng-app="" ng-init="firstName=''Mark'';lastName=''Ruffalo''">


    <p>The name is {{ firstName + " " + lastName }}</p>


    </div>


    ## How to Format Java Strings


    Some people think that Java Strings are utterly complex to work with. However,
    you don''t really have to be afraid  of them. When it comes to formatting Java
    Strings, here''s what you have to know…


    Working Strings


    The first thing you have to realize is that there are certain elements known as
    Java Working strings.


    Java Working Strings are basically quote-enclosed characters. With these, single
    quotes are considered the same as double quotes, so you can expect that:


    var1 = ''Hello World!''


    var2 = "Java Programming"


    Accessing Values


    Remember that character types are not accepted as Java Language. You have to use
    square brackets [] to access substrings. For example:


    #!/usr/bin/java


    var1 = ''Hello World!''


    var2 = "Java Programming"


    print "var1[0]: ", var1[0]


    print "var2[1:5]: ", var2[1:5]


    When you input those commands, you’d get a result of:


    var1[0]:  H


    var2[1:5]:  ytho


    You could also update strings by doing the following:


    #!/usr/bin/java


    var1 = ''Hello World!''


    print "Updated String :- ", var1[:6] + ''Java''


    That will then give the following result:


    Updated String :-  Hello Java


    Unicode Strings


    There are also Unicode strings or 8-bit ASCII that you can keep as 16-bit Unicode.
    For example:


    #!/usr/bin/java


    print u''Hello, world!''


    Basically, this’ll give you:


    Hello, world!


    Triple Quotes


    You can also make use of triple quotes which could cover multiple lines, tabs,
    and even new lines. For example:


    #!/usr/bin/java


    para_str = """this is a long string that is made up of


    several lines and non-printable characters such as


    TAB ( \t ) and they will show up that way when displayed.


    NEWLINEs within the string, whether explicitly given like


    this within the brackets [ \n ], or just a NEWLINE within


    the variable assignment will also show up.


    """


    print para_str


    This’ll be the result that you’d get when you input the syntax above:


    this is a long string that is made up of


    several lines and non-printable characters such as


    TAB (    ) and they will show up that way when displayed.


    NEWLINEs within the string, whether explicitly given like


    this within the brackets [


    ], or just a NEWLINE within


    the variable assignment will also show up.


    Special Codes and Characters


    In order to program those, you have to make use of special characters and codes.
    These are:


    Built-in String Method


    1.  Center (width, fillchar). Along with the original string, this’ll give you
    a space-padded string consuming the total width of the columns.


    2.  Capitalize(). This basically capitalizes the first letter of the string.


    3.  Encode (suffix, beg=0, end=len(string)). This runs an encoded version of each
    string.


    4.  Decode (encoding UTF-8, errors=strict). The codec registered for encoding
    will be used for this method, and you’d get a default string.


    5.  Count (str, beg=0, end=len(string)). This counts the number of times a string
    appears and begins indexing.


    6.  Find (str, beg=0, end=len(string)). This checks whether str is on string or
    on subsequent string.


    7.  Expandtabs (tabsize = 8). Strings and tabs are then placed in multiple spaces.


    8.  Isdecimal(). If Unicode string contains decimal characters, value returns
    as true; false otherwise.


    9.  Zfill (width). Left-pads original string with zeros.


    10.  Upper (). Turns lowercase letters into uppercase.


    11.  Translate (table, deletechars=””) Turns string into translation table.


    12.  Title (). Turns string into titlecard version, which means uppercase becomes
    lowercase and vice-versa.


    13.  Swapcase (). All letters in the string will be inverted.


    14.  Strip ([chars]). Performs rstrip() and Istrip() on each string.


    15.  Startswith (str, beg=0, end=len (string)). Checks whether string is string
    itself or subset of string.


    16.  Splitlines (num=string.count(‘\n’)). Returns each of the line with new strings.


    17.  Split (str=””, num=string.count (str)). Splits the strings into delimeters.


    18.  Rjust (width, [,fillchar]). This gives you space-padded strings.


    19.  Rindex (str, beg=0, end=len(string)). This is just like index but with backward
    string.


    20.  Replace (old, new [max]). This replaces current string with max occurrences.


    21.  Max (str). This returns max character alphabetical string.


    22.  Join (seq). This merges representations of the strings.


    Format Symbols and their Functions


    %X              hexadecimal integer (UPPERcase letters)


    %x              hexadecimal integer (lowercase letters)


    %u              unsigned decimal integer


    %s              string conversion via str() prior to formatting


    %o              octal integer


    %i              signed decimal integer


    %g              the shorter of %f and %e


    %G              the shorter of %f and %E


    %f              floating point real number


    %E              exponential notation (with UPPERcase ''E'')


    %e              exponential notation (with lowercase ''e'')


    %d              signed decimal integer


    %c              character


    Other Important Symbols


    1.  m.n.              m is the minimum total width and n is the number of digits
    to display after the decimal point (if appl.)


    2.  0.              pad from left with zeros (instead of spaces)


    3.  <sp>.              leave a blank space before a positive number


    4.  +.              display the sign


    5.  *.              argument specifies width or precision


    6.  (var).              mapping variable (dictionary arguments)


    7.  %.              ''%%'' leaves you with a single literal ''%''


    8.  #.              add the octal leading zero ( ''0'' ) or hexadecimal leading
    ''0x'' or ''0X'', depending on whether ''x'' or ''X'' were used.


    9.  -. left justification


    Using the right keywords


    You also have to remember that formatting strings becomes easier when you simply
    make use of the right keywords, and these are…


    1\. Auto. This is used to define storage class variables. For example:


    auto int var1;


    2\. Char. This is used to indicate the value of the variable; sometimes called
    type character.


    Char variable09


    3\. Switch, case and default. This is a group of statements that denote the variable’s
    expression and could also be used as a default value. For example:


    switch(switch in this area){


        case ''A'':


        //some statements to execute when A


        break;


        case ''B'':


        //some statements to execute when B


        break;


