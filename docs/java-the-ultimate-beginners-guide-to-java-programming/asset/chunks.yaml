  trans: "\n此外，你还有 Java 运算符。这些运算符用于操作操作数，可以分类为：\n\n1.  算术运算符\n2.  赋值运算符\n3.  身份运算符\n\
    4.  成员运算符\n5.  位运算符\n6.  逻辑运算符\n7.  比较/关系运算符\n\n### 算术运算符\n\n以下是你可以使用的算术运算符：\n\
    \n1.  `+` 加法。当然，这会加你运算符上的值（`a + b = 15`）。\n2.  `–` 减法。将右侧的操作数减去左侧的操作数（`a – b =\
    \ -10`）。\n3.  `/` 除法。将左侧的操作数除以右侧的（`b/a = 2`）。\n4.  `*` 乘法。将你的内容倍乘（`a * b = 200`）。\n\
    5.  `//` 整除。通过它，你可以得到商的结果，特别是在去除小数点时（`9//2 = 4`）（`9.0//2.0 = 4.0`）。\n6.  `**`\
    \ 幂。这可以帮助你推导出指数符号（`a**b = 5 的 10 次`）。\n7.  `%` 取模。将左侧的操作数除以右侧并提供余数（`b% a = 0`）。\n\
    \n### 赋值运算符\n\n1.  `=` 将右侧的值赋给左侧的操作数（`c = a + b` 将 `a + b` 的值赋值给 `c`）。\n2.  `-=`\
    \ 减并赋值。这将右侧的操作数减去左侧的操作数，并将结果赋值给左侧（`c -= a` 等于 `c = c – a`）。\n3.  `+=` 加并赋值。将右侧的操作数加到左侧并得到左侧操作数的结果（`c\
    \ += a` 等于 `c = c + a`）。\n4.  `/=` 除并赋值。将左侧除以右侧操作数并将赋值赋值左侧（`c /= a` 等于 `c = c\
    \ / a`）。\n5.  `*=` 乘并赋值。将右侧操作数乘以左侧操作数并将结果赋值给左侧操作数（`c *= a` 等于 `c = c * a`）。\n\
    6.  `**=` 幂并赋值。推导出指数符号（`c **= a` 等于 `c = c ** a`）。\n7.  `%=` 取模并赋值。取两个操作数的模（`c\
    \ %= a` 等于 `c = c % a`）。\n8.  `//=` 整除并赋值。通过它，你可以得到商的结果，特别是在去除小数点时（`c //= a` 等于\
    \ `c = c // a`）。\n\n### 身份运算符\n\n这些运算符比较两个不同对象的两个位置内存。\n\n1.  `is`。判断两边的变量是否为真；如果不是，运算符指向同一个主体（`x\
    \ is y`，这里如果 `id(x)` 等于 `id(y)`，`is` 结果为 1）。\n2.  `is not`。如果两边的变量为假，运算符指向主体并在逻辑上为真（`x\
    \ is not y`，这里如果 `id(x)` 不等于 `id(y)`，`is not` 结果为 1）。\n\n### 成员运算符\n\n这些运算符检查特定序列中是否存在成员关系或一致性。\n\
    \n1.  `is`。检查各边的变量是否为真（`x is y`，这里如果 `id(x)` 等于 `id(y)`，`is` 结果为 1）。\n2.  `not\
    \ in`。检查变量是否不在指定的序列中并评估为真假（`x not in y`，这里如果 `x` 不是序列 `y` 的成员，`not in` 结果为 1）。\n\
    \n### 位运算符\n\n这些运算符逐位操作。例如：\n\n```\na = 0011 1100\nb = 0000 1101\n\na&b = 0000\
    \ 1100\na|b = 0011 1101\na^b = 0011 0001\n~a = 1100 0011\n```\n\n### 逻辑运算符\n\n\
    逻辑运算符基本上是中间夹着 10 到 20 个变量的项。\n\n### 比较运算符\n\n1.  `==`。如果操作数相等，则条件为真（`(a==b)` 不成立）。\n\
    2.  `<>`。如果值不相等，条件变为真（`(a<>b)` 为真）。\n3.  `!=`。如果两个操作数的值不相等，条件变为真。\n4.  `<=`。如果左侧操作数的值小于右侧操作数，条件变为真（`a\
    \ <=b` 为真）。\n5.  `>=`。如果左侧操作数的值大于右侧操作数，条件变为真（`a>=b` 不成立）。\n6.  `<`。如果左侧操作数的值小于右侧，条件为真（`a\
    \ < b` 为真）。\n7.  `>`。如果左侧的值大于右侧，条件为真（`(a>b` 不成立）。\n\n### 循环\n\n循环是提供可以在程序中使用的各种动作的语句。这些包括：\n\
    \n1.  `For 循环`。这可以帮助你执行多次语句，并缩短变量中使用的代码。\n2.  `While 循环`。重复你在程序中想要再次使用的语句或语句组。\n\
    3.  `嵌套循环`。这意味着你在程序中使用了一个或多个循环。\n4.  `Do…While 循环`。这相当于一个语句，但程序将其视为一个条件。\n5. \
    \ `Goto 语句`。这将控制交给已经执行的语句。\n6.  `Continue 语句`。跳过循环体的剩余部分。\n7.  `Break 语句`。终止循环。\n\
    \n### Switch Case\n\nSwitch 允许你根据条件执行不同的代码块。\n\n```c\n#include <stdio.h>\nint\
    \ main () {\n    char grade = 'D';\n    switch(grade) {\n        case 'E':\n \
    \           printf(\"...\");\n            break;\n    }\n}\n```\n\n### 第 3 章：数组和字符串\n\
    \n在 Java 中，数组和字符串有助于确保出现在屏幕上的内容确实是程序员想要表达的内容。在 Java 语言中，你必须使用它们。这些写在双括号 `{{}}`\
    \ 中，但也可以包含在指令中，就像下面这样：\n\n`ng-bind=\"expression\"`\n\n表达式将由 Java 自身解析，并在准备就绪时产生。它们与\
    \ JavaScript 表达式非常相似，所以如果你了解那些，这种语言对你来说并不难。\n\n这意味着 Java 表达式：\n\n1.  Java 表达式包含过滤器——但\
    \ JavaScript 表达式不。\n2.  它们不支持异常、循环和坐标。\n3.  表达式可以写在 HTML 内部。\n4.  Java 表达式可以是变量、运算符和字量。\n\
    \n例如：\n\n`{{ 10 + 5 }}` 或 `{{ name + \" \" + nickname }}`\n\n这意味着基础的 Java 表达式代码如下：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<script src=\"http://ajax.googleapis.com/ajax/libs/angularjs/1.4.8/angular.min.js\"\
    ></script>\n<body>\n<div ng-app=\"\">\n  <p>Supergirl Versus Bizarro: {{ Supergirl\
    \ +Bizzaro }}</p>\n</div>\n</body>\n</html>\n```\n\n通过移除 ng 指令，HTML 将无法解析表达式，而只是原样显示它，这看起来基本上就像是这样：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<script src=\"http://ajax.googleapis.com/ajax/libs/angularjs/1.4.8/angular.min.js\"\
    ></script>\n```\n"
