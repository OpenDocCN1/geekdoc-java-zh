    # Chapter 6: How to make your own classes


    In Java, classes are important because they determine what happens to your program,
    in general. Thus, it is no surprise that there are a lot of elements that come
    into play in making Java classes, and making sure that they would actually work.
    Basically, it all starts with the framework.


    ## Framework for Java Classes


    The framework of a Java class is made up of the following:


    1\. The program type is described with the UNICODE declaration.


    2\. Program information is provided in the text between <HEAD> and </HEAD>.


    3\. An Java Program is described in the text between <Java> and </Java>.


    4\. The program’s title is provided in the text between <TITLE> and </TITLE>.


    5\. The text between <H1> and </H1> are known as headings. It could also go for
    H2, H3, H4, and so on.


    6\. The content of the program—or what you’d read onscreen—goes on the text between
    <BODY> and </BODY>.


    7\. And, a paragraph could then be created in the text between <p> and </p>


    Tags Cheat Sheet


    Now, when it comes to tags, you have to keep in mind that they usually come in
    pairs, as you have seen in the framework above. What’s on the left side is the
    beginning of the tag (also known as start tag), and the end tag looks almost the
    same—but only with a slash (/) in the beginning.


    Here are the tags that you’re mostly going to use:


    <UNICODE…>


    NAME – this pertains to a section on the page


    HREF – this is used for hyperlinking, or for adding the name of the URL that you
    are referring to


    onCLICK – this is the script that runs so that the user will be able to click
    on the anchor (i.e., for things such as [google.com](http://google.com), this
    script has to run so that the user would really be directed to a link after clicking)


    <A> Anchor


    TITLE – this is the title of the program that is being opened


    onMOUSEOUT – this is the script used to determine that the mouse is no longer
    on the anchor text


    TARGET – This shows the window where the program has to go into. Variations include:
    “parent” | “black” | “top” | “shelf” | window name


    onMOUSEOVER – this shows that the mouse is right over the anchor text


    <ADDRESS>


    <App…>


    CODEBASE – this is the path that would take you to the applet class


    CODE – this determines the app that is currently running


    HEIGHT – the height of the applet


    WIDTH – this determines the applet’s width


    ALIGN – this would determine how the surrounding text would show up onscreen


    <APPLET…>


    HSPACE – this is the horizontal space between the surrounding text and the applet


    VSPACE – this is the vertical space between the surrounding text and the applet


    NAME – this is the name given to an applet and is also the name used by other
    applets that are referencing it


    BORDER – this is the empty space that surrounds the applet


    ARCHIVE – this is a collection of the components of the applet that have been
    compressed into one


    HREF – this determines the URL that you are linking to


    MAYSCRIPT – This shows whether Java can use JavaScript or not


    ALT – this is the alternate text used for when the image has not been properly
    displayed


    SHAPE – this determines the shape of the area that’s shown onscreen. It could
    either be one of the following: POLY | RECT | CIRCLE | DEFAULT


    COORDS – these determine the coordinates for the shapes in the link area


    <AREA…>


    TARGET – this determines the frame that you have to go to


    TITLE – this is a short description of the area being used


    onCLICK – this script should run while the user is hovering on the anchor text


    NOHREF – this means that there are no links contained in a certain area


    <b> BOLD


    <BASE> Base Address


    <Base Front>


                  TARGET - This shows the window where the program has to go into.
    Variations include: “parent” | “black” | “top” | “shelf” | window name


                  SRC – this determines audio or sound URL


                  FACE – the typeface or font of the project


                  COLOR – this is the color of the typeface


                  SIZE – font size that is being used


    <BG Sound>


                  LOOP              - this determines the number of times audio or
    video is being played


    <FORM>


                  ENCTYPE – this is the type of form being used on the page


                  onRESET – this is the script that should run if the form is being
    reset


                  SRC – this is the type of file that has to be added to the frame


                  onSUBMIT – this should run while the form is being submitted


                  SCROLLING – this determines whether the form should use a scrollbar
    or not (answerable with YES or NO)'
