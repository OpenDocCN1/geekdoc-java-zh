    \ of links is also encouraged. These are defined with the <a> tag. It makes things\
    \ easy on the eyes so that everything wouldn’t be on one page alone, and readers\
    \ could be taken to different pages on your website.\n\nHere’s a good example:\n\
    \n<a href=\"http://thechanels.com\">See this link</a>\n\n## Elements\n\nVarious\
    \ elements are also used in an Java page. If you could remember, pairs of tags\
    \ are always used in a webpage that’s been coded with Java.\n\nIt should look\
    \ something like this:\n\n<tagname>tagname</tagname>\n\nFor example:\n\n<h1> Read\
