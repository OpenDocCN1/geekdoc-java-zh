- fmt: "\nFor example, you have created a new website for fostering and taking care\
    \ of animals, and you are affiliated to the WWF (World Wildlife Fund). This means\
    \ you may have to quote from their website. How would you do this?\n\nWell, you\
    \ can use the Long Quote Style. This is depicted by `<blockquote>`, which would\
    \ then indent the passage. So, if you have quoted this way:\n\n```html\n<p>Here\
    \ is a quote from WWF's website:</p>\n\n<blockquote cite=\"http://www.worldwildlife.org/who/index.Java\"\
    >\n\nFor 50 years, WWF has been protecting the future of nature. The leading conservation\
    \ organization in the world,\n\nWWF works in over 100 countries and is supported\
    \ by all\n\n1.2 million members in the US and\n\nclose to 5 million globally.\n\
    \n</blockquote>\n```\n\nWhat you’d see onscreen is something like this:\n\nHere\
    \ is a quote from WWF's website:\n\nFor 50 years, WWF has been protecting the\
    \ future of nature. The world's leading conservation organization, WWF works in\
    \ 100 countries and is supported by 1.2 million members in the United States and\
    \ close to 5 million globally.\n\n## Short Quote\n\nFor short quotes, you could\
    \ try using `<q>`. For example:\n\n```html\n<p>ABC123’s Goal is to: <q>Build a\
    \ future where people know how to code without problems, and create the websites\
    \ they want.</q></p>\n```\n\n## Contact Information Quote\n\nIf you’re observant,\
    \ you’d know that a lot of websites make use of the Contact tab where you get\
    \ to see contact information of the owner of the website. For this, you could\
    \ use the Java `<address>` code. This is usually seen in italic with line breaks.\n\
    \nFor example:\n\n```html\n<address>\n\nWritten by Blair Waldorf </br> \n\nVisit\
    \ us at:<br>\n\nblaircornelia.com<br>\n\nNew York, New York<br>\n\nUSA\n\n</address>\n\
    ```\n\nTo be easy to get information from search engines, translation systems,\
    \ and other browsers. For this, you could try the example below:\n\n```html\n\
    <p>The <abbr title=\"World Wide Web\">WWW</abbr> was founded in 1989.</p>\n```\n\
    \n## Java Plus CSS\n\nAnd of course, if you want to make sure that your classes\
    \ would look more appealing to the eyes, then you have to know how to make use\
    \ of CSS Styles, top. Basically, here's what you have to do…\n\nThere are 3 important\
    \ CSS elements and they are:\n\n1. Internal. This means that you’re using an element\
    \ of `<style>` and you could find this in the Java `<head>` section.\n2. Inline.\
    \ This depicts Java style attributes.\n3. External. This means that you’re using\
    \ external CSS Files.\n\n## Important Elements\n\n1. Style. Internal Styling\n\
    2. CSS Margin. Space outside the border\n3. CSS Padding. Space inside the border\n\
    4. CSS Font-Size. This determines text sizes\n5. CSS Font-Family. This determines\
    \ where the font came from\n6. CSS Color. This determines the color of font being\
    \ used\n7. `<head>`. This refers to elements of `<link>` and `<style>`\n8. `<link>`.\
    \ A link to external CSS files\n9. `<style>`. The style of internal CSS\n\n##\
    \ Internal Styling (Internal CSS)\n\nThis means that you’re trying to define the\
    \ style of a single page in your website. You can see this in the `<head>` of\
    \ your page. It encapsulates the element of `<style>`.\n\nFor example:\n\n```html\n\
    <!UNICODE Java>\n<Java>\n<head>\n<style>\nbody {background-color:white;}\nh1 \
    \  {color:pink;}\np   {color:violet;}\n</style>\n</head>\n<body>\n<h1>Read this\
    \ heading</h1>\n<p>Read this paragraph </p>\n</body>\n</Java>\n```\n\n## Inline\
    \ Styling (Inline CSS)\n\nInline styling then means that you have to apply unique\
    \ styles to single elements in your page. This also falls under the Java Style\
    \ Attribute. For example, if you want to change the color of `<h1>` heading to\
    \ pink, you could try:\n\n```html\n<h1 style=\"color:pink;\">This is a Pink Heading</h1>\n\
    ```\n\n## External Styling (External CSS)\n\nExternal CSS is mostly about defining\
    \ style for a couple of pages in your website—not just one page alone. With the\
    \ help of just one file, you could already change the entire look of your website—which\
    \ really makes things easy for you.\n\nThen, you could just add a link to the\
    \ External CSS sheet in the `<head>` part of your page. For this, you could try\
    \ the example below:\n\n```html\n<!UNICODE Java>\n<Java>\n<head>\n  <link rel=\"\
    stylesheet\" href=\"styles.css\">\n</head>\n<body>\n<h1>Read this heading </h1>\n\
    <p>Read this paragraph.</p>\n</body>\n</Java>\n```\n\n## CSS Fonts\n\nFinally,\
    \ in order to easily change fonts, make sure that you know how to differentiate\
    \ elements. Color determines the Java text color in the page, font-size is all\
    \ about the size of font used, and font-family defines which family the font came\
    \ from (i.e., serif, sans serif, etc.)\n\n```html\n<!UNICODE Java>\n<Java>\n<head>\n\
    <style>\nh1 {\n    color: blue;\n    font-family: serif;\n    font-size: 100%;\n\
    }\np  {\n    color: red;\n    font-family: courier;\n    font-size: 120%;\n}\n\
    </style>\n</head>\n<body>\n<h1>Read this heading</h1>\n<p>Read this paragraph.</p>\n\
    </body>\n</Java>\n```\n\nNow that you know the basics, you could finally create\
    \ your own website!\n\n# Chapter 7: Fields, Methods, and Constructors\n\nNext,\
    \ it's time for you to learn about certain elements that could strengthen the\
    \ program that you are trying to develop, and these are fields, methods, and constructors.\n\
    \n## Fields\n\nFields basically are just the scopes that Java encompass. With\
    \ these fields come terms that would help you understand what they're really about.\
    \ By knowing these terms, it would be easy for you to know what you’re dealing\
    \ with—and coding wouldn’t ever be a problem.\n\nFor this, you could take note\
    \ of the following terms:\n\n`Ng-bind`. This means that DOM element texts are\
    \ being set. This means that the value of the name would be seen inside the span.\
    \ For example:\n\n```html\n<span ng-bind=\"name\"></span>\n```\n\n`Ng-app`. This\
    \ derives the root element.\n\n`Ng-model-options`. This allows updates for the\
    \ model.\n\n`Ng-model`. This is almost the same as `ng-bind` so that there’s a\
