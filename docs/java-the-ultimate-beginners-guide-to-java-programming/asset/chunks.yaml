    # Chapter 4: Primitive VS Reference Types


    Earlier, you learned about the primitive or independent data types in Java. You
    also have to know, though, that there are also things called reference types,
    and just like primitive ones, these are also in different categories and could
    do a lot of things—but have to be supported by primitive data.


    Are primitive data types better than those in the reference category? Not entirely.
    While Primitive types could stand on their own, there are certain things that
    reference data types can do that can make the program that you are trying to make
    a whole lot better.


    What exactly are these types?


    User Datagram Protocol


    This is an important member of the Internet Protocol Suite. It provides connectionless
    transmissions in such a way that they could actually be reliable, and that they
    would not ruin the protocol of the network in any way. They are perfect for time-sensitive
    applications that easily drop pockets. User Diagram Protocols are also:


    1\. It is capable of providing datagrams to the network;


    2\. It is transaction-oriented and work for both Network Time Protocols and Domain
    Name Systems;


    3\. It works with unidirectional communication, which is suitable for service
    discoveries and broadcast information;


    4\. It works for real-time applications (such as Twitter, Snapchat, Periscope,
    etc.) because it makes way of transmission delays. It also works for VOIP applications
    (such as Skype), and works for some games, as well;


    5\. It is suitable for a large number of clients, and is stateless. It also works
    for streaming applications, and;


    6\. It’s perfect for bootstrapping because it is simple and stateless.


    It also works for Octets 0 to 4, and even 20 to 160 in some cases.


    Transmission Control Protocol


    This provides error-checked, orderly, and reliable stream of octets between the
    IP Network and the various networks that it contains. This is used for email,
    and most of the World Wide Web, as well. This is also a latent, connectionless
    protocol, and works by processing data that has already been transmitted. It works
    from octets 0 to 160, containing source and destination ports. It also contains
    sequence numbers, and acknowledgment numbers.


    Data Offset is also reserved, together with window size, checksum, and urgent
    pointers, as well.


    Basically, what you can keep in mind is:


    1\. 16 bits identify the source port;


    2\. 16 bits also identify the receiving port;


    3\. 4 bits specify the data header in 32-bit words;


    4\. 32 bits identify the acknowledgment numbers;


    5\. 9-bits contain the 9-bit flags;


    6\. 3 bits define data that is reserved for future use.


    Other bits define options that you could create for your app or website using
    this programming language.


    Internet Control Message Protocol


    Another important protocol of JAVA, this one could send requested services and
    messages to the router, and also has its own protocol number. The difference is
    that it starts in the IPv4 Header, and is mostly just known as ‘1’. It also works
    between octets 0 to 4, where:


    1\. Code = Control Messages | ICMP Subtype


    2\. Type = Control Messages | ICMP Subtype


    3\. Rest of Header = Contents | ICMP Subtype


    4\. Checksum = Error Checking Data | ICMP Header and Data


    Data then derives a section in IPv4 where error-checking is done. Implementations
    are also accessible through APIs and various kinds of sockets, together with Network
    Discovery Protocols and microcontroller firmware.


    Address Resolution Protocol


    As the name suggests, this is a telecommunications protocol that makes it easy
    for communication apps and websites to work. It is used to map network addresses,
    making messaging—and even video calls—possible, and has also been used for important
    technologies, such as Xerox PARC Universal Packet, DEC Net, ChaosNet, and IPv4,
    amongst others. For this, you could keep in mind the following:


    1\. 0 – Hardware Type (HTYPE)


    2\. 2 – Protocol Type (PTYPE)


    3\. 4 – Hardware Address (HLEN) | Protocol Address (PLEN)


    4\. 6 – Operation (OPER)


    5\. 8 – Sender Hardware Address (SHA)


    6\. 10 - Next 2 succeeding bytes


    7\. 12 – Last 2 succeeding bytes


    8\. 14 – Sender Address Protocol (SAP)


    9\. 16 – last 2 succeeding bytes


    10\. 18 – Target Hardware Address (THA)


    11\. 20 – next 2 succeeding bytes


    12\. 22 – last 2 succeeding bytes


    13\. 24 – Target Protocol Address (TPA)


    14\. 26 – last 2 succeeding bytes


    Internet Protocol


    And finally—and also the one that’s closely related to JAVA, Internet Protocol
    is all about providing boundaries in the network, as well as relaying datagrams
    that allow internet-networking to happen.'
