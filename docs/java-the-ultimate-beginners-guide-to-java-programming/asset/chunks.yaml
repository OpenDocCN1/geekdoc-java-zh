    ## Constructors


    And of course, there are also constructors that help connect everything, bind
    them together, and make your program work effectively even with different elements
    involved.


    Constructors allow the connect() method to happen and to be prevalent in the program.
    This contains the names of the IP, together with the hosts and is usually returned
    to the sender, or caller. To code, just follow what you see below:


    #include <netinet/in.h>


    #include "Javastream.h"


    class FirstJavaConnector


    {


      public


        JavaStream* connect(int port, const char* server);


      private:


        int resolveHost(const char* host, struct in_addr* addr);


    };


    You also have to take note that connected to the descriptor of the socket that
    allow peer Java Ports and peer IP Addresses to show up onscreen. Take note that
    this does not use other languages, except for C++, unlike its contemporaries in
    Java.


    For this, you have to use the following syntax:


    JavaStream::getPeerIP()


    JavaStream::getPeerPort()


    To code, just follow what you see below:


    #include <arpa/inet.h>


    #include "newJavastream.h"


    JavaStream::JavaStream(int sd, struct sockaddr_in* address) : msd(sd) {


        char ip[50];


        inet_ntop(PF_INET, (struct in_addr*)&(address->sin_addr.s_addr),


                  ip, sizeof(ip)-1);


        m_peerIP = ip;


        m_peerPort = ntohs(address->sin_port);


    }


    Destructors


    Destructors are then able to close any connections that you have made. For example,
    if you want to log out of one of your social networking accounts, you’re able
    to do it because destructors are around. To code, just follow what you see below:


    JavaStream::~JavaStream()


    {


        close(m_sd);


    }


    Getting Peer Information


    In order to get peer information, you have to make sure that you return both Java
    and IP information. This way, you could be sure that both server and client are
    connected to the network. You could also use the getpeername() socket so that
    when information is available, it could easily be captured and saved.


    To accept information, let the socket JavaAcceptor::accept() be prevalent in the
    network. This way, you could differentiate actions coming from the server and
    the client.


    Network I/O Methods


    For this, you have to use the syntax JavaStream::send() or JavaStream::receive().
    This way, you could easily know the number of bytes that are being sent and received
    and you could expect that buffering wouldn’t happen—and would not be a problem.


    Chapter 8 Encapsulation, Inheritance, and Polymorphism


    There are also Java elements that help determine how your program could be edited,
    and how it would appear when seen by others. These also encompass the depth of
    the program—or its heart, in other words. You can learn more about these below:


    ## Encapsulation


    First up is encapsulation, which makes use of a coupe of principles to be executed
    well. These Principles are:


    1\. Robustness Principle. This means that protocols have to be implemented but
    sending behavior has to be conservative, while receiving behavior should definitely
    be liberal. This means that you have to be careful in sending/receiving datagrams.
    It means that even if some software has deficiencies, it’s still important to
    make sure that you do not exploit its obscure protocols.


    2\. End-to-end Principle. This is one of those principles that continuously evolves.
    Overall intelligence and state are important for maintaining this expression,
    and it’s also essential for network address translators, firewalls, and in managing
    content caches, as well.


    Now, in order to provide Java with its much-needed abstraction layers, Encapsulation
    is done. It is aligned with the protocol suite’s functional division so that each
    level would be properly encapsulated and dealt with.'
