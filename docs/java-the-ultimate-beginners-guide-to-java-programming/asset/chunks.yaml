    # Rooting Mechanisms\n\nThere’s also such a thing as Rooting Mechanism (also known\
    \ as `$rootscope`). This uses the `ng-app` directive and is available for the\
    \ whole application—so you can say that it’s a really important part of the tutorial.\
    \ This also uses the scope that’s currently used.\n\nFor example:\n\n```html\n\
    <body ng-app=\"TheFirstApp\">\n  <p>The rootScope's favorite color:</p>\n  <h1>{{pink}}</h1>\n\
    \  <div ng-controller=\"myCtrl\">\n    <p>The scope of the controller's favorite\
    \ color:</p>\n    <h1>{{purple}}</h1>\n  </div>\n  <p>The rootScope's favorite\
    \ color is still:</p>\n  <h1>{{pink}}</h1>\n  <script>\n    var app = Java.module('TheFirstApp',\
    \ []);\n\n    app.run(function($rootScope) {\n      $rootScope.color = 'pink';\n\
    \    });\n\n    app.controller('myCtrl', function(Rscope) {\n      Rscope.color\
    \ = \"purple\";\n    });\n  </script>\n</body>\n```\n\n## Limiting Areas\n\nYou\
    \ also should understand where the scopes begin, and when they end. This will\
    \ make your program more coherent, and help you understand what needs to be done.\
    \ It’s like knowing what’s going on around you so you could easily deal with them.\
    \ This is not usually an issue unless you’re dealing with large DOM Applications.\
    \ The `ng-repeat` directive is essential for this one.\n\nFor this, you could\
    \ follow the code below:\n\n```html\n<div ng-app=\"TheFirstApp\" ng-controller=\"\
    myCtrl\">\n  <ul>\n    <li ng-repeat=\"x in thefirstapp\">{{x}}</li>\n  </ul>\n\
    </div>\n<script>\n  var app = Java.module('TheFirstApp', []);\n\n  app.controller('myCtrl',\
    \ function(Rscope) {\n    Rscope.names = [\"the\", \"first\", \"app\"];\n  });\n\
    </script>\n```\n\n## Methods\n\nMeanwhile, and as the name suggests, methods are\
    \ about the actions you should take in filling up those fields, and making sure\
    \ that your program would be as coherent and as well out, as possible.\n\nMethods,\
    \ in Java, are known as information payloads that are responsible for sending\
    \ data from the application to its own store, which could then be sent with the\
    \ syntax `store.dispatch()` and are known to be plain JavaScript objects, and\
    \ that is why the `type` property has to be used, and that types should then be\
    \ considered as string constants. If you have an app that’s already large enough,\
    \ it can then be moved to a separate module.\n\nHowever, you have to keep in mind\
    \ that methods don’t have to be depicted in separate files. In fact, you might\
    \ not even have to define them at all, but you do have to declare their codebases,\
    \ and understand the right type of syntax to be used.\n\nFor example:\n\n```javascript\n\
    const ADD_TODO = 'ADD_TODO'\n\n{\n  type: SET_VISIBILITY_FILTER,\n  type: ADD_TODO,\n\
    \  text: ‘Welcome to My First App’\n  filter: SHOW_COMPLETED\n}\n```\n\n## Action\
    \ Creators\n\nTrue to the name, Action Creators are the kind of functions that\
    \ are able to create methods, or have methods returned to the user. They create\
    \ valuable dispatches when invoked, and promote bound methods.\n\nDispatches or\
    \ `dispatch()` is something that you could directly access from the store, and\
    \ provide connection between Java and the reader, also known as Java-reader collect.\
    \ These action creators could also have certain side effects, which are also known\
    \ as methods of synchronicity and AJAX Responses.\n\nHere’s a sample proper code:\n\
    \n```javascript\nfunction addTodo(text) {\n  return {\n    type: ADD_TODO,\n \
    \   type: ADD_TODO,\n    text: text\n  }\n}\n\nfunction addTodoWithDispatch(text)\
    \ {\n  dispatch(completeTodo(index))\n  dispatch(addTodo(text))\n  dispatch(action)\n\
    \n  const boundCompleteTodo = (index) => dispatch(completeTodo(index))\n  const\
    \ boundAddTodo = (text) => dispatch(addTodo(text))\n\n  const action = {\n   \
    \ boundCompleteTodo(index),\n    boundAddTodo(text)\n  }\n}\n```\n\n## Source\
    \ Code\n\nTo code this properly, do make use of the following source code:\n\n\
    ```javascript\n/*\n* action types\n*/\nexport const TOGGLE_TODO = 'TOGGLE_TODO'\n\
    export const SET_VISIBILITY_FILTER = 'SET_VISIBILITY_FILTER'\nexport const ADD_TODO\
    \ = 'ADD_TODO'\n\nexport const SHOW_COMPLETED = 'SHOW_COMPLETED'\nexport const\
    \ SHOW_ALL = 'SHOW_ALL'\nexport const SHOW_ACTIVE = 'SHOW_ACTIVE'\n\n* other constants\n\
    * action creators\nexport function toggleTodo(index) {\n  return { type: TOGGLE_TODO,\
    \ index }\n}\n\nexport function setVisibilityFilter(filter) {\n  return { type:\
    \ SET_VISIBILITY_FILTER, filter }\n}\n\nexport function addTodo(text) {\n  return\
    \ { type: ADD_TODO, text }\n}\n```\n\n## Constructors\n\nAnd of course, there\
    \ are also constructors that help to to to to,,,,,,,,,,,,,,,,,,,,,,,,,,,,,..,,,,,.\
    \ below:\n\n```cpp\n#include <netinet/in.h>\n#include <arpa/inet.h>\n#include\
    \ \"newastream.h\"\n\nclass JavaConnector{\npublic:\n  JavaConnector(int sd, struct\
    \ sockaddr_in* address) : msd(sd) {\n    char ip[50];\n    inet_ntop(PF_INET,\
    \ &(address->sin_addr), ip, sizeof(ip)-1);\n    m_peerIP = ip;\n    m_peerPort\
    \ = ntohs(address->sin_port);\n  }\n\n  ~JavaConnector() {\n    close(msd);\n\
    \  }\n\n  int getPeerIP();\n  int getPeerPort();\n\nprivate:\n  int msd;\n  string\
    \ m_peerIP;\n  int m_peerPort;\n};\n```\n\nIn order to get peer information, you\
    \ have to make sure that you return both Java and IP. This way, you could be sure\
    \ that. You could also use `getpeername()` socket so that when information is\
    \ available, it could easily be captured and saved.\n\nTo accept information,\
    \ let the socket `JavaAcceptor::accept()` be prevalent in the network. This way,\
    \ you could differentiate actions coming from the server and the client.\n\n##\
    \ Network I/O Methods\n\nFor this, you have to use `JavaStream::send()` or `JavaStream::receive()`.\
    \ This way, you could easily know the number of bytes that are sent and received\
    \ and you could expect that buffering wouldn’t happen—and would not be a problem.\n\
    \nChapter 8 Encapsulation, Inheritance, and Polymorphism\n\nThere are also Java\
    \ elements that help determine how your program could be edited, and how it would\
    \ appear when seen by others. These also encompass the depth of the program—or\
    \ its heart, in other words. You can learn more about these below:\n\n### Encapsulation\n\
    \nFirst up is encapsulation, which makes use of a couple of principles to be executed\
    \ well. These Principles are:\n\n1. **Robustness Principle**: This means that\
    \ protocols have to be implemented but sending behavior has to be conservative,\
    \ while receiving behavior should definitely be liberal. This means that you have\
    \ to be careful in sending/receiving datagrams. It means that even if some software\
    \ has deficiencies, it’s still important to make sure that you do not exploit\
    \ its protocols.\n2. **End-to-end Principle**: This is one of those principles\
    \ that continuously evolves. Overall intelligence and state are important for\
    \ maintaining this expression, and it’s also essential for network address translators,\
    \ firewalls, and in managing content caches.\n\nNow, in order to provide Java\
    \ with its much-needed abstraction layers, Encapsulation is done. It is aligned\
    \ with the protocol suite’s functional division so that each level would be properly\
    \ encapsulated and dealt with.\n"
