    \n# 第 10 章 条件与控制流\n\n## 条件语句\n\n你知道有时，你倾向于编辑程序并赋予它个性化色彩吗？很好，条件语句在这很有帮助。条件语句的特点在于，它们在某种程度上赋予了你让程序属于自己的能力，为此，这里是一些你可以做的事情，以让程序按照你想要的方式运行。\n\
    \n## Java 表单\n\n当然，有时你需要为你的网站或应用程序添加表单，以便从你的订阅者那里获取信息，只需确保他们不是垃圾邮件机器人。为此，使用了以下输入元素：\n\
    \n1. 文本区域元素\n2. 按钮元素\n3. 选择元素\n4. 输入元素\n\n你还应该注意以下几：\n\n1. `Ng-click` 仅在用户点击按钮时直接调用\
    \ `reset()` 方法。\n2. `reset()` 方法使 `master` 和 `user` 对象相等。\n3. `formCTRL` 控制器专门用于控制你在应用程序或网站上的表单。\n\
    4. `ng-model` 将两个用户元素绑定在一起。\n5. `ng-app` 定义了主应用程序。\n\n为了让这更清晰，你可以尝试下面的示例：\n\n\
    ```html\n<div ng-app=\"myFavoriteApp\" ng-controller=\"formCtrl\">\n  <form novalidate>\n\
    \    名字:<br>\n    <input type=\"text\" ng-model=\"user.firstName\"><br>\n    姓:<br>\n\
    \    <input type=\"text\" ng-model=\"user.lastName\">\n    <br><br>\n    <button\
    \ ng-click=\"reset()\">重置</button>\n  </form>\n  <p>form = {{user}}</p>\n  <p>master\
    \ = {{master}}</p>\n</div>\n```\n\n```javascript\nvar app = Java.module('myFavoriteApp',\
    \ []);\n\napp.controller('formCtrl', function($scope) {\n    $scope.master = {firstName:\
    \ \"Harry\", lastName: \"Potter\"};\n    $scope.reset = function() {\n       \
    \ $scope.user = Java.copy($scope.master);\n    };\n    $scope.reset();\n});\n\
    ```\n\n现在，如果你想为你的表单创建选择框（Select Boxes），你可以尝试下面的示例。这些框很重要，因为它们允许人们选择他们想要的内容。\n\n\
    ```html\n<form>\n选择主题:\n<select ng-model=\"myVar\">\n  <option value=\"\">\n \
    \ <option value=\"stdnts\">Students</\n  <option value=\"cats\">Cats</\n  <option\
    \ value=\"house\">houses</\n</select>\n</form>\n```\n\n同时，你还可以通过 `ng-model` 指令放置单选按钮。这意味着虽然人们在屏幕上看到的可能不同，但只有选中的项目会被反映——使得应用程序中发生的情况更容易理解。\n\
    \n例如，如果你的选择框是：\n\n```html\n<form>\n选择主题:\n<select ng-model=\"myVar\">\n  <option\
    \ value=\"\">\n  <option value=\"stdnts\">Students</\n  <option value=\"cats\"\
    >Cats</\n  <option value=\"house\">houses</\n</select>\n</form>\n```\n\n那么意味着你的值应该基于下面的变量：\n\
    \n```html\n<form>\n挑选主题:\n<input type=\"radio\" ng-model=\"myVar\" value=\"stdnts\"\
    >Students\n<input type=\"radio\" ng-model=\"myVar\" value=\"cats\">cats\n<input\
    \ type=\"radio\" ng-model=\"myVar\" value=\"house\">houses\n</form>\n```\n\n"
- fmt: "\nAs for checkboxes, it basically means that you want to know whether something\
    \ has a value of true or false. When you apply the `ng-model` directive, the value\
    \ will then show up in the application that you are using. In this case, you have\
    \ to code like what you see below:\n\n```html\n<form>\n    Check to show your\
    \ favorite header:\n    <input type=\"checkbox\" ng-model=\"myVar\">\n</form>\n\
    \n<h1 ng-show=\"myVar\">My Favorite Header</h1>\n```\n\n# Java Tables\n\nAnd of\
    \ course, to explain things better, you could also add tables to your applications\
    \ or websites. The `ng-repeat` directive is essential here. To display data in\
    \ a table, you could try doing the following:\n\n```html\n<div ng-app=\"myFavoriteApp\"\
    \ ng-controller=\"studentsCtrl\"> \n  <table>\n    <tr ng-repeat=\"x in names\"\
    >\n      <td>{{ x.Name }}</td>\n      <td>{{ x.houses}}</td>\n    </tr>\n  </table>\n\
    </div>\n```\n\n```javascript\n<script>\nvar app = Java.module('myFavoriteApp',\
    \ []);\n\napp.controller('customersCtrl', function($scope, $java) {\n    $java.get(\"\
    $Java://www.hogwartshouses.com/Java/customers.php\")\n    .then(function (response)\
    \ {$scope.names = response.data.records;});\n});\n</script>\n```\n\nTo keep your\
    \ information in order, you have to use the `orderBy` directive. A good example\
    \ could be seen below:\n\n```html\n<table>\n  <tr ng-repeat=\"x in names | orderBy\
    \ : 'house'\">\n    <td>{{ x.Name }}</td>\n    <td>{{ x.house }}</td>\n  </tr>\n\
    </table>\n```\n\nYou could also display CSS style elements on your table. To do\
    \ it, you could try coding the elements below:\n\n```css\n<style>\ntable, th ,\
    \ td {\n  border: 1px purple;\n  border-collapse: collapse;\n  padding: 8px;\n\
    }\ntable tr:nth-child(odd) {\n  background-color: #f1f1f1;\n}\ntable tr:nth-child(even)\
    \ {\n  background-color: #ffffff;\n}\n</style>\n```\n\nAnd finally, to customize\
    \ it even more, you could change letters to uppercase, enter table index, and\
    \ use `$odd` and `$even` factors. Take a look at the examples below:\n\n```html\n\
    <table>\n  <tr ng-repeat=\"x in names\">\n    <td ng-if=\"$odd\" style=\"background-color:#f1f1f1\"\
    >{{ x.Name }}</td>\n    <td ng-if=\"$even\">{{ x.Name }}</td>\n    <td ng-if=\"\
    $odd\" style=\"background-color:#f1f1f1\">{{ x.house }}</td>\n    <td ng-if=\"\
    $even\">{{ x.house }}</td>\n  </tr>\n</table>\n\n<table>\n  <tr ng-repeat=\"x\
    \ in names\">\n    <td>{{ $index + 1 }}</td>\n    <td>{{ x.Name }}</td>\n    <td>{{\
    \ x.house }}</td>\n  </tr>\n</table>\n\n<table>\n  <tr ng-repeat=\"x in names\"\
    >\n    <td>{{ x.Name }}</td>\n    <td>{{ x.house| uppercase }}</td>\n  </tr>\n\
    </table>\n```\n\n# Control Flow Statements\n\nAnd then of course, there are also\
    \ control flow statements that help make the program run smoothly by making use\
    \ of the Java controllers that you have in your system.\n\nFor this one, you have\
    \ to use the `JavaConnector::connect` syntax so that you could get the string\
    \ of IP Addresses that you want, together with servers and clients that would\
    \ really work together.\n\nYou could then use the `struct sockaddr_in` for the\
    \ server and set it to `PF_INET` while listening for connections that you need.\
    \ You also have to take note of the following controllers:\n\n### Controllers\
    \ 17 to 20\nThese are known as `connect::passing()` because it points the user\
    \ to the right structure with the help of `sockaddr_in` pointers. It will help\
    \ you know how long the structure is so that you would not confuse it with the\
    \ other functions of the program and the network itself.\n\n### Controller 16\n\
    This is the `socket()` first argument so that you could select specifics and choose\
    \ protocol families of the communication networks. `SOCK_STREAM` and `PF_INET`\
    \ should be used as they work well together.\n\n### Controllers 13 to 15\nThese\
    \ controllers are collectively known as `JavaConnector::resolvehost`. They’re\
    \ able to convert the name string and DNS Host to an IP Address so that every\
    \ assumption made could be converted to different network addresses.\n\n### Controllers\
    \ 5 to 10\nThese are used to resolve the host because they work under the syntax\
    \ `JavaConnector::resolvehostname()` and they are able to convert IP Addresses\
    \ and host names with the help of `getaddridinfo()` function. This is way better\
    \ than just `gethostname()` because it is known as a safe thread.\n\nNow, in order\
    \ to connect to the server, you should just code the following:\n\n```cpp\n#include\
    \ <string.h>\n#include <netdb.h>\n#include <arpa/inet.h>\n#include \"Javaconnector.h\"\
    \n\nMyJavaStream* MyJavaConnector::connect(const char* server, int port)\n{\n\
