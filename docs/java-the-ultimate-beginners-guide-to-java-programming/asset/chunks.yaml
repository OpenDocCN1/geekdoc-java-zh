    ```html\n<div ng-app=\"\" ng-init=\"myCol='pink'\">\n  <input style=\"background-color:{{myCol}}\"\
    \ ng-model=\"myCol\" value=\"{{myCol}}\">\n</div>\n```\n\n## Arrays\n\nThis works\
    \ like JavaScript Arrays. If you’re going to use `ng-bind`, it would look something\
    \ like this one below:\n\n```html\n<div ng-app=\"\" ng-init=\"points=[2,4,6,8]\"\
    >\n  <p>The third result is <span ng-bind=\"points[2]\"></span></p>\n</div>\n\
    ```\n\nBut, if you’re going to take away `ng-bind`, it would look something like\
    \ this one:\n\n```html\n<div ng-app=\"\" ng-init=\"points=[2,4,6,8]\">\n  <p>The\
    \ third result is {{ points[2] }}</p>\n</div>\n```\n\n## Strings\n\nStrings connect\
    \ things together, even in programming. Java Strings also work like JavaScript.\
    \ It could go two ways—just take a look at the examples below:\n\n```html\n<div\
    \ ng-app=\"\" ng-init=\"firstName='Mark';lastName='Ruffalo'\">\n  <p>The name\
