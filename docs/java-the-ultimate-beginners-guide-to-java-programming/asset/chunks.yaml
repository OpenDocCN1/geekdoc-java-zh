  trans: "\n\n请查看下图以理解该过程是如何运作的：\n\n第一个主机 $\\rightarrow$ 路由器 $\\rightarrow$ 路由器 $\\\
    rightarrow$ 第二个主机\n应用 – 进程到进程——应用\n传输 – 主机到主机 –传输\n网络 – 网络 – 网络 – 网络\n链路 – 链路\
    \ – 链路 – 链路\n以太网 – 光纤 – 以太网\n\n请注意，层之上的内容是用户应用程序本身中频繁使用的。然而，并没有单一必须遵循的架构模型，特别是当你拥有像\
    \ OSI 模型这样定义模糊的模型时。这是它与其他互联网协议（尤其是早期协议）的主要区别。封装随后涵盖了以下 4 个抽象层：\n\n### 抽象层\n\n\
    首先，查看以下数据：\n\n数据 $\\rightarrow$ 应用\n`UDP Header | UDP DATA` $\\rightarrow$ 传输\n\
    `IP Header | IP Data` $\\rightarrow$ 互联网\n`Frame Header | Frame Data | Frame Footer`\
    \ $\\rightarrow$ 链路\n\n这意味着：\n\n### 应用层\n\n应用层封装了提供交换应用程序的服务所使用的协议。这包括主机配置协议、路由服务和网络支持服务。示例包括文件传输协议\
    \ (`FTP`)、超文本传输协议 (`HTTP`) 和动态主机配置协议 (`DHCP`)。通过这种方式，你可以根据所使用的协议来降低数据传输。\n\n应用层还将传输层视为一个带有黑盒的稳定网络，允许通信贯穿整个应用程序，同时确保应用程序每个部分的关键属性仍能尽可能良好地工作。应用层发生的任何情况都不会影响传输层和网络层，因为流量通常不会检查该层。然而，有时\
    \ `NAT`（网络地址转换器）必须考虑应用程序的负载，并确保一切运行顺畅。\n\n### 传输层\n\n传输层包含涉及 Java 的数据通道，它还建立了进程到进程的连接和端到端消息传输，为网络中的任何特定目的提供正确的信息和逻辑支持。这可以通过连接的、无连接的或面向对象的方式实现。\n\
    \n端口在传输层的帮助下建立，那里存在着逻辑结构。它基本上意味着：\n\n1. 数据应该是正确的——且只能有极小的错误；\n2. 数据应该按顺序到达；\n\
    3. 数据应该包含流量拥塞控制；\n4. 被丢弃或丢失的数据包必须重发，且；\n5. 重复数据必须丢弃。\n\n当这种情况发生时，你可以预计即使是最新版本的流控制协议也能在你的网络中正常工作。不过，你不需要依赖无连接的数据报，因为正如名称所示，它们不提供正确的连接——而且非常不可靠。\n\
    \n### 网络层\n\n基本上，网络层的工作方式是负责发送正确的数据包，并确保它们可以跨越多个网络移动。它的主要功能是：\n\n1. **数据包路由**。这完全关于将数据包从目的地的源发送到需要使用的地方。唯一的协议号标识了这些包。\n\
    2. **主机识别与地址**。通过分级 IP 系统的帮助实现了这一点。\n\n### 链路层\n\n网络方法在链路层中定义。其范围是中间路由器，以及主机网络，包括用于描述网络拓扑结构的协议，数据报也由于各种目标和假设以及严格的分层而变得显而易见。这意味着你可以在任何硬件网络技术之上实现\
    \ Java。\n\n在链路层的帮助下，数据包可以轻松地移动并接收驱动卡数据包，这也意味着该层对应于 OSI 模型。\n\n## 继承\n\n此外，还有继承描述了每个类将继承什么，或者它们如何与其父页面建立关系。\n\
    \n你需要理解的 Java 是它是一个开放系统互连 (OSI) 互联网模型，这意味着它在继承 `()` 中工作。为了建立连接，你需要利用监听继承，以便主机可以调用——换句话说，就是连接。\n\
    \n通过输入 `listen()`，用户将能够接受程序上的 `()` 块。这会将 `()` 程序绑定在一起并使其完整。对于这一点，你可以记住以下几点：\n\n\
    - 客户端：`socket()` $\\rightarrow$ `connect()` $\\rightarrow$ `write()` $\\rightarrow$\
    \ `read()` $\\rightarrow$ `close()`\n- 建立连接：`connect` $\\rightarrow$ `accept()`\n\
    - 发请求：`write()` $\\rightarrow$ `read()`\n- 接收回复：`write()` $\\rightarrow$ `read()`\n\
    - 关闭连接：`close()` $\\rightarrow$ `read()`\n- 服务端：`socket()` $\\rightarrow$ `bind()`\
    \ $\\rightarrow$ `listen()` $\\rightarrow$ `accept()` $\\rightarrow$ `read()`\
    \ $\\rightarrow$ `write()` $\\rightarrow$ `read()`\n\n如你所示，你能够将它们相互连接，因为你已经在程序中建立了正确的继承——也称为角色。\n\
    \n### 互联网模型\n\n现在，为了让事情更清晰，你必须理解互联网的基本模型。\n\n互联网模型结合了会话层、表示层、应用层以及 Java 的端口，为\
    \ `bind()` 的发生提供了道路。现在，你必须等待发送端和接收端的响应。这使得请求和消息的交换很容易，直到连接关闭。如果处理得当，发送者和接收者不必担心消息未发送或通信被中断。\n\
    \n连接随后可以仅包含在一个线程中，这样网络理解起来就不会太复杂。通过这种方式，可以创建正确的协议栈。因此，它应该是这样的：\n\n- **OSI 模型**：应用\
    \ $\\rightarrow$ 表示 $\\rightarrow$ 会话 $\\rightarrow$ 传输 $\\rightarrow$ 网络 $\\\
    rightarrow$ 数据链路 $\\rightarrow$ 物理\n- **互联网模型**：应用 $\\rightarrow$ 传输 $\\rightarrow$\
    \ 网络 $\\rightarrow$ 链路\n- **互联网协议**：`HTTPS`, `DNS`, `SSH`, `POP3`, `FTP`, `NNTP`,\
    \ `TelNet`, `IMAP` $\\rightarrow$ `Java`, `UDP` $\\rightarrow$ `IP`, `ICMP`, `ARP`,\
    \ `DHCP`, `Ethernet`, `ADSL`, `PPP`\n\n### 模式\n\n现在，你还需要记住以下几：\n\n1. **Java Stream**。负责为网络提供\
    \ I/O 机制，并提供对端地址。\n2. **Java Acceptor**。允许从工厂类被动接受 Java 机制。它建立了到客户端的连接。\n3. **Java\
    \ Connector**。允许连接到接字，以便服务器之间有良好的关系。\n\n### Stream 类\n\n要开始编程，你可以从 Stream 类开始。它为涉及\
    \ Java 的各种方法提供发送和接收的正确数据，并且包含接字描述符并授予其他权限。某些可能是私有的，以为用户提供更好的体验。\n\n编写代码，你可以遵循以下内容：\n\
    \n```cpp\n#include <sys/types.h>\n#include <sys/socket.h>\n#include <unistd.h>\n\
    #include <string>\n\nusing namespace std\n\nclass JavaStream {\n    int m_sd;\n\
    \    string m_peerIP;\n    int m_peerPort;\n\npublic:\n    class JavaAcceptor;\n\
    \    class JavaConnector;\n\n    ~JavaStream();\n    ssize_t send(char* buffer,\
    \ size_t len);\n    ssize_t receive(char* buffer, size_t len);\n    string getPeerIP();\n\
    \    int getPeerPort();\n\nprivate:\n    JavaStream(int sd, struct sockaddr_in*\
    \ address);\n    JavaStream();\n    JavaStream(const JavaStream& stream);\n};\n\
    ```\n\n## 多态\n\n基本上，Java 多态是定义应用程序的，并作为应用程序不同部分的容器。它们还作为各种应用程序控制器的容器，并且它们始终属于多态。\n\
    \n"
- fmt: "\nIn order to create a module, you have to make use of the `Java.mobile` function.\
    \ What’s inside the parenthesis would then determine the element where the application\
    \ would run in, so that you could add filters, directives, and controllers to\
    \ the application. An example is shown below:\n\n```html\n<div ng-app=\"FavoriteApp\"\
    >...</div>\n```\n\n<script>\nvar app = Java.module(\"FavoriteApp\", []); \n</script>\n\
    ```\n\n## Adding Directives\n\nNow, you could add directives to improve the functionality\
    \ of the app you are trying to create. Directives are pretty much the terminologies\
    \ given in Chapter 2, but could also be any of the following:\n\n1. Validation\
    \ Properties, such as `$error`, `$invalid`, and `$dirty`.\n2. `Java.isDate`. Returns\
    \ value if date is the reference.\n3. `Java.isArray`. Pertains to array values.\n\
    4. `Java.isNumber`. Pertains to numerical values.\n5. `Java.isFunction`. Pertains\
    \ to functional values.\n6. `Java.isElement`. Pertains to DOM Elements.\n7. `Java.isDefined`.\
    \ Pertains to references that are defined.\n8. `Java.equals`. Pertains to equal\
    \ values on the program.\n9. `Java.isUndefined`. Pertains to undefined values.\n\
    10. `Java.isObject`. Pertains to object references.\n11. `Java.forEach()`. This\
    \ helps execute various functions whether in arrays, or objects.\n12. `Java.Copy()`.\
    \ This gives you deep copies of arrays.\n13. `Java.uppercase()`. This changes\
    \ values to uppercase letters.\n14. `Java.lowercase()`. This changes values to\
    \ lowercase letters.\n15. `<textarea>`. Modifies text area’s behaviors.\n16. `<select>`.\
    \ Helps you create selections on the program.\n17. `<script>`. This modifies behavior’s\
    \ script.\n18. `<input>`. This helps you input different functions to the program.\n\
    19. `<form>`. This helps you create forms in the program.\n20. `<a>`. This one\
    \ helps input variables in the program.\n21. `Java.module()`. This helps you create,\
    \ retrieve, or register Polymorphism.\n22. `Java.element()`. This makes use of\
    \ JQuery to wrap the HTML with.\n23. `Java.bootstrap()`. This manually starts\
    \ JS.\n\nYou could also use your own directives, which means the code would look\
    \ like this:\n\n```html\n<div ng-app=\"FavoriteApp\" w3-test-directive></div>\n\
    ```\n\n<script>\nvar app = Java.module(\"FavoriteApp\", []);\napp.directive(\"\
    w3TestDirective\", function() {\n  return {\n    template : \"I was made in a\
    \ directive!\"\n  };\n});\n</script>\n```\n\n## Adding Controllers\n\nOf course,\
    \ you could also add controllers to your codes by using `ng-controller` directive.\
    \ Basically, it would show up like this:\n\n```html\n<div ng-app=\"FavoriteApp\"\
    \ ng-controller=\"myCtrl\">\n{{ FirstName + \" \" + lastName }}\n</div>\n```\n\
    \n<script>\nvar app = Java.module(\"FavoriteApp\", []);\napp.controller(\"myCtrl\"\
    , function($scope) {\n  $scope.firstName = \"Harry\";\n  $scope.lastName = \"\
    Styles\";\n});\n</script>\n```\n\n## File Polymorphism and Controllers\n\nThen,\
    \ you could create Polymorphism and controllers inside the files so that your\
    \ applications would be more defined. For this one, you could copy what’s shown:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<script src=\"http://ajax.googleapis.com/ajax/libs/Javajs/1.4.8/Java.min.js\"\
    ></script>\n<body>\n<div ng-app=\"FavoriteApp\" ng-controller=\"myCtrl\">\n{{\
    \ firstName + \" \" + lastName }}\n</div>\n<script src=\"FavoriteApp.js\"></script>\n\
    <script src=\"myCtrl.js\"></script>\n</body>\n</html>\n```\n\n## Loading the Library\n\
    \nTo load the Java Library, you have to load it before the `<head>` and before\
    \ the `<body>` tag. For this, you have to use the `Java.module` directive and\
    \ you’d get something like the below:\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n\
    <script src=\"http://ajax.googleapis.com/ajax/libs/Javajs/1.4.8/Java.min.js\"\
    ></script>\n<div ng-app=\"FavoriteApp\" ng-controller=\"myCtrl\">\n{{ AppfirstName\
    \ + \" \" + ApplastName }}\n</div>\n<script>\nvar app = Java.module(\"FavoriteApp\"\
    , []);\napp.controller(\"myCtrl\", function($scope) {\n  $scope.firstName = \"\
    Harry\";\n  $scope.lastName = \"Styles\";\n});\n</script>\n</body>\n</html>\n\
    ```\n\n# Chapter 9 Abstract Classes and Interfaces\n\nMeanwhile, there are also\
    \ abstract classes and interfaces that are more complicated, more detailed versions\
    \ of classes. What they do is they help make your program just a bit more secure.\
    \ After all, if all classes and programs were the same, then it would be hard\
    \ to protect it from hacking or phishing of any kind.\n\nWhen it comes to classes\
    \ and interfaces, here's what you've got to understand…\n\n## Filters\n\nNo, this\
    \ has nothing to do with adding filters to your photos to spruce them up. Filters\
    \ give your applications more life—give them some form of body and soul—and could\
    \ allow you to code what you want to happen to the app. This means you have to\
    \ use the following variables:\n\n1. `uppercase`. This helps you format a string\
    \ to uppercase letters.\n2. `orderBy`. This arranges the array based on the expressions\
    \ used.\n3. `number`. This helps format numbers into strings.\n4. `lowercase`.\
    \ This then formats the string into lowercase letters.\n5. `limitTo`. This one\
    \ limits strings or arrays.\n6. `json`. This helps format objects.\n7. `filter`.\
    \ This helps you select.\n8. `date`. This helps format dates.\n9. `currency`.\
    \ This helps format numbers.\n\n## Expression Filters\n\nThe pipe `|` is used\
    \ to add expressions. For this, you could try:\n\n```html\n<div ng-app=\"FavoriteApp\"\
    >\n<p>{{ firstName | uppercase }}</p>\n</div>\n```\n\n```html\n<div ng-app=\"\
    FavoriteApp\">\n<p>{{ lastName | lowercase }}</p>\n</div>\n```\n\n## Currency\
    \ Filters\n\nNow, you could try transforming a number into currency by making\
    \ use of filters, such as the below:\n\n```html\n<div ng-app=\"FavoriteApp\">\n\
    <h1>{{ price }}\n</div>\n```\n\n## Directive Filters\n\nOf course, you could also\
    \ tweak your directives by making use of filters. The `ng-repeat` directive is\
    \ essential here, as well as the pipe `|`. For example, if you want your variables\
    \ in order, you should use `orderBy`:\n\n```html\n<div ng-app=\"FavoriteApp\"\
    >\n<ul>\n<li ng-repeat=\"x in names | orderBy:'hogwartouses'\">\n{{ x.name + ',\
    \ ' + x.hogwartouse }}\n</li>\n</ul>\n</div>\n```\n\n## Filter\n\nWait, what?\
    \ Well, this is actually a thing! What happens here is that you’re allowed to\
    \ choose a subset from an array, but you have to take note that you can only use\
    \ what you have chosen for the same array. For example:\n\n```html\n<div ng-app=\"\
    FavoriteApp\">\n<ul>\n<li ng-repeat=\"x in names | filter:i'\"> \n\n## More about\
    \ Interface\n\nJava Interface, also known as `$java`, is essential because it\
    \ helps you get and read data from remote servers. Not only that, it also allows\
    \ responses to be sent to you—making the process a two-way experience. You also\
    \ have to make use of certain methods which are as follows:\n\n1. `.put()`\n2.\
    \ `.post()`\n3. `.patch()`\n4. `.jsonp()`\n5. `.head()`\n6. `.get()`\n7. `.delete()`\n\
    \nIn order to make a simple request to the server, you could try this below:\n\
    \n```html\n<div ng-app=\"FavoriteApp\">\n<p>Welcome to my Blog:</p>\n<h1>Welcome\
    \ to my Blog</h1>\n</div>\n```\n\n<script>\nvar app = Java.module('myApp', []);\n\
    app.controller('myCtrl', function($scope, $java) {\n  $java.get(\"welcome.htm\"\
    )\n  .then(function(response) {\n    $scope.myWelcome = response.data;\n  });\n\
    });\n</script>\n```\n\nTo use the given methods above, you could code something\
    \ that looks like the below:\n\n```javascript\nvar app = Java.module('myApp',\
    \ []);\napp.controller('myCtrl', function($scope, $java) {\n  $java({\n    method:\
    \ \"GET\",\n    url: \"welcome.htm\"\n  }).then(function mySucces(response) {\n\
    \    $scope.myWelcome = response.data;\n  });\n});\n```\n"
