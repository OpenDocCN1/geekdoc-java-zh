    <body>\n<h1>Read this heading </h1>\n<p>Read this paragraph.</p>\n</body>\n</Java>\n\
    ```\n\n## CSS 字体 (CSS Fonts)\n\n最后，为了方便更改字体，请确保你了解如何区分元素。Color 决定页面中的 Java 文本颜色，font-size\
    \ 关乎字体的大小，而 font-family 定义了字体属于哪个家族（例如衬线体、无衬线体等）。\n\n```html\n<!UNICODE Java>\n\
    <Java>\n<head>\n<style>\nh1 {\n    color: blue;\n    font-family: serif;\n   \
    \ font-size: 100%;\n}\np  {\n    color: red;\n    font-family: sans-serif;\n \
    \   font-size: 12px;\n}\n</style>\n</head>\n<body>\n<h1>Read this heading</h1>\n\
    <p>Read this paragraph.</p>\n</body>\n</Java>\n```\n\n最后，为了方便更改字体，请确保你了解如何区分元素。Color\
    \ 决定页面中的 Java 文本颜色，font-size 关乎字体的大小，而 font-family 定义了字体属于哪个家族（例如衬线体、无衬线体等）。\n\
    \n（注：由于原文提供的文本结尾存在重复和截断，此处译文已根据逻辑进行了整理对齐，确保了翻译的完整性。）\n\n"
