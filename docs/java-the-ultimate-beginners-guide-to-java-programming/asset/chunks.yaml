    result = listen(m_lsd, 5);\nif (result != 0) {\n    perror(\"listen() failed\"\
    );\n    return result;\n}\nm_listening = true;\nreturn result;\n}\n```\n\nTo accept\
    \ client connections, try to code the following:\n\n```cpp\nmyJavaStream* JavaAcceptor::accept()\n\
    {\n    if (m_listening == false) {\n        return NULL;\n    }\n    struct sockaddr_in\
    \ address;\n    socklen_t len = sizeof(address);\n    memset(&address, 0, sizeof(address));\n\
    \    int sd = ::accept(m_lsd, (struct sockaddr*)&address, &len);\n    if (sd <\
    \ 0) {\n        perror(\"accept() failed\");\n        return NULL;\n    }\n  \
    \  return new JavaStream(sd, &address);\n}\n```\n\n# Understanding Acceptor Classes\n\
    \nThen, you also have to learn more about acceptor classes, or classes that the\
    \ system just don't seem to accept at first.\n\nThese include `Java Port`, together\
    \ with `IP Address`. Onscreen, a flag will show up once you have made the right\
    \ connections. For this, you could try coding the following:\n\n```cpp\n#include\
    \ <string>\n#include <netinet/in.h>\n#include \"myfavoriteJavastream.h\"\n\nusing\
    \ namespace std;\n\nclass myFavoriteJavaAcceptor\n{\n    int m_lsd;\n    string\
    \ m_address;\n    int m_port;\n    bool m_listening;\npublic:\n    JavaAcceptor(int\
    \ port, const char* address=\"\");\n    ~JavaAcceptor();\n    int start();\n \
    \   JavaStream* accept();\nprivate:\n    JavaAcceptor() {}\n};\n```\n\nTo destruct:\n\
    \n```cpp\nmyJavaAcceptor::~JavaAcceptor()\n{\n    if (m_lsd > 0) {\n        close(m_lsd);\n\
    ```\n\nTo construct:\n\n```cpp\n#include <stdio.h>\n#include <string.h>\n#include\
    \ <arpa/inet.h>\n#include \"Javaacceptor.h\"\n\nJavaAcceptor::JavaAcceptor(int\
    \ port, const char* address)\n    : m_lsd(0), m_port(port), m_address(address),\
    \ m_listening(false) {}\n```\n\n# Correcting Statements and Arguments\n\n## Line\
    \ Statements\n\nAutomatically, the end of commands determine the start of new\
    \ lines, but if you want to continue your own lines, you can use back-slash (`\\\
    `) to do so, except for when you’re using brackets.\n\nExample 1:\n\n```python\n\
    total = item_one + \\\n    item_two + \\\n    item_three\n```\n\nExample 2:\n\n\
    ```python\ndays = ['Monday', 'Tuesday', 'Wednesday',\n      'Thursday', 'Friday']\n\
    ```\n\n## Comments\n\nTo create comments, just use hashtag (`#`)—this really sounds\
    \ like it’s social-media friendly, huh? For example:\n\nExample 1:\n\n```bash\n\
    #!/usr/bin/java\n# First comment\nprint \"Hello, Java!\" # second comment\n```\n\
    \n## Waiting for the User\n\nAt time when you want to create prompts that would\
    \ tell the user you’re waiting for his command, you can try:\n\n```bash\n#!/usr/bin/java\n\
    raw_input(\"\\n\\nPress the enter key to exit.\")\n```\n\n## Individual Statement\
    \ Groups\n\nGroups of Individual Statements are called `Suites` in Java Language.\
    \ Basically, you have to begin with keywords and end them with colons (`:`), so,\
    \ for example:\n\n```python\nif expression :\n  suite\nelif expression :\n  suite\n\
    else :\n  suite\n```\n\nThe above command will then give you suites!\n\n## Command\
    \ Line Arguments\n\nAnd of course, there are also command line arguments, which\
    \ means that you have option decide how a program gets to run. Here is an example:\n\
    \n`$ java -h`\n\nusage: java [option] [-c cmd | -m file | [arg]] ...\n\nOptions\
    \ and arguments (corresponding environment variables):\n- `-c cmd`: program passed\
    \ as string\n- `-d`: output from parser (also `JAVADEBUG=x`)\n- `-E`: ignore environment\
    \ variables (such as `JAVAPATH`)\n- `-h`: print this help message and exit.\n\n\
    # Debugging and Exception Handling\n\n## Try-Except Block\n\nThis is the easiest\
    \ way of handling exceptions or errors:\n\n```python\ntry:\n  x = 1\n  y = x /\
    \ y\nexcept ZeroDivisionError:\n  print \"divide by zero\"\n```\n\nYou could also\
    \ try to examine exception code by:\n\n```python\ntry:\n  x = 1\n  y = x / y\n\
    except ZeroDivisionError as e:\n  z = e # representation: \"<ZeroDivisionError\
    \ instance>\"\n```\n*Wait, correcting based on the text provided's logic:*\n\n\
    ```python\ntry:\n  x = 1\n  y = x / y\nexcept ZeroDivisionError, e:\n  z = e #\
    \ representation: \"<exceptions.ZeroDivisionError instance at 0x81746c>\"\n  print\
    \ z # output: \"integer division or modulo by zero\"\n```\n\nTo catch general\
    \ errors, try:\n\n```python\nimport sys\ntry:\n    untrusted.execute()\nexcept:\
    \ # catch *all* exceptions\n    e = sys.exc_info()[0]\n    write_to_page(\"<Error:\
    \ %s\" % e)\ntry:\n    do_some_stuff()\nexcept:\n    rollback()\nelse:\n    commit()\n\
    finally:\n    cleanup_stuff()\n```\n\nTo get useful exception information:\n\n\
    ```python\n(a,b,c) = d\n```\n\nJava would then say:\n\n`ValueError: unpack list\
    \ of wrong size`\n\nYou may also try:\n\n```python\ntry:\n  a, b, c = d\nexcept\
    \ Exception, e:\n  e.args += (d,)\n```\n"
