  raw: 'As for checkboxes, it basically means that you want to know whether something
    has a value of true or false. When you apply the ng-model directive, the value
    will then show up in the application that you are using. In this case, you have
    to code like what you see below:


     <form>


        Check to show your favorite header:


        <input type="checkbox" ng-model="myVar">


    </form>


    <h1 ng-show="myVar">My Favorite Header</h1>


    Java Tables


    And of course, to explain things better, you could also add tables to your applications
    or websites. The ng-repeat directive is essential here. To display data in a table,
    you could try doing the following:


    <div ng-app="myFavoriteApp" ng-controller="studentsCtrl"> 


    <table>


      <tr ng-repeat="x in names">


        <td>{{ x.Name }}</td>


        <td>{{ x.houses}}</td>


      </tr>


    </table>


    </div>


    <script>


    var app = Java.module(''myFavoriteApp'', []);


    app.controller(''customersCtrl'', function($scope, $java) {


        $java.get("$Java://www.hogwartshouses.com/Java/customers.php")


        .then(function (response) {$scope.names = response.data.records;});


    });


    </script>


    To keep your information in order, you have to use the orderBy directive. A good
    example could be seen below:


    <table>


      <tr ng-repeat="x in names | orderBy : ''house''">


        <td>{{ x.Name }}</td>


        <td>{{ x.house }}</td>


      </tr>


    </table>


    You could also display CSS style elements on your table. To do it, you could try
    coding the elements below:


    <style>


    table, th , td {


      border: 1px purple;


      border-collapse: collapse;


      padding: 8px;


    }


    table tr:nth-child(odd) {


      background-color: #f1f1f1;


    }


    table tr:nth-child(even) {


      background-color: #ffffff;


    }


    </style>


    And finally, to customize it even more, you could change letters to uppercase,
    enter table index, and use $odd and $even factors. Take a look at the examples
    below:


    <table>


    <tr ng-repeat="x in names">


    <td ng-if="$odd" style="background-color:#f1f1f1">{{ x.Name }}</td>


    <td ng-if="$even">{{ x.Name }}</td>


    <td ng-if="$odd" style="background-color:#f1f1f1">{{ x.house }}</td>


    <td ng-if="$even">{{ x.house }}</td>


    </tr>


    </table>


                  <table>


      <tr ng-repeat="x in names">


        <td>{{ $index + 1 }}</td>


        <td>{{ x.Name }}</td>


        <td>{{ x.house }}</td>


      </tr>


    </table>


    <table>


      <tr ng-repeat="x in names">


        <td>{{ x.Name }}</td>


        <td>{{ x.house| uppercase }}</td>


      </tr>


    </table>


    ## Control Flow Statements


    And then of course, there are also control flow statements that help make the
    program run smoothly by making use of the Java controllers that you have in your
    system.


    For this one, you have to use the JavaConnector::connect syntax so that you could
    get the string of IP Addresses that you want, together with servers and clients
    that would really work together.


    You could then use the struct sockaddr_in for the server and set it to PF_INET
    while listening for connections that you need. You also have to take note of the
    following controllers:


    Controllers 17 to 20


    These are known as connect::passing() because it points the user to the right
    structure with the help of sockaddr_in pointers. It will help you know how long
    the structure is so that you would not confuse it with the other functions of
    the program and the network itself.


    Controller 16


    This is the socket() first argument so that you could select specifics and choose
    protocol families of the communication networks. SOCK_STREAM and PF_INET should
    be used as they work well together.


    Controllers 13 to 15


    These controllers are collectively known as JavaConnector::resolvehost. They’re
    able to convert the name string and DNS Host to an IP Address so that every assumption
    made could be converted to different network addresses.


    Controllers 5 to 10


    These are used to resolve the host because they work under the syntax JavaConnector::resolvehostname()
    and they are able to convert IP Addresses and host names with the help of getaddridinfo()
    function. This is way better than just gethostname() because it is known as a
    safe thread.


    Now, in order to connect to the server, you should just code the following:


    #include <string.h>


    #include <netdb.h>


    #include <arpa/inet.h>


    #include "Javaconnector.h"


    MyJavaStream* MyJavaConnector::connect(const char* server, int port)


    {


        struct sockaddr_in address;


        memset (&address, 0, sizeof(address));


        address.sin_family = AF_INET;


        address.sin_port = htons(port);


        if (resolveHostName(server, &(address.sin_addr)) != 0) {


            inet_pton(PF_INET, server, &(address.sin_addr));       


        }


        int sd = socket(AF_INET, SOCK_STREAM, 0);


        if (::connect(sd, (struct sockaddr*)&address, sizeof(address)) != 0) {


            return NULL;


        }


        return new MYJavaStream(sd, &address);


    }


    And to resolve the host name, make sure that you input the following:


    int JavaConnector::resolveHostName(const char* hostname, struct in_addr* addr)


    {


        struct addrinfo *res;


        int result = getaddrinfo (hostname, NULL, NULL, &res);


        if (result == 0) {


            memcpy(addr, &((struct sockaddr_in *) res->ai_addr)->sin_addr,


                   sizeof(struct in_addr));


            freeaddrinfo(res);


        }


        return result;


    }


    # Chapter 11 Dealing with Errors and Exceptions


    Finally, you also have to learn to deal with times when the program just does
    not seem to work the way you want it to. For the most part, prevention is better,
    and that''s what you''d be learning about here. Just like the chapter before this,
    this one also makes use  of controllers so you can tweak them, and correct the
    errors you''ll find.


    Correcting errors always starts by trying to listen or trying to figure out what''s
    wrong with the network that hosts, or will be hosting your program. For this,
    you should use the JavaAcceptor::start syntax so you’d be able to see if a socket
    already exists. You’ll see zero (0) appear if it does.


    You should also take note of the following controllers:


    Controllers 28 to 34


    These make use of the listen() function. Basically, you could make Java Requests
    and have them queued for you to support participating branches of your network.
    Some Operating Systems do not support this, though, but then you could just try
    using the function m_listening.


    Controllers 23 to 27


    These are able to bind the listening socket by returning the proper message/bind()
    values.


    Controllers 20 to 21


    These allow you to listen to the IP and search for connections even abruptly after
    certain connections end. However, you can disable this by making use of SO_REUSEADDR
    function.


    Controllers 13 to 18


    With these, you’ll know whether the server is listening or not because it uses
    m_address. It also puts and converts bytes into order and prevents socket failures
    while listening is in order.


    Controllers 9 to 12


    These will help you initialize new inheritance in your network by making use of
    the PF_INET protocol. Java Port will come in order, too.


    Controller 7


    This will help you create the description for the socket so that you could create
    different calls for different inheritance.


    Controllers 3 to 10


    Meanwhile, if you are trying to accept connections from your clients, these controllers
    will come in handy. For these, the JavaAcceptor::accept syntax is extremely useful.
    This way, you get all the qualified functions in one thread and you won’t get
    confused.


    To start listening for connections, try the codes below:


    int myJavaAcceptor::start()


    {


        if (m_listening == true) {


            return 0;


        }


        m_lsd = socket(PF_INET, SOCK_STREAM, 0);


        struct sockaddr_in address;


        memset(&address, 0, sizeof(address));


        address.sin_family = PF_INET;


        address.sin_port = htons(m_port);


        if (m_address.size() > 0) {


            inet_pton(PF_INET, m_address.c_str(), &(address.sin_addr));


        }


        else {


            address.sin_addr.s_addr = INADDR_ANY;


        }


        int optval = 18;


        setsockopt(m_lsd, SOL_SOCKET, SO_REUSEADDR, &optval, sizeof optval);'
