    # Chapter 5: Object Oriented Programming


    If you may recall, it''s been said early on that Java is a type of programming
    language that’s object-oriented, which means that it deals with the creation,
    and use of data types, strings, arrays, lists, numbers, and all these things that
    could make a program better—and it''s not just the usual letters or numbers that
    you wouldn''t understand.


    Since Java is an object-oriented language, you can expect that it will work because—and
    for—the following reasons:


    One Source of Truth


    Otherwise known as the “Single Source of Truth”, this means that the whole app
    is stored in a tree’s object that is then placed in a single store. With this,
    creating apps becomes easy, and debugging, together with introspection, also becomes
    easy. Certain functions—such as undo/redo—becomes trivial. It uses the following
    codes:


    console.log(store.getState())


