    \n```python\n>>> front_sensor_on = True\n>>> front_sensor_on\nTrue\n```\n\n你必须记住的是，布尔逻辑决定了一个确切的结果——你想要看到的特定内容。就像哲学逻辑中存在对立平方一样，也存在布尔逻辑对立广场。下面是一个示例：\n\
