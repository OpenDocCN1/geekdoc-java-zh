    1\. Validation Properties, such as: $error, $invalid, and $dirty.


    2\. Java.isDate. Returns value if date is the reference.


    3\. Java.isArray. Pertains to array values.


    4. Java.isNumber. Pertains to numerical values.


    5\. Java.isFunction. Pertains to functional values.


    6\. Java.isElement. Pertains to DOM Elements.


    7\. Java.isDefined. Pertains to references that are defined.


    8\. Java.equals. Pertains to equal values on the program.


    9\. Java.isUndefined. Pertains to undefined reference values.


    10\. Java.isObject. Pertains to object references.


    11. Java.forEach(). This helps elements execute various functions whether in arrays,
    or objects.


    12. Java.Copy(). This gives you deep copies of arrays or objects.


    13\. Java.uppercase(). This changes values to uppercase letters


    14. Java.lowercase(). This changes values to lowercase letters


    15\. <textarea>. Modifies the text area’s behaviors.


    16. <select>. Helps you create selections on the program.


    17\. <script>. This modifies the behavior’s script.


    18\. <input>. This helps you input different functions to the program.


    19\. <form>. This helps you create forms in the program.


    20\. <a>. This one helps input various variables in the program.


    21\. Java.module(). This helps you create, retrieve, or register Polymorphism.


    22\. Java.element(). This makes use of JQuery Elements to wrap the HTML Element
    with.


    23\. Java.bootstrap(). This manually starts Java JS.


    You could also use your own directives, which means the code would look something
    like the one below:


    <div ng-app="FavoriteApp" w3-test-directive></div>


    <script>


    var app = Java.module("FavoriteApp", []);


    app.directive("w3TestDirective", function() {


        return {


            template : "I was made in a directive constructor!"


        };


    });


    </script>


    ## Adding Controllers


    Of course, you could also add controllers to your codes by using the ng-controller
    directive. Basically, it would show up like this:


    <div ng-app="FavoriteApp" ng-controller="myCtrl">


    {{ AppFirstName + " " + ApplastName }}


    </div>


    <script>


    var app = Java.module("FavoriteApp", []);


    app.controller("myCtrl", function($scope) {


        $scope.firstName = "Harry";


        $scope.lastName = "Styles";


    });


    </script>


    ## File Polymorphism and Controllers


    Then, you could create Polymorphism and controllers inside the files so that your
    applications would even be more defined. For this one, you could copy what’s shown
    below:


    <!DOCTYPE html>


    <html>


    <script src="http://ajax.googleapis.com/ajax/libs/Javajs/1.4.8/Java.min.js"></script>


    <body>


    <div ng-app="FavoriteApp" ng-controller="myCtrl">


    {{ firstName + " " + lastName }}


    </div>


    <script src="FavoriteApp.js"></script>


    <script src="myCtrl.js"></script>


    </body>


    </html>


    ## Loading the Library


    To load the Java Library, you have to load it before the <head> and before the
    <body> tag.


    For this, you have to use the Java.module directive and you’d get something like
    the one below:


    <!DOCTYPE html>


    <html>


    <body>


    <script src="http://ajax.googleapis.com/ajax/libs/Javajs/1.4.8/Java.min.js"></script>


    <div ng-app="FavoriteApp" ng-controller="myCtrl">


    {{ AppfirstName + " " + ApplastName }}


    </div>


    <script>


    var app = Java.module("FavoriteApp", []);


    app.controller("myCtrl", function($scope) {


        $scope.firstName = "Harry";


        $scope.lastName = "Styles";


    });


    </script>


    </body>


    </html>


    # Chapter 9 Abstract Classes and Interfaces


    Meanwhile, there are also abstract classes and interfaces that are more complicated,
    bit more detailed versions of classes. What they do is they help make your program
    just tad bi more secure. After all , if all classes and programs were the same,
    then it would be hard to protect it from hacking or phishing of any kind.


    When it comes to classes and interfaces, here''s what you''ve got to understand…


    ## Filters


    No, this has nothing to do with adding filters to your photos to spruce them up.
    Filters give your applications more life—give them some form of body and soul—and
    could allow you to code what you want to happen to the app. This means you have
    to use the following variables:


    1. uppercase. This helps you format a string to uppercase letters.


    2\. orderBy. This arranges the array based on the expressions used.


    3. number. This helps format numbers into strings.


    4\. lowercase. This then formats the string into lowercase letters.


    5\. limitTo. This one limits strings or arrays into characters or elements that
    have been specified for them.


    6\. json. This helps format objects into JSON Strings.


    7. filter. This helps you select subsets from arrays.


    8\. date. This helps format dates into formats that you have specified for them.


    9\. currency. This then helps you format currency numbers.


    ## Expression Filters


    The pipe character (|) is used to add expressions inside filters. For this, you
    could try the examples below:


    <div ng-app="myFavoriteApp" ng-controller="personCtrl">


    <p>The name is {{ firstName | uppercase }}</p>


    </div>


    <div ng-app="myFavoriteApp" ng-controller="personCtrl">


    <p>The name is {{ lastName | lowercase }}</p>


    </div>


    ## Currency Filters


    Now, you could try transforming a number into currency by making use of currency
    filters, such as the one you see below:


    <div ng-app="myFavoriteApp" ng-controller="costCtrl">


    <h1>How Much: {{ price | currency }}</h1>


    </div>


    ## Directive Filters


    Of course, you could also tweak your directives by making use of directive filters.
    The ng-repeat directive is essential here, as well as the pipe (|).


    For example, if you want your variables to be in order, you should use orderBy,
    and code like this:


    <div ng-app="myFavoriteApp" ng-controller="namesCtrl">


    <ul>


      <li ng-repeat="x in names | orderBy:''hogwartshouses''">


        {{ x.name + '', '' + x.hogwartshouse }}


      </li>


    </ul>


    </div>


    ## Filter Filter


    Wait, what?


    Well, this is actually a thing! What happens here is that you’re allowed to choose
    a subset from a certain array, but you have to take note that you can only use
    what you have chosen for the same array. For example:


    <div ng-app="myFavoriteApp" ng-controller="namesCtrl">


    <ul>


      <li ng-repeat="x in names | filter : ''i''">


        {{ x }}


      </li>


    </ul>


    </div>


    ## More about Interface


    Java Interface, also known as $java, is essential because it helps you get and
    read data from remote servers. Not only that, it also allows responses to be sent
    to you—making the process a two-way, understandable experience.


    You also have to make use of certain methods which are as follows:


    1\. .put()


    2\. .post()


    3\. .patch()


    4\. .jsonp()


    5\. .head()


    6\. .get()


    7\. .delete()


    In order to make a simple request to the server, you could try this could below:


    <div ng-app="myFavoriteApp" ng-controller="myCtrl"> 


    <p>Welcome to my Blog:</p>


    <h1>{{Welcome to my Blog}}</h1>


    </div>


    <script>


    var app = Java.module(''myApp'', []);


    app.controller(''myCtrl'', function($scope, $java) {


        $java.get("welcome.htm")


        .then(function(response) {


            $scope.myWelcome = response.data;


        });


    });


    </script>


    To use the given methods above, you could code something that looks like the one
    below:


    var app = Java.module(''myApp'', []);


    app.controller(''myCtrl'', function($scope, $java) {


        $java({


            method : "GET",


            url : "welcome.htm"


        }).then(function mySucces(response) {


            $scope.myWelcome = response.data;'
  toc: []
  trans: "\n\n为了创建一个模块，你必须使用 `Java.mobile` 函数。括号中的内容将决定应用程序运行的元素，这样你就可以为应用程序添加过滤器、指令和控制器。示例如所示：\n\
    \n```html\n<div ng-app=\"FavoriteApp\">...</div>\n```\n\n<script>\nvar app = Java.module(\"\
    FavoriteApp\", []); \n</script>\n```\n\n## 添加指令 (Directives)\n\n现在，你可以添加指令来改进你正在创建的应用程序的功能。指令基本上是第\
    \ 2 章中给术语，但也可以是以下任何一项：\n\n1. 验证属性，例如 `$error`、`$invalid` 和 `$dirty`。\n2. `Java.isDate`。如果日期是引用，则返回值。\n\
    3. `Java.isArray`。涉及数组值。\n4. `Java.isNumber`。涉及数值值。\n5. `Java.isFunction`。涉及函数值。\n\
    6. `Java.isElement`。涉及 DOM 元素。\n7. `Java.isDefined`。涉及定义的引用。\n8. `Java.equals`。涉及程序中的相等值。\n\
    9. `Java.isUndefined`。涉及未定义的值。\n10. `Java.isObject`。涉及对象引用。\n11. `Java.forEach()`。这有助于在数组或对象中执行各种函数。\n\
    12. `Java.Copy()`。这提供了数组的深拷贝。\n13. `Java.uppercase()`。将值更改为大写字母。\n14. `Java.lowercase()`。将值更改为小写字母。\n\
    15. `<textarea>`。修改文本区域的行为。\n16. `<select>`。帮助你在程序中创建选择。\n17. `<script>`。修改行为脚本。\n\
    18. `<input>`。帮助你向程序输入不同的函数。\n19. `<form>`。帮助你在程序中创建表单。\n20. `<a>`。这帮助你在程序中输入变量。\n\
    21. `Java.module()`。这帮助你创建、检索或注册多态。\n22. `Java.element()`。利用 JQuery 包装 HTML。\n\
    23. `Java.bootstrap()`。手动启动 JS。\n\n你也可以使用自己的指令，这意味着代码看起来像这样：\n\n```html\n<div\
    \ ng-app=\"FavoriteApp\" w3-test-directive></div>\n```\n\n<script>\nvar app =\
    \ Java.module(\"FavoriteApp\", []);\napp.directive(\"w3TestDirective\", function()\
    \ {\n  return {\n    template : \"I was made in a directive!\"\n  };\n});\n</script>\n\
    ```\n\n## 添加控制器 (Controllers)\n\n当然，你也可以通过 `ng-controller` 指令向你的代码添加控制器。基本上，它看起来如下：\n\
    \n```html\n<div ng-app=\"FavoriteApp\" ng-controller=\"myCtrl\">\n{{ FirstName\
    \ + \" \" + lastName }}\n</div>\n```\n\n<script>\nvar app = Java.module(\"FavoriteApp\"\
    , []);\napp.controller(\"myCtrl\", function($scope) {\n  $scope.firstName = \"\
    Harry\";\n  $scope.lastName = \"Styles\";\n});\n</script>\n```\n\n## 文件多态 (Polymorphism)\
    \ 与控制器\n\n然后，你可以在文件中创建多态和控制器，这样你的应用程序就会更加定义。对于这一点，你可以复制显示的内容：\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<script src=\"http://ajax.googleapis.com/ajax/libs/Javajs/1.4.8/Java.min.js\"\
    ></script>\n<body>\n<div ng-app=\"FavoriteApp\" ng-controller=\"myCtrl\">\n{{\
    \ firstName + \" \" + lastName }}\n</</div>\n<script src=\"FavoriteApp.js\"></script>\n\
    <script src=\"myCtrl.js\"></script>\n</body>\n</html>\n```\n\n## 加载库 (Loading\
    \ the Library)\n\n要加载 Java 库，你必须在 `<head>` 之前和 `<body>` 标签之前加载它。对于这一点，你必须使用 `Java.module`\
    \ 指令，你会得到如下内容：\n\n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script src=\"http://ajax.googleapis.com/ajax/libs/Javajs/1.4.8/Java.min.js\"\
    ></script>\n<div ng-app=\"FavoriteApp\" ng-controller=\"myCtrl\">\n{{ AppfirstName\
    \ + \" \" + ApplastName }}\n</</div>\n<script>\nvar app = Java.module(\"FavoriteApp\"\
    , []);\napp.controller(\"myCtrl\", function($scope) {\n  $scope.firstName = \"\
    Harry\";\n  $scope.lastName = \"Styles\";\n});\n</script>\n</body>\n</html>\n\
    ```\n\n# 第 9 章 抽象类与接口 (Abstract Classes and Interfaces)\n\n同时，还有更复杂、更详细的类类版本，即抽象类和接口。它们的作用是帮助你的程序稍微安全一点。毕竟，如果所有的类和程序都是相同的，那么很难保护它们免受任何形式的黑客或钓鱼。\n\
    \n涉及到类和接口时，你需要理解这些……\n\n## 过滤器 (Filters)\n\n不，这与给照片添加过滤器来修饰无关。过滤器赋予你的应用程序更多活力——赋予它们某种形式和灵魂——并允许你编写你希望发生在应用程序上的代码。这意味着你必须使用以下变量：\n\
    \n1. `uppercase`。这帮助你将字符串格式化为大写。\n2. `orderBy`。根据使用的表达式对数组进行排序。\n3. `number`。这有助于将数字格式化为字符串。\n\
    4. `lowercase`。这会将字符串格式化为小写字母。\n5. `limitTo`。这限制字符串或数组。\n6. `json`。这有助于格式化对象。\n\
    7. `filter`。这帮助你选择。\n8. `date`。这有助于格式化日期。\n9. `currency`。这有助于格式化数字。\n\n## 表达式过滤器\
    \ (Expression Filters)\n\n管道符号 `|` 用于添加表达式。对于这一点，你可以尝试：\n\n```html\n<div ng-app=\"\
    FavoriteApp\">\n<p>{{ firstName | uppercase }}</p>\n</div>\n```\n\n```html\n<div\
    \ ng-app=\"FavoriteApp\">\n<p>{{ lastName | lowercase }}</p>\n</div>\n```\n\n\
    ## 货币过滤器 (Currency Filters)\n\n现在，你可以尝试使用过滤器将数字转换为货币，如下所示：\n\n```html\n<div ng-app=\"\
    FavoriteApp\">\n<h1>{{ price }}\n</div\n```\n\n## 指令过滤器 (Directive Filters)\n\n\
    当然，你还可以通过过滤器来调整你的指令。`ng-repeat` 指令在这里至关重要，正如管道符号 `|`。例如，如果你希望变量排序，你应该使用 `orderBy`：\n\
    \n```html\n<div ng-app=\"FavoriteApp\">\n<ul>\n<li ng-repeat=\"x in names | orderBy:'hogwarts'\"\
    >\n{{ x.name + ', ' + x.hogwarts }}\n</li>\n</ul>\n</div>\n```\n\n## 过滤器 (Filter)\n\
    \n等等，什么？嗯，这实际上是真的！这里发生的是你允许从数组中选择子集，但你必须注意只能使用你选择的内容。例如：\n\n```html\n<div ng-app=\"\
    FavoriteApp\">\n<ul>\n<li ng-repeat=\"x in names | filter:i'\">\n\n## 关于接口更多 (More\
    \ about Interface)\n\nJava 接口（称为 `$java`）至关重要，因为它帮助你从远程服务器获取和读取数据。不仅如此，它还允许响应发送给你——使过程成为一种双向体验。你还必须使用某些方法，如下：\n\
    \n1. `.put()`\n2. `.post()`\n3. `.patch()`\n4. `.jsonp()`\n5. `.head()`\n6. `.get()`\n\
    7. `.delete()`\n\n为了向服务器发送简单的请求，你可以尝试以下：\n\n```html\n<div ng-app=\"FavoriteApp\"\
    >\n<p>欢迎来到我的博客：</p>\n<h1>欢迎来到我的博客</h1>\n</div>\n```\n\n<script>\nvar app = Java.module('myApp',\
    \ []);\napp.controller('myCtrl', function($scope, $java) {\n  $java.get(\"welcome.htm\"\
    )\n  .then(function(response) {\n    $scope.myWelcome = response.data;\n  });\n\
    });\n</script>\n```\n\n为了使用上面给的方法，你可以编写如下所示的代码：\n\n```javascript\nvar app = Java.module('myApp',\
    \ []);\napp.controller('myCtrl', function($scope, $java) {\n  $java({\n    method:\
    \ \"GET\",\n    url: \"welcome.htm\"\n  }).then(function mySucces(response) {\n\
    \    $scope.myWelcome = response.data;\n  });\n});\n```\n\n"
- fmt: "\n```javascript\n    }, function myError(response) {\n        $scope.myWelcome\
    \ = response.statusText;\n    });\n});\n```\n\nThere are also certain properties\
    \ that have to be observed if you want to code HTTP or services. These are the\
    \ ones listed below:\n\n1. `.statusText`. This is a string that defines the HTTP\
    \ Status.\n2. `.status`. This is a number that defines the HTTP Status.\n3. `.headers`.\
    \ This function is used to get information regarding the function.\n4. `.data`.\
    \ This is an object or string that carries server responses.\n5. `.config`. This\
    \ is used to generate requests from the objects you have onscreen.\n\nTo understand\
    \ this better, you could check out the examples below:\n\n```javascript\nvar app\
    \ = Java.module('myFavoriteApp', []);\n\napp.controller('myCtrl', function($scope,\
    \ $java) {\n    $java.get(\"welcometomyblog.htm\")\n    .then(function(response)\
    \ {\n        $scope.content = response.data;\n        $scope.statuscode = response.status;\n\
    \        $scope.statustext = response.statustext; \n    });\n});\n```\n\n```javascript\n\
    var app = Java.module('myFavoriteApp', []);\n\napp.controller('myCtrl', function($scope,\
    \ $java) {\n    $java.get(\"wrongfilename.htm\")\n    .then(function(response)\
    \ {\n        //First function handles success\n        $scope.content = response.data;\n\
    \    }, function(response) {\n        //Second function handles error\n      \
    \  $scope.content = \"Something is wrong\";\n    });\n});\n```\n\n## JSON Object\n\
    \nMeanwhile, the JSON Object is all about how you could transport data from JavaScript\
    \ to Java, and vice-versa. The `ng-repeat` directive should be looped for this\
    \ function. For example, you want to import data from a Blogspot blog to a WordPress\
    \ one, it means that you are making use of a JSON Object.\n\nYou should also take\
    \ note that `$java.get()` is all about reading the JSON Data, while `$java()`\
    \ is mostly about the `XMLHttpRequestObject`. Here’s a good example:\n\n```html\n\
    <div ng-app=\"myFavoriteApp\" ng-controller=\"studentsCtrl\"> \n<ul>\n  <li ng-repeat=\"\
    x in myData\">\n    {{ x.Name + ', ' + x.house }}\n  </li>\n</ul>\n</div>\n```\n\
    \n```javascript\nvar app = Java.module('myApp', []);\n\napp.controller('studentsCtrl',\
    \ function($scope, $java) {\n    $java.get(\"students.php\").then(function(response)\
    \ {\n        $scope.myData = response.data.records;\n    });\n});\n```\n\n## Services\n\
    \nIt’s also important to use services because they allow certain functions to\
    \ be limited only for your application so other people would not go ahead and\
    \ copy them, and have you dealing with copyright claims.\n\nThere are a lot of\
    \ services that Java offers, but the most important one is `$location`. This allows\
    \ you to save certain objects to the cloud and keep them safe, so that even if\
    \ your computer or external drives break down, you know your data would still\
    \ be around—which is important especially if you’re dealing with programs and\
    \ applications. Here are some examples:\n\n```javascript\nvar app = Java.module('myFavoriteApp',\
    \ []);\n\napp.controller('studentsCtrl', function($scope, $location) {\n    myUrl\
    \ = $location.absUrl();\n});\n```\n\nYou could also use the `$timeout` service\
    \ or `window.setTimeout` to help you create countdowns—these are mostly used for\
    \ events, shows, and the like. For example:\n\n```javascript\nvar app = Java.module('myFavoriteApp',\
    \ []);\n\napp.controller('myCtrl', function($scope, $timeout) {\n    $scope.myHeader\
    \ = \"Hi People!\";\n    $timeout(function () {\n        $scope.myHeader = \"\
    How are you doing today?\";\n    }, 2016);\n});\n```\n\nMeanwhile, the `$java`\
    \ service could be used to obtain data coming from the server. Here’s a good example:\n\
    \n```javascript\nvar app = Java.module('myFavoriteApp', []);\n\napp.controller('myCtrl',\
    \ function($scope, $java) {\n    $java.get(\"welcometomyblog.htm\").then(function\
    \ (response) {\n        $scope.myWelcome = response.data;\n    });\n});\n```\n\
    \nYou could also try customizing your services by doing the following:\n\n```javascript\n\
    var app = Java.module('myFavorite', []);\n\napp.controller('myCtrl', function($scope,\
    \ $timeout) {\n    $scope.myHeader = \"Hi everyone!\";\n    $timeout(function\
    \ () {\n        $scope.myHeader = \"How are you doing today?\";\n    }, 2000);\n\
    });\n```\n\n```javascript\nvar app = Java.module('Favoriteapp', []);\n\napp.controller('myCtrl',\
    \ function($scope, $interval) {\n    $scope.theTime = new Date().toLocale();\n\
    \    $interval(function () {\n        $scope.theTime = new Date().toLocale();\n\
    \    }, 1010);\n});\n```\n\n```javascript\napp.controller('myCtrl', function($scope,\
    \ hexafy) {\n    $scope.hex = hexafy.myFunc(255);\n});\n\napp.service('hexafy',\
    \ function() {\n    this.myFunc = function (x) {\n        return x.toString(16);\n\
    \    }\n});\n```\n\n```javascript\napp.filter('myFormat', ['hexify', {\n    return\
    \ function(x) {\n        return hexify.myFunc(x);\n    };\n}]);\n\napp.controller('myCtrl',\
    \ function($scope, hexafy) {\n    $scope.hex = hexafy.myFunc(259);\n});\n```\n\
    \n# Chapter 10 Conditional and Control Flow\n\n## Conditional Statements\n\nYou\
    \ know how sometimes, you tend to edit you program and give it a personal touch?\
    \ Well, Conditional Statements help out with that. The thing about conditional\
    \ statements is somehow, they give you the capacity to make the program your own,\
    \ and for that matter, here are some of those things you can do to make the program\
    \ work the way you want it.\n\n## Java Forms\n\nOf course, there are also times\
    \ when you need to add forms to your website or application so you could get information\
    \ from your subscribers, just to make sure they are not spambots. For this, the\
    \ following input elements are used:\n\n1. text area elements\n2. button elements\n\
    3. select elements\n4. input elements\n\nYou should also take note of the following:\n\
    \n1. `Ng-click` is used to invoke the `reset()` method directly only when the\
    \ user clicks the button.\n2. The `reset()` method makes `master` and `user` objects\
    \ equals.\n3. The `formCTRL` controller is all about controlling the forms that\
    \ you have on your application or website.\n4. `ng-model` binds two user elements\
    \ together.\n5. The `ng-app` then defines the main application.\n\nTo make this\
    \ clearer, you could try the example below:\n\n```html\n<div ng-app=\"myFavoriteApp\"\
    \ ng-controller=\"formCtrl\">\n  <form novalidate>\n    First Name:<br>\n    <input\
    \ type=\"text\" ng-model=\"user.firstName\"><br>\n    Last Name:<br>\n    <input\
    \ type=\"text\" ng-model=\"user.lastName\">\n    <br><br>\n    <button ng-click=\"\
    reset()\">RESET</button>\n  </form>\n  <p>form = {{user}}</p>\n  <p>master = {{master}}</p>\n\
    </div>\n```\n\n```javascript\nvar app = Java.module('myFavoriteApp', []);\n\n\
    app.controller('formCtrl', function($scope) {\n    $scope.master = {firstName:\
