    There are also certain properties that have to be observed if you want to code
    HTTP or services. These are the ones listed below:


    1\. .statusText. This is a string that defines the HTTP Status.


    2\. .status. This is a number that defines the HTTP Status.


    3\. .headers. This function is used to get information regarding the function.


    4\. .data. This is an object or string that carries server responses.


    5\. .config. This is used to generate requests from the objects you have onscreen.


    To understand this better, you could check out the examples below:


    var app = Java.module(''myFavoriteApp'', []);


    app.controller(''myCtrl'', function($scope, $java) {


        $java.get("welcometomyblog.htm")


        .then(function(response) {


            $scope.content = response.data;


            $scope.statuscode = response.status;


            $scope.statustext = response.statustext; 


        });


    });


    var app = Java.module(''myFavoriteApp'', []);


    app.controller(''myCtrl'', function($scope, $java) {


        $java.get("wrongfilename.htm")


        .then(function(response) {


            //First function handles success


            $scope.content = response.data;


        }, function(response) {


            //Second function handles error


            $scope.content = "Something is wrong";


        });


    });


    ## JSON Object


    Meanwhile, the JSON Object is all about how you could transport data from JavaScript
    to Java, and vice-versa. The ng-repeat directive should be looped for this function.
    For example, you want to import data from a Blogspot blog to a WordPress one,
    it means that you are making use of a JSON Object.


    You should also take note that $java.get() is all about reading the JSON Data,
    while $java() is mostly about the XMLHttpRequestObject. Here’s a good example:


    <div ng-app="myFavoriteApp" ng-controller="studentsCtrl"> 


    <ul>


      <li ng-repeat="x in myData">


        {{ x.Name + '', '' + x.house }}


      </li>


    </ul>


    </div>


    <script>


    var app = Java.module(''myApp'', []);


    app.controller(''studentsCtrl'', function($scope, $java) {


        $java.get("students.php").then(function(response) {


            $scope.myData = response.data.records;


        });


    });


    </script>


    ## Services


    It’s also important to use services because they allow certain functions to be
    limited only for your application so other people would not go ahead and copy
    them, and have you dealing with copyright claims.


    There are a lot of services that Java offers, but the most important one is $location.
    This allows you to save certain objects to the cloud and keep them safe, so that
    even if your computer or external drives break down, you know your data would
    still be around—which is important especially if you’re dealing with programs
    and applications. Here are some examples:


    var app = Java.module(''myFavoriteApp'', []);


    app.controller(''studentsCtrl'', function($scope, $location) {


        myUrl = $location.absUrl();


    });


    You could also use the $timeout service or window.setTimeout to help you create
    countdowns—these are mostly used for events, shows, and the like. For example:


    var app = Java.module(''myFavoriteApp'', []);


    app.controller(''myCtrl'', function($scope, $timeout) {


        $scope.myHeader = "Hi People!";


        $timeout(function () {


            $scope.myHeader = "How are you doing today?";


        }, 2016);


    });


    Meanwhile, the $java service could be used to obtain data coming from the server.
    Here’s a good example:


    var app = Java.module(''myFavoriteApp'', []);


    app.controller(''myCtrl'', function($scope, $java) {


        $java.get("welcometomyblog.htm").then(function (response) {


            $scope.myWelcome = response.data;


        });


    });


    You could also try customizing your services by doing the following:


    var app = Java.module(''myFavoriteapp'', []);


    app.controller(''myCtrl'', function($scope, $timeout) {


        $scope.myHeader = "Hi everyone!";


        $timeout(function () {


            $scope.myHeader = "How are you doing today?";


        }, 2000);


    });


    var app = Java.module(''myFavoriteapp'', []);


    app.controller(''myCtrl'', function($scope, $interval) {


        $scope.theTime = new Date().toLocaleTimeString();


        $interval(function () {


            $scope.theTime = new Date().toLocaleTimeString();


        }, 1010);


    });


    app.controller(''myCtrl'', function($scope, hexafy) {


        $scope.hex = hexafy.myFunc(255);


    });


    app.service(''hexafy'', function() {


        this.myFunc = function (x) {


            return x.toString(16);


        }


    });


    app.filter(''myFormat'',[''hexify'', function(hexify) {


        return function(x) {


            return hexify.myFunc(x);


        };


    }]);


    app.controller(''myCtrl'', function($scope, hexafy) {


        $scope.hex = hexafy.myFunc(259);


    });


    # Chapter 10 Conditional and Control Flow Statements


    ## Conditional Statements


    You know how sometimes, you tend to want to edit you program and give it a more
    personal touch? Well, Conditional Statements certainly help out with that.


    The thing about conditional statements is that somehow, they give you the capacity
    to truly make the program your own, and for that matter, here are some of those
    things that you can do to make the program work the way you want it to.


    ## Java Forms


    Of course, there are also times when you need to add forms to your website or
    application so you could get information from your subscribers, just to make sure
    that they are not spambots. For this, the following input elements are used:


    1\. text area elements


    2\. button elements


    3\. select elements


    4\. input elements


    You should also take note of the following:


    1\. Ng-click is used to invoke the reset () method directly but only when the
    user clicks the button.


    2\. The reset () method makes master and user objects equals.


    3\. The formCTRL controller is all about controlling the forms that you have on
    your application or website.


    4\. The ng-model binds two user elements together.


    5\. The ng-app then defines the main Java application.


    To make this clearer, you could try the example given below:


    <div ng-app="myFavoriteApp" ng-controller="formCtrl">


      <form novalidate>


        First Name:<br>


        <input type="text" ng-model="user.firstName"><br>


        Last Name:<br>


        <input type="text" ng-model="user.lastName">


        <br><br>


        <button ng-click="reset()">RESET</button>


      </form>


      <p>form = {{user}}</p>


      <p>master = {{master}}</p>


    </div>


    <script>


    var app = Java.module(''myFavoriteApp'', []);


    app.controller(''formCtrl'', function($scope) {


        $scope.master = {firstName: "Harry", lastName: "Potter"};


        $scope.reset = function() {


            $scope.user = Java.copy($scope.master);


        };


        $scope.reset();


    });


    </script>


    Now, if you want to create Select Boxes for your forms, you could do that by trying
    the example below. These boxes are important because they allow people to choose
    what they want.


    <form>


    Select a topic:


    <select ng-model="myVar">


        <option value="">


        <option value="stdnts">Students


        <option value="cats">Cats


        <option value="house">houses


    </select>


    </form>


    Meanwhile, you could also put radio buttons by using the ng-model directive. This
    means that while what people see onscreen could have different values, only the
    selected items would reflect—making what’s going on in the app easier to understand.
    For example, if your select boxes are:


    <form>


    Select a topic:


    <select ng-model="myVar">


        <option value="">


        <option value="stdnts">Students


        <option value="cats">Cats


        <option value="house">houses


    </select>


    </form>


    Then it means that your values should be based on the variables below:


     <form>


    Pick a topic:


    <input type="radio" ng-model="myVar" value="stdnts">Students


    <input type="radio" ng-model="myVar" value="cats">cats


    <input type="radio" ng-model="myVar" value="house">houses


    </form>'
