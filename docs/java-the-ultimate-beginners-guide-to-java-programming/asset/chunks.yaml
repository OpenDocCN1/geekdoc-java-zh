    Read-Only State


    Another thing that Java does is that it makes sure that the app has this “read-only”
    state. With this, action gets to be emitted, which means that mutation begins
    to happen, which also means that all mutations would be centralized, and that
    you’d just have to watch out for certain race conditions as they happen in a strict
    order. This state is also important for testing purposes.


