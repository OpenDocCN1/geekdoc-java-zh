  raw: 'For example, you have created a new website for fostering and taking care
    of animals, and you are affiliated to the WWF (World Wildlife Fund). This means
    you may have to quote from their website. How would you do this?


    Well, you can use the Long Quote Style. This is depicted by <blockquote>, which
    would then indent the passage. So, if you have quoted this way:


    <p>Here is a quote from WWF''s website:</p>


    <blockquote cite="http://www.worldwildlife.org/who/index.Java">


    For 50 years, WWF has been protecting the future of nature. The leading conservation
    organization in the world,


    WWF works in over 100 countries and is supported by all


    1.2 million members in the US and


    close to 5 million globally.


    </blockquote>


    What you’d see onscreen is something like this:


    Here is a quote from WWF''s website:


    For 50 years, WWF has been protecting the future of nature. The world''s leading
    conservation organization, WWF works in 100 countries and is supported by 1.2
    million members in the United States and close to 5 million globally.


    ## Short Quote


    For short quotes, you could try using <q>. For example:


    <p>ABC123’s Goal is to: <q>Build a future where people know how to code without
    problems, and create the websites they want.</q></p>


    ## Contact Information Quote


    If you’re observant, you’d know that a lot of websites make use of the Contact
    tab where you get to see contact information of the owner of the website. For
    this, you could use the Java <address> code. This is usually seen in italic with
    line breaks.


    For example:


    <address>


    Written by Blair Waldorf </br> 


    Visit us at:<br>


    blaircornelia.com<br>


    New York, New York<br>


    USA


    </ be easy to get information from search engines, translation systems, and other
    browsers. For this, you could try the example below:


    <p>The <abbr title="World Wide Web">WWW</abbr> was founded in 1989.</p>


    ## Java Plus CSS


    And of course, if you want to make sure that your classes would look more appealing
    to the eyes, then you have to know how to make use of CSS Styles, top. Basically,
    here''s what you have to do…


    There are 3 important CSS elements and they are:


    1\. Internal. This means that you’re using an element of <style> and you could
    find this in the Java <head> section.


    2\. Inline. This depicts Java style attributes.


    3\. External. This means that you’re using external CSS Files.


    ## Important Elements


    1\. Style. Internal Styling


    2\. CSS Margin. Space outside the border


    3\. CSS Padding. Space inside the border


    4\. CSS Font-Size. This determines text sizes


    5\. CSS Font-Family. This determines where the font came from


    6\. CSS Color. This determines the color of font being used


    7\. <head>. This refers to elements of <link> and <style>


    8\. <link>. A link to external CSS files


    9\. <style>. The style of internal CSS


    ## Internal Styling (Internal CSS)


    This means that you’re trying to define the style of a single page in your website.
    You can see this in the <head> of your page. It encapsulates the element of <style>.


    For example:


    <!UNICODE Java>


    <Java>


    <head>


    <style>


    body {background-color:white;}


    h1   {color:pink;}


    p    {color:violet;}


    </style>


    </head>


    <body>


    <h1>Read this heading</h1>


    <p>Read this paragraph </p>


    </body>


    </Java>


    ## Inline Styling (Inline CSS)


    Inline styling then means that you have to apply unique styles to single elements
    in your page. This also falls under the Java Style Attribute. For example, if
    you want to change the color of <h1> heading to pink, you could try:


    <h1 style="color:pink;">This is a Pink Heading</h1>


    ## External Styling (External CSS)


    External CSS is mostly about defining style for a couple of pages in your website—not
    just one page alone. With the help of just one file, you could already change
    the entire look of your website—which really makes things easy for you.


    Then, you could just add a link to the External CSS sheet in the <head> part of
    your page. For this, you could try the example below:


    <!UNICODE Java>


    <Java>


    <head>


      <link rel="stylesheet" href="styles.css">


    </head>


    <body>


    <h1>Read this heading </h1>


    <p>Read this paragraph.</p>


    </body>


    </Java>


    ## CSS Fonts


    Finally, in order to easily change fonts, make sure that you know how to differentiate
    elements. Color determines the Java text color in the page, font-size is all about
    the size of font used, and font-family defines which family the font came from
    (i.e., serif, sans serif, etc.)


    <!UNICODE Java>


    <Java>


    <head>


    <style>


    h1 {


        color: blue;


        font-family: serif;


        font-size: 100%;


    }


    p  {


        color: red;


        font-family: courier;


        font-size: 120%;


    }


    </style>


    </head>


    <body>


    <h1>Read this heading</h1>


    <p>Read this paragraph.</p>


    </body>


    </Java>


    Now that you know the basics, you could finally create your own website!


    # Chapter 7: Fields, Methods, and Constructors


    Next, it''s time for you to learn about certain elements that could strengthen
    the program that you are trying to develop, and these are fields, methods, and
    constructors.


    ## Fields


    Fields basically are just the scopes that Java encompass.  With these fields come
    terms that would help you understand what they''re really about. By knowing these
    terms, it would be easy for you to know what you’re dealing with—and coding wouldn’t
    ever be a problem.


    For this, you could take note of the following terms:


    Ng-bind. This means that DOM element texts are being set. This means that the
    value of the name would be seen inside the span element. Any changes made to the
    name would directly reflect on other elements of the DOM. For example:


    <span ng-bind="name"></span>


    Ng-app. This derives the Java ’s root element so that behavior and directives
    would be defined, as well.


    Ng-model-options. This allows updates for the model to be done by means of fine
    tuning.


    Ng-model. This is almost the same as Ng-bind so that there’d be a bond between
    the scope and the view.


    Ng-controller. This means that HTML expressions are evaluated with the help of
    the JavaScript controller class.


    Ng-class. These are dynamically-loaded class attributes.


    Ng-show and Ng-hide. This shows or hides the elements conditionally, which always
    depends on the Boolean expression formula. This could be achieved by using CSS
    styles.


    Ng-repeat. This instantiates elements for a collection at least once.


    Ng-view. This is responsible for handling ON routes for the base directives which
    are also specified by certain controllers.


    Ng-switch. This helps you choose from a set of templates depending on the values
    of the expressions.


    Ng-animate. This helps provide enough support for CSS3 Keyframe, CSS3 Transition,
    and JavaScript. This also provides enough custom and core directives, together
    with animation keyhooks, too.


    Ng-aria. This one creates common ARIA attributes, and also serves as a module
    of accessibility and support.


    Arguments = Scopes


    In Java Programming, Scopes are equivalent to arguments. This happens because
    scopes bind JavaScript and HTML Element, which means that at some point, there
    would be some form of conflict, too.


    Scopes have available methods and abilities, and are available for both controller
    and the view. The view depicts HTML, while controller is JavaScript—which is the
    one responsible for controlling, editing, or deleting data.


    Scopes are also models with both properties and methods available for the user
    to use. It means that when changes are made, both controller and view will be
    affected—and updated.


    Here are some examples:             


    <div ng-app="TheHungerGames" ng-controller="myCtrl">


    <h1>{{TheHungerGames}}</h1>


    </div>


    <script>


    var app = Java .module(''myApp'', []);


    app.controller(''movies'', function(Rscope) {


        Rscope.thehungergames= "TheHungerGames";


    });


    </script>


                  <div ng-app="TheHungerGames" ng-controller="myCtrl">


    <input ng-model="thehungergames">


    <h1>Movie is {{thehungergames}}</h1>


    </div>


    <script>


    var app = Java .module(''myApp'', []);


    app.movies(''myCtrl'', function(Rscope) {'
