    \ pdb.set_trace()\n```\n\n--Return--\n> <stdin>(1)<module>()->None\n\n(Pdb) p\
    \ a\n'a string'\n\n(Pdb)\n```\n\n你可以通过输入 `cont` 继续执行。你也可以通过输入以下自动运行此程序：\n\n```python\n\
    # code snippet, to be included in 'sitecustomize.py'\n\nimport sys\n\ndef info(type,\
    \ value, tb):\n  if hasattr(sys, 'ps1') or  not sys.stderr.isatty():\n    # 我们处于交互模式，或者我们没有类似\
    \ tty 的设备\n    # 所以我们调用默认钩子\n    sys.__excepthook__(type, value, tb)\n  else:\n\
    \    import traceback, pdb\n    # 我们不在交互模式，打印异常...\n    traceback.print_exception(type,\
    \ value, tb)\nprint\n  # ...然后在事后模式下启动调试器。\n  pdb.pm()\n\nsys.excepthook = info\n\
    ```\n\n也尝试这些快捷键：\n\n```python\n# Ned's .pdbrc\n\n# 打印排序后的字典。%1 是字典，%2 是名称的前缀。\n\
    alias p_ for k in sorted(%1.keys()): print \"%s%-15s= %-80.80s\" % (\"%2\",k,repr(%1[k]))\n\
    \n# 打印对象的实例变量。\nalias pi p_ %1.__dict__ %1.\n\n# 下一步(next)、列表(list)、单步(step)和列表(list)。\n\
    alias nl n;;l\nalias sl s;;l\n\n# 打印 self 的实例变量。\nalias ps pi self\n\n# 打印局部变量(locals)。\n\
    alias pl p_ locals() local:\n\n# 在栈中向上和向下移动的快捷键\nalias uu u;;u\nalias uuu u;;u;;u\n\
    alias uuuu u;;u;;u;;u\n```\n\n## 日志错误\n\n要纠正日志错误，只需这样操作：\n\n```python\nimport\
    \ logging\nimport optparse\n\nLOGGING_LEVELS = {'critical': logging.CRITICAL,\n\
    \                  'error': logging.ERROR,\n                  'warning': logging.WARNING,\n\
    \                  'info': logging.INFO,\n                  'debug': logging.DEBUG}\n\
    \ndef main():\n  logging.basicConfig(level=logging_level, filename=options.logging_file,\n\
    \                        format='%(asctime)s %(levelname)s: %(message)s',\n  \
    \                      datefmt='%Y-%m-%d %H:%M:%S')\nparser = optparse.OptionParser()\n\
    \  parser.add_option('-l', '--logging-level', help='日志级别')\n  parser.add_option('-f',\
    \ '--logging-file', help='日志文件名')\n  (options, args) = parser.parse_args()\n \
    \ logging_level = LOGGING_LEVELS.get(options.logging_level, logging.NOTSET)\n\
    \  # 你的程序写在这里。\n  # 你可以使用 args 变量访问命令行参数。\n\nif __name__ == '__main__':\n  main()\n\
