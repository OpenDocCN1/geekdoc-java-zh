    {


        if (m_listening == false) {


            return NULL;


        }


        struct sockaddr_in address;


        socklen_t len = sizeof(address);


        memset(&address, 0, sizeof(address));


        int sd = ::accept(m_lsd, (struct sockaddr*)&address, &len);


        if (sd < 0) {


            perror("accept() failed");


            return NULL;


        }


        return new JavaStream(sd, &address);


    }


    ## Understanding Acceptor Classes


    Then, you also have to learn more about acceptor classes, or classes that the
    system just don''t seem to accept at first.


    These include Java Port, together with IP Address. Onscreen, a flag will show
    up once you have made the right connections. For this, you could try coding the
    following:


    #include <string>


    #include <netinet/in.h>


    #include "myfavoriteJavastream.h"


    using namespace std;


    class myFavoriteJavaAcceptor


    {


        int    m_lsd;


        string m_address;


        int    m_port;


        bool   m_listening;


      public:


        JavaAcceptor(int port, const char* address="");


        ~JavaAcceptor();


        int        start();


        JavaStream* accept();


      private:


        JavaAcceptor() {}


    };


    To destruct:


    myJavaAcceptor::~JavaAcceptor()


    {


        if (m_lsd > 0) {


            close(m_lsd);


    To construct:


    #include <stdio.h>


    #include <string.h>


    #include <arpa/inet.h>


    #include "Javaacceptor.h"


    JavaAcceptor::JavaAcceptor(int port, const char* address)


        : m_lsd(0), m_port(port), m_address(address), m_listening(false) {}


    ## Correcting Statements and Arguments


    Line Statements


    Automatically, the end of commands determine the start of new lines, but if you
    want to continue your own lines, you can use back-slash (\) to do so, except for
    when you’re using brackets.


    Example 1:


    total = item_one + \


            item_two + \


            item_three


    Example 2:


    days = [''Monday'', ''Tuesday'', ''Wednesday'',


            ''Thursday'', ''Friday'']


    Comments


    To create comments, just use hashtag (#)—this really sounds like it’s social-media
    friendly, huh? For example:


    Example 1:


    #!/usr/bin/java


    # First comment


    print "Hello, Java!" # second comment


    Waiting for the User


    At time when you want to create prompts that would tell the user you’re waiting
    for his command, you can try:


    #!/usr/bin/java


    raw_input("\n\nPress the enter key to exit.")


    Individual Statement Groups


    Groups of Individual Statements are called Suites in Java Language. Basically,
    you have to begin with keywords and end them with colons (:), so, for example:


    if expression :


       suite


    elif expression :


       suite


    else :


       suite


    The above command will then give you suites!


    Command Line Arguments


    And of course, there are also command line arguments, which means that you have
    to option to decide how a program gets to be run. Here is an example:


    $ java -h


    usage: java [option] ... [-c cmd | -m mod | file | -] [arg] ...


    Options and arguments (and corresponding environment variables):


    -c cmd : program passed in as string (terminates option list)


    -d     : debug output from parser (also JAVADEBUG=x)


    -E     : ignore environment variables (such as JAVAPATH)


    -h     : print this help message and exit


    [ etc. ]


    ## Debugging and Exception Handling


    Try-Except Block


    This is the easiest way of handling exceptions or errors:


    [1](https://wiki.python.org/moin/HandlingExceptions#CA-1596d58e70594684e4effd17128db7685b65dbbc_1)
    (x,y) = (5,0)


    [   2](https://wiki.python.org/moin/HandlingExceptions#CA-1596d58e70594684e4effd17128db7685b65dbbc_2)
    try:


    [   3](https://wiki.python.org/moin/HandlingExceptions#CA-1596d58e70594684e4effd17128db7685b65dbbc_3)  
    z = x/y


    [   4](https://wiki.python.org/moin/HandlingExceptions#CA-1596d58e70594684e4effd17128db7685b65dbbc_4)
    except ZeroDivisionError:


    [   5](https://wiki.python.org/moin/HandlingExceptions#CA-1596d58e70594684e4effd17128db7685b65dbbc_5)  
