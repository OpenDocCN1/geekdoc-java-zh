    Rooting Mechanisms


    There’s also such a thing as Rooting Mechanism (also known as $rootscope). This
    uses the ng-app directive and is available for the whole application—so you can
    say that it’s a really important part of the tutorial. This also uses the scope
    that’s currently used.


    For example:


    <body ng-app="TheFirstApp">


    <p>The rootScope''s favorite color:</p>


    <h1>{{pink}}</h1>


    <div ng-controller="myCtrl">


        <p>The scope of the controller''s favorite color:</p>


        <h1>{{purple}}</h1>


    </div>


    <p>The rootScope''s favorite color is still:</p>


    <h1>{{pink}}</h1>


    <script>


    var app = Java .module(''TheFirstApp'', []);


    app.run(function($rootScope) {


        $rootScope.color = ''pink'';


    });


    app.controller(''myCtrl'', function(Rscope) {


        Rscope.color = "purple";


    });


    </script>


    </body>


    Limiting Areas


    You also should understand where the scopes begin, and when they end. This will
    make your program more coherent, and help you understand what needs to be done.
    It’s like knowing what’s going on around you so you could easily deal with them.
    This is not usually an issue unless you’re dealing with large DOM Applications.
    The ng-repeat directive is essential for this one.


    For this, you could follow the code below:


    <div ng-app="TheFirstApp" ng-controller="myCtrl">


    <ul>


        <li ng-repeat="x in thefirstapp">{{x}}</li>


    </ul>


    </div>


    <script>


    var app = Java .module(''TheFirstApp'', []);


    app.controller(''myCtrl'', function(Rscope) {


        Rscope.names = ["the", "first", "app"];


    });


    </script>


    ## Methods


    Meanwhile, and as the name suggests  methods are about the actions you should
    take in filling up those fields, and making sure that your program would be as
    coherent and as well out, as possible.


    Methods, in Java, are known as information payloads that are responsible for sending
    data from the application to its own store, which could then be sent with the
    syntax store.dispatch () and are known to be plain JavaScript objects, and that
    is why the type property has to be used, and that types should then be considered
    as string constants. If you have an app that’s already large enough, it can then
    be moved to a separate module.


    However, you have to keep in mind that methods don’t have to be depicted in separate
    files. In fact, you might not even have to define them at all, but you do have
    to declare their codebases, and understand the right type of syntax to be used.


    For example:


    const ADD_TODO = ''ADD_TODO''


      type: SET_VISIBILITY_FILTER,


      type: ADD_TODO,


      text: ‘Welcome to My First App’


      filter: SHOW_COMPLETED


    }


    }


    Action Creators


    True to the name, Action Creators are the kind of functions that are able to create
    methods, or have methods returned to the user. They create valuable dispatches
    when invoked, and promote bound methods.


    Dispatches or dispatch () is something that you could directly access from the
    store, and provide connection between Java and the reader, also known as Java-reader
    collect. These action creators could also have certain side effects, which are
    also known as methods of synchronicity and AJAX Responses.


    Here’s a sample proper code:


    function addTodo(text) {


        type: ADD_TODO,


        type: ADD_TODO,


        text


        text


      return {


    function addTodoWithDispatch(text) {


    dispatch(completeTodo(index))


    dispatch(addTodo(text))


      dispatch(action)


