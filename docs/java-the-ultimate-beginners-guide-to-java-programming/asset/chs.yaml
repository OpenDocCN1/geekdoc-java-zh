- "# Java：Java 编程初学者指南\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 引言\n\nJava 被认为是世界上最实用、通用的面向对象语言之一，它是你可以学习——甚至精通的最佳编程语言之一，即使你只是一个新手！\n\
  \n在本书的帮助下，你将 Java 是什么、它的基本类型、数据类型、面向对象编程实际上是如何运作的等内容！\n\n现在开始阅读这本书，你将很快学到关于 Java\
  \ 的知识！\n\n# 第 1 章 Java 简介\n\n\n\n\n最重要的是，你必须理解的是，Java 是一种通用的、面向对象的编程语言——这意味着它比其他编程语言更容易理解。它的设计初衷主要是让软件开发人员只需编写一次程序，即可让这些程序运行在任何地方，或者至少在大多数平台上运行，只要这些平台允许\
  \ Java 代码运行。\n\nJava 主要使用与 `C+` 和 `C++` 相同的一些元素，但将它们转换为更简单、更易理解的版本，并且可以根据开发者的喜好进行修改。\n\
  \nJava 还被设计为能够提供足够的硬件和软件运行时支持，这是通过以清晰、简洁的方式表示每个字节码来实现的。例如，西西狮、边境牧奇犬和梗梗犬都是狗——因此，它们都可以被归类为狗，这样就不会占用太多的系统空间，系统能够快速运行。这也是\
  \ Java 成为世界上历史上最强大、使用最广泛的编程语言之一的原因！\n\n## 历史\n\nJava 的历史可以追溯到 1991 年，当时程序员 Patrick\
  \ Haughton、Mike Sheridan 和 James Gosling 设想了一种最适合用于开发数字电视的编程语言。然而，它被认为远远超当时的时代，因此他们基于\
  \ `C+` 和 `C++` 平台对其重新开发，使其更易用、更经济。\n\n随着重新开发，Java 的核心原则也产生了：\n\n1. 它必须是可移植的——或者说它应该在尽可能多的平台上运行，没有任何一个平台的运行效果不如其他平台；\n\
  2. 它的使用应该是安全的——并且经过了良好的加密；\n3. 人们应该在尽可能短时间内与它建立联系，这意味着他们使用的词汇应该是他们熟悉的，尽管初看之下很复杂，但迟晚他们都会意识到它实际上是通用的；\n\
  4. 它应该是动态的，应该在线程中工作，并在需要时进行修改，并且；\n5. 它的执行应该是精确的。\n\n正如你所看到的，这些核心原则让你感觉到程序员是真的为了人们编写\
  \ Java 的——这样他们就可以享受更多程序，而无需购买太多设备。\n\n1995 年，太阳系统公司（Sun Microsystems）最终发布了 Java\
  \ 1.0——这是 Java 的首次公开诞生，它具有惊人的安全性、免费的运行时以及跨网络的文件访问限制。在过去的几年里，又进行了 7 次 Java 发布，从 2006\
  \ 年开始，Java 开始通过 `GNU` 或通用公共许可（General Public License）提供——这意味着它现在是一门免费的开源编程语言。这源于当某些内容被私有化并收费时引发的公众抗议，这显然与它的核心原则不符。\n\
  \n## 运行时与性能\n\n起初，Java 的运行速度并没有达到理想水平，主要是因为用它创建的前几个程序比用 `C+` 创建的程序需要更多的内存。然而，在多年以后，它的速度得到了提高，而且在行业中的声誉实际上比同类产品更好。\n\
  \n由于 Java 本身是一个虚拟机，它现在使用了所谓的“即时编译”（just in time compilation），这使得它非常容易处理。它还提供了额外的支持，因此现在你可以开始使用内部类、数组、断言、字符串生成器等，同时也得到了更好的优化。\n\
  \n## 语法\n\n当然，你以后会学习更多内容，但你现在必须意识到，在 Java 编程中，类封装了所有的代码——所以它们之间可以是连贯的，并且能够共存，所有这些内容都被视为自身的数据项。然而，原始数据类型（如字符、布尔值、整数等——你将在下一章中学习这些内容）是被排除在外的，因为它们知道如何独立存在。\n\
  \n你还会注意到语法中主要使用以下符号：双斜杠（`//`）、注释样式，或者星号和斜杠（`/**`）（`*/`）、多行样式（`/*`）（`*/`）。\n\n在 Java\
  \ 中创建程序时，你应该将文件保存为 `.java`，将子页面保存为 `.class`。如果你想让某个子页面或类保持私有，你只需要将它保存在同一个 Java 文件夹中，而不是它自己的类文件夹中，这样其他人就无法访问它。\n\
  \n几行 Java 语法示例如下：\n\n```\nProgram HiWorld (\n  Public static.void (\n    System.out.println.HiWorld\n\
  \  )\n)\n```\n\n但你必须注意，将类设为公共（public）使程序具有在其他平台上使用的能力。因此，除非程序仍处于开发阶段且你不想让它被访问，否则最好确保将其设为公共，以便你也可以进行测试。毕竟，通过使用\
  \ `void` 和 `static` 关键字，你可以确保其他人无法编辑或修改该程序。\n\n## 内存\n\nJava 运行快速的另一个原因是它利用了自动内存管理，这意味着运行时不会受到程序员选择增加或减少其正尝试创建的内容的影响。\n\
  \n现在的情况是，当对某个对象不再有引用时，它将不再被视为程序的一部分，也不会占用大量内存——这使得整个程序更容易管理。\n\n现在是时候学习更多关于 Java\
  \ 的内容了。\n\n# 第二章：Java 中的八种原始类型\n\n如前所述，Java 有八种原始或基本数据类型。这里是 Java 的原始类型。基本上这些是你在创建程序时应该使用的词汇。\n\
  \n1. `If`：它执行代码块，并包含 `else` 和 `elif`。\n2. `While`：用于真条件，并执行代码块。\n3. `For`：用于附加代码块。\n\
  4. `Try`：由 `except` 处理，允许对代码块提出异常。\n5. `With`：利用管理器，有助于打开和关闭文件。\n6. `Def`：这意味着定义了一个方法或函数。\n\
  7. `Class`：它执行代码块并用于面向对象的编程。\n8. `Print`/`Print()`：用于打印。\n9. `Import`：用于从其他函数导入模块。\n\
  10. `Yield`：用于生成函数值，也可用运算符。\n11. `Assert`：用于检查本应适用的语句。\n12. `Pass`：用于创建空代码块。\n\n\
  注意，这些关键字不能用作变量！\n\n## 缩进与行\n\n使用的空格和单词数量决定了你编写的内容是正确的，还是会产生错误：请看下面的两个示例。第一个是正确的，而另一个因为最后一行没有缩进的\
  \ print 命令而产生错误。\n\n示例 1：\n```\nif True:\n    print \"True\"\nelse:\nprint \"False\"\
  \n```\n\n示例 2：\n```\nif True:\n    print \"Answer\"\n    print \"True\"\nelse:\n\
  \    print \"Answer\"\nprint \"False\"\n```\n\n## 引号\n\n在程序中创建引号时，请注意你可以使用单引号（‘'）、双引号（“”）或三引号（\"\
  \"\"\"）来指示字符串和字面量字符串。\n\n例如：\n\n```\nword = 'word'\nsentence = \"这是一句句子。\"\nparagraph\
  \ = \"\"\"这是一个段落。它\n\n由多行和句子组成.\"\"\"\n```\n\n## 多行语句\n\n自动情况下，命令的结束决定了新行的开始，但如果你想继续自己的行，可以使用反斜杠（\\\
  ）来这样做，但在使用括号时除外。\n\n示例 1：\n\n\n\n\n\n```\ntotal = item_one + \\\n    item_two +\
  \ \\\n    item_three\n```\n\n示例 2:\n\n```python\ndays = ['Monday', 'Tuesday', 'Wednesday',\n\
  \        'Thursday', 'Friday']\n```\n\n## 注释\n要创建注释，只需使用井号（#`）——这听起来非常符合社交媒体风格，对吧？例如：\n\
  \n示例 1:\n```python\n#!/usr/bin/java\n\n### 第一条注释\n\nprint \"Hello, Java!\" # 第二条注释\n\
  ```\n\n示例 2:\n```python\n### 这是一个注释。\n### 这也是一个注释。\n### 这也是一个注释。\n### 我已经说过过了。\n\
  ```\n\n### 等待用户\n当你想要创建提示符来告诉用户你正在等待他的命令时，你可以尝试：\n\n```python\n#!/usr/bin/java\n\
  \nraw_input(\"\\n\\n 按回车键退出。\")\n```\n\n### 独立语句组\n在 Java 语言中，独立语句组被称为 `Suites`（语句块）。基本上，你必须以关键字开始并以冒号（`:`）结束，例如：\n\
  \n```python\nif expression :\n  suite\n\nelif expression :\n  suite\n\nelse :\n\
  \  suite\n```\n\n上述命令将为你提供语句块！\n\n## 布尔表达式与逻辑\n接下去是布尔逻辑。在这里，值被归约为真（true）或假（false），并用于二进制系统中。简而言之，它们帮助程序做出自己的决定。例如：\n\
  \n```python\n>>> front_sensor_on = True\n>>> front_sensor_on\nTrue\n```\n\n你必须记住的是，布尔逻辑决定了一个确切的结果——你想要看到的特定内容。就像哲学逻辑中存在对立平方一样，也存在布尔逻辑对立广场。下面是一个示例：\n\
  \n| a | b | a== b | a!= b | A and b | A or b | not b |\n| --- | --- | --- | ---\
  \ | --- | --- | --- |\n| False | False | True | False | False | False | True |\n\
  | False | True | False | True | False | True | True |\n| True | False | False |\
  \ True | False | True | False |\n| True | True | True | False | True | True | False\
  \ |\n\n下是对该图表的解释。\n\n### 逻辑“与”\n如你所示，上面有一个表达式为 `a and b`。记住，这只有当 `a` 和 `b` 都具有相同的真值时，才会发生，这意味着结果可能为真——而在其他任何情况下为假。\n\
  \n这是一个示例：\n\n```python\na and False == False\nFalse and a == False\nB and a == a\
  \ and b\nA and True == a\nTrue and a== a\nA and a == a\n```\n\n### 逻辑等价\n逻辑等价或 `a==b`\
  \ 发生在 `a` 和 `b` 都具有相同真值时，且可能为真也可以为假；否则，它们的值不同，核心不相同。\n\n### 逻辑“或”\n接下来，你看到一个显示 `a\
  \ or b` 的表格。这测试两者是否为真，或仅有一个变量为真。当 `a` 和 `b` 都为真时，值也返回为真——别无它。\n\n例如：\n```python\n\
  a or False == a\nFalse or a == a\nB or a== a or b\na or True == True\nTrue or a\
  \ == True\na or a == x\n```\n\n### 逻辑否定\n基本上，逻辑否定意味着两个变量具有相互抵消的能力。例如：\n\n```python\n\
  not (not a) == a\n```\n\n### 条件执行\n还有条件执行，或者改变行为并检查影响程序行为的条件的手段。这使用了 `If` 语句。这是一个很好的例子：\n\
  \n```python\nif x % 2 == 0:\n    print(x, \" 是偶数.\")\n    print(\"你知道 2 是唯一的偶质数吗？\"\
  )\nelse:\n    print(x, \" 是奇数.\")\n    print(\"你知道两个奇数相乘 \" + \"总是得到奇数结果吗？\")\n\
  ```\n\n这将给你如下结果：\n\n```pythonf BOOLEAN EXPRESSION:\n    STATEMENTS_1        # 如果条件为\
  \ True 则执行\nelse:\n    STATEMENTS_2        # 如果条件为 False 则执行\n```\n\n### 链式条件\n\
  Else If/ If Else 在此条件中非常重要。这是一个示例：\n\n```python\nif choice == \"a\":\n    function_one()\n\
  elif choice == \"b\":\n    function_two()\nelif choice == \"c\":\n    function_three()\n\
  else:\n    print(\"无效选择.\")\n```\n\n### 嵌套条件\n还有嵌套条件，基本上意味着条件可以叠加在另一个之上。例如：\n\n\
  ```python\nif x < y:\n    STATEMENTS_A\nelse:\n    if x > y:\n        STATEMENTS_B\n\
  else:\n    STATEMENTS_C\n```\n\n你也可以通过以下方式简化它：\n\n```python\nif 0 < x: # 假设这里 x\
  \ 是整数\n    if x < 10:\n        print(\"x 是一个正数字位.\")\n```\n\n记住 `print` 只有在通过两个条件后才能使用，这意味着：\n\
  \n```python\nif 0 < x and x < 10:\n    print(\"x 是一个正数字位.\")\n```\n\n### 省略 Else\
  \ 子句\n如果条件求值为真，则也可以省略 `Else` 子句。例如：\n\n```python\nif x < 0:\n    print(\"负数 \",\
  \ x, \" 在这里是有效的。\")\nx = 42\nprint(\"我决定使用数字 42。\")\nprint( x, \" 的平方根是\", math.sqrt(x))\n\
  ```\n\n### 返回语句\n你还有 `return` 语句，无论操作是否为空，它都能为你返回一个值。\n\n```python\ndef print_square_root(x):\n\
  \    if x <= 0:\n        print(\"请仅正数.\")\n        return\n    result = x**0.5\n\
  \    print(x, \" 的平方根是\", result)\n```\n\n## 整数和浮点数\n当然，你可以预感到整数和浮点数用于存储值，这就是为什么它们也被分在一起的。将你偏好的数字分配给变量。例如：\n\
  \n```python\nvar1 = 1\nvar2 = 10\n```\n\n你也可以利用以下类型：\n1. `Int`（整数）\n2. `Complex`（复数）\n\
  3. `Float`（浮点数）\n4. `Long`（长整型）\n\n你可以使用逗号来分配相同的值。例如：\n\n```python\na = b = 1\n\
  ```\n\n## 变量\n接下来，该学习什么是变量了。\n\n在学习之前，你必须知道它们基本上意味着存储值。在这里，你将使用大量的数字、整数和各种字符！\n\n\
  在学习命令之前，这里有一个关于类型转换的快速课程。\n\n### 类型转换\n1. `Int(x [base])`：如果 `x` 是字符串，它变为整数。\n2.\
  \ `Float(x)`：将整数转换为浮点数。\n3. `Long(x [base])`：将 `x` 转换为长整数。\n4. `Str(x)`：将 `x` 转换为字符串表示。\n\
  5. `Complex(real [imag])`：这给你一个复数。\n6. `Eval(str)`：评估字符串并返回一个对象。\n7. `Repr(x)`：将\
  \ `x` 转换为表示字符串。\n8. `Set(s)`：将 `x` 转换为集合。\n9. `List(L)`：将 `x` 转换为列表。\n10. `Tuple(t)`：将\
  \ `x` 转换为元组。\n11. `Frozen set(s)`：将 `x` 转换为冻结集合。\n12. `Dict(d)`：这给你一个字典。\n13. `Oct(x)`：将\
  \ `x` 转换为八进制字符串。\n14. `Hex(x)`：将 `x` 转换为十六进制字符串。\n15. `Ord(x)`：这给单个字符其整数值。\n16.\
  \ `Unichr(x)`：最后，使用此命令将得到一个 Unicode 字符。\n\n#### 赋值\n等号（`=`）在这里很重要，因为。你不需要在这里进行显式声明，但你必须确保将变量放在等号之前，而在右侧，放置你想让变量发生的操作。例如：\n\
  \n\n\n\n此外，你还有 Java 运算符。这些运算符用于操作操作数，可以分类为：\n\n1.  算术运算符\n2.  赋值运算符\n3.  身份运算符\n\
  4.  成员运算符\n5.  位运算符\n6.  逻辑运算符\n7.  比较/关系运算符\n\n### 算术运算符\n\n以下是你可以使用的算术运算符：\n\n\
  1.  `+` 加法。当然，这会加你运算符上的值（`a + b = 15`）。\n2.  `–` 减法。将右侧的操作数减去左侧的操作数（`a – b = -10`）。\n\
  3.  `/` 除法。将左侧的操作数除以右侧的（`b/a = 2`）。\n4.  `*` 乘法。将你的内容倍乘（`a * b = 200`）。\n5.  `//`\
  \ 整除。通过它，你可以得到商的结果，特别是在去除小数点时（`9//2 = 4`）（`9.0//2.0 = 4.0`）。\n6.  `**` 幂。这可以帮助你推导出指数符号（`a**b\
  \ = 5 的 10 次`）。\n7.  `%` 取模。将左侧的操作数除以右侧并提供余数（`b% a = 0`）。\n\n### 赋值运算符\n\n1.  `=`\
  \ 将右侧的值赋给左侧的操作数（`c = a + b` 将 `a + b` 的值赋值给 `c`）。\n2.  `-=` 减并赋值。这将右侧的操作数减去左侧的操作数，并将结果赋值给左侧（`c\
  \ -= a` 等于 `c = c – a`）。\n3.  `+=` 加并赋值。将右侧的操作数加到左侧并得到左侧操作数的结果（`c += a` 等于 `c =\
  \ c + a`）。\n4.  `/=` 除并赋值。将左侧除以右侧操作数并将赋值赋值左侧（`c /= a` 等于 `c = c / a`）。\n5.  `*=`\
  \ 乘并赋值。将右侧操作数乘以左侧操作数并将结果赋值给左侧操作数（`c *= a` 等于 `c = c * a`）。\n6.  `**=` 幂并赋值。推导出指数符号（`c\
  \ **= a` 等于 `c = c ** a`）。\n7.  `%=` 取模并赋值。取两个操作数的模（`c %= a` 等于 `c = c % a`）。\n\
  8.  `//=` 整除并赋值。通过它，你可以得到商的结果，特别是在去除小数点时（`c //= a` 等于 `c = c // a`）。\n\n### 身份运算符\n\
  \n这些运算符比较两个不同对象的两个位置内存。\n\n1.  `is`。判断两边的变量是否为真；如果不是，运算符指向同一个主体（`x is y`，这里如果 `id(x)`\
  \ 等于 `id(y)`，`is` 结果为 1）。\n2.  `is not`。如果两边的变量为假，运算符指向主体并在逻辑上为真（`x is not y`，这里如果\
  \ `id(x)` 不等于 `id(y)`，`is not` 结果为 1）。\n\n### 成员运算符\n\n这些运算符检查特定序列中是否存在成员关系或一致性。\n\
  \n1.  `is`。检查各边的变量是否为真（`x is y`，这里如果 `id(x)` 等于 `id(y)`，`is` 结果为 1）。\n2.  `not in`。检查变量是否不在指定的序列中并评估为真假（`x\
  \ not in y`，这里如果 `x` 不是序列 `y` 的成员，`not in` 结果为 1）。\n\n### 位运算符\n\n这些运算符逐位操作。例如：\n\
  \n```\na = 0011 1100\nb = 0000 1101\n\na&b = 0000 1100\na|b = 0011 1101\na^b = 0011\
  \ 0001\n~a = 1100 0011\n```\n\n### 逻辑运算符\n\n逻辑运算符基本上是中间夹着 10 到 20 个变量的项。\n\n###\
  \ 比较运算符\n\n1.  `==`。如果操作数相等，则条件为真（`(a==b)` 不成立）。\n2.  `<>`。如果值不相等，条件变为真（`(a<>b)`\
  \ 为真）。\n3.  `!=`。如果两个操作数的值不相等，条件变为真。\n4.  `<=`。如果左侧操作数的值小于右侧操作数，条件变为真（`a <=b` 为真）。\n\
  5.  `>=`。如果左侧操作数的值大于右侧操作数，条件变为真（`a>=b` 不成立）。\n6.  `<`。如果左侧操作数的值小于右侧，条件为真（`a < b`\
  \ 为真）。\n7.  `>`。如果左侧的值大于右侧，条件为真（`(a>b` 不成立）。\n\n### 循环\n\n循环是提供可以在程序中使用的各种动作的语句。这些包括：\n\
  \n1.  `For 循环`。这可以帮助你执行多次语句，并缩短变量中使用的代码。\n2.  `While 循环`。重复你在程序中想要再次使用的语句或语句组。\n\
  3.  `嵌套循环`。这意味着你在程序中使用了一个或多个循环。\n4.  `Do…While 循环`。这相当于一个语句，但程序将其视为一个条件。\n5.  `Goto\
  \ 语句`。这将控制交给已经执行的语句。\n6.  `Continue 语句`。跳过循环体的剩余部分。\n7.  `Break 语句`。终止循环。\n\n###\
  \ Switch Case\n\nSwitch 允许你根据条件执行不同的代码块。\n\n```c\n#include <stdio.h>\nint main ()\
  \ {\n    char grade = 'D';\n    switch(grade) {\n        case 'E':\n           \
  \ printf(\"...\");\n            break;\n    }\n}\n```\n\n# 第 3 章：数组和字符串\n\n在 Java\
  \ 中，数组和字符串有助于确保出现在屏幕上的内容确实是程序员想要表达的内容。在 Java 语言中，你必须使用它们。这些写在双括号 `{{}}` 中，但也可以包含在指令中，就像下面这样：\n\
  \n`ng-bind=\"expression\"`\n\n表达式将由 Java 自身解析，并在准备就绪时产生。它们与 JavaScript 表达式非常相似，所以如果你了解那些，这种语言对你来说并不难。\n\
  \n这意味着 Java 表达式：\n\n1.  Java 表达式包含过滤器——但 JavaScript 表达式不。\n2.  它们不支持异常、循环和坐标。\n\
  3.  表达式可以写在 HTML 内部。\n4.  Java 表达式可以是变量、运算符和字量。\n\n例如：\n\n`{{ 10 + 5 }}` 或 `{{ name\
  \ + \" \" + nickname }}`\n\n这意味着基础的 Java 表达式代码如下：\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<script src=\"http://ajax.googleapis.com/ajax/libs/angularjs/1.4.8/angular.min.js\"\
  ></script>\n<body>\n<div ng-app=\"\">\n  <p>Supergirl Versus Bizarro: {{ Supergirl\
  \ +Bizzaro }}</p>\n</div>\n</body>\n</html>\n```\n\n通过移除 ng 指令，HTML 将无法解析表达式，而只是原样显示它，这看起来基本上就像是这样：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<script src=\"http://ajax.googleapis.com/ajax/libs/angularjs/1.4.8/angular.min.js\"\
  ></script>\n```\n\n\n\n\n```html\n<body>\n  <div ng-app=\"\">\n    <p>超人女对战比扎人：{{\
  \ Supergirl +Bizzaro }}</p>\n  </div>\n</body>\n```\n\n另一个例子是，如果你想更改 CSS 中的某些颜色和样式。例如，如果你想将框的颜色改为粉色，可以尝试以下操作：\n\
  \n```html\n<div ng-app=\"\" ng-init=\"myCol='pink'\">\n  <input style=\"background-color:{{myCol}}\"\
  \ ng-model=\"myCol\" value=\"{{myCol}}\">\n</div>\n```\n\n## 数组\n\n它的工作原理类似于 JavaScript\
  \ 数组。如果你打算使用 `ng-bind`，它看起来像下面所示：\n\n```html\n<div ng-app=\"\" ng-init=\"points=[2,4,6,8]\"\
  >\n  <p>第三个结果是 <span ng-bind=\"points[2]\"></</span></p>\n</div>\n```\n\n但是，如果你去掉了\
  \ `ng-bind`，它看起来像这样：\n\n```html\n<div ng-app=\"\" ng-init=\"points=[2,4,6,8]\">\n\
  \  <p>第三个结果是 {{ points[2] }}</p>\n</div>\n```\n\n## 字符串\n\n即使在编程中，字符串也将内容连接在一起。Java\
  \ 字符串的工作原理也类似于 JavaScript。它有两种处理方式——只需查看下面的示例即可：\n\n```html\n<div ng-app=\"\" ng-init=\"\
  firstName='Mark';lastName='Ruffalo'\">\n  <p>名字是 <span ng-bind=\"firstName + ' '\
  \ + lastName\"></</span></p>\n</div>\n```\n\n或者：\n\n```html\n<div ng-app=\"\" ng-init=\"\
  firstName='Mark';lastName='Ruffalo'\">\n  <p>名字是 {{ firstName + \" \" + lastName\
  \ }}</p>\n</div>\n```\n\n#### 如何格式化 Java 字符串\n\n有些人认为 Java 字符串处理起来极其复杂。然而，你并不真的需要害怕它们。在涉及格式化\
  \ Java 字符串时，你需要了解以下内容……\n\n### 工作字符串\n\n你首先必须意识到，有某些元素被称为 Java 工作字符串（Java Working\
  \ strings）。\n\nJava 工作字符串基本上是被引号括起来的字符。使用这些字符串时，单引号被认为等同于双引号，因此你可以预期：\n\n`var1 =\
  \ 'Hello World!'`\n`var2 = \"Java Programming\"`\n\n### 访问值\n\n记住，字符类型不被 Java 语言接受。你必须使用方括号\
  \ `[]` 来访问子字符串。例如：\n\n```bash\n#!/usr/bin/java\nvar1 = 'Hello World!'\nvar2 = \"\
  Java Programming\"\nprint \"var1[0]: \", var1[0]\nprint \"var2[1:5]: \", var2[1:5]\n\
  ```\n\n当你输入这些命令时，你将得到结果：\n\n`var1[0]: H`\n`var2[1:5]: ytho`\n\n你也可以通过以下操作来更新字符串：\n\
  \n```bash\n#!/usr/bin/java\nvar1 = 'Hello World!'\nprint \"Updated String :- \"\
  , var1[:6] + 'Java'\n```\n\n那将得到以下结果：\n\n`Updated String :- Hello Java`\n\n### Unicode\
  \ 字符串\n\n还有 Unicode 字符串或 8 位 ASCII，你可以将它们保持为 16 位 Unicode。例如：\n\n```bash\n#!/usr/bin/java\n\
  print u'Hello, world!'\n```\n\n基本上，这会给你：\n\n`Hello, world!`\n\n### 三引号\n\n你还可以利用三引号，它可以包含跨越多行、制表符甚至换行符。例如：\n\
  \n```bash\n#!/usr/bin/java\npara_str = \"\"\"this is a long string that is made\
  \ up of\nseveral lines and non-printable characters such as\nTAB ( \\t ) and they\
  \ will show up that way when displayed.\nNEWLINES within the string, whether explicitly\
  \ given like\nthis within the brackets [ \\n ], or just a NEWLINE within\nvariable\
  \ assignment will also show up.\n\"\"\"\nprint para_str\n```\n\n当你输入上述语法时，将得到如下结果：\n\
  \nthis is a long string that is made up of\nseveral lines and non-printable characters\
  \ such as\nTAB (     ) and they will show up that way when displayed.\n字符串内的 NEWLINE，无论是像这样在括号\
  \ [\n] 中显式给出，还是只是变量赋值中的 NEWLINE 都会显示出来。\n\n### 特殊代码和字符\n\n为了编写这些程序，你必须利用特殊字符和代码。这些是：\n\
