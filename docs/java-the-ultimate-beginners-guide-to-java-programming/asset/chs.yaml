  \ Query Language）。它是用于从数据库中获取或检索表格的标准编程语言。其他用途还包括创建、访问和操作数据库。\n\n最常用的 SQL 版本是最初由\
  \ ANSI（美国国家标准学会）建立的 SQL99 标准。还有一个名为 PL/SQL 的 ORACLE 版本，以及一个名为 T-SQL 或 Transact-SQL\
  \ 的 Microsoft 版本。\n\nSQL 的基础是 RDBMS（关系数据库管理系统），它以表格的形式存储数据。\n\n"
