  \ address)\n    : m_lsd(0), m_port(port), m_address(address), m_listening(false)\
  \ {}\n```\n\n# 修正语句与参数\n\n## 换行语句\n\n命令的结束会自动决定新行的开始，但如果你想继续编写自己的行，可以使用反斜杠（`\\`）来实现，但在使用括号时除外。\n\
  \n示例 1：\n\n```python\ntotal = item_one + \\\n    item_two + \\\n    item_three\n\
  ```\n\n示例 2：\n\n```python\ndays = ['Monday', 'Tuesday', 'Wednesday',\n      'Thursday',\
  \ 'Friday']\n```\n\n## 注释\n\n要创建注释，只需使用井号（##）——这听起来真的非常适合社交媒体，对吧？例如：\n\n示例 1：\n\n\
  ```bash\n#!/usr/bin/java\n# First comment\nprint \"Hello, Java!\" # second comment\n\
  ```\n\n### 等待用户\n\n当你想要创建提示来告诉用户你正在等待他的命令时，可以尝试：\n\n```bash\n#!/usr/bin/java\nraw_input(\"\
  \\n\\nPress the enter key to exit.\")\n```\n\n### 独立语句组\n\n独立语句组在 Java 语言中被称为 `Suites`（语句）。基本上，你必须以关键字开始并以冒号（`:`）结束，例如：\n\
  \n```python\nif expression :\n  suite\nelif expression :\n  suite\nelse :\n  suite\n\
  ```\n\n上面的命令将为你提供语句！\n\n### 命令行参数\n\n当然，还有命令行参数，这意味着你可以决定程序的如何运行。这里有一个示例：\n\n`$\
  \ java -h`\n\nusage: java [option] [-c cmd | -m file | [arg]] ...\n\n选项和参数（对应的环境变量）：\n\
  - `-c cmd`: 作为字符串传递的程序\n- `-d`: 来自解析器的输出（也是 `JAVADEBUG=x`）\n- `-E`: 忽略环境变量（如 `JAVAPATH`）\n\
  - `-h`: 打印此帮助信息并退出。\n\n# 调试与异常处理\n\n## Try-Except 块\n\n这是处理异常或错误的简单方法：\n\n```python\n\
  try:\n  x = 1\n  y = x / y\nexcept ZeroDivisionError:\n  print \"divide by zero\"\
  \n```\n\n你也可以通过以下方式检查异常代码：\n\n```python\ntry:\n  x = 1\n  y = x / y\nexcept ZeroDivisionError\
  \ as e:\n  z = e # 表示: \"<ZeroDivisionError instance>\"\n```\n*等等，根据提供的文本逻辑进行修正：*\n\
  \n```python\ntry:\n  x = 1\n  y = x / y\nexcept ZeroDivisionError, e:\n  z = e #\
  \ 表示: \"<exceptions.ZeroDivisionError instance at 0x81746c>\"\n  print z # 输出: \"\
  integer division or modulo by zero\"\n```\n\n要捕获通用错误，尝试：\n\n```python\nimport sys\n\
  try:\n    untrusted.execute()\nexcept: # 捕获*所有*异常\n    e = sys.exc_info()[0]\n \
  \   write_to_page(\"<Error: %s\" % e)\ntry:\n    do_some_stuff()\nexcept:\n    rollback()\n\
  else:\n    commit()\nfinally:\n    cleanup_stuff()\n```\n\n要获取有用的异常信息：\n\n```python\n\
  (a,b,c) = d\n```\n\nJava 然后会说：\n\n`ValueError: unpack list of wrong size`\n\n你也可以尝试：\n\
  \n```python\ntry:\n  a, b, c = d\nexcept Exception, e:\n  e.args += (d,)\n```\n\n\
  \n\n\n\n`raise`\n\n这绝对比冗长的 C 语言异常处理要简单得多！\n\n## PDB 调试器\n\n至于移除系统中的错误，请先尝试 PDB 方法——这被认为是最易用的\
  \ Java 调试器！\n\n```python\n>>> import pdb\n>>> a=\"a string\"\n>>> pdb.set_trace()\n\
  ```\n\n--Return--\n> <stdin>(1)<module>()->None\n\n(Pdb) p a\n'a string'\n\n(Pdb)\n\
  ```\n\n你可以通过输入 `cont` 继续执行。你也可以通过输入以下自动运行此程序：\n\n```python\n# code snippet, to be\
  \ included in 'sitecustomize.py'\n\nimport sys\n\ndef info(type, value, tb):\n \
  \ if hasattr(sys, 'ps1') or  not sys.stderr.isatty():\n    # 我们处于交互模式，或者我们没有类似 tty\
  \ 的设备\n    # 所以我们调用默认钩子\n    sys.__excepthook__(type, value, tb)\n  else:\n    import\
  \ traceback, pdb\n    # 我们不在交互模式，打印异常...\n    traceback.print_exception(type, value,\
  \ tb)\nprint\n  # ...然后在事后模式下启动调试器。\n  pdb.pm()\n\nsys.excepthook = info\n```\n\n\
  也尝试这些快捷键：\n\n```python\n# Ned's .pdbrc\n\n# 打印排序后的字典。%1 是字典，%2 是名称的前缀。\nalias p_\
  \ for k in sorted(%1.keys()): print \"%s%-15s= %-80.80s\" % (\"%2\",k,repr(%1[k]))\n\
  \n## 打印对象的实例变量。\nalias pi p_ %1.__dict__ %1.\n\n## 下一步(next)、列表(list)、单步(step)和列表(list)。\n\
  alias nl n;;l\nalias sl s;;l\n\n## 打印 self 的实例变量。\nalias ps pi self\n\n## 打印局部变量(locals)。\n\
  alias pl p_ locals() local:\n\n# 在栈中向上和向下移动的快捷键\nalias uu u;;u\nalias uuu u;;u;;u\n\
  alias uuuu u;;u;;u;;u\n```\n\n## 日志错误\n\n要纠正日志错误，只需这样操作：\n\n```python\nimport logging\n\
  import optparse\n\nLOGGING_LEVELS = {'critical': logging.CRITICAL,\n           \
  \       'error': logging.ERROR,\n                  'warning': logging.WARNING,\n\
  \                  'info': logging.INFO,\n                  'debug': logging.DEBUG}\n\
  \ndef main():\n  logging.basicConfig(level=logging_level, filename=options.logging_file,\n\
  \                        format='%(asctime)s %(levelname)s: %(message)s',\n    \
  \                    datefmt='%Y-%m-%d %H:%M:%S')\nparser = optparse.OptionParser()\n\
  \  parser.add_option('-l', '--logging-level', help='日志级别')\n  parser.add_option('-f',\
  \ '--logging-file', help='日志文件名')\n  (options, args) = parser.parse_args()\n  logging_level\
  \ = LOGGING_LEVELS.get(options.logging_level, logging.NOTSET)\n  # 你的程序写在这里。\n \
  \ # 你可以使用 args 变量访问命令行参数。\n\nif __name__ == '__main__':\n  main()\n```\n\n现在，你再也不用费力去纠正那些错误了！\n\
