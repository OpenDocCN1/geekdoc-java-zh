  # 根机制\n\n还有一种所谓的根机制（Rooting Mechanism，也称为 `$rootscope`）。它使用了 `ng-app` 指令并适用于整个应用程序——所以你可以说它是教程中非常重要的部分。它同样使用了当前使用的范围（scope）。\n\
  \n例如：\n\n```html\n<body ng-app=\"TheFirstApp\">\n  <p>rootScope 喜欢的颜色是：</p>\n  <h1>{{pink}}</h1>\n\
  \  <div ng-controller=\"myCtrl\">\n    <p>controller 喜欢的颜色是：</p>\n    <h1>{{purple}}</h1>\n\
  \  </div>\n  <p>rootScope 喜欢的颜色仍然是：</p>\n  <h1>{{pink}}</h1>\n  <script>\n    var\
  \ app = Java.module('TheFirstApp', []);\n\n    app.run(function($rootScope) {\n\
  \      $rootScope.color = 'pink';\n    });\n\n    app.controller('myCtrl', function(Rscope)\
  \ {\n      Rscope.color = \"purple\";\n    });\n  </script>\n</body>\n```\n\n##\
  \ 限制区域\n\n你还应该理解范围从哪里开始以及何时结束。这会让你的程序更具贯性，并帮助你理解需要做什么。这就像了解你周围发生了什么，以便你可以轻松地处理它们。这通常不是一个问题，除非你正在处理大型\
  \ DOM 应用程序。`ng-repeat` 指令对于这一点至关重要。\n\n对于这一点，你可以参考下面的代码：\n\n```html\n<div ng-app=\"\
  TheFirstApp\" ng-controller=\"myCtrl\">\n  <ul>\n    <li ng-repeat=\"x in thefirstapp\"\
  >{{x}}</li>\n  </ul>\n</div>\n<script>\n  var app = Java.module('TheFirstApp', []);\n\
  \n  app.controller('myCtrl', function(Rscope) {\n    Rscope.names = [\"the\", \"\
  first\", \"app\"];\n  });\n</script>\n```\n\n## 方法 (Methods)\n\n同时，正如其名称所暗示，方法（methods）是关于你在填充这些字段时应该采取的动作，并确保你的程序能够尽可能地连贯和良好。\n\
  \n在 Java 中，方法被称为信息载荷（information payloads），负责将数据从应用程序发送到自身的存储器，然后可以使用 `store.dispatch()`\
  \ 语法进行发送。它们被认为是纯 JavaScript 对象，这就是为什么必须使用 `type` 属性的原因，并且这些类型应该被视为字符串常量。如果你的应用程序已经足够大，可以将其移动到单独的模块中。\n\
  \n然而，你必须记住，方法并不非描述在单独文件中。事实上，你可能根本不需要定义它们，但你必须声明它们的代码库，并理解应该使用的正确语法类型。\n\n例如：\n\n\
  ```javascript\nconst ADD_TODO = 'ADD_TODO'\n\n{\n  type: SET_VISIBILITY_FILTER,\n\
  \  type: ADD_TODO,\n  text: ‘Welcome to My First App’\n  filter: SHOW_COMPLETED\n\
  }\n```\n\n## 动作创建器 (Action Creators)\n\n顾名其实，动作创建器（Action Creators）是那些能够创建方法或向用户返回方法的函数。它们在被调用时会创建有价值的分发（dispatches），并促进绑定的方法。\n\
  \n分发或 `dispatch()` 是你可以直接从存储器（store）访问的内容，提供了 Java 与读者之间的连接，也称为 Java-读取器收集。这些动作创建器还可能具有某些副作用，这些也被称为同步方法和\
  \ AJAX 响应。\n\n这是一个规范的示例代码：\n\n```javascript\nfunction addTodo(text) {\n  return\
  \ {\n    type: ADD_TODO,\n    type: ADD_TODO,\n    text: text\n  }\n}\n\nfunction\
  \ addTodoWithDispatch(text) {\n  dispatch(completeTodo(index))\n  dispatch(addTodo(text))\n\
  \  dispatch(action)\n\n  const boundCompleteTodo = (index) => dispatch(completeTodo(index))\n\
  \  const boundAddTodo = (text) => dispatch(addTodo(text))\n\n  const action = {\n\
  \    boundCompleteTodo(index),\n    boundAddTodo(text)\n  }\n}\n```\n\n## 源代码\n\n\
  为了正确编写这些代码，请充分利用以下源代码：\n\n```javascript\n/*\n* 动作类型\n*/\nexport const TOGGLE_TODO\
  \ = 'TOGGLE_TODO'\nexport const SET_VISIBILITY_FILTER = 'SET_VISIBILITY_FILTER'\n\
  export const ADD_TODO = 'ADD_TODO'\n\nexport const SHOW_COMPLETED = 'SHOW_COMPLETED'\n\
  export const SHOW_ALL = 'SHOW_ALL'\nexport const SHOW_ACTIVE = 'SHOW_ACTIVE'\n\n\
  * 其他常量\n* 动作创建器\nexport function toggleTodo(index) {\n  return { type: TOGGLE_TODO,\
  \ index }\n}\n\nexport function setVisibilityFilter(filter) {\n  return { type:\
  \ SET_VISIBILITY_FILTER, filter }\n}\n\nexport function addTodo(text) {\n  return\
  \ { type: ADD_TODO, text }\n}\n```\n\n## 构造函数\n\n当然，还有一些构造函数可以帮助下面的内容：\n\n```cpp\n\
  #include <netinet/in.h>\n#include <arpa/inet.h>\n#include \"newastream.h\"\n\nclass\
  \ JavaConnector{\npublic:\n  JavaConnector(int sd, struct sockaddr_in* address)\
  \ : msd(sd) {\n    char ip[50];\n    inet_ntop(PF_INET, &(address->sin_addr), ip,\
  \ sizeof(ip)-1);\n    m_peerIP = ip;\n    m_peerPort = ntohs(address->sin_port);\n\
  \  }\n\n  ~JavaConnector() {\n    close(msd);\n  }\n\n  int getPeerIP();\n  int\
  \ getPeerPort();\n\nprivate:\n  int msd;\n  string m_peerIP;\n  int m_peerPort;\n\
  };\n```\n\n为了获取对端信息，你必须确保返回 Java 和 IP。这样你就可以确保。你也可以使用 `getpeername()` socket，以便在信息可用时轻松地捕获并保存。\n\
  \n为了接受信息，让 socket `JavaAcceptor::accept()` 在网络是常见的。这样你就可以区分来自服务器和客户端的操作。\n\n## 网络\
  \ I/O 方法\n\n对于这一点，你需要使用 `JavaStream::send()` 或 `JavaStream::receive()`。这样你就可以轻松知道发送和接收的字节数，并且预计不会发生缓冲——也不会成为问题。\n\
  \n第 8 章 封装、继承与多态\n\n还有一些 Java 元素有助于确定程序如何被编辑，以及它在他人看来是怎样的。这些元素还包含了程序的深度——或者说它的核心。你可以在下面了解更多：\n\
  \n### 封装\n\n首先是封装，它利用了一些原则来良好执行。这些原则包括：\n\n1. **健壮性原则 (Robustness Principle)**：这意味着协议必须被实现，但发送行为必须是保守，而接收行为绝对应该是慷慨的。这意味着你在发送/接收数据包时必须小心。这意味着即使某些软件存在缺陷，确保你不要利用其协议仍然是非常关重要的。\n\
  2. **端到端原则 (End-to-end Principle)**：这是不断演进的原则之一。整体智能和状态对于维持这种表达至关重要，对于网络地址转换器、防火墙以及管理内容缓存也是至关重要的。\n\
  \n现在，为了为 Java 提供所需的抽象层，封装已经完成。它与协议栈的功能划分保持对齐，以便每一层都能得到适当的封装和处理。\n\n\n\n\n\n请查看下图以理解该过程是如何运作的：\n\
  \n第一个主机 $\\rightarrow$ 路由器 $\\rightarrow$ 路由器 $\\rightarrow$ 第二个主机\n应用 – 进程到进程——应用\n\
  传输 – 主机到主机 –传输\n网络 – 网络 – 网络 – 网络\n链路 – 链路 – 链路 – 链路\n以太网 – 光纤 – 以太网\n\n请注意，层之上的内容是用户应用程序本身中频繁使用的。然而，并没有单一必须遵循的架构模型，特别是当你拥有像\
  \ OSI 模型这样定义模糊的模型时。这是它与其他互联网协议（尤其是早期协议）的主要区别。封装随后涵盖了以下 4 个抽象层：\n\n### 抽象层\n\n首先，查看以下数据：\n\
  \n数据 $\\rightarrow$ 应用\n`UDP Header | UDP DATA` $\\rightarrow$ 传输\n`IP Header |\
  \ IP Data` $\\rightarrow$ 互联网\n`Frame Header | Frame Data | Frame Footer` $\\rightarrow$\
  \ 链路\n\n这意味着：\n\n### 应用层\n\n应用层封装了提供交换应用程序的服务所使用的协议。这包括主机配置协议、路由服务和网络支持服务。示例包括文件传输协议\
  \ (`FTP`)、超文本传输协议 (`HTTP`) 和动态主机配置协议 (`DHCP`)。通过这种方式，你可以根据所使用的协议来降低数据传输。\n\n应用层还将传输层视为一个带有黑盒的稳定网络，允许通信贯穿整个应用程序，同时确保应用程序每个部分的关键属性仍能尽可能良好地工作。应用层发生的任何情况都不会影响传输层和网络层，因为流量通常不会检查该层。然而，有时\
  \ `NAT`（网络地址转换器）必须考虑应用程序的负载，并确保一切运行顺畅。\n\n### 传输层\n\n传输层包含涉及 Java 的数据通道，它还建立了进程到进程的连接和端到端消息传输，为网络中的任何特定目的提供正确的信息和逻辑支持。这可以通过连接的、无连接的或面向对象的方式实现。\n\
  \n端口在传输层的帮助下建立，那里存在着逻辑结构。它基本上意味着：\n\n1. 数据应该是正确的——且只能有极小的错误；\n2. 数据应该按顺序到达；\n3.\
  \ 数据应该包含流量拥塞控制；\n4. 被丢弃或丢失的数据包必须重发，且；\n5. 重复数据必须丢弃。\n\n当这种情况发生时，你可以预计即使是最新版本的流控制协议也能在你的网络中正常工作。不过，你不需要依赖无连接的数据报，因为正如名称所示，它们不提供正确的连接——而且非常不可靠。\n\
  \n### 网络层\n\n基本上，网络层的工作方式是负责发送正确的数据包，并确保它们可以跨越多个网络移动。它的主要功能是：\n\n1. **数据包路由**。这完全关于将数据包从目的地的源发送到需要使用的地方。唯一的协议号标识了这些包。\n\
  2. **主机识别与地址**。通过分级 IP 系统的帮助实现了这一点。\n\n### 链路层\n\n网络方法在链路层中定义。其范围是中间路由器，以及主机网络，包括用于描述网络拓扑结构的协议，数据报也由于各种目标和假设以及严格的分层而变得显而易见。这意味着你可以在任何硬件网络技术之上实现\
  \ Java。\n\n在链路层的帮助下，数据包可以轻松地移动并接收驱动卡数据包，这也意味着该层对应于 OSI 模型。\n\n## 继承\n\n此外，还有继承描述了每个类将继承什么，或者它们如何与其父页面建立关系。\n\
  \n你需要理解的 Java 是它是一个开放系统互连 (OSI) 互联网模型，这意味着它在继承 `()` 中工作。为了建立连接，你需要利用监听继承，以便主机可以调用——换句话说，就是连接。\n\
  \n通过输入 `listen()`，用户将能够接受程序上的 `()` 块。这会将 `()` 程序绑定在一起并使其完整。对于这一点，你可以记住以下几点：\n\n\
  - 客户端：`socket()` $\\rightarrow$ `connect()` $\\rightarrow$ `write()` $\\rightarrow$\
  \ `read()` $\\rightarrow$ `close()`\n- 建立连接：`connect` $\\rightarrow$ `accept()`\n\
  - 发请求：`write()` $\\rightarrow$ `read()`\n- 接收回复：`write()` $\\rightarrow$ `read()`\n\
  - 关闭连接：`close()` $\\rightarrow$ `read()`\n- 服务端：`socket()` $\\rightarrow$ `bind()`\
  \ $\\rightarrow$ `listen()` $\\rightarrow$ `accept()` $\\rightarrow$ `read()` $\\\
  rightarrow$ `write()` $\\rightarrow$ `read()`\n\n如你所示，你能够将它们相互连接，因为你已经在程序中建立了正确的继承——也称为角色。\n\
  \n### 互联网模型\n\n现在，为了让事情更清晰，你必须理解互联网的基本模型。\n\n互联网模型结合了会话层、表示层、应用层以及 Java 的端口，为 `bind()`\
  \ 的发生提供了道路。现在，你必须等待发送端和接收端的响应。这使得请求和消息的交换很容易，直到连接关闭。如果处理得当，发送者和接收者不必担心消息未发送或通信被中断。\n\
  \n连接随后可以仅包含在一个线程中，这样网络理解起来就不会太复杂。通过这种方式，可以创建正确的协议栈。因此，它应该是这样的：\n\n- **OSI 模型**：应用\
  \ $\\rightarrow$ 表示 $\\rightarrow$ 会话 $\\rightarrow$ 传输 $\\rightarrow$ 网络 $\\rightarrow$\
  \ 数据链路 $\\rightarrow$ 物理\n- **互联网模型**：应用 $\\rightarrow$ 传输 $\\rightarrow$ 网络 $\\\
  rightarrow$ 链路\n- **互联网协议**：`HTTPS`, `DNS`, `SSH`, `POP3`, `FTP`, `NNTP`, `TelNet`,\
  \ `IMAP` $\\rightarrow$ `Java`, `UDP` $\\rightarrow$ `IP`, `ICMP`, `ARP`, `DHCP`,\
  \ `Ethernet`, `ADSL`, `PPP`\n\n### 模式\n\n现在，你还需要记住以下几：\n\n1. **Java Stream**。负责为网络提供\
  \ I/O 机制，并提供对端地址。\n2. **Java Acceptor**。允许从工厂类被动接受 Java 机制。它建立了到客户端的连接。\n3. **Java\
  \ Connector**。允许连接到接字，以便服务器之间有良好的关系。\n\n### Stream 类\n\n要开始编程，你可以从 Stream 类开始。它为涉及\
  \ Java 的各种方法提供发送和接收的正确数据，并且包含接字描述符并授予其他权限。某些可能是私有的，以为用户提供更好的体验。\n\n编写代码，你可以遵循以下内容：\n\
  \n```cpp\n#include <sys/types.h>\n#include <sys/socket.h>\n#include <unistd.h>\n\
  #include <string>\n\nusing namespace std\n\nclass JavaStream {\n    int m_sd;\n\
  \    string m_peerIP;\n    int m_peerPort;\n\npublic:\n    class JavaAcceptor;\n\
  \    class JavaConnector;\n\n    ~JavaStream();\n    ssize_t send(char* buffer,\
  \ size_t len);\n    ssize_t receive(char* buffer, size_t len);\n    string getPeerIP();\n\
  \    int getPeerPort();\n\nprivate:\n    JavaStream(int sd, struct sockaddr_in*\
  \ address);\n    JavaStream();\n    JavaStream(const JavaStream& stream);\n};\n\
  ```\n\n## 多态\n\n基本上，Java 多态是定义应用程序的，并作为应用程序不同部分的容器。它们还作为各种应用程序控制器的容器，并且它们始终属于多态。\n\
  \n\n\n\n\n为了创建一个模块，你必须使用 `Java.mobile` 函数。括号中的内容将决定应用程序运行的元素，这样你就可以为应用程序添加过滤器、指令和控制器。示例如所示：\n\
  \n```html\n<div ng-app=\"FavoriteApp\">...</div>\n```\n\n<script>\nvar app = Java.module(\"\
  FavoriteApp\", []); \n</script>\n```\n\n## 添加指令 (Directives)\n\n现在，你可以添加指令来改进你正在创建的应用程序的功能。指令基本上是第\
  \ 2 章中给术语，但也可以是以下任何一项：\n\n1. 验证属性，例如 `$error`、`$invalid` 和 `$dirty`。\n2. `Java.isDate`。如果日期是引用，则返回值。\n\
  3. `Java.isArray`。涉及数组值。\n4. `Java.isNumber`。涉及数值值。\n5. `Java.isFunction`。涉及函数值。\n\
  6. `Java.isElement`。涉及 DOM 元素。\n7. `Java.isDefined`。涉及定义的引用。\n8. `Java.equals`。涉及程序中的相等值。\n\
  9. `Java.isUndefined`。涉及未定义的值。\n10. `Java.isObject`。涉及对象引用。\n11. `Java.forEach()`。这有助于在数组或对象中执行各种函数。\n\
  12. `Java.Copy()`。这提供了数组的深拷贝。\n13. `Java.uppercase()`。将值更改为大写字母。\n14. `Java.lowercase()`。将值更改为小写字母。\n\
  15. `<textarea>`。修改文本区域的行为。\n16. `<select>`。帮助你在程序中创建选择。\n17. `<script>`。修改行为脚本。\n\
  18. `<input>`。帮助你向程序输入不同的函数。\n19. `<form>`。帮助你在程序中创建表单。\n20. `<a>`。这帮助你在程序中输入变量。\n\
  21. `Java.module()`。这帮助你创建、检索或注册多态。\n22. `Java.element()`。利用 JQuery 包装 HTML。\n23.\
  \ `Java.bootstrap()`。手动启动 JS。\n\n你也可以使用自己的指令，这意味着代码看起来像这样：\n\n```html\n<div ng-app=\"\
  FavoriteApp\" w3-test-directive></div>\n```\n\n<script>\nvar app = Java.module(\"\
  FavoriteApp\", []);\napp.directive(\"w3TestDirective\", function() {\n  return {\n\
  \    template : \"I was made in a directive!\"\n  };\n});\n</script>\n```\n\n##\
  \ 添加控制器 (Controllers)\n\n当然，你也可以通过 `ng-controller` 指令向你的代码添加控制器。基本上，它看起来如下：\n\n\
  ```html\n<div ng-app=\"FavoriteApp\" ng-controller=\"myCtrl\">\n{{ FirstName + \"\
  \ \" + lastName }}\n</div>\n```\n\n<script>\nvar app = Java.module(\"FavoriteApp\"\
  , []);\napp.controller(\"myCtrl\", function($scope) {\n  $scope.firstName = \"Harry\"\
  ;\n  $scope.lastName = \"Styles\";\n});\n</script>\n```\n\n## 文件多态 (Polymorphism)\
  \ 与控制器\n\n然后，你可以在文件中创建多态和控制器，这样你的应用程序就会更加定义。对于这一点，你可以复制显示的内容：\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n<script src=\"http://ajax.googleapis.com/ajax/libs/Javajs/1.4.8/Java.min.js\"\
  ></script>\n<body>\n<div ng-app=\"FavoriteApp\" ng-controller=\"myCtrl\">\n{{ firstName\
  \ + \" \" + lastName }}\n</</div>\n<script src=\"FavoriteApp.js\"></script>\n<script\
  \ src=\"myCtrl.js\"></script>\n</body>\n</html>\n```\n\n## 加载库 (Loading the Library)\n\
  \n要加载 Java 库，你必须在 `<head>` 之前和 `<body>` 标签之前加载它。对于这一点，你必须使用 `Java.module` 指令，你会得到如下内容：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<script src=\"http://ajax.googleapis.com/ajax/libs/Javajs/1.4.8/Java.min.js\"\
  ></script>\n<div ng-app=\"FavoriteApp\" ng-controller=\"myCtrl\">\n{{ AppfirstName\
  \ + \" \" + ApplastName }}\n</</div>\n<script>\nvar app = Java.module(\"FavoriteApp\"\
  , []);\napp.controller(\"myCtrl\", function($scope) {\n  $scope.firstName = \"Harry\"\
  ;\n  $scope.lastName = \"Styles\";\n});\n</script>\n</body>\n</html>\n```\n\n# 第\
  \ 9 章 抽象类与接口 (Abstract Classes and Interfaces)\n\n同时，还有更复杂、更详细的类类版本，即抽象类和接口。它们的作用是帮助你的程序稍微安全一点。毕竟，如果所有的类和程序都是相同的，那么很难保护它们免受任何形式的黑客或钓鱼。\n\
  \n涉及到类和接口时，你需要理解这些……\n\n## 过滤器 (Filters)\n\n不，这与给照片添加过滤器来修饰无关。过滤器赋予你的应用程序更多活力——赋予它们某种形式和灵魂——并允许你编写你希望发生在应用程序上的代码。这意味着你必须使用以下变量：\n\
  \n1. `uppercase`。这帮助你将字符串格式化为大写。\n2. `orderBy`。根据使用的表达式对数组进行排序。\n3. `number`。这有助于将数字格式化为字符串。\n\
  4. `lowercase`。这会将字符串格式化为小写字母。\n5. `limitTo`。这限制字符串或数组。\n6. `json`。这有助于格式化对象。\n\
  7. `filter`。这帮助你选择。\n8. `date`。这有助于格式化日期。\n9. `currency`。这有助于格式化数字。\n\n## 表达式过滤器\
  \ (Expression Filters)\n\n管道符号 `|` 用于添加表达式。对于这一点，你可以尝试：\n\n```html\n<div ng-app=\"\
  FavoriteApp\">\n<p>{{ firstName | uppercase }}</p>\n</div>\n```\n\n```html\n<div\
  \ ng-app=\"FavoriteApp\">\n<p>{{ lastName | lowercase }}</p>\n</div>\n```\n\n##\
  \ 货币过滤器 (Currency Filters)\n\n现在，你可以尝试使用过滤器将数字转换为货币，如下所示：\n\n```html\n<div ng-app=\"\
  FavoriteApp\">\n<h1>{{ price }}\n</div\n```\n\n## 指令过滤器 (Directive Filters)\n\n\
  当然，你还可以通过过滤器来调整你的指令。`ng-repeat` 指令在这里至关重要，正如管道符号 `|`。例如，如果你希望变量排序，你应该使用 `orderBy`：\n\
  \n```html\n<div ng-app=\"FavoriteApp\">\n<ul>\n<li ng-repeat=\"x in names | orderBy:'hogwarts'\"\
  >\n{{ x.name + ', ' + x.hogwarts }}\n</li>\n</ul>\n</div>\n```\n\n## 过滤器 (Filter)\n\
  \n等等，什么？嗯，这实际上是真的！这里发生的是你允许从数组中选择子集，但你必须注意只能使用你选择的内容。例如：\n\n```html\n<div ng-app=\"\
  FavoriteApp\">\n<ul>\n<li ng-repeat=\"x in names | filter:i'\">\n\n## 关于接口更多 (More\
  \ about Interface)\n\nJava 接口（称为 `$java`）至关重要，因为它帮助你从远程服务器获取和读取数据。不仅如此，它还允许响应发送给你——使过程成为一种双向体验。你还必须使用某些方法，如下：\n\
  \n1. `.put()`\n2. `.post()`\n3. `.patch()`\n4. `.jsonp()`\n5. `.head()`\n6. `.get()`\n\
  7. `.delete()`\n\n为了向服务器发送简单的请求，你可以尝试以下：\n\n```html\n<div ng-app=\"FavoriteApp\"\
  >\n<p>欢迎来到我的博客：</p>\n<h1>欢迎来到我的博客</h1>\n</div>\n```\n\n<script>\nvar app = Java.module('myApp',\
  \ []);\napp.controller('myCtrl', function($scope, $java) {\n  $java.get(\"welcome.htm\"\
  )\n  .then(function(response) {\n    $scope.myWelcome = response.data;\n  });\n\
  });\n</script>\n```\n\n为了使用上面给的方法，你可以编写如下所示的代码：\n\n```javascript\nvar app = Java.module('myApp',\
  \ []);\napp.controller('myCtrl', function($scope, $java) {\n  $java({\n    method:\
  \ \"GET\",\n    url: \"welcome.htm\"\n  }).then(function mySucces(response) {\n\
  \    $scope.myWelcome = response.data;\n  });\n});\n```\n\n\n\n\n\n```javascript\n\
  \    }, function myError(response) {\n        $scope.myWelcome = response.statusText;\n\
  \    });\n});\n```\n\n如果你想编写 HTTP 或服务，某些属性是必须观察的。以下是列出的属性：\n\n1. `.statusText`。这是一个定义\
  \ HTTP 状态的字符串。\n2. `.status`。这是一个定义 HTTP 状态的数字。\n3. `.headers`。此函数用于获取有关函数的信息。\n\
  4. `.data`。这是一个携带服务器响应的对象或字符串。\n5. `.config`。它用于从你屏幕上的对象生成请求。\n\n为了更好地理解这一点，你可以查看下面的示例：\n\
  \n```javascript\nvar app = Java.module('myFavoriteApp', []);\n\napp.controller('myCtrl',\
  \ function($scope, $java) {\n    $java.get(\"welcometomyblog.htm\")\n    .then(function(response)\
  \ {\n        $scope.content = response.data;\n        $scope.statuscode = response.status;\n\
  \        $scope.statustext = response.statustext; \n    });\n});\n```\n\n```javascript\n\
  var app = Java.module('myFavoriteApp', []);\n\napp.controller('myCtrl', function($scope,\
  \ $java) {\n    $java.get(\"wrongfilename.htm\")\n    .then(function(response) {\n\
  \        //第一个函数处理成功\n        $scope.content = response.data;\n    }, function(response)\
  \ {\n        //第二个函数处理错误\n        $scope.content = \"Something is wrong\";\n   \
  \ });\n});\n```\n\n## JSON 对象\n\n同时，JSON 对象主要关于你如何将数据从 JavaScript 传输到 Java，反之亦然。`ng-repeat`\
  \ 指令应该为此功能进行循环处理。例如，你想将数据从一个 Blogspot 博客导入到 WordPress 博客，这意味着你正在使用 JSON 对象。\n\n\
  你还应该注意，$java.get()` 全都是关于读取 JSON 数据的，而 `$java()` 主要是关于 `XMLHttpRequestObject`。这里有一个很好的例子：\n\
  \n```html\n<div ng-app=\"myFavoriteApp\" ng-controller=\"studentsCtrl\"> \n<ul>\n\
  \  <li ng-repeat=\"x in myData\">\n    {{ x.Name + ', ' + x.house }}\n  </li>\n\
  </ul>\n</div>\n```\n\n```javascript\nvar app = Java.module('myApp', []);\n\napp.controller('studentsCtrl',\
  \ function($scope, $java) {\n    $java.get(\"students.php\").then(function(response)\
  \ {\n        $scope.myData = response.data.records;\n    });\n});\n```\n\n## 服务\n\
  \n使用服务也是重要的，因为它们允许将某些功能限制为你的应用程序，这样其他人就不会去复制它们，并导致你处理版权索赔。\n\nJava 提供了许多服务，但最重要的是\
  \ `$location`。它允许你将某些对象保存到云端并保持它们安全，这样即使你的计算机或外部硬盘损坏，你也知道你的数据仍然存在——这在你处理程序和应用程序时尤为重要。以下是一些示例：\n\
  \n```javascript\nvar app = Java.module('myFavoriteApp', []);\n\napp.controller('studentsCtrl',\
  \ function($scope, $location) {\n    myUrl = $location.absUrl();\n});\n```\n\n你还可以使用\
  \ `$timeout` 服务或 `window.setTimeout` 来帮助你创建倒计时——这些主要用于事件、显示等。例如：\n\n```javascript\n\
  var app = Java.module('myFavoriteApp', []);\n\napp.controller('myCtrl', function($scope,\
  \ $timeout) {\n    $scope.myHeader = \"Hi People!\";\n    $timeout(function () {\n\
  \        $scope.myHeader = \"How are you doing today?\";\n    }, 2016);\n});\n```\n\
  \n同时，$java` 服务可以用于获取来自服务器的数据。这里有一个很好的例子：\n\n```javascript\nvar app = Java.module('myFavoriteApp',\
  \ []);\n\napp.controller('myCtrl', function($scope, $java) {\n    $java.get(\"welcometomyblog.htm\"\
  ).then(function (response) {\n        $scope.myWelcome = response.data;\n    });\n\
  });\n```\n\n你还可以尝试通过以下方式自定义你的服务：\n\n```javascript\nvar app = Java.module('myFavorite',\
  \ []);\n\napp.controller('myCtrl', function($scope, $timeout) {\n    $scope.myHeader\
  \ = \"Hi everyone!\";\n    $timeout(function () {\n        $scope.myHeader = \"\
  How are you doing today?\";\n    }, 2000);\n});\n```\n\n```javascript\nvar app =\
  \ Java.module('Favoriteapp', []);\n\napp.controller('myCtrl', function($scope, $interval)\
  \ {\n    $scope.theTime = new Date().toLocale();\n    $interval(function () {\n\
  \        $scope.theTime = new Date().toLocale();\n    }, 1010);\n});\n```\n\n```javascript\n\
  app.controller('myCtrl', function($scope, hexafy) {\n    $scope.hex = hexafy.myFunc(255);\n\
  });\n\napp.service('hexafy', function() {\n    this.myFunc = function (x) {\n  \
  \      return x.toString(16);\n    }\n});\n```\n\n```javascript\napp.filter('myFormat',\
  \ ['hexify', {\n    return function(x) {\n        return hexify.myFunc(x);\n   \
  \ };\n}]);\n\napp.controller('myCtrl', function($scope, hexafy) {\n    $scope.hex\
  \ = hexafy.myFunc(259);\n});\n```\n\n# 第 10 章 条件与控制流\n\n## 条件语句\n\n你知道有时，你倾向于编辑程序并赋予它个性化色彩吗？很好，条件语句在这很有帮助。条件语句的特点在于，它们在某种程度上赋予了你让程序属于自己的能力，为此，这里是一些你可以做的事情，以让程序按照你想要的方式运行。\n\
  \n## Java 表单\n\n当然，有时你需要为你的网站或应用程序添加表单，以便从你的订阅者那里获取信息，只需确保他们不是垃圾邮件机器人。为此，使用了以下输入元素：\n\
  \n1. 文本区域元素\n2. 按钮元素\n3. 选择元素\n4. 输入元素\n\n你还应该注意以下几：\n\n1. `Ng-click` 仅在用户点击按钮时直接调用\
  \ `reset()` 方法。\n2. `reset()` 方法使 `master` 和 `user` 对象相等。\n3. `formCTRL` 控制器专门用于控制你在应用程序或网站上的表单。\n\
  4. `ng-model` 将两个用户元素绑定在一起。\n5. `ng-app` 定义了主应用程序。\n\n为了让这更清晰，你可以尝试下面的示例：\n\n```html\n\
  <div ng-app=\"myFavoriteApp\" ng-controller=\"formCtrl\">\n  <form novalidate>\n\
  \    名字:<br>\n    <input type=\"text\" ng-model=\"user.firstName\"><br>\n    姓:<br>\n\
  \    <input type=\"text\" ng-model=\"user.lastName\">\n    <br><br>\n    <button\
  \ ng-click=\"reset()\">重置</button>\n  </form>\n  <p>form = {{user}}</p>\n  <p>master\
  \ = {{master}}</p>\n</div>\n```\n\n```javascript\nvar app = Java.module('myFavoriteApp',\
  \ []);\n\napp.controller('formCtrl', function($scope) {\n    $scope.master = {firstName:\
  \ \"Harry\", lastName: \"Potter\"};\n    $scope.reset = function() {\n        $scope.user\
  \ = Java.copy($scope.master);\n    };\n    $scope.reset();\n});\n```\n\n现在，如果你想为你的表单创建选择框（Select\
  \ Boxes），你可以尝试下面的示例。这些框很重要，因为它们允许人们选择他们想要的内容。\n\n```html\n<form>\n选择主题:\n<select\
  \ ng-model=\"myVar\">\n  <option value=\"\">\n  <option value=\"stdnts\">Students</\n\
  \  <option value=\"cats\">Cats</\n  <option value=\"house\">houses</\n</select>\n\
  </form>\n```\n\n同时，你还可以通过 `ng-model` 指令放置单选按钮。这意味着虽然人们在屏幕上看到的可能不同，但只有选中的项目会被反映——使得应用程序中发生的情况更容易理解。\n\
  \n例如，如果你的选择框是：\n\n```html\n<form>\n选择主题:\n<select ng-model=\"myVar\">\n  <option\
  \ value=\"\">\n  <option value=\"stdnts\">Students</\n  <option value=\"cats\">Cats</\n\
  \  <option value=\"house\">houses</\n</select>\n</form>\n```\n\n那么意味着你的值应该基于下面的变量：\n\
  \n```html\n<form>\n挑选主题:\n<input type=\"radio\" ng-model=\"myVar\" value=\"stdnts\"\
  >Students\n<input type=\"radio\" ng-model=\"myVar\" value=\"cats\">cats\n<input\
  \ type=\"radio\" ng-model=\"myVar\" value=\"house\">houses\n</form>\n```\n\n\n\n\
  \n\n对于复选框，它基本上意味着你想知道某项的值是 true 还是 false。当你应用 `ng-model` 指令时，该值将显示于你正在使用的应用程序中。在这种情况下，你必须像下面所示编写代码：\n\
  \n```html\n<form>\n    勾选显示你喜欢的标题：\n    <input type=\"checkbox\" ng-model=\"myVar\"\
  >\n</form>\n\n<h1 ng-show=\"myVar\">我最喜欢的标题</h1>11\n```\n\n# Java 表格\n\n当然，为了更好地解释内容，你也可以为你的应用程序或网站添加表格。`ng-repeat`\
  \ 指令在这里至关重要。若要在表格中显示数据，你可以尝试以下操作：\n\n```html\n<div ng-app=\"myFavoriteApp\" ng-controller=\"\
  studentsCtrl\"> \n  <table>\n    <tr ng-repeat=\"x in names\">\n      <td>{{ x.Name\
  \ }}</td>\n      <td>{{ x.houses}}</td>\n    </tr>\n  </table>\n</div>\n```\n\n\
  ```javascript\n<script>\nvar app = Java.module('myFavoriteApp', []);\n\napp.controller('customersCtrl',\
  \ function($scope, $java) {\n    $java.get(\"$Java://www.hogwartshouses.com/Java/customers.php\"\
  )\n    .then(function (response) {$scope.names = response.data.records;});\n});\n\
  </script>\n```\n\n为了保持你的信息有序，你必须使用 `orderBy` 指令。在下文中可以看到一个很好的示例：\n\n```html\n<table>\n\
  \  <tr ng-repeat=\"x in names | orderBy : 'house'\">\n    <td>{{ x.Name }}</td>\n\
  \    <td>{{ x.house }}</td>\n  </tr>\n</table>\n```\n\n你还可以在你的表格上显示 CSS 样式元素。要实现这一点，你可以尝试编写以下元素：\n\
  \n```css\n<style>\ntable, th , td {\n  border: 1px purple;\n  border-collapse: collapse;\n\
  \  padding: 8px;\n}\ntable tr:nth-child(odd) {\n  background-color: #f1f1f1;\n}\n\
  table tr:nth-child(even) {\n  background-color: #ffffff;\n}\n</style>\n```\n\n最后，为了进一步自定义，你可以将字母更改为大写，输入表格索引，并使用\
  \ `$odd` 和 `$even` 因子。查看下方的示例：\n\n```html\n<table>\n  <tr ng-repeat=\"x in names\"\
  >\n    <td ng-if=\"$odd\" style=\"background-color:#f1f1f1\">{{ x.Name }}</td>\n\
  \    <td ng-if=\"$even\">{{ x.Name }}</td>\n    <td ng-if=\"$odd\" style=\"background-color:#f1f1f1\"\
  >{{ x.house }}</td>\n    <td ng-if=\"$even\">{{ x.house }}</td>\n  </tr>\n</table>\n\
  \n<table>\n  <tr ng-repeat=\"x in names\">\n    <td>{{ $index + 1 }}</td>\n    <td>{{\
  \ x.Name }}</td>\n    <td>{{ x.house }}</td>\n  </tr>\n</table>\n\n<table>\n  <tr\
  \ ng-repeat=\"x in names\">\n    <td>{{ x.Name }}</td>\n    <td>{{ x.house| uppercase\
  \ }}</td>\n  </tr>\n</table>\n```\n\n# 控制流语句\n\n当然，还有控制流语句，它们通过利用你系统中的 Java 控制器来帮助程序顺畅运行。\n\
  \n对于这一个，你必须使用 `JavaConnector::connect` 语法，以便获取你所需的 IP 地址字符串，以及能够真正工作的服务器和客户端。\n\n\
  然后你可以对服务器使用 `struct sockaddr_in`，并在监听你需要的连接时将其设为 `PF_INET`。你还必须注意以下控制器：\n\n### 控制器\
  \ 17 到 20\n这些被称为 `connect::passing()`，因为它们在 `sockaddr_in` 指针的帮助下将用户指向正确的结构。它将帮助你了解该结构的长度，这样你就不会将其与程序的其他函数以及网络本身混淆。\n\
  \n### 控制器 16\n这是 `socket()` 的第一个参数，以便你可以选择特定的并选择通信网络的协议族。应该使用 `SOCK_STREAM` 和 `PF_INET`，因为它们配合得良好。\n\
  \n### 控制器 13 到 15\n这些控制器统称为 `JavaConnector::resolvehost`。它们能够将名称字符串和 DNS 主机转换为 IP\
  \ 地址，以便使每一个假设都能转换为不同的网络地址。\n\n### 控制器 5 到 10\n这些被用于解析主机，因为它们在 `JavaConnector::resolvehostname()`\
  \ 语法下工作，并且能够在 `getaddridinfo()` 函数的帮助下转换 IP 地址和主机名。这比仅用 `gethostname()` 好得多，因为它被称为安全的线程。\n\
  \n现在，为了连接到服务器，你只需要编写以下代码：\n\n```cpp\n#include <string.h>\n#include <netdb.h>\n#include\
  \ <arpa/inet.h>\n#include \"Javaconnector.h\"\n\nMyJavaStream* MyJavaConnector::connect(const\
  \ char* server, int port)\n{\n    struct sockaddr_in address;\n    memset (&address,\
  \ 0, sizeof(address));\n    address.sin_family = AF_INET;\n    address.sin_port\
  \ = htons(port);\n    if (resolveName(server, &(address.sin_addr)) != 0) {\n   \
  \     inet_pton(PF_INET, server, &(address.sin_addr));\n    }\n    int sd = socket(AF_INET,\
  \ SOCK_STREAM, 0);\n    if (connect(sd, (struct sockaddr*)&address, sizeof(address))\
  \ != 0) {\n        return NULL;\n    }\n    return newJavaStream(sd);\n}\n\nint\
  \ JavaConnector::resolveName(const char* hostname, struct in_addr* addr)\n{\n  \
  \  struct addrinfo *res;\n    int result = getaddrinfo(hostname, NULL, NULL, &res);\n\
  \    if (result == 0) {\n        addr->s_addr = ((struct sockaddr_in*)res->ai_addr)->sin_addr;\n\
  \        freeinfo(res);\n    }\n    return result;\n}\n```\n\n# 第 11 章 处理错误\n\n\
  最后，你还必须学习程序不正常工作的情况。对于这一点，你使用 `SO_REUSEADDR` 标志来防止端口被占用的错误。\n\n要开始监听连接，请尝试代码：\n\n\
  ```cpp\nint myJavaAcceptor::start()\n{\n    if (m_listening == true) {\n       \
  \ return 0;\n    }\n    m_lsd = socket(PF_INET, SOCK_STREAM, 0);\n    struct sockaddr_in\
  \ address;\n    memset(&address, 0, sizeof(address));\n    address.sin_family =\
  \ PF_INET;\n    address.sin_port = htons(m_port);\n    if (m_address.size() > 0)\
  \ {\n        inet_pton(PF_INET, m_address.c_str(), &(address.sin_addr));\n    }\n\
  \    else {\n        address.sin_addr.s_addr = INADDR_ANY;\n    }\n    int optval\
  \ = 1;\n    setsockopt(m_lsd, SOL_SOCKET, SO_REUSEADDR, &optval, sizeof optval);\n\
  }\n```\n\n\n\n\n\n```cpp\nint result = bind(m_lsd, (struct sockaddr*)&address, sizeof(address));\n\
  \nif (result != 0) {\n    perror(\"bind() failed\");\n    return result;\n}\nresult\
  \ = listen(m_lsd, 5);\nif (result != 0) {\n    perror(\"listen() failed\");\n  \
  \  return result;\n}\nm_listening = true;\nreturn result;\n}\n```\n\n要接受客户端连接，尝试编写以下代码：\n\
  \n```cpp\nmyJavaStream* JavaAcceptor::accept()\n{\n    if (m_listening == false)\
  \ {\n        return NULL;\n    }\n    struct sockaddr_in address;\n    socklen_t\
  \ len = sizeof(address);\n    memset(&address, 0, sizeof(address));\n    int sd\
  \ = ::accept(m_lsd, (struct sockaddr*)&address, &len);\n    if (sd < 0) {\n    \
  \    perror(\"accept() failed\");\n        return NULL;\n    }\n    return new JavaStream(sd,\
  \ &address);\n}\n```\n\n# 理解接受器类 (Acceptor Classes)\n\n然后，你还需要更多关于接受器类，或者说系统最初似乎并不接受的类。\n\
  \n这些包括 `Java Port`，以及 `IP Address`。一旦你建立了正确的连接，屏幕上将显示标记。为了这一点，你可以尝试编写以下代码：\n\n```cpp\n\
