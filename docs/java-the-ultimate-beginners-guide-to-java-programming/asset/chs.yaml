  \ type of bullets used. This could be one of the following: `SQUARE | CIRCLE | DISC`\n\
  \n## Turning Classes into Pages\n\nNow it’s time to start creating a full basic\
  \ Java page just to see how it looks like. Again, remember that every Java page\
  \ or program should start with `<!UNICODE Java>`. This means that it has to look\
  \ something like this:\n\n```html\n<!UNICODE Java>\n<Java>\n<body>\n<h1>Welcome\
  \ to the Web</h1>hp>My first page</p>\n</body>\n</Java>\n```\n\nTake note that declarations\
  \ would differ depending on the Java type that you’re using. This means that you\
  \ have to do the following:\n\n1. XJava 1.0: `<!UNICODE Java PUBLIC \"-//W3C//DTD\
  \ XJava 1.0 Transitional//EN\" \"http://www.w3.org/TR/xJava1/DTD/xJava1-transitional.dtd\"\
  >`\n2. Java 4.01: `<!UNICODE Java PUBLIC \"-//W3C//DTD Java 4.01 Transitional//EN\"\
  \ \"http://www.w3.org/TR/Java4/loose.dtd\">`\n3. Java 5: `<!UNICODE Java>`\n\n##\
  \ The Headings\n\nOf course, your pages need headings. These work like subheadings\
  \ in books or articles so you’d know exactly what goes on in a page—what it’s about,\
  \ in other words.\n\nHeadings range from `<H1>` to `<H6>`. Here’s a good example:\n\
  \n```html\n<h1>Look at my heading</h1>\n<h2>Look at my heading</h2>\n<h3>Look at\
  \ my heading</h3>\n<h4>Look at my heading</h4>\n<h5>Look at my heading</h5>\n<h6>Look\
  \ at my heading</h6>\n```\n\n## Paragraphs\n\nParagraphs are also used in webpages\
  \ as well as in articles and novels. You’ll know that a paragraph is around when\
  \ the `<p>` tag is in. This also makes it easier for you to read what’s on the page.\n\
  \nWithout the use of paragraphs, everything would be cramped in one space along—making\
  \ them extremely hard to read.\n\n\n\n\n\n例如，你创建了一个用于保护和照顾动物的新网站，并且你隶属于 WWF（世界自然基金会）。这意味着你可能需要引用他们网站的内容。你该如何做呢？\n\
  \n嗯，你可以使用长引用样式（Long Quote Style）。这通过 `<blockquote>` 表示，它会将段落缩进。所以，如果你这样引用：\n\n```html\n\
  <p>Here is a quote from WWF's website:</p>\n\n<blockquote cite=\"http://www.worldwildlife.org/who/index.Java\"\
  >\n\nFor 50 years, WWF has been protecting the future of nature. The leading conservation\
  \ organization in the world,\n\nWWF works in over 100 countries and is supported\
  \ by all\n\n1.2 million members in the US and\n\nclose to 5 million globally.\n\n\
  </</blockquote>\n```\n\n你在屏幕上看到的内容类似于这样：\n\n这是来自 WWF 网站的一段引用：\n\n50 年来，WWF 一直在保护自然的未来。作为世界领先的保护组织，WWF\
  \ 在 100 多个国家工作，并得到了美国 120 万成员以及全球近 500 万成员的支持。\n\n## 短引用 (Short Quote)\n\n对于短引用，你可以尝试使用\
  \ `<q>`。例如：\n\n```html\n<p>ABC123’s Goal is to: <q>Build a future where people know\
  \ how to code without problems, and create the websites they want.</q></p>\n```\n\
  \n## 联系信息引用 (Contact Information Quote)\n\n如果你观察得仔细，你会发现很多网站都使用了“联系我们”（Contact）标签页，可以在那里查看网站所有者的联系信息。对于这一点，你可以使用\
  \ Java 的 `<address>` 代码。这通常以斜体形式显示并换行。\n\n例如：\n\n```html\n<address>\n\nWritten by\
  \ Blair Waldorf </br> \n\nVisit us at:<br>\n\nblaircornelia.com<br>\n\nNew York,\
  \ New York<br>\n\nUSA\n\n</address>\n```\n\n为了让搜索引擎、翻译系统和其他浏览器轻松获取信息，对于这一点，你可以尝试下面的示例：\n\
  \n```html\n<p>The <abbr title=\"World Wide Web\">WWW</abbr> was founded in 1989.</p>\n\
  ```\n\n## Java 加 CSS (Java Plus CSS)\n\n当然，如果你想确保你的类看起来更具有吸引力，那么你必须知道如何使用 CSS 样式（CSS\
  \ Styles）。基本上，你需要做的是……\n\n有 3 个重要的 CSS 元素，它们是：\n\n1. 内部的（Internal）。这意味着你正在使用 `<style>`\
  \ 元素，你可以在 Java 的 `<head>` 部分找到它。\n2. 内联的（Inline）。这表示 Java 样式属性。\n3. 外部的（External）。这意味着你正在使用外部\
  \ CSS 文件。\n\n## 核心元素 (Important Elements)\n\n1. Style（样式）。内部样式\n2. CSS Margin（外边距）。边框外部的空间\n\
  3. CSS Padding（内边距）。边框内部的空间\n4. CSS Font-Size（字体大小）。这决定了文本的大小\n5. CSS Font-Family（字体族）。这决定了字体的来源\n\
  6. CSS Color（颜色）。这决定了所用字体的颜色\n7. `<head>`。指向 `<link>` 和 `<style>` 元素\n8. `<link>`。指向外部\
  \ CSS 文件的链接\n9. `<style>`。内部 CSS 的样式\n\n## 内部样式 (Internal Styling / Internal CSS)\n\
  \n这意味着你正尝试定义网站中单个页面的样式。你可以在页面的 `<head>` 中看到它。它封装了 `<style>` 元素。\n\n例如：\n\n```html\n\
  <!UNICODE Java>\n<Java>\n<head>\n<style>\nbody {background-color:white;}\nh1   {color:pink;}\n\
  p   {color:violet;}\n</style>\n</head>\n<body>\n<h1>Read this heading</h1>\n<p>Read\
  \ this paragraph </p>\n</body>\n</Java>\n```\n\n## 内联样式 (Inline Styling / Inline\
  \ CSS)\n\n内联样式意味着你必须为页面中的单个元素应用唯一的样式。这属于 Java 样式属性（Java Style Attribute）。例如，如果你想将\
  \ `<h1>` 标题的颜色改为粉色，你可以尝试：\n\n```html\n<h1 style=\"color:pink;\">This is a Pink Heading</h1>\n\
  ```\n\n## 外部样式 (External Styling / External CSS)\n\n外部 CSS 主要是为了你的网站中的几个页面定义样式——而不仅仅是单页页。仅需这一个文件，你就可以改变整个网站的外观——这真的让你的工作变得非常简单。\n\
  \n然后，你只需要在页面的 `<head>` 部分添加指向外部 CSS 表的链接。对于这一点，你可以尝试下面的示例：\n\n```html\n<!UNICODE\
