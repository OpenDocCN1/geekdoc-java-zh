  firstName='Mark';lastName='Ruffalo'\">\n  <p>名字是 {{ firstName + \" \" + lastName\
  \ }}</p>\n</div>\n```\n\n#### 如何格式化 Java 字符串\n\n有些人认为 Java 字符串处理起来极其复杂。然而，你并不真的需要害怕它们。在格式化\
  \ Java 字符串时，你需要了解以下内容……\n\n### 工作字符串\n\n你首先必须意识到，有某些元素被称为 Java 工作字符串。\n\nJava 工作字符串基本上是被引号括起来的字符。使用这些字符串时，单引号被认为等同于双引号，所以你可以预期：\n\
  \n`var1 = 'Hello World!'`\n`var2 = \"Java Programming\"`\n\n### 访问值\n\n记住，字符类型不被\
