  \ World!'\nvar2 = \"Java Programming\"\nprint \"var1[0]: \", var1[0]\nprint \"var2[1:5]:\
  \ \", var2[1:5]\n```\n\n当你输入这些命令时，你将得到结果：\n\n`var1[0]: H`\n`var2[1:5]: ytho`\n\n\
