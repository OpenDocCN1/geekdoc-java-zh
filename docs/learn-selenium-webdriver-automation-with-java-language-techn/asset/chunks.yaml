    147\. How do you handle alerts, pop-ups, and frames using WebDriver?


    Answer: You can use driver.switchTo().alert() to handle alerts, driver.switchTo().frame()
    to switch to frames, and driver.getWindowHandles() to manage pop-up windows.


    148\. How can you perform mouse actions using WebDriver?


    Answer: WebDriver provides the Actions class to perform mouse actions like moveToElement(),
    click(), doubleClick(), contextClick(), and dragAndDrop().


    149\. How can you handle browser cookies using WebDriver?


    Answer: You can use the addCookie(Cookie cookie) method to add a specific cookie,
    and getCookies() to retrieve all cookies for the current domain. You can also
    delete cookies using deleteCookieNamed(String name) or deleteAllCookies().


    150\. What is the WebDriver get() and navigate().to() difference?


    Answer: Both get() and navigate().to() are used to navigate to a URL. However,
    navigate().to() provides more navigation options like navigating back and forward,
    and allows you to maintain navigation history.


    151\. How can you handle synchronization issues like Ajax calls and page load
    delays?


    Answer: To handle synchronization issues, you can use implicit waits (implicitlyWait()),
    explicit waits (WebDriverWait and ExpectedConditions), and handling custom wait
    conditions for Ajax calls using JavaScriptExecutor.


    152\. What is WebDriver''s WebDriverWait and how does it work?


    Answer: WebDriverWait is a class that waits for a specified condition to occur
    before proceeding. It repeatedly polls the condition until it is met or a timeout
    is reached. This is useful for explicit waits.


    153\. How can you handle dropdowns using WebDriver?


    Answer: You can interact with dropdowns using the Select class. Create an instance
    of Select using the Select constructor, and then use methods like selectByVisibleText(),
    selectByValue(), and selectByIndex().


    154\. What is WebDriver''s DesiredCapabilities and when is it used?


