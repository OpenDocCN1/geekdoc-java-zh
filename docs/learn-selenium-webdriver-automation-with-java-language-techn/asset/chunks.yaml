    \n# Selenium Webdriver - 断言 (Assertions)\n\n断言是 Selenium WebDriver 中用于验证应用程序行为是否符合预期的工具。它们有助于确保网页上的元素、文本或条件符合标准。当断言失败时，表示偏离了预期行为，允许测试人员识别问题。Selenium\
    \ WebDriver 本身不提供原生断言方法，但你可以使用 Java 自带断言或流行的断言库（如 TestNG、JUnit 或 AssertJ）。\n\n\
    以下是使用 JUnit 在 Selenium WebDriver 中执行断言的方法：\n\n### JUnit 断言\nJUnit 在 `org.junit.Assert`\
