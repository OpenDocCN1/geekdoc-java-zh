    methods.


    * * *


    @Test(priority = 1)


    public void testHighPriority() {


    // High-priority test code


    }


    @Test(priority = 2)


    public void testLowPriority() {


    // Low-priority test code


    }


    @Listeners (On Class): In addition to applying @Listeners at the class level,
    you can also use it at the suite level in the TestNG XML configuration file to
    specify listeners that apply to multiple test classes.


    * * *


    <suite name="MyTestSuite">


    <listeners>


    <listener class-name="com.example.CustomListener" />


    </listeners>


    <test name="MyTest">


    <!-- Test and class configurations -->


    </test>


    </suite>


    @BeforeTest and @AfterTest (On Method): These annotations can be used at the method
    level to perform setup and teardown tasks specifically before and after a test
    defined in the TestNG XML configuration file.


    * * *


    @BeforeTest


    public void setupForTest() {


    // Test-specific setup


    }


    @AfterTest


    public void teardownAfterTest() {


    // Test-specific teardown


    }


