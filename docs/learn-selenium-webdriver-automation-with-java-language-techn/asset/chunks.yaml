    String promptText = prompt.getText();


    // Enter text into the prompt


    prompt.sendKeys("Your response");


    // Accept the prompt (clicking "OK")


    prompt.accept();


    // Dismiss the prompt (clicking "Cancel" or "X" button)


    // prompt.dismiss();


    Remember to switch back to the main window or the default content after handling
    the alert, confirm, or prompt to continue interacting with the web page. You can
    use driver.switchTo().defaultContent() to switch back to the main content.


    1\. void dismiss()


    This method is used to click on the ''Cancel'' button of the alert.


    driver.switchTo().alert().dismiss();


    2\. void accept()


    This method is used to click on the ''Ok'' button of the alert.


    driver.switchTo().alert().accept();


    3\. String getText()


    This method is used to capture the alert message.


    driver.switchTo().alert().getText();


    4\. void sendKeys(String stringToSend)


    This method is used to send some data to the alert box.


    driver.switchTo().alert().sendKeys("Text");


    # Selenium Webdriver - Handling Radio buttons


    Handling radio buttons in Selenium WebDriver with Java involves locating the radio
    button elements and then selecting the desired option. Radio buttons are typically
    used in groups where only one option can be selected at a time. Here''s how you
    can handle radio buttons:


    1\. Locate Radio Buttons: 


    First, you need to locate the radio button elements on the web page. You can use
    any of the locating strategies mentioned earlier (e.g., By.id, By.name, By.xpath,
    By.cssSelector, etc.) to find the radio button elements. For example:


    ![](image_rsrc23W.jpg)


    * * *


    WebElement radioButton1 = driver.findElement(By.id("radioButton1"));


    WebElement radioButton2 = driver.findElement(By.id("radioButton2"));


    2.Select a Radio Button:


    You can select a radio button by clicking on it using the click() method:


    * * *


    radioButton1.click(); // Selects the first radio button


    To select another radio button within the same group, you can click on that radio
    button instead:


    * * *


    radioButton2.click(); // Selects the second radio button


    Note that selecting one radio button in a group automatically deselects any previously
    selected radio button in the same group.


    3.Verify the Selection:


    To verify that a radio button is selected, you can use the isSelected() method:


    * * *


    boolean isRadioButton1Selected = radioButton1.isSelected();


    boolean isRadioButton2Selected = radioButton2.isSelected();


    The isSelected() method will return true if the radio button is selected and false
    if it''s not.


    Example for Selecting Radio Buttons in a Group:


    If you have a group of radio buttons, you can iterate through them and select
    the desired one based on a condition. For instance:


    * * *


    List<WebElement> radioButtons = driver.findElements(By.name("gender")); // Assuming
    the radio buttons have the same ''name''


    ![](image_rsrc23X.jpg)


    for (WebElement radioButton : radioButtons) {


    if (radioButton.getAttribute("value").equals("female")) {


    radioButton.click(); // Select the ''Female'' radio button


    break; // Exit the loop once the desired option is selected


    }


    }


    In this example, we''re selecting the "Female" radio button from a group of radio
    buttons with the name "gender."


    # Selenium Webdriver- Handling Checkbox


    Handling checkboxes in Selenium WebDriver with Java is straightforward. You can
    interact with checkboxes to check (select) or uncheck (deselect) them using the
    click() method of the WebElement. Here''s how you can handle checkboxes:


    ![](image_rsrc23Y.jpg)


    1.Locate the Checkbox Element:


    You need to locate the checkbox element on the web page using one of the locating
    strategies mentioned earlier (e.g., By.id, By.name, By.xpath, By.cssSelector,
    etc.). For example:


    * * *


    WebElement checkboxElement = driver.findElement(By.id("checkbox_id"));


    2.Select (Check) the Checkbox:


    To select (check) the checkbox, you can use the click() method:


    * * *


    checkboxElement.click();


    This code will check the checkbox if it''s currently unchecked. If it''s already
    checked, it will uncheck it.


    3.Verify the Checkbox State:


    To verify if the checkbox is checked or unchecked, you can use the isSelected()
    method:


    * * *


    boolean isCheckboxSelected = checkboxElement.isSelected();


    The isSelected() method will return true if the checkbox is checked and false
    if it''s unchecked.


    Example for Handling Multiple Checkboxes:


    If you have multiple checkboxes and want to select one or more based on specific
    conditions, you can use a loop or conditional statements. For example:


    ![](image_rsrc23Y.jpg)


    * * *


    List<WebElement> checkboxes = driver.findElements(By.name("interests")); // Assuming
    the checkboxes have the same ''name''


    for (WebElement checkbox : checkboxes) {


    if (checkbox.getAttribute("value").equals("sports")) {


    if (!checkbox.isSelected()) {


    checkbox.click(); // Check the ''sports'' checkbox if it''s not already checked


    }


    } else if (checkbox.getAttribute("value").equals("music")) {


    if (!checkbox.isSelected()) {


    checkbox.click(); // Check the ''music'' checkbox if it''s not already checked


    }


    }


    }


    In this example, we''re selecting the "sports" and "music" checkboxes based on
    their values.


    # Selenium Webdriver - Assertions


    Assertions are essential in Selenium WebDriver for verifying that the web application
    behaves as expected during test automation. They help ensure that the elements,
    text, or conditions on a web page meet the expected criteria. When assertions
    fail, they indicate a deviation from the expected behavior, allowing testers to
    identify issues quickly. Selenium WebDriver doesn''t provide native assertion
    methods, but you can use Java''s built-in assertions or popular assertion libraries
    like TestNG, JUnit, or AssertJ for this purpose.


    Here''s how you can perform assertions in Selenium WebDriver using Java with JUnit
    as an example:


    JUnit Assertions:


    JUnit provides various assertion methods in the org.junit.Assert class that you
    can use to verify conditions in your test cases. Here''s how you can use JUnit
    assertions:


    1.Import the JUnit assertion library:


    * * *


    import org.junit.Assert;


    Use assertion methods to check conditions. Some commonly used methods include:


    2.assertEquals(expected, actual): Verifies that the expected value is equal to
    the actual value.


    * * *


    Assert.assertEquals("Expected Title", driver.getTitle());


    3.assertTrue(condition): Verifies that the given condition is true.


    * * *


    Assert.assertTrue(driver.findElement(By.id("element_id")).isDisplayed());


    4.assertFalse(condition): Verifies that the given condition is false.


    * * *


    Assert.assertFalse(driver.findElement(By.name("element_name")).isEnabled());


    5.assertNotNull(object): Verifies that the given object is not null.


