    142\. How can you locate web elements using WebDriver?


    Answer: WebDriver provides various methods to locate web elements, such as findElement(By
    locator) and findElements(By locator). Common locators include By.id(), By.name(),
    By.className(), By.tagName(), By.linkText(), and By.partialLinkText().


    143\. What is the difference between findElement() and findElements() methods?


    Answer: findElement() returns the first matching web element or throws an exception
    if not found, while findElements() returns a list of matching elements (or an
    empty list if none are found).


    144\. How do you perform actions like clicking a button or filling a form using
    WebDriver?


    Answer: WebDriver provides methods like click(), sendKeys(), clear(), etc., to
    perform actions on web elements. For example:


    WebElement button = driver.findElement(By.id("myButton")); button.click();


    145\. How do you handle dynamic elements that have changing attributes or IDs?


    Answer: You can use dynamic locators like XPath or CSS selectors that are based
