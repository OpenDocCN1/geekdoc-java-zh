    WebElement tooltip = driver.findElement(By.id("tooltip-element"));


    String tooltipText = tooltip.getText();


    // Verify the tooltip content


    Assert.assertEquals(tooltipText, "Expected Tooltip Text");


    // Close the WebDriver


    driver.quit();


    }


    }


