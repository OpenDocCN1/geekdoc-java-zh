    `@Test(enabled = false)`: This annotation can be used to temporarily disable a
    test method without removing it from the test class. It''s useful when you want
    to skip certain tests temporarily without deleting the code.


    ```java

    @Test(enabled = false)

    public void temporarilyDisabledTest() {

    // This test will not run

    }

    ```


    `@Test(timeOut)`: You can set a timeout for a test method using this annotation.
    If the test method execution exceeds the specified time limit, it will be marked
    as a failure.


    ```java

    @Test(timeOut = 5000) // Timeout in milliseconds (5 seconds)

    public void testWithTimeout() {

    // Test code that should complete within 5 seconds

    }

    ```


    `@Test(invocationCount)`: This annotation allows you to specify how many times
    a test method should be invoked in succession. It''s useful for running the same
    test multiple times with different data or in different scenarios.


    ```java

    @Test(invocationCount = 3)

    public void testRepeatedly() {

    // This test will run three times

    }

    ```


    `@Test(successPercentage)`: This annotation specifies the minimum success percentage
    required for a test method to pass. If the success percentage falls below the
    specified value, the test is marked as a failure.


    ```java

    @Test(successPercentage = 80)

    public void testWithSuccessPercentage() {

    // Test code with minimum 80% success required

    }

    ```


    `@Parameters (On Test Method)`: This annotation allows you to specify method parameters
    that are passed directly from the TestNG XML configuration file to individual
    test methods.


    ```java

    @Parameters({"username", "password"})

    @Test

    public void testLogin(String username, String password) {

    // Test code using provided parameters

    }

    ```


    `@Factory (On Method)`: In addition to using `@Factory` at the class level, you
    can also apply it to methods to create dynamic test instances. The annotated method
    serves as a factory for creating test instances.


    ```java

    @Factory

    public Object[] createTestInstances() {

    return new Object[] {

    new MyTest("config1"),

    new MyTest("config2")

    };

    }

    ```


    `@DataProvider (On Method)`: You can use `@DataProvider` at the method level to
    provide data for a specific test method. This allows for more granular control
    over data-driven tests.


    ```java

    @Test(dataProvider = "userData", dataProviderClass = MyDataProvider.class)

    public void testUserRegistration(String username, String password) {

    // Test code using provided data

    }

    ```


    `@Test(dependsOnMethods)`: This annotation specifies method dependencies, indicating
    that a particular test method should only run if another specified method (or
    methods) have successfully executed.


    ```java

    @Test

    public void setupEnvironment() {

    // Set up the test environment

    }


    @Test(dependsOnMethods = "setupEnvironment")

    public void performLogin() {

    // Test code for login functionality

    }

    ```


    `@Test(priority)`: You can assign a priority to test methods using this annotation.
    TestNG executes methods with lower priority values first, followed by higher-priority
    methods.


    ```java

    @Test(priority = 1)

    public void testHighPriority() {

    // High-priority test code

    }


    @Test(priority = 2)

    public void testLowPriority() {

    // Low-priority test code

    }

    ```


    `@Listeners (On Class)`: In addition to applying `@Listeners` at the class level,
    you can also use it at the suite level in the TestNG XML configuration file to
    specify listeners that apply to multiple test classes.


    ```xml

    <suite name="MyTestSuite">

    <listeners>

    <listener class-name="com.example.CustomListener" />

    </listeners>

    <test name="MyTest">

    <!-- Test and class configurations -->

    </test>

    </suite>

    ```


    `@BeforeTest` and `@AfterTest (On Method)`: These annotations can be used at the
    method level to perform setup and teardown tasks specifically before and after
    a test defined in the TestNG XML configuration file.


    ```java

    @BeforeTest

    public void setupForTest() {

    // Test-specific setup

    }


    @AfterTest

    public void teardownAfterTest() {

    // Test-specific teardown

    }

    ```


    # Hierarchy of the TestNG Annotations:


    1. `@BeforeSuite`

    2. `@BeforeTest`

    3. `@BeforeClass`

    4. `@BeforeMethod`

    5. `@Test`

    6. `@AfterMethod`

    7. `@AfterClass`

    8. `@AfterTest`

    9. `@AfterSuite`


