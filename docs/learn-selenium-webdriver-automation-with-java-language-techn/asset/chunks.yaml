    # 101. How do you handle dynamic dropdowns with auto-suggestions using WebDriver?


    Answer: You can use the `sendKeys()` method to enter a partial value and then
    wait for auto-suggestions to appear before selecting the desired option.


    ## 102. What is the purpose of the `getCssValue("property")` method in WebDriver?


    Answer: The `getCssValue("property")` method retrieves the computed value of a
    specific CSS property for a web element.


    ## 103. How can you perform right-click and select context menu options using
    WebDriver?


    Answer: You can use the `contextClick()` method to perform a right-click action,
    and then use the `sendKeys()` method with `Keys.ARROW_DOWN` to navigate the context
    menu.


    ## 104. What is the purpose of the `getAttribute("href")` method in WebDriver
    for anchor links?


    Answer: The `getAttribute("href")` method retrieves the value of the `"href"`
    attribute of an anchor (`<a>`) element, allowing you to verify link URLs.


    ## 105. How do you simulate browser window maximization and resizing using WebDriver?


    Answer: You can use the `manage().window().maximize()` method to maximize the
    browser window and the `manage().window().setSize()` method to set a specific
    window size.


    Remember, the key to successful interview preparation is not just memorizing answers
    but understanding the concepts and applying them practically. Use these questions
    as a foundation to build your skills and showcase your expertise during interviews.


    ## 106. How can you handle browser cookies and sessions using WebDriver?


    Answer: You can use methods like `getCookies()`, `addCookie()`, and `deleteCookieNamed()`
    to manage cookies and maintain sessions.


    ## 107. What is the purpose of the `getAttribute("src")` method in WebDriver for
    images and iframes?


    Answer: The `getAttribute("src")` method retrieves the value of the `"src"` attribute
    for images and iframes, helping you verify their sources.


    ## 108. How do you simulate scrolling to the bottom of a web page using WebDriver?


    Answer: You can use the `executeScript()` method to execute JavaScript code that
    scrolls the page to the desired position.


    ## 109. How can you perform browser navigation using the address bar in WebDriver?


    Answer: You can use the `get()` method and provide the URL as an argument to navigate
    directly to a specific page.


    ## 110. What is the purpose of the `clear()` method in WebDriver for text fields?


    Answer: The `clear()` method is used to clear the text content from an input field,
    allowing you to input new data.


    ## 111. How do you handle test data and configuration using properties files in
    WebDriver scripts?


    Answer: You can use Java''s `Properties` class to read and store test data and
    configuration from external properties files.


    ## 112. How can you perform testing on dynamically generated web elements with
    no fixed locators?


    Answer: You can use `XPath` and `CSS selectors` to locate elements based on their
    relationships to other elements or attributes.


    ## 113. What is the purpose of the `getFirstSelectedOption()` method in WebDriver
    for dropdowns?


    Answer: The `getFirstSelectedOption()` method retrieves the currently selected
    option in a dropdown.


    ## 114. How do you simulate mouse hover actions using the `Actions` class in WebDriver?


    Answer: You can use the `moveToElement()` method of the `Actions` class to simulate
    mouse hover actions over a specific element.


    ## 115. How can you capture and handle JavaScript alerts, prompts, and confirmations
    using WebDriver?


    Answer: You can use `driver.switchTo().alert()` and then use methods like `accept()`,
    `dismiss()`, and `sendKeys()` to interact with JavaScript dialogs.


    ## 116. What is the purpose of the `getWindowHandle()` method in WebDriver?


    Answer: The `getWindowHandle()` method retrieves the unique handle of the current
    browser window, which can be used to switch between windows.


    ## 117. How do you simulate holding down the `Shift` key while selecting multiple
    options from a dropdown?


    Answer: You can use the `Actions` class to perform keyboard actions like `keyDown(Keys.SHIFT)`
    while selecting options.


    ## 118. How can you interact with elements that are hidden or not currently visible
    on the web page?


    Answer: You can use JavaScript execution through `executeScript()` to manipulate
    hidden elements or scroll to make them visible.


    ## 119. What is the purpose of the `getPageSource()` method in WebDriver?


    Answer: The `getPageSource()` method retrieves the HTML source code of the entire
    web page, which can be useful for verification and debugging.


    ## 120. How can you verify the presence of an element without throwing an exception
    if it''s not found?


    Answer: You can use `findElements()` instead of `findElement()`. If no elements
    are found, an empty list will be returned instead of an exception.


    ## 121. How do you simulate holding down multiple keys simultaneously using WebDriver?


    Answer: You can use the `Actions` class to combine multiple key presses using
    methods like `keyDown()` and `keyUp()`.


    ## 122. What is the purpose of the `getTagName()` method in WebDriver for radio
    buttons and checkboxes?


    Answer: The `getTagName()` method retrieves the HTML tag name of an element, which
    can help you identify whether an element is a radio button or checkbox.


    ## 123. How can you capture and verify dynamic messages or alerts displayed on
    a web page using WebDriver?


    Answer: You can use explicit waits with `ExpectedConditions` to wait for the appearance
    of specific messages or alerts before verifying them.


    ## 124. What is the purpose of the `isDisplayed()` method in WebDriver for web
    elements?


    Answer: The `isDisplayed()` method checks whether a web element is currently visible
    on the web page or not.


    ## 125. How do you handle dropdowns that do not use the `<select>` tag in WebDriver?


    Answer: You can locate the dropdown element and then use `click()` to open it,
    followed by selecting the desired option.


    ## 126. How can you handle browser basic authentication pop-ups using WebDriver?


    Answer: You can provide the username and password as part of the URL in `http://username:password@website.com`.


    ## 127. What is the purpose of the `getAttribute("class")` method in WebDriver
    for verifying CSS classes?


    Answer: The `getAttribute("class")` method retrieves the value of the `"class"`
    attribute, helping you verify the presence of CSS classes.


    ## 128. How do you simulate scrolling to specific elements or anchors on a web
    page using WebDriver?


    Answer: You can use the `executeScript()` method to execute JavaScript code that
    scrolls the page to a specific element or anchor ID.


    ## 129. How can you interact with web elements using keyboard shortcuts like `Tab`
    and `Enter` using WebDriver?


    Answer: You can use the `sendKeys()` method with the `Keys` class to simulate
    keyboard shortcuts like `Keys.TAB` and `Keys.ENTER`.


    ## 130. What is the purpose of the `getAttribute("style")` method in WebDriver
    for verifying inline styles?


    Answer: The `getAttribute("style")` method retrieves the value of the `"style"`
    attribute of an element, allowing you to verify inline styles.


    ## 131. How do you simulate browser window focus or switching between windows
    using WebDriver?


    Answer: You can use the `switchTo().window()` method and provide the window handle
    to switch focus between different browser windows.


    ## 132. How can you handle dynamic pop-up windows that have no consistent locators
    using WebDriver?


    Answer: You can use the `getWindowHandles()` method to retrieve handles of all
    open windows and switch to the desired window using its handle.


    ## 133. What is the purpose of the `isDisplayed()` method in WebDriver for verifying
    element visibility?


    Answer: The `isDisplayed()` method checks whether an element is visible and present
    in the DOM, returning a boolean value.


    ## 134. How do you simulate browser navigation using hyperlinks and anchor tags
    using WebDriver?


    Answer: You can locate the anchor element using locators and then use `click()`
    to simulate clicking on the hyperlink.


    ## 135. How can you execute JavaScript code to perform complex interactions on
    a web page using WebDriver?

