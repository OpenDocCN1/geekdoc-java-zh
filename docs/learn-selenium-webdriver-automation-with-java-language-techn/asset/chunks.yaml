    158\. What is the WebDriver quit() and close() difference?


    Answer: The quit() method closes all browser windows and terminates the WebDriver
    session, while the close() method closes the current browser window but allows
    you to continue with other windows if they exist.


    159\. How can you simulate user interactions like scrolling using WebDriver?


    Answer: You can use JavaScriptExecutor to scroll the page using JavaScript methods
    like scrollTo() or scrollBy(). Alternatively, WebDriver''s Actions class can be
    used for more complex interactions like dragging and dropping or scrolling.


    160\. How can you handle browser cookies and local storage using WebDriver?


    Answer: You can use JavaScriptExecutor to manage browser cookies and local storage
    by executing JavaScript code that interacts with the document.cookie and localStorage
    objects.


    161\. How do you perform parallel testing using WebDriver and TestNG?


    Answer: To perform parallel testing, use TestNG''s parallel execution capabilities
    along with WebDriver''s thread safety. You can configure parallel execution in
    the TestNG XML file and use thread-local instances of WebDriver to ensure thread
    safety.


    162\. How can you handle SSL certificates in WebDriver automation?


    Answer: To handle SSL certificates, you can use the setAcceptInsecureCerts() method
    to accept all SSL certificates, including self-signed ones. However, it''s important
    to use this feature cautiously due to potential security risks.


    163\. How can you perform file uploads and downloads using WebDriver?


    Answer: To perform file uploads, you can use the sendKeys() method to provide
    the file path to an input element of type "file." File downloads can be handled
    by configuring browser settings to automatically save files to a specified directory.'
