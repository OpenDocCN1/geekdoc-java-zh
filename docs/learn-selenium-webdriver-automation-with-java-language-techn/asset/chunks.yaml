    public void testLogin(String username, String password) {

    // 使用提供的参数的测试代码

    }

    ```


    `@Factory (On Method)`: 除了在类级别使用 `@Factory` 外，你还可以将其应用于方法以创建动态测试实例。被注解的方法充当创建测试实例的工厂。


    ```java

    @Factory

    public Object[] createTestInstances() {

    return new Object[] {

    new MyTest("config1"),

    new MyTest("config2")

    };

    }

    ```


    `@DataProvider (On Method)`: 你可以在方法级别使用 `@DataProvider` 为特定的测试方法提供数据。这允许对数据驱动的测试进行更细粒度的控制。


