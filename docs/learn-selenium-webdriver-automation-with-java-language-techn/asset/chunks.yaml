    155\. How can you perform keyboard actions like typing text or pressing keys using
    WebDriver?


    Answer: You can use the sendKeys() method to type text and the Keys class to simulate
    keyboard keys. For example:


    WebElement inputField = driver.findElement(By.id("myInput"));


    inputField.sendKeys("Hello, World!", Keys.ENTER);


    156\. How do you execute JavaScript code using WebDriver?


    Answer: You can execute JavaScript code using the JavaScriptExecutor interface.
    Use methods like executeScript() to run JavaScript code and return values or executeAsyncScript()
    for asynchronous execution.


    157\. How can you handle SSL certificate errors using WebDriver?


    Answer: You can use the setAcceptInsecureCerts() method to accept insecure certificates,
    but it''s important to note that bypassing SSL certificate errors is not recommended
