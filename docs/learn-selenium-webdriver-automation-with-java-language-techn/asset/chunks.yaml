    \    }\n}\n```\n\n在这个示例中，我们从名称为 \"gender\" 的单选框组中选择了“女性”单选框。\n\n# Selenium Webdriver\
    \ - 处理复选框 (Checkbox)\n\n在 Java 中使用 Selenium WebDriver 处理复选框非常简单。你可以使用 `WebElement`\
