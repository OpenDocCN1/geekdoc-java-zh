    \n## 什么是 Selenium Grid？\n\nSelenium Grid 是 Selenium 测试框架的一个组件，允许你同时跨多个浏览器、操作系统和设备执行分布式和并行测试。它使你能够以分布式和协调的方式，在被称为“节点”（nodes）或“网格节点”的机器网络上运行你的\
    \ Selenium 测试脚本。Selenium Grid 有助于实现以下目标：\n\n![](img/image_rsrc240.jpg)\n\n**并行测试**：Selenium\
