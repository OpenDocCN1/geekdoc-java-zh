    \n### 1. 定位复选框元素\n你需要使用之前提到的任定位策略之一在网页上定位复选框元素（例如 `By.id`、`By.name`、`By.xpath`、`By.cssSelector`\
    \ 等）。例如：\n\n```java\nWebElement checkboxElement = driver.findElement(By.id(\"\
