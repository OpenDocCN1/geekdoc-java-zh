    The `@Listeners` annotation in `TestNG` listens to any event that occurs in a
    `selenium` code. Listeners are enabled either before or after the test case. It
    is an interface that alters the behavior of `TestNG`. For example, when running
    a test case with `selenium` or `Appium` when a test case fails unexpectedly. We
    require a screenshot of the failed test case; to do this, `TestNG` provides a
    technique known as `Listeners`. When a test case fails, it is redirected to the
    new block written as below.


    - `onTestStart()`: An `onTestStart()` is invoked only when any test method gets
    started.

    - `onTestSuccess()`: An `onTestSuccess()` method is executed on the success of
    a test method.

    - `onTestFailure()`: An `onTestFailure()` method is invoked when the test method
    fails.

    - `onTestSkipped()`: An `onTestSkipped()` runs only when any test method has been
    skipped.

    - `onTestFailedButWithinSuccessPercentage()`: This method is invoked each time
    when the test method fails but within success percentage.

    - `onStart()`: An `onStart()` method is executed on the start of any test method.

    - `onFinish()`: An `onFinish()` is invoked when any test case finishes its execution.


    # Interview Questions & Answers of Selenium Automation QA


    ## 1. What is Selenium WebDriver?

    Answer: `Selenium WebDriver` is a popular open-source automation tool used for
    automating interactions with web applications. It provides APIs to control web
    browsers and perform various actions like clicking, typing, and navigating.


    ## 2. How do you launch a browser using Selenium WebDriver in Java?

    Answer: You can launch a browser using the `WebDriver` interface. For example,
    to launch Chrome:


    ```java

    WebDriver driver = new ChromeDriver();

    ```


    ## 3. What is the difference between findElement and findElements methods?

    Answer: `findElement` returns the first matching element on the page, or throws
    an exception if not found. `findElements` returns a list of all matching elements,
    or an empty list if none are found.


    ## 4. How do you interact with web elements using Selenium WebDriver?

    Answer: You can interact with web elements using methods like `click()`, `sendKeys()`,
    `getText()`, `getAttribute()`, `submit()`, etc.


    ## 5. How do you handle dynamic web elements with changing IDs or attributes?

    Answer: You can use `CSS selectors`, `XPath expressions`, or other attributes
    that are stable. Avoid using dynamic attributes like `IDs` that change frequently.


    ## 6. What is Implicit Wait and Explicit Wait in Selenium WebDriver?

    Answer: `Implicit Wait` sets a global timeout for the entire duration of the `WebDriver`
    instance. `Explicit Wait` allows waiting for a specific condition to be satisfied
    before proceeding.


    ## 7. How do you switch between frames and windows using WebDriver?

    Answer: You can use `driver.switchTo().frame()` to switch to an `iframe` and `driver.switchTo().window()`
    to switch to a new browser window.


    ## 8. How do you perform mouse hover actions using Actions class?

    Answer: You can use the `Actions` class to perform mouse actions like `moveToElement()`,
    `clickAndHold()`, and `release()`, simulating mouse movements.


    ## 9. How do you handle alerts and pop-up dialogs using WebDriver?

    Answer: You can use `driver.switchTo().alert()` to interact with alerts and use
    methods like `accept()`, `dismiss()`, and `sendKeys()`.


    ## 10. How do you perform data-driven testing using Selenium WebDriver?

    Answer: You can use external data sources like `Excel` or `CSV files`, read data
    in your `Java` code, and use it to iterate through test cases with different inputs.


    ## 11. What is Page Object Model (POM) in Selenium WebDriver?

    Answer: `POM` is a design pattern that involves creating classes representing
    each web page in your application, encapsulating elements and actions related
    to that page.


    ## 12. How do you handle browser cookies using WebDriver?

    Answer: You can use methods like `addCookie()`, `getCookies()`, and `deleteCookieNamed()`
    to manage browser cookies.


    ## 13. What is TestNG, and how does it enhance Selenium test automation?

    Answer: `TestNG` is a testing framework for `Java` that provides features like
    parallel test execution, grouping, dependency management, and detailed reporting,
    enhancing the capabilities of `Selenium WebDriver`.


    ## 14. How do you handle synchronization issues in Selenium WebDriver?

    Answer: You can use explicit waits, such as `WebDriverWait` with `ExpectedConditions`,
    to wait for specific conditions to be met before interacting with elements.


    ## 15. What is a headless browser, and why would you use it?

    Answer: A `headless browser` is a browser without a graphical user interface.
    It''s used for faster execution of tests, especially in server environments where
    `GUI` interaction is unnecessary.


    ## 16. How do you handle dropdowns and select options using WebDriver?

    Answer: You can use the `Select` class to interact with dropdowns. Methods like
    `selectByVisibleText()`, `selectByValue()`, and `selectByIndex()` can be used
    to choose options.


    ## 17. What are the advantages of using WebDriver over Selenium RC?

    Answer: `WebDriver` has a simpler and more intuitive API, better performance,
    native support for various browsers, and doesn''t require a separate server to
    run tests.


    ## 18. How do you capture screenshots using WebDriver in Java?

    Answer: You can capture screenshots using the `TakesScreenshot` interface and
    save them as image files.


    ## 19. What is the Page Factory pattern in Selenium WebDriver?

    Answer: The `Page Factory` pattern is an extension of the `Page Object Model`
    that uses annotations to simplify the initialization of web elements and their
    interactions.


    ## 20. How can you handle SSL certificate errors in WebDriver?

    Answer: You can create a custom `WebDriver` instance by configuring the browser
    profile to accept `SSL certificates`.


    ## 21. How do you simulate keyboard actions using WebDriver?

    Answer: You can use the `Actions` class and its methods like `sendKeys()`, `keyDown()`,
    and `keyUp()` to simulate keyboard actions.


    ## 22. What are DesiredCapabilities in WebDriver?

    Answer: `DesiredCapabilities` are used to specify browser properties like browser
    name, version, platform, and additional settings when creating a `WebDriver` instance.


    ## 23. How do you perform drag-and-drop actions using WebDriver?

    Answer: You can use the `Actions` class `dragAndDrop()` or `clickAndHold()` followed
    by `moveToElement()` and `release()`.


    ## 24. How do you handle browser navigation using WebDriver?

    Answer: You can use methods like `navigate.to()`, `navigate.back()`, `navigate.forward()`,
    and `navigate.refresh()` to navigate through web pages.


    ## 25. How can you run Selenium WebDriver tests in parallel?

    Answer: You can use `TestNG`s parallel execution feature to run tests in parallel
    by setting the `parallel` attribute in the test suite configuration.


    ## 26. How do you capture network traffic and perform network-related testing
    using WebDriver?

    Answer: You can use browser developer tools or proxy servers to capture network
    traffic and analyze requests and responses.


    ## 27. What are some common challenges faced while automating with Selenium WebDriver?

    Answer: Challenges include handling dynamic elements, synchronization issues,
    browser compatibility, and maintaining reliable test scripts.


    ## 28. How can you handle dynamic waits using ExpectedConditions in WebDriver?

    Answer: You can use methods like `ExpectedConditions.visibilityOfElementLocated()`,
    `ExpectedConditions.elementToBeClickable()`, etc., to wait for specific conditions
    before performing actions.


    ## 29. How do you handle security-related testing using WebDriver?

    Answer: You can use `WebDriver` to automate security tests like input validation,
    cross-site scripting (`XSS`), SQL injection, and more.


    ## 30. How can you integrate WebDriver tests with Continuous Integration (CI)
    tools like Jenkins?

    Answer: You can configure `Jenkins` jobs to execute `WebDriver` tests as build
    steps, trigger test runs based on code commits, and generate test reports.


