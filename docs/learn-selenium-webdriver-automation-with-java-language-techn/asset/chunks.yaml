    # Selenium WebDriver- First Test Case


    Set up your development environment:


    ● Make sure you have Java installed on your computer.


    ● Download the ChromeDriver executable that matches your Chrome browser version.
    You can find the ChromeDriver download here: https://sites.google.com/chromium.org/driver/


    ● Add the ChromeDriver executable to your system''s PATH or provide its path in
    your code.


    1.  Create a Java project or class for your Selenium automation.


    2.  Add Selenium WebDriver dependency to your project. You can use a build tool
    like Maven or Gradle to manage dependencies. If you''re using Maven, add the following
    dependency to your project''s pom.xml file:


    XML


    <dependency>


    <groupId>org.seleniumhq.selenium</groupId>


    <artifactId>selenium-java</artifactId>


    <version>3.141.59</version> <!-- Use the latest version available -->


    </dependency>


    Write Java code to open Google Chrome:


    * * *


    import org.openqa.selenium.WebDriver;


    import org.openqa.selenium.chrome.ChromeDriver;


    public class OpenChromeBrowser {


    public static void main(String[] args) {


    // Set the path to the ChromeDriver executable (Update with your actual path)


    System.setProperty("webdriver.chrome.driver", "path/to/chromedriver.exe");


    // Initialize ChromeDriver


    WebDriver driver = new ChromeDriver();


    // Open Google Chrome


    driver.get("https://www.google.com");


    // Optional: Wait or perform other actions


    // Close the browser


    driver.quit();


    }


    }


    Make sure to replace "path/to/chromedriver.exe" with the actual path to the ChromeDriver
    executable on your system.


    Compile and run your Java code, and it should open Google Chrome and navigate
    to the specified URL (https://www.google.com in this example).


    Remember to manage WebDriver instances properly, handle exceptions, and perform
    any necessary actions within your Selenium automation script as per your specific
    requirements.


    # Selenium WebDriver- Commands


    Selenium WebDriver provides a wide range of commands and methods for interacting
    with web elements and automating web applications. Below are some of the commonly
    used WebDriver commands in Java:


    WebDriver driver = new SomeDriver(): This command initializes the WebDriver instance
    using the specific driver implementation (e.g., ChromeDriver, FirefoxDriver, etc.).


    driver.get("URL"): Opens a web page by navigating to the specified URL.


    driver.navigate().to("URL"): Similar to get(), it navigates to the specified URL.


    driver.navigate().back(): Navigates back to the previous page.


    driver.navigate().forward(): Navigates forward to the next page (after using back()).


    driver.navigate().refresh(): Refreshes the current page.


    driver.quit(): Closes all browser windows and ends the WebDriver session.


    driver.close(): Closes the currently focused browser window or tab.


    driver.getTitle(): Returns the title of the current web page.


    driver.getCurrentUrl(): Returns the current URL of the web page.


    driver.findElement(By locator): Finds a single web element based on the provided
    locator strategy (e.g., By.id(), By.name(), By.xpath(), etc.).


    driver.findElements(By locator): Finds multiple web elements based on the provided
    locator strategy.


    element.click(): Clicks on the web element.


    element.sendKeys("text"): Sends keyboard input (text) to the web element.


    element.clear(): Clears the text input field or element.


    element.getText(): Retrieves the text of the web element.


    element.getAttribute("attributeName"): Gets the value of a specific attribute
    of the web element.


    element.isSelected(): Checks if a checkbox or radio button is selected.


    element.isEnabled(): Checks if the web element is enabled (not disabled).


    element.isDisplayed(): Checks if the web element is currently visible on the page.


    element.submit(): Submits a form element if it is a form.


    new Select(element).selectByVisibleText("text"): Selects an option from a dropdown
    list by its visible text.


    new Select(element).selectByValue("value"): Selects an option from a dropdown
    list by its attribute value.


    new Select(element).selectByIndex(index): Selects an option from a dropdown list
    by its index.


    driver.switchTo().window("windowName"): Switches the WebDriver focus to a different
    browser window or tab.


    driver.switchTo().frame("frameName"): Switches the focus to a specific iframe
    on the page.


    driver.switchTo().defaultContent(): Switches the focus back to the default content
    (out of iframes).


    driver.manage().window().maximize(): Maximizes the current browser window.


    driver.manage().window().fullscreen(): Makes the current browser window fullscreen.


    driver.manage().window().setSize(new Dimension(width, height)): Sets the size
    of the browser window to the specified width and height.


    driver.manage().timeouts().implicitlyWait(timeout, TimeUnit.SECONDS): Sets the
    implicit wait time. WebDriver will wait for the specified amount of time when
    trying to locate an element before throwing an exception.


    driver.manage().timeouts().pageLoadTimeout(timeout, TimeUnit.SECONDS): Sets the
    maximum amount of time to wait for a page to load.


    driver.manage().timeouts().setScriptTimeout(timeout, TimeUnit.SECONDS): Sets the
    maximum amount of time to wait for an asynchronous script to finish executing.


    driver.getWindowHandle(): Returns the handle of the current browser window.


    driver.getWindowHandles(): Returns a set of all open window handles.


    driver.switchTo().alert(): Switches to an alert pop-up and allows interaction
    with it (accept, dismiss, getText, etc.).


    driver.switchTo().parentFrame(): Switches the focus to the parent frame of the
    currently focused iframe.


    driver.switchTo().defaultContent(): Switches the focus back to the main content
    if you were inside an iframe.


    driver.manage().logs().get(LogType.BROWSER): Retrieves browser console logs for
    debugging purposes.


    driver.manage().deleteAllCookies(): Deletes all cookies from the current session.


    driver.manage().addCookie(cookie): Adds a specific cookie to the current session.


    driver.getOrientation(): Gets the orientation of the device (useful for mobile
    testing).


    driver.rotate(ScreenOrientation.PORTRAIT): Rotates the device to portrait or landscape
    mode (useful for mobile testing).


    driver.executeScript(script, args): Executes JavaScript code in the context of
    the current page. Can be used for various tasks, including scrolling, modifying
    page content, and more.


    driver.navigate().to("URL"): Navigates to a new URL, effectively replacing the
    current page.


    driver.navigate().back(): Navigates back to the previous page in the browser''s
    history.


    driver.navigate().forward(): Navigates forward in the browser''s history.


    driver.navigate().refresh(): Refreshes the current page.


    driver.manage().logs().getAvailableLogTypes(): Returns a list of available log
    types (e.g., browser, driver, performance) that you can retrieve using the WebDriver.


    driver.manage().logs().get(LogType.PERFORMANCE): Retrieves performance logs that
    contain network activity, resource loading times, and other performance-related
    data.


    driver.manage().timeouts().setScriptTimeout(timeout, TimeUnit.SECONDS): Sets the
    maximum time that the script is allowed to execute. Useful for handling scripts
    that may run indefinitely.


