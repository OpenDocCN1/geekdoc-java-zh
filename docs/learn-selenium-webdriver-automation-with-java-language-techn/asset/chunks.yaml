    # Benefits of using TestNG Annotations:


    ● TestNG Annotations made life much easier for testers. You can access the test
    methods based on your requirements; there is no predetermined pattern or syntax.


    ● Additional options can be passed to TestNG annotations.


    ● You do not need to extend any test classes when using TestNG annotations.


    ● TestNG Annotations are strongly typed, which means that problems are caught
    during the compilation process.


    # TestNG Annotation Attributes


    TestNG annotations come with various attributes that allow you to customize and
    control the behavior of your test methods, classes, and suites. Here are some
    common attributes associated with TestNG annotations:


    1.  @Test Annotation Attributes:


    ● priority: Specifies the execution priority of a test method. Lower values run
    first.


    ● groups: Assigns test methods to one or more groups, enabling group-based test
    execution.


    ● dependsOnGroups: Specifies groups that must complete successfully before the
    test method is executed.


    ● dependsOnMethods: Specifies one or more methods that must complete successfully
    before the test method is executed.


    ● alwaysRun: Forces the test method to run even if its dependencies fail.


    ● enabled: Determines whether a test method is enabled or disabled (true by default).


    ● description: Provides a description or documentation for the test method.


    ● expectedExceptions: Specifies the expected exception(s) that should be thrown
    during the test method''s execution.


    * * *


    @Test(priority = 1, groups = "smoke", dependsOnMethods = "setUpEnvironment", enabled
    = true,


    description = "Test case to validate login functionality",


    expectedExceptions = { InvalidLoginException.class })


    public void testLogin() {


    // Test code


    }


    2\. @DataProvider and @Parameters Annotation Attributes:


    name: Specifies the name of the data provider or parameter source.


    parallel: Indicates whether data provider execution should be parallel (e.g.,
    "methods", "tests").


    indices: Used with @Parameters to specify the indices of parameters to pass to
    a test method.


    * * *


    @DataProvider(name = "userData", parallel = true)


    public Object[][] userDataProvider() {


    // Data source logic


    }


    @Test(dataProvider = "userData", dataProviderClass = MyDataProvider.class)


    public void testUserRegistration(@Parameters({"username", "password"}) String
    username, String password) {


    // Test code using provided data


    }


    3.@Before and @After Annotations Attributes:


    alwaysRun: Forces the annotated method to run even if a dependent method fails.


    groups: Specifies groups to which the setup or teardown method belongs.


    * * *


    @BeforeMethod(alwaysRun = true, groups = "setup")


    public void setUpMethod() {


    // Method-level setup


    }


    @AfterMethod(alwaysRun = true, groups = "setup")


    public void tearDownMethod() {


    // Method-level teardown


    }


    4\. @Listeners Annotation Attributes:


    value or classes: Specifies one or more listener classes to associate with the
    test class or suite.


    * * *


    @Listeners({ MyCustomListener.class, TestReportListener.class })


    public class MyTestClass {


    // Test methods


    }


    5\. @Factory Annotation Attributes:


    No specific attributes for @Factory, but the annotated method should return an
    array of test class instances.


    * * *


    @Factory


    public Object[] createTestInstances() {


    return new Object[] {


    new MyTest("config1"),


    new MyTest("config2")


    };


    }


    6.@ParametersProvider and @ParametersMethod Attributes:


    providerClass: Specifies the class containing the @ParametersProvider method.


    methodName: Specifies the name of the @ParametersProvider method to use for parameter
    values.


    * * *


    @ParametersProvider(providerClass = MyDataProvider.class)


    @ParametersMethod(methodName = "provideData")


    @Test


    public void testWithParameters(String parameter) {


    // Test code with parameter


    }


