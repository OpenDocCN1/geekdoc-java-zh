    tooltip-trigger\"));\n\n        // Hover over the element to trigger the tooltip\n\
    \        Actions action = new Actions(driver);\n        action.moveToElement(tooltipElement).perform();\n\
    \n        // Locate the tooltip element and capture its text\n        WebElement\
    \ tooltip = driver.findElement(By.id(\"tooltip-element\"));\n        String tooltipText\
    \ = tooltip.getText();\n\n        // Verify the tooltip content\n        Assert.assertEquals(tooltipText,\
    \ \"Expected Tooltip Text\");\n\n        // Close the WebDriver\n        driver.quit();\n\
    \    }\n}\n```\n\nIn this example, replace `\"path/to/chromedriver.exe\"` with\
    \ the actual path to the ChromeDriver executable and adjust the element locators\
    \ to match the HTML structure of the web page you are testing.\n\n# Selenium WebDriver\
    \ - Handling Dynamic Web Tables\n\n## Types of Web Tables\n\nWeb tables are classed\
    \ as Static web tables or Dynamic web tables based on the data in the table.\n\
    \n### 1. Static Web Tables\n\nThese tables include fixed data that remains consistent\
    \ throughout. Static web tables are so named because their content is static.\n\
    \n### 2. Dynamic Web Tables\n\nBecause the data in these tables varies over time,\
    \ the number of rows and columns may also change as the data shifts. They are\
    \ termed Dynamic web tables because their content is dynamic.\n\n## Complete Selenium\
    \ code for processing Web Tables\n\n**Purpose**: Using Selenium, determine the\
    \ number of rows and columns and retrieve the cell value for a specified row and\
    \ column from the IPO Filing Data online table on the NYSE website.\n\n```java\n\
    //Opening Chrome Browser\npackage browser;\nimport org.openqa.selenium.WebDriver;\n\
    import org.openqa.selenium.chrome.ChromeDriver;\n\npublic class BrowserSelection\
    \ {\n    static WebDriver driver;\n\n    public static WebDriver usingChrome()\
    \ {\n        System.setProperty(\"webdriver.chrome.driver\", \"E:\\SeleniumLibs\\\
    \\chromedriver_win32\\chromedriver.exe\");\n        driver = new ChromeDriver();\n\
    \        driver.manage().window().maximize();\n        return driver;\n    }\n\
    }\n\n//Test to handle dynamic web table using Selenium WebDriver\npackage dynamic\
    \ table;\nimport java.awt.AWTException;\nimport java.awt.Robot;\nimport java.awt.event.KeyEvent;\n\
    import java.util.List;\nimport java.util.concurrent.TimeUnit;\nimport org.openqa.selenium.By;\n\
    import org.openqa.selenium.JavascriptExecutor;\nimport org.openqa.selenium.WebDriver;\n\
    import org.openqa.selenium.WebDriverException;\nimport org.openqa.selenium.WebElement;\n\
    import org.testng.annotations.AfterMethod;\nimport org.testng.annotations.BeforeMethod;\n\
    import org.testng.annotations.Test;\nimport browser.BrowserSelection;\n\npublic\
    \ class DynamicWebTableTest {\n    WebDriver driver;\n\n    @BeforeMethod\n  \
    \  public void openBrowser() {\n        driver = BrowserSelection.usingChrome();\n\
    \    }\n\n    @Test\n    public void tripDetails() throws InterruptedException,\
    \ AWTException {\n        //Modify Wait time as per the Network Ability in the\
    \ Thread Sleep method\n        driver.get(\"https://www.nyse.com/ipo-center/filings\"\
    );\n        driver.manage().timeouts().implicitlyWait(10, TimeUnit.SECONDS);\n\
    \        Thread.sleep(5000);\n\n        //Finding number of Rows\n        List<WebElement>\
    \ rowsNumber = driver.findElements(By.xpath(\"////*[@id=\"content-8b4988b9-2ec9-4e77-9b4d-9c2994bd9e8a\"\
    ]/div/div/table[1]/tbody/tr[1]/td[1]\"));\n        int rowCount = rowsNumber.size();\n\
    \        System.out.println(\"No of rows in this table : \" + rowCount);\n\n \
    \       //Finding number of Columns\n        List<WebElement> columnsNumber =\
    \ driver.findElements(By.xpath(\"//*[@id=\"content-8b4988b9-2ec9-4e77-9b4d-9c2994bd9e8a\"\
    ]/div/div/table[1]/thead/tr/th[1]\"));\n        int columnCount = columnsNumber.size();\n\
    \        System.out.println(\"No of columns in this table : \" + columnCount);\n\
    \n        //Finding cell value at 4th row and 3rd column\n        WebElement cellAddress\
    \ = Rowtable.findElement(By.xpath(\"////*[@id=\"content-8b4988b9-2ec9-4e77-9b4d-9c2994bd9e8a\"\
    ]/div/div/table[1]/tbody/tr[4]/td[3]\"));\n        String value = cellAddress.getText();\n\
    \        System.out.println(\"The Cell Value is : \" + value);\n\n        driver.quit();\n\
    \    }\n}\n```\n\n# What is TestNG\n\nTestNG (Test Next) is a popular testing\
    \ framework for Java that is primarily used for automating test cases and performing\
    \ unit, functional, and integration testing. TestNG is inspired by JUnit and NUnit\
    \ but introduces many new features and functionalities that make it a versatile\
    \ and powerful framework.\n\nHere are some key features and benefits of TestNG:\n\
    \n- **Annotations**: TestNG uses annotations to define test methods and configure\
    \ test execution. Annotations provide fine-grained control over the test lifecycle\
    \ and allow you to specify dependencies between methods.\n- **Parallel Execution**:\
    \ TestNG supports parallel execution, which can significantly reduce test execution\
    \ time. You can run tests in parallel at method, class, suite, or group level.\n\
    - **Parameterized Testing**: TestNG allows you to perform parameterized testing\
    \ by providing data providers. This enables to run the same test method with multiple\
    \ sets of input data.\n- **Test Dependency Management**: You can define dependencies\
    \ between test methods, ensuring that specific tests run if their dependencies\
    \ pass. This is useful for testing workflows or ensuring specific setup/teardown\
    \ steps.\n- **Test Suites**: TestNG enables you to create test suites, which are\
    \ collections of test classes or groups. This allows you to organize and execute\
    \ tests in a structured manner.\n- **Reporting**: TestNG provides comprehensive\
    \ test reports in various formats (HTML, XML) and integrates with popular build\
    \ tools and Continuous Integration (CI) systems like Jenkins.\n- **Listeners**:\
    \ TestNG allows you to implement custom listeners to perform actions at different\
    \ stages of the test execution lifecycle. You can create listeners for logging,\
    \ reporting, and more.\n- **Annotations for Configuration**: Besides test methods,\
    \ TestNG also provides annotations for configuration methods like `@BeforeSuite`,\
    \ `@AfterSuite`, `@BeforeTest`, `@AfterTest`, `@BeforeClass`, `@AfterClass`, `@BeforeMethod`,\
    \ and `@AfterMethod`, allowing you to set up and tear down test environments.\n\
    - **Grouping and Inclusion/Exclusion**: You can group test methods and include/exclude\
    \ specific groups when running tests. This provides flexibility in selecting which\
    \ tests to run.\n- **Parallelization and Distributed Testing**: TestNG supports\
    \ parallel execution across multiple threads and distributed testing on remote\
    \ machines using Selenium Grid or other mechanisms.\n- **Extensibility**: TestNG\
    \ is highly extensible, and you can create custom extensions, listeners, and reporters\
    \ to adapt it to your specific testing needs.\n"
