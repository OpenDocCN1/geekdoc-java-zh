    and after each individual test method. They are used for method-level setup and
    teardown.


    * * *


    @BeforeMethod


    public void setUpMethod() {


    // Method-level setup


    }


    @AfterMethod


    public void tearDownMethod() {


    // Method-level teardown


    }


