  md: '# Java If...Else


    In Java, the if...else statement is a control flow statement that allows a program
    to execute different blocks of code based on the evaluation of a boolean expression.


    The if...else statement begins with an if keyword, followed by a boolean expression
    enclosed in parentheses. This expression is evaluated to either true or false.


    2. True Block Execution:


    If the boolean expression evaluates to true, the block of code immediately following
    the if statement is executed. This block is often referred to as the "true block"
    or "if block."


    3. Else Block:


    Optionally, the if...else statement can include an else keyword followed by another
    block of code. This block is executed if the boolean expression in the if statement
    evaluates to false. This block is often referred to as the "else block."


    4. Exclusive Execution:


    Either the true block or the else block is executed, but not both. The if...else
    statement provides an exclusive choice between two alternative paths of execution
    based on the condition.


    5. Nesting:


    Multiple if...else statements can be nested inside each other to create more complex
    decision-making structures. This allows for handling multiple conditions and executing
    different blocks of code based on their evaluations.


    6. Chaining:'
