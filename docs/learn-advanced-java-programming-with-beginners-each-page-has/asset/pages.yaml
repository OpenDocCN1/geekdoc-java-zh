    The switch statement begins with the keyword switch followed by an expression
    enclosed in parentheses. This expression is evaluated, and its result determines
    which block of code will be executed.


    +   2. Case Labels:


    The switch statement includes multiple case labels, each representing a possible
    value or a range of values that the expression can have. The case labels are followed
    by a colon (:) and the associated block of code.


    +   3. Matching and Execution:


    When the expression''s value matches one of the case labels, the corresponding
    block of code is executed. The switch statement continues executing code until
    it encounters a break statement or reaches the end of the switch block.


    +   4. Optional Default Case:


    The switch statement can include an optional default case, which is executed when
    none of the case labels matches the expression''s value. The default case is useful
    for providing a default behavior or handling unexpected values.


    +   5. Fall-Through Behavior:'
