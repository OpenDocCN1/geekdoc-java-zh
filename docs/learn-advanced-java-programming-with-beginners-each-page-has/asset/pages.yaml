  md: '# JAvARCuRSion


    Recursion is a programming concept in which a method calls itself directly or
    indirectly to solve a problem.


    +   1. Definition:


    +   Recursion is a process where a method solves a problem by calling itself,
    either directly or indirectly, with a smaller or simpler instance of the same
    problem.


    +   2. Base Case:


    +   Every recursive algorithm must have a base case, which represents the simplest
    form of the problem that can be solved without further recursion. The base case
    prevents the recursion from continuing indefinitely.


    +   3. Breakdown of the Problem:


    +   In a recursive solution, the original problem is broken down into smaller
    subproblems. Each recursive call addresses a smaller instance of the problem,
    moving towards the base case.


    +   4. Stacking of Calls:


    +   Recursive calls create a stack of method calls, where each method call is
    pushed onto the stack. As each recursive call completes, it is popped off the
    stack, and the program continues with the next method call.


    +   5. Execution Flow:


    +   The execution flow of a recursive solution involves repeatedly subdividing
    the problem until reaching the base case. Once the base case is reached, the results
    are combined to solve the original problem.


    +   6. Memory Usage:


    +   Recursion uses the call stack to keep track of method calls. Each recursive
    call consumes memory on the stack. Excessive recursion may lead to a stack overflow,
    especially if there is no proper termination condition (base case).'
