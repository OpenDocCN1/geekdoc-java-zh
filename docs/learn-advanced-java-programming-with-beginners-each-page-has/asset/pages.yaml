  md: '# Java Enums


    In Java, an enum (enumeration) is a special data type that consists of a fixed
    set of named values.


    +   1. Definition:

    - An enum in Java is a way to represent a fixed set of named values and constants.
    It provides a convenient and type-safe way to work with predefined, distinct values.


    +   2. Named Constants:

    - Enums are often used to define a set of named constants that represent the possible
    values for a certain property or attribute. These constants are typically related
    and have a well-defined, limited scope.


    +   3. Type Safety:

    - Enums provide type safety, meaning that the compiler checks the validity of
    enum values at compile time. This helps avoid runtime errors related to incorrect
    or undefined values.


    +   4. Enumeration Members:

    - Enumerations consist of a finite list of members, each representing a distinct
    value. Members are usually named using uppercase letters to emphasize their constant
    nature.


    +   5. Limited Instances:

    - Enums are designed to have a limited, predefined number of instances. Unlike
    other classes, you cannot create new instances of an enum using the new keyword.


    +   6. Enumerating Values:

    - You can iterate over the values of an enum using the values() method, which
    returns an array containing all the enum constants in the order they were declared.


    +   7. Enum Constants as Objects:

    - Each enum constant is an object of its enum type. This means that enum constants
    can have associated methods, fields, or even implement interfaces.'
