  md: '+   7. Thread Safety:


    ●Thread safety is the property of a program to execute multiple threads concurrently
    without introducing data inconsistencies. Proper synchronization and use of locks
    ensure thread safety


    +   8. Daemon Threads:


    ●Daemon threads are background threads that do not prevent the program from terminating
    if they are still running. They automatically terminate when all non-daemon threads
    finished.


    +   9. Thread Interruption:


    ●interrupt() method is used to interrupt a thread. When a thread is interrupted,
    it receives an InterruptedException, and its normal flow can be handled accordingly.


    +   10. Thread Joining:


    ●join() method is used to make one thread wait for the completion of another thread.
    This is useful for coordinating the activities of different threads.


    +   11. Inter-Thread Communication:


    ●Threads can communicate with each other using methods such as wait(), notify(),
    and notifyAll(). These methods are used in synchronized blocks to coordinate the
    execution of threads.


    +   12. Thread Pools:


    ●Thread pools are a collection of pre-initialized threads that can be reused for
    executing tasks. They help manage the lifecycle of threads, reducing the overhead
    of creating and destroying threads.


    +   13. Thread Local Storage:


    ●Local storage provides a way to store data that is local to a thread. Each thread
    has its own copy of the data, and changes made by one thread do not affect the
    data seen by other threads.


    +   14. Volatile Keyword:


    ●The keyword is used to indicate that a variable''s value may be changed by multiple
    threads simultaneously. It ensures that changes to the variable are visible to
    all threads.


    In summary, threads in Java enable concurrent execution of tasks, improving the
    responsiveness and performance of programs. Understanding the lifecycle of threads,
    synchronization mechanisms, and other concepts related to multithreading is crucial
    for developing robust and efficient multithreaded applications in Java.'
