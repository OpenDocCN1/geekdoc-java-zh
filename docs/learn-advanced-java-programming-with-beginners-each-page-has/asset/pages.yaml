    In Java, the for loop is a control flow statement that allows a specified block
    of code to be repeatedly executed a certain number of times. It provides a concise
    and expressive way to perform iterative operations.


    +   1. Initialization:


    +   The for loop starts with the keyword followed by a set of parentheses. Inside
    the parentheses, the loop''s initialization section is specified. This section
    typically includes the initialization of a loop control variable.


    +   2. Control Variable:


    +   The loop control variable is a variable that is used to control the number
    of iterations. It is initialized in the first part of the for loop and is often
    used to keep track of the loop''s progress.


    +   3. Condition:


    +   The second part of the for loop''s parentheses contains the loop continuation
    condition. This condition is evaluated before each iteration, and if it evaluates
    to true, the loop body is executed. If the condition is false, the loop terminates.


    +   4. Iteration Expression:


    +   The third part of the for loop''s parentheses contains the iteration expression.
    This expression is executed after each iteration of the loop body and is typically
    used to update the loop control variable.


    +   5. Loop Body:


    +   The body of the for loop is enclosed in curly braces {}. This block contains
    the statements that are executed repeatedly as long as the loop continuation condition
    is true.


    +   6. Pre-Test Loop:'
