    execution. If the boolean expression evaluates to true, the corresponding

    block of code is executed.


    +   4. Comparison Operators:


    +   ●Comparison operators, such as == (equal), != (not equal), < (less

    than), > (greater than), <= (less than or equal to), and >= (greater

    or equal to), produce boolean results when used to compare values.


    +   5. Boolean Expressions:


