  md: '# JAVa VARiABleS


    In Java, variables are containers that store data values. They are fundamental
    to programming and are used to hold and manipulate information within a program.


    +   1. Variable Declaration:


    +   *In Java, you declare a variable by specifying its data type, followed by
    the variable name. The data type indicates the type of values of the variable
    can hold, such as int for integers, double for floating-point numbers, or String
    for text.


    +   2. Data Types:


    +   *Java supports various data types, including primitive data types (e.g., int,
    double, char, boolean) and reference data types (e.g., String, custom classes).
    Primitive data types hold simple values directly, while reference data types store
    references to objects.


    +   3. Naming Conventions:


    +   *Variable names in Java must adhere to certain naming conventions. They should
    start with a letter, followed by letters, digits, or underscores. Names are case-sensitive,
    so myVariable and myvariable are treated as different variables.


    +   4. Initialization:


    +   *After declaring a variable, you can assign an initial value to it through
    a process called initialization. This involves using the assignment operator (=)
