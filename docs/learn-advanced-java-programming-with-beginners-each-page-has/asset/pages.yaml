  md: '# Java Exceptions


    In Java, exceptions are events that occur during the execution of a program that
    disrupts the normal flow of instructions. Exception handling is a mechanism provided
    by Java to deal with these unexpected situations.


    +   1. Types of Exceptions:


    +   ●Exceptions in Java are divided into two main categories:

    - Checked Exceptions: These are exceptions that are checked at compile-time. Programmers
    are required to handle these exceptions using try-catch blocks or declare that
    they may throw these exceptions using the throws clause.

    - Unchecked Exceptions (Runtime Exceptions): These are exceptions that are not
    checked at compile-time. They usually occur due to programming errors or unexpected
    runtime conditions.


    +   2. Exception Hierarchy:


    +   ●All exception classes in Java are subclasses of either the Exception class
    or the RuntimeException class. The Exception class represents checked exceptions,
    and the RuntimeException class represents unchecked exceptions.

    3. try, catch, and finally Blocks:


    +   ●Exception handling is typically done using try-catch blocks. The try block
    contains the code that may throw an exception. If an exception occurs, it is caught
    by the corresponding catch block. The finally block, if present, is executed whether
    an exception occurs or not.

    4. Throwing Exceptions:


    +   ●In addition to catching exceptions, Java allows the programmer to explicitly
    throw exceptions using the throw keyword. This is useful when a method encounters
    an error condition and wants to indicate the problem.

    5. Exception Propagation:


    +   ●When an exception is thrown inside a method and not caught, it propagates
    up the call stack. This means that the method that called the current method is
    given an opportunity to catch the exception.'
  merge: -1
  pgno: 229
