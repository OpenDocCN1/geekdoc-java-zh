    A HashSet in Java is a part of the Java Collections Framework and is implemented
    by the HashSet class. It represents an unordered collection of unique elements.


    +   1. Unordered Collection:


    A HashSet does not maintain any order of elements. Unlike a List, the order in
    which elements are added to the HashSet is not preserved when iterating or accessing
    elements.


    +   2. Unique Elements:


    Each element in a HashSet must be unique. Attempting to add a duplicate element
    to the set will result in the set remaining unchanged.


    +   3. Null Values:


    A HashSet can contain at most one null element. If an attempt is made to add multiple
    null values, only one null value will be retained in the set.


    +   4. No Duplicate Elements:


    The primary purpose of a HashSet is to store and quickly retrieve unique elements.
    It ensures that each element is stored only once, preventing the inclusion of
    duplicate values.


    +   5. Hashing Mechanism:


    Internally, a HashSet uses a hash table or a similar data structure to store elements.
    The hashing mechanism is employed to efficiently organize and retrieve elements
    based on their hash codes.'
