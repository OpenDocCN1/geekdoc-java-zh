  md: '# # JAVa ConStRuCtoRS


    In Java, a constructor is a special type of method that is used to initialize
    objects.


    +   1. Initialization:


    +   - Constructors are used to initialize the state of objects when they are created.
    They ensure that the object has a valid and consistent state right from the start.


    +   2. Special Method:


    +   - Constructors have the same name as the class they belong to, and they do
    not have a return type, not even void. They are automatically called when an object
    is instantiated.


    +   3. No Explicit Return Type:


    +   - Unlike regular methods, constructors do not have an explicit return type
    specified. Their primary purpose is to initialize the object, not to return a
    value.


    +   4. Default Constructor:


    +   - If a class does not explicitly define any constructors, Java provides a
    default constructor automatically. The default constructor has no parameters and
    initializes attributes with default values.


    +   5. Parameterized Constructors: - Constructors can take parameters, allowing
    developers to customize the initialization process based on the values provided
    during the object creation. These are known as parameterized constructors.


    +   6. Overloaded Constructors:


    +   - A class can have multiple constructors, known as overloaded constructors,
    with different parameter lists. This enables objects to be initialized in different
    ways.'
  merge: -1
  pgno: 127
