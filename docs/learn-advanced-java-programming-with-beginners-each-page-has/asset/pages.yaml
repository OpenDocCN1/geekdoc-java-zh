  md: '# Java Break/Continue


    In Java, the break and continue statements are control flow statements used within
    loops to alter the normal flow of execution.


    Java break Statement: 1. Loop Termination: ●The break statement is used to terminate
    the execution of a loop prematurely. When encountered within a loop, the break
    statement immediately exits the loop, and control is transferred to the statement
    following the loop.


    +   2. Early Exit: ●break is often used within loops to exit the loop early on
    a certain condition. Once the break statement is encountered, any remaining iterations
    of the loop are skipped, and the program continues with the statement following
    the loop.


    +   3. Switch Statements: ●In addition to loops, the break statement is used within
    switch statements to exit the switch block. It is commonly placed at the end of
    each case block to prevent fall-through to subsequent case blocks.


    +   4. Loop Nesting: ●When dealing with nested loops, a break statement inside
    an inner loop exits only that loop, not the outer loop(s). If a break statement
    is used within the outer loop, it exits the outer loop.


    Java continue Statement: 1. Skip Iteration: ●The continue statement is used to
    skip the rest of the code inside the current iteration of a loop and proceed to
    the next iteration. It does not exit the loop; rather, it skips the remaining
    statements within the loop body for the current iteration.'
  merge: -1
  pgno: 82
- img_proc: true
  md: 'Loop Increment/Update:After encountering a continue statement, the loop’s increment
    or update expressions are executed, and control moves to the next iteration of
    the loop. This allows the loop to continue with the next set of iterations.


    +   3. Filtering Out Elements:continue is often used to filter specific elements
    or conditions within a loop. For example, if a certain condition is met, the continue
    statement can be used to skip processing for that particular iteration.


    +   4. Loop Nesting:Similar to the break statement, the continue statement affects
    only the innermost code in the case of nested loops. It skips the remaining code
    in the current iteration of the inner loop and proceeds to the next iteration
    of that inner loop.


    +   5. Use in while and do-while Loops:The continue statement can be used in while
    and do-while loops, just like in loops, to achieve similar effects of skipping
    the remaining code in the current iteration and moving to the next one.


    +   6. Labelled continue (Java 8 and later):Java 8 introduced the ability to use
    a label with continue statements, allowing developers to specify which loop to
    continue when dealing with nested loops. This labeled continue statement provides
    more control in scenarios with multiple nested loops. In summary, both break and
    continue statements are important control flow constructs commonly used within
    loops to alter the normal execution flow. While break is used to terminate the
    loop prematurely, continue is used to skip the remaining code in the current iteration
    and move on to the next iteration of the loop. Careful use of these statements
    can enhance the flexibility and efficiency of loop structures in Java programs.'
