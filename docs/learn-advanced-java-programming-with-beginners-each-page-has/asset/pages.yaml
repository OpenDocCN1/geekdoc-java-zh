    threads. It ensures that reads and writes to the variable are atomic and visible
    to all threads.


    8. Combination of Modifiers:


    +   ●Multiple modifiers can be used together. For example, a method can be both
    public and static, and a variable can be both final and static.


    9. Default Access:


    +   ●If no access modifier is specified, the default access level is package-private.
    This means the class or member is accessible only within its own package.


    10. Encapsulation:


