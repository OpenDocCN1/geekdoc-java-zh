  md: '# JAVA ARRAYS


    In Java, an array is a data structure that allows you to store multiple values
    of the same data type under a single variable name.


    +   1. Homogeneous Elements:


    +   •Arrays in Java are homogeneous, meaning that all elements within an array
    must be of the same data type. For example, you can have an array of integers,
    an array of characters, or an array of objects.


    +   2. Fixed Size:


    +   •Once an array is created, its size is fixed and cannot be changed. If you
    need a dynamic collection that can grow or shrink, you might consider using other
    data structures, such as ArrayList or LinkedList.


    +   3. Zero-Based Indexing:


    +   •Array elements are accessed using an index, and the indexing starts from
    0. The first element is at index 0, the second at index 1, and so on. The last
    element is at index length-1, where length is the size of the array.


    +   4. Declaration and Initialization:


    +   •Arrays are declared and initialized using square brackets []. For example,
    int[] numbers = new int[5]; declares an integer array numbers with a size of 5.
    The new keyword is used to allocate memory for the array.


    +   5. Length Property:


    +   •Arrays have a length property that indicates the number of elements in the
    array. This property is often used in loops and other constructs to iterate over
    the elements of the array.


    +   6. Random Access:


    +   •Arrays allow for direct access to any element using its index. This enables
    efficient random access to elements, and the time complexity for accessing an
    element is constant O(1).'
