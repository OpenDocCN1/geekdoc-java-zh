  md: '+   7. Initialization Block:In addition to constructors, Java supports instance
    initialization blocks, which are executed before any constructor in the class.
    Initialization blocks are useful for common initialization logic shared across
    multiple constructors.


    +   8. Implicit Super Constructor Call:If a class extends another class, the superclass''s
    constructor is implicitly called before the subclass''s constructor. This ensures
    that the entire hierarchy is properly initialized.


    +   9. Default Values and Initialization:Constructors are responsible for assigning
    initial values to the object''s attributes. If attributes are not explicitly initialized,
    Java provides default values based on their data types.


    +   10. Object Allocation:Constructors are called when an object is created using
    the new keyword. The new keyword allocates memory for the object and calls the
    appropriate constructor to initialize its state.


    +   11. Access Modifiers:Constructors can have access modifiers (e.g., public,
    private, protected, or package-private) that control their visibility. The choice
    of access modifier influences where the constructor can be called from.


    +   12. Chain of Constructors:Constructors can call other constructors in the
    same class using the this() keyword. This allows for code reuse and the ability
    to provide default values for certain parameters.


    In summary, constructors in Java are special methods used to initialize objects.
    They ensure that objects have a valid and consistent state by assigning initial
    values to attributes. Constructors can be parameterized, overloaded, and used
    to customize the initialization process based on the values provided during object
    creation.'
