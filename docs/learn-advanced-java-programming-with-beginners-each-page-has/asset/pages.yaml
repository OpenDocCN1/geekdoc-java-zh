  md: '# JAVA Files


    In Java, the java.nio.file package provides a comprehensive set of classes and
    interfaces for file and file system operations.


    +   1. File and Directory Abstraction:


    The java.nio.file package introduces the Path interface, which represents the
    abstract path to a file or directory. Paths provide a level of abstraction over
    file system operations.


    +   2. File System Interaction:


    The Files class in the java.nio.file package contains various static utility methods
    for working with files and directories. It provides methods for copying, moving,
    deleting, reading, and writing files.


    +   3. Path Resolution:


    Paths can be resolved to obtain a new path. The resolve() method is used to create
    a new path by appending a relative path or resolving another path against the
    current path.


    +   4. File Operations:


    The Files class provides methods for performing common file operations, such as
    creating directories (createDirectory()), copying files (copy()), moving files
    (move()), deleting files or directories (delete()), and checking file existence
    (exists()).


    +   5. Reading and Writing Files:


    The Files class provides methods for reading and writing files, such as readAllBytes(),
    readAllLines(), write(), and new BufferedWriter().


    +   6. File Attributes:'
