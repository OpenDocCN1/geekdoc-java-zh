    to its internal state. Encapsulation protects the integrity of the object''s data
    by restricting direct access and modification.


    +   11. Accessor and Mutator Methods:

    ●To interact with private attributes, accessor (getter) and mutator (setter) methods
    are often provided. Accessor methods retrieve the value of an attribute, and mutator
    methods modify its value.

    12. Relationship with Methods:


    ●Attributes are closely related to methods within a class. Methods operate on
    the data stored in them, providing behaviors that define the functionality of
    the class.

    In summary, class attributes in Java define the state or characteristics of objects
    created from a class. They play a crucial role in modeling the data associated
    with objects and contribute to the overall structure and behavior of a class.
    Attributes are declared within the class and are accessible to methods within
    that class.'
