  md: '6. throws Clause:


    +   When a method might throw a checked exception, it must either handle the exception
    using a try-catch block or declare the exception in its method signature using
    the throws clause. This informs the calling code that needs to handle or declare
    the exception.


    7. try-with-resources Statement:


    +   In Java, the try-with-resources statement is used to automatically close resources
    such as files, sockets, or database connections when they are no longer needed.
    This is achieved by implementing the AutoCloseable interface.


    8. Custom Exceptions:


    +   Java allows programmers to create their own exception classes by extending
    existing exception classes. This is useful when a program encounters specific
    error conditions that are not adequately represented by standard exceptions.


    9. Handling Unchecked Exceptions:


    +   While it is not mandatory to catch unchecked exceptions, it is good practice
    to handle or at log them appropriately. Unhandled exceptions can lead to abnormal
    program termination.


    10. RuntimeException Subtypes:


    +   Common subclasses of RuntimeException include NullPointerException, ArrayIndexOutOfBoundsException,
    ArithmeticException, and others. These exceptions typically indicate programming
    errors or runtime conditions that may not be recoverable.


    11. Checked Exception Examples:


    +   Examples of checked exceptions include IOException, SQLException, and ClassNotFoundException.
    These exceptions are checked at compile-time, and the compiler enforces handling
    or declaration of such exceptions.


    12. Unchecked Exception Examples:


    +   Examples of unchecked exceptions include NullPointerException, ArrayIndexIndexOutOfBoundsException,
    and ArithmeticException. These exceptions are not checked at compile-time and
    often result in errors in the logic of the program.


    In summary, exceptions are events that disrupt the normal flow of program execution.
    They can be categorized into checked and unchecked exceptions. Handling exceptions
    in Java involves using try-catch blocks, declaring exceptions with the throws
    clause, and handling resources with the try-with-resources statement. Custom exceptions
    can be created, and unchecked exceptions are often indicative of programming errors.
    Handling exceptions is an essential part of writing robust and reliable Java programs.'
