  md: '# Java While Loop


    In Java, the while loop is a control flow statement that repeatedly executes a
    block of code as long as a specified boolean expression evaluates to true.


    +   1. Condition Evaluation:


    The while loop begins with the keyword while, followed by a boolean expression
    enclosed in parentheses. The expression is evaluated before each iteration of
    the loop.


    +   2. Entry Condition:


    The boolean expression, also known as the entry condition, determines whether
    the code inside the while loop will be executed. If the expression evaluates to
    true, the loop body is executed; otherwise, the loop terminates, and control moves
    to the next statement after the while loop.


    +   3. Loop Body:


    The body of the while loop consists of a block of code enclosed in curly braces
    {}. This block contains the statements that are executed repeatedly as long as
    the entry condition is true.


    +   4. Iterative Execution:


    If the entry condition is initially true, the loop body is executed, and then
    the entry condition is evaluated again. If the condition remains true, the loop
    body is executed again, creating an iterative process.


    +   5. Infinite Loop Risk:


    Care must be taken to ensure that the entry condition can eventually evaluate
    to false. Otherwise, the while loop may result in an infinite loop, where the
    code inside the loop continues to execute indefinitely.'
