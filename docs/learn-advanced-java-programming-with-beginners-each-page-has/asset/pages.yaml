  md: '7. Setter Methods:


    +   ●Setter methods allow controlled modification of the internal state of an
    object by providing a mechanism to set values for private attributes. Setter methods
    can enforce validation logic before accepting new values.


    8. Protecting Invariants:


    +   ●Encapsulation helps in protecting class invariants, which are conditions
    or constraints that must always be true for the object in a valid state. By controlling
    access to attributes, encapsulation prevents the violation of invariants.


    9. Flexibility in Implementation:


    +   ●Encapsulation allows developers to modify the internal implementation of
    a class without affecting the external code that uses the class. This improves
    the flexibility to evolve and enhance the codebase.


    10. Improving Maintainability:


    +   ●By encapsulating data and methods within a class, code becomes more modular
    and maintainable. Changes to the internal implementation can be made without impacting
    other parts of the program.


    11. Collaboration and Interface Stability:


    +   ●Encapsulation supports collaboration among developers by providing a stable
    interface to the outside world. The class''s public methods serve as a well-defined
    interface, shielding the internal details from external changes.


    12. Object-Oriented Design Principle:


    +   ●Encapsulation is a fundamental principle of object-oriented design that promotes
    modular, maintainable, and secure software development. It contributes to the
    creation of robust and scalable systems.


    In summary, encapsulation in Java involves bundling data and methods within a
    class, controlling access to internal components, and providing a well-defined
    interface for external code. It promotes information hiding, flexibility, and
    maintainability while enforcing security and protecting the integrity of the object''s
    state.'
