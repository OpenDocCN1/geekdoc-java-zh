  md: '# JAvA EnCapSulation


    Encapsulation is one of the four fundamental principles of object- oriented programming
    (OOP) and is a concept widely used in Java. It involves bundling the data (attributes
    or fields) and the methods (functions or behaviors) that operate on the data into
    a single unit, known as a class.


    +   1. Definition:


    +   ◆Encapsulation is the bundling of data and methods that operate on the data
    into a single unit or class. It restricts direct access to some of the object''s
    components and prevents the accidental modification of the object''s state.


    +   2. Access Modifiers:


    +   ◆Access modifiers (e.g., public, private, protected, or package-private) are
    used to control the visibility and accessibility of a class''s attributes and
    methods. This helps in enforcing encapsulation.


    +   3. Private Access Modifier:


    +   ◆The private access modifier is often used to make attributes and methods
    accessible only within the class. This means that the internal details of the
    class are hidden from the outside world.


    +   4. Information Hiding:


    +   ◆Encapsulation supports the concept of information hiding, where the internal
    implementation details of a class are hidden from the external code that uses
    the class. This enhances security and prevents unintended interference.


    +   5. Getter and Setter Methods:


    +   ◆Encapsulation encourages the use of getter methods (accessors) and setter
    methods (mutators) to control access to the class''s attributes. Getter methods
    retrieve the values of attributes, and setter methods modify them.


    +   6. Getter Methods:


    +   ◆Getter methods allow controlled access to the internal state of an object
    by providing read-only access to attributes. They are often used to retrieve the
    values of private attributes.'
  merge: -1
