  md: 'Access Modifiers:


    +   Methods can access modifiers, such as public, private, or protected, which
    control the visibility of the method to other classes. The absence of an access
    modifier implies package-private visibility.


    +   7. Static and Instance Methods: Methods can be static or instance methods.
    Static methods belong to the class itself rather than to an instance of the class.
    Instance methods operate on an instance of the class and can access instance variables.


    +   8. Method Overloading: Java supports method overloading, which allows multiple
    methods in the same class to have the same name but different parameter lists.
    Overloaded methods provide flexibility in calling methods with varying argument
    types or numbers.


    +   9. Recursion: A method can call itself, a concept known as recursion. Recursive
    methods can be a powerful technique for solving problems that can be broken down
    into smaller instances of the same problem.


    +   10. Java Standard Library Methods: Java comes with a rich set of standard
    library methods, provided by classes like Math, String, and others. These methods
    can be called by any Java program without the need for explicit import statements.


    +   11. Encapsulation: Methods contribute to encapsulation by allowing the hiding
    of implementation details. Methods can be used to expose only the necessary functionality
    to the outside world, protecting the internal state of an object.


    +   12. Code Reusability: Methods promote code reusability by allowing the same
    block of code to be called from different parts of the program. This reduces redundancy
    and improves the maintainability of the code.


    In summary, Java methods are essential building blocks that encapsulate functionality,
    promote code organization, and facilitate code reuse. They play a crucial role
    in structuring programs, enhancing readability, and supporting modular and maintainable
    code development.'
