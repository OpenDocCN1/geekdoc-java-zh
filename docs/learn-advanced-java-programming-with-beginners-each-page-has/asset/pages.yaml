  md: '# Java Methods


    In Java, a method is a block of code that performs a specific task and can be
    called by name from another part of the program. Methods provide a way to structure
    and organize code, promote code reuse, and improve the readability and maintainability
    of a Java program.


    1. Declaration and Definition:


    +   •A method is declared and defined using the method keyword, followed by the
    method''s return type, name, parentheses, and a block of code enclosed in curly
    braces {}. The return type specifies the type of value the method returns or indicates
    void if the method does not return any value.


    2. Method Signature:


    +   •The combination of a method''s name and its parameter list is known as the
    method signature. It uniquely identifies the method within its class. The return
    type is not considered part of the method signature.


    3. Parameters:


    +   •A method can accept parameters, which are values passed to the method when
    it is called. Parameters are specified within the parentheses in the method signature.
    The values provided during the method call are referred to as arguments.


    4. Return Type:


    +   •The return type of a method indicates the type of value the method produces.
    If a method does not return any value, the return type is specified as void. Methods
    with a return type other than void must use the return statement to return a value
    of the specified type.


    5. Method Call:


    +   •To execute the code within a method, the method must be called from another
    part of the program. The method call consists of the method name followed by parentheses
    enclosing required arguments.'
  merge: -1
  pgno: 90
