    In Java, wrapper classes are classes that provide a way to use primitive data
    types (such as int, char, boolean, etc.) as objects. Each primitive data type
    has a corresponding wrapper class, which is part of the java.lang package.


    +   1. Primitive Data Types:


    ◆Java has eight primitive data types: byte, short, int, long, float, double, char,
    and boolean. These data types are not objects and do not inherit from a common
    class.


    +   2. Object Representation:


    ◆Wrapper classes serve as a way to represent primitive data types as objects.
    They provide a mechanism for converting primitive values into objects and vice
    versa.


    +   3. Naming Convention:


    ◆The naming convention for wrapper classes is to use the name of the primitive
    data type with the first letter capitalized. For example, the wrapper class for
    int is Integer, for char is Character, and so on.


    +   4. Inheritance from Object Class:


    ◆All wrapper classes inherit from the Object class, which is the root class of
    the Java class hierarchy. This means that wrapper classes have access to the methods
    defined in the Object class.


    +   5. Immutability:'
