    # Java HashSet


    A HashSet in Java is a part of the Java Collections Framework and is implemented
    by the HashSet class. It represents an unordered collection of unique elements.


    +   1. Unordered Collection:


    A HashSet does not maintain any order of elements. Unlike a List, the order in
    which elements are added to the HashSet is not preserved when iterating or accessing
    elements.


    +   2. Unique Elements:


    Each element in a HashSet must be unique. Attempting to add a duplicate element
    to the set will result in the set remaining unchanged.


    +   3. Null Values:


    A HashSet can contain at most one null element. If an attempt is made to add multiple
    null values, only one null value will be retained in the set.


    +   4. No Duplicate Elements:


    The primary purpose of a HashSet is to store and quickly retrieve unique elements.
    It ensures that each element is stored only once, preventing the inclusion of
    duplicate values.


    +   5. Hashing Mechanism:


    Internally, a HashSet uses a hash table or a similar data structure to store elements.
    The hashing mechanism is employed to efficiently organize and retrieve elements
    based on their hash codes.'
  - '[PAGE 210]


    6. No Indexing:


    Unlike a List or an ArrayList, a HashSet does not provide direct access to elements
    by index. Instead, elements are retrieved based on their values.'
  - '[PAGE 211]


    7. Set Interface Implementation:


    ●HashSet implements the Set interface in Java, which is a part of the Java Collections
    Framework. The Set interface extends the Collection interface and enforces the
    uniqueness of elements.


    8. Performance Characteristics:


    ●The performance of common operations (add, remove, contains) on a HashSet is
    generally constant time (O(1)), assuming a good hash function and a low load factor.


    9. Iteration:


    ●Iteration through the elements of a HashSet can be done using iterators or enhanced
    for loops. The iterator() method provides an iterator that can be used to traverse
    the elements.


    10. Dynamic Sizing:


    ●A HashSet can dynamically resize itself to accommodate elements. As the number
    of elements increases, the set''s capacity is increased to maintain a low load
    factor and ensure efficient operations.


    11. No Ordering Guarantees:


    ●The iteration order of elements in a HashSet is not guaranteed. If ordering is
    important, the LinkedHashSet class can be used to maintain insertion order.


