    In Java, an inner class is a class that is defined within another class.


    +   1. Definition:


    An inner class is a class that is declared inside another class. It is a way to
    logically group classes and can increase the encapsulation of the code.

    2. Types of Inner Classes:


    +   Java supports several types of inner classes, including:

    * Inner Class: A non-static inner class that is a member of its enclosing class.

    * Static Nested Class: A static class that is defined within another class. It
    is not associated with instances of the enclosing class.

    * Inner Class: A class defined within a block of code, such as a method. It has
    access to local variables of the enclosing scope.

    * Anonymous Inner Class: A class without a name that is defined and instantiated
    in a single expression. It is often used for one-time use, such as in event handling.

    3. Access to Members:


    +   An inner class has access to the members (fields and methods) of its enclosing
    class, including private members. This allows for a close relationship between
    the inner class and its enclosing class.

    4. Encapsulation:


    +   Inner classes contribute to encapsulation by allowing the grouping of related
    classes within a single logical unit. They can access the private members of the
    enclosing class, promoting data hiding.

    5. Code Organization:


    +   Inner classes are useful for organizing code logically. When a class is closely
    tied to another class and is not intended to be used independently, it makes sense
    to define it as an inner class.

    6. Callbacks and Event Handling:


    Inner classes are commonly used in event handling scenarios, where an inner class
    is defined to handle events such as button clicks. This promotes a clean separation
    of concerns.'
  - '[PAGE 160]


    7. Implementation of Design Patterns:


    +   Inner classes are often employed in the implementation of design patterns.
    For example, the Iterator pattern may use an inner class to encapsulate the iteration
    logic.


    8. Enhanced Readability:


    +   Inner classes can enhance code readability by keeping related classes close
    to each other. This can lead to more concise and understandable code.


    9. Private Implementation Details:


    +   Inner classes are useful for encapsulating private implementation details
    that are not meant to be exposed to external classes. This helps in keeping the
    internal workings of a class hidden.


    10. Avoiding Name Collisions:


    +   By using inner classes, you can avoid potential naming conflicts between classes.
    Inner classes can have the same name as long as they are within different enclosing
    classes.


    11.

    Instantiation and Lifetimes:


    +   An instance of an inner class is always associated with an instance of its
    enclosing class. The lifetime of an inner class object is tied to the lifetime
    of the outer class object.


    12. Limitations:


    +   While inner classes provide benefits, they can also introduce complexity and
    increase code verbosity. Overusing inner classes may lead to harder-to-read code.


    In summary, Java inner classes provide a way to define classes within'
