    \ the text.\n- 2. Example 2: Extracting Digits from a String:\n  - A pattern is\
    \ defined using the regular expression \\d+ to match one or more digits.\n  -\
    \ The Pattern class is used to compile the digit pattern, and a Matcher is created\
    \ for the input sentence.\n  - The find method is used in a loop to find and print\
    \ all occurrences of digits in the sentence.\n\nIn summary, Java regular expressions\
    \ provide a flexible and powerful way to work with patterns in strings. They are\
    \ used for tasks such as searching, matching, and manipulating text. Key classes\
    \ in the java.util.regex package include Pattern for compiling regular expressions\
    \ and Matcher for performing matching operations. Regular expressions are composed\
    \ of characters and special symbols that define patterns for string matching.\
    \ The flexibility and expressiveness of regular expressions make them a valuable\
    \ tool for tasks involving string manipulation and validation.\n\n# JAVA THREADS\n\
    \nIn Java, threads are the smallest units of execution within a program, and multithreading\
    \ is the concurrent execution of two or more threads to achieve better performance\
    \ and responsiveness.\n\n- 1. Thread Definition:\n  - A thread in Java is a lightweight,\
    \ independent unit of execution. It consists of its own program counter, stack,\
    \ and set of registers. Multiple threads within a program share the same memory\
    \ space but run independently.\n- 2. Thread Lifecycle:\n  - Threads go through\
    \ various states during their lifecycle. These states include:\n    - New: The\
    \ thread is created but not yet started.\n    - Runnable: The thread is ready\
    \ to run and is waiting for its turn to be picked by the thread scheduler.\n \
    \   - Blocked: The thread is waiting for a monitor lock to enter a synchronized\
    \ block or method.\n    - Waiting: The thread is waiting for another thread to\
    \ perform a particular action.\n    - TimedWaiting: The thread is waiting for\
    \ another thread for a specified amount of time.\n    - Terminated: The thread\
    \ has completed execution.\n- 3. Thread Creation:\n  - In Java, threads can be\
    \ created by extending the Thread class or implementing the Runnable interface.\
    \ The Thread class provides the start() method to begin the execution of a thread.\n\
    - 4. Runnable Interface:\n  - The Runnable interface provides a way to create\
    \ threads by implementing the run() method. The Runnable object can then be passed\
    \ to Thread constructor.\n- 5. Thread Priorities:\n  - Each thread in Java has\
    \ a priority assigned to it, ranging from Thread.MIN_PRIORITY to Thread.MAX_PRIORITY.\
    \ The default priority is Thread.NORM_PRIORITY. Higher-priority threads get more\
    \ CPU time than lower-priority threads.\n- 6. Synchronization:\n  - In a multithreaded\
    \ environment, multiple threads may access shared resources. Synchronization is\
    \ the mechanism in Java to control the access of multiple threads.\n- 7. Thread\
    \ Safety:\n  - Thread safety is the property of a program to execute threads concurrently\
    \ without introducing data inconsistencies. Proper synchronization and use of\
    \ locks ensure thread safety.\n- 8. Daemon Threads:\n  - Daemon threads are background\
    \ threads that do not prevent the program from terminating if they are still running.\
    \ They automatically terminate when all non-daemon threads finish.\n- 9. Thread\
    \ Interruption:\n  - The interrupt() method is used to interrupt a thread. When\
    \ a thread is interrupted, it receives an InterruptedException, and its normal\
    \ flow can be handled accordingly.\n- 10. Thread Joining:\n  - The join() method\
    \ is used to make one thread wait for the completion of another thread. This is\
    \ useful for coordinating the activities of different threads.\n- 11. Inter-Thread\
    \ Communication:\n  - Threads can communicate with each other using methods such\
    \ as wait(), notify(), and notifyAll(). These methods are used in synchronized\
    \ blocks to coordinate the execution of threads.\n- 12. Thread Pools:\n  - Thread\
    \ pools are a collection of pre-initialized threads that can be reused for executing\
    \ tasks. They help manage the lifecycle of threads, reducing the overhead of creating\
    \ and destroying threads.\n- 13. Thread Local Storage:\n  - Local storage provides\
    \ a way to store data that is local to a thread. Each thread has its own copy\
    \ of the data, and changes made by one thread do not affect the data seen by other\
    \ threads.\n- 14. Volatile Keyword:\n  - The keyword is used to indicate that\
    \ a variable's value may be changed by multiple threads simultaneously. It ensures\
    \ that changes to the variable are visible to all threads.\n\nIn summary, threads\
    \ in Java enable concurrent execution of tasks, improving the responsiveness and\
