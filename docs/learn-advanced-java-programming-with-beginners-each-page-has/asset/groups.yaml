    \ 类编译数字模式，并为输入句子创建了一个 `Matcher` 对象。\n  - 在循环中使用 `find` 方法查找并打印句子中所有数字出现的情况。\n\n\
    总结，Java 正则表达式为处理字符串中的模式提供了一种灵活且强大的方法。它们被用于如搜索、匹配和处理文本等任务。`java.util.regex` 包中的关键类包括用于编译正则表达式的\
    \ `Pattern` 和用于执行匹配操作的 `Matcher`。正则表达式由字符和特殊符号组成，定义了字符串匹配的模式。正则表达式的灵活性和表达力使其成为涉及字符串处理和验证任务的宝贵工具。\n\
    \n# JAVA 线程\n\n在 Java 中，线程是程序中执行的最小单元，多线程是两个或多个线程的并发执行，以实现更好的性能和响应能力。\n\n- 1.\
    \ 线程定义：\n  - Java 线程是一个轻量级、独立的执行单元。它包含自己的程序计数器、栈和一组寄存器。程序中的多个线程共享相同的内存空间，但独立运行。\n\
    - 2. 线程生命周期：\n  - 线程在生命周期内会经历各种状态。这些状态包括：\n    - 新 (New)：线程已创建但尚未启动。\n    - 可运行\
    \ (Runnable)：线程已就绪，正在等待线程调度器选择。\n    - 阻塞 (Blocked)：线程正在等待监视器锁以进入同步块或方法。\n   \
    \ - 等待 (Waiting)：线程等待另一个线程执行特定操作。\n    - 定时等待 (TimedWaiting)：线程等待另一个线程执行指定的时间。\n\
    \    - 终止 (Terminated)：线程已完成执行。\n- 3. 线程创建：\n  - 在 Java 中，可以通过继承 `Thread` 类或实现\
    \ `Runnable` 接口来创建线程。\n- 4. Runnable 接口：\n  - `Runnable` 接口提供了通过实现 `run()` 方法创建线程的方式。`Runnable`\
    \ 对象可以传递给 `Thread` 构造函数。\n- 5. 线程优先级：\n  - 每个线程都有一个优先级，范围从 `Thread.MIN_PRIORITY`\
    \ 到 `Thread.MAX_PRIORITY`。默认优先级为 `Thread.NORM_PRIORITY`。优先级线程 更多的 CPU。\n- 6. 同步：\n\
    \  - 在多线程环境中，多个线程可能会访问共享资源。同步是 Java 中控制线程访问的机制。\n- 7. 线程安全：\n  - 线程安全是程序并发执行而不引入数据不一致的属性。适当的同步和锁的使用可以确保线程安全。\n\
    - 8. 守护线程：\n  - 守护线程是后台线程，即使它们仍在也不会阻止程序终止。所有非守护线程结束时，它们会自动终止。\n- 9. 线程中断：\n  -\
    \ `interrupt()` 方法用于中断线程。当线程被中断时，会抛出 `InterruptedException`，并可以对其正常流进行处理。\n- 10.\
    \ 线程等待：\n  - `join()` 方法用于让一个线程等待另一个线程完成。这对于协调不同线程的活动非常有用。\n- 11. 线程间通信：\n  -\
    \ 线程可以使用 `wait()`、`notify()` 和 `notifyAll()` 等方法相互通信。这些方法用于同步块中协调线程的执行。\n- 12.\
    \ 线程池：\n  - 线程池是用于执行任务的预先初始线程集合。它们有助于管理线程的生命周期，减少创建和销毁线程的开销。\n- 13. 线程本地存储：\n\
    \  - 本地存储提供存储线程本地数据的方法。每个线程都有该数据的副本，一个线程的修改不会影响其他线程看到的数据。\n- 14. volatile 关键字：\n\
    \  - 该关键字用于指示变量的值可能会被多个线程同时修改。它确保对变量的更改对所有线程都是可见的。\n\n总结，Java 线程允许任务的并发执行，提高了程序的响应能力和性能。理解线程的生命周期、同步机制以及与其他多线程相关的概念，对于开发健壮且高效的\
    \ Java 多线程应用程序至关重要。\n\n"
