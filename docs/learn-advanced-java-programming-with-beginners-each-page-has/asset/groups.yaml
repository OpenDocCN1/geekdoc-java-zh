- md: "\n# Java While Loop\n\nIn Java, the while loop is a control flow statement\
    \ that repeatedly executes a block of code as long as a specified boolean expression\
    \ evaluates to true.\n\n- 1. Condition Evaluation:\nThe while loop begins with\
    \ the keyword while, followed by a boolean expression enclosed in parentheses.\
    \ The expression is evaluated before each iteration of the loop.\n\n- 2. Entry\
    \ Condition:\n\nThe boolean expression, also known as the entry condition, determines\
    \ whether the code inside the while loop will be executed. If the expression evaluates\
    \ to true, the loop body is executed; otherwise, the loop terminates, and control\
    \ moves to the next statement after the while loop.\n\n- 3. Loop Body:\n\nThe\
    \ body of the while loop consists of a block of code enclosed in curly braces\
    \ {}. This block contains the statements that are executed repeatedly as long\
    \ as the entry condition is true.\n\n- 4. Iterative Execution:\n\nIf the entry\
    \ condition is initially true, the loop body is executed, and then the entry condition\
    \ is evaluated again. If the condition remains true, the loop body is executed\
    \ again, creating an iterative process.\n\n- 5. Infinite Loop Risk:\n\nCare must\
    \ be taken to ensure that the entry condition can eventually evaluate to false.\
    \ Otherwise, the while loop may result in an infinite loop, where the code inside\
    \ the loop continues to execute indefinitely.\n\n- 6. Initializing Variables:\n\
    \n◆ When using a loop, it's important to initialize any variables used in the\
    \ entry condition before entering the loop. Failure to initialize variables properly\
    \ may lead to unexpected behavior or infinite loops.\n\n- 7. Exit Conditions:\n\
    \n◆ Inside the loop body, developers often include statements that modify the\
    \ values of variables used in the entry condition. This ensures that, over time,\
    \ the condition will become false, allowing the loop to terminate.\n\n- 8. Flexible\
    \ Control Flow:\n\n◆ The loop is versatile and can be used in various scenarios\
    \ where a block of code needs to be executed repeatedly based on a specified condition.\
    \ It is particularly useful when the number of iterations is not known beforehand.\n\
    \n- 9. Pre-Test Loop:\n\n◆ The loop is known as a pre-test loop because the condition\
    \ is evaluated before the loop body is executed. If the condition is initially\
    \ false, the loop body is skipped entirely.\n\n- 10. Alternative Loop Structures:\n\
    \n◆ In addition to the while loop, Java provides other loop structures such as\
    \ the for loop and the do-while loop, each with its own characteristics and use\
    \ cases.\n\n- 11. Nested Loops:\n\n◆ while loops can be nested within other loops\
    \ or control flow structures, allowing for more complex patterns of repetition\
    \ and decision-making in a program.\n\nIn summary, the while loop in Java is a\
    \ fundamental construct for creating repetitive execution based on a specified\
    \ condition. It offers flexibility in handling scenarios where the number of iterations\
    \ is determined by the state of the program. Careful consideration of the entry\
    \ condition and proper modification of variables inside the loop body are essential\
    \ to ensure correct and predictable behavior.\n\nIn Java, while a loop is a control\
    \ flow statement that repeatedly executes a block of code as long as a specified\
    \ condition is true.\n\n```java\npublic class WhileLoopExample {\n    public static\
    \ void main(String[] args) {\n        // Example 1: Simple while loop int i =\
    \ 1;\n        while (i <= 5) {\n            System.out.println(\"Iteration \"\
    \ + i); i++;\n        }\n\n        // Example 2: Infinite loop with break statement\
    \ int j = 1;\n        while (true) {\n            System.out.println(\"Infinite\
    \ Loop, Iteration \" + j); j++; if (j > 3) {\n                break; // Exit the\
    \ loop after three iterations\n            }\n        }\n\n        // Example\
    \ 3: While loop with user input java.util.Scanner scanner = new\n        java.util.Scanner\
    \ scanner(System.in); System.out.print(\"Enter a number (0 to exit): \");\n  \
