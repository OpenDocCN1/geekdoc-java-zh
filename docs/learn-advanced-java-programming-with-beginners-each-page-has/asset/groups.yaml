  - '[PAGE 142]


    # Java Packages / API


    In Java, packages and APIs (Application Programming Interfaces) are fundamental
    concepts that contribute to organizing code, promoting reusability, and facilitating
    collaboration among developers.


    +   Packages:

    - Definition: A package in Java is a way to organize related classes and interfaces
    into a single namespace. It helps prevent naming conflicts and provides a modular
    structure for organizing code.

    - Convention: Packages are named using a hierarchical naming convention, typically
    based on the reverse domain name of the organization. if a company owns the domain
    "example.com", their package names may start with com.example.

    - Visibility: Classes within the same package can access each other outside the
    package must use appropriate access modifiers (e.g., public, protected, or default)
    to access classes within a package.

    - Encapsulation: Packages contribute to encapsulation by providing a boundary
    for classes and members can be controlled based on package visibility.

    - Import Statements: To use classes from another package, Java code typically
    includes import statements. Import statements allow developers to refer to classes
    using their simple names rather than their fully qualified names.

    - Standard Packages: Java comes with a set of standard packages (e.g., java.lang,
    java.util) that provide common functionalities. These packages are automatically
    available to all Java programs.'
  - '[PAGE 143]


    2. APIs (Application Programming Interfaces):


    +   ◆Definition: An API in Java refers to the set of classes, interfaces, methods,
    and constants that provide a way for developers to interact with and use the functionality
    provided by a library or framework.


    +   ◆Reuse and Abstraction: APIs offer a level of abstraction, allowing developers
    to use pre-built functionalities without needing to understand the internal implementation
    details. This promotes code reuse and accelerates development.


    +   ◆Documentation: Good APIs come with comprehensive documentation that explains
    how to use the provided classes and methods. Documentation includes details about
    parameters, return types, exceptions, and usage examples.


    +   ◆Standard APIs: Java Standard Edition (SE) provides a set of standard APIs
    for common tasks, such as working with collections (java.util), networking (java.net),
    input/output (java.io), and more. These standard APIs are part of the Java Development
    Kit (JDK).


    +   ◆Third-Party APIs: Developers can also create and share their APIs, or third-party
    libraries and frameworks may provide APIs for specific functionalities. Popular
    examples include libraries for JSON parsing, logging, and web frameworks.


    +   ◆Package Structure: APIs are often organized into packages to provide a modular
    and organized structure. Users of the API can import specific packages or classes
    based on their needs.


    +   ◆Interface-based Design: APIs often use interfaces to define contracts that
    classes must adhere to. This enables polymorphism and allows different implementations
    to be used interchangeably.


    +   ◆Versioning: APIs may be versioned to ensure backward compatibility while
    introducing new features or improvements. Versioning helps maintain stability
    for existing users while allowing for evolution.'
  - '[PAGE 144]


    # 3. JavaDocs:


    +   •Documentation Format: JavaDocs is a documentation format used for documenting
    Java code, especially APIs. It uses special comments in the source code that are
    processed to generate HTML documentation.

    •Generated Documentation: JavaDocs provide a standardized and consistent way to
    document APIs. Generated documentation includes information on classes, methods,
    parameters, return types, and exceptions.

    •Accessibility: JavaDocs make it easy for developers to understand how to use
    a particular class or method without having to inspect the source code. It serves
    as a reference guide for using the API.

    •Integration with IDEs: Integrated Development Environments (IDEs) often support
    JavaDocs, providing developers with quick access to API documentation while coding.


    In summary, packages in Java provide a way to organize and structure classes,
    preventing naming conflicts and contributing to encapsulation. APIs, on the other
    hand, define a set of classes and methods that expose functionality for developers
    to use, promoting code reuse and abstraction. Good documentation, such as JavaDocs,
    plays a crucial role in helping developers understand and use APIs effectively.'
- md: "\nIn Java, a package is a way to organize related classes and interfaces into\
    \ a single namespace. It helps avoid naming conflicts and provides a hierarchical\
    \ structure to the codebase. The Java API (Application Programming Interface)\
    \ is a collection of pre-defined classes and interfaces that provide a set of\
    \ functionalities for common programming tasks. Here is an example that demonstrates\
    \ the use of packages and the Java API: // Example of using packages and API\n\
    \n```java\n// Import statements to use from Java API\nimport java.util.ArrayList;\n\
    import java.util.List; // Custom package and class\npackage com.example.myapp;\n\
    \npublic class PackagesAPIExample {\n    public static void main(String[] args)\
    \ {\n        // Using Class from the Java API\n        List<String> myList = new\
    \ ArrayList<String>();\n        \n        // Displaying items in the list:\n \
    \       myList.add(\"Item 1\");\n        myList.add(\"Item 2\");\n        System.out.println(\"\
    Items in the list:\");\n        for (String item : myList) {\n            System.out.println(item);\n\
    \        }\n\n        // Using a custom class from the same package\n        MyCustomClass\
    \ myCustomObject = new MyCustomClass();\n        myCustomObject.displayMessage();\n\
    \    }\n}\n\n// Custom class in the same package\npackage com.example.myapp;\n\
    public class MyCustomClass {\n    public void displayMessage() {\n        System.out.println(\"\
    This is a custom class in the same package.\");\n    }\n}\n```\n\nExplanation:\n\
    \n## 1. Java API:\nThe import statements at the beginning of the code import classes\
    \ from the Java API. In this example, ArrayList and List are part of the java.util\
    \ package.\n\n## 2. Custom Package and Class:\nA custom package (com.example.myapp)\
    \ is created to organize the custom class (MyCustomClass). The PackagesAPIExample\
    \ class and MyCustomClass are part of the same package.\n\n## 3. Using Classes\
    \ from Java API:\nAn ArrayList is used from the java.util package to create a\
    \ dynamic list. The List interface is also used to represent a list, and it is\
    \ part of the same package.\n\n## 4. Displaying Items from the List:\nitems are\
    \ added to the list and then displayed using a for loop.\n\n## 5. Using Custom\
    \ Class from the Same Package:\nAn object of the custom class MyCustomClass is\
    \ created and its displayMessage method is called.\n\nIn summary, packages in\
    \ Java are used to organize classes into a modular and hierarchical structure,\
    \ reducing naming conflicts and providing better organization. The Java API is\
    \ a collection of pre-built classes and interfaces that provide common functionalities\
    \ for developers to use. Import statements are used to include classes from packages\
    \ other than the current one, allowing the code to access the features provided\
    \ by the Java API or other custom packages.\n\n## Java Inheritance\n\nIn Java,\
    \ inheritance is a fundamental concept in object-oriented programming (OOP) that\
    \ allows one class to inherit the properties and behaviors (fields and methods)\
    \ of another class.\n\n## 1. Definition:\n- Inheritance is a mechanism that enables\
    \ a new class (subclass or derived class) to inherit attributes and behaviors\
    \ from an existing class (superclass or base class). The new class can extend\
    \ or specialize the functionalities of the existing class.\n\n## 2. Superclass\
    \ and Subclass:\n- The class from which properties and behaviors are inherited\
    \ is known as the superclass. The new class that inherits from the superclass\
    \ is called the subclass. The subclass is said to \"extend\" or \"derive\" from\
    \ the superclass.\n\n## 3. Code Reusability:\n- Inheritance promotes code reusability\
    \ by allowing the reuse of fields and methods defined in the superclass. This\
    \ reduces redundancy and supports the principle of \"Don't Repeat Yourself\" (DRY).\n\
    \n## 4. \"is-a\" Relationship:\n- Inheritance models the \"is-a\" relationship\
    \ between classes. If Class B inherits from Class A, it can be said that \"B is\
    \ a type of A.\" This relationship enhances code clarity and reflects real-world\
    \ relationships.\n\n## 5. Fields Inheritance:\n- Subclasses inherit fields (attributes)\
    \ from the superclass. This means that the subclass automatically has access to\
    \ the fields of the superclass without needing to redefine them.\n\n## 6. Methods\
    \ Inheritance:\n- Subclasses inherit methods from the superclass. They can use\
    \ the methods as they are, override them to provide specialized implementations,\
    \ or introduce new methods.\n\n## 7. Access Modifiers:\n- Access modifiers (e.g.,\
    \ public, protected, private, or package-private) influence the visibility of\
    \ inherited members. For example, a private field in the superclass is not directly\
    \ accessible in the subclass.\n\n## 8. Overriding Methods:\nSubclasses can override\
    \ (redefine) methods inherited from the superclass. Method overriding allows a\
    \ subclass to provide its own implementation of a method while keeping the method\
    \ signature of the same.\n\n## 9. Method Overloading:\nOverloading methods in\
    \ a subclass (having multiple methods with the same name but different parameter\
    \ lists) is not considered overriding. Overloading in the subclass does not replace\
    \ or override the superclass methods.\n\n## 10. Inheriting Constructors:\nConstructors\
    \ are not inherited, but they are invoked in the process of creating an object\
    \ of the subclass. Subclasses can use the super() keyword to call a constructor\
    \ from the superclass.\n\n## 11. Multiple Inheritance:\nJava supports single inheritance,\
    \ meaning a class can inherit from only one subclass. This avoids the complexity\
    \ and ambiguity associated with multiple inheritance.\n\n## 12. Abstract Classes\
    \ and Interfaces:\nAbstract classes and interfaces in Java are used to define\
    \ common structures for multiple classes. Abstract classes can provide a partial\
    \ implementation, while interfaces define a contract for.\n\n## 13. Final Classes\
    \ and Methods:\nThe final keyword can be used to prevent a class from being extended\
    \ (final class) or a method from being overridden (final method).\n\n## 14. Polymorphism:\n\
    Inheritance is closely related to polymorphism. Polymorphism allows objects of\
    \ different classes to be treated as objects of a base type, enabling flexibility\
    \ in code design and usage.\n\n## 15. Object-Oriented Design:\nInheritance is\
    \ a key component of object-oriented design. It allows for the creation of hierarchies\
    \ of related classes, making it easier to model and understand complex systems.\n\
    \nIn summary, Java inheritance is a mechanism that allows a new class to inherit\
    \ properties and behaviors from an existing class, promoting code reusability,\
    \ modeling relationships, and supporting the principles of OOP. The \"is-a\" relationship,\
    \ code clarity, and polymorphism are among the benefits of inheritance in Java.\n"
  mdcn: "\n\n在 Java 中，包（package）是将相关的类和接口组织到单个命名空间的方法。它有助于避免命名冲突，并为代码库提供分级结构。Java\
    \ API（应用程序编程接口）是一组预定义的类和接口的集合，为常见的编程任务提供一系列功能。以下是一个演示包和 Java API 的示例：// 使用包和 API\
    \ 的示例\n\n```java\n// 使用来自 Java API 的导入语句\nimport java.util.ArrayList;\nimport\
    \ java.util.List; // 自定义包和类\npackage com.example.myapp;\n\npublic class PackagesAPIExample\
    \ {\n    public static void main(String[] args) {\n        // 使用 Java API 中的类\n\
    \        List<String> myList = new ArrayList<String>();\n        \n        //\
    \ 显示列表中的项：\n        myList.add(\"Item 1\");\n        myList.add(\"Item 2\");\n\
    \        System.out.println(\"Items in the list:\");\n        for (String item\
    \ : myList) {\n            System.out.println(item);\n        }\n\n        //\
    \ 使用同一包中的自定义类\n        MyCustomClass myCustomObject = new MyCustomClass();\n \
    \       myCustomObject.displayMessage();\n    }\n}\n\n// 同一包中的自定义类\npackage com.example.myapp;\n\
    public class MyCustomClass {\n    public void displayMessage() {\n        System.out.println(\"\
    This is a custom class in the same package.\");\n    }\n}\n```\n\n解释：\n\n## 1.\
    \ Java API:\n代码开头的导入语句从 Java API 导入类。在这个示例中，`ArrayList` 和 `List` 是 `java.util`\
    \ 包的一部分。\n\n## 2. 自定义包和类：\n创建一个自定义包（com.example.myapp）来组织自定义类（MyCustomClass）。`PackagesAPIExample`\
    \ 类和 `MyCustomClass` 属于同一个包。\n\n## 3. 使用 Java API 中的类:\n使用了 `java.util` 包中的 `ArrayList`\
    \ 来创建一个动态列表。`List` 接口用于表示列表，它属于同一个包。\n\n## 4. 显示列表中的项:\n将项添加到列表中，然后使用 `for` 循环进行显示。\n\
    \n## 5. 使用同一包中的自定义类:\n创建了自定义类 `MyCustomClass` 的对象并调用了其 `displayMessage` 方法。\n\n\
    总结，Java 中的包用于将类组织成模块化和分级的结构，减少命名冲突并提供更好的组织。Java API 是一个预构建类和接口的集合，为开发者提供了常用功能。导入语句用于包含来自当前包之外的类，允许代码访问\
    \ Java API 或其他自定义包提供的功能。\n\n## Java 继承\n\n在 Java 中，继承是面向对象编程（OOP）的一项基本概念，允许一个类继承另一个类的属性和行为（字段和方法）。\n\
    \n## 1. 定义:\n- 继承是一种机制，允许新类（子类或派生类）从现有类（父类或基类）继承属性和行为。新类可以扩展或专门化现有类的功能。\n\n##\
    \ 2. 父类和子类:\n- 继承属性和行为的类被称为父类。继承父类的新类被称为子类。子类被认为“扩展”或“派生”自父类。\n\n## 3. 代码重用:\n\
    - 继承通过允许重用父类中定义的字段和方法来促进代码的重用。这减少了冗余并支持“不要重复 way”（DRY）原则。\n\n## 4. “is-a”关系:\n\
    - 继承模拟了类之间的“是一个”的关系。如果类 B 继承自类 A，可以说“B 是 A 的一种”。这种关系增强了代码的清晰度，并反映了现实世界的关系。\n\n\
    ## 5. 字段继承:\n- 子类从父类继承字段（属性）。这意味着子类自动拥有父类的字段，而无需重新定义它们。\n\n## 6. 方法继承:\n- 子类从父类继承方法。它们可以原样使用这些方法，也可以对其进行重写以提供专门的实现，或者引入新方法。\n\
    \n## 7. 访问修饰符:\n- 访问修饰符（例如 `public`、`protected`、`private` 或包私有）影响继承成员的可见性。例如，父类中的\
    \ `private` 字段在子类中无法直接访问。\n\n## 8. 方法重写:\n子类可以重写（重新定义）从父类继承的方法。方法重写允许子类在保持方法签名相同的同时提供自己的方法实现。\n\
    \n## 9. 方法重载:\n在子类中重载方法（具有相同名称但不同参数列表多个方法）不被视为重写。子类中的重载不会替换或覆盖父类的方法。\n\n## 10.\
    \ 继承构造函数:\n构造函数不被继承，但在创建子类对象的过程中，它们会被调用。子类可以使用 `super()` 关键字来调用父类的构造函数。\n\n##\
    \ 11. 多重继承:\nJava 支持单继承，这意味着一个类只能继承一个子类。这避免了与多重继承相关的复杂性和歧义。\n\n## 12. 抽象类和接口:\n\
    Java 中的抽象类和接口用于定义多个类的共同结构。抽象类可以提供部分实现，而接口则定义了一个契约。\n\n## 13. final 类和方法:\n`final`\
    \ 关键字可以防止类被扩展（final 类）或防止方法被重写（final 方法）。\n\n## 14. 多态:\n继承与多态紧密相关。多态允许将不同类的对象被视为基类类型的对象，从而实现代码设计和用法的灵活性。\n\
    \n## 15. 面向对象设计:\n继承是面向对象设计的关键组件。它允许创建相关类的层级结构，使得建模和理解复杂系统变得更加容易。\n\n总结，Java 继承是一种允许新类继承现有类属性和行为的机制，促进了代码重用、关系建模并支持\
    \ OOP 原则。“is-a”关系、代码清晰度和多态都是 Java 继承的优点之一。\n\n"
