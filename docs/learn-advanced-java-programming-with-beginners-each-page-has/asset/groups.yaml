  mdcn: "\n\n# Java While 循环\n\n在 Java 中，while 循环是一种控制流语句，只要指定的布尔表达式求值为 true，它就会重复执行一个代码块。\n\
    \n- 1. 条件评估：\nwhile 循环以 `while` 关键字开始，后跟着一个括在括号内的布尔表达式。该表达式在循环的每次迭代之前都会进行评估。\n\
    \n- 2. 入口条件：\n\n布尔表达式（也称为入口条件）决定了 while 循环内部的代码是否会被执行。如果表达式求值为 `true`，则执行循环体；否则，循环终止，控制权移到\
    \ while 循环之后的下一条语句。\n\n- 3. 循环体：\n\nwhile 循环的体由由大括号 `{}` 包围的代码块组成。该代码块包含只要入口条件为\
    \ `true` 就会重复执行的语句。\n\n- 4. 迭代执行：\n\n如果入口条件初始为 `true`，则会执行循环体，然后再次评估入口条件。如果条件保持为\
    \ `true`，则会再次执行循环体，从而形成一个迭代过程。\n\n- 5. 死循环风险：\n\n必须确保入口条件最终能够求值为 `false`。否则，while\
    \ 循环可能会导致死循环，即循环内部的代码将无限执行下去。\n\n- 6. 变量初始化：\n\n◆ 使用循环时，在进入循环之前初始化入口条件中使用的任何变量是非常关重要的。未能正确初始化变量可能会导致意外行为或死循环。\n\
    \n- 7. 退出条件：\n\n◆ 在循环体内部，开发者通常会包含修改入口条件中所用变量值的语句。这确保了随着时间的推移，条件将变为 `false`，从而允许循环终止。\n\
    \n- 8. 灵活的控制流：\n\n◆ 该循环非常多功能，可以用于各种需要根据指定条件重复执行代码块的场景。当预先不知道迭代次数时，它特别别有用。\n\n\
    - 9. 先测试循环：\n\n◆ 这种循环被称为先测试循环，因为条件在执行循环体之前就已经被评估了。如果条件初始为 `false`，则将完全跳过循环体。\n\
    \n- 10. 替代循环结构：\n\n◆ 除了 while 循环外，Java 还提供了其他循环结构，例如 `for` 循环和 `do-while` 循环，它们各自有自己的特点和用例。\n\
    \n- 11. 嵌套循环：\n\n◆ while 循环可以嵌套在其他循环或控制流结构中，允许程序中出现更复杂的重复和决策模式。\n\n总结来说，Java 中的\
    \ `while` 循环是根据指定条件创建重复执行的基础结构。它在处理迭代次数取决于程序状态的场景时提供了灵活性。仔细考虑入口条件并并在循环体内正确修改变量，对于确保行为正确且可预测至关重要。\n\
    \n在 Java 中，`while` 循环是一种控制流语句，只要指定的条件为 `true`，它就会重复执行一个代码块。\n\n```java\npublic\
    \ class WhileLoopExample {\n    public static void main(String[] args) {\n   \
    \     // 示例 1: 简单的 while循环 int i = 1;\n        while (i <= 5) {\n            System.out.println(\"\
    Iteration \" + i); i++;\n        }\n\n        // 示例 2: 使用 break 语句的死循环 int j =\
    \ 1;\n        while (true) {\n            System.out.println(\"Infinite Loop,\
    \ Iteration \" + j); j++; if (j > 3) {\n                break; // 在三次迭代后退出循环\n\
    \            }\n        }\n\n        // 示例 3: 带用户输入的 while循环 java.util.Scanner\
    \ scanner = new\n        java.util.Scanner scanner(System.in); System.out.print(\"\
    Enter a number (0 to exit): \");\n        int userInput = scanner.nextInt(); while\
    \ (userInput != 0) {\n            System.out.println(\"You entered: \" + userInput);\n\
    \            System.out.print(\"Enter a number (0 to exit): \");\n           \
    \ userInput = scanner.nextInt();\n        }\n\n        System.out.println(\"Exited\
    \ the loop. Program complete.\");\n        scanner.close();\n    }\n}\n```\n\n\
    while 循环的解释：\n\n- 1. 语法：\nwhile 循环以 `while` 关键字开始，后跟着括号内的布尔表达式。只要大括号内的布尔表达式为 `true`，其内部代码块就会重复执行。\n\
    \n- 2. 条件：\n只要指定的条件求值为 `true`，循环就会继续执行。如果条件初始为 `false`，则循环内部的代码将永远不会执行。\n\n- 3.\
    \ 初始化与更新：\n在进入循环之前初始化条件中使用的任何变量是非常关重要的，并且应该在循环内部更新条件，以便最终变为 `false` 并退出循环。\n\n\
    - 4. 死循环：\n应小心避免死循环。在第二个示例中，使用了 `break` 语句在满足特定条件后退出循环。\n\n- 5. 用户输入循环：\n第三个示例展示了一个\
    \ `while` 循环，它会一直提示用户输入，直到他们输入 0。\n\n当迭代次数预先未知且取决于特定条件时，`while` 循环是合适的。确保条件最终变为\
    \ `false` 以防止死循环非常重要。只要条件保持为 `true`，循环就会继续执行，使其成为重复执行代码块的灵活结构。\n\n# Java For 循环\n\
    \n在 Java 中，`for` 循环是一种控制流语句，允许指定的代码块重复执行特定次数。它为执行迭代提供了一种简洁且表达力的方式。\n\n- 1. 初始化：\n\
    `for` 循环以关键字开始，后跟着一组括号。在括号内指定循环的初始化部分。这部分通常包括循环控制变量的初始化。\n\n- 2. 控制变量：\n循环控制变量是用于控制迭代次数的变量。它在\
    \ `for` 循环的第一部分初始化，用于跟踪循环的进度。\n\n- 3. 条件：\n`for` 括号内的第二部分包含持续条件。该条件在每次迭代之前进行评估，如果为\
    \ `true`，则执行循环体。如果条件为 `false`，循环终止。\n\n- 4. 迭代表达式：\n`for` 括号内的第三部分包含迭代表达式。该表达式在每次循环体之后执行，通常用于更新循环控制变量。\n\
    \n- 5. 循环体：\n`for` 循环的体由大括号 `{}` 包围。只要持续条件为 `true`，其中包含的语句就会重复执行。\n\n- 6. 先测试循环：\n\
    ◆ 该循环被称为先测试循环，因为条件在执行循环体之前就已经被评估了。如果条件初始为 `false`，则将完全跳过循环体。\n\n- 7. 初始化一次：\n\
    for循环的初始化部分只在循环开始时执行一次。它负责设置循环控制变量的初始状态。\n\n- 8. 灵活的控制流：\n当迭代次数预先已知时，`for` 循环是表达重复执行的一种简洁且生动的方式。它为每次迭代期间初始化、测试和更新变量提供了清晰的结构。\n\
    \n- 9. 增强 for 循环（Java 5 及更高版本）：\n除了传统的循环，Java 还引入了增强 for 循环（也称为 \"foreach\" 循环）。这种循环通过消除显式循环控制变量和条件，简化了对数组和集合的迭代。\n\
    \n- 10. 嵌套循环：\nfor 循环可以嵌套在其他循环或控制流结构中，允许程序中出现更复杂的重复和决策模式。\n\n- 11. 变量作用域：\n在 `for`\
    \ 循环初始化部分声明的变量作用域有限，仅在循环体内可访问。\n\n- 12. 替代循环结构：\n\n"
