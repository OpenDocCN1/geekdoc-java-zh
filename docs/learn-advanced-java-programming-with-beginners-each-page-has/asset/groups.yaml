    1. Skip Iteration:\n- The continue statement is used to skip the rest of the code\
    \ inside the current iteration of a loop and proceed to the next iteration. It\
    \ does not exit the loop; rather, it skips the remaining statements within the\
    \ loop body for the current iteration.\n\nLoop Increment/Update:\nAfter encountering\
    \ a continue statement, the loop’s increment or update expressions are executed,\
    \ and control moves to the next iteration of the loop. This allows the loop to\
    \ continue with the next set of iterations.\n\n- 3. Filtering Out Elements:\n\
    - continue is often used to filter specific elements or conditions within a loop.\
    \ For example, if a certain condition is met, the continue statement can be used\
    \ to skip processing for that particular iteration.\n\n- 4. Loop Nesting:\n- Similar\
    \ to the break statement, the continue statement affects only the innermost code\
    \ in the case of nested loops. It skips the remaining code in the current iteration\
    \ of the inner loop and proceeds to the next iteration of that inner loop.\n\n\
    - 5. Use in while and do-while Loops:\n- The continue statement can be used in\
    \ while and do-while loops, just like in loops, to achieve similar effects of\
    \ skipping the remaining code in the current iteration and moving to the next\
    \ one.\n\n- 6. Labelled continue (Java 8 and later):\n- Java 8 introduced the\
    \ ability to use a label with continue statements, allowing developers to specify\
    \ which loop to continue when dealing with nested loops. This labeled continue\
    \ statement provides more control in scenarios with multiple nested loops. In\
    \ summary, both break and continue statements are important control flow constructs\
    \ commonly used within loops to alter the normal execution flow. While break is\
    \ used to terminate the loop prematurely, continue is used to skip the remaining\
    \ code in the current iteration and move on to the next iteration.\n\nCareful\
    \ use of break and continue are control statements used in loops.\n\n```java\n\
    public class BreakContinueExample {\n    public static void main(String[] args)\
    \ {\n        // Example with break\n        System.out.println(\"Example with\
    \ break:\");\n        for (int i = 1; i <= 5; i++) {\n            if (i == 3)\
    \ {\n                break; // Terminate the loop when i is 3\n            }\n\
    \            System.out.println(\"Iteration \" + i);\n        }\n\n        //\
    \ Example with continue\n        System.out.println(\"\\nExample with continue:\"\
    );\n        for (int j = 1; j <= 5; j++) {\n            if (j == 2 || j == 4)\
    \ {\n                continue; // Skip the rest of body\n            }\n     \
    \       System.out.println(\"Iteration \" + j);\n        }\n    }\n}\n```\n\n\
    Explanation:\n1. break statement:\nIn the first loop, when i becomes 3, the break\
    \ statement is encountered, causing the loop to terminate. As a result, the \"\
    Iteration\" statement doesn't execute further.\n\n2. continue statement:\nIn the\
    \ second loop, when j is equal to 2 or 4, the continue statement is encountered.\
    \ It skips the rest of the loop body for particular iteration. As a result, the\
    \ \"Iteration\" statement is not printed for j values 2 and 4.\n\nIn summary:\n\
    - break: Terminates the loop immediately, and control passes to the statement\
    \ following the loop.\n- continue: Skips the remaining code and moves to the next\
    \ iteration.\n\n## JAVA ARRAYS\n\nIn Java, an array is a data structure that allows\
    \ you to store multiple values of the same data type under a single variable name.\n\
    \n- 1. Homogeneous Elements:\n- Arrays in Java are homogeneous, meaning that all\
    \ elements within an array must be of the same data type. For example, you can\
    \ have an array of integers, an array of characters, or an array of objects.\n\
    \n- 2. Fixed Size:\n- Once an array is created, its size is fixed and cannot be\
    \ changed. If you need a dynamic collection that can grow or shrink, you might\
    \ consider other data structures, such as ArrayList or LinkedList.\n\n- 3. Zero-Based\
    \ Indexing:\n- Array elements are accessed using an index, and the indexing starts\
    \ from 0. The first element is at index 0, the second at index 1, and so on. The\
    \ last element is at index length-1, where length is the size of the array.\n\n\
    - 4. Declaration and Initialization:\n- Arrays are declared and initialized using\
    \ square brackets []. For example, int[] numbers = new int[5]; declares an integer\
    \ array numbers with a size of 5. The new keyword is used to allocate memory for\
    \ the array.\n\n- 5. Length Property:\n- Arrays have a length property that indicates\
    \ the number of elements in the array. This property is often used in loops and\
    \ other constructs to iterate over the elements of the array.\n\n- 6. Random Access:\n\
    - Arrays allow for direct access to any element using its index. This enables\
    \ efficient random access to elements, and the time complexity for accessing an\
    \ element is constant O(1).\n"
  mdcn: "\n\n- 除了 `for` 循环，Java 还提供了其他的循环结构，如 `while` 循环和 `do-while` 循环，它们各自具有特性和使用场景。\n\
    \n总之，Java 中的 `for` 循环是一种用于迭代操作的强大且表达性构造。它简化了循环和迭代的结构。它提供了一种在每次迭代中初始化、测试和更新变量的清晰方法。`for`\
    \ 循环广泛用于已知迭代次数的场景。\n\n在 Java 中，`for` 循环是一种控制流语句，允许你按照指定的次数重复执行一段代码块。\n\n```java\n\
    public class ForLoopExample {\n    public static void main(String[] args) {\n\
    \        // Example 1: Simple for loop\n        for (int i = 1; i <= 5; i++) {\n\
    \            System.out.println(\"Iteration \" + i);\n        }\n\n        //\
    \ Example 2: Sum of numbers using a for loop\n        int sum = 0; for (int j\
    \ = 1; j <= 10; j++) {\n            sum += j; // Equivalent to sum = sum + j\n\
    \            System.out.println(\"Sum of numbers from 1 to 10: \" + sum);\n  \
    \      }\n        // Example 3: Nested for loop for a multiplication table\n \
    \       for (int row = 1; row <= 5; row++) {\n            for (int col = 1; col\
    \ <= 5; col++) {\n                System.out.print(row * col + \"\\t\");\n   \
    \         }\n            System.out.println();\n        }\n    }\n}\n```\n\n`for`\
    \ 循环的解释：\n1. 语法：`for` 循环括号内有三个部分：初始化、条件和更新。大括号内的代码块只要条件为真，就会重复执行。\n\n- 2. 初始化：初始化部分在循环开始时执行一次。它通常用于初始化循环控制变量。\n\
    \n- 3. 条件：条件在每次迭代之前进行求值。如果求值为为真，则循环继续；否则退出。\n\n- 4. 更新：更新部分在每次迭代之后执行。它通常用于增加或递减循环控制变量。\n\
    \n- 5. 循环变量作用域：循环控制变量的作用范围仅限于 `for` 循环，仅在循环内部可访问。\n\n- 6. 嵌套 for 循环：`for` 循环可以嵌套循环内部。在第三个示例中，使用了嵌套循环来打印乘法表。\n\
    \n`for` 循环是一种遍历值范围的简洁且具表现力的方式。它通常用于预先知道迭代次数的情况。循环控制变量经常用于跟踪循环进度，并可以在循环内部用于各种目的。`for`\
    \ 循环是 Java 编程中多功能且强大的构造。\n\n## Java Break/Continue\n\n在 Java 中，`break` 和 `continue`\
    \ 语句是循环内部的控制流语句，用于改变执行的正常流程。\n\nJava break 语句：\n1. 循环终止：\n- `break` 语句用于提前终止循环的执行。当在循环中遇到\
    \ `break` 语句时，会立即退出循环，并将控制转移到循环后的语句。\n\n- 2. 提前退出：\n- `break` 经常在循环中用于根据特定条件提前退出循环。一旦遇到\
    \ `break` 语句，循环的剩余迭代将被跳过，程序继续执行循环后的语句。\n\n- 3. switch 语句：\n- 除了循环，`break` 语句还用于\
    \ `switch` 语句以退出 `switch` 块。它通常放在每个 `case` 块的末尾，防止穿透到后续的 `case` 块。\n\n- 4. 循环嵌套：\n\
    - 处理嵌套循环时，内部循环中的 `break` 语句只会退出该循环，而不是外部循环。如果在外部循环中使用 `break` 语句，将退出外部循环。\n\n\
    Java continue 语句：\n1. 跳过迭代：\n- `continue` 语句用于跳过循环中当前迭代的剩余代码，并进入下一次迭代。它不会退出循环；而是跳过当前迭代循环体内的剩余语句。\n\
    \n循环递增/更新：\n在遇到 `continue` 语句后，循环的递增或更新表达式会被执行，控制移动到循环的下一次迭代。这允许循环继续下组迭代。\n\n\
    - 3. 过滤元素：\n- `continue` 经常用于过滤循环中的特定元素或条件。例如，如果满足了某个条件，可以使用 `continue` 语句跳过该特定迭代的处理。\n\
    \n- 4. 循环嵌套：\n- 与 `break` 语句类似，在嵌套循环的情况下，`continue` 语句仅影响最内的代码。它跳过内部循环当前迭代的剩余代码，并进入该内部循环的下一次迭代。\n\
    \n- 5. 在 while 和 do-while 循环中使用：\n- `continue` 语句可以用于 `while` 和 `do-while` 循环，就像在循环中一样，以实现跳过当前迭代剩余代码并移动到下一个的效果。\n\
    \n- 6. 标签 continue (Java 8 及更高版本)：\n- Java 8 引入了在 `continue` 语句使用标签的能力，允许开发者在处理嵌套循环时指定要继续哪个循环。这种带标签的\
    \ `continue` 语句在多层嵌套场景下提供了更多控制。总之，`break` 和 `continue` 语句都是循环中常用的重要控制流构造，用于改变正常执行流。虽然\
    \ `break` 用于提前终止循环，而 `continue` 用于跳过当前迭代的剩余代码并进入下一次迭代。\n\n谨慎使用 `break` 和 `continue`，它们是用于循环的控制语句。\n\
    \n```java\npublic class BreakContinueExample {\n    public static void main(String[]\
    \ args) {\n        // Example with break\n        System.out.println(\"Example\
    \ with break:\");\n        for (int i = 1; i <= 5; i++) {\n            if (i ==\
    \ 3) {\n                break; // Terminate the loop when i is 3\n           \
    \ }\n            System.out.println(\"Iteration \" + i);\n        }\n\n      \
    \  // Example with continue\n        System.out.println(\"\\nExample with continue:\"\
    );\n        for (int j = 1; j <= 5; j++) {\n            if (j == 2 || j == 4)\
    \ {\n                continue; // Skip the rest\n            }\n            System.out.println(\"\
    Iteration \" + j);\n        }\n    }\n}\n```\n\n解释：\n1. break：\n在第一个循环中，当 `i`\
    \ 变为 3 时，遇到 `break` 语句，导致循环终止。\n\n2. continue：\n在第二个循环中，当 `j` 等于 2 或 4 时，会遇到 `continue`\
    \ 语句。它跳过了循环体的剩余，因此不再打印 \"Iteration\"。\n\n总结：\n- break：立即终止循环，控制权转移到循环后的语句。\n-\
    \ continue：跳过剩余代码并进入下一次迭代。\n\n## Java 数组\n\n在 Java 中，数组是一种允许在单个变量名下存储多个相同类型值的数据结构。\n\
    \n- 1. 同质元素：\n- Java 数组是同质的，这意味着数组中的所有元素必须是相同类型。例如，你可以有一个整数数组、字符数组或对象数组。\n\n-\
    \ 2. 固定大小：\n- 数组一旦创建，其大小就是固定且不可更改。如果你需要可以增长或缩小的动态集合，可以考虑其他数据结构，如 `ArrayList` 或\
    \ `LinkedList`。\n\n- 3. 零索引：\n- 数组元素通过索引访问，索引从0开始。第一个元素位于索引0，第二个元素位于索引1，以此类推。最后一个元素位于\
    \ length-1，其中 length 是数组的大小。\n\n- 4. 声明和初始化：\n- 使用方括号 `[]` 声明并初始化数组。例如，`int[]\
    \ numbers = new int[5];` 声明了一个大小为5的整数数组 `numbers`。使用 `new` 关键字为数组分配内存。\n\n- 5.\
    \ 属性：\n- 数组具有 `length` 属性，指示数组中的元素数量。该属性通常用于循环和其他构造，以遍历数组元素。\n\n- 6. 随机访问：\n-\
    \ 数组允许通过索引直接访问任何元素。这使得对元素的随机访问非常高效，访问元素的时间复杂度为常数 O(1)。\n\n"
