- md: "\nThe process of converting a primitive type to its corresponding wrapper class\
    \ is called autoboxing, and the reverse process is called unboxing. Autoboxing\
    \ and unboxing are performed automatically by the Java compiler when needed. Wrapper\
    \ classes are commonly used in scenarios where objects are required, such as collections\
    \ and generic types.\n\n# Java Exceptions\n\nIn Java, exceptions are events that\
    \ occur during the execution of a program that disrupts the normal flow of instructions.\
    \ Exception handling is a mechanism provided by Java to deal with these unexpected\
    \ situations.\n\n1. Types of Exceptions:\n- Exceptions in Java are divided into\
    \ two main categories:\n- Checked Exceptions: These are exceptions that are checked\
    \ at compile-time. Programmers are required to handle these exceptions using try-catch\
    \ blocks or declare that they may throw these exceptions using the throws clause.\n\
    - Unchecked Exceptions (Runtime Exceptions): These are exceptions that are not\
    \ checked at compile-time. They usually occur due to programming errors or unexpected\
    \ runtime conditions.\n\n2. Exception Hierarchy:\n- All exception classes in Java\
    \ are subclasses of either the Exception class or the RuntimeException class.\
    \ The Exception class represents checked exceptions, and the RuntimeException\
    \ class represents unchecked exceptions.\n\n3. try, catch, and finally Blocks:\n\
    - Exception handling is typically done using try-catch blocks. The try block contains\
