    # JAvA StrinGS


    In Java, a String is a class that represents a sequence of characters. Strings
    are widely used in Java programming for text manipulation, storage, and representation.


    +   1. Immutable Nature:


    ◆One key characteristic of Java Strings is their immutability. Once a String object
    is created, its value cannot be changed. Any operation that appears to modify
    a String actually creates a new String.


    +   2. String Literal vs. String Object:


    ◆Strings in Java can be created using string literals (e.g., "Hello") or by creating
    String objects using the new keyword. Using string literals is more common and
    convenient, and Java automatically creates String objects for literals.


    +   3. Concatenation:


    ◆Strings in Java can be concatenated using the + operator. This operation creates
    a new String that is the concatenation of the operands. For efficiency, especially
    when concatenating in a loop, StringBuilder or StringBuffer classes are recommended.


    +   4. String Pool:


    ◆Java maintains a String pool, which is a pool of unique String literals in memory.
    When a new String is created using a literal that already exists in the pool,
    the existing instance is reused, reducing memory overhead.


    +   5. String Methods:


    ◆The String class provides numerous methods for manipulating and querying strings.
    These methods include operations for finding the length of a string, extracting
    substrings, converting case, comparing strings, and more.


    +   6. Escape Sequences:


    ◆Strings in Java support escape sequences to represent special characters. For
    example, \n represents a newline character, \t represents a tab character, and
    \" represents a double quote.'
  - '[PAGE 45]


    +   7. String Comparison:

    ●Comparing strings in Java is done using methods like equals() or compareTo().
    It''s important to note that == compares references, the actual content of the
    strings.


    +   8. String Interning:

    ●String interning is the process of putting unique String literals into the String
    pool, ensuring that identical literals refer to the same String object. This can
    be done explicitly using the intern() method.


    +   9. String Indexing:

    ●Characters in a String are indexed starting from 0. individual characters are
    done using the charAt() method. Strings are immutable, so modifying a character
    requires creating a new String.


    +   10. Unicode Support:

    ●Java Strings support Unicode, allowing them to represent characters from various
    writing systems. This makes Java suitable for internationalization and localization.


    +   11. Regular Expressions:

    ●Java provides support for regular expressions through the String class and the
    java.util.regex package. Regular expressions allow for powerful string matching
    and manipulation.


    +   12. StringBuffer and StringBuilder:

    ●While String objects are immutable, StringBuffer and StringBuilder classes provide
    mutable alternatives for string manipulation. They are more efficient for scenarios
    involving frequent modifications.


    In summary, Java Strings are a fundamental part of the language, offering a versatile
    and powerful way to work with textual data. Understanding the immutability of
    Strings, their methods, and related concepts like the String pool is crucial for
    effective string manipulation in Java programs.'
