    \ 等方法用于将其转换为不同的数值类型。\n\n- 11. 泛型类 (Generic Classes)：\n  - 包装类经常在泛型语文中使用。泛型需要对象，使用包装类允许在泛型类和方法中使用基本数据类型。\n\
    \n总结，Java 中的包装类充当了基本数据类型和对象之间的桥梁。它们允许在需要对象的地方使用基本值，实现了类型转换，并为处理相应的数据类型提供了工具方法。包装类在使\
    \ Java 的类型系统更加灵活和一致方面起着至关重要的作用。\n\n在 Java 中，包装类是一组提供了基本数据类型对象表示的类。包装类是 `java.lang`\
    \ 包的一部分，在需要基本类型的对象表示时使用。包装类包括：\n- Byte 对应 byte\n- Short 对应 short\n- Integer 对应\
