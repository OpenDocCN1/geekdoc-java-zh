    \    System.out.println(\"The value of x is: \" + x);\n        System.out.println(\"\
    The value of y is: \" + y); \n\n        // 格式化输出\n        System.out.printf(\"\
    Formatted output: x = %d, y = %.2f\\n\", x, y);\n    }\n}\n```\n\nJava 输出说明：\n\
    \n- 1. 打印到控制台 (System.out.println)：`System.out.println` 语句用于向控制台打印一行文本。在示例中，它打印了字符串\
