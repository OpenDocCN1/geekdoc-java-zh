    \ 是整数 (x) 的占位符，`%.2f` 是保留小数的浮点数 (y) 的占位符。\n\nJava 输出特指程序向用户或系统的其他部分显示的信息。在提供的代码示例中：\n\
    \n- \"Hello, Java!\" 使用 `System.out.println` 输出到控制台。\n- 变量 x 和 y 的值被整合到输出中，以显示关于这些变量的特定信息。`System.out.printf`\
