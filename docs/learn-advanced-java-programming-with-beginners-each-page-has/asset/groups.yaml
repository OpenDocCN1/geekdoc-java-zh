  mdcn: "\n\n## 6. 日志输出：\n  - Java 开发者提供了一个日志框架——即 Java Logging API，用于捕获各种级别的程序输出。开发者可以使用日志记录器记录不同严重程度的消息，例如信息（info）、警告（warning）和错误（error）。\n\
