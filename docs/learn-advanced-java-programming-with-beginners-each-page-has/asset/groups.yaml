    ## Java Polymorphism\n\nIn Java, polymorphism is a fundamental concept in object-oriented\
    \ programming (OOP) that allows objects of different types to be treated as objects\
    \ of a common base type. Polymorphism enables flexibility and adaptability in\
    \ code design and usage.\n\n- 1. Definition:\n    - Polymorphism is the ability\
    \ of a single entity, such as a method or class, to take on multiple forms. In\
    \ Java, there are two types of polymorphism: compile-time polymorphism (method\
    \ overloading) and runtime polymorphism (method overriding).\n- 2. Compile-Time\
    \ Polymorphism (Static Binding):\n    - Compile-time polymorphism occurs when\
    \ the method to be invoked is determined at compile time. This is achieved through\
    \ method overloading, where multiple methods with the same name but different\
    \ parameter lists coexist in the same class. The compiler decides which method\
    \ to call based on the number, order, and types of arguments provided during the\
    \ method call. Overloaded methods are resolved at compile time.\n- 3. Runtime\
    \ Polymorphism (Dynamic Binding):\n    - Runtime polymorphism occurs when the\
    \ method to be invoked is determined at runtime. This is achieved through method\
    \ overriding, where a subclass provides a specific implementation for a method\
    \ that is already defined in its superclass. The decision on which method to call\
    \ is made dynamically during program execution, based on the actual type of the\
    \ object. This flexibility allows for substitutability of objects and supports\
    \ the \"is-a\" relationship between classes.\n- 4. Method Overloading:\n    -\
    \ Method overloading is a form of compile-time polymorphism where multiple methods\
    \ in the same class have the same name but different parameter lists (different\
    \ types, number, or order of parameters). Overloaded methods share the same name,\
    \ making the code more readable and allowing developers to use a single method\
    \ name for related operations with different inputs.\n- 5. Method Overriding:\n\
    \    - Method overriding is a form of runtime polymorphism where a subclass provides\
    \ a specific implementation for a method that is already defined in its superclass.\
    \ The overridden method in the subclass must have the same method signature as\
    \ the method in the superclass. Overriding allows a subclass to provide a specialized\
    \ implementation for a method inherited from its superclass. This is essential\
    \ for achieving flexibility and adaptability in code design.\n\n- 6. \"IS-A\"\
    \ Relationship:\n    - Polymorphism in Java is closely tied to the \"IS-A\" relationship\
    \ between classes. If Class B inherits from Class A, an object of Class B is considered\
    \ to be an object of Class A. This relationship supports polymorphic behavior.\n\
    - 7. Interface Polymorphism:\n    - Interface polymorphism allows objects to be\
    \ treated as instances of their interface type. An object that implements an interface\
    \ can be referred to by its interface type, enabling code to work with objects\
    \ that share a common interface.\n- 8. Abstract Class Polymorphism:\n    - Abstract\
    \ classes can also participate in polymorphism. An abstract class can define abstract\
    \ methods that must be implemented by its subclasses, enabling a level of polymorphism\
    \ even without a direct interface.\n- 9. Dynamic Method Dispatch:\n    - Dynamic\
    \ method dispatch is the mechanism by which the correct version of an overridden\
    \ method is called at runtime. The actual type of the object is determined at\
    \ runtime, and the corresponding method in the subclass is invoked.\n- 10. Flexibility\
    \ and Extensibility:\n    - Polymorphism enhances the flexibility and extensibility\
    \ of code by allowing for the inclusion of new classes and methods without modifying\
    \ existing code. This supports the open/closed principle of software design.\n\
    - 11. Method Signature:\n    - Polymorphism is based on the method signature,\
    \ which includes the method's name, return type, and parameter types. The method\
    \ signature determines which method is called during both method overloading and\
    \ method overriding.\n- 12. Benefits of Polymorphism:\n    - Polymorphism promotes\
    \ code reusability, abstraction, and a more natural representation of real-world\
    \ relationships. It simplifies code maintenance and allows for the creation of\
    \ adaptable and extensible software systems.\n\nIn summary, polymorphism in Java\
    \ refers to the ability of a class to take on multiple forms. It provides flexibility\
    \ in code design, supports the \"IS-A\" relationship between classes, and allows\
    \ for code that is adaptable to different types of objects. Polymorphism is achieved\
    \ through method overloading (compile-time polymorphism) and method overriding\
    \ (runtime polymorphism).\n\nIn Java, polymorphism is a fundamental concept in\
    \ Object-Oriented Programming (OOP) that allows objects of different types to\
    \ be treated as objects of a common type. There are two types of polymorphism\
    \ in Java: compile-time polymorphism (method overloading) and runtime polymorphism\
    \ (method overriding). Polymorphism enables a single interface to represent different\
    \ types of objects and provides a way to achieve flexibility and extensibility\
    \ in the code. Here is an example that demonstrates both compile-time and runtime\
    \ polymorphism:\n\n```java\n// Example of Java Polymorphism\n// Base class Shape\
    \ {\n    // Method to calculate area (placeholder, to be overridden by subclasses)\n\
    \    public void calculateArea() {\n        System.out.println(\"Area calculation\
    \ not implemented for the base class.\");\n    }\n}\n\n// Subclass 1: Circle\n\
    class Circle extends Shape {\n    // Fields specific to Circle\n    double radius;\n\
    \    // Constructor for Circle\n    public Circle(double radius) {\n        this.radius\
    \ = radius;\n    }\n\n    // Overriding the calculateArea method for Circle\n\
    \    @Override\n    public void calculateArea() {\n        double area = Math.PI\
    \ * radius;\n        System.out.println(\"Area of Circle: \" + area);\n    }\n\
    }\n\n// Subclass 2: Rectangle\nclass Rectangle extends Shape {\n    // Fields\
    \ specific to Rectangle\n    double length;\n    double width;\n\n    // Constructor\
    \ for Rectangle\n    public Rectangle(double length, double width) {\n       \
    \ this.length = length;\n        this.width = width;\n    }\n\n    // Overriding\
    \ the calculateArea method for Rectangle\n    @Override\n    public void calculateArea()\
    \ {\n        double area = length * width;\n        System.out.println(\"Area\
    \ of Rectangle: \" + area);\n    }\n}\n\npublic class PolymorphismExample {\n\
    \    public static void main(String[] args) {\n        // Compile-time polymorphism\
    \ (method overloading)\n        printArea(5); // Calls printArea(int)\n      \
    \  printArea(3.5); // Calls printArea(double)\n\n        // Runtime polymorphism\
    \ (method overriding)\n        Shape circle = new Circle(4.0);\n        Shape\
    \ rectangle = new Rectangle(5.0, 3.0);\n\n        // Calls the overridden calculateArea\
    \ method based on the actual object type\n        calculateAndPrintArea(circle);\n\
    \        calculateAndPrintArea(rectangle);\n    }\n\n    public static void printArea(int\
    \ side) {\n        System.out.println(\"Area of Square: \" + (side * side));\n\
    \    }\n\n    public static void printArea(double side) {\n        System.out.println(\"\
    Area of Square (double): \" + (side * side));\n    }\n\n    public static void\
    \ calculateAndPrintArea(Shape shape) {\n        // Calls the overridden calculateArea\
    \ method based on the actual object type\n        shape.calculateArea();\n   \
    \ }\n}\n```\n"
  mdcn: "\n\n解释：\n\n- 1. Vehicle 类（父类）：\n    - `Vehicle` 类是一个包含 `brand` 和 `model`\
    \ 字段的父类，有一个用于初始化这些字段的构造函数，以及一个显示车辆信息的 `displayInfo` 方法。\n- 2. Car 类（子类）：\n   \
    \ - `Car` 类是通过 `extends` 关键字继承自 `Vehicle` 类的子类。它有一个汽车特有的额外字段 `year`，一个通过 `super(brand,\
    \ model)` 调用父类构造函数的构造函数，以及一个重写的 `displayInfo` 方法以包含汽车特有的信息。\n\n## 3. 继承关系：\n\n\
    - `Car` 类继承了 `Vehicle`类的字段和方法。这意味着 `Car` 对象除了具有特定的属性外，还拥有 `Vehicle` 的所有特征。\n\n\
    ## 4. 对象创建与方法调用：\n\n- 创建一个 `Car` 类对象，并对其调用 `displayInfo` 方法。执行 `Car` 类中被重写的方法。总之，Java\
    \ 继承允许子类继承父类的属性和方法，促进了代码复用并建立了类的层次结构。子类可以扩展父类的功能、重写方法并添加新的字段或方法。继承是面向对象编程（OOP）中的基本概念，对于构建灵活且模块化的软件系统起着关键作用。\n\
    \n## Java 多态\n\n在 Java 中，多态是面向对象编程（OOP）的一个基本概念，它允许不同类型的对象被视为共同基类型的对象。多态为代码设计和使用提供了灵活性适应性。\n\
    \n- 1. 定义：\n    - 多态是指单个实体（如方法或类）能够以多种形式存在。在 Java 中，有两种多态：编译时多态（方法重载）和运行时多态（方法重写）。\n\
    - 2. 编译时多态（静态绑定）：\n    - 当被调用的方法在编译时确定时，就会发生编译时多态。这是通过方法重载实现的，即在同一个类中共存在多个同名但参数列表不同的方法。编译器根据方法调用时提供的参数数量、顺序和类型来决定调用哪种方法。被重载的方法在编译时解析。\n\
    - 3. 运行时多态（动态绑定）：\n    - 当被调用的方法在运行时确定时，就会发生运行时多态。这是通过方法重写实现的，即子类为其父类中已经定义的方法提供了特定的实现。调用哪种方法的决定是在程序执行期间根据对象的实际类型动态的。这种灵活性允许对象的可替代性，并支持类之间的“是一个”（is-a）关系。\n\
    - 4. 方法重载：\n    - 方法重载是编译时多态的一种形式，同类中的多个方法名称相同但参数列表不同（参数类型、数量或顺序不同）。被重载的方法共享相同的名称，使代码更具读性，并允许开发者使用同一个方法名处理不同输入的相关操作。\n\
    - 5. 方法重写：\n    - 方法重写是运行时多态的一种形式，子类为其父类中已经定义的方法提供了特定的实现。子类中被重写的方法必须与父类中的方法具有相同的方法签名。重写允许子类为其继承自父类的方法提供专门的实现。这对于实现代码设计的灵活性和适应性至关重要。\n\
    \n- 6. “IS-A”关系：\n    - Java 中的多态与类之间的“是一个”关系紧密相关。如果类 B 继承自类 A，则类 B 的对象被认为是类 A\
    \ 的对象。这种关系支持了多态行为。\n- 7. 接口多态：\n    - 接口多态允许对象被视为其接口类型的实例。实现接口的对象可以通过其接口类型引用，使得代码能够处理共享共同接口的对象。\n\
    - 8. 抽象类多态：\n    - 抽象类也可以参与多态。抽象类可以定义必须由其子类实现的抽象方法，使得在没有直接接口的情况下也能实现某种程度的多态。\n\
    - 9. 动态方法分发：\n    - 动态方法分发是在运行时调用重写方法的正确版本的机制。对象的实际类型在运行时确定，并调用子类中对应的方法。\n- 10.\
    \ 灵活性与扩展性：\n    - 多态通过允许在不修改现有代码的情况下引入新类和方法，增强了代码的灵性和扩展性。这支持了软件设计的开闭原则。\n- 11.\
    \ 方法签名：\n    - 多态基于方法签名，签名包括方法名、返回类型和参数类型。方法签名决定了在方法重载和方法重写期间调用哪种方法。\n- 12. 多态的优势：\n\
    \    - 多态促进了代码复用、抽象以及对真实世界关系的更自然表示。它简化了代码维护，并允许创建适应性且可扩展的软件系统。\n\n总之， Java 中的多态是指类以多种形式存在的能力。它为代码设计提供了灵活性，支持类与类之间的“一个”关系，并允许代码能够适应不同类型的对象。多态通过方法重载（编译时多态）和方法重写（运行时多态）实现。\n\
    \n在 Java 中，多态是面向对象编程（OOP）的一个基本概念，允许不同类型的对象被视为共同类型的对象。Java 中有两种多态：编译时多态（方法重载）和运行时多态（方法重写）。多态允许单个接口表示不同类型的对象，并为实现代码的灵活性和扩展性提供了方法。以下是一个同时演示编译时多态和运行时多态的示例：\n\
    \n```java\n// Java 多态示例\n// 基类 Shape {\n    // 计算面积的方法（占位符，将由子类重写）\n    public\
    \ void calculateArea() {\n        System.out.println(\"Area calculation not implemented\
    \ for the base class.\");\n    }\n}\n\n// 子类 1: Circle\nclass Circle extends Shape\
    \ {\n    // Circle 特有的字段\n    double radius;\n    // Circle 的构造函数\n    public\
    \ Circle(double radius) {\n        this.radius = radius;\n    }\n\n    // 为 Circle\
    \ 重写 calculateArea 方法\n    @Override\n    public void calculateArea() {\n    \
    \    double area = Math.PI * radius;\n        System.out.println(\"Area of Circle:\
    \ \" + area);\n    }\n}\n\n// 子类 2: Rectangle\nclass Rectangle extends Shape {\n\
    \    // Rectangle 特有的字段\n    double length;\n    double width;\n\n    // Rectangle\
    \ 的构造函数\n    public Rectangle(double length, double width) {\n        this.length\
