  - "[PAGE 148]\n\n# Java Inheritance\n\nIn Java, inheritance is a fundamental concept\
    \ in object-oriented programming (OOP) that allows one class to inherit the properties\
    \ and behaviors (fields and methods) of another class.\n\n+   1. Definition:\n\
    \   - Inheritance is a mechanism that enables a new class (subclass or derived\
    \ class) to inherit attributes and behaviors from an existing class (superclass\
    \ or base class). The new class can extend or specialize the functionalities of\
    \ the existing class.\n\n+   2. Superclass and Subclass:\n   - The class from\
    \ which properties and behaviors are inherited is known as the superclass. The\
    \ new class that inherits from the superclass is called the subclass. The subclass\
    \ is said to \"extend\" or \"derive\" from the superclass.\n\n+   3. Code Reusability:\n\
    \   - Inheritance promotes code reusability by allowing the reuse of fields and\
    \ methods defined in the superclass. This reduces redundancy and supports the\
    \ principle of \"Don't Repeat Yourself\" (DRY).\n\n+   4. \"is-a\" Relationship:\n\
    \   - Inheritance models the \"is-a\" relationship between classes. If Class B\
    \ inherits from Class A, it can be said that \"B is a type of A.\" This relationship\
    \ enhances code clarity and reflects real-world relationships.\n\n+   5. Fields\
    \ Inheritance:\n   - Subclasses inherit fields (attributes) from the superclass.\
    \ This means that the subclass automatically has access to the fields of the superclass\
    \ without needing to redefine them.\n\n+   6. Methods Inheritance:\n   - Subclasses\
    \ inherit methods from the superclass. They can use the methods as they are, override\
    \ them to provide specialized implementations, or introduce new methods.\n\n+\
    \   7. Access Modifiers:\n   - Access modifiers (e.g., public, protected, private,\
    \ or package-private) influence the visibility of inherited members. For example,\
    \ a private field in the superclass is not directly accessible in the subclass."
  - '[PAGE 149]


    8. Overriding Methods:◆Subclasses can override (redefine) methods inherited from
    the superclass. Method overriding allows a subclass to provide its own implementation
    of a method while keeping the method signature of the same.


    9. Method Overloading:◆Overloading methods in a subclass (having multiple methods
    with the same name but different parameter lists) is not considered overriding.
    Overloading in the subclass does not replace or override the superclass methods.


    10. Inheriting Constructors:◆Constructors are not inherited, but they are invoked
    in the process of creating an object of the subclass. Subclasses can use the super()
    keyword to call a constructor from the superclass.


    11. Multiple Inheritance:◆Java supports single inheritance, meaning a class can
    inherit from only one subclass. This avoids the complexity and ambiguity associated
    with multiple inheritance.


    12. Abstract Classes and Interfaces:◆Abstract classes and interfaces in Java are
    used to define common structures for multiple classes. Abstract classes can provide
    a partial implementation, while interfaces define a contract for implementing
    classes. Both support inheritance.


    13. Final Classes and Methods:◆The final keyword can be used to prevent a class
    from being extended (final class) or a method from being overridden (final method).


    14. Polymorphism:◆Inheritance is closely related to polymorphism, another OOP
    concept. Polymorphism allows objects of different classes to be treated as objects
    of a base type, enabling flexibility in code design and usage.


    15. Object-Oriented Design:◆Inheritance is a key component of object-oriented
    design. It allows for the creation of hierarchies of related classes, making it
    easier to model and understand complex systems.


    In summary, Java inheritance is a mechanism that allows a new class to inherit
    properties and behaviors from an existing class, promoting code reusability, modeling
    relationships, and supporting the principles of OOP. The "is-a" relationship,
    code clarity, and polymorphism are among the benefits of inheritance in Java.'
