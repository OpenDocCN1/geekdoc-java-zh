    Sum: \" + sum);\n\n        // 调用无参数并有返回值的方法\n        double result = calculateSquareRoot();\n\
    \        System.out.println(\"Square root: \" + result);\n\n        // 调用带参数且无返回值的方法\n\
    \        printMessage(\"Hello, Java Methods!\");\n\n        // 调用无参数且无返回值的方法\n\
    \        displayGreeting();\n    }\n\n    // 带参数并有返回值的方法\n    public static int\
    \ addNumbers(int a, int b) {\n        return a + b;\n    }\n\n    // 无参数并有返回值的方法\n\
    \    static double calculateSquareRoot() {\n        double number = 25.0;\n  \
