    # Java Break/Continue


    In Java, the break and continue statements are control flow statements used within
    loops to alter the normal flow of execution.


    Java break Statement: 1. Loop Termination: ●The break statement is used to terminate
    the execution of a loop prematurely. When encountered within a loop, the break
    statement immediately exits the loop, and control is transferred to the statement
    following the loop.


    +   2. Early Exit: ●break is often used within loops to exit the loop early on
    a certain condition. Once the break statement is encountered, any remaining iterations
    of the loop are skipped, and the program continues with the statement following
    the loop.


    +   3. Switch Statements: ●In addition to loops, the break statement is used within
    switch statements to exit the switch block. It is commonly placed at the end of
    each case block to prevent fall-through to subsequent case blocks.


    +   4. Loop Nesting: ●When dealing with nested loops, a break statement inside
    an inner loop exits only that loop, not the outer loop(s). If a break statement
    is used within the outer loop, it exits the outer loop.


    Java continue Statement: 1. Skip Iteration: ●The continue statement is used to
    skip the rest of the code inside the current iteration of a loop and proceed to
    the next iteration. It does not exit the loop; rather, it skips the remaining
    statements within the loop body for the current iteration.'
