    # Java Data Types


    In Java, data types are a fundamental concept that defines the nature of values
    a variable can hold. Each variable in Java must have a declared data type, which
    specifies the kind of data it can store.


    +   1. Primitive Data Types: Java has eight primitive data types:

    Integer Types: byte, short, int, and long for whole numbers (integer values).

    Floating-Point Types: float and double for numbers with a fractional part.

    Character Type: char for individual characters (e.g., digits).

    Boolean Type: boolean for representing true or false values.


    +   2. Size and Range: Each primitive data type has a specific size in bits and
    a defined range of values it can hold. For example, int is typically 32 bits,
    and its range is from -2^31 to 2^31 - 1.


    +   3. Reference Types: Reference data types in Java include classes, interfaces,
    arrays, and enumerations. Unlike primitive types, these data types don''t hold
    the actual data but reference objects in memory.


    +   4. Strings: The String class in Java is used to represent sequences of characters.
    Strings are not primitive data types but are commonly used and treated as due
    to their importance in programming.


    +   5. Arrays: Arrays are a reference data type used to store a collection of
    elements of the same type. They can be one-dimensional, multi-dimensional, or
    jagged.


    +   6. Type Inference (Java 10 and later): Starting from Java 10, local variable
    type inference allows the use of the var keyword to declare variables without
    explicitly specifying the data type. The compiler infers the type based on the
    assigned value.'
- md: "\n7. Automatic Type Conversion (Casting):\n- Java supports automatic type conversion\
