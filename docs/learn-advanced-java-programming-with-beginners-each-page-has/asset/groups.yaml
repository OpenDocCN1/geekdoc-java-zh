    \ 在移除元素 \"Banana\" 之后，再次显示 ArrayList。\n\n总结，Iterator 接口提供了一种遍历集合元素的标准化方法，并在 Java\
    \ 集合框架（Collections Framework）中被广泛使用。它提供了诸如 `hasNext`（检查是否有更多元素）、`next`（获取下一个元素）以及在迭代期间移除元素等方法。当你想要遍历集合元素而不暴露集合的内部结构时，Iterator\
    \ 特别有用。它们为遍历不同类型的集合提供了整洁且一致的接口。\n\n## 包装类 (Wrapper Classes)\n\n在 Java 中，包装类是提供了一种将基本数据类型（如\
    \ int、char、boolean 等）作为对象使用的类。每个基本数据类型都有一个对应的包装类，它们属于 `java.lang` 包。\n\n- 1. 基本数据类型：\n\
    \  - Java 有八种基本数据类型：byte, short, int, long, float, double, char 和 boolean。这些数据类型不是对象，且不继承自任何公共基类。\n\
    \n- 2. 对象表示：\n  - 包装类作为一种将基本数据类型表示为对象的方法。它们提供了将基本值转换为对象以及反之的机制。\n\n- 3. 命名规范：\n\
    \  - 包装类的命名规范是使用基本数据类型的名称，并将首字母大写。例如，int 的包装类是 `Integer`，char 的包装类是 `Character`，依此类推。\n\
    \n- 4. 继承 Object 类：\n  - 所有包装类都继承自 `Object` 类，它是 Java 类层次结构的根类。这意味着包装类可以访问 `Object`\
    \ 类中定义的方法。\n\n- 5. 不变性：\n  - 包装类通常是不可变的，这意味着在实例化后，它们的值就不能更改。任何看似修改包装对象值的操作实际上都是创建了一个新对象。\n\
    \n- 6. 自动装箱和拆箱 (Autoboxing and Unboxing)：\n  - Java 提供了基本数据类型与其对应的包装类之间的自动转换，这被称为自动装箱（基本到对象的转换）和拆箱（对象到基本类型的转换）。这允许基本类型和对象在\
    \ Java 代码中进行无缝集成。\n\n- 7. 工具方法：\n  - 包装类通常提供用于处理基本值的工具方法。例如，`Integer` 类包含了用于解析字符串、在不同数进制之间转换以及执行算术操作的方法。\n\
    \n- 8. 在集合中的用法：\n  - 包装类常用于集合以及其他对象的 Java API。集合（如 `ArrayList` 或 `HashSet`）只能存储对象，因此使用包装类允许将基本值包含在这些集合中。\n\
    \n- 9. 空值 (Null Values)：\n  - 包装类还可以表示空值（null），而基本数据类型是无法做到的。这在变量需要表示值缺失的场景中特别有用。\n\
