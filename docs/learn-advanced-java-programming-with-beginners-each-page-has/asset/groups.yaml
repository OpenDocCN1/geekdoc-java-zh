    # Java Modifiers


    In Java, modifiers are keywords that are used to control the access, visibility,
    and behavior of classes, methods, variables, and other program elements.


    +   1. Access Modifiers:


    +   * Access modifiers control the visibility of classes, methods, and variables.
    There are four main access modifiers in Java:

    * public: The class or member is accessible from any other class. protected: The
    class or member is accessible within its own package and subclasses.

    * default(package-private): The class or member is accessible only within its
    own package.

    * private: The class or member is accessible only within its own class.


    +   2. Non-access Modifiers:


    +   * Non-access modifiers provide additional information about the behavior of
    classes, methods, and variables. Common non-access modifiers include:

    * final: The class, method, or variable cannot be subclassed or overridden.

    * abstract: The class or method is incomplete and must be implemented by subclasses
    or concrete classes.

    * static: The variable or method belongs to the class rather than an instance
    of the class.

    * transient: The variable should not be serialized when the object is persisted.

    * volatile: The variable is subject to thread synchronization.


    +   3. final Modifier:


    The final modifier is used to indicate that a class cannot be subclassed, a method
    cannot be overridden, or a variable cannot be reassigned after initialization.


    +   4. abstract Modifier:


    The abstract modifier is used to declare abstract classes and methods. Abstract
    classes cannot be instantiated, and abstract methods must be implemented by concrete
    subclasses.


    +   5. static Modifier:


    The static modifier is used to declare class-level members, such as variables
    and methods. Static members belong to the class itself rather than instances of
    the class.'
