    - 3. 数据成员：类属性也被称为数据成员。它们持有与对象相关的数据，并决定了类实例的属性。\n- 4. 声明：属性声明在类体内，但在任何方法之外。它们通常带有访问修饰符（例如\
    \ `public`、`private`、`protected` 或包私有）来控制它们的可见性。\n- 5. 可访问性：访问修饰符定义了类属性的可见性和可访问性。例如，使用\
