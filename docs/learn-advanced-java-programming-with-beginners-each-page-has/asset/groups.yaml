    \ 和 getAge）提供了对私有属性的访问。\n- Setter 方法（setName 和 setAge）允许外部代码修改私有属性，但它们通常包含验证或其他逻辑以控制修改。\n\
    \n## 3. 构造函数：\n\n- 构造函数用于在创建对象时初始化实例变量。\n\n## 4. 封装：\n\n- EncapsulationExample\
    \ 对象的内部状态（name 和 age）封装在类内部。\n- 外部代码通过定义良好的公共方法与对象交互，提供了对内部数据的一种抽象层次和控制力。\n\n\
    总而言之，Java 中的封装涉及隐藏对象的实现细节，并暴露一个定义良好的接口与对象进行交互。这有助于控制对象内部状态的访问，提供数据验证的机制，并提高代码的可维护性。封装是\
    \ OOP 的核心原则之一。\n\n## Java 包 / API\n\n在 Java 中，包和 API（应用程序编程接口）是基础性的概念，它们有助于组织代码、促进代码重用并方便开发人员之间的协作。\n\
    \n- 包（Packages）：\n    - 定义：Java 中的包是将相关的类和接口组织到单个命名空间中的方法。它有助于防止命名冲突，并为组织代码提供模块化的结构。\n\
    \    - 规范：包的命名使用分层命名规范，通常基于组织的反向域名。如果一家公司拥有 \"example.com\" 域名，他们的包名可能以 com.example\
    \ 开头。\n    - 可见性：相同包内的类可以互相访问；包外部必须使用适当的访问修饰符（例如 public、protected 或默认）来访问包内的类。\n\
    \    - 封装：包通过为类和成员提供边界，可以根据包的可见性进行控制，从而有助于封装。\n    - 导入语句（Import Statements）：要使用来自另一个包的类，Java\
    \ 代码通常包含 import 语句。import 语句允许开发者使用类的名称而不是完全限定名来引用类。\n    - 标准包：Java 自带了一系列标准包（例如\
    \ java.lang, java.util），提供了常用功能。这些包对所有 Java 程序都是自动可用的。\n\n2. APIs（应用程序编程接口）：\n\
    \n- 定义：Java 中的 API 指一组类、接口和方法，它们提供了一种与库或框架进行交互的方法。\n- 重用与抽象：API 提供了抽象层次，允许开发人员在不需要理解实现细节的情况下使用预构建的功能。\n\
    - 文档：良好的 API 随带详尽的文档，说明如何使用这些类和方法。文档包含了关于参数、返回值和异常的信息。\n- 标准 API：Java 标准版（SE）提供了一套用于常用任务的标准\
    \ API，如处理集合（java.util）、网络（java.net）、输入输出（java.io）等。这些标准 API 是 Java 开发包（JDK）的一部分。\n\
    - 第三方 API：开发者也可以创建并共享自己的 API；第三方库和框架提供了特定功能的 API。常见的例子包括 JSON 解析、日志记录和 Web 框架。\n\
    - 包结构：API 通常组织在包中以提供模块化有序的结构。API 用户根据需要导入特定的包或类。\n- 接口设计：API 通常使用接口来定义类必须遵守的约。这实现了多态并允许不同的实现之间进行切换。\n\
    - 版本控制：API 可能会进行版本控制，以在引入新功能或改进的同时确保向后兼容。版本控制有助于在允许演进的同时保持稳定性。\n\n3. JavaDocs：\n\
    \n- 文档格式：JavaDocs 是一种用于记录 Java 代码（特别是 API）的文档格式。它使用源码中的特殊注释，经过处理后生成 HTML 文档。\n\
    - 生成的文档：JavaDocs 为 API 提供了一种标准且一致的记录方式。生成的文档包含了类、方法、参数、返回值和异常的信息。\n- 可访问性：JavaDocs\
    \ 让开发者能够轻松了解如何使用特定的类或方法，而无需查看源码。它作为使用 API 的参考指南。\n- IDE 集成：集成开发环境（IDE）通常支持 JavaDocs，允许开发者在编码时快速访问\
    \ API 文档。\n\n总而言之，Java 中的包提供了一种组织和构建类的方法，防止了命名冲突并有助于封装。而 API 定义了一组供开发者使用的类和方法暴露功能，促进了代码重用和抽象。良好的文档（如\
    \ JavaDocs）对于帮助开发者有效地使用 API 起着至关重要的作用。\n\n"
