    \n# Java 内部类\n\n在 Java 中，内部类是定义在另一个类中的类。\n\n- 1. 定义：\n\n内部类是声明在另一个类内部的类。它是逻辑上对类进行分组的一种方式，可以增加代码的封装性。\n\
