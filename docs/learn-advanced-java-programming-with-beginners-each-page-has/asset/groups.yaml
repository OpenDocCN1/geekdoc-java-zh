    # Recursion\n\nRecursion is a programming concept in which a method calls itself\
    \ directly or indirectly to solve a problem.\n\n- 1. Definition:\n- Recursion\
    \ is a process where a method solves a problem by calling itself, either directly\
    \ or indirectly, with a smaller or simpler instance of the same problem.\n\n-\
    \ 2. Base Case:\n- Every recursive algorithm must have a base case, which represents\
    \ the simplest form of the problem that can be solved without further recursion.\
    \ The base case prevents the recursion from continuing indefinitely.\n\n- 3. Breakdown\
    \ of the Problem:\n- In a recursive solution, the original problem is broken down\
    \ into smaller subproblems. Each recursive call addresses a smaller instance of\
    \ the problem, moving towards the base case.\n\n- 4. Stacking of Calls:\n- Recursive\
    \ calls create a stack of method calls, where each method call is pushed onto\
    \ the stack. As each recursive call completes, it is popped off the stack, and\
    \ the program continues with the next method call.\n\n- 5. Execution Flow:\n-\
    \ The execution flow of a recursive solution involves repeatedly subdividing the\
    \ problem until reaching the base case. Once the base case is reached, the results\
    \ are combined to solve the original problem.\n\n- 6. Memory Usage:\n- Recursion\
    \ uses the call stack to keep track of method calls. Each recursive call consumes\
    \ memory on the stack. Excessive recursion may lead to a stack overflow, especially\
    \ if there is no proper termination condition (base case).\n\n- 7. Direct and\
    \ Indirect Recursion:\n- In direct recursion, a method calls itself directly.\
    \ In indirect recursion, a chain of method calls eventually leads back to the\
    \ original method, possibly involving multiple methods in the process.\n\n- 8.\
    \ Mathematical Models:\n- Recursion is often used to implement mathematical models\
    \ and algorithms that exhibit self-repeating patterns. Examples include the Fibonacci\
    \ sequence, factorials, and solving mathematical equations.\n\n- 9. Recursive\
    \ vs. Iterative Solutions:\n- Recursion is an alternative to iteration (loops)\
    \ for solving problems. Both approaches can be used to achieve the same result,\
    \ but certain problems are more naturally expressed using recursion.\n\n- 10.\
    \ Function Calls as Subproblems:\n- In recursive solutions, each function call\
    \ effectively represents a subproblem. The result of the recursive call contributes\
    \ to solving the larger problem.\n\n- 11. Readability and Code Structure:\n- Recursion\
    \ can lead to concise and elegant code, expressing the solution in a way that\
    \ mirrors the problem's structure. However, it requires careful design to ensure\
    \ termination and efficiency.\n\n- 12. Examples of Recursive Problems:\n- Recursive\
    \ solutions are commonly employed in problems involving tree structures, searching,\
    \ sorting, and mathematical computations. Examples include a directory structure,\
    \ quicksort, mergesort, and solving problems on binary trees. In summary, recursion\
    \ is a programming technique where a method calls itself to solve a problem by\
    \ breaking it down into smaller subproblems. It involves a base case, recursive\
    \ calls, and a termination condition to prevent infinite recursion. Recursive\
    \ solutions can be elegant and expressive, but proper design and consideration\
    \ of efficiency are essential.\n\nRecursion is a programming concept where a method\
    \ calls itself to solve a smaller instance of a problem. In Java, recursion is\
    \ often used to break down complex problems into simpler sub-problems. Here's\
    \ an example of recursion in Java:\n\n```java\npublic class RecursionExample {\n\
    \    public static void main(String[] args) {\n        // Example of recursion:\
    \ Calculating factorial n\n        int n = 5; \n        int factorialResult =\
    \ calculateFactorial(n);\n        System.out.println(\"Factorial of \" + n + \"\
    \ is: \" + factorialResult);\n    }\n\n    // Recursive method to calculate factorial\n\
    \    static int calculateFactorial(int num) {\n        if (num == 0) {\n     \
    \       return 1;\n        } else {\n            // Recursive case: num - 1\n\
    \            return num * calculateFactorial(num - 1);\n        }\n    }\n}\n\
    ```\n\nExplanation:\n\n- 1. Recursive Method (calculateFactorial): The calculateFactorial\
    \ method is designed to calculate the factorial of a number.\n- 2. Main Method:\
    \ In the main method, an example is shown where the factorial of 5 is calculated.\n\
    - 3. How Recursion Works: The initial call to calculateFactorial(5) triggers subsequent\
    \ calls with decreasing values until the base case is reached (calculateFactorial(0)).\n\
    - Each recursive call contributes to the final result, and the values are multiplied\
    \ on the way up the stack.\n- 4. Important Aspects of Recursion: A base case is\
    \ crucial to prevent infinite recursion and ensure the problem becomes simple\
    \ enough to solve.\n\n# OOP\n\nObject-Oriented Programming (OOP) is a programming\
    \ paradigm that uses objects, which are instances of classes, to organize and\
    \ structure code.\n\n- 1. Objects:\n- In OOP, everything is treated as an object.\
    \ An object is an instance of a class and represents a real-world entity with\
    \ attributes (data) and behaviors (methods).\n\n- 2. Classes:\n- Class is a blueprint\
    \ or template for creating objects. It defines the properties (attributes) and\
    \ behaviors (methods) that its objects will have.\n\n- 3. Encapsulation:\n- Encapsulation\
    \ is the bundling of data (attributes) and the methods that operate on the data\
    \ within a single unit, i.e., a class. This helps in hiding the internal details\
    \ of an object and exposing only what is necessary.\n\n- 4. Abstraction:\n- Abstraction\
    \ is the process of simplifying complex systems by modeling classes based on essential\
    \ properties and behaviors. It allows programmers to focus on what an object does\
    \ without worrying about how it achieves its functionality.\n\n- 5. Inheritance:\n\
    - Inheritance is a mechanism that allows a class (subclass or derived class) to\
    \ inherit properties and behaviors from another class (superclass or base class).\
    \ It promotes code reuse and establishes an \"is-a\" relationship between classes.\n\
    \n- 6. Polymorphism:\n- Polymorphism allows objects of different classes to be\
    \ treated as objects of a common base class. It enables flexibility and extensibility\
    \ in the code, allowing methods to be used with objects of different types.\n"
  mdcn: "\n在 Java 中，方法重载允许你在同一个类中定义多个同名但参数列表不同的方法。这些方法可以具有不同数量或类型的参数。以下是 Java 方法重载的示例：\n\
    \n```java\npublic class MethodOverloadingExample {\n    public static void main(String[]\
    \ args) {\n        // 调用重载方法\n        displayInfo(\"Alice\");\n        displayInfo(\"\
    Alice\", 25);\n        displayInfo(\"Bob\", \"Engineering\");\n    }\n}\n```\n\
    \n```java\n// 带一个参数的方法\npublic static void displayInfo(String name) {\n    System.out.println(\"\
    Name: \" + name);\n}\n```\n\n```java\n// 带两个参数的重载方法\npublic static void displayInfo(String\
    \ name, int age) {\n    System.out.println(\"Name: \" + name + \", Age: \" + age);\n\
    }\n```\n\n```java\n// 另一个不同参数类型的重载方法 \npublic static void displayInfo(String name,\
    \ String occupation) {\n    System.out.println(\"Name: \" + name + \", Occupation:\
    \ \" + occupation);\n}\n```\n\n解释：\n\n- 1. 方法重载：在示例中，`displayInfo` 方法被重载了三次。第一个版本接受单个参数（String\
    \ name），第二个版本接受两个参数（String name 和 int age），第三个版本接受两个参数（String name 和 String occupation）。\n\
    \n- 2. 调用重载方法：在 `main` 方法中，使用不同的参数组合调用了重载的 `displayInfo` 方法。\n\n- 3. 编译解析：在编译期间，Java\
    \ 编译器根据方法调用中提供的参数数量和类型来决定调用哪个版本的方法。\n\n- 4. 多态：方法重载是 Java 中多态的一种形式，同一个方法名可以根据调用的上下文表示不同的行为。\n\
    \n方法重载对于创建更具可读性和直观的代码非常有益。它允许你对同一逻辑操作的不同变使用相同的方法名。需要注意的是，方法重载是在编译时确定的，并根据方法签名（参数类型和数量）选择适当的方法。\n\
    \n# 递归\n\n递归是一种编程概念，方法通过直接或间接地调用调用自己来解决问题。\n\n- 1. 定义：\n- 递归是一个过程，方法通过直接或间接地调用自身，并处理相同问题的更小或更简单的实例来解决问题。\n\
    \n- 2. 基准情况（Base Case）：\n- 每个递归算法必须有一个基准情况，它代表了无需进一步递归即可解决的最简单形式。基准情况防止递归无限持续。\n\
    \n- 3. 问题拆解：\n- 在递归解决方案中，原始问题被拆分为更小的子问题。每个递归调用都处理问题的更小实例，并向基准情况移动。\n\n- 4. 调用堆栈：\n\
    - 递归调用会创建一个方法调用栈，其中每个方法调用都会推入栈中。当每个递归调用完成时，它会从栈中弹出，程序继续执行下一次方法调用。\n\n- 5. 执行流：\n\
    - 递归解决方案的执行流涉及反复划分问题，直到达到基准情况。一旦达到基准情况，就会将结果组合以解决原始问题。\n\n- 6. 内存占用：\n- 递归使用调用栈来跟踪方法调用。每个递归调用都会消耗栈上的内存。过度递归可能导致栈溢出（stack\
    \ overflow），特别是当没有适当终止条件（基准情况）时。\n\n- 7. 直接递归与间接递归：\n- 在直接递归中，方法直接调用自己。在间接递归中，方法调用链最终会回到原始方法，在此过程中可能涉及多个方法。\n\
    \n- 8. 数学模型：\n- 递归通常用于实现呈现自重复模式的数学模型和算法。示例包括斐波那契数列、阶乘和求解数学方程。\n\n- 9. 递归与迭代解决方案对比：\n\
    - 递归是解决问题的迭代（循环）的替代方案。这两种方法都可以用于实现相同的结果，但某些问题使用递归表达会更自然。\n\n- 10. 作为子问题的函数调用：\n\
    - 在递归解决方案中，每个函数调用从上上都代表代表一个子问题。递归调用的结果对解决更大的问题做出贡献。\n\n- 11. 可读性与代码结构：\n- 递归可以产生简洁且优雅的代码，以镜像问题结构的方式表达解决方案。然而，它需要仔细的设计以确保终止和有效性。\n\
    \n- 12. 递归问题示例：\n- 递归解决方案通常用于涉及树形结构、搜索、排序和数学计算的问题。示例包括目录结构、快速排序、合并排序以及二二树上的问题求解。总结来说，递归是一种编程技术，方法通过调用自己将问题拆分为更小的子问题来解决。它涉及基准情况、递归调用和终止条件，以防止无限递归。递归解决方案可以是优雅且富有表现力的，但适当的设计和对效率的考虑至关重要。\n\
    \n递归是一种编程概念，方法通过调用自己来解决问题的较实例。在 Java 中，递归通常用于将复杂问题分解为更简单的子问题。以下是 Java 中递归的示例：\n\
    \n```java\npublic class RecursionExample {\n    public static void main(String[]\
    \ args) {\n        // 递归示例：计算 n 的阶乘\n        int n = 5; \n        int factorialResult\
    \ = calculateFactorial(n);\n        System.out.println(\"Factorial of \" + n +\
    \ \" is: \" + factorialResult);\n    }\n\n    // 计算阶乘的递归方法\n    static int calculateFactorial(int\
    \ num) {\n        if (num == 0) {\n            return 1;\n        } else {\n \
    \           // 递归情况：num - 1\n            return num * calculateFactorial(num -\
    \ 1);\n        }\n    }\n}\n```\n\n解释：\n\n- 1. 递归方法 (calculateFactorial)：`calculateFactorial`\
    \ 方法设计用于计算数字的阶乘。\n- 2. Main 方法：在 `main` 方法中展示了一个计算 5 的阶乘的示例。\n- 3. 递归如何工作：对 `calculateFactorial(5)`\
    \ 的初始调用触发了后续递减值的调用，直到达到基准情况（calculateFactorial(0)`）。\n- 每个递归调用都对最终结果做出贡献，值在栈向上返回的过程中进行相乘。\n\
    - 4. 递归的重要方面：基准情况对于防止无限递归并确保问题简单到可以解决至关重要。\n\n# OOP\n\n面向对象编程（OOP）使用对象（类的实例）来组织和构建代码的编程范式。\n\
    \n- 1. 对象：\n- 在 OOP 中，一切都被视为对象。对象是类的实例，代表具有属性（数据）和行为（方法）的现实世界实体。\n\n- 2. 类：\n\
    - 类是创建对象的蓝图或模板。它定义了对象将拥有的属性（属性）和行为（方法）。\n\n- 3. 封装：\n- 封装是将数据（属性）和操作数据的方法封装在单个单元（即一个类）中。这有助于隐藏对象的内部细节，并只暴露必要的内容。\n\
    \n- 4. 抽象：\n- 抽象是通过根据基本属性和行为对类建模来简化复杂系统的过程。它允许程序员关注对象做什么，而无需担心它是如何实现功能的。\n\n-\
    \ 5. 继承：\n- 继承是一种机制，允许一个类（子类或派生类）从另一个类（父类或基类）继承属性和行为。它促进了代码复用并在类之间建立了“是一种”（is-a）的关系。\n\
    \n- 6. 多态：\n- 多态允许不同类的对象被视为公共基类的对象。它为代码提供了灵活性和扩展性，允许方法用于不同类型的对象。\n"
