  - '[PAGE 113]


    # JAVA CLAASSEs/OBJJeCts


    In Java, classes and objects are fundamental concepts in object- oriented programming
    (OOP).


    +   1. Classes:


    +   A class is a blueprint or template for creating objects in Java. It defines
    a set of attributes (fields or properties) and behaviors (methods) that characterize
    objects of that class.


    +   2. Objects:


    +   An object is an instance of a class. It represents a real-world entity with
    characteristics and behaviors defined by the class. Objects are created based
    on the structure provided by the class.


    +   3. Attributes (Fields/Properties):


    +   Attributes are the data members of a class, also known as fields or properties.
    They represent the state or characteristics of objects. Each object created from
    a class has its own set of attribute values.


    +   4. Behaviors (Methods):


    +   Behaviors are the methods or functions defined within a class. They represent
    the actions or operations that objects of the class can perform. Methods can interact
    with the object''s attributes.


    +   5. Encapsulation:


    +   Encapsulation is one of the core principles of OOP. It involves bundling the
    data (attributes) and the methods that operate on the data within a single unit
    (a class). This helps hide the internal implementation details and exposes only
    what is necessary.


    +   6. Constructor:


    +   A constructor is a special method in a class that is used to initialize the
    object''s state when it is created. Constructors have the same name as the class
    and do not have a return type.'
  - '[PAGE 114]


    # 7. Instantiation:


    ●Instantiation is the process of creating an object from a class. It involves
    allocating memory for the object, initializing its attributes (using the constructor),
    and obtaining a reference to the newly created object.


    # 8. Class Members:


    ●Class members include both static and instance members. Static members belong
    to the class itself and are shared among all instances. Instance members are specific
    to individual objects.


    # 9. Inheritance:


    ●Inheritance is another OOP concept that allows a class (subclass child class)
    to inherit attributes and behaviors from another class (superclass or parent class).
    This promotes code reuse and supports the "is-a" relationship.


    # 10. Polymorphism:


    ●Polymorphism allows objects of different classes to be treated as objects of
    a common base class. This involves method overriding and dynamic method dispatch,
    enabling flexibility in the use of objects.


    # 11. Abstraction:


    ●Abstraction is the process of simplifying complex systems by modeling classes
    based on relevant characteristics and ignoring unnecessary details. It focuses
    on what an object does rather than how it achieves its functionality.


    # 12. Modularity:


    ●OOP promotes modularity by organizing code into classes, making it easier to
    understand, maintain, and extend. Each class encapsulates a specific aspect of
    the overall functionality.


    In summary, classes and objects in Java form the foundation of object-oriented
    programming. Classes define the blueprint for creating objects, and objects represent
    instances of those classes with specific attributes and behaviors. These concepts
    provide a structured and modular approach to designing and organizing code.'
