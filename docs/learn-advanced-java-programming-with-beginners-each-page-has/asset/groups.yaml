    this safety. Casting should be done carefully to avoid runtime errors and unexpected
    behavior. The compiler checks the compatibility of types during the compilation
    process.


    +   7. Type Compatibility:

    Casting is only possible between compatible types. For instance, you can cast
    between numeric types, but you cannot cast between unrelated types, such as trying
    to cast a String to an int.


