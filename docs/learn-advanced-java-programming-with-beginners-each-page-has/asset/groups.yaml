    \n# Java 注释\n\n在 Java 中，注释是添加到源代码中的不可执行语句，用于提供解释、文档说明或备注。Java 编译器会忽略注释，不会影响程序的功能。它们是开发者使代码更易读、更易理解的手段。以下是\
    \ Java 注释的解释：\n\n- 1. 单行注释：\n  - 单行注释以双斜杠 `//` 开始。同一行中 `//` 之后的任何内容都被视为注释，不会被编译器执行。单行注释适用于单行代码内的简要解释。\n\
    \n- 2. 多行注释：\n  - 多行注释被包含在 `/*` 和 `*/` 之间。这些定界符之间跨多行的任何内容都被视为注释。多行注释适用于提供更详细的解释、记录代码段或临时排除代码块。\n\
    \n- 3. Javadoc 注释：\n  - Javadoc 注释是一种用于文档目的特定注释类型。它们以 `/**` 开始，以 `*/` 结束。Javadoc\
