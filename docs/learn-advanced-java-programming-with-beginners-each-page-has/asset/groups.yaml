    \n- 6. Displaying the Updated ArrayList After Removal:\n- The ArrayList is displayed\
    \ again after removing the element \"Banana.\"\n\nIn summary, the Iterator interface\
    \ provides a standardized way to iterate over the elements of a collection, and\
    \ it is widely used in Java's Collections Framework. It offers methods like hasNext\
    \ to check if there are more elements, next to retrieve the next element, and\
    \ remove elements during iteration. Iterators are particularly useful when you\
    \ want to traverse the elements of a collection without exposing the internal\
    \ structure of the collection. They provide a clean and consistent interface for\
    \ iterating over different types of collections.\n\n## Wrapper Classes\n\nIn Java,\
    \ wrapper classes are classes that provide a way to use primitive data types (such\
    \ as int, char, boolean, etc.) as objects. Each primitive data type has a corresponding\
    \ wrapper class, which is part of the java.lang package.\n\n- 1. Primitive Data\
    \ Types:\n  - Java has eight primitive data types: byte, short, int, long, float,\
    \ double, char, and boolean. These data types are not objects and do not inherit\
    \ from a common class.\n\n- 2. Object Representation:\n  - Wrapper classes serve\
    \ as a way to represent primitive data types as objects. They provide a mechanism\
    \ for converting primitive values into objects and vice versa.\n\n- 3. Naming\
    \ Convention:\n  - The naming convention for wrapper classes is to use the name\
    \ of the primitive data type with the first letter capitalized. For example, the\
    \ wrapper class for int is Integer, for char is Character, and so on.\n\n- 4.\
    \ Inheritance from Object Class:\n  - All wrapper classes inherit from the Object\
    \ class, which is the root class of the Java class hierarchy. This means that\
    \ wrapper classes have access to the methods defined in the Object class.\n\n\
    - 5. Immutability:\n  - Wrapper classes are typically immutable, meaning that\
    \ their values cannot be changed after they are instantiated. Any operation that\
    \ appears to modify the value of a wrapper object actually creates a new object.\n\
    \n- 6. Autoboxing and Unboxing:\n  - Java provides automatic conversion between\
    \ primitive data types and their corresponding wrapper classes, known as autoboxing\
    \ (conversion of primitive to object) and unboxing (conversion of object to primitive).\
    \ This allows for seamless integration of primitive types and objects in Java\
    \ code.\n\n- 7. Utility Methods:\n  - Wrapper classes often provide utility methods\
    \ for working with primitive values. For example, the Integer class includes methods\
    \ for parsing strings, converting between number bases, and performing arithmetic\
    \ operations.\n\n- 8. Use in Collections:\n  - Wrapper classes are commonly used\
    \ in collections and other Java APIs that require objects. Collections, such as\
    \ ArrayList or HashSet, can only store objects, so using wrapper classes allows\
    \ primitive values to be included in these collections.\n\n- 9. Null Values:\n\
    \  - Wrapper classes can also represent null values, which is not possible with\
    \ primitive data types. This is particularly useful in scenarios where a variable\
    \ needs to indicate the absence of a value.\n\n- 10. Type Conversion:\n  - Wrapper\
    \ classes provide methods for converting values between different data types.\
    \ For example, the Integer class has methods like intValue(), doubleValue(), and\
    \ others for converting to different numeric types.\n\n- 11. Generic Classes:\n\
    \  - Wrapper classes are often used in the context of generics. Generics require\
    \ objects, and using wrapper classes allows primitive data types to be used in\
    \ generic classes and methods.\n\nIn summary, wrapper classes in Java serve as\
    \ a bridge between primitive data types and objects. They allow primitive values\
    \ to be used where objects are required, enable type conversion, and provide utility\
    \ methods for working with the corresponding data types. Wrapper classes play\
    \ a crucial role in making Java's type system more flexible and consistent.\n\n\
    In Java, wrapper classes are a set of classes that provide an object representation\
    \ of primitive data types. The wrapper classes are part of the java.lang package\
