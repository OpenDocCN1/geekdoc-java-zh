    # Java RegEx


    Regular expressions, often abbreviated as Reg or RegExp, are a powerful tool in
    Java and other programming languages for pattern matching and manipulation of
    strings.


    +   1. Definition:

    •A regular expression is a sequence of characters that forms a search pattern.
    It is used for matching strings, searching for patterns, and replacing matched
    patterns with other strings.


    +   2. java.util.regex Package:

    •In Java, regular expressions are supported through the java.util.regex package.
    This package provides the Pattern class for compiling regular expressions and
    the Matcher class for performing matching operations on strings using the compiled
    pattern.


    +   3. Metacharacters:

    •Regular expressions consist of normal characters as well as special characters
    called metacharacters. Metacharacters have a special meaning in the context of
    regular expressions. Examples of metacharacters include ^, $, *, ?, \, [], and
    ().


    +   4. Pattern and Matcher:

    •The Pattern class is used to compile a regular expression into a pattern. The
    Matcher class is then used to match the pattern against a string. The Pattern
    and Matcher classes work together to provide powerful pattern-matching capabilities.


    +   5. Quantifiers:

    •Quantifiers specify the number of occurrences of a character or a group of characters.
    Common quantifiers include * (zero or more occurrences), + (one or more occurrences),
    ? (zero or one occurrence), and {n},{n,m} (between n and m occurrences).


    +   6. Character Classes:

    •Character classes allow you to match any one of a specified set of characters.
    For example, [aeiou] matches any vowel, and [^0-9] matches any non-digit character.'
- md: "\n7. Escape Sequences: ◆Escape sequences are used to match metacharacters as\
    \ literal characters. For example, \\ matches a single backslash, and \\. matches\
    \ a literal period.\n\n8. Boundary Matchers: ◆Boundary matchers are used to match\
    \ the position between characters, rather than the characters themselves. Examples\
    \ include ^ (start of line), $ (end of line), \\b (word boundary), and \\B (non-word\
    \ boundary) by default.\n\n9. Greedy and Lazy Quantifiers: ◆Quantifiers in regular\
    \ expressions are by default greedy, meaning they match as much as possible. By\
    \ adding ? after a quantifier, it becomes lazy, matching as little as possible.\n\
    \n10. Groups and Capturing: ◆Parentheses ( ) are used to group expressions and\
    \ create capturing groups. Capturing groups allow you to extract parts of the\
    \ matched text.\n\n11. Predefined Character Classes: ◆Java regular expressions\
    \ include predefined character classes such as \\d (digit), \\D (non-digit), \\\
    s (whitespace), \\S (non-whitespace), \\w (word character), and \\W (non-word\
    \ character).\n\n12. Unicode and Multiline Support: ◆Java's regular expressions\
    \ support Unicode characters, and you can enable multiline mode to match the start\
    \ and end of each line within a multiline string.\n\n13. Replacement with String.replaceAll():\
    \ The String class in Java provides a replaceAll() method that can be used with\
    \ regular expressions to replace patterns with specified strings.\n\nIn summary,\
    \ regular expressions in Java are a powerful tool for pattern matching and manipulation\
    \ of strings. They are used for searching, matching, and replacing text based\
    \ on specified patterns. Understanding the syntax of regular expressions and how\
    \ to use them with the Pattern and Matcher classes in Java allows developers to\
    \ perform advanced string manipulations efficiently.\n\nIn Java, regular expressions\
    \ (regex or regexp) are a powerful tool for pattern matching and manipulation\
    \ of strings. The java.util.regex package provides classes for working with regular\
    \ expressions. Regular expressions allow you to describe a pattern that can be\
    \ used to match and manipulate strings. Here's an example demonstrating the use\
    \ of Java regular expressions:\n\n```java\nimport java.util.regex.Matcher;\nimport\
    \ java.util.regex.Pattern;\n\npublic class RegexExample {\n    public static void\
    \ main(String[] args) {\n        // Example 1: Matching a pattern\n        String\
    \ text = \"The quick brown fox jumps over the lazy dog\";\n        // Define a\
    \ pattern to match the word \"fox\"\n        String patternString = \"fox\";\n\
    \        Pattern pattern = Pattern.compile(patternString);\n        Matcher matcher\
    \ = pattern.matcher(text);\n        // Check if the pattern is found in the text\n\
    \        if (matcher.find()) {\n            System.out.println(\" '\" + patternString\
    \ + \" ' found in the text\");\n        } else {\n            System.out.println(\"\
    \ '\" + patternString + \" ' not found in the text\");\n        }\n\n        //\
    \ Example 2: Extracting digits from a String\n        String sentence = \"The\
    \ price of the product is $25.99\";\n        // Define a pattern to match digits\n\
    \        String digitPattern = \"\\\\d+\";\n        Pattern digitPatternCompiled\
    \ = Pattern.compile(digitPattern);\n        Matcher digitMatcher = digitPatternCompiled.matcher(sentence);\n\
    \        // Find and print all occurrences of digits in the sentence\n       \
    \ System.out.println(\"Digits found in the sentence: \");\n        while (digitMatcher.find())\
    \ {\n            System.out.println(digitMatcher.group());\n        }\n    }\n\
    \    System.out.println();\n}\n```\n\nExplanation:\n\n- 1. Example 1: Matching\
    \ a Simple Pattern:\n  - A pattern is defined using the string \"fox.\"\n  - The\
