    # 6. Automatic Memory Management:


    ● Garbage Collection: Java includes an automatic garbage collector that automatically
    reclaims memory occupied by objects that are no longer in use. This simplifies
    memory management for developers.


    # 7. Strongly Typed Language:


    ●Data Types: Java is a strongly typed language, meaning that variables must be
    declared with a specific data type. This helps catch errors at compile-time and
    enhances code reliability.


    # 8. Exception Handling:


    ●Robustness: Java has a robust exception-handling mechanism that allows developers
    to handle runtime errors gracefully. This contributes to the overall stability
    of Java applications.


    # 9. Rich Standard Library:


    ●API (Application Programming Interface): Java comes with a vast and comprehensive
    standard library (Java API) that provides pre-built functionality for various
    tasks. This allows developers to focus on application-specific logic rather than
    low-level details.


    # 10. Multi-threading Support:


    ●Concurrent Execution: Java supports multi-threading, allowing developers to create
    applications that can perform multiple tasks concurrently. This is crucial for
    building responsive and efficient programs.


    In summary, Java is a powerful and versatile programming language known for its
    platform independence, object-oriented paradigm, simplicity, and robust features.
    Its wide range of applications spans from web development to mobile app development,
    making it a popular choice in the software development industry.'
