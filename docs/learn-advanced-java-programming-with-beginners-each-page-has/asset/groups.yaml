    converted boolean: \" + convertedBoolean);\n    }\n}\n```\n\n解释：\n\n## 1. 基本数据类型：\n\
    \  - 变量 `primitiveInt`、`primitiveDouble`、`primitiveChar` 和 `primitiveBoolean`\
