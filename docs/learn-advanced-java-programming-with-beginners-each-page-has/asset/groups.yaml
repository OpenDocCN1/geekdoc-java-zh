    \ concept in Object-Oriented Programming (OOP) that involves hiding the implementation\
    \ details of an object and exposing only the essential features or functionalities.\
    \ Abstract classes and interfaces are key components of abstraction in Java. An\
    \ abstract class is a class that cannot be instantiated and may have abstract\
    \ methods, while an interface is a collection of abstract methods. Here’s an example\
    \ that demonstrates abstraction using an abstract class and an interface:\n\n\
    ```java\n// Example of Java Abstraction\n\n// Abstract class with abstract method\n\
    abstract class Shape {\n    // Abstract method (to be implemented by subclasses)\
    \ \n    abstract void draw(); \n\n    // Concrete method \n    public void displayInfo()\
    \ {\n        System.out.println(\"This is a shape.\");\n    }\n}\n\n// Concrete\
    \ subclass of Shape class\nclass Circle extends Shape {\n    // Implementation\
    \ of the abstract method\n    @Override \n    public void draw() {\n        System.out.println(\"\
    Drawing a circle.\");\n    }\n}\n\n// Another concrete subclass of Shape class\n\
    class Rectangle extends Shape {\n    // Implementation of the abstract method\n\
    \    @Override \n    public void draw() {\n        System.out.println(\"Drawing\
    \ a rectangle.\");\n    }\n}\n```\n\n```java\n// Interface representing a drawable\
    \ object\ninterface Drawable {\n  // Abstract method (to be implemented by classes)\
    \ \n  void draw();\n}\n\n// Class implementing the Drawable interface\nclass Triangle\
    \ implements Drawable {\n  // Implementation of the interface method\n  @Override\
    \ \n  public void draw() {\n    System.out.println(\"Drawing a triangle.\");\n\
    \  }\n}\n\npublic class AbstractionExample { \n  public void main(String[] args)\
    \ {\n      // Using abstract class and its subclasses\n      Shape circle = new\
    \ Circle(); \n      Shape rectangle = new Rectangle();\n\n      circle.draw();\n\
    \      circle.displayInfo();\n\n      rectangle.draw(); \n      rectangle.displayInfo();\
    \ \n\n      // Using interface and its implementing class\n      Drawable triangle\
    \ = new Triangle();\n      triangle.draw();\n  }\n}\n```\n\nExplanation:\n\n-\
    \ 1. Abstract Class (Shape):\n    - The Shape abstract class has an abstract method\
