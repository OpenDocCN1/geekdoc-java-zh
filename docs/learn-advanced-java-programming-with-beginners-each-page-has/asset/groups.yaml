    9. 消息传递：\n◆对象之间通过发送消息进行通信。这涉及调用一个对象上的方法，从而触发操作或请求信息。\n\n10. 实例化：\n◆实例化是从类创建对象的过程。当对象被实例化时，会为其属性分配内存，并使其成为一个拥有自身状态的独立实体。\n\
    \n11. 构造函数与析构函数：\n◆构造函数是类中的一种特殊方法，用于在创建对象时初始化其状态。虽然 Java 中没有显式定义析构函数，但负责在对象销毁前释放资源。\n\
    \n12. 接口：\n◆接口为类定义了一个合约，规定了实现类必须提供的一组方法。它们在 Java 中支持多继承，并帮助实现抽象层。\n\n总结来说，Java\
    \ 面向对象编程以对象、类、封装、抽象、继承和多态概念为核心。这些原则有助于组织代码、提高代码复用，并模拟现实世界的实体和关系，从而产生更具模块化、扩展性和可维护性的软件。\n\
    \n面向对象编程（OOP）是一种围绕对象概念的编程范式。在 Java 中，OOP 基于四个主要原则：封装、继承、多态和抽象。以下是一个演示 Java 中基本\
    \ OOP 概念的示例：\n\n```java\n// 代表 Car 类\nclass Car {\n    // 实例变量（属性）\n    String\
    \ brand;\n    String model;\n    int year;\n\n    // 构造函数\n    public Car(String\
    \ brand, String model, int year) {\n        this.brand = brand;\n        this.model\
    \ = model;\n        this.year = year;\n    }\n\n    // 显示汽车信息的方法\n    void displayInfo()\
    \ {\n        System.out.println(\"Car: \" + brand + \" \" + model + \" (\" + year\
    \ + \")\");\n    }\n}\n```\n\n```java\n// 代表 SportsCar 类，继承自 Car 类\nclass SportsCar\
    \ extends Car {\n    // SportsCar 特有的属性\n    boolean isConvertible;\n\n    //\
    \ SportsCar 的构造函数\n    public SportsCar(String brand, String model, int year,\
    \ boolean isConvertible) {\n        super(brand, model, year); // 调用基类（Car）的构造函数\n\
    \        this.isConvertible = isConvertible;\n    }\n\n    // 重写 displayInfo 方法以包含\
    \ SportsCar 特有的信息\n    @Override\n    public void displayInfo() {\n        super.displayInfo();\
    \ // 调用基类（Car）的 displayInfo 方法\n        System.out.println(\"Convertible: \" +\
    \ isConvertible);\n    }\n}\n\npublic class OOPExample {\n    public static void\
    \ main(String[] args) {\n        // 创建 Car 和 SportsCar 类的对象\n        Car sedan\
    \ = new Car(\"Toyota\", \"Camry\", 2022);\n        SportsCar sportsCar = new SportsCar(\"\
    Porsche\", \"911\", 2022, true);\n        // 调用对象的方法\n        sedan.displayInfo();\n\
    \        sportsCar.displayInfo();\n    }\n}\n```\n\n解释：\n\n- 1. 类和对象：Car 类和 SportsCar\
    \ 类是 Java 中类的示例。\n  对象（sedan 和 sportsCar）是这些类的实例。\n\n- 2. 属性和构造函数：\n  类拥有属性（实例变量），如品牌、型号和年份。\n\
    \  Car 类有一个构造函数（`public Car(...)`）来初始化这些属性。\n\n- 3. 继承：\n  SportsCar 类继承自 Car\
    \ 类。这允许 SportsCar 继承 Car 的属性和方法。\n\n- 4. 多态：\n  在 SportsCar 类中重写了 displayInfo\
    \ 方法以提供该方法的特殊版本。\n\n- 5. 封装：\n  属性被封装在类内部，对属性的访问通过方法控制，限制了对对象某些组件的直接访问。\n\n- 6.\
    \ 抽象：\n  抽象通过使用类来实现，隐藏了实现的内部细节，只暴露核心特征。\n\n总结来说，Java 中的面向对象编程涉及创建类和对象，利用继承进行代码复用，通过方法重写实现多态，封装属性并促进抽象，以模块化和组织化的方式模拟现实世界的实体。OOP\
    \ 增强了代码结构、可读性和维护性。\n\n# JAVA 类/对象\n\n在 Java 中，类和对象是面向对象编程（OOP）的基础概念。\n\n- 1. 类：\n\
    \  - 类是 Java 中创建对象的蓝图或模板。它定义了一组描述该类对象的属性（字段或属性性）和行为（方法）。\n\n- 2. 对象：\n  - 对象是类的实例。它代表一个具有类所定义的特征和行为的现实实体。对象根据类提供的结构创建。\n\
    \n- 3. 属性（字段/属性性）：\n  属性是类的数据成员，也称为字段或属性性。它们代表对象的状态或特征。从类创建的每个对象都有其自己的一组属性值。\n\
    \n- 4. 行为（方法）：\n  行为是类的方法或函数。它们代表了对象可以执行的操作。\n\n- 5. 封装：\n  封装是将操作该数据的方法和数据封装在单一单元中的实践，它限制了对对象某些组件的直接访问。\n\
    \n- 6. 构造函数：\n  构造函数是一种特殊方法，用于在创建对象时初始化其状态。\n\n"
