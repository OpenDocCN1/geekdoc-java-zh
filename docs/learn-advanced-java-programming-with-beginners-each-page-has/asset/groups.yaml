    # JAVA ThReADS


    In Java, threads are the smallest units of execution within a program, and multithreading
    is the concurrent execution of two or more threads to achieve better performance
    and responsiveness.


    +   1. Thread Definition:


    ●A thread in Java is a lightweight, independent unit of execution. It consists
    of its own program counter, stack, and set of registers. Multiple threads within
    a program share the same memory space but run independently.


    +   2. Thread Lifecycle:


    +   ●Threads go through various states during their lifecycle. These states include:

    ○New: The thread is created but not yet started.

    ○Runnable: The thread is ready to run and is waiting for its turn to be picked
    by the thread scheduler.

    ○Blocked: The thread is waiting for a monitor lock to enter a synchronized block
    or method.

    ○Waiting: The thread is waiting for another thread to perform a particular action.

    ○TimedWaiting: The thread is waiting for another thread for a specified amount
    of time.

    ○Terminated: The thread has completed its execution.


    +   3. Thread Creation:


    ●In Java, threads can be created by extending the Thread class or implementing
    the Runnable interface. The Thread class provides the start() method to begin
    the execution of a thread.


    +   4. Runnable Interface:


    ●The Runnable interface provides a way to create threads in Java by implementing
    the run() method. The Runnable object can then be passed to a Thread constructor.


    +   5. Thread Priorities:


    ●Each thread in Java has a priority assigned to it, ranging from Thread.MIN_PRIORITY
    to Thread.MAX_PRIORITY. The default priority is Thread.NORM_PRIORITY. Higher-priority
    threads get more CPU time than lower-priority threads.


    +   6. Synchronization:'
