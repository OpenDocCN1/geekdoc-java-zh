    declared inside these blocks have limited visibility and are only accessible within
    the respective scopes.


    9. Common Use Cases:


    •The if...else statement is commonly used for decision-making in various scenarios,
    such as validating user input, handling different cases based on conditions, and
    responding to events.


    10. Error Handling:


