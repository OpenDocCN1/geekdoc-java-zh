    \n- 3. 访问类方法：类方法直接通过类名访问，无需创建类的实例。\n\n- 4. 静态上下文（Static Context）：\n  - 类方法在静态上下文中运行，不能直接访问非静态（实例）变量或方法。\n\
    \n总结来说，Java 中的类方法是属于类本身而不是类实例的方法。它们用 `static` 关键字声明，可以在不创建对象的情况下直接通过类调用。类方法通常用于不依赖于单个对象状态但与类类整体相关的操作。\n\
    \n## Java 构造函数\n\n在 Java 中，构造函数是一种特殊的方法类型，用于初始化对象。\n\n- 1. 初始化：\n  - 构造函数用于在创建对象时初始化对象的状态。它们确保对象从一开始开始就具有有效且一致的状态。\n\
    \n- 2. 特殊方法：\n  - 构造函数的名称与它们所属的类相同，且它们没有返回值，甚至 `void` 也没有。它们在实例化对象时会被自动调用。\n\n\
    - 3. 无显式返回类型：\n  - 与普通方法不同，构造函数没有指定显式的返回类型。它们的主要目的是初始化对象，而不是返回值。\n\n- 4. 默认构造函数：\n\
    \  - 如果一个类没有显式定义任何构造函数，Java 会提供一个默认构造函数。\n\n- 5. 参数化构造函数：\n  - 构造函数可以接受参数，允许开发者进行自定义初始化。\n\
    \n- 6. 载载构造函数：\n  - 一个类可以有多个构造函数，被称为重载构造函数。\n\n- 7. 初始化块：\n  - 除了构造函数外，Java 还支持初始化块，它们在任何构造函数执行之前运行。\n\
    \n- 8. 隐式 Super 调用：\n  - 如果一个类继承另一个类，父类的构造函数是被隐式调用的。\n\n- 9. 默认值与初始化：\n  - 如果属性没有被显式初始化，Java\
    \ 会根据数据类型提供默认值。\n\n- 10. 对象分配：\n  - 构造函数在使用 `new` 关键字创建对象时被调用。\n\n- 11. 访问修饰符：\n\
    \  - 构造函数拥有访问修饰符（例如 `public`、`private`、`protected` 或包私有），控制它们的可见性。\n\n- 12. 构造函数链：\n\
    \  - 构造函数可以使用 `this()` 关键字调用类中的其他构造函数。\n\n总结来说，Java 构造函数是用于初始化对象的特殊方法。它们通过为属性分配初始值来确保对象的状态有效且一致。构造函数可以是参数化的、重载的，并根据提供的值进行自定义初始化。\n\
    \n"
