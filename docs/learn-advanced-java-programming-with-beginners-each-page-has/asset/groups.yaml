    # Java OOP


    Object-Oriented Programming (OOP) is a programming paradigm that uses objects,
    which are instances of classes, to organize and structure code.


    +   1. Objects:

    * In OOP, everything is treated as an object. An object is an instance of a class
    and represents a real-world entity with attributes (data) and behaviors (methods).


    +   2. Classes:

    * Class is a blueprint or template for creating objects. It defines the properties
    (attributes) and behaviors (methods) that its objects will have.


    +   3. Encapsulation:

    * Encapsulation is the bundling of data (attributes) and the methods that operate
    on the data within a single unit, i.e., a class. This helps in hiding the internal
    details of an object and exposing only what is necessary.


    +   4. Abstraction:

    * Abstraction is the process of simplifying complex systems by modeling classes
    based on essential properties and behaviors. It allows programmers to focus on
    what an object does without worrying about how it achieves its functionality.


    +   5. Inheritance:

    * Inheritance is a mechanism that allows a class (subclass or derived class) to
    inherit properties and behaviors from another class (superclass or base class).
    It promotes code reuse and establishes an "is-a" relationship between classes.


    +   6. Polymorphism:

    * Polymorphism allows objects of different classes to be treated as objects of
    a common base class. It enables flexibility and extensibility in the code, allowing
    methods to be used with objects of different types.'
