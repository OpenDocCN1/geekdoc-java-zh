    # JVa CLASS AttRiButeS


    In Java, class attributes, also known as fields or properties, are variables that
    are declared within a class and define the state or characteristics of objects
    created from that class.


    +   1. Definition: Class attributes are variables that belong to a class. They
    represent the data or state associated with objects created from that class. Each
    object of the class has its own set of attribute values.


    +   2. State of Objects: Attributes define the state of objects. They represent
    the information or characteristics that describe the object''s identity or current
    condition.


    +   3. Data Members: Class attributes are also referred to as data members. They
    hold data associated with the objects and determine the properties of instances
    of the class.


    +   4. Declaration: Attributes are declared within the class body but outside
    of any methods. They are typically specified with an access modifier (e.g., public,
    private, protected, or package-private) to control their visibility.


    +   5. Accessibility: The access modifiers define the visibility and accessibility
    of class attributes. For example, using private ensures that the attribute is
    only accessible within the class, promoting encapsulation.


    +   6. Data Types: Attributes have specific data types that define the kind of
    data they can store. Common data types include primitives (e.g., int, double)
    and objects (e.g., custom classes, String).'
