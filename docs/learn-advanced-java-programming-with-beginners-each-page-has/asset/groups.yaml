    \n- 内部类通过允许将相关的类分组在单个逻辑单元中，有助于封装。它们可以访问外部类的私有成员，从而促进了数据隐藏。\n- 5. 代码组织：\n\n- 内部类对于在逻辑上组织代码非常有用。当一个类与另一个类紧密相连且不打算独立使用时，将其定义为内部类是有意义的。\n\
    - 6. 回调和事件处理：\n\n内部类常用于事件处理场景，在场景中定义一个内部类来处理按钮点击等事件。这促进了关注点的清晰分离。\n\n- 7. 设计模式的实现：\n\
