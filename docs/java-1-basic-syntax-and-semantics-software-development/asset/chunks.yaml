    \n## 练习 2\n\n编写一个可以命名为 `Label` 的程序，打印你的名字、地址和电子邮件地址，例如\n\n![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_242.jpg)\n\
    \n# 3 命令和控制台程序\n\n在上一节中，我将程序分为三类，在本章中，我将介绍命令和控制台程序。原则上没有太大区别，分类仅取决于用户如何将数据传递给程序。`HelloWorld`\
    \ 和上一节的示例 `Kings` 都是命令的示例。\n\n## 3.1 命令\n\n每个 Java 程序必须有一个具有以下签的 `main()` 方法：\n\
    \n![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_25.jpg)\n\n目前，你应该忽略 `public`、`static`\
    \ 和 `void` 单词的含义，只需接受它们应该出现在那里即可，但 `main()` 方法是程序启动的地方。方法名后面是括号内的参数，表示可以传递到程序的命令行参数。考虑以下程序：\n\
    \n![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_26.jpg)\n\n`args` 是一个数组（正如我稍后解释的那样），但在命令行传递的参数在程序中被称为\n\
    \n![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_261.jpg)\n\n依此类推。参数是一个文本字符串，参数之间用空格分隔。例如，如果你将\
    \ `Command.jar` 文件复制到 `temp` 文件夹，可以如下方式执行程序：\n\n![](img/Image26987.jpg)\n\n有两个参数，分别称为\
    \ `Svend` 和 `Knud`，程序在屏幕上打印这两个参数。如果你以以下方式执行程序：\n\n![](img/Image26997.jpg)\n\n\
    结果是相同的。这次有三个参数，但程序只使用了前两个。然而，如果应用程序在没有两个参数的情况下运行，你将得到一个错误：\n\n![](img/Image27004.jpg)\n\
    \n原因是第二个参数不存在，因此语句失败：\n\n![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_27.jpg)\n\
    \n该示例展示了我所理解的“命令”。另一个问题是当你必须传递参数时，如何在 NetBeans 中测试应用程序。可以通过菜单选择：\n\n![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_271.jpg)\n\
    \n在这里你必须选择 `Run` 类别，你可以在此处输入参数：\n\n![](img/Image27011.jpg)\n\n注意如果参数包含空格，则需要用引号指定。\n\
    \n## 3.2 示例：PrintAddress\n\n以下程序将打印一个人的名字和地址，但要打印的值是通过命令行传递的。因此，该程序是一个命令。程序名为\
    \ `PrintAddress`，必须在命令行传递四个参数。命令行参数用空格分隔，如果参数包含空格，则需要用引号指定。运行程序的示例如下：\n\n![](img/Image27019.jpg)\n\
    \n我在 NetBeans 中创建一个名为 `PrintAddress` 的项目。代码可以写作：\n\n![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_29.jpg)\n\
    \n（此处由于原文存在大量重复段落，已根据逻辑要求整合并翻译核心内容）\n\n```java\npublic class PrintAddress {\n\
    \    public static void main(String[] args) {\n        System.out.println(\"Name:\
    \ \" + args[0]);\n        System.out.println(\"Address: \" + args[1]);\n     \
    \   System.out.println(\"City: \" + args[2]);\n        System.out.println(\"Email:\
    \ \" + args[3]);\n    }\n}\n```\n\n## 3.3 控制台程序\n\n与命令相比，控制台程序（在本书中）是指一种与用户进行交互的程序，用户必须输入数据。\n\
    \n上面我展示了一个程序，当值作为命令行参数传递时，它会打印一个人的名字和地址。下面是同一个程序但这次用户必须在运行程序期间输入值。因此，它与用户交互。\n\
    \n"
