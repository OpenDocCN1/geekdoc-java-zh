    通常，命令行参数有以下要求：


    * 所有具有默认值的选项（`a`、`b`、`r`、`o`）都可以省略。

    * 选项可以以任何顺序出现。

    * 在同一条命令行上不能有冲突的选项（例如 `-r` 和 `-i`）。


    解决方案中没有包含彩票（lottery ticket）的概念，因为它在这个程序中没有意义——彩票游戏基本上是一张可以包含任意行的大型优惠券。


    关于彩票结果，有以下要求：


    1. 每行彩票号码中的数字应按升序排列。

    2. 同一行不能出现多次。

    3. 行应该按升序排列（先按第一个数字，再按下一个数字，依此类推）。

    4. 结果的第一行定义游戏，并包含最小和最大的合法彩票号码、每行的数值个数以及周数。


    关于验证结果，它是一个文件（默认是屏幕），其中包含所有行，但每行后面都增加了一个指示正确数值数量的数字。结果按该数字降序排列。


    如果你输入了非法命令（例如因为选项错误、缺失或冲突、非法彩票号码、非法文件等），程序必须带有错误信息和程序语法并终止。如果在检查当周彩票时存在非法行，该行后的数字应替换为简短的错误信息，并可能将非法行添加在结果的最后。


    程序参数的边界为：


    ![](img/text01_87.jpg)


    程序参数的边界是：彩票号码最大可以有两个数字，一个彩票行最多可以包含 15 个数字。同样，也有一些最小要求。除了便于格式化结果和避免某些特殊情况（如游戏为空）之外，这些要求其实并没有其他理由。


    ## 9.1 设计


    上述内容可以看作是编写程序的需求规范。程序可以用许多方式编写，对于使用程序的人来说，只要程序满足要求，编写方式并不重要；但在实践中，程序必须进行维护，因此程序的编写方式非常重要。重要的是编写代码时要易于阅读和理解，并且编写代码要使得某处的更改不意味着必须重写程序的大部分。为了实现这些目标，程序必须组织良好的类，问题在于这些类是什么以及如何找到并编写这些类。这并不简单，也没有唯一的解决方案，这在很大程度上是后面几本书的内容，但下面将简单解释一下该程序是如何组织成类的，从而说明程序的架构。


    如果考虑彩票行（lottery row）的概念，那么它是范围内的一个不同整数（彩票号码）的序列。彩票号码仅仅是一个 `int`，但我仍然选择定义一个类来表示彩票号码。原因是，该类必须能够验证彩票号码，并检查它相对于当前彩票游戏是否合法，因此程序应该拥有以下类：


    ![](img/Image28645.jpg)


    在系统开发中，你通常会这样阐明类。它表示程序必须有一个名为 `LottoNumber` 的类，该类必须有一个名为 `number` 的私有 `int` 变量。在这种情况下，这个数字代表彩票号码的值。图中还显示该类应该有两个构造函数，第一个是默认构造函数，应该创建一个具有随机合法值的
    `LottoNumber` 对象，而另一个以以值为参数。当程序创建当周彩票时，必须使用它。此外，图中显示该类必须有一个方法 `getNumber()` 来返回彩票号码的值。


    如所述，`LottoNumber` 类必须验证彩票号码，因此应该知道哪些是合法值。在这种情况下，通过定义以下类来解决：


    ![](img/Image28653.jpg)


    该类应该有一个带有三个 `int` 参数的方法 `init()`，指示最小合法彩票号码、最大合法彩票号码以及每行的彩票号码数量。该类拥有可以返回这些值的方法。在图中，方法被下划线，这意味着它们是
    `static` 方法，可以在没有对象的情况下使用。关于类中静态和非静态成员的细节在《Java 3》书中有所解释，这里只需要知道类中的静态方法可以在应用的任何地方使用而无需任何对象。静态方法仅使用类名引用。选择这种解决方案是因为具体彩票游戏的三个值在整个程序中必须可用。需要强调的是，这不是最好的解决方案，但在关于
    Java 的话进行到这里，这是可行的解决方案。


    有了这个类，很明显，`LottoNumber` 类及其方法可以验证彩票号码是否正确。


    `LottoNumber` 和 `LottoGame` 两个类都是简单的，但下一个类更复杂：


    ![](img/Image28660.jpg)


    该类代表一个彩票行，即一个彩票号码序列。该类有两个构造函数，第一个必须创建一个具有随机彩票号码的彩票行，另一个创建一个具有特定数字的彩票行并应用于表示当周的彩票。两个构造函数都必须确保创建的彩票行相对于当前彩票游戏是法的，因此必须使用
    `LottoGame` 类。特别是第一个构造函数很复杂，因为它必须确保创建的行数字都不同，且数字按升序排列。该类应该有一个带有 `LottoRow` 参数的方法
    `validate()`。该参数代表当周的彩票，该方法应用于确定当前行中有多少个正确数字。结果是该方法更新了 `result` 变量，当它是私有时，还有一个可以返回该值的方法。


    `LottoRow` 类由若干 `LottoNumber` 对象组成，但我们没有在类的图中将其显示为变量，而是显示为两个类之间的链接：


    ![](img/Image28668.jpg)


    这里表示 `LottoRow` 对象引用多个 `LottoNumber` 对象。


    还需要一个可能代表多个彩票行从而代表特定彩票游戏的类。虽然我之前提到过程序没有使用类似于彩票券的概念，但我决定将下一个类命名为 `LottoCoupon`，可以将该类设为类似于任意尺寸的彩票票的概念：


    ![](img/Image28675.jpg)

