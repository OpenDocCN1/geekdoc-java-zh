    they will print


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_42.jpg)


    Here, the sign is not quite obvious, but for two integers `a` and `b`


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_421.jpg)


    where `(a / b)` means `a / b` with any decimal places thrown away. From this formula,
    it is easy to figure out that the above results are correct. The modulus operator
    can also be used if the arguments are floating-point numbers, and the formula
