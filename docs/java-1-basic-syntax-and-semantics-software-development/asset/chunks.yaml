  trans: "\n玩家投掷两个骰子，并记录点数总和。如果总和为 7 或 11，玩家胜。如果总和为 2、3 或 12，玩家输（赌场获胜）。相比之下，如果总和为\
    \ 4,5、6、8、9 或 10，则将该总和记录为玩家的分数（points）。然后玩家继续投掷骰子，直到点数总和再次等于的分的分数，或者总和等于 7。如果总和等于玩家的分数，玩家胜；如果总和为\
    \ 7，玩家输，赌场获胜。\n\n程序必须按照这种方式运行：用户首先输入想玩多少游戏。然后程序模拟指定的游戏次数，最后打印玩家赢了多少次，赌场赢了多少次。这一过程将重复，直到用户输入的游戏次数为\
    \ 0。\n\n然而，该程序有一些设计要求，因为它必须由几个类组成。任务必须根据以下指南解决：\n\n1.  首先创建一个名为 `Craps` 的 NetBeans\
    \ 项目。\n2.  向项目中添加一个 `Cube` 类 – 该类必须与第 3 章中对应的类完全相同，你可以直接从那里复制代码。\n3.  添加一个 `Cup`\
    \ 类来代表骰子杯。该类必须与 `Cubes` 项目中对应的类相等，你可以先从拷贝该类的代码开始。然后对该类进行如下修改：\n    - 移除 `yatzy()`\
    \ 方法。\n    - 添加一个方法：\n      ```java\n      public int count()\n      ```\n   \
    \   返回杯子中骰子的数量。\n    - 添加一个方法：\n      ```java\n      public Cube getCube(int n)\n\
    \      ```\n      返回杯子中的第 n 个骰子。\n4.  添加一个 `Game` 类，它代表游戏本身，用于模拟游戏玩若干次并打印结果。\n\
    5.  为 `main` 类编写代码，用户可以在其中输入玩游戏的次数。\n\n完成后，很好地测试程序非常重要。除了多次运行程序并评估结果外，你做不了其他事情。\n\
    \n上面的游戏版本经过了简化，与游戏还存在更多规则。如果你按照上述描述玩游戏，玩家和赌场的获胜概率几乎相同，赌场略占优势——这在赌场不破产的情况下也应该是是这样的。\n\
    \n# 6 ArrayList\n\n Java 有有一系列所谓的“集合类”，这些类可以被认为是对象的容器。这些类将在稍后讨论（在《Java 4》一书中），但我将介绍其中一个，因为你经常需要用到它。这个类被称为\
    \ `ArrayList`。确实，在实践中，没有这个类的情况下编写程序是非常困难的。\n\nJava 以及任何其他编程语言中的一个核心概念是数组，它是一种可以包含若干特定类型对象的数据结构。数组的使用原则上非常简单，很少与之相关的大问题，但有一个问题，即在你创建数组时，必须说明它需要容纳多少个对象。这并非总是可能的，在许多情况下，你必须通过创建足够大的数组来解决这个问题。在其他上下文中，可能需要计算数组必须容纳多少元素，然后创建一个合适大小的数组。这会导致代码效率低下，而\
    \ `ArrayList` 类恰能解决这些困难。\n\n从技术上讲，`ArrayList` 是封装了普通数组的类，该类拥有用于操作数组中数据的方法。应该像下面所示思考\
    \ `ArrayList`，其中箭头指示下一个可用位置：\n\n![](img/Image28623.jpg)\n\n基本方法是 `add()`，它将对象添加到箭头所指的地方，添加对象后，箭头向右移动一位。当你创建一个新的\
    \ `ArrayList` 时，箭头位于最左侧的位置，对应于列表为空。随着对象的添加，箭头向右移动并尝试添加对象，如果没有空间，数组会自动扩展。这正是该数据结构的优势所在，作为一名程序员，你可以直接向列表中填充对象，而不必考虑是否有空间。该类还有许多其他方法，例如，你可以通过\
    \ `get()` 方法引用列表中的单个对象，并可以通过索引在列表中间插入元素、删除项目等，但重要的是记住 `ArrayList` 是一个序列，它不能有空洞。这意味着在实践中，如果你在列表中间插入一个元素，新元素右侧的所有元素都会移动一位；同地，如果你删除一个元素，那么被删除元素右侧的所有元素都必须向左移动一位。总的来说，该类及其方法是有效的，特别是\
    \ `add()` 极其有效，作为一名程序员，你不应该考虑所有技术细节，而应该将该类视为一个动态数组。例如，下面的程序创建了一个 `ArrayList`：\n\
    \n![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_107.jpg)\n\n你应该注意创建列表的语法，以及如何指定使用该列表。接下来，程序向列表添加了\
    \ 5 个元素，但 `add()` 有一个索引来指示你想插入元素的位置。倒数第二个语句显示了如何通过 `get()` 元素。最后一条语句显示了如何遍历列表。你必须意识到\
    \ `size()` 方法，虽然示例中没有用到，但它返回列表中的元素数量，你可以这样遍历列表：\n\n![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17.jpg)\n\
    \n`ArrayList` 类易于使用，我将在需要的地方使用它，特别是在最后的示例中应用。\n\n# 7 比较与排序\n\n如果你执行以下方法\n\n![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_108.jpg)\n\
    \n你会得到结果：\n\n![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_1081.jpg)\n\n\
    结果是 *false*，这很不是你预期的。解释是 `s1` 和 `s2` 是两个不同对象的引用，用等号比较两个对象时比较的是对象引用。如果你想比较两个对象的值，那么你必须在变量中使用\
