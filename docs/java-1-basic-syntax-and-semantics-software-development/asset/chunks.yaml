    源编辑器（Source Editor）包含了程序的代码，正如你所看到的，NetBeans 会自动为程序创建一个骨架。实际上，它是一个完整的程序——只是目前还没有执行任何功能。程序代码由
    Java 语句和注释组成。注释会被编译器移除，不会影响最终的程序。插入注释纯粹是为了我们这些需要阅读和理解程序代码的人。


    ## 2.2 源代码


    下面我展示了在修改或删除了 NetBeans 生成的注释并编写了一条语句后的最终程序：


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_16.jpg)


    现在只剩了一个注释，位于顶部，说明了程序的功能。代码的其他部分都是 Java 语句。Java 程序由类（classes）组成，在这种情况下有一个名为 `HelloWorld`
    的类，因此它的名称就是我选择的项目名称。该类包含一个名为 `main()` 的 `method`（方法），它包含一条语句——这不是由 NetBeans 创建的，而是我输入的。这是一条在屏幕上打印文本的语句。


    代码非常简单，到目前为止你只需要接受它应该像上面那样被写，但有几点你需要注意。


    Java 是区分大小大小的，因此在任何地方你必须区分大写字母和小写字母。


    正如前面提到的，每个 Java 程序至少包含一个名为 `HelloWorld` 的类。一个类由 `variables`（变量）和 `methods`（方法）组成。在这种情况下，该类只有一个名为
    `main()` 的方法，它是程序启动时调用的方法。方法由语句组成，这些语句可以被视为在机器上执行某些操作的命令。调用一个方法意味着执行该方法中的语句。注意，方法
    `main()` 必须以 `public static void` 作为前缀。后面将进行解释。在这种情况下，`main()` 只有一条语句，即在屏幕上写入文本。`System.out.println()`
    实际上是 `PrintStream` 类中的一个方法，它等其他代表代表屏幕。当程序运行时，只有执行 `main()` 中的 `println()` 语句，才会在屏幕上打印文本。


    注意在 Java 中，每条语句都以分号（;）结束——上面 `System.out.println()` 之后有一个分号。它告诉编译器语句何处结束。


    在 Java 中，类被分组在所谓的包（packages）中。一个类的全名由该类所属的包以及类名组成。NetBeans 会自动为程序定义一个包，包名是小写的应用程序名称，第一条语句是包语句，指示类所属的包。包语句必须是包含类的文件的第一条语句，但可以以前注释作为开头。注意在
    Java 中，你通常必须将每个类放在它自己的文件中，关于这一点稍后会介绍。


