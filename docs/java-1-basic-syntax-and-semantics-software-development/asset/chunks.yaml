    Another control statement is called an `if-else` statement, but it is little more
    than an extension of the `if` statement. As an example you can write the following:


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_811.jpg)


    The meaning is that if the condition is `true`, then the statement after the parentheses
    is executed, and otherwise the statement after `else` is executed. The difference
    is that `if-else` always does something. Formally, the syntax is:


    ```

    if (condition) block_1 else block_2

    ```


    The `if` statement and the `if-else` statement are also called for selections
    (or branches) corresponding to that they make the execution of statements depending
    on a condition.


    In practice, the `if` statement and the `if-else` statement are the most common
    control statements, and it is hard to imagine a program where these statements
    do not occur.


