    ## 4.4 Example: Cubes


    I will show a class representing a usual cube with six sides. The class can be
    written as follows:


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_64.jpg)![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_65.jpg)


    The class has two fields: A class variable and an instance variable. The class
    variable is called `rand` and is an object of the type `Random`. It is a random
    number generator which can generate random numbers. It works by reading the machine
    clock and then, produces a sequence of values, based on the clock’s value when
    the object is created. As you can not know (assume) something about what the clock
    shows at any given time, the start time is randomly and the sequence of generated
    numbers appear to be random. The variable `rand` must be a class variable, when
    objects of type `Cube` otherwise would have their own random number generator,
    which could easily result in being initialized with the same value of the clock.
    The result would be that a number of `Cube` objects would create the same sequence
    of random numbers. The class’s instance variable is called `eyes` and is used
    to keep track of the value of each `Cube`. Since two `Cube` objects do not necessarily
    have the same value, this variable must be an instance variable, so each object
    has its own copy.


    The class has a method called `roll()`, and simulating that you throw the cube.
    When the method is performed the class variable `rand` is used. The class `Random`
    has a method called `nextInt()`, which returns a random non-negative integer.
    In this case, it is one of the values 0, 1, 2, 3, 4 and 5, and when one adds 1
    the result is a random value between 1 and 6 both inclusive. The class `Random`
    is defined in a package called `java.util`. In order to use classes in this package,
    it is necessary with an `import` statement. Here the `*` means that you can use
    all classes in the package.


    The class `Cube` also has a constructor. Since the variable `eyes` is not initialized,
    the default value is 0. This is unfortunate because it is an illegal value. Therefore
    the constructor rolls the cube and thus ensures that the cube’s value from the
    start is legal.


    The class has two other methods. The method `getEyes()` is a method that returns
    what the cube shows. It looks like what you met above. Then there are the method
    `toString()`, which returns the value of the cube as a text. The syntax of the
