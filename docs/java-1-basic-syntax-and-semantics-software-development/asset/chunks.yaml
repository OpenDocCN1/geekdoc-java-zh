    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_48.jpg)


    ### 定义浮点数的字面量


    如果浮点数或小数以字母 `F` 或 `f` 结尾，则被解释为 `float` 类型。否则，其类型为 `double`，也可以用字母 `D` 或 `d` 显式设置。你还可以用字母指定指数。


    ### 定义字符和字符串的字面量


    `char` 和 `String` 类型可以包含任何 Unicode（UTF-16）字符，`char` 使用单引号，`String` 使用双引号：


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17)


    Java 还支持用于特殊字符的转义序列：


    *   `\b` 退格

    *   `\t` 制表符

    *   `\n` 换行

    *   `\f` 分页符

    *   `\r` 回车

    *   `\"` 双引号

    *   `\\` 反斜杠


    考虑以下示例：


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_48)


    如果完成，你得到：


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_49)


    ### 数字字面量中使用下划线


    关于字面量的最后说明，我将提到在数字中使用 `_`。例如，这样写是合法的：


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_50)


    并且所有的 `_` 实例都会被忽略。其目的仅是增强大数字的可读性。有一些限制：


    *   数字不能以字符 `_` 开头或结尾

    *   字符 `_` 不能位于浮点数的小数点旁

    *   字符 `_` 不能位于 `F` 或 `L` 之前


    ## 4.3 对象


    Java 是一种面向对象的编程语言，在编写某些有趣的程序之前，你需要了解一些基本概念，以下是对对象、类、继承、接口和包的总体介绍，我将主要关注这些概念如何联系现实世界，同时提供
    Java 语法的基础介绍。


    对象是具有状态和行为的软件模块。软件对象通常用于建模现实世界对象。本节将解释表示状态和行为的对象，并引入数据封装的概念。重要的是解释以这种协作对象家族的方式设计软件的优势。


    对象是理解面向对象技术的关键。环顾四周，你会发现许多现实世界对象的例子。它可以是桌子、你的妻子、某个特定的同事、客户、你的电视机、你的汽车等等。这些对象具有两个特征：它们都有状态和行为。客户有名字、地址、电话号码、余额。这是客户的状态。客户可以订单产品、可以退货、可以支付产品费用。这是客户的行为。

