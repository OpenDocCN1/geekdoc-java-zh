  raw: 'When you have to write software, you need a tool that can be used to enter
    the program code, and in principle you could use a simple input program (a text
    editor) and then the compiler, but in practice you will always use a specific
    development tool, as it makes the job much easier. In the following I will everywhere
    use *NetBeans*, a development tool for a wide variety of tasks, including writing
    code in Java. It is an integrated software package, which includes all the tools
    necessary for the development of a number of different types of programs.


    Java is an object oriented programming language. The fundamental architectural
    element in a program is a *class*, and from the programmer’s point of view a Java
    program consists of a family of classes that collectively define all the application’s
    features and functionality. Writing a program is thus to define – design – and
    write the code to the program’s classes. Nothing in Java exists outside of a class.
    A program will also always apply other classes that are not written by the programmer,
    but classes coming from the Java API, and thus is available for the programmer
    as finished components. One of the program’s classes have a special role as the
    program’s “entry point” and the place where the program starts and this class
    should be written with a special naming, but it is almost the only formal requirements
    for the architecture of a Java program.


    Java is technically both a platform and a programming language. Seen as a programming
    language, it is a high-level language, which is characterized by


    *   it is a simple language


    *   it is an object-oriented language


    *   the language is architecture neutral


    *   Java programs are portable


    *   it supports development of multithreaded applications


    *   it supports the development of distributed applications


    *   it supports the development of programs with strong security


    *   development of effective programs


    *   development of robust programs


    *   development of maintenance-friendly and dynamic programs


    All Java code are as mentioned written as plain text files – which filename must
    have the extension *.java* – and then these files are translates to *.class* files.
    The translation is performed by the Java compiler called *javac*. Java class files
    do not contain machine code for a particular platform, but rather so-called *bytecode*,
    which is the machine code for the *Java Virtual Machine*, which is a virtual computer,
    commonly referred to as *VM* or *JVM*. The program (consisting of a set of class
    files) can then be carried out by the virtual machine, which is a program that
    is running on a particular machine. Since Java and thus the virtual machine is
    available for many different operating systems, the same class files can run on
    many machines for example Windows, Solaris, Linux, etc.


    With a platform wee understand the hardware and software, where a program is running,
    and in relation to an usual PC you can think of Windows, Linux and Mac machines.
    Compared to this is a Java platform a software-only solution that runs on a different
    hardware based platform. The Java Platform consists in principle of two parts:


    *   JVM, the *Java Virtual Machine*


    *   an API, the *Java Application Programming Interface*


    where the last is a large collection of ready to use software components that
    a program can use. They are grouped into libraries called *packages*, which consists
    of classes and interfaces.


    The result of the above technology is that Java programs, in principle, is a bit
    slower than programs translated into an actual physical machine. However, since
    Java was born there has been an incredible number of improvements and optimizations
    of both the compiler and the virtual machine, so the difference in performance
    is negligible if at all measurable.


    # 2 Hello World


    The subject of this chapter is to show how to write and run a Java program using
    NetBeans and the aim is solely to get started. There are several kinds of programs,
    or you can say that the programs can be categorized in several ways, but in the
    first books I will look at three types of programs:


    *   *commands*, which is a program that is typically performed from a command
    window (a *Terminal* ) where you enters the program’s name that may be followed
    by one or more arguments


    *   *consol applications*, which also is performed at a command prompt, but here
    the program runs in a dialogue with the user, where the user must enter values
    when the program is executed


    *   *GUI-programs*, where the program opens one or more windows with components
    as buttons and input fields used by the user to interact with the program


    This division is only for practical reasons, as I will sometimes characterize
    the program examples in relation to this, but common to the three types of programs
    is that they are standalone applications that run on a single machine and without
    using resources on other machines.


    I’ll start with the classic *Hello World* program, a program that prints a text
    on the screen. It is an example of a command, but it is also an example of a program
    that has absolutely no practical interest. Although it is a simple program, it
    will nevertheless treat a number of basic principles that apply to all Java programs.


    ## 2.1 NetBeans


    As mentioned a Java program is written as text files, which will then be translated.
    When the files are translated without errors the program can be executed by the
    virtual machine. In practice is always used a development tool, which is a program
    or software package that integrates all the functions that a developer needs.
    Such a tool is usually called an IDE (*Integrated Development Environment*), and
    there are several, but I will everywhere use *NetBeans*, which contains everything
    that is needed, and the following requires that both Java and NetBeans are installed
    on the machine. Do not have it, you can start by reading Appendix A which explains
    how to download and install both Java and NetBeans.


    To write the first Java program, open NetBeans and create a new project. In the
    menu, choose


    *File | New Project* (see below)


    A NetBeans project creates all the necessary files required to develop and test
    the program and eliminates a variety of configurations that are otherwise necessary.
    Using NetBeans you can build and run the program just by clicking the menu. To
    create the project, you must note that in this case,


    *   *Java* is marked in *Categories*


    *   *Java Application* is selected in *Projects*


    but otherwise I have not done anything in the first window.


    ![](image/Image26909.jpg)


    When you then click Next you get the following window:


    ![](image/Image26916.jpg)


    Here I:


    *   Entered *HelloWorld* as *Protect Name*


    *   Selected */home/pa/doc/noter/note01* for *Project Location*


    Regarding the latter, it is just a question that I have decided that the project
    should be created in the */home/pa/doc/notes/note01* direcory. I have also decided
    that the project should be called *HelloWorld*. NetBeans will then create a folder


    */home/pa/doc/noter/note01/HelloWorld*


    and all project files are placed by NetBeans in this folder. You should note that
    there is a checkmark in the *Create Main Class*, which is important.


    When you then click Finish, the project is created and NetBeans displays multiple
    windows:


    *   ![](image/Image26925.jpg)*Projects* window, where all the project’s components
    are organized in a hierarchy


    *   *Source Editor*, where there is an open file called *HelloWorld.java*


    *   *Navigater*, which can be used to quickly find a specific item'
