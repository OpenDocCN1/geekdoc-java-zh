    ### 接口


    对象的属性通过类定义的 `public` 方法对外部世界可见，并作为服务可用。方法构成了对象与外部世界的接口。为了定义对象的特征，你可以使用接口（interface），它定义了特定类对象的方法。例如，你可以如下定义一张钞票：


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_57.jpg)


    它看起来像是类的定义，但你应该注意到它仅仅是一个定义，而且接口不包含实现某些功能代码。


    给定一个接口，你可以定义一个类必须实现该接口。因此，你指定了该类拥有接口定义的方法。例如，`BankNote` 类可以如下所示实现接口 `Note`：


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_571.jpg)


    首先注意 `implements` 单词，它定义了该类实现了一个接口。这意味着该类应该有两个方法 `getValue()` 和 `print()`——它必须实现接口定义的方法。现在并不是这样，因为它没有实现
    `print()` 方法。它无法这样做，因为它不知道该方法应该如何编写。拥有这些知识的是派生类 `BankNote100` 和 `BankNote200`。这个问题通过将类定义为
    `abstract`（抽象的）得到了解决。然后该方法必须在派生类中实现，而事实也确实如此。一个类是 `abstract` 导致了进一步的结果：你不能实例化类型为抽象类的对象——在本例中为
    `BankNote`。这也是合理的，否则你就可以实例化任意值的钞票，这并不能以有意义的方式对现实世界进行建模。以下是 `main()` 程序的新版本：


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_58.jpg)


    这里再次创建两个对象，分别是一个 `BankNote100` 对象和一个 `BankNote200` 对象，但它们的类型是 `Note`。`BankNote100`
    特别是一个 `BankNote`，而它又是一个 `Note`。这意味着在程序的其余部分，仅从定义的接口就已知这两个对象，而在程序的其余部分，这些对象提供了
    `getValue()` 和 `print()` 两个服务。


    从上述内容，接口的优势并不显而易见，这一点稍后会变得清晰，但解释在于：程序中的 `note1` 和 `note2` 仅从定义的接口已知，这意味着这两个对象被视为是同等的，而与它们的具体类型无关。


