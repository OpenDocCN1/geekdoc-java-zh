    next statements are identical in principle and are used for entering other values.
    The last statements are used to print the result and is similar in principle to
    the previous version of the program, but the arguments *args[0]*, *args[1]*, …
    are replaced with variables. If you run the program (from NetBeans), the result
    could be as shown below:


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_322.jpg)


    Today it is rarely – if ever – developing console applications, and when is a
    need for a program with a user dialogue (and it is of course often), you write
    a Windows or GUI program. Console programs may, however, for testing and learning
    be useful, and therefore it is excellent to know how to write a simple console
    program.


    ## Problem 2


    You must solve the same task as in problem 1, but instead of transferring values
    as arguments on the command line, you must enter information about


    borrower’s name


    *   borrower’s address


    *   borrower’s zipcode and town


    *   ISBN of the book


    *   the books title


    when then the program is running in a dialogue with the user. The program should
    print the same recall as in problem 1.


    # 4 Variables and data types


    Programs has to deal with data, and for that they need a way where to save or
    store data. To that purpose programs use variables that are items, where the program
    may store a value. You must note that I have already used variables associated
    with data entry. A variable is characterized by


    *   a name


    *   a type


    *   operators


    Variables must have a name, so you can refer to them in the program. Java is similar
    to other modern programming languages relatively flexible in terms of naming variables,
    but the following shall (should) be met:


    *   a variable name must start with a letter, a dollar sign ‘$’ or an underscore
    ‘_’


    *   a variable name should always start with a lowercase letter, and one should
    avoid ‘$’ and only occasionally use ‘_’


    *   then have to follow any number of characters consisting of letters, digits,
    $ and _


    *   a name must not contain spaces


    *   the name of a variable must not be a reserved word, that is a word that has
    specific meaning in Java


    In addition a variable name should tell something about what it is used for. Use
    whole words instead of cryptic abbreviations. It will make the code easier to
    read and understand. If you have long names consisting of several words, you can
    increase readability by letting a word (except the first) start with a capital
    letter such as *customerAddress*. Alternatively, is there anyone who writes *customer_address*,
    but generally avoid very long names.


    If you do not break these rules, you have never problems with names of variables,
    but some other characters are actually allowed.


    Variables has a type that indicates which values can be stored in them, and how
    much a variable is filling in the machine’s memory. The type determines simultaneously
    the operations that can be performed on a variable, that is what to do with it.


    Variables must be created or declared before they can be used. This is done by
    a statement of the form:


    *type name = value;*


    That is, to write the type first, then the variable name and finally assign it
    a value, for example


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_35.jpg)


    Here is declared a variable called *number*, that has type *int* and the value
    23\. Variables should always be initialized, else you can get a translation error.


    When variables must be declared, it is because the compiler must allocate space
    in the machine’s memory, and that when the name appears somewhere in the code,
    the compiler must know what the name mean to check if the variable is used in
    the proper context. If not, the compiler will come up with an error message. The
    program can only be used when it is compiled without errors.


    Java has the following built-in primitive or simple data types:


    *   *byte*, which is a data type for an integer. A variable occupies 8 bits, and
    may contain values from -128 to 127 (both inclusive).


    *   *short*, which is a data type for integers. A variable takes up 16 bits and
    may contain values from -32,768 to 32,767 (both inclusive).


    *   *int*, which is a data type for an integer. A variable occupies 32 bits and
    can contain values from -2147483648 to 2147483647 (both inclusive). It is the
    default type for an integer.


    *   *long*, which is a data type for an integer. A variable occupies 64 bits and
    can contain values from -9,223,372,036,854,775,808 to 9223372036854775807 (both
    inclusive).


    *   *float*, which is a data type for floating point numbers and can thus be used
    for decimal numbers. A variable occupies 32 bits and can represent decimal numbers
    with 7–8 significant digits. It is important to note that the value is always
    a rounded result.


    *   *double*, which is a data type for floating point numbers and can thus be
    used for decimal numbers. A variable occupies 64 bits and can represent decimal
    numbers with 14 significant digits. It is important to note that the value is
    always a rounded result. This type is the default type for a floating point.


    *   *boolean*, which is a data type with only two values: *false* or *true*. The
    type is important to be able to write conditions and is used specially for program
    control.


    *   *char*, used for characters, and a variable of the type *char* takes up 16
    bits. Values are numeric codes with values from 0 to 65535 (both inclusive), and
    each character is represented by a numeric codes. For example has a large A the
    code 65.


    The smallest unit you can use on a digital computer is a *bit*, and the whole
    computer’s memory consists of a number of devices that can store one bit. One
    bit can represent one of two values, commonly referred to as 0 and 1, and the
    contents of the computer’s memory is always a large number of 0s and 1s. In practice,
    you cat not directly refer to the individual bits, but they are organized in groups
    of 8 bits, and such a group is called a *byte*. A byte is a pattern consisting
    of 8 bits, for example


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_36.jpg)


    What that means depends on how a program uses the pattern. Since each of the 8
    places in a byte, may have two values, a byte therefore can represent different
    values. As is clear from the above the simple data types are different in how
    many bits they use to a variable of that type. For example uses an *int* 32 bits
    (or 4 bytes), and this means that one can represent different integers that is
    interpreted as the numbers starting from -2147483648 to and including 2147483647.


    In addition to the eight primitive data types mentioned above, there is, as already
    mentioned a type *String* which can contain any text string. For example you can
    write


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_361.jpg)


    The statement creates a variable of the type String. You should note that you
    specify the value in quotes. The type *String* is not a primitive type, but it
    is instead a *class*, but for now you can ignore it, and variables of the type
    *String* is used in principle in the same way as other variables.


    Primitive variables are assigned a default value of the compiler. The type *boolean*
    have the default value *false*, a *char* has a space as the default value, while
    the other primitive types have the default value 0\. A *String* (which is not
    a primitive type) has no value, which is defined as *null*.


    As an example, the following statements creates three variables, all of the type
    *int*:


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_362.jpg)


    The first two variables are initialized with numbers, while the last is initialized
    to the sum of the first two. The last statement prints the values of the three
    variables.'
