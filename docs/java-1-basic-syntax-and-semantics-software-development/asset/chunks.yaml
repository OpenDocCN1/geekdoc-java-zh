    it is allowed to omit block boundaries { and } – as in the first example above.
    Some choose because of readability always to use { and }, even if there is only
    one statement, and it is up to you to choose what you find most readable. The
    condition must be an expression whose type is *boolean*, and thus an expression
    that evaluates to *false* or *true*.


