    The class has only two methods, but they are, in turn, complex both. The first
    must create a new lottery game, and it has this five parameters, where the first
    three are the game parameters (minimum lottery number, biggest lottery number
    and the number of lottery numbers in a row), next is the number of rows to be
    played, and finally the name of the file that will contain the result. With the
    class `LottoRow` available is in principle simple enough to create the wished
    number lotto rows, but the method must ensure not to create two identical rows,
    and the rows must be sorted before being written to the file. Finally, the method
    `create()` will write the rows to the file, and here it was decided that the first
    line should be the game’s parameters and week number. The method `validate()`
    is used to validate a lotto game against the weekly lottery. The method has three
    parameters, the first are the numbers for the week’s lottery, while the next is
    the name of the file with the games to be validated, and the last is the name
    of the file to the result. The method then should both read data from a file and
    write data to a file. The most difficult is of the course validating of the individual
    rows. The class `LottoCoupon` is definitely the program’s most complex class.


    For the last is the class `Lotto`, which is the class with the `main()` method.
    In principle, it is a simple method because it simply must create a `LottoCoupon`
    object and call one of the methods. Yet fills the code much, because the `main()`
    method must parse the command line, and this time there are many possibilities
    for the arguments. Finally, it is also the `main()` method that has to print an
    error message in case of an error.


    The program consists of a total of 5 classes, and the relationship can be illustrated
    by the following diagram:


    ![](image/Image28683.jpg)


    ## 9.2 Programming and test


    I will not show the code for each class here, but refers instead to the final
    solution. You are encouraged to study the code in detail and focus on how the
    methods are written and works, and there are many lines of code to address.


    When a program is finished, it must be tested. I would in other books specifically
    look at the test, which is not all so easy again, but in this case you must test
    the software with different combinations of options and check whether you get
    the expected result, and it is important to test all combinations and also combinations
    that result in an error.


    The program `Lotto` is as mentioned considerably larger than the examples which
    I otherwise dealt with in this book, but there is still talk about an example
    for the program’s fault, and it’s not a program that has no practical justification.
    There is still more about Java you have to learn to be able to write programs
    with value in the real world, and especially lacks what it takes to write a program
    with a graphical user interface. It is the subject of the next book in this series.
    When you study the program `Lotto`, you must especially think of the program as
    an example that consisting of several classes and how those classes jointly solve
    the current problem. Moreover, you can consider the example as a prototype of
    what is meant by a command, and how to write a command.


