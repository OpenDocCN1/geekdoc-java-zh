    该类只有两个方法，但它们彼此都非常复杂。第一个方法必须创建一个新的彩票游戏，它有这五个参数，其中前三个是游戏参数（最小乐票号码、最大乐票号码以及连续的乐票号码数量），接下来是需要绘制的行数，最后是包含结果的文件名。原则上，使用可用
    `LottoRow` 类来创建所需数量的彩票行已经足够简单了，但该方法必须确保不会创建两个相同的行，并且这些行在写入文件之前必须进行排序。最后，`create()`
    方法将这些行写入文件，这里决定第一行应该是游戏的参数和周数。`validate()` 方法用于验证彩票游戏与每周彩票中结果的匹配情况。该方法有三个参数，第一个是该周彩票的数字，下一个是待验证彩票游戏的文件名，最后一个是结果所在的文件名。然后，该方法既要从文件中读取数据，也要向文件写入数据。最困难的当然是对单行进行验证。`LottoCoupon`
    类无疑是程序中最复杂的类。


    最后是 `Lotto` 类，它是包含 `main()` 方法的类。原则上讲，这是一个简单的方法，因为它只需要创建一个 `LottoCoupon` 对象并调用其中一个方法。然而，它占据了大量代码，因为
    `main()` 方法必须解析命令行，而这次参数有许多可能性。最后，在发生错误时也由 `main()` 方法来打印错误信息。


    程序总共由 5 个类组成，其关系可以用下面的图所示：


    ![](img/Image28683.jpg)


    ## 9.2 编程与测试


    我将在此处展示每个类的代码，而是参考最终解决方案。鼓励你详细研究代码，并关注方法是如何编写和运行的，这里有很多行代码需要处理。


    程序完成后，必须进行测试。在其他书中，我通常会专门查看测试部分，这并不容易，但在这种情况下，你必须使用不同的选项组合来测试软件，并检查是否得到了预期的结果，测试所有组合以及会导致错误的组合组合是非常重要的。


    如前所述，`Lotto` 程序比我在书中其他处理过的示例要大得多，但仍然提到了关于程序错误的示例，而且这不是一个没有实际意义的程序。为了能够编写在现实世界中有价值的程序，你还需要学习更多
    Java 知识，特别是缺少编写带有图形用户界面程序所需的要素。这是本系列下一本书的主题。当你学习 `Lotto` 程序时，你必须特别将该程序视为一个由多个类组成的示例，以及这些类如何共同解决当前问题。此外，你可以将此示例视为什么是命令的原型，以及如何编写一个命令。


