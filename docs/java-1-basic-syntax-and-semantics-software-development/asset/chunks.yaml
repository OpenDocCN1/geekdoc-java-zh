    The initialization is performed only once and will typical initialize one or more
    variables. The variables created here, is known only in the statement. After the
    initialization the `for` statement test a condition, and if it is the `true`,
    executes the next block. If the condition is not `true`, the statement is ended,
    and the program continues with the next statement after the `for` statement. After
    the block have been executed the expression part is performed, and the condition
    is tested again. In the case where the block consists of only a single statement,
    it is as for the other control statements allowed to delete the parentheses `{`
    and `}`.


