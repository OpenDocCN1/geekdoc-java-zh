    with a random number. The next `for` loop checks to see if this number is found
    in the array, and if so, save the index of the element in a variable `n`. When
    the item is found, there is no need to search far and I therefore wants to interrupt
    the loop. This can be done with `break`, and the method continues with the first
    statement after the loop.


    The possibility to break out of a loop in this way is quite reasonable and has
    many uses. `break` can be used in the same way if the loop is `do` or `while`.


    Consider then the following method, which just is a helper method in the program:


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_99.jpg)


    This method creates a random string whose characters consist of lowercase letters
    and digits. The string length is between 10 and 39 characters. You must specifically
    note the method `charAt()`, which is a method in the class `String`, which allows
    you to refer to the individual characters in a string.


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_991.jpg)


    is thus, an arbitrary character in the string


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_992.jpg)


    There is a control statement that is called `continue` and is in many ways an
    allternative to `break`. Consider the following method:


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_993.jpg)


    The method creates a string of random characters – using the method `create()`.
    Then the method iterates through the string in a `for` loop, to build a substring
    consisting of all characters that are digits. Note again the use of the method
    `charAt()`. When in the loop there is a specific character, that it is not a digit:


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_994.jpg)


    you can go to the next character, and here it is done with a `continue`. This
    means that controle is transfered to the end of the block, and hence skips the
    statement


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_100.jpg)


    `continue` is not used so often, but it has its uses. Note also that the problem
    in this case could be solved in other ways than using `continue`.


    If one has a loop inside an other, and use `break`, it is only the inner loop,
    which is interrupted. If you wish to interrupt several levels, you can use a label.
    Consider the following method:


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_101.jpg)


    This method creates again an array with 10 elements. Next, it determines in the
    same manner as `test()` a random number, and searches for the number in the array.
    If the number is found, the index in the array is assigned to a variable `n`,
    but when the number is found, wee want to end the search, and that is done by
    a `break` to a label:


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_101.jpg)


    The code above is by no means beautiful and is also only included as an example
    of how to use `continue`. There is a reason to warn against excessive use of the
    `continue`, as the statement easily leads to code that is hard to read and understand.


    Note the outer for loop:


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_102.jpg)


    It is an example of an infinite loop.


    Also, the `continue` can apply a label. It is an opportunity that rarely used,
    but the following method shows how:


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_103.jpg)!(image/Java_1_-_Basic_syntax_and_semantics_23-3-17_104.jpg)


    The method starts by creating a string consisting of 10 substrings created with
    `create()` and separated by line breaks. Then the string is traversed from start
    to finish in a `for` loop, but this is preceded by a label. The loop has an inner
    loop that performs the same as `test()` and determines a partial string consisting
    of digits. You should note that the inner loop counts of (use) the same index
    as in the outer loop. If the inner loop encounters a line break, it prints the
    number that is determined, and then performs a `continue` to the label `next`.
    This means that the control continues at the end of the block of the outer `for`
    loop, and the next operation is performed after the outer loop counter is counted
    up by 1. The result of it all is that the method print any number (10 numbers)
    which appears as a substring in a line.

