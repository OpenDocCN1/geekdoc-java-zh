    当 NetBeans 创建项目时，它也会创建一个包，并将项目的类和接口放在该包中，例如


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_59.jpg)


    这意味着接口在 `bankprogram` 包中。只要项目只包含一个包，你就不需要考虑它，但它恰意味着类型 `Note` 的名称是


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_591.jpg)


    `package` 语句定义了类型所属的包。它必须是定义类型文件的第一条语句，但前面可以跟一个注释。


    Java 平台包含一个巨大的库（包的集合），其中包含了程序员可以在自己的应用程序中使用的组件。这个库被称为 `Application Programming
    Interface`（应用程序编程接口），通常缩写为 `API`。它的包代表了与程序开发中通用问题最相关的任务，例如用于开发具有图形用户界面应用程序的包。


