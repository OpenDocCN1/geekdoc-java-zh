    ## 5.5 return 语句


    `return` 语句已经在使用多次，但它也可以被视为一种控制语句。通常情况下，该语句会中断方法，并将控制权传递到调用该方法的地方。特别注意，`main()`
    方法中的 `return` 语句会中断 `main()` 从而停止程序。如果该方法是一个 `void` 方法，则在 `return` 之后不应该有任何内容，其效果只是方法终止。然而，如果方法有类型，那么在
    `return` 之后必须是一个与方法类型相同的表达式。该方法将返回该表达式的值，该值随后可以传回调用代码。你应当特别注意，方法完全可能有多个 `return`
    语句，通常由 `if` 语句控制。


    ## 5.6 break 和 continue


    在结合 `switch` 语句时，我一直将 `break` 作为中断 `switch` 语句的语句。`break` 也可以用于中断循环。


    考虑以下方法，其中 `rand` 是一个随机数生成器，在程序开始时创建（称为 `BreakContinue`）：


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_98.jpg)


    该方法创建了一个包含 10 个整数的数组，变量 `elem` 初始化为一个随机数。接下来的 `for` 循环检查该数字是否在数组中找到，如果是，则将元素的索引保存在变量
    `n` 中。当找到该项时，没有必要继续向下搜索，因此我想要中断循环。这可以通过 `break` 实现，方法将继续执行循环后的第一个语句。


    以这种方式跳出循环是非常合理的并且有许多用途。如果循环是 `do` 或 `while` 结构，`break` 以相同的方式使用。


    接着考虑以下方法，它只是程序中的一个辅助方法：


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_99.jpg)


    该方法创建了一个随机字符串，其字符由小写字母和数字组成。字符串长度在 10 到 39 个字符之间。你必须特别注意 `charAt()` 方法，它是 `String`
    类中的一个方法，允许你引用字符串中的单个字符。


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_991.jpg)


    因此是字符串中的一个任意字符


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_992.jpg)


    有一种名为 `continue` 的控制语句，它在许多方面都是 `break` 的替代方案。考虑以下方法：


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_993.jpg)


    该方法使用 `create()` 方法创建一个随机字符字符串。然后该方法通过 `for` 循环遍历字符串，以构建一个由所有数字字符组成的子字符串。再次注意
    `charAt()` 方法的使用。当循环中遇到某个特定字符且它不是数字时：


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_994.jpg)


    你可以跳转到下一个字符，这里是通过 `continue` 实现的。这意味着控制权转移到块的末尾，从而跳过语句


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_100.jpg)


    `continue` 并不经常被使用，但它有自己的用途。同样注意，这种情况下的问题可以使用使用 `continue` 以外的方法解决。


    如果一个循环嵌套在另一个循环内部并使用 `break`，只有内层循环会被中断。如果你希望中断多层，可以使用标签。考虑以下方法：


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_101.jpg)


    该方法再次创建了一个包含 10 个元素的数组。接下来，它以与 `test()` 相同确定一个随机数并在数组中搜索该数字。如果找到了数字，则将索引赋值给变量
    `n`，但当找到数字时，我们想要结束搜索，这是通过带有标签的 `break` 实现的：


