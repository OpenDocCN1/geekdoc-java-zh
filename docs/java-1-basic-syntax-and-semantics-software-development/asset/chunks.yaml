    在这里，`args[0]` 的值将被转换为一个整数——一个 `int` 类型——并存储在变量 `a` 中。为了实现这一点，`args[0]` 必须包含一个合法的整数。如果不是（因为用户指定了非法值），则转换将抛出异常，这意味着转换将因错误中断。当你有可能会抛出异常的代码时，必须将其放在
    `try` 块中。如果是这样并且发生了异常，运行时系统会中断 `try` 块，并将控制权转移到后续的 `catch` 块。在这种情况下，这意味着三个参数之一不能转换为
    `int`，程序将跳转到 `catch` 部分并打印错误信息。


