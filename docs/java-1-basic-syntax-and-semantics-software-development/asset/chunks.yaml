    In section 4.4, I have shown a `Cube` with six sides. In this section I will show
    a class that can represent a cube. It is a container, which may include cubes,
    and therefore the class can be implemented as an array of the type `Cube`. The
    class must also have a method that displays the content of the cup. Correspondingly,
    the class can be written as follows:


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_74.jpg)


    The variable `arr` is an array of type `Cube`, but it is not created in the declaration
    but in the constructor. The reason is to make the class more general and the constructor
    has a parameter that tells how many `Cube` objects the cup must contain. You should
    note that the constructor explicitly must create the `Cube` objects that happens
    in a `for` loop.


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_741.jpg)


    simply creates an array with space for `n` `Cube` objects, but not the concrete
    `Cube` objects. The method `toss()` simulates that you toss with the cup. This
    is done by using a `for` loop that traverses all the `Cube` objects in the array
    `arr` and throwing them by calling the `roll()` for every `Cube` object. Instead
    of a method that prints the contents of the cup, the class has a `toString()`
    method that returns the contents of the cup as a `String`, that is the values
    of the individual cubes separated by spaces.


    The class has a method `yatzy()` which returns `true` or `false`. The method must
    test if all cubes are the same, and it is done by a `for` loop that iterate through
    the cubes and by means of an `if` statement test whether there is a cube, which
    is not equal to the first cube (has the same value as the value of the first cube).
    In this case, all the cubes are not identical, and the method returns `false`.
    Coming throughout the loop, it means that all cubes are equal to the first cube,
    and thus all cubes are equal, and the method returns `true`.


    `if` is also an example of a control structure, and it will also be explained
    in the next chapter, but it allows to introduce a condition in a program so that
    a statement is executed only if the condition is `true`. In this case, the statement
    is


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_75.jpg)


    and after `if` there is a condition in parentheses. If the condition is `true`,
    this means that the two cubes have a different number of eyes, and the next statement
    is performed, which is a return statement. This means that the method ends with
    the value `false`. If the condition is not `true`, the subsequent statement is
    simply ignored, and in this case it means that the `for` statement continues.

