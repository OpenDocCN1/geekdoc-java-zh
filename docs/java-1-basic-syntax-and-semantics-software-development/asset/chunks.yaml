    ## 8.2 对象的序列化


    也可以将对象存储在文件中，实际上这并不简单。当文件本质只是一系列字节流时，这意味着对象及其数据必须流化到一个字节序列中，这个过程被称为 `serialization`（序列化）。这可能并不困难，但对象必须能够被再次读取，并且能够将字节序列转换为某种类型的对象。只有在保存对象的同时也保存了其类型信息时，这才是可能的，而且序列化不仅要流式传输对象的数据，还要传输类型信息。有了这些信息，就可以从字节序列恢复对象，我们称这个过程为
    `deserialization`（反序列化）。听起来很复杂，事实也如此，但从程序员的角度来看，它是简单的，因为 Java 提供了必要的类来处理好一切。


    我将编写一个程序，存储一个包含 `Name` 类型对象的 `ArrayList`，这个类就是你在第 7 章中看到的那个类，但有一处变化：


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_120.jpg)


