  trans: '

    软件对象是概念性的，但看起来像真实世界中的对象。它们也拥有状态和相关的行为。对象在变量或字段中存储其状态，并通过方法执行其行为。作用于对象内部状态的方法是对象与对象之间通信的主要机制。隐藏对象的内部状态并要求所有交互必须通过对象的方法进行，这被称为**数据封装**，它是面向对象编程的一个基本原则。通过数据封装，由对象本身来控制其状态如何发生变化，因为是该对象通过其方法决定了外部世界可以对它做什么。


    上面我已经处理了 Java 中的变量，但变量可以是多种形式，基本上有以下几种情况：


    1.  **实例变量**（非静态字段），对象用它们来存储自己的状态。类中定义为非静态的所有变量都是实例变量，该类的每个对象都有自己的实例变量，因为一个特定对象的状态独立于所有其他对象的状态，即使它们是同一类的对象。

    2.  **类变量**（静态字段）是定义为 `static` 的变量。除此之外，它们的创建方式与实例变量相同，但这些变量只会被创建一个副本，特定类的所有对象将共享所有的类变量。因此，静态变量设计用于存储类所有对象共同使用的值。

    3.  **局部变量**在原则上的创建方式与实例变量相同，但它们是在方法中创建的，并且仅该方法已知。我在上面使用的所有变量都是局部变量。它们通常用于存储方法完成其工作所需的所需的临时值。实例变量和类变量如果没有被程序员初始化，则有一个默认值。相比之下，局部变量必须用一个值进行初始化。局部变量在定义它的方法被调用时创建，当方法完成后，变量就会被自动删除。

    4.  **参数**是你在方法名后的括号中指定的变量。参数看起来有点像局部变量，但它们用于在调用方法时将值传递给方法。因此，可以将参数看作定义了方法应该操作的值的变量。`main()`
    有一个名为 `args` 的参数，用于从命令行将参数传递给程序。


    将程序代码构建为一组软件对象提供了许多优势：


    *   **模块化**，其中一个对象的代码可以独立于其他对象的代码进行编写和维护。

    *   **信息隐藏**，其中与对象的所有交互都通过其方法进行。关于对象状态和内部实现的细节对外部世界保持隐藏。

    *   **代码复用**，其中已经开发的对象（可能由另一个软件人员编写）可以在当前程序中使用。它允许由专家进行对象的开发和测试，你可以信任它们并在自己的程序中使用它们。

    *   **可修改性**，其中如果由于原因发现某个对象不合适，可以在不影响程序其他部分的情况下用另一个替换。


    在现实世界中，你经常会遇到许多相似且相同的个体对象。有成千上万辆汽车，它们是相同的型号，构造方式完全相同，且具有相同的组件。在面向对象的世界里，我们说某个特定的汽车是特定型号
    `cars` 类的一个实例。类是对特定汽车如何行为的描述。


    我们在软件方面也使用相同的原理。假设一个程序需要钞票对象。钞票的特征是一个值，这是钞票的状态，你对钞票唯一做的就是读取它的值并知道钞票的样子，以便将其与其他钞票区分开。因此，你可以这样定义钞票的概念：


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_53.jpg)


    这是一个 Java `class` 的示例，这里它的名为 `BankNote`。正如提到的，一张具体的钞票有一个值，即钞票的状态，这个值必须存储在某处。为此，类定义了一个名为
    `value` 的变量。变量有一个类型，这里是 `int`，意味着该变量可以包含一个整数。变量 `value` 是实例变量的示例。该变量被定义为 `private`，这意味着它只能从类本身引用，这就是我所说的数据封装。类应该用于某些用途，你应该能够读取钞票的值。该类有一个名为
    `getValue()` 的方法，它的值是钞票的值，即变量 `value` 的值。这个方法定义了对象的行为。注意该方法有一个类型，这里是 `int`。我们说该方法返回一个值。类还有另一个与类名相同的方法。它是一个特殊方法，不定义对象的行为，而是用于在创建新对象时初始化对象的状态。这种方法被称为`构造函数`（constructor）。


    你应该注意，该类没有 `main()` 方法，因为类不是程序，而仅仅定义可以被任何应用程序使用的概念。


    有了 `BankNote` 类，程序就可以创建 `BankNote` 对象并对其进行某些操作。下面是一个创建两个 `BankNote` 对象的程序的 `main()`
    方法。第一个的值值为 100，而下一个的值为 200：


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_54.jpg)


    你需要特别注意如何创建一个对象。对象有一个名称，例如 `note1`，这是一个变量。对象还有一个类型，这里是 `BankNote`，当类型是一个类而不是基本类型时，必须使用
    `new` 运算符创建对象。在这里你指定了钞票的值，这意味着类的构造函数被执行并将值传递给对象的实例变量 `value`。如果执行 `main()` 方法，它将打印两个
    `BankNote` 对象的值。为了实现这一点，你必须引用 `BankNote` 对象的值。由于数据封装，这是不可行的，但 `BankNote` 对象有一个
    `getValue()` 方法的行为，所以你可以引用该值。


    ### 继承


    不同类型的对象通常具有许多共同的特征。如果你考虑钞票，它们都有值，但在外观上有所不同。它们有不同的颜色，显示不同的图案。在面向对象编程中，类可以相互继承。这意味着你可以将共同属性收集在基类中，而将差异可以放在派生类中。下面是一个代表钞票的类，其值为
    100（一张丹麦钞票）：


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_55.jpg)


    该类名为 `BankNote100`，在类名之后你使用单词 `extends` 定义该类继承 `BankNote` 类。这意味着该类继承了 `BankNote`
    的所有属性，并扩展了新的属性。在这种情况下，`BankNote100` 扩展了 `BankNote` 并增加了一个 `print()` 方法来模拟钞票的样子。`BankNote`
    类有一个构造函数初始化变量 `value`。`BankNote100` 也必须初始化这个变量（值为 100）。这在类的构造函数通过 `super(100)`
    实现，这意味着基类的构造函数被执行了。

    '
- fmt: '

    It is clear that in quite the same way you write a class `BankNote200` representing
    a banknote with the value 200.


    With these classes available you can write the following `main()` method:


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_56.jpg)


    Here, you create two objects of the types respectively `BankNote100` and `BankNote200`.
    Next the objects `print()` method is called. Note the syntax, and how to perform
    a method on an object using the dot operator. The last statement prints the sum
    of the two objects values. Here you should note the use of the method `getValue()`.
    It is defined in the class `BankNote`, but is inherited to the classes `BankNote100`
    and `BankNote200`.


    Often wee illustrate inheritance as follows:


    ![](image/Image27557.jpg)


    In this context the base class `BankNote` is also called a `superclass` while
    the derived classes `BankNote100` and `BankNote200` are called `subclasses`. Sometimes
    wee also say that `BankNote` is a generalization of `BankNote100` and `BankNote200`
    while these classes are called specializations of `BankNote`.


    ### Interfaces


    An object’s properties are known to the outside world through the `public` methods
    that the class defines and thus made available as services. Methods form the object’s
    interface to the outside world. In order to define an object’s characteristics,
    you can use an interface which defines the methods of an object of a certain class.
    For example you can define a banknote as follows:


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_57.jpg)


    It looks like the definition of a class, but you should notice that it simply
    is only a definition and that the interface does not contain code that implements
    something.


    Given an interface you can define that a class must implement this interface.
    Thus you specify that the class has the methods that the interface defines. For
    example the class `BankNote` can implement the interface `Note` as follows:


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_571.jpg)


    Note first the word `implements` that defines that the class implements an interface.
    This means that the class should have two methods `getValue()` and `print()` –
    it must implement the methods that the interface defines. It is not the case,
    since it do not implements the method `print()`. It can not do that because it
    does not know how this method should be written. It is the derived classes `BankNote100`
    and `BankNote200`, that has that knowledge. The problem is solved by defining
    the class as `abstract`. The method then has to be implemented in the derived
    classes, what it indeed is. That a class is `abstract` has further that consequence
    that you can not instantiate objects whose type is the abstract class – in this
    case `BankNote`. It is also reasonable, else you could instantiate notes with
    an arbitrary value, which does not model the real world in a meaningful way. Below
    is a new version of `main()` program:


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_58.jpg)


    There will again be created two objects, respectively a `BankNote100` and a `BankNote200`
    object, but their type is `Note`. A `BankNote100` is especially a `BankNote`,
    which is again a `Note`. This means that the two objects in the rest of the program
    alone is known from the defining interface and then in the rest of the program
    are objects that provides two services `getValue()` and `print()`.


    From the above, it is not obvious what the advantage of interfaces are and it
    will first be clear later, but the explanation must be sought in that, `note1`
    and `note2` in the program only are known from the defining interface, which means
    that the two objects are treated equally independent their specific types.


    The project `BankProgram` implements the above classes and interface.


