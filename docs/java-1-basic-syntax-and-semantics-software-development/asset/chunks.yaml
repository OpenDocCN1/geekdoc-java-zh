    line:


    *   All options which have a default value (*a*, *b*, *r*, *o*) may be omitted.


    *   Options may appear in any order.


    *   There must be no conflicting options (for example *-r* and *-i*) on the same
    command line.


    The concept of a lottery ticket is not included in the solution as it in this
    program does not make sense – a lottery game is basically one large coupon that
    can have any number of rows.


    In terms of the result of a lottery there are the following requirements:


    1.  The numbers in each lotto row should be sorted in ascending order.


    2.  The same row must not occur several times.


    3.  The rows should be sorted in ascending order (after the first number, after
    the next number, etc.).


    4.  The first line in the result defines the game and contains the smallest and
    largest legal lottery number, and the number of values in a row and the week number.


    With regard to the results of the verification it is a file (the screen by default)
    that contains all rows, but where each row is added a number indicating the number
    of correct values. The result is sorted by this number in descending order.


    If you enter an illegal command, for example because it is wrong, missing or conflicting
    options, illegal lottery numbers, illegal files, etc., the program must terminate
    with an error message and the program syntax. If checking the week’s lottery there
    is an illegal row, the number after the row should be replaced with a short error
    message, and possibly illegal rows should be added last in the result.


    Boundaries for the program’s parameters are:


    ![](image/text01_87.jpg)


    Boundaries for the program’s parameters areThat is a lottery number maximum can
    have two digits, and a lottery row can have up to 15 numbers. In the same way
    there are some minimum requirements. There are really not many reasons for these
    requirements in addition to making it easier to formats the result and avoiding
    some special cases, such as the game can be empty.


    ## 9.1 Design


    The above can be seen as a specification of requirements for the program to be
    written. The program can be written in many ways, and from the one that use the
    program it plays no great role, as long as the program meets the requirements,
    but in practice, programs must be maintained, and here it is very important how
    the program is written. It is important that the program is written in such a
    way that the code is easy to read and understand, and it is important that the
    code is written so that a change in one place does not mean that large parts of
    the program must be rewritten. To meet these goals the program must be organized
    into good classes, and the question is what it is and how to find and write these
    classes. It is not simple, and there is not a unique solution, and this is largely
    what the following books is about, but below will explain a little about how this
    program is organized into classes, and thus the program’s architecture.


    If one considers the concept of a lottery row, then it is a sequence of different
    integers (lottery numbers) within a range. The lotto number is nothing more than
    an *int*, but I have nevertheless chosen to define a class to represent a lottery
    number. The reason is that the class must be able to validate a lottery number
    and check that it is legal in relation to the current lotto game, and the program
    should therefore have the following class:


    ![](image/Image28645.jpg)


    Often you will in system development illustrate the classes that way. It says
    that the program must have a class called *LottoNumber*, and this class must have
    a private *int* variable called *number*. In this case, this number represents
    the value of a lottery number. The figure also shows that the class should have
    two constructors, where the first is a default constructor that should create
    a *LottoNumber* object with a random legal value, while the other has the value
    as a parameter. It must be used when the program creates the week’s lottery. In
    addition the figure shows that the class must have a method *getNumber()* to returns
    the lottery number’s value.


    The class *LottoNumber*, must as mentioned validate a lottery number and should
    therefore know what are legal values. In this case, it is solved by defining the
    following class


    ![](image/Image28653.jpg)


    The class should have a method *init()* with three *int* parameters which indicates
    the minimum legal lottery number, the largest legal lottery number and the number
    of lottery numbers in a row. The class has methods that can return these values.
    In the figure, the methods are shown underlined, which means that they are *static*
    methods and can be used without having an object. The details concerning static
    and non-static members in a class is explained in the book Java 3, and here it
    is enough to know that static methods in a class can be used anywhere in the application
    without having any object. Static methods are referenced using only the class
    name. The solution was chosen because the three values concerning a concrete lotto
    game must be available throughout the program. It should be emphasized that it
    is not the best solution, but it is the solution that is feasible with what until
    this place is said about Java.


    With this class available, it is clear that the class *LottoNumber* and its methods
    can validate whether a lottery number is correct.


    The two classes *LottoNumber* and *LottoGame* is both simple, but the next class
    is more complex:


    ![](image/Image28660.jpg)


    The class represents a lottery row, and thus a sequence of lottery numbers. The
    class has two constructors, where the first must create a lottery row with random
    lottery numbers, while the other creates a lottery row with specific numbers and
    should be used to represent the week’s lottery. Both constructors must ensure
    that the lottery row created is legal in relation to the current lottery game,
    and therefore have to use the class *LottoGame*. In particular, is the first constructor
    complex since it must ensure the creation of a lottery row where all the numbers
    are different, and that the row’s numbers are sorted in ascending order. The class
    should have a method *validate()* with a parameter that is a *LottoRow*. This
    parameter represents the week’s lottery, and the method should be used to determine
    how many correct numbers there are on the current row. The result is that the
    method updates the *result* variable, and when it is private, there is also a
    method that can return the value.


    The class *LottoRow* must consist of a number of *LottoNumber* objects, but instead
    of showing it as a variable in the class’s figure, we show it as a link between
    the two classes:


    ![](image/Image28668.jpg)


    Here the * tells that a *LottoRow* object refers to several *LottoNumber* objects.


    There is also a need for a class that may represent a number of lottery rows and
    thus a particular lottery game. Although I opposite has mentioned that the program
    not uses a concept similar to a lottery coupon, I have decided to call the next
    class for *LottoCoupon*, and one can think of the class as a concept similar to
    a lottery ticket of any size:


    ![](image/Image28675.jpg)'
