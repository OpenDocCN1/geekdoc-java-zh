    ## 5.5 return statement


    The `return` statement is already used many times, but it can also be perceived
    as a control statement. In general the statement interrupts a method and the control
    is passed to the place where the method was called. Note specifically that a `return`
    statement in the `main()` method interrupts the `main()` and thus stops the program.
    If the method is a `void` method there should not be anything after the `return`,
    and the effect is only that the method is terminated. If, however, the method
    has a type, then there after the `return` must be an expression of the same type
    as the method. The method will then return the value of this expression, a value
    which may then be sent back to the calling code. You should particularly be noted
    that a method may well have multiple return statements, typically controlled by
    an if statement.


    ## 5.6 break and continue


    In conjunction with the `switch` statement, I have been using `break` as a statement
    that interrupts a `switch` statement. `break` may also be used to interrupt a
    loop.


