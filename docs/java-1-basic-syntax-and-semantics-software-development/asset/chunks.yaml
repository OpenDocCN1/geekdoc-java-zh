    ## 9.1 Design


    The above can be seen as a specification of requirements for the program to be
    written. The program can be written in many ways, and from the one that use the
    program it plays no great role, as long as the program meets the requirements,
    but in practice, programs must be maintained, and here it is very important how
    the program is written. It is important that the program is written in such a
    way that the code is easy to read and understand, and it is important that the
    code is written so that a change in one place does not mean that large parts of
    the program must be rewritten. To meet these goals the program must be organized
    into good classes, and the question is what it is and how to find and write these
    classes. It is not simple, and there is not a unique solution, and this is largely
    what the following books is about, but below will explain a little about how this
    program is organized into classes, and thus the program’s architecture.


    If one considers the concept of a lottery row, then it is a sequence of different
    integers (lottery numbers) within a range. The lotto number is nothing more than
    an `int`, but I have nevertheless chosen to define a class to represent a lottery
    number. The reason is that the class must be able to validate a lottery number
    and check that it is legal in relation to the current lotto game, and the program
    should therefore have the following class:


    ![](image/Image28645.jpg)


    Often you will in system development illustrate the classes that way. It says
    that the program must have a class called `LottoNumber`, and this class must have
    a private `int` variable called `number`. In this case, this number represents
    the value of a lottery number. The figure also shows that the class should have
    two constructors, where the first is a default constructor that should create
    a `LottoNumber` object with a random legal value, while the other has the value
    as a parameter. It must be used when the program creates the week’s lottery. In
    addition the figure shows that the class must have a method `getNumber()` to returns
    the lottery number’s value.


    The class `LottoNumber`, must as mentioned validate a lottery number and should
    therefore know what are legal values. In this case, it is solved by defining the
    following class


    ![](image/Image28653.jpg)


    The class should have a method `init()` with three `int` parameters which indicates
    the minimum legal lottery number, the largest legal lottery number and the number
    of lottery numbers in a row. The class has methods that can return these values.
    In the figure, the methods are shown underlined, which means that they are `static`
    methods and can be used without having an object. The details concerning static
    and non-static members in a class is explained in the book Java 3, and here it
    is enough to know that static methods in a class can be used anywhere in the application
    without having any object. Static methods are referenced using only the class
    name. The solution was chosen because the three values concerning a concrete lotto
    game must be available throughout the program. It should be emphasized that it
    is not the best solution, but it is the solution that is feasible with what until
    this place is said about Java.


    With this class available, it is clear that the class `LottoNumber` and its methods
    can validate whether a lottery number is correct.


    The two classes `LottoNumber` and `LottoGame` is both simple, but the next class
