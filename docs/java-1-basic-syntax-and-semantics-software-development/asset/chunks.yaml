    ## 4.1 Operators


    The operators are special symbols known by the compiler, that perform specific
    operations on one, two or three operands, which are typically values, or variables.
    Above I have already used the `+` operator, as an operator between strings that
    act as string concatenation, while the operator between numbers is interpreted
    like addition. Also a declaretion in which a variable is assigned a value, the
    equating is an operator.


    The operators have different priorities, which affect the order in which they
    are evaluated if an expression contains multiple operators, and the following
    table shows Java’s operators in order of priority with falling priority down.
    If an expression contains multiple operators, the operators with the highest priority
    are evaluated first. Operators with the same priority are evaluated from left
    to right. It does not apply to the assignment operators, which is evaluated from
    right to left.


    | Priority | Operators |

    | --- | --- |

    | postfix | `expr++` `expr--` |

    | unary | `++expr` `--expr` `+expr` `-expr` `~` `!` |

    | multiplicative | `*` `/` `%` |

    | additive | `+` `-` |

    | shift | `<<` `>>` `>>>` |

    | realtional | `<` `>` `<=` `>=` `instanceof` |

    | comparing | `==` `!=` |

    | bitvis AND | `&` |

    | bitvis XOR | `^` |

    | bitvis OR | `|` |

    | logisk AND | `&&` |

    | logisk OR | `||` |

    | question operator | `? :` |

    | assignment | `=` `+=` `-=` `*=` `/=` `%=` `&=` `^=` `|=` `<<=` `>>=` `>>>==`


