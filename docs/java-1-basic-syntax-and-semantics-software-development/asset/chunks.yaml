    # Java 1：基础语法与语义：软件开发


    Java 1：基础语法与语义：软件开发

    第一版

    © 2017 Poul Klausen & [bookboon.com](http://bookboon.com)

    ISBN 978-87-403-1689-6

    由 Ove Thomsen, EA Dania 同行评审


    ## 前言


    本书是软件开发系列书籍中的第一本。编程语言是 Java，虽然该语言及其语法和语义显然占据了大量内容，但这些书在很大程度上也关注开发过程以及如何开发良好且健壮的应用程序。本书的主题是
    Java 编程语言的介绍，重点是基础语言语法和语义，但它也是一本关于什么是通用编程，以及如何在实践中编写和测试简单程序的书。本书不需要任何关于编程或 `Java`
    语言的知识，目标是展示如何开始编写计算机程序。在阅读本书并完成书中的练习和问题后，读者应该能够使用 `Java` 语言编写简单的控制台应用程序。


    如标题所示，该系列书籍涉及软件开发，目标是教读者如何在 `Java` 中开发应用程序。可以通过阅读相关主题和学习完整的示例程序来掌握，但最重要的是亲自动手操作并从零开始编写自己的程序。因此，书中的重要部分是练习和问题，读者必须编写与书中处理的内容相对应的程序。该系列所有的书籍都围绕同一个骨架构建，将由文本、示例、练习和问题组成，这些内容被放置在文中自然的位置。练习和问题的区别在于，练习在很大程度上是对文中阐述内容的重复，并且对操作内容描述得相对准确。相比之下，问题的描述较为松散，通常规模大一些，而且很少有明确的最佳解决方案。这些书是应该从头读到尾的，但许多代码示例（包括练习和问题）起着核心作用，让读者详细地预测研究许多示例中的代码至关重要，并解决练习和问题，或者可能只是研究推荐的解决方案。


    所有书籍都以一或两个较大的示例程序结束，这些程序主要关注过程以及对程序如何编写的解释。另一方面，代码仅在有限范围内出现——如果有的话——读者应该可能在测试程序时学习学习完成的程序代码。除了展示比文中所示例更大的程序开发过程外，结尾示例的目的还在展示来自不同应用领域的程序示例。


    大多数书籍还以一个附录结束，处理书中未涉及的主题。这可能是关于软件安装问题或其他计算机技术主题，这些主题不属于软件开发，但有时需要入门知识。如果读者已经熟悉该主题，可以跳过当前的附录。


    编程语言如前所述是 `Java`，除了书籍外，还使用了以下产品：


    * `NetBeans` 作为应用程序开发的 IDE

    * 在需要数据库服务器时使用 `MySQL`（从 `Java 6` 书籍开始）

    * `GlassFish` 作为 Web 服务器和应用程序服务器（从 `Java 11` 书籍开始）


    这些产品都是免费且免费安装的，甚至提到了某些产品，其安装过程是自动的，不需要付出巨大的努力和挑战。此外，网上有针对这三个产品的详细安装说明。这些产品适用于
    `Windows` 和 `Linux` 系统，因此无论你使用 `Linux` 还是 `Windows` 并没有特殊区别。


    所有示例程序都是在运行 `Linux` 的机器上开发和测试的。事实上，这并没有主要影响，因为无论平台是其中哪一个，`Java` 和其他产品的工作方式完全相同。书中某些地方你会看到平台是
    `Linux`，这主要涉及文件系统的命令。否则，对于读者来说，程序在 `Linux` 机器上开发没有意义，它们也可以立即在 `Windows` 下运行，除非程序引用了文件系统，此时可能需要更改文件名。


    最后简要介绍一下这些书不是什么。它们不是 `Java` 的“如何编写”指南或此类参考手册，而是如标题所示，是关于软件开发的书籍。我希望读者在阅读书籍并通过许多示例时，可以找到编写良好程序的灵感，也可以作为资源集，提供许多软件开发者经常面对的具体日常编程问题的解决方案示例。


    ## 1 引言


    计算机程序是按顺序执行的一系列命令，它们共同解决一个特定的任务。程序被写为一个包含所有必要命令的文本文档。该文档被称为程序代码或源代码。单个命令必须以非常精确的方式编写，计算机才能理解，这就是编程语言用武之地。编程语言为如何输入命令制定了精确的规则。编程语言有很多，尽管它们不同且各有优缺点，但相似性大于差异，一旦你学会了一种语言，学习下一种就很容易。以下贯穿整个
    `Java` 编程语言，这是一种许多平台上广泛使用的语言。单个命令和顺序具体必须如何编写被称为语言的 `语法`。单个命令正在做什么或执行什么被称为语言的 `语义`。


    如上所述，程序被写为文本文档（在实践中是几个或多个），它简单是一个命令文档。命令也称为 `语句`。由于这些命令或语句只是文本，机器不能立即执行这些命令，而必须将其翻译成计算机理解的内部格式。这一过程被称为`翻译`或`编译`，由一个程序执行，将特定编程语言编写的语句转换为计算机的内部命令。该程序通常被称为`编译器`。在翻译期间，程序会检查错误，如果有错误，你将收到错误信息，在再次翻译之前必须修正这些错误。并不是所有错误都能在翻译期间发现，只会有语法错误，即涉及语句不符合编程语言规则的问题。要编写程序，你当然必须学习所选编程语言，但还必须学习如何用语句来表述任务的解决方案。后者是最困难的，而且很少有明确的解决方案。通过程序解决问题也称为`算法`。编程很大程度上是编写算法的问题，我会多次回到这个主题。


    '
- fmt: '

    When you have to write software, you need a tool that can be used to enter the
    program code, and in principle you could use a simple input program (a text editor)
    and then the compiler, but in practice you will always use a specific development
    tool, as it makes the job much easier. In the following I will everywhere use
    `NetBeans`, a development tool for a wide variety of tasks, including writing
    code in `Java`. It is an integrated software package, which includes all the tools
    necessary for the development of a number of different types of programs.


    `Java` is an object oriented programming language. The fundamental architectural
    element in a program is a `class`, and from the programmer’s point of view a `Java`
    program consists of a family of classes that collectively define all the application’s
    features and functionality. Writing a program is thus to define – design – and
    write the code to the program’s `classes`. Nothing in `Java` exists outside of
    a `class`. A program will also always apply other classes that are not written
    by the programmer, but classes coming from the `Java API`, and thus is available
    for the programmer as finished components. One of the program’s classes have a
    special role as the program’s “entry point” and the place where the program starts
    and this class should be written with a special naming, but it is almost the only
    formal requirements for the architecture of a `Java` program.


    `Java` is technically both a platform and a programming language. Seen as a programming
    language, it is a high-level language, which is characterized by:


    - it is a simple language

    - it is an object-oriented language

    - the language is architecture neutral

    - `Java` programs are portable

    - it supports development of multithreaded applications

    - it supports the development of distributed applications

    - it supports the development of programs with strong security

    - development of effective programs

    - development of robust programs

    - development of maintenance-friendly and dynamic programs


    All `Java` code are as mentioned written as plain text files – which filename
    must have the extension `*.java` – and then these files are translates to `*.class`
    files. The translation is performed by the `Java` compiler called `javac`. `Java`
    class files do not contain machine code for a particular platform, but rather
    so-called `bytecode`, which is the machine code for the `Java Virtual Machine`,
    which is a virtual computer, commonly referred as as `VM` or `JVM`. The program
    (consisting of a set of class files) can then be carried out by the virtual machine,
    which is a program that is running on a particular machine. Since `Java` and thus
    the virtual machine is available for many different operating systems, the same
    class files can run on many machines for example Windows, Solaris, Linux, etc.


    With a platform wee understand the hardware and software, where a program is running,
    and in relation to an usual PC you can think of Windows, Linux and Mac machines.
    Compared to this is a `Java` platform a software-only solution that runs on a
    different hardware based platform. The `Java Platform` consists in principle of
    two parts:


    - `JVM`, the `Java Virtual Machine`

    - an `API`, the `Java Application Programming Interface`


    where the last is a large collection of ready to use software components that
    a program can use. They are grouped into libraries called `packages`, which consists
    of classes and interfaces.


    The result of the above technology is that `Java` programs, in principle, is a
    bit slower than programs translated into an actual physical machine. However,
    since `Java` was born there has been an incredible number of improvements and
    optimizations of both the compiler and the virtual machine, so the difference
    in performance is negligible if at all measurable.


    # 2 Hello World


    The subject of this chapter is to show how to write and run a `Java` program using
    `NetBeans` and the aim is solely to get started. There are several kinds of programs,
    or you can say that the programs can be categorized in several ways, but in the
    first books I will look at three types of programs:


    - `commands`, which is a program that is typically performed from a command window
    (a `Terminal`) where you enters the program’s name that may be followed by one
    or more arguments

    - `consol applications`, which also is performed at a command prompt, but here
    the program runs in a dialogue with the user, where the user must enter values
    when the program is executed

    - `GUI-programs`, where the program opens one or more windows with components
    as buttons and input fields used by the user to interact with the program


    This division is only for practical reasons, as I will sometimes characterize
    the program examples in relation to this, but common to the three types of programs
    is that they are standalone applications that run on a single machine and without
    using resources on other machines.


    I’ll start with the classic `Hello World` program, a program that prints a text
    on the screen. It is an example of a command, but it is also an example of a program
    that has absolutely no practical interest. Although it is a simple program, it
    will nevertheless treat a number of basic principles that apply to all `Java`
    programs.


    ## 2.1 NetBeans


    As mentioned a `Java` program is written as text files, which will then be translated.
    When the files are translated without errors the program can be executed by the
    virtual machine. In practice is always used a development tool, which is a program
    or software package that integrates all the functions that a developer needs.
    Such a tool is usually called an `IDE` (`Integrated Development Environment`),
    and there are several, but I will everywhere use `NetBeans`, which contains everything
    that is needed, and the following requires that both `Java` and `NetBeans` are
    installed on the machine. Do not have it, you can start by reading Appendix A
    which explains how to download and install both `Java` and `NetBeans`.


    To write the first `Java` program, open `NetBeans` and create a new project. In
    the menu, choose:


    `File | New Project`


    A `NetBeans` project creates all the necessary files required to develop and test
    the program and eliminates a variety of configurations that are otherwise necessary.
    Using `NetBeans` you can build and run the program just by clicking the menu.
    To create the project, you must note that in this case:


    - `Java` is marked in `Categories`

    - `Java Application` is selected in `Projects`


    but otherwise I have not done anything in the first window.


    When you then click Next you get the following window:


    Here I:


    - Entered `HelloWorld` as `Protect Name`

    - Selected `/home/pa/doc/noter/note01` for `Project Location`


    Regarding the latter, it is just a question that I have decided that the project
    should be created in the `/home/pa/doc/notes/note01` directory. I have also decided
    that the project should be called `HelloWorld`. `NetBeans` will then create a
    folder


    `/home/pa/doc/noter/note01/HelloWorld`


    and all project files are placed by NetBeans in this folder. You should note that
    there is a checkmark in the `Create Main Class`, which is important.


    When you then click Finish, the project is created and `NetBeans` displays multiple
    windows:


    - `Projects` window, where all the project’s components are organized in a hierarchy

