    # 8 文件


    文件在《Java 5》一书中首先得到了解释，但由于我在接下来的章节以及随后的书籍中都会用到文件，我将在这里简要介绍一下使用文件需要的内容——这并不一定很多。


    从系统的角度来看，文件是一个字节序列，人们可以用许多方式将文件视为一个无限大的数组，第一个字节的索引为 0：


    ![](img/Image2863.jpg)


    当然，文件不是无限的，存在由操作系统和磁盘空间的上限，但在实践中，这些限制是你几乎总是会忽略的。当数据保存到文件中时，尤其是当需要再次读取数据时，必须在字节序列与应用程序使用的数据对象之间进行转换，并且必须指定在文件的哪个位置写入或读取。这些都是
    Java IO 类负责处理的，对于许多文件操作来说，一切都会自动完成——只要你知道要写什么。


    在接下来，我将只展示如何写入和读取文本文件，以及如何将任何对象写入文件并再次读取。后者也称为对象序列化/反序列化。在这两种情况下，只需只需接受要写入内容的语法即可，但如果你能处理文本文件并将对象序列化到文件中，你就掌握了在程序中使用文件的大部分必要。


    ## 8.1 文本文件


    文本文件是包含由回车分隔的普通文本行的文件。从 Java 的角度来看，你通过一次读写一行来使用此类文件。如果你必须写入文本文件，过程如下：


    1. 打开文件

    2. 创建要写入该文件的行

    3. 将该行写入文件

    4. 只要还有更多行，就重复这两个操作

    5. 关闭文件


    示例中显示了一个创建行的 `createLine()` 方法。该行由由分号分隔的随机整数（0 到 99 之间）组成。


