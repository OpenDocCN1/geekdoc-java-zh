- fmt: '

    Software objects are conceptual, but looks like the real world’s objects. They
    also have a state and related behaviors. An object stores its state in variables
    or fields, and it performs its behavior through methods. Methods acting on an
    object’s internal state and serves as the primary mechanism for object-to-object
    communication. The hiding of the objects internal state and require that all interaction
    must be made using the objects methods is called for data encapsulation and is
    a fundamental principle of object-oriented programming. With data encapsulation
    it is the object, which has control over how its state changes as it is the object
    that through its methods determines what the outside world can do with it.


    Above I have dealt with variables in Java, but variables can be several things,
    and there are basically the following opportunities:


    1. **Instance variables** (non-static fields) as objects use to store their state.
    All variables that in a class are defined as non-static, are instance variables,
    and each object of the class has its own instance variables, as a specific object’s
    state is independent of all other objects state, even if it is objects of the
    same class.

    2. **Class variables** (static fields) are variables defined `static`. Aside from
    that they are created in the same way as instance variables, but there are only
    created one copy of these variables, and all objects of a certain class will share
    all class variables. A static variable is thus designed to store values to be
    used by all objects of a class.

    3. **Local variables** are in principle created in the same way as instance variables,
    but they are created in an method, and is known only to this method. All variables
    that I’ve used above, are local variables. They are typically used to store temporary
    values that a method needs to do its job. Instance variables and class variables
    have a default value if they are not initialized by the programmer. In contrast,
    local variables must be initialized with a value. A local variable is created
    when the method in which it is defined, is called, and the variable is automatically
    deleted again when the method is completed.

    4. **Parameters** are variables that you specify in parentheses after the name
    of a method. Parameters seems a bit like local variables, but they are used to
    pass values to a method when it is called. Thus, one can think of parameters as
    variables that defines the values that a method should act on. `main()` has a
    parameter called `args` that are used to transfer arguments to the program on
    the command line.


    To construct program code as a family of software objects provides a number of
    advantages:


    * **Modularity**, where the code for an object can be written and maintained independently
    of the code to other objects.

    * **Information hiding**, where all interaction with an object is by means of
    its methods. The details concerning state of the object and the internal implementation
    remain hidden from the outside world.

    * **Code Reuse**, where already developed objects (perhaps written by another
    software developer) can be used in the current program. It allows the objects
    to be developed and tested by specialists, which you can trust on and use them
    in your own programs.

    * **Modifiable**, where a particular object without affecting the rest of the
    program can be replaced with another, if the object for some reason is found inexpedient.


    In the real world, you often meet many individual objects that are similar and
    of the same kind. There are thousands of cars, all of the same make and model
    and is constructed in exactly the same way and of identical components. In the
    object-oriented world they wee say that a particular car is an instance of the
    class `cars` of a particular make and model. A class is a description of how specific
    cars behave.


    Wee use the same principle in relation to software. Assume that a program need
    objects for banknotes. A banknote is characterized by a value which is the banknote’s
    state, and the only thing you have to do with a banknote is to read its value
    and know how the note looks so you can distinguish it from other notes. Accordingly,
    you can define the concept of a banknote as follows:


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_53.jpg)


    It is an example of a Java `class`, which here has the name `BankNote`. A definite
    note has as mentioned a value that is the note’s state, and this value must be
    stored somewhere. To this end, the class defines a variable called `value`. A
    variable has a type, here an `int` and means that the variable may contain an
    integer. The variable `value` is an example of an instance variable. The variable
    is defined `private`, which means that it can only be referenced from the class
    itself, and that is what I have called data encapsulation. The class should be
    used for something, and you should be able to read the note’s value. The class
    has a method named `getValue()`, whose value is the banknote’s value that is the
    value of the variable `value`. This method defines the objects behavior. Note
    that the method has a type, which here is `int`. Wee say that the method returns
    a value. The class has another method that has the same name as the class. It
    is a special method, which does not define the behavior of an object, but is used
    to initialize an object’s state when creating a new object. Such a method is called
    a `constructor`.


    You should note that the class has no `main()` method, because the class is not
    a program, but merely defines a concept that can be used by any application.


    With the class `BankNote` available, a program can create `BankNote` objects that
    it can do something with. Below is a `main()` method from a program that creates
    two `BankNote` objects. The first has the value of 100, while the next has the
    value of 200:


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_54.jpg)


    You must specifically note how to create an object. An object has a name, for
    example `note1`, which is a variable. The object also has a type, which is here
    `BankNote`, and when the type is a `class` rather than a primitive type, the object
    must be created with the `new` operator. Here you specify the value of the banknote,
    and exactly it means that the class’s constructor is executed and transmits the
    value to the object’s instance variable `value`. If the `main()` method is performed
    it prints the values of the two `BankNote` objects. For that to be possible, you
    have to refer to the `BankNote` object’s value. It is not possible because of
    data encapsulation, but a `BankNote` object has a behavior in terms of the method
    `getValue()`, so you can refer to the value.


    ### Inheritance


    Different kinds of objects often have several characteristics in common with each
    other. If you think of banknotes they all have a value, but they differ with respect
    to how they look. They have different colors, and they show different pictures.
    In object-oriented programming it is possible that classes can inherit each other.
    That means that you can collect common properties in a base class, while the differences
    can be placed in derived classes. Below is a class that represent a note and has
    the value 100 (a danish banknote):


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_55.jpg)


    The class is called `BankNote100`, and after the class name you defines with the
    word `extends` that the class inherits the class `BankNote`. This means that the
    class inherits all the properties that a `BankNote` have and expanded with new
    properties. In this case `BankNote100` extends `BankNote` with a method `print()`,
    to simulate how the note looks. The class `BankNote` has a constructor which initialize
    the instance variable `value`. A `BankNote100` must also initialize this variable
    (the value 100). It happens in the class’s constructor with `super(100)`, which
    means that the base class’s constructor is executed.

