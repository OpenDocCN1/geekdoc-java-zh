    ## 8.2 Serialization of objects


    It is also possible to store objects in a file, and actually it is not quite simple.
    When a file is of course just a sequence of bytes, this means that the object
    and its data have to be streamed to a sequence of bytes, a process that is called
    for `serialization`. It might not be so difficult, but the object must be able
    to be read again, and it must be possible to convert a sequence of bytes into
    an object of one type or another. It is only possible if together with the object
    is saved information about its type and serialization must not only stream object’s
    data, but also information on the type. With this information it is possible to
    restore an object from a sequence of bytes, a process that we call `deserialization`.
    It sounds complicated, and that is too, but seen from the programmer, it is simple,
    because Java has the necessary classes, which takes care of it all.


    I will write a program that stores an `ArrayList` with objects of the type `Name`,
    where it is the same class that you have seen in chapter 7, however, with one
    change:


    ![](image/Java_1_-_Basic_syntax_and_semantics_23-3-17_120.jpg)


    For an object to be serialized, its class must implement the interface `Serializable`.
