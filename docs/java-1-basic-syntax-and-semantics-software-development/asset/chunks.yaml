    ### 示例：阶乘


    示例显示了一个有一个单个参数的命令。如果它是一个合法的非负整数 `n`，该命令将打印 `n` 的阶乘，其中：


    0! = 1

    1! = 1

    2! = 2

    3! = 6

    4! = 24

    5! = 120

    …


    也就是说，`n!` 是所有小于或等于 `n` 的正整数的乘积。


    ![](img/Java_1_-_Basic_syntax_and_semantics_23-3-17_90.jpg)


    首先注意，阶乘是通过方法 `factorial()` 计算的，该参数是需要确定阶乘的数字。否则，计算由一个 `for` 循环组成，该循环在局部变量 `t`
    中计算结果。注意初始化是空的，这是允许的。事实上，`for` 语句的所有三个部分都可以是空的。特别是，如果条件部分为空，则条件始终为 `true`。


    `main()` 方法中的大部分代码用于验证来自命令行的参数。首先 `main()` 检查参数数量是否正确，如果不是，程序将带有错误信息并停止。如果有参数，程序将其转换为
    `int`，如果结果是非负数，则调用 `factorial()` 方法计算阶乘。如果数字是非法的，程序将打印错误信息。


