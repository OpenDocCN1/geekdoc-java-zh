    当你需要编写软件时，你需要一个可以用于输入程序代码的工具。原则上，你可以使用一个简单的输入程序（文本编辑器）然后使用编译器，但在实践中，你总是会使用特定的开发工具，因为这会让工作变得简单得多。在下文中，我将处处使用
    `NetBeans`，这是一个用于各种任务的开发工具，包括编写 `Java` 代码。它是一个集成软件软件包，包含了开发多种不同类型程序所必需的所有工具。


    `Java` 是一种面向对象的编程语言。程序中的基本架构元素是 `class`（类），从程序员的角度来看，一个 `Java` 程序由一组类组成，这些类共同定义了应用程序的所有特性和功能。因此，编写程序就是对程序的
    `classes` 进行定义——设计——并编写其代码。在 `Java` 中，没有任何东西是存在于 `class` 之外的。程序也会总是应用其他不是由程序员编写的类，而是来自
    `Java API` 的类，它们作为完成的组件提供给程序员使用。程序的其中一个类具有特殊角色，作为程序的“入口点”以及程序启动的地方，且这个类应该使用特殊的命名来编写，但这几乎是
    `Java` 程序架构中唯一的正式要求。


    `Java` 在技术上既是一个平台也是一种编程语言。作为一种编程语言，它是一种高级语言语言，其特征是：


    - 它是一种简单的语言

    - 它是一种面向对象的语言

    - 这种语言是架构中性的

    - `Java` 程序是可移植的

    - 它支持多线程应用程序 own

    - 它支持分布式应用程序 own

    - 它支持具有强安全性程序的开发

    - 高效程序的开发

    - 健壮程序的开发

    - 易于维护和动态程序的开发


    如提到的，所有的 `Java` 代码都是被写成纯文本文件——文件名必须具有扩展名 `*.java`——然后这些文件被翻译为 `*.class` 文件。翻译由名为
    `javac` 的 `Java` 编译器执行。`Java` 类文件不包含针对特定平台的机器码，而是所谓的 `bytecode`（字节码），它是 `Java
    Virtual Machine`（Java 虚拟机）的机器码，虚拟机是一个虚拟计算机，通常被称为 `VM` 或 `JVM`。程序（由一组类文件组成）然后由虚拟机执行，虚拟机是运行在特定机器上的程序。由于
    `Java` 及其虚拟机适用于许多操作系统，因此相同的类文件可以在许多机器上运行，例如 Windows、Solaris、Linux 等。


    通过平台，我们理解程序运行的硬件和软件，与普通的 PC 相比，你可以认为 Windows、Linux 和 Mac 机器。相比之下，`Java` 平台是一个纯软件解决方案，它运行在不同的硬件基础平台之上。`Java
    Platform` 原则由两部分组成：


    - `JVM`，`Java Virtual Machine`

    - `API`，`Java Application Programming Interface`


    后者是大量的现成软件组件集合，程序可以使用这些组件。它们被分组为名为 `packages`（包）的库，包由类和接口组成。


    上述技术的结果是，`Java` 程序上比翻译成实际物理机器的程序慢一点。然而，自从 `Java` 诞生以来，编译器和虚拟机都经历了惊人的改进和优化，因此性能差异微忽略不计，如果真的可以测量的话。


    # 2 Hello World


    本章的主题是展示如何使用 `NetBeans` 编写和运行 `Java` 程序，目标仅仅是入门。程序有几种种类，或者说程序可以以几种方式分类，但在第一本书中我将查看三种类型的程序：


    - `commands`（命令），通常从命令行窗口（`Terminal`）执行的程序，在其中输入程序名称，后面可能跟着一个或多个参数

    - `consol applications`（控制台应用程序），也在命令行提示符处执行，但在这里程序与用户进行对话，用户在程序执行时必须输入值

    - `GUI-programs`（GUI 程序），程序打开一个或多个窗口，带有按钮和输入框等组件，供用户与程序进行交互


    这种划分仅出于实用考虑，因为我有时会根据此对程序示例进行描述，但这三种程序的共同点是，它们是运行在单机上的独立应用程序，且不使用其他机器上的资源。


    我将从经典的 `Hello World` 程序开始，这是一个在屏幕上打印文本的程序。它是一个命令示例，但也是一个没有任何实用价值的程序示例。尽管这是一个简单的程序，但它将涉及适用于所有
    `Java` 程序的若干基本原理。


    ## 2.1 NetBeans


    正如提到的，`Java` 程序是文本文件，然后会被翻译。当文件翻译无误时，程序就可以由虚拟机执行。在实践中，总是使用开发工具，这是一种集成了开发者所需所有功能的程序或软件软件包。这种工具通常被称为
    `IDE`（集成开发环境），有若干种，但我将处处使用 `NetBeans`，它包含了所需的一切，且接下来的内容要求 `Java` 和 `NetBeans`
    都安装在机器上。如果没有安装，你可以先从阅读附录 A 开始，它解释了如何下载和安装 `Java` 和 `NetBeans`。


    要编写第一个 `Java` 程序，打开 `NetBeans` 并创建一个新项目。在菜单中选择：


    `File | New Project`


    `NetBeans` 项目创建了开发和测试程序所需的所有文件，并消除了各种配置。使用 `NetBeans` 你只需点击菜单即可构建和运行程序。创建项目时，必须注意在此情况下：


    - `Java` 在 `Categories` 中被选中

    - `Java Application` 在 `Projects` 中被选中


    但在第一个窗口中我没有做其他操作。


    当你点击 Next 后，你会看到以下窗口：


    在这里我：


    字体 输入 `HelloWorld` 作为 `Protect Name`

    - 选择 `/home/pa/doc/noter/note01` 作为 `Project Location`


    关于后者，只是我决定项目应该在 `/home/pa/doc/notes/note01` 目录下创建。我也决定项目名称应该为 `HelloWorld`。`NetBeans`
    然后创建一个文件夹


    `/home/pa/doc/noter/note01/HelloWorld`


    所有的项目文件都由 NetBeans 放在此文件夹中。你应该注意 `Create Main Class` 有一个勾选，这是重要的。


    当你点击 Finish 后，项目被创建，`NetBeans` 显示多个窗口：


    - `Projects` 窗口，所有所有组件按层次结构组织

    - `Source Editor`，其中打开了一个名为 `HelloWorld.java` 的文件

    - `Navigater`，可快速查找特定项目


