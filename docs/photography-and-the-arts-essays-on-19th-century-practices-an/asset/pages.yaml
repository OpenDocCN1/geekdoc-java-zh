    by the eventual removal of casts from museum displays – describes new dimensions
    of spectatorship and new institutional roles for photographic reproductions of
    art.


    In ‘Modernizing the Victorian: The Photographs of Julia Margaret Cameron 1886–1914’,
    co-editor Joanna Lukish asserts the significance of photographic reproductions
    in the formation of Cameron’s posthumous artistic identity. Cameron is insistent
    on the aesthetic qualities of her albums myriads yards away, or of new developments
    in photographic printing, she turned to the recently perfected carbon process
    to select a series of photographs before her 1875 move from England to her family’s
    plantation in Sri Lanka (then British Ceylon). From the 1880s until the First
    World War, Cameron’s photographs were known largely through carbon prints and
    other reproductions. During this period, new generations of photographers pursuing
    a self-proclaimed artistic view and produced reproductions of Cameron’s photographs,
    and used them to convey their own aesthetic concerns. Lukish analyses how Cameron’s
    distinctly Victorian experimentation with lens-based effects of detail and suggestion
    were made to support their modernist preoccupations.


    # Part Two: Photography and Aesthetics


    A common dynamic in the four essays in this section is the way each protagonist
