    nexus of activities she examines in this case study involves a British colonialist
    production knowledge of India and its through public exhibitions and photographically
    illustrated books. Her essay invites us to consider the shared indexical signification
    of the photograph and the plaster cast; as demonstrated by this project, photography
    was not necessarily conceived as the exemplary reproductive mode. Turner’s examination
