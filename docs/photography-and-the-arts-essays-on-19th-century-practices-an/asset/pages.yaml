  md: '# Impressionism in Photography


    Hope Kingsley


    In December 1890, the British photographer George Davison (1854–1930) gave a comprehensive
    lecture, ''Impressionism in Photography'', on the relevance of contemporary painting
    to an equivalent school of progressive photographers, amongst whom he counted
    himself.¹ Davison’s lecture, presented at the Society of Arts in London² and subsequently
    published in several periodicals³, was an extensive discussion of Impressionism
    and its relevance to photography. His embrace of Impressionism was remarkably
    advanced at a time when style and technique of painting was peripheral to the
    artistic mainstream in Britain, and his lecture was to the introduction of Impressionist
    ideas to British photographic circles. Davison offered an ambitious thesis for
    Impressionism’s application to photography. That he felt it necessary to do so
    partly due to the attention – criticism – that his photographs had attracted at
    recent exhibitions of the Photographic Society of Great Britain. Two months before
    his lecture, Davison’s photograph, An Old Farmstead (1889) (Figure 9.1), had been
    both praised and desired for its soft-focus effects, characteristics that were
    equated with the rapid, sketchy brushwork in Impressionist painting. Thus, Davison
    was validating his own approach to photography. More broadly, by aligning the
    aims of photographers with those of painters, he was arguing for photography’s
    equivalence as an artistic medium.


    Davison provided an unusually specific account of Impressionism at the very beginning
    of its absorption into photographic aesthetics. Histories of photography typically
    place photographic Impressionism outside of its proper time frame, back in the
    1860s or forward to turn-of-the-century Pictorialism. Such accounts are dependent
    on generic formats of diffused or soft-focus resolution and a quickly seen and
    captured representation associated with later snapshot photography⁷ While those
    narratives may be visually compelling, they are often anachronistic, mistaking
    resemblance for causation⁶ This essay re-suites Impressionism in late 1880s and
    early 1890s British photography and contextualizes Davison’s ideals within his
    artistic milieu. It considers Davison’s principal sources: writings by the New
    English Art Club painter Francis Bates (1853–1950), the Anglo'
