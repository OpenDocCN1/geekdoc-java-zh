  md: '# The Photographic and the Picturesque:

    The Aesthetic and Chemical Foundations of

    Louis Désiré Blanquart-Évrard’s Activities


    Herta Wolf


    # The Photographic: Predispositions


    Photographic practices and the evolution of photographic techniques surely cannot

    explained by a purely biological, let alone a psychological approach. Still, I
    would

    like to preface my observations with a few facts about Louis Désiré Blanquart-Évrard’s

    career that he informed his works, or rather his working methods. Born in Lille
    in 1802,

    he is conventionally remembered as the owner of the Imprimerie Blanquart-Évrard,

    which he established on the enthusiast Hippolyte Fockey’s premises in Lo-

    nez-Lille southwest of Lille in 1851. Yet as we will see, this choice of site
    was

    not merely a result of the fortunate circumstance that he found a partner and

    friend in Fockey, who agreed to oversee their joint photographic operation at
    his

    ‘charming residence’, as Blanquart-Évrard would recall in La Photographic: Ses
    origines,

    ses progrès, ses transformations, the outline of the medium’s history and future

    np published in 1869.


    To safeguard the integrity of his scientific reputation, Blanquart-Évrard saw

    him compelled to set up a photographic printing shop that was to demonstrate

    in practice the truth of what the photographic critic Francis Wey had alleged
    was\mera theoretical proposition; that it was possible to make affordable prints
    from

    ographic negatives, better in quality than those produced by the renowned

    photographers in Paris, regardless of weather conditions, and in large numbers
    –

    in short, that an industrial-scale photographic establishment was viable. For

    b to prosper, Blanquart-Évrard argued, it needed the sort of guaranteed sales

    potential allowed for continuous operation. Moreover, it would have ‘obligations

    to meet and bills to pay’: a publisher who must satisfy his subscribers week after
    week,

    month after month, cannot afford delays except in extraordinary circumstances;
    as he

    explained in a letter to the Société héliographique that was published in the
    13 April

    1851 issue of the society’s journal, La Lumière.


    These remarks on the establishment of a photographic printing shop attest to

    Blanquart-Évrard’s entrepreneurial acumen, the conventional account in which he'
