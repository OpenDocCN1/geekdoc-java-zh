- pgno: 150
  md: '# Photography and the Arts


    into marbles, bronzes, statues by expert mechanical labourers. By Joanne Lukitch
    has shown, Woolner was interested in photography⁴⁶ and not adverse to complementing
    his modelling from life with mechanical copies – he procured casts of Tennyson’s
    forehead and nose to improve the realism of his 1856 bust.³⁷ These were standard
    studio practices which allowed sculptors to continue on seeking new commissions,
    imperative to turn an expensive medium into a viable business. Cameron was the
    time thinking along similar lines, letting her portraits reduced to cartes-de-visite
    or giving her negatives to the Autotype Company to make carbon prints, a process
    that involved making copies—akin to new ‘moulds’ from her originals⁵⁸


    Annals’ is full of Carlyle-inspired notions of portraits that show ‘greatness
    of the inner as well the features of the outer man’⁵⁹ it is also infused with
    dissuain for the Photographic Studio of London and commercial photographic studios.
    Yet, by thinking about photography Woolner as well Michelangelo, Cameron was much
    closer to developing photography for a machine aesthetic here and technological
    apparatus could work to make portraits in which the idealized heroes—privileged
    subjectivities unintended by modernity—are both and in front of the camera. In
    this conceptualization of photography, Cameron’s photographs and writings are
    a crucial moment in the ongoing dialogue in the history of photography between
    photographs as commodities for a machine age and photographs as works in which
    traces of the real, footprints of the world, mingle with the actions of human
    hands which endow the machine with a subjectivity of its own, marking them with
    fantasy, desire and imagination.


    My thanks to the editors for pointing me towards a number of excellent points
    and important information in writing this chapter.


