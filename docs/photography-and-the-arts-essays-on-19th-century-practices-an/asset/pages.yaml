    Between her letter to Murray of 1843 and her essay ''Photography'' of 1857, Elizabeth
    Rigby refines her initial comment on the calotype''s ''Rembrandt effect'' in a
    review of German painting in which she strengthens what will become her enduring
    attachment to Hill and Adamson''s work. But it is easy to miss the significance
