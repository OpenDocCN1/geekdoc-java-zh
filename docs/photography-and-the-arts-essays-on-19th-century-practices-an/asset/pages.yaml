  md: '# The Photographic and the Picturesque


    Among all Blanquart-Évrard''s albums, the 1853 Études photographiques arguably
    reflects the changed pictorial modernities introduced by his Imprimerie photographique
    most vividly. Genre scenes and figures, while the Voyages pittoresques still stilled
    off into vignettes, have been stripped of their costumes and thus of any historicizing
    dimension, as well as the narratives bound up with it. The people who have found
    their way into the album are engaged in activities that the pictures visualize:
    the beholder can tell, or figure out, what they are doing. And even photographs
    cannot render movement sequences except in static form, the figures seem to be
    in motion, their own attention absorbed by some action or the performance of a
    task.⁶⁰ This lends to the Realism. What makes the Études photographiques stand
    out is that, although the figures may still have been arranged according to the
    representational conventions of the market – because they are photographed sur
    le vif – the Voyages pittoresques et romantiques dans l''ancienne France are representatives
    not of an ‘ancient and romantic’ France, but of the country’s present. Here is
    a contemporary France in which real people are seen going about their business:
    cutting up apples (Figure 4.6), grinding wheels, leading carts, mounting donkeys,
    making lace, playing cards, even taking an after-lunch nap (Figure 4.7).


