  md: '# Picturesque Conflict 95


    staffage is thoroughly naturalized in the tourist imagery. This is because the
    colonial picturesque tradition of which these photographs were a part one so routinely
    incorporated Indian figures into the landscape, positioned as objects for the
    aesthetic delection of the colonial vision.³⁸ As a pictorial motif seen by viewers,
    then these figures are relatively straightforward, easily explained by reference
    to a wealth of contemporary encounters that draw on the established tropes of
    the landscape genre.


    Yet should we make of these figures'' status as living men who had to pose in
    a racially polarized park? It is impossible to know how much awareness of European
    artistic traditions informed these men s understanding of the ritual they were
    participating in as they entered a space where they were persona grata (no Indian
    accounts of such events exist), but any awareness of picturesque cannot fully
    account for the psychology of such scenes. To posed next to an emotive site of
    Anglo-Indian violence was to be incorporated into an imperial psychodrama of crime
    and punishment; a lust for indiscriminate revenge over the Indian population insurrection,
    particularly a hallmark of the colonial imagery during and many years after the
    1857 insurrection, particularly in Cawnpore. The senses of massacre and counter-measures
    that these sites recalled would not have been lost on the Indian figures who were
    made to stand in the general figure of the ''native''. I have written elsewhere
    of how posing on such works to insinuate the vulnerability of the figures to what
    literature scholar Alex Tickell has noted as “the fearful misrecognitions of a
    militiaed colonial society [ which ] involve the potential interchangeability
    of any Indian man with a “mutinous” racial other is potentially beyond the law
    as a racially-coded version of bare life.³⁹ In this sense, the photographs were
    raw exercise of imperial power, staging unsettling encounters between colonised
    boundaries and incendiary sites of violence.


    Yet there is also a sense in which the picturesque interventions can be seen as
    less an assertion of colonial agency and more of an intractable aesthetic habit.
    As Tapati Guha-Thakurta has noted, for the British in the nineteenth century,
    the picturesque representation that had grown from a “filter [...] into a frame,
    inscribing itself into the body of the physical space and its structures, and
    this is compulsive inscribing of the landscape with European tropes of the picturesque
    which is at the Cawnpore memorial and its attendant imagery⁴ Pictorial conventions
    are slavishly adhered to in spite of courting sensibilities regarding the presence
    of Indian people in this space. Examples point to how we are spoken by, rather
    than simply speak through, signifying systems. The picturesque was not harnessed
    uncomplicatedly to the demands of imperial power; it was something that shaped
    power, ever exerting pressure on it to act in way that ran counter to ethical
    sensitivities – its ‘comulsions’ of representation deployed without particular
    regard for the specificity of a situation or locale.


    My claim here is not that the picturesque was inherently transgressive, but that
    the aestheticization of warfare was unpredictable in its effects. Photography
    entered a culture that had already been primed by picturesque aesthetics to interact
    with the world as a picture, as Chaudhary has argued, key to the management of
    the Victorian sensorium in the face of the ever-increasing visual'
