    scenes for the camera.


    Henry Cameron’s exhibition featured photographs by his mother, his own commercial
    prints and his carbon print reproductions of the works of the painter George Watts
    (1817–1904), a family friend and his mother’s artistic collaborator and mentor.
    Watts also joined the exhibition.¹⁸ It is not known if featured images by Julia
    Cameron were albumen photographs or Autotype Company prints or possibly Henry’s
    own carbon prints of his mother’s photographs. A short notice in the Magazine
    of Art described the ‘most important of its kind that we have seen in London because
    of how ‘Mrs. Cameron and Mr. Cameron used focus to mitigate the detal and lack
    of overall artistic effect, characteristic of photography’¹⁹


    While it is not that Emerson saw Henry Cameron’s exhibition, Emerson certainly
    noticed the favourable earned in the press. In his October 1889 column for the
    American Photographer Emerson quoted the praise for Julia Cameron’s photographs
    from the Magazine of Art and another favourable review. Emerson now that Julia
    Cameron’s photographs have never been approached and will always hold their own,
    though her photographs of ‘angels with wings’ ‘spurious work’ that showed her
    as the ‘amateur’ and imperfectly trained artist that she was²⁰ Emerson did not
    mention to his American readers that Watts’s paintings originals and carbon print
    reproductions – Henry Cameron’s photographs were also on display, as reported
    in the Magazine of Art notice. Given that Watts used allegorical figures in his
    paintings, Emerson’s account foreclosed for his readers the connections between
    Cameron’s ‘angels’ and Watts’ iconography and artistic aims.


    In 1890 Emerson published a monochromatic essay on Julia Cameron, with an annotated
    list of his principle works, in Sun Artists, an illustrated series on contemporary
    British artistic photography²¹ Emerson characterized Cameron as a worthy precursor
    for his artistic photography, except that was a failure. In the essay he diminished
    – or outright dismissed – aspects of his artistic practice incompatible with hers.
    Cameron’s genius was crucial to Emerson’s case, as he used stereotypes of femininity
    and juvenile to characterize her photography. His position that Cameron was a
    kind of photographic primitive meant that the portraits he admired became, effectively,
    demonstrations of the photographic medium itself.


    Setting out the that ‘artistic photography is a new thing … just beginning to
    be apprehended’, Emerson described Cameron as an exemplary member of an earlier
    generation of artistic photographers, a group which imitated the conventions of
    painters²² Emerson wrote of Cameron’s distinguished background, and her friendships
    with contemporary painters, such as Watts, but characterized her as a photographer
    ‘who was, born, not made. She was an ‘idealist’, who saw her models’ through the
    old masters’ spectacles, fondly, lovingly, joyfully as a child. She was in no
    original, but a follower of good conventions²³ Emerson’s figure of Cameron peering
