  md: '# Sun-struck: Elizabeth Rigby (Eastlake)

    and the Sun’s ‘Earnest Gaze’ in Calotypes

    by Hill and Adamson


    Lindsay Smith


    Lady Elizabeth Eastlake (1809–93) now canonical essay ‘Photography’, published
    in the Quarterly Review in 1857, is generally read as a summation of her views
    on the relationship of photography to art.^1 Recalling the capacity of ‘a few
    heads of elderly gentlemen’ made by the ‘new and mysterious art’ of photography
    to ‘revive’ the ‘spirit’ of the seventeenth-century Dutch master of portraiture,
    Rembrandt, Eastlake invokes the sun as its creator, in the familiar epithet, ‘the
    solar pencil.’^2 The answer to her subsequent question of ‘how far the sun may
    be considered an artist is in the negative.^3 In Eastlake’s aesthetic judgement,
    following rapid commercialization and the advent of collision in the 1850s, photography
    ultimately falls short of art. Yet, a more nuanced response haunts the essay in
    Eastlake’s memory of, and continuing attachment to, the calotype process that,
    as Elizabeth Rigby, she encountered in Edinburgh in the 1840s. Although she does
    not name them, ‘heads’ with which she opens ‘Photography’—executed in a bistre-like
    colour on paper ‘and little more patches of broad light and shade’4 are calotypes
    by the Scottish painters David Octavius Hill (1802–70) and Robert Adamson (1821–48).


    Eastlake’s association with Hill and Adamson is well established, and scholars
    have discussed the representation of solar agency in her 1857 essay.^5 But the
    roots of Eastlake’s anthropomorphizing of the sun pro-artist are established in
    the 1840s in her encounter with, and writing on, the calotype. And we neglect
    a formative stage in hers to the paper process as they dovel with her experience
    of sitting for the Edinburgh photographers. As collodion supplants calotype, her
    views on photography evolve, but Eastlake continues to associate calotypes with
    ‘art’ in ways distinct to the process and to the material circumstances of sitting
    outside for Hill and Adamson in the warmth of bright sunlight.'
