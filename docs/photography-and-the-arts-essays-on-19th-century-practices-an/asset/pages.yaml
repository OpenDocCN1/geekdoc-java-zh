    Cole evidently perceived Cameron''s photographs as useful to designers as soon
    as they were purchased, he gave four to Gregory Sykes, the designer then engaged
    in devising decorative schemes for the building at South Kensington.21 With their
    High aspirations, Cameron''s photographs seem utterly different from those for
    the purpose of being copied. They lack the clarity – both visually and in stated
    intention – of photographs the museum was collecting at the time. For instance,
    in the summer of 1865, between acquiring batches of photographs by Cameron, the
    museum bought a set of photographs entitled, The Anatomy of Foliage. Photographs
    of the principal forest trees, each from the same point of view in winter and
    summer; enabling the student to trace the limbs when hindered by the masses of
    foliage.22 The photographs of trees were like, Cameron''s, ''from life'', but
    the vast majority of the thousands of photographs of art, design and architecture
    that the museum was amassed for the reference of artists, designers, students
    and connoisseurs were not.


    Unlike these record photographs Cameron''s photographs may see now and as exceptional
    acquisition by the South Kensington Museum may appear first, Cameron herself her
