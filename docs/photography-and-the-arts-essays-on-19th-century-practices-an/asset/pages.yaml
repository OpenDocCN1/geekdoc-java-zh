  md: '# Photography and the Arts


    novelty, fragmentation and shock of modernity. A perceptual habit helped to orient
    the Victorians, providing a visual framework in which to apprehend exotic and
    difficult stimuli; yet these habits of vision and representation also compromised
    their ability to engage with people and places according to other logics: the
    ideal of radical exclusivity sacralized the Cawn park within the imperial imaginary;
    the humane sympathy Ruskin asked in his rejection of the ''lower'' picturesque;
    or the decent treatment of dead enemies. The aestheticization of sensitive topics
    such as suffering, death and remembrance was laced with ethical quandary; embedded
    within the aesthetic of troubling scenes was the risk of a certain excess of picturesque
    enjoyment, a spectre of moral indifference or even sadness that rendered this
    modern coping-mechanism a potential disturbance.


