    Museum of Science and Media, 2001–5059.


    +   26 Coventry Patmore, ‘Mrs Cameron’s Photographs’, *Macmillan’s magazine* no.
    23 (January 1886): 230–1.


    +   27 Undated letter from G. F. Watts to Julia Margaret Cameron, Heinz Archive
    and Library, National Portrait Gallery, NPC P215 (1a/1b/c). Although Watts has
    frequently been cited as Cameron’s artistic mentor, further exploration of their
    relationship needs. Watts did critique the photographs she sent, but he may also
    have been inspired by her work. Julia Fagan-King argues persuasively that Watts
    seems to have based certain paintings on photographs by Cameron. See Julia Fagan-King,
    ‘Cameron, Watts, Rossetti: The Influence of Photography on Painting’, *History
    of Photography* 10, no. 1 (Januaryary–March 1986): 19–29.


