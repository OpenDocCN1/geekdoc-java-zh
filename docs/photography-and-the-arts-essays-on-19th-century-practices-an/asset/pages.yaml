  md: '# From ''Studies from Nature'' to ''Studies for Painting''


    Devotion is one of photographs the museum''s founding director, Henry Cole (1808–82),
    acquired in the summer of 1865, shortly after Cameron sent him portfolio accompanied
    by a letter stating that she ''should be so proud and pleased if this complete
    series could go into the South Kensington Museum.'' By Cameron had been making
    photographs with her camera for about eighteen months, having made the portrait
    she considered her ''first success'', of a little girl called Annie, in January
    1864. She was already working what Cameron described in her diary as ''her style'':
    close, softly focused and marked by imperfections other photographers would have
    rejected as flaws.'' She had also established the range of subject matter she
    would pursue for her entire career, which she described as ''Portraits, ''Madonna
    groups'' and ''Fancy Subjects for Pictorial Effect.'' Cole appropriately deemed
    the two latter groups most relevant for the museum and particularly their religious,
    literary and fanciful pictures. It was possible that for more imaginative subject
    matter was a sign of Cole''s appreciation of photography as a means of creative,
    artistic expression. However, it is more likely, as this essay will demonstrate,
    that he perceived them as inspiring source material to the artists and designers
    who would consult them at the South Kensington Museum.


    Cameron''s photographs arrived at the museum in June, July and September 1865,
    they were entered into two ledgers. The Library Receiving Diaries noted the price
    and source of each photograph, while the Photographs Acquisition Register assigned
    an individual number (now referred to as a ''museum number'' or object number)
    to each photograph and recorded its storage location. In the volume, the photographs
    acquired in June were registered as ''Figures from Nature/ Photographed by Mrs
    Cameron/Freshwater Isle of Wight'' and the title of each photograph listed. The
    July batch was recorded in the same way, but without individual titles. In September,
    the titles were listed once again, while some photographs were recorded as ''Portraits
    & Studies from Nature, others were listed simply as ''Studies from Nature.'' The
    variations in terminology and the inconsistent recording of assigned titles are
    indicative of the mutable ways in which the photographs would be documented in
    museum catalogues and classification systems in years to come.


    Before considering these subsequent classifications, it is worth dwelling on the
    initial terminology. As the photographs entered the collections, they were all
    described as ''Nature'', which, the phrase ''From Life'' that Cameron herself
    inscribed on the mounts of her photographs, emphasized that they depicted actual,
    living people and were not photographs of pictures such as paintings or drawings.
    They were also classed as ''Studies'' or ''Portraits.'' In this context, a ''study''
    depicted a subject in the guise of a character other than themselves and a ''portrait''
    showed a named individual, the distinction was applied inconsistently.


    For example, Lady Adelaide Talbot appears in three photographs the museum collected,
    as herself in the first and two and as the melancholy nun from Milton''s poem
    II Penseriso in the third (Figures 12.3–12.5). The first was not individually
    named but grouped with other ''Figure Studies from Nature'', the second was listed
    as ''Lady Adelaide Talbot'' and the third entered as ''Portrait or rather Study
    Lady Adelaide Talbot.'' The uncertainty implied in the last entry reflects the
    ambiguous function of such photographs as portraits of individuals and representations
    of fictional subjects.'
