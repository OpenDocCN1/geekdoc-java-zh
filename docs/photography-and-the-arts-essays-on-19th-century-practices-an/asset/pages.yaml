  md: '# Photography and the Arts


    in his aesthetic ''excitement'' to be devoid of sympathetic response. So, even
    when Beato did not adopt explicitly picturesque devices, he embodied the ethically
    stunted way of seeing Ruskin had identified in people (himself included) who got
    rid of all claims of ... compassion by treating all distress more picturesque
    as real.¹¹⁸


    In an 1845 letter to his parents, Ruskin haded the ethical anxieties that would
    ultimately make their way into his disquisition on the picturesque in Modern Painters,
    confessing that he had a certain artistic investment in suffering:


    > Yesterday, I came upon a poor child lying flat on the pavement in Bologna –
    sleeping like a corpse – from too little food. I pulled up immediately not in
    pity, but in delight at the folds of his poor ragged cheese over this thin bone
    and gave the mother not in charity, to keep the flies off it I made a sketch.¹⁹


    Ruskin''s response to misery is startling similar to Beato''s in China, with a
    dubious aesthetic pleasure pleasing the selfish desire to leave everything in
    place for the sake of a picture. It anticipates Sunan Sotag''s concern, over 100
    years later, that the picturesque way of seeing is predicated on a cold abnegation
    of social responsibility, being ''a way of at least tacitly, often explicitly,
    encouraging whatever is on to keep happening ... to be in complexity with what
    makes a subject interesting, worth photographing.''²⁰ Indeed, Ruskin''s unease
    over the pathologies of the picturesque mind in the mid-nineteenth century is
    strikingly similar to the anxiety that motivated a good portion of modern scholarship
    on photography, indicating that the new technology did not give rise to a novel
    problematic, but reiterated the structure of feeling apparent in an earlier artistic
    (the picturesque), while raising the ethical stakes by introducing an lexical
    element to the relationship between the image and the (suffering) refer.


    What were the consequences of such aestheticized responses to human suffering
    and death? In Chaudhary''s reading of photography in nineteenth-century India,
    colonial adopted what he terms ''phantasmagoric aesthetic'': a perceptual mode
    under which modernity''s shocks are dealt with by shielding ones from stimulus
    in a process of ''sensory self-alienation, a domination over one''s feelings which
    becomes the preconditioning for others order, by reducing populations to bipolar
    statistical patterns or attempting, like Beato, to transform the chaos of war
    into ''aestheticized coherent assemblies of a reality placed at a distance and
    on.''²¹ Such reading follows Susan Buck-Mors''s in her conception of aesthetics
    not in terms of pictorial conventions, but as a means of shaping one''s sensory
    engagement with the world: a protective filter between inner and outer.''²² Numbing
    oneself through the ''anaesthetising qualities of aesthetic mediation was highly
    useful in political situations that required the maintenance of brutal hierarchies,
    when excesses of sympathy could threaten the social order ''aestheticisation of
    politics'' constituted the precondition for fascism.''²³


    Yet, Ruskin''s interrogation of his own picturesque medium of experience demonstrates,
