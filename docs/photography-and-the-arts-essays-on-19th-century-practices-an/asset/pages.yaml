    neighbouring Michelangelo, was decorated with photographs of Michelangelo’s Sistine
    Chapel in Rome, and his Medici Tomb in Florence$^{30}$ The latter was one of the
    recommended highlights for Murray’s Handbook for Travellers in Northern Italy
    of 1856, when photographs of it were already available from Alinari, international
    supplier of photographs of Florentine art and architecture$^{31}$ Michelangelo’s
