    now on the left, the wrinkled skin is more obvious, distracting from our awareness
    of his eyes. By reversing the plate in her prints, so that the layer of collodion
    was not in direct contact with the plate but separated from it by the thickness
    of the glass, Cameron added an even layer of soft focus to the blur and shallow
    depth of field of her exposure. She also changed the movement of the image so
    that it reads, left to right (the Western mode of reading), as a journey from
    darkness into light, which, in the loss of details in the highlights, becomes
    abstracted into thought, vision and inspiration. The print, then, is an interpretation
    rather than a faithful copy of the negative, as the exposure is of Carlyle’s face.'
