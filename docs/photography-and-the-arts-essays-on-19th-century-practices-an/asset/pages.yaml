  md: '# Art, Reproduction and Reportage


    who had participated in the Light Brigade charge, presumably the publisher anticipated
    greater public interest in these men following the immense fame of their action.
    In Britain, the public narrative of the war already saw the Chargers as heroes.
    Number of Fenton''s groups also included non-combatants, including women, known,
    respectively, in England and France, as suters and vivandières, helping with cooking,
    laundry, general supplies and first aid.¹


    Fenton photographed the personal servants, described as ‘Nubians’, who accompanied
    some of the senior officers, and the ladies who helped with construction and other
    mental tasks, including men referred to as ‘Croats’ and ‘Tartars’. The number
    of these portraits of ‘types’ is more than would be expected, suggesting Fenton’s
    personal interest in the subject matter; also is both photographic and artistic
    for concentrating on the depictions of warfare. The ‘exotic’ Zouaves and non-European
    men had been subject matter for artists depicting India and the Middle East for
    several decades as part of a broader Orientalist project.¹² The Zouaves had gained
    a reputation for bravery during the war and became favourite for artists. They
    appear in media from ground oil paintings to a private sketch made by Queen Victoria
    (1819-1901).¹³ Fenton may have thought the subject matter would appeal to Barker
    as his potential customers.


    # Agnew''s exhibitions of Fenton''s photographs


    Whilst Barker was selecting Fenton''s photographs to use as studies for his painting,
    Agnew and Sons was mounting an impressive series of exhibitions of the photographs.
    The dedicated display of the photographs had been part of Fenton''s commission
    from the onset of the project. The publisher opened the first exhibition of Fenton''s
    photographs in London in September 1855, with 280 photographs displayed in the
    Gallery of the Water Colour, Pall Mall, London. Over the next year this exhibition
    was followed by at least twenty-six different locations across Britain, from Glasgow
    to Exeter. Some exhibitions ran concurrently, several sets of Fenton''s photographs
    were required. Each venue had its own printed catalogue, while small changes in
    the selection of photographs were made among some venues, each exhibition was
    essentially the same.


    Agnew and Sons published the majority of the photographs in 1855, using card mounts
    with letterpress giving photographer and publisher credits. Some photographs,
    including those portraits Fenton took in Britain, were published later, with the
    last appearing on 12 May 1856. Fenton''s letters to Thomas Agnew suggest that
    they were thinking about publicity in advance of the exhibitions in Britain, and
    urged him making engravings away.¹⁴


    Exhibition catalogues, contained an ordered form and price list for visitors to
    buy a selection of works. Photographs could be acquired singly or in groups and
    were priced according to their significance. The most expensive photographs, at
    £1/1/0, were The Valley of Shadow of Death, The Council of War and Tombs of the
    Generals on Cathart''s Hill.¹⁵ News of the fall of Sevastopol in early September
    1855 was reported at roughly the same time that Fenton''s photographs first'
