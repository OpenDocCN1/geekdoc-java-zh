  md: '# Photography and the Arts


    figures primarily as a photographic entrepreneur do not him justice. The French
    photography critics associated with La Lumière and the reservations concerning
    the commercialization of photography voiced by the members of the Société héliographique
    may have contributed to this misconception. Since the mid-twentieth century, scholars
    of the history of photography have portrayed him as a photographic industrialist,
    a label that is at odds with the significance that mid-nineteenth-century observers
    accorded him as an eminent researcher on paper photographic processes. To show
    why his contributions cannot be reduced to publishing activities and why it is
    historically incorrect to suggest that he helped pave the way for the transformation
    of photography into a mass medium I will sketch the origins of his ''historic
    pieces'', as he called his early sample or model photographs of 1846 and 1847
    when he looked back on his activities in 1869. A closer examination of his career
    will allow us to grasp his important role in the development of paper photography
    and better understand the subjects of both his own photographs and the works of
    others, which he distributed in albums.


    # Blanquart-Érard as photochemical experimenter


    Blanquart-Érard came to public notice with a letter dated 23 September 1846 and
    addressed to one of the two permanent secretaries of the Academy of Sciences,
    François Aragon (1786–1853). It was due to his crucial role in publishing and
    communicating photography at its beginnings, especially for Daguerre''s photographic
    process, that made him so interesting for the Lillois. After a brief introduction
    in which he notes that it was Aragon''s efforts in the support of photography
    that encouraged him to write, he enters into a discussion of the épreuves – the
    word must be taken to denote work samples and, hence, evidence of the potential
    of his photographic process¹ he encloses (Figures 4.1 and 4.2); two portraits
    ''captured with the same technical equipment and in the same lighting conditions'',
    which he offers a description of his assertion that photographic prints on paper
    ''may be varied as desired by the operator'', who can choose to produce faint
    or high-contrast copies.


    His explanatory remarks reveal that the two (self-) portraits in two consecutive
    exposures, with the sitter strikingly identical poses are not so much an adjective
    to the letter to Aragon as rather true cause: examples that legitimize the unsolicited
    solicitation. This interpretation is confirmed by the writer''s request to add
    his name to the roster of those who have contributed to the development and refinement
    of photographic processes. The secretary recognizes his merit, Blanquart-Érard
    writes, he promises to send additional and larger specimens. Aragon agreed to
    this desire by including a summary of the communication in the report of the 28
    September 1846 meeting in the Comptes rendus des séances de l''Académie des sciences.
    The readership is informed that a Monsieur Blanquart-Érard of Lille has submitted
    two specimens of paper photography that – although they depict the same scene
    and were taken under the same conditions – show different tonal values. Their
    author informs us that these differences are entirely at the operator''s discretion.¹⁴'
