    # Davison''s thesis


    Davison opened his lecture by proclaiming that this was ''an age of scientific
    inquiry in every branch of knowledge'', including ''the painter’s art''. The scientific
    basis for art was founded in material evidence: ''natural facts, facts of atmosphere,
    facts of light, facts of colour'', which freed from ''conventions and dogma''
    and constituted ''return to nature.'' He explained that for artists following
    such propositions, ''truth to nature is the first article of their faith, and
    the trust that science teaches concerning light and colour, that the eye sees
    is a guiding principle.'' This approach was taken up by ''the body of painters
    known as impressionists — [who] consulted only their impressions of natural scenes,
    and to those impressions, painted.'' Davison argued that the ''newer school of
    photographers'' embraced the same principles and practice, turning photography’s
    limitations to pictorial advantage:'
