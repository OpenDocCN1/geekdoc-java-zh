  md: '# A Bug for Photography?

    Hippolyte Fizeau''s Photographic Engraving

    and Other Media of Reproduction


    Stephen C. Pinson


    In 1936, the New York Public Library (NYPL) acquired a collection of books and
    images that once belonged to the French physicist Armand-Louis-Hippolyte Fizeau
    (1819–96).¹ Generally recognized today for measuring the speed of light, Fizeau
    was also at the centre of group of early photographic innovators with whom he
    exchanged letters, publications, photographs and trial proofs from experimental
    processes. Counted among the collection are some of the most prized material from
    photography''s early history, including calotypes by William Fox Talbot (1800–77)
    and a signed copy of the first fascicle of *The Pen of Nature* (1844), considered
    to be the first photographic illustrated book for sale. Less well known is a group
    of about fifty prints, the majority of which were made using a process developed
    by Byeau to etch and print daguerreotypes by transforming the silver copper plate
    into a printing matrix. Owing to their hybrid status as ink-based photographic
    reproductions, these printed incubable had little purpose in accounts of photography''s
    intersection with modern art. Unlike photographs derived from negatives—which
    are often viewed as ‘original’ despite existing as multiplies—which did not benefit
    from photography into the history of art the medium entered into museums and newly
    created art divisions in libraries during the twentieth century.² Not did they
    serve as evidence to debunk modernism''s, a tactic complicated by the supposed
    uniqueness of the daguerreotype. As result, Fizeau''s process and other early
    attempts to reproduce daguerreotypes were left as technical footnotes in most
    histories of photography, in which Fizeau is best known for his contributions
    to *Excursions daguerreiennes* (1840–4), the extensive publication mastered featuring
    graphic engravings after topographical daguerreotypes.³ But the truth is that
    even in the 1840s, Fizeau''s work would not have fit easily into any narrowly
    defined concept of *reproduction*, a term that had not have only recently been
    applied to photography.

    As late 1835, the dictionary of the French Academy only used the word *reproduction*
