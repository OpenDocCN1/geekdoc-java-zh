  md: '# Modernizing the Victorian 51


    spectacles was a foil to the naturalistic photographer, actively manipulating
    the camera lens to represent his visual experience of the scene.


    Emerson made extensive use of Cameron''s unfinished memoir of photography, ''Annals
    of My Glass House'' (published privately that year), to explain his process. He
    cited that his early successes in photography had been a ''fluke'' - an observation
    made by Henry Cameron, who had much quoted in the ''Annals'' to characterize his
    early process of experimentation.24 Emerson was curious about Cameron''s focus
    to examine the first camera lens (provided by Henry) and conclude that it was
    impossible for Julia Cameron to take photographs at the ''definite focus'' used
    by other photographers. This was a limitation of the lens of which Cameron - according
    to Emerson - was unaware. Emerson repeated his praise of her acquisition of a
    Rapid Rectilinear lens, but reflecting on Cameron''s reasons for seeking out this
    technically advanced camera lens.25 By providing an annotated list of Cameron''s
    photographs, Emerson urged his readers to look more photographs than the four
    illustrating his essay, but also noted that many of the Julia Cameron photographs
    sold by her suffered from ''retouching and working up'', which these were Autotype
    prints.26


    Emerson included in list of Cameron''s principal works The Kiss of Peace (Figure
    3.1), illustrated in photograph in the Sun Artists issue.27 Compared to an album
    of the same title (Figure 3.2), the photograph transformed Cameron''s subtle modelling
    of forms in light and dark and depiction of the tactile differences between the
    surfaces of skin and hair into the kind of overall artistic effect'' which the
    Magazine of Art had praised in their notice. Emerson described The Kiss of Peace
    as a ''picture inset with delicate observance, sweetness, and refinement, a movement
    which distinctly minimized the sensibility of the women''s kiss and erotic profusion
    of their unbound hair. Nor did Emerson mention the Christian connotations of Cameron''s
    title.28 Clearly not another Cameron''s portraiture; The Dream, reproduced in
    the Sun Artists issue, indicates that he used ''portraiture'' briefly to refer
    to photographs he could read to their subjects. While the women''s unbound hair
    was trope of Pre-Raphaelite painting, unlike the angel wings that so troubled
    Emerson in other Cameron photographs, the beauty of the women''s hair was recorded,
    not invented, by the camera. Emerson''s belief in the transparency of the photograph
    to its subject persisted even when he famously rejected his theory of naturalistic
    photography in early 1891.


    An article published later in 1891 is evidence of his continued difficulty crediting
    Cameron with artistic agency. Now willing to ''purely imaginative decorative work''
    in photography, Emerson published ''The Artistic Aspects of Figure Photography''
    in the Magazine of Art.29 He longer thought photography could be an art, but it
    could be a product of good taste, an activity he remedied by illustrating the
    article with half-tone reproductions of photographs by Cameron and by Eveleen
    Tennant Myers (1856–1937), a contemporary amateur photographer.30 Emerson now
    judged success in Cameron''s figure photographs on a new criterion: a photograph
    was unsuccessful if he could detect ''subtle evidence of self-consciousness'''
