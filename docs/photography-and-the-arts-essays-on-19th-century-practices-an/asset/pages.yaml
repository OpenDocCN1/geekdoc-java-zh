  md: '# Modernizing the Victorian:

    Reading the Photographs of Julia Margaret Cameron

    1886–1914


    Joanne Lukitsh


    On 1 January 1886, the Photographic News, a London weekly, published A Reminiscence
    of Mrs. Cameron by a Lady Amateur, which began, ‘I suppose the great majority
    of modern photographers – at least the younger ones – remember very little of
    the pictures of the late Mrs. Julia Margaret Cameron.’ The author’s account of
    the question of Cameron.¹ She first saw photographs by Cameron (1815–79) at an
    exhibition in London. The Lady Amateur blended observations on Cameron’s exhibitions
    and reviews in the press with personal recollections of the photographer. The
    Lady Amateur’s account of the difficulties of performing as ‘Vivien’ for Cameron’s
    photographic illustrations for Tennyson’s Idylls of the King is well known in
    the literature on the photographer, but other remarks in the reminiscence are
    historically significant. Declaring that Cameron ‘was in fact, a Whistler in photography’,
    pursuing photographic for art’ sake, the Lady Amateur concluded with the question
    of Cameron’s legacy. She wondered whether Cameron’s photographs, like those of
    her contemporary, Oskar Relander (1813–75), were difficult to access and view.
    If so, this was unfortunate, because Cameron’s photographs ‘drew attention to
    something in the way of portrait, not so mechanical and microscopic in detail.’²


    According to the Lady Amateur, Cameron’s work had rapidly fallen into obscurity
    since her death in 1879. The century for constructing Julia Margaret Cameron’s
    posthumous fame as a photographer, lauded for her portraits of important subjects
    and her illustrations, has been given to the Bloomsbury group, in particular,
    to Cameron’s great-niece, Virginia Woolf (1882–1941), who wrote more about her
    great-aunt in the 1920s.³ The historical formation of Cameron’s artistic reputation
    began decades earlier. The Lady Amateur’s appreciation in 1886 for Cameron’s ‘peculiar
    softness’ of detail in her portraits was an early instance of what became a widespread
    interpretation of Cameron’s importance to contemporary photography. Beginning
    in 1889, with Peter Henry Emerson’s (1856–1936) treatise, Naturalistic Photography
    for Students of the Art, photographers claimed Cameron as a precursor for their
    artistic work, staking their'
