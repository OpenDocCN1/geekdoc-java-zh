    Evans'' appreciative reading of Cameron as a precursor of modernist photographic
    vision became more decisive in a historical narrative of progress in photography
    by R. Child Bayley (1869–?), an English photography editor and writer. Bailey,
    in his discussion of ''Pictorial Photography'' in the 1907 book The Complete Photographer,
    placed Cameron in relation to his mid-Victorian peers, Rejander and Henry Peach
    Robinson (1830–1901), but believed the value of Cameron''s portraits was characterized
    by a breadth and force such that in no one since the time of him is one or two
    modern masters, of whom Steichen may be noted in particular,⁷ Tukey described
    a narrative of continuity and succession for the artistic achievements of photography,
    situating Cameron between David Octavius Hill (1802–1970), and Edward Steichen
    (1879–1973), the accomplished contemporary American photographer. Alfred Stieglitz,
    of Camera Work, the journal of artistic photography, excepted Bayley''s book in
    1907.⁸ Stieglitz had him the ‘father of artistic photography’ in Camera Work in
    1903, but Bailey''s was the first mention of Cameron in the journal.⁹ Stieglitz''s
    editorial direction of Camera Work was shifting from artistic photography to developments
    in modern painting and other media, though he continued to publish on contemporary
    photography and on historical photography by Hill. This approach would inform
    a new, startling modernist reading of Cameron, one effected by images rather than
    words, in Camera Work.


    When Stieglitz contacted the Autotype Company in the fall of 1912 to enquire about
    photography plates made from Cameron''s negatives, the Cameron replied with a
    list of the twelve negatives – all portraits, one remaining in their collection
    from the nearly seventy subjects from Cameron''s day.¹¹⁰ In his editor''s notes
    to the January 1913 issue of Camera Work, Stieglitz described the five Cameron
    photographs reproduced in the issue as ‘directly from the original collision negatives
    which average about ten inches in size.’¹¹ Three of the Cameron photographs he
    reproduced were from 12 × 15 negatives, not much larger than the size of a page
    in Camera Work. Stieglitz''s account of the correlation between Autotype Company
    negative and photography plate served a rhetorical purpose: these Camera Work
    photographs were faithful representations of his images.¹²


