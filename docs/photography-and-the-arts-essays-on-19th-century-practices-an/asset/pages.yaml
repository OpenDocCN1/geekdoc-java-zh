  md: '# Photography and the Arts


    the photographer’s skill or labour, as was for painters and sculptors. painting,
    where every detail has been conscious attention to the artist’s eyes and hands,
    photography records everything, trivial or important, and the photographer cannot
    discriminate by finishing them differently. As Kelsey argues, photographers could
    eschew finish only by courting chase, as Cameron did in his embrace of mistakes
    and accidents. The decision to halt, reverse or not invest in technical proficiency
    – photography’s indiscriminate finish is not, however, an accident.


    We find an echo of Eastlake’s article in a letter Cameron sent Herschel in 1864:


    I was interested reading Sir David Brewster’s eloquent speech on photography.
    I could not help wishing you had been on the subject and that had spoken of my
    Photography [which is not] more conventional topographical Photography – map making
    – skeleton rendering of feature & form with that roundness & fulness of feature
    & modelling of flesh & limb which the focus use can only give who called condemned
    as ‘of focus’. What is focus – and who has the right to say what focus is the
    legitimate focus.⁴⁵


    In this often-quoted letter, Cameron argues that notions of legitimate focus trap
    photography into map making, flattening a three-dimensional world into schematic
    designs that do not achieve ‘modelling of flesh & limb’. For Cameron, the focus
    use is more than a way to passively following what it is defined as able to do
    by its manufacturers converge rays of light into one point – but as a way to react,
    and interact with, the spatial, compositional and affective positions and relations
    between sitter, camera and photographer.⁴⁶


    The reference to Brewster’s speech in the letter to Herschel is also a reference
    to sculpture, a different one from Michelangelo’s Photography, in Brewster’s speech,
    is a scientific or conceptual instrument of use to art only to ‘supply [...] perfect
    copies of every work of ‘art’ with ‘unnerving accuracy’ and precision of details.⁴⁷
    Brewster does mention, however, use of photography as a tool to record sculptures
    but to make them: ‘M. Willem in Paris has invented the new art of photography
    making a correct copy of the living figure’. He predicts that the ‘wonderful process’
    will make portrait sculpture more affordable, so that


    our houses may be dearly adorned with the busts of relatives and friends, and
    those of who, by their genius, learning, or their virtues, are objects of interest
    or veneration.⁴⁸


    In Eastlake’s terms, there would be nothing more than three-dimensional copies
    of sitters, with all the faults of unthinking detail that also barred photographs
    from achieving the status of ‘authentic’ portraits. Brewster (1781–1868) had been
    one of the first to write extensively about photography as part of his interest
    in ‘engines of the fine art’ – photography, electroplating and sculpting machines
    – new inventions that powered the production and reproduction of ‘art manufactures’,
    commodities inspired by or copying works of art or natural objects, using mechanical
    means.'
