    I want to return to Matilda Rigby. We find her in the chair, in another portrait
    by Hill and Adamson from the same sitting (Figure 6.3). Arguably, she appears
    less Rembrandtesque. Light does not blot out her face in this portrait, nor without
    closer inspection, the colours of her head. Everything in the frame looks much
    like this. But, upon closer inspection, a discarded necessity a parasol has been
    lightly closed and propped up. To the right of the subject''s face, the sitter
