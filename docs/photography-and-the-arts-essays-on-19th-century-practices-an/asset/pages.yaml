  md: '# Carlyle Like a Rough Block of Michelangelo’s


    Cameron''s label exploits to the full the affective, social and aesthetic annotations
    of the term ''rough'', as well as the tactility of sculpture. Carlyle, who in
    1867 was still grievous, was known to be temperamental and bad-mannered, ''very
    rude and quarrelsome [...] a man who had not been brought up in the parlour.''15
    Cameron himself was indignant that Carlyle had initially refused to sit for her,
    even though she had already ''immortalised'' some of the greatest men of age,
    protesting that it would be – a kind of Inferno.''16 To photograph him, Cameron
    had to move her equipment, darkroom and all, which took a day to set up,17 to
    Little Holland House,18 where her sister Sarah Prince held one of the leading
    artistic salons, by the presence of Watts who lived and had his painting studio.
    Carlyle was a regular and might have been already sitting for Watts’ 1868 portrait
    of him (Victoria and Albert Museum, London). Cameron took the photograph on a
    bad day, a mid of pouring rain and cloud when light would have given Cameron fewer
    choices about positioning her subject.19 Cameron''s label ''Carlyle like a rough
    block'' attributes to the roughness of hand-quarried stone, but also justifies
    it as an attribute of genius, as Michelangelo argued with roughness and status
    – he was supposed to have hit Mises with the hammer in frustration at its silence
    even though it looked otherwise so alive – was described in the many biographical
    accounts published in the nineteenth century.20 At the same time, he is pointing
    out that if this is printed, ''2 in the list Cameron attributed to the album,
    that has the power to portray him in quality, a quality she herself had to experience
    to pose for her. Cameron is comparing her own photographic ''roughness'' to Michelangelo’s,
    but not merging with Carlyle and the experience of photographing him, compounded
    by the rough weather. While many Cameron’s prints are ''After the manner'' of
    artists from the Renaissance, here Cameron is implying a correspondence of aims
    between her and Michelangelo that is deeper. Cameron might light to compose from
    painters, but in Michelangelo’s sculpture she finds a correspondence to her way
    of working. As explained in 1867, writing to an unidentified art critic, ''Carlyle’s
    Photograph is more like a block of marble of Michael Angelo’s hands than a work
    of such a machine as the camera.''21 In her, she suggests, photograph can transcend
    the tension between her and machine.


    Thomas Carlyle (1795-1881) would have a loaded subject for any artist to portray.
    He was the one who had made the initial proposal in 1856 for the founding of the
    National Portrait Gallery. The popularity of his writings on the powers of ''authentic''
    portraits, to make history as a moral inspiration for the people, had played a
    role in Parliament’s decision to invest in portraits made in the presence of the
    sitter, rather than commissioning copies.22 This would have made the process of
    assembling a collection of worthy individuals faster and cheaper than wanting
    original portraits to come on the market, but the extra expenditure was justified
    because only portraits made by a ''faithful human creature of face and figure
    that he saw with his own eyes'' would allow subsequent viewers to imaginatively
    stand in the place of the artist and encounter anew the heroes of the past in
    an educational experience.23 This understanding of an authentic portrait as the
    result of an immediate encounter between sitter and artist is why photographs
    were not initially included in the Gallery’s primary collection.'
