    too, told Colnaghi that all Artists were to have my prints at half price.25 Her
    determination that Cameron saw herself as an artist and that offering her work
    at a discount – apparently outweighted her desire to earn as much as possible
    from her photographs – even to meet her expenses – which she lamented in the letter.
    It is possible that Cameron saw herself as an artist and that offering her work
    at a discount to other artists was a way of asserting that she was one. But it
    also possible that she viewed her photographs as inspirational for artists, which
    was the opinion of her Coventry Palmer. One of Cameron''s most eloquent supporters,
    he compared her photographs to Old Master paintings and suggested that their ultimate
    purpose was as tools for artists, rather than works of art in their own right.
    In fact, he rejected her ''endeavour[ing] to make pictures out of them'', complaining:


