  md: '# Photography and the Arts


    Sitting for a machine controlled by an operator — mechanical rather than artistic
    hands — did not count as a ‘meeting between two subjectivities$^{24}$ Cameron’s
    claim that her work is like Michelangelo’s insistence on the presence of her subjectivity,
    embedded in the results of her interactions with the photographic process.


    Carlyle’s writings influenced Carlyle’s thinking about hero-worship, and the power
    of creative labour to employ in a portrait ‘a summary of the life of a person,
    not the record of an accidental impression’ as he tried to do in his portrait
    of Carlyle$^{25}$ If, as art historian Paul Barlow has shown, Carlyle’s painting
    ‘roughly, creating an agitated series of brushstrokes, smudging and scrapping’
    was how the painter helped the authenticity of his encounter with Carlyle in the
    portraits of him as an unresolved struggle$^{26}$ Cameron before Watts embedded
    in her own struggle with Carlyle and with materials to record more than the ‘accidental
    position’ of her sitter. Her unwillingness to fix Carlyle’s stance and (e)motions
    in front of the camera, visualized by her reticent or imprecise face, was enhanced
    and materialized by her ‘own hands’ handling glass plates, and pencils to make
    prints.


    Michelangelo had a special resonance in Michelangelo’s circles. Watts had labeled
    ‘England’s Michelangelo after studying in Italy in the 1840s$^{27}$ He was known
    to advise pupils to copy from Michelangelo$^{28}$ and Cameron’s ‘A Sibyl after
    the Michelangelo’ was part of their ongoing composing on pictures — a print is
