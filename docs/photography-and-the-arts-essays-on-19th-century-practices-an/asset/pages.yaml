  md: '# Impressionism in Photography 141


    The painter may not play with the tone or relative values of his subject and picture.
    He may not falsify what the eye sees in respect of focus and atmosphere, nor indulge
    in several points of sight. He cannot do much more than the photographer to express
    the relative interests of his subject, which must generally depend upon the point
    of focus of the eye.¹¹


    # Davison''s sources: Naturalistic painting and photography


    Davison described ''a more judicious section of the Impressionist painters as
    ''The Naturalistic School, whose tenets could be found in ''fresh, direct, convincing
    little work which every photographer had read.''⁰ The book was Francis Bates''
    The Naturalistic School of Painting, published in 1887 from Bates''s 1886 articles
    in the periodical The Artist.¹¹ Bates was the Secretary of the New English Art
    Club, an exhibiting society founded in 1888 and influenced by French Naturalist
    artists and the practice of plain air painting.¹² had defined ''a good'' as dependent
    on the ''first impression'', which should be ''as near as possible, the first
    impression of nature.''³ This seemed an artistic opportunity for photographers,
    whose cameras could be said to record that first impression of nature. Davison
    declared that ''it is only in the light of such views, that I care to examine
    or put forward, the of photography ... to be admitted as a capable means of artistic
    expression.''⁴


    There was substantial overlap between Bates''s ideas and those of Peter Henry
    Emerson, Davison''s colleague at London Camera Club. In 1889, Emerson published
    Naturalistic Photography for Students of the Art, which presented a detailed (and
    often intense) argument against conventionalism in art and photography. Emerson
    heralded a new approach largely inspired by the painters of the New English Art
    Club, whom he described as ''Naturalism''⁵ earnest and sincere bond of young artists,
    whose watershed was⁶ Emerson and Bates covered many of the same concepts in very
    similar language, and both used ''Naturalistic'' in the titles of their publications.¹⁷
    They advocated diffential focus to match the eye''s imperfect capacities and a
    centralized composition to align the picture''s emphasis with the viewer'' attentiveness
    to key parts of the original scene. Another shared concern was the representation
    of the broad luminosity of ambient light with the limited range of tones achievable
    with paint on canvas or a photograph on. This led both Bates and Emerson to advocate
    a restricted or subdued tonal range. Davison addressed these pictorial and technical
    elements in his lectures, but only credited Bates. This would have seen a surprising
    omission, as Emerson''s book was widely discussed in photographic circles. From
    the time of its publication, it was rarely out of the pages of the photographic
    press, which revealed in the heated debates between supporters and detractors.
    But there was animosity between Davison and Emerson, who attacked Davison''s increasing
    prominence as the Secretary of the Camera Club, an association that Emerson had
    helped found. Emerson also criticized Davison''s photographs, as would be discussed
    in this essay.


    Davison would have seen the New Naturalistic painting in the annual exhibitions
    of New English Art Club, nearly all of which were covered in the photographic
    press.¹⁸'
