    # ## Limitations of the photographic: Art and chemistry


    Blanquart-Évrard was not interested solely in animating the views depicted by
    means of *naturalized genre* scenes. Even if people going about their everyday
    business had been assigned a great significance to his pictures, the photo-chemist
    never forgot to assign the impact of geochemistry. But it is not solely the subjects
    portrayed, but also the media quality of the depiction that is the prerequisite
    for creating works of art by ''intelligent'', here apparatus-generated photographs.
    Blanquart-Évrard reflects on how this can occur – even years after his *Imprimerie
    photographique* was completed in 1855 – the treatise he published in English in
    1863, ''On the Intervention of Art in the Practice of Photography''. In it, he
    makes it clear that art has gained foothold in photography not solely thanks to
    the representation of new subjects. He does so by showing us the dilemma of photographs
    reproducing human activities, which they can always only be based on a very brief
    moment, succeed in showing the potential influence that art is able to exert on
    such photographs. The “... influence exerted by art reduces'
