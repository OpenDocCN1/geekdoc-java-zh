  img_proc: true
- pgno: 37
  md: '# Introduction


    Before summarizing their subjects, arguments and approaches, we will first elucidate
    the dominant methodologies and theoretical frameworks that inform recent cultural
    theorizations of the plurality of nineteenth-century practices today characterized
    as the ‘photographic’.


    Recent theorizations of photographic meaning in the European and American sciences,
    social sciences, and literature have reframed narratives of nineteenth-century
    photography beyond of a quest for artistic legitimacy.³ Beginning in the late
    1990s, situated nineteenth-century photographs in relation to contemporary epistemological,
    scientific and philosophical paradigms has become a scholarly imperative, as has
    an insistence on the interdependence of these paradigms with ideas of physiological
    and aesthetic vision. In Burning with Desire: Conceptions of Photography (1997)
    Geoffrey Batchen tended to the social and cultural emergence of photography through
    discourses of photochemical experimentation dating to the Romantic period. In
    Objectivity (2007), a major work in the history of science, Lorraine Daston and
    Peter Galison identified the subject not as a desideratum, but as a methodological
    approach that gained scientific authority in the nineteenth century and was substantially
    entangled with philosophical and subjective issues of self.⁴ The authors, a historian
    and a philosopher of science made their claims by reference to the graphic, and
    sometimes photographic, illustrations of empirical data in scientific cheaply.
    Jennifer Tucker, also a historian of science, analysed photography as a major
    component of scientific investigation in Nature Exposed: Photography as Eyewitness
    in Victorian Science (2005), in which she argued that photography did not appear
    fully formed as an objective evident mode. Instead, it was seemingly unobshaded
    by the perceived subjective frightening of contemporary scientific writing, objectivity
    was manufactured for it. Owing to the insights of Galison, Daston, Tucker and
    other scholars, it is no longer viable to read the mechanical operations of the
    camera against the subjectivity and artistic agency of the photographer.


