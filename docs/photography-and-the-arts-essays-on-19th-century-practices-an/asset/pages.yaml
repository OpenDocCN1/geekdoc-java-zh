  md: '# Casting History


    Sydenham in 1854. However, by the latter half of the nineteenth century, photography
    was already beginning to replace plaster as the medium of record and circulation
    for architectural and archaeological monuments, offering much more stably images
    that were far easier to commission, take, print, reproduce and disseminate at
    much less cost than the early military-style campaigns needed to make plaster
    copies around the world. As photography became an increasingly permanent and affordable
    medium, the messiness and laboriousness of plaster casting were increasingly apparent.


    Such monumental (in all senses) reproductive projects as Cole’s were only possible
    in the nineteenth century through the colonial networks of the British Empire.
    What might be also interpreted as a kind of colonial monument trophy hunting by
    European museums was also increasingly critiqued in the twentieth century crumbled.
    Despite their subsequent separation, it is important to demonstrate that plaster
    copies were, for a time, the authority of the superior reproductive method with
    photographs playing the subsidiary role of correlative evidence. When photographs
    eventually eclipsed plaster copies, and other reproductive methods, in the twentieth
    century – a process described by Stephen Bann as ‘photographic exceptionalism’
    – much of this previous, intertwined history was lost.³ As a result, monumental
    replicas were cast out of art and architectural history, returned to the dust
    from which they were.


    I would like to thank and acknowledge the helpful advice and suggestions that
    the co-editors have provided throughout the process of writing this chapter. I
    am also grateful to colleagues at Delhi University, the South Asia Institute at
    Columbia University and the Victoria and Albert Museums who gave invaluable feedback
    on the ideas contained within this chapter.


