  md: '# Casting History


    destroyed in the 1950s.* Indeed, the plaster casters were made in Shepherd''s
    photograph no longer existed at the Museum. The removal, and sometimes destruction,
    of these plaster cast collections also resulted in the eradication of the historical
    interaction of the reproductive technologies of plaster and photography, undoubtedly—
    however partially— had rapidly expanded the European view of other cultures''
    monuments and artifacts through the medium of the copy in the nineteenth century.
    As museological photographic archives became more expansive and embedded within
    cultural institutions, plaster cast collections were, conversely, removed from
    view for reasons that indicated space-saving reorganizations of rapidly expanding
    museums and feelings of embarrassment over world-class museums being filled with
    copies.


    Cole''s Indian casting campaigns demonstrate the role of the plaster caster in
    colonial aesthetic notion, particularly within colonial museums and art schools.
    The plaster cast copy played an important, if somewhat short-lived, role within
    colonial networks of collecting, archaeological exploration and museum display,
    supported, affirmed and maintained by a burgeoning archive of reports, drawn illustrations,
    photographs and descriptive texts. It existed in a ‘reproductive continuum’ as
    Malcolm Baker has observed in his work on the South Kensington cast courts.¹ In
    bringing photography and plaster casts back together, this study of Cole''s plaster
    casting project and Shepherd''s highlights the symbiotic cultures of plaster and
    photographic copying (and two-dimensional forms) that created a new world of art
    reproduction in the second half of the nineteenth century, not just in Europe,
    but also globally. As Mari Lending has observed in her recent work on plaster
    casts of architectural monuments: Monuments travel across media and materials,
    and in time, producing complex entanglements of copies and originals² am arguing
    that, in researching the ‘technochemical complexity’ of these nineteenth-century
    reproductive casting-photograph projects, we can gain richer understanding of
    the conceptualization of the relationships, of the ‘entanglements’, between copies
    and originals, objects and images, metropolis and colony in the nineteenth century,
    and beyond.¹⁰


    # Casting campaigns: Henry Hardy at Sanchi and Delhi


    Henry Hardy supervised two casting projects in the winter of 1869–70.¹¹ As Tapati
    Guha-Thakur’s work has discussed, these were at the Buddhist stupa at Sanchi,
    dating from the third century BCE and situated in the state of Madhya Pradesh,
    and the second was at the Q in Delhi described above. Attached to the Royal Engineers
    in India until his return in 1885 at the rank of lieutenant colonel and also the
    surveyor of the Northwestern Provinces of India (1868–71), Cole convinced his
    superiors in the Government of India to undertake the casting work and share the
    non-insignificant cost of these reproductions with what Cole described as series
    of ‘structural facsimile’ in plaster which could have been transported from their
    original site in India to the museums of European cities of London, Paris, Brussels,
    Edinburgh and Dublin, as well for exhibition and displaying in the growing network
    of colonial art schools and museums in India. Cole was particularly keen on the
    latter, lamenting the cheap copies of European artworks that filled many collections
    in India,'
