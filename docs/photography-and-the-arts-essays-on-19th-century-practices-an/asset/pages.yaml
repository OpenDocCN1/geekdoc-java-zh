    contributor to the photographic journals beginning in the late 1850s. His strategic,
    and often contentious, contributions to the debates in these journals over photographic
    aesthetics were significant at the time for defining terms and parameters, and
    are significant now for exposing their stakes. Around 1860–1, Wall came to exert
    an unprecedented degree of influence at the Photographic News; at the same time,
    his writings were reprinted in other photographic journals (including US ones);
    and his other activities, as secretary of the South London Photographic Society,
    ensured that his found another platform in the minutes of his meetings that were
    published in photographic journals. Wall''s behaviour was critical: his output,
    which was prodigious, was written not only under his own name, but also anonymously
    and pseudonymously, a modus operandi which helped him garner substantial column.
    He brought the more opinion-led, adversarial mode associated with the back pages
    of the photographic journals to the front. By altering, in this way, the infiltration
    of author modes associated with the commercialism of journalism, Wall''s writings
    provide us with the means to read critically the debates in which he engaged,
    with his tedious style provoking other writers to reveal the interests at stake.
    As a petty-bourgeois worker in photography, Wall''s writings for the photographic
    journals might be claimed for self-culture, and his inability to secure a stable
    line of work showed that some of his leisure might have been enforced. What follows
    Wall''s early writings on photography as not idiosyncratic but liminal, offering
    us the means to detect what was not necessarily articulated. It seems that the
    (appearance of) self-culture was achieved not only by deceptive ends.


