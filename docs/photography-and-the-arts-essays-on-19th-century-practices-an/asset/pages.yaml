    # Sun picture


    Eleven years later in ''Photography'', when Lady Eastlake, conjures Rembrandt
    to prefer her account of the medium as a ''house-hold word and a household want,''³34
    she returns of the Quarterly Review to catalogues by Hill and Adamson. Reflecting
    in 1857 upon the capacity of the sun ''both to discern and execute''s works previously
    comparable with the Dutch master, she declares that ''the likeness to Rembrandt
    and Reynolds is gone!''³35 Lamenting what has been elapsed in practice, if not
    lost to the memory, she attributes such a decline in ''artistic'' connection to
    technological and chemical developments - especially Frederick Archer''s collodion
    process - that is now all careful making out.³36 the capacity of the calotype
    to capture the mystery of light in Rembrandt''s works has sacrificed for a capacity
    to see much.


    Between her Review of German Art'' and her essay ''Photography'', Eastlake had
    gained considerable knowledge of the photographic medium. In the later essay,
    she voices her critique of social and artistic implications of new processes as
    to the agency of the sun, contributing to a late nineteenth-century discourse
    anthropomorphizing early photography as the sun''s relative willingness to perform;
    he is generous or ever miserably with his rays. Eastlake''s contribution is distinctive.
    While she maintains that with advances in photography the sun is a reformed ''sluggard''
    and liberated from the ''drudge[ry]'' of Niep''s heliography, Eastlake demands
    advances in chemistry that forces the sun to work too fast.³37 She laments the
    rapid of collodion that requires the ''wink'' of the sun''s eye, fearing instead
    a few earliest minutes of the ''his gaze'' to generate catalogues.³38 Extending
    her scepticism to landscape photography, Eastlake maintains that the faster process,
    disregarding the ''whole'' of a composition as prioritized by ''art'', seems embarrassed
    with the treatment of several decades of gradation.³39 Speed of collodion of a
    photograph seems not to be commensurate with that of the foreground,⁴0 thereby
    compromising ''truth to nature'' as John Ruskin had articulated it.'
