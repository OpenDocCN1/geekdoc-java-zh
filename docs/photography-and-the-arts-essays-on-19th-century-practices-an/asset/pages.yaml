    The title of this anthology does not specify a geographic qualifier. This is not
    to universalize the Western European, British colonial (and, to a lesser extent)
    American scenarios, practices and discourse that the essay presents. The imperatives
    of industrial capitalism, giving rise to, in the sphere of visual culture, cheaper
    modes of dissemination and visual imagery, are always in tension with specific
    national formations (such as political discourse, scientific research, government
    patronage of the arts and arts education) and with more metropolitan formations
    (such as the display, and sale, of historical and contemporary art). The historical
    specificity of the case studies presented here is the basis of broader significance:
    their rigorous historical method is the standard by which we judge their findings
    and interpretations. Other contributions made by this volume include the bringing
    of contemporary ‘art’ practices with research attending to science, manufacture
    and popular imagery. The self-owed endeavours of British figures as Hill and Adamson,
