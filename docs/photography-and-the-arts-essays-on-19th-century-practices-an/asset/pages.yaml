  md: '# Art, Reproduction and Reportage:

    Roger Fenton''s Crimean Photographs


    Sophie Gordon


    Despite the acknowledgement of Roger Fenton (1819–69) as a significant Victorian
    artistic photographer, the photographs he took in 1855 during the Crimean War
    have been described as ''propaganda'' intended to ''counteract the negative depiction
    of the campaign in The Times.''¹ With Fenton considered as a Government stooge,
    it is, perhaps not surprising that historians of photography have found the Crimean
    photographs so difficult to incorporate into Fenton''s story. Noted authorities
    on Fenton have suggested that Prince Albert (1819–61) may have a role in commissioning
    the photographs or that the publisher Thomas Agnew and Sons was instructed to
    send a photographer to the Crimea to produce images intended to counteract the
    contemporary criticism of the war.


    A careful study of the visual sources as letters written by Roger Fenton, however,
    provide clear evidence that Agnew and Sons provided Fenton with a very specific
    commercial and artistic brief to provide photographs to serve as studies for the
    painting by Thomas Jones Barker (1815–1882), The Allied Generals with the Officers
    of Their Respective Staves before Sebastopol (1856) (Figure 8.1). The publisher
    also organized exhibitions of Fenton''s Crimean photographs, which were staged
    in twenty-two British cities between 1855 and 1856. With these exhibitions reportedly
    visited by 2 million people in Britain, Agnew and Sons earned a substantial sum
    of money from admission fees and catalogue sales. Fenton''s Crimean photographs
    participated in a visual culture in which works of fine art, the purchase of art
    reproductions and access to photographic images were inseparable from the public''s
    knowledge of the war through reportage in the press.²


    # The Crimean War 1853–6


    The Ottoman Empire declared war on Russia on 4 October 1853, and Britain and France
    joined the Ottomans in March 1854. As the campaign in the Crimean Peninsula continued,
    reports of the sufferings of British troops became harder to ignore, particularly
    as winter set in, and there were sustained criticism of the senior'
  merge: -1
  img_proc: true
- pgno: 155
  md: '126


    Photography and the Arts


    military leadership. News of the war was reported daily in papers and magazines.

    There was little censorship at the time – reports come in accredited journalists,
    such as William Howard Russell (1820–1907) for The Times; soldiers wrote letters
    for publication and visitors to the battlefield published their own accounts.
    Many of these reports concerneded on the experiences of the ordinary soldier,
    suffering unnecessarily due to poor leadership in battle and poor logistical management
    in general. These reports began to change popular attitudes towards the war, although
    for the ordinary soldier remained strong. The Poet Laureate, Alfred Jones Newton
    (1889–92), wrote The Change of the Light Brigade (1854) as a response to Russell''s
    article in The Times describing this change in the Battle of Balaklava. Russell''s
    reports undoubtedly contributed to the fall of Prime Minister Lord Aberdeen''s
    government in 1855. The new political administration set about trying to improve
    conditions for the troops. By the time Fenton arrived on 8 March 1855 in Balakura,
    while the British army was based, supplies were starting to arrive more frequently.
    The weather was also improving. Fenton experienced quite different from the previous
    year.


    # Fenton''s commission to take photographs in the Crimea


    It is no surprise that Agnew and Sons turned to Fenton as the best and most appropriate
    photographer to work in the Crimea. Fenton had made photographs in Russia in 1852,
    when political tensions with Britain were rising. His photographs from this expedition
    were exhibited in Britain the same year and until the end of the Crimea War in
    1856. The Illustrated London News published wood-engraved reproductions of Fenton''s
    1852 Russian photographs in the early months of the Crimea conflict, closely connecting
    Fenton''s photographs with current events in their reader'' minds. Fenton received
    his from Agnew and Sons in the autumn of 1854, but did not leave Britain until
    20 February 1855. The letters to his wife Grace and to Thomas William Agnew, the
    commissioning agents, make the terms of his photographic mission clear. The Agnews
    asked Fenton to produce portraits of the senior officers and significant individuals,
    topographical subjects and photographic compositions of figures and groups—which
    evokedictions in which the troops were placed at the scene. Fenton described in
    his letters as about obtaining ‘pictures’ of the people & subjects likely to be
    historically significant.’ Whilst there was little direction about the choice
    of the topographical subjects was given, Fenton clearly had in the letters expresses
    concerns over his ability to photograph everyone required for the commission,
    including the Duke of Cambridge and Sir John Fox Burgoyne, who had left the Crimea
    before Fenton arrived, and whom Fenton photographed after he returned to Britain
    in July 1857.


    Whilst there was clearly an agreement for Fenton’s work to be on public display
    when he returned to Britain, Agnew and Sons also commissioned Thomas Jones Barker
    to produce a large oil painting around the subject of the allied assault onastopol.
    The painter was expected to include in the painting as many of the senior military'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Art, Reproduction and Reportage


    as possible, along with other notable individuals. Barker was to copy and incorporate
    Fenton''s photographs into his painting in order to get the best likeness of each
    person. For The Allied Generals with the Officers of Their Respective Staffs before
    Sebastopol (Figure 8.1) Barker copied as many as Fenton''s photographs. The visual
    evidence of the painting makes clear that Barker copied some exactly; for others,
    the painter combined two or more photographs, sometimes one person''s head with
    another person''s body. Occasionally he copied entire groups, as those in the
    Fenton photograph, the 8th Hussars Cooking Hut, almost directly from the photograph
    into the lower left corner of the painting (although omitting the woman at the
    back of the group). Barker also copied Fenton''s Wound Zouave and Vivandière,
    inverting its composition and placing it at the lower right of the painting (Figure
    8.2). A comparison of Barker''s painting with Fenton''s photographs of another
    woman, Fanny Duberley, a telling indication that Barker did not treat Fenton''s
    photographic study as an inviolate document, as for portraits of women. It also
    reveals that the figure of Florence Nightingale in the former was based on Fenton''s
    study


    Barker was particularly known as a painter of contemporary historical scenes.
    Working with Agnew and Sons and other printsellers, he achieved commercial success
    through the sales of the copy and the graphic reproductions of his works, usually
    following their public exhibition. Barker displayed a painting with the expectation
    that visitors would purchase a printed reproduction: sales of prints were expected
    to make money, not the sale of the painting. This procedure meant that commissioning
    the original subject and acquiring the copyright for its graphic reproduction
    were paramount. It was reported at the time that Agnew and Sons spent £100 on
    Fenton''s Crimea commission.¹10 The publisher''s commission of photographic studies
    for Barker''s painting goes some way to explaining why Fenton photographed certain
    individuals in different poses.


