    Such episodes of aestheticized violence can be seen in terms of conflicted habits:
    Pierre Bourdieu used the system of internalized structures, schemes of perception,
    and action that provide the coordinates for thought and agency within a society.³¹
    Both Chaudhary and Piney have on the habit to theorize colonial culture, the former
