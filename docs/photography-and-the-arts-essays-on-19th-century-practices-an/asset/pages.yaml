    During the course of her photographic career, Cameron not only exhibited in commercial
    art galleries, international exhibitions and photographic society exhibitions,
    but in 1865 the V&A itself (or rather the South Kensington Museum, as it was called)
    acquired over 100 elements of her Italian Renaissance-inspired Madonnas, literary
    subjects and evocatively soft-focus, close-up portraits of writers and artists³.
    The museum exhibited them later in that year, of one critic, in ‘a prominent place…
    close to the picture collections’. Cameron’s only museum exhibition during her
    lifetime, granted further institutional endorsement to her photographs and suggests
    that the museum was remarkably early in accepting photography as an art form.


    The apparently stable identity of photographs made with ambition at the time the
    1860s, collected and exhibited by a museum of art and design, displayed in that
    same today is complicated, however, by a closer examination of those photographs.
    If some of the photographs the South Kensington Museum acquired from Cameron were
    to be presented in the same manner as the O''Sullivan museum has not mount the
    original mounts would be in fact consistent. The mount of a photograph Cameron
    Devotion (1865), for instance, bears not only Cameron''s own signature and annotations,
    but also museum classifications handwritten directly on the mount as well as a
    typed label in one corner (Figure 12.2). These markings are testament to its path
    from Cameron''s studio to the museum and its subsequent journey into the institution.
    When these clues are added alongside other sources of archival evidence, including
    private letters, published articles and museum documentation, the presumed status
    of Cameron''s photographs as works of art becomes less certain. The aim of this
    essay is to investigate these primary sources in order to demonstrate that the
    status of Cameron''s photographs has not been fixed since they entered the museum
    and furthermore that their artistic standing was never secure in the first place.


    # Photographs classified


    Devotion makes a useful case study, since the markings on the mount are especially
    legible and demonstrate how Cameron''s works occupied multiple registers for the
    photographer herself, as well as within the museum. Although its landscape orientation
