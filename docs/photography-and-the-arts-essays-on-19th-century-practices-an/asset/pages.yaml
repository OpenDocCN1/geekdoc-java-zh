    Carlyle''s portrait has been much written about. Curator Colin Ford, who was instrumental
    in keeping the Herschel album in Britain when it came up for sale in 1974, describes
    it as ''one of Mrs Cameron''s greatest works, one of the most powerfully intense
    portraits she ever taken.''¹⁰ Art historian Robert Kelsey says of the portrait
    as ''highly unusual in foregrounding the performative exchange behind the image''
    and discusses large-size portraits as ''representing her subjects in a sculpting
    chiaroscuro'', harnessing the glitches of the photographic process to make ''imperfection
    a sign of achievement, and a sense of ambition.''¹¹ For photography scholar Mirjam
    Brusius, in Carlyle''s portrait Cameron succeeded in rendering her vulnerability
    in addition to his strength and opacity. Impression prevents ambiguity and makes
    visible Carlyle''s complex and contradictory character. Cameron, argues, recasts
    the tension between the idea and the head in Michelangelo''s work as one between
    the machine and.¹² My aim in this essay is to test the ramifications of Cameron''s
    reference to the time, to nuance some of these assessments with a richer understanding
    of how her comparison with Michelangelo more generally – might say about Cameron''s
    photographic thought and practice.


    In the portrait, Carlyle''s face emerges from the smudged dark of the print in
    a dynamic blur. Linear skin, and white and beard hair like stratified rock formations,
    an effect created by the blur caused by Carlyle''s failure to remain still during
    the exposure, suggesting geological reality rather than human ageing. The eye
    on the right, the brighter side of the picture, is painfully soft in both expression
    and focus. Peering from the darkness on the left, the other eye looks at us with
    a more penetrating gaze, emphasized by the relatively sharp highlight in the dark
    pupil, and the seemingly raised eyebrow. Looking at the print, it is hard to decode
    exactly which shapes are created by Carlyle''s features and expression; by the
    lighting and focus by Cameron; and unwilling to meet and pin down in sharpness
    either the judgmental eye on the left, or the more vulnerable, appealing eye on
    the right. It is difficult to decide the recalcitrance to meet the picture plane
    pervading the print – perhaps our experience of it, as our eyes try and fail to
    catch any detail securely – comes from Carlyle''s difference towards the photographic
    process, his unwillingness to sit (still) for Cameron''s camera, or from Cameron''s
    unwillingness to reach towards Carlyle by moving her lens outwards to image at
    least some of his features, having already distant portraits placed the camera
    by commercial studios.¹³ As a woman, in fact, Cameron had rejected another, sharper
    version of this photograph, created by printing it the ''right'' way around –
    not reversing the negative as she did in all of the surviving versions of this
    portrait where the printing was done ''by my own hand'', as she had specified
    in a note to Herschel.¹⁴ We know that the negative is reversed because there are
    several carbon prints by the Autotype Company (Figure 7.2). In these, Carlyle''s
    bad haircut and uneven shirt collar seem to indicate less Disheveled Genius, one
    of Cameron''s favoured effects, and more badly'
