  md: '# Casting History:

    The Role of Photography and Plaster Casting

    in the Creation of a Colonial Archive


    Sarah Victoria Turner


    The first image encountered in Henry Hardy Cole’s (1843–1916) folio-sized book
    *The Architecture of Ancient Delhi*, published in 1872 is an unusual and striking
    one (Figure 2.1).¹ A large photographic print, the image vividly renders a scene
    of the manufacture of architectural plaster casts in colonial India. The photograph
    arrests a moment in a campaign of plaster cast making in India that Cole himself
    supervised in the winter of 1869–70. At the compositional centre of the image
    is a British army officer (this is presumably Cole, then a lieutenant with the
    Royal Engineers, although the caption to the photograph describes the as ‘Group
    of Moulders at Work in the Kuth’), dressed in a pit helmet and holding a swagger
    stick, observing a team of Indian workmen making casts of the pillars of the Qutub
    Minar, a complex of religious structures begun in the twelfth century in the south
    of Delhi. Three other Indian men, seemingly dressed in the army uniform of the
    British Raj, are in the background of the scene. The photograph shows the fluid
    movements required to transform dusty particles of plaster of Paris into a viscous
    liquid for pouring into piece moulds.¹ The poses of the various bodies are purposefully
    paused in their work for the special event of the taking of a photograph, and
    yet the photograph does not succeed in fully freezing time or more.


    A slight blur, especially around the figure of the *bhisti* (the water pourer),
    takes us back to the real time of this image, making it easy for us to picture
    this *tableau vivant* of plaster casts making the rhythms of their work, the patient
    labourers of brushing, deouring, pouring, scratching, waiting, waiting, drying.
    The white liquid plaster running down the wooden box, which supports one of the
    moulds, alerts the reader of Cole’s book to the raw materiality of making plaster
    casts. This image reveals something of the complex labours, processes and relationships
    required to produce plaster replicas of this ancient and complex architectural
    sculpture. It also speaks of an awe that perhaps Cole and the photographer, Charles
    Shepherd (of the already then-well-known Indian firm Bourne and Shepherd), shared
    in the transformative ability of the reproductive processes of plaster casting
    and photography to turn liquid materials into solid forms that could be transported,
    preserved and shared well beyond the sites of their making.'
