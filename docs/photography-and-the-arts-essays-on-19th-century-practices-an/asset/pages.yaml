  img_proc: true
- pgno: 36
  md: '# Photography and the Arts


    Already by 1968, the date of the publication of an incipient paradigm shift, photography
    was emerging as central to the United States and Europe, away from modernism in
    the visual arts, first in terms of contemporary art practice and later in terms
    of theory and historiography. Artists critical of the modernist conception of
    high art, and its commodification by the art market, turned to mass imagery (including
    advertising, celebrity and reportage photography) and popular visual culture (including
    amateur photography) to draw attention to its strictures and exclusions. Exotic
    and critical attention to the ideological frightening of photographs used as objective
    evidence and as neutral records generated further inquiry into contemporary and
    historical practices of photography. In the late 1970s and 1980s scholars associated
    with the New York-based journal October critically critiqued the reduction of
    the ‘formerly plural field of photography’ (i.e. images produced for ‘information,
    documentation, evidence, illustration, reporte’) into an ‘all-encompassing aesthetic.’
    This aesthetic was, predominantly, by curator John Szkowski’s influential publications
    and exhibitions of contemporary and historical photographs at the Museum of Modern
    Art in New York. Szkowski asserted that a specifically photographic ‘way of seeing’
    was at work in all photographs: both those made for or used for instrumental purposes
    and aesthetic ends. This institutionally endorsed aesthetic, with its narrow lexicon
    of photographic expression, drew down on medium specificity; the late modernist
    trope conceptualized painting and sculpture in terms of (a constructed) essentialism.


    Crucial to the centrality of photography in general, and early photography in
    particular, the October project was the currency argued to the writings of the
    Frankfurt School artists critic, Walter Benjamin, after their revival in the 1970s
    by left-wing scholars and artists critics of modernism. For Benjamin, the claims
    of photography made in the nineteenth century were a symptom of its commercialization
    in the early 1880s, when these claims were a means to fetishize the commercial
    photographer’s services and wares. His theorization of early images, as those
    made by David Octavius Hill and Robert Adams in the 1840s, signalled the critical
    possibilities of a ‘tiny spark of contingency’ that resisted subsumption into
    art nineteenth-century photography. As argued by the October scholars, particularly
    Abigail Solomon-Gode, the production of artistic biographies for photographers,
    artistic pedigrees for their works and formal readings of their history of art
    photography wrote the specific nineteenth-century networks in which these photographs
    gained in cultural status and monetary value at the cost of the time of their
    making. The October school identified as scholarly contemporaries, reclaiming
    socials and sometimes political currency for photographs now subject to the connoisseurial
    interests of art museum display.


    The essays in this volume identify the invocation of aesthetics in relation to
    photography as a historical component of particular social and political conditions.
    Illuminating these coded cultural interventions requires the historical specificity
    and intellectual rigour that is necessary for authoritative knowledge production,
    critical thinking and skilled argument. The essays are, we believe, exemplary
    in this regard.'
