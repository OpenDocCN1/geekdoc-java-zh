  md: '# Carlyle Like a Rough Block of Michael Angelo’s:

    Thinking Photography through Sculpture in

    Julia Margaret Cameron Portraits


    Patrizia Di Bello


    In 1867, Julia Margaret Cameron (1815–79) sent to John Herschel (1792–1871) a
    ‘completed’ version of the album she had first made in 1864. The new photographs,
    taken with a camera she had just purchased, include one of the scientist himself,
    ‘Sir John Herschel with Cap’, the writer ‘Carlyle like a rough block of Michael
    Angelo’s sculpture’ (Figure 7.1), and the poet ‘Alfred Tennyson’ (1809–92) – all
    titles inscribed in the album’s contents page by Cameron.¹ Together with the painter
    G. E. Watts (1817–1904), already represented in the 1864 version of the album,
    are some of the Cameron passionately befriended as mentors and sources of inspiration,²
    who played a crucial role in the development of her thinking about photographic
    aesthetics this chapter analyzes.


    The new camera was larger than the first – fifteen by twelve inches instead and
    equipped with a Rectilinear lens which was specially designed to improve depth
    of field.³ This is the capacity to image sharp details on more than one plane
    away from the camera, as nose, lips and eyes while taking portraits. Cameron used
    camera to make extraordinary life-size, close-up portraits of celebrated men and
    women of her, almost as out of focus and blurred as the ones she had with her
    first camera. Banking on their success on a market for portraits of celebrities
    that would have been ripe for an alternative to the sharp, detailed, often still
    portraits by most carte-de-visite studios, Cameron copied her large ‘heads’, sold
    prints from her London dealer and included in a number of exhibitions.⁴ The photographs
    did not make her fortune, as she had hoped, but did improve the critical reception
    of her work, which had been poor in the photographic press. Her male portraits,
    in particular, were met with approval: “The rugged masculine lines of these perfect
    pictures, the powerful and yet venerable of the heads, are beyond praise.”⁵ Carlyle
    himself was ambivalent about his photograph: ‘It is as if suddenly the picture
    began to speak, terribly ugly and woebegone, but has something of a likeness.’⁶
    This portrait was later reissued as a carte-de-visite,’'
