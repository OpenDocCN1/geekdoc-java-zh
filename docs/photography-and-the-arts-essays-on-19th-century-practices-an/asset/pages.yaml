- pgno: 35
  md: '# # Introduction


    Juliet Hacking and Joanne Lukitsh


    The essays in this anthology redraw established lines of scholarly enquiry into
    nineteenth-century artistic photography, examining the material and metaphorical
    interplay between photography and the arts, with ‘arts'' encompassing a range
    of media from the visual culture of the time. The arguments advanced in the essays
    ground the complex exchanges between photography and the fine, graphic and sculptural
    arts in their material and social contexts, and elucidate how the aesthetic debates
    that attended these exchanges were informed by, and spoke to, a range of issues
    pertaining to science, class identities and social aspiration, national identity
    and imperialism. The photographs illustrated in this volume were encountered on
    the pages of portfolios, albums and books, viewed on the walls of museums and
    art galleries, displayed in shop windows, and/or handled from one person to another
    in meetings of learned societies or photographic organizations. Photography and
    the Arts: Essays on Nineteenth-Century Practices and Debates claims a significance
    for historical interactions between photography and the arts beyond matters of
    colour status, judgements of quality or taxonomy.


    The title Photography and the Arts is a reworking of Aaron Scharf’s 1968 Art and
    Photography. Our title both honours what is arguably the best-known English language
    text on this area and insists upon the difference between its intellectual moment
    and that of the present.’ Scharf, in charting the interplay between art and photography
    (mainly European with some American) in terms of new formal possibilities, cleared
    to the modernist idea that ‘art’ equated ‘painting’. Any cultural recognition
    due to nineteenth-century photography would be the agent of painting’s reward.
    Based on his doctoral thesis undertaken at the Courtauld Institute of Art in London,
    Scharf’s text was an example of incipient assimilation of photography into the
    European and Angophone academy in the late 1960s, when the gradual and fitting
    accumulation of cultural capital to photography, owing predominantly to institutional
    collecting, exhibitions and publications, began to accelerate. This uplift in
    photography’s place in the attention economy of the Western world mushroomed,
    in the mid-1970s, by the phenomenon known as the Photo Boom: a proliferation of
    specialist formations such as museum departments, commercial galleries, art journals,
    fairs and festivals, publishing imprints and prizes, and of the professional roles
    that these generated. Fifty years on from Scharf’s text, photography is firmly
    entrenched in the Western art world and its academy.'
