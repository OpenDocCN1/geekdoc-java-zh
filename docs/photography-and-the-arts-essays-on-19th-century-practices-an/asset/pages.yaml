    artists are really so much in advance of us as supposed?'',28 Rigby denounces
    the preference for ''trick'' over ''truth'',29 employing the example of the calotype
    to compare ''version[s] of Nature'' in British and German painting and to demonstrate
    the superiority of the former:


    In, short, we give our version of Nature – they give theirs; which is right? One
    however, there does exist, and one from which there is no appeal, for it rests
    upon demonstration, and not opinion. This is to be found in that wonderful source
    recently discovered – the only sure test for those artists, to reflect Nature
    in their works, by Nature himself only be judged. We mean the beautiful and wonderful
    Calotype drawings – so precious in every real artist''s sight, not only for their
    matchless truth of Nature, but as the triumphant proof of all to be most revered
    truth in art. Every painter, high and low, to whom Nature has ever revealed herself,
    here finds his justification. Let Mr. Hill apply the calotype instrument to a
    simple Manly head in a commanding position, it creates a Sir Joshua – give it
    an old face wrinkled with age, it returns us a Rembrandt – summon or four bare-legged
    urchins, with we Murillo''s beggar boys – places it before a group of Newhaven
    fishermen, we have Teniers'' Dutch Boers, or Ostade''s Village Alehouse –or against
    a crumbling brick wall, and Peter de Hooge mezzotined before us. Take it to tangled
    sylvan landscapes, it presents us with a Hobbima, a Gainsborough, or even, what
    we had not sufficiently provided before, Constable – gave it fretted spires and
    leafy banks, distantantows and glittering streams, playful shadows and struggling
