    The mention of Annie Thackeray Pole, like the record of Cameron writing herself
    to ask that her photographs be displayed, reflects the social aspects of Cameron''s
    photographic career. A close friend of both Cameron and Cole, Thackeray belonged
    to the ''higher classes of art-patron'' that Wall recently accused of heaping
    praise on Cameron. Indeed, she had brought a rhapsodic article earlier that year
    which she compared Cameron''s photographs to works by Leonardo, Michelangelo and
    Millais.¹19


    The evidence that Cameron''s photographs were exhibited at the South Kensington
    Museum is thus limited to one record in the museum archives of Cameron''s desire
    to exhibit her photographs at the museum; one footnote to an article attacking
    Cameron''s technique; and one private letter of dubious accuracy. These are relatively
    precarious foundations on which to build the claim that an exhibition at the museum
    bestowed artistic validation on Cameron''s photographs. Although reviews compared
    Cameron''s photographs to works by Old Masters and contemporary painters, the
    fact that the museum collected and displayed them did not necessarily mean it
    viewed them as works of art in their own right.


    # Photography for artists


    With the exception of the 1865 exhibition, all the ways in which the museum treated
    Cameron''s photographs once they had entered the collection suggest that they
    were viewed as independent works of art, but rather as source material for artists
    and designers. This was the primary purpose of most of the photographs museum
    collected. As T. C. Grove, the assistant keeper in charge of the Photography Collection,
    explained in 1908:


    The collection, being intended for the use of all varieties of workers – manufacturers,
    teachers, art students, pattern designers and workers in the various trades and
    crafts – naturally includes photographs of many objects besides those which belong
    to the fine arts. A use is indeed found for photographs of almost every kind of
    object; the plant, flower, and animal are in constant use by designers and book
    illustrators, while architectural and topographical views become value as records,
    and are used by many readers in addition to those who are students of architecture.²⁰'
