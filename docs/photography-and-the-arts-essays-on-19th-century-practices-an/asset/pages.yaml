    Cameron had made it feature of the practice that she never retouched her negatives,
    and in the Autotype Company''s 1879 obituary for Cameron they reported the ''imperfections''
    of her negatives.¹² It is difficult to make a general characterization of the
    Company''s retouching from the relatively few Autotype prints which can be dated
    to this: in some subtle reinforcement of forms in the shape is visible; in others
    there is extensive retouching to make details less blurry.¹³ The Autotype continued
    to make Cameron prints until 1912, when they replied to an enquiry from Alfred
    Stieglitz (1864–1946), the leading American artistic photographer and editor,
    about the Company''s holdings of her photographs.¹⁴ The later emphasis of artistic
    photographers on her focused Eliot Cameron considerable interest in the aesthetics
    of her prints as an aspect of her creative practice, her reasons for turning to
    the Autotype Company to circulate her photographs and the Company''s alteration
    of her negatives for their sale of carbon prints of her work.


    # An amateur and imperfectly trained artist''


    In the spring of 1889 two events brought Julia Margaret Cameron''s images to the
    renewed attention of English artistic photographers and the art-viewing public.
    The photographer and theorist Peter Henry Emerson briefly discussed Cameron in
    his new book, Naturalistic Photography for Students of the Art, and Henry Herschel
    Hay (1852-1911), included his mother''s photographs in a London exhibition promoting
    her commercial photographic studio. In Naturalistic Photography, Emerson argued
    that artistic photographers should use ''differential focusing; in approximation
    of human vision, to represent in their images their aesthetic response to nature.¹⁵
    The book was a product of Emerson''s practice as a photographer and his research
    on scientific themes of human vision, lens optics and the history of naturalism
    in art.¹⁶ Emerson singled out Rejlander, Antoine Samuel Adams-Cameron as the ''only''
    photographers who had done work of ''any'' artistic value since the invention
    of the medium, though none used focus as Emerson advocated for naturalistic photography.
