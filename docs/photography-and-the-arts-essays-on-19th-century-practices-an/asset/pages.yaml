  md: '# From ''Studies from Nature'' to ''Studies for Painting''


    trajectory, in which Cameron''s aspirations for her photographs to function as
    works of High Art were suppressed, yet her desire to make her work accessible
    to artists was fulfilled, Cameron''s photographs finally settled into a place
    within the museum that is recognizable today.


    The V&A''s photography collection, like those of most art museums, contains numerous
    examples of photographs originally created for use in other spheres that are now
    studied and displayed as works of art. These include records of art and architecture,
    documentations of geological surveys, ethnographic portraits and 달리 snapshots,
    but to a name few. While art historians and museum professionals have been aware
    of the pitfalls of recontextualizing photographs in the art museum, they have
    paid much less attention to the institutional status of photographs that were
    originally made as works of art. The unexpected path of Julia Margaret Cameron''s
    photographs within the South Kensington Museum demonstrates the need for further
    study of the place of art photography in nineteenth-century societies.


