  md: '# Photography and the Arts


    Consider together, the three photographs show Cameron herself exploring the dual
    capacity of photography to record likeness and evoke the imaginary. The two half-length
    portraits (Figures 12.4 and 12.5) are set against the same legible background
    of a tree trunk and branches. The relatively sharp focus accents Talbot''s face
    and ornaments in one she dramatically crossed hands. In addition to changing her
    gesture, Cameron transformed her sister from Victorian into lady character through
    the addition of carefully arranged drapery and a quote from Milton, ''Come pense
    Nun, devote and/ober, steadfast [sic] and demure'', inscribed beneath. The close-up
    profile (Figure 12.3) is comparatively radical, showing Cameron developing her
    characteristic style of soft focus and directional lighting in front of a dark,
    neutral background. Cameron did not assign a title to this portrait but did give
    literary titles to other similarly decontextualized portraits of sisters.


    In the South Kensington Museum, the photographs that were initially described
    as ''Studies from Nature'' or ''Portraits'' would eventually take on another meaning,
    as ''Portraits'' were all classified by the museum as ''Studies for Painting''.
    In this later system, the picture of Talbot as a nun was classified under ''Studies
    for Painting'' and described on the mount as ''Talbot, Lady Adelaide, Portrait
    of'' and in the index both as ''Nun, study for Portrait of Lady Adelaide Talbot''
    and ''Talbot, Lady Adelaide; portrait of study of Nun)''; In the context of the
    museum, the word ''study'' was multilingual, meaning different things at different
    times. It initially used to differentiate between photographs depicting sitters
    as themselves and those of costumed sitters acting roles. The former is akin to
    a record photograph while the latter has more in common with a painting of literary
    or historic subject. Eventually, some of Cameron''s photographs were classified
    as ''Studies for Painting'' (including some of named individuals) and others classified
    as ''Portraits''. While the terms ''Figure Studies'' and ''Studies from Nature''
    suggested a kind of artistic interpretation, as well the informality of an unfinished
    work, ''Studies for Painting'' implied that the photographs merely constituted
    a useful step on the way to the creation of an artwork.


    # Photographs displayed


    While museum documentation shows how the photographs were described as they entered
