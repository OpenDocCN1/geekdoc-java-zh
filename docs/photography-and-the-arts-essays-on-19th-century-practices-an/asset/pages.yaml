    Recent theorizations of photographic meaning in the European and American sciences,
    social sciences, and literature have reframed narratives of nineteenth-century
    photography beyond of a quest for artistic legitimacy. Beginning in the late 1990s,
    situated nineteenth-century photographs in relation to contemporary epistemological,
    scientific and philosophical paradigms have become a scholarly imperative, as
    has an insistence on the interdependence of these paradigms with ideas of physiological
    and aesthetic vision.


    In Burning with Desire: Conceptions of Photography (1997) Geoffrey Batchen addressed
    to the social and cultural emergence of photography through discourses of photochemical
    experimentation dating to the Romantic period. In Objective (2007), a major work
    in the history of science, Laurence Daston and Peter Galison identified the subject
    not as a universal desideratum, but as a specific methodological approach that
    gained scientific authority in the nineteenth century and was substantially entangled
    with philosophical and psychological issues of self. The authors, a historian
