    Reproduced with the permission of the Philadelphia Museum of Art Library and Archives.


    I am using this photograph to think about the important relations and rivalries
    between the reproductive technologies of plaster casting and photography as they
    were developed, theorized and increasingly used in tandem by nineteenth-century
    museums, curators, archaeologists and historians to create an archive – albeit
    an archive of fragments – art and architectural objects from across the globe.¹
    The publication of The Architecture of Ancient Delhi was sponsored by the offices
    of the South Kensington Museum, now the Victoria and Albert Museum, in London,
    with the support of the Arundel Society for Promoting the Knowledge of Art. The
    project was carried out with support from the British authorities in colonial
    India, including the British Army, which Cole belonged. The South Kensington Museum
    was not alone collecting plaster copies to rapidly expand its collections, and
    similar projects were developed at museums such as the Trocadero in Paris and
    The Metropolitan Museum of Art in New York.³ Plaster casts were celebrated in
    the nineteenth century as the ‘medium par excellence for teaching and disseminating
    historical architecture’ and as ‘ideal exhibits rather than second-class substitutes’⁵


    However, by the middle of the twentieth century, many collections could have been
    dismantled. Despite the extensive collections of the Cast Courts still extant
    at the Victoria and Albert Museum, much of the South Asian plaster cast collection
    was'
