  md: '# Photography and the Arts


    In the 1868 Index, there was also an entry for ''Cameron, Mrs.'', under three
    groups of photographs were listed: ''Figure Studies from Nature, ''Portraits and
    Studies from Nature'' and ''Studies from Nature''. These categories matched the
    terminology used in the Photographs Acquisition Register and the Library Receiving
    Room when the photographs first entered the museum three years earlier. Although
    Cameron was named as the author of the photographs, the individual titles of her
    works were not included. The identity of her photographs – the conventional signifiers
    of their status as art – was steadily eroded through their classification within
    the institution.


    # Photographs as art


    In 1895 T. C. Grove who was in charge of the Photograph Section of the National
    Art Library, established a new system for classifying and storing the museum''s
    collection of photographs. Until then Grove later stated ''photographs when acquired
    had been put away in portfolios, and as one portfolio was filled another was started.
    Those photographs of all objects were stored in the same portfolio³¹ Grove not
    only set about the existing collection, by then he estimated at 150,000, but in
    1898 introduced the practice of classifying photographs as they were acquired.
    He also realized the storage of the photographs, mounting them on standard size
    and storing them in boxes according to size. Some of Cameron''s original mounts
    were evidently trimmed during this period in order to fit into boxes of particular
    sizes. Metaphorically, the meanings of Cameron''s photographs were trimmed well.
    Not only were the author and titles of the work no longer acknowledged, but their
    iconography was also ignored. In the 1901 index, Madonna groups were listed as
    mother and child studies; literary studies, such as Paul and Virginia, became
    Cameron''s youngest son, Henry Herschel Hay Cameron, were given generalized designations
    like ''Boy''s head, Study of''. The classification was decategorized strictly,
    if idiosyncically, however, and a few photographs were listed by head of; as Circle
    (museum number 45140), which was listed as ''Circle, study of a girl.''²


    T. C. Grove succeeded by Charles Gibbs in the 1930s, and it was preparation for
    his Exhibition of Early Photographs to Commemorate the Century of Photography,
    1839-1939 that Cameron''s photographs were reclassified. No longer categorized
    strictly, if idiosyncically, by matter they were now described as ''Photographs
    by Mrs. Julia Margaret Cameron, c.1864-75'', their titles were reattached to their
    records and they were assigned the X311 pressmark that they still have today.
    This art historical approach to photographs, which persists in the museum, prizes
    maker and title above other characteristics. In an article entitled ''One Hundred
    Years of Photography'', Gibbs noted that ''practically nobody takes the trouble
    to collect old photographs, and yet the time has already come when they are objets
    d''art.''³³ The classification of Cameron''s photographs during Gibbs-s tenure
    at the V&A reflected the growing tendency he described towards identifying photographs
    as works of art. Following a surprising institutional'
