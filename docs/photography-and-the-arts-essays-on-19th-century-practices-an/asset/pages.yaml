  md: '# Petty-bourgeois photographic aesthetics


    According to Terry Eagleton, ''the birth of aesthetics as an intellectual discourse
    coincides with the period when cultural production is beginning to suffer the
    miseries and dignities of commodification.'' At a micro-level, we can see this
    as true of the birth of specialized photographic aesthetics in the late 1850s.
    The rise in the number of writings on photography''s relationship to art came
    at a particular juncture in the commercialization of the medium: the successful
    commodification of stereographic images and celebrity portraits had photography
    with an enhanced place in the attention economy of the industrial countries. The
    symbolic value of this new technology was, nevertheless, at odds with the precarity
    of the trade. In this context, writings that made a contiguity out of binaries
    such as the mechanical and the metaphorical by invoking a middle ground called
    photography were also arguments for social mobility.'' This middle ground would
    become a locus for the social aspirations of petty-bourgeois workers who gave
    their ''after hours'' leisure, as well as their working day, to photography.


    According to Steve Edwards, ''the language of art'' as is found in the photographic
    journals of the 1860s ''infected with a petit-bourgeois utopianism'' that ''compatible
    with the ideology of "self-culture;'' the doctrine of self-improvement which,
    according to his advocate, Samuel Smiles (1812–1904), ''include[d the education
    or training of all parts of a man’s nature; the physical and moral, as well as
    the intellectual.'' The debates over composition in the photographic press are
    infected with Smilesan self-culture; in addition, and is crucial for my analysis,
    they demonstrate that the personal (and social) empowerment that promised came
    at a price. While it was relatively easy for the petty-bourgeois worker in photography
    to espouse the virtues claimed with middle-class ideology (such as truth, honesty,
    integrity; meritocracy) that allowed for social mobility, it was easy to embody
    them. This was particularly the case for the petty-bourgeois subject whose claim
    upon respectability was more insecure than that s/he sought to imitate. While
    Henry Peach Robinson had his entry into trade at fourteen, his training as a printer,
    and his subsequent acquisition of a photographic studio in a fashionable and rapidly
    expanding spa town, put him at the upper, respectable end of trade.'' His adversary
    in the debates over composition photography, the photographic critic Alfred Henry
    Wall (1828 (baptized)-1906), on the other hand, had a highly precarious working
    life. Wall''s critical style can appear as highly inconsistent, that is, until
    one reads his writings as informed by somewhat tenuous grip on respectability.
    Nonetheless Wall''s writings played a deciding role in the reception of composition
    photography, and, in so doing, in determining what artistic photography would
    and be for many decades to come.


    # Alfred Henry Wall as photographic critic


    Wall, who is oft-quoted in modern accounts of nineteenth-century British photography,
    was a petty-bourgeois worker in photography who became a prolific'
