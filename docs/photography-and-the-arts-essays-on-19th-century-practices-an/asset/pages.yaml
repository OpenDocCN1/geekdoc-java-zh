  md: '# Art, Reproduction and Report


    officers, by Fenton and others, were popular subjects for engravings, as were
    scenes from Fenton''s expedition. The Illustrated London News reproduced an image
    of his photographic van, with his assistant Marcus Sparling, in November 1855,
    and a group portrait, Coats, the following month.¹16 The vivid and graphic reporting
    of the war in The Illustrated London News led to a significant increase in its
    readership, and the inclusion of engravings after Fenton''s photographs was undoubtedly
    part of this success, raising circulation by 50,000 to 200,000 copies each week.¹17
    This, with the extraordinary public attendance at the exhibitions, makes it clear
    that the public responded strongly to Fenton''s images of the war.


    By March 1856, it was being reported that 2 million visitors had seen one of Fenton''s
    exhibitions in Britain.¹⁸ The visiting public responded enthusiastically to Fenton''s
    work, and reviews published across the country were overwhelmingly positive. Evidence
    in some reviews of the tour of Fenton''s work suggests that the public found the
    experience of viewing the photographs as both informative and extremely emotional.
    Their emotional response was, perhaps, surprising, but the public brought to their
    experience of viewing the photographs an exceptionally sound knowledge of the
