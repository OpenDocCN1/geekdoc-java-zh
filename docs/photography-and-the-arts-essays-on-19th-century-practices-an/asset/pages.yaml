  md: '# Modernizing the Victorian


    prints because ''most of the old prints are old and faded'' – though none of the
    photographers had used platinum – Coburn could convey the ''spirit'' of their
    works using this paper. In this exhibition, the platinum copy prints of Cameron''s
    photographs could convey the symbolic significance of photographic permanence.
    Coburn represented Cameron and nineteenth-century photographers as artists, modern
    for their use of photography, but capable of being folded into a tradition of
    artistic accomplishment in a time of social crisis.


    This essay has paid attention to the historical role played by what are conventionally
    termed ''photographic reproductions''. Julia Margaret Cameron''s production of
    albumen and carbon prints of her photographs demonstrated her attention to the
    aesthetics of the photographic print as a component of her art, as well as her
    recognition of the material fragility of the processes she used. Cameron made
    aesthetic use of the camera lens and light to produce subtle distinctions between
    textured detail and suggestive contours in her photographs. These visual effects
    were lost in reproductions which flattened forms in pictorial space and reduced
    her use of contrast to generalized tones. In the recurring preference for producingให้กับ
    of Cameron''s portraits, rather than her ''angels with wings'', artistic photographers
    noted the criteria of value to use on authenticity, unlike Cameron composition
    photographs, her portraits could be reliably located in a moment of time. These
    modernist transformations of Cameron''s photographs at the hands of self-conscious
    artistic photographers, most notably the extraordinary presentation of her images
    by Carlyle in Camera Work, supplant much her own creativity and its place within
    her Victorian historical moment, for a new narrative of photographic progress
    and temporality.


    Earlier versions of this essay were given at ''Rethinking Early Photography''
    at the University of Lincoln, UK, in 2015 and ''Rethinking Pictorialism'': American
    Art and Photography from 1895 to 1925'' at Princeton University, USA in 2017.


