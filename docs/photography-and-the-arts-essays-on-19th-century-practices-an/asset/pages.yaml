  md: '# Picturesque Conflict:

    Photography and the Aesthetics of Violence

    in the Nineteenth-Century British Empire


    Sean Robert Willock


    This chapter considers the tension between aesthetic inclinations and ethical
    concerns in early photographic engagements with the horrors of war. The first
    photograph to explicitly show the victims of conflict, Felice Beato''s Interior
    of Secundrabagh after the Massacre (1858) (Figure 5.1) is a shocking record of
    destructive violence, even by modern standards. Skulls, ribcages, femurs, pelvises:
    a horrific explosion of bones dominates the foreground of the scene. The photograph
    documents the site of a British victory over insurgent fighters in Lucknow, northern
    India, in March 1857. The remains are those of Indian ''mutiners'', scattered
    in front of an architectural ruin as if the victims had been slaughtered to decompose
    wherever they had fallen. But this was not in the case. By the time Beato – a
    colonial photographer – arrived at this location, the bodies had long since been
    buried. He arranged for their exhumation in order to make this photograph. The
    desire for an adequate photograph of battle''s aftermath guided Beato''s interaction
    with the site in profound ways, creating what Christopher Pinney calls a ''complex
    reamination of the local points to show how photography was starting to shape
    the terms of engagement with the most sensitive aspects of life and death. Yet,
    radically new as this photography of engagement with the most sensitive aspects
    of life and death was, its ''ethics of seeing'', to use Susanant''s phrase, was
    rooted in a longstanding and popular artistic tradition: the picturesque.


    The aestheticization of suffering and destruction with the invention of photography
    in 1839 did not emerge as a new problematic for the Victorians whose rugged and
    irregular formal qualities had already fostered some dubious visual pleasures
    at the site of ramshackle dwellings and beggars'' rags. This extraction of formal
    values from social ills provided the cover for a budding photographer like Beato
    to command the production of such a sepulchral tableau during this viconial war
    in India. One year before Beato''s photographic engagement with death and devastation,
    the art critic John Ruskin declared that ''the modern feeling of the picturesque,
    which far consists of a delight in ruin, is perhaps the most suspicious and questionable
    of all characters distinctively belonging to our temper, and art.'' Such picturesque
    originality – established by theorists like William Gilpin in the'
