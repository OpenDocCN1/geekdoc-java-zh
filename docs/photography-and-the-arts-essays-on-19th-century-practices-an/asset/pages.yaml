  md: '# From ''Studies from Nature'' to ''Studies for Painting'' 203


    The artist with whom Cameron shared the largest number of photographs was her
    good friend G. F. Watts. The conflict between generosity towards artists and her
    need to earn money from her photographs in her correspondence. Watts urged her:


    Please not send me valuable copies ... send me any ... defective unmounted impressions,
    I shall be able to judge as well & be just as much charmed with success & shall
    not feel that I am taking money from you.27


    Within the South Kensington Museum, which did pay full price for Cameron''s photographs,
    catalogues practices confirmed they were perceived as useful source material for
    artists.28 In the first indexed to the photographs collection from 1868, Cameron''s
    photographs are grouped with photographs of drawings by various well-known artists
    (Figure 12.7).The South Kensington Museum thus equated photographs ''from life''
    by Julia Margaret Cameron with photographs of Old Master drawings, classifying
    them as two-dimensional works that could be consulted in the National Art Library.


    Cole took this lack of differentiation among genres even further, specifically
    in reference to a photograph of a drawing by Raphael. In July 1860, when defending
    the work of the Photographic Department of the South Kensington Museum (which
    produced photographs of art and architecture, sometimes for sale to the public),
    he argued that an original drawing by Raphael was ''not finer in quality'' than
    a photograph of a drawing by the artist:


    > I have ... a fac simile of Raffa''s drawings. At a recent sale at Christie''s
    a drawing not larger than that, and not finer in quality, sold for more than £200;
    by the agency of photography, and by the action of the Department, any working
    man in the country may get it for 5d [pence].30


    By extension, Cole seemed to place equal value on a drawing by Raphael, a photograph
    of a drawing by Raphael and a photograph by Julia Margaret Cameron, an equivalence
    that is startling by today''s standards.


