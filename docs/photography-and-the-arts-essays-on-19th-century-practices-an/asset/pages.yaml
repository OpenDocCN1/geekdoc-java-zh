    not apparently ever advertise his participation in this venture. And Valentine
    himself criticized their pictures for faulty processes and expressions.³³⁵


    As photographic practice shifted away from the daguerreotype to the adoption of
    paper and glass processes, the corresponding drive to make narrative pictures
    did not continue. When Spelling in 1856 that painters were increasingly using
    photography as an aid for their fine compositions which ‘ an entire composition
    could be conceived and executed in a few minutes, requiring very little aid in
    securing appropriate models’ which could be placed before ‘him at any time of
    day best suits his conscience, his genius and skill alone requisite to supply
    the colors with the best effect – the only specific examples he could be mentioned
    from a few years before, referring to the ‘Sowsaway’s Nooning, ‘The Three Poets’
    and others by Hesler and Barnard that had appeared in copy paper prints in the
    journal’s pages.³³⁶ Indeed, by the 1860s, Sellers noted the lack of composition
    pictures, Harrison forked the profession of photography to devote himself more
    fully to acting.


    American photographers then mostly abandoned making pictures with the decline
    of the daguerreotype. Genre subjects only prospered in commercial stores, and
    those were held in contempt within the photographic community. Not long before
    he spoke of talk about the merits of ‘composed’ pictures, Reijlander’s Two Ways
    of Life, Sellers noted that ‘there was a good deal of doubt and many of our connoisseurs
    banished from their collections the made-up semi-theatrical pictures of the shops.
    Sellers’s use of the term ‘semi-theatrical’ as one used is a far cry from Harrison’s
    double embrace of photography and the theatre or Valentine and his friends’ expression
    of the emotions. Theatrical was now associated with the perceived vulgarity of
    some photographers. Continuing by describing a mock portrayal of the Ghost Scene
    from Hamlet, executed in stereograph with crude backdrops and stuffed birds as
    the characters, he gave his final opinion: ‘There is no good reason why those
    who like them should not be gratified by scenery, composed pictures, comic or
    instructive.’³³⁷


    But photographers with ambition rejected the theatrical, the realism triumphed
    over idealism, defying the British example of Reijlander. In the late 1850s and
    1860s, portraiture, landscape and the documentation of architecture and industry
    became the accepted modes for American photography because they aligned with the
    nation’s evolving sense of identity, which championed its natural geography and
    a plucky meritocracy for its expanding population. Genre subjects did not flourish
    again until the 1870s and after, with an influx of amateur photographers embraced
    nostalgic narrative subjects. In their earliest decades, the idea that photography
    could should tell stories or represent imagined scenes was permissible in America
    but eventually the understanding of the medium evolved to a more limited belief
    that it was suited only to representing the observable field of vision.


    The author wishes to thank Michelle Smiley for providing research assistance for
    this essay.'
