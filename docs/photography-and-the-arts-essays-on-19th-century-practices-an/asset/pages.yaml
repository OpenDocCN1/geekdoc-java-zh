    Intérieur du cabinet de curiosité, 1837; or Charles Fortier, Nature more, 1839,
    Paris; or some of the later posters by Hippolyte Bayard); views into the space
    of an artist or collector. In the photos mentioned, the person portrayed is given
    more space; on the left side by a draped, checkered length of fabric, and leaning
    on a draped chair with checkered fabric as, the person portrayed viewers directly
    in the eye. When Blanquart-Évrard photographs what is shown in the first daguerreotypes,
    he also calls attention to the picture quality of his paper process, which is
    able to reproduce equally views. This, that he calls it一来—by disclosing that he
    is an art lover—offers a self-portrait in time with his claim that his process
    photographs new creative freedoms.


    Meanwhile, there are other crucial biographical facts that he kept to himself,
    that there are no less than a attempt to understand the specifics of his photographic
    practices. They help to explain how a merchant and dilettante from France was
    also able to undertake experimental studies in photographic techniques and develop
    processes, as he notes in his letter from the author of 1846, are not discoveries
    so much as well-researched ''applications'' of ''foundations''— foundations we
    may, add, by others. Yet he would pay tribute to the originator of what he called
    the ''foundations'' of paper photography—that is, William Henry Fox Talbot (1800–1877)—in
    his later treatises on processes, including the 1851 monograph on paper photography,
    or in his historical studies as the aforementioned publication La photographie,
    ses origines et ses progrès de 1869. Blanquart-Évrard published writings making
    no reference to that his enthusiasm for photographic experimentation was informed
    by the kind of knowledge that circulated in contemporary chemistry laboratories.
    This knowledge laid the groundwork for his improvements to paper photography was
    only revealed after his death in 1872, when Benjamin Corenwider and Alphonse Davanne
    discussed it in their obituaries.


    Educated at private schools, Blanquart worked in the tobacco industry before marrying
    into a family of rich cloth merchants in 1831 and joining his father-in-law''s
    business. In 1826, he added Frédéric Kühmann''s lectures on chemistry, which were
    very popular among industrialists and young scientists, drawing audiences of up
    to 300. Kühmann (1803–81) had established a chemical plant in Looz-le-Lille the
    year after he was appointed to the newly created Principal Chair in chemistry
    in Lille, and as he liked to surround himself with students who were eager to
    learn, Blanquart, his senior by less than a year, joined him as an assistant and
    amanuensis in his laboratory. It was later later the groundwork of his knowledge
    of chemistry, which, according to Corenwider, ''was the science that proved essential
    to the discoveries and improvements that he would contribute to the art of photography.''
    Alphonse Davanne


