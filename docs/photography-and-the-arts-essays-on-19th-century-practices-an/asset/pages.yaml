    between calotype and painting to focus instead upon the sitter''s responses to
    sunlight might yield in the context of Elizabeth Rigby''s writing on the relationship
    of photography to art. As noted, the sun plays a prominent visible role in the
    calotype of Matilda Rigby; indeed, the sitter appears in perpetual danger of sunburn.
    Solar gaze as the moods and whims of the sun - also makes its presence felt, albeit
    differently, in Hill and Adams'' portrait of her. In fact, in 1843, she comments
    upon the reason for averting her gaze in their camera. But Rigby does not offer
    the type of ''artistic'' explanation we had led to expect. In a letter to London
    publisher John Murray dated October 7, referring to to ''a few specimens'' of
    calotype portraits, including ''three of herself'' enclosed with her letters:
    ''The eyesight were a necessary consequence of the most brilliant sun which prevented
    their being raised the highest.''²⁰ She looked down, she explains, because the
    sun was in her eyes. Would not discount this commonplace replacement for Rigby''s
    lowered gaze in this and other portraits by Hill and Adams. Indeed, I want to
