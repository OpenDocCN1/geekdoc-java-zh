    responded to Wall''s inference that he had studied at the Royal Academy under
    J. W. M. Turner, by pointing out that Wall''s (lowly) trade of photographic colourist,
    when the August Journal began to endorse both Robinson and his composition photographs
    in its editorials, might be thought that Wall would be entirely discredited. He
    however countered this by simply reverting to his original episode of composition
    photography. What at first appears as a highly idiosyncratic style begins to look
    like a strategic deployment of both imitation and deception in order to support
    an identification of A. H. Wall as an intellectual, rather than manual, worker
    in photography.


    # The guardians of established rights


    Composition photography now became the cause behind which Hugh Welsh Diamond (1809–1886)
    (Photographic Journal), George Wharton Simpson (Photographic News) united in the
    face of their common enemy: the established press. In 1861, the Times congratulated
    the Photographic Society of London for exercising its judgement wisely regarding
    the pretensions of photographers by seeking to exclude works that encroached on
    the domain of art; however, the anonymous reviewer (Tom Taylor, 1817–80) lamented
    the inclusion of Robinson''s A Holiday in the Wood (1860) (Figure 11.1) which
    he claimed, fell into this category. This composition photography featured one
    of tropes of genre that alerted single photography: a complex arrangement of different
    figure groupings in an outdoor setting, this case a bank and wood representing
    the idyllic English country and ten young (or young) people intent on frolicking,
    gathering flowers and fruit. From the Times review, it is clear that Taylor knew
    how the photograph had been made but it then others critics did not. When the
    photograph was exhibited at the International Exhibition of 1862, ''printed from
    several negatives'' was appended to the title in the exhibition catalogue. For
    the Athenaeum, which was previously ''a most successful and effective'' photograph
    was now ''miserably depressing to the spectator.'' The Illustrated London changed
    its opinion of 1861 that composition photography was a high class of photographic
    endeavour for the opinion that this type of labour was vain. The Daily Telegraph
    went much further, asserting that ''such a system of legerdemain is radically
    vicious.'
