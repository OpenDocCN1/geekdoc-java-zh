  md: '# Carlyle Like a Rough Block of Michelangelo''s


    Michelangelo''s work is unfinished not because of regrettable acts of history
    – having to leave Florence or bad workmanship, but because of an aesthetic decision.
    Impatience is not a defect of temper but the intelligence of genius, who understands
    that forsaking details improves the work. This understanding also helped to make
    sense of Michelangelo''s statement, repeated by many biographers, that his vision
    for a work emerged in dialogue with the marble block he was working from. By revealing
    the marks left by Michelangelo, rough sections make the development of his vision
    in action. Cameron''s call to Michelangelo is asking us to understand blurred
    and out-of-focus prints as the actions of focusing and making visible, or optical
    or chemical marks as the *non-finite* of photographic materials.


    It is hard to say if Cameron had these or similar evaluations of Michelangelo''s
    *non-finite*, as that was in Elizabeth Barrett Browning''s 1851 poem *Casa Guida
    Windows*, where the unfinished bust of Brutus is powerful because it gives nineteenthcentury
    Italians the need to imaginatively complete it with the features of a modern hero
    who stood up to deutus – Brutus had to Caesar to unify Italy⁷ It is easy, to imagine
    similar opinions being read at Little Holland House, frequented by the Browns,
    ''England''s Michelangelo'' was beginning to practise sculpture.³ Watts''s *Prometheus*
    was made on Day, whose unfinished finish was thought to be Michelangelo''s self-portrait.³⁹


    Discussions about finish of were were not confined to painting and sculpture.
    Elizabeth Eastlake''s 1857 article on photography discusses length the tension
    between technical and artistic control over the photographic image. One of the
    former might be desirable but not result in the latter. For Eastlake, control
    over ''finish'' as the degree and distribution of legible details an image was
    central to ''the connection of photography with art''⁴ Artists working with their
    hands were able to exercise aesthetic judgement not only by arranging the elements
    of a composition, but also by signifying their importance by degrees of detailed
    retention. This was crucial to convey the artist''s understanding of the subject.
    Photography''s lack of control over details has been emphasized by the use of
    colloid, developed in the early 1850s, which was faster and sharper than the earlier
    calotypes, described by Eastlake as ''Rembrandt-like studies.'' Collodion prints
    made visible every accidental detail, detracting attention from the face, resulting
    in images that were ''facial maps'' but not modelled with rounded and truth and
    beauty which art seeks⁴ ''Correctness of drawing, truth of detail, and absence
    of conventions'', for Eastlake the best characteristics of photography as a new
    form of communication, excluded it from the realm of ''that mystery called art''⁴⁵


    The aesthetic of the unfinished, championed by Romanticism because it left on
    the work the tactile traces of the artist''s creative process, giving a more active
    role to the imagination of the sensitive viewer, was widespread throughout the
    nineteenth century⁴⁶ This was a problem for photographs because their forms emerged
    fully finished from camera and darkness, and this overabundance of was'
