    to ‘merciless’ aesthetic engagements with suffering.²⁴ As John Macarthur argues
    in his account of Ruskin''s critique of the picturesque, there was a deep ambience
    to the picturesque aestheticization of misfortune: ‘At the sight of human misery
    we were jolted, disgusted (at the objects and at ourselves aestheticizing them).’²⁵
    Compared to Ruskin, Beato is an inscrutable figure, in spite of his commercial
    success. No writings of his exist to give us a sense of moral psychology behind
    his photography, but the popularity of the morbid images does not necessarily
    indicate that colonies were unconflicted by his aestheticization of violence.
    One man’s ‘beauty’ could be another’s ‘carnage’, and the aesthetic approach to
