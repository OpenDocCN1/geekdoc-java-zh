  md: '# Photography and the Arts


    field of biology. Within five years, however, it had been extended to photography
    and other industrial processes used to create multiple, identical products. As
    Henri Zerner cautions, ‘Reproduction functions less as a true concept than a nebulous
    semantic field, the multiple and sometimes contradictory notions which can work
    for or against the elevation of the status of photography within the cultural
    values of the time.’ In this, reproduction was part of what Zerner calls an ‘unstable
    vocabulary’, including many notions, marked photography’s first decade by an attempt
    to specify the new invention with a ‘more natural tendency to view the unknown
    in terms of the known.’ Taking this notion of reproduction as a methodological
    starting point, this chapter offers a reassessment of Fizeau’s images within the
    visual economy of the late nineteenth century. As Fizeau found himself at the
    centre of a multidisciplinary network, his reproductions intersected with the
    nascent fields of photography, electricity and entomology, domains which had more
    in common in our current histories have allowed.


    # Specimens


    The sales catalogue of the London dealer E.P. Goldsmidt, from whom the NYPL describes
    the Fizeautype prints ‘as quite rare indeed.’ My research shows that the variety
    of these works is directly limited to the fact that they have remained, until
    now, largely unexplored (with most of the subjects still unidentified) whereas
    their actual reality is. The NYPL appears to have held the largest trove of Fizeau’s
    work, followed by the Conservatoire des Arts et Eteliers in Paris and the J. Paul
    Getty Museum in Los Angeles; there are also examples scattered among private collectors
    and several other institutions internationally. The selection of the NYPL’s photographic
    engravings exist in multiple states—some of which Fizeau accordingly inscribed
    in ink ‘1↞re [sic] and ‘2↞m [sic]—indicating they are the first and second states
    of trial proofs (Figures 1.1 and 1.2). A closer look at these works reveals important
    clues about their production, including hallmarks (symbols engraved or stamped
    into the plates with potential information about silver content and/or manufacturer)
    and printing techniques.


    Although there is no definitive catalogue of daguerreotype hallmarks, the available
    sources indicate that two of the printed marks on the NYPL material (a sweetheart
    rosette and the letters ‘HS’) appear on daguerreotype plates as early as 1843,
    when Fizeau first showed examples of his photographic engravings at a meeting
    of the Académie des Sciences in Paris and the year before he patented the process.
    The numerical ‘100’ that appears in many of the photographic engravings indicates
    the ratio of silver to copper (1–10) which is in fact for daguerreotypes, the
    more common ratio being 1–40. The number is important, however, because Fizeau
    recommended the 1/10th ratio for his. Such details, which have long been the basis
    of print connoatorship, are often neglected or absent in studies of early photography,
    particularly when it comes to hybrid media such as photo-engravings. Yet, as in
    this case, they often help ascertain or confirm production date, support attribution
    and provide context for specific techniques. For example, slight variations'
