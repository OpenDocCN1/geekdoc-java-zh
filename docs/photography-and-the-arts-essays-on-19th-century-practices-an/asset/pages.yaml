    American Narrative Daguerreretypes


    Diane Waggoner


    > Composition pictures, such as Rejander’s Ways of Life [,] have not been executed
    in America


    > – Coleman Sellers, 1862


    When Professor Edwin Emerson of Troy University returned to Philadelphia in 1862
    from a trip to Britain, he visited with Coleman Sellers (1827–1907) and other
    unnamed American photographers and showed them examples of British photography,
    including Gustaf Rejander’s Ways of Life (1857) and Head of the Baptist (1855).
    For the men gathered that day, viewing rejander’s pictures crystallized the possibilities
    for image-making that negative-positive photography offered. Two Ways of Life
    (Figure 10.1) presented an allegory of virtue and vice through an elaborate composition
    made from combining several negatives. It was a touchstone for photography in
    Britain, a photograph ambitious for its technique and for the scope of subject,
    which capped not only rejander’s career, but with Henry Robinson’s work, which
    referred a genre of subject photographs. Though Sellers referred to rejander’s
    technique of combining negatives, the telling of a story in a photograph was nevertheless
    a stark reminder of a greater lacuna in contemporary American photography. Sellers
    – who was famously enclosed in Philadelphia artistic circles and the grandeur
    of the artist Charles Wilson Peale – right to a degree: Rejander’s Ways of Life
    was not being emulated in the United States in the early 1860s. Then, with the
    nation in the middle of the Civil War, few, if any, photographers attempted staged
    photographs. Although Sellers did not acknowledge any previous American narrative
    photography, these kinds of composition had thrived ten years before the heyday
    of the daguerreotype, though by no means a common undertaking. Some daguerreotypes
    adopted genre, coinciding with the rise in popularity of American genre.


    These ambitious narrative pictures predated those made by Rejander and other photographers
    in Britain in the collodion era and were created even before landscape coalesced
    as an artistic subject in American photography in the mid-1850s and'
