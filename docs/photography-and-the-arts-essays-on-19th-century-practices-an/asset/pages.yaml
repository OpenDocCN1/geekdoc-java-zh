  md: '# Picturesque Conflict


    87


    The picturesque way of seeing, in its very manner of regulating shocking experience
    via visual conventions, could confront the British with their dubious duplicity
    to enjoy what Henry A. Giroux terms ‘an aesthetics of depravity’: human suffering
    ‘subordinated to the formal properties of beauty, design and taste.’ Thus, at
    the same time as it enabled subjects to respond to poverty, war or ruin with aesthetic
    satisfaction, the picturesque disposition was unsettling. The very fact that such
    extremes could be perceived ‘picturesquesely’ was itself shocking – hence Ruskin’s
    anxiety. Ambivalence is presently evident; I suggest, in the initial, sensory
    encounter with a reality that is or could be disturbing, when the situation is
    responded to in terms of aesthetics rather than ‘ethical’ (the Victorians). Adapting
    picturesque artistic motifs for the camera was a process infused with particular
    drama, especially when it involved composing bodies (alive and dead) under the
    shadow of violence. So, as any resulting picturesque images have been providing
    aesthetic comfort or pleasure, the actual process of regulating modernity’s horrors
    by making pictures out of them was something that could strain against ethical
    mores. This article explores the transgressive potential of ‘picturesque’ violence,
    as the British attempted to reassert their control over an insurrectionary subcontinent
    by choreographing photographic tableaux at traumatic sites of Anglo-Indian massacre.


    # Picturesque violence


    Even without any knowledge of the summary hangings and arbitrary punishments of
    Indians happening beyond the frame of Beato’s Secundrabagh, the grouping of the
    living and the dead in relation to the architectural ruin has disturbing resonance.
    There is something about the postures of the four Indian men – standing against
    the backdrop of a battle-ravaged building, with the scattered bones of the slain
    spread before them – that hints at their vulnerability. The figures hardly have
    the m of gloating victors. Their necrotic positioning next to the remains of their
    compatriots frames in terms of what Judith calls ‘precarity’: a ‘political induced
    condition in which certain populations [...] become differentially exposed to
    injury, violence, and death.¹⁰


    The horse offsets the scene, with a center order being re-imposed on the chaos
    of war through the inclusion of a domesticated animal. The horse is harnessed
    and docile, its presence recalling the pastoralism common in picturesque aesthetics,
    whereby elements of wilderness are counterbalanced by signs of human habitation
    and control. The conventional nature of Beato’s photograph is evident from among
    the eighteenth-century colonial artist, William Hodges, whose A View of the Tomb
    of the Emperor Akbar, at Secundra also depicts passive Indian staff congregated
    around the faded grandeur of architectural ruins (Figure 5.2).¹¹ Such picturesque
    strategies have been seen by scholars as archetypically imperial, dominating alien
    terrains and working to provide a coherent expression of Britain’s empire by making
    diverse landscapes submit to familiar visual schemata.¹²


    Beato – a versatile photographer – drew on such longstanding and popular picturesque
    traditions at the same time as he engaged in more documentary modes of practice.¹¹³
    using classic landscape motifs – equine and human staffage – Beato'
