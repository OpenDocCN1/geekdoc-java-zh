    # From Victorian to Modern


    In 1904 a London exhibition of Cameron''s work situated the photographer firmly
    in a historical Victorian moment. Nearly all of the photographs displayed in a
    gallery of the Serendip Bookshop were albumen prints, many loaned by people in
    Cameron''s circle or their children. These albumen photographs were artefacts
    of a social network. The author of the catalogue essay was Alice Meynell (1847–1922),
    a prominent journalist, poet and author of books on Victorian writers.³³³² Meynell
    evaluated Cameron''s focus as her invention (''instead of turning the hard eye
    of the camera fall full upon her subject, Mrs. Cameron let it be sidelong, and,
    as it was by chance''). According to Meynell, Cameron produced visual effects
