    display of Cameron''s photographs at the South Kensington Museum is sparse.¹14
    The only mention to be found within the museum''s records occurs in the Register
    of Correspondences, where after an entry for 18 September 1865 notes the receipt
    of a letter in which Mrs Cameron ''asks permission to exhibit Photos''¹¹⁵ On 3
