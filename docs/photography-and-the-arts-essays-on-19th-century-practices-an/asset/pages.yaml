  md: '# Photography and the Arts


    views on readings of Cameron that supported their own versions of photographic
    aesthetics. As will be argued in this essay, their readings cumulatively served
    to reconceptualize Cameron''s photographic practice less in terms of his socio-historical
    artistic meaning, and more in terms of its value to a self-consciously modern
    practice of artistic photography.


    Two larger, interconnected, issues emerge in this chronicle of the artistic claims
    made on Cameron''s work. The first issue is the way photographers and critics
    in this period modernized their practice by emphasizing Cameron''s distinctive
    use of lens focus over other aspects of her photography. The second is the way
    they use of reproductions of Cameron''s photographs to convey their emphasis that
    focus was the key element of her imagery. Cameron''s signature of focus for correlating
    human vision with lens focus manipulation galvanized nineteenth-century debates
    on artistic photography. Cameron''s manipulation of focus and depth of field to
    model the visual forms of her sisters was Victorian for the inspiration she took
    from the painters in circle. It was precisely her experimentation that allowed
    emerging modern photographers to claim her work as a historical precursor, though
    this meant their artistic process was abstracted from its historical context.
    This occurs decisively in criticism and commentary but also at a material level:
    commentators were often Reading Cameron works that were not her making but versions
    in photographic and reproductive processes with distinctly different visual effects.
    As we see in this essay, in 1913–14 (over a decade before the Bloomsbury group
    deployed Cameron and her peers as the historical foils to their awed modernism),
    artistic photographers used photographic and photomechanical reproductions of
    Cameron''s photographs to transform her images into a new kind of artistic object,
    which could sustain a claim on the modern.


    > ‘I could not bear that all my years labour be forgotten’


    In 1875, anticipating the move of her household from Freshwater, on the Isle of
    Wight, to Sri Lanka (then Ceylon), Cameron hired the Autotype Company of London
    to produce carbon photographs of her images. She wrote to a friend of the decision,|I
    could not bear that all my years labour be forgotten and ‘the grace of the fashion
    of it’ perish and pass out of sight.’ Carbon photographs were chemically more
    stable than albumen,, were subject to fading, and loss of tone in the highlights
    unless properly processed and stored. The Autotype either used Cameron''s wet
    collodion negatives to make their carbon photographs, or when her negative was
    damaged, photographed one of Cameron''s albumen photographs and used this copy
    negative to make a carbon print. Cameron paid to have the Company to do this work,
    anticipating a profit from the sale of her prints in the London gallery.


    Cameron''s engagement with the Autotype Company also followed on from her ideas
    about the aesthetics of the albumen photographic print, whether issues of scale
    (in 1865 Cameron purchased a new lens to make the ‘enormous photographs’'
