    child; and the Christian subject matter of the Madonna and child. The models are
    also typical: Mary Hillier, Cameron''s favourite for the role of the Madonna,
    a very young member of Cameron''s own family. The title, Devotion, which Cameron
    wrote under the photograph in large, underlined script, is suggestive of both
    piety and motherhood. In smaller letters to the left, she added, ‘From Life My
    Grand child age 2'
