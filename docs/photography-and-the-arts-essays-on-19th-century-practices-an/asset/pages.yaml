    disinterestedness of these debates was exposed when the investigation was framed,

    without explanation, one to the question of photography''s claim upon the

    artistic.^45 This is a rhetorical manoeuvre that has attended photography criticism

    and theory since the word camera came into wide usage: ''objective'' inquiries

    to the nature, and the future, of photography in the nineteenth century were generally

    framed as an inquiry into, or were substantially concerned with, its relationship

    to the arts. This disinterestedness for aesthetics is akin to claim that for

    philosophy; it biases and vested interests to operate as universals. This is the

    value of specificity (material, historical and scholarly); it allows the reader
