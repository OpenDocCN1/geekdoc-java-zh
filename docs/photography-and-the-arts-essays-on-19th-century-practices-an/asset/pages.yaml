  md: '# The Photographic and the Picturesque


    the choice of the subject, the means of illumination, and the pose fall infinitely
    short of that which is desired to attain, when it becomes a question of reproducing
    nature; as far as it is, however, it is easy to recognize it in the production
    of those operators who possess artistic skill, while its absence is equally obvious
    in the works of those whose success they wisely chose science and facility of
    manipulation.²


    Only a post-processing of the pictures would be able to offer a corrective to
    the suspension of the beauty to be manipulated artistically that gives rise to
    the instability of the photograph. What Blanquart-Évrard means this is, however,
    is not reverse engineering the positive, which he described in his submissions
    to the Académie de sciences of the years 1846–51 and visualized/exemplified by
    means of photographic portraits and reproductions of art. In 1863, he explains
    that photographs can only be artistic if — in addition to what is depicted — the
    quality of the picture, its tonal values, the distribution of opaque and translucent
    pictorial fields are outstanding, something that can only be achieved by working
    on the negative. What Blanquart-Évrard means with this is not retouch with brush
    and colour, but rather chemical retouching, whose use, various procedures and
    pictorial effects he generously describes in his treatise. Because a successful
    photographic picture represents the interplay of artistic skill and knowledge
    of the craft, Blanquart-Évrard endeavours to prolong the brief moment in which
    the photograph is taken by providing chemical manipulations that enable the photographer
    to actively intervene in the process of developing the picture.³ artistic achievement
    of which we are now speaking can be attained either by the pencil or the palette;
    it must remain purely chemical, in order to alter the outline and to allow it
    to retain all its homogeneity and delicacy of execution.⁴ In addition to examining
    the pictorial subjects of contemporary art, which he considers always the chemical
    conditions of photography that drove the amateur artist and art lover from Lille.
    Without taking the chemical foundations of photography into consideration, photographs
    can never be designed freely, and thus become art. This is the reason why Blanquart-Évrard
    is not solely a chemist and artist’ as Davanne wrote, but also a photographic
    process technician who knew that art and thus the aesthetic potential of photography
    are based on his chemical foundations.


    Translated from the German by Gerrit Jackson, revised by Amy Clement.


    I am most grateful to Heather Shannon, who very generously allowed me to read
    the manuscript and PowerPoint presentation for her lecture “The ‘Blanquart-Évrard’
    Cahiers in the Collection of the George Eastman Museum’ prior to publication.
    I would also like to thank Thomas Ketelsen, with whom I had the pleasure of co-teaching
    a richly inspiring seminar on the role of staffage (human accessories) in graphic
    art and photography in the Grafisches Kabinett at the Walraff-Richartz-Museum,
    Cologne, in in the summer term 2018.'
