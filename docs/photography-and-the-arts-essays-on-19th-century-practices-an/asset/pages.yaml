    colonnades nevertheless makes the actual labour of copying very visible (remember
    this was reproduced as the first photograph (see Figure 2.1) in Cole’s book).
    As Elizabeth Edwards writes, a photograph is not simply ‘of’ an event, but is
    the event.²² The event of making architectural copies—the gathered personnel of
    mould makers, plaster casters, labourers, superintendent, photographer—all are
    bound together in this one image. For Cole is a manifesto of the joint effort,
    the co-endeavour of the plaster cast and photography working together to preserve
    and document architectural heritage.


    In introduction to The Architecture of Ancient Delhi, Henry Hardy Cole stated
    that the projects of plaster casting and photographing the buildings in the Qut
    complex in Delhi had been conceived of a joint endeavour


    By a previous arrangement Mr Shepherd, of the firm of Messrs Shepherd and Bourne,
    came to Cole [sic] to take a set of photographs of the most interesting buildings,
    and these are here published by order of the Lords of the Committee of Council
    on Education, to form a collateral series of illustrations to the casts exhibited
    at the South Kensington Museum.²³


    Interestingly, in Cole’s formulation the photographs are perceived as ‘collateral’,
    implying that they were something of a parallel medium – as a reproductive technique
    of a different, but related, kind. However, we could understand the term collateral
    to imply that the photographs were also secondary or subordinate to that despite,
    Cole always conceived of the casts as the superior mode of reproduction. Also,
    in the space of the museum, it would be the true-scale three-dimensional casts
    which would precedent, whereas the flat plane of the book publication, read together
    with the didactic text, it was the photographs, printed by the London-based Permanent
    Printing Company, that communicated the purpose and ethos of Cole’s project beyond
    India and South Kensington. Together, plaster and photography worked to build
    this colonial archive of reproductions.


    For the photographs, Cole wanted detail or, as he put, ‘diagrammatic records,
    the clear reproduction of structural and ornamental detail.’²⁴ He was not the
    sweeping views or the sublime grandeur for which, as Cole put, ‘Mr Shepherd’s
    instincts and sympathies were included’²⁵ The purpose of photography, in this
    case, was not to simply record the work of plaster casting to its own, recording
    the particular details of site, and seen through the imprint of light onto the
    glass plate of the wet collision nowadays. Through casting, replicating, labelling
    and photography. Cole envisaged himself as engaged in documenting a history of
    India which was manifest through physical structures: ‘The history of India is
    intimately concerned with the ancient monuments of that country. In some cases
    these monuments are her only reliable records,’²⁶ he wrote, echoing the architectural
    historian James Fergus’s architecture and its associated sculpture were the only
    reliable documents in a land where ‘no written annals could be trusted.’²⁷ Cole
    asserts the power of the colonial copyist to interpret this history and make it
    more readable and more reliable. Whilst advocating for the preservation in situ
    of monuments, Cole’s castings and photographs performed a removal of'
