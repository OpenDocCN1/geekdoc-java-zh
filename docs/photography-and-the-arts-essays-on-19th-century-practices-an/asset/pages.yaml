    # Theatricality


    Montgomery P. Simons (c. 1816–77), a prominent daguerreotypist who first established
    a reputation in Philadelphia for the high quality of his portraiture, made the
    most unique surviving group of subject pictures executed in America. While working
    in Richmond, Virginia, Simons met Mann Saturweite II (1824–92), a young man with
    artistic interests, who later made a fortune manufacturing and selling Valentine''s
    Meat Juice. Drawing on Charles Brun''s seventeenth-century treatise on the expression
    of passions in the human face, he commissioned Simons to make close to thirty
    daguerreotypes of himself, his brother, Winston Valentine, and an artist friend,
    portraying different emotions. Simons''s series, all made on the same day on 2
    January, remained in Valentine''s possession until he bequeathed them to the Valentine
    Museum in Richmond, which he founded before his death in 1893.


    Valentine kept a diary, and few days before the setting, he noted that Hubbard
    ''has engaged the past week or ten days in some work for his passions in metaphysics,
    physiognomy. Desiring to possess myself of a key to the passions, he has fallen
    upon a beautiful system of illustrating them.¹² A sheaf of papers among Valentine''s
    bear written captions from Le Brun but illustrations not to have materialized.¹³
    Instead, Valentine and his partners it is not clear whether they considered the
    passions an end in themselves or if they saw them as studies to aid Hubbard in
    making illustrations. Valentine also inscribed a list of the passions that he
    and his friends chose to model on the day, ''What excites these passions?'' and
    following with his ''key'', which included emotions ranging from love to passions,
    such as rage, remorse, hate, desire, melancholy, folly, and finally madness and
    idocy.¹⁴ Unfortunately, none of the daguerreotypes were labelled with the corresponding
    passion, so the emotions illustrated by each are not certain.


    The three changed their attire for each portrait: in some, they are clad simply
    in white shirts, while others drape themselves with a gingham or a heavy cloth
    to express the emotion. For example, the silly look of the gingham cloth wrapped
    around Valentine''s head may be employed to convey folly or idocy. The portraits
    are taken from the waist or are bust-length, though, in one, Valentine stands
    clothed, with the gingham tied around as a loincloth. Each was carefully fashioned
    (sometimes neatly, sometimes used), the shirt either buttoned or loosened at the
    collar—to convey either positive or negative emotions. In some, the emotions are
    expressed solely by the face, in others hands are used. In one, Valentine squints
    his eyes and bares his teeth, his ruffled sticking from his face, as if he has
    just run his hands through it (Figure 10.8). His expression suggests he was acting
    madness, rage or possibly jealousy from his listed emotions.


    In carrying out their project, the four collaborators wrestled with the contradictions
    of photographic portraiture, Alan Trachtenberg has discussed. By employing Le'
