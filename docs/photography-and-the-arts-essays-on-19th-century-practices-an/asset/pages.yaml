    # Naturalism and Impressionism: Defining terms


    To some critics, the visual effects of pinhole photography and Impressionist painting
    were unnatural, and Emerson thought them un-naturalistic. Yet Davison in his ‘Impressionism’
    lecture, Davison acknowledged that the new school of painters ‘have variously
    called impressionist, naturalist, and the like;⁴⁷ This conflation of Impressionism
    and Naturalism was common. Indeed, French Impressionist painting was founded on
    Naturalism, itself the extension of a longstanding artistic commitment to *plein-air
    painting*.⁸ In 1889, the Camera connected Monet’s work to Emerson’s terms in *Natural
    Photography* by declaring that ‘it is this impressionism, or Naturalism, that
    Dr. Emerson urges upon photographers for their worship and imitation.’⁴⁹ Emerson
    disentangled these terms in his book, explaining that while Impressionism means
    the same thing as naturalism, he preferred the latter, in which the work of art
    ‘can be raised to a standard — Nature. For Emerson, nature constituted an objective
    standard, whereas Impressionism was founded on subjectivity: “The painter can
    claim what he sees, and so much of, Nature; and each individual painter becomes
    a standard for himself and others.”⁵⁰ As Emerson implied, there were equivalences
    between Naturalism and Impressionist strategies for representing the artist’s
    visual experience. But the approaches differed in the extent to which the picture
    expressed the artist’s ‘sensation’ or the subjective ‘impression’ of the natural
    scene — the first deferring to optic objectivity and the latter to individual
    perception. In 1890, Davison gave an example of how ‘impression’ operated: “The
    artist does not paint the tree in the landscape, he paints impression of it. His
    impression may be different from others, but that may yet be true.”⁵¹


    Emerson rejected Impressionism, and following Davison’s lecture, he also disavowed
    Naturalism, declaring ‘I am for the present and future neither idealist, realist,
    naturalist, nor impressionist — *photographic impressionism indeed*!; and footnot
    ‘photographic impressionism’ as ‘a ter desecrate’ [sic] to Charlatans.’⁵² His
    words were included in ‘The Death of Naturalistic Photography’, which he printed
    as a pamphlet at the end of December 1890 and submitted to the photographic press
    for publication in January 1891. Emerson’s ‘renunciation’, crucially, a rejection
    of nature’s primacy as the foundation of art. It also encompassed other issues,
    one of which was asserting himself over Davison: ‘At the Society of Arts the other
    day, a paper read by Mr Davison — an amateur without training, and with superficial
    knowledge — in which my ideas were freely and impud handled and no credit gave
    me.’⁵³ Davison had indeed quoted Emerson, but the American poet and philosopher
    Ralph Waldo Emerson (1803–82), not his second cousin Peter Henry.⁵⁴'
