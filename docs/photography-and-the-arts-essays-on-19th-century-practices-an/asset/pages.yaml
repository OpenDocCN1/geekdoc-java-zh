  md: 'The eruption, in the late 1850s, of non-technical writings on photography into
    the journals serving the British ‘photographic body’ makes it possible for us
    to speak of an emergent specialist criticism. This emergent criticism consolidated
    the place of rhetorical modes of writing in the specialist discourse constituted
    by the photographic journals. It took this as its main object the relationship
    between photography and art/or its correlate, the formulation of an aesthetics
    for photography: In this essay, I argue that 1859–63 was the dynamic period for
    this criticism as aesthetic positions and terminology, and their stakes, were
    still unfixed. This is evident from the critical reception of the exhibition photographs
    by Henry Peach Robinson (1830–1901) made according to the technique called ‘composition
    photography’ (printing from two or more negatives onto a single sheet of photographic
    paper to create a narrative, genre/or illustrative photography). Lindsay Smith
    argues that the debates over composition photography as published in the British
    photographic press in this period demonstrate how the advent of photography necessitates
    a newly defined relationship of imitation.² This semantic imperative was not confined
    to the realm of aesthetics: new definitions signalled the possibility of other,
    new configurations, both social and political. In this critical period of contention
    over the nature of British photographic aesthetics, writings on the subject of
    composition photography in both the photographic and the daily/periodical press
    mobilized shifting aesthetics of ‘imitation’ and ‘deception’ that were encoded
    with questions of social and political inclusion and exclusion. And, as we will
    see, in the process of determining what would ultimately serve for both constituencies
    of artistic photography, the possibility raised by composition photography, that
    of a threat to the so-called natural order, would be closed down.'
