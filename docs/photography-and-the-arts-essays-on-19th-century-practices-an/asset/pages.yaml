  md: '# Photography and the Arts


    in the different states of the same printed image are related to the fact that
    Fizeau printed them from a single plate he had etched at different depths and/or
    from various states of the daguerreotypes he were electroplated as part of his
    photographic engraving process.${12}$ See, for example, the more nuanced shading
    and greater degree of detail visible in the second state of the trial proved above
    (Figure 1.2).


    Fizeau''s experiments followed the realization by Moritz von Jobi (1801–74) in
    1838 by electroplating—the deposit of metal on copper plates through chemically
    produced electricity—had endless applications, from printing to the reproduction
    of industrial objects and art.${13}$ Fizeau appears to have been the first researcher
    to apply the process to daguerreotypes, making copies from originals throughout
    the spring of 1841 in advance of attempting photographic engraving.${14}$ The
    latter process is complex, but Fizeau essentially used an acid-etched daguerreotype
    plate as one of copper, thereby which he first electroplated a layer of gold and
    then a final layer, making the plate thicker and, consequently, the depth at which
    it could be etched, the number of impressions could be made.


    Lerebours purchased the rights to Fizeau''s patent in France, and the Swiss engineer
    Johann Hurlmann (1793–1850) oversaw the printing of the plates. Lerebours''s surname
    (having first been engraved on the daguerreotype plates) appears in reverse on
    many of the NYPL photographic engravings, and Hurlmann is the only name seated
    among the fourteen portraits in Fizeau''s collection at the NYL.${15}$


    The subjects of Fizeau''s photographic engravings that I have been able to identify
    comprise, in addition to portraits, reproductive engravings after paintings, by
    one Leon Rouillet (1645–99) after *The Virgin of the Grapes* by Pierre Merignac
    (1612–95), and the infamous engraving by Paolo Mercuri (1804–84) after the 1831
    Salon painting, *Arrival of the Harvesters in the Portine Marches*, by Leopold
    (1794–1835).${16}$ There are also architectural details and reproductions of sculpture,
    including reliefs from Notre Dame cathedral (the fourteenth-century *Funeral of
    the Virgin* from the choir of the north façade (see Figures 1.1 and 1.2), and
    the thirteenth-century Virtues from the south transept); a statue of the Immaculate
    Conception, complete with a serpent at the feet of Mary, who is crowned with stars;
    and a plaster copy (Figure 1.3) of d Anger''s first buried by the naturalists
    Georges Cuvier (1769–1832).${17}$ subjects that might be called ''scientific''
    include a barometer designed by Lerebours, a trial proof from a daguerreotype
    micrograph likely for Alfred Donné''s *Cours de minuscule* (1845) and an enlargement
    of a bug, which we will return (Figure 1.4).${18}$ This hodgeodge of subject matter
    was typical of early attempts at photomechanical reproduction, which included
    prints aimed at an audience of artists, scientists and the publishing industry.
    Fizeau was relying upon a selection of available daguerreotypes made within a
    narrow re of enthusiasts (mostly drawn from the same audience) whose production
    was by professional competition.${19}$


    Fizeau was not, in fact, the first to chemically and print from daguerreotypes.
    He was preceded by the French physician Alfred-François Donné (1801–78) and the
    Austrian anatomist Christian Josef Berjes (1796–1844). His experiments with electrotypes
    coincided with those of the English physicist William Robert Grove (1811–96) and
    the French chemist Charles-Louis Chevalier (1804–59).${20}$ These later two scientists
    benefited, like Fizeau, from the late-eightteenth-century electrochemical'
