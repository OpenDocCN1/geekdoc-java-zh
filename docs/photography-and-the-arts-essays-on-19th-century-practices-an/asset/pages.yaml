  md: '# A Bug For Photography?


    experiments of two Italian physicists, Luigi Galvani (1737–98) and Alessandro
    Volta (1745–1827). Volta’s subsequent development of the voltaic pile, or electric
    battery, originated from what was called galvanism, in recognition of Galvani,
    whose research began with bioelectrical experiments on the bodies of dissected
    animals.^21


    The commercial and industrial uses of electrical apparatus as applied to printing
    and metal-plating industries in the 1840s to be called electrotyping or galvanoplasty;
    electroplating was the term used for the processing of metal objects through electrolysis
    (including, eventually, daguerreotype types), whereas galvanography generally
    came to be associated with graphic applications. Whatever the term, it is not
    too much of a stretch to understand how these processes, which traced their origins
    to bioelectricity and were directed at producing identical multiples, understood
    through the concept of biological reproduction, especially when combined with
    photography. Electricity shared many of photography’s personalities as well as
    some of its developmental tendencies, including multiple claims of invention,
    networked associations and an unstable vocabulary.^22 The term reproduction, then,
    came indirectly to photography. It came to it by way of electricity and the intersection
    of electricity with entomology.


    # Shutterbugs


    In 1836, the german scientist Andrew Cross (1784–1855), of Fyne Court, Somerset—known
    locally as the ‘thunder and lightning man’—conducted an experiment in electro-crystallization
    and obtained unusual results.^23 On the 26th day of his tests, small insects began
    to appear out of the rocks on which he was experimenting. Over the next several
    weeks, the insects, later identified as mites, began to crawl and multiply. As
    much unlike this event, Cross was accused of heresy, despite the fact that he
    never claimed to be, or know, the cause of the birth. Yet in the face of ‘so much
    vice and abuse, so much calumny and misrepresentation,’ he continued to repeat
    his experiments, and his ‘electric mites’ were displayed for the next several
    years; their origin and precise identification remained a mystery to this day.^24


    It might seem idiosyncratic to introduce this episode here, but entomology in
    the nineteenth century as a scientific discipline alongside electricity and photography,
    and all three practices (and sometimes all three at the same time) were equally
    manifest in one form or another^25 All three were linked through the popular imagery
    of regeneration and, ultimately, reproduction.^26 Indeed, we could call all three
    fields as types of media following Just Parikka’s expanded model. For Parikka,
    the concept of media extends beyond human-oriented technology to the world of
    insects and the entity of nature, which sees as a dynamic, creative network of
    transmission and connection: ‘Media are a contraction of forces of the world into
    specific resonating milie.^27 In this light it is not surprising that Andrew Cross
    came to be seen, albeit anachronistically, as the progenitor of Mary Shelley’s
    Frankenstein (his ‘insects’ appeared some twenty years after his monster).^28
    Nor is it surprising that a bug (Figure 1.4) appears among Fizeau’s'
