    reveal the considerable inconsistency of scale between human figures and architecture
    that remain characteristic of lithographic depictions after 1850 to be a stylistic
    contrivance. Through the leap in dimensions in the drawing of the scenery the
    beholder’s eye is guided towards the buildings, while the staffage merely portrays
    the scene. Photography, in contrast, naturalizes the depiction.⁵⁹'
