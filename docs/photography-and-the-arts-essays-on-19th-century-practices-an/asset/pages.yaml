    # Photographic portraits


    As described, Blanqu-Évrard did not confine to publish his photochemical refinements
    to the field of science. He sent a proxy, the physician and deputy of the Département
    du Nord, Gaspard Théophile Lestiboudois (1797–1876), to the Académie des beaux-arts
    to present a series of sample pictures he had taken himself and request an expert
    appraisal.27 The submission, labelled an ‘album’ by the Academy, was scrutinized
    by an assessment, the members consulted with two colleagues from the Académie
    des sciences, Jean-Baptiste Biot (1774–1862) and Victor Regnault (1810–78).28
    The experts thought that they needed to witness the technique with their own eyes
    to come to an accurate verdict concerning its potential and quality, and so Blanqu-Évrard
    was summoned to Paris for a demonstration and examination of his process, which
    took place outside Regnault’s physical laboratory in the interior courtyard of
    the Institut de France for three days in April 1847.29


