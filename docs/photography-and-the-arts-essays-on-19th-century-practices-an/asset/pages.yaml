    other in a private letter. The published reference occurs in a footnote to an
    article in which critics Alfred H. Wall outlined four types of artistic photographic
    portraits. Wall grouped Cameron''s portraits with those of David Wyncliffe, whose
    soft tonality he likened to ''fine old pictures of the ancient masters''. He complained,
    of Cameron''s clumsily and inartently arranged drapery, bad pictorial composition,
    and, generally, palpable distortion or bad drawing, arising from a misuse of the
    lens; continuing that ''what merit they'
