    eighteenth century and still popular by Ruskin’s day – provided a framework within
    which photography’s ethical relationship to the world could be negotiated.

    Ruskin’s critique of the ‘lower’ picturesque sentiment as ‘eminently a heartless’
    one preempts more recent scholarship in his suggestion that the aesthetic was
    not simply a set of harmless conventions prioritizing rough textures, irregularity
    and ruins; it was a modern way of seeing which, with its most exclusive emphasis
    on visual appreciation, entailed a suppression of the spectator’s moral response;⁵
    Photography partake in the ‘hardening’ of modern feeling that Ruskin identified
    within the picturesque temperament, fostering that Zahid R. Chaudhary has termed
    ‘phantasmagoric aesthetic’ – a structure of perception that desensitized colonials
    to the sensory shock-effects that Walter famously identified as symptomatic of
    industrial modernity.;⁷ In Chaudhary’s complex reading of shock, photography and
    perception in nineteenth-century British India, the picturesque is seen as an
    instantiation of a modern perceptual ‘habitus’ – an ingrained way of seeing –
    that regulated the colonial encounter by providing ‘aesthetic armor’ against threatening
    new stimuli.⁸ I want to highlight the potential ambivalence of this modern, protective
    reflex of aestheticization.⁹'
