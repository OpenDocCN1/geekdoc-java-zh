    # Composition versus patchwork


    When Alfred began to write about photographic aesthetics in late 1859, he, like
    Robinson, challenged the views of those who identified photography with the masses
    and their supposed prediction for debased forms of mimesis.¹²⁶ Wall did not, however,
    identified a particular photographic practice as the model for having photographers
    recognized as capable of artistry. Instead, he identified criticism as the means
    to do so: according to Wall, if photographs were in exhibitions as pictures of
    them, they would be recognized as pictorial productions.²⁷ Initially approving
    of composition photography in his writings,²⁸ responded to the paper Robinson
    gave the Photographic Society of Scotland with a article entitled ‘Composition’
    versus ‘Patchwork’²⁹ Wall deployed the satirical term coined by ‘Mrs Spriggins’
    in the title of his paper, repeated Hannaf’s identification of composition photography
    aesthetics and expressed his visions in an adversarial tone borrowed from the
    back pages. Wall argued that what was called ‘composition photography’ was only
    artistic photography when ‘composition’ referred to the selection of the scene
    or the grouping of the figures and not the creation of a photographic picture
    by exposing sections of different negatives onto the same piece of photographic
    paper in the darkroom. ‘Patchwork photographers were, said Wall, making deception
    for imitation and robbing photography of its highest and only value; that of ‘wondrous
    truthfulness.³⁰ He condemned Robinson as perpetating a deception upon the public
    and, so, sinning against his conscience.³¹ For him, Robinson laughed off ‘Mrs
    Spriggins’ as a light-hearted joke because he acknowledged that he had to take
    seriously an adversary with Wall’s credentials.³² ‘Mrs Spriggins’ and A. H. Wall,
    however, likely one and the same.³³


    Wall’s writings for the photographic press regarding photography’s relationship
    to art were highly strategic: the debate he engineered to convince the readers
    of the merits of one particular version of photographic aesthetics. Whereas the
    leading photographer, Francis Frith (1822–98), writing in the Art-Journal in 1859,
    the truthfulness ascribed to photography marked its difference from art, Wall’s
    most faithful manuscript from nature would approach the condition of art.³⁴ This
    was the view espoused by Wall of pseudonyms. ‘Lovetruth’, there were two types
    of realism and idealism, and photography belonged to the first order.³⁵ The realism
    of artistry at stake was that the rendering of the material aspect of a subject,
    or atmospheric effect did not automatically mark an absence of the higher values
    that signified. Instead, it was the role of the photographer to render a scene
    encountered in real life in such a way that the sentiment inspired in him by was
    conveyed to the viewer of the photograph.³⁶ To achieve this, the photographer
    would have to deploy intellectual as well as mechanical labour, laying claim for
    photography, and for himself, to a metaphorical middle ground between the two.
    Occupying this notional middle ground (actually or performatively) allowed the
    photographer, and the photographic'
