  md: '# 40 Photography and the Arts


    another kind – placing these monuments in an architectural history of India that
    was written and preserved by the British authorities. The colonialism of art history''s
    methods is starkly apparent here.


    The asymmetrical politics of colonial labour abound in both the images and texts
    of The Architecture of Ancient Delhi. Whereas Cole recorded the names of the Indian
    models employed at Sanchi in his (S. Burnald and Pwesamy, from the Madras School
    of Industrial Art; Noble Chandler Mukerji, Bonomali Pali and Khudram Das, from
    the Calcutta School of Art; and Girder, modeller from Agra), regarding the models
    used in Delhi, we are told that they were soap-stone carvers from Agra and, according
    to Cole, trained up by him for the task in.28 Casting native monuments, as Cole
    was eager to point out in his text, disciplined and proficient who describes the
    ‘native moulders’ as ‘unbroken supervision on the part of some qualified person.’
    He did not extend the courtesy he had granted to Shepherd for the patience and
    labour of the numerous Indian craftsmen who were responsible for the actual making
    of the casts.


    The casting of South Asian architecture presented Cole with a number of practical
    problems requiring new technical solutions. The conventional plaster moulding
    used to make casts of architecture was deemed unsuitable in this context. According
    to Cole– such a process is not suitable, in respect of rapidity, Indian sculptures,
    which are mostly of a very elaborate character largely of what is termed an ‘undercut’
    quality and native moulders could not execute any such work alone. A demand, he
    writes, has created for a process which would be not only easy and quick, but
    to a great extent would obviate the necessity of manipulating the casts when they
    issue from the mould.29 Gelatine (a technique he had no doubt learnt from Franchi),
    a binder made from the bones, skin and cartilage of animals, was used to create
    a second skin around India’s architectural history. Cole gelatine moulding was
    ideal in this situation as these ‘objects’ could be ‘embraced in one’– the flexible
    and elastic properties of the product reaching deep recesses and repeating every
    mark and grain on the surface. It was also reported, more mechanical than making
    piercing, this is easily acquired by natives, with or without supervision, it
    execute rapidly and well.29 The first photograph in Cole’s Architecture of Ancient
    Delhi shows no romantic of craft, but a modern and efficient line of repetitive,
    ‘mechanical’ tasks. This is what we see in the centre of the photograph – a gelatine
    being prepared and one on a makeshift pedestal which is ready to cast, the bulging
    bag of plaster and the ‘bhisti’ and other workers standing by, ready to aid this
    material transformation.


    The casts made at the Qub complex weighed six tons, a number indicative of the
    sheer physical labour required to make them. This heavy load joined the Sanchi
    reproductions and those made by Corporal Jackson at Fateh Pur Sikki, and the whole
    collection was sent back to England, travelling via the Suez Canal and Liverpool
    Docks, reaching London well ahead of their spectacular display at the International
    Exhibition of 1871, held in South Kensington. These pieces which formed the ‘parent’
    casts fitted together and further casts were made, entering museum collections
    across Europe.31'
