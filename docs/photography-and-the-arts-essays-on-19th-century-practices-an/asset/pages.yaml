  md: '# Carlyle Like a Rough Block of Michael Angelo’s


    Willème’s short-lived photo-sculpture, using 360-degree photography, was a variant
    of the many sculpting machines that continued to be made and used in the twentieth
    century and beyond.⁴⁹ Cameron’s awareness of these devices might have informed
    the characterization of her and Michelangelo’s works as different from those ‘cut
    out of such a machine.’⁵⁰ It is in the context of these debates about artistic
    versus mechanical or unthinking finish that Michelangelo’s rough faces in Brutus
    or Day become a reference for Cameron thinking about how to ‘revolutionize photography.''⁵
    My comparison with on-off direct carving, substituting the gestures of the sculptor
    with hammer and chisel for those of the photographer handling lenses, handles
    and prints, left unawared, the inherently multiple nature of (collodion) photography
    and, on a more practical level, the issue of how to make it profitable relying
    on each print made by her own hands. To come fully with photography’s nature as
    a medium of mechanical production and reproduction, Cameron had to look at the
    sculpture of her contemporaries.


    This is what she said in ‘Annals of my Glass House’ in 1874. This autobiographical
    account, written as she was about to leave Britain because of financial problems,
    characterizes the camera as not a machine but a living thing, with memory and
    creative vigour.⁵² Cameron’s vision for her portraits, like Michelangelo’s faces,
    develops from her interaction with:


    When focussing and considering to something to my eye was very beautiful, I stopped
    there instead of strewing on the lens to the most definite focus which are all
    other photographers insist upon.⁵³


    Interestingly, she abandons Michelangelo while sculpting Carlyle’s portrait, but
    does return to sculpt in her description of Tennyson’s reactions to the portrait
    by her he had nicknamed ‘Dirty Monk’


    > The Laureate has said of it that he likes it better than any photograph that
    has been taken of him except one Mayall; that except for itself. The comparison
    seems too comical. It is rather like comparing one of Madame Tussaud’s waxwork
    heads to one of Woolner’s ideal heroic busts.⁵⁴


    The sculptor associated with the Pre-Raphaelites, Thomas Woolner (1825–1902) had
    portrayed Tennyson several times in medallion medals and busts that had been served
    in several materials. Cameron had included a photograph by William Jeffrey Tennyson’s
    1857 bust in the album for her sister ‘Mia’ (Maria Jackson) Nineteenth-century
    sculpture was in some ways closer to photography than the direct carving of Michelangelo.
    Like photographs, Woolner’s Tennyson from original ‘negatives’ which were not
    for show; the moulds used to make the ‘original plasters’ were then cast in bronze,
    copied in marble, or used to create editions in plaster or Parian. As in photography,
    the touch of the artist is mediated by mechanical means – moulding and casting
    from maquettes, the original’ sculpture made by the hands of the artist, and the
    sculpting machines used to make original plasters, were all indexical methods
    used to turn original plasters'
