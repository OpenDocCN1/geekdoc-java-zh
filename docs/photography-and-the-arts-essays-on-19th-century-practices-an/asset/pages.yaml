    in temporal terms – ''allow[ing] the photograph to take its time'' and ''concentrate
    its efforts upon one only⁴⁵ – conveys her experience of having sat for, as well
    as having observed, the calotype process.


    I come full circle to Benjamin and his account of duration in a sitter appears
    to grow into a calotype requiring a large exposure outdoors that ''caused the
    subject to focus his life in the moment rather than hurrying it.''⁴⁶ For Benjamin
    a move to indoor commercial portrait studios of the 1850s diminishes such a quality
    of duration. For Eastlake, a shift to indoor studios, and the forfeit of time
    spent by a sitter of the 1840s in direct sunlight, is also in no small part responsible
    for a loss of connection with art as exemplified by Rembrandt. A shift from outside
    to inside was brought to me by a stray pebble caught in the left of the calotypes
    of Matilda Rigby It is a tiny aberrant detail and one photographer might easily
    kicked out of the range of his lenses. Yet, the resilience of innocuous pebble
    touched by the warmth of the sun anchors the ''here and now'' of the image outdoors.
    At the same time, inviting her to gauge the firstly lapse between the negatives
    in the sitter appears, and without shade, the pebble gestures towards the slightest
    of objects to which, Eastlake will claim, in 1857, photography ''grant[s] a strength
    of identity which does not even see.''⁴⁷


    Eastlake''s enduring preference for calotype over subsequent processes owes much
    to its association with light as differently represented by Rembrandt as old Master
    and Turner as painter. But, in less tangible, that association attaches to direct
    experience of long periods of sitting in the Rock House. I end with a telling
    record of that experience in a letter from her friend Marion Smith to him, 22
    June 1847. Smith writes: ''I have been calotyping all day, seven different positions
    have been taken of myself and I do not know how many of Eliza Rigby I think it
    was successful that she achieved the quality day & we went out me.'' Present with
    Rigby as sitter at Calton Hill, Smith confines herself as passive object of the
    lens with the active role of photographer. In a striking transfer of agency, Smith''s
    approximation of the verb ''calotyping'', in terms of the sitter''s physical role
    in the process, the demands of sitting in mid-summer light. Eastlake''s first-hand
    knowledge of Hill and Adams''s practice was a seminal influence on her wider understanding
    of the medium. Harbouring the potential to approximate art in ways later ceded,
    the paper process encapsulated a quality of duration, in the exposure to the heat
    and the light of the sun, she had experienced at Rock House.


