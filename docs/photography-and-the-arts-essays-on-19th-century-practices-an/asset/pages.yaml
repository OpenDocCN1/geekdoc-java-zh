  md: '# Photography and the Arts


    from Fatehpur Sikri – in fact overseeing everything surrounding it, including
    the workmen on the precarious platforms – is the full-size cast of the gateway,
    or torana, from Sanchi. Henry Hardy Cole''s hope was that, through these casts,
    ''Indian architecture, like that of Egypt, Assyria, Greece etc'', would be recognized
    as an important part of the History of the World''s Art of Building.''32 The torana
    became perhaps the most famous and celebrated cast in the collection.


    The casts did not peak visitors on their own but were supported by expanding an
    archive of texts and photographs, captions and guidebooks. With guidebooks in
    hand, the nineteenth-century museum visitor could compare and contrast the architectural
    products of the world, sorting them into aesthetic, social and cultural taxonomies.
    Henry Hardy Cole wrote one of the books on Indian art, based on the collection
    at South Kensington, and his obsessive separation of South Asian art into ''religious
    types'' (Buddhist, Hindu, Jain and Muslim) defined the pattern of scholarship
    for some time to come.33 The task of making casts and photographs of Indian monuments
    was, then, of the same didactic mission of the survey and preservation of India''s
    past, as anthropologist Bernard Cohn described the ''ive modalities of British
    imperialism and its associated forms of colonial knowledge.''34 Through casts,,
    Hardy Cole desired to make a reliable, detailed and organized material archive
    of Indian architectural history, which was ultimately supervised by the British,
    and was based, in his opinion, ''solid information obtained in fixing dates''
    rather than ''native writings, which are often based on fables and traditions
    than ancient facts.''35 It was, course, an archive of fragments and thus a highly
    fragmented archive (as are all of archives, course). But it was also an impassioned
    defence of the preservation of Indian monuments in situ and in his reproductive
    copies to disseminate knowledge. This often went against the grain of the colonial
    authorities which he desired. Cole''s words were often afresh: ''It seems to be
    a suicidal and indefensible policy to allow the country to be looted of original
    art works of ancient art when there exist the means of making facsimile clearly年纪
    from the original?''36 It is perhaps no surprise that Cole was the first curator
    of Ancient Monuments in India in 1881, and he was also the last person to hold
    this title. More folio publications were issued, reports which included an update
    on the repairs at Sanchi.''37


    # Out casts


    The fortunes of Cole''s plaster cast project within the museum would become increasingly
    fragile in the twentieth century. This is highlighted by the removal of the Indian
    casts from the Victoria and Albert Museum and their subsequent destruction in
    the 1950s. It was the ''collateral series of images, in the form of Shepherd''s
    photographs, that has provided the more lasting and permanent record, with the
    book being reprinted in 1872 and digital copies now making it easily accessible
    online.''38 The mid-nineteenth century witnessed the heyday of the plaster copy,
    exemplified not only by the South Kensington collections, but also by the monumental,
    comparative assembly of casts of Egypt, Assyria, Greece, Rome and elsewhere on
    display at the Crystal Palace at white'
