    # Part One: The Arts of Reproduction


    The essays in this section also explore how nineteenth-century processes of photographic
    reproduction developed within a nexus of cultural, social and institutional forms.
    Stephen C. Pinson analyses examples of reproductions potentially marginalized
    within scholarship of early photography. In ‘A Bug for Photography: Hippolyte
    Fizeau’s Photographic Engraving and Other Media of Reproduction’, Pinson draws
    on a social and artistic network of research, including studies of electricity
    and entomology, to elucidate the meaning of Fizeau’s prints. Working from Henri
    Zner’s observation that reproduction, as applied to French photography at this
    date, was less ‘a true concept than a nebulous semantic field’, Pinson explains
    the multidiscinary elements of this field, including the subjects and visual effects
    of Fizeau’s prints. Pinson’s inquiry into Fizeau’s photographic engravings at
    this transitional moment draws new cultural connections between early photographic
    experiments and the scientific and cultural transformations of the Industrial
    Revolution.'
