    # Chapter 10


    # Zookeeper Example


    In this example, we will explore Apache Zookeeper, starting with the introduction
    and then followed by the steps to set up the Zookeeper and to get it up and running.


    # 10.1 Introduction


    Apache Zookeeper is the building block of distributed systems. When a distributed
    system is designed there is always a need of developing and deploying something
    that can coordinate the cluster. This is where Zookeeper comes into the picture.
    It is an open-source project maintained by Apache for maintenance and coordination
    of the distributed cluster. Some of the services provided by Zookeeper are:


    +   **Naming Service**: A name service is used to map a name to some sort of data
    which can be accessed using this name. For example, DNS servers map to the address
    of the server or nodes can access the server using that name. In distributed systems
    we may need to check the status of the name assigned to them. This can be done
    by using the naming service interface provided by default by Zookeeper.

    * **Configuration Management**: Zookeeper also provides the option to manage the
    configuration of distributed system center. Configuration is stored centrally
    on Zookeeper and any new node on joining the distributed system can pick the configuration
    from Zookeeper. This makes making configuration quite easy and effort free.

    * **Leader Election**: Distributed Systems usually needs an automatic failover-strategy
    in case some nodes fails. Zookeeper provides an option to do so using leader election
    functionality.

    * **Locking**: In every distributed system, there will be shared resources and
    multiple services may need to access this. To allow serialized access to this,
    a locking mechanism is required. Zookeeper provides this functionality.

    * **Synchronization**: The access to the shared resources also need to be the
    synchronized in the distributed system. Zookeeper also provides a simple interface
    for this.


    # 10.2 How Zookeeper Works?


    Zookeeper follows a client-server model. In which clients are the machines in
    the cluster. These machines are also called nodes. These clients consume the service
    provided by the servers. Zookeeper coordinates the distributed system but in itself
    it is also a distributed system. The collection of Zookeeper servers in distributed
    mode is called Zookeeper ensemble.'
- md: '

    # Apache Hadoop Cookbook


    Figure 10.1: Zookeeper Client-Server Architecture


    At any given time, one client can be connected to only one Zookeeper server but
    each zookeeper server can handle multiple clients at the time. Client sends pings(heartbeats)
    to the server periodically to let it know that it is alive and connected to the
    new. Zookeeper server also responds with an acknowledgement informing that it
    is alive and connected as well. The frequency of these pings/heartbeats can be
    set in the configuration file which we will see in the next section.


    In case the client does not receive an acknowledgement from the server it is connected
    to within the specified time period, the client then tries to connect to the another
    server from the pool and on the successful connection the client session is transferred
    to the new Zookeeper server it is connected to.


    Zookeeper follows a hierarchical system similar to the file system to store data
    in nodes and it is called nodes. Zode is derived from "Zookeeper data nodes".
    Each zode acts as a directory and can have multiple sub-node and the hierarchy
    continues. To access the nodes, Zookeeper follows the file path structure. For
    example: the path to znode firstnode and the corresponding sub nodes can look
    like this: `/firstnode/sub-node/sub-sub-node`


    ## 10.3 Zookeeper Setup


    In this section, we will go through the steps to setup the Zookeeper server on
    the localhost for experimentation purpose. Zookeeper provides a single server
    in the package and can be directly run on the machine.


    ### 10.3.1 System Requirements


    - Java, JDK 6 or later (We will use JDK 8)

    - Minimum 2GB RAM

    - Dual Core Processor

    - Linux OS. Linux is supported as both development and production systems. Both
    Windows and MacOSX are only supported as the development system and not as production
    systems.


    ### 10.3.2 Install Java


    First of all, we will check if Java is installed on the system and if not, we
    need to install Java first. To check if Java is installed


    ```

    java -version

    ```


    If this returns the Java version then Java is installed. Make sure it is at least
    JDK 6 or higher. In case Java is not installed, we have to install it. Use the
    following commands to install JDK 8.


    ```

    sudo apt-get update

    sudo apt-get install openjdk-8-jre-headless

    ```


    The first command will update all the packages already installed and the second
    command will install the OpenJDK 8. Following is the console output


    Figure 10.2: Console output after installing Java JDK 8


    To check if the installation was successful, run again the command


    ```

    java -version

    ```


    the output should be something similar to what is displayed in the following screenshot:


    ### 10.3.3 Download Zookeeper


    Next step is to download the stable release version of Zookeeper from Release
    site. Download manually the stable version from the Download section of the release
    site(at the time of writing, stable release is 3.4.6). We can use any of the mirrors
    mentioned in the site(as shown in the screenshot below) and unzip/untar to the
    desired folder.


    Home > Dyn About Projects People Get Involved Download Support Apache Search


    We suggest the following mirror for your download:


    http://eu.apache.org/dist/zookeeper/


    Other mirrors are listed below. Please use the backup mirrors only to download
    PGP and MD5 signatures to verify your downloads or if no other mirrors are working.


    ### HTTP


    http://eu.apache.org/dist/zookeeper/


    http://us.apache.org/dist/zookeeper/


    Figure 10.4: Apache Zookeeper Mirrors


    or use the following commands to download and untar:


    ```

    wget https://www.apache.org/dist/zookeeper/stable/zookeeper-3.4.6.tar.gz

    tar -xvf zookeeper-3.4.6.tar.gz

    cd zookeeper-3.4.6/

    ```


    Figure 10.5: Downloading the stable Zookeeper version


    ### 10.3.4 Data Directory


    We need a directory to store the data related to the znodes and other zookeeper
    metadata. For that we will create a new directory in /var/lib/ by the name zookeeper


    ```

    sudo mkdir /var/lib/zookeeper

    ```


    When Zookeeper is created, the default owner is root. To change the owner so that
    Zookeeper can access it, run the following command:


    ```

    cd /var/lib

    sudo chown -R zookeeper:zookeeper /var/lib/zookeeper

    ```


    Figure 10.6: Zookeeper ownership change


    Figure 10.7: Zookeeper Data Directory


    ### 10.3.5 Configuration File


    Now it is time to make the required changes. Zookeeper comes with a sample file
    which we will use as a template. It is named zoo-sample.cfg and located in the
    conf folder.


    ```

    cd zookeeper-3.4.6/conf

    mv zoo-sample.cfg zoo.cfg

    ```


    Figure 10.8: Renaming sample file


    Now, let''s edit this zoo.cfg. In this example, we used nano but you can use whichever
    editor you like.


    ```

    nano zoo.cfg

    ```


    Make sure the file looks like what is below and contains the following settings:


    ```

    tickTime = 2000

    initLimit=10

    syncLimit=5

    dataDir=/var/lib/zookeeper

    clientPort=2181

    ```


    **Note:** dataDir should be set to the directory we created in the previous step
    i.e. /var/lib/zookeeper


    Figure 10.9: zoo.cfg file


    ### 10.3.6 Starting The Server


    Now it is time to start the Zookeeper server. Zookeeper comes with a script file
    to make it easy to start the server. The file is called zkServer.sh. To start
    the server use the following code:


    ```

    cd zookeeper-3.4.6/

    bin/zkServer.sh start

    ```


    Figure 10.11: Starting Zookeeper Server


    ## 10.4 Zookeeper Server Basic Interaction


    ### 10.4.1 Starting The CLI


    Once the Zookeeper server is running successfully, we can start the CLI(Command
    Line Interface) to interact with the server. Use the following command to do so:


    ```

    cd zookeeper-3.4.6/

    bin/zkCLI.sh -server

    ```


    With this command, the console will go into the Zookeeper command line mode where
    we can use the Zookeeper specific commands to interact with the server.

