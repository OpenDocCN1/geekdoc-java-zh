    \n# 前言\n\nApache Hadoop 是一个用 Java 编写的开源软件框架，用于在由通用硬件构建的计算机集群上对极数据集进行分布式存储和分布式处理。Hadoop\
    \ 的所有模块都基于一个基本假设：硬件故障是常见的，并且应该由框架自动处理。\n\nHadoop 已经成为分布式计算的事实标准工具。正因如此，我们在 Java\
    \ Code Geeks 提供了大量的教程，其中大部分可以在此处找到：https://examples.javacodgeeks.com/category/enterprise-java/apache-hadoop/\n\
    \n在这本电子书中，我们提供了一系列基于 Hadoop 的示例汇编，将帮助你启动自己的 Web 项目。我们涵盖了广泛的主题，从安装和配置到分布式缓存和流式处理。通过我们直观的教程，你将能够以最短的时间让自己的项目运行起来。\n\
    \n# 作者简介\n\nRamaninder 毕业于德国格尔斯-奥古斯特大学计算机科学与数学系，目前在奥地利的一个大数据研究中心工作。拥有应用计算机科学硕士学位，专业应用系统工程，辅修商业信息学。\n\
    \n他还是一名微软认证专业人员，在 Java、C#、Web 开发及相关技术方面拥有5 年以上的经验。目前，他的主要兴趣是大数据生态系统（包括批处理和流处理系统）、机器学习和\
    \ Web 应用。\n\n# 第一章\n\n## “Hello World”示例\n\n### 1.1 介绍\n\nHadoop 是 Apache 软件基金会的项目。它是受\
    \ GoogleReduce 和 Google File System 启发的开源版本。\n\n它设计用于跨越通用标准硬件上的系统集群对大型数据集进行分布式处理。\n\
    \nHadoop 的设计假设所有硬件早晚都会故障，系统应该是健壮的并能够自动处理硬件故障。\n\nApache Hadoop 由两个核心组件组成：\n\n\
    - 分布式文件系统，简称 HDFS（Hadoop Distributed File System）。\n- 用于 MapReduce 作的框架和 API。\n\
    \n在这个示例中，我们将演示 Hadoop 框架的第二个组件 MapReduce，并将通过单词计数示例（Hadoop 生态系统的 Hadoop World\
    \ 程序）来完成，但首先我们应该理解 MapReduce 到底是什么。\n\nMapReduce 基本上是一个软件框架或编程模型，允许用户编写程序，以便数据可以在集群中的多个系统上并行处理。MapReduce\
    \ 由两部分组成：Map 和 Reduce。\n\n- Map 任务：Map 任务使用 `map()` 函数执行，主要执行过滤和排序。这部分负责处理一个或多个数据块并产生输出结果，通常称为中间结果。如下所示，map\
    \ 任务通常是并行的，映射操作之间相互独立。\n- Reduce：Reduce 任务由 `reduce()` 函数执行，并执行汇总操作。它负责合并每个 Map\
    \ 任务产生的结果。\n\n### 1.2 Hadoop 单词计数示例\n\n单词计数是 Hadoop 和 MapReduce 的“Hello World”程序。在这个示例中，程序包含一个\
    \ MapReduce 任务，用于统计文件中每个单词出现的次数。该任务由 Map 和 Reduce 两部分组成。Map 任务映射文件中的数据，并统计传递给\
    \ map 函数的数据块中的每个单词。该任务的结果传递给 reduce，reduce 合并数据并在磁盘上输出最终结果。\n\n# Apache Hadoop\
    \ 实战指南\n\n![](img/ac80ba15da75cccb79369ea5d652b025_11_0.png)\n\n图 1.1：MapReduce\
    \ 作中 Map 和 Reduce 任务的基本原理\n\n### 1.2.1 设置\n\n我们将使用 Maven 为 Hadoop 单词计数示例设置新项目。我们在\
    \ Eclipse 中设置一个 Maven 项目，并在 pom.xml 中添加以下 Hadoop 依赖项。这将确保我们拥有访问 Hadoop 代码库所需的权限。pom.xml\n\
    \n```\n<dependency>\n  <groupId>org.apache.hadoop</groupId>\n  <artifactId>hadoop-core</artifactId>\n\
    \  <version>1.2.1</version>\n</dependency>\n```\n\n添加依赖项后，我们就可以开始编写单词计数代码了。\n\n\
    ### 1.2.2 Mapper 代码\n\nmap 任务负责空格和单词对输入文本进行分词，然后遍历所有标记，并为每个单词发射一个计数为 1 的键值对，例如\
    \ `<Hello, 1>`。以下是 MapClass，它需要继承 MapReduce Mapper 类并重写 `map()` 方法。该方法将接收一个待处理的数据数据块。当此方法被调用时，函数的\
    \ value 参数将数据分词为单词，而 context 将写入中间输出，然后这些输出将被发送到其中一个 reducer。\n\nMapClass.java\n\
    \n```\npackage com.javacodgeeks.examples.wordcount;\n\nimport java.io.IOException;\n\
    import java.util.StringTokenizer;\n\nimport org.apache.hadoop.io.IntWritable;\n\
    import org.apache.hadoop.io.LongWritable;\nimport org.apache.hadoop.io.Text;\n\
    import org.apache.hadoop.mapreduce.Mapper;\n\npublic class MapClass extends Mapper<LongWritable,\
    \ Text, IntWritable>{\n    private final static IntWritable one = new IntWritable(1);\n\
    \    private Text word = new Text();\n\n    @Override\n    protected void map(Long\
    \ key, Text value,\n        Context context)\n        throws IOException, InterruptedException\
    \ {\n\n        String line = value.toString();\n        StringTokenizer st = new\
    \ StringTokenizer(line, \", \\ \");\n\n        while (st.hasMoreTokens()) {\n\
    \            word.set(st.nextToken());\n            context.write(word,one);\n\
    \        }\n    }\n}\n```\n\n### 1.2.3 Reducer 代码\n\n后续代码片段 ReduceClass 继承了 MapReduce\
    \ Reducer 类并重写了 `reduce()` 函数。该函数在 map 方法之后被调用，并接收键（即单词）和对应的值。Reducer 遍历值，将它们加到一个单独值中，最后将单词和该单词出现的次数写入输出文件。\n\
    \nReduceClass.java\n\n```\npackage com.javacodgeeks.examples.wordcount;\n\nimport\
    \ java.io.IOException;\nimport java.util.Iterator;\n\nimport org.apache.hadoop.io.IntWritable;\n\
    import org.apache.hadoop.io.Text;\nimport org.apache.hadoop.mapreduce.Reducer;\n\
    \npublic class ReduceClass extends Reducer{\n    @Override\n    protected void\
    \ reduce(Text key, Iterable values,\n        Context context)\n        throws\
    \ IOException, InterruptedException {\n```\n\n```\nint sum = 0;\nIterator valuesIt\
    \ = values.iterator();\n\nwhile (valuesIt.hasNext()) {\n    sum = sum + valuesIt.next().get();\n\
    }\ncontext.write(key, new IntWritable(sum));\n\n```\n\n### 1.2.4 整合：Driver 类\n\
    \n所以当我们准备好 map 和 reduce 类后，是时候将它们整合为一个单一作业了，这是在一个名为 driver 的类中完成的。该类包含 main()\
    \ 方法用于设置和运行作业。以下代码检查输入参数是否正确，即输入和输出文件的路径。通过设置和运行作业，在最后，它会判断作业是否成功完成。带有单词计数及其对应数量的结果文件将出现在输出路径中。\n\
    \nWordCount.java\n\n```\npackage org.apache.hadoopopcodeeks.examples.wordcount;\n\
    import org.apache.hadoop.conf.Config;\nimport org.apache.hadoop.fs.Path;\nimport\
    \ org.apache.hadoop.io.IntWritable;\nimport org.apache.hadoop.io.Text;\nimport\
    \ org.apache.hadoop.mapreduce.Job;\nimport org.apache.hadoop.mapreduce.lib.FileInputFormat;\n\
    import org.apache.hadoop.mapreduce.lib.output.FileOutputFormat;\nimport org.apache.hadoop.mapreduce.util.Tool;\n\
    import org.apache.hadoop.mapreduce.lib.output.TextOutputFormat;\nimport org.apache.hadoop.util.ToolRunner;\n\
    \npublic class WordCount extends Config {\n\n    public static void main(String[]\
    \ args) throws Exception {\n        int exitCode = ToolRunner.run(new WordCount(),\
    \ args);\n        System.exit(exitCode);\n    }\n\n    public int run(String[]\
    \ args) throws Exception {\n        if (args.length != 2) {\n            System.err.printf(\"\
    Usage: %s needs two arguments, input and output file%s\\n\", get().getClass().getSimpleName());\n\
    \            return -1;\n        }\n\n        Job job = new Job(get());\n    \
    \    job.setJarByClass(WordCount.class);\n        job.setAppName(\"WordCount\"\
    );\n\n        FileInputFormat.setInputPath(job, new Path(args[0]));\n        FileOutputFormat.setOutputPath(job,\
    \ new Path(args[1]));\n\n        job.setOutputKeyClass(Text.class);\n        job.setOutputValueClass(IntWritable.class);\n\
    \        job.setOutputFormatClass(TextOutputFormat.class);\n\n        job.setMapperClass(MapClass.class);\n\
    \        job.setReducerClass(ReduceClass.class);\n        return 0;\n    }\n}\n\
    ```\n"
