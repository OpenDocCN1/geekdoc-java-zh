    ## 2.2.2 Multiple Sources


    In case there are multiple sources and need to go to the same destination, then
    all the sources can be passed as the arguments in the following syntax:

    The files from all the sources will be copied to the destination.

    There is another alternative if there are many sources and running long command
    can become an issue. The alternative approach:


    ```

    hadoop distcp -f hdfs://namenode:port/sourceList hdfs://namenode:port/source2
    hdfs://namenode:port/source3 hdfs://namenode:port/destination

    ```


    where, sourceList is a simple file containing the list of all the sources. In
    this case, source list need to be passed with the flag -f which indicates that
    the source is not the file to be copied but a file which contains all the sources.

    **Note:** When distcp is used with multiple sources, at the destination, copying
    is not aborted but distcp will abort the copy with an error message. In case of
    collisions at the destination, copying is resolved as per the options specified.
    If no options are specified, default is that the files already existing at the
    destination are skipped.


    ![](img/ac80ba15da75cccb79369ea5d652b025_81_0.png)


    ## 5.2.3 Update and Overwrite Flag


    As the name indicates, update will update the files at the destination folder
    but only if the update conditions are met. For update to be performed are update
    checks id the destination have the same file name, if the file size and content
    are as the source file, if everything is then the files are not updated but if
    they are uploaded from the source to destination.


    overwrite will overwrite the files at the destination id have same file name,
    if so, then the files will be overwritten.


    ```

    hadoop distcp -update hdfs://namenode:port/source hdfs://namenode:port/destination

    ```


    ```

    hadoop distcp -overwrite hdfs://namenode:port/source hdfs://namenode:port/destination

    ```


    ## 5.2.4 Ignore Failures Flag


    In distcp is any map fails, the other map tasks also and the copying process halts
    completely with an error. In case, there is the requirement to continue copying
    chunks of other if one or more map tasks have the ignore fails flag -i.


    ```

    hadoop distcp -i hdfs://namenode:port/source hdfs://namenode:port/destination

    ```


    ## 5.2.5 Maximum Map Tasks


    If the user wants the maximum number of map tasks which can be assigned for distcp
    execution, there is another flag -m <max_tasks>.


    ```

    hadoop distcp -m 5 hdfs://namenode:port/source hdfs://namenode:port/destination

    ```


    This example will assign number of 5 map tasks to the distcp command.


    Example of setting map tasks in distcp:


    ```

    hadoop distcp -m 1 hdfs://quickstart.cloudera:8020/user/access_logs hdfs://quickstart/

    cloudera:8020/user/destination_access_logs_3

    ```


    Here we limit map tasks to 1. From the example log output we do not find map tasks
    for this file data is 2.

