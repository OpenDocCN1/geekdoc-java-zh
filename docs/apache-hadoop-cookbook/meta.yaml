  md: '# Chapter 6


    # Distributed File System Explained


    In this example, we will discuss Apache Hadoop Distributed File System(HDFS),
    its components and the architecture in detail. HDFS is one of the core components
    of Apache Hadoop ecosystem also.


    # 6.1 Introduction


    Apache Hadoop provides a distributed filesystem and a framework for the transformation
    of large data sets using the MapReduce paradigm. HDFS is designed to store very
    large data sets reliably while running on commodity hardware. It is fault-tolerant
    and provides high throughput access to the data stored. The interface of HDFS
    is patterned after the Unix filesystem, but it relaxes a few POSIX requirements
    to improve the performance of the application it targets to address and provide
    streaming access to the data stored in the file system.


    # 6.2 HDFS Design


    Following are the properties of HDFS which makes it different from other file
    systems and what make HDFS capable of handling large amount of data reliably.


    # 6.2.1 System failures


    HDFS is designed to work on a set of commodity hardware. System failures are considered
    a norm. As there are a large number of components on which HDFS relies on, considering
    these components have a non-trivial probability of failure will also result in
    one component or the other failing all time. So HDFS is designed to detect the
    failures and perform automatic recovery in order to provide required performance
    is one of the core properties of HDFS.


    # 6.2.2 Can handle large amount of data


    HDFS is designed to be used with applications that depend on a large amount of
    data. This data can be in gigabytes, terabytes or petabytes also. So HDFS is tuned
    to support such large data sets and scale to a large cluster of systems to store
    this data without compromising the data throughput.


    # 6.2.3 Coherency Model


    HDFS is tuned to address the applications which require to write data once or
    at maximum only a few times and read the data lot more. As these applications
    are assumed to rely on "write once read many times" model, it simplifies the data
    coherency issues and allow HDFS to provide high throughput data access.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# 6.2.4 Portability


    HDFS is designed to be portable across heterogeneous hardware and software platforms.
    Which makes the adaptation of HDFS very easy and it became the platform of choice
    for the application dependent on distributed large set of data.


    # 6.3 HDFS Nodes


    There are two main components of HDFS NameNode and DataNode.


    # 6.3.1 NameNode


    HDFS follows a master-slave architecture in which NameNode acts as the master
    node. One HDFS cluster consists of only one NameNode. The main functionality of
    NameNode is to manage the file system namespace and control the client authentication
    to the files stored in the HDFS cluster. It also handles the mapping of the data
    stored in different DataNodes.


    # 6.3.2 DataNode


    DataNode are the nodes which the name stores the actual data in the cluster. There
    are multiple DataNodes in the cluster, usually the number of DataNodes is same
    as the hardware nodes in the cluster. DataNode serve to read and write requests
    from the clients and also handles operation related to blocks of data like creation
    of blocks, deletion and replication of blocks.


    # 6.4 HDFS Architecture


    In this section we will understand the basic architecture of Hadoop Distributed
    File System(HDFS).


    # 6.4.1 Working of NameNode and DataNode


    HDFS is block-structured file system, that means all the individual files are
    divided into small blocks of data having a fixed size. These blocks are then stored
    across the cluster of machines in the DataNodes. The NameNode handles the functions
    like opening, closing and renaming directories. NameNode as mentioned also handles
    the mapping of the data in the cluster that NameNode keeps track of which block
    of data is stored on which DataNode and how the replication of this is handled.


    # 6.4.2 HDFS Namespace


    HDFS defines how the data is stored and accessed in the cluster. HDFS supports
    the traditional hierarchical organization of the files. It also supports almost
    all the functions to handle the namespaces operation like creation or removal
    of files or directories, moving files/Directories from one place to another else.


    As discussed in section 3, NameNode is the component that maintains the HDFS file
    system namespace. Any operation on the data like creation or deletion of files,
    displacement of files or directories are maintained in the NameNode.


    # 6.4.3 Data Replication


    As HDFS is designed to store large amount of data reliably and securely on set
    of commodity hardware. As this hardware is prone to failure, HDFS needs to handle
    the data in a way that it can be retrieved easily in the event hardware failure
    of one or more systems. HDFS uses data replication as the strategy to provide
    fault-tolerance feature. The application using the HDFS can configure the replication
    factor as well as the block size of data as per the requirement.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# Apache Hadoop Cookbook


    # 77 / 19


    Now the question arises when replication is decided, what if all the replicas
    are in a single rack in the cluster and the whole rack fails. HDFS tries to maintain
    the rack aware replication strategy which needs a lot of tuning and experience.
    A simple but non-optimal policy is to place each replica of the block on a unique
    rack so that in case of a rack fails. At least one replica is safe in after.


    In most of the production systems replication factor of three is used. In those
    cases, HDFS uses a slight version of unique rack policy. It usually places one
    replica on the local rack, or a node on a completely different rack and the third
    on one different node on the remote rack. This improves the speed by cutting the
    inter-rack transfer time while writing on two different racks instead of three.
    This provides us backup in case of node failures and also in case of rack failures.
    This policy improves the write performance without compromising data reliability.


    # 6.4.4 Failures


    The main objective and goal of Hadoop Distributed File System (HDFS) is to access
    data reliably even in case of failures. As failures are more norm in the commodity
    hardware cluster than an exception, HDFS needs a strategy to handle the failures.
    The three types of failures are:


    +   * NameNode failure


    +   * DataNode failure


    +   * Network partitions


    Each and every DataNode in the cluster sends a periodic message to NameNode, this
    message is called heartbeat. This heartbeat comes to NameNode that the particular
    DataNode is working and is live. Now in case of DataNode failures, there will
    be no heartbeat or network partition also a subset of DataNodes may lose connection
    to the NameNode and stops heartbeats. The NameNode stop getting heartbeats from
    a particular DataNode or a set of DataNodes, it declares the nodes to be dead
    and then start the procedure to check the damage which include checking if all
    the blocks which are in deadNodes still have the sufficient number of replicas,
    or if not it starts the process to create-replicas to attain the minimum number
    of replicas configured in the application.


    The NameNode failures are more serious as NameNode is the only single point of
    failure for the complete HDFS cluster. If the NameNode system fails, the whole
    cluster is useless and it needs a manual intervention and another NameNode need
    to be setup.


    # 6.4.5 Data Accessibility


    Now in order to allow applications to access the data stored in HDFS cluster,
    it provides a Java API for applications to use. A C wrapper is also provided over
    the Java API if C language is needed to be.


    Besides Java and C API, HDFS also provides an option to access the HDFS data through
    web over the TCP port which can be configured in settings of HDFS.


    Third accessibility option is to use the file system. HDFS also provides a command
    line interface FS Shell that let user interact with the data in HDFS. The syntax
    for this command line interface is similar to the Linux shell commands. For example:


    ```

    # To make a new directory

    hadoop fs -mkdir /user/project1

    ```


    ```

    # List the content of the file

    hadoop fs -ls /user/project1

    ```


    ```

    # Upload a file from local system to HDFS

    hadoop fs -put Desktop/textfield.txt /user/project1

    ```


    For more examples and explanation of the FS Shell commands, you can check the
    Apache Hadoop FS Commands Example'
  merge: -1
  pgno: 86
- img_proc: true
  md: "# 6.5 Configuring HDFS\n\nConfiguration of HDFS is very easy and it does not\
    \ take much time to set up HDFS cluster. All the configuration files for HDFS\
    \ are by default in the Hadoop package and can be directly configured.\n\nNote:\
    \ We assume that the Hadoop package is already downloaded, unzipped and placed\
    \ in the desired directory. In this article, we will discuss the required configurations\
    \ for HDFS. For detailed articles on how to setup Hadoop and Hadoop cluster. Follows\
    \ the tutorials:\n\n+   * How Install Apache Hadoop on Ubuntu\n* Apache Hadoop\
    \ Cluster Setup Example(with Virtual Machines)\n\n# 6.5.1 Configuring HDFS\n\n\
    The HDFS is configured using the set of XML files which are by default in the\
    \ Hadoop configuration directory. This configuration directory is present in the\
    \ root of the Hadoop folder and is named conf.\n\nFirst of all, we will modify\
    \ the file conf/hadoop-sites.xml and we need to setup three properties in this\
    \ file i.e. fs.default.name,dfs.data.dir,dfs.name\n\nTo modify the file in the\
    \ editor and add the following lines of code:\n\n```\n<configuration>\n  <property>\n\
    \    <name>dfs.replication</name>\n    <value>2</value>\n  </property>\n  <property>\n\
    \    <name>dfs.namenode.dir</name>\n    <value>/usr/local/hadoop/hdfs/namenode</value>\n\
    \  </property>\n  <property>\n    <name>dfs.datanode.dir</name>\n    <value>/usr/local/hadoop/hdfs/datanode</value>\n\
    \  </property>\n</configuration>\n```\n\nFirst we use here dfs.replication which\
    \ sets the replication factor to be used by the distributed file system. In this\
    \ case we have set it up to two.\n\nThe next configuration is to define the NameNode\
    \ path i.e. dfs.namenode.dir and the value here need to be the directory to store\
    \ the namenode information.\n\nThe third and the last configuration we need to\
    \ set up defining the path for the DataNode i.e. dfs.datanode.data.dir which will\
    \ define the path to the directory to store the datanode information."
