    \ Streaming 的基础并查看一个使用 Python 的示例。\n\n## 9.1 引言\n\nHadoop Streaming 这个名字非常具有误导性，re-streaming\
    \ 与通常理解的连续数据流或连续数据流没有关系。Hadoop Streaming 只是 Hadoop MapReduce 分发版提供的一个工具，它允许用户使用\
    \ Python 或 Cpp 等其他编程语言编写 MapReduce 任务，这些语言可以利用 `stdin` 和 `stdout` 来读取和写入文本数据行。从\
    \ 0.14.1 版本开始支持 Cpp。\n\n当我们谈论其他编程语言时，并不是说用这些语言编写的代码需要翻译。\n\n## 9.2 前提条件和假设\n\n\
    以下是前提条件：\n\n- 你应该熟悉 MapReduce 的基础。\n- 你应该理解如何在 Hadoop 集群上运行。\n- 你应该知道如何使用 HDFS\
