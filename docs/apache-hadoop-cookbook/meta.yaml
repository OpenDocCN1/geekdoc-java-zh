- md: "\nCopyright (c) Exelix Media P.C., 2016\n\nAll rights reserved. Without limiting\
    \ the rights under copyright reserved above, no part of this publication may be\
    \ reproduced, stored or introduced into a retrieval system, or transmitted, in\
    \ any form or by any means (electronic, mechanical, photocopying, recording or\
    \ otherwise), without the prior written permission of the copyright owner.\n\n\
    # Preface\n\nApache Hadoop is an open-source software framework written in Java\
    \ for distributed storage and distributed processing of very large data sets on\
    \ computer clusters built from commodity hardware. All the modules in Hadoop are\
    \ designed with a fundamental assumption that hardware failures are common and\
    \ should be automatically handled by the framework.\n\nHadoop has become the de-facto\
    \ tool used for Distributed computing. For this reason we have provided an abundance\
    \ of tutorials here at Java Code Geeks, most of which can be found here: https://examples.javacodgeeks.com/category/enterprise-java/apache-hadoop/\n\
    \nIn this ebook, we provide a compilation of Hadoop based examples that will help\
    \ you kick-start your own web projects. We cover a wide range of topics, from\
    \ installation and configuration, to distributed caching and streaming. With our\
    \ straightforward tutorials, you will be able to get your own projects up and\
    \ running in minimum time.\n\n# About the Author\n\nRamaninder has graduated from\
    \ the Department of Computer Science and Mathematics of Georg-August University,\
    \ Germany and currently works with a Big Data Research Center in Austria. He holds\
    \ M.Sc in Applied Computer Science with specialization in Applied Systems Engineering\
    \ and minor in Business Informatics.\n\nHe is also a Microsoft Certified Professional\
    \ with more than 5 years of experience in Java, C#, Web development and related\
    \ technologies. Currently, his main interests are in Big Data Ecosystem including\
    \ batch and stream processing systems, Machine Learning and Web Applications.\n\
    \n# Chapter 1\n\n## “Hello World” Example\n\n### 1.1 Introduction\n\nHadoop is\
    \ an Apache Software Foundation project. It is the open source version inspired\
    \ by GoogleReduce and Google File System.\n\nIt is designed for distributed processing\
    \ of large data sets across a cluster of systems often running on commodity standard\
    \ hardware.\n\nHadoop is designed with an assumption that all hardware fails sooner\
    \ or later and the system should be robust and able to handle the hardware failures\
    \ automatically.\n\nApache Hadoop consists of two core components, which are:\n\
    \n- Distributed File System called Hadoop Distributed File System or HDFS for\
    \ short.\n- Framework and API for MapReduce jobs.\n\nIn this example, we are going\
    \ to demonstrate the second component of Hadoop framework called MapReduce and\
    \ we will do so by Word Count Example (Hadoop World program of the Hadoop Ecosystem)\
    \ but first we shall understand what MapReduce actually is.\n\nMapReduce is basically\
    \ a software framework or programming model, which enables users to write programs\
    \ so that data can be processed parallel across multiple systems in a cluster.\
    \ MapReduce consists of two parts Map and Reduce.\n\n- Map task: Map task is performed\
    \ using a `map()` function that basically performs filtering and sorting. This\
    \ part is responsible for processing one or more chunks of data and producing\
    \ the output results which are generally referred as intermediate results. As\
    \ shown in the diagram below, map task is generally processed in parallel the\
    \ mapping operation independent of each other.\n- Reduce: Reduce task is performed\
    \ by `reduce()` function and performs a summary operation. It is responsible for\
    \ consolidating the results produced by each of the Map task.\n\n### 1.2 Hadoop\
    \ Word-Count Example\n\nWord count is the \"Hello World\" program of Hadoop and\
    \ MapReduce. In this example, the program consists of MapReduce job that counts\
    \ the number of occurrences of each word in a file. This job consists of two parts\
    \ Map and Reduce. The Map task maps the data in the file and counts each word\
    \ in data chunk passed to the map function. The outcome of this task is passed\
    \ to reduce which combines the data and output the final result on the disk.\n\
    \n# Apache Hadoop Cookbook\n\n![](img/ac80ba15da75cccb79369ea5d652b025_11_0.png)\n\
    \nFigure 1.1: Basic working of Map and Reduce Tasks in a MapReduce Job\n\n###\
    \ 1.2.1 Setup\n\nWe shall use Maven to set up a new project for Hadoop word count\
    \ example. We setup a maven project in Eclipse and add the following Hadoop dependency\
    \ to the pom.xml. This will make sure we have the required access to the Hadoop\
    \ code library. pom.xml\n\n```\n<dependency>\n  <groupId>org.apache.hadoop</groupId>\n\
    \  <artifactId>hadoop-core</artifactId>\n  <version>1.2.1</version>\n</dependency>\n\
    ```\n\nAfter adding the dependency, we are ready to write our word count code.\n\
    \n### 1.2.2 Mapper Code\n\nThe map task is responsible for tokenizing the input\
    \ text based on space and words, then traverse over all the tokens and emit a\
    \ key-value pair of each word with a count of one, for example <Hello, 1>. Following\
    \ is the MapClass, which needs to extends the MapReduce Mapper class and overrides\
    \ the map() method. This method will receive a chunk of the input data to be processed.\
    \ When this method is called the value parameter of the function will tokenize\
    \ the data into words and context will write the intermediate output which then\
    \ will be sent to one of the reducers.\n\nMapClass.java\n\n```\npackage com.javacodgeeks.examples.wordcount;\n\
    \nimport java.io.IOException;\nimport java.util.StringTokenizer;\n\nimport org.apache.hadoop.io.IntWritable;\n\
    import org.apache.hadoop.io.LongWritable;\nimport org.apache.hadoop.io.Text;\n\
    import org.apache.hadoop.mapreduce.Mapper;\n\npublic class MapClass extends Mapper<LongWritable,\
    \ Text, IntWritable>{\n    private final static IntWritable one = new IntWritable(1);\n\
    \    private Text word = new Text();\n\n    @Override\n    protected void map(Long\
    \ key, Text value,\n        Context context)\n        throws IOException, InterruptedException\
    \ {\n\n        String line = value.toString();\n        StringTokenizer st = new\
    \ StringTokenizer(line, \", \\ \");\n\n        while (st.hasMoreTokens()) {\n\
    \            word.set(st.nextToken());\n            context.write(word,one);\n\
    \        }\n    }\n}\n```\n\n### 1.2.3 Reducer Code\n\nFollowing code snippet\
    \ ReduceClass extends the MapReduce Reducer class and overwrites the reduce()\
    \ function. this function is called after the map method and receives keys in\
    \ which case is the word and the corresponding values. Reducer iterates over the\
    \ values, adds them to a single value before finally writing the word and the\
    \ number of occurrences of the word to the output file.\n\nReduceClass.java\n\n\
    ```\npackage com.javacodgeeks.examples.wordcount;\n\nimport java.io.IOException;\n\
    import java.util.Iterator;\n\nimport org.apache.hadoop.io.IntWritable;\nimport\
    \ org.apache.hadoop.io.Text;\nimport org.apache.hadoop.mapreduce.Reducer;\n\n\
