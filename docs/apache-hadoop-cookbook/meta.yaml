    \ Python 代码。我们将在 Python 中使用 sys.stdin 和 sys.stdout 来读取数据并输出结果。\n\n### 9.4.1 Wordcount\
    \ 示例\n\nWordcount 是你可能已经知道的用于解释 Hadoop MapReduce 框架基础的基本程序。在 wordcount 程序中，向 Mapper\
    \ 提供了一批输入任务，它将文本行拆分为单个单词，并将这些单词作为键值对传递给 Reducer 函数。Reducer 接收键值对作为输入，并统计指定文本中特定单词出现的次数，然后输出以单词为键、次数为值的键值对。如果你不熟悉\
    \ wordcount 程序的基础，请参考 Apache Hadoop Wordcount 示例。在本文中实现相同的 wordcount 示例，但使用 Python\
    \ 代替 Java 并使用 Hadoop Streaming 运行。\n\n### 9.4.2 Mapper\n\nPython 中的 Mapper 函数将从\
    \ stdin 读取行，将行拆分为单个单词并将单词作为键、1 作为值以键值对的形式输出单词。例如，<word, 1> \n\n```python\n#!/usr/bin/env\
    \ python\n\nimport sys\n\n# 从 stdin 读取输入\nfor line in sys.stdin:\n    # 去除任何开头和结尾的空格\n\
    \    line = line.strip()\n\n    # 将行拆分为单个单词\n    words = line.split()\n\n    #\
    \ 对于 words 中的每个单词，输出键值对\n    for word in words:\n        # 将结果输出到 stdout\n   \
    \     print(f\"{word}\\t1\")\n```\n\n"
