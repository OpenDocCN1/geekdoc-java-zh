  md: "# Apache Hadoop Cookbook\n\n```\npublic class ReduceClass extends Reducer{\n\
    \    @Override\n    protected void reduce(Text key, Iterable values,\n       \
    \                    Context context)\n            throws IOException, InterruptedException\
    \ {\n\n        int sum = 0;\n        Iterator valuesIt = values.iterator();\n\n\
    \        //For each key pair, get the value and adds to the sum\n        //to\
    \ get the total occurrences of a word\n        while (valuesIt.hasNext()) {\n\
    \            sum = sum + valuesIt.next().get();\n        }\n\n        //Writes\
    \ the word and total occurrences as key-pair to the context\n        context.write(key,\
    \ new IntWritable(sum));\n    }\n}\n```\n\nFollowing the workflow of reduce function:\n\
    \n+   - Lines 17-18, define a variable sum with value 0 and Iterator over the\
    \ values received by the reducer.\n- Lines 22-24, iterate over all the values\
    \ and adds the occurrences of the words in sum\n- Line 27, write the word and\
    \ sum as key-value pair in the context\n\n# 8.3.4 The Driver Class\n\nSo when\
    \ we have our map and reduce classes, it is time to put it all together as a single\
    \ job which is done in a class driver class. This class contains the main() method\
    \ to setup and run the job.\n\n```\npackage org.javaconde.examples.wordcount;\n\
    \nimport org.apache.hadoop.conf.Configured;\nimport org.apache.hadoop.fs.Path;\n\
    import org.apache.hadoop.io.IntWritable;\nimport org.apache.hadoop.io.Text;\n\
    import org.apache.hadoop.mapreduce.Job;\nimport org.apache.hadoop.mapreduce.lib.input.FileInputFormat;\n\
    import org.apache.hadoop.mapreduce.lib.output.FileOutput;\nimport org.apache.hadoop.mapreduce.lib.output.TextOutputFormat;\n\
    import org.apache.hadoop.util.Tool;\nimport org.apache.hadoop.util.ToolRunner;\n\
    \npublic class Wordcount extends Config implements Tool {\n    public static void\
    \ main(String[] args) throws Exception {\n        int exitCode = Runner.run(new\
    \ Wordcount(), args);\n        System.exit(exitCode);\n    }\n\n    public int\
    \ run(String[] args) throws Exception {\n        if (args.length != 2) {\n   \
    \         System.err.printf(\"Usage: %s needs two arguments, input and output\
    \ files\\n\", getClass().getSimpleName());\n            return -1;\n        }\n\
    \        return 0;\n    }\n```"
