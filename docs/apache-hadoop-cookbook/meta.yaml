  md: '# 5.2.3 Update and Overwrite Flag


    As the name indicates, update will update the files at the destination folder
    but only if the update conditions are met. For update to be performed are update
    checks id the destination have the same file name, if the file size and content
    are as the source file, if everything is then the files are not updated but if
    they are uploaded from the source to destination.


    overwrite will overwrite the files at the destination id have same file name,
    if so, then the files will be overwritten.


    ```

    hadoop distcp -update hdfs://namenode:port/source hdfs://namenode:port/destination

    ```


    ```

    hadoop distcp -overwrite hdfs://namenode:port/source hdfs://namenode:port/destination

    ```


    # 5.2.4 Ignore Failures Flag


    In distcp is any map fails, the other map tasks also and the copying process halts
    completely with an error. In case, there is the requirement to continue copying
    chunks of other if one or more map tasks have an ignore fails flag -i.


    ```

    hadoop distcp -i hdfs://namenode:port/source hdfs://namenode:port/destination

    ```


    # 5.2.5 Maximum Map Tasks


    If the user wants the maximum number of map tasks which can be assigned for distcp
    execution, there is another flag -m <max_tasks>.


    ```

    hadoop distcp -m 5 hdfs://namenode:port/source hdfs://namenode:port/destination

    ```


    This example will assign number of 5 map tasks to the distcp command.


    Example of setting map tasks in distcp:


