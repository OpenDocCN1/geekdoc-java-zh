    # Apache Hadoop Cookbook


    61 / 139


    ![](img/ac80ba15da75cccb79369ea5d652b025_70_0.png)


    Figure 4.12: SSH Keygeneration


    The second command will create an RSA key-pair for the machine. The password for
    this key will be as mentioned in the command. It will ask for the path to store
    the key with default path being $HOME/.ssh/id-rsa.pub, just press enter when prompted
    to keep the same path. If you plan to change the path then remember it as it will
    be in the next step.


    Enable SSH access to the machine with the key created in the previous step. For
    this, we will have to add the key to the authorized keys list of the machine.


    ```

    cat $HOME/.ssh/id-rsa.pub >> $HOME/.ssh/authorized_keys

    ```


    Now we have to add hduser@hadoop1''s public SSH key (master node) to the authorized
    keys file of the hduser@hadoop2 machine. This can be done using the following
    commands on the terminal of hadoop:


    ```

    ssh-copy-id -i $HOME/.ssh/id-rsa.pub hduser@hadoop2

    ```


    This will prompt for the password for the user hduser@hadoop2

    The Test SSH connections from hadoop1 to itself and also to hadoop2 to make sure
    everything is fine using:


    ```

    ssh hadoop1

    ```


    This will connect hadoop1 to itself, if successfully, exit the connection and
    try to connect to the hadoop2 machine

    ssh hduser@hadoop2


    This should also connect successfully.


    # 4.6 Hadoop Setup


    So, we are at the step where we have completed all initial setup and now we are
    ready to setup hadoop on the cluster.'
