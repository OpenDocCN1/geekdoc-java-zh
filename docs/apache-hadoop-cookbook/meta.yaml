    \n![](img/ac80ba15da75cccb79369ea5d652b025_145_0.png)\n\nFigure 10.14: Getting\
    \ data from znode in Zookeeper\n\nIf you look at the screenshot, with the data\
    \ in the znode while creating, the server also returned some metadata related\
    \ to this particular znode.\n\nSome of the important fields in the metadata are:\n\
    \n+   - **ctime**: Time when the znode was created.\n- **mtime**: Last modified\
    \ time.\n- **dataVersion**: Version of the data which changes every time data\
    \ is modified. In this case data is helloworlddata and the length is 19.\n- **dataLength**:\
    \ The length of the data stored in the znode.\n- **numchildren**: Number of children\
    \ of this artifact znode.\n\n# 10.4.4 Modifying Data in Znode\n\nIf we want to\
    \ modify data in a particular znode Zookeeper provides a command for that. Following\
    \ is how to modify the data in an existing znode:\n\n```\n /firstnode helloworld\n\
    ```\n\nWhere **firstnode** is the existing znode and **helloworld** is the new\
    \ data which need to be written in the znode. Old data will be removed when new\
    \ data is set."
