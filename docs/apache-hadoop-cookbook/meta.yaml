    # Chapter 7


    # Distributed Cache Example


    In this example article, we will go through Apache Hadoop Distributed Cache and
    will understand how to use it with MapReduce Jobs.


    # 7.1 Introduction


    Distributed Cache as the name indicates the caching system to store files or data
    which is required frequently and this mechanism is distributed in nature as all
    other components of Hadoop are.


    It can read-only text files, archives, jar files etc. Which are needed by the
    application. So if a file is needed by let us map tasks. So it needs to be present
    on all the machines which will run Map tasks, This is what distributed cache is
    used.


    # 7.2 Working


    Application which needs to use distributed cache to distribute a file should make
    sure that the file is available and can be accessed via urls. Urs can be either
    hdfs:// or https://.


    Once the file is present on the mentioned url and user mention it to be a cache
    file to the distributed cache API, the Map-Reduce framework will copy the necessary
    files on all the nodes before initiation of the tasks on those nodes.

    **Notes:** In case the files are provided, these will be automatically unarchived
    on the nodes after transfer.


    # 7.3 Implementation


    For understanding how use the distributed cache API we will see an example in
    which we will write a modified version of the word count program.

    For the basic word count example and if you like to understand the basics of how
    MapReduce job works, please refer to the article Apache Hadoop Wordcount Example


    In this program, we will provide an input file to the Map-Reduce job with the
    words we need to count but we will also provide another file which contains stop
    words which we need to remove from the input text before counting the word occurrences.


    So let''s starting looking into the code:'
