    ## Chapter 4

    ## Cluster Setup Example


    ### 4.1 Introduction


    Apache Hadoop is designed for a multi-machine cluster setup. Though it is possible
    to run on single machine for all purpose but real implementation is for multi-machine
    clusters. Even if we want to try out multi-machine setup, we will need multiple
    systems which are connected to each other over the network, which is not possible
    always; what if you do not have multiple systems to try out Hadoop Cluster?


    Virtual Machines come to rescue here. Using multiple Virtual Machines we can setup
    Hadoop Hadoop Cluster using a single system. So, in this example, we will discuss
    how to setup Apache Hadoop Cluster using Virtual Machines.


    ## 4.2 Requirements


    - VirtualBox (or any other VM environment)

    - Ubuntu 15.04 (or any other linux flavor of your preference)

    - VBox Guest Additions image file (VBoxGuestAdditions.iso)


    I personally prefer Ubuntu as it has lightweight LXDE Desktop GUI and strips all
    the additional components which are present in Ubuntu and is a good option for
    virtual machines.


    ## 4.3 Preparing Virtual Machine


    In this section we will go through steps to prepare virtual machines which we
    will use for cluster later in the example.


    ### 4.3.1 Creating VM and Installing Guest OS


    Create a virtual machine(VM) in VirtualBox and assign minimum 2GB of memory and
    15GB of storage to the virtual machine. Name the first VM as HadoopI.


    # Name and operating system


    ![](img/ac80ba15da75cccb79369ea5d652b025_58_0.png)


    Figure 4.1: Creating Virtual Machine in VirtualBox


    Once the VM is created, install Lubuntu in the VM and complete the setup, we will
    get a working virtual machine after this.


    ![](img/ac80ba15da75cccb79369ea5d652b025_59_0.png)


    Figure 4.2: Installing Lubuntu in created VM


    Installation of the OS might take some time.


    ### 4.3.2 Installing Guest Additions


    Next step is to install Guest Additions in the VM. Guest Additions are additional
    setup needed for the VM to perform well. It consist of device drivers and system
    applications that optimize the guest operating system for better performance and
    usability. This is one of the important and needed step whenever creating a virtual
    machine, it allows the Guest OS to detect the size of the screen(which helps running
    the VM full screen) and also enabling guest operating system to have a shared
    folder with the host operating system if needed. Following are the steps which
    to be performed for installing guest additions in the Guest OS.


    First of all, prepare the system by building external kernel modules that can
    be done by running the command in the terminal and installing DKMS (DKMS provides
    support for installing supplementary vertices of kernel modules);


    ```

    sudo apt-get install dkms

    ```


    Insert VboxGuestAdditions.iso CD file into Linux guest virtual CD-ROM drive.


    Now open the terminal and change the directory to the CD-ROM drive and execute
    the following command:


    ```bash

    sh ./VboxLinuxAdditions.run

    ```


    Note: At this point reboot the system and move on to the next step where we will
    configure the network settings for the virtual machine.


    ## 4.4 Creating Cluster of Virtual Machines


    In this section we will see how to configure the network for the virtual machines
    to act as single cluster machines, how to clone the first machine to others which
    will save all the time as we do not need to perform previous steps on all the
    machine individually.


    ### 4.4.1 VM Network settings


    Go Virtualbox preferences menu and select Preferences from the dropdown menu.


    ![](img/ac80ba15da75cccb79369ea5d652b025_61_0.png)


    Figure 4.4: VirtualBox Preferences Menu


    In Preferences menu, select Network. In network preferences, select Host-only
    Networks and click on Add Driver. Driver will be added to the list. Double click
    the driver and it will open a popup for DHCP server settings, insert DHCP server
    settings as shown in the screenshot below.


    ![](img/ac80ba15da75cccb79369ea5d652b025_62_0.png)


    Figure 4.5: DHCP Server Settings


    We will set the lower bound and upper bound of the network to *192.168.56.101*
    and *192.168.56.254*, all the machines will have the IPs assigned from this range
    only. **Do not forget the check Enable Server**


    Once the network settings are done and DHCP server ready, in the VirtualBox Manager,
    right-click on the virtual machine and from the list select *Settings* from the
    dropdown. From the settings popup, select *Network* and then *Adapter2*''Enable
    Network Adapter* and then in *Attached* to dropdown choose *Host-only adapter*.
    In second dropdown, names of all the adapters will be available including the
    one we created in the previous step. Select from the dropdown, in our example
    it is names *vboxnet0*. This will attach the virtual machine to this particular
    network.


    ### 4.4.2 Cloning the Virtual Machine


    Now we have a virtual machine ready and we can clone this virtual machine to create
    identical machines, this saves us from the hassle of all the previous steps and
    we can easily have multiple virtual machines with the same configuration as the
    one they are cloned.


    Right-click on the virtual machine and from the dropdown select Clone. In the
    clone popup, rename the VM to Hadoop2 and select Reinitialize the MAC address
    of all the network cards and click Continue.


    ![](img/ac80ba15da75cccb79369ea5d652b025_64_0.png)


    Figure 4.7: Cloning the Virtual Machine


    Note: Reinitializing the MAC address may make sure that new Virtual Machine will
    have different MAC address. In the next screen, select Full Clone and click on
    Clone.


    ![](img/ac80ba15da75cccb79369ea5d652b025_65_0.png)


    Figure 4.8: Full clone of the Virtual Machine


    ### 4.4.3 Testing the network


    Now we have 2 machines on the same network. We have to test if both machines are
    connected to the network. Following are the steps to do:


    Start both virtual machines and in terminals use the following command:


    ```bash

    ifconfig

    ```


    This will show the network configuration. We will notice the IP assigned is in
    range 192.168.56.101 and 192.168.56.254 (i.e. lower bound and upper bound assigned
    to the DHCP).


    ### 4.4.4 Converting to Static IPs for VMs


    There will be one problem with this configuration today: IPs are allocated randomly
    to the system and may change in the future. Hadoop need static IPs to access the
    machines in the cluster, so we need to fix the IPs of the machines to be static.
    The following steps need to be performed on both machines.


    Go to /etc/networks in the terminal and edit file interfaces as root.


    ```bash

    # Go to networks directory

    cd /etc/networks

    # edit the file ''interfaces''

    sudo nano interfaces

    ```


    Add the following lines at the end of the interfaces file.


    ```text

    auto eth1

    iface eth1 inet static


    #Assign a static ip to the virtual machine

    address 192.168.56.101

    netmask 255.255.255.0

    network 192.168.56.0

    ```


    ```text

    #Mention the broadcast address, get this address using ifconfig command

    #in this case, is it 192.168.56.255

    broadcast 192.168.56.255

    ```


    ![](img/ac80ba15da75cccb79369ea5d652b025_67_0.png)


    Figure 4.10: Interfaces file


    On each machine, edit the file /etc/hosts as root and add the hosts. For example:


    ```bash

    #Edit file using nano editor

    sudo nano /etc/hosts

    ```


    Add following hosts:


    ```text

    192.168.56.101 hadoop1

    192.168.56.102 hadoop2

    ```


    Note: IPs should be same as assigned in the previous step.

    '
