    \  <version>1.2.1</version>\n</dependency>\n```\n\nAfter adding the dependency,\
    \ we are ready to write our word count code.\n\n## 8.3.2 Mapper Code\n\nThe mapper\
    \ task is responsible for tokenizing the input text based on space and create\
    \ a list of words, then traverse over all the tokens and emit a key-value pair\
    \ of each word with a count of one. Following is the MapClass:\n\n```java\npackage\
    \ com.javgeocodeeks.examples.wordcount;\n\nimport java.io.IOException;\nimport\
    \ java.util.StringTokenizer;\n\nimport org.apache.hadoop.io.IntWritable;\nimport\
    \ org.apache.hadoop.io.LongWritable;\nimport org.apache.hadoop.io.Text;\nimport\
    \ org.apache.hadoop.mapreduce.Mapper;\n\npublic class MapClass extends Mapper{\n\
    \    private final static IntWritable one = new IntWritable(1);\n    private Text\
    \ word = new Text();\n\n    @Override\n    protected void map(LongWritable key,\
    \ Text value, \n        Context context) \n        throws IOException, InterruptedException\
    \ {\n        // Get the text and the words using tokenizer as separator.\n   \
    \     String line = value.toString();\n        StringTokenizer st = new StringTokenizer(line,\
    \ \" \");\n\n        // For each token word, write a key value pair with\n   \
    \     // word and 1 as value to context\n        while (st.hasMoreTokens()) {\n\
    \            word.set(st.nextToken());\n            context.write(word, one);\n\
    \        }\n    }\n}\n```\n\nFollowing is what exactly map task does:\n\n- Line\
    \ 13-14, defines static variable value 1 and word for storing the words.\n- Line\
    \ 22-23, In map method the input variable is converted to String and Tokenized\
    \ based on the space to get all the words in the input.\n- Line 27-30, For each\
    \ word in the text, set the word variable and pass a key-value pair of word and\
    \ integer value one to the context.\n\n## 8.3.3 Reduce Code\n\nFollowing code\
    \ snippet contains ReduceClass which extends the MapReduce Reducer class and overwrites\
    \ the reduce() function. This is called after the map method retrieves keys from\
    \ the map() function corresponding to the specific key. method iterates over the\
    \ values, adds and reduces to a single value before finally writing the word and\
    \ the number of occurrences of the output to final.\n\n```java\npackage com.javgeocodeeks.examples.wordcount;\n\
    \nimport java.io.IOException;\nimport java.util.Iterator;\n\nimport org.apache.hadoop.io.IntWritable;\n\
    import org.apache.hadoop.io.Text;\nimport org.apache.hadoop.mapreduce.Reducer;\n\
    \npublic class ReduceClass extends Reducer{\n    @Override\n    protected void\
    \ reduce(Text key, Iterable values,\n                           Context context)\n\
    \            throws IOException, InterruptedException {\n\n        int sum = 0;\n\
    \        Iterator<IntWritable> valuesIt = values.iterator();\n\n        //For\
    \ each key pair, get the value and adds to the sum\n        //to get the total\
    \ occurrences of a word\n        while (valuesIt.hasNext()) {\n            sum\
    \ = sum + valuesIt.next().get();\n        }\n\n        //Writes the word and total\
    \ occurrences as key-pair to the context\n        context.write(key, new IntWritable(sum));\n\
    \    }\n}\n```\n\nFollowing the workflow of reduce function:\n\n- Lines 17-18,\
    \ define a variable sum with value 0 and Iterator over the values received by\
    \ the reducer.\n- Lines 22-24, iterate over all the values and adds the occurrences\
    \ of the words in sum\n- Line 27, write the word and sum as key-value pair in\
    \ the context\n\n## 8.3.4 The Driver Class\n\nSo when we have our map and reduce\
    \ classes, it is time to put it all together as a single job which is done in\
    \ a class driver class. This class contains the main() method to setup and run\
    \ the job.\n\n```java\npackage org.javaconde.examples.wordcount;\n\nimport org.apache.hadoop.conf.Configured;\n\
    import org.apache.hadoop.fs.Path;\nimport org.apache.hadoop.io.IntWritable;\n\
    import org.apache.hadoop.io.Text;\nimport org.apache.hadoop.mapreduce.Job;\nimport\
    \ org.apache.hadoop.mapreduce.lib.input.FileInputFormat;\nimport org.apache.hadoop.mapreduce.lib.output.FileOutput;\n\
    import org.apache.hadoop.mapreduce.lib.output.TextOutputFormat;\nimport org.apache.hadoop.util.Tool;\n\
    import org.apache.hadoop.util.ToolRunner;\n\npublic class Wordcount extends Config\
    \ implements Tool {\n    public static void main(String[] args) throws Exception\
    \ {\n        int exitCode = ToolRunner.run(new Wordcount(), args);\n        System.exit(exitCode);\n\
    \    }\n\n    public int run(String[] args) throws Exception {\n        if (args.length\
    \ != 2) {\n            System.err.printf(\"Usage: %s needs two arguments, input\
    \ and output files\\n\", getClass().getSimpleName());\n            return -1;\n\
    \        }\n        Job job = Job.getInstance(\"Wordcount\", getConf());\n   \
    \     job.setDriverClass(Wordcount.class);\n        job.setMapperClass(MapClass.class);\n\
    \        job.setReducerClass(ReduceClass.class);\n        FileInputFormat.setInputPath(job,\
    \ new Path(args[0]));\n        FileOutputFormat.setOutputPath(job, new Path(args[1]));\n\
    \        job.setOutputKeyClass(Text.class);\n        job.setOutputValueClass(IntWritable.class);\n\
    \        job.setOutputFormatClass(TextOutputFormat.class);\n\n        int returnValue\
    \ = job.waitForCompletion(true) ? 0 : 1;\n\n        if (job.isSuccessful()) {\n\
    \            System.out.println(\"Job was successful\");\n        } else if (!job.isSuccessful())\
    \ {\n            System.out.println(\"Job was not successful\");\n        }\n\n\
    \        return returnValue;\n    }\n}\n```\n\n## 8.4 Code Execution\n\nThere\
    \ are two ways to execute the code we have written, first is to execute within\
