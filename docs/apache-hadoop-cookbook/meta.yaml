    # 4.4.4 Converting to Static IPs for VMs


    There will be one problem with this configuration today: IPs are allocated randomly
    to the system and may change in the future returns. Hadoop need static IPs to
    access the machines in the cluster, so we need to fix the IPs of the machines
    to be static and assign static IPs for both machines. The following steps need
    to be performed on both the machines.


    Go to /etc/networks in the terminal and edit file interfaces as a root.


    ```

    # Go to networks directory

    cd /etc/networks

    # edit the file ''interfaces''

    sudo nano interfaces

    ```


    Add the following lines at the end of the interfaces file.


    ```

    auto eth1

    iface eth1 inet static


    #Assign a static ip to the virtual machine

    address 192.168.56.101

    netmask 255.255.255.0

    network 192.168.56.0

    ```


    ```

    #Mention the broadcast address, get this address using ifconfig command

    #in this case, is it 192.168.56.255

    broadcast 192.168.56.255

    ```'
