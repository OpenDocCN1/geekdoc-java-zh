  md: '# 10.3.5 Configuration File


    Now is the time to make the required changes in the configurations of the Zookeeper
    server. It already contains the sample configuration file which we will use as
    the template. Sample configuration file is in the folder zookeeper-3.4.6/conf/
    and is named zoo-sample.cfg


    First lets rename the file to zoo.cfg. Name of the file does not matter but there
    should be only one .cfg file present in the conf folder.


    ```

    cd zookeeper-3.4.6/conf

    mv zoo-sample.cfg zoo.cfg

    ```


    ![](img/ac80ba15da75cccb79369ea5d652b025_139_0.png)'
