    ## 4.5 Hadoop prerequisite settings\n\nFollowing the prerequisite settings for\
    \ hadoop setup. Remember all the settings need to be done in all the machines\
    \ which will be added to cluster2 machines in this example)\n\n### 4.5.1 Creating\
    \ User\n\nCreate hadoop users in all the machines. For that open the terminal\
    \ and enter the following commands:\n\n```bash\n#create a user group hadoop\n\
    sudo addgroup hadoop\n\n#create user hduser and add it to the hadoop usergroup\n\
    sudo adduser --ingroup hadoop hduser\n```\n\n### 4.5.2 Disable ipv6\n\nNext step\
    \ is to disable ipv6 on all the machines. Hadoop is set to use ipv4 and that is\
    \ why we need to disable ipv6 before creating a hadoop cluster. Open /etc/sysctl.conf\
    \ as root using nano\n\n```bash\nsudo nano /etc/sysctl.conf\n```\n\nand add the\
    \ following lines at the end of the file.\n\n```bash\n#commands to disable ipv6\n\
    net.ipv6.conf.all.disable-ipv6=1\nnet.ipv6.conf.default.disable-ipv6=1\nnet.ipv6.conf.lo.disable-ipv6=1\n\
    ```\n\nAfter this, check if the ipv6 is properly disable, use the following command\n\
    \n```bash\ncat /proc/sys/net/ipv6/conf/all/disable-ipv6\n```\n\nit will return\
    \ 0 as an output and we want it to be 1 as it symbolizes that the ipv6 is disabled.\n\
    \n### 4.5.3 Connecting the machines (SSH Access)\n\nNow, we have to make sure\
    \ that the machines are able to reach each other over the network using static\
    \ IP addresses and SSH. For this example, we will consider hadoop1 machine as\
    \ the master node and hadoop1 and hadoop2 both as the slave nodes. So we have\
    \ to make sure:\n\nhadoop1(master) should be able to connect to itself using\n\
    \n```bash\nssh hadoop1\n```\n\nIt should be able to connect to other VM\n\n```bash\n\
    ssh hduser@hadoop2\n```\n\nTo achieve this, we have to generate SSH key in each\
    \ machine. So login to hadoop1 and following the steps mentioned below in the\
    \ terminal:\n\nSwitch to the user hduser and generate the SSH public keys:\n\n\
    ```bash\n#change to user hduser\nsu - hduser\n```\n\n```bash\n#generate ssh key\n\
    ssh-keygen -t rsa -P \"\"\n```\n\n![](img/ac80ba15da75cccb79369ea5d652b025_70_0.png)\n\
    \nFigure 4.12: SSH Key generation\n\nThe second command will create an RSA key-pair\
    \ for the machine. The password for this key will be as mentioned in the command.\
    \ It will ask for the path to store the key with default path being $HOME/.ssh/id-rsa.pub,\
    \ just press enter when prompted to keep the same path. If you plan to change\
    \ the path then remember it as it will be in the next step.\n\nEnable SSH access\
    \ to the machine with the key created in the previous step. For this, we will\
    \ have to add the key to the authorized keys list of the machine.\n\n```bash\n\
    cat $HOME/.ssh/id-rsa.pub >> $HOME/.ssh/authorized_keys\n```\n\nNow we have to\
    \ add hduser@hadoop1's public SSH key (master node) to the authorized keys file\
    \ of the hduser@hadoop2 machine. This can be done using the following commands\
    \ on the terminal of hadoop:\n\n```bash\nssh-copy-id -i $HOME/.ssh/id-rsa.pub\
    \ hduser@hadoop2\n```\n\nThis will prompt for the password for the user hduser@hadoop2\n\
    The Test SSH connections from hadoop1 to itself and also to hadoop2 to make sure\
    \ everything is fine using:\n\n```bash\nssh hadoop1\n```\n\nThis will connect\
    \ hadoop1 to itself, if successfully, exit the connection and try to connect to\
    \ the hadoop2 machine\n```bash\nssh hduser@hadoop2\n```\n\nThis should also connect\
    \ successfully.\n\n## 4.6 Hadoop Setup\n\nSo, we are at the step where we have\
    \ completed all initial setup and now we are ready to setup hadoop on the cluster.\n\
    \n### 4.6.1 Download Hadoop\n\nDownload Hadoop from Apache Mirrors at www.apache.org/dist/dyn/closer.cgi/hadoop/core\n\
    \nAfter download finish, extract hadoop folder and move it to /usr/local/hadoop\
    \ and finally change the owner of the folder to haduser and hadoop group.\n\n\
    ```bash\n#Change to the directory\ncd /usr/local\n\n#move hadoop files to the\
    \ directory\nsudo mv /home/hadoop1/downloads/hadoop-2.7.1 /usr/local\n\n#change\
    \ the permissions to haduser.\nsudo chmod -R haduser:hadoop /usr/local\n```\n\n\
    ![](img/ac80ba15da75cccb79369ea5d652b025_71_0.png)\n\nFigure 4.13: Folder settings\
    \ to check permissions\n\n### 4.6.2 Update bashrc\n\nUpdate the bashrc file for\
    \ haduser.\n\n```bash\nsu - haduser\nnano $HOME/.bashrc\n```\n\nAt the end of\
    \ the file, add the following lines.\n\n```bash\nexport HADOOP_HOME=/usr/local/hadoop\n\
    export JAVA_HOME=/usr/lib/jvm/java-8-openjdk\n# convenient aliases\nalias fs='hadoop\
    \ fs' 2>/dev/null\nalias ls='hadoop fs -ls' 2>/dev/null\nexport PATH=$PATH:$HADOOP_HOME/bin\n\
    ```\n\n![](img/ac80ba80ba15da75cccb79369ea5d652b025_72_0.png)\n\nFigure 4.14:\
    \ Updating bashrc of haduser\n\n### 4.6.3 Configuring Hadoop\n\nNow, it is time\
    \ to configure hadoop setup. Following are the steps which need to be followed:\
    \ This needs to be performed by opening hadoop-env.sh in /usr/local/hadoop/etc/hadoop/\
    \ and set the JAVA_HOME variable as follows:\n\n```bash\nexport JAVA_HOME=/usr/lib/jvm/java-8-openjdk\n\
    ```\n\nNext, we will configure the core-site.xml in the folder /usr/local/hadoop/etc/hadoop/\
    \ and add the following property:\n\n```xml\n<configuration>\n  <property>\n \
    \   <name>fs.defaultFS</name>\n    <value>hdfs://hadoop1:8020</value>\n  </property>\n\
    </configuration>\n```\n\nThis will also need to be edited in all the machine because\
    \ the value should point to the master node only which is hadoop1 in this example.\
    \ So for both machines, same property and value need to be added.\n\nNext we need\
    \ to update hdfs-site.xml on all master and slave nodes:\n\n```xml\n<configuration>\n\
    \  <property>\n    <name>dfs.replication</name>\n    <value>2</value>\n  </property>\n\
    \  <property>\n    <name>dfs.namenode.name.dir</name>\n    <value>/usr/local/hadoop/hdfs/namenode</value>\n\
    \  </property>\n  <property>\n    <name>dfs.datanode.data.dir</name>\n    <value>/usr/local/hadoop/hdfs/datanode</value>\n\
    \  </property>\n</configuration>\n```\n\nNow, we will update mapred-site.xml file.\
    \ It needs to be edited **only on master node**:\n\n```xml\n<configuration>\n\
    \  <property>\n    <name>mapreduce.jobtracker.address</name>\n    <value>hadoop1:84311</value>\n\
    \  </property>\n</configuration>\n```\n\nThe last configuration will be in the\
    \ file slaves in the folder /usr/local/hadoop/etc/hadoop. Add the host names or\
    \ the ip addresses of the slave nodes:\n\n```\nhadoop1\nhadoop2\n```\n\nAs hadoop1\
    \ acts as both master and slave we will add both the host names.\n\n### 4.6.4\
    \ Formatting the Namenode\n\nWe are now done with all the configuration, so before\
    \ starting the cluster we need to format the namenode. To do so, use the following\
    \ command on the hadoop1(master) node terminal:\n\n```bash\nhdfs namenode -format\n\
    ```\n\n### 4.6.5 Start the Distributed Format System\n\nNow is time to start the\
    \ distributed format system and start running the cluster. Following is the command\
    \ to do so:\n\n```bash\n/usr/local/hadoop/sbin/start-dfs.sh\n```\n\nOnce the dfs\
    \ starts without any error, we can browse the web interface for the Namenode on\
