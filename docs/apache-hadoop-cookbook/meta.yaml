  md: '# # Chapter 2


    # # How to Install Apache Hadoop on Ubuntu


    In this example, we will see the details of how to install Apache Hadoop on an
    Ubuntu system.

    We will go through all the required steps starting with the required pre-requisites
    of Apache Hadoop followed by configure Hadoop and we finish this example by learning
    how to insert data into Hadoop and how to run an example job on that data.


    # ## 2.1 Introduction


    The example will describe all the required steps for installing a single-node
    Apache Hadoop cluster on Ubuntu 15.10. Hadoop is a framework for distributed processing
    of application on large clusters of commodity hardware. It is written in Java
    and follows the MapReduce computing paradigm.


    # ## 2.2 Prerequisites


    Following are the prerequisites of running Apache Hadoop on Ubuntu. Follow the
    steps to get all the prerequisites in place.


    # ### 2.2.1 Installing Java


    As Apache Hadoop is written in Java, it needs latest Java to be installed in the
    system. To install Java, first of all update the source list


    ```

    # Update the source list

    sudo apt-get update

    ```


    It should update all the existing packages as shown in the screenshot below.'
