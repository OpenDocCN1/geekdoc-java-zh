    \n图 4.11: 虚拟机中的 hosts 文件\n\n重启所有机器\n\n## 4.5 Hadoop 预备设置\n\n按照 Hadoop 设置的预备设置进行操作。请记住，所有设置都需要添加到集群的机器上完成（在本例中为加入\
    \ cluster2 的机器）。\n\n### 4.5.1 创建用户\n\n在所有机器上创建 hadoop 用户。为此，请打开终端并输入以下命令：\n\n\
    ```bash\n# 创建用户组 hadoop \nsudo addgroup hadoop\n\n# 创建用户 hduser 并将其加入 hadoop 用户组\n\
    sudo adduser --ingroup hadoop hduser\n```\n\n### 4.5.2 禁用 ipv6\n\n下一步是在所有机器上禁用\
    \ ipv6。Hadoop 设置为使用 ipv4，这就是为什么我们要在创建 Hadoop 集群之前需要禁用 ipv6。请以 root 身份使用 nano 打开\
    \ /etc/sysctl.conf：\n\n```bash\nsudo nano /etc/sysctl.conf\n```\n\n并在文件末末尾添加以下几行。\n\
    \n```bash\n# 禁用 ipv6 的命令\nnet.ipv6.conf.all.disable-ipv6=1\nnet.ipv6.conf.default.disable-ipv6=1\n\
    net.ipv6.conf.lo.disable-ipv6=1\n```\n\n之后，使用以下命令检查 ipv6 是否已正确禁用：\n\n```bash\n\
    cat /proc/sys/net/ipv6/conf/all/disable-ipv6\n```\n\n输出将返回 0，而我们希望返回 1，因为它代表 ipv6\
    \ 已经禁用。\n\n### 4.5.3 连接机器 (SSH 访问)\n\n现在，我们必须确保机器能够通过静态 IP 地址和 SSH 通过网络互相访问。在本例中，我们将\
    \ hadoop1 机器视为主节点，将 hadoop1 和 hadoop2 都视为从节点。因此，我们需要确保：\n\nhadoop1(master) 能够通过以下命令连接自己：\n\
    \n```bash\nssh hadoop1\n```\n\n它能够连接到其他虚拟机：\n\n```bash\nssh hduser@hadoop2\n```\n\
    \n为了实现这一点，我们必须在每台机器上生成 SSH 密钥。登录 hadoop1 并在终端中执行下面提到的步骤：\n\n切换到用户 hduser 并生成 SSH\
    \ 公钥：\n\n```bash\n# 切换到用户 hduser\nsu - hduser\n```\n\n```bash\n# 生成 ssh 密钥\nssh-keygen\
    \ -t rsa -P \"\"\n```\n\n![](img/ac80ba15da75cccb79369ea5d652b025_70_0.png)\n\n\
    图 4.12: SSH 密钥生成\n\n第二个命令将为机器创建一个 RSA 密钥对。该密钥的密码将如命令所示。它会提示存储密钥的路径，默认路径为 $HOME/.ssh/id-rsa.pub，在提示时直接按回车以保持相同路径。如果你计划更改路径，请记住它，因为它将在下一步中用到。\n\
    \n使用上一步创建的密钥启用对机器的 SSH 访问。为此，我们需要将密钥添加到机器的 authorized_keys 列表中。\n\n```bash\ncat\
