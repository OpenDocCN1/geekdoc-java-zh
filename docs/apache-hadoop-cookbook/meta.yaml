  - "[PAGE 119]\n\n# 9.3 Hadoop Streaming\n\nFor using Hadoop Streaming, both the\
    \ mapper and reducer need to be executables and should be able to read input from\
    \ stdin by line and emit the output to stdout\n\nHadoop Streaming API will create\
    \ and submit a MapReduce job from the executables for Mapper and Reducers. Initialization\
    \ of each Map or Reduce task, a new process will be started with the corresponding\
    \ executable.\n\nFor each input data, the mapper task takes the input-line and\
    \ feed the lines to the stdin of the mapper. After execution, the lines from stdout\
    \ are taken and converted to key-value pair which will be the output of the mapper\
    \ task and will be passed to the reducer task.\n\nIn similar fashion, reducer\
    \ takes the key-value pair and convert it into lines and feed the reducer using\
    \ stdin. After reducer is executed, it again takes the line from stdout and convert\
    \ it into the key-value pair to be passed as the final result.\n\n**Note:** By\
    \ default, the lines in the upto first will be taken as the key and the rest of\
    \ the line as the value. In case, there is no character present in the line, the\
    \ whole line will be the key and value will be null. But this behavior is not\
    \ noting and can be changed is required and the required behavior can be configured.\n\
    \n# 9.4 MapReduce Code in Python\n\nAs discussed in the section below, we use\
    \ Hadoop Streaming API to run Python Code on Hadoop. We will use sys.stdin and\
    \ sys.stdout in Python to read the data and write out the output data, everything\
