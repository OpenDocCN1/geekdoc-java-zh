    Now, let''s edit this zoo.cfg file. In this example, we used the nano editor but
    you can use whichever editor you like to.


    ```

    nano zoo.cfg

    ```


    Make sure the file looks like what is in the screenshot below and contain the
    following settings:


    ```

    tickTime = 2000

    initLimit=10

    syncLimit=5

    dataDir=/var/lib/zookeeper

    clientPort=2181

