    ssh hadoop1\n```\n\n这会将 hadoop1 连接到自身，如果成功，退出连接并尝试连接到 hadoop2 机器：\n```bash\nssh\
    \ hduser@hadoop2\n```\n\n这应该也能成功连接。\n\n## 4.6 Hadoop 安装\n\n现在，我们处于已完成所有初始设置的步骤，现在准备好在集群上安装\
    \ Hadoop 了。\n\n### 4.6.1 下载 Hadoop\n\n从 Apache 镜像站点下载 Hadoop：www.apache.org/dist/dyn/closer.cgi/hadoop/core\n\
    \n下载完成后，解压 hadoop 文件夹并移动到 /usr/local/hadoop，最后将文件夹的所有者更改为 haduser 和 hadoop 组。\n\
    \n```bash\n# 切换到目录\ncd /usr/local\n\n# 将 hadoop 文件移动到目录\nsudo mv /home/hadoop1/downloads/hadoop-2.7.1\
    \ /usr/local\n\n# 将权限更改为 haduser:hadoop\nsudo chmod -R haduser:hadoop /usr/local\n\
    ```\n\n![](img/ac80ba15da75cccb79369ea5d652b025_71_0.png)\n\n图 4.13: 检查权限的文件夹设置\n\
    \n### 4.6.2 更新 bashrc\n\n更新 haduser 的 bashrc 文件。\n\n```bash\nsu - haduser\nnano\
    \ $HOME/.bashrc\n```\n\n在文件末尾添加以下几行。\n\n```bash\nexport HADOOP_HOME=/usr/local/hadoop\n\
    export JAVA_HOME=/usr/lib/jvm/java-8-openjdk\n# 方便别名\nalias fs='hadoop fs' 2>/dev/null\n\
    alias ls='hadoop fs -ls' 2>/dev/null\nexport PATH=$PATH:$HADOOP_HOME/bin\n```\n\
    \n![](img/ac80ba80ba1575cccb79369ea5d652b025_72_0.png)\n\n图 4.14: 更新 haduser 的\
    \ bashrc\n\n### 4.6.3 配置 Hadoop\n\n现在是配置 Hadoop 安装的时间了。以下是需要遵循的步骤：这需要通过打开 /usr/local/hadoop/etc/hadoop/\
    \ 中的 hadoop-env.sh 并按如下设置 JAVA_HOME 变量：\n\n```bash\nexport JAVA_HOME=/usr/lib/jvm/java-8-openjdk\n\
    ```\n\n接下来，我们将配置 /usr/local/hadoop/etc/hadoop/ 文件夹中的 core-site.xml 并添加以下属性：\n\n\
    ```xml\n<configuration>\n  <property>\n    <name>fs.defaultFS</name>\n    <value>hdfs://hadoop1:8020</value>\n\
    \  </property>\n</configuration>\n```\n\n这在所有机器上都需要编辑，因为值应该只指向主节点（在本例中为 hadoop1）。因此，两台机器都需要添加相同的属性和值。\n\
    \n接下来，我们需要更新所有主节点和从节点上的 hdfs-site.xml：\n\n```xml\n<configuration>\n  <property>\n\
    \    <name>dfs.replication</name>\n    <value>2</value>\n  </property>\n  <property>\n\
    \    <name>dfs.namenode.name.dir</name>\n    <value>/usr/local/hadoop/hdfs/namenode</value>\n\
    \  </property>\n  <property>\n    <name>dfs.datanode.data.dir</name>\n    <value>/usr/local/hadoop/hdfs/datanode</value>\n\
    \  </property>\n</configuration>\n```\n\n现在，我们将更新 mapred-site.xml 文件。该文件**仅在主节点上**编辑：\n\
    \n```xml\n<configuration>\n  <property>\n    <name>mapreduce.jobtracker.address</name>\n\
    \    <value>hadoop1:84311</value>\n  </property>\n</configuration>\n```\n\n最后一个配置位于\
    \ /usr/local/hadoop/etc/hadoop 文件夹下的 slaves 文件中。添加从节点的主名或 IP 地址：\n\n```\nhadoop1\n\
    hadoop2\n```\n\n由于 hadoop1 同时担任主从节点，我们将添加主机名。\n\n### 4.6.4 格式化 Namenode\n\n我们现在完成了所有配置，在启动集群之前需要格式化\
    \ namenode。在 hadoop1 终端执行以下命令：\n\n```bash\nhdfs namenode -format\n```\n\n### 4.6.5\
    \ 启动分布式系统\n\n现在是启动分布式系统并运行集群的时间。以下是执行命令：\n\n```bash\n/usr/local/hadoop/sbin/start-dfs.sh\n\
    ```\n\n一旦 dfs 启动且没有报错，我们可以在主节点上的 https://localhost:50070 浏览 web 界面\n\n![](img/ac80ba15da75cccb79369ea5d652b025_74_0.png)\n\
