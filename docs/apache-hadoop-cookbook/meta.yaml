    # Chapter 6


    # Distributed File System Explained


    In this example, we will discuss Apache Hadoop Distributed File System(HDFS),
    its components and the architecture in detail. HDFS is one of the core components
    of Apache Hadoop ecosystem also.


    # 6.1 Introduction


    Apache Hadoop provides a distributed filesystem and a framework for the transformation
    of large data sets using the MapReduce paradigm. HDFS is designed to store very
    large data sets reliably while running on commodity hardware. It is fault-tolerant
    and provides high throughput access to the data stored. The interface of HDFS
    is patterned after the Unix filesystem, but it relaxes a few POSIX requirements
    to improve the performance of the application it targets to address and provide
    streaming access to the data stored in the file system.


    # 6.2 HDFS Design


    Following are the properties of HDFS which makes it different from other file
    systems and what make HDFS capable of handling large amount of data reliably.


    # 6.2.1 System failures


    HDFS is designed to work on a set of commodity hardware. System failures are considered
    a norm. As there are a large number of components on which HDFS relies on, considering
    these components have a non-trivial probability of failure will also result in
    one component or the other failing all time. So HDFS is designed to detect the
    failures and perform automatic recovery in order to provide required performance
    is one of the core properties of HDFS.


    # 6.2.2 Can handle large amount of data


    HDFS is designed to be used with applications that depend on a large amount of
    data. This data can be in gigabytes, terabytes or petabytes also. So HDFS is tuned
    to support such large data sets and scale to a large cluster of systems to store
    this data without compromising the data throughput.


    # 6.2.3 Coherency Model


    HDFS is tuned to address the applications which require to write data once or
    at maximum only a few times and read the data lot more. As these applications
    are assumed to rely on "write once read many times" model, it simplifies the data
    coherency issues and allow HDFS to provide high throughput data access.'
- md: "\n## 6.2.4 Portability\n\nHDFS is designed to be portable across heterogeneous\
    \ hardware and software platforms. Which makes the adaptation of HDFS very easy\
    \ and it became the platform of choice for the application dependent on distributed\
    \ large set of data.\n\n## 6.3 HDFS Nodes\n\nThere are two main components of\
    \ HDFS: NameNode and DataNode.\n\n### 6.3.1 NameNode\n\nHDFS follows a master-slave\
    \ architecture in which NameNode acts as the master node. One HDFS cluster consists\
    \ of only one NameNode. The main functionality of NameNode is to manage the file\
    \ system namespace and control the client authentication to the files stored in\
    \ the HDFS cluster. It also handles the mapping of the data stored in different\
    \ DataNodes.\n\n### 6.3.2 DataNode\n\nDataNode are the nodes which the nameNode\
    \ stores the actual data in the cluster. There are multiple DataNodes in the cluster,\
    \ usually the number of DataNodes is same as the hardware nodes in the cluster.\
    \ DataNode serve to read and write requests from the clients and also handles\
    \ operation related to blocks of data like creation of blocks, deletion and replication\
    \ of blocks.\n\n## 6.4 HDFS Architecture\n\nIn this section we will understand\
    \ the basic architecture of Hadoop Distributed File System (HDFS).\n\n### 6.4.1\
    \ Working of NameNode and DataNode\n\nHDFS is a block-structured file system,\
    \ that means all the individual files are divided into small blocks of data having\
    \ a fixed size. These blocks are then stored across the cluster of machines in\
    \ the DataNodes. The NameNode handles the functions like opening, closing and\
    \ renaming directories. NameNode as mentioned also handles the mapping of the\
    \ data in the cluster that NameNode keeps track of which block of data is stored\
    \ on which DataNode and how the replication of this is handled.\n\n### 6.4.2 HDFS\
    \ Namespace\n\nHDFS defines how the data is stored and accessed in the cluster.\
    \ HDFS supports the traditional hierarchical organization of the files. It also\
    \ supports almost all the functions to handle the namespaces operation like creation\
    \ or removal of files or directories, moving files/Directories from one place\
    \ to another else.\n\nAs discussed in section 3, NameNode is the component that\
    \ maintains the HDFS file system namespace. Any operation on the data like creation\
    \ or deletion of files, displacement of files or directories are maintained in\
    \ the NameNode.\n\n### 6.4.3 Data Replication\n\nAs HDFS is designed to store\
    \ large amount of data reliably and securely on set of commodity hardware. As\
    \ this hardware is prone to failure, HDFS needs to handle the data in a way that\
    \ it can be retrieved easily in the event hardware failure of one or more systems.\
    \ HDFS uses data replication as the strategy to provide fault-tolerance feature.\
    \ The application using the HDFS can configure the replication factor as well\
    \ as the block size of data as per the requirement.\n\nNow the question arises\
    \ when replication is decided, what if all the replicas are in a single rack in\
    \ the cluster and the whole rack fails. HDFS tries to maintain the rack aware\
    \ replication strategy which needs a lot of tuning and experience. A simple but\
    \ non-optimal policy is to place each replica of the block on a unique rack so\
    \ that in case of a rack fails, at least one replica is safe in after.\n\nIn most\
    \ of the production systems replication factor of three is used. In those cases,\
    \ HDFS uses a slight version of unique rack policy. It usually places one replica\
    \ on the local rack, or a node on a completely different rack and the third on\
    \ one different node on the remote rack. This improves the speed by cutting the\
    \ inter-rack transfer time while writing on two different racks instead of three.\
    \ This provides us backup in case of node failures and also in case of rack failures.\
    \ This policy improves the write performance without compromising data reliability.\n\
    \n### 6.4.4 Failures\n\nThe main objective and goal of Hadoop Distributed File\
    \ System (HDFS) is to access data reliably even in case of failures. As failures\
    \ are more norm in the commodity hardware cluster than an exception, HDFS needs\
    \ a strategy to handle the failures. The three types of failures are:\n\n- NameNode\
    \ failure\n- DataNode failure\n- Network partitions\n\nEach and every DataNode\
    \ in the cluster sends a periodic message to NameNode, this message is called\
    \ heartbeat. This heartbeat comes to NameNode that the particular DataNode is\
    \ working and is live. Now in case of DataNode failures, there will be no heartbeat\
    \ or network partition also a subset of DataNodes may lose connection to the NameNode\
    \ and stops heartbeats. The NameNode stop getting heartbeats from a particular\
    \ DataNode or a set of DataNodes, it declares the nodes to be dead and then start\
    \ the procedure to check the damage which include checking if all the blocks which\
    \ are in deadNodes still have the sufficient number of replicas, or if not it\
    \ starts the process to create-replicas to attain the minimum number of replicas\
    \ configured in the application.\n\nThe NameNode failures are more serious as\
    \ NameNode is the only single point of failure for the complete HDFS cluster.\
    \ If the NameNode system fails, the whole cluster is useless and it needs a manual\
    \ intervention and another NameNode need to be setup.\n\n### 6.4.5 Data Accessibility\n\
    \nNow in order to allow applications to access the data stored in HDFS cluster,\
    \ it provides a Java API for applications to use. A C wrapper is also provided\
    \ over the Java API if C language is needed to be.\n\nBesides Java and C API,\
    \ HDFS also provides an option to access the HDFS data through web over the TCP\
    \ port which can be configured in settings of HDFS.\n\nThird accessibility option\
    \ is to use the file system. HDFS also provides a command line interface FS Shell\
    \ that let user interact with the data in HDFS. The syntax for this command line\
    \ interface is similar to the Linux shell commands. For example:\n\n```bash\n\
    # To make a new directory\nhadoop fs -mkdir /user/project1\n```\n\n```bash\n#\
    \ List the content of the file\nhadoop fs -ls /user/project1\n```\n\n```bash\n\
    # Upload a file from local system to HDFS\nhadoop fs -put Desktop/textfield.txt\
    \ /user/project1\n```\n\nFor more examples and explanation of the FS Shell commands,\
    \ you can check the Apache Hadoop FS Commands Example\n\n## 6.5 Configuring HDFS\n\
    \nConfiguration of HDFS is very easy and it does not take much time to set up\
    \ HDFS cluster. All the configuration files for HDFS are by default in the Hadoop\
    \ package and can be directly configured.\n\nNote: We assume that the Hadoop package\
    \ is already downloaded, unzipped and placed in the desired directory. In this\
    \ article, we will discuss the required configurations for HDFS. For detailed\
    \ articles on how to setup Hadoop and Hadoop cluster. Follows the tutorials:\n\
    \n- How Install Apache Hadoop on Ubuntu\n- Apache Hadoop Cluster Setup Example(with\
    \ Virtual Machines)\n\n### 6.5.1 Configuring HDFS\n\nThe HDFS is configured using\
    \ the set of XML files which are by default in the Hadoop configuration directory.\
    \ This configuration directory is present in the root of the Hadoop folder and\
    \ is named conf.\n\nFirst of all, we will modify the file conf/hadoop-sites.xml\
    \ and we need to setup three properties in this file i.e. fs.default.name, dfs.data.dir,\
    \ dfs.name\n\nTo modify the file in the editor and add the following lines of\
    \ code:\n\n```xml\n<configuration>\n  <property>\n    <name>dfs.replication</name>\n\
    \    <value>2</value>\n  </property>\n  <property>\n    <name>dfs.namenode.dir</name>\n\
    \    <value>/usr/local/hadoop/hdfs/namenode</value>\n  </property>\n  <property>\n\
    \    <name>dfs.datanode.dir</name>\n    <value>/usr/local/hadoop/hdfs/datanode</value>\n\
    \  </property>\n</configuration>\n```\n\nFirst we use here dfs.replication which\
    \ sets the replication factor to be used by the distributed file system. In this\
    \ case we have set it up to two.\n\nThe next configuration is to define the NameNode\
    \ path i.e. dfs.namenode.dir and the value here need to be the directory to store\
    \ the namenode information.\n\nThe third and the last configuration we need to\
    \ set up defining the path for the DataNode i.e. dfs.datanode.data.dir which will\
    \ define the path to the directory to store the datanode information.\n"
  mdcn: "\n\n## 6.2.4 可移植性\n\nHDFS 设计为可以在异构的硬件和软件平台之间进行移植。这使得 HDFS 的适配变得非常容易，使其成为依赖大规模数据集应用程序的首选平台。\n\
    \n## 6.3 HDFS 节点\n\nHDFS 包含两个主要组件：NameNode 和 DataNode。\n\n### 6.3.1 NameNode\n\
    \nHDFS 采用主从架构，其中 NameNode 作为主节点。一个 HDFS 集群仅包含一个 NameNode。NameNode 的主要功能是管理文件系统命名空间并控制对存储在\
    \ HDFS 集群中的文件的认证。它还处理存储在不同 DataNode 中的数据映射。\n\n### 6.3.2 DataNode\n\nDataNode\
    \ 是 NameNode 在集群中存储实际数据的节点。集群中有多个 DataNode，通常 DataNode 的数量与集群中的硬件节点数量相同。DataNode\
    \ 用于处理来自客户端的读写请求，并处理与数据块的操作，如块的创建、删除和复制。\n\n## 6.4 HDFS 架构\n\n在本节中，我们将理解 Hadoop\
    \ 分布式文件系统 (HDFS) 的基本架构。\n\n### 6.4.1 NameNode 和 DataNode 的工作\n\nHDFS 是一个块结构文件系统，这意味着所有单独的文件都被划分为固定大小的小数据块。这些块随后被存储在\
    \ DataNode 的机器集群中。NameNode 处理打开、关闭和重命名目录等功能。如前所述，NameNode 还处理集群中的数据映射，即 NameNode\
    \ 跟踪哪个数据块存储在哪个 DataNode 上，以及如何处理这些块的复制。\n\n### 6.4.2 HDFS 命名空间\n\nHDFS 定义了数据在集群中的存储和访问方式。HDFS\
    \ 支持传统的层级文件结构。它还支持几乎所有处理命名空间的操作，如创建或删除文件或目录，将文件/目录从一个地方移动到另一个地方等。\n\n正如第3节讨论的，NameNode\
    \ 是维护 HDFS 文件系统命名空间的组件。数据的任何操作，如文件的创建或删除、文件或目录的移动都在 NameNode 中维护。\n\n### 6.4.3\
    \ 数据复制\n\nHDFS 设计初衷是在一组通用硬件上可靠且安全地存储大量数据。由于这些硬件容易发生故障，HDFS 需要以特定的方式处理数据，以便在一个多个系统发生硬件故障时能够轻松检索。HDFS\
    \ 使用数据复制作为策略来提供容错功能。使用 HDFS 的应用程序可以根据需求配置复制因子以及数据块大小。\n\n现在问题出现了：当决定复制时，如果所有副本都在集群的同一个机架（rack）中且整个机架发生故障了怎么办？HDFS\
    \ 尝试维护机架感知（rack aware）复制策略，这需要大量的调优和经验。一种简单但非最优的策略是将块的每个副本放置在唯一的机架上，以便在某个机架发生故障时，至少有一个副本是安全的。\n\
    \n在大多数生产系统中，复制因子取值为3。在这些情况下，HDFS 使用了轻量版的唯一机架策略。它通常将一个副本放置在本地机架上，一个放置在完全不同机架的节点上，并将第三个放置在远程机架的另一个不同节点上。通过在两个不同机架上写入而不是三个，减少了跨机架传输时间，从而提高了速度。这为我们在节点故障和机架故障时提供了备份。该策略在不损害数据可靠性的前提下提高了了写入性能。\n\
    \n### 6.4.4 故障\n\nHadoop 分布式文件系统 (HDFS) 的主要目标和目的是即使在故障情况下也能可靠地访问数据。由于在通用硬件集群中故障是常态而非异常，HDFS\
    \ 需要一种策略来处理故障。三种类型的故障是：\n\n- NameNode 故障\n- DataNode 故障\n- 网络分区\n\n集群中的每一个 DataNode\
    \ 都会向 NameNode 发送定期消息，此消息称为心跳（heartbeat）。该心跳告诉 NameNode 该特定的 DataNode 正在工作且处于活动状态。现在在\
    \ DataNode 故障的情况下，将没有心跳，或者网络分区导致部分 DataNode 可能会丢失与 NameNode 的连接并停止心跳。NameNode\
    \ 停止接收来自特定 DataNode 或一组 DataNode 的心跳，它会将这些节点声明为死亡，然后启动检查损坏的程序，包括检查死亡节点中的所有块是否仍具有足够的副本数量，如果没有，它将开始创建副本以达到应用程序中配置的最小副本数。\n\
    \nNameNode 故障更为严重，因为 NameNode 是整个 HDFS 集群的唯一单点故障。如果 NameNode 系统故障，整个集群将变得毫无用处，并且需要人工干预并设置另一个\
    \ NameNode。\n\n### 6.4.5 数据访问性\n\n现在为了允许应用程序访问存储在 HDFS 集群中的数据，它为应用程序提供了一个 Java\
    \ API 使用。如果需要 C 语言，还在 Java API 之上提供了 C 封装。\n\n除了 Java 和 C API，HDFS 还提供了通过 TCP\
    \ 端口通过 Web 访问 HDFS 数据的选项，这可以在 HDFS 的设置中配置。\n\n第三种访问选项是使用文件系统。HDFS 还提供了一个命令行界面\
    \ FS Shell，允许用户与 HDFS 中的数据进行交互。该命令行界面的语法类似于 Linux shell 命令。例如：\n\n```bash\n# 创建新目录\n\
    hadoop fs -mkdir /user/project1\n```\n\n```bash\n# 列出文件内容\nhadoop fs -ls /user/project1\n\
    ```\n\n```bash\n# 将文件从本地系统上传到 HDFS\nhadoop fs -put Desktop/textfield.txt /user/project1\n\
    ```\n\n如需更多 FS Shell 命令的示例和说明，可以查看 Apache Hadoop FS Commands Example。\n\n## 6.5\
    \ 配置 HDFS\n\nHDFS 的配置非常简单，设置 HDFS 集群并不花费大量时间。HDFS 的所有配置文件默认都在 Hadoop 软件包中，可以直接进行配置。\n\
    \n注意：我们假设 Hadoop 软件包已经下载、解压并放置在指定的目录中。本文中，我们将讨论 HDFS所需的配置。关于如何设置 Hadoop 和 Hadoop\
    \ 集群的详细文章，请遵循教程：\n\n- 如何在 Ubuntu 上安装 Apache Hadoop\n- Apache Hadoop 集群设置示例（使用虚拟机）\n\
    \n### 6.5.1 配置 HDFS\n\nHDFS 使用一组 XML 文件进行配置，这些文件默认位于 Hadoop 的配置目录。该配置目录位于 Hadoop\
    \ 文件夹的根目录下，命名为 conf。\n\n首先，我们将修改 `conf/hadoop-sites.xml` 文件，我们需要在该文件中设置三个属性，即\
    \ `fs.default.name`、`dfs.data.dir` 和 `dfs.name`。\n\n在编辑器中修改文件并添加以下代码行：\n\n```xml\n\
    <configuration>\n  <property>\n    <name>dfs.replication</name>\n    <value>2</value>\n\
    \  </property>\n  <property>\n    <name>dfs.namenode.dir</name>\n    <value>/usr/local/hadoop/hdfs/namenode</value>\n\
    \  </property>\n  <property>\n    <name>dfs.datanode.dir</name>\n    <value>/usr/local/hadoop/hdfs/datanode</value>\n\
    \  </property>\n</configuration>\n```\n\n首先我们在这里使用了 `dfs.replication`，它设置了分布式文件系统使用的复制因子。在本例中，我们将其设置为2。\n\
    \n下一个配置是定义 NameNode 路径，即 `dfs.namenode.dir`，此处的值应该是存储 namenode 信息的目录。\n\n第三个也是最后一个我们需要设置的配置是定义\
    \ DataNode 的路径，即 `dfs.datanode.data.dir`，它将定义存储 datanode 信息的目录路径。\n\n"
