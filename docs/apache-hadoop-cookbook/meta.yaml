    \ fs -get /user/root/dir/testfile.txt Downloads/\n[cloudera@quickstart ~]$ ls\
    \ Downloads/\ntestfile.txt\n[cloudera@quickstart ~]$ \n```\n\n图 6.6：从 Hadoop FS\
    \ 下载文件\n\n注意：有关文件系统命令的详情以及其他重要命令的示例，请参考 Apache Hadoop FS 命令示例，或者您可以在 Apache Hadoop\
    \ 网站的文档中查看 shell 命令的完整文档：文件系统命令和 HDFS 命令指南\n\n## 6.7 使用 MapReduce 与 HDFS 交互\n\n\
    正如我们讨论的，HDFS 是 Hadoop 的组件，MapReduce 也是一个组件。在本节中，我们将看到如何使用 MapReduce 与 HDFS 交互。我们将看到如何使用\
    \ MapReduce作业从 HDFS 读取数据并写回 HDFS。\n\n```java\npackage hdfs.examples;\n\nimport\
    \ org.apache.hadoop.conf.Configuration;\nimport org.apache.hadoop.fs.FileSystem;\n\
    import org.apache.hadoop.fs.FSDataInputStream;\nimport org.apache.hadoop.fs.FSDataOutputStream;\n\
    import org.apache.hadoop.fs.Path;\nimport java.io.IOException;\n\npublic class\
    \ App {\n    public static final String filename = \"dummy.txt\";\n    public\
    \ static final String message = \"This is the dummy text\";\n\n    public static\
    \ void main(String[] args) throws IOException {\n        //获取文件系统\n        Configuration\
    \ configuration = new Configuration();\n        FileSystem fs = FileSystem.get(configuration);\n\
    \n        Path filePath = new Path(filename);\n\n        try {\n            if(fs.exists(filePath))\
    \ {\n                // 删除示例\n                fs.delete(filePath, true);\n   \
    \         }\n\n            // 写入示例\n            FSDataOutputStream out = fs.create(filePath);\n\
    \            out.writeUTF(message);\n            out.close();\n\n            //\
    \ 读取示例\n            FSDataInputStream in = fs.open(filePath);\n            String\
    \ messageIn = in.readUTF();\n            System.out.println(messageIn);\n    \
    \        in.close();\n\n            // 重命名文件\n            if(fs.exists(filePath))\
    \ {\n                Path renamedFilePath = new Path(\"renamed\" + filename);\n\
    \                fs.rename(filePath, renamedFilePath);\n            }\n      \
    \  } catch (IOException ex) {\n            System.out.println(\"Error: \" + ex.getMessage());\n\
    \        }\n    }\n}\n```\n\n这段代码创建了一个文件 dummy.txt，并向该文件写入了虚拟消息。\n\n- 第 24-25\
    \ 行使用 Configuration 对象创建了一个抽象的 FileSystem 对象。在这种情况下，Configuration 对象使用了默认参数，而我们没有定义任何自定义参数。\n\
    - 第 30-33 行检查 HDFS 中是否存在该文件，如果存在，则删除该文件。此示例介绍了处理文件系统的两个方法：`exists()` 和 `delete()`。\n\
    - 第 35-38 行通过向文件写入虚拟消息，将文件写入指定路径的 HDFS 中。这引入了另一个关于如何在 HDFS 中写入文件的方法。\n- 第 40-44\
    \ 行读取我们上一段代码中写入的文件，并将文件内容输出到控制台上。此代码示例并没有提供实际用途，它只是为了让读者了解如何使用 Java API 在 HDFS\
    \ 中进行读写。\n- 第 47-50 行检查 HDFS 中是否存在该文件，如果存在，则将文件 dummy.txt 重命名为 renamed_dummy.txt。\n\
    \n## 6.8 结论\n\n我们进入了文章的结论。我们讨论了 Hadoop 分布式文件系统 (HDFS) 的基础，从设计开始，接着是对 HDFS 架构的理解。然后我们看到了如何配置和启动\
    \ HDFS 节点，最后讨论了如何使用 shell 命令行和 HDFS Java API 与运行中的 HDFS 集群交互。希望这能对 HDFS 及其构建模块提供基础解释。\n\
    \n## 6.9 下载代码\n\n下载包含此示例中用于 HDFS Java API 代码的 Eclipse 项目。\n\n**下载** 您可以下载此示例的完整源代码：HDFSJavaApi\n\
    \n"
