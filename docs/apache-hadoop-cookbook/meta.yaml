    # 10.5 Conclusion


    This brings us to the conclusion of this introductory example for Apache Zookeeper.
    In this example, we started with the introduction and the general architecture
    of Zookeeper followed by learning how to setup Zookeeper in a single machine.
    We also saw that using Zookeeper CLI to interface with the Zookeeper Service is
    also easy and command for all the basic interactions.


