  md: "# 7.3.3 Reduce Class\n\nReduce class in this article is exactly same as it\
    \ is in the standard word count example, the reduce() method will contain only\
    \ those whose are not stop words and reduce will count only the words. Following\
    \ is the code of the reduce class:\n\n```\npackage com.javacodgeeks.examples.distributedcache;\n\
    \nimport java.io.IOException;\nimport java.util.Iterator;\n\nimport org.apache.hadoop.io.IntWritable;\n\
    import org.apache.hadoop.io.Text;\nimport org.apache.hadoop.mapreduce.Reducer;\n\
    \n/**\n * Reduce class which is executed after the map class and takes\n * key(word)\
    \ and corresponding values, sum all the values and write the\n * word along the\
    \ corresponding total occurances in the output\n */\npublic class ReduceClass\
    \ extends Reducer {\n\n    /**\n     * Method which performs the reduce operation\
    \ and sums\n     * all the occurrences of the word before passing it to be stored\
    \ in output\n     */\n    @Override\n    protected void reduce(Text key, Iterable\
    \ values,\n        Context context)\n        throws IOException, InterruptedException\
    \ {\n\n        int sum = 0;\n        Iterator valuesIt = values.iterator();\n\n\
    \        while (valuesIt.hasNext()) {\n            sum = sum + valuesIt.next().get();\n\
    \        }\n\n        context.write(key, new IntWritable(sum));\n    }\n}\n```\n\
    \n# 7.4 Executing the Hadoop Job\n\nWe will execute the MapReduce task we discussed\
    \ in the previous section on the Hadoop cluster. But before we do, we need two\
    \ files\n\n+   * Input file\n* Stop Words file"
