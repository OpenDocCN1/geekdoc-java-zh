    # 2.2.2 Creating a Dedicated User


    Hadoop needs a separate user for execution. With a complete control over the Hadoop
    executables and data folders. To create a new user, use the following command
    in the terminal.


    ```

    #create user group for hadoop

    sudo addgroup hadoop


    #create user hduser and add it to the hadoop usergroup

    sudo adduser --ingroup hadoop hduser

    ```


    The first command creates a new group with the name "hadoop" and the second command
    creates a new user "hduser" and assigns it to the "hadoop" group. We have kept
    all the user data like "First Name", "Phone Number" etc empty. You can keep it
    empty or assign values to the account as per your choice.'
