    \ example.\n\n**Download** You can download the full source code of this example:\
    \ HadoopWordCount\n\n## Chapter 9\n\n## Streaming Example\n\nIn this example,\
    \ we will dive into the streaming component of Hadoop MapReduce. We will understand\
    \ the basics of Hadoop Streaming and see an example using Python.\n\n## 9.1 Introduction\n\
    \nHadoop Streaming is the name which is quite misleading, re-streaming has nothing\
    \ to do with the continuous data streams or continuous data flow as it is understood\
    \ generally. Hadoop Streaming is just a utility provided by the Hadoop MapReduce\
    \ distribution which gives users the possibility to write MapReduce jobs in other\
    \ programming languages like Python or Cpp which can make use of `stdin` and `stdout`\
    \ to read and write lines of text data. Support for Cpp is available since version\
    \ 0.14.1\n\nWhen we talk about other programming languages, we do not mean that\
    \ the code written in those languages needs to be translated.\n\n## 9.2 Prerequisites\
    \ and Assumptions\n\nFollowing are the prerequisites:\n\n- You should be familiar\
    \ with the basics of MapReduce.\n- You should understand how to run on Hadoop\
    \ cluster.\n- You should know how to use HDFS for the input files.\n\nIn case\
    \ you need help with that, you can refer to the following articles:\n- How to\
    \ Install Apache Hadoop on Ubuntu\n- Apache Hadoop Cluster Setup Example(with\
    \ Virtual Machines)\n- Apache Hadoop Distributed File System Explained\n- Hello\
    \ World Example\n\n## 9.3 Hadoop Streaming\n\nFor Hadoop Streaming, both mapper\
    \ and reducer need to be able to read from stdin and output to stdout.\n\n## 9.4\
    \ MapReduce Code in Python\n\nAs discussed in the section below, we use Hadoop\
    \ Streaming to run Python Code on Hadoop. We will use sys.stdin and sys.stdout\
    \ in Python to read the data and write out the output.\n\n### 9.4.1 Wordcount\
    \ Example\n\nWordcount, as you might be knowing the basic program which is used\
    \ to explain the basics of the Hadoop MapReduce framework. In wordcount program,\
    \ a bunch of input task is provided to the Mapper which splits the lines of text\
    \ into single words and pass these words as key-value pair to the Reducer functions.\
    \ Reducer received the input as the key-value pair and counts the number of instances\
    \ of a particular word in the provided text and output the key-value pairs with\
    \ key and the number of counts as value. If you are not familiar with basics of\
    \ wordcount program, please refer to the Apache Hadoop Wordcount Example. In this\
    \ article we will implement the same wordcount example instead of Java we will\
    \ use Python and run using Hadoop Streaming.\n\n### 9.4.2 Mapper\n\nThe Mapper\
    \ function in Python will read the line from stdin, split the line in the individual\
    \ words and output the word as key-value pair with 1 and word as the key. For\
    \ example, <word, 1>\n\n```python\n#!/usr/bin/env python\n\nimport sys\n\n# read\
    \ the input from stdin\nfor line in sys.stdin:\n    # trim any leading and trailing\
    \ spaces\n    line = line.strip()\n\n    # split the line into individual words\n\
    \    words = line.split()\n\n    # for each word in words, output key-value pair\n\
    \    for word in words:\n        # outputs the result to stdout\n        print(f\"\
    {word}\\t1\")\n```\n"
