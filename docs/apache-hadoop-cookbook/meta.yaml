  md: "# # Chapter 9\n\n# # Streaming Example\n\nIn this example, we will dive into\
    \ the streaming component of Hadoop MapReduce. We will understand the basics of\
    \ Hadoop Streaming and see an example using Python.\n\n# ## 9.1 Introduction\n\
    \nHadoop Streaming is the name which is quite misleading, re streaming has nothing\
    \ to do with the continuous data streams or continuous data flow as it is understood\
    \ generally. Hadoop Streaming is just a utility provided by the Hadoop MapReduce\
    \ distribution which gives users the possibility to write MapReduce jobs in other\
    \ programming languages like Python or Cpp which can make use of `stdin` and `stdout`\
    \ to read and write lines of text data. Support for Cpp is available since version\
    \ 0.14.1\n\nWhen we talk about other programming languages, we do not mean that\
    \ the code written in those languages needs to be converted to the Java code.\
    \ For example, if the original code is in Python, it is not required that the\
    \ code be converted to Java using Jy or any similar utility. Direct Python code\
    \ can run in Hadoop ecosystem using Hadoop Streaming.\n\n# ## 9.2 Prerequisites\
    \ and Assumptions\n\nFollowing are the prerequisites/assumptions we have made\
    \ before diving into the details of Hadoop Streaming:\n\n+   - It is assumed that\
    \ you are familiar with Hadoop and MapReduce or least knows the basics of it.\
    \ In case you need some basic understanding of those you can refer to the following\
    \ articles.\n  - Hadoop Hello World Example\n  - Apache Hadoop Distributed File\
    \ System Explained\n  - Apache Hadoop Wordcount Example\n- It is also assumed\
    \ that you understand the basics of running and setting up a Hadoop Cluster or\
    \ atleast a single instance for testing purpose. In case you need help with that,\
    \ you can refer to the following articles.\n  - How to Install Apache Hadoop on\
    \ Ubuntu\n  - Apache Hadoop Cluster Setup Example (with Virtual Machines)\n\n\
    Once we have all these prerequisites set and clear, we can dive into the details\
    \ of Hadoop Streaming and check out some examples."
  merge: -1
  pgno: 118
- img_proc: true
  md: "# 9.3 Hadoop Streaming\n\nFor using Hadoop Streaming, both the mapper and reducer\
    \ need to be executables and should be able to read input from stdin by line and\
    \ emit the output to stdout\n\nHadoop Streaming API will create and submit a MapReduce\
    \ job from the executables for Mapper and Reducers. Initialization of each Map\
    \ or Reduce task, a new process will be started with the corresponding executable.\n\
    \nFor each input data, the mapper task takes the input-line and feed the lines\
    \ to the stdin of the mapper. After execution, the lines from stdout are taken\
    \ and converted to key-value pair which will be the output of the mapper task\
    \ and will be passed to the reducer task.\n\nIn similar fashion, reducer takes\
    \ the key-value pair and convert it into lines and feed the reducer using stdin.\
    \ After reducer is executed, it again takes the line from stdout and convert it\
    \ into the key-value pair to be passed as the final result.\n\n**Note:** By default,\
    \ the lines in the upto first will be taken as the key and the rest of the line\
    \ as the value. In case, there is no character present in the line, the whole\
    \ line will be the key and value will be null. But this behavior is not noting\
    \ and can be changed is required and the required behavior can be configured.\n\
    \n# 9.4 MapReduce Code in Python\n\nAs discussed in the section below, we use\
    \ Hadoop Streaming API to run Python Code on Hadoop. We will use sys.stdin and\
    \ sys.stdout in Python to read the data and write out the output data, everything\
    \ else will be handled by the Streaming API itself.\n\n# 9.4.1 Wordcount Example\n\
    \nWordcount, as you might be knowing the basic program which is used to explain\
    \ the basics of the Hadoop MapReduce framework. In wordcount program, a bunch\
    \ of input task is provided to the Mapper which splits the lines of text into\
    \ single words and pass these words as key-value pair to the Reducer functions.\
    \ Reducer received the input as the key-value pair and counts the number of instances\
    \ of a particular word in the provided text and output the key-value pairs with\
    \ key and the number of counts as value. If you are not familiar with basics of\
    \ wordcount program, please refer to the Apache Hadoop Wordcount Example for the\
    \ detailed explanation. In this article we will implement the same wordcount example\
    \ instead of Java we will use Python and run using Hadoop Streaming API\n\n# 9.4.2\
    \ Mapper\n\nThe Mapper function in Python will read the line from stdin, split\
    \ the line in the individual words and output the word as key-value pair with\
    \ 1 and word as the key. For example, <word, l>\n\n```\n#!/usr/bin/env python\n\
    \nimport sys\n\n# read the input from stdin\nfor line in sys.stdin:\n    # trim\
    \ any leading and trailing spaces\n    line = line.strip()\n\n    # split the\
    \ line into individual words\n    words = line.split()\n\n    # for each word\
    \ in words, output key-value pair\n    for word in words:\n        # outputs the\
    \ result to stdout\n        # MapReduce Streaming API will take this output\n\
    ```"
