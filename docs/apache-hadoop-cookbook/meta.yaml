  md: '# Chapter 8


    # Wordcount Example


    In this example, we will demonstrate the Word Count example in Hadoop. Word count
    is the basic example to understand the Hadoop MapReduce paradigm in which we count
    the number of instances of each word in an input file and gives the list of words
    and the number of instances of the particular word as an output.


    # 8.1 Introduction


    Hadoop is an Apache Software Foundation project which is the open source equivalent
    of Google MapReduce and Google File System. It is designed for distributed processing
    of large data sets across a cluster of systems running on commodity standard hardware.


    Hadoop is designed with an assumption that hardware failure is a norm rather than
    an exception. All hardware fails sooner or later and the system should be robust
    and capable enough to handle the hardware failures gracefully.


    # 8.2 MapReduce


    Apache Hadoop consists of two components, one being Hadoop Distributed File System(HDFS)
    and second is the Frame-work and APIs for MapReduce jobs.


    In this example, we are going to demonstrate the second component of Hadoop framework
    called MapReduce. If you are interested in understanding the basics of HDFS, the
    Apache Hadoop Distributed File System Explained may be of help. Before moving
    to the example of MapReduce processing, we should understand what MapReduce actually
    is.


    MapReduce is basically a software framework or programming paradigm, which enables
    users to write programs components so that data can be processed parallelly across
    multiple systems in a cluster. MapReduce consists of two parts Map and Reduce.


    +   - Map task is performed using a map() function that performs filtering and
    sorting. This task is responsible for processing one or more chunks of data and
    producing the output results which are generally referred as intermediate results.
    As shown in the diagram below, map task is generally processed in parallel provided
    the mapping operation is independent of each other.

    - Reduce: Reduce task is performed by reduce() function and performs a summary
    operation. It is responsible for consolidating the results produced by each of
    the Map task.


    # 8.3 Word-Count Example


    Word count program is the basic code which is used to understand the working of
    the MapReduce programming paradigm. The program consists of MapReduce job that
    counts the number of occurrences of each word in a file. This job consists of
    two parts'
