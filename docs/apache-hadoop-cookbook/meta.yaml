    # 4.5 Hadoop prerequisite settings


    Following the prerequisite settings for hadoop setup. Remember all the settings
    need to be done in all the machines which will be added to cluster2 machines in
    this example)


    # 4.5.1 Creating User


    Create hadoop users in all the machines. For that open the terminal and enter
    the following commands:


    ```

    #create a user group hadoop

    sudo addgroup hadoop


    #create user hduser and add it to the hadoop usergroup

    sudo adduser --ingroup hadoop hduser

    ```


    # 4.5.2 Disable ipv6


    Next step is to disable ipv6 on all the machines. Hadoop is set to use ipv4 and
    that is why we need to disable ipv6 before creating a hadoop cluster. Open /etc/sysctl.conf
    as root using nano


    ```

    sudo nano /etc/sysctl.conf

    ```


    and add the following lines at the end of the file.'
  merge: -1
  pgno: 68
- img_proc: true
  md: '# Apache Hadoop Cookbook


    ```

    #commands to disable ipv6

    net.ipv6.conf.all.disable-ipv6=1

    net.ipv6.conf.default.disable-ipv6=1

    net.ipv6.conf.lo.disable-ipv6=1

    ```


    After this, check if the ipv6 is properly disable, use the following command


    ```

    cat /proc/sys/net/ipv6/conf/all/disable-ipv6

    ```


    it will return 0 as an output and we want it to be 1 as it symbolizes that the
    ipv6 is disabled.


    # 4.5.3 Connecting the machines (SSH Access)


    Now, we have to make sure that the machines are able to reach each other over
    the network using static IP addresses and SSH. For this example, we will consider
    hadoop1 machine as the master node and hadoop1 and hadoop2 both as the slave nodes.
    So we have to make sure:


    hadoop1(master) should be able to connect to itself using


    ```

    ssh hadoop1

    ```


    It should be able to connect to other VM


    ```

    ssh hduser@hadoop2

    ```


    To achieve this, we have to generate SSH key in each machine. So login to hadoop1
    and following the steps mentioned below in the terminal:


    Switch to the user hduser and generate the SSH public keys:


    ```

    #change to user hduser

    su - hduser

    ```


    ```

    #generate ssh key

    ssh-keygen -t rsa -P ""

    ```'
