  md: '# Chapter 1


    # “Hello World” Example


    # 1.1 Introduction


    Hadoop is an Apache Software Foundation project. It is the open source version
    inspired by GoogleReduce and Google File System.


    It is designed for distributed processing of large data sets across a cluster
    of systems often running on commodity standard hardware.


    Hadoop is designed with an assumption that all hardware fails sooner or later
    and the system should be robust and able to handle the hardware failures automatically.


    Apache Hadoop consists of two core components, which are:


    +   - Distributed File System called Hadoop Distributed File System or HDFS for
    short.

    - Framework and API for MapReduce jobs.


    In this example, we are going to demonstrate the second component of Hadoop framework
    called MapReduce and we will do so by Word Count Example (Hadoop World program
    of the Hadoop Ecosystem) but first we shall understand what MapReduce actually
    is.


    MapReduce is basically a software framework or programming model, which enables
    users to write programs so that data can be processed parallel across multiple
    systems in a cluster. MapReduce consists of two parts Map and Reduce.


    +   - Map task: Map task is performed using a `map()` function that basically
    performs filtering and sorting. This part is responsible for processing one or
    more chunks of data and producing the output results which are generally referred
    as intermediate results. As shown in the diagram below, map task is generally
    processed in parallel the mapping operation independent of each other.

    - Reduce: Reduce task is performed by `reduce()` function and performs a summary
    operation. It is responsible for consolidating the results produced by each of
    the Map task.


    # 1.2 Hadoop Word-Count Example


    Word count is the "Hello World" program of Hadoop and MapReduce. In this example,
    the program consists of MapReduce job that counts the number of occurrences of
    each word in a file. This job consists of two parts Map and Reduce. The Map task
    maps the data in the file and counts each word in data chunk passed to the map
    function. The outcome of this task is passed to reduce which combines the data
    and output the final result on the disk.'
  merge: -1
