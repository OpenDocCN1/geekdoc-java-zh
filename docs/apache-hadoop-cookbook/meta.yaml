    \nFigure 9.11: Output file\n\n## 9.7 Conclusion\n\nThis brings us to the end of\
    \ the article, to conclude, we started by understanding the basic working of the\
    \ Hadoop Streaming API and its complete workflow, we saw how MapReduce code can\
    \ be written in Python and how the Streaming API can be used to run the job.\n\
    \n## 9.8 Download the Source Code\n\nThe following download contains the mapper.py\
    \ and reducer.py scripts used in the article.\n\n**Download** You can download\
    \ the source code here: HadoopStreaming_Python\n\n# Chapter 10\n\n# Zookeeper\
    \ Example\n\nIn this example, we will explore Zookeeper, starting with the introduction\
    \ and then followed by the steps to set up and get running.\n\n## 10.1 Introduction\n\
    \nZookeeper is the building block of distributed systems. When a distributed system\
    \ is designed there is always a need of developing something that can coordinate\
    \ the cluster. This is where Zookeeper comes into the picture. Some of the services\
    \ by Zookeeper are:\n\n- **Naming Service**: A name service is used to map a name\
    \ to some sort of data which can be accessed using this name. For example, DNS\
    \ servers map to the address of the server or nodes can access the server using\
    \ that name. In distributed systems we may need to check the status of the name\
    \ assigned to them. This can be done by using the naming service provided by default\
    \ by Zookeeper.\n- **Configuration Management**: Zookeeper also provides the option\
    \ to manage the configuration of distributed system center. Configuration is stored\
    \ centrally on Zookeeper and any new node on joining the distributed system can\
    \ pick the configuration from Zookeeper. This makes making configuration quite\
    \ easy and effort free.\n- **Leader Election**: Distributed Systems usually needs\
    \ an automatic failover-strategy in case some nodes fails. Zookeeper provides\
    \ an option to do so using leader election.\n- **Locking**: In every distributed\
    \ system, there will be shared resources and multiple services may need to access\
    \ this. To allow serialized access to this, a locking mechanism is required. Zookeeper\
    \ provides this functionality.\n- **Synchronization**: The access to the shared\
    \ resources also need to be the synchronized in the distributed system. Zookeeper\
    \ also provides a simple interface for this.\n\n## 10.2 How Zookeeper Works?\n\
    \nZookeeper follows client-server model. In which clients are the machines in\
    \ the cluster. These machines are also called nodes. These clients consume the\
    \ service provided by the servers. Zookeeper coordinates the distributed system\
    \ but in itself it is also a distributed system. The collection of Zookeeper servers\
