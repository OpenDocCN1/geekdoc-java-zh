    # 10.4.2 Creating The First Node


    Let us start by creating a new node. Following is the Zookeeper command to create
    a new znode with dummy data.


    ```

    create /firstnodehelloworlddummy

    ```


    firstnode is the name of the node which will be created on the root path as indicated
    by and helldummy text is the dummy text stored in the znode memory.'
- md: '

    # Apache Hadoop Cookbook


    Figure 10.13: Create node in Zookeeper


    ## 10.4.3 Retrieving Data From The First Znode


    Similar to how we created a new node, we can get back the details and data of
    the znode using the CLI(Command Line Interface). Following is the command for
    getting the data from znode.


    ```

    get /firstnode

    ```


    NodeData: (Connected) path=/firstnode


    Created


    NodeData: (Connected) path=/firstnode

    Metadata:

    cime = 2016-01-26 21:29:04 2016

    mtime = 2016-01-26 21:29:04 2016

    dataVersion = 0

    version = 0

    aclVersion = 0x0

    length = 19

    numchildren = 0


    Figure 10.14: Getting data from znode in Zookeeper


    If you look at the screenshot, with the data in the znode while creating, the
    server also returned some metadata related to this particular znode.


    Some of the important fields in the metadata are:


    - **ctime**: Time when the znode was created.

    - **mtime**: Last modified time.

    - **dataVersion**: Version of the data which changes every time data is modified.
    In this case data is helloworlddata and the length is 19.

    - **dataLength**: The length of the data stored in the znode.

    - **numchildren**: Number of children of this artifact znode.


    ## 10.4.4 Modifying Data in Znode


    If we want to modify data in a particular znode Zookeeper provides a command for
    that. Following is how to modify the data in an existing znode:


    ```

    /firstnode helloworld

    ```


    Where **firstnode** is the existing znode and **helloworld** is the new data which
    need to be written in the znode. Old data will be removed when new data is set.


    Figure 10.15: Modifying data in an existing znode


    If you notice in the screenshot datalength, mtime, and dataversion is also updated
    when a new value is set.


    ### 10.4.5 Creating A Subnode


    Creating a subnode in an existing node is as easy as creating a new node. We just
    need to pass the full path for the new subnode.


    ```

    create /firstnode/subnode subnodeata

    get /firstnode/subnode

    ```


    raman@raman-VirtualBox: ~ /zookeeper-3.4.6


    Figure 10.16: Creating a subnode for an existing node


    ## 10.4. Removing A Node


    Removing a node is quite easy using rmr command in the Zookeeper CLI. Removing
    node also removing all its subnodes. Following is the code to remove firstnode
    which we created for this example:


    ```

    rmr /firstnode

    ```


