- md: "\n## Chapter 7\n\n## Distributed Cache Example\n\nIn this example article,\
    \ we will go through Apache Hadoop Distributed Cache and will understand how to\
    \ use it with MapReduce Jobs.\n\n## 7.1 Introduction\n\nDistributed Cache as the\
    \ name indicates is the caching system to store files or data which is required\
    \ frequently and this mechanism is distributed in nature as all other components\
    \ of Hadoop are.\n\nIt can read read-only text files, archives, jar files etc.\
    \ Which are needed by the application. So if a file is needed by let us map tasks,\
    \ so it needs to be present on all the machines which will run Map tasks, this\
    \ is what distributed cache is used.\n\n## 7.2 Working\n\nApplication which needs\
    \ to use distributed cache to distribute a file should make sure that the file\
    \ is available and can be accessed via urls. Urs can be either hdfs:// or https://.\n\
    \nOnce the file is present on the mentioned url and user mention it to be a cache\
    \ file to the distributed cache API, the Map-Reduce framework will copy the necessary\
    \ files on all the nodes before initiation of the tasks on those nodes.\n**Notes:**\
    \ In case the files are provided, these will be automatically unarchived on the\
    \ nodes after transfer.\n\n## 7.3 Implementation\n\nFor understanding how to use\
    \ the distributed cache API we will see an example in which we will write a modified\
    \ version of the word count program.\nFor the basic word count example and if\
    \ you like to understand the basics of how MapReduce job works, please refer to\
    \ the article Apache Hadoop Wordcount Example.\n\nIn this program, we will provide\
    \ an input file to the Map-Reduce job with the words we need to count but we will\
    \ also provide another file which contains stop words which we need to remove\
    \ from the input text before counting the word occurrences.\n\nSo let's start\
    \ looking into the code:\n\n### 7.3.1 The Driver Class\n\nThe driver class is\
    \ the main entry point of the system and the class which sets up the Map-Reduce\
    \ job.\n\n```java\npackage com.javacodgeeks.examples.distributedcache;\n\nimport\
    \ org.apache.hadoop.conf.Configured;\nimport org.apache.hadoop.filecache.DistributedCache;\n\
    import org.apache.hadoop.fs.Path;\nimport org.apache.hadoop.io.Writable;\nimport\
    \ org.apache.hadoop.io.Text;\nimport org.apache.hadoop.mapreduce.Job;\nimport\
    \ org.apache.hadoop.mapreduce.lib.InputFormat;\nimport org.apache.hadoop.mapreduce.lib.FileOutputFormat;\n\
    import org.apache.hadoop.mapreduce.lib.util.OutputFormat;\nimport org.apache.hadoop.util.Tool;\n\
    import org.apache.hadoop.util.ToolRunner;\n```\n\n```java\n/**\n * The entry point\
    \ for the WordCount example,\n * which sets up the Hadoop Job with Map and Reduce\
    \ Class\n * @author Raman Raman\n */\npublic class Driver extends Configured Tool\
    \ {\n\n    /**\n     * Main function which calls the run method and passes the\
    \ args using ToolRunner\n     * @param args Two input and output file paths\n\
    \     * @throws Exception\n     */\n    public static void main(String[] args)\
    \ throws Exception {\n        int exitCode = ToolRunner.run(new Driver(), args);\n\
    \        System.exit(exitCode);\n    }\n}\n```\n\n```java\n/**\n * Run method\
    \ which schedules the Hadoop Job\n * @param args Arguments passed in main function\n\
    \ */\npublic int run(String[] args) throws Exception {\n    if (args.length !=\
    \ 2) {\n        System.err.printf(\"Usage: %s needs two arguments\\n\",\n    \
    \        getClass().getSimpleName());\n        return -1;\n    }\n\n    // Initialize\
    \ the Hadoop job and set the jar as well as the name of the Job\n    Job job =\
    \ new Job();\n    job.setJarByClass(Driver.class);\n    job.setJobName(\"Word\
    \ Counter With Stop Words Removal\");\n\n    // Add input and output file paths\
    \ to job based on the arguments presented\n    FileInputFormat.addInputPath(job,\
    \ new Path(args[0]));\n    FileOutputFormat.setOutputPath(job, new Path(args[1]));\n\
    \n    job.setOutputKeyClass(Text.class);\n    job.setOutputValueClass(IntWritable.class);\n\
    \    job.setOutputFormat(TextFileOutput.class);\n\n    // Set the Map and ReduceClass\
    \ in the job\n    job.setMapperClass(MapClass.class);\n```\n\n```java\njob.setReducerClass(ReduceClass.class);\n\
    \nDistributedCache.addCacheFile(new Path(args[2]).toUri(), job\n    getConfiguration());\n\
    \n// Wait for the job to complete and print if the job was successful or not\n\
    int returnValue = job.waitForCompletion(true) ? 0 : 1;\n\nif (job.isSuccessful())\
    \ {\n    System.out.println(\"Job was successful\");\n} else {\n    System.out.println(\"\
    Job was not successful\");\n    return returnValue;\n}\nreturn returnValue;\n\
    ```\n\nAbove is the complete code of the driver class. You can see that in the\
    \ main() method we set up and initialize a Hadoop Job(). First of all this code\
    \ checks for the arguments to the method. Arguments need to be 3 in number:\n\n\
    - Input file text path containing the text for word count\n- Output path for storing\
    \ the output of the program\n- File path and name containing the stop words we\
    \ will distribute through the Hadoop Distributed Cache\n\nThe code:\n\n```java\n\
    if (args.length != 3) {\n    System.err.printf(\"Usage: %s needs three arguments\
    \ files\\n\",\n        getClass().getSimpleName());\n    return -1;\n}\n```\n\n\
    checks for the arguments and makes sure we have the correct number.\n\n### 7.3.2\
    \ Map Class\n\nMap class contains the mapper method which is the main focus regarding\
    \ how to use the cache files in MapReduce Tasks.\n\n```java\npackage com.javacodgeeks.examples.distributedcache;\n\
    \nimport java.io.BufferedReader;\nimport java.io.FileReader;\nimport java.io.IOException;\n\
    import java.util.HashSet;\nimport java.util.Set;\nimport java.util.StringTokenizer;\n\
    \nimport org.apache.hadoop.filecache.DistributedCache;\nimport org.apache.hadoop.fs.Path;\n\
    import org.apache.hadoop.io.IntWritable;\nimport org.apache.hadoop.io.LongWritable;\n\
    import org.apache.hadoop.io.Text;\nimport org.apache.hadoop.mapreduce.Mapper;\n\
    ```\n\n```java\n/**\n * Map Class extends Mapper class\n * Map is passed a single\
    \ line at a time, it splits the line based on\n * and generated the token which\
    \ is output by map value as one to be consumed\n * by release cache\n * @Author\
    \ Raman */\npublic class MapClass extends Mapper {\n    private static final IntWritable\
    \ one = new IntWritable(1);\n    private Text word = new Text();\n    private\
    \ Set stopWords = new HashSet();\n\n    @Override\n    protected void setup(Context\
    \ context) throws IOException, InterruptedException {\n        try{\n        \
    \    Path[] stopWordsFiles = DistributedCache.getLocalCacheFiles(context.\n  \
    \              context.getConfiguration());\n            if(stopWordsFiles !=\
    \ null && stopWordsFiles.length > 0) {\n                for (Path stopWord : stopWordsFiles)\
    \ {\n                    readfile(stopWord);\n                }\n            }\n\
    \        } catch (IOException ex) {\n            System.err.println(\"Exception\
    \ in mapper setup: \" + ex.getMessage());\n        }\n    }\n\n    private void\
    \ readfile(Path path) throws IOException {\n        BufferedReader br = new BufferedReader(new\
    \ FileReader(path.toFile()));\n        String line;\n        while ((line = br.readLine())\
    \ != null) {\n            stopWords.add(line);\n        }\n        br.close();\n\
    \    }\n\n    /**\n     * map function of Mapper parent class takes a line of\
    \ text at a time\n     * splits to tokens and passes to the context as word with\
    \ value as one to\n     */\n    @Override\n    protected void map(LongWritable\
    \ key, Text value,\n        Context context)\n        throws IOException, InterruptedException\
    \ {\n\n        String line = value.toString();\n        StringTokenizer st = new\
    \ StringTokenizer(line, \" \");\n\n        while (st.hasMoreTokens()) {\n    \
    \        word.set(st.nextToken());\n            if (!stopWords.contains(word))\
    \ {\n                context.write(word, one);\n            }\n        }\n   \
    \ }\n}\n```\n"
  mdcn: "\n\n## 第 7 章\n\n## 分布式缓存示例\n\n在本文中，我们将介绍 Apache Hadoop 分布式缓存（Distributed\
    \ Cache），并理解如何在 MapReduce 任务中使用它。\n\n## 7.1 简介\n\n分布式缓存顾如其名，是一种用于存储频繁访问的文件或数据的缓存系统。与\
    \ Hadoop 的其他组件一样，这种机制在本质上是分布式的。\n\n它可以读取应用程序所需的只读文本文件、压缩包、jar 文件等。例如，如果 Map 任务需要某个文件，那么该文件必须存在于所有运行\
    \ Map 任务的机器上，这就是分布式缓存的用途。\n\n## 7.2 工作原理\n\n需要使用分布式缓存分发文件的应用程序应该确保该文件是可用并且可以通过\
    \ URL 访问。URL 可以是 `hdfs://` 或 `https://`。\n\n一旦文件出现在上述 URL 中，且用户向分布式缓存 API 将其指定为缓存文件，MapReduce\
    \ 框架将在这些节点启动任务之前，将必要的文件复制到所有节点上。\n**注意：** 如果提供的是压缩文件，它们在传输后会在节点上自动解压。\n\n## 7.3\
    \ 实现\n\n为了理解如何使用分布式缓存 API，我们将查看一个示例，其中我们将编写一个修改版的词频计数程序。\n关于基础词频计数示例，如果你想了解 MapReduce\
    \ 任务的工作原理，请参考文章 [Apache Hadoop 词频计数示例]。\n\n在这个程序中，我们将为 MapReduce 任务提供一个包含我们需要统计的单词的输入文件，但还会提供另一个包含停用词（stop\
    \ words）的文件，在统计单词出现次数之前从输入文本中移除这些词。\n\n让我们开始查看代码：\n\n### 7.3.1 Driver 类（驱动类）\n\
    \nDriver 类是系统的主入口，也是负责设置 MapReduce 任务的类。\n\n```java\npackage com.javacodgeeks.examples.distributedcache;\n\
    \nimport org.apache.hadoop.conf.Configured;\nimport org.apache.hadoop.filecache.DistributedCache;\n\
    import org.apache.hadoop.fs.Path;\nimport org.apache.hadoop.io.Writable;\nimport\
    \ org.apache.hadoop.io.Text;\nimport org.apache.hadoop.mapreduce.Job;\nimport\
    \ org.apache.hadoop.mapreduce.lib.InputFormat;\nimport org.apache.hadoop.mapreduce.lib.FileOutputFormat;\n\
    import org.apache.hadoop.mapreduce.lib.util.OutputFormat;\nimport org.apache.hadoop.util.Tool;\n\
    import org.apache.hadoop.util.ToolRunner;\n```\n\n```java\n/**\n * WordCount 示例的入口点，\n\
