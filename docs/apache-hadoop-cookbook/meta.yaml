    # Chapter 5


    # Distcp Example


    In this example, we are going to show how to copy large files in inter/intra-cluster
    setup of Hadoop using distributed copy tool.


    # 5.1 Introduction


    DistCP is the short of Distributed Copy in context of Apache Hadoop. It is basically
    a tool which can be used in case we need to copy large amount of data/files in
    inter/intra-cluster setup. In the background, Distcp uses MapReduce to distribute
    and copy the data which means the operation is distributed across multiple available
    nodes in the cluster. This makes it more efficient and effective copy tool.


    Distcp takes a list of files(in case of multiple files) and distributes the data
    between multiple Map tasks and these map tasks copy the data partition assigned
    to the destination.


    # 5.2 Syntax and Examples


    In this section, we will check the syntax of Distcp along with some examples.


    # 5.2.1 Basic


    Following is the basic syntax of distcp command.


    ```

    hadoop distcp hdfs://namenode:port/source hdfs://namenode:port/destination

    ```


    Following the distcp first argument is the fully qualified address of the source
    including the namenode and the port. Second argument should be the destination.
    The basic syntax of distcp is easy and simple. It handles all the distribution
    and copying automatically using MapReduce.


    If copying between the same cluster, the namenode and the port number of source
    and destination will be same and in case of different cluster will be different.


    Example of basic distcp:


    ```

    hadoop distcp hdfs://quickstart.clouera:8020/user/access_logs hdfs://quickstart.clouera-8020/user/destination_access_logs

    ```


