    \ the file\n            if(fs.exists(filePath)) {\n                Path renamedFilePath\
    \ = new Path(\"renamed\" + filename);\n                fs.rename(filePath, renamedFilePath);\n\
    \            }\n        } catch (IOException ex) {\n            System.out.println(\"\
    Error: \" + ex.getMessage());\n        }\n    }\n}\n```\n\nThis code creates a\
    \ file dummy.txt, writes dummy message into this file.\n\n- Line no. 24-25 creates\
    \ an abstract FileSystem object with Configuration object. Configuration object\
    \ uses default parameters in this case we have not defined any.\n- Line no. 30-33\
    \ checks if the file exists in HDFS and if it does, it deleting the file. This\
    \ example introduces two methods to handle the file system exists() and delete().\n\
    - Line no. 35-38 writes the file into HDFS on the provided path, by writing the\
