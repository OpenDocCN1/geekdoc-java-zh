    \ line into individual words\n    words = line.split()\n\n    # for each word\
    \ in words, output key-value pair\n    for word in words:\n        # outputs the\
    \ result to stdout\n        # MapReduce Streaming API will take this output\n\
    ```"
- md: "\n```python\n# and feed as the input to the Reduce step step\n\n# tab-delimited\n\
    # word count is always one\nprint '%s\\t%s' % (word, 1)\n```\n\nAbove is the Python\
    \ code to perform the Map task, now use it as mapper.py and make sure we have\
    \ read and run permission for the python file.\n\n## 9.4.3 Reducer\n\nThe Reducer\
    \ will take the input from the mapper.py through stdin. Reducer then sums the\
    \ occurrence of each word and output the file reduced in the form of key-value\
    \ pair having the particular word as key and the total occurrences of the word\
    \ as value. For example, <word, 5>\n\n```python\n#!/usr/bin/env python\n\nfrom\
    \ operator import itemgetter\nimport sys\n\n#variable initialization\ncurrent_word\
    \ = None\ncurrent_count = 0\nword = None\n\n# takes input stdin\nfor line in sys.stdin:\n\
    \    # trim any leading and trailing spaces\n    line = line.strip()\n\n    #\
    \ split the input from mapper.py to take the word and your count\n    word, count\
    \ = line.split('\\t', 1)\n\n    # convert count string to int\n    try:\n    \
    \    count = int(count)\n    except ValueError:\n        # in case of exception\n\
    \        # ignore the exception and discard the input line\n        continue\n\
    \n    # this IF-switch only works because Hadoop sorts map output\n    # by key\
    \ (here: word) before it is passed to the reducer\n    if current_word == word:\n\
    \        current_count += count\n    else:\n        if current_word:\n       \
    \     # write result to STDOUT\n            print '%s\\t%s' % (current_word, current_count)\n\
    \        current_count = count\n        current_word = word\n\n# do not forget\
    \ to output the last word if needed!\nif current_word == word:\n    print '%s\\\
    t%s' % (current_word, current_count)\n```\n\nAbove is the Python code to perform\
    \ the reduce task. Save this code in the file reducer.py and also make sure we\
