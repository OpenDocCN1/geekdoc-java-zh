    Figure 10.10: zoo.cfg file


    We have a short overview of what that configuration settings mean:


    +   - tickTime: It is the time used by Zookeeper to heartbeat with all the system
    nodes to check if all nodes are alive and connected.

    - initTime: The number of ticks that an initial synchronization phase can take.

    - syncTime: The number of ticks that can pass between sending the request and
    getting an acknowledgement.

    - dataDir: Directory to store in-memory database snapshots and the transaction
    logs by Zookeeper.

    - clientPort: The port which will be used for the client connections.


