    Apache Hadoop is an open-source software framework written in Java for distributed
    storage and distributed processing of very large data sets on computer clusters
    built from commodity hardware. All the modules in Hadoop are designed with a fundamental
    assumption that hardware failures are common and should be automatically handled
    by the framework.


    Hadoop has become the de-facto tool used for Distributed computing. For this reason
    we have provided an abundance of tutorials here at Java Code Geeks, most of which
