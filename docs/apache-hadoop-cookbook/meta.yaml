  md: '# Chapter 3


    # FS Commands Example


    In this example, we will go through most important commands which you may need
    to know to handle Hadoop File System(FS). We assume the previous knowledge of
    what Hadoop is and what Hadoop can do? How it works in distributed fashion and
    what Hadoop Distributed File System(HDFS) is? So that we can go ahead and check
    some examples of how to deal with the Hadoop File System and what are some of
    the most important commands. Following are two examples which can help you if
    you are not well aware Apache Hadoop:


    +   - "Hello World!"

    - How to set up Hadoop Cluster using Virtual Machines


    Let us get started, as in this example we will see top and the most frequently
    used Hadoop File System(fs) commands which will be useful to manage files and
    data in HDFS clusters.


    # 3.1 Introduction


    The Hadoop File System(FS) provides various shell commands like by default which
    can be used to interact with the Hadoop Distributed File System(HDFS) or any other
    supported file system using the Hadoop Shell. Some of the most common commands
    are the once used for operations creating directories, copying a file, viewing
    the file content, changing ownership or permissions on the file.


    # 3.2 Common Commands


    In this section, we will use the usage and the example of most common Hadoop FS
    Commands.


    # 3.2.1 Create a directory


    Usage:


    ```

    hadoop fs -mkdir <paths>

    ```


    Example:


    ```

    hadoop fs -mkdir /user/root/dir

    ```'
