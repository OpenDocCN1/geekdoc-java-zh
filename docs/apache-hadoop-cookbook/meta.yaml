    # 2.2.2 Multiple Sources


    In case there are multiple sources and need to go to the same destination, then
    all the sources can be passed as the arguments in the following syntax:

    The files from all the sources will be copied to the destination.

    There is another alternative if there are many sources and running long command
    can become an issue. The alternative approach:


    ```

    hadoop distcp -f hdfs://namenode:port/sourceList hdfs://namenode:port/source2
    hdfs://namenode:port/source3 hdfs://namenode:port/destination

    ```


    where, sourceList is a simple file containing the list of all the sources. In
    this case, source list need to be passed with the flag -f which indicates that
    the source is not the file to be copied but a file which contains all the sources.

    **Note:** When distcp is used with multiple sources, at the destination, copying
    is not aborted but distcp will abort the copy with an error message. In case of
    collisions at the destination, copying is resolved as per the options specified.
    If no options are specified, default is that the files already existing at the
    destination are skipped.


