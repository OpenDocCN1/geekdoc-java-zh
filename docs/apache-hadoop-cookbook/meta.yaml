    it should return 0 or 1 as an output and we want it to be 1 as symbolizes that
    the ipv6 is disabled


    # 2.2.4 Installing SSH and Setting up certificate


    Hadoop requires SSH access to manage its remote nodes as well as on local machine.
    For this example, we need to configure SSH access to localhost.


    So, we will need to have SSH up and running and set up the public key access to
    allow it to login without a password. We will set up SSH certificate for allowing
    a password less authentication. Use the following commands to do the required
    steps.


    ssh has two main components:


    +   - ssh: The command we use to connect to remote clients - the.

    - sshd: The daemon that is running on the server and allows clients to connect
    to the server.


    SSH is pre-enabled on ubuntu but make sure sshd is enables we we need to install
    ssh using the following command.


    ```

    #install ssh

    sudo apt-get install ssh

    ```


    To make sure everything is setup properly, use the following commands and make
    sure the output is similar to the one displayed in the screenshot.'
