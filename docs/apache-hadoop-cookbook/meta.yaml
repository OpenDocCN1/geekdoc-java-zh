  md: '# Chapter 4


    # Cluster Setup Example


    # 4.1 Introduction


    Apache Hadoop is designed for a multi-machine cluster setup. Though it is possible
    to run on single machine all for purpose but real implementation is for multi-machine
    clusters. Even if we want to try out multi-machine setup we will need multiple
    systems which are connected to each other over the network which is not possible
    always; what if you do not have multiple systems to try out Hadoop Cluster?


    Virtual Machines come to rescue here. Using multiple Virtual Machines we can setup
    Hadoop Cluster using a single system. So, in this example, we will discuss how
    to setup Apache Hadoop Cluster using Virtual Machines.


    # 4.2 Requirements


    +   * VirtualBox (or any other VM environment)

    * Ubuntu 15.04 (or any other linux flavor of your preference)

    * VBox Guest Additions image file (VBoxGuestAdditions.iso)


    I personally prefer Ubuntu as it has lightweight LXDE Desktop GUI and strips all
    the additional components which are present in Ubuntu and is a good option for
    virtual machines.


    # 4.3 Preparing Virtual Machine


    In this section we will go through steps to prepare virtual machines which we
    will use for cluster later in the example.


    # 4.3.1 Creating VM and Installing Guest OS


    Create a virtual machine(VM) in VirtualBox and assign minimum 2GB of memory and
    15GB of storage to the virtual machine. Name the first VM as HadoopI.'
