    # 6 分布式文件系统详解


    在本例中，我们将讨论 Apache Hadoop 分布式文件系统 (HDFS)、其组件和架构。HDFS 是 Hadoop 生态系统的核心组件之一。


    ## 6.1 简介


    Apache Hadoop 提供了一个分布式文件系统以及一个用于处理大规模数据集的框架。HDFS 设计用于在廉价硬件上可靠地存储巨大的数据集。它具有容错性，并提供高吞吐量的数据访问。HDFS
    的接口参考了 Unix 文件系统，但为了提高目标应用程序的性能，它对文件系统中的数据提供了流式访问。


    ## 6.2 HDFS 设计


    以下是 HDFS 与其他文件系统的不同之处，以及 HDFS 能够处理大量数据的属性。


    ### 6.2.1 系统故障


    HDFS 设计在廉价硬件上运行，系统故障被视为常态。由于 HDFS 依赖于大量的组件，考虑到这些组件发生故障的概率，会导致组件经常故障。因此，HDFS 设计为检测故障并执行自动恢复以提供所需的性能是
    HDFS 的核心属性之一。


    ### 6.2.2 可以处理大量数据


    HDFS 设计用于依赖大量数据的应用程序。这些数据可以是 GB、TB 甚至 PB 级的。因此，HDFS 经过优化，可以扩展到大型集群来存储这些数据，而不影响数据吞吐量。


