    that we test the code to confirm that it works as expected. It is easy to make
    sure that the code works with a small input test before submitting to the cluster
    to parse large amount of data. We can perform the following tests:


    +   - First test will be to test the Mapper code. Execute the following command
    in the console. It will run the mapper.py script with the given input string and
    we confirm that the output is expected.


