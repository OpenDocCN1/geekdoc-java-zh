    \ CounterProgram, that opens the following window:\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_46_0.png)\n\
    \nThe program must have a very simple class named Counter. The class should have\
    \ an instance variable of the type int, that start is 0. The class must have three\
    \ methods:\n\n- up(), increments the counter by 1\n- down(), decrements the counter\
    \ by 1\n- getValue(), returns the value of the counter\n\nCenter in the window\
    \ is a label, that shows the value of the counter. When the user click on the\
    \ button Up, the counter should be increased, and when the user click on Down\
    \ the counter should be decreased. The event handler to one of the two buttons\
    \ must be written as an inner class, and the event handler to the other button\
    \ must be written as an anonymous class.\n\nJAVA 4: JAVA'S TYPE SYSTEM AND COLLECTION\
    \ CLASSES\nINNER CLASSES\n\n# 4.2 EXAMPLE: ZIPCODES\n\nI will show an example\
    \ of a program where you search the Danish ZIP codes. The user can enter a value\
    \ for the ZIP code and a value for the city name, and the program will then find\
    \ the elements that matches values, the zip code must start with the entered value,\
    \ while the city name must contain the entered value. When comparing the city\
    \ names, it should not be case-sensitive. I start with a simple model class for\
    \ a zip code:\n\n```\npackage postprogram;\n\npublic class Post {\n    private\
    \ String code; // the zip code\n    private String city; // name of the city\n\
    \n    public Post(String code, String city) {\n        this.code = code;\n   \
    \     this.city = city;\n    }\n\n    public String getCode() {\n        return\
    \ code;\n    }\n\n    public String getCity() {\n        return city;\n    }\n\
    \n    public String toString() {\n        return code + \" \" + city;\n    }\n\
    }\n```\n\nNext there is written a class Postcodes, that is an encapsulation of\
    \ an ArrayList<Post>. There are two challenges associated with this class:\n\n\
    - 1. the arraylist must be initialized with Post objects\n- 2. the class should\
    \ have two iterators to iterates the list sorted respectively by zip code or city\
    \ name\n\nJAVA 4: JAVA'S TYPE SYSTEM\nINNER CLASSES AND COLLECTION CLASSES\n\n\
    The first problem is solved by placing a table directly in the code. It is obviously\
    \ not a flexible solution, postcodes do not change frequently, so in this case\
    \ the solution can be accepted. In the program, post codes are laid out as an\
    \ array in a nested class. The class is also public, so others can refer to it.\
    \ Below is a part of the class:\n\n```\npublic static class Data {\n    private\
    \ final String[] table = {\n        \"1000\", \"København K\",\n        \"1001\"\
    , \"København K\",\n        \"1002\", \"København K\",\n        \"9982\", \"Åbæk\"\
    ,\n        \"9990\", \"Skagen\"\n    };\n\n    public int length() {\n       \
    \ return table.length;\n    }\n}\n```\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_48_0.png)\n\
    \nBI Norwegian Business School is one of Europe's largest business schools welcoming\
    \ more than 20,000 students. Our programmes provide a stimulating and multi-cultural\
    \ learning environment with an international outlook ultimately providing students\
    \ with professional skills to meet the increasing needs of businesses.\nBI offers\
    \ four two-year full-time Master of Science (MSc) programmes that are taught in\
    \ English and are designed to provide professional skills to meet the growing\
    \ need of companies. provide a stimulating and multi-cultural learning environment\
    \ to give you the best path to launch your career.\n\n- MSc in Business\n- MSc\
    \ in Financial Economics\n- MSc in Strategic Marketing\n- MSc in Leadership and\
    \ Organizational Psychology\n\nJAVA 4: JAVA'S TYPE SYSTEM\nAND COLLECTION CLASSES\n\
    INNER CLASSES\n\n```\npublic String getCode(int n) {\n    return table[n][0];\n\
    }\n\npublic String getCity(int n) {\n    return table[n][1];\n}\n```\n\nThe constructor\
    \ of the class Postcodes uses the class Data to initialize an ArrayList<Post>\
    \ with Post objects. The second of the above problems are solved by sorting the\
    \ ArrayList. To sort an array and any other list of objects, you should be able\
    \ to compare the objects and determine whether an object is greater than another.\
    \ It can be solved in several ways, and one way is to use a comparator which is\
    \ an object whose class implements the Comparator<Post>. It defines a single method\n\
    \n```\npublic int compare(Post p1, Post p2)\n```\n\nwhich must return -1 if p1\
    \ is less than p2, 1 if p1 is greater than p2 and if they are the same. The class\
    \ is now written, it has two iterators to start the post by respectively zipcode\
    \ and city name and the sort order is defined by two inner classes:\n\n```\npackage\
    \ postprogram;\n\nimport java.util.*;\n\npublic class Postcodes implements Iterable<Post>\
    \ {\n    private ArrayList<Post> list = new ArrayList();\n\n    public Postcodes()\
    \ {\n        Data data = new Data();\n        for (int i = 0; i < data.length();\
    \ i++)\n            list.add(new Post(data.getCode(i), data.getCity(i)));\n  \
    \  }\n\n    public Iterator<Post> iterator() {\n        list.sort(new CodeComparator());\n\
    \        return list.iterator();\n    }\n\n    public Iterator<Post> iterator2()\
    \ {\n        list.sort(new CityComparator());\n        return list.iterator();\n\
    \    }\n}\n\nclass CodeComparator implements Comparator<Post> {\n    public int\
    \ compare(Post p1, Post p2) {\n        return p1.getCode().compareTo(p2.getCode());\n\
    \    }\n}\n\nclass CityComparator implements Comparator<Post> {\n    public int\
    \ compare(Post p1, Post p2) {\n        return p1.getCity().compareTo(p2.getCity());\n\
    \    }\n}\n\npublic static class Data {\n    ...\n}\n\nNote first that the class\
    \ implements the iterator pattern in the usual way. Next, note the two inner classes,\
    \ each of which defines a comparator. In this case, in either case you should\
    \ compare strings and the class supports directly comparison. If you consider\
    \ the implementation of the method iterator(), it starts to sort the ArrayList\
    \ after zip code which is done using a method sort() and a comparator. The class\
    \ has a different method, which also returns an iterator. It's called iterator2()\
    \ and works in exactly the same way, just it sorts with a second comparator.\n\
    \nThe above classes can be seen as the model for the program, a model which makes\
    \ the data available which the program must use. In this case, the program might\
    \ select some of the objects from the model based on a given search criteria for\
    \ respectively the zip code and the city name. To this end, I have written a Controller\
    \ class:\n\n```\npublic class Controller {\n    private Postcodes model = new\
    \ Postcodes();\n\n    public ArrayList<Post> seek(String code, String city, boolean\
    \ zipcode) {\n        ArrayList<Post> list = new ArrayList();\n        city =\
    \ city.toLowerCase();\n        if (zipcode) {\n            for (Post p : model)\n\
    \                if (p.getCode().startsWith(code) && p.getCity().toLowerCase().contains(city))\
    \ list.add(p);\n        }\n        for (Iterator<Post> itr = model.iterator2();\
    \ itr.hasNext()) {\n            Post p = itr.next();\n            if (p.getCode().startsWith(code)\
    \ &&\n                p.getCity().toLowerCase().contains(city)) list.add(p);\n\
    \        }\n        return list;\n    }\n}\n```\n\nThe class creates the model,\
    \ but otherwise there is only one method to searching. The method has three parameters,\
    \ where the first two is the search text, respectively for the zip code and city\
    \ name. The last parameter specifies whether the results must be sorted by zip\
    \ code or city name. If the result should be sorted by zip code the standard iterator\
    \ is used by iterating through the model with the usual syntax:\n\n```\nfor (Post\
    \ p : model)\n```\n\nShould the result be sorted by city name, iterator2() is\
    \ used and time cannot use the expanded for statement, but must directly refer\
    \ to the iterator:\n\n```\nfor (Iterator<Post> itr = model.iterator2(); itr.hasNext());\n\
    ```\n\nNow there's to give the program a user interface and run the program, you\
    \ get the following window, where there has been a search:\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_52_0.png)\n\
    \nDownload free eBooks at bookboom.com\n"
