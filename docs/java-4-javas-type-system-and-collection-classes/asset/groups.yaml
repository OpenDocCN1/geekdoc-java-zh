    << \" + buffer.remove());\n        }\n        catch (Exception ex) {\n       \
    \     System.out.println(ex.getMessage());\n        }\n        else {\n      \
    \      try {\n                int t = rand.nextInt(90) + 10;\n               \
    \ buffer.insert(t);\n                System.out.println(\">> \" + t);\n      \
    \      }\n            catch (Exception ex) {\n                System.out.println(ex.getMessage());\n\
    \            }\n        }\n    }\n}\n}\n```\n\nThe class IntBuffer, however, has\
