    # WRAPPER CLASSES


    Java’s type system consists as discussed in the previous book of a hierarchy of
    classes with the class Object as the root. Beside there are simple types for numbers
    and characters, and in some places it is a problem that these are not part of
    the object-oriented class hierarchy. There are, therefore, for each of the simple
    types defined a class that encapsulates the simple type. For example the class
    Integer that encapsulates an int. These are called wrapper classes, and besides
    they allow the variables of the simple types to be used in the same way as other
    objects, the wrapper classes defines a number of useful methods and constants
    for the simple types.


    For the numeric types, there are following wrapper classes


    +   - Byte

    - Short

    - Integer

    - Long

    - Float

    - Double


    and the names should tell the primitive type as the class encapsulates. The six
    classes are all derived from the class Number.


    There are also wrapper classes to use of char and boolean and they are called
    respectively Character and Boolean. Generally are the use of these classes without
    major challenges, but you should study them well including to be aware of the
    methods they offer. For an example is shown a method which uses one of the wrapper
    classes:


    ```

    private static void test01() {

    Integer a = new Integer(23);

    Integer b = 23;

    print(a);

    print(b);

    Double x = 3.14;

    print(x);

    Character c = ''A'';

    print(c);

    print(19);

    }

    ```'
