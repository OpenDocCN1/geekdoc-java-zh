    \    System.out.println(Collections.disjoint(list1, list3));\n}\n```\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_159_0.png)\n\
    \n## FINDING EXTREME VALUES\n\nThat is two simple methods min() and max() that,\
    \ respectively, determines the minimum and maximum element in a Collection. Both\
    \ methods exist in two versions. The one takes only Collection as parameter and\
    \ returns the minimum (or maximum) element according to natural ordering. The\
    \ other also has Comparator as parameter.\n\n## EXERCISE 12\n\nWrite a program,\
    \ that you can call MinMax. The main() method must create an ArrayList with 10\
