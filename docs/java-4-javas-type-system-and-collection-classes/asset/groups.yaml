- md: "\n# EXERCISE 3\n\nWrite a program similar to the program Factorials when the\
    \ program this time should implements a class Fibonacci, where you can iterate\
    \ through the fibonacci numbers\n\n0, 1, 1, 2, 3, 5, 8, 13, 21, ...\n\nThe class\
    \ Fibonacci must implement the interface Iterable<Long> and should only have a\
    \ single method that returns the iterator, and the main program should only print\
    \ the fibonacci numbers. The iterator must be in the class Fibonacci implemented\
    \ as an anonymous class. Note that the largest fibonacci number that you can represent\
