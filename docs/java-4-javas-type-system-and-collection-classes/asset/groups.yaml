  - "[PAGE 118]\n\nJAVA 4: JAVA'S TYPE SYSTEM\nLAMBDA EXPRESSIONS\n\n# 8.2 METHODS\
    \ AS PARAMETERS\n\nIn other programming languages, such as C and C ++ you can\
    \ transfer references to methods as parameters to another method. This not be\
    \ done directly in Java, and it is necessary to transfer a method encapsulated\
    \ in an object. The objects in which you transferred as a parameter to a method\
    \ is usually defined by an interface. Consider as an example, the following interface,\
    \ which defines a method that has an int parameter and returns a boolean:\n\n\
    ```\ninterface ISelector\n{\n  public boolean select(int t);\n}\n```\n\nBelow\
    \ is a method that prints the elements of an int array, but only the elements\
    \ where an ISelector object returns true:\n\n```\nprivate static void print(int[]\
    \ arr, ISelector s)\n{\n  for (int t : arr) if (s.select(t)) System.out.print(t\
    \ + \" \");\n  System.out.println();\n}\n```\n\nIt is thus an example of how to\
    \ transfer a method select() as a parameter to another method. Suppose there are\
    \ defined the following array:\n\n```\nint[] arr = new int[120];\nfor (int i =\
    \ 0; i < arr.length; ++++) arr[i] = i;\n```\n\nand assume that you use the above\
    \ print() method to print all 2-digit numbers. You must then use an ISelector\
    \ object as a parameter, and to create such an object, you must have a class:\n\
    \n```\nclass Select2 implements ISelector\n{\n  public boolean select(int t)\n\
    {\n    return t > 9 && t < 100;\n  }\n}\n```\n\nYou can then print the numbers\
    \ as follows:\n\n```\nprint(arr, new Select2());\n```"
