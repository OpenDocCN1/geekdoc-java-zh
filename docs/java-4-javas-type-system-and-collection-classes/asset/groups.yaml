    \n# 包装类\n\n正如在前一书中提到的，Java 的类型系统由以 `Object` 类为根的类层次结构组成。此外，还有用于数字和字符的简单类型，在某些地方，这些不是面向对象类层次结构的一部分是一个问题。因此，对于每个简单类型都定义了一个封装该简单类型的类。例如，封装\
    \ `int` 的 `Integer` 类。这些被称为包装类（wrapper classes），除了它们允许简单类型的变量像其他对象一样被使用外，包装类还为简单类型定义了许多有用的方法和常量。\n\
