    \ You must then use the methods min() and max() to print, respectively, the smallest\
    \ value and the biggest value in the list. Finally you should do sum, but these\
    \ numbers must be compared with their numerical deviation from 0.5. The result\
    \ could be:\n\n## 10 ANNOTATION\n\nAnnotations, are a form of metadata, and then\
    \ data about a program that is not part of the program itself. Annotations have\
    \ no direct effect on the execution of the program, but it is a way to write information\
    \ to the compiler, that can use annotations to detect errors, but there are also\
    \ annotations that are examined at runtime. Furthermore, there is software tools\
    \ that use annotations to generate code. Through the books you will see several\
    \ uses of annotations but I will only show one in this book. Consider again the\
    \ class *Person*, where I have only show the part of the code that is related\
    \ to annotations\n\n```java\npublic class Person implements Comparable<Person>\n\
    {\n    @Override\n    public String toString() {\n        return firstName + \"\
    \ \" + lastname;\n    }\n\n    @Override\n    public boolean equals(Object obj)\
    \ {\n        if (obj == null) return false;\n        if (getClass() == obj.getClass())\
    \ {\n            Person pers = (Person)obj;\n            return firstName.equals(pers.firstname)\
    \ && lastName.equals(pers.lastname);\n        }\n        return false;\n    }\n\
    \n    @Override\n    public int hashCode() {\n        return firstName.hashCode()\
    \ ^ lastName.hashCode();\n    }\n\n    @Override\n    public int compareTo(Person\
    \ pers) {\n        if (lastname.equals(pers.lastname)) return firstName.compareTo(pers.firstname);\n\
    \        return lastName.compareTo(pers.lastname);\n    }\n}\n```\n\nIn front\
    \ of four of the methods I have written @Override is an annotation. It tells the\
    \ compiler that the method is overridden from the base class or an interface,\
    \ and the compiler will report an error if, for example, I have spelled the name\
    \ of a method wrong. It remove a source of errors from the code, because you else\
    \ believe that a method has been overridden without it is.\n"
