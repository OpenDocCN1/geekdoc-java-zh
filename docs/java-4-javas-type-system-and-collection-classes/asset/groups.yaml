    \nJAVA 4：JAVA 的类型系统和集合类\n内部类\n\n# 4.2 示例：邮政编码\n\n我将展示一个搜索丹麦邮政编码的程序示例。用户可以输入邮政编码和城市名称，程序将找到匹配的元素；邮政编码必须以输入的值开头，而城市名称必须包含输入的值。在比较城市名称时，不应区分大小写。我首先从一个简单的邮政编码模型类开始：\n\
    \n```\npackage postprogram;\n\npublic class Post {\n    private String code; //\
    \ 邮政编码\n    private String city; // 城市名称\n\n    public Post(String code, String\
