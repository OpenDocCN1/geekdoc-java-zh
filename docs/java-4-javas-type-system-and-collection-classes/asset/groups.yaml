    \ key, Comparator<? super T> cmp)\n```\n\n正如我提到的二分搜索，关于它没有更多要说的了，但当然知道它已经存在是好的，所以没有必要自己实现。\n\
    \n## 组合\n\n这组方法包含两个方法：\n\n- `frequency()`：计算指定元素在 `Collection` 中出现的次数。\n- `disjoint()`：判断两个对象\
