    Finally if the quantifiers in the third column are used, the index is moved as
    far as possible. Because .* matches all characters, the index is moved to the
    end of the string – and past abc. The following search has no match:


    ```

    Regular expression: .*+abc

    Search string: xabcxxxxabc

    No match found

    ```


    There are also some options to specify where in the search string match must occur:


    - ^ the start of the line

    - $ the end of the line

    - \b the start of a word

    - \B not in the start of a word

    - \W the start of the search string

    - \G the start of the previous match

    - \z the start of the search string


