- md: "\n# JAVA 4: JAVA'S TYPE SYSTEM\nAND COLLECTION CLASSES\nEXCEPTION HANDLING\n\
    \nso that it raises an unchecked exception. Note that this means the method no\
    \ longer has a throws, and in turn means the method can be used outside of a try/catch.\n\
    \nIf you in your programs use unchecked exceptions, you should in the same as\
    \ with checked exceptions define your unchecked exception types that are classes\
    \ derived directly or indirectly from RuntimeException. You must remember, however,\
    \ that there are rarely good reasons to use unchecked exceptions. They are intended\
    \ for exceptions regarding serious errors where it will no longer make sense to\
