  mdcn: "\n\n# JAVA 4：JAVA 的类型系统\n与集合类\n\n作为 `ArrayList` 类的最后说明，请注意它实现了 `List` 接口，因此也实现了\
    \ `Collection` 和 `Iterable`。此外，该类实现了另外三个接口：`Serializable`、`Cloneable` 和 `RandomAccess`。第一个接口在前面讨论过，`Cloneable`\
    \ 我也提到过，而最后一个接口是一个没有方法的接口（这种接口被称为标记接口）。它告诉运行时系统 `ArrayList` 中的元素可以通过索引进行引用。\n\n\
    ## 9.3 LINKEDLIST\n\n它也是一个列表，该类实现 `List` 的方式与 `ArrayList` 。此外，它实现了 `Deque` 和 `Queue`\
    \ 接口。最后，它实现了 `Serializable` 和 `Cloneable`但没有实现 `RandomAccess`。该类还有其他 `ArrayList`\
    \ 没有的方法，但重要的是它是以不同的方式实现的，即双向链表。\n\n如果你创建一个 `LinkedList`：\n\n```java\nLinkedList<Integer>\
    \ list = new LinkedList();\n```\n\n你就拥有了一个空列表，你应该这样去思考它：\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_137_0.png)\n\
    \n即两个分别指向列表开始和结束的指针。列表为空意味着这两个指针都是 `null`。该类有一个 `add()` 方法，其工作方式与 `ArrayList`\
    \ 相同，并将元素添加到列表的末尾。如果你执行以下语句：\n\n```java\nlist.add(11);\nlist.add(13);\n```\n\n\
    列表的结构如图所示：\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_137_1.png)\n\n`LinkedList`\
    \ 由所谓的节点组成，其中每个节点包含一个数据项、一个指向前一个节点的指针，以及一个指向下一个节点的指针。第一个节点（数据元素 11）没有前驱节点，它指向前一个节点的指针为\
    \ `null`；同样，数据数据元素 13 的节点中指向下一个元素的指针也是 `null`。反之，节点 11 指向节点 13，而节点 13 指回节点 11。\n\
    \n与 `ArrayList` 相比，`LinkedList` 具有几个向向列表中添加项目的方法：\n\n```java\nlist.addFirst(2);\n\
    list.addLast(53);\nlist.add(3, 19);\n```\n\n这里的 `addFirst()` 和 `addLast()` 只是索引为\
    \ 0 的 `add()` 和不带索引的 `add()` 的特殊名称。如果执行上述语句，结果如下：\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_138_0.png)\n\
    \n![](img/b5644859a631cd6cec6e5143c5d485e6_138_1.png)\n\n`LinkedList` 的核心思想是，与\
    \ `ArrayList` 相比，在列表中间插入元素和删除元素是非常简单的。例如，如果你执行以下语句：\n\n```java\nlist.add(3, 17);\n\
    ```\n\n元素 17 必须插入在 13 和 19 之间：\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_139_0.png)\n\
    \n这意味着要创建一个新节点，然后改变 4 个指针，但你不需要像在 `ArrayList` 中那样将新元素插入位置右的所有元素都向右移动。\n\n假设元素\
    \ 17 已插入，你执行语句：\n\n```java\nlist.remove(3);\n```\n\n结果是：\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_139_1.png)\n\
    \n这意味着改变了两个指针，并且不再有项目 17 的引用，这些引用会被垃圾回收器移除。同样，其优势是相同的：删除需要的操作较少。元素的插入和删除都是简单的，但在列表两端进行插入或删除操作时需要特殊的实现。\n\
    \n`LinkedList` 的另一个属性是，它不像 `ArrayList` 那样分配可用容量并定期需要扩展；另一方面，每个节点都使用两个额外的指针指向邻居元素，这同样占据了空间，并且实际上意味着\
    \ `LinkedList` 使用的空间并不比 `ArrayList` 少——实际上还要多一点。关于在列表中间插入和删除元素，你应该意识到尽管这些操作在效率上相似，但它们仅包含移动几个指针；你应该意识到对列表的访问只能通过\
    \ `start` 和 `end` 两个指针进行，因此在原则上必须先找到要插入或删除元素的位置——该类没有实现 `RandomAccess` 接口。\n\n\
    `LinkedList` 最重要的特征是在列表开头插入和删除项目非常高效，列表末尾也是如此（与 `ArrayList` 一样）。这些是实现队列和栈所需的特性。\n\
    \n队列（Queue）是一种数据结构，你可以在其中添加和移除项目，使得移除的元素始终是最旧的元素——即在队列中时间最长的元素。通常，你有如下所示的队列：\n\
    \n![](img/b5644859a631cd6cec6e5143c5d485e6_140_0.png)\n\n在尾部指向的地方添加元素，并在头部指向的地方移除元素。由于\
    \ `LinkedList` 在列表末尾插入元素在头部移除元素性能良好，因此适用于实现队列，这表示该类实现了 `Queue` 接口。该接口定义了 6 个方法，除了异常外，还可以抛出：\n\
    \n- `offer()` 和 `add()`：向队列添加元素\n- `poll()` 和 `remove()`：从队列中移除元素\n- `peek()`\
    \ 和 `element()`：返回旧元素但不移除\n\n下面是一个创建一个队列并在队列中插入元素的方法（类似于上图）：\n\n```java\nprivate\
    \ static void test1() {\n    Queue<Integer> q = new LinkedList<>();\n    q.offer(2);\n\
    \    q.offer(3);\n    q.offer(5);\n    q.offer(7);\n    q.offer(11);\n    q.offer(13);\n\
    \    while (!q.isEmpty()) {\n        System.out.print(q.poll() + \" \");\n   \
    \ }\n}\n```\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_141_0.png)\n![](img/b5644859a631cd6cec6e5143c5d485e6_141_1.png)\n\
    \n栈是一种数据结构，你可以在其中添加和移除项目，使得移除的元素始终是最新的元素——即队列中最近的元素。通常，你有如下所示的栈：\n\n| top |\n\
    |---|\n| 13 |\n| 11 |\n| 7 |\n| 5 |\n| 3 |\n| 2 |\n\n在 `top` 指向的地方添加元素并在 `top`\
    \ 指向的地方移除元素。由于 `LinkedList` 在列表末尾插入元素在头部移除元素性能良好，因此适用于实现栈。以下方法展示了如何定义和使用栈：\n\n\
    ```java\nprivate static void test2() {\n    Stack<Integer> s = new LinkedList<>();\n\
    \    s.push(2);\n    s.push(3);\n    s.push(5);\n    s.push(7);\n    s.push(11);\n\
    \    s.push(13);\n    while (!s.isEmpty()) {\n        System.out.print(s.pop()\
    \ + \" \");\n    }\n}\n```\n\n还有另一个集合类 `ArrayDeque`，它通过 `ArrayList` 实现 `deque`。在栈方面，它稍微更高效。\n\
    \n## 练习 10\n\n编写一个可以调用 `ListProgram` 的程序。该程序的操作应与上面的 `test1()` 方法相同，即向列表添加 10000\
    \ 个随机整数，并遍历列表确定数字之和。程序必须打印这两种操作各所需的时间，但这次列表必须是 `LinkedList<Integer>`。将结果与执行 `test01()`\
    \ 方法的结果进行比较。\n\n## 问题 3\n\n你应该编写一个名为 `StackProgram` 的程序，用于在作为栈使用时测试 `Deque`。添加一个简单的泛型打印方法：\n\
    \n```java\nprivate static <T> void print(T[] arr)\n{\n}\n```\n\n该方法必须在一行打印数组 `arr`\
    \ 的所有元素并用空格分隔。\n\n可以使用两个栈对数组进行排序，可以使用以下算法：\n\n```\n对于数组中的每个元素 t i 重复\n  当 t i\
    \ 小于左栈顶部元素时\n  {\n    从左栈弹出元素并推入右栈\n  }\n  当 t 大于右栈顶部元素时\n  {\n    从右栈弹出元素并推入左栈\n\
    \  }\n  将 t 推入左栈\n  当左栈不为空时\n  {\n    从左栈弹出元素并推入右栈\n  }\n  从从开始到结束遍历数组\n  {\n\
    \    从右栈弹出元素并插入数组\n  }\n```\n\n"
