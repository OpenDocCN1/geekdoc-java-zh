- md: "\n# JAVA 4: JAVA'S TYPE SYSTEM\nAND COLLECTION CLASSES\n\nAs a final note to\
    \ the class ArrayList, please note that it implements the interface List and thus\
    \ Collection and Iterable. Moreover, the class implements three other interfaces:\
    \ Serializable, Cloneable and RandomAccess. The first interface is discussed earlier,\
    \ Cloneable I also mentioned earlier, and the last interface is a simple interface\
    \ with no methods (such as an interface is called a marker interface). It tells\
    \ the runtime system that the elements in an ArrayList can be referenced by an\
    \ index.\n\n## 9.3 LINKEDLIST\n\nIt's also a list, and the class implements in\
    \ the same way as an ArrayList List. In addition, it implements the interfaces\
    \ Deque and Queue. Finally, it implements Serializable and Cloneable but not RandomAccess.\
    \ The class also has other methods than an ArrayList, but what matters is that\
    \ it is implemented in a different way, as a double linked list.\n\nIf you create\
    \ a LinkedList:\n\n```java\nLinkedList<Integer> list = new LinkedList();\n```\n\
    \nyou have an empty list, which you should think about in the following way:\n\
    \n![](img/b5644859a631cd6cec6e5143c5d485e6_137_0.png)\n\nthat is two pointers\
    \ pointing respectively to start and end of the list. That the list is empty means\
    \ that the two pointers are both null. The class has an add() method that works\
    \ the same way as in an ArrayList and adds an element to the end of the list.\
    \ If you perform the following statements:\n\n```java\nlist.add(11);\nlist.add(13);\n\
    ```\n\nthe picture of the list is as follows:\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_137_1.png)\n\
    \nA LinkedList consists of so-called nodes, where a node includes a data item\
    \ and a pointer to the previous node, and a pointer to the next node. The first\
    \ node (data element 11) has no predecessor, and its pointer to the previous node\
    \ is null, and, similarly, the pointer to the next item in the node with the data\
