    \ in turn can result in code that is easy to read and understand.\n\nIt sounds\
    \ simple to define inner classes, and it is, but there is a lot of details that\
    \ you need to know, and that's what this chapter covers. Basically, you can define\
    \ classes as follows:\n\n```\nclass OuterClass\n{\n    static class NestedClass\n\
    \    {\n    }\n    class InnerClass\n    {\n    }\n}\n```\n\nwhere the class OuterClass\
    \ has two inner classes. The difference is that one is static, while the other\
    \ is not. A static inner classes are usually called a nested class, while a non\
    \ static is called an inner class. An inner class can refer to all in the outer\
    \ class regardless of whether it is private or not. A nested, in turn, can not\
    \ refer to the instance variables or non-static methods in the outer class, unless\
    \ it has an object. Similar to other static members in a class, references to\
    \ a nested class must be done via the name of the outer class, for example something\
    \ like the following:\n\n```\nOuterClass.NestedClass obj = new OuterClass.NestedClass();\n\
    ```"
