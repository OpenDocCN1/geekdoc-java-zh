  - "[PAGE 112]\n\n# JAVA 4: JAVA'S TYPE SYSTEM\nAND COLLECTION CLASSES GENERIC TYPES\n\
    \nIt is possible to use wild cards, which is a ? and indicates an unknown type.\
    \ It can be used\nover more generic methods. Consider the following code:\n\n\
    ```\nprivate static void test11() {\n    print1(create(2, 3, 3.14, 1.42));\n \
    \   // print1(create(2, 3, 5, 7));\n    // print1(create(2.1, 3.2, 5.3, 7.4));\n\
    }\n```\n\n```\nprivate static <T> ArrayList<T> create(T ... values) {\n    ArrayList<T>\
    \ list = new ArrayList();\n    for (T t : values) list.add(t);\n    return list;\n\
    }\n```\n\n```\nprivate static void print1(ArrayList<Number> list) {\n    for (Number\
    \ n : list) System.out.print(n + \" \");\\n    System.out.println();\n}\n```\n\
    \nwhich can be translated and run, and it is probably not so strange. When create()\
    \ is\ncalled, there are 4 actual parameters that because of the auto boxing are\
    \ converted into\nobjects of type Integer and type Double. Because of the type\
    \ inference the method\ncreate() creates an ArrayList of objects of the type Number\
    \ and thus an object of the type\nArrayList<Number>. This object can be transferred\
    \ as a parameter to the method print1().\nIf you now the method test11() removes\
    \ the first comment, you get a compiler error. create()\nis called again with\
    \ 4 actual parameters, but this time they are boxed as objects of the type\nInteger.\
    \ The method will return an object to the type ArrayList<Integer>, and as explained\n\
    in the beginning of this section, it is not compatible with the parameter to print1().\
    \ The problem is solved\n\n```\nprivate static void print1(ArrayList<? extends\
    \ Number> list) {\n    for (Number n : list) System.out.print(n + \" \");\\n \
    \   System.out.println();\n}\n```\n\nThe method print1() is now called with a\
    \ parameter of type ArrayList<T> where T inherits\n(or implements) Number. The\
    \ type Number is called an upper bound."
  - "[PAGE 113]\n\n# JAVA 4: JAVA'S TYPE SYSTEM\nAND COLLECTION CLASSES GENERIC TYPES\n\
    \nThe wildcards do not needs to be bounded, and you can write a method like the\
    \ following:\n\n```\nprivate static void print2(ArrayList<?> list)\n{\n  for (Object\
    \ obj : list) System.out.print(obj + \" \");\n  System.out.println();\n}\n```\n\
    \nIt will accept any ArrayList<T> as a parameter. Unbounded wildcards has not\
    \ so many uses but can be used if the method only perceive an element as an Object.\n\
    \nA wild card may also have a lower bound:\n\n```\nprivate static void print3(ArrayList<?\
    \ Integer> list)\n{\n  for (int i = 0; i < list.size(); ++++) System.out.print(list.get(i)\
    \ + \" \");\n  System.out.println();\n}\n```\n\nThe syntax is simple enough and\
    \ that the method as the parameter can use ArrayList<T> where the parameter T\
    \ is a type of Integer. This means that Integer must inherit or implement T. As\
    \ an example you can write:\n\n```\nprivate static void test3()\n{\n  print3(create(2,\
    \ 3, 3.14, 1.42));\n  print3(create(2, 3, 5, 7));\n  ArrayList<Double> list =\
    \ create(2.1, 3.2, 5.3, 7.4);\n  print3(list);\n}\n```\n\nThe first create() as\
    \ mentioned as ArrayList<Number>, which may be used as a parameter to print3(),\
    \ because Integer extends Number. The second create() creates an ArrayList<Integer>\
    \ that can also be used as a parameter, but the third creates an ArrayList<Double>,\
    \ which is not a supersype of ArrayList<Integer>. You must specify that if you\
    \ changed the last line to\n\n```\nprint3(create(2.1, 3.2, 5.3, 7.4));\n```\n\n\
    then things would work. The compiler will see that the method print3() requires\
    \ an ArrayList<? super Integer> and the parameters to create() are boxed to objects\
    \ of the type Double, but because of the type of infernce between Double and Integer,\
    \ the compiler will create an ArrayList<Number>."
- md: "\n## JAVA 4: JAVA'S TYPE SYSTEM AND COLLECTION CLASSES\n\n## LAMBDA EXPRESSIONS\n\
    \n## 8 LAMBDA EXPRESSIONS\n\nIf you in Java want to transfer a method as a parameter\
    \ to another method, this is by means of an interface. An interface is a type\
    \ and can be specifically used as a parameter to a method. Before I show how,\
    \ I would say a little more about anonymous classes, which as the name says is\
    \ a class that has no name. I have already mentioned anonymous classes above in\
    \ connection with the iterator pattern.\n\n## 8.1 ANONYMOUS CLASSES\n\nAs an example\
    \ I will use the types that I have seen in the book Java 1:\n\n```java\npackage\
    \ lambda;\n\npublic interface Note\n{\n    public int getValue();\n    public\
    \ void print();\n}\n```\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_114_0.png)\n\
    \n# What do you want to do?\n\nNo matter what you want out of your future career,\
    \ an employer with a broad range of operations in a load of countries will always\
    \ be the ticket. Working within the Volvo Group means more than 150,000 friends\
    \ and colleagues in more than 80 countries over the world. We offer great career\
    \ opportunities - check out the Career section at our site www.volvogroup.com\
    \ We look forward to getting to know you!\n\n## JAVA 4: JAVA'S TYPE SYSTEM AND\
    \ COLLECTION CLASSES\nLAMBDA EXPRESSIONS\n\n```java\npackage lambda;\n\npublic\
    \ abstract class BankNote implements Note {\n    private int value;\n\n    public\
    \ BankNote(int value) {\n        this.value = value;\n    }\n\n    public int\
    \ getValue() {\n        return value;\n    }\n```\n\nIt is types that define banknotes.\
    \ In Java 1, I also defined specific classes for Danish banknotes, but here I\
    \ will show how these classes can be defined as anonymous classes. For an example\
    \ you can define a 50 kr. banknote as follows (where all the code are written\
    \ on a single line):\n\n```java\nNote n1 = new Note() { public int getValue()\
    \ { return 50; }\npublic void print() {\n    System.out.println(\"50 kr., Sallingsundbroen\
    \ og Skarsalling-karret\"); } };\n```\n\nAn anonymous class is defined by an interface\
    \ (possibly a class), and the syntax is to write the interface name followed by\
    \ parentheses:\n\n```java\nNote n1 = new Note() { ... };\n```\n\nand in the following\
    \ block you then write the code for the methods that the interface defines. The\
    \ class of the object in question has no name, and an anonymous class must therefore\
    \ always be defined as part of an expression.\n\n## JAVA 4: JAVA'S TYPE SYSTEM\
    \ AND COLLECTION CLASSES\nLAMBDA EXPRESSIONS\n\nAnonymous classes are suitable\
    \ and can simplify the code situations in which you only need a single object\
    \ of a particular type. If the job had anything to do with banknotes, it would\
    \ hardly be the case and the above and the following examples are also intended\
    \ merely to show the syntax. Anonymous classes is most justified in those cases\
    \ the interface is used to define a few or perhaps one method. The advantage is\
    \ of course that in a program – especially a GUI program – you do not have to\
    \ write a series of simple classes that other to implement a single method, but\
    \ there is also a disadvantage, as the code easily becomes difficult to read and\
    \ even more difficult to write correct. The last you can help a little by not\
    \ writing the code on a single line:\n\n```java\nNote n2 = new Note()\n{\n   \
    \ public int getValue()\n    {\n        return 100;\n    }\n\n    public void\
    \ print()\n{\n        System.out.println(\"100 kr., Den gamle Lilleælbro og Hindsgavl-dolken\"\
    );\n    }\n}\n```\n\nIt is something more readable, but comparing it with the\
    \ fact that an anonymous class always occur in an expression, and in most cases\
    \ it will be an assignment as above or as a parameter to a method, it is clear\
    \ that you ends up with code which is hard to read. It is exactly what the lambda\
    \ expression should do better.\n\nBelow is another example of an anonymous class,\
    \ but this time the class is defined on the basis of the abstract class BankNote.\n\
    \n```java\nNote n3 = new BankNote(200) {\n    public void print() {\n        System.out.println(\"\
    200 kr., Knippelsbro og Langstrup\");\n    }\n}\n```\n\nThe syntax is essentially\
    \ the same, but the example should show that you can pass values to the constructor,\
    \ and the anonymous class only needs to implement the abstract methods of the\
    \ BankNote. Below is a third example:\n\n```java\nNote n4 = new BankNote(500)\
    \ {\n    public void print() {\n        System.out.println(\"500 kr., Dronning\
    \ Alexandrines bro\");\n    }\n}\n```\n\n#### JAVA 4: JAVA'S TYPE SYSTEM AND COLLECTION\
    \ CLASSES\nLAMBDA EXPRESSIONS\n\nBelow is a method that has Note objects as parameters:\n\
    \n```java\nprivate static void print(Note... notes) {\n    int sum = 0;\n    for\
    \ (Note n : notes) {\n        sum += n.getValue();\n    }\n    System.out.println(\"\
    Value: \" + sum);\n}\n```\n\nThe method is simple and does nothing but print the\
    \ sum of their values. The parameter type is defined by an interface and the actual\
    \ parameters must naturally be created on the basis of concrete classes. Below\
    \ is an example of calling the method, and you will primarily notice that one\
    \ of the parameters is defined as an anonymous class written directly in the call\
    \ of the method:\n\n```java\nprint(n1, n2, n3, n4, new BankNote(1000) { \n   \
    \ public void print() {\n        System.out.println(\"1000 kr., Storeæltsbro og\
    \ Voggen\"); \n    } \n});\n```\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_117_0.png)\n\
    \n## 8.2 METHODS AS PARAMETERS\n\nIn other programming languages, such as C++,\
    \ you can transfer methods as parameters to another method. This is not done directly\
    \ in Java, and it is necessary to transfer a method encapsulated in an object.\
    \ Consider an example, the following interface, which defines a method that has\
    \ an int parameter and returns a boolean:\n\n```java\ninterface ISelector {\n\
    \  boolean select(int t);\n}\n```\n\nBelow is a method that prints the elements\
    \ of an int array, but only the elements where ISelector object returns true:\n\
    \n```java\nprivate static void print(int[] arr, ISelector s) {\n  for (int t :\
    \ arr) {\n    if (s.select(t)) {\n      System.out.print(t + \" \");\n    }\n\
    \  }\n  System.out.println();\n}\n```\n\nIt is thus an example of how to transfer\
    \ a method as a parameter to another method. Suppose there are defined the following\
    \ array:\n\n```java\nint[] arr = new int[20];\nfor (int i = 0; i < arr.length;\
    \ i++) arr[i] = i;\n```\n\nand assume that you use the above method to print all\
    \ 2-digit numbers. You must then use an ISelector object as a parameter, and to\
    \ create such an object, you must have a class:\n\n```java\nclass Select2 implements\
    \ ISelector {\n  public boolean select(int t) {\n    return t > 9 && t < 100;\n\
    \  }\n}\n```\n\nYou can then print the numbers as follows:\n\n```java\nprint(arr,\
    \ new Select2());\n```\n\n## JAVA 4: JAVA'S TYPE SYSTEM AND COLLECTION CLASSES\n\
    LAMBDA EXPRESSIONS\n\nIf you want to print all prime numbers, you can write the\
    \ following class that implements the interface ISelector:\n\n```java\nclass Primes\
    \ implements ISelector {\n    public boolean select(int t) {\n        if (t ==\
    \ 2 || t == 3 || t == 5) return true;\n        if (t < 11 || t % 2 == 0) return\
    \ false;\n        for (int n = 3, m = (int)Math.sqrt(t) + 1; n <= m; n += 2) if\
    \ (t % n == 0)\n            return false;\n        return true;\n    }\n}\n```\n\
    \nand you can print the primes with the following statement:\n\n```java\nprint(arr,\
    \ new Primes());\n```\n\nIt is clear that in the situation where you want to transfer\
    \ a method as a parameter to another method it is obvious to use an anonymous\
    \ class. If you again wish to print all 2-digit numbers, you can use the following\
    \ statement:\n\n```java\nprint(arr, new ISelector() {\n    public boolean select(int\
    \ t) { return t > 9 && t < 100; }\n});\n```\n\nwhere the ISelector type is defined\
    \ on the basis of an anonymous class. The class Select2 is unnecessary. Similarly,\
    \ one can print the prime numbers in the following way:\n\n```java\nprint(arr,\
    \ new ISelector() {\n    public boolean select(int t) {\n        if (t == 2 ||\
    \ t == 3 || t == 5) return true;\n        if (t < 11 || t % 2 == 0) return false;\n\
    \        for (int n = 3, m = (int)Math.sqrt(t) + 1; n <= m; n += 2) if (t % n\
    \ == 0)\n            return false;\n    }\n});\n```\n"
  mdcn: "\n## JAVA 4：类型系统与集合类\n\n## Lambda 表达式\n\n## 8 Lambda 表达式\n\n在 Java 中，如果你想将一个方法作为参数传递给另一个方法，可以通过接口来实现。接口是一种类型，可以专门作为方法的参数使用。之前已经提到过**匿名类**（anonymous\
    \ classes），它们是没有名字的。\n\n## 8.1 匿名类\n\n作为一个示例，我们将使用接口：\n\n```java\npackage lambda;\n\
    \npublic interface Note {\n    int getValue();\n    void print();\n}\n```\n\n\
    # 你想做什么？\n\n无论你未来的职业如何，在广泛的范围内总会有门票。在 Volvo 集团工作意味着超过 150,000 名朋友和同事。我们提供极佳职业机会——查看我们的网站（此处省略\
    \ URL）。\n\n## JAVA 4：类型系统与集合类\nLambda 表达式\n\n```java\npackage lambda;\n\npublic\
    \ abstract class BankNote implements Note {\n    private int value;\n\n    public\
    \ BankNote(int value) {\n        this.value = value;\n    }\n\n    public int\
    \ getValue() {\n        return value;\n    }\n}\n```\n\n这是定义钞票的类型。在 Java 中，我也定义了特定的类，但在这里将展示如何作为匿名类定义这些类。例如，你可以如下定义一个\
    \ 50 kr 的钞票（所有代码写在一行）：\n\n```java\nNote n1 = new Note() { \n    public int getValue()\
    \ { return 50; }\n    public void print() { System.out.println(\"50 kr., Sallingsundbroen\"\
    ); }\n};\n```\n\n匿名类是由接口（或者可能是类）定义的，语法是写下接口名后跟括号：\n\n```java\nNote n1 = new Note()\
    \ { ... };\n```\n\n在接后的块中，你编写接口定义的方法代码。对象的类没有名称，因此匿名类必须作为表达式的一部分来定义。\n\n## JAVA\
    \ 4：类型系统与集合类\nLambda 表达式\n\n匿名类适用于你只需要特定类型的单个对象的情况，这可以简化代码。如果任务与钞票有关，那么情况并非如此，上述和随后的示例仅用于展示语法。当接口用于定义一个或一个方法时，匿名类是最为合理的。\n\
    \n其优点是，在程序中（尤其是 GUI 程序）中，你不需要编写一系列实现单个方法的简单类；但也有缺点，代码很容易变得难以阅读，编写起来也更加困难。最后，通过不将代码写在一行可以稍微改善这一点：\n\
    \n```java\nNote n2 = new Note() {\n    public int getValue() {\n        return\
    \ 100;\n    }\n\n    public void print() {\n        System.out.println(\"100 kr.,\
    \ Den gamle Lilleælbro og Hindsgavl-dolken\");\n    }\n}\n```\n\n虽然可读性好了一点，但考虑到匿名类总是出现在表达式中，且在大多数情况下它将作为上面的赋值或方法的参数，可以显然，你最终得到的是难以阅读的代码。这正是\
    \ Lambda 表达式应该做得更好的地方。\n\n下面是另一个匿名类的示例，但这次类是基于抽象类 `BankNote` 定义的。\n\n```java\n\
    Note n3 = new BankNote(200) {\n    public void print() {\n        System.out.println(\"\
    200 kr., Knippelsbro og Langstrup\");\n    }\n}\n```\n\n语法基本相同，但示例应该展示你可以向构造函数传递值，而匿名类只需要实现\
    \ `BankNote` 的抽象方法。下面是第三个示例：\n\n```java\nNote n4 = new BankNote(500) {\n    public\
    \ void print() {\n        System.out.println(\"500 kr., Dronning\");\n    }\n\
    }\n```\n"
