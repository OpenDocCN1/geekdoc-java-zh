    \n# JAVA 4：JAVA 的类型系统\n与集合类\n\n泛型类型\n\n# 7 泛型类型\n\n在本章中，我将介绍泛型类型和泛型方法。事实上，我已经多次使用泛型类型，例如\
    \ `ArrayList<T>`，它指示了列表应该包含的对象类型。同样，我使用过几个泛型接口，例如 `Comparable<T>`。在本节中，我将展示如何让用户定义的类型变为泛型。\n\
    \n我会从一个表示循环缓冲区（circular buffer）的类开始。缓冲区在 Java 术语中称为集合（collection），它可以包含对象，并关联了操作内容的方法。缓冲区可以通过多种方式实现，但在这里将查看所谓的循环缓冲区，即一个具有特定数量对象的缓冲区。这种缓冲区可以通过数组轻松实现：\n\
    \n![](img/b5644859a631cd6cec6e5143c5d485e6_84_0.png)\n\n> “我学了 16 年英语……但我最终学会了说中文”\n\
    > Jane，建筑师\n\n基本上，缓冲区有两个关联的操作，称为 `insert()` 和 `remove()`，其中一个将元素插入缓冲区，而另一个移除最旧的元素。上面的图展示了一个空缓冲区，`tail`\
    \ 指向下一个应该插入元素的索引。同样，`head` 是下一个要移除元素的索引。初始状态下，缓冲区为空，指向同一个地方。以下是插入 7 个元素后的缓冲区样子：\n\
    \n![](img/b5644859a631cd6cec6e5143c5d485e6_85_0.png)\n\n如果移除 2 个元素——`remove()`\
    \ 执行了 2 次：\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_85_1.png)\n\n插入 7 个元素后的缓冲区样子——`insert()`\
    \ 执行了 7 次：\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_85_2.png)\n\n插入 7 个元素后的缓冲区样子——`insert()`\
    \ 执行了 7 次：\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_85_3.png)\n\n插入 7 个元素后的缓冲区样子——`insert()`\
    \ 执行了 7 次：\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_85_4.png)\n\n# JAVA 4：JAVA\
    \ 的类型系统\n与集合类\n泛型类型\n\n没什么需要解释的，实现是非常有效的。`empty()` 和 `full()` 方法以及基础的 `insert()`\
    \ 和 `remove()` 方法也是有效的，因为它们除了检查异常之外只执行了一些操作。你还应该注意 `peek()` 方法，它返回缓冲区中最旧的元素，但不将其移除。\n\
    \n```java\npackage generic;\npublic class IntBuffer {\n    private int[] buff;\n\
    \    private int head = 0;\n    private int tail = 0;\n    private int count =\
    \ 0;\n\n    public IntBuffer(int n) {\n        buff = new int[n];\n    }\n\n \
    \   public int getCount() {\n        return count;\n    }\n\n    public boolean\
    \ empty() {\n        return count == 0;\n    }\n\n    public boolean full() {\n\
    \        return count == buff.length;\n    }\n\n    public int peek() throws Exception\
    \ {\n        if (empty()) throw new Exception(\"The buffer is empty\");\n    \
    \    return buff[head];\n    }\n}\n```\n\n```java\npublic int remove() throws\
    \ Exception {\n    if (empty()) throw new Exception(\"The buffer is empty\");\n\
    \    int elem = buff[head];\n    head = next(head);\n    --count;\n    return\
    \ elem;\n}\n\npublic void insert(int elem) throws Exception {\n    if (full())\
    \ throw new Exception(\"The buffer is full\");\n    buff[tail] = elem;\n    tail\
    \ = next(tail);\n    ++count;\n}\n\nprivate int next(int n) {\n    return (n +\
    \ 1) % buff.length;\n}\n```\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_87_0.png)\n\
    \n# JAVA 4：JAVA 的类型系统\n与集合类\n泛型类型\n\n示例方法 `test01()` 创建了一个可以容纳五个数字的 `IntBuffer`。程序将循环，随机插入一个数字或移除一个数字。某些操作将失败，因为缓冲区可能是满或空的。\n\
    \n```java\nprivate static void test01() {\n{\n    IntBuffer buffer = new IntBuffer(5);\n\
    \    for (int i = 0; i < 100; ++i) {\n        try {\n            System.out.println(\"\
    << \" + buffer.remove());\n        }\n        catch (Exception ex) {\n       \
    \     System.out.println(ex.getMessage());\n        }\n        else {\n      \
