    \nThe name circular buffer is derived from the indices that wraps around when\
    \ they reach the end of the array.\n\nIt is simple to implement such a data structure,\
    \ and the first and foremost challenge is to keep track of when the buffer is\
    \ full and empty. Of course one can not add elements to a full buffer, as you\
    \ cannot remove elements from an empty buffer. The problem can be solved in several\
    \ ways, but I will use a simple counter that counts the number of elements. This\
    \ requires an additional variable, but it is, turn, easy and efficient to implement\
    \ each method, as it is easy to ask the buffer about the number of elements it\
    \ contains. Following these considerations, you can implement a buffer to integers\
    \ as follows:\n\n```\npackage generic;\npublic class IntBuffer {\n    private\
    \ int[] buff; // array to the buffer\n    private int head = 0; // index to the\
    \ place in front of the first element\n    private int tail = 0; // index of the\
    \ last element of the buffer\n    private int count = 0; // number of elements\
    \ in the buffer\n\n    public IntBuffer(int n) {\n        buff = new int[n];\n\
    \    }\n\n    public int getCount() {\n        return count;\n    }\n\n    public\
    \ boolean empty() {\n        return count == 0;\n    }\n\n    public boolean full()\
    \ {\n        return count == buff.length;\n    }\n\n    public int peek() throws\
    \ Exception {\n        if (empty()) throw new Exception(\"The buffer is empty\"\
    );\n        return buff[head];\n    }\n}\n```"
