  - "[PAGE 110]\n\n# JAVA 4: JAVA'S TYPE SYSTEM\nAND COLLECTION CLASSES\n\n# 7.5 GENERIC\
    \ TYPES AND INHERITANCE\n\nIn most cases, the use of generic types are without\
    \ major problems, the compatibility\nof inheritances is not quite what you might\
    \ expect. If, for example you have a method\n\n```\nvoid show(Number t) { ...\
    \ }\n```\n\nso you can immediately transfer an Integer, a Long, a Float as an\
    \ actual parameter to\nshow(), since they all specifically is a Number. Consider,\
    \ however, the following methods:\n\n```\nprivate static void test09() {\n   \
    \ Point<Integer> p = new Point(1, 2);\n    show(p);\n}\n```\n\n```\nprivate static\
    \ void show(Point<Number> p) {\n    System.out.println(p);\n}\n```\n\nIf you tries\
    \ to compile these methods, you get an error that says that p is not compatible\
    \ with\nPoint<Number>. It would be expected when an Integer is compatible with\
    \ Number\nbecause Integer inherits Number, Point<Integer> does not inherit the\
    \ Point<Number>\nand therefore the types are not compatible.\n\nFor the sake of\
    \ the following, it is necessary to look at type inference. It deals with how\n\
    the compiler treats the call of a method and the definitions of objects to determine\
    \ the\ntype of the arguments and determine whether the call is possible. In this\
    \ context, the\ncompiler attempts to determine the most specific type which can\
    \ be used for all arguments.\nThis has importance with generic methods and is\
    \ best explained with an example:\n\n```\nprivate static void test10() {\n   \
    \ Number t1 = value(new Integer(23), new Double(3.14));\n    // Float t2 = value(new\
    \ Integer(23), new Double(3.14));\n}\n```\n\n```\nprivate static <T> T value(T\
    \ t1, T t2) {\n    return rand.nextBoolean() ? t1 : t2;\n}\n```"
