    # JAVA 4: JAVA''S TYPE SYSTEM

    AND COLLECTION CLASSES


    A HashSet is implemented by hashing, which is a technique in which an element
    in a collection can be found by a calculation. Internal, the collection is an
    array of sufficient size and the individual objects are placed in the array. When
    you add a new object, the class calculates using an algorithm where the object
    must be placed, and it is placed there (if the place is not already used). Similarly,
    if you want to get a specific object in the collection, the class just calculate
    the object''s place and test whether it exists. There is direct access to the
    individual objects without any search, and that is exactly what makes the data
    structure extremely effective.


    An Object has a method called hashCode(), which returns an int. When objects of
    a given type can be stored in a HashSet, the object''s class must override the
    method hashCode() with value semantic. It is a requirement that two objects that
    equals() must also have the same hashCode(), but it is also the formal requirements.
    On the other hand, it is the programmer''s responsibility to ensure that hashCode()
    is implemented in such a way that the method returns values that are uniformly
    distributed. It should be particularly noted that it is not a requirement that
    the two objects with the same hashCode() equals().


    ![](img/b5644859a631cd6cec6e5143c5d485e6_147_0.png)'
