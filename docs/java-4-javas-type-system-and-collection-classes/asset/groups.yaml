    ## JAVA 4: JAVA''S TYPE SYSTEM

    PACKAGES AND COLLECTION CLASSES


    ## 11 PACKAGES


    A Java program consists of many classes and interfaces. First, the classes that
    yourself write, and the classes that come from the Java API. To avoid name matches
    and to increase clarity, classes and other types are placed in packages. For example,
    Java''s classes are divided into a very large number of packages. The base package
    is java.lang, and it contains all the basic classes such as String, System, Object,
    the wrapper classes etc. Classes in this package are immediately available for
    the runtime system, and you do not have to do anything to use these classes. These
    are different from classes in other packages. As an example, I have often used
    the class Random. This class is in the package java.util, which name is a package
    of miscellaneous classes or tools. This means that the full name of the class
    is java.util.Random. If you have to create an object, you can write:


    ```java

    java.util.Random rand = new java.util.Random();

    ```


    When it is difficult to write (you have to write much), and it also makes the
    code harder to read, you can specify import statement:


    ```java

    import java.util.Random;

    ```


    which tells what the class Random means, and so you can just write the class name:


    ```java

    Random rand = new Random();

    ```


    One should note that it is also the thing that an import means and it is not a
    question that anything is imported into the program, but only that the class Random
    is directly available. When programs and classes use many classes from the Java
    API, it can lead to many import statements, and therefore it is allowed to write


    ```java

    import java.util.*;

    ```


    which shortly means that you can directly use all the classes and interfaces in
    the package java.util. It''s something that is my opinions and arguments for and
    against, but I usually use the short notation.


    When you in a NetBeans project create a new class, it is automatically placed
    in a package with a package statement as the first statement:


    ```java

    package projectName;

    ```


    The package name is by default the project name, but it need not be the case.
    A package statement must be the first statement in a source file (except for a
    possible comment), and the file must contain import statements as the next statements.
    A Java source file generally contains only one type and can contain only one public
    type, which must have the same name as the source file. If for example you have
    the type


    ```java

    public class Str

    {

    ```


    the source file must be called Str.java and written with uppercase and lowercase
    letters as shown here. The file can contain several types, but it is generally
    advised not to do so, although there are sensible exceptions. When a file has
    several types, they cannot be public, and therefore have package visibility.


    Until this place, my projects have only one package, but if you write a large
    program with many classes, I often choose to place classes into multiple packages,
    so that classes on the same concept are in the same package.


    ## JAVA 4: JAVA''S TYPE SYSTEM

    AND COLLECTION CLASSES


    ## 12 FINAL EXAMPLE


    In this chapter I will show the development of a simple GUI program. It''s not
    a large program, and the goal is to show the use of some of the concepts discussed
    in this book and to finish with an example where the focus again is on the process.


    The process is described in relative detail, and the program is developed according
    to the MVC pattern. This pattern and in general the guidelines regarding the development
    of a program is first treated in the book Java 7, but you should easily be able
    to follow the process without having read Java 7. If in the description of the
    process is referred to concepts that you are not quite with, just ignore it.


    ### 12.1 THE TASK


    The task is to write a program that simulates a simple game, which consists of
    a square of 5×5 pieces arranged in random order. One of the pieces is empty, and
    you can move a piece by moving a neighbor to the empty piece. In the case below
    (the square on the left) you can then move the pieces H, E, L and J (you cannot
    move diagonally). The game is solved when the pieces are arranged as shown in
    the example to the right.


    ![](img/b5644859a631cd6cec6e5143c5d485e6_165_0.png)


    ## JAVA 4: JAVA''S TYPE SYSTEM

    AND COLLECTION CLASSES


    ## FINAL EXAMPLE


    | K | G | V | M | R | A | B | C | D | E |

    |---|---|---|---|---|---|---|---|---|---|

    | I | S | X | U | F | F | G | H | I | J |

    | C | O | A | E | T | K | L | M | N | O |

    | Q | Y | H | L | P | Q | R | S | T | |

    | N | D | P | J | B | U | V | X | Y | |


    You must assign a high score to the program to save the three-best results. A
    result consists of the number of moves, used to solve the square, and it is therefore
    to solve the square by moving as few pieces as possible.


    The square is basically a 5×5 square, but it might be possible to configure the
    program that you can also play with a 3×3 square, a 7×7 square and a 9×9 square.


    ## PROJECT START


    I created a folder puzzles, and it will contain all the files concerning this
    project. I have also created a subfolder.


    ### 12.2 ANALYSIS


    In this case, the analysis is simple, since the task is simple, and the user describes
    the task. In the program, the pieces are symbolized by letters. There are few
    issues to be clarified.


    As the program''s philosophy is entertainment and results cannot be significant,
    it is agreed that high score lists are saved as regular files, and the program
    does not require database access.

    '
