    ## JAVA 4: JAVA 的类型系统与集合类\n\n### 7.5 泛型类型与继承\n\n在大多数情况下，泛型类型的使用没有主要问题，但继承的兼容性并不如你预期的那样。例如，如果你有一个方法：\n\
    \n```java\nvoid show(Number t) { ... }\n```\n\n你可以立即将 `Integer`、`Long`、`Float`\
    \ 作为实际参数传递给 `show()`，因为它们具体来说都是 `Number`。然而，请考虑以下方法：\n\n```java\nprivate static\
    \ void test09() {\n    Point<Integer> p = new Point(1, 2);\n    show(p);\n}\n\
    ```\n\n```java\nprivate static void show(Point<Number> p) {\n    System.out.println(p);\n\
    }\n```\n\n如果你尝试编译这些方法，你会得到一个错误，说 `p` 与 `Point<Number>` 不兼容。当 `Integer` 与 `Number`\
    \ 兼容时是可以预期的，因为 `Integer` 继承自 `Number`；但 `Point<Integer>` 没有继承 `Point<Number>`，因此这些类型是不兼容的。\n\
    \n为了后续内容，有必要查看类型推断。它涉及到编译器如何处理方法调用和对象定义，以确定参数的类型并判断该调用是否可行。在此上下文中，编译器尝试确定可用于所有参数的最特定类型。这对于泛型方法非常重要，通过一个示例解释得最为清楚：\n\
    \n```java\nprivate static void test10() {\n    Number t1 = value(new Integer(23),\
    \ new Double(3.14));\n    // Float t2 = value(new Integer(23), new Double(3.14));\n\
    }\n```\n\n```java\nprivate static <T> T value(T t1, T t2) {\n    return rand.nextBoolean()\
    \ ? t1 : t2;\n}\n```\n\n该示例并没有执行有趣的操作，只需证明它是可以正确编译的合法代码。`value()` 是一个带有一个类型参数的泛型方法。该方法有两个此类型的参数，并返回这些对象的泛型结果。`test10()`\
    \ 中的第一个语句是合法的，因为 `Integer` 和 `Double` 都继承自 `Number`。因此它们通过类型推断，编译器可以编译代码，类型参数在运行时为\
    \ `Number`。反之，`test10()` 中的最后一个语句是不允许的，因为 `Float` 不是 `Integer` 或 `Double` 的类型。略有不同的类型推断是上下文编译器能够看到用于类型参数的类型的问题。这就是为什么你可以调用泛型方法\
    \ `linSearch()`：\n\n```java\nSystem.out.println(Tools.linSearch(arr, 12));\n```\n\
    \n而不是编写\n`System.out.println(Generic.<Integer>linSearch(arr, 11));`\n\n![](img/b5644859a631cd6cec6e5143c5d485e_111_0.png)\n\
    \n## JAVA 4: JAVA 的类型系统与集合类 泛型类型\n\n可以使用通配符，即 `?`，表示未知类型。它可以用于更通用的泛型方法。考虑以下代码：\n\
    \n```java\nprivate static void test11() {\n    print1(create(2, 3, 3.14, 1.42));\n\
    \    // print1(create(2, 3, 5, 7));\n    // print1(create(2.1, 3.2, 5, 7));\n\
    }\n```\n```java\nprivate static <T> ArrayList<T> create(T... values) {\n    ArrayList<T>\
    \ list = new ArrayList<>();\n    for (T t : values) {\n        list.add(t);\n\
    \    }\n    return list;\n}\n```\n\n```java\nprivate static void print1(ArrayList<?\
    \ extends Number> list) {\n    for (Number n : list) {\n        System.out.println(n);\n\
    \    }\n}\n```\n\n通配符不需要边界，你可以编写如下的方法：\n\n```java\nprivate static void print2(ArrayList<?>\
