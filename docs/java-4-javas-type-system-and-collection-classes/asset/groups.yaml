    \n- 商业管理理硕士\n- 金融经济学理硕士\n- 战略营销理硕士\n- 领导力与组织心理学理硕士\n\nJAVA 4：JAVA 的类型系统\n以及集合类\n\
    内部类\n\n```\npublic String getCode(int n) {\n    return table[n][0];\n}\n\npublic\
    \ String getCity(int n) {\n    return table[n][1];\n}\n```\n\n`Postcodes` 类的构造函数使用\
    \ `Data` 类用 `Post` 对象初始化 `ArrayList<Post>`。上述第二个问题通过对 `ArrayList` 排序来解决。要排序数组或其他任何对象列表，你应该能够比较对象并判断一个对象是否大于另一个。这可以通过多种方法解决，其中一种方法是使用比较器，它是一个实现了\
    \ `Comparator<Post>` 类的对象。它定义了一个单方法\n\n```\npublic int compare(Post p1, Post p2)\n\
    ```\n\n如果 `p1` 小于 `p2` 则必须返回 -1，如果 `p1` 大于 `p2` 则返回 1，如果它们相等则返回 0。现在类已经类，它有两个迭代器分别按邮政编码和城市名称开始邮类，排序顺序由两个内部类定义：\n\
    \n```\npackage postprogram;\n\nimport java.util.*;\n\npublic class Postcodes implements\
    \ Iterable<Post> {\n    private ArrayList<Post> list = new ArrayList();\n\n  \
    \  public Postcodes() {\n        Data data = new Data();\n        for (int i =\
    \ 0; i < data.length(); i++)\n            list.add(new Post(data.getCode(i), data.getCity(i)));\n\
