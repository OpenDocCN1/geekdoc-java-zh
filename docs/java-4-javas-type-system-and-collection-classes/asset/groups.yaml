    ## JAVA 4: JAVA 的类型系统

    包与集合类


    ## 11 包


    一个 Java 程序由许多类和接口组成。首先是你自己编写的类，以及来自 Java API 的类。为了避免命名冲突并提高清晰度，类和其他类型被放置在包（packages）中。例如，Java
    的类被分为许多包。基础包是 `java.lang`，它包含了所有的基本类，如 `String`、`System`、`Object` 以及包装类等。此包中的类可以直接供运行时系统使用，你不需要做任何事情即可使用这些类。这些类与其他包中的类不同。例如，我经常使用
    `Random` 类。这个类位于 `java.util` 包中，该名称代表杂项类或工具的包。这意味着该类的全名是 `java.util.Random`。如果你需要创建一个对象，可以这样写：


    ```java

    java.util.Random rand = new java.util.Random();

    ```


    当写起来很困难（你必须写很多内容），并且会让代码更难读时，你可以指定 `import` 语句：


    ```java

    import java.util.Random;

    ```


    这告诉程序 `Random` 类的含义，这样你就可以直接写类名：


    ```java

    Random rand = new Random();

    ```


    应该注意，这也是 `import` 的含义，它并不是任何东西都被导入到程序中，而是只有 `Random` 类是可以直接使用的。当程序和类使用了许多 Java
    API 中的类时，可能会导致很多 `import` 语句，因此允许编写：


    ```java

    import java.util.*;

    ```


    这简而言之你可以直接使用 `java.util` 包中所有的类和接口。关于这一点，我有自己的见解和支持或反对的论点，但我通常使用简写符号。


    当你在 NetBeans 项目中创建一个新类时，它会自动存放在一个包中，并以 `package` 语句作为第一条语句：


    ```java

    package projectName;

    ```


    包名默认是项目名称，但并不一定如此。`package` 语句必须是源文件的第一条语句（注释除外），并且文件必须在随后的语句中包含 `import` 语句。一个
    Java 源文件通常只包含一种类型并且只能包含一个 `public` 类型，该类型必须与源文件名相同。例如，如果你有如下类型


    ```java

    public class Str

    {

    ```


    源文件必须命名为 `Str.java`，并像这里所示使用大小写字母。文件可以包含多个类型，但通常建议不要这样做，尽管存在一些合理的例外。当一个文件包含多个类型时，这些类型不能是
    `public` 的，因此具有包级可见性（package visibility）。


    直到现在，我的项目只有一个包，但如果你编写一个包含许多类的大型程序，我经常选择将类置于多个包中，以便将相同概念的类放在同一个包中。


    ## JAVA 4: JAVA 的类型系统

    以及集合类


    ## 12 最终示例


    在本章中，我将展示一个简单 GUI 程序的开发。它不是一个大型程序，目标是展示本书中讨论的一些概念的使用，并以一个重点再次关注过程的示例结束。


    该过程被描述得相对详细，程序根据根据 MVC 模式开发的。这种模式以及关于程序开发的通用指南首先在《Java 7》一书中介绍，但你即使没有读过《Java 7》，也能够轻松地跟上这个过程。如果在过程描述中提到了你不太熟悉的概念，只需忽略它即可。


    ### 12.1 任务


    任务是编写一个模拟简单游戏的程序，该游戏由一个随机排列的 5×5 棋块矩阵组成。其中一个棋块是空的，你可以通过移动邻接棋块来移动棋块。在下方的情况下（左侧的方格），你可以移动棋块
    H、E 和 L。当棋块像右侧示例所示排列时，游戏即告完成。


    ![](img/b5644859a631cd6cec6e143c5d485e6_165_0.png)


    ## JAVA 4: JAVA 的类型系统

    以及集合类


    ## 最终示例


    | K | G | V | M | R | A | B | C | D | E |

    |---|---|---|---|---|---|---|---|---|---|

    | I | S | X | U | F | F | G | H | I | J |

    | C | O | A | E | T | K | L | M | N | O |

    | Q | Y | H | L | P | Q | R | S | T | |

    | N | D | P | J | B | U | V | X | Y | |


    你必须为程序分配高分以保存结果。结果由解决方格所需的步数组成，因此目标是用尽可能少的棋块移动来解决方格。


    该方格基本上是 5×5 的方格，但可能配置程序让你也能玩 3×3、7×7 和 9×9 的方格。


    ## 项目启动


    我创建了 `puzzles` 文件夹，它将包含与该项目相关的所有文件。我还创建了一个子文件夹。


    ### 12.2 分析


    在这种情况下，分析是非常简单的，因为任务很简单，而且用户描述了任务。在程序中，棋块由字母表示。没有多少需要澄清的问题。


    '
