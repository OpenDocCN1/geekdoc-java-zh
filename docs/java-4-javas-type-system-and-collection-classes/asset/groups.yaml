- md: "\n## ENUMERATIONS\n\nAs shown, you can define constants as variables that are\
    \ static final. An alternative is to use a so-called enumeration, and an example\
    \ might be:\n\n```java\npackage enumerations;\npublic enum WeekDays {\n MONDAY,\
    \ TUESDAY, WEDNESDAY,\n  THURSDAY, FRIDAY, SATURDAY, SUNDAY \n}\n```\n\nWeekdays\
    \ is a reference type that defines seven values and as an example you can write\
    \ the following method:\n\n```java\nprivate static void test01() {\n  String[]\
    \ days = {\"MONDAY\", \"TUESDAY\", \"WEDNESDAY\", \"THURSDAY\", \"FRIDAY\", \"\
    SATURDAY\", \"SUNDAY\"};\n  try {\n    System.out.println(weekday(rand.nextInt(7)\
    \ + 1));\n    System.out.println(weekday(days[rand.nextInt(7)]));\n    for (WeekDays\
    \ day : WeekDays.values()) System.out.println(day);\n    System.out.println(WeekDays.WEDNESDAY.compareTo(WeekDays.MONDAY));\n\
    \    System.out.println(WeekDays.WEDNESDAY.compareTo(WeekDays.FRIDAY));\n    System.out.println(WeekDays.WEDNESDAY.compareTo(WeekDays.WEDNESDAY));\n\
    \  } catch (Exception ex) {\n    System.out.println(ex.getMessage());\n  }\n}\n\
    ```\n\n```java\nprivate static WeekDays weekday(int n) throws Exception {\n  switch\
    \ (n) {\n    case 1: return WeekDays.MONDAY;\n    case 2: return WeekDays.TUESDAY;\n\
    \    case 3: return WeekDays.WEDNESDAY;\n    case 4: return WeekDays.THURSDAY;\n\
    \    case 5: return WeekDays.FRIDAY;\n    case 6: return WeekDays.SATURDAY;\n\
    \    case 7: return WeekDays.SUNDAY;\n  }\n  throw new Exception(\"Illegal day\"\
    );\n}\n```\n\n## JAVA 4: JAVA'S TYPE SYSTEM AND COLLECTION CLASSES\n### ENUMERATIONS\n\
    \n```java\nprivate static WeekDays weekday(String s) throws Exception\n{\n  return\
    \ WeekDays.valueOf(s);\n}\n```\n\nThe example should only show the syntax. The\
    \ first weekday() method has an int as a parameter and converts it to a value\
    \ of type Weekdays. You should note, how to refer to the individual values with\
    \ the dot operator, and you should note that the method's type is Weekdays. The\
    \ second weekday() method, has a string as a parameter and returns a Weekdays\
    \ value that matches this string. The two methods are used by the test method.\
    \ Here you should specifically note that it is possible to loop over an enumeration.\
    \ You should also note that an enum is comparable and the order is determined\
    \ by the order of the values.\n\nEnumerations can help to improve the readability\
    \ of programs, and it is recommended to use enumerations if a program needs a\
    \ finite number of values, which are values that do not change. Good examples\
    \ are week days, month names, colors of playing cards, etc.\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_54_0.png)\n\
    \n## JAVA 4: JAVA'S TYPE SYSTEM AND COLLECTION CLASSES\n\nIn Java an enum is a\
    \ little more than just a list of constant values and actually an enum a class.\
    \ Consider as an example the following enumerations (where I have not shown all\
    \ values):\n\n```java\npackage enumerations;\n\n```java\npublic enum Kings\n{\n\
    \  GOR(936, 958, \"Gorm den Gamle\"),\n  HA1(958, 987, \"Harald Blåtand\"),\n\
    \  SV1(987, 1014, \"Svend Tveskæg\"),\n\n  MA2(1972, 9999, \"Margrethem 2.\"),\n\
    \  NON(0, 0, \"Interregnum\");\n\n  private final int from;\n  private final int\
    \ to;\n  private final String name;\n\n  private Kings(int from, int to, String\
    \ name)\n  {\n    this.from = from;\n    this.to = to;\n    this.name = name;\n\
    \  }\n\n  public int getFrom()\n  {\n    return from;\n  }\n\n  public int getTo()\n\
    \  {\n    return to;\n  }\n\n  public String getName()\n  {\n    return name;\n\
    \  }\n\n  public String toString()\n  {\n    return \"[\" + name() + \"]\" + name;\n\
    \  }\n}\n```\n\n## JAVA 4: JAVA'S TYPE SYSTEM AND COLLECTION CLASSES\n### ENUMERATIONS\n\
    \n```java\npublic static Kings getKing(int year)\n{\n  for (Kings k : Kings.values())\
    \ if (k.from <= year && k.to >= year) return k;\n  return Kings.NON;\n}\n```\n\
    \n```java\npublic static ArrayList<Kings> getKings(String name)\n{\n  name = name.toLowerCase();\n\
    \  ArrayList<Kings> list = new ArrayList<>();\n  for (Kings k : Kings.values())\
    \ if (k.toLowerCase().contains(name)) {\n    list.add(k);\n  }\n  return list;\n\
    }\n```\n\nThe example should show that it is possible to assign arguments or attributes\
    \ to the individual values. Each value is a name of three characters, which is\
    \ a key for a Danish king. For each value is associated three arguments relatively\
    \ start and end of the reign and the king's name (or the queen's). The argument\
    \ is written after the value, and there must be a corresponding private constructor\
    \ that initializes the constants with the current arguments. In addition you may\
    \ have methods, and in this case there are get methods to the three arguments,\
    \ a toString() method, a method which can return the reign for a specific year,\
    \ as well as a search method. Below is shown a test method using the type Kings\n\
    \n```java\nprivate static void test02()\n{\n  for (Konge konge : Konge.values())\
    \ print(konge);\n  System.out.println(\"------------------------------------------------------\"\
    );\n  print(Konge.getKonge(1200));\n  System.out.println(\"------------------------------------------------------\"\
    );\n  for (Konge konge : Konge.getKonger(\"Frede\")) print(konge);\n}\n```\n\n\
    ```java\nprivate static void print(Konge konge)\n{\n  if (!konge.equals(Konge.NON))\
    \ {\n    System.out.println(\"\" + \" \" + konge.getNavn() + \" - \" + konge.getTil());\n\
    \  }\n}\n```\n\nThere is not much to explain,\n\n## JAVA 4: JAVA'S TYPE SYSTEM\
    \ AND COLLECTION CLASSES\n### ENUMERATIONS\n\n## JAVA 4: JAVA'S TYPE SYSTEM AND\
    \ COLLECTION CLASSES\n### ENUMERATIONS\n\n## EXERCISE 5\n\n## JAVA 4: JAVA'S TYPE\
    \ SYSTEM AND COLLECTION CLASSES\n### PROBLEM\n\n## JAVA 4: JAVA'S TYPE SYSTEM\
    \ AND COLLECTION CLASSES\n### ENUMERATIONS\n\n"
  mdcn: "\n\n## 枚举 (ENUMERATIONS)\n\n如所示，你可以将常量定义为 `static final` 变量。另一种方法是使用所谓的枚举，示例如下：\n\
    \n```java\npackage enumerations;\npublic enum WeekDays {\n MONDAY, TUESDAY, WEDNESDAY,\n\
    \  THURSDAY, FRIDAY, SATURDAY, SUNDAY \n}\n```\n\nWeekDays 是一个引用类型，定义了七个值，作为一个示例，你可以编写以下方法：\n\
    \n```java\nprivate static void test01() {\n  String[] days = {\"MONDAY\", \"TUESDAY\"\
    , \"WEDNESDAY\", \"THURSDAY\", \"FRIDAY\", \"SATURDAY\", \"SUNDAY\"};\n  try {\n\
    \    System.out.println(weekday(rand.nextInt(7) + 1));\n    System.out.println(weekday(days[rand.nextInt(7)]));\n\
    \    for (WeekDays day : WeekDays.values()) System.out.println(day);\n    System.out.println(WeekDays.WEDNESDAY.compareTo(WeekDays.MONDAY));\n\
    \    System.out.println(WeekDays.WEDNESDAY.compareTo(WeekDays.FRIDAY));\n    System.out.println(WeekDays.WEDNESDAY.compareTo(WeekDays.WEDNESDAY));\n\
    \  } catch (Exception ex) {\n    System.out.println(ex.getMessage());\n  }\n}\n\
    ```\n\n```java\nprivate static WeekDays weekday(int n) throws Exception {\n  switch\
    \ (n) {\n    case 1: return WeekDays.MONDAY;\n    case 2: return WeekDays.TUESDAY;\n\
    \    case 3: return WeekDays.WEDNESDAY;\n    case 4: return WeekDays.THURSDAY;\n\
    \    case 5: return WeekDays.FRIDAY;\n    case 6: return WeekDays.SATURDAY;\n\
    \    case 7: return WeekDays.SUNDAY;\n  }\n  throw new Exception(\"Illegal day\"\
    );\n}\n```\n\n## JAVA 4：JAVA 的类型系统与集合类\n### 枚举 (ENUMERATIONS)\n\n```java\nprivate\
    \ static WeekDays weekday(String s) throws Exception\n{\n  return WeekDays.valueOf(s);\n\
    }\n```\n\n该示例仅用于展示语法。第一个 `weekday()` 方法接受一个 `int` 参数并将其转换为 `Weekdays` 类型的值。你应该注意如何使用点运算符来引用各个具体值，并且你应该注意该方法的类型是\
    \ `Weekdays`。第二个 `weekday()` 方法接受一个 `string` 参数，并返回与该字符串匹配的 `Weekdays` 值。这两个方法被\
    \ `test` 方法调用。在这里你应该特别注意可以遍历枚举进行循环。你还应该注意枚举是可比较的（comparable），且顺序由值的定义顺序决定。\n\n\
    枚举有助于提高程序的可读性，如果程序需要有限的固定值（即不会改变的值），建议使用枚举。良好的例子包括星期几、月份名称、扑克牌颜色等。\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_54_0.png)\n\
    \n## JAVA 4：JAVA 的类型系统与集合类\n\n在 Java 中，枚举（enum）不仅仅是一个常量值列表，它实际上是一个类。考虑以下枚举示例（我没有显示所有的值）：\n\
    \n```java\npackage enumerations;\n\n\n\n```java\npublic enum Kings\n{\n  GOR(936,\
    \ 958, \"Gorm den Gamle\"),\n  HA1(958, 987, \"Harald Blåtand\"),\n  SV1(987,\
    \ 1014, \"Svend Tveskæg\"),\n\n  MA2(1972, 9999, \"Margrethem 2.\"),\n  NON(0,\
    \ 0, \"Interregnum\");\n\n  private final int from;\n  private final int to;\n\
    \  private final String name;\n\n  private Kings(int from, int to, String name)\n\
    \  {\n    this.from = from;\n    this.to = to;\n    this.name = name;\n  }\n\n\
    \  public int getFrom()\n  {\n    return from;\n  }\n\n  public int getTo()\n\
    \  {\n    return to;\n  }\n\n  public String getName()\n  {\n    return name;\n\
    \  }\n\n  public String toString()\n  {\n    return \"[\" + name() + \"]\" + name;\n\
    \  }\n}\n```\n\n## JAVA 4：JAVA 的类型系统与集合类\n### 枚举 (ENUMERATIONS)\n\n```java\npublic\
    \ static Kings getKing(int year)\n{\n  for (Kings k : Kings.values()) if (k.from\
    \ <= year && k.to >= year) return k;\n  return Kings.NON;\n}\n```\n\n```java\n\
    public static ArrayList<Kings> getKings(String name)\n{\n  name = name.toLowerCase();\n\
    \  ArrayList<Kings> list = new ArrayList<>();\n  for (Kings k : Kings.values())\
    \ if (k.toLowerCase().contains(name)) {\n    list.add(k);\n  }\n  return list;\n\
    }\n```\n\n该示例展示了可以为各个值分配参数或属性。每个值都是一个三个字符的名字，作为丹麦国王的键。每个值都关联了三个参数：相对的统治开始时间、结束时间，以及国王（或女王）的名字。参数写在值之后，并且必须有一个对应的私有构造函数来用当前参数初始化常量。此外，你还可以拥有方法，在这种情况下有三个参数的\
    \ `get` 方法、一个 `toString()` 方法、一个可以返回特定年份统治期的方法以及一个搜索方法。下面展示了一个使用 `Kings` 类型的测试方法\n\
    \n```java\nprivate static void test02()\n{\n  for (Konge konge : Konge.values())\
    \ print(konge);\n  System.out.println(\"------------------------------------------------------\"\
    );\n  print(Konge.getKonge(1200));\n  System.out.println(\"------------------------------------------------------\"\
    );\n  for (Konge konge : Konge.getKonger(\"Frede\")) print(konge);\n}\n```\n\n\
    ```java\nprivate static void print(Konge konge)\n{\n  if (!konge.equals(Konge.NON))\
    \ {\n    System.out.println(\"\" + \" \" + konge.getNavn() + \" - \" + konge.getTil());\n\
    \  }\n}\n```\n\n没什么需要解释的，\n\n## JAVA 4：JAVA 的类型系统与集合类\n### 枚举 (ENUMERATIONS)\n\
    \n## JAVA 4：JAVA 的类型系统与集合类\n### 枚举 (ENUMERATIONS)\n\n## 练习 5 (EXERCISE 5)\n\n\
    ## JAVA 4：JAVA 的类型系统与集合类\n### 问题 (PROBLEM)\n\n"
