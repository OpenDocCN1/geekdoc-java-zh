  - "[PAGE 107]\n\n# JAVA 4: JAVA'S TYPE SYSTEM\nGENERIC TYPES\n\nIt is relatively\
    \ simple to implement binary search in Java. Below is a generic method, it requires\
    \ that you can compare the elements (whether to take the left half or right half),\
    \ and the parameter type must implement the interface Comparable:\n\n```\npublic\
    \ static T extends Comparable<T>> int binSearch(T[] arr, T elem)\n{\n    for (int\
    \ a = 0, b = arr.length - 1; a <= b; )\nn        int m = (a + b) / 2;\n      \
    \  if (arr[m].equals(elem)) return m;\n        if (arr[m].compareTo(elem) < 0)\
    \ a = m + 1; else b = m - 1;\n\n    return -1;\n}\n```\n\nYou should note the\
    \ syntax: Comparable<T>\n\nThe word extends means the type T either must inherit\
    \ a class or implement an interface. In this case it is the interface Comparable<T>,\
    \ which means that objects of the type T can be compared. If you try to apply\
    \ the method to objects that do not directly or indirectly implement Comparable<T>,\
    \ you get a compiler error.\n\nOne say that the parameter type T is bound to the\
