    \ an example. In this case there is no good reason for local class but you should\
    \ note that the local class can refer to local variables in the method by which\
    \ it is a part. You will also notice that the class must be defined before it\
    \ can be instantiated.\n\nConsider then the following class that defines an iterator\
    \ which iterates over the factorials:\n\n```\npackage factorials;\n\nimport java.util.*;\n\
    \npublic class Factorial implements Iterable<Long>\n{\n    public Iterator<Long>\
    \ iterator()\n    {\n        return new Iterator<Long>()\n        {\n        \
    \    private long t = 1;\n            private int i = 0;\n\n            public\
    \ boolean hasNext()\n            {\n                return i < 20;\n         \
    \   }\n\n            public Long next()\n            {\n                return\
    \ t *= ++i;\n            }\n        };\n    }\n}\n```"
