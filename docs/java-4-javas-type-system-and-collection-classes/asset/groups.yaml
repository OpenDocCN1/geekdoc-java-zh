    \ Consider the following method:\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_144_0.png)\n\
    \n# JAVA 4: JAVA'S TYPE SYSTEM\nAND COLLECTION CLASSES\n\n# COLLECTION CLASSES\n\
    \n```\nprivate static void test04() {\n    Set<Integer> A = new HashSet();\n \
    \   Set<Integer> B = new HashSet();\n    for (int i = 0; i < 10; i++) {\n    \
    \    A.add(rand.nextInt(10));\n        B.add(rand.nextInt(10));\n    }\n    Set<Integer>\
    \ C = new HashSet(A);\n    C.addAll(B);\n    Set<Integer> D = new HashSet(A);\n\
    \    D.retainAll(B);\n    Set<Integer> E = new HashSet(A);\n    E.removeAll(B);\n\
    \    print(A);\n    print(B);\n    print(C);\n    print(D);\n    print(E);\n}\n\
    ```\n\nThis method creates sets A and B and initializes them with digits. Next\
    \ are determined respectively the union, intersection and set difference. If the\
    \ method is performed the result could be:\n\n```\n0 1 5 6 8\n0 1 2 4 7 8 9\n\
    0 1 2 4 5 6 7 8 9\n0 1 8\n5 6\n```\n\nThe set A has 5 elements, and the set B\
    \ has 7 elements. You should note that the reason why the number of elements are\
    \ different and there are not 10 elements in each set due to, the same element\
    \ can only occur once. You should also note that it looks like the elements are\
    \ ordered, but it is only apparent, and in connection with a HashSet you must\
    \ not assume any arrangement of the elements. You finally notes the names of the\
    \ methods, where addAll() is union, retainAll() is intersection and removeAll()\
    \ is set difference.\n\nConsider another example, the following method:\n\n```\n\
    private static void test05(int n) {\n    Set<Integer> A = new HashSet();\n   \
    \ Set<Integer> B = new HashSet();\n    long t1 = Calendar.getInstance().getTimeMillis();\n\
    \    for (int i = 0; i < n; i++) {\n        A.add(rand.nextInt());\n        B.add(rand.nextInt());\n\
    \    }\n\n    long t2 = Calendar.getInstance().getTimeMillis();\n    System.out.println(A.size()\
    \ + \" \" + B.size() + \" \" + (t2 - t1));\n    long t3 = Calendar.getInstance().getTimeMillis();\n\
    \    Set<Integer> C = new HashSet(A);\n    C.addAll(B);\n    long t4 = Calendar.getInstance().getTimeMillis();\n\
    \    System.out.println(C.size() + \" \" + (t4 - t3));\n    long t5 = Calendar.getInstance().getTimeMillis();\n\
    \    Set<Integer> D = new HashSet(A);\n    D.retainAll(B);\n    long t6 = Calendar.getInstance().getTimeMillis();\n\
    \    System.out.println(D.size() + \" \" + (t6 - t5));\n    long t7 = Calendar.getInstance().getTimeMillis();\n\
    \    Set<Integer> E = new HashSet(A);\n    E.removeAll(B);\n    long t8 = Calendar.getInstance().getTimeMillis();\n\
    \    System.out.println(E.size() + \" \" + (t8 - t7));\n```\n\nThis method creates\
    \ two sets of random integers between 0 and n, and creates the union, intersection\
    \ and set difference. The method prints, how long each operation took: Below is\
    \ the result of executing the method with n = 10000000:\n\n6321515 6321068 9696\n\
    8646902 1365\n3995681 3630\n2325834 1184\n\nIt has taken 10 seconds to try to\
    \ create the two sets with 10 million members, and the result is sets at approximately\
    \ 6 million elements. Secondly, it has taken 1½ seconds to perform the union,\
    \ about 3½ seconds to form the intersection and finally just about 1 second to\
    \ form the set difference. The conclusion is that a HashSet is a very efficient\
    \ data structure.\n\nA HashSet is implemented by hashing, which is a technique\
    \ in which an element in a collection can be found by a calculation. Internal,\
    \ the collection is an array of sufficient size and the individual objects are\
    \ placed in the array. When you add a new object, the class calculates using an\
    \ algorithm where the object must be placed, and it is placed there (if the place\
    \ is not already used). Similarly, if you want to get a specific object in the\
    \ collection, the class just calculate the object's place and test whether it\
    \ exists. There is direct access to the individual objects without any search,\
    \ and that is exactly what makes the data structure extremely effective.\n\nAn\
    \ Object has a method called hashCode(), which returns an int. When objects of\
    \ a given type can be stored in a HashSet, the object's class must override the\
    \ method hashCode() with value semantic. It is a requirement that two objects\
    \ that equals() must also have the same hashCode(), but it is also the formal\
    \ requirements. On the other hand, it is the programmer's responsibility to ensure\
    \ that hashCode() is implemented in such a way that the method returns values\
    \ that are uniformly distributed. It should be particularly noted that it is not\
    \ a requirement that the two objects with the same hashCode() equals().\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_147_0.png)\n\
    \n# 9.5 TRESET\n\nThe class TreeSet is also a Set, and you can exactly do the\
    \ same as you can with a HashSet, the difference is that a TreeSet arranges the\
    \ elements in a specific order. The elements to be added to a TreeSet must be\
    \ objects created on basis of a class that implements the interface Comparable.\
    \ If so, it stands reasonable to use a TreeSet, if you need a Set, but you should\
    \ be aware that a TreeSet does not have the same effectiveness as a HashSet, and\
    \ if you do not need that the elements are sorted, you should choose a HashSet.\
    \ It's clear that it costs something when you have to insert elements and delete\
    \ them again such that elements must be sorted. It is not such that a TreeSet\
    \ is inefficient and if you need a sorted set, you should definitely disregard\
    \ a TreeSet. Internally a TreeSet does not consists of an array, but is instead\
    \ a data structure composed of nodes that are linked together much the same way\
    \ as a LinkedList. In a TreeSet elements are organized in binary tree:\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_148_0.png)\n\
    \nand the requirements are that each element may not have more than two sequels,\
    \ and there should be exactly one element that has predecessors and is called\
    \ the root of the tree. Furthermore, it must be the case if you stand in a particular\
    \ node, then the left child must be null or less than you, and the right child\
    \ must be null or greater. The sum of all is that if you stand in a certain node,\
    \ then that node is root of a subtree in which all elements of the left subtree\
    \ is less than the root and all elements in the right subtree is greater than\
    \ the root. This is exactly what gives the tree and thereby also a TreeSet qualities.\
    \ You can search the tree after the same principle as for binary search, and it\
    \ is thus highly effective to ask whether an element is in a TreeSet, and iterating\
    \ the data structure such that the elements are visited in sorted order are equally\
    \ effective.\n\n# JAVA 4: JAVA'S TYPE SYSTEM\nAND COLLECTION CLASSES\n\n# COLLECTION\
    \ CLASSES\n\n# EXERCISE 11\nCreate a program, that you can call `TreeProgram`.\
    \ Add the following class to the project:\n\n```\npackage treeprogram;\npublic\
    \ class Person implements Comparable<Person>\n{\n    private String firstName;\n\
    \    private String lastname;\n\n    public Person(String firstName, String lastname)\n\
    \    {\n        this.firstName = firstName;\n        this.lastname = lastname;\n\
    \    }\n\n    public String getFirstName()\n    {\n        return firstName;\n\
    \    }\n\n    public String getLastName()\n    {\n        return lastname;\n \
    \   }\n\n    public String toString()\n    {\n        return firstName + \" \"\
    \ + lastname;\n    }\n\n    public boolean equals(Object obj)\n    {\n       \
    \ if (obj == null) return false;\n        if (getClass() == obj.getClass()) {\n\
    \            Person pers = (Person)obj;\n            return firstName.equals(pers.firstName)\
    \ && lastname.equals(pers.lastname);\n        }\n        return false;\n    }\n\
    \n    public int hashCode()\n    {\n        return firstName.hashCode() ^ lastname.hashCode();\n\
    \    }\n}\n```\n"
  mdcn: "\n\n# JAVA 4：JAVA 的类型系统\n与集合类\n\n编写一个泛型方法 `stackSort(T[] arr)`，实现上述算法并对数组进行排序。\n\
    \n编写方法 `test1()`，创建一个包含 100 个随机数字的 `Integer` 类型数组，其中每个数字都大于 9 且小于 100。该方法应该打印数组，使用\
    \ `stackSort()` 方法对其进行排序，然后再次打印数组。\n\n编写方法 `test(int n)`，创建一个包含 `n` 个随机元素的 `Integer`\
    \ 数组。由于该方法应该使用 `stackSort()` 对数组进行排序，并打印排序耗了多少毫秒。当 `n` 分为 100、1000、10000、100000\
    \ 时会发生什么？\n\n# 9.4 HASHSET\n\n`Set` 接口定义了一个数学上的集合，并包含了你通常期望在集合上执行的操作。在第 6 章中，你写了一个可以使用\
    \ `ArrayList` 来表示集合的类，但我注意到该集合的实现并不是特别高效。然而，Java 有一个 `HashSet` 类也表示集合，而且它是高效的。请考虑以下方法：\n\
    \n![](img/b5644859a631cd6cec6e5143c5d485e6_144_0.png)\n\n# JAVA 4：JAVA 的类型系统\n\
    与集合类\n\n# 集合类\n\n```\nprivate static void test04() {\n    Set<Integer> A = new\
    \ HashSet();\n    Set<Integer> B = new HashSet();\n    for (int i = 0; i < 10;\
    \ i++) {\n        A.add(rand.nextInt(10));\n        B.add(rand.nextInt(10));\n\
    \    }\n    Set<Integer> C = new HashSet(A);\n    C.addAll(B);\n    Set<Integer>\
    \ D = new HashSet(A);\n    D.retainAll(B);\n    Set<Integer> E = new HashSet(A);\n\
    \    E.removeAll(B);\n    print(A);\n    print(B);\n    print(C);\n    print(D);\n\
    \    print(E);\n}\n```\n\n该方法创建了集合 A 和 B 并用数字初始化它们。接下来分别确定了并集、交集和差集。如果执行该方法，结果可能是：\n\
    \n```\n0 1 5 6 8\n0 1 2 4 7 8 9\n0 1 2 4 5 6 7 8 9\n0 1 8\n5 6\n```\n\n集合 A 有\
    \ 5 个元素，集合 B 有 7 个元素。你应该注意到，元素数量之所以不同且每个集合中不是 10 个元素，是因为相同的元素只能出现一次。你还应该注意到，元素看起来是有序的，但这仅仅是视觉上的，而且在处理\
    \ `HashSet` 时，你不能假设元素的任何排列方式。最后请注意这些方法的名称，`addAll()` 是并集，`retainAll()` 是交集，`removeAll()`\
    \ 是差集。\n\n考虑另一个例子，以下方法：\n\n```\nprivate static void test05(int n) {\n    Set<Integer>\
    \ A = new HashSet();\n    Set<Integer> B = new HashSet();\n    long t1 = Calendar.getInstance().getTimeMillis();\n\
    \    for (int i = 0; i < n; i++) {\n        A.add(rand.nextInt());\n        B.add(rand.nextInt());\n\
    \    }\n\n    long t2 = Calendar.getInstance().getTimeMillis();\n    System.out.println(A.size()\
    \ + \" \" + B.size() + \" \" + (t2 - t1));\n    long t3 = Calendar.getInstance().getTimeMillis();\n\
    \    Set<Integer> C = new HashSet(A);\n    C.addAll(B);\n    long t4 = Calendar.getInstance().getTimeMillis();\n\
    \    System.out.println(C.size() + \" \" + (t4 - t3));\n    long t5 = Calendar.getInstance().getTimeMillis();\n\
    \    Set<Integer> D = new HashSet(A);\n    D.retainAll(B);\n    long t6 = Calendar.getInstance().getTimeMillis();\n\
    \    System.out.println(D.size() + \" \" + (t6 - t5));\n    long t7 = Calendar.getInstance().getTimeMillis();\n\
    \    Set<Integer> E = new HashSet(A);\n    E.removeAll(B);\n    long t8 = Calendar.getInstance().getTimeMillis();\n\
    \    System.out.println(E.size() + \" \" + (t8 - t7));\n```\n\n此方法创建了两个 0 到 n\
    \ 之间的随机集合，并创建了并集、交集和差集。方法打印了每个操作所需的时间：以下是执行 `n = 1000000` 时的结果：\n\n6321515 6321068\
    \ 9696\n8646902 1365\n3995681 3630\n2325834 1184\n\n创建 1000 万成员的两个集合花了 10 秒，结果大约是\
    \ 600 万元素。其次，执行并集花了 1.5 秒，形成交集花了 1.5 秒，最后形成差集花了 1 秒。结论是 `HashSet` 是一个非常高效的数据结构。\n\
    \n`HashSet` 通过哈希实现，这是一种通过计算来查找集合中元素的技术。内部，集合是一个足够大的数组，单个元素被放置在数组中。当添加新对象时，类使用算法计算对象应该放置的位置（如果该位置尚未未使用）。同样，如果你想获取集合中的特定对象，无需搜索即可直接访问单个对象，这正是该数据结构极其高效的原因。\n\
    \n`Object` 有一个名为 `hashCode()` 的方法返回一个 `int`。当给定类型的对象存储在 `HashSet` 时，对象的类必须重写 `hashCode()`\
    \ 方法。`equals()` 方法要求两个对象必须具有相同的 `hashCode()`，这也是正式要求。另一方面，程序员有责任确保 `hashCode()`\
    \ 的实现方式使得返回的值是均匀分布的。特别要注意，具有相同 `hashCode()` 的两个对象并不一定相等。\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_147_0.png)\n\
    \n# 9.5 TreeSet\n\n`TreeSet` 类也是一个集合，你可以像操作 `HashSet` 一样操作它，区别在于 `TreeSet` 按特定排列元素。添加到\
    \ `TreeSet` 的元素必须基于实现了 `Comparable` 接口的类。如果是这样，如果你需要集合，使用 `TreeSet` 是合理的，但你应该意识到\
    \ `TreeSet` 的效率没有 `HashSet` 高，如果你不需要元素有序，应该选择 `HashSet`。很显然，当你必须插入元素并再次删除它们以使元素排序时，是有成本的。`TreeSet`\
    \ 并不是低效，如果你需要有序集合，应该考虑它。内部 `TreeSet` 不是由数组组成，而是由像 `LinkedList` 一样连接在一起节点的数据结构。在\
    \ `TreeSet` 中，元素以二叉树的形式组织：\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_148_0.png)\n\
    \n要求是每个元素不能有两个后继，并且应该有一个元素拥有前驱并被称为树的根。此外，如果你位于某个节点，那么左孩子必须为空或小于你，右孩子必须为空或大于你。总之，如果你位于某个节点，那么该节点就是子树的根，左子树中的所有元素都小于根，右子树中的所有元素都大于根。这正是赋予树以及\
    \ `TreeSet` 特性的原因。你可以按照与二分查找相同的原理来搜索树，因此询问一个元素是否在 `TreeSet` 中是非常高效的，而以排序顺序访问元素的方式来遍历数据结构也同样高效。\n\
    \n# JAVA 4：JAVA 的类型系统\n与集合类\n\n# 集合类\n\n# 练习 11\n创建一个可以调用的 `TreeProgram` 程序。将以下类添加到项目中：\n\
    \n```java\npackage treeprogram;\npublic class Person implements Comparable<Person>\n\
    {\n    private String firstName;\n    private String lastname;\n\n    public Person(String\
    \ firstName, String lastname)\n    {\n        this.firstName = firstName;\n  \
    \      this.lastname = lastname;\n    }\n\n    public String getFirstName()\n\
    \    {\n        return firstName;\n    }\n\n    public String getLastName()\n\
    \    {\n        return lastname;\n    }\n\n    public String toString()\n    {\n\
    \        return firstName + \" \" + lastname;\n    }\n\n    public boolean equals(Object\
    \ obj)\n    {\n        if (obj == null) return false;\n        if (getClass()\
    \ == obj.getClass()) {\n            Person pers = (Person)obj;\n            return\
    \ firstName.equals(pers.firstName) && lastname.equals(pers.lastname);\n      \
    \  }\n        return false;\n    }\n\n    public int hashCode()\n    {\n     \
    \   return firstName.hashCode() ^ lastname.hashCode();\n    }\n}\n```\n\n"
