  mdcn: "\n\n## JAVA 4：JAVA 的类型系统与集合类\n### LAMBDA 表达式\n\n这是一个 lambda 表达式的示例，尽管它看起来很神秘，但编写和阅读起来都非常简单。在最简单的形式下，lambda\
