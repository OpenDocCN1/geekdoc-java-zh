    \ because the name is misspelled).\n\n# JAVA 4: JAVA'S TYPE SYSTEM\nAND COLLECTION\
    \ CLASSES\n\nGENERIC TYPES\n\n# 7 GENERIC TYPES\n\nIn this chapter I will look\
    \ at generic types and generic methods. In fact, I already used generic types\
    \ many times as an ArrayList<T>, which indicate the type of kind of objects that\
    \ the list should contain. Similarly, I have used several generic interfaces such\
    \ as Comparable<T>. In this section I will show how user-defined types can be\
    \ generic.\n\nI would start with a class representing a circular buffer. A buffer\
    \ is a container (with Java terms a collection), which may contain objects, and\
    \ to the buffer is associated methods that manipulate the content. A buffer can\
    \ be implemented in several ways, but here I will look at a so-called circular\
    \ buffer, a buffer with room for a certain number of objects. Such a buffer can\
    \ be easily implemented by means of an array:\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_84_0.png)\n\
    \n> “I studied English for 16 years but...I finally learned to speak it in just\
    \ six lessons\"\n> Jane, Chinese architect\n\nBasically, there are to a buffer\
    \ associated two operations called insert() and remove(), where the first inserts\
    \ an element into the buffer, while the other removes the oldest element – the\
    \ element that has been longest in the buffer. The figure above illustrates an\
    \ empty buffer, and the arrow tail is the index where the next element should\
    \ be inserted. Similarly, the head is the index of the next element to be removed.\
    \ Initially, the buffer is empty and the arrows points to the same place. Below\
    \ is how the buffer looks after inserted 7 elements – the method insert() is executed\
    \ 7 times:\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_85_0.png)\n\nIf you then\
    \ remove 2 elements – the method remove() is executed 2 times:\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_85_1.png)\n\
    \nThe buffer looks after inserted 7 elements – the method insert() is executed\
    \ 7 times:\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_85_2.png)\n\nThe buffer\
    \ looks after inserted 7 elements – the method insert() is executed 7 times:\n\
    \n![](img/b5644859a631cd6cec6e5143c5d485e6_85_3.png)\n\nThe buffer looks after\
    \ inserted 7 elements – the method insert() is executed 7 times:\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_85_4.png)\n\
    \n# JAVA 4: JAVA'S TYPE SYSTEM\nAND COLLECTION CLASSES\nGENERIC TYPES\n\nThere\
    \ is not much to explain, and the implementation is quite effective. The two methods\
    \ empty() and full() and the fundamental methods insert() and remove() are also\
    \ effective, since in addition to test for an exception they solely do some operations.\
    \ You should also note the method peek(), which returns the oldest element in\
    \ the buffer, but without removing it.\n\n```java\npackage generic;\npublic class\
    \ IntBuffer {\n    private int[] buff;\n    private int head = 0;\n    private\
    \ int tail = 0;\n    private int count = 0;\n\n    public IntBuffer(int n) {\n\
    \        buff = new int[n];\n    }\n\n    public int getCount() {\n        return\
    \ count;\n    }\n\n    public boolean empty() {\n        return count == 0;\n\
    \    }\n\n    public boolean full() {\n        return count == buff.length;\n\
    \    }\n\n    public int peek() throws Exception {\n        if (empty()) throw\
    \ new Exception(\"The buffer is empty\");\n        return buff[head];\n    }\n\
    }\n```\n\n```java\npublic int remove() throws Exception {\n    if (empty()) throw\
    \ new Exception(\"The buffer is empty\");\n    int elem = buff[head];\n    head\
    \ = next(head);\n    --count;\n    return elem;\n}\n\npublic void insert(int elem)\
    \ throws Exception {\n    if (full()) throw new Exception(\"The buffer is full\"\
    );\n    buff[tail] = elem;\n    tail = next(tail);\n    ++count;\n}\n\nprivate\
    \ int next(int n) {\n    return (n + 1) % buff.length;\n}\n```\n\n![](img/b5644859a631cd6cec6e5143c5d485e6_87_0.png)\n\
    \n# JAVA 4: JAVA'S TYPE SYSTEM\nAND COLLECTION CLASSES\nGENERIC TYPES\n\nAs an\
