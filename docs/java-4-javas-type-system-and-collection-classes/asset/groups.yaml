    As shown in the table above there are three options for specifying quantifiers.
    As mentioned the search moves the index until a match is found. If the quantifiers
    in the first column the index is moved as far as possible. A dot means the character
    class consisting of all characters, and the pattern .*abc means 0 or more characters
