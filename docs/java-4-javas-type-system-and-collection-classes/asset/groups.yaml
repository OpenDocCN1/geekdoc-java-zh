- md: "\n# JAVA 4: JAVA'S TYPE SYSTEM AND COLLECTION CLASSES\nINTRODUCTION\n\nHere\
    \ it is worth thinking about that Java from the start was designed to be an object-oriented\
    \ language that was simple and easy to learn. Java has been a success and over\
    \ time progressed much as the language is in use in more and more areas from both\
    \ the development of complex computer applications over the web applications to\
    \ the development of apps for mobile phones. This course has caused the development\
    \ of a number of new APIs, each of which aims to support the development of a\
    \ specific category of applications or software are developed, really as a natural\
    \ evolution of what has happened with other programming languages, and where there\
    \ are more and more concepts added into the language that is many of the concepts\
    \ discussed in this book. In principle, it is fine as it helps software developers,\
    \ but conversely there is a price, namely that the language becomes more complex\
    \ and difficult to learn, and it is indeed a significant step away from what was\
    \ originally the idea of Java. It is worth thinking about, because in the worst\
    \ case it could mean that the language die because of its own success, and in\
    \ fact there are several precedents of programming languages that has had wide\
    \ circulation, which has constantly evolved to finally departing at death because\
    \ they were too complex and hopeless to learn. Everything in life is a balance.\n\
    \n# WRAPPER CLASSES\n\nJava’s type system consists as discussed in the previous\
    \ book of a hierarchy of classes with the class Object as the root. Beside there\
    \ are simple types for numbers and characters, and in some places it is a problem\
    \ that these are not part of the object-oriented class hierarchy. There are, therefore,\
    \ for each of the simple types defined a class that encapsulates the simple type.\
    \ For example the class Integer that encapsulates an int. These are called wrapper\
    \ classes, and besides they allow the variables of the simple types to be used\
    \ in the same way as other objects, the wrapper classes defines a number of useful\
    \ methods and constants for the simple types.\n\nFor the numeric types, there\
    \ are following wrapper classes:\n\n- Byte\n- Short\n- Integer\n- Long\n- Float\n\
    - Double\n\nand the names should tell the primitive type as the class encapsulates.\
    \ The six classes are all derived from the class Number.\n\nThere are also wrapper\
    \ classes to use of char and boolean and they are called respectively Character\
    \ and Boolean. Generally are the use of these classes without major challenges,\
    \ but you should study them well including to be aware of the methods they offer.\
