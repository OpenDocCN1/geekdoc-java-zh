    If you execute the method on the same machine, it takes 9 milliseconds, and there
    is a very big difference in performance. You should note that the algorithm (method)
    is the same, and that the improvement solely due to the class StringBuilder, and
    that it is no longer necessary to create and copy the 100000 objects.


    In the two methods I have read the hardware clock using the method getTime(),
    which returns the number of milliseconds after 00:00:00:000. The method creates
    a GregorianCalendar object that is defined by the interface Calendar. The constructor
    of the class GregorianCalendar initializes the object by reading the hardware
    clock. The type defines and represents a date and time for a particular day. A
    Calendar has many methods, and there among other things a method get() returns
    a value for a time where a constant indicates the value you want to get. The class
    GregorianCalendar is the standard class in Java for dates and times.


