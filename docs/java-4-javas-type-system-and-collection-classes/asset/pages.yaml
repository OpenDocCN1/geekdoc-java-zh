    # 12 FINAL EXAMPLE


    In this chapter I will show the development of a simple GUI program. It''s not
    a large program, and the goal is to show the use of some of the concepts discussed
    in this book and to finish with an example where the focus again is on the process.


    The process is described in relative detail, and the program is developed according
    to the MVC pattern. This pattern and in general the guidelines regarding the development
    of a program is first treated in the book Java 7, but you should easily be able
    to follow the process without having read Java 7. If in the description of the
    process is referred to concepts that you are not quite with, just ignore it.


    # 12.1 THE TASK


    The task is to write a program that simulates a simple game, which consists of
    a square of 5×5 pieces arranged in random order. One of the pieces is empty, and
    you can move a piece by moving a neighbor to the empty piece. In the case below
    (the square on the left) you can then move the pieces H, E, L and J (you cannot
    move diagonally). The game is solved when the pieces are arranged as shown in
    the example to the right.


