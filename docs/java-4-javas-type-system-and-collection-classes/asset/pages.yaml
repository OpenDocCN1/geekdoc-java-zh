  md: "# JAVA 4: JAVA'S TYPE SYSTEM\nAND COLLECTION CLASSES GENERIC TYPES\n\nIt is\
    \ possible to use wild cards, which is a ? and indicates an unknown type. It can\
    \ be used\nover more generic methods. Consider the following code:\n\n```\nprivate\
    \ static void test11() {\n    print1(create(2, 3, 3.14, 1.42));\n    // print1(create(2,\
    \ 3, 5, 7));\n    // print1(create(2.1, 3.2, 5.3, 7.4));\n}\n```\n\n```\nprivate\
    \ static <T> ArrayList<T> create(T ... values) {\n    ArrayList<T> list = new\
    \ ArrayList();\n    for (T t : values) list.add(t);\n    return list;\n}\n```\n\
    \n```\nprivate static void print1(ArrayList<Number> list) {\n    for (Number n\
    \ : list) System.out.print(n + \" \");\\n    System.out.println();\n}\n```\n\n\
    which can be translated and run, and it is probably not so strange. When create()\
    \ is\ncalled, there are 4 actual parameters that because of the auto boxing are\
    \ converted into\nobjects of type Integer and type Double. Because of the type\
    \ inference the method\ncreate() creates an ArrayList of objects of the type Number\
    \ and thus an object of the type\nArrayList<Number>. This object can be transferred\
    \ as a parameter to the method print1().\nIf you now the method test11() removes\
    \ the first comment, you get a compiler error. create()\nis called again with\
    \ 4 actual parameters, but this time they are boxed as objects of the type\nInteger.\
    \ The method will return an object to the type ArrayList<Integer>, and as explained\n\
    in the beginning of this section, it is not compatible with the parameter to print1().\
    \ The problem is solved\n\n```\nprivate static void print1(ArrayList<? extends\
    \ Number> list) {\n    for (Number n : list) System.out.print(n + \" \");\\n \
    \   System.out.println();\n}\n```\n\nThe method print1() is now called with a\
    \ parameter of type ArrayList<T> where T inherits\n(or implements) Number. The\
    \ type Number is called an upper bound."
