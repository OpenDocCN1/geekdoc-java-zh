    The idea with a LinkedList is that, when compared with an ArrayList it is simple
    to insert an element and delete an element in the middle of the list. If, for
    example you performs the statement


    ```

    list.add(3, 17);

    ```


    element 17 has to be inserted between 13 and 19:


    ![](img/b5644859a631cd6cec6e5143c5d485e6_139_0.png)


    This means to create a new node, and then change the 4 pointers, but you should
    not in the same way as with an ArrayList move all elements to the right of the
    place where the new element should be inserted.


    If you assume that the element 17 is inserted and you performs the statement


    ```

    list.remove(3);

    ```


    is the result


    ![](img/b5644859a631cd6cec6e5143c5d485e6_139_1.png)


    This means that there are changed two pointers, and there is thus no longer references
    to the item 17, which are removed by the garbage collector. Again, the benefit
    is the same deletion requires few operations. Both insertion and deletion of elements
    is simple, but requires special implementations of both inserting or deleting
    of elements in the ends of the list.'
