    \ do with banknotes, it would hardly be the case and the above and the following\
    \ examples are also intended merely to show the syntax. Anonymous classes is most\
    \ justified in those cases the interface is used to define a few or perhaps one\
    \ method. The advantage is of course that in a program – especially a GUI program\
    \ – you do not have to write a series of simple classes that other to implement\
    \ a single method, but there is also a disadvantage, as the code easily becomes\
    \ difficult to read and even more difficult to write correct. The last you can\
    \ help a little by not writing the code on a single line:\n\n```\nNote n2 = new\
    \ Note()\n{\n    public int getValue()\n    {\n        return 100;\n    }\n\n\
    \    public void print()\n{\n        System.out.println(\"100 kr., Den gamle Lilleælbro\
    \ og Hindsgavl-dolken\");\n    }\n}\n```\n\nIt is something more readable, but\
    \ comparing it with the fact that an anonymous class always occur in an expression,\
    \ and in most cases it will be an assignment as above or as a parameter to a method,\
    \ it is clear that you ends up with code which is hard to read. It is exactly\
    \ what the lambda expression should do better.\n\nBelow is another example of\
