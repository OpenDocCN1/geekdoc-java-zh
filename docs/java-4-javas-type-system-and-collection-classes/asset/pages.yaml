    each node uses two additional pointers to neighbor elements, which also fills,
    and in reality means that a LinkedList not use less space than an ArrayList –
    and actually a bit more. With regard inserting and deleting elements in the middle
    of the list you should be aware that although the operations are effective similar
    they simply consist of moving a few pointers, you should be aware that the access
    to the list is only possible through the two pointers start and end, and is therefore
    in principle necessary first to find the place where to insert or delete an element
    – the class does not implement the interface RandomAccess.


    The most important characteristics of a LinkedList is that it is very effective
    to insert and delete items in the beginning of the list, and like at the end of
    the list (as an ArrayList). These are the characteristics which are required by
    the implementation of a queue and a stack.


    A queue is a data structure where you can add and remove an item such that the
    element that is removed, is always the oldest element – it’s the element longest
    in the queue. Typically, you have the following picture of a queue


    ![](img/b5644859a631cd6cec6e5143c5d485e6_140_0.png)


    which adds elements where tail is pointing and remove the element where head is
    pointing. Since a LinkedList just performs well when inserting elements at the
    end of the list and to remove elements at the start of the list, it is suitable
    for implementing a queue, and that is expressed that the class implements the
    interface Queue. This interface defines 6 methods, apart from the exceptions it
    can raise in pairs:


    +   - offer() and add(), that add an element to the queue

    - poll() and remove() that removes an element from the queue

    - peek() and element(), that returns the oldest element without removing it


