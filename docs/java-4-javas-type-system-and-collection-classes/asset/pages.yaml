    The main konkrete classes are as follows:


    +   - ArrayList. It is a class I have used many times and short be characterized
    as a dynamic array. The class implements the interface List. It is definitely
    the most frequently used of the collection classes.

    - LinkedList. It is also a List, but is implemented in a different way than ArrayList
    and is an example of a double-linked list. In addition the class implements both
    List, Queue and Deque.

    - HashSet. It is a Set and is implemented by hashing (explained below), and its
    primary quality is, that it is highly effective in terms of insertion and references
    to the elements.

    - TreeSet. It is also a set, but is implemented in a completely different way
    by using a red-black tree. Unlike a HashSet TreeSet guarantees that the elements
    are sorted.

    - HashMap. It is a map, which is a data structure comprising of key/value pairs.
    It implements the data structure using hashing.


