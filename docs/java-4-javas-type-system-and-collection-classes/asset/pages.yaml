  md: "# JAVA 4: JAVA'S TYPE SYSTEM\nAND COLLECTION CLASSES\n\nI have previously mentioned\
    \ the iterator pattern, and the above statement is legal because the class ArrayList\
    \ implements this pattern, and thus the class implements the interface Iterable<Integer>,\
    \ which defines a principle of how to traverse a collection. In fact, the above\
    \ statement is translated to like the following:\n\n```\nfor (Iterator<Integer>\
    \ itr = list.iterator(); itr.hasNext(); )\nSystem.out.println(itr.next());\n```\n\
    \nwhich is an ordinary for statement. I would later treat the iterator pattern\
    \ in details and including how it is implemented, but as an example of the inner\
    \ classes I will below shows a simple class that represents the primes:\n\n```\n\
    package primeprogram;\n\nimport java.util.*;\n\npublic class Primes implements\
    \ Iterable<Long>\n{\n    private long p = 2;\n    private long m;\n\n    public\
    \ Primes(long m)\n{\n        this.m = m;\n    }\n\n    public Iterator<Long> iterator()\n\
    {\n        p = 2;\n        return new PrimeIterator();\n    }\n\n    private class\
    \ PrimeIterator implements Iterator<Long>\n{\n        public boolean hasNext()\n\
    \        {\n            return p <= m;\n        }\n    }\n```"
