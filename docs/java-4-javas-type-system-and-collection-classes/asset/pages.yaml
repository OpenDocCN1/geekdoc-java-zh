  md: "JAVA 4: JAVA'S TYPE SYSTEM\nAND COLLECTION CLASSES\n\n# 6.1 CHECKED EXCEPTIONS\n\
    \nThe principle in exception handling is that a method can fail, and if so, it\
    \ raises an exception, which means the method immediately is interrupted with\
    \ a message to the method it called. Called a method that can raise an exception,\
    \ the calling code must handle this exception, which typically consists of encapsulating\
    \ the method call in a try/catch. Otherwise, the calling code is sending an exception\
    \ further up in the hierarchy of calling methods. The idea is that the method\
    \ that can raise an exception can see that something is wrong, but the method\
    \ can not know how the error should be handled. It can, however, send an exception\
    \ to the calling code in the hope that it knows how the error should be handled,\
    \ and does not that, it can forward the message up in method hierarchy.\n\nAbove,\
    \ I have everywhere methods raise an exception of the type Exception, and although\
    \ it works, it's not the idea. Java owns classes many exceptions and he has types\
    \ that tell us something about what is the reason for the exception. These exception\
    \ types are all directly or indirectly derived from the class Exception, and although\
    \ one can possibly use some of these types, it is typical that in the context\
    \ of an application defines its own exception types. The reason is partly that\
    \ in this way you can classify the various exceptions and treat them differently\
    \ but also that you get the chance to send values to the calling code.\n\nIn the\
    \ project concerning students I have added the following class:\n\n```\npackage\
    \ students;\n\npublic class StudentsException extends Exception\n{\n    public\
    \ StudentsException(String message)\n    {\n        super(message);\n    }\n}\n\
    ```\n\nIt is an exception type for exceptions for this program. You should note\
    \ that the class does not add anything new, and its sole purpose is to characterize\
    \ the exceptions raised by methods of the program's classes. In this way, these\
    \ exceptions are distinguished from exceptions raised by Java's classes. I also\
    \ added the following exceptiontype which defines the exceptions to the class\
    \ Subject."
