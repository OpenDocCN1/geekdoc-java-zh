    # 12.5 TEST


    When a program is finished, it must be tested in real environments and any of
    other than the programmer. In this case the program does not have to communicate
    with other programs, but the program must of course be tested, and it must be
    in correct user environment.


    In this case, you can create a folder somewhere on your hard drive and then copy
    the program''s jar file to start the program from a prompt. Then there is not
    much else to do than play and solve the square. Here you must pay particular attention
    to the high score list, and the players are correctly added to the lists. In addition,
    you must have an eye on the visual, and if all looks as it should do. Specifically,
    you can use the following test cases:


    +   1. Set the level to a 3x3 square

    2. Solve the square and add the user to the high score list

    3. Solve the square again, but this time with many swap, such that the user get
    a high score with many moves

    4. Solve the square a third time

    5. Show the high score list and examine whether the three players are correctly
    inserted

    6. Solve� another player is added to the high score list

    7. Display the high score list to ensure that the last player is properly inserted

    8. Repeat the above with a 5x5 square

    9. Manually delete the two files to high score lists

    10. Display the high score lists for a 3x3 and 5x5 square and ensure that they
    are empty


    If these test cases are performed satisfactorily, I will consider the program
    as tested and ready to use.'
