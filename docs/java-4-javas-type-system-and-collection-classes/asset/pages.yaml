  md: "# JAVA 4: JAVA'S TYPE SYSTEM\nAND COLLECTION CLASSES\n\nThis means that the\
    \ class is defined final and thus cannot be inherited. Moreover, you can see that\
    \ the class implements three interfaces. The second says that strings are ordered\
    \ and exactly tells the interface, that the class implements a method\n\ncompareTo(String\
    \ str)\n\nwhich is the comparison method for strings that compares strings in\
    \ alphabetical order. When the class String implements this interface, it means\
    \ among other things that strings can be sorted with Java's sorting methods. The\
    \ last interface tells something about what string is. Internally it is a String\
    \ array of characters, and you can refer to the individual characters with the\
    \ method charAt(). An important characteristic of the class String that it is\
    \ immutable, and means that you have created a String, it cannot be changed. For\
    \ instance you cannot change a character in a string. If you, for example have\
    \ the string\n\nString s = \"abcdefg\"\n\nand you want to change the character\
    \ d to a big D, you must write something like the following:\n\n```\ns = s.substring(0,\
    \ 3) + \"D\" + s.substring((4));\n```\n\nHere, you take a substring consisting\
    \ of the first characters and concatenates it with string consisting of the character\
    \ D. This result will be concatenated with the substring consisting of all characters\
    \ from index 4 to the end of string. Concatenation of two strings create a new\
    \ String object, and the above statement will create two objects, and the variable\
    \ s is set to return the result object instead of the original String. At the\
    \ class in this way is immutable sounds complicated, and it is at times too, but\
    \ the reason is performance, where it is important that the creation of string\
    \ is effective and a string not fills more than necessary. In practice it is not\
    \ something you think about when the compiler largely treats strings as other\
    \ simple types, and as the String has many methods.\n\nHowever, in special cases,\
    \ it is important that you are aware that manipulation of strings constantly creates\
    \ new objects. If you consider the following method (a method in the project Strings):\n\
    \n```\nprivate static void test01() {\n  String s = \"\";\n  long t1 = getTime();\n\
    \  for (int i = 0; i < 100000; ++i) s += \"A\";\n```"
