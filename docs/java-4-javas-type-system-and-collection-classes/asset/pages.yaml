    # 9.5 TRESET


    The class TreeSet is also a Set, and you can exactly do the same as you can with
    a HashSet, the difference is that a TreeSet arranges the elements in a specific
    order. The elements to be added to a TreeSet must be objects created on basis
    of a class that implements the interface Comparable. If so, it stands reasonable
    to use a TreeSet, if you need a Set, but you should be aware that a TreeSet does
    not have the same effectiveness as a HashSet, and if you do not need that the
    elements are sorted, you should choose a HashSet. It''s clear that it costs something
    when you have to insert elements and delete them again such that elements must
    be sorted.


    It is not such that a TreeSet is inefficient and if you need a sorted set, you
    should definitely disregard a TreeSet. Internally a TreeSet does not consists
    of an array, but is instead a data structure composed of nodes that are linked
    together in much the same way as in a LinkedList. In a TreeSet elements are organized
    in a binary tree:


    ![](img/b5644859a631cd6cec6e5143c5d485e6_148_0.png)


    and the requirements are that each element may not have more than two direct sequels,
    and there should be exactly one element that has no predecessors and is called
    the root of the tree. Furthermore, it must be the case if you stand in a particular
    node, then the left child must be null or less than you stand, and the right child
    must be null or greater. The sum of all is that if you stand in a certain node,
    then that node is root of a subtree in which all elements of the left subtree
    is less than the root and all elements in the right subtree is greater than the
    root. This is exactly what gives the tree and thereby also a TreeSet qualities.
    You can search the tree after the same principle as for binary search, and it
    is thus highly effective to ask whether an element is in a TreeSet, and iterating
    the data structure such that the elements are visited in sorted order are equally
    effective.'
