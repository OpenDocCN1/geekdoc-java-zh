    # 9.7 PRIORITYQUEUE


    I have above mentioned a queue, and a priorityqueue is a queue, where the elements
    are added according to a priority, that means the elements are oredere in the
    queue. The order can be defined by the natural ordering, that is the ordering
    defined by a class that implements Comparable, or by a Comparator provided at
    construction time. If a priority queue relying on natural ordering, objects inserted
    into the queue must be defined by a class that implements Comparable. When elements
    are retrieved from the queue (for example with poll()), it is the least element
    with respect to the specified ordering that is retrieved.


    The class is implemented by a heap, that is a data structure, which acts as a
    binary tree, but such that the element to be retrieved next is the root. It is
    an efficient data structure, and a PriorityQueu is then an efficient collection.


