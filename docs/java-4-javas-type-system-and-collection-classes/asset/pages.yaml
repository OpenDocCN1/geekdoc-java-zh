    # 7.3 GENERIC METHODS


    Also, methods can be defined generic. Below is a method that seeks an element
    in an array:


    ```

    public static <T> int linSearch(T[] arr, T elem)

    {

    for (int i = 0; i < arr.length; ++i) if (arr[i].equals(elem)) return i;

    return -1;

    }

    ```


    The method defined generic, as it an arbitrary array. The algorithm is simple
    and consists only in a run through the array from start to finish. If the element
    exists, the method returns -1, when it can not be a legally index. You should
    note that the method returns the index of the first element found. You should
