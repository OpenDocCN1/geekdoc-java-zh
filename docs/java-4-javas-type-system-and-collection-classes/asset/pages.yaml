    to solve the square by moving as few pieces as possible.


    The square is basically a 5×5 square, but it might be possible to configure the
    program that you can also play with a 3×3 square, a 7×7 square and a 9×9 square.


    # PROJECT START


    I created a folder puzzles, and it will contain all the files concerning this
    project. I have also created a subfolder doc, which will contain all the project''s
    documents. Preliminary contains this folder the above description of the task.


    # 12.2 ANALYSIS


    In this case, the analysis is simple, since the task is simple, and the formulation
    of the task extensively describes the task. There are few issues to be clarified.


    In the project description, the individual pieces are symbolized by letters. It''s
    ok by a 5×5 square, but is not sufficient by a 7×7 and 9×9 square. It is therefore
    to symbolize the pieces in a 3×3 and 5×5 square with letters, with that in a 7×7
    and 9×9 must be used integers from 1 onwards.


    With regard of the high score it should be attached a high score list for each
    of the four levels of difficulty, as it does not make sense of comparing results
    from different levels of difficulty.


    As the program''s philosophy is entertainment and results can not be regarded
    as significant, it is agreed that high score lists are saved as regular files,
    and the program does not require database access. This means that anybody can
    delete the high score lists.'
