    # 12.6 THE LAST STEP


    As the last part of the task that must be written a script that can install the
    software on a computer. As the first part I''ve drawn an icon for the program


    ![](img/b5644859a631cd6cec6e5143c5d485e6_177_0.png)


    that I have called puzzles.png. Then I have created a directory named puzzles
    that contains the program''s jar file and the above icon and the following script.
    To install the program you must then make the directory puzzles to the current
    directory and execute the script as


    ```

    sudo ./puzzles.sh

    ```


    This will create the necessary directories and the program is copied to /usr/local/games
    and get an icon on the desktop that refers to the program. The script is as follows:


    ```

    #!/bin/bash

    DIR=$ (pwd)

    cd /var/local

    if [ -d srv ]

    then

    cd srv

    if [ -d data ]

    then

    cd data

    else

    mkdir data

    else

    mkdir srv

    cd srv

    mkdir data

    cd data

    fi

    if [ -d highscores ]

    then

    rm highscores/* 2> /dev/null

    else

    mkdir highscores

    fi

    cd "$DIR"

    cp Puzzles.jar /usr/local/games

    ```


