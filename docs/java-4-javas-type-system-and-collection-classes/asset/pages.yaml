    \ If the array has n items, it uses n/2 comparisons in average. This method in\
    \ turn requires nothing about the elements and only they can be compared with\
    \ equals(). Therefore, the method could be applied to arbitrary type.\n\nAnother\
    \ search method is called binary search and can be used if you know in advance\
    \ that the array is sorted, for example in ascending order. The principle is that\
    \ you start to compare with the middle element, and if it is the element sought,\
    \ you are finished. Otherwise, it examines whether the element being searched\
    \ is greater or less than the middle. Is it bigger than, you know, because of\
    \ array is sorted if it exists, it must lie in the right half, or else it must\
    \ be in the left half. You now repeat the procedure, but only on the half of the\
    \ array. This means that you have halved the number of elements to be searched.\
    \ The same will happen next time, and in the last step (if the element is not\
    \ found previously) you get a subarray whose length is 0. If the array has n elements,\
    \ and each iteration halves the length, the necessary number of comparisons is\
    \ limited by (as you just should accept), but for large values of n, it is much\
    \ better than the n /2. The result of this little quick presentation of binary\
    \ search is that it is a search method that is much better than linear search,\
    \ but it is important to emphasize that it assumes the array to be searched, is\
    \ sorted.\n\nDownload free eBooks at bookhoon.com"
