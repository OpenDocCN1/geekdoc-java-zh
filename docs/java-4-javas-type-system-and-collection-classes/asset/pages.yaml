  md: "# JAVA 4: JAVA'S TYPE SYSTEM\nGENERIC TYPES\n\nIt is relatively simple to implement\
    \ binary search in Java. Below is a generic method, it requires that you can compare\
    \ the elements (whether to take the left half or right half), and the parameter\
    \ type must implement the interface Comparable:\n\n```\npublic static T extends\
    \ Comparable<T>> int binSearch(T[] arr, T elem)\n{\n    for (int a = 0, b = arr.length\
    \ - 1; a <= b; )\nn        int m = (a + b) / 2;\n        if (arr[m].equals(elem))\
    \ return m;\n        if (arr[m].compareTo(elem) < 0) a = m + 1; else b = m - 1;\n\
    \n    return -1;\n}\n```\n\nYou should note the syntax: Comparable<T>\n\nThe word\
    \ extends means the type T either must inherit a class or implement an interface.\
    \ In this case it is the interface Comparable<T>, which means that objects of\
    \ the type T can be compared. If you try to apply the method to objects that do\
    \ not directly or indirectly implement Comparable<T>, you get a compiler error.\n\
    \nOne say that the parameter type T is bound to the Comparable<T>. It of course\
    \ can also be used in the context of generic classes. Below a class Point to represent\
    \ a point of two coordinates. The coordinates type must be a number, and the wrapper\
    \ classes to numbers all extends the abstract class Number. Then I can write a\
    \ class that can be used by all wrapper classes:\n\n```\npackage generic;\npublic\
    \ class Point<T extends Number>\n{\n    private T x;\n    private T y;\n\npublic\
    \ Point(T x, T y)\n{\n    this.x = x;\n    this.y = y;\n}\n```"
