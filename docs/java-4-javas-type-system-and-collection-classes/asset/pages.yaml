  md: "# JAVA 4: JAVA'S TYPE SYSTEM\nAND COLLECTION CLASSES\n\nThere is one algorithm,\
    \ which is not obvious. One can simply shuffle the pieces randomly (using a number\
    \ generator) and if done, the square could not necessarily be solved. It is therefore\
    \ necessary with a strategy (an algorithm) to shuffle the pieces. The idea is\
    \ to start with a square that is solved, and then simulate random moves of the\
    \ pieces that can be moved (there are 2, 3 or 4 options). Repeats it times, and\
