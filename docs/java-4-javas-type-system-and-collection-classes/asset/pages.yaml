    the picture is:


    | 2 | 11 | 5 | 17 | 3 | 29 | 7 | 23 | 19 | 13 |


    You should note that you can use add() with an index and then all elements to
    the right of the index most must be moved to make room for the new element. You
    should also note that after these three statements, the entire capacity is used
    up, and the question is what happens if you add another element


    ```

    list.add(31);

    ```


    As mentioned previously, the idea of an ArrayList is that it automatically expands.
    When this happens the class uses an algorithm, that multiply the capacity by a
    constant (often it is 2), but in my present implementation, it is 1/2. Therefore,
    the capacity after adding another element is 15:


    | 2 | 11 | 5 | 17 | 3 | 29 | 7 | 23 | 13 | 31 | |


    The next time the array is extended, it will be to the capacity 22, 33, then 49,
    then 73 and so on. The idea is that in many cases the addition of an element is
    extremely effective, and only in a few cases in which the array is to be extended,
    there is for a long task. The array expands with increasing capacity, it becomes
    rarer that it must be expanded, and the result of all of this is on average, it
    is very effective to add elements to an ArrayList.


    As a programmer you should not think so much of it, because it is something that
    happens internally, but you should know the methods


    +   - add(), that add an element to the end of the list

    - get(), that returns the element at a particular index


    are highly effective, while methods like


    +   - add(), that adds an element at a particular index

    - remove(), that removes an element


    are less effective as they possibly must move many of the elements in the list
    (a list must not have holes).


