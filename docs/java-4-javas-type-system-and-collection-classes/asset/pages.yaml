    AND COLLECTION CLASSES


    As a final note to the class ArrayList please note that it implements the interface
    List and thus Collection and Iterable. Moreover the class implements three other
    interfaces: Serializable, Cloneable and RandomAccess. The first interface is discussed
    earlier, Cloneable I also mentioned earlier, and the last interface is a simple
    interface with no methods (such as an interface is called a marker interface).
    It tells the runtime system that the elements in an ArrayList can be referenced
    by an index.


    # 9.3 LINKEDLIST


    It''s also a list, and the class implements in the same way as an ArrayList List.
    In addition, it implements the interfaces Deque and Queue. Finally, it implements
    Serializable and Cloneable but not RandomAccess. The class also has other methods
    than an ArrayList, but what matters is that it is implemented in a different way,
    as a double linked list.


