    The program''s main shortcomings (restrictions) are as listed below:


    +   - There is nothing in deposits, and it makes it very uninteresting to play,
    as it is the whole idea of poker, and the ability to bluff falls thus also away.

    - The rules as the three virtual players use to exchange cards is very simple
    and static.

    - There are always four players, which should be more dynamic.

    - There is always played with 52 cards.


    In addition, the user interface is simple. The task has these limitations to make
    the program simple. In fact, it is quite complex to solve the first two of the
    above constraints in a good way. I will later returns to the task and look at
    a new version of the program that does not to have the same restrictions, but
    in this place you have to focus on types and especially enumerations and write
    the program as described.


    In poker each player deals 5 cards, and the player that finally (after players
    have exchanged cards) has the highest value, who won the game. The values are
    with decreasing value downwards (where an ace is always the highest):


    +   - straight flush, where you have five subsequent cards of the same color,
    that is, for example eight, nine, ten, jack and king in the same color

    - four of a kind where you have four cards of the same value, that is, for example
    four kings

    - full house, where you have a pair and three of a kind, for example two jacks
    and three fours

    - flush, where you have five cards of the same color

    - straight, where you have five subsequent cards, but not necessarily in the same
    color three of a kind where you have three cards with the same value, for example
    three six, but the last two cards are different and does not have the value six

    - two pairs that is, for example twos and two aces, while the last card is not
    three or an ace

    - a pair where there are two cards with the same values such as two jacks, while
    the last three cards are not a jack, not three of a kind or contains a pair

    - high card, where none of the above values occur


    In the case that two players have the same value, the card with the highest value
    is determining, and are they the same (as an example two players with a pair),
    it is the value of the first card, where the two players'' cards are different
    which determines the order.


