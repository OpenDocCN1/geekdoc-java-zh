  md: '# JAVA 4: JAVA''S TYPE SYSTEM

    AND COLLECTION CLASSES List


    A LinkedList consists of so-called nodes, where a node includes a data item and
    a pointer to the previous node, and a pointer to the next node. The first node
    (data element 11) has no predecessor, and its pointer to the previous node is
    null, and, similarly, the pointer to the next item in the node with the data element
    13 is also null. In turn, node 11 points forward on node 13, while node 13 points
    back to node 11.


    Compared to an ArrayList LinkedList has several methods to add items to the list:


    ```

    list.addFirst(2);

    list.addLast(53);

    list.add(3, 19);

    ```


    Here are addFirst() and addLast() are just special names for add() with index
