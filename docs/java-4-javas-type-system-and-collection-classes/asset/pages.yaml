    - fill(), that overfills all elements in a List with a specified value, and the
    method is useful to initialize a List.

    - copy(), that copy all elements in one List to another List. The destination
    List must be at least as long as the source. If it is, the remaining elements
    in the destination List are unchanged.

    - swap(), that swaps two elements in a List.

    - addAll(), adds all elements in an array to a Collection.


