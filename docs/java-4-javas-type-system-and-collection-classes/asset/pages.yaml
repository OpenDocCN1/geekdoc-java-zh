    Search string:


    +   1. The search starts from the beginning, and the index is 0. The search ends
    when the index is 1 when the substring "a" matches the regular expression.

    2. Next search stops with the index in place 2, where they have found the next
    substring "a" that matches.

    3. The third search finds the substring "a" and stop index of 3.

    4. Finally stops the last search when the end of the string is reached, and at
    that time the index is still 3 and you have found the empty string that matches
    the regular expression.'
