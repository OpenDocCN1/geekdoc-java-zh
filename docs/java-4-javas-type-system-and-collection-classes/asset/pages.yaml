    \    return t;\n}\n```\n\n```\npublic static boolean isPrime(long n)\n{\n    if\
    \ (n == 2 || n == 3 || n == 5 || n == 7) return true;\n    if (n < 11 || n % 2\
    \ == 0) return false;\n    for (long t = 3, m = (int)Math.sqrt(n) + 1; t <= m;\
    \ t += 2) if (n % t == 0)\n        return false;\n    return true;\n}\n```\n\n\
    When you create an instance of the class, you specify a positive integer, and\
    \ the object represent all primes less than or equal to that. This class allows\
    \ you to iterate the prime numbers that it represents. You can write something\
    \ like the following:\n\n```\nPrimes primes = new Primes(100);\nfor (long p :\
    \ primes) System.out.print(p + \" \");\nSystem.out.println();\n```\n\nThe class\
    \ implements the interface Iterable<Long>, which means the class must have a method\
    \ called iterator(), which returns an object of the type Iterator<Long>. An iterator\
    \ is an object that can refer to a particular item in a collection (here in Primes),\
    \ and has two methods hasNext() tests whether you have reached the end and the\
    \ next() returns the item that the iterator indicate at the same time moves the\
    \ iterator forward. Iterator<Long> is an interface, and you have to write a class\
    \ that implements this interface. This class will be used to instantiate an object\
    \ that is an internal property of the class Primes and the class is written as\
    \ an inner class PrimesIterator. Note that the class is private so it is only\
    \ known inside the class Primes.\n\nThe class Primes has two instance variables,\
    \ the first p is the prime, as currently reached, while the other m is the upper\
    \ limit of the primes, the class should represent. When PrimesIterator is an inner\
    \ class, it can refer to these variables, and the implementation of the class\
    \ is quite trivial. The class Primes implements the method iterator() – defined\
    \ by the interface Iterable<Long> – and it sets the start of primes to 2 and returns\
    \ an object of the type PrimesIterator."
