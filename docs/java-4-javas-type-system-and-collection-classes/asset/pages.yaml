  md: "# JAVA 4: JAVA'S TYPE SYSTEM\nAND COLLECTION CLASSES LAMBDA EXPRESSIONS\n\n\
    If you want to print all prime numbers, you can write the following class that\
    \ implements the interface ISelector:\n\n```\nclass Primes implements ISelector\
    \ {\n    public boolean select(int t) {\n        if (t == 2 || t == 3 || t ==\
    \ 5) return true;\n        if (t < 11 || t % 2 == 0) return false;\n        for\
    \ (int n = 3, m = (int)Math.sqrt(t) + 1; n <= m; n += 2) if (t % n == 0)\n   \
    \         return false;\n        return true;\n    }\n}\n```\n\nand you can print\
    \ the primes with the following statement:\n\n```\nprint(arr, new SelectPrimes());\n\
    ```\n\nIt is clear that in the situation where you want to transfer a method as\
    \ a parameter to another method it is obvious to use an anonymous class. If you\
    \ again wish to print all 2-digit numbers, you can use the following statement:\n\
    \n```\nprint(arr, new ISelector() {\n    public boolean select(int t) { return\
    \ t > 9 && t < 100; }});\n```\n\nwhere the ISelector type is defined on the basis\
    \ of an anonymous class. The class Select2 is unnecessary. Similarly, one can\
    \ print the prime numbers in the following way:\n\n```\nprint(arr, new ISelector()\
    \ {\n    public boolean select(int t) {\n        if (t == 2 || t == 3 || t ==\
    \ 5) return true;\n        if (t < 11 || t % 2 == 0) return false;\n        for\
    \ (int n = 3, m = (int)Math.sqrt(t) + 1; n <= m; n += 2) if (t % n == 0)\n   \
    \         return false;\n    }\n});\n```\n\nbut here are the benefits are not\
    \ as big as this leads to code that is hard to read. If you want to print the\
