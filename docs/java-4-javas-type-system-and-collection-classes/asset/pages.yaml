  md: 'The package name is by default the project name, but it need not be the case.
    A package statement must be the first statement in a source file (except for a
    possible comment), and the file must contains import statements as the next statements.
    A Java source file generally contains only one type and can contain only one public
    type, which must have the same name as the source file. If for example you have
    the type


    ```

    public class Str

    {

    ```


    the source file must be called Str.java and written with uppercase and lowercase
    letters as shown here. The file can contain several types, but it is generally
    advised not to do so, although there are sensible exceptions. When a file has
    several types, they can not be public, and therefore has package visibility.


    Until this place, my projects has only one package, but if you write a large program
    with many classes, I often choses to place classes into multiple packages, so
    that classes on the same concept are in the same package.'
