  md: 'JAVA 4: JAVA''S TYPE SYSTEM

    COLLECTION CLASSES AND COLLECTION CLASSES


    # 9 COLLECTION CLASSES


    A collection class is a container for objects, and a good example is the type
    ArrayList, which is discussed and used many times in the previous books. A collection
    class is a little more than a container for objects since the class also provides
    a number of methods available which are used to manipulate the container''s objects.
    Java has many other collection classes as ArrayList, and they differ in how they
    are implemented and store their objects, as well as the services they provide
    in the form of methods. Overall reflect these collection classes that typically
    occur in programs to manipulate a family of objects.


    It should immediately be said that the goal of this chapter is to give an overview
    of the collection classes, which exist and what they are used for, but it is not
    a detailed review of the collection classes and how they work. However, it is
    the subject of the book Java 17.


    Java collection classes are contained in a framework, which basically consists
    of three things:


    +   1. abstract classes and interfaces that defines the various collection classes
    and their main characteristics

    2. concrete classes that implements the interfaces in the framework

    3. algorithms that are methods for a number of typical tasks such as searching
    and sorting


    The whole framework is generic in both interfaces and classes, and the algorithms
    are defined as generic methods. The description of this framework is the goal
    of the following chapter. The first task is of course to get an overview of the
    content and in relation to how the various classes can be used. Moreover, it is
    necessary to have a general knowledge of how each class is implemented and working
    as it is a prerequisite for choosing the right class for the right task.


    # 9.1 OVERVIEW OF THE COLLECTION CLASSES


    There are many interfaces and abstract classes, which define the characteristics
    of the collection classes, and I will mention below the main. Basic the framework
    is a hierarchy, but there are individual classes which are outside the hierarchy.
    The main are abstract classes and interfaces where I actually already have used
    some of:


    +   * Iterable is an interface that defines a class implements the iterator pattern,
    and you can iterates the container''s objects with a for statement.'
