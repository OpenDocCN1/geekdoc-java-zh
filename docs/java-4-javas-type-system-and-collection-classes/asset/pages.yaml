  md: "# JAVA 4: JAVA'S TYPE SYSTEM\nAND COLLECTION CLASSES\n\nThe class is called\
    \ Factorial and implements the interface Iterable<Long>. It must, therefore, in\
    \ the same manner as the class Prime implements the method iterator(), and in\
    \ this case, the class has no other members. The method iterator() must return\
    \ an object of the type Iterator<Long> and hence I have to write a class that\
    \ implements this interface. The class does not have to be known outside the method\
    \ iterator(), and can therefore be written as an anonymous class, a class which\
    \ has no name. You should note the syntax:\n\n```\nreturn new Iterator<Long>()\n\
    {}\n```\n\nand an anonymous class must be defined on the basis of an interface\
    \ or a class that it inherits. With the class Factorial you can write a statement\
    \ like:\n\n```\nfor (long t : new Factorial()) System.out.println(t);\n```\n\n\
    There are many examples of the use of anonymous classes, for example the class\
    \ Primes, that can be written as follows, where the iterator is now implemented\
    \ as an anonymous class:\n\n```\npackage primeprogram;\n\nimport java.util.*;\n\
    \npublic class Primes implements Iterable<Long>\n{\n  private long m;\n\n  public\
    \ Primes(long m)\n  {\n    this.m = m;\n  }\n  public Iterator<Long> iterator()\n\
    \  {\n    return new Iterator<Long>()\n    {\n      long p = 2;\n    };\n\n  public\
    \ boolean hasNext()\n  {\n    return p <= m;\n  }\n```"
