  md: "# JAVA 4: JAVA'S TYPE SYSTEM\nAND COLLECTION CLASSES\n\nAn inner class is in\
    \ the same way as other members of the outer class associated with an object of\
    \ the outer class, and this means, that an inner class can never have static members.\
    \ Stated slightly differently, objects that are instances of an inner class, only\
    \ exists in an instance of the outer class. If outer is an object of type OuterClass,\
    \ you can create an object of the type InnerClass as follows:\n\n```\nOuterClass.InnerClass\
    \ obj = outer.new InnerClass();\n```\n\nConsider the following class OuterClass:\n\
    \n```\nclass OuterClass\n{\n    public int x = 0;\n\n    class InnerClass\n  \
    \  {\n        public int x = 1;\n    }\n\n    void print(int x)\n    {\n     \
    \   System.out.println(\"x = \" + x);\n        System.out.println(\"this.x = \"\
    \ + this.x);\n        System.out.println(\"OuterClass.this.x = \" + OuterClass.this.x);\n\
    \    }\n}\n```\n\nthat defines an inner class InnerClass. Both OuterClass and\
    \ InnerClass has a variable x, and because the two variables have the same name\
    \ they can shade for each other. The class InnerClass has a method called print(),\
    \ and it has a parameter, that is also called x. When the outer refers to x (the\
    \ first statement), it is the parameter that is referred to. When writing this.x\
    \ (the second statement) is the instance variable mentioned earlier that is referenced,\
    \ and that is the instance variable in the class InnerClass. If you write OuterClass.this.x\
    \ is the instance variable in the class OuterClass that it is. Performing the\
    \ following method:\n\n```\nprivate static void test()\n{\n    OuterClass outer\
    \ = new OuterClass();\n    OuterClass.InnerClass inner = outer.new InnerClass();\n\
    \    inner.print(23);\n}\n```\n\nDownload free eBooks at bookoon.com"
