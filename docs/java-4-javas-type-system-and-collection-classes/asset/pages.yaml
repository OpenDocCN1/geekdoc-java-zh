  md: "# JAVA 4: JAVA'S TYPE SYSTEM\nAND COLLECTION CLASSES\n\nI have extended the\
    \ class Student with a method that deletes a course, and the method is in the\
    \ interface Student as follows:\n\n```\n/**\n * Deletes a course which a student\
    \ is enrolled or have completed.\n * @param course The course to be deleted\n\
    \ * @return true, if the course was deleted and false otherwise\n */\npublic boolean\
    \ remove(ICourse course);\n```\n\nA course can obviously be dropped if the student\
    \ has the course in question. If, and so, the calling code needs to be notified.\
    \ It could be solved by changing the method so it raises an exception, but the\
    \ method instead returns a value (true or false) indicating whether the method\
    \ is performed correctly or not. The method must therefore have a return value,\
    \ which tells the users how it was accomplished. In this case, it is simple to\
    \ implement the method as the ArrayList works the same way:\n\n```\npublic boolean\
    \ remove(ICourse course)\n{\n  return courses.remove(course);\n}\n```\n\nA prerequisite\
    \ for the method works is, moreover, that the class Course overload equals() with\
    \ value semantics, this is not the case and you have to implements equals() in\
    \ the class Class.\n\n```\npublic boolean equals(Object obj)\n{\n  if (obj ==\
    \ null) return false;\n  if (getClass() == obj.getClass())\n    return getId().toUpperCase().equals(((Course)obj).getId().toUpperCase());\n\
    \  return false;\n}\n```\n\nThe use of the return value as an indication of whether\
    \ a method was properly performed is an excellent solution and the advantage that\
    \ it is not necessary to encapsulate the called code in a try/catch. However,\
    \ it also has its limitations and drawbacks, if the method returns a value. Where\
    \ appropriate, the return value may be incorrectly interpreted as a result of\
    \ a return value rather than an error code. Another problem is that the user can\
    \ simply ignore the return value, and do not test it."
