    The program''s idea is comparable with other entertainment programs like solitaire
    programs, which is also associated with a kind of high score list. It is therefore
    decided that the high score should be developed general in order to be used in
    other applications. A high score will consist of


    +   - a name (the user who has obtained the score)

    - a score, that is an integer

    - a time which indicates when the high score is achieved


    Moreover, one must be able to specify an ordering that indicates where large values
    of the score is positive or negative. A high score list must have room for a certain
    number of high scores, as should be defined when the list is created.


    # REQUIREMENTS SPECIFICATION


    The program should basically have the following functions:


    +   1. *Play* where the user has an interaction with the program and rearrange
    the pieces until the square is resolved, or the user giving up.

    2. *New game* where the user selects a new game. This means that the pieces are
    shuffled and the state of the program is set to start.

    3. *Update high score list*, a feature which is triggered by the program when
    the square is resolved and the user''s point indicates that the user should be
    on the list. The user must then enter an identification in the form of the name
    or any other text.

    4. *Show high score list*, where the user chooses to view the high score list.

    5. *Choosing the difficulty level* where the user must select a square size. This
    will automatically result in a new game.


    Regarding the high score list there are the following requirements:


    +   1. The high score list should show the top three and thus the players who
    have solved the square by moving as few pieces as possible.

    2. Each high score consists of a name, a date and time and the number of pieces
    that are moved.

    3. It should not be possible (from the program) to delete the high score list.'
