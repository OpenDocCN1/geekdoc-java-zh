  md: '# JAVA 4: JAVA''S TYPE SYSTEM

    AND COLLECTION CLASSES


    +   - Collection is a basic interface as the most of all classes in the hierarchy
    implements. It''s rare that you directly refer to this interface, but it can be
    used if you write general methods, and some of methods in the class Collections
    have parameters whose type is this interface.


    +   - List is an interface that defines containers that have a sequence of objects,
    where each object is identified by an index. A List cannot have holes, but it
    may contain the same objects more than once. An ArrayList is an example of a List.


    +   - Set, SortedSet, NavigableSet, Queue and Deque are all interfaces for containers,
    not allowing the same element to exists several times. A SortedSet arranges the
    elements in sorted order, while a NavigableSet offers search options. Queue is
    an interface where you can access the oldest element and the Buffer is actually
    a Queue. We call such a data structure a FIFO for First In First Out. In contrast,
    a Deque represents a data structure where you always have access to the newest
    element, and you''re talking about a LIFO data structure for Last In First Out.
    A stack is an example of a Deque.


    +   - Map, SortedMap, NavigableMap are base classes for containers which stores
    key / value pairs. A SortedMap keeps the keys in sorted order. A NavigableMap
    is a Map, which offer special search options. These three classes are other types
    of classes are not part of the same hierarchy as Iterator and ListIterator are
    interfaces for iterators, and the difference is that the last interface defines
    the methods of traversing a collection in both directions.


    The relationship between these types are shown below:


