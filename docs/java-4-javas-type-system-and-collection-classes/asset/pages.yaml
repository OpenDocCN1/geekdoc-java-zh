    # # 11 PACKAGES


    A Java program consists of many classes and interfaces. First, the classes that
    yourself write, and the classes that come from the Java API. To avoid name matches
    and to increase clarity, classes and other types are placed in packages. For example
    Java''s classes divided into a very large number of packages. The base package
    is java.lang, and it contains all the basic classes such as String, System, Object,
    the wrapper classes etc. Classes in this package is immediately available for
    the runtime system, and you do not have to do anything to use these classes. These
    are different with classes in other packages. As an example, I have often used
    the class Random. This class is in the package java.util, which name is a package
    of miscellaneous classes or tools. This means that the full name of the class
    is java.util.Random. If you have to create an object, you can write:


    ```

    java.util.Random rand = new java.util.Random();

    ```


    When it is difficult to write (you have to write much), and it also makes the
    code harder to read, you can specify import statement:


    ```

    import java.util.Random;

    ```


    which tells what the class Random means, and so you can just write the class name:


    ```

    Random rand = new Random();

    ```


    One should note that it is also the thing that an import means and it is not a
    question that anything is imported into the program, but only that the class Random
    is directly available. When programs and classes use many classes from the Java
    API, it can lead to many import statements, and therefore it is allowed to write


    ```

    import java.util.*;

    ```


    which shortly means that you can directly use all the classes and interfaces in
    the package java.util. It''s something that is my opinions and arguments for and
    against, but I usually use the short notation.


    When you in a NetBeans project creates a new class, it is automatically placed
    in a package with a package statement as the first statement:


    ```

    package projectName;

    ```'
