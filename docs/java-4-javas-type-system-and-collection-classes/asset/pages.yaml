    EXCEPTION HANDLING


    # 6 EXCEPTION HANDLING


    In the preceding examples, both in this and the previous books I have used exception
    handling.

    In principle, it is quite simple, but still are a few things you should know about.


    In practice it is often that a method of one reason or another cannot perform
    the desired

    operation, for example because the parameters have illegal values, or otherwise
    an error

    occurs when the method acknowledges the error, it may

    of course cancel the action, but it must also make the calling code aware that
    there is an

    error. This can be achieved by the method raises an exception, or it can be done
    with

    a return value. The last was formerly a widely used method for handling these
    kinds of

    errors, and the way has both its applications and limitations, so I will start
    here. I will use

    t project Students from the previous book, where I will introduce some changes
    in order

    to better error handling.


