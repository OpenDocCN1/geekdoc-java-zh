  md: '# DOMESTICATED ALIENS


    context. (In this case, the production context regards the design of the typeface,
    not production in terms of printing text, which is focused on in the next chapter.)
    Rather than looking at the characteristics of an object, she understands materiality
    as a process of interpretation. This approach to materiality is the foundation
    for the following analyses. To understand how meaning is achieved, one needs to
    start with a formal analysis of the artefacts and examine them from the point
    of view of composition, color, shape and forms, texture, and lines, to name a
    few of the categories an art historian uses to approach or another kind of visual
    artefact. In the following analyses, I consider how the typefaces are used in
