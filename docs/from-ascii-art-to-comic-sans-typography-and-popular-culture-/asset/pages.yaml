    There are some private collectors, the folksy art form seems to have gone under
    the radar of most cultural heritage institutions. It is hard to find ASCII art
    in the collections of museums and archives. For instance, a search for “ASCII
    art” in the Europea web portal returned zero hits. The art form falls between
    two stools and has no natural institutional, being too artsy for technical museums
    and too technical and mundane for art museums. Technical museums have focused
