    discrete symbols like the alphanumeric characters of the ASCII code. Computer
    graphics was in its infancy in this period.^3 But the computer operators and programmers
    of the early days took up the baton from the teleprinter operators and the typewriter
    artists, found ways around the limitations of the mainframes and the line printers,
    and made text-based images before computer graphics came of age.


    A Dictionary of the Internet defines ASCII in the following way: “A collective
    term used to describe pictures, sometimes pornographic, which have been produced
    by just using the ASCII character set. The advent of graphical programs means
    this form of graphic display has declined markedly.^4 I consider this definition
    slightly biased. Although it is true that pinups are a popular ASCII genre, they
    were not necessarily pornographic, and many other genres were popular, notably
    celebrity portraits and cartoon characters. The statement about the decline of
    the art form is also questionable, since ASCII art has been quite persistent and
    has lived on different shapes and contexts to today.


