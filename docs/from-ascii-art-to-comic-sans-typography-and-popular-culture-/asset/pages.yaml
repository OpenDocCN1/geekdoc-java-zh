    CHAPTER 1


    “Media archaeology rummages textual, visual, and auditory archives as well as
    collections of artifacts, emphasizing both the discursive and the material manifestations
    of culture.”—37 A large part of the time I have spent doing this research has
    been devoted to rummaging through the internet and internet resources. I have
    used search engines, mainly Google, and then proceeded through links and references
    on the pages I found. These often have led me to other internet resources, printed
    books, films, and other artefacts and then back to internet resources. “Searching”
    should not be construed as a mechanical process. It is part of a problem-solving
    process whereby the initial conception of the problem must be constantly modified
    in light of new information that emerges during the process. One must be prepared
    to turn in a direction other than the one planned on. It has been like following
    Ariadne’s thread, although I do not claim to have found the final way out of the
    labyrinth; there is much more material to be discovered and to be explored.


    My process is also archaeological in the sense that the finds I have made been
    regarded as shards. This has been my task to piece them together into a meaningful
    whole. However, the empirical data cannot be represented 1:1, such as a social
    media post with thousands of comments. I have taken samples from longer conversations,
    but put them together, and combined them with other sources, thereby distilling
    the patterns that I either saw from the start or became aware of during the process.


