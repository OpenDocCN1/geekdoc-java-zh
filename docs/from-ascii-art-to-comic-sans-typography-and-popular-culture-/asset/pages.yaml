  md: '# CATCH ME IF YOU CAN


    Based on the 1980 book of the same name, the movie Catch Me If You Can, directed
    by Steven Spielberg and released in 2002, is a fictionalized account of the early
    life of Frank Abagnale, who spent his late teens as a successful impost and fraudster.
    During several years in the 1960s, he posed as a pilot, a doctor, and a lawyer
    and came by great sums of money by swindling banks and companies. Check forgery
    was his specialty, and one of his schemes was altering the routing number at the
    bottom of the check. Numbers decide which bank the check is sent to clearing,
    and by changing one number, a forger could send the check to a distant bank across
    the country, causing a long delay in clearing. FBI agent Carl Hanratty zealously
    pursues Abagnale throughout the movie and explains during a presentation to his
    colleagues that “a-zero to a one-two means that check, which was cashed in New
    York does not go to the San Francisco Federal Branch.” It took a couple of weeks
    for the banks to detect the problem, and in the meantime, Abagnale could continue
    to forge many more checks before moving to another city. His methods grew more
    and sophisticated. He started making changes to checks manually and then moved
    on to a typewriter and a MICR machine, and when he eventually was captured in
    France in 1969, he was operating a huge Heidelberg printing press in order to
    produce realistic checks.


    In this movie, the typeface is not primarily a design element. It is a vital part
