  md: '# FROM EMERGENT TECHNOLOGIES TO ESTABLISHED INFRASTRUCTURE


    In the second half of the twentieth century, computer technology was promoted
    as a promising technology of the future by members of the computer industry and
    researchers in artificial intelligence, although there were also skeptical voices.20
    Engineers adopted the new technology, which greatly alleviated the burden of calculations,
    but there was a certain conservatism in the trade. In the early 1980s in the technical
    industries, where engineers had become used to working with mainframe computers,
    there was a reluctance to shift to new technology in the beginning. Around the
    turn of the millennium, major transformations in the media-technical landscape
    were taking place, and in the 2010s, digital telecommunications and the internet
    had become a common available infrastructure, at least in the Western world. The
    three following examples—an article in a computer magazine, an exhibition catalog,
    and a visual identity program—illustrate this development.


    # PERSONAL COMPUTING


    In computer magazines in the 1970s and 1980s, Data 70 was often seen in advertisements
    of computer manufacturers and shops as well as editorial material. Louise Kehoe’s
    “Engineers Get Personal with Computers,” which appeared in the October 1981 issue
    of Personal Computing, uses a customized combination of Data 70 and Computer set
    against a red-and-black background photograph of a construction site. Workers
    are climbing ladders, and a big crane is visible at the left of the picture. This
    article also uses the typeface for drop caps (large highlighted initial capital
    letters) and for pull quotes (sentences pulled out of the text and displayed by
    means of layout) in the pages that follow.


    The article is not futuristic. It is about the present and the near future. The
    argument is that engineers could benefit more than they think by acquiring personal
    computers. Many engineers were used to mainframe computers and their high processing
    capacity and tended to underestimate the usefulness of small hobby computers.
    Some early adopters were interviewed and share their experiences. In contrast
    to big computers that rely on time sharing, the personal computer is “instantly
    accessible,'
