  md: '# 76 CHAPTER 3


    visual identity where these typefaces play a vital role. I have identified three
    main categories relating to the perception of technology and have chosen cases
    that highlight these categories from the 1960s to the present day. In the final
    sections, I draw together the main themes. The overarching questions asked are:
    What different meanings do the typefaces assume in different times and contexts?
    What roles do the typefaces play, and how do they perform these roles? What different
    connotations can they carry?


    # THEORY AND METHOD: SEMIOTICS AND VISUAL ANALYSIS


    In her classic speech of 1930, "Printing Should Be Invisible," scholar of typography
    Beatrice Warde conjures the ideal of typography as a crystal goblet that does
    not obscure its content. She contrasts this transparent vessel with a golden goblet,
    however valuable, cannot perform the same service for the text that the crystal
    goblet could. Typography should not take center stage but an unobtrusive face.
    A similar dichotomy, although without the same normative intent, is presented
    in Johanna Drucker’s The Visible World: Experimental Typography and Modern Art,
    1909–1923. She uses the labels marked and unmarked to distinguish the ways typography
    is deployed in commercial and literary texts. She traces this distinction back
    to the dawn of book printing, when the first printed bibles represent the unmarked
    text where words "appear to speak themselves" and text flows in even blocks across
    the pages. The marked text, on the other hand, uses a variety of typefaces and
    structural devices to make the text grab the attention of the viewer. This conspicuous
    form of typography thrived especially in advertising in the nineteenth century,
    when a change of attitude towards design occurred.


    The machine-readable typefaces used in popular culture in the 1970s and 1980s
    fit well the marked category. These typefaces are remarkable in the literal sense
    of the word and would not form a grey on a page. Instead, they are used to read
    along with the linguistic meaning of the text, and that is why I have chosen to
    make close readings of a and visual artifacts that are dependent on the typefaces
    for their semiotic meaning. The case of machine-readable typefaces demonstrates
    the relevance of Drucker’s model of materiality and the interplay between the
    conditions of production and the social'
