    oeuvre. The letterforms are often derived from the vernacular visual language
    of sign makers, but the textual messages are generally enigmatic and laconic,
    verging on the surreal. In the 1960s, he portrayed mostly single words (for instance,
    space, honk, salt, lawyer) using different perspectives, letterforms, colors,
    and materials. From the 1970s, on statements began to appear in his works—for
    instance “Contact lens at bottom of swimming pool” and “A heavy shower of screws."


    At the end of his book They Called Her Styrene, which contains 575 of his word
    images, he writes, “Sometimes words are the most pure because they have nothing
    to do with you. I take things as I find them. A lot of these things from the noise
