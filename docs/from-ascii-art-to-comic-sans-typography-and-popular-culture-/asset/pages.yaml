  md: '# 4


    # THE MULTISENSORY DOT

    MATRIX PRINTER


    Since its establishment in the mid-twentieth century, the computer industry has
    experienced a rapid pace of innovation. Technological solutions have succeeded
    one another, and obsolete equipment has been left to gather dust in basements
    and attics. This chapter is about one such piece of technology—the dot matrix
    printer—and the challenges it has presented for typography and its unintended
    aural potentials. The aim of the chapter is to show how the multisensory features
    of the printer have been explored, both for utilitarian purposes in the industry
    and for creative purposes by private persons and artists. The printer has become
    part of our cultural and technical heritage and has acquired a place in the memory
    of owners and users. When pictures, advertisements, and other memorabilia are
    mentioned and posted in online forums and blogs by retro nerds, nostalgic stories
    appear in the commentary fields. The printer generates an output with a distinct
    visual appearance, but sound is arguably its most conspicuous feature, which is
    why memory practices related to the dot matrix printer involve musical compositions
    and performances. Key questions are being asked: What typographic challenges did
    the printer present? How was it marketed? How have the multisensory aspects of
    the printer been explored? What kind of memory practices are connected to the
    printer? What are the contemporary applications of dot matrix printing?


    # THEORY AND METHOD: MATERIALITY AND BRICOLAGE


    Just as in chapter 3, Johanna Drucker''s model of materiality will be relevant
    here but in a slightly different manner, since I pay much attention'
