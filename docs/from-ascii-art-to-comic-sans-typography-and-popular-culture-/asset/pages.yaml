  md: 'Cordeiro was an established artist before he ventured into computer art, and
    he made works with an artistic intention that went beyond experimentation with
    new means of expression. He worked together with a physicist, Giorgio Moscati,
    a relationship built on mutual exchange. In the work Genete Ampli*2, the motif
