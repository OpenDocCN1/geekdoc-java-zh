- img_proc: true
  md: 'Originating as a way of enriching the text environment and allowing for a greater
    range of human expression, ASCII art can be viewed as an argument against technological
    determinism, as it shows that individuals can shape the uses to which technology
    is put.^5 Here ASCII art is presented in a more positive light as an instrument
    for creativity and as a means for humans to gain the upper hand over the machines.


    The material base on which ASCII was usually printed was continuous-form paper
    (also called fanfold paper) that was fed through the printer and was often green-striped
    and 132 columns wide. These green and white bars made it easier for users to follow
    the code as it printed, but there was also plain white fanfold paper. The wide
    format and the continuous form made it suitable for images and oblong posts. A
    horizontal perforation made it possible to separate the individual sheets, and
    a vertical perforation along the margins with sprocket holes to tear away. This
    procedure created some paper dust, and the resulting single sheets had serrated
    edges.


    The aim of this chapter is to examine some of the uses to which ASCII art was
    put in the days before computers developed into the image-making machines that
    today''s film industry and the gaming industry rely on. Specific attention is
    paid to ASCII art within computer centers, an environment that was an important
    breeding ground for the art form. Key questions asked in the chapter include these:
    What kinds of ASCII art were created? For what purposes was ASCII art made? How
    was ASCII art displayed, circulated, and published? How is it now being collected
    and archived? Could ASCII art be seen as a postdigital practice?


    # THEORY AND METHOD: INTERVIEWS AND VISUAL PERCEPTION


    A suitable method for finding out how people use a certain technology is the interview.
    I reached out to a number of people who worked in the computer trade in the 1960s,
    1970s, and 1980s, asking for interviews. I also did a small number of phone and
    email interviews. For the subject of ASCII art, I started out locally. A retired
    employee of the computer center at Gothenburg University agreed to an interview
    and provided me with valuable information. I then contacted other IT history researchers,
    who recommended that I speak with a former head of the'
  merge: -1
  pgno: 38
- img_proc: true
  md: 'computer center at Stockholm University. After our interview—where he, among
    other things, pointed to me an interesting instance of ASCII art used in the context
    of medical research—he emailed some of his colleagues, one of whom had saved a
    large number of printouts with ASCII art and was willing to share his memories
    of the art form and its context with me. Some of the people recommended to me
    had no memories of ASCII art. They had been retired for many years and had lost
    interest or never had an interest in this marginal phenomenon of their working
    life.


    Simultaneously, I searched for and contacted bloggers and website owners who mentioned
    an interest in ASCII art. One American engineer agreed to answer my queries via
    email and also forwarded the questions to three of his contacts. Another method
    I tried to contact non-governmental organizations (NGOs) and computer museum volunteers,
    but I received few or no answers. I realized had to target specific persons, and
    a later attempt directed at computer museums in Great Britain and in Germany rendered
    me two answers. This account is meant to illustrate the meandering paths that
    sometimes must be taken to find informants who are able to share information about
    events and practices that took place half century ago. My study of ASCII art would
    have been more successful if it had been conducted ten or twenty years earlier.
    Nevertheless, the interviews provided me with valuable material, context information,
    and pictures.


    # VISUAL PERCEPTION: SHIFTING BETWEEN DIFFERENT MODES OF SEEING


    Letters are usually disciplined, carrying out their duties in the lines of text
    soldiers in an army platoon. In ASCII art, the soldiers have broken free from
    their usual positions in order to perform a piece of modern ballet, where they
    appear in unexpected and irregular constellations and can stand on top of each
    other. The original purpose of the letters and the other characters have subsumed,
    and they have lost their conventional semiotic compass. Their bodies now constitute
    pictorial elements from which a larger picture is built. This is not a new phenomenon
    in the history of art. Mosaic is one of the oldest artistic techniques. But'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'in contrast to mosaic shards, halftone dots, and pixels, the elements of ASCII
    art are carriers of meaning and are meant to be read. The perception of art made
    of small elements involves switching between looking at a picture from a distance
    and looking at it at close range. At a sufficient viewing distance, the image
    as a whole emerges, whereas the viewer moves closer to the image, the elements
    themselves become more noticeable, and it becomes harder to perceive the motif
    in its totality. In addition to this, ASCII art entails switching on and off reading
    the letters and seeing them as abstract forms. Sometimes these two modes of perception
    have to coexist, as when an ASCII artwork contains a signature of the art. There
    are also more elaborate hybrid forms, as when the characters function simultaneously
    as pictorial elements and semotic signs, as is shown in the medical examples below.


    Even when the characters do not fulfill their usual function, it would be wrong
    to regard the characters as meaningless in ASCII art. With their different forms
    and the thin and thick parts of their bodies, they help create a new pictorial
    meaning. art is a form of abstraction, in one way as it thins the fabric of representation
    and in another way it adds to it by turning the picture into a riddle to be solved.
    ASCII art engages viewers by inviting them to adopt different positions and modes
    of reading/viewing, and I would argue that these aesthetics constitutes much of
    the allure of ASCII.


    # ART AND EXPERIMENTS


    ASCII pictures where the characters are used for drawing lines and contours are
    called structure-based ASCII art, whereas pictures with grayscales resemble photography
    are called tone-based ASCII art. In 1965, H. Philip Peterson, who worked at Control
    Data Corporation Digraphics Laboratories, made a tone-based version of Leonardo
    da Vinci’s Mona Lisa that became widely known. Control Data offered Peterson’s
    picture as a gift to customers of the company. It also made use of the picture
    at the beginning of a 1968 promotional film for a CalComp plotter, where a large
    Mona Lisa poster is seen hanging on a wall. During the film’s enumeration of suitable
    applications of the plotter, examples from different disciplines are shown—meteorological
    maps, scatter plots from'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'atomic physics, molecular structures, architectural drawings, computer programming,
    and music—all made in the manner of line drawings. The film''s last example feature
    shows the Mona Lisa, during which the voiceover says that the Cal plotter can
    produce "even complex pictorial representations, from the output of any standard
    digital computer." The tone-based Mona Lisa is shown first in close-up, so that
    the digits that make up the greyscale picture are discernible, and when the camera
    zooms out, the motif as a whole becomes visible.¹¹⁰


    Beginning in 1963, the journal Computers and Automation held competitions for
    computer art and displayed such art on its covers.¹¹ Peterson wrote an article
    about the Mona Lisa for the journal. He found that the journal''s covers so far
    had been too dependent on analog forms and claimed, that on the method used for
    creating it, his version of the Mona Lisa could be regarded as a "pure" digital
    artwork. He explained that he divided the picture into cells, scanned a color
    projection slide of the painting to measure the density of different parts of
    the picture, and then filled the cells with digits that matched the density of
    the slide of the Mona Lisa. Peterson designed a special font for the experiment:
    "I designed the font in such a way that the larger the pair of digits are, the
    darker they appear to the human eye at cell. Up close to the picture, you see
    what the computer ‘sees''—namely, a number field; at about 30 feet away, you see
    the picture shaded as well as a newspaper photograph.¹² The creation of shades
    in a picture was not something that could be achieved with a plotter in its normal
    working mode, hence the designation "complex pictorial presentations" in the film.
    Peterson''s article contains much quantitative information concerning the working
    process, the size and number of cells, the number of plotter steps, and the number
    of hours (sixteen) it to plot the work.


    Peterson''s picture became known by the name Mona Lisa by the Numbers. The picture
    is mentioned by computer pioneer Ted Nelson in his Computer Lib / Dream Machines,
    where he refers to it as "Lizzie of the line printer." A cruder version of it
    is reproduced in Nelson''s book, and clarifies his stance on this kind of images
    by adding "NOTE: this is not a ‘computer picture.’ There is no such thing. It''s
    a quantization put out on a line printer.¹³ There was no consensus about what
    constituted a computer picture at the time.'
