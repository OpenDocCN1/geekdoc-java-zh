    to the printer as an apparatus. The body of the printer, its modus operandi, and
    its malfunctions form part of the “physical, substantial aspects of production”
    that Drucker regards as one of the two main components of her model, which also
    takes the social context into account.¹ I highlight-the social context of the
    printer by examining how it was marketed by analyzing manuals and advertisements
    from the 1980s and how it was used and reused by tinkerers, artists, and common
    users during the following decades. In line with Drucker’s thinking, the printer
    and its printing activity will be involved in a process of interpretation that
    does not presuppose the existence of any “true” character of the device.


    In order to carry out such an interpretation, I have used bricolage the method:
    it is an eclectic method that puts together a variety of methods and sources in
    sometimes unorthodox ways.² I have done something similar in the previous chapters
    as well, but my inquiry has been more open-ended, since I had only vague ideas
    of what I would discover.


    To form a picture of the dot matrix was and still is, I examined digitized (and
    therefore searchable) back issues from the archives of academic journals, the
    websites of artistic organizations that seem to have been frozen in time and were
    last updated in 2012, and current videos on how to mend a broken printer, among
    other things. This archaeological excavation has required an open mind in my part
    as to made me aware that a piece of technology might come to mean something entirely
    different in the future, despite its position as “dead media” on the market.


    Some of this chapter is devoted to different multisensory aspects of the printer—how
    sound can be translated into words for the purpose of spying on the information
    being printed, how awful and visual impressions are connected to memories of the
    device, and how sound and images have been explored in the making of music. The
    multisensory approach and the concept of technostalgia are also explained in later
    sections.


    # THE DOT MATRIX PRINTER AND THE PRINCIPLES OF PRINTING


    The dot matrix printer had its heyday during the home computer boom in the 1980s
    when it became one of the most common computer peripherals. In the mid-1990s,
    it was overtaken by the inkjet printer, which'
