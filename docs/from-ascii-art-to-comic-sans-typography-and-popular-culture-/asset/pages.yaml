  md: 'Furthermore, the semiotic perspective, with its idea that typography has a
    great potential for signification, permeates the book. Typefaces and their means
    of design, production, usage, and distribution are regarded as semiotic resources,
    which are “the actions, materials and artifacts we use for communicative purposes.”—29
    The term is used in social semiotics, a branch of semiotics that has been developed
    by Gunther R. Kress and Theo van Leeuwen, notably in their book Reading Images:
    The Grammar of Visual Design. They regard it as a contribution to a broadened
    critical discourse analysis that is not restricted to language.³30 Their view
    on discourse course analysis serves as a model for the way I perform discourse
    analysis in this book.


    One of the cornerstones of social semiotics is that communication is multimodal.
    Modes can be visual, verbal, or gestural, and van Leeuwen argues that typography
    is a semiotic mode in its own right. It conveys meaning in terms of the formal
    forms of the letters themselves, and the connection to the layout of which the
    text forms a part.³¹ Although I do not always explicitly reference its nature
    rather 마찬가지, social semiotics is a theoretical framework that underlies much of
    the thinking of the book. In multimodal analysis, different modes are taken into
    account. Multisensory analysis is related to the multimodal, but here the phenomena
    are seen from the perspective of the perceiving being. multisensory research is
    carried out on touch, smell, and taste.³² Typography has all these dimensions,
    which have been explored in the works of graphic designers Sarah Hyndman and Ellen
    Lupton, among others.³³ Multimodal and multisensory qualities and the ways they
    are connected to memory are highlighted in the analysis of the printed and printing
