    # ADP AND THE VULNERABILITY OF SOCIETY: CONSIDERATIONS AND PROPOSALS


    Even government reports are dependent on graphic design to communicate their messages.
    In the 1970s, Swedish society had become computerized to a high degree. At the
    time, the term automatic data processing (ADP) was commonly used for the field
    now called informatics. Before the advent of digital consumer electronics, which
    now pervade everyday life, many sensitive societal functions were performed with
    the help of information technology. The Swedish Ministry of Defence ordered an
    inquiry in 1977 into the risks this entailed and the measures that could be taken
    in order to mitigate the vulnerability caused by computerization.49 The final
    report from 1979 divides the vulnerability into external and internal factors.
    Among the external factors considered are sabotage, espionage, war, geographical
    and functional concentration, lack of knowledge, registers, dependency on key
    persons, disaster preparedness, and foreign dependency to a few. Many weak areas
    were identified, such as the concentration of resources and know-how in a large
    computer centers in the major cities in Sweden. Because the domestic computer
    industry could supply only certain types of computers and peripherals, the count
    was dependent on foreign manufacturers. The committee in charge of the inquiry
    recommended an authorizing procedure for actors that would set up registers with
    personal data, traffic management systems, process control systems, and other
    sensitive systems, in both the public and private sectors. At the time, computers
    were connected via the telecommunications network, then still consisting of overhead
    lines in less densely populated regions in Sweden.'
