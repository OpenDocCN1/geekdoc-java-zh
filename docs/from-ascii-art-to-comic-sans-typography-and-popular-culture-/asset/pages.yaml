    # The sociological argument


    Comic Sans is an epitome of bad graphic design done by amateur designers who have
    access to desktop publishing tools they do not master. Professional graphic designers
    feel they must defend their territory and retain their cultural status as experts
    and position in the labor market.⁷


    A common counterargument to the first two arguments, the usage argument and the
    aesthetic argument, is that the same can be said about many other typefaces that
    have not met with the same degree of hatred. The sociological argument has generated
    the most debate. It revolves mainly around cultural capital, but economic capital
    is also at play in this argument, since professional-quality type are commodities
    and entail a cost for the discerning designer who needs to access to a large selection
