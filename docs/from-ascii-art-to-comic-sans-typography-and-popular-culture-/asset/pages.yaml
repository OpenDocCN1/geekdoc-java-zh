    # MEDIA ARCHAEOLOGY AND THE LACUNAS IN HISTORIOGRAPHY


    This is essentially a media archaeological inquiry


    On the basis of their discoveries, media archaeologists have begun to construct
    alternate histories of suppressed, neglected, and forgotten media that do not
    pointentially to the present media-cultural condition as “perfection.”⁹ Dead ends,
    losers, and inventions that never made it into a material product important stories
    to tell.


    In the fields of computing and typography, as in most other fields, history is
    usually smoothed out to avoid aberrations and marginal phenomena that do not fit
    the narrative based on the most important figures and the greatest achievements.
    In order to be included in the history of typography, one needs a name, certainly
    if one is a typeface,'
