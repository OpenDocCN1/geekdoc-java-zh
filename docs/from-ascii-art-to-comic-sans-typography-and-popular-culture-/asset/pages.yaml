    # MAGNETIC IN CHARACTER RECOGNITION (MICR)


    In the postwar era in the United States, as banking services became available
    to a wider spectrum of society, many more people opened personal checking accounts,
    hugely increased the number of checks banks had to handle. Since the processing
    was largely manual, the situation soon became untenable. In the 1950s, in cooperation
    with Bank of America, the Stanford Research Institute embarked on an automation
    project that led to the invention of a check coding system based on magnetic ink.
    For Bank of America, it was important to avoid major alterations to the check,
    which it regarded as an emotional link to the customer. A system based on punch
    cards was therefore out of the question, and solutions based on adding strips
    of paper or using fluorescent ink were also useless. The research team concluded
    that magnetic ink was the only way forward, but how would the codes be designed?
    Codes were easy to read for computers but illegible for humans. Instead, a set
    of characters was devised, consisting of ten digits and four extra glyphs, that
    together constituted the magnetic ink character recognition (MICR) font. It had
    the advantage of readable by both machines and humans, which was necessary for
    staff members to be able to handle errors manually. In 1959, the banking industry
    settled for this solution,'
