  md: '# SURVEILLANCE AND RISK


    technology even by a generation that was not born when the typeface was invented.


    Typefaces for both magnetic ink recognition and optical recognition were invented
    at a time when computers were starting to have a broader influence on society.
    Computing expanded its territories, and the computer was no longer a tool for
    scientific calculations. During the Cold War, military technology aimed at global
    surveillance was developed in the United.³⁶ In a survey conducted about public
    attitudes towards computers in 1971, a vast majority of respondents agreed that
    computers affect the lives of all citizens. More than half expressed concerns
    that few large organizations are in charge of information millions of people and
    that “computers will be used in the future to keep people under surveillance.³⁷
    In Sweden, a country that was an early adopter of computer technology, the use
    of personal code numbers and the risks involved in the processing of personal
    data became a major issue in the 1960s. The world’s first Data Act for regulating
    the handling of personal data was adopted by the Swedish parliament in 1973.³⁸
    The historian Lars Ilshhammar looks back at this development.


    From being viewed as an administrative tool, increasing efficiency in the service
    of the expanding welfare state, the computer to an even greater degree came to
    be understood as a control and surveillance technology during the second half
    of the 1960s. At the beginning of the 1970s computer technology joined power as
    the symbol of the large-scale and inhumane society.³⁹


    The following examples demonstrate how machine-readable typefaces helped to conjure
    up the ominous aspects of computer technology in popular culture, in the art world,
    and within government. The first two concern the original typeface for magnetic
    ink character recognition (MICR), E-13B. Both examples occur in the 1960s, in
    one film about check fraud and the other in an artwork from the pop art era. The
    third example is from the late 1970s and the use of Data 70 on the cover of a
    report from a Swedish public inquiry.'
