    # OPTICAL CHARACTER RECOGNITION (OCR)


    In optical character recognition (OCR), printed text is read by a scanner and
    converted to alphanumeric characters. OCR is more flexible than MICR in ordinary
    ink can be used, and nowadays, a wide variety of letterforms can be read. However,
    when the technology was introduced in the 1950s, special fonts had to be developed,
    and just like E-13B, typefaces made for OCR were a compromise between what humans
    could read and what machines could recognize. Characters with similar forms—like
    capital B and the number 8, could easily be differentiated by humans—presented
    difficulties for computers. Consequently, such characters had to be redesigned
    with an eye to increasing the contrast between them. The typeface OCR-A was developed
    in the early 1960s by American Type Founders, and the United States of America
    Standards Institute (USASI) made it a standard in 1966.\wi14


