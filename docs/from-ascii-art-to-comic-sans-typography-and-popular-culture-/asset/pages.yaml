  md: '# #3


    # ## DOMESTICATED ALIENS

    MACHINE-READABLE TYPEFACES IN POPULAR CULTURE AND BEYOND


    Reading large amounts of information is a laborious and time-consuming endeavor.
    In the mid-twentieth century, business and administration were fields where human
    reading capacity became a problematic bottleneck and where the need for machine-readable
    data led to the development of machine-readable typefaces. In the 1950s, two different
    technologies were developed in parallel the United States—magnetic ink character
    recognition (MICR) and optical character recognition (OCR)—and gave rise to typefaces
    that required a fundamental rethinking of traditional typographic principles.
    These creations looked rather than the human eye, like Frankenstein''s monsters
    assembled from ill-matching parts. Differing from traditional typographic aesthetics
    turned out not to be a negative, however, but instead to be an asset in certain
    cultural contexts. In the 1970s and 1980s, typefaces found a wide application
    in computer magazines, science fiction literature, and art publications. The alien
    forms were domesticated, and a functional necessity was developed into a style
    that became charged with connotations of the future. These included dreams about
    the potentials of computer technology as well as apprehensions about the arrival
    of a surveillance society. In the new millennium, machine vision sharpened, and
    computers today can read printed text and detect many other visual features in
    our environment.¹ In this postdigital era, surveillance has become integrated
    into everyday life to such an extent that we rarely notice the cameras that record
    our movements in public space.


    This chapter contains narrative, visual, and semiotic analyses of films, books,
    book covers, a work of art, a magazine article, and a company''s'
