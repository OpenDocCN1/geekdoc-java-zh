    and time consuming, if even possible. The dot matrix printer lacked the kind of
    precast characters and instead produced letters in the form of dots in a matrix.


    A printhead with a number of vertically positioned pins ran across the paper and
    made a mark on it by hitting a cloth ribbon that had been soaked with colored
    ink. Simpler models had seven pins, which meant they could not print descenders,
    such as the parts of g, p, and y that descend below the baseline (see the y and
    g in figure 4.19). Now these strokes themselves sitting on the baseline, gave
    the text an awkward appearance and disturbed the reading. When new models were
    advertised, the ads stressed that these printheads were "descenders". The Epson
    MX-80, which was released in 1980 and became a common model, had nine pins, and
    more sophisticated later models had twenty-four pins. Some models could also print
    graphics.


    The dot matrix printer could not compete with its competitors in print quality,
    it outdid them in this era with the help of flexibility, speed, and cost per page.
    It printed on fanfold paper and could handle carbon copies. It could print either
    in draft mode, which was fast but yielded lower quality, or in "near letter-quality"
    mode (a term coined for market purposes), which was achieved through multiple
    passes of the print-head. In draft mode, the gaps between the dots were clearly
    visible, and in near letter-quality mode, the letters were denser, but the dots
    were still easily discernible. The maximum resolution for dot matrix printers
    is 240 dots per inch (dpi), whereas the resolution of inkjet and the laser printers
    are typically 1200 dpi or higher. These printer types are also based on dots,
    but the dots are smaller in size and appear to merge when printed.


    Unlike handwriting, printing is supposed to generate similar results in each run.
    But mechanical devices have their own individual traits, a fact that was explored
    by Arthur Conan Doyle in one of his Sherlock Holmes detective stories, "A Case
    of Identity." Holmes solves the mystery by comparing handwritten letters and comes
    to the conclusion that they must have been typed on the same machine on the basis
    of damaged and worn letters. In the field of forensics, there is a need to identify
    the manner in which documents have been created and to tie them to a certain typewriter
    or printer, if possible. Equipment wear, such as a bent pin, is one way of identifying
