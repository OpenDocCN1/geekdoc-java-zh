    # DISPLACEMENT: THE PATHS TO POPULAR CULTURE


    All four typographic phenomena discussed in this book belong to Drucker''s marked
    text category. This is a requirement for becoming a character in popular culture.
    A common typeface used for body text or a common display typeface, however well
    known it in the graphic design trade, does not qualify. It must have eccentric
    quality, which is usually found in the history of its inception. The four phenomena
    have made unexpected and hard-to-predict trajectories. They started out in one
    place and then pushed typography into an expanded field, a bewildering new territory
    where the usual rules of typography did not seem to apply. It would be wrong to
    say that the four phenomena have been absorbed by the popular culture. The process
    can rather be characterized as an exchange.


    In previous chapters, I Map the different paths taken by the four phenomena on
    their way to popular culture. Irrespective of the differences, their paths have
    some things in common. All of the phenomena were created for a serious purpose—printing
    lists, providing bank checks with codes, printing out word processing texts, and
    making a screen font that fitted into a user-friendly operating system interface.
    But programmers, designers, users, and companies saw the potential for other applications
    of these technological solutions. Programmers created letter art, designers created
    a full typeface from the restricted MICR character set, users the dot matrix printer
    into a musical instrument, and Microsoft decided to make the screen font available
    to all their users. These steps were thus taken by private persons and corporate
    managers—in some cases when the technology was still in use and in other cases
    when it had been superseded by newer solutions. What matters is not so much the
