    # STILL GOING STRONG: CONTEMPORARY USES OF DOT MATRIX PRINTING


    The story of technology is often told as a line of constant progress and evolution.
    In reality, that line meanders or travels on parallel tracks.68 The traditional
    dot impact printer is not just a museum object that generates nostalgia. It has
    lived on and is still manufactured by companies such as Epson and Oki. From its
    prominence in the 1980s and 1990s, it has been relegated to the margins of the
    printer market in the West, where it is mostly used as a utility printer for receipts,
    warehouse reports, freight documents, and similar purposes. It is still a fully
    functional device that has some advantages over printer types in that it can operate
    in harsh environments, multipart forms, and because it is an impact printer, make
    carbon copies. The cost per page is low, and the lifespan of the printer is long.69
    The dot matrix concept, although performed with the help of other technologies,
    offers flexibility and makes it possible to print on nonflat surfaces. Legibility
    is still an issue that readers, human and otherwise, have to deal with. Three
