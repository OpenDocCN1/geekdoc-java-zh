    CHAPTER 1


    design, printing, and dispersion. The four phenomena deviate from typographic
    norms and traditions and often illustrate how things are not supposed to be done.
    In chapter 2, ASCII art is highlighted as an example of an unintended usage of
    letters and printers. At a time when computers meant to process numbers and print
    crude forms of text, ASCII art arose as an image-making practice that served artistic,
    scientific, and playful purposes. In the 1960s and 1970s, when staff members in
    computer centers put banners and posters with popular motifs, they were challenging
    the rational and serious image of the computer trade. At the same time, they used
    ASCII art to showcase the versatility and potential of computer equipment.


    Chapter 3 examines how machine-readable typefaces, originated in the banking industry,
    came to represent computing and technology in general, often in science fiction
    and other popular culture settings. The connotations included dreams of the future
    as well as fears of a surveillance society. The chapter is mainly devoted to semiotic
    analysis of artefacts such as films, book covers, artworks, and logotypes, where
    typefaces play a major role. Close readings and visual analysis of these artefacts
    help us better understand the signification process that machine-readable typefaces
    have gone through.


    In chapter 4, the materiality of the dot matrix printer is the focus. In contrast
    to the reduced and rigid typographic possibilities of line printers, dot matrix
    printers offered users much more flexibility, and the smaller variants were affordable
    for the general consumer. These features came at the expense of the integrity
    of the letterforms, which were composed of small dots. The irregular clearly violate
    the criteria for being “types” in the traditional sense of printing. Some manufacturers
    marketed the printer as a precious new family member, which is highlighted in
    the chapter through the analysis of advertisements and user manuals. The shrill
    and characteristic sound of the printer is not mentioned in the marketing material,
    but it has left a clear mark in the memory of users. Its sound was also used for
    diverse purposes as musical performances as well as acoustic eavesdropping, a
    form of spying that involves the translation of sound into text. The chapter is
    centered around nostalgia and multisensory experiences, and recollections of users
    in social media form an important part of the material.'
