    could print high-resolution color images and made much less less noise. Somewhat
    later, in the late 1990s, the laser printer became the preferred printer for word
    processing on the home computer market, and the dot matrix was relegated to niche
    applications, for which it is still used. The AppleWriter was introduced in 1985,
    and Macintosh and its accompanying software soon took the lead in the desktop
    publishing trade. Small businesses could now make their graphic materials without
    relying on professional typesetters. But Apple solutions were expensive, and other
    models were more popular on the home computer market, including microcomputers
    such as the Amstrad CPC, Commodore 64, and TRS-80 and later personal computers
    like the IBM PC and its many clones. The dot matrix printer was relatively inexpensive,
    and despite its poor quality, its flexibility had a great appeal.³ This was in
    a period when neat letters were typewritten, and computer output meant uppercase
    letters in messages from tax authorities on line printers attached to mainframe
    computers. Word processing now made it possible to print both uppercase and lowercase
    letters and set part of a sentence in italics. It would take a few years before
    the drop-down menu with a long list of typefaces to choose from become the standard
    on most platforms and programs.


    Bitmapped images are made up of pixels or dots in a grid, and both computer screens
    and modern printers are based on such raster graphics. The dot matrix concept
    had been applied to printing already in the 1920s when the Hellschreiber dot matrix
    teleprinter was invented, but technology based on the concept did not come into
    its own until desktop publishing created a demand for fast and flexible printing.
    Up until the 1970s, the printers most common in the computer industry were similar
    in one important aspect: they had a set of fixed characters forged in metal that
    struck against a color ribbon.⁴ typewriters had hammers, and line printers had
    drums, chains, or bars where characters were applied. A contemporary competitor
    to the dot matrix printer was the daisy wheel printer with interchangeable font
    wheels. These solutions—where each letterform corresponds to one piece of solid
    material—offered high-quality printing, but they were vulnerable because of the
    many mechanical parts involved in the construction of the printers. They were
    also inflexible, since changing fonts was complicated'
