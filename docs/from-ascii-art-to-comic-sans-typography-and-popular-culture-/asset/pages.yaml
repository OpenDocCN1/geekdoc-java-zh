    The sound generated by dot matrix printers arises from multiple sources—themotor,
    the carriage that moves the printhead back and forth across the page, the pins
    of the printhead striking against the ribbon, and the movements of other mechanical
    parts of the printer. Sound is not only a side effect of the printing process.
    It is a semiotic resource that carries meaning that can be interpreted by humans
    as well as machines. When being used for its original purpose of printing text
    and graphics, the dot matrix printer emits a sound that can reveal frequent users
    what kind of output is being sent to the printer. An article on the dot matrix
    printer in Paleotronic magazine touched on this aspect of the printer:


    They were loud and distinct, the pins of their print heads hammering through their
