- img_proc: true
  md: 'I have presented here. One, for instance, look more deeply into the way typography
    in general can become popular culture in its own right, as I did in the case of
    Comic Sans.


    I have touched on the issue of sound, especially in the study on the dot matrix
    printer. However, the practice of using old computer equipment for making music
    is not restricted to printers. All sorts of equipment—such as floppy disk drives,
    hard disks, and scanners—emit sounds and can be used for musical compositions
    or other sound-based works.¹18 My point of departure has been art and visual studies,
    and I acknowledge the need for competence in music and musicology to advance the
    auditory aspect.


    Gender issues are topical in our time and several of the themes of this book raise
    questions about gender equality and the representation of gender. Because both
    the computer industry and the typographic trade are male-dominated areas, the
    study on ASCII art provides fertile ground for further research on the visual
    and social aspects of the practice from a gender perspective.


    Future research could also entail a wider geographical outlook. This book is mainly
    Western-oriented, but the four phenomena, or other, similar phenomena, could open
    up for research involving other parts of the world.'
