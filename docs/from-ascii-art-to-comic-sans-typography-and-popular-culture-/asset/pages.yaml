  md: '# 1


    # INTRODUCTION


    In the opening titles of the political thriller *Three Days of the Condor* (1975),
    a young female employee is seen tending to a state-of-the-art computer at a clandestine
    Central Intelligence Agency location where literature is analyzed in order to
    uncover plots relating to CIA operations. While she inspect scans and changes
    tapes, the opening credits run across the screen. By presenting the computer and
    its functions to the audience, she also presents a major theme of the movie. The
    choice of the typeface Computer for the titles underlines the importance of computer
    technology for the activities of the CIA. Movie titles are generally one of the
    main devices used by filmmakers to set the tone of a film and prepare the audience
    for what is to follow.¹ The Computer typeface has its origin in a machine-readable
    font developed for bank checks in the 1950s. The engineers who invented the font
    probably never dreamed that one day would be used in film titles and exploited
    by the entertainment industry. This kind of displacement of use and context of
    typography in a time of rapid technological change is the overarching subject
    of this book.


    Since Gutenberg invented the movable-type printing press, a number of technical
    innovations have changed the conditions for typography. This is not to say that
    the art of typography has passively submitted to new technology. On the contrary,
    typography and typographers have paved the way for technology by design innovations.
    This evolution has not always gone smoothly and without friction. The four typographical
    phenomena presented in this book highlight the cultural clashes that have occurred
    between the emergent computer technology and the traditional field of typography—the
    nerdy practice of making images out of letters, the strange-looking machine-readable
    typefaces, the poor-quality'
  merge: -1
  pgno: 9
- img_proc: true
  md: '![](img/6523835531b4434ccf1ff4c5e4bfbe47_10_0.png)


    **Figure 1.1** Opening titles from *Three Days of the Condor*, Sydney Pollack,
    1975.


    letters of dot matrix printers, and the contempt directed against the typeface
    Comic Sans. Together they form a picture of how technologies developed for a functional
    purpose can find their way to popular culture by being used in ways that are unintended
    and unforeseen by the original creators. The four phenomena illustrate in many
    ways letters, typefaces, and printers are not supposed to be designed or used.
    In contrast to postmodernist designers, they appear to have broken the rules deliberately
    rather through ignorance, unawareness, and functional necessity.² Still, this
    manner and somewhat quaint typographic phenomena have made a non-negligible cultural
    impact.


    My ambition with this book is to tell the cultural history of these phenomena
    and provide new insights into typography, computing, and popular culture by adding
    pieces to the puzzle of their joint history. Material, visual, and a aspects of
    text and typography from the 1960s to the present time are taken into account
    to put these phenomena and the trajectories they have followed in a broader cultural
    context. Typography is placed in an expanded field that extends far beyond the
    printed page into the modes of communication and publication afforded by the internet.³
    The book is intended to be a contribution to the fields of visual studies, science
    and technology studies (STS), and popular culture studies. I envision an audience
    of students and scholars in these fields and perhaps also in design history, media
    history, type history, and the history of computing.'
