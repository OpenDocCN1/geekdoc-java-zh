  md: '# INTRODUCTION


    9


    Computing history is too vast and diverse to be the subject of a single book,
    and are instead works devoted to different aspects of its history. Springer''s
    nineteen-volume series History of Computing and the academic journal IEEE Annals
    of the History of Computing do not mention any of the four phenomena. In The Routledge
    Companion to Global Internet Histories, ASCII art is touched on in passing the
    chapter on Japanese internet culture, but the focus is on the written narratives.¹16
    Major milestones in the history of hardware and software development are featured
    in The Innovation in Computing Companion, but none of the four phenomena covered
    in this book appears in the volume.¹17 One could perhaps hoped to find a note
    on dot matrix printers, but printers in general are not the focus of the book,
    nor are they in other accounts of the history of computing. Printers are peripheral
    devices, even in the historiography of computing. The one book I have found on
    the subject, Edward Webster''s Printer Unchained: Fifty Years of Digital Printing,
    1950–2000 and Beyond: A Saga of Invention and Enterprise, presents different printing
    technologies, among them the dot matrix printer, as well the engineers behind
    them and some of the pioneering manufacturers.¹18


    The results of this short survey of mainstream historiography in the fields of
    computing and graphic design are not surprising. ASCII art, machine-readable type,
    dot matrix printers, and Comic Sans have not played a major role in the history
    of printed mass media and with professionals in the graphic design trade. In the
    history of computing, machine-readable typefaces and dot matrix printers had a
    brief moment of fame but were supersed and made obsolete by other technologies.
    ASCII art and Comic Sans are probably too irrelevant to even be mentioned in the
    context of the history of computing. When these phenomena are put in the context
    of popular culture, however, merits appear more clearly. They deserve a place
    in history where they do not fall between two stools.


    # THEORETICAL AND METHODOLOGICAL APPROACHES


    For each chapter, I have made an effort to find a suitable theoretical and methodological
    approach that brings out salient features and aspects of the phenomenon in question.
    As the cases are quite diverse, this means'
