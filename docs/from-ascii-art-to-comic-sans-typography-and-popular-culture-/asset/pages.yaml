  md: 'Reference works on the history of graphic design and typography are primarily
    concerned with the trade of graphic design and printed mass media. Most of the
    attention is devoted to prominent designers, important typefaces, and major publications,
    and this also is true for graphic design in the digital age.^13 Although graphic
    design is to a high degree connected to popular culture in the form of advertising,
    publishing, and filmmaking, the phenomena treated in this book are all absent
    from the reference works. Dot matrix printers are not mentioned in Philip B. Meggs
    and Alston W. Purviss''s History of Graphic Design or in Stephen Ekilson''s Graphic
    Design: A New History. In the latter, a box is devoted to Comic Sans, introduced
    with the following words: ‘In the contemporary age, there has been a curious phenomenon
    whereby fonts have broken into the mainstream.’ These two books are based on a
    continuous narrative, in contrast to Paul McNeil''s The Visual History of Type,
    which is a reference work of a different kind, containing images of specimens
    of over 320 typefaces organized chronologically according their publication dates
    and accompanied by short presentations that put the typefaces into a historical
    context. McNeil’s catalogue raisonné includes Comic Sans and some machine-readable
    typefaces (E-13B, OCR, and Data 70). The latter are also mentioned in David Jury''s
    Reinventing Print: Technology and Craft in Typography, which revisits the history
    of graphic design and typography in the light of the development of digital technology.
    The only mention of ASCII art or other kinds of letter art I found in the general
    histories of graphic design is in Johanna Drucker and Emily Varish''s Design History:
    A Critical Guide.^14 This phenomenon seems to be a real outsider because it is
    hardly mentioned in the histories of computing age. One rare occurrence is in
    Paul E. Ceruzzi''s A History of Modern Computing, a book with a focus on important
    milestones in the development of hardware and software. ASCII art is briefly mentioned
    in connection with the IBM 1403 printer:


    It was a utilitarian device but one that users had an irrational affection for.
