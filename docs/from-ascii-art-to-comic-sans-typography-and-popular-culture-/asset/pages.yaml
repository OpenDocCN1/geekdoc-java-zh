    the term technostalgia is defined as “Nostalgia for simpler technologies. Typically
    induced by technological hypersaturation of the early twenty-first century.” The
    example sentence given in the definition is “At the thought of my teens, I was
    overcome with technostalgia for the clunky block of my first cassette walkman.”61
    At Wiktionary, technostalgia is defined as “Fond reminiscence of, or longing for,
    outdated technology.”62 Media history researcher Tim de Heijden defines technostalgia
    as “the reminiscence of past media technologies in contemporary memory practices.”63
    For the purpose of the topic of this chapter, the following definition, derived
    from the previously quoted definitions, is proposed: “technostalgia is a driving
    force in memory practices involving simpler and outdated technologies.” Collecting,
    refurbishing, and demonstrating old items are examples of such practices.


    Originally, nostalgia meant longing for a distant or lost home, but the concept
    now refers to longing for the past. Literary scholar Svetlana Boym distinguishes
    between two main types of nostalgia, restorative and reflective. Restorative nostalgia
    is at work when a nation-state attempts to restore a heroic past and a common
    origin. The nation-state takes itself very seriously and would not define itself
    as experiencing nostalgia but representing the truth. Those experiencing reflective
    nostalgia are aware that the feeling is nostalgia, often in a self-mocking and
    humorous way. Reflective nostalgia does not rely on any single narrative and instead
    “cherishes shattered fragments of memory.”64


    The technostalgia concerning old dot matrix printers is mostly of the reflective
