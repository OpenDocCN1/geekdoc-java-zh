  md: '# 10 CHAPTER 1


    that I use an eclectic range of methods, which are presented in the follow-ing
    overview of recurring approaches, perspectives, and concepts. I return to these
    in later chapters and add other theoretical and methodological perspectives where
    they are applicable.


    Several meanings have been ascribed to the term *postdigital*, and discussions
    on how it relates to the digital are ongoing.¹19 It is often used with regard
    to temporality as a way of defining the present time as the "postdigital era"
    or the "postdigital age.". In his book *Reinventing Print: Technology and Craft
    in Typography*, David Jury pinpoints the general conception of the postdigital
    era quite well when he writes, "Digital technology is no longer the daring technologies
    of boundless possibilities, but something, to which we have grown accustomed and
    its possibilities understood."²⁰ New media has not become old but has become habitual
    media.¹ The fact that the novelty of new media and digital technologies has faded
    into the background will change how we use the technologies and how we perceive
    them. Media scholar David M. Berry claims that the postdigital has become an inevitable
    part of everyday life and that previous dichotomies—such as offline and online,
    digital and analog—are now passé and irrelevant.¹² Another media scholar, Alessandro
    Ludovico, argues in his book *Post-Digital Print* that "print" and "electronic"
    should not be considered as antagonists but that there are several ways in which
    these technologies and cultures can coexist.²³


    One could argue that this study has been carried out at a postdigital moment in
    time, which means that enough time has passed for the phenomena to be put in perspective
    but not so much that the material study is based on has disappeared or become
    unintelligible due to a loss of context. Although not all the phenomena in the
    study are postdigital in the sense of being conceived in the postdigital era,
    they can be viewed in the light of the postdigital concept. The postdigital has
    a strong connection to aesthetics and artistic practices. According to media art
    researcher Christian Paul,


    The terms "post-digital" and "post-Internet" attempt to describe a condition of
    artworks and "objects" that are conceptually and practically shaped by the Internet
    and digital processes—taking their language for granted—yet often manifest in
    the material form of objects such as paintings, sculptures, or photographs.²⁴'
