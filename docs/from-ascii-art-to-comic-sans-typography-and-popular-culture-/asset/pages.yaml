  md: 'Similar experiments in digitization and visual perception took place at Bell
    Labs in New Jersey, which provided a fertile ground for experiments in the intersection
    of technology and art in the 1960s. According to computer art pioneer A. Michael
    Noll, The digital art at Bell Labs was both a result of research in computer graphics
    and a stimulus for that research. As an R&D organization, Bell Labs was keenly
    interested in the display of scientific data and also in computer graphics as
    a form of human-machine communication.\¹⁴ Two of his colleagues, Leon Harmon and
    Kenneth Wilton, devised a method to scan photographs and convert them to numerical
    data. They made several pictures with this method, using communication symbols
    instead of letters and numbers. Strictly speaking, these pictures were not ASCII
    art, but they built on the same principle. The aim was “To develop new computer
    languages that can easily manipulate graphical data; To explore new forms of produced
    art; To explore some aspects of human perception.\A a reclining nude, called Studies
    in Perception #1, attracted the most attention and became famous through exhibitions
    and publications.


    Studies in Perception #1 was based on a photograph specifically taken for the
    purpose of being digitized. The picture appeared in the Museum of Modern Art’s
    exhibition The Machine as at the End of the Mechanical Age in New York in the
    winter of 1967–1968 and in the Institute of Contemporary Arts’ exhibition Cybernetic
    Serendipity: The Computer and the Arts in London in 1968.\¹⁶ According to an anecdote
    regarding its origin, Knowton and Harmon printed the picture as a mural and attached
    it to the wall of a colleague’s office. It was considered too risque by Bell Labs
    and had to be taken down, but when Robert Rauschen showed it during a press conference
    about the organization called Experiments in Art and Technology (see below), the
    picture made it to the front page of the New York Times and was subsequently deemed
    respectable art.\¹⁷ However, as this statement by Johanna Drucker shows, this
    visual experiments hold an ambiguous position in art history:


    Engineers tended to downplay aesthetics, emphasize functionality, and call anything
    with any pictorial value as a work of “computer art.\ By the mid-1960s, experiments
    at Bell Labs and a handful of other industrial and academic sites had created
    enough of this “art” for computer graphics to be exhibited and appreciated, if
    only as curiosities.\¹⁸'
