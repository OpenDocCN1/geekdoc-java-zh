  md: '# INTRODUCTION


    Many art students are keen on working with hybrid technologies and are attracted
    as much by digital imperfections like the glitch as by, for instance, the scratches
    and dust of analog photography and film. Those students adopt “a post-digital
    hacker attitude of taking systems apart and using them in ways which subvert the
    original intention of the design.”25 It is perhaps the postdigital attitude that
    can best be applied to the four phenomena, in the view of the unintended and creative
    uses to which the technologies involved have been put.


    There are several ways to define the concept of discourse. For the purpose of
    this book, I regard a discourse as made up of the sum of all statements that are
    made about a certain phenomenon. Although originally a linguistic concept, I use
    it in the extended, multimodal sense, comprising textual, visual, a, and to some
    extent even haptic statements and expressions. The popular discourse I focus on
    consists of different kinds of participants. The voices of design practitioners
    and social media users are put in dialogue with the voices of researchers. The
    digital context requires a new kind of discourse analysis that takes new modes
    of communication and practices into account.26 My material is multifaceted and
    consists of videos, still images, and written statements posted on social media
    sites as well as on other websites, some of them created as early as the mid-1990s,
    when the World Web was in its infancy. The dynamic between the posted content
    and the comments in the commentary fields have yielded valuable insights into
    the phenomenon. Many posts keep getting new comments years after they were first
    published, but I have not engaged in the conversations myself; my approach is
    qualitative but only in a limited sense ethnographic;27 I have studied only public
    content at open sites; closed communities are not part of the study. Although
    written, much of the material is oral in character and could be labeled as Walter
    J. Ong called “secondary originality, a hybrid form of oral and written communication
    that has emerged in the age of electronic technology.”28 Spoken language is often
    the model used by social media participants for addressing their followers and
    by blog authors for addressing their audience. To some extent, this whole book
    can be regarded as an outcome of discourse analysis, but it is in the chapter
    on Comic Sans that this approach is brought to the fore, and I return to it there.'
  merge: -1
  pgno: 19
