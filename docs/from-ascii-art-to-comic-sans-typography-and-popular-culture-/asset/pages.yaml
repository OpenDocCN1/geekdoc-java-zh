    is understood as a process of interpretation rather than a positing of the characteristics
    of an object.”$^{35}$ Drucker’s approach to materiality is my point of departure
    throughout the present study.


    Just as materiality has been downplayed within typography, it has been neglected
    within new media, which have often been characterized as immaterial. Digital humanities
    scholar Kirbaum followed the footsteps of N. Katherine Haynes, a pioneer in the
    field of electronic literature and textuality, when he highlighted the materiality
    of some early works of electronic literature in his book: *New Media and the Forensic
    Imagination*. His concept of materiality is also indebted to Drucker, although
    Kirschenbaum focuses on the intricacies of digital storage media instead of on
    the printed page. He distinguishes between two faces of materiality—forensic materiality*,
    referring to the physical surfaces of inscription and their individuality, and
    *formal materiality*, referring to the computer’s capacity to manipulate abstract
    symbols. The line between the two concepts cannot be drawn neatly between hardware
    and software, which are themselves constructions based on the early computer practices.$36$
    I agree with Kirschenbaum that the borders between hardware and software are increasingly
    blurred, even more than now when *Mechanisms* was published in 2008.


    In this chapter, I attend to different aspects of materiality where the balance
