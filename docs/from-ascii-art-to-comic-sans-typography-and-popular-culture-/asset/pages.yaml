    sphere that educated typographers and designers. The technical development enabled
    many people to try their hands at graphic design, and some thought this led to
    the degeneration of a craft with proud traditions. The new possibilities opened
    up by the availability of personal computers and internet communication were not
    only seen as blessings; they were also used for spreading what was perceived as
    bad, potentially dangerous design. When machine-readable typefaces were designed
    for the purpose of facilitating back administration in the 1960s, it was one of
    the first steps on the path toward computer vision and facial recognition that
    computers are capable of today. The threat of the surveillance society loomed
    large in the public debate in the age of mainframe computers, and this debate
    is persistent and continually being fed by new technical developments.4


    # REFLECTIONS ON MY POSITION AS A RESEARCHER


    I am writing this book in my double capacity as art historian and systems analyst.
    Before I became a researcher, I took a bachelor''s degree in informatics and worked
    as a programmer and systems analyst in the 1980s and 1990s. This double experience
    has given me a unique vantage point from which to look upon the development of
    text and typography in the digital age—first from within the information technology
    (IT) industry and as a visual culture researcher. I learned programming in Cobol
    on a mainframe computer using punch cards and received program listings on fanfold
    paper delivered to me in the reception area of the computer center of the Swedish
    university I attended. I wrote my bachelor thesis with the help of a text editor
    meant for coding and later taught researchers in the humanities how to take advantage
    of the early word processors,'
