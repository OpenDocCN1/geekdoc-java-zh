    The most commonly used built-in monospaced fonts make the text less compact than
    the proportional fonts and thus easier to decode. The proportional fonts increase
    the blurring effect, making it difficult to discriminate between the sounds of
    letters and words. If a domain-specific corpus is used for the analysis, in this
