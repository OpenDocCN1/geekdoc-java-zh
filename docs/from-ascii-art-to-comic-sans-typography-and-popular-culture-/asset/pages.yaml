    Technostalgia is a concept I use to analyze the memory practices involving the
    dot matrix printer. This kind of nostalgia is a longing for past times when technology
    was simpler and easier to comprehend. The speed of technological development means
    that some equipment is becoming obsolete just as the users have gotten accustomed
    to it and learned how to handle it. Along with devices outdated skills and knowledge.
    Technostalgia could also be applied to ASCII art and to the machine-readable typefaces.
    An example of technostalgia is a T-shirt with ASCII art portrait of computer pioneer
    Alan Turing. Turing died in 1954 before ASCII art became a cultural phenomenon.
    The image is anachronistic, but ASCII art signs “an early computer era,” and to
    achieve this, it does not have to be historically accurate. This example also
    illustrates the tenacity of some the phenomena covered in this book. Being obsolete
    is no reason for old media and technology to step down, and some devices seem
    to have more lives than a cat. This is a media archaeological viewpoint:


    Although arguments concerning death-of-media may be useful as a tactic to oppose
    die: that only focuses on the newness of media, we believe that media decays;
    rots, reforms, remixes, and gets historicized, reinterpreted and collected...
    either stays in the soil as residue and in the air as concrete dead media, or
    is reappropriated through artistic, tinkering methodologies.¹⁷


    Longevity concerns not only physical devices that are maintained and refurbished
    but also design objects, such as the machine-readable typefaces, that continue
    to be used as semiotic resources in science fiction stories.


    By way of its age, Comic Sans cannot, as yet, signify obsolescence. Although created
    in 1994, the font is still a mass-produced artefact in contemporary time. It is
    available on nearly every computer and is everywhere to be seen. One could pose
    a hypothetical question: What will happen when the font is discontinued by Microsoft?
    Will Comic Sans become a nostalgic practice in the future? Will collectors will
    use eBay to buy and sell old cafe menus set in Comic Sans? Will reconstructed
    versions of the program code appear on GitHub and be downloaded by enthusiasts,
    as they do with dot matrix typefaces? So far, the most persistent thing about
    Comic Sans seems to be the animosity against it.'
