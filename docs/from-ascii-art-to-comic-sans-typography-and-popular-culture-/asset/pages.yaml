  md: 'What motivated programmers to make images out of letters and create art out
    the American Standard Code for Information Interchange (ASCII)? To what purposes
    were the images, and in what contexts were they displayed? Why did engineers distort
    the form of numbers and letters to make them readable, and how were these typefaces
    reused in popular culture? Why does the dot matrix printer technology, which nearly
    disintegrated letterforms, evoke fond memories among many of its users? Who did
    the hatred against Comic Sans emerge, and what metaphors and rhetorical devices
    are used in the discourse about the font? I look for the answers to these and
    other questions by analyzing social media discussions, magazine advertisements,
    printer manuals, scientific illustrations, as well as company logotypes, book
    covers, films, and artworks. The reader is taken along on the journey with a wealth
    of examples from the rich material that still exists on the internet and that
    is inherently ephemeral in nature, as well as from sources from the pre-internet
    era.


    During the time scope of the study, computing underwent several transformations.
    The four phenomena have been chosen to be in important phases in this development.
    Chapters 2 and 3, on ASCII art and machine-readable typefaces, play out in the
    1960s and 1970s, when huge computers were operated by professional staff and kept
    out of reach of regular users. Chapter 4, on dot matrix printers, is set in the
    beginning of the personal computing era that took off in the beginning of the
    1980s and put computers and printers into the homes of a great number of people
    who were not necessarily computer nerds. By the time we reach chapter 5, about
    the typeface Comic Sans, are in the mid-1990s, when the World Wide Web was introduced
    and internet communication started to gain a broader societal impact. The unwieldy
    calculation tool of the mainframe had become a handy gadget that fit into the
    pocket of the common citizen. Although the book has a chronological structure,
    my purpose is not to sustain the idea of historical progress. On the contrary,
    an important reason behind my choice of phenomena and the way they are contextualized
    is to counteract the idea of technological determinism. That is no linear progress
    towards technology is one of the tenets of media archaeology, a perspective that
    I return to below.


    From a typographic point of the view, the possibilities for the display and printing
    of text were very restricted and rigid in the beginning of the'
