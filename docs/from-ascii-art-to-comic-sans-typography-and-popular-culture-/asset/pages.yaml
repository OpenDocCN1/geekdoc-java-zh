    # SCIENTIFIC VISUALIZATIONS IN COMPUTER SCIENCE, PHYSICS, AND MEDICINE


    *The New Hacker''s Dictionary*, originally published in 1975, the section on ASCII
    art begins with "a serious example"—a diagram of electronic circuits. Further
    down, some "very silly examples" are given, showing animals and cartoon characters.^28
    This categorization demonstrates a clear awareness of the playfulness that dominates
    the art form, although it was also put to many serious uses during a time when
    there were no other ways to generate images.


    For a number of reasons, ASCII art is still the preferred form of visualization
    in some contexts. One of the advantages of ASCII art is that it is readable by
    any text editor and not dependent on a specific graphic software. In a blog post
    from 2019, "Explaining Code Using ASCII Art," computer scientist John Rege gathered
    a collection of examples showing how ASCII art is used in the source code of computer
    programs to illustrate the shape of data structures.^29 In this way, the documentation
    is integral to the source code itself, in contrast to external documentation,
    which can be lost. One of the respondents to our survey on ASCII art, an American
    engineer in his late seventies, gave this reason for using ASCII art: "I have
    been making ASCII-art schematic diagrams for decades, to avoid my work being trapped
    in proprietary formats.^30


