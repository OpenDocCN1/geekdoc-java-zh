    # MULTISENSORY MACHINES


    The purpose of printing is to produce visual output. However, just like other
    printers, the dot matrix printer is a multisensory machine: it emits visual, aural,
    haptic, and well as olfactory information. Media theorist W. J. T. Mitchell argues
    that there is no such thing as visual media and that all media are mixed media.
    Images nearly always engage other senses—notably, the auditory and haptic senses.
    He takes as examples the pastoise painting technique that renders thick layers
    of paint and the silent movies that were always accompanied by live music when
    screened in theaters.¹⁶ In spite of the singular quality of dot matrix character
    sets, it is not the visual appearance of the output that is the defining aspect
    of the printer. It is the sound it makes printing. There was generally no mention
    of the noise in the manuals, probably the manufacturers did not draw attention
    to what could be seen as a weakness of their product. The line printers had a
    distinct and very loud sound, but they were locked in computer rooms and not heard
    by many people. The dot matrix printer was a common appliance in both companies
    and homes, and its peculiar sound is brought up time and again in memory accounts,
    as is shown below. But the sound was not only a source of memory. It was also
    a source of information that could reveal what was'
