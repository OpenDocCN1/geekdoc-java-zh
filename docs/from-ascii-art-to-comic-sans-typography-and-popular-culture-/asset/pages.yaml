  md: '# HISTORIOGRAPHICAL REFLECTIONS AND SUGGESTIONS FOR FUTURE RESEARCH


    This is what history writing looks like when the weed is not weeded and winding
    paths are not smoothed out. The book has covered some gaps, but at the same time,
    it has revealed others. My hope is that it has confirmed the media archaeological
    point of view that history should not exclude dead ends and losers from its annals.
    Marginal phenomena have interesting stories to tell and make the overall picture
    more comprehensible—or sometimes less comprehensible, so that the need for further
    investigation is made obvious.


    What has been gained from putting these together in one book? By making them join
    forces, I have highlighted their positions and the move from the margin to the
    center of attention in a way that would not have been possible by treating them
    as stand-alone phenomena. They have not always worked in concert, but my conclusion
    is that they have rubbed against each other and given each other impulses in a
    productive manner. There is also the chronological aspect and the changes that
    have occurred over time that would have been lost if the book had been about only
    one of the four phenomena.


    This book contains many examples, but they represent just a fraction of what I
    found in my research and even smaller fraction of the material that still exists.
    But these materials are vanishing. As I state in the chapter on ASCII art, my
    research should have been conducted ten or twenty years earlier so that more interviews
    could have been made. What materials will a study on Comic Sans twenty years from
    now be able to access? Digital materiality does not rely on bronze or ceramics.
    It is a question not only of disappearing webpages or broken links of a technological
    infrastructure that might not be in use. In a couple of decades, examining the
    web discourse of Comic Sans might entail setting up a web server, performing the
    same laborious work done by the staff of the Computer History Museum to renovate
    a computer and its peripherals.


    Nevertheless, I have some suggestions for future research. There are many more
    ways that typography, computing, and popular culture could be joined and form
    the basis for research than the examples in the study'
  merge: -1
