  md: 'The dead zone, which covers around 300 square kilometers, is a remarkable,
    dismal, phenomenon. It is dominated by a single species of coarse, inedible grass
    called *Molinia*, which remains brown for most of the year. Scarcely any other
    plants grow. *Molinia* forms tough and stable clumps that cover the ground, preventing
    other species from germinating. You can spend all day exploring it without encountering
    a bird or even an insect.


    For at least 2,000 years, the land here was covered by blanket mire (a kind of
    wetland), supporting a fairly wide range of species. A switch in the twentieth
    century from cattle to sheep grazing, followed by a rise in sheep numbers, appears
    to have flipped the entire system into a stable state.[159] Though sheep have
    not been kept in some parts of the zone for thirty or forty years, there is nothing
    left for them to eat, the system has never flipped back. In other words, hysteresis
    has occurred.


    Maps of temperature and rainfall suggest that the natural vegetation type in much
    of the Wye catchment, and across the uplands of Britain, is likely to be temperate
    rainforest.[160] This is a fascinating ecosystem, whose natural architecture creates
    niches for a great diversity of life. But sheep and cattle have eradicated almost
    all of it. Tree seedlings are highly nutritious, sheep, even when they are in
    number, selectively browse them out.[+] Over the course of centuries, by preventing
    young trees from replacing the old ones as die, sheep have turned into pastures
    or heath moorland, both of which sustain a small range of species.[161]


    There are more trees per hectare in some parts of inner London than there are
    in the “wild” British hills where sheep graze.[162] Some of the barest regions
    are our national parks, most of which are glorified sheep ranches. Rainforest
    is confined to a few tiny patches, mainly in steep gorges for livestock.


    Just as chickens in the valleys demand a proligate use of nutrients, grain, and
    wood, sheep in the hills demand a profound use of land. My estimates suggest,
    conservatively, that some 4 million hectares of hill and mountain in the United
    Kingdom are used for sheep farming,[163] or 22 percent of the entire farmed area.[164]
    This is roughly equivalent to all the land used to'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'grow arable crops in this country.[165] It is more than twice the size of the
    whole built environment (all the towns, cities, factories, warehouses, gardens,
    parks, roads, and airports),[166] and twenty-three times the area we use for growing
    fruit and vegetables.[167] But, in terms of calories, lamb and mutton, across
    the uplands and the lowlands, supply just over 1 percent of our food.[168]


    Sheep farming, in other words, is an example of agricultural sprawl. Environmental
    campaigners rail against urban sprawl: the proligate use of land for housing and
    infrastructure. But because most of us live in cities, we fail to see the bigger
    picture. Agricultural sprawl—using large amounts of land to produce small amounts
    of food—has transformed much greater areas. In the UK, a highly urban nation,
    humans occupy 70 percent of the land,[169] while livestock, their pastures, and
    rough grazing lands occupy 51 percent.[170] If aliens landed here, they might
    conclude that the dominant life form was the sheep.


    The global figures are even starker. 1 percent of the world''s land is used for
    buildings and infrastructure.[171] Crops occupy 12 percent, while grazing, the
    most extensive kind of farming, uses 28 percent.[172] Only 15 percent of the world''s
    land, by contrast, is protected for nature.[173] The rest of the Earth''s land
    surface is either uninhabitable (glaciers, ice caps, deserts, rocks,aintops, salt
    flats) or mantled by unprotected forests. We get the meat and milk from animals
    fed entirely by grazing just 1 percent of the world''s protein.[174]


    The more land that farming occupies, the less is available for forests and wetlands,
    savannas and wild grasslands, and the greater is the loss of wildlife and the
    rate of extinction. All farming, however kind and careful and complex, involves
    a radical simplification of natural ecosystems. This simplification is required
