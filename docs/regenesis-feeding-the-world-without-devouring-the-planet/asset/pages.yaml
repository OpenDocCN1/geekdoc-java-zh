    The global damage caused by intensive livestock farming is exacerbated even by
    well-intentioned government policies. The destruction in South America, triggered
    in particular by chicken factories, is mirrored by deforestation in Estonia, Latvia,
    Poland, and Romania. In several European countries, chicken farmers receive a
    subsidy for “green heat.”[130] In the UK, the payment is called the Renewable
    Heat Incentive. Farmers who install renewable heating systems in their chicken
    units receive guaranteed and untaxed payments for twenty years. The handouts are
    so generous that their investments tend to pay off within five years:[131] After
    that, it’s free money. The most profitable system is burning wood pellets. A large
