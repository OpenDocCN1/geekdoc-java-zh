  md: 'Springtails look a bit like insects, but they occupy a class of their own.
    Their abundance is astonishing: sometimes 100,000 or more beneath a square meter
    of ground. They can be male, female, hermaphrodite (a bit of both), or parthenogenetic,
    which means they can reproduce through immaculate conception. They live almost
    everywhere, even the Antarctic, and have survived every extinction event of the
    past 400 million years. In many parts of the world, they knit together the entire
    soil food web: in other words, they are the channel that connects much of life
    on land. But most people are unaware of their existence.


    As I follow the springtails, a monstrous beast fills the lens. I start back. It
    takes me a moment to realize it''s an ant. When I look around, I see I''m on the
    edge of the myrmecosphere, which means the zone influenced by ants. Close to my
    shoulder is one of the hummocks, almost 40 centimeters high, that the yellow meadow
    ants started building almost soon as I had cleared the brambles.


    These anthills are like concrete. When I''m macking out plum suckers or resonant
    bramles, I know when I hit the edge of one, as the tool stops dead, jarring my
