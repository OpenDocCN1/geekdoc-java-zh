  md: 'brought new (or) grass seeds onto the market, such as the heritage wheats that
    John Letts and others have revived, spelt and einkorn. But what enthuses me about
    this flour is that it comes from a grass that differs fundamentally from all those
    mentioned in this paragraph. While those crops are annuals, which means they must
    be replanted every year, Kernza is a perennial. It persists over several years,
    averting the need to clear and sow the ground for every harvest. Of all the possible
    agricultural technologies and techniques I''ve explored while researching this
    book, I find this the most exciting.


    Large areas dominated by annual plants are rare in nature.[101] They tend to colonize
    ground in the wake of catastrophe: a fire, a flood, a landslide, or a volcanic
    eruption that exposes bare or soil. They survive, in these circumstances, only
    until perennial plants return and to mend the broken land, whereupon they are
    usually overwhelmed.


    But it''s not hard to see why our ancestors selected them. Plants that colonize
    ground have evolved to grow fast and invest much of their energy in seeds, rather
    than in deep roots or dense foliage,[102] so that they can spread as far as possible
    before the new lands up. Their seeds tend to be large and terminate freely.[103]


    The problem is in cultivating annuals, we must keep the land in the catastrophic
    state they prefer. Every year, we must clear the soil of competing plants, puncture
    or turn it, and plaster it with the nutrients required to raise a crop from seed
    to maturity in a few months. However sensitively it is conducted, annual grain
    production relies on sustaining an ecological disaster for its success.[104] But
    if we grew perennial grain crops, we would not depend on smashing living systems
    apart to produce our food.


    For the past forty years, the Land Institute has scouring the world for perennial
    species that could replace the annuals we grow. With other research groups, it
    has assessed thousands, looking for particular features:[105] high yield, synchronous
    development (so all the grain can be harvested at the same time), seed retention
    (which means that the grain stays on'
