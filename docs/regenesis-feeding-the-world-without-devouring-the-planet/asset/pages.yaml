  md: 'One reason for the overuse of fertilizers is the payoff between the cost of
    materials and the cost of labor. Ideally, fertilizers would be applied to crops
    in tiny increments, ensuring that the plants receive only as much as they need
    at each stage of growth, and absorb all the nutrients they''re offered, so that
    none run off the land. But farmers would then have to bring out their tractors
    dozens of times their crops are growing, using enormous amounts of fuel and ensuring
    their labor costs exceed their income from selling the crop. Most farmers are
    short of time, and are tempted to do exactly the wrong thing, spreading artificial
    nitrogen[1] in one big slug, whereupon most of it runs off into the rivers or
    the groundwater, or escapes into the air as the potent greenhouse gas nitrous
    oxide.


    Sometimes, disastrousously, they spread it in the autumn or winter, partly because
    this is when they have the most time, and partly because fertilizer suppliers
    tend to offer discounts then.[2] In this case the great majority of it is likely
    to be lost, as there might be no living crops to crop up the minerals, so the
    rain washes off the bare soil. Altogether, roughly two-thirds of the nitrogen
    farmers apply to their fields,[3] and by 50 percent[4] and 80 percent[5] of the
    phosphorus, are wasted.


    Instead of feeding crops, these minerals cause algal blooms in rivers, dead zones
    at sea, high costs for water users (as they must be extracted from drinking water),
    and global heating.[6] The more fertilizer farmers apply, the less effective every
    new increment is likely to be. In some cases, when artificial nitrogen feeds the
    weeds in a field, helping them to smother the crop, the dose, the lower the yield.[7].


    Herbicides and pesticides are also wasted on an astonishing scale. One paper reports
