    This transition could be our best hope of stopping the sixth extinction.


    A study in *Nature* proposes that if destructive activity caused on just 15 percent
    of land in some parts of the world, 60 percent of the extinctions that would otherwise
    happen could be averted and 30 percent of all the carbon released since the Industrial
    Revolution could be extracted from the atmosphere.[100] The promise of farmfree
    food is much greater than this: we could reclaim most of the land now used for
    farming, protecting the remaining wild places.


    As well as land, Pasi''s technology makes parsimonious use of other resources.
    He''s designing his process to enable the water and carbon dioxide that the bacteria
    need to be drawn directly from the atmosphere outside the brewery; his ambition
    is to conjure food from air. In principle, the nitrogen bacteria they require
    could also be extracted from the sky,[121] as some hydrogen-oxygenating species
