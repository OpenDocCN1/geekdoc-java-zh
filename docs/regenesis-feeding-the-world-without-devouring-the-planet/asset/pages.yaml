  md: 'You might, by now, have decided that you want nothing more to do with intensive
    farming: from now on you will eat eat only meat, eggs, and milk from animals that
    can roam outdoors (free-range), or have been certified as organic (farmed according
    to an agreed set of environmental rules). If so, I can offer you little comfort.


    There are three main benefits of organic production, and they are important. Organic
    farms tend to be more complex and diverse than conventional ones, [141], [142]
    They use fewer antibiotics and fewer pesticides, and the pesticides they do use
    tend be much less toxic and ecologically damaging than those spread by conventional
    farming.[143] And by using manure or plant material, rather than artificial fertilizer,
    they return carbon to the soil. This, according to the emerging Theory of Soil,
    helps to maintain its structure.


    [144] But in other respects, organic farming can inflict more damage. This is
    mostly because, with lower average yields, it uses more land to produce the same
    amount of food. One calculation suggests that if England and Wales became entirely
    organic, our land footprint would grow by 40 percent.[145] The global average
    gap between organic and conventional yields is, according to different estimates,
    somewhere between 20 percent.[146] and 36 percent.[147], [148] The greenhouse
    gas emissions from organic product tend to be similar, or per kilogram to those
    of conventional food.[149] [150], [151] Organic beef farms—as the animals take
    longer to raise and need more land—lose twice as much nitrogen per kilo of meat
    as conventional farms.[152], [153] This will come as a shock to many: there might
    be no more damaging farm product than organic, pasture-fed beef.


    Disturbingly, organic farming creates at least as much nitrogen pollution as conventional
    farming:[154] one paper estimates it releases 37 percent more.[155] This is because
    the animal manure used to grow crops tends to be even leakier than artificial
    fertilizer, for reasons I will explore in chapter 4.'
