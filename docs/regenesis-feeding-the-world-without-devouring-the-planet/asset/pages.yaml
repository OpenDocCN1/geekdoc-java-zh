  md: 'The COVID-19 pandemic blew away two political ideas that had defined the previous
    forty years: that governments should not govern, and that people are not prepared
    to put the public interest ahead of individual interest. The notion that governments
    should be passive—the can''t-do culture—assiduously promoted by the self-hating
    state, collapsed. So did the idea that citizens will not respond to the signals
    they send. When governments want to govern, they can, in some countries (Taiwan,
    New Zealand, Kenya, South Korea, and Vietnam, for example) to great effect. When
    money is needed, it is found. When people are mobilized, they respond.


    The changes we were asked to make to contain the virus were far more extreme than
    those required to stop environmental collapse. We were asked to stop working,
    shopping, playing sports, visiting bars and restaurants, throwing parties, going
    to games and concerts, taking holidays: activities we considered essential to
    our lives and identity. Children were kept from school, travel ground to a halt,
    we were asked to cover our faces in public, sterilize our hands, keep our distance,
    to live, for long periods, as if we were under house arrest.


    No reasoned environmental demand comes anywhere where the severe measures the
    pandemic required. And yet, when we were asked to make these drastic changes,
    most of us did so willingly. We recognized our public duty and acted on it. Changing
    the sources of some of our foods, slightly altering diets, reducing the land area
    occupied by farming, ending its most damaging practices, expanding protected places:
    these changes are tiny by comparison. It''s not human capacity we lack; it''s
    the political will to invoke it.


    If governments communicated our environmental crisis—which presents a threat to
    humanity far greater even than COVID-19—with the urgency it'
  merge: -1
  pgno: 254
- img_proc: true
  md: 'requires, changed the rules, and explained our public duty to respond, we would
    do so. Political systems were made by people. They can be changed by people.


    It is time to take back control of the global food system, to overthrow the corporate
    lobbyists and special-interest groups that dominate it. It is time to create a
    new, rich, productive, and, ideally, organic agriculture, no longer dependent
    on livestock, growing food that is cheap, healthy, and available to everyone.
    It is time to develop a new and revolutionary cuisine, based on farmfree food.
    It is time to release large parts of the planet from our devastating impacts,
    reverse its dysbiosis, restore its living systems, enhance our own prosperity
    and prospects of survival.


    We can now contemplate the end of most farming, the most destructive force ever
    to have been unleashed by humans. We can envisage the beginning of a new era,
    in which we no longer need to sacrifice the living world on the altar of our appetites.
    We can resolve the greatest dilemma with which we have ever been confronted, and
    feed the world without devouring the planet.'
