  md: 'standard equipment. His process was developed in the 1960s, by scientists working
    with NASA.[2], [3] But he''s fermenting a revolution.


    Pasi''s task is to multiply, as cheaply and efficiently as possible, one of those
    creatures I discussed in the first chapter: a soil bacteria. Among the survival
    strategies of microbes in the soil is the ability to harvest energy in interesting
    ways. The species Pasi uses[5] draws its energy neither from photosynthesis nor
    the products created by other organisms, but from hydrogen[4] It is a hydrogen-oxygenating
    bacterium.


    The view through a pothole in the fermentation tank, where Pasi''s brew churned
    as if in a washing machine, was unpromising: a thin yellow sludge against the
    glass. But when he extracted some of this primordial soup and piped it onto a
    heated drum, it began to seem more appetizing: it turned into a golden flour that
    smelled scrambled egg. Pasi explained that these species produces carotenoids:
    the molecules that carries their color. More importantly, roughly 60 percent of
    the flour is protein,[5] and all of it is edible.


    Out sheer vanity, I asked his team to make me a pancake: I wanted to be the first
    person outside the laboratory to eat one made from these bacteria. Instead of
    mixing the dried microbes with eggs to raise their protein content, the lab staff
    had to mix them with wheat flour to reduce it. Otherwise they would have made
    an omelet. They added some oat milk (though water would have done as well) to
    make a light batter.


    It''s a long time since I''ve eaten a conventional pancake, with eggs. I tried
    gram flour substitutes, dosas composed of rice and lentil flour, and Korean versions
    made of wheat and corn flour, but none were satisfying as the pancakes I stocked
    when I switched to a plant-based diet. What was missing was the protein—it''s
    what makes a pancake succulent. The richest of these alternatives—gram or chick
    flour—has a protein content of around 20 percent, lower than the traditional European
    butter of wheat flour, egg, and milk. Had I not watched it, I could scarcely have
    believed that eggs had not been added to Pasi''s pancake. I would have found it
    still harder to accept that the main'
  merge: -1
