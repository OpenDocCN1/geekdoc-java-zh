  md: 'While crop plants take months to grow, the bacteria in these tanks double every
    three hours. If you maintain good growth conditions, you can harvest half of them
    eight times a day, every day of the year.[99] This technology could release almost
    all the land currently needed to produce protein, whether it comes in the form
    of plants or animals. Much of our food supply could be farmfree.


    As grazing occupies two-thirds of agricultural land, and grains grown to feed
