- img_proc: true
  md: 'microbial proteins, plant-based, and cultured foods. They should work instead
    to prevent these crucial new technologies from being monopolized by a few corporations
    or billionaires.


    Debates about the future of food tend to divide people on technological lines.
    Some believe that the answer to feeding the world lies in extending the Green
    Revolution, which, from the 1950s onward, has greatly increased the yields of
    major cereal crops, through a combination of plant breeding and farm chemicals.
    Others believe that the answer lies in rejecting this highly technological approach,
    and turning instead to “natural” processes: integrating intensive livestock and
    crop plants, replacing intensive animal farming with pastured livestock, reviving
    a rotational system that incorporates long fallow periods.


    But technology, I believe, is the wrong battleground. The systems we favor are
    those that deliver high yields with low environmental impacts. The systems we
    should reject are those that deliver high yields but with high environmental impacts,
    or low yields. Low yields necessarily mean high impacts, because of the area of
    land they need to produce a given volume of food. As I argued in chapter 3, land
    should be seen as perhaps the most important of all environmental issues.


    The movements that—often for good—have challenged the Green Revolution, its heavy
    use of fertilizers, pesticides, and irrigation water, and their tendency to favor
    multinational corporations above the needs of small farmers and local markets,
    themselves often suffered from a disastrous flaw. Because they have tended to
    be yield-blind, they accidentally promote agricultural sprawl: the use of large
    areas of land to produce small amounts of food. Sprawl, above almost all other
    forces, threatens the survival of our life-support systems.


    The crucial question we should ask about technology is not “How sophisticated
    is it?, but “Who owns it?” If a productive technology has a'
  merge: -1
  pgno: 252
- img_proc: true
  md: 'low environmental impact and its ownership is either distributed or public,
    we should be ready to embrace it. (“Public,” incidentally, needn’t mean state-owned:
    it can also mean community-owned.) If its ownership is both concentrated and private,
    we should challenge this pattern, as concentration contributes to the advance
    of the Global Standard Diet and the Global Standard Farm, both of which we should
    resist. Whether or not a system is technologically sophisticated is, in its own
    right, irrelevant.


    We need almost to sweep away the debates that have raged until now, and start
    over. They are ill-matched to the environmental, social, and agricultural challenges
    we face. We need to build a new food and environment movement, ready to embrace
    high-yield, low-impact production. The practices it favors might range all the
    way from using ramial woodchip to multiplying bacteria by precision fermentation.


    The new movement should begin by acknowledging an uncomfortable but well-established
    reality, a reality that has all too been swept under the carpet: farming, whether
    intensive or extensive, is the world’s major cause of ecological destruction.
    This movement should ask itself fundamental questions when considering any new
    system: “Does this deliver more food with less farming?” “Who owns and controls
    it?” “Is the food it produces healthy, cheap, and accessible?”


    A new movement, informed by these questions, needs a manifesto. It might look
    something like this:


    To allow human beings and the rest of life on Earth to flourish, we should:


    +   - Become fooderate

    - Change the stories we tell ourselves

    - Limit the area we use to feed the world

    - Minimize our use of water and farm chemicals

    - Launch an Earth Rover Program to finely map the world’s soils

    - Enhance fertility with the smallest possible organic interventions

    - Research and develop a high-yield agroecology

    - Stop farming animals

    - Replace the protein and fat from animals with precision fermentation

    - Break global corporations’ grip on the food chain

    - Diversify the global food system

    - Use our understanding of complex systems to trigger cascading change'
