  md: 'plant until it''s harvested),[*] and ease of growing and reaping (especially
    by small farmers).


    Once they''ve found likely species, the researchers start selective breeding to
    raise their heads and improve their food and farming qualities. At first, they
    simply selected, crossed, and multiplied the individual plants with the highest
    yields. Now they use new technologies[*] to speed up the process,[106], [107]
    Breeding of the kind that once took centuries can be compressed into a couple
    of decades.


    Sometimes a promising plant goes nowhere. Sometimes an unpromising plant takes
    off. For example, the Land Institute scarcely gave a thought to a perennial sunflower
    called Silphium, because in the wild it produces fifteen or twenty seeds on every
    flowerhead. By casually selecting the plants that had a few seeds than average,
    within eight years its researchers found themselves harvesting heads with 150
    seeds,[108].


    Though Kernza—intermediate wheatgrass—is still being developed, it''s one of the
    first crops that the Institute has tentatively brought to market.[109] So far,
    the plants have been bred to carry as many seeds as wheat does, but each one is
    only a quarter of the weight. The breeders hope to make wheat yields within thirty
    years.


    Because the land remains covered for years at a time, by bound their massive roots
    and showered with their abundant litter, perennial grains like Kernza are likely
    to reduce erosion[110] and raise the amount of carbon in the soil,[111] One estimate
    suggests that, if the switch were worldwide, agricultural soils would regain between
    a quarter and two-thirds of the carbon they''ve lost since they were first plowed,[112]
    Ecosystems dominated by perennials, such as forests and natural grasslands, support
    richer and more abundant soil than fields growing annual crops,[113], [114], [115].


    As their roots draw nutrients from deep in the ground, perennial crops become
    their own green manures, through their herbal leaves. So the land need not be
    taken out of production. The longer the plants stay in the ground, the stronger
    their relationships with bacteria that fix nitrogen, and microbes and fungi that
    seek out other nutrients. This means that they should, in principle, need less
    fertilizer,[116] One estimate suggests that'
  merge: -1
