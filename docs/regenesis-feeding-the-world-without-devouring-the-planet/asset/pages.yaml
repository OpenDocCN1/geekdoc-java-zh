- img_proc: true
  md: 'perennial systems hold five times as much of the water that falls on the ground
    as annual crop.[117]


    When farmers switch from annals to perennials, weeds are likely to be a major
    problem during the first couple of years,[118] as the land can''t be plowed, and
    generic herbicides would kill the crop. But once a perennial crop is established,
    its shade and litter tend to stifle weeds. Experiments with perennial energy crops
    suggest that no further weed control is needed.[119] Kernza, according to some
    of the farmers who have experimented with it, is “highly weed-superseded.”[120]
    Given that it forms great fibrous clumps covering the soil surface, it''s not
    hard to see why.


    Because weeding is likely to be needed only at the beginning, it might make economic
    sense for farmers to do it mechanically: hoeing or mowing between the rows with
    machinery (or, on small farms, with hand tools) or, when the technology becomes
    widely available, briefly hiring a robot. The less the soil is disturbed, the
    fewer weeds have to take root: all being equal, they should be easier to control
    in a perennial system.[121] Of course, these deep-rooted perennials could themselves
    become weeds, invading fields or persisting when farmers want to change the crop.[122]
    This is one of many issues that needs to be investigated, for every new perennial
    plant that''s bred.


    Some argue that plant diseases could become a bigger problem in perennial grain
    farming, as they might proliferate from one year to another,[123] others that
    they could become a smaller problem, as stronger relationships with soil bacteria
    allow plants to ramp up their immune responses,[124] Encouragingly, the wild plants
    from which Kernza and other grain crops are being bred highly resistant to the
    viruses that attack annual crops.[125]


    The deep roots and tough structures of perennial plants are likely to be better
