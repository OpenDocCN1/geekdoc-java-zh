    they flow through the system, like the barium meal a doctor uses to make a patient’s
    digestive tract visible to X-rays. The elements I''ve found most useful in making
    the global agricultural system and its relationship to the living world visible
    are nutrients. By nutrients, I mean the minerals, as as nitrates and phosphates,
    some of which occur naturally in the soil, some of which are applied in manufactured
    formulas by people, that are essential to the survival of all life forms. As they
    pass through plants, animals, soil, and water, their flow illuminates the way
    the system works, and helps us to see how it is expanding across the living planet.
    For this reason, and with my apologies, I will begin this chapter by immersing
    you in the engrossing issue of excrement.


    . . .


