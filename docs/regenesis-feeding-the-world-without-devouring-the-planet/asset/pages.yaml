    over a garden wall, of a rampart of chicken excess constructed by a farmer on
    three sides of the house of someone who had filed a planning objection to the
    new barns he wanted to build, of scratched cars and smashed windscreens, of the
    mafia-like power of dominant farming families.


    I have met people who moved to the countryside in pursuit of the bucolic idyllic,
