    larger than our orchard. Just as importantly, far from being the undifferentiated
    mass I once perceived, soil is a cosmopolitan city of zones and structures, in
    which distinct cultures inhabit adjacent parishes. One of these zones is the myrmecosphere,
    the ant burrow, itself divided into subordinate precincts. But even more ecologically
    important are the narrow wards surrounding the roots of plants, known as the rhizosphere.
    It is upon this zone that humanity depends. As pull the clod apart, the roots
