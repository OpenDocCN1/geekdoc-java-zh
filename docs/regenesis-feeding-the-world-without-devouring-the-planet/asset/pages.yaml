    These incentives have helped start a gold rush in Eastern Europe. In Estonia and
    Latvia, nature reserves are being clear-cut for woodchip.[134] In Poland logging
    companies keep to push their way into the ancient Białowieża Forest.[136] Since
    2015, the area of European forest being felled has risen by a remarkable 49 percent.[137]


    Burning wood to produce heat or electricity releases more carbon dioxide than
    burning coal,[138],[139],[140] Eventually, new trees might reabsorb this carbon,
    but it takes decades. A ton of carbon saved is worth much more than a ton absorbed
    in thirty or forty years. These payments might help to explain the rush of applications
    for chicken units in the Wye Valley in 2019 and 2020. The incentive program closed
    in March 2021: if your barns were up and running by then, you qualified for twenty
    years of public money.'
