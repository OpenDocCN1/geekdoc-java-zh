    But not every insurgent has stirring speeches or wears a bicorn hat. Pasi is building
    what might be the most important environmental technology ever developed. It requires
    no major breakthrough, by new instruments or materials, merely refinements and
    efficiencies. While his laboratory is a maze of pipes and wires, valves and gauges,
