    Colombia, Mexico, and the Philippines, the consequences of objecting are not just
    stressful but extremely dangerous. Environmental activists, especially those who
    confront agricultural interests, are murdered in large numbers every year.[91]


    In rich nations, intimidation, as I''m often reminded by those on the front line,
