    Tim’s wheat is used to make bread through the Chorleywood Baking Process, a weird
    British invention that has spread around the world, whose story is both a classic
    case of unintended consequences and a reminder that local doesn’t always equal
    good.


    Until the middle of the twentieth century, baking was a local business. In some
    cities, there was a bakery on almost every corner. Here, people not only bought
    their bread, but also—as the baker whose family had worked at the end of my street
    for 170 years before he had to close the business explained to me—used the ovens
    to cook their Sunday roasts.


    In 1932, a Canadian entrepreneur Garfield Weston importing wheat into the UK from
    his home country. As Canadian wheat, thanks to a more favorable climate, has a
    higher protein content than British wheat, he was able to undercut his local competitors.
    More protein means the bread rises better, which means more loaf from the same
    amount of flour. The company he founded, Allied Bakeries, threatened to put small
    bakers out of business.


    In the 1950s, a group of small British bakers appealed to the British Baking Industries
    Research Association, based in the town of Chorleywood. It was a classic institution
    of the era: a state body that sought to make national industries more competitive.
    It could devise a baking process that would use British wheat cheaply enough to
