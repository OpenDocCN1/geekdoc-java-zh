  md: '# 8

    # Pastures New


    What stops us from seeing that something needs to change? Why do we ignore or
    tolerate or even justify levels of environmental destruction and social exclusion—if
    they were inflicted by any other industry—we would furiously oppose? Why are the
    those who call for a shift in the way our food is produced so fiercely denounced?
    Well, these are, by definition, visceral issues, and food and identity are closely
    intertwined. Over many years as an environmental campaigner, I''ve slowly reached
    an outrageous conclusion. One of the greatest threats to life on Earth is poetry.


    In the seventh century BC, the Greek poet Hesiod wrote of a Golden Age long gone,
    in which humans “lived like gods.” They “dwelled in ease and peace upon their
    lands,” healthy and strong, “free from toil” and “merry with feasting,” as the
    Earth “bore them fruit abundantly.” Similar ancestral stories are told in other
    parts of the world.


    The Golden Age myth is generally treated as a ridiculous fantasy. But I wonder.
    We now have data showing that our hunter-gatherer ancestors are taller, stronger,
    and healthier than the farmers who succeeded them.[1], [2], [3] We know from contemporary
    studies that hunter-gatherers work shorter hours than peasant farmers,[4] and
    their work so little relation to the quot drudgery suffered by other people that
    it scarcely qualifies as toil.[5] They tend to devote more of their time to making
    merry with feasting, or to be precise, the talking, singing, and dancing that
    help to strengthen their social networks.[6]'
