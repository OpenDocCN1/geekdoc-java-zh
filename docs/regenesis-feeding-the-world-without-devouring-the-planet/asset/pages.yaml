  md: 'ingredient was with the desiccated bodies of bacteria. It tasted rich and mellow
    and filling: just like the pancakes I used to eat.


    That’s one small pancake for man, one giant flip for humankind. It represents,
    I believe, the beginning of the end of most agriculture. In that thin crpe is
    wrapped our best hope of restoring the living planet.


    The reason is that this method of food production shrinks, to an astonishing degree,
    the most important environmental impact of all: our use of land. It’s here that
    the potential lies for a radical transformation of our relationship with the living
    world and the restoration of planetary health.


    Tomas Linder, an associate professor of agricultural sciences, compared the land
    area needed to grow protein by a process similar to Pasi Vainikka’s[6] with the
    most efficient agricultural method: U.S. soybean farming. In a typical year, soybeans
    occupy 36.5 million hectares of the U.S., an area greater than Italy. The land
    required to produce the same amount of protein by growing bacteria is 21,000 hectares:
    the size of the city of Cleveland, Ohio. In other words, you’d need 1,700 times
    less land to grow it.


    That’s not quite the end of the story. We would still require processing facilities,
    to kill and dry the bacteria, separate their components, and recycle the wastewater
    from the fermentation vats. But the same applies to processing soybeans (and,
    to a much greater extent, the carcasses of animals). More importantly, Pasi’s
    brewing needs electricity, mostly to split water into hydrogen and oxygen through
    electrolysis. As the name of his company, Solar Foods, suggests, he has chosen
    to generate it from sunlight.[7] This is a land-hungry form of power generation.
    Even so, according to a paper in Engineering Biology, producing bacterial protein
    with solar panels between thirty and sixty times less land than soy protein.[8]
    If wind power were used instead, the paper maintains, the wind would rise to between
    150 and 400 times. If the wind turbines were built offshore, where much larger
    machines tended to be used, even less (or seabed) would be needed. If the hydrogen
    were produced by fourth-generation nuclear reactors, the space required would
    be even smaller.'
