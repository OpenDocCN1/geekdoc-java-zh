    chicory flowers, crimson clover, yellow melilot and trefoil, mauve Phacelia and
    lucerne, pink sainfoin. This was the green manure, the crop that covered the soil
    for the first two years of the rotation. Tolly explained that the long roots of
    these flowers, especially the chicory—which might reach one and a half meters
    into the ground—draw nutrients from the subsoil.[99] The members of the pea family—clover,
    melilot, trefoil, lucerne, and sainfoin—harbor bacteria in nodules on their roots
    that convert nitrogen in the air into a reactive form the plants can use. Every
    so often, Tolly runs a mower over the flowers in this strip, chopping the plants
    into a coarse mat that leaves on the ground. The earthworms pull it down and incorporate
