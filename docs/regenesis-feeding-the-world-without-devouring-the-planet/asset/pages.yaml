    Effective rewilding, in its early stages, requires plenty of watch,[73], [74]
    Fences need to be removed, drains un-dug, rivers un-straightened and wetlands
    restored, missing species reestablished, trees seeded or planted where they cannot
    regenerate spontaneously. Excessive nutrients in the soil, introduced with fertilizer
    and manure, might need to be reduced, for example by cutting and removing hay
    for several years. Paying farmers to restore the living world is surely a better
    use of public money than paying them to harm it.


    Subsistence farmers working outside the cash economy could be less affected by
    the new food revolution than those who depend on selling their produce. So, foreign
    aid for agriculture should be redeployed, away from its most exclusive focus on
    promoting the Global Standard Farm, and if new research leads to the breakthroughs
    I hope to see, toward helping small farmers practice high-yielding agroecology.


    Governments should finance the rapid development of perennial grain crops, to
    reduce damage to the soil and the need for water and fertilizer: it is ridiculous
    that this crucial technology has been left to a small nonprofit with limited funds.
    In the meantime, they should help farmers like Tim Ashton to find ways of protecting
    the soil, while minimizing or eliminating their use of herbicides. They should
    also help farmers to apply the burgeoning science of biological control: using
    predators to manage pests. They should help ensure that any land we continue to
    farm is hospitable to wildlife, creating stepping stones and corridors between
    protected places. Crops should be grown for food, not to produce animal feed,
    fuel, or bioplastic. In other respects, governments should get out of the way,
    and stop imposing pointless restrictions on the development of'
  merge: -1
