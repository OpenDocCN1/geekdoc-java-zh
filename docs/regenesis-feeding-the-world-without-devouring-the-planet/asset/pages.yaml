    One estimates that 58 percent of the antibiotics given to farm animals are excreted,[44]
    Some of the drugs break down, others persist for hundreds or even thousands of
    days.[45] When manure is stored, the bacteria contains face selective pressures
    to resist the excreted antibiotics.[46] When it is spread, both the drugs and
    the microbes selected to survive them meet bacteria in the soil.


    As I explained in chapter 1, soil bacteria engage in brutal warfare, using antibiotics
    to repel or destroy their competitors. They have developed what scientists call
    an "intrinsic resistance."[47] This means that they are preadapted to defend themselves
    against dangerous new chemicals,[48] When they come into contact with manure,
    one of two things tends to happen. The first is that bacteria with resistance
