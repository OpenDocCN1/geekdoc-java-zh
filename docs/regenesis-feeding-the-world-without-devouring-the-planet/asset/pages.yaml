  md: 'So here is vision of what a new farming system could look like.


    Cereals such as Kernza, perennial wheat, or rice could be planted in strips the
    width of two or three combine harvesters (or otherwise matched to the reaping
    technologies used by small farmers). Between every two strips of cereal grain
    is a strip of perennial beans. Beans nitrogen-fixing bacteria, which fertilize
    the plant and add nitrates to the soil. Without annual plowing, nitrogen is likely
    to accumulate in the soil, helping to feed the neighboring cereals.[133] These
    crops, with their deeper roots and longer establishment, should find most of the
    other minerals they require. In some circumstances, it might be possible to eliminate
    the need for fertilizer.


    Around each block of cereals and beans (or, for that matter, oilseeds and beans)
    is a band of native wildflowers, about a meter wide, the kind that Tolly uses.
    With both pollinators[134] and the predatory insects that eat pests[135] flourish
    among perennial flowers in annual flowerbeds. Farmers are often hostile to the
    idea of maintaining perennial flowerbeds in the midst of their crops,[136] as
    the tractor must work around them, and according to one study, it takes about
    four years for their full benefits to be felt.[137] But in perennial fields, in
    which the tractor does less work and the crops remain in the, they might be more
    popular. The flowering banks—and possibly the crops themselves—become corridors
    and stepping stones for wild animals passing through the fields.


    In annual systems, only the crops closest to the flowering banks are visited by
    the beneficial insects they harbor.[138], [139] In perennial systems, helpful
    insects and spiders should be able to travel further, as the denser plants provide
    them with refuge.[140], [141] If Tolly’s results are anything to go by, natural
    predators could eliminate the need for pesticides. One study shows that, when
    flowering crops (such as beans or most kinds of oilseed) are grown, the net impact
    of pesticides on farmers’ yields and profits are negative, as the harm inflicted
    by killing pollinators outweighs the benefits of killing pests.[142] Big Farmer
    has been conned by Big Pharma.'
  merge: -1
  pgno: 206
- img_proc: true
  md: 'Perennial crops are not a panacea—nothing is. They cannot stay in the soil
    for ever: as they age, their yields are likely to decline, so after a few years
    they must be grubbed up and replaced with another species,[143] But a rotation
    of perennials breaks the ground less often than a rotation of annuals. In common
    with every system, a switch to perennial grains could, without good policy, trigger
    perverse and disastrous consequences: for example, because they can grow on marginal
    land,[144],[145] they could be used to produce biofuels in places unsuitable for
    other crops. Then they could become a powerful instrument of habitat destruction.
    There’s a limit to how much we can eat. There’s no limit to how much we can burn.


    However successful the breeding programs might be, perennial crops will not be
    grown everywhere: farmers are often reluctant to abandon familiar strategies.
    But this isn’t necessarily a bad thing: we need a variety of systems and technologies.
    They will introduce diversity and resilience to food production, challenging the
    dominance of the Global Standard Farm. By conserving the soil and reducing the
