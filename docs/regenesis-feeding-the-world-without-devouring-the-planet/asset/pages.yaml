  md: 'None of this should be seen as a general criticism of agroecology. It can be
    transformative. In Karnataka, southern India, a strategy called Zero Budget Natural
    Farming has released small farmers from the grip of moneylenders and banks: by
    replacing the chemicals and seed they bought with natural processes and they save
    themselves, they have almost eliminated their expenses.[87] In Mimba district
    in Malawi, research teams led by farmers have reduced the need for fertilizer,
    while raising their yields, protecting their soil, enhancing women''s power, and
    improving children''s nutrition,[88]


    To make it work, farmers need clear and secure lands, plant trees, and farm as
    if tomorrow will come.[89] While such rights are a necessary condition for good
    farming, they are no guarantee, as examples in this book attest. In some countries,
    I believe, farmers have too many rights and freedoms: the right to build giant
    barns without environmental permits or use vast tracts of land to produce tiny
    amounts of food; the freedom to trash the soil, pollute the rivers, and intimidate
    neighbors who object. But in other countries, they have too few, and can easily
    be evicted by land-grabbers. While the rights of big companies are guaranteed
    by international treaties, local people often have no protection, and governments
    and businesses sometimes collide to throw them their land.[90]


    One of the principles of agroecology is equality. This is hard to achieve when
    land costs £10,000 an acre (£25,000 per hectare). It''s worth noting that all
    the farmers I have followed so far rely on what could be seen as an historical
    subsidy. Jolly has been able to develop his system as a result of the generosity
    of Sir Julian Rose, who charges him a rent well below the market rate. Tim survives
    because he and his father, like Julian, inherited their estate, so they can farm
