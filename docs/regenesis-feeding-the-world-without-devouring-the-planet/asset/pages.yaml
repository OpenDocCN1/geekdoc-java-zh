    Over three-quarters of the world''s soy is fed to farm animals. Most of the rest
    is used by industry or to make cheap vegetable oil.[931] Only 7 percent is turned
    into substitutes for meat and milk, tofu, tempeh, soy mince, and soy milk. The
    amount grown for animal feed has risen, since 1990, three and half times faster
    than the amount grown for vegan alternatives.[944]


    In South America, 200 times more land is used to grow soy today than in 1961.[951]
    The 57 million hectares the crop now covers is bigger than Spain. Most indigenous
    peoples have been almost entirely possessed. Stunning ecosystems, especially the
    cerrado (savanna) of central Brazil, and the Gran Chaco forests in Paraguay and
    Argentina, the homes of wolves, giant anteaters, jaguars, tapirs, and armadillos,
    have been swept the Earth on an unimaginable scale.[961] The farms look more like
    sea than land: gigantic fields, unmarked by any feature, stretch to the horizon.
    The remnants of life resemble islands in the ocean of destruction. Still they
    are being cleared and burned.[971] One paper suggests that the cerrado is approaching
    a critical threshold.[981] When trees are felled, their long roots no longer draw
    water from the aquifers and release it into the air. As water vapor reduces while
    temperatures rise, dew, which is essential to the survival of many wild plants
    and animals, stops forming. This triggers a cycle of collapse that might lead
    to the tipping and hysteresis of the entire ecosystem by the middle of the century,
    to be replaced by desert.'
