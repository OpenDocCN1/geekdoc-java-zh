    I was staring into a gilded eye. At length, I realized that it belonged to a hare,
    grazing on the grassy bank where I had been sleeping, a meter from my face. It
    sat up then slowly loped up the bank, across the little suburban road, along the
    verge on the other side then into a garden. It felt, in this Helsinki suburb,
    like an omen. But of what I cannot say.


    Exhausted by the interview I''d just conducted, I stepped outside for a power
    nap while the rest of the crew stayed in the laboratory, filming cutaways.[1]
    Pasi Vainikka, the man I''d been interrogating, is a brilliant scientist and a
