  md: '# 9


    # The Ice Saints


    It was the best fruit set I had ever seen. Across the entire pollination season—the
    second half of April and the beginning of May—the days were balmy and the nights
    were warm. For the first time in my experience, there wasn''t even a ground frost.
    Bees and hoverflies swarmed the blossom, and almost every flower, as the petals
    fell to the ground, began swelling into fruit. I warned the other families in
    our orchard group that we would need to set aside a couple of days in June for
    fruit-thinning, otherwise we would find ourselves with thousands of apples the
    size of walnuts. It was a good problem to have. I blocked out a weekend in October
    for the mother of all cider pressings.


    When I saw a frost forecast for the night of May 12, it didn''t worry me. The
    moment of vulnerability—when the blossom had opened—had passed. I visited the
    orchard the next day, to discover whether it had scorched the last blooms.


    It took me a while to register what I was seeing. Every fruit on every tree had
    begun to shrivel, and the stems to yellow and weaken. I wandered round and round
    the orchard, checking that my eyes weren''t deceiving me. When I could fool myself
    no longer, I almost cried. The entire crop had been destroyed. Later, I discovered
    that the frost had been much harder than the forecast had advised: it was a freak
    freeze, deep enough to break the usual rule that once the blossom is over, the
    fruit is safe.


    I trudged toward the gate, shaking my head in disbelief. On the path I met Stewart,
    our allotment neighbor, who had given us his row of trees. He'
  merge: -1
  pgno: 256
- img_proc: true
  md: 'and another veteran digger, Mike, were contemplating their ruined potatoes,
    engaged in the perennial conference of hoary gardeners the world over, on the
    vicissitudes of the weather.


    “I can’t believe it,” I told them, “we’ve lost the whole lot.”


    “Well,” said Stewart, “we’ve only got ourselves to blame. We forgot to pray to
    the Ice Saints.”


    “The what?”


    “Look them up.”


    I did, and discovered that May 11, 12, and 13 are respectively, the days of Saints
    Mamertus, Pancras, and Servatius. These three days, parts of Europe, are lamented
    as the “blackthorn winter,” because, allegedly, when the blackthorn is in flower,
    winter returns to strike a final blow. According to an unusual meteo-agrological
    paper in the journal Weather, this period is associated with Britain with northernly
    winds caused by high pressure over Greenland and weak cyclonic activity in the
    Atlantic.[11] It told me that “he who shears before St. Servatius day loses wool
    more than his sheep,” presumably because they are left to shift in the late frosts.
    In several countries, especially in Eastern Europe, the three saints (whose identity
    shifts from one nation to another) are widely petitioned to stay the hand of the
    water.


    Frustratingly I have not been able to find, anywhere in the scientific literature,
    a controlled trial of the prayers or libations most efficacious enhancing the
    strength of Atlantic cyclones. It is not clear why, when the switch from the Julian
    to the Gregorian calendar in the sixteenth century knocked the saints’ days back
    by ten days, the weather shifted with them. But frankly, given my despair at yet
    another failed harvest, I would try anything.


    Yet somehow, the following month, I found myself in the allotments again, scytheing
    the meadow, picking up the old shoes that a fox was collecting—who knows from
    where—and leaving in our grass, summer-pruning the trees. I realized I was preparing
    the orchard for the following year, in the expectation that our luck would change.
    Hope had once again triumphed over experience.'
