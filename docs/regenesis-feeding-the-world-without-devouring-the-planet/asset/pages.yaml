  md: 'Counterintuitively, apple juice is a modern product. Traditionally, the entire
    pressing was used to make “make” cider (which in Britain means the alcoholic drink),
    though “make” misleadingly suggests an active process. Juice starts fermenting
    immediately. Proper cider contains nothing else. The apples provide the sugars,
    the flavor and, and attached to their skins, the yeast. By Christmas, it''s drinkable,
    though still sweet and fizzy. By February, it has settled into a smooth, subtle,
    well-balanced brew, in my disionate opinion the finest alcoholic drink ever to
    have ruined human lives. By the end of May it is a little dry. By July it lives
    up to the Latin name for apples: you could use it to remove graffiti. To prevent
    juice from becoming cider, you need to pasteurize it. This requires energy, to
    bring the liquid to 70°C. Until recently, energy for heating was in short supply.
    The only juice people drank came straight from the press.'
