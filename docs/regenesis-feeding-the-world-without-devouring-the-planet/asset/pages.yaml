- img_proc: true
  md: 'The experience of environmental campaigners has so far been bitter. We appeal
    to humanity’s fabled survival instinct, and find it missing. We assemble the evidence,
    explain the problem, propose a solution, and are received like Dr. Stockmann in
    Henrik Ibsen’s play An Enemy of the People: with anger, denial, and obloquy.


    But the experience of all effective movements also shows that success is a function
    of their preparedness for a moment of transformation. It may come unexpectedly,
    caused by entirely unrelated forces. Sometimes the role of entire generations
    is simply to make ready, develop their arguments, tell their stories, build their
    campaigns, for an opportunity their successors can seize.


    I think we are beginning to see an alignment of technological change, systemic
    fragility, and public disquiet sufficient to trigger a techno-ethical shift, of
    the kind catalyzed by the printing press and the contraceptive pill, that could
    allow us to recast our relationship with the living planet. No prayers are required
    to provoke this change of state, just the hard work of a small number of committed
    people, and the willingness of others to support them. We are, I think, soon to
    encounter a moment when conditions change.'
