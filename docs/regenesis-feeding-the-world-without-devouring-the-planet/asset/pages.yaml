    under some conditions: its self-organizing properties stabilize it. But when conditions
    change, and it is pushed towards a threshold, the self-organizing properties have
    the opposite effect, amplifying chaos.[4] They start transmitting shocks through
    the network, which compound and aggravate each other. At this point, a small disturbance
    can tip the entire system over the threshold, and it collapses, suddenly and unstably.


