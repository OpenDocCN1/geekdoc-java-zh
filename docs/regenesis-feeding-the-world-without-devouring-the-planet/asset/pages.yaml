  md: 'While I was researching this chapter, the doorbell rang. Deliveries are usually
    annoying distraction. But when I saw what the man was holding, bounced down the
    stairs and flung open the door. I took receipt of a large cardboard box that contained
    a possible future. I asked my youngest daughter to open it, as it mostly belonged
    to her.


    I''m sure she would have preferred a mobile phone. The contents were not the most
    thrilling present for a nine-year-old. There were five bags. Four of them contained
    flour, the fifth, rice. But when I showed her the remarkable photograph that accompanied
    them, and explained what it meant, she contracted a little of my excitement.


    The photo was printed on a long thin strip of paper, folded in three. One to reveal
    two plants side by side, dug from the soil with its roots intact, shot against
    a black background. Both were members of the grass family. I recognized the one
    on the left. It was a modern, short-stemmed variety of wheat. The pale roots formed
    a thin goatee, a little longer than the plant was tall.


    The grass on the right was a species I hadn''t seen before. It was taller and
    bushier than the wheat. Its seeds were long and thin. But the most interesting
    feature lay below ground: a giant beard of roots that ZZ Top would have worn with
    pride, woolly and matted, blotting out the background and twisting down to the
    bottom of the third fold.[99] Using the wheat for scale, I reckoned it must have
    been over three meters long.


    This was a specimen of intermediategrass.[+] The name is slightly misleading,
    as it has no relationship to wheat. It is a wild plant, the specimen in the photo
    had passed through several generations of selective breeding by a nonprofit group
    called The Land Institute.[100] which had sent me the box from its base in Salina,
    Kansas. Because intermediate wheatgrass is unlikely to lodge in the mind, the
    institute had given the plant a new name: Kernza. Four of the five bags contained
    flour made from its seeds.


    There''s nothing inherently amazing about flour from grass seeds. After all, most
    of the grains we eat from this family: wheat, rice, corn, oats, sorghum, millet,
    rye, and barley are all grass. Several businesses'
