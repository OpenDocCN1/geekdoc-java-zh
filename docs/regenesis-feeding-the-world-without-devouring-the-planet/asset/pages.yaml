    solution?”


    “The real solution?”


    “Yes. That everyone should spend 30 percent of their income on food.

    But—


    “That’s the issue, isn’t it? Food is too cheap. That’s why it’s all gone wrong.
    But you didn’t say it.”

    Well—


    So it was a waste of time. Well-meaning, but a waste of time.

    She marched away before I had a chance to answer.


    This is a claim I’ve often heard: food is too cheap. Food is too cheap to provide
    sufficient income for small farmers, among whom many of the world’s hungriest
    people. It is too cheap, as Tolly pointed out, to enable large farmers to farm
    well. It is too cheap to reflect the damage it inflicts on the living world, the
