  md: 'Similar problems afflict free-range farming, of all kinds. One of the upsetting,
    disorienting findings by the groups trying to protect the Wye that free-range
    egg farms are just as damaging, and possibly more so, as the huge broiler units
    or laying factories in the catchment.[156] Why? For the same reason people want
    to buy their eggs: the chickens are allowed outdoors. While this is better for
    their welfare, it means they lay a scorching carpet of reactive phosphate across
    the fields on they roam, often at far greater concentrations than any farm would
    spread manure. When rain falls, their droppings are washed off the land and into
    the rivers even faster, and in a rawer state, the excrement extracted from the
    factories and spread deliberately on the fields. Because they use more energy
    than confined birds, free-range chickens also need more food, exerting even greater
    pressure on the ecosystems of South America.


    But this is just the beginning of the problem. The chicken factories in the Wye
    Valley testify to the wider economic failure of free-range farming. Many of the
    farmers who have built these barns are making their living from pasture (free-range)
    sheep or cattle. Farms on the upper Wye might own or lease a few fields in the
    valleys, and larger tracts of land in the hills. Traditionally, sheep were kept
    in the woodlands (the *hendre*) during the winter, then herded into the mountains
    (the *hafod*) in the summer. This farming has not been economically viable for
    many years. Across Wales, where most of the land is used for sheep grazing, the
    average farm income from agriculture hovers around £0 a year.[157] Almost all
    the money farmers receive from public subsidies. This system has also generated
    a series of disasters.


    Sheep farming is uneconomic partly because the land can sustain few animals. In
    some Welsh ranges, the maximum possible stocking density is less than one sheep
    per hectare, and sometimes as little as one sheep per hectares. For decades in
    the second half of the twentieth century, farmers were paid a subsidy for every
    animal they kept. This perverse payments created an incentive to pack the hills
    with far more sheep than they could support. This could have helped create a terrestrial
    desert zone in part of the Wye’s watershed: the southern Cambrian Mountains.[158]'
