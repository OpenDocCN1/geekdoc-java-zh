  md: 'So far, so conventional. But after we had inspected his crops, Tim took me
    to see the craziest and cleverest farm diversification I’ve encountered. It’s
    what every modern farmer needs: a long barrow.


    He had built a full-scale Neolithic monument, brand-new but designed 5,500 years
    ago. The Neolithic, or stone age, is the period in which farming began, and Tim’s
    reconstruction closed the circle in a fascinating way. It’s not a folly, but an
    essential part of his farm’s economy. From the outside, it looks like a conical
    heap of earth with grass growing on top. But as you duck through the doorway,
    you see that it has been built around massive yellow stones, two of which form
    the entrance, and the third the lintel and part of the roof. You step into a high,
    domed chamber built from small stone blocks. It feels cool and hollowed. Beyond
    the chamber is a long gallery, built on the same principles. The front door aligns
    with the rising sun of the summer solstice, the back door with the rising sun
    of the winter solstice.


    “I was slightly nervous about getting it right. The first solstice was an anxious
    moment. The sun rose where it meant to, and shone straight through the door.”


    Built into the walls of the chambers are hundreds of loculi: alcoves where funeral
    urns are placed, in which Tim’s customers pay, in some cases, several thousand
    pounds to be left in peace. Even before it was finished, the spaces began to fill.
    “We have pagans, Roman Catholics, evangelical atheists. It seems to be a place
    where people put aside their differences.”


    Tim calls his barrow “neo-Neolithic.” He describes his farming the same way.


    “In the Neolithic, they couldn’t plow, as they didn’t have animals. So they must
    have drilled the seed directly into the ground, perhaps with a tool made from
    an antler. It’s taken five and a half thousand years to realize we made a mistake,
    and to relearn what they knew.”


