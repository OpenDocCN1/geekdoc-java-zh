    bacteria acquire resistance from manure bacteria. They do this through a remarkable
    called horizontal gene transfer, which means that different species of microbe
    acquire genetic packages.[49] The result is that soil treated with manure quickly
    becomes a reservoir of antibiotic resistance genes in soil on the North China
    Plain.[50]'
