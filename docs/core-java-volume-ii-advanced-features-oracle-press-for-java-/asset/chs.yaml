  \   `static <T> Collector<T,?,Long> groupingBy(Function<? super T,? extends K> classifier,\
  \ Collector<? super T,A,D> downstream)`\n    产生一个产生 map 的收集器。键是将 `classifier` 应用于所有收集元素的结果。值是使用下游收集器对具有相同键的元素收集的结果。\n\
  \n*   `static <T> Collector<T,?,Long> groupingBy(Function<? super T,? extends K>\
