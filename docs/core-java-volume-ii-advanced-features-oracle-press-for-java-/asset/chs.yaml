  \        record Pair<S, T>(S first, T second) {\n        }\n        Pair<List<String>,\
  \ Double> result = cities.filter(c -> c.state().equals(\"NV\")).collect(\n     \
  \       teeing(mapping(City::name, toList()), averagingDouble(City::population),\n\
