  \ formatter)`\n  解析给定字符串并返回其中的 `LocalDate`、`LocalTime`、`LocalDateTime` 或 `ZonedDateTime`。如果解析失败，则抛出\
  \ `DateTimeParseException`。\n\n## 7.4. 排序与归一化\n\n大多数程序员都知道如何使用 `String` 类的 `compareTo`\
  \ 方法来比较字符串。遗憾的是，在与用户交互时，这个方法并不好用。`compareTo` 方法使用字符串的 UTF-16 编码的值，这即使在英语中也会导致荒谬的结果。例如，以下五个字符串根据\
  \ `compareTo` 方法的排序如下：\n\n```\nAmerica\nZulu\nable\nzebra\nÅngström\n```\n\n对于字典排序，你可能希望认为大写和小写字母是等价。对于英语使用者来说，示例单词列表的顺序应该是：\n\
  \n```\nable\nAmerica\nÅngström\nzebra\nZulu\n```\n\n然而，这个顺序对于瑞典用户来说是不可的。在瑞典语中，字母\
  \ `Å` 与字母 `A` 不同，并且它排在字母 `Z` 之后！这意味着瑞典用户希望单词按以下方式排序：\n\n```\nable\nAmerica\nzebra\n\
  Zulu\nÅngström\n```\n\n要获取区域敏感的比较器，请调用静态方法 `Collator.getInstance`：\n\n```java\n\
  Collator coll = Collator.getInstance(locale);\nwords.sort(coll); // Collator 实现了\
  \ Comparator<Object>\n```\n\n从 Java 21 开始，你可以通过扩展指定特殊的排序器。例如，语言标记为 `sv-u-co-trad`\
  \ 的区域使用传统的瑞典排序规则，它不区分“v”和“w”。\n\n由于 `Collator` 类实现了 `Comparator` 接口，你可以将 `Collator`\
  \ 对象传递给 `List.sort(Comparator)` 方法来对字符串列表进行排序。\n\n排序器有几个高级设置。你可以设置排序器的*强度*（strength）来调整其选择的敏感程度。字符差异被分类为*初级*（primary）、*次级*（secondary）或*三级*（tertiary）。例如，在英语中，“A”和“Z”之间的差异被认为是初级的，“A”和“Å”之间的差异是次级的，而“A”和“a”之间的差异是三级的。\n\
  \n通过将排序器的强度设置为 `Collator.PRIMARY`，你告诉它它只关注初级差异。通过将强度设置为 `Collator.SECONDARY`，你指示排序器考虑次级差异。也就是说，当强度被设置为“次级”或“三级”时，两个字符串更有可能被认为是不同的，如表\
  \ 7.8 所示。\n\n表 7.8：不同强度的排序规则（英语区域）\n\n| 初级 | 次级 | 三级 |\n| --- | --- | --- |\n| Angstrom\
  \ = Ångström | Angstrom ≠ Ångström | Angstrom ≠ Ångström |\n| Able = able | Able\
  \ = able | Able ≠ able |\n\n当排序器的强度设置为 `Collator.IDENTICAL` 时，不允许任何差异。这种设置主要与一种技术性的排序器设置——分解模式配合使用，我们将在后面讨论。\n\
  \n有时，一个字符或字符序列可以用多种方式描述。例如，`Å` 可以是 Unicode `U00C5`，也可以表示为 `A` (`U0065`) 后跟 `°`（组合环形\
  \ U030A）。可能令人惊讶的是，字母序列“ffi”可以使用单个字符“连字 ffi” UFB03。\n\nUnicode 标准为字符串定义了四种*归一化形式*（normalization\
  \ forms）（D、KD、C 和 KC）。详情请参见 [`www.unicode.org/unicode/reports/tr15/tr15-23.html`](https://www.unicode.org/unicode/reports/tr15/tr15-23.html)。在归一化形式\
  \ C 中，重音字符总是组合的。例如，“A”和组合环形“°”的序列组合成单个字符“Å”。在形式 D 中，重音字符总是分解为基础字母和组合重音：“Å”被转换为“A”后跟“°”。形式\
  \ KC 和 KD 还会分解如连字或商标等字符。\n\n你可以选择希望排序器使用的归一化程度。`Collator.NO_DECOMPOSITION` 不对字符串进行任何归一化。此选项更快，但可能不适用于以多种形式表示字符的文本。默认的\
  \ `Collator.CANONICAL_DECOMPOSITION` 使用归一化形式 D。对于包含重音但不包含连字的文本很有用。最后，“完全分解”使用归一化形式\
  \ KD。示例请参见表 7.9](#index_05table05)。\n\n表 7.9：不同分解模式的差异\n\n| 不分解 | 规范分解 | 完全分解 |\n\
  | --- | --- | --- |\n| Å ≠ A° | Å = A° | Å = A° |\n| ™ ≠ TM | ™ ≠ TM | ™ = TM |\n\
  \n多次让排序器分解同一个字符串是浪费资源的。如果一个字符串需要与其他字符串进行多次比较，你可以将分解结果保存在*排序*键（collation key）对象中。`getCollationKey`\
  \ 方法返回一个 `CollationKey` 对象，你可以用它进行后续更快的比较。这是一个示例：\n\n\n\n\n\n```\nString a = . .\
  \ .;\nCollationKey aKey = coll.getCollationKey(a);\nif(aKey.compareTo(coll.getCollationKey(b))\
  \ == 0) //快速比较\n    . . .\n```\n\n最后，即使你没有进行排序，可能也想将字符串转换为它们的归一化形式——例如，将字符串存储在数据库中或与另一个程序通信。`java.text.Normalizer`\
  \ 类执行归一化过程。这里有一个示例：\n\n```\nString name = \"Ångström\";\nString normalized = Normalizer.normalize(name,\
  \ Normalizer.Form.NFD);\n    // 使用归一化格式 D\n```\n\n归一化后的字符串包含十个字符。“Å”和“ö”被替换为序列“A°”和“o¨”。\n\
  \n然而这通常不是存储和传输的最佳形式。归一化格式 C（NFC）首先应用分解，然后按照标准顺序将重音组合回来。根据 W3C 标准，这是通过互联网传输数据的推荐模式。\n\
  \nListing 7.3 中的程序允许你实验排序顺序。该书的配套代码还有一个 GUI 版本。在文本框中输入一个单词并点击 Add 按钮将其添加到单词列表中。每当你添加另一个单词，或者更改语言环境（locale）、强度或分解模式时，单词列表都会重新排序。`\
  \ 符号表示被视为相同的单词（参见图 7.3）。\n\n![Figure](img/fig05-03.jpg)图 7.3: `CollationDemo` 程序\n\
  \n语言环境名称使用默认语言环境的排序器按排序显示。如果你使用美国英语（US English）环境运行此程序，请注意“Norwegian (Norway,Nynorsk)”在“Norwegian\
  \ (Norway)”之前。标准的字符串比较会反转这个顺序，因为逗号字符的 Unicode 值大于右括号字符的 Unicode 值。\n\nListing 7.3\
  \ v2ch07/collation/CollationDemo2.java\n\n```\npackage v2ch07.collation;\n\nimport\
  \ module java.base;\nimport v2ch07.util.Choices;\n\n/**\n * 此程序演示了在各种语言环境下的字符串排序。\n\
  \ */\nclass CollationDemo2 {\n   void main() {\n      var locales = (Locale[]) NumberFormat.getAvailableLocales().clone();\n\
  \      Arrays.sort(locales, Comparator.comparing(Locale::getDisplayName));\n   \
  \   Locale locale = Choices.choose(locales, Locale::getDisplayName);\n\n      Collator\
  \ collator = Collator.getInstance(locale);\n      int strength = Choices.choose(Collator.class,\
  \ \n         \"Primary\", \"Secondary\", \"Tertiary\", \"Identical\");\n      int\
  \ decomposition = Choices.choose(Collator.class, \n         \"Canonical Decomposition\"\
  , \"Full Decomposition\", \"No Decomposition\");\n\n      List<String> strings =\
  \ new ArrayList<>();\n      strings.add(\"America\");\n      strings.add(\"able\"\
  );\n      strings.add(\"Zulu\");\n      strings.add(\"zebra\");\n      strings.add(\"\
  \\u00C5ngstr\\u00F6m\");\n      strings.add(\"A\\u030angstro\\u0308m\");\n     \
  \ strings.add(\"Angstrom\");\n      strings.add(\"Able\");\n      strings.add(\"\
  office\");\n      strings.add(\"o\\uFB03ce\");\n      strings.add(\"Java\\u2122\"\
  );\n      strings.add(\"JavaTM\");\n\n      collator.setStrength(strength);\n  \
  \    collator.setDecomposition(decomposition);\n\n      strings.sort(collator);\n\
  \n      for (int i = 0; i < strings.size(); i++) {\n         String s = strings.get(i);\n\
  \         if (i > 0 && collator.compare(s, strings.get(i - 1)) == 0)\n         \
  \   System.out.print(\"= \");\n         System.out.println(s);\n      }\n   }\n\
  }\n```\n\n`java.text.Collator`1.1\n\n*   `static Locale[] getAvailableLocales()`\n\
  \    返回可用 `Collator` 对象的 `Locale` 对象数组。\n\n*   `static Collator getInstance()`\n\
  \n*   `static Collator getInstance(Locale l)`\n    返回用于默认语言环境或给定语言环境的排序器。\n\n* \
  \  `int compare(String a, String b)`\n    如果 `a` 在 `b` 之前，则返回负值；如果被视为相同，则返回 0；否则返回正值。\n\
  \n*   `boolean equals(String a, String b)`\n    如果 `a` 和 `b` 被视为相同，则返回 `true`，否则返回\
  \ `false`。\n\n*   `void setStrength(int strength)`\n\n*   `int getStrength()`\n\
  \    设置或获取排序器的强度。越强的排序器能区分更多的单词。强度值为 `Collator.PRIMARY`、`Collator.SECONDARY` 和 `Collator.TERTIARY`。\n\
  \n*   `void setDecomposition(int decomp)`\n\n*   `int getDecompositon()`\n    设置或获取排序器的分解模式。排序器对字符串分解得越多，在判断两个字符串是否被视为相同时就越严格。分解值为\
