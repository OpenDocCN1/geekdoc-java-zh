  \ 或 CLOB。\n\n### 5.5.3. SQL 转义 (Escapes)\n\n数据库通常支持“转义”语法功能，但使用的是数据库特定的语法变体。JDBC\
  \ 驱动的任务是将转义语法翻译为特定数据库的语法。\n\n针对以下功能提供了转义支持：\n\n*   日期和时间字面量\n*   调用标量函数\n*   调用存储过程\n\
  *   外连接\n*   `LIKE` 子句中的转义字符\n\n日期和时间字面量在数据库之间差异巨大。要嵌入日期或时间字面量，请使用下面所示的 ISO 8601/RFC\
  \ 3339 格式之一指定值，其中毫秒是可选的。驱动程序将将其转换为原生格式。对于 `DATE`、`TIME` 或 `TIMESTAMP` 值，分别使用 `d`、`t`、`ts`：\n\
  \n```\n{d '2024-01-24'}\n{t '23:59:59'}\n{ts '2024-01-24 23:59:59.999'}\n```\n\n\
  `标量函数` (scalar function) 是返回单个值的函数。许多函数在数据库中可用，但名称不同。JDBC 规范提供了标准名称并将其翻译为数据库特定的名称。要调用函数，请如下所示嵌入标准函数名和参数：\n\
  \n```\n{fn left(?, 20)}\n{fn user()}\n```\n\n你可以在 JDBC 规范中找到支持的函数名的完整列表。\n\n两个表的`外连接`\
  \ (outer join) 并不要求每个表的行都根据连接条件匹配。例如，查询\n\n```\nSELECT * FROM {oj Books LEFT OUTER\
  \ JOIN Publishers\nON Books.Publisher_Id = Publisher.Publisher_Id}\n```\n\n该查询包含了某些\
  \ `Publisher_Id` 在 `Publishers` 表中没有匹配的书籍，并用 `NULL` 值表示不存在匹配。你需要使用 `RIGHT OUTER\
  \ JOIN`（右外连接）来包含没有匹配书籍的出版者，或者使用 `FULL OUTER JOIN`（全外连接）来返回两者。大多数数据库支持所有形式的外连接，但某些并不支持。`oj`\
  \ 转义允许 JDBC 驱动定位并重写任何不支持的外连接操作。如果你的数据库支持所有形式的外连接，则无需担心这种转义。\n\n最后，`_` 和 `%` 字符在\
  \ `LIKE` 子句中有特殊含义——用于匹配单个字符或字符序列。没有标准方法可以字面上地使用它们。如果你想匹配所有包含 `_` 的字符串，请使用此结构：\n\n\
  ```\n. . . WHERE ? LIKE %!_% {escape '!'}\n```\n\n在这里，我们定义 `!` 为转义字符。组合 `!_` 表示表示一个字面意义上的下划线。\n\
  \n`存储过程` (stored procedure) 是在数据库中执行的程序，用特定语言编写。JDBC 提供了转义语法来调用存储过程。要调用函数，如下所示嵌入函数名和参数：\n\
  \n```\n{call procedure_name(?, ?)}\n```\n\n对于输出参数，使用 `CallableStatement` 并设置类型：\n\
  \n```\n{call procedure_name(?, ?)}\n```\n\n对于输出参数，使用 `CallableStatement`：\n\n```\n\
  {call procedure_name(?, ?)}\n```\n\n### 5.5.4. 多个结果 (Multiple Results)\n\n某些查询允许返回多个结果集或更新计数。在执行存储过程时，可能会发生这种情况。\n\
  \n```\n{call procedure_name(?, ?)}\n```\n\n以下循环遍历所有结果：\n\n```java\nboolean isResult\
  \ = stat.execute(command);\nboolean done = false;\nwhile (!done) {\n    if (isResult)\
  \ {\n        ResultSet result = stat.getResultSet();\n        // 处理 result\n   \
  \ } else {\n        int updateCount = stat.getUpdateCount();\n        if (updateCount\
  \ >= 0)\n            // 处理 updateCount\n        else\n            done = true;\n\
  \    }\n    if (!done) isResult = stat.getMoreResults();\n}\n```\n\n`java.sql.Statement`\
  \ 1.1\n\n*   `boolean getMoreResults()`\n\n*   `boolean getMoreResults(int current)`\n\
  \n    获取到下一个结果集。`current` 参数是 `CLOSE_CURRENT_RESULT`、`KEEP_CURRENT_RESULT` 或 `CLOSE_ALL_RESULTS`\
  \ 之一。\n\n### 5.5.5. 获取自动生成的键 (Retrieving Autogenerated Keys)\n\n大多数数据库支持自动编号机制。遗憾的是，这些机制之间差异很大。这些自动数字通常用主键。虽然\
  \ JDBC 没有提供生成键的跨厂商解决方案，但它提供了一种高效获取的方法。当你向表中插入新行并自动生成键时，可以使用以下代码获取它：\n\n```java\n\
  stat.executeUpdate(insertStatement, Statement.RETURN_GENERATED_KEYS);\nResultSet\
  \ rs = stat.getGeneratedKeys();\nif (rs.next()) {\n    int key = rs.getInt(1);\n\
  }\n```\n\n`java.sql.Statement` 1.1\n\n*   `boolean execute(String statement, int\
  \ autogenerated)`\n\n*   `int executeUpdate(String statement, int autogenerated)`\n\
  \n    如前所述执行给定的语句。如果 `autogenerated` 设置为 `Statement.RETURN_GENERATED_KEYS` 且语句是\
  \ `INSERT` 语句，则第一列包含生成的键。\n\n## 5.6. 可滚动和可更新的结果集 (Scrollable and Updatable Result\
  \ Sets)\n\n正如你所见，`ResultSet` 接口的 `next` 方法遍历结果集中的行。这对于分析数据的程序来说足够了。然而，考虑一种（index.xhtml_ch04fig05）显示表格或查询结果的可视化数据（如图\
  \ 5.4 所示）。你通常希望用户能够在结果集中前后移动。在*可滚动*结果集中，你可以向前或向后移动，甚至可以跳转到任何位置。\n\n此外，一旦用户看到了显示的结果集内容，他们可能会编辑它。在*可更新*的结果集中，你可以通过编程更新条目，从而使数据库自动更新。我们将在后续章节中讨论这些功能。\n\
  \n\n\n\n\n`type` 和 `concurrency` 的可能值列在 表 5.6 中。你有以下选择：\n\n* 你是否希望结果集是可滚动的？？如果不是，请使用\
  \ `ResultSet.TYPE_FORWARD_ONLY`。\n* 如果结果集是可滚的，你是否希望它能反映产生该结果集的查询之后发生的数据库更改？（在我们的讨论中，我们假设可滚结果集使用了\
  \ `ResultSet.TYPE_SCROLL_INSENSITIVE` 设置。这假设结果集不会“感知”在查询执行之后发生的数据库更改。）\n* 你是否希望能够通过编辑结果集来更新数据库？（详情请见下一节。）\n\
  \n### 表 5.6：`ResultSet` 类型和并发性值\n\n| Value | 解释 |\n| --- | --- |\n| `TYPE_FORWARD_ONLY`\
  \ | 结果集不可滚动（默认值）。 |\n| `TYPE_SCROLL_INSENSITIVE` | 结果集是可滚的，但对数据库更改不敏感。 |\n| `TYPE_SCROLL_SENSITIVE`\
  \ | 结果集是可滚的，且对数据库更改敏感。 |\n| `CONCUR_READ_ONLY` | 结果集不能用于更新数据库（默认值）。 |\n| `CONCUR_UPDATABLE`\
  \ | 结果集可以用于更新数据库。 |\n\n例如，如果你只是想能够滚动查看结果集但不想编辑其数据，请使用\n\n```\nStatement stat = conn.createStatement(\n\
  \    ResultSet.TYPE_SCROLL_INSENSITIVE, ResultSet.CONCUR_READ_ONLY);\n```\n\n所有通过调用\n\
  \n```\nResultSet rs = stat.executeQuery(query);\n```\n返回的结果集现在都是可滚的。可滚结果集有一个 `cursor`（游标），用于指示当前位置。\n\
  \n并不是所有的数据库驱动程序都支持可滚动或可更新的结果集。（`DatabaseMetaData` 接口的 `supportsResultSetType` 和\
  \ `supportsResultSetConcurrency` 方法将告诉你在使用特定驱动程序的数据库支持哪些类型和并发模式。）即使数据库支持所有结果集模式，特定的查询也可能无法产生具有你所要求的所有属性的结果集。（例如，复杂查询的结果集可能是不可更新的。）在这种情况下，`executeQuery`\
  \ 方法将返回一个能力较弱的 `ResultSet`，并向连接对象添加一个 `SQLWarning`。（Section 5.4.3 显示了如何检索警告。）或者，你可以使用\
  \ `ResultSet` 接口的 `getType` 和 `getConcurrency` 方法来查找结果集实际上处于什么模式。如果你没有检查结果集的能力并执行了不支持的操作（例如在不可滚的结果集上执行\
  \ `previous`），该操作将抛出 `SQLException`。\n\n滚动非常简单。使用\n\n```\nif (rs.previous()) . ./;\n\
  ```\n向后滚动。如果游标位于实际的一行上，该方法返回 `true`；如果现在位于第一行之前，则返回 `false`。\n\n你可以通过调用将游标向后移动任意行：\n\
  \n```\nrs.relative(n);\n```\n如果 `n` 为正数，游标向前移动。如果 `n` 为负数，游标向后移动。如果 `n` 为零，则调用没有影响。如果你尝试将游标移动到当前行集之外，它将被设置为指向最后一行之后或第一行之前，取决于\
  \ `n` 的正负。然后，方法返回 `false` 且游标不移动。如果游标位于实际的一行上，该方法返回 `true`。\n\n或者，你可以将游标设置为特定的行号：\n\
  \n```\nrs.absolute(n);\n```\n要获取当前行号，请调用\n\n```\nint currentRow = rs.getRow();\n\
  ```\n结果集中的第一行编号为 `1`。如果返回值为 `0`，则游标当前不在某行上——它位于第一行之前或最后一行之后。\n\n便利方法 `first`、`last`、`beforeFirst`\
  \ 和 `afterLast` 将游标移动到第一个、最后一个、第一行之前或最后一个之后的位置。\n\n最后，方法 `isFirst`、`isLast`、`isBeforeFirst`\
  \ 和 `isAfterLast` 测试游标是否处于这些特殊位置之一。\n\n使用可滚结果集非常简单。缓存查询数据的脏工作由数据库驱动程序在后台完成。\n\n\
  ### 5.6.2. 可更新的结果集\n\n如果你想编辑结果集中的数据并让更改自动反映在数据库中，请创建一个可更新的结果集。可更新的结果集不必是可滚的，但如果你向用户展示数据进行编辑，你通常也希望允许滚动。\n\
  \n要获取可更新的结果集，请按如下方式创建语句：\n\n```\nStatement stat = conn.createStatement(\n    ResultSet.TYPE_SCROLL_INSENSITIVE,\
  \ ResultSet.CONCUR_UPDATABLE);\n```\n随后调用 `executeQuery` 返回的结果集将是可更新的。\n\n并不是所有查询都返回可更新的结果集。如果你的查询是涉及多个表的连接查询，结果可能是不可更新的。然而，如果你的查询只涉及单个表，或者你通过主键连接了多个表，你应该预期结果集是可更新的。请注意，你无法影响新数据添加到结果集或数据库的*位置*。\n\
  \n上述的示例显示了如何修改现有行。如果你想向数据库添加新行，请首先使用 `moveToInsertRow` 方法将游标移动到一个特殊位置，称为*插入行*（insert\
  \ row）。然后，通过发出 `updateXxx` 指令在插入行位置构建一个新行。完成后，调用 `insertRow` 方法将新行交付到数据库。插入完成后，调用\
  \ `moveToCurrentRow` 将游标移回调用 `moveToInsertRow` 之前的位置。这是一个示例：\n\n```\nrs.moveToInsertRow();\n\
  rs.updateString(\"Title\", title);\nrs.updateString(\"ISBN\", isbn);\nrs.updateString(\"\
  Publisher_Id\", pubid);\nrs.updateDouble(\"Price\", price);\nrs.insertRow();\nrs.moveToCurrentRow();\n\
  ```\n如果你没有在插入行中指定列值，它将被设置为 SQL `NULL`。然而，如果该列具有 `NOT NULL` 约束，则会抛出异常且不会插入行。\n\n\
  最后，你可以删除游标所处的行：\n\n```\nrs.deleteRow();\n```\n`deleteRow` 方法将立即从结果集和数据库中删除该行。\n\n\
  \n\n\n\n`ResultSet` 接口的 `updateRow`、`insertRow` 和 `deleteRow` 方法赋予了你执行 `UPDATE`、`INSERT`\
  \ 和 `DELETE` SQL 语句相同的权力。然而，Java 程序员可能会认为通过结果集（result sets）来操作数据库内容比构建 SQL 语句更加自然。\n\
  \n如果你不小心，使用可更新的结果集（updatable result sets）可能会写出效率极下的代码。执行 `UPDATE` 语句比执行查询并遍历结果、在此过程中更改数据要高效得多。可更新的结果集对于用户可以进行任意更改的交互式程序是有意义的，但对于大多数程序化的更改，SQL\
  \ `UPDATE` 更为合适。\n\nJDBC 2 对结果集进行了进一步增强，例如，如果数据已被另一个并发数据库连接修改，它具备了使用最新数据更新结果集的能力。JDBC\
  \ 3 进一步增加了另一项改进，规定了事务在事务提交时结果集的行为。然而，这些高级功能超出了本介绍章节的范围。有关更多信息，请参考由 Maydene Fisher、Jon\
  \ Ellis 和 Jonathan Bruce 编写的 *JDBC^™ API Tutorial and Reference, Third Edition*（Addison-Wesley,\
  \ 2003）以及 JDBC 规范。\n\n### `java.sql.Connection`\n\n* `Statement createStatement(int\
  \ type, int concurrency)`\n* `PreparedStatement prepareStatement(String command,\
  \ int type, int concurrency)`\n  创建一个产生给定类型和并发性结果集的语句或预编译语句。`type` 参数为常量 `TYPE_FORWARD_ONLY`、`TYPE_SCROLL_INSENSITIVE`\
  \ 或 `TYPE_SCROLL_SENSITIVE` 之一，而 `concurrency` 是常量 `CONCUR_READ_ONLY` 或 `CONCUR_UPDATABLE`\
  \ 之一，这些都定义在 `ResultSet` 接口中。\n\n### `java.sql.ResultSet`\n\n* `int getType()`\n\
  \  返回此结果集的类型——`TYPE_FORWARD_ONLY`、`TYPE_SCROLL_INSENSITIVE` 或 `TYPE_SCROLL_SENSITIVE`\
  \ 之一。\n* `int getConcurrency()`\n  返回此结果集的并发性设置——`CONCUR_READ_ONLY` 或 `CONCUR_UPDATABLE`\
  \ 之一。\n* `boolean previous()`\n  将游标移动到上一行。如果游标位于某行，则返回 `true`；如果游标位于第一行之前，则返回 `false`。\n\
  * `int getRow()`\n  获取当前行号。行从 `1` 开始编号。\n* `boolean absolute(int r)`\n  将游标移动到第\
  \ `r` 行。如果游标位于某行，则返回 `true`。\n* `boolean relative(int d)`\n  将游标移动 `d` 行。如果 `d`\
  \ 为负数，则游标向后移动。如果游标位于某行，则返回 `true`。\n* `boolean first()`\n* `boolean last()`\n  将游标移动到第一行或最后一行。如果游标位于某行，则返回\
  \ `true`。\n* `void beforeFirst()`\n* `void afterLast()`\n  将游标移动到第一行之前或最后一行之后。\n\
  * `boolean isFirst()`\n* `boolean isLast()`\n  测试游标是否在第一行或最后一行。\n* `boolean isBeforeFirst()`\n\
  * `boolean isAfterLast()`\n  测试游标是否在第一行之前或最后一行之后。\n* `void moveToInsertRow()`\n\
  \  将游标移动到插入行。插入行是一个用于通过 `updateXxx` 和 `insertRow` 方法插入新数据的特殊行。\n* `void moveToCurrentRow()`\n\
  \  将游标从插入行移回调用 `moveToInsertRow` 方法时所在的行。\n* `void insertRow()`\n  将插入行的内容插入数据库和结果集。\n\
  * `void deleteRow()`\n  从数据库和结果集中删除当前行。\n* `void updateXxx(int column, Object data)`\n\
  * `void updateXxx(String columnName, Object data)`\n  （`Xxx` 是某种类型，如 `int`、`double`、`String`、`Date`\
  \ 等）\n  更新结果集当前行中的某一个字段。\n* `void updateRow()`\n  将当前行的更新发送到数据库。\n* `void cancelRowUpdates()`\n\
  \  取消当前行的更新。\n\n### `java.sql.DatabaseMetaData`\n\n* `boolean supportsResultSetType(int\
  \ type)`\n  如果数据库支持给定类型的结果集，则返回 `true`；`type` 是 `ResultSet` 接口的常量 `TYPE_FORWARD_ONLY`、`TYPE_SCROLL_INSENSITIVE`\
  \ 或 `TYPE_SCROLL_SENSITIVE` 之一。\n* `boolean supportsResultSetConcurrency(int type,\
  \ int concurrency)`\n  如果数据库支持给定类型和并发性组合的结果集，则返回 `true`。`type` 参数是常量 `TYPE_FORWARD_ONLY`、`TYPE_SCROLL_INSENSITIVE`\
  \ 或 `TYPE_SCROLL_SENSITIVE` 之一，而 `concurrency` 是常量 `CONCUR_READ_ONLY` 或 `CONCUR_UPDATABLE`\
  \ 之一，这些都定义在 `ResultSet` 接口中。\n\n## 5.7. 行集 (Row Sets)\n\n可滚动的结果集（Scrollable result\
  \ sets）非常强大，但它们有一个缺点：你需要在整个交互保持连接开启。如果你需要将结果移动到应用程序的另一层（例如手机），行集也是合适的。但行集比较稀少。\n\
  \n### 5.7.1. 构建行集\n\n`javax.sql.rowset` 包提供了以下扩展自 `RowSet` 的接口：\n\n* `CachedRowSet`\
  \ 允许离线操作。我们将在下一节讨论缓存行集。\n* `WebRowSet` 是一种可以保存到 XML 文件的缓存行集。该 XML 文件可以移动到应用程序的另一层，由另一个\
  \ `WebRowSet` 对象打开。\n* `FilteredRowSet` 和 `JoinRowSet` 接口支持对行集进行等于 `SELECT` 和 `JOIN`\
  \ 操作。这些操作是在存储的行集数据上进行的，无需建立数据库连接。\n* `JdbcRowSet` 是 `ResultSet` 的薄封装。它增加了来自 `RowSet`\
  \ 接口的有用方法。\n\n获取缓存行集请调用：\n\n```\nRowSetFactory factory = RowSetProvider.newFactory();\n\
  CachedRowSet crs = factory.createCachedRowSet();\n```\n\n获取其他行集类型的方法类似。\n\n### 5.7.2.\
  \ 缓存行集 (Cached Row Sets)\n\n缓存行集包含了结果集的所有数据。由于 `CachedRowSet` 是 `ResultSet` 接口的子接口，你可以像使用结果集一样使用缓存行集。缓存行集带来了一个优势：你可以关闭连接并继续使用行集。正如我们在\
  \ `Listing 5.4` 示例程序看到的，这极大地简化了交互式应用程序的实现。每个用户命令只需打开数据库连接、执行查询、将结果放入缓存行集，然后关闭数据库连接。\n\
  \n甚至修改缓存行集中的数据也是可能的。当然，这些修改不会立即反映在数据库中；你需要显式请求以接受累积的更改。随后 `CachedRowSet` 会重新连接到数据库并执行\
  \ SQL 语句写入累积的更改。\n\n你可以从结果集填充缓存行集：\n\n```\nResultSet result = . . .\nRowSetFactory\
  \ factory = RowSetProvider.newFactory();\nCachedRowSet crs = factory.createCachedRowSet();\n\
  crs.populate(result);\nconn.close(); // 现在可以关闭数据库连接了\n```\n\n\n\n\n另一种，你可以让 `CachedRowSet`\
  \ 对象自动建立连接。设置数据库参数：\n\n```java\ncrs.setURL(\"jdbc:derby://localhost:1527/COREJAVA\"\
  );\ncrs.setUsername(\"dbuser\");\ncrs.setPassword(\"secret\");\n```\n\n然后设置查询语句和任何参数：\n\
  \n```java\ncrs.setCommand(\"SELECT * FROM Books WHERE Publisher_Id = ?\");\ncrs.setString(1,\
  \ publisherId);\n```\n\n最后，用查询结果填充行集：\n\n```java\ncrs.execute();\n```\n\n此调用会建立数据库连接、发布查询、填充行集并断开连接。\n\
  \n如果你的查询结果非常大，你可能不想将其全部放入行集中。毕竟，你的用户可能只查看几行数据。在在这种情况下，请指定一个页大小：\n\n```java\nCachedRowSet\
  \ crs = . . .;\ncrs.setCommand(command);\ncrs.setPageSize(20);\n. . .\ncrs.execute();\n\
  ```\n\n现在你将只获得 20 行。要获取下一批行数据，请调用\n\n```java\ncrs.nextPage();\n```\n\n你可以使用与处理结果集相同的方法来检查和修改行集。如果你修改了行集内容，必须通过调用以下方法将其写回数据库\n\
  \n```java\ncrs.acceptChanges(conn);\n```\n\n或者\n\n```java\ncrs.acceptChanges();\n\
  ```\n\n只有当你为行集配置了连接数据库所需的信息（如 URL、用户名和密码）时，第二次调用才起作用。\n\n在 第 5.6.2 节 中，你看到并不是所有的结果集都是可更新的。同样，包含复杂查询结果的行集将无法将其更改写回数据库。如果你的行集包含来自单个表的数据，那么通常是安全的。\n\
  \n如果你是从结果集填充行集的，那么行集并不知道要更新的表名。你需要调用 `setTableName` 来设置表名。\n\n如果数据库中的数据在你填充行集后发生了变化，则会产生另一种复杂性。这显然是可能导致数据不一致的故障迹象。参考实现（reference\
  \ implementation）会检查原始行值（即编辑前的值）与数据库中的当前值是否相同。如果是，则它们会被编辑后的值替换；否则，将抛出 `SyncProviderException`\
  \ 且没有任何更改会被写入。其他实现可以使用其他的策略进行同步。\n\n### `javax.sql.RowSet1.4`\n\n- `String getURL()`\n\
  - `void setURL(String url)`\n  获取或设置数据库 URL。\n- `String getUsername()`\n- `void\
  \ setUsername(String username)`\n  获取或设置连接数据库的用户名。\n- `String getPassword()`\n-\
  \ `void setPassword(String password)`\n  获取或设置连接数据库的密码。\n- `String getCommand()`\n\
  - `void setCommand(String command)`\n  获取或设置用于填充此行集的执行命令。\n- `void execute()`\n\
  \  通过发布用 `setCommand` 设置的语句填充此行集。为了让驱动程序管理器获取连接，必须设置 URL、用户名和密码。\n\n### `javax.sql.rowset.CachedRowSet5.0`\n\
  \n- `void execute(Connection conn)`\n  通过发布用 `setCommand` 设置的语句填充此行集。此方法使用了给定的连接*并将其关闭*。\n\
  - `void populate(ResultSet result)`\n  用给定的结果集的数据填充此缓存行集。\n- `String getTableName()`\n\
  - `void setTableName(String tableName)`\n  获取或设置填充此缓存行集的表名。\n- `int getPageSize()`\n\
  - `void setPageSize(int size)`\n  获取或设置页大小。\n- `boolean nextPage()`\n- `boolean\
  \ previousPage()`\n  加载下一页或上一页的行。如果有下一页或上一页，则返回 `true`。\n- `void acceptChanges()`\n\
  - `void acceptChanges(Connection conn)`\n  重新连接到数据库并写入编辑行集产生的更改。如果因为数据库数据已更改而无法写回，可能会抛出\
  \ `SyncProviderException`。\n\n### `javax.sql.rowset.RowSetProvider7`\n\n- `static\
  \ RowSetFactory newFactory()`\n  创建一个行集工厂。\n\n### `javax.sql.rowset.RowSetFactory7`\n\
  \n- `CachedRowSet createCachedRowSet()`\n- `FilteredRowSet createFilteredRowSet()`\n\
  - `JdbcRowSet createJdbcRowSet()`\n- `JoinRowSet createJoinRowSet()`\n- `WebRowSet\
  \ createWebRowSet()`\n  创建一个指定类型的行集。\n\n## 5.8 元数据\n\n在前面的章节中，你学习了如何填充、查询和更新数据库表。然而，\
  \ JDBC 可以为你提供关于数据库及其表的*结构*的额外信息。例如，你可以获取特定数据库中的表列表，或者某个表的列名和类型。当你实现一个具有预定义数据库的业务应用程序时，这些信息并不有用。毕竟，如果你是你设计了表，你就知道它们的结构。然而，对于编写处理任何数据库工具的程序员来说，结构性信息是极其用的。\n\
  \n在 SQL 中，描述数据库或其部分的数据被称为*元数据*（以将其与实际数据区分开来）。你可以获取三种元数据：关于数据库的、关于结果集的以及关于准备语句的。要获取更多关于数据库的信息，从数据库连接请求一个\
  \ `DatabaseMetaData` 对象\n\n```java\nDatabaseMetaData meta = conn.getMetaData();\n\
  ```\n\n使用此对象获取关于数据库的信息。例如，调用\n\n```java\nResultSet mrs = meta.getTables(null, null,\
  \ null, new String[] { \"TABLE\" });\n```\n\n返回一个包含表信息的结果集。（参数请参见本节末尾的 API 释）。结果集中的每一行都是关于表的信息。第三列是表名。以下循环收集所有表名\n\
  \n```java\nwhile (mrs.next())\n    tableNames.add(mrs.getString(3));\n```\n\n元数据还有另一个重要的用途。数据库是复杂的，SQL\
  \ 标准为变体留下了大量空间。`DatabaseMetaData` 接口中的一百多个方法可以查询数据库，包括具有此类奇异名称的调用\n\n```java\nmeta.supportsCatalogsInPrivileges()\n\
  ```\n\n以及\n\n```java\nmeta.nullNonNull()\n```\n\n显然，这些是针对有特殊需求的高级用户的——特别是那些需要编写可在多个数据库上运行的可移植代码的程序员。\n\
  \n第二个元数据接口 `ResultSetMetaData` 报告结果集。每当你从查询获取结果集时，都可以查询列数以及每列的名称、类型和字段宽度。这是一个典型的循环：\n\
  \n```java\nResultSet rs = stat.executeQuery(\"SELECT * FROM \" + tableName);\nResultSetMetaData\
  \ rsmd = rs.getMetaData();\nfor (int i = 1; i <= rsmd.getColumnCount(); i++) {\n\
  \    String columnName = rsmd.getColumnLabel(i);\n    int columnWidth = rsmd.getColumnDisplaySize(i);\n\
  \    . . .\n}\n```\n\n如果你有一个准备语句，可以获取该语句执行时返回的结果集的元数据\n\n```java\nPreparedStatement\
  \ pstat = conn.prepareStatement(. . .);\nResultSetMetaData rsmd = pstat.getMetaData();\n\
  ```\n\n第三种元数据描述了准备语句的参数：\n\n```java\nParameterMetaData pmd = pstat.getParameterMetaData();\n\
  for (int i = 1; i <= pmd.getParameterCount(); i++) {\n    IO.println(pmd.getParameterTypeName(i));\n\
  }\n```\n\n列表 5.4 中的程序使用元数据让你浏览数据库中的所有表并执行简单的编辑。该程序还说明了缓存行集的使用。\n\n\n\n\n\n伴随代码有一个更美观的\
  \ GUI 版本。顶部的组合框显示数据库中的所有表。选择其中一个，框架的中心就会填充该表的字段名和第一行的数据，如图 5.6 所示。点击 `Next`（下一个）和\
  \ `Previous`（上一个）可以滚动表中的行。你还可以删除某行并编辑 `String` 类型的值。点击 `Save`（保存）按钮将更改保存到数据库。\n\n\
  ![Figure](img/fig04-08.jpg)图 5.6：`ViewDB` GUI 应用程序\n\n示例程序向你展示如何实现处理任意表的工具。许多数据库和\
  \ IDE 都带有更复杂的工具来查看和编辑表。如果你更喜欢使用独立程序，可以查看 DBeaver ([`dbeaver.io`](https://dbeaver.io))\
  \ 或 SQuirreL ([`squirrelsql.org`](https://squirrelsql.org))。这些程序可以与任何 JDBC 数据库配合。\n\
  \n列表 5.4 `v2ch05/view/ViewDB2.java`\n\n```java\npackage v2ch05.view;\n\nimport module\
  \ java.base;\nimport module java.sql;\nimport module java.sql.rowset;\nimport v2ch05.exec.ExecSQL;\n\
