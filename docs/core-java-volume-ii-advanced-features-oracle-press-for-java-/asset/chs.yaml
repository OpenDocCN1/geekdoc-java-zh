  \n\n\n\n\n```java\npackage v2ch04.httpClient;\n\nimport module java.base;\nimport\
  \ java.net.http.HttpRequest.*;\n\npublic class MoreBodyPublishers {\n    public\
  \ static BodyPublisher ofFormData(Map<Object, Object> data) {\n        boolean first\
  \ = true;\n        var builder = new StringBuilder();\n        for (Map.Entry<Object,\
  \ Object> entry : data.entrySet()) {\n            if (first)\n                first\
  \ = false;\n            else\n                builder.append(\"&\");\n         \
  \   builder.append(\n                    URLEncoder.encode(entry.getKey().toString(),\
  \ StandardCharsets.UTF_8));\n            builder.append(\"=\");\n            builder.append(\n\
  \                    URLEncoder.encode(entry.getValue().toString(), StandardCharsets.UTF_8));\n\
  \        }\n        return BodyPublishers.ofString(builder.toString());\n    }\n\
  \n    public static BodyPublisher ofMimeMultipartData(Map<String, List<?>> data,\
  \ String boundary)\n            throws IOException {\n        var bps = new ArrayList<BodyPublisher>();\n\
  \        var header = new StringBuilder();\n        for (Map.Entry<String, List<?>>\
  \ entry : data.entrySet()) {\n            for (Object value : entry.getValue())\
  \ {\n                header.append(\"--%s\\r\\nContent-Disposition: form-data; name=%s\"\
  \n                        .formatted(boundary, entry.getKey()));\n\n           \
  \     if (value instanceof Path path) {\n                    header.append(\"; filename=\\\
  \"%s\\\"\\r\\n\".formatted(path.getFileName()));\n                    String mimeType\
  \ = Files.probeContentType(path);\n                    if (mimeType != null)\n \
  \                       header.append(\"Content-Type: %s\\r\\n\".formatted(mimeType));\n\
  \                    header.append(\"\\r\\n\");\n                    bps.add(BodyPublishers.ofString(header.toString()));\n\
  \                    bps.add(BodyPublishers.ofFile(path));\n                }\n\
  \                else {\n                    header.append(\"\\r\\n\\r\\n%s\\r\\\
  n\".formatted(value));\n                    header.append(\"\\r\\n\");\n       \
  \             bps.add(BodyPublishers.ofString(header.toString()));\n           \
  \     }\n                header = new StringBuilder(\"\\r\\n\");\n            }\n\
  \        }\n        bps.add(BodyPublishers.ofString(\"\\r\\n--%s--\\r\\n\".formatted(boundary)));\n\
  \        return BodyPublishers.concat(bps.toArray(BodyPublisher[]::new));\n    }\n\
  \n    public static BodyPublisher ofSimpleJSON(Map<Object, Object> data) {\n   \
  \     var builder = new StringBuilder();\n        builder.append(\"{\");\n     \
  \   var first = true;\n        for (Map.Entry<Object, Object> entry : data.entrySet())\
  \ {\n            if (first)\n                first = false;\n            else\n\
  \                builder.append(\",\");\n            builder.append(jsonEscape(entry.getKey().toString())).append(\"\
  : \")\n                    .append(jsonEscape(entry.getValue().toString()));\n \
  \       }\n        builder.append(\"}\");\n        return BodyPublishers.ofString(builder.toString());\n\
  \    }\n\n    private static Map<Character, String> replacements = Map.of('\\b',\
  \ \"\\\\b\", '\\f', \"\\\\f\", '\\n',\n            \"\\\\n\", '\\r', \"\\\\r\",\
  \ '\\t', \"\\\\t\", '\"', \"\\\\\\\"\", '\\\\', \"\\\\\\\\\");\n\n    private static\
  \ StringBuilder jsonEscape(String str) {\n        var result = new StringBuilder(\"\
  \\\"\");\n        for (int i = 0; i < str.length(); i++) {\n            char ch\
  \ = str.charAt(i);\n            String replacement = replacements.get(ch);\n   \
  \         if (replacement == null)\n                result.append(ch);\n       \
  \     else\n                result.append(replacement);\n        }\n        result.append(\"\
  \\\"\");\n        return result;\n    }\n}\n```\n\n`java.net.http.HttpClient` 11\n\
  \n* `static HttpClient newHttpClient()`\n    返回一个具有默认配置的 `HttpClient`。\n\n* `static\
  \ HttpClient.Builder newBuilder()`\n    返回一个用于构建 `HttpClient` 的构建器。\n\n* `<T> HttpResponse<T>\
  \ send(HttpRequest request, HttpResponse.BodyHandler<T> responseBodyHandler)`\n\n\
  * `<T> CompletableFuture<HttpResponse<T>> sendAsync(HttpRequest request, HttpResponse.BodyHandler<T>\
  \ responseBodyHandler)`\n    发起同步或异步请求并使用给定的处理器处理响应体。\n\n`java.net.http.HttpClient.Builder`\
  \ 11\n\n* `HttpClient build()`\n    返回一个具有由此构建器配置的属性的 `HttpClient`。\n\n* `HttpClient.Builder\
  \ followRedirects(HttpClient.Redirect policy)`\n    将重定向策略设置为 `HttpClient.Redirect`\
  \ 枚举中的值之一 `ALWAYS`、`NEVER` 或 `NORMAL`（仅拒绝从 HTTPS 到 HTTP 的重定向）。\n\n* `HttpClient.Builder\
  \ executor(Executor executor)`\n    设置异步请求的执行器。\n\n`java.net.http.HttpRequest` 11\n\
  \n* `HttpRequest.Builder newBuilder()`\n    返回一个用于构建 `HttpRequest` 的构建器。\n\n* `HttpRequest.Builder\
  \ newBuilder(HttpRequest request, BiPredicate<String,String> filter)` 16\n    返回一个构建器，用于构建与提供的请求属性相同的请求，仅包含过滤器接受的标头。\n\
  \n`java.net.http.HttpRequest.Builder` 11\n\n* `HttpRequest build()`\n    返回一个具有由此构建器配置的属性的\
  \ `HttpRequest`。\n\n* `HttpRequest.Builder uri(URI uri)`\n    设置此请求的 URI。\n\n* `HttpRequest.Builder\
  \ header(String name, String value)`\n    设置一个标头。\n\n* `HttpRequest.Builder header(String\
  \ name, String value)`\n    设置一个标头。\n\n* `HttpRequest.Builder GET()`\n    设置请求方法。\n\
  \n* `HttpRequest.Builder DELETE()`\n    设置请求方法。\n\n* `HttpRequest.Builder POST(BodyPublisher\
  \ publisher)`\n    设置请求方法和体。\n\n* `HttpRequest.Builder PUT(BodyPublisher publisher)`\n\
  \    设置请求方法和体。\n\n`java.net.http.HttpResponse<T>` 11\n\n* `T body()`\n    返回体。\n\
  \n* `int statusCode()`\n    返回状态码。\n\n* `HttpHeaders headers()`\n    返回头部。\n\n`java.net.http.HttpHeaders`\n\
  \n* `Map<String,List<String>> map()`\n    返回这些头部的 `Map`。\n\n* `Optional<String>\
  \ firstValue(String name)`\n    返回第一个值。\n\n## 4.5 简单服务器\n\n自 Java 6 起，JDK 在 `com.sun.net.httpserver`\
  \ 包中提供了一个简单服务器。在 Java 18 中，增加了一个基于该包的命令行工具。当时添加了一些便利类，JEP 408 确认了该包受“官方支持”。该服务器用于测试和调试。\n\
  \n### 4.5.1 命令行工具\n\n启动简单服务器，使用命令\n\n```\njwebserver\n```\n\n它在端口 8000 上提供当前目录及其子目录的文件。当提供文件时，会打印消息。可以使用\
  \ `-d` 和 `-p` 更改目录和端口：\n\n```\njwebserver -d /tmp -p 8189\n```\n\n你还可以使用 `-o` 命令行选项设置消息输出级别。选项包括\
  \ `info`（默认）、`verbose` 和 `none`。\n\n要杀死服务器，按下 Ctrl+C 或使用 `kill`/`pkill` 命令。\n\n\
  该服务器仅用于提供文件。\n\n通过代码启动简单文件服务器：\n\n```java\nimport com.sun.net.httpserver.*;\n. .\
  \ .\nHttpServer server = SimpleFileServer.createFileServer(new InetSocketAddress(port),\n\
  \    Path.of(\"/tmp\"), OutputLevel.VERBOSE);\nserver.start();\n```\n\n现在你可以对其进行各种自定义。或者，如果你不想提供文件，可以获取一个空服务器\n\
  \n```\nHttpServer server = HttpServer.create(new InetSocketAddress(port), 0);\n\
  ```\n\n第二个参数是服务器套接字的“积压长度”，即队列连接请求的最大数量。对于零参数，将使用默认值。\n\n你可以设置处理请求的执行器：\n\n```\n\
  server.setExecutor(Executors.newVirtualThreadPerTaskExecutor());\n```\n\n为了让服务器执行任何有趣的操作，你需要创建*上下文*。\n\
  \n上下文具有\n\n\n\n\n*   一个 `path`，必须是请求路径的前缀\n*   一个用于计算响应的 `handler`\n*   一个 `filters`\
  \ 列表，可以转换请求或响应（参见第 4.5.4 节）\n\n如果请求匹配了多个上下文，则执行路径最长的那个。例如，在这里我们为 `/static/` 和 `/`\
  \ 路径安装了两个处理器：\n\n```\nserver.createContext(\"/static/\", SimpleFileHandler.createFileHandler(staticRoot));\n\
  server.createContext(\"/\", HttpHandlers.of(301,\n    Headers.of(\"Location\", \"\
  https://horstmann.com/corejava\"), \"\"));\n```\n\n请注意，你可以利用现有的处理器，例如简单文件服务器的处理器。\n\
  \n静态方法 `HttpHandlers.of` 会产生一个返回固定响应的简单处理器。你传递状态码、响应头部和响应体。\n\n静态方法 `HttpHandlers.handleOrElse`\
  \ 使用 `Predicate<Request>` 在两个处理器之间进行选择：\n\n```\nHttpHandler handler = HttpHandlers.handleOrElse(\n\
  \    request -> request.getRequestMethod().equals(\"GET\"),\n    SimpleFileHandler.createFileHandler(staticRoot),\n\
  \    HttpHandlers.of(500, Headers.of(), \"Bad request\"));\n```\n\n对于更复杂的处理器，你需要提供\
  \ `HttpHandler` 子类的实例。详情请见下一节。\n\n### 4.5.3. Handlers\n\n处理器在其方法中产生 HTTP 请求的响应：\n\
  \n```\npublic void handle(HttpExchange exchange)\n```\n\n`HttpExchange` 实例同时持有请求和响应数据。处理器必须按照特定的顺序使用该对象：\n\
  \n1. 读取请求方法、URI 和头部：\n\n```\nString method = exchange.getRequestMethod();\nURI uri\
  \ = exchange.getRequestURI();\nHeaders requestHeaders = exchange.getRequestHeaders();\n\
  String userAgent = requestHeaders.getFirst(\"user-agent\");\n```\n\n2. 读取 `POST`、`PUT`\
  \ 和 `PATCH` 请求的请求体：\n\n```\nInputStream in = exchange.getRequestBody();\nString\
  \ body = new String(in.readAllBytes());\nin.close();\n```\n\n3. 设置响应头部：\n\n```\n\
  Headers responseHeaders = exchange.getResponseHeaders();\nresponseHeaders.add(\"\
  Content-type\", \"text/plain\");\n...\n```\n\n4. 设置状态码和响应体长度：\n\n```\nexchange.sendResponseHeaders(200,\
  \ responseBytes.length);\n```\n\n5. 如果存在响应体，则进行写入：\n\n```\nOutputStream responseBody\
  \ = exchange.getResponseBody();\nresponseBody.write(responseBytes);\nresponseBody.close();\n\
  ```\n\n请求和响应头部都是 `Headers` 类的实例，它实现了 `Map<String, List<String>>`。请记住每个头部可以有多个值。`Headers`\
  \ 类与第 4.4 节中看到的 `HttpHeaders` 类似，键是不区分大小写的。\n\n如果你知道某个键最多有一个值，调用 `getFirst` 获取它。要在响应映射中添加键值对，请使用上面代码段中的\
  \ `add` 方法。\n\nListing 4.12 中的产生文本响应的处理器示例。\n\n### 4.5.4. Filters\n\n除了处理器之外，上下文还可以有一个过滤器链。过滤器可以修改请求或响应，也可以执行日志记录或验证等额外工作。例如，简单\
  \ Web 服务器使用过滤器来显示请求。\n\n要实现过滤器，请扩展抽象类 `Filter` 并实现两个方法。`description` 方法返回一个描述性字符串。`doFilter`\
  \ 方法通常如下：\n\n```\npublic void doFilter(HttpExchange exchange, Filter.Chain chain)\
  \ {\n    // 请求处理\n    chain.doFilter(exchange);\n    // 响应处理\n}\n```\n\n通过调用 `chain.doFilter(exchange)`，触发剩余的过滤器和处理器。过滤器可以终止过滤和处理——例如验证失败。此时不应调用\
  \ `chain.doFilter(exchange)`，而是在 `exchange` 对象中产生响应。\n\n你可以这样添加过滤器：\n\n```\ncontext.getFilters().add(filter);\n\
  ```\n\n如你所见，HTTP 服务器 API 有些原始且过时。在你自己的代码中，不要提供返回内部可变结构引用的方法，就像 `Context.getFilters`\
  \ 方法所做的那。\n\n`Filter` 类有三个用于过滤器的静态工厂方法：\n\n```\npublic Filter beforeHandler(String\
  \ description, Consumer<HttpExchange> operation)\npublic Filter afterHandler(String\
  \ description, Consumer<HttpExchange> operation)\npublic Filter adaptRequest(String\
  \ description, UnaryOperator<Request> requestOperator)\n```\n\n前两个将 `exchange` 对象（在请求之前或之后）传递给可以检查或修改它的消费者。\n\
  \n第三个方法使得向请求添加头部变得更方便一些：\n\n```\nFilter f = Filter.adaptRequest(\"Adding header\"\
  ,\n    request -> request.with(headerName, List.of(headerValue)));\n```\n\n当然，与\
  \ Tomcat 或 Jetty 等成熟服务器相比，这个服务器相当基础。但它是 JDK 的一部分，对于原型设计已经足够。\n\nListing 4.12 v2ch4/httpServer/EchoServer.java\n\
  \n```\npackage v2ch4.httpServer;\n\nimport module java.base;\nimport module jdk.httpserver;\n\
  \n/**\n * 此程序实现了一个监听 8189 端口或给定参数端口的 HTTP 服务器，\n * 并回显客户端输入。\n */\nclass EchoServer\
  \ {\n    void main(String[] args) throws Exception {\n        int port = args.length\
  \ >= 1 ? Integer.parseInt(args[0]) : 8189;\n        HttpServer server = HttpServer.create(new\
  \ InetSocketAddress(port), 0);\n        server.setExecutor(Executors.newVirtualThreadTaskExecutor());\n\
  \        server.createContext(\"/\", HttpHandlers.of(301,\n                Headers.of(\"\
  Location\", \"https://horstmann.com/corejava\"), \"\"));\n        server.createContext(\"\
  /echo\", (HttpExchange exchange) -> {\n            var headers = new StringBuilder();\n\
  \            exchange.getRequestHeaders().forEach(\n                    (k, vs)\
  \ -> vs.forEach(v -> headers.append(\"%s: %s\\n\".formatted(k, v))));\n\n      \
  \      String requestBody = new String(exchange.getRequestBody().readAllBytes());\n\
  \            String response = \"%s %s\\n%s\\n%s\\n\".formatted(exchange.getRequestMethod(),\n\
  \                    exchange.getRequestURI(), headers, requestBody);\n        \
  \    byte[] responseBytes = response.getBytes();\n\n            exchange.sendResponseHeaders(200,\
  \ responseBytes.length);\n            OutputStream responseBody = exchange.getResponseBody();\n\
  \            responseBody.write(responseBytes);\n            responseBody.close();\n\
  \        });\n        server.start();\n    }\n}\n```\n\n## 4.6. 发送电子邮件\n\n过去，通过与邮件服务器的\
  \ 25 端口端口建立套字连接来编写发送电子邮件的程序是简单的。简单邮件传输协议（SMTP）描述了电子邮件的格式。一旦连接到服务器，先发送邮件头部（SMTP 格式，很容易生成），然后是邮件正文。\n\
  \n以下是详情：\n\n1. 打开到主机的套字。\n\n### ```\nvar s = new Socket(\"mail.yourserver.com\"\
  , 25); // 25 是 SMTP\nvar out = new PrintWriter(s.getOutputStream());\n```\n\n2.\
  \ 向打印流发送以下信息：\n\n\n\n\n```\nHELO sending host\nMAIL FROM: sender e-mail address\n\
  RCPT TO: recipient e-mail address\nDATA\nSubject: subject\n(blank line)\nmail message\
  \ (any number of lines)\n.\nQUIT\n```\n\nSMTP 规范（`RFC 821`）规定行必须以 `\\r` 紧接 `\\n`\
  \ 结束。\n\n过去，SMTP 服务器通常愿意路由来自任何人的电子邮件。然而，在如今垃圾邮件泛滥的时代，大多数服务器都内置了检查机制，并且只接受来自其信任的用户或\
  \ IP 地址范围的请求。身份验证通常在安全套接连接上进行。\n\n手动实现这些身份验证方案非常繁琐。相反，我们将向你如何使用 `Jakarta Mail API`\
  \ 从 Java 程序发送电子邮件。\n\n要使用 `Jakarta Mail`，你需要设置一些取决于你邮件服务器的属性。例如，使用 `GMail` 时，使用以下配置：\n\
  \n```\nmail.transport.protocol=smtps\nmail.smtps.auth=true\nmail.smtps.host=smtp.gmail.com\n\
  mail.smtps.user=accountname@gmail.com\n```\n\n我们的示例程序从属性文件中读取这些内容。出于安全考虑，我们不将密码放在属性文件中，而是提示用户输入。\n\
  \n对于大多数邮件提供商，你需要生成并使用一个特殊的应用程序密码，而不是使用普通邮件密码。\n\n从属性文件中读取，然后如下所示获取邮件会话：\n\n```\n\
  Session mailSession = Session.getDefaultInstance(props);\n```\n\n创建一个包含所需的发件者、接收者、主题和消息正文的消息：\n\
  \n```\nvar message = new MimeMessage(mailSession);\nmessage.setFrom(new InternetAddress(from));\n\
  message.addRecipient(RecipientType.TO, new InternetAddress(to));\nmessage.setSubject(subject);\n\
  message.setText(builder.toString());\n```\n\n然后将其发送：\n\n```\nTransport tr = mailSession.getTransport();\n\
  tr.connect(null, password);\ntr.sendMessage(message, message.getAllRecipients());\n\
  tr.close();\n```\n\n程序从格式如下的文本文件中读取消息：\n\n```\nSender\nRecipient\nSubject\nMessage\
  \ text (any number of lines)\n```\n\n在编写本文时，`GMail` 并不检查信息的真实性——你可以提供任何喜欢的发件者。（下次当你收到来自\
  \ `president@whitehouse.gov` 的邮件，邀请你参加前院的黑色晚宴活动时，请记住这一点。）\n\n由于程序需要外部 JAR 文件，它没有包含在\
  \ `corejava-bookcode.zip` 文件中，而是包含在 `corejava-modulechapter.zip` 中。你不需要模块来运行程序。只需按照如下方式编译并运行：\n\
  \n```\ncd corejava-modulechapter/v2ch04.mail\njavac -classpath .:../jars/\\* com/horstmann/mail/MailDemo.java\n\
  java -classpath .:../jars/\\* com.horstmann.mail.MailDemo path/to/message.txt\n\
  ```\n\n或者，如果你更愿意，可以使用模块：\n\n```\ncd corejava-modulechapter/\njavac -p v2ch04.mail:jars/jakarta.mail-api-2.1.3.jar:jars/jakarta.activation-api-2.1.3.jar\
  \ \\\n    v2ch04.mail/com/horstmann/mail/MailDemo.java v2ch04.mail/module-info.java\n\
  java -p v2ch04.mail:jars/jakarta.mail-api-2.1.3.jar:jars/jakarta.activation-api-2.1.3.jar\n\
  :jars/angus-activation-2.0.2.jar:jars/angus-mail-2.0.3.jar \\\n    -m v2ch04.mail/com.horstmann.mail.MailDemo\
  \ path/to/message.txt\n```\n\n如果你无法确定为什么你的邮件连接不起工作，请调用：\n\n```\nmailSession.setDebug(true);\n\
  ```\n\n并检查消息。此外，`Jakarta Mail API` 的常见问题 [`eclipse-ee4j.github.io/angus-mail/FAQ`](https://eclipse-ee4j.github.io/angus-mail/FAQ)\
  \ 提供了一些实用的调试提示。\n\n在本章中，你已经了如何在 Java 中编写网络客户端和服务器，以及如何从 Web 服务器获取信息。下一章将介绍数据库连接。你将学习如何使用\
  \ `JDBC API` 在 Java 中操作关系型数据库。\n\n# 第 5 章 ▪ 数据库编程\n\n1996 年，Sun 发布了第一版本的 `JDBC API`。该\
  \ API 让程序员能够连接到数据库并使用结构化查询语言（`SQL`）进行查询或更新。（`SQL` 通常读作“sequel”，是关系型数据库访问的行业标准。）`JDBC`\
  \ 自此以后已成为 Java 库中最常用的 API 之一。\n\n`JDBC` 已更新了多次。在本书出版时，Java 9 包含的 `JDBC 4.3` 是最新版本。在本章中，我将解释\
  \ `JDBC` 背后的核心思想。我将为你介绍（或让你重温）`SQL`，这种用于关系型数据库的行业标准结构化查询语言。本章提供了足够的细节和示例，让你能够在常见的编程场景中使用\
  \ `JDBC`。\n\n根据 Oracle 的说法，`JDBC` 是一个注册商标术，而不是 Java Database Connectivity 的缩写。它的命名是为了让人联想到\
  \ `ODBC`，这是由微软开创的标准数据库 API，并在后被并入 SQL 标准中。\n\n## 5.1 JDBC 的设计\n\n从一开始，Java 开发者就意识到\
  \ Java 在处理数据库方面的潜力。1995 年，他们开始致力于扩展标准 Java 库以处理 SQL。他们很快就意识到这是一项不可能的任务：那里有太多的数据库，使用了太多的协议。此外，尽管数据库供应商都希望\
  \ Java 提供标准的网络协议，但他们只有在 Java 使用自己的网络协议时才支持这一点。\n\n这种组织遵循了 `ODBC` 的成功模型，后者为数据库访问提供了\
  \ C 语言接口。`JDBC` 和 `ODBC` 都基于相同的理念：根据 API 编写的程序与驱动管理器通信，由驱动管理器通过驱动驱动与数据库通信。这意味着 JDBC\
  \ API 是程序员唯一需要处理的内容。\n\n### 5.1.1 JDBC 驱动类型\n\nJDBC 规范将驱动分为以下几种类型：\n\n- `类型 1` 驱动将\
  \ `JDBC` 翻译为 `ODBC` 并依赖 `ODBC` 驱动与数据库通信。Java 的早期版本包含了这样一个驱动程序，即 `JDBC/ODBC 桥`。然而，该桥接需要部署并正确配置\
  \ `ODBC` 驱动。当 JDBC 最初发布时，该桥接非常方便，但它从未打算用于生产环境。现在，有了许多更好的驱动可用，且 JDK 不再提供 `JDBC/ODBC\
  \ 桥`。\n\n- `类型 2` 驱动部分用 Java 编写，部分用原生代码编写；它与数据库的客户端 API 通信。使用此类驱动时，除了 Java 库之外，你还需要客户端安装某些特定平台的代码。\n\
  \n- `类型 3` 驱动是一个纯 Java 客户端库，它使用与数据库无关的协议向服务器组件发送数据库请求，然后将请求翻译为特定数据库的协议。这简化了部署，因为特定平台的代码仅位于服务器上。\n\
  \n- `类型 4` 驱动是一个纯 Java 库，直接将 `JDBC` 请求翻译为特定数据库的协议。\n\n\n\n\n\n大多数数据库供应商会随其数据库提供第\
  \ 3 型或 4 型驱动程序。此外，许多第三方公司专门生产驱动程序，这些驱动程序在标准合规性、平台支持性、性能方面，或者在某些情况下的可靠性上优于数据库供应商提供的驱动程序。\n\
  \n总而言之，`JDBC` 的最终目标是实现以下功能：\n\n*   程序员可以使用 Java 编程语言编写应用程序，使用标准的 SQL 语句（甚至是 SQL\
  \ 的特殊扩展）来访问任何数据库，同时遵循 Java 语言的规范。\n*   数据库供应商和数据库工具供应商可以提供低级驱动程序。因此，他们可以针对其特定产品优化驱动程序。\n\
  \n如果你奇奇 Java 为什么不直接采用 ODBC 模型，根据 1996 年 JavaOne 大会上给出的解释，原因如下：\n\n*   `ODBC` 很难学习。\n\
  *   `ODBC` 包含一些带有大量复杂选项的命令。Java 编程语言偏好的风格是使用简单直观的方法，并尽可能多使用。\n*   `ODBC` 依赖于 `void*`\
  \ 指针和其他 C 语言特性，这些特性在 Java 编程语言中并不自然。\n*   基于 `ODBC` 的解决方案本质上比纯 Java 解决方案更安全且更难部署。\n\
  \n### 5.1.2. JDBC 的典型用途\n\n传统的客户端/服务器模型在客户端拥有丰富的 GUI，在服务器拥有数据库（参见图 5.1）。在 particular\
  \ 模型中，`JDBC` 驱动程序部署在客户端。\n\n.图 5.1: 传统的客户端/服务器应用程序\n\n然而，现在更常见的是三层模型，客户端应用程序不直接调用数据库。相反，它调用服务器上的中间件层，再由中间层执行数据库查询。三层模型有两个优势：它将*视觉呈现*（在客户端）与*业务逻辑*（在中间层）以及原始数据（在数据库中）分离。因此，可以从多个客户端（如\
  \ Java 桌面应用程序、网页浏览器或移动应用）访问相同的数据和相同的业务规则。\n\n客户端与中间层之间的通信通常通过 HTTP 进行。`JDBC` 管理中间层与后端数据库之间的通信。图\
  \ 5.2 显示了基本架构。\n\n.图 5.2: 三层应用程序\n\n## 5.2. 结构查询语言\n\n`JDBC` 允许你使用 `SQL` 与数据库通信，`SQL`\
  \ 基本上是所有关系型数据库服务器的命令语言。Microsoft Access 等桌面数据库具有用于查询和更新的 GUI，但 `JDBC` 专注于基于服务器的数据库，如\
  \ Oracle、`PostgreSQL`、`MySQL`、Microsoft SQL Server 等。\n\n`JDBC` 包可以认为是向数据库传递 `SQL`\
  \ 语句的 API。我们将在节节要介绍 `SQL`。如果你以前从未见过 `SQL`，可能会觉得这些材料不够。如果是这样，请转向该主题的许多学习资源之一；我推荐\
  \ Alan Beaulieu 写的 *Learning SQL*（O’Reilly, 2009）或位于 [`sql.learncodethehardway.org`](https://sql.learncodethehardway.org)\
  \ 的在线书籍 *Learn SQL The Hard Way*。\n\n你可以将数据库想象成一组带有行和列的命名表。每一列都有一个名称。每一行都包含一组数据。\n\
  \n\n\n\n注意字符串是用单引号括起来的，而不是双引号。字符串内部的单引号用一对单引号来表示。例如，\n\n```sql\nSELECT Title\nFROM\
  \ Books\nWHERE Title LIKE '%''%'\n```\n\n这会报告所有包含单引号的标题。\n\n你可以从多个表中选择数据：\n\n```sql\n\
  SELECT * FROM Books, Publishers\n```\n\n由于没有 `WHERE` 子句，这个查询并没有很有意义。它列出了两个表中所有行的组合。在我们的案例中，`Books`\
  \ 有 20 行，`Publishers` 有 8 行，结果是一个包含 $20 \\times 8$ 个条目的行结果集，并且存在大量的重复。我们确实想要限制查询范围，使我们只对那些书籍与其出版商的匹配项感兴趣：\n\
  \n```sql\nSELECT * FROM Books, Publishers\nWHERE Books.Publisher_Id = Publishers.Publisher_Id\n\
  ```\n\n此查询结果有 20 行，每本书对应一行，因为每本书在 `Publisher` 表中都有对应的一个出版商。\n\n每当查询中包含多个表时，相同的列名可能会出现在两个不同的地方。这在我们的示例中就发生了。在\
  \ `Books` 和 `Publishers` 表中都有一个名为 `Publisher_Id` 的列。当出现歧义时，你必须在每个列名前加上其所属的表名，例如\
  \ `Books.Publisher_Id`。\n\n你也可以使用 SQL 来更改数据库内部的数据。例如，假设你想将标题中包含“C++”的所有书籍的当前价格降低\
  \ $5.00：\n\n```sql\nUPDATE Books\nSET Price = Price - 5.00\nWHERE Title LIKE '%C++%'\n\
  ```\n\n同样，若要删除所有的 C++ 书籍，请使用 `DELETE` 查询：\n\n```sql\nDELETE FROM Books\nWHERE Title\
  \ LIKE '%C++%'\n```\n\nSQL 自带了函数，用于计算平均值、查找列中的最大值和最小值等，我们在这里不讨论这些内容。\n\n通常，要向表中插入值，你可以使用\
  \ `INSERT` 语句：\n\n```sql\nINSERT INTO Books\nVALUES ('A Guide to the SQL Standard',\
  \ '0-201-96426-0', '0201', 47.95)\n```\n\n表中表中插入的每一行都需要一个独立的 `INSERT` 语句。\n\n当然，在查询、修改和插入数据之前，你必须有一个存储数据的地方。使用\
  \ `CREATE TABLE` 语句创建一个新表。指定每列的名称数据类型。例如，\n\n```sql\nCREATE TABLE Books\n(\n   Title\
  \ VARCHAR(60),\n   ISBN CHAR(13),\n   Publisher_Id VARCHAR(6),\n   Price DECIMAL(10,2)\n\
  )\n```\n\n表 5.5 显示了常用的 SQL 数据类型。\n\n表 5.5：常见 SQL 数据类型\n\n| 数据类型 | 说明 |\n| --- |\
  \ --- |\n| `INTEGER` 或 `INT` | 通常是 32 位整数 |\n| `SMALLINT` | 通常是 16 位整数 |\n| `NUMERIC(m,n)`,\
  \ `DECIMAL(m,n)` 或 `DEC(m,n)` | 固定点小数数，总共 `m` 位数字，小数点后有 `n` 位数字 |\n| `FLOAT(n)`\
  \ | 具有 `n` 位二进制精度的浮点数 |\n| `REAL` | 通常是 32 位浮点数 |\n| `DOUBLE` | 通常是 64 位浮点数 |\n\
  | `CHARACTER(n)` 或 `CHAR(n)` | 长度为 `n` 的固定长度字符串 |\n| `VARCHAR(n)` | 最大长度为 `n` 的变长字符串\
  \ |\n| `BOOLEAN` | 布尔值 |\n| `DATE` | 日历日期，取决于实现 |\n| `TIME` | 一天中的时间，取决于实现 |\n|\
  \ `TIMESTAMP` | 日期和具体时间，取决于实现 |\n| `BLOB` | 二进制大对象 |\n| `CLOB` | 字符大对象 |\n\n在本书中，我们不会讨论在使用\
  \ `CREATE TABLE` 语句时的额外语句，例如键和约束。\n\n## 5.3 JDBC 配置\n\n当然，你需要一个提供可用 JDBC 驱动的数据库程序。有很多优秀的选择，例如\
  \ IBM DB2、Microsoft SQL Server、MySQL、Oracle 和 PostgreSQL。\n\n你还必须为你的实验创建一个数据库。我们假设你将其命名为\
  \ `COREJAVA`。创建一个新数据库，或者让你的数据库管理员创建一个具有相应权限的数据库。你需要能够在数据库中创建、更新和删除表。\n\n如果这是你第一次接触数据库，我建议你使用\
  \ Apache Derby 数据库，你可以从 [`db.apache.org/derby`](https://db.apache.org/derby) 获取。\n\
  \n或者，如果你熟悉 Docker，在 docker 镜像中运行 PostgreSQL 是非常的：\n\n```bash\ndocker pull postgres\n\
  docker run -e POSTGRES_PASSWORD=secret -e POSTGRES_DB=COREJAVA -p 5432:5432 -d postgres\n\
  ```\n\n在编写第一个数据库程序之前，你需要收集一些项目。接下来的章节将涵盖这些项目。\n\n### 5.3.1 数据库 URL\n\n连接到数据库时，你必须使用各种参数，如主机名、端口号和数据库名。通用语法为：\n\
  \n```\njdbc:derby://localhost:1527/COREJAVA;create=true\n```\n\n格式取决于供应商。例如，PostgreSQL\
  \ 驱动可以在 [`postgresql.org`](https://postgresql.org) 获取。\n\n### 5.3.2 驱动 JAR 文件\n\n\
  运行程序时，类路径中需要驱动 JAR 文件。在 Windows 上，使用分号分隔当前目录（用 `.` 表示）和驱动 JAR 路径：\n\n```bash\njava\
  \ -classpath:. ProgramName\n```\n\n### 5.3.3 启动数据库\n\n在连接数据库之前，需要启动数据库服务器。对于 Derby\
  \ 数据库，按照以下步骤操作：\n\n1. 打开终端并切换到存放数据库文件的目录。\n2. 在 Derby 安装目录找到 `derbyrun.jar` 文件。\n\
  3. 运行命令：\n```bash\njava -jar derbyrun.jar server start\n```\n4. 检查数据库运行正常。创建一个包含以下内容的\
  \ `ij.properties` 文件：\n```properties\nij.driver=org.apache.derby.jdbc.ClientDriver\n\
  ij.protocol=jdbc:derby://localhost:1527/\nij.database=COREJAVA;create=true\n```\n\
  5. 在另一个终端中，通过执行命令运行 Derby 的交互式脚本工具（称为 `ij`）：\n```bash\njava -jar derbyrun.jar ij\
  \ -p ij.properties\n```\n现在你可以执行 SQL 命令，例如：\n\n```sql\nCREATE TABLE Greetings (Message\
  \ VARCHAR(20));\nINSERT INTO Greetings VALUES ('Hello, World!');\nSELECT * FROM\
  \ Greetings;\nDROP TABLE Greetings;\n```\n\n注意每个命令必须以分号结束。要退出，输入：\n```sql\nEXIT;\n\
  ```\n6. 使用完数据库后，使用以下命令停止服务器：\n```bash\njava -jar derbyrun.jar server shutdown\n\
  ```\n\n如果你使用其他数据库，你需要查文档以了解如何启动和停止数据库服务器，以及如何连接它。\n\n### 5.3.4 连接数据库\n\n在你的 Java\
  \ 程序中，如下所示打开数据库连接：\n\n```java\nString url = \"jdbc:postgresql:COREJAVA\";\nString\
  \ username = \"dbuser\";\nString password = \"secret\";\nConnection conn = DriverManager.getConnection(url,\
  \ username, password);\n```\n\n\n\n\n驱动程序管理器遍历已注册的驱动程序，以寻找可以使用数据库 URL 中指定的子协议的驱动程序。\n\
  \n`getConnection` 方法返回一个 `Connection` 对象。在接下来的章节中，你将看到如何使用 `Connection` 对象来执行 SQL\
  \ 语句。\n\n要连接到数据库，你需要数据库的用户名和密码。\n\n默认情况下，Derby 允许你使用任何用户名连接，并且不检查密码。它为每个用户生成一套独立的表。默认用户名是\
  \ `app`。\n\nListing 5.1 中的测试程序演示了这些步骤。它从一个名为 `database.properties` 的文件加载连接参数并连接到数据库。示例代码提供的\
  \ `database.properties` 文件包含了 Derby 数据库的连接信息。如果你使用不同的数据库，请将特定数据库的连接信息放入该文件中。以下是一个连接到\
  \ PostgreSQL 数据库的示例：\n\n```\njdbc.drivers=org.postgresql.Driver\njdbc.url=jdbc:postgresql:COREJAVA\n\
  jdbc.username=dbuser\njdbc.password=secret\n```\n\n连接到数据库后，测试程序将执行以下 SQL 语句：\n\n\
  ```\nCREATE TABLE Greetings (Message VARCHAR(20))\nINSERT INTO Greetings VALUES\
  \ ('Hello, World!')\nSELECT * FROM Greetings\n```\n\n`SELECT` 语句的结果将被打印出来，你应该看到如下输出：\n\
  \n```\nHello, World!\n```\n\n然后通过执行以下语句删除该表：\n\n```\nDROP TABLE Greetings\n```\n\
  \n要运行此测试，请按照前面的描述启动数据库，并使用以下命令启动程序：\n\n```\njava -classpath driverJarPath:. test.TestDB\n\
  ```\n\n调试 JDBC 相关问题的一种方法是启用 JDBC 跟踪。调用 `DriverManager.setLogWriter` 方法可以将跟踪消息发送到\
  \ `PrintWriter`。跟踪输出包含 JDBC 活动的详细列表。大多数 JDBC 驱动程序实现都提供了额外的跟踪机制。例如，在 Derby 中，你可以在\
  \ JDBC URL 中添加 `traceFile` 选项：`jdbc:derby://localhost:1527/COREJAVA;create=true;traceFile=trace.out`。\n\
  \n由于从 JDBC 4 开始，驱动程序 JAR 包包含一个 `META-INF/services/java.sql.Driver` 的文件，该文件包含了驱动程序类的名称。\n\
  \n在极少数情况下，如果你使用旧版本的驱动程序 JAR 包，你需要找到供应商所使用的 JDBC 驱动程序类名。然后在命令行上设置 `jdbc.drivers`\
  \ 属性：\n\n```\njava -Djdbc.drivers=driverClassName ProgramName\n```\n\nListing 5.1\
  \ v2ch05/test/TestDB.java\n\n```java\npackage v2ch05.test;\n\nimport module java.base;\n\
  import module java.sql;\nimport v2ch05.exec.ExecSQL;\n\n/**\n * 此程序测试数据库和 JDBC 驱动程序是否配置正确。\n\
  \ */\nclass TestDB {\n    void main() throws Exception {\n        try {\n      \
  \      runTest();\n        }\n        catch (SQLException e) {\n            for\
  \ (Throwable t : e)\n                t.printStackTrace();\n        }\n    }\n\n\
  \    /**\n     * 通过创建表、添加一个值、显示表内容以及\n     * 删除表来运行测试。\n     */\n    void runTest()\
  \ throws SQLException, IOException {\n        try (Connection conn = ExecSQL.getConnection())\
  \ {\n            Statement stat = conn.createStatement();\n            stat.executeUpdate(\"\
  CREATE TABLE Greetings (Message VARCHAR(20))\");\n            stat.executeUpdate(\"\
  INSERT INTO Greetings VALUES ('Hello, World!')\");\n\n            try (ResultSet\
  \ result = stat.executeQuery(\"SELECT * FROM Greetings\")) {\n                if\
  \ (result.next()) System.out.println(result.getString(1));\n            }\n    \
  \        stat.executeUpdate(\"DROP TABLE Greetings\");\n        }\n    }\n}\n```\n\
  \n`java.sql.DriverManager`1.1\n\n- `static Connection getConnection(String url,\
  \ String user, String password)`\n  建立到给定数据库的连接并返回一个 `Connection` 对象。\n\n## 5.4.\
  \ 使用 JDBC 语句\n\n在接下来的章节中，你将看到如何使用 JDBC `Statement` 来执行 SQL 语句、获取结果并处理错误。然后我们将向你展示一个用于填充数据库的简单程序。\n\
  \n### 5.4.1. 执行 SQL 语句\n\n要执行 SQL 语句，你首先创建一个 `Statement` 对象。要创建语句对象，请使用从调用 `DriverManager.getConnection`\
  \ 获取的 `Connection` 对象。\n\n```\nStatement stat = conn.createStatement();\n```\n\n\
  接下来，将你想执行的语句放入一个字符串中，例如：\n\n```\nString command = \"\"\"\nUPDATE Books\nSET Price\
  \ = Price - 5.00\nWHERE Title NOT LIKE '%Introduction%'\n\"\"\";\n```\n\n然后，调用 `Statement`\
  \ 接口的 `executeUpdate` 方法：\n\n```\nstat.executeUpdate(command);\n```\n\n`executeUpdate`\
  \ 方法返回受 SQL 语句影响的行数，对于不返回行数的语句则返回 0。例如，上一个示例中对 `executeUpdate` 的调用返回了价格降低了 5.00\
  \ 美元的行数。\n\n`executeUpdate` 方法可以执行 `INSERT`、`UPDATE` 和 `DELETE` 等操作，以及如 `CREATE\
  \ TABLE` 和 `DROP TABLE` 等数据定义语句。然而，你需要使用 `executeQuery` 方法来执行 `SELECT` 查询。还有一个通用的\
  \ `execute` 语句可以执行任意 SQL 语句。它通常只用于执行用户交互式提供的查询。\n\n当你执行查询时，你感兴趣的是结果。`executeQuery`\
  \ 方法返回一个 `ResultSet` 类型的对象，你可以用它逐行遍历结果。\n\n```\nResultSet rs = stat.executeQuery(\"\
  SELECT * FROM Books\");\n```\n\n分析结果集的基本循环如下：\n\n```\nwhile (rs.next()) {\n    //\
  \ 查看结果集的一行\n}\n```\n\n`ResultSet` 的迭代协议与 `java.util.Iterator` 接口细有不同。在这里，迭代器初始化在第一行*之前*。你必须调用\
  \ `next` 方法移动到第一行。此外，它没有 `hasNext` 方法；一直调用 `next` 直到返回 `false`。\n\n结果集的行顺序是随机的。除非你专门使用\
  \ `ORDER BY` 子句对结果进行排序，否则你不应赋予行顺序任何意义。\n\n在检查单独行时，你会知道字段的内容。大量的访问器方法提供了这些信息。\n\n\
  ```\nString isbn = rs.getString(1);\ndouble price = rs.getDouble(\"Price\");\n```\n\
  \n有各种类型的访问器，如 `getString` 和 `getDouble`。每个访问器有两种形式，一个接受数字参数，另一个接受字符串参数。当你提供数字参数时，你通过该数字引用列。例如，`rs.getString(1)`\
  \ 返回当前行第一列的值。\n\n与数组索引不同，数据库列号从 1 开始。\n\n当你提供字符串参数时，你通过该名称引用结果中的列。例如，`rs.getDouble(\"\
  Price\")` 返回标签为 `Price` 列的值。使用数字参数效率稍高，但字符串参数使代码更易读、易维护。\n\n当方法的类型与列类型不匹配时，每个 `get`\
  \ 方法都会进行合理的类型转换。例如，调用 `rs.getString(\"Price\")`会将 `Price` 列的浮点值转换为字符串。\n\n`java.sql.Connection`1.1\n\
  \n- `Statement createStatement()`\n  创建一个 `Statement` 对象，可用于执行无参数的 SQL 查询和更新。\n\
  - `void close()`\n  立即关闭当前连接以及它创建的所有 JDBC 资源。\n\n`java.sql.Statement`1.1\n\n- `ResultSet\
  \ executeQuery(String sqlQuery)`\n  执行字符串中给出的 SQL 语句并返回一个 `ResultSet` 对象以查看查询结果。\n\
  - `int executeUpdate(String sqlStatement)`\n\n\n\n\n\n* `long executeLargeUpdate(String\
  \ sqlStatement)`8\n  执行字符串指定的 SQL `INSERT`、`UPDATE` 或 `DELETE` 语句。也执行数据定义语言（DDL）语句，例如\
  \ `CREATE TABLE`。返回受影响的行数，对于没有更新计数的语句返回 `0`。\n\n* `boolean execute(String sqlStatement)`\n\
  \  执行字符串指定的 SQL 语句。可能会产生多个结果集和更新计数。如果第一个结果是结果集，则返回 `true`；如果结果是更新计数，则返回 `false`。调用\
  \ `getResultSet` 或 `getUpdateCount` 来获取第一个结果。有关处理多个结果细节，请参见相关说明。\n\n* `ResultSet\
  \ getResultSet()`\n  返回上一个查询语句的结果集，如果上一个语句没有结果集，则返回 `null`。每个执行的语句仅调用一次此方法。\n\n\
  * `int getUpdateCount()`\n\n* `long getLargeUpdateCount()`8\n  返回上一个更新语句受影响的行数，如果上一个语句是不带更新计数的语句，则返回\
  \ `-1`。每个执行的语句仅调用一次此方法。\n\n* `void close()`\n  关闭此语句对象及其关联的结果集。\n\n* `boolean isClosed()`6\n\
  \  如果此语句已关闭，则返回 `true`。\n\n* `void closeOnCompletion()`7\n  当其所有的结果集都关闭后，导致此语句关闭。\n\
  \njava.sql.ResultSet1.1\n\n* `boolean next()`\n  使结果集中的当前行向前移动一行。在最后一行之后返回 `false`。注意，你必须调用此方法移动到第一行。\n\
  \n* `Xxx` `getXxx(int columnNumber)`\n\n* `Xxx` `getXxx(String columnLabel)`\n \
  \ (`Xxx` 是如 `int`、`double`、`String`、`Date` 等类型)\n\n* `<T> T getObject(int columnIndex,\
  \ Class<T> type)`7\n\n* `<T> T getObject(String columnLabel, Class<T> type)`7\n\n\
  * `void updateObject(int columnIndex, Object x, SQLType targetSqlType)`8\n\n* `void\
  \ updateObject(String columnLabel, Object x, SQLType targetSqlType)`8\n  返回或更新给定列索引或标签列的值，并将其转换为指定的类型。列标签是\
  \ SQL `AS` 子句中指定的标签，如果未使用 `AS`，则使用列名。\n\n* `int findColumn(String columnName)`\n\
  \  给出与列名关联的列索引。\n\n* `void close()`\n  立即关闭当前的结果集。\n\n* `boolean isClosed()`6\n\
  \  如果此语句已关闭，则返回 `true`。\n\n### 5.4.2. 管理连接、语句和结果集\n\n每个 `Connection` 对象都可以创建一个或多个\
  \ `Statement` 对象。你可以对同一个 `Statement` 对象执行多个互不相关的命令和查询。然而，一个语句最多有一个打开的结果集。如果你并发发布了多个需要分析其结果的查询，则需要多个\
  \ `Statement` 对象。\n\n但请预先，每个连接的语句数量是有限制的。使用 `DatabaseMetaData` 接口的 `getMaxStatements`\
  \ 方法可以查找你的 JDBC 驱动支持的并发打开语句的数量。\n\n在实践中，你可能不需要纠结于多个并发的结果集。如果结果集是相关的，你应该能够发布一个组合查询并分析单个结果。让数据库合并查询比让\
  \ Java 程序遍历多个结果集要高效得多。\n\n在对 `Statement` 对象发布新的查询或更新之前，务必已完成对任何结果集的处理。先前的查询结果集会自动关闭。\n\
  \n当你完成使用 `ResultSet`、`Statement` 或 `Connection` 时，立即调用 `close` 方法是一个好习惯。这些对象使用了大型数据结构，消耗数据库服务器的有限资源。\n\
  \n`Statement` 对象的 `close` 方法会关闭任何关联的结果集。同样，`Connection` 类的 `close` 方法会关闭该连接的所有语句。\n\
  \n相反，你可以在 `Statement` 上调用 `closeOnCompletion` 方法，一旦其所有的结果集都已关闭，它就会自动关闭。\n\n如果你的连接是短寿命的，不必担心关闭语句和结果集。为了确保连接对象不可能保持打开，请使用\
  \ `try`-with-resources 语句：\n\n```java\ntry (Connection conn = . . .) {\n    Statement\
  \ stat = conn.createStatement();\n    ResultSet result = stat.executeQuery(queryString);\n\
  \    process query result\n}\n```\n\n### 5.4.3. 分析 SQL 异常\n\n每个 `SQLException` 都有一个\
  \ `SQLException` 对象链，可以通过 `getNextException` 方法获取。此异常链是每个异常都拥有的 `Throwable` 对象“原因”链之外的。（详情参见\
  \ 第一卷第 7 章 中的 Java 异常。）人们需要两个嵌套循环才能完全枚举所有这些异常。幸运的是，`SQLException` 类已增强实现了 `Iterable<Throwable>`\
  \ 接口。`iterator()` 方法产生一个 `Iterator<Throwable>`，它可以遍历这两个链：它首先遍历第一个 `SQLException`\
  \ 的原因链，然后移动到下一个 `SQLException`，依此类推。你可以简单地使用增强 `for` 循环：\n\n```java\nfor (Throwable\
  \ t : sqlException) {\n    do something with t\n}\n```\n\n你可以在 `SQLException` 上调用\
  \ `getSQLState` 和 `getErrorCode` 来进一步分析它。第一个方法产生一个由你的驱动标准化的字符串。错误代码是特定的。\n\nSQL\
  \ 异常被组织成继承树（见图 5.5）。此外，数据库驱动可以将非致命条件报告为警告。你可以从连接、语句和结果集中检索警告。与 SQL 异常类似，警告是链式的。要检索所有警告，使用以下循环：\n\
  \n```java\nSQLWarning w = stat.getWarning();\nwhile (w != null) {\n    do something\
  \ with w\n    w = w.nextWarning();\n}\n```\n\n`SQLWarning` 的子类 `DataTruncation`\
  \ 用于从数据库读取的数据被意外截断。如果在更新语句中发生数据截断，则抛出 `DataTruncation` 异常。\n\njava.sql.SQLException1.1\n\
  \n* `SQLException getNextException()`\n  获取链在此异常之后的下一个 SQL 异常，链末尾则返回 `null`。\n\n\
  * `Iterator<Throwable> iterator()`6\n  产生一个产生 SQL 异常及其原因的迭代器。\n\n* `String getSQLState()`\n\
  \  获取“SQL 状态”—一个标准的错误代码。\n\n* `int getErrorCode()`\n  获取厂商特定的错误代码。\n\njava.sql.SQLWarning1.1\n\
  \n* `SQLWarning getNextWarning()`\n  返回链在此警告之后的下一个警告，链末尾则返回 `null`。\n\njava.sql.Connection1.1java.sql.Statement1.1java.sql.ResultSet1.1\n\
  \n* `SQLWarning getWarnings()`\n  返回第一个等待的警告，如果没有等待的警告则返回 `null`。\n\njava.sql.DataTruncation1.1\n\
  \n* `boolean getParameter()`\n  如果数据截断适用于参数，则返回 `true`；如果适用于列，则返回 `false`。\n\n*\
  \ `int getIndex()`\n  返回被截断参数或列的索引。\n\n* `int getDataSize()`\n  返回应该传输的字节数，如果未知则返回\
  \ `-1`。\n\n* `int getTransferSize()`\n  返回实际传输的字节数，如果未知则返回 `-1`。\n\n\n\n\n\n###\
  \ 5.4.4. 填充数据库\n\n我们现在准备好编写第一个真正的 JDBC 程序了。当然，如果能尝试一下之前讨论过的一些花哨查询就很好，但我们面临一个问题：目前数据库中没有数据。我们需要填充数据库，一种简单的方法是使用一组\
  \ SQL 指令来创建表并在其中插入数据。大多数数据库程序可以处理来自文本文件的组 SQL 指令，但在语句终止符和其他语法问题上存在一些讨厌人的差异。\n\n\
  因此，我们将使用一个简单的程序，读取一个包含 SQL 指令的文件（每行一条指令）并执行它们。\n\n具体来说，程序从如下格式的文本文件中读取数据：\n\n```\n\
  CREATE TABLE Publishers (Publisher_Id VARCHAR(6), Name VARCHAR(30), URL VARCHAR(80));\n\
  INSERT INTO Publishers VALUES ('0201', 'Addison-Wesley', 'www.aw-bc.com');\nINSERT\
  \ INTO Publishers VALUES ('0471', 'John Wiley & Sons', 'www.wiley.com');\n. . .\n\
  ```\n\n`Listing 5.2` 包含了读取 SQL 语句文件并执行它们的程序代码。你不需要阅读代码；只需使用该程序即可填充你的数据库，并运行本章剩余部分的示例。\n\
  \n确保你的数据库服务器正在运行，并如下如下运行程序：\n\n```\njava -classpath driverJarPath:. v2ch05.exec.ExecSQL\
  \ v2ch05/Books.sql\njava -classpath driverJarPath:. v2ch05.exec.ExecSQL v2ch05/Authors.sql\n\
  java -classpath driverJarPath:. v2ch05.exec.ExecSQL v2ch05/Publishers.sql\njava\
  \ -classpath driverJarPath:. v2ch05.exec.ExecSQL v2ch05/BooksAuthors.sql\n```\n\n\
  在运行程序之前，检查 `database.properties` 文件是否已为你的环境正确配置（见第 5.3.4 节）。\n\n你的数据库可能还有一个处理 SQL\
  \ 文件的工具。例如，使用 Derby，你可以运行：\n\n```\njava -jar derby/lib/derbyrun.jar ij -p ij.properties\
  \ v2ch05/Books.sql\n```\n\n（`ij.properties` 文件在第 5.3.3 节中有描述。）\n\n在 `ExecSQL` 命令的数据格式中，我们允许在每行末尾带一个可选的分号，因为大多数数据库工具都期望这种格式。\n\
  \n以下步骤简要描述了 `ExecSQL` 程序：\n\n1. 连接到数据库。`getConnection` 方法读取 `database.properties`\
  \ 文件中的属性，并将 `jdbc.drivers` 属性添加到系统属性中。驱动管理器使用 `jdbc.drivers` 属性加载适当的数据库驱动程序。`getConnection`\
  \ 方法使用 `jdbc.url`、`jdbc.username` 和 `jdbc.password` 属性打开数据库连接。\n2. 打开带有 SQL 语句的文件。如果没有提供文件名，则提示用户在控制台上输入这些语句。\n\
  3. 使用通用的 `execute` 方法执行每条语句。如果它返回 `true`，则说明该语句有一个结果集。为书籍数据库提供的四个 SQL 文件都以 `SELECT\
  \ *` 语句结尾，这样你就可以看到数据成功插入。\n4. 如果存在结果集，则打印出结果。由于这是一个通用的结果集，我们需要使用元数据（metadata）来查找结果有多少列。欲需更多信息，请参阅第\
  \ 5.8 节。\n5. 如果发生任何 SQL 异常，打印该异常以及其中可能包含的任何链式异常。\n6. 关闭数据库连接。\n\n`Listing 5.2` 显示了程序的代码。\n\
  \nListing 5.2 v2ch05/exec/ExecSQL.java\n\n```java\npackage v2ch05.exec;\n\nimport\
  \ module java.base;\nimport module java.sql;\n\n/**\n * 执行文件或控制台中的所有 SQL 语句。\n */\n\
  public class ExecSQL {\n    void main(String[] args) throws Exception {\n      \
  \  try (Scanner in = args.length == 0 ? new Scanner(System.in)\n               \
  \ : new Scanner(Path.of(args[0]));\n            Connection conn = getConnection())\
  \ {\n\n            Statement stat = conn.createStatement();\n            while (true)\
  \ {\n                if (args.length == 0) IO.println(\"Enter command or EXIT to\
  \ exit:\");\n\n                if (!in.hasNextLine()) return;\n\n              \
  \  String line = in.nextLine().strip();\n                if (line.equalsIgnoreCase(\"\
  EXIT\")) return;\n                if (line.endsWith(\";\")) // remove trailing semicolon\n\
  \                    line = line.substring(0, line.length() - 1);\n            \
  \    try {\n                    boolean isResult = stat.execute(line);\n       \
  \             if (isResult) {\n                        try (ResultSet rs = stat.getResultSet())\
  \ {\n                            showResultSet(rs);\n                        }\n\
  \                    } else {\n                        int updateCount = stat.getUpdateCount();\n\
  \                        IO.println(updateCount + \" rows updated\");\n        \
  \            }\n                }\n                catch (SQLException e) {\n  \
  \                  for (Throwable t : e)\n                        t.printStackTrace();\n\
  \                }\n            }\n        }\n        catch (SQLException e) {\n\
  \            for (Throwable t : e)\n                t.printStackTrace();\n     \
  \   }\n    }\n\n    /**\n     * 从 database.properties 文件指定的属性中获取连接\n     * @return\
  \ 数据库连接\n     */\n    public static Connection getConnection() throws SQLException\
  \ {\n        var props = new Properties();\n        try (Reader in = Files.newBufferedReader(\n\
  \                Path.of(\"v2ch05\", \"database.properties\"))) {\n            props.load(in);\n\
  \        }\n        String drivers = props.getProperty(\"jdbc.drivers\");\n    \
  \    if (drivers != null) System.setProperty(\"jdbc.drivers\", drivers);\n\n   \
  \     String url = props.getProperty(\"jdbc.url\");\n        String username = props.getProperty(\"\
  jdbc.username\");\n        String password = props.getProperty(\"jdbc.password\"\
  );\n\n        return DriverManager.getConnection(url, username, password);\n   \
  \ }\n\n    /**\n     * 打印结果集。\n     * @param result 要打印的结果集\n     */\n    void showResultSet(ResultSet\
  \ result) throws SQLException {\n        ResultSetMetaData metaData = result.getMetaData();\n\
  \        int columnCount = metaData.getColumnCount();\n\n        for (int i = 1;\
  \ i <= columnCount; i++) {\n            if (i > 1) IO.print(\", \");\n         \
  \   IO.print(metaData.getColumnLabel(i));\n        }\n        IO.println();\n\n\
  \        while (result.next()) {\n            for (int i = 1; i <= columnCount;\
  \ i++) {\n                if (i > 1) IO.print(\", \");\n                IO.print(result.getString(i));\n\
  \            }\n            IO.println();\n        }\n    }\n}\n```\n\n## 5.5. 查询执行\n\
  \n在本节中，我们编写一个针对 `COREJAVA` 数据库执行查询的程序。为了让此程序运行，你必须按照前面的节所描述填充 `COREJAVA` 数据库。\n\n\
  在查询数据库时，你可以选择作者和出版社，或者将其中任何一个留为 `Any`。\n\n你还可以更改数据库中的数据。选择一个出版社并输入金额。该出版社的所有价格将根据你输入的金额进行调整，程序将显示更新了多少行。更改价格后，你可能想运行查询来验证新价格。\n\
  \n### 5.5.1. 预编译语句\n\n在本程序中，我们使用了一个新特性，*预编译语句（prepared statements).*考虑针对特定出版社（不考虑作者）的所有书籍\
  \ SQL 查询：\n\n```sql\nSELECT Books.Price, Books.Title\nFROM Books, Publishers\nWHERE\
  \ Books.Publisher_Id = Publishers.Publisher_Id\nAND Publishers.Name = 列表框中的名称\n\
  ```\n\n\n\n\n\n与其在用户每次启动此类查询时都构建一个独立的查询语句，我们可以 `prepare` 一个带有主机变量的查询，并多次使用它，每次为该变量填充不同的字符串。这种技术可以提高性能。每当数据库执行查询时，它首先会计算如何高效执行的策略。通过预处理查询并重用它，你可以确保规划步骤只执行一次。\n\
  \n预处理查询中的每个主机变量都用 `?` 表示。如果有多个变量，在设置值时你必须跟踪 `?` 的位置。例如，我们的预处理查询变为：\n\n```\nString\
  \ publisherQuery = \"\"\"\nSELECT Books.Price, Books.Title\nFROM Books, Publishers\n\
  WHERE Books.Publisher_Id = Publishers.Publisher_Id AND Publishers.Name = ?\n\"\"\
  \";\nPreparedStatement pstat = conn.prepareStatement(publisherQuery);\n```\n\n在执行预编译语句之前，你必须使用\
  \ `set` 方法将主机变量绑定到实际值。类似于 `ResultSet` 接口的 `get` 方法，不同类型有不同的 `set` 方法。在这里，我们想要为出版商名称设置字符串：\n\
  \n```\npstat.setString(1, publisher);\n```\n\n第一个参数是我们要设置的主机变量的位置号。位置 `1` 表示第一个\
  \ `?`。第二个参数是我们要赋值给主机变量的值。\n\n如果你重用一个已经执行过的预处理查询，所有的主机变量将保持绑定状态，除非你通过 `set` 方法更改它们或调用\
  \ `clearParameters` 方法。这意味着你只需要对那些在连续查询之间发生变化的主机变量调用 `setXxx` 方法。\n\n一旦所有变量都绑定了值，你就可以执行预编译语句：\n\
  \n```\nResultSet rs = pstat.executeQuery();\n```\n\n通过拼接字符串来手动构建查询是枯燥且具有潜在危险的。你必须担心引号等特殊字符——而且，如果你的查询涉及用户输入，你必须防范注入攻击。因此，只要查询涉及变量，请务必使用预编译语句。\n\
  \n价格更新功能是通过 `UPDATE` 语句实现的。请注意我们调用的是 `executeUpdate` 而不是 `executeQuery`，因为 `UPDATE`\
  \ 语句不返回结果集。`executeUpdate` 的返回值是受影响行的数。\n\n```\nint r = stat.executeUpdate();\n\
  IO.println(r + \" rows updated\");\n```\n\n在关联的 `Connection` 对象关闭后，`PreparedStatement`\
  \ 对象将失效。然而，许多数据库会自动 `cache` 预编译语句。如果对同一个查询进行了两次处理，数据库将简单地重用查询策略。因此，不必担心调用 `prepareStatement`\
  \ 的开销。\n\n以下列表简要描述了示例程序的结构：\n\n- 作者和出版商数组通过运行两个查询来填充，这两个查询返回数据库中所有的作者和出版商名称。\n-\
  \ 涉及作者的查询是复杂的。一本书可能有多个作者，因此 `BooksAuthors` 表存储了作者与书籍之间的对应关系。例如，ISBN 为 `0-201-96426-0`\
  \ 的书籍有两个代码为 `DATE` 和 `DARW` 的作者。`BooksAuthors` 表有以下行：\n\n```\n0-201-96426-0, DATE,\
  \ 1\n0-201-96426-0, DARW, 2\n```\n\n以此指示这一事实。第三列列出了作者的顺序。（我们不能直接使用表中的行位置。关系型表中没有固定的行顺序。）因此，查询必须连接\
  \ `Books`、`BooksAuthors` 和 `Authors` 表，以便将作者名称与用户选择的名称进行比较。\n\n```\nSELECT Books.Price,\
  \ Books.Title FROM Books, BooksAuthors, Authors, Publishers\nWHERE Authors.Author_Id\
  \ = BooksAuthors.Author_Id AND BooksAuthors.ISBN = Books.ISBN\nAND Books.Publisher_Id\
  \ = Publishers.Publisher_Id AND Authors.Name = ?\nAND Publishers.Name = ?\n```\n\
  \n一些 Java 程序员会避免像这样复杂的 SQL 语句。一种出人意料但非常低的变通方法是编写大量的 Java 代码来遍历多个结果集。但数据库执行查询代码的能力远比\
  \ Java 程序强——这是数据库的核心竞争力。经验法则是：如果你可以在 SQL 中完成，就不要在 Java 中完成。\n\n- `changePrices`\
  \ 方法执行一个 `UPDATE` 语句。注意 `UPDATE` 语句的 `WHERE` 子句需要出版商代码，而我们只知道出版商名称。这个问题通过嵌套子查询得以解决：\n\
  \n```\nUPDATE Books\nSET Price = Price + ?\nWHERE Books.Publisher_Id = (SELECT Publisher_Id\
  \ FROM Publishers WHERE Name = ?)\n```\n\nListing 5.3 是完整的程序代码。\n\nListing 5.3 v2ch05/query/QueryDemo.java\n\
  \n\n\n\n\n```java\npackage v2ch05.query;\n\nimport module java.base;\nimport module\
  \ java.sql;\nimport v2ch05.exec.ExecSQL;\n\n/**\n * 此程序演示了几个复杂的数据库查询。\n */\nclass\
  \ QueryDemo {\n    String allQuery = \"SELECT Books.Price, Books.Title FROM Books\"\
  ;\n\n    String authorPublisherQuery = \"\"\"\nSELECT Books.Price, Books.Title\n\
  FROM Books, BooksAuthors, Authors, Publishers\nWHERE Authors.Author_Id = BooksAuthors.Author_Id\n\
  \    AND BooksAuthors.ISBN = Books.ISBN\n    AND Books.Publisher_Id = Publishers.Publisher_Id\n\
  \    AND Authors.Name = ?\n    AND Publishers.Name = ?\n\"\"\";\n\n    String authorQuery\
  \ = \"\"\"\nSELECT Books.Price, Books.Title FROM Books, BooksAuthors, Authors\n\
  WHERE Authors.Author_Id = BooksAuthors.Author_Id\"\n    AND BooksAuthors.ISBN =\
  \ Books.ISBN\"\n    AND Authors.Name = ?\n\"\"\";\n\n    String publisherQuery =\
  \ \"\"\"\nSELECT Books.Price, Books.Title FROM Books, Publishers\nWHERE Books.Publisher_Id\
  \ = Publishers.Publisher_Id\n    AND Publishers.Name = ?\n\"\"\";\n\n    String\
  \ priceUpdate = \"\"\"\nUPDATE Books SET Price = Price + ? \"\nWHERE Books.Publisher_Id\
  \ =\n    (SELECT Publisher_Id FROM Publishers WHERE Name = ?)\n\"\"\";\n\n    ArrayList<String>\
  \ authors = new ArrayList<>();\n    ArrayList<String> publishers = new ArrayList<>();\n\
  \n    void main() throws Exception {\n        try (Connection conn = ExecSQL.getConnection())\
  \ {\n            authors.add(\"Any\");\n            publishers.add(\"Any\");\n \
  \           try (Statement stat = conn.createStatement()) {\n                //\
  \ 填充 authors 列表\n                String query = \"SELECT Name FROM Authors\";\n\
  \                try (ResultSet rs = stat.executeQuery(query)) {\n             \
  \       while (rs.next())\n                        authors.add(rs.getString(1));\n\
  \                }\n\n                // 填充 publishers 列表\n                query\
  \ = \"SELECT Name FROM Publishers\";\n                try (ResultSet rs = stat.executeQuery(query))\
  \ {\n                    while (rs.next())\n                        publishers.add(rs.getString(1));\n\
  \                }\n            }\n            boolean done = false;\n         \
  \   while (!done) {\n                String input = IO.readln(\"Q)uery C)hange prices\
  \ E)xit: \").toUpperCase();\n                if (input.equals(\"Q\"))\n        \
  \            executeQuery(conn);\n                else if (input.equals(\"C\"))\n\
  \                    changePrices(conn);\n                else\n               \
  \     done = true;\n            }\n        }\n        catch (SQLException e) {\n\
  \            for (Throwable t : e)\n                IO.println(t.getMessage());\n\
  \        }\n    }\n\n    /**\n     * 执行选定的查询。\n     * @param conn 数据库连接\n     */\n\
  \    void executeQuery(Connection conn) throws SQLException {\n        String author\
  \ = select(\"Authors:\", authors);\n        String publisher = select(\"Publishers:\"\
  , publishers);\n        PreparedStatement stat;\n        if (!author.equals(\"Any\"\
  ) && !publisher.equals(\"Any\")) {\n            stat = conn.prepareStatement(authorPublisherQuery);\n\
  \            stat.setString(1, author);\n            stat.setString(2, publisher);\n\
  \        }\n        else if (!author.equals(\"Any\") && publisher.equals(\"Any\"\
  )) {\n            stat = conn.prepareStatement(authorQuery);\n            stat.setString(1,\
  \ author);\n        }\n        else if (author.equals(\"Any\") && !publisher.equals(\"\
  Any\")) {\n            stat = conn.prepareStatement(publisherQuery);\n         \
  \   stat.setString(1, publisher);\n        }\n        else\n            stat = conn.prepareStatement(allQuery);\n\
  \n        try (ResultSet rs = stat.executeQuery()) {\n            while (rs.next())\n\
  \                IO.println(rs.getString(1) + \", \" + rs.getString(2));\n     \
  \   }\n    }\n\n    /**\n     * 执行更新语句以更改价格。\n     * @param conn 数据库连接\n     */\n\
  \    void changePrices(Connection conn) throws SQLException {\n        String publisher\
  \ = select(\"Publishers:\", publishers.subList(1, publishers.size()));\n       \
  \ double priceChange = Double.parseDouble(IO.readln(\"Change prices by: \"));\n\
  \        PreparedStatement stat = conn.prepareStatement(priceUpdate);\n        stat.setDouble(1,\
  \ priceChange);\n        stat.setString(2, publisher);\n        int r = stat.executeUpdate();\n\
  \        IO.println(r + \" records updated.\");\n    }\n\n    /**\n     * 询问用户选择一个字符串。\n\
  \     * @param prompt 要显示的提示信息\n     * @param options 用户可以选择的选项\n     * @return\
  \ 用户选择的选项\n     */\n    String select(String prompt, List<String> options) {\n \
  \       while (true) {\n            IO.println(prompt);\n            for (int i\
  \ = 0; i < options.size(); i++)\n                IO.println(\"%2d) %s\".formatted(i\
  \ + 1, options.get(i)));\n            int sel = Integer.parseInt(IO.readln());\n\
  \            if (sel > 0 && sel <= options.size()) return options.get(sel - 1);\n\
  \        }\n    }\n}\n```\n\n`java.sql.Connection1.1`\n\n* `PreparedStatement prepareStatement(String\
