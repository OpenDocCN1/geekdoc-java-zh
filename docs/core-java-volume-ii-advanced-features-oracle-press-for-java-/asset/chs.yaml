  \ source, Object[] objects)` 构建一个树。\n\n## 12.5 高级 AWT\n\n原始 JDK 1.0 有一种简单的绘制机制。选择颜色和绘制，调用\
  \ `Graphics` 的方法如 `drawRect` 或 `fillOval`。Java 2D API 支持更多选项。\n\n### 12.5.1 渲染流水线\n\
  \nJava 2D API 是一个可以使用的复杂库。你可以轻松产生各种*形状*。\n\n你可以控制*笔触*——绘制边界的笔。\n\n你可以用实色、变化的色调或重复模式*填充*形状。\n\
  \n你可以使用*变换*来移动、缩放、旋转或拉伸形状。\n\n你可以将形状*裁剪*到任意区域。\n\n要绘制形状，请遵循以下步骤：\n\n1.  获取 `Graphics2D`\
  \ 类的对象。该类是 `Graphics` 类的子类。从 Java 1.2 开始，`paint` 和 `paintComponent` 等方法会自动接收 `Graphics2D`\
  \ 类的对象。只需进行如下类型转换：\n\n    ```\n    public void paintComponent(Graphics g) {\n  \
  \      var g2 = (Graphics2D) g;\n        . . .\n    }\n    ```\n\n2.  使用 `setRenderingHints`\
  \ 方法设置*渲染提示*——速度与绘制质量之间的权衡。\n\n    ```\n    RenderingHints hints = . . .;\n    g2.setRenderingHints(hints);\n\
  \    ```\n\n3.  使用 `setStroke` 方法设置*笔触*。笔触绘制形状的轮廓。你可以选择厚度并在实线和虚线之间切换。\n\n    ```\n\
  \    Stroke stroke = . . .;\n    g2.setStroke(stroke);\n    ```\n\n4.  使用 `setPaint`\
  \ 方法设置*漆料*。漆料填充区域，如笔触或形状的内部。你可以创建实色漆料、渐变色调漆料或平铺填充模式。\n\n    ```\n    Paint paint\
  \ = . . .\n    g2.setPaint(paint);\n    ```\n\n5.  使用 `clip` 方法设置*裁剪区域*。\n\n   \
  \ ```\n    Shape clip = . . .;\n    g2.clip(clip);\n    ```\n\n\n\n\n\n6. 使用 `transform`\
  \ 方法设置从用户空间到设备空间的 `transformation`（变换）。如果你觉得在自定义坐标系中定义形状比使用像素坐标更方便，请使用使用变换。\n\n\
  ```\nAffineTransform transform = . . .;\ng2.transform(transform);\n```\n\n7. 使用\
  \ `setComposite` 方法设置一个 `composition rule`（组合规则），描述如何将新像素与现有像素结合。\n\n```\nComposite\
  \ composite = . . .;\ng2.setComposite(composite);\n```\n\n8. 创建一个形状（shape）。Java\
  \ 2D API 提供了许多形状对象以及组合形状的方法。\n\n```\nShape shape = . . .;\n```\n\n9. 绘制或填充形状。如果你绘制形状，则其轮廓会被描边；如果你填充形状，则其内部会被涂色。\n\
  \n```\ng2.draw(shape);\ng2.fill(shape);\n```\n\n当然，在许多实际情况下，你并不需要所有这些步骤。2D 图形上下文的设置有合理的默认值；只有当你想要偏离默认值时，才去更改设置。\n\
  \n在接下来的章节中，你将看到如何描述形状、描边、画笔、变换和组合规则。\n\n各种 `set` 方法只是设置了 2D 图形上下文的状态。它们不会导致任何绘制。同样，当你构造\
  \ `Shape` 对象时，不会发生绘制操作。只有当你调用 `draw` 或 `fill` 时，形状才会被渲染。此时，新的形状会在 `rendering pipeline`（渲染流水线）中计算（参见图\
  \ 12.31）。\n\n.图 12.31：渲染流水线\n\n在渲染流水线，渲染形状执行以下步骤：\n\n1. 对形状的路径进行描边。\n2. 对形状进行变换。\n\
  3. 对形状进行裁剪。如果形状与裁剪区域没有交集，则处理停止。\n4. 填充裁剪后形状的剩余部分。\n5. 将填充后的像素与现有像素进行组合。（在图 12.31\
  \ 中，圆是现有像素的一部分，杯形叠加在其之上。）\n\n在下一节中，你将看到如何定义形状。然后，我们将转向 2D 图形上下文设置。\n\n`java.awt.Graphics2D`\
  \ 1.2\n\n* `void draw(Shape s)`\n  用当前画笔绘制给定形状的轮廓。\n* `void fill(Shape s)`\n  用当前画笔填充给定形状的内部。\n\
  \n### 12.5.2. `Shape` 类层次结构\n\n这里是 `Graphics` 类中用于绘制形状的一些方法：\n\n```\ndrawLine\n\
  drawRectangle\ndrawRoundRect\ndraw3DRect\ndrawPolygon\ndrawPolyline\ndrawOval\n\
  drawArc\n```\n\n还有对应的 `fill` 方法。这些方法从 JDK 1.0 以来一直存在于 `Graphics` 类中。Java 2D API\
  \ 使用了一种完全不同的面向对象的方法。它不是方法，而是类：\n\n```\nLine2D\nRectangle2D\nRoundRectangle2D\nEllipse2D\n\
  Arc2D\nQuadCurve2D\nCubicCurve2D\nGeneralPath\n```\n\n这些类都实现了 `Shape` 接口，我们将在接下来的章节中检查它。\n\
  \n`Line2D`、`Rectangle2D`、`RoundRectangle2D`、`Ellipse2D` 和 `Arc2D` 类分别对应 `drawLine`、`drawRectangle`、`drawRoundRect`、`drawOval`\
  \ 和 `drawArc` 方法。（“3D 矩形”的概念已经了它得有的终结——没有对应 `draw3DRect` 方法的方法。）Java 2D API 还提供了两个额外的类——二次曲线和三次曲线，我们将在本节中讨论。没有\
  \ `Polygon2D` 类；相反，`GeneralPath` 类描述了由直线、二次和三次曲线组成的路径。你可以使用 `GeneralPath` 来描述多边形；我们将在本节稍后向你展示。\n\
  \n要绘制形状，首先创建一个实现 `Shape` 接口的类的对象，然后调用 `Graphics2D` 类的 `draw` 方法。\n\n这些类\n\n```\n\
  Rectangle2D\nRoundRectangle2D\nEllipse2D\nArc2D\n```\n\n都继承自一个公共父类 `RectangularShape`。诚然，椭圆和弧不是矩形，但它们有一个\
  \ `bounding rectangle`（包围矩形）（参见图 12.32）。\n\n.图 12.32：椭圆和弧的包围矩形\n\n每个名称以“2D”结尾的类都有两个子类，用于指定\
  \ `float` 或 `double` 数量的坐标。在第一卷中，你已经遇到过 `Rectangle2D.Float` 和 `Rectangle2D.Double`。\n\
  \n其他类也使用相同的方案，例如 `Arc2D.Float` 和 `Arc2D.Double`。\n\n在内部，所有的图形类都使用 `float` 坐标，因为\
  \ `float` 使用的存储空间较少，但对于几何计算具有足够的精度。然而，Java 编程语言处理 `float` 数字变得稍微繁琐。因此，图形类的大多数方法使用\
  \ `double` 参数和返回值。只有在构造 2D 对象时，你才需要在 `float` 和 `double` 坐标的构造函数之间选择。例如，\n\n```\n\
  var floatRect = new Rectangle2D.Float(5F, 10F, 7.5F, 15F);\nvar doubleRect = new\
  \ Rectangle2D.Double(5, 10, 7.5, 15);\n```\n\n`Xxx2D.Float` 和 `Xxx2D.Double` 类是\
  \ `Xxx2D` 类的子类。在对象构造后，记住子类几乎没有任何用处，你可以像上面的代码示例那样，将构造的对象存储在父类变量中。\n\n从这些奇怪的名字中你可以看出，`Xxx2D.Float`\
  \ 和 `Xxx2D.Double` 类也是 `Xxx2D` 类的内部类。这仅仅是为了语法上的便利，以避免外层类名称的膨胀。\n\n最后，`Point2D` 类描述了一个具有\
  \ `x` 和 `y` 坐标的点。点用于定义形状，但它们本身不是形状。\n\n图 12.33 显示了形状类之间的关系。然而，省略了 `Double` 和 `Float`\
  \ 子类。 2D 之前的遗留类用灰色填充标记。\n\n.图 12.33：形状类之间的关系\n\n### 12.5.3. 构造形状\n\n你已经已经在第 10 章\
  \ 中看过了如何使用 `Rectangle2D`、`Ellipse2D` 和 `Line2D` 类。在本节中，你将学习如何处理剩余的 2D 形状。\n\n对于\
  \ `RoundRectangle2D` 形状，指定左上角、宽度、高度以及应该圆角的角区域的 `x` 和 `y` 尺寸（参见图 12.34）。例如，调用\n\n\
  ```\nvar r = new Rectangle2D.Double(150, 200, 100, 50, 20, 20);\n```\n\n产生产生一个四个角半径为\
  \ 20 的圆的圆矩形。\n\n.图 12.34：构造 `RoundRectangle2D`\n\n要构造一个弧，指定包围框、起始角度、弧扫过的角度（参见图 12.35;\n\
  ```\n\n.图 12.35：构造椭圆弧\n\n图 12.36 说明了弧的类型。\n\n.图 12.36：弧类型\n\n如果弧是椭形的，弧角的计算一点并不简单。API\
  \ 文档指出：“角度相对于非正方形框架进行指定，使得 45 度始终落在从椭圆中心到框架右上角的直线上。结果是，如果框架在某个轴上明显长于另一个轴，则弧段起始和结束的角度将沿着框架较长的轴进一步倾斜。”不幸的是，文档没有说明如何计算这种“倾斜”。这里是细节：\n\
  \n假设弧的中心是原点且点 `(x, y)` 位于弧上。你可以使用以下公式获取倾斜角度：\n\n```\nskewedAngle = Math.toDegrees(Math.atan2(-y\
  \ * height, x * width));\n```\n\n\n\n\n结果是一个 `-180` 到 `180` 之间的值。通过这种方式计算倾斜的起始和结束角度。然后，计算这两个倾斜角度之间的差值。如果起始角度或差值为负，则给起始角度加上\
  \ `360`。最后，将起始角度和差值传递给弧构造函数。\n\n如果你运行本节末尾的程序，可以直观地检查此计算是否为弧构造函数产生了正确的值（参见图 12.39）。\n\
  \nJava 2D API 支持（`quadratic`）和（（cubic`）曲线。在本章中，我们不涉及这些曲线的数学原理。你可以通过运行列表 12.15 中的程序来直观感受它们的外观。二次曲线由两个`end\
  \ points`和一个`control point`指定（参见图 12.37）。三次曲线（图 12.38）则有两个控制点。移动控制点会改变曲线的形状。\n\n\
  图 12.37：二次曲线。图 12.38：三次曲线。\n\n要构造二次和三次曲线，请提供端点和控制点的坐标。例如：\n\n```\nvar q = new QuadCurve2D.Double(startX,\
  \ startY, controlX, controlY, endX, endY);\nvar c = new CubicCurve2D.Double(startX,\
  \ startY, control1X, control1Y,\n    control2X, control2Y, endX, endY);\n```\n\n\
  二次曲线并不灵活，在实践中并不常用。然而，三次曲线（如由 `CubicCurve2D` 类绘制的贝塞尔曲线）非常常见。通过组合许多三次曲线使连接处的斜率匹配，你可以创建复杂且平滑的曲线形状。有关更多信息，请参考\
  \ John F. Hughes 等人的著作 *Computer Graphics: Principles and Practice, Third Edition*。\n\
  \n你可以构建任意的线段、二次曲线和三次曲线序列，并将它们存储在 `GeneralPath` 对象中。使用 `moveTo` 方法指定路径的第一个坐标，例如：\n\
  \n```\nvar path = new GeneralPath();\npath.moveTo(10, 20);\n```\n\n然后你可以通过调用 `lineTo`、`quadTo`\
  \ 或 `curveTo` 方法之一来扩展路径。这些方法通过直线、二次曲线或三次曲线来扩展路径。调用 `lineTo` 时，提供端点。对于两个曲线方法，提供控制点，然后提供端点。例如：\n\
  \n```\npath.lineTo(20, 30);\npath.curveTo(control1X, control1Y, control2X, control2Y,\
  \ endX, endY);\n```\n\n调用 `closePath` 方法关闭路径。它会绘制一条返回路径起点的直线。\n\n要制作多边形，只需调用 `moveTo`\
  \ 移动到第一个顶点，然后重复调用 `lineTo` 访问其他顶点。最后，调用 `closePath` 关闭多边形。列表 12.15 中的程序更详细地展示了这一点。\n\
  \n通用路径并不非得是连接的。你可以随时调用 `moveTo` 来启动一个新的路径段。\n\n最后，你可以使用 `append` 方法向通用路径中添加任意的 `Shape`\
  \ 对象。形状的轮廓被添加到路径的末尾。`append` 方法的第二个参数如果表示新形状应连接到路径上的上一点，则为 `true`，否则为 `false`。例如，调用：\n\
  \n```\nRectangle2D r = . . .;\npath.append(r, false);\n```\n\n会将矩形的轮廓添加到路径中，但不会将其与现有路径连接。但是\n\
  \n```\npath.append(r, true);\n```\n\n会添加一条从路径端点到矩形起点的直线，然后将矩形轮廓添加到路径中。\n\n列表 12.15\
  \ 中的程序允许你创建示例路径。从组合框中选择一个形状生成器。程序包含以下形状的生成器：\n\n*   直线\n*   矩形、圆矩形和椭圆\n*   弧（除了弧本身，还显示了边界矩形的起始和结束角度的线）\n\
  *   多边形（使用 `GeneralPath`）\n*   二次和三次曲线\n\n使用鼠标调整控制点。当你移动它们时，形状会不断重绘。\n\n该程序有点复杂，因为它处理了多种形状并支持拖动控制点。\n\
  \n抽象超类 `ShapeMaker` 封装了形状生成器类的共性。每个形状都有固定数量的控制点，用户可以移动这些点。`getPointCount` 方法返回该值。抽象方法\n\
  \n```\nShape makeShape(Point2D[] points)\n```\n\n根据控制点的当前位置计算实际形状。`toString` 方法返回类名，以便\
  \ `ShapeMaker` 对象可以简单地放入 `JComboBox` 中。\n\n为了启用控制点的拖动，`ShapePanel` 类处理了鼠标和鼠标移动事件。如果在矩形上方按下鼠标，随后的鼠标拖动将移动矩形。\n\
  \n大多数形状生成器类都是简单的——它们的 `makeShape` 方法只需构造并返回请求的形状。然而，`ArcMaker` 类需要计算变形的起始和结束角度。此外，为了证明计算确实正确的，返回的形状包含弧本身、边界矩形以及从弧心到角度控制点的线（参见图\
  \ 12.39）。\n\n![Figure](img/fig07-09.jpg)\n图 12.39：`ShapeDemo` 程序\n列表 12.15 v2ch12/shape/ShapeDemo.java\n\
